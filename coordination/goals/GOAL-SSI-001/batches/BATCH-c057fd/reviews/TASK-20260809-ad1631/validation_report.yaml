        memory cannot be independently recomputed.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:96-119@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:330-346@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: finite_manifest_saturation
      status: execution_blocking_incomplete
      evidence: >-
        The builder still says to retain until S_req or the cap. It does not
        stop and classify the case S_eff=|V_p|<S_req as finite-manifest
        saturation. The separate S_eff, padding, and saturation reporting
        language therefore does not reconcile the actual stop condition,
        attempted-count charge, or full-advice control.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:46-48@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:217-220@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:330-344@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: HNF_and_scalar_physical_contract
      status: incomplete
      evidence: >-
        The sign byte, zero-sign rule, fixed scalar width, positive-pivot
        intention, and order-tag width are material repairs. HNF-RIGHT-ROW-v1
        still lacks a complete pivot/row convention, all remainder ranges,
        normalization algorithm, equivalent-basis mapping, and a mathematical
        fixed envelope for input and pulled-back output values. Output HNF byte
        serialization is not separately defined.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:221-231@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:362-367@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: common_index_probe_and_duplicate_semantics
      status: incomplete
      evidence: >-
        The occupancy, payload pointer, duplicate, failed-record, table
        capacity, and linear-probe concepts are explicit. The b_count byte
        representation and integer conversion are not fixed; the probe hash
        input hash_key||table_capacity_bytes is outside the stated framed-input
        grammar; selected-slot derivation is absent; and the exact full-record
        comparison/payload mapping for C pair records is not stated. No separate
        C-helper capacity/index schema is given.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:184-215@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:232-251@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: A_B_C_output_paths_and_axes
      status: incomplete
      evidence: >-
        A, tagged-B, and membership-B now name explicit order/path/pullback/
        saturation/output sequences, and C separates pair count S_C from helper
        count A_C. The B membership terminal source is only procedurally
        dependent on the incomplete order manifest. C has no exact pair-selection
        rule, adaptive second-slot rule, middle-factor mapping, pair-index
        capacity, or complete T_C/M_C equations. The generic b_slot is also
        reused for helper endpoint slots even though A_C is a separate axis and
        no helper capacity/slot width is defined.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:252-303@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:373-381@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: EDGE_STREAM_path_boundary_and_termination
      status: incomplete
      evidence: >-
        EDGE-STREAM-v1, overall SHA-256 binding, explicit external-input
        boundary, transition checks, direction, L_steps, and output rejection
        predicates are material repairs. The certificate artifact binding,
        edge-count greater than L_steps handling, next-step digest semantics,
        seed-to-edge/selected-slot path rule, and complete failure/restart
        classification are not specified. The stated path byte formula does not
        supply these missing semantics.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:347-381@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: FOE_counter_coverage
      status: execution_blocking_incomplete
      evidence: >-
        The primitive FOE price list is broader than the trace fields, but no
        literal event-code table or equation maps field operations, byte reads,
        byte compares, hash/SHAKE blocks, manifest compares, graph steps,
        serialization, and output encoding into total_foe. There is no builder
        or setup trace schema, no exact M_work/path-work formula, and no trace
        field for the committed edge-certificate digest. A future receipt could
        not independently recompute the claimed cost.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:154-181@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:450-479@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: hard_attempt_cap_and_break_even
      status: partially_repaired_but_not_computable
      evidence: >-
        The query cap is now hard at 32768 attempts, attempts are numbered
        0..32767, cap exhaustion is not success or negative evidence, and the
        break-even definition is the least positive integer satisfying an exact
        rational inequality. However q still lacks a specified omega/restart
        distribution and independence rule, the builder counter is u64 despite
        the cryptographic-scale cap, T_inc_foe remains an unsupplied input, and
        branch T_q/setup equations are absent. No Q_break_even can therefore be
