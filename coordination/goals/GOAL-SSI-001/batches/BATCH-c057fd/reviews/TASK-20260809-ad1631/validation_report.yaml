      references:
        - experiments/EXP-SSI-357363/specification.yaml:502-530@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - control: CTRL-SHUFFLED-FIBER
      status: incomplete
      evidence: >-
        The control now says tagged payloads regenerate for the permuted owner
