      affects: [KN-FIND-019]
      required_fix: >-
        Replace unqualified box-saturation wording with hull/MV language from
        DEC-20260722-003 limitations.
    - id: N2
      severity: nonfatal
      title: Load-bearing DEC/EV bounds omitted from some scoped_claims
      detail: >-
        KN-FIND-020 omits DEC-20260718-006 p≤2^12; KN-FIND-021 omits EV-FB-001
        "subgroup base excluded"; KN-FIND-027 scoped_claim lacks the toy /
        boolean-Semaev / n≤24 prefix present on sibling SIG drafts. Limits
        sections partially compensate, but GOAL-FIND-001 completion requires
        claim boundaries no stronger than cited EV/DEC scope in the finding
        text itself.
      affects: [KN-FIND-020, KN-FIND-021, KN-FIND-027]
      required_fix: >-
        Fold the cited parameter/exclusion bounds into each scoped_claim
        sentence (not only Limits).
    - id: N3
      severity: nonfatal
      title: KN-FIND-027 overgeneralizes D≥6 null invalidity
      detail: >-
        DEC-20260720-001 invalidates the D=6 birth-law measurement because the
        support-matched null fails C5 at n=9 D6. That justifies "cascade
        admissible only through D≤5" but not a blanket "D≥6 null baseline
        invalid" for all larger degrees/sizes untested.
      affects: [KN-FIND-027]
      required_fix: >-
        Narrow to "D=6 null baseline invalid at tested n=9; cascade claims
        admissible only for D≤5".
    - id: N4
      severity: nonfatal
      title: empirical_only drafts omit THM_BKKMV1 upgrade attached to DEC-20260722-003
      detail: >-
        DEC-20260722-003 (evidence_refs include research/THM_BKKMV1.md) states
        the sectioned box-saturation / MV law is proved at m≤5 and certified at
        m=6, upgrading H-BKK-001's scoped rejection. KN-FIND-017/002/003 all
        mark proof_status empirical_only with no theorem cross-ref. This is
        underclaim, not overclaim, but leaving it silent would make knowledge/
        ground truth weaker than the Coordinator decision already on file.
      affects: [KN-FIND-017, KN-FIND-018, KN-FIND-019]
      required_fix: >-
        Keep EV-scoped empirical claims, but add proof_refs/note pointing at
        THM_BKKMV1 + DEC-20260722-003 for the m≤5 proved barrier; do not invent
        a stronger all-m theorem (C1 remains open per DEC limitations).
    - id: N5
      severity: nonfatal
      title: Draft Key claims bodies are template-thin
      detail: >-
        Each draft's Key claims section only asserts that the DEC closed the
        EV scope. Assessment §1.1 wants knowledge/ readers to learn the closed
        barriers without re-opening the ledger. Acceptable for a draft package
        if Scoped claim is tightened (N1–N3); not sufficient as the final
        knowledge/findings body without expanding Key claims from EV/DEC text.
      affects: [KN-FIND-017, KN-FIND-018, KN-FIND-019, KN-FIND-020, KN-FIND-021,
        KN-FIND-022, KN-FIND-023, KN-FIND-024, KN-FIND-025, KN-FIND-026, KN-FIND-027]
      required_fix: >-
        Before /curate-knowledge write, expand Key claims to restate the
        scoped barrier metrics; keep Not claimed / Limits intact.
    - id: N6
