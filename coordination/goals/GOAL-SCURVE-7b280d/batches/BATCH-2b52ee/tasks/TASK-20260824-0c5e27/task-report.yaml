  # COMPLETION-GATE ITEMS
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: >-
        The parameter capsule distinguishes user intake from retrieved primary or
        authoritative sources and records provenance and unresolved conflicts.
      status: met
      where: >-
        parameter-capsule.yaml -> source_classes (S-INTAKE / S-MIRROR / S-EPRINT),
        independence_analysis, parameters[*].source + sha256, conflicts_with_intake,
        unresolved_items U1-U3, retrieval_failures_recorded.
      note: >-
        The capsule states explicitly and repeatedly that S-INTAKE and S-MIRROR are NOT
        independent for a curve SafeCurves itself introduced, so their agreement is a
        transcription check and promotes no cell.
    - item: >-
        The audit plan covers every one of the eleven criteria in the declared category,
        with a certificate or explicit bound, controls, falsifier, budget, and stopping rule.
      status: met
      where: audit-plan.yaml -> lanes
      coverage_table:
        basic_parameter_requirements: {field: L-FIELD, equation: L-EQUATION, base: L-BASE}
        ecdlp_security_requirements: {rho: L-RHO, transfer: L-TRANSFER, disc: L-DISC}
        ecc_security_beyond_ecdlp: {rigid: L-RIGID, ladder: L-LADDER, twist: L-TWIST,
          complete: L-COMPLETE, ind: L-IND}
        prerequisite: {A0: feeds all eleven}
      note: Each lane carries mechanism, the operational predicate as verify.sage defines it,
        a quantitative prediction with direction, certificate-or-bound, controls, budget,
        stopping rule, falsifier and an honest limitation.
    - item: >-
        The plan covers every declared additional diagnostic, or records a concrete reason
        and successor condition for a deferred diagnostic.
      status: met
      mapping:
        complete curve and twist order factorization with checkable certificates: D1
        subgroup, cofactor, and invalid-curve confinement costs: D2
        automorphism- and endomorphism-adjusted rho cost: D3
        embedding-degree certificate or explicit search bound: D4 (covered by L-TRANSFER;
          declared as IDEA-20260807-98a970 specialised, with its delta stated - not duplicated)
        CM discriminant and conductor structure: D5
        model-conversion exceptional sets: D6
        scalar and multiscalar formula exceptional-case search: D7
        deterministic parameter-generation transcript audit: D8 (covered by L-RIGID, delta
          stated)
      partial_deferrals_with_successors: audit-plan.yaml -> deferred_items (3 items, each
        with obstruction and successor condition; none is a whole diagnostic)
    - item: >-
        Positive, parameter-matched negative, and same-shape null controls are explicit and
        run before belief in any later task.
      status: met
      where: audit-plan.yaml -> controls (blocking_rule; 6 positive families, 6
        parameter-matched negatives, 4 same-shape nulls), plus a per-lane `controls` list.
      note: >-
        The blocking rule is stated as blocking: if a positive control fails, that lane's
        E-382 output is VOID and reported as void. The parameter-matched negatives
        C-SAMEP-SQUARE-D, C-SAMEP-DEGENERATE, C-SAMEP-SMALLD and C-SAMEP-K1 are all built
        over the SAME p = 2^382 - 105, which is the strongest available matching.
    - item: The report states that no curve attack ran and makes no safety or vulnerability
        conclusion.
      status: met
      where: this record -> mandatory_statements

  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md s5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - {id: O1, object: CM field discriminant D, verdict: passes the lossy-projection test;
         compatibly lossy under model change AND under quadratic twisting, which is a
         testable consequence, not a restatement}
      - {id: O2, object: embedding degree ord_l(p), verdict: passes; REUSED from
         IDEA-20260807-98a970, not re-derived, and extended only by the l' row}
      - {id: O3, object: 2-primary torsion profile, verdict: passes; the interesting object,
         because four supposedly independent criterion columns may all be functions of it}
      - {id: O4, object: bit-width of designer freedom in the generation transcript,
         verdict: passes; the standout, because the incumbent instrument computes NOTHING
         for it and E-382's published comment cell is empty}
      - {id: O5, object: combined-attack cost functional, verdict: passes; large fibers,
         which is the point}
      - {id: dropped-1, object: x-only Kummer quotient, verdict: FAILS the lossy-projection
         test in this setting - loses nothing the audit uses beyond O3, so it would be a
         change of coordinates}
      - {id: dropped-2, object: the F_p-isogeny class as a set, verdict: passes lossiness
         but no declared criterion is a function of it beyond O1, and enumeration at 382
         bits is far outside budget; deferred with a revisit condition}
    dominated_by:
      attack_axes: >-
        n/a (no result claimed). No attack, speedup, or complexity claim is made on any axis
        - time, memory, or data/queries - so there is no Pareto point to dominate.
      audit_instrument_axis: >-
        SafeCurves' own verify.sage (retrieved: staged mirror SAFECURVES-20260825,
        pages/verify.txt, sha256
        9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79) DOMINATES this
        plan on authority, on coverage (20 curves vs 1 + controls), and on having actually
        been run. This plan dominates it on exactly two points, both stated narrowly:
        (i) it emits third-party-verifiable certificates per cell rather than table cells;
        (ii) it supplies a computed rigidity measurement where verify.sage reads a
        human-entered label, and specifically where E-382's comment cell is empty.
      frontier_rows_checked: >-
        The frontier enumerated in IDEA-20260807-98a970's own dominated_by block - rho at
        0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted
        rho (KN-TECH-018), BSGS (KN-TECH-031) and its n^{2/3+o(1)} full cost (KN-TECH-035),
        MOV/Frey-Ruck at small k (KN-TECH-032), the anomalous transfer (KN-TECH-033).
        HONEST QUALIFIER: these rows were read AS QUOTED INSIDE that proposal, which was in
        read_scope; the KN-* records themselves were not opened in this session. None of
        them is dominated or approached by anything here, because nothing here is an attack.
    sota_delta:
      quantitative: >-
        Zero speedup against any attack baseline on every axis. As DATA: the knowledge corpus
        (knowledge/**) currently contains ZERO records mentioning E-382 and therefore zero
        certified cells for it. The plan, if executed, would produce 11 criterion cells + 8
        diagnostics, each with either a certificate verifiable in <= omega(l-1) modular
        exponentiations or an explicitly-priced bound (K = 10^6 multiplications), plus 3
        degenerate flags and a rigidity candidate-count that exists in no retrieved source.
        Planned compute <= 3600 CPU-seconds, <0.5 GB.
      scope: >-
        Converts eleven booleans transcribed from an unverified intake table into eleven
        recomputable predicates with named thresholds, and converts one criterion (rigidity)
        from an unbacked label into a measurable count.
    closures_enumerated:
      - closure: A same-p, REAL-CURVE negative control with tiny embedding degree.
        mechanism_of_obstruction: >-
          Constructing an actual curve over p = 2^382 - 105 with prescribed small k requires
          CM construction or point counting at 382 bits. Under heuristic H1 (pure Python, no
          Sage/PARI) that is infeasible within the campaign's 18000-second total budget.
        forward_guidance: >-
          The class that remains reachable is instrument-level: C-SAMEP-K1 feeds the SAME p
          with a subgroup order dividing p-1 and must return k = 1, and the toy planted
          positives C+PLANT cover the curve-level case at small size. Successor condition: a
          batch that acquires a point-counting dependency.
      - closure: Part (b) of the rigidity enumeration (order-based disqualification of
          candidate d values).
        mechanism_of_obstruction: same point-counting obstruction, once per candidate.
        forward_guidance: >-
          Report "N candidates admitted, M order-undetermined". A candidate count with a
          declared undetermined remainder is a real measurement; a silent omission would not
          be.
      - closure: Class number h(D) for |D| ~ 2^381 (the Brainpool-style condition).
        mechanism_of_obstruction: >-
          Cost far beyond budget, and SafeCurves states on pages/disc.txt that it did not
          incorporate it and that under GRH it is much weaker than |D| > 2^100.
        forward_guidance: revisit only if some lane needs an unconditional statement where
          the GRH-conditional comparison is insufficient.
      premature_closure_check: >-
        NO LANE IS DECLARED IMPOSSIBLE and no direction is closed on saturation grounds. The
        three closures above are budget/dependency obstructions with named mechanisms and
        named successors, per docs/inventor-protocol.md s4. In particular, the fact that
        SafeCurves has audited this curve is treated as a hypothesis about the search, not a
        theorem about the problem (KN-LIT-7594, KN-TECH-056 - cited from the role briefing;
        not opened this session).
    open_directions_for_next_session:
      - >-
        STAGE eprint 2013/647. It is the single highest-value missing input: the only
        identified source independent of SafeCurves, and the natural home of the generation
        rule that L-RIGID must otherwise reconstruct. Staging is infrastructure, not
        research, and needs a role with Bash or curl.
      - >-
        TEST THE O3 DEPENDENCY CLAIM. If ladder, complete, ind and the twist cofactor are all
        functions of the 2-primary torsion profile, then a dossier reporting four independent
        criterion matches is overcounting by three. This is cheap, general across all twenty
        SafeCurves curves, and is a structural claim with a clean falsifier.
      - >-
        GENERALISE THE RIGIDITY CANDIDATE-COUNT. The O4 instrument - count the curves a
        stated rule admits - applies to every curve on the SafeCurves table, not just E-382,
        and would replace a three-valued human label with a number for all of them. This is
        the most transferable artifact this session produced and it is currently unbuilt.
      - >-
        USE N-RANDOM-TRACE AS A GENERAL CRITERION-INFORMATIVENESS MEASURE. If a criterion is
        satisfied by almost every random object of the same shape, its True cell carries
        almost no information; measuring that fraction per criterion would let the program
        weight criterion matches instead of counting them.
      - >-
        NOT PURSUED HERE AND WORTH SAYING: this campaign is a parameter audit and sits far
        from docs/target-result-profile.md's exponent-moving profile. Nothing in E-382's
        published parameters suggested an exponent-first lead during this session, and no
        such lead is claimed. That is an observation about this session's search, not a
        statement that none exists.

  # ---------------------------------------------------------------------------
  # LIMITATIONS
  # ---------------------------------------------------------------------------
  limitations:
    - >-
      SINGLE-SOURCE. Every retrieved parameter comes from SafeCurves, which introduced and
      evaluated E-382. The intake agrees with it, but the intake is a transcription of it,
      so nothing is corroborated. This is capsule U1 and is the plan's largest weakness.
    - >-
      THE MIRROR WAS NOT FETCHED BY THIS PRODUCER. It is raw curl bytes staged by the
      top-level orchestration session with per-file sha256. It is cited as "retrieved
      (staged mirror SAFECURVES-20260825)" everywhere, never as plain "retrieved".
    - >-
      NO DIGIT ANYWHERE IN THESE ARTIFACTS COMES FROM WebFetch. The WebFetch path in this
      environment returns a small-model summary that is a confirmed corruptor of numeric
      data, and two readings of one URL are one summarizer sampled twice, not corroboration.
      WebFetch was used exactly once, for the ePrint 2013/647 metadata page, for prose only.
    - >-
      THE THREE DERIVED CHECKS DC1-DC3 IN THE CAPSULE WERE DONE BY HAND, NOT BY MACHINE.
      Every intermediate is written out so a reviewer re-checks them in seconds, and lane A0
      re-runs them as machine assertions. They establish internal consistency of the mirror's
      own numbers and NOTHING about primality, on-curve-ness, or any security property.
    - >-
      SAFECURVES PAGE VERSIONS ARE FROM 2013-2017 (self-declared in each page's footer;
      recorded per parameter in the capsule). The mirror is a 2026 retrieval of pages that
      have not been revised since. Nothing here detects a criterion the field has adopted
      since.
    - >-
      ALL BUDGETS DEPEND ON HEURISTIC H1 (pure Python, no Sage/PARI), which is an environment
      claim inherited from another proposal's environment note, not a theorem. Its validation
      route - three timings in the first 30 seconds of any executor task - is written into
      the plan, and a budget overrun under a validated H1 remains an operational observation.
    - >-
      THE PLAN'S OWN CEILING: the strongest thing it could ever certify is "each SafeCurves
      predicate was recomputed from (p, d) and the result, with its certificate, is X". It
      certifies nothing about ECDLP hardness, nothing about implementations, and nothing
      about attacks outside SafeCurves' list.

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICTS
  # ---------------------------------------------------------------------------
  unresolved_conflicts_between_intake_and_retrieved_sources:
    count: 0
    detail: >-
      Zero conflicts. Curve name, equation coefficient d = -67254, modulus 2^382 - 105,
      attribution, and all eleven expected_criteria cells match the staged mirror exactly.
      Goal pause_condition 3 ("primary or authoritative sources leave an unresolved conflict
      in the named curve's parameter tuple") is NOT triggered.
    mandatory_qualifier: >-
      The absence of conflict here carries almost no evidential weight, because the two
      sources are not independent. What IS unresolved is not a conflict but two gaps: U1 (no
      independent source retrieved) and U2 (E-382's rigidity cell has an empty comments cell
      in the raw HTML and no machine derivation in verify.sage). Both are registered in the
      capsule with successor conditions.

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (proposals only - the Coordinator decides)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - proposed_role: infrastructure / top-level orchestration (NOT a research role)
      objective: >-
        Stage https://ia.cr/2013/647.pdf into a hash-pinned mirror with an extraction
        fidelity note, exactly as SAFECURVES-20260825 was staged, so a producer can
        adjudicate E-382's tuple against a source independent of SafeCurves.
      unblocks: capsule U1; goal completion_criterion 1; the best input to L-RIGID / D8.
      rationale: This producer has no Bash and WebFetch cannot be trusted for digits, so this
        is not reachable from any research role in this environment.
    - proposed_role: executor
      objective: Execute lane A0 only, under its 300-second budget, emitting the root
        certificate.
      why_first: >-
        Cheapest valid discriminator: it either validates the tuple that all eleven cells
        depend on, or voids the capsule before any further compute is spent.
      note: This is a PROPOSAL. Only the Coordinator dispatches, approves protocols, or
        freezes a contract.
    - proposed_role: executor
      objective: Execute lanes L-TRANSFER, L-DISC, L-TWIST with their full blocking control
        banks, after A0 passes.
      note: >-
        L-TRANSFER must be dispatched as a specialisation of IDEA-20260807-98a970, not as a
        new mechanism, and its planted positives are a HARD GATE - if any fails, the lane's
        output is void.
    - proposed_role: red-team
      objective: >-
        Attack the plan itself before it is run: specifically, look for criterion lanes whose
        controls cannot fire, for cells that are functions of one another (the O3 dependency
        claim), and for any place where a threshold is applied without being stated.
      why: >-
        The proof-search map predicts an observation collision - E-382 and Curve25519 share
        all eleven True cells while differing in every parameter - which means the boolean
        cells carry no information beyond their predicates. A reviewer should check that no
        artifact drifts into treating "eleven Trues" as evidence.

  novelty_status: unverified
  novelty_justification: >-
    The mathematics of every lane is textbook parameter validation and is KNOWN. The audit
    content is new within this program (the corpus holds zero E-382 records). The rigidity
    candidate-count instrument (O4) may be new as an artifact but was not checked against
    external literature beyond one WebSearch, so it is labelled unverified rather than
    novel - that is the honest label, not a weakness.
