      severity: high
      item: >-
        No source independent of SafeCurves has been retrieved for any E-382 parameter.
        ePrint 2013/647 (S-EPRINT) is identified but its full text is unretrieved.
      why_it_blocks: >-
        Goal completion_criterion 1 asks for reconciliation against "primary or
        authoritative sources" and adjudication of every conflict. With one non-independent
