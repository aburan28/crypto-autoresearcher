        https://ia.cr/2013/647.pdf to a hash-pinned mirror, exactly as SAFECURVES-20260825
        was staged, together with its extraction-fidelity note. A later producer then
        adjudicates d, p, the base point and l against the designers' own paper.
      interim_substitute: >-
        Recomputation from (p, d) inside this program - lanes A0, L-BASE, L-DISC - is
        logically independent of SafeCurves even though it uses SafeCurves' inputs, because
        it re-derives l, t, h and D rather than reading them.
    - id: U2
      severity: medium
      item: >-
        The rigidity cell for E-382 is "fully rigid" with an EMPTY comments cell. Verified
        against the raw HTML: in pages/rigid.html (sha256
        503df9ebf177adc98b9aee9518721d322cbfe463d7bf1ec8dfd8eab9d1f177ad) the E-382 row is
        `<td><p>E-382</p></td><td><p>fully rigid</p></td><td><p></p></td>` - the third cell
        is genuinely empty, not a rowspan and not a text-extraction artifact. Neighbouring
        rows (M-221, Curve1174, Curve25519, secp256k1, Curve383187) DO carry generation
