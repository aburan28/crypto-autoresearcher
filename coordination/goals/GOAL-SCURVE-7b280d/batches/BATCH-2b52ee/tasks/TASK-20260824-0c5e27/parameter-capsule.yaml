        for digits).
      observed_fact: >-
        The strings "E-382", "M-383", "M-221", "M-511" do not appear on the ePrint metadata
        page itself (reported by the WebFetch summarizer; prose-level claim only).
      evidential_status: >-
        Pointer only. It supports NO parameter value in this capsule. Its absence is the
        single most important gap recorded here (see unresolved_items U1).

  independence_analysis:
    critical_statement: >-
      E-382 is a curve that the SafeCurves work itself introduces/evaluates, and the
      user intake table is a transcription of the SafeCurves table. THEREFORE S-INTAKE AND
