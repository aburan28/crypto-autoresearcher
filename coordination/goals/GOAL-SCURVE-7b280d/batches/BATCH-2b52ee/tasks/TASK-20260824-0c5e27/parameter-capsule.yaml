      why_it_matters: >-
        Combined with OBS-RIGID-IS-AN-INPUT, the E-382 rigidity cell is a label with neither
        a machine derivation nor a published transcript. It is the single criterion cell in
        this capsule with no reproducible content behind it anywhere in the retrieved
