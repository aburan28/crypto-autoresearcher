      evidential_status: >-
        Retrieved primary text of the SafeCurves site. It is authoritative for WHAT
        SAFECURVES SAYS. It is not an independent check of any curve property.
      provenance_record: inputs/SAFECURVES-20260825/source_record.yaml

    - id: S-EPRINT
      kind: identified independent primary source, UNRETRIEVED
      what: >-
        Aranha, Barreto, Pereira, Ricardini, "A note on high-security general-purpose
        elliptic curves", IACR ePrint 2013/647 (https://eprint.iacr.org/2013/647,
        PDF https://ia.cr/2013/647.pdf).
      retrieval_status: >-
        Metadata page only, via WebFetch (title, author list, abstract, file link). The
        WebFetch path in this environment returns a small-model SUMMARY, not the page, and
        is a CONFIRMED CORRUPTOR OF NUMERIC DATA; therefore NO digit was taken from it and
        none may be. The PDF full text - which is where the curve names and parameters live
