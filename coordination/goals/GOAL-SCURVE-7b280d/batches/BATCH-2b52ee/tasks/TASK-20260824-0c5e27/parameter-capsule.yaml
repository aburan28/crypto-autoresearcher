  # ---------------------------------------------------------------------------
  # 3. WHAT SAFECURVES' OWN INSTRUMENT ACTUALLY COMPUTES
  # ---------------------------------------------------------------------------
  operational_definitions_source:
    file: S-MIRROR pages/verify.txt
    sha256: 9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79
    page_version_self_declared: '2013.10.13'
    why_this_matters: >-
      verify.txt contains the full verify.sage script that generated every table cell. It
      converts each of the eleven criteria from a word into a machine predicate with an
      explicit threshold, which is what makes the audit plan's lanes reproducible rather
      than interpretive. Two structural facts read off the script are load-bearing:
    load_bearing_observations:
      - id: OBS-RIGID-IS-AN-INPUT
        text: >-
          `rigid = readfile('rigid').strip()` and
          `saferigid &= (rigid == 'fully rigid' or rigid == 'somewhat rigid')`.
          The rigidity criterion is a HUMAN-ENTERED LABEL read from a file. verify.sage
          computes nothing for it. Rigidity is therefore the one criterion of the eleven for
          which the published cell has no machine-checkable derivation at all.
      - id: OBS-EMBEDDING-DEGREE-IS-CONDITIONAL
        text: >-
          verify.sage writes 'Unverified' for embedding degree and MOV-safety unless every
          prime factor of l-1 lies in the verified prime list V. The published (l-1)/8 for
          E-382 therefore asserts that l-1 was completely factored into proven primes; that
          full factorization is reproducible from the E-382 prime list in
          pages/primeproofs.txt (sha256 4b6c69f64451c946645513073feae6f89806f4c790715ded1a2c7b103545d549).

  # ---------------------------------------------------------------------------
  # 4. DERIVED INTERNAL-CONSISTENCY CHECKS DONE IN THIS TASK
  # ---------------------------------------------------------------------------
  derived_checks:
    method_disclosure: >-
      These were done by exact symbolic arithmetic on the sparse-power-of-two expansions
      printed in the mirror, by hand, in this session. They are NOT machine-verified and NOT
      an experiment result. Every intermediate is written out so a reviewer re-checks in
      seconds. They are re-run as machine assertions in lane A0.
    checks:
      - id: DC1
        statement: (p+1-t) = 4*l and (p+1+t) = 4*l', i.e. h = h' = 4 is consistent with the
          published p, l, l' and t.
        working: >-
          Write X = 1030303207694556153926491950732314247062623204330168346855 so that
          l = 2^380 - X, and X' = 1030303207694556153926491950732314247062623204330168346803
          so that l' = 2^380 + X'. The two decimal strings printed by SafeCurves differ only
          in their final two digits (855 vs 803), so X - X' = 52 exactly.
          Then 4l = 2^382 - 4X and 4l' = 2^382 + 4X - 208.
          p+1 = 2^382 - 104. So (p+1) - 4l = 4X - 104 and 4l' - (p+1) = 4X - 104: the two
          conditions coincide, i.e. they force ONE value of t, namely t = 4X - 104.
        result: consistent
      - id: DC2
        statement: The published trace equals 4X - 104.
        working: >-
          X = 1030303207694556153926491950732314247062623204330168346855.
          2X = 2060606415389112307852983901464628494125246408660336693710.
          4X = 4121212830778224615705967802929256988250492817320673387420.
          4X - 104 = 4121212830778224615705967802929256988250492817320673387316,
          which is character-for-character the trace printed in pages/disc.txt.
        result: consistent
      - id: DC3
        statement: l + l' = (p+1)/2.
        working: l + l' = 2^381 + (X' - X) = 2^381 - 52 = (2^382 - 104)/2 = (p+1)/2.
        result: consistent
    what_these_checks_do_NOT_establish:
      - That p is prime, that l is prime, or that l' is prime.
      - That (x1,y1) lies on the curve or has order l.
      - That t is the true trace of the curve defined by (p, d) - only that the mirror's
        own five numbers satisfy the relations they must satisfy if it is.
      - Anything about any security property.
    interpretation: >-
      A transcription error in any one of p, l, l', t would have to be conspiratorial to
      survive DC1-DC3. This raises confidence in the MIRROR-TO-CAPSULE transcription. It
      raises confidence in the SafeCurves numbers themselves by nothing at all, because the
      relations are exactly the ones verify.sage used to produce t in the first place.

