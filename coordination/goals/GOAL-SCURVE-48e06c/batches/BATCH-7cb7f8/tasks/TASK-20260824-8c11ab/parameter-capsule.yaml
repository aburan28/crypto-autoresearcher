      why_it_matters: >-
        It is exactly the CM relation 4p = x^2 + D y^2 with x = 1 that SRC-LMVV-2004
        uses to force the order to p or p+2. It ties the SafeCurves rigidity recipe to
        the published construction with one line of integer arithmetic.
      verification: exact integer arithmetic once m is recovered in lane L7; cost
        microseconds.
    - id: HD2
      statement: >-
        t^2 - 4p = 1 - 4p = -11 u^2 with u = 2m+1. The squarefree part is -11, and
        -11 = 1 mod 4, so D = -11 under the rule stated on SRC-SAFECURVES-DISC.
      derivation_status: hand_derived_unverified
      why_it_matters: Gives the disc cell an exact closed-form certificate that needs
        no factoring of t^2-4p.
      verification: exact integer arithmetic; check 4p - 1 = 11*u^2 and that 11 is
        squarefree.
    - id: HD3
      statement: >-
        If p is prime, if G = (x1,y1) is on the curve, if G is not the identity, and if
        p*G = O, then p divides #E; Hasse gives #E <= p + 1 + 2*sqrt(p); for p >= 7 one
        has 2p > p + 1 + 2*sqrt(p); hence #E = p exactly.
      derivation_status: hand_derived_unverified
      why_it_matters: >-
        THIS IS THE CHEAP CERTIFICATE FOR ANOMALOUSNESS. It replaces point counting
        (SEA) with one scalar multiplication plus a primality certificate. It is the
        reason the whole audit is affordable in pure Python.
      verification: one 204-bit scalar multiplication, one on-curve check, one
        primality certificate for p, and the stated interval inequality.
    - id: HD4
      statement: >-
        With 11 u^2 = -1 mod p (from HD1), multiplying by 11 gives (11u)^2 = -11 mod p.
        So -11 has the explicit square root 11u mod p, and the CM endomorphism of norm
        3 acts on the group of order p as multiplication by lambda = (1 +/- 11u) *
        inverse(2) mod p, satisfying lambda^2 - lambda + 3 = 0 mod p.
      derivation_status: hand_derived_unverified
      why_it_matters: >-
        Makes the endomorphism-adjusted-rho diagnostic (D3) concrete and cheap: no
        Tonelli-Shanks, no endomorphism evaluation on points, just one modular
        identity and then an order-of-lambda lower-bound certificate in exactly the
        format of IDEA-20260807-98a970.
      verification: check lambda^2 - lambda + 3 = 0 mod p by two modular
        multiplications.
    - id: HD5
      statement: >-
        If #E = p with p an odd prime greater than 3, then E(F_p) has no point of order
        2, none of order 3, and none of order 4. Consequently no Montgomery model over
        F_p exists (it requires a rational point of order 2), no complete Edwards model
        exists (it requires 4 | #E), and no Hessian model exists (it requires 3 | #E).
      derivation_status: hand_derived_unverified
      why_it_matters: >-
        Four SafeCurves cells (ladder, complete, ind, and part of twist reasoning) are
        NOT independent measurements on this curve: they cascade from the single
        certified fact #E = p. That is what makes the audit plan a dependency graph
        rather than eleven parallel jobs, and it converts three cells into
        contradiction tests that can detect an instrument fault.
      verification: divisibility arithmetic on p once HD3 is certified.
    - id: HD6
      statement: >-
        Size estimate. A 62-digit p is about 2^203.5. Then 0.886*sqrt(p) is about
        2^(101.73 - 0.175) = 2^101.56, which rounds to the 2^101.6 that
        SRC-SAFECURVES-RHO reports for the Anomalous rho cost. Separately,
        p = 11m(m+1)+3 with m just above 2^100 predicts p about 11*2^200 = 2^203.46.
      derivation_status: hand_derived_unverified
      why_it_matters: >-
        Three independently retrieved items - the 62-digit prime, the reported rho cost
        2^101.6, and the generation recipe with m above 2^100 - agree to within about
        0.05 bits. That mutual consistency is the strongest available evidence that the
        indirect retrieval channel transcribed the digits faithfully, and it is also
        what makes the field.html "approximately 2^124" remark identifiable as channel
        narration rather than a source conflict.
      verification: recompute the bit length of p and 0.886*sqrt(p) exactly in lane L4.

