    resolution: >-
      This session used the authoritative records from the start and NEVER OPENED
      RQ-SCURVE-960dbd; the only place that identifier appears in this session's reads
      is as a filename inside a directory listing and inside the bootstrap manifest's
      P-224 row. No content from the wrong record entered any artifact. The coordinator
      sent a mid-task correction confirming the same reading, and the correction was
      applied before the artifacts were finalised. Also recorded as conflict C-3 in the
      parameter capsule.
  - id: CORR-CHANNEL-DEFECT
    type: retrieval-channel defect, disclosed not suppressed
    description: >-
      safecurves.cr.yp.to returned HTTP 502 through this session's proxy for every
      request, so all SafeCurves data was obtained through a third-party text proxy and
      then summarised by the fetch tool. That channel produced at least one demonstrably
      wrong derived statement (describing a 62-digit prime as "approximately 2^124").
    resolution: >-
      Recorded as capsule conflict C-1 and as a `fidelity_warning` on every affected
      source. Step 0 of the audit plan's execution order makes a direct re-fetch of the
      primary host BLOCKING before any comparison against the intake table.
  unresolved_conflicts_between_intake_and_retrieved_sources:
  - id: U-1
    status: NO SUBSTANTIVE CONFLICT FOUND, at the fidelity available
    detail: >-
      Every intake field that could be checked against a retrieved source agreed as a
      string: the equation, the modulus, the details text, the overall Safe?=False, and
      all eleven True/False cells. Retrieval added parameters the intake does not carry
      (base point, l, cofactor, trace, D, j-invariant, generation recipe) and none of
      them contradicted the intake.
    caveat: >-
      "Agreement" here means agreement with a proxy-summarised rendering of the source.
      It is NOT verification of the intake table, and the intake table remains
      user-supplied unverified intake and a preregistered comparison target only.
  - id: U-2
    status: OPEN AND MATERIAL
    detail: >-
      Threshold drift. The retrieved SafeCurves criterion pages give "rho cost above
      2^100" and "|D| > 2^100"; the retrieved Bernstein-Lange 2024 survey rendering
      gives l >= 2^220 and |D| > 2^110. The intake `rho: true` cell is reproducible
      under the first threshold and FLIPS to false under the second, because l is about
      2^203.5. Which threshold governs the published table was not established.
    handling: >-
      The audit plan requires dual_threshold_reporting on every lane with a numeric
      threshold. This is capsule conflict C-2.
  - id: U-3
    status: OPEN, evidentiary rather than numeric
    detail: >-
      No primary source for the anomalous-curve attack was obtained in full. Smart 1999
      was retrieved as publisher metadata plus abstract only; Semaev 1998 could not be
      retrieved (AMS returned 403 directly and the proxy route returned the journal
      overview instead of the article); Satoh-Araki 1998 was not retrievable and its
      known errata (doi:10.14992/00009860) remains unexamined in this program.
    handling: >-
      KN-LIT-087 and KN-LIT-088 stay at provenance `kb` with underlying_paper_status
      `unretrieved`; neither was promoted. Capsule conflict C-4 makes obtaining one full
      paper a precondition for any run that implements the transfer.

  # ==========================================================================
  # HONEST ACCOUNTING BLOCK (docs/inventor-protocol.md section 5)
  # ==========================================================================
  honest_accounting:
    objects_considered:
    - id: OBJ-1
      name: the divisibility profile of the group order
      verdict: SELECTED as the primary object. Passes the lossy-projection test
        (destroys the curve, keeps a residue vector, and what it discards is discarded
        compatibly with isomorphism, model change, isogeny and twist). Explicitly NOT
        NEW - order-divisibility checking is the oldest idea in ECC parameter
        validation. Chosen because it collapses six of eleven cells into one
        certificate, not because it is novel.
    - id: OBJ-2
      name: the CM data triple (t, D, u)
      verdict: SELECTED as a secondary object for the disc lane and the endomorphism
        diagnostic. Passes the lossy-projection test. Repackaging of standard CM
        bookkeeping.
    - id: OBJ-3
      name: the generation transcript with per-candidate rejection witnesses
      verdict: >-
        SELECTED for the rigidity lane. Passes the lossy-projection test in an unusual
        direction - it discards the curve entirely and keeps only the search. This is
        the one object here with a defensible corpus-relative novelty claim
        (`adaptation`): the corpus has no record treating a generation transcript as a
        checkable object with per-step witnesses rather than as prose about provenance.
        Novelty is claimed ONLY relative to this corpus; no literature search for prior
        art on transcript-as-object was performed, so its honest status is
        `unverified` against the literature.
    - id: OBJ-REJECTED-1
      name: the point-count itself as a tracked object, obtained by SEA
      verdict: >-
        REJECTED. Not for novelty reasons - because it fails the cost test. HD3 shows
        that a primality certificate plus one scalar multiplication determines #E
        exactly for this curve, so point counting would be strictly dominated by the
        cheap route. Recorded because rejecting the expensive route on a derivation
        rather than on a budget guess is the actual design decision in this plan.
    novelty_status: unverified
    novelty_screen:
      method: >-
        Grep over knowledge/ and ledger/ for anomalous, Anomalous, Satoh, Semaev,
        Smart, trace one, trace-one; full reads of KN-TECH-033, KN-TECH-018,
        KN-LIT-087, KN-LIT-088, KN-LIT-089 and IDEA-20260807-98a970; web retrieval as
        recorded in the capsule.
      tool_limitation_disclosed: >-
        The kb MCP retrieval tools (search_knowledge, get_context, get_source,
        find_related) were NOT available to this session; only Grep, Glob and Read over
        the repository were. AGENTS.md "Knowledge retrieval policy" asks for
        search_knowledge before novelty claims, so this screen is weaker than the
        policy contemplates and the resulting status is `unverified` for that reason as
        well.
      result: >-
        The mathematics is KNOWN and published (KN-TECH-033 at corpus confidence
        `established`). The parameter capsule and audit plan are, as far as this screen
        can tell, the first records in this program for this curve. No novelty is
        claimed for any mechanism.
    dominated_by:
      as_an_attack: n/a (no result claimed) - no attack is proposed, mounted, or
        planned as a discovery. The control reproduction would be dominated outright by
        the published additive transfer, which is already linear time on this curve
        class.
      as_an_audit_instrument: >-
        Dominated by SafeCurves itself, which published these verdicts and the scripts
        behind them, and by standards-mandated parameter validation (ANSI X9.62-style,
        SEC-style). This work dominates neither on time, memory, data, coverage, nor
        authority.
      frontier_rows_checked: >-
        Checked across time, memory and data/queries against: rho at 0.886*sqrt(n) with
        O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho
        (KN-TECH-018); BSGS (KN-TECH-031) and its n^(2/3+o(1)) full cost (KN-TECH-035);
        MOV/Frey-Ruck at small embedding degree (KN-TECH-032); the additive transfer
        (KN-TECH-033); the SafeCurves published table; and Bernstein-Lange 2024. This
        is NOT set to null.
    sota_delta:
      attack_speedup: 0 on every axis - time, memory, data, queries. No exponent is
        moved and none is claimed.
      exponent_context: >-
        The exponent collapse on this curve class - from p^(1/2) generic search down to
        (log p)^(O(1)) - is real, is the sharpest such collapse in the ECDLP landscape,
        and belongs entirely to Semaev, Satoh-Araki and Smart in 1998-1999. This
        session contributes zero to it.
      delta_as_data: >-
        From zero certified cells and zero certificates for this curve, to a plan for 11
        criterion cells plus 8 diagnostic rows, 9 of them with succinct certificates,
        1 with an explicitly non-succinct 10^6-multiplication bound, and 1 expected to
        return an interval.
      delta_as_method: >-
        The one methodological item worth naming: HD3 replaces point counting with a
        primality certificate plus one scalar multiplication, which is what makes an
        eleven-lane certificate-bearing audit affordable in a pure-Python environment.
        This is standard mathematics stated carefully, not a new technique.
    closures_enumerated:
    - lane: the additive transfer as a source of NEW attack ideas on this curve
      closed: true
      named_obstruction: >-
        The additive transfer is complete on its domain. When #E(F_p) = p the ECDLP is
        solved in O(log p) field operations, so there is no residual cost to improve -
        the quantity an improvement would reduce is already polylogarithmic.
      argument: >-
        A speedup requires a nonzero gap between the best known cost and a lower bound.
        Here the best known cost is linear in the input size, and reading the input is
        already linear, so the gap is at most a constant factor. Any work here is
        constant-factor polishing, which the target-result profile ranks lowest.
      scope_of_closure: >-
        Closed ONLY for "make the trace-one attack faster on a trace-one curve". It is
        NOT closed for the questions in open_directions below.
      forward_guidance: see open_directions O-1 and O-2.
    - lane: this curve as a target of independent interest
      closed: true
      named_obstruction: >-
        The curve was constructed to be weak, by a published recipe, as a table
        illustration. Its parameters carry no design intent to protect anything.
      argument: >-
        An audit of it can produce a certificate and a control; it cannot produce a
        finding about deployed cryptography, because nothing deploys it.
      forward_guidance: >-
        Its value to the program is entirely as an INSTRUMENT - specifically as the
        firing positive control that IDEA-20260807-98a970's degenerate-flag column has
        never had. Use it that way.
    premature_closure_check:
      declined_to_generate: false
      note: >-
        No lane was refused on saturation grounds. The two closures above are scoped
        closures with named obstructions, arguments and forward guidance, and each names
        what remains open, as docs/inventor-protocol.md section 4 requires.
    open_directions:
    - id: O-1
      direction: >-
        The trace ladder as a measurement, not a control. CTRL-DECAY is specified in
        this plan as an artefact check, but the underlying question is a real one that
        the corpus asserts rather than measures: KN-TECH-033 states that the attacks "do
        not degrade gracefully as t moves away from 1, they simply do not apply". That
        is a sharp claim about a step function, and this program has never measured it.
        A measured nonzero signal at t = 2 would contradict an `established` corpus
        record and would be a material finding; a measured zero would convert a relayed
        assertion into program data at low cost.
      cost: low. CM-constructed toy curves at 32-64 bits, generated keys only.
      why_it_is_not_in_this_plan_as_a_primary_lane: >-
        It is out of scope for a single-curve parameter audit and belongs to a separate
        RQ. Named here so it is not lost.
    - id: O-2
      direction: >-
        The transcript object OBJ-3 generalised into a rigidity metric. SafeCurves'
        rigidity classification is a four-level adjective. The transcript object turns it
        into two measurable numbers - transcript length, and the count of distinct
        transcripts consistent with a published output, i.e. the designer's manipulation
        budget in bits. That is a diagnostic that could be applied uniformly across all
        twenty SafeCurves rows in this bootstrap, several of which (P-224, P-256, P-384,
        FRP256v1) have rigidity cells marked false in their intake and would be the
        interesting arm.
      cost: low per curve; the interesting version is the cross-curve comparison.
      caveat: >-
        Not novelty-screened against the literature. Manipulation-budget arguments for
        curve generation are known in outline (the SafeCurves rigidity discussion itself
        is one), so the honest status of any such proposal is `unverified` until
        someone retrieves that literature.
    - id: O-3
      direction: >-
        Close capsule conflict C-4 by obtaining one of the three anomalous-curve papers
        in full and examining the Satoh-Araki errata. This program cites a linear-time
        result it has never read, across three corpus records, and the errata has been
        flagged as unexamined since 2026-07-24.
      cost: retrieval only, no compute.

  proposed_successor_handoffs:
    authority_note: >-
      PROPOSALS ONLY. The idea-generator does not assign work, allocate task
      identifiers, or approve experiments. Each item below would need a Coordinator
      handoff with its own frozen contract, write scope, budget and completion gate.
  - proposal: SUCC-1
    role: idea-generator or executor (retrieval only, no compute)
    objective: Re-fetch safecurves.cr.yp.to directly once the host is reachable and
      re-read every digit string and criterion cell used in the capsule; adjudicate
      capsule conflicts C-1 and C-2 (which threshold governs the published table).
    why_first: >-
      It is BLOCKING for every comparison against the intake table, it costs no compute,
      and everything downstream inherits its fidelity.
  - proposal: SUCC-2
    role: executor
    objective: Execute audit-plan steps 1-3 - the instrument-fault tests, then L1/L2/L3,
      then L5 with CTRL-POS, CTRL-NEG-1 and 20 CTRL-NULL draws.
    why_second: >-
      This is the plan's cheapest decisive subset: under two minutes of compute
      excluding the primality attempt, and it settles the load-bearing question of the
      entire goal.
    precondition: SUCC-1, plus a frozen contract, plus the control gate.
  - proposal: SUCC-3
    role: executor
    objective: Execute steps 4-6 (transcript replay, CM data, the cascade cells with
      their independent polynomial-gcd cross-checks, rho, D3, D4).
  - proposal: SUCC-4
    role: executor
    objective: Execute step 7 (twist factorisation) under its 1800 s cap, with the
      pre-committed interval reporting if the budget is exhausted.
  - proposal: SUCC-5
    role: validator, then red-team, in independent sessions
    objective: >-
      Validate the control regime and certificate integrity, and attack the cascade -
      specifically whether the independent cross-checks on L8, L10 and L11 really avoid
      routing through C4, since six cells sharing one derivation is a correlated failure
      mode that consistency among them cannot detect.
  - proposal: SUCC-6
    role: idea-generator
    objective: Open directions O-1 and O-2 as their own research questions, and O-3 as a
      retrieval task.

  limitations:
  - This is a plan and a capsule. Neither is evidence, and neither may be cited as such.
  - No shell was available to this session, so nothing was verified locally, no PDF
    could be converted to text, and the agent-proxy status endpoint could not be
    queried when safecurves.cr.yp.to returned 502.
  - Every SafeCurves datum is second-hand through a text proxy and a summarising fetch
    tool, a channel with a demonstrated defect. Digit strings carry a high transcription
    risk that the plan neutralises with self-checking tests rather than trust.
  - The six hand derivations HD1-HD6 are pen-and-paper algebra by the idea-generator.
    They are labelled hand_derived_unverified, each carries its exact verification, and
    any of them may be wrong. The audit plan's certificate design depends on HD3 and HD5
    in particular; if either is wrong the plan's cost model is wrong.
  - The kb retrieval index was not queryable from this session, so the novelty screen is
    weaker than AGENTS.md contemplates. novelty_status is `unverified`.
  - The plan's budgets assume a pure-Python environment with no computer-algebra system,
    following the environment constraint recorded in IDEA-20260807-98a970. If Sage or an
    equivalent is available, L1 and L9 become easy and the plan should be re-costed.
  - Conclusions from any later execution will be scoped to one 204-bit curve, the exact
    thresholds named, the code path used, and the budget spent. Nothing transfers to any
    other curve.

  reuse_compliance:
    record: IDEA-20260807-98a970
    reused_not_duplicated: true
    how: >-
      Diagnostic D4 specialises that record's steps 2 and 3, its three degenerate flags
      (p = 1 mod N, N = p, N^2 | #E), and both of its certificate formats to this single
      curve, and imports its planted-positive controls wholesale as CTRL-FAULT-2.
      Certificate C8 reuses its non-succinct lower-bound format verbatim, including the
      obligation to state that verification costs K multiplications. No new
      embedding-degree, anomalous-detection or full-torsion mechanism was minted.
    contribution_back: >-
      This curve is the FIRING POSITIVE that IDEA-20260807-98a970's degenerate-flag
      column has never had. That record predicted zero flags across standardised curves;
      an instrument that has never been shown to fire cannot certify that zero. D4 also
      predicts a specific interface failure - l = p makes ord_l(p) undefined, so a
      pipeline that returns a numeric embedding degree for this row has an unhandled
      edge case and its "no degenerate flags" column is untested until fixed.
