  corrections_and_conflicts:
  - id: CORR-RQ-POINTER
    type: dispatch-prompt error, corrected before finalisation
    description: >-
      The dispatch prompt to this session named ledger/questions/RQ-SCURVE-960dbd.yaml
      as the research question for GOAL-SCURVE-48e06c. That file belongs to the NIST
