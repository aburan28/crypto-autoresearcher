  companion_capsule: coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-7cb7f8/tasks/TASK-20260824-8c11ab/parameter-capsule.yaml
  produced_by: idea-generator
  produced_at: '2026-08-25T00:00:00-07:00'

  claim_status:
    attack_run: false
    experiment_result_created: false
    safety_conclusion: none
    statement: >-
      This is a PLAN. Nothing in it was executed. It proposes work; it does not assign
      it, approve it, or report it. No lane below has produced a number. The
      idea-generator has no authority to dispatch any of this: every lane requires a
      Coordinator-approved frozen contract and an Executor task before it may run.
    positive_control_framing: >-
      The Anomalous row is a POSITIVE CONTROL for a published 1998-1999 result, not a
      discovery. Lane L5 plans the sourced reproduction of a known property of a
      deliberately weak illustrative curve. No output of this plan may be described as
      a new attack, a new weakness, or a break.

  # ===========================================================================
  # 1. OBJECT-FIRST FRAMING (docs/inventor-protocol.md sections 1-2)
  # ===========================================================================
  object_first_generation:
    target_mining_status: >-
      The target here is a PARAMETER AUDIT of a named curve, not an attack on a hard
      problem, so the "heavily mined target" clause applies in a modified form: the
      attack family that this curve illustrates (the additive transfer on trace-one
      curves) is not merely mined, it is CLOSED AND PUBLISHED, and this session
      declares it off-limits as a source of novelty. It is used only as a control.
      The generative question is therefore not "what attacks this curve" but "what
      object, followed through the audit, makes eleven separate criterion cells into
      one certified computation with contradiction tests".
    established_families_declared_off_limits_as_novelty:
    - additive transfer / Smart-Satoh-Araki-Semaev on #E(F_p) = p
    - multiplicative transfer / MOV-Frey-Ruck at small embedding degree
    - small-CM-discriminant endomorphism speedups of rho (KN-TECH-018)
    - generic square-root search (rho, BSGS)
    taxonomy_caveat: >-
      This program has no written object-enumeration for the ECDLP (KN-OPEN-019), so
      the mapping from these families to tracked objects below is a SKETCH, not a
      taxonomy, and is labelled as such.
    candidate_objects:
    - id: OBJ-1
      name: the divisibility profile of the group order
      definition: >-
        The map E |-> (#E mod p, #E mod 2, #E mod 3, #E mod 4, #E - p, 2p + 2 - #E),
        i.e. the group order reduced to a short vector of residues and offsets.
      lossy_projection_test:
        lossiness: >-
          GENUINELY LOSSY. A 204-bit curve - its coefficients, its base point, its
          j-invariant, its generation seed - collapses to a handful of small residues
          plus two integers. Nothing about the curve is recoverable from the vector;
          exponentially many curves share it.
        discarded_compatibly: >-
          YES, and this is the whole point. What is discarded (the model, the
          coordinates, the coefficients) is discarded compatibly with the operations
          that matter to the audit: #E is invariant under F_p-isomorphism, under any
          change of model (Weierstrass <-> Montgomery <-> Edwards), and under
          F_p-isogeny; under quadratic twist it maps deterministically to 2p + 2 - #E.
          So the retained part propagates deterministically without reference to the
          curve.
        not_a_change_of_coordinates: >-
          Confirmed. A change of coordinates would preserve the ability to reconstruct
          the curve; this projection destroys it while keeping every propagation rule
          the audit uses.
      one_step_propagation: >-
        Defined and measurable: twist (#E -> 2p+2-#E), isogeny (invariant), model
        change (invariant), base extension to F_{p^k} (Weil: #E_k = p^k + 1 -
        (alpha^k + beta^k), deterministic from t).
      survival: >-
        Survives every model change and every F_p-isogeny. Dissolves when the question
        stops being an order question - it says nothing about rigidity (a fact about
        the generation transcript, not the curve) and nothing about the existence of
        an encoding map beyond the torsion obstructions.
      novelty_axis: repackaging, and declared as such. Order-divisibility checks are
        the oldest parameter-validation idea in ECC. Its value here is organisational,
        not novel.
      scored:
        genuinely_new: no
        concretely_testable: yes
        survival_depth: high within order-questions, zero outside them
    - id: OBJ-2
      name: the CM data triple (t, D, u)
      definition: 'The trace t, the CM field discriminant D, and the witness u in the
        relation 4p = t^2 + |D| u^2.'
      lossy_projection_test:
        lossiness: >-
          LOSSY. Many curves over many primes share a given (t, D); the coefficients
          and base point are destroyed. But u pins the prime, so the triple is less
          lossy than OBJ-1 and is close to a class invariant of the isogeny class.
        discarded_compatibly: >-
          YES for the operations used: (t, D) is constant on an F_p-isogeny class; the
          twist flips the sign of t and preserves D.
        not_a_change_of_coordinates: >-
          Confirmed - the curve cannot be reconstructed from (t, D, u) alone; a
          j-invariant must be supplied separately.
      one_step_propagation: 'twist: t -> -t, D fixed. Isogeny: invariant. Model change:
        invariant.'
      survival: >-
        Survives isogeny and model change; dissolves under base extension (D of the
        larger field's order changes) and carries no information about torsion beyond
        what t already gives.
      novelty_axis: repackaging. This is standard CM bookkeeping.
      scored:
        genuinely_new: no
        concretely_testable: yes
        survival_depth: high
    - id: OBJ-3
      name: the generation transcript as an object
      definition: >-
        The finite sequence of rejected candidate parameters produced by a
        deterministic curve-generation recipe, together with a short witness of
        rejection for each - here, for the recipe "smallest m above 2^100 with
        11m(m+1)+3 prime", the list of rejected m each accompanied by a Fermat
        compositeness witness.
      lossy_projection_test:
        lossiness: >-
          LOSSY in an unusual direction: it discards the CURVE entirely and keeps only
          the search that produced it. Two different curves generated by the same
          recipe from different starting points have transcripts of the same shape.
        discarded_compatibly: >-
          YES with respect to the only operation rigidity cares about - re-running the
          recipe. The transcript is exactly the part of the process that is replayable
          and checkable; the curve is the part that is not.
        not_a_change_of_coordinates: >-
          Confirmed - no curve datum survives the projection.
      one_step_propagation: >-
        Defined: extending the search by one candidate appends one witness. Measurable:
        the transcript length, and the number of transcripts consistent with the
        published output (the "manipulation budget").
      survival: >-
        Survives as long as the recipe is deterministic. Dissolves the moment any
        unexplained input enters, which is precisely SafeCurves' own rigidity
        classification boundary.
      novelty_axis: >-
        ADAPTATION, and the only object here with a defensible claim to being more than
        repackaging inside this program - the program has no record that treats a
        generation transcript as a checkable object with per-step witnesses rather than
        as prose about provenance. Novelty is claimed only relative to this corpus,
        not against the literature, which this session did not search for it.
      scored:
        genuinely_new: adaptation (corpus-relative)
        concretely_testable: yes - transcript length, witness validity, and whether the
          recipe's output equals the published p
        survival_depth: shallow but exact
    selected_primary_object: OBJ-1
    selection_rationale: >-
      OBJ-1 is chosen not because it is new - it is explicitly not - but because it is
      the object under which the audit's cost collapses. Certifying one fact about
      OBJ-1 (#E = p) discharges or constrains six of the eleven criterion cells and
      converts three of them from measurements into contradiction tests. OBJ-2 supplies
      the disc lane and the endomorphism diagnostic; OBJ-3 supplies the rigid lane and
      the generation-transcript diagnostic. Declaring OBJ-1 "not new" up front is the
      point of the exercise: an audit that claimed novelty here would be overclaiming,
      and an audit that refused to run because the object is old would be premature
      closure.

  # ===========================================================================
  # 2. CONTROL REGIME - BLOCKING, RUNS BEFORE ANY INTERPRETATION
  # ===========================================================================
  control_regime:
    gate_rule: >-
      BLOCKING AND ORDERED. No lane result may be interpreted, reported as reproducing
      or contradicting an intake cell, or promoted to a dossier row until the controls
      below have run through the IDENTICAL code path and returned their required
      values. A pipeline that has never been shown to fire cannot certify a negative,
      and a pipeline that has never been shown to stay silent cannot certify a
      positive. If any control fails, every measurement in this plan is void and the
      correct output is an instrument-failure report under AGENTS.md core rule 5.
    positive_control:
      id: CTRL-POS
      object: THE TARGET CURVE ITSELF.
      why_this_is_unusual: >-
        For this row the positive control and the subject coincide. That is exactly why
        the negative and null controls below must be specified with more care than
        usual: with a positive control that cannot fail to be positive, the entire
        discriminating power of the design sits in the objects that must come back
        NEGATIVE.
      required_behaviour: >-
        The anomalousness certificate (C4) must be produced, and the order-vs-p test
        must report equality.
      what_a_failure_means: >-
        Either the retrieved parameters are wrong (transcription, see capsule
        fidelity_risk) or the pipeline is wrong. It does NOT mean the published
        literature is wrong, and the report must say so.
    parameter_matched_negatives:
    - id: CTRL-NEG-1
      name: the quadratic twist of the target curve
      construction: >-
        Same p, same field, same CM discriminant D = -11, same j-invariant class; the
        twist E' with #E' = 2p + 2 - #E = p + 2. Take a non-square c in F_p and use
        y^2 = x^3 + a c^2 x + b c^3.
      why_it_is_the_sharpest_negative: >-
        It matches the target on EVERY parameter the audit tracks except the one under
        test. It has the same prime, the same field size, the same discriminant, the
        same class number, the same "small D" property, and it was produced by the same
        construction. If a lane's signal is really about trace one, it must vanish
        here; if it is about small |D| or about the prime's shape, it must persist.
      required_behaviour:
      - anomalousness test (C4): MUST NOT fire. #E' = p + 2 != p.
      - disc lane (L6): MUST still report D = -11. The disc cell and the transfer cell
        are thereby demonstrated to be independent, which the intake row asserts but
        does not show.
      what_it_discriminates: >-
        Separates "this curve is anomalous" from "curves of this shape are anomalous".
        The SafeCurves recipe produces BOTH E and E' and only one of them is anomalous
        (SRC-LMVV-2004 - order p or p+2), so an audit that cannot tell them apart has
        not measured anything.
    - id: CTRL-NEG-2
      name: same-size generic ordinary curve
      construction: >-
        A freshly generated random prime q of the same bit length as p (204 bits) and
        random coefficients, rejected unless the resulting curve has a prime-order
        subgroup and is not anomalous. Order established by the same order-check
        certificate (C3 + C4 logic) using a generated base point.
      required_behaviour: anomalousness test MUST NOT fire; disc lane MUST report a
        large |D| (or report that D was not determined, which is itself the honest
        outcome for a random curve without point counting).
      honest_limitation: >-
        Establishing #E for a random curve WITHOUT point counting is not possible by
        the cheap route HD3, which needs a known prime order. So this control requires
        either a generated curve whose order is known by construction (CM
        construction) or a documented point-counting step. The plan takes the first
        route and DECLARES that it therefore does not test the pipeline on an
        order-unknown input.
    same_shape_null:
      id: CTRL-NULL
      name: structure-removed twin at the same prime
      construction: >-
        Keep p EXACTLY as published. Replace (a, b) by uniformly random coefficients in
        F_p subject only to 4a^3 + 27b^2 != 0. Generate a base point on the resulting
        curve. Everything about the shape of the object - field, bit length, model,
        code path, certificate format - is identical; the only thing deliberately
        destroyed is the CM structure that makes the order equal p.
      required_behaviour:
      - anomalousness certificate C4 MUST NOT be producible (the candidate order p will
        not annihilate the generated point).
      - j-invariant check MUST NOT return -32768.
      - the CM identity check (HD1/HD2) on t^2 - 4p MUST NOT return squarefree part -11
        for the null curve's actual trace.
      sample_size: at least 20 independent null draws, so that "never fires" is a rate
        (0/20) rather than an anecdote.
      what_a_null_failure_means: >-
        If the anomalousness test fires on a random curve at the same prime, the test
        is measuring the prime and not the curve, and every lane depending on C4 is
        void.
    decay_parameter_control:
      id: CTRL-DECAY
      parameter: distance of the trace from one, |t - 1|
      construction: >-
        A ladder of CM-constructed curves at comparable size with traces t = 1, 2, 3,
        5, 9, 17, ... (or the nearest constructible values), each carrying a known
        prime-order subgroup.
      preregistered_competing_explanations:
        E1: >-
          The additive transfer is a SHARP trace-one phenomenon. KN-TECH-033 states
          the attacks "do not degrade gracefully as t moves away from 1, they simply
          do not apply, because the additive target group disappears." E1 predicts a
          STEP: full collapse at t = 1, and at t = 2 no information whatsoever - the
          measured cost jumps to the generic rho baseline with no intermediate regime.
        E2: >-
          Some quantity used by the transfer (a formal-group logarithm, a p-adic lift)
          retains partial usefulness for small |t - 1|, giving a graded signal.
      measurement: >-
        For each t, the fraction of the discrete logarithm recovered by the additive
        route in a fixed budget, measured ONLY on generated toy curves with
        program-generated keys, never on the target curve and never on any live key.
      discrimination: >-
        E1 predicts the recovered-fraction sequence (1, 0, 0, 0, ...); E2 predicts a
        decreasing but nonzero head. Observing a nonzero value at t = 2 would
        contradict the corpus statement in KN-TECH-033 and is a material finding
        requiring independent review before any statement leaves the repository.
      status_note: >-
        This control is the canonical artefact tell required by the inventor protocol -
        a quantity that fails to decay when the parameter meant to destroy it increases
        is an artefact. Here the parameter is |t - 1| and the predicted decay is
        instantaneous.
    instrument_fault_tests:
    - id: CTRL-FAULT-1
      name: mutated certificate
      construction: take a valid certificate and change one digit of one field.
      required_behaviour: the verifier MUST reject. A verifier that accepts a mutated
        certificate is not a verifier.
    - id: CTRL-FAULT-2
      name: planted small-k positive for the embedding-degree diagnostic
      construction: reuse the planted positives already specified in
        IDEA-20260807-98a970 - a toy BN-shaped curve with k = 12, a toy curve with
        p = 1 mod N (k = 1), a toy supersingular curve with t = 0 (k = 2).
      required_behaviour: the embedding-degree code path must return 12, 1 and 2
        respectively before it is allowed to report anything about this curve.

  # ===========================================================================
  # 3. NAMED HEURISTIC ASSUMPTIONS
  # ===========================================================================
  heuristic_assumptions:
  - id: H1
    statement: >-
      (Primality soundness.) The integers this plan declares prime are prime. Where an
      ECPP or Pocklington certificate is produced this is not a heuristic at all. Where
      the fallback is used, the claim is that a composite 204-bit integer survives
      BPSW together with 64 independent Miller-Rabin rounds with probability at most
      4^-64, and that BPSW has no known counterexample.
    rigorous_support: >-
      Miller-Rabin's error bound of 4^-k per round for a fixed composite over random
      bases is a theorem (Rabin/Monier). Pocklington's criterion is a theorem and needs
      only a partial factorisation of p - 1 exceeding sqrt(p).
    distribution_statement_it_imitates: >-
      That the plan's specific integers behave like random inputs to the test, which is
      exactly what an adversarially chosen input need not do. This is the honest gap.
    validation_plan: >-
      Attempt a Pocklington certificate first: factor p - 1 = 11m(m+1) + 2 by trial
      division to 10^7 plus Pollard rho plus ECM within a 600 s cap, and accept if the
      certified factored part exceeds sqrt(p). Sample validation: run the same code
      path over the first 10^5 primes and over 10^5 known Carmichael and
      strong-pseudoprime inputs from a generated list, recording zero false positives
      as a floor. Report which route each primality claim used; NEVER report a
      probabilistic result as a certificate.
    tail_check: record the largest certified factor of p - 1 and the shortfall against
      sqrt(p) when Pocklington fails.
    falsifier: a Pocklington certificate that fails re-verification, or any disagreement
      between the two routes.
  - id: H2
    statement: >-
      (Twist-order smoothness.) The integer p + 2 = 11m(m+1) + 5 has the factorisation
      profile of a uniformly random integer of its size; in particular its largest
      prime factor P1 satisfies Pr[P1 <= x^(1/u)] ~ rho(u) with rho the
      Dickman-de Bruijn function.
    rigorous_support: >-
      Canfield-Erdos-Pomerance gives the smooth-number density Psi(x, x^(1/u)) =
      x * u^(-u(1+o(1))) uniformly in the relevant range; Dickman-de Bruijn rho is the
      classical limiting distribution. The polynomial 11m^2 + 11m + 5 has discriminant
      121 - 220 = -99 < 0 and is irreducible over Q, so no systematic algebraic factor
      exists.
    transfer_assumption_stated_explicitly: >-
      p is NOT a random integer - it has the shape 11m(m+1) + 3 and is prime. So p + 2
      inherits congruence biases from that family (for instance its residues modulo
      small primes are constrained by the quadratic in m). The assumption transferred
      is that these biases shift the constant, not the shape, of the largest-prime-factor
      distribution.
    validation_plan: >-
      Sample 500 values m' in a window around the recovered m for which p' =
      11m'(m'+1) + 3 is prime; for each, partially factor p' + 2 with the same
      trial-division-plus-rho-plus-ECM budget; compare the empirical distribution of
      log(largest certified factor)/log(p') against rho(u), and compare it against a
      second sample of 500 uniformly random 204-bit primes q with the same budget
      applied to q + 2. The family-versus-random comparison is the parameter-matched
      negative FOR THE HEURISTIC ITSELF.
    tail_check: compare the smoothest observed sample in each arm against the rho(u)
      prediction for that quantile; report the discrepancy in u.
    falsifier: >-
      A systematic small factor of p' + 2 appearing for all m' in the family (which
      would be an algebraic or congruence obstruction the plan missed), or an empirical
      CDF differing from rho by more than the sampling band.
    sampled_parameters_to_record: [window of m', sample sizes, ECM B1/B2 and curve
        counts, per-sample wall clock, censoring rule for unfinished factorisations]
  - id: H3
    statement: >-
      (Order of the CM scalar.) The scalar lambda = (1 + 11u)/2 mod p by which the
      norm-3 CM endomorphism acts on the group of order p behaves like a uniformly
      random element of F_p^*, so its multiplicative order exceeds K except with
      probability at most K^2/(p-1).
    rigorous_support: >-
      The number of elements of F_p^* of order at most K is at most sum_{d<=K} phi(d)
      <= K^2, so for a UNIFORMLY RANDOM element the bound is a theorem, not a
      heuristic. Only the randomness of this particular algebraically defined lambda is
      assumed.
    why_it_matters: >-
      KN-TECH-018 gives a rho speedup of sqrt(|Aut|) for equivalence-class walks. A
      class walk modulo the group generated by lambda would give sqrt(ord(lambda)) only
      if the orbit is small enough to normalise; a certified lower bound ord(lambda) >
      10^6 shows the orbit cannot be enumerated and therefore that small |D| buys no
      rho discount beyond the sqrt(2) negation factor already inside 0.886.
    validation_plan: >-
      Certify ord(lambda) > K = 10^6 by K modular multiplications, using the SAME
      lower-bound certificate format as IDEA-20260807-98a970 step 3, and record that
      this certificate costs K multiplications to VERIFY as well as to produce. Sample
      validation: repeat over 200 members of the same prime family and record the
      observed rate of ord <= K against the predicted bound K^2/(p-1) (about 2^-163,
      i.e. predicted zero occurrences).
    tail_check: report the smallest observed order across the sample; any occurrence at
      all is a material anomaly.
    falsifier: ord(lambda) <= 10^6 for the target curve, which would change the rho
      lane's margin and require independent review.
  - id: H4
    statement: >-
      (Prime density in the generation family.) Primes of the form 11m(m+1) + 3 occur
      for m in an interval with density C/ln(11m^2) for a Bateman-Horn singular series
      constant C, so the smallest admissible m above 2^100 is found after O(ln p)
      candidates.
    rigorous_support: >-
      None unconditional - this is the Bateman-Horn conjecture for a single irreducible
      quadratic, and no lower bound of the right order is known. What IS rigorous is
      the verification: once a candidate m is found, its primality claim is checked
      under H1, and the compositeness of every smaller candidate is certified by a
      single Fermat witness each.
    distribution_statement_it_imitates: Bateman-Horn / Hardy-Littlewood conjecture F.
    validation_plan: >-
      Count primes in the family over a sampled window of 10^5 consecutive m near
      2^100 and compare the count against the Bateman-Horn prediction with the singular
      series computed over primes up to 10^6; report the ratio and its sampling error.
    tail_check: the observed maximal gap between consecutive family primes versus the
      predicted mean gap.
    falsifier: >-
      The transcript search runs past 10^4 candidates without finding the published p,
      which would either refute the recipe as stated by SRC-SAFECURVES-RIGID or expose
      an additional unstated admissibility filter - either outcome resolves the rigid
      lane in a way that matters.
    note: >-
      H4 is NOT load-bearing for any security statement. It bounds the COST of the
      rigidity lane only. Recorded as a named heuristic because the lane's budget
      depends on it.

  # ===========================================================================
  # 4. CERTIFICATE CATALOGUE
  # ===========================================================================
  certificates:
  - id: C1
    name: primality of p
    content: Pocklington certificate (partial factorisation of p-1 exceeding sqrt(p)
      plus one witness per certified factor) if obtainable, else BPSW plus 64
      Miller-Rabin rounds with the bases recorded.
    verification_cost: a few dozen modular exponentiations (Pocklington) or 64
      exponentiations (fallback).
    succinct: yes for Pocklington, no claim for the fallback (which is not a
      certificate and must never be labelled one).
    depends_on: H1
  - id: C2
    name: base point on curve
    content: the triple (x1, y1) and the two sides of y1^2 = x1^3 + a x1 + b mod p.
    verification_cost: three modular multiplications.
    succinct: yes
    doubles_as: a transcription check for the retrieved digit strings.
  - id: C3
    name: order of the base point
    content: the scalar multiplication transcript establishing l*G = O together with
      G != O; l prime by C1 makes the order exactly l.
    verification_cost: one 204-bit scalar multiplication, about 300 point operations.
    succinct: yes
  - id: C4
    name: anomalousness (the central certificate)
    content: >-
      C1 (p prime) + C2 (G on E) + C3 with l = p, plus the interval argument HD3: p
      divides #E, Hasse bounds #E below 2p, hence #E = p exactly and t = 1.
    verification_cost: dominated by C1 and C3; milliseconds.
    succinct: yes
    significance: >-
      REPLACES POINT COUNTING. No SEA implementation is required anywhere in this plan.
      This is what makes the eleven-lane audit affordable in a pure-Python environment.
    depends_on: [C1, C2, C3, HD3]
  - id: C5
    name: CM data
    content: the integer m; the identity p = 11m(m+1) + 3; the identity 4p - 1 =
      11(2m+1)^2 (HD1); hence t^2 - 4p = -11(2m+1)^2 and D = -11 (HD2); plus the
      j-invariant computation j = 1728 * 4a^3 / (4a^3 + 27b^2) mod p compared against
      -32768 mod p.
    verification_cost: a handful of big-integer operations.
    succinct: yes
  - id: C6
    name: twist order
    content: '#E'' = 2p + 2 - #E = p + 2, derived from C4; plus an independent spot
      check that a generated point on the twist is annihilated by p + 2.'
    verification_cost: one scalar multiplication.
    succinct: yes
  - id: C7
    name: twist factorisation
    content: the list of certified prime factors of p + 2 with a primality certificate
      or fallback per factor, the unfactored cofactor if any, and the trial-division
      bound below which no factor exists.
    verification_cost: one multiplication to recombine plus per-factor primality
      verification.
    succinct: only if the factorisation completes. IF IT DOES NOT, the lane reports an
      INTERVAL, not a value.
    depends_on: H2
  - id: C8
    name: order-of-lambda lower bound
    content: >-
      lambda with lambda^2 - lambda + 3 = 0 mod p (HD4), and the assertion that
      lambda^j != 1 mod p for all j <= K = 10^6, checkable by K modular
      multiplications with no shortcut.
    verification_cost: K = 10^6 modular multiplications. NOT SUCCINCT, and the record
      must say so, exactly as IDEA-20260807-98a970 requires for its lower-bound form.
    depends_on: H3
  - id: C9
    name: generation transcript
    content: >-
      the recovered m*; for every candidate m in (2^100, m*) a base-2 Fermat witness
      certifying that 11m(m+1) + 3 is composite; and the primality certificate C1 for
      the accepted value.
    verification_cost: one modular exponentiation per rejected candidate; the
      transcript length is expected to be O(ln p) under H4.
    succinct: linear in the transcript length, which is small.
    significance: >-
      Turns "fully rigid" from an adjective into a replayable object with a per-step
      witness (OBJ-3).

  # ===========================================================================
  # 5. LANES - THE ELEVEN SAFECURVES CRITERIA
  # ===========================================================================
  lane_field_contract: >-
    Every lane states: mechanism; quantitative prediction with a named metric and
    direction; certificate or explicit bound; the three controls it relies on; budget;
    stopping rule; falsifier; honest limitation. Every lane also carries
    dual_threshold_reporting because of capsule conflict C-2.
  dual_threshold_reporting: >-
    Where a criterion has a numeric threshold, the lane reports the measured quantity
    AND the verdict under BOTH the retrieved criterion-page threshold and the retrieved
    2024 survey threshold, and names which one it is comparing to the intake cell. A
    lane that reports a single verdict without naming its threshold is incomplete.

  lanes:
  - id: L1
    criterion: field
    category: basic_parameter_requirements
    intake_comparison_target: true
    mechanism: >-
      SafeCurves requires a prime field. The measurement is the primality of p and the
      absence of any extension-field structure (p is given as an integer, not as q^k).
    quantitative_prediction:
      metric: primality of p, and bit length of p
      direction: different
      value: p prime; bit length 203 or 204 (HD6 estimates 203.5 bits from the digit
        string). Predicted agreement with the intake cell `field: true`.
    certificate_or_bound: C1
    controls: [CTRL-NULL (same p, so the field lane must return the IDENTICAL verdict
        on every null draw - a field lane whose answer changes when only a and b
        change is broken), CTRL-NEG-2 (different prime, must still certify)]
    budget: 600 s wall clock (dominated by the Pocklington factoring attempt), 1 GB.
    stopping_rule: stop the factoring attempt at 600 s and fall back to H1's
      probabilistic route, recording the fallback explicitly.
    falsifier: p composite, or the digit string failing to match the primary host on
      re-fetch.
    honest_limitation: >-
      A probabilistic primality result is not a certificate. If Pocklington fails, this
      lane's output is a probabilistic claim and every lane depending on C1 - which is
      most of them - inherits that status.
    dual_threshold_note: no numeric threshold in dispute for this cell.
  - id: L2
    criterion: equation
    category: basic_parameter_requirements
    intake_comparison_target: true
    mechanism: >-
      Non-singularity of the short Weierstrass model: 4a^3 + 27b^2 != 0 in F_p, and the
      shape is one of the three SafeCurves-permitted shapes.
    quantitative_prediction:
      metric: 4a^3 + 27b^2 mod p
      direction: different
      value: >-
        Nonzero. The retrieved equation page additionally displayed a "Result" value
        11727648024975671349546803128441217519000050500482270354686052, which is
        presumed to be this quantity; the lane predicts the recomputed value equals
        that string. Predicted agreement with intake cell `equation: true`.
    certificate_or_bound: exact recomputation, three big-integer operations; the
      certificate is the value itself.
    controls: [CTRL-NULL (must be nonzero for every null draw by construction of the
        draw), CTRL-FAULT-1]
    budget: 1 s.
    stopping_rule: none needed.
    falsifier: the recomputed discriminant is zero (curve singular), or differs from
      the retrieved "Result" string.
    honest_limitation: >-
      If the recomputed value differs from the retrieved string, the most likely cause
      is that the retrieved string is not the quantity assumed. That is a source-reading
      failure, not a mathematical finding, and must be reported as such.
  - id: L3
    criterion: base
    category: basic_parameter_requirements
    intake_comparison_target: true
    mechanism: >-
      The published base point lies on the curve, the published order l is prime, and
      l times the base point is the identity.
    quantitative_prediction:
      metric: three booleans (on-curve, l prime, l*G = O)
      direction: different
      value: all three true. Predicted agreement with intake cell `base: true`.
    certificate_or_bound: C2 + C1 + C3
    controls: [CTRL-NULL (a random curve at the same p with the PUBLISHED base point
        must FAIL the on-curve test - this is the test that proves the on-curve check
        has resolving power), CTRL-FAULT-1]
    budget: 5 s beyond L1.
    stopping_rule: abort the lane and escalate as a transcription problem if the
      on-curve test fails; do not attempt to "repair" the coordinates.
    falsifier: any of the three booleans false.
    honest_limitation: >-
      This lane is the transcription check for the two highest-fidelity-risk strings in
      the capsule (x1, y1). A pass is strong evidence the digits are right; a failure
      does not distinguish a proxy typo from a genuinely different published point, and
      the primary host must then be re-fetched before anything else proceeds.
  - id: L4
    criterion: rho
    category: ecdlp_security_requirements
    intake_comparison_target: true
    mechanism: >-
      Cost of the generic parallel-collision search against the prime subgroup,
      modelled by SafeCurves as 0.886*sqrt(l) group operations, with 0.886 = sqrt(pi/4)
      and the sqrt(2) negation discount already folded in (KN-TECH-018).
    quantitative_prediction:
      metric: log2(0.886*sqrt(l))
      direction: different
      value: >-
        2^101.6 to within 0.1 bits (HD6 hand estimate 2^101.56; SRC-SAFECURVES-RHO
        reports 2^101.6). Verdict TRUE against the retrieved criterion-page threshold
        ("above 2^100"); verdict FALSE against the 2024 survey threshold (l >= 2^220,
        while l is about 2^203.5). Intake cell is `rho: true`, which the lane predicts
        is scored against the first threshold.
    certificate_or_bound: exact integer/float computation of 0.886*sqrt(l) with the
      rounding convention recorded; the certificate is the value plus the convention.
    controls: [CTRL-NEG-2 (a 204-bit generic curve must produce the same cost to within
        the same tolerance - this shows the rho lane measures SIZE ONLY and carries no
        information about this curve's structure), CTRL-DECAY not applicable]
    budget: 1 s.
    stopping_rule: none needed.
    falsifier: computed value differs from the retrieved 2^101.6 by more than 0.1 bits,
      indicating a different l or a different cost convention.
    honest_limitation: >-
      THE RHO CELL IS THE MOST MISLEADABLE CELL IN THE TABLE FOR THIS CURVE. A `true`
      here means only "the generic attack is expensive"; it says nothing about the
      non-generic route that lane L5 addresses, and on this curve the two cells point in
      opposite directions. No report may quote the rho cell without the transfer cell
      beside it. This is an observation collision: rho=true has the same observable on
      this curve and on a genuinely rho-bound curve, and the observable carries no
      information distinguishing them.
    dual_threshold_note: REQUIRED here - the cell's verdict flips between the two
      retrieved thresholds (capsule conflict C-2).
  - id: L5
    criterion: transfer
    category: ecdlp_security_requirements
    intake_comparison_target: false
    priority: 1
    mechanism: >-
      Two sub-criteria. (a) ADDITIVE: is #E(F_p) = p? If so the group of order p in
      characteristic p admits an explicit isomorphism onto (F_p, +) and the ECDLP is
      linear time (KN-TECH-033; SRC-SMART-1999; KN-LIT-087; KN-LIT-088). (b)
      MULTIPLICATIVE: is the embedding degree at least (l-1)/100? Sub-criterion (b) is
      DEGENERATE here and is handled in diagnostic D4.
    quantitative_prediction:
      metric: '#E - p, and the boolean (#E == p)'
      direction: different
      value: >-
        #E - p = 0 exactly, hence t = 1. Predicted agreement with intake cell
        `transfer: false`. Predicted attack cost if the transfer were mounted: O(log p)
        field operations, versus 2^101.6 group operations for rho - a collapse from
        exponent 1/2 to polylogarithmic. THE PLAN DOES NOT MOUNT IT.
    certificate_or_bound: C4. NOTE THAT THIS COSTS MILLISECONDS AND NEEDS NO POINT
      COUNTING.
    controls:
    - CTRL-POS (the curve itself; C4 must be producible)
    - CTRL-NEG-1 (the twist, #E' = p + 2; C4 must NOT be producible - this is the
      discriminating control, since the twist shares every other tracked parameter)
    - CTRL-NULL (20 random curves at the same p; C4 must not be producible on any)
    - CTRL-DECAY (the trace ladder, run on generated toy curves only)
    budget: 60 s for the certificate given C1; the decay control is a separate,
      larger item (see D-controls budget).
    stopping_rule: >-
      Stop immediately once C4 is produced or refuted. Do not proceed to implement any
      transfer algorithm under this task family without a separate Coordinator-approved
      contract and the source obligation in capsule conflict C-4 discharged.
    falsifier: >-
      p*G != O, or l as published differs from p, or the interval argument fails. Any of
      these refutes the anomalousness reading of the published tuple and would mean the
      SafeCurves row's description does not match its own published parameters - which
      would be a genuine source conflict and a material finding about the TABLE, not
      about the mathematics.
    explanations_discriminated:
      E1: The published tuple really satisfies #E = p and the row is a faithful
        illustration of the additive transfer.
      E2: The published tuple does not satisfy #E = p, and the agreement between the
        `modulus` string and the `l` string is a retrieval artefact of the proxy channel.
      how_the_outcome_maps: >-
        C4 producible => E1, and the intake cell `transfer: false` is reproduced with a
        certificate. C4 refutable => E2, and the correct action is to re-fetch the
        primary host, NOT to announce a discrepancy in SafeCurves.
    honest_limitation: >-
      Certifying #E = p reproduces the CONDITION of the published attacks. It does not
      reproduce the attacks, does not verify their proofs, and this program has never
      read any of the three papers in full (capsule conflict C-4). The lane's output is
      "the documented precondition holds, certified", and no stronger sentence is
      authorised.
  - id: L6
    criterion: disc
    category: ecdlp_security_requirements
    intake_comparison_target: false
    mechanism: >-
      SafeCurves computes D from the trace: take t^2 - 4p, divide by the largest square
      dividing it, and multiply by 4 unless the result is 1 mod 4. With t = 1 from C4
      this is 1 - 4p, which HD2 predicts equals -11 * (2m+1)^2 exactly.
    quantitative_prediction:
      metric: '|D|, as log2'
      direction: lower
      value: >-
        D = -11, so log2|D| = 3.46. Predicted agreement with intake cell `disc: false`
        under BOTH retrieved thresholds (2^100 and 2^110) - this is the one cell whose
        verdict is threshold-independent by a margin of about 96 bits.
    certificate_or_bound: C5 - closed form, NO FACTORISATION OF t^2 - 4p REQUIRED,
      because HD1 supplies the square factor explicitly once m is known from C9.
    controls:
    - CTRL-NEG-1 (the twist MUST also return D = -11; this demonstrates that the disc
      cell and the transfer cell are independent, which the intake row asserts but does
      not show)
    - CTRL-NULL (random curves at the same p must NOT return D = -11; a disc lane that
      returns -11 for every curve at this prime is reading the prime, not the curve)
    budget: 5 s given C9; 60 s if m must be recovered by search first.
    stopping_rule: if C9 has not produced m, fall back to factoring 4p - 1 directly
      (a 204-bit integer known to be 11 times a square, so this is a square-root
      extraction, not a factorisation) with a 60 s cap.
    falsifier: 4p - 1 is not 11 times a perfect square, or the j-invariant is not
      -32768 mod p.
    honest_limitation: >-
      Small |D| is a CONSTANT-FACTOR concern for rho (KN-TECH-018) and a structural
      marker, not an exponent change. Reporting `disc: false` says the curve has tiny
      CM discriminant; it does not say the ECDLP is easier by any measured amount. The
      quantitative statement about what small D buys is diagnostic D3, and D3's
      predicted answer is "nothing beyond the sqrt(2) already in 0.886".
  - id: L7
    criterion: rigid
    category: ecc_security_beyond_ecdlp
    intake_comparison_target: true
    mechanism: >-
      Replay the published generation recipe (SRC-SAFECURVES-RIGID, and its literature
      source SRC-LMVV-2004): search m upward from 2^100 for the first m with
      11m(m+1) + 3 prime, then take the curve of j-invariant -2^15 over that field and
      the twist with order p. Rigidity is the claim that this transcript has no
      unexplained input.
    quantitative_prediction:
      metric: does the replayed recipe output exactly the published p, and how many
        candidates were rejected
      direction: different
      value: >-
        The replay reproduces the published p, with a rejected-candidate count of order
        ln(p) ~ 141 times the family's admissibility factor (H4). Predicted agreement
        with intake cell `rigid: true`. Manipulation budget predicted to be ZERO free
        bits, since the recipe has no seed.
    certificate_or_bound: C9
    controls:
    - CTRL-NULL for transcripts - run the identical search from a DIFFERENT starting
      point (say 2^101) and confirm it produces a different prime; a search that
      returns the published p regardless of starting point is not measuring the recipe
    - CTRL-FAULT-1 on the Fermat witnesses
    budget: 300 s.
    stopping_rule: stop after 10^4 rejected candidates without a hit and report the
      recipe as NOT REPRODUCED, with the transcript retained (this triggers H4's
      falsifier).
    falsifier: >-
      A smaller admissible m yields a prime p' != published p. That would mean the
      one-line description "smallest prime with m above 2^100" is not sufficient to
      determine the published parameter, i.e. there is an unstated filter - which is a
      real, if minor, finding about the rigidity claim and must be reported as an
      unresolved conflict rather than smoothed over.
    honest_limitation: >-
      Reproducing a transcript shows the process is REPLAYABLE. It cannot show that the
      recipe was not chosen after the fact to land on a desired curve - the recipe
      itself (why 2^100, why D = -11 among the five class-number-one families listed by
      SRC-LMVV-2004) contains design choices that no computation can audit. Rigidity is
      a claim about a search space, and this lane measures only the part of it that was
      written down. Note also that `rigid: true` on a deliberately weak illustrative
      curve is a reminder that rigidity is orthogonal to security.
  - id: L8
    criterion: ladder
    category: ecc_security_beyond_ecdlp
    intake_comparison_target: true
    mechanism: >-
      A Montgomery ladder needs a Montgomery model B y^2 = x^3 + A x^2 + x over F_p,
      whose existence requires a rational point of order 2. HD5: #E = p is an odd prime,
      so E(F_p) has no point of order 2 and no Montgomery model exists over F_p.
    quantitative_prediction:
      metric: number of rational points of order 2
      direction: lower
      value: 0. Predicted agreement with intake cell `ladder: false`, and with the
        retrieved ladder page (Montgomery ladder False, cofactor 1).
    certificate_or_bound: >-
      Derived from C4 by divisibility - the certificate is "#E = p, p odd prime,
      therefore gcd(#E, 2) = 1". Independently checkable by confirming that x^3 + ax + b
      has no root in F_p, via gcd(x^p - x, x^3 + ax + b) computed by modular
      exponentiation of polynomials - one extra check at a cost of about 300 polynomial
      squarings, which is a genuinely independent route to the same conclusion.
    controls: [CTRL-NEG-1 (the twist has order p + 2, which is odd since p is odd -
        so the twist ALSO has no 2-torsion, and this control does NOT discriminate
        here; recorded as a control that fails to discriminate rather than omitted),
      CTRL-NULL (a random curve at the same p has a rational 2-torsion point with
        probability about 1/2, so across 20 draws the ladder lane must report a MIX -
        an all-zero column would show the check is broken)]
    budget: 30 s.
    stopping_rule: none needed.
    falsifier: exhibiting a rational point of order 2, or a Montgomery model - either
      would contradict C4 and indicate an instrument fault, not a mathematical surprise.
    honest_limitation: >-
      "No Montgomery model" is not "no constant-time ladder". Other single-coordinate
      approaches exist for curves without 2-torsion; the lane reproduces SafeCurves'
      criterion as retrieved, and the criterion is about the specific well-understood
      construction. Also, a ladder failure is an implementation-safety property and is
      NOT an ECDLP break, per the goal's claim boundaries.
  - id: L9
    criterion: twist
    category: ecc_security_beyond_ecdlp
    intake_comparison_target: true
    mechanism: >-
      SafeCurves requires the quadratic twist to be secure too - twist rho above the
      threshold, no small prime divisor enabling a small-subgroup attack, and combined
      small-subgroup-plus-invalid-curve cost above the threshold. Twist order is p + 2
      by C6.
    quantitative_prediction:
      metric: log2 of 0.886*sqrt(P1) where P1 is the largest prime factor of p + 2
      direction: lower
      value: >-
        About 2^53.2 (SRC-SAFECURVES-TWIST), i.e. P1 about 2^106.8, with small factors
        including 3^3, 5 and 47 present, and combined cost about 2^53.5. Predicted
        agreement with intake cell `twist: false` under both thresholds.
    certificate_or_bound: >-
      C7 if the factorisation completes. IF IT DOES NOT, the lane reports the INTERVAL
      [0.886*sqrt(largest certified prime factor), 0.886*sqrt(unfactored cofactor)] and
      marks the cell UNRESOLVED. It does not guess.
    controls: [CTRL-NEG-2 (a generic 204-bit curve's twist order should show the
        random-integer factorisation profile of H2), CTRL-NULL (20 random curves at
        the same p - their twist orders give the empirical baseline against which "p+2
        has an unusually small largest factor" would have to be judged, and the plan
        PREDICTS it will not look unusual)]
    budget: 1800 s hard cap for the factoring attempt (trial division to 10^7, Pollard
      rho, then ECM with staged B1), 4 GB.
    stopping_rule: >-
      Stop at 1800 s. Report the certified partial factorisation and the interval.
      Budget exhaustion is an OPERATIONAL observation and is never reported as evidence
      about the twist's security.
    falsifier: >-
      A completed factorisation whose largest prime factor gives a twist rho cost above
      2^100, which would contradict the retrieved 2^53.2 and force a source conflict.
    honest_limitation: >-
      Pure-Python ECM on a 204-bit integer is the single most likely lane to run out of
      budget in this plan. The honest expected outcome is a partial factorisation plus
      an interval, and the plan says so IN ADVANCE rather than reporting a shortfall as
      a finding. Note also that twist failure is an invalid-curve / implementation
      concern and is not by itself an ECDLP break.
  - id: L10
    criterion: complete
    category: ecc_security_beyond_ecdlp
    intake_comparison_target: true
    mechanism: >-
      Complete Edwards formulas require a birational complete Edwards model, which
      requires 4 | #E; the Montgomery route to completeness requires a unique point of
      order 2 with A^2 - 4 a non-square. HD5: #E = p odd prime gives neither.
    quantitative_prediction:
      metric: number of points of order 2 and of order 4
      direction: lower
      value: 0 and 0, matching the retrieved complete page. Predicted agreement with
        intake cell `complete: false`.
    certificate_or_bound: derived from C4 by divisibility (gcd(#E, 4) = 1), with the
      same independent polynomial-gcd cross-check as L8.
    controls: same as L8, plus CTRL-FAULT-1.
    budget: 30 s (shared with L8).
    stopping_rule: none needed.
    falsifier: exhibiting a point of order 2 or 4; would contradict C4 and indicate
      instrument fault.
    honest_limitation: >-
      Absence of a COMPLETE model in the two named families is not a proof that no
      exception-free addition law exists for this curve in any representation. The lane
      reproduces the retrieved criterion, no more. Not an ECDLP break.
  - id: L11
    criterion: ind
    category: ecc_security_beyond_ecdlp
    intake_comparison_target: true
    mechanism: >-
      The retrieved ind criterion offers three routes: Elligator 2, which needs the
      form y^2 = x^3 + Ax^2 + Bx with AB(A^2-4B) nonzero and therefore needs a rational
      point of order 2; Elligator 1, which needs p = 3 mod 4 and a complete Edwards
      model (4 | #E); and a Hessian route, which needs 3 | #E. HD5 kills all three at
      once, since #E = p is an odd prime greater than 3.
    quantitative_prediction:
      metric: number of the three named routes that are available
      direction: lower
      value: 0 of 3. Predicted agreement with intake cell `ind: false` and with the
        retrieved ind page ("Elligator 2: No").
    certificate_or_bound: derived from C4 by divisibility; certificate is the triple of
      gcd computations gcd(#E,2), gcd(#E,3), gcd(#E,4) all equal to 1.
    controls: [CTRL-NULL (across 20 random curves at the same p, roughly half should
        admit Elligator 2; an all-negative column indicates a broken check),
      CTRL-FAULT-1]
    budget: 5 s.
    stopping_rule: none needed.
    falsifier: any of the three routes turning out to be available, which would
      contradict C4.
    honest_limitation: >-
      IMPORTANT SCOPE STATEMENT. `ind: false` means the three named encodings do not
      apply. It is NOT a theorem that no indistinguishability encoding exists for this
      curve - broadly applicable encodings in the Shallue-van de Woestijne family are
      known to cover curves without special torsion, and this session did not retrieve
      any source on whether SafeCurves considered them. Reporting `ind: false` as "this
      curve cannot be encoded" would overstate the criterion. Not an ECDLP break.

  cascade_structure:
    statement: >-
      Six of the eleven cells are not independent measurements. L5 (transfer), L6
      (disc), L8 (ladder), L9 (twist, via C6), L10 (complete) and L11 (ind) all descend
      from the single certificate C4, plus C5 for L6 and C7 for L9.
    consequence_for_cost: >-
      The audit's dominant costs are C1 (primality) and C7 (twist factorisation).
      Everything else is milliseconds. This is the reduction-network cascade heuristic
      applied to an audit rather than to a theorem.
    consequence_for_epistemics: >-
      A cascade is a CORRELATED failure mode. If C4 is wrong, six cells are wrong
      together and they will still look mutually consistent, because they were derived
      from the same fact. THAT is why L8, L10 and L11 each carry an INDEPENDENT
      cross-check (polynomial gcd for 2-torsion) that does not route through C4, and
      why CTRL-NULL must produce a MIXED column on those lanes. Consistency among
      derived cells is not corroboration.

  # ===========================================================================
  # 6. DECLARED ADDITIONAL DIAGNOSTICS
  # ===========================================================================
  diagnostics:
  - id: D1
    declared_diagnostic: complete curve and twist order factorization with checkable
      certificates
    status: planned
    mechanism: '#E = p is prime by C1+C4, so the curve-order factorisation is trivial
      and fully certified. The twist order p + 2 requires C7.'
    prediction:
      metric: fraction of p + 2 certified as a product of certified primes
      direction: different
      value: >-
        No target is set. This is an environment measurement (following
        IDEA-20260807-98a970's honest treatment of the same problem). A partial
        factorisation is an honest outcome, not a failure.
    certificate_or_bound: C7 plus the trial-division bound as an explicit lower bound
      on any missed factor.
    controls: [CTRL-NEG-2, CTRL-NULL, H2's own family-versus-random validation arm]
    budget: shared with L9 (1800 s).
    stopping_rule: as L9.
    falsifier: a recombination check that does not reproduce p + 2.
    honest_limitation: pure-Python ECM; see L9.
  - id: D2
    declared_diagnostic: subgroup, cofactor, and invalid-curve confinement costs
    status: planned
    mechanism: >-
      With cofactor 1 and prime order there is no small-subgroup attack ON THE CURVE.
      The exposure is on the twist: an implementation that accepts an unvalidated
      x-coordinate can be pushed onto E' whose order p + 2 has small factors. The
      diagnostic is the cost of the cheapest confinement attack, computed from C7.
    prediction:
      metric: log2 of the cheapest combined small-subgroup plus invalid-curve cost
      direction: lower
      value: about 2^53.5 per SRC-SAFECURVES-TWIST, conditional on C7 completing.
    certificate_or_bound: C7 plus an explicit statement of the attack model assumed
      (which inputs are validated).
    controls: [CTRL-NEG-1, CTRL-NULL]
    budget: 60 s given C7.
    stopping_rule: report UNRESOLVED if C7 is partial.
    falsifier: the computed cost differs from the retrieved 2^53.5 by more than the
      stated rounding.
    honest_limitation: >-
      This is a cost under an assumed implementation model. It is a statement about
      implementations that skip validation, not about the curve, and it is not an ECDLP
      break.
  - id: D3
    declared_diagnostic: automorphism- and endomorphism-adjusted rho cost
    status: planned
    priority: 2
    mechanism: >-
      D = -11 is not -3 or -4, so Aut(E) = {+/-1} and the equivalence-class rho speedup
      is exactly the sqrt(2) already folded into 0.886 (KN-TECH-018). The remaining
      question is whether the norm-3 CM endomorphism supports a larger class walk. It
      acts on the order-p group as multiplication by lambda with lambda^2 - lambda + 3 =
      0 mod p (HD4), and a class walk modulo <lambda> requires normalising an orbit of
      size ord(lambda).
    prediction:
      metric: certified lower bound on ord_p(lambda)
      direction: higher
      value: '> 10^6, hence no usable class walk, hence adjusted rho cost = 2^101.6
        with discount factor exactly 1.0 relative to the negation-included baseline.'
    certificate_or_bound: C8 (explicitly NOT succinct - K = 10^6 multiplications to
      verify).
    controls: [CTRL-FAULT-2, CTRL-NEG-2, H3's 200-member family sample]
    budget: 120 s.
    stopping_rule: stop at K = 10^6.
    falsifier: >-
      ord(lambda) <= 10^6. That would mean small |D| buys a genuine sqrt(ord) rho
      discount on this curve, would change the rho lane's margin, and is a material
      finding requiring independent review before any external statement.
    explanations_discriminated:
      E1: Small |D| gives a scalar-multiplication (GLV) benefit and no rho discount
        beyond negation.
      E2: Small |D| gives a sqrt(m) rho class-walk discount for some enumerable m.
      how_the_outcome_maps: 'ord(lambda) > 10^6 => E1; ord(lambda) small => E2 and the
        rho cell must be re-scored.'
    honest_limitation: >-
      A lower bound of 10^6 on the order rules out an ENUMERABLE orbit. It does not
      prove no cleverer use of the endomorphism exists, and it is a constant-factor
      question in any case - KN-TECH-018 is explicit that these discounts never move
      the exponent 1/2.
  - id: D4
    declared_diagnostic: embedding-degree certificate or explicit search bound
    status: planned - REUSED FROM IDEA-20260807-98a970, NOT DUPLICATED
    reuse_statement: >-
      This diagnostic does not mint a new mechanism. It specialises
      IDEA-20260807-98a970 (steps 2 and 3, its three degenerate flags, and its two
      certificate formats) to this single curve, and it supplies that record with the
      planted positive its own null_object_control demands.
    mechanism: >-
      The embedding degree is ord_l(p). Here l = p, so p mod l = 0 and ord_l(p) IS
      UNDEFINED - the multiplicative order of 0 does not exist. The degenerate flag
      "N = p" of IDEA-20260807-98a970 fires, and it is the ONLY row in that record's
      whole programme that is expected to fire on any of the three flags.
    prediction:
      metric: the pipeline's output on this row
      direction: different
      value: >-
        UNDEFINED / ANOMALOUS-FLAG, not a numeric k. IDEA-20260807-98a970 predicted
        ZERO degenerate flags across standardised curves; this curve is the deliberate
        counterexample that proves the flag can fire at all.
    certificate_or_bound: the single modular reduction p mod l = 0, plus the flag.
    controls: [CTRL-FAULT-2 (the planted k=12, k=1, k=2 positives from
        IDEA-20260807-98a970 must be returned correctly first), CTRL-NEG-2]
    budget: 10 s.
    stopping_rule: none needed.
    falsifier: >-
      THE PIPELINE RETURNS A NUMERIC EMBEDDING DEGREE FOR THIS ROW. That is an
      interface defect - a division-by-zero or a silent modular-arithmetic edge case -
      and it would void the corresponding column of IDEA-20260807-98a970's table until
      fixed.
    explanations_discriminated:
      E1: The embedding-degree pipeline handles l = p as a declared degenerate case.
      E2: The pipeline computes something anyway, in which case its "no degenerate
        flags" result across standardised curves was never tested against a firing
        input.
    honest_limitation: >-
      This diagnostic tests an INSTRUMENT, not the curve. Its value to this goal is
      small; its value to IDEA-20260807-98a970 is large, and that asymmetry is stated
      rather than hidden.
  - id: D5
    declared_diagnostic: CM discriminant and conductor structure
    status: planned
    mechanism: >-
      D = -11 has class number 1 and the order Z[(1+sqrt(-11))/2] is maximal. The
      conductor of the order generated by Frobenius is f where t^2 - 4p = f^2 * D; HD2
      predicts f = 2m+1 exactly. The endomorphism ring is then determined between
      Z[pi] and the maximal order.
    prediction:
      metric: conductor f, and the ratio log2(f)/log2(p)
      direction: different
      value: f = 2m + 1, about 2^101, so f is about sqrt(p) - the index of Z[pi] in the
        maximal order is enormous, which is the structural reason a tiny |D| coexists
        with a 204-bit prime.
    certificate_or_bound: C5 - exhibit m, check 4p - 1 = 11(2m+1)^2 exactly.
    controls: [CTRL-NEG-1 (twist: same D, same f), CTRL-NULL (random curves at the same
        p must not admit this identity)]
    budget: 10 s.
    stopping_rule: none needed.
    falsifier: 4p - 1 is not 11 times a perfect square.
    honest_limitation: >-
      Conductor structure is descriptive. This program has no record connecting a large
      conductor to any ECDLP cost, and none is asserted here.
  - id: D6
    declared_diagnostic: model-conversion exceptional sets
    status: planned, reduced scope
    mechanism: >-
      Enumerate which alternative models this curve admits and what the exceptional set
      of each conversion is. By HD5 the Montgomery, complete-Edwards and Hessian
      conversions do not exist at all, so their exceptional sets are vacuous and the
      only live conversions are within short Weierstrass (isomorphisms u^4 a, u^6 b) and
      to Jacobian/projective coordinates, whose exceptional set is the point at
      infinity.
    prediction:
      metric: number of admissible non-Weierstrass models
      direction: lower
      value: 0
    certificate_or_bound: derived from C4 by divisibility; the same gcd triple as L11.
    controls: [CTRL-NULL (random curves at the same p must admit Montgomery about half
        the time)]
    budget: 10 s.
    stopping_rule: none needed.
    falsifier: an admissible Montgomery or Edwards model.
    honest_limitation: >-
      Reduced scope is honest, not evasive: for a curve with trivial rational torsion
      there is very little model-conversion surface to audit, and the diagnostic
      therefore returns a near-empty answer BY CONSTRUCTION rather than by measurement.
      Recorded so that a reader does not mistake an empty result for a strong one.
  - id: D7
    declared_diagnostic: scalar and multiscalar formula exceptional-case search
    status: planned, reduced scope, with an explicit successor condition
    mechanism: >-
      For the affine and Jacobian short-Weierstrass addition laws, enumerate the input
      pairs where the generic formula fails (P = Q, P = -Q, either input at infinity)
      and measure the probability that a random scalar multiplication using a fixed
      addition chain hits one. With prime order p and no small torsion, the doubling
      exception is structural rather than incidental.
    prediction:
      metric: probability that a uniformly random scalar multiplication hits an
        exceptional case in a fixed left-to-right double-and-add chain
      direction: lower
      value: about 2^-100 for accidental hits (heuristic: an accidental P = +/-Q event
        requires a collision among about 2^8 intermediate values in a group of size
        2^203.5), with the structural P = Q doubling case occurring on every step by
        design.
    certificate_or_bound: an explicit enumeration of the formula's exceptional set plus
      a stated bound, NOT a measurement.
    controls: [CTRL-FAULT-1, CTRL-NULL]
    budget: 300 s.
    stopping_rule: enumeration only; no random search beyond 10^5 trials.
    falsifier: an exceptional case reachable with probability materially above the
      stated bound.
    honest_limitation: >-
      This is an implementation-hygiene diagnostic tied to a specific chosen formula
      set. It says nothing about the curve and nothing about the ECDLP, and its result
      changes if the implementation changes.
    successor_condition: >-
      If the goal later needs a constant-time implementation claim, this diagnostic must
      be re-scoped against the exact formula set that implementation uses; the present
      scope is the textbook affine and Jacobian laws only.
  - id: D8
    declared_diagnostic: deterministic parameter-generation transcript audit
    status: planned
    mechanism: identical to L7; the transcript object OBJ-3 with per-candidate Fermat
      witnesses.
    prediction:
      metric: transcript length (rejected candidates) and whether the replay reproduces
        the published p
      direction: different
      value: replay reproduces p; transcript length O(ln p) under H4.
    certificate_or_bound: C9.
    controls: [CTRL-NULL for transcripts (different start point must give a different
        prime), CTRL-FAULT-1]
    budget: shared with L7 (300 s).
    stopping_rule: as L7.
    falsifier: as L7.
    honest_limitation: as L7 - a replayable transcript does not audit the choice of
      recipe.
  deferred_diagnostics: []
  deferral_note: >-
    No declared diagnostic is deferred. Two (D6, D7) are planned at REDUCED SCOPE, and
    each states why the reduction is structural rather than a budget compromise, plus
    what would reopen it. Recorded here explicitly so that the completion gate's
    "reason and successor condition for a deferred diagnostic" is answered as "none
    deferred; two reduced, with reasons and successor conditions stated in place".

  # ===========================================================================
  # 7. EXECUTION ORDER, BUDGET, AND STOPPING
  # ===========================================================================
  execution_order:
  - step: 0
    action: Re-fetch safecurves.cr.yp.to DIRECTLY and re-read every digit string and
      cell. BLOCKING for any comparison against the intake table.
    reason: every SafeCurves datum in the capsule came through a summarising proxy with
      a demonstrated defect.
  - step: 1
    action: Run CTRL-FAULT-1 and CTRL-FAULT-2. BLOCKING.
  - step: 2
    action: L1 (C1), L2, L3 (C2, C3).
  - step: 3
    action: L5 (C4) with CTRL-POS, CTRL-NEG-1, CTRL-NULL x20. BLOCKING for the cascade.
  - step: 4
    action: L7/D8 (C9) to recover m; then L6/D5 (C5).
  - step: 5
    action: L8, L10, L11, D6 (cascade cells plus their independent polynomial-gcd
      cross-checks).
  - step: 6
    action: L4, D3 (C8), D4.
  - step: 7
    action: L9, D1, D2 (C7) - the long pole.
  - step: 8
    action: D7.
  - step: 9
    action: CTRL-DECAY, on generated toy curves only, as a separate contract.
  cheapest_decisive_subset: steps 1-3. Under two minutes of compute excluding the
    primality attempt, and they settle the load-bearing question of the whole goal.
  budget_summary:
    total_compute_wall_clock_seconds: 3600
    dominant_items: [L1 primality 600 s, L9/D1 twist factorisation 1800 s, L7/D8
        transcript 300 s, D7 300 s]
    memory_gb: 4
    environment_assumption: pure Python, no Sage, per IDEA-20260807-98a970's recorded
      environment constraint. If a computer-algebra system IS available, L1 and L9
      become easy and the plan should be re-costed rather than re-designed.
  global_stopping_rules:
  - Stop and escalate on the FIRST contradiction between a produced certificate and a
    preregistered intake cell; do not continue collecting cells past a contradiction.
  - Stop and escalate on ANY control failure; every measurement is void.
  - A budget stop is recorded as an operational observation with the partial artifact
    retained. It is never negative mathematical evidence (AGENTS.md core rule 5, and
    the goal's own claim boundaries).

  # ===========================================================================
  # 8. HONEST ACCOUNTING
  # ===========================================================================
  target_complexity:
    claim: NO NEW ATTACK EXPONENT IS CLAIMED BY THIS PLAN.
    published_result_being_reproduced_as_a_control:
      time_exponent: O(log p) field operations for the ECDLP when #E(F_p) = p
        (KN-TECH-033; SRC-SMART-1999 abstract; KN-LIT-087 as reported).
      memory_exponent: O(log p) bits.
      best_known_generic_alternative_on_this_curve: rho at 0.886*sqrt(l), about 2^101.6
        group operations with O(1) memory (KN-TECH-001, KN-TECH-006 via KN-TECH-018).
      exponent_delta: a collapse from p^(1/2) to (log p)^(O(1)) - published in
        1998-1999 and attributable entirely to Semaev, Satoh-Araki and Smart.
      contribution_of_this_plan_to_that_delta: ZERO.
    audit_cost:
      time: dominated by one primality certificate and one 204-bit factorisation
        attempt; every other lane is milliseconds because C4 replaces point counting.
      memory: O(log p) for all lanes except ECM, which is bounded by its stage-2 table.
      verification_cost_of_the_emitted_certificates: >-
        Succinct for C2-C6, C9. NOT succinct for C8, which genuinely costs 10^6
        modular multiplications to verify, and the record must say so.
    hidden_overhead: >-
      The o(1) that matters here is not asymptotic but evidentiary: the cascade means
      six cells cost almost nothing ONLY because they inherit C4's correctness. The
      real cost of the audit is the independent cross-checks that break the cascade.
    tradeoff_note: >-
      One genuine tradeoff inside the plan: L9 can have a succinct certificate (complete
      factorisation, expensive to produce) or an interval (cheap, and honest about what
      is unknown). The plan pre-commits to the interval when the budget runs out.
  dominated_by:
    as_an_attack: >-
      n/a - no attack is claimed or mounted. Had one been mounted it would be dominated
      entirely by the published additive transfer (KN-TECH-033), which is already
      linear time on exactly this curve class; there is no room below it.
    as_an_audit_instrument: >-
      Dominated on authority by SafeCurves itself, which published these verdicts and
      the scripts behind them years ago, and by the ordinary parameter-validation
      procedures mandated in ANSI X9.62-style and SEC-style standards. This plan
      dominates neither on speed, coverage, nor correctness. What it adds is that the
      cells would exist INSIDE this program with re-verifiable certificates and a
      declared control regime.
    frontier_rows_checked: [rho 0.886*sqrt(n) with O(1) memory (KN-TECH-001,
        KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS (KN-TECH-031)
        and its n^(2/3+o(1)) full cost (KN-TECH-035); MOV/Frey-Ruck at small embedding
        degree (KN-TECH-032); the additive transfer (KN-TECH-033); SafeCurves'
        published table (SRC-SAFECURVES-*); Bernstein-Lange 2024 (SRC-BL-2024)]
  sota_delta:
    speedup_against_any_attack_baseline: 0 on every axis - time, memory, data, queries.
    delta_as_data: >-
      This program currently holds ZERO certified cells for this curve and ZERO
      certificates of any kind for it. The plan would produce 11 criterion cells plus 8
      diagnostic rows, of which 9 carry succinct certificates, 1 carries an explicitly
      non-succinct bound (C8), and 1 (L9) is expected to carry an interval.
    delta_as_scope: >-
      Converts "SafeCurves says this row is False on transfer" from a table cell into a
      millisecond-verifiable certificate C4 plus a declared control regime that shows
      the test can also come back negative (CTRL-NEG-1, CTRL-NULL).
  premature_closure_check:
    declined_to_generate: false
    statement: >-
      This plan does NOT declare the lane closed. The additive transfer on this curve is
      published and is used here as a control, which is a statement about THIS curve's
      role, not a claim that trace-one structure has nothing left to give. Two live
      directions are named in the task report's open_directions.

  interpretation_limits:
  - Nothing here is evidence. A plan is not a measurement.
  - Reproducing an intake cell with a certificate confirms the CELL, scoped to the
    threshold named, the parameters tested, and the code path used - and to nothing else.
  - A failure of rigid, ladder, complete, or ind is not an ECDLP break, per the goal's
    claim boundaries, and no composite "safe/unsafe" verdict is authorised by this plan.
  - Certifying that #E = p reproduces the documented PRECONDITION of the published
    attacks. It does not verify their proofs; this program has read none of the three
    papers in full.
  - Every conclusion is scoped to a single 204-bit curve. Nothing transfers to any other
    curve, and in particular nothing here says anything about any deployed parameter set.
