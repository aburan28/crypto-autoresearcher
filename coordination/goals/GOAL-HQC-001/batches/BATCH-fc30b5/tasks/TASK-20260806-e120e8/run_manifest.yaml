    - path: coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260806-77a574/pilot_injection.py
      sha256_expected: 629105382f4be37dd9eb70128337e6e638a93a21643056e82d161e7de5fe72a9
      sha256_actual: 629105382f4be37dd9eb70128337e6e638a93a21643056e82d161e7de5fe72a9
      match: true
      loaded: importlib.util, read-only, fail-closed on mismatch
      reused_symbols: [make_defected_decode_blocks]
      modified_on_disk: false
