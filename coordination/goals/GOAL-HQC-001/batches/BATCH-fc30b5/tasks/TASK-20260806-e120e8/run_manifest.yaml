  seeds_and_randomness:
    prng: >-
      SHA-256 counter mode (stage_a.py's own CTRStream), unmodified. Key
      derivation is stage_a.py's own sha_key(ps_id, "T", shard, MASTER_SEED),
      called internally by the unmodified _t_shard -- this task supplies
      only the shard index, not a new derivation scheme.
    master_seed: 20260804 (stage_a.py's own MASTER_SEED, unmodified, reused)
    shard_sanity_check: 424242 (the Red Team's own probe shard,
      TASK-20260806-92aecb; regenerated here ONLY to validate this task's
      implementation against their reported numbers)
    shard_defected_arm_reuse: 5000 (the pilot's own defected-arm shard)
    shard_undefected_arm_reuse: 6000 (the pilot's own undefected-arm shard)
    no_new_shard_ids_requested: true
    only_source_of_randomness: the above three shard ids, decoded twice
      each (true + V3-defected) via the reused, unmodified decode_blocks
      and reused, unmodified make_defected_decode_blocks; no other
      randomness is used anywhere in matched_pair_reanalysis.py.

  budget:
    core_seconds_authorized: 200.0
    core_seconds_spent: 10.789
    wall_seconds_authorized: 1800.0
    wall_seconds_spent: 10.395
    within_budget: true
    memory_gb_authorized: 2
    peak_memory_observed: not separately instrumented; process footprint at
      3 x 5,000 trials of (56, 7168)-shaped uint8/int arrays, each decoded
      twice, is on the order of low tens of MB, far under the 2 GB
      authorization.
    cores_used: 1 (no multiprocessing -- _t_shard called directly, single
      process, identical convention to the pilot this task reanalyzes)

  bit_identical_reproduction_check:
    shard_5000_defected_arm:
      our_S_histogram_matches_pilot_reported: true
      compared_to: pilot_results.json.MEASUREMENT.defected.S_histogram
    shard_6000_undefected_arm:
      our_S_histogram_matches_pilot_reported: true
      compared_to: pilot_results.json.MEASUREMENT.undefected.S_histogram
    fail_closed: true
    note: >-
      Both checks pass EXACTLY (bit-for-bit integer histogram match, all 57
      bins each). A mismatch on either would have raised SystemExit before
      reanalysis_results.json was written.

  sanity_check_vs_red_team:
    shard: 424242
    all_pass: true
    checks_count: 14
    headline_matches:
      flips: '533/5000, exact match to red_team_report.md Section 0'
      k17_diff: '+0.1922, exact match to red_team_report.md Section 0'
      k17_power_ratio: '2.782x measured vs. 2.78x reported'
    fail_closed: true
    note: >-
      This task's own matched-pair implementation was validated against the
      Red Team's independently reported numbers BEFORE any pilot-shard
      (5000/6000) result was computed. A failure would have raised
      SystemExit before any new result was reported.

  fail_closed_checks:
    - name: stage_a.py sha256 integrity
      reads: STAGE_A_PY_EXPECTED_SHA256 (module constant) vs sha256_file(STAGE_A_PY)
      aborts_on_mismatch: true
      verified_by: >-
        deliberate-mismatch dry run inside the authorized run itself
        (selftest_fail_closed_sha_mismatch(), executed automatically before
        any real module load). See
        reanalysis_results.json.fail_closed_selftests.stage_a_sha256_pin_mismatch.
      fired_in_authorized_run: false (the REAL load, with the correct pin,
        succeeded; only the deliberate-mismatch selftest call fired)
    - name: measure.py / pilot_injection.py sha256 integrity
      reads: expected sha256 constants vs sha256_file() of each path
      aborts_on_mismatch: true
      verified_by: same load_module() function/mechanism as stage_a.py's
        check; all three pins additionally cross-checked explicitly against
        R["provenance"].*_sha256_match before any computation proceeds
        (a redundant, explicit FAIL-CLOSED gate beyond load_module()'s own
        abort).
      fired_in_authorized_run: false
    - name: reused defect wrapper identity check
      reads: pilot_injection.make_defected_decode_blocks(...).__wrapped_original_id__
        vs id(stage_a.decode_blocks)
      aborts_on_mismatch: true
      verified_by: R["injection_reused"].wrapper_calls_unmodified_function,
        explicitly checked and gated with SystemExit on failure.
      fired_in_authorized_run: false
    - name: bit-identical reproduction check (design.md Section 2.3)
      aborts_on_mismatch: true
      fired_in_authorized_run: false (both checks passed exactly)
    - name: sanity check vs. Red Team's reported numbers (design.md Section 2.2)
      aborts_on_mismatch: true
      fired_in_authorized_run: false (all 14 checks passed)
    - name: D2/D3 hard invariants on regenerated shards 5000/6000
      aborts_on_mismatch: true
      fired_in_authorized_run: false (0 violations on both)
    - name: truncation check on regenerated shards 5000/6000
      aborts_on_mismatch: true
      fired_in_authorized_run: false (neither truncated)

  validity:
    status: valid_measurement
    reason: >-
      All pre-registered mechanically-sound criteria (design.md Section 4)
      were met: sha256 pins verified for all three reused modules, the
      reused defect wrapper genuinely calls the unmodified decode_blocks,
      the sanity check against the Red Team's reported numbers passed (14/14),
      the bit-identical reproduction check against pilot_results.json's own
      histograms passed exactly, neither regenerated shard was truncated,
      D2/D3 are clean on both regenerated shards, and the estimator returns
      a finite value at the load-bearing order k=m=17 on the combined
      matched-pair data.
    certificate:
      kind: none
      reason: >-
        This run makes no discrete-log-solve or factor-base-relation claim;
        AGENTS.md/docs/claims-and-verification.md's certificate discipline
        does not apply beyond the fail-closed sanity/bit-identical
        self-integrity checks already performed, which are self-integrity
        checks on the reanalysis method itself, not a solution certificate.
        This is a joint-moment-estimator reanalysis on a toy-scale reduced
        parameter set.

  protocol_deviations:
    - >-
      No raw per-trial data exists in pilot_results.json (by the pilot's own
      design, to keep the JSON small), so a literal "read the pilot's raw
      data" matched-pair analysis was not possible. Per this batch's
      explicit dispatch-queue authorization, this task instead regenerated
      the pilot's own shards (5000, 6000) deterministically via stage_a.py's
      real _t_shard with the SAME seeds the pilot used, and verified the
      regeneration is bit-identical to what the pilot reported before
      reporting any new result. This is disclosed and pre-registered in
      design.md Section 1/2.3, not discovered after the fact.
    - >-
      This task additionally regenerated the Red Team's own probe shard
      (424242) -- not a shard the PILOT used, but a shard already used and
      reported by the RED TEAM (TASK-20260806-92aecb) in this campaign's
      committed record -- solely to validate this task's own matched-pair
      implementation against their independently reported numbers before
      computing any new result. This regeneration is reported separately
      (reanalysis_results.json.sanity_check_vs_red_team) and is explicitly
      NOT counted among the primary reported matched-pair results (which
      use only the pilot's own shards 5000/6000). Disclosed and
      pre-registered in design.md Section 2.2.
    - >-
      The required-T derivation (design.md Section 3) required choosing a
      power/precision target not explicitly specified by the dispatch
      queue's prose beyond "state your power/precision target explicitly."
      This task chose two-sided alpha=0.05, power=0.90 (z_sum=3.2415),
      stated in design.md BEFORE any required-T number was computed, as
      required by the completion gate. This is a disclosed executor choice
      within the task's discretion, not a deviation from a pre-specified
      value.

  unexpected_observations:
    - >-
      None of the four independent Delta_p (net marginal-shift) point
      estimates obtained across this task and the Red Team's own probe
      (+0.0082, +0.0026, -0.0022, +0.0002, at T=5,000-10,000 each) is
      itself statistically distinguishable from zero (McNemar-style
      |z|<2 in every case), despite the local block-level flip rate being
      enormously significant (z~24-35) in every one of the same samples.
      This was not anticipated in design.md and is reported here as an
      observation discovered during this task's own execution, not
      smoothed over: it materially widens the uncertainty on the
      required-T derivation (Section required_T_derivation.delta_p_reliability
      in reanalysis_results.json), and is reported prominently in
      reanalysis_report.md Section 5.1 rather than only in the raw JSON.
    - >-
      The required-T dilution model produces a closed form,
      Delta(log2_A_k) = (k/n_e)*Delta_p/ln(2) * [mubar_{k-1}/mubar_k - 1/q_hat],
      whose bracket term is exactly zero under i.i.d. block failures (since
      log2_A_k is defined to subtract out the marginal-rate-driven part of
      mubar_k). This produces substantial near-cancellation at every
      reported k (the two Taylor terms are of comparable magnitude and
      opposite sign), which is why the derived required-T is 2-4 orders of
      magnitude larger than the specification's undefected-estimator
      T_req=3.09e5. Verified independently via a closed-form recomputation
      that reproduces the code's per-k output to machine precision. Not
      anticipated in design.md's Section 3.2 sketch (which stated the model
      but did not predict this magnitude of cancellation); reported as an
      observation in reanalysis_report.md Section 5.2.

  infrastructure_or_timeout_events: none

  results_determinism_check:
    description: >-
      All headline numbers (flip counts, log2_Ahat_k point estimates,
      jackknife SEs, bit-identical histograms) are bit-identical between
      the uncharged prior shakedown and the authorized run, as expected
      from identical deterministic seeds and code. Timing (core-seconds)
      differs slightly between the two invocations (10.60 vs 10.79), as
      expected CPU-scheduling noise, not a property of the deterministic
      computation.
