  scope_statement: >-
    MATCHED-PAIR REANALYSIS of TASK-20260806-77a574's already-collected
    pilot data, plus a defect-specific required-T derivation. NO NEW
    (T)-SAMPLING: every shard regenerated by this task (5000, 6000, 424242)
    was already used somewhere in this campaign's committed record before
    this task ran. PS-R3 only, V3 defect class, decode_blocks last-block
    injection point. NOT the full T_req run, NOT a positive-control pilot.
    Nothing here is a statement about HQC, A17, any decoding-failure rate,
    or any standardized parameter set.

  the_authorized_run:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 python3 matched_pair_reanalysis.py --out-dir .
    working_directory: coordination/goals/GOAL-HQC-001/batches/BATCH-fc30b5/tasks/TASK-20260806-e120e8
    exit_code: 0
    stdout_log: stdout.log
    stderr_log: stderr.log
    stderr_empty: true
    started_at_utc: '2026-08-06T22:36:58Z'
    finished_at_utc: '2026-08-06T22:37:09Z'
    runs_authorized: 1
    runs_used: 1

  data_provenance_no_new_sampling:
    claim: >-
      TRUE. No new (T)-sampling was performed. Every shard this task
      decoded (5000, 6000, 424242) was already used somewhere in this
      campaign's committed record BEFORE this task ran: 5000/6000 by the
      pilot itself (TASK-20260806-77a574), 424242 by the Red Team's own
      probe (TASK-20260806-92aecb, red_team_report.md Section 0, an
      already-committed record this task's read_scope includes).
    mechanism: >-
      pilot_results.json retains only summary histograms (its own script
      explicitly drops the raw F array before serializing -- "F arrays are
      large; drop before serializing"), so a matched-pair reanalysis is not
      computable from pilot_results.json alone. This task therefore
      regenerated each of the three shards' bits DETERMINISTICALLY via
      stage_a.py's real, unmodified _t_shard(), using the identical
      MASTER_SEED/DERIV_STRING/sha_key() derivation the pilot and the Red
      Team both used (same shard id -> same key -> same per-trial domain ->
      bit-identical draws), and decoded each already-generated batch of
      bits TWICE per call (real decode_blocks, then
      pilot_injection.py's own make_defected_decode_blocks, imported
      unmodified) via a decode_blocks monkey-patch. This is an additional
      decode call on already-generated bits, not an additional random draw.
      No shard id outside {5000, 6000, 424242} was ever requested by this
      task.
    verified_by: >-
      Section "bit_identical_reproduction_check" below (shards 5000/6000
      against pilot_results.json's own committed histograms, exact match)
      and "sanity_check_vs_red_team" below (shard 424242 against
      red_team_report.md's own reported numbers, exact/near-exact match).
      Both are FAIL-CLOSED: reanalysis_results.json.json would not have
      been written, and this manifest would not exist, had either check
      failed.

  uncharged_prior_shakedown:
    ran: true
    where: session scratch space (not committed, not a deliverable), out-of-tree
    what: >-
      The identical matched_pair_reanalysis.py, with identical constants
      (same shard indices 424242/5000/6000, same trial counts), run once to
      catch implementation bugs before spending the single authorized run --
      identical precedent to TASK-20260806-77a574's own
      uncharged_prior_shakedown practice. Because the shard indices and seed
      derivation are identical, the shakedown's output is bit-identical to
      the authorized run's (verified directly: sanity-check flip count 533
      in both, k=17 combined diff +0.05156735022229597 in both, validity
      status valid_measurement in both) -- expected and recorded as a
      determinism confirmation, not a second independent measurement. The
      authorized run's own timing (core-seconds) differs slightly from the
      shakedown's (10.79 vs 10.60 core-s), as expected for wall-clock/CPU-
      scheduling noise between two separate process invocations of the same
      deterministic computation.
    py_compile_check: >-
      The shakedown run itself is the compile/execution check (script ran
      to completion with exit code 0 before the authorized run was
      invoked).

  git:
    commit: de450e9a9a7a67faeb57645857216e989bd19007
    branch: claude/hqc-experiments-6unh3p
    dirty_at_run_time: true
    dirty_paths:
      - '?? coordination/goals/GOAL-HQC-001/batches/BATCH-fc30b5/tasks/'
    dirty_note: >-
      Sole untracked entry is this task's own not-yet-committed output
