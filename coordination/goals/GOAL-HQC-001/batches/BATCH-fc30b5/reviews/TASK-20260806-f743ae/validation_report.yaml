  proof_architecture_checks: not_applicable

  inventor_protocol_section6_ladder_check:
    - item: "each assumption the complexity/cost analysis rests on was
        isolated and measured separately, with the specific failure mode
        named"
      status: met
      finding: >-
        The two load-bearing approximations in the dilution model (block
        n_e-1 failure independence from the other blocks; mubar_{k-1}^other
        approximated by the pooled true-arm mubar_{k-1}) are named
        individually in design.md Section 3.2 as simplifications "not
        re-derived here," not silently assumed. The SE(T) CLT-scaling
        assumption is separately named and flagged as unverified at T far
        from T_ref. The flip-rate-vs-net-marginal-shift distinction (a
        specific, quantified failure mode: naively using the raw flip rate
        as the marginal-shift input would overstate the propagated effect by
        ~13x) is isolated, quantified, and reported as a separate
        "hypothetical/upper-bound" column rather than folded silently into
        the primary estimate.
    - item: "the whole pipeline was run on a scaled-down instance of the
        same shape, and the claimed improvement (here: the matched-pair
        design's power gain) appears as a MEASURED ratio against baseline,
        not a projection"
      status: met
      finding: >-
        The 3.12x SE-tightening at k=17 (and the 1.76x-10.0x range across
        k=2..26) is a directly MEASURED ratio on the pilot's own real data
        (not projected from the Red Team's separate fresh-shard probe), and
        I independently reproduced this measured ratio myself (3.117x at
        k=17). This is exactly the "step 2" the ladder singles out as most
        often skipped, and it was not skipped here.
    - item: "any cheat in a real-scale partial run is named individually and
        classified as completeness-preserving or soundness-losing"
      status: met
      finding: >-
        run_manifest.yaml's protocol_deviations section names three: (1)
        raw per-trial data was not available in pilot_results.json, so
        shards were regenerated deterministically rather than read directly
        -- classified and verified as completeness-preserving (bit-identical
        to the original, confirmed independently by this review); (2) the
        Red Team's probe shard was additionally regenerated for a sanity
        check, explicitly excluded from the primary reported result --
        completeness-preserving; (3) the power-target choice was the
        executor's own disclosed discretion within an underspecified
        instruction, not a deviation from a pre-specified value.
    - item: "the reproducibility pointer was exercised -- artifacts rebuilt
        from scratch and listed, not asserted"
      status: met, exceeded
      finding: >-
        This review independently rebuilt the entire chain from scratch with
        a structurally different implementation (two separate _t_shard calls
        rather than one monkey-patched double-decode call), re-derived the
        structural formula from first principles rather than transcribing
        it, and reproduced every headline number to the reported precision.

  limitations:
    - >-
      Toy-scale, hard ceiling: PS-R3 only, V3 defect class, decode_blocks
      last-block injection point, 10,000 matched pairs (reusing the pilot's
      original 5,000+5,000 trial budget). Nothing here is a statement about
      HQC, A17, its decoding-failure rate, or any standardized parameter
      set. Nothing here generalizes to V1's global-shift defect class, to
      the other three named injection points, or to PS-A/PS-R1/PS-R5.
    - >-
      The required-T figure (4.33e8 at k=17, using the Red Team's Delta_p)
      rests on a Delta_p point estimate that is itself not statistically
      distinguishable from zero (see independent_reasoning_on_reliability
      below) and on a CLT SE-scaling assumption extrapolated ~5 orders of
      magnitude beyond its T_ref=10,000 validation point. Both limitations
      are disclosed in the reviewed artifacts themselves, not discovered
      only by this review.
    - >-
      No positive control has been run through this exact real-sampler
      detection pipeline at any trial count (carried forward from
      EV-HQC-67a6ec; unchanged by this batch, which was explicitly scoped
      to exclude it -- DEC-20260806-9a4551 item 3).
    - >-
      This review's own independent code is scratch-only and checks 3 of 25
      reported k values in the primary matched-pair table (k=2, 17, 26) plus
      the full required-T formula and its k=17/k=2/k=26 instantiations; the
      remaining 22 k-cells were spot-checked only via the internal
      self-consistency scaling check (independent quadratic-in-Delta_p
      verification against the JSON's own sensitivity table), not
      individually recomputed from raw trial data.

  independent_reasoning_on_reliability_caveat: >-
    My own view, requested explicitly by this task's handoff: the Delta_p
    reliability caveat does NOT undermine the required-T figure's validity
    as a CONDITIONAL projection -- the arithmetic is correct given its
    stated input, and I independently verified it. But it DOES mean the
    4.33e8 headline should not be read as an unconditional cost estimate.
    Because required_T scales as 1/Delta_p^2 (confirmed above), and Delta_p
    is not yet established to be nonzero at all, the true required T could
    be anywhere from ~1e6 (the explicitly-labeled, least-realistic
    hypothetical that treats the entire raw flip rate as one-directional) to
    >7e11 (this task's own pooled point estimate) to literally unbounded (if
    the true net marginal shift is exactly zero, which the four disagreeing-
    in-sign estimates do not rule out). Read as a PLANNING NUMBER rather
    than a measured fact, 4.33e8 is a reasonable, disclosed central estimate
    to use IF one is committed to using the Red Team's single fresh-shard
    Delta_p as the best available point estimate (it has the largest |z| of
    the four, 1.78, even though still below significance) -- but the more
    defensible framing is "every one of the three effect-size inputs tried
    (including the most optimistic, least-realistic hypothetical) implies a
    required T that is 8x-2,400,000x the specification's own T_req, and the
    true multiplier is unknown but very unlikely to be below 8x." I note
    (as an observation, not a recommendation -- the campaign-level call
    belongs to the Coordinator and Red Team per this batch's own division of
    labor) that resolving Delta_p ITSELF to 3-sigma significance would need
    only ~T=(3*sqrt(flip_rate))^2/Delta_p^2 ~= 14,300 matched-pair trials at
    the Red Team's own Delta_p=0.0082 -- roughly four orders of magnitude
    cheaper than confirming the propagated log2_Ahat_17 effect directly, and
    not identified as an option in the reviewed artifacts. Whether that is
    worth pursuing next is outside this validator's remit.

  admissibility_verdict: ADMIT
  admissibility_verdict_rationale: >-
    Every artifact is present, hash-bound to the Coordinator-committed
    snapshot (2f034e0c, parent de450e9a, both verified against git and the
    snapshot receipt's path_sha256 map), and internally consistent
    (stdout.log, reanalysis_results.json, run_manifest.yaml, and
    reanalysis_report.md all agree on every number checked). The matched-
    pair method is confirmed to be the SAME method the Red Team used (not a
    weaker or different approximation): identical construction (same
    underlying random draws, decoded once true and once defected, via the
    Red Team's own described mechanism), and this task's own sanity check
    against the Red Team's independently reported numbers passes exactly,
    which I independently reproduced myself rather than trusting either
    party's self-report. The core statistical claims (matched-pair diff/SE/z
    at k=17 and across the full range) recompute exactly from raw
    regenerated trial data via a structurally independent implementation.
    The structural "doubly diluted" formula is mathematically correct given
    its two disclosed approximations, independently re-derived here from
    first principles rather than merely checked against the code. The
    required-T arithmetic (4.33e8 at k=17) is exactly reproducible and
    internally self-consistent (quadratic scaling in 1/Delta_p verified to
    9 significant figures). No new (T)-sampling occurred: every shard
    decoded (5000, 6000, 424242) was already used in this campaign's
    committed record, and the regeneration of the pilot's own shards is
    genuinely bit-identical, confirmed independently by this review's own
    from-scratch regeneration, not merely by trusting the JSON's self-report.
    The reliability caveat on Delta_p is surfaced prominently and honestly
    rather than smoothed over, and its consequence (an unstable, possibly
    unbounded required-T) is correctly characterized as a limitation on the
    headline number's precision, not concealed. This receipt is admissible
    evidence for the campaign's next-action decision.

  independent_ambiguity_resolution_judgement: >-
    I confirm the reanalysis's own pre-registered conclusion
    ("genuinely_ambiguous") is correctly and mechanically applied to the
    measured numbers, and I independently recomputed the numbers that
    conclusion rests on. My own reading of what this batch establishes,
    stated in my own words rather than restating the executor's framing:
    (1) RESOLVED: the pilot's original between-shard design was genuinely,
    measurably underpowered relative to the free matched-pair alternative --
    this is no longer only the Red Team's separate fresh-shard claim, it now
    holds on the pilot's own actual data, independently reproduced twice
    (by the executor and by this review). (2) NOT RESOLVED, and unlikely to
    be resolvable by more of the SAME design at any remotely affordable T:
    whether the V3/decode_blocks defect propagates to the joint-moment
    estimator at all. The evidence leans, on balance, toward "if there is a
    real propagated effect here, it is diluted by BOTH the k/n_e block-
    fraction AND a near-total cancellation built into the estimator's own
    definition (verified above), making it many orders of magnitude harder
    to see than the defect's large, unambiguous LOCAL effect (10.7% flip
    rate, z~24-35 in every sample) would suggest" -- rather than toward
    "there is probably no effect at all" (the four Delta_p estimates
    disagree in sign, which is as consistent with a small nonzero true
    effect swamped by noise as with a true zero) or toward "the effect is
    real and just needs a bigger run to confirm at the SAME injection
    point" (every input tried implies T_req at least ~8x the
    specification's own T_req, and typically 2-4 orders of magnitude more).
    Genuine ambiguity about the SIGN and EXISTENCE of the propagated effect
    remains; what is no longer ambiguous is that resolving it via more
    trials at this exact injection point, defect class, and comparison
    design is not a tractable next step at any budget this campaign has
    discussed.

