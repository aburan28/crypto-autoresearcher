  metric_recomputations:
    - metric: "the doubly-diluted structural formula, re-derived from first
        principles (not read off design.md's stated form)"
      method: >-
        Independently derived mubar_k for a system where only block n_e-1's
        marginal failure probability differs between arms, decomposing
        E[C(S,k)] over k-subsets that do (C(n_e-1,k-1) of them) and do not
        (C(n_e-1,k) of them) contain block n_e-1, using the identities
        C(n_e-1,k)/C(n_e,k) = 1-k/n_e and C(n_e-1,k-1)/C(n_e,k) = k/n_e, and
        the design's stated independence-of-block-n_e-1 approximation. This
        independently reproduces
        mubar_k = (1-k/n_e)*mubar_k^other + (k/n_e)*p_{n_e-1}*mubar_{k-1}^other
        exactly as design.md Section 3.2 states, confirming Delta(mubar_k) =
        (k/n_e)*Delta_p*mubar_{k-1}^other is EXACT (not merely first-order)
        under the stated independence approximation. Combined with the
        EXACT identity Delta(q) = Delta_p/n_e (linearity of the mean, no
        independence assumption needed) and first-order log-linearization of
        both terms gives
        Delta(log2_A_k) = (k/n_e)*Delta_p/ln2 * [mubar_{k-1}/mubar_k - 1/q_hat],
        matching design.md Section 3.2's formula exactly. Independently
        confirmed the claimed "exact cancellation under i.i.d. block
        failures" property: if blocks are i.i.d. Bernoulli(q), mubar_k = q^k
        exactly, so mubar_{k-1}/mubar_k = 1/q exactly and the bracket is 0.
      result: >-
        The structural formula is mathematically correct given its two
        disclosed, non-trivial approximations: (1) block n_e-1's failure is
        independent of the other n_e-1 blocks' joint failure structure
        (needed for the exact linearity in p_{n_e-1}); (2) mubar_{k-1}^other
        (restricted to the 55 "other" blocks) is approximated by the pooled
        true-arm mubar_{k-1} computed over all 56 blocks -- a proxy, not
        re-derived, but a reasonable one since block n_e-1's own marginal
        rate (~0.31-0.33) is not exceptional relative to the pooled q_hat
        (0.3194). Neither approximation is hidden; both are stated in
        design.md Section 3.2 as simplifications "not re-derived here."
      minor_note: >-
        reanalysis_report.md Section 5.2 states the bracket differs from
        i.i.d. cancellation "by only ~12% at k=17"; my independent
        computation gives (mubar_16/mubar_17)/(1/q_hat) - 1 = 13.4%. A minor
        imprecision in the report's rounding, not a correctness issue and
        not consequential to any conclusion (both figures support the same
        "near-total but not exact cancellation" characterization).
    - metric: "required-T arithmetic at k=17, independently recomputed"
      method: >-
        Recomputed Z_SUM = z_{0.975} + z_{0.90} = 1.959963985 + 1.281551566
        = 3.241515551 independently (matches the code's constant). Applied
        the standard power formula T_req = T_ref*(z_sum*SE_ref/Delta)^2 to
        my own independently-derived Delta(log2_A_17) and the independently
        -measured se_paired_ref at T_ref=10,000, using ONLY numbers computed
        by my own script.
      result: >-
        k=17, using the Red Team's Delta_p=0.0082 as input: leading_term=
        1.2749e-2, q_shift_term=-1.1244e-2, total=1.5053e-3, required_T=
        4.3291e8 -- EXACT MATCH to reanalysis_results.json's
        required_T_derivation.load_bearing_k17.required_T_red_team_input =
        432907900.434108 (i.e. the reported "~4.33e8").
        k=2:  my required_T = 4.122e7  (report: "4.1e7")
        k=26: my required_T = 6.879e7  (report: "6.9e7")
        Also independently verified the exact quadratic scaling of
        required_T in 1/Delta_p (since the modeled effect is linear in
        Delta_p by construction): predicted T(delta_p=0.02) from
        T(delta_p=0.0082)*(0.0082/0.02)^2 = 72,771,818.06297357, matching
        the JSON's delta_p_sensitivity_k17 entry (72,771,818.06297332) to 9
        significant figures -- an internal self-consistency check the
        executor's own code also implicitly satisfies (both computed
        independently, from the same underlying model, and agree).
      verdict: >-
        PASS. The 4.33e8 figure is arithmetically correct given its stated
        inputs (Delta_p=0.0082, se_paired at T=10,000, the stated power
        target) and the structural formula verified above. No sign error,
        no off-by-one in the power formula, no unit inconsistency found.
    - metric: "power/precision target and SE-scaling assumption"
      method: Read design.md Section 3.3 and the code's t_req() function.
      result: >-
        Two-sided alpha=0.05, power=0.90 is a standard, non-arbitrary choice,
        stated BEFORE any required-T number was computed (per the
        completion_gate and design.md's own framing). The SE(T) = SE_ref *
        sqrt(T_ref/T) scaling assumption is standard central-limit/jackknife
        behavior for a smooth statistic and is EXPLICITLY flagged in both
        design.md and reanalysis_report.md as an assumption "not
        independently re-verified at T far from T_ref" -- an honest,
        load-bearing caveat given the ~5 orders-of-magnitude extrapolation
        from T_ref=10,000 to T_req~4e8-7e11. This is exactly the kind of
        untested extrapolation Section 6 of docs/inventor-protocol.md's
        ladder asks to be isolated and named, and it is.
      minor_note: >-
        design.md Section 2.5's prose describes the "resolved_null" boundary
        condition using the pre-registered SIGNAL_Z_THRESHOLD=3.0, while the
        code's actual resolved_null branch computes T_req using Z_SUM=3.24
        (the two-sided-alpha/power combination) and compares that T_req
        against the achieved T=10,000. These are numerically close (3.0 vs
        3.24, a ~14% difference in the implied SE threshold) and this
        discrepancy has NO effect on this run's actual verdict, since every
        computed T_req exceeds the achieved T by 4-8 orders of magnitude
        regardless of which threshold is used -- flagged as a minor
        internal-consistency nit between prose and code, not a substantive
        error.

