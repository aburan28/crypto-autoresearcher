  # ======================================================================
  # 3. Is the calibration circular?
  # ======================================================================
  circularity_audit:
    question_1_is_A_k_equals_1_for_all_k_equivalent_to_binomial:
      verdict: CONFIRMED, AND THE ARGUMENT IS EXACT, NOT NUMERICAL.
      independent_check: >-
        The matrix M[k][s] = C(s,k) on {0..n_e} is upper triangular with unit diagonal (C(s,k)=0 for
        s<k, C(k,k)=1) for every n_e checked (10, 46, 90), hence unimodular and invertible over Q --
        no numerical inversion is needed. A_k = 1 for k=1..n_e pins E[C(S,k)] = C(n_e,k) q^k for
        every k, hence pins the pmf by back-substitution. I performed that back-substitution in EXACT
        RATIONAL ARITHMETIC at n_e = 46, q = q-hat(PS-R1): max |pmf reconstructed - Bin| = EXACTLY 0.
        The producer's 7.5e-15 is float noise on a statement that is exactly true; the claim is
        stronger than they stated it.
      caveat_the_producer_stated_and_it_is_correct: >-
        The contract measures k <= k_max < n_e, so the rule tests a SUB-FAMILY. This is a POWER
        limitation (a departure confined to unmeasured orders is missed), not a size limitation:
        the null hypothesis itself is "A_k = 1 for all k", which is the point null Bin(n_e, q) with
        q a nuisance parameter. The producer classified it correctly.
    question_2_does_q_hat_make_the_rule_self_fulfilling:
      verdict: NO, NOT IN THE SENSE ASKED -- BUT SEE VF-3.
      reasoning: >-
        The statistic log2 Ahat_k self-normalizes: it re-estimates q from the SAME histogram it
        scores, so the plug-in q-hat does not enter as a location shift and cannot pull the observed
        value toward the centre of the interval. q-hat enters only as the DISPERSION parameter of the
        calibration null. Under any alternative that preserves the marginal q but breaks the joint
        law -- which is exactly the alternative A17 failing describes -- the statistic still moves and
        the rule still fires. Calibrating against the hypothesis under test is what a size
        calculation IS; it is not circularity.
      the_real_exposure: >-
        The one genuine data dependence is the plug-in q-hat, and the size is STEEPLY sensitive to it
        because V(n_e,q,k) falls steeply in q. Measured at the load-bearing cells with the producer's
        own unrounded constants (n_val = 200,000 per point):
      q_misspecification_measured:
      - {set: PS-R1, k: 16, dq_rel: -0.02, size: 0.00516}
      - {set: PS-R1, k: 16, dq_rel:  0.00, size: 0.00279}
      - {set: PS-R1, k: 16, dq_rel: +0.02, size: 0.00128}
      - {set: PS-R3, k: 17, dq_rel: -0.02, size: 0.00528}
      - {set: PS-R3, k: 17, dq_rel:  0.00, size: 0.00242}
      - {set: PS-R3, k: 17, dq_rel: +0.02, size: 0.00128}
      - {set: PS-R5, k: 30, dq_rel: -0.02, size: 0.00633}
      - {set: PS-R5, k: 30, dq_rel:  0.00, size: 0.00291}
      - {set: PS-R5, k: 30, dq_rel: +0.02, size: 0.00123}
      why_this_is_still_acceptable_at_PS_R1_R3_R5: >-
        At those three sets the RELATIVE 3 SE(q-hat) is only 0.118%, 0.082% and 0.063%, two orders
        below the +-2% shifts above. The producer's conclusion holds there. It does not hold at
        PS-A: see VF-3.
      note_on_the_producers_SE_bound_wording: >-
        The amendment calls the independent-blocks SE(q-hat) "the bound". It is a LOWER bound, not an
        upper one: Var(q-hat) = q(1-q)(1 + (n_e-1) rho) / (n_e T), and the alternative this
        experiment exists to detect is rho > 0. I measured the inflation factor at log2 A_2 = 0.1
        bits: 1.00 (PS-A), 1.34 (PS-R1), 1.69 (PS-R3), 2.35 (PS-R5). Even inflated, 3 SE stays under
        0.16% relative at PS-R1/R3/R5, so nothing turns on it there -- but the word "bound" is wrong
        and should be "the rho = 0 value".

  # ======================================================================
  # 4. Findings
  # ======================================================================
  findings:

  - id: VF-1
    severity: BLOCKING FOR THE AMENDMENT AS WRITTEN
    title: >-
      The frozen critical values as TRANSCRIBED into amendment_v2.yaml do not deliver the sizes
      printed beside them at k = 2, and two of the three fail the amendment's own acceptance gate.
    detail: >-
      amendment_v2.yaml's frozen_critical_values_at_the_contract_allocations table -- which the
      record explicitly says are "FROZEN BY THIS RECORD" and are therefore what binds at run time --
      carries every constant rounded to five decimal places. At k = 2 the interval half-width is
      2.2e-5 to 5.5e-5 bits, so five decimals truncate 4.8%-8.6% off each side. Measured on
      1,000,000 fresh validation draws per cell: PS-R1 k=2 size 0.610% (printed: 0.274%), PS-R3 k=2
      size 0.419% (printed: 0.262%), PS-R5 k=2 size 0.551% (printed: 0.283%). PS-R1 and PS-R5 are
      2.0x-2.3x nominal; all three lie outside the amendment's own binding band [0.002, 0.004], so
      the amendment's clause "a cell whose measured size lies outside [0.002,0.004] is reported as
      CALIBRATION FAILED" would fail its own frozen constants. The producer's unrounded values in
      calibration_results.json are correct; only the transcription is wrong. Required precision:
      >= 6 decimals at PS-R1 k=2 and PS-R3 k=2, >= 7 at PS-R5 k=2.
    consequence_if_unrepaired: >-
      The amendment reports a measured size for a rule it does not state. Any run executing the
      transcribed table would report CALIBRATION FAILED at k=2 at three of four sets and withhold
      those (T) results -- a self-inflicted budget loss at the cheapest and best-conditioned order
      in the whole design.
    required_correction: >-
      Either carry enough digits per cell (>= 7 everywhere is simplest), or -- better and what this
      validator recommends -- make the amendment bind the PROCEDURE plus the recorded calibration
      seed and n_cal, and require the constants to be re-derived deterministically at run time,
      with the transcribed table demoted to a human-readable reference. The amendment already
      specifies a seed scheme; it should be the authority, not the decimals.

  - id: VF-2
    severity: MATERIAL -- EVIDENTIARY, NOT ARITHMETICAL
    title: >-
      The headline "measured out-of-sample size 0.252%-0.290%" is very close to a tautology and
      should not be presented as the evidence that the rule is calibrated.
    detail: >-
      The procedure is: draw n_cal from a law, set the empirical alpha/2 and 1-alpha/2 quantiles,
      then draw n_val from THE SAME LAW and count exceedances. That measures Monte-Carlo error in a
      quantile estimator and nothing else. I ran the identical procedure on a standard normal --
      no estimator, no skew, no HQC, no instrument -- 200 independent times at n_cal = n_val = 1e6:
      mean 0.27010%, SD 0.0067 pp, range 0.2476%-0.2894%, and 99.5% of the 200 repetitions land
      INSIDE the producer's claimed band [0.252%, 0.290%]. The claimed band is what this procedure
      returns for any continuous law.
    what_the_check_DOES_establish: >-
      Real but modest: that no cell's null law has atoms large enough to break empirical-quantile
      calibration, and that the undefined-replicate accounting is consistent. That is worth having
      and worth keeping as a run-time guard. It is not evidence about the estimator, the instrument,
      or A17.
    what_actually_establishes_the_repair: >-
      The comparison against the v1 rule (0.30%-23.55% at Stage A, 1.83%/2.20% at Stage B versus
      0.26%-0.28% for v2 on my own independent draws) is the real evidence, and it holds. The
      amendment should lead with that contrast and demote the out-of-sample size to what it is: a
      standing sanity guard.

  - id: VF-3
    severity: MATERIAL
    title: >-
      The plug-in q-hat sensitivity was never tested at PS-A -- the one set where the amended
      success criterion (iv) actually delivers -- and at PS-A it fails.
    detail: >-
      calibration.py's q_sensitivity() is called only at k = m. PS-A's m = 16 is not evaluable at
      Stage-B T, so PS-A's q_sensitivity block in calibration_results.json contains ZERO rows. The
      amendment nonetheless concludes, without qualification, "The plug-in is not a material source
      of error." PS-A is exactly where that is false: its (T) arm records 8,122 block failures in
      total, so SE(q-hat)/q-hat = 1.110% and 3 SE = 3.329% -- 28x to 53x the relative uncertainty at
      the three sets that WERE tested. Measured at PS-A on 400,000 validation draws per point, using
      the producer's own unrounded constants:
    measured:
    - {set: PS-A, k: 2, se_multiple: -3, rel_shift: -0.0333, size: 0.00369, in_band: true}
    - {set: PS-A, k: 2, se_multiple:  0, rel_shift:  0.0000, size: 0.00268, in_band: true}
    - {set: PS-A, k: 2, se_multiple: +3, rel_shift: +0.0333, size: 0.00175, in_band: false}
    - {set: PS-A, k: 3, se_multiple: -3, rel_shift: -0.0333, size: 0.00404, in_band: false}
    - {set: PS-A, k: 3, se_multiple: -2, rel_shift: -0.0222, size: 0.00337, in_band: true}
    - {set: PS-A, k: 3, se_multiple:  0, rel_shift:  0.0000, size: 0.00265, in_band: true}
    - {set: PS-A, k: 3, se_multiple: +2, rel_shift: +0.0222, size: 0.00186, in_band: false}
    - {set: PS-A, k: 3, se_multiple: +3, rel_shift: +0.0333, size: 0.00140, in_band: false}
    consequence: >-
      Amended criterion (iv) funds log2 Ahat_2 and log2 Ahat_3 at PS-A. At a q-hat error well inside
      its own +-3 SE, the frozen PS-A intervals leave the amendment's binding [0.002, 0.004] band --
      at k=3 already at +2 SE. This is not fatal to the design; it is a gap in the amendment's own
      due diligence at the cell that matters most for what v2 promises to deliver.
    required_correction: >-
      Run q_sensitivity at every REPORTED k, not only k = m; state the PS-A result; and either widen
      PS-A's frozen interval to be robust over q-hat +- 3 SE, or make PS-A's calibration a run-time
      re-derivation at the Stage-B-realized q-hat (which has far more block failures behind it) with
      the deviation recorded, rather than freezing on the Stage-A q-hat.

  - id: VF-4
    severity: MINOR -- REPORTING ACCURACY
    title: '"0.252%-0.290% at every one of the 30 evaluable cells" is a selected subset.'
    detail: >-
      calibration_results.json phase3 marks 38 cells evaluable, not 30. One of them, PS-A k=4 at
      Stage-A T, reports 0.146% on 1,373 finite replicates of 1,000,000. phase9 reports 0.231%
      (PS-R5 k=30, T=2e7) and 0.307% (PS-A k=3, T=1e8) -- both quoted in the repair report's own R4.4
      table and both outside the claimed range. Every one of these is consistent with Monte-Carlo
      noise, so no conclusion moves; but the stated range is narrower than the artifact's own
      contents, and 30 is not the count of evaluable cells.
    required_correction: 'State the full range over all evaluable cells and the exclusion rule used.'

  - id: VF-5
    severity: MATERIAL -- ATTRIBUTION AND FRAMING
    title: >-
      R4.2 is a valuable REFINEMENT of OBJ-3, not a correction of it, and its headline compares an
      SD ratio to a variance ratio.
    detail: >-
      The red team wrote: "V(n_e,q,k) as frozen in the contract understates the estimator's null
      variance at this cell by (0.0744/0.0321)^2 ~ 5.4x" -- a VARIANCE ratio, about the frozen
      instantiation. The repair report answers "the tabulated numbers understate by 1.78x-2.33x, not
      5.4x" -- those are STANDARD-DEVIATION ratios. Squared they are 3.18x-5.43x, and PS-R5's is
      exactly 5.4. The two measurements agree; the report's own later sentence ("the magnitude ...
      is similar, 3.2x-5.4x, since T_prec ~ V") concedes this, but the headline does not.
    what_I_independently_confirm: >-
      The producer's DIAGNOSIS is right and is a real contribution. Recomputing the contract's own
      variance formula at the modelled q_for_sizing reproduces the tabulated SEs to 0.3%: PS-A k=2
      0.00918 vs 0.0092 (ratio 0.997), PS-A k=3 0.10831 vs 0.108 (1.003), PS-R1 k=16 0.03208 vs
      0.0321 (0.999), PS-R3 k=17 0.00802 vs 0.008 (1.002), PS-R5 k=30 0.02589 vs 0.0259 (1.000). The
      tabulated numbers are the formula evaluated at the wrong q, exactly as the producer says, and
      the functional form is sound. The red team never asserted the functional form was wrong, and
      the red team's own 5.4x carried a declared +-16% relative rider on an R = 20 SD estimate, which
      brackets the true value.
    required_correction: >-
      Restate as "OBJ-3's magnitude is confirmed; its DIAGNOSIS is refined -- the defect is the q at
      which the formula was instantiated, not the formula." Do not present the red team as wrong on
      magnitude; the units differ.

  - id: VF-6
    severity: MINOR -- OVERSTATED FAILURE MODE
    title: >-
      CTRL-POSHOM's bullet "an off-by-one truncation window -> block 0 or block n_e-1 is special" is
      not generally true.
    detail: >-
      The control's own derivation proves too much for this bullet. Ring-shift invariance makes EVERY
      contiguous length-L window of Z_n carry the same law, so a truncation window that is merely
      TRANSLATED by one coordinate leaves clause (a) and clause (b) both exactly satisfied and is
      invisible to the control. The bullet is correct only for an off-by-one that SHORTENS or PADS a
      block -- e.g. N not a multiple of L, or a final short block zero-filled. Similarly "a wrong ring
      modulus n" is detected only when it forces a block to straddle a discontinuity, not merely when
      n is wrong.
    required_correction: >-
      Qualify the bullet: the detectable class is "any defect that makes the block windows fail to be
      congruent contiguous L-windows of Z_n, or makes F_j a position-dependent function", which
      excludes a pure translation of the whole window.

  - id: VF-7
    severity: MINOR -- DIRECTION OF A STATED INEXACTNESS
    title: >-
      The independent-blocks reference for Q_raw is CONSERVATIVE, not merely inexact, and saying so
      strengthens the producer's own "not a verdict" caveat.
    detail: >-
      I verified the producer's formula: E[sum_j (n_j - nbar)^2] = T (n_e-1)(v - cbar) with cbar the
      mean pairwise covariance, so E[Q_raw] = (n_e-1)(1 - cbar/v) and the correctly scaled statistic
      is Q* = Q_raw / (1 - cbar/v). Whenever blocks are POSITIVELY correlated -- the alternative the
      experiment exists to detect -- Q* > Q_raw, so comparing the unscaled Q_raw against an
      independent-blocks critical value can only FAIL to reject. "None of the four exceeds the
      independent-blocks critical value" is therefore an understatement of the evidence, not an
      overstatement. I recompute the observed values exactly from the committed per-block failure
      counts: Q_raw = 55.7448 / 46.8807 / 48.8178 / 79.2735 and Q/(n_e-1) = 1.2388 / 1.0418 / 0.8876
      / 0.8907, identical to the producer's phase6 to five decimals.
    required_correction: 'State the direction of the inexactness alongside the "not a verdict" label.'

  - id: VF-8
    severity: MINOR -- REPRODUCIBILITY, NOT CORRECTNESS
    title: 'calibration.py does not reproduce stage_a.py''s batching exactly.'
    detail: >-
      stage_a.batch_hists uses np.linspace(0,T,B+1).astype(int), which spreads the remainder one
      trial per batch (sizes differ by at most 1). calibration.py's draw_batched puts the WHOLE
      remainder in batch 0, giving batch 0 up to 8% more trials than the rest (PS-R5: 1295 vs 1199).
      The comment "Exactly the law of stage_a.batch_hists" is therefore wrong. I measured every
      Stage-A v1 cell under BOTH batchings: the only cell where it moves the answer materially is
      PS-A k=3 (5.03% linspace vs 3.56% producer-batching), and that cell has 94% undefined
      replicates. No conclusion changes. The v2 rule uses no batching at all, so it is unaffected.
    required_correction: 'Fix the comment and the batching if calibration.py is ever re-run.'

  # ======================================================================
  # 5. The two items the producer flagged
  # ======================================================================
  adjudication_of_OPEN_7:
    status: RESOLVED IN THE PRODUCER'S FAVOUR. The producer's number is right.
    evidence: >-
      Independently re-measured at 20,000 replicates with a different seed, a different
      implementation, and BOTH batchings: PS-R5 NULL-M k = 30, T = 239,896, q = 0.4139887:
      7.775% (stage_a linspace batching, 95% CI [7.41, 8.15]) and 7.835% (calibration.py batching).
      The producer's 7.76% [7.40, 8.14] reproduces exactly. The red team's 12.7% (38/300) does not
      reproduce and is not explained by batching, which was the leading structural candidate and
      which I tested directly.
    likely_mechanism_of_the_red_team_discrepancy: >-
      OFFERED AS A HYPOTHESIS, NOT ESTABLISHED. Against a true 7.78%, 38/300 is a 3.2-sigma
      excursion. That is unlikely for one independent cell but is entirely ordinary if the red team's
      ten reported cells were scored on ONE shared set of 300 replicates, which makes the cells
      correlated and lets a single unlucky draw set move several of them together -- and indeed
      seven of their other nine cells also sit off my values, alternating in sign. I did not have
      their probe code, so I cannot confirm this.
    recommendation: >-
      Retire OPEN-7 as an unexplained discrepancy and record it instead as a superseded measurement:
      the red team's 300-draw estimate at this one cell is superseded by two independent
      20,000-replicate measurements agreeing to within 0.08 pp. No conclusion in EV-HQC-75c05b moves
      -- both numbers are 29x-47x nominal.

  adjudication_of_OPEN_8:
    status: >-
      CONFIRMED AS A REAL DISCLOSURE SURFACE, AND THE PRODUCER'S HANDLING WAS CORRECT AND SHOULD BE
      RECORDED AS SUCH.
    the_arithmetic_verified: >-
      With mubar_2 = E[C(S,2)]/C(n_e,2) and A_2 = mubar_2/q^2 on {0..n_e}:
      A_2 = [Var(S) + (n_e q)^2 - n_e q] / (n_e (n_e - 1) q^2). RUN-HQC-982268-STAGEA-a archives the
      (T) arms' full S-histograms as a chartered diagnostic. Var(S) is one line from them, so
      log2 A_2 -- a primary Stage-B measurement -- is recoverable from a diagnostics-only
      authorization. The producer identified this correctly and DID NOT COMPUTE IT, including where
      the exact reference constant for its own new control required it (the constant cbar and A_2 are
      bijective given q). It flagged the surface instead. That is the right call and it cost the
      control an exact reference to make it.
    what_this_validator_did: >-
      I likewise did not compute it, for the same reason. I verified the algebraic identity
      symbolically without instantiating it on any (T) histogram.
    recommendation_for_the_Coordinator: >-
      This needs a ruling, not an edit -- the archive is immutable and nothing improper happened. The
      narrow question is whether a k=2 (T) measurement, once derivable from committed diagnostics,
      may be taken outside the frozen Stage-B protocol. This validator's view: NO, and the reason is
      pre-registration, not secrecy. The frozen prediction is tested at frozen orders under a frozen
      rule; taking k=2 early, outside that rule, converts a pre-registered test into a look. The
      cheapest clean resolution is to authorize k=2 explicitly as a Stage-B cell under the v2 frozen
      interval (it is already the best-conditioned order in the design and the cheapest), and to
      record in the amendment that the Stage-A archive contains its sufficient statistic and that no
      one has evaluated it.

  # ======================================================================
  # 6. Per-repair verdicts
  # ======================================================================
  verdicts:

    R1:
      verdict: CONFIRMED, WITH ONE BLOCKING TRANSCRIPTION DEFECT AND ONE UNTESTED CELL
      what_replicates: >-
        (a) The v1 rule's mis-sizing: 17 of 18 Stage-A cells reproduce within Monte-Carlo error, and
        the sole outlier (PS-A k=3, 94% undefined) is explained by the batching difference in VF-8.
        (b) The forward-looking finding that the mis-sizing survives to Stage B: CONFIRMED and
        slightly stronger than measured (PS-R1 k=16: my 1.83% vs their 1.44%; PS-R5 k=30: my 2.20%
        vs their 2.34%; PS-R3 k=17: my 0.455% vs their 0.450%).
        (c) The v2 rule's size against the null it declares: my own constants on my own draws give
        0.256%-0.282% over 35 non-degenerate cells; their unrounded constants on my draws give
        0.259%-0.283%. The producer's critical values reproduce to under 1.6%.
        (d) The A17 <=> Binomial identity: exact, and exactly true, verified in rational arithmetic.
        (e) The Wald-shape diagnosis (coupling and asymmetry) is the correct explanation and the
        replacement is the right instrument for it.
      what_does_not_hold: 'VF-1 (transcription), VF-2 (the evidence offered), VF-3 (PS-A), VF-4.'
      is_it_calibrated: >-
        YES, against the null law it declares, and I established that independently rather than
        accepting it. The rule is sound. Two of its supporting claims are not.

    R2:
      verdict: >-
        DESIGN CONFIRMED SOUND AND GENUINELY UPSTREAM-CAPABLE; NOT YET A CONTROL, BY THE PRODUCER'S
        OWN ACCURATE ACCOUNT
      is_CTRL_POSHOM_capable_of_failing_where_CTRL_BS_could_not:
        answer: YES, STRUCTURALLY, AND THIS IS THE REPAIR'S REAL CONTENT.
        reasoning: >-
          I verified CTRL-BS's blindness at source: stage_a.py builds Fb[:,j] = np.roll(F[:,j],
          -off[j]), a permutation of a column, so every per-block column sum survives exactly. I
          confirmed q-hat^BS == q-hat^T on the committed record at all four sets (8,122 / 5,200,049 /
          9,159,668 / 13,187,613 block failures, reconstructed from ctrl_BS block_marginals and
          matching diagnostics_T q_hat * n_e * T to the unit). Both the numerator and the denominator
          of Ahat_k^BS are built from the same F, so any upstream defect enters the control and the
          controlled quantity identically and cancels. CTRL-POSHOM is different in kind: it is
          evaluated on the (T) indicator matrix and its forced value comes from the RING, not from F.
          A wrong F cannot cancel against a theorem. That is a real repair of a real structural
          blindness.
        the_forced_value_is_a_correct_theorem: >-
          Verified. For s in Z_n, v -> X^s v is a bijection of each fixed-weight set, so
          (X^s x, X^s y, X^s e, r_1, r_2) =d= (x, y, e, r_1, r_2) and X^s e'' =d= e''. With
          n_e * L = N < n, block j's window is block 0's window shifted by the legal ring shift jL.
          Clause (a) E[F_j] = q for all j, and clause (b) P[F_j = F_{j+d} = 1] depending only on d,
          both follow exactly. Derived before any datum, as claimed.
      was_the_refusal_to_compute_the_exact_constant_correct:
        answer: YES, AND IT WAS THE HARDER CHOICE.
        reasoning: >-
          The refusal is not fastidiousness; it is forced. I verified the identity independently:
          E[Q_raw] = (n_e-1)(1 - cbar/v) with cbar the mean pairwise covariance, and
          A_2 = 1 + cbar/q^2, so cbar and A_2 determine each other given q. Evaluating the exact
          reference constant on the (T) data IS the k = 2 measurement, which Stage A was not
          authorized to take. The producer could have computed it quietly and reported a clean
          pass/fail; it instead accepted a weaker deliverable and disclosed why. Under
          docs/inventor-protocol.md section 3 and section 5 that is the correct behaviour and it
          should be recorded as such.
      does_the_inexactness_undermine_the_control:
        answer: IT WEAKENS THE DEMONSTRATION, IN A DIRECTION THAT IS SAFE. See VF-7.
        detail: >-
          The independent-blocks reference is conservative under positive block correlation, so the
          reported "none of the four exceeds the critical value" cannot be an artifact hiding a
          heterogeneity signal -- the correctly scaled statistic would only be larger. The producer's
          "SENSITIVITY DEMONSTRATION ONLY, not a verdict" label is accurate and adequate. The power
          table is likewise conditional on independent blocks and is labelled as such. The exact
          reference at Stage B is a whole-trial bootstrap, which needs no knowledge of cbar; that
          route is correctly specified.
      what_remains_unverified_and_is_correctly_declared: >-
        Clause (b) -- the half of the control that touches the JOINT law and is the only
        (T)-arm-only check by construction -- is entirely unevaluated, because no committed run
        records pairwise-by-position counts. The amendment adds pair_counts_by_position.csv as a
        required artifact, which is the right fix, but until a run produces it CTRL-POSHOM is a
        first-moment control with a second-moment clause on paper. The producer says this plainly.
      numbers_I_recomputed_exactly: >-
        Q_raw = 55.7448 / 46.8807 / 48.8178 / 79.2735 and Q/(n_e-1) = 1.2388 / 1.0418 / 0.8876 /
        0.8907 from the committed per-block failure counts -- identical to phase6 to five decimals.
        The power tables in R2.3 match calibration_results.json phase6 row for row, including the
        PS-A blindness at Stage-A T (power 0.029 at a 20% single-block bias).
      defect: VF-6.

    R3:
      verdict: CONFIRMED IN FULL. Every number recomputed independently and exactly.
      recomputed:
      - {set: PS-A,  cap_minus_M_mean_in_M_sigma: 63.11, max_w_on_T_in_M_sigma: 4.00, D1_separation_SE: 135.42}
      - {set: PS-R1, cap_minus_M_mean_in_M_sigma: 39.06, max_w_on_T_in_M_sigma: 4.20, D1_separation_SE: 132.08}
      - {set: PS-R3, cap_minus_M_mean_in_M_sigma: 49.68, max_w_on_T_in_M_sigma: 4.07, D1_separation_SE: 106.02}
      - {set: PS-R5, cap_minus_M_mean_in_M_sigma: 69.99, max_w_on_T_in_M_sigma: 4.14, D1_separation_SE: 78.77}
      assessment: >-
        The demotion of D3 from discriminator to hard support invariant is correct and the reasoning
        generalizes: a discriminator must FORCE the side it rules out, and the alternative must
        violate that forced value. D3 forces the (T) side and the (M) alternative sits 39-70 (M)sigma
        INSIDE the cap, so it cannot fire on (M) at any reachable T. D1 forces the (M) side
        (gamma = 1 exactly) and (T) sits 78.8-135.4 SE away with a working positive control
        (gamma-hat on NULL-M: 1.000341 / 1.004460 / 0.998680 / 1.000812). Striking v1's "violated
        with probability ~1 on (M)" is a correction of a false statement in an approved contract and
        should be recorded as such.
      the_negative_answer_is_the_right_deliverable: >-
        R3 answers "no cheap probability-1 (T)-vs-(M) discriminator is available here" and says so
        rather than padding. Under docs/inventor-protocol.md section 4 this meets the closure
        standard: it names the obstruction (the two laws differ in DISPERSION, not location -- p-hat
        matches the analytic p* to 5.2e-7-1.5e-5 by construction, and the largest w(etilde) seen on
        (T) sits only 4.0-4.2 (M)sigma above the (M) mean, so any location-based detector is the
        wrong shape and a support cap is the most extreme location-based detector there is), gives
        the argument, and names what remains open (the sumset-membership test, correctly classified
        as a hard combinatorial problem rather than a detector). The producer also correctly declines
        to claim exhaustiveness. D6 is proposed, unrun, and honestly described as buying diagnostic
        detail rather than separation.

    R4:
      verdict: ARITHMETIC CONFIRMED EXACTLY; DOMINANCE CLAIM CONFIRMED; THE OBJ-3 "CORRECTION" IS A
        REFINEMENT, NOT A CORRECTION (VF-5).
      allocation_arithmetic_recomputed_independently:
      - {set: PS-A,  q_hat: 0.00033445, m: 16, s_90: 16, T_stab_m: 1.246e45, T_alloc: 1.0e8, k_max_at_alloc: 3}
      - {set: PS-R1, q_hat: 0.19742737, m: 16, s_90: 25, T_stab_m: 1.452e8,  T_alloc: 1.0e8, shortfall: 1.452, k_max_at_alloc: 15}
      - {set: PS-R3, q_hat: 0.31994629, m: 17, s_90: 33, T_stab_m: 1.000e6,  T_alloc: 2.0e7, margin: 20.0, k_max_at_alloc: 20}
      - {set: PS-R5, q_hat: 0.41412035, m: 30, s_90: 60, T_stab_m: 2.554e7,  T_alloc: 2.0e7, shortfall: 1.277, k_max_at_alloc: 29}
      note_on_the_inversion: >-
        Confirmed. T_stab(PS-R1, 16) at the modelled q = 0.2306 is 2.915e7 (the contract's frozen
        2.91e7); at the measured q-hat it is 1.452e8. The margin does not shrink from 3.4x to 2.9x --
        it inverts to 0.69x. ST-4 is triggered at PS-R1 and PS-R5, and v1's success criterion (iv) is
        unsatisfiable by arithmetic at two of its three sets. The v2 restatement -- report k_max and
        declare k = m NOT REACHED under ST-4, a budget outcome and never a null result -- is the
        correct handling under AGENTS.md rule 5.
      dominance_claim_recomputed_independently:
        method: >-
          Fresh calibration (200,000 draws) plus fresh power measurement (50,000 draws per grid
          point) against the same declared two-point common-mode mixture at eps = 0.05, MDE
          interpolated at 80% power in log-effect space -- my own draws, my own seed.
        rows:
        - {set: PS-R3, k: 17, T: 1.0e6, core_seconds: 485,    mde80_mine: 0.354, mde80_producer: 0.355}
        - {set: PS-R3, k: 17, T: 5.0e6, core_seconds: 2426,   mde80_mine: 0.164, mde80_producer: 0.165}
        - {set: PS-R3, k: 17, T: 1.0e7, core_seconds: 4852,   mde80_mine: 0.092, mde80_producer: 0.092}
        - {set: PS-R3, k: 17, T: 2.0e7, core_seconds: 9705,   mde80_mine: 0.077, mde80_producer: 0.077}
        - {set: PS-R1, k: 16, T: 1.0e8, core_seconds: 39135,  mde80_mine: 0.422, mde80_producer: 0.427}
        - {set: PS-R1, k: 16, T: 1.452e8, core_seconds: 56823, mde80_mine: 0.345, mde80_producer: 0.345}
        - {set: PS-R1, k: 16, T: 1.0e9, core_seconds: 391346, mde80_mine: 0.128, mde80_producer: 0.127}
        - {set: PS-R5, k: 30, T: 2.0e7, core_seconds: 13318,  mde80_mine: 0.383, mde80_producer: 0.557,
           note: 'the one disagreement; see below'}
        - {set: PS-R5, k: 30, T: 2.554e7, core_seconds: 17007, mde80_mine: 0.376, mde80_producer: 0.362}
        - {set: PS-R5, k: 30, T: 1.0e8, core_seconds: 66590,  mde80_mine: 0.175, mde80_producer: 0.176}
        - {set: PS-A,  k: 3,  T: 1.0e8, core_seconds: 60005,  mde80_mine: 0.689, mde80_producer: 0.688}
        verdict: >-
          PS-R3 AT k = m DOMINATES ON BOTH AXES AT ONCE, CONFIRMED WITHOUT INTERPOLATION: PS-R3 at
          T = 1e7 costs 4,852 core-seconds and reaches MDE80 = 0.092 bits; PS-R1 at T = 1e9 costs
          391,346 core-seconds and reaches only 0.128; PS-R5 at T = 1e8 costs 66,590 and reaches only
          0.175. That is a strictly better detectable effect at 1/81 of PS-R1's cost and 1/14 of
          PS-R5's. The scale-invariant figure of merit core-seconds x MDE80^2 recomputes to 41
          (PS-R3, T=1e7), 2044 (PS-R5, T=1e8), 6454 (PS-R1, T=1e9), 28479 (PS-A k=3) -- matching the
          producer's 41 / 2058 / 6284 / 28380.
        the_one_disagreement: >-
          At PS-R5 T = 2e7 I measure MDE80 = 0.383 against the producer's 0.557. Neither is reliable:
          the power grid jumps from 0.03 at 0.2 bits to 0.85 at 0.4 bits, so the 80% crossing is
          interpolated across a factor-2 gap. The producer's value is also internally inconsistent
          with its own neighbour -- 0.557 -> 0.362 for a 1.28x increase in T implies a 1.54x
          improvement where T^(-1/2) allows 1.13x. The dominance conclusion does not depend on this
          row. RECOMMENDATION: refine the power grid near the crossing before any MDE number is
          quoted downstream, or quote the figure of merit instead, which is stable.
        scope_caution_the_amendment_should_carry: >-
          MDE80 is compared ACROSS SETS at different orders (k = 17 at n_e = 56 versus k = 16 at
          n_e = 46) and against ONE declared alternative family. "PS-R3 dominates" is literally true
          on the two axes (core-seconds, MDE80 in bits at k = m) and does not by itself establish
          that PS-R3 is the better test of A17, because the estimand differs. The producer does state
          the scope narrowing -- PS-R1 is the only order-matched arm at HQC-1's shape, and anchoring
          (iv) on PS-R3 anchors it on HQC-3's shape -- and retains ST-3. That disclosure must survive
          into every downstream record, not only into this one.
      cost_of_the_contract_as_written: >-
        Recomputed at the measured throughputs (1502-2555 trials/core-second): 60,005 + 39,135 +
        9,705 + 13,318 = 122,163 core-seconds against the contract's modelled 53,080, a factor 2.30.
        Confirmed. That is at or past the declared 2x contingency and is what the campaign budget
        must absorb.

    R5:
      verdict_on_the_specification: SOUND. The gate is the right gate and the coverage clause is the
        right clause.
      verdict_on_the_question_asked: >-
        NO -- "specified but unverified" is NOT acceptable for a MANDATORY BLOCKING gate, and the
        producer says so itself ("R5 is a specification change I wrote and could not independently
        confirm"). A blocking gate whose passage rests on a citation is a gate that has never been
        run in the configuration that binds. The producer's scope boundary was real (BATCH-003 was
        outside its read scope) and stating it rather than papering over it was correct; but the
        state it leaves behind cannot be admitted as-is, because the amendment would make a gate
        mandatory on the strength of someone else's measurement of an earlier, differently-specified
        check.
      SO_I_RAN_IT: >-
        This validator executed the proposed CTRL-ORACLE-v2 against the REAL oracle package at
        coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-6f50df/oracle_values.json,
        exactly as specified: each configuration's exact rational law_of_S, scaled by the lcm of its
        denominators to exact integer pseudo-counts, fed to stage_a.log2_A_from_hist -- the same
        function the (T) analysis uses -- and compared against the exact rational log2 A_k.
      result:
        configurations: 13
        cells: 40
        max_abs_difference_bits: 7.105427357601002e-15
        tolerance_required: 1.0e-12
        cells_with_abs_log2_A_k_gt_1_bit: 12
        required: 5
        cells_with_log2_A_k_negative: 18
        required: 5
        range_bits: [-2.8514531759345054, 9.965784284662087]
        coverage_clause_met: true
        gate_passes: true
        exemplars:
        - {config: 'comonotone(n_e=8,p=1/10)', k: 4, exact: 9.965784, stage_a: 9.965784, diff: 0.0}
        - {config: 'fixed_weight(N=20,w=6)|threshold(n2=4,t=1)', k: 3, exact: -2.851453, stage_a: -2.851453, diff: 0.0}
        - {config: 'mixture_iid(p=1/8,1/2;lam=1/2)|threshold(n2=4,t=1)', k: 5, exact: 3.216740, stage_a: 3.216740, diff: 8.9e-16}
        - {config: 'exactly_c(n_e=8,c=3)', k: 3, exact: -1.562242, stage_a: -1.562242, diff: 0.0}
      consequence: >-
        The gap is now CLOSED by this review, not by the producer and not by citation. CTRL-ORACLE-v2
        as specified passes against the real oracle package, its coverage clause is satisfiable by
        the package as it stands (40 cells exactly meets the >= 40 floor -- there is no slack, and
        the amendment should say so), and the 1e-12 tolerance has nearly three orders of margin. The
        red team's independent 40-cell / 1.2e-14 result also reproduces at the same order.
      what_is_still_NOT_established: >-
        Unchanged and correctly stated by the producer: this is an ESTIMATOR-ARITHMETIC gate only. It
        says nothing about the fixed-weight sampler, the ring product, the truncation, the folded-WHT
        decoder, or the calibrated interval -- and R1 shows the interval is where the trouble was.
        The end-to-end CTRL-ORACLE (whole pipeline against an exact instance) remains unbuilt:
        stage_a.decode_blocks is hard-wired to a size-128 WHT while the oracle's block models are
        threshold(n2=4,t=1) and RM(1,2). That is OPEN-6 and it is the single largest remaining hole
        in the instrument.
      required_correction: >-
        Replace evidence_that_this_gate_passes with this validator's run (TASK-20260806-301f68), cite
        it as the verification of record, and add that the >= 40-cell floor is met with zero slack by
        the current package, so any future reduction of the oracle configuration set breaks the gate.

  # ======================================================================
  # 7. Overall
  # ======================================================================
  overall_verdict:
    status: ADMIT WITH REQUIRED CORRECTIONS
    plain_statement: >-
      The repair is real and it is largely right. All four diagnosed defects are genuine, the
      replacement rule is the correct instrument for the defect it repairs, and it is correctly sized
      against the null it declares -- which I established by drawing my own samples rather than by
      reading theirs. The producer's numbers reproduce almost everywhere; where they do not, the
      producer is right and an earlier reviewer was wrong (OPEN-7). The producer also declined a
      measurement it was not authorized to take, at real cost to its own deliverable, and disclosed
      why. That is the behaviour the contract is built to reward.
    but: >-
      Three things must be fixed before a Coordinator ledger archive amends the contract, and one of
      them is blocking. VF-1: the frozen constants as transcribed do not deliver the sizes printed
      beside them at k = 2, and two of three fail the amendment's own acceptance gate -- the record
      would fail itself on execution. VF-3: the plug-in sensitivity was never tested at PS-A, the one
      set where the amended success criterion actually delivers, and at PS-A it fails within its own
      3 SE. VF-5: R4.2's headline compares an SD ratio to a variance ratio and presents a refinement
      as a correction of the previous red team.
    and_one_thing_about_the_evidence_rather_than_the_rule: >-
      VF-2. The headline "measured out-of-sample size 0.252%-0.290%" is close to a tautology: the
      identical procedure on a standard normal returns 0.2476%-0.2894% over 200 repetitions, with
      99.5% of them inside the claimed band. The rule IS calibrated -- but that number is not what
      establishes it, and the amendment leads with it. What establishes it is the contrast against
      v1, which holds independently.
    claim_tier_unchanged: >-
      TOY. This review validates an instrument repair. It says nothing about HQC, about A17 or A5,
      about any decoding-failure rate, or about any standardized parameter set, and nothing here may
      be cited as if it did.
    authority: >-
      This report changes no research status. H-HQC-18d1b4 remains proposed; EXP-HQC-982268 remains
      at version 1 with its unrepaired INV-NULL binding; the amendment remains inert. Only a
      Coordinator ledger archive may amend the approved contract.

