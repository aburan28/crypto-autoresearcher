  recommendations_for_the_coordinator:
  - >-
      Rule on OPEN-8 before Stage B is scheduled. This validator's recommendation is to authorize
      k = 2 explicitly as a Stage-B cell under the frozen v2 interval -- it is the cheapest and
      best-conditioned order in the design -- rather than leaving a derivable primary measurement
      sitting inside a diagnostics-only archive with no stated rule about it.
  - >-
      Retire OPEN-7. Two independent 20,000-replicate measurements agree to 0.08 pp; the red team's
      300-draw estimate at that one cell is superseded, not unexplained.
  - >-
      The R4 allocation finding is the item with real budget consequence: at the measured q-hat, k = m
      is out of reach at PS-R1 and PS-R5 at the funded allocation, and the contract as written costs
      2.30x its modelled core-seconds. PS-R3 at T = 1e7 buys a strictly better detectable effect at
      1/81 of PS-R1's cost -- but it anchors criterion (iv) on HQC-3's shape rather than HQC-1's, and
      that narrowing must be carried in every downstream record, not just noted here.
  - >-
      OPEN-6 remains the largest hole and neither this batch nor this review closes it: no arm tests
      the (T) joint law against a known answer, and the end-to-end CTRL-ORACLE cannot be built until
      stage_a.decode_blocks accepts the oracle's block models. CTRL-POSHOM narrows the gap for
      position-dependent defects only, and its clause (b) needs an artifact no committed run
      produces.

