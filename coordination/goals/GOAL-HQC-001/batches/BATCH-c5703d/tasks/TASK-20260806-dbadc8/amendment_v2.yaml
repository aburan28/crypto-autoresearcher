  admission_and_ceiling: >-
    BINDING, INHERITED VERBATIM FROM VERSION 1 AND NOT RELAXED. This amendment repairs an
    INSTRUMENT. It makes NO security claim about HQC in either direction, adjudicates nothing about
    assumption A17 or A5 or any decoding-failure rate, and touches no standardized HQC parameter
    set. CLAIM TIER IS CAPPED AT TOY. A repaired instrument is not a result. No number in this file
    was produced by sampling an HQC object: every draw is from S ~ Binomial(n_e, q-hat) under an
    explicit null, or from an explicitly declared alternative family used only to measure power.
    No log2_A_k or log2_A_m was computed on any space-(T) arm by the authoring task.

  what_this_amendment_does_not_change:
  - The frozen preregistered prediction log2 A_k = 0 for all k. UNCHANGED. What changes is the
    DECISION RULE that tests it, not the thing tested.
  - The estimand mubar_k = E[C(S,k)]/C(n_e,k), the Jordan identity, the estimator, and the S
    histogram as the sufficient statistic. UNCHANGED.
  - The (T) sampler, the ring rule, the weight rule, the parameter sets, the decoder, the tie rule,
    the seed scheme, and the master seed 20260804. UNCHANGED. Stage A's evidence is that the
    sampler is sound (D2 zero deviations over 9,827,880 vectors; D5 zero mismatches; p-hat matches
    the analytic p* to 5.2e-7 to 1.5e-5; PS-A upper tails match SPEC Table 10 to 0.0/-2.0/+1.4
    weight units; 7200/7200 decoder cross-check). The repair is to the decision rules and the
    controls, not to the sampler.
  - ST-4, ST-6, ST-7 and the deliberate_exclusions list. UNCHANGED. In particular NO raising of p*
    to buy reachability, and NO reduction of m.
  - The prohibition on presenting toy-scale evidence as crypto-scale, and the requirement that
    every conclusion cite its experiment/run/evidence IDs.
  no_completed_run_is_re_scored: >-
    RUN-HQC-982268-STAGEA-a computed no log2_A_k on any (T) arm and therefore produced no primary
    measurement to re-score. Its NULL-ARM numbers are re-INTERPRETED here (their decision rule was
    mis-sized) but no archived number is altered, and EV-HQC-75c05b stands as written.

