          interval as clause (a). Under (d) the value is still PRINTED AND MARKED as NOT SEPARABLE
          FROM THE NULL, never discarded.
    falsification_criterion:
      version: 2
      supersedes: 'EXP-HQC-982268 v1 falsification_criterion'
      statement: >-
        THE FROZEN PREDICTION log2 A_k = 0 IS CONTRADICTED AT A TESTED PARAMETER SET AND ORDER if
        log2 Ahat_m lies OUTSIDE the frozen calibrated interval [c_lo, c_hi] for that (set, k = m, T),
        with (i) every null arm inside its own frozen interval at that k, (ii) gammahat < 0.95 at
        that set, (iii) T >= T_stab(m) at the MEASURED q-hat, and (iv) the rule's realized size
        measured out of sample and lying in [0.002, 0.004] at that cell.
      what_changed_and_why: >-
        The threshold "3 x jackknife SE" is replaced by a two-sided interval whose size is MEASURED.
        Clause (iii) is new and is what OBJ-1 forces: at the contract allocation PS-R1 and PS-R5 do
        not satisfy it at k = m (see R4). Clause (iv) is new and is the standing guarantee that the
        rule remains what it claims to be at run time.
      unchanged: >-
        TWO-SIDED. No sign assumed. The outcome is SCOPED to that set and that order, is NOT a
        statement about HQC-1/3/5 without HEUR-HQC-1,-2,-3,-5,-6 rendered explicitly, and is NOT a
        security claim in either direction. In the optimistic direction it must still be netted
        against the 2.72 / 4.25 / 5.40 bits of built-in conservatism in a17_sensitivity.yaml step 9,
        with that budget's own (M)-space caveat.
    interpretation_of_a_null_result_v2:
      supersedes: >-
        v1's advertised widths "+-0.096 bits at PS-R1 (k=16), +-0.024 at PS-R3 (k=17), +-0.078 at
