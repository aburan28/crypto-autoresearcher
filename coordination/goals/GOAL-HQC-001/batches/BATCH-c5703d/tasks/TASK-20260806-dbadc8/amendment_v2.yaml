      - {T: 2.554e7, core_seconds: 17007, interval: '-0.119 / +0.323', measured_size: 0.00276, MDE80_bits: 0.362,
         note: 'T_stab(30) at the measured q-hat -- the minimum funded allocation'}
      - {T: 5.0e7,   core_seconds: 33295, interval: '-0.089 / +0.220', measured_size: 0.00295, MDE80_bits: 0.332}
      - {T: 1.0e8,   core_seconds: 66590, interval: '-0.067 / +0.152', measured_size: 0.00286, MDE80_bits: 0.176}
      PS-A_k_3:
      - {T: 5.34e7, core_seconds: 32042,  interval: '-1.015 / +0.669', measured_size: 0.00295, MDE80_bits: null,
         note: 'T_stab(3) at the measured q-hat. MDE80 not bracketed by the tested grid (power 0.71
                at 0.80 bits)'}
      - {T: 1.0e8,  core_seconds: 60005,  interval: '-0.693 / +0.515', measured_size: 0.00307, MDE80_bits: 0.688,
         note: 'the contract allocation'}
      - {T: 3.0e8,  core_seconds: 180014, interval: '-0.368 / +0.317', measured_size: 0.00254, MDE80_bits: 0.411}
      what_this_table_settles: >-
        PS-R3 AT k = m DOMINATES EVERY OTHER ARM ON BOTH AXES AT ONCE, which needs no interpolation
        to state: PS-R3 at T = 1e7 costs 4,852 core-seconds and reaches MDE80 = 0.092 bits;
        PS-R1 at T = 1e9 costs 391,346 core-seconds and reaches only 0.127 bits. PS-R3 therefore
        reaches a STRICTLY BETTER detectable effect at 1/81 OF THE COST. Against PS-R5's best tested
        row (T = 1e8, 66,590 core-seconds, MDE80 = 0.176) the factor is 1/14 of the cost for
        strictly better resolution. T = 1e7 at PS-R3 is HALF the contract allocation and about
        1,213 wall-seconds on this host's 4 cores. It is the cheapest interpretable measurement arm
        this contract has and it is the one the Coordinator should rank. On the natural
        scale-invariant figure of merit (core-seconds x MDE80^2, invariant because MDE ~ T^-1/2 and
        cost ~ T) the four arms sit at 41 (PS-R3, T=1e7), 2058 (PS-R5, T=1e8), 6284 (PS-R1, T=1e9)
        and 28380 (PS-A k=3, T=1e8) -- a spread of nearly three orders of magnitude.
      MC_reproducibility_check: >-
        The PS-R1 k=16 T=1e8 interval was calibrated twice from independent draw sets (1,000,000
        replicates in phase 3, 200,000 in phase 9): [-0.14800, +0.34749] versus
        [-0.14838, +0.34803]. Agreement to 0.0004 and 0.0005 bits, about 0.1% of the interval width.
        The frozen constants are not Monte-Carlo noise.

  # ======================================================================
  # R5
  # ======================================================================
  R5_oracle_gate:
    defect: >-
      Stage A's ORACLE AGREEMENT gate hashes three sibling oracle files, re-runs oracle.py and
      deep-diffs its output against the JSON oracle.py itself produced, and runs oracle.py's own
      test suite. NO VALUE PRODUCED BY stage_a.py ENTERS THE COMPARISON. It can fail only if
      oracle.py is non-deterministic or a sibling file was mutated. It is a chain-of-custody and
      reproducibility check carrying the name of a cross-validation it does not perform. Meanwhile
      CTRL-ORACLE -- the only item in the contract that tests the estimator against an answer that
      is KNOWN rather than SAMPLED -- was declared 'NOT RUN, optional and non-blocking'.
    replacement:
      id: CTRL-ORACLE
      version: 2
      kind: 'PRIMARY ESTIMATOR GATE. Mandatory and blocking. No longer optional.'
      construction: >-
        For each oracle configuration, take its EXACT RATIONAL law_of_S, multiply by the lcm of the
        denominators to obtain exact integer pseudo-counts summing to that lcm, feed the resulting
        histogram to stage_a.log2_A_from_hist -- the same function the (T) analysis uses -- and
        compare against the exact rational log2 A_k computed independently from the same law. Fully
        deterministic; no sampling.
      required_coverage: >-
        At least 40 (configuration, k) cells, of which at least 5 have |log2 A_k| > 1 bit and at
        least 5 have log2 A_k < 0. THIS CLAUSE IS THE POINT: the v1 instrument was calibrated only
        at the null point of a two-sided test whose entire purpose is detecting departures from it.
      tolerance: 'max |difference| <= 1e-12 bits over all cells'
      consequence_of_failure: 'FAILED_IMPLEMENTATION before any measurement is taken. Blocking.'
      renaming: >-
        The v1 phase that hashes and re-runs the oracle is RETAINED and RENAMED to
        ORACLE-PROVENANCE. It is a real check -- chain of custody and determinism -- and it keeps
        its own gate row. It may not be reported under the name of an agreement check.
    evidence_that_this_gate_passes:
      status: 'PASSES, ON THE RED TEAM''S MEASUREMENT, NOT ON THIS TASK''S'
      red_team_result: >-
        TASK-20260806-dd901b section 5: 40 cells across 13 oracle configurations, max discrepancy
        1.2e-14 bits, including B2-comonotone-extreme-positive k=4 at +9.965784 and
        A3-negative-global-fixed-weight-threshold k=3 at -2.851453.
      why_this_task_did_not_re_verify_it: >-
        The oracle package lives in BATCH-003/tasks/TASK-20260803-6f50df and is OUTSIDE
        TASK-20260806-dbadc8's read scope. Its files were neither read nor re-run here. This is a
        scope boundary, stated rather than papered over: R5 is a specification change this task
        wrote and could not independently confirm.
      what_this_task_DID_verify: >-
        THE GATE MACHINERY, on exact rational laws constructed inside calibration.py: 27 cells over
        7 configurations, log2 A_k spanning -2.651 to +32.370 bits, max |difference| 5.3e-15 bits
        between the exact rational value and stage_a.log2_A_from_hist. This establishes that the
        lcm-scaling construction is exact and that the tolerance 1e-12 is achievable with three
        orders of magnitude to spare. It establishes nothing about the oracle package itself.
    what_this_gate_does_not_establish: >-
      Estimator arithmetic only. It says nothing about the fixed-weight sampler, the ring product,
      the truncation, the folded-WHT decoder, or the calibrated interval. R1 shows the interval was
      where the trouble was.

