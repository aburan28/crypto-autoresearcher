  open_items_added:
  - id: OPEN-6
    item: >-
      No arm tests the (T) JOINT law against an answer known in advance. CTRL-POSHOM clause (b)
      tests an exact symmetry of that law, which is strictly weaker; CTRL-ORACLE-v2 tests the
      estimator arithmetic on laws that never pass through the sampler or the decoder.
    status: OPEN
    successor: >-
      An end-to-end CTRL-ORACLE running the WHOLE Stage-A pipeline on an exactly enumerable
      instance. Blocked today because stage_a.decode_blocks is hard-wired to a size-128 WHT while
      the oracle's toy block models are threshold(n2=4,t=1) and RM(1,2). The fix is a decoder
      interface parameterised by block model, plus an oracle configuration at RM(1,7) with a ring
      small enough to enumerate. NOT DESIGNED HERE AND NOT CLAIMED TO BE CHEAP.
  - id: OPEN-7
    item: >-
      The realized size of INV-NULL v1 at PS-R5 / NULL-M / k = 30 is measured here at 7.76%
      (1552/20000, 95% CI [7.40, 8.14]) against the red team's 12.7% (38/300). The red team's point
      estimate lies outside this interval, so the two are not reconciled as Monte-Carlo noise at
      face value. It changes no conclusion -- both are 29x-47x the nominal 0.27% -- but it is an
      unexplained discrepancy between two independent measurements of the same quantity and is
      recorded rather than averaged away.
    status: OPEN
    successor: 'a third measurement, or a diff of the two batching conventions (linspace-edged
                batches versus equal batches with the remainder in batch 0)'
  - id: OPEN-8
    item: >-
      RUN-HQC-982268-STAGEA-a archives the (T) arms' full S histograms as a chartered Stage-A
      diagnostic. log2 A_2 is a two-line function of Var(S) computed from that histogram, so the
      k = 2 measurement is recoverable from the committed run record even though Stage A was
      authorized to compute no (T) joint moment and correctly did not. This is a disclosure surface,
      not a violation: nothing was computed and nothing is claimed. TASK-20260806-dbadc8 declined to
      form Var(S) on any (T) histogram for exactly this reason.
    status: OPEN
    successor: >-
      A Coordinator ruling on whether archiving the sufficient statistic of an unauthorized
      measurement is itself in scope for a diagnostics-only authorization. The archive is immutable
      and this proposes no change to it.

