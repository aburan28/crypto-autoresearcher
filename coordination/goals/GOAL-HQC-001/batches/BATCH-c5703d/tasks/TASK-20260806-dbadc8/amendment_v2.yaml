      - {set: PS-R3, k: 17, T: 2.0e7, interval: '-0.040 / +0.051 bits', v1_advertised: '+-0.024'}
      - {set: PS-R5, k: 30, T: 2.0e7, interval: '-0.131 / +0.349 bits', v1_advertised: '+-0.078'}
