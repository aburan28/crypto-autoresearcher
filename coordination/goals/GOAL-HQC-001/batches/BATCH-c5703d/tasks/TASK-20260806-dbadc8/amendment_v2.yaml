  # ======================================================================
  # R2
  # ======================================================================
  R2_control_re_ranking:
    CTRL_BS_demotion:
      from: 'NULL OBJECT - PRIMARY'
      to: 'ESTIMATOR / RE-INDEXING CONTROL - tertiary'
      structural_reason_now_stated_in_the_contract: >-
        stage_a.py builds the pseudo-sample as Fb[:,j] = np.roll(F[:,j], -off[j]). A cyclic roll is
        a PERMUTATION OF A COLUMN, so every per-block column sum is preserved EXACTLY. Therefore
        q-hat^BS is IDENTICALLY q-hat^T, not approximately (verified on the committed histograms:
        PS-A 8122/8122, PS-R1 5200049/5200049, PS-R3 9159668/9159668, PS-R5 13187613/13187613).
        Both the numerator and the denominator of Ahat_k^BS are built from the same indicator matrix
        F, so a WRONG F -- from a broken sampler, ring product, truncation or decoder -- enters the
        control and the thing it controls identically and cancels. CTRL-BS therefore CANNOT FAIL for
        any defect upstream of the indicator matrix. It fired 0 of 108 cells with |z| never above
        1.67.
      corrected_what_it_matches: >-
        v1 claimed it matches "the EXACT true marginal block-failure law - not a modelled marginal.
        This is a stronger match than any parametric null can achieve, which is why it is primary."
        The premise is true and the conclusion is backwards: matching the (T) arm's own marginal
        EXACTLY is what makes the arm non-independent, not what makes it strong.
      corrected_what_it_establishes: >-
        That the C(S,k)/C(n_e,k) arithmetic and the calibrated interval behave correctly on an
        indicator matrix with the (T) arm's exact per-block marginals and destroyed cross-block
        pairing. Nothing else. E[Ahat_k^BS] = 1 is ALSO not exact (Maclaurin; the executor found
        this against itself in Stage A) and the v1 phrase "EXACTLY, for every k" is struck.
    NULL_M_promotion:
      from: 'NULL OBJECT - i.i.d. by construction on the coordinate level'
      to: 'NULL OBJECT - PRIMARY'
      reason: >-
        It is the only arm that exercises the decoder. A_k = 1 is a THEOREM on it (functions of
        disjoint blocks of independent coordinates). It demonstrated real sensitivity in Stage A
        (|z| to 8.39) and it carries D1's positive control (gammahat 1.00034-1.00446 on an arm where
        the true value is exactly 1). NULL-P remains the unconditional estimator-arithmetic check.
      limit_stated: >-
        NULL-M does not touch the fixed-weight sampler, the ring product or the truncation. Making
        it primary does not close that gap; CTRL-POSHOM below is the arm added for it.
    new_control:
      id: CTRL-POSHOM
      kind: 'INSTRUMENT CONTROL - PRIMARY. Positional homogeneity under ring-shift invariance.'
      status_in_v1: DID NOT EXIST
      forced_value_declared_analytically_before_any_measurement: >-
        e'' = x*r_2 + r_1*y + e in R = F_2[X]/(X^n - 1). For every s in Z_n the map v -> X^s v is a
        bijection of each fixed-weight set, and (X^s x, X^s y, X^s e, r_1, r_2) has the same joint
        law as (x, y, e, r_1, r_2). Hence X^s e'' has the same law as e'', EXACTLY, for every s.
        Block j occupies coordinates [j*L, (j+1)*L) with L = n_2*dup, and n_e*L = N < n, so the
        block-j window is the block-0 window shifted by the legal ring shift s = j*L. Two exact
        population consequences follow, and they are the control's FORCED VALUES:
        CLAUSE (a)  E[F_j] = q  for every block j.  (First moment.)
        CLAUSE (b)  P[F_j = F_{j+d} = 1] depends only on d, not on j, for every pair with
                    0 <= j < j+d < n_e.  (Second moment -- this clause touches the JOINT law.)
        Both are theorems about the (T) object, derived from the ring structure and not from any
        datum. Neither is a modelling assumption.
      why_it_can_fail_where_CTRL_BS_cannot: >-
        CTRL-POSHOM is evaluated on the (T) indicator matrix ITSELF, and its forced value is a
        property of the UPSTREAM path -- ring product, truncation window, block partition, dup
        folding, decoder indexing. CTRL-BS's np.roll re-indexing destroys the (j, j+d) pairing
        entirely, so a CTRL-BS pseudo-sample satisfies clause (b) trivially: clause (b) is a
        (T)-arm-only check by construction.
      observations_that_would_break_it:
      - An off-by-one truncation window, which makes block 0 or block n_e-1 special.
      - A wrong ring modulus n, or a wrap-around error in the sparse shift-XOR near the n - N gap,
        which makes blocks adjacent to the wrap special.
      - A dup-folding stride error, which at PS-A (dup = 3, n_2 = 384) makes specific blocks special.
      - A decoder or WHT indexing bug that treats one block position differently from another.
      - Any of these appears as an offset-dependent q (clause a) or a position-dependent pair moment
        (clause b), neither of which a correct instrument can produce.
      what_it_CANNOT_detect_stated_plainly: >-
        A POSITION-EQUIVARIANT defect -- a wrong decoder or a wrong truncation applied identically
        at every block -- passes CTRL-POSHOM. That residual is covered, imperfectly, by CTRL-DEC
        (brute-force minimum-distance cross-check), CTRL-REPLAY (independent code path for the ring
        product and truncation), D2, and BASE-TABLE10 (the only comparison against a published
        measurement of the same (T) object). This control does not close the gap the Stage-A report
        named -- that NO null arm tests the (T) joint law against a known answer -- and it is not
        claimed to.
      test_statistic_clause_a:
        definition: 'Q = sum_j (n_j - nbar)^2 / (T * q-hat * (1 - q-hat)), n_j the per-block failure
                     count over T trials.'
        exact_expectation: >-
          E[Q] = (n_e - 1) * (1 - c/v) with v = q(1-q) and c = Cov(F_j, F_j'), equivalently
          c/v = (gamma_S - 1)/(n_e - 1) with gamma_S = Var(S)/(n_e q(1-q)). The correction is
          suppressed by 1/(n_e - 1).
        calibration_at_stage_B: >-
          BOOTSTRAP OVER WHOLE TRIALS from the recorded indicator matrix. This is exactly valid,
          distribution-free, and needs no knowledge of c. 10,000 resamples; the critical value is
          the empirical 99.73% quantile. THIS IS THE BINDING PROCEDURE.
        why_the_authoring_task_could_not_run_that: >-
          gamma_S is a (T) SECOND moment, and on {0..n_e}
          A_2 = [Var(S) + (n_e q)^2 - n_e q] / (2 C(n_e,2) q^2), so evaluating it WOULD BE the k = 2
          measurement. TASK-20260806-dbadc8 is not authorized to produce it and did not. The numbers
          below therefore use the INDEPENDENT-BLOCKS reference and are a CAN-FAIL SENSITIVITY
          DEMONSTRATION, never a pass/fail verdict on the Stage-A data.
      measured_sensitivity_independent_blocks_reference:
        note: 'power to detect a single block whose marginal is biased by the stated relative amount'
        at_stage_A_achieved_T:
        - {set: PS-A,  T: 527928, bias_1pct: 0.002, bias_2pct: 0.003, bias_20pct: 0.029,
           verdict: 'ESSENTIALLY BLIND at this T -- PS-A has only 8122 block failures in total'}
        - {set: PS-R1, T: 572588, bias_1pct: 0.083, bias_2pct: 0.923, bias_5pct: 1.000}
        - {set: PS-R3, T: 511228, bias_1pct: 0.223, bias_2pct: 0.999, bias_5pct: 1.000}
        - {set: PS-R5, T: 353832, bias_1pct: 0.153, bias_2pct: 0.994, bias_5pct: 1.000}
        at_contract_stage_B_allocation:
        - {set: PS-A,  T: 1.0e8, bias_2pct: 0.075, bias_5pct: 0.998, bias_10pct: 1.000}
        - {set: PS-R1, T: 1.0e8, bias_0p2pct: 1.000}
        - {set: PS-R3, T: 2.0e7, bias_0p2pct: 0.560, bias_0p5pct: 1.000}
        - {set: PS-R5, T: 2.0e7, bias_0p2pct: 0.748, bias_0p5pct: 1.000}
      observed_on_the_committed_stage_A_first_moments:
        note: 'Q/(n_e-1) against an independent-blocks null mean of 1. NOT A VERDICT (see above).'
        PS-A:  {Q: 55.745, Q_over_df: 1.2388, indep_blocks_critical: 76.039, exceeds: false}
        PS-R1: {Q: 46.881, Q_over_df: 1.0418, indep_blocks_critical: 76.098, exceeds: false}
        PS-R3: {Q: 48.818, Q_over_df: 0.8876, indep_blocks_critical: 88.515, exceeds: false}
        PS-R5: {Q: 79.273, Q_over_df: 0.8907, indep_blocks_critical: 130.474, exceeds: false}
      new_required_artifact: >-
        experiments/EXP-HQC-982268/runs/<RUN-ID>/pair_counts_by_position.csv -- the counts
        #{t : F_{t,j} = F_{t,j+d} = 1} for every (j, d) with 0 <= j < j+d < n_e, on the (T) arm.
        Clause (b) cannot be evaluated without it, and RUN-HQC-982268-STAGEA-a did not record it.
      consequence_of_failure: >-
        A CTRL-POSHOM failure is FAILED_IMPLEMENTATION, not a negative observation about A17: both
        clauses are theorems about the (T) object, so a violation is an instrument defect by
        construction.
    control_ranking_after_this_amendment:
      1: 'NULL-M      - PRIMARY null object. Exercises the decoder; A_k = 1 is a theorem.'
      2: 'CTRL-POSHOM - PRIMARY instrument control. Only control sensitive upstream of the
                        indicator matrix. Forced value is a theorem.'
      3: 'CTRL-ORACLE - PRIMARY estimator gate, off the null, both signs. See R5.'
      4: 'NULL-P      - secondary. Unconditional estimator-arithmetic check.'
      5: 'CTRL-DEC, CTRL-REPLAY - instrument controls, unchanged.'
      6: 'CTRL-WBP    - mechanism discriminator, unchanged.'
      7: 'CTRL-BS     - tertiary re-indexing control. CANNOT FAIL upstream of the indicator matrix.'
    residual_gap_recorded_not_closed: >-
      After this amendment NO arm still tests the (T) JOINT law against an answer known in advance.
      CTRL-POSHOM clause (b) tests an exact SYMMETRY of that law, which is strictly weaker. The
      end-to-end CTRL-ORACLE (whole pipeline on an exactly enumerable instance) remains unbuilt
      because stage_a.decode_blocks is hard-wired to a size-128 WHT while the oracle's toy block
      models are threshold(n2=4,t=1) and RM(1,2). Recorded as OPEN-6 below.

  # ======================================================================
  # R3
  # ======================================================================
  R3_D3_restatement:
    defect: >-
      v1 advertised D3 as a drift detector: 'w(e-tilde) <= 2*omega*omega_r + omega_e (a hard support
      cap on (T), violated with probability ~1 on (M))', and why_this_matters called D2, D3 and D5
      'hard invariants that cannot be satisfied by an (M) sampler'. The parenthetical is FALSE at
      these parameters.
    measurement:
      note: 'on (M), w(e-tilde) ~ Bin(N, p-hat); the cap is quoted in (M) standard deviations above
             the (M) mean'
      rows:
      - {set: PS-A,  N: 17664, p_hat: 0.339789, cap: 9975, M_mean: 6002.03, M_sd: 62.949,
         cap_above_M_mean_in_M_sigma: 63.11, max_w_observed_on_T: 6254}
      - {set: PS-R1, N: 5888,  p_hat: 0.347915, cap: 3476, M_mean: 2048.52, M_sd: 36.549,
         cap_above_M_mean_in_M_sigma: 39.06, max_w_observed_on_T: 2202}
      - {set: PS-R3, N: 7168,  p_hat: 0.364944, cap: 4641, M_mean: 2615.92, M_sd: 40.758,
         cap_above_M_mean_in_M_sigma: 49.68, max_w_observed_on_T: 2782}
      - {set: PS-R5, N: 11520, p_hat: 0.376189, cap: 7973, M_mean: 4333.69, M_sd: 51.994,
         cap_above_M_mean_in_M_sigma: 69.99, max_w_observed_on_T: 4549}
      conclusion: >-
        An (M) sampler violates the cap with probability of order 10^-331 (PS-R1) to 10^-1064
        (PS-R5) under a normal approximation. D3 CANNOT FIRE ON (M) AT ANY REACHABLE T. It is not a
        (T)-vs-(M) discriminator and never was.
    restatement:
      id: D3
      version: 2
      kind: 'HARD SUPPORT INVARIANT (not a drift detector)'
      observable: 'w(e-tilde) <= 2*omega*omega_r + omega_e'
      rule: 'any violation is FAILED_IMPLEMENTATION'
      why: >-
        On (T), e'' is a sum of at most 2*omega*omega_r + omega_e ring monomials, so the bound holds
        with probability 1 and a violation is mathematically impossible. That is the whole of its
        content and it is worth keeping for exactly that: it catches a broken ring product or a
        broken truncation instantly, at zero cost.
      struck_text: '(a hard support cap on (T), violated with probability ~1 on (M))'
      also_struck: >-
        the clause in why_this_matters asserting that D3 is a hard invariant 'that cannot be
        satisfied by an (M) sampler'. D2 and D5 keep that description; D3 does not.
      moved: 'D3 is listed under INV-INVARIANT only. It is removed from the detectors list of
              space_T_guarantees_and_drift_detectors.'
    is_there_a_real_T_vs_M_discriminator:
      answer: 'YES, AND IT IS ALREADY IN THE CONTRACT: D1. No new detector is needed and none of
               the ones proposed below beats it. This is stated plainly rather than padded.'
      D1_measured_separation:
        observable: 'gammahat = Var(w(e-tilde)) / (N * p-hat * (1 - p-hat))'
        value_on_M: 'exactly 1 (a theorem)'
        rows:
        - {set: PS-A,  gamma_hat_T: 0.73642, se: 0.001946, separation_from_1_in_SE: 135.4,
           NULL_M_positive_control: 1.000341}
        - {set: PS-R1, gamma_hat_T: 0.75316, se: 0.001869, separation_from_1_in_SE: 132.1,
           NULL_M_positive_control: 1.004460}
        - {set: PS-R3, gamma_hat_T: 0.79031, se: 0.001978, separation_from_1_in_SE: 106.0,
           NULL_M_positive_control: 0.998680}
        - {set: PS-R5, gamma_hat_T: 0.81273, se: 0.002377, separation_from_1_in_SE:  78.8,
           NULL_M_positive_control: 1.000812}
        margin_to_the_0p95_alarm_band_in_SE: [109.7, 105.3, 80.7, 57.7]
      the_design_lesson_worth_recording: >-
        A DISCRIMINATOR MUST FORCE THE SIDE IT IS TRYING TO RULE OUT, AND THE ALTERNATIVE MUST
        ACTUALLY VIOLATE THAT FORCED VALUE. D1 forces the (M) side (gamma = 1 exactly on (M)) and
        the (T) value sits 79-135 SE away, so it fires. D3 forces the (T) side (the cap holds with
        probability 1 on (T)) and the (M) alternative sits 39-70 (M)-sigma inside it, so it cannot.
        Both are correct statements; only one is a detector. This is the generalizable content of
        the defect and is a candidate for KN-TECH promotion once seen on a second instrument.
      why_a_location_detector_is_the_wrong_shape_here: >-
        The (T) and (M) laws of w(e-tilde) have nearly the same MEAN by construction -- p-hat matches
        the analytic p* to 5.2e-7-1.5e-5, and p* is a deterministic function of (n, omega, omega_r,
        omega_e, N) that the sampler realizes by construction. The maximum w(e-tilde) observed on (T)
        sits only 4.0-4.2 (M)-sigma above the (M) mean at all four sets. The two laws differ in
        DISPERSION (gamma 0.74-0.81 versus exactly 1), not in location. Any location-based detector
        is therefore the wrong shape, and a support cap is the most extreme location-based detector
        there is.
      optional_strengthening_proposed_not_required:
        id: D6
        observable: 'the lag-resolved coordinate autocorrelation A(l) = P[e-tilde_i = e-tilde_{i+l} = 1],
                     l = 1..L_max, which by ring-shift invariance is a genuine function of l alone'
        value_on_M: 'exactly p^2 for every l != 0 (forced)'
        value_on_T: 'MEASURED, not forced'
        relation_to_D1: >-
          D1 is the aggregate of exactly this: Var(w) = N p (1-p) + N * sum_{l != 0} (A(l) - p^2)
          to leading order, and gammahat = 0.74-0.81 says the aggregate is decidedly negative. D6
          resolves that aggregate by lag. It buys diagnostic detail, NOT extra separation -- D1
          already separates at 79-135 SE. Proposed as OPTIONAL and cheap; the Coordinator should
          feel free to decline it.
      no_hard_probability_one_discriminator_exists_here: >-
        SAID PLAINLY BECAUSE IT IS A LEGITIMATE ANSWER. There is no cheap deterministic property of
        e-tilde that holds always on (T) and fails with probability ~1 on (M). The support cap is
        the only easy deterministic (T) invariant and it is far too slack. A sharp one would have to
        test membership in the sumset {sum of omega shifts of r_2} + {sum of omega_r shifts of y} +
        {weight-omega_e vectors}, which is a hard combinatorial problem, not a detector. The
        discriminating power in this contract is therefore carried by a SOFT statistic (D1) with a
        measured positive control and a 79-135 SE separation, and that is stated rather than
        dressed up as a hard invariant. This is the correction v1's why_this_matters needs.

