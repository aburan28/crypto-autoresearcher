    the_SE_diagnosis_is_corrected:
      what_the_red_team_reported: >-
        OBJ-3: 'V(n_e, q, k) as frozen in the contract understates the estimator's null variance at
        this cell by (0.0744/0.0321)^2 = 5.4x' -- i.e. the FORMULA is wrong.
      what_was_measured_here: >-
        THE FORMULA IS FINE; THE TABULATED NUMBERS USED THE WRONG q. Measured null SD against
        SE = sqrt(V/T)/ln2 evaluated at the MEASURED q-hat, 20,000 replicates per cell:
        PS-R1 k=16 T=1e8 measured 0.06457 vs formula 0.06616 (ratio 0.976);
        PS-R3 k=17 T=2e7 measured 0.01427 vs formula 0.01442 (ratio 0.990);
        PS-R5 k=30 T=2e7 measured 0.06036 vs formula 0.06461 (ratio 0.934);
        PS-A  k=3  T=1e8 measured 0.19822 vs formula 0.19556 (ratio 1.014).
        The formula's functional form is validated to within 1-7%. What is wrong is the contract's
        tabulated SE_at_allocated_T, computed at q_for_sizing: PS-R1 k=16 tabulated 0.0321 against
        0.0646 measured (2.01x understated); PS-R3 k=17 0.008 against 0.0143 (1.78x); PS-R5 k=30
        0.0259 against 0.0604 (2.33x); PS-A k=3 0.108 against 0.1982 (1.84x).
      why_the_distinction_matters: >-
        OBJ-3's diagnosis says replace the variance formula. This one says recompute the same
        formula at the measured q-hat. The magnitude of the T_prec correction is similar (3.2x-5.4x,
        since T_prec is proportional to V) but the repair is different, and repairing the wrong
        thing would leave the real defect in place. The red team's own SD estimate (0.0744, R = 20,
        stated as +-16% relative) is consistent with the 0.06457 measured here at 20,000 replicates,
        which supersedes it.
      residual_caveat: >-
        A symmetric SE is the wrong object at these cells regardless of which q it is computed at,
        because the null distribution is skewed. The binding width is the calibrated interval in R1,
        not any multiple of an SE.
    success_criterion_iv:
      v1_text: >-
        '(iv) log2 Ahat_m is reported with a jackknife 3-sigma interval at PS-R1, PS-R3 and PS-R5,
        and log2 Ahat_2 and log2 Ahat_3 at PS-A'
