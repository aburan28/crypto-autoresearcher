          - {k: 11, c_lo: -0.01101, c_hi: +0.01142, measured_size: 0.00278}
          - {k: 14, c_lo: -0.05221, c_hi: +0.07215, measured_size: 0.00290}
          - {k: 16, c_lo: -0.14800, c_hi: +0.34749, measured_size: 0.00277,
             note: 'k = m, but T_stab(16) = 1.452e8 > 1e8; see R4'}
          - {k: 18, c_lo: -0.39367, c_hi: +1.29304, measured_size: 0.00274}
        PS-R3:
          T: 2.0e7
          q_hat: 0.31994628619715665
          cells:
          - {k: 2,  c_lo: -0.00005, c_hi: +0.00005, measured_size: 0.00262}
