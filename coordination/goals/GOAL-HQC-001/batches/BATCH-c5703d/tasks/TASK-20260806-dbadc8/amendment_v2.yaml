             note: 'k = m, but T_stab(30) = 2.554e7 > 2e7; see R4'}
          - {k: 35, c_lo: -0.40218, c_hi: +1.39632, measured_size: 0.00265}
      q_hat_plug_in_sensitivity: >-
        The frozen interval depends on the data only through q-hat. Recomputing it at q-hat times
        (1 +- 3 SE) moves the bounds by at most about 2% of the interval width at every k = m cell
        tested (PS-R1 k=16: c_hi 0.34749 -> 0.35524 / 0.34454; PS-R3 k=17: 0.05061 -> 0.05031 /
        0.04996; PS-R5 k=30: 0.34907 -> 0.34696 / 0.34352). The plug-in is not a material source of
        error. SE(q-hat) is bounded here by the independent-blocks value; the measured Var(S) would
        be sharper but is a (T) second moment and determines log2 A_2, so this task did not compute
        it.
      INV_NULL_clause_d_retained_with_an_error_bar:
        v1_text: 'the CTRL-BS excess exceeds 25 percent of the (T) excess at that k'
        problem: >-
          A ratio of two noisy quantities against a fixed threshold with no stated uncertainty,
          evaluated on the arm with the LARGEST realization spread. The red team's objection stands.
        v2_text: >-
          Clause (d) fires when the CTRL-BS point estimate exceeds 25% of the (T) point estimate AND
          the CTRL-BS estimate lies outside its own frozen [c_lo, c_hi]. Both conditions are
