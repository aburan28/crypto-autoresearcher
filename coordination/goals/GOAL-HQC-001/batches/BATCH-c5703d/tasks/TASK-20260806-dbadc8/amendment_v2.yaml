        At the measured q-hat, PS-R1 needs T = 1.452e8 against 1e8 allocated and PS-R5 needs 2.554e7
        against 2e7. Two of the three named sets cannot deliver k = m at their allocations. The
        clause is unsatisfiable by arithmetic, not by outcome.
      v2_text: >-
        '(iv) log2 Ahat_m is reported with its FROZEN CALIBRATED INTERVAL at PS-R3 (m = 17), and
        log2 Ahat_2 and log2 Ahat_3 at PS-A. At PS-R1 and PS-R5 the reachable k_max at the funded
        allocation is reported and k = m is reported as NOT REACHED under ST-4 unless the
        Coordinator funds T >= T_stab(m) at the measured q-hat, in which case k = m is reported for
        that set too. NOT REACHED is a budget outcome and is never a null result (AGENTS.md rule 5).'
      why_PS_R3_is_the_right_anchor: >-
        It is the only order-matched set retaining margin at k = m under the measured q-hat (20x),
        AND it is the most powerful cell by a wide margin: against the declared common-mode
        alternative at eps = 0.05 the calibrated rule's 80%-power effect size at k = m is about
