    is_a_wald_ratio_the_right_shape: >-
      NO, AND THE REASON IS MEASURED. Two independent defects, either of which alone would sink it.
      (1) COUPLING. The measured correlation between |log2 Ahat_k - mean| and its own SE_jack rises
      from +0.006 at PS-R1 k=6 to +0.297 at k=11, +0.585 at k=14 and +0.610 at k=16; +0.501 /
      +0.643 / +0.616 at PS-R3 k=17/22/25; +0.694 at PS-R5 k=30. A Wald ratio assumes the
      denominator carries no information about the numerator. Here they are driven by the same
      handful of large-S trials. The coupling PERSISTS at the Stage-B allocation (+0.608 at PS-R1
      k=16, T=1e8; +0.618 at PS-R5 k=30, T=2e7). (2) SHAPE. The null distribution of log2 Ahat_k is
      strongly right-skewed at high k, so ANY symmetric rule is mis-shaped regardless of scale. At
      the contracted allocation the calibrated interval's right arm exceeds its left arm by a factor
      2.35 (PS-R1 k=16), 2.66 (PS-R5 k=30) and 1.26 (PS-R3 k=17) -- and at PS-A k=3 the asymmetry
      runs the OTHER way (0.75). The shape is cell-specific and is not predictable a priori, which
      is precisely the argument for measuring it rather than assuming it. Note also what is NOT
      broken: at k <= 10 the Wald rule is well sized (0.0018-0.0034) and the calibrated interval is
      near-symmetric at z = +-3.0. The defect is confined to high k, which is exactly where k = m
      sits at PS-R1 and PS-R5.
    replacement_rule:
      id: INV-NULL
      version: 2
      supersedes: INV-NULL v1 clauses (a), (b), (c)
      statement: >-
        At a given (set, arm, k), INV-NULL fires when log2 Ahat_k lies outside the frozen interval
        [c_lo, c_hi]. [c_lo, c_hi] are the equal-tailed 0.135% and 99.865% quantiles of the
        estimator's OWN sampling distribution under the arm's null law, obtained by Monte Carlo. No
        jackknife. No Wald ratio. No division by a random quantity.
      null_law_used_for_calibration: >-
        S ~ Binomial(n_e, q-hat). THIS IS NOT A MODELLING APPROXIMATION. On the finite support
        {0..n_e} the factorial moments E[C(S,k)], k = 0..n_e, determine the pmf by a triangular
        linear system, so "A_k = 1 for every k" pins every factorial moment to the binomial value
        and therefore pins the law itself. Verified numerically by inverting that system at
        (n_e,q) = (10,0.3), (12,0.07), (8,0.55): max |pmf reconstructed - Bin| = 7.5e-15.
        A17's full content and the binomial null are the same object. CAVEAT, STATED: the contract
        measures k <= k_max < n_e, so a rule calibrated this way tests a SUB-FAMILY of A17. The
        reference law is exact; the coverage is partial.
      why_this_is_still_preregistration: >-
        The calibration consumes only (n_e, q-hat, T, batching). q-hat is a Stage-A diagnostic
        already committed in RUN-HQC-982268-STAGEA-a, and T is fixed before Stage B by ST-7. So
        [c_lo, c_hi] can be, and below IS, frozen in this record BEFORE any Stage-B (T) datum
        exists. The interval is never re-derived after data arrive. If achieved T differs from
        planned T (ST-1 truncation), the SAME frozen procedure and the SAME calibration seed are
        re-run at the achieved T and the re-derivation is recorded as a protocol deviation.
      calibration_procedure_binding_at_run_time:
        n_calibration_replicates_minimum: 1000000
        n_validation_replicates_minimum: 1000000
        validation_requirement: >-
          The realized size MUST be measured OUT OF SAMPLE on an independent draw set and recorded
          per (set, arm, k) in null_arms.json. A cell whose measured size lies outside
          [0.002, 0.004] is reported as CALIBRATION FAILED and its (T) result at that k is
          NOT REPORTED. This is the check that the rule is what it claims to be, and it is the
          check version 1 lacked.
        undefined_replicates: >-
          Replicates on which the estimator is undefined (mubar-hat_k = 0) are COUNTED AND REPORTED.
          A cell with more than 10% undefined null replicates is declared NOT REACHED at that T
          (a budget outcome under AGENTS.md rule 5), never a null result.
        seed: 'SHA-256("EXP-HQC-982268/v2/INV-NULL" || set_id || arm_id || k), counter-mode PRNG;
               recorded verbatim in the manifest'
      measured_size_of_v2:
        method: 'critical values from 1,000,000 calibration draws; size measured on 1,000,000
                 INDEPENDENT validation draws'
        result: >-
          0.252% to 0.290% at EVERY evaluable cell tested, against the 0.270% nominal, with 95%
          confidence intervals of width about +-0.010 percentage points. Compare version 1's
          0.18% to 23.55%. Full per-cell table in calibration_results.json,
          phase3_proposed_rule.
        cells_tested: 30
        worst_cell: {set: PS-R1, T: 1.0e8, k: 14, measured_size: 0.00290, ci95: [0.00280, 0.00301]}
      frozen_critical_values_at_the_contract_allocations:
        note: >-
          Computed at the Stage-A-measured (T)-arm q-hat and the contract's own per-stage trials.
          They are FROZEN BY THIS RECORD. They apply to the (T) arm and to every null arm run at
          the same (n_e, q-hat, T).
        PS-A:
          T: 1.0e8
          q_hat: 0.0003344494275569857
          cells:
          - {k: 2, c_lo: -0.04079, c_hi: +0.03979, measured_size: 0.00261}
          - {k: 3, c_lo: -0.69615, c_hi: +0.52016, measured_size: 0.00262}
          - {k: 4, c_lo: +2.27818, c_hi: +4.61667, measured_size: 0.00252,
             status: NOT REACHED, reason: '81.7% of null replicates undefined'}
          - {k: 16, status: NOT REACHED, reason: 'estimator undefined on every null replicate'}
        PS-R1:
          T: 1.0e8
          q_hat: 0.19742737095129637
          cells:
          - {k: 2,  c_lo: -0.00005, c_hi: +0.00005, measured_size: 0.00274}
          - {k: 6,  c_lo: -0.00104, c_hi: +0.00104, measured_size: 0.00283}
