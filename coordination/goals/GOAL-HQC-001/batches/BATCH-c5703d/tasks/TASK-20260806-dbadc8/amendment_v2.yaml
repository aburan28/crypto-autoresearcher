      - {set: PS-A,  k: 3,  T: 1.0e8, interval: '-0.696 / +0.520 bits', v1_advertised: '+-0.32'}
      reporting_requirement: >-
        Every reported log2 Ahat_k carries its ASYMMETRIC calibrated interval, and additionally the
