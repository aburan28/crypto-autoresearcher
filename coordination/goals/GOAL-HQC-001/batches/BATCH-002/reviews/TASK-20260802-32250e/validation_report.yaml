  duty_2_correction_correctness:
    verdict: PASS
    reversal_confirmed: true
    reversal_headline: >-
      THE VALUE 49 IS PRINTED IN THE PUBLISHED SPECIFICATION. Independently
      confirmed by this session from its own byte-identical copy. The BATCH-001
      transcription was FAITHFUL and its classification of X6 as a SOURCE anomaly
      was CORRECT. BATCH-002-OPENING.md section 3's sentence "It is the
      transcription's own error", the BATCH-002 opening commit message, and
      BATCH-001 red-team objection O1's "5 -> 4 misread from a 2.6x page clip"
      hypothesis are all FALSIFIED.
    source_reacquisition:
      url: https://pqc-hqc.org/doc/hqc_specifications_2025_08_22.pdf
      bytes: 876126
      sha256_expected: 174186cb5fdc0108aad914391360c222f52ea533bfb406146fac124b3a25406d
      sha256_measured: 174186cb5fdc0108aad914391360c222f52ea533bfb406146fac124b3a25406d
      byte_identical: true
      fetch_count_now_on_record: 4
      pages: 51
      tool: PyMuPDF (fitz), page.get_text(); independent of the producer's toolchain run
      third_party_pdf_committed: false
    verbatim_line_extracted_independently:
      page_printed: 18
      text: "• RS-S3[90 = 255 −165, 32 = 197 −165, 49]."
      siblings_on_the_same_page:
        - "• RS-S1[46 = 255 −209, 16 = 225 −209, 31] ;"
        - "• RS-S2[56 = 255 −199, 24 = 223 −199, 33] ;"
    route_verification:
      - route: i
        name: the specification's own shortening arithmetic
        confirmed: true
        measured: >-
          SPEC section 3.4.2 (p.17) defines the family it uses by "Number of
          parity-check digits n - k = 2*delta" and "Minimum distance
          d_min = 2*delta + 1" -- so d = (n-k)+1 is the SOURCE'S OWN relation, not
          imported MDS theory. The construction subtracts 165 from BOTH n and k
          (255-165=90 verified, 197-165=32 verified), so n-k = 255-197 = 58 =
          90-32 is invariant, giving d = 59. The spec states the invariance itself:
          "One should note that shortening the Reed-Solomon code does not affect
          its error correcting capacity." This is shortening, not puncturing, and
          the text decides that, not the name.
      - route: ii
        name: Table 3's delta
        confirmed: true
        measured: >-
          Table 3 (p.18) read independently: RS-1 (255,225,15), RS-2 (255,223,16),
          RS-3 (255,197,29), RS-S1 (46,16,15), RS-S2 (56,24,16), RS-S3 (90,32,29).
          delta = 29 => d = 2*29+1 = 59.
      - route: iii
        name: printed generator polynomial degree
        confirmed: true
        measured: >-
          Highest printed exponent of g3(x) is x^58 (p.19 tail: "... + 187x57 +
          x58."), so deg g3 = 58 = 2*delta => delta = 29 => d = 59. Cross-checked
          on siblings: deg g1 = 30 = 46-16, deg g2 = 32 = 56-24. Spec also writes
          g(x) = (x+a)(x+a^2)...(x+a^{2*delta}), degree 2*delta by construction.
    routes_confirmed: 3
    routes_not_confirmed: 0
    validator_added_cross_check:
      what: >-
        Not asked for; recorded because it is the cheapest possible isolation of
        the anomaly. The SAME printed list is SELF-CONSISTENT on its other two
        rows: RS-S1 46-16+1 = 31 = 2*15+1 (printed 31); RS-S2 56-24+1 = 33 =
        2*16+1 (printed 33). Only the RS-S3 bracket disagrees with the document.
        The defect is isolated to one numeral in one bracket.
    stale_value_account:
      claim_tested: RMRS Figure 6's external code is [80, 32, 49] and 49 = 80-32+1
      rmrs_reacquired:
        url: https://arxiv.org/pdf/2005.10741
        bytes: 525223
        sha256_measured: cbb7dbd670f27cdcf602438018df52745c0af495050aedb3b83a0b00986f5446
        byte_identical_to_record: true
        pages: 14
      measured: >-
        CONFIRMED. RMRS Figure 6 (p.14) lists external Reed-Solomon codes
        [80, 32, 49] (HQC-RMRS-128), [76, 32, 45] (192) and [78, 32, 47] (256).
        80 - 32 + 1 = 49 exactly, and 76-32+1 = 45, 78-32+1 = 47 -- all three
        RMRS rows are internally correct. The specification moved n_e to 90 and
        the numeral 49 did not move.
      status_of_the_account: >-
        A NUMERAL COINCIDENCE PLUS A DOCUMENTED LINEAGE (SPEC cites RMRS as [4]),
        NOT AN ESTABLISHED EDIT HISTORY. Both the correction_report (section 2.6)
        and the filed entry KN-LIT-1c9474 label it at exactly that strength and
        explicitly decline to assert causation. I concur with that labelling and
        make no stronger claim.
    propagation_into_the_filed_entries:
      surviving_uncorrected_instances_of_49: 0
      does_the_corpus_silently_rewrite_the_source: NO
      evidence: >-
        KN-LIT-b9e1a8 "Published-text inconsistencies" item 1 QUOTES the printed
        bracket verbatim, including 49 ("section 3.4.2 p.18 prints
        `RS-S3[90 = 255 - 165, 32 = 197 - 165, 49]`"), then records all three
        derivations giving 59, the sibling-row agreement, and the conclusion that
        the value implied for Theorem 6.1 is d_e = 59. KN-LIT-1c9474 records the
        RMRS [80,32,49] row and states 49 is CORRECT there for n = 80. Every
        occurrence of "49" in the three entries (6 total; 0 in KN-LIT-4c1133) is
        either a verbatim quotation of a source or an explicit statement that the
        source prints it. No entry substitutes 59 for the printed value, which is
        what knowledge/SEEDING.md rule 3 forbids, and no entry leaves 49 standing
        unqualified.
      key_claims_bullet_check: >-
        The frontmatter-level bullet ("Those definitions give minimum distances
        31, 33 and 59. See Published-text inconsistencies") states the DERIVED
        values and forwards to the inconsistency section rather than asserting the
        source printed them. Correct construction.
    correction_2_eq_13:
      verdict: PASS, as reported
      measured: >-
        The filed entry's IND-CCA2 bullet cites SPEC section 6.2.3 p.45 undamaged
        prose, not the [EXTRACTION-DAMAGED] Eq. (13). I independently located the
        p.44-45 region: Theorem 6.3, Proposition 6.2.1, Lemma 6.4 and the
