# DUTY 3 -- sensitivity of HQC's published DFR bound to a failure of assumption A17.
#
# WHAT THIS FILE IS: a derivation, shown step by step, of how far SPEC Theorem 6.1
# moves if the n_e inner-decoder failure events are NOT independent, together with
# an explicit verdict on the direction (optimistic / pessimistic / undetermined).
#
# WHAT THIS FILE IS NOT: an experiment design. It contains no protocol, no
# parameter selection, no trial count, no seed strategy, no success criterion, no
# stopping rule and no measurement plan. Where published parameter sets appear
# they are the specification's own three sets, used to EVALUATE a symbolic
# formula; no parameter is selected here for any purpose. See `prohibitions`.
#
# NO SECURITY CLAIM ABOUT HQC IS MADE IN EITHER DIRECTION.

