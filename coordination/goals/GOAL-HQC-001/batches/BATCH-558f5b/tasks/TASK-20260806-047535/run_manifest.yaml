  fail_closed_checks:
  - name: measure.py sha256 integrity
    reads: MEASURE_PY_EXPECTED_SHA256 (module-level constant) vs. sha256_file(MEASURE_PY)
    aborts_on_mismatch: true
    verified_by: deliberate-mismatch dry run, see commands.fail_closed_check_verification
    fired_in_authorized_run: false
  - name: stage_a.py sha256 integrity
    reads: STAGE_A_PY_EXPECTED_SHA256 (module-level constant) vs. sha256_file(STAGE_A_PY)
    aborts_on_mismatch: true
    fired_in_authorized_run: false
  - name: N_JACK_BATCHES cross-check
    reads: measure.N_JACK_BATCHES (imported module attribute) vs. this task's own N_JACK_BATCHES constant
    aborts_on_mismatch: true
    fired_in_authorized_run: false
  - name: L = N/n_e parameter sanity (RULE-2)
    reads: computed L vs. the declared N_2 constant
    aborts_on_mismatch: true
    fired_in_authorized_run: false
  - name: real-decoder template verification (design.md Section 3.4)
    reads: S_TEMPLATE / FAIL_TEMPLATE true decode (via BOTH decode_blocks and
      brute_force_decode) vs. each template's intended label
    aborts_on_mismatch: true
    fired_in_authorized_run: false
    result: PASS -- both templates, both decoders, agree with the intended
      label and with each other (planted_results.json template_verification)
  - name: planted-law reproduction check
    reads: run-time-recomputed log2_A_k(k) table vs. design.md's frozen
      DESIGN_TABLE_LOG2_A constant, 1e-12 tolerance
    aborts_on_mismatch: true
    fired_in_authorized_run: false
  - name: block-partition/real-decode self-check (F == block_fail)
    reads: per-batch equality between the REAL decode_blocks output and the
      planted block_fail pattern
    aborts_on_mismatch: true
    batches_checked_in_authorized_run: 200
    fired: false

  deviations:
  - id: design_md_placeholder_bit_strings_self_caught
    kind: implementation_error, self-caught, fixed BEFORE the authorized run
    detail: >-
      design.md's first draft (Section 3.3) contained a fabricated,
      incorrectly-reformatted placeholder rendering of the two template bit
      sequences (a manual line-wrap of the true 128-bit strings that did
      not actually match the S_TEMPLATE/FAIL_TEMPLATE arrays produced by
      the search). This was caught by inspection before planted_arm_v2.py
      was written or run, and design.md was corrected to the exact,
      verified 128-bit flat sequences (matching the module constants
      byte-for-byte, confirmed via sha256 in
      planted_results.json.template_verification.*_TEMPLATE_sha256).
      No incorrect template content was ever used in any computation;
      only the prose rendering in design.md's first draft was wrong, and
      it was corrected before predating any run. Recorded here rather than
      silently discarded, per AGENTS.md "record, never discard."
  - id: none_other
    kind: n/a
    detail: >-
      No other implementation errors, infrastructure failures, or protocol
      deviations occurred during this task. The authorized run completed
      on its first and only invocation with no truncation, no budget
      overrun, and no fail-closed check firing.

  validity:
    status: valid_measurement
    reason: >-
      All fail-closed gates passed (measure.py/stage_a.py integrity,
      template verification against two independent decoders, planted-law
      reproduction, block-partition/real-decode self-check on all 200
      batches), T achieved (1,000,000) equals T planned, and the run
      stayed within its core-second (434.3/1800) and wall-clock
      (434.3/3600) and memory (559.7 MB/2048 MB) budgets.
    scoped_to: >-
      ONE V2 planted-correlation control arm, order-matched to PS-R3's
      n_e=56/n_2=128/dup=1/m=17, k=2..18, real decode_blocks, T=1,000,000
      (budget-reduced 10x from PS-R3/V1's T=1e7 -- see design.md Section 5
      and comparison_report.md Section 6), one seed family, no replication.
      Claim tier: toy. Reuses measure.py's estimator and jackknife code
      unmodified (sha256-verified) and stage_a.py's decode_blocks
      unmodified (sha256-verified). Does not exercise stage_a.py's
      cryptographic (T)-sampler (CTRStream, fixed_weight_support, ring
      arithmetic) at all; see design.md Section 6.2 for the full list of
      residuals this leaves in OPEN-6.
    result_summary: >-
      17 / 17 reported cells (k=2..18) recovered log2_Ahat_k within the
      adopted 3-jackknife-SE band of the closed-form planted value
      (comparison_report.md Section 7). Both near-boundary templates'
      TRUE decode (verified via decode_blocks AND the independent
      brute_force_decode/rm17_codewords) matched their intended label at
      every check, before AND during the authorized run; NO disagreement
      was observed. Both templates demonstrated a genuine, non-zero chance
      of flipping under the campaign's V1/V3 "read one index early"
      boundary-shift perturbation, in both same-label and different-label
      neighbor scenarios (comparison_report.md Section 4) -- a property
      the Red Team proved was analytically impossible under the V1 arm's
      homogeneous-block construction.

