  - check: sample_integrity
    status: PARTIAL
    detail: >-
      Sample size (T=1,000,000), seeds (SEED_PREFIX and per-batch
      derivation), and sampling procedure are all in run_manifest.yaml
      and design.md. However, as noted under
      independent_recomputation.cell_recomputation_from_archived_output,
      the raw per-batch histogram is not archived, so the empirical
