  heuristic_validation_checks:
  - check: pre_registered_prediction
    status: PASS
    detail: >-
      The planted marginal law (log2_A_k(k)) and the template/margin
      construction were both pre-registered in design.md before
      planted_arm_v2.py was run on any data, per the mtime evidence and
      the run-time reproduction-check gates (both independently
