  independent_recomputation:
  - id: planted_law_rederivation
    description: >-
      Re-derived log2_A_k(k) for k=2..18 from the stated construction in
      design.md Section 2 (M_t ~ Uniform{17,18,19}, mu_bar_k =
      (1/3)(C(17,k)+C(18,k)+C(19,k))/C(56,k), q=9/28,
      log2_A_k=log2(mu_bar_k)-k*log2(q)) using fresh Python code
      (fractions.Fraction + math.comb), written and run BEFORE opening
      planted_results.json or comparison_report.md.
    method: >-
      python3 fractions-based recomputation, independent of
      planted_arm_v2.py's planted_law() function (same formula, separately
      typed).
    result: >-
      All 17 values matched design.md's frozen table and
      planted_arm_v2.py's DESIGN_TABLE_LOG2_A constant to the full
      precision printed (agreement to >=1e-15 relative, i.e. bit-for-bit
      at printed precision). q=9/28=0.32142857142857145 confirmed.
    verdict: MATCH
  - id: template_decode_independent_verification
    description: >-
      Independently transcribed S_TEMPLATE and FAIL_TEMPLATE from BOTH
      design.md's flat 128-bit string rendering (Section 3.3) and
      planted_arm_v2.py's module-constant array, asserted the two
      transcriptions are bit-identical, then imported stage_a.py myself
      (sha256-pinned, same hash as above) and called decode_blocks and
      brute_force_decode directly, without reading the executor's
      verification code path.
    result: >-
      decode_blocks: S_TEMPLATE -> F=False, W=49, ties=False (intended
      succeed, MATCHES). FAIL_TEMPLATE -> F=True, W=50, ties=False
      (intended fail, MATCHES). brute_force_decode (independent
      exhaustive 256-codeword search): S_TEMPLATE -> F=False,
      FAIL_TEMPLATE -> F=True (both agree with decode_blocks and with
      intended labels). WHT margin recomputed independently:
      S_TEMPLATE top1=30/top2=26/margin=4; FAIL_TEMPLATE
      top1=32/top2=28/margin=4. All values match
      planted_results.json.template_verification exactly.
    verdict: MATCH -- both templates genuinely decode to their claimed
      label under two independent decoders, not merely asserted by the
      executor.
  - id: boundary_index_shift_perturbation_independent_check
    description: >-
      Implemented shift_read_one_early and shift_read_one_late myself
      (a second, independent implementation using np.roll, cross-checked
      against a hand-rolled index-copy implementation matching the
      executor's shift_read_one_early -- the two implementations agreed
      bit-for-bit before use), and ran all 8 scenarios (2 templates x
      2 directions x 2 neighbor types) against the real decode_blocks.
    result: >-
      read-one-early: S_TEMPLATE flips False->True under BOTH same-label
      and diff-label neighbor; FAIL_TEMPLATE flips True->False under
      BOTH. read-one-late: S_TEMPLATE does NOT flip under either neighbor
      type; FAIL_TEMPLATE DOES flip under both. This reproduces the
      executor's full 8-row table in comparison_report.md Section 4
      exactly, including the asymmetric (not-flip) cases -- i.e. the
      executor did not selectively report only the flipping cases.
    verdict: >-
      CONFIRMED INDEPENDENTLY: at least one boundary-index-shift
      perturbation (read-one-early, both neighbor types) gives BOTH
      templates a genuine, non-zero, deterministic chance of flipping F,
      unlike the V1 arm which the Red Team proved has probability
      exactly 0 for any T. This is a real, verified improvement over V1,
      not merely an executor claim taken on trust.
  - id: cell_recomputation_from_archived_output
    description: >-
      Recomputed, from the numbers archived in planted_results.json
      itself (recovered_log2_Ahat_k, jackknife_se, planted_log2_A_k), the
      interval bounds [point-3*se, point+3*se], the MATCH/MISMATCH
      verdict, distance_planted_minus_recovered, and
      distance_in_jackknife_se for all 17 cells, and compared against the
      executor's stored values.
    result: >-
      All 17 cells' interval bounds, MATCH verdicts, and derived distance
      statistics recomputed to exact agreement (<1e-12 absolute) with the
      archived values. Spot-checked k=17 (the PS-R3-prespecified cell)
      and k=18 (highest-k, most SE-sensitive) by hand in addition to the
      full-table script pass.
    caveat: >-
      IMPORTANT LIMITATION, DISCLOSED HONESTLY HERE: planted_results.json
      does NOT archive the raw per-batch histogram (bh, the (200, 57)
      count array) or any per-trial S_t data -- only derived summary
      statistics (point estimate, jackknife SE, planted value) per k.
      This means a full independent recomputation of log2_Ahat_k "from
      raw sample counts" (i.e., re-running measure.log2_A_from_hists
      against an archived histogram) is NOT possible from the committed
      artifact alone; what I recomputed is the correctness of the
      comparison-rule arithmetic applied to the archived summary
      statistics, not a re-derivation of those summary statistics from
      raw counts. This is consistent with V1's precedent
      (TASK-20260806-e19f6c's planted_results.json has the identical gap
      -- verified by inspection) and is therefore not a new defect
      introduced by this arm, but it is a standing reproducibility gap in
      this campaign's artifact convention and should be named as such
      going forward: a future arm should archive the raw per-batch
      histogram so a reviewer can re-run log2_A_from_hists independently
      rather than only re-checking the stated comparison-rule arithmetic.
    verdict: MATCH (of the archived summary numbers' internal arithmetic);
      NOT INDEPENDENTLY RE-DERIVABLE FROM RAW COUNTS given what is
      archived.

  code_diff_check:
    id: estimator_reuse_diff_against_measure_py
    target: coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-cde749/measure.py
    findings:
    - >-
      comb_matrix(n_e, ks) and log2_A_from_hists(H, n_e, ks, C) are called
      directly through the sha256-pinned import (measure.comb_matrix(...),
      measure.log2_A_from_hists(...)), i.e. literally the same function
      object at run time, not a copy. No divergence possible by
      construction.
    - >-
      N_JACK_BATCHES=200 cross-checked at run time
      (measure.N_JACK_BATCHES != N_JACK_BATCHES aborts); confirmed equal.
    - >-
      point/loo/jmean/jse jackknife block (measure.py lines 730-739) is
      copied verbatim into planted_arm_v2.py's main() with identical
      formula and variable names (point, loo, jmean, jse) -- confirmed by
      direct text comparison. No divergence in the jackknife formula
      itself.
    - >-
      STRUCTURAL DIFFERENCE (not a code bug, but worth recording as a
      diff): measure.py builds its 200 per-batch histograms (bh, lines
      730-733) by POST-HOC SLICING a flat T_ach-length S_all array at
      linspace(0, T_ach, 201)-derived boundaries (batch widths can differ
      by +/-1 trial when T_ach doesn't divide evenly by 200).
      planted_arm_v2.py instead builds each batch's histogram DURING
      generation, one decode_blocks call per batch of exactly
      sub_chunk=5000 trials (T_planned=1e6 divides 200 evenly, so this is
      moot here: every batch is exactly 5000 trials in both schemes).
      This is the same divergence V1 already had from measure.py and
      disclosed as such; it does not change the jackknife formula applied
      to the resulting histograms, and with T=1e6 evenly divisible by 200
      the two batch-construction schemes produce statistically equivalent
      (here, actually identical-shape) batch partitions. Not a defect.
    - No other divergence found in the reused portions.
    verdict: NO MATERIAL DIVERGENCE from measure.py's estimator/jackknife
      logic; the one structural difference (batch construction) is
      inherited from V1's precedent, disclosed, and immaterial at this
      T/N_JACK_BATCHES combination.

