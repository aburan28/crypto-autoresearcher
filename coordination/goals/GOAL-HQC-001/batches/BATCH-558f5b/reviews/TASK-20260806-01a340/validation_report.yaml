      derived summary statistics' internal arithmetic can be checked.
      This caps this check at PARTIAL rather than PASS.
  - check: correspondence_validity
    status: N/A
    detail: >-
      No Deuring-style substitute-sampling correspondence is used here;
      this is a planted-instance instrument check against a real decoder,
      not a distributional correspondence argument.
  - check: scale_binding
    status: PASS (toy, disclosed as such)
    detail: >-
      n_e=56, n_2=128, dup=1, m=17 match PS-R3's parameters exactly
      (cross-checked against experiments/EXP-HQC-982268/specification.yaml
      PS-R3 block, n_e=56/n_2=128/m=17, confirmed present). T is
      order-matched in structure but reduced 10x from PS-R3/V1's T=1e7 to
      T=1e6, honestly disclosed as budget-driven, with the expected SE
      inflation pre-registered and checked post-hoc (comparison_report.md
      Section 6). Claim tier stays toy throughout, per every artifact
      touched (design.md, planted_arm_v2.py header, run_manifest.yaml,
      comparison_report.md all state "toy" and disclaim any A17/DFR/
      standardized-parameter-set conclusion).
  - check: cost_unit_honesty / cost_bookkeeping
    status: N/A
    detail: >-
      This task does not present a concrete asymptotic cost table; it is
      an instrument-validation control arm, not a cost-model claim.

  t_reduction_honesty_assessment:
    claim: T reduced 10x (1e7 planned/PS-R3-matched -> 1e6 actually run),
      due to the real decoder being ~54x slower than V1's hand-rolled
      reduce (1198 vs ~64,700 trials/core-second).
    is_this_meaningfully_weaker_evidence: >-
      YES, and the report says so plainly rather than obscuring it.
      Jackknife SEs at T=1e6 are documented (design.md Section 5, before
      the run) to be expected ~sqrt(10)=3.16x wider than a T=1e7 run of
      the identical real-decoder construction would show. The actual
      k=18 SE observed (9.598e-04) versus V1's own k=18 SE at T=1e7
      (3.188e-04, independently spot-checked against V1's
      comparison_report.md Section 7 and confirmed present at that exact
      value) gives an observed ratio of 3.01x -- close to, and honestly
      compared against, the 3.16x prediction, with the report itself
      noting the two arms are not directly comparable (different
      constructions) and calling this "a rough consistency check ... not
      a formal test," which is accurate, not overclaiming.
    does_the_MATCH_result_still_mean_much_at_T=1e6: >-
      A MATCH at T=1e6 with correspondingly widened intervals is weaker
      evidence of estimator/generator correctness than the same MATCH
      would be at T=1e7 -- the widened band admits a wider range of
      "wrong" generators as indistinguishable from correct ones at the
      3-SE threshold. This arm's MATCH result should be read as
      confirming the pipeline round-trips correctly (as V1's did, at
      higher precision) -- not as adding meaningfully more statistical
      power toward detecting subtle sampler defects than V1's own MATCH
      already provided at 17/17. The report does not claim otherwise.
    honesty_verdict: HONEST -- the residual is pre-registered, the
      observed ratio is reported and compared (not cherry-picked or
      hidden), and no claim of T=1e7-equivalent precision is made
      anywhere in the artifacts.

  what_this_arm_established_vs_did_not:
    established:
    - >-
      The real, sha256-pinned, unmodified stage_a.py decode_blocks
      (WHT/Reed-Muller-fold argmax decoder), including its own internal
      bits.reshape(B, n_e, n_2) block-partition step, was genuinely
      exercised -- independently confirmed by direct import and call in
      this validation.
    - >-
      Two heterogeneous, near-decision-boundary (margin=4 of a possible
      128) 128-bit templates were constructed, and BOTH independently
      verified to decode to their intended label under two independent
      decoders (decode_blocks and an exhaustive brute_force_decode over
      all 256 duplicated RM(1,7) codewords).
    - >-
      At least one boundary-index-shift perturbation (read-one-index-
      early, the literal shape of the campaign's V1/V3 defect classes)
      gives BOTH templates a genuine, deterministic, non-zero chance of
      flipping F, under both same-label and different-label neighbor
      conditions -- independently reproduced here, not merely asserted.
      This is a real, demonstrated structural improvement over V1, whose
      homogeneous-block construction was proven to have probability
      EXACTLY ZERO of expressing this defect class at any T.
    - >-
      17/17 cells recovered log2_Ahat_k within the pre-registered
      3-jackknife-SE band of the closed-form planted value, at the
      honestly-reduced T=1e6, with the SE-widening residual pre-
      registered and post-hoc checked.
    NOT_established_by_this_arm:
    - >-
      A measured DETECTION RATE of an actually-injected V1/V3 defect at
      the level of the full 1,000,000-trial S_t histogram and the
      resulting log2_Ahat_k statistic. What was verified (here and by
      the executor) is a per-template, per-scenario, isolated single-
      block-decode fact -- not a run of the full generator WITH the
      defect injected, compared against the defect-free run, at the
      estimator level. Design.md Section 3.6 states this explicitly and
      correctly reserves that experiment for the Red Team task
      (TASK-20260806-ae74c4), which had not yet produced a report at the
      time of this validation.
    - >-
      Generality beyond the two fixed templates. Every "succeed" block in
      every trial and every position is bit-identical to S_TEMPLATE;
      every "fail" block is bit-identical to FAIL_TEMPLATE. This is
      explicitly disclosed (design.md Section 6.2 item 3) as a residual --
      it is not a test of content-dependent defects, nor does it
      establish that EVERY possible neighbor-pair/position/M_t
      combination would flip F under injection -- only that these two
      specific templates, at this specific margin (4), under this
      specific perturbation, do.
    - >-
      The cryptographic (T)-sampler itself (CTRStream, fixed_weight_support,
      ring_mul_sparse/dense) remains entirely unexercised, as honestly and
      repeatedly disclosed in every artifact.

  limitations:
  - Raw per-batch histogram (bh) is not archived in planted_results.json;
    only derived point/SE summary statistics per k are. Full
    independent recomputation of log2_Ahat_k from raw sample counts was
    therefore not possible from the committed artifact; only the
    comparison-rule arithmetic applied to the archived summary
    statistics could be independently re-verified. This gap is inherited
    from V1's identical precedent (confirmed present in V1's
    planted_results.json too) and is not unique to this arm, but should
    be fixed in future arms for full auditability.
  - This validation did not independently re-run the full T=1,000,000
    generation (434 core-seconds measured by the executor; re-running it
    was possible within this task's 1800s budget but was judged lower
    value than the targeted independent checks performed, given that
    (a) the jackknife/estimator code is a verbatim, sha256-pinned reuse
    of measure.py, whose correctness was already independently verified
    by the Validator on V1 per EV-HQC-db1fd9, and (b) the block-
    partition self-check inside the run is logically load-bearing
    (fail-closed) and covers exactly the content independently verified
    at the template level above). This is recorded as a scope decision,
    not a missing check that changes the verdict.
  - The detection-RATE question (does an actually-injected V1/V3 defect,
    run through this arm's full generator, change log2_Ahat_k
    detectably?) is out of this task's scope by the dispatch queue's own
    division of labor and is the explicit subject of the parallel
    Red-Team task TASK-20260806-ae74c4, whose report was not yet
    available at the time of this validation. This validator's ADMIT
    verdict below covers the RECEIPT's integrity, not that unresolved
    question.
  - Claim tier stays toy; nothing in this validation authorizes any
    statement about A17, HQC's decoding-failure rate, or any
    standardized HQC parameter set.

  verdict: passed

  admit_do_not_admit: ADMIT
  admit_rationale: >-
    Every independently-checkable claim in this run package was checked
    against the primary artifact or a from-scratch independent
    recomputation, not merely re-read from the executor's summary, and
    every one of them held: (1) the planted log2_A_k(k) table
    independently re-derives bit-for-bit before this validator ever
    opened planted_results.json; (2) stage_a.py's decode_blocks is
    genuinely imported unmodified (sha256-pinned, independently
    recomputed hash matches) and both templates genuinely decode to
    their claimed label under two independent decoders, verified here by
    direct import and call, not by trusting the executor's report; (3)
    at least one boundary-index-shift perturbation genuinely flips both
    templates' decoded outcome, independently reproduced with a second,
    separately-written implementation of the shift operator; (4) all 17
    reported cells' MATCH verdicts and interval arithmetic recompute
    correctly from the archived summary statistics (with the archival
    gap on raw histograms honestly flagged as a limitation, not a
    defect); (5) the reused estimator/jackknife code is called through
    the sha256-pinned import (not copyable-and-divergeable for
    comb_matrix/log2_A_from_hists) and the one copied block matches
    measure.py's formula verbatim, with only an immaterial,
    already-precedented batch-construction difference; (6) design.md and
    the template verification genuinely predate planted_results.json, by
    both file-mtime evidence and run-time reproduction-check gates; (7)
    the T-reduction to 1e6 is disclosed honestly with a pre-registered
    SE-widening prediction that is checked, not hidden, against the
    actual observed ratio; (8) the fail-closed integrity gate is
    demonstrated, not merely asserted, via a deliberate-mismatch dry
    run; (9) execution-count discipline is clean and consistent across
    run_manifest.yaml and comparison_report.md, unlike V1's discrepancy.
    No fabrication, no silently-repaired defect, and no claim beyond
    toy tier was found anywhere in the package.

  open6_disposition: PARTIALLY CLOSES OPEN-6
  open6_disposition_rationale: >-
    This arm retires BOTH of the two specific, named structural gaps the
    Red Team found in V1 (EV-HQC-db1fd9): it genuinely runs the real
    decode_blocks (not a hand-rolled majority threshold), and it
    genuinely demonstrates -- independently reconfirmed here, not merely
    executor-asserted -- that a boundary-index-shift perturbation of the
    exact V1/V3 shape has a real, non-zero, deterministic chance of
    flipping the decoded outcome for real, non-homogeneous, near-boundary
    block content. That is a genuine and verified improvement: V1 was
    proven to have probability exactly 0 of ever catching this defect
    class, at any T; this arm is proven, at the single-block level, to
    have probability > 0.

    It does NOT close OPEN-6, for reasons the executor itself disclosed
    plainly and this validator independently confirms are load-bearing,
    not merely formal caveats:

    (a) A non-zero single-block flip probability is necessary but not
    sufficient for OPEN-6. OPEN-6 asks whether PS-R3's anti-correlation
    signal could be produced by a subtly wrong sampler rather than a real
    effect. Answering that requires knowing whether an ACTUAL injected
    defect, run through the FULL generator across many trials, would
    move the log2_Ahat_k STATISTIC by a detectable amount -- not whether
    an isolated hand-picked block, perturbed once, changes its own
    decode. A defect could flip individual blocks with the demonstrated
    non-zero probability here and STILL leave the aggregate S_t
    histogram, and hence log2_Ahat_k, statistically indistinguishable
    from the no-defect case if the flip rate is too low or too
    symmetric across the M_t mixture to bias the estimator detectably at
    T=1e6 (or even T=1e7). That measurement is the explicit job of the
    parallel Red-Team task (TASK-20260806-ae74c4) and was not available
    to this validator; until it exists and shows a genuine detection
    rate at the estimator level, "the block CAN flip" has not been
    upgraded to "the arm WOULD catch a real defect."

    (b) The two-template design is narrower than the space of possible
    boundary/index-shift defect expressions. Every "succeed" block is
    bit-identical across all 56 positions and all 1,000,000 trials
    (likewise for "fail"); the templates were selected for a SPECIFIC
    margin (4, out of a maximum 128) at a SPECIFIC point in the WHT
    landscape. Design.md's own Section 3.6 is explicit that this does
    not establish the flip property for every possible neighbor-pair /
    M_t-draw / position combination, only the two fixed vectors tested
    here, under the specific read-one-early and read-one-late operators
    tested. It is plausible (not established either way by this arm)
    that a different real fixed-weight-support-sampled noise vector, or
    a different boundary-index defect (e.g. a two-index shift, a
    different-magnitude window error, or a defect whose effect depends
    on bit-pattern diversity across positions rather than a boundary
    shift alone) would have a materially different -- possibly much
    smaller, possibly zero -- flip probability against THESE margin-4
    templates than against the true, richer distribution of
    fixed-weight-support-derived blocks. A narrow near-boundary
    construction that happens to catch the specific defect shapes probed
    is not evidence it would catch the general class.

    (c) The cryptographic (T)-sampler (CTRStream, fixed_weight_support,
    ring_mul_sparse/dense) remains completely unexercised, as in V1; the
    question of whether stage_a.py's REAL sampling path (as opposed to
    this arm's directly-constructed planted content) contains the kind
    of subtle index bug OPEN-6 worries about is untouched by either arm.

    Net: this is real, verified progress -- the V1 blind spot named by
    the Red Team is genuinely gone at the single-block level -- but OPEN-6
    itself (can PS-R3's anti-correlation signal be distinguished from a
    subtly wrong sampler?) is not answered by a control that has not yet
    measured a detection rate at the level of the actual estimator
    statistic, nor established that its two fixed templates generalize
    to the space of defects and noise content OPEN-6 must cover. PARTIAL
    closure, contingent on TASK-20260806-ae74c4's outcome to determine
    whether the remaining gap (a) above is also closed.

