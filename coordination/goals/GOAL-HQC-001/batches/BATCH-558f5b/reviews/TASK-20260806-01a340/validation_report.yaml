      dispatch queue).
  - control: template_verification_gate (positive control per label)
    status: VERIFIED (see independent_recomputation.template_decode_independent_verification)
  - control: boundary_index_shift_sensitivity (the actual point of this
      arm, relative to V1)
    status: VERIFIED (see independent_recomputation.boundary_index_shift_perturbation_independent_check)
  - control: block_partition_self_check (F == block_fail, fail-closed)
    status: NOT INDEPENDENTLY RE-RUN (would require re-running the full
      T=1e6 generation, outside this task's budget); ACCEPTED ON DESIGN
