    - item: >-
        DESIGN.MD SECTION 1's REUSE CLAIM IS INACCURATE FOR 4 OF THE 8 NAMED FUNCTIONS. design.md states
        "Reused directly, verbatim, not re-derived: make_defected_decode_blocks, matched_pair_stats,
        arm_hists, cell, load_module, sha256_file, core_seconds, git_state[...]" and the executor's own
        handoff (ledger/handoffs/TASK-20260814-8bbdd2.yaml constraints) instructs "Reuse
        make_defected_decode_blocks, matched_pair_stats, arm_hists, cell, load_module, sha256_file,
        core_seconds, git_state from it directly [...]". Verified by reading matched_pair_repeat.py in
        full and by diffing function bodies: `make_defected_decode_blocks`, `matched_pair_stats`,
        `arm_hists`, `cell` (the four statistically load-bearing functions the handoff's own stated
        rationale cares about -- "so 'the same matched-pair jackknife construction' is reused bit-for-
        bit, not merely re-implemented to the same formulas") ARE genuinely called as `mp_mod.<name>`,
        i.e. real attribute access on the imported matched_pair.py module object. But `sha256_file`,
        `core_seconds`, `git_state`, and `load_module` (renamed `load_module_fail_closed`) are NOT
        imported/called via `mp_mod.*` -- they are LOCALLY RE-DEFINED in matched_pair_repeat.py (lines
        95-137), and every call site in the file's own main() uses the bare (local) name, resolving to
        these local copies, not the ones inside the loaded matched_pair.py module.
      found: >-
        A real discrepancy between design.md's/the handoff's literal reuse claim and the code's actual
        behavior for 4 of 8 named functions, undisclosed as a deviation in run_manifest.yaml's
        protocol_deviations section (which discloses only additional reuse beyond the minimum, not this
        gap).
      severity_assessment: >-
        Diffed the local copies against matched_pair.py's originals byte-for-byte: `sha256_file`,
        `core_seconds`, and `git_state` are IDENTICAL in body to the originals (confirmed by extracting
        and comparing both function bodies with Python's `re`). `load_module_fail_closed` is functionally
        identical to `load_module` (same logic, docstring reworded, renamed). This is very likely
        structurally forced rather than a careless deviation: `load_module`/`sha256_file`/`git_state`
        are needed to load matched_pair.py itself (to obtain `mp_mod` in the first place) and to record
        git state at the very start of main() -- before `mp_mod` exists, there is no module object to
        call `mp_mod.sha256_file` on. This is the same bootstrapping pattern matched_pair.py itself used
        relative to its own predecessor, pilot_injection.py (matched_pair.py's own docstring: "the
        injection wrapper... copied in behaviour from pilot_injection.py's make_defected_decode_blocks").
        None of these four functions participates in the statistical estimator, the disjointness
        comparison, or the F-invariant comparison -- all of which this reviewer independently
        re-derived from raw data and confirmed exact, with zero dependence on any of
        matched_pair_repeat.py's own code. This is therefore assessed as a DOCUMENTATION-ACCURACY
        finding (design.md overstates what was imported vs. what was necessarily re-derived-by-copy),
        not a computation-soundness defect: it does not affect any reported number, and does not create
        the "subtly different formula" risk the handoff's reuse instruction exists to guard against,
        since the functions in question are pure provenance/bookkeeping utilities, verified byte-identical.
      recommendation: >-
        A future superseding record (design.md/run_manifest.yaml for a follow-up task in this family, or
        a Coordinator correction note) should describe these four functions precisely as "re-derived by
        verbatim copy, for bootstrapping reasons" rather than "reused directly... not re-derived", to
        keep this campaign's own stated distinction between "imported" and "re-derived" accurate. Not a
        blocking finding for this report's verdict.
