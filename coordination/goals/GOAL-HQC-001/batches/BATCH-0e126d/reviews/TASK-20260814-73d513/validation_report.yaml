  metric_recomputations:
    - metric: >-
        Disjointness self-check: the discarded [0:5000) prefix of each of the 4 `_t_shard`
        (n_trials=15000) calls must reproduce TASK-20260809-a79e4f's committed per_trial_S arrays
        bit-identically.
      method: >-
        Wrote an entirely independent driver (independent_verify.py; not derived from
        matched_pair_repeat.py's source -- coded from design.md's stated mechanism and stage_a.py's
        own `_t_shard` signature). Independently re-verified the sha256 of stage_a.py and
        matched_pair.py against the expected/measured pins, loaded both fresh via importlib, and for
        each of the 4 (shard, variant) combinations called `sa._t_shard` once with a 300-trial warmup
        then once with n_trials=15000 (mirroring, not calling, `run_arm`'s discipline), sliced
        [0:5000) from the returned per-trial S, and compared elementwise (np.array_equal) AND via an
        independently re-implemented `hist_of` (not `sa.hist_of`) against
        TASK-20260809-a79e4f/matched_pair_results.json's committed stage_1.per_trial_S arrays.
      result: >-
        ALL 4 checks PASS: shard_5000_defected, shard_5000_undefected, shard_6000_defected,
        shard_6000_undefected all elementwise_bit_identical=true, histogram_bit_identical=true,
        length_match=true (5000 vs 5000). Rerun twice (two independent full re-executions of the four
        15,000-trial calls, ~36-37s wall-clock each), identical result both times. D2/D3 (0/0) clean
        on all 4 calls in both of this reviewer's own runs, matching the producer's reported hard
        invariants.
      verdict: >-
        PASS -- the disjointness self-check is genuine and independently reproduced from a
        separately-written driver, not merely trusted from the producer's own code path. This is the
        load-bearing validity gate for the whole task, and it holds.
    - metric: >-
        F[:, 0:n_e-1] structural invariant: on the retained [5000:15000) tail, the defected and
        undefected decode's block-failure array F, restricted to the 55 non-last blocks, must be
        bit-identical elementwise, both shards.
      method: >-
        Same independent driver retained the full F arrays (not just S=F.sum(axis=1)) for all 4
        calls, sliced [5000:15000) per (shard, variant), and compared
        F_defected_tail[:, 0:n_e-1] != F_undefected_tail[:, 0:n_e-1] elementwise via numpy, counting
        mismatches directly (not via the producer's own comparison code).
      result: >-
        Shard 5000: 0 mismatches / 550,000 elements checked (10,000 trials x 55 blocks). Shard 6000:
        0 mismatches / 550,000 elements checked. Total 0/1,100,000 -- matches the producer's reported
        figure exactly, recomputed from scratch rather than checked for internal consistency only.
      verdict: PASS -- the invariant genuinely holds on this reviewer's own freshly-generated data, both shards.
    - metric: >-
        Estimator recomputation: diff, SE_paired, SE_unpaired, ratio, z_paired at k=17 and across the
        full evaluable k=2..26 range (25 values), per-shard and pooled -- from RAW per-trial S this
        reviewer generated independently in the step above (not from matched_pair_repeat_results.json,
        which does not carry retained-tail raw per-trial S -- only aggregate stats).
      method: >-
        Wrote an INDEPENDENT implementation of the estimator directly from the mathematical definition
        in measure.py's log2_A_from_hists docstring (log2 Ahat_k = log2(mu_hat) - k*log2(q_hat), mu_hat
        = sum_s C(s,k) H_s / (T*C(n_e,k)), q_hat = sum_s s H_s / (T*n_e)) and matched_pair.py's
        matched_pair_stats docstring (leave-one-batch-out jackknife on the per-batch difference,
        se_unpaired via independent-arm quadrature) -- NOT by calling measure.log2_A_from_hists or
        matched_pair.matched_pair_stats. Also independently re-implemented hist_of, batch_hists (200
        jackknife batches via np.linspace splitting), and evaluable_k (floor=30) rather than calling
        sa's versions.
      result: >-
        EXACT MATCH (max abs error across ALL 25 pooled evaluable k values: diff 0.0, se_paired
        4.16e-17, se_unpaired 1.11e-16, ratio 3.01e-12, z_paired 5.11e-13 -- pure floating-point
        summation-order noise, not a discrepancy) between this reviewer's independent recomputation
        and the reported matched_pair_repeat_results.json values, checked exhaustively across k=2..26,
        not merely at k=17. Per-shard k=17 also matches exactly: shard 5000 diff=-0.0214712904572103,
        se_paired=0.017519668259777004 (reported: identical to 16 significant figures); shard 6000
        diff=0.03834606796994677, se_paired=0.05672541366346499 (reported: identical). Pooled k=17:
        diff=+0.012680459248862519, se_paired=0.032968496689324056 (mine: 0.03296849668932404),
        se_unpaired=0.296295, ratio=8.987228, z_paired=0.384624 -- all match the reported pooled
        primary_cell_k17 block to full double precision.
      verdict: >-
        PASS -- the reported diff/SE/z/ratio at k=17 and at every other evaluable k (spot-checked
        beyond the required minimum of 3: all 24 other evaluable k values checked) is a real property
        of the raw data and the estimator formula, not an artifact of matched_pair_repeat.py's
        particular driver or pooling code path, since this reviewer's implementation shares no code
        with it beyond the sha256-pinned, independently re-verified stage_a.py inputs (PRNG, decoder)
        and the injection wrapper (make_defected_decode_blocks, called via mp_mod, itself already
        ADMIT-reviewed in TASK-20260809-603dc5).
    - metric: >-
        Bonus (not required by the handoff, run because the raw data was already on hand): the
        T=5,000 and T=10,000 SE_paired-at-k=17 reference points this task's exponent fit reads from
        TASK-20260809-a79e4f's committed JSON, recomputed from that prior task's own committed
        per_trial_S arrays.
      method: >-
        Applied the same independent estimator implementation to
        TASK-20260809-a79e4f/matched_pair_results.json's stage_1.per_trial_S arrays (shard 5000/6000,
        defected/undefected, 5,000 trials each).
      result: >-
        shard_5000 se_paired: independent 0.12510552702230282 vs. reported 0.12510552702230288; shard
        6000: 0.14989868948535928 vs. 0.14989868948535928 (exact); pooled (T=10,000):
        0.09678123828590587 vs. 0.09678123828590589. All match to ~1e-14 relative precision
        (floating-point noise only).
      verdict: >-
        PASS -- strengthens confidence that the entire 3-point chain this task's exponent fit depends
        on (not just its own new T=20,000 point) is independently reproducible from raw data.
    - metric: fitted SE-vs-trial-count exponent alpha (3 points, k=17, log-log OLS on shards 5000/6000 only).
      method: >-
        Own `numpy.polyfit(log(T), log(SE), 1)` fit on (T=5000, SE=mean of this reviewer's own
        recomputed shard-5000/shard-6000 se_paired -- 0.13750210825383108), (T=10000, SE=this
        reviewer's own recomputed pooled se_paired -- 0.09678123828590589), (T=20000, SE=this
        reviewer's own recomputed pooled se_paired from the fresh retained-tail data --
        0.03296849668932404).
      result: >-
        alpha = 1.0301468649606556. Reported: 1.030146864960655. Absolute difference: 4.44e-16 (last
        bit of double precision, not a discrepancy).
      verdict: >-
        PASS on recomputation. Independently confirmed the reported exponent is arithmetically and
        computationally correct, and genuinely falls outside the pre-registered [0.4, 0.6]
        consistency band. Reported as measured, not interpreted -- per the handoff's item 8, this
        reviewer takes no position on whether this is shard-specific or a general refutation.
    - metric: >-
        sha256 pin for TASK-20260809-a79e4f's matched_pair.py, claimed as
        66266a6178eb46e0b37ec0afdb2620064db56bff82318498e2dd83af1bd1c821.
      method: Recomputed sha256 directly with hashlib against the file read from the reviewed snapshot commit.
      result: Actual sha256 is 66266a6178eb46e0b37ec0afdb2620064db56bff82318498e2dd83af1bd1c821 -- exact match.
      verdict: >-
        PASS -- the pin is genuine, computed at run time, not fabricated. (Also verified: stage_a.py
        and measure.py's pins match their expected constants, and
        TASK-20260809-a79e4f/matched_pair_results.json's own sha256 matches its recorded provenance
        value e9282100958a219e949be8d3e241da2427ed1d0c22a12417b9825ecc047c0f80.)
    - metric: Whether the retained tail is exactly [5000:15000) of a SINGLE n_trials=15000 call, not two separate calls.
      method: >-
        Read matched_pair_repeat.py's phase-3 loop and matched_pair.py's `run_arm` function in full.
        Cross-checked structurally: a two-call implementation (one 5000-trial "prefix" call and one
        separate 10000-trial "new" call starting fresh at internal index 0) would necessarily FAIL the
        disjointness self-check for the second call's own [0:5000) slice (it would reproduce the SAME
        already-consumed range a second time, not disjoint data) -- so the independent bit-identical
        disjointness result above is itself strong behavioral evidence for the single-call claim,
        independent of the source-reading.
      result: >-
        Confirmed by source: the loop body contains exactly one
        `mp_mod.run_arm(sa, ps, shard, N_TOTAL_PER_CALL, decode_fn, original_decode_blocks)` call per
        (shard, variant) iteration (4 total), and `run_arm` itself (read from matched_pair.py, called
        unmodified) issues exactly one warmup `_t_shard` call (300 trials) and exactly one real
        `_t_shard` call (n_trials=N_TOTAL_PER_CALL=15000) -- never two real calls. No `n_trials=10000`
        or `n_trials=5000` literal appears anywhere as an argument to `_t_shard`/`run_arm` in
        matched_pair_repeat.py.
      verdict: PASS -- confirmed both by direct source reading and by the disjointness result's own behavioral signature.
    - metric: Budget/timing claims (36.818 core-s / 36.785 wall-s).
      method: >-
        Cross-checked matched_pair_repeat_results.json.budget against run_manifest.yaml's
        `budget.core_seconds_spent_measured`/`wall_seconds_spent_measured` and stdout.log's printed
        `[done]` line.
      result: >-
        All three agree exactly: 36.818 core-s / 36.785 wall-s (results.json and run_manifest.yaml,
        to 3 decimals) and "core-s=36.82/500.0 wall=36.8s/1800.0s" (stdout.log, at printed precision).
        run_manifest.yaml's separately-recorded shell-measured wall-clock (36.93s) is slightly higher
        than the script's own internal measurement (36.785s), consistent with Python interpreter
        startup/shutdown overhead outside the timed region -- not a discrepancy.
      plausibility_check: >-
        This reviewer's own from-scratch run of a comparable workload (4 calls, 15,000 trials each,
        with warmup, same machine class) took 35.8s and 36.9s wall-clock on two separate executions --
        the same order of magnitude as the executor's reported 36.785s for the same workload shape.
        Consistent with the reported timing being a real measurement, not fabricated.
      verdict: PASS.

