    two-call design would necessarily fail this check); (3) the F[:, 0:n_e-1] invariant genuinely holds
    on freshly-generated data, not merely on the producer's own reported count; (4) the estimator
    (diff/SE_paired/SE_unpaired/ratio/z) reproduces exactly at every evaluable k from an independently-
    implemented formula, not a re-run of the producer's code; (5) the SE-vs-T exponent fit is
    arithmetically correct; (6) the sha256 pin is genuine; (7) budget/timing figures are consistent and
