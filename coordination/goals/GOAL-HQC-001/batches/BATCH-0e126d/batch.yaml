objective: >-
  Scaling-characterization task, per DEC-20260809-186c86's next_actions
  (adopting the Red Team's named counterexample, EV-HQC-3a0372 O8):
  determine whether the alpha=1.4704932987763473 SE-vs-trial-count exponent
  anomaly found in BATCH-412513 is a property of the fresh shards
  (8001/8002) specifically, or a general failure of the matched-pair
  estimator's assumed 1/sqrt(T) scaling. Repeats the T=20,000 matched-pair
  extension on shards 5000 and 6000 THEMSELVES -- the same two shards
  BATCH-412513's stage 1 used -- but with a genuinely NEW, disjoint trial
  range (trial indices 5000..14999 on each shard, never requested by
  TASK-20260809-a79e4f or any prior task in this campaign, as opposed to
  fresh shard indices), at the same primary cell k=m=17 and the same
  k=2..26 range, reusing stage_a.py/measure.py (and, new to this task,
  TASK-20260809-a79e4f's own matched_pair.py helper functions) and the same
  matched-pair leave-one-batch-out jackknife construction on the per-batch
  difference. Adds, as a standing invariant for this and every future task
  in this family (EV-HQC-3a0372 O11): the free structural check that
  F[:, 0:n_e-1] is bit-identical between the defected and undefected decode
  of the same trial on the same shard. Claim tier stays TOY throughout;
  nothing in this batch bears on HQC's IND-CCA security, its
  decoding-failure rate, assumption A17, or any standardized parameter set.

known_code_gap_disclosed: >-
  stage_a.py's `_t_shard` has NO trial-offset parameter: every call begins
  trial indexing at 0 internally (per-trial CTRStream domain tags are
  `b"v0"+ti.to_bytes(...)` for ti in 0..n_trials-1). TASK-20260809-a79e4f's
  matched_pair.py hardcodes N_TRIALS_STAGE1=5000 and has no mechanism for
  requesting a disjoint trial range on an already-used shard. The executor
  task (TASK-20260814-8bbdd2) is therefore NOT a bare re-run of
  matched_pair.py's existing --stage flags; its design.md must specify a new
  "discard-prefix" driver: call `_t_shard(ps, shard, 5000+10000, ...)` ONCE
  per (shard, variant) and retain only the trailing slice [5000:15000] of
  the returned per-trial arrays, discarding but still computing indices
  [0:5000) (which are exactly TASK-20260809-a79e4f's already-consumed
  range on these two shards). This is disclosed here explicitly, per this
  program's rule against fabricating or hand-waving a design gap; the
  Coordinator did not write this code and does not claim it is already
  proven correct -- only that the underlying PRNG is a pure deterministic
  function of (shard, trial index), so the technique is sound in principle,
  and that the executor's own design.md and a disjointness self-check
  (bit-identity of the discarded prefix against TASK-20260809-a79e4f's
  committed per-trial S arrays) must demonstrate it is sound in practice
  before any statistic is computed from the retained tail. See
  TASK-20260814-8bbdd2's handoff constraints for the full specification.

