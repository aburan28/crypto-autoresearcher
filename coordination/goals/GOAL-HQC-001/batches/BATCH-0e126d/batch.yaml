  and 1,800 wall-clock seconds authorized, expected actual spend
  30-90 core-seconds, negligible against the roughly 4,944.9-second
  remaining balance. The executor is REQUIRED to report actual core-seconds
  and wall-clock consumed so the ledger archive can debit a measured number.

