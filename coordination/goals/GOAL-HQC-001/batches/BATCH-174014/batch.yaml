objective: >-
  Per DEC-20260814-3f429d's next_actions (adopting the Red Team's own named
  next_concrete_action and required_controls items 1 and 3 from
  TASK-20260814-a49f1c): complete the four-shard single-shard-only
  (unpooled) local-exponent table by running the SAME discard-prefix,
  disjoint-trial-range technique TASK-20260814-8bbdd2 used, on a SECOND,
  different trial count for shards 8001 and 8002 INDIVIDUALLY (no
  cross-shard pooling anywhere) -- completing the table alongside shards
  5000 (local exponent 2.836, already committed in EV-HQC-469c08 O6) and
  6000 (1.402, same) -- AND, separately and on data already collected (no
  new sampling required), compute and report an inverse-variance-weighted
  (IVW) combination of the two shards' own point estimates at k=17 (and
  ideally k=2..26), for BOTH (a) shards 5000/6000 at their own T=5,000-each
  stage-1 points (an alternative to the existing concatenated-histogram
  pooled T=10,000 point) and (b) shards 8001/8002 at their own T=10,000-each
  stage-2 points (an alternative to the existing concatenated-histogram
  pooled T=20,000-equivalent point). Claim tier stays TOY throughout;
  nothing in this batch bears on HQC's IND-CCA security, its
  decoding-failure rate, assumption A17, or any standardized parameter set.

known_code_gap_disclosed: >-
  TASK-20260809-a79e4f's stage 2 (the only committed data for shards
  8001/8002) persisted ONLY derived matched-pair statistics (ks,
  point_defected, point_undefected, diff, se_paired, se_unpaired, z_paired,
  z_unpaired, unpaired_over_paired_ratio, n_batches, per shard and pooled)
  and per-(shard,variant) D2/D3 hard-invariant counts (D2_violations,
  D3_violations, D3_cap, D3_max_w) -- unlike stage 1 (shards 5000/6000), it
  did NOT persist raw per-trial S arrays or raw histograms
  (matched_pair.py's stage-2 branch never writes an R["per_trial_S"] key;
  confirmed by direct code read of
  coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair.py
  lines 617-795, and by grep against matched_pair_results.json, which has
  exactly one "per_trial_S" occurrence, under stage_1). This means
  TASK-20260814-8bbdd2's exact disjointness-self-check technique
  (bit-identical comparison of the discarded prefix's per-trial S against a
  COMMITTED raw array) CANNOT be replicated verbatim for shards 8001/8002 --
  there is no committed raw array of that kind to compare against. Disclosed
  here explicitly rather than glossed over, per this program's rule against
  fabricating or hand-waving a design gap. The required alternative
  (a within-task, cross-call determinism proof plus an exact match against
  the committed DERIVED statistics, weaker than a direct raw-array match and
  named as such) is specified in full in TASK-20260815-e61cca's handoff
  constraints.

next_action: >-
  Dispatch TASK-20260815-e61cca (executor) first. The remaining four tasks
  are chained via depends_on in dispatch_queue.json exactly as
  BATCH-0e126d's queue chained its analogous four tasks: snapshot archive
  (TASK-20260815-7c6951) depends on the executor; validator
  (TASK-20260815-dbb70b) and red-team (TASK-20260815-907c66) each depend on
  the executor AND the snapshot and run independently and in parallel; the
  ledger archive (TASK-20260815-dd8143) depends on all four prior tasks and
  is the sole task authorized to write ledger/evidence/, ledger/decisions/,
  ledger/goals/. Unlike BATCH-0e126d, this batch's executor task carries NO
  pre-registered binary pass/fail framing to apply at the ledger archive --
  DEC-20260814-3f429d's next_actions named this as a data-completion and
  control-computation task, not a fresh hypothesis test with two named
  outcomes; the ledger archive's job is to report the completed four-shard
  table and the IVW comparison honestly and assess what they show about the
  shard-specific-vs-general question, not to apply a frozen binary rule.

budget_note: >-
  GOAL-HQC-001's campaign_budget.total_wall_clock_seconds is 10,800 and is a
  LIVE pause condition; per DEC-20260814-3f429d's checkpoint, roughly 4,908.1
  of 10,800 seconds remained after BATCH-0e126d's close. This batch's
  executor task requests, for the NEW-SAMPLING half only: 4 real analysis
  calls of stage_a.py's real _t_shard at 30,000 trials each (shards 8001,
  8002 x defected, undefected; 120,000 trial-decodes total, of which 80,000
  are retained/analyzed and 40,000 are the discarded-but-computed prefix),
  PLUS 4 dedicated verification calls at 10,000 trials each (40,000 more
  trial-decodes, needed because stage 2 never persisted a raw array to check
  the discarded prefix against directly -- see known_code_gap_disclosed).
  Total ~160,000 trial-decodes, roughly 2.7x BATCH-0e126d's 60,000. Applying
  that batch's own measured throughput (~2,100 trials/core-second, giving
  30-90 core-seconds for 60,000 trial-decodes there), expected spend here is
  roughly 75-135 core-seconds -- still comfortably inside a 500 core-second
  authorization. The IVW-combination half of this task performs NO new
  _t_shard calls (pure recomputation on already-committed data) and is
  expected to add negligible spend. Sized identically to BATCH-0e126d's
  task, per this batch's own instruction to match unless there is a clear
  reason to differ: 500 core-seconds and 1,800 wall-clock seconds
  authorized, negligible against the roughly 4,908.1-second remaining
  balance. The executor is REQUIRED to report actual core-seconds and
  wall-clock consumed so the ledger archive can debit a measured number.

