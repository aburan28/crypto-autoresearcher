  metric_recomputations:
    - metric: >-
        Disjointness proof Step 1: a dedicated n_trials=10000 verification call per (shard, variant)
        must reproduce TASK-20260809-a79e4f's committed stage_2 D2_violations/D3_violations/D3_cap/
        D3_max_w and matched_pair_stats (point_defected, point_undefected, diff, se_paired,
        se_unpaired, z_paired, z_unpaired, ratio at every evaluable k) exactly.
      method: >-
        Wrote an entirely independent driver (independent_verify.py; not derived from
        shard_8001_8002_discard_prefix.py's source -- coded from design.md Section 3's stated
        mechanism, stage_a.py's own `_t_shard` signature, and the mathematical definitions in
        measure.py's log2_A_from_hists docstring / matched_pair.py's matched_pair_stats docstring).
        Independently re-verified the sha256 of stage_a.py, measure.py, and matched_pair.py against
        the expected pins (all three match), loaded all three fresh via importlib, and for each of the
        4 (shard, variant) pairs called `sa._t_shard` directly (own warmup-then-real discipline
        mirroring, never calling, `matched_pair.run_arm`) with n_trials=10000. Reused, deliberately
        (not what this check tests, and already ADMIT-reviewed elsewhere, e.g. TASK-20260809-603dc5):
        matched_pair.py's `make_defected_decode_blocks` injection wrapper. Independently
        re-implemented (NOT by calling matched_pair.matched_pair_stats or measure.log2_A_from_hists):
        hist_of, batch_hists (200 jackknife batches via np.linspace splitting), evaluable_k
        (floor=30), comb_matrix, log2_A_from_hists, and the paired/unpaired jackknife SE formula.
      result: >-
        ALL 4 (shard, variant) pairs PASS on D2/D3/D3_cap/D3_max_w (0 violations on every call,
        exact integer match to committed stage_2 values). matched_pair_stats: max_abs_err across ALL
        25 evaluable k values, both shards, all 8 fields = 0.0 -- i.e. literal Python `==` bit
        identity, not merely within a declared tolerance. Tolerance used: EXACT (`==` on float64
        values); no tolerance was needed and none was applied, matching the executor's own reported
        outcome (design.md Section 3 pre-declared 1e-9 relative as a fallback in case a numpy/platform
        difference forced one; it did not).
      verdict: >-
        PASS -- independently reproduced from a separately-written driver and a separately-written
        estimator, on this reviewer's OWN freshly-generated raw data, not the executor's. This closes
        the loop on the committed T=10,000 se_paired value used as point 1 of the local-exponent
        computation below: it is independently confirmed reproducible from a fresh sampling call, not
        merely trusted from the prior task's committed JSON.
    - metric: >-
        Disjointness proof Step 2: the real n_trials=30000 analysis call's own discarded prefix
        [0:10000) must be bit-identical, elementwise, to the SEPARATE verification call's own raw
        per-trial S for the same (shard, variant), within one execution.
      method: >-
        Same independent driver made the real n_trials=30000 analysis call (ONE call per (shard,
        variant), confirmed both by source reading of shard_8001_8002_discard_prefix.py and by this
        reviewer's own driver, which also made exactly one such call per pair), sliced [0:10000] from
        its own raw per-trial S, and compared elementwise (np.array_equal) AND via an independently
        re-implemented hist_of against THIS REVIEWER'S OWN verification-call S from the step above --
        never the executor's verification-call data.
      result: >-
        ALL 4 (shard, variant) pairs PASS: elementwise_bit_identical=true, histogram_bit_identical=true,
        length_match=true (10000 vs 10000) on shard_8001_defected, shard_8001_undefected,
        shard_8002_defected, shard_8002_undefected.
      verdict: >-
        PASS -- confirmed on this reviewer's own, independently generated verification AND analysis
        calls (i.e. a fully independent instance of the same two-step check the executor ran, not a
        re-check of the executor's own numbers).
    - metric: >-
        F[:, 0:n_e-1] structural invariant on the retained [10000:30000) tail, both shards: the
        defected and undefected decode's block-failure array F, restricted to the 55 non-last blocks,
        must be bit-identical elementwise.
      method: >-
        Same independent driver retained the full F arrays (not just S=F.sum(axis=1)) for all 4
        analysis calls, sliced [10000:30000) per (shard, variant), and compared
        F_defected_tail[:, 0:n_e-1] != F_undefected_tail[:, 0:n_e-1] elementwise via numpy, counting
        mismatches directly.
      result: >-
        Shard 8001: 0 mismatches / 1,100,000 elements checked (20,000 retained trials x 55 blocks).
        Shard 8002: 0 mismatches / 1,100,000 elements checked. Matches the producer's reported figure
        exactly, recomputed from scratch on this reviewer's own freshly-generated data.
      verdict: PASS.
    - metric: >-
        Single-shard-only local exponent, shard 8001 alone and shard 8002 alone, at k=17 and at k=2,
        10, 24, 26 (4 additional k, exceeding the handoff's minimum of 3).
      method: >-
        alpha = -[log(SE_20000) - log(SE_10000)] / [log(20000) - log(10000)] applied to (a) the
        COMMITTED T=10,000 se_paired at each k, read (not recomputed) from
        TASK-20260809-a79e4f/matched_pair_results.json's stage_2.matched_pair.per_shard.shard_<n>, and
        (b) this reviewer's own independently re-implemented matched_pair_stats applied to this
        reviewer's own retained [10000:30000) tail data from the metric above.
      result: >-
        k=17: shard 8001 alpha = -0.2682495157085447 (executor reported -0.2682495157085447 -- exact
        match); shard 8002 alpha = -0.8662355237627483 (executor reported -0.8662355237627483 --
        exact match). Underlying k=17 statistics also match exactly: shard 8001
        diff=-0.024883352085833366, se_paired=0.029514095961871902, se_unpaired=0.3236250600063397,
        z_paired=-0.8431006024368555; shard 8002 diff=0.04250322299718334, se_paired=0.04028005391322156,
        se_unpaired=1.1794235190866975, z_paired=1.055192803086891 -- all identical to the reported
        values to full double precision. At the 4 additional k values checked (2, 10, 24, 26, both
        shards), the same qualitative pattern holds throughout: SE_paired increases from the committed
        T=10,000 point to this reviewer's own new T=20,000 tail at k>=17 on both shards (alpha
        negative and increasingly so at higher k: shard 8001 k=24 alpha=-1.067, k=26 alpha=-1.352;
        shard 8002 k=24 alpha=-3.047, k=26 alpha=-3.735), while at the two lowest k checked (2, 10)
        SE_paired instead decreases (alpha positive: shard 8001 k=2 alpha=+0.374, k=10 alpha=+0.071;
        shard 8002 k=2 alpha=+0.516, k=10 alpha=+0.121) -- i.e. the reported k=17 anomaly is not an
        isolated single-cell artifact of the estimator at that one order; the sign and magnitude of
        the local exponent vary systematically with k on this reviewer's own independently-generated
        data, a genuine property of this run's data across the checked range, not a k=17-specific
        computational fluke.
      verdict: >-
        PASS -- the reported k=17 exponents are a real, independently-reproducible property of the
        raw data and the estimator formula on this reviewer's own freshly-generated tail, not an
        artifact of shard_8001_8002_discard_prefix.py's particular driver or code path, since this
        reviewer's implementation shares no code with it beyond the sha256-pinned stage_a.py sampler
        and the already-ADMIT-reviewed injection wrapper.
    - metric: >-
        IVW recomputation for (a) shards 5000/6000 at T=5,000-each and (b) shards 8001/8002 at
        T=10,000-each, at k=17 and at k=5, 10, 22, 26 (4 additional k, exceeding the handoff's minimum
        of 3), and the se_ivw/se_pooled_concatenated ratio at k=17 for both pairs.
      method: >-
        Wrote the IVW combination directly from the raw formula (w_i=1/se_paired_i^2,
        diff_ivw=sum(w_i*diff_i)/sum(w_i), se_ivw=1/sqrt(sum(w_i))) in this reviewer's own code, NOT
        by calling ivw_pooling_check.py's `ivw_combine` function, reading only
        TASK-20260809-a79e4f/matched_pair_results.json's already-committed
        stage_1.matched_pair.per_shard.{shard_5000,shard_6000} and
        stage_2.matched_pair.per_shard.{shard_8001,shard_8002} values (sha256 of that file
        independently recomputed: e9282100958a219e949be8d3e241da2427ed1d0c22a12417b9825ecc047c0f80,
        matches both the executor's own measured value and the value on record).
      result: >-
        Exact match at every k checked, both pairs. k=17: ivw_a diff_ivw=0.06443464789067889
        se_ivw=0.09604884205062017 se_ivw/se_pooled=0.9924324564527465; ivw_b
        diff_ivw=0.010615533285116259 se_ivw=0.016410683466159315
        se_ivw/se_pooled=0.9165211564744258 -- BOTH ratios identical to the executor's reported
        values to full double precision (0.9924324564527465 and 0.9165211564744258, matching the
        stdout.log printed line and both results JSONs exactly). At k=5/10/22/26: ivw_a ratios
        0.9995512, 1.0000564, 1.0317004, 1.0240568; ivw_b ratios 1.0016921, 0.9905317, 0.9157030,
        0.9731467 -- all match the values independently recoverable from
        ivw_pooling_check_results.json's own by_k tables exactly (spot-checked against that file
        after computing independently, not before).
      verdict: >-
        PASS -- the IVW diff/SE and the headline se_ivw/se_pooled_concatenated ratios are correctly
        computed from the committed per-shard values by the raw formula, not merely asserted.
    - metric: >-
        Whether the retained tail is exactly [10000:30000) of a SINGLE n_trials=30000 call per
        (shard, variant), never two separate calls.
      method: >-
        Read shard_8001_8002_discard_prefix.py's phase-4 loop in full: exactly one
        `mp_mod.run_arm(sa, ps, shard, N_TOTAL_PER_CALL, decode_fn, original_decode_blocks)` call per
