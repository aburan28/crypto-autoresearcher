  limitations:
    - >-
      Toy claim tier throughout, PS-R3 only (n_e=56, n=7187, N=7168, dup=1,
      m=17). Nothing here is a statement about HQC, A17, any decoding-failure
      rate, or any standardized parameter set.
    - >-
      This report's bootstrap analysis (cross_dataset_disagreement_investigation)
      is itself a new, unregistered analysis performed during validation, not
      a check pre-registered in design.md. It is reported as an independent
      finding, not retrofitted into the executor's pre-registration, and
      should be treated with the same scrutiny any post-hoc analysis
      deserves -- though its method (parametric bootstrap under the
      better-estimated population, matching the smaller dataset's exact
      sample size) is standard and its qualitative conclusion (disagreement
      explained by sampling noise) is robust across all three spot-checked k
      values (17, 20, 26).
    - >-
      The Step-2 ladder gap (docs/inventor-protocol.md Section 6): no
      global-injection pipeline run, even at toy/diagnostic scale, exists
      anywhere in this campaign's record. The ~1.38e5 figure is a projection
      from an unexecuted pipeline, not a measured ratio. Per this Validator's
      binding instructions, this absence is named plainly and is a live
      limitation on the projection's evidentiary weight -- it does not by
      itself make either reliability check `failed` (both checks did exactly
      what they were dispatched to do, correctly, using only already-committed
      data, and neither claims to substitute for Step 2), but the projection
      they bear on should not be treated as more than an order-of-magnitude
      planning figure until Step 2 is run.
    - >-
      This report's directional re-reading of the Red Team's sign argument
      (anti-correlation vs. positive clustering) is itself a heuristic
      analogy argument, not a rigorous bound. It should not be read as a
      settled resolution of DEC-20260806-d9d395's unresolved_confounds item
      3; it sharpens the question and supplies a specific reason to lean
      toward one direction, no more. The Red Team's own named control
      (empirically measuring the conditional restricted moment
      P(other 16 blocks fail | block n_e-1 fails) directly from the already-
      regenerated F_true/F_def arrays) remains the only way to settle this
      properly, and it has not been run in this batch either.
    - >-
      This report validates the reliability-check task's artifact integrity,
      recomputation fidelity, and the robustness argument connecting Check 1
      to the single-vs-global ratio. It does not, and is not authorized to,
      decide whether the campaign should now proceed to scope a
      global-injection pilot, at what scale, or do further validation first
      -- that is the Coordinator's and the Red Team's (TASK-20260806-248cb2)
      call on this batch's combined evidence.

