        re-run those upstream controls (out of scope, no new sampling
        authorized) and does not claim to.
    - control: "decay-with-destroying-parameter check (the canonical artifact tell, per AGENTS.md/inventor-protocol Section 3)"
      note: >-
        The natural "parameter meant to destroy the signal" here is
        decreasing effective sample size (increasing k). The signal does
        NOT decay as effective sample size shrinks -- it GROWS, sharply and
        monotonically, in both datasets. Per the standing rule this is
        flagged, not silently passed: a quantity that fails to decay when
        the parameter meant to destroy it increases is the canonical
        artifact tell. Read plainly, growth toward higher k IS partly an
        artifact of shrinking effective sample size (this report's own
        bootstrap above shows the RATIO ESTIMATOR itself is upward-biased at
        small effective sample, and that bias grows with k) -- but the
        signal does NOT vanish in the well-supported regime either: at
        k=17, Dataset A's 6.6-million-effective-trial estimate is still a
        clean +7.63%, not a decayed-to-noise value, and it is independently
        corroborated by EV-HQC-b71230's own 17/17-cell, -42.7-SD,
        null-controlled measurement at the SAME k=17. The correct reading is
        therefore MIXED, not a clean pass or fail: the k=17 magnitude itself
        looks structural (well-supported, controlled elsewhere, consistent
        across the two independent large-T measurements once sampling noise
        is accounted for), but the reported GROWTH RATE at k>~25-30 is
        contaminated by, and should not be trusted apart from, the
        ratio-estimator's own finite-sample bias.

