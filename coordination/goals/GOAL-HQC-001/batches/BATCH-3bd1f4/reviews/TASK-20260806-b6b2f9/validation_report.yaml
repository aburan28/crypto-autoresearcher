  proof_architecture_ladder_check: >-
    Per docs/inventor-protocol.md Section 6 (isolate-and-measure assumptions;
    run the whole pipeline at reduced scale and observe the claimed
    improvement as a MEASURED ratio, not a projection; name and classify any
    real-scale cheat; exercise the reproducibility pointer): this batch is
    Step 1 of that ladder (isolating and separately measuring one named
    assumption -- the i.i.d.-blocks substitution -- via Check 1, and the
    arithmetic correctness of a second -- the SE-scaling extrapolation --
    via Check 2). Step 2 (running the WHOLE pipeline -- an actual global,
    all-56-block real-sampler injection, even at a small diagnostic T, and
    observing the ~1.38e5-vs-4.33e8-class speedup as a MEASURED ratio) has
    NOT been done anywhere in this batch or its predecessors. The ~1.38e5
    figure remains a projection from an unexecuted pipeline. This is
    correctly not overclaimed by the executor (checks_report.md Section 5
    explicitly states this task "does not decide whether the ~1.38e5
    global-injection projection... is now more or less trustworthy") and is
    correctly named as the next action in DEC-20260806-d9d395's next_actions
    item 2 (a diagnostic-scale pilot before the full projected scale). Per
    the binding instruction in this Validator's own operating rules, the
    ABSENCE of Step 2 is recorded here as a live limitation of the
    ~1.38e5 projection's evidentiary weight, not folded into a "passed"
    verdict on the projection itself -- this report's verdict below is
    scoped to the two reliability checks actually run, not to the
    projection.

  central_question_analysis: >-
    (Task deliverable item 4.) Does the measured, monotonic, k-growing
    deviation change confidence in the ~1.38e5 global-injection projection
    DIFFERENTLY than it changes confidence in the 4.33e8 single-block
    figure? Independent reasoning, reconstructed from the formula's own
    algebra (cross-checked against both TASK-20260806-e120e8/design.md
    Section 3.2 and the Red Team's independent re-derivation in
    red_team_report.md Section 4):

    Delta(log2_A_k)_single = (k/n_e) * (Delta_p/ln2) * bracket(k)
    Delta(log2_A_k)_global = n_e * (k/n_e) * (Delta_p/ln2) * bracket(k)
                            = k * (Delta_p/ln2) * bracket(k)

    where bracket(k) = mu_bar_{k-1}/mu_bar_k - 1/q_hat is EXACTLY the
    quantity Check 1 measures (bracket(k) = relative_deviation(k)/q_hat;
    algebraically confirmed above and in checks_results.json's own
    cross-reference note). Critically, bracket(k) is computed directly from
    the REAL, measured mu_bar_k_true/mu_bar_km1_true values in BOTH
    formulas -- it is not itself set to zero or otherwise approximated at
    this step; Check 1's finding that bracket(k) is large and growing
    (rather than near-zero, as pure i.i.d. blocks would force) is precisely
    what gives the estimator ANY sensitivity to a marginal defect at all.
    The genuinely uncertain approximation the Red Team's Section 1
    identifies is a DIFFERENT, earlier substitution: whether
    Delta(mu_k) ~= (k/n_e)*Delta_p*mu_bar_{k-1} correctly uses the
    UNCONDITIONAL mu_bar_{k-1} in place of the true CONDITIONAL restricted
    moment P(other k-1 blocks fail | the perturbed block fails). Because
    this substitution enters identically -- via the same shared mu_bar_{k-1}
    term -- in BOTH the single-block formula (multiplied by k/n_e) and the
    global formula (multiplied by the full k), any correction to it
    propagates into Delta(log2_A_k)_single and Delta(log2_A_k)_global by
    the SAME relative factor. The ratio
    Delta(log2_A_k)_single / Delta(log2_A_k)_global = k/n_e / k = 1/n_e
    (hence T_req_single/T_req_global = n_e^2 = 3136) is therefore a PURE
    consequence of the dilution geometry (how many of the 56 blocks are
    perturbed) and does NOT depend on getting bracket(k), or the
    conditional-vs-unconditional substitution feeding it, exactly right.
    CONCLUSION: the qualitative conclusion (global injection removes the
    k/n_e dilution and is therefore vastly cheaper than single-block, by
    ~3 orders of magnitude in required T) is MATHEMATICALLY ROBUST to the
    magnitude of the i.i.d.-approximation error Check 1 quantified -- this
    is not merely asserted; it follows from the two formulas sharing the
    identical bracket(k)/mu_bar_{k-1} terms and differing only by a
    dilution-geometry prefactor untouched by the approximation question.
    This independently confirms (via a different, more explicit argument)
    the reasoning DEC-20260806-d9d395 already stated qualitatively
    ("the QUALITATIVE conclusion... follows directly from the confirmed
    formula's structure... and does not depend on resolving the
    independence-approximation question first").

    WHAT IS NOT ROBUST, and where this report goes beyond confirming the
    existing record: (1) The ABSOLUTE values of BOTH 4.33e8 and ~1.38e5
    remain order-of-magnitude uncertain and move TOGETHER (same direction,
    similar relative magnitude) under any correction to the shared
    substitution -- the ratio survives, the point estimates do not.
    (2) The Red Team's own directional guess (red_team_report.md Section
    1.3: "the most natural reading of the sign... points toward the true
    required T being smaller than 4.33e8, not larger") rests on an
    assumption of POSITIVE block-failure clustering ("conditioning on one
    block failing should make the others more likely to fail too"). This
    assumption is IN TENSION with this campaign's own already-established,
    independently-controlled headline finding: EV-HQC-b71230 reports
    log2_A_k NEGATIVE and increasingly so with k (-6.03e-3 at k=2 falling to
    -0.981 at k=18), which EV-HQC-b71230's own inference states plainly
    means block failures are ANTI-correlated, not positively clustered, at
    every tested order. A positive relative_deviation(k) (mu_bar_k SMALLER
    than the q*mu_bar_{k-1} i.i.d. prediction, i.e. mu_bar_k trending below
    q^k) is the same phenomenon restated: this system's own established
    correlation structure is anti-correlation, growing with k, not positive
    clustering. Under anti-correlation, conditioning on the perturbed
    block's failure should make the OTHER k-1 blocks LESS likely to fail
    (not more), which would mean the model's unconditional-mu_bar_{k-1}
    substitution OVERSTATES, not understates, Delta(mu_k) -- the opposite
    sign from what the Red Team's Section 1.3 prose assumed. If this
    reading is right, the TRUE required-T for BOTH the single-block and the
    global case is plausibly LARGER than the modeled 4.33e8/1.38e5, not
    smaller -- i.e. ~1.38e5 could be an UNDERestimate of the true cost, not
    an overestimate as the Red Team's prose suggested. This is stated here
    as a heuristic sign argument by analogy (exactly as uncertain in kind as
    the Red Team's own argument it revises), NOT as a rigorous derivation --
    resolving it properly requires the Red Team's own named control
    (splitting F_true/F_def by block-n_e-1 outcome and directly measuring
    the conditional restricted moment), which remains unrun. It does not
    change the ROBUST ratio conclusion above; it does sharpen
    DEC-20260806-d9d395's own recorded "unresolved_confounds" item 3
    ("whether... a global injection's true required-T [is] higher or lower
    than 1.38e5 is unresolved; the direction is ambiguous, not settled") by
    supplying a specific, campaign-evidence-grounded reason to lean toward
    HIGHER rather than the Red Team's originally-suggested LOWER -- without
    resolving it.

  independent_reads_on_the_projection: >-
    (Task deliverable item 6.) This finding does NOT materially threaten the
    QUALITATIVE conclusion that a global (all-56-block) injection faces a
    vastly smaller dilution penalty than a single-block injection, and
    should still be sized as the next experiment ahead of any further V3
    work -- that conclusion is a robust consequence of the dilution
    formula's algebraic structure, not of the specific bracket(k) value, and
    survives the measured approximation error intact. It DOES materially
    lower confidence that ~1.38e5 (or 4.33e8) is a precise, decision-grade
    trial count: the deviation is real (independently reproduced from raw
    data by this report, not merely trusted from the executor's script),
    grows with k rather than staying bounded near the load-bearing k=17
    value, and -- per this report's own bootstrap analysis -- even the
    better-supported T=1e7 estimate likely itself carries some residual
    upward estimator bias at k>=17 that has not been separately quantified
    or corrected for. Both ~4.33e8 and ~1.38e5 should continue to be treated
    as order-of-magnitude planning figures, not point targets -- consistent
    with, and now somewhat more sharply reasoned than, the caution
    DEC-20260806-d9d395 already recorded. Sizing an initial global-injection
    pilot BELOW the full ~1.38e5 projection (as DEC-20260806-d9d395's own
    next_actions item 2 already specifies) is the right response to this
    finding, not a pause and not an unqualified green light to size directly
    against 1.38e5.

