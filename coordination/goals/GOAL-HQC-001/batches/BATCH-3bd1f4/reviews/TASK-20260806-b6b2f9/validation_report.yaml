    - control: "no positive control / no null-object control for the deviation-magnitude claim itself"
      note: >-
        docs/inventor-protocol.md Section 3's null-object standard applies
        to a claimed SIGNAL that could be an artifact of the measurement
        pipeline. Check 1's signal (mu_bar_{k-1}/mu_bar_k departing from
        1/q_hat) is not a new claim manufactured by this task -- it is a
        direct, independently-reproduced (both by the executor and, above,
        by this report from raw histograms) restatement of EV-HQC-b71230's
        own already-controlled, already-null-tested headline finding (NULL-P
        fired 0/17 cells at the same T against the same frozen interval;
