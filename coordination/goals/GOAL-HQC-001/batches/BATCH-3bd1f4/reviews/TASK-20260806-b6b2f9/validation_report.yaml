  independent_reproduction:
    method: >-
      Two fully independent computations, written from scratch, NOT derived
      from reliability_checks.py's code, and run BEFORE reading
      checks_results.json / checks_report.md's numeric tables in detail:
      (1) Check 1 Dataset A: loaded measurement_results.json's raw
      S_histogram (T=10,000,000, n_e=56) directly and computed
      mu_bar_k = sum_s H_s*C(s,k) / (T*C(n_e,k)) for every k using Python's
      arbitrary-precision `fractions.Fraction` (no floating-point rounding
      anywhere in the combinatorics), for k=1..35 (the histogram's full
      nonzero support). relative_deviation(k) = (mu_bar_{k-1}/mu_bar_k)*q_hat - 1
      computed the same way, with q_hat itself recomputed exactly from the
      histogram (not read from the JSON). (2) Check 1 Dataset B: loaded
      the RAW per-trial S-histogram
      (primary_matched_pair_analysis.combined_10000.log2_A_comparison.hist_true,
      T=10,000) -- NOT the pre-aggregated mubar_k_true/mubar_km1_true table
      the executor's script reads directly -- and recomputed every mu_bar_k
      from that raw histogram with the identical exact-Fraction method,
      giving an independent check one level deeper into the data than the
      executor's own script performs for Dataset B. (3) Check 2: an
      independently written required_T(k, Delta_p) implementation, spot-
      checked against all 8 committed delta_p_sensitivity_k17 points and a
      self-chosen sweep (dp in {1e-5, 1e-3, 0.0082, 0.03, 0.2, 0.9}).
      (4) A NEW analysis not present in the executor's report: a parametric
      bootstrap of the Dataset A vs Dataset B disagreement (see
      cross_dataset_disagreement_investigation below), to determine whether
      the ~1.75x gap at k=17 is explicable by T=10,000 sampling noise.
    checks_performed:
      - name: "Check 1 Dataset A -- exact-Fraction recomputation from raw S_histogram"
        result: >-
          Reproduces the executor's per-k relative_deviation table exactly
          (to displayed precision) at every spot-checked k: k=2: +0.4189%
          (mine) vs +0.42% (report); k=17: +7.6342% vs +7.63% (checks_results.json:
          0.07634151754880092, exact digit match); k=26: +27.8093% vs
          +27.81%; k=35: +659.92% vs +659.92% (5 supporting trials, as
          reported). Confirmed POSITIVE at every k=2..35, no sign flips,
          monotonically increasing throughout, matching the executor's
          headline claim exactly. Also independently cross-checked
          log2_A_17 = -0.8656665522924349 against measurement_results.json's
          committed MEASUREMENT.cells[k=17].log2_A_k, abs diff 0.0
          (bit-identical via the exact-integer combinatorics path, tighter
          than the executor's own 1e-9 gate).
      - name: "Check 1 Dataset B -- exact-Fraction recomputation from the RAW hist_true histogram (one level deeper than the executor's script)"
        result: >-
          Recomputed mu_bar_k for k=2..30 directly from
          primary_matched_pair_analysis.combined_10000.log2_A_comparison.hist_true
          (T=10,000), NOT from the pre-aggregated required_T_derivation.per_k
          table reliability_checks.py itself reads. Every recomputed mu_bar_k
          matches the committed per_k table's mubar_k_true to machine
          precision (relative differences 0 to 2e-16, i.e. floating-point
          noise only) for all 25 overlapping k values, confirming the
          committed table is itself a faithful function of the raw
          histogram, not merely internally self-consistent. relative_deviation(17)
          = 13.3884%, exact digit match against checks_results.json
          (0.13388396046433848) and the Red Team's originally reported
          13.4%. Same positive-monotonic pattern confirmed for k=2..30 (one
          k further than the executor's k=2..26 table, since the raw
          histogram in this JSON has nonzero support to s=30): +162.9% at
          k=27, +839.1% at k=30.
      - name: "Check 2 -- independent required_T reimplementation"
        result: >-
          Reproduces all 8 committed delta_p_sensitivity_k17 points to
          relative differences of 2e-16 to 3e-15 (machine precision).
          Reproduces the k=17, Delta_p=0.0082 headline figures exactly:
          total=0.0015053436..., required_T=432907900.4341... (the "4.33e8"
          cited in the task background). At a self-chosen sweep
          (Delta_p in {1e-5, 1e-3, 0.0082, 0.03, 0.2, 0.9}, none of which
          coincide with the executor's own 61-point logspace grid),
          T_req*Delta_p^2 is constant to 2.9108727225e+04 at every point,
          i.e. the same coefficient-of-variation-zero behavior the executor
          reports (2.47e-16 CV over its own grid). bracket(17) =
          mu16/mu17 - 1/q_hat = +0.4191662959630871, matching the executor's
          reported bracket sign and the algebraic identity
          bracket = relative_deviation/q_hat = 0.13388/0.31941 = 0.4192.
      - name: "artifact_paths and sha256 recomputation against the snapshot receipt"
        result: >-
          All 10 declared paths present, all sha256 hashes recomputed and
