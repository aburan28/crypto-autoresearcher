  metric_recomputations:
    - metric: "Check 1 monotonic-growth pattern, both datasets"
      method: exact-Fraction recomputation from raw histograms (see above)
      result: >-
        CONFIRMED. Positive at every tested k in both datasets (Dataset A:
        k=2..35; Dataset B: k=2..30, one k beyond the executor's reported
        range since the raw histogram supports it), monotonically
        increasing throughout, no sign flips, steepening sharply as
        effective sample size collapses at high k in both datasets. This is
        a robust, reproducible, non-artifact-of-implementation finding.
    - metric: "Check 2 SE-scaling / T_req arithmetic correctness"
      method: independent reimplementation, spot sweep
      result: >-
        CONFIRMED. No sign error, discontinuity, or blow-up found anywhere
        in a self-chosen spot sweep spanning 5 orders of magnitude. This
        establishes the ARITHMETIC is correct across a wide range; per
        design.md's own stated scope, it says nothing new about whether the
        underlying i.i.d.-blocks MODELING approximation (Check 1's subject)
        is itself accurate.
    - metric: >-
        cross_dataset_disagreement_investigation (Task deliverable item 2 --
        NOT computed or attempted by the executor's task, which explicitly
        declined to adjudicate it)
      method: >-
        Parametric bootstrap. Treated Dataset A's empirical S-distribution
        (T=1e7, by far the better-estimated population S-law available)
        as ground truth, drew 20,000 independent multinomial(T=10,000, pmf_A)
        resamples (matching Dataset B's actual sample size exactly), and
        computed the resulting distribution of relative_deviation(k) for
        k in {17, 20, 26} using the SAME exact estimator as both datasets.
      result: >-
        At k=17: bootstrap mean=9.88%, std=7.29 percentage points; Dataset
        B's actual observed value (13.39%) sits at the 65.3rd percentile of
        this simulated distribution -- squarely in the bulk, not an
        outlier. At k=20: bootstrap mean=18.34%, std=12.11pp; Dataset B's
        26.40% sits at the 73.1st percentile. At k=26: bootstrap
        mean=85.65%, std=37.77pp; Dataset B's 118.50% sits at the 77.6th
        percentile. CONCLUSION: the ~1.75x (k=17) to ~4.3x (k=26)
        disagreement between Dataset A and Dataset B is fully consistent
        with, and well explained by, ordinary sampling noise at Dataset B's
        T=10,000 scale -- it does NOT require a genuine methodological or
        population-level difference between the two datasets (which do, in
        fact, draw from different shard ranges: Dataset A used stage_a.py
        shards 1000-1007 (measure.py, "fresh draws"), Dataset B used shards
        5000/6000's true-decode path (matched_pair_reanalysis.py) -- both
        undefected/true-arm PS-R3 draws, same nominal parameter set, no
        defect injection in either).
      secondary_finding_not_in_executor_report: >-
        The bootstrap means (9.88% at k=17, 18.34% at k=20, 85.65% at k=26)
        are themselves systematically HIGHER than Dataset A's own
        large-sample point estimates (7.63%, 10.28%, 27.81% respectively)
        at the SAME k. This indicates the mu_bar_{k-1}/mu_bar_k ratio
        estimator carries a real, positive finite-sample bias that grows
        with k (consistent with a ratio-of-small-noisy-quantities estimator,
        where noise in the denominator inflates E[ratio] above the
        population ratio by a convexity/Jensen argument). Because this bias
        scales with effective sample size, it is comparatively small at
        Dataset A's own k=17 (6.6M effective trials) but becomes
        non-negligible for Dataset A itself at high k (k>=26, where
        effective trials fall into the hundreds of thousands and below) and
        is severe for Dataset B at essentially every k beyond ~15. Practical
        upshot: even Dataset A's own point estimates at k>=~25-30 should be
        read as increasingly upward-biased, not merely increasingly noisy,
        echoing the executor's own caveat about k=35's five supporting
        trials but extending it earlier in the k range than the executor's
        report states.
      resolution_of_task_item_2: >-
        Neither figure is "the true deviation" in isolation. The T=1e7
        estimate (+7.63% at k=17) is far more reliable than the T=10,000
        estimate (+13.39%) because of its ~660x larger effective sample at
        k=17 and because the bootstrap places the T=10,000 estimate
        comfortably inside the noise band a T=1e7-scale ground truth would
        produce at T=10,000. The 13.4% figure the Red Team originally
        reported and that seeded this whole reliability-check batch should
        be read, going forward, as a noisy realization consistent with a
        population value closer to Dataset A's +7.63% (itself very likely a
        slight upward-biased estimate too, though much less so than
        Dataset B's).

