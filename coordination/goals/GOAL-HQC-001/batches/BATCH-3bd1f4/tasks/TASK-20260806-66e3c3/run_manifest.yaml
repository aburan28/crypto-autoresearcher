        --selftest-fail-closed
      cwd: coordination/goals/GOAL-HQC-001/batches/BATCH-3bd1f4/tasks/TASK-20260806-66e3c3
      exit_code: 0
      result: >-
        Gate correctly aborted with SystemExit before computing anything
        ("FAIL-CLOSED: sha256 mismatch on measure.py: expected
        000...0000, got a4fd1ecb...5dc8"). No checks_results.json was
        written by this invocation. Not counted as the authorized run; runs
        no scientific computation and writes no results artifact.
      stdout_log: selftest_stdout.log
      stderr_log: selftest_stderr.log
      wall_seconds_approx: <1
    - purpose: authorized measurement run (both checks, real committed data)
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3 reliability_checks.py --out-dir .
      cwd: coordination/goals/GOAL-HQC-001/batches/BATCH-3bd1f4/tasks/TASK-20260806-66e3c3
      exit_code: 0
