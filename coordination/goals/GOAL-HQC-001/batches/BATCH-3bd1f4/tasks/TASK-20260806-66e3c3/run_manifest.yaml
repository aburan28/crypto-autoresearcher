  experiment_id: EXP-HQC-982268
  hypothesis_id: H-HQC-18d1b4
  claim_tier: toy
  title: >-
    Two cheap, no-new-sampling reliability checks on the "double dilution"
    formula: (1) conditional-vs-unconditional mubar_{k-1} deviation across a
    range of k, on two independent already-committed PS-R3 datasets; (2)
    SE-scaling / required-T formula in-range check across a wide Delta_p
    sweep and the full k=2..26 range.
  authorized_by:
    decision: DEC-20260806-d9d395
    next_action_item: 1
  scope_statement: >-
    PS-R3 only (n_e=56, n=7187, N=7168, dup=1, m=17). Nothing here is a
    statement about HQC, A17, any decoding-failure rate, or any
    standardized parameter set.

  no_new_sampling:
    confirmed: true
    statement: >-
      No cryptographic sampler, decode_blocks call, or stage_a.py shard was
      invoked, regenerated, or drawn anywhere in this task. Both checks
      compute entirely from two already-committed JSON artifacts
      (measurement_results.json, reanalysis_results.json) plus a
      sha256-pinned, read-only import of measure.py's comb_matrix and
      log2_A_from_hists functions. No random-number generator of any kind
      is invoked in reliability_checks.py; every reported number is either
      read directly from an already-committed file or derived from one by
      deterministic arithmetic. There is no seed to record because there is
      no draw.
    files_read_only_no_modification:
      - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-cde749/measure.py
      - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-cde749/measurement_results.json
      - coordination/goals/GOAL-HQC-001/batches/BATCH-fc30b5/tasks/TASK-20260806-e120e8/reanalysis_results.json

  fail_closed_sha256_pins:
    - file: measure.py
      pinned_sha256: a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8
      pin_source: coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/archives/TASK-20260806-40c805/snapshot-receipt.json
      verified_match: true
    - file: measurement_results.json
