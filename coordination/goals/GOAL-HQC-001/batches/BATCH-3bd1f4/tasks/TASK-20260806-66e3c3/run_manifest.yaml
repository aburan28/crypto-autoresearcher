      (coordination/goals/GOAL-HQC-001/batches/BATCH-3bd1f4/tasks/TASK-20260806-66e3c3/)
      was created, modified, or deleted. Nothing under experiments/,
      stage_a.py, measure.py, or any other task's directory was touched.

  environment:
    python: 3.11.15
    numpy: 2.4.6
    platform: Linux-6.18.5-fc-v18-x86_64-with-glibc2.39
    processor: x86_64
    randomness_sources: none
    seeds: none
    seed_note: >-
      No pseudo-random number generator is instantiated anywhere in
      reliability_checks.py. Both checks are deterministic arithmetic on
      already-committed data; there is nothing to seed.

  validity:
    status: valid_measurement
    reason: >-
      All fail-closed self-integrity gates passed on the authorized run
      (11 gates: 3 sha256 pins, Dataset A histogram-sum/q_hat-recompute/
      pinned-fn-q-match/log2_A_17-cross-check, Dataset B q_hat-from-mu1-
      vs-provenance-string, z_sum recompute, k=17 Delta_p=0.0082
      reproduction, and the 8-point delta_p_sensitivity_k17 table
      reproduction). No uncaught exception. Both datasets yielded
      well over 10 usable k values with finite, nonzero moments
      (Dataset A: 34 usable k in [2,35]; Dataset B: 25 usable k in
      [2,26]). The separate fail-closed self-test, run with a
      deliberately corrupted pin, correctly aborted before any
      computation.
    completion_gate_from_dispatch_queue:
      - "design.md pre-registers what each check measures and what results would indicate high vs. low confidence in the projection, before results are computed": satisfied
      - "checks_report.md reports both checks' actual measured results, including any k-dependence in the conditional-vs-unconditional deviation": satisfied
      - "run_manifest.yaml carries command, git commit and dirty-tree state, environment, seeds, timings, validity status, and confirms no new sampling occurred": satisfied (this file)

  certificate:
    kind: none
    note: >-
      Pure measurement/reanalysis of already-committed data. No
      discrete-log solve or factor-base relation is claimed; certificate
      discipline (docs/claims-and-verification.md) is not engaged by this
      task.

  protocol_deviations: []
  anomalies:
    - >-
      Dataset A (T=1e7, higher-precision) and Dataset B (T=10,000, the
      source of the Red Team's original 13.4% figure) disagree on the
      k=17 relative-deviation point estimate by a factor of ~1.75 (7.63%
      vs. 13.39%), with the disagreement growing at higher k and
      correlated with the two datasets' very different effective sample
      sizes at each k. This was not anticipated in design.md's binary
      higher/lower-confidence framing and is reported as a distinct,
      disclosed fact in checks_report.md Section 2.3, not resolved by
      this task.
    - >-
      The deviation measured in Check 1 grows monotonically and
      increasingly steeply for k beyond the load-bearing order 17 in
      both datasets (never shrinks, never flips sign) -- per design.md
      Section 1.3's pre-registered reading this is the signature
      associated with LOWER confidence in treating the k=17 figure as
      representative/bounded, even though the deviation's stable,
      non-erratic sign and smooth growth are separately consistent with
      it being a real structural effect rather than noise. Both readings
      are reported; neither is resolved into a single verdict by this
      task.

