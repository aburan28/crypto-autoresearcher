    numpy: 2.4.6
    platform: Linux-6.18.5-fc-v18-x86_64-with-glibc2.39
    processor: x86_64
    cpu_count: 4
    note: >-
      python/numpy versions match V1's/V2's/measure.py's recorded
      environments, which is what makes the sha256-pinned imports
      meaningful here.

  seeds:
    main_run:
      seed_prefix: TASK-20260806-e1700f/PLANTED-ARM-V3/main/v1
      derivation: >-
        seed(purpose, n) = first 8 bytes, big-endian, of SHA-256 of the
        ASCII string "<seed_prefix>|<purpose>|<n>".
      per_batch_seeds: >-
        seed("batch", i) for i = 0..199, one np.random.Generator(PCG64(seed))
        per jackknife batch, consumed in order: draw_block_fail (rng.integers
        then rng.random for subset keys), THEN rejection_sample_content's
        Bernoulli(0.35) draws (rng.random per round, redraw-only-pending),
        all within that batch's single 2,500-trial generation call.
      first_5_batch_seeds:
      - 5273631306705469779
      - 10126358557708299874
      - 844542782760321990
      - 5977461696760399385
      - 9615726637637809172
    detection_run:
      seed_prefix: TASK-20260806-e1700f/PLANTED-ARM-V3/detection/v1
      derivation: same formula, distinct prefix
      component_a_batch_seeds: 'seed("detA_batch", i) for i = 0..19'
      component_b_batch_seeds: 'seed("detB_batch", i) for i = 0..39'
    distinctness_from_other_tasks: >-
      Distinct from V1's ("TASK-20260806-e19f6c/PLANTED-ARM/v1"), V2's
      ("TASK-20260806-047535/PLANTED-ARM-V2/v1"), and measure.py's
      ("EXP-HQC-982268/v3/INV-NULL") seed prefixes, so no task's random
      stream can collide with or be mistaken for another's. The main-run
      and detection-run prefixes are ALSO distinct from each other within
      this task, so the two authorized runs' random streams cannot
      collide either.
    prng: numpy.random.Generator(numpy.random.PCG64(seed)), one instance
      per batch, consumed in a fixed order -- deterministic and
      reproducible from the recorded seeds.

