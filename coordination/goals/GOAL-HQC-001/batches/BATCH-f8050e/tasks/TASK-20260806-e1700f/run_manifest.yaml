run_manifest:
  task_id: TASK-20260806-e1700f
  role: executor
  experiment_id: EXP-HQC-982268
  hypothesis_id: H-HQC-18d1b4
  goal: GOAL-HQC-001
  batch: BATCH-f8050e
  run_of: >-
    V3 planted-correlation control arm for OPEN-6, replacing the V2 arm's
    (TASK-20260806-047535) two fixed, hand-searched, worst-case templates
    with a genuinely heterogeneous per-position, per-trial content ensemble
    built by rejection sampling from Bernoulli(0.35), conditioned on
    matching the position's intended decode label under the REAL
    decode_blocks. Produces TWO distinct deliverables: (1) the same
    MATCH/MISMATCH check against the closed-form log2_A_k(k) V1/V2
    performed (planted_results.json); (2) a separate injected-defect
    experiment measuring a calibrated boundary-shift detection RATE, with a
    confidence interval, directly comparable to the Red Team's
    independently measured ~8.8%/~19.6% natural flip-rate baselines
    (EV-HQC-9a30d3) (detection_results.json).
  claim_tier: toy
  authority: >-
    I am the Executor. This manifest records observations only. It
    concludes NOTHING about A17, HQC's decoding-failure rate, or any
    standardized HQC parameter set, and it changes no research status.
    MATCH/MISMATCH per k, and the measured detection rate with its
    confidence interval, are reported without interpretation; whether this
    arm closes, partially closes, or leaves open OPEN-6, and whether the
    control-arm approach itself has reached a ceiling, are judgements for
    the Coordinator and the two independent reviewers dispatched after this
    task (TASK-20260806-cdc631 validator, TASK-20260806-7008de red team).
  dispatch_source: coordination/goals/GOAL-HQC-001/batches/BATCH-f8050e/dispatch_queue.json
  budget_authorized:
    wall_clock_seconds: 3600
    core_seconds: 1800
    memory_gb: 2
    runs_authorized: 2
  budget_allocation_this_tasks_own_split:
    main_run:
      core_seconds_allocated: 1000.0
      wall_seconds_allocated: 1800.0
    detection_run:
      core_seconds_allocated: 800.0
      wall_seconds_allocated: 1500.0
    note: >-
      This split (summing to the task's authorized 1800 core-seconds) is
      this task's own allocation decision, recorded here for audit
      (design.md Section 6), not itself separately coordinator-approved
      beyond the total.

  execution_count:
    authorized_runs_executed: 2
    detail: >-
      Exactly TWO authorized script invocations against this task's own
      --out-dir (this directory), each executed EXACTLY ONCE: (1)
      `--mode main`, producing planted_results.json; (2) `--mode
      detection`, producing detection_results.json. Both are reported
      identically here and in detection_rate_report.md/planted_results.json
      -- no discrepancy (V1's carried-forward, still-unresolved run-count
      discrepancy, DEC-20260806-cf5102 limitations, is not repeated by this
      task). In addition, THREE separate, explicitly distinguished
      pre-run test invocations ran in SCRATCH space
      (/tmp/.../scratchpad), never against this directory, and none of
      them wrote a committed artifact: a smoke run (`--mode main --trials
      2000 --batches 200`), a smoke run (`--mode detection --trials-a
      20000 --sub-chunk-a 5000 --trials-b 5000 --sub-chunk-b 2500`), and
      the fail-closed dry-run demonstration (see
      commands.fail_closed_check_verification). A pre-registration
      calibration bench (bench_v3.py, bench_v3b.py, also scratch-space,
      uncharged) preceded all of the above and is cited in design.md
      Section 3.2.

  pre_registration_ordering:
    claim: >-
      design.md was written and frozen (including the closed-form
      log2_A_k(k) table, the rejection-sampling construction, and the
      detection-rate experiment design) BEFORE planted_arm_v3.py was run on
      any real (non-scratch, non-calibration) data.
    evidence_file_mtimes_utc:
      design.md: '2026-08-06T17:45:37Z'
      planted_arm_v3.py_final: '2026-08-06T17:51:03Z (last edit: reverting
        the deliberate fail-closed-check mismatch demonstration back to the
        correct sha256 constant, and fixing one self-caught stray-paren
        syntax error caught by py_compile before any run -- see
        deviations below; the script''s functional content was otherwise
        unchanged since its initial write)'
      planted_results.json_final: '2026-08-06T18:02:32Z'
      detection_results.json_final: '2026-08-06T18:07:14Z'
    order_holds: true
    in_run_reproduction_checks:
      planted_law: >-
        planted_law() recomputes mu_bar_k, q, and log2_A_k(k) for k=2..18
        from the same closed form at run time (in BOTH --mode invocations)
        and compares it to DESIGN_TABLE_LOG2_A (design.md Section 2.1,
        transcribed as a module constant) with a 1e-12 tolerance; a
        mismatch aborts the run before any trial is sampled. Result (both
        runs): mismatched_keys=[], verdict=PASS.
      per_block_rejection_verification: >-
        Every accepted block, in both runs, was individually verified at
        generation time to decode (via the real decode_blocks) to its
        intended label before being used -- this IS the rejection-sampling
        acceptance criterion itself (design.md Section 3.1), not a
        post-hoc check.
      full_trial_self_check: >-
        Every batch of the main run additionally re-decoded the FULL
        assembled 56-block trial and asserted F == block_fail bit-for-bit
        (design.md Section 4 step 5); Component B of the detection run did
        the same before applying any perturbation. Both checks passed on
        every batch (200/200 main-run batches; 40/40 Component-B batches).

  commands:
    dependency_install: 'none required; numpy already present in this environment'
    pre_registration_calibration_bench: >-
      python3 /tmp/.../scratchpad/bench_v3.py and bench_v3b.py (ad hoc,
      acceptance-probability probe over 2,000,000 Bernoulli(0.35)
      candidates, plus rejection-sampling throughput measurements at
      several batch sizes for both the full-56-position and 2-position
      architectures -- design.md Section 3.2). Run in scratch space,
      outside this task's write scope and outside --out-dir; produced no
      committed artifact; used only to size the planned T's against the
      1800 core-second budget. Not charged against this task's budget (same
      convention V1/V2 used for their own throughput/template-search
      calibration).
    smoke_run_main: >-
      python3 planted_arm_v3.py --mode main --out-dir <scratch> --trials
      2000 --batches 200 (10 trials/batch; ran without error, 17/17 MATCH
      trivially given the tiny T; used to catch implementation bugs cheaply
      before spending real budget)
    smoke_run_detection: >-
      python3 planted_arm_v3.py --mode detection --out-dir <scratch>
      --trials-a 20000 --sub-chunk-a 5000 --trials-b 5000 --sub-chunk-b 2500
      (ran without error; smoke-scale detection rates -- paired_neighbor
      unconditional phat=0.1026, margin-conditioned phat=0.197 -- were
      already visibly in the same regime as the eventual authorized-run
      figures and the Red Team's baseline, giving early confidence the
      construction was implemented correctly, before the full-scale runs)
    fail_closed_check_verification: >-
      MEASURE_PY_EXPECTED_SHA256 in planted_arm_v3.py (this task's own
      committed script, inside its write_scope) was temporarily edited to
      an all-zero-digit placeholder, then the script was re-run
      (PYTHONDONTWRITEBYTECODE=1 python3 planted_arm_v3.py --mode main
      --out-dir <scratch> --trials 2000 --batches 200); it printed
      "FAIL-CLOSED: measure.py sha256 mismatch. expected=00...0
      actual=a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8."
      to stdout (this script prints fail-closed messages via SystemExit
      argument, captured on stdout in this invocation's non-redirected
      terminal run), wrote NO new planted_results.json under the scratch
      --out-dir, and exited with status 1. The constant was then reverted
      (via a second Edit, restoring the exact original value) and verified
      with a passing smoke run (17/17 MATCH) before any authorized run.
      This demonstrates the check actually reads the field it guards and
      aborts on a real mismatch (constraint: FAIL-CLOSED, NOT FAIL-OPEN).
    the_authorized_main_run_command: >-
      PYTHONDONTWRITEBYTECODE=1 python3 planted_arm_v3.py --mode main
      --out-dir . --trials 500000 --batches 200 > stdout_main.log 2>
      stderr_main.log
    the_authorized_detection_run_command: >-
      PYTHONDONTWRITEBYTECODE=1 python3 planted_arm_v3.py --mode detection
      --out-dir . > stdout_detection.log 2> stderr_detection.log
      (uses this script's own default --trials-a/--sub-chunk-a/--trials-b/
      --sub-chunk-b, matching design.md Section 1's planned
      T_DET_A=2,000,000 / T_DET_B=100,000)
    the_authorized_runs_note: >-
      Each of the two commands above was executed EXACTLY ONCE, producing
      the committed stdout/stderr logs and result JSON files. No re-run, no
      repeat invocation with identical seeds, no discarded/superseded
      execution of either command exists. Execution count is reported
      identically here and in detection_rate_report.md: TWO authorized
      runs, plus the three separate, explicitly distinguished pre-run test
      invocations in scratch space listed above, none of which wrote a
      committed artifact.

