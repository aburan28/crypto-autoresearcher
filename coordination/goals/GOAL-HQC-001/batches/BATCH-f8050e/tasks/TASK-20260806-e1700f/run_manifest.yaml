  fail_closed_checks:
  - name: measure.py sha256 integrity
    reads: MEASURE_PY_EXPECTED_SHA256 (module-level constant) vs. sha256_file(MEASURE_PY)
    aborts_on_mismatch: true
    verified_by: deliberate-mismatch dry run, see commands.fail_closed_check_verification
    fired_in_authorized_runs: false
  - name: stage_a.py sha256 integrity
    reads: STAGE_A_PY_EXPECTED_SHA256 (module-level constant) vs. sha256_file(STAGE_A_PY)
    aborts_on_mismatch: true
    fired_in_authorized_runs: false
  - name: N_JACK_BATCHES cross-check
    reads: measure.N_JACK_BATCHES (imported module attribute) vs. this task's own N_JACK_BATCHES constant
    aborts_on_mismatch: true
    fired_in_authorized_runs: false
  - name: L = N/n_e parameter sanity (RULE-2)
    reads: computed L vs. the declared N_2 constant
    aborts_on_mismatch: true
