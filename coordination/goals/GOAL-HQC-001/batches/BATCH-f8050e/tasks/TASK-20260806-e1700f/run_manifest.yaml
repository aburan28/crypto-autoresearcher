    reads: run-time-recomputed log2_A_k(k) table vs. design.md's frozen
      DESIGN_TABLE_LOG2_A constant, 1e-12 tolerance
    aborts_on_mismatch: true
    fired_in_authorized_runs: false
    checked_in: both main and detection runs
  - name: rejection-sampling max-rounds guard
    reads: per-round pending-block count vs. MAX_REJECTION_ROUNDS=1000
    aborts_on_mismatch: true
    fired_in_authorized_runs: false
    note: >-
      Max draws actually observed for any single block: 75 (main run),
      well under the 1000-round guard.
  - name: full-trial block-partition self-check (F == block_fail)
    reads: per-batch equality between the REAL decode_blocks output (on
      the FULL assembled 56-block trial) and the planted block_fail
      pattern
    aborts_on_mismatch: true
    batches_checked: 200 (main run) + 40 (detection run, Component B)
    fired: false

  deviations:
  - id: stray_closing_paren_self_caught
    kind: implementation_error, self-caught, fixed BEFORE any run (including
      the smoke runs)
    detail: >-
      The first draft of planted_arm_v3.py contained one extra, stray
      closing-paren-plus-comma line immediately after
      target_block_margin_stats' honesty_note kwarg inside comp_a's dict()
      construction in run_detection(). This was caught immediately by
      `python3 -m py_compile` (SyntaxError) before the script was ever
      executed on any data, and fixed by removing the stray line. No
      incorrect output was ever produced by this bug -- the script simply
      failed to parse. Recorded here rather than silently discarded, per
      AGENTS.md "record, never discard."
  - id: budget_allocation_is_this_tasks_own_choice
    kind: disclosed_scope_decision, not an error
    detail: >-
      The dispatch queue's task-level budget (1800 core-seconds, 3600
      wall-clock seconds, 2 authorized runs) does not itself prescribe a
      split between the main run and the detection run. This task chose
      the split documented in budget_allocation_this_tasks_own_split above
      and in design.md Section 6; both runs finished well under their
      individual allocations (67.2% and 34.3% of allocation respectively),
      so this choice did not bind in practice, but it is recorded as a
      disclosed scope decision this task made unilaterally, for the
      Coordinator/reviewers to assess if desired.
  - id: none_other
    kind: n/a
    detail: >-
      No other implementation errors, infrastructure failures, or protocol
      deviations occurred during this task. Both authorized runs completed
      on their first and only invocation with no truncation, no budget
      overrun, and no fail-closed check firing.

  validity:
    main_run:
      status: valid_measurement
      reason: >-
        All fail-closed gates passed (measure.py/stage_a.py integrity,
        planted-law reproduction, per-batch full-trial block-partition
        self-check on all 200 batches), T achieved (500,000) equals T
        planned, and the run stayed within its allocated core-second
        (671.6/1000) and wall-clock (671.5/1800) budget.
      result_summary: >-
        17/17 reported cells (k=2..18) recovered log2_Ahat_k within the
        adopted 3-jackknife-SE band of the closed-form planted value.
        Mean draws per accepted block: 2.382 (28,000,000 positions,
        66,708,617 total decode calls). A random 10,000-block sample of
        accepted content contained 10,000 distinct values (0 duplicates),
        confirming the ensemble is genuinely heterogeneous, not a
        disguised small fixed set (design.md Section 3.3).
    detection_run:
      status: valid_measurement
      reason: >-
        All fail-closed gates passed, neither Component A nor Component B
        was wall-clock-truncated, and the run stayed within its allocated
        core-second (274.7/800) and wall-clock (274.4/1500) budget.
      result_summary: >-
        Component A (T=2,000,000, positions 9/10): unconditional flip rate
        10.47% (paired_neighbor) / 10.46% (independent_foreign_bit);
        margin(<=4)-conditioned flip rate 20.12% / 20.11%. Component B
        (T=100,000, full ensemble): global-off-by-one flip rate 10.51%
        (over 5,600,000 position-level observations); last-block-only flip
        rate 10.69%. All four unconditional-style figures (two Component A
        variants, plus global and last-block from Component B) cluster
        tightly around ~10.5%; the margin-conditioned figure clusters
        around ~20.1%. See detection_rate_report.md for the full
        comparison against the Red Team's ~8.8%/~19.6% baselines.

