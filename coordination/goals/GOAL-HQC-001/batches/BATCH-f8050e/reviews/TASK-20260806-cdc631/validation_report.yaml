      committed JSON to the reported precision (e.g. paired_neighbor
      unconditional: k=209324, n=2000000 -> phat=0.104662,
      wilson95=[0.104239, 0.105087], exact match; global off-by-one:
      k=588492, n=5600000 -> phat=0.10508785714285715, exact match).
      No arithmetic error found in wilson_and_normal_ci.
  - id: fail_closed_check_independent_test
