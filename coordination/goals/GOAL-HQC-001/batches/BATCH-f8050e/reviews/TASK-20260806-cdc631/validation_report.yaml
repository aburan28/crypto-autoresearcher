  assessment_comparability_of_detection_rate_experiment: >-
    See compositional_confound_in_detection_rate_comparison above for the
    quantitative finding. Qualitative summary: the injected defect itself
    (shift_read_one_early: drop own last bit, gain a foreign bit at the
    front) is DEFINITIONALLY IDENTICAL to V2's and the Red Team's V2-batch
    operator -- no divergence found there. The `independent_foreign_bit`
    variant is explicitly constructed to replicate the Red Team's stated
    "random foreign bit" methodology, and the two foreign-bit variants
    (paired_neighbor vs independent_foreign_bit) agree with each other to
    within 0.002-0.008 percentage points, so the foreign-bit-source choice
    is NOT the source of the residual gap. The actual source, identified
    independently in this review, is that the TARGET-BLOCK population
    being tested is drawn from a different generative process than the
    Red Team's: V3's target-position content is REJECTION-SAMPLED to match
    an intended label whose marginal probability is fixed by the planted
    marking mechanism's q=9/28 (~32.1% fail), a quantity chosen to keep
    S_t's support at {17,18,19} for closed-form-estimator reasons and to
    order-match PS-R3's m=17 -- NOT chosen to match the natural
    Bernoulli(0.35) population's own decode-label frequency (~21.1% fail,
    independently confirmed here). Because fail-labeled and succeed-
    labeled content have markedly different flip probabilities (~21% vs
    ~5.6%, independently measured here) and markedly different margin
    distributions (mean ~4.3 vs ~12.4), ANY population-level "detection
    rate" is a weighted average that is highly sensitive to this label-
    mix choice, and V3's mix (32.1% fail) differs by a factor of ~1.5
    from the Red Team's natural mix (21.1% fail) purely because the two
    populations were never designed to share that particular statistic.
    The reweighting demonstration above shows this single compositional
    fact accounts for essentially the entire observed gap (both
    unconditional and margin-conditioned), leaving little room for a
    residual attributable to genuinely different "naturalness" of content
    given a label. This is NOT a computational error and does not
    indicate any artifact is invalid -- the reported 10.47%/20.12% figures
    are correctly computed for the population V3 actually draws from. It
    DOES mean the framing "closely tracks the Red Team's baseline
    (roughly 1.03-1.19x), confirming it" (run_manifest.yaml validity
    summary; snapshot commit message) overstates the epistemic weight of
    the numeric closeness: the closeness is substantially explained by
    the two label-mix choices (32.1% vs 21.1%) happening to be of similar
    order rather than by independent convergent measurement of one
    portable "natural detection rate." A cleaner, more informative, and
    already-latent result in this arm's own raw data -- not reported as
    such in detection_rate_report.md -- is the LABEL-CONDITIONAL flip
    rate (~21% given fail, ~5.6% given succeed), which does not depend on
    an arbitrary mixture choice and is the more defensible quantity to
    carry forward.

