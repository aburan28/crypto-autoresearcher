      mismatch...") and did not proceed to import. Independently
      confirms the fail-closed mechanism is real, not merely narrated.
  - id: reused_pipeline_hash_and_formula_audit
    description: >-
      Recomputed sha256 of the actual measure.py and stage_a.py files at
      their cited repository paths and compared against both the pinned
      constants in planted_arm_v3.py AND the pinned constants in V2's
      planted_arm_v2.py (diff check per task instructions item 5). Also
      read measure.py's comb_matrix/log2_A_from_hists source directly to
      confirm the formula matches what planted_arm_v3.py claims to reuse.
    result: >-
      measure.py sha256 = a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8;
      stage_a.py sha256 = 06a0a618432c00fe26c72ecf05a8d89489db61c5183931fdb76a378717681405.
      Both match the constants pinned in planted_arm_v3.py exactly, AND
      match the constants pinned in V2's planted_arm_v2.py exactly (byte
      identical pin values) -- no divergence in the reused pipeline
      between V2 and V3. log2_A_from_hists' docstring formula and actual
      code (lines 225-246) match the formula planted_arm_v3.py's own
      MEASUREMENT.estimator string claims to reuse.
  - id: compositional_confound_in_detection_rate_comparison
    description: >-
      The task instructions asked whether the detection-rate experiment's
      defect injection is "comparable in shape and strength" to the Red
      Team's V2-batch measurement. Rather than accepting the artifacts'
      own "candidate explanation" (accepted-content margin distribution
      is modestly closer to the boundary, mean 9.79 vs Red Team's 10.70)
      at face value, ran an independent decomposition: generated fresh,
      independently-seeded rejection-sampled content for position 10
      FORCED to label=fail and, separately, FORCED to label=succeed
      (200,000-300,000 trials each, using the script's own
      rejection_sample_content function with unused seeds), and measured
      the flip rate and margin distribution conditional on each label
      separately.
    result: >-
      FAIL-labeled accepted content: flip rate 20.9-21.9%, margin mean
      4.27-4.3 (close to boundary). SUCCEED-labeled accepted content:
      flip rate 5.6%, margin mean 12.4 (far from boundary). These two
      conditional rates are very different (roughly 4x apart). Reweighting
      these SAME two conditional rates by V3's planted label mix
      (q=9/28=32.14% fail, from the position-marking mechanism) reproduces
      the arm's measured pooled unconditional rate almost exactly:
      10.52% (reweighted) vs 10.47% (measured). Reweighting the SAME
      conditional rates by the NATURAL, UNCONDITIONED Bernoulli(0.35)
      population's own decode-label mix (independently re-measured here
      at 21.1-21.3% fail over 1,000,000 fresh draws, matching design.md
      Section 3.2's own calibration figure of 0.211079) reproduces the
      Red Team's baseline almost exactly: 8.82% (reweighted) vs 8.8%
      (Red Team). The SAME decomposition applied to the margin<=4-
      conditioned figures (20.22% reweighted by V3's mix vs 20.12%
      measured; 19.67% reweighted by the natural mix vs 19.6% Red Team)
      shows the identical pattern. THIS IS A MORE PRECISE AND MORE
      NEARLY COMPLETE EXPLANATION THAN THE ARTIFACTS' OWN "MARGIN-SHIFT,
      CANDIDATE EXPLANATION" LANGUAGE OFFERS: essentially the entire
      gap between this arm's ~10.5%/20.1% and the Red Team's ~8.8%/19.6%
      is explained by a single, identifiable, quantifiable compositional
      difference -- V3's target-position label mix (q=9/28, chosen to
      keep S_t's marginal law closed-form and order-matched to PS-R3's
      m=17, for reasons UNRELATED to the natural Bernoulli(0.35)
      population's own decode statistics) differs from the Red Team's
      unconditioned population's natural fail-rate (~21.1%). See
      "Assessment: comparability of the detection-rate experiment" below
      for what this means for the disposition judgement.

