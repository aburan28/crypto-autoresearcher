      SEED_PREFIX_MAIN/SEED_PREFIX_DETECTION's derived seeds), producing
      an independent 300-trial (16,800-block) batch outside the
      committed artifacts entirely.
    result: >-
      Self-check F==block_fail held on this fresh batch. S values were
      confined to {17,18,19} as predicted. A random 5,000-block sample
      from this independent batch had 5,000/5,000 distinct sha-dedup
      values (0 duplicates), matching the executor's own claimed
      zero-duplicate result on their 10,000-block sample. Eyeballed six
      raw 32-bit-prefix blocks directly: visibly non-repeating,
      Bernoulli(0.35)-consistent bit patterns (per-block popcounts
      42-52 out of 128, consistent with mean 44.8), not a small set of
      templates cycling. CONFIRMS the heterogeneity claim independently,
      not merely by re-citing the executor's own dedup count.
  - id: wilson_ci_recomputation
    description: >-
