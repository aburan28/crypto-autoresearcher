    data_quality_note: >-
      Per-stage figures are internally limited by the unresolved 2.6-2.8x
      stages_summed-vs-t_shard discrepancy (§2.1); the cost model
      compensates by using both as bounds. The full-pipeline
      cross-validation against three independent prior-batch measurements
      is strong. Not "good" because of the unresolved discrepancy; not
      "invalid" because the anomaly is fully disclosed, does not prevent
      an affordability conclusion at either bound, and no invariant or
      self-integrity check failed.
    requires_rerun: false
    requires_rerun_note: >-
      A rerun with decode_blocks warmed before stage3's timing, and/or
      randomized stage ordering across repeated trials, would help resolve
      section 2.1's anomaly, but is not required to answer this task's own
      question (affordability), since both bounds land inside the smallest
      requested budget tranche for the recommended PS-R3-scale objective.
      Left as an open item for whoever designs the follow-on experiment.
