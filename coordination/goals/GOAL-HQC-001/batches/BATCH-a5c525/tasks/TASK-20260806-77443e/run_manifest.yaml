      run failure -- both figures are reported, neither is discarded, and
      the cost model uses both as bounds rather than silently preferring
      the more favorable one.
  protocol_deviations:
    - >-
      The `stages_summed` vs `full_pipeline_via_real_t_shard` throughput
      discrepancy at every parameter set (§2.1 of cost_model.md), most
      pronounced at PS-R3 (788 vs 2,227 trials/core-second, a 2.8x gap).
      Reported in full, not resolved with high confidence, and both
      figures are retained and used as bounds in the cost table rather
      than one being discarded.
  anomalies:
    - >-
      This task's own `_t_shard`-measured PS-R3 throughput (2,227
      trials/core-second) is close to (within 3% of) three independent
      prior-batch measurements of the same quantity at real scale
      (Stage-A calibration: 2,061; BATCH-0a65c0 pre-run benchmark: 2,090;
      BATCH-0a65c0's actual T=1e7 production run: 2,168, all
      MEASURED (prior batch), cited in cost_model.md section 2.1) -- a
      genuinely useful cross-validation, recorded because it is
      informative, not because it was expected.
