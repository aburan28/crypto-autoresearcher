      - field: success and falsification criteria
        status: PRESENT
        evidence: >-
          success_criterion is five explicit conjuncts and says in terms that
          success is NOT "A17 confirmed" and NOT "A17 refuted".
          falsification_criterion is two-sided, scoped to the set and the order,
