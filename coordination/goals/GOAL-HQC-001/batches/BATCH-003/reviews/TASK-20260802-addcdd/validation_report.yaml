    the_failure_mode_that_looks_like_signal_RE_VERIFIED:
      what_i_did: >-
        I re-derived M1 = E[(S/n_e)^m] and the truth E[C(S,m)]/C(n_e,m) from the
        exact law of S, which I obtained by my own 2^20 brute force over each
        ensemble, in exact Fraction arithmetic, without importing oracle.py.
      on_an_independent_ensemble_A1:
        my_check_that_it_really_is_independent: mubar_3 = 300763/16777216 = q^3 EXACTLY, with q = 67/256
        M1_value_I_computed: 5447569/104857600
        ratio_to_truth_I_computed: 325228/112225 = 2.898000
        oracle_reported: 2.8979995544664736 (exact 325228/112225)
        match: EXACT
      on_a_negatively_dependent_ensemble_A3:
        ensemble: uniform fixed weight w = 6 on N = 20, threshold t = 1, n_e = 5
        my_check_that_it_really_is_negatively_dependent: >-
          mubar_3 = 9/1615 = 5.5728e-3 against q^3 = 4.0220e-2 with
          q = 332/969 -- a factor 7.2 BELOW independence.
        M1_value_I_computed: 6454/121125
        ratio_to_truth_I_computed: 6454/675 = 9.561481
        oracle_reported: 9.561481481481481 (exact 6454/675)
        match: EXACT
      significance: >-
        CONFIRMED AS A DETECTOR OF THE RIGHT THING. A with-replacement indexing
        bug reads as "positive dependence" by a factor 2.898 on an ensemble that
        is EXACTLY independent, and by a factor 9.561 on one that is strongly
        NEGATIVELY dependent -- i.e. it would invert the sign of the campaign's
        central question. Because F_j^2 = F_j, M1 >= truth always, so the bias is
        one-directional and always toward the answer the campaign is looking
        for. This is the single most valuable thing in the oracle, and it
        reproduces exactly.
    lemma_R_INDEPENDENTLY_RE_DERIVED:
      claim_under_test: >-
        The ring configurations are NOT subset-exchangeable; the acting group is
        the cyclic C_{n_e}, so mu_k is constant on CYCLIC ORBITS, and the count
        of distinct mu_2 values equals the cyclic-orbit count in the aligned
        case.
      what_i_did: >-
        I rebuilt configuration R2 from scratch: enumerated the fixed-weight
        products x*r_2 and r_1*y over F_2[X]/(X^16-1) as integer counts, XOR-
        convolved them with the weight-2 law of e by an integer Walsh-Hadamard
        transform, and computed every mu_2(J) as an exact Fraction over the
        denominator D = 541900800000.
      my_values:
        adjacent_pairs_01_12_23_03: 1482597/3920000
        opposite_pairs_02_13: 100175981/264600000
        oracle_report_values: identical to both
        distinct_mu_2_values: 2
        cyclic_orbits_of_2_subsets_of_Z_4: 2
        distinct_values_at_k_1_3_4: 1, 1, 1 (one orbit each)
      verdict: >-
        LEMMA R IS VERIFIED, NOT MERELY ASSERTED. The derivation is correct (the
        fixed-weight sets are shift-invariant and ring multiplication commutes
        with shift, so the law of e' is C_n-invariant, and B_{j+1} is the
        translate of B_j by n_2), and the exact rationals reproduce bit for bit
        from an implementation written in this session. The predecessor's
        unwritten "ring exchangeability" note is correctly replaced by something
        STRICTLY WEAKER, and it is not cited anywhere in the package.
    oracle_scale_limitation_confirmed:
      finding: >-
        The producer's own limitation is real and is stated prominently. On the
        only structurally faithful ensemble (the HQC-shaped ring on space (T))
        Route A reaches n = 19, N = 18, n_e = 3, n_2 = 6, m <= 3 (and n = 17,
        N = 16, n_e = 4, m <= 4), against HQC-1's n = 17669, n_e = 46,
        n_2 = 384, m = 16. Route B reaches n_e = 100, n_2 = 1024, N = 102400,
        m = 30 -- but ONLY for uniform-fixed-weight, block-exchangeable
        ensembles with a threshold block model, which is NOT HQC's etilde law
        and NOT HQC's decoder. Every one of the 16 configurations and reach
        demonstrations carries `not_an_hqc_quantity: true` with an explicit
        why_not. CONSEQUENCE: CTRL-ORACLE cannot validate an estimator anywhere
        near measurement scale on a faithful ensemble; what it validates is
        convention, combinatorics, code path, null construction and sign
        discrimination, which are parameter-independent. The contract's decision
        to make CTRL-ORACLE optional and non-blocking is therefore correct.
      also_recorded_by_the_producer: >-
        oracle_report section 8.5 item 4: at toy parameters the leading
        Bonferroni term is NOT tight (P[S>=3]/(C(4,3) mu_3) = 0.565 on R1,
        because q ~ 0.60), so the toy configurations do not reproduce the regime
        in which mu_m alone determines the tail, and no inference from these
        tails to that regime is licensed. That is the right disclosure and it is
        volunteered rather than extracted.

