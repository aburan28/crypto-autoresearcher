          a frozen published-value regression fixture bound to INV-REPRO, and an
          analysis directory deriving every number from the archived
          S-histograms alone).
        defect: DEF-3 below.
    defects:
      - id: DEF-1
        severity: high
        where: >-
          proposed_specification.yaml controls[0].construction (CTRL-BS);
          identical wording in feasibility_analysis.md section 10.1 and
          proposed_hypothesis.yaml proof_search_map.constructive_transforms[2].
        statement: >-
          THE STATED CONDITION ON THE BLOCK-SHUFFLE OFFSETS DOES NOT IMPLY THE
          PROPERTY THE PRIMARY NULL OBJECT CLAIMS. The construction reads:
          "pseudo-trial t takes block j's indicator from true trial (t + j*o_j)
          mod T, with offsets o_j pairwise distinct and coprime to T. Every pair
          of blocks in a pseudo-trial THEREFORE comes from DISTINCT INDEPENDENT
          true trials." The needed condition is that the SHIFTS j*o_j be
          pairwise distinct modulo T; pairwise distinctness of the o_j does not
          give it.
        counterexample_within_the_stated_condition: >-
          Take T = 1e8 = 2^8 * 5^8 and n_e = 46. Set o_1 = 3 and o_3 = 1. Both
          are pairwise distinct and both are coprime to T, so the stated
          condition holds. But 1*3 = 3 = 3*1, so blocks 1 and 3 of EVERY
          pseudo-trial are read from the SAME true trial and retain the full (T)
          dependence between them. Separately, block 0's source index is t for
          any o_0, since 0*o_0 = 0, so any j with j*o_j = 0 (mod T) collides
          with block 0.
        why_the_coprimality_clause_does_no_work: >-
          t -> t + s is a bijection of Z_T for EVERY s; coprimality to T is the
          condition for a MULTIPLICATIVE map t -> s*t to be a bijection. The
          clause appears to have been transplanted from a different
          construction, and it is not the condition the claim needs.
        consequence: >-
          Fail-safe in DIRECTION but not in cost: a colliding offset set makes
          CTRL-BS carry real (T) dependence, INV-NULL(a) or (d) fires, and the
          (T) measurement at that (set,k) is marked invalid_measurement and
          diagnosed as an "estimator or pipeline artifact" -- which would be a
          MISdiagnosis. It would not manufacture a false positive about A17; it
          would burn BATCH-004 and mislabel the reason.
        remedy: >-
          One line: require the shifts s_j := (j * o_j) mod T to be PAIRWISE
          DISTINCT (equivalently, choose s_j directly as n_e distinct residues),
          assert it at run start, and make a violation INV-INVARIANT /
          failed_implementation.
      - id: DEF-2
        severity: medium
        where: >-
          CTRL-BS what_it_establishes; feasibility_analysis.md section 10.1
          table; proposed_hypothesis.yaml predictions and proof_search_map.
        statement: >-
          "E[Ahat_k] = 1 EXACTLY, for every k, by construction" IS NOT TRUE AS
          WRITTEN. Ahat_k = mubarhat_k / qhat^k is a RATIO. What is exact is that
          the NUMERATOR is unbiased: E[mubarhat_k] = q^k on an i.i.d.-by-
          construction arm, by linearity, and E[qhat] = q. E[qhat^k] != q^k by
          Jensen, so E[Ahat_k] != 1 and E[log2 Ahat_k] != 0 exactly.
        magnitude_measured_by_me: >-
          Delta method at PS-R1, k = 16, T = 1e8: E[log2 Ahat_16] ~
          (-V_16 + 16*V_1)/(2 T ln2) with V_16 = 49437 (recomputed) and V_1 =
          (1-q)/(n_e q) = 0.07253, giving -3.57e-4 bits against a model
          SE_null of 0.0321 bits -- 1.1 percent of ONE sigma, against a 3-sigma
          gate. If CTRL-BS's effective sample size is smaller than T by a factor
          n_e (pseudo-trials share true trials), the offset grows to -1.6e-2
          bits against SE_null 0.218 -- still 7.5 percent of one sigma. SO THE
          ERROR IS IMMATERIAL IN MAGNITUDE. It is recorded because the contract
          asserts EXACTNESS in three places while simultaneously (metrics.
          primary.bias_treatment, feasibility section 1.3) applying a
          delta-method/jackknife ratio-bias correction, which is only needed if
          the exactness claim is false. The two statements cannot both stand.
        remedy: >-
          Restate as: E[mubarhat_k] = q^k exactly by construction; Ahat_k is a
          consistent ratio estimator whose O(1/T) bias is corrected by the
          declared delta-method/jackknife and is bounded by <value> at each
          (set,k). Nothing else in the contract changes.
      - id: DEF-3
        severity: medium
        where: >-
          feasibility_analysis.md section 9.1 (CALIB-M0 / CALIB-M0b);
          required_artifacts.fixed_artifacts.
        statement: >-
          THE MACHINE CONSTANTS UNDERLYING EVERY COST NUMBER ARE NOT ARCHIVED.
          `calib_m0.py` and `calib_m0b.py` are named as the commands that
          measured R_add = 4.0e9 elem/s, R_rng = 5.1e7 word/s and the t_sx
          shift-XOR table (5.12e-7 s at 5888 bits ... 1.75e-6 at 35851). Neither
          script nor its raw output exists anywhere in the repository (`find` over
          the whole tree and `git log --all` both return nothing), and neither is
          listed in required_artifacts.fixed_artifacts. The document labels them
          "(scratchpad)", so this is disclosed rather than concealed -- but
          docs/inventor-protocol.md section 6 step 4 asks that the
          reproducibility pointer be exercised rather than asserted, and
          AGENTS.md's artifact policy requires the exact command and raw
          machine-readable results to be retained.
        consequence: >-
          The 55785 core-second budget, the 3.4e3-vs-3.2e20 dup ladder costs and
          every trials/s/core figure are CONDITIONAL ON UNVERIFIABLE INPUTS. I
          verified that the cost MODEL composes those constants correctly (every
          stage total reproduces exactly), so the defect is in the inputs, not
          the arithmetic. It does not touch the T_req derivation, which is
          independent of machine speed.
        remedy: >-
          Add the two calibration scripts and their raw outputs to
          required_artifacts.fixed_artifacts and re-measure them inside the run,
          recording the measured throughput beside the modeled one (the contract
          already carries `throughput` as a secondary metric for exactly this).
    minor_internal_inconsistencies:
      - id: MIN-1
        statement: >-
          k_max at PS-R5 is 32 in independent_variables, in the parameter set
          table and in stage_B4, but 33 in tail_check TC-4. My independent
          derivation (largest k with T_req <= 2e7) gives 32.
      - id: MIN-2
        statement: >-
          feasibility section 5 prints HQC-1's q = p_i = 5.588e-4, but Prop
          6.1.4 evaluated at p* = 0.339788 gives 5.628165e-4 (log2 = -10.7950),
          which is the value the contract's OWN frozen fixture carries. Effect:
          T_req at HQC-1 falls from 3.401e41 to 3.033e41. Verdict unchanged
          ("infeasible by 33+ orders").
      - id: MIN-3
        statement: >-
          The (T) band for gammahat is quoted as "published-derived 0.61 - 0.74
          (section 4)" in three artifacts, but section 4 derives only 0.7249 -
          0.7355 from SPEC Table 10. I independently obtain 0.7369 / 0.7370 /
          0.7338 / 0.7262 at the four tail depths. The LOWER end 0.61 is not
          derivable from the cited section and is not shown anywhere in the
          frozen artifact set. Direction is conservative (a wider band is a
          weaker gate), but the citation does not support the number.
      - id: MIN-4
        statement: >-
          The C_samp column in feasibility section 9.2 is internally
          inconsistent: PS-A's 7.0e-6 matches the stated formula
          (2w + 2w_r + w_e)/R_rng exactly, while PS-R1/R3/R5's 3.3e-6 / 3.8e-6 /
          4.9e-6 correspond to dropping the w_e term (correct values 4.12e-6 /
          4.77e-6 / 6.26e-6). The C_trial TOTALS in the same table are computed
          from the FULL formula and are correct, so this is a display error in an
          intermediate column, not in the budget.
      - id: MIN-5
        statement: >-
          The queue's structured field budget.maximum_runs is 1 for both
          producers; "runs_authorized: 0" exists only in the prose constraint and
          in BATCH-003-OPENING.md section 4. Nothing was violated (see duty 6b),
          but the gate that this batch's integrity rests on is not encoded in any
          machine-checkable field.
    conclusion: >-
      ALL TEN section-4 fields are PRESENT, and several are specified past what
      the lifecycle asks for (a fixed cut ORDER, a null-first ordering rule, an
      explicit ban on adaptive stopping, a declared certificate.kind: none with
      its reason, and an explicit correspondence: NONE rather than a blank).
      DEF-1 is the one that must not be frozen as written: it is a false
      implication in the construction of the PRIMARY null object.

  # =======================================================================
  # DUTY 3 -- RIGHT-OBJECT AND RIGHT-SPACE GATES
  # =======================================================================
  duty_3_right_object_and_right_space:
    verdict: PASS
    right_object:
      finding: CONFIRMED. The estimand is the joint moment, not pairwise correlation.
      evidence: >-
        estimated_statistic.definition: mubar_k := E[C(S,k)]/C(n_e,k) =
        (1/C(n_e,k)) * sum over all C(n_e,k) index sets J of size k of
        P[AND_{j in J} F_j = 1]. primary_order: k = m = delta_e + 1, i.e. 16 /
        17 / 30 for the HQC-1 / HQC-3 / HQC-5 shapes.
        why_this_statistic_and_not_pairwise_correlation is stated explicitly and
        cites EV-HQC-6fd5b1 O-6 and DEC-20260802-9664c6 D-6.
        deliberate_exclusions[0] records "NO pairwise-correlation-only design",
        and deliberate_exclusions[2] records "NO reduction of m".
      exactness_check_by_me: >-
        The Jordan/Bonferroni inversion P[S>=m] = sum_{k>=m} (-1)^{k-m}
        C(k-1,m-1) C(n_e,k) mubar_k is standard and needs no distributional
        assumption; substituting mubar_k = q^k recovers Theorem 6.1's binomial
        tail. E[C(S,k)] = sum_{|J|=k} mu^(J) = C(n_e,k) mubar_k holds by
        LINEARITY ALONE. So the estimand and the assumption are the same object
        and the estimator is unbiased for it with NO exchangeability premise.
        The derivation is correct as written.
      order_reachability_independently_derived: >-
        Largest k with T_req <= the allocated T, recomputed by me: PS-A 3,
        PS-R1 16, PS-R3 22, PS-R5 32. PS-R1 therefore reaches k = m = 16
        EXACTLY, which is the point of the design.
    right_space:
      finding: CONFIRMED. Sampling is specified on (T); (M) is confined to NULL-M.
      evidence: >-
        inputs.space specifies true fixed-weight x, y (weight omega), r_1, r_2
        (omega_r), e (omega_e), all independent, with etilde the truncation of
        x*r_2 - r_1*y + e. how_the_sampler_guarantees_T[0]: "exactly omega
        DISTINCT positions per vector, by Floyd/partial-Fisher-Yates over the
        index range -- NO BERNOULLI STEP ANYWHERE IN THE SAMPLER".
        how_the_sampler_guarantees_T[2]: "there is no code path that can emit a
        coordinate-wise-independent vector into a (T) arm. The (M) generator
        lives in a separate module used only by NULL-M".
        deliberate_exclusions[1]: "NO sampling on space (M) in any (T) arm",
        citing DEC-20260802-9664c6 D-5.
    drift_detectors:
      finding: ALL FIVE PRESENT (D1..D5), each with an observable and a rule.
      D1: gammahat = Var(w(etilde))/(N phat (1-phat)); alarm on [0.95,1.05] at a (T) arm; PS-A additionally required in [0.55,0.85].
      D2: exact weights of x,y,r_1,r_2,e on EVERY trial; any deviation is failed_implementation.
      D3: hard support cap w(etilde) <= 2*omega*omega_r + omega_e, violated with probability ~1 on (M); violation is failed_implementation.
      D4: PS-A upper-tail quantiles of w(etilde) against SPEC Table 10; >3 weight units at >=2 of 4 tails invalidates the arm.
      D5: CTRL-REPLAY bit-identity of etilde re-derived by an independent code path; mismatch is failed_implementation.
    D1_gamma_derivation_checked_not_accepted:
      claim_under_test: "value_on_M: exactly 1"
      my_derivation: >-
        On (M), etilde ~ Bernoulli(p)^{tensor N} with independent coordinates,
        so w(etilde) ~ Binomial(N,p) and Var(w) = N p (1-p). Hence
        gamma = Var(w)/(N p (1-p)) = 1 IDENTICALLY, for every N and every p.
        The claim is therefore TRUE as a POPULATION identity, and it is true by
        construction rather than by calibration. As an ESTIMATOR gammahat is 1
        only up to sampling error, and the contract's operational test is
        correctly the estimator form: TC-5 requires gammahat on NULL-M to equal
        1 "within 3 SE", not exactly. The two statements are consistent, and
        the detector is well posed: D1 is a comparison of a quantity that is
        pinned to 1 on (M) against a (T) value bounded away from 1.
      T_side_band_check: >-
        I reproduced the (T)-side anchor independently from SPEC Table 10 at
        N = 17664, p* = 0.339788 (N p* = 6002.02, sigma_bin = 62.949): implied
        gamma = 0.7369 / 0.7370 / 0.7338 / 0.7262 at the 1e-3..1e-6 upper tails,
        against the producer's 0.7350 / 0.7355 / 0.7325 / 0.7249 -- agreement to
        0.3 percent. My Gaussian reproduction of Table 10's exactly-computable
        binomial column is 6196.5 / 6236.1 / 6270.5 / 6301.2 against the printed
        6197 / 6237 / 6272 / 6301, i.e. within 1.5 (the document claims 1.3;
        the residual is a continuity correction and is immaterial). THE UPPER END
        OF THE BAND IS THEREFORE VERIFIED; the lower end 0.61 is not (MIN-3).
      separation_adequacy: >-
        The gap between the (T) anchor (~0.735) and the (M) value (1.000) is
        large relative to any plausible sampling error at T >= 2e6, so D1 is a
        usable detector and not a formality.

  # =======================================================================
  # DUTY 4 -- NULL OBJECT AND PRE-REGISTERED INVALIDATION
  # =======================================================================
  duty_4_null_object_and_preregistered_invalidation:
    verdict: PASS_WITH_DEFECTS
    null_object_matched_shape:
      finding: >-
        THREE null arms, and the shape matching is genuine. CTRL-BS re-indexes
        the REAL (T) block indicators, so it matches n_e, the block length n_2,
        and -- crucially -- the EXACT EMPIRICAL MARGINAL BLOCK LAW rather than a
        modelled one. That is a stronger match than any parametric null can
        achieve and is the correct choice for primary. NULL-M matches n_e, n_2,
        dup, p* and the decoder on i.i.d. coordinates, where A_k = 1 is a
        theorem. NULL-P exercises the estimator arithmetic alone and, being
        independent of the sibling oracle, carries the estimator check
        UNCONDITIONALLY (so nothing in the contract depends on
        TASK-20260803-6f50df succeeding -- CTRL-ORACLE is explicitly optional
        and non-blocking and is referenced by no success, stopping or
        invalidation rule; I checked all three lists).
    iid_by_construction_claim:
      finding: NOT ESTABLISHED AS WRITTEN. See DEF-1.
      detail: >-
        The property CTRL-BS needs -- that within one pseudo-trial no two blocks
        read the same true trial -- follows from the shifts j*o_j being pairwise
        distinct mod T, NOT from the o_j being pairwise distinct and coprime to
        T. Counterexample inside the stated condition: o_1 = 3, o_3 = 1 gives
        1*3 = 3*1, so blocks 1 and 3 always share a source trial. A correct
        offset set exists trivially (any strictly increasing o_j works, since
        j*o_j is then strictly increasing), so this is a specification gap, not
        an unbuildable control.
    E_Ahat_equals_1_claim:
      finding: FALSE AS STATED; TRUE FOR THE NUMERATOR. See DEF-2 for the
        derivation and the measured magnitude (-3.6e-4 bits at PS-R1 k=16
        against a 0.0321-bit SE, i.e. 1.1 percent of one sigma).
    preregistration_of_INV_NULL:
      finding: CONFIRMED PRE-REGISTERED AND FALSIFIABLE.
      evidence: >-
        INV-NULL fixes BOTH thresholds numerically before any measurement
        exists: a significance threshold (|log2 Ahat_k| > 3 SE_null on CTRL-BS,
        NULL-M or NULL-P) and a MAGNITUDE threshold (CTRL-BS excess > 25 percent
        of the (T) excess). Its preregistration_note states in terms that the
        two numbers "may not be adjusted after data exist", and
        deliberate_exclusions[5] independently bans "post-hoc adjustment of the
        invalidation thresholds". Both are computable from the archived
        S-histograms and null_arms.json, so the rule is decidable by a third
        party without rerunning anything.
      consequence_direction: >-
        A firing null yields INVALID_MEASUREMENT, explicitly "never a negative
        observation, never evidence about A17". Under clause (d) the number is
        "PRINTED AND MARKED rather than discarded" -- correct under AGENTS.md
        rule 8.
      ordering_guard: >-
        ST-5 requires NULL-P and NULL-M to run BEFORE any (T) arm at each set,
        with the stated reason that "a null that fails after the (T) data exist
        invites motivated interpretation; ordering removes the opportunity".
        ST-3 fixes the budget cut order in advance and states that the null arms
        and instrument controls are NEVER cut. Both are the right shape.
    washed_out_null_recorded_as_uninformative:
      finding: CONFIRMED, IN THREE PLACES, AND NEVER AS EVIDENCE FOR A17.
      evidence: >-
        specification interpretation_of_a_null_result.uninformative_null_
        condition: "A NULL AT A SET WITH gammahat > 0.95 IS UNINFORMATIVE BY
        CONSTRUCTION, NOT EVIDENCE FOR A17: the reduction has destroyed the
        dependence rather than found it absent... the gammahat guard is
        NECESSARY, NOT SUFFICIENT." Repeated at feasibility section 10.3 and
        section 12.2. The same section lists four things a null is NOT
        interpretable as, including "evidence that A17 holds at HQC-1/3/5" and
        "evidence about order k = 16 at PS-A". ST-4 refuses to raise p* to buy
        reachability precisely because it would push toward wash-out.
    destroy_parameter_and_the_artifact_tell:
      finding: PRESENT AND CORRECTLY ORIENTED (docs/inventor-protocol.md section 3).
      evidence: >-
        dilution_tau is declared THE DESTROY PARAMETER with levels 0.994 /
        0.500 / 0.250, and the contract states what the measured quantity SHOULD
        do as it increases: "|log2 A_k| must be non-increasing as tau falls".
        HEUR-HQC-4's F4 makes non-decay a falsifier, and -- this is the part
        most designs omit -- the AMBIGUITY of a non-decay is resolved IN ADVANCE
        into three named mechanisms via CTRL-WBP (weight-mediated vs positional)
        and CTRL-BS (estimator artifact). So a quantity that fails to decay is
        pre-committed to a diagnosis rather than to an interpretation.
      caveat: >-
        Stage D is the FIRST arm cut under budget pressure (ST-3). If it is cut,
        the destroy-parameter ladder does not run at all and the artifact tell
        is untested. That is a declared trade, but it means the control the
        inventor protocol most cares about is also the most disposable one in
        this contract.

