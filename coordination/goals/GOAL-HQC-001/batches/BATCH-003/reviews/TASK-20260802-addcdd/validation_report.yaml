      to that statement in either deliverable.
    oracle: >-
      ONE discrepancy arose (mu_2(J) not constant over pairs in every ring
      configuration, i.e. subset_exchangeable false at k = 2) and it is RESOLVED
      by Lemma R, derived and then verified. I re-derived both the lemma and its
