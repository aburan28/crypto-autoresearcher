  # =======================================================================
  # CROSS-CUTTING CHECKS
  # =======================================================================
  proof_architecture_checks:
    - check: baseline fixture
      finding: PASS. The contract carries a FROZEN regression fixture bound to
        INV-REPRO (p* = 0.339788/0.361804/0.372489; log2 p_i(6.1.4) =
        -10.7950/-14.1374/-11.3240; Table 10's binomial column 6197/6237/6272/
        6301; implied gamma 0.7350/0.7355/0.7325/0.7249). I independently
        recomputed the p* row exactly (including finding HQC-5's omega = 131,
        omega_r = 149) and the p_i row to 4 decimal places from Props
        6.1.1/6.1.2/6.1.4, and reproduced the gamma row to 0.3 percent. The
        reproduction is SYMBOLIC/EXACT, not a curve that looks similar.
    - check: strictness witness
      finding: NOT APPLICABLE and correctly declared so. asymptotic_claim is
        null with a note; no improvement over a baseline is claimed. This is a
        measurement contract, not a complexity claim.
    - check: observation collisions
      finding: >-
        PASS, and unusually honest. proof_search_map.observation_collision
        records "THE COLLISION IS REAL AND IS NOT REMOVED BY THIS DESIGN" -- a law
        with A_2 = A_3 = 1 and A_16 >> 1 is indistinguishable from independence
        at PS-A. The design's response is to break the collision on a different
        axis (measure k = m directly at the reduced sets) and to declare the
        residual collision -- laws agreeing at m/lambda ~ 1 and differing at
        m/lambda ~ 621 -- as HEUR-HQC-3, the weakest link.
    - check: interface preservation
      finding: >-
        PASS. The only representation change (C(n_e,k) separate index-set
        probabilities -> the k-th binomial moment of S) is recorded with its gain
        (a factor C(n_e,k) ~ 1e12 in variance, unbiasedness without
        exchangeability, elimination of the outer decoder) and I verified it loses
        nothing: the empirical law of S is a sufficient statistic for every
        mubar_k.
    - check: method ceiling and nearby control
      finding: PASS. method_ceiling.strongest_certifiable_claim is stated
        verbatim and explicitly excludes any claim about HQC-1/3/5's own A_m,
        the published DFR, or security. THREE mandatory nearby-object controls
        are named (NULL-M on (M) where A_k = 1 is a theorem; CTRL-BS; NULL-P).
    - check: quantifier fidelity
      finding: PASS. quantifier_order is written out with explicit FOR EACH /
        THERE IS, distinguishes the per-set claim from HEUR-HQC-2's "common
        beta" claim, and fixes the dependence order (parameters frozen first,
        k range from the Stage-A qhat, estimates last).
  heuristic_validation_checks:
    - check: pre-registered prediction
      finding: PASS. preregistered_prediction.formula is log2 A_k = 0 for all k,
        sourced to SPEC Theorem 6.1 via A17, declared TWO-SIDED with the failure
        direction recorded as undetermined, with a frozen_note forbidding tuning
        and requiring a versioned protocol_amendment for any change. The
        MODELED secondary effect size (HEUR-HQC-2's C(k,2)*beta/ln2) is
        explicitly labelled secondary and "not a neutral prior", and a departure
        from it "is never reported as a departure from A17". That separation is
        the correct one.
    - check: sample integrity
      finding: >-
        PASS AT DESIGN TIME. Sample size is DERIVED (T_req = max(T_prec, T_stab))
        rather than asserted, seeds and the derivation string are in the contract,
        the S-histogram is archived as the sufficient statistic so every number
        recomputes without rerunning, and the analysis directory is required to
        derive every reported number from the archived histograms alone. Not yet
        exercisable: no samples exist.
    - check: correspondence validity
      finding: >-
        PASS, by explicit declaration of ABSENCE. scale_relevance. correspondence:
        "NONE. There is no sampling correspondence that reaches cryptographic
        scale here... Recorded as null rather than left blank so no reader infers
        a correspondence that does not exist." That is the right treatment, and it
        is the honest contrast with the Wesolowski exemplar, where a Deuring
        correspondence does the work.
    - check: scale binding
      finding: >-
        PASS. tier: toy, with the justification stating that PS-A uses HQC-1's
        parameters verbatim but reaches only k = 2,3 while the reduced arms reach
        k = m at a rarity ratio up to 3900x smaller and a non-deployed dup.
        AGENTS.md rule 7 is cited and the ceiling is described as MORE binding for
        a standardized algorithm, not less.
  cost_model_checks:
    - check: declared unit
      finding: PASS. CORE-SECONDS throughout, with wall-clock at 4 cores stated
        separately, cpu_hours stated separately, and an authoritative-total note
        warning that the rounded per-stage cpu_hours will not re-sum to the last
        digit. Memory is reported alongside time at every stage.
    - check: optimistic assumptions flagged
      finding: PASS. SIX are enumerated in both artifacts (the 2x contingency
        may be insufficient with the 5x consequence costed at 1.4e5 core-s;
        perfect 4-core scaling assumed and not measured; q modeled not measured
        with ST-4 as the pre-registered response; T_stab's threshold of 30 is a
        judgement with the sensitivity to 100 costed; sizing uses the NULL
        variance so the true variance under dependence is larger; gamma = 0.735
        used only for the modeled effect size and never for sizing).
    - check: memory beside time
      finding: PASS. Per-stage peak RSS declared, with the working set derived
        (one ring buffer <= 4.4 kB, one block array, one histogram) and the 2 GB
        cap described as a 2000-fold over-provision.
    - check: cost bookkeeping as per-attempt x inverse success probability
      finding: >-
        PASS IN THE FORM THIS PROBLEM TAKES. There is no success probability to
        invert -- this is a fixed-T measurement, not a repeated attempt. The
        structurally analogous quantity IS carried and IS the headline: T_req ~
        1/P[S >= m], i.e. the sample count is the inverse of the rare-event
        probability being estimated, and the total is T_req x per-trial cost. I
        verified that composition at every rung of the dup ladder.
    - check: unverifiable inputs
      finding: FAIL. DEF-3 -- the measured machine constants are not archived.

