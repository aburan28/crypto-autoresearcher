    - It does NOT say the measurement will succeed, or that log2 A_m will or
      will not depart from zero at any parameter set.
    - It does NOT endorse or contest any claim about HQC's decoding failure
      rate, its published DFR model, or its security, in either direction.
    - It does NOT authorize promotion, a hypothesis-status change, or the
      creation of H-HQC-18d1b4 or EXP-HQC-982268. Those are Coordinator acts.
    - It does NOT penalise the INFEASIBLE verdict. That verdict's derivation is
