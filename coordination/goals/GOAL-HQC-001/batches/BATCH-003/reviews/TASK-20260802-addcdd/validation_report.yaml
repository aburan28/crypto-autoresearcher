          a computable (T) law; the global weight w(e') is "the only obvious
          candidate and is not obviously sufficient") and an explicit "NOT
          DESIGNED HERE AND NOT CLAIMED TO WORK".
        assessment: GENUINE. Concrete, falsifiable, and honestly discounted.
      - id: OPEN-2
        item: no intermediate rung between dup = 1 and dup in {3,5}
        status: OPEN
        successor_named: YES -- HEUR-HQC-6's F6 within-PS-A consistency test is
          named as the only check this budget affords, and the genuine test is
          named as dup = 2 at a much smaller n_e, "a different contract with a
          different estimand".
        assessment: GENUINE, and correctly refuses to promise an interpolation
          the arithmetic forbids.
      - id: OPEN-3
        item: the deployed biased sampler SampleFixedWeightVect never exercised (A22)
        status: OPEN
        successor_named: YES -- a paired arm at PS-R1 running the deployed
          sampler and comparing log2 Ahat_k.
        assessment: GENUINE. Bounded and directly executable.
      - id: OPEN-4
        item: a17_characterization.md Lemma L1 claims exchangeability where its
          cyclic argument yields only equal marginals and translation invariance
        status: RESOLVED
        my_check: >-
          THE RESOLUTION IS SOUND AND I VERIFIED IT. E[C(S,k)] = sum_{|J|=k}
          mu^(J) = C(n_e,k) mubar_k by LINEARITY alone, and the Jordan inversion
          needs no distributional assumption, so the estimand mubar_k and the
          estimator's unbiasedness require NO exchangeability. If exchangeability
          does hold, mubar_k = mu_k and no number changes, so the correction
          strictly generalises the inherited derivation. The design additionally
          adds mu2_by_block_distance as a secondary metric to test the question
          EMPIRICALLY. This is a resolution, not a re-flag.
        assessment: GENUINELY RESOLVED.
      - id: OPEN-5
        item: X9 / A20 -- whether SPEC 6.2.2's "if and only if" bounded-distance
          failure event is the event section 6.1 computes
        status: OPEN
        successor_named: WEAKLY -- "a separate formal item, arguably PRIOR to
          this one because it decides WHICH probability Theorem 6.1 bounds",
          pointing at a17_characterization.md section 6.2.
        assessment: >-
          THE WEAKEST OF THE FIVE. It names the question and its home document
          and states that nothing in this contract touches it, but unlike
          OPEN-1/2/3 it does not name a concrete test, arm or contract that
          would settle it. It also concedes the item may be LOGICALLY PRIOR to
          the whole measurement -- which is a stronger admission than the
          treatment it receives. Recommend the Coordinator either open a named
          successor task for X9/A20 or record explicitly why the measurement is
          worth making before X9 is settled.
