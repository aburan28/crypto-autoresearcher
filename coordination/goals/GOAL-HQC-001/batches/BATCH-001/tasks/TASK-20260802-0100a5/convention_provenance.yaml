    calibration_self_audit: >-
      Two items in this document point AGAINST the convenience of a
      memory-charging convention and are recorded so a red team can weigh
      whether the set as a whole was calibrated toward a desired outcome:
      CHARGE-D-U7-REOPTIMIZATION forbids re-costing a published parameter point
      and calling it the charged cost (which would overstate the charged
      optimum), and CHARGE-E-AMORTIZATION-PERMITTED requires the convention to
