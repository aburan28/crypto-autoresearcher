      retire the convention entirely for being decision-irrelevant. This audit
      is this agent's self-report and is not a substitute for an independent
      check.

  red_team_entry_points:
    - >-
      U4b (locality exemption) is the clause that can be abused to make any
      algorithm cheap. Attack it first; it is uncited and this agent says so.
    - >-
      The cube-root access model is transplanted from an isogeny artifact whose
      own upper-bound half is a modelling assumption and whose underlying wiring
      derivation this program has never re-derived. The transplant to a
      code-based setting is asserted, not argued from code-specific evidence.
    - >-
      CHARGE-E rests on an abstract-only entry (KN-LIT-7565). If that abstract
      misrepresents the paper, the strongest stated reason for charging
      per-iteration linear algebra weakens to the two internal analogy entries
      (KN-TECH-008, KN-TECH-035), which are about index calculus, not ISD.
    - >-
      The U1 bit/gate unit is uncited. A reviewer who believes the right unit is
      a word or a vector operation should say so now, because U1 propagates into
      every figure.
    - >-
      HOOK-F1's single-machine sweep cannot confirm U4 at cryptographic scale.
      Check that no later record treats a passed F1 as validation of the model
      rather than as failure-to-falsify at measurable scales.

  what_this_provenance_file_does_not_establish:
    - That the convention is correct. It records where each rule came from, not that any rule is right.
    - That the cited sources are correct. Several are abstract-level and are flagged per item.
    - That the convention is complete. An ISD algorithm with a cost component not in section 3 would be charged by default under "silence is not exemption", and that default has never been tested.
    - Any statement about HQC's or SDitH's security, parameters, or published estimates. None is made anywhere in either deliverable.
