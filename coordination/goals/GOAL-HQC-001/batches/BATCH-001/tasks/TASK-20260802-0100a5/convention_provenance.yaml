convention_provenance:
  convention: ISD-FC-2026
  convention_version: 1
  status: proposed
  companion_artifact: >-
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md
  task_id: TASK-20260802-0100a5
  goal_id: GOAL-HQC-001
  also_binds_if_adopted: GOAL-SDITH-001
  batch_id: BATCH-001
  role: executor
  produced_at: '2026-08-02'
  produced_at_precision: >-
    Date only. No wall-clock timestamp is recorded because none was captured;
    a fabricated time would violate AGENTS.md rule 9.
  repo_commit_at_authoring: 3ec55418c2129708d832b45cf8426e22daf0f11b
  working_tree_state: >-
    Clean apart from this task's own untracked directory
    (coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/). Confirmed with
    read-only `git status --porcelain`; no git command in this session mutated
    state.
  runs_executed: 0
  experiment_performed: false
  hypothesis_created: false
  security_claim_made: false
  official_state_changed: false
  certificate:
    kind: none
    reason: >-
      Document-production task with runs_authorized 0. Nothing is claimed to
      have been solved, decoded, or measured, so there is no witness to certify.
      Stated explicitly rather than left blank, per docs/claims-and-verification.md.
  claim_tier:
    value: not_applicable
    reason: >-
      This artifact is not an evidence record and asserts nothing about any
      tested instance. A figure later produced under this convention carries the
      tier its own instances allow, under docs/claims-and-verification.md
      unchanged. RQ-HQC-001 and RQ-SDITH-001 both declare a toy claim-tier
      ceiling; nothing here moves it.

  scheme_independence_self_check:
    hqc_parameter_numbers_present: false
    sdith_parameter_numbers_present: false
    method: >-
      No parameter set, code length, dimension, weight, security level, NIST
      category, or bit-count for either scheme appears in either deliverable.
      Symbolic placeholders (n, k, w, p, l, M, A, L, e, N, R, B) are used with
      no committed values. Model exponents (M^{1/3}, M^{2/3}, n^{2/3}) are
      properties of the cost model, not scheme parameters.
    deliberate_omission: >-
      KN-LIT-7565 is cited in the convention for its METHODOLOGICAL content only
      (that Gaussian elimination is not lower-order in the sublinear-weight
      regime; that pivot reuse across iterations is a mechanism; that a gate
      model with memory reported beside time is the reporting shape). Its
      scheme-specific bit-level figures and its security-level statement were
      deliberately NOT quoted, in either deliverable, because they are HQC
      parameter numbers and because quoting them would make the convention look
      calibrated toward a target.
    no_verdict_on_published_estimates: >-
      Neither deliverable asserts that any published security estimate is right
      or wrong. The only assertion made about published figures is the weak,
      basis-level one: a figure computed on a different accounting basis is not
      directly comparable to one computed on this basis.

  inference:
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    model_verified: false
    model_verified_note: >-
      No `python3 -m orchestration.adapter doctor --probe` run was performed in
      this session, so the resolved identifier is recorded as configuration
      rather than probe-verified.
    fallback_used: true
    fallback_reason: >-
      Policy aliases in orchestration/model-policies.yaml do not resolve under
      this Claude Code harness. Subagent frontmatter in .claude/agents/ supports
      only Claude models, so all subagents run `model: inherit` and execute on
      the session model. Recorded per CLAUDE.md "Model policy note" and
      BATCH-001-OPENING.md section 7; never silently substituted.
    degraded_allowed: false
    degraded_requirements: []
    independent_session: true
    independent_model: false
    quorum_admissibility: >-
      Not admissible toward an AGENTS.md rule 13 closure quorum. Every task in
      BATCH-001 resolves to the same model, so reviews of this artifact are
      independent sessions on one backend, not pairwise-distinct models.

  # ---------------------------------------------------------------------------
  # PER-ITEM PROVENANCE
  #
  # is_this_agents_choice is STRICT: it is true whenever the rule TEXT is not
  # stated in any cited source, even where a cited source inspired it. The
  # inspiring source is then recorded under derived_from. This is the labelling
  # that lets a red team check whether an item was derived or calibrated.
  # ---------------------------------------------------------------------------
  items:

    - id: CONV-NAME
      convention_ref: header, section 0
      statement: >-
        The convention is named ISD-FC-2026, versioned, and superseded rather
        than edited; it is declared PROPOSED and non-binding until a Coordinator
        ledger archive adopts it.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md (naming pattern SSI-FC-2026)
        - AGENTS.md rules 4, 14, 15 (immutability, random suffixes, remap is a last resort)
        - TASK-20260802-0100a5 handoff constraint 5 ("This document is a PROPOSED convention")
      rests_on_unread_source: false
      note: >-
        The name follows an existing program pattern; the choice to mint one at
        all, and to version it, is this agent's.

    - id: CONV-PARENT
      convention_ref: header, section 1
      statement: >-
        ISD-FC-2026 is the code-based instantiation of the Wiener full-cost
        family, sibling to SSI-FC-2026, so that all three of the program's
        cost-model fronts share one parent.
      is_this_agents_choice: false
      sources:
        - KN-LIT-094 (confidence established, citation_verified read)
        - KN-TECH-035
        - KN-TECH-044
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md section 2
      derived_from: []
      rests_on_unread_source: false
      note: >-
        KN-TECH-044 states the motivating principle verbatim: the corpus
        previously charged memory on one side and not the other, and "the two
        halves of the program should not use different accounting."

    - id: MOTIVE-COORDINATION
      convention_ref: section 1
      statement: >-
        One convention is required because both code-based goals must produce a
        memory-charged ISD baseline and were warned not to derive two.
      is_this_agents_choice: false
      sources:
        - ledger/goals/GOAL-HQC-001.yaml next_action_history[0]
        - ledger/goals/GOAL-SDITH-001.yaml next_action
        - ledger/questions/RQ-SDITH-001.yaml scope.methods[3]
        - ledger/questions/RQ-HQC-001.yaml constraints[1]
        - ledger/questions/RQ-SDITH-001.yaml constraints[1]
      derived_from: []
      rests_on_unread_source: false
      note: >-
        Both RQ records already require memory, preprocessing, and verification
        charged, in identical wording. What they do not state is a rate; that
        gap is this document's whole subject.

    - id: MOTIVE-RECOSTING-RISK
      convention_ref: section 1
      statement: >-
        A cost-model choice alone can move a headline security figure by more
        than an algorithmic advance does; the cost model is part of the claim.
      is_this_agents_choice: false
      sources:
        - KN-TECH-040 ("In lattice cryptanalysis the cost model is part of the claim"; a headline result driven substantially by re-costing)
        - KN-TECH-051 (a cost-model convention moving a security level with no algorithmic disagreement)
      derived_from: []
      rests_on_unread_source: false
      note: >-
        Both are lattice/isogeny observations. Their transfer to the code-based
        setting is an EXPECTATION stated as such in the convention, not a
        measured fact about code-based estimates.

    - id: BASIS-ZOO
      convention_ref: section 2.1 table B1-B5
      statement: >-
        A five-row taxonomy of accounting bases (RAM operations, bit operations,
        logic gates, gates plus access penalty, full cost) against which the
        program's choice is positioned.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - KN-TECH-040 (the analogous "cost-model zoo" for lattices, including gate-count-versus-operations)
        - KN-LIT-094 (row B5)
        - KN-LIT-7565 (row B3, "consistent logic-gate cost model") [ABSTRACT ONLY]
        - KN-LIT-6923 (row B4) [ABSTRACT ONLY, and see CHARGE-B-ESTIMATOR-RECOLLECTION]
      rests_on_unread_source: true
      note: >-
        No source in this corpus tabulates the bases in circulation for ISD.
        The table is this agent's assembly and should be treated as indicative
        of the KINDS of divergence, not as an exhaustive or authoritative
        catalogue - the same caveat KN-TECH-040 places on its own list.

    - id: U1-UNIT
      convention_ref: section 2.2 U1
      statement: >-
        The unit of work is one gate-op (one 2-input Boolean gate on one
        bit-pair). No free word parallelism: a length-L vector XOR costs L
        gate-ops; an elimination pass of R row operations on length-L rows costs
        R*L.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - KN-LIT-7565 ("consistent logic-gate cost model") [ABSTRACT ONLY]
        - KN-TECH-040 (gate counts versus operations as a documented divergence axis)
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W3 (the pattern of fixing one unit of work and absorbing cofactors uniformly)
      rests_on_unread_source: true
      note: >-
        THE CHOICE OF A BIT/GATE UNIT OVER A WORD OR VECTOR UNIT IS THIS AGENT'S.
        No corpus record prescribes it for ISD. The stated reason - that a
        vector-operation unit silently buys a factor equal to the vector length -
        is arithmetic, but the judgement that this is a leading source of silent
        divergence between published ISD figures is this agent's expectation
        transplanted from the lattice experience in KN-TECH-040, and is NOT a
        measured fact.

    - id: U2-COMPOSITION
      convention_ref: section 2.2 U2
      statement: >-
        Cost is full cost FC = H * T_wall, hardware quantity multiplied by the
        wall-clock time it is occupied. Memory is hardware.
      is_this_agents_choice: false
      sources:
        - KN-LIT-094 (Wiener, confidence established, citation_verified read; the full-cost definition and the BSGS n^{2/3+o(1)} consequence were read directly)
        - KN-TECH-035
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W1
      derived_from: []
      rests_on_unread_source: false
      note: >-
        KN-LIT-094's own entry records that the three-dimensional wiring
        derivation and the per-attack derivations from Section 3 onward were NOT
        re-derived by this program, and the o(1) constants were not extracted.
        The composition rule is used; the derivation behind it is relayed.

    - id: U3-DUAL-REPORTING
      convention_ref: section 2.2 U3
      statement: >-
        Every figure is reported as the triple (G, M, FC): an uncharged gate-op
        count for comparability with published figures, the memory volume, and
        the full cost as the program's decision basis. Quoting one leg alone is
        a violation.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - docs/claims-and-verification.md, asymptotic-form honesty ("memory complexity stated beside time, always")
        - docs/target-result-profile.md A8 (concrete-cost table with time and memory for the new result AND the previous best, under matched accounting)
        - KN-TECH-040 ("Any program statement comparing lattice costs must name the convention on both sides")
        - KN-TECH-044 (step counts acceptable for parameter selection, not for one-beats-another claims)
      rests_on_unread_source: false
      note: >-
        The DUAL-LEG MECHANISM IS THIS AGENT'S DESIGN. The corpus requires
        memory beside time and requires naming the convention; it does not
        require computing the same attack under two compositions. The purpose is
        specific: it lets this program place a figure beside a published one
        without asserting the published one is right or wrong, which the handoff
        forbids.

    - id: RATIONALE-COMPARISON
      convention_ref: section 2.3 point 2
      statement: >-
        The program's code-based questions are comparison questions, and an
        uncharged step count is explicitly recorded as inadequate for
        comparison even though it is adequate for parameter selection.
      is_this_agents_choice: false
      sources:
        - KN-TECH-044 (quoted)
        - KN-LIT-094 (Wiener's own converse caution, quoted in KN-TECH-035)
        - ledger/questions/RQ-SDITH-001.yaml decision_target
        - ledger/questions/RQ-HQC-001.yaml scope.targets[2]
      derived_from: []
      rests_on_unread_source: false
      note: ''

    - id: RATIONALE-MEMORY-HEAVY-ISD
      convention_ref: section 2.3 point 3
      statement: >-
        Modern ISD improvements are list-based (nearest-neighbour search,
        explicitly or implicitly), so a zero-price for list memory
        systematically favours exactly the family whose advantage is bought with
        memory.
      is_this_agents_choice: false
      sources:
        - KN-LIT-6923 [ABSTRACT-LEVEL ONLY - see note]
      derived_from:
        - KN-TECH-035 (the same argument made for index-calculus relation storage)
      rests_on_unread_source: true
      note: >-
        KN-LIT-6923 is filed citation_verified read, but its own "Not verified
        here" section states it was bulk-seeded on 2026-07-24 from the first two
        pages of a local PDF with heuristically parsed metadata, and its year,
        venue, and all identifiers are null. Its local PDF is NOT present in
        this repository (no downloads/ directory in the working tree), so the
        text could not be re-read. Treat the quoted claim as abstract-level.
        The SECOND half of the item - that zero-priced memory biases the
        comparison toward list-based algorithms - is this agent's inference from
        it, by direct analogy with KN-TECH-035's index-calculus argument.

    - id: RATIONALE-NO-ENDORSEMENT
      convention_ref: section 2.3 point 4, section 0
      statement: >-
        Retaining the uncharged G leg preserves comparability with published
        figures without asserting those figures right or wrong.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - TASK-20260802-0100a5 handoff constraint 3 (do not assert either scheme's published estimate is right or wrong)
      rests_on_unread_source: false
      note: >-
        The constraint is imposed by the handoff; the mechanism for satisfying
        it while still producing a usable number is this agent's.

    - id: CHARGE-A-VERDICT
      convention_ref: section 3(a)
      statement: 'Memory volume: CHARGED. It enters H in FC = H * T_wall.'
      is_this_agents_choice: false
      sources:
        - KN-LIT-094
        - KN-TECH-035
        - KN-TECH-044
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W1, W4
        - ledger/questions/RQ-HQC-001.yaml constraints[1] and RQ-SDITH-001.yaml constraints[1] (memory charged)
      derived_from: []
      rests_on_unread_source: false
      note: ''

    - id: CHARGE-A-RATE-OCCUPANCY
      convention_ref: section 3(a)
      statement: >-
        Rate: H = N*h_proc + M, charged over the OCCUPANCY INTERVAL (first write
        to last read), not as a peak allocation counted once; early release is
        credited only if the release point is declared.
      is_this_agents_choice: true
      sources:
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W4 ("table storage for its whole occupancy")
      derived_from:
        - KN-LIT-094 (full cost is hardware times the time it is OCCUPIED)
      rests_on_unread_source: false
      note: >-
        The occupancy principle is cited. The specific decomposition
        H = N*h_proc + M, the first-write-to-last-read interval definition, and
        the declared-release credit are this agent's formulation.

    - id: CHARGE-A-COMPETING
      convention_ref: section 3(a)
      statement: >-
        Competing conventions named: free-and-unbounded; report-beside-cost
        (a (time, memory) pair that is published but not composed); memory cap
        as a feasibility cliff.
      is_this_agents_choice: true
      sources:
        - KN-LIT-7565 (records the report-beside-cost shape: a time change and a memory change reported separately under one gate model) [ABSTRACT ONLY]
      derived_from:
        - KN-TECH-044 (min-space variants buying space at a worse time exponent - a partial, inconsistent charging practice)
      rests_on_unread_source: true
      note: >-
        The "memory cap as a cliff" row has no source in this corpus and is this
        agent's own characterisation.

    - id: CHARGE-B-VERDICT
      convention_ref: section 3(b)
      statement: 'Memory ACCESS cost: CHARGED, under a named model.'
      is_this_agents_choice: false
      sources:
        - ledger/questions/RQ-SDITH-001.yaml scope.methods[3] ("explicit memory-access cost model, since ISD comparisons are routinely won by ignoring it")
        - KN-LIT-094
        - KN-TECH-035
        - KN-TECH-044 (the 2^{0.292b} headline "charges nothing for the memory or its access pattern")
      derived_from: []
      rests_on_unread_source: false
      note: >-
        RQ-SDITH-001 already mandates an explicit memory-access cost model. This
        item supplies the model it mandates; it does not invent the requirement.

    - id: CHARGE-B-U4-MODEL
      convention_ref: section 3(b) U4
      statement: >-
        Three-dimensional bisection-limited access: A random accesses into an
        M-cell store need T >= A / Theta(M^{2/3}), i.e. Theta(M^{1/3}) per
        unbatched random access. Lower bound is a bisection-bandwidth argument;
        the matching upper bound is a declared modelling assumption.
      is_this_agents_choice: false
      sources:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md section 2 W2 (identical model, stated with the same lower-bound/upper-bound split)
        - KN-TECH-035 (relays Wiener's three-dimensional wiring answer)
        - KN-LIT-094
      derived_from: []
      rests_on_unread_source: false
      note: >-
        Taken over verbatim in substance from an existing program artifact. That
        artifact's own status matters: SSI-FC-2026 W2 derives the lower-bound
        half in place and takes the matching upper bound as an assumption, and
        the underlying Wiener wiring derivation was NOT re-derived by this
        program (KN-LIT-094 entry, "Not verified here"). The transplant to the
        code-based setting is this agent's, but the model is the program's.

    - id: CHARGE-B-WHY-CUBE-ROOT
      convention_ref: section 3(b), three numbered reasons
      statement: >-
        Cube-root is adopted over flat, logarithmic, and square-root because
        (1) it is the model the program already committed to on two other
        fronts, (2) it has an in-repository reproduction check, and (3) three
        spatial dimensions is the parent model's premise.
      is_this_agents_choice: false
      sources:
        - KN-TECH-035, KN-TECH-044, KN-TECH-050 (reasons 1 and 3)
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/red_team_report.yaml objection F1 (reason 2)
      derived_from: []
      rests_on_unread_source: false
      note: >-
        Reason 2 is the strongest and is worth stating precisely: that red-team
        report records that with the access charge applied SYMMETRICALLY to
        writes as well as reads, the full-cost optimum for a memory-heavy
        meet-in-the-middle lands at the textbook table balance and reproduces
        Wiener's published n^{2/3+o(1)} figure. That is a check performed inside
        this repository by an independent session, not a claim originating here.

    - id: CHARGE-B-ALT-MODEL-MENU
      convention_ref: section 3(b) four-row table
      statement: >-
        Four candidate access models are named and dispositioned: flat (kept
        only as the G leg), logarithmic (sensitivity row), square-root
        (sensitivity row), cube-root (adopted).
      is_this_agents_choice: true
      sources: []
      derived_from:
        - KN-TECH-035 and KN-TECH-044 (flat versus charged)
        - CHARGE-B-ESTIMATOR-RECOLLECTION (unverified)
      rests_on_unread_source: false
      note: >-
        NO SOURCE IN THIS CORPUS TABULATES THESE FOUR MODELS. The menu, the
        dispositions, and the decision to keep flat as a mandatory reported leg
        rather than discard it are all this agent's.

    - id: CHARGE-B-ESTIMATOR-RECOLLECTION
      convention_ref: section 3(b), final paragraph
      statement: >-
        This agent recalls that published syndrome-decoding cost estimators
        expose a memory-access-cost option with several settings.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - KN-LIT-6923 (an estimator entry exists in the corpus) [ABSTRACT ONLY]
      rests_on_unread_source: true
      unverified_recollection: true
      note: >-
        EXPLICITLY UNVERIFIED AND NOT A CITATION. The corpus entry is
        abstract-level and its local PDF is absent from the working tree, so the
        claim could not be checked against any text available here. It is
        recorded as a follow-up verification target. NO RULE IN THE CONVENTION
        DEPENDS ON IT; if it is false, nothing above changes.

    - id: CHARGE-B-U4b-LOCALITY-EXEMPTION
      convention_ref: section 3(b) U4b
      statement: >-
        A DECLARED sequential/blocked read of B consecutive cells is charged
        Theta(B) plus one random access; the pattern must be EXHIBITED (concrete
        addressing order) or the accesses are charged as random; data-dependent
        addressing is random by default.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W2 (mesh routing as the achievability mechanism)
      rests_on_unread_source: false
      note: >-
        ENTIRELY THIS AGENT'S. It is also flagged in the convention itself as
        the most abusable clause and as the clause falsification hook F3 is most
        likely to fire on. A red team should attack this item first.

    - id: CHARGE-B-U5-SYMMETRY
      convention_ref: section 3(b) U5
      statement: >-
        The access charge applies to every touch - reads and writes, build and
        query phases - and identically to every algorithm in a comparison. An
        asymmetric charge voids the comparison. Every figure carries an
        asymmetric_charge_audit, and "none found" by the producer is not a
        finding until an independent reviewer confirms it.
      is_this_agents_choice: false
      sources:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md section 2 preamble ("Any asymmetric charge invalidates the comparison") - the cross-ALGORITHM half
        - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/red_team_report.yaml objection F1 - the within-algorithm half (lookups charged, insertions not; exponent withdrawn)
        - coordination/goals/GOAL-SSI-001/.../baseline_recommendation.yaml (the asymmetric_charge_audit field, and F1's finding that the producer's "NONE FOUND" was wrong)
      derived_from: []
      rests_on_unread_source: false
      note: >-
        This is the single most load-bearing transplant in the document, and it
        is fully sourced: the program has already made this exact error once,
        an independent session caught it, and the correction moved the number
        AGAINST the producer's own conclusion. The requirement that the audit be
        independently checked rather than self-declared follows directly from
        that episode.

    - id: CHARGE-C-VERDICT-AND-RATE
      convention_ref: section 3(c)
      statement: >-
        Precomputation: CHARGED at full rate. Preprocessing time enters T_wall;
        stored advice enters H for its occupancy. No exemption for work done
        before the attack starts.
      is_this_agents_choice: false
      sources:
        - KN-TECH-035 ("stored advice is hardware occupied over time, and the program's rule that preprocessing must be charged follows from this model")
        - ledger/questions/RQ-HQC-001.yaml constraints[1], RQ-SDITH-001.yaml constraints[1] (preprocessing charged)
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W4
      derived_from: []
      rests_on_unread_source: false
      note: ''

    - id: CHARGE-C-U6-AMORTIZATION
      convention_ref: section 3(c) U6
      statement: >-
        A cost may be amortized only against a DECLARED and COUNTED quantity N;
        the amortized and unamortized single-instance figures are both reported,
        and N is justified against the attack scenario being costed.
      is_this_agents_choice: true
      sources: []
      derived_from:
        - KN-TECH-035 (preprocessing/advice must be charged)
        - docs/target-result-profile.md A8 (optimistic assumptions flagged)
      rests_on_unread_source: false
      note: >-
        THIS AGENT'S. The corpus requires preprocessing to be charged; it does
        not state a rule about amortization denominators. The phrase "a ratio
        with a hidden denominator" is this agent's.

    - id: CHARGE-D-VERDICT-AND-RATE
      convention_ref: section 3(d)
      statement: >-
        List construction and storage: CHARGED. Construction = per-element
        gate-ops + L write accesses under U4/U5; storage = L*e cells over the
        occupancy interval; query = comparison gate-ops + probe accesses;
        sorting/hashing = at least Theta(L) random accesses, not a free
        reorganization.
      is_this_agents_choice: true
      sources:
        - coordination/goals/GOAL-SSI-001/.../derivation_note.md section 2 W4 ("table construction; table storage for its whole occupancy; every memory access")
        - coordination/goals/GOAL-SSI-001/.../reviews/TASK-20260728-007 F1 (the concrete demonstration that unbuilt-table charging voids a figure, including the sorting/hashing routing argument)
      derived_from:
        - KN-TECH-035 (factor-base and relation-set storage must be charged)
      rests_on_unread_source: false
      note: >-
        The VERDICT is cited (SSI W4 charges construction, storage and access).
