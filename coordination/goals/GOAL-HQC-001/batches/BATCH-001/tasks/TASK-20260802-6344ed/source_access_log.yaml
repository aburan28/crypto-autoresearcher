# ---------------------------------------------------------------------------
# What is being sought, declared before searching so that a source found later
# cannot be retro-fitted into the target list.
# ---------------------------------------------------------------------------
sources_sought:
  - key: S1
    what: >-
      The HQC specification document itself (the current specification of
      Hamming Quasi-Cyclic as submitted to / selected by NIST), because it is
      the primary carrier of the analytic decoding-failure-rate model for the
      concatenated Reed-Muller / Reed-Solomon decoder.
    why_load_bearing: >-
      GOAL-HQC-001's whole first lane is "independently re-derive its analytic
      decoding-failure-rate model". RQ-HQC-001.constraints forbid designing an
      experiment until the primary sources are filed. BATCH-001-OPENING.md
      section 3 records that the specification is absent from the corpus.
  - key: S2
    what: >-
      The primary DFR-analysis literature for HQC's concatenated RM/RS decoder
      -- whichever paper(s) the specification itself derives its DFR bound
      from, identified from the specification rather than from memory.
    why_load_bearing: >-
      The specification may state the model and cite its derivation elsewhere.
      A transcription that stops at the specification's statement and does not
      name the derivation source would leave the assumption list incomplete.
  - key: S3
    what: >-
      Guo-Johansson, "A New Decryption Failure Attack against HQC" -- already
      in the corpus as KN-LIT-2141 with year/venue/identifiers/url all null.
    why_load_bearing: >-
      Named in the handoff's DEDUP duty. This is the DFR-attack lane's existing
      weak record; the acquisition target here is bibliographic repair, not a
      new entry.
  - key: S4
    what: >-
      Carrier-Hatey-Luzzi-Tillich, iacr:2026/1498 -- already in the corpus as
      KN-LIT-7565 at citation_verified: web (abstract only).
    why_load_bearing: >-
      Named in the handoff's DEDUP duty; the ISD lane's existing record. In
      scope for this task only to the extent of recording a dedup verdict; the
      ISD costing convention itself belongs to TASK-20260802-0100a5.

