        where:
          - >-
            dfr_model_transcription.md assumption A21, whose source column cites
            "Theorem 6.3's third summand" — a term that lives inside the block
            marked [EXTRACTION-DAMAGED]
          - >-
            proposed_kn_lit_entries.md PROP-S1, "Key claims (as reported)",
            bullet 5, which states the content of Eq. (13) — "the IND-CCA2
            advantage bound for HQC-KEM contains the term (q_RO + q_D)*delta
            alongside the salt/hash terms and twice the two DQCSD advantages"
        the_inconsistency: >-
          PROP-S1 both makes that claim in its Key claims section and disclaims
          it in its "Not verified here" section ("Equation (13) ... carries no
          claim"). A package cannot both assert and disclaim the same content.
      why_severity_is_low_and_measured_not_asserted:
        - >-
          This session rendered SPEC p.44 and read Eq. (13) directly. The
          transcription's rendering is EXACT, including the two denominators the
          producer flagged as not image-confirmed. The [EXTRACTION-DAMAGED]
          marker is CONSERVATIVE — over-cautious, not under-cautious. Nothing
          false propagated.
