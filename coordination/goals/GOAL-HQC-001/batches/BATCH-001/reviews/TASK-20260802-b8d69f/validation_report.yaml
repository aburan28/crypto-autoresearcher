        principle catch something a text-layer check cannot.
    - F4_not_run: >-
        The convention's own mandatory pre-use reproduction audit (F4, the
        baby-step giant-step n^{2/3+o(1)} check) has NOT been executed. Until it
        is, the convention's correctness on an instance whose answer is already
        known is unestablished.
