          + Adv_3-DQCSD-PT) ..."). The transcription itself quotes part of that
          passage in section 5.3. So the content does not in fact require the
          damaged block.
      recommended_disposition: >-
        A one-line correction at filing time, recorded as a superseding note
        rather than an edit (the artifacts are frozen and immutable): PROP-S1's
        bullet 5 should cite SPEC section 6.2.3 p.45 as its source instead of
        Theorem 6.3 / Eq. (13), and A21 should do the same. This is bookkeeping
        hygiene, not a content repair. It does not block admission.

