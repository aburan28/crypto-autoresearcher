  verdict: ADMIT_WITH_QUALIFICATIONS
  verdict_maps_to_contract_status: passed
  verdict_rationale: >-
    All five named duties are answered with measured values. Receipt integrity is
    clean on every checkable dimension: 2 of 2 commits reachable with the
    declared parent, 8 of 8 declared paths matching the commits exactly with
    zero extras and zero omissions, 8 of 8 sha256 values independently
    recomputed with zero mismatches, and both receipts committed inside the
    commits they describe. Transcription fidelity is established by measurement
    rather than assurance: both primary PDFs were re-acquired byte-identically by
    this independent session, all three claimed counts (23 / 11 / 10) recount
    exactly, the single [EXTRACTION-DAMAGED] marking is confirmed as the only
    one, and 25 spot-checks against the re-acquired text found zero
    discrepancies, with all 10 published-text anomalies independently confirmed
    to be real features of the source rather than transcription artefacts. The
    dedup census reproduces exactly and every negative dedup claim holds. Every
    proposed citation_verified level matches what was actually obtained, and the
    KN-LIT-2141 upgrade correctly declines to claim `read`. The convention passes
    its own completion gate on all five items, including the hard gate: zero HQC
    or SDitH parameter numbers, verified by exhaustive integer enumeration.
    The qualifications are (1) a narrow internal inconsistency in which PROP-S1
    both states and disclaims the content of the [EXTRACTION-DAMAGED] Eq. (13) —
    mitigated to low severity because this session verified that rendering is
    exact and that the claim has an independent undamaged source at SPEC p.45,
    and correctable by a one-line superseding note at filing; and (2) a set of
    four minor metadata corrections listed above. Neither blocks admission.

  what_a_passing_verdict_does_NOT_establish:
    - It does NOT confirm that HQC's analytic decoding-failure-rate model is correct, optimistic, or pessimistic. The model was transcribed, not tested. No decoding trial was run and no failure rate was measured by anyone in this batch.
    - It does NOT confirm that assumptions A1-A23 hold, that A5 (coordinate independence of e') is justified, or that A6's claimed upper-bound direction is right. It confirms only that those are what the primary text says.
    - It does NOT confirm that ISD-FC-2026 is the right convention. Twenty-three of its 47 items are the producing agent's own choice, its F4 reproduction audit has not been run, and the convention remains PROPOSED, binding on nothing until a Coordinator ledger archive adopts it by name and version.
    - It does NOT support any HQC security claim in either direction, and it moves no claim tier. RQ-HQC-001's toy ceiling is untouched.
    - It does NOT authorize filing anything into knowledge/. The proposed KN-LIT entries remain proposals.
    - It does NOT resolve whether KN-LIT-2141's citation_verified level, or the levels of the other 7456 read-level entries, are supportable. That is a Coordinator decision on a corpus-integrity matter far wider than this goal.
    - It establishes only that these artifacts are frozen, hash-bound, faithfully transcribed from primary sources this session independently re-acquired, and internally consistent with their own declared gates.

