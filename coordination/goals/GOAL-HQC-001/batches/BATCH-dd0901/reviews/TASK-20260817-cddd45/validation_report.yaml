      anchor. Compared with BATCH-91929e, whose DEV-1 anchor a validator had to
      expose as an unverifiable self-attestation, this is the correct handling of
      the same limitation: disclosed up front, in the artifacts, before review.
    one_gap_in_the_disclosure: >-
      Accurate but incomplete in one respect that matters. design.md section 2.5
      correctly notes that the comparators' SE inputs "are themselves printed to
      six decimals", but the producer never uses that fact - and it is exactly the
      fact that settles the question the gate could not. Those six-decimal SE
      values uniquely identify the arrays and corroborate the mapping for both P
      cells. Combined with mapping_was_adjusted_or_searched: false, the receipt
      leaves the discriminating question unanswered where a zero-cost answer was
      available in the record it was already citing.
  - id: D7
    severity: informational
    who: producer (self-declared)
    finding: >-
      THE PRODUCER'S RESOLVED MODEL DIFFERS FROM THE COMMITTED BINDING TARGET, and
      the disclosure is COMPLETE AND ACCURATE. It self-reports claude-opus-5[1m]
      while orchestration/model-bindings.yaml binds executor-implementation on the
      anthropic backend to claude-sonnet-5 - which I confirmed by reading that
      file for reference only. The producer records the two in SEPARATE manifest
      fields, states plainly that they differ, and does not present the binding
      target as if it were what ran. The requested policy executor-implementation
      was honoured; policy_fallback_used and degraded are both false. This is a
      session-level model divergence, correctly surfaced rather than reconciled
      away, and it is not a policy fallback.
    note: >-
      The divergence is upward in capability, which does not damage the
      measurements - Part A is deterministic arithmetic and Part B is seeded
      numpy, both fully reproduced here by an independent implementation. It
      remains a binding-hygiene item for the Coordinator, and it means producer
      and both reviewers share one model family (see correlated_judgement_disclosure).

  # ----------------------------------------------------------------------
  limitations:
  - >-
    SCOPE. Everything verified here is TOY tier and confined to PS-R3 reduced
    parameters (n=7187, n_e=56, n_2=128, dup=1, N=7168, k in 2..26), one defect
    class (V3), one injection point, shards 5000/6000/8001/8002, and the trial
    ranges named in the sources. NOTHING here bears on HQC IND-CCA security, its
    decoding-failure rate, assumption A17 or A5, or any standardized parameter
    set. What was measured is the behaviour of an instrument this program built.
  - >-
    THE PROCEDURAL ASYMMETRY IS REAL AND UNRESOLVED. In every historical cell the
    two T-points come from DIFFERENT tasks in different processes; in all four
    fresh cells both come from ONE call in ONE process. Any fresh-versus-
    historical comparison at any k inherits this confound. The producer declared
    it; I confirm it and do not consider it discharged.
  - >-
    THE SAME-T NOISE HANDLE IS A SCALE FROM n = 2 CONTRASTS, NOT A DISTRIBUTION.
    D_RMS(5) = 0.124859 is recomputed and correct, but no confidence interval is
    computable from it and none is claimed. It enters predicate (i) only through
    max(D_RMS(5), 0.25), where 0.25 binds.
  - >-
    THE 2-POINT LOCAL EXPONENT IS DOMINATED. Wherever this report characterises
    it, dominated_by is: "4-rung OLS in log-log on identical data, SD 0.234334
    against 0.700666, a 2.99x noise reduction at zero cost". This is recorded
    verbatim as the batch requires; a null here would be a fabrication under
    AGENTS.md rule 9.
  - >-
    MY OWN MONTE CARLO IS FINITE. The coupling verification used 4,000,000 draws
    per arm; agreement is to within roughly 1 MC-SE on the mean and the agreement
    probability, which confirms the construction but does not certify the
    producer's specific 75,000,000-draw realization beyond the moments checked.
  - >-
    THE COUPLED-VERSUS-UNCOUPLED BAND COMPARISON IS UNPAIRED. The two drivers
    derive seeds differently, so the widening is a comparison of independent MC
    realizations at R=200. The effect (+23% to +41%) far exceeds that noise, but
    it is not a paired measurement.
  - >-
    I DID NOT RE-RUN THE PRODUCER'S PART B END TO END. I recomputed its bands
    from the committed replicate CSV and verified the draw analytically and by my
    own independent Monte Carlo. A full re-execution would additionally test the
    seeding path's reproducibility, which I did not exercise.
  - >-
    SINGLE-FAMILY REVIEW CHAIN. Producer and both reviewers self-report the same
    model family; agreement is correlated judgement, not distinct-model
    corroboration.

