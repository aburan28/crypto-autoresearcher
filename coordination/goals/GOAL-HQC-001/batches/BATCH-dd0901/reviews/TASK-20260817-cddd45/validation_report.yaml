  - control: SD-RATIO SELF-CHECK against the analytic factors 1.000/1.000/1.000/2.000/1.414
    result: RECOMPUTED AND CONFIRMED, WITH A DIAGNOSIS THE PRODUCER DID NOT SUPPLY
    detail: >-
      My independent ratios reproduce the producer's exactly and reproduce the
      four >10% discrepancies it reported as findings: k=10 regime_main_effect
      15.81%, k=10 shard_main_effect 13.54%, k=10 replication_delta 11.16%, k=17
      regime_main_effect 10.67%. The producer reported them and did not smooth
      them, which is what the batch required. THE DIAGNOSIS, WHICH IS THIS
      REVIEWER'S: three of the four are an artifact of the BATCH'S OWN ANALYTIC
      FACTOR BEING MIS-SPECIFIED, not of the null. The factors 1.000 (main
      effects) and 2.000 (interaction) hold only if the alpha variance is EQUAL
      across the two rung pairs, but the main effects mix rung pair P
      (5000->10000) with rung pair N (10000->20000), and the measured variances
      are not equal: at k=10, sd_P = 0.30719/0.28005 against sd_N =
      0.27134/0.24611. Under the measured variances the correct main-effect
      factor is 0.9018 at k=10 (not 1.000) and 0.9499 at k=17, against measured
      0.8419/0.8646 and 0.8933/0.9201 - shrinking the discrepancies from 15.81%,
      13.54% and 10.67% to roughly 6.6%, 4.1% and 6.0%. The fourth, k=10
      replication_delta, CANNOT be explained that way because it differences two
      cells from the same rung pair and is exactly sqrt(2) regardless; I settled
      it by a 4,000-resample nonparametric bootstrap of the ratio, which gives a
      95% CI of [1.3756, 1.7943] containing 1.41421 - so it is Monte Carlo error
      at R=200, not a defect. Only replication_delta is a factor-free self-check;
      the other three carry an unstated homoscedasticity assumption.
  - control: BLINDNESS TEST 1 - SHAPE
    result: >-
      GENUINE TEST. FAILS at k=5 and k=10; PASSES at k=17. VERIFIED INDEPENDENTLY.
    detail: >-
      I recomputed the real-cell denominator myself from committed arrays as
      se_unpaired/se_paired over the eight fresh windows: k=5 range
      [8.545049, 11.126178]; k=10 [4.937997, 11.905557]; k=17 [2.338019,
      28.691278]. The k=17 range reproduces batch.yaml's pre-declared [2.338,
      28.691] and the full eight values match its pre-declared list (2.338,
      5.604, 6.694, 6.843, 15.266, 15.662, 17.260, 28.691) exactly, so the test's
      denominator is the object frozen in advance and was not moved. Against
      those ranges the coupled null's pooled median is 5.143413 at k=5 (OUTSIDE
      -> FAIL), 4.301179 at k=10 (OUTSIDE -> FAIL) and 2.826520 at k=17 (INSIDE
      -> PASS). SHAPE FAILS AT k=5, WHICH IS THE ADJUDICATION k FIXED IN ADVANCE
      BY batch.yaml.
    is_it_a_genuine_test: >-
      YES, with a stated limit. It can pass and it can fail, it did both across
      k, its threshold was frozen before the data existed, and it is arithmetic
      on quantities neither side controls. It is NOT tautological. Two honest
      qualifications. (i) IT TESTS MODEL ADEQUACY, NOT BAND CALIBRATION. A FAIL
      says this parametric family does not reach the real object's pairing gain;
      it does NOT say the band is too narrow. Here the coupled band is in fact
      WIDER than its uncoupled predecessor, so the failure is not evidence of
      anti-conservatism, and the batch's own O12 observation - that fixing the
      shape makes the diagnostic look worse, not better - is reproduced.
      (ii) THE DENOMINATOR IS A RANGE OVER EIGHT WINDOWS, NOT A DISTRIBUTION, so
      it has no tolerance for sampling error and a marginal miss could be
      spurious. This miss is not marginal: 5.143 against a lower bound of 8.545
      at k=5. The FAIL stands.
  - control: BLINDNESS TEST 2 - POWER
    result: >-
      PASSES ALL FIVE CONTRASTS AT k=5 (and all five at k=10); at k=17 four pass
      and the interaction FAILS with MDE 4.4850 > 3.702. VERIFIED INDEPENDENTLY.
    detail: >-
