  decidability_of_the_frozen_falsification_route:
    what_i_was_asked: >-
      Whether the frozen route - which requires all four historical cells while
      only two are available - CAN be decided from this run. Establishing
      decidability, not deciding it.
    i_apply_no_rule_and_name_no_branch: true
    finding: >-
      THE ROUTE'S HISTORICAL PREDICATE IS DECIDABLE FROM WHAT THIS RUN DELIVERED,
      AND ITS TRUTH VALUE DOES NOT DEPEND ON THE TWO WITHHELD CELLS. The reason is
      structural: batch.yaml defines dev_set(k) as a MAX over the four cells'
      |alpha - 0.5|, and a maximum is non-decreasing in its argument set, so the
      maximum over the available cells is a LOWER BOUND on the maximum over all
      four. The two available historical cells give |0.224446 - 0.5| = 0.275554
      (shard 8001) and |0.410684 - 0.5| = 0.089316 (shard 8002), so the lower
      bound is 0.275554. Predicate (i)'s frozen threshold is max(D_RMS(5), 0.25),
      and I recompute D_RMS(5) = 0.124859 independently, so the threshold is
      0.25. The lower bound 0.275554 ALREADY EXCEEDS 0.25. Predicate (i)'s truth
      value for the historical set is therefore fixed by available data alone -
      no possible values of the two withheld cells could change it. Independently,
      my own recomputation of the withheld cells shows the argmax is itself an
      available cell (their deviations at k=5 are 0.199384 and 0.134578, both
      below 0.275554), so dev_hist(5) = 0.275554 exactly. Predicate (ii)'s
      comparator dev_hist(17) = 2.336098 is computable from the k=17 values,
      which are committed for all four cells including the withheld ones.
    the_limit_of_that_finding: >-
      This is an arithmetic fact about the rule's predicates, NOT a branch
      selection and NOT a reading. It says only that the rule need not be silent
      for want of the two withheld k=5 values. It does NOT resolve the separate
      question the archive must resolve: whether Branch I's clause "no other
      branch may be read from an affected cell" forbids reading a set-level
      predicate whose maximum happens to be attained at an unaffected cell. That
      is a question about the rule's own scope, it is genuinely open on the text,
      and it belongs to the ledger archive. I record the arithmetic and stop.
    what_would_make_it_undecidable: >-
      Stated for completeness: had the available cells' maximum fallen BELOW the
      0.25 threshold, the predicate would have been genuinely undetermined,
      because the withheld cells could have pushed the maximum either side. The
      route is decidable here by the specific numbers, not by construction.

