      1.8344, 4.4850 (FAIL), 3.1766. Reproduces the producer exactly.
    is_it_a_genuine_test: >-
      YES IN PRINCIPLE - it is pure arithmetic on the band, cannot be
      tautological, and it demonstrably fired at k=17. BUT IT IS NEARLY
      NON-DISCRIMINATING AT k=5, AND THAT MATTERS BECAUSE k=5 IS THE ADJUDICATION
      k. The null band narrows sharply as k falls, so at k=5 the widest MDE is
      0.6994 against a fixed 3.702 threshold - a factor of 5.3 of headroom. The
      threshold is calibrated to the historical exponent spread, which is a k=17
      scale quantity, while the band it is applied to is a k=5 quantity. At k=5
      POWER could realistically only fail if the band were roughly five times
      wider than measured. So a POWER PASS at k=5 should not be read as evidence
      that the control is sensitive there; it is close to guaranteed by the
      k-dependence of the band against a k-independent threshold. THE BINDING
      TEST AT k=5 IS SHAPE, AND SHAPE FAILS.
