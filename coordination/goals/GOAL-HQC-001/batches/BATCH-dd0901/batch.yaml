      se_lo_source: TASK-20260809-a79e4f matched_pair_results.json -> stage_1.matched_pair.per_shard.shard_6000
      T_hi: 10000
      se_hi_source: TASK-20260814-8bbdd2 matched_pair_repeat_results.json -> per_shard.shard_6000
    shard_8001_regime_N:
      T_lo: 10000
      se_lo_source: TASK-20260809-a79e4f matched_pair_results.json -> stage_2.matched_pair.per_shard.shard_8001
      T_hi: 20000
      se_hi_source: TASK-20260815-e61cca shard_8001_8002_discard_prefix_results.json -> per_shard.shard_8001
    shard_8002_regime_N:
