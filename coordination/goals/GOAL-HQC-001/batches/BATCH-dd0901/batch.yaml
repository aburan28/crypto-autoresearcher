  reconstruction_is_a_hypothesis_and_is_gated_fail_closed: >-
    THE MAPPING ABOVE IS THIS COORDINATOR'S RECONSTRUCTION FROM THE COMMITTED
    RECORDS AND IS NOT ASSERTED AS FACT. It is gated: the executor must, for each
    of the four cells, compute alpha_17 = -[log(se_hi[k=17]) - log(se_lo[k=17])]
    / [log(T_hi) - log(T_lo)] from the two arrays it actually selected and assert
    it reproduces that cell's COMMITTED k=17 value to within 1e-12 absolute
    BEFORE reporting any low-k value from it. This costs nothing, proves the
    array selection is the right one, and converts a Coordinator assumption into
    a checked fact. IF ANY OF THE FOUR FAILS, DO NOT ADJUST THE MAPPING SILENTLY:
    report the failure, the selected arrays, the computed value and the committed
    value, and treat that cell as a DATA-AVAILABILITY OUTCOME per the reading
    rule's Branch I. This is the same fail-closed discipline that carried Arm A
    and Arm B's disjointness proofs in BATCH-91929e.
  known_procedural_asymmetry_that_must_be_declared: >-
    In every HISTORICAL cell the two T-points come from DIFFERENT tasks in
    DIFFERENT processes, and in all four FRESH cells both T-points are sliced
    from ONE call in ONE process (EV-HQC-e458ef O4, and the limitation
    TASK-20260817-c603c0 was required to declare). The historical cells
    additionally differ from each other in jackknife batch count reported
    alongside their arrays. The executor must REPORT, per array it reads, the
    n_batches recorded beside it, and must name the procedural asymmetry as a
    standing limitation of any fresh-vs-historical comparison rather than
    letting a reviewer find it.

the_same_T_noise_handle_is_the_batch_s_band_free_yardstick: >-
  EV-HQC-e458ef O8 measured it and DEC-20260817-2b638b rationale item (e) made it
  load-bearing: windows P2 [35000:45000) and N1 [45000:55000) are both T=10,000,
  same shard, same jackknife batch size 50, same procedure, same call, disjoint
  indices, so anything differing between them is sampling realization BY
  CONSTRUCTION. D_shard(k) := |log2( se_paired(P2, k) / se_paired(N1, k) )| is
  therefore a distribution-free noise scale for alpha at order k, on the REAL
  object, requiring no parametric model and no control. At k=17 it is 4.063
  (shard 5000) and 1.895 (shard 8002), RMS 3.170; at k=2 it is 0.061 and 0.105,
  RMS 0.086. THIS BATCH REPORTS IT AT EVERY EVALUABLE k AND USES IT AS THE
  PRIMARY YARDSTICK OF ITS READING RULE, precisely because its validity is NOT
  what this batch's control is testing. Its limit is stated and not softened: it
  is a SCALE FROM n = 2 CONTRASTS, not a distribution; no confidence interval is
  computable from it and none is claimed (EV-HQC-e458ef boundaries).

the_coupled_null_control:
  why_it_is_re_run: >-
    BATCH-91929e's null object drew its two arms from INDEPENDENT RNG streams
    (null_object_control.py:256-257) while the real pair shares 55 of 56 blocks
    on every trial -- which that batch's own F[:, 0:n_e-1] gate proved over
    4,950,000 elements. Measured se_unpaired/se_paired was 0.9965 in the null
    against 2.338 to 28.691 in the eight real cells: in that null the paired
    estimator IS the unpaired estimator and the 2.3x-28.7x pairing gain that
    defines the real instrument was set to 1. Both reviewers independently built
    corrected coupled nulls by DIFFERENT constructions and both found the bands
    WIDER (+22% Red Team; +36% and +26% Validator). Fixing the shape makes the
    diagnostic look worse, not better (EV-HQC-e458ef O12). Neither reviewer-built
    band was pre-registered and both reviewers stated they must not adjudicate
    anything; this batch pre-registers one.
  construction: >-
    base ~ Binomial(n_e - 1 = 55, p); arm_i = base + Bernoulli_i(p) with an
    INDEPENDENT Bernoulli per arm. The marginal law of each arm is therefore
    Binomial(56, p) EXACTLY, identical to BATCH-91929e's arms, so any change in
    the band is attributable to the coupling alone and to nothing else. This is
    the Red Team's construction, adopted verbatim from DEC-20260817-2b638b's
    next_actions, and it mirrors the real pair's structure: 55 shared blocks plus
    one block that the V3 defect can flip.
  p_is_frozen_at_the_prior_batch_s_calibrated_value: >-
    p = 0.31923392857142857, the value TASK-20260817-c603c0 calibrated by
    matching E[S] to the real undefected arm at T=10,000 on shard 5000 window P2,
    and which the Validator reproduced exactly. IT IS NOT RE-CALIBRATED HERE.
    Re-calibrating would confound the coupling change with a calibration change
    and would break the controlled comparison this batch exists to make.
  ladder_and_replicates: >-
    T in {5000, 10000, 20000, 40000} (batch sizes 25, 50, 100, 200), R = 200
    replicates per rung -- identical to BATCH-91929e, again so that the ONLY
    difference is the coupling. Rung pair 5000->10000 is regime P and rung pair
    10000->20000 is regime N, exactly the two contested regimes.
  k_values: >-
    k = 5 and k = 10 as the directive names, PLUS k = 17 as a REQUIRED
    COMPARISON POINT. The k=17 addition is declared here as a STRICT ADDITION and
    NOT a substitution: without it the coupled band cannot be compared against
    BATCH-91929e's uncoupled band (widths 2.788 and 3.188) or against the two
    reviewer-built coupled bands (3.398; 3.508 and 4.326), and the comparison is
    the only way to show the coupling change did what it was meant to do. It
    costs no additional decoder call and a negligible fraction of the numpy work.
  every_banded_contrast_gets_its_own_simulated_null: >-
    THIS IS THE DIRECT REMEDY FOR THE THIRD BINDING CONSTRAINT BELOW. Part B does
    not band a single alpha and then reuse that band for main effects and
    interactions -- the exact defect DEC-20260817-2b638b rationale item (j)
    named. Per replicate it draws FOUR independent null cells and forms every
    quantity the reading rule bands, reporting each one's OWN 2.5 / 50 / 97.5
    percentiles and SD at each of k = 5, 10, 17: (1) a single cell alpha; (2) the
    regime main effect mean(P cells) - mean(N cells); (3) the shard main effect
    mean(5000 cells) - mean(8002 cells); (4) the interaction (a(5000,P) -
    a(5000,N)) - (a(8002,P) - a(8002,N)); (5) a same-(shard, regime) replication
    delta, i.e. the difference of two independent alphas. It additionally reports
    each contrast's MEASURED SD ratio against a single alpha's beside the
    analytic factors under cell independence (1.000, 1.000, 1.000, 2.000, 1.414)
    -- a free self-check. A discrepancy above 10% is reported as a finding, not
    smoothed.
  unpaired_over_paired_is_reported_beside_the_band: >-
    Required by the directive and load-bearing for this batch's blindness test
    below. Report the median se_unpaired/se_paired of the coupled null at each k
    beside the band, against BATCH-91929e's uncoupled 0.9965 / 0.9984 and against
    the eight real cells' measured 2.338, 5.604, 6.694, 6.843, 15.266, 15.662,
    17.260, 28.691.

preregistered_reading_rule:
  status: >-
    FROZEN HERE, BEFORE ANY DATA EXISTS, in the commit that opens this batch.
    This is a rule for the COORDINATOR to apply at the ledger archive; the
    executor applies none of it and concludes nothing. Amending it after dispatch
    requires a versioned protocol_amendment record.
  what_it_adjudicates: >-
    THE FALSIFICATION ROUTE IS ADJUDICATED AT k = 5 AND AT k = 5 ONLY. k = 5 is
    inside the k <= 7 range the frozen route names; k = 10 is OUTSIDE it and is
    read as an intermediate monotonicity datum that adjudicates nothing on its
    own. Stated here rather than left to a later session to choose, because
    leaving it open would let the branch be selected after the data is seen.
  the_frozen_falsification_route_carried_verbatim: >-
    "if the four HISTORICAL cells do NOT collapse toward 0.5 at k <= 7 while the
    four fresh cells do, the k-explanation is REFUTED and the shard/regime/
    procedure question is live again at low k. That is a USEFUL RESULT to be
    recorded as such, not a failure." Carried verbatim from GOAL-HQC-001's
    next_action and DEC-20260817-2b638b next_actions item (1). IT IS NOT SOFTENED
    HERE AND MAY NOT BE SOFTENED AT THE ARCHIVE.
  definitions:
    D_shard_k: '|log2( se_paired(P2, k) / se_paired(N1, k) )|, per shard, from BATCH-91929e''s committed cross_regime_arms_results.json. Real-object, distribution-free, band-free.'
    D_RMS_k: RMS of D_shard_k over shards 5000 and 8002. Known values, already committed - 3.170 at k=17, 0.086 at k=2.
    dev_set_k: max over the four cells of the set of |alpha_cell(k) - 0.5|. A total function of four finite reals.
    predicate_i_PROXIMITY: 'dev_set(5) <= max( D_RMS(5), 0.25 ).'
    predicate_ii_CONTRACTION: 'dev_set(5) <= dev_set(17) / 2.'
    COLLAPSE_set: predicate_i AND predicate_ii, both evaluated at k = 5.
  why_the_0_25_floor_and_why_the_factor_2_are_what_they_are: >-
    BOTH ARE ARBITRARY, ARE FROZEN BEFORE THE k=5 DATA EXISTS, AND ARE JUSTIFIED
    FROM ALREADY-COMMITTED NUMBERS RATHER THAN CHOSEN TO PRODUCE AN ANSWER. The
    0.25 floor is roughly twice the largest deviation from 0.5 that the four
    FRESH cells actually showed at k=2 (0.128397, cell (8002, P)), so a set that
    behaves at k=5 no worse than twice as badly as the fresh set demonstrably
    behaves at k=2 still counts as collapsed. Without a floor, a vanishingly
    small D_RMS(5) -- and D_RMS(2) is already 0.086 -- would make the predicate
    unpassable for reasons having nothing to do with the question. The factor 2
    in predicate (ii) is a direction-and-magnitude requirement, not a
    significance test: it demands the set be at least twice as close to 0.5 at
    k=5 as at k=17. Its binding values are known and stated in advance:
    dev_fresh(17) = 2.4607 (cell (5000, N) = 2.960737268597787) and
    dev_hist(17) = 2.336 (cell (5000, P) = 2.836), so (ii) requires
    dev_fresh(5) <= 1.2304 and dev_hist(5) <= 1.168. Predicate (i) is the
    stricter of the two unless D_RMS(5) exceeds those values; the rule requires
    BOTH, so the stricter always binds and no ambiguity arises.
  branches:
    branch_K_k_explanation_corroborated: >-
      COLLAPSE(fresh) TRUE and COLLAPSE(historical) TRUE at k=5, AND the CONTRAST
      CLAUSE holds. READING: on the eight tested cells, the five-batch
      phenomenology this family has read directionally -- sign flips, values "far
      outside [0.4,0.6]", shard-to-shard heterogeneity, and the
      batch-size/transition-regime confound AS AN EXPLANATION OF THE SIGN PATTERN
      -- is a k-artifact of the high-order joint-moment estimator and is absent
      where that estimator is measured to be nearly exact. The instrument has a
      working regime at k <= 7, and reading (1) of EV-HQC-e458ef's obstruction
      resource_check ("the k-localization is a free instrument upgrade") is
      corroborated. SCOPE: the eight tested cells, these shards, these regimes,
      these trial ranges, PS-R3, this budget. Nothing about HQC.
    branch_K_PARTIAL_cells_collapse_contrast_does_not: >-
      COLLAPSE(fresh) TRUE and COLLAPSE(historical) TRUE at k=5, AND the CONTRAST
      CLAUSE fails. READING: the collapse is real at the CELL level and
      incomplete at the CONTRAST level. Record WHICH contrast survives its
      yardstick and by how much. No directional reading is licensed in either
      direction, and the surviving contrast is the named next object. This branch
      exists because a set can collapse toward 0.5 while a difference between its
      halves does not, and BATCH-91929e's rule had no way to say that.
    branch_R_k_explanation_REFUTED: >-
      COLLAPSE(fresh) TRUE and COLLAPSE(historical) FALSE at k=5. READING,
      VERBATIM AND UNSOFTENED: the k-explanation is REFUTED and the
      shard/regime/procedure question is live again at low k. THIS IS A USEFUL
      RESULT AND IS RECORDED AS SUCH, NOT AS A DISAPPOINTMENT OR A FAILURE.
      ADDITIONAL REQUIRED RECORDING, because the refutation is only useful if it
      says what replaced the k-explanation: name which historical cells fail and
      by how much, and state whether the failure pattern is SHARD-aligned
      (5000/6000 versus 8001/8002), REGIME-aligned (P versus N), or
      PROCEDURE-aligned (historical cells' two T-points come from different tasks
      in different processes; fresh cells' do not). All three are live and the
      third has never been tested.
    branch_H_historical_collapses_fresh_does_not: >-
      COLLAPSE(fresh) FALSE and COLLAPSE(historical) TRUE at k=5. READING: the
      collapse tracks the historical PROCEDURE rather than k, which would make
      the one-call-versus-many-call procedural difference (EV-HQC-e458ef O4, O18)
      the operative variable and would put the fresh 2x2's own construction under
      question. Recorded plainly; no directional reading is licensed.
    branch_F_neither_set_collapses: >-
      COLLAPSE(fresh) FALSE at k=5, whatever the historical set does other than
      the Branch H case. READING: the collapse EV-HQC-e458ef O6 measured at k=2
      does not extend to k=5 even on the cells where it was measured, so the
      low-k working regime is narrower than "k <= 7" and reading (1) of the
      obstruction's resource_check is narrower than it claimed. REQUIRED
      ADDITIONAL FREE COMPUTATION IN THIS BRANCH: report the largest k at which
      COLLAPSE(fresh) does hold, from the same committed per-k arrays, at zero
      marginal cost.
    branch_I_data_availability_or_infrastructure_outcome: >-
      PRE-EMPTS EVERY BRANCH ABOVE, PER CELL. Fires if the historical-cell
      reconstruction gate fails on a cell, or a required per-k array is absent or
      does not cover k=5 or k=10, or a computed alpha or se_paired is non-finite,
      or the zero-decoder-call counter is non-zero, or a pinned module sha256
      changed on disk. Under AGENTS.md rule 5 this is an INFRASTRUCTURE OR
      DATA-AVAILABILITY OUTCOME and is NEVER negative mathematical evidence about
      k, the shards, the regimes, or HQC. No other branch may be read from an
      affected cell, and the affected cells are named individually rather than
      the whole batch being voided.
    branch_X_residual: >-
      ANYTHING NOT COVERED ABOVE is recorded plainly as INCONCLUSIVE with the
      observed values and is NOT forced into K, K-PARTIAL, R, H or F. Retained
      deliberately: this campaign has had THREE pre-registered rules fail to
      cover their own outcome, and each time the honest record was the one that
      refused the forced bucket.
  the_CONTRAST_CLAUSE_and_its_declared_BLIND_fallback:
    primary_form: >-
      Every one of the three fresh contrasts at k=5, every historical analogue
      contrast at k=5, and both replication deltas at k=5 lies (a) inside its OWN
      simulated coupled-null 95% interval AND (b) inside +/- D_RMS(5) times that
      contrast's own variance-inflation factor (1.000 single alpha; 1.000 each
      main effect; 2.000 interaction; 1.414 replication delta). BOTH (a) AND (b)
      are required, so the clause is never carried by the band alone.
    blind_fallback: >-
      IF THE COUPLED NULL IS DECLARED BLIND under either test below, clause (a)
      is DROPPED and the CONTRAST CLAUSE becomes clause (b) alone -- the
      band-free, real-object form. NO BRANCH BECOMES INEVALUABLE, and that is
      stated in advance rather than discovered afterwards. The archive
      additionally records the batch as having produced a second uncalibrated
      parametric band, which would be the SIXTH instance of this campaign's
      control-blindness pattern (after CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP,
      BATCH-4b8ad3's planted arm and BATCH-91929e's null object) and must be
      named as such, not softened.
  blindness_is_defined_in_advance_and_is_checkable_for_free:
    test_1_SHAPE: >-
      The coupled null is SHAPE-BLIND at order k if its median
      se_unpaired/se_paired at that k falls outside the closed range spanned by
      the eight real cells' measured values at that same k. At k=17 that range is
      [2.338, 28.691] and BATCH-91929e's uncoupled null returned 0.9965, i.e. it
      would have been declared SHAPE-BLIND by this test in advance. The executor
      reports the real cells' range at k=5 and k=10 from committed arrays so the
      test is evaluable at every k the rule uses.
    test_2_POWER: >-
      The coupled null is POWER-BLIND for a contrast at order k if that
      contrast's own simulated 95% interval is so wide that its minimum
      detectable effect -- the smallest |contrast| the interval could ever
      declare outside -- exceeds 3.702 alpha units, the entire historical
      exponent spread this campaign has ever observed. A band that cannot
      exclude the whole phenomenon is not a calibration. This is pure arithmetic
      on the band itself, cannot be tautological, and generalizes what
      BATCH-91929e's Red Team had to discover by hand (required rho >= 2.5256
      against an achievable maximum of 1.3462).
    why_no_planted_departure_leg_is_dispatched: >-
      STATED RATHER THAN OMITTED. BATCH-91929e's planted-departure leg was shown
      by its Red Team to be incapable of firing at ANY planted magnitude, because
      clipping to [0, 56] around mu = 17.877 drives the planted arm to a
      near-two-point law whose k=17 jackknife SE is LOWER than the base: rho
      peaks near 1.3462 at g=2 and REVERSES (1.0381 at g=3, 0.8688 at g=50). A
      sixth run of a plant class already proven to saturate below its own
      detection threshold would buy nothing, and its "forced identity" check was
      shown to be an algebraic tautology whose residual measures float64 rounding
      (EV-HQC-e458ef O11). The two structural tests above replace it, cost
      nothing, and are not defeatable by the same mechanism. This is a
      substitution and it is declared as one.
  how_i_checked_this_rule_covers_its_own_outcome_space: >-
    REQUIRED BY DEC-20260817-2b638b next_actions item (2) AND BY THIS BATCH'S
    DISPATCH, AND DONE EXPLICITLY RATHER THAN ASSERTED. (1) EXHAUSTIVENESS. The
    branch selector is the ordered pair (COLLAPSE(fresh), COLLAPSE(historical)),
    a 2x2 truth table over two predicates that are TOTAL functions of eight
    finite real numbers (a max of four absolute deviations, compared against two
    constants known before the data). The four cells map to exactly one branch
    each: (T,T) -> K or K-PARTIAL on the contrast clause; (T,F) -> R; (F,T) -> H;
    (F,F) -> F. Branch F is additionally written to absorb (F, anything-but-H),
    so no ordering ambiguity exists. Branch I pre-empts per cell on a
    finiteness/availability failure; Branch X absorbs anything the above somehow
    does not name. The rule cannot be silent. (2) THE PREDICATES CANNOT BE
    UNDEFINED. A max of four finite reals always exists; the only way to lose it
    is a non-finite or missing value, which Branch I pre-empts by name. (3) NO
    BRANCH DEPENDS SOLELY ON THE CONTROL'S BAND. Branches R, H, F, I and X
    reference no band at all. Branch K and K-PARTIAL are separated by the
    CONTRAST CLAUSE, which is a CONJUNCTION of a band clause and a band-free
    clause and which has a declared BLIND fallback to its band-free half. (4) THE
    BLIND CASE IS PRE-ANSWERED. Under BLIND the fallback fires mechanically, the
    2x2 selector is untouched, and every branch remains evaluable -- which is
    exactly what BATCH-91929e's rule could not do, where three of four branches
    were defined entirely in terms of a band the same batch's fail-closed rule
    voided. (5) EVERY BANDED CONTRAST HAS ITS OWN SIMULATED NULL. Five distinct
    quantities are banded and five distinct null distributions are simulated
    directly, with the analytic inflation factors reported beside the measured
    ones as a self-check; no single-alpha band is reused for a main effect or an
    interaction. (6) EVALUABILITY AGAINST THE FALSIFICATION ROUTE SPECIFICALLY.
    The route's two outcomes -- historical collapses, historical does not, in each
    case given the fresh set's behaviour -- are Branches K/K-PARTIAL and R
    respectively, both fully evaluable with the control BLIND. HONEST CAVEAT,
    STATED SO THIS CHECK IS NOT MISTAKEN FOR MORE THAN IT IS: totality of the
    truth table guarantees only that no outcome leaves the rule SILENT. It does
    not guarantee that the branch READINGS are the right readings, and it does
    not make the 0.25 floor or the factor 2 anything other than frozen arbitrary
    choices. The failure this rule is built against is silence, and that is the
    failure that fired three times.
  the_three_binding_constraints_this_rule_must_satisfy:
    constraint_1: >-
      "No substantive branch may be defined solely in terms of a band produced by
      a control whose own validity that rule is testing." SATISFIED: Branches R,
      H, F, I and X reference no band; Branch K's only band dependence is one
      half of a conjunction whose other half is the band-free real-object
      yardstick D_RMS(5), and the band half is dropped under BLIND.
    constraint_2: >-
      "The rule MUST state in advance what it reads if its control returns
      BLIND." SATISFIED: BLIND is defined in advance by two checkable tests
      (SHAPE, POWER), and the declared consequence is mechanical -- clause (a)
      drops, clause (b) stands, the 2x2 selector is untouched, every branch stays
      evaluable, and a sixth control-blindness instance is named.
    constraint_3: >-
      "It MUST state the null distribution of EVERY contrast it bands, not only
      of a single alpha." SATISFIED: five banded quantities, five directly
      simulated null distributions at each of k = 5, 10, 17, with measured SD
      ratios reported beside the analytic inflation factors 1.000 / 1.000 /
      1.000 / 2.000 / 1.414.
  validity_gates_dominate_everything: >-
    If the zero-decoder-call counter is non-zero, a pinned module sha256 changed
    on disk, the historical-cell reconstruction gate fails, or a required array
    is missing or non-finite, the affected cells are INFRASTRUCTURE OR
    DATA-AVAILABILITY OUTCOMES under AGENTS.md rule 5 and are not evidence about
    the mathematics in either direction. Branch I governs them and no other
    branch may be read from them.

standing_requirements_carried_into_this_batch:
  dominated_by_is_mandatory_and_its_value_is_fixed: >-
    WHEREVER THIS BATCH OR ITS ARCHIVE CHARACTERISES THE 2-POINT LOCAL EXPONENT,
    dominated_by MUST BE RECORDED AS: "4-rung OLS in log-log on identical data,
    SD 0.234334 against 0.700666, a 2.99x noise reduction at zero cost." A
    dominated_by: null there would be a FABRICATION under AGENTS.md rule 9 and a
    violation of docs/inventor-protocol.md's Pareto-honesty obligation. Bound as
    a required deliverable on the executor's report and as a completion gate on
    the ledger archive.
  persist_per_trial_S_does_not_bind_here_and_is_carried_forward_explicitly: >-
    SAID EXPLICITLY RATHER THAN SILENTLY OMITTED, AS THE DIRECTIVE REQUIRES.
    DEC-20260817-2b638b next_actions item (3) makes persisting the retained
    per-trial S arrays (~600 KB int8 against a 4 GB cap) a STANDING REQUIREMENT
    "effective from the NEXT SAMPLING TASK". THIS BATCH MAKES NO DECODER CALLS
    AND SAMPLES NOTHING, so it is not a sampling task and the requirement does
    not bind on TASK-20260817-b4b6e4. IT IS CARRIED FORWARD UNCHANGED AND BY NAME
    TO THE NEXT SAMPLING TASK IN THIS FAMILY, where it upgrades both disjointness
    proofs from prefix-verified to window-verified, makes re-analysis at another
    k or another N_JACK_BATCHES free instead of impossible, and eliminates the
    compounding discarded-prefix cost (300,000 wasted decodes, about 67 seconds,
    for the next sampling task and about 134 seconds for the one after). The
    ledger archive must re-carry it.
  v1_positive_control_pilot_is_deferred_a_fourth_time_and_is_not_re_litigated: >-
    CARRIED, NOT REOPENED. DEC-20260817-2b638b rationale item (m) deferred V1 a
    FOURTH time with a now-QUANTITATIVE reason that this batch does not
    re-litigate: the SE-vs-T law is MEASURED at T^(-0.35), not the T^(-0.5) that
    every sizing arithmetic in this family has assumed, with z = -8.97 and no
    decay across an 8x range in T, so the pre-registered finite-T excuse is
    falsified by the producer's own data; and any V1 sizing computed from a
    single se_paired draw could be wrong by up to 16.7x. THE RELEASE CONDITION IS
    BINDING AND IS THIS BATCH'S TASK: V1 is dispatched as soon as a usable sizing
    law exists, which TASK-20260817-b4b6e4 produces at zero decoder cost (low-k
    cells where the estimator's bias is 7e-5, plus the >= 3-rung ladder exponent
    with its measured scatter, SD 0.234334 against the 2-point's 0.700666). A
    FIFTH deferral after this task would require a reason DEC-20260817-2b638b
    does not supply, and the ledger archive must state V1's disposition
    explicitly either way.

knowledge_promotion_obligation_binding_on_this_batch:
  what_dec_20260817_2b638b_committed_to: >-
    Candidate 2 -- "A two-point (zero-degree-of-freedom) local-exponent
    diagnostic cannot be read directionally, in either sign or magnitude, without
    an independent empirical estimate of its own sampling variance -- a
    generalizable warning about the entire local-exponent technique this task
    family invented at TASK-20260814-8bbdd2" -- was given `not_warranted` for
    EXACTLY ONE BOUNDED STEP, on SCOPE and not on confidence, with a BINDING
    RESOLUTION POINT: "CANDIDATE 2 IS FILED AT THE LEDGER ARCHIVE THAT CLOSES THE
    NEXT-ACTION TASK, IN WHICHEVER SCOPE THAT TASK'S OUTCOME SUPPORTS --
    including the case where the k-explanation is refuted, in which case the
    general form is the one that stands and should be filed. A FOURTH DEFERRAL OF
    CANDIDATE 2 REQUIRES A REASON THIS DECISION DOES NOT SUPPLY."
    TASK-20260817-0c342f IS THAT LEDGER ARCHIVE. THE OBLIGATION IS DISCHARGED
    THERE OR IT IS BREACHED.
  the_scope_map_is_frozen_here_so_the_outcome_cannot_choose_a_deferral: >-
    Branch K -> file the NARROW form ("HIGH-ORDER joint-moment 2-point local
    exponents, where the estimator's own measured bias is large and the effective
    sample size is a small fraction of T, cannot be read directionally without an
    independent variance estimate"), pointing at a fix rather than a
    prohibition. Branch K-PARTIAL -> file the NARROW form, with the surviving
    contrast recorded inside the entry as its own falsification/narrowing
    condition. Branch R -> file the GENERAL form; DEC-20260817-2b638b names this
    case explicitly. Branch F -> file the GENERAL form a fortiori, and record
    that the low-k working regime is narrower than reading (1) of
    EV-HQC-e458ef's obstruction resource_check claimed. Branch H -> file the
    GENERAL form, with the procedural finding recorded as the entry's scope
    limitation. Branch X -> FILE THE GENERAL FORM, with the inconclusive outcome
    recorded INSIDE the entry as its own limitation and revisit condition; a
    fourth deferral under X is permitted ONLY with a versioned
    `protocol_amendment` record naming a fact DEC-20260817-2b638b did not have,
    and a Coordinator writing one must treat it as a defect to be justified, not
    a routine hold. Branch I -> the task did not produce its result; the
    obligation transfers UNCHANGED to the archive of the re-run, and this is the
    ONE case in which no filing is possible. Recorded honestly rather than left
    as an escape hatch.
  action_required_of_the_driving_session_before_the_ledger_archive_is_dispatched: >-
    THE OBLIGATION MUST NOT FAIL FOR A MECHANICAL REASON, AND IT NEARLY CAN.
    DEC-20260817-2b638b's own limitations block records that the archiving
    session had no shell, could not run tools/allocate_id.py and therefore could
    not mint a KN-* identifier. TASK-20260817-0c342f will be in the same
    position. THE DRIVING SESSION MUST PRE-ALLOCATE A KN IDENTIFIER (KN-TECH-* if
    filed as a technique lesson, KN-FIND-* if filed as an internal finding) with
    `tools/allocate_id.py --next` and `--check` BEFORE dispatching
    TASK-20260817-0c342f, and append its exact path to that task's
    artifact_paths in dispatch_queue.json at that time -- a legitimate edit to a
    not-yet-Ready task. knowledge/findings/ and knowledge/techniques/ are already
    in that task's write_scope. "I had no shell" is not an admissible fourth
    deferral.
  the_other_held_candidates_are_unchanged_and_are_not_reopened_here: >-
    Candidate 1 (the fixed-batch-count jackknife confound) received a TERMINAL
    not_warranted at its current scope in DEC-20260817-2b638b with a stated
    narrowing and a two-branch revisit condition; branch (a) of that revisit
    condition -- "the next-action recompute or a successor producing an
    instrument whose exponent IS readable" -- IS ENGAGED BY THIS BATCH under
    Branch K or K-PARTIAL, and the ledger archive must say so and file it WITH
    the instrument if it fires. The control-blindness pattern (fifth instance)
    stays held on its unchanged transfer condition, and this batch may produce a
    sixth instance inside the same campaign and instrument family, which does NOT
    meet that condition. KN-TECH-00f082 stands exactly as filed. The planted-arm
    plateau lesson and the per-shard-heterogeneity / pooling-convention
    candidates are unchanged.

budget_note: >-
  GOAL-HQC-001's campaign_budget.maximum_batches is null (unbounded,
  user-authorized by DEC-20260806-7c2f91 and recorded as a USER AUTHORIZATION,
  not a self-grant). campaign_budget.total_wall_clock_seconds is 10,800 and
  REMAINS A LIVE PAUSE CONDITION; roughly 4,735.71 seconds remain after
  BATCH-91929e's MEASURED 78.371-second debit. DEBIT CONVENTION, unchanged since
  BATCH-412513: ONLY EXECUTOR-MEASURED WALL-CLOCK SPEND is debited; reviewer and
  Coordinator session time never is. SIZING, HONESTLY SMALL BECAUSE THE WORK IS
  HONESTLY SMALL: Part A is pure arithmetic on committed JSON -- four historical
  cells, four fresh cells, three contrasts, two 4-point ladders and a per-k noise
  handle -- and costs well under a second. Part B repeats BATCH-91929e's Part B
  ladder (R=200 at four rungs) with a two-line change to the draw and an extra
  contrast-simulation loop; BATCH-91929e's Part B MEASURED 6.508 wall-clock /
  7.664 core-seconds, and the directive prices this half at "roughly 7
  core-seconds". AUTHORIZED: 300 wall-clock seconds, 150 core-seconds, maximum 2
  runs, ZERO decoder calls. That is roughly 20x the measured cost of the nearest
  comparable work, which is generous headroom for a task whose only cost risk is
  a numpy replicate loop, and it is 6.34% of the 4,735.71 seconds remaining, so
  even a full-cap spend leaves about 4,435.71. THE CAP WILL NOT BE RAISED AND A
  RAISE IS NOT SELF-GRANTABLE. A pre-registered cost-projection reduction
  protocol (project after 20 replicates at the most expensive rung; reduce R to
  the largest multiple of 50 that fits, floor 100; report UNDERPOWERED below
  that; write cost_projection.json unconditionally) exists so the task scales its
  own work to fit rather than running into the cap -- the same protocol that
  worked without firing in BATCH-91929e. The executor is REQUIRED to report
  actual core-seconds and wall-clock so the ledger archive debits a MEASURED
  number, never an estimate. NO PAUSE CONDITION FIRES: roughly 44% of the
  campaign budget remains, the named mechanism costs zero decoder calls, no
  source is unobtainable and no infrastructure blocker has occurred.

concurrency_note: >-
  max_concurrent 3 is safe on the target machine (14 cores), but concurrency is
  not this batch's constraint: it has ONE producer, and the only parallel step is
  the Validator/Red Team pair after the snapshot archive. BOTH ARCHIVE TASKS RUN
  ALONE, never alongside another agent, and never race another worker on one Git
  index or HEAD.

review_write_scope_layout_is_declared_once_and_governs: >-
  BOTH REVIEWS WRITE UNDER coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/reviews/<TASK-ID>/.
  THERE IS NO red-team/ DIRECTORY IN THIS BATCH. Stated at the top level because
  BATCH-91929e's dispatch orientation named .../red-team/TASK-20260817-94c89e/
  while its COMMITTED task card, COMMITTED handoff and COMMITTED
  dispatch_queue.json all named .../reviews/TASK-20260817-94c89e/. The Red Team
  followed the committed path and flagged the discrepancy, which was the right
  precedence and which DEC-20260817-2b638b rationale item (i) affirmed: a
  dispatch orientation is a POINTER, NEVER A CONTRACT (AGENTS.md "Inter-agent
  messaging"), and had the reviewer followed the prompt its report would have
  landed outside the declared artifact_paths the archiver reads. The queue, the
  task cards and the handoffs in this batch all say `reviews/`. If any dispatch
  prompt says otherwise, THE COMMITTED CONTRACT GOVERNS: write to the committed
  path and flag the discrepancy.

