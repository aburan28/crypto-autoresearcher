artifact_path_fidelity_note: >-
  TASK-20260817-b4b6e4 declares TWELVE artifact paths and every one of them is
  MANDATORY, WRITTEN UNCONDITIONALLY, and gated in its completion_gate --
  including the three auxiliary outputs (historical_cell_reconstruction.json,
  coupled_null_replicate_summary.csv, cost_projection.json) and stderr.log (empty
  is fine). EACH REVIEWER DECLARES TWO PATHS, its report plus one auxiliary
  recomputation file, also written unconditionally with a
  `no_auxiliary_output: true` marker if the reviewer has nothing else to record
  -- so a reviewer's independent recomputation has a declared home instead of
  being discarded, and a declared path can never go missing because a contingency
  did not occur. THIS IS THE FAILURE MODE THAT REQUIRED REPAIR IN GOAL-ECDLP-001
  BATCH-7d9b78 AND GOAL-MLKEM-005 BATCH-0d5018 AND THAT BATCH-91929e AVOIDED. In
  particular, if the historical-cell reconstruction gate FAILS and Part A aborts,
  low_k_recompute_results.json is still written, carrying
  `status: aborted_on_reconstruction_gate` and null statistics -- it is never
  absent.

