    (shards 8001, 8002, regime N = the 50->100 transition, T = 10,000 ->
    20,000). Their committed k=17 values are +2.836, +1.402,
    -0.2682495157085447 and -0.8662355237627483.
  the_reconstruction_this_batch_must_verify_before_it_uses:
    shard_5000_regime_P:
      T_lo: 5000
      se_lo_source: TASK-20260809-a79e4f matched_pair_results.json -> stage_1.matched_pair.per_shard.shard_5000 (ks, se_paired)
      T_hi: 10000
      se_hi_source: TASK-20260814-8bbdd2 matched_pair_repeat_results.json -> per_shard.shard_5000 (ks, se_paired)
    shard_6000_regime_P:
