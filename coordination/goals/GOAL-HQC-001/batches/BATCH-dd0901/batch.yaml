what_this_batch_is: >-
  THIS BATCH RE-DECIDES NO SCIENCE. It authors the single follow-up task that
  DEC-20260817-2b638b's next_actions and GOAL-HQC-001's next_action already name
  in full, verbatim and adopted from the Red Team's own named
  next_concrete_action, and that neither could dispatch because the Coordinator
  session that closed BATCH-91929e had no shell and could not allocate
  identifiers. Every scientific judgment carried here -- that the
  zero-decoder-call low-k recompute is simultaneously the cheapest and the most
  discriminating control available; that the 2-point local exponent of se_paired
  at k=17 is retired as a DIRECTIONAL statistic for this task family pending
  calibration; that no lane is closed; that V1's positive-control pilot stays
  sequenced behind this work -- was made in DEC-20260817-2b638b and is BOUND
  here, not reopened.

objective: >-
  RECOMPUTE, FROM ALREADY-COMMITTED PER-k ARRAYS AND WITH ZERO NEW DECODER
  CALLS, WHETHER THE ENTIRE FIVE-BATCH PHENOMENOLOGY OF THIS TASK FAMILY IS A
  k-ARTIFACT. EV-HQC-e458ef O6 established, on the four FRESH 2x2 cells only,
  that "all four cells positive" is a k=17 statement: at k=2 the same data
  through the same estimator returns 0.580733 / 0.506553 / 0.628397 / 0.511866,
  all within 0.128397 of the analytically forced 0.5, with all three contrasts
  within 0.1 of zero, and the values fan out monotonically with k in step with
  the estimator's own measured bias (-0.00007 at k=2, -0.10164 at k=17, -2.71938
  at k=26). EV-HQC-e458ef's own boundaries block records that the four HISTORICAL
  cells' per-k arrays are committed but were NOT recomputed at low k by either
  reviewer, and that this check is the named next control, not a result. PART A
  of this batch's single executor task closes that gap by pure arithmetic on
  committed JSON: the four FRESH cells, the three contrasts and BOTH 4-point
  ladders at k=5 and k=10; the four HISTORICAL cells at k=5 and k=10,
  reconstructed from the three committed source files named below and gated by a
  fail-closed reproduction of each cell's own committed k=17 alpha; and the
  same-T real-object noise handle reported alongside at every evaluable k. PART B
  re-runs the null band at those k with the two arms COUPLED as the real pair
  actually is coupled -- base ~ Binomial(n_e-1 = 55, p), arm_i = base +
  Bernoulli_i(p), preserving the Binomial(56, p) marginal exactly -- reporting
  unpaired_over_paired beside the band, and simulating the null distribution of
  EVERY contrast this batch's reading rule bands rather than of a single alpha
  only. ZERO NEW DECODER CALLS: Part A is pure arithmetic and Part B is roughly
  7 core-seconds of numpy. Claim tier stays TOY throughout.

claim_tier_and_scope: >-
  TOY, HARD CEILING, unchanged and inherited from EV-HQC-e458ef, EV-HQC-927899,
  EV-HQC-469c08 and RQ-HQC-001. PS-R3 reduced parameters only (n=7187, n_e=56,
  n_2=128, dup=1, N=7168, k range 2..26, m_load_bearing_order=17), one defect
  class (V3, last-block-window-read-early), one injection point (decode_blocks'
  block window, block n_e-1). Part A reads only already-committed arrays for
  shards 5000, 6000, 8001 and 8002; Part B makes no decoder call, uses no shard
  and contains no defect. NOTHING IN THIS BATCH BEARS ON HQC's IND-CCA SECURITY,
  ITS DECODING-FAILURE RATE, ASSUMPTION A17 OR A5, OR ANY STANDARDIZED PARAMETER
  SET. Standardized-parameter runs are out of scope and unauthorized. What this
  batch measures is the behaviour of a scaling-characterization INSTRUMENT this
  program built, not a property of HQC. H-HQC-18d1b4 stays PROPOSED and does not
  move on this batch's dispatch; EXP-HQC-982268 gains no approval; GOAL-HQC-001
  stays `active`.

zero_decoder_calls_is_a_hard_gate: >-
  THIS BATCH AUTHORIZES ZERO NEW DECODER CALLS AND THAT IS ENFORCED FAIL-CLOSED,
  NOT MERELY REQUESTED. Part A reads committed JSON only. Part B needs
  matched_pair.py's arm_hists / matched_pair_stats and measure.py's
  log2_A_from_hists, and matched_pair.py imports stage_a.py, so stage_a WILL be
  imported -- but nothing in it may be CALLED. The task installs call-counting
  wrappers on the loaded module objects' `_t_shard` and `decode_blocks`
  attributes (in its own process; no file on disk is edited), asserts both
  counters are exactly 0 at exit, re-verifies all module sha256 pins ON DISK at
  exit to prove no pinned file was modified, and reports
  `decoder_calls_made: 0` in run_manifest.yaml. A non-zero counter is an
  immediate abort and an infrastructure outcome, never a result.

