  BOTH ARCHIVE TASKS DEPEND DIRECTLY ON EVERY TASK WHOSE ARTIFACTS THEY COMMIT.
  Stated explicitly because two batches in this same goal (BATCH-a5c525 and
  BATCH-f8050e) currently FAIL to render with "archive task X must directly
