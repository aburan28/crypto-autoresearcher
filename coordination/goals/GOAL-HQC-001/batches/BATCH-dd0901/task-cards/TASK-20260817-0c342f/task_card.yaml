  runs_alone: true
  runs_alone_note: >-
    Coordinator archive tasks run alone, never alongside another agent, and never
    race another worker on one Git index or HEAD.

  the_reading_rule_is_frozen: >-
    batch.yaml's preregistered_reading_rule was frozen at batch opening, before
    any data existed. APPLY IT EXACTLY AS FROZEN. Evaluate COLLAPSE(fresh) and
    COLLAPSE(historical) at k=5 from predicates (i) PROXIMITY -- dev_set(5) <=
    max(D_RMS(5), 0.25) -- and (ii) CONTRACTION -- dev_set(5) <= dev_set(17)/2 --
    as defined, name the resulting branch (K, K-PARTIAL, R, H, F, I or X)
    explicitly, and record the observed values that produced it. DO NOT adjust
    the 0.25 floor, the factor-2 threshold, or any branch reading after seeing the
    outcome; an amendment requires a versioned protocol_amendment record per
    AGENTS.md. THE FALSIFICATION ROUTE IS ADJUDICATED AT k=5 ONLY; k=10 is an
    intermediate monotonicity datum and adjudicates nothing on its own.

  branch_R_must_be_recorded_as_a_useful_result: >-
    IF BRANCH R FIRES, RECORD IT IN THE FROZEN ROUTE'S OWN WORDS AND UNSOFTENED:
    the k-explanation is REFUTED and the shard/regime/procedure question is live
    again at low k. THAT IS A USEFUL RESULT TO BE RECORDED AS SUCH, NOT A
    FAILURE OR A DISAPPOINTMENT. Additionally state whether the failure pattern is
    SHARD-aligned (5000/6000 versus 8001/8002), REGIME-aligned (P versus N), or
    PROCEDURE-aligned (historical cells' two T-points come from different tasks in
    different processes; fresh cells' do not) -- all three are live and the third
    has never been tested. Do not bury a refutation inside a factorial.

  blindness_gate_and_its_declared_fallback: >-
    Apply the two pre-declared blindness tests (SHAPE and POWER) MECHANICALLY. If
    either fails, the CONTRAST CLAUSE drops its band half and stands on its
    band-free half -- +/- D_RMS(5) times the contrast's own variance-inflation
    factor (1.000 single alpha; 1.000 each main effect; 2.000 interaction; 1.414
    replication delta). NO BRANCH BECOMES INEVALUABLE; that is the whole point of
    the fallback, and it is the defect BATCH-91929e's rule had, where three of
    four branches were defined entirely in terms of a band the same batch's own
    fail-closed rule voided. Record the batch as having produced a second
    uncalibrated parametric band, which would be the SIXTH instance of this
    campaign's control-blindness pattern (after CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP,
    BATCH-4b8ad3's planted arm and BATCH-91929e's null object), and NAME IT AS
    SUCH rather than softening it.

  validity_gates_dominate: >-
    If the zero-decoder-call counter was non-zero, a pinned module sha256 changed
    on disk, the historical-cell reconstruction gate failed on a cell, or a
    required array was missing or non-finite, those cells are INFRASTRUCTURE OR
    DATA-AVAILABILITY OUTCOMES under AGENTS.md rule 5 -- never negative
    mathematical evidence -- and Branch I governs them. Name the affected cells
    INDIVIDUALLY rather than voiding the batch, and state this explicitly rather
    than silently downgrading the finding's strength.

  knowledge_promotion_is_binding_and_is_discharged_here:
    binding_note: >-
      THIS IS NOT A DISCRETIONARY FIELD AND IT IS NOT DEFERRABLE BY DEFAULT.
      DEC-20260817-2b638b made candidate 2 -- "A two-point (zero-degree-of-freedom)
      local-exponent diagnostic cannot be read directionally, in either sign or
      magnitude, without an independent empirical estimate of its own sampling
      variance -- a generalizable warning about the entire local-exponent technique
      this task family invented at TASK-20260814-8bbdd2" -- `not_warranted` for
      EXACTLY ONE BOUNDED STEP, on SCOPE and not on confidence, and named THIS
      ARCHIVE as its resolution point in these words: "CANDIDATE 2 IS FILED AT THE
      LEDGER ARCHIVE THAT CLOSES THE NEXT-ACTION TASK, IN WHICHEVER SCOPE THAT
      TASK'S OUTCOME SUPPORTS -- including the case where the k-explanation is
      refuted, in which case the general form is the one that stands and should be
      filed. A FOURTH DEFERRAL OF CANDIDATE 2 REQUIRES A REASON THIS DECISION DOES
      NOT SUPPLY, and a Coordinator writing one should treat that as a defect to be
      justified in a versioned record rather than a routine hold." THE OBLIGATION IS
      DISCHARGED HERE OR IT IS BREACHED.
    branch_to_scope_map_frozen_at_batch_opening: >-
      Branch K -> file the NARROW form ("HIGH-ORDER joint-moment 2-point local
      exponents, where the estimator's own measured bias is large and the effective
      sample size is a small fraction of T, cannot be read directionally without an
      independent variance estimate"), pointing at a fix rather than a prohibition.
      Branch K-PARTIAL -> file the NARROW form, with the surviving contrast recorded
      inside the entry as its own falsification/narrowing condition. Branch R -> file
      the GENERAL form; DEC-20260817-2b638b names this case explicitly. Branch F ->
      file the GENERAL form a fortiori, and record that the low-k working regime is
      narrower than reading (1) of EV-HQC-e458ef's obstruction resource_check
      claimed. Branch H -> file the GENERAL form, with the procedural finding as the
      entry's scope limitation. Branch X -> FILE THE GENERAL FORM, with the
      inconclusive outcome recorded INSIDE the entry as its own limitation and
      revisit condition; a fourth deferral under X is permitted ONLY with a versioned
      protocol_amendment record naming a fact DEC-20260817-2b638b did not have.
      Branch I -> the task did not produce its result; the obligation transfers
      UNCHANGED to the archive of the re-run, and this is the ONE case in which no
      filing is possible.
    kn_id_must_already_exist: >-
      THE OBLIGATION MUST NOT FAIL FOR A MECHANICAL REASON, AND IT NEARLY CAN.
      DEC-20260817-2b638b's own limitations block records that its archiving
      session had no shell, could not run tools/allocate_id.py and therefore could
      not mint a KN-* identifier. THIS SESSION WILL BE IN THE SAME POSITION. The
      driving session was directed, in batch.yaml and in the dispatch queue, to
      pre-allocate the KN identifier (KN-TECH-* if filed as a technique lesson,
      KN-FIND-* if filed as an internal finding) and append its exact path to this
      task's artifact_paths BEFORE this task is dispatched. If that path is present,
      USE IT. IF IT IS ABSENT, SAY SO AS A PROCESS DEFECT AND DO NOT TREAT IT AS A
      DEFERRAL: "I had no shell" is not an admissible fourth deferral of an
      obligation a committed decision made binding.
    also_resolve_by_name: >-
      Candidate 1 (the fixed-batch-count jackknife confound) received a TERMINAL
      not_warranted at its current scope with a two-branch revisit condition; branch
      (a) -- "the next-action recompute or a successor producing an instrument whose
      exponent IS readable" -- IS ENGAGED under Branch K or K-PARTIAL, in which case
      the sharpened lesson is filed WITH that instrument. Say so either way. The
      control-blindness pattern stays HELD on its unchanged transfer condition, and a
      sixth instance INSIDE this campaign and instrument family does NOT meet it --
      say that rather than promoting to close a loop. KN-TECH-00f082 stands exactly
      as filed unless this batch's evidence engages its own narrowing condition. The
      planted-arm plateau lesson and the per-shard-heterogeneity / pooling-convention
      candidates are unchanged.
    index_is_not_committed: >-
      DO NOT COMMIT knowledge/INDEX.md. It is a generated artifact, .gitignore'd per
      CLAUDE.md's concurrency rules, and rebuilt on demand. Commit only the KN entry
      itself. Follow the /curate-knowledge conventions.

  standing_requirements_this_archive_must_carry:
    dominated_by_verbatim: >-
      Record, verbatim, wherever this decision or evidence record characterises the
      2-point local exponent: "4-rung OLS in log-log on identical data, SD 0.234334
      against 0.700666, a 2.99x noise reduction at zero cost." A dominated_by: null
      there is a FABRICATION under AGENTS.md rule 9 and a violation of
      docs/inventor-protocol.md's Pareto-honesty obligation.
    persist_per_trial_S_carried_forward: >-
      STATE EXPLICITLY that THIS BATCH MADE NO DECODER CALLS and was therefore NOT a
      sampling task, so DEC-20260817-2b638b next_actions item (3) did not bind on it,
      and CARRY IT UNCHANGED BY NAME to the next SAMPLING task in this family. Do not
      let a standing requirement lapse by silence.
    v1_disposition_required: >-
      DEC-20260817-2b638b deferred V1's positive-control pilot a FOURTH time with a
      now-quantitative reason (SE-vs-T measured at T^(-0.35), not the T^(-0.5) every
      sizing in this family assumed, z = -8.97; and any sizing from a single
      se_paired draw could be wrong by up to 16.7x) AND a BINDING RELEASE CONDITION:
      "V1 is dispatched as soon as the next action delivers a usable sizing law
      (low-k cells where the estimator's bias is 7e-5, plus a >= 3-rung ladder
      exponent with its measured scatter)... a FIFTH deferral would require a reason
      this decision does not supply." THIS BATCH IS THAT NEXT ACTION. Say whether the
      sizing law was delivered, and DISPATCH V1 or state the reason a fifth deferral
      is warranted. DO NOT RE-LITIGATE the fourth deferral's quantitative reason; it
      is carried, not reopened.

