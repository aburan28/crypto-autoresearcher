  title: >-
    Zero-decoder-call low-k recompute of all eight local-exponent cells at k=5
    and k=10 with the same-T noise handle, plus a coupled-arm null band with a
    simulated null for every banded contrast

  objective: >-
    PART A: recompute, from ALREADY-COMMITTED per-k arrays and with ZERO new
    decoder calls, the four FRESH cells, the three contrasts and BOTH 4-point
    ladders at k=5 and k=10, AND the four HISTORICAL cells at k=5 and k=10,
    reporting the same-T real-object noise handle alongside at every evaluable k.
    PART B: re-run the null band at those k with the two arms COUPLED as the real
    pair actually is coupled -- base ~ Binomial(n_e-1 = 55, p), arm_i = base +
    Bernoulli_i(p) -- reporting unpaired_over_paired beside the band and
    simulating the null distribution of EVERY contrast the reading rule bands.
    Observations only; the executor applies no branch of the reading rule and
    concludes nothing.

  what_this_task_settles: >-
    EV-HQC-e458ef O6 established, on the four FRESH cells ONLY, that "all four
    cells positive" is a k=17 statement that vanishes at k=2. EV-HQC-e458ef's
    boundaries block records that the four HISTORICAL cells' per-k arrays are
    committed but were NOT recomputed at low k by either reviewer, and that this
    is the named next control, not a result. This task closes that gap at zero
    decoder cost. Whether the historical cells collapse decides whether five
    batches of directional readings were artifacts of a high-order joint-moment
    estimator or whether the shard/regime/procedure question is live again.

  the_frozen_falsification_route_carried_verbatim: >-
    "if the four HISTORICAL cells do NOT collapse toward 0.5 at k <= 7 while the
    four fresh cells do, the k-explanation is REFUTED and the
    shard/regime/procedure question is live again at low k. That is a USEFUL
    RESULT to be recorded as such, not a failure." FROZEN BEFORE THE DATA EXISTS
    and carried verbatim from GOAL-HQC-001's next_action and DEC-20260817-2b638b
    next_actions item (1). The EXECUTOR does not adjudicate it; the Coordinator
    does, at the ledger archive, under batch.yaml's frozen reading rule. The
    executor's job is to produce the numbers that make it decidable, shaped
    toward no branch.

  zero_decoder_calls_is_a_hard_gate: >-
    Part A reads committed JSON only. Part B needs matched_pair.py's arm_hists /
    matched_pair_stats and measure.py's log2_A_from_hists, and matched_pair.py
    imports stage_a.py, so stage_a WILL be imported -- but nothing in it may be
    CALLED. Install call-counting wrappers on the LOADED module objects'
    `_t_shard` and `decode_blocks` attributes (in this process only; edit no file
    on disk), assert both counters are exactly 0 at exit, re-verify all three
    module sha256 pins ON DISK at exit to prove no pinned file was modified, and
    report `decoder_calls_made: 0` in run_manifest.yaml. A non-zero counter is an
    IMMEDIATE ABORT and an infrastructure outcome under AGENTS.md rule 5, NEVER a
    result.

  the_historical_cell_reconstruction_gate_is_fail_closed: >-
    batch.yaml's the_four_historical_cells_and_their_reconstruction names, per
    cell, which committed array supplies the low-T and the high-T se_paired
    point. THAT MAPPING IS THIS COORDINATOR'S RECONSTRUCTION AND IS NOT ASSERTED
    AS FACT. For each of the four cells, recompute its k=17 alpha from the two
    arrays you ACTUALLY selected and assert it reproduces the committed value
    (+2.836 shard 5000; +1.402 shard 6000; -0.2682495157085447 shard 8001;
    -0.8662355237627483 shard 8002) to within 1e-12 absolute BEFORE reporting any
    low-k value from that cell. IF A CELL FAILS, DO NOT ADJUST THE MAPPING
    SILENTLY AND DO NOT SEARCH FOR A MAPPING THAT PASSES: report the failure with
    the arrays selected, the computed value and the committed value, mark that
    cell DATA_AVAILABILITY_OUTCOME, and continue with the cells that pass.
    historical_cell_reconstruction.json is written UNCONDITIONALLY.

  committed_value_verifications_required_before_any_new_number:
  - The four fresh cells at k=17 must return 2.0488128380076307 / 2.960737268597787 / 0.32362272345795423 / 1.5943364808460014 and the three contrasts -1.091319093989102 / 1.545795451150731 / 0.3587893267978908, to within 1e-12 (EV-HQC-e458ef O5)
  - The four fresh cells at k=2 must return 0.580733 / 0.506553 / 0.628397 / 0.511866 to within 1e-4 (EV-HQC-e458ef O6)
  - Both 4-point ladders at k=17 must return 0.4734 (shard 5000, residual RMS 1.008) and 0.0115 (shard 8002, residual RMS 0.514) to within 1e-3 (EV-HQC-e458ef O16c)
  - The same-T noise handle at k=17 must return 4.063 / 1.895 with RMS 3.170, and at k=2 must return 0.061 / 0.105 (EV-HQC-e458ef O8 and its obstruction block)
  - Each historical cell's k=17 alpha must reproduce its committed value to 1e-12 (the reconstruction gate above)
  a_failure_of_any_verification_is_a_finding: >-
    A FAILURE OF ANY OF THESE IS A FINDING TO REPORT, NOT A NUMBER TO TUNE. Do
    not adjust an array selection, a window pairing, a tolerance or a fit method
    to make a verification pass.

  part_B_has_exactly_one_structural_change:
    changed: >-
      The draw. base ~ Binomial(n_e - 1 = 55, p) per trial; arm_i = base +
      Bernoulli_i(p) with an INDEPENDENT Bernoulli per arm. Each arm's marginal
      law is therefore Binomial(56, p) EXACTLY -- identical to BATCH-91929e's
      arms -- so any change in the band is attributable to the coupling alone.
      VERIFY AND REPORT the realized marginal mean and variance against
      Binomial(56, p) to within Monte Carlo error; that check is what makes the
      comparison controlled.
    unchanged: >-
      p is FROZEN at 0.31923392857142857 (the prior batch's calibrated value,
      reproduced exactly by its Validator) and is NOT re-calibrated. The ladder
      stays T in {5000, 10000, 20000, 40000}. R stays 200. The estimator path
      stays the same pinned arm_hists / evaluable_k / log2_A_from_hists /
      matched_pair_stats / 2-point-OLS chain, imported read-only.
    k_values: >-
      k = 5 and k = 10 as the directive names, PLUS k = 17 as a REQUIRED
      COMPARISON POINT, declared as a STRICT ADDITION and not a substitution:
      without it the coupled band cannot be compared against BATCH-91929e's
      uncoupled widths 2.788 and 3.188 or the reviewer-built coupled widths 3.398
      / 3.508 / 4.326, and that comparison is the only way to show the coupling
      change did what it was meant to do.

  every_banded_contrast_gets_its_own_directly_simulated_null: >-
    DO NOT band a single alpha and rescale it algebraically for main effects and
    interactions -- that is the exact defect DEC-20260817-2b638b rationale item
    (j) named as this campaign's third pre-registered-rule failure. Per replicate,
    draw FOUR independent null cells and form all five banded quantities: (1) a
    single cell alpha; (2) the regime main effect; (3) the shard main effect; (4)
    the interaction; (5) a same-(shard, regime) replication delta. Report each
    one's OWN mean, SD and 2.5 / 50 / 97.5 percentiles at each of k = 5, 10, 17,
    and report each contrast's MEASURED SD ratio against a single alpha's beside
    the analytic factors under cell independence (1.000, 1.000, 1.000, 2.000,
    1.414). A discrepancy above 10% is REPORTED AS A FINDING, not smoothed.

  the_two_blindness_tests_are_pre_declared_and_mechanical:
    SHAPE: >-
      Is the coupled null's median se_unpaired/se_paired at order k inside the
      closed range spanned by the eight real cells' values at the same k? At k=17
      that range is [2.338, 28.691]; BATCH-91929e's uncoupled null returned
      0.9965 and would have been declared SHAPE-BLIND by this test in advance.
      Compute the real cells' range at k=5 and k=10 from committed arrays so the
      test is evaluable at every k the rule uses.
    POWER: >-
      For each banded contrast at order k, does its minimum detectable effect --
      the smallest |contrast| its own 95% interval could ever declare outside --
      exceed 3.702 alpha units, the entire historical exponent spread? A band that
      cannot exclude the whole phenomenon is not a calibration.
    report_as_PASS_FAIL_without_interpretation: >-
      Compute and report both at each of k = 5, 10, 17 as PASS/FAIL. DO NOT
      declare the control BLIND in a verdict sense -- the Coordinator's frozen
      rule reads the two tests.
    no_planted_departure_leg_is_dispatched: >-
      DELIBERATE, AND A SUBSTITUTION DECLARED AS ONE. BATCH-91929e's Red Team
      showed its plant class could not fire at ANY magnitude -- rho peaks near
      1.3462 at g=2 and REVERSES to 0.8688 by g=50 against a required 2.5256 --
      and its "forced identity" check was shown to be an algebraic tautology
      whose residual measures float64 rounding (EV-HQC-e458ef O11). DO NOT re-run
      either, and do not invent a substitute leg of your own.

  standing_requirements:
    dominated_by_verbatim: >-
      low_k_report.md MUST record, verbatim, wherever it characterises the
      2-point local exponent: "4-rung OLS in log-log on identical data, SD
      0.234334 against 0.700666, a 2.99x noise reduction at zero cost." A
      dominated_by: null there would be a FABRICATION under AGENTS.md rule 9 and
      a violation of docs/inventor-protocol.md's Pareto-honesty obligation.
      Additionally report your own measured SD of the 2-point estimate and of the
      4-rung OLS on THIS batch's coupled replicates, beside those committed
      uncoupled figures.
    persist_per_trial_S_does_not_bind_here: >-
      SAID EXPLICITLY RATHER THAN OMITTED. DEC-20260817-2b638b next_actions item
      (3) makes persisting the retained per-trial S arrays a standing requirement
      "effective from the NEXT SAMPLING TASK". THIS TASK MAKES NO DECODER CALLS
      AND SAMPLES NOTHING, so it is not a sampling task and the requirement does
      not bind. State this in design.md and in run_manifest.yaml, and carry it
      forward by name to the next sampling task in this family.
    declare_the_procedural_asymmetry: >-
      In every HISTORICAL cell the two T-points come from DIFFERENT tasks in
      DIFFERENT processes; in all four FRESH cells both T-points are sliced from
      ONE call in ONE process. Report, per array read, the n_batches recorded
      beside it in its source file, and name the asymmetry as a standing
      limitation of any fresh-versus-historical comparison rather than letting a
      reviewer find it.
    pre_registration_anchor_honesty: >-
      Commit the pre-fill design.md as its own file state before filling it if
      you can. EV-HQC-e458ef O15(a) records that BATCH-91929e's pre-registration
      anchor was an UNVERIFIABLE SELF-ATTESTATION because the pre-fill blob was
      never committed anywhere and neither script printed the hash. DO NOT
      hand-author an anchor line into stdout.log. If you cannot commit a pre-fill
      blob, SAY SO PLAINLY and claim only content-corroboration, never
      independent anchoring.

