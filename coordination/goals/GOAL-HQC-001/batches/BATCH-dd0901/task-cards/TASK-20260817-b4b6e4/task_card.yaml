    GOAL-MLKEM-005 BATCH-0d5018 both required repair because a producer's actual
    writes did not match its declared artifact_paths.

  completion_gate:
  - design.md exists, demonstrably predates both results JSON files, and states Part A's window pairs and T values, the per-cell historical reconstruction mapping with exact JSON paths, the reconstruction gate and tolerance, the same-T noise handle definition, Part B's coupled draw and FROZEN p, the ladder, R, the five banded contrasts, the two blindness tests, the reduction protocol, and that the persist-per-trial-S requirement does not bind on this task
  - decoder_calls_made is reported as 0, both call counters are asserted zero at exit, and all three module sha256 pins re-verify ON DISK at exit -- or the run is reported ABORTED as an infrastructure outcome
  - historical_cell_reconstruction.json exists and reports PASS/FAIL per historical cell against the committed k=17 comparators at 1e-12, with the exact JSON path, length, ks range and n_batches of every selected array
  - Every committed-value verification is reported with its measured residual, and no array selection, window pairing, tolerance or fit method was adjusted to make one pass
  - low_k_recompute_results.json carries all eight cells at k=5, k=10 and every k in 2..26, the three contrasts at each k, both 4-point ladders with residual RMS and standard error, and the same-T noise handle per shard with its RMS at every k -- with NO conclusion drawn about which branch fires
  - coupled_null_control_results.json carries, at each of k = 5, 10 and 17, the coupled null's median se_unpaired/se_paired beside the real cells' range, five separately simulated banded-contrast distributions with mean/SD/percentiles, the measured-versus-analytic SD ratios, the SHAPE and POWER tests as PASS/FAIL, and the realized Binomial(56, p) marginal check
  - coupled_null_replicate_summary.csv carries one row per (contrast, rung-pair, k, replicate), sufficient to recompute every band without rerunning the ladder
  - cost_projection.json exists whether or not a reduction fired, and records the projection arithmetic and the achieved R and rungs
  - low_k_report.md records the dominated_by value verbatim and declares the historical-versus-fresh procedural asymmetry as a limitation
  - run_manifest.yaml carries command, git commit and dirty-tree state, environment, MEASURED module sha256 pins at load and at exit, every source file's path and measured sha256, decoder_calls_made, timings, core-seconds and wall-clock split by Part, achieved R and rungs, and validity status
  - All twelve declared artifact paths exist and no file outside the task's write_scope was created or modified
