  artifact_path_fidelity_note: >-
    ALL TWELVE ARE MANDATORY AND ALL ARE WRITTEN UNCONDITIONALLY, including
    stderr.log (empty is fine), cost_projection.json and
    historical_cell_reconstruction.json. If Part A aborts on the reconstruction
    gate, low_k_recompute_results.json is STILL written, carrying
    `status: aborted_on_reconstruction_gate` and null statistics -- it is never
