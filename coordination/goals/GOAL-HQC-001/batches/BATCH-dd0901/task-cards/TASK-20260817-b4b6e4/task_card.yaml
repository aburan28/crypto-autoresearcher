  budget:
    wall_clock_seconds: 300
    core_seconds: 150
    memory_gb: 4
    maximum_runs: 2
    decoder_calls: 0
    justification: >-
      HONESTLY SMALL BECAUSE THE WORK IS HONESTLY SMALL. Part A is pure
      arithmetic on committed JSON and costs well under a second. Part B repeats
      BATCH-91929e's Part B ladder (R=200 at four rungs) with a two-line change
      to the draw plus a contrast-simulation loop; BATCH-91929e's Part B MEASURED
      6.508 wall-clock / 7.664 core-seconds, and DEC-20260817-2b638b prices this
      half at roughly 7 core-seconds. 150 core-seconds is roughly 20x that --
      generous headroom for a task whose only cost risk is a numpy replicate loop
      -- and 300 wall-clock is 6.34% of the roughly 4,735.71 seconds remaining
      against campaign_budget.total_wall_clock_seconds, so even a full-cap spend
      leaves about 4,435.71. THE CAP WILL NOT BE RAISED AND A RAISE IS NOT
      SELF-GRANTABLE. Report MEASURED core-seconds and wall-clock, split by Part,
      so the ledger archive debits a measured number.
    cost_projection_reduction_protocol: >-
      Applied in order, never improvised. After the first 20 replicates of the
      T=40000 rung, project total Part B cost from measured per-replicate cost
      and write the arithmetic to cost_projection.json. (1) If the projection
      exceeds 60% of the 150 core-second authorization, reduce R to the largest
      multiple of 50 that fits, floor 100. (2) If R would fall below 100, instead
      restore R=200, drop the T=40000 rung, and re-project. (3) If still
      infeasible, report Part B as UNDERPOWERED with the achieved R and rungs and
      do NOT present its bands as a calibration. Write cost_projection.json
      UNCONDITIONALLY, recording no_reduction_fired: true when nothing fires.

