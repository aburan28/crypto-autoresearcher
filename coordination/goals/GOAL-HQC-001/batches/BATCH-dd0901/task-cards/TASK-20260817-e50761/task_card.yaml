    construction rather than by argument.

  archive:
    kind: snapshot
    source_task_ids:
    - TASK-20260817-b4b6e4
    record_ids:
    - EXP-HQC-982268
    record_ids_note: >-
      EXP-HQC-982268 is named as the experiment context this task family runs
      under. IT GAINS NO APPROVAL FROM THIS SNAPSHOT AND NONE IS IMPLIED; a
      snapshot is a freeze, not a transition.
    direct_dependency_note: >-
      TASK-20260817-b4b6e4 is the sole source and is listed in depends_on, as the
      dispatcher requires. The executor is claimed by THIS archive and by this one
      only -- listing it as a ledger source too would be a validation error, not
      extra safety.

  runs_alone: true
  runs_alone_note: >-
    Coordinator archive tasks run alone, never alongside another agent, and never
    race another worker on one Git index or HEAD. This commit MUST precede both
    TASK-20260817-cddd45 and TASK-20260817-785c5c.

  twelve_paths_verified_before_commit: >-
    Verify all TWELVE of TASK-20260817-b4b6e4's declared artifact paths exist
    before committing. If any is missing, DO NOT invent, substitute, estimate, or
    quietly narrow the declared set -- return the task to the executor with the
    missing paths named. GOAL-ECDLP-001 BATCH-7d9b78 and GOAL-MLKEM-005
    BATCH-0d5018 both required repair for exactly this class of mismatch;
    BATCH-91929e declared its set exactly and needed none.

  pre_registration_anchor_must_be_recorded_honestly: >-
    Record in the receipt whether the producer's design.md pre-fill blob was
    committed as its own file state before being filled. EV-HQC-e458ef O15(a)
    records that BATCH-91929e's pre-registration anchor was an UNVERIFIABLE
    SELF-ATTESTATION -- the pre-fill blob was never committed anywhere and
    neither script printed the hash -- and DEC-20260817-2b638b rationale item (h)
    records that THIS COORDINATOR relayed that claim as verified in its own
    snapshot receipt. If the producer could not commit a pre-fill blob, record
    "self-attested, content-corroborated by the scripts, not independently
    anchored" and RELAY NO PRE-REGISTRATION CLAIM AS VERIFIED.

  sync_discipline: >-
    Before generating, fetch origin/main and merge (never rebase) into the working
    branch, per CLAUDE.md's concurrency rules; record the base commit checked and
    the merge outcome in the receipt. After committing, push the branch and open
    or refresh the PR against main naming the records this archive carries. A
    record that exists only in a local commit is unpublished, not durable
    evidence. NEVER resolve a sync conflict by editing a record -- stop and create
    a superseding record.

  execution_boundary:
    experiment_runs: 0
    execution_authorized: false
    implementation_authorized: false
    official_status_change_authorized: false
    official_status_change_authorized_note: >-
      THIS IS A FREEZE, NOT A TRANSITION. Change no ledger record, no hypothesis
      status, no claim tier, no experiment approval, and not the goal head.
    evidence_promotion_authorized: false
    knowledge_index_write_authorized: false
    amazon_bedrock_selected_configured_probed_contacted_or_used: false

  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1

  write_scope:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/archives/TASK-20260817-e50761/
  artifact_paths:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/archives/TASK-20260817-e50761/snapshot-receipt.json

  completion_gate:
  - snapshot-receipt.json records the commit sha, the parent sha, the exact staged pathspec, and path_sha256 for every one of the twelve source artifacts plus the receipt itself
  - All twelve declared source artifact paths were confirmed present before the commit
  - The pre-registration anchor's status is recorded honestly, as verified-by-commit or as self-attested-and-content-corroborated, and no unverified pre-registration claim is relayed
  - The base commit checked and the merge outcome are recorded in the receipt
  - The branch is pushed and a PR against main is open or refreshed
  - The dispatcher's post-commit verifier accepts the archive before either review is dispatched
