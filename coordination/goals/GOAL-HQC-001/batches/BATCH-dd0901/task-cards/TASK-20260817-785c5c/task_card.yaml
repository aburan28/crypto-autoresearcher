  title: >-
    Red-team whether the low-k collapse is real or is an artifact of the
    reconstruction, and whether the coupled null is the sixth blind control

  objective: >-
    This task executes YOUR OWN named next_concrete_action from
    TASK-20260817-94c89e, adopted verbatim by DEC-20260817-2b638b as this
    campaign's single next action. Attack whether it actually discharges it. If
    the low-k collapse appears on the historical cells, is that a real property
    of the estimator at low k, or an artifact of how the historical cells were
    reconstructed -- of which arrays were paired, of the fact that each historical
    cell's two T-points come from different tasks in different processes, or of
    the k-dependence of the jackknife itself rather than of the exponent? If it
    does NOT appear, is the refutation real, or did the reconstruction pick the
    wrong arrays? And separately: is the coupled null a genuine per-contrast
    calibration, or the SIXTH instance of this campaign's control-blindness
    pattern, arriving one batch after you showed the fifth could not have fired at
    any planted magnitude?

  must_attack:
  - STATE PLAINLY WHETHER THE k-EXPLANATION SURVIVES. Do the four historical cells collapse toward 0.5 at k=5, and is that collapse the SAME phenomenon EV-HQC-e458ef O6 measured on the fresh four, or a different one that happens to point the same way? Name the mechanism you think is operating and say whether it is the one the campaign has been assuming
  - ATTACK THE RECONSTRUCTION AS THE LOAD-BEARING STEP IT IS. Could a different pairing of committed arrays reproduce a cell's committed k=17 value to 1e-12? Do the T values, jackknife batch counts, pooling conventions and evaluable_k ranges of the paired arrays actually match what each cell's exponent assumed? If a historical cell's two T-points are not like-for-like, the whole batch's headline is compromised - say so if it is
  - TRACE THE ACTUAL CODE, NOT THE DESIGN DOCUMENT'S ARGUMENT, for the array selection, the alpha arithmetic, the 4-point ladder fit and the coupled draw - the discipline that found the O7 collinearity, the algebraic tautology and the saturating plant class in the first place
  - ATTACK THE COUPLED NULL HARDEST AND SAY EXPLICITLY WHETHER IT IS THE SIXTH BLIND CONTROL. Does base ~ Binomial(55, p) plus an independent Bernoulli per arm reproduce the real pair's coupling, or merely A coupling with the right marginal and the wrong dependence structure? The real arms differ on the last block on only 10.4%-11.4% of trials; this construction lets it differ on 2p(1-p), about 43%. Fatal or scoped? Note that your own prior report flagged exactly this ratio problem in the Validator's coupled null. Would a defect in log2_A_from_hists or in the jackknife batching survive this null undetected at k=5 specifically, where the histogram functional is not tail-carried?
  - ATTACK THE FROZEN READING RULE. Its 0.25 proximity floor and factor-2 contraction threshold are arbitrary and declared as such - do they let a real failure to collapse be recorded as a collapse, or vice versa? Is the 2x2 truth-table exhaustiveness argument sound, or does it cover the outcome space while mis-assigning readings? Is the BLIND fallback genuinely mechanical, or does it hide a judgment call? THIS CAMPAIGN HAS PRODUCED THREE PRE-REGISTERED RULES THAT FAILED TO COVER THEIR OWN OUTCOME - say whether this is a fourth, and if it is not, say what specifically makes it different
  - INDEPENDENTLY PROBE THE NOISE FLOOR AT LOW k. The same-T handle at k=17 was 4.063 / 1.895 and at k=2 was 0.061 / 0.105, both YOUR measurements. Compute it at k=5 and k=10 yourself and state whether the collapse in the noise handle is the same object as the collapse in the exponents or an independent fact. If your probe disagrees with the executor's, that disagreement is the finding
  - SAY WHETHER A USABLE V1 SIZING LAW NOW EXISTS. DEC-20260817-2b638b made V1's fourth deferral conditional on this task delivering one (low-k cells where the estimator's bias is 7e-5, plus a >= 3-rung ladder exponent with its measured scatter) and recorded that a FIFTH deferral would need a reason it does not supply. Does this task deliver it? If not, say exactly what is still missing
  - SAY WHAT IS STILL NOT KNOWN AFTER THIS TASK, and name the single cheapest next control that would resolve it. If your honest position is that this instrument family should stop rather than continue, say that plainly and give the evidence - but do not treat a target as saturated merely because it is hard, per docs/inventor-protocol.md Section 4

  fair_targets_named_explicitly: >-
    batch.yaml IN ITS ENTIRETY is a fair target: the frozen reading rule, its
    thresholds, its exhaustiveness argument, its two blindness tests, its
    branch-to-scope knowledge-promotion map, the historical-cell reconstruction
    mapping, the budget justification, and this Coordinator's decision to
    substitute two structural blindness tests for a planted-departure leg. So is
    every prior Coordinator framing in this campaign, including the ones in
    DEC-20260817-2b638b.

  boundaries:
    independent_session: >-
      Do not continue the producing agent's session. Do not read or modify the
      concurrent Validator task directory.
    separate_soundness_from_meaning: >-
      Contest numbers where you can reproduce a contradiction, and separate
      objections about what numbers MEAN from objections about whether they are
      SOUND. The prior report's verdict of
      objections_material_to_conclusions while contesting no reported number is
      the model.
    no_reading_rule: >-
      You do NOT apply batch.yaml's frozen reading rule and you name no branch.
      You attack whether the rule is any good.
    change_no_state: >-
      Change no record status, edit no producer artifact, promote no knowledge
      entry, and move no hypothesis or claim tier.

  execution_boundary:
