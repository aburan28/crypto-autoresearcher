  completion_gate:
  - Every must-attack item is answered explicitly
  - The report states plainly whether the k-explanation survives on the four historical cells, and names the mechanism it thinks is operating
  - The historical-cell reconstruction is attacked directly, including whether a different array pairing could pass the 1e-12 gate and whether the paired arrays are like-for-like in T, n_batches, pooling convention and evaluable range
  - An explicit position is stated on whether the coupled null is the sixth instance of the control-blindness pattern, addressing the ~43%-versus-~11% last-block perturbation rate
  - The frozen reading rule is assessed for whether it covers the observed outcome and whether its arbitrary thresholds and BLIND fallback hide a judgment call, with an explicit position on whether this is a fourth rule-coverage failure
  - An independent probe of the same-T noise handle at k=5 and k=10 is reported, agreeing or disagreeing with the executor's
  - An explicit statement is made on whether a usable V1 sizing law now exists
  - The single cheapest next control that would resolve what remains unknown is named concretely
  - Both declared artifact paths exist, with red_team_probe.json written unconditionally
