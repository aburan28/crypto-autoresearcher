  title: >-
    Validate the historical-cell reconstruction, the eight low-k cells, the
    zero-decoder-call gate and the coupled null's per-contrast distributions by
    independent recomputation

  objective: >-
    Independently validate, by recomputation from the frozen snapshot bytes and
    from data your own driver generates, that (1) the historical-cell
    reconstruction selects the RIGHT arrays; (2) the four historical and four
    fresh cells at k=5 and k=10 are correct arithmetic on the arrays actually
    selected; (3) the task genuinely made ZERO decoder calls and modified no
    pinned module; (4) the coupled null's five banded contrasts each have a
    DIRECTLY SIMULATED null distribution rather than an algebraic rescaling of a
    single alpha's; and (5) the coupled draw really does preserve the
    Binomial(56, p) marginal, so the band comparison against BATCH-91929e is
    controlled.

  the_load_bearing_target: >-
    ATTACK THE RECONSTRUCTION FIRST, BECAUSE EVERYTHING ELSE RESTS ON IT.
    batch.yaml's mapping of which committed arrays produced each historical cell
    is a COORDINATOR RECONSTRUCTION, not a fact, and the producer's own 1e-12
    gate is the only thing standing between it and eight wrong numbers.
    Independently locate the two per-k se_paired arrays that actually produced
    each cell's committed k=17 exponent -- without reading the producer's mapping
    first if you can avoid it -- and then ask the sharper question the gate does
    not answer: COULD A DIFFERENT PAIRING OF COMMITTED ARRAYS ALSO REPRODUCE THAT
    CELL'S k=17 VALUE TO 1e-12? If so, the gate is weaker than it looks and you
    must say so.

  must_check:
  - Independently establish, for all four historical cells, which two committed per-k se_paired arrays produced its k=17 exponent, and whether a different pairing could also pass the 1e-12 gate
  - Confirm or refute the T values (5,000 -> 10,000 for regime P; 10,000 -> 20,000 for regime N) and report the n_batches, ks range and evaluable range beside each selected array
  - Independently recompute all eight cells at k=5, k=10 and k=17, the three contrasts at each k, both 4-point ladders with residual RMS and standard error, and the same-T noise handle at every k, stating the tolerance achieved and whether exact float64 identity was reached
  - Verify the zero-decoder-call claim AS A CONSTRUCTION by reading both drivers - could _t_shard or decode_blocks be reached on any path, including through matched_pair.py's selftests? Are the call-counting wrappers installed before any use and unbypassable? Independently re-verify all three pinned module sha256 values on disk
  - Verify that base ~ Binomial(55, p) plus an independent Bernoulli(p) per arm yields the Binomial(56, p) marginal, that p is FROZEN at 0.31923392857142857 and not silently re-calibrated, and that NOTHING ELSE changed from BATCH-91929e's Part B - if anything else changed, the band comparison is not controlled
  - Verify by code reading that the five banded distributions are formed per replicate from four independently drawn null cells and are NOT rescaled algebraically from a single alpha's SD; independently recompute at least three of the five bands from coupled_null_replicate_summary.csv; check the measured-versus-analytic SD ratios against 1.000 / 1.000 / 1.000 / 2.000 / 1.414
  - Render an explicit judgment on both pre-declared blindness tests - are SHAPE and POWER genuine tests, or can either pass or fail for a reason unrelated to the control's sensitivity? Say explicitly whether this coupled null is the SIXTH instance of this campaign's control-blindness pattern
  - Verify every committed-value verification the producer reported, and check that no array selection, window pairing, tolerance or fit method was adjusted to make one pass
  - Confirm all twelve producer artifact paths exist, none is missing, and no undeclared file was written - verified in BOTH directions against the snapshot tree

  required_judgments_rendered_separately: >-
    THREE, EACH ANSWERED INDEPENDENTLY AND PLAINLY; THEY CAN DIFFER. (a) Is the
    historical-cell reconstruction ADMISSIBLE? (b) Is the low-k recompute an
    ADMISSIBLE measurement of the eight cells at k=5? (c) Is the coupled null an
    ADMISSIBLE per-contrast calibration? Plus a verdict of ADMIT or DO-NOT-ADMIT.

  boundaries:
    independent_session: >-
      Do not continue the producing agent's session. Do not read or modify the
      concurrent Red Team task directory.
    recompute_do_not_trust: >-
      Every reported figure you admit must be recomputed from bytes at the
      snapshot commit or from data your own driver generated. Producer summaries
      are not evidence of themselves.
    no_reading_rule: >-
      You do NOT apply batch.yaml's frozen reading rule and you name no branch.
      You judge whether the delivered numbers are the ones the rule needs.
    change_no_state: >-
      Change no record status, edit no producer artifact, promote no knowledge
      entry, and move no hypothesis or claim tier.
    answer_passing_items_too: >-
      Answer every must-check item explicitly, INCLUDING the ones that pass.

  execution_boundary:
    experiment_runs: 1
    execution_authorized: true
    execution_authorized_note: >-
      Authorized to run your OWN independent recomputation drivers. You may
      re-run the coupled null and any arithmetic on committed arrays. You are NOT
      authorized to make decoder calls -- the batch authorizes zero, and a review
      that makes one would spend budget the batch does not have and would break
      the very gate it is checking.
    decoder_calls_authorized: 0
    implementation_authorized: false
    official_status_change_authorized: false
    evidence_promotion_authorized: false
    knowledge_index_write_authorized: false
    amazon_bedrock_selected_configured_probed_contacted_or_used: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
    debit_note: >-
      Reviewer session time is NEVER debited against
      campaign_budget.total_wall_clock_seconds, per this campaign's debit
      convention, unchanged since BATCH-412513. Only executor-MEASURED spend is.

  write_scope:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/reviews/TASK-20260817-cddd45/
  write_scope_note: >-
    reviews/, NOT red-team/ and NOT a validator/ sibling. THERE IS NO red-team/
    DIRECTORY IN THIS BATCH. The queue, this card and the handoff agree exactly.
    If any dispatch prompt says otherwise, THE COMMITTED CONTRACT GOVERNS: write
    to the committed path and flag the discrepancy (AGENTS.md "Inter-agent
    messaging"; DEC-20260817-2b638b rationale item (i)).
  artifact_paths:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/reviews/TASK-20260817-cddd45/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-dd0901/reviews/TASK-20260817-cddd45/validator_recompute.json
  artifact_path_fidelity_note: >-
    BOTH paths are declared and BOTH are written UNCONDITIONALLY.
    validator_recompute.json carries your independently recomputed cells,
    contrasts, ladders, noise handle and bands, so your arithmetic is checkable
    rather than only assertable; if you have nothing beyond the report to record,
    write {"no_auxiliary_output": true} into it rather than omitting it. Write no
    file outside these two paths.

  completion_gate:
  - Every must-check item is answered explicitly, including the ones that pass
  - The historical-cell array selection is independently established for all four cells, and the question of whether a different pairing could also pass the 1e-12 gate is answered
  - All eight cells at k=5, k=10 and k=17, the three contrasts, both 4-point ladders and the same-T noise handle are independently recomputed, with the tolerance achieved stated
  - The zero-decoder-call claim is verified as a construction by code reading plus an independent on-disk sha256 re-verification of all three pinned modules
  - The coupled draw's Binomial(56, p) marginal and the frozen p are independently verified, and it is confirmed that nothing else changed from BATCH-91929e's Part B
  - At least three of the five banded contrasts' bands are independently recomputed from the replicate CSV, and the measured-versus-analytic SD ratios are checked
  - An explicit position is stated on whether this coupled null is the sixth instance of the control-blindness pattern
  - Three separate admissibility judgments are rendered and a verdict of ADMIT or DO-NOT-ADMIT is stated plainly
  - Both declared artifact paths exist, with validator_recompute.json written unconditionally
