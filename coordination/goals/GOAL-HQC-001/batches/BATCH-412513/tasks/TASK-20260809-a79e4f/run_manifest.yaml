  environment:
    python: 3.13.1 (v3.13.1:06714517797, Dec 3 2024, 14:00:22) [Clang 15.0.0 (clang-1500.3.9.4)]
    python_executable: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3
    platform: macOS-26.6-arm64-arm-64bit-Mach-O
    machine: arm64
    numpy: 2.4.0
    cpu_count: 14
    affinity: 14
    third_party_used: [numpy]
    environment_deviation_from_pilot: >-
      TASK-20260806-77a574's environment was Linux-6.18.5-fc-v18-x86_64
      running Python 3.11.15 / numpy 2.4.6. This task ran on
      macOS-26.6-arm64 / Python 3.13.1 / numpy 2.4.0. The determinism gate
      (Section 2.1 of design.md) exists precisely to test whether this
      cross-platform/cross-numpy-version difference affects the committed
      bit-for-bit results, and it PASSED: both crossed-configuration
      S_histogram arrays reproduced pilot_results.json's committed arrays
      exactly, and the shard-5000-defected point estimate at k=17
      (-1.0857050120231229) reproduced the pilot's own reported value to
      full float precision. Recorded as a disclosed environment difference,
      not concealed.

  seeds_and_randomness:
    prng: >-
      SHA-256 counter mode (stage_a.py's own CTRStream), unmodified, called
      exactly as stage_a.py's own _t_shard calls it. Key derivation is
      stage_a.py's own sha_key(ps_id, "T", shard, MASTER_SEED); this task's
      driver (dual_decode_shard) supplies only the shard index, never a new
      derivation scheme.
    master_seed: 20260804 (stage_a.py's own MASTER_SEED, unmodified, reused)
    stage1_shards: [5000, 6000]  # already committed by the pilot; zero new draws
    stage2_shards_used: [8000, 8001, 8002, 8003]  # fresh, pre-declared in design.md before stage 1 ran
    stage2_shards_declared_but_unused: [8004, 8005, 8006, 8007, 8008, 8009, 8010, 8011]
    zero_new_entropy_in_stage1: >-
      TRUE. Both decode variants on a given shard are produced by ONE call
      to dual_decode_shard(), which generates each batch's bit array exactly
      once (sha_key/CTRStream/fixed_weight_support/ring_mul_sparse, byte-
      identical to stage_a.py's _t_shard generation body) and decodes that
      SAME array twice, so the true and defected arms at a given shard share
      identical underlying random draws by construction, not by post-hoc
      pairing. No PRNG state or seed used here differs from what
      stage_a.py's own _t_shard would draw for shards 5000/6000 -- this is a
      deterministic replay of the pilot's own committed draws, not a new
      sample. Verified externally by the determinism gate (Section 2.1).
    injection_invariant_selftest_prng: numpy default_rng(12345), synthetic
      4x(n_e*n_2) bit array, no real pipeline draws consumed. Run once per
      stage invocation (identical to pilot_injection.py's convention).
    only_source_of_randomness: the above; no other randomness is used
      anywhere in matched_pair.py.

