    zero-new-entropy reconstruction of the pilot's own committed shards
    5000/6000 (10,000 matched pairs); Stage 2 a fresh-shard extension at
    T2=20,000 (pre-registered clamp formula applied to Stage 1's own
    measured SE). NOT the full T_req run. Nothing here is a statement about
    HQC, A17, A5, any decoding-failure rate, or any standardized parameter
    set.

