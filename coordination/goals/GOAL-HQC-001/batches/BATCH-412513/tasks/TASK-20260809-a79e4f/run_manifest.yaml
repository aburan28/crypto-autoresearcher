run_manifest:
  task_id: TASK-20260809-a79e4f
  role: executor
  goal: GOAL-HQC-001
  batch: BATCH-412513
  experiment_id: EXP-HQC-982268
  hypothesis_id: H-HQC-18d1b4
  authorizing_decision: DEC-20260809-46e85c
  claim_tier: toy

  scope_statement: >-
    TOY, hard ceiling. PS-R3 reduced parameters only (n=7187, n_e=56, N=7168,
    k=m=17). One defect class (V3, last-block-window-read-early), one
    injection point (decode_blocks's block window, last block only).
    Nothing here is a statement about HQC's IND-CCA security, its
    decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Standardized-parameter runs are OUT OF SCOPE and
    unauthorized.

  runs_authorized: 2
  runs_used: 2

  run_1_stage_1:
    name: deterministic zero-entropy reconstruction of the pilot's own shards
    command: >-
      PYTHONDONTWRITEBYTECODE=1 python3 matched_pair.py --stage 1 --out-dir .
    working_directory: coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f
    exit_code: 0
    started_at_utc: '2026-08-14T06:57:38Z'
    finished_at_utc: '2026-08-14T06:57:47Z'
    validity_status: valid_measurement
    determinism_gate: PASS

  run_2_stage_2:
    name: matched-pair extension at a pre-registered size (fresh shards 8001/8002)
    command: >-
      PYTHONDONTWRITEBYTECODE=1 python3 matched_pair.py --stage 2 --out-dir .
    working_directory: coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f
    exit_code: 0
    started_at_utc: '2026-08-14T06:57:59Z'
    finished_at_utc: '2026-08-14T06:58:18Z'
    validity_status: valid_measurement
    t2_matches_preregistered_rule: true

  stdout_log: stdout.log
  stderr_log: stderr.log
  stderr_empty: true

  git:
    commit: 63ba7808cb054659455945915dc8f3446d4a6b04
    branch: claude/run-experiments-lc5syr
    dirty_at_run_time: true
    dirty_paths:
      - '?? coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/design.md'
      - '?? coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair.py'
    dirty_note: >-
      Both runs' internally-recorded git state (matched_pair_results.json.stage_1/stage_2.git)
      show only this task's own not-yet-committed output directory as dirty --
      benign and expected pre-snapshot, identical pattern to every prior task
      in this campaign's run_manifest.yaml files (e.g.
      TASK-20260806-77a574/run_manifest.yaml records the same thing). The
      repository tree before this task's own directory was created was
      clean, matching the task_card's pre-dispatch state.
    commit_recorded_by_both_runs: >-
      Both stage-1 and stage-2 invocations independently recorded
      git rev-parse HEAD = 63ba7808cb054659455945915dc8f3446d4a6b04 (see
      matched_pair_results.json.stage_1.git.commit /
      matched_pair_results.json.stage_2.git.commit); no commit occurred
      between the two runs.

  environment:
    python: 3.11.15 (main, Mar  3 2026, 09:26:23) [GCC 13.3.0]
    python_executable: /usr/local/bin/python3
    platform: Linux-6.18.5-fc-v20-x86_64-with-glibc2.39
    machine: x86_64
    numpy: 2.4.6
    cpu_count: 4
    affinity: 4
    third_party_used: [numpy]
    protocol_deviation_numpy_install: >-
      numpy was not present in this session's Python environment at task
      start (`ModuleNotFoundError: No module named 'numpy'` on the first
      --stage 1 invocation, which exited 1 with no data generated -- an
      infrastructure_error, not a measurement, and no result was reported
      from that attempt). Installed via `pip3 install --user numpy`, which
      resolved the identical version (2.4.6) every prior task in this
      campaign records using. This is an environment-provisioning event
      recorded per AGENTS.md rule 5 (infrastructure signal, not evidence
      about the mathematics) and per the executor's obligation to record all
      deviations, not just the ones that succeed silently.

  reused_inputs:
    - path: coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/tasks/TASK-20260806-64b506/stage_a.py
      sha256_expected: 06a0a618432c00fe26c72ecf05a8d89489db61c5183931fdb76a378717681405
      sha256_actual: 06a0a618432c00fe26c72ecf05a8d89489db61c5183931fdb76a378717681405
      match: true
      loaded: importlib.util, read-only, fail-closed on mismatch
      reused_symbols:
        - PARAM_SETS (PS-R3 entry), sha_key, CTRStream, fixed_weight_support,
          ring_mul_sparse, decode_blocks (called UNMODIFIED, wrapped not
          edited), _t_shard, hist_of, batch_hists, evaluable_k,
          N_JACK_BATCHES, T_STAB_THRESHOLD, MASTER_SEED
      modified_on_disk: false
    - path: coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-cde749/measure.py
      sha256_expected: a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8
      sha256_actual: a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8
      match: true
      loaded: importlib.util, read-only, fail-closed on mismatch
      reused_symbols: [comb_matrix, log2_A_from_hists]
      modified_on_disk: false
    - path: coordination/goals/GOAL-HQC-001/batches/BATCH-2ecaa1/tasks/TASK-20260806-77a574/pilot_results.json
      role: >-
        read-only input to stage 1's determinism gate (committed
        MEASUREMENT.defected.S_histogram / MEASUREMENT.undefected.S_histogram
        arrays), opened for reading only, never written.
      modified_on_disk: false
  hash_pins_identical_to: >-
    Both sha256 pins are identical to the values pilot_injection.py and
    every prior arm in this campaign pinned for the same two files.

  seeds_and_randomness:
    prng: >-
      SHA-256 counter mode (stage_a.py's own CTRStream), unmodified. Key
      derivation is stage_a.py's own sha_key(ps_id, "T", shard, MASTER_SEED),
      called internally by the unmodified _t_shard -- this task supplies
      only the shard index, not a new derivation scheme.
    master_seed: 20260804 (stage_a.py's own MASTER_SEED, unmodified, reused)
    stage_1_shards: [5000, 6000]
    stage_1_shard_roles: >-
      Each shard decoded through BOTH variants (crossed): shard 5000
      defected (GATE, reproduces TASK-20260806-77a574's original config) and
      undefected (CROSSED, new); shard 6000 undefected (GATE, reproduces
      original config) and defected (CROSSED, new). Zero new PRNG
      consumption relative to the pilot's own committed shards -- CTRStream
      is keyed by (ps_id, shard, trial index, MASTER_SEED), independent of
      which decode_blocks is installed at call time.
    stage_1_warmup_shards: "[4900, 4901] (identical to pilot_injection.py, throwaway, not measured)"
    stage_2_shards: [8001, 8002]
    stage_2_shards_fresh: >-
      Chosen in design.md BEFORE stage 1 ran. Disjoint from every shard used
      anywhere in this campaign's committed record (0-3, 900, 999,
      1000-1007, 4900, 4901, 5000, 6000, 7777, 7778, 424242).
    stage_2_trial_split: T2=20000 split T2a=10000 (shard 8001), T2b=10000 (shard 8002)
    injection_invariant_selftest_prng: numpy default_rng(12345), synthetic
      4x(n_e*n_2) bit array, no real pipeline draws consumed.
    only_source_of_randomness: the above; no other randomness is used
      anywhere in matched_pair.py.

  budget:
    core_seconds_authorized: 400.0
    stage_1_core_seconds_spent: 9.66
    stage_2_core_seconds_spent: 18.857
    total_core_seconds_spent: 28.517
    wall_seconds_authorized: 1800.0
    stage_1_wall_seconds_spent: 9.45
    stage_2_wall_seconds_spent: 18.649
    total_wall_seconds_spent: 28.099
    within_budget: true
    memory_gb_authorized: 2
    peak_memory_observed: not separately instrumented; process footprint at
      trial counts up to 20,000 of (56, 7168)-shaped uint8/int arrays is on
      the order of low hundreds of MB, well under the 2 GB authorization
      (consistent with the pilot's own note at 5,000-10,000 trials being
      "low tens of MB").
    cores_used: >-
      1 per invocation (no multiprocessing -- _t_shard called directly,
      single process per stage, identical rationale to pilot_injection.py:
      monkey-patch propagation to worker processes is unambiguous only in a
      single process, and trial counts here are cheap enough that
      multiprocessing overhead would exceed the benefit).
    campaign_budget_note: >-
      GOAL-HQC-001's campaign_budget.total_wall_clock_seconds is 10,800 and
      is a LIVE pause condition. This task's measured total wall-clock spend
      is 28.099 seconds; this is the executor's measured figure for the
      ledger archive to debit, not an estimate.

  fail_closed_checks:
    - name: stage_a.py sha256 integrity
      reads: STAGE_A_PY_EXPECTED_SHA256 (module constant) vs sha256_file(STAGE_A_PY)
      aborts_on_mismatch: true
      verified_by: >-
        deliberate-mismatch dry run inside each authorized run
        (selftest_fail_closed_sha_mismatch(), executed automatically before
        any real module load, identical mechanism to pilot_injection.py) --
        NOT by editing-then-reverting the committed constant. See
        matched_pair_results.json.stage_1/stage_2.fail_closed_selftests.sha256_pin_mismatch.
      fired_in_authorized_runs: false (both real loads, with the correct pin, succeeded)
    - name: measure.py sha256 integrity
      reads: MEASURE_PY_EXPECTED_SHA256 (module constant) vs sha256_file(MEASURE_PY)
      aborts_on_mismatch: true
      verified_by: same mechanism/function as stage_a.py's check above
      fired_in_authorized_runs: false
    - name: injection invariant (design.md Section 6)
      reads: perturbed last-block bit window vs the pre-registered
        shift-by-1 construction, checked on every defected decode_blocks
        call (i.e. every trial batch)
      aborts_on_mismatch: true
      verified_by: >-
        deliberate-mismatch dry run (selftest_injection_invariant_fail(),
        executed automatically inside each authorized run before any real
        trial data is generated). See
        matched_pair_results.json.stage_1/stage_2.fail_closed_selftests.injection_invariant_mismatch.
      fired_in_authorized_runs: false (the real injection never violated its
        own invariant; only the deliberate-mismatch selftest fired, as intended)
    - name: stage 1 determinism gate (design.md Section 2)
      reads: reproduced S_histogram (shard 5000 defected, shard 6000
        undefected, original configuration) vs pilot_results.json's committed
        MEASUREMENT.defected/undefected.S_histogram arrays, elementwise
        integer equality
      aborts_on_mismatch: true (stage 1 would report invalid_measurement /
        infrastructure_error and no crossed arm or jackknife would be
        computed; stage 2 would refuse to run per its own precondition check)
      result: PASS -- both arrays bit-identical (see
        matched_pair_results.json.stage_1.determinism_gate)
    - name: D2 (exact generation weight) / D3 (support cap) hard invariants
      reads: r["d2_fail"] / r["d3_fail"] from every sa._t_shard call, on
        every arm of both stages (4 arms stage 1, 4 arms stage 2)
      result: 0 violations on all 8 arms (see
        matched_pair_results.json.stage_1/stage_2.hard_invariants)

  results_summary:
    stage_1_primary_cell_k17_pooled:
      diff_defected_minus_undefected: 0.05156735022229597
      se_paired_matched_pair_jackknife: 0.09678123828590589
      se_unpaired_independent_arm_quadrature: 0.3046634927024136
      unpaired_over_paired_ratio: 3.1479602668690108
      z_paired: 0.5328238317219965
    stage_2_primary_cell_k17_pooled:
      T2: 20000
      diff_defected_minus_undefected: 0.011084663965455377
      se_paired_matched_pair_jackknife: 0.017905406056621925
      se_unpaired_independent_arm_quadrature: 0.2777809102020648
      unpaired_over_paired_ratio: 15.513801213088579
      z_paired: 0.6190680027251297
    fitted_se_vs_trial_count_exponent_alpha: 1.4704932987763473
    fitted_exponent_declared_consistency_band: [0.4, 0.6]
    full_detail: see matched_pair_results.json (stage_1, stage_2 keys) and matched_pair_report.md

  validity:
    stage_1:
      status: valid_measurement
      reason: >-
        All pre-registered mechanically-sound criteria (design.md Section 7)
        were met: determinism gate PASS, both fail-closed selftests PASS,
        the injection wrapper calls the real unmodified decode_blocks
        (confirmed by id() identity), D2/D3 hard invariants are clean (0
        violations) on all four arms, the pooled estimator returns finite
        diff and finite positive SE_paired at k=m=17, and no arm was
        truncated by its wall-clock cap.
    stage_2:
      status: valid_measurement
      reason: >-
        All pre-registered mechanically-sound criteria (design.md Section 7)
        were met: both fail-closed selftests PASS, wrapper genuinely calls
        the unmodified decode_blocks, D2/D3 clean on all four fresh-shard
        arms, the pooled estimator returns finite diff and finite positive
        SE_paired at k=17, no arm truncated, and T2 actually run (20,000)
        equals the pre-registered clamp formula applied to stage 1's
        measured SE (substitution shown in
        matched_pair_results.json.stage_1.stage2_sizing.substitution_shown).
    certificate:
      kind: none
      reason: >-
        This run makes no discrete-log-solve or factor-base-relation claim;
        AGENTS.md/docs/claims-and-verification.md's certificate discipline
        does not apply. This is a joint-moment estimator measurement on a
        toy-scale reduced parameter set, not a solve.

  protocol_deviations:
    - >-
      numpy was not installed in this session's environment at task start;
      the first execution attempt (--stage 1) exited 1 with
      ModuleNotFoundError before any data was generated (no result reported
      from that attempt) and numpy 2.4.6 was installed via
      `pip3 install --user numpy` before re-running. See environment section
      above. This is an infrastructure/environment-provisioning event, not a
      measurement outcome, and does not affect stage 1's or stage 2's
      reported validity.
    - >-
      Stage 2's fitted SE-vs-trial-count exponent (alpha = 1.470) falls
      OUTSIDE the pre-registered 1/sqrt(T)-consistency band [0.4, 0.6]
      declared in advance by DEC-20260809-46e85c. Per that decision, this
      finding SUPERSEDES branches A/B/C of the pre-registered decision rule.
      The Executor reports this measurement and does not apply the
      Coordinator's decision rule or interpret what it implies for the
      required-T derivation.
    - >-
      No other deviation from design.md. The crossed stage-1 configuration,
      the determinism gate, the stage-2 sizing formula and substitution, the
      primary cell (k=17), the matched-pair jackknife construction, and the
      pre-registered stage-2 shard indices (8001, 8002) were all executed
      exactly as pre-registered.

  anomalies:
    - >-
      Stage 1's per-shard matched-pair point estimates at k=17 (shard 5000:
      diff=+0.1018, se_paired=0.1251, z=0.814; shard 6000: diff=+0.0108,
      se_paired=0.1499, z=0.072) agree in SIGN with each other and are both
      well under |z|=1.96 individually -- this does NOT meet
      DEC-20260809-46e85c's BRANCH E anomaly definition (which requires the
      two shards to disagree in sign with each individually significant at
      |z|>=1.96), so BRANCH E is not triggered by stage 1 alone. Recorded
      here for completeness per AGENTS.md rule 8, not as a triggered branch.
    - >-
      Stage 1's measured pooled SE_paired at k=17 (0.0968) is materially
      SMALLER than the value the derivation's 1/sqrt(T)-scaled expectation
      predicted from the Red Team's single-shard SE (~0.140, per
      design.md Section 2 and DEC-20260809-46e85c's stated pre-run
      expectation). Recorded as an observation, not smoothed over or
      discarded; it is one of the inputs to the exponent fit reported above,
      which the fit shows deviates substantially from 1/sqrt(T) scaling
      over these three points.

