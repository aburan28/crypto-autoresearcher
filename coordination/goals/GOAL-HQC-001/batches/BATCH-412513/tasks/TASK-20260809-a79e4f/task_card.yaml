  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 2
    core_seconds: 400
    expected_core_seconds: '30-80, by arithmetic on the committed throughput of about 2,100
      trials/core-second (executor 2,097.6 / 2,105.6; Validator 4-repeat means 2,090.8 / 2,096.6).
      Stage 1 is roughly 10,000 trials generated with two decode passes each; stage 2 is of order 3.9e4
      trials likewise. The decode-only fraction has never been measured separately in this campaign and
      is NOT estimated here, so the upper end assumes a full second pipeline pass.'
    budget_note: 'campaign_budget.total_wall_clock_seconds is 10,800 and is a LIVE pause condition.
      reanalysis_report.md section 0 states roughly 4,973 seconds remained at BATCH-2ecaa1''s close;
      that is THAT REPORT''S figure, carried forward from BATCH-2ecaa1''s checkpoint, and it is NOT
      independently re-derived here. Report actual spend so a measured number can be debited.'
  pre_registered_decision_rule_applied_by_coordinator: 'The executor does NOT apply this; it is recorded
    here so the executor can see what its numbers will be used for and cannot be asked afterwards for a
    quantity nobody requested. Primary evaluation is on STAGE 2 at k=17. BRANCH A, DETECTED: |z| >= 1.96
    with sign agreeing with stage 1''s pooled sign. BRANCH B, NULL WITH A STATED MINIMUM DETECTABLE
    EFFECT: |z| < 1.96 AND |diff| + 1.96 * SE < 0.19. BRANCH C, STILL AMBIGUOUS: |z| < 1.96 AND
    |diff| + 1.96 * SE >= 0.19; C1 if |diff| >= 0.10 with sign consistent with stage 1, C2 if
    |diff| < 0.10. BRANCH D, INVALID/INFRASTRUCTURE: the stage-1 determinism gate fails, or a D2/D3
    violation, or a crash, or a budget overrun -- infrastructure signal, never a negative mathematical
    result, no branch fires. BRANCH E, ANOMALY: stage 1''s two shards disagree in sign with each
    individually at |z| >= 1.96 -- recorded under AGENTS.md rule 8, not interpretable, A/B/C do not fire.
    The fitted SE-versus-T exponent SUPERSEDES A/B/C if it falls outside [0.4, 0.6].'
  completion_gate:
  - design.md exists and predates matched_pair_results.json, and states the crossed stage-1
    configuration, the bit-identity gate, the stage-2 sizing formula with delta=0.20 / z=2.80 / clamp
    [20000, 60000], the primary cell k=m=17, the matched-pair jackknife construction, and the fresh
    stage-2 shard indices
  - Stage 1's determinism gate is reported as PASS with the reproduced S-histograms shown bit-identical
    to pilot_results.json's committed arrays, or the run is reported ABORTED as an infrastructure outcome
  - Per-trial S arrays in trial order are persisted for every stage-1 arm, so the pairing is auditable
  - matched_pair_results.json carries per-shard and pooled matched-pair diff, paired SE, unpaired SE,
    their ratio, and z at k=17 and across k=2..26, for both stages
  - The fitted SE-versus-trial-count exponent across the three trial counts is reported
  - The stage-2 trial count actually run equals the pre-registered clamp formula applied to stage 1's
    measured pooled SE, with the substitution shown
  - matched_pair.py reuses stage_a.py and measure.py via sha256-pinned read-only import, with only the
    injection wrapper, driver, and matched-pair jackknife as new code
  - run_manifest.yaml carries command, git commit and dirty-tree state, environment, seeds and shard
    indices, timings, per-stage core-seconds and wall-clock, and validity status
  - No file outside the task's write_scope was created or modified
