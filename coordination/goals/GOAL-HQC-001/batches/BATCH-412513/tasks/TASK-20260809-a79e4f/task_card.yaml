  dispatch_queue: coordination/goals/GOAL-HQC-001/batches/BATCH-412513/dispatch_queue.json
  state: queued
  priority: 1
  depends_on: []
  review_required: true
  claim_tier: toy
  claim_tier_note: 'HARD CEILING. PS-R3 reduced parameters only. Nothing this task produces bears on
    HQC''s IND-CCA security, its decoding-failure rate, assumption A17 or A5, or any standardized
    parameter set. Standardized-parameter runs are OUT OF SCOPE and unauthorized.'
  title: 'Matched-pair measurement at the V3/decode_blocks injection point: deterministic zero-entropy
    reconstruction of the pilot''s own shards, then a pre-registered-size matched-pair extension'
  objective: 'Measure the defected-minus-true difference in log2_Ahat_k at the load-bearing order
    k = m = 17 using a MATCHED-PAIR design -- the same underlying random draws decoded once through the
    unmodified decode_blocks and once through the V3-defected wrapper -- in two pre-registered stages.
    Report observations only; the Coordinator applies the decision rule.'
  why_this_task_and_not_the_v1_positive_control: 'DEC-20260806-9a4551 named a V1 positive-control pilot
    as step (3), conditional on genuine ambiguity remaining after steps (1) and (2). That precondition
    is MET (EV-HQC-dd85c1). DEC-20260809-46e85c nonetheless sequences THIS task first, for two reasons
    that did not exist when the three steps were written. First, a deterministic zero-new-entropy
    reconstruction of the pilot''s own committed shards is available, and its feasibility is not an
    assumption: the BATCH-2ecaa1 Validator already reproduced both committed S-histograms bit-identically
    from the shard indices alone. Second, at the measured throughput of about 2,100 trials/core-second
    the derived matched-pair T_req costs roughly 20-40 core-seconds, so the design that can actually
    discriminate the two competing explanations is now reachable inside one bounded task. THE V1 CONTROL
    IS SEQUENCED, NOT SHELVED: DEC-20260809-46e85c commits in advance that V1 is dispatched in the
    immediately following batch under branches B and C2, and is unnecessary only under branch A, where
    the pipeline will have demonstrably rung on its own.'
  stages:
  - id: stage_1
    name: deterministic zero-entropy reconstruction of the pilot's own shards
    new_randomness: none
    what: 'Re-decode the ALREADY-COMMITTED shards through the OPPOSITE decode variant from the one
      TASK-20260806-77a574 used: shard 5000 (the pilot''s defected arm) through the UNMODIFIED
      decode_blocks, and shard 6000 (the pilot''s undefected arm) through the DEFECTED wrapper. Each
      shard then has both members of every pair, giving 5,000 genuine matched pairs per shard and 10,000
      in total, on draws that already exist in the committed record.'
    determinism_gate: 'FAIL-CLOSED, RUN FIRST. Before computing anything from the crossed arms,
      reproduce the ORIGINAL configuration (shard 5000 defected, shard 6000 undefected) and assert the
      resulting whole-arm S-histograms are BIT-IDENTICAL to pilot_results.json''s
      MEASUREMENT.defected.S_histogram and MEASUREMENT.undefected.S_histogram. If they are not, ABORT.
      Per AGENTS.md rule 5 that is an infrastructure or environment regression and is NEVER reported as
      a result about the mathematics.'
    retention_requirement: 'Persist per-trial S in TRIAL ORDER for every stage-1 arm. This is the exact
      retention gap that made TASK-20260806-77a574''s data unpairable after the fact (EV-HQC-dd85c1 O2);
      it must not repeat. Pairing must be auditable from the artifacts, not asserted in prose.'
    what_it_can_and_cannot_show: 'STATED IN ADVANCE. Under the 1/sqrt(T) assumption and the Red Team''s
      SE of 0.1982 at T=5,000, the pooled SE over 10,000 pairs is about 0.140 and the minimum detectable
      effect at z=1.96 is about 0.275 -- ABOVE both existing point estimates (0.1922 and 0.2069). STAGE 1
      THEREFORE CANNOT PRODUCE A NULL THAT EXCLUDES A ~0.19-0.21 EFFECT, whatever it observes, and is
      unlikely to reach significance. It is calibration and replication, not the primary test. Do not
      describe it as resolving anything.'
  - id: stage_2
    name: matched-pair extension at a pre-registered size
    new_randomness: 'yes -- fresh, previously-unused shard indices, chosen and written into design.md
      BEFORE stage 1 runs'
    trial_count_rule: 'T2 = clamp(round(10000 * (SE_pooled_measured * 2.80 / 0.20) ** 2), 20000, 60000),
      where SE_pooled_measured is stage 1''s own pooled matched-pair jackknife SE at k=17 over the 10,000
      reconstructed pairs. delta = 0.20, z = 2.80, floor 20,000 and cap 60,000 are FIXED IN ADVANCE by
      DEC-20260809-46e85c and are not the executor''s to choose. The ONLY input from stage 1 is the
      measured SE.'
    why_this_size: 'At T2 of order 3.9e4 the SE is about 0.069 and the minimum detectable effect at
      z=1.96 is about 0.135 -- BELOW both existing point estimates. Both a significant detection AND a
      null whose interval excludes 0.19 become reachable, for the first time in this campaign.'
  primary_cell: k = m = 17 (is_prespecified_cell, matching PS-R3's own load-bearing order)
  primary_statistic: 'log2_Ahat_17(defected) - log2_Ahat_17(true) on matched pairs, with the standard
    error from a matched-pair jackknife (leave-one-batch-out) taken on the per-batch DIFFERENCE, not
    from separately-jackknifed arms combined in quadrature. The latter is precisely the misspecification
    the BATCH-2ecaa1 Red Team identified.'
  secondary_deliverables:
  - 'The UNPAIRED SE (independent-arm quadrature) on the same data alongside the paired SE, and their
    ratio, at k=17. This is the replication of the Red Team''s 2.78x and is a primary deliverable in its
    own right: that ratio is the single unreplicated number, from one uncommitted scratch script on one
    shard, that the whole required-T derivation rests on (EV-HQC-dd85c1 O8).'
  - 'The fitted exponent of SE against trial count across the three available points (5,000 per shard,
    10,000 pooled, T2), reported WHATEVER the primary outcome. This is the first empirical test the
    1/sqrt(T) assumption underlying every required-T figure has ever received (EV-HQC-dd85c1 O7).'
  - 'Measured core-seconds and wall-clock per stage, so the ledger archive can debit a measured number
    against campaign_budget.total_wall_clock_seconds instead of carrying an estimate forward again.'
  parameters:
    parameter_set: PS-R3
    n: 7187
    n_e: 56
    N: 7168
    m_load_bearing_order: 17
    k_range: 2..26
    defect_class: V3 (last-block-window-read-early), block index n_e-1
    injection_point: decode_blocks
    committed_shards_reused: [5000, 6000]
    stage_2_shards: 'fresh, declared in design.md before stage 1 runs; must be disjoint from 0-3, 900,
      999, 1000-1007, 4900, 4901, 5000, 6000, 7777, 7778, 424242'
