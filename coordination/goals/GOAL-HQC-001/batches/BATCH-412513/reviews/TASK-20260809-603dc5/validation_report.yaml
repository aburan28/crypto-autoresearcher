  limitations:
    - >-
      Toy-scale, hard ceiling: PS-R3 only, one defect class (V3), one
      injection point (decode_blocks last-block window), 10,000 + 20,000
      matched-pair trials -- roughly 10% of the smallest matched-pair
      T_req figure in EV-HQC-dd85c1 O5 (17,625) and a small fraction of
      the 3.09e5-trial full run. Nothing here is a statement about HQC,
      A17, its decoding-failure rate, or any standardized parameter set.
    - >-
      No positive control exists anywhere in this campaign's real-sampler
      detection chain (carried forward, not new; V1 positive control is
      sequenced to the next batch by DEC-20260809-46e85c). Neither stage
      of this task claims a detection, so this does not undermine the
      numbers validated here, but it means the campaign still cannot
      distinguish "the chain would fire on a real effect" from "the chain
      has never been shown to fire on anything," and any future
      significant z from this same instrument should be read with that in
      mind.
    - >-
      The fitted SE-vs-T exponent (0.3186, independently confirmed) rests
      on only 3 (T, SE) points, and two of them -- T=5,000 (mean of the
      two stage-1 per-shard SEs) and T=10,000 (the pooled SE from those
      SAME two shards) -- are NOT statistically independent observations;
      they are two different aggregations of the identical 10,000
      underlying trials. Only the T=T2=20,000 point comes from disjoint
      fresh data. This does not make the anomaly spurious (it is
      correctly measured and correctly disclosed per AGENTS.md rule 8, and
      DEC-20260809-46e85c's pre-registered rule that it supersedes
      branches A/B/C when outside [0.4,0.6] is triggered on the numbers as
      measured), but it means the exponent estimate itself carries less
      independent statistical information than "3 points" suggests, and a
      Coordinator relying on it for a scaling-law conclusion should treat
      it as a flagged anomaly warranting the scaling-characterization task
      DEC-20260809-46e85c's rationale already anticipates, not as a
      precisely-estimated exponent.
    - >-
      A contributing (not exclusive) candidate explanation for the
      sub-1/sqrt(T) exponent: the two stage-1 per-shard paired SEs at
      T=5,000 differ from each other by ~20% (0.1251 vs 0.1499, both
      independently confirmed), which is itself consistent with ordinary
      jackknife-SE sampling noise at N_JACK_BATCHES=200 over T=5,000 (25
      trials per fold). This is offered as context for the Coordinator's
      downstream reading of the anomaly, not as a resolution of it -- this
      review did not test whether it fully accounts for the measured
      exponent.
    - >-
      This review's independent code reproduces 5 of the 25 reported k
      cells per (stage, arm) exactly (k=5,10,17,20,24, including the
      primary cell and exceeding the "at least three other k"
      requirement); all matched to full float precision. This is strong
      but not exhaustive evidence that every one of the remaining 20
      reported cells at each (stage, arm) would also match.
    - >-
      This review ran on the same platform/Python/numpy combination
      (macOS-arm64, Python 3.13.1, numpy 2.4.0) as the executor's own run,
      not a third independent environment; it therefore adds
      implementation independence (fresh, differently-structured code) but
      not additional cross-platform determinism evidence beyond what the
      executor's own run_manifest.yaml already discloses relative to the
      pilot's original Linux/Python 3.11.15/numpy 2.4.6 environment.
    - >-
      This review recomputes and cross-checks the release-condition inputs
      named in DEC-20260809-46e85c's knowledge_promotion section (the
      SE-ratio replication test) but does not itself apply that release
      condition -- doing so is a Coordinator act. For the record: the
      independently-confirmed paired/unpaired SE ratios at k=17 are 2.902
      (shard 5000), 3.224 (shard 6000), 3.117 (stage-1 pooled), and 3.769
      (stage-2 pooled), against the Red Team's single-shard 2.78x.

