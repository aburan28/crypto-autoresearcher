  admissibility_verdict: ADMIT
  admissibility_verdict_rationale: >-
    Every declared artifact is present, sha256-bound to the Coordinator-committed snapshot, and
    content-consistent across matched_pair_results.json, matched_pair_report.md, run_manifest.yaml, and
    stdout.log on every field checked. The determinism gate, the stage-1 crossed arms, and the entire
