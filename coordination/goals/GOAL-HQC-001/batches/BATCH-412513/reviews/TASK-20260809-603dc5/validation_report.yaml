    The stage-2 trial count is a mechanical, code-enforced function of stage 1's own measured SE with no
    room for post-hoc tuning. The disclosed protocol deviations (numpy provisioning; the
    out-of-band SE-vs-T exponent) are honestly reported, correctly classified, and not smoothed over or
