  control_checks:
    - control: fail-closed self-tests (sha256 pin mismatch, injection
        invariant break)
      pre_registered: true (design.md Section 4, before any real data run)
      correctly_applied: true
      note: >-
        Traced both selftest functions: each constructs a genuine mismatch
        (a deliberately wrong sha256 constant; a wrapper whose actual
        shift is 2 positions while its own invariant check asserts
        shift-by-1) and calls the SAME load_module()/injection-invariant
        code path used by the real run. Both raise SystemExit with a
        message naming the mismatch; main() re-raises
        FAILED_IMPLEMENTATION if either verdict is not PASS, before the
        real module load or the real injection wrapper is used.
        stdout.log confirms both selftests actually executed and printed
        PASS in all four instances (both stages x both selftests) during
        the authorized run, not merely asserted afterward in the JSON.
    - control: D2 (exact generation weight) / D3 (support cap) hard
        invariants
      pre_registered: true (inherited unmodified from stage_a.py, checked
        upstream of decoding on every trial, decoder-independent)
      correctly_applied: true
      note: >-
        0 violations in both stages, both the committed run and this
        review's independent regeneration (10,000 + 20,000 trials each).
    - control: stage-1 determinism gate as a negative/regression control
      pre_registered: true (design.md Section 2.1, FAIL-CLOSED, RUN FIRST)
      correctly_applied: true
      note: >-
        Code-level check confirms gate_determinism.verdict is checked
        BEFORE any stage-1 statistic or the T2 substitution is computed;
        on failure the run reports invalid_measurement and returns without
        computing anything downstream (verified in code, and the actual
        run's verdict was PASS both as reported and as independently
        reproduced by this review).
    - control_gap_carried_forward_not_new: >-
        No POSITIVE control has been run through the real-sampler
        detection chain anywhere in this campaign (EV-HQC-dd85c1
        unresolved_confound, carried forward unchanged; the V1
        positive-control pilot is explicitly sequenced to the immediately
        following batch by DEC-20260809-46e85c and is out of THIS task's
        scope by design). Per docs/inventor-protocol.md Section 3, any
        report of a signal without a null-object/positive-control
        calibration is not yet evidence of detection power -- but neither
        stage of this task claims a detection (both z values are well
        under 1.96), so this gap does not undermine the specific numbers
        recomputed here; it bears on how much weight any FUTURE
        significant result from this chain could carry, and is flagged
        for that reason, not as a defect of this task.
    - null_object_decay_check: >-
        Not a "quantity that fails to decay when it should" situation:
        the paired SE DOES decrease monotonically with T (0.1375 at
        T=5000 mean-of-shards -> 0.0966 at T=10000 -> 0.0884 at T=20000,
        confirmed independently). The anomaly is a DECAY-RATE anomaly
        (measured exponent 0.32, weaker than the 1/sqrt(T) exponent 0.5
        the required-T derivation assumes), not an absence of decay. This
        distinction matters for how the finding should be read and is
        stated explicitly rather than left ambiguous.

