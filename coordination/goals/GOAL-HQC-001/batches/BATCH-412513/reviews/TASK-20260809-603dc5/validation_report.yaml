  inventor_protocol_section6_ladder_check:
    - item: "each assumption the complexity analysis rests on was isolated
        and measured separately, with the specific failure mode named"
      status: met, for what this task claims
      finding: >-
        This task does not carry a complexity/speedup claim; it isolates
        and separately measures exactly two assumptions the campaign's
        required-T derivation depends on: (a) whether a matched-pair
        design's paired jackknife SE genuinely undercuts the between-shard
        design's SE on the pilot's own draws (measured: yes, ratio
        ~1.75x-10.4x across k, ~3.1x at k=17, both stages), and (b)
        whether the assumed 1/sqrt(T) SE scaling holds (measured: no --
        exponent 0.32, outside [0.4,0.6], named explicitly as an anomaly
        rather than absorbed).
    - item: "the whole pipeline was run on a scaled-down instance of the
        same shape, with the claimed improvement/effect as a measured
        ratio, not a projection"
      status: met
      finding: >-
        No speedup is claimed. The claimed quantities (diff, paired SE,
        z, the paired/unpaired ratio, the fitted exponent) are all
        end-to-end measured on the real pipeline at PS-R3 toy scale, not
        projected, and this review recomputed every one of them from raw
        data independently.
    - item: "any cheat in a real-scale partial run is named individually and
        classified as completeness-preserving or soundness-losing"
      status: met
      finding: >-
        run_manifest.yaml's protocol_deviations names four departures
        (macOS os.sched_getaffinity fallback; dual_decode_shard as new
        driver code rather than a reuse of _t_shard's own body, with the
        determinism gate as the check on whether this substitution changed
        anything observable; D5/CTRL-REPLAY not run, matching
        pilot_injection.py's own convention; stage-2 raw per-trial arrays
        not persisted). None trades away soundness of the reported
        statistic -- (a) is provenance-only, (b) is the exact substitution
        design.md pre-registers and gates with the determinism check,
        which this review independently re-passed, (c) is a disclosed,
        precedented convention, and (d) is reproducibility-preserving
        (deterministic PRNG) rather than soundness-losing, which this
        review confirmed BY ACTUALLY REGENERATING stage 2's raw data from
        scratch and matching every reported statistic.
    - item: "the reproducibility pointer was exercised -- artifacts rebuilt
        from scratch and listed, not asserted"
      status: met, exceeded
      finding: >-
        This review rebuilt BOTH stages' raw per-trial data from scratch
        (stage 1: shards 5000/6000, matched against pilot_results.json and
        against the persisted per-trial arrays; stage 2: shards
        8000-8003, which the executor did not persist at all, so this is
