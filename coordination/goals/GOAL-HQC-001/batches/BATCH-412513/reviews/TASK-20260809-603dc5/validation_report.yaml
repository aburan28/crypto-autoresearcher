  independent_reproduction:
    method: >-
      Wrote an entirely separate script (not derived from matched_pair.py's
      source, no import of it, no execution of it) that loads stage_a.py
      and measure.py fresh via the same sha256 pins, re-verifies the pins
      independently against the files on disk, implements its own V3
      defect wrapper coded directly from design.md's stated mechanism, and
      implements its own generation loop and its own matched-pair
      leave-one-batch-out jackknife (using stage_a.py's single-(hist,k)
      log2_A_from_hist, NOT measure.py's vectorized log2_A_from_hists, as
      the primary estimator call -- a different code path than the
      executor used for its own per_k table). Chunk size for the
      generate-once/decode-twice loop was deliberately set to 1000 (vs the
      executor's batch=64), to rule out any silent batch-boundary
      dependence. All independent computation ran in this session's
      scratchpad and wrote no artifact under any task's write_scope, the
      repository's experiments/ tree, or any producer directory.
    checks_performed:
      - name: sha256 re-verification of stage_a.py and measure.py
        result: >-
          Independently recomputed; both match the pins in design.md and
          matched_pair.py exactly (06a0a618...681405 / a4fd1ecb...4f5dc8).
      - name: determinism gate, reproduced independently (constraint 1)
        result: >-
          Regenerated shard 5000 (defected) and shard 6000 (undefected) at
          5,000 trials each, from scratch, via my own driver. The resulting
          S_histogram arrays are BIT-IDENTICAL to pilot_results.json's
          committed MEASUREMENT.defected.S_histogram and
          MEASUREMENT.undefected.S_histogram. D2/D3: 0/0 violations on both
          shards, matching the executor's report. This is a fresh,
          independent pass of the same check the executor's own
          fail-closed gate performed and the BATCH-2ecaa1 Validator
          performed once before (per the handoff, a failure here would be
          an environment/determinism regression -- none occurred).
      - name: pairing genuineness (constraint 2)
        result: >-
          For all four stage-1 arms (shard 5000 true/defected, shard 6000
          true/defected), my independently-regenerated per-trial S arrays
          are BIT-IDENTICAL, entry-for-entry, to matched_pair_results.json's
          persisted stage1_per_trial_S arrays -- despite my driver
          generating bits in chunks of 1000 vs. the executor's batches of
          64. Since decode_blocks (traced above) does not mutate its input
          and the generation is a pure function of (ps_id, shard,
          MASTER_SEED, trial_index) independent of chunk/batch boundaries,
          this is strong evidence that entry i of the true-decode and
          defected-decode arrays on a given shard derive from the SAME
          underlying generated draw, by construction, not by post-hoc
          alignment -- the exact property design.md Section 1 and
          EV-HQC-dd85c1 O9 claim. Additionally: at every k checked, the
          paired (matched-pair-on-the-difference) jackknife SE is smaller
          than the unpaired (independent-arm quadrature) SE by a factor of
          ~1.75x-10.4x (see metric_recomputations) -- exactly the
          signature expected of a genuine positive within-pair correlation
          from a shared draw; if the "pairing" were spurious (e.g. the two
          arms were actually independent draws mislabeled as paired), the
          paired and unpaired SEs would be statistically indistinguishable
          rather than systematically several-fold apart.
      - name: jackknife-on-the-difference vs. separately-jackknifed arms,
          code-level check (constraint 2, second half)
        result: >-
          Traced matched_pair.matched_pair_stats(): bh_true and bh_def are
          both built by stage_a.batch_hists() with the SAME nb=200 applied
          to arrays of the SAME length T, so fold i removes the SAME
          trial-index range from both arms; loo_diff[i] = loo_def[i] -
          loo_true[i] is computed per-fold BEFORE the jackknife SE formula
          is applied, and se_paired = jse(loo_diff) is the SE of that
          per-fold difference series -- not sqrt(SE_true^2 + SE_def^2),
          which is computed separately and correctly labeled
          se_unpaired. My own independent implementation reproduces this
          same distinction from scratch (own loop, own jse()) and its
          numbers match the executor's se_paired/se_unpaired values
          exactly at every (stage, arm, k) checked.
      - name: cross-check of two independently-coded estimator
          implementations
        result: >-
          measure.py's vectorized comb_matrix-based log2_A_from_hists and
          stage_a.py's own single-(hist,k) log2_A_from_hist are two
          separately-committed formulations of the same estimator. At
          k=17, stage-1 pooled: my log2_Ahat_17(true)=-1.0237393960262544
          (stage_a formula) vs -1.0237393960262438 (measure.py vectorized
          formula on the identical histogram); defected arm likewise
          agrees to ~1e-11. Difference is floating-point summation-order
          noise, not a formula discrepancy.

