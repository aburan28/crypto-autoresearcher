    DEC-20260809-46e85c's pre-registered decision rule.

  independent_mechanical_soundness_judgement: MECHANICALLY_SOUND
  independent_mechanical_soundness_judgement_rationale: >-
    Based on this reviewer's own checks, not the Executor's characterization: (1) the determinism gate
    is real and independently reproduced bit-for-bit, not merely trusted; (2) the crossed arms and the
    entire stage-2 fresh-shard dataset are genuinely deterministic reconstructions/extensions of the real
