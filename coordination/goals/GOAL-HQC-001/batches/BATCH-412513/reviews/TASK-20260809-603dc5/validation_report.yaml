  metric_recomputations:
    - metric: >-
        Determinism gate (stage 1): shard 5000 through the defected wrapper and shard 6000 through the
        unmodified decode_blocks must reproduce pilot_results.json's committed
        MEASUREMENT.defected/undefected.S_histogram arrays bit-identically.
      method: >-
        Wrote an entirely independent driver (not derived from matched_pair.py's source, coded from
        design.md's stated mechanism), loaded stage_a.py/measure.py fresh via the same sha256 pins
        (independently re-verified against the files on disk: both match), and called stage_a.py's own
        unmodified _t_shard with shard=5000 under my own defect wrapper and shard=6000 under the real
        unmodified decode_blocks, at 5,000 trials each, same MASTER_SEED, same PS-R3 parameters.
      result: >-
        My independently-reproduced S-histograms are BIT-IDENTICAL to pilot_results.json's committed
        arrays (both defected and undefected). They are ALSO bit-identical, per-trial, to the executor's
        own committed per_trial_S arrays for shard_5000_defected and shard_6000_undefected. D2/D3
        violations: 0/0 in my reproduction, matching the committed run.
      verdict: PASS -- the determinism gate is genuine and independently reproduced, not merely trusted.
    - metric: >-
        Stage 1's two "crossed" arms (shard 5000 undefected, shard 6000 defected) -- the missing half of
        each matched pair.
      method: Same independent driver, same shard indices, opposite decode variant per shard.
      result: >-
        My independently-generated arrays are bit-identical to the executor's committed
        shard_5000_undefected and shard_6000_defected per_trial_S arrays.
      verdict: PASS.
    - metric: >-
        diff / SE_paired (matched-pair jackknife) / SE_unpaired / ratio / z at k=17 and across the full
        evaluable k range (2..26), stage 1, per-shard and pooled -- computed from RAW per-trial S this
        reviewer generated independently (not from the executor's committed per_trial_S, though those
        also matched bit-for-bit as noted above).
      method: >-
        Own implementation of the matched-pair leave-one-batch-out jackknife on the per-batch
        difference (200 batches, via sa.hist_of/sa.batch_hists and measure.comb_matrix/
        measure.log2_A_from_hists called directly), coded independently from design.md Section 4's
        formulas rather than by reading matched_pair.py's matched_pair_stats().
      result: >-
        EXACT MATCH at k=17 (shard 5000: diff=+0.101778, se_paired=0.125106, se_unpaired=0.363062,
        ratio=2.902, z=0.814; shard 6000: diff=+0.010823, se_paired=0.149899, se_unpaired=0.483266,
        ratio=3.224, z=0.072; pooled: diff=+0.051567, se_paired=0.096781, se_unpaired=0.304663,
        ratio=3.148, z=0.533) and EXACT MATCH (max abs error 0.0) across ALL 25 pooled evaluable k values
        (k=2..26), checked exhaustively, not merely spot-checked.
      verdict: PASS -- the stage-1 paired diff/SE/z/ratio statistic reproduces exactly, at every reported
        k, from independently-generated raw data.
    - metric: >-
        diff / SE_paired / SE_unpaired / ratio / z at k=17 and across k=2..26, stage 2 (fresh shards
        8001/8002, T2=20,000), per-shard and pooled.
      method: >-
        design.md's stage-2 retention requirement scopes per-trial S persistence to stage 1's four arms
        only (Section 2's "Retention requirement" names stage_1.per_trial_S specifically); stage 2's raw
        per-trial S is therefore, BY DESIGN, not present in the committed artifact -- confirmed absent
        ('per_trial_S' not in committed_results['stage_2']). Because the pipeline is provably
        deterministic (design.md Section 2's argument, and independently confirmed above for stage 1),
        this reviewer regenerated stage 2's raw per-trial S from scratch -- running all four fresh-shard
        arms (8001 defected/undefected, 8002 defected/undefected, 10,000 trials each) through an
        independent driver -- rather than recomputing from a committed raw array that does not exist.
      result: >-
        EXACT MATCH at k=17 pooled (diff=+0.011085, se_paired=0.017905, se_unpaired=0.277781,
        ratio=15.514, z=0.619) and EXACT MATCH (max abs error 0.0) across ALL 25 pooled evaluable k
        values, checked exhaustively, between my from-scratch regeneration and the executor's reported
        numbers.
      verdict: >-
        PASS, with a disclosed completeness note (see limitations): the committed artifact itself does
        not carry stage-2 raw per-trial data to recompute FROM, but this reviewer's independent
        end-to-end regeneration is a stronger check than recomputing from a committed array would have
        been, since it additionally confirms the deterministic-pipeline claim holds for the fresh shards
        too, not merely for 5000/6000.
    - metric: stage-2 trial-count sizing formula, T2 = clamp(round(10000*(SE_pooled_measured*2.80/0.20)^2),20000,60000)
      method: >-
        Substituted this reviewer's own independently-computed stage-1 pooled SE_paired at k=17
        (0.0967812383) into the pre-registered formula.
      result: >-
        T2_raw = 18,358.55 -> rounded 18,359 -> clamped to the pre-registered floor 20,000. Matches the
        executor's own substitution exactly (matched_pair_results.json.stage_1.stage2_sizing:
        T2_rounded=18359, T2_clamped=20000) and matches what stage 2 actually ran (T2=20,000, split
        10,000/10,000 across shards 8001/8002).
      not_tuned_after_the_fact: >-
        Confirmed structurally, not just numerically: matched_pair.py's --stage 2 code path REQUIRES
        stage 1's own output file to already exist on disk and reads T2_clamped from it (raises
        SystemExit otherwise); stage 2's own validity check re-asserts t2_matches_preregistered_rule.
        Since this reviewer's independent stage-1 SE recomputation exactly matches the committed one,
        and the code path makes T2 a mechanical function of that number rather than a free choice, there
        is no room for post-hoc tuning between stage 1 and stage 2 in this implementation.
      verdict: PASS.
    - metric: fitted SE-vs-trial-count exponent alpha (three points, k=17, log-log OLS)
      method: >-
        Own OLS fit (numpy.polyfit(log T, log SE), degree 1) on (T=5000, SE=mean of my own
        independently-recomputed shard-5000/shard-6000 paired SEs), (T=10000, SE=my own stage-1 pooled
        SE), (T=20000, SE=my own stage-2 pooled SE, from the from-scratch regeneration above).
      result: alpha = 1.470493, EXACT MATCH to the executor's reported 1.4704932987763473.
      verdict: >-
        PASS on recomputation. Independently confirmed: this value genuinely falls OUTSIDE the
        pre-registered [0.4, 0.6] consistency band. Reported as measured, not interpreted -- this
        reviewer does not apply DEC-20260809-46e85c's supersession clause, only confirms the number
        feeding it is correct. Noted for the Coordinator/Red Team: the deviation is driven almost
        entirely by the T=10,000 -> T=20,000 step (SE falls 0.0968 -> 0.0179, a ~5.4x drop against a 2x
        trial-count increase and against a ~1.41x drop 1/sqrt(T) would predict), while the T=5,000 ->
        T=10,000 step (0.1375 -> 0.0968) is close to 1/sqrt(T)-consistent (predicted 0.0972, observed
        0.0968). A 3-point OLS fit is dominated by whichever step deviates most; this is a factual
        observation about the fit's sensitivity, not a claim about what caused the stage-2 SE collapse.
    - metric: budget/timing (28.517 core-s / 28.099 wall-s)
      method: >-
        Checked run_manifest.yaml's per-stage figures against its own stated totals, against stdout.log,
        and against matched_pair_results.json.stage_1/stage_2.budget.
      result: >-
        stage_1: 9.66 core-s / 9.45 wall-s; stage_2: 18.857 core-s / 18.649 wall-s. Sums: 9.66+18.857 =
        28.517 core-s; 9.45+18.649 = 28.099 wall-s -- EXACT MATCH to the headline figures in
        run_manifest.yaml.budget and matched_pair_report.md Section 6. stdout.log's printed per-stage
        figures (9.67/9.5s, 18.86/18.6s) match to the printed precision (2 decimal places vs.
        run_manifest's 3). matched_pair_results.json.stage_1.budget and .stage_2.budget carry the same
        stage-level figures as run_manifest.yaml, byte-for-byte on the numeric fields.
      plausibility_check: >-
        This reviewer's own from-scratch run of a comparable workload (determinism gate + all 4 stage-1
        arms + all 4 stage-2 arms, single process, same machine class) took 27.8s wall-clock total,
        the same order of magnitude as the executor's reported 28.099s combined total across two separate
        process invocations. Consistent with the reported timings being real measurements rather than
        fabricated figures.
      verdict: PASS.

  control_checks:
    - control: >-
        Matched-pair structure itself (each defected trial paired against an undefected trial from the
        SAME underlying draw) as a null-object-shaped control: the undefected arm is generated from
        identical draws, identical decoder, differing only in whether the V3 wrapper is installed --
        satisfying the requirement that a reported effect be measured against a null object of the same
        shape rather than an unrelated baseline.
      pre_registered: true (design.md Section 2, before any data generated)
      correctly_applied: true
    - control: >-
        Pairing-integrity check (this reviewer's own addition, not requested verbatim by the handoff but
        directly answering "are the matched pairs genuinely matched, not an artifact of index
        alignment?"): compared same-shard defected-vs-undefected per-trial S differences against a
        deliberately MISMATCHED cross-shard pairing (shard 5000 defected vs shard 6000 undefected,
        trial-index-aligned but from unrelated draws) as a negative control.
      method: >-
        Computed per-trial S differences for (a) genuine same-shard pairs on shards 5000, 6000, 8001,
        8002 and (b) a mismatched cross-shard "pairing" as a negative control, all from this reviewer's
        own independently-generated raw data.
      result: >-
        Genuine same-shard pairs: std of per-trial diff in [0.3266, 0.3321] across all four shards
        checked, only 10.4%-11.0% of trials nonzero, max |diff|=1. Mismatched cross-shard "pairing":
        std=4.64-4.67, ~91.4%-91.5% of "diffs" nonzero -- roughly 14x larger spread and 8-9x more
        nonzero entries than genuine pairs. This is the expected signature of genuine matched pairs (a
        small, localized, mostly-zero perturbation from the V3 defect) versus what index-aligned but
        unrelated draws would show (S values with no shared origin, differing by roughly their full
        independent variance). The pairing is genuine, not an artifact of index alignment.
      verdict: PASS.
    - control: >-
        Fail-closed selftests (sha256 pin mismatch; injection-invariant deliberate break) as negative
        controls demonstrating the fail-closed checks actually fire under fault conditions, not
        rubber-stamped no-ops.
      method: >-
        Read selftest_fail_closed_sha_mismatch() and selftest_injection_invariant_fail() in full and
        traced control flow by hand. Both construct a genuine fault (a wrong sha256 constant; a wrapper
        whose applied shift is 2 while its invariant check asserts shift-by-1) and call the SAME
        load_module()/injection-invariant-check code path the real run uses.
      result: >-
        Both raise SystemExit with a message naming the mismatch; main() re-raises FAILED_IMPLEMENTATION
        if either verdict is not PASS, before any real module load or real injection use. stdout.log
        confirms both printed PASS during the authorized runs (both stages), and
        matched_pair_results.json's fail_closed_selftests block records the full exception messages,
        matching what the deliberate-mismatch code paths would actually produce.
      verdict: PASS -- genuine fail-closed checks.
    - control: D2 (exact generation weight) / D3 (support cap) hard invariants, all 8 arms across both stages.
      result: 0 violations on every arm, matching this reviewer's own independent reproduction (0/0 on
        all arms checked).
      verdict: PASS.
    - control: >-
        Injection confinement (does the V3 wrapper touch anything besides the last block's bit window?)
      method: >-
        Read make_defected_decode_blocks() in matched_pair.py; it slices exactly
        bits[:, lo-1:hi-1] into bits_defected[:, lo:hi] at block n_e-1 and asserts
        b[:, :lo]==bits[:, :lo] (all other blocks unchanged) before calling the unmodified
        decode_blocks. The wrapper's own per-call invariant check would raise SystemExit if this
        assertion failed; this fired 0 times in the authorized runs (fail_closed checks table above).
      verdict: PASS.

