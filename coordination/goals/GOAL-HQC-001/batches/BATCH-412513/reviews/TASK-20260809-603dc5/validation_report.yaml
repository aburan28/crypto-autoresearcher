    numbers; (3) the pairing is genuinely matched, not an index-alignment artifact, confirmed by a
    same-shard-vs-cross-shard control; (4) the fail-closed selftests are real checks with real failure
    conditions, verified by tracing control flow; (5) D2/D3 are clean in both the committed run and this
    reviewer's reproduction; (6) the stage-2 sizing formula was applied exactly as pre-registered with a
    code-enforced dependency on stage 1's own measured SE, ruling out post-hoc tuning; (7) the fitted
    SE-vs-T exponent (1.470, outside the pre-registered [0.4,0.6] band) is correctly computed and
    honestly reported without being interpreted or smoothed over. One substantive open question is
    surfaced for the Red Team and Coordinator, not resolved here: the SE-vs-T deviation is driven almost
    entirely by an anomalously large drop in paired SE between the T=10,000 and T=20,000 points (~5.4x
    for a 2x trial-count increase), while the T=5,000-to-10,000 step is close to 1/sqrt(T)-consistent;
    this reviewer's independent regeneration confirms the number is not a computational error, but
    whether it reflects a genuine feature of this estimator at these parameters, a subtlety in how pooled
    batch-histograms interact with the jackknife at larger nb, or something else is outside this
    review's scope (recomputation and control integrity, not interpretation).

