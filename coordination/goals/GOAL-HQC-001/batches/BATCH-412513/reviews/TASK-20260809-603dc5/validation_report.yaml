    the persisted stage1_per_trial_S arrays bit-for-bit despite a
    different chunking strategy, and the paired jackknife is verified,
    both by code inspection and by independent reimplementation, to be
    computed on the per-batch DIFFERENCE rather than by combining
    separately-jackknifed arms. diff/SE/z at k=17 and four additional k
    values recompute exactly from raw per-trial data generated by this
    review's own driver, for stage 1 (per-shard and pooled) AND for stage
    2 (which this review regenerated from scratch, since the executor did
    not persist stage-2 raw arrays). The stage-2 trial count is
    structurally and arithmetically confirmed to follow the pre-registered
