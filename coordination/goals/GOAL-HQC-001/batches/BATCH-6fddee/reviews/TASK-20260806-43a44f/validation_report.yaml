  # ==================================================================
  # FINDINGS THE EXECUTOR DID NOT REPORT
  # ==================================================================
  findings_not_in_the_executor_record:
  - id: R-NEW-1
    severity: material_procedural
    title: ST-5 null-first ordering was not observed, and was not recorded as a deviation.
    what: >-
      Stopping rule ST-5 requires that 'NULL-P and NULL-M run BEFORE any (T)
      arm at each set'. They did not. In stage_a.py the (T) shards run at line
      939, NULL-P at line 1021 and NULL-M at line 1037. ST-5 is not mentioned
      anywhere in stage_a.py, stage_a_report.md, run_manifest.yaml or
      stage_a_results.json, and it does not appear among protocol_deviations
      DEV-1..DEV-5.
    why_it_happened: >-
      IT IS STRUCTURALLY FORCED BY THE CONTRACT ITSELF, not a shortcut. NULL-P
      is constructed as S ~ Binomial(n_e, qhat) and NULL-M as
      Bernoulli(phat)^N, where the contract defines qhat and phat as the
      (T)-MEASURED values (see controls.NULL-M 'phat the (T)-measured
      coordinate marginal at that set'). I verified the code does exactly this:
      null_p takes q = diagnostics[set]['q_hat'] and null_m takes
      diagnostics[set]['p_hat']. Stage A is the phase that measures those
      quantities, so at Stage A the nulls cannot precede the (T) arm. ST-5 as
      written is unsatisfiable at Stage A.
    materiality_for_this_run: >-
      LOW. ST-5's substantive guard is 'Stage B does not start at a set whose
      NULL-P or NULL-M fails INV-NULL', and Stage B was neither authorized nor
      run. Its second rationale -- that a null failing after the (T) data exist
      invites motivated interpretation -- is also largely defused here, because
      no (T) joint moment was computed at all, so there was no (T) result to
      motivate an interpretation toward. I found no sign of post-hoc threshold
      adjustment: the 3 SE and 25 percent thresholds are the pre-registered
      ones and the executor declined to adjudicate the one admissible firing.
    what_the_coordinator_must_do: >-
      Record the deviation, and resolve the contract contradiction BEFORE Stage
      B. Either restate ST-5 as binding on Stage B only (the reading that makes
      it coherent), or redefine the null arms to take a pre-registered q and p
      rather than the measured ones. Leaving it unresolved means Stage B
      inherits a stopping rule it cannot satisfy.
  - id: R-CONTRACT-1
    severity: minor
    title: The contract's required_artifacts layout is unreachable from the executor's write scope.
    what: see R1-D2. Mandated paths under experiments/EXP-HQC-982268/ cannot be written by the executor.
    what_the_coordinator_must_do: >-
      Either relocate the required_artifacts paths into the task directory, or
      make the Coordinator responsible for copying the run package into
      experiments/EXP-HQC-982268/runs/<RUN-ID>/ as part of the archive step.
      Also note stdout.log and stderr.log were genuinely not captured.
  - id: R-CONTRACT-2
    severity: material
    title: D3's stated rationale is factually wrong and must not propagate.
    what: >-
      Independently confirmed (item 3). The contract's claim that the support
      cap is 'violated with probability ~1 on (M)' and that D3 is among the
      'hard invariants that cannot be satisfied by an (M) sampler' is false at
      all four parameter sets by 39 to 70 sigma.
    what_the_coordinator_must_do: >-
      Supersede the D3 rationale in any Stage B contract revision, and ensure
      no downstream record cites D3 as (T)-versus-(M) evidence. The detectors
      that genuinely bear on that question here are D1 (with its NULL-M
      positive control), D2, D5, the phat agreement and the Table 10 tail
      comparison.
  - id: R-NEW-2
    severity: informational
    title: Snapshot-before-review ordering was violated, and I can attest the mitigation held.
    what: >-
      AGENTS.md requires the Coordinator snapshot commit to precede independent
      review. It did not. I observed this directly and not merely from the
      receipt: at my first tool call the task directory was untracked
      ('?? .../BATCH-6fddee/tasks/') at HEAD cab9633e, and during my review it
      was committed as ff816e03 with HEAD moving to that commit.
    assessment: >-
      The Coordinator DISCLOSED this in
      archives/TASK-20260806-c2a7fc/snapshot-receipt.json under
      ordering_deviation_disclosed, including the correct observation that an
      argued freeze is weaker than an enforced one. I can attest the mitigation
      held in fact for this review: I recomputed all four artifact sha256 and
      they match the receipt exactly, so the bytes I reviewed are the bytes
      committed. The receipt also correctly discloses that the run was
      performed at cab9633e while the archive commits onto dfe901d2-descended
      history after PR #186 merged. That disclosure is accurate.
    what_the_coordinator_must_do: >-
      Carry through the stated fix -- run the snapshot as its own dispatched
      step before review agents start in the next batch.

  # ==================================================================
  # OVERALL
  # ==================================================================
  overall_verdict:
    verdict: PASS_WITH_DEFECTS
    what_this_verdict_covers: >-
      RECEIPT AND CONTROL INTEGRITY ONLY. It is a statement that the Stage A
      package is honest, reproducible and correctly scoped -- not a statement
      about HQC, A17, A5, any decoding-failure rate, or any standardized
      parameter set, about which this package says nothing and neither do I.
    what_passed: >-
      Reproducibility is strong and I verified it by re-execution rather than
      by reading: I re-ran the oracle and its 43-test suite myself and
      reproduced 0 computed-value differences, and I recomputed seven sha256
      values including all four artifact hashes against the Coordinator's
      receipt. Every gate reported as evaluated was genuinely evaluated in
      code, and every number I recomputed from the archived sufficient
      statistics reproduced exactly -- roughly forty independent checks with no
      discrepancy. The scope ceiling held: no stage beyond A ran, no log2_A_k
      or log2_A_m appears on any space-(T) arm, the budget was underspent, and
      the write scope was respected. Three gates are demonstrably capable of
      failing, one of them (INV-NULL) by actually firing 28 times and another
      (D1) by a genuine positive control on NULL-M.
    what_is_defective: >-
      D3 cannot fail on the object the contract advertises it for, which I
      confirmed independently at 39-70 sigma. D2 and D5 were evaluated but
      never demonstrated capable of firing. The ST-5 null-first ordering was
      not observed and, unlike the executor's five other deviations, was not
      recorded -- and the underlying cause is a contradiction in the contract
      itself. The contract's required_artifacts layout is unreachable from the
      executor's write scope, and stdout/stderr were not captured. A fifth,
      gitignored file sits in the task directory against the manifest's
      'exactly four'. The snapshot commit did not precede review, though the
      Coordinator disclosed this and I can attest the byte-level mitigation
      held.
    why_not_a_plain_pass: >-
      Two reasons, neither about honesty. First, an unrecorded protocol
      deviation is a receipt defect even when its material impact is low and
      even when the contract made it unavoidable; ST-5 must be on the record
      before Stage B inherits it. Second, three of the six detectors are
      single-sided, and one of those is now known to be inert against its
      advertised failure mode -- so 'all invariants clean' is weaker
      corroboration than it reads.
    why_not_a_fail: >-
      Nothing was fabricated, nothing was papered over, and no gate outcome is
      unsupported by the artifacts. Every deviation but one was self-reported
      by the executor, including three defects IN THE CONTRACT IT WAS EXECUTING
      that no reviewer had caught. Not-reached and not-evaluable items are
      uniformly attributed to budget, authorization or read scope, never to
      mathematics, exactly as AGENTS.md rule 5 requires. The executor declined
      to adjudicate its own most interesting observation and handed it to the
      Reviewer. valid_partial_measurement is the correct validity status and I
      concur with it as written.
    executor_report_accuracy: >-
      HIGH. I checked every quantitative claim in the executor's summary that I
      could reach and found no overstatement and no error. The two places where
      my numbers differ from the record are immaterial: I count 28 oracle
      timing differences where the executor counts 27 (run-to-run noise in key
      collisions, no computed value involved), and the throughput endpoints
      round to 1.85x and 3.15x where the report says 1.9x and 3.1x. The
      executor's self-reported defects -- the D3 rationale, the tie-convention
      omission, the CTRL-BS Maclaurin inexactness, and the observation that no
      null arm tests the (T) joint law -- are all correct, and I confirmed the
      first and third by independent computation.
    recommended_disposition_for_the_coordinator:
      note: >-
        RECOMMENDATION ONLY. I change no status; the decision is the
        Coordinator's under AGENTS.md rule 1.
      items:
      - Accept the Stage A package as a valid partial measurement of the INSTRUMENT, at claim tier toy.
      - Record R-NEW-1 (ST-5) as a protocol deviation supplementing the executor's DEV-1..DEV-5.
      - >-
        Before authorizing any Stage B arm, resolve the three contract defects:
        ST-5's unsatisfiability at Stage A (R-NEW-1), D3's false rationale
        (R-CONTRACT-2), and the unreachable required_artifacts layout
        (R-CONTRACT-1). All three are contract corrections, not re-runs.
      - >-
        Ratify explicitly the executor's declared reading of the log2_A
        prohibition (R4-B1), and decide deliberately about the derivability of
        the (T) joint moments from the archived S-histograms (R4-B2).
      - >-
        Treat the tie-convention omission (DEV-1) as blocking for any q-hat
        dependent claim. It is cheap to close relative to any Stage B arm and
        it currently leaves TC-2 unevaluable at every set.
      - >-
        If Stage B is authorized, require at least one injected-fault
        demonstration per hard invariant (D2, D5) so they stop being
        single-sided, and re-cost from the measured 1502-2555 trials per
        core-second rather than the modeled 4728.
      - >-
        The one admissible INV-NULL firing (PS-R1/NULL-M/k=11) remains
        unadjudicated by both the executor and me. It needs a Reviewer
        judgement on whether T_stab=30 is too loose near its boundary; note the
        cell clears T_stab by only 6.8 percent and that |z| rises monotonically
        and one-signed through it.

