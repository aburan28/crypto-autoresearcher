  title: >-
    Validate the four fresh cells, the two disjointness proofs, and the
    null-object control's forced values by independent recomputation

  objective: >-
    Independently validate, by recomputation from the frozen snapshot bytes and
    from data your own driver generates, that the four fresh 2x2 cells are real
    properties of the estimator rather than artifacts of the discard-prefix
    driver or the window slicing; that Arm A's direct and Arm B's adapted
    disjointness proofs actually hold and are correctly characterized in
    strength; that the F[:, 0:n_e-1] invariant passes on all eight (shard,
    window) combinations; and that the null-object control genuinely returns its
    three forced values rather than being constructed so that it cannot do
    otherwise.

  must_check_by_id:
  - V1-FRESHNESS: >-
      Independently re-derive the consumed high-water trial index on each shard
      from the COMMITTED records of TASK-20260809-a79e4f, TASK-20260814-8bbdd2
      and TASK-20260815-e61cca, and state whether START_INDEX=30000 genuinely
      clears it on BOTH shards. If it does not, that is a disqualifying finding.
  - V2-SINGLE-CALL-AND-DISJOINT-WINDOWS: >-
      By reading cross_regime_arms.py itself, confirm each shard's four windows
      come from EXACTLY ONE _t_shard call at n_trials=75000 per (shard, variant),
      that P1/P2/N1/N2 are pairwise disjoint, and that no window overlaps the
      discarded prefix [0:30000).
  - V3-ARM-A-DIRECT-PROOF: >-
      Generate your OWN shard 5000 prefix and compare it yourself against
      TASK-20260809-a79e4f stage_1's committed per_trial_S, rather than
      confirming the executor's comparison. Report element count and PASS/FAIL.
      Also confirm independently whether a TASK-20260814-8bbdd2 array exists for
      [5000,15000).
  - V4-ARM-B-ADAPTED-PROOF: >-
      Run your own dedicated n_trials=10000 verification call per (8002,
      variant); confirm it reproduces the committed stage_2 derived values,
      stating your tolerance and why; then confirm the executor's analysis-call
      prefix matches YOUR freshly generated data, not merely the executor's.
      Render an explicit judgment on whether the adapted proof is an adequate
      (not equivalent) substitute for the direct check, and on whether the
      corrected same-process-vs-cross-process residual-risk statement required by
      DEC-20260815-176614 next_actions item (2) is actually present and correct.
  - V5-F-INVARIANT: >-
      Independently reproduce the F[:, 0:n_e-1] check on all eight (shard,
      window) combinations from your own driver, and report the mismatch counts
      you observe.
  - V6-EXPONENT-RECOMPUTATION: >-
      Recompute at least ONE of the four fresh local exponents end to end from
      raw per-trial data your own driver wrote, and all four from the executor's
      committed per-window se_paired values, at k=17 and at least three other k.
      Confirm the three pre-registered contrasts arithmetically.
  - V7-NULL-OBJECT-AS-CONSTRUCTION: >-
      Attack the null object as a CONSTRUCTION, not only as a computation.
      Determine whether log2 A_k = 0, paired diff = 0 and alpha = 0.5 are forced
      by the independent-block i.i.d. law as claimed, or whether some coding
      choice forces them regardless of input. A control that cannot fail is not
      a control; this campaign has four recorded instances.
  - V8-SENSITIVITY-LEG: >-
      Verify the sensitivity leg actually perturbs what it claims to perturb;
      independently check the forced identity alpha_planted = alpha_unmodified -
      log2(rho_g) for at least one g; and state whether you agree with the
      executor's in-band/out-of-band verdicts.
  - V9-NULL-BAND-RECOMPUTATION: >-
      Independently recompute the null band from noc_replicate_summary.csv and
      confirm the reported mean, SD and 2.5/50/97.5 percentiles per rung pair,
      plus the four-rung full-ladder fit.
  - V10-P-CALIBRATION-FROZEN: >-
      Confirm p was calibrated once, before any ladder replicate, recorded in
      design.md, and held fixed for every rung, replicate, arm and the
      sensitivity leg -- not retuned after seeing a rung's evaluable_k coverage.
  - V11-PREREGISTRATION-ORDER: >-
      Confirm design.md demonstrably predates both results JSON files and states
      every constant, window, proof, forced value and protocol it is required to
      state, and that the cost-projection reduction protocol was applied as
      written rather than improvised.
  - V12-PROCEDURAL-DIFFERENCE: >-
      Assess the one-call-versus-two-call difference from the historical cells.
      Confirm the executor's check that batching a 10,000-trial slice into 200
      batches gives the same batch structure as a dedicated 10,000-trial call,
      and state whether this difference could move any reported number.
  - V13-SPEND: >-
      Confirm the reported core-seconds and wall-clock are measured, split by
      Part, and consistent with the run's own timings, so the ledger archive can
      debit a measured number.
  - V14-ARTIFACT-COMPLETENESS: >-
      Confirm all twelve declared artifact paths exist at the snapshot commit,
      that no undeclared file was written into the task directory, and that the
      snapshot receipt's path_sha256 matches the bytes you read.

  required_judgments:
  - Is the fresh 2x2 factorial an ADMISSIBLE measurement of the (shard x regime) contrast? Answer plainly.
  - Is the null-object control an ADMISSIBLE calibration of the 2-point local-exponent diagnostic? Answer plainly and separately.

  independence_note: >-
    Dispatched as a FRESH agent invocation in a session that did not originate
    the reviewed output. Never obtained by continuing the producer's session.
    Do not read or modify the concurrent Red Team task directory
    (TASK-20260817-94c89e), and do not confer with it.

  recompute_not_trust_note: >-
    Producer summaries are not evidence of themselves. Every figure you admit is
    recomputed from bytes at the TASK-20260817-f24a5e snapshot commit or from
    data your own driver generated, and each artifact is labelled read-committed
    or read-uncommitted.

  contract_note: >-
    This review changes no status and edits no producer artifact. It writes one
    report, commits nothing, and is uncommitted until TASK-20260817-61ed83
    archives it. The Coordinator adjudicates it in DEC-20260817-2b638b. You do
    NOT apply batch.yaml's pre-registered reading rule; you may and should judge
    whether the delivered numbers are the ones that rule needs.

