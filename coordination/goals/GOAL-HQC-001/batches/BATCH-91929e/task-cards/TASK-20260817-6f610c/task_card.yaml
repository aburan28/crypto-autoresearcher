  - An explicit, separate judgment is rendered on whether the null-object control is a genuine calibration or a construction that cannot fail
  - A verdict of ADMIT or DO-NOT-ADMIT is stated plainly, with separate admissibility findings for the 2x2 factorial and for the null-object control
