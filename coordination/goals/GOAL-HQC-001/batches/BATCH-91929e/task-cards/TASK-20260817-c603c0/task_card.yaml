    core_seconds: 900
    memory_gb: 4
    maximum_runs: 2
    budget_basis: >-
      Part A is about 321,800 trial-decodes (4 x 75,000 analysis + 2 x 10,000
      verification + 6 x 300 warmup); at BATCH-174014's own MEASURED throughput
      (162,400 trials in 94.020 wall-clock seconds, about 1,727 trials/second)
      that projects to roughly 190 seconds. Part B performs no decoder calls but
      its cost is genuinely uncertain, so it carries the pre-registered
      reduction protocol above instead of an optimistic estimate. Expected total
      roughly 300-800 wall-clock seconds against a 1,800-second authorization.
    budget_fit: >-
      campaign_budget.total_wall_clock_seconds is 10,800 and is a LIVE pause
      condition; roughly 4,814.08 seconds remain per the goal head. 1,800 is
      37.4% of that; even a full-cap spend leaves about 3,014 seconds. THE CAP
      WILL NOT BE RAISED AND A RAISE IS NOT SELF-GRANTABLE. Only
      EXECUTOR-MEASURED wall-clock is debited against the campaign budget;
      reviewer and Coordinator session time never is.
    spend_reporting_required: >-
      Report actual core-seconds and wall-clock, split by Part, in
      run_manifest.yaml, so the ledger archive debits a MEASURED number and
      never an estimate.

  observations_only_note: >-
    THE EXECUTOR CONCLUDES NOTHING. Do not decide which of "shard-specific,"
    "general estimator heterogeneity," or "batch-size/transition regime"
    obtains; do not apply batch.yaml's pre-registered reading rule; do not
