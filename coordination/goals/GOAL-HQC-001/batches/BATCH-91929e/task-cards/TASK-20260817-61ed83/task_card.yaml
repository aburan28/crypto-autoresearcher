      currently fail to render on this exact rule.
    reserved_record_ids_note: >-
      EV-HQC-e458ef and DEC-20260817-2b638b were PRE-ALLOCATED on 2026-08-17 by
      the driving session with tools/allocate_id.py --next and confirmed free
      with --check, because research_dispatch.py requires a ledger archive to
