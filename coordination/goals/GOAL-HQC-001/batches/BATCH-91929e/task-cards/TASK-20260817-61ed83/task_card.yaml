    knowledge_entry_note: >-
      knowledge/findings/ and knowledge/techniques/ are in write_scope for the
      case where promotion is warranted. A KN-* id is minted by the driving
      session at archive time and its path recorded in the receipt. DO NOT
      COMMIT knowledge/INDEX.md -- it is a generated artifact, .gitignore'd per
      CLAUDE.md's concurrency rules, and rebuilt on demand.

  runs_alone: true
  runs_alone_note: Coordinator archive tasks run alone, never alongside another agent, and never race another worker on one Git index or HEAD.

  the_reading_rule_is_frozen: >-
    batch.yaml's preregistered_reading_rule was frozen at batch opening, before
    any data existed. APPLY IT EXACTLY AS FROZEN, IN ITS DECLARED PRECEDENCE
    ORDER: Branch N (noise) is evaluated FIRST and dominates; then R
    (regime-driven); then S (shard-driven); anything else is Branch X and is
    recorded plainly as INCONCLUSIVE with the observed values, NOT forced into
    N, R or S. Do not adjust the rule after seeing the outcome. An amendment
    requires a versioned protocol_amendment record, per AGENTS.md.

  validity_gates_dominate: >-
    If either disjointness proof or the F[:, 0:n_e-1] invariant was reported
    FAIL or ABORTED on an arm, or if either reviewer judged a proof inadequate,
    that arm is an INFRASTRUCTURE OUTCOME under AGENTS.md rule 5 -- never
    negative mathematical evidence -- and no branch may be read from it. State
    this explicitly rather than silently downgrading the finding's strength.

  blindness_gate: >-
    If the null-object control is reported or judged BLIND, its null band
    carries no interpretive weight and Branch N cannot be established from it.
    Say so plainly and record the batch as having produced an uncalibrated
    diagnostic -- which would be the FIFTH instance of this campaign's
    control-blindness pattern (after CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP and
    BATCH-4b8ad3's planted arm) and must be named as such, not softened.

  replication_cells_must_be_reported: >-
    Regardless of branch, report alpha(5000, regime P) against the historical
    +2.836 and alpha(8002, regime N) against the historical
    -0.8662355237627483. These are this family's FIRST same-(shard, regime)
    replications on disjoint data. A large gap is itself a decisive finding
    about the diagnostic and about every number this family has published; do
    not bury it inside the factorial.

  knowledge_promotion_required:
    binding_note: >-
      DEC-20260815-176614.knowledge_promotion HELD two candidate KN-TECH lessons
      and named THIS ledger archive as their resolution point, explicitly. Both
      must be resolved BY NAME. AGENTS.md rule 11 requires this field filled:
      promote on support or reject_scoped at replicated/strong evidence,
      otherwise record a concrete not_warranted reason. Do not default to a
      shrug, and do not repeat the deferral without stating exactly what new
      fact would resolve it and when.
    candidate_1: >-
      "A fixed-batch-count jackknife design (N_JACK_BATCHES held constant while
      T varies) silently confounds any SE-vs-T scaling exponent with the
      absolute batch-size regime, unless T-points are chosen to hold batch size
      fixed or the regime is deliberately varied independently of whatever else
      the exponent is meant to isolate." PART A TESTS ITS CONSEQUENCE.
    candidate_2: >-
      "A two-point (zero-degree-of-freedom) local-exponent diagnostic cannot be
      read directionally, in either sign or magnitude, without an independent
      empirical estimate of its own sampling variance -- a generalizable warning
      about the entire local-exponent technique this task family invented at
      TASK-20260814-8bbdd2." PART B TESTS ITS CONSEQUENCE.
    also_unchanged_and_unpromoted: >-
      The four-instance control-blindness pattern (held since BATCH-4b8ad3), the
      planted-arm plateau lesson (held since BATCH-f8050e), and the
      per-shard-heterogeneity / pooling-convention candidates held at
      BATCH-0e126d. KN-TECH-00f082 stands exactly as filed unless this batch's
      evidence engages its own falsification/narrowing condition, in which case
      say so.

