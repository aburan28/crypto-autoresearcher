  title: Red-team whether the confound is actually broken and whether the null-object control is blind

  this_task_executes_your_own_recommendation: >-
    TASK-20260817-c603c0 is the direct execution of YOUR OWN named
    next_concrete_action and required_controls from TASK-20260815-907c66, in the
    priority order you gave and as adopted verbatim by DEC-20260815-176614: the
    confound-breaking cross-regime design, plus a null-object control on the
    2-point local-exponent diagnostic itself. You are reviewing your own
    recommendation as executed. Note that your prior report also RETRACTED its
    own earlier framing of this diagnostic as "the sharpest available
    discriminator" on completing the four-shard table; that retraction is part
    of the record you are checking this design against.

  objective: >-
    Attack whether this task actually discharges the directive. Is the
    batch-size/transition-regime confound genuinely broken by this 2x2, or has a
    new confound entered through the window slicing, the shared single call, the
    shared START_INDEX, or the choice of shards 5000 and 8002? Is the
    null-object control a real calibration of the diagnostic, or the fifth
    instance of this campaign's control-blindness pattern?

  must_attack_by_id:
  - RT1-IS-THE-CONFOUND-BROKEN: >-
      State plainly whether the fresh 2x2 actually decouples shard identity from
      transition regime, or whether residual collinearity survives -- through the
      shared START_INDEX, through both regimes for a shard coming from one call,
      through the ORDERING of windows within that call (P1,P2 precede N1,N2 in
      index space for both shards, which is itself a choice), or through the fact
      that only two of the four historically measured shards are represented.
  - RT2-TRACE-THE-CODE: >-
      Trace the actual code, not the design document's argument, for the window
      slicing and both disjointness proofs. This is the discipline that found the
      O7 collinearity in the first place and that refuted the numpy-RNG
      residual-risk story by tracing CTRStream directly.
  - RT3-ATTACK-THE-NULL-OBJECT-HARDEST: >-
      Is S ~ Binomial(56, p) with both arms sharing one law genuinely the object
      on which log2 A_k = 0, paired diff = 0 and alpha = 0.5 are theorems, or
      does the construction force those values independently of whether the
      pipeline is correct? Would a defect in log2_A_from_hists, in evaluable_k
      gating, or in the jackknife batching survive this null undetected?
  - RT4-DOES-THE-CALIBRATION-TRANSFER: >-
      The Binomial law is not the real S distribution. Does it differ in a way
      that makes the calibration inapplicable to the real arms -- and if so, is
      that a fatal objection or a scoped one? Say which.
  - RT5-FIFTH-INSTANCE-TEST: >-
      This campaign has recorded FOUR consecutive controls found structurally
      blind to the defect class they were built to catch (CTRL-BS, CTRL-POSHOM,
      CTRL-IDXMAP, BATCH-4b8ad3's planted arm), with the pattern named at
      BATCH-4b8ad3: an invariance strong enough to force a control's null also
      blinds it to any defect sharing that invariance. Say explicitly whether
      this null-object control is the fifth instance.
  - RT6-INDEPENDENT-NOISE-FLOOR-PROBE: >-
      Run your own replicates of the null object, or your own alternative null
      construction, and state whether you reproduce the reported band. If your
      own probe disagrees with the executor's, that disagreement is the finding.
  - RT7-DO-THE-REPLICATION-CELLS-REPLICATE: >-
      alpha(5000, regime P) against the historical +2.836 and alpha(8002, regime
      N) against the historical -0.8662355237627483 are this family's FIRST
      same-(shard, regime) replications on disjoint data. State what a large gap
      would mean for every number this family has published -- including the ones
      in your own prior reports.
  - RT8-ATTACK-THE-READING-RULE: >-
      Does batch.yaml's four-branch pre-registered rule cover the outcome
      actually observed, or has this campaign produced a THIRD pre-registered
      rule that fails to cover its own result (after DEC-20260809-186c86's
      binary test on BATCH-0e126d and DEC-20260806-1ac8fa's stopping rule on
      BATCH-2ecaa1)? Is Branch N's precedence correct, or does it let a real
      effect be dismissed as noise?
  - RT9-ATTACK-THE-ARM-ASSIGNMENT: >-
      Was choosing the extreme members (5000, 8002) over the mid-range members
      (6000, 8001) a defensible power argument or a selection that flatters the
      design? Would including 6000 or 8001 have changed what can be concluded?
      Was exceeding the directive's two-cell minimum with a four-cell factorial
      an improvement or scope creep that dilutes the required comparison?
  - RT10-DISJOINTNESS-STRENGTH-ASYMMETRY: >-
      Arm A gets a direct cross-process check and Arm B only the adapted one.
      Does that asymmetry itself bias the comparison between the arms? Is the
      claim that Arm A's check "narrows but does not close" Arm B's gap correctly
      scoped, or overstated in either direction?
  - RT11-WHAT-IS-STILL-NOT-KNOWN: >-
      Say what remains unknown after this task, and name the SINGLE CHEAPEST next
      control that would resolve it. If your honest position is that this
      instrument family should stop rather than continue, say that plainly and
      give the evidence -- but do not treat a target as saturated merely because
      it is hard, per docs/inventor-protocol.md Section 4. Premature closure is
      a failure mode symmetric with overclaiming.
  - RT12-SEPARATE-SOUND-FROM-MEANS: >-
      Contest numbers where you can reproduce a contradiction, and keep
      objections about what the numbers MEAN distinct from objections about
      whether they are SOUND. The prior two reports in this family contested no
      reported number and still produced the decisive findings; that is the
      standard, not a limit.

