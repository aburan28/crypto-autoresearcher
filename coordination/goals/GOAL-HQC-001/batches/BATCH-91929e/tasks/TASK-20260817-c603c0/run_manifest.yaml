      from the run log. noc_replicate_summary.csv carries 1200 data rows (3
      unmodified rung pairs x 200 replicates plus 3 planted legs x 200), one row
      per (leg, rung-pair, replicate) with that replicate's se_paired at both
      T-points and its alpha, sufficient for an independent reviewer to
      recompute every null band reported.
