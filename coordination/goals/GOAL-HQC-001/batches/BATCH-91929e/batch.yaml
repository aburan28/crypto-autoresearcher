what_this_batch_is: >-
  THIS BATCH RE-DECIDES NO SCIENCE. It authors the single follow-up task that
  DEC-20260815-176614's next_actions and GOAL-HQC-001's next_action already
  name, verbatim and in the Red Team's own adopted priority order, and that
  neither could dispatch because the Coordinator session that closed
  BATCH-174014 had no shell and could not allocate identifiers. Every
  scientific judgment carried here -- that the batch-size/transition-regime
  confound is the cheapest available discriminator, that further single-shard
  exponents at each shard's own historically-confounded transition have reached
  diminishing returns, that V1's positive-control pilot stays sequenced behind
  this work -- was made in DEC-20260815-176614 and is BOUND here, not reopened.

objective: >-
  Break the batch-size/transition-regime confound that DEC-20260815-176614
  named as BATCH-174014's centerpiece finding, and calibrate the instrument
  that named it. N_JACK_BATCHES=200 is fixed throughout this task family, so
  the jackknife batch size is T/200 and doubles at every T-step: shards
  5000/6000 were BOTH measured only at the T=5,000->10,000 transition (batch
  size 25->50) and BOTH show a positive single-shard local exponent (+2.836,
  +1.402); shards 8001/8002 were BOTH measured only at the T=10,000->20,000
  transition (batch size 50->100) and BOTH show a negative one (-0.268,
  -0.866). Shard identity and transition regime are therefore 100% collinear in
  every measurement this family has ever made, and no shard has ever been
  tested at the other pair's regime. PART A of this batch's single executor
  task measures a COMPLETE, FULLY DISJOINT 2x2 FACTORIAL of (shard) x (regime)
  on fresh trial ranges above every previously consumed index: shard 5000 (from
  the positive pair) and shard 8002 (from the negative pair), EACH at BOTH the
  25->50 and the 50->100 transition, all four cells measured in this task under
  one identical procedure. PART B runs a null-object control on the 2-point
  local-exponent diagnostic ITSELF -- a decoder-free, shard-free i.i.d.
  parametric object on which three quantities are forced analytically
  (log2 A_k = 0 at every k, paired diff = 0 at every k, local exponent
  alpha = 0.5) -- across a four-rung T-ladder at R independent replicates per
  rung, plus a planted-departure sensitivity leg that must demonstrate the
  control is not blind before its null band may be used. Claim tier stays TOY
  throughout.

claim_tier_and_scope: >-
  TOY, HARD CEILING, unchanged. PS-R3 reduced parameters only (n=7187, n_e=56,
  n_2=128, dup=1, N=7168, k range 2..26, m_load_bearing_order=17), one defect
  class (V3, last-block-window-read-early), one injection point (decode_blocks'
  block window, last block, index n_e-1). NOTHING IN THIS BATCH BEARS ON HQC's
  IND-CCA SECURITY, ITS DECODING-FAILURE RATE, ASSUMPTION A17 OR A5, OR ANY
  STANDARDIZED PARAMETER SET. Standardized-parameter runs are out of scope and
  unauthorized. What this batch measures is the behaviour of a
  scaling-characterization INSTRUMENT this program built, not a property of
  HQC. H-HQC-18d1b4 stays PROPOSED and does not move on this batch's dispatch;
  GOAL-HQC-001 stays `active`.

the_confound_this_batch_breaks:
  statement: >-
    In all four single-shard-only local-exponent measurements this family has
    made, shard identity is exactly collinear with the absolute
    trial-count/batch-size transition regime tested. A previously unnamed,
    directly falsifiable THIRD explanation -- "the batch-size/absolute-T regime,
    not shard identity in either sense, drives this diagnostic's sign and
    magnitude" -- is therefore live, is more parsimonious than both of
    DEC-20260809-186c86's named categories, and requires no appeal to shard
    identity of any kind.
  existing_cells:
    shard_5000_regime_P_25_to_50: 2.836
    shard_6000_regime_P_25_to_50: 1.402
    shard_8001_regime_N_50_to_100: -0.2682495157085447
    shard_8002_regime_N_50_to_100: -0.8662355237627483
  existing_cells_note: >-
    Cited from EV-HQC-469c08 O6 (shards 5000, 6000) and EV-HQC-927899 O3-O4
    (shards 8001, 8002). NOT recomputed by this batch; the executor cites them
    and never re-derives them.
  why_it_is_falsifiable_cheaply: >-
    The regime is a free design variable. Nothing prevents running a shard at
    the other pair's transition except that no task has done it. One executor
    task on fresh disjoint trial ranges fills the two empty cells of the 2x2 and
    makes the design matrix full rank.

arm_assignment:
  chosen:
    arm_A: shard 5000 (from the POSITIVE pair), measured at BOTH regimes
    arm_B: shard 8002 (from the NEGATIVE pair), measured at BOTH regimes
  directive_minimum: >-
    GOAL-HQC-001's next_action and DEC-20260815-176614 next_actions item (1)
    require AT LEAST ONE shard from each existing pair tested at the OTHER
    pair's transition regime, on a fresh disjoint trial range. That minimum is
    two new cells: 5000 at 50->100 and 8002 at 25->50.
  what_this_batch_dispatches_instead: >-
    FOUR new cells, not two -- each chosen shard at BOTH regimes -- because the
    two extra cells cost roughly 30,000 additional trial-decodes (about 17
    seconds at this family's own measured throughput) and convert a partial
    break into a complete, fully disjoint, procedurally identical 2x2 factorial.
    THIS EXCEEDS THE DIRECTIVE, IT DOES NOT SUBSTITUTE FOR IT: both required
    cross-regime cells are present exactly as specified, and the two additional
    same-regime cells are strict additions. Declared here explicitly rather than
    slipped in, per the standing rule against silently substituting a different
    design for the one a decision named.
  why_shard_5000_and_shard_8002_rather_than_6000_and_8001:
  - >-
    MAXIMUM HISTORICAL CONTRAST. 5000 (+2.836) and 8002 (-0.866) are the extreme
    members of their respective pairs, spanning 3.702; 6000 (+1.402) and 8001
    (-0.268) span only 1.670. The regime hypothesis and the shard hypothesis
    make maximally separated predictions on exactly the extreme cells, and the
    diagnostic's noise floor -- the very thing in question -- is unknown, so the
    largest available true contrast is the design most likely to clear it.
    Choosing the mid-range members would be the weakest cross-regime test
    available from the same four candidates.
  - >-
    THE STRONGEST DISJOINTNESS PROOF AVAILABLE COMES FREE ON SHARD 5000.
    TASK-20260809-a79e4f's stage 1 persisted a raw per-trial S array for shards
    5000/6000 over indices [0,5000); stage 2 persisted NO raw array for shards
    8001/8002 (confirmed in BATCH-174014's known_code_gap_disclosed and by that
    task's own code read). Arm A's single analysis call regenerates indices
    [0,75000), so its prefix [0:5000) can be compared BIT-IDENTICALLY against
    that committed array at zero marginal cost. That is a genuine cross-run,
    cross-process, cross-session determinism proof -- the strong check
    TASK-20260814-8bbdd2 had and TASK-20260815-e61cca could not have -- and it
    materially narrows (it does not close, being a different shard) the
    same-process-vs-cross-process residual gap DEC-20260815-176614 named for
    the first time with precision.
  - >-
    THE ORIGINAL-VS-FRESH AXIS IS SPANNED AT NO EXTRA COST. Shard 5000 is an
    ORIGINAL shard with a long committed history; shard 8002 is a FRESH shard
    used once. DEC-20260809-186c86's older "shard-specific to the fresh shards"
    framing therefore also gets a cross-regime reading from the same two arms.
  what_would_have_been_a_worse_choice: >-
    Testing only the two required cross-regime cells (5000@N and 8002@P) while
    citing the historical cells as the same-regime comparators. That design is
    the directive's literal minimum, but its two new cells and its two
    comparator cells were produced by DIFFERENT procedures in DIFFERENT
    processes at DIFFERENT trial-index positions, so a difference between them
    could be read as procedural rather than as regime. The 2x2-all-fresh design
    removes that reading for the price of 30,000 trial-decodes.

the_null_object_control:
  it_is_not_optional: >-
    Recorded here in the batch record, not only in the task card, because this
    is the half of the directive most likely to be quietly dropped and because
    DEC-20260815-176614's own limitations block makes it load-bearing: the O6
    diagnostic-reliability finding "rests on an explicitly informal n=4
    illustration, not a calibrated statistical test of the 2-point local
    exponent's true sampling distribution." A two-point log-log slope has ZERO
    internal degrees of freedom. Until its null distribution is measured, every
    number this task family has produced -- including this batch's own four new
    cells -- is uninterpretable in magnitude and possibly in sign.
  what_it_runs_against: >-
    A DECODER-FREE, SHARD-FREE, DEFECT-FREE i.i.d. PARAMETRIC NULL OBJECT: per-
    trial S values drawn as a sum of n_e = 56 independent Bernoulli(p) block
    indicators, i.e. S ~ Binomial(56, p), with p calibrated ONCE before the
    ladder (matched to the mean S of the real undefected arm at T=10,000),
    pre-registered in design.md, and then HELD FIXED for every rung and every
    replicate. Both arms of every synthetic matched pair are drawn from the
    IDENTICAL law and differ only in their RNG stream. The synthetic per-trial
    arrays are fed through the SAME arm_hists / evaluable_k / log2_A_from_hists
    / matched_pair_stats / 2-point-OLS code path the real arms use -- the object
    under test is the pipeline, so no part of it may be bypassed. This is the
    "known-flat parametric construction (e.g. adapting measure.py's 'A_k=1 is a
    theorem' object to the paired-SE estimator)" that DEC-20260815-176614
    next_actions item (2) names as its first option; independent blocks are
    exactly the i.i.d. null under which A_k = 1 holds as an exact rational
    identity, established in BATCH-003.
  forced_values:
  - >-
    FORCED VALUE 1 -- log2 A_k = 0 EXACTLY, at every k, per arm. A_k = 1 is a
    theorem on the independent-block null. The control must report the measured
    log2 A_k and its deviation from 0 at every rung and every k, which directly
    exposes any batch-size-dependent bias in log2_A_from_hists itself -- a
    decoder-free mechanism that could produce the entire observed confound.
  - >-
    FORCED VALUE 2 -- paired diff = 0 EXACTLY, at every k. Both arms share one
    law, so the true matched-pair difference is identically zero.
  - >-
    FORCED VALUE 3, THE ONE THE DIRECTIVE TARGETS -- the 2-point local exponent
    alpha = 0.5. Both arms are i.i.d. draws from one fixed law, so the true
    paired SE scales as c*T^(-1/2) and a 2-point log-log slope on exact SEs
    returns exactly 0.5. THE FORCED VALUE IS 0.5, AND THAT IS THE VALUE THE
    CONTROL MUST RETURN. Stated honestly: the T^(-1/2) law is exact only
    asymptotically, with an O(T^(-1)) finite-T correction, which is precisely
    why the control is run AT THE SAME T-VALUES AND BATCH SIZES as the real arms
    rather than asserting 0.5 from theory -- the measured centre of the
    replicate distribution quantifies the finite-T bias, and its spread is the
    noise floor that has never been measured.
  ladder: >-
    T in {5000, 10000, 20000, 40000}, giving batch sizes 25, 50, 100, 200 (all
    integral). The adjacent rung-pairs 5000->10000 and 10000->20000 ARE the two
    contested regimes exactly; 20000->40000 extends beyond both; the four-rung
    OLS fit carries 2 residual degrees of freedom against the 2-point slope's
    zero. R = 200 independent replicates per rung, pre-registered, with a
    pre-registered cost-projection reduction protocol and an UNDERPOWERED floor
    at R = 50 (see the task card).
  it_is_also_a_direct_test_of_the_confound: >-
    Comparing the null object's own alpha distribution at rung-pair
    5000->10000 against rung-pair 10000->20000 is a decoder-free, shard-free,
    defect-free test of whether batch-size regime alone shifts this diagnostic.
    If it does, the confound is demonstrated to be a property of the INSTRUMENT
    rather than of the cryptographic object at all -- which would be the
    strongest and cheapest result available in this batch, and it costs no
    decoder calls.
  anti_blindness_leg_is_mandatory: >-
    FIFTH-INSTANCE RISK, NAMED IN ADVANCE. This campaign has recorded FOUR
    consecutive controls found structurally blind to the defect class they were
    built to catch (CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP, BATCH-4b8ad3's planted
    arm), with the pattern named at BATCH-4b8ad3: an invariance strong enough to
    force a control's null also blinds it to any defect sharing that invariance.
    A null-object control that can only ever return "about 0.5, looks fine"
    would be the fifth instance. The task therefore carries a PLANTED-DEPARTURE
    leg with a pre-registered fail-closed rule: unless a planted departure is
    driven outside the null band for at least one planted magnitude, the control
    is declared BLIND and its null band carries no interpretive weight at the
    ledger archive.

preregistered_reading_rule:
  status: >-
    FROZEN HERE, BEFORE ANY DATA EXISTS. This is a rule for the COORDINATOR to
    apply at the ledger archive; the executor applies none of it and concludes
    nothing. It exists so that success criteria cannot be adjusted after the
    outcome is seen. Amending it after dispatch requires a versioned
    protocol_amendment record.
  precedence: >-
    BRANCH N IS EVALUATED FIRST AND DOMINATES. If the instrument cannot resolve
    the effect, neither R nor S may be read from it, no matter how the four
    cells fall.
  branch_N_noise: >-
    The null object's replicate distribution of alpha at the relevant rung-pair
    contains the historical exponents, and/or both the regime and shard main
    effects computed on the fresh 2x2 fall inside the corresponding null band.
    READING: the 2-point local-exponent diagnostic cannot adjudicate this
    question. The four historical exponents are not distinguishable from its own
    sampling noise, and NO directional reading in this task family survives --
    including the batch-size/transition-regime confound itself AS AN EXPLANATION
    OF THE SIGN PATTERN. The confound would remain a demonstrated structural
    fact about which cells were sampled, which is not the same claim.
  branch_R_regime_driven: >-
    Each fresh cell lands on the side its REGIME predicts rather than the side
    its SHARD predicts, and the regime main effect exceeds the null band while
    the shard main effect does not. READING: transition regime, not shard
    identity in either of DEC-20260809-186c86's senses, drives this diagnostic's
    sign and magnitude, within the tested shards, regimes, trial ranges and
    budget.
  branch_S_shard_driven: >-
    Each fresh cell tracks its SHARD across both regimes, and the shard main
    effect exceeds the null band while the regime main effect does not. READING:
    shard-to-shard estimator heterogeneity survives the confound break, and the
    regime explanation is disfavoured, within the same scope.
  branch_X_inconclusive: >-
    ANYTHING ELSE -- including a large interaction, a mixed pattern, one cell
    clearing the band and the other not, or a replication cell that fails to
    reproduce its own historical value -- IS RECORDED PLAINLY AS INCONCLUSIVE
    WITH THE OBSERVED VALUES, NOT FORCED INTO N, R, OR S. Included deliberately:
    this campaign has twice had a pre-registered rule fail to cover its own
    outcome (DEC-20260809-186c86's binary test on BATCH-0e126d's measurement;
    DEC-20260806-1ac8fa's stopping rule on BATCH-2ecaa1's pilot), and both times
    the honest record was the one that refused the forced bucket.
  replication_sub_result: >-
    Reported and adjudicated regardless of branch: cell (5000, regime P) is a
    fresh-range replication of the historical +2.836, and cell (8002, regime N)
    of the historical -0.866. THIS IS THE FIRST TIME ANY CELL IN THIS FAMILY IS
    REPLICATED AT THE SAME (shard, regime) ON DISJOINT DATA. A large replication
    gap is itself a decisive finding about the diagnostic and is to be reported
    as such rather than treated as a nuisance.
  validity_gates_dominate_everything: >-
    If the disjointness proof or the F[:, 0:n_e-1] structural invariant is
    reported FAIL or ABORTED on any arm, that arm is an INFRASTRUCTURE OUTCOME
    under AGENTS.md rule 5 and is not evidence about the mathematics in either
    direction. No branch above may be read from an invalid arm.

