    from_committed_per_window_se_paired:
      at_k17: >-
        Recomputing from cross_regime_arms_results.json ->
        per_shard_per_window[shard][window].per_k.se_paired reproduces all four
        headline values with zero floating-point difference, and confirms that
        the `se_paired_k17_lo/hi` fields inside four_fresh_local_exponents are the
