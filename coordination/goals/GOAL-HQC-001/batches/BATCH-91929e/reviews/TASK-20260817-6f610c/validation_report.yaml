      at_other_k:
        k2:  {alpha_5000_P: 0.580733, alpha_5000_N: 0.506553, alpha_8002_P: 0.628397, alpha_8002_N: 0.511866}
        k5:  {alpha_5000_P: 0.697364, alpha_5000_N: 0.455398, alpha_8002_P: 0.606080, alpha_8002_N: 0.492779}
        k9:  {alpha_5000_P: 0.958164, alpha_5000_N: 0.915824, alpha_8002_P: 0.571000, alpha_8002_N: 0.713041}
        k13: {alpha_5000_P: 1.425154, alpha_5000_N: 1.919243, alpha_8002_P: 0.567161, alpha_8002_N: 1.153491}
        k17: {alpha_5000_P: 2.048813, alpha_5000_N: 2.960737, alpha_8002_P: 0.323623, alpha_8002_N: 1.594336}
        k21: {alpha_5000_P: 2.708324, alpha_5000_N: 3.643441, alpha_8002_P: -0.112824, alpha_8002_N: 1.938647}
        k26: {alpha_5000_P: 3.943010, alpha_5000_N: 4.022016, alpha_8002_P: 0.346578, alpha_8002_N: 3.860191}
    contrasts:
      regime_main_effect: {reported: -1.091319093989102, recomputed: -1.091319093989102, delta: 0.0}
      shard_main_effect:  {reported: 1.545795451150731,  recomputed: 1.545795451150731,  delta: 0.0}
      interaction:        {reported: 0.3587893267978908, recomputed: 0.3587893267978908, delta: 0.0}
      all_three_confirmed_arithmetically: true
    finding_the_producer_did_not_surface:
      id: FIND-K
      severity: material-to-interpretation
      finding: >-
        THE HEADLINE "ALL FOUR POSITIVE" IS A k = 17 STATEMENT AND DOES NOT
        SURVIVE THE k SWEEP. At k = 21, alpha(8002, P) = -0.1128: one of the four
        fresh cells is NEGATIVE. More importantly, the four exponents are a
        monotone-increasing function of k in three of four cells: at k = 2 all
        four sit in [0.507, 0.628], i.e. within 0.13 of the analytically forced
        0.5, and they fan out to [0.35, 4.02] by k = 26. The dramatic exponents
        exist only where the estimator is worst sampled. This is the classic
        artifact signature under docs/inventor-protocol.md Section 3: the
        quantity behaves as theory requires exactly where the estimator is
        well-determined, and diverges exactly where it is not. k = 17 is
        legitimately pre-registered (m_load_bearing_order = 17), so this is NOT
        selective reporting -- but the k-dependence is in
        cross_regime_arms_results.json and confound_break_report.md points to it
        (line 118) without tabulating it, so no reader of the report sees it.
        The ledger archive should see it.

  - id: V7-NULL-OBJECT-AS-CONSTRUCTION
    verdict: PASS-WITH-A-MATERIAL-DEFECT
    the_question: >-
      Are log2 A_k = 0, paired diff = 0 and alpha = 0.5 forced by the
      independent-block i.i.d. law, or by a coding choice that makes them
      unfailable?
    answer_1_the_control_CAN_fail: >-
      IT IS NOT A CONTROL THAT CANNOT FAIL. I attacked it as a construction by
      feeding the SAME pipeline (mp.arm_hists -> sa.evaluable_k ->
      measure.comb_matrix -> mp.matched_pair_stats) two inputs that violate the
      null's premises, at T = 20000, k = 17:
        baseline (both arms Binomial(56,p)):  diff = -0.1508, z_paired = -0.32,
          log2A_arm0 = -0.0999, log2A_arm1 = +0.0508
        arm B with DEPENDENT blocks (beta-binomial overdispersion, blocks no
          longer independent): log2A_arm1 = +4.7167, diff = -4.8167,
          z_paired = -9.36
      The estimator moves by nearly five bits and nine sigma when the
      independent-block premise is broken. The forced values are forced by the
      MATHEMATICS (A_k = 1 under independent blocks), not by the code. I traced
      the arithmetic to confirm there is no shortcut: measure.log2_A_from_hists
      (measure.py lines 225-246) computes log2(Hf@C / (T*C(n_e,k))) - k*log2(q)
      from the histograms themselves, with no branch that returns 0.
      A THIRD PROBE I RAN IS INFORMATIVE AND I REPORT IT HONESTLY AS A NON-TEST:
      giving arm B a different p (p*1.02) does NOT move diff (from -0.151 to
      -0.047). That is CORRECT behaviour, not blindness: A_k is normalised by q^k
      by construction, so it is invariant to the marginal rate. Anyone attacking
      this control should not read that as a failure.
    answer_2_the_forced_values_are_not_forced_at_the_ESTIMATOR_level: >-
      "0 EXACTLY" is wrong as written. null_object_control.py lines 232-233 and
      design.md Section 3.4 items 1-2 state forced values 1 and 2 as "0 EXACTLY
      at every k"; the honest_caveat is attached only to item 3. A_k = 1 is an
      exact POPULATION identity; the plug-in estimator of log2 A_k is a nonlinear
      function of sample moments and is biased and noisy at finite T. The run
      measured this and the numbers are large: at T = 5000, max |log2 A_k| over
      replicates and k is 8.089 and max |paired diff| is 12.244; at k = 17 the
      paired diff has SD 0.772. The producer reports all of these, so nothing is
      hidden -- but the "three forced values" framing in design.md, in the script
      and in the snapshot receipt overstates what is forced.
    answer_3_a_real_positive_result_the_producer_measured_but_did_not_headline: >-
      Forced value 1 was billed as the direct decoder-free test of whether
      log2_A_from_hists carries a batch-size-dependent bias. IT DOES, AND THE RUN
      MEASURED IT. Mean log2 A_k at k = 17, arm 0, by rung:
        T=5000 (batch 25):  -0.1441
        T=10000 (batch 50): -0.1016
        T=20000 (batch 100):-0.0265
        T=40000 (batch 200):-0.0476
      The bias is nonzero at the smallest rung and decays toward 0 as T grows,
      which is the direction it SHOULD decay. Separately, the full-ladder fit
      returns alpha = 0.35133 +/- 0.23433 over 200 replicates (SE of the mean
      0.0166), i.e. the diagnostic is biased LOW relative to its own analytically
      forced 0.5 by -0.1487, about nine standard errors. That is a measured
      instrument defect and it is not stated as one anywhere in the report.
    answer_4_THE_MATERIAL_DEFECT_the_null_object_is_the_WRONG_SHAPE:
      id: FIND-SHAPE
      severity: material -- this is the most consequential finding in this review
      finding: >-
        The null object does not have the same shape as the object it is supposed
        to calibrate. At null_object_control.py lines 256-257 the two arms are
        drawn from INDEPENDENT RNG streams
        (rng_for(T,r,0,0) and rng_for(T,r,1,0)), so the synthetic "matched pair"
        is not matched at all. The real Part A pair is the SAME trials decoded
        twice: the F[:,0:n_e-1] invariant of V5 is precisely the statement that
        the two real arms differ in ONE block out of 56. I measured the
        consequence rather than arguing it:
          mean se_unpaired/se_paired at k=17, producer's null object:
            T=5000 0.998, T=10000 0.997, T=20000 0.998   (NO pairing gain at all)
          same ratio in the eight REAL fresh cells:
            2.34, 5.60, 6.69, 6.84, 15.27, 15.66, 17.26, 28.69
          max |S_defected - S_undefected| per trial in every real cell: 1
          fraction of trials where the arms differ at all: 10.4% - 11.4%
        The producer's null object therefore measures the sampling behaviour of
        an UNCOUPLED difference, while Part A's alpha is computed from a
        COUPLED one. The producer noticed the symptom (limitation 4: the null's
        se_paired is "one to two orders of magnitude LARGER" than the real arms')
        but did not identify the cause and did not conclude that the object is
        the wrong shape.
      what_i_did_about_it: >-
        I built the missing same-shape null and ran it: arm A = 56 independent
        Bernoulli(p) block indicators; arm B = the identical draw with ONLY the
        last block re-drawn. That reproduces the real pair's coupling structure.
        Its mean se_unpaired/se_paired is 4.77 / 4.47 / 4.19 across the three
        rungs -- inside the real cells' range, where the producer's is 1.0.
      the_result_cuts_AGAINST_the_producer_not_for_it: >-
        The correctly-shaped null gives WIDER bands, not narrower ones:
          rung pair 5000->10000 (regime P, batch 25->50):
            producer uncoupled band [-1.4498, 1.7379], width 3.1877
            same-shape coupled band [-2.1291, 2.1965], width 4.3255
          rung pair 10000->20000 (regime N, batch 50->100):
            producer uncoupled band [-1.0296, 1.7589], width 2.7884
            same-shape coupled band [-1.3662, 2.1421], width 3.5083
        So fixing the shape does not rescue the diagnostic; it makes it look
        worse. Under the producer's own band, 2 of the 4 fresh cells sit outside
        (alpha_5000_P and alpha_5000_N). Under the same-shape band, only 1 of 4
        does (alpha_5000_N = 2.9607), and 6 of the 8 numbers this campaign has
        ever produced -- 4 fresh plus 4 historical -- sit INSIDE a band generated
        by an object with no decoder, no shard, no defect and no regime.
      caveat_on_my_own_null: >-
        My coupled null re-draws the last block independently, so its arms differ
        on ~2p(1-p) = 43% of trials, where the real V3 defect changes S on ~11%.
        It is therefore a HARSHER perturbation than the real one and its band is
        an upper bound on what a perfectly matched null would give. It was NOT
        pre-registered, it is a reviewer robustness probe, and it must not be used
        as an adjudicating band by the ledger archive. Its role here is to
        establish the DIRECTION of the shape error, which it does unambiguously.

  - id: V8-SENSITIVITY-LEG
    verdict: PASS-WITH-TWO-DEFECTS
    does_the_leg_perturb_what_it_claims: >-
      YES, INDEPENDENTLY CONFIRMED. I re-implemented the plant transform
      S_planted = clip(round_half_away(mu + g*(S_base - mu)), 0, 56) and measured
      the realized dispersion at T = 20000, replicate 0:
        g=1.25: var 12.195 -> 19.147 (ratio 1.570), mean 17.854 -> 17.943,
                clipped fraction 0.0,     measured rho = 1.1245
        g=1.5:  var 12.195 -> 27.509 (ratio 2.256), mean 17.854 -> 18.030,
                clipped fraction 0.00035, measured rho = 1.2300
        g=2.0:  var 12.195 -> 48.473 (ratio 3.975), mean 17.854 -> 17.715,
                clipped fraction 0.006,   measured rho = 1.3842
      My per-replicate rho values bracket the producer's reported means (1.1336,
      1.2130, 1.3921). The plant IS realized, the transform IS dispersion-
      inflating and approximately mean-preserving, and clipping is negligible.
    forced_identity_check:
      producer_claim: >-
        alpha_planted = alpha_unmodified - log2(rho_g) held to a maximum absolute
        residual of 6.217248937900877e-15 over 600 planted replicates, cited in
        the snapshot receipt as showing "the plant was demonstrably realized".
      my_recomputation: >-
        I recomputed the residual from noc_replicate_summary.csv, joining each
        planted row to the unmodified row with the same replicate index, and
        reproduce the producer's numbers EXACTLY: max |residual| =
        6.217249e-15 for every g, mean |residual| = 1.4522e-15 / 1.4468e-15 /
        1.4582e-15. The arithmetic is correct.
      DEFECT:
        id: DEF-3
        severity: material-to-interpretation
        finding: >-
          THE FORCED IDENTITY IS ALGEBRAICALLY VACUOUS AND CARRIES NO INFORMATION
          ABOUT WHETHER THE PLANT WAS REALIZED. Substituting the definitions used
          at null_object_control.py lines 510-514 and 415:
            alpha_planted    = -(log se_pl - log se_lo)/log 2
            alpha_unmodified = -(log se_hi - log se_lo)/(log 20000 - log 10000)
            rho              = se_pl / se_hi
          the residual alpha_planted - (alpha_unmodified - log2 rho) cancels to
          zero identically, for ANY three positive numbers. I demonstrated this
          empirically: feeding 20,000 triples of ARBITRARY, UNRELATED random
          positive numbers into the same expression gives a maximum residual of
          1.07e-14 -- the same order as the 6.2e-15 obtained on the real data.
          The residual is measuring nothing but the last-ulp difference between
          computing log 2 as `math.log(20000) - math.log(10000)` and as
          `math.log(2.0)`.
        consequence: >-
          The snapshot receipt's sentence "the forced identity ... held to a
          maximum absolute residual of 6.217248937900877e-15 over 600 planted
          replicates -- so this is an instrument sensitivity finding, not a failed
          plant" rests half on a tautology. The OTHER half -- rho rose
          monotonically 1.134 -> 1.213 -> 1.392 with g -- IS real evidence, I
          reproduced it, and it alone is sufficient to establish that the plant
          was realized. THE CONCLUSION SURVIVES; THE CITED SUPPORT MUST BE
          HALVED. The ledger archive must not carry the identity forward as
          corroboration.
    in_band_out_of_band_verdicts:
      do_i_agree: >-
        YES on the arithmetic. Using the band recomputed from the CSV by me
        ([-1.0295584295881741, 1.7588760235887884]) and the planted medians
        recomputed by me (0.129895, 0.059429, -0.115719), all three medians lie
        inside the band. All three IN_BAND verdicts are correct, and the BLIND
        verdict follows correctly from the pre-registered rule.
      DEFECT:
        id: DEF-4
        severity: material -- the leg was underpowered by construction
        finding: >-
          THE SENSITIVITY LEG COULD NOT HAVE RETURNED OUT_OF_BAND AT ANY
          PRE-REGISTERED g. The verdict rule requires the planted median to leave
          a band whose lower edge is 1.337 below the unmodified median (0.3071)
          and whose upper edge is 1.452 above it. The plant shifts the median by
          exactly -log2(rho_g): -0.191, -0.222, -0.429 at the three g. To clear
          the band you need log2(rho) > 1.337, i.e. rho > 2.53. The largest rho
          the largest pre-registered g produced is 1.392 -- short by a factor of
          about 3.1 in log2 terms, and rho grows slowly in g (g doubled from 1.0
          to 2.0 bought only 0.39 in rho). The leg therefore cannot distinguish
          "the instrument is insensitive to this departure class" from "the
          planted magnitudes were too small for this band". The BLIND verdict is
          correctly derived and correctly reported, but its INFORMATIONAL content
          is much weaker than "the instrument is blind": it is closer to "the
          band is too wide for a plant of this size to escape". Both readings
          lead to the same operational consequence (the band carries no
          interpretive weight), so the pre-registered rule fired in the right
          direction anyway. A future leg must either pre-register g values chosen
          against a measured band or plant on the coupling structure rather than
          the dispersion.
      DEFECT_2:
        id: DEF-5
        severity: undeclared-departure-from-pre-registration
        finding: >-
          design.md Section 3.5 pre-registers the RNG as
          SeedSequence([20260817, T, r, arm_index, leg_code]) with
          "leg_code = 1 + index of g for the sensitivity leg". THE CODE DOES NOT
          DO THIS. At null_object_control.py line 254 `replicate` accepts
          `leg_code=0` as a parameter, and at lines 256-257 it calls
          rng_for(T, r, 0, 0) and rng_for(T, r, 1, 0) with the leg code HARD-CODED
          TO ZERO. `leg_code` is dead: the planted replicates reuse the unmodified
          replicates' base draws exactly. The script's own `construction` string
          (line 529) says "same replicate seeds", so the behaviour is disclosed at
          one level while contradicting the frozen design at another, and it is
          NOT listed among the protocol deviations (only DEV-1 is).
          Is it consequential? Reusing the base draw is arguably the better
          choice -- it makes rho a paired measurement -- and it does not affect
          the median-versus-band verdict. But it makes the planted and unmodified
          alpha distributions perfectly coupled, so the reported
          "fraction of planted replicates outside the null band" (0.055 / 0.070 /
          0.095) is a paired quantity being compared to an unpaired band, which is
          not what a reader will assume. The departure is small in effect and
          undeclared in the record; it should be recorded as a second deviation.

