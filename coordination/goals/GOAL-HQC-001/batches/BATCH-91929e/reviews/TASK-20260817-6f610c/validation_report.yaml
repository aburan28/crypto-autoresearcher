    the_consequence_the_task_asked_me_to_state_plainly: >-
      THE BANDS ARE WIDER THAN THE ENTIRE PHENOMENON THIS CAMPAIGN HAS BEEN
      STUDYING. The historical exponent spread that motivated the campaign is
      2.836 - (-0.8662355237627483) = 3.7022355237627482. The producer's null
      bands are 3.1877 and 2.7884 wide; my same-shape null bands are 4.3255 and
      3.5083 wide. A decoder-free, shard-free, defect-free, regime-free object
      fed through the identical pipeline produces alpha scatter of the same
      magnitude as the effect. Concretely, against my same-shape null:
        alpha_5000_P = +2.0488 INSIDE, alpha_5000_N = +2.9607 OUTSIDE,
        alpha_8002_P = +0.3236 INSIDE, alpha_8002_N = +1.5943 INSIDE
        historical 5000_P = +2.836 OUTSIDE, 6000_P = +1.402 INSIDE,
        8001_N = -0.2682 INSIDE, 8002_N = -0.8662 INSIDE
      Six of the eight exponents this campaign has ever produced are
      indistinguishable from the sampling noise of an object that has none of the
      structure they are being read for. Against the producer's own (narrower,
      wrong-shape) band the count is six of eight as well, with a different two
      outside.
      WHAT THIS MEANS FOR ANY EXPONENT IN THIS FAMILY, INCLUDING THE FOUR FRESH
      ONES: the 2-point local exponent of se_paired at k = 17, at T in the low
      tens of thousands with nb = 200, IS NOT AN INTERPRETABLE QUANTITY AT THIS
      SAMPLE SIZE. Its per-replicate SD under the null is ~0.7-1.0 and its own
      se_paired inputs have a relative SD of ~0.48-0.59 at every rung. Reading a
      SIGN off a single realization of it -- which is what every directional
      claim in this task family has done -- is reading noise, unless the
      realization clears a band, and the band is wider than the effect.
      Two independent routes reach that same place: (i) the pre-registered
      fail-closed rule already says a BLIND control's band carries no
      interpretive weight, and (ii) the band that does exist is wider than the
      phenomenon. Neither route licenses the opposite claim either: this is a
      statement that the INSTRUMENT cannot resolve the question, not a statement
      that there is nothing to resolve.
      SCOPE OF THAT STATEMENT: PS-R3 reduced parameters, k = 17, T in
      {5000, 10000, 20000, 40000}, nb = 200, one defect class. It says nothing
      about HQC.

