  # ------------------------------------------------------------------ #
  # 4. REQUIRED JUDGMENTS
  # ------------------------------------------------------------------ #
  required_judgments:

  - question: "Is the fresh 2x2 factorial an ADMISSIBLE measurement of the
      (shard x regime) contrast?"
    answer: YES -- ADMISSIBLE, plainly.
    reasoning: >-
      Every gate it declares in advance genuinely passes, and I re-derived all of
      them from data my own driver generated rather than from its report. The
      trial ranges are genuinely fresh on both shards against an exhaustively
      re-derived high-water mark. The windows are genuinely disjoint and come from
      exactly one call per (shard, variant). Both disjointness proofs hold at
      exact bit-identity with no tolerance applied. The structural invariant holds
      on 4,950,000 elements and is non-vacuous. The four exponents and three
      contrasts reproduce to the last bit from an independent implementation and
      an independent process. Nothing is fabricated; the spend is measured three
      ways; the deviation that exists is declared. This is an admissible
      measurement receipt.
    scope_it_is_admissible_within: >-
      PS-R3 reduced parameters (n=7187, n_e=56, n_2=128, dup=1, N=7168), shards
      5000 and 8002 only, trial indices [30000:75000), one defect class (V3), one
      injection point, k = 17 primary with k = 2..26 recorded, T in
      {5000, 10000, 20000}, nb = 200, this decoder path, this budget. NOTHING
      about HQC IND-CCA security, its decoding-failure rate, assumption A17 or
      A5, or any standardized parameter set. CLAIM TIER TOY.
    what_admissibility_does_NOT_mean: >-
      It does not mean the four exponents mean what a reader would take them to
      mean. Two separate findings bound their interpretation: FIND-K (the "all
      four positive" headline is a k=17 statement, and one cell is negative at
      k=21, with all four converging on the forced 0.5 at small k) and the V9
      band result (a structureless null object produces alpha scatter wider than
      the entire historical spread). The measurement is admissible; the exponent
      is not, at this sample size, an interpretable quantity.

  - question: "Is the null-object control an ADMISSIBLE calibration of the 2-point
      local-exponent diagnostic?"
    answer: >-
      NO -- NOT ADMISSIBLE AS A CALIBRATION. It IS admissible as a measurement of
      something else, which is worth having.
    admissible_as: >-
      A valid, reproducible measurement of (i) the finite-T behaviour of
      log2_A_from_hists on an independent-block law, including a real,
      T-decaying, batch-size-dependent bias of -0.144 at the smallest rung;
      (ii) a real ~9-sigma low bias of the 2-point exponent relative to its own
      forced 0.5; and (iii) the decoder-free demonstration that batch-size regime
      ALONE does not shift the diagnostic (difference of means between the
      25->50 and 50->100 rung pairs is 0.0217 against a per-replicate SD of 0.70,
      i.e. well under half a standard error of the mean). That third item is the
      strongest positive content in Part B and it is a genuine negative control
      result.
    not_admissible_as_a_calibration_for_two_independent_reasons:
    - "1. THE PRE-REGISTERED FAIL-CLOSED RULE ALREADY SAYS SO. No planted
      magnitude drove the planted median outside the band; the control is BLIND
      by its own frozen rule and its band carries no interpretive weight. The
      producer applied the rule correctly and said BLIND in that exact word. I
      confirm the arithmetic and the verdict, and I add that the leg could not
      have returned anything else at the pre-registered g values (DEF-4), which
      weakens what BLIND tells us but does not change the operational
      consequence."
    - "2. IT IS THE WRONG SHAPE, WHICH I MEASURED. Its two arms are independent
      draws (se_unpaired/se_paired = 1.00) where the real pair is the same trials
      decoded twice (se_unpaired/se_paired = 2.34 to 28.69, max |S_d - S_u| = 1).
      A null object that does not reproduce the coupling the estimator exploits
      is not a null object of the same shape, and per docs/inventor-protocol.md
      Section 3 that is a prerequisite, not a refinement. I built the same-shape
      null and its bands are WIDER (4.33 and 3.51 versus 3.19 and 2.79), so the
      shape error does not flatter the producer -- but the band it produced is
      still not the band that calibrates Part A."
    is_it_a_control_that_cannot_fail: >-
      NO. This was the specific risk the batch named in advance (fifth-instance
      risk), and I tested it directly rather than by reading. The pipeline moves
      by +4.72 bits and 9.4 sigma when the independent-block premise is broken.
      The three values are forced by the mathematics, not by the code. That
      answer is separate from, and does not rescue, the two reasons above.

