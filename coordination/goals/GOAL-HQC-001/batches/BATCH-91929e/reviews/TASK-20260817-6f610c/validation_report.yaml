    adequacy_judgment: >-
      The adapted proof is an ADEQUATE SUBSTITUTE FOR ITS OWN PURPOSE and is NOT
      equivalent to the direct check, and the producer says so. Its logical
      content is: (i) shard 8002's trial stream reproduces the committed DERIVED
