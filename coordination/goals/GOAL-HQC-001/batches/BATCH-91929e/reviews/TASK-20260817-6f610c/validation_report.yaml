  reading_rule_note:
    rule_not_applied: true
    statement: >-
      As directed, I did not apply batch.yaml's four-branch reading rule and I
      name no branch. That is the ledger archive's adjudication.
    are_the_delivered_numbers_the_ones_the_rule_needs: PARTIALLY -- one gap
    the_gap: >-
      Branch N's first clause ("the null object's replicate distribution of alpha
      at the relevant rung-pair contains the historical exponents") IS answerable
      from the delivered artifacts, and so is the replication_sub_result. But
      branch N's second clause and BOTH branch R and branch S turn on whether
      "the regime main effect exceeds the null band" and whether "the shard main
      effect exceeds the null band". NO NULL DISTRIBUTION FOR A MAIN-EFFECT
      CONTRAST WAS DELIVERED. Part B produces null bands for a SINGLE alpha at a
      single rung pair; a main effect is a contrast of FOUR alphas and has a
      different, narrower null distribution which nothing in the artifact set
      computes. Comparing -1.0913 or +1.5458 to a single-alpha band would be a
      category error, and the archive should not do it.
      For the archive's information only, and explicitly NOT as a pre-registered
      band and NOT as an adjudication: propagating the delivered per-rung-pair SDs
      through the contrast definitions under an independence assumption gives a
      main-effect null SD of about 0.75 (producer's uncoupled null) or about 1.01
      (my same-shape null), i.e. indicative 95% half-widths of about 1.47 and
      1.98. The observed regime main effect (-1.0913) is inside both. The observed
      shard main effect (+1.5458) is marginally outside the first and inside the
      second. If the archive intends to read branch R or S it needs a
      main-effect null it can cite, and this batch did not produce one.

