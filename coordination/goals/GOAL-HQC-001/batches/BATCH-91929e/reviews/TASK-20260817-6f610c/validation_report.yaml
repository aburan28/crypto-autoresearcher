  control_checks:
  - id: CTRL-NULL-OBJECT
    kind: null-object control (docs/inventor-protocol.md Section 3)
    shape_of_the_null: >-
      DECODER-FREE, SHARD-FREE, DEFECT-FREE, REGIME-FREE -- correct in those four
      respects. WRONG IN THE FIFTH AND DECISIVE ONE: the pair is uncoupled where
      the real pair is coupled. See FIND-SHAPE under V7.
    does_the_report_state_what_the_quantity_should_do: >-
      PARTIALLY. design.md Section 3.4 item 3 correctly states that alpha should
      approach 0.5 with an O(1/T) correction and that the ladder exists to
      measure that correction, and the run does measure it (-0.149 +/- 0.017 on
      the full-ladder fit -- a real, ~9-sigma low bias). design.md Section 3.4
      items 1 and 2 state their forced values as "0 EXACTLY", without the
      finite-T caveat, which is wrong at the estimator level. The
      batch-size-dependent bias in log2 A_k DOES decay with T as it should
      (-0.144, -0.102, -0.027, -0.048 at k = 17), which is the correct
      non-artifact behaviour, and the producer measured it but did not state the
      expectation in advance for that quantity.
    verdict: >-
      GENUINE CONTROL, NOT A CONSTRUCTION THAT CANNOT FAIL -- established
      positively by my dependent-blocks probe (log2 A_k moves from ~0 to +4.72,
      z = -9.36). But NOT A VALID CALIBRATION of the Part A diagnostic, for the
      shape reason above and, independently, because the pre-registered
      fail-closed rule already declared it BLIND.
