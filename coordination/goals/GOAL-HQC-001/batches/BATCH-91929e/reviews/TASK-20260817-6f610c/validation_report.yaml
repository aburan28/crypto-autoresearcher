        finding: >-
          DEV-1's PRE-Part-A anchor is NOT verifiable from the record. The claim
          is that design.md hashed to
          7511ecc1698749156cf89c8c476b93d3baf7c35980a36d5812f21b21f7ba25e0 before
          Part A launched, and that the ONLY subsequent change was the marked
          Section 3.2 block. I tested this rather than accepting it:
          (a) THE PRE-FILL BLOB WAS NEVER COMMITTED ANYWHERE. The batch-opening
