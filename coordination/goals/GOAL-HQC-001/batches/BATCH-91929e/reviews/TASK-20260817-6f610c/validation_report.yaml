    what_i_found:
      step_1:
        evaluable_k_match: true
        n_batches_match: true
        hard_invariant_integers_exact_match: true
        float64_bit_identity_all_eight_fields: true
        max_relative_deviation_observed: 0.0
        tolerance_i_used: >-
          NONE. I attempted exact float64 bit-identity first (byte comparison of
