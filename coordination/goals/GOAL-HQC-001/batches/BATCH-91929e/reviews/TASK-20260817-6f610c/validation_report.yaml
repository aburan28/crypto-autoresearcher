        "20000->40000 (batch 100->200, neither regime)": {band: [-1.032605597147907, 1.8643962074991292],
          width: 2.8970018046470362, mean: 0.37430594487938224, sd: 0.6843533316009405,
          forced_0.5_inside: true}
      four_rung_full_ladder_fit: >-
        Reported alpha_mean 0.35132700707861575, alpha_sd 0.2343335278332064,
        percentiles [-0.09525689286568811, 0.3545340158319973, 0.7891288122319279],
        residual dof 2, fit_residual_rms_mean 0.2135568768427767, and per-pair
        scatter of the 2-point estimates about the line with SDs 0.746 / 0.666 /
        0.658. These are consistent with the per-pair distributions I recomputed
        (the full-ladder fit's SD is ~3x tighter than any 2-point estimate, which
