      SEPARATELY, AND MORE IMPORTANTLY: the residual risk this leaves is now
      SMALLER than the producer's own framing implies, for a reason the producer
      did not use. My V2/V12 index-keying probe (below) shows _t_shard derives
      trial ti from CTRStream(key, dom || ti) with key = sha_key(ps_id,"T",shard,
      MASTER_SEED) and nothing else, so trial ti is a pure function of (parameter
      set, shard, ti). Given that, "same process" versus "cross process" cannot
      change a trial. The remaining exposure is only that stage_a.py's sampler
      might not be what I read -- and its sha256 pin is verified.
    dec_20260815_176614_item_2_correction:
      required: >-
        The residual-risk statement had to be corrected: the risk is the
        SAME-PROCESS-vs-CROSS-PROCESS gap, explicitly NOT numpy RNG drift or
        platform drift.
      present: true
      where: >-
        design.md Section 2.5 Step 4 (lines 169-183) and
        disjointness_proof_results.json ->
        arm_B_adapted_disjointness_proof.step_4_required_correction, generated at
        cross_regime_arms.py lines 619-633.
      correct: true
      my_check_of_the_correction_itself: >-
        I verified the CLAIM the correction rests on by reading stage_a.py rather
        than citing BATCH-174014's Red Team. CTRStream (lines 171-204) is
        SHA-256 in counter mode over key||dom||ctr with an integer-derived key
        (sha_key, lines 158-164) and fixed_weight_support (lines 206-219) is
        Floyd's algorithm over that stream. There is no numpy RNG and no
        platform-dependent primitive anywhere in the T-arm sampler. The
        correction is CORRECT, not merely present.
      step_5_narrowing_not_closure: >-
        Present and correctly limited (design.md lines 184-188): Arm A's pass is
        recorded as NARROWING but not CLOSING Arm B's gap because shard 5000 is a
        different CTRStream key. Accurate.

  - id: V5-F-INVARIANT
