  - id: V12-PROCEDURAL-DIFFERENCE
    verdict: PASS -- and the difference cannot move any number, which I can show
      more strongly than the producer did
    the_executors_check: >-
      CONFIRMED PRESENT AND CORRECT, 32 of 32, and reproduced: for every
      (shard, variant, window), sa.batch_hists on a standalone np.array copy
      equals sa.batch_hists on the slice view, and np.linspace(0, T, 201)
      .astype(int) gives 200 batches of width exactly T/200 (25, 50, 50, 100).
      I judge check (a) NEARLY VACUOUS -- comparing a function's output on a copy
      to its output on a view of the same values can only fail if numpy is broken
      -- and check (b) trivially true arithmetic. They are true but they are not
      the check that settles the question.
    the_check_that_settles_it_which_i_ran_myself: >-
      I read _t_shard (stage_a.py lines 475-565) and found that trial ti draws
      all five of its vectors from CTRStream(key, b"vN" + ti.to_bytes(8)), with
      key = sha_key(ps_id, "T", shard, MASTER_SEED). Trial ti is a PURE FUNCTION
      of (parameter set, shard, ti) and of nothing else -- not n_trials, not
      position within a decoder batch. And decode_blocks (stage_a.py lines
      286-307) is strictly row-wise: every operation is per-trial, so the decoder
      batch a trial lands in cannot affect its F row.
      EMPIRICAL CONFIRMATION FROM MY OWN DRIVER: F from a 200-trial call and F
      from a 137-trial call are bit-identical on their common prefix
      (200 = 3 full batches + 8; 137 = 2 batches + 9, i.e. deliberately different
      alignment), and a 137-trial call at decoder batch size 7 is bit-identical to
      one at batch size 64. The producer's own Arm A proof independently
      demonstrates the same thing without noticing: the committed 5000-trial call
      ended in a partial decoder batch of 8, the 75000-trial call put those same
      trials in a full batch of 64, and the outputs are bit-identical.
    could_the_difference_move_any_reported_number: >-
      NO. A dedicated T-trial call over the SAME trial indices would return
      bit-identical se_paired and hence a bit-identical alpha. I also checked the
      historical procedure itself rather than assuming: the historical cells were
      ALSO built from disjoint index ranges (shard 5000: [0:5000) from a79e4f
      stage 1 and [5000:15000) from 8bbdd2; shard 8002: [0:10000) from a79e4f
      stage 2 and [10000:30000) from e61cca), so the fresh design does not differ
      from them in nestedness either. The only surviving difference is which
      trial INDICES each cell used, which is the intended difference and is the
      point of the task.
    limitation_status: >-
      The producer names the limitation regardless of the check's outcome
      (report Section 4 item 1). That is the right discipline. On the evidence
      above I record it as CLOSED rather than open, and I recommend the archive
      note the mechanism (index-keyed CTRStream + row-wise decoder) rather than
      carrying the limitation forward unresolved for a third task.

