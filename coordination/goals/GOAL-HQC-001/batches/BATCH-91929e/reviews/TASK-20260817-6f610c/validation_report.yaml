  - id: V6-EXPONENT-RECOMPUTATION
    verdict: PASS
    end_to_end_from_raw_data_my_own_driver_wrote:
      scope: ALL FOUR cells, not the required minimum of one.
      method: >-
        My driver ran its own six decoder calls, sliced its own four windows,
        called mp.arm_hists / sa.evaluable_k / measure.comb_matrix /
        mp.matched_pair_stats, and applied
        alpha = -[log(SE_hi) - log(SE_lo)] / [log(T_hi) - log(T_lo)] to se_paired
        at k = 17.
      results_i_obtained:
        alpha_5000_P: 2.0488128380076307
        alpha_5000_N: 2.960737268597787
        alpha_8002_P: 0.32362272345795423
        alpha_8002_N: 1.5943364808460014
      agreement_with_the_producer: >-
        IDENTICAL TO THE LAST BIT on all four. Beyond the four exponents I also
