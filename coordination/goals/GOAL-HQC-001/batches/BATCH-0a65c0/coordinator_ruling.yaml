coordinator_ruling:
  ruled_by: coordinator
  ruled_at: '2026-08-06'
  batch_id: BATCH-0a65c0
  goal_id: GOAL-HQC-001
  context: Both independent reviews of the v3 amendment returned ADMIT (TASK-20260806-f53255 validator,
    TASK-20260806-250b29 red team), which satisfies the dependency gate on the PS-R3 measurement TASK-20260806-cde749.
    Three items require a Coordinator ruling BEFORE that task runs. This ruling is carried into the batch
    decision DEC-20260806-2947ba; it creates no new claim.
  rulings:
  - id: RULE-1
    'on': 'Validator F-1: CTRL-IDXMAP and CTRL-POSHOM clause (b) are declared blocking, but their required
      artifacts (index_map.json, pair_counts_by_position.csv) need a gather requirement inside stage_a.py
      that the measurement task can neither write nor read. Strictly read, the final batch aborts.'
    ruling: 'BOTH ARE FORWARD OBLIGATIONS FOR THIS RUN, NOT BLOCKING GATES. They are reported NOT RUN
      and cited as passing by NOBODY. The measurement proceeds. Rationale: a control that cannot be evaluated
      inside the authorized write and read scopes is an unmet obligation, and treating an unmeetable obligation
      as a blocking gate would abort the campaign on a scoping artifact rather than on anything about
      the instrument or about HQC. The cost is explicit and travels into the evidence record: the measurement
      runs with two declared controls UNEVALUATED, and any reading of it must carry that.'
  - id: RULE-2
    'on': 'Red team RT3-OBJ-1: CTRL-IDXMAP''s binding reference expression says L = n_2*dup, which at
      PS-A (dup=3) gives n_e*L = 52,992 > N = 17,664 and raises IndexError -- it would fire with certainty
      on a CORRECT run. The same file asserts n_e*L = N elsewhere. The toy demonstration used n_2=10,
      dup=1, the one regime where both formulas coincide.'
    ruling: 'RECORDED AS A DEFECT IN THE v3 AMENDMENT, NOT REPAIRED IN THIS BATCH. It does not block the
      measurement: CTRL-IDXMAP is SPECIFICATION ONLY and unrun under RULE-1, and the funded cell PS-R3
      has dup=1 where the expression is degenerate. THE PATTERN IS THE FINDING, and it is now the THIRD
      instance in this campaign of one failure mode -- a control demonstrated only in the regime where
      its own defect is invisible (CTRL-BS, then CTRL-POSHOM''s advertised list, now CTRL-IDXMAP). That
      recurrence, not any single control, is what the successor must address.'
  - id: RULE-3
    'on': 'OPEN-8: log2 A_2 is recoverable in two lines from the already-committed Stage-A (T) S-histograms,
      so a primary measurement is derivable from a diagnostics-only authorization.'
    ruling: k=2 IS AUTHORIZED AS A REPORTED CELL of this measurement under the frozen v3 interval, rather
      than left derivable-but-unruled. A quantity that anyone can compute from committed data in two lines
      is not protected by declining to name it; naming it and binding it to a frozen decision rule is
      the honest handling. This does not authorize any other stage or cell.
  - id: RULE-4
    'on': 'Validator F-2: recalibrate.py''s inject() opens the amendment for writing unconditionally,
      and the documented reproduction route mutates a snapshot-committed artifact.'
    ruling: REPRODUCTION MUST BE RUN AGAINST A COPY. The measurement task does not invoke recalibrate.py
      at all; it loads the frozen constants read-only. Recorded so no successor follows the documented
      route and silently mutates a committed artifact.
  - id: RULE-5
    'on': 'Familywise size: the validator independently measures 1.017 percent +/- 0.014 at the funded
      configuration against 0.27 percent nominal (3.77x), and the amendment states it.'
    ruling: BINDING ON HOW THE RESULT IS READ. Only the pre-specified k = m = 17 cell retains its 0.27
      percent size (validator measures 0.002716). A single fired cell out of 17 is roughly 1-in-100 under
      the exact null, NOT 1-in-370. No batch record may report a battery firing as if each cell were a
      0.27 percent test, and the evidence record must carry this sentence.
  what_this_ruling_does_not_do:
  - It changes no research status and creates no evidence. H-HQC-18d1b4 remains proposed.
  - It does not amend experiments/EXP-HQC-982268/specification.yaml. The v3 amendment is admitted as the
    frozen decision table for this run only, by DEC-20260806-2947ba at the batch ledger archive.
  - It asserts nothing about HQC, A17, A5, decoding-failure rates, or any standardized parameter set.
    Claim tier stays toy.
  - It does not close RT2-OBJ-1 (composite-null size unknown) or OPEN-6.
