protocol_amendment:
  id: AMD-EXP-HQC-982268-v3
  amends: EXP-HQC-982268
  amends_version: 1
  proposes_version: 3
  supersedes_proposal: AMD-EXP-HQC-982268-v2
  status: PROPOSED
  status_note: >-
    THIS IS AN EXECUTOR'S PROPOSAL AND AMENDS NOTHING. experiments/EXP-HQC-982268/specification.yaml
    is UNTOUCHED by TASK-20260806-6086cb and remains the approved contract at version 1. Only a
    Coordinator ledger archive may amend an approved contract; until such an archive exists every
    rule below is inert and version 1's rules bind, including its unrepaired INV-NULL. The v2
    proposal (TASK-20260806-dbadc8) was NOT ADMITTED by DEC-20260806-980816 and is superseded, not
    overwritten: it remains immutable in its own task directory and every number in it that this
    record does not explicitly correct still stands.
  proposed_in_task: TASK-20260806-6086cb
  proposed_at: '2026-08-06'
  batch: BATCH-0a65c0
  goal: GOAL-HQC-001
  authorizing_decision: DEC-20260806-980816
  supersedes_because: >-
    DEC-20260806-980816 refused v2 on two blocking defects (VF-1, VF-3) and one wrong factual claim
    (CTRL-POSHOM's advertised detection list). This record repairs exactly those three and carries
    v2's other content forward with the reviewers' non-blocking corrections applied.
  inputs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/tasks/TASK-20260806-dbadc8/amendment_v2.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-301f68/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-c5703d/reviews/TASK-20260806-42c153/red_team_report.md
  - ledger/evidence/EV-HQC-7e4b28.yaml
  - ledger/decisions/DEC-20260806-980816.yaml
  artifacts:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-6086cb/recalibrate.py
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-6086cb/transcribed_size.json
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-6086cb/fix_report.md

  admission_and_ceiling: >-
    BINDING, INHERITED VERBATIM FROM VERSIONS 1 AND 2 AND NOT RELAXED. This amendment repairs an
    INSTRUMENT. It makes NO security claim about HQC in either direction, adjudicates nothing about
    assumption A17 or A5 or any decoding-failure rate, and touches no standardized HQC parameter
    set. CLAIM TIER IS CAPPED AT TOY. A repaired instrument is not a result, and a twice-repaired
    instrument is not a better result. No number in this file was produced by sampling an HQC
    object: every draw is from S ~ Binomial(n_e, q-hat) under an explicit null, or from an
    explicitly declared alternative family used only to measure size or power off the calibration
    point. TASK-20260806-6086cb constructed ZERO HQC objects, ran NO measurement arm, and computed
    NO log2_A_k or log2_A_m on any space-(T) arm. Its only (T) inputs are FIRST MOMENTS (q-hat and
    the per-set block-failure totals) already published as chartered Stage-A diagnostics in
    RUN-HQC-982268-STAGEA-a and republished in amendment_v2.yaml.

  # ======================================================================
  # What v3 changes, and what it does not
  # ======================================================================
  what_v3_changes_relative_to_v2:
  - id: VF-1
    was: >-
      The frozen critical values were transcribed into amendment_v2.yaml BY HAND at five decimal
      places. At k=2 the interval half-widths are 2.2e-5 to 5.5e-5 bits, so five decimals could move
      each bound by up to 23.1% of its own half-width (PS-R5 k=2, half-width 2.167e-5). The rule the
      artifact actually states realized 0.610 / 0.419 / 0.551 percent size at PS-R1 / PS-R3 / PS-R5
      k=2, against printed values of 0.274 / 0.262 / 0.283 and against the amendment's own binding
      [0.002, 0.004] gate. The calibration was right; only the encoding was wrong; and only the
      encoding runs.
    now: >-
      NO HUMAN TYPES A CONSTANT. recalibrate.py computes the constants, WRITES them into this file
      itself in shortest-round-trip decimal form, RE-READS this file with yaml.safe_load, asserts
      every value parsed back is a float bit-identical to the value generated, and then measures the
      realized size OF THE VALUES IT READ BACK OUT OF THIS FILE. See R1_INV_NULL_v3.
    outcome: >-
      87 cells measured out of sample on 1,000,000 independent validation draws each. Every cell
      lies in [0.002, 0.004]; the range over the 80 REPORTED cells is 0.2567% to 0.2808% against a
      0.26998% nominal. The three cells that failed in v2 now measure 0.2674% / 0.2681% / 0.2691%.
  - id: VF-3
    was: >-
      calibration.py's q_sensitivity() ran only at k = m; PS-A's m = 16 is not evaluable at Stage-B
      T, so PS-A's sensitivity block contained ZERO rows -- while PS-A's 3*SE(q-hat)/q-hat is 3.33%
      against 0.06%-0.12% at the other three sets. The amendment nonetheless concluded without
      qualification that "the plug-in is not a material source of error".
    now: >-
      q-sensitivity is measured at EVERY REPORTED k at EVERY set and allocation -- 80 cells, 15
      relative-shift points each, 400,000 validation draws per point -- and each cell additionally
      carries the BREAKDOWN SHIFT, the smallest relative q error at which its size leaves the band,
      next to its own 3 SE. See q_sensitivity and VF_3_resolution.
    outcome: >-
      PS-R1, PS-R3 (both allocations) and PS-R5 are robust at every reported k, with breakdown
      margins of 7.9x to 48.9x over their own 3 SE. PS-A IS NOT, and is DROPPED FROM SUCCESS
      CRITERION (iv). Its k=2 cell breaks at exactly 3 SE (margin 1.0x) and its k=3 cell breaks at
      2.2 SE (margin 0.7x). This independently reproduces the validator's VF-3 measurement.
  - id: CTRL-POSHOM detection list
    was: >-
      v2 listed off-by-one truncation, a wrap-around error, a dup-folding stride error and a
      position-dependent decoder bug as observations that "would break it".
    now: >-
      The list is replaced by what the red team MEASURED over 400,000 trials on the real instrument,
      with the blind class named as a STRUCTURALLY ACCEPTED BLIND SPOT and given a short proof of
      why no repair inside the same invariance can close it. A new control, CTRL-IDXMAP, is
      specified for that class, using a FUNCTIONAL rather than a distributional invariance.
      See R2_controls.

  what_v3_does_not_change:
  - The frozen preregistered prediction log2 A_k = 0 for all k. UNCHANGED.
  - The estimand mubar_k = E[C(S,k)]/C(n_e,k), the Jordan identity, the estimator, and the S
    histogram as the sufficient statistic. UNCHANGED.
  - The (T) sampler, the ring rule, the weight rule, the parameter sets, the decoder, the tie rule,
    the seed scheme, and the master seed 20260804. UNCHANGED.
  - ST-4, ST-6, ST-7 and the deliberate_exclusions list. UNCHANGED. In particular NO raising of p*
    to buy reachability, and NO reduction of m.
  - v2's R3 (D3 restated as a hard support invariant), R4 (allocation re-derivation at the measured
    q-hat) and R5 (CTRL-ORACLE v2 as a mandatory blocking estimator gate). All three were CONFIRMED
    by the validator; they are carried forward with the reviewers' corrections applied and are not
    re-litigated here. See carried_forward_from_v2.
  - The prohibition on presenting toy-scale evidence as crypto-scale, and the requirement that every
    conclusion cite its experiment/run/evidence IDs.
  no_completed_run_is_re_scored: >-
    RUN-HQC-982268-STAGEA-a computed no log2_A_k on any (T) arm and therefore produced no primary
    measurement to re-score. No archived number is altered by this record. EV-HQC-75c05b and
    EV-HQC-7e4b28 stand as written.

  # ======================================================================
  # R1  --  INV-NULL v3.  The transcription repair (VF-1).
  # ======================================================================
  R1_INV_NULL_v3:
    inherits: >-
      The DECISION RULE is v2's and is unchanged in substance: at a given (set, allocation, k),
      INV-NULL fires when log2 Ahat_k lies outside the frozen interval [c_lo, c_hi], the equal-tailed
      0.135% / 99.865% quantiles of the estimator's OWN sampling distribution under the arm's null
      law S ~ Binomial(n_e, q-hat), obtained by Monte Carlo. No jackknife. No Wald ratio. No division
      by a random quantity. The validator independently replicated that rule's calibration
      (TASK-20260806-301f68: 0.256%-0.282% over 35 cells with its own seeds, implementation and
      constants) and this record does not re-argue it.
    what_is_new_is_the_encoding: >-
      THE DEFECT VF-1 IDENTIFIED WAS NOT IN THE CALIBRATION. It was in the transcription of the
      calibration into the artifact that governs execution. That is a defect in the same class as
      the one the batch existed to remove -- a decision rule whose realized behaviour was never
      checked -- reappearing one level down, in the encoding rather than in the statistics.

    why_more_decimals_is_not_the_fix: >-
      The validator offered two routes: carry >= 7 decimals, or bind the generating procedure and
      seed and demote the table to a reference. This record takes a third that subsumes both, because
      each of the first two leaves the same hole open. "Carry more decimals" is a rule about human
      care and fails the next time care lapses; the required precision is also cell-dependent (>= 6
      decimals at PS-R1 k=2, >= 7 at PS-R5 k=2, and a bound that must be recomputed whenever an
      allocation changes), so it is a rule nobody can check by inspection. "Bind the procedure only"
      makes the artifact unauditable without executing it, and an independent reviewer asked to
      verify a rule should not have to trust the producer's program to learn what the rule IS.
      What is adopted instead: BOTH authorities are carried, they are generated by the same program
      in the same run, and their agreement is asserted mechanically rather than assumed.

    the_fix:
      principle: 'NO HUMAN TYPES A CONSTANT. The path from the calibration to the artifact contains
                  no manual step, so there is no manual step to get wrong.'
      steps:
      - 'recalibrate.py phase `calibrate` derives every constant from the frozen procedure below.'
      - 'The SAME PROGRAM writes them into the frozen_intervals block of THIS FILE, between explicit
         machine-generated markers, through a formatter (yf()) that emits the shortest decimal string
         which round-trips exactly AND is asserted to parse as a YAML float.'
      - 'It then RE-READS this file with yaml.safe_load and asserts, per constant, that the parsed
         value is of type float and is bit-identical to the generated value. Max absolute difference
         over the whole table: EXACTLY 0.0. Any failure aborts before anything is measured.'
      - 'recalibrate.py phase `measure` re-opens this file, loads the constants OUT OF IT, and
         measures their realized size on validation draws independent of the calibration draws.
         The number reported in transcribed_size.json is the size of the ENCODED rule, never of the
         values held in memory. This is the check VF-1 exists to force.'
      a_second_transcription_trap_found_and_guarded: >-
        WORTH RECORDING BECAUSE IT WOULD HAVE BEEN SILENT. PyYAML resolves the string `1e-05` as a
        STRING, not a float: its float regular expression requires a decimal point in the mantissa.
        Python's own repr(1e-05) is exactly `1e-05`. A constant of that magnitude -- and the k=2
        constants are of exactly that magnitude -- emitted by the obvious route would have been
        loaded as text, and any comparison against it would have raised or silently mis-typed. yf()
        forces a decimal point into the mantissa and asserts the parsed type; recalibrate.py's
        selftest asserts that PyYAML still exhibits the trap, so the guard cannot go stale
        unnoticed. This is an independent instance of VF-1's defect class, found by building the
        guard rather than by reasoning about it.

    binding_calibration_procedure:
      note: >-
        THIS PROCEDURE IS NORMATIVE. It, together with the seeds recorded per configuration in
        frozen_intervals, reproduces every constant in this record bit-for-bit. If the procedure and
        the transcribed table ever disagree, the run does not proceed (see authority_and_conflict).
      null_law: 'S ~ Binomial(n_e, q-hat), independently across the T trials.'
      why_that_null_is_exact: >-
        On the finite support {0..n_e} the factorial moments E[C(S,k)], k = 0..n_e, determine the pmf
        by a unit upper-triangular linear system, so "A_k = 1 for every k" pins every factorial
        moment to the binomial value and therefore pins the law of S itself. The validator verified
        this in EXACT RATIONAL ARITHMETIC (max |pmf reconstructed - Bin| EXACTLY 0), which is
        stronger than v2's numerical 7.5e-15. CAVEATS, BOTH BINDING AND BOTH NARROWER THAN v2 SAID:
        (1) the contract measures k <= k_max < n_e, so the rule tests a SUB-FAMILY of that family;
        (2) more seriously, and this is the red team's RT2-OBJ-3, A17 is a statement about the JOINT
        law of (F_1,...,F_{n_e}) and S is a symmetric functional of it, so even at k_max = n_e the
        rule would test only the SYMMETRISED content of A17. v2's sentence "A17's full content and
        the binomial null are the same object" IS FALSE AND IS STRUCK. The red team's exhaustive
        n_e = 3 counterexample (binomial S, equal marginals, unequal same-lag pair probabilities,
        joint law not the product law) is accepted.
      draw_construction: >-
        The histogram over n_e+1 bins of T i.i.d. Bin(n_e,q) trials is EXACTLY Multinomial(T, pmf),
        so one replicate at any T costs one multinomial draw. Exact in distribution and O(1) in T.
        pmf is built as C(n_e,i) q^i (1-q)^(n_e-i) in IEEE-754 double and normalised by its own sum.
      prng: 'numpy.random.Generator(numpy.random.PCG64(seed)), drawn in fixed chunks of 100000
             replicates in order; the chunk size is part of the procedure because it fixes the
             draw sequence.'
      seed_derivation: >-
        seed = first 8 bytes, big-endian, of SHA-256 of the ASCII string
        "EXP-HQC-982268/v3/INV-NULL|<set>|<allocation>|<T>|<purpose>|<n>", with purpose in
        {cal, val, sens} and n the replicate count. The realized integer is recorded per
        configuration as calibration_seed. Calibration and validation draws are therefore
        independent by construction, not by assertion.
      draws_are_shared_across_k_within_a_configuration: >-
        DISCLOSED, BECAUSE IT DIFFERS FROM v2. One histogram replicate at (n_e, q-hat, T) serves
        every k simultaneously, so one draw set is used for all cells of a configuration rather than
        one per cell. Each cell's interval remains a valid quantile of that cell's own null
        distribution -- sharing draws cannot bias a marginal quantile -- but the cells' Monte-Carlo
        errors are CORRELATED, so joint statements across k within a configuration (for example the
        multi-k battery rates in open_items RT2-OBJ-1) carry correlated MC error and are not
        independent replications of one another.
      estimator: >-
        log2 Ahat_k = log2( (sum_s C(s,k) H_s) / (T C(n_e,k)) ) - k log2( (sum_s s H_s) / (T n_e) ),
        written from the definition in the approved contract. Undefined (and counted as such) when
        the numerator is zero. Cross-checked against exact rational arithmetic on 131 comparisons
        spanning all five configurations: max |difference| 4.62e-14 bits, nine orders of magnitude
        below the narrowest interval half-width in this record (2.167e-5 bits, PS-R5 k=2).
      interval_definition: >-
        alpha = 0.0026997960632601866 = 2*Phi(-3), inherited from v2. With the R finite values of a
        calibration set sorted ascending as x_(0..R-1) and i = floor(alpha/2 * R):
        c_lo = x_(i) and c_hi = x_(R-1-i). The rule fires on log2 Ahat_k < c_lo or > c_hi, STRICTLY,
        so ties do not fire. Order statistics rather than an interpolated quantile, because they are
        exactly reproducible and because at cells where the null law is atomic the convention is
        then conservative by construction rather than by luck.
      n_calibration_replicates: 2000000
      n_validation_replicates: 1000000
      undefined_replicates: >-
        Counted and reported per cell. A cell with more than 10% undefined null replicates is
        declared NOT REACHED at that T -- a budget outcome under AGENTS.md rule 5, never a null
        result.
      achieved_T_deviation: >-
        UNCHANGED FROM v2. If achieved T differs from planned T (ST-1 truncation), the SAME frozen
        procedure and the SAME seed derivation are re-run at the achieved T and the re-derivation is
        recorded as a protocol deviation. The procedure is the invariant; the numbers are its value
        at a stated T.

    authority_and_conflict:
      primary: >-
        THE TRANSCRIBED TABLE IN frozen_intervals BINDS AT RUN TIME. It is what a reviewer can read,
        and it is what transcribed_size.json measured. A run uses these numbers.
      secondary: >-
        The procedure above is the table's provenance and its reproduction check.
      run_time_reproduction_check: >-
        MANDATORY AND BLOCKING. Before any (T) datum is scored, the run re-derives the frozen
        constants for the configuration it is about to use, from the recorded seed and the procedure
        above, and asserts BIT-IDENTITY with the table in this record. This is an equality test, not
        a tolerance test, because the seed, PRNG, chunking and quantile convention are all frozen. A
        mismatch is FAILED_IMPLEMENTATION and the run does not proceed. It is not a negative
        observation about A17.
      why_bit_identity_and_not_a_tolerance: >-
        Because a tolerance is a number somebody has to choose, and VF-1 is precisely what happens
        when a number nobody checked governs execution. Bit-identity needs no judgement and cannot
        drift. If a future environment cannot reproduce the draws bit-for-bit -- a different numpy
        multinomial implementation would do it -- that is a REAL change of the rule and must surface
        as a failure and be re-frozen under a new amendment version, not absorbed by a tolerance.

    scope_of_the_frozen_table:
      configurations_frozen: 5
      note: >-
        PS-R3 at T = 1e7 IS NEW IN v3 AND IS THE ALLOCATION THIS CAMPAIGN FUNDS. v2 froze PS-R3 only
        at T = 2e7 and gave T = 1e7 a single k=17 row inside a cost table, so a measurement at T=1e7
        had no frozen rule to run under at any other order. v3 freezes k = 2..k_max at every
        configuration rather than the sparse k list v2 carried, because criterion (iv) v3 requires
        every evaluable k to be reported, and because a rule that exists only at k = m cannot support
        the multi-k reporting the red team's RT2-OBJ-1 makes necessary.
      k_max_rule: >-
        The contract's own pre-registered rule, evaluated at the MEASURED q-hat:
        s_90 = min{s : sum_{s'<=s} P[S=s'] C(s',k) >= 0.90 E[C(S,k)]}, T_stab = 30 / P[S >= s_90],
        reachable iff T >= T_stab. Recomputed independently here and reproducing v2 and the
        validator exactly: k_max = 3 (PS-A, 1e8), 15 (PS-R1, 1e8), 20 (PS-R3, 2e7), 29 (PS-R5, 2e7),
        and 18 (PS-R3, 1e7, new). T_stab(17) at PS-R3 is 1.000e6, so k = m = 17 is reached at
        T = 1e7 with a 10x margin.
      cells_retained_from_v2_above_k_max: >-
        The k values v2 froze which lie above k_max (PS-A k=4,16; PS-R1 k=16,18; PS-R3 k=22,25;
        PS-R5 k=30,35) are retained with their constants and their measured size, marked NOT REACHED
        with the reason, so that every v2 row has a v3 counterpart and none is silently dropped.
        NOT REACHED is a budget outcome and is never a null result.

