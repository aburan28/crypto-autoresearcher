      the_structural_argument:
        claim: >-
          ACCEPTED BLIND SPOT, WITH A PROOF RATHER THAN AN APOLOGY. No control whose null value is
          forced by ring-shift invariance can detect a defect that preserves the G-orbit structure
          of the block index map. CTRL-POSHOM is such a control, so this class is invisible to it at
          every T, and no repair that keeps the same invariance will change that.
        argument: >-
          (1) Let G = <X> = Z_n act on coordinates by ring shift. CTRL-POSHOM's null is forced by
          exactly one fact: the law of e'' is G-invariant. Both clauses are functions of the sample
          that compare block j against block j', and both are unchanged when the family of block
          windows {B_j} is replaced by {g B_j} for any g in G.
          (2) Suppose a defect replaces the correct windows {B_j} by windows {B'_j} which are still a
          single G-orbit with the same shift increments, B'_j = s_j + B'_0 with the same {s_j}. Then
          by G-invariance every B'_j has the same marginal law, and the pair (B'_j, B'_{j+d}) is a
          G-translate of (B'_0, B'_d), so its joint law depends only on d. BOTH CLAUSES HOLD EXACTLY.
          The control's detection probability equals its size -- it is not weak on this class, it is
          blind to it.
          (3) V1 and V2 are exactly of this form. V1 takes B'_0 = B_0 + 1 with the same increments:
          the whole indicator matrix has the IDENTICAL joint law, so V1 is invisible to every
          statistical test of the (T) arm whatsoever, not only to this control -- it is harmless for
          the estimand and is a defect only against the specification. V2 takes
          B'_0 = {0, n_e, 2n_e, ...} with increments s_j = j: still one G-orbit, so both clauses hold
          exactly -- but a decimated window and a contiguous window do NOT have the same weight law,
          so V2 DOES change the estimand. That is the combination that makes V2 dangerous:
          consequential and exactly invisible. V3 is NOT of this form, because moving one window by
          -1 changes the gaps between that window and the others, so clause (b) is violated at the
          pairs involving the last block; it survived at T = 400,000 as a POWER failure at one pair
          class out of C(n_e,2), and its detectability at Stage-B T is unmeasured.
        status_of_that_argument: >-
          It is an argument, not a measurement, and it is offered as one. Clauses (1) and (2) are
          elementary given the G-invariance of the law of e'', which the validator verified
          independently. Clause (3) classifies the three measured variants against it and predicts
          exactly what the red team observed, including the one variant (V3) that is undetected for a
          DIFFERENT reason than the other two. That agreement is corroboration, not proof, and the
          argument was written after the measurements rather than before them.
        consequence_for_the_repair: >-
          A control for this class must not be a distributional test of the (T) sample. Two routes
          exist: compare the sample against a law known in advance (that is OPEN-6, and it is
          unbuilt), or compare the INSTRUMENT against the specification functionally. v3 takes the
          second, as CTRL-IDXMAP.
        this_is_the_second_instance_of_one_pattern: >-
          CTRL-BS was the first: its np.roll re-indexing preserves every per-block column sum
          exactly, so a wrong indicator matrix enters the control and the thing it controls
          identically and cancels, and it cannot fail for any defect upstream of F. CTRL-POSHOM is
          the second: the invariance strong enough to FORCE its null is also strong enough to protect
          every defect that respects the same invariance. The generalizable statement -- AN
          INVARIANCE THAT FORCES A CONTROL'S NULL VALUE ALSO BLINDS THAT CONTROL TO EVERY DEFECT
          RESPECTING IT, so the strength of a forced null and the breadth of its coverage are in
          direct tension -- is a candidate for KN-TECH promotion, and DEC-20260806-980816 already
          records it as such. It is NOT promoted by this record: two instances on one instrument is
          not a technique, and the Coordinator's stated bar (a second instrument) is the right one.
      what_CTRL_POSHOM_is_for_after_this_correction: >-
        Position-DEPENDENT defects in the decoder and in per-block processing, where it is measured
        to be genuinely sensitive (V6: one masked coordinate in one block, at a 0.19% q-hat shift).
        It is retained at that scope, which is real and is not covered by any other control in the
        contract, and it is no longer described as covering the upstream index path.
      clause_b_status_unchanged: >-
        UNEVALUATED, not passed. No committed run records pairwise-by-position counts.
        pair_counts_by_position.csv remains a required artifact. The red team wrote a
        distribution-free test for both clauses (their REF-3: Z_t = F_t - (S_t/n_e)1,
        X = T Zbar' Sigma-hat^+ Zbar ~ chi^2_{n_e-1}, no unknown constant and no assumed
        independence) which was correctly sized on the correct instrument and fired on V4/V5/V6.
        v3 ADOPTS REF-3 as the binding reference for both clauses, superseding v2's whole-trial
        bootstrap. THE HONEST CAVEAT THE RED TEAM ATTACHED IS ADOPTED WITH IT: Sigma-hat contains
        sum_t S_t^2, so any valid calibration of clause (a) forms a (T) second moment. Declining to
        form it does not avoid the OPEN-8 disclosure, it only leaves the control without a verdict.
      VF_6_correction_applied: >-
        v2's bullet "an off-by-one truncation window -> block 0 or block n_e-1 is special" is STRUCK,
        on both the validator's argument and the red team's measurement. The detectable class is
        stated positively instead: any defect that makes the block windows fail to be a G-orbit of
        congruent windows with the correct increments, or makes F_j a position-dependent function of
        its window. A pure translation of the whole window is excluded, and so is any re-partition
        that remains a single G-orbit.
      VF_7_correction_applied: >-
        The independent-blocks reference for Q_raw is CONSERVATIVE, not merely inexact:
        E[Q_raw] = (n_e-1)(1 - cbar/v), so under the positive block correlation this experiment
        exists to detect the correctly scaled statistic is LARGER, and comparing the unscaled Q_raw
        against an independent-blocks critical value can only FAIL to reject. v2's "none of the four
        exceeds the critical value" is an understatement of the evidence, not an overstatement, and
        the direction is now stated beside the "not a verdict" label.

    CTRL_IDXMAP:
      id: CTRL-IDXMAP
      status_in_v1_and_v2: DID NOT EXIST
      kind: >-
        INSTRUMENT CONTROL -- DETERMINISTIC. Blocking. Its invariance is FUNCTIONAL AGREEMENT WITH
        THE SPECIFICATION'S INDEX ARITHMETIC, deliberately NOT ring-shift invariance. That is the
        whole point: a control built on the same invariance as CTRL-POSHOM would inherit the same
        blind spot, and the argument above says so in general.
      what_it_covers: >-
        The shift-equivariant index class that CTRL-POSHOM is blind to: V1 (global truncation-window
        offset), V2 (re-partitioned blocks), V3 (single-block window offset), and any other defect
        that changes WHICH COORDINATES ARE READ.
      construction:
      - 'IMPLEMENTATION REQUIREMENT, BINDING, NOT MERELY A REPORTING ONE: the (T) sampler must
         express truncation and block extraction as explicit index arrays -- trunc_idx of length N
         into the coordinates of e-prime-prime, and block_idx of shape (n_e, L) into the coordinates
         of e-tilde -- and must GATHER through those arrays, so that the array which is emitted is
         the array which is actually read. An implementation that emits a correct map and reads by
         other means passes this control vacuously; the gather requirement is what forecloses that,
         and it is the control''s one real failure mode, stated here rather than discovered later.'
      - 'The run emits experiments/EXP-HQC-982268/runs/<RUN-ID>/index_map.json carrying trunc_idx and
         block_idx (or their SHA-256 plus first and last rows if size forbids), together with n, N,
         n_e, n_2, dup, L.'
      - 'The control recomputes both arrays from the frozen (n, N, n_e, n_2, dup) alone, by an
         expression written independently of the sampler -- trunc_idx[i] = i for i < N;
         block_idx[j] = [j*L, j*L+1, ..., j*L+L-1] with L = n_2*dup -- and requires ELEMENTWISE
         EQUALITY.'
      consequence_of_failure: >-
        Any mismatch is FAILED_IMPLEMENTATION before any measurement is scored. Never a negative
        observation about A17: the index map is fixed by the specification, so a disagreement is an
        instrument defect by construction.
      detection_probability: >-
        1, DETERMINISTICALLY, for any defect that changes the index map -- not a power statement, not
        a function of T, and not defeatable by shift-equivariance, because the control never looks at
        the distribution of the sample.
      what_it_CANNOT_detect_stated_plainly: >-
        Anything that leaves the index map correct. A wrong decoder, a wrong ring product, a wrong
        fixed-weight sampler and a wrong tie rule all pass CTRL-IDXMAP untouched; they remain with
        CTRL-DEC, CTRL-REPLAY, NULL-M, D1, D2 and D5. It is a narrow control, and its value is that
        its narrow class is exactly the class nothing else in the contract covers.
      relation_to_CTRL_REPLAY: >-
        CTRL-REPLAY (v1, unchanged) re-derives e-tilde from the recorded seed by an independent
        dense-GF(2) code path on 1e4 trials per set and requires bit-identity, which establishes the
        ring product and the truncation. It would catch V1. It does NOT cover the BLOCK PARTITION:
        the block index arithmetic is downstream of e-tilde and is not exercised by comparing
        e-tilde against e-tilde, so V2 and V3 pass CTRL-REPLAY as specified. CTRL-IDXMAP is the
        extension that closes that step, and the overlap on V1 is redundancy rather than duplication.
      demonstration_and_its_scope:
        what_was_run: >-
          A deterministic demonstration of the MECHANISM on a toy ring, in recalibrate.py phase
          `idxmap`: n = 71, N = 60, n_e = 6, L = 10, four index maps -- correct, plus analogues of
          V1, V2 and V3 -- compared against the reference map computed from the parameters alone.
        result:
        - {variant: correct, truncation_index_mismatches: 0, block_index_mismatches: 0, fires: false}
        - {variant: V1-truncation-offset, truncation_index_mismatches: 60,
           block_index_mismatches: 60, fires: true}
        - {variant: V2-interleaved-partition, truncation_index_mismatches: 0,
           block_index_mismatches: 58, fires: true}
        - {variant: V3-last-block-early, truncation_index_mismatches: 0,
           block_index_mismatches: 10, fires: true}
        scope_of_that_demonstration: >-
          STATED NARROWLY BECAUSE IT IS NARROW. It constructs no HQC object and no parameter-set
          instance. It demonstrates that the control's detection of an index-arithmetic defect is
          deterministic rather than statistical, which is the property the shift-equivariant class
          requires. IT DEMONSTRATES NOTHING ABOUT stage_a.py, which this task did not execute or
          instrument, and it is not evidence that the gather requirement above has been implemented.
          Until a run emits index_map.json, CTRL-IDXMAP is a specification, exactly as CTRL-ORACLE v2
          was a specification in v2 -- and the lesson of that episode (a blocking gate whose passage
          rests on a citation is a gate that has never been run in the configuration that binds)
          applies to this one and is recorded here against it, as OPEN-9.

    control_ranking_after_this_amendment:
      1: 'NULL-M      - PRIMARY null object. Exercises the decoder; A_k = 1 is a theorem on it.'
      2: 'CTRL-ORACLE - PRIMARY estimator gate, off the null, both signs. Mandatory and blocking.
                        VERIFIED: run against the real BATCH-003 oracle package by validator
                        TASK-20260806-301f68 (13 configurations, 40 cells, max difference 7.11e-15
                        bits against a 1e-12 tolerance, 12 cells above 1 bit, 18 negative). The
                        >= 40-cell coverage floor is met with ZERO SLACK, so any future reduction of
                        the oracle configuration set breaks the gate.'
      3: 'CTRL-IDXMAP - deterministic index-map control. SPECIFICATION ONLY until a run emits
                        index_map.json (OPEN-9); ranked here on the class it covers, with its
                        unverified status carried in the ranking rather than only in its own entry.'
      4: 'CTRL-POSHOM - instrument control for POSITION-DEPENDENT defects. DEMOTED from v2''s
                        "PRIMARY, only control sensitive upstream of the indicator matrix": it is
                        measured blind to two upstream index defects exactly and to a third as
                        tested. Clause (b) remains unevaluated.'
      5: 'NULL-P      - secondary. Unconditional estimator-arithmetic check.'
      6: 'CTRL-DEC, CTRL-REPLAY - instrument controls, unchanged.'
      7: 'CTRL-WBP    - mechanism discriminator, unchanged.'
      8: 'CTRL-BS     - tertiary re-indexing control. CANNOT FAIL upstream of the indicator matrix.'
      ranking_discipline_adopted: >-
        The red team objected that v2 promoted CTRL-ORACLE to PRIMARY in the same record that said it
        had not been verified. The objection is accepted as a general rule and applied: every entry
        above carries its verification status IN THE RANKING. CTRL-ORACLE is PRIMARY because it has
        now actually been run; CTRL-IDXMAP is ranked with "SPECIFICATION ONLY" attached to it.
    residual_gap_recorded_not_closed: >-
      UNCHANGED AND NOT CLOSED BY THIS RECORD. No arm tests the (T) JOINT law against an answer known
      in advance. CTRL-POSHOM clause (b) tests an exact symmetry of that law, which is strictly
      weaker; CTRL-ORACLE v2 tests estimator arithmetic on laws that never pass through the sampler
      or the decoder; CTRL-IDXMAP tests the index map and nothing distributional at all. That is
      OPEN-6 and it remains the single largest hole in the instrument.

