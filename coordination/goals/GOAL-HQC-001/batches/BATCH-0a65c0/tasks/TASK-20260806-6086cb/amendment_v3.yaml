  # ======================================================================
  # Open items
  # ======================================================================
  open_items:
  - id: RT2-OBJ-1
    status: OPEN -- NOT CLOSED BY THIS RECORD
    title: 'The rule is sized at the binomial POINT, and the null it will face is composite.'
    what_the_red_team_showed: >-
      At PS-R1, k = m = 16, T = 1e8 they constructed a law at total variation 8.902e-5 from the
      calibration binomial, matching E[S] to relative error 1.1e-16 and E[C(S,16)] to relative error
      exactly 0 -- so log2 A_16 = 0 EXACTLY -- on which the k=16 cell fires 91.41% of the time. The
      mechanism: E[C(S,k)] is constrained by the hypothesis and Var[C(S,k)] is not, and the
      estimator's null spread is dominated by a far upper tail no tested moment reaches. Their
      perturbation multiplies Var[C(S,16)] by 1,022 while leaving E[C(S,16)] bit-identical.
    independently_reproduced_here: >-
      YES, at their cell, from the constraints rather than from their code: TV 8.90e-5,
      |log2 A_16| = 8.8e-12 bits, measured size at k=16 alone 91.24% on 200,000 draws against their
      91.41%. RT2-OBJ-1 IS REAL AND IS NOT A CURIOSITY.
    what_this_record_measured_that_the_red_team_did_not:
    - 'AT THE CELL THE CAMPAIGN ACTUALLY FUNDS -- PS-R3, k = m = 17, T = 1e7 -- the same construction
       is far weaker. The analogous tail-directed law (mass added at s = 45, removed at
       s in {20,22,24}) reaches only TV = 0.0495 at the non-negativity bound, 556x further from the
       binomial than at PS-R1, and even there the k=17 cell fires only 14.30%. At TV = 5.05e-3 it
       fires 1.01%. A PLAUSIBLE STRUCTURAL READING, OFFERED AS A HYPOTHESIS AND NOT ESTABLISHED: the
       attack works by loading a tail that C(S,k) never reaches, and its leverage grows with how far
       k sits above E[S] -- k/E[S] = 1.76 at PS-R1 k=16 against 0.95 at PS-R3 k=17. ONE FAMILY, ONE
       SUPPORT CHOICE, NOT AN OPTIMUM: a better-chosen support may do better at PS-R3, and no search
       over supports was run.'
    - 'THE MULTI-k BATTERY MITIGATES IT AND THE MITIGATION IS NOT FREE. Against the PS-R1 law at
       TV = 8.9e-5, the reported battery (k = 2..15, "any cell outside its interval") rejects with
       probability 1.0000 where the k=16 cell alone gives 91.24%; at TV = 9.08e-6 it gives 10.51%
       against 1.03%. BUT ITS FAMILYWISE SIZE UNDER THE EXACT BINOMIAL NULL IS 1.09% AT PS-R1 AND
       1.03% AT PS-R3 -- roughly four times the 0.27% per-cell nominal, as 14 to 17 correlated cells
       should give. A battery reading is therefore NOT a 0.27% test and must never be reported as
       one. v3 requires every evaluable k to be reported (criterion (iv)) and requires the familywise
       flag rate to be stated whenever a battery reading is relied upon; it does NOT make the battery
       the falsification criterion, because that would need its own calibration.'
    what_remains_open: >-
      The size of INV-NULL under the COMPOSITE null -- every law with the tested moment and the
      observed q -- is unknown, and the run-time size guard is drawn from the same binomial law and
      cannot see this by construction (the red team's "the new run-time check is self-referential",
      which is correct). Sizing against the composite null is a genuine piece of work: the red team
      names it as a small linear program per cell, which is the right shape, and it was not attempted
      here.
    what_this_means_for_reading_a_firing: >-
      BINDING ON EVERY DOWNSTREAM RECORD. A firing at order k is scoped to the TESTED NULL BATTERY,
      not to order k as such. v2's outcome language ("SCOPED to that set and that order") is
      strengthened accordingly, and the caveat travels with the 0.26% size figure wherever that
      figure appears -- it is a SIZE caveat, not an alternative-power caveat, and v2 filed it under
      the wrong heading.
  - id: OPEN-6
    status: OPEN. THE LARGEST REMAINING HOLE, AND NOT NARROWED BY THIS RECORD.
    item: >-
      No arm tests the (T) JOINT law against an answer known in advance. CTRL-POSHOM clause (b)
      tests an exact symmetry of that law, which is strictly weaker; CTRL-ORACLE v2 tests estimator
      arithmetic on laws that never pass through the sampler or the decoder; CTRL-IDXMAP tests the
      index map and is not distributional at all.
    successor: >-
      An end-to-end CTRL-ORACLE running the WHOLE Stage-A pipeline on an exactly enumerable instance.
      Blocked today because stage_a.decode_blocks is hard-wired to a size-128 WHT while the oracle's
      toy block models are threshold(n2=4,t=1) and RM(1,2). The fix is a decoder interface
      parameterised by block model, plus an oracle configuration at RM(1,7) with a ring small enough
      to enumerate. NOT DESIGNED HERE AND NOT CLAIMED TO BE CHEAP.
  - id: OPEN-8
    status: OPEN -- A COORDINATOR RULING, NOT AN EXECUTOR'S EDIT.
    item: >-
      log2 A_2 is recoverable in two lines from the (T) S-histograms already archived as a chartered
      Stage-A diagnostic. The red team further showed that v2's own published
      Q/(n_e-1) = 1.2388 / 1.0418 / 0.8876 / 0.8907 is an invertible one-line moment estimator of
      A_2 at all four sets (A_2 = [1 - (1-q) Q/(n_e-1)]/q), with a standard error of roughly +-0.21
      bits at PS-R5 to +-1.5 at PS-R1, so "nothing was computed" is not quite accurate about the v2
      artifact as it stands -- though essentially no information is transferred at that precision.
      Neither reviewer performed the inversion, and NEITHER DID THIS TASK.
    what_v3_does_about_it: >-
      Only what an Executor may: criterion (iv) v3 authorizes k = 2 explicitly as a reported Stage-B
      cell at PS-R3 under the frozen interval, which is the substance of the validator's
      recommendation and removes the incentive to leave a derivable primary measurement unruled. The
      red team's broader proposal -- replace an authorization boundary drawn around a DERIVED
      STATISTIC, which is unenforceable when the sufficient statistic is a chartered diagnostic and
      the generator is committed, with one drawn around what may be REPORTED AND RELIED UPON -- is
      recorded for the Coordinator and is not adopted here.
  - id: OPEN-9
    status: OPEN. NEW IN v3.
    item: >-
      CTRL-IDXMAP is a SPECIFICATION. Its gather requirement is an implementation obligation on
      stage_a.py that no run has met, its required artifact index_map.json exists in no committed
      run, and the toy demonstration in recalibrate.py establishes the mechanism only. The v2 episode
      is the precedent and the warning: a blocking gate whose passage rests on a citation is a gate
      that has never been run in the configuration that binds.
    successor: >-
      One run emitting index_map.json, plus a single injection (any of V1/V2/V3) confirming the
      control fires on the real instrument. Cheap -- the control is a comparison of two integer
      arrays -- but it must actually be done before CTRL-IDXMAP may be cited as a passing gate.
  - id: OPEN-10
    status: OPEN. NEW IN v3.
    item: >-
      CTRL-POSHOM's detection power has been measured against ONE declared single-block bias family
      and against the six informative injected variants. The dup-folding stride error is UNTESTED at
      dup > 1 and its claimed mechanism has no derivation. V3 (single-block window offset) is
      undetected at T = 4e5 but is not structurally invisible, and its detectability at Stage-B T is
      unmeasured.
    successor: >-
      Run PS-A with the fold reshaped (n_e,128,dup) instead of (n_e,dup,128) and check Q/df, about 15
      core-minutes; and evaluate clause (b) against V3 at Stage-B T once pair_counts_by_position.csv
      exists.

