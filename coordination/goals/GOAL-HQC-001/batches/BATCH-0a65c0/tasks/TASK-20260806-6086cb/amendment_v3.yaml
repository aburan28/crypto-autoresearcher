    measured_size_of_the_transcribed_constants:
      what_was_measured: >-
        The constants were read back out of THIS FILE with yaml.safe_load, type-asserted to be
        floats, and scored on 1,000,000 validation draws per configuration, drawn under a seed
        independent of the calibration seed. Full per-cell table: transcribed_size.json.
      table_rows: 88
      cells_measured: 87
      one_row_has_no_constants: 'PS-A k=16: the estimator is undefined on every null replicate, so
                                 no interval exists to measure. It is carried as a NOT REACHED row.'
      cells_with_status_REPORTED: 80
      reported_cells_outside_the_acceptance_gate: 0
      size_range_over_reported_cells: [0.002567, 0.002808]
      nominal_size: 0.0026997960632601866
      acceptance_gate: [0.002, 0.004]
      the_three_cells_that_failed_in_v2:
      - {set: PS-R1, allocation: '1e8', k: 2, v2_transcribed_size: 0.0061,  v3_transcribed_size: 0.002674}
      - {set: PS-R3, allocation: '2e7', k: 2, v2_transcribed_size: 0.00419, v3_transcribed_size: 0.002681}
      - {set: PS-R5, allocation: '2e7', k: 2, v2_transcribed_size: 0.00551, v3_transcribed_size: 0.002691}
      v2_figures_are_the_validators: >-
        The v2 column is the validator's independent measurement (TASK-20260806-301f68,
        headline_C), not a self-report.
      what_this_number_is_worth: >-
        VF-2 APPLIES AND IS NOT EVADED. The validator showed that this style of measurement --
        calibrate on a law, validate on the same law -- returns 0.2476%-0.2894% for ANY continuous
        law, including a standard normal with no estimator and no instrument in sight, so a headline
        "measured size 0.26%" is close to a tautology about Monte-Carlo quantile error. THAT IS NOT
        WHAT THIS TABLE IS FOR. Its job here is narrower and it does that job: it is the differential
        check that the ENCODED constants realize the size of the constants they were meant to
        encode. Against a tautology it should have returned 0.26% for v2's table too, and it does
        not -- it returns 0.610%, 0.419% and 0.551%. A transcription defect is exactly the failure
        mode this measurement is not blind to, which is why VF-1 was catchable at all.
      what_actually_establishes_the_rule: >-
        Unchanged from the validator's finding, and stated here rather than in a footnote: the
        evidence that INV-NULL v3 is the right instrument is the CONTRAST against v1 (0.30%-23.55%
        at Stage A, 1.83% and 2.20% at k = m at Stage B, on the validator's own draws) together with
        the Wald-shape diagnosis (coupling to +0.61-+0.69, right-arm/left-arm asymmetry to 2.66).
        The out-of-sample size is a standing run-time GUARD, not the argument.

    VF_3_resolution:
      finding: >-
        Measured at every reported k at every configuration, 15 relative-shift points per cell,
        400,000 validation draws per point, using the constants as read back out of this file.
        PS-R1, PS-R3 at both allocations, and PS-R5 hold the [0.002,0.004] band across the whole
        +-3 SE range at EVERY reported k, with breakdown margins of 7.9x to 48.9x. PS-A DOES NOT.
      PS_A_numbers:
      - {k: 2, size_at_q_hat: 0.0026, size_at_minus_3SE: 0.00368, size_at_plus_3SE: 0.00191,
         breakdown_rel_shift: 0.033283, three_SE_rel: 0.033283, margin_over_3SE: 1.0,
         verdict: 'leaves the band at exactly 3 SE, on the conservative side'}
      - {k: 3, size_at_q_hat: 0.00277, size_at_minus_3SE: 0.00409, size_at_plus_3SE: 0.00153,
         breakdown_rel_shift: 0.022188, three_SE_rel: 0.033283, margin_over_3SE: 0.67,
         size_at_plus_2SE: 0.00194,
         verdict: 'leaves the band on BOTH sides -- anti-conservative at -3 SE (0.00409 > 0.004)
                   and conservative at +2 SE (0.00194 < 0.002), so the breakdown is at 2.0 SE'}
      independent_reproduction: >-
        The validator measured PS-A k=3 at -3 SE as 0.00404 on 400,000 draws with the producer's
        unrounded constants; this record measures 0.00409 on its own constants, its own seeds and
        its own draws. VF-3 reproduces.
      why_PS_A_is_the_outlier: >-
        Not because of anything about the rule. PS-A's (T) arm recorded 8,122 block failures in
        total at Stage A against 5.2e6 / 9.2e6 / 1.3e7 at the reduced sets, so
        SE(q-hat)/q-hat = 1.11% and 3 SE = 3.33%, 28x to 53x the relative uncertainty elsewhere.
        The size of a quantile rule is steeply sensitive to the dispersion parameter of its
        calibration null, and PS-A is the one set where the plug-in is not effectively exact.
      DECISION: >-
        PS-A IS DROPPED FROM SUCCESS CRITERION (iv). It is not made robust, because every route to
        making it robust changes the rule in a way no reviewer has seen (see the successor below),
        and this campaign is at its declared batch cap. Dropping it is the honest option and it is
        taken plainly rather than by widening a band until the cell fits inside it.
      what_dropping_PS_A_costs_and_it_is_not_hidden: >-
        PS-A IS THE ANCHOR SET -- true HQC-1 parameters, verbatim, the only configuration in the
        contract that is not a reduced surrogate. After this change NO cell at true HQC parameters
        is certified under criterion (iv), and criterion (iv) rests entirely on order-matched
        reduced sets. That is a real narrowing on top of v2's already-recorded narrowing (anchoring
        (iv) on PS-R3 anchors it on HQC-3's shape rather than HQC-1's), and BOTH must appear in
        every downstream record, not only here. What is NOT lost: PS-A's k = m = 16 cell was already
        infeasible by 37 orders of magnitude (T_stab 1.246e45) in v1 and v2 alike, so PS-A was never
        going to deliver an order-matched cell; what is being dropped is two low-order cells, k=2 and
        k=3, at the anchor.
      PS_A_is_still_run_and_still_reported: >-
        Dropping PS-A from (iv) does not delete it. If PS-A is funded, its k=2 and k=3 values are
        reported with their frozen intervals, their null means and their measured sizes, MARKED
        `NOT CERTIFIED UNDER (iv)` and carrying the q-sensitivity rows above. A number that cannot
        be certified is reported as uncertified, not suppressed.
      concrete_successor_with_its_own_risk_named: >-
        The route that would make PS-A usable, costed rather than gestured at: derive PS-A's
        interval at the STAGE-B realized q-hat rather than the Stage-A one. At T = 1e8 the PS-A (T)
        arm accumulates about 1.538e6 block failures against Stage A's 8,122, so 3 SE falls from
        3.33% to 0.242% -- a factor 13.8 -- and against the breakdown shifts measured above (3.33%
        at k=2, 2.22% at k=3) that is a margin of 13.8x and 9.2x, comparable to the reduced sets.
        THE RISK THAT BUYS, STATED: the interval then becomes a function of the data it scores. The
        statistic self-normalises by q-hat from the same histogram, so this is a parametric bootstrap
        with a nuisance parameter rather than a look at the outcome -- but it introduces exactly the
        numerator/denominator coupling that R1 removed from the Wald rule, and its realized size
        would have to be measured for the WHOLE plug-in procedure, not at a fixed q. That
        measurement was not made here and this record does not adopt the route. It is named as the
        successor and it is a bounded piece of work: the size measurement is one pass over a grid of
        q with the critical values interpolated per replicate.
      the_SE_reference_is_a_LOWER_bound_and_v2_called_it_a_bound: >-
        VF-3's neighbour, corrected. SE(q-hat)/q-hat = sqrt((1-q)/block_failures) is the rho = 0
        (independent-blocks) VALUE. Var(q-hat) = q(1-q)(1 + (n_e-1) rho)/(n_e T), and rho > 0 is the
        alternative this experiment exists to detect, so it is a LOWER bound, not an upper one. The
        validator measured the inflation factor at log2 A_2 = 0.1 bits as 1.00 / 1.34 / 1.69 / 2.35
        at PS-A / PS-R1 / PS-R3 / PS-R5. Even inflated, 3 SE stays under 0.16% at PS-R1/R3/R5,
        against breakdown shifts of 1%-4%, so the margins above survive with a factor of at least 6
        to spare. At PS-A the inflation factor is 1.00 and changes nothing: PS-A fails on its raw
        counting error, not on block correlation.

