        this row. Any downstream use should quote the scale-invariant figure of merit
        (core-seconds x MDE80^2), which is stable, rather than the MDE.
    R5_oracle_gate:
      status: 'SPECIFICATION SOUND (validator) AND NOW ACTUALLY VERIFIED (validator).'
      attribution_correction_applied: >-
        v2's evidence_that_this_gate_passes cited the red team of an earlier batch and stated plainly
