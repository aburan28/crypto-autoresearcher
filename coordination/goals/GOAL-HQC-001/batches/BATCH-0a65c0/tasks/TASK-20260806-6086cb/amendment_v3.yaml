        drift detector. The cap sits 39.06-69.99 (M)-sigma above the (M) mean while the (T) maximum
        is only 4.00-4.20 (M)-sigma above it, so it cannot fire on (M) at any reachable T. v1's
        parenthetical "violated with probability ~1 on (M)" is struck. D1 is the real discriminator
        (gamma = 1 exactly on (M); (T) sits 78.77-135.42 SE away, with a working positive control).
      scope_narrowing_applied: >-
        Red team section 7 item 4. The sentence "the two laws differ in dispersion, not in location"
        is a MEASURED statement about the (T) object AT THESE FOUR TOY PARAMETER SETS and is written
        with that scope wherever it appears. It is not a general claim about (T) and (M).
    R4_allocation_re_derivation:
      status: 'ARITHMETIC CONFIRMED EXACTLY by the validator and reproduced again here.'
      substance: >-
        At the measured q-hat, T_stab(m) = 1.452e8 (PS-R1), 1.000e6 (PS-R3), 2.554e7 (PS-R5) and
        1.246e45 (PS-A). k = m is out of reach at PS-R1 and PS-R5 at the funded allocations; ST-4 is
        triggered there. The contract as written costs 2.30x its modelled core-seconds at the
        measured throughput.
      VF_5_correction_applied: >-
        THE OBJ-3 DISPUTE IS AGREEMENT, NOT CORRECTION, AND v2's HEADLINE COMPARED AN SD RATIO TO A
        VARIANCE RATIO. The earlier red team's 5.4x is a VARIANCE ratio; v2's 1.78x-2.33x are
        STANDARD-DEVIATION ratios, which square to 3.18x-5.43x. The correct statement: OBJ-3's
        MAGNITUDE is confirmed; its DIAGNOSIS is refined -- the defect is the q at which the variance
        formula was instantiated, not the formula, whose functional form reproduces the tabulated SEs
        to 0.3%. v2 presented a refinement as a correction and this record withdraws that framing.
      scope_narrowing_applied: >-
        Red team section 7 item 3. "PS-R3 at k = m dominates every other arm on both axes at once"
        is conditional on ONE declared alternative family and is restated as: dominates on
        core-seconds and MDE80 AGAINST THE DECLARED TWO-POINT COMMON-MODE FAMILY AT eps = 0.05. The
        validator adds that MDE80 is compared across sets at DIFFERENT ORDERS (k=17 at n_e=56 versus
        k=16 at n_e=46), so the estimands differ and dominance on those two axes does not by itself
        establish that PS-R3 is the better test of A17. Both riders travel with the claim.
      one_row_not_reproduced: >-
        PS-R5 k=30 at T=2e7: v2 reported MDE80 0.557 and the validator measured 0.383, and the power
