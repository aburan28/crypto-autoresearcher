  # ======================================================================
  # R2  --  controls.  CTRL-POSHOM's detection list, and CTRL-IDXMAP.
  # ======================================================================
  R2_controls:
    CTRL_POSHOM_v3:
      kind: 'INSTRUMENT CONTROL. Positional homogeneity under ring-shift invariance.'
      forced_value_unchanged_and_still_a_theorem: >-
        e'' = x*r_2 + r_1*y + e in R = F_2[X]/(X^n - 1). For every s in Z_n the map v -> X^s v is a
        bijection of each fixed-weight set, so (X^s x, X^s y, X^s e, r_1, r_2) has the same joint law
        as (x, y, e, r_1, r_2) and hence X^s e'' has the same law as e'', EXACTLY. With n_e*L = N < n
        the block-j window is the block-0 window shifted by the legal ring shift s = jL, giving
        CLAUSE (a) E[F_j] = q for every j, and CLAUSE (b) P[F_j = F_{j+d} = 1] depends only on d.
        Both are theorems about the (T) object, verified independently by the validator. NOTHING
        BELOW WEAKENS THE FORCED VALUE; what is corrected is the claim about what violates it.
      status_change: >-
        v2 ranked CTRL-POSHOM as PRIMARY instrument control and described it as the only control
        sensitive upstream of the indicator matrix. v3 KEEPS IT AND KEEPS IT USEFUL, but it is no
        longer described as covering the upstream path, because three of the four upstream defects
        it was advertised as covering do not violate its forced value at all.

      detection_list_as_MEASURED:
        source: >-
          Red team TASK-20260806-42c153 section 3. PS-R1, 400,000 trials, eight code variants
          SHARING THE SAME (x,y,r1,r2,e) draws, so a difference between variants is the injected
          defect and not the sample. Their re-implementation of decode_blocks agreed with
          stage_a.decode_blocks on all 400,000 x 46 block decodes, max absolute difference 0. THIS
          TASK DID NOT RE-RUN THAT INJECTION -- it has no measurement authorization and did not
          execute stage_a.py -- so every row below is CITED, not reproduced here.
        fires:
        - {variant: V5, defect: 'block 0 breaks WHT argmax ties high', q_hat_shift: '+1.12%',
           Q_over_df: 571.5, clause_b: FIRE,
           why_it_matters: 'a position-DEPENDENT decoder defect; no first-moment check in the
                            contract (BASE-TABLE10, INV-Q, D1) would flag a 1.12% shift'}
        - {variant: V6, defect: 'block n_e-1, coordinate 0 forced to 0', q_hat_shift: '-0.19%',
           Q_over_df: 17.311, clause_b: 'FIRE (X/df 1.95-2.74)',
           why_it_matters: 'THE STRONGEST RESULT FOR THIS CONTROL: a single masked coordinate in one
                            block, at a q-hat shift of 0.19%, detected. This is the case for keeping
                            CTRL-POSHOM.'}
        fires_but_with_no_marginal_value:
        - {variant: V4, defect: 'wrap error: ring_mul_sparse loses ^ (acc >> n)',
           q_hat_shift: '-87.53%', Q_over_df: 35141.7,
           assessment: 'fires enormously, but collapses q-hat from 0.1974 to 0.0246, so INV-Q,
                        BASE-TABLE10, D1 or a glance at the run summary catch it first. v2 listed
                        this as a detection; its MARGINAL contribution is zero and it is recorded
                        here as such rather than counted as a win.'}
        blind:
        - {variant: V1, defect: 'off-by-one truncation window, et = (e_pp >> 1) & mask_N',
           q_hat_shift: '-0.01%', Q_over_df: 0.933, clause_b: pass,
           v2_claimed: 'listed on the CATCH side ("makes block 0 or block n_e-1 special")',
           truth: 'BLIND, AND STRUCTURALLY SO'}
        - {variant: V2, defect: 'wrong block partition -- blocks interleaved, j, j+n_e, j+2n_e, ...',
           q_hat_shift: '+0.03%', Q_over_df: 1.262, clause_b: pass,
           v2_claimed: 'not listed either way; covered only by the generic "position-equivariant"
                        residual, which reads as being about decoder bugs',
           truth: 'BLIND, AND STRUCTURALLY SO. THIS IS THE SERIOUS ONE: a wholesale misreading of the
                   block layout, which is the single structural assumption the (T) arm rests on.'}
        - {variant: V3, defect: 'last block window read one coordinate early',
           q_hat_shift: '+0.00%', Q_over_df: 1.046, clause_b: pass,
           truth: 'BLIND AS MEASURED at T = 400,000. NOT structurally invisible -- see
                   the_structural_argument clause 3 -- but its detectability at Stage-B T is
