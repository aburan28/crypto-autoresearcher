validation_report:
  id: TASK-20260806-f53255
  role: validator
  goal: GOAL-HQC-001
  batch: BATCH-0a65c0
  reviews_task: TASK-20260806-6086cb
  reviews_artifact: AMD-EXP-HQC-982268-v3 (proposed)
  experiment: EXP-HQC-982268
  produced_at: '2026-08-06'
  claim_tier: toy
  independent_session: true
  authority: >-
    I verify. I change no status. Nothing in this report is a statement about HQC,
    assumption A17 or A5, any decoding-failure rate, or any standardized HQC parameter
    set. Every number below is about an INSTRUMENT and its decision rule, measured on
    draws from a declared Binomial null. An admitted instrument is not a result.

  OVERALL_VERDICT: ADMIT

  verdict_summary: >-
    VF-1 and VF-3 are both genuinely closed. I loaded the constants out of
    amendment_v3.yaml with a plain yaml.safe_load, confirmed all 174 of them parse as
    float and none as string, and measured the realized size of THAT rule with my own
    implementation and my own seed namespace on 2,000,000 validation replicates per
    configuration: all 87 cells carrying constants fall inside [0.002, 0.004]. The
    measurement is discriminating rather than tautological -- the same pipeline returns
    0.6192% / 0.4176% / 0.5590% on v2's actual transcribed constants, and re-breaks v3's
    own constants when they are rounded back to five decimals. Beyond what was asked, all
    87 cells reproduce BIT-FOR-BIT from the amendment's normative procedure re-implemented
    from its prose alone, so the mandatory blocking run-time reproduction check is
    satisfiable by an independent implementation -- which is the deeper form of the
    property VF-1 was about. I admit with two findings the Coordinator must rule on before
    TASK-20260806-cde749 runs (F-1, CTRL-IDXMAP's blocking status; F-2, the reproduction
    command mutates a frozen artifact) and one reading constraint that must travel into
    every downstream record (the ~1.0% familywise size).

  what_I_did_not_do:
    - I did not re-derive the constants from recalibrate.py's procedure in order to measure
      size. Size was measured on the values parsed out of the amendment file, as instructed.
    - I did not execute recalibrate.py at all. Its inject() opens amendment_v3.yaml in write
      mode, so running it would have mutated a snapshot-committed frozen artifact (see F-2).
    - I ran no measurement arm, constructed no HQC object, and computed no log2_A_k on any
      space-(T) arm. Every draw is from S ~ Binomial(n_e, q_hat) or an explicitly shifted q.

  artifact_integrity:
    snapshot_receipt: coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/archives/TASK-20260806-ae094e/snapshot-receipt.json
    all_four_declared_path_sha256_match: true
    amendment_v3_yaml: 16e8b73a7790e271020e5cd7065753792f8cff549104705e35500d671266f2ae
    recalibrate_py: 8a411b4acbfd441cbd8ba485da1e9f3d0fe8a225a738a51b5ce1b2cebb94f86c
    transcribed_size_json: 379cd28aeec1f9672026f4fd45795a2cb57077f93ce3d0e348a802c8f03eb4aa
    fix_report_md: f53777130bbd2a9dff5a0514e985e873f355ee5ee1f087a17cead81f47957141
    snapshot_commit: 7a862cf9
    snapshot_parent: 9d5de4a0bd9f4c95f42f206bd788ab4a50aa637a
    parent_matches_receipt: true
    commit_touched_exactly: 5 files -- the four task artifacts and the receipt. No other path.

  my_method:
    implementation: >-
      Written from the estimator definition in the amendment and in the approved contract
      (metrics.log2_A_k, specification.yaml line 284). recalibrate.py was neither imported,
      executed, nor copied. Estimator:
      log2 Ahat_k = log2( (sum_s C(s,k) H_s) / (T C(n_e,k)) ) - k log2( (sum_s s H_s) / (T n_e) ).
      Firing is STRICT: l2 < c_lo or l2 > c_hi.
    seed_namespace: >-
      'VALIDATOR-TASK-20260806-f53255/independent-size-check' (and '/qsens', '/fwer'),
      SHA-256 -> first 8 bytes big-endian -> PCG64. Disjoint from the producer's
      'EXP-HQC-982268/v3/INV-NULL' namespace by construction, so my draws are independent
      of both their calibration and their validation draws.
    n_validation_replicates_per_configuration: 2000000
    note_on_correlation: >-
      Like the producer, I share one histogram replicate across every k within a
      configuration. Sharing cannot bias a marginal quantile, but it does correlate the
      per-cell Monte-Carlo errors, so the 87 cells are NOT 87 independent checks.
    environment: python3.11, numpy 2.4.6, PyYAML 6.0.1
    compute_used_wall_seconds_approx: 420
    budget_wall_clock_seconds: 1800

  item_1_VF1_transcribed_constant_size:
    verdict: PASS -- VF-1 IS CLOSED
    constants_loaded_from: coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-6086cb/amendment_v3.yaml
    loader: yaml.safe_load, PyYAML 6.0.1, no custom resolver
    type_check:
      interval_constants_parsed: 174
      cells_carrying_constants: 87
      parsed_as_float: 174
      parsed_as_str: 0
      q_hat_values_parsed_as_float: 5
      dotless_exponent_scalars_anywhere_in_file: 0
    pyyaml_trap_independently_confirmed_real:
      claim: PyYAML resolves a dotless-mantissa exponent as a STRING, not a float.
      my_test: "yaml.safe_load('x: 1e-05')['x'] -> str; '5e-05' -> str; '-5e-05' -> str; '1E-05' -> str; '1e-5' -> str; '1e+05' -> str"
      contrast: "'1.0e-05' -> float; '5.0e-05' -> float; '0.00005' -> float"
      verdict: >-
        The trap is REAL and is exactly as described. v3 avoids it: every constant is
        emitted with a decimal point in the mantissa and I found no dotless-exponent
        scalar anywhere in the file. This was a genuine defect caught by the guard, not
        a decorative claim. The producer's second reported catch (a YAML indentation
        error reparenting the constants) I cannot verify independently -- it is an
        event in their run log, not a property of the artifact -- but the artifact's
        current parent structure is correct, which is the checkable part.
    my_measured_sizes:
      acceptance_gate: [0.002, 0.004]
      nominal_size: 0.0026997960632601866
      cells_measured: 87
      cells_outside_gate: 0
      range_over_80_REPORTED_cells: [0.002531, 0.002803]
      range_over_all_87_measured_cells: [0.002531, 0.002803]
      producer_range_over_REPORTED: [0.002567, 0.002808]
    agreement_with_producer:
      test: two-sample binomial z on each cell, my 2e6 draws against their 1e6 draws
      cells_with_abs_z_gt_3: 0
      cells_with_abs_z_gt_2: 2
      of_cells: 87
      largest_disagreements:
        - {cell: PS-A@1e8 k=4, mine: 0.002532, theirs: 0.002751, z: 2.04, note: 'NOT REACHED cell, only ~366k finite replicates'}
        - {cell: PS-R5@2e7 k=16, mine: 0.002678, theirs: 0.002808, z: 2.04}
        - {cell: PS-R3@1e7 k=14, mine: 0.002693, theirs: 0.002567, z: 2.00}
      verdict: Fully consistent. No cell disagrees beyond Monte-Carlo error.
    the_three_v2_failure_cells:
