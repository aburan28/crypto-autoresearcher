      - {cell: PS-R5@2e7 k=2, v2_size_validator: 0.00551, v3_size_producer: 0.002691, v3_size_MINE: 0.002693}
    POSITIVE_CONTROL_the_measurement_is_not_a_tautology:
      why_this_matters: >-
        VF-2 established that calibrate-on-a-law / validate-on-the-same-law returns
        ~0.25-0.29% for almost any continuous law, so "all 87 cells read 0.27%" is worth
        nothing unless the same pipeline can be shown to FAIL on a known-bad encoding. I
        ran that control two ways and my pipeline fails both, so the pass is informative.
      a_v2s_actual_transcribed_constants_through_MY_pipeline:
        - {cell: PS-R1@1e8 k=2, constants: [-0.00005, 0.00005], my_size: 0.006192, v2_validator_size: 0.0061, in_gate: false}
        - {cell: PS-R3@2e7 k=2, constants: [-0.00005, 0.00005], my_size: 0.004176, v2_validator_size: 0.00419, in_gate: false}
        - {cell: PS-R5@2e7 k=2, constants: [-0.00002, 0.00002], my_size: 0.005590, v2_validator_size: 0.00551, in_gate: false}
        - {cell: PS-A@1e8 k=2, constants: [-0.04079, 0.03979], my_size: 0.002629, in_gate: true, note: 'v2 passed here too; the defect was magnitude-dependent, as diagnosed'}
