  findings_requiring_a_Coordinator_ruling:
    - id: F-1
      severity: BLOCKING FOR TASK-20260806-cde749, NOT for admitting the amendment
      title: CTRL-IDXMAP is declared blocking, and requires an artifact the measurement task cannot produce.
      detail: >-
        The amendment declares CTRL-IDXMAP "Blocking", says "any mismatch is
        FAILED_IMPLEMENTATION before any measurement is scored", and lists
        experiments/EXP-HQC-982268/runs/<RUN-ID>/index_map.json under
        amended_required_artifacts.added_per_run, with the elementwise comparison required
        in the manifest. But satisfying it needs the (T) sampler in stage_a.py to express
        truncation and block extraction as explicit index arrays and gather through them.
        TASK-20260806-cde749's write_scope is its own task directory alone, and its
        read_scope does not include stage_a.py at all. That task therefore CANNOT implement
        the gather requirement, CANNOT emit index_map.json, and under a strict reading of
        "blocking" must abort -- on the final batch under the cap.
      same_applies_to: >-
        pair_counts_by_position.csv, also newly required per run, for CTRL-POSHOM clause
        (b), which the amendment itself records as unevaluated.
      what_I_recommend: >-
        Rule explicitly, in the dispatch or in DEC-20260806-2947ba, that CTRL-IDXMAP and
        CTRL-POSHOM clause (b) are FORWARD obligations on a future instrumented run and are
        NOT gates on TASK-20260806-cde749; that the measurement reports both as NOT RUN with
        the reason; and that no evidence record cites either as a passing control. That
        preserves OPEN-9's warning exactly while letting the funded measurement proceed. A
        one-line ruling; without it the run is ambiguous at best and aborts at worst.
    - id: F-2
      severity: OPERATIONAL HAZARD
      title: The documented reproduction command rewrites a snapshot-committed frozen artifact in place.
      detail: >-
        recalibrate.py's inject() does open(AMENDMENT, "w") unconditionally, and
        fix_report section 6 documents "python3 recalibrate.py all" as the reproduction
        route, noting it "regenerates the two machine-generated blocks of
        amendment_v3.yaml". Anyone following those instructions -- the red team this batch,
        or any later reviewer -- mutates an artifact that is frozen by
        snapshot-receipt.json and committed at 7a862cf9. The content hash would then no
        longer match the receipt.
      note: >-
        This is a hazard, not a defect in the rule, and it is why I did not execute
        recalibrate.py at any point. The round-trip design that closed VF-1 is exactly what
        creates it: the program must write the file to verify it.
      what_I_recommend: >-
        Reproduce only against a COPY of the task directory, and state that in the ledger
        record. If v3 is ever superseded, the writer should refuse to run unless the target
        file is outside a committed path or an explicit --force flag is given.
    - id: F-3
      severity: REPORTING PRECISION
      title: Breakdown margins are grid-resolution figures and should be stated as lower bounds.
      detail: >-
        See item_2.breakdown_margins_ONE_CAVEAT. "12.2x - 48.9x" should read "at least
        ~6.1x, measured on a +/-0.25/0.5/1/2/4% probe grid". The conclusion is unaffected.

  what_this_admission_does_and_does_not_authorize:
    does: >-
      It authorizes TASK-20260806-cde749 to run the PS-R3 joint-moment measurement at
      T = 1e7 under the v3 frozen table, using the constants byte-identical to those in
      amendment_v3.yaml, without re-tuning them.
    does_not:
      - It says nothing about HQC, A17, A5, any DFR, or any standardized parameter set. Toy tier, hard ceiling.
      - It does not certify any cell at true HQC parameters. PS-A is out of criterion (iv) and nothing replaced it.
      - It does not close RT2-OBJ-1. The size of INV-NULL under the COMPOSITE null is unknown,
        and the run-time size guard is drawn from the same binomial law and cannot see this by
        construction. A firing at order k is scoped to the TESTED NULL BATTERY, not to order k as such.
      - It does not close OPEN-6, which remains the largest hole in the instrument -- no arm tests
        the (T) joint law against an answer known in advance.
      - It does not certify CTRL-IDXMAP or CTRL-POSHOM clause (b) as passing gates.
      - An admitted instrument is not a result. If the measurement runs, what it produces is one
        reduced-parameter curve with a stated discrepancy against the model, and nothing more.

