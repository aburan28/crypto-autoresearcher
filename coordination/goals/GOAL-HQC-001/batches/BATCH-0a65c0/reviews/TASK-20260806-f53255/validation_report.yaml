    on_the_structural_blindness_argument:
      my_position: >-
        The G-invariance argument in fix_report section 4.2 is sound as far as it goes: if
        the law of e'' is invariant under the ring shift and a defect replaces the windows
        by a single G-orbit with the same increments, both CTRL-POSHOM clauses hold exactly
