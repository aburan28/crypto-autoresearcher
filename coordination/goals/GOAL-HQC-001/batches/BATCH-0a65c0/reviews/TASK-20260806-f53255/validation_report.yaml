  item_4_familywise_size_of_the_multi_k_battery:
    verdict: CONFIRMED, MATERIAL, AND THE AMENDMENT DOES STATE IT
    what_I_measured:
      definition: "P(at least one REPORTED cell fires) under the EXACT binomial null used to calibrate, my own seeds, 2,000,000 replicates per configuration"
      per_cell_nominal: 0.0026997960632601866
      results:
        - {configuration: PS-A@1e8, cells: 2, k_range: 2..3, familywise_size: 0.00537, ci95_halfwidth: 0.00010, multiple_of_nominal: 1.99}
        - {configuration: PS-R1@1e8, cells: 14, k_range: 2..15, familywise_size: 0.01127, ci95_halfwidth: 0.00015, multiple_of_nominal: 4.17}
        - {configuration: PS-R3@1e7, cells: 17, k_range: 2..18, familywise_size: 0.01017, ci95_halfwidth: 0.00014, multiple_of_nominal: 3.77}
        - {configuration: PS-R3@2e7, cells: 19, k_range: 2..20, familywise_size: 0.01099, ci95_halfwidth: 0.00014, multiple_of_nominal: 4.07}
        - {configuration: PS-R5@2e7, cells: 28, k_range: 2..29, familywise_size: 0.01084, ci95_halfwidth: 0.00014, multiple_of_nominal: 4.02}
      producer_reported: {PS-R1: 0.0109, PS-R3: 0.0103}
      agreement: >-
        Consistent. My PS-R1 1.127% against their 1.09%; my PS-R3@1e7 1.017% against their
        1.03%. The finding is real and is not understated by the producer.
    does_the_amendment_state_it:
      answer: YES, in two binding places, and it draws the right conclusion from it.
      where:
        - "open_items RT2-OBJ-1: 'A battery reading is therefore NOT a 0.27% test and must never be reported as one.'"
        - "amended_required_artifacts.amended_manifest_requirements: 'the familywise flag rate of the multi-k battery, whenever a battery reading is relied upon'."
      and_critically: >-
        The amendment does NOT make the battery the falsification criterion, on the stated
        ground that doing so would need its own calibration. That restraint is correct and
        is the single most important thing v3 got right about RT2-OBJ-1.
    WHAT_THIS_MEANS_FOR_READING_THE_FORTHCOMING_MEASUREMENT:
      binding_on_TASK_20260806_cde749_and_on_EV_HQC_b71230: >-
        Criterion (iv) v3 requires all 17 PS-R3@1e7 cells to be reported. The moment
        anyone reads those 17 cells as a set and treats "some cell fired" as evidence
        against log2 A_k = 0, the operative false-positive rate is about 1.0%, not 0.27%
        -- I measured 1.017% at exactly the funded configuration. Concretely:
      rules_for_the_reader:
        - A SINGLE fired cell out of 17 is weak evidence. Under the exact null it happens
          about 1 run in 100, not 1 in 370.
        - Any per-cell claim must name WHICH k was pre-specified. Criterion (iv) pre-specifies
          k = m = 17 as the cell of interest; that cell alone retains its 0.27% size, which I
          independently measured at 0.002716. Cells discovered after looking do not.
        - The familywise rate must be printed in the run manifest alongside any battery reading,
          which the amendment already requires.
        - This is a SIZE caveat, not a power caveat. The producer notes v2 filed it under the
          wrong heading; that correction is right and should survive into the evidence record.
      what_it_does_NOT_undermine: >-
        It does not undermine the per-cell calibration, which is what I was asked to verify
        and which holds. A 0.27% per-cell rule and a 1.0% familywise rate over 17 correlated
        cells are both correct statements about the same instrument. The defect would be
        reporting the second as the first.

  item_5_CTRL_IDXMAP_specified_but_never_run:
    verdict: ADMISSIBLE AS WRITTEN -- but its BLOCKING status needs a Coordinator ruling before the measurement runs (see F-1)
    may_an_unrun_control_be_specified_as_active:
      answer: >-
        Yes -- provided it is never cited as a control that PASSED, and provided its
        blocking status is not asserted over a run that structurally cannot satisfy it.
        v3 meets the first condition cleanly and fails the second, which is a dispatch
        defect rather than a defect in the amendment's reasoning.
      why_the_first_condition_is_met: >-
        This is precisely the failure the red team caught in v2, where CTRL-ORACLE was
        promoted to PRIMARY in the same record that admitted it was unverified. v3 inverts
        that. CTRL-IDXMAP's unverified status is carried in THREE places, including the one
        that matters most -- the control ranking itself reads "SPECIFICATION ONLY until a
        run emits index_map.json (OPEN-9)" -- and the producer names it in fix_report as the
        second thing a reviewer should attack. A control cannot be silently trusted when the
        record says three times that it has not been run. Recording a needed control as
        specified-and-unverified is better than omitting it: omission loses the design, and
        overstatement is what was actually forbidden.
      the_demonstration_is_honestly_scoped: >-
        Toy ring n=71, N=60, n_e=6, L=10; silent on the correct map, fires on V1 (60+60
        index mismatches), V2 (58), V3 (10). The record states this demonstrates the
        MECHANISM only and nothing about stage_a.py, which the task never executed. That is
        the correct scope statement and I have no quarrel with it. I did not re-run the toy
        demonstration; it is a deterministic array comparison and is not where the risk lies.
      the_real_residual_risk_stated_by_the_producer_against_itself: >-
        An implementation that emits a correct index map and reads by other means passes
        CTRL-IDXMAP vacuously. The gather requirement is what forecloses that, and it is an
        IMPLEMENTATION obligation on stage_a.py that no run has met. Until a run meets it,
        the shift-equivariant blind class that CTRL-POSHOM cannot see remains uncovered in
        practice, whatever the amendment specifies on paper. OPEN-9 says so; I am agreeing
        with OPEN-9, not softening it.
    CTRL_POSHOM_list_checked_against_the_cited_evidence:
