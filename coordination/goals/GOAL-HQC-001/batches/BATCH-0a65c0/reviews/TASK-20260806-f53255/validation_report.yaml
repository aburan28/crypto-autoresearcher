      dup_stride: {v3: UNTESTED, v2: listed as CAUGHT, match: corrected, and correctly NOT moved to the blind side either}
      verdict: >-
        The corrected list is faithful to the injection evidence at every row. No blind
        defect is relisted as caught, and the untested dup-stride case is moved to UNTESTED
        rather than being quietly reclassified in either direction. This was the third
