        - {cell: PS-A@1e8 k=2, full_precision_size: 0.002680, rounded_size: 0.002679, breaks: false}
        - {cell: PS-R1@1e8 k=2, full_precision_size: 0.002749, rounded_size: 0.006192, breaks: true}
        - {cell: PS-R3@1e7 k=2, full_precision_size: 0.002732, rounded_size: 0.004568, breaks: true}
        - {cell: PS-R3@2e7 k=2, full_precision_size: 0.002648, rounded_size: 0.004176, breaks: true}
        - {cell: PS-R5@2e7 k=2, full_precision_size: 0.002640, rounded_size: 0.005590, breaks: true}
      verdict: >-
        The pipeline detects the exact defect class VF-1 named, including at the NEW
        PS-R3@1e7 k=2 cell that did not exist in v2. The v3 pass is therefore a real
        differential result, not an artifact of the measurement style.
    UNREQUESTED_CHECK_procedure_to_table_bit_identity:
      why_I_ran_it: >-
        The amendment makes a MANDATORY BLOCKING run-time check: before any (T) datum is
        scored the run re-derives the constants from the recorded seed and asserts
        BIT-IDENTITY with the table, and a mismatch is FAILED_IMPLEMENTATION. On the final
        batch that is a live abort risk, so I tested whether the check can actually pass.
      method: >-
        I implemented the normative procedure from the amendment's own prose alone --
        PCG64(calibration_seed), 2,000,000 replicates in fixed chunks of 100,000,
        multinomial(T, pmf) with pmf built as C(n_e,i) q^i (1-q)^(n_e-i) normalised by its
        own sum, order-statistic quantiles at i = floor(alpha/2 * R) with
        alpha = 0.0026997960632601866. I did NOT run recalibrate.py.
      result:
        PS-A@1e8: 3 of 3 cells bit-identical
        PS-R1@1e8: 16 of 16 cells bit-identical
        PS-R3@1e7: 17 of 17 cells bit-identical
        PS-R3@2e7: 21 of 21 cells bit-identical
        PS-R5@2e7: 30 of 30 cells bit-identical
        total: 87 of 87
      what_this_establishes: >-
        Strong, and stronger than what was asked for. The transcribed table and the
        generating procedure agree exactly, and the procedure is specified completely
        enough in prose that a reviewer who never saw recalibrate.py reproduces every
        constant bit-for-bit. VF-1 was the file and the procedure disagreeing; they now
        provably agree, verified from the outside. It also disposes of the disclosed
        read-scope excursion: the constants demonstrably do not depend on stage_a.py,
        because I derived all 87 of them without it.
