  item_2_VF3_q_sensitivity_and_dropping_PS_A:
    verdict: PASS -- VF-3 IS CLOSED, AND DROPPING PS-A IS A REAL FIX, NOT A RELABELLING
    coverage_check_rows_exist_at_every_reported_k:
      method: compared the q_sensitivity per_k key list against the REPORTED k list in frozen_intervals, per configuration
      PS-A@1e8: {reported_ks: 2, qsens_rows: 2, identical: true}
      PS-R1@1e8: {reported_ks: 14, qsens_rows: 14, identical: true}
      PS-R3@1e7: {reported_ks: 17, qsens_rows: 17, identical: true}
      PS-R3@2e7: {reported_ks: 19, qsens_rows: 19, identical: true}
      PS-R5@2e7: {reported_ks: 28, qsens_rows: 28, identical: true}
      total: 80 q-sensitivity rows against 80 REPORTED cells -- complete, with no gaps
      contrast_with_v2: v2 ran sensitivity at a sparse subset of k. This is the defect VF-3 named and it is fixed.
    SE_arithmetic_traced_to_committed_data:
      formula: SE(q_hat)/q_hat = sqrt((1-q)/block_failures)
      source_record: experiments/EXP-HQC-982268/runs/RUN-HQC-982268-STAGEA-a/raw-result.json
      block_failure_totals_match_record:
        PS-A: {amendment: 8122, sum_of_block_failure_counts_in_run_record: 8122}
        PS-R1: {amendment: 5200049, sum_of_block_failure_counts_in_run_record: 5200049}
        PS-R3: {amendment: 9159668, sum_of_block_failure_counts_in_run_record: 9159668}
        PS-R5: {amendment: 13187613, sum_of_block_failure_counts_in_run_record: 13187613}
      q_hat_values_match_record: all four, to the last digit
      my_3SE: {PS-A: 0.033283, PS-R1: 0.001179, PS-R3: 0.000817, PS-R5: 0.000632}
      amendment_3SE: {PS-A: 0.033283, PS-R1: 0.001179, PS-R3: 0.000817, PS-R5: 0.000632}
      verdict: reproduces exactly. No fabricated inputs; every first moment traces to the committed Stage-A record.
    PS_A_failure_independently_reproduced:
      my_draws: 1,000,000 validation replicates per shift point, my own seeds, constants read from the amendment
      k2: {at_q_hat: 0.00275, minus_3SE: 0.00381, plus_3SE: 0.00196, leaves_band: true, side: 'conservative, at +3 SE'}
      k3: {at_q_hat: 0.00268, minus_3SE: 0.00404, plus_2SE: 0.00190, plus_3SE: 0.00154, leaves_band: true, side: 'BOTH -- anti-conservative at -3 SE (>0.004), conservative already at +2 SE (<0.002)'}
      triple_agreement_on_PS_A_k3_at_minus_3SE:
        v2_validator_TASK_20260806_301f68: 0.00404
        v3_producer: 0.00409
        me: 0.00404
      verdict: >-
        VF-3 is real and reproduces on three independent implementations with three
        independent seed streams. PS-A cannot be certified at the Stage-A q_hat. The
        producer's characterisation -- k=2 breaks at 3.0 SE, k=3 already at 2.0 SE -- is
        exactly what I measure.
    is_dropping_PS_A_a_real_fix_or_a_relabelling:
      answer: A REAL FIX, and the producer stated its cost more plainly than it had to.
      reasoning: >-
        A relabelling would be widening the acceptance band until PS-A fitted inside it,
        or moving PS-A's cells to some softer status while still counting them toward
        (iv). Neither happened. The band is unchanged at [0.002, 0.004], the alpha is
        unchanged, PS-A's constants and measured sizes are retained in the frozen table,
        and PS-A is still run and still reported if funded -- marked NOT CERTIFIED UNDER
        (iv) with its sensitivity rows attached. Nothing was made to pass; a set that
        cannot be certified was removed from the criterion that certifies. That is the
        honest move.
    IS_CRITERION_iv_STILL_MEANINGFUL_WITHOUT_ITS_ANCHOR:
      the_judgement_the_Coordinator_asked_for: >-
        YES as a statement about the instrument. NO as a statement anchored to real HQC
        parameters. Those are different claims and after this amendment only the first
        one is available, so the second must stop being implied anywhere downstream.
      what_survives: >-
        Criterion (iv) still does real work. It now demands log2 Ahat_k at EVERY k in
        2..k_max at PS-R3, each with a frozen interval whose realized size I have
        independently confirmed, its null mean, its out-of-sample size and its T_stab
        reachability verdict. That is a stronger and more auditable demand than v2's
        single k=m cell, and it is the demand RT2-OBJ-1 makes necessary. The instrument
        claim -- "this estimator, at these reduced parameters, behaves as the analytic
        model says under the tested null" -- is fully supported.
      what_is_lost_and_must_not_be_glossed: >-
        PS-A was the ONLY configuration in the contract at true HQC-1 parameters rather
        than a reduced surrogate. After this change NO cell at true HQC parameters is
        certified under (iv). Criterion (iv) now rests entirely on order-matched reduced
        sets, and this stacks on v2's already-recorded narrowing that anchoring (iv) on
        PS-R3 anchors it on HQC-3's shape rather than HQC-1's. BOTH narrowings must
        travel into EV-HQC-b71230, DEC-20260806-2947ba and the GOAL-HQC-001 record. The
        producer says exactly this in VF_3_resolution and I am corroborating it, not
        softening it.
      the_mitigating_fact_checked: >-
        PS-A was never going to deliver an order-matched cell regardless. I independently
        recomputed T_stab(16) at PS-A as 1.246e45 against T = 1e8 -- infeasible by 37
        orders of magnitude under v1 and v2 alike. What criterion (iv) loses at the
        anchor is two low-order cells (k=2, k=3), not an order-matched anchor cell it
        ever had. That materially limits the damage and it is a checkable fact, not a
        consolation.
      the_successor_is_real_and_correctly_costed: >-
        Deriving PS-A's interval at the Stage-B realized q_hat (about 1.538e6 block
        failures against Stage A's 8,122; 3 SE falls 3.33% -> 0.242%, a factor 13.8) would
        give margins of 13.8x and 9.2x. The producer names the risk this buys -- the
        interval becomes a function of the data it scores, reintroducing the
        numerator/denominator coupling R1 removed from the Wald rule -- and declines to
        adopt it unmeasured. I agree with declining it at the batch cap, and I agree it is
        the right successor.
    breakdown_margins_ONE_CAVEAT:
      claim_in_amendment: breakdown margins 7.9x - 48.9x over 3 SE at PS-R1/R3/R5
      my_finding: >-
        The margins are real and large, but they are GRID-RESOLUTION figures and should be
        read as upper bounds. The probe grid is +/-0.25/0.5/1/2/4%, so a cell whose
        reported breakdown is 1% has a true breakdown somewhere in (0.5%, 1%]. The honest
        floor at PS-R3@1e7 is therefore about 6.1x, not 12.2x. My own grid reproduces the
        producer's breakdown points almost everywhere (PS-R3@1e7 k=8/11 at 2%, k=14..18 at
        1%; at k=2 I got 4% where they got 2%, i.e. in the amendment's favour).
      is_this_blocking: >-
        No. Even the conservative floor is ~6x the relevant 3 SE, and the +/-3 SE rows
        themselves -- which are the primary evidence and need no grid interpolation -- are
        all comfortably in band on my draws. But "12.2x" should be reported as "at least
        6.1x, measured at grid resolution", not as a measured breakdown.

