validation_report:
  id: TASK-20260806-f02eff
  role: validator
  goal: GOAL-HQC-001
  batch: BATCH-0a65c0
  reviews_task: TASK-20260806-cde749
  reviews_artifact: >-
    PS-R3 joint-moment measurement at T = 1e7 under AMD-EXP-HQC-982268-v3
    (measure.py, measurement_results.json, measurement_report.md, run_manifest.yaml)
  experiment: EXP-HQC-982268
  hypothesis: H-HQC-18d1b4
  produced_at: '2026-08-06'
  claim_tier: toy
  independent_session: true

  authority: >-
    I verify; I change no status and I create no evidence. I did not produce this
    measurement and I did not repair it. Nothing in this report is a statement about
    HQC, about assumption A17 or A5, about any decoding-failure rate, or about any
    standardized HQC parameter set. This is the campaign's only measurement and it is
    scoped to ONE reduced parameter set. What I certify is arithmetic, rule integrity,
    control completeness, and boundary — not a conclusion.

  OVERALL_VERDICT: CERTIFIED_AS_A_VALID_MEASUREMENT_WITHIN_THE_STATED_BOUNDARY

  verdict_summary: >-
    Every one of the six items verifies. All 17 reported log2 A_k reproduce from the
    archived S-histogram in exact rational arithmetic to within float round-off. The
    decision rule executed is byte-for-byte the admitted one; beyond comparing the
    constants I re-derived the entire 17-cell frozen table from the amendment's
    normative procedure with my own implementation and my own reading of the seed
    string, and reproduced all 34 bounds BIT-IDENTICALLY, together with null_mean,
    null_sd and null_median. No constant was re-tuned and recalibrate.py was not
    invoked. Every declared control is reported with its outcome; CTRL-IDXMAP and
    CTRL-POSHOM clause (b) are NOT RUN per Coordinator RULE-1, no artifact was
    synthesized for either, and I found no place in any of the four deliverables where
    either is cited as passing or contributes to a verdict. RULE-5 is honoured in both
    the report and the machine-readable record, and my own independent familywise
    measurement reproduces it. Five findings are recorded below; NONE of them
    invalidates the measurement and none is a re-tune. The executor's self-reported
    defects are real, were reported rather than absorbed, and I confirmed both by
    reading the code and by redoing the verification they broke.

  # ====================================================================
  # ITEM 1 -- INDEPENDENT RECOMPUTATION OF log2 A_k
  # ====================================================================
  item_1_recomputation:
    verdict: REPRODUCES
    what_i_did: >-
      I did not re-run the sampler. I took the archived sufficient statistic --
      T_arm_diagnostics.S_histogram, 57 bins -- and recomputed EVERY reported cell,
      not one, from the estimator as the amendment writes it, in EXACT RATIONAL
      arithmetic (fractions.Fraction over integer histogram counts and integer
      binomial coefficients), converting to log2 only at the end via
      decimal.Decimal at 60-digit precision. This is an arithmetic-independent path:
      no numpy, no floating-point accumulation, no shared code with measure.py.
    estimator_used: >-
      log2 A_k = log2( (sum_s C(s,k) H_s) / (T * C(n_e,k)) ) - k * log2( (sum_s s H_s) / (T * n_e) )
    preconditions_checked:
      histogram_sums_to: 10000000
      equals_T_planned_and_T_achieved: true
      n_e: 56
      q_hat_from_histogram_exact: 0.31983157321428574
      q_hat_reported: 0.3198315732142857
      q_hat_agrees: true
    results:
      cells_recomputed: 17
      cells_reproducing: 17
      max_absolute_deviation_bits: 3.664e-15
      deviation_is: >-
        IEEE-754 round-off in the executor's float path, nine to eleven orders of
        magnitude below every interval half-width in the frozen table (narrowest here
        7.403e-05 bits at k=2). Not a discrepancy.
      spot_values:
      - {k: 2,  recomputed: -6.030632353715041e-03, reported: -6.030632353715593e-03, diff: 5.5e-16}
      - {k: 9,  recomputed: -2.224632080150326e-01, reported: -2.224632080150339e-01, diff: 1.4e-15}
      - {k: 17, recomputed: -8.656665522924333e-01, reported: -8.656665522924349e-01, diff: 1.7e-15}
      - {k: 18, recomputed: -9.813074175426496e-01, reported: -9.813074175426522e-01, diff: 2.6e-15}
    what_this_does_and_does_not_certify: >-
      IT CERTIFIES THE ARITHMETIC FROM THE HISTOGRAM FORWARD, AND NOTHING BEHIND THE
      HISTOGRAM. The S-histogram is itself an output of the (T) arm, which I did not
      re-run and could not afford to. A sampler defect that produced a wrong histogram
      would reproduce perfectly under this check. That gap is exactly OPEN-6 and it is
      carried into the claim boundary in item 5, not discharged here.

  # ====================================================================
  # ITEM 2 -- WAS THE DECISION RULE THE ADMITTED ONE, UNMODIFIED?
  # ====================================================================
  item_2_rule_integrity:
    verdict: YES -- UNMODIFIED, AND INDEPENDENTLY RE-DERIVED BIT-FOR-BIT
    a_artifact_identity:
      amendment_sha256_recomputed_by_me: 16e8b73a7790e271020e5cd7065753792f8cff549104705e35500d671266f2ae
      matches_snapshot_receipt_TASK-20260806-ae094e: true
      matches_value_recorded_by_validator_TASK-20260806-f53255: true
      all_four_snapshot_paths_verified_by_me: true
      per_path:
        amendment_v3.yaml: MATCH
        fix_report.md: MATCH
        recalibrate.py: MATCH
        transcribed_size.json: MATCH
      note_on_commit_binding: >-
        snapshot-receipt.json carries commit_sha: null with parent_sha
        9d5de4a0bd9f4c95f42f206bd788ab4a50aa637a. Under the CLAUDE.md rule that archive
        receipts bind to CONTENT first, this archive is CONTENT-VERIFIED. I verified the
        content; I did not verify commit reachability and do not claim to.
    b_constants_actually_used:
      compared: >-
        Every frozen constant appearing anywhere in measurement_results.json --
        MEASUREMENT.cells, gate_INV_NULL_bit_identity.per_cell (frozen AND rederived),
        NULL_P.per_k, NULL_M.per_k -- against the PS-R3/1e7 configuration parsed
        straight out of amendment_v3.yaml with yaml.safe_load.
      cells: 17
      mismatches: 0
      q_hat_frozen_identical: true
      calibration_seed_identical: true
      constant_type_census: {float: 119, str: 0, other: 0}
      loading_path_audited: >-
        measure.py opens the amendment with mode 'r' and yaml.safe_load only (lines
        169-171). No critical value is hardcoded; the only literal is
        ALPHA = 0.0026997960632601866, which equals the amendment's nominal_size.
        recalibrate.py is never imported or executed -- Coordinator RULE-4 observed.
        decision_rule_source.constants_re_tuned is false and I found nothing
        contradicting it.
    c_my_own_re_derivation_of_the_whole_table:
      why: >-
        Comparing constants proves the run used the table. It does not prove the table
        is the one the frozen procedure generates. Re-tuning could have happened one
        level up. So I regenerated it.
      method: >-
        Written from the amendment's binding_calibration_procedure TEXT ONLY, without
        reading measure.py's or recalibrate.py's draw code first. Seed string
        "EXP-HQC-982268/v3/INV-NULL|PS-R3|1e7|10000000|cal|2000000", SHA-256, first 8
        bytes big-endian -> 13271017274709966482, which is the seed recorded in the
        amendment. pmf = C(56,i) q^i (1-q)^(56-i) in float64 normalised by its own sum;
        numpy Generator(PCG64(seed)); 2,000,000 multinomial(T=1e7, pmf) replicates drawn
        in fixed chunks of 100,000; order-statistic interval with i = floor(alpha/2 * R)
        = 2699.
      result:
        intervals_bit_identical: 34 of 34   # 17 c_lo + 17 c_hi
        null_mean_bit_identical: 17 of 17
        null_sd_bit_identical: 17 of 17
        null_median_bit_identical: 17 of 17
      conclusion: >-
        The frozen table is genuinely the output of the frozen procedure at the recorded
        seed, reproduced by a THIRD independent implementation. The executor's blocking
        bit-identity gate verdict (17/17 PASS) is confirmed, not merely accepted.
    d_finding_V1_bit_identity_depends_on_an_unstated_detail:
      severity: minor, non-blocking, DOES NOT AFFECT THIS RUN
      what_happened: >-
        My FIRST implementation evaluated the estimator as
        log2(num/T) - log2(C(n_e,k)) - k*log2(m1/(T*n_e)) instead of the amendment's
        literal grouping log2(num/(T*C(n_e,k))) - k*log2(m1/(T*n_e)). The two are
        mathematically identical and the underlying draws were bit-identical (I confirm
        this: the null_sd agreed to exactly the ddof=0/ddof=1 factor 1/(2R) = 2.5e-07).
        The regrouping moved 11 of the 17 intervals in their last few ulps -- relative
        differences 4.5e-14 to 3.9e-12 -- and my run would have FAILED the MANDATORY AND
        BLOCKING bit-identity gate on a correct implementation of the stated procedure.
      why_it_matters: >-
        The amendment argues at length (why_bit_identity_and_not_a_tolerance) that
        bit-identity needs no judgement and cannot drift. That is true of the numbers and
        false of the reproduction: bit-identity additionally binds a floating-point
        association order that the normative text does not pin. A future re-derivation --
        the exact scenario the gate exists for -- can fail on an algebraically correct
        implementation. The amendment already anticipates that a numpy change would surface
        as a real failure; expression grouping is the same class and is not named.
      not_a_defect_in_this_run: >-
        The executor implemented the literal grouping and reproduced the table exactly, as
        did I on the second attempt. Nothing here changes any reported number.
      recommendation: >-
        A successor amendment should pin the exact evaluation order (or bind the exact
        expression as code) inside binding_calibration_procedure.estimator, and should
        state that null_sd is the ddof=1 sample standard deviation -- also currently
        unstated, also immaterial, also something an independent re-derivation must guess.

  # ====================================================================
  # ITEM 3 -- WERE ALL DECLARED CONTROLS RUN AND REPORTED?
  # ====================================================================
  item_3_controls:
    verdict: YES -- COMPLETE AND CORRECTLY LABELLED
    inventory_as_reported_and_as_I_verified:
    - {control: INV-NULL bit-identity, declared: blocking, status: RUN, outcome: PASS 17/17, verified_by_me: RE-DERIVED INDEPENDENTLY, 34/34 BIT-IDENTICAL}
    - {control: CTRL-ORACLE, declared: blocking, status: RUN, outcome: PASS 40 cells max diff 8.88e-16 vs 1e-12, verified_by_me: present in record with zero coverage slack, 12 cells >1 bit, 18 negative; not independently re-run}
    - {control: NULL-P, declared: run, status: RUN, outcome: 0 of 17 fired, verified_by_me: intervals in the NULL-P block are byte-identical to the frozen table}
    - {control: NULL-M, declared: rank 1, status: RUN BUT SEVERELY UNDER-POWERED, outcome: 81980 trials, gamma_hat 1.00092, TC-5 passes, NO FIRING VERDICT GIVEN, verified_by_me: correctly labelled a BUDGET outcome under AGENTS.md rule 5 and never a null result}
    - {control: CTRL-BS, declared: run, status: RUN ON A 200k SUBSAMPLE, outcome: k=2 mean -5.62e-05 z=-2.31, reported as nonzero rather than rounded to zero, verified_by_me: present and honestly caveated}
    - {control: CTRL-POSHOM clause (a), declared: run, status: RUN ON A SUBSAMPLE, outcome: DOES NOT FIRE X=50.35 df=55 p=0.653, verified_by_me: present; blind class carried forward}
    - {control: CTRL-POSHOM clause (b), declared: BLOCKING, status: NOT RUN, outcome: UNEVALUATED per Coordinator RULE-1, verified_by_me: CONFIRMED NOT RUN, no artifact synthesized, cited as passing by nobody}
    - {control: CTRL-IDXMAP, declared: BLOCKING, status: NOT RUN, outcome: UNEVALUATED per Coordinator RULE-1, verified_by_me: CONFIRMED NOT RUN, no index_map.json exists, cited as passing by nobody}
    - {control: CTRL-WBP, declared: rank 7, status: NOT RUN, outcome: contract runs it at PS-R1 only, out of this task's scope, verified_by_me: correct}
    - {control: CTRL-DEC, declared: run, status: RUN reduced scale, outcome: 3000/3000 blocks agree across 5 densities, verified_by_me: present}
    - {control: 'D1/D2/D3/D5', declared: hard invariants, status: RUN, outcome: PASS, verified_by_me: present}
    - {control: 'D4 / BASE-TABLE10', declared: drift detector, status: NOT APPLICABLE, outcome: PS-A tail table, PS-A not run here, verified_by_me: correct}
    the_specific_check_the_card_asked_for:
      CTRL_IDXMAP_and_CTRL_POSHOM_b_reported_NOT_RUN: CONFIRMED
      no_artifact_synthesized: >-
        CONFIRMED. Neither index_map.json nor pair_counts_by_position.csv exists in the
        task directory; the deliverables are exactly the four declared files.
      cited_as_passing_by_nobody: >-
        CONFIRMED. I searched all four deliverables. Every occurrence of CTRL-IDXMAP and
        of CTRL-POSHOM clause (b) is an explicit NOT RUN / UNEVALUATED statement, in the
        control table, in section 6.1, in controls_NOT_RUN, in the manifest, and in the
        one-line ledger summary. Neither appears in any gate verdict, in the validity
        determination, or in support of any reported number. The
        amended_manifest_requirements field for the index-array hash carries the reason
        rather than a fabricated digest.
      RULE_2_defect_carried_not_repaired: >-
        CONFIRMED. The L = n_2*dup defect is recorded verbatim in controls_NOT_RUN and in
        section 6.1, marked not repaired and not exercised, with the dup=1 degeneracy at
        PS-R3 stated rather than used as a dismissal.
    cost_that_must_travel: >-
      This measurement scored 17 cells with TWO DECLARED BLOCKING CONTROLS UNEVALUATED.
      The executor states this three times and I restate it here so no downstream record
      can drop it: any reading of this measurement carries that cost.
    minor_accounting_note:
      severity: trivial
      detail: >-
        CTRL_POSHOM has no entry in budget.stages although clause (a) ran, and the ten
        listed stages sum to 4688.862 core-seconds which with the 481.29 prior charge
        gives 5170.152 against the reported 5170.31 -- 0.158 core-seconds unattributed.
        Immaterial and within budget on either figure. Also, run_manifest validity text
        points the reader to "budget.DEVIATION", a field that does not exist; the
        deviation is narrated in measurement_report.md section 8 instead.

  # ====================================================================
  # ITEM 4 -- RULE-5 COMPLIANCE
  # ====================================================================
  item_4_rule_5:
    verdict: COMPLIANT
    what_the_record_says: >-
      measurement_report.md section 5 leads with the familywise number, states in bold
      that a set of per-k firings from this report is a familywise ~1.0% observation and
      not a 0.27% one, states that one fired cell out of 17 is about 1 run in 100 and
      NOT 1 in 370, and states that only the pre-specified k = m = 17 cell retains the
      0.27% size. The same sentence is carried in machine-readable form at
      MEASUREMENT.multiplicity_statement_RULE_5 and again in familywise_size_RULE_5.
    prespecified_cell_flagged_distinctly: >-
      CONFIRMED at the data level, not just in prose: is_prespecified_cell is true for
      k=17 and false for all other 16 cells, and prespecified_cell_k = 17.
    my_independent_measurement:
      method: >-
        1,000,000 validation replicates under the exact binomial null at the frozen
        q_hat, MY OWN seed (PCG64(20260806777111), unrelated to the executor's derived
        validation seed), my own implementation, scored against the frozen intervals.
      familywise_size_17_cell_battery: 0.010133
      ci95: [0.009937, 0.010329]
      multiple_of_per_cell_nominal: 3.75
      k17_cell_size: 0.002686
      nominal_per_cell: 0.0026997960632601866
      comparison:
        executor_TASK-20260806-cde749: 0.01026
        validator_TASK-20260806-f53255: 0.01017
        red_team_TASK-20260806-250b29: 0.01001
        this_validator: 0.010133
      reading: >-
        Four independent measurements at the funded configuration span 1.001% to 1.026%.
        The executor's point estimate sits at the top of that spread; its interval
        overlaps mine and the number is not overstated in the direction that would
        flatter the result -- a larger familywise size is the more conservative claim.
        CONFIRMED.
    additional_size_check_at_the_REALIZED_q:
      why: >-
        The frozen interval is calibrated at the Stage-A q_hat 0.31994628619715665, but
        the arm measured 0.3198315732 -- a -3.585e-04 relative shift. The amendment's
        q-sensitivity block certifies PS-R3@1e7 with a minimum breakdown shift of 1.0e-02,
        which is 27.9x the realized shift, and the realized shift is 0.44x the 3 SE
        reference 8.174e-04. I did not take that on trust.
      what_i_did: >-
        Drew 200,000 null replicates at the MEASURED q_hat and scored them against the
        FROZEN intervals.
      result:
        familywise_size_at_measured_q: 0.010075
        per_cell_range_at_measured_q: [0.00248, 0.002735]
        k17_cell_size_at_measured_q: 0.002515
      conclusion: >-
        Plug-in error at the realized magnitude does not perturb the rule's realized size.
        The firings are NOT attributable to q mis-specification. I note the amendment's own
        caveat that its SE reference is the rho=0 value and a LOWER bound under POSITIVE
        block correlation; the correlation measured here is negative, for which the rho=0
        reference is conservative in the safe direction.
    the_honest_reading_of_multiplicity_here:
      statement: >-
        RULE-5 is binding and is honoured. It is also NOT the limitation that binds this
        result. The smallest deviation in the battery is -32.4 null SD and the
        pre-specified cell alone is at -42.7 null SD. No multiplicity correction over 17
        cells bears on a deviation of that size. Saying so is not a licence to upgrade the
        claim: what limits this measurement is item 5, not the family size. Both must be
        reported, and neither may be used to shrink the other.

  # ====================================================================
  # ITEM 5 -- CLAIM BOUNDARY
  # ====================================================================
  item_5_claim_boundary:
    verdict: THE RECORD'S OWN BOUNDARY IS ACCURATE AND I ADOPT IT, PLUS ONE ADDITION
    what_this_measurement_CAN_support:
    - >-
      At PS-R3 -- ONE REDUCED PARAMETER SET, n = 7187, n_e = 56, n_2 = 128, dup = 1,
      m = 17, order-matched to HQC-3's shape and to no standardized parameter set -- at
      T = 10,000,000 achieved exactly with no truncation, under the frozen v3 decision
      rule admitted by two independent reviews and with every blocking run-time gate
      passing: the estimator log2 A_hat_k lies BELOW its frozen lower bound at every
      k = 2..18, including the pre-specified k = m = 17 cell at -0.8657 (-42.7 null SD).
    - >-
      The same estimator, at the same T, against the same intervals, applied to synthetic
      draws from the tested binomial null (NULL-P) fires at 0 of 17 cells. Within the
      scope of that control the firing is not the estimator misbehaving at this T under
      this null.
    - >-
      The frozen rule is the admitted rule, byte-for-byte, independently re-derived, with
      realized per-cell size in [0.002, 0.004] and familywise size ~1.0%.
    - 'Claim tier: TOY. Nothing above is a result about a cryptosystem.'
    what_this_measurement_CANNOT_support:
    - >-
      NOTHING ABOUT HQC, ABOUT A17 OR A5, ABOUT ANY DECODING-FAILURE RATE, OR ABOUT ANY
      STANDARDIZED PARAMETER SET. PS-A was DROPPED from success criterion (iv) by v3 on
      its own q-robustness failure and nothing replaced it, so NO CELL AT TRUE HQC
      PARAMETERS IS CERTIFIED BY THIS CAMPAIGN AT ALL. A reader who takes this as
      evidence about HQC has been given no such evidence.
    - >-
      Nothing about whether the (T) sampler produces the object the contract intends.
      OPEN-6 is open: no arm tests the (T) joint law against an answer known in advance.
      CTRL-ORACLE checks estimator arithmetic on enumerable toys and NULL-P/NULL-M check
      the pipeline on laws where A_k = 1 is a theorem. AN INSTRUMENT DEFECT IN THE (T)
      SAMPLER IS NOT EXCLUDED AS THE SOURCE OF THE DEPARTURE.
    - >-
      Nothing about the composite null. RT2-OBJ-1 is not closed; the size of INV-NULL
      when q is not known is unmeasured. A firing is scoped to the TESTED null -- one
      specific binomial law at one plug-in q -- and not to "order k" as such.
    - >-
      Nothing that CTRL-POSHOM's blind class covers. It is structurally blind to V1
      (off-by-one truncation) and V2 (interleaved partition) BY THEOREM, so clause (a)
      not firing does not exclude an index defect of that class.
    - >-
      Nothing beyond the SYMMETRISED content of A17. S is a symmetric functional of
      (F_1..F_n_e), so even at k_max = n_e this rule would test only that content --
      the amendment's own struck-and-corrected sentence, which stays struck.
    - >-
      Nothing with two declared blocking controls evaluated. CTRL-IDXMAP and
      CTRL-POSHOM clause (b) are UNEVALUATED.
    - >-
      Nothing replicated. One run, one seed family, one machine, no independent-seed
      replication authorized or performed. NULL-M is under-powered, and CTRL-BS and
      CTRL-POSHOM(a) ran on subsamples -- all BUDGET outcomes under AGENTS.md rule 5
      and never null results.
    finding_V3_my_own_addition_the_shape_is_pairwise_and_that_widens_the_hypothesis_set:
      severity: interpretive, addressed to the Coordinator and the red team
      observation: >-
        The departure is almost entirely a PAIRWISE effect. log2 A_hat_k / C(k,2) is
        constant to within 6.4% across k = 2..18, rising monotonically from -6.0306e-03
        at k=2 to -6.4138e-03 at k=18 (ratio 1.0000 to 1.0635). That is the exchangeable
        pairwise-dependence signature: for exchangeable blocks with pair correlation rho,
        log2 A_k is proportional to C(k,2) to first order. The executor reports the shape
        as description and draws no mechanism; I agree it is description, and I add the
        quantity it implies. From log2 A_hat_2 = -6.0306e-03 and q_hat = 0.31983:
        E[F_i F_j] = 0.995828 q^2, so the implied pair correlation between block-failure
        indicators is rho_hat = -1.96e-03 -- SMALL, and NEGATIVE.
      why_i_am_recording_it: >-
        Because the sign and the order of magnitude are what a FIXED-WEIGHT constraint
        would produce. If the error/randomness vectors are sampled at fixed weight, the
        blocks compete for a fixed total weight, which induces exactly a small negative
        pairwise correlation between block failures -- a structural feature of the
        sampling model that the product-binomial null does not represent. I have NOT
        tested this and I am NOT asserting it. I am asserting that it is a MUNDANE
        candidate at the right sign and the right order of magnitude, and that the batch
        contains no arm that separates it from the alternatives.
      the_hypothesis_set_this_measurement_leaves_open: >-
        At least three explanations remain compatible with the record exactly as archived:
        (a) a defect in the (T) sampler or decoder inducing negative pairwise dependence --
        untested, OPEN-6; (b) a structurally expected consequence of fixed-weight sampling,
        under which the tested null was mis-specified rather than the observation
        informative; (c) a genuine departure of the symmetrised joint law from the binomial
        null at this reduced set. NOTHING IN THIS BATCH DISTINGUISHES THEM. No downstream
        record may select one, and in particular a large |z| is evidence about the null
        that was tested and not about which of (a), (b), (c) produced it.
      concrete_successor_test: >-
        The cheapest discriminator is a null object of the same shape: recompute the
        battery on a surrogate whose blocks are generated under the SAME fixed-weight
        constraint but with the decoding step replaced by an independent coin at the
        matched q. If the C(k,2) curve survives that substitution the effect is the
        constraint (b); if it vanishes the effect is downstream of it, which separates (a)
        from (b) only after CTRL-IDXMAP and an OPEN-6 arm exist. This is the
        controls-before-belief obligation of the inventor protocol applied to this exact
        observation, and it is cheap relative to the (T) arm.

  # ====================================================================
  # ITEM 6 -- REPRODUCIBILITY
  # ====================================================================
