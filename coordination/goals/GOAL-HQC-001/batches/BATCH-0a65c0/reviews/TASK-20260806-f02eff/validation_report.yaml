      stdout_stderr: carried in the manifest, stderr empty
      timings_budget_validity: present, within budget (5170.31 of 5200 core-seconds;
        1204.78 of 2400 wall)
    finding_V4_missing_inference_block:
      severity: artifact-policy gap, non-blocking for the arithmetic
      detail: >-
        run_manifest.yaml carries NO inference block. AGENTS.md "Artifact policy" requires
        every run to retain the requested model policy, the backend, the resolved runtime
        model identifier, model provenance and whether that identifier is probe-verified,
        the reasoning effort, whether fallback was used, and any degraded requirements.
        None of these fields is present under any name. This does not affect a single
        number I checked and it is not grounds to reject the measurement, but the run is
        not fully reproducible in the sense the contract requires, and the gap should be
        recorded in the evidence record rather than closed silently.
    finding_V5_the_fail_open_integrity_check_confirmed_and_the_misleading_residue:
      severity: confirmed self-disclosure, substance repaired, one presentational risk
      what_i_confirmed_in_the_code: >-
        measure.py reads receipt.get("path_sha256") at the TOP LEVEL of
        snapshot-receipt.json, where the key is nested under "archive". declared is
        therefore None, and the abort is guarded by 'if declared is not None and declared
        != amd_sha', so the check COULD NOT HAVE FIRED. The executor's account of its own
        defect is accurate in every particular.
      substance_independently_redone_by_me: >-
        I hashed all four snapshot-declared paths against the live tree myself. All four
        MATCH. The frozen input is intact regardless of the broken check.
      the_residue: >-
        The primary frozen_input_integrity block in measurement_results.json still reads
        amendment_sha256_in_snapshot_receipt: null and match: false. Read alone it says the
        integrity check FAILED. Only frozen_input_integrity_CORRECTED resolves it. The
        executor was right to record the failed field rather than overwrite it -- records
        are immutable and corrections supersede -- but the evidence record MUST cite the
        CORRECTED block explicitly, or a later reader will find match: false and reasonably
        conclude the run was invalid.

