      seeds: >-
        Calibration seed 13271017274709966482 recorded AND independently re-derived by me
        from the seed string; validation seed 4434254446725201526; (T) master seed 20260804
        with all eight per-shard SHA keys recorded.
      seed_independence_verified_by_me: >-
