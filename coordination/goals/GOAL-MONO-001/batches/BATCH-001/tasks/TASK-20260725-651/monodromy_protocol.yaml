monodromy_protocol:
  task_id: TASK-20260725-651
  goal_id: GOAL-MONO-001
  batch_id: BATCH-001
  question_id: RQ-MONO-001
  open_problem_ref: KN-OPEN-009
  literature_refs: [KN-LIT-039, KN-LIT-001]
  prior_harness_refs:
    - experiments/EXP-MONO-001/contract.md
    - experiments/EXP-MONO-001/mono_census.py
    - experiments/EXP-IMON-001/contract.md
    - experiments/EXP-IMON-001/imon_group.py
  status: review_only_freeze
  protocol_version: MONO-m3-census-1.0.0-review
  authorization: >-
    Review-only freeze. No Frobenius/cycle-type census execution is authorized
    by this artifact. Independent review PASS (if granted later) only unlocks
    scheduling of a later executor measurement task under a fresh write_scope
    and a separate Coordinator ledger authorization. Review PASS is not a
    monodromy mathematical result, not a barrier theorem, and not an
    exceptional-locus discovery.
  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; model is an
      authorized fallback under AMEND-PATH-001-001. fallback_used is
      infrastructure/policy, not mathematical evidence.
  novelty_status: adaptation
  novelty_note: >-
    Chebotarev/Frobenius equidistribution (KN-LIT-039) and Semaev summation
    polynomials (KN-LIT-001) are known; applying a frozen cycle-type census to
    the m=3 Semaev cover as a relation-rate gate is the program's stated
    open problem KN-OPEN-009. No prior computation of Semaev-cover monodromy
    was located in the knowledge corpus (documented in KN-OPEN-009). This
    card freezes a measurement protocol, not a new Galois-theoretic theorem.

  # ---------------------------------------------------------------------------
  # Cover object (pinned)
  # ---------------------------------------------------------------------------
  cover:
    name: m3_semaev_summation_cover
    m: 3
    model: short_Weierstrass
    equation: "y^2 = x^3 + A*x + B over F_p"
    summation_polynomial: S_3(x1, x2, T)
    degree_in_T: 2
    explicit_S3: >-
      For E: y^2 = x^3 + A x + B, the Semaev cubic summation polynomial
      (KN-LIT-001) is the unique (up to F_p^* scaling) symmetric polynomial
      of degree 2 in each variable vanishing on x-coordinates of
      P1+P2+P3 = O. Executor MUST pin one monic-in-T normalization before
      measurement and record the coefficient polynomial identities used.
      Reference shape (monic in T after clearing the leading (x1-x2)^2 factor
      when x1 != x2; ramified/degenerate loci logged separately):
        S_3(x1,x2,T) = (x1-x2)^2 * T^2
          - 2*((x1+x2)*(x1*x2 + A) + 2*B) * T
          + ((x1*x2 - A)^2 - 4*B*(x1+x2)).
      Exact coefficient polynomial must be re-derived or cited from a
      hash-pinned helper and checked on >=3 public addition identities
      before any census sample is admitted.
    cover_interpretation: >-
      For each specialization (x1,x2) in F_p^2, form the univariate
      f_{x1,x2}(T) in F_p[T] of degree <= 2 obtained from S_3(x1,x2,T)
      under the pinned monic-in-T normalization. The Frobenius cycle type is
      the factorization degree pattern of f_{x1,x2} over F_p. Geometric
      monodromy of the degree-2 cover is compared to the full symmetric
      group S_2 (equivalently the expected wreath/sign structure at m=3
      collapses to transitive S_2 on the T-fiber). Full monodromy predicts
      Chebotarev(S_2) equidistribution of cycle types; exceptional monodromy
      is a proper image or a systematically deviant density on a positively
      exhibited locus.
    fiber_degree: 2
    expected_full_monodromy_group: S_2
    expected_full_monodromy_note: >-
      At m=3, deg_T = 2^{m-2} = 2, so the only transitive subgroup of S_2
      is S_2 itself. "Full vs exceptional" therefore discriminates
      (a) Chebotarev-consistent split/inert equidistribution on generic
      ordinary curves versus (b) a positively exhibited locus with
      reducible/always-split/always-inert/other systematically deviant
      densities after CM and automorphism controls. Higher-m wreath tests
      (S_d, d=2^{m-2}) are out of scope for this card.

  # ---------------------------------------------------------------------------
  # Curve sampling (pinned)
  # ---------------------------------------------------------------------------
  curve_sampling:
    field_type: prime
    primes:
      - 211
      - 431
      - 809
      - 1601
    min_sizes: 3
    curves_per_size_min: 20
    seed: 20260725
    seed_stream_rule: >-
      Master seed 20260725. Per-prime stream: SHA-256("GOAL-MONO-001|m3|p=<p>|seed=20260725")
      truncated to 64-bit integer as RNG seed for curve search and sample draws.
      All admitted curves and samples must be regenerable from this rule.
    curve_search:
      model: short_Weierstrass
      a_range_rule: "a in {0,1,...,min(p-1, 64)}"
      b_range_rule: "b in {1,2,...,min(p-1, 64)}"
      discriminant_nonzero: "(4*A^3 + 27*B^2) mod p != 0"
      order_computation: exact_enumeration_or_schoolbook_point_count
      require_prime_order_group: true
      cofactor: 1
    admission_filters:
      require_ordinary: true
      reject_supersingular: true
      reject_anomalous: true
      anomalous_test: "#E(F_p) != p"
      supersingular_test: "#E(F_p) == p+1"
    panels:
      random_ordinary_controls:
        description: >-
          Primary census panel. Ordinary prime-order curves drawn by the
          seeded search, after exclusion filters.
        exclude_j_invariants: [0, 1728]
        exclude_reason: >-
          Extra-automorphism artifacts (j=0, j=1728) must never enter the
          random-control histogram that supports a full-monodromy barrier
          claim (KN-OPEN-009 / RQ-MONO-001).
        if_sampled_action: >-
          Log under automorphism_artifact_panel; do not count toward
          random_ordinary_controls statistics or barrier agreement tests.
      cm_exception_screen:
        description: >-
          Explicit CM / small-discriminant panel, sampled and scored
          separately from random controls. Used only to positively screen
          for exceptional monodromy / deviant rates.
        min_curves_total: 8
        construction: >-
          Prefer known small-discriminant CM j-invariants reducible over
          F_p when they exist at the pinned primes; otherwise record
          cm_screen_unavailable_at_prime and do not invent CM curves.
        never_merge_into_random_controls: true
      automorphism_artifact_panel:
        description: >-
          j in {0, 1728} curves, if constructible at the pinned primes.
          Analyzed only as automorphism-artifact controls; never as
          evidence of an exceptional attack locus and never as random
          controls.
        j_targets: [0, 1728]
        claim_rule: >-
          Aut(E) > {\pm1} artifacts cannot alone establish an exceptional
          monodromy locus for generic ordinary curves.
    logging_required:
      - p
      - A
      - B
      - j_invariant
      - group_order
      - order_is_prime
      - ordinary_flag
      - panel_id
      - exclusion_flags

  # ---------------------------------------------------------------------------
  # Census procedure (pinned)
  # ---------------------------------------------------------------------------
  census:
    samples_per_curve: 30000
    sample_space: F_p_x_F_p
    sample_draw: >-
      Independent uniform (x1,x2) in F_p^2 from the per-prime seeded RNG.
      Degenerate specializations are counted in the histogram under their
      observed type and also tallied in degenerate_counters (not dropped
      silently).
    degenerate_loci:
      - id: x1_eq_x2
        test: x1 == x2
      - id: leading_coeff_zero
        test: leading coefficient of pinned monic-in-T form is 0
      - id: multiple_root
        test: disc(f_{x1,x2}) == 0
    cycle_type_vocabulary:
      - id: split_1_1
        partition: [1, 1]
        meaning: two distinct roots in F_p (split Frobenius)
      - id: inert_2
        partition: [2]
        meaning: irreducible quadratic (inert Frobenius)
      - id: ramified
        partition: [1, 1]
        repeated_root: true
        meaning: discriminant zero / repeated root
      - id: degree_drop
        meaning: deg f < 2 after normalization (degenerate cover fiber)
    primary_histogram_metric: cycle_type_frequency
    required_metrics:
      - metric: freq_split_1_1
        definition: count(split_1_1) / samples_per_curve
      - metric: freq_inert_2
        definition: count(inert_2) / samples_per_curve
      - metric: freq_ramified
        definition: count(ramified) / samples_per_curve
      - metric: freq_degree_drop
        definition: count(degree_drop) / samples_per_curve
      - metric: delta_split_vs_S2
        definition: freq_split_1_1 - chebotarev_S2_split
      - metric: abs_delta_split_vs_S2
        definition: abs(delta_split_vs_S2)
      - metric: weil_floor_abs
        definition: 2.0 / sqrt(p)
      - metric: delta_over_weil
        definition: abs_delta_split_vs_S2 / weil_floor_abs
      - metric: joint_relation_proxy_rate
        definition: >-
          Fraction of samples where f splits AND both x1 and x2 lie in the
          toy factor-base window FB_W = {x(r*G): 1 <= r <= W} for a fixed
          generator G of E(F_p). This is a relation-rate proxy for
          GOAL-ICEX-001, not a new attack primitive.
      - metric: quasirandom_relation_prediction
        definition: >-
          freq_split_1_1 * (W_eff / p) * (W_eff / p) under independence of
          split event and window membership (toy proxy; record also the
          exact-enumeration alternative when p is small enough).
      - metric: delta_relation_vs_quasirandom
        definition: joint_relation_proxy_rate - quasirandom_relation_prediction
    factor_base_window:
      W: 4
      W_eff_rule: number of distinct x-coordinates in {x(r*G): 1 <= r <= W}
      generator_rule: smallest lexicographic affine point among generators of E(F_p)
    chebotarev_predictions:
      group: S_2
      split_1_1: 0.5
      inert_2: 0.5
      ramified_asymptotic: O(1/p)
      reference: KN-LIT-039
    factorization_method:
      required: exact_univariate_factorization_over_F_p
      toy_allowed:
        - discriminant_and_legendre_for_quadratics
        - root_scan_for_degree_le_2
      independent_reverification_required_on_exception: true
      reverification_rule: >-
        Any curve-level |delta_split_vs_S2| > 3 * weil_floor_abs must be
        re-factored with an independently implemented routine (second code
        path or Sage/PARI factor) before admission as an exception candidate.
        Mismatch => failed_infrastructure / invalid, never exceptional evidence.

  # ---------------------------------------------------------------------------
  # Error tolerance and decision gates
  # ---------------------------------------------------------------------------
  error_tolerance:
    weil_floor_formula: 2.0 / sqrt(p)
    full_monodromy_multiplier: 3
    full_monodromy_test: >-
      On the random_ordinary_controls panel, for each admitted curve,
      abs_delta_split_vs_S2 <= 3 * weil_floor_abs.
    barrier_aggregate_rule: >-
      Outcome FULL_MONODROMY_BARRIER_TOY requires: (i) >=3 distinct primes
      from the pinned list with >=20 admitted random_ordinary_controls
      curves each; (ii) every such curve passes full_monodromy_test;
      (iii) no non-excluded ordinary curve is an admitted exception
      candidate after reverification; (iv) all instrument controls pass.
    exceptional_locus_rule: >-
      Outcome EXCEPTIONAL_LOCUS_TOY requires positive exhibition: at least
      one non-excluded ordinary curve (random panel or CM screen) with
      reverified abs_delta_split_vs_S2 > 3 * weil_floor_abs at >=1 pinned
      prime, OR a CM-screen family with the same deviant inequality on
      >=2 distinct CM curves at >=2 primes, with automorphism_artifact_panel
      curves excluded from counting as the exceptional locus. Exceptional
      claims must name the curve list, hashes, and re-verification receipts.
    exception_family_rate_screen: >-
      Secondary screen (non-decisive alone): if >=1/20 of random_ordinary
      curves at a size are reverified exceptions, flag FAMILY_RATE_ALERT
      for Coordinator review. Alone this does not mint EXCEPTIONAL_LOCUS_TOY
      without the positive-exhibition package above.
    inconclusive_or_no_go: >-
      If instrument/controls fail, primes lack enough prime-order ordinary
      curves under the search budget, or S_3 normalization identities fail,
      record SCOPED_PROTOCOL_NO_GO naming the first missing obligation.
      Timeouts/crashes/OOM are failed_infrastructure, never negative
      monodromy evidence.

  # ---------------------------------------------------------------------------
  # Controls and confounders
  # ---------------------------------------------------------------------------
  controls:
    - id: CTRL-POS-PLANTED-SPLIT
      statement: >-
        For (x1,x2) constructed so that there exist points with those
        x-coordinates summing with a known third point (planted T = x(P3)),
        the univariate must split (or hit the documented ramified locus)
        with empirical rate 1.0 on the planted stream.
      pass_criterion: planted_split_rate == 1.0
      fail_disposition: invalid_or_failed_infrastructure
    - id: CTRL-NEG-UNIFORM-WINDOW
      statement: >-
        Uniform (x1,x2) membership in FB_W x FB_W without split conditioning
        matches (W_eff/p)^2 within absolute tolerance 0.02.
      pass_criterion: abs(uniform_window_rate - (W_eff/p)^2) <= 0.02
      fail_disposition: invalid_or_failed_infrastructure
    - id: CTRL-NEG-SHUFFLED-WINDOW
      statement: >-
        Split samples scored against a shuffled fake window of size W_eff
        match quasirandom within absolute tolerance 0.03.
      pass_criterion: abs(shuffled_rate - expected_shuffled) <= 0.03
      fail_disposition: invalid_or_failed_infrastructure
    - id: CTRL-IMON-PRODUCT-COVER
      statement: >-
        Borrowed instrument sanity from EXP-IMON-001: a product cover
        g2*g3 (deg 2 * deg 3) must be flagged non-full (no 5-cycle / no
        4+1 types in its factorization census). Ensures the factorization
        harness can detect non-full groups before trusting S_2 agreement.
      pass_criterion: flagged_non_full == true
      fail_disposition: invalid_or_failed_infrastructure
    - id: CTRL-IMON-RANDOM-DEG5
      statement: >-
        Random monic degree-5 polynomials match Chebotarev(S_5) rates for
        5-cycles (~0.2) and 4+1 (~0.25) within absolute tolerances 0.05
        and 0.06 respectively (EXP-IMON-001 pins).
      pass_criterion: flagged_full_consistent == true
      fail_disposition: invalid_or_failed_infrastructure
    - id: CTRL-J-EXCLUSION
      statement: >-
        Machine check that no curve with j in {0,1728} appears in
        random_ordinary_controls aggregates used for barrier tests.
      pass_criterion: j_exclusion_audit_pass
      fail_disposition: invalid
    - id: CTRL-S3-IDENTITY
      statement: >-
        Pinned S_3 coefficients satisfy >=3 independent point-addition
        identities (random points P,Q on E => S_3(x(P),x(Q),x(-P-Q)) == 0)
        before census admission.
      pass_criterion: identity_checks_passed >= 3
      fail_disposition: invalid_or_failed_infrastructure

  confounders:
    - id: CF-AUTO-J
      risk: Extra automorphisms at j=0/1728 distort cycle statistics.
      mitigation: Exclude from random controls; quarantine in artifact panel.
    - id: CF-CM-MIXING
      risk: Silently mixing CM curves into "generic" averages fakes exceptions or barriers.
      mitigation: Separate cm_exception_screen panel; never merge.
    - id: CF-DEG-DROP
      risk: Counting degree-drop fibers as inert/split biases Chebotarev residuals.
      mitigation: Separate degree_drop / ramified counters; report all four frequencies.
    - id: CF-NORM-S3
      risk: Wrong S_3 normalization invents fake monodromy signal.
      mitigation: CTRL-S3-IDENTITY + hash-pinned coefficient helper.
    - id: CF-IMPL-FACTOR
      risk: Buggy factorization invents exceptional locus.
      mitigation: Independent reverification on every exception candidate.
    - id: CF-M2-SHADOW
      risk: Reusing m=2 Legendre split census as if it were m=3 Semaev cover.
      mitigation: >-
        Primary metric MUST be factorization of S_3(x1,x2,T) in T, not
        Legendre(x^3+A*x+B). EXP-MONO-001 phase-1 is harness-only prior art.

  # ---------------------------------------------------------------------------
  # Claim boundaries (non-negotiable)
  # ---------------------------------------------------------------------------
  claim_boundaries:
    tier: toy
    bit_sizes: toy_Frobenius_census_primes_only
    allows:
      - >-
        Toy-scope census agreement with Chebotarev(S_2) within 3x Weil floor
        on pinned primes/curves (barrier-oriented calibration record).
      - >-
        Toy-scope positive exhibition of an exceptional locus with named
        curves, panels, and reverification receipts.
      - >-
        Feeding GOAL-ICEX-001 with an admissible relation-rate input package
        labeled by outcome (quasirandom+Weil vs family-specific deviant rate).
    forbids:
      - crypto_scale_monodromy_conclusions
      - asymptotic_barrier_theorem_from_toy_census_alone
      - treating_timeout_or_infra_failure_as_negative_evidence
      - counting_j0_or_j1728_as_generic_exceptional_locus
      - silent_upgrade_of_relation_proxy_to_attack_advantage
      - changing_hypothesis_or_goal_status_from_this_task
    full_monodromy_reading: >-
      FULL_MONODROMY_BARRIER_TOY is a barrier outcome for relation-rate
      attack content at the tested toy scope: Chebotarev forces quasirandom
      split rates up to the stated Weil error. It does not prove geometric
      monodromy equals S_2 for all ordinary curves at all primes.
    exceptional_locus_reading: >-
      EXCEPTIONAL_LOCUS_TOY narrows a positively exhibited family with
      deviant rates under controls. It does not imply a crypto-scale index
      calculus break and does not alone beat Pollard rho.

  # ---------------------------------------------------------------------------
  # Downstream feed into GOAL-ICEX-001
  # ---------------------------------------------------------------------------
  icex_feed:
    consumer_goal: GOAL-ICEX-001
    blocked_edge: >-
      GOAL-ICEX-001 remains blocked on GOAL-MONO-001 until a Coordinator
      ledger decision records one of the outcomes below with artifact hashes.
    outcome_packages:
      - outcome_id: FULL_MONODROMY_BARRIER_TOY
        relation_rate_input: >-
          Use quasirandom m=3 relation-rate proxy
          chebotarev_S2_split * (W_eff/p)^2 with additive Weil error envelope
          +/- 3 * (2/sqrt(p)) on the split factor (and independently recorded
          window-sampling error). Label as theorem-backed-at-toy-scope
          calibration, not as a crypto-scale rate law.
        attack_content: closed_at_toy_scope_for_exceptional_rate_sieves
      - outcome_id: EXCEPTIONAL_LOCUS_TOY
        relation_rate_input: >-
          Supply per-family measured split and joint_relation_proxy rates
          with confidence intervals from the exhibited curves only. Generic
          ordinary curves outside the locus continue to use the quasirandom
          package unless separately measured.
        attack_content: scoped_to_exhibited_family_only
      - outcome_id: SCOPED_PROTOCOL_NO_GO
        relation_rate_input: >-
          Do not mint a charged ICEX relation-rate pin. Propagate the named
          missing obligation; GOAL-ICEX-001 stays blocked on MONO.
        attack_content: undecided

  # ---------------------------------------------------------------------------
  # Discrimination (two-sided)
  # ---------------------------------------------------------------------------
  discrimination:
    hypothesis_A_full: >-
      Geometric monodromy is full S_2 on generic ordinary prime-order curves
      at toy primes; cycle-type census matches Chebotarev within 3x Weil.
      Meaning: barrier/calibration record; exceptional-rate attack content
      closed at tested scope.
    hypothesis_B_exceptional: >-
      An ordinary (non j=0/1728 artifact) locus has systematically deviant
      cycle-type densities beyond 3x Weil after reverification. Meaning:
      exceptional family for GOAL-ICEX family-specific rates; not a generic
      break.
    what_each_outcome_means:
      full_agreement: feed ICEX quasirandom+Weil package; archive barrier toy record
      exceptional_exhibition: feed ICEX family-specific rates; archive named locus
      control_failure: no mathematical monodromy claim; infra/invalid only

  falsification_conditions:
    - >-
      If random_ordinary_controls violate full_monodromy_test after
      reverification and CM/automorphism confounds are excluded, full-barrier
      reading is falsified at toy scope.
    - >-
      If every purported exception is either j in {0,1728}, supersingular,
      anomalous, normalization-buggy, or fails independent factorization
      reverification, exceptional-locus reading is falsified.
    - >-
      If CTRL-S3-IDENTITY or IMON factorization controls fail, the protocol
      instance is invalid — neither A nor B is supported.

  interpretation_limits:
    - Toy primes only; no extrapolation to 256-bit ECDLP.
    - deg_T=2 limits group-theoretic resolution to S_2 equidistribution vs deviant densities.
    - joint_relation_proxy_rate is a window proxy, not a full index-calculus campaign.
    - Phase-1 EXP-MONO-001 m=2 Legendre census is not evidence for m=3 monodromy.

  estimated_cost:
    implementation: medium
    compute: low
    wall_clock_seconds_estimate: 7200
    memory_gb_estimate: 2
    notes: >-
      Prior EXP-MONO-001 m=2 smoke was 0.285s; m=3 cubic factorization at
      pinned primes is estimated within campaign budget if quadratic
      discriminant path is used (avoid naive deg-5 product-control costs on
      the hot path).

  executor_gate_when_authorized:
    precondition: >-
      Independent red-team PASS on this protocol package AND Coordinator
      ledger authorization admitting a measurement task with its own
      write_scope. This review card never self-authorizes execution.
    first_command_template: >-
      python3 <authorized_impl> --primes 211 431 809 1601 --seed 20260725
      --samples 30000 --window 4 --m 3 --protocol-version MONO-m3-census-1.0.0-review
    required_artifacts:
      - machine-readable per-curve histograms and metrics listed above
      - panel assignments and j-exclusion audit
      - control pass/fail block
      - outcome_id in {FULL_MONODROMY_BARRIER_TOY, EXCEPTIONAL_LOCUS_TOY, SCOPED_PROTOCOL_NO_GO}
      - independent reverification receipts for every exception candidate

  completion_gate_self_check:
    - pins_curve_sampling: true
    - pins_cycle_type_histogram_metrics: true
    - pins_error_tolerance: true
    - pins_exception_screen: true
    - states_icex_feed_for_either_outcome: true
