  required_controls:
    - id: CTRL-CM-GATE-FULL
      status: REQUIRED_BEFORE_PASS
      what: >-
        FULL_MONODROMY_BARRIER_TOY (or any ICEX package that closes
        exceptional-rate sieve content) requires completed cm_exception_screen
        with ≥8 scored ordinary CM curves and no reverified CM exceptions, else
