    - id: CTRL-CM-ADMISSION
      status: REQUIRED_BEFORE_PASS
      what: >-
        CM panel admission override: drop prime-order requirement; keep
        ordinary / non-SS / non-anomalous; log order and CM label.
    - id: CTRL-CLAIM-WORDING
