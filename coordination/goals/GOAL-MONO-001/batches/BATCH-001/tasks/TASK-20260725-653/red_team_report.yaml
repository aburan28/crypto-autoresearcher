  falsification_axes:
    cm_automorphism_controls:
      result: PARTIALLY_FALSIFIED
      assessment: >-
        Aut(E)>{±1} quarantine is adequate: j∈{0,1728} excluded from
        random_ordinary_controls, isolated in automorphism_artifact_panel, and
        forbidden as sole exceptional-locus evidence (CTRL-J-EXCLUSION,
        CF-AUTO-J, claim_boundaries.forbids). CM screen exists as a separate
        panel (never_merge_into_random_controls) but is not a hard gate for
        FULL_MONODROMY_BARRIER_TOY, and inherits require_prime_order_group /
        admission_filters without an explicit ordinary-composite CM override —
        so the named KN-OPEN-009 exceptional family can be skipped via
        cm_screen_unavailable_at_prime while still minting FULL.
    full_vs_exceptional_claim_boundaries:
      result: FALSIFIED
      assessment: >-
        Discrimination narrative is two-sided and toy-scoped, and
        EXCEPTIONAL_LOCUS_TOY correctly demands positive exhibition with
        reverification. But FULL_MONODROMY_BARRIER_TOY + ICEX
        attack_content=closed_at_toy_scope_for_exceptional_rate_sieves overclaims
        relative to a random-panel-only census; Chebotarev "forces" /
        theorem-backed-at-toy-scope language treats the pinned 3×(2/√p)
        envelope as if it were an effective theorem for this cover. At p=211 the
        per-curve tolerance is ~0.413, nearly vacuous alone (multi-prime rule
        partially mitigates).
    present_tense_non_authorization:
      result: NOT_FALSIFIED
      assessment: >-
        status=review_only_freeze; authorization and design note forbid census
        execution; executor_gate_when_authorized requires red-team PASS plus
        separate Coordinator ledger authorization under a fresh write_scope;
        review PASS is explicitly not a monodromy/barrier/exception result.
        No measurement commands are authorized by this freeze.

  objections:
    - id: OBJ-653-1
      severity: blocking
      category: cm_gate_missing_for_full_barrier
      statement: >-
        barrier_aggregate_rule for FULL_MONODROMY_BARRIER_TOY requires random
        ordinary controls, no admitted exceptions, and instrument controls, but
        does not require a completed cm_exception_screen (≥8 scored CM curves,
        or an explicit SCOPED_PROTOCOL_NO_GO / qualified non-closure package).
        ICEX outcome_package for FULL nonetheless sets
        attack_content: closed_at_toy_scope_for_exceptional_rate_sieves.
        KN-OPEN-009 names CM curves as the canonical exceptional candidate;
        closing exceptional-rate content without screening that family is a
        claim-boundary failure.
      cheapest_mutation: >-
        Run (or simulate disposition of) a measurement that passes random-panel
        full_monodromy_test on ≥3 primes, leaves cm_screen_unavailable_at_prime
        on all primes, and mint FULL_MONODROMY_BARRIER_TOY. Under the frozen
        rule this is allowed and would feed ICEX a "closed" exceptional-rate
        package despite never scoring a CM curve.
      required_repair: >-
        Make completed CM screen a hard precondition for FULL, OR split the
        outcome into a random-panel-only calibration ID that does not close
        exceptional-rate ICEX content for unscored CM families, forcing
        SCOPED_PROTOCOL_NO_GO / qualified feed when CM screen is unavailable.

    - id: OBJ-653-2
      severity: blocking
      category: cm_panel_prime_order_conflict
      statement: >-
        curve_search.require_prime_order_group: true and global
        admission_filters apply to the sampling block that also defines
        cm_exception_screen. Small-discriminant CM curves over the pinned toy
        primes frequently lack prime-order groups; the card never states that
        the CM panel may admit ordinary non-prime-order curves for monodromy
        screening only. Combined with OBJ-653-1, this systematically pushes the
        protocol toward cm_screen_unavailable while still allowing FULL.
      cheapest_mutation: >-
        Attempt to populate cm_exception_screen under the written prime-order
        filter at p∈{211,431,809,1601}; expect empty/unavailable screen, then
        observe that barrier_aggregate_rule still permits FULL.
      required_repair: >-
        Explicitly override CM-panel admission: ordinary, non-supersingular,
        non-anomalous, allow composite order; keep prime-order restriction on
        random_ordinary_controls. Record order and CM discriminant/j in
        logging_required for the CM panel.

    - id: OBJ-653-3
      severity: major
      category: claim_boundary_overread
      statement: >-
        full_monodromy_reading states Chebotarev "forces" quasirandom split
        rates up to the stated Weil error, and ICEX FULL package labels the
        rate pin "theorem-backed-at-toy-scope calibration". Chebotarev
        equidistribution (KN-LIT-039) is theorem-backed; the specific envelope
        3·(2/√p) and the empirical census agreement are protocol pins / toy
        calibration, not an effective monodromy theorem for the Semaev cover.
      cheapest_mutation: >-
        Cite FULL_MONODROMY_BARRIER_TOY as a theorem-backed barrier for
        relation rates beyond the tested primes/curves; the card's forbids list
        blocks crypto-scale conclusions but the ICEX label still invites
        theorem-grade overread at toy scope.
      required_repair: >-
        Reword to empirical-census-agreement-within-pinned-envelope at tested
        toy primes; reserve "theorem-backed" for Chebotarev prediction 1/2
        alone. Prefer ICEX label like chebotarev_prediction_plus_toy_census_envelope.

  fatal_objections:
    - OBJ-653-1
    - OBJ-653-2

  residual_non_blocking:
    - id: RES-653-1
      severity: medium
      category: loose_weil_at_small_p
      note: >-
        At p=211, 3·(2/√p)≈0.413; per-curve full_monodromy_test is nearly
        vacuous. Multi-prime (≥3 sizes) and tighter floors at p=809/1601
        partially mitigate. Prefer requiring that barrier aggregates include at
        least one prime with 3·(2/√p)≤0.22 (already true if 809 or 1601 is used)
        as an explicit clause.
    - id: RES-653-2
      severity: low
      category: window_control_vacuity
      note: >-
        CTRL-NEG-UNIFORM-WINDOW tolerance 0.02 dwarfs (W_eff/p)^2≈(4/211)^2≈3.6e-4.
        Keep as smoke check; do not treat pass as strong quasirandom evidence.
    - id: RES-653-3
      severity: low
      category: s3_normalization_pin
      note: >-
        Reference S_3 still shows leading (x1-x2)^2 while text says clear it for
        monic-in-T form. Same roots when leading≠0; pin the exact monic helper
        hash in the executor card under CTRL-S3-IDENTITY.
    - id: RES-653-4
