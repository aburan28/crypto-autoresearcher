  review_plan:
    claim_under_review: Committed compact native source9a2e133099 implements the corrected
      pre-implementation contract and fixed control definitions; no concreteM8191
      or custody conclusion.
    coordinator_prior: Most arithmetic contract is expected to hold after focused
      tests; main risks are degree/action confusion, correlated replay, and supervisory
      or byte-binding edge cases.
    joints:
    - joint: arithmetic_and_primality
      assigned_to: TASK-20261016-3d848c
      attack_plan: Trace independent LL recurrence/count/digest and Cornacchia exact-root/remainder/square
        checks; challenge e11,e9,e2 and forged metadata without executing the target.
      breaking_artifact: An invalid degree/recurrence/norm certificate accepted or
        incomplete recurrence trusted.
    - joint: geometric_expression_and_exact_identity
      assigned_to: TASK-20261016-3d848c
      attack_plan: Check signed/unreduced coefficients, exact-Z coefficient verification,
        supplementary IDC semantics, exact domain and derivative/subgroup gates; trace
        alias a+n.
      breaking_artifact: Point action substituted for degree, modular identity mistaken
        for Z, or a false source/separability claim accepted.
    - joint: independent_group_replay
      assigned_to: TASK-20261016-3d848c
      attack_plan: Check arithmetic independence, fixed8-point coverage, beta/lambda
        full-point pairing, duals and alias behavior, infinity/sign/zero handling.
      breaking_artifact: Shared wrong producer path, incomplete point coverage, wrong
        pairing or invalid-point acceptance.
    - joint: resources_fresh_outputs_and_byte_binding
      assigned_to: TASK-20261016-3d848c
      attack_plan: Trace public supervisor worker path, positive RSS handshake, wall
        limits, missing-monitor behavior, terminal states, fresh output refusal and
        bounded same-byte parse/hash.
      breaking_artifact: Unmonitored mathematical work admitted, old outputs reused,
        missing terminal receipt treated as pass, or input hash of different parsed
        bytes.
    - joint: control_coverage_and_claim_limits
      assigned_to: TASK-20261016-3d848c
      attack_plan: Read public committed test definitions and exact implementation
        contract; distinguish trusted SEC2, theorem-level controls, fixed-point diagnostics
        and unverifiedM8191 instance.
      breaking_artifact: A required control absent/misinterpreted or source claims
        stronger than the implemented/checkable contract.
    blindness:
      mutual: true
      lifted_for: []
    proves_too_much:
      objects:
      - alpha+[n] subgroup-action alias
      - identity coefficient shifted by2^61-1
      - wrong beta/lambda pairing
      - e11 compositeM11
      - lost/zero RSS acknowledgement
      - existing output directory
      failure_signature: False certificate/resource claims reject while valid aliases
        are distinguished by recomputed geometric degree.
      assigned_to: TASK-20261016-3d848c
    blind_rederivation:
      required: true
      quantity: Implementation-level norm/recurrence/point and resource acceptance
        predicates from the pinned source.
      parameters: Pinned public source9a2e133099 and reviewed exact secp256k1 contract.
      blind_from:
      - Unpushed clean-retake raw payloads under clean-build-9a2e133099.
      - LiveP19250341 run outputs and terminal interpretation.
      assigned_to: TASK-20261016-3d848c
  return_format: Standalone correctness report and machine-readable attestation, temp-file
    writes only if needed for archival.
