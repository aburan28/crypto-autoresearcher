    verification_status: transcribed_not_recomputed
    material_gap: >-
      THE E-521 ROW CARRIES THE VERDICT AND NO GENERATION RULE. Curve1174,
      Curve25519, Curve41417, Ed448-Goldilocks, M-221, M-511, Curve383187 and
      BN(2,254) all carry an explicit rule paragraph on the same page; E-222,
      E-382, M-383 and E-521 carry the verdict alone. Moreover verify.sage does
      not compute rigidity at all - it reads the string from a file 'rigid' and
      sets saferigid := (rigid in {"fully rigid","somewhat rigid"}). The rigid
      cell is therefore an EDITORIAL LABEL, unreproducible by re-running the
      published script. Lane L07 treats it as a reconstruction target, not a
      reproduction target.

  - name: prime_certificate_pointer
    description: >-
      SafeCurves publishes, per curve, the complete list of proven primes needed
      for its analysis, generated as Pocklington proofs by verify.sage.
    provenance: M
    source_file: inputs/SAFECURVES-20260825/pages/primeproofs.txt
    source_sha256: 4b6c69f64451c946645513073feae6f89806f4c790715ded1a2c7b103545d549
    source_line_anchor: 'E-521 block, rows 3348-3603 (starts "2 3 5 7 ...", ends with the three 157-digit entries)'
    last_three_entries_match: >-
      The final three entries of the E-521 block are, in order, the subgroup
      order l, the twist prime l', and the field prime p as transcribed above.
    high_value_consequence: >-
      verify.sage's 'primes' input is documented (verify.txt rows 83-88) as "all
      prime divisors of p, the curve order p+1-t, the twist order p+1+t, and
      t^2-4p; and, RECURSIVELY, all prime divisors of q-1 for each q in the
      list". Since l divides p+1-t, every prime divisor of l-1 is in this list.
      THE FULL FACTORIZATION OF l-1 IS THEREFORE RECOVERABLE BY TRIAL DIVISION
      OF l-1 BY THE ~200 LISTED PRIMES, with no 519-bit factoring effort. This
      converts the exact-embedding-degree certificate of IDEA-20260807-98a970
      from "very likely out of reach at 521 bits" into a seconds-scale
      computation, and it is the single most consequential structural fact in
      this capsule.
    epistemic_note: >-
      The prime list is a HINT from a non-independent source. That does not
      weaken the resulting certificate: a factorization is self-certifying (
      re-multiply, then prove each factor prime), so the provenance of the
      candidate factors is irrelevant to the validity of the proof. What the
      hint's provenance does affect is COVERAGE - if the list is incomplete, the
      trial division leaves a residue > 1 and the lane falls back to a bound.
      That is a detectable, non-silent failure.

  # ------------------------------------------------------------------
  # 3. PREREGISTERED DERIVED CONSISTENCY RELATIONS (predictions, unverified)
  # ------------------------------------------------------------------
  derived_consistency_relations:
    status: >-
      PROVENANCE P. These are predictions this producer registers BEFORE any
      machine check, so that reproducing them is a controlled result rather than
      a retrospective rationalization. This producer has no Bash and ran no
      arithmetic tool; none of these has been evaluated here.
    relations:
    - id: R1
      statement: p + 1 - t == 4 * l
      why_it_matters: >-
        Ties the trace, the cofactor and the subgroup order into one identity.
        Failure means at least one of the three transcriptions is wrong.
    - id: R2
      statement: p + 1 + t == 4 * l_prime
      why_it_matters: same, for the twist.
    - id: R3
      statement: l + l_prime == 2^520
      derivation: R1 + R2 give 4(l + l') = 2(p+1) = 2^522.
      why_it_matters: >-
        A one-line check with no large arithmetic. It is consistent by
        inspection with the published sparse forms l = 2^519 - X and
        l' = 2^519 + X for the SAME 78-digit X =
        337554763258501705789107630418782636071904961214051226618635150085779108655765,
        and it is the cheapest possible cross-page consistency test between
        base.txt and twist.txt.
    - id: R4
      statement: t == 2 * (l_prime - l) == 4 * X
      predicted_value: '1350219053034006823156430521675130544287619844856204906474540600343116434623060'
      why_it_matters: >-
        Predicts the disc.txt trace from the base.txt and twist.txt orders
        alone, across three separately hashed files. This producer asserts the
        predicted value as a PREDICTION only; it must be produced by machine
        before it counts as agreement.
    - id: R5
      statement: t^2 - 4p == D * s^2 for some integer s, with D squarefree-adjusted per disc.txt rows 57-60
      why_it_matters: >-
        Recovers the conductor s, which no SafeCurves page publishes and which
        additional diagnostic D5 requires.
    - id: R6
      statement: floor(10 * log2(0.886 * sqrt(l))) / 10 == 259.3
      why_it_matters: reproduces the published rho cell from l with exact integer arithmetic.
    - id: R7
      statement: x1^2 + y1^2 - 1 - d*x1^2*y1^2 == 0 (mod p), with d = -376014
      why_it_matters: >-
        The base-point-on-curve check, and simultaneously the sign-convention
        test for d. With d = +376014 it must FAIL; a lane that passes under both
        signs has a bug.
    - id: R8
      statement: l * (x1, y1) == (0, 1) under the complete Edwards addition law
      why_it_matters: order of the base point; the identity of a complete Edwards curve is (0,1), not a point at infinity.
    - id: R9
      statement: p mod 4 == 3
      why_it_matters: >-
        p = 2^521 - 1 gives p = 3 mod 4. This makes square roots a single
        exponentiation a^((p+1)/4), which every lane's field arithmetic depends
        on, and it also makes E-521 a CANDIDATE for Elligator 1 (ind.txt rows
        78-83 require p = 3 mod 4 and 4 | group order, both of which hold),
        even though the published ind cell mentions only Elligator 2. Diagnostic
        D9 tests the remaining Elligator 1 condition.

