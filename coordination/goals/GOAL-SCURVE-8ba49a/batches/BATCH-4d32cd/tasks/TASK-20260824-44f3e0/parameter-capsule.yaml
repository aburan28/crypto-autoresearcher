  # ------------------------------------------------------------------
  # 7. WHAT THIS CAPSULE DOES NOT ESTABLISH
  # ------------------------------------------------------------------
  limitations:
  - No value in this capsule was computed, recomputed, or checked by this
    producer. Every entry is a transcription or a prediction.
  - The mirror and the intake are not independent, so the zero-conflict result
    is a transcription check and carries no evidential weight about the curve.
  - No standards document available here contains E-521, so "authoritative
    source" reconciliation is currently unsatisfied and depends on U-04.
  - Reading a threshold or a published cell permits ADJUDICATION; it asserts
    nothing about the curve. No criterion is confirmed, denied, or ranked here.
  - No attack of any kind was run, designed to be run in this task, or implied.
