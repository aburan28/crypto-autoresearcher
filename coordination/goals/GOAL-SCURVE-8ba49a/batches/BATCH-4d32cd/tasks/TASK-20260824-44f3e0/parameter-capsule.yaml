  - id: U-02
    target: 'SafeCurves per-curve data directory curve/e521/ (files p, l, x0, y0, x1, y1, shape, d, primes, rigid)'
    why_needed: >-
      verify.sage consumes x0,y0 - a generator of the ENTIRE curve group - and
      writes verify-cofactorbase01 := (((p+1-t)//l) * (x0,y0) == (x1,y1)). No
      staged page publishes x0 or y0 for any curve. Lane L03 therefore cannot
