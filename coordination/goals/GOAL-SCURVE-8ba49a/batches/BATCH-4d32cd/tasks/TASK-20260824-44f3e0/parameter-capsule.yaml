  # ------------------------------------------------------------------
  # 5. CONFOUNDERS AT THE PARAMETER LEVEL
  # ------------------------------------------------------------------
  confounders:
  - id: C1
    name: E-521 is not NIST P-521 / secp521r1
    detail: >-
      SEC 2 v2 contains section 2.6 "Recommended 521-bit Elliptic Curve Domain
      Parameters" / secp521r1 (inputs/SAFECURVES-20260825/specs/sec2-v2.txt,
      sha256 579265ec54e2ed9d77ec85929da3cc130d2997f6acb2ccada17dfa812af1daeb,
      rows 112, 119, 828, 1048), and FIPS 186-5 / SP 800-186 specify P-521.
      Those curves are short Weierstrass with a = -3 and are DIFFERENT CURVES,
      even where the field prime coincides. An executor that resolves "521" to
      the NIST curve will produce a coherent-looking but wrong dossier.
    detection: >-
      Any lane returning cofactor 1, torsion counts 0/0, or a Montgomery-ladder
      verdict of False is describing P-521, not E-521.
  - id: C2
    name: E-521 appears in NO staged standards document
    detail: >-
      A literal search of the staged specs/ directory for "E-521", "E521" and
      "376014" returns zero matches in fips186-5, sp800-186, sec2-v1, sec2-v2,
      rfc5639, rfc5903 and rfc7748. E-521 is not a standardised curve in any
      document available here.
    scope_limit: >-
      This is a STRING-LEVEL ABSENCE CHECK over a fixed, small document set, two
      of which have lossy prose extraction. It is not a claim that no standard
      anywhere specifies E-521.
    consequence: >-
      The "authoritative source" leg of the goal's completion criterion cannot be
      satisfied from the staged specs. It must come from U-04 (the IETF draft) or
      from recomputation. Recorded as an open pause-condition risk.
  - name: C3 sign of d
    detail: see parameters[d].sign_convention_warning.
  - name: C4 which order
    detail: >-
      Group order is 4l; the ECDLP-relevant order is l. Embedding degree,
      rho cost and transfer checks all use l, never 4l. Mixing them produces
      wrong-by-a-factor-of-4 costs and a meaningless ord computation.
  - name: C5 derived trace
    detail: see parameters[trace_t].derivation_route_in_source. Reproducing t from l is not a point count.

