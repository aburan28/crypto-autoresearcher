  # ------------------------------------------------------------------
  # MANDATORY STATEMENT
  # ------------------------------------------------------------------
  no_attack_statement: >-
    NO CURVE ATTACK WAS RUN. No experiment was executed, no experiment result was
    created, no run record was produced, and no hypothesis status was changed.
    This task produced planning records only. NO SAFETY OR VULNERABILITY
    CONCLUSION IS MADE OR IMPLIED: this report does not state that E-521 is safe,
    unsafe, vulnerable, or free of vulnerabilities, and the audit plan forbids
    any lane from doing so (audit-plan global_gates G3). No live private key was
    tested, requested, stored, or derived; only public named-curve parameters and
    generated controls appear anywhere in these artifacts.

  # ------------------------------------------------------------------
  # COMPLETION GATE
  # ------------------------------------------------------------------
  completion_gate:
  - item: >-
      The parameter capsule distinguishes user intake from retrieved primary or
      authoritative sources and records provenance and unresolved conflicts.
    met: true
    evidence: >-
      parameter-capsule.yaml section 1 defines three source classes (intake /
      staged_mirror / unretrieved) with a per-field provenance legend (I / M / P).
      Every one of the 19 parameter entries carries provenance, source file, file
      sha256 and a row anchor, plus verification_status
      "transcribed_not_recomputed". Section 4 gives the cell-by-cell intake
      comparison; section 6 lists five unretrieved sources U-01..U-05 with exact
      failure modes.
  - item: >-
      The audit plan covers every one of the eleven criteria in the declared
      category, with a certificate or explicit bound, controls, falsifier,
      budget, and stopping rule.
    met: true
    evidence: >-
      Lanes L01 field, L02 equation, L03 base (basic_parameter_requirements);
      L04 rho, L05 transfer, L06 disc (ecdlp_security_requirements); L07 rigid,
      L08 ladder, L09 twist, L10 complete, L11 ind (ecc_security_beyond_ecdlp) -
      matching the goal's criterion_categories exactly and in the declared
      criterion_order. Each lane carries mechanism, quantitative_prediction,
      discriminates, certificate (or a costed bound), the three controls, budget,
      stopping_rule, falsifier and limitation. L07 is the one lane with a
      deferred component; it carries a named obstruction, a concrete successor
      condition, and a runnable part that is fully specified.
  - item: >-
      The plan covers every declared additional diagnostic, or records a concrete
      reason and successor condition for a deferred diagnostic.
    met: true
    evidence: >-
      D1 order factorizations; D2 subgroup/cofactor/invalid-curve confinement;
      D3 automorphism- and endomorphism-adjusted rho; D4 embedding degree
      (covered by L05 as declared reuse of IDEA-20260807-98a970, not duplicated);
      D5 CM discriminant and conductor; D6 model-conversion exceptional sets;
      D7 scalar and multiscalar formula exceptional cases; D8 deterministic
      parameter-generation transcript. All eight declared diagnostics are
      present. D8 (and the shared part of L07) is PARTIALLY DEFERRED with the
      concrete reason "SEA point counting unavailable under environment
      assumption E1; the elementary alternative costs about 2^130 per candidate"
      and the successor condition "a Coordinator-scoped dependency task providing
      PARI/GP or Sage, plus retrieval U-04/U-05". One additional diagnostic, D9
      (Elligator 1 eligibility), is added under the goal's explicit provision
      that the declared list is non-exhaustive.
  - item: >-
      Positive, parameter-matched negative, and same-shape null controls are
      explicit and run before belief in any later task.
    met: true
    evidence: >-
      audit-plan section 3 freezes five positive controls (POS-1 Anomalous,
      POS-2 BN(2,254), POS-3 NIST P-224, POS-4 brainpoolP256t1, POS-5 the three
      generated toy curves reused from IDEA-20260807-98a970), three
      parameter-matched negatives (NEG-1 Ed448-Goldilocks, NEG-2 Curve41417,
      NEG-3 E-382) each with its matching assumptions declared explicitly
      including what is NOT matched, and four same-shape nulls (NULL-1 random-d
      twin over the same prime 2^521-1, NULL-2 wrong-curve prime list, NULL-3
      the Artin-density ensemble, NULL-4 the Hasse-interval trace ensemble).
      Global gate G0 makes the control suite BLOCKING and ordered strictly before
      any E-521 cell is believed, and states that a failed positive voids every
      E-521 result from that lane. Every control expectation is frozen in this
      record before any run.
  - item: >-
      The report states that no curve attack ran and makes no safety or
      vulnerability conclusion.
    met: true
    evidence: the no_attack_statement block above.

  # ------------------------------------------------------------------
  # CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ------------------------------------------------------------------
  intake_vs_retrieved_conflicts:
    count: 0
    detail: >-
      The intake equation string, modulus, three-team attribution, expected_safe
      value and all eleven expected_criteria cells match the staged mirror
      index.txt (sha256 830355b638e713f4f99da62970e63e606e32c0f25f62af12a5aef4c4570c9e4e)
      character for character in the compared fields.
    MANDATORY_QUALIFICATION: >-
      THIS ZERO IS NOT CORROBORATION AND MUST NOT BE REPORTED AS SUCH. E-521 was
      introduced in the SafeCurves work itself (index.txt attributes it to
      Bernstein-Lange and two independent teams; SafeCurves is authored by
      Bernstein and Lange), and the intake table is itself a transcription of the
      SafeCurves index table. The mirror and the intake are therefore NOT
      INDEPENDENT SOURCES, and their agreement is a TRANSCRIPTION CHECK AND
      NOTHING MORE. Zero conflicts means "the intake was copied correctly". It
      means nothing whatsoever about the curve, and no criterion cell has been
      verified by anyone in this program.
  unresolved_source_issues:
  - id: X1
    issue: >-
      No independent or authoritative source for the E-521 tuple was obtained.
      A literal search of the staged specs (fips186-5, sp800-186, sec2-v1,
      sec2-v2, rfc5639, rfc5903, rfc7748) for "E-521", "E521" and "376014"
      returns zero matches; E-521 is not standardised in any document available
      here.
    consequence: >-
      The goal completion criterion "reconcile the exact parameter tuple to
      retrieved primary or authoritative sources" is CURRENTLY UNSATISFIED on the
      independence leg. This is adjacent to goal pause_conditions[2] ("Primary or
      authoritative sources leave an unresolved conflict in the named curve's
      parameter tuple") - though strictly that condition speaks of a CONFLICT and
      what exists here is an ABSENCE, so this producer flags it for Coordinator
      adjudication rather than asserting the pause condition is triggered.
    remedy: successor handoff S1 below.
  - id: X2
    issue: >-
      x0, y0 - a generator of the entire curve group, consumed by verify.sage to
      check ((p+1-t)//l)*(x0,y0) == (x1,y1) - are published on no staged page.
    consequence: lane L03 covers the base cell only partially and reports that sub-check as UNRESOLVED.
    remedy: successor handoff S2 below.
  - id: X3
    issue: >-
      The rigid cell is not computed by SafeCurves' own script (verify.sage reads
      a file and sets saferigid := rigid in {"fully rigid","somewhat rigid"}), and
      the E-521 row on rigid.html carries the verdict with NO generation rule,
      unlike eight other rows on the same page.
    consequence: >-
      The rigid cell is not reproducible by re-running the published procedure.
      This is a documented, cited property of the SOURCE. It is not a criticism
      of the curve and, per goal claim_boundaries[1], a rigidity failure would
      not be an ECDLP break even if one were established.
    remedy: successor handoffs S1 and S3 below.

  # ------------------------------------------------------------------
  # LIMITATIONS OF THIS TASK
  # ------------------------------------------------------------------
  limitations:
  - This producer computed nothing. It has no Bash and ran no arithmetic tool.
    Every numeric value in the capsule is a transcription from staged text or a
    preregistered prediction, and every relation R1-R9 is unverified.
  - The staged mirror was retrieved by the orchestration session, not by this
    producer. It is cited as "retrieved (staged mirror SAFECURVES-20260825)" with
    per-file sha256 for exactly that reason.
  - No WebFetch call was made. Under the confirmed defect recorded in the
    retrieval briefing and in inputs/SAFECURVES-20260825/source_record.yaml,
    WebFetch returns a small-model summary that corrupts numeric data, and
    safecurves.cr.yp.to returns 502 through it regardless. One WebSearch was made
    for prose pointers only (successor target U-04); no digit from it is used
    anywhere, and its snippet is not treated as a source.
  - Sibling GOAL-SCURVE-* campaigns exist with parallel artifacts for other
    curves. This producer did not read them - the handoff read_scope lists only
    this goal's three ledger records - and therefore cannot and does not assert
    that these lanes are free of duplication with a sibling task.
  - Budget and cost figures in the audit plan are ESTIMATES under environment
    assumption E1, not measurements. If E1 is wrong the plan changes, and the
    Executor is required to record what was actually available.
  - The plan claims no attack, moves no exponent, and its sota_delta against
    every attack baseline is exactly zero on time, memory and data.

  # ------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (Coordinator decides; this is not an assignment)
  # ------------------------------------------------------------------
  proposed_successors:
  - id: S1
    priority: highest
    role: infrastructure / orchestration (not a research role)
    request: >-
      Stage, by curl with per-file sha256 exactly as SAFECURVES-20260825 was
      staged, the draft-barreto-E-521 IETF draft source
      (https://github.com/hyperelliptic/draft-barreto-E-521) and, if resolvable,
      the three 2013 design write-ups named by author and year in index.txt rows
      371-373.
    why: >-
      This is the only identified route to a reading of the E-521 tuple authored
      outside the SafeCurves site, which is what issue X1 requires and what the
      goal's first completion criterion asks for. It would also supply the
      designers' stated generation rule, which is what X3 lacks.
  - id: S2
    priority: high
    role: infrastructure / orchestration
    request: >-
      Extend the mirror with https://safecurves.cr.yp.to/curve/e521/ (files p, l,
      x0, y0, x1, y1, shape, d, primes, rigid) and the proof/<prime>.html
      Pocklington pages for the E-521 prime list.
    why: closes X2 and lets lane L03 cover the base cell completely; also gives an independent transcript of the primality proofs.
  - id: S3
    priority: medium
    role: coordinator decision then executor
    request: >-
      A dependency task establishing PARI/GP or Sage in the execution
      environment, which converts lane L07 and diagnostic D8 from DEFERRED to
      RUNNABLE (the |d|-minimality sweep).
    why: the only named obstruction in the plan is the absence of SEA point counting; the deferral is environmental, not mathematical.
  - id: S4
    priority: high
    role: executor
    request: >-
      Implement and run the audit plan in the order given by
      priority_ranking, gating on G0. First deliverable is the G0 control suite
      result; second is lane L05 with its certificate and NULL-3.
    why: L05 is the cheapest valid discriminator and discharges H1, which unlocks the exact certificates for L03, L09 and D1.
  - id: S5
    priority: medium
    role: coordinator
    request: >-
      Adjudicate deduplication against the sibling GOAL-SCURVE-* campaigns, which
      this producer was scope-barred from reading.

  # ==================================================================
  # HONEST-ACCOUNTING BLOCK (docs/inventor-protocol.md section 5)
  # ==================================================================
  honest_accounting:
    objects_considered:
    - id: O1
      object: 'the pair (l, ord_l(p))'
      lossy_projection_test: PASSES - constant under F_p-isogeny, maps to k/gcd(k,m) under base change, must be recomputed on a different subgroup; discard compatible with all three.
      status: REUSED from IDEA-20260807-98a970, not claimed as new.
      how_far_it_survives: every isogeny, every model change, every coordinate system; dissolves only when the base field or the subgroup changes.
    - id: O2
      object: 'the 2-primary torsion profile (#E[2](F_p), #E[4](F_p)) with the cofactor'
      lossy_projection_test: PASSES - preserved exactly under every F_p-isomorphism hence under the whole Edwards/Montgomery/Weierstrass chain; constrained under quadratic twist; dissolves under a 2-isogeny, which is a sharp and stated boundary.
      status: NOT NEW as mathematics (it is what verify.sage's numorder2/numorder4 already compute). NEW WITHIN THIS PLAN as a framing: naming it makes visible that ladder, complete and ind are three readings of ONE object, so one miscount corrupts three cells together and one control set covers all three.
      how_far_it_survives: all model conversions and coordinate systems; one 2-isogeny.
    - id: O3
      object: 'the rank of d = -376014 in the |d|-ordered enumeration under the claimed generation rule'
      lossy_projection_test: FAILS, and is declared as failing. It is lossy but what it discards is not discarded compatibly with any operation of the target - no group law, isogeny or model change acts on a position in a designer's search order.
      status: reclassified as a PROVENANCE STATISTIC, not a tracked object; lane L07 is labelled a reconstruction audit accordingly.
    dominated_by:
      as_attack: 'n/a (no result claimed). No attack is proposed, so this work sits on no attack frontier.'
      as_audit_instrument: >-
        DOMINATED BY verify.sage, SafeCurves' own published script (transcribed
        in full at inputs/SAFECURVES-20260825/pages/verify.txt, sha256
        9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79, rows
        106-482). It computes all eleven cells, has been run on twenty curves,
        carries authority this plan does not, and produced the very numbers this
        plan proposes to check. Checked against every row of the attack frontier
        this producer could name - rho at 0.886*sqrt(l) with O(1) memory; BSGS at
        sqrt(l)/sqrt(l); automorphism-discounted rho at small |D|; MOV/Frey-Ruck
        at small k; the anomalous additive transfer - this work improves none of
        them.
      what_this_plan_dominates_it_on: >-
        Exactly three axes and no others. (1) It runs without Sage under
        environment assumption E1, which verify.sage cannot. (2) It adds
        preregistered positive, parameter-matched negative and same-shape null
        controls; verify.sage has none, and the nulls are what separate a
        DESIGNED cell from a FREE one - on present analysis NULL-1 is expected to
        pass field, equation, rho, disc, ladder, complete and ind, which would
        mean seven of the eleven cells carry little or no information about the
        designers' care. (3) It adds nine diagnostics that verify.sage does not
        compute, three of which (D6, D7, D9) are outside its scope entirely.
    sota_delta:
      against_attack_baselines: 'ZERO on every axis - time exponent, memory exponent, data/queries. No exponent is moved for any problem.'
      as_data: >-
        This program's corpus currently holds ZERO certified SafeCurves criterion
        cells for E-521, and per IDEA-20260807-98a970's own novelty screen zero
        embedding-degree values or bounds for any named deployed curve. Executing
        this plan would produce 11 criterion rows and 9 diagnostic rows for one
        curve, each with a certificate or a costed bound, plus a 12-point control
        matrix.
      the_one_quantitative_move: >-
        An EXACT embedding-degree certificate at a 519-bit subgroup order, which
        IDEA-20260807-98a970 assigned only 0.35 prior probability of being exact
        at all and singled out 521-bit rows as "very likely out of reach". The
        route: verify.txt rows 83-88 document that the SafeCurves 'primes' input
        contains, recursively, all prime divisors of q-1 for each prime q in the
        list, and l divides the curve order, so every prime divisor of l-1 is in
        the published E-521 list. Trial division by roughly 200 primes replaces a
        519-bit factorization. Estimated cost drops from "infeasible in pure
        Python" to about 120 CPU-seconds including all controls. THIS IS AN
        AUDIT-COST DELTA, NOT AN ATTACK DELTA, and it is the single most
        consequential structural observation in this task.
    closures_enumerated:
    - closure: 'The |d|-minimality component of the rigidity criterion (lane L07, diagnostic D8) is CLOSED IN THIS ENVIRONMENT.'
      mechanism_of_the_obstruction: >-
        Deciding whether a candidate d qualifies requires the order of a curve
        over a 521-bit prime field. Under environment assumption E1 (pure Python,
        no Sage, no PARI) no SEA implementation is available, and the elementary
        alternative - baby-step giant-step over the Hasse interval - costs about
        p^(1/4) = 2^130 group operations PER CANDIDATE, with up to 376014
        candidates to test.
      argument: >-
        The obstruction is environmental and exact, not a fatigue report: the
        cost is a computable number, it exceeds any available budget by more than
        a hundred orders of magnitude, and it is removed entirely by installing
        one dependency.
      classes_that_remain: >-
        (a) with SEA, the full sweep is hours - successor S3; (b) the base-point
        rule (is y1 = 12 the smallest qualifying y) IS checkable now and is in
        the runnable part of L07; (c) the designers' STATED rule may exist in an
        unretrieved source - successor S1; (d) the family-wide-versus-E-521-
        specific question about missing rule text is checkable now via NEG-3.
      forward_guidance: run (b) and (d) in this batch; queue (a) and (c).
    - closure: 'No independent or authoritative parameter source for E-521 is reachable from the currently staged corpus.'
      mechanism_of_the_obstruction: >-
        E-521 is not standardised in any staged specification document (zero
        matches for "E-521", "E521" and "376014" across all seven staged specs),
        and the only staged source that describes it is the SafeCurves site,
        which is not independent of the intake.
      argument: >-
        This is a coverage statement about a named, finite document set, stated
        as such, not a claim that no such source exists anywhere. It is precisely
        the kind of "the search has not found it" statement that must not be
        promoted to "it is not there".
      classes_that_remain: the IETF draft (S1); the three design write-ups (S1); recomputation from p and d alone, which is what the eleven lanes do and which is the only route fully under this program's control.
      forward_guidance: S1 first; but note that recomputation is strictly stronger than any citation and does not depend on S1 succeeding.
    premature_closure_check: >-
      This task declined nothing on saturation grounds. Every one of the eleven
      criteria received a full lane, including the seven that NULL-1 is expected
      to pass and that are therefore near-certain to reproduce; those are kept as
      tripwires for the sign-of-d and wrong-l defects and are labelled as such,
      not dropped as boring. One additional diagnostic (D9) was ADDED beyond the
      declared list. The single closure claimed is environmental, carries a named
      obstruction with an exact cost, and names four remaining classes.
    open_directions_for_next_session:
    - Execute G0 then L05; the exact-k certificate is the highest information-per-second item in the plan and its NULL-3 companion is what stops it from being over-read.
    - Resolve S1. Independence, not computation, is this goal's binding constraint.
    - Measure NULL-1 across all eleven lanes and publish the DESIGNED-versus-FREE
      split. If the preregistered expectation holds and seven cells are free, that
      is a reusable structural result about the SafeCurves criteria themselves and
      is a knowledge-promotion candidate independent of E-521.
    - D9 (Elligator 1 eligibility) has two live outcomes and no preregistered
      direction; it is the cheapest genuinely open question in the plan.
