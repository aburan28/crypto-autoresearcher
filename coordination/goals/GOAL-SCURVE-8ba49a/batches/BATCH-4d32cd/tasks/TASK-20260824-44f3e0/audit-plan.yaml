    controls: {positive: POS-1/POS-2/POS-3 must all return False on the same path, negative: NEG-1 and NEG-2 must return True, 'null': NULL-1 random-d twin returns True as well - free given the shape}
    budget: 30 CPU-seconds
    stopping_rule: stop at 300 s; UNRESOLVED.
    falsifier: 'either condition failing; or j == 1728 or 0 (which would also disturb D3); or a positive control returning True.'
    limitation: >-
