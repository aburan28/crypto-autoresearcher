  # ==================================================================
  # 5. DECLARED ADDITIONAL DIAGNOSTICS
  # ==================================================================
  diagnostics:

  - id: D1
    declared_as: complete curve and twist order factorization with checkable certificates
    mechanism: >-
      Factor #E = p+1-t = 4l and #E^t = p+1+t = 4l' completely; emit Pratt/
      Pocklington certificates for l, l' and 2. Re-multiply to confirm.
    prediction: '#E == 2^2 * l and #E^t == 2^2 * l\'; both l and l\' prime; no other factor.'
    discriminates: 'both orders are 4*prime as designed, versus a hidden small factor that the published cofactor cell would have masked.'
    certificate: two factor multisets plus two Pratt certificates; verification in tens of exponentiations.
    controls: POS-1 (order = p, prime, cofactor 1), NEG-1, NULL-1 (generically not 4*prime)
    budget: 60 s; stopping_rule stop at 600 s -> UNRESOLVED
    falsifier: a residual factor after dividing by 4l; l or l' composite.
    limitation: certifies the factorization only; implies nothing about DLP hardness beyond what rho already models.

  - id: D2
    declared_as: subgroup, cofactor, and invalid-curve confinement costs
    mechanism: >-
      From h = 4 and h' = 4: bound the small-subgroup leak at log2(h) = 2 bits
      when the scalar is not cofactor-cleared, and at 0 bits when it is
      (twist.txt rows 61-89). Enumerate the confinement set for a single-
      coordinate ladder: an x not on the curve lies on the quadratic twist and
      nowhere else (twist.txt rows 164-190), so the invalid-curve attack surface
      is exactly two isomorphism classes. Quantify the residual kangaroo speedup
      sqrt(h) = 2. Cross-check against the L09 combined cost.
    prediction: 'leak <= 2 bits; confinement set size exactly 2 (curve and twist); residual speedup factor exactly 2; consistent with the 1.0-bit gap between 2^259.3 and 2^258.3.'
    discriminates: >-
      (a) cofactor 4 on BOTH sides makes the ladder attack surface closed and
      cheap to reason about, versus (b) the twist cofactor hides additional small
      primes that would widen the surface - which is exactly what makes
      brainpoolP256t1 (POS-4) cost 2^44.5.
    certificate: the two cofactor factorizations from D1 plus the arithmetic; trivially re-verified.
    controls: POS-4 (wide surface), POS-3, NEG-1, NULL-1
    budget: 10 s; stopping_rule stop at 60 s -> UNRESOLVED
    falsifier: cofactor or twist cofactor not exactly 4; the reconciliation with L09 differing by more than 0.05 bits.
    limitation: a parameter-level cost bound. It models no implementation and is not a statement that any implementation is or is not affected.

  - id: D3
    declared_as: automorphism- and endomorphism-adjusted rho cost
    mechanism: >-
      Compute the j-invariant exactly. Determine #Aut(E) over F_p: 2 unless
      j == 0 (6) or j == 1728 (4). Check whether |D| admits any small-degree
      endomorphism usable as a GLV-style speedup - with |D| ~ 2^520.9 and the
      5-prime factorization from L06, the smallest endomorphism degree is
      governed by the smallest norm in the order, which is astronomically large.
      Recompute the rho cost with the equivalence-class discount sqrt(#Aut)
      already partly present in the 0.886 = sqrt(pi/4) negation constant, and
      state the total honestly.
    prediction: >-
      j not in {0, 1728}; #Aut == 2; NO additional discount beyond the negation
      already folded into 0.886; adjusted rho cost remains 2^259.3, and even
      granting a hypothetical unfound factor-2 class structure it stays above
      2^258.8.
    discriminates: >-
      (a) E-521 has no exploitable extra automorphism or small-degree
      endomorphism, so the published rho cell needs no adjustment - versus (b) it
      does, as secp256k1 (D = -3, GLV) and BN(2,254) do. POS-2 and a generated
      j == 0 control are the (b) side and must show the discount.
    certificate: the exact j-invariant, #Aut, and the arithmetic of the discount; milliseconds.
    controls: POS-2 BN (D = -3) and a generated j == 0 curve must both show the sqrt(6)-class discount; NEG-1 Ed448 must show none; NULL-1 must show none.
    budget: 30 s; stopping_rule stop at 300 s -> UNRESOLVED
    falsifier: 'j == 0 or 1728; or a small-norm element found in the order of D; or the control curves failing to show their discount (instrument void).'
    limitation: >-
      Covers automorphism-class and CM-endomorphism discounts only. It does not
      survey every published rho refinement, and disc.txt rows 336-347 caution
      that the limits of small-|D| speedups are "reasonably well understood" -
      inherited as an assumption, not proven here.

  - id: D4
    declared_as: embedding-degree certificate or explicit search bound
    status: COVERED BY L05 - NOT DUPLICATED
    reuse_declaration: >-
      Delivered by lane L05, which is the E-521 specialization of
      IDEA-20260807-98a970. Per RQ-SCURVE-3f11a5 internal_dependency
      nonduplication_rule, no separate mechanism proposal is minted, and the
      certificate formats, the three degenerate flags and the representability
      wall are taken from that record unchanged.
    delta_over_that_record: >-
      One row (E-521) rather than a table; and the exact-k route is expected to
      SUCCEED at 519 bits, which that record explicitly did not expect, because
      the factorization of l-1 is recoverable from the published prime list
      rather than by factoring.

  - id: D5
    declared_as: CM discriminant and conductor structure
    mechanism: >-
      From L06's t and D, recover the conductor s with D*s^2 == t^2-4p (relation
      R5) and factor s. Report the order Z[(D+sqrt(D))/2] and its index in the
      maximal order. Record a GRH-conditional class-number scale h ~ sqrt(|D|)
      (disc.txt rows 354-363 attribute this to GRH) as a HEURISTIC statement,
      clearly labelled, and compare against Brainpool's h > 10^6 requirement to
      show the SafeCurves |D| > 2^100 requirement subsumes it.
    prediction: 's is recovered exactly and is small (the transcribed D is close to |t^2-4p| in magnitude, ~2^520.9 against ~2^523, so s is on the order of 2^1); h ~ 2^260 under GRH, exceeding 10^6 by ~2^240.'
    discriminates: '(a) a generic non-CM curve with tiny conductor, versus (b) a CM-constructed curve with a designed order. POS-2 BN (D = -3) is the (b) side.'
    certificate: the exact s with its factorization and the identity D*s^2 == t^2-4p; one multiplication to check.
    heuristic_flag: 'the class-number estimate is GRH-conditional and is reported as a heuristic scale, never as a computed class number. Computing h(D) exactly for |D| ~ 2^520.9 is out of scope and is stated as such.'
    controls: POS-2, NEG-1, NULL-4
    budget: 30 s; stopping_rule stop at 300 s -> UNRESOLVED
    falsifier: no integer s satisfying R5; or s large, which would contradict the transcribed magnitudes.
    limitation: no exact class number, no class-group structure, no CM-method reconstruction of the curve.

  - id: D6
    declared_as: model-conversion exceptional sets
    mechanism: >-
      Enumerate exactly where each birational map in the chain
      Edwards -> Montgomery -> short Weierstrass is undefined.
      For x = u/v, y = (u-1)/(u+1) inverted as u = (1+y)/(1-y), v = u/x, the map
      fails at y == 1 and at x == 0. On x^2+y^2 = 1+dx^2y^2, y == 1 forces
      x^2(1-d) == 0 hence x == 0 (d != 1 by L02), so both failures collapse to
      x == 0, i.e. the points (0,1) and (0,-1). Verify by exhaustive solution of
      the two equations, then round-trip 10^4 random points through the full
      chain and back and require exact identity.
    prediction: 'the exceptional set has size EXACTLY 2, consisting of the identity (0,1) and the unique point of order 2 (0,-1) - which ties it directly to the O2 count numorder2 == 1 from L10; round-trip identity holds on 10^4/10^4 random points.'
    discriminates: >-
      (a) the exceptional set is exactly the 2-torsion-plus-identity, so H6 is
      safe away from a 2-element set of measure 2/(4l), versus (b) a larger
      exceptional set exists and the three O2-driven cells (ladder, complete,
      ind) inherit an unstated caveat.
    certificate: the explicit 2-element list with the algebra, plus the round-trip counter; re-verified in seconds.
    controls: 'positive - a deliberately degenerate d == 1 fixture must make the map undefined everywhere and the pipeline must say so; negative - NEG-1 Ed448 must give the same 2-element set; null - NULL-1 same.'
    budget: 60 s; stopping_rule stop at 600 s -> UNRESOLVED
    falsifier: any round-trip failure on a point outside the enumerated set; or an exceptional set of size != 2.
    limitation: covers the specific maps verify.sage uses. Other published conversions (twisted Edwards with a != 1, extended coordinates) are out of scope and named as out of scope.

  - id: D7
    declared_as: scalar and multiscalar formula exceptional-case search
    mechanism: >-
      (i) Confirm the original Edwards addition law is complete on E-521 by the
      d-non-square criterion (L02) with the 2007 Bernstein-Lange result cited
      from complete.txt rows 88-99.
      (ii) Take the 2008 Hisil-Wong-Carter-Dawson DUAL addition law, which
      complete.txt rows 131-140 states is NOT complete on a complete Edwards
      curve, and determine its exceptional set by solving its denominator-
      vanishing conditions symbolically, then confirm the solution set
      exhaustively on 3 small complete Edwards curves (orders under 10^4) by
      brute force over all pairs (P,Q).
      (iii) Report the exceptional set as a set of DIFFERENCES P-Q and its size
      as a multiple of the 4-torsion.
    prediction: >-
      (i) complete, no exceptional pairs.
      (ii) the dual law's exceptional set is NON-EMPTY - this is the falsifiable
      part, since complete.txt asserts non-completeness - and on the small curves
      the brute-force set matches the symbolic solution EXACTLY (no missing and
      no spurious pairs).
      (iii) the exceptional differences lie in the 4-torsion.
    discriminates: >-
      (a) completeness is a property of a CHOSEN formula, not of the curve, so
      the SafeCurves complete cell guarantees only that a complete option EXISTS
      - versus (b) the cell would guarantee that every reasonable formula is
      complete. The source already says (a); this diagnostic makes it a measured
      set size rather than a quoted sentence.
    certificate: the symbolic condition plus the exhaustive small-curve tables; the small-curve check is fully re-runnable in seconds.
    controls: 'positive - the standard short-Weierstrass affine addition on POS-3 must exhibit its known doubling and P + (-P) failures; negative - the original Edwards law on NEG-1 must exhibit none; null - the original Edwards law on NULL-1 must exhibit none.'
    budget: 300 s; stopping_rule stop at 1200 s -> UNRESOLVED
    falsifier: 'an exceptional pair found for the ORIGINAL Edwards law on a complete curve (would contradict a published theorem and would demand independent review before anything is said); or an EMPTY exceptional set for the dual law (would contradict complete.txt); or symbolic and brute-force sets disagreeing.'
    limitation: >-
      Two formulas out of many. It is not a survey of scalar-multiplication
      implementations and mounts no side-channel or fault analysis. Multi-scalar
      completeness is inferred from single-scalar completeness exactly as
      verify.sage does, and that inference is inherited, not independently
      established.

  - id: D8
    declared_as: deterministic parameter-generation transcript audit
    status: PARTIALLY DEFERRED - shares L07's deferral
    mechanism_runnable_part: the L07 runnable part (i)-(iv), plus a written reconstruction of the candidate rule set consistent with the observed (p, d, base point) and an explicit statement of which parts of the transcript are and are not machine-checkable in this environment.
    deferred_part: the |d|-minimality sweep, blocked by the named SEA obstruction in L07.deferral.
    successor_condition: identical to L07 - a dependency task providing PARI/GP or Sage. Additionally, retrieval U-04/U-05 from the capsule would supply the designers' STATED rule, which is currently absent from the retrieved rigid page and is the other half of the transcript.
    prediction: the runnable part yields a rule set that is CONSISTENT with the observed parameters but does NOT uniquely determine them; consistency without uniqueness is the honest outcome and is preregistered as such so it is not later reported as success.
    discriminates: '(a) a deterministic transcript exists and is checkable, versus (b) the transcript is asserted and only partially checkable here. Preregistered expectation: (b), pending the successor.'
    controls: POS-3 (a documented hashed seed - the checkable-but-unexplained case), NEG-1 (a documented rule), NEG-3 (the family-wide gap), the RULE-SHUFFLE null from L07.
    budget: shares L07's 120 s.
    falsifier: discovery of a published deterministic rule for E-521 in a retrieved source, which would convert (b) to (a) and would supersede this lane.
    limitation: a provenance audit. Object O3 fails the lossy-projection test and this lane makes no mathematical claim.

  - id: D9
    declared_as: >-
      ADDED BY THIS PLAN under the goal's explicit provision that the diagnostic
      list is non-exhaustive (goal claim_boundaries[3]). Elligator 1 eligibility.
    mechanism: >-
      ind.txt rows 78-83 state Elligator 1 requires p == 3 mod 4 and a complete
      Edwards curve with d of the form -(c+1)^2/(c-1)^2 where c = 2/s^2. E-521
      satisfies p == 3 mod 4 (R9) and 4 | group order, yet SafeCurves records only
      "Elligator 2: Yes." Solve -(c+1)^2/(c-1)^2 == d over F_p for c - a
      quadratic condition, decidable by one square-root extraction - then solve
      c == 2/s^2 for s by a second extraction, and report whether both have
      solutions in F_p.
    prediction: >-
      NO PREREGISTERED DIRECTION. Both outcomes are informative: a solution means
      E-521 admits Elligator 1 and the published note is incomplete; no solution
      means the note is exactly right and the reason is now certified rather than
      unstated. This lane is included precisely because it has two live outcomes.
    discriminates: '(a) the ind cell omits Elligator 1 because it does not apply, versus (b) because the table only ever reported Elligator 2. Curve1174 - whose rigidity rule explicitly cites Elligator 1 compatibility (rigid.txt rows 184-185) - is the control that separates these.'
    certificate: the explicit c and s if they exist, checked by substitution; or the two Legendre symbols proving no solution.
    controls: 'positive - Curve1174, designed FOR Elligator 1, must return a solution; negative - a curve with p == 1 mod 4 must be rejected on the prime condition alone; null - NULL-1 random-d twin over the same p, which fixes p == 3 mod 4 and randomizes only d, giving the baseline rate at which a random d admits the form.'
    budget: 30 s; stopping_rule stop at 300 s -> UNRESOLVED
    falsifier: Curve1174 failing to return a solution (instrument void).
    limitation: eligibility of a map form, not an implementation or a security claim.

  # ==================================================================
  # 6. PRIORITY, COST, AND POSITION
  # ==================================================================
  priority_ranking:
    first_test: L05 (transfer / exact embedding degree), run immediately after the G0 control suite.
    why_first: >-
      It is the cheapest valid discriminator in the plan by a wide margin on
      information-per-second. (1) It is the only lane whose published cell makes
      a SHARP, EASILY FALSE claim - ord_l(p) = l-1 exactly - rather than a
      threshold comparison that any curve of the right size passes. (2) Its
      certificate is short and third-party re-verifiable in under a second,
      satisfying G1 at the strongest available level. (3) It carries a THREE-WAY
      outcome, and two of the three branches are findings: k = (l-1)/m
      contradicts SafeCurves' own table, and a degenerate flag would be material.
      (4) It discharges H1 as a by-product, which unlocks the Pratt certificates
      that L03, L09 and D1 all depend on - so running it first converts three
      other lanes from bounded to exact. (5) It carries its own null (NULL-3,
      Artin density 0.374), so the result cannot be over-read the moment it
      lands. Estimated 120 CPU-seconds including every control.
    then: L01 (5 s, strongest certificate, no dependencies) -> L03 and D1 (unlocked by L05's factorization) -> L09 with POS-4 (the loop with the widest published dynamic range) -> L06/D5 -> L08/L10/L11/D6 (the O2 cluster, one control set covers all four) -> D3 -> D7 -> D9 -> L07/D8 runnable parts last, since they are provenance rather than mathematics and are partly blocked.
    lowest_value_lanes: >-
      L02, L04 and L08 are near-certain to reproduce and are FREE for the shape
      (NULL-1 passes them too). They are kept because they are seconds-scale and
      because they are the tripwires for the sign-of-d and wrong-l defects that
      would silently corrupt everything else - not because their outcomes are in
      doubt. Stated plainly so their reproduction is not later reported as a
      result.

  target_complexity:
    attack_claim: NONE. No lane proposes, implements, or approximates an attack on any curve.
    audit_cost:
      total_cpu_seconds_estimate: about 1100 CPU-seconds for all lanes and all controls under E1, dominated by D7 (300 s) and L09 (180 s).
      memory: under 100 MB; no lane needs the 4 GB budgeted.
      verification_cost_of_emitted_certificates: 'exact-k: omega(l-1) modular exponentiations at 519 bits, a few dozen, well under a second. Lucas-Lehmer: 519 squarings. Pratt: one witness per prime factor. All succinct EXCEPT the L05 Step-4 fallback bound, which genuinely costs K = 10^6 multiplications to verify and is reported with that cost stated rather than presented as a short proof.'
    best_known_comparison: >-
      For the underlying ECDLP on E-521 the best known remains rho at
      0.886*sqrt(l) with O(1) memory - reproduced as a cell here, not improved.
      This plan changes no exponent, on any axis, for any problem. Its
      time_exponent and memory_exponent deltas against the state of the art are
      both exactly ZERO, and that is the honest headline.
    hidden_overhead: >-
      Two places. (1) L07/D8's deferred sweep hides an infeasible cost under E1
      (~2^130 per candidate without SEA) and is DEFERRED rather than
      approximated. (2) The exact-k route depends on H1; if H1 fails the lane
      silently WOULD have degraded to a bound whose verification cost is 10^6
      multiplications, so NULL-2 exists to make that degradation loud.

  dominated_by:
    frontier_check_performed: >-
      Checked against every attack row this producer could name on time, memory
      and data/queries - rho at 0.886*sqrt(l) with O(1) memory; BSGS at
      sqrt(l) time and sqrt(l) memory; automorphism-discounted rho on small-|D|
      curves; MOV/Frey-Ruck at small k; the anomalous additive transfer.
    verdict_as_attack: 'n/a (no result claimed). This plan mounts nothing and therefore sits on no attack frontier.'
    verdict_as_audit_instrument: >-
      DOMINATED BY verify.sage (SafeCurves' own published script, transcribed in
      full at verify.txt rows 106-482). It computes all eleven cells, has been
      run on twenty curves, has authority this plan does not, and produced the
      very numbers this plan proposes to check. This plan dominates it on exactly
      three axes and no others: (1) it runs WITHOUT Sage, under E1, whereas
      verify.sage cannot; (2) it adds preregistered positive, parameter-matched
      negative and same-shape null controls, which verify.sage has none of, and
      which are what separate a designed cell from a free one; (3) it adds nine
      diagnostics (D1-D9) that verify.sage does not compute, of which D6, D7 and
      D9 are outside its scope entirely.
  sota_delta:
    quantitative: >-
      Zero speedup against any attack baseline on every axis. As DATA: this
      program's corpus currently holds ZERO certified criterion cells for E-521
      and zero embedding-degree values or bounds for any named deployed curve
      (per IDEA-20260807-98a970's novelty screen). This plan, if executed,
      produces 11 criterion rows plus 9 diagnostic rows for one curve, of which
      the exact-k row is the one that IDEA-20260807-98a970 assigned only 0.35
      prior probability of being exact at all and singled out 521-bit rows as
      likely unreachable. The delta is therefore: one 519-bit exact embedding-
      degree certificate that the program previously expected to be out of reach,
      obtained at a cost of ~120 CPU-seconds instead of a 519-bit factorization,
      because the factor hint is published.
    as_scope: >-
      Converts eleven asserted cells into eleven reproduced-or-contradicted cells
      with controls, and converts one editorial label (rigid) into a documented,
      cited gap with a named obstruction and a successor condition.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep of the repository outside inputs/ for "E-521|SafeCurves|safecurves" on
      2026-08-25; read of IDEA-20260807-98a970 in full; read of the staged mirror
      pages and of verify.sage as transcribed at verify.txt.
    results: >-
      Numerous sibling GOAL-SCURVE-* campaigns exist with parallel
      parameter-capsule/audit-plan artifacts for other curves, and thirteen other
      RQ-SCURVE-* records were seen by filename. THIS PRODUCER DID NOT READ THEM:
      the handoff's read_scope is authoritative and lists only this goal's
      records. Consequently this producer CANNOT rule out that a sibling task
      covers E-521 or duplicates these lanes, and does not assert otherwise.
      Deduplication across sibling goals is the Coordinator's adjudication, and
      is flagged in the task report as an open item.
    verdict: >-
      ADAPTATION. The mathematics is entirely standard parameter validation, and
      SafeCurves published the script that computes it. What is adapted rather
      than invented: the control suite, the null-object discipline, the object-
      first framing, the exact-k-from-published-prime-list observation, the
      D6/D7/D9 diagnostics, and the identification of the rigid cell as
      non-computed. Nothing here is claimed as novel mathematics.
