schema_version: '1.0'
addendum:
  id: ADDENDUM-TASK-20260824-ff3c9d-01
  task_id: TASK-20260824-ff3c9d
  goal_id: GOAL-SCURVE-f7b5a3
  produced_at: '2026-08-25'
  status: >-
    ADDENDUM ONLY. This is NOT one of the three declared artifact_paths. It
    supersedes nothing. parameter-capsule.yaml, audit-plan.yaml and
    task-report.yaml as written are UNCHANGED and remain the deliverables of
    record, including their statements that safecurves.cr.yp.to was
    UNRETRIEVED (HTTP 502) at the time those artifacts were authored. That
    record stands and is correct as of authoring.
  reason_for_addendum: >-
    A mid-task coordinator message reported that a hash-pinned local mirror of
    the previously unreachable sources has been staged at
    inputs/SAFECURVES-20260825/, and instructed this task NOT to rewrite its
    artifacts but to record the mirror as a successor condition and stop. This
    file is that record.

  what_was_actually_read_here:
    - path: inputs/SAFECURVES-20260825/source_record.yaml
      provenance: internal (in-repo staged manifest, read by this task)
      read_in_full: true
  what_was_NOT_read_here:
    statement: >-
      NO page, spec, or text file under inputs/SAFECURVES-20260825/pages/ or
      /specs/ was opened by this task. No criterion definition, no threshold, no
      table cell, and no Brainpool passage from the mirror informed the capsule
      or the audit plan, both of which were complete before the mirror was
      announced. Nothing in the three deliverables is retroactively sourced by
      the mirror, and no lane verdict changes.

  mirror_facts_confirmed_from_the_manifest:
    staged_at: '2026-08-25T05:05:58+00:00'
    base_commit_at_staging: 627c092d7ba78d32c0a3e128584d5c9a9e5f7da7
    staged_by: top-level orchestration session (research harness), not a research role
    diagnosis_recorded_by_stager: >-
      The manifest states the WebFetch tool path returns 502 for
      https://safecurves.cr.yp.to/rho.html while curl to the same URL in the
      same container returns 200 with 11979 bytes - the host is reachable and
      the WebFetch path is not - and that the idea-generator role holds no Bash,
      so no producer in this campaign could reach these sources by any available
      route. This CONFIRMS the operational classification already recorded in
      the deliverables: the 502s were an infrastructure defect, never
      mathematical evidence and never a statement about the curve.
    stager_scope_note_quoted_from_manifest: >-
      "This does not retroactively source the three producer dossiers already
      completed against the 502. Those record their sources as unretrieved and
      that record stands; re-sourcing them requires a successor task."
    citation_format_required_by_manifest: >-
      provenance "retrieved (staged mirror SAFECURVES-20260825)" plus the record
      id and the file sha256.
    intake_status_unchanged_by_staging: >-
      The manifest states explicitly that staging is NOT a substitute for the
      SafeCurves intake table, which remains user_supplied_unverified and a
      comparison target only, and that staging changes no criterion verdict.
      That matches this task's own claim boundaries exactly.
    fidelity_warnings_to_carry_forward:
      - pages/*.txt are recorded as faithful, with nav boilerplate preceding body text.
      - specs/sec2-v1.txt and specs/sec2-v2.txt are recorded as LOSSY (inter-word
        spaces absent, f-ligatures dropped); the manifest says do not quote prose
        from them. Digits are intact.
      - specs/fips186-5.txt and specs/sp800-186.txt preserve word spacing but can
        split a token across lines; digit strings must be verified against the PDF.
      - The .pdf and .html files are the authority; a .txt is a derived convenience.
      - https://bada55.cr.yp.to/nist.html returned 404 and is NOT staged. Its
        absence is recorded rather than inferred.

  coordinator_relayed_pointers_NOT_promoted:
    handling_rule: >-
      The coordinator's message quoted two thresholds. A message is a pointer,
      never evidence, and this task did not open the files containing them.
      They are recorded below as PENDING VERIFICATION against the named file and
      sha256, and they are NOT promoted to `retrieved` and NOT used to adjudicate
      any lane here.
    - pointer: >-
        rho criterion threshold, relayed as: SafeCurves requires l to be at least
        2^200, with a table column "Cost for rho above 2^100?".
      verify_against: inputs/SAFECURVES-20260825/pages/rho.txt
      file_sha256: c70d1f93915d23efc77e80be8cfb7f8a1e812456108ffce011b94e6ad9e79d9c
      status: PENDING VERIFICATION by a successor task
      bears_on: audit-plan.yaml lane L4, whose operational_definition was written without a SafeCurves threshold and flagged `pending R1`.
    - pointer: >-
        disc criterion threshold, relayed as: |D| required to be larger than 2^100.
      verify_against: inputs/SAFECURVES-20260825/pages/disc.txt
      file_sha256: 666a0adf68bde7d1b5c3d0011486ecc5b93d6b4ee6363b8a98079567758c157c
      status: PENDING VERIFICATION by a successor task
      bears_on: >-
        audit-plan.yaml lane L6 and reconciliation item R2, which recorded the
        `disc` predicate as AMBIGUOUS between a class-number bound (Brainpool
        RQ-C, > 10^7) and a CM-discriminant-magnitude bound. If the relayed
        threshold verifies, R2's ambiguity RESOLVES in favour of measuring both
        predicates with the SafeCurves one pinned at |D| > 2^100 - and lane L6's
        preregistered bound (|D_0| > |D|/10^12, about 2^218 at F = 10^6) would
        then be compared against a stated threshold rather than a placeholder.
        That comparison is the successor's work, not this task's.

  successor_conditions_now_unblocked:
    note: >-
      These update, but do not rewrite, the blockers recorded in
      audit-plan.yaml `coverage_statement` and task-report.yaml
      `unresolved_conflicts`. Each item names the blocker it retires and the
      file that retires it.
    - retires: capsule item R1 (SafeCurves definitions and row unretrieved; BLOCKING for criterion adjudication)
      now_readable:
        - inputs/SAFECURVES-20260825/pages/index.txt (sha256 830355b638e713f4f99da62970e63e606e32c0f25f62af12a5aef4c4570c9e4e)
        - inputs/SAFECURVES-20260825/pages/{field,equation,base,rho,transfer,disc,rigid,ladder,twist,complete,ind,verify}.txt
      effect: >-
        Every lane L1-L11 may replace its `safecurves_reconciliation:
        BLOCKED_ON_R1` field with an actual adjudication, and may state its
        operational_definition ALONGSIDE the published definition instead of in
        place of it. The intake row's eleven cells gain a comparison source with
        provenance - they do NOT gain evidentiary status.
    - retires: capsule item R2 (disc predicate ambiguous)
      now_readable: inputs/SAFECURVES-20260825/pages/disc.txt
      effect: L6 can pin the SafeCurves predicate and measure both predicates against stated thresholds.
    - retires: PART of capsule conflict C1 and the L7/AD8 blocker
      now_readable:
        - inputs/SAFECURVES-20260825/pages/rigid.txt (sha256 5f1595d64f9d58c61e09e19fbe300db40e20a447bd64c8c158f308e3bed296a7)
        - inputs/SAFECURVES-20260825/specs/bada55-brainpool.html (sha256 619df83063086d81cd2b46fbe854ed26c7f3b086decb4cdd35db44cfe609d72f)
      effect: >-
        The rigidity/generation-transcript lane gains (a) the published rigidity
        criterion text, and (b) a Brainpool-specific analysis page. THIS ALSO
        RETIRES THE DEFERRAL RECORDED IN audit-plan.yaml AD8.deferred_component:
        the seed-search-leverage question was deferred solely because its source
        was unreadable and estimating it from the unverified internal abstract
        KN-LIT-4290 would have been citing a recollection as a checked source.
        specs/bada55-brainpool.html removes that obstacle, and AD8's deferred
        component should be re-scoped INTO a successor task rather than left
        deferred.
      does_NOT_retire: >-
        Capsule item U2 - the ECC Brainpool v1.0 (2005) primary document is NOT
        in the mirror's file list. Conflict C1 (the 2005 Algorithm 3 step-4 loop
        assertion) therefore remains UNCORROBORATED AGAINST THE 2005 PRIMARY
        TEXT, and AD8 stage A still cannot run at full strength. This is the one
        blocker the mirror does not lift, and it is stated so it is not lost in
        the general relief.
    - retires: capsule item R5 (all S1 prose was model-summarized, not verbatim)
      now_readable: inputs/SAFECURVES-20260825/specs/rfc5639.txt (sha256 d19949766009ac82b69e46b09f3a08d712908381300a340d3fa3b1478f4b215e, 50566 bytes, HTTP 200)
      effect: >-
        SIGNIFICANT. Every `requirements_as_rendered` item in the capsule was
        labelled a hypothesis about the document rather than a quotation from
        it, precisely because only a summary was available. A successor can now
        re-quote the requirements and the generation algorithm VERBATIM from a
        hash-pinned local copy, which discharges R5, R3 and R4 together and
        satisfies audit-plan.yaml precondition PRE-2 - the precondition that
        currently blocks lanes L7 and AD8 from executing at all.
    - retires: nothing, but worth recording
      now_readable: inputs/SAFECURVES-20260825/specs/{sec2-v1,sec2-v2,fips186-5,sp800-186,rfc7748,rfc5903}.*
      effect: >-
        Supplies sourced parameters for the plan's negative controls NEG-P256
        (FIPS 186-5 / SP 800-186 / SEC 2) and NEG-C25519 (RFC 7748), which
        audit-plan.yaml section 2 required to be sourced before use. An
        unsourced control is not a control, so this materially improves the
        control set that T1 would run.

  recommended_amendment_to_the_proposed_successor_handoffs:
    - handoff: T3 (source-access task, task-report.yaml proposed_successor_handoffs)
      amendment: >-
        NARROW IT. Its "retry safecurves.cr.yp.to" and "store a local RFC 5639
        copy" objectives are already satisfied by the mirror. What remains for
        T3 is exactly two things: (i) obtain a decodable copy of the ECC
        Brainpool v1.0 (2005) document, which the mirror does not contain; and
        (ii) author a SUPERSEDING parameter capsule under a new id that reads the
        mirror files, re-quotes RFC 5639 verbatim, records the eleven SafeCurves
        definitions with `provenance: retrieved (staged mirror
        SAFECURVES-20260825)` plus per-file sha256, and adjudicates the intake
        row against them.
      budget_suggestion: unchanged, 1800 s
    - handoff: T1 (cheap-tier execution)
      amendment: >-
        NOT BLOCKED by any of this and should still run first, led by lane AD6.
        Its lanes were written with self-contained operational definitions
        exactly so that R1 could not block measurement. The mirror improves T1
        only by letting it source its NEG-P256 and NEG-C25519 controls properly,
        which it should now do.
    - handoff: T4 (AD8 / L7 transcript audit)
      amendment: >-
        Its gate on T3 is now PARTIALLY satisfiable - PRE-2 can be discharged
        from specs/rfc5639.txt immediately - but stage F still needs the 2005
