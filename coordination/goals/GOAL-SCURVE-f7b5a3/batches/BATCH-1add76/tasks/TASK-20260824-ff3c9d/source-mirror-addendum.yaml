        and hold stage F for the 2005 text. Add the newly-unblocked
        seed-search-leverage component from specs/bada55-brainpool.html as a
        separate, clearly-scoped sub-objective rather than folding it into the
        transcript audit, because "was the procedure followed" and "was the
        seed searched" are different questions with different falsifiers.

