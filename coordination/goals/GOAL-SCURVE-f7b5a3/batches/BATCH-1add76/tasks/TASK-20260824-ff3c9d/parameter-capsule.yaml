  # ---------------------------------------------------------------------------
  # 6. STRUCTURAL FACTS THE t1 DERIVATION FORCES (algebra, stated for the plan)
  # ---------------------------------------------------------------------------
  derivation_consequences:
    status: >-
      These are one-line algebraic consequences of the map F(x,y) = (xZ^2, yZ^3)
      AS RENDERED in S1, derived by the capsule author, checkable by
      substitution and costing no compute. They are stated so the audit plan can
      make them FALSIFIABLE PREDICTIONS. They are NOT measurements of this
      curve, and each is contingent on R5 (that S1 really specifies that map)
      and on AD6 verifying Z in GF(p).
    - id: DC1
      statement: >-
        If Z is in GF(p) and A_r1 * Z^4 = -3 mod p, then F is a GF(p)-isomorphism
        E_r1 -> E_t1, hence #E_t1 = #E_r1, j(E_t1) = j(E_r1), and E_t1 and E_r1
        have the same trace, the same CM order, and the same quadratic twist up
        to isomorphism.
      prediction_for: AD6, AD1, AD5
      falsifier: >-
        A computed j(E_t1) != j(E_r1), or a computed #E_t1 != q, would falsify
        DC1 and would mean either Z is not in GF(p), or the retrieved
        transcription is wrong, or the rendered map is wrong.
    - id: DC2
      statement: >-
        B_t1 = B_r1 * Z^6 = B_r1 * (Z^3)^2, and (Z^3)^2 is a square in GF(p),
        so the Legendre symbols agree: chi(B_t1) = chi(B_r1).
      prediction_for: AD6, lane L2 (requirement RQ-J)
      falsifier: >-
        Computed Legendre symbols of B_r1 and B_t1 that DIFFER. That would
        falsify either DC2's premise (the B relation) or the transcription.
      significance: >-
        Makes RQ-J's applicability question (R3) partially moot: under DC2 the
        non-squareness of B transfers between the two curves either way. Worth
        checking precisely because it is cheap and because a failure localises a
        transcription error.
    - id: DC3
      statement: >-
        With #E = q prime and q odd, E(GF(p)) has NO point of order 2 over
        GF(p). A Montgomery model y^2 = x^3 + a x^2 + x requires a
        GF(p)-rational point of order 2, and a complete twisted-Edwards model
        over GF(p) requires 4 | #E. Neither can hold for a curve of odd prime
        order over GF(p).
      prediction_for: L8 (ladder), L10 (complete), AD6, AD7
      falsifier: >-
        Exhibiting a GF(p)-rational point of order 2 on E_t1, or a
        GF(p)-rational Montgomery or complete-Edwards model, would falsify DC3
        and would be a material and surprising finding requiring independent
        review before any report.
      honest_limitation: >-
        DC3 concerns the STANDARD Montgomery and complete twisted-Edwards
        models over GF(p). It says nothing about x-only ladders on Weierstrass
        curves, about complete formulas of the Renes-Costello-Batina type for
        prime-order short Weierstrass curves, or about models over extension
        fields. Lane L8 and L10 must state which predicate they are testing,
        because "no Montgomery ladder" and "no uniform scalar-multiplication
        method" are different statements and conflating them would overstate the
        result in the direction the intake row already predicts - which is
        exactly the confirmation-bias risk this lane carries.

