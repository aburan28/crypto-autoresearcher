  # ---------------------------------------------------------------------------
  # 3. RETRIEVED PARAMETER TUPLE
  # ---------------------------------------------------------------------------
  retrieved_tuple:
    curve: brainpoolP256t1
    representation: hexadecimal, big-endian, as printed by S1
    transcription_status: >-
      Two-source character-identical. Every one of the seven strings below was
      returned by S1 (rfc-editor.org) and independently by S2
      (std.neuromancer.sk), on different hosts, and agrees character for
      character after case folding and removal of the "0x" prefix. That
      agreement is a TRANSCRIPTION observation only. It is not a check that the
      values satisfy any curve equation, order, or security property; those are
      lanes L1-L3.
    p: A9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5377
    A: A9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5374
    B: 662C61C430D84EA4FE66A7733D0B76B7BF93EBC4AF2F49256AE58101FEE92B04
    x: A3E8EB3CC1CFE7B7732213B23A656149AFA142C47AAFBC2B79A191562E1305F4
    y: 2D996C823439C56D7F7B22E14644417E69BCB6DE39D027001DABE8F35B25C9BE
    q: A9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
    h: '1'
    Z: 3E2D4BD9597B58639AE7AA669CAB9837CF5CF20A2C852D10F655668DFC150EF0
    Z_semantics_as_rendered: >-
      S1's rendering states the design requirement that curves "shall be
      GF(p)-isomorphic to a curve E': y^2 = x^3 + A'*x + B' mod p with
      A' = -3 mod p", and that when this is solvable with a parameter Z the
      isomorphism is F(x,y) := (x*Z^2, y*Z^3). Under that map A' = A*Z^4 and
      B' = B*Z^6. THIS IS A RENDERING OF S1, NOT A VERBATIM QUOTE, and the
      A'/B' transformation formulas are the capsule author's standard
      consequence of the stated map, flagged as such and re-derivable in one
      line by substitution.
  companion_tuple_brainpoolP256r1:
    purpose: >-
      Recorded because t1 is DERIVED from r1; every t1 lane that depends on the
      derivation needs the source curve in the same capsule.
    p: A9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5377
    A: 7D5A0975FC2C3057EEF67530417AFFE7FB8055C126DC5C6CE94A4B44F330B5D9
    B: 26DC5C6CE94A4B44F330B5D9BBD77CBF958416295CF7E1CE6BCCDC18FF8C07B6
    x: 8BD2AEB9CB7E57CB2C4B482FFC81B7AFB9DE27E1E3BD23C23A4453BD9ACE3262
    y: 547EF835C3DAC4FD97F8461A14611DC9C27745132DED8E545C1D54C72F046997
    q: A9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
    h: '1'
    source: S1 only (S2 fetch was scoped to the t1 page)
    transcription_status: single-source; NOT cross-checked. Weaker than the t1 tuple.
  seeds:
    prime_field_seed_256: 5B54709179216D5D98979FB1BD1310BA698DFB5A
    curve_parameter_seed_256: 757F5958490CFD47D7C19BB42158D9554F7B46BC
    source: S1
    stated_origin_as_rendered: >-
      S1's rendering states the prime-field seeds come from substrings of
      "Pi*2^1120" and the curve-parameter seeds from substrings of
      "floor(e*2^1120)". S3 independently states the same construction as
      160-bit substrings of pi*2^1120 and floor(e*2^1120). Two independent
      renderings agree on the CONSTRUCTION; neither has been checked
      arithmetically here, and doing so is lane AD8 step 1.
    seed_applicability_caveat: >-
      OPEN: the seeds are stated for the 256-bit curve generation, which
      produces the r1 curve. Whether any seed is associated with t1 other than
      through r1 and Z is not established by the retrieved renderings. Recorded
      as reconciliation item R4.
  requirements_as_rendered:
    source: S1, model-summarized (see rendering_caveat)
    status: >-
      HYPOTHESES ABOUT WHAT THE SPECIFICATION SAYS, pending verbatim
      re-quotation (R5). Each is a design requirement the specification is
      rendered as imposing; NONE is a measurement of this curve, and a
      requirement being stated in a document is not evidence that the published
      curve satisfies it. Testing that gap is precisely what the audit plan is
      for.
    security:
      - id: RQ-A
        as_rendered: "(q-1)/l < 100" for the embedding degree l, against Weil/Tate
          pairing attacks
        target_lane: L5, AD4
        note: >-
          As rendered this is a LOWER bound on l of roughly (q-1)/100, i.e. an
          embedding degree comparable in size to q. Far stronger than the usual
          "l > 20" style condition. The rendering's use of l vs q here is one of
          the items R5 must confirm verbatim.
      - id: RQ-B
        as_rendered: "The trace is not equal to one" (non-anomalous)
        target_lane: L5, AD4
      - id: RQ-C
        as_rendered: >-
          "The class number of the maximal order of the quotient field of the
          endomorphism ring End(E) of E is larger than 10^7."
        target_lane: L6, AD5
        note: >-
          A class-number condition is NOT the same predicate as a
          CM-discriminant-size condition. Reconciling the two is reconciliation
          item R2 and is the substance of lane L6.
      - id: RQ-D
        as_rendered: "The group order #E(GF(p)) shall be a prime number", giving h = 1
        target_lane: L3, AD2
      - id: RQ-E
        as_rendered: verifiably pseudo-random generation from seeds
        target_lane: L7, AD8
    technical:
      - id: RQ-F
        as_rendered: "The prime number p shall be congruent 3 mod 4"
        target_lane: L1
      - id: RQ-G
        as_rendered: >-
          GF(p)-isomorphic to E': y^2 = x^3 + A'x + B' with A' = -3 mod p
        target_lane: L2, AD6
      - id: RQ-H
        as_rendered: no special-form primes; pseudo-random generation required
        target_lane: L1, L7
      - id: RQ-I
        as_rendered: "#E(GF(p)) < p"
        target_lane: L3
      - id: RQ-J
        as_rendered: "B shall be a non-square mod p"
        target_lane: L2, AD6
        note: >-
          As rendered this applies to the generated curve. Whether it is
          intended for r1, for t1, or for both is reconciliation item R3.
    generation_algorithm_as_rendered:
      prime: >-
        c = find_integer(s) from a seed s using SHA-1; take the smallest prime
        p >= c with p = 3 mod 4; check 2^(L-1) <= p <= 2^L - 1, else
        s = update_seed(s), where update_seed converts (z+1) mod 2^160 back to a
        bit string.
      curve: >-
        A = find_integer_2(s); check solvability of -3 = A*Z^4 mod p, else
        update seed; solve for Z; s = update_seed(s); B = find_integer_2(s), and
        if B is a square mod p then s = update_seed(s); check
        4*A^3 + 27*B^2 != 0 mod p; check all security requirements, else update
        seed; generate the base point G = k*P using the updated seed.
      status: >-
        SUMMARIZED, NOT VERBATIM. This is the object lane AD8 will re-execute.
        AD8 must not run against this rendering; it must run against the
        verbatim text obtained under R5.

  # ---------------------------------------------------------------------------
  # 4. RECONCILIATION: INTAKE vs RETRIEVED
  # ---------------------------------------------------------------------------
  reconciliation:
    tooling_disclosure: >-
      THIS SESSION HAD NO ARBITRARY-PRECISION ARITHMETIC TOOL. The idea-generator
      role in this runtime holds no code-execution capability. Therefore NO
      exact decimal-to-hexadecimal conversion was performed. What follows
      separates (a) exact facts established by direct inspection of the
      hexadecimal strings, which need no arithmetic, from (b) approximate
      magnitude estimates computed by hand with the method disclosed. Neither
      category is a certificate. The exact conversions are lane L1/L2 work.
    exact_by_inspection:
      - id: E1
        statement: A = p - 3 exactly, hence A = -3 mod p.
        method: >-
          The retrieved hex strings for p and A are identical in all 64 nibbles
          except the last, where p has 7 and A has 4. 0x7 - 0x3 = 0x4 with no
          borrow, so no higher nibble changes. Verifiable by a reader in
          seconds with no computation.
        bears_on: >-
          Consistency of the retrieved tuple with the intake equation form
          "y^2 = x^3 - 3x + b" and with requirement RQ-G.
      - id: E2
        statement: p = 3 mod 4.
        method: >-
          p ends in hex nibble 7 = binary 0111; the low two bits are 11. Bears
          on RQ-F.
      - id: E3
        statement: q < p.
        method: >-
          The hex strings for p and q agree on the first 31 nibbles
          (A9FB57DBA1EEA9BC3E660A909D838D7); at nibble 32 p has 2 and q has 1,
          so p > q. With h = 1 and #E = q this bears on RQ-I (#E < p).
      - id: E4
        statement: >-
          The q string printed by S1 for brainpoolP256t1 is character-identical
          to the q string printed by S1 for brainpoolP256r1, and h = 1 for both.
        method: direct string comparison of the two retrieved blocks.
        bears_on: >-
          Consistency with a GF(p)-ISOMORPHISM between r1 and t1 (which
          preserves group order) rather than a quadratic twist (which in general
          does not). This is the load-bearing structural observation for lanes
          L9, AD1 and AD6. It is a consistency observation, NOT a proof that the
          map is an isomorphism; L2/AD6 must verify that Z is in GF(p) and that
          A*Z^4 = -3 and B_r1*Z^6 = B_t1 hold.
    approximate_by_hand:
      disclosure: >-
        Computed by the capsule author by hand from the leading 32 bits of the
        hex string times 2^224, to about 10 significant figures of input
        precision. This is a MAGNITUDE CONSISTENCY CHECK ONLY. It cannot detect
        a discrepancy in any low-order digit and must never be reported as
        agreement of the integers.
      - id: A1
        quantity: modulus p
        intake_decimal: '76884956397045344220809746629001649093037950200943055203735601445031516197751'
        hand_estimate_from_hex: ~7.68844e76
        agreement: consistent to the ~6 significant figures the method resolves
        residual_risk: >-
          Any of the remaining ~71 decimal digits could differ and this check
          would not see it.
      - id: A2
        quantity: curve coefficient b
        intake_decimal: '46214326585032579593829631435610129746736367449296220983687490401182983727876'
        hand_estimate_from_hex_B: ~4.621433e76
        agreement: consistent to the ~7 significant figures the method resolves
        residual_risk: as A1.
    open_reconciliation_items:
      - id: R1
        item: >-
          The published SafeCurves criterion definitions and the published
          SafeCurves row for brainpoolP256t1 are UNRETRIEVED (U1). The eleven
          intake cells therefore have no retrieved provenance at all: their
          only recorded origin is the user.
        consequence: >-
          BLOCKING for any statement of the form "the intake row agrees /
          disagrees with SafeCurves". The audit plan may still run every lane,
          because each lane states its own operational definition; but no lane
          may adjudicate against SafeCurves until R1 closes.
        successor_condition: >-
          Retry the host in a successor task, or read the local copy named by
          KN-LIT-6351 (downloads/safecurves-20240809.pdf) under an explicit
          read_scope, and record each criterion definition and threshold with a
          date.
      - id: R2
        item: >-
          RQ-C (class number of the maximal order > 10^7) and a
          CM-discriminant-magnitude criterion are DIFFERENT PREDICATES. The
          intake asserts disc: true without saying which predicate it means.
        consequence: A disc verdict is ambiguous until the predicate is pinned.
        successor_condition: >-
          Close R1 to obtain the SafeCurves disc predicate and threshold, then
          state both predicates side by side in lane L6.
      - id: R3
        item: >-
          RQ-J (B non-square mod p) is rendered without saying whether it binds
          r1, t1, or both.
        consequence: >-
          Affects whether a t1 measurement can be read as a specification
          compliance check at all.
        successor_condition: verbatim re-quotation under R5.
      - id: R4
        item: >-
          No seed is established as associated with t1 independently of r1 and Z.
        consequence: The rigidity object for t1 may be entirely inherited from r1.
        successor_condition: verbatim re-quotation under R5, plus U2.
      - id: R5
        item: >-
          All S1 prose in this capsule is a model-generated summary, not a
          verbatim transcript, and the rendering's section numbering did not
          match the request.
        consequence: >-
          Every `requirements_as_rendered` item is a hypothesis about the
          document, not a quotation from it.
        successor_condition: >-
          A successor task stores a local copy of RFC 5639 and re-quotes
          Sections 2, 3 and Appendix A verbatim into a superseding capsule.
      - id: R6
        item: >-
          The decimal-to-hexadecimal identity between the intake pair (p, b) and
          the retrieved pair (p, B) is UNVERIFIED; only the hand magnitude
          estimates A1/A2 were performed.
        consequence: >-
          The intake and the retrieved tuple are not yet known to describe the
          same curve.
        successor_condition: >-
          Lane L1 step 0: exact conversion with both directions printed, in an
          environment with arbitrary-precision integers.
    conflicts_found:
      - id: C1
        between: intake `details: 2005 Brainpool` and retrieved S1/S3
        description: >-
          The intake dates the curve to 2005. The retrieved primary source S1
          is RFC 5639 (2010), and S3 asserts that the 2005 v1.0 document's
          Algorithm 3 contained a step-4 loop error with the stated consequence
          that the published curves were not generated by the specified
          procedure, corrected in the 2010 second version. If S3 is right, the
          2005 attribution and the reproducible-generation story are attached
          to DIFFERENT documents.
        status: UNRESOLVED
        why_unresolved: >-
          The 2005 primary document (U2) could not be decoded to text, so the
          S3 assertion is uncorroborated against the primary source.
        adjudication_route: lane AD8, gated on U2.
        importance: >-
          This is the single most consequential conflict in the capsule. It is
          the whole substance of the rigidity/generation-transcript diagnostic
          the handoff singled out, and it bears directly on the intake cell
          `rigid: true` WITHOUT settling it in either direction.
      - id: C2
        between: intake tuple completeness and RQ-SCURVE-10a83d scope
        description: >-
          The intake supplies no base point or order, but the RQ asks for the
          `base` and `rho` criteria, which are statements about a base point
          and a group order.
        status: RESOLVED-BY-RETRIEVAL
        resolution: >-
          S1 and S2 supply (x, y, q, h) character-identically. Lanes L3 and L4
          run against the retrieved tuple and record that they did so.
      - id: C3
        between: the fetched rendering of S4 and standard terminology
        description: >-
          The S4 rendering contains the sentence, as summarized, that "quadratic
          twists are isomorphic to the original curve and provide equivalent
          security", used to conclude that brainpoolP256t1 is as secure as
          brainpoolP256r1. Over GF(p) a non-trivial quadratic twist is in
          general NOT GF(p)-isomorphic to the original curve and in general does
          NOT have the same group order. Meanwhile E4 shows r1 and t1 share the
          same q, which is what an ISOMORPHISM gives, not a quadratic twist.
        status: UNRESOLVED, and deliberately not adjudicated here
        why_unresolved: >-
          The rendering is a summary, not a transcript, so it is not established
          that the quoted sentence is what the author wrote. This capsule does
          not attribute an error to anyone on the strength of a summary.
        adjudication_route: >-
          Lane AD6 verifies the algebra directly from the retrieved parameters
          (is Z in GF(p); does A*Z^4 = -3; does B_r1*Z^6 = B_t1; is
          j(r1) = j(t1)), which settles the mathematics without needing to
          settle what the message said. A successor task may re-fetch S4
          verbatim if the terminology question matters for reporting.
        note: >-
          The naming trap is real and worth carrying: "t1" is called the
          "twisted" curve, but the retrieved evidence (E4, and the Z-map shape)
          is consistent with a GF(p)-ISOMORPHISM, under which the SafeCurves
          `twist` criterion - which is about the QUADRATIC TWIST of the curve -
          concerns a third curve that is neither r1 nor t1.

