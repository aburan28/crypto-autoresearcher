  # ---------------------------------------------------------------------------
  successor_conditions:
    - id: SC1
      condition: >-
        The superseding parameter capsule (proposed handoff T3) records all
        sixteen digit strings with provenance "retrieved (staged mirror
        SAFECURVES-20260825)" plus file sha256, states p for t1 as inherited
        from the r1 block, drops or re-sources the four quarantined S2
        quantities, and does NOT repeat the two-host corroboration argument.
      priority: high
    - id: SC2
      condition: >-
        Lane AD5's conductor prediction and lane L6's cross-reference to it are
        withdrawn or re-derived from a raw-byte source before T2 runs.
      priority: high
    - id: SC3
      condition: >-
        Lane AD8 adds the 96-bit A/B overlap as a blocking regression fixture in
        stage D, and reports the seven named unexplained decisions as a
        degrees-of-freedom table rather than a reproduce/not-reproduce bit.
      priority: high
    - id: SC4
      condition: >-
        Lane L7 reports the published rigidity LEVEL ("somewhat rigid") and not
        a boolean, and states that the intake's `rigid: true` is a lossy
        projection of a four-level scale.
      priority: medium
    - id: SC5
      condition: >-
        PRE-2 is discharged by reading RFC 5639 Appendix A from the staged
        mirror with the Read tool, never WebFetch, before AD8 executes.
      priority: high
    - id: SC6
      condition: >-
        The ECC Brainpool v1.0 (2005) document is still NOT in the mirror.
        Conflict C1 remains unresolved and AD8 stage F remains blocked. This
        correction does not lift it.
      priority: medium

  claims_unchanged:
    no_curve_attack_ran: true
    no_experiment_result_created: true
    no_safety_or_vulnerability_conclusion: true
    no_criterion_verdict_asserted: true
    ids_minted: none
    git_operations: none
    deliverables_rewritten: none
