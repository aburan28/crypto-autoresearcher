schema_version: '1.0'
correction_record:
  id: CORRECTION-TASK-20260824-ff3c9d-01
  task_id: TASK-20260824-ff3c9d
  goal_id: GOAL-SCURVE-f7b5a3
  produced_at: '2026-08-25'
  supersedes: nothing
  status: >-
    CORRECTION RECORD. Not one of the three declared artifact_paths. Per the
    coordinator's instruction the three deliverables were NOT rewritten;
    parameter-capsule.yaml, audit-plan.yaml and task-report.yaml stand exactly
    as authored. This record states which of their contents are QUARANTINED,
    which are now RAW-BYTE VERIFIED, and what changes for the successor.
  trigger: >-
    Coordinator integrity warning: WebFetch in this environment returns a
    small-model SUMMARY of a page, not the page. Demonstrated against raw curl
    bytes of RFC 7748 to corrupt numeric data - collapsing three distinct
    constants into one wrong value, misreporting a cofactor on three separate
    lines, and returning a subgroup order of the wrong digit length, with two
    fetches of the same URL disagreeing with each other.

  # ---------------------------------------------------------------------------
  # 1. THE ARGUMENT THAT WAS WRONG
  # ---------------------------------------------------------------------------
  invalidated_reasoning:
    location: parameter-capsule.yaml, retrieved_tuple.transcription_status
    what_it_claimed: >-
      "Two-source character-identical. Every one of the seven strings below was
      returned by S1 (rfc-editor.org) and independently by S2
      (std.neuromancer.sk), on different hosts, and agrees character for
      character."
    why_it_is_void: >-
      BOTH S1 AND S2 WERE OBTAINED THROUGH WEBFETCH. Different hosts do not make
      independent readings when the same summarizer mediates both. The claim
      sampled one instrument twice and reported it as corroboration. THE
      AGREEMENT WAS NOT EVIDENCE OF CORRECT TRANSCRIPTION, and the capsule's
      strongest stated retrieval result rested on it.
    severity: >-
      HIGH as reasoning. This is the exact failure the program's independence
      rules exist to prevent, committed in the citation layer rather than the
      review layer, and it would have propagated into every lane that consumed
      the tuple.
    honest_note: >-
      The error was in the ARGUMENT, and it is separately true (section 2) that
      the values happened to be correct. Those are different facts and this
      record does not let the second excuse the first: an invalid corroboration
      argument that yields a right answer is still an invalid argument, and next
      time the digits will not be right.

  # ---------------------------------------------------------------------------
  # 2. RAW-BYTE VERIFICATION PERFORMED IN THIS CORRECTION
  # ---------------------------------------------------------------------------
  raw_byte_verification:
    method: >-
      Read tool against the hash-pinned staged mirror, not WebFetch. No
      summarizer in the path.
    source:
      path: inputs/SAFECURVES-20260825/specs/rfc5639.txt
      sha256: d19949766009ac82b69e46b09f3a08d712908381300a340d3fa3b1478f4b215e
      record_id: SAFECURVES-20260825
      provenance: retrieved (staged mirror SAFECURVES-20260825)
      location_read: 'lines 567-613 (Section 3.4, Domain Parameters for 256-Bit Curves); lines 1268-1289 and 1420-1441 (seeds); lines 252-279 and 322-378 (requirements)'
    result_headline: >-
      ALL SIXTEEN DIGIT STRINGS RECORDED IN THE CAPSULE MATCH THE RAW RFC 5639
      BYTES EXACTLY. Seven brainpoolP256t1 values, seven brainpoolP256r1 values,
      and two seeds. Zero discrepancies.
    verified_brainpoolP256t1:
      Z: 3E2D4BD9597B58639AE7AA669CAB9837CF5CF20A2C852D10F655668DFC150EF0
      A: A9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5374
      B: 662C61C430D84EA4FE66A7733D0B76B7BF93EBC4AF2F49256AE58101FEE92B04
      x: A3E8EB3CC1CFE7B7732213B23A656149AFA142C47AAFBC2B79A191562E1305F4
      y: 2D996C823439C56D7F7B22E14644417E69BCB6DE39D027001DABE8F35B25C9BE
      q: A9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
      h: '1'
      status: raw-byte verified, all seven
    verified_brainpoolP256r1:
      p: A9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5377
      A: 7D5A0975FC2C3057EEF67530417AFFE7FB8055C126DC5C6CE94A4B44F330B5D9
      B: 26DC5C6CE94A4B44F330B5D9BBD77CBF958416295CF7E1CE6BCCDC18FF8C07B6
      x: 8BD2AEB9CB7E57CB2C4B482FFC81B7AFB9DE27E1E3BD23C23A4453BD9ACE3262
      y: 547EF835C3DAC4FD97F8461A14611DC9C27745132DED8E545C1D54C72F046997
      q: A9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
      h: '1'
      status: >-
        raw-byte verified, all seven. UPGRADES the capsule, which recorded the
        r1 tuple as "single-source; NOT cross-checked. Weaker than the t1 tuple."
        It is now the equal of the t1 tuple.
    verified_seeds:
      Seed_p_256: 5B54709179216D5D98979FB1BD1310BA698DFB5A
      Seed_ab_256: 757F5958490CFD47D7C19BB42158D9554F7B46BC
      status: raw-byte verified, both
    exact_facts_now_confirmed_from_raw_bytes:
      - >-
        E1 (A = p - 3): raw t1 A ends 5374, raw r1 p ends 5377, all other 63
        nibbles identical. CONFIRMED.
      - >-
        E2 (p = 3 mod 4): p ends in nibble 7. CONFIRMED.
      - >-
        E3 (q < p): strings agree on 31 nibbles, then p has 2 and q has 1.
        CONFIRMED.
      - >-
        E4 (identical q for r1 and t1): the two q lines in Section 3.4 are
        byte-identical, and h = 1 for both. CONFIRMED. The structural basis for
        the GF(p)-isomorphism reading of the r1 -> t1 derivation now rests on
        raw bytes rather than on a summarizer.

  # ---------------------------------------------------------------------------
  # 3. CORRECTIONS TO THE CAPSULE
  # ---------------------------------------------------------------------------
  corrections:
    - id: X1
      item: >-
        parameter-capsule.yaml retrieved_tuple lists `p` as part of the
        brainpoolP256t1 tuple attributed to S1.
      correction: >-
        RFC 5639 Section 3.4's brainpoolP256t1 block lists Z, A, B, x, y, q, h
        ONLY. It does NOT restate p. The value of p is inherited from the
        brainpoolP256r1 block immediately above it in the same section, because
        both curves are over the same field. The value recorded is correct; its
        stated PROVENANCE was imprecise, and a successor capsule must record p
        for t1 as "inherited from the r1 block of RFC 5639 Section 3.4", not as
        printed in the t1 block.
      severity: low as fact, medium as provenance discipline
    - id: X2
      item: capsule reconciliation_status "two-source character-identical"
      correction: >-
        VOID as an independence claim (section 1). REPLACED by the raw-byte
        verification of section 2, which is a genuinely different instrument.
      severity: high as reasoning, zero as outcome
    - id: X3
      item: >-
        capsule section 5, uncertified_derived_quantities - four values
        attributed to S2 (discriminant, CM discriminant, j-invariant, embedding
        degree).
      correction: >-
        QUARANTINED. Reason: "WebFetch summarizer-mediated; digits not
        byte-verified." These are 76-77 digit decimal strings obtained through
        exactly the path shown to corrupt numeric data, from a secondary source
        that is NOT in the staged mirror and therefore cannot be raw-byte
        checked here. They were already recorded as uncertified comparison
        targets and must NOT be promoted; a successor should either re-obtain
        them from raw bytes or DROP them and let the lanes compute the
        quantities without a preregistered target.
      severity: medium
    - id: X4
      item: >-
        audit-plan.yaml lane AD5 quantitative_prediction - the "sharp, cheap,
        falsifiable" prediction that some small conductor f in roughly {2,...,8}
        divides D, derived by comparing the S2 CM-discriminant magnitude against
        4p.
      correction: >-
        THIS PREDICTION IS BUILT ON A QUARANTINED DIGIT STRING (X3) AND MUST BE
        WITHDRAWN OR RE-DERIVED. It was the plan's sharpest preregistered
        numeric prediction and its entire basis was a summarizer-mediated
        76-digit decimal. A successor must either re-obtain the value from raw
        bytes or run AD5 with NO preregistered conductor target, reporting
        whatever f the search finds. Lane L6's cross-reference to the same
        inference inherits this correction.
      severity: >-
        HIGH for the plan's integrity. This is the single most consequential
        downstream effect of the WebFetch defect on this task's output, and it
        is recorded plainly rather than buried.
    - id: X5
      item: capsule item R5 (all S1 prose is model-summarized, not verbatim)
      correction: >-
        DISCHARGED for the requirements and for Section 3.4. The raw text
        confirms every `requirements_as_rendered` item this task recorded, and
        SHARPENS three of them (section 4). R5 remains open only for parts of
        the document not read here, principally Appendix A's algorithm text,
        which precondition PRE-2 still requires before lane AD8 runs.
      severity: n/a - this is relief, not a defect

  # ---------------------------------------------------------------------------
  # 4. VERBATIM REQUIREMENT TEXT - WHAT IT SHARPENS
  # ---------------------------------------------------------------------------
  requirements_now_raw_verified:
    - id: RQ-A
      raw_text_confirms: >-
        "l = min{t | q divides p^t - 1}, i.e., l is the order of p mod q. By
        Fermat's Little Theorem, l divides q-1. We require (q-1)/l < 100, which
        means that l is close to the maximum possible value. This requirement is
        considerably stronger than those of [SEC2] and [ANSI2] and also excludes
        supersingular curves, as those are the curves of order p+1."
      what_it_sharpens: >-
        The specification's l IS EXACTLY the tracked object O4, ord_q(p), which
        audit-plan.yaml lane AD4 inherits from IDEA-20260807-98a970. The object
        choice is now confirmed by the primary text rather than inferred. Also
        newly explicit: the requirement excludes supersingular curves, which is
        a fourth degenerate check AD4 can record alongside its existing three.
    - id: RQ-B
      raw_text_confirms: >-
        "The trace is not equal to one. Trace one curves (or anomalous curves)
        are curves with #E(GF(p)) = p."
      what_it_sharpens: confirms lane L5's additive branch and its t = p + 1 - q certificate.
    - id: RQ-C
      raw_text_confirms: >-
        "Large class number. The class number of the maximal order of the
        quotient field of the endomorphism ring End(E) of E is larger than
        10^7." AND, in the same paragraph, "Although there are no efficient
        attacks exploiting a small class number, recent work ... also may be
        seen as argument for the class number condition."
      what_it_sharpens: >-
        MATERIALLY. The specification ITSELF states there are no efficient
        attacks exploiting a small class number. Lane L6 must carry that
        sentence: it means the class-number predicate is a conservatism
        requirement, not a known-attack countermeasure, and any report that
        treats a class-number result as a security margin would overstate it
        against the primary source's own words. Capsule item R2's ambiguity
        between the two `disc` predicates is now BOTH pinned and shown to matter
        less than it appeared, because one of the two predicates disclaims an
        attack connection in its own definition.
    - id: RQ-F
      raw_text_confirms: '"The prime number p shall be congruent 3 mod 4."'
      what_it_sharpens: confirms L1; already exact by inspection (E2).
    - id: RQ-J
      raw_text_confirms: >-
        "B shall be a non-square mod p. Otherwise, the compressed
        representations of the curve-points (0,0) and (0,X), with X being the
        square root of B with a least significant bit of 0, would be" [ambiguous
        - sentence continues past the read window].
      what_it_sharpens: >-
        Gives the REASON (point-compression ambiguity), which capsule item R3
        lacked. Combined with derivation consequence DC2 - B_t1 = B_r1 * (Z^3)^2
        so the Legendre symbols must agree - lane L2's two-valued prediction now
        has a stated purpose as well as a stated falsifier.
    seeds_raw_verified_note: >-
      Both 256-bit seeds are labelled in the raw text "for brainpoolP256r1".
      NEITHER is labelled for t1. This CONFIRMS capsule item R4: t1 has no
      independent generation seed and its rigidity story is entirely inherited
      from r1 plus the published Z. The raw text also confirms the seeds "have
      been obtained as the first 7 substrings of 160-bit length each of
      R = floor(e*2^1120)".
    incidental_document_observation: >-
      At line 1437 the raw text reads "Seed_ab_512 for brainpoolP384r1", which
      appears to be a typographical error in RFC 5639 for brainpoolP512r1.
      Recorded because it was seen in the raw bytes and rule 8 says unexpected
      observations are recorded, not discarded. It does not concern this curve
      and no claim is made about it.

  # ---------------------------------------------------------------------------
  # 5. R1 NOW PARTIALLY DISCHARGED - AND IT CHANGES A COMPARISON TARGET
  # ---------------------------------------------------------------------------
  safecurves_rigidity_now_read:
    source:
      path: inputs/SAFECURVES-20260825/pages/rigid.txt
      sha256: 5f1595d64f9d58c61e09e19fbe300db40e20a447bd64c8c158f308e3bed296a7
      provenance: retrieved (staged mirror SAFECURVES-20260825)
    finding_1_the_rating_is_not_a_boolean:
      raw_text: 'The brainpoolP256t1 entry reads: "somewhat rigid" with a check mark.'
      scale_observed_in_the_same_file: >-
        "fully rigid" with a check mark (Anomalous, M-221, E-382, M-383,
        Curve383187); "somewhat rigid" with a check mark (brainpoolP256t1,
        brainpoolP384t1, secp256k1); "manipulatable" (NIST P-256, NIST P-384);
        "trivially manipulatable" (ANSSI FRP256v1).
      consequence_for_the_intake: >-
        The goal's intake cell `rigid: true` is CONSISTENT with the published
        rating, because "somewhat rigid" carries the check mark. But the boolean
        is a LOSSY PROJECTION of a four-level classification, and it discards
        the distinction between "fully rigid" and "somewhat rigid" as well as
        the seven named reservations below. A successor adjudicating lane L7
        must report the LEVEL, not the bit. Reporting only "matches the intake"
        would lose the whole content of the published assessment.
      claim_boundary_unchanged: >-
        This is a comparison target with retrieved provenance. It is still not
        evidence about the curve, and a rigidity level is still not an ECDLP
        statement.
    finding_2_seven_named_unexplained_decisions:
      raw_text_lists: >-
        Why SHA-1 instead of, e.g., RIPEMD-160 or SHA-256? Why use 160 bits of
        hash input independently of the curve size? Why pi and e instead of,
        e.g., sqrt(2) and sqrt(3)? Why handle separate key sizes by more digits
        of pi and e instead of hash derivation? Why counter mode instead of,
        e.g., OFB? Why use overlapping counters for A and B (producing the
        repeated 26DC5C6CE94A4B44F330B5D9)? Why not derive separate seeds for A
        and B?
      consequence_for_AD8: >-
        Lane AD8 was written to answer "does the transcript reproduce the curve".
        It now inherits SEVEN concrete, named, independently-stated questions
        about degrees of freedom in that transcript. These are exactly the
        "unexplained decisions" a transcript audit is positioned to enumerate,
        and AD8 should report them as a table of degrees of freedom with the
        size of each choice space, which is a sharper deliverable than a
        reproduce/not-reproduce bit.
    finding_3_an_exact_fact_verified_independently_from_raw_bytes:
      observation: >-
        The last 24 hexadecimal digits of brainpoolP256r1's A are
        26DC5C6CE94A4B44F330B5D9, and the first 24 hexadecimal digits of
        brainpoolP256r1's B are 26DC5C6CE94A4B44F330B5D9. They are identical.
        A 96-BIT OVERLAP BETWEEN THE TWO COEFFICIENTS, visible by direct
        inspection of RFC 5639 Section 3.4.
      method: >-
        Read off the raw RFC bytes recorded in section 2 of this record and
        compared by eye. Costs nothing, needs no arithmetic, and any reader can
        repeat it in seconds against the same two lines.
      independence: >-
        This CORROBORATES the SafeCurves parenthetical "(producing the repeated
        26DC5C6CE94A4B44F330B5D9)" from a different source - the primary
        specification's own digits - rather than by re-reading SafeCurves. It is
        the first genuinely independent corroboration this task has produced,
        and it is worth contrasting with the void two-WebFetch argument in
        section 1: this one uses two different instruments on two different
        documents.
      interpretation_limit: >-
        THIS IS NOT A VULNERABILITY CLAIM AND NOTHING HERE SUGGESTS ONE. It is a
        structural transparency observation about the generation procedure,
        consistent with A and B being read from overlapping windows of a
        counter-mode hash stream. It says nothing about the hardness of the
        ECDLP on this curve, and this record makes no safety or vulnerability
        conclusion of any kind.
      why_it_is_useful_to_AD8: >-
        It converts one of the seven reservations into a CHECKABLE REGRESSION
        FIXTURE. A correct reimplementation of the Brainpool A/B derivation must
        REPRODUCE the 96-bit overlap. A reimplementation that produces a curve
        without it has misread the counter schedule. This is a stronger and
        cheaper blocking control than AD8's existing POS-SEEDREPRO, because it
        can be checked against PUBLISHED DIGITS before the pipeline is run
        against anything, and it should be added to AD8 stage D as an additional
        gate.

  # ---------------------------------------------------------------------------
  # 6. CAMPAIGN-LEVEL METHODOLOGICAL CORRECTION
  # ---------------------------------------------------------------------------
  methodological_correction:
    rule_to_carry_forward: >-
      TWO WEBFETCH RESULTS AGREEING IS NOT CORROBORATION - it samples one
      summarizer twice. Cross-source agreement is only evidence when the
      instruments differ, not merely when the URLs differ. Any digit obtained
      through WebFetch is recorded as UNVERIFIED with the reason "WebFetch
      summarizer-mediated; digits not byte-verified" and is raw-byte checked
      before any lane consumes it.
    scope_of_the_defect_in_this_task: >-
      Every digit string in parameter-capsule.yaml originated from WebFetch.
      Sixteen of them are now raw-byte verified and correct (section 2). Four
      remain quarantined (X3) and one preregistered prediction built on them is
      withdrawn (X4). No other task output consumed a digit.
    what_this_does_not_change: >-
      The three deliverables' claim boundaries are unaffected: no curve attack
      ran, no experiment result was created, no safety or vulnerability
      conclusion was made, the intake remains user_supplied_unverified and
      comparison-target-only, and no canonical identifiers were minted.
    sibling_goals_note: >-
      The bootstrap manifest lists 20 GOAL-SCURVE-* rows and the coordinator
      reports three producer dossiers already completed against the 502. Any of
      them that recorded a WebFetch-derived parameter tuple is exposed to the
      same defect. This is flagged for the Coordinator; this task has no
      authority over those records and does not read or amend them.

  # ---------------------------------------------------------------------------
