  # ---------------------------------------------------------------------------
  # MANDATORY SCOPE STATEMENT
  # ---------------------------------------------------------------------------
  scope_and_claims:
    no_curve_attack_ran: >-
      TRUE. No discrete-logarithm computation, no point-counting run, no
