      capability at all.
    no_experiment_result_created: >-
      TRUE. No run record, evidence record, or hypothesis-status change was
      produced. Nothing in the three artifacts is an evidence record.
    no_safety_or_vulnerability_conclusion: >-
      TRUE. This report does not state, imply, or hint that brainpoolP256t1 is
      safe, unsafe, vulnerable, or free of vulnerabilities. It states what was
      retrieved, what was not, and what a bounded audit could measure.
    live_keys: >-
      None requested, tested, stored, or derived. Only public standardised
      parameters and controls that a successor task would generate itself.
    canonical_ids_minted: >-
      NONE. No IDEA-*, H-*, EXP-*, EV-*, KN-*, or DEC-* record was created. The
      write_scope confines this task to its own directory and only the
      Coordinator allocates canonical research identifiers. In particular this
      task did NOT mint a duplicate of IDEA-20260807-98a970, per the handoff's
      non-duplication constraint.
    write_scope_respected: >-
      TRUE. Exactly three files were written, all under
      coordination/goals/GOAL-SCURVE-f7b5a3/batches/BATCH-1add76/tasks/TASK-20260824-ff3c9d/.
      Nothing outside it was created or modified.
