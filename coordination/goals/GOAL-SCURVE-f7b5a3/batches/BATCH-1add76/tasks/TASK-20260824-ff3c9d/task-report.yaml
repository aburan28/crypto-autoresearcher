  # ---------------------------------------------------------------------------
  # SOURCE RETRIEVAL OUTCOME
  # ---------------------------------------------------------------------------
  retrieval_summary:
    retrieved_and_read:
      - S1 RFC 5639 (rfc-editor.org) - primary specification. Parameters,
        seeds, Z, requirements, generation algorithm.
      - S2 std.neuromancer.sk brainpoolP256t1 - secondary database, used as an
        independent transcription cross-check and as a source of four
        uncertified derived quantities recorded as comparison targets.
      - S3 dissect.crocs.fi.muni.cz Brainpool page - secondary analysis, source
        of the 2005 Algorithm 3 step-4 assertion carried as conflict C1.
      - S4 IETF TLS mail archive, Merkle 2014-11-11 - source of the terminology
        ambiguity recorded as conflict C3; supports no mathematical claim.
    strongest_retrieval_result: >-
      The seven-string t1 parameter tuple was returned CHARACTER-IDENTICALLY by
      two independent hosts (rfc-editor.org and std.neuromancer.sk). That is a
      transcription observation of real value and it is recorded as exactly
      that - not as a check that the values satisfy any curve property.
    not_retrieved:
      - id: U1
        source: safecurves.cr.yp.to (index, transfer, disc, rigid, ladder, twist, complete, ind, verify)
        outcome: HTTP 502 Bad Gateway on every attempt, host-wide (six attempts to safecurves plus one to ecc.2015.rump on the same domain).
        handling: RECORDED AS UNRETRIEVED AND NOT PARAPHRASED. No SafeCurves content, definition, threshold, or table cell appears anywhere in the three artifacts.
        classification: operational observation, never mathematical evidence.
      - id: U2
        source: ECC Brainpool Standard Curves and Curve Generation v1.0 (2005), teletrust.de
        outcome: PDF bytes received (109.1 KB) but not decodable to text by the available tool; no content read.
        handling: The 2005 Algorithm 3 remains unread; conflict C1 is therefore uncorroborated against the primary source and is carried as a hypothesis, not a finding.
      - id: U3
        source: ECC 2015 rump-session PDF on Brainpool criteria
        outcome: HTTP 502 (same host family as U1).
        handling: pointer only, not paraphrased.
    recalled_or_internal_pointers_not_promoted: >-
      KN-LIT-4290 (BADA55) and KN-LIT-6351 (SafeCurves) are cited as INTERNAL
      records of limited authority - both are marked `confidence: reported` and
      both carry their own "Not verified here" disclaimers stating they were
      bulk-seeded from PDF first pages. Neither was promoted to `retrieved`.
      Neither backs any claim beyond "a published analysis of this question
      exists".

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ---------------------------------------------------------------------------
  unresolved_conflicts:
    - id: C1
      severity: high
      summary: >-
        The intake dates the curve "2005 Brainpool". The retrieved primary
        source is RFC 5639 (2010). S3 asserts that the 2005 v1.0 document's
        Algorithm 3 looped from step 4 back to step 1 rather than to step 4,
        with the stated consequence that the published curves were NOT generated
        by the specified procedure, and that this was corrected in 2010. If S3
        is right, the "2005" attribution and the reproducible-generation story
        belong to different documents.
      why_unresolved: U2 could not be decoded, so S3 is uncorroborated against the 2005 primary text.
      bears_on: the intake cell `rigid: true`, WITHOUT settling it in either direction.
      adjudication_route: lane AD8, gated on PRE-2 and U2.
    - id: C3
      severity: medium
      summary: >-
        The fetched rendering of S4 contains a summarized sentence equating
        quadratic twists with GF(p)-isomorphic curves, while the retrieved data
        (identical q for r1 and t1, and a Z-map of the form (xZ^2, yZ^3)) is
        consistent with t1 being a GF(p)-ISOMORPH of r1 rather than a quadratic
        twist. The word "twisted" in the curve's name is therefore a naming trap
        for the SafeCurves `twist` criterion, which concerns the quadratic twist
        - a third curve that is neither r1 nor t1.
      why_unresolved: >-
        The rendering is a model summary, not a transcript; this report does not
        attribute an error to any author on the strength of a summary.
      adjudication_route: >-
        Lane AD6 settles the MATHEMATICS from the retrieved parameters in under
        five seconds without needing to settle what the message said.
    - id: R1
      severity: high
      summary: >-
        The eleven intake True/False cells have NO retrieved provenance. Their
        only recorded origin is the user. The published SafeCurves definitions
        and row are unretrieved.
      consequence: >-
        BLOCKING for any statement of the form "the intake row agrees or
        disagrees with SafeCurves". Every lane in the plan therefore emits its
        own `operational_verdict` plus `safecurves_reconciliation: BLOCKED_ON_R1`.
      adjudication_route: retry the host, or read downloads/safecurves-20240809.pdf under an explicit read_scope.
    - id: R6
      severity: medium
      summary: >-
        The decimal-to-hexadecimal identity between the intake (modulus, b) and
        the retrieved (p, B) is UNVERIFIED. This session had no
        arbitrary-precision arithmetic tool, so only exact-by-inspection facts
        and disclosed hand magnitude estimates (agreeing to about 6-7 significant
        figures) were produced. The intake and the retrieved tuple are not yet
        known to describe the same curve.
      adjudication_route: lane L1 step 0 / PRE-1, milliseconds in any environment with big integers.
    - id: R5
      severity: medium
      summary: >-
        All prose from S1 is a model-generated summary rather than a verbatim
        transcript, and the rendering's section numbering did not match the
        request. Every `requirements_as_rendered` item is a hypothesis about
        the document, not a quotation from it.
      adjudication_route: store a local copy and re-quote verbatim in a superseding capsule.
    - id: R2
      severity: medium
      summary: >-
        The `disc` criterion is ambiguous: the Brainpool requirement as rendered
        is a CLASS NUMBER bound (> 10^7), while a CM-discriminant-magnitude bound
        is a different predicate. The intake's single `disc: true` cell does not
        say which it asserts.
      adjudication_route: lane L6 measures both predicates side by side and refuses to pick one.
    - id: R3
      severity: low
      summary: The "B non-square mod p" requirement is rendered without stating whether it binds r1, t1, or both.
      adjudication_route: >-
        Partially defused by derivation consequence DC2 (B_t1 = B_r1 * (Z^3)^2 so
        the Legendre symbols must agree), which lane L2 tests as a falsifiable
        two-valued prediction.
    - id: R4
      severity: low
      summary: No seed is established as associated with t1 independently of r1 and Z.
      adjudication_route: PRE-2 verbatim text plus U2.

  # ---------------------------------------------------------------------------
  # COMPLETION-GATE SELF-ASSESSMENT
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: >-
        The parameter capsule distinguishes user intake from retrieved primary or
        authoritative sources and records provenance and unresolved conflicts.
      met: true
      where: >-
        parameter-capsule.yaml section 1 (intake, marked
        `provenance: user_supplied_unverified`, `comparison_target_only: true`,
        with an explicit `evidentiary_status` prohibition), section 2 (four
        retrieved sources with per-source provenance, authority, fetch outcome,
        rendering caveat and relied_on_for; three unretrieved sources with
        failure modes; four pointers marked internal and not promoted), section 3
        (retrieved tuple with two-host transcription status), section 4
        (six open reconciliation items and three conflicts).
    - item: >-
        The audit plan covers every one of the eleven criteria in the declared
        category, with a certificate or explicit bound, controls, falsifier,
        budget, and stopping rule.
      met: true
      where: >-
        audit-plan.yaml section 3, lanes L1-L11, each carrying `category`
        matching the goal's declared criterion_categories, plus
        operational_definition, tracked_object, mechanism,
        quantitative_prediction, certificate_or_bound, controls (positive /
        negative / null), budget, stopping_rule, falsifier, honest_limitation
        and discrimination.
      note: >-
        Category assignment used: basic_parameter_requirements = L1 field,
        L2 equation, L3 base; ecdlp_security_requirements = L4 rho, L5 transfer,
        L6 disc; ecc_security_beyond_ecdlp = L7 rigid, L8 ladder, L9 twist,
        L10 complete, L11 ind. This matches the goal record exactly.
    - item: >-
        The plan covers every declared additional diagnostic, or records a
        concrete reason and successor condition for a deferred diagnostic.
      met: true
      where: >-
        audit-plan.yaml section 4, AD1-AD8, one per declared diagnostic in the
        goal's stated order, plus `coverage_statement` listing zero wholly
        deferred diagnostics and four PARTIAL components each with a named
        blocker and a concrete successor condition (AD8 full execution blocked on
        PRE-2/U2; AD8 seed-search leverage blocked on KN-LIT-4290 source access;
        AD1/L9 complete twist factorization blocked on the absence of an assumed
        ECM facility; all lanes' SafeCurves adjudication blocked on R1).
    - item: >-
        Positive, parameter-matched negative, and same-shape null controls are
        explicit and run before belief in any later task.
      met: true
      where: >-
        audit-plan.yaml section 2 defines the shared control set with a binding
        rule that no lane output may be interpreted before its controls have run
        through the identical code path, and that a failed positive control voids
        the lane. Every lane in sections 3 and 4 names its own positive,
        negative and null. Two controls are marked BLOCKING (AD8 stage D
        POS-SEEDREPRO and NULL-SHUFFLEDSEED; AD4's planted positives inherited
        from IDEA-20260807-98a970). NULL-DECAY is required for every lane that
        reports a bound rather than a value.
      negative_control_honesty: >-
        Each negative control states what it is matched on AND what it is not
        matched on. NEG-P256 is explicitly declared NOT a valid negative for L7
        (rigidity), where its generation story is a confounder rather than a
        match. NEG-BPr1 - identical p, q, h, seed family and specification -
        is the tightest available match and is used wherever DC1 predicts
        identical answers.
    - item: >-
        The report states that no curve attack ran and makes no safety or
        vulnerability conclusion.
      met: true
      where: this record, `scope_and_claims`.
  all_gate_items_met: true

  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING  (docs/inventor-protocol.md section 5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - id: O1
        object: the GF(p)-isomorphism invariant pair (j, #E), equivalently (j, t)
        lossy_projection_test: PASSES - discards coefficients, base point, model, seed; infinitely many (A,B) share a j, so not a change of coordinates; invariant under exactly the operation relating r1 to t1.
        status: tracked, drives nine lanes
      - id: O2
        object: the 2-primary part of E(GF(p)) and of its quadratic twist
        lossy_projection_test: PASSES - retains a finite 2-group, cannot see q at all, yet decides three of the eleven criteria (ladder, complete, ind); discarded compatibly because rational 2-power torsion is preserved by GF(p)-isomorphism.
        status: tracked, drives six lanes; the sharpest projection in the plan
      - id: O3
        object: the generation transcript (seed-state sequence under update_seed, with per-step accept/reject)
        lossy_projection_test: PASSES - discards the curve entirely; the generation procedure is a deterministic function of the state alone, so the retained sequence propagates without reference to the curve.
        status: tracked; its DISSOLUTION POINT is the intended finding of AD8
      - id: O4
        object: ord_q(p)
        lossy_projection_test: already recorded in IDEA-20260807-98a970; NOT re-analysed, NOT duplicated.
        status: reused
      - id: rejected-1
        object: the full endomorphism ring as an explicit order
        why_not_tracked: pinning the order needs the conductor, i.e. the same 257-bit factoring bottleneck AD5 already meets; tracked instead in bounded form.
      - id: rejected-2
        object: the Frobenius trace t alone
        why_not_tracked: strictly coarser than O1 and used only through it. Recorded so a reader sees it was considered.
    dominated_by: >-
      "n/a (no result claimed)" for any algorithmic or cryptanalytic claim: this
      task proposes no algorithm, moves no exponent, and mounts no attack, so
      there is no Pareto frontier row on time, memory, or data/queries for it to
      sit against. Stated as a deliberate declaration, not an unchecked null.
      AS AN AUDIT INSTRUMENT, however, the incumbents were checked and named:
      (i) the parameter-validation procedures mandated by the standards
      themselves, which dominate this plan on authority and on having been run
      for two decades; (ii) the SafeCurves project's published analysis, which
      dominates it on coverage and on having been peer-read - and which this
      task COULD NOT RETRIEVE (U1), so that domination is asserted from the
      project's reputation and not from anything read here; (iii) internally,
      IDEA-20260807-98a970 dominates lane AD4 completely, which is why AD4 is a
      specialisation of it rather than a new mechanism, and IDEA-20260807-51675e
      dominates lanes AD3 and AD5's classification step for the same reason.
      This plan dominates those incumbents on exactly one axis and the report
      claims no more: the outputs would live in this program's ledger with
      per-lane certificates, declared controls, and preregistered predictions.
    sota_delta: >-
      ZERO speedup against any attack baseline on every axis; none is sought.
      Quantitatively, as DATA: the corpus currently holds ZERO certified
      parameter measurements for brainpoolP256t1 or any Brainpool curve - the
      grep in the capsule's novelty screen found three literature records
      mentioning "Brainpool" (all `confidence: reported`, all abstract-only) and
      three proposals that enumerate Brainpool in a curve list without measuring
      one. The plan would produce 19 lane records (11 criteria + 8 diagnostics)
      for one curve, of which 9 carry re-verifiable certificates (L1 primality;
      L2 three residues; L3 the Hasse-uniqueness proof of #E = q; L4 and AD3 the
      |Aut| integer comparisons; L8 and L10-P1 the odd-order Lagrange argument;
      AD6 four residues; AD4's inherited witness chain) and the remainder carry
      explicit bounds with their non-succinct verification cost stated. As
      SCOPE: it would convert eleven user-supplied True/False cells with no
      recorded provenance into eleven measurements with stated operational
      definitions, stated controls, and stated limitations - while leaving the
      SafeCurves adjudication itself explicitly open (R1) rather than pretending
      to have closed it.
    closures_enumerated:
      - lane: no closure claimed
        statement: >-
          THIS SESSION CLOSES NOTHING. No direction is declared dead, no
          mechanism is declared impossible, and no lane is abandoned. Four
          components are recorded as BLOCKED with a named blocker and a concrete
          successor condition (see coverage_statement), which is a scheduling
          state, not a closure. Per the inventor protocol's closure standard, a
          closure would require a named obstruction with a measured quantity,
          an argument, and forward guidance; none of those is offered because
          nothing here warrants one.
      - lane: premature-closure check
        statement: >-
          The temptation this task specifically had to resist: the intake
          predicts four False cells (ladder, twist, complete, ind) and the
          derivation makes three of them look structurally forced by odd prime
          order. It would have been easy to declare those lanes settled without
          measurement. The plan instead splits `complete` into two inequivalent
          predicates with OPPOSITE predicted answers (L10 P1/P2), narrows
          `ladder` to the Montgomery-model question and says in the record that
          the broader ladder question is untested, and narrows `ind` to two named
          constructions. That is the concrete anti-premature-closure move made
          here, and it is also the anti-CONFIRMATION move, since all three
          narrowings cut AGAINST the direction the comparison target predicts.
    novelty_status: known
    novelty_status_justification: >-
      Every lane is standard parameter validation or a standard curve-property
      computation, publicly performed by standards bodies and by the SafeCurves
      project. The claim made here is provenance and certificate discipline, not
      mathematics. NOTE THE HONEST QUALIFIER: because U1 failed, this task cannot
      claim to have checked what SafeCurves says, so any downstream statement
      that leans on SafeCurves content must be recorded `unverified` until R1
      closes. `known` is claimed on the strength of S1 (a retrieved primary
      specification that states these very requirements) and the internal corpus
      screen, not on the strength of an unread website.
    open_directions_for_next_session:
      - Discharge PRE-1 (exact decimal/hex reconciliation) - milliseconds, and it is the precondition for every lane.
      - Run lane AD6 first - five seconds, and it settles what brainpoolP256t1 IS before anything measures it.
      - Retry U1, or read downloads/safecurves-20240809.pdf under an explicit read_scope, to unblock R1 and R2.
      - Obtain a decodable copy of the 2005 v1.0 Brainpool document (U2) to unblock AD8 stage A and adjudicate conflict C1.
      - Consider factoring the shared instrument once: GOAL-SCURVE-28e491 (brainpoolP384t1) is the same methodology on a sibling curve, and the manifest lists 20 such goals. Nineteen of the lanes here are curve-parametric. Building one reusable, controlled contract instead of 20 hand-written ones is a Coordinator-level decision this report flags but does not make.
      - Open question worth a scoped handoff on its own: quantify the seed-search leverage available under the Brainpool acceptability criteria (the BADA55-style question). It is the only part of the rigidity story that a successful transcript audit CANNOT close, and this task deliberately declined to estimate it from an unverified internal abstract.

  # ---------------------------------------------------------------------------
  # LIMITATIONS OF THIS TASK
  # ---------------------------------------------------------------------------
  limitations:
    - >-
      NO ARITHMETIC WAS PERFORMED BY MACHINE. This role held no code-execution
      capability in this session. Every quantitative statement in the capsule is
      either exact-by-inspection of hexadecimal strings (four such: A = p - 3;
      p = 3 mod 4; q < p; q identical for r1 and t1) or a disclosed hand
      magnitude estimate accurate to about 6-7 significant figures. NONE is a
      certificate and none should be cited as one.
    - >-
      ALL FETCHED PROSE IS MODEL-SUMMARIZED, not verbatim. The retrieval tool
      returns a rendering, not a transcript. Hexadecimal parameter blocks came
      back as literal strings and were cross-checked across two independent
      hosts; prose did not and could not be. This is recorded as R5 and every
      requirement statement in the capsule is labelled a hypothesis about the
      document rather than a quotation from it.
    - >-
      THE PRIMARY COMPARISON SOURCE WAS UNREACHABLE. safecurves.cr.yp.to
      returned HTTP 502 host-wide. The capsule and plan contain no SafeCurves
      content whatsoever, by design. This is an operational observation and is
      not evidence about the curve, about the intake row, or about the project.
    - >-
      THE CRYPTO-KB RETRIEVAL INDEX WAS NOT QUERIED. Whether it is populated in
      this worktree was not established. The prior-art screen used direct greps
      over knowledge/ and ledger/ instead. Absence of a search is recorded here
      rather than presented as absence of prior art, per the retrieval policy.
    - >-
      THE PLAN IS UNTESTED. No lane has been run, no control has been exercised,
      and no budget estimate has been validated against a real execution. The
      CPU figures are the capsule author's estimates for the stated environment
      and could be wrong; a successor executor must report the actual figures
      rather than these.
    - >-
      READ SCOPE WAS NARROW BY DESIGN. Three ledger files plus the bootstrap
      manifest and the role contracts. Related internal work (for example the
      sibling brainpoolP384t1 goal, or the local SafeCurves and BADA55 PDFs
      named by KN-LIT-6351 and KN-LIT-4290) was NOT read, and where it is cited
      the citation is explicitly labelled a pointer of limited authority.
    - >-
      DERIVATION CONSEQUENCES DC1-DC3 ARE ALGEBRA, NOT MEASUREMENT. Each is a
      one-line consequence of the map as rendered, checkable by substitution and
      costing no compute, and each is contingent on R5 and on AD6 verifying that
      Z lies in GF(p). They are stated so the plan can make them falsifiable
      predictions; they are not results.

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS  (proposals only - the Coordinator assigns)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    authority_note: >-
      These are PROPOSALS. This role assigns no work, allocates no identifiers,
      and changes no status. The Coordinator alone dispatches, and none of these
      exists until a committed TASK-* handoff says so.
    - proposal: T1
      to: executor
      objective: >-
        Run the cheap tier (AD6, L1, L2, L3, L4, L8, L10-P1, L11, AD3,
        L5-additive) plus the AD4 lower-bound pass, with the full shared control
        set, and emit per-lane certificates.
      gated_on: PRE-1 and PRE-3
      budget_suggestion: 3600 s wall clock, 1 GB, maximum_runs 1
      why_first: >-
        AD6 alone settles what the curve IS. The whole tier is under a minute of
        CPU and produces nine of the plan's re-verifiable certificates.
      blocking_control: the broken-Z positive control in AD6 and the singular-curve rejection in L2 must fire before any lane in the tier is interpreted.
    - proposal: T2
      to: executor
      objective: Run the medium and expensive tiers (L6, AD5, AD2, AD7, AD4-exact, AD1/L9) under the stated hard caps, reporting bounds where values are unreachable.
      gated_on: T1 completing with all controls passed
      budget_suggestion: 9000 s wall clock, 4 GB, maximum_runs 1
      honest_expectation: >-
        The twist-order factorization is expected to return a BOUND, not a
        value, in the assumed environment. That is a successful outcome and the
        handoff should say so in advance so a budget stop is not read as a
        failure.
    - proposal: T3
      to: idea-generator or executor (Coordinator's choice)
      objective: >-
        Source-access task: retry safecurves.cr.yp.to; obtain a decodable copy of
        the 2005 Brainpool v1.0 document; store a local RFC 5639 copy and re-quote
        Sections 2, 3 and Appendix A verbatim into a SUPERSEDING parameter
        capsule under a new ID.
      gated_on: nothing
      budget_suggestion: 1800 s wall clock
      unblocks: R1, R2, R5, U2, and therefore lanes L7 and AD8
      note: supersedes rather than edits - the capsule written here is immutable.
    - proposal: T4
      to: executor
      objective: Run AD8/L7, the generation-transcript audit, stages A-F with the blocking control gate.
      gated_on: T3
      budget_suggestion: 4-8 h implementation, 1800 s compute
      pre_commitment: >-
        If outcome H-C is reached with stage D passing, the result routes to
        independent `review-breakthrough` scrutiny BEFORE any statement leaves
