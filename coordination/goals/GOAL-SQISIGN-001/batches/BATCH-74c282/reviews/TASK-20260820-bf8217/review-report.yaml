  scope_checks:
    - check: GOAL_SQISIGN_versus_GOAL_SSI
      status: PASS
      detail: >-
        Every record confines its proposed observation to SQIsign transcripts,
        simulator behavior, explicit implementation interventions, or a
        transcript-to-certified-list bridge. Each denies an SSI hard-problem
        conclusion and leaves EndRing, OneEnd, path-finding, and official
