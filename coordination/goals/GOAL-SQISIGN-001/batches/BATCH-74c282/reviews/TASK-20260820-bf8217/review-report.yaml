    - check: sota_delta
      status: PASS_ALL_TWELVE
      detail: >-
        Every record states zero current improvement and quantifies only a
        future diagnostic, list, query, or end-to-end delta to be measured.

  baseline_checks:
    - check: KN_TECH_057
      status: PASS_CENTRAL_CEILING
      detail: >-
        Records preserve the Fp2 full-cost p^(1/2) path-finding comparator and
