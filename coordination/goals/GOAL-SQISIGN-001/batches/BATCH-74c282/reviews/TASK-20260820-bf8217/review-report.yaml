  verdict_summary: >-
    REVISE. The frozen snapshot, proposal schemas, local differentiation,
    genuine-simulator and planted controls, proof-search maps, six-axis costs,
    Pareto fields, SQIsign-versus-SSI ownership boundary, and the central
    KN-TECH-057/058 ceiling all hold at the proposal-only level. The batch is
    not administratively admissible unchanged for two citation reasons. First,
    eight records omit verified_by from every non-recalled source_refs entry,
    contrary to AGENTS.md rule 9 and templates/research-records.md. Second,
    eight records attach a binding or stated GRH boundary to KN-TECH-057/058,
    although neither technique record states that current claim; the recorded
    caveat is instead that the conditional Fp2 row depends on Heuristic 1,
    hides superpolynomial overhead, makes no concrete-parameter conclusion,
    and reaches downstream problems through reductions this program has not
    verified. The two sets overlap, so every proposal receives literal REVISE.
    These are repairable record-provenance defects, not evidence against any
    mathematical mechanism. Novelty remains unverified and no experiment,
    leakage, recovery, forgery, asymptotic improvement, or security conclusion
    is established.

  review_scope:
    kind: independent_zero_run_proposal_admissibility_review
    statement: >-
      Review is limited to frozen-artifact custody, schema completeness,
      visible-tree duplication, citation provenance, scope, controls,
      proof-architecture fields, cost accounting, Pareto honesty, and baseline
      wording. It validates no implementation, run, sample, theorem, decoder,
      distinguisher, recovery, forgery, security impact, or research-state transition.

