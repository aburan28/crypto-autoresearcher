        true-simulator design precedent, not as archived evidence or a conclusion.

  control_checks:
    - check: genuine_simulator_null
      status: PASS_ALL_TWELVE
      detail: >-
        Each empirical or constructive proposal runs the identical statistic,
        scorer, decoder, or pipeline on a genuine simulator matched in the
        transcript dimensions relevant to its claim.
    - check: planted_positive
      status: PASS_ALL_TWELVE
      detail: >-
        Each proposal supplies a calibrated positive intervention and a
        predeclared failure branch; inability to recover the plant invalidates
        or falsifies the test rather than becoming evidence against SQIsign.
    - check: nearby_object_or_artifact_control
      status: PASS_ALL_TWELVE
      detail: >-
        Each proof_search_map includes a nearby object or artifact diagnostic,
        including randomized graphs, independent commitments, iid schedules,
        marginal-preserving permutations, inert checkpoints, nonaliasing tags,
        dead serializers or coordinates, randomized labels, and legal re-encodings.
    - check: no_side_channel_smuggling
      status: PASS_FAULT_LANE
      detail: >-
        Fault-lane records explicitly exclude wall-clock time, retry counts,
        raw signature length, power, cache state, and branch traces, and retain
        rejection as an outcome rather than silently filtering it.

  proof_architecture_checks:
    - check: exact_baseline_reproduction
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
      limitation: >-
        These are preregistered plans only; no symbolic reproduction or frozen
        fixture has yet been executed.
    - check: observation_collision_search
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
      detail: >-
        Each map names a collision family or alternative cause and constrains
        any future list or localization claim by that collision class.
    - check: quantifier_order
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
      detail: >-
        Operators, policies, graphs, oracles, candidate universes, messages,
        seeds, q, stopping rules, holdouts, and coverage probabilities are
        ordered before evaluation.
    - check: method_ceiling
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
      detail: >-
        Every map denies a recovery or exponent conclusion from a distinguisher
        alone and includes a zero-gap, collision, or public-observable ceiling.
    - check: nearby_object_control
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
    - check: proof_claim_status
      status: PASS
      detail: >-
        The proof-oriented records propose theorem or certificate architectures
        but do not claim the theorem, strictness witness, invariant, or decoder exists.

  cost_model_checks:
    - check: six_axis_accounting
      status: PASS_ALL_TWELVE_AT_PROPOSAL_LEVEL
      axes:
        - time
        - memory
        - data or queries
        - preprocessing
        - oracle calls or success retries
        - verification
      detail: >-
        The fault and shrinkage lanes name oracle calls directly. The simulator
        lane charges real, simulator, planted-control, training, and failed or
        low-power reruns through data_or_queries and success_retries.
    - check: per_attempt_times_inverse_success
      status: PASS_AT_DESIGN_LEVEL
      detail: >-
        Recovery-oriented records explicitly charge inverse coverage or
        verification success. Empirical records charge replication, inverse
        power, multiplicity, rare-stratum misses, and unusable forks.
    - check: time_memory_tradeoff
      status: PASS
      detail: >-
        Memory is reported beside time; high-memory conditional Fp2 and
        separate field-sensitive rows are not silently collapsed.

