  baseline_source_screen:
    kn_tech_057: >-
      Correctly supplies a full-cost classical path-finding comparator:
      Fp2 VW p^(1/2), and a distinct conditional Fp VW p^(1/4) mixing row with
      DG p^(1/3) as the unconditional fallback in that regime. It does not
      itself establish transcript leakage or a SQIsign attack.
    kn_tech_058: >-
      Correctly separates unconditional Fp2 p^(1/2)(log p)^O(1) time at
      polynomial memory from heuristic-conditional p^(1/3+o(1)) time and
      memory under Heuristic 1. The conditional row carries superpolynomial
      hidden overhead, no concrete-parameter conclusion, and inherited
      reductions that this program has not verified.
    grh_wording_finding: >-
      Eight candidates additionally say that a GRH boundary is binding or
      attached. Neither KN-TECH-057 nor KN-TECH-058 states that current claim.
      The exact phrase therefore lacks support from the records cited for it.
      Replace it with KN-TECH-058's narrower recorded reduction-status caveat,
      or add a directly read citation with the actual verifier in verified_by.
    affected_ids:
