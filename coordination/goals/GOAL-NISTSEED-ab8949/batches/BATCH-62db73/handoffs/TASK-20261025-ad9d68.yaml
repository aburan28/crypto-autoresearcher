  fixed_future_control:
    fixture:
      id: public-prime101-default
      public_input: "101\n"
    primary_configuration:
      argv: [/program, -l, /ecpp/, -f, /input, -Fc, -C, /tmp/certificate]
      checker_argv: [/program, -f, /input]
      full_original_catalog: true
      original_factor_parameters: true
      proving: true
      n_minus_1: true
      n_plus_1: true
      distributed: false
      debug: false
      fresh_process_rng: 'original ModInitialize: srandom(1)'
      fresh_vm_per_control: true
    limits:
      emulated_cpus: 1
      vm_ram_mib: 256
      child_address_space_mib: 128
      prover_guest_seconds: 300
      prover_host_seconds: 390
      checker_guest_seconds: 30
      checker_host_seconds: 90
    runtime_binding: >-
      Reuse the exact public runtime-bindings.json payload hashes, kernel hash,
      and original Data inventory. The local hydrated bytes are existing public
      inputs; the separate canonical-store HTTP 403 remains unresolved and is
      not retried by this task.
  future_runtime_api:
    module: experiments/EXP-NISTSEED-6886da/aa-admission/aa_fixture_producer.py
    function: build_pair(left_output, right_output, binding_manifest, legacy_boundary=None)
    rules:
      - >-
        Require distinct, nonexistent, non-symlink left/right output directories
        and one exact binding manifest naming fixture id public-prime101-default
        and public_input `101\n`; reject every arbitrary input, cohort index,
        cohort UID, n, p, label, or reused destination.
      - >-
        Before calling a future real boundary, rehash all bound sources, runtime
        payloads, kernel, original Data inventory, and binding manifest. Create
        a private per-control runtime-cache/images path under each distinct output.
      - >-
        The future real branch invokes the unchanged original default prover and,
        when a certificate exists, the unchanged checker in a second fresh VM.
        It retains raw prover/checker serial, stderr, result/started records,
        certificate bytes, exact input bytes, command/configuration identities,
        and all statuses. It must not call cohort_runner.run_trial or
        cohort_case.execute_case for this non-cohort control.
      - >-
        Derive each A/A document from retained raw artifacts, not handwritten
        JSON. Its top-level keys are exactly fixture, trace, prover, checker,
        certificate, classification, labels, and runtime. fixture is exactly
        `{id: public-prime101-default, public_input: "101\\n"}`.
      - >-
        Control validity is checked before equality: valid framing, child exit
        zero, exactly one prime label, complete root-101 certificate grammar,
        exact parsed step count, second fresh checker framing, checker acceptance,
        fixed runtime/configuration/data/binary/input identities, and retained raw
        byte hashes are all required. Only then may aa_compare normalize its
        documented incidental fields and compare the pair.
      - >-
        Timeout, crash, empty document, malformed/missing certificate, invalid
        framing, checker rejection, wrong root, status inconsistency, or any
        missing raw artifact is CONTROL_INVALID/INDETERMINATE. Preserve each
        failed control directory, refuse A/A equality, and expose a future
        scientific stop-before-cohort signal. Two identical invalid documents
        never establish repeatability.
  constraints:
    - >-
      maximum_runs is zero. Do not execute the future real branch, execute_case,
      vm, runecpp, checkcertif, QEMU, Docker, a subprocess legacy boundary, a
      cohort number, or a storage upload/push.
    - >-
      Do not modify archived cohort runner/checker files, frozen cohort/source
      files, runtime payload bindings, existing controls, task releases, archive
      receipts, or any storage policy.
    - >-
      The public storage HTTP 403 is an access condition only. Existing hydrated
      fixed runtime bytes remain inputs; do not add an account, alternate store,
      pointer, credential, bypass, or fabricated upload result.
    - >-
      The new implementation must use the public helper/source interfaces above;
      it must not solve the missing producer merely by constructing arbitrary mock
      JSON and passing it to aa_compare.
  deliverables:
    - experiments/EXP-NISTSEED-6886da/aa-admission/aa_fixture_producer.py
    - experiments/EXP-NISTSEED-6886da/aa-admission/test_aa_fixture_producer.py
    - experiments/EXP-NISTSEED-6886da/aa-admission/aa_fixture_schema.json
    - experiments/EXP-NISTSEED-6886da/aa-admission/test-report.txt
    - experiments/EXP-NISTSEED-6886da/aa-admission/IMPLEMENTATION_REPORT.md
  artifact_paths:
    - experiments/EXP-NISTSEED-6886da/aa-admission/aa_fixture_producer.py
    - experiments/EXP-NISTSEED-6886da/aa-admission/test_aa_fixture_producer.py
    - experiments/EXP-NISTSEED-6886da/aa-admission/aa_fixture_schema.json
    - experiments/EXP-NISTSEED-6886da/aa-admission/test-report.txt
    - experiments/EXP-NISTSEED-6886da/aa-admission/IMPLEMENTATION_REPORT.md
  write_scope:
