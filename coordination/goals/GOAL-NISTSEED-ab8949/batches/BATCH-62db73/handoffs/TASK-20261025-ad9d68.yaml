    reasoning_effort: medium
    backend: openai
    resolved_model_id: gpt-5.6-terra
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
    binding_note: >-
      Standard medium executor binding only. TASK-20261024-4f1bf4's task-local
      high-effort amendment and exact-session receipt do not apply to this new task.
  budget:
    maximum_runs: 0
    memory_gb: 2
  completion_gate:
    - >-
      Mocked tests replace the entire legacy/VM/subprocess boundary and record
      named_orders_executed: 0 and legacy_program_executed: false.
    - >-
      A complete valid synthetic raw-artifact pair is accepted only after the
      real aa_compare function and separate control-validity gate both succeed.
    - >-
      Mutations of fixture identity, public input, trace, prover status, checker
      status, certificate/root/step count, labels, runtime/configuration/data
      identity, raw-byte hashes, and destination freshness are individually refused.
    - >-
      Identical timeout, crash, empty, malformed-certificate, invalid-framing,
      or checker-rejected pairs are CONTROL_INVALID/INDETERMINATE and cannot pass
      the A/A result.
    - >-
      The report preserves the public storage 403 as unresolved and states no
      upload, named order, legacy program, scientific readiness, or conclusion.
  return_format: >-
    Five declared source/test/report artifacts with SHA-256 values, exact mocked
    command/output records, retained failure cases, and explicit zero-run scope.
