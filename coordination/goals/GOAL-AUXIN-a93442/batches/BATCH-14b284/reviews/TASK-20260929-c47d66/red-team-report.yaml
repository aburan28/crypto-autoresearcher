      joint: EJ3
      summary: >-
        Independent phrase inventory finds the self-referential phrase
        "this draft" / "This draft" in fresh fields (hypothesis_binding,
        write_scope note, authorization). It is absent from
        self_reference_table. R4 closure row states every self-referential
        phrase appears in the table and an unlisted phrase is a draft defect.
        Named EJ3-CLOSURE-EXP-AUXIN-92dccc is fixed (EXP-AUXIN-55c6c0 is in R1
        and the table); this is a residual unlisted deictic the plan warned
        about.
      breaking_artifact: >-
        Unlisted self-referential phrase "this draft" against R4 closure.
      control_comparison: >-
        F-READ order audit PASS retained as narrow observation on listed R1
        phrases; not a control error on that scope; missed unlisted deictics.
    - id: EJ6-OVERLAY-AMD-INVALIDATION
      joint: EJ6
      summary: >-
        protocol_normative.corrective_overlays[0].custody.invalidation_rules_added
        states (1) any edit of AMD-20260927-narrow.yaml after approval is
        evidence-integrity failure and (2) any byte difference between
        AMD-20260926-typed.yaml and incorporates.sha256 is evidence-integrity
        failure. Own TMPDIR held-file mutation leaves draft bytes unchanged
        while those stated rules flip solely because held AMD bytes/hashes
        change. Also: threshold_inventory text says the index is this field
        together with corrective.threshold_inventory_added of
        AMD-20260927-narrow.yaml. Prior READ FROM / stand / FC content-digest
        surfaces are removed; EJ6-B1 remains not_fixed via these overlay
        surfaces. F-CUSTODY.independence / void-held-path rule conflict with
        the overlay rather than delete it from the text.
      breaking_artifact: >-
        Stated overlay invalidation rules whose outcomes change when held
        AMD-20260927-narrow.yaml / AMD-20260926-typed.yaml bytes change and
        the successor draft bytes do not.
      control_comparison: >-
        held-file mutation PASS checked dirty/manifest/admission/top-level
        invalidation dirty phrases only; missed corrective_overlays
        invalidation_rules_added. PASS retained as narrow observation; EJ6
        still breaks.
    - id: EJ8-INCORP-HASH-VS-FPREC
      joint: EJ8
      summary: >-
        Same overlay AMD/hash invalidation rules conflict with F-PREC
        ("No record is bound by content-digest of a held path"; reserved
        topics: held records are not sources of run-time rules). Named
        EJ8-T0124 is fixed (D4 forbids later amendment; F-REV is the only
        revision route).
      breaking_artifact: >-
        Overlay hash/AMD invalidation vs F-PREC reserved governing claim.
    - id: EJ8-Q0-11-NOT-NEUTRALIZED
      joint: EJ8
      summary: >-
        conventions.Q0-11 states source-file precedence and forbids taking
        any recipe/rule/tolerance/integer from a referenced record (except
        Stage P primary sources and named implementation paths). Fresh F-PRE
        requires carrying DEC-20260927-f680f7 dispatch_preconditions_carried
        by loading a string identified by sha256 — taking a rule payload from
        a referenced decision. F-PRE decides LOAD; Q0-11 decides DO-NOT-TAKE.
        F-PREC.reserved_topics allows protocol_normative sections to decide
        reference reading only when named in the design report; Q0-11 is not
        so named. Not neutralized by F-READ R3 (provenance only for decisions)
        which agrees with Q0-11 against F-PRE.
      breaking_artifact: >-
        Q0-11 vs F-PRE load-by-hash on a reserved reference-reading question;
        path protocol_normative.conventions.Q0-11.
      control_comparison: Confirms reserved-topic CONFLICT_FOUND on Q0-11; not a control error.
  required_controls:
    - >-
      Any successor draft must inventory all self-referential deictics (not
      only F-READ R1 phrases) into self_reference_table under R4 closure.
    - >-
