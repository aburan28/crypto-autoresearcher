      recorded here.
    QB1:
      per_state_fields: status, witness set, witness, tie set, bin, bin_at_least, boundary_flag, upper bound, lower bound, depth, gate 1, N4
      BND-1: {all_categorical_equal: true, upper_bits_diff: 0.0, lower_bits_diff: 0.0, depth_abs_diff: 0.0, gate1_equal: true, N4_equal: true}
      BND-2: {all_categorical_equal: true, upper_bits_diff: 0.0, lower_bits_diff: 0.0, depth_abs_diff: 0.0, gate1_equal: true, N4_equal: true}
      BND-3: {all_categorical_equal: true, upper_bits_diff: 0.0, lower_bits_diff: 0.0, depth_abs_diff: 0.0, gate1_equal: true, N4_equal: true}
      recipe_integers: >-
        All fourteen C-PLANT-M and C-PLANT-P recipe integers equal. The
        candidates-examined fields differ in shape only: RJ1 records one count
        per recipe, which equals the re-deriver's count for the last (wide
        window) search of that recipe; the re-deriver also records the
        per-divisor counts RJ1 did not record. No disagreement on a common
        quantity.
      determinacy: >-
        RJ1: one outcome on every state (24 of 24 gating cases one_outcome).
        RJ5: one outcome under its adopted reading Q0-B (i); two outcomes
        (gate 1 pass, N4 met) under the literal reading Q0-B (ii), on every
        state. See key K-indeterminate.
      result: agree within tolerance on every compared value
    QB2:
      comparable: categorical only
      note: >-
        Each implementation constructed its own NEAR_FLOOR BOUND state, as
        QB2 and RJ1 (iii) ask; the states are different by construction, so no
        value-level comparison exists. Both report BOUND, NEAR_FLOOR,
        bin_at_least NEAR_FLOOR, flag false, gate 1 pass, N4 not met. RJ5
        reports this under Q0-C reading (i) (reviewer-evaluation mode) and
        records that the expected status, witness set and witness of an
        undeclared state are named only by implication.
      result: categorical agreement; Q0-C residual recorded
    QB3:
      BND-1: {absent: [fail, fail], wrong: [fail, fail], equal: true}
      BND-2: {absent: [fail, fail], wrong: [fail, fail], equal: true}
      BND-3: {absent: [fail, fail], wrong: [fail, fail], equal: true}
      own_states: RJ1 OWN-1..3 and RJ5 OWN-1 all fail gate 1 when bin_at_least is absent or wrong
      result: agree
    QB4:
      tolerance: exact set equality on (cut-off, quantity, layer) over typed, narrow, gated; fires K-indeterminate only if a differing cut-off governs a run-time decision or the completeness claim
      completeness_claim: both report the gated layer drops it (RJ2 by script over four layers; RJ5 by quotation). Agree.
      omissions_both_found: [floor(R) < 1 F2 skip, lower control-gate slack, C-BOUND closed-form tolerance, BND-1 consistency tolerance, ECPP step bound]
      omissions_rj2_only: [HTTP non-200 infrastructure stop (typed, run-time), PR-SP800 label quantifier (typed, run-time), ECM probe parameters (typed; RJ5 lists them as self-test inputs in its annex), probe three-line counts (narrow; RJ5 lists as equality tests in its annex), typed restatement of budget limits]
      omissions_rj5_only: [planted-divisor size rule (typed), F3 hard timeout R (typed, borderline), null-arm sampler range (typed, borderline), PR-RFC7748 whitespace rule (typed, borderline), superseded minimum PARI version (governs nothing)]
      v1_layer: RJ5 did not open v1 by whitelist (Q0-H); RJ2 did. Outside the QB4 comparison set.
      cause: >-
        Convention and scan recall, not a disputed value: RJ5 declares Q0-I
        open (what counts as a cut-off; restatements) and a disclosed scan
        recall limit. Neither side disputes any cut-off's text.
      result: >-
        Set equality FAILS on run-time cut-offs (both lists contain run-time
        items the other lacks). Under the literal frozen tolerance this meets
        the K-indeterminate condition. Because the completeness claim is
        dropped and the index governs nothing, the practical effect is on the
        index's usefulness as a checklist (RJ2 OBS-1), not on any run-time
        outcome.
    q0_open_choices_with_residual:
      - {id: Q0-B, affects: "N4 outcome and stopping rule 10 on every C-BOUND state (run-time decision)", declared_immaterial_by_text: false, corroborated_by: "RJ1 OBS-3 (pre-existing; not changed by the draft)"}
      - {id: Q0-C, affects: "expected status, witness set and witness for a reviewer-constructed state (reviewer-evaluation mode only; in a run the state is invalid_measurement)", declared_immaterial_by_text: false}
      - {id: Q0-H, affects: "QB4 completeness over v1 (by whitelist design; the plan anticipated it as RJ3 evidence)", declared_immaterial_by_text: false}
      - {id: Q0-I, affects: "QB4 set equality (convention)", declared_immaterial_by_text: false}
    rj5_joint_reading: >-
      RJ5 AGREES with RJ1 on every QB1 and QB3 value and categorically on QB2;
      it DISAGREES with RJ2 on QB4 set membership; and it REPORTS open material
