  rj5_comparison:
    method: >-
      Script comparison of reviews/TASK-20260928-b2f828/computations.json
      (RJ1.ii_to_iv_evaluation.c_bound, .gating_tests, RJ1.i_control_build)
      with reviews/TASK-20260928-7cb2a6/computations.json
