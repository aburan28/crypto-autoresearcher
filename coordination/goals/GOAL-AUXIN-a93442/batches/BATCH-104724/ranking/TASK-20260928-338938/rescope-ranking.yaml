  trajectory: >-
    Third refusal on this lineage. The break surface has shrunk each round:
    AMD-20260923-d1d10 was refused on D1 to D10; AMD-20260926-typed on DF-1 to
    DF-6 with RI-1 to RI-9; AMD-20260927-narrow on DF-N1 and DF-N2 with seven
