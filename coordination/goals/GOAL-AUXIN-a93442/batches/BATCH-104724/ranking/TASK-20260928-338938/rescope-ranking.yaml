  broken_joints:
    NJ4:
      - {id: DF-N1, kind: cross-layer outcome determinacy, text: "The corrective bin_by_status (DF-6) changes what held condition N4 tests on two NEAR_FLOOR BOUND states while held C-BOUND gate 1 still skips bin_at_least there. One evaluator gets two outcomes; the DF-6 fix is defined but not gated. Named repairs (a) or (b) put DF-6 under test; (c) alone does not."}
