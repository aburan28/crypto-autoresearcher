  pattern_this_round: >-
    Both remaining breaks are CROSS-LAYER defects, not defects inside one
    layer. DF-N1 is a newer-layer clause changing what an older-layer clause
    tests without superseding it. DF-N2 is a completeness claim in a newer
    layer that fails over older layers. This is the class the three-layer
    construction was flagged for in the b9dba5cced ranking (option-3 cost
