      - {id: DF-N2, kind: cross-layer completeness claim, text: "The threshold inventory claims completeness and omits cut-offs present in governing held text."}
  carried_errata: ER-1 to ER-7 (DEC-20260927-f680f7 errata_to_carry), all text-level; ER-1 and ER-2 concern layer precedence, ER-3 to ER-5 NJ3 wording, ER-6 and ER-7 two undeclared phrases the blind joint reported and composition ruled immaterial at the pinned bytes.
  held_joints: >-
