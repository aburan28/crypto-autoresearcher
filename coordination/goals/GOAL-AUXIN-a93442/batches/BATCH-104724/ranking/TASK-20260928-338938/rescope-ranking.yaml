  # ---------------------------------------------------------------------------
  # The ranking of the three scopes the guard names.
  # ---------------------------------------------------------------------------
  ranking:
    - rank: 1
      scope_id: S-narrow
      label: further narrow additive corrective limited to DF-N1, DF-N2 and ER-1 to ER-7
      reason_tied_to_joints: >-
        Each of the two breaks is one item with a named repair. DF-N1 (NJ4) has
        repairs (a) and (b), either of which defines AND gates bin_at_least on
        the NEAR_FLOOR BOUND states; DF-N2 (NJ5) has two admissible repairs
        (add each omitted cut-off with the quantity it reads, or drop the
        completeness claim). Everything that held stays byte-identical by
        hash: the executed pin and tool layer (NJ1, NJ2), which broke twice
        and now holds on reproduced transcripts; the scope and mapping layer
        (NJ3); and the recipe layer, on which the blind joint agreed for the
        third round running. A narrow scope keeps every one of those results
        in force, where option 2 would have to re-earn all of them. The
        break surface has shrunk every round, so the evidence points to
        convergence, not to a construction that cannot converge.
      costs_and_risks: >-
        (a) A FOURTH layer of text: v1, typed-by-hash, narrow-by-hash, and the
        new corrective. Both remaining breaks are cross-layer, and a fourth
        layer enlarges exactly that surface: every older clause that reads a
        newly corrected field is a new place for a DF-N1-class break, and every
        totality or completeness claim now ranges over four layers. (b) ER-1
        itself asks for path-level additions read as a union, which a fourth
        layer makes longer. (c) The diminishing-returns guard exists because
        narrow repairs can keep surfacing one new cross-layer defect per
        round.
      conditions_that_answer_the_risks:
        - {id: CN-1, text: "Reader map. For every span the new corrective supersedes or adds, list every clause in every older layer (v1, typed, narrow) that reads the field, and state that clause's outcome under the new text. This targets the DF-N1 class directly, before review."}
        - {id: CN-2, text: "DF-N1 is repaired by (a) or (b) or both, never by (c) alone, and the repair is stated so that an evaluator correct under the new text has exactly one outcome for C-BOUND gate 1 and N4 together on every C-BOUND state."}
        - {id: CN-3, text: "DF-N2: the inventory either drops its completeness claim or claims completeness over all four layers explicitly, listing each cut-off with the quantity it reads, its source layer and span anchor."}
        - {id: CN-4, text: "Supersede only spans named by DF-N1, DF-N2 and ER-1 to ER-7. Incorporate AMD-20260927-narrow by content hash (which itself incorporates AMD-20260926-typed by hash); retype no held text; edit no existing amendment."}
        - {id: CN-5, text: "Touch no executed-layer field (pins, locators, FP, tool admission, timeout). If the producer finds it must, it re-executes those items against the pinned sources and declared builds and archives transcripts, and the plan's K-executed-layer governs."}
        - {id: CN-6, text: "Pre-committed stop (frozen as K-layer-outcome). A recurrence of the DF-N1 class anywhere across the layers, or DF-N1 or DF-N2 left undischarged, ends the narrow lineage: the next selection point takes option 2 without re-ranking S-narrow."}
    - rank: 2
      scope_id: S-option-2
      decision_alias: RS-B
      label: successor experiment stating every rule once
      movement: Up from rank 3 in the b9dba5cced ranking.
      reason_tied_to_joints: >-
        Moved up for two joint-level reasons. First, both remaining breaks
        (NJ4, NJ5) are cross-layer defects, the one class that stating every
        rule once removes by construction; the disclosed alternative K-layer
        reading points here too. Second, the case for option 1 has gone (see
        rank 3), so option 2 is now the only structural alternative to
        layering.
      why_not_first: >-
        It re-types every layer that held: the executed pin and tool layer
        (NJ1, NJ2) and the scope and mapping layer (NJ3), plus the recipe layer
        the blind joint agreed on three times. That reopens every joint, the
        whole regression set and the full control-integer re-derivation, and
        a rewrite is exactly how DF-5 entered the second revision. It aims at
        DF-N1 and DF-N2 no more precisely than S-narrow does. Its own switch
        condition has not fired under its literal text. Two practical costs
        are recorded without being the ranking reason: the frozen shell's
        producer_eligibility and the batch's binding_for_every_scope both say
        "retypes no held text", so selecting option 2 would need an additive
        plan amendment declaring verbatim transclusion (span-hashed copy, no
        paraphrase) to count as not retyping; and a successor experiment
        would need a new EXP id and a restated binding to H-AUXIN-6db354,
        which would naturally pull in the H correction and enlarge scope
        further.
      stays_live_under: >-
        K-layer-outcome or K-layer firing in REVIEW-AUXIN-20260928-104724, a
        K-route-switch, or the H-AUXIN-6db354 correction changing the
        experiment's binding to H.
    - rank: 3
      scope_id: S-option-1
      decision_alias: RS-A
      label: split the pins and tool-admission layer into its own amendment
      movement: Down from rank 2 in the b9dba5cced ranking.
      reason_tied_to_joints: >-
        Its only benefit was isolating the pin and tool layer so that a defect
        there could not refuse a determinate census text. That layer now
        holds: NJ1 and NJ2 held with transcripts reproduced on the declared
        builds, and K-provision engaged only in its benign branch. Neither
        remaining break is in that layer, so a split addresses neither DF-N1
        nor DF-N2. Its costs, as the b9dba5cced ranking recorded, stand:
        a cross-amendment interface neither round has reviewed (FP against
        the C-FIELD values; BN254-r against the null arm), two review rounds,
        and more layers of text, not fewer.
      stays_live_under: >-
        K-executed-layer or K-provision (failing branch) firing in
        REVIEW-AUXIN-20260928-104724, which would happen only if the new
        corrective touches the executed layer (CN-5).
