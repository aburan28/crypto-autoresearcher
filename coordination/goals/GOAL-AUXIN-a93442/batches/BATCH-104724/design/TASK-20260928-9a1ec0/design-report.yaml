    files:
    - /Volumes/SSD990/tmp/gated_builder/build.py
    - /Volumes/SSD990/tmp/gated_builder/stage2.py
    build_py_sha256: e1d3deb05e5e829d62b65d2a5121b340ec84974d3d7ffe34ae283f41ed94a738
    stage2_py_sha256: 8493d8bca46f25533d2abafa06e61d6af5370e7847d7555f735199a5d441e222
    build_py: |
      #!/usr/bin/env python3
      """Builder for AMD-EXP-AUXIN-7e2e3d-20260928-gated and its design report.

      Run from the worktree root. Reads the three governing layers by path, checks
      their sha256, assembles the new amendment, computes every span hash from the
      held bytes (no held text is typed by hand), builds the four-layer governing-text
      table, runs every check, and writes the two declared files only if all checks
      pass. Writes nothing else inside the repository.
      """
      import hashlib
      import json
      import re
      import sys
      from pathlib import Path

      import yaml

      sys.path.insert(0, "tools")
      from check_review_independence import protected_hashes, _token_hashes  # noqa: E402

      ROOT = Path(".")
      V1_PATH = "experiments/EXP-AUXIN-7e2e3d/specification.yaml"
      TY_PATH = "experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml"
      NA_PATH = "experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml"
      GA_PATH = "experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml"
      DR_PATH = ("coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-104724/design/"
                 "TASK-20260928-9a1ec0/design-report.yaml")
      V1_SHA = "1f803aa0a535e4c0a321dfcb3851b89cbd4cae23596ad70e1aa1fd1b06639fbc"
      TY_SHA = "3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6"
      NA_SHA = "ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd"
      DIGEST_SOURCES = [
          "coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-104724/ranking/TASK-20260928-338938/blind-phase-hygiene.yaml",
          "coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/batch.yaml",
          "coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/batch.yaml",
      ]

      CHECKS = []


      def check(name, ok, detail=""):
          CHECKS.append({"check": name, "result": "PASS" if ok else "FAIL", "detail": detail})
          if not ok:
              raise SystemExit(f"CHECK FAILED: {name}: {detail}")


      def sha(b):
          return hashlib.sha256(b).hexdigest()


      raw = {k: (ROOT / p).read_bytes() for k, p in (("v1", V1_PATH), ("typed", TY_PATH), ("narrow", NA_PATH))}
      check("v1 sha256", sha(raw["v1"]) == V1_SHA, sha(raw["v1"]))
      check("typed sha256", sha(raw["typed"]) == TY_SHA, sha(raw["typed"]))
      check("narrow sha256", sha(raw["narrow"]) == NA_SHA, sha(raw["narrow"]))
      V1 = yaml.safe_load(raw["v1"])["experiment"]
      TY = yaml.safe_load(raw["typed"])["amendment"]
      NA = yaml.safe_load(raw["narrow"])["amendment"]


      def ctrl(i):
          return [c for c in TY["controls"] if c.get("id") == i][0]


      def state(i):
          return [s for s in ctrl("C-BOUND")["states"] if s["id"] == i][0]


      def span(value, frm, thr):
          """narrow incorporates.span_hash_convention, applied to a loaded string value."""
          assert value.count(frm) == 1, (frm, value.count(frm))
          a = value.index(frm)
          b = value.index(thr, a) + len(thr)
          s = value[a:b]
          return s, sha(s.encode("utf-8"))


      # ---------------------------------------------------------------------------
      # Held values the spans are cut from (read, never typed).
      # ---------------------------------------------------------------------------
      HELD = {
          "G-GATE1": ("typed", "controls[C-BOUND].gates item 1", ctrl("C-BOUND")["gates"][0]),
          "G-BND1": ("typed", "controls[C-BOUND].states[BND-1].expected", state("BND-1")["expected"]),
          "G-BND3": ("typed", "controls[C-BOUND].states[BND-3].expected", state("BND-3")["expected"]),
          "G-Q011": ("typed", "conventions.Q0-11", TY["conventions"]["Q0-11"]),
          "G-CPL": ("narrow", "corrective.declared_not_superseded item 1.declaration",
                    NA["corrective"]["declared_not_superseded"][0]["declaration"]),
          "G-WII": ("narrow", "incorporates.what_is_incorporated", NA["incorporates"]["what_is_incorporated"]),
          "G-ENV": ("narrow", "envelope_not_incorporated.rule", NA["envelope_not_incorporated"]["rule"]),
      }
      FROM = {
          "G-GATE1": "bin_at_least (where stated)",
          "G-BND1": "bin NEAR_FLOOR, boundary_flag false.",
          "G-BND3": "bin NEAR_FLOOR, boundary_flag false.",
          "G-Q011": "Every reference in this file to another record, report or file",
          "G-CPL": "The phrase giving an absolute tolerance on s is kept.",
          "G-WII": "(a) the fields and spans listed in supersedes_fields and span_rules below,",
          "G-ENV": "The field of the same role in this file governs instead.",
      }

      # The kept C-PLANT-PL phrase (ER-5), extracted from the held bytes by quotation.
      PL_DECL = ctrl("C-PLANT-PL")["declared_properties"]
      PL_QUOTE, PL_QUOTE_SHA = span(PL_DECL, "Hence the plus minimiser is D_L, uniquely,", "by a wide margin.")
      check("ER-5 quotation contains the only absolute tolerance of the field",
            PL_QUOTE.count("10^-6") == 1 and PL_DECL.count("10^-6") == 1, PL_QUOTE)
      # v1 tail_checks item 1 (ER-3), extracted.
      V1_TAIL1 = V1["tail_checks"][0]
      V1_TAIL1_SHA = sha(V1_TAIL1.encode("utf-8"))
      check("ER-3 v1 tail_checks item 1 is the missing-branch rule", "missing branch voids the row" in V1_TAIL1, V1_TAIL1)
      INV_CLAIM_NARROW = NA["span_rules"][[r["id"] for r in NA["span_rules"]].index("INV-CLAIM")]["replacement"]
      FC6_NARROW = NA["corrective"]["falsification_condition_mapping"]["rows"][5]
      check("narrow RI-1 row 6 is FC6", FC6_NARROW["fc"].startswith("FC6"), FC6_NARROW["fc"])
      check("narrow RI-1 row 5 is FC5 -> N4", FC6_NARROW is not None and
            NA["corrective"]["falsification_condition_mapping"]["rows"][4]["outcome"] == "N4_BOUND_EVALUATOR_FALSIFIED")

      REPL = {
          "G-GATE1": "bin_at_least",
          "G-BND1": "bin NEAR_FLOOR, bin_at_least NEAR_FLOOR, boundary_flag false.",
          "G-BND3": "bin NEAR_FLOOR, bin_at_least NEAR_FLOOR, boundary_flag false.",
          "G-Q011": ("Every reference made inside the text of AMD-20260926-typed.yaml (the file in which this "
                     "convention is written) to another record, report or file"),
          "G-CPL": ("The kept phrase is identified by verbatim quotation from "
                    "controls[C-PLANT-PL].declared_properties of AMD-20260926-typed.yaml, as a YAML safe loader "
                    "returns that value: \"" + PL_QUOTE + "\" (sha256 of its UTF-8 bytes " + PL_QUOTE_SHA +
                    "). It bounds the plus-branch exponent gap e_plus - F_plus, not the depth s; the earlier "
                    "description \"an absolute tolerance on s\" is replaced by this quotation. The phrase is kept "
                    "as written and no gate reads it."),
          "G-WII": ("(a) the fields and spans listed in supersedes_fields and span_rules of "
                    "AMD-20260927-narrow.yaml, and the fields and spans of AMD-20260926-typed.yaml listed in "
                    "supersedes_fields and gated_span_rules of AMD-EXP-AUXIN-7e2e3d-20260928-gated,"),
          "G-ENV": ("The field of the same role in AMD-EXP-AUXIN-7e2e3d-20260928-gated "
                    "(experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml) governs instead."),
      }
      ITEM = {"G-GATE1": "DF-N1 repair (a)", "G-BND1": "DF-N1 repair (b)", "G-BND3": "DF-N1 repair (b)",
              "G-Q011": "ER-2", "G-CPL": "ER-5", "G-WII": "ER-1", "G-ENV": "ER-1"}

      SPAN_RULES = []
      for sid in ["G-GATE1", "G-BND1", "G-BND3", "G-Q011", "G-CPL", "G-WII", "G-ENV"]:
          layer, field, value = HELD[sid]
          s, h = span(value, FROM[sid], FROM[sid])
          SPAN_RULES.append({
              "id": sid,
              "layer": "typed-by-hash" if layer == "typed" else "narrow-by-hash",
              "file": TY_PATH if layer == "typed" else NA_PATH,
              "field": field,
              "from": FROM[sid],
              "through": FROM[sid],
              "replaced_span_sha256": h,
              "replacement": REPL[sid],
              "item": ITEM[sid],
          })

      # The replaced G-BND spans must leave the rest of each expected block intact.
      for sid in ("G-BND1", "G-BND3"):
          v = HELD[sid][2]
          check(f"{sid}: state expects status BOUND and unflagged NEAR_FLOOR", v.startswith("status BOUND.") and FROM[sid] in v)
      check("BND-2 already states bin_at_least NEAR_CEILING",
            "bin UNDETERMINED with bin_at_least NEAR_CEILING" in state("BND-2")["expected"])
      check("typed bin_by_status silent on bin_at_least at BOUND NEAR_FLOOR (the E0 gap)",
            "NEAR_FLOOR if s >= 3/4 + tau (the true value is at least as deep). Otherwise the bin is UNDETERMINED and bin_at_least"
            in TY["change"]["D3_descriptive_bins"]["bin_by_status"])
      check("narrow bin_by_status gives BOUND NEAR_FLOOR -> bin_at_least NEAR_FLOOR",
            {"status": "BOUND", "bin": "NEAR_FLOOR", "bin_at_least": "NEAR_FLOOR"} in NA["corrective"]["bin_by_status"]["totality_table"])

      # ---------------------------------------------------------------------------
      # The amendment.
      # ---------------------------------------------------------------------------
      GATED_ID = "AMD-EXP-AUXIN-7e2e3d-20260928-gated"

      SUPERSEDES = [
          {"field": "controls[C-BOUND].gates item 1", "layer_superseded": "typed-by-hash", "extent": "span G-GATE1",
           "item": "DF-N1 repair (a)"},
          {"field": "controls[C-BOUND].states[BND-1].expected", "layer_superseded": "typed-by-hash", "extent": "span G-BND1",
           "item": "DF-N1 repair (b)"},
          {"field": "controls[C-BOUND].states[BND-3].expected", "layer_superseded": "typed-by-hash", "extent": "span G-BND3",
           "item": "DF-N1 repair (b)"},
          {"field": "span_rules[INV-CLAIM].replacement", "layer_superseded": "narrow-by-hash", "extent": "whole",
           "replaced_by": "corrective.threshold_index.text", "item": "DF-N2",
           "position_note": ("narrow's INV-CLAIM replacement governed the span INV-CLAIM of "
                             "change.D4_calibration.threshold_inventory of AMD-20260926-typed.yaml; that span position is "
                             "now governed by corrective.threshold_index.text of this file")},
          {"field": "conventions.Q0-11", "layer_superseded": "typed-by-hash", "extent": "span G-Q011", "item": "ER-2"},
          {"field": "corrective.falsification_condition_mapping.rows item 6.outcome (the FC6 row)",
           "layer_superseded": "narrow-by-hash", "extent": "whole",
           "replaced_by": "corrective.falsification_condition_mapping_fc6.outcome", "item": "ER-3"},
          {"field": "corrective.declared_not_superseded item 1.declaration (the RI-3 C-PLANT-PL item)",
           "layer_superseded": "narrow-by-hash", "extent": "span G-CPL", "item": "ER-5"},
          {"field": "precedence", "layer_superseded": "narrow-by-hash", "extent": "whole", "replaced_by": "precedence",
           "item": "ER-1"},
          {"field": "governing_text_table", "layer_superseded": "narrow-by-hash", "extent": "whole",
           "replaced_by": "governing_text_table", "item": "ER-1"},
          {"field": "incorporates.reading_of_self_references", "layer_superseded": "narrow-by-hash", "extent": "whole",
           "replaced_by": "reading_of_self_references", "item": "ER-1, ER-2"},
          {"field": "incorporates.status_of_that_file", "layer_superseded": "narrow-by-hash", "extent": "whole",
           "replaced_by": "incorporates_by_hash.status_of_the_incorporated_files", "item": "ER-1"},
          {"field": "incorporates.what_is_incorporated", "layer_superseded": "narrow-by-hash", "extent": "span G-WII",
           "item": "ER-1"},
          {"field": "envelope_not_incorporated.rule", "layer_superseded": "narrow-by-hash", "extent": "span G-ENV",
           "item": "ER-1"},
      ]

      NARROW_ENVELOPE = ["id", "batch_id", "producer_task", "producer_snapshot", "review_plan_id", "decision_id",
                         "decision_id_note", "recorded_at", "kind", "status", "approval", "cites", "design_record",
                         "authorization"]
      NARROW_IDENTITY = ["experiment_id", "hypothesis_id", "question_id", "goal_id"]
      NARROW_WHOLE_SUPERSEDED = {"precedence", "governing_text_table", "incorporates.reading_of_self_references",
                                 "incorporates.status_of_that_file"}

      TYPED_SUPERSEDED_SPANS = {
          "controls[C-BOUND].gates item 1": "G-GATE1",
          "controls[C-BOUND].states[BND-1].expected": "G-BND1",
          "controls[C-BOUND].states[BND-3].expected": "G-BND3",
          "conventions.Q0-11": "G-Q011",
      }

      EXPECTED_VALUE_SOURCE = (
