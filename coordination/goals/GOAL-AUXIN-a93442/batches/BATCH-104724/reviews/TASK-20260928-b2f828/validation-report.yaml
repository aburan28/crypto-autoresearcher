  observations:
    - id: OBS-1
      text: >-
        The threshold index omits cut-offs found before reading the draft:
        PC-1 floor(R) < 1; PC-2 the v1/typed budget limits; PC-3 HTTP non-200;
        PC-4 the lower slack on control gates; PC-5 the C-BOUND 10^-50
        tolerances; PC-6 the ECPP step bound; PC-7 the PR-SP800 {1,4}
        quantifier; PC-8 the ECM probe parameters; PC-9 the three-line counts;
        PC-10 C > 1; PC-11 rho_baseline. This is not a defect, because the index
        claims no completeness and governs nothing. A reader who treats it as a
        checklist would be misled.
    - id: OBS-2
      text: >-
        In corrective.threshold_index.text, "this field" is not covered by
        reading_of_self_references. It most plausibly means
        typed change.D4_calibration.threshold_inventory, the field whose span
        the text now occupies. It could instead be read as gated's
        corrective.threshold_index, which lists no entries. This is harmless
        because no reader reads the index.
    - id: OBS-3
      text: >-
        Pointer only, pre-existing, and outside RJ1's gate-1 scope: N4 fires on
        a bound "other than" the fixed value, while C-BOUND gate 2 accepts
        bounds within 10^-50. The draft does not change this.
  limitations:
    - >-
      The BN254-r and BLS12-381-r field primes were not re-extracted because the
      remote pinned revisions were not retrieved. Their bit lengths (254 and
      381) are recalled, not retrieved, and that is what the ER-6 exclusion
      rests on for those two rows.
    - >-
      resolved_model_id is not exposed by this runtime and is unverified. The
      requested policy is recorded, and there is no probe verification.
    - >-
      Joints RJ3, RJ4 and RJ5 and the proves-too-much controls are not owned
      here and were not assessed.
