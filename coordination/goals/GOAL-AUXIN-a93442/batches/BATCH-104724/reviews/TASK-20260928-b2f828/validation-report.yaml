  artifact_checks:
    - check: snapshot custody
      result: PASS
      detail: >-
        The snapshot bfbc573 has parent 1845a847. Its diff adds exactly three
        files: the snapshot receipt, design-report.yaml and
        AMD-20260928-gated.yaml. The worktree copy of the draft has the same
        sha256 as the committed copy (77d1d5bf...).
    - check: R-D7D10 byte identity of frozen files
      result: PASS
      detail: >-
        specification.yaml, AMD-20260916-bands.yaml, AMD-20260923-d1d10.yaml,
        AMD-20260926-typed.yaml and AMD-20260927-narrow.yaml have identical git
        blob ids in the parent, the snapshot, HEAD and the working tree. At the
        snapshot, the sha256 of specification.yaml, typed and narrow equal the
        digests the draft states (1f803aa0..., 3c57978c..., ccd11216...). The
        draft is one new governing file.
    - check: gated span-rule hashes
      result: PASS
      detail: >-
        For each of G-GATE1, G-BND1, G-BND3, G-Q011, G-CPL, G-WII and G-ENV, the
        `from` text occurs exactly once in its safe-loaded field, and the sha256
        of the from..through span equals replaced_span_sha256. The ER-5 quote
        hash (a0fad262...) matches, and the quote occurs in C-PLANT-PL
        declared_properties. The ER-3 quote equals v1 tail_checks item 1, and its
        hash (26b53f89...) matches.
  metric_recomputations:
    - check: RJ1 (i) and (vi) control rebuild (R-D4)
      result: PASS
      detail: >-
        I rebuilt C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL from the typed
        recipes with my own PARI/GP script (build_controls.gp). The build ran
        from 02:32:50Z to 02:33:22Z, which is before any comparison. Every r has
        exactly the declared bit length. Every named prime was proved with
        isprime, and every factorisation identity holds. Every exact control
        gate that the text determines passes.
    - check: RJ1 (ii) BND-1, BND-2 and BND-3 under the gated text
      result: PASS
      detail: >-
        The independent mpmath evaluator (evaluate.py, 170 digits) gives:
        BND-1 is BOUND with |W| = 8 and witness 2u (D > 2u), bin NEAR_FLOOR,
        bin_at_least NEAR_FLOOR and flag false. BND-2 is BOUND with |W| = 4 and
        witness 2, bin UNDETERMINED, bin_at_least NEAR_CEILING and flag false.
        BND-3 is BOUND with |W| = 8 and witness 2d, bin NEAR_FLOOR,
        bin_at_least NEAR_FLOOR and flag false. Gate 1 passes on each state.
        Gate 2 holds within 10^-50. The BND-1 consistency check holds within
        10^-50. In each case the expected block equals what
        corrective.bin_by_status gives. With a correct evaluator, N4 is not met
        on any state, and gate 1 plus N4 has exactly one outcome.
    - check: RJ1 (iii) own NEAR_FLOOR BOUND states
      result: PASS
      detail: >-
        I built three states outside the named ones:
        OWN-1 is C-PLANT-M minus with F = 2*d1*u and parts [d2]; |W| = 16.
        OWN-2 is C-PLANT-PL plus with F = 12w and parts [f1*f2, f3*f4]; |W| = 48.
        OWN-3 is C-PLANT-P plus with F = 12 and parts [d, w]; |W| = 24.
        Each state is BOUND, unflagged, with depth above 3/4 + tau. Each bins
        NEAR_FLOOR with bin_at_least NEAR_FLOOR, defined through
        expected_value_source and bin_by_status. Gate 1 passes, N4 is not met,
        and there is one outcome on each state.
    - check: RJ1 (iv) gating test
      result: PASS
      detail: >-
        I tested all six states (BND-1/2/3 and OWN-1/2/3) with bin_at_least
        absent, null, and set to a wrong bin. Gate 1 fails in every case, N4 is
        met in every case, and each case has exactly one outcome. Harness
        contrast: under narrow's gate 1 ("where stated"), evaluator E0 with
        bin_at_least absent passes gate 1 on BND-1 and BND-3 while N4 is met,
        which gives two outcomes. That reproduces DF-N1, and the gated text
        removes it.
    - check: RJ1 (v) repairs
      result: PASS
      detail: >-
        The draft uses repair (a) (span G-GATE1) and repair (b) (spans G-BND1
        and G-BND3) together. Repair (c) is not used.
    - check: RJ1 (vi) PD-R2 comparison with the BATCH-7b6678 validator
      result: PASS
      detail: >-
        I ran this comparison after my own build and after recording RJ1 (i) to
        (v). Every compared value agrees exactly: all control integers, the
        candidates-examined counts, all eight exact-branch minimisers, bins,
        flags and depths, and BND-1/2/3 W, witness, bin, bin_at_least and flag.
        The depth difference is 0.0 in float.
  control_checks:
    - check: RJ2 (i) threshold inventory (DF-N2)
      result: PASS
      detail: >-
        I recorded my own four-layer cut-off list at 02:31:30Z, before opening
        the draft or the design report. The draft drops the completeness claim.
        corrective.threshold_index calls itself an index "NOT claimed complete",
        read by no gate, stop, validity rule or outcome. A script scan of the
        safe-loaded values of v1, typed, narrow and gated finds exactly two
        completeness claims: typed span INV-CLAIM and narrow's INV-CLAIM
        replacement. The governing_text_table routes both to the gated layer,
        so no governing text still claims completeness. Eleven items from my
        pre-read list are absent from the index, including the v1 budget limits
        (PC-2). Because completeness is no longer claimed, these are recorded as
        observations, not findings.
    - check: RJ2 (ii) ER-6 and ER-7
      result: PASS
      detail: >-
        Both are declared and each picks one reading. ER-6: "every
        construction-control integer" means each control's r. Under the other
        reading, not_prime would reject composite recipe integers such as
        D = d1*d2 and stop every run. ER-7: "(hex form)" is descriptive.
        I rebuilt FP from the local pinned sources with my own implementations
        of PR-SP800, PR-SEC2 and PR-RFC5639, covering eight rows. CF-1 equals
        the Ed25519-L p and CF-2 equals the NIST-P-256 p, both in the hex
        representation that PR-SP800 selects. So ER-7 does not change the
        decision at these bytes. Under ER-6, all four control r values are
        absent from the locally rebuilt FP and are prime, so the reason list is
        empty (NOT REJECTED). The r values are 256 or 521 bits, so they cannot
        equal the 254-bit or 381-bit field primes of the two remote-pinned rows,
        which I did not retrieve.
    - check: RJ2 (iii) executed layer (GT-5)
      result: PASS
      detail: >-
        The 13 supersedes_fields entries and the 5 gated adds_to targets touch
        no pin, locator, FP, tool-admission or timeout field. I mapped the layer
        names (narrow refused-typed-by-hash = gated typed-by-hash; narrow
        corrective = gated narrow-by-hash). All 202 executed-layer rows of
        narrow's table appear in gated's table with the same layer. No
        executed-layer row is new and none has layer gated. No re-execution is
        required, and consistently the design report states that no transcripts
        exist.
    - check: RJ2 (iv) R-NJ1
      result: PASS
      detail: >-
        Under the rebuilt FP every CF-X case gets the reason list
        [field_prime]. Under mutation M-FP (only the two C-FIELD values), the
        cases for six rows are admitted and the gate fails with N2. Those rows
        are NIST-P-224, NIST-P-384, NIST-P-521, secp256k1, brainpoolP256r1 and
        brainpoolP384r1. So M-FP still fails a declared control.
    - check: RJ2 (iv) R-NJ2
      result: PASS
      detail: >-
        tools_and_admission.admission_gate and the D6 timeouts rows have the
        same layer in both tables, and no gated addition targets them.
        custody_additions keeps TP-FOUR and ADM-7 byte identical. It adds only
        a separate gated_amendment_sha256 key to the trial plan, a manifest hash
        with a dirty-file launch refusal, and two invalidation rules.
    - check: RJ2 (v) R-D7D10 certificate route
      result: PASS
      detail: >-
        gp primecert produced a 7-step ECPP chain for the 256-bit r of
        C-PLANT-M. verify_cert.py (stdlib only, imports nothing from PARI)
        checked each step: s divides m; q > (c+1)^2 where c is the least integer
        with c^4 >= N; the curve is non-singular; [m]P = O and [s]P != O with
        every denominator invertible; and the chain links. The 56-bit terminal q
        was proved by Pratt. As a negative control, a certificate with a
        tampered trace is rejected.
    - check: RJ2 (vi) DP-1
      result: PASS
      detail: >-
        The draft's authorization field carries DEC-20260927-f680f7
        dispatch_preconditions_carried as a precondition of any executor card,
        "unweakened". It reproduces the operative clause (provision the tools
        outside the repository and pass the admission gate as written). The
        decision's second sentence, which says the admission items remain
        untested, is a status note and is not restated. No weakening was found.
    - check: tripwires T1 to T3
      result: not fired
      detail: >-
        Neither file states or implies an ECDLP improvement, a vulnerability, a
        curve verdict, a cost below the published floor, or a closure. I read
        gated's authorization, non_claims and governs_nothing, the design
        report's status_effect and asserts_nothing_about, and ran a keyword scan
        of both files.
