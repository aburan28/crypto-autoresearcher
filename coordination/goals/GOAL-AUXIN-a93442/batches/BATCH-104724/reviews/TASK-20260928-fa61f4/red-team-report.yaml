  claim_under_review: >-
    AMD-EXP-AUXIN-7e2e3d-20260928-gated (experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml,
    sha256 77d1d5bf...8f3f) with its design report (TASK-20260928-9a1ec0, sha256 978b4882...4fff), read from
    snapshot bfbc573af291bc2bd143844f23e110a8888667cc: (RJ3) the gated layer discharges DF-N1 by repairs (a)
    G-GATE1 and (b) G-BND1/G-BND3 without changing the meaning of any held clause except through a declared
    supersession, and its reader map is complete; (RJ4) ER-3/ER-4/ER-5 are addressed and no corrected text
    over-scopes the hypothesis, retires a falsification condition, or alters N4 or D2/D3; (proves_too_much) the
    corrected rules keep PTM-A..G out of reach.
  scope_of_this_report: >-
    Joints RJ3, RJ4 and the proves_too_much control only. Governance-text review plus review computations; no
    scientific execution. Verdicts are per joint; the whole-claim composition belongs to the composing task.

  verdicts:
    RJ3: holds
    RJ4: holds
    proves_too_much: holds

  per_joint_summary:
    RJ3: >-
      Holds with two moderate objections (O-1, O-2) that do not produce a second outcome anywhere. All seven
      gated span rules and all fifteen narrow span rules reproduce their declared sha256 with unique from-text;
      the governing_text_table (992 rows) is total over every non-key leaf with no leaf carrying two
      unpartitioned rows; the only new typed rows relative to the narrow table are the four span splits, so no
      held span is retyped. The evaluator table (computations.results.evaluators) reproduces the DF-N1 defect
      under the narrow text (16 two-outcome cases: E0, E0 with key absent, PTM-F wrong-bin variants, and
      path-disagreement variants, all on BND-1/BND-3) and finds zero two-outcome cases under the gated text; a
      correct evaluator does not meet N4 under the gated text. The eight 'changed via superseded referent'
      reader-map entries change OUTCOME only because the superseded gate 1 changed; their rule texts are not
      contradicted and are coherent with N4, so they are not DF-N1-class changes. K-layer-outcome key is NOT
      triggered: no clause is changed without supersession.
    RJ4: >-
      Holds. ER-3 (v1 tail_checks item 1 quoted verbatim, hash 26b53f89... matches the v1 bytes), ER-4
      (addition keyed to the narrow path, resolvable in two steps; O-4) and ER-5 (quote hash a0fad262... matches
      the typed bytes, one occurrence) are addressed. RI-1 carries six rows against the six falsification
      conditions of H-AUXIN-6db354 (sha256 6455dd07...); none is retired; FC2 demoted in part and FC4 demoted
      are held from the narrow layer, not introduced here. N4's condition leaf is not in any gated row, so its
      text and tested meaning are unchanged. No D2/D3/typed_costs/analytic_floors row is governed by the gated
      layer. The D3 unfactored-row reconstruction (81-bit toy, one composite part) returns BOUND with the
      fixed witness set {e, e*C}, a bracketing pair containing the true exponent, and a defined bin_at_least
      not deeper than the truth. No over-scoped sentence found in the amendment or design report.
    proves_too_much: >-
      Holds: every failure signature of the plan is met (details under counterexample_or_mutation).

  objections:
    - id: O-1
      joint: RJ3
      severity: moderate
      target: design report reader_map (GT-4 completeness)
      statement: >-
        The narrow span replacement BN-K (inside the typed pin field; it refers to the narrow file's
        rows[BN254-r].pinned_revision carrying commit K) reads G-Q011 and reading_of_self_references but is not
        listed in the reader map. Its outcome is unchanged (it still governs), so no second outcome results;
        the map is incomplete, not wrong. TP-FOUR and MAN-DIRTY are mentioned; ECM-PROV is not, also unchanged.
      evidence: computations.results.reader_map_mentions; computations.results.narrow_span_replacements_referencing_other_files
      remedy: Composer records the omission; a later layer may add the entry additively. No repair of the gated bytes is required.
    - id: O-2
      joint: RJ3
      severity: low
      target: design report terminology
      statement: >-
        'changed via superseded referent' (R3-R7, R15, R41, R52) is a relabel of 'outcome changes because a
        superseded clause changed'. It is correct but could be misread as 'changed without supersession'. Repair
        (a) necessarily produces these outcome changes; they are the intended effect, not a DF-N1 residue.
      remedy: Composer states the reading explicitly when citing the reader-map counts.
    - id: O-3
      joint: RJ3
      severity: low
      target: supersession scope
      statement: >-
        Supersessions of status_of_that_file, what_is_incorporated (G-WII), the envelope rule (G-ENV),
        reading_of_self_references and the table are not literally named by ER-1/DF-N1 but are forced
        incorporation machinery; none changes a scientific clause. Recorded as a scope observation.
    - id: O-4
      joint: RJ4
      severity: low
      target: held cross-layer residues not introduced by the gated spans
      statement: >-
        Held residues remain: v1 stopping_rules item 2 'emit E_bound' against typed 'E(r) not produced'/IR7;
        v1 scientific_execution_authorized/status approved against the gated 'authorizes NO run' (gated text
        governs); typed D3 VOID parenthetical against v1 'a missing branch voids the row' (ER-3 quote reconciles);
        typed metrics.primary item 2 'bin_at_least (BOUND)' against narrow bin_by_status on all branches;
        G-CPL outside-span residue 'survives with a relative bound'; 'after approval' referents; ER-4 addition
        requires two-step path resolution. None yields two outcomes in the evaluator table; none is caused by
        the gated spans.

  required_controls:
    - Composer confirms the evaluator table outcome (zero two-outcome cases under gated) against the validator's independent build, not against this report.
    - Blind re-derivation of the c_bound expected values (owned elsewhere in this round) is compared with the analytic stand-ins recorded in computations.results.c_bound_analytic_stand_ins.

  counterexample_or_mutation:
    PTM-A: 'Rebuilt 256-bit prime with r-1 = 2*prime and r+1 = 12*prime; EXACT on both branches, NEAR_CEILING on both (depth ~0.008 and ~0.043), no boundary flag. Signature met: not flagged.'
    PTM-B: 'brainpoolP384r1 field prime (388 bits, parsed from inputs/SAFECURVES-20260825/specs/rfc5639.txt, sha256 recorded) is rejected by the field_prime confounder before any factoring. Signature met.'
    PTM-C: 'SHAKE-256 sampler declared before evaluation (label RT-fa61f4/PTM-C/, 6 primes each at 256 and 224 bits). 24 branch results: 14 BOUND/UNDETERMINED, 6 EXACT/NEAR_FLOOR, 4 EXACT/INTERMEDIATE, the same category set as deployed rows. No gated or design-report sentence reads a category as curve-specific or family-caused. Signature met.'
    PTM-D: 'Toy r with d > sqrt(r) dividing r+1: T_plus(d) >= d and >= sqrt(r) for every divisor. Signature met.'
    PTM-E: 'Two constructed primes with r+1 = 6*(a1a2)*(b1b2), declared state with two composite parts unfactored: BOUND, UNDETERMINED, bin_at_least NEAR_CEILING, fixed witness, bracket contains the true exponent (true bin NEAR_FLOOR), bin_at_least not deeper than truth. Signature met.'
    PTM-F: 'Evaluator returning bin_at_least INTERMEDIATE or NEAR_CEILING on BND-1/BND-3 fails gate 1 under gated (two outcomes under narrow). Signature met.'
    PTM-G: 'E0 of RT-20260927-730157 (null or absent bin_at_least at NEAR_FLOOR BOUND) on BND-1 and BND-3: under gated, gate 1 fails, valid-table condition not met, N4 met: exactly one outcome, not certified valid. Signature met.'

  baseline_comparison: >-
    Baseline is the narrow text (AMD-20260927-narrow, ccd11216...). Under it the same evaluator set yields 16
    two-outcome cases (the DF-N1 defect of DEC-20260927-f680f7 reproduced); under the gated text, zero. Table
    diff narrow->gated: 833 common rows; layer changes are envelope, authorization, approval, cites, precedence,
    reading/status rows and the INV-CLAIM threshold span; no scientific typed span is retyped.
  heuristic_challenges: []
  cost_model_challenges:
