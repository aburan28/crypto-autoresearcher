          brainpoolP384r1 q sits at 710-711, not 698-699. An executor using that
          convention would report the "different span" the locator warns about
          for a reason unrelated to the value. I used LF-only numbering.
        - >-
          C6 (BN254-r). The amendment says to archive the retrieval as
          sources/eip-197.txt, but the page is HTML. The HTML-to-text conversion
          is undeclared, and the recorded line numbers depend on it. I parsed the
          HTML with its tags stripped and compared it with the raw .md.

    attack_ii_factoring:
      budget_and_bit_cap: >-
        I found no route by which an executor can spend less than the frozen
        3600 s per integer, or apply a bit cap, without breaking a written rule.
        Three clauses close those routes. (a) "Factoring stops only when m_b is
        completely factored or that budget is spent." (b) "THERE IS NO BIT CAP."
        (c) The ECM ladder repeats its last level until the budget is gone. The
        272-bit value only routes a part between F2 and F3; it is declared as a
        router, and it differs from the undeclared 260-bit cap recorded in
        CORR-20260923-64ee17 C5. Certificate time is kept apart from factoring
        time.
      declared_backend_presence_here:
        GMP-ECM: >-
          ABSENT from the system. I built it under scratch as 7.0.6, from source,
          against GMP 6.3.0. That is above the minimum of 7.0.4.
        PARI/GP: >-
          ABSENT from the system: no gp binary and no cypari2 module. I installed
          cypari2 2.2.0 under scratch, which bundles PARI 2.15.4 (above the minimum
          of 2.13.0). factor, primecert, primecertisvalid and version all exist in
          it.
        Python: 3.11.15, which meets the minimum of 3.10
      findings:
        - id: F-J1-1
          severity: blocking (tool)
          text: >-
            The declared GMP-ECM and PARI/GP are absent from this environment, so
            admission item (1) fails here. Under the amendment's own absence_rule
            that is an infrastructure stop, not a result.
        - id: F-J1-2
          severity: blocking (instrument text)
          text: >-
            Admission item (1) asks for the GMP-ECM version via "ecm -printconfig
            or ecm -version". GMP-ECM 7.0.6 answers `ecm -version` with "Unknown
            option: -version". `-printconfig` prints only "Included GMP header
            files version 6.3.0" and no GMP-ECM version. The version appears only
            in the banner of a factoring call. Observed on 7.0.6 only; 7.0.4 was
            not tested.
        - id: F-J1-3
          severity: material (instrument determinacy)
          text: >-
            Stage F3 runs, at each B1 level, "the number of curves that the
            installed GMP-ECM prints with -v as its expected curve count for that
            level". GMP-ECM 7.0.6 -v prints a table over factor sizes of 35, 40,
            ..., 80 digits, not one count. At B1 = 2e3 the entries are 3.3e+09
            and then Inf. At 85e7 they are 17, 52, ..., 1.6e+07. The digit column
            is undeclared, so the schedule, and with it which factors are found
            within budget, is not determined by the text. This affects EXACT
            versus BOUND outcomes but not the budget.
        - id: F-J1-4
          severity: minor
          text: >-
            D6 asks for "seconds actually spent reported per cofactor". The
            amendment reports seconds per integer per stage (F0 to F3), plus ECM
            curves per level. When one integer has several composite parts, the
            seconds spent on each part are not recorded.
        - id: F-J1-5
          severity: minor
          text: >-
            The budget is "measured as wall-clock seconds of the factoring
            subprocesses". That is ambiguous when PARI runs in-process through
            cypari2, which the amendment allows. The F2 "hard timeout" mechanism is
            also undeclared for that case.
      scale_disclosure: >-
        The amendment's own bound (2 x (deployed rows + 3 controls + 16 x bit
        classes)) x 3600 s gives 2 x (10 + 3 + 112) x 3600 s = 900000 s, about
        250 h of worst-case factoring on one worker. This is advisory under the
        budget policy and is recorded as a disclosure, not a defect.

    attack_iii_certificates:
      produced_and_verified: >-
        I chose the prime myself: nextprime(sha256("TASK-20260923-c78ddf J1(iii)
        certificate test prime") OR 2^255), 256 bits. PARI 2.15.4 primecert
        produced a 7-step ECPP certificate for it, and PARI primecertisvalid
        returned 1. I exported the certificate as JSON and checked it with
        cert_verify_review.py. That verifier imports only json, math and sys (AST
        audit), shares no code with PARI, GMP-ECM, FLINT, sympy or gmpy2, and I
        wrote it from the amendment's check list. It ACCEPTS the certificate. The
        ECPP chain's terminal q (59 bits) carries a Pratt certificate built from
        PARI factor() of q - 1, which the verifier also accepts.
      admission_self_tests_reproduced: >-
        2^89 - 1 gives a 1-step ECPP chain, which the verifier ACCEPTS. 2^607 - 1
        gives a 31-step chain, which it ACCEPTS. Tampered with top N := 2^89 + 1,
        it REJECTS with "s does not divide m". Two further tampers are REJECTED: a
        flipped bit in P.x on my prime ("[m]P is not the point at infinity") and
        terminal Pratt witness a := 1.
      format_check: >-
        PARI 2.15.4 primecert returns steps [N, t, s, a4, [x, y]], which matches
        the amendment's (N, t, s, a4, P = (x, y)). For N < 2^64 PARI returns the
        bare integer, not a certificate. The amendment's Pratt route for
        p < 2^64 covers this, so executors must not treat PARI's return value as
        a certificate. In every chain in this review (pins, controls and
        self-tests) the terminal q was under 2^64 (41 to 64 bits).
      criterion_soundness: >-
        The amendment's step check is sufficient as written. In it, m = N + 1 - t,
        s divides m, q = m / s, the discriminant is coprime to N, [s]P is affine
        with invertible denominators and [m]P = O, and q > (c + 1)^2 where
        c = ceil(N^(1/4)). For any prime l dividing N with l <= sqrt(N), q divides
        #E(F_l) <= (sqrt(l) + 1)^2 <= (c + 1)^2, which is a contradiction. l = 2
        is excluded because the affine doubling needs 2y invertible mod N. The
        check list omits gcd(N, 6) = 1. My verifier's strict mode adds it, and no
        certificate here is affected. The design session recalled these
        criteria; this review supplies a worked check of them (provenance:
        internal, this report).
      pin_certificates: >-
        All ten pinned r were proved by PARI ECPP (5 to 27 steps), and the stdlib
        verifier accepts all ten in both literal and strict mode. No certificate
        leaks any r +- 1 structure: at every step, m = N + 1 - t is never N - 1 or
        N + 1.
      minor_note: >-
        A compositeness witness is a^(C-1) != 1 mod C for a recorded base. For a
        Carmichael cofactor, no base coprime to C works. This is negligible at
        these sizes, and the text does not address it.

    attack_iv_custody_clauses:
      holds_textually: >-
        D8 requires path_sha256 over every file under the run directory,
        including sources/ and certificates/, and over every file under
        implementation/d1d10/. It excludes side fields such as
        run_artifacts_sha256 and source_sha256 by name. The manifest must carry
        dirty_summary (git status --porcelain=v1 at launch), and launch is refused
        when d1d10/ or the amendment path is dirty. No artifact holds its own hash.
        orders.json is written once and hashed after closing into
        orders.json.sha256 and stdout.log. trial-plan.json binds the amendment,
        specification.yaml and AMD-20260916-bands.yaml by sha256 at launch and at
        every stage boundary.
      gaps:
        - id: F-J1-7
          severity: material (custody)
          text: >-
            The snapshot clause binds only implementation/d1d10/ and the run
            directory. Nothing forbids the run from importing modules outside
            d1d10/, such as the pre-existing implementation/driver.py, e_eval.py or
            factor_path_*.py, or repository tools/. D10's "The run uses NEW
            implementation modules under ..." describes, but does not restrict. An
