  # ===========================================================================
  # J3 -- CALIBRATION AND CONTROL CONSTRUCTIBILITY (D4, D5)
  # ===========================================================================
  J3:
    verdict: holds
    decisive_reason: >-
      I built all three D5 construction recipes (C-PLANT-M, C-PLANT-P, C-INERT)
      with my own code from the text alone, and none of them left a choice. Each
      control lies inside its declared windows, satisfies its own acceptance
      rule and has exactly B = 256 bits. Every prime in each constructed
      factorization is proved by an exported certificate that the stdlib
      verifier accepts. Every gate I can evaluate without the run pipeline holds,
      on two independent 160-digit paths. The planted r + 1 divisor d divides
      r + 1, has the declared size (85 bits, equal to the bits of d0, with
      d >= d0), and is the T_plus minimiser within 2.0e-51 of F_plus. Escalate
      semantics are removed (option b). No threshold's location depends on any
      deployed-row outcome. The null arm is frozen and is read by no rule, and
      Stage C and Stage N both complete before Stage D. This overturns the
      Coordinator's prior, which expected J3 to break on the planted r + 1
      control or on calibration.

    attack_i_controls_built:
      common: >-
        B = 256 and M0 = 3 * 2^254, which has 256 bits. M0 - 2^253 and M0 + 2^253
        both have 256 bits, as the text claims. The screen is my own BPSW in
        bpsw.py, written as the amendment defines it: a strong base-2 test, then
        a strong Lucas test with Selfridge method A. It agrees with a sieve up to
        2*10^5, rejects ten known strong base-2 pseudoprimes and ten known strong
        Lucas pseudoprimes, and agrees with gmpy2.is_strong_bpsw_prp on 22400
        random inputs. All 126160 screen calls in the three searches were also
        run through gmpy2, with zero disagreements. Trial division by primes
        below 1000 came first (gcd with the primorial), which cannot reject a
        prime at these sizes. Every accepted integer was then proved prime by
        PARI ECPP (>= 2^64) or Pratt (< 2^64), and the stdlib verifier accepted
        each proof. A screen-passing composite never occurred.
      C-PLANT-M:
        S_isqrt_M0: '294693174213430241384087455685767077316'
        isqrt_S: '17166629669606968060'
        d1: '17166629669606968129'
        d1_integers_stepped: 70
        d2: '17166629669606968169'
        d2_integers_stepped: 40
        D: '294693174213430244430891235695900485801'
        u0: '147346587106715119168641837837816850167'
        u: '147346587106715119168641837837818895601'
        u_candidates_examined: 2045435
        r: '86844066927987146567678238756517136441196232254617864945125180267986403722803'
        v: '7237005577332262213973186563043094703433019354551488745427098355665533643567'
        bits: {d1: 64, d2: 64, u: 127, r: 256, v: 253}
        constructed_factorizations: r - 1 = 2 * d1 * d2 * u; r + 1 = 2^2 * 3 * v (both products exact)
      C-PLANT-P:
        d0_icbrt_M0_over_4: '27897163901963686775744497'
        d: '27897163901963686775744531'
        d_integers_stepped: 35
        w0: '259417251257675264555422902444027860852665664144271'
        w: '259417251257675264555422902444027860852665664308877'
        w_candidates_examined: 164607
        r: '86844066927987146567678238756515930889952488554335154276504727596582730020243'
        q: '43422033463993573283839119378257965444976244277167577138252363798291365010121'
        bits: {d: 85, w: 168, r: 256, q: 255}
        constructed_factorizations: r + 1 = 2^2 * 3 * d * w; r - 1 = 2 * q (both products exact)
      C-INERT:
        w0: 2^252
        w: '7237005577332262213973186563042994240829374041602535252466099000494570934027'
        w_candidates_examined: 331532
        r: '86844066927987146567678238756515930889952488499230423029593188005934851208323'
        q: '43422033463993573283839119378257965444976244249615211514796594002967425604161'
        bits: {w: 253, r: 256, q: 255}
        constructed_factorizations: r - 1 = 2 * q; r + 1 = 2^2 * 3 * w (both products exact)
      C-FIELD:
        case_1: brainpoolP384r1 p, rfc5639.txt lines 683-684, hex, 384 bits. No choice was needed.
        case_2: >-
          Edwards25519 p, sp800-186.txt, hex on lines 3068-3070, 255 bits (2^255 - 19).
          A representation choice WAS needed. The .txt prints the expression with
          its superscript and minus sign lost ("2255", "19"), and applying the
          parse rule to that form gives 225519. This is the D1 parse-rule defect,
          choice C3 under J1, and I report and own it there. The case's integer is
          unique under any reading of what the authoritative PDF prints, and the
          gate passes whatever the parse, because the comparison is
          self-referential (F-J1-10).
      controls_distinct: >-
        TRUE. The three r values differ, as their factorization shapes force.
      choices_the_text_left_open:
        D5_recipes: none. C-PLANT-M, C-PLANT-P and C-INERT are fully determined by the text.
        elsewhere: C-FIELD case 2 representation (J1 choice C3), listed here so the list is complete.
      candidates_examined_convention: >-
        "Candidates examined" counts every integer stepped in +1 order from the
        search start, up to and including the accepted one. The d1, d2 and d
        counts include the even integers the text lets a search skip.

    attack_ii_acceptance_windows_gates:
      windows:
        C-PLANT-M: d1 in [isqrt(S), isqrt(S) + 2^24) TRUE; d2 in (d1, d1 + 2^24) TRUE; u in [u0, u0 + 2^48) TRUE; r has 256 bits TRUE
        C-PLANT-P: d in [d0, d0 + 2^24) TRUE; w in [w0, w0 + 2^48) TRUE; r has 256 bits TRUE
        C-INERT: w in [w0, w0 + 2^48) TRUE; r has 256 bits TRUE
      acceptance_rules: >-
        All hold, and every integer that each rule names is proved prime. For
        C-PLANT-M, u differs from d1 and d2, and 12 divides r + 1. For C-PLANT-P,
        w differs from d and q = (r - 1)/2. For C-INERT, q = 6w - 1.
      planted_r_plus_1: >-
        d divides r + 1. d has 85 bits, equal to the bits of d0, and d >= d0
        (d - d0 = 34). The T_plus minimiser over all 24 divisors of r + 1 is d.
        e_plus - F_plus = 2.04e-51, which lies in [0, 1e-6]. The depth is 1.000
        and the bin is NEAR_FLOOR. log2(2d) = 85.53.
      gates_evaluated_on_constructed_factorizations:
        C-PLANT-M: >-
          The minus minimiser is (r - 1)/D = 2u, 128 bits. It is the smaller of the
          exactly tied pair {D, 2u}, so it lies in {D, (r - 1)/D}.
          e_minus - F_minus = 7.54e-38. Minus bin NEAR_FLOOR (depth 1.000). Plus
          minimiser 12, bin NEAR_CEILING (depth 0.0430). ALL HOLD.
        C-PLANT-P: >-
          Plus minimiser d, e - F = 2.04e-51, NEAR_FLOOR. Minus minimiser 2 (tied
          pair {2, q}), NEAR_CEILING (depth 0.00795). ALL HOLD.
        C-INERT: >-
          Minus minimiser 2, the smaller of the tied pair {2, q}, NEAR_CEILING
          (depth 0.00795). Plus minimiser 12, the largest divisor of 12,
          NEAR_CEILING (depth 0.0430). ALL HOLD.
        paths: >-
          Path R1 is Python decimal at 160 digits. Path R2 is PARI 2.15.4 at
          realprecision 160. They agree to within 2.5e-160 on every minimum
          exponent, and exactly on minimiser and bin. No boundary_flag is set,
          the floor invariant holds everywhere, and T_plus(d) >= d holds for
          every plus divisor.
        not_evaluated_here: >-
          The gate "the pipeline's blind factorization equals the constructed
          one" belongs to the run pipeline. As a diagnostic only, PARI 2.15.4
          factor() split all six constructed branches blind into exactly the
          constructed multisets. The slowest were 8.2 s (C-PLANT-M r - 1) and
          6.0 s (C-PLANT-P r + 1), far inside the 3600 s budget.
      sensitivity_note: >-
        For C-PLANT-P the true margin e_plus - F_plus is 2.04e-51, below the
        1e-50 path-agreement tolerance. The gate "0 <= e_plus - F_plus" has no
        lower tolerance, so its verdict rests on the >= 150-digit precision
        rule, not on the agreement tolerance. At 150 digits the sign is resolved
        with a very wide margin. An implementation that ran at fewer digits
        could fail the gate spuriously and produce a false N1.

    attack_iii_thresholds_and_dependencies:
      rule: >-
        For each threshold or decision rule I list what it depends on. A
        "deployed-row input" is a value pinned in Stage P from a primary source
        before any factoring. A "deployed-row outcome" is anything factoring or
        evaluation produces.
      inventory:
        - item: bin cut-offs s >= 3/4 (NEAR_FLOOR) and s <= 1/4 (NEAR_CEILING)
          depends_on: >-
            Declared constants, applied to depth s = (C_b(r) - e)/(C_b(r) - F_b(r)).
            The normalisation uses the row's own r (a deployed-row INPUT). Its
            location in exponent space is therefore a closed-form function of
            the pinned r. It carries no semantics.
          deployed_outcome_dependence: none
        - item: boundary_flag tolerance 1e-45, and the rule assigning the lower-depth side
          depends_on: declared constant
          deployed_outcome_dependence: none
        - item: BOUND bin rule (NEAR_FLOOR if the witnessed depth >= 3/4, else UNDETERMINED with bin_at_least)
          depends_on: declared constants, F_b(r), C_b(r)
          deployed_outcome_dependence: none
        - item: tie window, relative 1e-100; smallest tied divisor reported
          depends_on: declared constant
          deployed_outcome_dependence: none
        - item: precision >= 150 digits; path agreement 1e-50
          depends_on: declared constants
          deployed_outcome_dependence: none
        - item: floor_invariant e >= F_b(r) - 1e-45 and T_plus(d) >= d (decides N3)
          depends_on: >-
            A declared constant and F_b(r), an analytic function of the row's
            pinned r (deployed-row INPUT). It is APPLIED to every row's reported
            values, including deployed rows.
          deployed_outcome_dependence: >-
            None in the threshold's location. The rule, however, is evaluated on
            deployed-row outcomes (see F-J3-1).
        - item: control gates (0 <= e - F <= 1e-6, minimiser sets, bins, EXACT, multiset equality)
          depends_on: constants and control values only
          deployed_outcome_dependence: none
        - item: C-FIELD and the field_prime clause (equality with extracted p)
          depends_on: field primes extracted in Stage P (deployed-row INPUTS)
          deployed_outcome_dependence: none
        - item: hasse clause |p + 1 - h*r| <= 2*isqrt(p) + 2
          depends_on: p, h, r of the same row (deployed-row INPUTS)
          deployed_outcome_dependence: none
        - item: windows 2^24 and 2^48; B = 256; M0 = 3 * 2^254
          depends_on: declared constants
          deployed_outcome_dependence: none
        - item: null-arm size 16 per class
          depends_on: declared constant
          deployed_outcome_dependence: none
        - item: null-arm bit classes
          depends_on: >-
            The exact bit lengths of the r of the rows pinned in Stage P
            (deployed-row INPUTS). They also depend on WHICH rows pin, which is a
            Stage-P outcome. With all ten rows pinned the classes are 224, 253,
            254, 255, 256, 384 and 521, giving 112 samples. If BLS12-381-r goes
            UNPINNED under its literal locator (J1), class 255 disappears and 96
            samples remain.
          deployed_outcome_dependence: >-
            None on any factoring or evaluation outcome. It does depend on pin
            success, but no rule reads the null arm.
        - item: factoring constants (3600 s budget, 2^24 trial division, 272-bit routing, B1 ladder, 2^64 certificate cut-over)
          depends_on: >-
            Declared constants and the frozen specification value. The ECM
            curves per level are read from the installed tool at admission, which
            is not a declared constant and is not determinate (F-J1-3).
          deployed_outcome_dependence: none
      null_arm_frozen: >-
        Yes. The sampler (SHAKE-256 of an ASCII label, first ceildiv(L,8) bytes,
        big-endian, reduced mod 2^(L-1), then nextprime_ge with wrap), the size
        (16 per class) and the seed (the label prefix) are all frozen. I ran it
        as written for the seven classes. It gives 112 distinct primes of exact
        bit length, with no wrap, none equal to a pinned r or to a field prime,
        and sha256 7edbe20e...86c8 over the sorted list. The arm is fully
        determinate from the text once the bit classes are known. No rule reads
        it ("No statistic of the null arm enters any rule"), so the question
        whether it is read before scoring does not arise. It completes in Stage
        N, before Stage D.
      findings:
        - id: F-J3-1
          severity: minor (text consistency; not a calibration defect)
          text: >-
            Three sentences conflict with N3. The stopping rule on N3 applies to
            "any row", deployed rows included. Yet the decidability clause says
            "No deployed-row value decides any outcome", and the stopping rules
            say "no stop on any deployed value". A deployed-row exponent below
            its analytic floor would decide N3 and stop the run. The threshold is
            analytic, so this is not calibration against outcomes, but the
            sentences are inaccurate as written. S_VALID versus S_PARTIAL is
            likewise decided by the VOID status of deployed branches, a validity
            status rather than a value.
        - id: F-J3-2
          severity: minor
          text: >-
            D4_calibration.threshold_inventory claims to list "the only numeric
            cut-offs". It omits the 272-bit router, the 2^24 trial-division bound,
            the 2^64 certificate cut-over, the B1 ladder, the tool-derived
            curves-per-level, the frozen 3600 s budget, the hasse bound and the
            closed-form F_b(r) and C_b(r). None of these depends on a deployed-row
            outcome.

    attack_iv_stage_order: >-
      The order is A0, P, C, N, D, R, T. Stage P pins the deployed r and proves
      them prime (it has to, for C-FIELD and the null-arm classes) and factors
      nothing. Stage C builds, factors and gates the controls, and stops with N1
      on any failure before N or D. Stage N completes the null arm and prints its
      sha256 before D. C-ORDER requires controls_receipt.json and null_arm.json,
      with their hashes in stdout.log, before the first deployed factorization.
      So the controls and the null arm run BEFORE any deployed-row factorization
      or cost is produced. Only the published r values are read earlier.
    artifacts_read_for_J3:
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml (definitions, controls, null_arm, stages, D4, D5, stopping, success; full read)
      - coordination/review/auxin-20260923-09aadd/review-plan.yaml (full)
      - ledger/decisions/DEC-20260923-ce06a6.yaml (lines 1-300 and 586-659, for the D1-D10 wording and J1-J8 context; no value copied)

