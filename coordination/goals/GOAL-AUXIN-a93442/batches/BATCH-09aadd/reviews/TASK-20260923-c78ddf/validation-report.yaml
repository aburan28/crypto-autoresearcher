          C2 (sp800-186.txt). The decimal spans of n for P-256, P-384, P-521 and
          Ed25519-L end lines with a backslash continuation character. The rule
          removes only whitespace and line breaks, so a literal parse stops on
          the backslash and gives no integer. I stripped the backslash. The hex
          forms need "(=" and ")" stripped as well.
        - >-
          C3 (sp800-186.txt). For P-224, P-256, P-384 and P-521, p is printed as
          a damaged expression, then "=" and the decimal, then the hex. For
          Edwards25519 it is printed as a damaged expression and the hex. For
          P-256 the decimal of p is interleaved with a footnote and a page
          header. I used the hex form of p on every sp800-186 row.
        - >-
          C4 (BLS12-381-r). I read BLS12_381 as BLS12-381 and u as t. See the row
          above.
        - >-
          C5 (all files). "Line numbers (1-based, as the file is stored)" does
          not fix a line-terminator convention. sp800-186.txt contains 56 bare CR
          and 13 NEL (U+0085). sec2-v2.txt contains 15 CR and 18 NEL. rfc5639.txt
