  # ===========================================================================
  # J2 -- TYPED COSTS AND THE PREDICATE (D2, D3)
  # ===========================================================================
  J2:
    verdict: holds
    decisive_reason: >-
      Every term of both amendment formulas and both input models matches
      the retrieved theorem statements (i). The formulas reproduce
      hand-computed values at three toy primes (ii). The descriptive bins
      that replace the predicate return values the text determines on each
      constructed unfactored row and each r + 1 witness row (iii). No
      frozen-expression r + 1 value can enter any cost column (iv). The
      objections below (O9 to O14) are gaps and labelling defects. None is
      a breaking artifact as the plan defines it.

    i_formula_comparison:
      - term: r - 1 cost, leading expression
        amendment: T_minus(d) = sqrt((r - 1)/d) + sqrt(d)   (definitions.typed_costs)
        cheon_2006: >-
          Theorem 1: d a positive divisor of p - 1; given g, g1 = g^alpha,
          gd = g^(alpha^d); alpha in O(log p * (sqrt((p - 1)/d) + sqrt(d)))
          group operations, using O(max{sqrt((p - 1)/d), sqrt(d)}) memory.
        cheon_2010: >-
          Theorem 1: same inputs; deterministic time
          O(sqrt((p - 1)/d) + sqrt(d)) * Exp_G(p); storage
          max{ceil(sqrt((p - 1)/d)), ceil(sqrt(d))} elements. Lemma 1 gives
          the explicit count 2(ceil(sqrt((p-1)/d)) + ceil(sqrt(d))) *
          (Exp_G(p) + log p * Comp_G) + (5 + o(1)) Exp_Zp(p).
        match: yes (leading expression; the log p or Exp_G factor and constants are dropped, as disclosed)
      - term: r - 1 input model
        amendment: '"P, [x]P, [x^d]P (one auxiliary power, exponent d; Cheon 2006 Theorem 1)"'
        cheon_2006: g, g^alpha, g^(alpha^d)
        cheon_2010: g, g^alpha, g^(alpha^d)
        match: yes
      - term: r + 1 cost, leading expression
        amendment: T_plus(d) = sqrt((r + 1)/d) + d   (definitions.typed_costs)
        cheon_2006: >-
          Theorem 2: d a positive divisor of p + 1; g_i = g^(alpha^i) for
          i = 1..2d; alpha in O(log p * (sqrt((p + 1)/d) + d)) group
          operations, using O(max{sqrt((p + 1)/d), sqrt(d)}) memory. The d
          term is LINEAR. The proof computes g^(f0(alpha)), g^(f1(alpha))
          and g^((1 - a alpha^2)^d), polynomials of degree 2d, in 6d
          exponentiations.
        cheon_2010: >-
          Theorem 2: same inputs, i = 1..2d; deterministic time
          O(sqrt((p + 1)/d) + d) * Exp_G(p) + O(d + log p) * Mul_Zp; storage
          max{sqrt((p + 1)/d), sqrt(d)} elements; "assuming the ERH". The d
          term is LINEAR. Lemma 2 gives the explicit count
          (3d + 6m + 6m' + 6) Exp_G(p) + ..., with m = ceil(sqrt((p+1)/d))
          and m' = ceil(sqrt(d)).
        match: >-
          yes. No sqrt(d) second term appears for d | p + 1 in either
          version read. The reopen condition of CORR-20260923-187ea3 is not
          met.
      - term: r + 1 input model
        amendment: '"[x^i]P for i = 1..2d (2d consecutive auxiliary powers; Cheon 2006 Theorem 2)", with log2(2d) reported'
        cheon_2006: >-
          Theorem 2 has i = 1..2d, and its proof needs degree-2d
          polynomials. The 2006 ABSTRACT and INTRODUCTION instead say
          "g^(alpha^i) (i = 0, 1, 2, ..., d)". The paper is internally
          inconsistent.
        cheon_2010: >-
          Theorem 2 has i = 1..2d. The abstract says i = 0..2d, which
          includes g itself. The journal version resolves the 2006
          abstract in favour of 2d.
        match: yes, against both theorem statements. See O14.
      - term: divisor range
        amendment: every positive divisor of m_b, including 1 and m_b
        cheon: '"d is a positive divisor of p - 1" / "of p + 1" (both versions)'
        match: yes
      - term: analytic floors
        amendment: >-
          F_minus = (1 + log2(r - 1)/4)/log2 r; F_plus =
          (log2 3 - 2/3 + log2(r + 1)/3)/log2 r, attained at x = ((r+1)/4)^(1/3)
        cheon: >-
          The balanced minima O(log p * p^(1/4)) at d = O(p^(1/2)) and
          O(log p * p^(1/3)) at d = O(p^(1/3)) (2010 section 5; 2006 remark
          after Theorem 2).
        match: >-
          yes, as exact minima of the unit-constant leading expressions.
          The derivations were checked, and the closed forms equal a
          brute-force real minimisation at three toy primes. See O8 for the
          location of the plus optimum under the 2010 explicit counts.
      - term: memory
        amendment: '"Memory is not tabulated." (change.D2_typed_costs.what_is_omitted)'
        cheon: stated in closed form in both theorems of both versions
        match: omission disclosed; see O13
      - term: cost unit
        amendment: >-
          Leading expressions without the log p factor and without the O()
          constant; direction of bias "understates operation counts" (D2).
          But D9 labels the comparison "in the same group-operation unit".
        cheon: >-
          2006: O(log p * (...)) GROUP OPERATIONS. 2010: (...) * Exp_G(p),
          i.e. EXPONENTIATIONS.
        match: >-
          D2 is consistent with the source. D9's unit sentence is not (O1,
          the J5 finding). The 2010 Lemmas 1 and 2 carry constants 2 and 3
          or 6, which confirms "understates" for the O() constant. The frozen
          spec had written only "may understate".
      - term: ancillary hypotheses
        amendment: none carried in the input-model strings
        cheon_2010: >-
          Theorem 1's deterministic time uses a generator of Z_p^*, found by
          factoring p - 1 with Pollard rho in p^(1/4+o(1)) "by heuristic
          analysis". Theorem 2 assumes the ERH, for a generator of
          F_{p^2}^*. The 2006 proofs take such generators as available and
          do not cost them.
        match: not carried; see O12

    ii_toy_evaluations:
      method: >-
        Exact symbolic T over every divisor (sympy), the amendment's rules at
        160 digits on path A (mpmath) and path B (decimal), and a
        brute-force real grid for the floors. Script j2_toy.py.
      rows:
        - r: 13
          minus: >-
            m = 12. T(3) = T(4) = 2 + sqrt(3) (tie; minimiser 3, the
            smaller). e = 0.51344..., F = 0.51243..., depth 0.9858,
            NEAR_FLOOR.
          plus: >-
            m = 14. T(2) = sqrt(7) + 2 is the minimum (T(1) = sqrt(14) + 1,
            T(7) = sqrt(2) + 7, T(14) = 15). e = 0.59882..., depth 0.508,
            INTERMEDIATE.
        - r: 107
          minus: >-
            m = 106 = 2 * 53. T(2) = T(53) = sqrt(53) + sqrt(2); minimiser 2.
          plus: >-
            m = 108 = 4 * 27. T(3) = sqrt(36) + 3 = 9 = 3 * (108/4)^(1/3),
            exactly the floor: depth 1, NEAR_FLOOR. The floor invariant
            holds with equality, within the 1e-45 tolerance.
        - r: 1019
          minus: m = 1018 = 2 * 509. T(2) = sqrt(509) + sqrt(2); minimiser 2.
          plus: >-
            m = 1020 = 2^2 * 3 * 5 * 17. T(6) = sqrt(170) + 6 is the minimum,
            nearest the real optimum (255)^(1/3) = 6.34.
      result: >-
        All six branch minima and minimisers agree with the hand values to
        1e-55. Paths A and B agree to 1e-50. Each closed-form floor equals
        the grid minimum. No disagreement.

    iii_constructed_rows:
      method: >-
        128-bit toy constructions with closed-form starts (j2_rows.py). None
        is an amendment control: the controls are 256-bit with other forms
        and starts. Each row is a declared factorization state passed to a
        literal implementation of change.D3_descriptive_bins. For BOUND rows
        the exact truth is also computed from the full construction.
      unfactored_rows:
        - id: U1
          state: >-
            minus branch; r - 1 = 2 * c * C, with C = a * b (two ~32-bit
            primes) declared unfactored.
          text_returns: >-
            status BOUND; W_b = {d, d*C : d | 2c} (8 members); witnessed
            minimiser d*C, the explicit divisor C itself; depth 0.99999...;
            bin NEAR_FLOOR; lower bound F_minus.
          exact_truth: NEAR_FLOOR, same minimiser.
          determined_by_text: yes
        - id: U2
          state: >-
            minus branch; r - 1 = 2 * 105 * a * b, with a ~ sqrt(r - 1),
            C = a * b declared unfactored.
          text_returns: >-
            status BOUND; witnessed minimiser 210; depth 0.125; bin
            UNDETERMINED with bin_at_least NEAR_CEILING.
          exact_truth: NEAR_FLOOR (minimiser a, depth 0.9993)
          determined_by_text: >-
            yes. The text never promotes the witnessed bound to an exponent
            and never reports a bin the witness cannot prove. The true depth
            (0.9993) is at least the witnessed depth (0.125), as the text
            says.
        - id: U3
          state: >-
            minus branch; r - 1 = 2 * 105 * C1 * C2 with TWO composite parts
            left unsplit. C1 ~ sqrt(r - 1) is the product of two ~32-bit
            primes; C2 is the product of two primes.
          text_returns: >-
            By the formula (C_b = m_b / F_b = C1 * C2), W_b = {d, d*C1*C2}:
            UNDETERMINED with bin_at_least NEAR_CEILING (depth 0.125).
          alternative_reading: >-
            With every explicit divisor the pipeline holds (d, d*C1, d*C2,
            d*C1*C2): depth 0.99998, NEAR_FLOOR, which is also the exact
            truth.
          determined_by_text: >-
            yes by the W_b formula. But D3.status_of_a_branch says "a
            composite cofactor", controls C-PRODUCT says "the cofactor", and
            D6.reporting says "any unfactored cofactor". This row exists in
            the pipeline whenever ECM or a perfect-power split leaves two
            composite parts. The two readings give different bins. See O10.
      r_plus_1_witness_rows:
        - id: P1
          state: >-
            r + 1 = 4 * d * w, with d ~ ((r+1)/4)^(1/3) and w prime;
            r - 1 = 6q.
          text_returns: >-
            plus EXACT, minimiser 43 bits, log2(2d) = 43.0, depth 0.999,
            NEAR_FLOOR, T_plus(d) >= d. Minus EXACT, minimiser 6,
            NEAR_CEILING.
          per_typed_reading: >-
            Only T_plus is applied to the plus witness. The cross-typed value
            (the frozen expression at the plus minimiser) is computed only in
            this review, to show what change.D3_descriptive_bins.per_typed_reading
            and the invalidation rule forbid. The text forbids it.
          determined_by_text: yes
        - id: P2
          state: >-
            r + 1 = 4 * d * w with d and w both ~ 2^62-2^63, so the
            divisors of r + 1 lie near sqrt(r) only; r - 1 = 6q.
          text_returns: >-
            plus EXACT, minimiser w (63 bits), depth 0.074, NEAR_CEILING.
            The four divisors nearest sqrt(r) price at typed e = 0.488 to
            0.504. The frozen expression would put them at about 0.258.
          secondary_metric: >-
            metrics.secondary[2], "bits of the largest divisor of m_b not
            exceeding isqrt(r)", reports 64 bits on the plus branch, which is
            half of r's 128 bits. That is "a hit near sqrt(r)" on a branch
            where the typed cost bins it NEAR_CEILING. See O3.
          determined_by_text: yes
        - id: P3
          state: >-
            plus branch; r + 1 = 4 * d * a * b, with d near the plus optimum
            and C = a * b declared unfactored.
          text_returns: >-
            plus BOUND; witnessed minimiser d (from F_b); depth 0.999;
            NEAR_FLOOR; exact truth identical.
          determined_by_text: yes
      stratification_check: >-
        change.D3_descriptive_bins.stratification splits every count by the
        expected_structure_flag of frozen-list rows, by controls, and by the
        null arm per bit class. It never pools strata. This satisfies D3.
      summary: >-
        No constructed row makes the text return an undetermined value. The
        plan expected the break in the unfactored-row handling; it holds in
        the text. The remaining risk is untested handling (O9) and one wording
        gap (O10).

    iv_frozen_expression_r_plus_1:
      finding: >-
        change.D2_typed_costs.frozen_expression_on_plus is DROPPED. An
        invalidation rule voids the table on any evaluation of
        sqrt(m/d) + sqrt(d) on the plus branch or on any combined column. No
        arithmetic-only value enters a cost column. This holds. One adjacent
        quantity remains unlabelled: the plus-branch largest divisor not
        exceeding isqrt(r) (O3).

  # ===========================================================================
  # J5 -- LABELLING, SCOPE AND PROVES-TOO-MUCH (D9)
  # ===========================================================================
  J5:
    verdict: breaks
    decisive_reason: >-
      The plan's breaking artifact is "an unlabelled or over-scoped
      sentence". change.D9_labelling.rule MANDATES such a sentence in every
      run artifact and in every citing record: rho_ordinary_input is
      annotated "in the same group-operation unit" as the typed exponents.
      The typed exponents drop the factor that converts Cheon's step count to
      group operations (O(log p) per step in 2006; Exp_G(p) in 2010), and
      D2.what_is_omitted says so. D9's header list does not carry that
      omission beside the rho column. The labelling rule therefore requires
      an identical-unit claim that both source versions contradict. That is
      the identical-accounting defect D9 exists to remove, restated as a
      unit. The rules themselves keep every known-false conclusion out of
      reach (PTM-A to PTM-D all hold). The break is in text and can be fixed
      in text.

    i_sentence_audit:
      - id: S1
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        field: amendment.change.D9_labelling.rule
        quote: >-
          The rho column is named rho_ordinary_input, value 0.5 (the frozen
          rho_baseline), and is annotated as the ordinary-input exponent of a
          different problem, in the same group-operation unit.
        ruling: >-
          UNLABELLED UNIT CLAIM, and the decisive J5 break. Rho counts group
          operations. The typed T_b counts Cheon's steps, each costing an
          exponentiation: O(log p) group operations (2006 Theorems 1 and 2;
          2010 Exp_G(p)). The dropped factor is Theta(log r). In exponent it
          is log2(log2 r)/log2 r: 0.035 at 224 bits, 0.031 at 256, 0.022 at
          384 and 0.017 at 521, before the exponentiation constant. These
          figures are computed from bit lengths only. The phrase follows
          CORR-20260923-5c5a23 S4's reading of completion criterion 1. The
          sources contradict that reading once the log factor is dropped,
          so the fix touches both texts.
        checked_against: >-
          CORR-20260923-187ea3 labelling_rule_for_any_citing_record: complied
          with in name. The column names rho_ordinary_input and
          E_ASSUMES_AUXILIARY_INPUT, the per-branch input model, the bits of
          d, B032-C7 and B032-C8, and the supply condition are all present.
          The rule forbids "identical accounting" unqualified, and S1
          restates it unqualified. CORR-20260923-5c5a23 S4: the same phrase.
      - id: S2
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        field: amendment.interpretation_limits[4]
        quote: >-
          Controls are at B = 256 bits. Their passing validates the pipeline
          at that size; transfer to the 224- to 521-bit rows is an
          assumption, most exposed where large rows are BOUND.
        ruling: >-
          OVER-SCOPED. No control can pass with a BOUND or VOID branch: every
          gate requires EXACT. No control reaches stage F3: every control
          part is at most 257 bits, below the 272-bit route to GMP-ECM. No
          control has two composite parts. Passing validates the EXACT path
          through F0, F1 and F2, certification and evaluation on three
          constructed shapes. It validates neither "the pipeline" nor the
          BOUND rules the plan singled out. Narrow the sentence to that.
      - id: S3
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        field: amendment.metrics.secondary[2]
        quote: >-
          per row and branch - bits of the largest divisor of m_b not
          exceeding isqrt(r) (EXACT), or of the largest such explicit witness
          (BOUND, a lower bound)
        ruling: >-
          UNLABELLED ON THE PLUS BRANCH. On r + 1 a divisor near sqrt(r)
          prices at T_plus >= d >= about sqrt(r), which is no gain (PTM-D,
          row P2). The quantity is the frozen-expression scale that D2 drops.
          It is also the literal trigger text of GOAL-AUXIN-a93442 pause
          condition 3, "a hit near sqrt(r)". Label it on the plus branch as
          "arithmetic; not a Theorem-2 quantity", or report it on the minus
          branch only.
      - id: S4
        file: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/design/TASK-20260923-5a2cbc/design-report.yaml
        field: design_report.unmet_or_partial[4] (item "Control scale").detail
        quote: >-
          At the largest deployed sizes a Theorem-2 optimal divisor is beyond
          ECM reach within the budget, so no control there could be expected
          to pass.
        ruling: >-
          UNSUPPORTED, and false as stated. A planted divisor need not be
          prime; C-PLANT-M already uses a composite D for this reason.
          Counterexample (smooth_plant_521.py): a 521-bit prime r with
          r + 1 = 12 * D * w, where D is a product of 8 primes just below
          2^24 and w a single 325-bit prime. Stage-F0 trial division alone
          leaves exactly w, in 13 s here. The amendment's plus rules then
          return EXACT and NEAR_FLOOR (depth 0.998, minimiser a factor 2.1
          below ((r+1)/4)^(1/3)). The sentence is an unsupported
          closure of control coverage, and interpretation_limits[4] rests
          its transfer assumption on it.
      - id: S5
        file: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/design/TASK-20260923-5a2cbc/design-report.yaml
        field: design_report.hypothesis_restatement_proposal.finding
        quote: >-
          DEC-20260923-ce06a6 (J7_generic) and CORR-20260923-5c5a23 S3 show
          the dichotomy carries no curve-specific information at these sizes.
        ruling: >-
          OVER-SCOPED. The null measurement behind J7_generic is 256-bit only.
          CORR-20260923-187ea3 generic_reading says "primes of that size",
          and CORR-20260923-5c5a23 S3 says "At 256 bits". The sentence
          extends it to "these sizes", which covers 224 to 521 bits. Narrow
          it to 256 bits, or cite a measurement at the other sizes.
      - id: S6
        file: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/design/TASK-20260923-5a2cbc/design-report.yaml
        field: design_report.design_choices[0].reason
        quote: >-
          the escalate fires on almost any prime of that size, and
          CORR-20260923-5c5a23 S3 records the inert branch as practically
          unreachable.
        ruling: >-
          MILDLY OVER-SCOPED. "Almost any" paraphrases a 32-prime sample
          whose interval is recorded in CORR-20260923-187ea3. "Practically
          unreachable" drops S3's own qualifier, "at deployed sizes", and its
          256-bit measurement basis. Low severity; not decisive.
      - id: S7
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        field: amendment.definitions.depth
        quote: >-
          Mathematically F_b(r) <= e <= C_b(r), so s lies in [0, 1]
        ruling: >-
          IMPRECISE, low severity. The statement is true for branch minima
          and BOUND upper bounds, because d = 1 is always a candidate. It is
          false for a single e_plus(d): at d = r + 1, e_plus exceeds C_plus
          (toy check at r = 13, 107 and 1019). Say "for a reported branch
          value".
      - id: S8
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        field: amendment.controls[C-PLANT-P].purpose
        quote: >-
          The planted divisor sits at the Theorem-2 optimum near
          ((r + 1)/4)^(1/3).
        ruling: >-
          IMPRECISE LABEL, low severity. ((r+1)/4)^(1/3) is the optimum of
          the unit-constant leading expression T_plus. Under Cheon 2010
          Lemma 2's explicit exponentiation count, 3d + 6 sqrt((r+1)/d) + ...,
          the optimum is near (r + 1)^(1/3), a factor 4^(1/3) higher. The
          control is consistent with the amendment's own T_plus. Say
          "T_plus optimum".
    not_over_scoped_checked:
      - amendment.change.D2_typed_costs.what_is_omitted (discloses the log p and O() omission and the direction of bias)
      - amendment.interpretation_limits[0..3] and [5]; amendment.non_claims; amendment.authorization
      - amendment.proof_search_map.method_ceiling ("cannot move any exponent")
      - amendment.change.D4_calibration.what_the_null_arm_is_for and change.D3_descriptive_bins.semantics
      - amendment.controls[C-PLANT-P].purpose second sentence (T_plus(d) >= d; correct per both sources)
      - amendment.change.D1_pins.rows[BN254-r].disambiguation (parameter provenance only; see tripwires.T1)
      - design_report.design_choices on the r + 1 planted divisor ("a divisor near sqrt(r) costs about sqrt(r) on r + 1"; correct)

    ii_proves_too_much:
      failure_signature_source: coordination/review/auxin-20260923-09aadd/review-plan.yaml proves_too_much.failure_signature
      PTM-A:
        status: PERFORMED (review computation; ptm_a.py)
        object: >-
          The TASK-20260922-0e10d1 PTM-2 prime, rebuilt from its construction
          text (red-team-report.yaml lines 994-1003): r = 12q' - 1, with q',
          q = 6q' - 1 and r prime; start ceil(2^255/12) plus
          random.Random(2026092202).getrandbits(248); step +1.
        rebuild: >-
          First acceptable q' after 37,349 candidates, the count the
          construction text reports. The rebuilt r equals the integer that
          report prints; that integer was read only after the rebuild, for
          comparison. q' < 2^252, so PTM-A lies outside C-INERT's window
          [2^252, 2^252 + 2^48) and is provably not the amendment's C-INERT
          integer. C-INERT was not built (RA-6).
        amendment_rules_output: >-
          Blind trial division gives r - 1 = 2q and r + 1 = 2^2 * 3 * q'.
          Minus: EXACT, minimiser 2 (tied pair {2, q}, the smaller reported),
          depth 0.008, NEAR_CEILING. Plus: EXACT, minimiser 12 (the largest
          divisor of 12), depth 0.043, NEAR_CEILING. Paths A and B agree;
          the floor invariant holds.
        against_signature: MET. Not flagged on either branch. No bin carries semantics.
      PTM-B:
        status: PERFORMED (review computation; ptm_b.py)
        object: >-
          The brainpoolP384r1 field prime p, from RFC 5639 section 3.6, label
          p, lines 683-684 as stored (newline-delimited). It is presented as
          the brainpoolP384r1 r. The file's sha256 is recorded in
          computations.json.
        amendment_rules_output: >-
          The literal change.D1_pins.field_prime_confounder_check returns
          REJECT with reason field_prime. No factoring and no cost is
          computed. The not_prime clause does not fire (p is prime). The
          hasse clause does not fire: with h = 1, |p + 1 - h*p| = 1. The true
          order q (lines 698-699) is admitted by all three clauses.
        against_signature: >-
          MET. Rejected as an invalid measurement before any factoring or
          cost.
        survival_location_under_mutation: >-
          Delete or mis-parse the equality clause and PTM-B is ADMITTED. For
          every h = 1 row the hasse clause admits r = p, the anomalous-trace
          case, and p is prime. The equality comparison against the
          extracted field prime is the ONLY separator. C-FIELD case 1 (h = 1)
          therefore tests that one clause. See O15 and required control RC3.
      PTM-C:
        status: PERFORMED (review computation; ptm_c.py)
        object: >-
          16 uniformly random 256-bit primes. Rejection sampling with
          random.Random(20260923635) plus 30 Miller-Rabin rounds; 1,232
          draws. The sampler, size and seed were declared in
          ptm_c_declaration.json (sha256 41e69cde...a024, 21:56:59Z) before
          any sample was drawn (21:57:26Z). r - 1 and r + 1 were factored by
          a sympy review pipeline with a 120 s cap, not the amendment's
          PARI/GMP-ECM pipeline, and the amendment's status, W_b and bin
          rules were applied unchanged.
        amendment_rules_output: >-
          Same categories as any row. Minus branch: EXACT/NEAR_FLOOR 3,
          EXACT/INTERMEDIATE 6, EXACT/NEAR_CEILING 5, BOUND/UNDETERMINED 2.
          Plus branch: EXACT/NEAR_FLOOR 8, EXACT/INTERMEDIATE 5,
          EXACT/NEAR_CEILING 1, BOUND/UNDETERMINED 2. Paths A and B agree on
          all 32 branches. The floor invariant holds everywhere. There are no
          boundary flags and no branch with two composite parts.
        rules_check: >-
          No rule reads any category as curve-specific.
          change.D3_descriptive_bins.semantics is "None".
          change.D4_calibration.what_the_null_arm_is_for says the null arm
          "licenses no curve-specific reading". interpretation_limits[3]
          says "No bin on any row is read as curve-specific".
          success_criterion.decidability says no frozen-list row value
          decides any outcome. The null arm per bit class is reported beside
          the frozen-list rows (D4, null_arm.reported_beside_deployed).
        against_signature: >-
          MET. The categories match, and no category is read as
          curve-specific, because no pre-registered rule reads one at all.
        context: >-
          The bins are generic under the amendment's own cut-offs. NEAR_FLOOR
          occurred on 8 of 16 random plus branches (Clopper-Pearson 95 %
          0.247 to 0.753) and 3 of 16 minus branches (0.040 to 0.456). A
          NEAR_FLOOR frequency on frozen-list rows means nothing without the
          null arm beside it, as the amendment provides. The plan's prior
          located the PTM-C risk exactly there, and the rules avoid it.
      PTM-D:
        status: PERFORMED (review computation; ptm_d.py)
        object: >-
          Three toy primes whose r + 1 has divisors strictly above sqrt(r):
          r = 1019 (12 such divisors), a 65-bit r = 2dk - 1 (64 such
          divisors) and a 129-bit r = 2dk - 1 (80 such divisors).
        amendment_rules_output: >-
          For every divisor d > sqrt(r), T_plus(d) >= d > sqrt(r). The
          smallest T_plus/sqrt(r) over those divisors is 1.237, 2.000 and
          2.000. The dropped frozen expression would price 11 of 12, 63 of
          64 and 79 of 80 of them BELOW sqrt(r). The reported plus minimiser
          never exceeds sqrt(r). This is argued in general: for integer
          d >= 2 with d^2 > r, T_plus(d) > T_plus(1), and 1 is in every
          EXACT divisor set and every W_b.
        against_signature: MET. Every r + 1 cost at a d above sqrt(r) is at least sqrt(r).
      summary: >-
        No object makes the amendment's rules deliver the known-false
        conclusion. The rules, not just the prose, keep all four out of reach.
        J5's break is in labelling and scope text only.

  # ===========================================================================
  objections:
    - id: O1
      joint: J5
      severity: material (decisive for J5)
      location: amendment.change.D9_labelling.rule
      finding: See J5.i_sentence_audit S1.
      fix: >-
        Require, in the typed_table header next to rho_ordinary_input, a
        line saying that the typed exponents count Cheon steps
        (exponentiations; the log p or Exp_G(p) factor and the constants are
        omitted, so they understate), while rho counts group operations; the
        units differ by Theta(log r). Alternatively add a column that carries
        log2(log2 r). Composition may also need to correct the same phrase
        in CORR-20260923-5c5a23 S4.
    - id: O2
      joint: J5
      severity: material
      location: amendment.interpretation_limits[4]
      finding: See S2. The controls' passing is read as validating paths they never exercise.
      fix: Narrow the sentence, and add RC1 and RC2.
    - id: O3
      joint: J5 (J2 iv adjacent)
      severity: moderate
      location: amendment.metrics.secondary[2]
      finding: See S3 and row P2.
      fix: Label the metric or drop it on the plus branch. Name GOAL-AUXIN-a93442 pause condition 3's scale problem in the table header.
    - id: O4
      joint: J5
      severity: moderate
      location: design_report.unmet_or_partial[4]
      finding: See S4. An unsupported negative on control coverage, refuted at 521 bits.
      fix: Withdraw the sentence, or replace it with a smooth-planted control above 272 bits (RC2).
    - id: O5
      joint: J5
      severity: low to moderate
      location: design_report.hypothesis_restatement_proposal.finding
      finding: See S5.
      fix: Write "at 256 bits", or cite a measurement at the other sizes.
    - id: O6
      joint: J5
      severity: low
      location: design_report.design_choices[0].reason
      finding: See S6.
      fix: Restore S3's qualifier and cite the sample and interval by record.
    - id: O7
      joint: J5
      severity: low
      location: amendment.definitions.depth
      finding: See S7.
      fix: Write "for a reported branch value".
    - id: O8
      joint: J5 (J2 source)
      severity: low
      location: amendment.controls[C-PLANT-P].purpose
      finding: See S8.
      fix: Write "T_plus optimum".
    - id: O9
      joint: J2
      severity: material (a coverage gap, not a text break)
      location: amendment.controls (all), amendment.change.D3_descriptive_bins
      finding: >-
        The BOUND rules have no in-run control: the witness set W_b, the
        upper and lower bounds, UNDETERMINED and bin_at_least. The plan's
        prior named them as the likely break. Every construction control must
        be EXACT to pass, so a passing control never exercises them. The only
        guard is path A/B agreement. Two implementations written from one text
        share its misreadings, and J4's blind agreement covers controls only.
      fix: RC1.
    - id: O10
      joint: J2
      severity: moderate
      location: >-
        amendment.change.D3_descriptive_bins.status_of_a_branch and
        .explicit_witness_set; controls[C-PRODUCT].gates;
        change.D6_factoring.reporting
      finding: >-
        When two or more composite parts remain, the W_b formula
        (C_b = m_b / F_b) discards explicit divisors the pipeline holds
        (d*C1, d*C2). The singular "a composite cofactor" and "the cofactor"
        sit beside D6's "any unfactored cofactor". Row U3 flips from
        UNDETERMINED (formula) to NEAR_FLOOR (every explicit divisor).
        Neither reading is mathematically wrong, but they disagree. The case
        did not occur in 32 random 256-bit branches (PTM-C). It is likelier
        at 384 and 521 bits.
      fix: >-
        State that C_b is the product of all unfactored parts, and either
        keep W_b as written or define it over all products of the recorded
        parts. Then add one U3-type case to RC1.
    - id: O11
      joint: J2
      severity: low (not reachable in practice)
      location: amendment.definitions.bins vs amendment.change.D3_descriptive_bins.bin_by_status
      finding: >-
        definitions.bins puts a depth within 1e-45 of 3/4 on the lower-depth
        side. D3's BOUND clause says NEAR_FLOOR for depth >= 3/4. A BOUND
        depth in [3/4, 3/4 + 1e-45) gets two answers. No row in this review
        came within the tolerance.
      fix: State which clause takes precedence.
    - id: O12
      joint: J2
      severity: moderate (labelling; heuristic inventory)
      location: amendment.change.D2_typed_costs.columns (input model strings)
      finding: >-
        Two hypotheses the sources attach to the theorems are not carried.
        Cheon 2010 Theorem 2 assumes the ERH, for a generator of F_{p^2}^*.
        Cheon 2010 Theorem 1 finds a generator of Z_p^* by factoring p - 1
        in p^(1/4+o(1)) "by heuristic analysis", the same order as the minus
        floor. The 2006 proofs take such generators as available and do not
        cost them.
      fix: >-
        Append "(ERH, Cheon 2010 Thm 2)" to the plus input model. Add a note
        that the minus-branch generator step costs p^(1/4+o(1)) (Cheon 2010,
        section 2.1).
    - id: O13
      joint: J2
      severity: low
      location: amendment.change.D2_typed_costs.what_is_omitted
      finding: >-
        Memory is omitted, although both theorems in both versions state it
        in closed form, max{sqrt(m/d), sqrt(d)} elements. It costs one column
        per branch.
      fix: Add log2 of the memory bound per branch.
    - id: O14
      joint: J2
      severity: low
      location: amendment.change.D2_typed_costs.source_statement
      finding: >-
        The 2006 abstract and introduction give the r + 1 input as i = 0..d.
        The amendment's i = 1..2d follows Theorem 2 and its proof, and the
        2010 version confirms it. A reader of the 2006 abstract alone would
        halve log2(2d).
      fix: Cite "Theorem 2 (not the abstract)" and note the 2010 confirmation.
    - id: O15
      joint: J5 (PTM-B survival location; D1 is J1's)
      severity: moderate
      location: amendment.change.D1_pins.field_prime_confounder_check.rule
      finding: >-
        For h = 1 rows, the hasse clause cannot reject r = p (|p + 1 - p| = 1),
        and not_prime cannot either. Rejection of the field-prime confounder
        rests on the equality clause alone. C-FIELD case 1 tests only that
        clause.
      fix: RC3.

  required_controls:
    - id: RC1
      what: >-
        An evaluator-level BOUND control. Declared (F_b, C_b) states go
        through the D3 code on both paths, with the expected status, W_b
        size, witnessed minimiser, bounds, bin and bin_at_least precomputed
        from the text. Include at least a U1 type (witness d*C_b, NEAR_FLOOR),
        a U2 type (hidden divisor, UNDETERMINED with bin_at_least) and, after
        O10's clarification, a U3 type (two composite parts). The declared
        states in computations.json raw_outputs.j2_rows can serve as
        templates.
      discriminates: >-
        A BOUND evaluator that promotes a bound to an exponent, drops d*C_b
        from W_b, bins a BOUND row by its witness alone, or mishandles
        several cofactors. None of these fails any current gate.
    - id: RC2
      what: >-
        A planted positive above 272 bits, for example plus-branch at 384 and
        521 bits with a smooth planted divisor, which F0 removes (construction
        shown at 521 bits). Where F3 coverage is wanted, add a planted
        ECM-findable prime factor inside a composite part above 272 bits.
      discriminates: >-
        Whether the evaluator, large-prime certification and (with the
        second form) the GMP-ECM route work at the sizes the transfer
        assumption covers.
    - id: RC3
      what: >-
        A mutation check for C-FIELD. With the equality clause disabled, case
        1 must be ADMITTED. This shows that C-FIELD tests the clause it
        claims to test. If the Coordinator wants a second, independent
        separator, the only one I can name is a single scalar multiplication
        [r]G = O with the printed base point. That involves no auxiliary
        power, but it is arithmetic on a frozen-list curve, which this lane
        has so far excluded, so the choice belongs to the Coordinator.
      discriminates: A confounder check whose only barrier is silently broken by a parser change.

  counterexample_or_mutation: >-
    (1) Row U3: the same declared factorization state gets UNDETERMINED
    under the W_b formula and NEAR_FLOOR under the every-explicit-divisor
    reading (O10). (2) The 521-bit smooth-planted prime refutes design
    report S4. (3) PTM-B mutation: deleting the equality clause admits the
    field prime, because the hasse clause is blind at h = 1 (O15). (4) PTM-D
    and row P2: the frozen expression prices nearly every divisor above
    sqrt(r) below sqrt(r). The amendment's T_plus never does.

  baseline_comparison: >-
    The object is a protocol amendment. It asserts no gain, so no Pareto
    claim or dominated_by reading exists to check. rho_ordinary_input 0.5 is
    the ordinary-input exponent of a different problem (DEC-20260802-204
    B032-C7/C8, cited by D9). BSGS has the same exponent, with memory
    sqrt(r). The closest specialized baseline is Cheon's own algorithms, and
    the typed rows are that baseline evaluated at integers. The one
    mis-stated comparison is the unit (O1): the typed exponents are in
    exponentiations, rho is in group operations. On the other axes, memory
    is absent (O13) and data is present on the plus branch (log2(2d)); the
    minus branch uses one power.

  heuristic_challenges:
    - >-
      Hypothesis inventory (O12): ERH for Cheon 2010 Theorem 2, and
      heuristic generator finding at p^(1/4+o(1)) for Theorem 1. The
      amendment claims no heuristic-conditional result, so these are
      labelling items, not rejection grounds.
    - >-
      Random-model context for the bins (PTM-C): half of random 256-bit plus
      branches land NEAR_FLOOR. The null arm of 16 per bit class
      (null_arm.size_per_class) gives intervals about 50 points wide. The
      amendment reads nothing from it, which is consistent. Any later rule
      that does read it needs a larger arm, and D4 already defers any such
      rule to a later amendment.
    - >-
      The null-arm sampler's next-prime gap bias is disclosed in
      null_arm.disclosed_sampler_bias. Rejection sampling (used in PTM-C)
      avoids it at the cost of more primality tests. Optional.

  cost_model_challenges:
    - The unit mismatch between typed exponents and rho (O1).
    - >-
      Constants: Cheon 2010 Lemma 1 has 2(...)Exp_G, and Lemma 2 has
      (3d + 6m + 6m' + 6)Exp_G, which confirms the D2 direction of bias
      ("understates") for the O() constant. Lemma 2 also moves the plus
      optimum to about (r + 1)^(1/3) (O8).
    - Memory is not tabulated (O13).
    - >-
      The generator-finding step for the minus branch, p^(1/4+o(1)) in Cheon
      2010, is the same order as the minus floor. The leading-expression
      table does not carry it (O12).

  reduction_and_scope_challenges:
    - >-
      The supply condition is stated in the header (D9), B032-C7/C8 are
      cited, and the IDEA-20260831-ccb587 supply question is marked
      unopened. These hold.
    - >-
      No affected-versus-safe list and no system-level scope appear in
      either file. They hold.
    - >-
      Over-scoped or unsupported sentences: S2, S4, S5 and S6 (J5
      i_sentence_audit).

  proof_architecture_challenges:
    - >-
      Observation fibre: UNDETERMINED(at_least NEAR_CEILING) covers rows
      whose truth is NEAR_FLOOR (U2) as well as rows that really are near
      the ceiling. The separator is status plus bin_at_least, and the text
      keeps it. Holds.
    - >-
      Quantifier order: the number of composite parts recorded is an
      outcome of the factoring run, and in U3 the bin depends on it.
      Fix O10 by rule before the run.
    - >-
      Nearby objects: PTM-A to PTM-D and the P2 row. All hold.
    - >-
      Method ceiling: a certified typed arithmetic table of Cheon's known
      leading expressions at specific integers. I agree with
      proof_search_map.method_ceiling.

  cross_joint_observations:
    - id: X1
      for_joint: J1 (not my verdict)
      note: >-
        D1's "line numbers (1-based, as the file is stored)" is ambiguous for
        files with form feeds. rfc5639.txt has 27. Python str.splitlines()
        places brainpoolP384r1 p and q at 695-696 and 710-711. Newline
        numbering, which CORR-20260923-64ee17 C1 uses, gives 683-684 and
        698-699. The amendment reports rather than rejects a different span,
        so this is noise, not a failure. Stating "LF-delimited" would remove
        it.
    - id: X2
      for: composition
      note: >-
        J3 and J4 agreement cannot cover D3's BOUND rules, because no control
        has a BOUND branch (O9). Composition should not read Q1 to Q3
        agreement as covering them.
    - id: X3
      for: composition, K-hypothesis
      note: >-
        I concur with the design report that H-AUXIN-66e6fd cannot be typed
        without changing it. Both source versions cost r + 1 with a linear d
        term and 2d powers. The hypothesis's single E(r) applies the r - 1
        expression to both branches. Also, H-AUXIN-66e6fd says a log-r cofactor
        appears "in some Cheon writeups". It is in the theorem statements of
        both versions read.
    - id: X4
      for: composition
      note: >-
        The origin of O1 is the phrase "in the same group-operation unit" in
        CORR-20260923-5c5a23 S4. Any wording fix is a Coordinator record.

  narrowest_supported_statement: >-
    J2: the amendment's typed leading expressions and input models agree term
    by term with Cheon 2006 Theorems 1 and 2 (IACR archive copy). They also
    agree with the J. Cryptology 2010 author manuscript's Theorems 1 and 2,
    except that the ERH and generator hypotheses and memory are not carried.
    The D3 rules return text-determined values on every constructed
    unfactored and r + 1 witness row tested, and no in-run control exercises
    the BOUND rules. J5: the rules keep all four known-false conclusions out
    of reach. The D9 labelling rule mandates a unit-equivalence sentence the
    sources contradict. Four further sentences in the two files (S2 to S5)
    are over-scoped, unlabelled or unsupported, and three (S6 to S8) are
    imprecise. The finding covers these two committed files
    only. It says nothing about any curve, run or system.

  next_concrete_action: >-
    If composition revises (K-revise-defect on D9), the revision card
    replaces the unit clause of change.D9_labelling.rule with a mandatory
    typed_table header line. The line states that the typed exponents count
    Cheon steps (exponentiations; the log p or Exp_G(p) factor and the
    constants are omitted, so they understate), that rho counts group
    operations, and that the units differ by Theta(log r). The same card
    adds RC1, a declared-state BOUND evaluator control. Text only; no run.

