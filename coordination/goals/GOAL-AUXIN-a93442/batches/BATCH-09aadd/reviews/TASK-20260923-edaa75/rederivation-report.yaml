    - id: Q0-3
      kind: reference to Stage P values (confounder check on control integers)
      text_quoted: >-
        field_prime_confounder_check.applies_to: "EVERY deployed row, before any factoring, and every
        control and null-arm integer." rule: "REJECT the candidate r, with reason field_prime, if r equals
