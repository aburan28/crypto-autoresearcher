  # ---------------------------------------------------------------------------
  # DESIGN CHOICES AND REASONS.
  # ---------------------------------------------------------------------------
  design_choices:
    - choice: Calibration option (b). Escalate semantics removed; descriptive table; null arm run first and reported beside.
      reason: >-
        DEC-20260923-ce06a6 applied J7_generic: the escalate fires on almost any
        prime of that size, and CORR-20260923-5c5a23 S3 records the inert branch
        as practically unreachable. Option (a) would need a null arm factored at
        every deployed bit length, including the two largest, to the same
        budget, and could compare it with at most eight non-pairing deployed
        rows per branch. That comparison is expensive and has low power. It
        would also bring back curve-naming semantics that the goal treats as a
        stop-and-escalate. The lane's value (DEC-20260923-ce06a6 rationale) is
        a certified, correctly typed table, and option (b) delivers exactly
        that.
      cost_stated: >-
        No curve-specific reading is possible from this run. A later amendment
        may pre-register a rule using this null arm; this run's rows are never
        re-scored by it.
    - choice: The planted r + 1 divisor sits at the Theorem-2 optimum ((r+1)/4)^(1/3), not near sqrt(r).
      reason: >-
        Under the typed cost T_plus(d) = sqrt((r+1)/d) + d >= d, a divisor near
        sqrt(r) costs about sqrt(r) on r + 1. Planted there, the control would
        not be a positive. The analytic floor F_plus is attained at
        x = ((r+1)/4)^(1/3), so that is where a known positive must be planted.
    - choice: Every construction control has BOTH branches known by construction (minimal forced smooth parts 2 on r - 1 and 2^2 * 3 on r + 1).
      reason: >-
        This lets the controls be classified on both branches without any
        factoring by reviewers (Q2 and Q3). It also lets the pipeline's blind
        factorization be checked exactly, as a multiset. The forced parts follow
        from r being an odd prime above 3 with the other branch of the form 2q.
    - choice: The planted r - 1 divisor is composite, D = d1 * d2 with d1 and d2 near r^(1/4), rather than one prime near sqrt(r).
      reason: >-
        One prime near sqrt(r) would make r - 1 a balanced semiprime at B bits.
        Only MPQS or NFS splits that, so the positive control would test factoring
        capacity instead of the evaluator and would risk a K-infra stop. With d1
        and d2 near r^(1/4), ECM splits r - 1 quickly, and D still sits at the
        Theorem-1 optimum paired with (r - 1)/D.
    - choice: Controls at B = 256 with M0 = 3 * 2^(B-2).
      reason: >-
        B = 256 is the modal deployed size. M0 leaves a 2^(B-3) margin on each
        side, so every accepted r has exactly B bits. Search windows are far
        wider than the expected number of candidates.
    - choice: Seedless, closed-form search starts and first-acceptable-candidate rules.
      reason: >-
        The last run failed on an undeclared start (CORR-20260923-64ee17 C3).
        A start given in closed form, searched in steps of +1, with a
        mathematical acceptance rule, has no language, library or RNG-version
        dependence. C-INERT keeps the PTM-2 construction FORM, but its start is
        fixed by this text, so it is a fresh integer and nothing was copied.
    - choice: Acceptance is defined by true primality, with a Baillie-PSW screen and a certificate proof. A screen-passing composite is skipped and recorded; certificate failure without a compositeness proof stops the run as infrastructure.
      reason: >-
        This makes the first accepted candidate a mathematical fact, independent
        of which test an implementation runs. The two failure branches are split
        so that no tool behaviour can silently change a control.
    - choice: Tie rule is the smallest divisor among values within relative 10^-100 of the minimum; minus-branch pairs d and m/d tie exactly.
      reason: >-
        On r - 1 ties are systematic, so an undeclared tie-break would produce
        undetermined minimisers (J4). Precision of 150 digits makes the relative
        tie window meaningful.
    - choice: Descriptive bins on a normalised depth, with the declared constants 1/4 and 3/4 and a conservative boundary rule.
      reason: >-
        Q2 needs a classification that applies equally to controls, deployed
        rows and the null arm (PTM-A, PTM-C). Normalising by each branch's own
        floor and ceiling makes the minus and plus bins comparable in meaning
        without mixing their costs. The bins carry no semantics.
    - choice: Frozen-expression r + 1 values are DROPPED rather than labelled; no combined E(r).
      reason: >-
        A labelled column still sits in the table and can be cited as a cost.
        CORR-20260923-187ea3's standing clause routes any such citation to
        review-breakthrough. Dropping the column removes that route at no cost,
        because on r - 1 the frozen expression is T_minus and continues
        unchanged.
    - choice: The factoring pipeline routes each part by size between PARI/GP factor() (ECM plus MPQS) and the GMP-ECM ladder, with the full budget for every integer.
      reason: >-
        MPQS is effective only up to moderate sizes; above them ECM is the only
        method that can use a fixed budget. The 272-bit value only routes a part
        between methods and never ends the budget. It is deliberately a
        different value from the undeclared cap that CORR-20260923-64ee17 C5
        records. The GMP-ECM curve counts per level come from the installed
        version's own table and are recorded at admission, not stated here.
    - choice: Certificates are PARI primecert ECPP chains plus Pratt certificates below 2^64 and at chain ends, checked by a new stdlib-only verifier with admission self-tests on 2^89 - 1, 2^607 - 1 and a tampered certificate.
      reason: >-
        This is the D7 wording exactly: exported, library-produced, and checked
        by code that shares nothing with the producer. The self-tests catch a
        certificate-format mismatch before any row depends on it.
    - choice: Tool versions are stated as minimums, with the exact versions recorded at admission. Absence is an infrastructure stop.
      reason: >-
        This session has no shell and cannot probe the environment. Naming an
        exact version it cannot see would be a fabricated fact.
    - choice: BN254-r is fixed to alt_bn128 (b = 3); r is pinned from EIP-197, with the Yellow Paper Appendix E as the ordered fallback; the BN family relation is checked with u derived from the same source's p.
      reason: >-
        The frozen r_pin_source text names BN(2,254) and alt_bn128 together, and
        those are two different BN curves. That is a latent D1 ambiguity, fixed
        here before any run. alt_bn128 matches the spec's Ethereum source
        option. Deriving u from p means no parameter comes from memory.
    - choice: Pins name in-repo primary files (listed in knowledge/sources.json) and semantic locators. Line numbers are recorded at run time, and stated in advance only for brainpoolP384r1 (from CORR-20260923-64ee17 C1).
      reason: >-
        The source files are outside this card's read scope, so this session
        could not read line numbers for the other rows. D1 asks for line numbers
        at run time, and the amendment requires them there. See
        unmet_or_partial below.
    - choice: Null arm of 16 primes per deployed bit class, sampled with SHAKE-256 labels, run through the identical pipeline and budget.
      reason: >-
        Language-neutral and fully determined by its text. Matching bit class
        and budget is what makes it comparable, including the frequency of BOUND
        rows at large sizes. Sixteen is enough for context, and the design
        claims no more for it. The next-prime sampling bias is disclosed.
    - choice: Stage order A0, P, C, N, D, R, T.
      reason: >-
        Admission and pins come first. Controls and the null arm are complete
        and hashed before any deployed factorization starts, which the goal's
        ordering and J3 (iv) require.
    - choice: New implementation subdirectory implementation/d1d10/ and a new trial plan.
      reason: >-
        This keeps the code of earlier runs recoverable (CORR-20260923-64ee17
        C6) and applies D10 to code as well as to protocol text.
    - choice: The only negative outcomes are N1 to N3, all at the instrument level. No deployed-row value decides any outcome.
      reason: >-
        This is the honest shape of option (b). The success criterion stays
        decidable, and N1 (a failed planted or inert control) is a real
        falsification of the census pipeline at deployed size.
    - choice: Token hygiene. Windows 2^24 and 2^48, tolerance 10^-45, and field names instead of values for the frozen thresholds, factoring budget and old seeds.
      reason: >-
        To keep numeric tokens clear of values that appear in the correction
        records and BATCH-ba0b0d, ahead of the session's digest check. No
        scientific consequence.

  controls_declared:
    - {name: C-PLANT-M, purpose: planted positive on r - 1 at deployed size (Theorem-1 optimum)}
    - {name: C-PLANT-P, purpose: planted positive on r + 1 at deployed size under the typed Theorem-2 cost}
    - {name: C-INERT, purpose: known negative on both branches (PTM-2 construction form)}
    - {name: C-FIELD, purpose: field prime presented as r must be rejected by the D1 confounder check}
    - {name: C-PRODUCT, purpose: exact product check (frozen spec control)}
    - {name: C-RECOMPUTE, purpose: path A and path B agreement (frozen spec control strengthened by the precision rule)}
    - {name: C-ORDER, purpose: controls and null arm complete and hashed before any deployed factorization}

  calibration_choice:
    option: b
    summary: >-
      Escalate semantics removed and the frozen thresholds retired. A frozen
      null arm runs first and is reported beside the deployed rows as context.
      Every cut-off is a declared constant.

  backends_named:
    - GMP-ECM, minimum 7.0.4, exact version recorded at admission
    - PARI/GP (factor, primecert, primecertisvalid), minimum 2.13.0, exact version recorded at admission
    - implementation/d1d10/cert_verify.py, stdlib-only independent verifier, versioned by its sha256 at the run's code commit
    - Python standard library (path B), minimum Python 3.10
    - sympy excluded from every primality verdict

  # ---------------------------------------------------------------------------
  # HYPOTHESIS RESTATEMENT PROPOSAL (DA-10). Not a new hypothesis; composition
  # decides under K-hypothesis.
  # ---------------------------------------------------------------------------
  hypothesis_restatement_proposal:
    hypothesis_id: H-AUXIN-66e6fd
    finding: >-
      The statement cannot be typed without changing it. It defines one
      untyped E(r), a minimum over both branches of the same expression
      sqrt((r+-1)/d) + sqrt(d), and asserts a dichotomy at the frozen
      e_inert_floor and e_escalate_ceiling. CORR-20260923-187ea3 shows the
      branches answer different problems with different inputs and costs.
      DEC-20260923-ce06a6 (J7_generic) and CORR-20260923-5c5a23 S3 show the
      dichotomy carries no curve-specific information at these sizes. This
      amendment retires both thresholds.
    proposed_statement: >-
      For each frozen standardized prime-order r, pinned from its named primary
      source, the typed exponents E_minus(r) = min over d | r - 1 of
      log2(sqrt((r-1)/d) + sqrt(d)) / log2(r) (input model one auxiliary power
      [x^d]P, Cheon 2006 Theorem 1) and E_plus(r) = min over d | r + 1 of
      log2(sqrt((r+1)/d) + d) / log2(r) (input model 2d consecutive powers
      [x^i]P, i = 1..2d, Cheon 2006 Theorem 2) are determined by the divisor
      lattices of r - 1 and r + 1. They are reported separately, exactly or as
      certified bounds under a stated factoring budget, beside the same
      quantities for random primes of the same bit length. No inert-or-escalate
      dichotomy is asserted, and no row is read as curve-specific. The
      statement concerns integer factorizations and two closed-form leading
      expressions only.
    proposed_falsification_conditions:
      - A planted or inert construction control of AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 fails a gate (N1).
      - A field prime presented as r is not rejected (N2).
      - Any reported exponent or bound lies below its branch's analytic floor (N3).
      - Reported prime factors of an EXACT branch do not multiply back to r - 1 or r + 1.
    proposed_test_boundary_change: >-
      BN254 instance fixed to alt_bn128 (see design_choices). The synthetic
      instances become C-PLANT-M, C-PLANT-P and C-INERT at 256 bits, plus the
      null arm.
    status_change_proposed: none
    routing: >-
      K-hypothesis of REVIEW-AUXIN-20260923-09aadd. If composition adopts it, a
      correction or successor hypothesis is filed under ids that the top-level
      session mints at that time. This report writes no hypothesis record.
    related_goal_text_notes: >-
      For composition to weigh, not for this card to act on. (1)
      GOAL-AUXIN-a93442 pause condition 3 ("a hit near sqrt(r)") is the wrong
      scale on r + 1, where the typed optimum lies near r^(1/3). Under
      J7_generic it would also be met by generic primes. This amendment defines
      no escalate trigger of its own. (2) Completion criterion 1 is read per
      CORR-20260923-5c5a23 S4, and the typed table is shaped to that reading.
      (3) Completion criterion 4 speaks of controls at toy scale, and these
      controls are at deployed size. Whether that discharges criterion 4 is a
      reading for composition. Any change of goal text is a separate versioned
      act.

  # ---------------------------------------------------------------------------
  # WHERE A CONSTRAINT WAS NOT FULLY MET, OR RESTS ON SOMETHING UNVERIFIED.
  # ---------------------------------------------------------------------------
  unmet_or_partial:
    - item: Line numbers of pins
      detail: >-
        Stated in advance only for brainpoolP384r1 (q and p, from
        CORR-20260923-64ee17 C1). For the other rows the amendment names file,
        curve block and label, and requires the executor to record the line
        span and file sha256 at run time. The inputs/ files were outside this
        card's read scope and were not opened.
    - item: Locators not checked against the files
      detail: >-
        This session did not confirm that sp800-186.txt prints an Edwards25519
        order n, that sec2-v2.txt prints n for the four NIST-equivalent curves,
        or that EIP-197 prints the G1 order. A missing label makes the row
        UNPINNED under the amendment. BN254-r has an ordered fallback. J1 (i)
        tests this.
    - item: Tool availability and versions
      detail: >-
        Not probed (no shell). Minimum versions are named; exact versions are
        recorded at admission; absence is an infrastructure stop. This is the
        J1 availability risk the plan's prior names.
    - item: Certificate format and verifier criteria
      detail: >-
        The PARI ECPP certificate layout and the ECPP and Pratt criteria are
        recalled by this session, a pointer rather than support. The admission
        self-tests are what protects the run.
    - item: Control scale
      detail: >-
        Controls are at 256 bits only. At the largest deployed sizes a Theorem-2
        optimal divisor is beyond ECM reach within the budget, so no control
        there could be expected to pass. Transfer is stated as an assumption in
        interpretation_limits.
    - item: Null-arm cost
      detail: >-
        Advisory wall clock is left null with a bounding formula. Integers at
        the two largest bit classes are likely to spend the full budget, so the
        package may run for many hours on one worker.
    - item: Read-scope deviation (red-team report)
      detail: >-
        While locating the PTM-2 construction, this session read lines 1145-1179
        and 992-1005 of the BATCH-ba0b0d red-team report, plus grep context
        lines. Lines 992-1005 are the construction itself, and also contain the
        PTM-2 search seed, its candidate count and the constructed integer.
        Lines 1145-1179 contain the report's recommendation list and a mutation
        paragraph, which is more than the construction. None of those values is
        used or copied. C-INERT uses only the construction form, with a new
        start fixed by the amendment text. Disclosed so that composition can
        weigh it.

