  # ---------------------------------------------------------------------------
  # D1-D10 DISCHARGE TABLE. Clause paths are keys inside the amendment file.
  # ---------------------------------------------------------------------------
  discharge_table:
    - defect: D1
      requirement: >-
        Pin every r at run time from the named primary-source file with its line
        numbers; brainpoolP384r1 = RFC 5639 q; a field-prime confounder check on
        every row.
      clauses:
        - amendment.change.D1_pins.rule and .rows (file, locator, field-prime locator, cross-source per row)
        - amendment.change.D1_pins.locator_failure (UNPINNED, never substituted)
        - amendment.change.D1_pins.field_prime_confounder_check (every row, before factoring)
        - amendment.controls C-FIELD (the confounder check tested in-run on two field primes)
        - amendment.stages P_pin; amendment.invalidation_rules (pin and field-prime rules)
      how_to_test: >-
        Follow each row's locator to its file and re-derive r. Present the
        brainpoolP384r1 p (RFC 5639 lines 683-684) as r and confirm the
        confounder rule rejects it before any factoring. Check that the
        brainpoolP384r1 locator names q (lines 698-699). Check the BN254-r
        disambiguation and both family cross-checks. Confirm that no rule lets
        an r come from code, a table or an earlier run.
    - defect: D2
      requirement: >-
        Typed two-branch costs in separate columns: r - 1 as sqrt((r-1)/d) +
        sqrt(d) with one power; r + 1 as sqrt((r+1)/d) + d with Theta(d)
        consecutive powers. Each row carries its input model and bits of d.
        Frozen-expression r + 1 values labelled or dropped.
      clauses:
        - amendment.definitions.typed_costs and .analytic_floors_and_ceiling
        - amendment.change.D2_typed_costs (source_statement, columns, what_is_omitted)
        - amendment.change.D2_typed_costs.frozen_expression_on_plus (DROPPED)
        - amendment.change.D2_typed_costs.no_combined_quantity and .floor_invariant
      how_to_test: >-
        Compare each formula and input model term by term with Cheon 2006
        Theorems 1 and 2. Evaluate T_minus and T_plus at small integers where the
        value can be computed by hand. Check that every row type carries its
        input model and bits of d. Search the text for any rule that evaluates
        sqrt(m/d) + sqrt(d) on r + 1 or takes a minimum over both branches.
    - defect: D3
      requirement: >-
        The predicate, if kept, is stated over explicit divisor witnesses,
        includes bound rows, applies per typed reading, and is stratified by
        expected_structure_flag.
      clauses:
        - amendment.change.D3_descriptive_bins (status_of_a_branch, explicit_witness_set, values_by_status, bin_by_status, per_typed_reading, stratification, semantics)
        - amendment.definitions.depth, .bins and .minimiser_and_ties
      how_to_test: >-
        Construct a row with an unfactored cofactor. The text returns status
        BOUND, an upper bound equal to the minimum over W_b = {d, d*C_b : d | F_b}
        with its witness named, a lower bound F_b(r), and bin NEAR_FLOOR if the
        witnessed depth is at least 3/4, else UNDETERMINED with bin_at_least.
        Construct a row whose witness sits on r + 1. It is evaluated with T_plus
        only and binned on the plus branch only. Check that every reported
        frequency is split by stratum.
    - defect: D4
      requirement: >-
        Thresholds calibrated against the random-prime null before the run, or
        escalate semantics removed and the table reported as descriptive.
      clauses:
        - amendment.change.D4_calibration (choice b, threshold_inventory, what_the_null_arm_is_for)
        - amendment.null_arm (frozen sampler, size, seed labels)
        - amendment.stages N_null_arm before D_deployed; amendment.controls C-ORDER
        - amendment.success_criterion.decidability; amendment.stopping_rules (no stop on any deployed value)
      how_to_test: >-
        Write down every cut-off in the text and the quantities it depends on.
        Each must be a declared constant, and none may read a deployed-row or
        null-arm value. Check that the null sampler, size and seed are frozen and
        that the null arm completes before any deployed factorization.
    - defect: D5
      requirement: >-
        Control recipes fully declared in the frozen amendment before code,
        plus a planted r + 1 positive control at deployed size and an
        inert-on-both-branches control (the PTM-2 construction).
      clauses:
        - amendment.controls C-PLANT-M, C-PLANT-P, C-INERT (search_start, step_order, primality_test, acceptance_rule, window, tie_breaks, constructed_factorizations, gates)
        - amendment.definitions (integer_functions, prime, nextprime, control_size)
        - amendment.change.D5_controls (blind factoring of controls); amendment.invalidation_rules (control integer rule)
      how_to_test: >-
        Build every control from the text with independent code, recording each
        choice the text left open (there should be none). Check each acceptance
        rule, window and bit length. For C-PLANT-P check that the planted d is
        present in r + 1 with the declared size and is the T_plus minimiser. J4
        compares the integers blind.
    - defect: D6
      requirement: >-
        Factoring to the frozen per-integer budget with a declared ECM-capable
        backend, seconds actually spent reported per cofactor, no undeclared bit
        cap.
      clauses:
        - amendment.change.D6_factoring (budget, pipeline, reporting, budget_semantics)
        - amendment.tools_and_admission.ecm_backend and .certificate_and_factoring_library
      how_to_test: >-
        Try to find a way for an executor to spend less than the budget on any
