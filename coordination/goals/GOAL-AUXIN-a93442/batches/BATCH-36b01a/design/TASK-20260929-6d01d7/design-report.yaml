      - id: EJ6-B1
        cited: ledger/decisions/DEC-20260929-93fc4d.yaml (not_fixed); RT TASK-20260929-c47d66
        resolution_by_construction: >-
          Continues removal of READ FROM / stand / content-digest surfaces from
          55c6c0, and additionally deletes overlay AMD-edit /
          incorporates.sha256 invalidation and held threshold_inventory
          conjunctions (see EJ6-OVERLAY-AMD-INVALIDATION). Deployed roster lives
