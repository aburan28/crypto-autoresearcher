        decision_vs_report_reading: >-
          Decision named EJ6-B1 not_fixed via overlay AMD/hash surfaces; this
          draft removes those surfaces by construction. No difference noted.
      - id: EJ6-OVERLAY-AMD-INVALIDATION
        cited: ledger/decisions/DEC-20260929-93fc4d.yaml rationale; RT EJ6-OVERLAY-AMD-INVALIDATION
        resolution_by_construction: >-
          sanitize_overlays replaces every corrective_overlays[*].custody.invalidation_rules_added
          with rules that invalidate only on edit of this contract file and
          expressly state that held AMD edits and incorporates.sha256 /
          incorporates_by_hash.sha256 comparisons are NOT invalidation rules.
          Threshold inventory text no longer joins corrective.threshold_inventory_added
          of any held AMD; F-INDEX states no held conjunction completes the
          inventory. Builder stop-rule fails if affirmative AMD-edit or
          incorporates.sha256 invalidation sentences remain.
        decision_vs_report_reading: none noted
      - id: EJ8-INCORP-HASH-VS-FPREC
        cited: ledger/decisions/DEC-20260929-93fc4d.yaml (not_fixed); RT EJ8-INCORP-HASH-VS-FPREC
        resolution_by_construction: >-
          Same deletion of overlay hash/AMD invalidation as EJ6-OVERLAY;
          F-PREC states this file alone governs and forbids content-digest
          binding of held paths; no affirmative incorporates.sha256 run-time
          rule remains to conflict with F-PREC reserved topics.
        decision_vs_report_reading: none noted
      - id: EJ8-Q0-11-NOT-NEUTRALIZED
        cited: ledger/decisions/DEC-20260929-93fc4d.yaml; RT EJ8-Q0-11-NOT-NEUTRALIZED
        resolution_by_construction: >-
          conventions.Q0-11 is deleted. conventions.Q0-11_status records ABSENT.
          F-Q011 and F-PREC.reserved_topics name F-READ, F-PRE and F-PREC as the
          only reference-reading deciders. F-READ R3 expressly allows F-PRE's
          load-by-hash of the named dispatch_preconditions_carried string.
          Builder stop-rule fails if a live Q0-11: YAML key reappears.
        decision_vs_report_reading: >-
          Decision allowed delete or neutralize; this draft deletes and names
          F-READ/F-PRE/F-PREC in the design report as deciding sections. No
          difference noted.
