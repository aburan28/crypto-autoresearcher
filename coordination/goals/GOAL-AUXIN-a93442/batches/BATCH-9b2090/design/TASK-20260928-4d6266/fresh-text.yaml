# =============================================================================
# FRESH TEXT of the draft successor contract EXP-AUXIN-bafa2e
# (TASK-20260928-4d6266, BATCH-9b2090, GOAL-AUXIN-a93442).
#
# Every field below is FRESH: written in this task and never presented as held.
# No span of any held record is reproduced here, and nothing is copied from the
# refused draft EXP-AUXIN-edd104, which is not a source of this contract.
# build_successor.py places this block unchanged as the fresh part of
# draft-contract.yaml, beside the transcluded entries, the leaf_map and two
# generated fresh tables (self_reference_table, replacement_table).
#
# OUTCOME DISCIPLINE. No census value, minimising divisor, escalated-curve list,
# reviewer finding value, control integer, witness integer, depth or
# re-derivation count appears here.
# =============================================================================
fresh:
  text_kind: fresh
  id: EXP-AUXIN-bafa2e
  id_provenance: >-
    Minted by TASK-20260928-4d6266 with `python3 tools/allocate_id.py --next
    experiment --area AUXIN` and confirmed with `--check EXP-AUXIN-bafa2e`
    (well-formed and free across the union, zero occurrences).
  predecessor_experiment_id: EXP-AUXIN-7e2e3d
  refused_draft: >-
    EXP-AUXIN-edd104 (DEC-20260928-004532, decision revise). It is not a source
    of this contract, no entry is copied from it, and this contract neither
    amends nor supersedes it.
  hypothesis_id: H-AUXIN-6db354
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-9b2090
  producer_task: TASK-20260928-4d6266
  design_record: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-9b2090/design/TASK-20260928-4d6266/design-report.yaml
  kind: successor_experiment_contract_stating_every_rule_once
  status: draft
  approved_by: null
  approval_decision: null
  scope_by_citation: >-
    DEC-20260928-004532 next_actions item 2: a new successor contract under a
    new EXP id, not an amendment to EXP-AUXIN-edd104, stating every rule once.
    RS-B stays the selected scope (DEC-20260928-004532 rationale). Not
    restated here.

  text_kinds:
    fresh: >-
      Every field of this fresh block, and the generated tables
      self_reference_table, replacement_table and leaf_map. Fresh text is new
      wording written for this contract. It is never a reproduction of held
      text.
    transcluded: >-
      Every item of transcluded.entries, under F-TX.

  transclusion_convention:
    id: F-TX
    text: >-
      This contract states its own convention for transcluded text. It does not
      rely on DEC-20260928-2afb23 plan_amendment PA-8456b6-T1, which applied
      inside BATCH-8456b6 only. An entry of transcluded.entries is (X1) a
      byte-exact copy of one contiguous span of a committed record, with no
      paraphrase, reordering, reformatting, elision or insertion inside the
      span; (X2) carries source_path, source_commit, source_blob_sha256, an
      anchor and span_sha256, so any reader can recompute the hash from the
      source blob; (X3) is marked transcluded and kept apart from fresh text;
      (X4) neither edits nor supersedes its source, which stays in force for
      its own experiment exactly as held; (X5) is not an entry of this
      contract if its recomputed hash does not match or its anchor does not
      resolve. What a transcluded entry decides in this contract is fixed by
      F-PREC and F-READ, never by the file it was copied from.

  hypothesis_binding:
    id: F-H
    text: >-
      This experiment tests H-AUXIN-6db354 as that record stands (status
      proposed; not edited by this contract). Its falsification conditions
      reach outcomes only through the falsification-condition mapping stated
      in transcluded entries: the rows FC1 to FC5 copied from
      corrective.falsification_condition_mapping of AMD-20260927-narrow.yaml,
      and the FC6 outcome copied from
      corrective.falsification_condition_mapping_fc6 of
      AMD-20260928-gated.yaml. The interpretation_limits correction of
      H-AUXIN-6db354 named in DEC-20260926-96f970 next_actions item 2 is not
      folded in. If that correction is made before this contract is approved
      and it changes a condition this mapping reads, this draft is not
      approvable as it stands; a new successor contract is written instead.

  precedence:
    id: F-PREC
    text: >-
      This file is the only governing text of EXP-AUXIN-bafa2e. No other file
      governs any part of it, and no record is incorporated by hash or by
      reference. The held records of EXP-AUXIN-7e2e3d are sources that spans
      were copied from and nothing more. EXP-AUXIN-7e2e3d, its specification
      and every one of its amendments are unchanged by this contract and govern
      nothing in it; nothing in this contract governs EXP-AUXIN-7e2e3d. Each
      rule of this contract is stated once: by one field of this fresh block,
      or by the transcluded entries that the leaf_map rows with disposition
      stated assign. An entry may be assigned by more than one row only where
      the held table lists the same leaf more than once; those rows state the
      same text. A row that lists several entries with a composition states one
      leaf, whose text is those entries' texts joined in the order the
      composition gives, each span-position entry at the character range the
      row names. A held leaf whose row has disposition
      not_stated_replaced_by_fresh is not stated by any entry; the fresh field
      the row names states this contract's rule on that subject, and where the
      row names a span position, that fresh text is read at that position of
      the composed leaf. Entries that one additions_read_together group names
      are read together: the text at that path is all of them, and none
      overrides another. Where a fresh field names a transcluded entry and
      states how a run-time decision reads against it (F-N4,
      F-BOUND-CONSTRUCTED and F-INDEX), the fresh field and that entry are read
      together and the fresh field states the single resulting outcome.
    reserved_topics: >-
      On five topics the fresh fields are the only rules of this contract:
      revision (F-REV), approval (F-APPROVAL), custody (F-CUSTODY), write scope
      (F-WRITE), and what is governing text and how references resolve (F-PREC,
      F-READ, F-TX). Every held leaf the design found stating a rule on one of
      these topics has disposition not_stated_replaced_by_fresh. If a stated
      entry is nevertheless found to state a different rule on one of them, the
      fresh field decides, and the entry decides nothing on that topic. Such a
      finding is a defect of this draft that its review round records; this
      sentence does not make it harmless.

  reading_of_references:
    id: F-READ
    order: >-
      For each reference written inside a transcluded span, the rules below are
      tried in the order listed and the first rule that applies decides it. No
      later rule applies to that reference. R4 applies only to spans copied
      from AMD-20260926-typed.yaml.
    rules:
    - id: R1
      text: >-
        "This file", "this file", "THIS file" and "the file in which this
        convention is written" mean the entries of this contract whose
        source_path is the file the span was copied from. A span copied into
        the position of another file's leaf keeps the file it was copied from.
    - id: R2
      text: >-
        "This amendment", "this text", "this protocol", "this contract", "this
        frozen contract", "the frozen contract", "this specification", "the
        combined text" and "the combined governing text", in any
        capitalisation, mean this contract, the file EXP-AUXIN-bafa2e. "This
        experiment" means EXP-AUXIN-bafa2e. A gate, requirement or invalidation
        rule that names one of these phrases (for example a verified snapshot of
        this frozen contract, or overwriting this specification) is met, or
        fires, only on this contract file, never on a file of
        EXP-AUXIN-7e2e3d.
    - id: R3
      text: >-
        "Governing text", "governing texts", "governing file", "governing-text
        hash" and "governing-text hashes", with or without a count, mean this
        contract file and the single hash successor_contract_sha256 of
        F-CUSTODY. A count written in a span (four, five) is provenance of the
        held stack and is not a requirement of this contract.
    - id: R4
      text: >-
        Inside spans copied from AMD-20260926-typed.yaml, a reference to another
        record, report or file follows the transcluded conventions.Q0-11 of that
        file (provenance only, apart from the exceptions it names). R7 applies
        there only to bare paths or amendment.<path> references naming that
        file's own fields, and R8 applies to any instruction to read a value
        from an EXP-AUXIN-7e2e3d file.
    - id: R5
      text: >-
        A path written in a span that begins
        experiments/EXP-AUXIN-7e2e3d/implementation/ (including
        .../implementation/typed/) is read with that prefix replaced by
        experiments/EXP-AUXIN-bafa2e/implementation/. A relative path beginning
        implementation/ is read under experiments/EXP-AUXIN-bafa2e/. Every
        other path is read exactly as written. No other path is rewritten. A
        rule that forbids modules outside implementation/typed/ therefore
        forbids every module of EXP-AUXIN-7e2e3d.
    - id: R6
      text: >-
        A reference to a decision, review, finding, report, design report,
        correction or transcript gives provenance only, and so does "this design
        session", "this session" or "the refused predecessor", which name the
        session or record behind the source text. A layer name (v1,
        typed-by-hash, narrow-by-hash, gated) names the source file of the span
        for provenance; no layer governs in this contract.
    - id: R7
      text: >-
        A reference to a field of a named held file (named by file name or
        record id), a reference of the form amendment.<path> or experiment.<path>
        read against the file the span was copied from, or a bare path read the
        same way, resolves through leaf_map. "The frozen spec", "the frozen
        specification" and "the frozen <field>" (for example the frozen list,
        the frozen launch gate, the frozen budget, the frozen value of a
        parameter) name specification.yaml and its fields. "The held text",
        "the held rows" and "held invalidation rules" name the held fields the
        same entry points to. Each resolves under this rule like a field
        reference. A phrase saying held text "stays incorporated" or "stay
        incorporated by hash" means that text is stated in this contract by its
        leaf_map row; it creates no incorporation. If the row is stated, the reference
        means its entries, with its composition and with any
        additions_read_together group for that path. If the row is
        not_stated_replaced_by_fresh, it means the fresh field the row names. If
        the row is not_stated_superseded_in_held_table, it means the entries in
        replaced_by_entries together with the fresh fields in
        replaced_by_fresh; if both are empty, the held text removed or retired
        the leaf, or replaced it without naming a field, and the reference gives
        provenance only. If the row is not_stated_envelope_or_layering, the
        reference gives provenance only. This includes every field of
        incorporates and incorporates_by_hash and every sha256 or byte count
        written in an envelope field: such a value is a datum about a source
        blob that no gate, stop, launch refusal, admission item, validity rule,
        invalidation rule or outcome of this contract reads or compares.
        References to governing_text_table or precedence of any held file mean
        leaf_map and F-PREC; to reading_of_self_references or conventions of
        self-reference, F-READ; to path_additions, additions_read_together.
    - id: R8
      text: >-
        An instruction in a span to read, take or compare a value from an
        EXP-AUXIN-7e2e3d file (for example "read from specification.yaml
        frozen_curve_list") reads the entries of this contract that R7 gives for
        that field. No run-time procedure of this contract opens, hashes,
        compares or checks the git status of any file under
        experiments/EXP-AUXIN-7e2e3d/.
    - id: R9
      text: >-
        Every phrase of the form "this X" or "these X" found in a span, and
        every span occurrence of a phrase R2, R3, R6 or R7 names, is listed in
        self_reference_table with the rule that resolves it. A phrase whose rule
        there is R9-local names the item, rule, gate, stage, row or other object
        that its own entry describes (or the preceding statement of that
        entry), read within the entry's source file as the held text read it;
        it never names a document. The table is closed. A self-referential
        phrase in a span that the table does not list is a defect of this
        draft, not a reading.

  approval:
    id: F-APPROVAL
    status: draft
    approved_by: null
    approved_if_and_only_if: >-
      A committed Coordinator decision, OFFICIAL once its ledger archive is
      verified against Git by tools/research_dispatch.py, approves
      EXP-AUXIN-bafa2e by name, after a review round under a review plan frozen
      before any reviewer ran has reviewed this file at the sha256 that decision
      names. In any other state this contract is not approved and authorizes
      nothing.
    transcluded_conditions: >-
      Where a transcluded span conditions something on the approval of the file
      it was copied from, or on approval without naming a file, it reads as
      conditioned on the approval of this contract under this field.
    how_approval_is_recorded: >-
      In that decision only. This file is never edited afterwards, not even
      this block.

  custody:
    id: F-CUSTODY
    scope: >-
      Custody binds this contract file and the transcluded spans at their
      source commit, and nothing else. It binds no file of EXP-AUXIN-7e2e3d.
    trial_plan: >-
      A new file experiments/EXP-AUXIN-bafa2e/implementation/typed/trial-plan.json
      records, under the key successor_contract_sha256, the sha256 of this
      contract file as it stands at the launch commit. It records no hash of any
      file of EXP-AUXIN-7e2e3d. The run recomputes successor_contract_sha256 at
      launch and at every stage boundary and stops, evidence-integrity failure,
      on any mismatch; at a stage boundary this is the stop of the transcluded
      stopping_rules item 12 of AMD-20260926-typed.yaml read under F-READ R3.
    span_check: >-
      Before Stage A0 completes, the run recomputes span_sha256 of every
      transcluded entry from the source blob named by source_path at
      source_commit (the bytes git show <source_commit>:<source_path> returns),
      never from the working tree. Any mismatch, or any anchor that does not
      resolve, is the same evidence-integrity stop. The blobs at source_commit
      are immutable, so a later change to any EXP-AUXIN-7e2e3d file in the
      working tree or in a later commit does not change the outcome of this
      check.
    manifest: >-
      manifest.yaml records dirty_summary (verbatim git status --porcelain=v1
      output at launch), the launch commit, the implementation snapshot task and
      commit, successor_contract_sha256, every tool version from admission,
      every third-party distribution and version, and the inference block. It
      records no hash of any file of EXP-AUXIN-7e2e3d. Launch is refused if
      dirty_summary lists any path under
      experiments/EXP-AUXIN-bafa2e/implementation/typed/ or this contract file.
      A dirty_summary line naming any other path, including any path under
      experiments/EXP-AUXIN-7e2e3d/, is recorded and refuses nothing.
    admission_item_7: >-
      (7) successor_contract_sha256 in trial-plan.json equals the sha256 of
      this contract file at the launch commit.
    admission_item_7_position: >-
      Read at the position of span ADM-7 in the composed text of
      tools_and_admission.admission_gate of AMD-20260926-typed.yaml (leaf_map
      row typed:tools_and_admission.admission_gate span ADM-7).
    invalidation: >-
      Any edit of this contract file after approval - evidence-integrity
      failure. This rule is read beside the transcluded invalidation_rules
      entries; none overrides another.
    independence: >-
      No gate, stop, launch refusal, admission item, validity rule,
      invalidation rule or outcome of this contract depends on the bytes, the
      hash or the git status of specification.yaml, AMD-20260916-bands.yaml,
      AMD-20260923-d1d10.yaml, AMD-20260926-typed.yaml,
      AMD-20260927-narrow.yaml, AMD-20260928-gated.yaml or any other path under
      experiments/EXP-AUXIN-7e2e3d/. The only reads of those files are the span
      check against immutable blobs at source_commit and design-time
      provenance. The held custody rules that bound those files (the
      governing-text hashes of change.D8_custody, the custody_consequences of
      AMD-20260927-narrow.yaml, the custody additions and added invalidation
      rules of AMD-20260927-narrow.yaml and AMD-20260928-gated.yaml, and the
      held-file clauses of typed invalidation_rules item 10) stay in force for
      EXP-AUXIN-7e2e3d exactly as held and are not rules of this contract.

  write_scope:
    id: F-WRITE
    paths:
    - experiments/EXP-AUXIN-bafa2e/
    implementation_modules: >-
      The run uses new implementation modules under
      experiments/EXP-AUXIN-bafa2e/implementation/typed/ and edits no existing
      implementation file of any experiment, so the code of earlier runs stays
      recoverable. The run writes nothing under experiments/EXP-AUXIN-7e2e3d/.
    note: >-
      The contract file itself is placed under experiments/EXP-AUXIN-bafa2e/
      only by a later archived act. This draft lives in its design directory.

  revision_rule:
    id: F-REV
    text: >-
      This contract is never rewritten in place, and no amendment layers it. A
      change of any kind, including one a review requires, is a new successor
      contract under a new EXP id that states every rule once. This is the only
      revision rule of this contract (F-PREC reserved_topics).

  n4_bound_comparison:
    id: F-N4
    discharges: DF-G1 (DEC-20260928-c4f3dc defects_to_discharge)
    reads_with:
    - typed success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED].condition
    - typed controls[C-BOUND].gates (items 1 to 3, item 1 as composed with span G-GATE1)
    - typed stopping_rules item 10
    - typed definitions.gate_evaluation_mode
    - typed success_criterion.decidability
    text: >-
      On each of BND-1, BND-2 and BND-3, and on any constructed BOUND state
      evaluated under F-BOUND-CONSTRUCTED, the words "other than the value this
      text fixes" in the N4 condition are decided by the C-BOUND gate verdicts,
      evaluated as definitions.gate_evaluation_mode states, and by nothing
      else. A returned status, witness set, witness, bin, bin_at_least or
      boundary_flag is other than the fixed value if and only if it differs, on
      path A or on path B, from the value the state's expected block states;
      that is the comparison gate 1 makes, so gate 1 fails on that state. A
      returned upper or lower bound is other than the fixed value if and only
      if, on path A or on path B, it misses its expected closed-form expression
      by more than the gate-2 tolerance or the floor invariant fails, so gate 2
      fails on that state; or, for the upper bound of BND-1, CONSISTENCY fails,
      so gate 3 fails. Exact equality of a real-valued bound is never tested.
      The N4 condition is therefore met on a state if and only if gate 1, gate
      2 or gate 3 fails on that state on either path, which is exactly when
      stopping_rules item 10 fires with outcome N4. The condition and the stop
      cannot disagree.
    tested_meaning_of_N4: >-
      This states as text the reading success_criterion.decidability already
      requires (each outcome decided from the gate verdicts alone). Against the
      other reading a reviewer could name (exact equality of each bound), it
      fixes the bound comparison at the gate-2 tolerance. It does not widen N4.
      The FC5 row is transcluded unchanged; it maps the condition to the
      outcome and states no tolerance.

  constructed_bound_states:
    id: F-BOUND-CONSTRUCTED
    discharges: DF-G2, by the route "outside the protocol except in reviewer-evaluation mode"
    reads_with:
    - typed invalidation_rules item 6
    - typed change.D3_descriptive_bins (the BOUND rules)
    - gated corrective.c_bound_gating.expected_value_source (read together with typed controls[C-BOUND])
    - narrow corrective.bin_by_status
    text: >-
      A BOUND state other than BND-1, BND-2 and BND-3 never occurs in a run. If
      one does, the transcluded invalidation_rules item 6 of
      AMD-20260926-typed.yaml makes the package invalid_measurement. Such a
      state exists only in reviewer-evaluation mode, where a reviewer builds it
      to test the BOUND rules. There it is outside the protocol: no gate, stop,
      validity rule or outcome of a run reads it. In that mode the expected
      status, witness set and witness are the values the BOUND rules of
      change.D3_descriptive_bins give on the parts the reviewer declares for
      the state, and the expected bin, bin_at_least and boundary_flag are the
      values corrective.bin_by_status gives on the state's witnessed depth. The
      reviewer records the declared parts and these expected values before
      evaluating; F-N4 then decides the comparison. A recorded expected value
      that differs from what these rules give is a reviewer error, not an
      outcome.

  threshold_index:
    id: F-INDEX
    discharges: DF-G3, by the non-normative route
    reads_with:
    - typed change.D4_calibration.threshold_inventory (every segment, including the span INV-CLAIM position)
    - narrow corrective.threshold_inventory_added
    - gated corrective.threshold_index (status_of_the_index and completeness_claims_over_four_layers)
    text: >-
      The threshold index is non-normative. It consists of the text stated at
      the position of span INV-CLAIM of change.D4_calibration.threshold_inventory,
      together with the rest of that leaf and with
      corrective.threshold_inventory_added. No gate, stop, validity rule,
      outcome or other normative clause of this contract reads it. Every
      cut-off and decision constant governs from its own clause, whether or
      not the index lists it. No counting convention is fixed. The index is
      excluded from blind comparison in any review plan of this contract.
    readers_check: >-
      A token scan for threshold_index, threshold_inventory and inventory over
      every transcluded entry and every fresh field is recorded in the design
      report. A clause that reads the index without naming it would not be
      found by that scan; the review plan should test for one.

  execution_preconditions:
    id: F-PRE
    text: >-
      Any future executor card for a run under this contract carries, as
      dispatch preconditions and unweakened, DEC-20260927-f680f7
      dispatch_preconditions_carried (cited, not restated; sha256 of the string
      a YAML safe loader returns for that field:
      c3be35ae13929b45fc10dbf65f2b28cdb10a1e2580b6d7d6b57b1cf6fcd1e553), and
      the provisioning precondition the transcluded
      tools_and_admission.absence_rule states.

  authorization: >-
    This draft authorizes no run, no implementation dispatch and no executor
    card. It approves nothing and sets no execution-authorization field. It is
    a design awaiting a review plan, which a later session freezes before any
    reviewer runs, after the three controls named in DEC-20260928-004532
    next_actions item 2 have been run against it.
  non_claims:
  - Asserts nothing about any curve, any census value, whether H-AUXIN-6db354 is true, any deployed system or any exponent.
  - Does not assert that any transcluded span is correct, or already reviewed in its new context. Held status in a source round does not carry into a new composition.
  - Rehabilitates no prior run. RUN-AUXIN-fd1edc stays invalid as evidence and RUN-AUXIN-6117d3 stays void; this contract changes neither status.
