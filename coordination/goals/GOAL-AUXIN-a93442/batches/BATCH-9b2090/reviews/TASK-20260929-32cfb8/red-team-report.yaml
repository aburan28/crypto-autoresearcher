    not_a_layer: >-
      Holds under CD-6. PTM-1 confirms the same criterion classifies
      AMD-20260928-gated as a layer with held-byte dependence.
    control_finding_disposition: >-
      Held-file mutation FAIL confirmed; not a control error. Independent
      mutation agrees on T-0388; agrees on T-0457 dependence (control notes no
      outcome change at its base because the archive already fails; this review
