  # -------------------------------------------------------------------------
  # EJ3 -- REFERENCE RESOLUTION UNDER F-READ, AND SELF-REFERENCE CLOSURE.
  # Verdict: breaks.
  # -------------------------------------------------------------------------
  EJ3:
    verdict: breaks
    method: >-
      Built an independent phrase inventory over every transcluded entry
      (this/these X, frozen-* forms, held-* forms, and phrases R2/R3/R6/R7 name).
      Applied F-READ order with R4 typed-only and R4's stated R7 carve-out
      (bare paths / amendment.<path> naming typed's own fields only). Compared
      order-first rule to self_reference_table. Did not start from the control's
      phrase lists. Negative control: deleted one table row and flipped one
      row's rule on a scratch copy; closure and order checks both reported.
    breaks:
      - id: EJ3-R4R7-TYPED-FROZEN
        kind: table rule differs from stated order where the referent differs
        where: >-
          Every typed-span occurrence of "the frozen <field>" / "frozen
          spec(ification)" (examples T-0005, T-0017, T-0082, T-0123, T-0145,
          T-0446). self_reference_table assigns R7; under the stated order R4
          applies first.
        resolution: >-
          F-READ order: first applicable rule decides; R4 only in typed spans.
          R4: a reference to another record, report or file follows
          conventions.Q0-11 (provenance only, apart from named exceptions);
          R7 applies there only to bare paths or amendment.<path> naming
          typed's own fields. "The frozen list" names specification.yaml
          fields — not that carve-out — so R4 fires and R7 does not.
        situation: >-
          Typed entry T-0017: "A row whose role in specification.yaml
          frozen_curve_list is deployed or deployed_pairing. The label is the
          frozen list's role name only." Under table-R7 the frozen list
          resolves through leaf_map to this contract's stated role entries and
          deployed-role classification binds them. Under order-R4 the
          specification.yaml / frozen-list reference is provenance only, so the
          phrase does not supply the same operative role table. Same state, two
          readings, different run-time classification inputs.
        interacts_with: F-READ R9 (table claims closed while encoding the wrong rule for these rows).
      - id: EJ3-R9-HELD-TEXT
        kind: unlisted self-referential phrase against a table declared closed
        where: T-0560 (narrow null_arm_class_consequence.rule) contains bare "held text".
        resolution: >-
          R7 names "the held text"; R9 requires every span occurrence of a
          phrase R7 names, and every this/these X, to be listed; an unlisted
          self-referential phrase is a draft defect. Bare "held text" is absent
          from self_reference_table.
        situation: >-
          A reader applying R9's closure claim finds no row for the phrase in
          T-0560; the draft's own R9 text says that is a defect, not a reading.
    named_breaks:
      - id: EJ3-B1
        status: fixed
        argument: >-
          The two named invalidation leaves that read incorporation-hash fields
          are not_stated_replaced_by_fresh by F-CUSTODY.invalidation. Stated
          "stays incorporated" phrases resolve under R7 as leaf_map statement
          with no incorporation created. amendment.<path> is handled by R7;
          R2's "this amendment" is a different phrase and does not overlap the
          path form. Residual (not reversing the named-leaf fix): stated T-0636
          still asserts pre-registration on a sha256 binding of all four
          governing layers — an incorporation-style binding class owned under
          EJ8.
      - id: EJ3-B2
        status: not_fixed
        argument: >-
          T-0461 under R2 ("this frozen" / "this frozen contract") correctly
          needs a verified snapshot of EXP-AUXIN-bafa2e — the named T-0461
          referent problem is fixed. The class is not closed: (1) R9's closure
          claim fails on unlisted "held text" (T-0560); (2) T-0457
          (EJ3-M1) still requires a verified snapshot archive naming
          H-AUXIN-66e6fd and EXP-AUXIN-7e2e3d. R6 makes DEC/TASK references
          provenance only; it does not erase the predecessor-experiment archive
          as a launch condition. Design-report claim that fixing T-0461 removes
          the compounding is wrong.
    refused_predecessor_note: >-
      T-0291 (typed): table R6 vs order-first R4. Both readings are
      provenance-only; no differing run-time decision constructed for this
      phrase alone.
    negative_control: >-
      Scratch copy: deleted self_reference_table row for one listed phrase;
      flipped another row's rule. Closure check reported the missing phrase;
      order/table check reported the flip. Both detected.
    control_finding_disposition: >-
      F-READ coverage FAIL confirmed; not a control error. Independent inventory
      agreed on typed R4/R7 frozen phrases, refused-predecessor rule-id mismatch
      without run-time delta, and unlisted "held text".

  # -------------------------------------------------------------------------
  # EJ6 -- NO RUN-TIME DEPENDENCE ON HELD FILES; NOT A LAYER.
  # Verdict: breaks.
  # -------------------------------------------------------------------------
  EJ6:
    verdict: breaks
    method: >-
      Own held-file mutation in a scratch git clone under TMPDIR (research
      worktree untouched; held_file_mutation.py not reused). Edited a held
      amendment file and added a file under held implementation/typed/;
      captured porcelain; restored. Evaluated stated rules naming dirtiness,
      custody, archives, receipts and implementation paths under F-READ R5 and
      F-CUSTODY. Checked R5 remap targets and CD-6 not-a-layer form. Compared
      with the control only after writing own results.
    breaks:
      - id: EJ6-T0388-DIRTY-AMENDMENT
        kind: stated rule outcome changes when a held file's git dirtiness changes and successor bytes do not
        where: >-
          Stated T-0388 (typed invalidation_rules item 12): "Launch with a dirty
          implementation/typed/ or dirty amendment path, or on implementation
          bytes that differ from the implementation snapshot -
          invalid_measurement of the package."
        resolution: >-
          R5 remaps implementation/typed/ to experiments/EXP-AUXIN-bafa2e/. No
          F-READ rule or F-CUSTODY clause rewrites "dirty amendment path" to
          this contract's paths only. F-CUSTODY.manifest records dirty
          EXP-AUXIN-7e2e3d paths and refuses nothing for them.
        situation: >-
          In the scratch clone, edit
          experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml so
          porcelain lists that path dirty; leave draft-contract.yaml bytes
          unchanged. T-0388 yields invalid_measurement. Base (clean) does not.
          F-CUSTODY.manifest still does not refuse launch. Held-byte / held-git
          dependence contrary to F-CUSTODY.independence.
      - id: EJ6-T0457-PREDECESSOR-ARCHIVE
        kind: launch condition whose deciding input is a held-bytes archive
        where: >-
          Stated T-0457 (v1 execution_admission.requirements item 1): verified
          snapshot archive of H-AUXIN-66e6fd, EXP-AUXIN-7e2e3d, DEC-…, TASK-….
        resolution: >-
          R6: references to a decision, review, finding, report, design report,
          correction or transcript are provenance only. DEC/TASK fit; the
          experiment id and the archive requirement do not. Design-report claim
          that R6 makes the whole row provenance-only is unsupported by R6's
          text.
        situation: >-
          Admission asks whether that predecessor-named archive verifies. An
          archive in that class binds held implementation bytes. When
          verification fails (or the archive is absent), admission fails; when
          it verifies, admission met. Successor draft bytes unchanged.
          Dependence F-CUSTODY.independence excludes.
      - id: EJ6-T0535-UNSCOPED-RECEIPT
        kind: unscoped artifact reference that can bind held-tree receipts
        where: >-
          Stated T-0535 under R2: "Overwriting this specification or a prior run
          receipt => evidence-integrity failure."
        resolution: >-
          R2 maps "this specification" to EXP-AUXIN-bafa2e. "A prior run
          receipt" names no experiment. No F-READ rule scopes it to bafa2e
          receipts only.
        situation: >-
          Overwrite a prior run receipt under the held experiment tree; successor
          draft unchanged. T-0535 can fire evidence-integrity failure.
    named_breaks:
      - id: EJ6-B1
        status: not_fixed
        argument: >-
          T-0388 alone suffices. T-0457 shows surviving held-archive dependence.
          R5 correctly remaps stated experiments/EXP-AUXIN-7e2e3d/implementation/
