  # -------------------------------------------------------------------------
  # EJ8 -- FRESH FIELDS AGAINST TRANSCLUDED TEXT (RESERVED TOPICS).
  # Verdict: breaks.
  # -------------------------------------------------------------------------
  EJ8:
    verdict: breaks
    method: >-
      For each reserved-topic candidate, quoted the fresh field and the stated
      entry, asked which F-READ rule (if any) neutralises the entry, and
      constructed a run-time situation. Assessed F-CUSTODY.scope's undefined
      "custody". Assessed carried items including T-0469/T-0376.
    breaks:
      - id: EJ8-T0124-REVISION-ROUTE
        kind: stated revision route beside F-REV
        where: >-
          Stated T-0124: "A later amendment may pre-register a rule on the basis
          of this arm; this run's deployed rows are never re-scored by such a
          rule."
        fresh_field: F-REV (only revision rule; no amendment layers this contract)
        neutralised_by_fread: false
        situation: >-
          After approval, an operator files a new amendment citing
          EXP-AUXIN-bafa2e and pre-registers a cut-off from the null arm.
          T-0124 licenses that route; F-REV forbids any amendment layering and
          requires a new EXP id. Forward-looking "may pre-register" is not mere
          history of the held stack. F-PREC reserved_topics makes F-REV decide
          and still records the surviving conflict as a draft defect.
      - id: EJ8-T0162-SOURCE-FILE-PRECEDENCE
        kind: stated precedence rule beside F-PREC
        where: >-
          Stated T-0162 (typed Q0-11 outside span): "Where a referenced record
          and this file's text could differ, this file's text governs."
        fresh_field: F-PREC (this file is the only governing text of EXP-AUXIN-bafa2e)
        neutralised_by_fread: false
        fread_note: >-
          R1 maps "this file" to entries whose source_path is the typed
          amendment the span was copied from — a source-file precedence, not
          the successor contract file.
        situation: >-
          A typed-span recipe and a referenced record disagree on a tolerance.
          T-0162 under R1 selects the typed source-file entries as governing;
          F-PREC selects this contract file alone.
      - id: EJ8-T0463-APPROVAL-NOTE
        kind: stated approval/authorization sentence beside F-APPROVAL
        where: >-
          Stated T-0463 (v1 launch_gate.note): "scientific_execution_authorized
          is true because the census protocol is complete. …"
        fresh_field: F-APPROVAL / fresh authorization (draft authorizes nothing)
        neutralised_by_fread: false
        fread_note: >-
          R7's bare-path provenance reading does not apply: this is the note
          body, not a path reference. Plan: those words are quoted older
          specification text, not a fresh field — still a reserved-topic
          conflict when left stated.
        situation: >-
          A tool that treats stated spans as operative text reads launch as
          authorized; fresh fields refuse authorization until a committed
          decision. K-escalate does not fire: this is held quoted text, not a
          draft breakthrough claim.
      - id: EJ8-T0636-FOUR-LAYER-BINDING
        kind: stated custody/governing-text binding beside F-CUSTODY / F-PREC
        where: >-
          Stated T-0636: pre-registration of every cut-off "rests on the sha256
          binding of all four governing layers" (change.D8_custody and
          custody_additions); cut-offs govern "in the layer"
          governing_text_table names.
        fresh_field: F-CUSTODY (successor_contract_sha256 only) and F-PREC
        neutralised_by_fread: false
        fread_note: >-
          R3 maps "governing-text hash(es)" to successor_contract_sha256 and
          treats a count as provenance; that does not erase the operative
          sentence that pre-registration rests on a multi-layer sha256 binding.
          R7's unread-incorporates sentence is about field references to
          incorporates, not this precondition sentence.
        situation: >-
          Cut-off pre-registration challenged: under T-0636 it depends on
          four-layer hashes; under F-CUSTODY only successor_contract_sha256
          binds. Outcomes differ on whether missing held-layer hashes block
          pre-registration.
      - id: EJ8-CUSTODY-SCOPE-UNDEFINED
        kind: undefined reserved term on which two readings decide differently
        where: F-CUSTODY.scope ("… and nothing else") plus reserved_topics custody
        situation: >-
          Literal reading with reserved_topics: if T-0019, T-0097, T-0144,
          T-0146, T-0362, T-0364, T-0387, T-0412, T-0557 are custody rules, they
          decide nothing. Alternate reading: they are non-custody protocol
          content and still decide staged-source / snapshot / artifact stops.
          The draft never defines "custody" so as to pick a reading. Run-time
          differs on a staged-source digest mismatch if classified as custody
          under the literal reading versus active under the alternate. The
          draft does not say which is intended.
      - id: EJ8-T0469-T0376-STOP-ESCALATE
        kind: carried tension with incompatible run-time stops
        where: >-
          T-0469 (v1 what_this_is_not item 5) treats interpreting E(r) as a
          break as stop-and-escalate; T-0376 (typed stopping_rules item 15)
          says there is NO stop-and-escalate.
        situation: >-
          A deployed row yields a value in the band T-0469 names for
          stop-and-escalate. T-0469 requires that stop; T-0376 forbids any such
          stop and requires the package to run every row to completion after
          Stage C. Not harmless.
    named_breaks:
      - id: EJ6-B2
        status: not_fixed
        argument: >-
          T-0124 is a forward revision route by amendment, conflicting with
          F-REV. D10 additivity not being stated and F-REV being declared do
          not remove T-0124. F-PREC records the conflict as a defect rather
