  # ---------------------------------------------------------------------------
  # J2 -- THE TABLE'S ARITHMETIC AND ITS CERTIFICATES
  # ---------------------------------------------------------------------------
  J2:
    verdict: breaks
    break_scope: certificate_strength_and_independence_only
    values: hold
    plan_composition_key: J2_breaks_on_certificate_strength_only
    re_proof_note: >-
      The plan says certificate wording is downgraded to "probable prime (BPSW)"
      "unless re-proved". This review re-proved every reported prime with FLINT
      fmpz_is_prime, a library independent of sympy (see above for what that
      proof is and is not). The Coordinator decides whether that library verdict
      counts as re-proved.
    i_products: >-
      All 20 branches (10 rows x {r-1, r+1}): the product of the reported prime
      powers, times the unfactored cofactor where present, equals n exactly. In
      every branch n equals r -/+ 1 for the run's r (for brainpoolP384r1 that r
      is the field prime; see J1).
    ii_primality:
      independent_libraries:
        - "PROOF: python-flint 0.9.0 / FLINT 3.6.0 fmpz_is_prime (retrieved docs quoted under J1)"
        - "probable prime: this reviewer's own BPSW (strong base-2 Miller-Rabin + strong Lucas, Selfridge method A; script primality_indep.py; self-tested against FLINT on every odd n < 200000 with 0 mismatches, and rejects strong pseudoprimes 3215031751, 3825123056546413051, 318665857834031151167461 and the Lucas pseudoprime 5459)"
        - "probable prime: OpenSSL 3.0.13 `openssl prime` (Miller-Rabin)"
        - "compositeness PROOF: Fermat witness pow(2, C-1, C) != 1"
      reported_primes: >-
        All 83 distinct reported primes (up to 252 bits) are PROVEN prime by FLINT.
        Own BPSW and OpenSSL agree on every one. No reported "prime" is composite.
      declared_composite_cofactors: >-
        All 7 unfactored cofactors are PROVEN composite by a base-2 Fermat
        witness. FLINT returns 0, OpenSSL says "not prime", own BPSW rejects,
        and none is a perfect square. The cofactors are NIST-P-384 r-1 (371
        bits) and r+1 (302), NIST-P-521 r-1 (471) and r+1 (488),
        brainpoolP384r1 [p-1, p+1] (305, 347), and Ed25519-L r-1 (245). No
        declared composite is prime.
      producer_certificate_independence: >-
        The certificates are not independent. factor_path_a.py certifies with
        sympy.isprime, and its factorizer sympy.factorint itself calls
        sympy.isprime. factor_path_b.py `_is_probable_prime` also calls
        sympy.isprime ("independent call site" in its docstring). The contract
        asks for "BPSW plus a second check" or PARI/Sage certificates, and a
        second call to the same function is not a second check. Every
        per-factor certificate carries the same method string, "sympy.isprime
        (BPSW / deterministic Miller-Rabin for this size)", whatever the size of
        the factor.
      producer_certificate_semantics: >-
        From the installed sympy 1.14.0 source, which this reviewer read
        (retrieved): "For n < 2^64 the answer is definitive; larger n values have
        a small probability of actually being pseudoprimes ... if the number is
        larger than 2^64, a strong BPSW test is performed." Deterministic
        Miller-Rabin extends to n < 3317044064679887385961981 only when gmpy2 is
        absent. With gmpy2 present, isprime goes straight to BPSW. The run's
        environment.json does not record gmpy2. This matters only for the
        67-bit, 68-bit and 72-bit factors below, and it is moot because those
        rows also carry factors of 3.3e24 or more.
      certificate_strength_per_row:
        - {row: NIST-P-224, producer: "probable prime (BPSW): 2 factors >= 3.3e24 (196-bit r-1, 177-bit r+1)", independent: "PROOF (FLINT) for all factors"}
        - {row: NIST-P-256, producer: "probable prime (BPSW): 2 factors >= 3.3e24 (92-bit r-1, 215-bit r+1)", independent: "PROOF (FLINT)"}
        - {row: NIST-P-384, producer: "definitive: all reported primes < 2^64; both cofactors composite (a composite verdict is always a proof)", independent: "PROOF (FLINT) of factors; Fermat-witness PROOF of cofactor compositeness"}
        - {row: NIST-P-521, producer: "definitive: all reported primes < 2^64; both cofactors composite", independent: "PROOF (FLINT); Fermat-witness PROOF of compositeness"}
        - {row: secp256k1, producer: "probable prime (BPSW): 2 factors >= 3.3e24 (109-bit r-1, 211-bit r+1); plus a 68-bit factor whose class depends on unrecorded gmpy2", independent: "PROOF (FLINT)"}
        - {row: brainpoolP256r1, producer: "probable prime (BPSW): 2 factors >= 3.3e24 (252-bit r-1, 115-bit r+1); plus a 72-bit factor (gmpy2-dependent)", independent: "PROOF (FLINT)"}
        - {row: brainpoolP384r1, producer: "definitive: all reported primes < 2^64 (row computed on the field prime; J1)", independent: "PROOF (FLINT); Fermat-witness PROOF of compositeness"}
        - {row: Ed25519-L, producer: "probable prime (BPSW): 1 factor >= 3.3e24 (180-bit, r+1); r-1 cofactor composite", independent: "PROOF (FLINT); Fermat-witness PROOF of compositeness"}
        - {row: BN254-r, producer: "probable prime (BPSW): 1 factor >= 3.3e24 (94-bit r-1); plus a 67-bit factor (gmpy2-dependent)", independent: "PROOF (FLINT)"}
        - {row: BLS12-381-r, producer: "probable prime (BPSW): 1 factor >= 3.3e24 (164-bit r+1)", independent: "PROOF (FLINT)"}
      summary: >-
        The producer's certificates are PROBABLE-PRIME (BPSW) verdicts for every
        complete-lattice row: all six flagged rows, plus Ed25519-L's complete
        r+1 branch. They are definitive only for the three E_bound rows whose
        reported primes all lie below 2^64. This review PROVES every reported
        factor prime with FLINT, so the factorization values are proven
        independently of the producer's library.
    iii_divisor_lattices_and_minima:
      method: >-
        This reviewer's own enumeration and mpmath 1.3.0 at 120 significant digits.
        The producer used Python decimal at 80 and 96 digits. The cofactor is
        counted as a single atom C, so the known divisors are {d | F} union
        {d*C : d | F} and the count is prod(e_i + 1) x (2 if a cofactor is
        present). This is the producer's convention, stated in e_eval.py.
      divisor_counts: All 20 recomputed counts equal the formula and equal the reported divisor_count_known.
      minima: >-
        All 20 per-branch minima match the e_table.json strings to an absolute
        difference of at most 2.45e-80 (78 or more significant digits). All 10
        rows match on kind, minimizing branch, d and value. Path B's
        independent_recompute.json branch minima match e_table.json exactly.
        largest_divisor_le_sqrt_r matches in all 20 branches.
      mirror_pair_fact: >-
        A structural fact that the reported d does not disclose. expr(d, m) =
        sqrt(m/d) + sqrt(d) is exactly symmetric under d -> m/d, so every
        minimizer is a tied pair {d, m/d} of identical exponent and is never
        unique (unless d^2 = m, which never occurs here). The producer reports the
        smaller member (d <= sqrt(m)): divisors are sorted ascending and the
        comparison is strict. This holds in all 20 branches. The other member of
        the pair gives the same E and a different power. For example, on the
        flagged rows the partners are 128 or 129 bits (NIST-P-256 r-1, secp256k1
        r-1, BLS12-381-r r-1), 131 bits (brainpoolP256r1 r+1), 127 bits (BN254-r
        r+1) and 177 bits (NIST-P-224 r+1; reported d is 48 bits). Every partner
        is in computations.json (j2_arith, min_d_mirror_partner). What this means
        for the auxiliary input is J6's question, not J2's.
      near_ties: >-
        The gap from the minimizing pair to the next distinct pair is at least
        3.09e-42 in E (BLS12-381-r r-1). That is resolved at both precisions, so
        every minimizer is exact up to the mirror tie.
    iv_analytic_floor: >-
      Every E_m(r) >= (1 + log2(m)/4)/log2(r) in all 20 branches. The smallest
      margins are: BLS12-381-r r-1 3.37e-81, BN254-r r+1 7.21e-42, BN254-r r-1
      1.35e-7, NIST-P-256 r-1 3.32e-7, secp256k1 r-1 1.11e-5 and
      brainpoolP256r1 r+1 1.71e-3. The two smallest are exact algebra, verified
      as integer identities with the retrieved draft's family forms: BLS12 gives
      r - 1 = t^2 (t^2 - 1), so the minimizing pair is (t^2 - 1, t^2) =
      (228988810152649578064853576960394133503, ...504). BN gives r + 1 = (6t^2 +
      1)(6t^2 + 6t + 2), with pair gap 6t + 1. No value is below the floor.
    v_E_bound_direction: >-
      In every incomplete branch, each known divisor (including every d*C)
      divides m (checked exhaustively). The known set is therefore a subset of all
      divisors, its minimum is at least the true minimum, and the reported E_bound
      is an UPPER bound on the true E_m. "true E(r) <= reported value" is the
      right direction for NIST-P-384, NIST-P-521, brainpoolP384r1 [on p] and
      Ed25519-L. One arithmetic fact is recorded for the compose task without
      ruling on the trigger (J5): Ed25519-L's row bound is its COMPLETE r+1
      branch, E_{r+1} = 0.35701770625655346479 exactly, so the true E(r) <=
      0.35702.
    vi_factoring_budget:
      finding: >-
        The budget was not used. It was not spent. factor_with_caps passes
        budget_seconds = min(3600, 300 + 60) = 360 s per integer, and it makes a
        deep attempt (unbounded sympy.factorint in a subprocess) only when the
        cofactor is at most 260 bits. Of the 8 unfactored branches, 7 had
        cofactors above 260 bits and received NO deep attempt. Their only
        attempt was sympy.factorint(n, limit=10**7). The sympy docs describe that
        as trial division up to the limit, "or taking a corresponding number of
        rho/p-1 steps". This reviewer's synthetic-integer probe of the same call
        returned composite leftovers after 50-78 s. The run spent 50-86 s per
        integer, which is 1.4-2.4% of the frozen 3600 s. Only Ed25519-L r-1 (245
        bits) received a deep attempt, killed after 321.1 s (360.1 s total).
      per_branch_seconds:
        - "NIST-P-384 r-1: cofactor 371 bits, 57.6 s, no deep attempt (above cap 260)"
        - "NIST-P-384 r+1: cofactor 302 bits, 63.6 s, no deep attempt"
        - "NIST-P-521 r-1: cofactor 471 bits, 67.9 s, no deep attempt"
        - "NIST-P-521 r+1: cofactor 488 bits, 86.3 s, no deep attempt"
        - "brainpoolP384r1 [field prime p] p-1: cofactor 305 bits, 50.2 s, no deep attempt"
        - "brainpoolP384r1 [field prime p] p+1: cofactor 347 bits, 55.9 s, no deep attempt"
        - "Ed25519-L r-1: cofactor 245 bits, 360.1 s, deep factorint budget 321.1 s -> deep_factor_timeout_or_fail"
      disclosure_gap: >-
        The declared deviation "deep_factor_attempt_capped_at_300.0s_and_bit_cap_260"
        names the caps. It does not say that 7 of 8 unfactored cofactors got no
        deep attempt, or that the effective per-integer budget was 360 s. The
        manifest restates factoring_seconds_per_integer_cap: 3600.0 (see J4). This
        is not a validity defect, because an upper bound is honest. But
        NIST-P-521 (and every E_bound row) is undetermined because the budget was
        NOT USED. The 3600 s budget was not exhausted. By AGENTS.md core rule 5
        this is a resource and procedure limit, never negative evidence.
    heuristic_and_cost_model_notes: >-
      The specification has heuristic_under_test: null and no sampling, so
      heuristic-validation checks do not apply. The cost unit is declared as a
      dimensionless exponent, with expr as a modelled group-operation count up to
      a hidden constant. The optimistic assumptions (no log cofactor, O() hides
      a constant) are flagged in the specification, and peak RSS is measured
      (179720192 bytes). No attack cost, success probability or expected-cost
      product is claimed, so the per-attempt x inverse-success bookkeeping does
      not apply. The MODELLED_LOG_COFACTOR labelling and the rho_baseline column
      belong to J6 and are not reviewed here.

  # ---------------------------------------------------------------------------
  # J3 -- THE AMENDED CONTROLS PASSED AS WRITTEN AND WERE READ FIRST
  # ---------------------------------------------------------------------------
  J3:
    verdict: breaks
    what_breaks: >-
      The plan's breaking artifact is "a control r not reproducible from its seed
      by the amended recipe". Both controls meet it. The receipt's planted r
      21267647932560890694131768545984398499 (125 bits, d = 2^62 + 242503) and
      safeprime r 9223372036855262123 (64 bits, q = 2^62 + 243157) come from a
      start of 2^62 + (seed mod 2^20). That start is in driver.py, and in no
      version of the amendment.
    i_reconstruction:
      seeds: {planted: 2026091301, planted_mod_2^20: 242469, safeprime: 2026091302, safeprime_mod_2^20: 242470}
      A_driver_recipe_as_implemented: >-
        This reviewer's own re-implementation (FLINT primality; no producer module
        imported) of driver.py's recipe starts at q = 2^62 + (seed mod 2^20). It
        uses even k ordered k0, k0+2, k0-2, ..., the bit window, rel <= 0.02 and
        the driver's trial counting. It reproduces the receipt EXACTLY: planted
        r, d, k, trials = 26; safeprime r, q, trials = 344. The controls are
        therefore deterministic from their seeds under the producer's own
        recipe, and they were not hand-picked values.
      B_amendment_as_committed_at_HEAD_v2: >-
        Planted: q from 2^52 + (seed mod 2^20) upward, d = q = 4503599627612983,
        and "k near q". With the driver's k-order, and also with downward order,
        this gives r = 20282409605835785638891547319341 (105 bits, k = d - 3).
        With upward k-order it gives r = 20282409605837163740377596892139. "k
        near q" therefore admits at least 2 different r. Safeprime: q from 2^50
        + (seed mod 2^20) upward with 2q+1 prime gives q = 1125899907085559 and
        r = 2251799814171119 (52 bits). Neither equals the receipt.
      C_amendment_the_run_was_launched_under_v1: >-
        v1 (commit ab103bfb, 09:37:56Z) changed only the bit windows and left the
        frozen planted q window [2^16, 2^20] in force (supersedes_fields: null).
        With k near d (rel <= 0.02), r ~ d^2 reaches at most ~41 bits, so the
        planted control is UNCONSTRUCTIBLE inside [104, 128]. The v1 safeprime has
        no start rule at the new size, so it is underdetermined. The driver
        resolved both with its own start. Its comments give the reasons:
        "Prefer the high end of the window so E≈0.25+1/log2(r) sits deeper in
        [0.24,0.26]. Start d near 2^62" and "Prefers the high end of the window
        so the r-1 branch sits above the frozen 0.49 threshold". That choice is
        not in execution-report protocol_deviations, which declares only even k,
        the factoring cap and the amendment.
      chronology: >-
        09:37:56Z: AMD v1 committed (ab103bfb). 09:39:19Z: code commit 846a4e07.
        09:43:02Z: trial plan written, binding amendment_sha256 179ea99b... = v1.
        09:43:12Z-09:43:19Z: controls constructed and receipt written.
        09:51:02Z: the amendment REWRITTEN IN PLACE under the same id (bef8ce95).
        The rewrite adds q_search_window/q_search_start, with starts 2^52/2^50
        that the run did not use, and populates supersedes_fields. Its commit
        message says "so TASK-20260916-3dcd7e can meet its completion gate
        without an unauthorized construction". 10:01:43Z: run ends. 10:03Z:
        snapshot. The recipe the review plan cites (v2) was written after the
        controls existed. It neither describes nor authorizes them.
    ii_even_k: >-
      Forced. d is an odd prime, and odd x odd + 1 is even, so it can never be
      prime. (Verified on the receipt's d and k.) Parity does not make the band
      easier to hit. The planted E sits 8.0e-40 above its analytic floor, so it
      is fixed by the size of r through floor ~ 0.25 + 1/log2(r). The size of r
      is what sets the margin, and the undeclared start sets the size. The
      margin below the band top 0.26 is 0.00194 at 125 bits, against 0.00038 for
      the v2-literal 105-bit control. The safeprime margin over 0.49 is 0.00206 at
      64 bits, against 0.000196 at 52 bits.
    iii_gates_recomputed:
      producer_controls: >-
        Planted: E = 0.258064516129032248196614378645965102533..., which agrees
        with the receipt to at least 30 digits. The minimizing branch is r-1, the
        r-1 minimizer is d itself (recovered_d true), r_bits 125 is inside
        [104, 128], E is inside the band [0.24, 0.26], and |E - (0.25 +
        1/log2 r)| ~ 0 <= 0.01. The r+1 branch E is 0.337149186621918684...,
        which matches the receipt. Safeprime: r-1 = 2 x 4611686018427631061,
        with q proven prime by FLINT. The divisors are {1, 2, q, 2q}, the minimum
        is at d = 2, E = 0.49206349207857269046... >= 0.49, and E >= (0.5 -
        0.5/log2 r) - 0.01. r_bits 64 is inside [52, 64]. Every gate recomputes
        exactly as the receipt states.
      review_diagnostic_not_a_control_result: >-
        The v2-literal controls built above were put through the same gates.
        They pass: planted E = 0.25961538461537025176..., band and asymptotic
        check pass; safeprime E = 0.49019607962368822733... >= 0.49, floor check
        passes. The margins are narrower. This is recorded so the Coordinator can
        see that the J3 break is one of control provenance and admissibility. It
        is not evidence that the evaluator mis-scores a known answer. It is not a
        substitute control and not a census row.
    iv_ordering: >-
      The evidence has three parts. (1) stdout.log sequence and timestamps: the
      line "controls_receipt committed" (09:43:19Z) precedes the first line that
      carries a deployed E(r) value ("stop-and-escalate trigger: NIST-P-224",
      09:43:24Z). The first deployed line that shares 09:43:19Z is "factoring
      NIST-P-224 ...", which carries no E(r). (2) Code structure of the driver
      whose hash the trial plan recorded: run_controls writes
      controls_receipt.json with exclusive-create and fsync, then returns before
      census_deployed is called. e_table.json, factorizations.json and
      independent_recompute.json are written only after every row. (3) The log
      fingerprints tie that driver to this run (J4 iii). Assessment: consistent
      with the contract's ordering control as a single-process log, but not
      tamper-evident. No hash of controls_receipt.json was logged at write time,
      and nothing was git-committed before the deployed rows. The receipt's
      bytes are bound only by the post-run snapshot, which is hash-recorded and
      not verifier-bound. e_table.json recorded_at (09:43:19Z) is the time the
      object was created, not the time the file was written (about 10:01:43Z),
      so it should not be read as ordering evidence.
    v_r_plus_1_path: >-
      No positive control exercises the r+1 branch. The planted control's r+1
      branch was evaluated (E_{r+1} = 0.3371), but it has no known answer. The
      safeprime's r+1 was factored and not evaluated. The r+1 path uses the same
      evaluate_branch code as r-1; only m and the label differ. This review's
      independent recomputation reproduces all ten deployed r+1 minima (J2).
      That is an arithmetic cross-check, not a known-answer control. No artifact
      in the package contains one.
    consequence_per_plan: >-
      The plan's composition key J3_breaks reads: "The census has no admissible
      controls; every deployed row is void as it was for RUN-AUXIN-6117d3.
      Infrastructure, not mathematics." Composition is the Coordinator's. This
      reviewer records the facts that bear on it. The gates recompute. The
      construction is deterministic under a producer-chosen recipe. The
      governing text was rewritten afterwards to a different recipe. Controls
      built by that later text would also pass (diagnostic above).

  # ---------------------------------------------------------------------------
  # J4 -- PROVENANCE, BINDING AND RAW/SUMMARY AGREEMENT
  # ---------------------------------------------------------------------------
  J4:
    verdict: breaks
    bytes_hold: true
    what_breaks: >-
      (a) HASH MISMATCH ON THE GOVERNING INPUT. The verifier-bound trial-plan.json
      records amendment_sha256 179ea99bb454b5375985c8bba4b8a1e2814a3f2d198086dd9b0724ff2279b564
      (= AMD at ab103bfb, v1). The committed amendment at HEAD hashes to
      8dcd725a316ab61c216dacba3b2575c86fb7830a0941316f74e7bb3b9f339372 (= v2 at
      bef8ce95). It was rewritten in place mid-run, and no path_sha256 binds it,
      so no verifier can see the change. (b) NARROW BINDING. The run files and
      implementation modules are hash-RECORDED but not verifier-BOUND (ii). (c)
      ONE RESTATEMENT DISAGREES WITH THE BYTES. orders.json's own
      orders_json_sha256, and stdout's "orders.json file sha256", both give
      be181bea21776962cf644685c1e0dc736ad8d859e410a475c14d668ac4c4c38d. That is
      the hash of a DELETED pre-image. stage0_pin writes the file, hashes it,
      unlinks it, and rewrites it with the hash inserted; this reviewer
      reconstructed the pre-image exactly. The committed orders.json is
      5f0540d39a48089c42915693eb213cd85d1282b29df6fa844d03ca0eb800b291. The
      launch gate's "hash-committed before any factoring" therefore commits to
      bytes that are not the committed file. The r-value sha256_commitment is
      unaffected.
    consequence_per_plan: >-
      The plan's composition key J4_breaks reads: "No evidence record may cite the
      run until a superseding snapshot binds the run files (and, if recoverable,
      the implementation) by path_sha256." The implementation is recoverable
      (iii). Both amendment versions would also need binding for the control
      question (J3) to be auditable.
    i_hashes: >-
      All 14 files under runs/RUN-AUXIN-fd1edc/ match snapshot.json
      run_artifacts_sha256, both at HEAD and at the snapshot commit 845a8e84.
      There are no extra and no missing files. (Per-file values are in
      computations.json j4_provenance.i_hashes.)
    ii_verifier_scope:
      read: >-
        tools/research_dispatch.py at HEAD (sha256
        fef6619de2480776d6763577e520aaf73e645509cf98cede0bcaf7a69f025001):
        validate_archive_shape, validate_queue archive coverage,
        _verify_content_only, verify_archive.
      finding: >-
        content_first verification checks only archive.path_sha256 from the
        dispatch queue. Here that is {implementation/trial-plan.json:
        40118d22..., archives/TASK-20260916-89f8c7/snapshot.json: c67c6860...}.
        It reads the bytes from HEAD (tree_ref "HEAD"), not from the archive
        commit. It also checks that the commit resolves, is an ancestor of HEAD
        and has the declared first parent, and that the commit message contains
        the queue's record_ids. research_dispatch.py contains 0 occurrences of
        run_artifacts_sha256 and 0 of source_sha256. The 14 run files and 4
        implementation modules are therefore hash-RECORDED inside verifier-bound
        files, and NOT verifier-BOUND. No tool re-hashes them. Run on the
        producing queue (--claims off, output to scratch), the verifier exits 0
        with content_only_archives paths_verified: 2.
      further: >-
        snapshot.json at its own recorded commit 845a8e84 hashes to 293ea2f3...,
        not to the bound value c67c6860.... The bound value is the HEAD version,
        which commit 933458f7 rewrote after the fact to insert the commit sha.
        content_first passes only because it reads HEAD. What is verified is
        therefore "HEAD holds these bytes", not "the archive commit contained
        these bytes". The queue's archive record_ids omit RUN-AUXIN-fd1edc,
        although snapshot.json and the commit message both name it.
    iii_implementation:
      code_commit: 846a4e071834d59aa3b3cc4d9c81fd2fc7552634 (09:39:19Z), dirty true
      finding: >-
        RECOVERABLE. A replication gap remains, but it is not a falsification.
        e_eval.py, factor_path_a.py and factor_path_b.py are byte-identical at
        846a4e07, at the snapshot commit 845a8e84, at HEAD and in trial-plan
        source_sha256. driver.py at 846a4e07 (355ce291...) is the previous run's
        driver. The driver at 845a8e84 and HEAD (17fd8e6a...) equals trial-plan
        source_sha256, which was written at 09:43:02Z, 10 s before start; the
        diff is 156 lines added and 72 deleted (amended construction, windows,
        gates, log formats). Four stdout fingerprints exist only in the new
        driver: "(numeric gates bind; no asymptotic substitution)", "safeprime
        constructed r_bits=", "asymp_prox=" and "asymp_floor=". The new driver's
        recipe reproduces the seed-derived controls, including trial counts, and
        every reported number recomputes.
      residual_gap: >-
        The executing code was not hashed in-process. git_meta computes
        dirty_summary, but the manifest does not record it, so what was dirty is
        not on record. The tie to the run rests on the trial-plan hash taken 10 s
        before start and on the behavioural fingerprints above.
    iv_restatements: >-
      For every row, e_table.json, raw-result.json e_table_summary,
      execution-report.yaml E_r_table_summary, execution-report.yaml.json,
      stdout.log row lines and independent_recompute.json all agree on curve,
      kind, value, branch and d (d_bits in stdout) and on the agree flag. Two
      exceptions are recorded. The first is the orders.json self-hash (a,c
      above). The second is the manifest's
      factoring_seconds_per_integer_cap: 3600.0, beside deep_attempt_cap_seconds
      300.0 and deep_bit_cap 260, although the effective per-integer budget was
      360 s. The escalate lists agree across e_table, stdout trigger lines, raw,
      manifest and execution report (6 curves) and equal the E(r)-kind rows <=
      0.40. The sha256_commitment is restated identically three times, and the
      control values are restated consistently. For the compose task only, and
      not ruled on: 9 rows are <= 0.40 if E_bound rows are counted.
    v_seeds: >-
      The specification's replication.seeds, manifest inputs.seeds, trial-plan
      seeds, receipt seeds and amendment seeds all equal [2026091301,
      2026091302].
    other_provenance_notes: >-
      One owner, coordinator-harness-cont-d048, claimed both the executor task
      TASK-20260916-3dcd7e and the snapshot task TASK-20260916-89f8c7 on branch
      cursor/auxin-7e2e3d-census-d048. The mid-run amendment rewrite (bef8ce95)
      is in the same commit series. The execution report's artifact_paths lists
      12 files, not 14, because both execution-report files are written after
      the listing is taken. The run's trial-plan.json copy is byte-identical to
      implementation/trial-plan.json.

