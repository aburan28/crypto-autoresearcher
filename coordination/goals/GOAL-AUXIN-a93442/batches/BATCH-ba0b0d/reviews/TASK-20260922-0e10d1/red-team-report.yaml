        complete_rows_n27: {min: 3.02e-7, q25: 1.82e-5, median: 2.18e-3, q75: 0.0718, max: 0.2055}
        all_rows_bounds_included_n32: {min: 3.02e-7, q25: 2.66e-5, median: 5.74e-3, q75: 0.0616, max: 0.2055}
        complete_branches_n59: {min: 3.02e-7, q25: 2.03e-3, median: 0.0595, q75: 0.1431, max: 0.2344}
        near_floor_counts: '10 of 32 primes within 1e-4 of the floor; 7 of 32 within 1.5e-5'
        per_prime_values: >-
          0: 9.0e-6 (r+1); 1: 3.0e-7 (r+1); 2: 0.0351; 3: 0.2055 (not
          escalating, min 0.4594); 4: 0.0677; 5: 1.88e-3; 6: 0.0793; 7: 1.39e-5;
          8: 2.39e-4; 9: 0.0595; 10: 0.1192; 11: 2.83e-6; 12: 8.20e-4; 13:
          2.25e-5; 14: 0.0390; 15: 0.0124; 16: 3.18e-3; 17: 0.0817; 18: 0.0886;
          19: 0.0306; 20: 0.0178; 21: 2.18e-3; 22: 5.96e-5; 23: 0.1519 (not
          escalating, min 0.4058); 24: 9.91e-6; 25: 1.20e-3; 26: 5.44e-6; 27:
          1.61e-6; 28: 0.0759; 29: 2.80e-5; 30: 0.0180; 31: 8.29e-3.
      comparison_with_deployed:
        deployed_all_10_contract_reading: >-
          Census: 9 escalate + 1 undetermined (NIST-P-521) of 10; one of the 9
          (brainpoolP384r1) is a void field-prime row, so 8 of 9 valid rows plus
          P-521 undetermined; with diagnostic D1, 9 of 9 valid rows (and the true
          brainpoolP384r1 order, D1c, would escalate too).
        transfer_assumption: >-
          PTM-1 samples 256-bit primes only. The 224-, 384- and 521-bit deployed
          rows are compared on the (heuristic, stated) ground that the escalate
          probability is governed by the exponent thresholds relative to log m,
          not by the size itself; the 256-bit-class comparison below needs no
          such assumption.
        deployed_256_bit_class_6: >-
          NIST-P-256, secp256k1, brainpoolP256r1, Ed25519-L, BN254-r,
          BLS12-381-r: 6 of 6 escalate (contract reading); r-1 typed 4
          escalate, 1 not (brainpoolP256r1), 1 undetermined (Ed25519-L) in the
          census -- 5 escalate, 1 not with diagnostic D1 (Ed25519-L r-1 0.2732).
        fisher_exact_two_sided: >-
          contract reading 6/6 deployed vs 30/32 random: p = 1.0; r-1 typed
          4-5/6 vs 24-25/32: p = 0.64 to 1.0. No detectable difference; the test
          has little power at these sizes, and none is needed for the reading
          below.
        deployed_distance_to_floor: >-
          NIST-P-256 3.3e-7 and secp256k1 1.1e-5 lie INSIDE the random
          distribution (random min 3.0e-7, 7 of 32 within 1.5e-5);
          brainpoolP256r1 (r+1) 1.7e-3 is near the random median. The two
          pairing rows (BLS12-381-r 3.4e-81, BN254-r r+1 7.2e-42) lie far below
          every random row -- by polynomial identity, not by chance
          (scripts/pairing_algebra.py: BLS12 r - 1 = u^2 (u^2 - 1);
          BN r + 1 = 2 (3u^2+3u+1)(6u^2+1), two 127-bit halves), which is what
          expected_structure_flag is for.
      prediction_check: >-
        A RECALLED heuristic (Dickman: P(largest prime factor of n > n^a) ~
        -ln a for 1/2 <= a <= 1), used only as a prediction: a branch fails the
        0.40 ceiling roughly when its largest prime exceeds m^0.8, probability
        ~0.22, so escalate ~0.78 per branch and ~0.95 per prime on two branches;
        a branch is inert (>= 0.49) roughly when its largest prime exceeds
        m^0.98, probability ~0.02, so ~4e-4 per prime. Observed: 0.72-0.78 per
        typed branch, 0.94 per prime, 0 of 59 complete branches inert. The
        measurement, not the heuristic, carries the conclusion.
      reading: >-
        The preregistered pair (inert >= 0.49, escalate <= 0.40) made escalation
        the expected outcome for ANY prime of this size (~94 %) and made the
        inert outcome almost unreachable (~0.04 % per prime) -- the census could
        essentially never have returned "inert". The escalate is a generic
        arithmetic fact about primes near 2^256 and must be reported as one
        (plan composition J7_generic): thresholds stay frozen, the calibration
        gap is a finding about the protocol, and any future census using them
        needs a protocol_amendment (RT-CA6B7C-C3).

    PTM_2_prime_built_to_be_inert:
      status: PERFORMED (review computation; not a census row; no RUN-*)
      construction: >-
        r = 12 q' - 1 with q' prime, q = (r - 1)/2 = 6 q' - 1 prime, r prime; so
        r - 1 = 2 q (safe prime) and r + 1 = 2^2 * 3 * q'. 2^2 * 3 is the SMALLEST
        smooth part r + 1 can have when r - 1 = 2q with q odd: 4 | r + 1 is
        forced, and r + 1 = 4 q' would make r or q divisible by 3. Search start
        q'_0 = ceil(2^255 / 12) + random.Random(2026092202).getrandbits(248)
        (seed 2026092202 declared by this reviewer; the card names none), q'
        increased by 1 with a small-prime sieve to 3000, sympy.isprime (BPSW) on
        survivors, then PARI isprime (flag 0, a primality PROOF) on r, q, q'.
        Found after 37,349 candidates (0.06 s).
      object:
        r: '58221680395671165421786600738676629299997238929991671896513481011002650440227'
        r_bits: 256
        q: '29110840197835582710893300369338314649998619464995835948256740505501325220113'
        q_prime: '4851806699639263785148883394889719108333103244165972658042790084250220870019'
        primality: 'r, q, q_prime all PROVEN prime by PARI 2.15.4 isprime (flag 0)'
      analytic_expectation: >-
        E_{r-1} ~ 1/2 - 1/(2 log2 r) = 0.498039 (d = 2); E_{r+1} ~ 1/2 -
        log2(12)/(2 log2 r) = 0.492971 (d = 12). The small smooth part 12 of r + 1
        costs log2(12)/(2 log2 r) ~ 0.0070 below 1/2; both stay >= 0.49.
      result_producer_evaluator: >-
        The PRODUCER's own modules, imported read-only (factor_path_a with the
        driver's effective budget 360 s and deep cap 260, e_eval.evaluate_E,
        factor_path_b.recompute_E / agree_with_primary): quantity_kind E(r);
        E_{r-1} = 0.4980392779041433678978716951557 (d = 2, 4 divisors);
        E_{r+1} = 0.4929708848120185816780339162412 (d = 12, 12 divisors); path B
        agrees; the driver's escalate predicate does NOT fire; both branches
        >= 0.49 (inert reading).
      result_own_evaluator: >-
        mpmath at 110 digits on the lattice known by construction: E_{r-1} =
        0.498039277904143367897871695156, E_{r+1} = 0.492970884812018581678033916241;
        Theorem 2 shape on r+1 identical (d = 12 is tiny). Agrees with the
        producer to all 30 digits printed and with the analytic expectation.
      verdict: holds
      reading: >-
        The evaluator CAN return an inert answer at deployed size on BOTH
        branches, including the r+1 path that no control had exercised. So the
        near-universal escalation of PTM-1 and of the deployed rows is not an
        evaluator artefact. It also shows what inertness costs: at 256 bits it
        needs r +/- 1 to be (tiny smooth part) x (one prime), a structure that
        must be built on purpose.

    PTM_3_no_supply_null:
      status: PERFORMED (argument check; no computation)
      object: >-
        Any flagged curve, assuming nothing releases [x^d]P (r - 1) or the
        Theta(d) consecutive powers (r + 1). Known-false conclusion: "the discrete
        logarithm costs r^E(r)" (DEC-20260802-204 B032-C7/C8).
      sentences_tested:
        - text: 'e_table.json note: "Values are MODELLED exponents from the frozen expr applied to MEASURED divisor lattices. No Cheon run, no DL recovery, no vulnerability claim."'
          under_null: delivers no cost -- FAILS as required.
        - text: 'e_table.json row structure: E_r beside rho_baseline 0.5, no auxiliary-input label.'
          under_null: >-
            The juxtaposition still reads "0.2539 < 0.5" -- SURVIVES as a reading.
            Not asserted by any record; refused; J6-O1 is the repair.
        - text: 'specification objective: "... makes the DEC-20260802-204 Cheon-type expression sit materially below the rho baseline 0.5".'
          under_null: >-
            Survives only as arithmetic about an EXPRESSION; delivers no cost if
            read as written. Frozen; any record restating it must add "given
            supplied auxiliary input".
        - text: 'goal completion criterion 1: "the best achievable exponent min over admissible d of the Cheon cost tabulated per curve against the sqrt(r) rho baseline at identical accounting".'
          under_null: >-
            "Best achievable ... against rho ... identical accounting" SURVIVES the
            removal of supply if read literally -- it proves too much. Refused;
            the goal text should add the supply condition in its next revision.
        - text: 'DEC-20260922-19b645 plain_answer: "It holds only GIVEN [x^d]P for that specific d ... which an attacker holding P and [x]P does not have".'
          under_null: FAILS as required (explicitly conditional).
        - text: 'plan header: "the escalate is a statement about the divisor lattices ... under Cheon''s KNOWN auxiliary-input cost expression".'
          under_null: FAILS as required (conditional), though mis-typed for r + 1 (J5-O3).
        - text: 'H-AUXIN-66e6fd statement: "... It is not an ordinary-ECDLP improvement, not a protocol-supply claim, and not a vulnerability."'
          under_null: FAILS as required.
      verdict: holds
      reading: >-
        No ASSERTED sentence delivers a cost below rho without supply. Two
        READINGS do -- the unlabelled rho column and the goal's "best achievable
        exponent ... at identical accounting" -- and both are refused and routed
        to repair. Nobody asserts either, so T1 does not fire.

    objections_surviving_own_attack:
      - id: RT-CA6B7C-J7-O1
        severity: major
        finding: >-
          The escalate is generic: 30/32 random 256-bit primes satisfy the
          contract's rule (93.8 %, 95 % CI 79.2-99.2 %) against 9/9 valid
          deployed rows once the bound rows are finished (D1), 6/6 in the
          256-bit class. The preregistered thresholds were never calibrated
          against this null.
        self_attack: >-
          Tried: 32 is too few. The interval's lower end (79 %) is already far
          above anything that would make six-of-ten surprising, and the
          prediction from the largest-prime-factor law (~95 %) sits inside it.
          Tried: random primes are the wrong null for special-form orders (NIST
          generalized-Mersenne-adjacent n, Koblitz secp256k1, polynomial pairing
          orders). For the pairing rows the right null is the polynomial family,
          and their near-floor values are identities -- expected structure, not
          signal. For the others: RFC 5639 section 2.1 (in-repo primary text,
          lines 295-301) considered the Brown-Gallant attack "where q-1 has a
          factor u in the order of q^(1/3)" and states "no corresponding
          security requirement is stated here"; a grep of the in-repo SP 800-186,
          SEC 2 v2 and RFC 7748 texts found no requirement on n +/- 1 other than
          the embedding-degree criterion ("(order - 1) / 100"); and JK20 reaches
          the same "resemble that of a random integer" conclusion for r - 1
          across ~80 standardized curves.
          Tried: the P-256 near-floor closeness (3.3e-7) is special. A random
          prime came closer (3.0e-7); 7 of 32 were within 1.5e-5.
        repair: Report as J7_generic; protocol_amendment before any reuse of the thresholds (RT-CA6B7C-C3).
      - id: RT-CA6B7C-J7-O2
        severity: minor
        finding: >-
          The goal's pre-declared inert branch ("the lane closes on a
          certificate") had a prior probability of about 4e-4 per prime at this
          size (0/32 observed, 0/59 complete branches individually inert). The
          census design could essentially not produce its closure outcome; see
          closure_challenges CL1.

    PTM_summary:
      PTM_1: breaks (generic)
      PTM_2: holds
      PTM_3: holds (two refused readings routed to J6-O1 and to the goal text)

