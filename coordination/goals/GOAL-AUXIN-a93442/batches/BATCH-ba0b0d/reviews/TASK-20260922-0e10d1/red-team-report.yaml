  required_controls:
    - id: RT-CA6B7C-C1
      name: typed_two_branch_table
      procedure: >-
        Any evidence record reports E_{r-1} (frozen expression = Cheon Theorem 1
        shape) and E_{r+1} in the Cheon Theorem 2 shape as separate columns, each
        with its input model and the bits of d; the frozen E1-on-r+1 numbers only
        as labelled arithmetic. All inputs exist in the package; zero new runs.
    - id: RT-CA6B7C-C2
      name: escalate_set_correction_record
      procedure: >-
        A correction record states the contract's set (reading B) and names the
        producer's (A) and the typed sets (C, E) with their input models,
        stratified by expected_structure_flag. Never edit the run.
    - id: RT-CA6B7C-C3
      name: null_calibration_before_reuse
      procedure: >-
        Before any future census reuses the 0.40 / 0.49 thresholds, a
        protocol_amendment calibrates them against the random-prime null
        (PTM-1 here is the first measurement; its size, 32, is small).
    - id: RT-CA6B7C-C4
      name: r_plus_1_known_answer_control
      procedure: >-
        The r+1 code path has no positive control at any size (plan J3(v)). PTM-2
        exercised it once at the INERT end (known lattice, value reproduced to 30
        digits by an independent evaluator). A planted r+1 control (r + 1 = d*k
        with d ~ sqrt(r)) at deployed size is the missing positive control.
        Recommended, not performed here (J3 is not this task's joint).
    - id: RT-CA6B7C-C5
      name: finish_the_bound_rows_before_calling_them_undetermined
      procedure: >-
        Before any record calls a row 'undetermined', finish its cofactors with standard tooling: diagnostic D1 split all four r-1 cofactors in 9-90 s (GMP-ECM / PARI), and the census's own stopping rule allowed 3600 s per integer while cofactors above 260 bits got no deep attempt at all (J2 (vi) rules on that deviation).

  counterexample_or_mutation: >-
    Three, all cheap and all performed. (1) MUTATE THE BRANCH COST: replace
    + sqrt(d) by + d on r+1 only (Cheon Theorem 2); brainpoolP256r1 moves from
    0.2556 to 0.3401, BN254-r r+1 from 0.25394 to 0.3370, and the r+1 floor
    from ~1/4 to ~1/3 -- the "near-1/4 on r+1" reading does not survive the
    correct cost. (2) NULL OBJECT: 32 random 256-bit primes (PTM-1) -- see J7
    for the escalate rate. (3) KNOWN-FALSE OBJECT: a proven 256-bit prime with
    r - 1 = 2q and r + 1 = 12q' (PTM-2); the producer's own evaluator reports
    inert on both branches, so the evaluator is not what makes rows escalate.

  baseline_comparison:
    ordinary_input:
      pollard_rho_time_exponent: 0.5
      bsgs_time_exponent: 0.5
      bsgs_memory_exponent: 0.5
      this_package_sota_delta: 0.0
      dominated_by: Pollard rho / kangaroo (unchanged; DEC-20260802-204 B032-C8)
      note: No row of the package is an ordinary-input cost; J6-O1 is the repair that keeps it from being read as one.
    auxiliary_input_closest_specialized_baselines:
      r_minus_1: >-
        Cheon 2006 Theorem 1 / Brown-Gallant: O(log p (sqrt((p-1)/d) + sqrt(d)))
        time, O(max(sqrt((p-1)/d), sqrt(d))) memory, input one power g^(alpha^d);
        balanced floor p^(1/4); rho/distinguished-point low-memory variant (PKC
        2012 section 2.2). The r-1 rows restate this known baseline at specific
        integers; nothing dominates or is dominated anew.
      r_plus_1: >-
        Cheon 2006 Theorem 2 (and Satoh / Kim-Cheon-Lee / Cheon-Kim
        restatements): O(sqrt((p+1)/d) + d), input Theta(d) consecutive powers,
        floor p^(1/3). The frozen E1 values on r+1 are NOT points any read
        algorithm attains; they may not be placed on any frontier and a
        dominated_by: null for them would be a fabrication (AGENTS rule 5).
      generic_lower_bound_context: >-
        Cheon-Kim ePrint 2012/609 states their d | p+/-1 running time "corresponds
        with the lower bound in the generic group model" (Omega(sqrt(p/d)) given
        d powers); no row here is below that.
    dominated_by_check: >-
      Checked against time, memory and data/input on both typed rows. Time: each
      row equals the known Cheon cost at that integer (r-1) or is re-typed to it
      (r+1). Memory: O(max(sqrt(m/d), sqrt(d))), e.g. ~2^64 group elements at the
      balanced 128-bit d for NIST-P-256 unless the rho/DP variant is used. Data:
      one power (r-1) versus Theta(d) consecutive powers (r+1) -- the r+1 input
      alone is from about 2^48.3 (NIST-P-224) to about 2^127.8 (BN254-r at its
      reported minimizer) group elements on the listed rows. No row claims a
      Pareto point; sota_delta 0 on every axis.

  heuristic_challenges:
    - id: RT-CA6B7C-H1
      challenge: >-
        H-AUXIN-66e6fd declares heuristic_assumptions: [] ("exact arithmetic").
        True of the table, false of its INTERPRETATION: the goal's pause
        condition calls a near-sqrt(r) hit "a surprising positive on
        standardized parameters", and the preregistration treats inert and
        escalate as comparable first-class outcomes -- both encode an unmeasured
        expectation about the null. PTM-1 is that measurement, and it
        contradicts the expectation (escalate ~94 %, inert ~0 %). The only distributional reasoning used here (the
        largest prime factor of a random integer exceeds n^a with probability
        about -ln a for 1/2 <= a <= 1, Dickman) is RECALLED, marked as such, and
        used only to predict PTM-1, never to support a conclusion.
    - id: RT-CA6B7C-H2
      challenge: >-
        Random-model transfer: r +/- 1 are not uniformly random integers (both
        even; exactly one is divisible by 3 for r > 3; pairing orders are values
        of fixed polynomials). The pairing rows' near-floor values are FORCED by
        polynomial identities (verified against the package r values in
        scripts/pairing_algebra.py): BN r + 1 = 2(3u^2+3u+1)(6u^2+1), two 127-bit
        halves; BLS12 r - 1 = u^2 (u^2 - 1). The cheapest experiment that exposes
        the deviation is exactly E - floor1: random primes (PTM-1) versus these
        rows (1e-41 and 1e-81 above the floor).

  cost_model_challenges:
    - id: RT-CA6B7C-CM1
      challenge: >-
        Log factor: Cheon 2006 states both theorems as O(log p * (...)); the
        contract drops it (disclosed as optimistic). Restoring it via the
        package's own MODELLED_LOG_COFACTOR column removes NIST-P-224, NIST-P-384
        and brainpoolP384r1 (void row) from the census's <= 0.40 set (J5 reading
        H): two of the eight valid memberships depend on a disclosed optimism.
    - id: RT-CA6B7C-CM2
      challenge: >-
        Input size is a cost on r+1: Theorem 2 must at least read 2d group
        elements and spends 6d exponentiations building its polynomials; the
        frozen expression charges sqrt(d). For the brainpoolP256r1 and BN254-r
        r+1 minimizers (126-127-bit d) the input alone is about 2^126.3 and
        2^127.8 group elements -- the size of a rho run -- and the Theorem-2 cost
        at those d is r^0.49 and r^0.50.
    - id: RT-CA6B7C-CM3
      challenge: >-
        Total expected cost is not r^E(r): it is conditional on supply, whose
        cost is undefined here (IDEA-20260831-ccb587 unopened) and, from
        ordinary input, not established below rho (DEC-20260802-204 B032-C7).
        E(r) is a per-integer lower envelope of a conditional cost, not a cost.

  reduction_and_scope_challenges:
    - id: RT-CA6B7C-R1
      challenge: >-
        Reduction instantiation fails for r+1: the contract cites
        DEC-20260802-204 and the PKC 2012 paper, which type only d | r - 1 with
        one power (read, section 2.1); H-AUXIN-66e6fd promises "a sibling
        expression for d | (r+1)" but the frozen formula uses the SAME
        expression. The cited theorem's hypotheses do not transfer to the r+1
        branch.
    - id: RT-CA6B7C-R2
      challenge: >-
        Scope: nothing in the package, plan or decision inflates to a deployed
        system or scheme; this report adds none. Pairing rows must be counted
        stratified (J6-O3).

  proof_architecture_challenges:
    - id: RT-CA6B7C-P1
      attack: observation_fiber
      detail: >-
        Hold the observation fixed (E(r) = 0.2539 on NIST-P-256 r - 1) and vary
        the supply object: with [x^d]P supplied the known Cheon cost applies;
        with nothing supplied the cost is rho. Same observation, opposite
        conclusions -- the missing separator is supply, which the census does
        not and cannot measure.
    - id: RT-CA6B7C-P2
      attack: quantifier_order
      detail: >-
        The thresholds were fixed before the null was measured; the question
        "does SOME deployed order have E(r) <= 0.40" is an existential over ten
        draws from a distribution where (PTM-1) almost every draw qualifies. An
        existential over near-certain events carries no curve-specific
        information.
    - id: RT-CA6B7C-P3
      attack: method_ceiling
      detail: >-
        The frozen expression cannot go below ~1/4 + 1/log2(r) on r - 1; the
        typed r + 1 cost cannot go below ~1/3. So the strongest thing an escalate
        can ever mean is "Cheon's known exponent is realised at this integer
        under supplied input". Any headline beyond that exceeds the method's
        ceiling before any data is read.
    - id: RT-CA6B7C-P4
      attack: nearby_object
      detail: >-
        Nearby objects where the conclusion "the standards are special" is false:
        random primes (PTM-1) and algebraically forced pairing orders (whose
        near-floor values are identities, not observations). The first
        separates the escalate from the standards; the second separates the
        near-floor closeness of two rows from chance.

  closure_challenges:
    - id: RT-CA6B7C-CL1
      target: >-
        GOAL-AUXIN-a93442 objective (1): "if the standardized orders carry no
        divisor near sqrt(r), the whole attack class is inert at deployed
        parameters regardless of any protocol, and the lane closes on a
        certificate."
      challenge: >-
        A standing closure route, challenged as hard as a claim. (i) It
        mis-states the inert condition: E >= 0.49 needs NO divisor in roughly
        [r^0.02, r^0.98], far stronger than "none near sqrt(r)" (a divisor at
        r^0.3 gives E ~0.35 with none near sqrt(r)). (ii) "The whole attack
        class" exceeds the cost model: the family includes Cheon's Corollary 1
        (several powers g^(alpha^((p-1)/d_i))), the r + 1 variant with its own
        cost, and the Cheon-Kim polynomial method; in the sources read all of
        them depend on divisors of Phi_1(r) = r - 1 or Phi_2(r) = r + 1 (the
        Cheon-Kim-Song survey and Cheon-Kim 2012/609 report Kim-Cheon-Lee's
        result that the Phi_k generalizations for k >= 3 cannot beat
        square-root algorithms, and Cheon-Kim show no polynomial attains their
        bound for Phi_3; the Cheon-Kim-Song generalized problem that needs
        neither divisor uses a different input form, to which "the reduction of
        the DLPwAI ... is not known"). So a certificate closure would be scoped
        to that family and its declared input models, and should say so.
        (iii) PTM-1 measured the chance that this closure route could ever be taken at 256 bits: 0 of 32 random primes and 0 of 59 complete random branches were inert; the largest-prime-factor law predicts ~4e-4 per prime. A closure route with near-zero prior probability is not a real branch of the design, and the goal record should say so rather than leave 'inert => close' standing as if it were live.
      tripwire_status: T4 not fired -- nobody proposes to close; this is a correction to the goal text for the record that next touches it.

  narrowest_supported_statement: >-
    On J5-J7 only, at the committed snapshot 387cead8ba: the producer's table is
    arithmetically reproduced (independent enumeration and arithmetic, 20/20
    branches, <= 2.4e-80), but what it was turned into is not. (J5) The frozen
    rule "any deployed E(r) <= 0.40" is satisfied by nine census rows, not six;
    one of the nine (brainpoolP384r1) was computed on RFC 5639's field prime and
    is void; the r+1 rows were costed with the d | r-1 formula, whereas Cheon's
    d | r+1 algorithm (EUROCRYPT 2006 Theorem 2, read) needs Theta(d)
    consecutive powers and costs sqrt((r+1)/d) + d with floor ~r^(1/3), so the
    r-1 and r+1 rows answer different problems and may not share a column.
    (J6) Nothing in the package, plan or opening decision states an
    ordinary-ECDLP, deployed-system or weak/safe-curve claim; the rho column,
    the missing input typing and the r+1 "known exponent" wording are labelling
    defects an evidence record must repair. (J7) Under the contract's reading
    the same trigger fires on 30 of 32 random 256-bit primes and never reports
    inert, so the escalate is a generic arithmetic property of primes of that
    size and carries no information about how the standardized curves were
    chosen. Scope: ten frozen orders (one void), Cheon's auxiliary-input cost
    shapes without the log factor, sympy 1.14.0 census factorizations plus the
    labelled GMP-ECM/PARI diagnostics named above, 32 seeded random primes
    under a 300 s per-integer cap. No statement about any deployed system,
    protocol or scheme follows from any of it.

  next_concrete_action: >-
    Coordinator, in TASK-20260922-a05e72 (compose): before any evidence record,
