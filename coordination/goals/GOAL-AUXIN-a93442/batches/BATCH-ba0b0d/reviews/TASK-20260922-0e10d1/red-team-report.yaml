      frozen_text_read: >-
        specification.yaml parameters.E_r "min over admissible (m, d) of
        log2(expr(d, m)) / log2(r)"; preregistered_prediction "Escalate reading if
        any deployed E(r) <= 0.40"; tail_checks "If any deployed E(r) <= 0.40,
        stop-and-escalate"; stopping_rules "Stop a single integer at 3600 s ...
        keep the partial factorization and emit E_bound" and "If any deployed E(r)
