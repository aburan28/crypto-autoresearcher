    part_v_literature:
      question: Is there an already-published per-curve r+/-1 divisor analysis of these standardized orders under Cheon's attack?
      answer: >-
        YES, partial analyses were found by this search, covering between 4 and
        8 of the 10 frozen orders each, none with both branches' complete
        lattices under Cheon's cost for all ten. H-AUXIN-66e6fd's novelty_status
        "unverified" should move toward "partially known" in whatever record
        next touches it: the r-1 largest-prime-divisor data for 8 of the 10
        orders, and bounded-d divisor data for 3 (a fourth row of that table uses
        the BN254 field prime), are already published. No claim is made that
        nothing more complete exists.
      found_and_read:
        - ref: >-
            M. J. Jacobson Jr., P. Kushwaha, "Removable Weak Keys for Discrete
            Logarithm Based Cryptography", J. Cryptographic Engineering 2020,
            arXiv:2011.07483 (KN-LIT-7636; in-repo copy
            inputs/ECTD-TESKE-20260731/sources/jk-2020-1436.pdf)
          provenance: retrieved
          sha256: 65a8ecff9a6a3b275ff76682ea6a579791a4eee41ffd2365aba764a823f5fee8
          read_scope: abstract, sections 2.3-3.2, Tables 3-7
          verified_by: TASK-20260922-0e10d1
          content: >-
            Per-curve tables of p - 1 divisor structure (p = prime subgroup order)
            for NIST, SEC, Brainpool, SafeCurves and updated pairing curves,
            including column b(pm) = bits of the largest prime divisor of p - 1.
            Covers 8 of the 10 frozen orders: P-224 (196), P-256 (92), P-384 (281),
            P-521 (391), secp256k1 (109), BP256r1 (252), BP384r1 (206), and
            'Curve25519' (b(p) 253, the same prime-order subgroup as Ed25519-L)
            (138). Not BN254-r or BLS12-381-r (it uses updated pairing
            parameters). Its framing is a different key-recovery setting, and it
            discusses Brown-Gallant and Cheon as the related static-DH/auxiliary-
            input line. It states that "current standards and practices place no
            restrictions on the factorization of p - 1, so we would expect its
            factorization to resemble that of a random integer" -- the published
            form of this plan's J7 expectation.
          cross_check_with_package: >-
            scripts/lit_crosscheck.py: for the four COMPLETE r-1 branches (P-224,
            P-256, secp256k1, brainpoolP256r1) the package's largest prime bits
            equal JK20's b(pm) exactly (4/4). For the four INCOMPLETE r-1 branches
            JK20's b(pm) exceeds every known prime, so its largest prime divides
            the census's unfactored cofactor; the implied split (by bit count
            only) would put E1_{r-1} near 0.273 (Ed25519-L), 0.366 (P-384) and
            0.375 (P-521). Checked directly by diagnostic D1 (J5): the proven
            splits agree with JK20 for Ed25519-L (138), P-384 (281) and P-521
            (391) and give 0.2732, 0.3654 and 0.3748. For brainpoolP384r1 they
            DISAGREE (243 bits vs JK20's 206) -- because the census row is RFC
            5639's field prime, not the order JK20 tabulates (J5
            cross_joint_finding_row_validity). The literature check is what
            exposed the invalid pin.
        - ref: >-
            R. Chairattana-Apirom, S. Tessaro, "On the Concrete Security of
            BBS/BBS+ Signatures", IACR ePrint 2025/1093
            https://eprint.iacr.org/2025/1093.pdf
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 14d4450e057f3f04de127f9bc303eadc2a08de0bd727234a68c7f2ec606cd1cb
          read_scope: section 1 (Cheon attack paragraph), Table 1 and the curve-order list beneath it
          verified_by: TASK-20260922-0e10d1
          content: >-
            Table 1 lists, for BLS12-381, BN254, secp256k1 and secp256r1, a
            "suitable factor" of p - 1 or p + 1 below a fixed bound, and a sentence
            on curve25519's p +/- 1 divisors. Cross-check (lit_crosscheck.py): the
            BLS12-381 and secp256r1 factors divide the package's r - 1 and the
            secp256k1 factor divides r + 1. The BN254 factor divides NEITHER r - 1
            nor r + 1, because the hexadecimal "group order" the paper prints for
            BN254 (0x30644E72...D87CFD47) is the BN254 base-FIELD prime, not the
            subgroup order -- the same field-versus-order confounder the frozen
            specification warns against. Its curve25519 "57-bit divisor of p + 1"
            does not match the package's r + 1 lattice (the only divisor between
            2^50 and 2^60 has 60 bits); not adjudicated here, not used.
        - ref: >-
            D. Brown, "Elliptic curve 2y^2=x^3+x over field size 8^91+5",
            draft-brown-ec-2y2-x3-x-mod-8-to-91-plus-5-08 (IETF Internet-Draft,
            2021-09-30) https://www.ietf.org/archive/id/draft-brown-ec-2y2-x3-x-mod-8-to-91-plus-5-08.txt
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 51a462ded806bbe68700274445d878aadcdd7e7f713eb89ffeb8c5d724f50c94
          read_scope: sections 7.2.4 and A.4.3.9
          verified_by: TASK-20260922-0e10d1
          content: >-
            Discusses the factorization of q - 1 and q + 1 of standardized orders
            under Brown-Gallant-Cheon algorithms and names P-256, Curve25519 and
            the Brainpool curves in that discussion, without printing their
            factorizations; independently states the q + 1 algorithm's input as
            "all the points [d]G, [d^2]G, ..., [d^e]G" (consecutive powers).
            Secondary source; not relied on for any number.
        - ref: >-
            "Cheon's attack and its effect on the security of big trusted setups",
            ethresear.ch topic 6692 (2019-12-26 onward), raw text
            https://ethresear.ch/raw/6692
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 79b5ac1f884b4ac08620af6e5866294944bea756e7f352c0094a3e9fb18b9ae9
          read_scope: posts 1, 5, 6, 17-22
          verified_by: TASK-20260922-0e10d1
          content: >-
            Public discussion of Cheon's r - 1 attack on BN254 and BLS12-381
            subgroup orders using the 2-adic part of r - 1 only; one post factors
            p +/- 1 for a WRONG BN254 order (the poster asks others to check it);
            post 18 states the p + 1 variant needs g^(tau^(0..2d)). Informal
            secondary source; corroborates the Theorem 2 input form only.
        - ref: >-
            RFC 5639 (Brainpool), section 2.1, in-repo primary text
            inputs/SAFECURVES-20260825/specs/rfc5639.txt lines 295-301
          provenance: internal (committed primary-text copy)
          read_scope: section 2.1 requirement 1 and the paragraph after requirement 6; section 3.4 and 3.6 parameter blocks
          verified_by: TASK-20260922-0e10d1
          content: >-
            The standard itself cites Brown-Gallant [BG] for "attacks ... where
            q-1 has a factor u in the order of q^(1/3)" and states "no
            corresponding security requirement is stated here" while
            recommending that developers check their implementations. So the
            divisor structure of q - 1 was a known, deliberately unconstrained
            property at standardization -- for the Brainpool orders at least.
        - ref: Cheon 2006 section 5 (same source as J5 part iii)
          provenance: retrieved
          content: >-
            The original paper already investigates "known elliptic curve
            parameters" -- NIST B-163, K-163 and P-192, two BLS01 curves, the
            Koblitz-Menezes set and a MIRACL curve -- printing p - 1
            factorizations, and remarks that "it is necessary and seems hard to
            find a prime p such that both of p - 1 and p + 1 have no small divisor
            greater than (log p)^2" and "we have no idea about the distribution of
            such primes". None of the ten frozen orders is analysed there.
      search_method: >-
        WebSearch (3 queries) plus direct retrieval of every cited PDF/text with
        curl through the session proxy (one WebFetch summary of the ethresear.ch
        thread was superseded by reading its raw text; the summary is not relied
        on); the in-repo KN-LIT corpus grepped for "cheon" (KN-LIT-6501 and its
        2026-09-07 addendum, KN-LIT-6736, KN-LIT-7636 read; KN-LIT-6501's filed
        abstract reproduces Cheon's own "i = 0, 1, 2, ..., d" wording). The kb MCP
        index was not used. Absence of a result is not evidence of absence.

