    r+1, Theta(d) consecutive powers, Cheon Theorem 2 cost), stratified by
    expected_structure_flag and reported as a generic property of primes of
    that size (J7_generic). Zero new runs are needed for any of that.

  could_not_verify:
    - >-
      Cheon, "Discrete Logarithm Problems with Auxiliary Inputs", J. Cryptology
      23 (2010): the author-hosted copy (www.math.snu.ac.kr) failed with an SSL
      connect error twice; not read, not relied on. A later source giving a
      sqrt(d) second term for d | p+1 would weaken J5-O2; none of the three
      primary/secondary sources read does.
    - >-
      The recalled Dickman-type law used to PREDICT PTM-1 was not read in a
      source this session; the PTM-1 measurement, not the law, carries the J7
      conclusion.
    - >-
      BN254-r and BLS12-381-r primary-source pins (J1's joint): only consistency
      with the recalled order polynomials and seeds was checked.
    - >-
      Chairattana-Apirom-Tessaro 2025's curve25519 "57-bit divisor of p + 1"
      statement does not match the census lattice; not adjudicated (J2's joint
      and outside the frozen question).
    - >-
      ECM curve parameters in D1b/D1c are GMP-ECM random defaults and not
      reproducible curve-by-curve; the factors they return are reproducible
      certificates (exact division plus PARI proof).
    - >-
      Two r+1 cofactors were NOT finished: NIST-P-384 r+1 (302 bits, no factor in 1800 s of GMP-ECM) and NIST-P-521 r+1 (a 414-bit composite left after a 75-bit prime). They stay bounds; no ruling here depends on them, because both rows already qualify on other branches or on the bound itself.

