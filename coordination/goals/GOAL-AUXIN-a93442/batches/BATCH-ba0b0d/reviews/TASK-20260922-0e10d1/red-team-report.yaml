      ruling: >-
        On the text, NIST-P-384, brainpoolP384r1 and Ed25519-L SATISFY the rule
        (brainpoolP384r1 as the census computed it; that row is void for a
        different reason -- cross_joint_finding_row_validity).
        The rule's E(r) is the mathematical minimum the specification defines; the
        "E_bound, not E(r)" clause governs what a row may REPORT as a value, not
        what the escalate predicate is about. For each of the three rows the
        reported minimizer is an explicit divisor d of m (verified: m mod d = 0;
