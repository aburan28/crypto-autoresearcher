        With d <= 2^20, 2^32 or 2^40 NO row reaches the 0.40 ceiling on either
        branch (smallest: NIST-P-224 r+1 0.4124 at k = 40). With d <= 2^64,
        seven rows reach it -- every 256-bit-class row at 0.374-0.375 and
        NIST-P-224 r+1 at 0.3945 -- and no 384/521-bit row does. At 256 bits the
        ceiling needs sqrt(m/d) <= ~2^102.4, i.e. d >= ~2^51: the ENTIRE escalate
