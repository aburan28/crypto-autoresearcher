      producer's; max |E1 - producer E| = 2.4e-80 (the producer's precision);
      no branch minimum below its analytic floor (E1 >= floor1, E2 >= floor2
      everywhere). The J5 findings are therefore about the TRIGGER and the
      TYPING, not about the arithmetic.

    part_i_the_rule_text:
      code_read: >-
        experiments/EXP-AUXIN-7e2e3d/implementation/driver.py lines 707-715:
        row_value = E_r_float64 or E_bound_float64; escalate only if
        quantity_kind == "E(r)" and row_value <= 0.40. e_eval.evaluate_E sets
        quantity_kind "E_bound" whenever EITHER branch keeps an unfactored
