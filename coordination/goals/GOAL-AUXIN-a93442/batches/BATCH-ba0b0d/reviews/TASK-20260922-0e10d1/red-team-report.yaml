    part_iii_what_the_r_plus_1_variant_requires:
      recalled_pointer_under_test: >-
        Plan: "on the order of 2d consecutive powers [x^i]P rather than one"
        (RECALLED, PD-R2).
      sources_read:
        - ref: >-
            J. H. Cheon, "Security Analysis of the Strong Diffie-Hellman Problem",
            EUROCRYPT 2006, LNCS 4004, pp. 1-11; IACR archive copy
            https://www.iacr.org/archive/eurocrypt2006/40040001/40040001.pdf
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 2e04bcbcccce906baeaf746923987c7c431ddaf7be14b0cbe0067f8be5e73c5a
          read_scope: abstract, section 1, section 3 (Theorem 1, Corollary 1, Theorem 2 and proof, Remark 1), section 5, section 6
          verified_by: TASK-20260922-0e10d1
          says: >-
            Theorem 2: "Suppose that d is a positive divisor of p + 1 and g_i :=
            g^(alpha^i) for i = 1, 2, ..., 2d are given. Then alpha can be computed
            in O(log p * (sqrt((p + 1)/d) + d)) group operations using
            O(max{sqrt((p + 1)/d), sqrt(d)}) memory." The proof needs g^(f0(alpha)),
            g^(f1(alpha)), g^((1 - a alpha^2)^d) for polynomials of degree 2d,
            "computed from g, g1, ..., g2d in 6d exponentiations" -- the source of
            the linear d term. Section 5: Theorem 2's complexity "achieves the
            minimum value O(log p * p^(1/3)) when d = O(p^(1/3))". The abstract
            and introduction say "i = 0, 1, 2, ..., d" -- an internal
            inconsistency with the theorem statement and proof, which need
            degree-2d polynomials; either way Theta(d) consecutive powers.
        - ref: >-
            J. H. Cheon, T. Kim, Y. Song, "The Discrete Logarithm Problem with
            Auxiliary Inputs", De Gruyter survey, author-hosted
            https://yongsoosong.github.io/files/papers/DLPwAI.pdf (year not printed
            in the retrieved copy)
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 5d4f698405828c21d3d80746fb58eec63d9fd75139109a99fcb702390e99692b
          read_scope: abstract, section 1, section 3.1 end, section 3.2 (Satoh / Kim et al.), section 4
          verified_by: TASK-20260922-0e10d1
          says: >-
            p+1 case "possible to find alpha from g, g^alpha, ..., g^(alpha^2d) when
            d is a divisor of p + 1"; via Satoh/Kim et al. "we can solve the DLPwAI
            in O(sqrt((p+1)/d) + d) exponentiations ... when d is a divisor of p+1
            and g, g^alpha, ..., g^(alpha^d) are given"; "can be lowered to
            O(p^(1/3)) when d ~ p^(1/3)". Section 4 (polynomials with small value
            sets, Dickson polynomial for d | p+1) keeps a "+ d log p" term.
        - ref: >-
            J. H. Cheon, T. Kim, "A New Approach to the Discrete Logarithm Problem
            with Auxiliary Inputs", IACR ePrint 2012/609
            https://eprint.iacr.org/2012/609.pdf
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 958cb9ee226f242bc3e9ef318ec5d66a8bcdba3503a2aaa2ace6b795678ac98b
          read_scope: abstract, section 1, section 5.2-5.3.2 (Remark 5.6)
          verified_by: TASK-20260922-0e10d1
          says: >-
            Abstract: Cheon's algorithm "solves alpha in the case of d | (p +/- 1)
            with running time of O(sqrt(p/d) + d^i) group exponentiations (i = 1 or
            1/2 depending on the sign)"; section 1: "O(sqrt(p/d) + sqrt(d)) ... in
            the case of d | (p - 1) and O(sqrt(p/d) + d) in the case of d | (p + 1)";
            Remark 5.6 (Dickson polynomial, d | p+1): "~O(sqrt(p/2d) + d) ... can be
            lowered to ~O(p^(1/3)) when d = p^(1/3)".
        - ref: https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf (the implementation paper DEC-20260802-204 cites)
          provenance: retrieved
          retrieved_at: '2026-09-23'
          sha256: 685d695d4e4a1382d361bb925606c3c7734d9feebd62f29445910722a1faac71
          read_scope: section 2.1
          verified_by: TASK-20260922-0e10d1
          says: >-
            Defines DLPwAI as "find alpha on input G, G1 = alpha G, Gd = alpha^d G
            ... and an integer d dividing r - 1" with cost O(sqrt((r - 1)/d) +
            sqrt(d)). It states the d | r - 1 form only, confirming the plan.
      finding: >-
        The recalled pointer is CONFIRMED on input form and INCOMPLETE on cost.
        The d | r+1 variant needs Theta(d) consecutive powers (2d in Cheon's
        Theorem 2 statement; d in the Satoh/Kim et al. restatement), not one
        power, AND its cost is sqrt((r+1)/d) + d -- linear in d -- in every source
        read, with floor ~ r^(1/3). No source read gives sqrt((r+1)/d) + sqrt(d).
        The frozen expression therefore UNDERSTATES the published r+1 cost at
        every d > 1, and its r+1 minimum is not the running time of any algorithm
        in the literature this reviewer read. The r+1 rows cannot share one E(r)
        column or one ceiling with the r-1 rows. Under the typed r+1 cost (E2),
        the r+1 rows still sit at or below 0.40 (P-224 0.3945, P-384 <= 0.3925,
        brainpoolP256r1 0.3401, Ed25519-L 0.3570, BN254-r 0.3370, BLS12-381-r
        0.3437), but for a DIFFERENT problem (from about 2^48.3 to about 2^84.9
        consecutive powers at the Theorem-2 optimum, rather than one power) at a
        different floor.
