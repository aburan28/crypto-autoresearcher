  J5:
    verdict: breaks
    verdict_summary: >-
      Breaks in both directions, as the prior expected, and in a third way the
      prior did not anticipate, plus a row-validity defect it did not
      anticipate either. (a) UNDER-INCLUSIVE on the frozen text: three
      rows (NIST-P-384, brainpoolP384r1, Ed25519-L) satisfy "any deployed E(r)
      <= 0.40" and are absent from stop_and_escalate_curves; the exclusion is an
      undisclosed narrowing of the rule. (b) MIS-TYPED: the frozen cost
      expression sqrt(m/d) + sqrt(d) is Cheon's d | r-1 cost; on the r+1 branch
      the primary source (Cheon 2006 Theorem 2, retrieved and read) requires 2d
      CONSECUTIVE powers and costs sqrt((r+1)/d) + d, not + sqrt(d). Three of the
      six listed rows (NIST-P-224, brainpoolP256r1, BN254-r) are listed on their
      r+1 minimizer. (c) NOT ANTICIPATED BY THE PLAN: because the r+1 cost has a
      LINEAR d term, its analytic floor is about 1/3 (0.3369 at 256 bits), not
      1/4. The reported r+1 values 0.2556 (brainpoolP256r1) and 0.25394 (BN254-r
      r+1) are therefore BELOW every r+1 cost in the sources read, so the plan's
      and the opening decision's sentence that the census "cannot express an
      exponent below known prior art" is false for the r+1 branch (see tripwire
      T2 ruling: not fired, and why). (d) ROW VALIDITY (cross-joint; J1 is the
      validator's): the brainpoolP384r1 row is computed on RFC 5639's FIELD
      PRIME, not its order, so one member of the contract's set and of the
      prior's r-1 typed set is void. The escalate BOOLEAN is robust -- it fires
      under every reading examined -- but the SET is not: 9 under the frozen
      text (8 on valid rows, NIST-P-521 undetermined), 6 under the producer's
      code, 5 under r-1 typing (4 valid, 3 undetermined); once the census's
      budget-limited cofactors are finished (diagnostic D1) every valid row
      satisfies the contract's rule and 7 of 9 valid rows the r-1 typed rule;
      and the r+1 rows answer a different problem at a different exponent.
    computation: >-
      scripts/j5_j6_analysis.py (computations.json): rebuilds every divisor
      lattice from factorizations.json with this reviewer's own enumeration,
      checks every product exactly, and evaluates the frozen expression E1 and
      the Theorem-2 shape E2 at every divisor with mpmath at 110 digits (the
      producer used decimal at 80/96 digits, so the arithmetic library differs).
