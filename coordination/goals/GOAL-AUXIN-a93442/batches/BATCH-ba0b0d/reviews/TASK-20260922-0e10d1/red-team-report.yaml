        expression at that d is an EXACT number <= r^0.40. Since E(r) is a
        minimum over divisors, E(r) <= 0.40 is PROVED for these rows, not merely
        bounded; the unfactored cofactor can only lower E(r) further. What an
        E_bound row cannot do is certify inertness (>= 0.49) or give the exact
        E(r); neither is needed for the escalate predicate. Excluding the three
        rows is a narrowing of the frozen rule that the execution report does not
        list among its three protocol_deviations. It changes nothing about
        whether the trigger fired (it fired on other rows); it changes the set a
        record may state.
