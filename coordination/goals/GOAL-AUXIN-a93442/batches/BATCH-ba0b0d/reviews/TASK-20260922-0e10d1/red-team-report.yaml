        Theorem 2 that needs about 2^126.3 consecutive powers, within a factor of
        about 4 of a rho run's ~2^128 group operations, and the Theorem-2 cost at
        that d is r^0.4907. BN254-r is listed at a 127-bit d: about 2^127.8
        powers, and the Theorem-2 cost at that d is r^0.500 -- exactly the rho
        exponent. The near-1/4 values on these rows are artefacts of applying
        the r-1 cost to the r+1 branch.

    part_iv_escalate_set_under_each_reading:
      void_row_note: >-
        brainpoolP384r1 appears in the lists below as the census computed it. It
        is VOID in every reading (field-prime row); each list's count on valid
        rows is stated where it matters.
      frozen_contract_reading: B_literal_rule_with_bounds
      frozen_contract_reading_basis: >-
        The contract defines E(r) as the UNTYPED minimum over both branches with
        ONE expression (specification parameters.E_r and
        preregistered_prediction.formula) and triggers on "any deployed E(r) <=
        0.40". Read literally, with E_bound as an upper bound on that E(r), the set
        is reading B. The producer's code implements reading A, which is narrower
        than the text. The TYPED readings (C, E) are not what the contract
        specifies; they are what the cost model the contract cites
        (DEC-20260802-204, d | r-1) and the r+1 primary source support. An
        evidence record should state B as the contract's set and name A, C and E
        beside it with their input models.
      A_producer_code:
        escalate: [NIST-P-224, NIST-P-256, secp256k1, brainpoolP256r1, BN254-r, BLS12-381-r]
        count: 6
      B_literal_rule_with_bounds:
        escalate: [NIST-P-224, NIST-P-256, NIST-P-384, secp256k1, brainpoolP256r1, brainpoolP384r1, Ed25519-L, BN254-r, BLS12-381-r]
        undetermined: [NIST-P-521]
        count: '9 of 10, 1 undetermined'
        void_member: brainpoolP384r1 (field-prime row)
        on_valid_rows: '8 of 9 valid rows escalate; NIST-P-521 undetermined in the census; 9 of 9 with diagnostic D1 (P-521 r-1 0.3748)'
      C_r_minus_1_typed:
        input_model: P, [x]P, [x^d]P (one auxiliary power), cost sqrt((r-1)/d) + sqrt(d)
        escalate: [NIST-P-256, secp256k1, brainpoolP384r1, BN254-r, BLS12-381-r]
        undetermined: [NIST-P-384, NIST-P-521, Ed25519-L]
        not_escalating_exact: [NIST-P-224, brainpoolP256r1]
        void_member: brainpoolP384r1 (field-prime row) -- the prior's typed set {NIST-P-256, secp256k1, BN254-r, BLS12-381-r, brainpoolP384r1} contains it
        on_valid_rows: '4 escalate, 3 undetermined, 2 not; with diagnostic D1 the 3 undetermined all escalate (Ed25519-L 0.2732, NIST-P-384 0.3654, NIST-P-521 0.3748): 7 of 9 valid rows'
        note: brainpoolP256r1 r-1 is 0.4918, inside the INERT band (>= 0.49) on this branch.
      D_r_plus_1_frozen_expr_arithmetic_only:
        input_model: NONE VALID -- frozen expression on r+1 is not a published cost
        escalate: [NIST-P-224, NIST-P-384, brainpoolP256r1, Ed25519-L, BN254-r, BLS12-381-r]
        undetermined: [NIST-P-521, brainpoolP384r1]
        not_escalating_exact: [NIST-P-256, secp256k1]
      E_r_plus_1_typed_cheon_thm2:
        input_model: '[x^i]P for i = 1..2d (Theta(d) consecutive powers), cost sqrt((r+1)/d) + d'
        escalate: [NIST-P-224, NIST-P-384, brainpoolP256r1, Ed25519-L, BN254-r, BLS12-381-r]
        undetermined: [NIST-P-521, brainpoolP384r1]
        not_escalating_exact: [NIST-P-256, secp256k1]
        values: >-
          P-224 0.3945 (d 48 bits), P-384 <= 0.3925 (83), brainpoolP256r1 0.3401
          (82), Ed25519-L 0.3570 (73), BN254-r 0.3370 (84), BLS12-381-r 0.3437
          (80). Same membership as D, different values and minimizers.
      F_typed_union_C_or_E:
        escalate: [NIST-P-224, NIST-P-256, NIST-P-384, secp256k1, brainpoolP256r1, brainpoolP384r1, Ed25519-L, BN254-r, BLS12-381-r]
        note: >-
          Same nine as B, but each member now carries the input model of the
          branch that qualifies it; the two input models are different problems
          and a record must not count them in one column.
      G_role_deployed_only_filter:
        A: [NIST-P-224, NIST-P-256, secp256k1, brainpoolP256r1]
        B: '[NIST-P-224, NIST-P-256, NIST-P-384, secp256k1, brainpoolP256r1, brainpoolP384r1, Ed25519-L], NIST-P-521 undetermined'
        C: '[NIST-P-256, secp256k1, brainpoolP384r1]; undetermined NIST-P-384, NIST-P-521, Ed25519-L'
        note: Tabulated only; this report does not adopt the filter (see part_i deployed_role_reading).
      H_sensitivity_log_cofactor:
        definition: >-
          The package's own MODELLED_LOG_COFACTOR column, log2(log2(r) * expr) /
          log2(r), which restores the log p factor that Cheon 2006 Theorems 1 and
          2 state as O(log p * (...)). NOT the contract's quantity; a sensitivity.
        escalate_on_min_over_branches: [NIST-P-256, secp256k1, brainpoolP256r1, Ed25519-L, BN254-r, BLS12-381-r]
        drops_out: 'NIST-P-224 (0.4293), NIST-P-384 (<= 0.4149), brainpoolP384r1 (<= 0.4196)'
      boolean_trigger: >-
        stop_and_escalate is TRUE under every reading A-H. The trigger firing is
