    cross_joint_finding_row_validity:
      severity: critical
      owner_of_the_joint: TASK-20260922-ba2fac (J1). Reported here because J5's sets depend on it; this is not a J1 verdict.
      finding: >-
        The census's brainpoolP384r1 row is computed on RFC 5639's FIELD PRIME,
        not its subgroup order. Package r (orders.json, driver.py CURVE_PINS) =
        0x8CB91E82A3386D280F5D6F7E50E641DF152F7109ED5456B412B1DA197FB71123ACD3A729901D1A71874700133107EC53,
        which is "p" of RFC 5639 section 3.6 (in-repo primary text
        inputs/SAFECURVES-20260825/specs/rfc5639.txt lines 683-684); the order
        is "q" = 0x8CB91E82A3386D280F5D6F7E50E641DF152F7109ED5456B31F166E6CAC0425A7CF3AB6AF6B7FC3103B883202E9046565
        (lines 698-699). The specification's invalidation_rules make this an
        invalid_measurement ("Using a field prime as r"). The pin passed the
        census's own checks because a field prime is also prime; orders.json
        records the source as "RFC 5639 brainpoolP384r1 order". The other eight
        non-pairing pins match their in-repo primary texts as orders
        (scripts/pin_field_prime_check.py); the two pairing orders match the BN
        and BLS12 order polynomials at the recalled seeds (scripts/
        pairing_algebra.py) -- a consistency check, not a primary-source pin.
      how_it_was_found: >-
        By the J6 (v) literature cross-check: JK20's published b(pm) for
        BP384r1 is 206 bits, but the proven split of the census cofactor (D1)
        gives a 243-bit largest prime. Every other JK20 value matched. The
        disagreement had exactly one explanation, and diagnostic D1c confirms
        it: the TRUE order's q - 1 has largest prime divisor of 206 bits,
        JK20's value.
      consequence_for_J5: >-
        brainpoolP384r1 must be removed from every escalate set as VOID (not as
        negative, not as inert) until a census row exists for q. That removes it
        from the contract's set B (leaving 8, with NIST-P-521 undetermined) and
        from the r-1 typed set C, which the plan's prior quotes as
        {NIST-P-256, secp256k1, BN254-r, BLS12-381-r, brainpoolP384r1}: that
        typed set contains a void row. The true-order values (diagnostic D1c)
        are below.

    diagnostic_D1_finish_the_bound_rows:
      status: REVIEW DIAGNOSTIC -- not a census row, replaces no census value, mints no RUN-*.
      question: >-
        Is "undetermined" on the E_bound rows a property of the integers or of
        the census's factoring budget (300 s deep cap; cofactors above 260 bits
        got no deep attempt at all -- the J2 (vi) question, whose ruling is the
        validator's)?
      method: >-
        The unfactored cofactors in factorizations.json, split with GMP-ECM
        7.0.5 (scratch unpack of the Ubuntu package, no system install) and PARI
        2.15.4 factor(); every factor checked by exact division; every final
        prime proven by PARI isprime (flag 0); the r-1 splits additionally
        re-checked by sympy.isprime (scripts/d1_vs_jk20.py). Lattices rebuilt with the census's own known factors plus the split;
        evaluated with mpmath at 110 digits (scripts/d1_analyze.py).
      results_r_minus_1:
        - {curve: Ed25519-L, cofactor_bits: 245, split_prime_bits: [108, 138], seconds: 89.5, backend: PARI factor, E1_r_minus_1: 0.2731503, d_bits: 115, census_bound_was: 0.4860230}
        - {curve: NIST-P-384, cofactor_bits: 371, split_prime_bits: [90, 281], seconds: 40.1, backend: GMP-ECM B1 250000, E1_r_minus_1: 0.3654341, d_bits: 104, census_bound_was: 0.4824413}
        - {curve: NIST-P-521, cofactor_bits: 471, split_prime_bits: [81, 391], seconds: 28.6, backend: GMP-ECM B1 50000, E1_r_minus_1: 0.3747789, d_bits: 131, census_bound_was: 0.4519832}
        - {curve: brainpoolP384r1 (FIELD-PRIME row, void), cofactor_bits: 305, split_prime_bits: [62, 243], seconds: 8.9, backend: PARI factor, E1_r_minus_1: 0.3170819, d_bits: 141, census_bound_was: 0.3971910}
      results_r_plus_1: >-
        NIST-P-521 r+1: GMP-ECM found a 75-bit prime in 0.3 s; the remaining 414-bit composite resisted 1800 s (B1 up to 1e6); with the new prime the known-divisor bound becomes E1 = E2 = 0.3971 (d 108 bits), <= 0.40, still a BOUND. NIST-P-384 r+1: no factor of the 302-bit cofactor in 1800 s; stays the census bound 0.3925. brainpoolP384r1 r+1 (FIELD-PRIME row, void): split 79 x 88 x 181 bits in 81 s, E1 0.2571, E2 0.3382.
      jk20_agreement: >-
        Largest prime of r - 1 after the split equals JK20's b(pm) for
        Ed25519-L (138), NIST-P-384 (281) and NIST-P-521 (391); it does not for
        brainpoolP384r1 (243 vs 206) -- the field-prime row.
      readings_on_valid_rows_with_D1:
        contract_reading_untyped: >-
          9 of 9 valid rows escalate (NIST-P-521 now via r-1 0.3748); brainpoolP384r1 excluded as void.
        r_minus_1_typed: >-
          7 of 9 valid rows escalate: NIST-P-256, secp256k1, BN254-r, BLS12-381-r, Ed25519-L (0.2732), NIST-P-384 (0.3654), NIST-P-521 (0.3748). Not escalating, exact: NIST-P-224 (0.4353), brainpoolP256r1 (0.4918).
        r_plus_1_typed_thm2: >-
          7 of 9 valid rows escalate: NIST-P-224 (0.3945), NIST-P-384 (<= 0.3925), NIST-P-521 (<= 0.3971, partial split), brainpoolP256r1 (0.3401), Ed25519-L (0.3570), BN254-r (0.3370), BLS12-381-r (0.3437). Not escalating, exact: NIST-P-256 (0.4188), secp256k1 (0.4111).
      reading: >-
        "Undetermined" was the census budget, not the integers: every r-1
        cofactor split in 9-90 s of standard tooling. Finished, every valid
        deployed row satisfies the contract's rule, and under r - 1 typing only
        NIST-P-224 (0.4353) and brainpoolP256r1 (0.4918) do not escalate. This
        strengthens J7's reading and changes no census value.

    diagnostic_D1c_brainpoolP384r1_true_order:
      status: REVIEW DIAGNOSTIC -- the census has no valid row for this curve; this is not one.
      result: >-
        q = RFC 5639 section 3.6 order (384 bits, PARI-proven prime, differs from p). q - 1 fully split in 84.8 s (largest prime 206 bits -- JK20's value): E1_{q-1} = 0.2685836 at d of 178 bits. q + 1 fully split in 112.1 s (largest prime 268 bits): E1 = 0.3495147, E2 = 0.3495147 at d of 116 bits. A correctly pinned brainpoolP384r1 row would satisfy the rule under every reading (contract, r-1 typed with one power, r+1 typed under Theorem 2). This is not a census row and fills no census gap.

    objections_surviving_own_attack:
      - id: RT-CA6B7C-J5-O1
        severity: major
        finding: >-
          Undisclosed narrowing of the frozen rule: driver.py 707-715 counts only
          quantity_kind == "E(r)". NIST-P-384, brainpoolP384r1 and Ed25519-L
          satisfy the rule on the text via explicit divisor witnesses; they are
          absent from stop_and_escalate_curves and the deviation is not among the
          execution report's protocol_deviations.
        self_attack: >-
          Tried: "E_bound, not E(r)" means bound rows are outside the rule. Fails:
          that clause restricts what a row reports as its value; the predicate is
          about the defined minimum, which each witness decides. Tried: the
          producer may have meant a conservative reading. Then it is a deviation
          that should have been disclosed; conservatism about a stop condition is
          still a change to it.
        repair: >-
          A correction record (never an edit of the run) stating the set under
          the contract's reading (B) and naming the producer's (A).
      - id: RT-CA6B7C-J5-O2
        severity: critical
        finding: >-
          The frozen cost expression is mis-typed on the r+1 branch. Cheon 2006
          Theorem 2 (read) needs Theta(d) consecutive powers and costs
          sqrt((r+1)/d) + d; the contract applies sqrt(m/d) + sqrt(d) to both
          branches. Three of the six listed rows are listed on an r+1 minimizer;
          their reported E and d answer no problem in the sources read.
        self_attack: >-
          Tried: a later paper may have reduced the r+1 second term to sqrt(d).
          Checked two later sources (Cheon-Kim-Song survey; Cheon-Kim ePrint
          2012/609): both keep a linear d term for d | p+1. This is "none found
          in the sources read", not "none exists"; the finding stands until a
          source with a sqrt(d) second term for d | p+1 is read. Tried: the
          contract is frozen, so its expression is by definition what the census
          measures. True -- the ARITHMETIC stands; what fails is reading those r+1
          numbers as Cheon's cost, which the contract itself does
          (cost_model_disclosure "model: Cheon-expression / DEC-20260802-204").
        repair: >-
          Evidence record reports E_{r-1} (Theorem 1 shape) and E_{r+1} in the
          Theorem 2 shape (E2) as separate typed columns with their input models;
          the frozen E1-on-r+1 numbers are labelled "frozen-expression arithmetic,
          no published algorithm attains it". A protocol_amendment is needed
          before any future census uses one expression for both branches.
      - id: RT-CA6B7C-J5-O3
        severity: major
        finding: >-
          The plan's header ("Nothing in this package measures, or could measure,
          an exponent below Cheon's"), coordinator_prior.what_the_escalate_is,
          DEC-20260922-19b645 what_E_r_is.the_floor ("The census therefore CANNOT
          express an exponent below known prior art"), the plan's rule_12_status
          basis (a) ("the quantity is bounded below by Cheon's own balanced
          exponent, so the census cannot express anything beyond known prior
          art") and the decision's review_tier_ruling.basis (1) ("the package can
          only re-express known prior art at specific integers") are false for
          the r+1 branch: E1 on r+1 can and does fall below the published r+1
          floor (~0.337 at 256 bits): brainpoolP256r1 0.2556, BN254-r r+1 0.25394.
        self_attack: >-
          Does this reopen the tier ruling? Only if someone asserts the r+1
          numbers as an attainable cost; nobody does, and this report asserts
          the opposite. So the basis sentence needs correcting, not the tier (see
          tripwires T2).
        repair: Supersede those sentences in the compose record; type the r+1 rows as in O2.

  # ---------------------------------------------------------------------------
  # J6 -- MODEL SCOPE AND LEAK PATHS
  # ---------------------------------------------------------------------------
  J6:
    verdict: breaks
    verdict_summary: >-
      Breaks narrowly, on labelling and typing, not on any ordinary-ECDLP,
      deployed-system, "weak curve" or "safe curve" sentence -- none was found in
      the package, the plan or the opening decision (every hit is a negation or
      rule text). The breaks: (1) the rho_baseline 0.5 column sits beside every
      E(r) with no auxiliary-input label, on a contract instruction to emit the
      table "at identical accounting"; under the no-supply null (PTM-3) that
      juxtaposition is the one reading that still delivers "below rho", so it is
      a leak path an evidence record must close; (2) no artifact states, per
      row, WHICH auxiliary input the minimizing branch presupposes -- and for the
      r+1 minimizers the frozen expression implies the wrong input and the wrong
      cost (J5 part iii); the plan and opening decision describe the r+1 values
      as Cheon's known exponent; (3) the summaries that restate the escalate set
      (stop_and_escalate_curves, raw-result e_table_summary, execution-report
      E_r_table_summary, stdout) drop the expected_structure_flag the rows carry.
      J6 (iv) holds: MODELLED_LOG_COFACTOR is labelled, recomputes, and is never
      mixed into E(r).

    part_i_leak_scan:
      method: >-
        scripts/leak_scan.py greps every file of RUN-AUXIN-fd1edc, the review
        plan and DEC-20260922-19b645 for vulnerab*, weak/safe curve, broke(n),
        attack*, ordinary ECDLP/input, rho/Pollard, security, operational/exploit/
        deployed system, "known ... exponent", r+1 and "identical accounting";
        every hit (out/leak_scan.json, embedded) was read and ruled by hand.
      run_package: >-
        One "vulnerab" hit, a negation (e_table.json note "... no vulnerability
        claim"). No ordinary-ECDLP, weak/safe-curve, attack or security sentence.
        rho_baseline 0.5 appears at e_table top level and in all 10 rows, and in
        controls_receipt.json, with no ASSUMES_AUXILIARY_INPUT label and no
        per-row statement of the auxiliary input. The note says values are
        MODELLED; it does not say they are conditional on supplied powers.
      plan_and_decision: >-
        All ordinary-ECDLP / vulnerability / weak-safe-curve hits are negations,
        rule text or tripwire definitions. The typing errors are: plan lines 16-24
        ("Cheon's KNOWN auxiliary-input cost expression ... smallest value that
        expression can ever produce is the known balanced r^{1/4} exponent ...
        Nothing in this package measures, or could measure, an exponent below
        Cheon's"), plan coordinator_prior (brainpoolP256r1 "about a factor 1.35
        above" the Cheon floor -- its value is an r+1 value, not a Cheon Theorem 1
        value), plan rule_12_status basis (a), DEC-20260922-19b645
        what_E_r_is.the_floor and review_tier_ruling.basis (1). The decision's plain_answer (P-256,
        secp256k1, BLS12-381-r, all r-1 minimizers, conditioned on [x^d]P for
        that d) is correct as written.
      ruling_on_rho_column: >-
        A reporting defect an evidence record MUST repair; not a validity defect
        of the run and not a tripwire. The column is contract-mandated
        (specification Stage 1 step 7 "beside the rho baseline 0.5 at identical
        accounting"; goal completion criterion 1 "against the sqrt(r) rho
        baseline at identical accounting"). It is not identical accounting: rho
        0.5 is the cost of the ordinary problem from P and [x]P; E(r) is the
        cost exponent of a different problem whose input includes [x^d]P (r-1)
        or Theta(d) consecutive powers (r+1). Repair, in the evidence record and
        never by editing the run: (a) rename or annotate the two columns as
        rho_ordinary_input_0.5 and E_ASSUMES_AUXILIARY_INPUT; (b) state per row
        the branch, the input model and the bits of d; (c) cite
        DEC-20260802-204 B032-C7/C8 beside any comparison of the two; (d) drop
        the phrase "identical accounting" or qualify it as "identical
        group-operation units, different problems".

