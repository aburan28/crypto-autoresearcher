  # ---------------------------------------------------------------------------
  # J7 -- PROVES TOO MUCH
  # ---------------------------------------------------------------------------
  J7:
    verdict: breaks
    outcome_label: J7_generic
    verdict_summary: >-
      The escalate proves too much. Under the contract's own reading it fires on
      30 of 32 random 256-bit primes (93.8 %, exact 95 % interval 79.2-99.2 %);
      inertness occurred on 0 of 32 primes and on 0 of the 59 fully factored
      random branches; and random primes sit as close to the analytic floor as
      NIST-P-256 does (closest random row 3.0e-7 above the floor versus
      P-256's 3.3e-7). "Six deployed curves escalated" is a property of integers
      near 2^256, not of how those curves were chosen. The two other objects
      pass: the evaluator returns an inert answer on both branches of a prime
      built to be inert (PTM-2 holds), and no ASSERTED sentence survives the
      removal of the auxiliary input (PTM-3 holds, with two refused READINGS
      routed to repair). No anomaly is proposed and T3 does not fire: the
      deployed rate is not above the random rate.

    PTM_1_random_primes_of_the_same_size:
      status: PERFORMED (review computation; not a census row; no RUN-*)
      protocol_judgement: >-
        Judged NOT to need its own protocol: it re-applies the frozen statement
        and the frozen thresholds to a seeded sample fixed in advance by the plan
        and card (size 32, seed, cap), measures nothing new about any deployed
        order, and cannot move any census value.
      generator: >-
        Python 3.11.15 stdlib random.Random(2026092201) (MT19937);
        U_i = 2^255 + getrandbits(255), uniform on [2^255, 2^256);
        r_i = sympy.nextprime(U_i); redraw if r_i >= 2^256 (0 redraws). All 32
        r_i are 256-bit. Declared bias: next_prime weights a prime by its
        preceding gap; this is the object the card specifies.
      factoring: >-
        Like-for-like with the producer's effective procedure at 256 bits
        (factor_path_a.factor_integer): stage 1 sympy.factorint(m,
        limit=10**7), keep sympy-accepted primes; if the remainder is composite
        and <= 260 bits, stage 2 full sympy.factorint. sympy 1.14.0, the
        producer's version. HARD 300 s wall-clock cap per integer (card; the
        producer's effective per-integer budget was 360 s, so this cap can only
        add bound rows, never an escalation). 3 integers in parallel on an idle
        4-core VM; 1460 s total. 59 of 64 integers complete; 5 kept a composite
        cofactor at the cap (r+1 of primes 9, 15, 16; r-1 of primes 20, 29) --
        the same failure class as the census's Ed25519-L r-1.
      evaluation: >-
        This reviewer's mpmath evaluator (60 digits in this script) on every
        known divisor; classification against the frozen ceiling: a known-divisor
        value <= 0.40 ESCALATES (explicit witness); a complete lattice with
        minimum > 0.40 is NOT escalating; otherwise UNDETERMINED, never inert.
        Cross-check: the producer's e_eval.evaluate_E, imported read-only, on
        the same 64 factor lists agrees to 7.8e-62.
      fraction_escalating:
        contract_reading_untyped: {escalate: 30, not_escalating: 2, undetermined: 0, n: 32, fraction: 0.9375, clopper_pearson_95: [0.7919, 0.9923]}
        r_minus_1_typed: {escalate: 24, not_escalating: 7, undetermined: 1, n: 32, fraction_range: [0.750, 0.781], clopper_pearson_95_at_24: [0.5660, 0.8854], clopper_pearson_95_at_25: [0.6003, 0.9072]}
        r_plus_1_typed_cheon_thm2: {escalate: 23, not_escalating: 7, undetermined: 2, n: 32, fraction_range: [0.719, 0.781], clopper_pearson_95_at_23: [0.5325, 0.8625], clopper_pearson_95_at_25: [0.6003, 0.9072]}
        r_plus_1_frozen_expression: {escalate: 23, not_escalating: 7, undetermined: 2, n: 32, note: same membership as the Theorem 2 typing}
        typed_union: {escalate: 30, not_escalating: 2, undetermined: 0, n: 32}
      fraction_at_or_above_0_49:
        rows_inert_both_branches: {inert: 0, n: 32, clopper_pearson_95: [0.0, 0.1089]}
        r_minus_1_branch_inert: {inert: 0, n: 32}
        complete_branches_individually_at_or_above_0_49: '0 of 59'
      distribution_of_E_minus_analytic_floor:
        definition: >-
          E(r) - (1 + log2(m)/4)/log2(r) for the attaining branch m of each
