      digests_not_declared_note: >-
        Listed under a key the checker does not read (it reads only
        protected_sha256), so the exclusion is visible and reversible rather
        than silent. Every excluded literal is an integer of two or three
        decimal digits.
      measurement: >-
        Reported by the top-level session, which ran the checker against
        origin/main's last 500 reachable commit messages BEFORE any AUXIN commit
        of this round existed: with all 16 digests declared, 30 problems, every
        one a false positive from three short integers -- 19 hits on
        "bpP256r1 r-1 per_divisor_count", 8 on "bpP256r1 r-1 largest
        div<=sqrt r", 3 on "P-256 r+1 per_divisor_count"; 0 on "bpP256r1 r+1
        per_divisor_count"; 0 on all 12 long literals. Not re-run by the
        Coordinator, which has no shell.
      ruling: >-
        EXCLUDE ALL FOUR short integers from protected_sha256; KEEP the 12 long
        literals. Four reasons. (1) A check that is red on unrelated history can
        never distinguish a leak from noise, so declaring them would not add
        protection -- it would remove the check's ability to protect the 12
        values that matter. (2) The checker itself states its protection is
        obfuscation against a reader, not secrecy, and brute-forceable over
        small spaces; a two-digit space is the degenerate case, so a digest of
        one protects nothing even when it does not collide. (3) The fourth
        (three digits) has 0 hits today but is excluded with the others: it is
        one of the most common numerals in this repository's vocabulary, so the
        first later commit that mentions it in any context would turn the check
        red for a non-leak, and a rule that sorts literals by today's hit count
        would have to be revisited after every commit. The cut is by length, not
        by current luck. (4) None of the four is load-bearing for J8's
        independence: each is a CONSEQUENCE of the complete factorization of
        r - 1 or r + 1, and the J8 agreement test compares the full
        factorizations (exact multisets of primes), the per-branch minima to 25
        significant digits and the minimizing divisors. A leaked two-digit
        count or divisor cannot make an independent factorization of a 256-bit
        integer agree with the producer's.
      what_still_protects_the_excluded_values:
        - >-
          File-level blindness: every artifact that states them (the run
          directory, the review plan, DEC-20260922-19b645, the prior-round
          reviews, the goal head) is in the plan's blind_rederivation.blind_from,
          and the re-deriver's card restricts its read scope to
          blind-inputs.yaml, the frozen contract and two primary-source text
          files.
        - >-
          The standing obligation in the plan and on every card: no card,
          queue note, bus message, receipt, PR text or commit message of this
          round quotes any census number or the escalated-curve list before J8
          returns. The top-level session writes the commit messages and PR text
          and has undertaken to keep them clean.
        - >-
          The re-deriver's instruction not to run git log / show / diff against
          commits touching the blind_from paths.
      residual_risk: >-
        STATED PLAINLY. If one of the four short values did leak into a commit
        message, --blind-history would not detect it, and the only safeguards are
        the three above. The consequence is bounded: the brainpoolP256r1 r - 1
        branch minimizer is the one quantity among the four that bears on a
        per-branch minimum J8 is asked to report, so if the composing
        Coordinator finds any reason to suspect a leak, the J8 agreement on that
        branch is read as agreement on the FACTORIZATION ONLY and its
        minimizer-level agreement is discounted. Recorded here so the discount is
        pre-declared rather than chosen after seeing J8.
      revisit_condition: >-
        If the checker gains context-aware matching (for example, protecting a
        literal only when adjacent to a curve or branch label), re-declare the
        four in an addendum. Never re-add them unchanged to make the check look
        stronger.
