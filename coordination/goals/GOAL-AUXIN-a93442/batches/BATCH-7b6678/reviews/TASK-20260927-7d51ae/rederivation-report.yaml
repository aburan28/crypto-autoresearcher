      computed: {status: BOUND, W_size: 12, W: "{e, e*3w : e | 4d}", witness: "27897163901963686775744531 (= d, unique)", upper_exponent: "0.336926251418", lower_exponent: "0.336926251418", upper_minus_lower: "2.04e-51", upper_log2T_bits: "86.1133", lower_log2T_bits: "86.1133", depth: "1 - O(1e-28)", bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR, boundary_flag: false}
      rule_path: "corrected bin_by_status BOUND: boundary_flag false and s >= 3/4 + tau, so bin and bin_at_least are both NEAR_FLOOR"

  # ---------------------------------------------------------------------------
  # Q4 bin at the boundary 3/4 + tau (tau = 10^-45, absolute on s)
  # ---------------------------------------------------------------------------
  Q4_boundary:
    arithmetic: >-
      Decimal at exactly 150 significant digits (the text's floor) and at 200,
      giving identical bins and flags. The neighbours are 3/4 + tau +/- 10^-P.
    at:
      value: "0.750000000000000000000000000000000000000000001"
      boundary_flag: true
      flag_clause: "held definitions.bins: |s - 3/4| <= tau (equality holds)"
      EXACT_bin: INTERMEDIATE
      EXACT_clause: "BINS-EXACT rule (i): flag precedes (ii); 's = 3/4 + tau exactly is flagged and gives INTERMEDIATE'"
      BOUND: {bin: UNDETERMINED, bin_at_least: INTERMEDIATE, clause: "corrected bin_by_status: flag true, so 'Otherwise' branch applies; bin_at_least is the EXACT bin of s"}
    above:
      value: "3/4 + 10^-45 + 10^-150 (P = 150)"
      boundary_flag: false
      EXACT_bin: NEAR_FLOOR
      EXACT_clause: "(ii) s >= 3/4 + tau with flag false"
      BOUND: {bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR, clause: "flag false and s >= 3/4 + tau"}
    below:
      value: "3/4 + 10^-45 - 10^-150 (P = 150)"
      boundary_flag: true
      EXACT_bin: INTERMEDIATE
      EXACT_clause: "(i) flag"
      BOUND: {bin: UNDETERMINED, bin_at_least: INTERMEDIATE, clause: "Otherwise branch"}
    note: >-
      In the held text taken alone, "NEAR_FLOOR if s >= 3/4 + tau" is read
      before the flag sentence, so s = 3/4 + tau could get two bins. The
      corrective precedence removes that: every value receives exactly one bin.

