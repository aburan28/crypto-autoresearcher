  # ---------------------------------------------------------------------------
  # Q2 field-prime set and confounder outcomes
  # ---------------------------------------------------------------------------
  Q2_field_prime_set:
    a_membership:
      rule_for_every_member: >-
        FP-DEF replacement: "the set of every field prime extracted in Stage P
        (by the row's field_prime_label or field_prime_locator) for any row,
        whether or not that row pinned, and NOTHING ELSE."
      members_by_row:
        - {row: NIST-P-224, extracted_by: "PR-SP800 block 3.2.1.2., label p"}
        - {row: NIST-P-256, extracted_by: "PR-SP800 block 3.2.1.3., label p"}
        - {row: NIST-P-384, extracted_by: "PR-SP800 block 3.2.1.4., label p"}
        - {row: NIST-P-521, extracted_by: "PR-SP800 block 3.2.1.5., label p"}
        - {row: secp256k1, extracted_by: "PR-SEC2 curve secp256k1, label p"}
        - {row: brainpoolP256r1, extracted_by: "PR-RFC5639, label p"}
        - {row: brainpoolP384r1, extracted_by: "PR-RFC5639, label p"}
        - {row: Ed25519-L, extracted_by: "PR-SP800 block 3.2.3.1., label p"}
        - {row: BN254-r, extracted_by: "field_prime_locator PR-EIP197 p (file at K = 9e393a79d9937f579acbdcb234a67869259d5a96)"}
        - {row: BLS12-381-r, extracted_by: "PR-IETF-DRAFT block (BLS12-381), label p"}
      conditionality: >-
        A row whose p extraction returns locator_failure contributes no member.
        The numeric values are Stage P observations from sources outside the
        whitelist and are not stated here (BL-3). CF-1 and CF-2 are NOT members
        by definition; they coincide with the Ed25519-L and NIST-P-256 members
        exactly when the corresponding extraction_cross_check holds.
    b_confounder_outcomes:
      stage: >-
        Stage P, step P5 (after P3 extraction and P4 PDF checks). In the
        corrective order (C-FIELD_gates_added item 2), both extraction
        cross-checks are evaluated first, then the reason-list gates of every
        case. C-FIELD-MUTATION follows C-FIELD.
      CF-1:
        outcome: REJECTED
        reasons: [field_prime, hasse]
        clause_values: "field_prime: equals the extracted Ed25519-L p (given the cross-check); not_prime: no (proved prime); hasse: |p+1-8p| = 405272312330606683982498447530407677486444946329741974138101544027695953739642 > 2*isqrt(p)+2 = 481231938336009023090067544955250113856, fires"
        conditional_on: extraction_cross_check holds (else outcome I_TEXT at P5, before any reason-list gate; see Q0-4); extracted h = 8 (any h >= 2 gives the same list)
      CF-2:
        outcome: REJECTED
        reasons: [field_prime]
        clause_values: "field_prime: equals the extracted NIST-P-256 p (given the cross-check); not_prime: no; hasse: |p+1-p| = 1 <= 680564733762648764426319935326885249026, does not fire"
        conditional_on: extraction_cross_check holds (else I_TEXT at P5)
      cases_extracted:
        outcome: each CF-X-<row> REJECTED with reasons exactly [field_prime], at P5
        why: >-
          The value is the extracted field prime, a member of FP by FP-DEF.
          It is proved prime at run time (D7), so not_prime does not fire. It is
          presented with no cofactor, so hasse does not apply.
        conditional_on: each extracted field prime's certificate proving it prime (a failed proof is an infrastructure stop, not a reason)
    c_mutation_M-FP:
      definition: FP' = {CF-1, CF-2} only; every declared control re-run
      per_control:
        - {control: "C-FIELD CF-1", result: "pass; [field_prime, hasse] (CF-1 is in FP')"}
        - {control: "C-FIELD CF-2", result: "pass; [field_prime] (CF-2 is in FP')"}
        - {control: "C-FIELD extraction cross-checks", result: "unaffected (FP not an input)"}
        - {control: "C-FIELD cases_extracted CF-X-Ed25519-L, CF-X-NIST-P-256", result: "pass; [field_prime] (their values equal CF-1, CF-2 when the cross-checks hold)"}
        - {control: "C-FIELD cases_extracted for NIST-P-224, NIST-P-384, NIST-P-521, secp256k1, brainpoolP256r1, brainpoolP384r1, BN254-r, BLS12-381-r (each that is extracted)", result: "FAIL; admitted with an empty reason list; outcome N2 at P5, nothing factored", conditional_on: "Q0-8 premise (field primes distinct from CF-1 and CF-2; provenance recalled)"}
        - {control: C-FIELD-MUTATION, result: "pass; CF-1 [hasse], CF-2 [] (clause (1) disabled, so FP is not read)"}
        - {control: "C-PLANT-M, C-PLANT-P, C-INERT, C-PLANT-PL", result: "pass; not rejected (no computed integer equals CF-1 or CF-2; FP' is a subset of the corrected FP, so M-FP cannot add a rejection)"}
        - {control: C-BOUND BND-1..3, result: "pass; unaffected (FP not an input)"}
        - {control: "C-PRODUCT, C-RECOMPUTE", result: "pass; unaffected"}
        - {control: C-ORDER, result: "unaffected (run observation)"}
      net: >-
        M-FP fails exactly the C-FIELD cases_extracted gate, on every extracted
        row other than Ed25519-L and NIST-P-256, giving outcome N2. Every
        other declared control is unaffected.

  # ---------------------------------------------------------------------------
  # Q3 bound-evaluator outputs
  # ---------------------------------------------------------------------------
  Q3_bound_evaluator:
    method: >-
      W from the recorded-parts rule (every e | F times every subset product of
      the parts). The witness is the minimiser of e_b over W under the relative
      10^-100 tie rule (smallest tied member). Bounds are e(witness) and
      F_b(r). Depth, flag and bin follow BINS-EXACT and the corrected
      bin_by_status. The mpmath and decimal paths (200 digits) agree within
      10^-50 and exactly on every categorical field.
    a_declared_states:
      BND-1:
        state: "C-PLANT-M minus, m = r_M - 1; F = 2*u (2^1, u^1); parts [D]"
        computed: {status: BOUND, W_size: 8, witness: "294693174213430238337283675675637791202 (= 2u; tied exactly with D; smaller reported)", upper_exponent: "0.253912593253", lower_exponent: "0.253912593253", upper_minus_lower: "7.54e-38", upper_log2T_bits: "64.8962", lower_log2T_bits: "64.8962", depth: "1 - O(1e-28)", bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR, boundary_flag: false}
        consistency: "upper bound equals the C-PLANT-M EXACT minus exponent; |difference| = 0 (within 1e-50)"
        text_stated: "status BOUND; W = {e, e*D : e | 2u}; witness = smaller of D and 2u; upper = e_minus(witness); lower = F_minus(r_M); bin NEAR_FLOOR; boundary_flag false; bin_at_least not stated"
        agrees_with_text: true
      BND-2:
        state: "C-PLANT-M minus; F = 2 (2^1); parts [d1*d2*u]"
        computed: {status: BOUND, W: "{1, 2, m/2, m}", witness: "2 (tied with m/2)", upper_exponent: "0.498043703373", lower_exponent: "0.253912593253", upper_log2T_bits: "127.2925", lower_log2T_bits: "64.8962", depth: "0.00794960072", bin: UNDETERMINED, bin_at_least: NEAR_CEILING, boundary_flag: false}
        text_stated: "status BOUND; W = {1, 2, m/2, m}; witness 2; upper e_minus(2); lower F_minus(r_M); bin UNDETERMINED, bin_at_least NEAR_CEILING, boundary_flag false; depth < 1/100"
        agrees_with_text: true
      BND-3:
        state: "C-PLANT-P plus, m = r_P + 1; F = 2 (2^1); parts [2d, 3w]"
        computed: {status: BOUND, W: "{1, 2, 2d, 4d, 3w, 6w, 6dw, 12dw} (matches the text's list)", witness: "55794327803927373551489062 (= 2d, unique)", upper_exponent: "0.337656305333", lower_exponent: "0.336926251418", upper_minus_lower: "7.3005e-4", upper_log2T_bits: "86.2999", lower_log2T_bits: "86.1133", depth: "0.995523167149", bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR, boundary_flag: false}
        contrast_single_cofactor: "W = {1, 2, 6dw, 12dw} gives witness 2, bin UNDETERMINED (reproduces the text's stated contrast)"
        text_stated: "status BOUND; W as listed; witness 2d; upper e_plus(2d); lower F_plus(r_P); bin NEAR_FLOOR; boundary_flag false; depth > 0.99; bin_at_least not stated"
        agrees_with_text: true
      coverage_note: >-
