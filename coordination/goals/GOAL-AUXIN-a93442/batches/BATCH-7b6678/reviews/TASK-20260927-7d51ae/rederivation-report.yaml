        does not state it for BND-1 or BND-3. The corrected bin_by_status gives
        NEAR_FLOOR for both. This is a coverage observation, not a choice point.
    b_own_state:
      id: OWN-1
      state: >-
        Row C-PLANT-P, plus branch, m = r_P + 1 = 2^2*3*d*w. Declared F = 4*d with
