  Q0_undetermined_choices:
    summary: >-
      Two genuine choice points in the governing text (Q0-3 and Q0-4 below),
      plus three references to files outside the whitelist. None of them
      changes any integer, status, witness, bin, flag or gate verdict I
      computed from the text. Q0-4 can change a Stage P outcome (I_TEXT versus
      proceed), depending on source bytes I was not permitted to read. There
      are also two reporting-unit choices that come from the task statement,
      not from the text.
    items:
      - id: Q0-1
        kind: governing-file reference (third file)
        text: '"Deployed-row ids, roles and order are READ FROM specification.yaml frozen_curve_list (governing layer v1)." (corrective.pins.deployed_rows_roles_and_order); "A row whose role in specification.yaml frozen_curve_list is deployed or deployed_pairing." (definitions.deployed_row)'
        action: not opened (outside the whitelist)
        readings: [n/a; a reference, not an alternative]
        dependent_quantities: >-
          None of Q1 to Q5. FP is defined over "any row", so it does not depend on
          roles. The roles only decide which rows "every deployed row" of
          confounder_check.applies_to covers.
      - id: Q0-2
        kind: primary-source references (third files)
        text: 'change.D1_pins.rows[*].source and field_prime_label / field_prime_locator (inputs/SAFECURVES-20260825/specs/*.txt, EIP-197 at commit K, draft-irtf-cfrg-pairing-friendly-curves-14.txt); CF-1 "cofactor h printed, value 8 per the source"'
        action: not opened (outside the whitelist)
        dependent_quantities: >-
          Q2(a) numeric FP members; Q2(b)/(c) integer values of every
          cases_extracted case; the extracted Ed25519-L h used by the CF-1 hasse
          clause; the two C-FIELD extraction_cross_check verdicts (Q5). These
          are reported by rule and conditionally, never as numbers. For CF-1
          the reason list is the same for every extracted h >= 2
          (|p+1-hp| = (h-1)p - 1 exceeds the bound), and it loses hasse only if h = 1.
      - id: Q0-3
        kind: scope of "construction-control integer"
        text: 'applies_to: "... every construction-control integer; ..." versus stages[C_controls]: "run the confounder check on each constructed r"'
        readings:
          - R1 only each control's r (Stage C wording)
          - R2 every integer the acceptance rule names (d1, d2, u, v, d, w, q, f1..f4, r)
          - R3 also the composite m_b = r +/- 1. This reading is excluded by the text itself, because scope_on_controls_and_null_arm fixes the expected outcome for every construction control as NOT REJECTED while clause (2) applies, and R3 would contradict that.
        dependent_quantities: >-
          Q2(c) and Q5 "construction control not rejected". Under R1 and R2 no
          computed integer equals CF-1 or CF-2 (checked). Equality with the
          other extracted field primes cannot be checked from the whitelist.
          The integers of comparable size (the 256-bit r of C-PLANT-M,
          C-PLANT-P and C-INERT, which all begin 0xc000000000; v and C-INERT w
          at 253 bits; the 255-bit q) are therefore compared by run
          observation only (I_CONTROL_COLLISION).
        materiality: >-
          Immaterial to every value computed here. Under R2 but not R1 it is
          material only if a named non-r integer equals an extracted field
          prime.
      - id: Q0-4
        kind: representation qualifier in a gate
        text: 'extraction_cross_check: "CF-1 must equal the Ed25519-L field prime p extracted in P3 by PR-SP800 (hex form)." (same for CF-2 / NIST-P-256)'
        readings:
          - (a) descriptive. The integer extracted by PR-SP800 is compared, whichever representation the rule used.
          - (b) a requirement. If PR-SP800 returned p from its decimal form (hex form absent or contaminated), the cross-check fails, giving outcome I_TEXT.
        dependent_quantities: >-
          Q2(b) outcome and stage (I_TEXT at P5 versus rejection with the
          expected reasons), and the Q5 C-FIELD extraction_cross_check verdicts.
        materiality: >-
          Material only if PR-SP800 reads either row's p from the decimal form.
          That is a property of sp800-186.txt, which was not read here, so
