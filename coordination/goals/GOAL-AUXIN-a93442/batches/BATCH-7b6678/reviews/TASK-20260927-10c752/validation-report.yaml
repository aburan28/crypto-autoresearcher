      ii: >-
        performed. Through cypari2 on minimum, latest and 3.10, a deliberately slow alarm(A, factor(n))
        raises cysignals.signals.AlarmInterrupt, whose MRO passes through KeyboardInterrupt, not
        Exception. That is recognition case (i). An except Exception handler does not catch it, as the
        F2-RECOG text warns. A completing call returns t_MAT (case iii), and the instance stays usable
        after a timeout. In gp 2.17.3 (Homebrew), alarm returns t_ERROR with errname e_ALARM (case ii).
        Recognition is determinate, and item 3 passes on the declared builds.
      iii: >-
        performed. Every build and gp probe the producer reports that I also ran reproduces, including
        the SIGSEGV of the 1.12.6 pairing. The one build the producer did not run is CPython 3.10.20
        with the minimum pairing; it passes items 1 and 3. cypari2 2.2.4 cannot be installed on
        Python 3.10, since it requires 3.12 or later; admission decides that case. I did not rerun the
        producer's cypari2 2.2.0 and 2.2.3 venvs or its PARI 2.15.4 and 2.17.4 source builds.
      iv: >-
        performed. The README attribution is withdrawn (span ECM-PROV). The PARI stack allocation is
        declared, and the probe measured stack 2^27 with ceiling 2^32. On sys.path: under -I, on
        CPython 3.10 and 3.12, the script directory is NOT on sys.path and a sibling import fails; after
        run.py's declared sys.path insertion it succeeds. So the declared insertion is necessary and
        sufficient. The exec() prohibition is declared. An environment inside the repository fails
        admission by the stated rule; mine sit outside it.
      v: >-
        performed. I produced a PARI primecert ECPP certificate for a 253-bit prime, with a Pratt
        certificate at the terminal step. A stdlib-only verifier I wrote (json, math and sys, run on an
        interpreter without cypari2) accepts it and rejects the tampered certificate (N + 2). The git
        byte-identity checks pass, as listed under artifact_checks.
    NJ5:
      i: performed. The controls were built and recorded with build time before any BATCH-2fc87b value was read.
      ii: performed. The C-BOUND states were evaluated, a NEAR_FLOOR BOUND state was constructed, and bin_at_least is defined in both.
      iii: performed. The rule at 3/4 + tau is determinate and consistent with the flag rule.
      iv: >-
        performed, and this is where NJ5 BREAKS. I listed every numeric comparison in the governing held
        fields and compared it with the held inventory plus corrective.threshold_inventory_added.
        Omitted cut-offs:
        (a) change.D6_factoring.timeouts, which is held text outside span F2-RECOG: "if floor(R) < 1
        the call is not made and the part stays unfactored". This 1-second cut-off decides whether an F2
        call is issued, and it reads R, the integer's remaining factoring budget.
        (b) change.D1_pins.parse_rules.PR-SP800: the label-line pattern ^[A-Za-z]{1,4}: bounds label
        length at 1 to 4. The analogous PR-SEC2 minimum of 4 characters is in the added list; this one
        is not.
        Not counted, as borderline: the ECM self-test inputs (-c 25, B1 2000), the certificate self-test
        primes, and the v1-layer budget constants (memory, runs, workers), which are machine protection
        rather than decision cut-offs.
        The other half of RI-5 holds: specification.yaml frozen_curve_list and change.D1_pins.rows list
        the same ten ids in the same order, and the source of roles and order is stated
        (corrective.pins.deployed_rows_roles_and_order).
      v: performed. Carried recipes agree 21 of 21 and all candidate counts are equal. No K-regression.
