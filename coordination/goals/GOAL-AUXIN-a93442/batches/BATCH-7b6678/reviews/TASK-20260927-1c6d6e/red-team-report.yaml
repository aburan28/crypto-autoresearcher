red_team_report:
  id: RT-20260927-730157
  task_id: TASK-20260927-1c6d6e
  review: REVIEW-AUXIN-20260927-7b6678
  goal: GOAL-AUXIN-a93442
  claim_under_review: >-
    The corrective amendment AMD-20260927-narrow.yaml, read together with
    AMD-20260926-typed.yaml (incorporated by sha256 3c57978c...aad6) and v1
    specification.yaml, forms one governing text. That text fixes DF-1 to DF-6
    and RI-1 to RI-9 without changing any held field's meaning except through
    a declared supersession. This report covers only joints NJ3 (scope and
    hypothesis mapping) and NJ4 (governing text).
  snapshot_read: 1bc26a1f84fdd9dfc8a011119c879570e0ed28de
  producer_bytes: >-
    Every producer file was read from the snapshot commit. Each file's sha256
    matches archives/TASK-20260927-f24bb2/snapshot-receipt.json and the working
    tree; computations.json lists the digests under
    producer_bytes_verification.

  verdicts_by_joint:
    NJ3: holds
    NJ4: breaks

  objections:
    - id: O-NJ4-1
      joint: NJ4
      severity: high (this is the break)
      title: Two outcomes for the same run at C-BOUND BND-1 and BND-3, from a corrective clause that changes the meaning of held N4 without superseding it
      evidence: >-
        Held C-BOUND gate 1 (typed controls[C-BOUND].gates[0]) compares
        "bin, bin_at_least (where stated) and boundary_flag". The held expected
        blocks of BND-1 and BND-3 state bin NEAR_FLOOR with boundary_flag false
        and give no bin_at_least. BND-2 does state one. Under the typed text a
        NEAR_FLOOR BOUND carried no bin_at_least. corrective.bin_by_status
        (DF-6) now fixes bin_at_least = NEAR_FLOOR in that case.
        The held N4_BOUND_EVALUATOR_FALSIFIED condition reads "bin_at_least ...
        other than the value this text fixes". By
        incorporates.reading_of_self_references, "this text" is the combined
        governing text, so N4 now tests bin_at_least on BND-1 and BND-3. Gate 1
        still does not. Consider an evaluator that is correct under the typed
        text and reports bin_at_least null (or any value other than NEAR_FLOOR)
        on those two states. It passes every C-BOUND gate, so the S_VALID_TABLE
        condition "every gate of ... C-BOUND held" is met. It also meets the N4
        condition. The typed success_criterion sets no order among outcomes, so
        the text assigns this run two outcomes. No gate tests the DF-6 addition
        on a NEAR_FLOOR BOUND state.
      design_report_claim_contradicted: >-
        design-report held_clauses_that_read_corrective_fields reports the
        C-BOUND gates as "one_meaning: yes: every status and bin now has one
        bin_at_least". That reading drops the held "(where stated)" qualifier.
      plan_break_artifact: A corrective clause that changes the meaning of a held clause without superseding it.
      cheapest_repair: >-
        Any one of the following closes it. (a) A span rule on the C-BOUND gate
        1 text that removes "(where stated)". Every state then has a fixed
        bin_at_least under corrective.bin_by_status. (b) Span rules adding
        "bin_at_least NEAR_FLOOR" to the BND-1 and BND-3 expected blocks.
        (c) A corrective clause saying N4 fires only on a C-BOUND gate failure.
        (a) or (b) also puts the DF-6 fix under test. (c) alone leaves it
        untested.
      composition_note: >-
        This defect comes from the narrow construction's choice not to edit
        construction-control fields (the R-D4 concern). It is a single span-level
        repair, not evidence that the three-layer structure itself fails. Whether
        it triggers the option-2 switch (K-layer) is the Coordinator's call; this
        reviewer's reading is that one targeted span repair suffices.

    - id: O-NJ4-2
      joint: NJ4
      severity: moderate
      title: The precedence prose "No field is decided by reading two layers" overstates the design at path level
      evidence: >-
        The governing_text_table is total, and each leaf has exactly one layer
        (842 rows parsed: v1 112, refused-typed 540, corrective 190; no leaf
        covered twice). However, 12 corrective adds_to additions sit under held
        paths, and no held table row points to its addition:
        rows[BN254-r], rows[BLS12-381-r], retrieval_rule, null_arm.bit_classes,
        pdf_digit_check, definitions.deployed_row, controls[C-FIELD],
        controls[C-FIELD].gates, admission_gate (items 9 and 10; item 9 extends
        the item (6) audit), D8 import_rule, invalidation_rules and
        threshold_inventory.
        Some of these add causes to held outcomes. The RI-5 row-list mismatch
        adds an I_TEXT cause, and the BLS/EIP digest mismatch adds an I_INFRA
        cause. A reader of the held I_TEXT or I_INFRA condition, or of
        stopping_rules, therefore has to read two layers. Each addition names
        its own outcome, so the union is determinate, and this is not a second
        break.
      requested_change: >-
        Restate the rule as one layer per leaf, with path-level additions read
        as a union, and cross-reference each held path to its addition. As a
        low-severity aside, the design report states 843 table rows and 191
        corrective rows, but 842 and 190 parse.

    - id: O-NJ4-3
      joint: NJ4
      severity: low-to-moderate
      title: Held conventions Q0-11 is incorporated without being reconciled with the three-layer precedence
      evidence: >-
        Q0-11 is incorporated unchanged. Read through reading_of_self_references
        ("this file" = typed), it says references give provenance only, that
        "this file's text governs", and that no rule is taken from a referenced
        record. The narrow file also relies on v1 as a governing layer:
        deployed_rows_roles_and_order is "READ FROM specification.yaml", and the
        FC6 mapping reads v1 tail_checks. The only coherent reading is that v1
        governs its unsuperseded fields under the table's authority and Q0-11 is
        confined to typed's own cites, but the text never states that.
      requested_change: >-
        Add a one-sentence reading that confines Q0-11 to references made inside
        typed text. Separately, envelope non-incorporation drops the typed cite
        that carried "the .pdf is the authority over a derived .txt". Its
        operational content survives in pdf_digit_check (a FAIL unpins the row),
        and under Q0-11 the cite never governed anyway, so nothing is lost. This
        is recorded only so the drop is visible.

    - id: O-NJ3-1
      joint: NJ3
      severity: moderate
      title: RI-1 FC6 row misglosses v1 tail_checks item 1
      evidence: >-
        The FC6 mapping quotes v1 tail_checks item 1, "a missing branch voids
        the row", verbatim, but glosses it as "makes each omitted branch VOID".
        The design report says "voids the branch". The quote and the gloss
        disagree about the surviving branch: under v1 the whole row is voided;
        under the gloss the other branch still reports. The mapped outcome is
        S_PARTIAL_TABLE either way, and the table makes v1 govern, so the
        outcome is determinate. The reported quantity for the surviving branch
        is not.
      requested_change: >-
        Issue an erratum that either follows v1 (the row is voided) or
        supersedes v1 tail_checks item 1 by a span rule.

    - id: O-NJ3-2
      joint: NJ3
      severity: low
      title: DF-5 held stratification parenthetical is true on r-1 but close to vacuous on r+1
      evidence: >-
        Corrective item 6 predicts no category and treats nothing as
        family-caused. The kept parenthetical "whose family polynomials force
        divisors" is read as fixing stratum membership only. That is acceptable
        and matches DF-5. The parenthetical is mathematically true for the r-1
        branch and nearly vacuous for r+1. H still carries the replaced
        sentence, and correcting it is declared a later card.
      requested_change: None beyond the declared later card.

    - id: O-NJ3-3
      joint: NJ3
      severity: low
      title: RI-8 leaves the three reporting fields undefined for rejected deployed rows and rejected null-arm samples
      evidence: >-
        corrective.bin_by_status requires three fields "for every branch of
        every deployed row ... and null-arm sample". A row or sample rejected by
        the confounder check has no status (it is neither VOID nor UNPINNED), so
        its fields are undefined. SV-NULL and SP-VOID otherwise address RI-8.
      requested_change: >-
        Add a line: "rejected: no branches; none of the three is reported."
        Out-of-scope pointer to NJ5 (DF-6 totality).

    - id: O-NJ3-4
      joint: NJ3
      severity: low
      title: RI-3 declaration names a phrase that is not literally present
      evidence: >-
        The declaration keeps "the phrase giving an absolute tolerance on s" in
        C-PLANT-PL. The held declared_properties text gives an absolute 10^-6
        tolerance on e_plus - F_plus and a relative 2^-18 tolerance on location.
        It gives no tolerance on s. No gate reads declared_properties; the gates
        use 10^-6 on e and the bin. The declaration is therefore harmless and its
        reason (R-D4) is stated, but the phrase should be identified by quotation.
        The minus-branch label split is declared with a valid reason (source not
        read; recalled pointer only) and a revisit condition.
      requested_change: Identify the kept phrase by verbatim quotation.

  mapping_checks_that_hold:
    DF-5: Addressed as described in O-NJ3-2. No category is predicted and nothing is read as family-caused.
    RI-1: >-
      FC1 to FC6 are all mapped and none is retired. FC2 is demoted in part and
      FC4 is demoted to a validity rule. The FC4 demotion is sound, and for a
      stronger reason than the one stated: each branch has its own product check
      and certificates. Demoting two of six conditions, each with a reason, does
      not amount to K-route-switch.
    RI-3: Declared with reasons (see O-NJ3-4).
    RI-4: >-
      Addressed in design-report route_ruling. It names the superseded v1 cost
      fields (the rho-baseline metrics item, cost_model_disclosure model and
      unit, cost_expression and E_r) and lists C-PLANT-PL, C-FIELD-MUTATION and
      cases_extracted as extensions not named in H.
    RI-8: Addressed by SV-NULL and SP-VOID, apart from O-NJ3-3.
    R-D2D3: >-
      No regression. Every D2 field (typed costs, input models, columns, floor
      invariant) and every D3 field for status, recorded parts, witness set,
      values_by_status, per_typed_reading and stratification is held by hash,
      and no span touches them. The only D3 change is the whole replacement of
      bin_by_status (DF-6, authorized), plus BINS-EXACT (RI-2/DF-6). Compared
      with the held clause, the replacement differs only at the authorized
      points: s = 3/4 + tau exactly now gives UNDETERMINED/INTERMEDIATE with the
      flag true (it gave NEAR_FLOOR while flagged), bin_at_least is now defined
      for BOUND NEAR_FLOOR, and VOID reports nulls. Reviewer-built rows
      re-evaluated under the corrected rules (PTM-E E1 unfactored r+1, E2
      witness row) behave as the held D3 semantics require.
    NJ4_mechanics: >-
      The incorporation sha256 matches. All 15 span rules have a unique
      from-anchor and a from-anchor found, and their span sha256 values match.
      Every quoted held anchor is verbatim. Every DF-1 to DF-6 broken field is
      superseded. The typed approval and authorization envelope is not
      incorporated. The corrected FP (the plan's predicted break) holds: held
      why_the_expected_reasons_are_fixed ("each equals a member of FP") stays
      true because the extraction_cross_check gate is evaluated first, and the
      held null-arm and scope clauses and C-FIELD-MUTATION are unaffected.

  proves_too_much:
    PTM-A:
      result: pass
      detail: >-
        The PTM-2 form r = 12w - 1 (w, 6w - 1 and r all prime) was rebuilt at 64,
        128 and 256 bits. Search starts were 2^(B-4) + 2^(B-6), outside the
        C-INERT window, so no C-INERT integer was built. Both branches are EXACT
        and NEAR_CEILING at every size. The minus minimiser is 2, the plus
        minimiser is 12, and depth falls with size (minus below 0.034, plus below
        0.19 at 64 bits). Not flagged on either branch.
    PTM-B:
      result: pass
      detail: >-
        The brainpoolP384r1 field prime (384 bits, from rfc5639.txt) was
        presented as r. Under the corrected FP the reason list is exactly
        [field_prime], both as a CF-X case with no cofactor and as an r with
        printed cofactor 1. Under mutation M-FP no clause fires and the value is
        admitted; the added C-FIELD gate 1 catches this as N2. The brainpool
        row's true q is admitted under the corrected FP.
    PTM-C:
      result: pass
      detail: >-
        Sampler and seed were declared before evaluation (sha256 recorded in
        computations.json). Six random primes each at 256 and 384 bits were
        evaluated under a reviewer-declared Pari factor state. They receive the
        same categories as deployed rows (EXACT NEAR_CEILING/INTERMEDIATE, BOUND
        UNDETERMINED with bin_at_least NEAR_CEILING/INTERMEDIATE) through the
        same rules. No corrected prose reads a category as curve-specific: the
        only "family" occurrences are the DF-5 item and its membership-only
        reading, which forbid a family-caused reading.
    PTM-D:
      result: pass
      detail: >-
        On r = 1019 and one prime near 2^63, every divisor d > sqrt(r) of r + 1
        satisfies T_plus(d) >= d > sqrt(r). Its e_plus exceeds C_plus, so it is
        worse than d = 1 and is never the reported minimiser.
    PTM-E:
      result: pass
      detail: >-
        Constructed primes with r + 1 fully known were given a declared state
        with two composite parts unfactored. E1 (generic): BOUND UNDETERMINED
        with bin_at_least NEAR_CEILING, while the true EXACT value is NEAR_FLOOR.
        E2 (divisor at the T_plus optimum): BOUND NEAR_FLOOR with bin_at_least
        NEAR_FLOOR. In both cases lower <= true <= upper, the result is never
        EXACT, W is formed over subsets, and bin_at_least is defined and is never
        deeper than the truth.

  required_controls:
    - A C-BOUND state whose expected block fixes bin_at_least for a NEAR_FLOOR BOUND value (repair O-NJ4-1 option a or b), so that DF-6 is gated rather than only defined.
  counterexample_or_mutation: >-
    Evaluator E0: correct under the typed text, but reports bin_at_least null
    on a BOUND NEAR_FLOOR state. It passes every C-BOUND gate and also meets
    the N4 condition (O-NJ4-1). Mutation M-FP is caught by the new
    cases_extracted gate (PTM-B). A same-row-only FP mutation, which compares
    a deployed row only with its own field prime, passes every C-FIELD gate
    because each closed-form case is an own-row match and CF-X cases have no
    row. Cross-row admission is limited by the hasse clause. This is a low
    pointer to NJ1 and outside this reviewer's joints.
  baseline_comparison: Not applicable. The claim is a protocol text, not an attack or a cost claim.
  heuristic_challenges: []
  cost_model_challenges:
    - PTM-D confirms that the held T_plus(d) >= d invariant excludes plus-branch divisors above sqrt(r). There is no cost-model objection within NJ3 or NJ4.
  reduction_and_scope_challenges:
    - The scope of every NJ3/NJ4 finding is the protocol text at snapshot 1bc26a1f. No mathematical conclusion about any curve is drawn.
  proof_architecture_challenges: []
  out_of_scope_pointers:
    - NJ1: the same-row-only FP mutation described above (low).
    - NJ5/DF-6: bin fields for rejected rows and samples (O-NJ3-3).
  narrowest_supported_statement: >-
    At snapshot 1bc26a1f, the three-layer governing text has verified
    incorporation, span anchors and hashes, and a total one-layer-per-leaf
    table. The corrected FP definition and the RI-1, RI-3, RI-4, RI-8, DF-5
    and D2/D3 mappings hold under NJ3, with the objections listed above. NJ4
    breaks at one point: corrective.bin_by_status changes what held N4 tests
    on C-BOUND BND-1 and BND-3, while held gate 1 still skips bin_at_least
    there ("where stated"). As a result, one evaluator behaviour meets both
    the S_VALID gates and the N4 condition. PTM-A to PTM-E behave as known
    truth requires. This asserts nothing about any curve and approves nothing.
  next_concrete_action: >-
    The Coordinator composes this with the other joints. If NJ4 is repaired by
    span (O-NJ4-1 option a or b, plus the O-NJ4-2, O-NJ4-3 and O-NJ3-1 errata)
    in a new corrective record, re-run NJ4 on the C-BOUND and N4 clauses only.
  artifact_paths:
