  # -------------------------------------------------------------------------
  # DF DISCHARGE TABLE: item -> clause (quoted from the amendment) -> reviewer test
  # -------------------------------------------------------------------------
  df_discharge_table:
    - item: DF-1
      what: BN254-r PR-EIP197 locator matched nothing on its pinned revision; null-arm class consequence
      clauses:
        - clause: span_rules[EIP-R].replacement
          quote: "This expression must match EXACTLY ONCE in the file; zero matches or more than one match is locator_failure."
        - clause: span_rules[BN-K].replacement plus corrective.pins.rows_BN254-r_pinned_revision
          quote: "The executor does not resolve K again; it records K and retrieves"
        - clause: corrective.pins.null_arm_class_consequence.rule
          quote: "The null arm is then reported with that class named as absent and the reason (the UNPINNED row it would have mirrored)."
      executed: >-
        The held r expression matches 0 times on the pinned file; the corrected
        expression matches exactly once; the held p expression matches once; the
        BN family check passes with p from the same file (transcripts
        pin_locators.output_py39 and output_py312, identical row results).
      reviewer_test: >-
        Retrieve the file at the stated K, check the stated byte count and
        sha256, apply the corrected r expression literally and count matches;
        confirm 1. Apply the held expression and confirm 0. Then remove BN254-r
        from the pinned set and confirm the null arm is reported with its class
        absent and named, not VOID.
    - item: DF-2
      what: FP seeded with the two C-FIELD values; M-FP must FAIL a declared control
      clauses:
        - clause: span_rules[FP-DEF].replacement
          quote: "No C-FIELD expression value, control integer or other constant of this text is a member of FP by definition."
        - clause: corrective.controls.C-FIELD_cases_extracted.rule
          quote: "For EVERY row whose field prime was extracted in Stage P (whether or not the row pinned) there is one case, id CF-X-<row id>."
        - clause: corrective.controls.C-FIELD_gates_added.gates item 1
          quote: "must be exactly [field_prime]. Any other result is outcome N2"
        - clause: span_rules[CTRL-FIELD].replacement
          quote: "through controls[C-FIELD].cases_extracted, on every extracted field prime presented as r."
      executed: >-
        Under the corrected FP every cases_extracted case is rejected with
        [field_prime]; under M-FP the cases of every row whose field prime is
        not one of the two closed-form values are admitted, so the added gate
        fails (N2). No deployed r lies in the corrected FP (transcripts
        pin_locators.output_py39.fp_and_mutation).
      reviewer_test: >-
        Implement FP three ways: corrected; M-FP (the two C-FIELD values only);
        corrected minus any one extracted prime. Run C-FIELD with
        cases_extracted under each. Corrected passes; both mutations fail a
        declared gate with outcome N2.
    - item: DF-3
      what: PARI version_command read cypari2.__version__, which does not exist
      clauses:
        - clause: corrective.tools.certificate_and_factoring_library.version_command.parse
          quote: "Line 1 is the cypari2 distribution version and line 3 the PARI library version;"
        - clause: corrective.tools.certificate_and_factoring_library.minimum_version.rule
          quote: "Admission item (1) requires the cypari2 distribution version to be at least 2.1.5 and the PARI library version reported through it to be at least 2.15.4."
        - clause: corrective.tools.version_program (quoted program, sha256 5701a5e3...)
          quote: "print('.'.join(str(int(x)) for x in p.version()[:3]))"
      executed: >-
        The held command exits 1 with AttributeError on all five cypari2 builds.
        The corrected program exits 0 with three parseable lines on all five
        builds, and item (1) passes on each (transcripts cypari2_builds and
        corrected_admission_items).
      reviewer_test: >-
        Run corrective.tools.version_program with python3 -I -c on the declared
        minimum and latest builds; confirm three lines, apply the parse rule,
        and compare with the minimum.
    - item: DF-4
      what: in-process timeout named as an e_ALARM return; through cypari2 it raises
      clauses:
        - clause: span_rules[F2-RECOG].replacement
          quote: "(i) if the call raises cysignals.signals.AlarmInterrupt, caught by naming that class, the call timed out"
        - clause: span_rules[F2-RECOG].replacement
          quote: "(ii) if the call returns a PARI object of type t_ERROR whose errname is e_ALARM (the gp-interface form of the same event), the call timed out;"
        - clause: span_rules[ADM-3].replacement
          quote: "The item PASSES if and only if the child exits with status 0 within those 10 seconds and its standard output, split on LF with the final empty string after the last LF dropped, is exactly the three lines ALARM, ALARM, 4."
      executed: >-
        Through cypari2 the alarm raises AlarmInterrupt, which a handler for
        Exception does not catch, and the instance stays usable. Through gp
        2.15.4, 2.17.4 and 2.17.3 it returns t_ERROR with errname e_ALARM.
        Item (3) as corrected passes on the declared minimum and latest builds
        and on cypari2 2.2.3. It fails, with the child dying by signal, on
        cypari2 2.2.0 and 2.1.5 when paired with cysignals 1.12.6
        (transcripts cypari2_builds.*.step_probe_output, gp_builds,
        corrected_admission_items).
      reviewer_test: >-
        Run corrective.tools.alarm_self_test_program as a child on the declared
        builds and on a cysignals 1.12.6 pairing with cypari2 2.1.5; confirm
        pass and fail respectively. In gp, evaluate alarm(1, while(1, )) and
        confirm type t_ERROR, errname e_ALARM.
    - item: DF-5
      what: over-scoped pairing-family interpretation sentence
      clauses:
        - clause: corrective.interpretation_limits_item_6.text
          quote: "No status, bin, depth or other category is predicted for them, and no value on them is read as family-caused."
        - clause: corrective.interpretation_limits_item_6.reading_of_the_held_stratification_parenthetical
          quote: "It fixes stratum MEMBERSHIP only and cites the record behind that membership."
      executed: not applicable (text only)
      reviewer_test: >-
        Search the combined governing text for any sentence predicting a status,
        bin or depth on BN254-r or BLS12-381-r, or reading one as
        family-caused. H-AUXIN-6db354 still carries the imported sentence; it is
        not edited here (NP-6), and its correction is a later card.
    - item: DF-6
      what: bin_at_least undefined for a BOUND value that bins NEAR_FLOOR
      clauses:
        - clause: corrective.bin_by_status.text
          quote: "If boundary_flag is false and s >= 3/4 + tau, bin is NEAR_FLOOR and bin_at_least is NEAR_FLOOR (the true value is at least as deep)."
        - clause: corrective.bin_by_status.text
          quote: "VOID: bin, bin_at_least and boundary_flag are all null."
        - clause: corrective.bin_by_status.text
          quote: "no status and bin combination leaves bin_at_least undefined."
      executed: not applicable (text only)
      reviewer_test: >-
        For each status and each reachable bin, read bin_at_least from the text
        alone; confirm no combination is undefined, and that BOUND at depth
        exactly 3/4 + tau gives UNDETERMINED (flagged), consistent with
        definitions.bins as corrected.

