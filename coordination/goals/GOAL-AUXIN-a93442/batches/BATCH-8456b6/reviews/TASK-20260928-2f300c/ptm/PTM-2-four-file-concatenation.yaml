        unchanged_rows: rows 1 to 5 (FC1 to FC5) of AMD-20260927-narrow.yaml stay incorporated by hash
      errata_declarations:
      - item: ER-4
        adds_to: corrective.bin_by_status of AMD-20260927-narrow.yaml
        path_name: corrective.bin_by_status.confounder_rejected_candidates
        statement: 'A deployed row, null-arm sample, construction control or C-FIELD case that the confounder check
          rejects reports none of the three reporting fields bin, bin_at_least and boundary_flag. It has no branch:
          a rejected deployed row is invalid_measurement for that row and never factored, a rejected null-arm sample
          is kept, flagged and not factored, a rejected construction control stops the run (I_CONTROL_COLLISION) before
          any factoring, and a C-FIELD case is never factored. Its record is the ordered reason list of the confounder
          check.'
        supersedes: nothing
        why_no_outcome_changes: corrective.bin_by_status assigns the three fields per branch, and a rejected candidate
          has no branch under the held confounder-check text, so this statement makes explicit what the held text
          already implies; no gate, stop or outcome reads the three fields of a candidate that has no branch.
