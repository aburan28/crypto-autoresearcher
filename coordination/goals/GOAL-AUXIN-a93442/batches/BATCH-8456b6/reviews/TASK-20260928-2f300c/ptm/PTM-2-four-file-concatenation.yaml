    # ---------------------------------------------------------------------------
    # DEFINITIONS. Every recipe and rule below uses these and nothing else.
    # ---------------------------------------------------------------------------
    definitions:
      integer_functions: >-
        isqrt(n) is the largest integer x with x*x <= n. icbrt(n) is the largest
        integer x with x*x*x <= n. ceildiv(a, b) is the least integer c with
        c*b >= a, for positive a and b. All arithmetic in recipes is exact integer
        arithmetic. No floating point is used in any recipe.
      prime: >-
        "prime" means prime in the mathematical sense. A search accepts a
        candidate only if every integer its acceptance rule names is prime.
        OPERATIONAL SCREEN: the Baillie-PSW test, defined as a strong
        probable-prime test to base 2 followed by a strong Lucas probable-prime
        test with Selfridge method A parameters (D is the first of 5, -7, 9, -11,
        13, ... with Jacobi symbol (D/n) = -1; P = 1; Q = (1 - D)/4). Trial
        division by small primes may precede it; that cannot change which
        candidate is first accepted (conventions.Q0-5). PROOF: every accepted
        integer is then proved prime by a certificate under change.D7_certificates.
        If a candidate passes the screen but its certificate run proves it
        composite, it is NOT accepted, the search continues from the next
        candidate, and the event is recorded. If the certificate run fails without
        proving compositeness, that is an infrastructure stop, never a skip.
      nextprime: >-
        nextprime_ge(x) is the least prime p with p >= x. nextprime_gt(x) is the
        least prime p with p > x. Each is searched upward by steps of +1 over the
        integers from its argument (even integers other than 2 may be skipped,
        since they are never prime; skipping never changes the result and never
        changes the count of conventions.Q0-4).
      control_size: >-
        B = 256. M0 = 3 * 2^(B-2). Every integer within 2^(B-3) of M0 has exactly
        B bits. For the large control C-PLANT-PL: B_L = 521 and
        M_L = 3 * 2^(B_L-2); every integer within 2^(B_L-3) of M_L has exactly
        B_L bits.
      frozen_constants: >-
        factoring_seconds_per_integer = 3600 seconds, the frozen value of
        specification.yaml inputs.parameters.factoring_seconds_per_integer,
        restated here so that no budget is defined by reference. rho_baseline =
        0.5, the frozen value of specification.yaml inputs.parameters.rho_baseline.
      typed_costs: >-
        For a prime r and a branch b in {minus, plus}, let m_minus = r - 1 and
        m_plus = r + 1. For a positive divisor d of m_b:
        T_minus(d) = sqrt(m_minus / d) + sqrt(d)   (Cheon 2006 Theorem 1 leading expression);
        T_plus(d)  = sqrt(m_plus / d) + d          (Cheon 2006 Theorem 2 leading expression; Theorem 2, not the 2006 abstract).
        e_b(d) = log2(T_b(d)) / log2(r). Admissible d is every positive divisor of
        m_b, including 1 and m_b. The two branches are never combined: no quantity
        in this amendment is a minimum over both branches.
      analytic_floors_and_ceiling: >-
        F_minus(r) = (1 + log2(r - 1)/4) / log2(r), the exact minimum over real
        x > 0 of log2(sqrt(m_minus/x) + sqrt(x)) / log2(r).
        F_plus(r) = (log2(3) - 2/3 + log2(r + 1)/3) / log2(r), the exact minimum
        over real x > 0 of log2(sqrt(m_plus/x) + x) / log2(r), attained at
        x = (m_plus/4)^(1/3), called the T_plus optimum.
        C_b(r) = log2(sqrt(m_b) + 1) / log2(r), the value at d = 1 on either
        branch.
      depth: >-
        For a REPORTED BRANCH VALUE e on branch b (an EXACT branch minimum or a
        BOUND witnessed upper bound), depth s = (C_b(r) - e) / (C_b(r) - F_b(r)).
        Because d = 1 is a candidate in every divisor set and every witness set,
        and F_b is the real minimum, every reported branch value satisfies
        F_b(r) <= e <= C_b(r) mathematically, so s lies in [0, 1]. A single
        e_b(d) at an arbitrary d need not lie in that range and is never binned.
        s near 1 means a divisor near the branch's analytic optimum; s near 0
        means none.
      bins: >-
        Descriptive bins of a reported branch value with depth s, using declared
        constants only. Let tau = 10^-45, an ABSOLUTE tolerance on s
        (conventions.Q0-8). boundary_flag is true if |s - 1/4| <= tau or
        |s - 3/4| <= tau, else false. For an EXACT value: NEAR_FLOOR if
        s >= 3/4 + tau; NEAR_CEILING if s <= 1/4 - tau; a flagged value takes the
        bin on its lower-depth side (s within tau of 3/4 gives INTERMEDIATE; s
        within tau of 1/4 gives NEAR_CEILING); INTERMEDIATE otherwise. For a BOUND
        value see change.D3_descriptive_bins.bin_by_status. Bins carry no stop,
        escalate, naming or decision semantics (change.D4_calibration).
      minimiser_and_ties: >-
        The branch minimum e* is the least e_b(d) over the explicit divisor set of
        the row status (change.D3_descriptive_bins). TIE RULE, relative in the
        exponent e (conventions.Q0-7): a divisor d is tied if
        e_b(d) - e* <= 10^-100 * e*. The reported minimiser is the SMALLEST tied
        divisor. On the minus branch d and m_minus/d always tie exactly, so the
        smaller member of that pair is reported.
      precision: >-
        Every logarithm, square root and cube root is evaluated with at least 150
        significant decimal digits. Path A and path B must agree on every reported
        exponent and bound within 10^-50 absolute, and exactly on status,
        minimiser, witness, bin, bin_at_least and boundary_flag
        (change.D7_certificates, independent recompute).
      gate_evaluation_mode: >-
        (conventions.Q0-9.) Every gate inequality is evaluated numerically at the
        precision floor above, on path A and on path B separately. A lower gate
        of the form "0 <= e - F" is evaluated as e - F >= -10^-45, the same slack
        as change.D2_typed_costs.floor_invariant. An upper gate of the form
        "e - F <= c" is evaluated as e - F <= c with no slack. A gate holds only
        if it holds on both paths; if the two paths return different verdicts on
        any gate, the run stops with outcome N1 for a construction control, N2 for
        a C-FIELD gate, or N4 for a C-BOUND gate, because the instrument is then
        not determinate at its own precision.
      whitespace_set: >-
        For every parsing rule in this file, the whitespace set is the characters
        U+0009, U+000A, U+000B, U+000C, U+000D, U+0020, U+0085 and U+00A0. A
        backslash U+005C inside a value span is a line-continuation mark and is
        removed together with the whitespace set. Hex digits are 0-9, a-f and
        A-F. Decimal digits are 0-9.
      line_numbering: >-
        (DEC-20260923-a4c3d5 undischarged_defects entry 1, choice C5.) Every file
        is read as bytes and decoded as strict UTF-8 (a decoding failure is an
        infrastructure stop). Lines are delimited by LF (U+000A) ONLY. The line
        number of a character is 1 plus the number of LF characters before it.
        CR, NEL, form feed and every other character are line content. A "line"
        below is the text between two consecutive LF characters (or the file
        start or end). "Stripped content" means the line with every character of
        the whitespace set removed from both ends.
      deployed_row: >-
        A row whose role in specification.yaml frozen_curve_list is deployed or
        deployed_pairing. The label is the frozen list's role name only.
  
    # ---------------------------------------------------------------------------
    # CHANGE. One clause per defect family.
    # ---------------------------------------------------------------------------
    change:
  
      D1_pins:
        rule: >-
          Every deployed r is pinned AT RUN TIME, in Stage P, from the named
          primary-source file, by the parse rule named for that file below. For
          each row the executor records in orders.json: the source file path, the
          sha256 of the source file's bytes, the first and last line numbers
          (definitions.line_numbering) of every value span it read, the verbatim
          bytes of those lines, the representation used (hex, decimal or
          expression), the parsed r in decimal and hex, and the result of every
          cross-check. No r is taken from code, from
          research/equation-schemes-20260905/parsed_safecurves.json, from any
          earlier run, from any review report or from memory.
        staged_source_binding: >-
          Before any parse, the executor computes the sha256 of each staged file
          it reads and compares it with the value this file states. A mismatch is
          an evidence-integrity stop; no row is pinned from a file that does not
          match. The values are those recorded in
          inputs/SAFECURVES-20260825/source_record.yaml and are restated here:
          inputs/SAFECURVES-20260825/specs/sp800-186.txt = 286001ea961ad675593bf67ca6ef4097c781f841fed3c2d52ae18ae2e73db2a2;
          inputs/SAFECURVES-20260825/specs/sp800-186.pdf = 53c7cf3340528aaa0a7bbeaef947f2099568192367d4341a7d4abceb55f78432;
          inputs/SAFECURVES-20260825/specs/sec2-v2.txt = 579265ec54e2ed9d77ec85929da3cc130d2997f6acb2ccada17dfa812af1daeb;
          inputs/SAFECURVES-20260825/specs/sec2-v2.pdf = 87b8f3703364ed5b21ba8582e411cc0cbf477bcaa3f4f45e0d6580d1c00d9952;
          inputs/SAFECURVES-20260825/specs/rfc5639.txt = d19949766009ac82b69e46b09f3a08d712908381300a340d3fa3b1478f4b215e;
          inputs/SAFECURVES-20260825/specs/rfc7748.txt = 279ca0ecc5e92e2962e27b846986aeb74729d9dd34bd4a04a362f80dcb596ad3.
        parse_rules:
          PR-SP800: >-
            (NIST SP 800-186, derived text inputs/SAFECURVES-20260825/specs/sp800-186.txt.)
            BLOCK: from the first line whose stripped content equals the section
            number given for the row (for example "3.2.1.3.") to, exclusive, the
            next line whose stripped content matches the regular expression
            ^[0-9]+(\.[0-9]+)*\.$ . LABEL LINE for label L (L is p, h or n): the
            first line in the block whose content, after removing leading
            whitespace-set characters, begins with the two characters "L:". SPAN:
            from the character after "L:" to, exclusive, the earlier of (a) the
            first "(" character after "L:" and (b) the start of the next line in
            the block whose stripped content matches ^[A-Za-z]{1,4}: . DECIMAL
            FORM: the span with the whitespace set and backslashes removed; it is
            CLEAN if it is non-empty and consists of decimal digits only,
            otherwise CONTAMINATED (for example a printed expression whose
            superscripts or minus signs were lost, or interleaved page text) and
            it is then ignored and recorded as contaminated. HEX FORM: exists only
            if case (a) ended the span and, after that "(" and with the whitespace
            set removed, the next three characters are "=0x"; it runs from after
            "=0x" to, exclusive, the first ")" after it; with the whitespace set
            removed it is CLEAN if non-empty and hex digits only, otherwise
            CONTAMINATED and ignored. VALUE: if the hex form is clean, the value
            is its base-16 integer V. The decimal form is then compared only if it
            is clean AND has exactly as many digits as the decimal expansion of V:
            in that case it must equal V, else locator_failure. A clean decimal
            form with a different digit count is a printed expression whose
            operators were lost in the derived text (for example an exponent
            expression printed without its superscript and minus sign); it is
            recorded as decimal_span_not_a_literal and ignored. If the hex form is
            absent or contaminated and the decimal form is clean, the value is the
            decimal integer. If neither is clean, locator_failure. Which
            representation was used, and every ignored span with its reason, is
            recorded.
          PR-SEC2: >-
            (SEC 2 v2.0, derived text inputs/SAFECURVES-20260825/specs/sec2-v2.txt,
            whose inter-word spaces are lost.) BLOCK for curve C: from the first
            line whose content with the whitespace set removed matches
            ^[0-9]+(\.[0-9]+)+RecommendedParameters<C>$ to, exclusive, the next
            line whose content contains "RecommendedParameters". LABEL LINE for
            label L (p, n or h): the first line in the block whose stripped
            content equals L exactly AND whose next non-empty line begins, after
            leading whitespace, with "=". VALUE LINES: the characters after that
            "=" on its line (if any remain after whitespace removal) form the
            first value line; otherwise the first value line is the next non-empty
            line. The first value line must consist of hex digits only after
            whitespace removal. Each following line is a continuation if, after
            whitespace removal, it consists of hex digits only and has at least 4
            characters; the first line that is not a continuation ends the value.
            VALUE: the base-16 integer of the concatenated value lines. Any
            failure is locator_failure.
          PR-RFC5639: >-
            (RFC 5639, inputs/SAFECURVES-20260825/specs/rfc5639.txt, the RFC text
            itself.) BLOCK for curve C: from the first line whose stripped content
            equals "Curve-ID: C" to, exclusive, the next line whose stripped
            content begins with "Curve-ID:" or "#Twisted" or matches
            ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE for label L (p, q or h): the
            first line in the block whose stripped content begins with "L =" or
            equals "L =". VALUE: the characters after "=" on that line plus each
            following line whose stripped content is non-empty and consists of
            hex digits only; the first empty or non-hex line ends the value. The
            concatenation, with the whitespace set removed, is read in base 16.
            Any failure is locator_failure.
          PR-RFC7748: >-
            (RFC 7748, inputs/SAFECURVES-20260825/specs/rfc7748.txt.) In section
            4.1 (from the line whose stripped content is "4.1.  Curve25519" to the
            next line matching ^[0-9]+(\.[0-9]+)*\.\s ), the LABEL LINE for label
            L (order or p) is the first line whose stripped content begins with L
            followed by at least one whitespace-set character. Its remainder is an
            EXPRESSION of exactly one of the forms "2^E + 0xH" or "2^E - S", with
            E and S decimal and H hex, whitespace ignored; it is evaluated in exact
            integers. Any other form is locator_failure.
          PR-IETF-DRAFT: >-
            (Archived IETF Internet-Draft text.) BLOCK: from the first line whose
            stripped content matches ^[0-9]+(\.[0-9]+)*\.\s.*\(BLS12-381\)$ to,
            exclusive, the next line matching ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE
            for label L (p, r, h or t): the first line in the block whose stripped
            content, after removing one leading "*" and whitespace if present,
            matches ^L\s*[:=] . VALUE TEXT: the remainder of that line after the
            first ":" or "=", plus each following line whose stripped content is
            non-empty and consists only of hex digits, decimal digits, "0x", "x",
            "^", "+", "-" and whitespace; the first empty line or other line ends
            it. Whitespace removed, the value text is read as: a hex literal if it
            matches ^-?0x[0-9A-Fa-f]+$; a decimal literal if it matches
            ^-?[0-9]+$; a signed sum of powers of two if it matches
            ^-?2\^[0-9]+([+-]2\^[0-9]+)*$ (evaluated in exact integers). Anything
            else is locator_failure.
          PR-EIP197: >-
            (EIP-197 markdown source at a pinned commit, archived as
            sources/eip-197.md; plain text, so no HTML conversion is involved.)
            r is the decimal integer captured by the FIRST match in the file of
            the regular expression prime order q\s*=\s*([0-9]+) . The field
            modulus p is the decimal integer captured by the FIRST match of
            (?<![A-Za-z0-9_])p\s*=\s*([0-9]+) . No match is locator_failure.
        pdf_digit_check: >-
          (entry 3.) Every row, cross-source or C-FIELD comparison that reads a
          derived .txt file (sp800-186.txt or sec2-v2.txt) is digit-checked
          against the authoritative PDF named in
          inputs/SAFECURVES-20260825/source_record.yaml (sp800-186.pdf,
          sec2-v2.pdf), whose sha256 is bound above. PROCEDURE: extract the text
          of every page of the PDF with pypdf (tools_and_admission) as
          "\n".join(page.extract_text() for page in PdfReader(path).pages); remove
          the whitespace set and backslashes; lowercase. Take the value's digit
          string exactly as the .txt span printed it (the clean hex or clean
          decimal form used, whitespace and backslashes removed, leading zeros as
          printed), lowercased. The check PASSES if and only if that string occurs
          as a contiguous substring of the normalized PDF text. A FAIL makes the
          row UNPINNED with reason pdf_digit_mismatch (or, for a cross-source, a
          cross-source failure). The extracted normalized text is archived as
          sources/<pdf-name>.normalized.txt with its sha256, and every verdict is
          written to pdf_check.json.
        locator_failure: >-
          If a parse rule returns locator_failure, a cross-check fails, or two
          named sources for one row disagree, the row is UNPINNED. It is reported
          with the failure text, never dropped and never filled from another
          source. UNPINNED is not a negative result.
        rows:
          - id: NIST-P-224
            source: inputs/SAFECURVES-20260825/specs/sp800-186.txt, PR-SP800, block "3.2.1.2."
            r_label: n
            field_prime_label: p
            cofactor_label: h
            cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, PR-SEC2, curve secp224r1, label n (must be equal)
            pdf_digit_check: sp800-186.pdf for r, p and h; sec2-v2.pdf for the cross-source value
          - id: NIST-P-256
            source: inputs/SAFECURVES-20260825/specs/sp800-186.txt, PR-SP800, block "3.2.1.3."
            r_label: n
            field_prime_label: p
            cofactor_label: h
            cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, PR-SEC2, curve secp256r1, label n (must be equal)
            internal_consistency_only: specification.yaml frozen_curve_list[NIST-P-256].r_hex_pinned_internal is compared and the result recorded; it cannot pin
            pdf_digit_check: sp800-186.pdf for r, p and h; sec2-v2.pdf for the cross-source value
          - id: NIST-P-384
            source: inputs/SAFECURVES-20260825/specs/sp800-186.txt, PR-SP800, block "3.2.1.4."
            r_label: n
            field_prime_label: p
            cofactor_label: h
            cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, PR-SEC2, curve secp384r1, label n (must be equal)
            pdf_digit_check: sp800-186.pdf for r, p and h; sec2-v2.pdf for the cross-source value
          - id: NIST-P-521
            source: inputs/SAFECURVES-20260825/specs/sp800-186.txt, PR-SP800, block "3.2.1.5."
            r_label: n
            field_prime_label: p
            cofactor_label: h
            cross_source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, PR-SEC2, curve secp521r1, label n (must be equal)
            pdf_digit_check: sp800-186.pdf for r, p and h; sec2-v2.pdf for the cross-source value
          - id: secp256k1
            source: inputs/SAFECURVES-20260825/specs/sec2-v2.txt, PR-SEC2, curve secp256k1
