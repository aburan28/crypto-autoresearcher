              BN family check. Find the integer u, if any, with
              36u^4 + 36u^3 + 24u^2 + 6u + 1 = p (p from the same file). Require
              r = 36u^4 + 36u^3 + 18u^2 + 6u + 1. No u is taken from any other
              source; failure makes the row UNPINNED.
            pdf_digit_check: not applicable
          - id: BLS12-381-r
            source: >-
              PINNED REVISION, retrieved at Stage P: the archived Internet-Draft
              https://www.ietf.org/archive/id/draft-irtf-cfrg-pairing-friendly-curves-14.txt.
              An archived draft revision is never re-issued under the same name,
              so the bytes cannot drift. Parsed by PR-IETF-DRAFT (block titled
              "(BLS12-381)"). There is NO fallback source and no substitution of
              any other revision.
            r_label: r
            field_prime_label: p
            cofactor_label: h
            family_parameter_label: t
            cross_source: >-
              BLS12 family check with t from the same block: require
              r = t^4 - t^2 + 1 and p = (t - 1)^2 * (t^4 - t^2 + 1) / 3 + t, with
              the division exact. Failure makes the row UNPINNED.
            pdf_digit_check: not applicable
        retrieval_rule: >-
          (entry 2; DR-8.) For each PINNED REVISION source the executor, before
          any parse, writes the retrieved bytes to sources/<name> (eip-197.md;
          draft-irtf-cfrg-pairing-friendly-curves-14.txt), computes their sha256,
          and records URL, resolved commit (EIP-197), UTC time, HTTP status, byte
          count and sha256 in sources/retrieval.json. Parsing reads only the
          archived file. If a pinned revision cannot be retrieved (network
          failure, non-200 status, missing commit), that is an INFRASTRUCTURE
          STOP of the package before any factoring: no other revision, mirror or
          document is substituted and the row is never filled from memory.
        confounder_check:
          applies_to: >-
            EVERY deployed row, before any factoring; every C-FIELD case; every
            construction-control integer; every null-arm integer.
          clauses_in_order: >-
            (1) field_prime: REJECT if the candidate equals ANY member of the
            field-prime set FP, defined as every field prime extracted in Stage P
            for any row (whether or not that row pinned) together with the two
            C-FIELD expression values. For a deployed row this includes its own
            extracted field prime. (2) not_prime: REJECT unless the candidate is
            proved prime under change.D7_certificates. (3) hasse: applies only to
            a deployed row or C-FIELD case whose source prints a cofactor h;
            REJECT unless |p + 1 - h*r| <= 2*isqrt(p) + 2, where p and h are that
            row's extracted field prime and cofactor and r is the candidate.
          evaluation_and_recording: >-
            (entry 4.) All applicable clauses are evaluated, in the order above,
            on every candidate; evaluation never stops at the first reason. The
            result is the ordered list of reasons that fired, written to
            confounder_receipt.json per candidate, together with the verdict of
            each clause. The candidate is REJECTED if and only if the list is
            non-empty. A rejected deployed row is invalid_measurement for that row
            and is never factored.
          scope_on_controls_and_null_arm: >-
            (conventions.Q0-3.) For construction controls and null-arm integers
            there is no "same curve": clause (1) compares against the whole set FP,
            clause (2) applies, and clause (3) does not apply because no source
            prints a cofactor for them. The expected outcome for every
            construction control is NOT REJECTED (no reason). If a construction
            control is rejected, the run stops with outcome I_CONTROL_COLLISION
            (never N1, never a result), because a constructed control that equals
            an extracted field prime is a defect of this text's recipes. A
            rejected null-arm sample is kept, flagged and not factored.
          tested_by: controls C-FIELD and C-FIELD-MUTATION, in Stage P, before any row is pinned.
  
      D2_typed_costs:
        source_statement: >-
          J. H. Cheon, Security Analysis of the Strong Diffie-Hellman Problem,
          EUROCRYPT 2006, LNCS 4004. Theorem 1: for d | p - 1, given g, g^alpha
          and g^(alpha^d), alpha is computed in
          O(log p * (sqrt((p-1)/d) + sqrt(d))) group operations. Theorem 2 (the
          theorem statement, not the 2006 abstract, whose "i = 0, 1, ..., d" is
          not followed): for d | p + 1, given the 2d consecutive powers
          g^(alpha^i), i = 1..2d, alpha is computed in
          O(log p * (sqrt((p+1)/d) + d)) group operations. Here p is the prime
          group order, called r in this experiment. The J. Cryptology 2010 version
          (Discrete Logarithm Problems with Auxiliary Inputs) states the same
          leading expressions with an Exp_G(p) factor, the linear d term on
          p + 1, and i = 1..2d.
        provenance: >-
          Both versions were retrieved and read by TASK-20260923-635c5c: the IACR
          archive copy of the 2006 paper and the 2010 author's final manuscript
          (RT-20260923-38bbbf primary_sources; H-AUXIN-6db354
          structural_ingredients, provenance retrieved). The Springer typeset
          2010 version was read by no one. THIS design session did not open
          either paper; it relies on those records. The reopen condition of
          CORR-20260923-187ea3 (a source giving a sqrt(d) second term for
          d | p + 1) is recorded there as not met.
        input_models: >-
          MINUS: "P, [x]P, [x^d]P (one auxiliary power, exponent d; Cheon 2006
          Theorem 1)". Condition label: "Cheon 2010 Theorem 1's deterministic time
          uses a generator of the multiplicative group mod r, found by factoring
          r - 1 at a heuristic cost of order r^(1/4+o(1)) (Cheon 2010 section
          2.1); not included in the exponent". PLUS: "[x^i]P for i = 1..2d (2d
          consecutive auxiliary powers; Cheon 2006 Theorem 2)". Condition label:
          "ERH assumed in Cheon 2010 Theorem 2 (for a generator of the
          multiplicative group of the degree-2 extension); not included in the
          exponent". The condition labels are carried as labels on every row
          (O12) and are not heuristics of H-AUXIN-6db354.
        columns: >-
          Two separate column groups per row, never merged. MINUS group: cost
          T_minus, input model and condition label as above. PLUS group: cost
          T_plus, input model and condition label as above. Every row, in each
          group, carries: status; the exponent (EXACT) or the bound pair (BOUND);
          the minimiser or witness d in decimal (field minimiser_d); bits of d
          (d.bit_length()); the input model as the literal string with the
          symbol d (field input_model, conventions.Q0-12); the condition label;
          memory_elements_log2 = log2(max(sqrt(m_b/d), sqrt(d))) at that d, the
          closed-form memory bound in group elements stated by both theorems
          (O13; not measured; not in the exponent; not a cost); and for the plus
          group log2(2d), the log2 of the number of consecutive powers the
          minimiser presupposes.
        what_is_omitted: >-
          The typed exponents use the theorems' leading expressions without the
          log p (or Exp_G(p)) factor and without the O() constant. Direction of
          bias: they understate operation counts (the 2010 lemmas carry explicit
          constants above 1, per RT-20260923-38bbbf). The unit statement of
          change.D9_labelling is printed beside the rho column.
        frozen_expression_on_plus: >-
          DROPPED. No artifact of a run under this amendment evaluates
          sqrt(m/d) + sqrt(d) on the plus branch, in any column, labelled or not.
          On the minus branch that expression IS T_minus.
        no_combined_quantity: >-
          The frozen E(r) (a minimum over both branches) is not produced. The
          branches answer different problems with different inputs
          (CORR-20260923-187ea3).
        floor_invariant: >-
          Every reported exponent or bound on branch b must satisfy
          e >= F_b(r) - 10^-45. On the plus branch every evaluated d must also
          satisfy T_plus(d) >= d. A violation on either path is the negative
          outcome N3.
  
      D3_descriptive_bins:
        status_of_a_branch: >-
          EXACT when m_b is completely factored into primes, each proved under
          change.D7_certificates, and the product check holds. BOUND when one or
          more composite parts remain after the budget, each with a recorded
          compositeness witness and perfect-power check. VOID when the branch
          fails a validity rule (product mismatch, certificate failure, path
          disagreement). UNPINNED rows have no branches.
        recorded_parts: >-
          (O10.) At the end of factoring a branch the pipeline records F_b, the
          certified factored part (the product of its certified prime powers), and
          the list of composite parts P_1, ..., P_k (k >= 1 for BOUND), each an
          integer greater than 1, with F_b * P_1 * ... * P_k = m_b. C_b denotes the
          product P_1 * ... * P_k of ALL unfactored parts. The list is written in
          factorizations.json in ascending order.
        explicit_witness_set: >-
          EXACT: every positive divisor of m_b, enumerated from the certified
          factorization. BOUND: W_b is the set of all integers
          e * (product of the parts in S), for every positive divisor e of F_b and
          every subset S of {P_1, ..., P_k} (the empty product is 1). Equal
          integers are counted once. Every member of W_b is an explicit divisor of
          m_b. With k = 1 this is {e, e*C_b : e | F_b}.
        values_by_status: >-
          EXACT: the exponent is the branch minimum over all divisors, with its
          minimiser. BOUND: the reported upper bound is the minimum of e_b over
          W_b, with its witness chosen by definitions.minimiser_and_ties over W_b,
          and the reported lower bound is F_b(r). The true branch exponent lies
          between them. A BOUND value is never reported as an exponent and never
          read as one.
        bin_by_status: >-
          (O11.) EXACT: definitions.bins. BOUND: let s be the depth of the
          witnessed upper bound. NEAR_FLOOR if s >= 3/4 + tau (the true value is
          at least as deep). Otherwise the bin is UNDETERMINED and bin_at_least is
          the bin that definitions.bins gives an EXACT value of depth s (so a
          witnessed depth within tau of 3/4 gives UNDETERMINED with bin_at_least
          INTERMEDIATE and boundary_flag true). This clause and definitions.bins
          never give two answers: the tau band below 3/4 + tau is never
          NEAR_FLOOR. VOID and UNPINNED: no bin.
        per_typed_reading: >-
          Bins are computed per branch with that branch's typed cost only. A
          minus-branch witness is never evaluated with T_plus, and the reverse.
        stratification: >-
          Every count or frequency of bins is reported separately for each
          stratum: deployed rows with expected_structure_flag false; deployed rows
          with expected_structure_flag true (BN254-r and BLS12-381-r, whose family
          polynomials force divisors, CORR-20260923-187ea3); construction
          controls; C-BOUND declared states; and the null arm per bit class.
          Strata are never pooled in a reported frequency.
        semantics: >-
          None. A bin is a descriptive label. No bin, on any row, stops the run,
          triggers an escalation, names a curve, or is read as a property of how
          any curve was chosen.
  
      D4_calibration:
        choice: >-
          (b) ESCALATE SEMANTICS REMOVED. The table is descriptive. The frozen
          e_inert_floor and e_escalate_ceiling are retired and no rule, stop or
          reading uses them. A pre-registered null arm of random primes
          (amendment.null_arm) runs in the same package, is completed and written
          BEFORE any deployed row is factored, and is reported beside the deployed
          rows with the same statuses, bins and strata.
        threshold_inventory: >-
          (F-J3-2, entry 15.) The COMPLETE list of numeric cut-offs and decision
          constants in this amendment, each with what it reads:
          bin cut-offs 1/4 and 3/4 and boundary tolerance tau = 10^-45 (declared
          constants, applied to the depth s, whose normalisation F_b(r), C_b(r)
          is a closed-form function of the row's own pinned r, a Stage P input);
          tie tolerance 10^-100 relative in e (declared constant);
          precision floor 150 digits and path tolerance 10^-50 (declared);
          floor-invariant slack 10^-45 and the rule T_plus(d) >= d (declared
          constant and F_b(r));
          control gate tolerance 10^-6 (declared constant and F_b(r) of the
          control's r);
          hasse bound 2*isqrt(p) + 2 (p, h, r of the same row, Stage P inputs);
          windows 2^24, 2^43 and 2^48, B = 256, M0, B_L = 521, M_L (declared);
          null-arm size 16 per class (declared); null-arm bit classes (the exact
          bit lengths of the pinned deployed r, Stage P inputs);
          factoring budget 3600 seconds per integer (frozen specification value);
          trial-division bound 2^24; F2/F3 routing size 272 bits; the B1 ladder
          and its curves-per-level column (change.D6_factoring); certificate
          cut-over 2^64 (change.D7_certificates); PDF digit check (substring
          test, no numeric cut-off).
          None of these is a function of any factoring or evaluation outcome of
          any deployed row, and none is a function of any null-arm value. No
          threshold is set after any value is seen.
        what_the_null_arm_is_for: >-
          Context only. It shows how often random primes of the same bit length
          receive each status and bin under the identical pipeline and budget. It
          licenses no curve-specific reading of any deployed row. A later
          amendment may pre-register a rule on the basis of this arm; this run's
          deployed rows are never re-scored by such a rule.
  
      D5_controls:
        rule: >-
          Every control is fully declared in amendment.controls below, BEFORE any
          code, by search start, step order, primality test, acceptance rule,
          window, tie-breaks and gates, with every expected categorical outcome
          fixed by this text. The executor implements exactly that text. A control
          integer that differs from what the text determines voids the run
          (invalidation_rules). The construction factorization is written to
          controls_construction.json and is NOT given to the factoring pipeline,
          which factors each construction control blind, exactly as a deployed
          row. C-BOUND declared states are the one exception: they are passed
          directly to the evaluator by design and never enter the pipeline.
        expected_status_convention: >-
          (conventions.Q0-2.) For every construction control branch, the status
          this text fixes in advance is EXACT, because the construction supplies a
          complete factorization into proved primes. The run observes the status
          the blind pipeline returns under the frozen budget of 3600 seconds per
          integer. A construction-control branch the pipeline leaves BOUND or VOID
          fails its EXACT gate (outcome N1). A reviewer reproducing a control's
          classification from this text alone uses the constructed factorization
          and obtains EXACT.
  
      D6_factoring:
        budget: >-
          Each integer m_b (every branch of every construction control, null-arm
          and deployed row) receives the full factoring_seconds_per_integer =
          3600 seconds. Factoring stops only when m_b is completely factored or
          that budget is spent. THERE IS NO BIT CAP: no integer and no part is
          excluded from any stage by its size.
        clock: >-
          (F-J1-5, entry 9.) The budget clock is the executor process's monotonic
          wall clock (Python time.monotonic()), read immediately before and after
          every factoring call on a part, whether the call runs in-process (PARI
          through cypari2) or in a subprocess (GMP-ECM). The seconds charged to an
          integer are the sum of those intervals over all its parts and stages.
          The remaining budget R is 3600 minus the seconds charged so far.
        timeouts: >-
          F2 (in-process PARI): each call is issued as the GP expression
          alarm(A, factor(n)) with A = floor(R) seconds; if floor(R) < 1 the call
          is not made and the part stays unfactored. An alarm return (PARI error
          e_ALARM) means the call timed out; the part stays unfactored and the
          timeout is recorded. F3 (GMP-ECM subprocess): each subprocess is started
          with a hard timeout of R seconds (killed on expiry, which is recorded).
          Any overrun of an alarm or kill beyond R is charged to the integer, is
          recorded, and is never refunded. No other timeout mechanism is used.
        pipeline: >-
          F0 trial division of m_b by every prime below 2^24. F1 every remaining
          part is tested for being a perfect power (and split if so) and screened
          for primality; prime parts go to certification and leave the pipeline.
          F2 every composite part of at most 272 bits goes to PARI factor() under
          the F2 timeout above; parts are processed in ascending size. F3 every
          composite part of more than 272 bits goes to GMP-ECM, run over the B1
          ladder in ascending order with the fixed number of curves per level
          below, invoked as "ecm -one -c <curves> <B1>" with the part on standard
          input, repeating the last level if the ladder completes. After each ECM
          subprocess returns, every factor it reports that divides the part is
          split off; every resulting piece re-enters F1, and any composite piece
          of at most 272 bits goes to F2. For a piece that remains above 272 bits
          the ladder resumes at the level where it stopped, counting the curves
          already run at that level. The 272-bit value routes a part between two
          methods; it never ends the budget.
        ecm_curves_per_level: >-
          (F-J1-3, entry 8.) DECLARED CONSTANTS of this protocol, not read from
          the installed tool: B1 = 2e3: 25 curves; 11e3: 90; 5e4: 300; 25e4: 700;
          1e6: 1800; 3e6: 5100; 11e6: 10600; 43e6: 19300; 11e7: 49000;
          26e7: 124000; 85e7: 210000; after the last level, 85e7 is repeated with
          210000 curves per repetition until the budget is spent. Provenance: the
          values follow the GMP-ECM README's expected-curves table as recalled by
          this design session (provenance recalled, a pointer only). The protocol
          does not depend on that recollection being exact, because the column is
          a declared constant, not a claim about the tool.
        ecm_nondeterminism_disclosure: >-
          GMP-ECM draws its own curve parameters (sigma), which are recorded per
          curve. Which composite parts a re-run splits within the budget may
          therefore differ, which can change EXACT versus BOUND on a deployed or
          null-arm branch. A certified factorization and every value derived from
          it never change.
        reporting: >-
          (F-J1-4, entry 9.) Per integer: the list of parts it passed through,
          each identified by its decimal value, bit length and the stage that
          produced it; for EACH part, seconds charged in each of F0 to F3; the ECM
          curves run at each B1 level with their sigma values and seconds; every
          F2 alarm and F3 kill; the final list of certified prime powers; and the
          recorded composite parts with bit lengths, compositeness witnesses and
          perfect-power checks. Certificate generation is timed separately and is
          not charged to the factoring budget.
        budget_semantics: >-
          A BOUND row means the full budget was spent without completing the
          factorization. It is not a statement that the integer resists
          factoring, and it is never negative evidence (core rule 5).
  
      D7_certificates:
        producing_library: >-
          PARI/GP through cypari2. For each prime p >= 2^64: an ECPP certificate
          from primecert(p), checked on the producing side by primecertisvalid.
          For each prime p < 2^64, and for the terminal prime of every ECPP chain:
          a Pratt certificate, built by path A from the complete factorization of
          p - 1 (recursively, to the leaf 2) with a witness a. PARI's primecert
          returns a bare integer, not a certificate, for p < 2^64; that return is
          never treated as a certificate.
        independent_verifier: >-
          A NEW library-free module,
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/cert_verify.py,
          importing only the Python standard library (checked by the AST import
          audit at admission). It shares no code with PARI, GMP-ECM, FLINT, pypdf
          or sympy. Its version is the sha256 of its bytes at the launch commit.
          It checks. (i) Pratt: the listed prime powers multiply to p - 1;
          a^(p-1) = 1 mod p; a^((p-1)/f) != 1 mod p for each listed prime f; each
          f carries its own valid certificate. (ii) ECPP step with
          (N, t, s, a4, P = (x, y)): gcd(N, 6) = 1; m = N + 1 - t; s divides m and
          q = m/s; b = y^2 - x^3 - a4*x mod N; gcd(4*a4^3 + 27*b^2, N) = 1; [m]P is
          the point at infinity and [s]P is an affine point whose denominators are
          invertible mod N, both by exact arithmetic mod N; q > (c + 1)^2 where c
          is the least integer with c^4 >= N; the next step's N equals q; the
          chain's terminal q carries a valid Pratt certificate. (iii)
          Compositeness witnesses: the recorded base a is the smallest integer
          a >= 2 for which C fails the strong probable-prime test to base a (such
          a base exists for every odd composite C, including Carmichael numbers);
          the verifier re-runs that strong test. An even composite part has
          witness 2 recorded as "even". This arithmetic runs on auxiliary curves
          over Z/NZ for primality proofs only; it involves no curve of the frozen
          list and no auxiliary-input power.
        changes_from_d1d10_with_reason: >-
          The module path moves from implementation/d1d10/ to implementation/typed/
          (change.D10_additivity). The check gcd(N, 6) = 1 is added and the
          compositeness witness becomes a strong-test witness; both close gaps
          VAL-20260923-c3c90c attack_iii recorded (the omitted gcd check and the
          Carmichael case). Nothing else changes.
        criterion_provenance: >-
          The Goldwasser-Kilian and Atkin-Morain step criterion, Pratt's
          criterion and the existence of a strong-test witness for every odd
          composite are recalled by this design session (provenance recalled,
          pointer, not support). VAL-20260923-c3c90c attack_iii records a worked
          soundness check of the step criterion (internal). The admission
          self-tests are what the run relies on.
        rule: >-
          No prime enters an EXACT branch, and no r is pinned, unless path A
          produced its certificate AND the independent verifier accepted it. A
          verifier rejection voids the branch (or the row, for r). sympy is not
          used for any primality verdict.
  
      D8_custody:
        trial_plan: >-
          A NEW file experiments/EXP-AUXIN-7e2e3d/implementation/typed/trial-plan.json
          records the sha256 of specification.yaml, of AMD-20260916-bands.yaml and
          AMD-20260923-d1d10.yaml as they stand at the launch commit (context
          only), and of THIS file. The run recomputes all four at launch and at
          every stage boundary and stops, evidence-integrity failure, on any
          mismatch.
        import_rule: >-
          (F-J1-7, entry 10.) The run is launched as
          "python3 -I experiments/EXP-AUXIN-7e2e3d/implementation/typed/run.py ..."
          (isolated mode: no current directory, PYTHONPATH or user site on
          sys.path). Every module the run loads must be one of: (a) a Python
          standard-library module (sys.stdlib_module_names); (b) a module of the
          installed third-party distributions cypari2, cysignals or pypdf, or of
          their declared dependencies, each recorded with name and version in
          manifest.yaml; (c) a file under
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/. ANY module whose
          file lies inside the repository but outside implementation/typed/
          (for example implementation/driver.py, e_eval.py, factor_path_*.py, or
          anything under tools/) is FORBIDDEN. Checked twice: an AST audit of
          every .py file under implementation/typed/ at admission (every import
          names a module of class a, b or c), and a runtime audit at launch and at
          every stage boundary that lists every entry of sys.modules with a
          __file__, classifies it, and stops the run (evidence-integrity failure)
          on any forbidden module. Both audits are written to import_audit.json.
        implementation_snapshot_and_launch_comparison: >-
          (F-J1-8, entry 10.) Before launch, an implementation snapshot archive
          must bind by path_sha256 every file under
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/, and the dispatcher
          must have verified it. At launch, BEFORE any row is scored and before
          Stage A0 completes, the run computes the sha256 of (i) every file under
          implementation/typed/ in the working tree and (ii) the same path's bytes
          at the launch commit (git show <launch_commit>:<path>), and compares
          both with that snapshot's path_sha256. Any missing, extra or differing
          file refuses launch (evidence-integrity failure). The comparison is
          written to launch_comparison.json. The post-run snapshot must bind the
          same implementation bytes again; a difference makes the run uncitable.
        no_self_hash: >-
          No artifact contains a hash of itself. Every recorded hash is of a
          file's final bytes, computed after the file is closed; a hashed file is
          never rewritten, renamed over or unlinked. orders.json is written once;
          its sha256 goes to the separate file orders.json.sha256 and to
          stdout.log before any factoring. That is the meaning of hash-committed
          in the frozen launch gate.
        manifest: >-
          manifest.yaml records dirty_summary (verbatim git status --porcelain=v1
          output at launch), the launch commit, the implementation snapshot task
          and commit, the four governing-text hashes, every tool version from
          admission, every third-party distribution and version, and the inference
          block. Launch is refused if dirty_summary lists any path under
          implementation/typed/ or this file.
        snapshot: >-
          The snapshot archive that follows the run must declare IN path_sha256
          every file under the run directory (including sources/ and
          certificates/) and every file under
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/. Side fields such as
          run_artifacts_sha256 or source_sha256 are not verifier-bound
          (CORR-20260923-64ee17 C6) and do not satisfy this rule. Until such a
          snapshot verifies, no record may cite the run.
  
      D9_labelling:
        rule: >-
          Per CORR-20260923-187ea3 labelling_rule_for_any_citing_record, with the
          unit statement of CORR-20260923-f5f060. The rho column is named
          rho_ordinary_input, value 0.5 (the frozen rho_baseline), and is
          annotated as the ordinary-input cost exponent of a different problem.
          Every typed exponent column name ends in E_ASSUMES_AUXILIARY_INPUT and
          names its branch. Every row states per branch the input model, the
          condition label and the bits of d (change.D2_typed_costs). The table
          header cites DEC-20260802-204 B032-C7 and B032-C8. The phrase
          "identical accounting" does not appear in any artifact. The supply
          condition is stated in the header: every typed exponent is conditional
          on the named auxiliary input being supplied, which this experiment does
          not examine (IDEA-20260831-ccb587 unopened).
        unit_statement_beside_rho: >-
          (entry 11.) Printed verbatim in the typed_table header immediately
          beside rho_ordinary_input, and in the execution report: "The typed
          exponents are exponents of the leading step-count expressions of
          Cheon's Theorems 1 and 2. Each step is an exponentiation: the theorems
          carry an O(log p) group-operation factor (EUROCRYPT 2006) or an Exp_G(p)
          factor (J. Cryptology 2010). The typed exponents omit that factor and
          the O() constants, so they understate group-operation counts. The rho
          exponent counts group operations. The two units differ by a factor
          Theta(log r)." No artifact, report or citing record states that the
          typed exponents and the rho exponent are in the same unit.
        secondary_metric_scope: >-
          (entry 12, O3/S3.) The quantity "bits of the largest divisor of m_b not
          exceeding isqrt(r)" is reported on the MINUS branch only, labelled
          "arithmetic; on the minus branch it locates the divisor nearest the
          T_minus optimum". It is not computed or reported on the plus branch,
          where a divisor near sqrt(r) prices at T_plus >= d and is not a
          Theorem-2 quantity.
        applies_to: every artifact of the run, the execution report and any record that cites the run.
  
      D10_additivity:
        rule: >-
          This amendment is a new file and is never rewritten in place. Any later
          change is a new amendment file with a new id that cites this one. The
          run uses NEW implementation modules under
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/ and edits no existing
          implementation file, so the code of earlier runs stays recoverable. The
          subdirectory is new, rather than the d1d10/ subdirectory the refused
          predecessor named, so that no module of a refused design can be mistaken
          for one governed by this text.
  
    # ---------------------------------------------------------------------------
    # CONVENTIONS. Closure of the twelve choice points Q0-1 to Q0-12 of the
    # TASK-20260923-edaa75 rederivation report (DEC-20260923-a4c3d5 entries 5, 6).
    # ---------------------------------------------------------------------------
    conventions:
      Q0-1: >-
        C-FIELD integers are defined IN THIS TEXT by closed-form expressions
        (controls C-FIELD), not by reference to a file location. Their equality
        with the extracted field primes is a run-time gate, not their definition.
      Q0-2: >-
        Declared convention in change.D5_controls.expected_status_convention: the
        expected status of every construction-control branch is EXACT; the run
        observes the blind pipeline's status under 3600 seconds per integer; a
        difference fails the gate (N1).
      Q0-3: >-
        Declared convention in change.D1_pins.confounder_check.scope_on_controls_and_null_arm.
      Q0-4: >-
        "Candidates examined" by a search is the number of integers stepped in +1
        order from the search start up to AND INCLUDING the accepted one,
        counting every integer (even integers too), whatever an implementation
        skips, sieves or trial-divides. For nextprime_gt(x) the start is x + 1.
      Q0-5: >-
        DECLARED IMMATERIAL, with reason: every variant of the Baillie-PSW screen
        that never rejects a prime accepts the same first candidate, because
        acceptance additionally requires a certificate proof. Convention, to
        remove the choice anyway: a perfect square is rejected before the Lucas
        step; a Jacobi symbol (D/n) = 0 with |D| < n is a compositeness exit; any
        trial-division bound up to 2^16 may precede the screen; within one
        candidate the named integers are screened in the order the acceptance
        rule lists them. None of these can change an accepted integer or the
        count of Q0-4.
      Q0-6: >-
        DECLARED IMMATERIAL, with reason: any certificate the independent verifier
        accepts proves the same integer prime, so no reported integer, status or
        exponent depends on its form. Convention: the Pratt witness a is the
        smallest a >= 2 that satisfies the Pratt conditions; ECPP chains are those
        PARI primecert returns.
      Q0-7: >-
        Declared convention in definitions.minimiser_and_ties: the tie tolerance
        is relative in the exponent e.
      Q0-8: >-
        Declared convention in definitions.bins: the boundary tolerance tau is
        absolute in the depth s.
      Q0-9: >-
        Declared convention in definitions.gate_evaluation_mode.
      Q0-10: >-
        The null arm is NOT a declared control. Its integers are not control
        integers and are not fixed by this text (its bit classes come from Stage
        P). It is context (change.D4_calibration). The declared controls are
        exactly those listed in amendment.controls.
      Q0-11: >-
        Every reference in this file to another record, report or file (other
        than the primary-source files that Stage P reads by design, and the
        implementation paths it names) gives provenance only. Where a referenced
        record and this file's text could differ, this file's text governs, and no
        recipe, rule, tolerance or integer is taken from a referenced record.
      Q0-12: >-
        The field input_model is the literal string with the symbol d. The
        substituted value appears only in the separate field minimiser_d. No
        artifact substitutes d into the input-model string.
  
    # ---------------------------------------------------------------------------
    # TOOLS AND ADMISSION (D6, D7; entries 7 and 8).
    # ---------------------------------------------------------------------------
    tools_and_admission:
      ecm_backend:
        name: GMP-ECM (the ecm command-line program)
        minimum_version: 7.0.4
        version_command: >-
          printf '2^89-1\n' | ecm -c 1 2000 ; the version is the dotted triple
          that follows "GMP-ECM " at the start of the first line of standard
          output (the banner of a factoring call; "ecm -version" and
          "ecm -printconfig" are NOT used, since per VAL-20260923-c3c90c F-J1-2
          they do not report it).
        use: stage F3 of change.D6_factoring
      certificate_and_factoring_library:
        name: PARI/GP through cypari2 (in-process)
        minimum_version: PARI 2.13.0
        version_command: >-
          python3 -I -c "import cypari2; print(cypari2.__version__); print(cypari2.Pari()('version()'))" ;
          the PARI version is the first three integers of the second line.
        required_functions: [factor, primecert, primecertisvalid, alarm, version]
        use: stage F2 factoring, ECPP certificates, Pratt inputs, and path A high-precision evaluation
      pdf_text_extractor:
        name: pypdf (Python package)
        minimum_version: 3.0.0
        version_command: python3 -I -c "import pypdf; print(pypdf.__version__)"
        use: change.D1_pins.pdf_digit_check only
        provenance_note: The minimum version is this protocol's declared constant; that the package is named pypdf from 3.0.0 is recalled (pointer only). Admission decides.
      independent_verifier:
        name: experiments/EXP-AUXIN-7e2e3d/implementation/typed/cert_verify.py
        version: sha256 of its bytes at the launch commit
        dependencies: Python standard library only
      path_b_arithmetic:
        name: Python standard library (int, decimal with at least 150 digits, hashlib)
        minimum_version: Python 3.10
        version_command: python3 --version
        use: independent recompute of products, certificate verification, divisor enumeration, witness sets, typed exponents, bounds, depths and bins
      excluded_for_verdicts: sympy (no primality verdict, no factorization of record)
      admission_gate: >-
        Run BEFORE launch and written first into the run directory as
        admission_receipt.json. (1) Each named tool is present, its exact
        version_command output is recorded, and the parsed version meets the
        minimum. (2) ECM self-test: printf '(2^31-1)*(2^89-1)\n' | ecm -one -c 25 2000
        reports the factor 2^31-1 (decimal) within 600 seconds. (3) PARI alarm
        self-test: the GP expression alarm(1, while(1, )) returns an alarm error
        within 10 seconds of wall clock. (4) Certificate self-test: path A
        produces certificates for 2^89 - 1 and 2^607 - 1 and the independent
        verifier accepts both. (5) Tamper self-test: the verifier REJECTS the
        certificate of 2^89 - 1 with its top N replaced by 2^89 + 1. (6) The AST
        import audit of every module under implementation/typed/ passes
        change.D8_custody.import_rule, and cert_verify.py and every path B module
        import only the standard library. (7) The four governing-text hashes match
        trial-plan.json. (8) pdf_digit_check machinery self-test: the normalized
        text of sp800-186.pdf contains the string "discretelogarithm" (lowercase,
        whitespace removed).
      absence_rule: >-
        Any failure of the admission gate is an INFRASTRUCTURE STOP: the run is
        not launched, the probe output is reported as failed_infrastructure, and
        no other tool, version or verifier is substituted. It is never a result
        about any curve or about this amendment's mathematics. Provisioning the
        declared tools is not part of this text; their absence at execution is an
        infrastructure stop (REVIEW-AUXIN-20260926-2fc87b K-provision), and any
        executor card for a run under this amendment carries provisioning as a
        dispatch precondition.
  
    # ---------------------------------------------------------------------------
    # STAGES, in this order. No stage starts before the previous one is written.
    # ---------------------------------------------------------------------------
    stages:
      - id: A0_admission
        does: >-
          change.D8_custody.implementation_snapshot_and_launch_comparison, then
          tools_and_admission.admission_gate.
      - id: P_pin
        does: >-
          (P1) Verify every staged source digest (change.D1_pins.staged_source_binding).
          (P2) Retrieve and archive the two pinned-revision sources
          (change.D1_pins.retrieval_rule). (P3) Extract every r, field prime p and
          cofactor h by the parse rules, and every cross-source value. (P4) Run
          the PDF digit checks. (P5) Run C-FIELD, then C-FIELD-MUTATION; if
          either fails, stop (N2 or I_TEXT as stated there). (P6) Run the
          confounder check on every deployed r, prove each r prime, apply the
          family checks, write orders.json, then orders.json.sha256, and print the
          sha256 to stdout.log. No factoring of any r - 1 or r + 1 happens in this
          stage.
      - id: C_controls
        does: >-
          Construct C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL exactly per their
          recipes, run the confounder check on each constructed r, and write
          controls_construction.json. Factor both branches of each construction
          control blind through the change.D6_factoring pipeline, certify,
          evaluate on path A and path B, and apply every gate. Then evaluate the
          C-BOUND declared states on both paths and apply their gates. Write
          controls_receipt.json with its sha256 printed. If any gate fails on
          either path, stop (N1 or N4).
      - id: N_null_arm
        does: >-
          Sample, confounder-check, certify, factor, evaluate on both paths and
          bin every null-arm prime per amendment.null_arm. Write null_arm.json and
          print its sha256. Complete before any deployed factorization begins.
      - id: D_deployed
        does: >-
          Factor both branches of every pinned deployed row, in frozen-list order,
          certify, and evaluate on path A.
      - id: R_recompute
        does: >-
          Path B recomputes every deployed row (products, certificates, divisor
          enumeration, witness sets, typed exponents, bounds, minimisers,
          witnesses, depths, bins) and writes independent_recompute.json.
          Disagreement voids that branch.
      - id: T_table
        does: >-
          Emit typed_table.json with the labelling of change.D9_labelling, the
          deployed rows, the controls, the C-BOUND states and the null arm beside
          them, per stratum.
  
    # ---------------------------------------------------------------------------
    # CONTROLS. Recipes are complete; the integers are for reviewers to find.
    # ---------------------------------------------------------------------------
    controls:
      - id: C-PLANT-M
        kind: planted_positive_minus
        carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-PLANT-M], restated verbatim
        purpose: >-
          Known positive on the minus branch at deployed size: r - 1 carries a
          planted divisor at the Theorem-1 optimum, near sqrt(r - 1).
        search_start: >-
          S = isqrt(M0). d1 = nextprime_ge(isqrt(S)). d2 = nextprime_gt(d1).
          D = d1 * d2. u0 = ceildiv(M0, 2 * D).
        step_order: u = u0, u0 + 1, u0 + 2, ... (steps of +1 over the integers).
        primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
        acceptance_rule: >-
          Accept the FIRST u in step order such that u is prime, u differs from d1
          and from d2, r = 2 * D * u + 1 is prime, and v = (r + 1) / 12 is an
          integer and prime.
        window: >-
          d1 must lie in [isqrt(S), isqrt(S) + 2^24); d2 in (d1, d1 + 2^24);
          u in [u0, u0 + 2^48). r must have exactly B bits. Leaving any window is
          an infrastructure stop, not a negative.
        tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
        constructed_factorizations: r - 1 = 2 * d1 * d2 * u; r + 1 = 2^2 * 3 * v.
        gates:
          - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
          - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
          - Minus branch is EXACT, its reported minimiser lies in {D, (r - 1)/D}, and 0 <= e_minus - F_minus(r) <= 10^-6.
          - Minus branch bin is NEAR_FLOOR.
          - Plus branch is EXACT and its bin is NEAR_CEILING.
      - id: C-PLANT-P
        kind: planted_positive_plus
        carried_from: >-
          AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-PLANT-P], restated
          verbatim except the purpose label, changed from "Theorem-2 optimum" to
          "T_plus optimum" (RT-20260923-38bbbf O8/S8: the location is the optimum
          of the unit-constant leading expression T_plus, not of Cheon 2010's
          explicit count). The recipe and gates are unchanged.
        purpose: >-
          Known positive on the plus branch at deployed size, under the TYPED
          cost. The planted divisor sits at the T_plus optimum near
          ((r + 1)/4)^(1/3). A divisor near sqrt(r) would not be a positive under
          T_plus, because T_plus(d) >= d.
        search_start: >-
          d0 = icbrt(M0 / 4) (M0 / 4 is an integer). d = nextprime_ge(d0).
          w0 = ceildiv(M0, 12 * d).
        step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
        primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
        acceptance_rule: >-
          Accept the FIRST w in step order such that w is prime, w differs from d,
          r = 12 * d * w - 1 is prime, and q = (r - 1) / 2 is prime.
        window: >-
          d must lie in [d0, d0 + 2^24); w in [w0, w0 + 2^48). r must have
          exactly B bits. Leaving any window is an infrastructure stop.
        tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
        constructed_factorizations: r + 1 = 2^2 * 3 * d * w; r - 1 = 2 * q.
        declared_size_of_planted_divisor: d.bit_length() equals d0.bit_length() or d0.bit_length() + 1, and d is at least d0.
        gates:
          - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
          - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
          - Plus branch is EXACT, its reported minimiser equals d, and 0 <= e_plus - F_plus(r) <= 10^-6.
          - Plus branch bin is NEAR_FLOOR.
          - Minus branch is EXACT and its bin is NEAR_CEILING.
      - id: C-INERT
        kind: inert_on_both_branches
        carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-INERT], restated verbatim
        purpose: >-
          Known negative on both branches at deployed size. This is the PTM-2
          construction form of TASK-20260922-0e10d1 (r = 12w - 1 with w, (r - 1)/2
          and r prime), with the search start fixed by this text.
        search_start: w0 = 2^(B-4) (so 12 * w0 = M0).
        step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
        primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
        acceptance_rule: >-
          Accept the FIRST w in step order such that w is prime, r = 12 * w - 1 is
          prime, and q = (r - 1) / 2 = 6 * w - 1 is prime.
        window: w in [w0, w0 + 2^48). r must have exactly B bits. Leaving the window is an infrastructure stop.
        tie_breaks: none needed; the search returns the first acceptable candidate in a total order.
        constructed_factorizations: r - 1 = 2 * q; r + 1 = 2^2 * 3 * w.
        gates:
          - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
          - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
          - Minus branch is EXACT, its minimiser is the smaller member of the tied pair {2, q}, and its bin is NEAR_CEILING.
          - Plus branch is EXACT, its minimiser is the largest divisor of 12, and its bin is NEAR_CEILING.
      - id: C-PLANT-PL
        kind: planted_positive_plus_above_routing_size
        new_in_this_amendment: >-
          RT-20260923-38bbbf RC2 (DEC-20260923-a4c3d5 entry 14). A planted
          positive whose plus branch exceeds the 272-bit F2/F3 routing size, at the
          largest frozen size, with a planted divisor made of four primes that
          trial division cannot remove and GMP-ECM can find, so that the blind
          pipeline must pass through F3.
        purpose: >-
          Known positive on the plus branch at B_L = 521 bits, under the typed
          cost, exercising F0, F1, F3, large-prime certification and evaluation.
        search_start: >-
          x_L = icbrt(M_L / 4) (M_L / 4 is an integer). f1 = nextprime_ge(2^43).
          f2 = nextprime_gt(f1). f3 = nextprime_gt(f2). G = f1 * f2 * f3.
          y = ceildiv(x_L, G). f4 = nextprime_ge(y). D_L = G * f4.
          w0 = ceildiv(M_L, 12 * D_L).
        step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
        primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
        acceptance_rule: >-
          Accept the FIRST w in step order such that w is prime,
          r = 12 * D_L * w - 1 is prime, and q = (r - 1) / 2 is prime.
        window: >-
          f1 in [2^43, 2^43 + 2^24); f2 in (f1, f1 + 2^24); f3 in (f2, f2 + 2^24);
          f4 in [y, y + 2^24) and f4 > f3; w in [w0, w0 + 2^48). r must have
          exactly B_L bits. Leaving any window is an infrastructure stop, not a
          negative.
        tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
        constructed_factorizations: r + 1 = 2^2 * 3 * f1 * f2 * f3 * f4 * w; r - 1 = 2 * q.
        declared_properties: >-
          Stated in advance, each by an argument from the recipe alone.
          (a) ROUTING. f1, f2, f3, f4 and w all exceed 2^24, so F0 removes only
          2^2 * 3 from r + 1, and the remaining part f1*f2*f3*f4*w has more than
          272 bits (its log2 is about B_L - log2(12), far above 272), so the
          pipeline must send it to F3.
          (b) MINIMISER. D_L lies in [x_L, x_L * (1 + 2^-19)), because
          D_L = G * f4 >= G * y >= x_L and D_L < G * (y + 2^24) <= x_L + G * (1 + 2^24),
          where G is about 2^129 and x_L is about 2^172. And (r + 1)/4 differs
          from M_L/4 by a relative amount below 2^-290 (w < w0 + 2^48). So D_L is
          within a relative 2^-18 of the T_plus optimum x = ((r + 1)/4)^(1/3).
          Write T_plus(t*x) = x * (2/sqrt(t) + t), minimised only at t = 1 with
          value 3x. Every divisor of r + 1 is s * (product of a subset of
          {f1, f2, f3, f4}) * w^c with s | 12 and c in {0, 1}. With c = 1 the
          divisor exceeds w, which is above 2^300, so T_plus > 2^300. With c = 0
          and at most three of the f_i, the divisor is below 12 * 2^133, so
          t < 2^-35 and T_plus > 2^17 * x. With all four f_i the divisor is s * D_L,
          with t within 2^-18 of s, and 2/sqrt(t) + t is least at s = 1 (value
          3 + O(2^-36)), against at least 2/sqrt(2) + 2 > 3.41 for s >= 2. Hence
          the plus minimiser is D_L, uniquely, and e_plus - F_plus is below
          10^-6 by a wide margin.
          (c) MINUS BRANCH. r - 1 = 2q with q prime, so the minimiser is the
          smaller member of the tied pair {2, q}, and its depth is below 1/4 by
          the same inequality as C-BOUND BND-2 (argument there).
        gates:
          - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
          - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
          - factorizations.json records that the plus-branch part leaving F1 after F0 exceeded 272 bits and that at least one GMP-ECM curve was run on it in F3.
          - Plus branch is EXACT, its reported minimiser equals D_L, and 0 <= e_plus - F_plus(r) <= 10^-6.
          - Plus branch bin is NEAR_FLOOR.
          - Minus branch is EXACT, its minimiser is the smaller member of the tied pair {2, q}, and its bin is NEAR_CEILING.
      - id: C-BOUND
        kind: declared_state_bound_evaluator
        new_in_this_amendment: >-
          RT-20260923-38bbbf O9/RC1 and O10 (DEC-20260923-a4c3d5 entry 14); the
          declared-state BOUND evaluator control of H-AUXIN-6db354
          falsification_conditions item 5.
        purpose: >-
          Test the BOUND rules of change.D3_descriptive_bins (recorded parts,
          witness set, witness, bound pair, UNDETERMINED and bin_at_least) at
          values fixed by this text before the run. Each state is a DECLARED
          factorization state built from the certified construction integers of
          C-PLANT-M and C-PLANT-P. It is passed directly to the evaluator on path
          A and path B and never enters the factoring pipeline; a state that F0
          would never leave (small primes inside a part) is permitted because the
          control tests the evaluator, not the pipeline.
        inputs: >-
          From C-PLANT-M: r_M (its r), d1, d2, u and D = d1 * d2, with
          r_M - 1 = 2 * d1 * d2 * u. From C-PLANT-P: r_P (its r), d and w, with
          r_P + 1 = 12 * d * w. Every prime named below is certified by Stage C.
          Each part below is recorded with its compositeness witness
          (change.D7_certificates) and a perfect-power check.
        states:
          - id: BND-1
            type: single composite part, witness in e*C_b, near the floor (RT U1 type)
            row_and_branch: C-PLANT-M, minus (m = r_M - 1)
            declared_state: F = 2 * u with certified prime powers 2^1 and u^1; parts [D].
            expected: >-
              status BOUND. W = {e, e * D : e | 2u}. witness = the smaller of D and
              2u (they tie exactly, because D * 2u = m and T_minus(d) =
              T_minus(m/d)). upper bound = e_minus(witness). lower bound =
              F_minus(r_M). bin NEAR_FLOOR, boundary_flag false. CONSISTENCY: the
              upper bound equals, within 10^-50, the EXACT minus exponent of
              C-PLANT-M from the same stage (its minimiser lies in {D, 2u} by that
              control's gate).
            why_fixed_in_advance: >-
              D and 2u are both within a factor 1 + 2^-37 of sqrt(m) by the
              C-PLANT-M recipe (d1 and d2 lie within 2^25 of isqrt(S), about
              2^63, so D is within a relative 2^-37 of S = isqrt(M0), and
              2u = m / D), so the
              upper bound is within 10^-6 of the floor and its depth exceeds 3/4.
              Every other member of W has T_minus at least sqrt(m/(2u)) + sqrt(2u)
              or larger, by the symmetry of T_minus and the sizes of 1, 2, u, 2uD.
          - id: BND-2
            type: single composite part hiding the optimum (RT U2 type)
            row_and_branch: C-PLANT-M, minus (m = r_M - 1)
            declared_state: F = 2 with certified prime power 2^1; parts [d1 * d2 * u].
            expected: >-
              status BOUND. W = {1, 2, m/2, m}. witness = 2 (tied exactly with m/2;
              the smaller is reported). upper bound = e_minus(2). lower bound =
              F_minus(r_M). bin UNDETERMINED with bin_at_least NEAR_CEILING,
              boundary_flag false. The construction's true branch value is near the
              floor; the control checks that the evaluator never promotes a bound
              and never bins a hidden divisor.
            why_fixed_in_advance: >-
              C_minus - e_minus(2) = log2((sqrt(m) + 1)/(sqrt(m/2) + sqrt(2))) /
              log2(r_M), which is below 1/(2 log2(r_M)) + 2^-100. C_minus - F_minus
              = (log2(sqrt(m) + 1) - 1 - log2(m)/4)/log2(r_M), which exceeds
              (log2(m)/4 - 1)/log2(r_M) >= 62/log2(r_M) since m has 256 bits. So
              the witnessed depth is below 1/100, which is below 1/4 - tau.
          - id: BND-3
            type: TWO composite parts (RT U3 type; the O10 rule and PTM-E)
            row_and_branch: C-PLANT-P, plus (m = r_P + 1)
            declared_state: F = 2 with certified prime power 2^1; parts [2 * d, 3 * w].
            expected: >-
              status BOUND. W = {e * (product of S) : e | 2, S a subset of
              {2d, 3w}} = {1, 2, 2d, 4d, 3w, 6w, 6dw, 12dw}. witness = 2d. upper
              bound = e_plus(2d). lower bound = F_plus(r_P). bin NEAR_FLOOR,
              boundary_flag false. CONTRAST, stated so that a mis-implementation
              is visible: the superseded single-cofactor formula (C_b = 6dw,
              W = {1, 2, 6dw, 12dw}) would give witness 2 and bin UNDETERMINED;
              that result fails this gate.
            why_fixed_in_advance: >-
              d is within a relative 2^-60 of x = (m/4)^(1/3) by the C-PLANT-P
              recipe. With T_plus(t*x) = x * (2/sqrt(t) + t): 2d has t near 2 and
              T_plus near 3.414x; 4d has t near 4 and T_plus near 5x; 1 and 2 have
              T_plus above sqrt(m/2), near 2^127; 3w, 6w, 6dw and 12dw have
              T_plus above 3w, near 2^170. So the witness is 2d, uniquely. Its
              exponent exceeds F_plus by log2(3.415/3)/log2(r_P), below
              0.19/log2(r_P), while C_plus - F_plus exceeds
              (log2(m)/6 - 1)/log2(r_P) >= 41/log2(r_P). So the depth exceeds
              0.99, above 3/4 + tau.
        gates:
          - For each state, on path A and on path B, the evaluator returns exactly the expected status, witness set, witness, bin, bin_at_least (where stated) and boundary_flag.
          - For each state, both bounds equal the expected closed-form expressions within 10^-50, and the floor invariant holds.
          - BND-1 CONSISTENCY holds.
      - id: C-FIELD
        kind: field_prime_negative
        changed_from_d1d10_with_reason: >-
          (entries 4 and 5.) In the refused predecessor each case integer was
          defined by a file location, so the recipe was not determinate from the
          text (rederivation Q0-1), case 2 needed a representation choice
          (VAL-20260923-c3c90c choice C3), and the case and the value compared
          with it came from the same locator, so the control tested only equality
          wiring (F-J1-10). Here each case integer is a closed-form expression in
          this text, and its equality with the independently extracted field prime
          is a separate gate. The brainpoolP384r1 case is dropped because its
          field prime has no closed form and cannot be stated without a literal;
          that row remains covered by the confounder check, which applies to every
          row.
        cases:
          - id: CF-1
            value: 2^255 - 19
            presented_as: the r of row Ed25519-L (cofactor h printed, value 8 per the source)
            expression_provenance: >-
              Printed as "2^255 - 19" in inputs/SAFECURVES-20260825/specs/rfc7748.txt
              section 4.1 (read by this design session). In sp800-186.txt the
              same expression is printed with its superscript and minus sign lost.
            extraction_cross_check: CF-1 must equal the Ed25519-L field prime p extracted in P3 by PR-SP800 (hex form).
            expected_reasons: [field_prime, hasse]
          - id: CF-2
            value: 2^256 - 2^224 + 2^192 + 2^96 - 1
            presented_as: the r of row NIST-P-256 (cofactor h printed, value 1)
            expression_provenance: >-
              Recalled by this design session (provenance recalled). The
              sp800-186.txt P-256 block prints a damaged expression whose surviving
              exponents are 256, 224, 192 and 96 followed by 1, consistent with it.
              The extraction cross-check below is what the run relies on.
            extraction_cross_check: CF-2 must equal the NIST-P-256 field prime p extracted in P3 by PR-SP800 (hex form).
            expected_reasons: [field_prime]
        acceptance_rule: none; these are not searched.
        why_the_expected_reasons_are_fixed: >-
          Both expressions are prime (proved at run time under
          change.D7_certificates), so not_prime does not fire. field_prime fires
          on each because each equals a member of FP. For CF-1, h = 8 and r = p,
          so |p + 1 - 8p| = 7p - 1 exceeds 2*isqrt(p) + 2 and hasse fires. For
          CF-2, h = 1 and r = p, so |p + 1 - p| = 1 and hasse does not fire: on a
          cofactor-1 row the field_prime clause is the only separator
          (RT-20260923-38bbbf O15).
        gates:
          - Each case's extraction_cross_check holds. If it fails, the run stops in Stage P with outcome I_TEXT (see success_criterion).
          - Each case is REJECTED, before any factoring, with a recorded reason list exactly equal to its expected_reasons, in order, on the confounder check as written.
      - id: C-FIELD-MUTATION
        kind: confounder_check_mutation
        new_in_this_amendment: RT-20260923-38bbbf RC3 and VAL-20260923-c3c90c F-J1-10 (DEC-20260923-a4c3d5 entry 4).
        purpose: >-
          Show that C-FIELD tests the clause it claims to test. The same
          confounder-check implementation is run once more on CF-1 and CF-2 with
          clause (1) field_prime DISABLED by a parameter of that implementation
          (the only change), and nothing else altered.
        expected: >-
          CF-1 returns reasons [hasse] (still rejected). CF-2 returns an EMPTY
          reason list: it is ADMITTED, because on a cofactor-1 row nothing but the
          equality clause separates a field prime from r.
        gates:
          - The mutated check returns exactly the expected reason lists. Any other result is outcome N2.
          - The mutated check's results are written to confounder_receipt.json under a separate key and are never used to pin, admit or factor anything.
      - id: C-PRODUCT
        kind: arithmetic_product
        purpose: frozen spec control, unchanged.
        gates:
          - For every EXACT or BOUND branch of every row and control, F_b times the product of all recorded parts (1 if EXACT) equals m_b exactly, on path B.
      - id: C-RECOMPUTE
        kind: independent_recompute
        purpose: frozen spec control, strengthened by definitions.precision and change.D7_certificates.
        gates:
          - Path A and path B agree on every branch of every row within definitions.precision.
      - id: C-ORDER
        kind: ordering
        purpose: frozen spec control, strengthened.
        gates:
          - confounder_receipt.json, controls_receipt.json and null_arm.json exist, with their sha256 printed to stdout.log, before the first deployed factorization starts (timestamps in stdout.log and the stage order in execution-report.yaml).
    controls_distinctness: >-
      C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL are structurally distinct
      (their constructed factorizations differ in shape, and C-PLANT-PL has B_L
      bits), so their r values cannot coincide. The C-BOUND states reuse the
      C-PLANT-M and C-PLANT-P integers by design.
    what_the_controls_exercise: >-
      (entry 13, S2/O2.) C-PLANT-M, C-PLANT-P and C-INERT exercise, at B = 256
      bits, the EXACT path through F0, F1 and F2, certification and evaluation on
      three constructed shapes. C-PLANT-PL exercises, at B_L = 521 bits, the EXACT
      path through F0, F1 and F3, certification of primes up to that size and
      evaluation on one constructed shape. C-BOUND exercises the BOUND evaluator
      on three declared states, including two composite parts. C-FIELD and
      C-FIELD-MUTATION exercise the confounder check on two rows. No control
      exercises a BOUND state produced by the pipeline itself, F2 at a size other
      than 256 bits, or a pipeline-produced multi-part state; their correctness on
      the deployed rows is an assumption stated in interpretation_limits.
  
    # ---------------------------------------------------------------------------
    # NULL ARM (D4). Carried verbatim. Frozen sampler, size and seed labels.
    # ---------------------------------------------------------------------------
    null_arm:
      carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 null_arm, restated verbatim (the seed label is kept, so the arm is the one that text froze)
      bit_classes: >-
        The distinct exact bit lengths of the r values of the deployed rows pinned
        in Stage P. They are fixed by the primary sources, not by any outcome.
      size_per_class: 16
      sampler: >-
        For bit class L and index i = 0, 1, ..., 15: label is the ASCII string
        "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" followed by L in decimal, "/",
        and i in decimal, with no padding and no trailing newline.
        k = ceildiv(L, 8). X = the big-endian integer of the first k bytes of
        SHAKE-256(label), taken mod 2^(L-1). start = 2^(L-1) + X. The sample is
        nextprime_ge(start), searched upward by +1; if the search reaches 2^L it
        continues from 2^(L-1) upward.
      seed: The label prefix "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" is the seed. No other randomness is used.
      is_not_a_control: conventions.Q0-10
      pipeline: >-
        Identical to deployed rows. Confounder check (clause (1) against the whole
        set FP and clause (2); clause (3) does not apply, since a sample is no
        curve's order), certificate, full frozen factoring budget per branch,
        both paths, statuses, bounds, bins, stratum. A sample equal to a deployed
        r, or two equal samples, is kept and flagged.
      reported_beside_deployed: >-
        Per bit class and branch: the count of each status and bin, and the
        sorted list of exact exponents and of witnessed upper bounds. No
        statistic of the null arm enters any rule.
      disclosed_sampler_bias: >-
        nextprime of a uniform start weights each prime by the gap below it. This
        is a known small bias of the sampler and is disclosed, not corrected.
      size_disclosure: >-
        With 16 samples per class, any frequency read from the arm has a wide
        interval; this is one reason no rule reads it.
  
    # ---------------------------------------------------------------------------
    # PREDICTION, METRICS, BUDGET, STOPS, INVALIDATION, ARTIFACTS.
    # ---------------------------------------------------------------------------
    preregistered_prediction:
      quantity: the gate outcomes of C-PLANT-M, C-PLANT-P, C-INERT, C-PLANT-PL, C-BOUND, C-FIELD and C-FIELD-MUTATION
      formula: >-
        Every gate in amendment.controls holds on both paths. For the deployed
        rows and the null arm NO value is predicted; they are reported, not
        tested (H-AUXIN-6db354 predictions item 4).
      source: >-
        The analytic floors in definitions (exact minima of the two leading
        expressions), the constructed factorizations, and the arguments stated in
        each control. Not tuned after any run.
    metrics:
      primary:
        - per row and branch - status, typed exponent (EXACT) or bound pair (BOUND), minimiser or witness d in decimal, bits of d, input model, condition label, memory_elements_log2, and for the plus branch log2(2d)
        - per row and branch - depth s, bin, bin_at_least (BOUND), boundary_flag
        - per row and branch (BOUND) - the recorded parts and the witness set W_b
        - per construction control - every gate verdict on path A and on path B
        - per C-BOUND state - every gate verdict on path A and on path B
        - C-FIELD and C-FIELD-MUTATION - extraction cross-check verdicts, reason lists and gate verdicts
        - null arm - per bit class and branch, counts of statuses and bins
        - per row - pin record (spans, representation, cross-checks, PDF digit check), product check and path agreement verdicts
        - per prime - certificate kind, producing-library check, independent-verifier verdict
      secondary:
        - per integer and per part - seconds in each factoring stage F0 to F3, ECM curves per B1 level with sigma values, F2 alarms and F3 kills
        - per integer - recorded composite parts with bits, compositeness witnesses and perfect-power checks
        - per row, MINUS branch only - bits of the largest divisor of m_minus not exceeding isqrt(r) (EXACT), or of the largest such member of W_minus (BOUND, a lower bound), labelled per change.D9_labelling.secondary_metric_scope
        - per construction control - candidates examined in each search (conventions.Q0-4)
        - wall-clock per stage and peak RSS
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 8
      factoring_seconds_per_integer: 3600
      wall_clock_seconds_per_run: null
      wall_clock_note: >-
        Advisory, not a veto. Worst case is bounded by the number of factored
        integers (2 x (deployed rows + 4 construction controls + 16 x bit
        classes)) times 3600 seconds, plus construction, certification,
        retrieval and evaluation time. It is expected to be dominated by the
        largest bit classes, where integers are likely to spend the full budget.
        The C-PLANT-PL search examines many 521-bit candidates; its time is
        disclosed, not capped, beyond its window.
      construction_watchdog: >-
        Machine protection only. A control construction that has not finished its
        search within its declared window stops as infrastructure (the windows
        above).
      total_cpu_hours: null
    stopping_rules:
      - Implementation snapshot or launch comparison mismatch - do not launch; evidence-integrity failure.
      - Admission failure - do not launch; failed_infrastructure; nothing substituted.
      - Staged-source digest mismatch - stop in Stage P; evidence-integrity failure.
      - Pinned-revision source unreachable - stop in Stage P before any factoring; failed_infrastructure; nothing substituted.
      - C-FIELD extraction cross-check fails - stop in Stage P; outcome I_TEXT.
      - A C-FIELD case not rejected with exactly its expected reasons, or a C-FIELD-MUTATION result other than expected - stop in Stage P before any factoring; outcome N2.
      - Any control construction leaves its window - stop; failed_infrastructure (not negative).
      - A construction control rejected by the confounder check - stop; outcome I_CONTROL_COLLISION.
      - Any construction-control gate fails on either path - stop after writing controls_receipt.json; outcome N1; no null-arm or deployed factorization.
      - Any C-BOUND gate fails on either path - stop after writing controls_receipt.json; outcome N4; no null-arm or deployed factorization.
      - Any floor_invariant violation (change.D2_typed_costs) on any row or control, on either path - stop; outcome N3.
      - Governing-text hash mismatch, or a forbidden module detected, at any stage boundary - stop; evidence-integrity failure.
      - Per integer - stop factoring when its budget is spent; keep the certified partial factorization and the recorded parts; the branch is BOUND.
      - Memory protection or crash - checkpoint completed rows; incomplete rows are failed_infrastructure.
      - >-
        There is NO stop-and-escalate. Apart from the validity rules above (N3 and
        the VOID and UNPINNED statuses, which test the instrument on every row),
        no stop depends on any deployed-row or null-arm value. After Stage C
        passes, the package runs every null-arm and deployed row to completion.
      - Never execute Cheon's algorithms, never generate or consume any auxiliary power, never enter a protocol-supply stage.
    invalidation_rules:
      - All experiment.invalidation_rules of specification.yaml stand.
      - A pin not taken from its named source by its parse rule, or without recorded line numbers, verbatim span and file sha256 - that row is invalid_measurement.
      - A pin taken from any revision, mirror or document other than the one named - that row is invalid_measurement.
      - A field prime used as r (detected at any time) - that row is invalid_measurement; never negative, never inert.
      - Adding, dropping or reordering a deployed row after Stage P begins - invalid_measurement of the package.
      - Any control integer that differs from what its recipe text determines, any control built by an undeclared recipe, or any C-BOUND state other than those declared - invalid_measurement of the package.
      - Any evaluation of sqrt(m/d) + sqrt(d) on the plus branch in any artifact, any column combining the two branches, or any plus-branch value of the largest-divisor-below-isqrt(r) metric - invalid_measurement of the table.
      - A prime in an EXACT branch without an independently verified certificate - that branch is VOID.
      - Path A and path B disagreement - that branch is VOID.
      - Any edit of this file, of specification.yaml, of AMD-20260916-bands.yaml or of AMD-20260923-d1d10.yaml after approval - evidence-integrity failure.
      - A hashed artifact rewritten after hashing, or a self-hash of a deleted pre-image - evidence-integrity failure.
      - Launch with a dirty implementation/typed/ or dirty amendment path, or on implementation bytes that differ from the implementation snapshot - invalid_measurement of the package.
      - Any module loaded from inside the repository but outside implementation/typed/ - invalid_measurement of the package.
      - Any artifact stating that the typed exponents and the rho exponent share a unit, or using "identical accounting" - invalid_measurement of the table.
      - Timeout, crash, OOM, unreachable pinned source or tool absence - failed_infrastructure; never a mathematical negative.
    required_artifacts:
      - admission_receipt.json
      - launch_comparison.json
      - import_audit.json
      - manifest.yaml (with dirty_summary, launch commit, implementation snapshot, governing-text hashes, tool and distribution versions, inference block)
      - sources/ (the two retrieved pinned-revision files, the normalized PDF texts) and sources/retrieval.json
      - pdf_check.json
      - orders.json and orders.json.sha256
      - confounder_receipt.json (every candidate's ordered reason list; C-FIELD and C-FIELD-MUTATION results under separate keys)
      - controls_construction.json (recipe inputs, candidates examined, constructed factorizations)
      - controls_receipt.json (every construction-control and C-BOUND gate, both paths)
      - null_arm.json
      - factorizations.json (every integer, per-part and per-stage seconds, ECM curves, recorded parts and witnesses)
      - certificates/ (one file per certified prime, with producing-library and independent-verifier verdicts)
      - typed_table.json
      - independent_recompute.json
      - environment.json
      - command.txt
      - stdout.log
      - stderr.log
      - execution-report.yaml
      - implementation/typed/ (every module, cert_verify.py, run.py and trial-plan.json), all declared in the snapshot's path_sha256
  
    # ---------------------------------------------------------------------------
    # DECISION RULES.
    # ---------------------------------------------------------------------------
    success_criterion:
      outcomes:
        - id: S_VALID_TABLE
          kind: success
          condition: >-
            Launch comparison and admission passed; C-FIELD and C-FIELD-MUTATION
            met their gates; every gate of C-PLANT-M, C-PLANT-P, C-INERT,
            C-PLANT-PL and C-BOUND held on both paths; no floor_invariant
            violation; every deployed row is PINNED (or UNPINNED with a recorded
            source failure) and every pinned deployed branch is EXACT or BOUND
            with product check and path agreement; the null arm is complete;
            every required artifact is present.
        - id: S_PARTIAL_TABLE
          kind: success_with_voids
          condition: >-
            As S_VALID_TABLE except that one or more deployed branches are VOID
            under a validity rule. The void branches are listed with reasons. Not
            negative about any curve.
        - id: N1_INSTRUMENT_FALSIFIED
          kind: negative
          condition: >-
            Any gate of C-PLANT-M, C-PLANT-P, C-INERT or C-PLANT-PL fails on
            either path. The typed census pipeline (factoring, certification,
            evaluation or binning) is falsified at the size of the failing
            control, and no null-arm or deployed row is read.
        - id: N2_CONFOUNDER_CHECK_FALSIFIED
          kind: negative
          condition: >-
            A C-FIELD case is not rejected with exactly its expected reasons, or a
            C-FIELD-MUTATION result differs from its expected reasons. The pin
            confounder check is falsified; nothing is factored.
        - id: N3_FLOOR_VIOLATION
          kind: negative
          condition: >-
            Any reported exponent or bound lies below its branch's analytic floor
            (beyond the 10^-45 slack), or any evaluated T_plus(d) < d. The
            evaluator is falsified and the whole table is void.
        - id: N4_BOUND_EVALUATOR_FALSIFIED
          kind: negative
          condition: >-
            A C-BOUND state returns a status, witness set, witness, bound, bin,
            bin_at_least or boundary_flag other than the value this text fixes
            (H-AUXIN-6db354 falsification_conditions item 5). The BOUND rules are
            falsified and no null-arm or deployed row is read.
        - id: I_TEXT
          kind: text_defect
          condition: >-
            A C-FIELD expression differs from the field prime extracted for its
            row. This localises to this text's expression or to the extraction,
            and the run cannot tell which. Stop in Stage P. Not negative, not a
            result; the amendment returns to review.
        - id: I_CONTROL_COLLISION
          kind: text_defect
          condition: >-
            A construction-control integer is rejected by the confounder check.
            Stop. Not negative, not a result; the amendment returns to review.
        - id: I_INFRA
          kind: infrastructure
          condition: >-
            Launch-comparison or admission failure, staged-digest mismatch,
            unreachable pinned source, window exit, crash, timeout outside the
            per-integer budget, OOM, forbidden module or tool absence. Never
            negative.
      decidability: >-
        (F-J3-1, entry 15.) Each outcome is decided from the gate verdicts,
        statuses, validity rules and invariants in metrics.primary alone. The
        only way a deployed-row result enters an outcome is through the validity
        rules that test the instrument on every row: N3 (the floor invariant),
        VOID (which separates S_VALID_TABLE from S_PARTIAL_TABLE) and UNPINNED.
        None of these is a threshold on a deployed-row exponent, bound, bin or
        divisor, and no deployed-row value is compared with any cut-off chosen for
        it.
    falsification_criterion: >-
      The amended census instrument is falsified by N1, N2, N3 or N4. It is not
      falsified by any deployed-row or null-arm value, by a BOUND row, by an
      I_TEXT or I_CONTROL_COLLISION stop, or by an infrastructure failure.
    interpretation_limits:
      - >-
        A typed, labelled arithmetic table at the pinned frozen orders only. Each
        exponent is conditional on the named auxiliary input being supplied; this
        experiment does not examine supply (IDEA-20260831-ccb587 unopened).
      - >-
        Exponents are those of the leading expressions of Cheon 2006 Theorems 1
        and 2 without the log p factor or O() constant, as read per
        CORR-20260923-187ea3. They are Cheon's known exponent realised at
        specific integers, not a new algorithm, and they are in Cheon step units,
        not the rho unit (change.D9_labelling.unit_statement_beside_rho).
      - A BOUND row is a pair of bounds under the spent budget, never an exponent.
      - >-
        Bins are descriptive. No bin on any row is read as curve-specific, and the
        null arm is context, not a test. The earlier generic-bin reading of
        CORR-20260923-187ea3 and CORR-20260923-5c5a23 S3 rests on a 256-bit
        random-prime sample only and is not extended to other sizes by this text.
      - >-
        Control coverage is exactly amendment.what_the_controls_exercise. Passing
        it validates those paths at those sizes and states. Correct behaviour of
        the pipeline on deployed rows at bit lengths other than 256 and 521, on
        F3 at bit lengths other than 521, on pipeline-produced BOUND states and on
        F2 away from 256 bits is an assumption, most exposed where large rows are
        BOUND.
      - >-
        On the two pairing-family rows (BN254-r, BLS12-381-r) the family
        polynomials force divisors; deep values there are the expected case and
        are reported in their own stratum.
      - >-
        Nothing here concerns any claim outside experiment.claim_ceiling of
        specification.yaml, which stands unchanged, and the DEC-20260802-204
        acquisition gate stands.
      - >-
        This text does not assert that its controls discharge GOAL-AUXIN-a93442
        completion criterion 4, and it defines no trigger for pause condition 3.
        Every run package under this amendment goes to independent validation
        and red team before any further work on the goal, whatever its values.
  
    # ---------------------------------------------------------------------------
    # PROOF SEARCH MAP (inventor protocol section 8). Audits filled.
    # ---------------------------------------------------------------------------
    proof_search_map:
      not_applicable_reason: null
      bottleneck: >-
        Completeness of the factorizations of the largest rows within the frozen
        budget. It decides whether a branch is EXACT or BOUND, and a BOUND row can
        hide a deeper divisor than its witnesses show (C-BOUND BND-2 is the
        declared instance).
      baseline_embedding:
        parameter_slice: >-
          The minus branch with T_minus is exactly the frozen specification's
          cost_expression on r - 1, so the minus column reproduces the frozen
          quantity; F_minus is Cheon's balanced exponent on that branch, and
          F_plus is the minimum of Cheon's Theorem-2 leading expression.
        reproduction_check: >-
          C-PLANT-M must land within 10^-6 of F_minus at its planted divisor, and
          C-PLANT-P and C-PLANT-PL within 10^-6 of F_plus at theirs.
      observation_collision:
        observable: the per-branch typed exponent (or bound pair) and its bin
        distinct_preimage_search: >-
          Three collisions are named and separated. (1) The untyped frozen E(r)
          made the minus and plus problems collide in one number; the typed
          columns separate them. (2) An EXACT value and a BOUND upper bound can be
          equal; the status field separates them, and BND-1 forces exactly that
          case and checks both are reported with their statuses. (3)
          UNDETERMINED with bin_at_least NEAR_CEILING covers rows whose truth is
          near the floor as well as rows truly near the ceiling; status plus
          bin_at_least separates them, and BND-2 is the declared instance. Random
          primes producing the same bins as deployed rows are shown by the null
          arm, which is why no bin is read as curve-specific.
      constructive_transforms: []
      constructive_transforms_note: >-
        None proposed. The object is a measurement protocol, not a mechanism to
        improve.
      quantifier_order: >-
        For each deployed row r, fixed by its primary source (at a pinned revision)
        before any factoring, and for each branch b, under the fixed budget: the
        pipeline records F_b and its composite parts; then the evaluator outputs
        either the minimum of e_b over ALL divisors of m_b (EXACT) or the minimum
        over the witness set W_b generated by those recorded parts together with
        the floor F_b(r) (BOUND). The recorded parts are an outcome of the
        factoring run; W_b is a fixed function of them, stated before the run
        (O10). The input model is attached per branch (one power [x^d]P on minus;
        [x^i]P for i = 1..2d on plus). The table asserts nothing about whether
        any party supplies that input.
      method_ceiling:
        strongest_certifiable_claim: >-
          A certified, typed table of Cheon's known exponents at specific
          integers, conditional on supplied input. It cannot move any exponent
          (known prior art, DEC-20260802-208).
        nearby_object_control: >-
          The null arm (random primes of the same bit lengths, same pipeline),
          C-INERT, the three planted controls, the C-BOUND declared states, and
          C-FIELD with its mutation (a field prime presented as r).
      proof_obligations:
        - claim: For EXACT branches the divisor lattice is complete.
          responsibility: correctness
          discharged_by: C-PRODUCT, change.D7_certificates, C-RECOMPUTE
        - claim: For BOUND branches the witness set and bound pair follow the declared rule.
          responsibility: correctness
          discharged_by: change.D3_descriptive_bins, C-BOUND, C-RECOMPUTE
        - claim: The minus column equals the frozen quantity on r - 1.
          responsibility: baseline
          discharged_by: definitions.typed_costs and C-PLANT-M
        - claim: Each branch's cost and input model match Cheon 2006 Theorems 1 and 2.
          responsibility: interface
          discharged_by: change.D2_typed_costs, as read per CORR-20260923-187ea3 and RT-20260923-38bbbf; open to the J2 primary-source comparison
        - claim: No field prime is admitted as r.
          responsibility: correctness
          discharged_by: change.D1_pins.confounder_check, C-FIELD, C-FIELD-MUTATION
        - claim: No reading exceeds the typed arithmetic table.
          responsibility: scope
          discharged_by: change.D4_calibration, change.D9_labelling, interpretation_limits
  
    authorization: >-
      Upon approval by DEC-20260926-96f970 and not before, authorizes ONE new
      census package (maximum_runs 1) under EXP-AUXIN-7e2e3d version 1 as amended
      here, stated against H-AUXIN-6db354, where the fields of this amendment take
      precedence over every field they supersede. The package runs stages A0, P,
