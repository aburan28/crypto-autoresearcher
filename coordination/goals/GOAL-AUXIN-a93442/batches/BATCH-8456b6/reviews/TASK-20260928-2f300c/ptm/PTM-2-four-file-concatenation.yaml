      approval, which is envelope), "this protocol" and a reference of the form amendment.<path> mean the combined
      governing text: each leaf resolved through governing_text_table of this file, so a reference to a superseded
      field or span reads its latest replacement, and a reference to a path that has additions reads the union listed
      in path_additions. A bare path written in AMD-20260927-narrow.yaml that names one of its own blocks (span_rules,
      supersedes_fields, custody_consequences, corrective.*, incorporates.*, envelope_not_incorporated) means that
      block of AMD-20260927-narrow.yaml, except governing_text_table and precedence, which mean this file''s. References
      made inside the text of AMD-20260927-narrow.yaml or of this file are read as written: an incorporation by hash,
      and a reference to a field of the governing text, govern as that field governs; a reference to a decision, review,
      finding, design report or transcript gives provenance only. conventions.Q0-11 applies only inside the text of
      AMD-20260926-typed.yaml (span G-Q011).'
    precedence: 'Every leaf of the combined text has exactly one governing layer, named in governing_text_table of
      this file: v1 (specification.yaml), typed-by-hash (AMD-20260926-typed.yaml, bound by sha256 and incorporated
      through AMD-20260927-narrow.yaml), narrow-by-hash (AMD-20260927-narrow.yaml, bound by sha256 and incorporated
      through this file) or gated (this file). The layers are ordered v1, typed-by-hash, narrow-by-hash, gated. A
      leaf that a later layer supersedes is governed by the latest layer that supersedes it. A leaf superseded only
      in a span is split into a span row and an outside row, each with one layer. An ADDITION (an entry with adds_to)
      supersedes nothing: it is a leaf of the layer that states it, and the text read at the path it names is the
      UNION of the held field''s governing text and every addition to that path, cross-referenced in path_additions.
      No leaf is decided by reading two layers; a path is read across layers only as that union, and no union member
      overrides another.'
