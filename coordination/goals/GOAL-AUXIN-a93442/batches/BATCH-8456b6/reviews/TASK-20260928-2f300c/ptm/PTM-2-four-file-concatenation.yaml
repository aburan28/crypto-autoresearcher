    # ---------------------------------------------------------------------------
    # PRECEDENCE AND GOVERNANCE.
    # ---------------------------------------------------------------------------
    precedence: >-
      Every field the protocol reads has exactly one governing layer, named in
      governing_text_table: v1 (specification.yaml), refused-typed-by-hash
      (AMD-20260926-typed.yaml, bound by sha256 and incorporated through this
      file), or corrective (this file). No field is decided by reading two layers.
      A v1 field that the held text supersedes is governed by the held text; a
      held field or span that this file supersedes is governed by this file.
    governs_nothing:
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml (every field, every committed version; the held supersedes_fields last item)
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml (refused by DEC-20260923-a4c3d5; no field governs)
    does_not_rewrite:
      - experiments/EXP-AUXIN-7e2e3d/specification.yaml
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      - experiments/EXP-AUXIN-7e2e3d/implementation/ (every existing file)
      - experiments/EXP-AUXIN-7e2e3d/runs/ (every existing run)
      - ledger/hypotheses/H-AUXIN-6db354.yaml
      - ledger/goals/GOAL-AUXIN-a93442.yaml
    cites:
      - DEC-20260926-96f970 (the refusal whose DF-1 to DF-6 and RI-1 to RI-9 this file discharges)
      - DEC-20260927-35dc6c (the opening decision of BATCH-7b6678; scope fixed at the narrow corrective amendment)
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/rescope-ranking.yaml (ranking option 3)
