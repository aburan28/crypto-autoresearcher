      and execution-transcripts.json in the same directory (provenance only).
  
    authorization: >-
      This file authorizes NO run. If DEC-20260927-f680f7 approves it, the
      combined governing text (v1 as amended by the held text incorporated by hash
      and by this file) is an approved protocol under which a later Coordinator
      decision may mint an executor card for ONE census package (maximum_runs 1)
      running stages A0, P, C, N, D, R and T only. Under no outcome does it
      authorize running Cheon's algorithms, generating or using an auxiliary
      power, a protocol-supply audit, or stage2_protocol_supply_join.
      RUN-AUXIN-fd1edc and RUN-AUXIN-6117d3 are not rehabilitated. The first
      dispatch precondition of any executor card is an environment, outside the
      repository, that passes tools_and_admission.admission_gate as corrected
      here.
    non_claims:
      - AMD-20260927-narrow records no measurement and states no value for any curve; the held non_claims stay incorporated.
      - Design-time tool and locator executions are probes of the text's executability, not runs; no RUN-* id exists for them.
  
