      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
      - experiments/EXP-AUXIN-7e2e3d/implementation/ (every existing file; new code goes in the new subdirectory implementation/typed/, see change.D10_additivity)
