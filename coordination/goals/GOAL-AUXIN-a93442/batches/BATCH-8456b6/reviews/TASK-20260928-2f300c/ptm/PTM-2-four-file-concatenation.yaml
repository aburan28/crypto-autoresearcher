v1:
  experiment:
    id: EXP-AUXIN-7e2e3d
    hypothesis_id: H-AUXIN-66e6fd
    derived_from_idea: IDEA-20260831-df4197
    source_idea_ids:
      - IDEA-20260831-df4197
    question_id: RQ-AUXIN-f8d8c0
    goal_id: GOAL-AUXIN-a93442
    version: 1
    title: >-
      Exact r±1 divisor census and Cheon-expression table E(r) on a frozen
      standardized curve-order list
    status: approved
    frozen: true
    approved_by: coordinator
    approval_decision: DEC-20260913-515d80
    approval_basis: >-
      AGENTS.md standing user authorization dated 2026-09-06 for ideas and
      complete experiment design. Coordinator checked protocol completeness
      (inputs, controls, metrics, seeds, budget, stopping/invalidation,
      success/falsification, required artifacts). Approval is not evidence.
    assigned_to: executor
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Stage 0 pin and Stage 1 divisor census ONLY. Factor r-1 and r+1 for the
      frozen list plus the two synthetic controls; emit certificates and E(r).
      Do not run Cheon's algorithm, do not generate or consume [x^i]P, do not
      recover any discrete logarithm, do not audit protocols (that is
      IDEA-20260831-ccb587). Stage 2 protocol-supply join is NOT authorized.
    execution_authorized: true
    evidence_eligible: false
    execution_admission:
      currently_admitted: false
      requirements:
        - Verified snapshot archive of H-AUXIN-66e6fd, EXP-AUXIN-7e2e3d, DEC-20260913-515d80, TASK-20260913-e347cb on a published branch/PR
        - Implementation under experiments/EXP-AUXIN-7e2e3d/implementation/ with two independent arithmetic paths
        - Trial plan naming Stage 0 pin hashes and Stage 1 artifact paths
        - Fresh Executor claim via tools/goal_lanes.py before launch
    launch_gate:
      blocks_scientific_run_until:
        - Stage 0 order-pin artifact exists and is hash-committed before any factoring
        - Snapshot of this frozen contract is verified
        - Two arithmetic implementations are present and do not share factorization code
      does_not_block_protocol_approval: true
      note: >-
        scientific_execution_authorized is true because the census protocol is
        complete. Implementation and the Stage 0 pin are Executor deliverables.
  
    objective: >-
      Reduce the uncertainty whether any frozen standardized prime-order r
      carries a divisor of r±1 that makes the DEC-20260802-204 Cheon-type
      expression sit materially below the rho baseline 0.5. The measurement
      is exact integer arithmetic. Both a clean inert table and a named
      low-E(r) curve are first-class outcomes.
  
    what_this_is_not:
      - Not an ordinary-ECDLP improvement. DEC-20260802-204's acquisition gate stands.
      - Not a Cheon execution, discrete-log recovery, or timing of group operations.
      - Not a protocol-supply audit and not a vulnerability report.
      - Not evidence until runs exist under this contract.
      - Not authorization to interpret E(r) <= 0.40 as a break; that is stop-and-escalate.
  
    claim_ceiling:
      tier: crypto
      exact_scope_a_run_could_support: >-
        On the frozen list, with the pinned r integers, certified factorizations
        (or stated unfactored-cofactor bounds), and two independent evaluators
        agreeing: the table of E(r), minimizing d, and largest-divisor-below-sqrt(r)
        bits. WHAT DOES NOT FOLLOW: any ordinary-ECDLP claim; any statement that
        a deployed system is weak or safe; any claim about curves not on the list;
        any claim about protocols.
      explicitly_not_supportable_under_any_outcome: >-
        Ordinary ECDLP below rho; a vulnerability in ECDSA/Ed25519/P-256/etc.;
        novelty of Cheon's algorithm; closure of IDEA-20260831-ccb587.
  
    inputs:
      procedure: >-
        STAGE 0 (PIN, before any factoring). Copy the prime subgroup order r
        for each frozen curve name from the named primary source below. Do not
        use field primes. Confirm each r is an odd prime (or report the row
        UNPINNED and skip it). Write orders.json with decimal and hex r,
        source citation, and sha256 of the concatenation of all r values.
        Hash-commit that file before Stage 1. Choosing or dropping a curve
        after seeing a factorization invalidates the census.
        STAGE 1 (CENSUS, decisive). (1) Run the planted-divisor positive
        control and the safe-prime null control to completion; commit those
        verdicts before reading any deployed-curve E(r). (2) For each pinned
        r, factor r-1 and r+1, emitting a factorization certificate. (3)
        Enumerate every positive divisor of r-1 and of r+1 from the
        factorization (or from the factored part plus an explicit unfactored
        cofactor). (4) Evaluate expr(d, m) = sqrt(m/d) + sqrt(d) in exact
        rationals or with a stated decimal precision >= 80 bits, for every
        divisor d of m in {r-1, r+1}. (5) E(r) = min log2(expr) / log2(r).
        Record the minimizing (branch, d). (6) Independent second
        implementation recomputes every product check and every E(r).
        Disagreement invalidates the row. (7) Emit the table beside the rho
        baseline 0.5 at identical accounting.
      instrument: >-
        Exact integer arithmetic. Factoring may use a pinned open-source
        backend (recorded in the run manifest: name, version, command).
        Primality certificates may be BPSW plus a second check, or PARI/Sage
        certificates, recorded per factor. The second arithmetic path must
        not import the first factorizer; it may accept the factor list and
        independently prove product and primality and recompute E(r).
      parameters:
        frozen_curve_list:
          - id: NIST-P-224
            role: deployed
            r_pin_source: NIST SP 800-186 / FIPS 186-5 secp224r1 order n
          - id: NIST-P-256
            role: deployed
            r_hex_pinned_internal: FFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551
            r_pin_source: >-
              inputs/refs/research/p256_isogeny_class_invariance.md (internal,
              retrieved in this design). Stage 0 must still re-copy from
              SP 800-186 and confirm equality.
          - id: NIST-P-384
            role: deployed
            r_pin_source: NIST SP 800-186 / FIPS 186-5 secp384r1 order n
          - id: NIST-P-521
            role: deployed
            r_pin_source: NIST SP 800-186 / FIPS 186-5 secp521r1 order n
          - id: secp256k1
            role: deployed
            r_hex_pinned_internal: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141
            r_pin_source: >-
              experiments/EXP-CRYPTO-9225d2/specification.yaml arithmetic.curve.order_hex
              (internal). Stage 0 must still re-copy from SEC 2 and confirm equality.
          - id: brainpoolP256r1
            role: deployed
            r_pin_source: RFC 5639 brainpoolP256r1 order
          - id: brainpoolP384r1
            role: deployed
            r_pin_source: RFC 5639 brainpoolP384r1 order
          - id: Ed25519-L
            role: deployed
            r_pin_source: RFC 8032 / RFC 7748 prime-order subgroup L (not the field prime 2^255-19)
          - id: BN254-r
            role: deployed_pairing
            r_pin_source: >-
              BN(2,254) / alt_bn128 prime subgroup order from a named pairing
              standard or the Ethereum Yellow Paper appendix; not the field prime
          - id: BLS12-381-r
            role: deployed_pairing
            r_pin_source: BLS12-381 r from IETF draft-irtf-cfrg-pairing-friendly-curves or the Filecoin/Zcash pin, named in Stage 0
        confounder_field_vs_order: >-
          research/equation-schemes-20260905/parsed_safecurves.json lists FIELD
          PRIMES under curve names. Using those values as r is an invalid_measurement.
        cost_expression: expr(d, m) = sqrt(m/d) + sqrt(d)
        E_r: min over admissible (m, d) of log2(expr(d, m)) / log2(r)
        rho_baseline: 0.5
        factoring_seconds_per_integer: 3600
        e_inert_floor: 0.49
        e_escalate_ceiling: 0.40
  
    controls:
      - kind: positive_planted_divisor
        name: synthetic r with d = round(sqrt(r)) dividing r-1
        design: >-
          Construct an odd integer r_planted such that (i) r_planted is prime,
          (ii) d = round(sqrt(r_planted)) divides r_planted-1, (iii) bit length
          of r_planted is in [32, 64] so construction is cheap. Construction
          recipe (frozen): search seed 2026091301 upward for a prime q in
          [2^16, 2^20]; set d = q; search odd k near q so r = d*k + 1 is prime
          and |d - sqrt(r)| / sqrt(r) <= 0.02. If construction fails within
          10^6 trials, report infrastructure and do not read deployed rows.
          Expected E(r) in [0.24, 0.26]. Failure to recover d, or E(r) outside
          that band, voids every deployed-curve conclusion.
      - kind: null_safeprime_r_minus_1
        name: safe-prime r-1 branch
        design: >-
          Use a toy safe prime r_null (r-1 = 2q, q prime) with bit length in
          [16, 32], constructed from seed 2026091302 or a named small safe
          prime whose safeprimality is certified in the run. The r-1 branch
          has only divisors {1, 2, q, 2q} and must give
          log2(sqrt((r-1)/d)+sqrt(d))/log2(r) >= 0.49 at its minimum over
          those four. The r+1 branch is unconstrained and is NOT part of this
          control. A result < 0.49 on the r-1 branch falsifies the evaluator.
      - kind: arithmetic_product
        name: factors multiply back to r±1
        design: >-
          For every completed factorization, product of reported prime-power
          factors equals the integer exactly. Any mismatch invalidates that
          row. Unfactored cofactor C is allowed only if C > 1, C is composite
          under the stated tests, and the row reports E_bound, not E(r).
      - kind: independent_recompute
        name: second arithmetic implementation
        design: >-
          A second module, not importing the factorizer, recomputes product
          checks, primality of each reported factor, and E(r) from the factor
          lists. Disagreement invalidates the row.
      - kind: ordering
        name: verdict-on-controls-first
        design: >-
          Planted and safe-prime control verdicts are committed to
          controls_receipt.json before any deployed-curve E(r) is written.
  
    independent_variables:
      - name: curve_id
        values: [NIST-P-224, NIST-P-256, NIST-P-384, NIST-P-521, secp256k1, brainpoolP256r1, brainpoolP384r1, Ed25519-L, BN254-r, BLS12-381-r, PLANTED, SAFEPRIME]
      - name: branch
        values: [r-1, r+1]
      - name: factoring_budget_seconds
        values: [3600]
  
    metrics:
      primary:
        - E(r) per deployed curve, or E_bound with direction if an unfactored cofactor remains
        - minimizing branch and d
        - bits of the largest divisor of r±1 that is <= floor(sqrt(r))
        - planted-control E(r) and recovered d
        - safe-prime r-1 branch exponent
        - product-check pass/fail per row
        - independent-recompute agreement per row
      secondary:
        - full factor lists for r-1 and r+1
        - unfactored cofactor bit length, if any
        - wall-clock per integer and peak RSS
        - rho baseline 0.5 at identical accounting
        - optional modeled column log2(log2(r) * expr) / log2(r) labelled MODELLED_LOG_COFACTOR and never mixed into E(r)
  
    heuristic_under_test: null
    preregistered_prediction:
      quantity: E(r) table on the frozen list
      formula: >-
        E(r) = min_{d | (r-1) or d | (r+1)} log2(sqrt((r±1)/d) + sqrt(d)) / log2(r).
        Inert reading if every deployed E(r) >= 0.49. Escalate reading if any
        deployed E(r) <= 0.40. Pairing-friendly rows are expected to be the
        least inert; that is not a surprise finding.
      source: >-
        IDEA-20260831-df4197 claim and DEC-20260802-204 cost expression
        (internal). Not tuned after any run.
  
    scale_relevance:
      tier: crypto
      justification: >-
        Deployed 224–521-bit standardized orders plus pairing-friendly r.
        The quantity is exact at those integers; no transfer assumption is
        required. Toy-scale applies only to the two synthetic controls.
      correspondence: null
  
    tail_checks:
      - Report r-1 and r+1 separately; a missing branch voids the row.
      - Report unfactored cofactors; never drop a curve.
      - Report pairing-friendly rows with an expected-structure flag.
      - If any deployed E(r) <= 0.40, stop-and-escalate; do not write a vulnerability sentence.
  
    replication:
      seeds: [2026091301, 2026091302]
      independent_instances: 1
      note: >-
        Seeds construct the two synthetic controls only. Deployed r values
        are pinned constants, not seed-derived. The census is one scientific
        package (maximum_runs: 1) covering all rows.
  
    cost_model_disclosure:
      model: Cheon-expression / DEC-20260802-204
      unit: >-
        Dimensionless exponent E(r). The raw expr(d,m) is a modeled group-operation
        count up to a hidden constant; it is not measured on a curve.
      measured_vs_modelled: >-
        MEASURED: factorizations, product checks, primality certificates,
        wall-clock, peak RSS. MODELLED: expr(d,m) and E(r), which apply the
        frozen closed form to the measured divisor lattice. The two never
        share one unlabeled column.
      optimistic_assumptions:
        - >-
          E(r) uses expr without a log2(r) group-op cofactor. DIRECTION OF BIAS:
          understates Cheon 2006-style operation counts if that cofactor is
          real. Primary success/falsification does not use the cofactor column.
        - >-
          Treating O() as hiding only a constant. DIRECTION OF BIAS: may
          understate real implementation cost. This experiment does not run
          Cheon, so the bias does not affect the arithmetic census.
      memory_accounting: >-
        Peak RSS MEASURED during factoring. Analytic memory of Cheon tables
        O(max(sqrt(m/d), sqrt(d))) is MODELLED and optional; not a primary metric.
      hidden_overhead: >-
        One stubborn cofactor can consume the per-integer factoring bound.
        That is reported as an unfactored-cofactor bound, never hidden by
        dropping the curve.
      standardized_parameter_sets: >-
        The frozen_curve_list. Affected scope: none claimed. Safe scope: not
        a security statement.
  
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      total_cpu_hours: null
      maximum_memory_gb: 8
      maximum_runs: 1
      maximum_workers: 1
      protection_note: >-
        Memory and one-process workers are machine protection. Time/CPU
        estimates are advisory. The scientific package is one census of the
        frozen list plus two controls. factoring_seconds_per_integer is a
        stopping rule, not a research-budget veto.
  
    stopping_rules:
      - Stop Stage 1 deployed rows if either synthetic control fails; report the control failure; do not interpret deployed factorizations.
      - Stop a single integer at 3600 s of factoring; keep the partial factorization and emit E_bound.
      - Stop the package at maximum_runs or memory protection; checkpoint completed rows.
      - If any deployed E(r) <= 0.40 after controls pass, finish the remaining rows then stop-and-escalate; do not open a protocol audit in this experiment.
      - Do not enter a protocol-supply stage under this contract.
  
    invalidation_rules:
      - Timeout, crash, or OOM => failed_infrastructure; never a mathematical negative.
      - Using a field prime as r => invalid_measurement.
      - Dropping a frozen curve after seeing its factors => invalid_measurement.
      - Mixing modelled E(r) and measured factorizations in one unlabeled column => invalid_measurement.
      - Omitting r+1 => incomplete row, not a negative.
      - Ordinary-ECDLP improvement language in the run report => invalid_measurement (goal pause condition).
      - Overwriting this specification or a prior run receipt => evidence-integrity failure.
  
    success_criterion: >-
      Measurement success (either arithmetic shape): (1) Stage 0 pin complete
      for every frozen id or an explicit UNPINNED with source failure;
      (2) planted control recovers d and E(r) in [0.24, 0.26]; (3) safe-prime
      r-1 branch exponent >= 0.49; (4) every completed deployed row has
      product-check pass, independent-recompute agreement, both branches,
      and either E(r) or a stated E_bound; (5) required artifacts present.
      Inert reading: every deployed E(r) >= 0.49. Escalate reading: at least
      one deployed E(r) <= 0.40. Both readings are first-class measurement
      successes. Intermediate values are a complete table, not a failed test.
  
    falsification_criterion:
      - Planted control misses d or E(r) not in [0.24, 0.26] — evaluator void; no deployed conclusion.
      - Safe-prime r-1 branch exponent < 0.49 — evaluator void.
      - Product of reported factors != r±1 — that row void.
      - Independent recomputation disagrees — that row void.
  
    required_artifacts:
      - manifest.yaml
      - orders.json (Stage 0 pins, sources, sha256 commitment)
      - controls_receipt.json (planted and safe-prime verdicts, committed first)
      - factorizations.json (per curve, both branches, certificates or unfactored cofactors)
      - e_table.json (E(r) or E_bound, minimizing d, largest-divisor bits, rho 0.5)
      - independent_recompute.json
      - environment.json
      - stdout.log
      - stderr.log
      - command.txt
      - execution-report.yaml
  
    write_scope:
      - experiments/EXP-AUXIN-7e2e3d/implementation/
      - experiments/EXP-AUXIN-7e2e3d/runs/
  
    stages:
      - id: stage0_order_pin
        authorized: true
        claim_status: pin_only
        purpose: Bind exact r integers from named sources; hash-commit before factoring.
      - id: stage1_divisor_census
        authorized: true
        claim_status: adjudicable_arithmetic_table
        purpose: Controls then E(r) table on the frozen list.
      - id: stage2_protocol_supply_join
        authorized: false
        gated_on: Separate design of IDEA-20260831-ccb587 plus a superseding Coordinator decision
        purpose: Join released-power counts against this table. Not this experiment.
  
    derivation_provenance:
      tool: coordinator session, /design-experiment under standing user authorization
      source_record: IDEA-20260831-df4197
      reserved_ids_note: >-
        H-AUXIN-66e6fd and EXP-AUXIN-7e2e3d were reserved by DEC-20260905-1c2b01
        after BATCH-aedb4e failed to produce them. This design reuses those ids
        and does not remint.
      authored_at: '2026-09-13'
      note: >-
        Curve list, E(r) formula, three controls, and interpretation limits are
        taken from IDEA-20260831-df4197. Cost expression and acquisition gate
        from DEC-20260802-204. No run results invented. No Cheon execution.
  
    recorded_at: '2026-09-13'
typed:
  # =============================================================================
  # AMD-EXP-AUXIN-7e2e3d-20260926-typed -- versioned ADDITIVE protocol amendment
  # to EXP-AUXIN-7e2e3d, stated against H-AUXIN-6db354. It discharges every entry
  # of DEC-20260923-a4c3d5 undischarged_defects and carries forward what held in
  # the refused AMD-EXP-AUXIN-7e2e3d-20260923-d1d10.
  #
  # NEW FILE. It rewrites nothing. specification.yaml, AMD-20260916-bands.yaml
  # and AMD-20260923-d1d10.yaml stay byte-for-byte as committed. Any later change
  # to this text is a NEW file under a NEW id, never an edit of this one.
  #
  # SELF-CONTAINED. Every recipe, rule, formula, threshold, tolerance, gate,
  # convention and tool clause that governs a run is stated in this file. A
  # reference to another record or file gives provenance only (conventions.Q0-11).
  #
  # OUTCOME DISCIPLINE. This file states no census value, no minimising divisor,
  # no list of curves from any earlier reading, no reviewer finding value from
  # BATCH-ba0b0d or BATCH-09aadd, and no integer that any control recipe below
  # produces. Records are cited by id.
  # =============================================================================
  amendment:
    id: AMD-EXP-AUXIN-7e2e3d-20260926-typed
    experiment_id: EXP-AUXIN-7e2e3d
    hypothesis_id: H-AUXIN-6db354
    predecessor_amendment: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10
    predecessor_status: >-
