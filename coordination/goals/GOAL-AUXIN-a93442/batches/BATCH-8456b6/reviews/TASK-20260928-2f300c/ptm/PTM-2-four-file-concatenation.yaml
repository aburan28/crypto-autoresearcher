      generation or use of any auxiliary power, no protocol-supply audit, and no
      stage2_protocol_supply_join. It does not rehabilitate RUN-AUXIN-fd1edc or
      RUN-AUXIN-6117d3. The executor card is minted by a later decision, not
      here, and its first dispatch precondition is an environment that passes
      tools_and_admission.admission_gate.
    non_claims:
