            field_prime_label: p
            cofactor_label: h
            cross_source: none primary
            internal_consistency_only: specification.yaml frozen_curve_list[secp256k1].r_hex_pinned_internal is compared and the result recorded; it cannot pin
            pdf_digit_check: sec2-v2.pdf for r, p and h
          - id: brainpoolP256r1
            source: inputs/SAFECURVES-20260825/specs/rfc5639.txt, PR-RFC5639, curve brainpoolP256r1
            r_label: q
