        - item: RI-4
          field: none in this file
          declaration: >-
            Addressed in the design report's route_ruling, which names the
            superseded cost fields and lists the extensions not named in
            H-AUXIN-6db354. This file carries no route ruling.
        - item: "observation (not a DF or RI item): pypdf minimum"
          field: tools_and_admission.pdf_text_extractor.minimum_version
          declaration: >-
            Kept as written (pypdf 3.0.0). PyPI has no pypdf 3.0.0 release; the
            first 3.x release is 3.1.0 (execution-transcripts.json). The minimum
            still decides admission determinately, since every existing release
