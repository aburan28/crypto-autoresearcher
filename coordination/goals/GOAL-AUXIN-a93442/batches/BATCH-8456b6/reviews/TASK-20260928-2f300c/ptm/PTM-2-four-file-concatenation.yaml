            Each extracted field prime is proved prime at run time
            (change.D7_certificates); hence not_prime does not fire. Under the
            corrected FP each value is a member of FP, so field_prime fires. The
            hasse clause does not apply because no cofactor is presented.
          mutation_sensitivity: >-
            If FP omits the extracted field prime of any row, that row's case is
            admitted and the gate below fails with outcome N2. In particular an FP
            built from the two C-FIELD expression values only (reviewer mutation
            M-FP of DEC-20260926-96f970 DF-2) admits every case whose row's field
            prime is not one of those two values, and the gate fails. The
            design-time locator run evaluated both FP definitions against these
            cases (execution-transcripts.json, pin_locators.fp_and_mutation).
        C-FIELD_gates_added:
          adds_to: "controls[C-FIELD].gates"
          item: DF-2
          gates:
            - >-
              Each case of cases_extracted must be rejected before any factoring,
              and its recorded reason list under the confounder check as written
              must be exactly [field_prime]. Any other result is outcome N2
              (success_criterion N2_CONFOUNDER_CHECK_FALSIFIED reads "a C-FIELD
              case", which includes these cases).
            - >-
              Order of evaluation: the extraction_cross_check gate of every
              closed-form case (outcome I_TEXT on failure) is evaluated first, then
              the reason-list gates of all cases, closed-form and extracted. The
              results of cases_extracted are written to confounder_receipt.json
              under their own key.
  
      tools:
        certificate_and_factoring_library:
          minimum_version:
            item: DF-3
            value: cypari2 2.1.5 with its PARI library 2.15.4
            rule: >-
              Admission item (1) requires the cypari2 distribution version to be at
              least 2.1.5 and the PARI library version reported through it to be
              at least 2.15.4. cysignals has no minimum version; its version is
              recorded, and admission item (3) decides whether the installed
              cypari2 and cysignals pairing can be admitted.
          version_command:
            item: DF-3
            command: python3 -I -c "<program>" with <program> equal to corrective.tools.version_program
            parse: >-
              Standard output, split on LF with the final empty string after the
              last LF dropped, must be exactly three lines. Line 1 is the cypari2
              distribution version and line 3 the PARI library version; each must
              fully match [0-9]+\.[0-9]+\.[0-9]+ . Line 2 is the cysignals
              distribution version, recorded as printed. A non-zero exit status,
              another line count or a non-matching line 1 or 3 FAILS admission
              item (1). Versions are compared as integer triples.
            why: >-
              No cypari2 release executed at design time defines
              cypari2.__version__ (execution-transcripts.json,
              cypari2_builds.*.typed_version_command_as_held). The distribution
              version comes from importlib.metadata and the PARI version from
              Pari.version(), whose first three entries are the PARI version
              integers.
          declared_builds:
            item: DF-3
            declared_minimum: cypari2 2.1.5, cysignals 1.11.4, PARI 2.15.4 (bundled), CPython 3.12
            declared_latest: cypari2 2.2.4, cysignals 1.12.6, PARI 2.17.2 (bundled), CPython 3.12
            gp_builds_probed: gp 2.15.4 and gp 2.17.4 (built from source), gp 2.17.3 (Homebrew)
            note: >-
              These are the builds on which admission items (1), (3) and (4) and the
              timeout recognition of change.D6_factoring.timeouts were executed at
              design time. Admission decides for any other build. The pairings
              cypari2 2.1.5 or 2.2.0 with cysignals 1.12.6 pass item (1) and FAIL
              item (3) (the child dies by signal), so admission refuses them as an
              infrastructure stop.
          stack_allocation:
            item: RI-7
            rule: >-
              Every cypari2 Pari instance that path A uses (factoring, primecert,
              primecertisvalid and high-precision evaluation) is created as
              cypari2.Pari(size=2**27, sizemax=2**32): an initial PARI stack of
              2^27 bytes, allowed to grow to 2^32 bytes. A PARI stack overflow at
              that ceiling is a crash under stopping_rules, never a result.
        version_program: |-
          import importlib.metadata as m, cypari2; p = cypari2.Pari(); print(m.version('cypari2')); print(m.version('cysignals')); print('.'.join(str(int(x)) for x in p.version()[:3]))
        version_program_sha256: 5701a5e33b9bb8e413374fbdd4715ec3fc08f442d589a7080694b4eab0709dc5
        alarm_self_test_program: |
          import cypari2
          from cysignals.signals import AlarmInterrupt
          p = cypari2.Pari(size=2**27, sizemax=2**32)
          for e in ('alarm(1, while(1, ))', 'alarm(1, factor(nextprime(2^140)*nextprime(2^141)))'):
              try:
                  p(e)
                  print('RETURNED')
              except AlarmInterrupt:
                  print('ALARM')
          print(p('2+2'))
        alarm_self_test_program_sha256: fb9b43c9ba30c664e436a6ef945fd0ca6a3a3196773b1be15dde8aefe6075776
        program_hash_convention: sha256 of the UTF-8 bytes of the string value as a YAML safe loader returns it (the second program ends with one LF, the first with none).
        admission_gate_items_added:
          adds_to: tools_and_admission.admission_gate
          item: RI-7
          items:
            - >-
              (9) Execution audit. The AST audit of admission item (6) also FAILS if
              any module under implementation/typed/ calls exec, eval, compile or
              __import__, imports runpy, or uses importlib other than
              importlib.metadata. Code from any repository file outside
              implementation/typed/ is never executed by any route, whether import,
              exec or loading by path.
            - >-
              (10) Environment location. The resolved sys.prefix of the admitted
              interpreter and the resolved file path of every installed
              third-party distribution module lie OUTSIDE the repository working
              tree. An environment inside the repository fails admission, because
              its modules would be both allowed (import_rule class b) and
              forbidden (inside the repository, outside implementation/typed/).
  
      custody:
        run_entry_sys_path:
          adds_to: change.D8_custody.import_rule
          item: RI-7
          rule: >-
            Under python3 -I the directory of run.py is NOT on sys.path (executed
            at design time on CPython 3.10 and 3.12; execution-transcripts.json,
            isolated_mode_sys_path). run.py therefore inserts the absolute path of
            experiments/EXP-AUXIN-7e2e3d/implementation/typed/ at sys.path[0]
            before its first import of any module under that directory, importing
            only sys and os before doing so. That is the only change to sys.path
            the run makes, and it is recorded in import_audit.json.
        invalidation_rules_added:
          adds_to: invalidation_rules
          rules:
            - Any edit of AMD-20260927-narrow.yaml after approval - evidence-integrity failure.
            - Any byte difference between AMD-20260926-typed.yaml and the sha256 in incorporates.sha256 - evidence-integrity failure.
  
      bin_by_status:
        replaces: change.D3_descriptive_bins.bin_by_status
        item: DF-6
        text: >-
          For every branch of every deployed row, construction control, C-BOUND
          state and null-arm sample, three fields are reported: bin, bin_at_least
          and boundary_flag, each with exactly the value given here. EXACT: bin is
          given by definitions.bins; bin_at_least equals bin; boundary_flag is as
          definitions.bins defines it. BOUND: let s be the depth of the witnessed
          upper bound and boundary_flag the flag that definitions.bins computes on
          s. If boundary_flag is false and s >= 3/4 + tau, bin is NEAR_FLOOR and
          bin_at_least is NEAR_FLOOR (the true value is at least as deep).
          Otherwise bin is UNDETERMINED and bin_at_least is the bin that
          definitions.bins gives an EXACT value of depth s (so a witnessed depth
          within tau of 3/4 gives UNDETERMINED, bin_at_least INTERMEDIATE and
          boundary_flag true). VOID: bin, bin_at_least and boundary_flag are all
          null. UNPINNED rows have no branches and report none of the three. This
          clause and definitions.bins never give two answers, and no status and
          bin combination leaves bin_at_least undefined.
        totality_table:
          - {status: EXACT, bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR}
          - {status: EXACT, bin: INTERMEDIATE, bin_at_least: INTERMEDIATE}
          - {status: EXACT, bin: NEAR_CEILING, bin_at_least: NEAR_CEILING}
          - {status: BOUND, bin: NEAR_FLOOR, bin_at_least: NEAR_FLOOR}
          - {status: BOUND, bin: UNDETERMINED, bin_at_least: "INTERMEDIATE or NEAR_CEILING (the EXACT bin of s)"}
          - {status: VOID, bin: null, bin_at_least: null}
          - {status: UNPINNED, bin: none reported, bin_at_least: none reported}
  
      interpretation_limits_item_6:
        replaces: interpretation_limits item 6 (the item beginning "On the two pairing-family rows")
        item: DF-5
        text: >-
          BN254-r and BLS12-381-r are reported in their own stratum
          (expected_structure_flag true, change.D3_descriptive_bins.stratification).
          No status, bin, depth or other category is predicted for them, and no
          value on them is read as family-caused.
        reading_of_the_held_stratification_parenthetical: >-
          The parenthetical in change.D3_descriptive_bins.stratification (the two
          rows "whose family polynomials force divisors, CORR-20260923-187ea3")
          stays incorporated. It fixes stratum MEMBERSHIP only and cites the
          record behind that membership. It predicts no category and licenses no
          family-caused reading; the item above governs how those rows are read.
        not_edited: >-
          H-AUXIN-6db354 interpretation_limits, from which the replaced sentence was
          imported, is not edited by this file; its correction is a later card.
  
      threshold_inventory_added:
        adds_to: change.D4_calibration.threshold_inventory
        item: RI-5
        constants: >-
          Admission timeouts: 600 seconds for the ECM self-test (item 2) and 10
          seconds of wall clock for the alarm self-test child (item 3); the alarm
          length A = 1 second inside that self-test. Minimum tool versions: GMP-ECM
          7.0.4; cypari2 2.1.5 with PARI 2.15.4; pypdf 3.0.0 (held); Python 3.10.
          PARI stack: initial 2^27 bytes, ceiling 2^32 bytes. The screen's optional
          trial-division bound of at most 2^16 (conventions.Q0-5). PR-SEC2's
          continuation minimum of 4 characters. PR-EIP197's required match count
          of exactly one. The PDF short-string length 20 of
          corrective.pins.pdf_digit_check_weakness (a reporting label, no stop).
          Expected sha256 digests and byte counts of the two pinned-revision files
          (equality tests, no cut-off). No constant in this list reads a
          deployed-row or null-arm outcome, and each was fixed before any such
          outcome existed.
  
      falsification_condition_mapping:
        item: RI-1
        rule: >-
          Each falsification condition of H-AUXIN-6db354 (in its listed order,
          FC1 to FC6) is mapped to the outcome of this protocol that decides it.
          None is retired. Two are demoted, with reason.
        rows:
          - fc: FC1 (a constructed control fails a gate)
            outcome: N1_INSTRUMENT_FALSIFIED
            status: kept
          - fc: FC2 (a field prime presented as r is admitted)
            outcome: N2_CONFOUNDER_CHECK_FALSIFIED
            status: demoted in part
            reason: >-
              The controls can present only field primes that the text or Stage P
              makes available: the two closed-form C-FIELD cases and every
              extracted field prime (cases_extracted). A field prime of a curve
              outside the frozen list, or one no locator extracts, cannot be
              presented, so FC2 is decided for the extracted set only. A deployed
              row whose own r equals a member of FP is invalid_measurement for that
              row (held invalidation rule), not N2.
          - fc: FC3 (a reported exponent or bound below its analytic floor, or T_plus(d) < d)
            outcome: N3_FLOOR_VIOLATION
            status: kept
          - fc: FC4 (reported prime factors of an EXACT branch do not multiply back)
            outcome: >-
              N1 when the branch belongs to a construction control (its EXACT gate
              fails); for a deployed or null-arm branch the product check makes
              the branch VOID (C-PRODUCT; held invalidation rules), which gives
              S_PARTIAL_TABLE
            status: demoted
            reason: >-
              On a deployed or null-arm branch a product mismatch shows a defect in
              that branch's factorization record, not in the instrument as a whole,
              so the held text voids the branch instead of falsifying the
              instrument. On construction controls, where the correct factorization
              is fixed by the recipe, it falsifies the instrument as H states.
          - fc: FC5 (a declared-state BOUND evaluator control returns a value other than the one fixed)
            outcome: N4_BOUND_EVALUATOR_FALSIFIED
            status: kept
          - fc: FC6 (a row omits either branch)
            outcome: >-
              The row is incomplete, not negative. specification.yaml tail_checks
              item 1 (v1, "a missing branch voids the row") makes each omitted
              branch VOID, which gives S_PARTIAL_TABLE; an omission caused by a
              crash is I_INFRA.
            status: kept (as H states it, incomplete and not negative)
  
      reviewer_convention_zero_runs:
        item: RI-9
        convention: >-
          At zero runs a reviewer reads each gate that needs a pipeline
          factorization (the blind EXACT status of a construction control, the F3
          routing observation of C-PLANT-PL) as a RUN OBSERVATION. Its text is
          judged determinate when the expected value is fixed by the text alone
          (change.D5_controls.expected_status_convention); whether the pipeline
          attains that value is not reviewable before a run and is neither a
          pass nor a break of the text.
  
      declared_not_superseded:
        - item: "RI-3 (C-PLANT-PL tolerance)"
          field: "controls[C-PLANT-PL].declared_properties"
          declaration: >-
            The phrase giving an absolute tolerance on s is kept. The declared
            property is a design statement read by no gate; C-PLANT-PL's gates
