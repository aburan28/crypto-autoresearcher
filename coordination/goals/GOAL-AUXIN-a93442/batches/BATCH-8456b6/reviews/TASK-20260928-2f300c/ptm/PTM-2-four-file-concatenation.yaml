      - It does not discharge, and relies on no reading of, GOAL-AUXIN-a93442 completion criterion 4 or pause condition 3 (see the design report's goal_text_questions).
narrow:
  # =============================================================================
  # AMD-EXP-AUXIN-7e2e3d-20260927-narrow -- versioned ADDITIVE corrective
