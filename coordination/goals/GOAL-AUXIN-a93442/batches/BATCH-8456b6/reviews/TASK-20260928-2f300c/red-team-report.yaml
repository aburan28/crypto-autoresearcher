red_team_report:
  id: RT-20260928-150e1c
  task_id: TASK-20260928-2f300c
  claim_under_review: >-
    For my joints only. EJ3: every reference written inside a transcluded span
    resolves under F-READ R1 to R6 to exactly one referent in EXP-AUXIN-edd104
    and that referent decides every run-time question as the held referent did.
    EJ5: no envelope_or_layering row carries a run-time rule the successor does
    not state elsewhere; every read-together group reproduces its held
    path_additions item; F-PREC's "none overrides" decides each such path as
    held precedence did. EJ6: EXP-AUXIN-edd104 incorporates nothing, supersedes
    no held field, no run-time decision depends on the content of any
    EXP-AUXIN-7e2e3d file (the CD-6 form); F-PREC, F-APPROVAL, F-CUSTODY,
    F-WRITE, F-REV, F-PRE and F-H agree with the transcluded rules beside them;
    no normative clause reads the threshold index.

  custody_of_inputs: >-
    Before relying on any input, my own code (rt_audit.py) recomputed the
    sha256 of the four producer files in the working tree and at 7170c2974b,
    and of the six held files at bb75521b79; every value equals the one in
    review-plan.yaml object_under_review. The plan file hashes to the value the
    task card names. DEC-20260928-2afb23 staged copy hashes to the value the
    plan names.

  # -------------------------------------------------------------------------
  # EJ3 -- REFERENCE RESOLUTION UNDER F-READ.  Verdict: breaks.
  # -------------------------------------------------------------------------
  EJ3:
    verdict: breaks
    method: >-
      Enumerated every entry's text by the token classes the plan names
      (this file, this amendment, this text, this protocol, the combined text,
      amendment.<path>, experiment.<path>, held file names, record ids, layer
      names, predecessor paths, positional words, layering-machinery names) and
      added "this contract"/"this frozen contract", which the plan's list does
      not name. For each hit I stated the held referent (under gated
      reading_of_self_references, narrow incorporates.reading_of_self_references
      and typed conventions.Q0-11) and the F-READ referent (which rule fires,
      which leaf_map row), then looked for a run-time question that reads
      through a marked row. Census by class and source is in
      computations.json EJ3.token_census.
    breaks:
      - id: EJ3-B1
        kind: a reference with two referents under F-READ, deciding a run-time validity question differently
        where: >-
          T-0617 (narrow corrective.custody.invalidation_rules_added rules item 2:
          "Any byte difference between AMD-20260926-typed.yaml and the sha256 in
          incorporates.sha256 - evidence-integrity failure") and T-0658 item 2
          (gated custody_additions.invalidation_rules_added: byte difference
          between AMD-20260927-narrow.yaml and "the sha256 in
          incorporates_by_hash.sha256 of AMD-20260928-gated.yaml"). Both are
          stated members of the invalidation_rules read-together group.
        resolution: >-
          The referenced fields are rows narrow:incorporates.sha256 and
          gated:incorporates_by_hash.sha256, both not_stated_envelope_or_layering.
          F-READ R3 says two things about them. Its envelope sentence: "the
          reference gives provenance only, except that a sha256 or byte count
          written there is a datum about that source blob" (reading A: the hash
          is a datum; the rule has a comparand and can fire). Its closing
          sentence: references "to incorporates or incorporates_by_hash,
          provenance only" with no datum exception (reading B: no comparand; the
          rule is vacuous). F-READ states no order between its own sentences.
        held_referent: >-
          The incorporation hash, which governed (narrow incorporates.hash_check,
          gated incorporates_by_hash.hash_check: hash before any use, stop on
          mismatch). Both hash_check leaves are dropped as envelope in the
          successor; the invalidation rules that read their hash fields are kept.
        situation: >-
          After EXP-AUXIN-edd104 is approved, the working-tree bytes of
          experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml differ
          from the recorded incorporation hash (a line-ending normalisation, or a
          branch on which that file was touched), while the bytes of the
          successor file and every span recomputed from blobs at bb75521b79
          (F-CUSTODY) are unchanged. Reading A: the package is
          invalid_measurement (evidence-integrity failure). Reading B: no rule
          fires on this. Held reading for EXP-AUXIN-7e2e3d: evidence-integrity
          stop. Same state, two different validity outcomes for the successor.
        interacts_with: >-
          R1 moves T-0396's "Any edit of this file ... after approval" from the
          held typed file to the typed-sourced entries of the successor, so under
          reading B nothing in the successor reacts to an edit of the held typed
          file. Under reading A, T-0617 still does (see EJ6-B1).
      - id: EJ3-B2
        kind: a reference no F-READ rule resolves, with two natural referents deciding a launch gate differently
        where: >-
          T-0471, v1 launch_gate.blocks_scientific_run_until item 2, stated:
          "Snapshot of this frozen contract is verified".
        resolution: >-
          R1 and R2 list "This file", "This amendment", "this text", "this
          protocol", "the combined text" and "the combined governing text".
          "This frozen contract" is not among them, and it is not a field
          reference (R3), a Q0-11 case (R4 applies to typed spans only), a path
          (R5) or a decision or layer name (R6). Referent 1: the v1
          specification, the frozen contract the span was written in (the R1
          analogue). Referent 2: EXP-AUXIN-edd104 (the R2 analogue).
        held_referent: The v1 specification of EXP-AUXIN-7e2e3d, that experiment's own frozen contract.
        situation: >-
          EXP-AUXIN-edd104 is approved under F-APPROVAL, but no snapshot of the
          contract file has been verified at experiments/EXP-AUXIN-edd104/ (the
          design report says placement is "a later archived act"). Referent 1:
          the gate is already open, because the v1 specification's snapshot was
          verified long ago. Referent 2: the gate is closed until the successor's
          own snapshot verifies. In the held stack the gate tested the governing
          experiment's own contract, so only referent 2 keeps its held function,
          and nothing in F-READ selects it.
    marked_rows_without_a_constructed_break:
      - id: EJ3-M1
        entries: [T-0467]
        note: >-
          v1 execution_admission.requirements item 1 requires a verified
          snapshot archive of H-AUXIN-66e6fd, EXP-AUXIN-7e2e3d,
          DEC-20260913-515d80 and TASK-20260913-e347cb. Read literally, these
          are the predecessor's approval chain and the v1 hypothesis, not
          H-AUXIN-6db354 (which F-H binds) or the successor's own records. R6
          also makes the DEC and TASK references provenance only in v1 text.
          The held function (the governing experiment's own approval chain is
          archived) is therefore either trivially met or vacuous. Its run-time
          effect is mostly absorbed by F-APPROVAL, which already requires the
          approving decision's ledger archive to be verified, so I construct no
          separate break. It compounds EJ3-B2: under R6 plus referent 1 of
          T-0471, no transcluded launch or admission gate requires the
          successor's own contract snapshot.
      - id: EJ3-M2
        entries: [T-0475, T-0474, T-0482, T-0551, T-0467]
        note: >-
          R6 applies "a reference to a decision ... gives provenance only" to
          spans from every source, v1 included. The held gated reading applied
          that rule only to text of narrow and gated (and Q0-11 only to typed);
          v1 text was read as written. So T-0475's "DEC-20260802-204's
          acquisition gate stands" was a binding pointer in the held stack and
          is provenance only in the successor. DEC-20260802-204 is outside my
          read scope, so whether any run-time decision reads through that gate
          is not determined here (recorded under could_not_check).
      - id: EJ3-M3
        entries: [T-0553, T-0143, T-0149, T-0150]
        note: >-
          Under R1, "this file" in T-0553 (narrow custody_consequences.rule:
          spans superseded "ONLY to add this file to the hash set") means the
          narrow-sourced entries of the successor. The hash set it explains
          (T-0143, T-0149, T-0150) names the held file AMD-20260927-narrow.yaml.
          So one held referent now splits into two objects. No run-time decision
          reads T-0553 directly.
      - id: EJ3-M4
        entries: [T-0473]
        note: >-
          The stated v1 launch_gate.note says "scientific_execution_authorized is
          true because the census protocol is complete". Only R3 keeps this from
          being an execution-authorization statement of the successor: the bare
          path resolves to envelope row v1:scientific_execution_authorized, so it
          is provenance only. It holds under F-READ, but only through one clause
          of R3, and any executor tooling that reads the contract text without
          F-READ would misread it.
    rows_that_hold:
      - R1 "this file" in typed spans (T-0015, T-0019, T-0170, T-0396) and narrow spans resolves to the same-source entries, matching the held rule that a replacement keeps the file it is written in. T-0019's staged-file hashes are all in the typed-sourced entry itself.
      - R2 phrases ("this amendment", "this text", "this protocol", "the combined text"; typed, narrow and gated spans) map to this contract, as held mapped them to the combined governing text. Where "this amendment" concerns approval, F-APPROVAL transcluded_conditions supplies the held envelope meaning (T-0616 and T-0658 "after approval" read as approval of EXP-AUXIN-edd104).
      - The six amendment.<path> references in typed spans (T-0120, T-0125, T-0168, T-0205, T-0346, T-0451) resolve through leaf_map to rows that are all stated or grouped. R2 and R3 overlap on them without a stated order, but both give the same entries here.
      - experiment.<path> references in typed spans (T-0387, T-0452) are provenance only under R4 and Q0-11, as they were in the held stack, and the v1 leaves they name (invalidation_rules items, claim_ceiling) are stated in their own right.
      - Positional words resolve within one source, and the successor keeps each source's order (checked, for example, for the D6 pipeline and its curves-per-level table, and for T-0569 with the expected-digest entries above it).
      - R5 paths all lie under experiments/EXP-AUXIN-7e2e3d/implementation/ or .../implementation/typed/ and agree with F-WRITE. None names another experiment's runs tree.
      - Layer names are provenance under R6. T-0651's "the layer governing_text_table names" resolves to leaf_map through R3. The index text is non-normative anyway.

  # -------------------------------------------------------------------------
  # EJ5 -- NOTHING NORMATIVE DROPPED, NOTHING OVERRIDDEN.  Verdict: holds.
  # -------------------------------------------------------------------------
  EJ5:
    verdict: holds
    verdict_basis: >-
      Neither breaking artifact was produced. No dropped envelope clause permits
      a run-time behaviour the held text forbade, and no read-together path
      holds conflicting texts that held precedence resolved by layer order:
      held gated precedence itself says "no union member overrides another",
      which is F-PREC's rule. Two non-breaking defects are recorded below. One
      of them makes the joint's literal sub-claim "every group reproduces its
      held path_additions item" false for two groups; I report it rather than
      absorb it.
    method: >-
      Resolved the held effective text of every not_stated_envelope_or_layering
      row with my own resolver and scanned it for normative words (must, shall,
      only, refuse, stop, invalid, fail, before, unless, conditioned on, never,
      authorize, may not). For every group of rows that carries such a clause I
      named the successor entry or fresh field that states it, or recorded it
      as dropped together with what a run could now do
      (computations.json EJ5.disposition_of_normative_envelope_groups). A few
      approved_by and whole-file rows did not resolve as values; they carry no
      clause. Read-together groups were compared item by item with held gated
      path_additions (path, order, additions, read_as).
    dropped_or_replaced_clauses:
      - id: EJ5-D1
        clause: typed does_not_rehabilitate (held layer typed-by-hash, governing in the held stack) and the matching sentences of the typed, narrow and gated authorization, saying RUN-AUXIN-fd1edc stays invalid as evidence and RUN-AUXIN-6117d3 stays void.
        successor: stated by no entry and no fresh field.
        run_time_effect: >-
          None found. No stage, gate, stop or validity rule of the protocol
          reads a prior run, so a run can do nothing it could not do before.
          The loss is to evidence interpretation: the successor contract no
          longer says those runs stay unrehabilitated.
        is_breaking_artifact: false
      - id: EJ5-D2
        clause: narrow incorporates.hash_check and gated incorporates_by_hash.hash_check (hash the incorporated files before any use; mismatch is an evidence-integrity stop before Stage A0 completes).
        successor: replaced by F-CUSTODY's recomputation of every span_sha256 from blobs at source_commit before Stage A0 completes.
        run_time_effect: >-
          For the successor's own meaning, nothing is lost: its text does not
          depend on working-tree bytes of held files. The replacement leaves
          T-0617 and T-0658 reading hash fields whose governing counterpart was
          dropped, which is EJ3-B1.
        is_breaking_artifact: false
      - id: EJ5-D3
        clause: typed, narrow and gated authorization (one census package, stages A0 P C N D R T only, no Cheon, no auxiliary power, no supply audit, no stage2 join, admission gate as first dispatch precondition).
        successor: >-
          Stated elsewhere. Budget maximum_runs in T-0363 and T-0533; typed
          stages T-0202 to T-0208; v1 stage2 authorized false in T-0550;
          stopping rule 16 in T-0386; F-PRE together with T-0201. What approval
          of the successor authorizes is left to a later decision (fresh
          authorization plus F-APPROVAL), which is conservative.
        is_breaking_artifact: false
      - id: EJ5-D4
        clause: typed not_superseded, does_not_rewrite and non_claims (held layer typed-by-hash, i.e. governing), plus narrow and gated "held non_claims stay incorporated".
        successor: >-
          Stated elsewhere: v1 claim_ceiling, what_this_is_not, invalidation
          rules, budget and stage rows are stated; F-WRITE is an exclusive write
          scope covering the does_not_rewrite set; T-0386, T-0476, T-0477 and
          T-0453 cover the non_claims. The v1 write_scope (predecessor
          implementation and runs) is replaced by F-WRITE, which is deliberate
          for a new EXP id.
        is_breaking_artifact: false
    read_together:
      summary: >-
        Every held path_additions item has a group, with the same path, in the
        same order, read as a union. Every held addition is covered by the
        group's entries. F-PREC's "none overrides another" matches held gated
        precedence verbatim in substance.
      defects:
        - id: EJ5-G1
          path: controls[C-BOUND]
          held_addition: gated:corrective.c_bound_gating.expected_value_source
          successor_addition: T-0648, which states the whole gated:corrective.c_bound_gating leaf
          consequence: >-
            The union read at controls[C-BOUND] includes every sub-field of
            c_bound_gating, not only expected_value_source. Those sub-fields
            govern as their own leaf in the held stack and in the successor, so
            the governing text is the same set. I found no run-time question on
            which the wider union decides differently.
        - id: EJ5-G2
          path: corrective.bin_by_status of AMD-20260927-narrow.yaml
          held_addition: gated:corrective.errata_declarations item 1
          successor_addition: T-0654, which states the whole errata_declarations leaf (all ER items)
          consequence: >-
            The union read at bin_by_status carries every erratum. The other
            items are "see" pointers or reading declarations that supersede
            nothing and define no bin, so F-BOUND-CONSTRUCTED's use of
            corrective.bin_by_status gives the same values. No run-time
            difference found. The cause is leaf granularity: the builder states
            errata_declarations as one entry, so a group cannot name item 1.
    completeness: >-
      Every entry id named by a leaf_map row (entries and replaced_by_entries)
      or by a group exists, and every entry is assigned by a stated row. The
      same check detects PTM-4.

  # -------------------------------------------------------------------------
  # EJ6 -- A NEW EXPERIMENT, NOT A FIFTH LAYER; THE SURFACE AROUND IT.
  # Verdict: breaks (on the run-time independence clause and on a fresh field
  # that contradicts a transcluded rule; NOT on the layer form).
  # -------------------------------------------------------------------------
  EJ6:
    verdict: breaks
    layer_form: >-
      Holds. The criterion is layer iff (L1) an incorporation block gives
      another file's bytes governing force, or (L2) there is supersession
      machinery (supersedes_fields, span_rules, gated_span_rules), or (L3) a
      precedence rule orders two or more governing files. Applied to the draft's
      own governing structure, all three are false: F-PREC names no layers and
      says the file is the only governing text. Incorporation phrases inside
      spans (T-0653, T-0625) are provenance under R3. PTM-1 confirms the
      criterion classifies AMD-20260928-gated as a layer on all three. The CD-6
      form in the design report's stop_assessment (no incorporation, no
      supersession) therefore holds.
    breaks:
      - id: EJ6-B1
        kind: a run-time decision of the successor that changes when a held file changes and the successor does not; and a transcluded rule contradicting F-PREC
        where: >-
          Custody and invalidation entries, all stated and kept "unchanged" by
          F-CUSTODY ("Every hash the transcluded custody entries require is kept
          unchanged"):
          T-0143, T-0144, T-0145 (trial-plan.json records the sha256 of
          specification.yaml, AMD-20260916-bands.yaml, AMD-20260923-d1d10.yaml,
          AMD-20260926-typed.yaml and AMD-20260927-narrow.yaml; the run
          recomputes all five at launch and at every stage boundary and stops on
          any mismatch);
          T-0149, T-0150, T-0152 (manifest records "the five governing-text
          hashes"; launch is refused if dirty_summary lists either amendment
          file);
          T-0656, T-0657 (the sha256 of AMD-20260928-gated.yaml is recorded
          "apart from the five governing-text hashes" and recomputed at every
          stage boundary; a mismatch is the stop of stopping_rules item 12
          ("Governing-text hash mismatch"); launch is refused if dirty_summary
          lists it);
          T-0396, T-0616, T-0658 item 1 (any edit of specification.yaml,
          AMD-20260916-bands.yaml, AMD-20260923-d1d10.yaml,
          AMD-20260927-narrow.yaml or AMD-20260928-gated.yaml after approval,
          which F-APPROVAL reads as approval of EXP-AUXIN-edd104, is an
          evidence-integrity failure);
          T-0617, T-0658 item 2 (under reading A of EJ3-B1).
        dependence_test: >-
          Hold the successor's bytes fixed, so every span still verifies against
          its blob at bb75521b79 under F-CUSTODY, and change
          AMD-20260928-gated.yaml in the working tree or in a commit before
          launch. Result: launch is refused (dirty_summary), or the run stops at
          the next stage boundary (stopping rule 12), or the package is invalid
          (T-0658), even though no rule of EXP-AUXIN-edd104 changed meaning. The
          same holds for each of the other five held files named above. So the
          successor's outcome depends on the bytes of EXP-AUXIN-7e2e3d files.
          This is the first breaking artifact of the joint, word for word.
        contradiction: >-
          F-PREC says "This file is the only governing text of EXP-AUXIN-edd104"
          and that the held records are "sources that spans were copied from,
          nothing more". The stated T-0149 and T-0656 call five held files "the
          five governing-text hashes", and T-0382 treats their mismatch as a
          governing-text mismatch. F-PREC also says "No other fresh field changes
          what a transcluded entry decides", so neither F-PREC nor F-CUSTODY can
          re-label those hashes as provenance, and F-CUSTODY explicitly keeps
          them.
        narrowest_fix_class: >-
          Not mine to design. Under F-REV any fix is a new successor contract.
          One form such a contract could take: custody binds only the successor
          file plus the span check at source_commit, with the held-file hashes
          either not carried or declared as provenance data that no stop reads.
      - id: EJ6-B2
        kind: a fresh field that contradicts a transcluded rule, with F-PREC forbidding the fresh field to prevail
        where: >-
          T-0158, typed change.D10_additivity.rule, is stated (a leaf_map row of
          type stated): "This amendment is a new file and is never rewritten in
          place. Any later change is a new amendment file with a new id that
          cites this one." Under F-READ R2, "This amendment" means this
          contract. F-REV says: "No amendment layers this contract. A change of
          any kind ... is a new successor contract under a new EXP id."
        why_it_is_a_break: >-
          The two texts give incompatible revision routes for EXP-AUXIN-edd104
          (a new amendment file citing it, against a new EXP id with no
          amendment). F-PREC gives fresh priority only to F-N4,
          F-BOUND-CONSTRUCTED and F-INDEX, and says "No other fresh field
          changes what a transcluded entry decides", so F-REV cannot override
          T-0158 and the contract leaves the conflict open. F-WRITE itself cites
          T-0158 as operative ("as the transcluded change.D10_additivity.rule
          ... states"). The consequence is the one F-REV exists to prevent:
          T-0158 licenses a later amendment layered on EXP-AUXIN-edd104, which
          reopens the layering route this draft was built to close.
        run_time_relevance: >-
          It is not a run-time decision. It meets the joint's second breaking
          artifact ("a fresh field that contradicts a transcluded rule"). The
          'stated once' test (S1/S2) does not see it, because both texts are
          stated leaves rather than a superseded leaf stated twice. It was found
          by reading references (EJ3 R2), not by that test.
    surfaces_disclosed_not_counted_as_breaks:
      - id: EJ6-S1
        topic: leaf_map as copy or dependency on gated's governing_text_table (PD-F3)
        finding: >-
          A copy. The rows sit in the successor. No clause consults gated's
          table at run time, because R3 maps any reference to a held
          governing_text_table onto leaf_map. Changing gated's table with the
          successor fixed would change no successor decision. Whether the copy is
          faithful is EJ2/EJ7.
      - id: EJ6-S2
        topic: F-WRITE and the predecessor implementation directory
        finding: >-
          The successor's implementation and custody objects live under
          experiments/EXP-AUXIN-7e2e3d/implementation/typed/ (T-0144
          trial-plan.json, T-0146 import rule, T-0147 snapshot comparison,
          T-0153 post-run snapshot, T-0614 sys.path). That directory does not
          exist today. EXP-AUXIN-7e2e3d's own v1 write_scope still covers
          experiments/EXP-AUXIN-7e2e3d/implementation/ (in force for that
          experiment under PA-8456b6-T1 T4). So a write on the predecessor's
          side into implementation/typed/ would change the successor's
          implementation set, and T-0147 would refuse launch on an extra file.
          This is the same class as EJ6-B1 through implementation files, and the
          plan's prior anticipated it as a disclosed surface. It adds no
          separate break.
      - id: EJ6-S3
        topic: F-CUSTODY against stopping rule 12 and the launch checks
        finding: >-
          Consistent. The added successor_contract_sha256 routes a mismatch to
          stopping rule 12. The span check runs "before Stage A0 completes",
          matching T-0147's launch-comparison timing, and the dirty_summary
          refusal follows T-0152's pattern. The only inconsistency is EJ6-B1's
          retained held hashes.
      - id: EJ6-S4
        topic: F-H
        finding: >-
          Consistent. The binding to H-AUXIN-6db354 reads through the transcluded
          falsification-condition mapping only (FC1 to FC5 narrow rows and the
          FC6 outcome from gated). The DEC-20260926-96f970 correction condition
          is stated, and that decision's next_actions item 2 concerns
          interpretation_limits, which the mapping does not read. H-AUXIN-6db354
          status is proposed and it is not edited.
      - id: EJ6-S5
        topic: F-PRE and F-APPROVAL
        finding: >-
          F-PRE's cited sha256 of DEC-20260927-f680f7
          dispatch_preconditions_carried recomputes exactly. F-APPROVAL's
          transcluded_conditions supplies a single reading for "after approval"
          in T-0616 and T-0658.
      - id: EJ6-S6
        topic: F-INDEX readers
        finding: >-
          No normative clause reads the threshold index. A generic-wording scan
          ("every/each/all/any cut-off, threshold or constant", "listed
          cut-offs", "the index/inventory", "constants above/below") outside the
          index entries hits only T-0109 (a mathematical "constants above 1") and
          T-0445 ("no deployed-row value is compared with any cut-off chosen for
          it", about cut-offs in general, not the index). The parent-path
          references to change.D4_calibration (T-0011, T-0168, T-0465) cite it as
          provenance for negative statements or proof obligations and decide
          nothing from index content. Limitation: this is a pattern and path
          scan, not a proof.

