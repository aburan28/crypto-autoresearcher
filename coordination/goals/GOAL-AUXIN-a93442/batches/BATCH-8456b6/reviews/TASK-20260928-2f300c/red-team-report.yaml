  objections:
    - EJ3-B1: F-READ R3 gives the held incorporation hashes both a datum reading and a provenance-only reading, and the stated invalidation rules T-0617 and T-0658 decide package validity differently under each.
    - EJ3-B2: the phrase 'this frozen contract' in stated launch gate T-0471 has no F-READ rule. Its two natural referents open or close the launch gate on the same state.
    - EJ6-B1: stated custody and invalidation rules, kept unchanged by F-CUSTODY, make the successor's launch, stage progression and validity depend on the bytes of six EXP-AUXIN-7e2e3d files, and call five of them governing texts, against F-PREC.
    - EJ6-B2: stated T-0158 (a later change is a new amendment file citing this one) contradicts F-REV, and F-PREC forbids F-REV to prevail. The contract carries two incompatible revision routes, one of which reopens layering.
