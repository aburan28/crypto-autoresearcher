# Pre-registered BEFORE ej4_states.py was first run (TASK-20260928-e2cfcf, EJ4).
# Reviewer-evaluation mode only (F-BOUND-CONSTRUCTED). Symbolic parts only; no
# integer, witness integer or depth is written here.
declared_bound_state:
  id: BND-V1
  declared_by: TASK-20260928-e2cfcf (validator)
  mode: reviewer-evaluation (outside the protocol; no run reads it)
  row_and_branch: C-PLANT-M, minus (m = r_M - 1), from the C-PLANT-M recipe (r_M - 1 = 2 * d1 * d2 * u, D = d1 * d2)
  declared_parts:
    F: d1 * u, with certified prime powers d1^1 and u^1
    composite_parts: [2 * d2]
    product_check: F * (2 * d2) = 2 * d1 * d2 * u = m
    well_formedness: 2 * d2 is composite and not a perfect power; d1 and u are prime (C-PLANT-M acceptance rule)
  expected_before_evaluation:
    source_status_witness_set_witness: change.D3_descriptive_bins (status_of_a_branch, recorded_parts, explicit_witness_set, values_by_status) and definitions.minimiser_and_ties
    source_bin_fields: corrective.bin_by_status of AMD-20260927-narrow.yaml, on the witnessed depth
    status: BOUND
    witness_set: '{1, d1, u, d1*u, 2*d2, 2*D, 2*d2*u, m}'
    witness: u (tied exactly with 2*D, since u * 2D = m and T_minus(x) = T_minus(m/x); the tie rule reports the smaller, u)
    upper_bound: e_minus(u)
    lower_bound: F_minus(r_M)
    bin: NEAR_FLOOR
    bin_at_least: NEAR_FLOOR
    boundary_flag: false
    reasoning: >-
      T_minus(u) = T_minus(2D) = sqrt(2D) + sqrt(u). By the C-PLANT-M recipe 2u
      lies within a factor 1 + 2^-37 of D, so T_minus(u) is about
      (sqrt 2 + 1/sqrt 2) sqrt(D), against the real minimum 2 m^(1/4), about
      2 sqrt(D). So e - F is about log2(1.0607)/log2(r_M), while C - F exceeds
      62/log2(r_M): the witnessed depth exceeds 0.99, above 3/4 + tau and not
      within tau of 1/4 or 3/4. Every other member of W is at least a factor
      2^60 from sqrt(m). Each field therefore has exactly one value.
  question_tested: whether any field of this state admits two expected values under the rules F-BOUND-CONSTRUCTED names
