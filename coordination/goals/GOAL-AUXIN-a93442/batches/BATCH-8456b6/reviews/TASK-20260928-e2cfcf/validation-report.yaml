    EJ4:
      verdict: holds
      summary: >-
        F-N4's biconditional holds against the transcluded texts it reads
        with. On every case of a 145-case truth table over BND-1, BND-2,
        BND-3 and one validator-declared state, the N4 condition as F-N4
        states it and stopping rule 10 agree (0 disagreements). Every field
        F-N4 names is compared by some gate: gate 1 compares status, witness
        set, witness, bin, bin_at_least and boundary_flag; gate 2 compares
        both bounds and the floor invariant; gate 3 is BND-1 CONSISTENCY.
        gate_evaluation_mode makes a path disagreement fail C-BOUND. No gate
        failure exists without a differing field. F-BOUND-CONSTRUCTED gave
        exactly one value for every field of the declared state.
      method:
        - The composed gate-1 text in the draft (typed gate plus G-GATE1) was
          confirmed to read that the evaluator "returns exactly the expected
          status, witness set, witness, bin, bin_at_least and
          boundary_flag". Every reads_with target of F-N4 and
          F-BOUND-CONSTRUCTED is a stated leaf_map row (gates 2 and 3, stop
          rule 10, the N4 condition, gate_evaluation_mode, decidability,
          invalidation rule 6, the D3 BOUND rules, narrow bin_by_status, and
          the gated c_bound_gating block).
        - C-PLANT-M and C-PLANT-P were built from their recipes with own
          code (own Baillie-PSW, checked against sympy; integer Newton cube
          root). Recipe windows hold. Only commitments are recorded.
        - BND-1, BND-2 and BND-3 were evaluated with own D3 BOUND rules and
          bin_by_status at high precision. Each matches its expected block on
          status, witness set, witness, bin, bin_at_least, boundary_flag and
          both bounds, and BND-1 CONSISTENCY holds.
        - Validator-declared state BND-V1 (a C-PLANT-M state that bins
          NEAR_FLOOR, with the witness set and witness forced by an exact
          tie) was written to ej4_declared_state.yaml before the first
          successful evaluation (sha256 cbdd5437...624f, 2026-09-29T05:21:40Z).
          The evaluated values equal the declared values field by field, and
          no field admits two values.
        - The truth table crosses every F-N4 field with differs/equal on path
          A and path B. It also covers bin_at_least absent, a path
          disagreement on each field, an ill-formed state, floor-invariant
          failure and in-tolerance bound perturbations. Stop 10 was computed
          from the gate texts; N4 was computed from F-N4's text.
        - Contrast control, using a reading known to be wrong. An N4
          reading that treats every bound difference as a failure,
          ignoring gate 2's tolerance clause, disagrees with stop 10 on the
          17 in-tolerance cases. So the table does separate a mis-reading of
          the tolerance clause from F-N4.
        - The gated c_bound_gating block (T-0648), read together with
          controls[C-BOUND] as an addition, was read against F-N4. Every row
          of its outcome_table and its one_outcome text agree with F-N4.
      disclosures:
        - id: EJ4-D1
          text: >-
            F-BOUND-CONSTRUCTED does not say where a constructed state's
            expected upper and lower bounds come from. D3 values_by_status
            fixes them uniquely, but F-N4 relies on "its expected closed-form
            expression" without naming that source for constructed states.
        - id: EJ4-D2
          text: >-
            F-BOUND-CONSTRUCTED does not state well-formedness conditions for
            a declared state (composite parts, a compositeness witness,
            certified primes). An ill-formed declaration yields no value,
            never two values, so this is not a break under EJ4's criterion.
        - id: EJ4-D3
          text: >-
            When the two paths differ on a bound by less than twice the gate-2
            tolerance, with each path inside it, neither N4 nor stop 10 fires.
            The held precision rule does not state the consequence for
            C-BOUND states. This is held text, not something F-N4 introduces,
            and it does not separate N4 from stop 10.
        - id: EJ4-D4
          text: >-
            A floor-invariant failure on a C-BOUND state fires N4 (via gate 2)
            and also N3 via stop rule 11. The double outcome is held text.
        - id: EJ4-D5
          text: >-
            "returns exactly" was read field by field. Whether an extra
            returned field that is not in the list fails gate 1 is not
            addressed.
        - id: EJ4-D6
          text: >-
            An evaluator report with bin_at_least absent fails gate 1 and
            gives N4 and stop 10 together, consistently on either path. The
            coordinator's predicted weak point did not break.
        - id: EJ4-D7
          text: >-
            ej4_states.py was edited after the pre-registration (a cube-root
            fix and the mutation set). ej4_declared_state.yaml was not edited;
            its sha256 above was recorded before the first successful
            evaluation.
      escalation: None. The draft makes no breakthrough, closure or contradiction claim; K-escalate does not apply.

