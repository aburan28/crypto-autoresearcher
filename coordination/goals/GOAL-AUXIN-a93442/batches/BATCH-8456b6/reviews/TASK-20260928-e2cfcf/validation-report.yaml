    EJ2:
      verdict: breaks
      breaking_artifact: >-
        Superseded rows `v1:controls[ordering].name` and
        `v1:controls[ordering].design`. Each cites typed supersedes_fields
        item 9, which reads that controls[ordering] is "strengthened by
        amendment.stages and control C-ORDER", and each row's own
        superseded_via (the held table's via) reads "(typed-by-hash stages
        and C-ORDER)". Their replaced_by_entries list only the
        amendment.stages entries. The C-ORDER entries (T-0328, T-0329,
        T-0330, which are stated under typed:controls[C-ORDER]) are absent,
        and no held text justifies leaving them out. This matches the plan's
        breaking_artifact: "a superseded row whose replacement set differs
        from the cited item with no held justification".
      scope_of_break: >-
        Narrow. It concerns two superseded rows' replacement lists, which are
        pointers. No stated leaf's text is wrong. No transcluded entry reads
        through controls[ordering], and C-ORDER is itself stated in full, so
        the successor still states the rule. The repair is additive: append
        the C-ORDER entries to the two rows' replaced_by_entries.
      alternative_reading_disclosed: >-
        The plan's attack plan tells the reviewer to "resolve its
        amendment.<path> names". Under that literal procedure item 9 names
        only amendment.stages, and the two rows would match. This validator
        reads "resolve from the supersedes_fields item it cites" (the joint
        statement) as covering every replacement the item names, because the
        item and the row's own via both name C-ORDER. The composer may weigh
        the two readings. All 67 superseded rows match the amendment.<path>
        resolution in both set and order.
      summary:
        bijection: >-
          Holds. 992 held governing_text_table rows and 992 leaf_map rows in
          the same order. Held duplicates, span rows and outside rows are each
          matched one to one, with equal (field, layer) multisets and one
          disposition per row.
        stated_rows: >-
          632 of 634 compose exactly to the held effective text. That
          includes all 18 outside-plus-span leaves, where the segments sit at
          the held from/through boundaries in the right order, and all 20
          span rows, where replaces_char_range and position_in match. The
          remaining 2 match only when read with their fresh note (see
          EJ2-O1 and EJ2-O2). None fails.
        superseded_rows: >-
          67 of 67 equal the amendment.<path> resolution of the cited item as
          sets and in order. Two rows omit a non-path replacement that the
          cited item names (the break above).
        empty_replacement_lists:
          - row: v1:independent_variables[curve_id].values item 11
            held_justification: typed supersedes_fields item 10 reads "replaced by the control ids and the null arm" and names no field path. "the null arm" is prose.
          - row: v1:independent_variables[curve_id].values item 12
            held_justification: same item 10
          - row: v1:tail_checks item 4
            held_justification: typed supersedes_fields item 13 reads "removed"
        envelope_rows: 291 rows, checked for disposition and bijection only. Whether they carry run-time rules is EJ5's, not this joint's.
        entries_unassigned: 0
      negative_controls:
        - {id: NC-EJ2-a, edit: drop T-0011 from the typed:definitions.bins outside row, detected: true, scratch_sha256: 25d9b5e785266740bde526fa9cb71ddd8eccf69feecdf8f87fdcfbe3acafb549}
        - {id: NC-EJ2-b, edit: drop T-0621 from the typed:change.D3_descriptive_bins.bin_by_status row, detected: true, scratch_sha256: e9639b3338a7f03e78db3cb850ec46a064b871927837deb0955703179ca478a5}
        - {id: NC-EJ2-c, edit: "drop T-0328 from the first row listing it (typed:controls[C-ORDER].kind)", detected: true, scratch_sha256: 1ae4457169a1b644f73c9a8980c48563e4a6ccebfb0aaae1d0f8881d7be7c5e4}
      observations:
        - id: EJ2-O1
          text: >-
            `narrow:corrective.falsification_condition_mapping.rows item
            6.outcome` names T-0653, which is the whole gated FC6 block. The
            outcome within it equals the held value, but the row states more
            than the leaf, and only its fresh note says which part governs.
        - id: EJ2-O2
          text: >-
            `gated:corrective.threshold_index` does not list its `.text`
            child. That text is stated at the INV-CLAIM span position, and the
            row's note says so. The composition holds only through the note.
        - id: EJ2-O3
          text: >-
            17 entries are assigned by two leaf_map rows: the bin_by_status,
            minimum_version, version_command and interpretation_limits item 6
            groups, plus T-0653. This follows from rows the held table itself
            lists twice. It sits in tension with F-PREC's wording that exactly
            one leaf_map row assigns an entry. Not a break under EJ2's
            criterion.
        - id: EJ2-O4
          text: >-
            Retired typed item-7 rows map to change.D4_calibration entries.
            D4_calibration.choice (T-0120) states the retirement, so the
            mapping is adequate. F-READ R3 describes retired leaves as having
            empty lists, so R3 and these rows read slightly differently.
        - id: EJ2-O5
          text: >-
            The v1:metrics rows cite items 11 and 18, as the held table does.
            Item 20 names metrics.secondary "rho baseline" specifically and is
