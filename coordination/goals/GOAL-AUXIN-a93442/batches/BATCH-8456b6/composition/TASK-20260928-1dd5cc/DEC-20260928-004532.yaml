  rationale:
    - >-
      EJ3-B1: stated invalidation entries T-0617 and T-0658 item 2 read
      incorporation-hash fields whose leaf_map rows are envelope, and F-READ R3
      gives such references both a datum reading and a provenance-only reading
      with no order between them. The red team constructs one state (held
      typed file bytes changed, successor bytes unchanged) on which the package
      is an evidence-integrity failure under one reading and fires no rule
      under the other.
    - >-
      EJ3-B2: "this frozen contract" in stated launch gate T-0471 is resolved
      by no F-READ rule; its two natural referents open or close the launch
      gate on the same state.
    - >-
      EJ6-B1: stated custody and invalidation entries, kept unchanged by
      F-CUSTODY, make the successor's launch refusal, stage-boundary stop and
      package validity change when a held EXP-AUXIN-7e2e3d file changes and
      the successor does not, and name held files "governing-text hashes",
      against F-PREC's "the only governing text of EXP-AUXIN-edd104". This is
      the plan's EJ6 breaking artifact word for word. The CD-6 layer form
      (no incorporation, no supersession) holds; the broader run-time
      independence sentence does not.
    - >-
      EJ6-B2: stated T-0158, read under F-READ R2 as this contract, licenses a
      later amendment file citing it; F-REV requires a new EXP id; F-PREC gives
      F-REV no priority over a transcluded entry, so the contract carries two
      incompatible revision routes, one of which reopens layering.
    - >-
      Under K-revise's then-clause and F-REV, no amendment layers this draft;
      any fix is a new successor contract under a new EXP id that states every
      rule once. RS-B stays the selected scope; no rerank_trigger is recorded
      as fired by this round.

