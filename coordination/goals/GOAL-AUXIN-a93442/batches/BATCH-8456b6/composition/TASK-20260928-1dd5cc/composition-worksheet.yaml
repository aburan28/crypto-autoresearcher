      primary sha256, then with its recorded alternate-reading hashes.
    bq1_row_label_agreement: every leaf_map row label equals the corresponding BQ2 field label, in the same order
    bq2_result: >-
      The large majority of compared stated rows agree with the re-deriver's
      primary hash. A small set agree only with a recorded alternate-reading
      hash (outside-segment rows of typed:change.D6_factoring.ecm_curves_per_level,
