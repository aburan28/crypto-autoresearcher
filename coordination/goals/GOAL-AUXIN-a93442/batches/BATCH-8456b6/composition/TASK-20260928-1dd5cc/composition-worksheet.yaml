      this comparator and was not traced to either side in this session:
      typed:change.D3_descriptive_bins.bin_by_status,
      typed:tools_and_admission.certificate_and_factoring_library.version_command,
      typed:tools_and_admission.certificate_and_factoring_library.minimum_version
      (draft entry text contained in the re-derived text),
      typed:interpretation_limits item 6,
      narrow:corrective.falsification_condition_mapping.rows item 6.outcome,
      narrow:corrective.falsification_condition_mapping.rows except item 6.outcome,
      narrow:corrective.declared_not_superseded except item 1.declaration.
      Each is a multi-entry, shared-entry, "except" or whole-block row, the
      granularity classes the validator disclosed as EJ2-O1 and EJ2-O3. Not
      traced to the draft, so they do not by themselves fire K-revise; not
      traced to the re-deriver, so K-reviewer-error does not fire either.
      They are uncompared leaves carried to the successor round.
    bq1_unmatched_leaves: >-
      The re-deriver reports leaves of its own leaf rule with no table row and
      table rows with no leaf of its own. BQ3 classifies rows, not those
      leaves, so the K-revise clause "a BQ1 leaf that carries a run-time rule
      has no leaf_map row" cannot be evaluated from the sealed reports. Not
      fired; recorded as not evaluable.
    bq3_against_dispositions: >-
      The re-deriver classes a subset of not_stated_envelope_or_layering rows
      as carrying a run-time rule (class a): typed/narrow/gated
      approval.until_approved, typed/narrow/gated authorization,
      v1:scientific_execution_scope, v1:write_scope items 1 and 2,
      narrow:incorporates.hash_check, gated:incorporates_by_hash.hash_check,
      narrow:span_rules rows, and gated:gated_span_rules rows G-GATE1, G-BND1
      and G-BND3. EJ5 (red team) found each such clause restated or replaced
      elsewhere (EJ5-D2, EJ5-D3, EJ5-D4) and the span replacements stated at
      their positions. This is a classification divergence, not a key trigger;
      the hash_check pair is the same surface as EJ3-B1 and EJ6-B1.
    threshold_index_rows: excluded from the comparison per the plan's excluded_from_blind_comparison

