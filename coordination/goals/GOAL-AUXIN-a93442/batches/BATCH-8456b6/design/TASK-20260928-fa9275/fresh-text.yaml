  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-8456b6
  producer_task: TASK-20260928-fa9275
  design_record: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-8456b6/design/TASK-20260928-fa9275/design-report.yaml
  kind: successor_experiment_contract_stating_every_rule_once
  status: draft
  approved_by: null
  approval_decision: null
  scope_by_citation: >-
    S-option-2 (decision_alias RS-B), rank 2 of
