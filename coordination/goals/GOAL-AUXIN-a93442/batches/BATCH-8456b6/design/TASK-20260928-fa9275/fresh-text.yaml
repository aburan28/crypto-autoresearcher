  text_kinds:
    fresh: >-
      Every field of this fresh block. Fresh text is new wording written for
      this contract. It is never a reproduction of held text.
    transcluded: >-
      Every item of transcluded.entries. Each is a byte-exact copy of one
      contiguous span of a committed record, carrying source_path,
      source_commit, anchor and span_sha256 (PA-8456b6-T1, T1 and T2). A
      transcluded span neither edits nor supersedes its source (T4). A span
      whose recomputed hash does not match, or whose anchor does not resolve,
      is retyped text, not held text (T5).

  hypothesis_binding:
    id: F-H
    text: >-
      This experiment tests H-AUXIN-6db354 as that record stands (status
      proposed; not edited by this contract). Its falsification conditions
      reach outcomes only through the falsification-condition mapping this
      contract states in transcluded entries: the rows FC1 to FC5 copied from
      corrective.falsification_condition_mapping of AMD-20260927-narrow.yaml,
      and the FC6 outcome copied from
      corrective.falsification_condition_mapping_fc6 of
      AMD-20260928-gated.yaml. The interpretation_limits correction of
      H-AUXIN-6db354 named in DEC-20260926-96f970 next_actions item 2 is not
      folded in. If that correction is made before this contract is approved
      and it changes a condition this mapping reads, this draft is not
      approvable as it stands; a new successor contract is written instead.

  precedence:
    id: F-PREC
    text: >-
      This file is the only governing text of EXP-AUXIN-edd104. No other file
      governs any part of it, and no record is incorporated by hash or by
      reference: the held records of EXP-AUXIN-7e2e3d are sources that
      spans were copied from, nothing more. EXP-AUXIN-7e2e3d, its
      specification and every one of its amendments are unchanged by this
      contract and govern nothing in it; nothing in this contract governs
      EXP-AUXIN-7e2e3d. Each rule of this contract is stated once, either by
      one field of this fresh block or by the transcluded entries that exactly
      one leaf_map row assigns. A leaf_map row that lists several entries with
      a composition states one leaf, whose text is those entries' texts
      joined in the order the composition gives, each span-position entry at
      the character range the row names. Entries that additions_read_together
      groups are read together: the text at that path is all of them, and none
      overrides another. Where a fresh field names a transcluded entry and
      states how a run-time decision reads against it (F-N4, F-BOUND-CONSTRUCTED
      and F-INDEX only), the fresh field and that entry are read together and
      the fresh field states the single resulting outcome. No other fresh field
      changes what a transcluded entry decides.

  reading_of_references:
    id: F-READ
    rules:
    - id: R1
      text: >-
        "This file" in a transcluded span means the entries of this contract
        whose source_path is the file that span was copied from. A span copied
        into the position of another file's leaf keeps the file it was copied
        from.
    - id: R2
      text: >-
        "This amendment", "this text", "this protocol", "the combined text",
        "the combined governing text" and a reference of the form
        amendment.<path> in a transcluded span mean this contract.
    - id: R3
      text: >-
        A reference in a transcluded span to a field of a named held file
        (named by file name, record id, or one of the layer names v1,
        typed-by-hash, narrow-by-hash, gated), or a bare path (read against the
        file the span was copied from), resolves through leaf_map. If the row is
        stated, the reference means its entries, with its composition and with
        any additions_read_together group for that path. If the row is
        not_stated_superseded_in_held_table, it means the entries the row's
        replaced_by_entries lists. If that list is empty, the held text removed
        or retired the leaf, or replaced it without naming a field, and the
        reference gives provenance only. If the row is not_stated_envelope_or_layering,
        the reference gives provenance only, except that a sha256 or byte count
        written there is a datum about that source blob. References to
        governing_text_table or precedence of any held file mean leaf_map and
        F-PREC of this contract; to reading_of_self_references, F-READ; to
        path_additions, additions_read_together; to incorporates or
        incorporates_by_hash, provenance only.
    - id: R4
      text: >-
        Inside spans copied from AMD-20260926-typed.yaml, a reference to
        another record, report or file follows the transcluded conventions.Q0-11
        of that file (provenance only, apart from the exceptions it names), and
        R3 does not apply to it. R3 applies there only to bare paths naming
        that file's own fields.
    - id: R5
      text: >-
        Every path written in a transcluded span is read exactly as written. No
        path is rewritten, including the implementation paths under
        experiments/EXP-AUXIN-7e2e3d/implementation/typed/.
    - id: R6
      text: >-
        A reference to a decision, review, finding, report, design report or
        transcript gives provenance only. A layer name in a transcluded span
        names the source file of that span for provenance; no layer governs
        in this contract.

  approval:
    id: F-APPROVAL
    status: draft
    approved_by: null
    approved_if_and_only_if: >-
      A committed Coordinator decision, OFFICIAL once its ledger archive is
      verified against Git by tools/research_dispatch.py, approves
      EXP-AUXIN-edd104 by name, after a review round under a review plan
      frozen before any reviewer ran has reviewed this file at the sha256 that
      decision names. In any other state this contract is not approved and
      authorizes nothing.
    transcluded_conditions: >-
      Where a transcluded span conditions something on the approval of the
      file it was copied from, it reads as conditioned on the approval of
      this contract under this field.
    how_approval_is_recorded: >-
      In that decision only. This file is never edited afterwards, not even
      this block.

  custody:
    id: F-CUSTODY
    text: >-
      Custody binds this file by one additional hash. Every hash the
      transcluded custody entries require is kept unchanged. In addition,
      trial-plan.json and manifest.yaml each record the sha256 of this file
      under the key successor_contract_sha256, apart from every other hash.
      The run recomputes it with the others at launch and at every stage
      boundary. A mismatch is the evidence-integrity stop of the transcluded
      stopping_rules item 12 of AMD-20260926-typed.yaml. Before Stage A0
      completes, the run also recomputes span_sha256 of every transcluded
      entry from its source blob at source_commit; any failure is the same
      stop. Launch is refused if dirty_summary lists this file. Any edit of
      this file after approval is an evidence-integrity failure.

  write_scope:
    id: F-WRITE
    paths:
    - experiments/EXP-AUXIN-edd104/
    - experiments/EXP-AUXIN-7e2e3d/implementation/typed/ (new files only, as the transcluded change.D10_additivity.rule of AMD-20260926-typed.yaml states; no existing file is edited)
    note: >-
      The contract file itself is placed under experiments/EXP-AUXIN-edd104/
      only by a later archived act. This draft lives in its design directory.

  n4_bound_comparison:
    id: F-N4
    discharges: DF-G1 (DEC-20260928-c4f3dc defects_to_discharge)
    reads_with:
    - typed success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED].condition
    - typed controls[C-BOUND].gates (items 1 to 3, item 1 as composed with span G-GATE1)
    - typed stopping_rules item 10
    - typed definitions.gate_evaluation_mode
    - typed success_criterion.decidability
    text: >-
      On each of BND-1, BND-2 and BND-3, and on any constructed BOUND state
      evaluated under F-BOUND-CONSTRUCTED, the words "other than the value this
      text fixes" in the N4 condition are decided by the C-BOUND gate verdicts,
      evaluated as definitions.gate_evaluation_mode states, and by nothing
      else. A returned status, witness set, witness, bin, bin_at_least or
      boundary_flag is other than the fixed value if and only if it differs,
      on path A or on path B, from the value the state's expected block
      states, which is the comparison gate 1 makes, so gate 1 fails on that
      state. A returned upper or lower bound is other than the fixed value if
      and only if, on path A or on path B, it misses its expected closed-form
      expression by more than the gate-2 tolerance or the floor invariant
      fails, so gate 2 fails on that state; or, for the upper bound of BND-1,
      CONSISTENCY fails, so gate 3 fails. Exact equality of a real-valued bound
      is never tested. The N4 condition is therefore met on a state if and
      only if gate 1, gate 2 or gate 3 fails on that state on either path,
      which is exactly when stopping_rules item 10 fires with outcome N4. The
      condition and the stop cannot disagree.
    tested_meaning_of_N4: >-
      This states as text the reading success_criterion.decidability already
      requires (each outcome decided from the gate verdicts alone). Against
      the other reading a reviewer could name (exact equality of each bound),
      it fixes the bound comparison at the gate-2 tolerance. It does not widen
      N4: N4 tests the same fields, on the same states, at the tolerances the
      gates already apply. The FC5 row (FC5 maps to N4_BOUND_EVALUATOR_FALSIFIED,
      kept) is transcluded unchanged and needs no update, because it maps the
      condition to the outcome and states no tolerance.

  constructed_bound_states:
    id: F-BOUND-CONSTRUCTED
    discharges: DF-G2, by the route "outside the protocol except in reviewer-evaluation mode", with the source of the expected fields named for that mode
    reads_with:
    - typed invalidation_rules item 6
    - typed change.D3_descriptive_bins (the BOUND rules)
    - gated corrective.c_bound_gating.expected_value_source (read together with typed controls[C-BOUND])
    - narrow corrective.bin_by_status
    text: >-
      A BOUND state other than BND-1, BND-2 and BND-3 never occurs in a run.
      If one does, the transcluded invalidation_rules item 6 of
      AMD-20260926-typed.yaml makes the package invalid_measurement. Such a
      state exists only in reviewer-evaluation mode, where a reviewer builds
      it to test the BOUND rules. There it is outside the protocol: no gate,
      stop, validity rule or outcome of a run reads it. In that mode, the
      expected status, witness set and witness are the values the BOUND rules
      of change.D3_descriptive_bins give on the parts the reviewer declares
      for the state. The expected bin, bin_at_least and boundary_flag are the
      values corrective.bin_by_status gives on the state's witnessed depth.
      The reviewer records the declared parts and these expected values before
      evaluating. F-N4 then decides the comparison. If a reviewer's recorded
      expected value differs from what these rules give, that is a reviewer
      error, not an outcome.

  threshold_index:
    id: F-INDEX
    discharges: DF-G3, by the non-normative route
    reads_with:
    - typed change.D4_calibration.threshold_inventory (every segment, including the span INV-CLAIM position)
    - narrow corrective.threshold_inventory_added
    - gated corrective.threshold_index (status_of_the_index and completeness_claims_over_four_layers)
    text: >-
      The threshold index is non-normative. It consists of the text stated at
      the position of span INV-CLAIM of change.D4_calibration.threshold_inventory,
      together with the rest of that leaf and with
      corrective.threshold_inventory_added. No gate, stop, validity rule,
      outcome or other normative clause of this contract reads it. The only
      clauses that name it are its own entries and the status and
      completeness text copied with it. Every cut-off and decision constant
      governs from its own clause, whether or not the index lists it. No
      counting convention is fixed. The index is excluded from blind
      comparison in any review plan of this contract.
    readers_check: >-
      Named readers: none. Basis: a token scan for threshold_index,
      threshold_inventory and inventory over every transcluded entry and every
      fresh field, recorded in the design report. A clause that reads the
      index without naming it would not be found by that scan; the review
      plan should test for one.

  revision_rule:
    id: F-REV
    text: >-
      No amendment layers this contract. A change of any kind, including one a
      review requires, is a new successor contract under a new EXP id. It
      states every rule once, and it may transclude from this file under a
      reading declared for its own batch.

  execution_preconditions:
    id: F-PRE
    text: >-
      Any future executor card for a run under this contract carries, as
      dispatch preconditions and unweakened, DEC-20260927-f680f7
      dispatch_preconditions_carried (cited, not restated; sha256 of the
      string a YAML safe loader returns for that field:
      c3be35ae13929b45fc10dbf65f2b28cdb10a1e2580b6d7d6b57b1cf6fcd1e553), and
      the provisioning precondition the transcluded
      tools_and_admission.absence_rule states.

  authorization: >-
    This draft authorizes no run, no implementation dispatch and no executor
    card. It approves nothing and sets no execution-authorization field. It is a
    design awaiting a review plan, which a later session freezes before any
    reviewer runs.
  non_claims:
  - Asserts nothing about any curve, any census value, whether H-AUXIN-6db354 is true, any deployed system or any exponent.
  - Does not assert that any transcluded span is correct, or already reviewed in its new context. Held status in a source round does not carry into a new composition (DEC-20260928-2afb23 does_not_decide).
