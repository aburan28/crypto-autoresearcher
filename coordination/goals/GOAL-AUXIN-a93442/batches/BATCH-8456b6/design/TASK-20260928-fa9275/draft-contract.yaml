      span_sha256: fca112179ce52dbe002fa618863d85ad838490deb09673e5997c17d647bcb19a
      text: '(entry 2; DR-8.) For each PINNED REVISION source the executor, before any parse, writes the retrieved bytes to sources/<name> (eip-197.md; draft-irtf-cfrg-pairing-friendly-curves-14.txt), computes their sha256, and records URL, resolved commit (EIP-197), UTC time, HTTP status, byte count and sha256 in sources/retrieval.json. Parsing reads only the archived file. If a pinned revision cannot be retrieved (network failure, non-200 status, missing commit), that is an INFRASTRUCTURE STOP of the package before any factoring: no other revision, mirror or document is substituted and the row is never filled from memory.'
