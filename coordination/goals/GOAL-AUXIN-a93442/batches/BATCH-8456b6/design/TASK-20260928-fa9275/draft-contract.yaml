        kind: loaded_value
      span_sha256: 58c2b93dbcfa8a7dd5e30e936a272c2687cb3dc227a55df4b20f9d96ef08f003
      text: '"prime" means prime in the mathematical sense. A search accepts a candidate only if every integer its acceptance rule names is prime. OPERATIONAL SCREEN: the Baillie-PSW test, defined as a strong probable-prime test to base 2 followed by a strong Lucas probable-prime test with Selfridge method A parameters (D is the first of 5, -7, 9, -11, 13, ... with Jacobi symbol (D/n) = -1; P = 1; Q = (1 - D)/4). Trial division by small primes may precede it; that cannot change which candidate is first accepted (conventions.Q0-5). PROOF: every accepted integer is then proved prime by a certificate under change.D7_certificates. If a candidate passes the screen but its certificate run proves it composite, it is NOT accepted, the search continues from the next candidate, and the event is recorded. If the certificate run fails without proving compositeness, that is an infrastructure stop, never a skip.'
    - entry_id: T-0003
