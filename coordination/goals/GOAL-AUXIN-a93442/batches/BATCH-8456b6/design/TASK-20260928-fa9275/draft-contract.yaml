      span_sha256: 96b5dfe20883a5e02681016c115fa908e468ae808157f03b4b82407ee382cca6
      text: '"Candidates examined" by a search is the number of integers stepped in +1 order from the search start up to AND INCLUDING the accepted one, counting every integer (even integers too), whatever an implementation skips, sieves or trial-divides. For nextprime_gt(x) the start is x + 1.'
    - entry_id: T-0163
      states_leaf: typed:conventions.Q0-5
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.conventions.Q0-5
        kind: loaded_value
      span_sha256: ff30a2def3b31bc0bf2c704bad4b08b4988f28bc631cecdc1c746822182d11f5
      text: 'DECLARED IMMATERIAL, with reason: every variant of the Baillie-PSW screen that never rejects a prime accepts the same first candidate, because acceptance additionally requires a certificate proof. Convention, to remove the choice anyway: a perfect square is rejected before the Lucas step; a Jacobi symbol (D/n) = 0 with |D| < n is a compositeness exit; any trial-division bound up to 2^16 may precede the screen; within one candidate the named integers are screened in the order the acceptance rule lists them. None of these can change an accepted integer or the count of Q0-4.'
    - entry_id: T-0164
      states_leaf: typed:conventions.Q0-6
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.conventions.Q0-6
        kind: loaded_value
      span_sha256: 3b8c1018248326ebad1796bdf524f478b2959509bd5d198b0229d2fff0ad6072
      text: 'DECLARED IMMATERIAL, with reason: any certificate the independent verifier accepts proves the same integer prime, so no reported integer, status or exponent depends on its form. Convention: the Pratt witness a is the smallest a >= 2 that satisfies the Pratt conditions; ECPP chains are those PARI primecert returns.'
