    - entry_id: T-0462
      states_leaf: typed:proof_search_map.quantifier_order
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.proof_search_map.quantifier_order
        kind: loaded_value
      span_sha256: 4f82c8ad12d5ca828753b83a3a8f1a7cb65abecbd15d0c245eff6321523baf30
      text: 'For each deployed row r, fixed by its primary source (at a pinned revision) before any factoring, and for each branch b, under the fixed budget: the pipeline records F_b and its composite parts; then the evaluator outputs either the minimum of e_b over ALL divisors of m_b (EXACT) or the minimum over the witness set W_b generated by those recorded parts together with the floor F_b(r) (BOUND). The recorded parts are an outcome of the factoring run; W_b is a fixed function of them, stated before the run (O10). The input model is attached per branch (one power [x^d]P on minus; [x^i]P for i = 1..2d on plus). The table asserts nothing about whether any party supplies that input.'
