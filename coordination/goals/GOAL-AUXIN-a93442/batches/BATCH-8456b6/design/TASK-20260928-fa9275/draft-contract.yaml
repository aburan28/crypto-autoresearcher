        kind: loaded_value
      span_sha256: 73c90284d688c9c05511d23c5dde20b3784f3b82b59a572998239b9e5be432c1
      text: 'From C-PLANT-M: r_M (its r), d1, d2, u and D = d1 * d2, with r_M - 1 = 2 * d1 * d2 * u. From C-PLANT-P: r_P (its r), d and w, with r_P + 1 = 12 * d * w. Every prime named below is certified by Stage C. Each part below is recorded with its compositeness witness (change.D7_certificates) and a perfect-power check.'
