        - 871
      span_sha256: 87e054396d65d268101ddeb360ab113a34f526c00225e01ab1858e747a7ab7a1
      text: ' (4) Certificate self-test: path A produces certificates for 2^89 - 1 and 2^607 - 1 and the independent verifier accepts both. (5) Tamper self-test: the verifier REJECTS the certificate of 2^89 - 1 with its top N replaced by 2^89 + 1. (6) The AST import audit of every module under implementation/typed/ passes change.D8_custody.import_rule, and cert_verify.py and every path B module import only the standard library. '
