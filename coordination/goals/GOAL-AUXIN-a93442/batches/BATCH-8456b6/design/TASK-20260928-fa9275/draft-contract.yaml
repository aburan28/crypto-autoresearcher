        kind: loaded_value
      span_sha256: 8e9486d720d97e72f6e9cac5047698631e3fd25d08f175c1c6585878ab23b30b
      text: '(conventions.Q0-3.) For construction controls and null-arm integers there is no "same curve": clause (1) compares against the whole set FP, clause (2) applies, and clause (3) does not apply because no source prints a cofactor for them. The expected outcome for every construction control is NOT REJECTED (no reason). If a construction control is rejected, the run stops with outcome I_CONTROL_COLLISION (never N1, never a result), because a constructed control that equals an extracted field prime is a defect of this text''s recipes. A rejected null-arm sample is kept, flagged and not factored.'
