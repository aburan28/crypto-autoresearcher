    - entry_id: T-0146
      states_leaf: typed:change.D8_custody.import_rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D8_custody.import_rule
        kind: loaded_value
      span_sha256: eb90fcc62346972fbe94e8c891088eb38aab582930b6b9e2f4b857859fbf8c78
      text: '(F-J1-7, entry 10.) The run is launched as "python3 -I experiments/EXP-AUXIN-7e2e3d/implementation/typed/run.py ..." (isolated mode: no current directory, PYTHONPATH or user site on sys.path). Every module the run loads must be one of: (a) a Python standard-library module (sys.stdlib_module_names); (b) a module of the installed third-party distributions cypari2, cysignals or pypdf, or of their declared dependencies, each recorded with name and version in manifest.yaml; (c) a file under experiments/EXP-AUXIN-7e2e3d/implementation/typed/. ANY module whose file lies inside the repository but outside implementation/typed/ (for example implementation/driver.py, e_eval.py, factor_path_*.py, or anything under tools/) is FORBIDDEN. Checked twice: an AST audit of every .py file under implementation/typed/ at admission (every import names a module of class a, b or c), and a runtime audit at launch and at every stage boundary that lists every entry of sys.modules with a __file__, classifies it, and stops the run (evidence-integrity failure) on any forbidden module. Both audits are written to import_audit.json.'
    - entry_id: T-0147
      states_leaf: typed:change.D8_custody.implementation_snapshot_and_launch_comparison
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D8_custody.implementation_snapshot_and_launch_comparison
        kind: loaded_value
      span_sha256: aceae2c87ca848c9ddf12ee1b105d16e4123b473b778a93d405b0e1853daae54
      text: (F-J1-8, entry 10.) Before launch, an implementation snapshot archive must bind by path_sha256 every file under experiments/EXP-AUXIN-7e2e3d/implementation/typed/, and the dispatcher must have verified it. At launch, BEFORE any row is scored and before Stage A0 completes, the run computes the sha256 of (i) every file under implementation/typed/ in the working tree and (ii) the same path's bytes at the launch commit (git show <launch_commit>:<path>), and compares both with that snapshot's path_sha256. Any missing, extra or differing file refuses launch (evidence-integrity failure). The comparison is written to launch_comparison.json. The post-run snapshot must bind the same implementation bytes again; a difference makes the run uncitable.
    - entry_id: T-0148
      states_leaf: typed:change.D8_custody.no_self_hash
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
