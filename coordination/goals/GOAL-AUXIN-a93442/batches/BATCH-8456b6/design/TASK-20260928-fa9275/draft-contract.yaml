        kind: loaded_value
      span_sha256: 937ea308c4f36f193522ca7e63ef43345847e1528fe0fb2b9be9c8d9ba6f802f
      text: Test the BOUND rules of change.D3_descriptive_bins (recorded parts, witness set, witness, bound pair, UNDETERMINED and bin_at_least) at values fixed by this text before the run. Each state is a DECLARED factorization state built from the certified construction integers of C-PLANT-M and C-PLANT-P. It is passed directly to the evaluator on path A and path B and never enters the factoring pipeline; a state that F0 would never leave (small primes inside a part) is permitted because the control tests the evaluator, not the pipeline.
    - entry_id: T-0274
