      span_sha256: 9341bdd4936c6751198b3ddec7090f5154a6d02f1a91cbd0b94c1b8bbcd36836
      text: This amendment is a new file and is never rewritten in place. Any later change is a new amendment file with a new id that cites this one. The run uses NEW implementation modules under experiments/EXP-AUXIN-7e2e3d/implementation/typed/ and edits no existing implementation file, so the code of earlier runs stays recoverable. The subdirectory is new, rather than the d1d10/ subdirectory the refused predecessor named, so that no module of a refused design can be mistaken for one governed by this text.
