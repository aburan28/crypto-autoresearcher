      text: ' The declared property is a design statement read by no gate; C-PLANT-PL''s gates (plus minimiser, gap within the control gate tolerance, bin) are unaffected by it, and the conclusion it supports survives with a relative bound. Editing a construction-control field would reopen regression group R-D4, which held twice. Revisit when any later amendment edits C-PLANT-PL for another reason.'
