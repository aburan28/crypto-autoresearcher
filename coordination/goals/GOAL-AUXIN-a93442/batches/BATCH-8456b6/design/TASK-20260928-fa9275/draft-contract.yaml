        kind: loaded_value
      span_sha256: a0f12958412b688bdbf947c787046c2a1b7cfdac50955eb3c45de729f68d0ae2
      text: '(3) PARI alarm self-test: the program corrective.tools.alarm_self_test_program is run as a CHILD process, python3 -I -c "<program>", with the admitted interpreter, and the child is killed if it has not exited 10 seconds of wall clock after it was started. The item PASSES if and only if the child exits with status 0 within those 10 seconds and its standard output, split on LF with the final empty string after the last LF dropped, is exactly the three lines ALARM, ALARM, 4. Any other exit status (including death by a signal), a kill, or any other output FAILS the item.'
