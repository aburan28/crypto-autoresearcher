    - entry_id: T-0264
      states_leaf: typed:controls[C-PLANT-PL].declared_properties
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.controls[C-PLANT-PL].declared_properties
        kind: loaded_value
      span_sha256: 6e889918cf6614dfcaf2e710705a5fce7158556bf31a56e3929f9600c62bdc6f
      text: Stated in advance, each by an argument from the recipe alone. (a) ROUTING. f1, f2, f3, f4 and w all exceed 2^24, so F0 removes only 2^2 * 3 from r + 1, and the remaining part f1*f2*f3*f4*w has more than 272 bits (its log2 is about B_L - log2(12), far above 272), so the pipeline must send it to F3. (b) MINIMISER. D_L lies in [x_L, x_L * (1 + 2^-19)), because D_L = G * f4 >= G * y >= x_L and D_L < G * (y + 2^24) <= x_L + G * (1 + 2^24), where G is about 2^129 and x_L is about 2^172. And (r + 1)/4 differs from M_L/4 by a relative amount below 2^-290 (w < w0 + 2^48). So D_L is within a relative 2^-18 of the T_plus optimum x = ((r + 1)/4)^(1/3). Write T_plus(t*x) = x * (2/sqrt(t) + t), minimised only at t = 1 with value 3x. Every divisor of r + 1 is s * (product of a subset of {f1, f2, f3, f4}) * w^c with s | 12 and c in {0, 1}. With c = 1 the divisor exceeds w, which is above 2^300, so T_plus > 2^300. With c = 0 and at most three of the f_i, the divisor is below 12 * 2^133, so t < 2^-35 and T_plus > 2^17 * x. With all four f_i the divisor is s * D_L, with t within 2^-18 of s, and 2/sqrt(t) + t is least at s = 1 (value 3 + O(2^-36)), against at least 2/sqrt(2) + 2 > 3.41 for s >= 2. Hence the plus minimiser is D_L, uniquely, and e_plus - F_plus is below 10^-6 by a wide margin. (c) MINUS BRANCH. r - 1 = 2q with q prime, so the minimiser is the smaller member of the tied pair {2, q}, and its depth is below 1/4 by the same inequality as C-BOUND BND-2 (argument there).
    - entry_id: T-0265
      states_leaf: typed:controls[C-PLANT-PL].gates item 1
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
