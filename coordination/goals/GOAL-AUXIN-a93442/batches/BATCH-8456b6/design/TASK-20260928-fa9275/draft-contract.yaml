        kind: loaded_value
      span_sha256: 2618ec5a63f2b0cc1670ddbf1cc58a4445db8fe3ddc41d7d041674eb5ebb6f67
      text: After writing each retrieved pinned-revision file and before any parse, the executor compares its sha256 with the expected_sha256 stated above for that source. A mismatch is an evidence-integrity stop of the package in Stage P before any factoring (outcome I_INFRA). No row is pinned from a file that does not match, and no other revision is substituted.
