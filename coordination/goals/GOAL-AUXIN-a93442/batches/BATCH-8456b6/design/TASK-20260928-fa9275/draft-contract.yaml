      span_sha256: 3a465679e5ad689fb295c22293afc8cf2cf38d7761d991246806cb01f7a81237
      text: ' CONTRAST, stated so that a mis-implementation is visible: the superseded single-cofactor formula (C_b = 6dw, W = {1, 2, 6dw, 12dw}) would give witness 2 and bin UNDETERMINED; that result fails this gate.'
    - entry_id: T-0293
      states_leaf: typed:controls[C-BOUND].states[BND-3].why_fixed_in_advance
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.controls[C-BOUND].states[BND-3].why_fixed_in_advance
        kind: loaded_value
      span_sha256: b3078d2feb100da7fd1b4eaba265dc97baa5630aacc84ce747d50f4cc98fc3be
      text: 'd is within a relative 2^-60 of x = (m/4)^(1/3) by the C-PLANT-P recipe. With T_plus(t*x) = x * (2/sqrt(t) + t): 2d has t near 2 and T_plus near 3.414x; 4d has t near 4 and T_plus near 5x; 1 and 2 have T_plus above sqrt(m/2), near 2^127; 3w, 6w, 6dw and 12dw have T_plus above 3w, near 2^170. So the witness is 2d, uniquely. Its exponent exceeds F_plus by log2(3.415/3)/log2(r_P), below 0.19/log2(r_P), while C_plus - F_plus exceeds (log2(m)/6 - 1)/log2(r_P) >= 41/log2(r_P). So the depth exceeds 0.99, above 3/4 + tau.'
