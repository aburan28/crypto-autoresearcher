    - entry_id: T-0028
      states_leaf: typed:change.D1_pins.pdf_digit_check
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.pdf_digit_check
        kind: loaded_value
      span_sha256: c372aa99e1a3657ba169aa93c4c0a81fcceab190167ee464f5bb383f107b946e
      text: '(entry 3.) Every row, cross-source or C-FIELD comparison that reads a derived .txt file (sp800-186.txt or sec2-v2.txt) is digit-checked against the authoritative PDF named in inputs/SAFECURVES-20260825/source_record.yaml (sp800-186.pdf, sec2-v2.pdf), whose sha256 is bound above. PROCEDURE: extract the text of every page of the PDF with pypdf (tools_and_admission) as "\n".join(page.extract_text() for page in PdfReader(path).pages); remove the whitespace set and backslashes; lowercase. Take the value''s digit string exactly as the .txt span printed it (the clean hex or clean decimal form used, whitespace and backslashes removed, leading zeros as printed), lowercased. The check PASSES if and only if that string occurs as a contiguous substring of the normalized PDF text. A FAIL makes the row UNPINNED with reason pdf_digit_mismatch (or, for a cross-source, a cross-source failure). The extracted normalized text is archived as sources/<pdf-name>.normalized.txt with its sha256, and every verdict is written to pdf_check.json.'
    - entry_id: T-0029
      states_leaf: typed:change.D1_pins.locator_failure
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
