        kind: loaded_value
      span_sha256: 474869f9e6c7c7e2ced6beaeffb010241ae87a65cd36ec1a97cd9d809d7b2a2d
      text: Standard output, split on LF with the final empty string after the last LF dropped, must be exactly three lines. Line 1 is the cypari2 distribution version and line 3 the PARI library version; each must fully match [0-9]+\.[0-9]+\.[0-9]+ . Line 2 is the cysignals distribution version, recorded as printed. A non-zero exit status, another line count or a non-matching line 1 or 3 FAILS admission item (1). Versions are compared as integer triples.
