    - entry_id: T-0445
      states_leaf: typed:success_criterion.decidability
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.success_criterion.decidability
        kind: loaded_value
      span_sha256: c53e1bc049b63f0379aef57601b696744c7a5de309b3262b7da044e4ebec0b23
      text: '(F-J3-1, entry 15.) Each outcome is decided from the gate verdicts, statuses, validity rules and invariants in metrics.primary alone. The only way a deployed-row result enters an outcome is through the validity rules that test the instrument on every row: N3 (the floor invariant), VOID (which separates S_VALID_TABLE from S_PARTIAL_TABLE) and UNPINNED. None of these is a threshold on a deployed-row exponent, bound, bin or divisor, and no deployed-row value is compared with any cut-off chosen for it.'
    - entry_id: T-0446
      states_leaf: typed:falsification_criterion
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
