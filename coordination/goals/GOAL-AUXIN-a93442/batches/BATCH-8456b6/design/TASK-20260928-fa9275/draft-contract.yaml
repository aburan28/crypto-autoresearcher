    - entry_id: T-0575
      states_leaf: narrow:corrective.pins.pdf_digit_check_weakness.declaration
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.corrective.pins.pdf_digit_check_weakness.declaration
        kind: loaded_value
      span_sha256: a7b34f8c2982d4e9847e413ed34bc70baeb411db09683283d082886c0a0bc204
      text: 'The check is a substring test and is kept as written, not made positional. Its weakness is declared: for a printed digit string that is short (a cofactor h of one or two digits, for example), occurrence somewhere in the normalized PDF text is near certain and the check then has almost no discriminating power. A PASS on a string shorter than 20 characters is recorded in pdf_check.json with its length and is not read as evidence that the value was checked against the PDF. The value itself stays governed by its parse rule and, where it applies, by the hasse clause of the confounder check.'
