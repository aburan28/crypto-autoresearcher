      anchor:
        field_path: amendment.change.D8_custody.no_self_hash
        kind: loaded_value
      span_sha256: 74903b35ac481b7d02f779c84771164562e535786994584c96e1dfb30cc63df8
      text: No artifact contains a hash of itself. Every recorded hash is of a file's final bytes, computed after the file is closed; a hashed file is never rewritten, renamed over or unlinked. orders.json is written once; its sha256 goes to the separate file orders.json.sha256 and to stdout.log before any factoring. That is the meaning of hash-committed in the frozen launch gate.
