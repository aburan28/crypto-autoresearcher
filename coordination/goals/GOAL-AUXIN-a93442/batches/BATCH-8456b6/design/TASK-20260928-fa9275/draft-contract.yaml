      text: change.D8_custody.implementation_snapshot_and_launch_comparison, then tools_and_admission.admission_gate.
    - entry_id: T-0203
      states_leaf: typed:stages[P_pin].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.stages[P_pin].does
        kind: loaded_value
      span_sha256: 240df4c6a65060e37478524c837b4fefafc4e063e9a0bb17d3864aba87a7bef2
      text: (P1) Verify every staged source digest (change.D1_pins.staged_source_binding). (P2) Retrieve and archive the two pinned-revision sources (change.D1_pins.retrieval_rule). (P3) Extract every r, field prime p and cofactor h by the parse rules, and every cross-source value. (P4) Run the PDF digit checks. (P5) Run C-FIELD, then C-FIELD-MUTATION; if either fails, stop (N2 or I_TEXT as stated there). (P6) Run the confounder check on every deployed r, prove each r prime, apply the family checks, write orders.json, then orders.json.sha256, and print the sha256 to stdout.log. No factoring of any r - 1 or r + 1 happens in this stage.
    - entry_id: T-0204
      states_leaf: typed:stages[C_controls].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.stages[C_controls].does
        kind: loaded_value
      span_sha256: 3bb873e2a78f1b117d7ee865a03e74c76c192065c1ae8e049195a2a9adb9480c
      text: Construct C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL exactly per their recipes, run the confounder check on each constructed r, and write controls_construction.json. Factor both branches of each construction control blind through the change.D6_factoring pipeline, certify, evaluate on path A and path B, and apply every gate. Then evaluate the C-BOUND declared states on both paths and apply their gates. Write controls_receipt.json with its sha256 printed. If any gate fails on either path, stop (N1 or N4).
    - entry_id: T-0205
      states_leaf: typed:stages[N_null_arm].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.stages[N_null_arm].does
        kind: loaded_value
      span_sha256: 0cbfcd32bc9e02c7cdc08e32b8edaf89cb83e3cf6f79db84791734a4c5f80faf
      text: Sample, confounder-check, certify, factor, evaluate on both paths and bin every null-arm prime per amendment.null_arm. Write null_arm.json and print its sha256. Complete before any deployed factorization begins.
    - entry_id: T-0206
      states_leaf: typed:stages[D_deployed].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
