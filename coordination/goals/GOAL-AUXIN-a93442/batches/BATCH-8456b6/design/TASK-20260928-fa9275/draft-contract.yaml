      text: 'Seeds construct the two synthetic controls only. Deployed r values are pinned constants, not seed-derived. The census is one scientific package (maximum_runs: 1) covering all rows.'
    - entry_id: T-0523
      states_leaf: v1:cost_model_disclosure.measured_vs_modelled
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/specification.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 1f803aa0a535e4c0a321dfcb3851b89cbd4cae23596ad70e1aa1fd1b06639fbc
      anchor:
        field_path: experiment.cost_model_disclosure.measured_vs_modelled
        kind: loaded_value
      span_sha256: 364619d62da12a64bbba60f58f243ab307a7f4498161a9390599ceb34c1d8388
      text: 'MEASURED: factorizations, product checks, primality certificates, wall-clock, peak RSS. MODELLED: expr(d,m) and E(r), which apply the frozen closed form to the measured divisor lattice. The two never share one unlabeled column.'
    - entry_id: T-0524
      states_leaf: v1:cost_model_disclosure.optimistic_assumptions item 1
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/specification.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 1f803aa0a535e4c0a321dfcb3851b89cbd4cae23596ad70e1aa1fd1b06639fbc
      anchor:
        field_path: experiment.cost_model_disclosure.optimistic_assumptions item 1
        kind: loaded_value
      span_sha256: 8debe5f8595b69d8096b9c51c42ea27cbbe277495304d23036bdedf3e318b903
      text: 'E(r) uses expr without a log2(r) group-op cofactor. DIRECTION OF BIAS: understates Cheon 2006-style operation counts if that cofactor is real. Primary success/falsification does not use the cofactor column.'
    - entry_id: T-0525
      states_leaf: v1:cost_model_disclosure.optimistic_assumptions item 2
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/specification.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
