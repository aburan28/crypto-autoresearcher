    - entry_id: T-0201
      states_leaf: typed:tools_and_admission.absence_rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.tools_and_admission.absence_rule
        kind: loaded_value
      span_sha256: f97ddb21cb84a131db550d7ae0200d78f79dab2630159d9cfcaeea1b3c86be31
      text: 'Any failure of the admission gate is an INFRASTRUCTURE STOP: the run is not launched, the probe output is reported as failed_infrastructure, and no other tool, version or verifier is substituted. It is never a result about any curve or about this amendment''s mathematics. Provisioning the declared tools is not part of this text; their absence at execution is an infrastructure stop (REVIEW-AUXIN-20260926-2fc87b K-provision), and any executor card for a run under this amendment carries provisioning as a dispatch precondition.'
    - entry_id: T-0202
      states_leaf: typed:stages[A0_admission].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
