    - entry_id: T-0572
      states_leaf: narrow:corrective.pins.null_arm_class_consequence.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.corrective.pins.null_arm_class_consequence.rule
        kind: loaded_value
      span_sha256: 97218f1c5dd6b9132081d41a0cd6b224af5333ede055d460d07cebd4506acba8
      text: The null-arm bit classes are the exact bit lengths of the PINNED deployed r (held text). If a deployed row is UNPINNED and no other pinned deployed r has its bit length, that bit class has no samples. The null arm is then reported with that class named as absent and the reason (the UNPINNED row it would have mirrored). An absent class is not a VOID branch, does not by itself move the outcome from S_VALID_TABLE, and is not negative about any curve.
