      text: (entries 4 and 5.) In the refused predecessor each case integer was defined by a file location, so the recipe was not determinate from the text (rederivation Q0-1), case 2 needed a representation choice (VAL-20260923-c3c90c choice C3), and the case and the value compared with it came from the same locator, so the control tested only equality wiring (F-J1-10). Here each case integer is a closed-form expression in this text, and its equality with the independently extracted field prime is a separate gate. The brainpoolP384r1 case is dropped because its field prime has no closed form and cannot be stated without a literal; that row remains covered by the confounder check, which applies to every row.
