      text: Advisory, not a veto. Worst case is bounded by the number of factored integers (2 x (deployed rows + 4 construction controls + 16 x bit classes)) times 3600 seconds, plus construction, certification, retrieval and evaluation time. It is expected to be dominated by the largest bit classes, where integers are likely to spend the full budget. The C-PLANT-PL search examines many 521-bit candidates; its time is disclosed, not capped, beyond its window.
