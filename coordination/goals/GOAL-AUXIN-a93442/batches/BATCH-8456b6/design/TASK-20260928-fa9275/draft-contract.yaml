        kind: loaded_value
      span_sha256: 7086c4cfaa170e2992debacff70766c847125b2037a28e233811040bcfbf14f9
      text: 'Both expressions are prime (proved at run time under change.D7_certificates), so not_prime does not fire. field_prime fires on each because each equals a member of FP. For CF-1, h = 8 and r = p, so |p + 1 - 8p| = 7p - 1 exceeds 2*isqrt(p) + 2 and hasse fires. For CF-2, h = 1 and r = p, so |p + 1 - p| = 1 and hasse does not fire: on a cofactor-1 row the field_prime clause is the only separator (RT-20260923-38bbbf O15).'
