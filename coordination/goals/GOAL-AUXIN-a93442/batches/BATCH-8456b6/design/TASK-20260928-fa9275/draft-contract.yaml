        - 2
      span_sha256: a4ae4f384467d8512a2b0d55046d93ef7ff9d6ab4067c07327036b91e04f4f98
      text: "- item: ER-4\n      adds_to: corrective.bin_by_status of AMD-20260927-narrow.yaml\n      path_name: corrective.bin_by_status.confounder_rejected_candidates\n      statement: 'A deployed row, null-arm sample, construction control or C-FIELD case that the confounder check\n        rejects reports none of the three reporting fields bin, bin_at_least and boundary_flag. It has no branch:\n        a rejected deployed row is invalid_measurement for that row and never factored, a rejected null-arm sample\n        is kept, flagged and not factored, a rejected construction control stops the run (I_CONTROL_COLLISION) before\n        any factoring, and a C-FIELD case is never factored. Its record is the ordered reason list of the confounder\n        check.'\n      supersedes: nothing\n      why_no_outcome_changes: corrective.bin_by_status assigns the three fields per branch, and a rejected candidate\n        has no branch under the held confounder-check text, so this statement makes explicit what the held text\n        already implies; no gate, stop or outcome reads the three fields of a candidate that has no branch.\n    - item: ER-6\n      field: change.D1_pins.confounder_check.applies_to of AMD-20260926-typed.yaml (not superseded)\n      declaration: '\"every construction-control integer\" means each construction control''s r (the r of C-PLANT-M,\n        C-PLANT-P, C-INERT and C-PLANT-PL), not every integer named in a recipe.'\n      supersedes: nothing; a reading declaration\n      reason: 'It is the only reading consistent with the held text: stages[C_controls].does runs the confounder\n        check \"on each constructed r\"; scope_on_controls_and_null_arm fixes the expected outcome for every construction\n        control as NOT REJECTED; and under the other reading clause (2) not_prime would reject every composite recipe\n        integer (D = d1 * d2 of C-PLANT-M, for example), stopping every run with I_CONTROL_COLLISION. The declared\n        reading leaves the integers FP is compared with, and the C-FIELD gates, unchanged. DEC-20260927-f680f7 Q0-3\n        recorded the same outcome under both readings for clause (1) at the pinned bytes.'\n    - item: ER-7\n      field: controls[C-FIELD].cases[CF-1].extraction_cross_check and cases[CF-2].extraction_cross_check of AMD-20260926-typed.yaml\n        (not superseded)\n      declaration: '\"(hex form)\" is descriptive, not a requirement. The cross-check compares the case value with\n        the field prime p that parse rule PR-SP800 extracts, in whichever representation PR-SP800 selects and records.'\n      supersedes: nothing; a reading declaration\n      reason: PR-SP800 governs which representation yields the value and records the one used; a second representation\n        rule inside the cross-check would duplicate it. DEC-20260927-f680f7 Q0-4 recorded that both readings give\n        the same run-time decision at the pinned, hash-fixed bytes.\n    - item: ER-5\n      see: gated_span_rules[G-CPL]\n    - item: ER-2\n      see: gated_span_rules[G-Q011] and reading_of_self_references\n    - item: ER-3\n      see: corrective.falsification_condition_mapping_fc6\n    - item: ER-1\n      see: precedence, path_additions, governing_text_table, spans G-WII and G-ENV\n  "
