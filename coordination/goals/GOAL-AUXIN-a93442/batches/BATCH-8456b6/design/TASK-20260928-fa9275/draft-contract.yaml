        kind: loaded_value
      span_sha256: 551a0c680d1d56deeac66adbfb3254e954e7fd487619fb2f71f1bbae01c84e9f
      text: Control coverage is exactly amendment.what_the_controls_exercise. Passing it validates those paths at those sizes and states. Correct behaviour of the pipeline on deployed rows at bit lengths other than 256 and 521, on F3 at bit lengths other than 521, on pipeline-produced BOUND states and on F2 away from 256 bits is an assumption, most exposed where large rows are BOUND.
