        kind: loaded_value
      span_sha256: fbe7e615f9be8655dc4afe74aeb69fda4fe8f6090e2b7f05f8e7b12acebd5e58
      text: Bins are descriptive. No bin on any row is read as curve-specific, and the null arm is context, not a test. The earlier generic-bin reading of CORR-20260923-187ea3 and CORR-20260923-5c5a23 S3 rests on a 256-bit random-prime sample only and is not extended to other sizes by this text.
    - entry_id: T-0451
      states_leaf: typed:interpretation_limits item 5
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
