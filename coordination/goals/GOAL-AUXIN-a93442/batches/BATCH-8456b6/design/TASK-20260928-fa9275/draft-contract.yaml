        kind: loaded_value
      span_sha256: e15345826482fffd48b7ca66b3f4b97d02701c4780ebe2b213d8e10c37038e6d
      text: status BOUND. W = {1, 2, m/2, m}. witness = 2 (tied exactly with m/2; the smaller is reported). upper bound = e_minus(2). lower bound = F_minus(r_M). bin UNDETERMINED with bin_at_least NEAR_CEILING, boundary_flag false. The construction's true branch value is near the floor; the control checks that the evaluator never promotes a bound and never bins a hidden divisor.
    - entry_id: T-0286
      states_leaf: typed:controls[C-BOUND].states[BND-2].why_fixed_in_advance
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.controls[C-BOUND].states[BND-2].why_fixed_in_advance
        kind: loaded_value
      span_sha256: 182f6472ddd9929747d2e4f7afe29a89376e0e9da86bb2439a4886c02e144a08
      text: C_minus - e_minus(2) = log2((sqrt(m) + 1)/(sqrt(m/2) + sqrt(2))) / log2(r_M), which is below 1/(2 log2(r_M)) + 2^-100. C_minus - F_minus = (log2(sqrt(m) + 1) - 1 - log2(m)/4)/log2(r_M), which exceeds (log2(m)/4 - 1)/log2(r_M) >= 62/log2(r_M) since m has 256 bits. So the witnessed depth is below 1/100, which is below 1/4 - tau.
