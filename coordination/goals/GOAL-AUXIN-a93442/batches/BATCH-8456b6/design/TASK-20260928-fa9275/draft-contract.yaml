      text: No cypari2 release executed at design time defines cypari2.__version__ (execution-transcripts.json, cypari2_builds.*.typed_version_command_as_held). The distribution version comes from importlib.metadata and the PARI version from Pari.version(), whose first three entries are the PARI version integers.
