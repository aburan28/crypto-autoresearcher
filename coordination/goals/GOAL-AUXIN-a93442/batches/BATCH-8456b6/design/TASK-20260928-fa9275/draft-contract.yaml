        kind: loaded_value
      span_sha256: e46ba161fd7c01119ce7c428f673ce2e4c0ce7ef4aca486099eb44b05352590e
      text: (entry 4.) All applicable clauses are evaluated, in the order above, on every candidate; evaluation never stops at the first reason. The result is the ordered list of reasons that fired, written to confounder_receipt.json per candidate, together with the verdict of each clause. The candidate is REJECTED if and only if the list is non-empty. A rejected deployed row is invalid_measurement for that row and is never factored.
    - entry_id: T-0103
      states_leaf: typed:change.D1_pins.confounder_check.scope_on_controls_and_null_arm
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
