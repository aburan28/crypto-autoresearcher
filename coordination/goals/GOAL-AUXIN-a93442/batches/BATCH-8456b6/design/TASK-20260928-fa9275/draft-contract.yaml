    - entry_id: T-0123
      states_leaf: typed:change.D4_calibration.threshold_inventory outside span INV-CLAIM
      segment: outside INV-CLAIM [124:1374]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D4_calibration.threshold_inventory
        kind: loaded_value
        char_range:
        - 124
        - 1374
      span_sha256: ad94fdb6419ed4814e03b0432bb591d8c50bf60b89be52c4b98bd86204a52ea4
      text: ' bin cut-offs 1/4 and 3/4 and boundary tolerance tau = 10^-45 (declared constants, applied to the depth s, whose normalisation F_b(r), C_b(r) is a closed-form function of the row''s own pinned r, a Stage P input); tie tolerance 10^-100 relative in e (declared constant); precision floor 150 digits and path tolerance 10^-50 (declared); floor-invariant slack 10^-45 and the rule T_plus(d) >= d (declared constant and F_b(r)); control gate tolerance 10^-6 (declared constant and F_b(r) of the control''s r); hasse bound 2*isqrt(p) + 2 (p, h, r of the same row, Stage P inputs); windows 2^24, 2^43 and 2^48, B = 256, M0, B_L = 521, M_L (declared); null-arm size 16 per class (declared); null-arm bit classes (the exact bit lengths of the pinned deployed r, Stage P inputs); factoring budget 3600 seconds per integer (frozen specification value); trial-division bound 2^24; F2/F3 routing size 272 bits; the B1 ladder and its curves-per-level column (change.D6_factoring); certificate cut-over 2^64 (change.D7_certificates); PDF digit check (substring test, no numeric cut-off). None of these is a function of any factoring or evaluation outcome of any deployed row, and none is a function of any null-arm value. No threshold is set after any value is seen.'
    - entry_id: T-0124
      states_leaf: typed:change.D4_calibration.what_the_null_arm_is_for
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D4_calibration.what_the_null_arm_is_for
        kind: loaded_value
      span_sha256: 0787759f7f94f9f9c9a023bf3fc9c5290653c39554b9ce90e5a08ca8b5dc0110
      text: Context only. It shows how often random primes of the same bit length receive each status and bin under the identical pipeline and budget. It licenses no curve-specific reading of any deployed row. A later amendment may pre-register a rule on the basis of this arm; this run's deployed rows are never re-scored by such a rule.
    - entry_id: T-0125
      states_leaf: typed:change.D5_controls.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D5_controls.rule
        kind: loaded_value
      span_sha256: 3c41d2da92eadb01569c4986dd9fe9288ce67accc2fcdb0025e9d67499168817
      text: 'Every control is fully declared in amendment.controls below, BEFORE any code, by search start, step order, primality test, acceptance rule, window, tie-breaks and gates, with every expected categorical outcome fixed by this text. The executor implements exactly that text. A control integer that differs from what the text determines voids the run (invalidation_rules). The construction factorization is written to controls_construction.json and is NOT given to the factoring pipeline, which factors each construction control blind, exactly as a deployed row. C-BOUND declared states are the one exception: they are passed directly to the evaluator by design and never enter the pipeline.'
    - entry_id: T-0126
      states_leaf: typed:change.D5_controls.expected_status_convention
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D5_controls.expected_status_convention
        kind: loaded_value
      span_sha256: d3a41cdea6969703eb4aae3123cddccea081f3e9c05829caf7472a579613d4fc
      text: (conventions.Q0-2.) For every construction control branch, the status this text fixes in advance is EXACT, because the construction supplies a complete factorization into proved primes. The run observes the status the blind pipeline returns under the frozen budget of 3600 seconds per integer. A construction-control branch the pipeline leaves BOUND or VOID fails its EXACT gate (outcome N1). A reviewer reproducing a control's classification from this text alone uses the constructed factorization and obtains EXACT.
    - entry_id: T-0127
      states_leaf: typed:change.D6_factoring.budget
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.budget
        kind: loaded_value
      span_sha256: 81413b9615e50d7ad1bcece94d32931d567cbd2b8e98bd36306de62c56efc020
      text: 'Each integer m_b (every branch of every construction control, null-arm and deployed row) receives the full factoring_seconds_per_integer = 3600 seconds. Factoring stops only when m_b is completely factored or that budget is spent. THERE IS NO BIT CAP: no integer and no part is excluded from any stage by its size.'
    - entry_id: T-0128
      states_leaf: typed:change.D6_factoring.clock
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.clock
        kind: loaded_value
      span_sha256: 57bf6760c9b38a368a566e6a07125b6cdeea0da6056a8ccb3bb672df3db69a69
      text: (F-J1-5, entry 9.) The budget clock is the executor process's monotonic wall clock (Python time.monotonic()), read immediately before and after every factoring call on a part, whether the call runs in-process (PARI through cypari2) or in a subprocess (GMP-ECM). The seconds charged to an integer are the sum of those intervals over all its parts and stages. The remaining budget R is 3600 minus the seconds charged so far.
    - entry_id: T-0129
      states_leaf: typed:change.D6_factoring.timeouts span F2-RECOG
      segment: span F2-RECOG at [178:295] of typed:change.D6_factoring.timeouts
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.span_rules[F2-RECOG].replacement
        kind: loaded_value
      span_sha256: 182507c835aea0913d9b93e02eb76ab6bdbbfd4487ede3aa822778a9ca069ee9
      text: 'The call is evaluated by the cypari2 Pari instance of corrective.tools.certificate_and_factoring_library.stack_allocation, as p("alarm(A, factor(n))") with A and n written in decimal. RECOGNITION, in this order: (i) if the call raises cysignals.signals.AlarmInterrupt, caught by naming that class, the call timed out (that class derives from KeyboardInterrupt, not from Exception, so a handler for Exception does not catch it); (ii) if the call returns a PARI object of type t_ERROR whose errname is e_ALARM (the gp-interface form of the same event), the call timed out; in case (i) or (ii) the part stays unfactored and the timeout is recorded together with which form was observed; (iii) if the call returns an object of type t_MAT, the call completed and that matrix is its factorization; (iv) any other exception, any other return type, or termination of the process by a signal is a crash under stopping_rules (memory protection or crash), never a timeout. After (i) or (ii) the same Pari instance serves later calls; admission item (3) checks that it remains usable.'
    - entry_id: T-0130
      states_leaf: typed:change.D6_factoring.timeouts outside span F2-RECOG
      segment: outside F2-RECOG [0:178]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.timeouts
        kind: loaded_value
        char_range:
        - 0
        - 178
      span_sha256: ccb5d5db259cc964de6e8c1a7dc1bb18462f8ed647162813e934db73714cb9f0
      text: 'F2 (in-process PARI): each call is issued as the GP expression alarm(A, factor(n)) with A = floor(R) seconds; if floor(R) < 1 the call is not made and the part stays unfactored. '
    - entry_id: T-0131
      states_leaf: typed:change.D6_factoring.timeouts outside span F2-RECOG
      segment: outside F2-RECOG [295:559]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.timeouts
        kind: loaded_value
        char_range:
        - 295
        - 559
      span_sha256: 97a19a02de153e85bd6fd9eb9707a10a35b464922e070623e96b7ffdd5c7d9fc
      text: ' F3 (GMP-ECM subprocess): each subprocess is started with a hard timeout of R seconds (killed on expiry, which is recorded). Any overrun of an alarm or kill beyond R is charged to the integer, is recorded, and is never refunded. No other timeout mechanism is used.'
    - entry_id: T-0132
      states_leaf: typed:change.D6_factoring.pipeline
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.pipeline
        kind: loaded_value
      span_sha256: 1eaf83dad9471d36c3e5805f4a31ed992bf9f4f434afac39d25ced3a6e1b7d59
      text: F0 trial division of m_b by every prime below 2^24. F1 every remaining part is tested for being a perfect power (and split if so) and screened for primality; prime parts go to certification and leave the pipeline. F2 every composite part of at most 272 bits goes to PARI factor() under the F2 timeout above; parts are processed in ascending size. F3 every composite part of more than 272 bits goes to GMP-ECM, run over the B1 ladder in ascending order with the fixed number of curves per level below, invoked as "ecm -one -c <curves> <B1>" with the part on standard input, repeating the last level if the ladder completes. After each ECM subprocess returns, every factor it reports that divides the part is split off; every resulting piece re-enters F1, and any composite piece of at most 272 bits goes to F2. For a piece that remains above 272 bits the ladder resumes at the level where it stopped, counting the curves already run at that level. The 272-bit value routes a part between two methods; it never ends the budget.
    - entry_id: T-0133
      states_leaf: typed:change.D6_factoring.ecm_curves_per_level span ECM-PROV
      segment: span ECM-PROV at [331:611] of typed:change.D6_factoring.ecm_curves_per_level
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.span_rules[ECM-PROV].replacement
        kind: loaded_value
      span_sha256: 1f0f91def0cbb515b83d596377742b18a002ee8b3b6d2fe0e8b0117452327638
      text: 'Provenance: none external is claimed. The attribution of this column to a GMP-ECM README table, which an earlier design session made from recollection, is WITHDRAWN (VAL-20260927-b99738 coverage entry 8 found that it does not match the README it retrieved). The column is a declared constant of this protocol, fixed before any value was seen, and its determinacy does not depend on any external table.'
    - entry_id: T-0134
      states_leaf: typed:change.D6_factoring.ecm_curves_per_level outside span ECM-PROV
      segment: outside ECM-PROV [0:331]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.ecm_curves_per_level
        kind: loaded_value
        char_range:
        - 0
        - 331
      span_sha256: ce684fc46bb716c2a2f59ba1494999f37836f0df132f4fb6ff4a2e803f32a4ad
      text: '(F-J1-3, entry 8.) DECLARED CONSTANTS of this protocol, not read from the installed tool: B1 = 2e3: 25 curves; 11e3: 90; 5e4: 300; 25e4: 700; 1e6: 1800; 3e6: 5100; 11e6: 10600; 43e6: 19300; 11e7: 49000; 26e7: 124000; 85e7: 210000; after the last level, 85e7 is repeated with 210000 curves per repetition until the budget is spent. '
    - entry_id: T-0135
      states_leaf: typed:change.D6_factoring.ecm_nondeterminism_disclosure
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.ecm_nondeterminism_disclosure
        kind: loaded_value
      span_sha256: ea9be4573cb06db3234a0d640613fca8fa0c75fbd954d2c9138e642901b54ec6
      text: GMP-ECM draws its own curve parameters (sigma), which are recorded per curve. Which composite parts a re-run splits within the budget may therefore differ, which can change EXACT versus BOUND on a deployed or null-arm branch. A certified factorization and every value derived from it never change.
    - entry_id: T-0136
      states_leaf: typed:change.D6_factoring.reporting
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.reporting
        kind: loaded_value
      span_sha256: 9ccf33af2afdddbe8cd7347aa0c0d035743acf5d6c1d76cc3b6fb1b2c444b3d1
      text: '(F-J1-4, entry 9.) Per integer: the list of parts it passed through, each identified by its decimal value, bit length and the stage that produced it; for EACH part, seconds charged in each of F0 to F3; the ECM curves run at each B1 level with their sigma values and seconds; every F2 alarm and F3 kill; the final list of certified prime powers; and the recorded composite parts with bit lengths, compositeness witnesses and perfect-power checks. Certificate generation is timed separately and is not charged to the factoring budget.'
    - entry_id: T-0137
      states_leaf: typed:change.D6_factoring.budget_semantics
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D6_factoring.budget_semantics
        kind: loaded_value
      span_sha256: 7f1e7a0766fbb16020d100019807ece16eb0f2333a1c3f209e417b170f0d72e2
      text: A BOUND row means the full budget was spent without completing the factorization. It is not a statement that the integer resists factoring, and it is never negative evidence (core rule 5).
    - entry_id: T-0138
      states_leaf: typed:change.D7_certificates.producing_library
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D7_certificates.producing_library
        kind: loaded_value
      span_sha256: 834a3224ce0cdfd1e2847485a9f7e0a86adc3a280dade185f462065a12a6999c
      text: 'PARI/GP through cypari2. For each prime p >= 2^64: an ECPP certificate from primecert(p), checked on the producing side by primecertisvalid. For each prime p < 2^64, and for the terminal prime of every ECPP chain: a Pratt certificate, built by path A from the complete factorization of p - 1 (recursively, to the leaf 2) with a witness a. PARI''s primecert returns a bare integer, not a certificate, for p < 2^64; that return is never treated as a certificate.'
    - entry_id: T-0139
      states_leaf: typed:change.D7_certificates.independent_verifier
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D7_certificates.independent_verifier
        kind: loaded_value
      span_sha256: d20cc5852b88aab6ce00629c684438e09a466a1ce53611c26949635e41fe5cdd
      text: 'A NEW library-free module, experiments/EXP-AUXIN-7e2e3d/implementation/typed/cert_verify.py, importing only the Python standard library (checked by the AST import audit at admission). It shares no code with PARI, GMP-ECM, FLINT, pypdf or sympy. Its version is the sha256 of its bytes at the launch commit. It checks. (i) Pratt: the listed prime powers multiply to p - 1; a^(p-1) = 1 mod p; a^((p-1)/f) != 1 mod p for each listed prime f; each f carries its own valid certificate. (ii) ECPP step with (N, t, s, a4, P = (x, y)): gcd(N, 6) = 1; m = N + 1 - t; s divides m and q = m/s; b = y^2 - x^3 - a4*x mod N; gcd(4*a4^3 + 27*b^2, N) = 1; [m]P is the point at infinity and [s]P is an affine point whose denominators are invertible mod N, both by exact arithmetic mod N; q > (c + 1)^2 where c is the least integer with c^4 >= N; the next step''s N equals q; the chain''s terminal q carries a valid Pratt certificate. (iii) Compositeness witnesses: the recorded base a is the smallest integer a >= 2 for which C fails the strong probable-prime test to base a (such a base exists for every odd composite C, including Carmichael numbers); the verifier re-runs that strong test. An even composite part has witness 2 recorded as "even". This arithmetic runs on auxiliary curves over Z/NZ for primality proofs only; it involves no curve of the frozen list and no auxiliary-input power.'
    - entry_id: T-0140
      states_leaf: typed:change.D7_certificates.changes_from_d1d10_with_reason
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D7_certificates.changes_from_d1d10_with_reason
        kind: loaded_value
      span_sha256: e6713ef2816e54aaa4891ae471404bcb767184ef4c461020610b7d372c9bf6f8
      text: The module path moves from implementation/d1d10/ to implementation/typed/ (change.D10_additivity). The check gcd(N, 6) = 1 is added and the compositeness witness becomes a strong-test witness; both close gaps VAL-20260923-c3c90c attack_iii recorded (the omitted gcd check and the Carmichael case). Nothing else changes.
    - entry_id: T-0141
      states_leaf: typed:change.D7_certificates.criterion_provenance
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D7_certificates.criterion_provenance
        kind: loaded_value
      span_sha256: f981f759ae363b14a2af41481183378086efba755c628f018c7a0fc1de290392
      text: The Goldwasser-Kilian and Atkin-Morain step criterion, Pratt's criterion and the existence of a strong-test witness for every odd composite are recalled by this design session (provenance recalled, pointer, not support). VAL-20260923-c3c90c attack_iii records a worked soundness check of the step criterion (internal). The admission self-tests are what the run relies on.
    - entry_id: T-0142
      states_leaf: typed:change.D7_certificates.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D7_certificates.rule
        kind: loaded_value
      span_sha256: 770b82e66c4758a7c220a7eda230c115c8b35a1b89b5264da3cb35310e2df1b8
      text: No prime enters an EXACT branch, and no r is pinned, unless path A produced its certificate AND the independent verifier accepted it. A verifier rejection voids the branch (or the row, for r). sympy is not used for any primality verdict.
