      span_sha256: d2649707c8e446fc5d31ac37ce7f3f7c0891c845212e8b9f2167b553d15a9a2c
      text: 'Run BEFORE launch and written first into the run directory as admission_receipt.json. (1) Each named tool is present, its exact version_command output is recorded, and the parsed version meets the minimum. (2) ECM self-test: printf ''(2^31-1)*(2^89-1)\n'' | ecm -one -c 25 2000 reports the factor 2^31-1 (decimal) within 600 seconds. '
    - entry_id: T-0199
      states_leaf: typed:tools_and_admission.admission_gate outside spans ADM-3, ADM-7
      segment: outside ADM-3, ADM-7 [452:871]
