    - entry_id: T-0459
      states_leaf: typed:proof_search_map.observation_collision.distinct_preimage_search
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.proof_search_map.observation_collision.distinct_preimage_search
        kind: loaded_value
      span_sha256: fb0a10be910675eceda2791f0653cffa516664a8ae104faa574011354cfcdc98
      text: Three collisions are named and separated. (1) The untyped frozen E(r) made the minus and plus problems collide in one number; the typed columns separate them. (2) An EXACT value and a BOUND upper bound can be equal; the status field separates them, and BND-1 forces exactly that case and checks both are reported with their statuses. (3) UNDETERMINED with bin_at_least NEAR_CEILING covers rows whose truth is near the floor as well as rows truly near the ceiling; status plus bin_at_least separates them, and BND-2 is the declared instance. Random primes producing the same bins as deployed rows are shown by the null arm, which is why no bin is read as curve-specific.
