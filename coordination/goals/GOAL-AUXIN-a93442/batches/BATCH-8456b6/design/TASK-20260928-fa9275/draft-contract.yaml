      span_sha256: 087feb5bf70ae680cde1561101c3de9cf83fecd5814a5e678f248627ff356deb
      text: At zero runs a reviewer reads each gate that needs a pipeline factorization (the blind EXACT status of a construction control, the F3 routing observation of C-PLANT-PL) as a RUN OBSERVATION. Its text is judged determinate when the expected value is fixed by the text alone (change.D5_controls.expected_status_convention); whether the pipeline attains that value is not reviewable before a run and is neither a pass nor a break of the text.
