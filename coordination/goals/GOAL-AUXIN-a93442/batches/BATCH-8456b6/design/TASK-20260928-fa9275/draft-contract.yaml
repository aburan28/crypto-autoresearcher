      span_sha256: 8c3d8feee6e8837bc04eb12b92745bba96d90a6efe9969327f692b1650e124cb
      text: 'Admission timeouts: 600 seconds for the ECM self-test (item 2) and 10 seconds of wall clock for the alarm self-test child (item 3); the alarm length A = 1 second inside that self-test. Minimum tool versions: GMP-ECM 7.0.4; cypari2 2.1.5 with PARI 2.15.4; pypdf 3.0.0 (held); Python 3.10. PARI stack: initial 2^27 bytes, ceiling 2^32 bytes. The screen''s optional trial-division bound of at most 2^16 (conventions.Q0-5). PR-SEC2''s continuation minimum of 4 characters. PR-EIP197''s required match count of exactly one. The PDF short-string length 20 of corrective.pins.pdf_digit_check_weakness (a reporting label, no stop). Expected sha256 digests and byte counts of the two pinned-revision files (equality tests, no cut-off). No constant in this list reads a deployed-row or null-arm outcome, and each was fixed before any such outcome existed.'
