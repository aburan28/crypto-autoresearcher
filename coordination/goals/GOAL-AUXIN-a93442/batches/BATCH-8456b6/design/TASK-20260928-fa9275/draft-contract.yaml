    - entry_id: T-0281
      states_leaf: typed:controls[C-BOUND].states[BND-1].why_fixed_in_advance
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.controls[C-BOUND].states[BND-1].why_fixed_in_advance
        kind: loaded_value
      span_sha256: 3826c032d53f693bb9ad2f62d7b8157749500ae3eaafce8016c12857efb9d770
      text: D and 2u are both within a factor 1 + 2^-37 of sqrt(m) by the C-PLANT-M recipe (d1 and d2 lie within 2^25 of isqrt(S), about 2^63, so D is within a relative 2^-37 of S = isqrt(M0), and 2u = m / D), so the upper bound is within 10^-6 of the floor and its depth exceeds 3/4. Every other member of W has T_minus at least sqrt(m/(2u)) + sqrt(2u) or larger, by the symmetry of T_minus and the sizes of 1, 2, u, 2uD.
