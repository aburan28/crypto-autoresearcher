        kind: loaded_value
      span_sha256: 57609cc68604fc51f20d3f3f671ca34cd4e2e17c6c343a704a81002201514970
      text: A typed, labelled arithmetic table at the pinned frozen orders only. Each exponent is conditional on the named auxiliary input being supplied; this experiment does not examine supply (IDEA-20260831-ccb587 unopened).
    - entry_id: T-0448
      states_leaf: typed:interpretation_limits item 2
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.interpretation_limits item 2
        kind: loaded_value
      span_sha256: d5fa1b5ecab051aae33c5dfacd2056dd28c1f252d89c88390c79179004304479
      text: Exponents are those of the leading expressions of Cheon 2006 Theorems 1 and 2 without the log p factor or O() constant, as read per CORR-20260923-187ea3. They are Cheon's known exponent realised at specific integers, not a new algorithm, and they are in Cheon step units, not the rho unit (change.D9_labelling.unit_statement_beside_rho).
    - entry_id: T-0449
      states_leaf: typed:interpretation_limits item 3
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.interpretation_limits item 3
        kind: loaded_value
      span_sha256: da483c4e27755361fd6d0a291c64ff181c87cbd41d5bf0cd7d89d7ec24a56204
      text: A BOUND row is a pair of bounds under the spent budget, never an exponent.
    - entry_id: T-0450
      states_leaf: typed:interpretation_limits item 4
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
