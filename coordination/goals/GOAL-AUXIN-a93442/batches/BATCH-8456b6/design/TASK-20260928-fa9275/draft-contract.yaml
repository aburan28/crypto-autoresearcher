      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.nextprime
        kind: loaded_value
      span_sha256: fa93a5870dea28ab6076cf5d8f38d9d37fe7bb581be5932a99968a8b1a230399
      text: nextprime_ge(x) is the least prime p with p >= x. nextprime_gt(x) is the least prime p with p > x. Each is searched upward by steps of +1 over the integers from its argument (even integers other than 2 may be skipped, since they are never prime; skipping never changes the result and never changes the count of conventions.Q0-4).
