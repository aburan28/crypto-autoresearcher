      - typed success_criterion.decidability
      text: On each of BND-1, BND-2 and BND-3, and on any constructed BOUND state evaluated under F-BOUND-CONSTRUCTED, the words "other than the value this text fixes" in the N4 condition are decided by the C-BOUND gate verdicts, evaluated as definitions.gate_evaluation_mode states, and by nothing else. A returned status, witness set, witness, bin, bin_at_least or boundary_flag is other than the fixed value if and only if it differs, on path A or on path B, from the value the state's expected block states, which is the comparison gate 1 makes, so gate 1 fails on that state. A returned upper or lower bound is other than the fixed value if and only if, on path A or on path B, it misses its expected closed-form expression by more than the gate-2 tolerance or the floor invariant fails, so gate 2 fails on that state; or, for the upper bound of BND-1, CONSISTENCY fails, so gate 3 fails. Exact equality of a real-valued bound is never tested. The N4 condition is therefore met on a state if and only if gate 1, gate 2 or gate 3 fails on that state on either path, which is exactly when stopping_rules item 10 fires with outcome N4. The condition and the stop cannot disagree.
      tested_meaning_of_N4: 'This states as text the reading success_criterion.decidability already requires (each outcome decided from the gate verdicts alone). Against the other reading a reviewer could name (exact equality of each bound), it fixes the bound comparison at the gate-2 tolerance. It does not widen N4: N4 tests the same fields, on the same states, at the tolerances the gates already apply. The FC5 row (FC5 maps to N4_BOUND_EVALUATOR_FALSIFIED, kept) is transcluded unchanged and needs no update, because it maps the condition to the outcome and states no tolerance.'
