        kind: loaded_value
      span_sha256: 13867e9dbea465c05d8a65d15ae6dc5bb8b09a586f0799a219cc80ae5ced619c
      text: 'For bit class L and index i = 0, 1, ..., 15: label is the ASCII string "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" followed by L in decimal, "/", and i in decimal, with no padding and no trailing newline. k = ceildiv(L, 8). X = the big-endian integer of the first k bytes of SHAKE-256(label), taken mod 2^(L-1). start = 2^(L-1) + X. The sample is nextprime_ge(start), searched upward by +1; if the search reaches 2^L it continues from 2^(L-1) upward.'
