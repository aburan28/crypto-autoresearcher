      text: '(entry 13, S2/O2.) C-PLANT-M, C-PLANT-P and C-INERT exercise, at B = 256 bits, the EXACT path through F0, F1 and F2, certification and evaluation on three constructed shapes. C-PLANT-PL exercises, at B_L = 521 bits, the EXACT path through F0, F1 and F3, certification of primes up to that size and evaluation on one constructed shape. C-BOUND exercises the BOUND evaluator on three declared states, including two composite parts. '
