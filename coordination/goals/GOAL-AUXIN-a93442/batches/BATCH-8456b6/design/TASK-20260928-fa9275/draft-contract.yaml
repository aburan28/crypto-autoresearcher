    - entry_id: T-0105
      states_leaf: typed:change.D2_typed_costs.source_statement
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.source_statement
        kind: loaded_value
      span_sha256: 7c2c66557d5765584d164bba7968433e2a415fcaecebcc1a11b93f927a820b66
      text: 'J. H. Cheon, Security Analysis of the Strong Diffie-Hellman Problem, EUROCRYPT 2006, LNCS 4004. Theorem 1: for d | p - 1, given g, g^alpha and g^(alpha^d), alpha is computed in O(log p * (sqrt((p-1)/d) + sqrt(d))) group operations. Theorem 2 (the theorem statement, not the 2006 abstract, whose "i = 0, 1, ..., d" is not followed): for d | p + 1, given the 2d consecutive powers g^(alpha^i), i = 1..2d, alpha is computed in O(log p * (sqrt((p+1)/d) + d)) group operations. Here p is the prime group order, called r in this experiment. The J. Cryptology 2010 version (Discrete Logarithm Problems with Auxiliary Inputs) states the same leading expressions with an Exp_G(p) factor, the linear d term on p + 1, and i = 1..2d.'
    - entry_id: T-0106
      states_leaf: typed:change.D2_typed_costs.provenance
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.provenance
        kind: loaded_value
      span_sha256: e5e1b5baaffbaf94ef35031036d96d5f327c28f84d8ac75bc91c60bb49bfbb17
      text: 'Both versions were retrieved and read by TASK-20260923-635c5c: the IACR archive copy of the 2006 paper and the 2010 author''s final manuscript (RT-20260923-38bbbf primary_sources; H-AUXIN-6db354 structural_ingredients, provenance retrieved). The Springer typeset 2010 version was read by no one. THIS design session did not open either paper; it relies on those records. The reopen condition of CORR-20260923-187ea3 (a source giving a sqrt(d) second term for d | p + 1) is recorded there as not met.'
    - entry_id: T-0107
      states_leaf: typed:change.D2_typed_costs.input_models
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.input_models
        kind: loaded_value
      span_sha256: cdacee3f56a16a3c17977ca628169fb8a90cf357365e0527ddf7697dbda28c46
      text: 'MINUS: "P, [x]P, [x^d]P (one auxiliary power, exponent d; Cheon 2006 Theorem 1)". Condition label: "Cheon 2010 Theorem 1''s deterministic time uses a generator of the multiplicative group mod r, found by factoring r - 1 at a heuristic cost of order r^(1/4+o(1)) (Cheon 2010 section 2.1); not included in the exponent". PLUS: "[x^i]P for i = 1..2d (2d consecutive auxiliary powers; Cheon 2006 Theorem 2)". Condition label: "ERH assumed in Cheon 2010 Theorem 2 (for a generator of the multiplicative group of the degree-2 extension); not included in the exponent". The condition labels are carried as labels on every row (O12) and are not heuristics of H-AUXIN-6db354.'
    - entry_id: T-0108
      states_leaf: typed:change.D2_typed_costs.columns
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.columns
        kind: loaded_value
      span_sha256: 0f3d5c7b4399540b4268bb588af06db8ab75cf22e9c069043f46dcbbeaf6fcae
      text: 'Two separate column groups per row, never merged. MINUS group: cost T_minus, input model and condition label as above. PLUS group: cost T_plus, input model and condition label as above. Every row, in each group, carries: status; the exponent (EXACT) or the bound pair (BOUND); the minimiser or witness d in decimal (field minimiser_d); bits of d (d.bit_length()); the input model as the literal string with the symbol d (field input_model, conventions.Q0-12); the condition label; memory_elements_log2 = log2(max(sqrt(m_b/d), sqrt(d))) at that d, the closed-form memory bound in group elements stated by both theorems (O13; not measured; not in the exponent; not a cost); and for the plus group log2(2d), the log2 of the number of consecutive powers the minimiser presupposes.'
    - entry_id: T-0109
      states_leaf: typed:change.D2_typed_costs.what_is_omitted
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.what_is_omitted
        kind: loaded_value
      span_sha256: 80431cba0d6c18dab19673dd2d583ea642ea6e2516e9783e031ccbc6fa0fde91
      text: 'The typed exponents use the theorems'' leading expressions without the log p (or Exp_G(p)) factor and without the O() constant. Direction of bias: they understate operation counts (the 2010 lemmas carry explicit constants above 1, per RT-20260923-38bbbf). The unit statement of change.D9_labelling is printed beside the rho column.'
    - entry_id: T-0110
      states_leaf: typed:change.D2_typed_costs.frozen_expression_on_plus
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.frozen_expression_on_plus
        kind: loaded_value
      span_sha256: 6f877b981b2351b8cbb47f5296313667ca6b29fc685147b1749d1048abfc610f
      text: DROPPED. No artifact of a run under this amendment evaluates sqrt(m/d) + sqrt(d) on the plus branch, in any column, labelled or not. On the minus branch that expression IS T_minus.
    - entry_id: T-0111
      states_leaf: typed:change.D2_typed_costs.no_combined_quantity
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.no_combined_quantity
        kind: loaded_value
      span_sha256: 1e077cbc660d798d5b9498f3b2d532040c6b274c778cafa48a46820497eebbb5
      text: The frozen E(r) (a minimum over both branches) is not produced. The branches answer different problems with different inputs (CORR-20260923-187ea3).
    - entry_id: T-0112
      states_leaf: typed:change.D2_typed_costs.floor_invariant
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D2_typed_costs.floor_invariant
        kind: loaded_value
      span_sha256: 911060b84fbbe9b81f356ee80d2628a42534cca727ca43b013a2048729aa88fc
      text: Every reported exponent or bound on branch b must satisfy e >= F_b(r) - 10^-45. On the plus branch every evaluated d must also satisfy T_plus(d) >= d. A violation on either path is the negative outcome N3.
    - entry_id: T-0113
      states_leaf: typed:change.D3_descriptive_bins.status_of_a_branch
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.status_of_a_branch
        kind: loaded_value
      span_sha256: e359b12be4144c4fe5abf86068df56c9d3221b367983d4d821340a25784ba72f
      text: EXACT when m_b is completely factored into primes, each proved under change.D7_certificates, and the product check holds. BOUND when one or more composite parts remain after the budget, each with a recorded compositeness witness and perfect-power check. VOID when the branch fails a validity rule (product mismatch, certificate failure, path disagreement). UNPINNED rows have no branches.
    - entry_id: T-0114
      states_leaf: typed:change.D3_descriptive_bins.recorded_parts
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.recorded_parts
        kind: loaded_value
      span_sha256: 9e8db308ebf571d001056f200be297c3f90a5d3c25d9df87174bd61a3ac76e2a
      text: (O10.) At the end of factoring a branch the pipeline records F_b, the certified factored part (the product of its certified prime powers), and the list of composite parts P_1, ..., P_k (k >= 1 for BOUND), each an integer greater than 1, with F_b * P_1 * ... * P_k = m_b. C_b denotes the product P_1 * ... * P_k of ALL unfactored parts. The list is written in factorizations.json in ascending order.
    - entry_id: T-0115
      states_leaf: typed:change.D3_descriptive_bins.explicit_witness_set
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.explicit_witness_set
        kind: loaded_value
      span_sha256: 4863e98f16aaa8ea868e13bfaebfcb693a572626cb6d6a097710ab1e42e9a7ec
      text: 'EXACT: every positive divisor of m_b, enumerated from the certified factorization. BOUND: W_b is the set of all integers e * (product of the parts in S), for every positive divisor e of F_b and every subset S of {P_1, ..., P_k} (the empty product is 1). Equal integers are counted once. Every member of W_b is an explicit divisor of m_b. With k = 1 this is {e, e*C_b : e | F_b}.'
    - entry_id: T-0116
      states_leaf: typed:change.D3_descriptive_bins.values_by_status
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.values_by_status
        kind: loaded_value
      span_sha256: 00a131448c6917d28f4adce39c06633e59662f197fad6576bb09529f969d8bd0
      text: 'EXACT: the exponent is the branch minimum over all divisors, with its minimiser. BOUND: the reported upper bound is the minimum of e_b over W_b, with its witness chosen by definitions.minimiser_and_ties over W_b, and the reported lower bound is F_b(r). The true branch exponent lies between them. A BOUND value is never reported as an exponent and never read as one.'
    - entry_id: T-0117
      states_leaf: typed:change.D3_descriptive_bins.per_typed_reading
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.per_typed_reading
        kind: loaded_value
      span_sha256: a7184a6b25edacd8f580c2ff51ca216142a4fba7b723ea674eb4b46a26bbb052
      text: Bins are computed per branch with that branch's typed cost only. A minus-branch witness is never evaluated with T_plus, and the reverse.
    - entry_id: T-0118
      states_leaf: typed:change.D3_descriptive_bins.stratification
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.stratification
        kind: loaded_value
      span_sha256: 43c68a3572c7c07b4d13ff893b2007cd6e4905095ee007b81a1c0643bb9002ad
      text: 'Every count or frequency of bins is reported separately for each stratum: deployed rows with expected_structure_flag false; deployed rows with expected_structure_flag true (BN254-r and BLS12-381-r, whose family polynomials force divisors, CORR-20260923-187ea3); construction controls; C-BOUND declared states; and the null arm per bit class. Strata are never pooled in a reported frequency.'
    - entry_id: T-0119
      states_leaf: typed:change.D3_descriptive_bins.semantics
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D3_descriptive_bins.semantics
        kind: loaded_value
      span_sha256: 87eae98260ba3dbbaca499bb00c8ef8d812338e8b0f47e6299763956bd5b217b
      text: None. A bin is a descriptive label. No bin, on any row, stops the run, triggers an escalation, names a curve, or is read as a property of how any curve was chosen.
    - entry_id: T-0120
      states_leaf: typed:change.D4_calibration.choice
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D4_calibration.choice
        kind: loaded_value
      span_sha256: 4da421073d9c56cdc6fe516bd203ebbb829344a0f8b82005c285284905244448
      text: (b) ESCALATE SEMANTICS REMOVED. The table is descriptive. The frozen e_inert_floor and e_escalate_ceiling are retired and no rule, stop or reading uses them. A pre-registered null arm of random primes (amendment.null_arm) runs in the same package, is completed and written BEFORE any deployed row is factored, and is reported beside the deployed rows with the same statuses, bins and strata.
    - entry_id: T-0121
      states_leaf: typed:change.D4_calibration.threshold_inventory span INV-CLAIM
      segment: span INV-CLAIM at [20:124] of typed:change.D4_calibration.threshold_inventory
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
