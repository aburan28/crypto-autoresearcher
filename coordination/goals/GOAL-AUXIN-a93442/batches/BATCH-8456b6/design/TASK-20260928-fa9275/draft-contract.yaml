      text: "replaces: corrective.falsification_condition_mapping.rows item 6.outcome of AMD-20260927-narrow.yaml\n      item: ER-3\n      fc: FC6 (a row omits either branch)\n      outcome: 'The row is incomplete, not negative. specification.yaml tail_checks item 1 governs (layer v1), quoted\n        verbatim: \"Report r-1 and r+1 separately; a missing branch voids the row.\" (sha256 of its UTF-8 bytes 26b53f8995afb04335a24612dcf48e736a2dd0e3d72d5f9b6b440b1a13cc5e52).\n        The row is void: every branch of that row, including a branch that was reported, is VOID, which gives S_PARTIAL_TABLE\n        (span SP-VOID of AMD-20260927-narrow.yaml); an omission caused by a crash is I_INFRA (stopping_rules item\n        14 of AMD-20260926-typed.yaml).'\n      status: kept (as H states it, incomplete and not negative)\n      unchanged_rows: rows 1 to 5 (FC1 to FC5) of AMD-20260927-narrow.yaml stay incorporated by hash\n    "
