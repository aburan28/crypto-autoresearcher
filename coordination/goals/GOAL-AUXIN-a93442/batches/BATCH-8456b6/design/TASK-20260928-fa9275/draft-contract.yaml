        kind: loaded_value
      span_sha256: 474d3ca7ef4ba20e6e30fee0d4132ba8917cdfdba430fcfbb97f1fdce996366c
      text: r is the decimal integer captured by the regular expression prime order `q\s*=\s*([0-9]+)` , in which each ` is the single character GRAVE ACCENT (U+0060) and every other character is read exactly as printed (Python re syntax, applied to the whole decoded file). This expression must match EXACTLY ONCE in the file; zero matches or more than one match is locator_failure.
