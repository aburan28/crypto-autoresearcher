    - entry_id: T-0154
      states_leaf: typed:change.D9_labelling.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D9_labelling.rule
        kind: loaded_value
      span_sha256: 77f0fac0452c5ec3ba00acb8863a3dc1e8af725b4de6571b610344d29356d795
      text: 'Per CORR-20260923-187ea3 labelling_rule_for_any_citing_record, with the unit statement of CORR-20260923-f5f060. The rho column is named rho_ordinary_input, value 0.5 (the frozen rho_baseline), and is annotated as the ordinary-input cost exponent of a different problem. Every typed exponent column name ends in E_ASSUMES_AUXILIARY_INPUT and names its branch. Every row states per branch the input model, the condition label and the bits of d (change.D2_typed_costs). The table header cites DEC-20260802-204 B032-C7 and B032-C8. The phrase "identical accounting" does not appear in any artifact. The supply condition is stated in the header: every typed exponent is conditional on the named auxiliary input being supplied, which this experiment does not examine (IDEA-20260831-ccb587 unopened).'
    - entry_id: T-0155
      states_leaf: typed:change.D9_labelling.unit_statement_beside_rho
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D9_labelling.unit_statement_beside_rho
        kind: loaded_value
      span_sha256: 18dc61ac0eb0f9ef98f76c001af18d904d3550ea1a4ba09b1854e3b19804df42
      text: '(entry 11.) Printed verbatim in the typed_table header immediately beside rho_ordinary_input, and in the execution report: "The typed exponents are exponents of the leading step-count expressions of Cheon''s Theorems 1 and 2. Each step is an exponentiation: the theorems carry an O(log p) group-operation factor (EUROCRYPT 2006) or an Exp_G(p) factor (J. Cryptology 2010). The typed exponents omit that factor and the O() constants, so they understate group-operation counts. The rho exponent counts group operations. The two units differ by a factor Theta(log r)." No artifact, report or citing record states that the typed exponents and the rho exponent are in the same unit.'
    - entry_id: T-0156
      states_leaf: typed:change.D9_labelling.secondary_metric_scope
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D9_labelling.secondary_metric_scope
        kind: loaded_value
      span_sha256: 31ed427744bf76a4e2980477e1fc1c695341f5a966c946d4acbc3bc603c4e891
      text: (entry 12, O3/S3.) The quantity "bits of the largest divisor of m_b not exceeding isqrt(r)" is reported on the MINUS branch only, labelled "arithmetic; on the minus branch it locates the divisor nearest the T_minus optimum". It is not computed or reported on the plus branch, where a divisor near sqrt(r) prices at T_plus >= d and is not a Theorem-2 quantity.
