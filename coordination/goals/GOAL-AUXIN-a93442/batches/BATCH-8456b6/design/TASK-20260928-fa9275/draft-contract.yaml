    - entry_id: T-0569
      states_leaf: narrow:corrective.pins.retrieval_digest_check.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
