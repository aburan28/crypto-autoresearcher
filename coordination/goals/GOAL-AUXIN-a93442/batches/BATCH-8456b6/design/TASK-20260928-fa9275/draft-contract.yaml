        kind: loaded_value
      span_sha256: 2c242914f612a2576644f2cff291eeb19f86b0ad6a4eb9527c2d9c73b723ffc9
      text: The minus branch with T_minus is exactly the frozen specification's cost_expression on r - 1, so the minus column reproduces the frozen quantity; F_minus is Cheon's balanced exponent on that branch, and F_plus is the minimum of Cheon's Theorem-2 leading expression.
    - entry_id: T-0457
