      span_sha256: 9d0f35843c28d676f1b4b55c1ba8d05d396e9bca2a43dbd09a89da5f395a0cf3
      text: The amended census instrument is falsified by N1, N2, N3 or N4. It is not falsified by any deployed-row or null-arm value, by a BOUND row, by an I_TEXT or I_CONTROL_COLLISION stop, or by an infrastructure failure.
    - entry_id: T-0447
      states_leaf: typed:interpretation_limits item 1
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
