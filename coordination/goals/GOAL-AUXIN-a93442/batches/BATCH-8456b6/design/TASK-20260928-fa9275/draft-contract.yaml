    - entry_id: T-0582
      states_leaf: narrow:corrective.controls.C-FIELD_cases_extracted.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.corrective.controls.C-FIELD_cases_extracted.rule
        kind: loaded_value
      span_sha256: c17d1367e70c67bef0de87e552b00b2b6a766fc038b1bfd77746bc1c4acb3f79
      text: 'For EVERY row whose field prime was extracted in Stage P (whether or not the row pinned) there is one case, id CF-X-<row id>. Its value is that extracted field prime, taken from the Stage P record and not restated in any text. It is presented to the confounder check as an r with NO printed cofactor, so the hasse clause does not apply to it. Expected reason list: exactly [field_prime]. No integer of any such case is written in this text.'
    - entry_id: T-0583
      states_leaf: narrow:corrective.controls.C-FIELD_cases_extracted.why_the_expected_reasons_are_fixed
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.corrective.controls.C-FIELD_cases_extracted.why_the_expected_reasons_are_fixed
        kind: loaded_value
      span_sha256: dabcb7458dc7dcb9cd592853fef3e9ea75bb476978a435e4f4465642a60cd419
      text: Each extracted field prime is proved prime at run time (change.D7_certificates); hence not_prime does not fire. Under the corrected FP each value is a member of FP, so field_prime fires. The hasse clause does not apply because no cofactor is presented.
    - entry_id: T-0584
      states_leaf: narrow:corrective.controls.C-FIELD_cases_extracted.mutation_sensitivity
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.corrective.controls.C-FIELD_cases_extracted.mutation_sensitivity
        kind: loaded_value
      span_sha256: fac8cec294ab54ec74ec40448d73b037abd0899fe46f1f4de8774e204de891c3
      text: If FP omits the extracted field prime of any row, that row's case is admitted and the gate below fails with outcome N2. In particular an FP built from the two C-FIELD expression values only (reviewer mutation M-FP of DEC-20260926-96f970 DF-2) admits every case whose row's field prime is not one of those two values, and the gate fails. The design-time locator run evaluated both FP definitions against these cases (execution-transcripts.json, pin_locators.fp_and_mutation).
