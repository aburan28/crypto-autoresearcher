        kind: loaded_value
      span_sha256: 4221d4eabd099199f6702a4dba169e8092d3c87d778db10ae8146bd544aa79b1
      text: factoring_seconds_per_integer = 3600 seconds, the frozen value of specification.yaml inputs.parameters.factoring_seconds_per_integer, restated here so that no budget is defined by reference. rho_baseline = 0.5, the frozen value of specification.yaml inputs.parameters.rho_baseline.
    - entry_id: T-0006
      states_leaf: typed:definitions.typed_costs
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.typed_costs
        kind: loaded_value
      span_sha256: 3d45812f490f20ddf920d29693c83e6062ef0b3e8e8980e52e050e95a0852682
      text: 'For a prime r and a branch b in {minus, plus}, let m_minus = r - 1 and m_plus = r + 1. For a positive divisor d of m_b: T_minus(d) = sqrt(m_minus / d) + sqrt(d)   (Cheon 2006 Theorem 1 leading expression); T_plus(d)  = sqrt(m_plus / d) + d          (Cheon 2006 Theorem 2 leading expression; Theorem 2, not the 2006 abstract). e_b(d) = log2(T_b(d)) / log2(r). Admissible d is every positive divisor of m_b, including 1 and m_b. The two branches are never combined: no quantity in this amendment is a minimum over both branches.'
    - entry_id: T-0007
      states_leaf: typed:definitions.analytic_floors_and_ceiling
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.analytic_floors_and_ceiling
        kind: loaded_value
      span_sha256: 34123fa86eae8d13458cf372600d85b564c2a1f784239f2de59e1e7bd31cba30
      text: F_minus(r) = (1 + log2(r - 1)/4) / log2(r), the exact minimum over real x > 0 of log2(sqrt(m_minus/x) + sqrt(x)) / log2(r). F_plus(r) = (log2(3) - 2/3 + log2(r + 1)/3) / log2(r), the exact minimum over real x > 0 of log2(sqrt(m_plus/x) + x) / log2(r), attained at x = (m_plus/4)^(1/3), called the T_plus optimum. C_b(r) = log2(sqrt(m_b) + 1) / log2(r), the value at d = 1 on either branch.
    - entry_id: T-0008
      states_leaf: typed:definitions.depth
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.depth
        kind: loaded_value
      span_sha256: 427f09e95f8bd78adb5d2240024eac9aceb4c4d65df74628807cba83873b8763
      text: For a REPORTED BRANCH VALUE e on branch b (an EXACT branch minimum or a BOUND witnessed upper bound), depth s = (C_b(r) - e) / (C_b(r) - F_b(r)). Because d = 1 is a candidate in every divisor set and every witness set, and F_b is the real minimum, every reported branch value satisfies F_b(r) <= e <= C_b(r) mathematically, so s lies in [0, 1]. A single e_b(d) at an arbitrary d need not lie in that range and is never binned. s near 1 means a divisor near the branch's analytic optimum; s near 0 means none.
    - entry_id: T-0009
      states_leaf: typed:definitions.bins span BINS-EXACT
      segment: span BINS-EXACT at [229:470] of typed:definitions.bins
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: ccd11216c3250d9ab69fafa7f4252a872704772a2091fc70989a198d1ca11dcd
      anchor:
        field_path: amendment.span_rules[BINS-EXACT].replacement
        kind: loaded_value
      span_sha256: 69a2ab9ba9dedbdb93ea7020f25b8609c3a361b424020884379e1adf2a331902
      text: 'For an EXACT value the rules are applied IN THIS ORDER and the first that applies gives the bin: (i) if boundary_flag is true, the value takes the bin on its lower-depth side, so s within tau of 3/4 gives INTERMEDIATE and s within tau of 1/4 gives NEAR_CEILING; (ii) NEAR_FLOOR if s >= 3/4 + tau; (iii) NEAR_CEILING if s <= 1/4 - tau; (iv) INTERMEDIATE otherwise. PRECEDENCE: the flag rule (i) precedes the cut-off rules (ii) and (iii). So s = 3/4 + tau exactly is flagged and gives INTERMEDIATE, s = 1/4 - tau exactly is flagged and gives NEAR_CEILING, and no s receives two bins.'
    - entry_id: T-0010
      states_leaf: typed:definitions.bins outside span BINS-EXACT
      segment: outside BINS-EXACT [0:229]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.bins
        kind: loaded_value
        char_range:
        - 0
        - 229
      span_sha256: 28a741142088b980f92caab41e27a0e9ace39e5a24331b6393eddd26f38944d2
      text: 'Descriptive bins of a reported branch value with depth s, using declared constants only. Let tau = 10^-45, an ABSOLUTE tolerance on s (conventions.Q0-8). boundary_flag is true if |s - 1/4| <= tau or |s - 3/4| <= tau, else false. '
    - entry_id: T-0011
      states_leaf: typed:definitions.bins outside span BINS-EXACT
      segment: outside BINS-EXACT [470:618]
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.bins
        kind: loaded_value
        char_range:
        - 470
        - 618
      span_sha256: 5b635a9ac878a282fe81872d7fa3a0a4cdec9b1292fb826ffc367fde4c2b5323
      text: ' For a BOUND value see change.D3_descriptive_bins.bin_by_status. Bins carry no stop, escalate, naming or decision semantics (change.D4_calibration).'
    - entry_id: T-0012
      states_leaf: typed:definitions.minimiser_and_ties
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.minimiser_and_ties
        kind: loaded_value
      span_sha256: 0af82091239a65423c0ca0993513811203edfa3397c4357bf7067011a63f20ff
      text: 'The branch minimum e* is the least e_b(d) over the explicit divisor set of the row status (change.D3_descriptive_bins). TIE RULE, relative in the exponent e (conventions.Q0-7): a divisor d is tied if e_b(d) - e* <= 10^-100 * e*. The reported minimiser is the SMALLEST tied divisor. On the minus branch d and m_minus/d always tie exactly, so the smaller member of that pair is reported.'
    - entry_id: T-0013
      states_leaf: typed:definitions.precision
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.precision
        kind: loaded_value
      span_sha256: 2d30aaba888d6f55f8e8586ad4862e5e72e2d35ec6c6630f7d0dfa2fbdbbacbc
      text: Every logarithm, square root and cube root is evaluated with at least 150 significant decimal digits. Path A and path B must agree on every reported exponent and bound within 10^-50 absolute, and exactly on status, minimiser, witness, bin, bin_at_least and boundary_flag (change.D7_certificates, independent recompute).
    - entry_id: T-0014
      states_leaf: typed:definitions.gate_evaluation_mode
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.gate_evaluation_mode
        kind: loaded_value
      span_sha256: 7cf7e2df54fb04c0fd89c390b919d2eedc60511307f2ea0031d9d59f0400202d
      text: (conventions.Q0-9.) Every gate inequality is evaluated numerically at the precision floor above, on path A and on path B separately. A lower gate of the form "0 <= e - F" is evaluated as e - F >= -10^-45, the same slack as change.D2_typed_costs.floor_invariant. An upper gate of the form "e - F <= c" is evaluated as e - F <= c with no slack. A gate holds only if it holds on both paths; if the two paths return different verdicts on any gate, the run stops with outcome N1 for a construction control, N2 for a C-FIELD gate, or N4 for a C-BOUND gate, because the instrument is then not determinate at its own precision.
    - entry_id: T-0015
      states_leaf: typed:definitions.whitespace_set
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.whitespace_set
        kind: loaded_value
      span_sha256: 92a10b4b06a7d8f0bbb309b4d8fcd992e541a093c1c9e41d1cc365c434a073a3
      text: For every parsing rule in this file, the whitespace set is the characters U+0009, U+000A, U+000B, U+000C, U+000D, U+0020, U+0085 and U+00A0. A backslash U+005C inside a value span is a line-continuation mark and is removed together with the whitespace set. Hex digits are 0-9, a-f and A-F. Decimal digits are 0-9.
    - entry_id: T-0016
      states_leaf: typed:definitions.line_numbering
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.line_numbering
        kind: loaded_value
      span_sha256: e0a1249df99218c205a763e70f1187aae02fd3a9689685a31a64376c4c834d44
      text: (DEC-20260923-a4c3d5 undischarged_defects entry 1, choice C5.) Every file is read as bytes and decoded as strict UTF-8 (a decoding failure is an infrastructure stop). Lines are delimited by LF (U+000A) ONLY. The line number of a character is 1 plus the number of LF characters before it. CR, NEL, form feed and every other character are line content. A "line" below is the text between two consecutive LF characters (or the file start or end). "Stripped content" means the line with every character of the whitespace set removed from both ends.
    - entry_id: T-0017
      states_leaf: typed:definitions.deployed_row
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.definitions.deployed_row
        kind: loaded_value
      span_sha256: d698c1b71f9c9d3649f54136e1bd006bdf17cbcdeb538a629ebc9b5e3389530e
      text: A row whose role in specification.yaml frozen_curve_list is deployed or deployed_pairing. The label is the frozen list's role name only.
    - entry_id: T-0018
      states_leaf: typed:change.D1_pins.rule
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.rule
        kind: loaded_value
      span_sha256: 18c5ae0dd0e50a812ca49abb4c25e51b2d5d8c9f3ab207da44bdb053d13f26b0
      text: 'Every deployed r is pinned AT RUN TIME, in Stage P, from the named primary-source file, by the parse rule named for that file below. For each row the executor records in orders.json: the source file path, the sha256 of the source file''s bytes, the first and last line numbers (definitions.line_numbering) of every value span it read, the verbatim bytes of those lines, the representation used (hex, decimal or expression), the parsed r in decimal and hex, and the result of every cross-check. No r is taken from code, from research/equation-schemes-20260905/parsed_safecurves.json, from any earlier run, from any review report or from memory.'
    - entry_id: T-0019
      states_leaf: typed:change.D1_pins.staged_source_binding
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.staged_source_binding
        kind: loaded_value
      span_sha256: 36af61068c30b7481cd415a86ffb05ae5235e5183a983d4b12e76e56556bb05a
      text: 'Before any parse, the executor computes the sha256 of each staged file it reads and compares it with the value this file states. A mismatch is an evidence-integrity stop; no row is pinned from a file that does not match. The values are those recorded in inputs/SAFECURVES-20260825/source_record.yaml and are restated here: inputs/SAFECURVES-20260825/specs/sp800-186.txt = 286001ea961ad675593bf67ca6ef4097c781f841fed3c2d52ae18ae2e73db2a2; inputs/SAFECURVES-20260825/specs/sp800-186.pdf = 53c7cf3340528aaa0a7bbeaef947f2099568192367d4341a7d4abceb55f78432; inputs/SAFECURVES-20260825/specs/sec2-v2.txt = 579265ec54e2ed9d77ec85929da3cc130d2997f6acb2ccada17dfa812af1daeb; inputs/SAFECURVES-20260825/specs/sec2-v2.pdf = 87b8f3703364ed5b21ba8582e411cc0cbf477bcaa3f4f45e0d6580d1c00d9952; inputs/SAFECURVES-20260825/specs/rfc5639.txt = d19949766009ac82b69e46b09f3a08d712908381300a340d3fa3b1478f4b215e; inputs/SAFECURVES-20260825/specs/rfc7748.txt = 279ca0ecc5e92e2962e27b846986aeb74729d9dd34bd4a04a362f80dcb596ad3.'
    - entry_id: T-0020
      states_leaf: typed:change.D1_pins.parse_rules.PR-SP800
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.parse_rules.PR-SP800
        kind: loaded_value
      span_sha256: 659edbefc19e152fa6490138c21c4d807f12770445ea2c478356c4bcb554e017
      text: '(NIST SP 800-186, derived text inputs/SAFECURVES-20260825/specs/sp800-186.txt.) BLOCK: from the first line whose stripped content equals the section number given for the row (for example "3.2.1.3.") to, exclusive, the next line whose stripped content matches the regular expression ^[0-9]+(\.[0-9]+)*\.$ . LABEL LINE for label L (L is p, h or n): the first line in the block whose content, after removing leading whitespace-set characters, begins with the two characters "L:". SPAN: from the character after "L:" to, exclusive, the earlier of (a) the first "(" character after "L:" and (b) the start of the next line in the block whose stripped content matches ^[A-Za-z]{1,4}: . DECIMAL FORM: the span with the whitespace set and backslashes removed; it is CLEAN if it is non-empty and consists of decimal digits only, otherwise CONTAMINATED (for example a printed expression whose superscripts or minus signs were lost, or interleaved page text) and it is then ignored and recorded as contaminated. HEX FORM: exists only if case (a) ended the span and, after that "(" and with the whitespace set removed, the next three characters are "=0x"; it runs from after "=0x" to, exclusive, the first ")" after it; with the whitespace set removed it is CLEAN if non-empty and hex digits only, otherwise CONTAMINATED and ignored. VALUE: if the hex form is clean, the value is its base-16 integer V. The decimal form is then compared only if it is clean AND has exactly as many digits as the decimal expansion of V: in that case it must equal V, else locator_failure. A clean decimal form with a different digit count is a printed expression whose operators were lost in the derived text (for example an exponent expression printed without its superscript and minus sign); it is recorded as decimal_span_not_a_literal and ignored. If the hex form is absent or contaminated and the decimal form is clean, the value is the decimal integer. If neither is clean, locator_failure. Which representation was used, and every ignored span with its reason, is recorded.'
    - entry_id: T-0021
      states_leaf: typed:change.D1_pins.parse_rules.PR-SEC2
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.parse_rules.PR-SEC2
        kind: loaded_value
      span_sha256: 6456796a3f594d99d894b1820c967e8c8599d5bf2b2e402737e53823f6d39035
      text: '(SEC 2 v2.0, derived text inputs/SAFECURVES-20260825/specs/sec2-v2.txt, whose inter-word spaces are lost.) BLOCK for curve C: from the first line whose content with the whitespace set removed matches ^[0-9]+(\.[0-9]+)+RecommendedParameters<C>$ to, exclusive, the next line whose content contains "RecommendedParameters". LABEL LINE for label L (p, n or h): the first line in the block whose stripped content equals L exactly AND whose next non-empty line begins, after leading whitespace, with "=". VALUE LINES: the characters after that "=" on its line (if any remain after whitespace removal) form the first value line; otherwise the first value line is the next non-empty line. The first value line must consist of hex digits only after whitespace removal. Each following line is a continuation if, after whitespace removal, it consists of hex digits only and has at least 4 characters; the first line that is not a continuation ends the value. VALUE: the base-16 integer of the concatenated value lines. Any failure is locator_failure.'
    - entry_id: T-0022
      states_leaf: typed:change.D1_pins.parse_rules.PR-RFC5639
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.parse_rules.PR-RFC5639
        kind: loaded_value
      span_sha256: b746076bb2ad82585d94f6d72e996e247e6f78a699974682bcec24a7f6bdd4e4
      text: '(RFC 5639, inputs/SAFECURVES-20260825/specs/rfc5639.txt, the RFC text itself.) BLOCK for curve C: from the first line whose stripped content equals "Curve-ID: C" to, exclusive, the next line whose stripped content begins with "Curve-ID:" or "#Twisted" or matches ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE for label L (p, q or h): the first line in the block whose stripped content begins with "L =" or equals "L =". VALUE: the characters after "=" on that line plus each following line whose stripped content is non-empty and consists of hex digits only; the first empty or non-hex line ends the value. The concatenation, with the whitespace set removed, is read in base 16. Any failure is locator_failure.'
    - entry_id: T-0023
      states_leaf: typed:change.D1_pins.parse_rules.PR-RFC7748
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.parse_rules.PR-RFC7748
        kind: loaded_value
      span_sha256: ad63185fd9c9721f4f50f2ada275acaabad13262a4b79953b53eb0ed30074a61
      text: (RFC 7748, inputs/SAFECURVES-20260825/specs/rfc7748.txt.) In section 4.1 (from the line whose stripped content is "4.1.  Curve25519" to the next line matching ^[0-9]+(\.[0-9]+)*\.\s ), the LABEL LINE for label L (order or p) is the first line whose stripped content begins with L followed by at least one whitespace-set character. Its remainder is an EXPRESSION of exactly one of the forms "2^E + 0xH" or "2^E - S", with E and S decimal and H hex, whitespace ignored; it is evaluated in exact integers. Any other form is locator_failure.
    - entry_id: T-0024
      states_leaf: typed:change.D1_pins.parse_rules.PR-IETF-DRAFT
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 3c57978c91b632226c0e0543913f8a122bb16d121b0a308254b1c99cedeeaad6
      anchor:
        field_path: amendment.change.D1_pins.parse_rules.PR-IETF-DRAFT
        kind: loaded_value
      span_sha256: eff3ed29cbb601ee444d8a35c431ddb4a3d4807ad2ff16af2c4fdfa240a6a49c
      text: '(Archived IETF Internet-Draft text.) BLOCK: from the first line whose stripped content matches ^[0-9]+(\.[0-9]+)*\.\s.*\(BLS12-381\)$ to, exclusive, the next line matching ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE for label L (p, r, h or t): the first line in the block whose stripped content, after removing one leading "*" and whitespace if present, matches ^L\s*[:=] . VALUE TEXT: the remainder of that line after the first ":" or "=", plus each following line whose stripped content is non-empty and consists only of hex digits, decimal digits, "0x", "x", "^", "+", "-" and whitespace; the first empty line or other line ends it. Whitespace removed, the value text is read as: a hex literal if it matches ^-?0x[0-9A-Fa-f]+$; a decimal literal if it matches ^-?[0-9]+$; a signed sum of powers of two if it matches ^-?2\^[0-9]+([+-]2\^[0-9]+)*$ (evaluated in exact integers). Anything else is locator_failure.'
    - entry_id: T-0025
      states_leaf: typed:change.D1_pins.parse_rules.PR-EIP197 span EIP-R
      segment: span EIP-R at [125:246] of typed:change.D1_pins.parse_rules.PR-EIP197
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
