      text: Factor both branches of every pinned deployed row, in frozen-list order, certify, and evaluate on path A.
    - entry_id: T-0207
      states_leaf: typed:stages[R_recompute].does
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
