      span_sha256: bd453ae50c530a0ecccf08a8c2d3a50a8f6c6899cf3cd0a3a262d2833f514218
      text: 'The kept phrase is identified by verbatim quotation from controls[C-PLANT-PL].declared_properties of AMD-20260926-typed.yaml, as a YAML safe loader returns that value: "Hence the plus minimiser is D_L, uniquely, and e_plus - F_plus is below 10^-6 by a wide margin." (sha256 of its UTF-8 bytes a0fad262cb56745a8de22412c1ebc03671c8daa40dfaa23992cd98e53af19bff). It bounds the plus-branch exponent gap e_plus - F_plus, not the depth s; the earlier description "an absolute tolerance on s" is replaced by this quotation. The phrase is kept as written and no gate reads it.'
