    - entry_id: T-0648
      states_leaf: gated:corrective.c_bound_gating
      segment: whole
      source_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
      source_commit: bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a
      source_blob_sha256: 77d1d5bfd8bf9d1c164903742c501f7161cc1b47814420d1957d6e39da9a8f3f
      anchor:
        field_path: amendment.corrective.c_bound_gating
        kind: source_bytes
        line_col_range:
        - 247
        - 6
        - 330
        - 4
      span_sha256: 1664bc47b2cd02d842629e61c8bf471ee812539825da4d0cc7ec4b6c1b30942b
      text: "item: DF-N1\n      repairs_used: (a) span G-GATE1 and (b) spans G-BND1 and G-BND3, together; (c) is not used\n      expected_value_source:\n        adds_to: controls[C-BOUND]\n        path_name: controls[C-BOUND].expected_value_source\n        text: 'Gate 1 of controls[C-BOUND] compares each returned field with the value stated in that state''s expected\n          block. After spans G-GATE1, G-BND1 and G-BND3, every declared state states bin, bin_at_least and boundary_flag:\n          BND-1 and BND-3 state bin NEAR_FLOOR, bin_at_least NEAR_FLOOR, boundary_flag false; BND-2 states bin UNDETERMINED,\n          bin_at_least NEAR_CEILING, boundary_flag false (held, unchanged). Each stated value equals the value corrective.bin_by_status\n          of AMD-20260927-narrow.yaml gives on that state''s witnessed depth: BND-1 and BND-3 are BOUND, unflagged,\n          with depth above 3/4 (each state''s held why_fixed_in_advance), and an unflagged depth above 3/4 is at\n          least 3/4 + tau, so bin_by_status gives NEAR_FLOOR and bin_at_least NEAR_FLOOR; BND-2 is BOUND, unflagged,\n          with depth below 1/100, below 1/4 - tau, so bin_by_status gives UNDETERMINED and bin_at_least NEAR_CEILING.\n          Hence the value condition success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED] reads (\"the value this\n          text fixes\") and the value gate 1 compares with are the same value on every declared state. No C-BOUND\n          state other than BND-1, BND-2 and BND-3 exists in a run (invalidation_rules item 6 of AMD-20260926-typed.yaml).\n          A reviewer who constructs a further BOUND state to test the rule evaluates gate 1 on it against the values\n          corrective.bin_by_status gives on that state''s witnessed depth, so on every BOUND state that bins NEAR_FLOOR\n          bin_at_least is defined (NEAR_FLOOR) and gated.'\n      one_outcome: 'For any evaluator correct under the combined text, and for any evaluator that departs from it\n        on a C-BOUND state, C-BOUND gate 1 and condition N4 have exactly one outcome together: a returned field\n        that differs from the stated value fails gate 1 on that path, stopping_rules item 10 stops the run with\n        N4, and the N4 condition is met by the same field; a returned field equal to the stated value passes gate\n        1 and does not meet N4. Tabulated in outcome_table.'\n      outcome_table:\n      - state: BND-1 or BND-3\n        evaluator: returns every expected field, bin_at_least NEAR_FLOOR\n        gate_1: pass\n        stopping_rules_item_10: does not fire\n        N4_condition: not met\n        outcome: run continues (S_VALID_TABLE or S_PARTIAL_TABLE eligible)\n        same_as_under_narrow: true\n      - state: BND-1 or BND-3\n        evaluator: bin_at_least other than NEAR_FLOOR, every other field as expected\n        gate_1: fail\n        stopping_rules_item_10: fires\n        N4_condition: met\n        outcome: N4 only\n        same_as_under_narrow: false\n        under_narrow: 'gate 1 passed (bin_at_least not stated, so not checked) while the N4 condition was met: two\n          outcomes'\n      - state: BND-1 or BND-3\n        evaluator: 'bin_at_least absent or null (E0 of RT-20260927-730157: correct under the typed text, silent\n          at BOUND NEAR_FLOOR)'\n        gate_1: fail\n        stopping_rules_item_10: fires\n        N4_condition: met\n        outcome: N4 only\n        same_as_under_narrow: false\n        under_narrow: 'gate 1 passed while the N4 condition was met: two outcomes'\n      - state: BND-2\n        evaluator: returns every expected field, bin_at_least NEAR_CEILING\n        gate_1: pass\n        stopping_rules_item_10: does not fire\n        N4_condition: not met\n        outcome: run continues\n        same_as_under_narrow: true\n      - state: BND-2\n        evaluator: bin_at_least other than NEAR_CEILING, or absent\n        gate_1: fail\n        stopping_rules_item_10: fires\n        N4_condition: met\n        outcome: N4 only\n        same_as_under_narrow: true\n      - state: any of the three\n        evaluator: any other expected field wrong (status, witness set, witness, bin, boundary_flag)\n        gate_1: fail\n        stopping_rules_item_10: fires\n        N4_condition: met\n        outcome: N4 only\n        same_as_under_narrow: true\n      - state: any of the three\n        evaluator: paths A and B return different bin_at_least\n        gate_1: verdicts differ between paths\n        stopping_rules_item_10: fires (gate fails on a path)\n        N4_condition: met on the wrong path\n        outcome: N4 only (definitions.gate_evaluation_mode assigns N4 for a C-BOUND gate)\n        same_as_under_narrow: BND-2 yes; BND-1 and BND-3 no (under narrow gate 1 did not compare bin_at_least there)\n      tested_meaning_of_N4: 'Unchanged relative to AMD-20260927-narrow.yaml: N4 tests every field of every declared\n        state against the value the combined text fixes, and on BND-1 and BND-3 that value was already NEAR_FLOOR\n        through corrective.bin_by_status. What changes is that gate 1, and so stopping_rules item 10, now tests\n        the same field. The FC5 row of corrective.falsification_condition_mapping (FC5 -> N4, kept) therefore needs\n        no change.'\n    "
