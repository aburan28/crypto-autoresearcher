        kind: loaded_value
      span_sha256: e114fde3d5e39c3633c95d67024891efa758dfd5bf02d7732ecbb01adc248408
      text: If a parse rule returns locator_failure, a cross-check fails, or two named sources for one row disagree, the row is UNPINNED. It is reported with the failure text, never dropped and never filled from another source. UNPINNED is not a negative result.
