      text: C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL are structurally distinct (their constructed factorizations differ in shape, and C-PLANT-PL has B_L bits), so their r values cannot coincide. The C-BOUND states reuse the C-PLANT-M and C-PLANT-P integers by design.
