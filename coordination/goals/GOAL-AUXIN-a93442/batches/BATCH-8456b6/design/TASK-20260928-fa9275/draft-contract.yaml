      text: 'For every branch of every deployed row, construction control, C-BOUND state and null-arm sample, three fields are reported: bin, bin_at_least and boundary_flag, each with exactly the value given here. EXACT: bin is given by definitions.bins; bin_at_least equals bin; boundary_flag is as definitions.bins defines it. BOUND: let s be the depth of the witnessed upper bound and boundary_flag the flag that definitions.bins computes on s. If boundary_flag is false and s >= 3/4 + tau, bin is NEAR_FLOOR and bin_at_least is NEAR_FLOOR (the true value is at least as deep). Otherwise bin is UNDETERMINED and bin_at_least is the bin that definitions.bins gives an EXACT value of depth s (so a witnessed depth within tau of 3/4 gives UNDETERMINED, bin_at_least INTERMEDIATE and boundary_flag true). VOID: bin, bin_at_least and boundary_flag are all null. UNPINNED rows have no branches and report none of the three. This clause and definitions.bins never give two answers, and no status and bin combination leaves bin_at_least undefined.'
