        kind: loaded_value
      span_sha256: 020692acd6d86740abc48f6984ec7e3de0342b88cda422b368e21dc255882e97
      text: 'Treating O() as hiding only a constant. DIRECTION OF BIAS: may understate real implementation cost. This experiment does not run Cheon, so the bias does not affect the arithmetic census.'
