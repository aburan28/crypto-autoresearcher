  # ---------------------------------------------------------------------------
  # STOP ASSESSMENT (the CD-6 form in the card).
  # ---------------------------------------------------------------------------
  stop_assessment:
    rule: >-
      Stop without a draft if RS-B cannot be stated without adding a governing
      layer onto AMD-EXP-AUXIN-7e2e3d-20260928-gated, or without superseding
      held fields of that amendment.
    fired: false
    branch_1_layer_added: >-
      No. EXP-AUXIN-edd104 incorporates no record by hash or by reference
      (F-PREC). AMD-20260928-gated keeps its place as the last text of
      EXP-AUXIN-7e2e3d, unchanged. Nothing governs on top of it, and it
      governs nothing in the successor.
    branch_2_held_fields_superseded: >-
      No. Every held field of AMD-20260928-gated stays exactly as held for
      EXP-AUXIN-7e2e3d (PA-8456b6-T1 T4). The successor copies from it and
      states its own rules for its own experiment. Supersession applies within
      one experiment's text, and there is none here.
    the_four_fields_that_stopped_the_s_discharge_producer:
      - {id: OB-1, field: incorporates_by_hash.status_of_the_incorporated_files, in_the_successor: "leaf_map disposition not_stated_envelope_or_layering. The successor incorporates nothing, so the approval tie OB-1 carries does not bind it. Its own approval condition is F-APPROVAL."}
      - {id: OB-2, field: precedence, in_the_successor: "not stated. F-PREC is the successor's only precedence rule. It names no layers, because there are none."}
      - {id: OB-3, field: governing_text_table, in_the_successor: "read as a design input only. The successor's own table is leaf_map, stated in the successor, with one disposition per held leaf."}
      - {id: OB-4, field: reading_of_self_references, in_the_successor: "not stated. F-READ is the successor's reading. It is new text over new objects (entries, leaf_map). It is not a copy or a paraphrase of OB-4."}
    agreement_with_the_prior_reading: >-
      This agrees with the resource_check of the TASK-20260928-d076fa report
      ("a successor experiment that states every rule once ... inherits none of
      OB-1 to OB-4"). That report is an unreviewed producer reading
      (DEC-20260928-0c6310 limitations). This conclusion was reached
      independently by constructing the successor. It still rests on this
      producer's reading and is unreviewed.
    residual_risk_a_reviewer_should_test: >-
      A reviewer could argue that using the held governing_text_table to
      choose which span states each leaf makes the successor depend on gated.
      The design's answer: that choice is recorded in the successor's own
      leaf_map, and the successor's text never refers to gated's table to
      decide anything (F-READ R3 maps any such reference to leaf_map). Whether
      leaf_map reproduces the held table's choices exactly is a checkable
      question; it is not a layer.

  # ---------------------------------------------------------------------------
  # DISPOSITION OF THE OPEN ITEMS (DEC-20260928-c4f3dc; BATCH-bc5afb ranking).
  # ---------------------------------------------------------------------------
  disposition:
    - id: DF-G1
      status: stated by fresh normative text (F-N4); unreviewed
      route: through the gate verdicts
      basis: >-
        The transcluded typed success_criterion.decidability (entry T-0445)
        already decides each outcome from gate verdicts alone. F-N4 makes that
        reading textual for the N4 condition (T-0438) against C-BOUND gates 1
        to 3 (T-0294 to T-0298) and stopping_rules item 10 (T-0380). The N4
        condition holds on a state exactly when a C-BOUND gate fails on it on
        either path.
      tested_meaning: >-
        Fixed at the gate tolerances. N4 is not widened. The FC5 row maps FC5 to
        N4_BOUND_EVALUATOR_FALSIFIED and states no tolerance, so it is
        transcluded unchanged (the CD-2 question, answered in F-N4).
    - id: DF-G2
      status: stated by fresh normative text (F-BOUND-CONSTRUCTED); unreviewed
      route: >-
        Such states are outside the protocol except in reviewer-evaluation mode
        (the transcluded typed invalidation_rules item 6, T-0392, makes an
        undeclared C-BOUND state in a run invalid_measurement). In that mode
        the expected status, witness set and witness come from the
        change.D3_descriptive_bins BOUND rules on declared parts. The expected
        bin, bin_at_least and boundary_flag come from corrective.bin_by_status
        on the witnessed depth. The reviewer records them before evaluating.
      why: >-
        Placing such states outside the protocol takes them out of every
        run-time decision. Naming the source removes the gap K-indeterminate
        (3) recorded, which the outside-the-protocol statement alone would
        leave open inside reviewer-evaluation mode.
    - id: DF-G3
      status: stated by fresh normative text (F-INDEX); unreviewed
      route: non-normative, excluded from blind comparison in any review plan of this contract
      readers_check: >-
        CD-3 bars this route if any normative clause reads the index. A token
        scan (threshold_index, threshold_inventory, inventory) over all 658
        entries and the fresh block finds only the index's own entries (T-0121,
        T-0627, T-0649, T-0652) and F-INDEX. Across the four held texts,
        outside the governing tables and supersession lists, the tokens occur
        only in the index fields, their span rule and their path-addition
        entry. The held gated status_of_the_index (transcluded) already says no
        gate, stop, validity rule or outcome reads it. Limitation: a clause
        that reads the index without naming it would not be found by a token
        scan.
    - id: O-1
      status: carried; no reader-map layer exists in RS-B
      note: >-
        Narrow span BN-K is stated at its position in the BN254-r pin source
        (entry T-0083), together with the outside segments. Its outcome is as
        held. No executed-layer field was changed.
    - id: O-2, O-4, RJ2-OBS-2
      status: carried as observations
      note: >-
        No fresh text cites reader-map counts. The cross-layer residues O-4
        names become single-file text, and a reviewer should re-check them in
        the new composition. RJ2-OBS-2 ("this field" in the index text) is
        covered by F-INDEX, because the index is non-normative.

  what_rs_b_reopens:
    text: >-
      As both rankings' why_not_first records, this composition has never been
      reviewed. Held status in a source round does not carry into it
      (PA-8456b6-T1 does_not_decide). Every joint, the regression set and the
      control-integer re-derivation are open again for EXP-AUXIN-edd104.
    new_surfaces_this_design_introduces:
      - leaf_map correctness (one disposition per held leaf, matching the held table's choices)
      - span cutting and composition of split leaves (character ranges, order)
      - F-READ, the single reading of references inside transcluded spans (R1 "this file" as same-source entries; R2 contract-wide phrases; R3 leaf_map resolution; R4 Q0-11 inside typed spans)
      - additions_read_together (16 groups, derived from the held path_additions)
      - F-N4, F-BOUND-CONSTRUCTED and F-INDEX, the only fresh normative content
      - F-CUSTODY (one added hash; T5 re-verification before Stage A0)
      - F-WRITE, whose implementation path stays under experiments/EXP-AUXIN-7e2e3d/implementation/typed/ as the transcluded text names it (F-READ R5)
    note: >-
      Listed for whoever freezes the review plan. This is not a review plan,
      assigns no owner and cards no reviewer.

