  # ---------------------------------------------------------------------------
  # THE DESIGN.
  # ---------------------------------------------------------------------------
  design:
    summary: >-
      One file, draft-contract.yaml, is the whole draft contract of
      EXP-AUXIN-edd104. It has four parts. (1) A FRESH block: identity, status
      draft, approved_by null, one precedence rule (F-PREC), one reading of
      references (F-READ), one approval condition (F-APPROVAL), one custody
      addition binding the new file (F-CUSTODY), a write scope (F-WRITE), the
      DF-G1 to DF-G3 statements (F-N4, F-BOUND-CONSTRUCTED, F-INDEX), a
      revision rule forbidding layers (F-REV), the carried dispatch
      preconditions (F-PRE), authorization none and non-claims. (2) TRANSCLUDED
      entries: 658 byte-exact spans of the held texts. (3) A FRESH leaf_map: one
      row for each of the 992 leaves of the held governing-text table, each
      with exactly one disposition. (4) A FRESH additions_read_together table:
      16 groups. The fresh block is authored in fresh-text.yaml. build_draft.py
      composes the file, cuts every span, and recomputes every hash on reload.
    leaf_dispositions:
      stated: 634 held leaves, stated by 658 transcluded entries (split leaves take several entries, in order)
      not_stated_envelope_or_layering: >-
        291 held leaves: identity, approval, review-route and provenance fields
        of each source, and the machinery by which the four layers governed one
        another (incorporation blocks, supersession lists, span-rule lists,
        precedence, governing tables, reading of self-references, path
        additions, governs_nothing, does_not_rewrite, cites, authorization,
        non_claims, and v1 write_scope). Each is replaced by one fresh field of
        this contract, or has no counterpart in a one-file contract.
      not_stated_superseded_in_held_table: >-
        67 v1 leaves that typed superseded. Each row lists replaced_by_entries,
        resolved from the amendment.<path> names in the typed supersedes_fields
        item it cites. Three rows have an empty list: two replaced by "the
        control ids and the null arm" with no path named, and one removed.
    how_a_split_leaf_is_stated: >-
      A leaf the held table split into span and outside rows is stated by the
      outside segments (character sub-ranges of the base field's loaded value,
      cut at the held from/through texts) and by the replacement span copied
      from where the held span rule put it (narrow span_rules[ID].replacement,
      gated gated_span_rules[ID].replacement, or gated
      corrective.threshold_index.text for INV-CLAIM). The leaf_map row names
      the position and character range.
    no_text_stated_twice: >-
      The builder refuses output if any two entries overlap (the same field, or
      one field inside another, in the same source). Indirect rows point at
      entries already stated at, above or below their target instead of
      copying again. Two such cases were found and fixed during the build: the
      FC6 outcome (inside gated corrective.falsification_condition_mapping_fc6)
      and corrective.interpretation_limits_item_6 of narrow (whose sub-fields
      are rows of their own). gated corrective.threshold_index is stated
      field by field, with its text field stated at the INV-CLAIM position.
    reproducible: >-
      python3 build_draft.py bb75521b79b8b5bdbe075ab6b85f7af6d2c0867a from the
      repository root rebuilds draft-contract.yaml byte for byte (checked by
      two consecutive runs giving the same sha256). T5 re-verification on
      reload reports zero failures.

  transclusion_route:
    route: both
    transcluded: >-
      Every held protocol leaf that the contract states. Each entry carries
      source_path, source_commit, anchor (field path, with a character range or
      byte range) and span_sha256, and is marked text_kind transcluded, apart
      from fresh text (PA-8456b6-T1, T1 to T3). Anchors follow one declared
      convention: loaded_value (614 entries; the string a YAML safe loader
      returns, the held span convention of AMD-20260927-narrow.yaml) or
      source_bytes (44 entries; exact blob text of a non-string value node,
      anchored by a line and column range).
      T5 check: every entry re-verified against its source blob, zero
      failures.
    fresh: >-
      Only fields no held text states: the successor's identity and approval,
      one precedence rule, one reading of references, one custody addition, the
      write scope, the three DF-G statements, the revision rule and the
      preconditions pointer. No held rule was restated freshly. So nothing
      held was retyped in the sense PA-8456b6-T1 defines.
    reconciliation_status: >-
      The card's constraint "Transclusion reconciliation is NOT in force" was
      written at opening (hash-bound at 68954e7b56). The live queue entry's
      revision_2_note says to read DEC-20260928-2afb23 plan_amendment once
      TASK-20260928-c2e1f1 verifies, and queue revision 3 records that it
      verified at 517b3f039a (PD-O1 discharged). This design relies on that
      reading. Open before any review plan freezes: the batch's closing ledger
      archive must still place DEC-20260928-2afb23 at its ledger path.
      PA-8456b6-T1 does_not_decide that a transcluded span is correct in its
      new context, so every transcluded span is unreviewed in this composition.

