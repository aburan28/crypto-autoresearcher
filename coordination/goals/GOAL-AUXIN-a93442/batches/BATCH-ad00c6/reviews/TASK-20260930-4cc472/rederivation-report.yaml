  - file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    field_path: amendment.definitions.prime
    offset: 10684
    byte_offset: 10684
    clause: |-
      "prime" means prime in the mathematical sense. A search accepts a candidate only if every integer its acceptance rule names is prime. OPERATIONAL SCREEN: the Baillie-PSW test, defined as a strong probable-prime test to base 2 followed by a strong Lucas probable-prime test with Selfridge method A parameters (D is the first of 5, -7, 9, -11, 13, ... with Jacobi symbol (D/n) = -1; P = 1; Q = (1 - D)/4). Trial division by small primes may precede it; that cannot change which candidate is first accepted (conventions.Q0-5). PROOF: every accepted integer is then proved prime by a certificate under change.D7_certificates. If a candidate passes the screen but its certificate run proves it composite, it is NOT accepted, the search continues from the next candidate, and the event is recorded. If the certificate run fails without proving compositeness, that is an infrastructure stop, never a skip.
    topics:
    - reading_of_references
    classification: protocol_content
  - file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    field_path: amendment.definitions.nextprime
    offset: 11679
    byte_offset: 11679
    clause: |-
      nextprime_ge(x) is the least prime p with p >= x. nextprime_gt(x) is the least prime p with p > x. Each is searched upward by steps of +1 over the integers from its argument (even integers other than 2 may be skipped, since they are never prime; skipping never changes the result and never changes the count of conventions.Q0-4).
    topics:
    - reading_of_references
    classification: protocol_content
