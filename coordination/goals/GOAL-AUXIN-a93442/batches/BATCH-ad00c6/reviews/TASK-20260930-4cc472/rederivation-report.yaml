    field_path: amendment.definitions.bins
    offset: 14267
    byte_offset: 14267
    clause: |-
      Descriptive bins of a reported branch value with depth s, using declared constants only. Let tau = 10^-45, an ABSOLUTE tolerance on s (conventions.Q0-8). boundary_flag is true if |s - 1/4| <= tau or |s - 3/4| <= tau, else false. For an EXACT value: NEAR_FLOOR if s >= 3/4 + tau; NEAR_CEILING if s <= 1/4 - tau; a flagged value takes the bin on its lower-depth side (s within tau of 3/4 gives INTERMEDIATE; s within tau of 1/4 gives NEAR_CEILING); INTERMEDIATE otherwise. For a BOUND value see change.D3_descriptive_bins.bin_by_status. Bins carry no stop, escalate, naming or decision semantics (change.D4_calibration).
    topics:
    - reading_of_references
    classification: protocol_content
  - file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    field_path: amendment.definitions.gate_evaluation_mode
    offset: 15786
    byte_offset: 15786
    clause: |-
      (conventions.Q0-9.) Every gate inequality is evaluated numerically at the precision floor above, on path A and on path B separately. A lower gate of the form "0 <= e - F" is evaluated as e - F >= -10^-45, the same slack as change.D2_typed_costs.floor_invariant. An upper gate of the form "e - F <= c" is evaluated as e - F <= c with no slack. A gate holds only if it holds on both paths; if the two paths return different verdicts on any gate, the run stops with outcome N1 for a construction control, N2 for a C-FIELD gate, or N4 for a C-BOUND gate, because the instrument is then not determinate at its own precision.
    topics:
    - reading_of_references
    classification: protocol_content
