fresh:
  text_kind: fresh
  id: DXP-AUXIN-339fb0
  id_provenance: Minted by TASK-20260929-d519f6 with `python3 tools/allocate_id.py
    --next experiment --area AUXIN` and confirmed with `--check EXP-AUXIN-339fb0`
    (well-formed and free across the union, zero occurrences).
  predecessor_experiment_id: EXP-AUXIN-7e2e3d
  refused_drafts:
  - EXP-AUXIN-edd104
  - EXP-AUXIN-bafa2e
  - EXP-AUXIN-92dccc
  - EXP-AUXIN-55c6c0
  - EXP-AUXIN-369078
  hypothesis_id: H-AUXIN-6db354
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-ad00c6
  producer_task: TASK-20260929-d519f6
  design_record: coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ad00c6/design/TASK-20260929-d519f6/design-report.yaml
  kind: successor_experiment_contract_stating_every_rule_once
  status: draft
  approved_by: null
  approval_decision: null
  scope_by_citation: 'DEC-20260929-4eade7 next_actions (F-REV / K-revise) and DEC-20260929-e9d034
    BATCH-ad00c6 opening: a new successor contract under a new EXP id, not an amendment
    to EXP-AUXIN-369078 or EXP-AUXIN-7e2e3d. RS-B stays the selected scope family.
    Not restated in this contract.'
  text_kinds:
    fresh: Every field of this fresh block, protocol_normative, and self_reference_table.
      Fresh text is normative wording that lives only in this contract file.
    transcluded: None. transcluded.entries is the empty list. This contract does not
      use byte-exact spans from held records.
  hypothesis_binding:
    id: F-H
    text: This experiment tests H-AUXIN-6db354 as that record stands (status proposed;
      not edited by this contract). Falsification conditions reach outcomes only through
      protocol_normative.falsification_condition_mapping and success_criterion.outcomes
      stated in this file. The interpretation_limits correction of H-AUXIN-6db354
      named in DEC-20260926-96f970 next_actions item 2 is not folded in. If that correction
      is made before approval and changes a condition this mapping reads, this contract
      is not approvable; a new successor contract is written instead.
  precedence:
    id: F-PREC
    text: This file is the only governing text of EXP-AUXIN-339fb0. No other file
      governs any part of it. EXP-AUXIN-7e2e3d, its specification and every amendment
      are unchanged, cited for provenance only, and govern nothing in this contract.
      EXP-AUXIN-369078 and earlier refused drafts govern nothing. Each rule is stated
      once in protocol_normative or in a fresh field of this fresh block. No record
      is bound by content-digest of a held path. No rule is held by reference to any
      EXP-AUXIN-7e2e3d path. No AMD-edit rule and no incorporates.sha256 comparison
      of any held amendment is a run-time rule of this contract.
    reserved_topics: On revision (F-REV), approval (F-APPROVAL), custody (F-CUSTODY),
      write scope (F-WRITE), reference reading (F-READ and F-PRE; conventions.Q0-11
      is absent and does not decide), blind-report attestation (F-ATT), and execution
      admission (protocol_normative.execution_admission), only the fresh fields and
      protocol_normative sections named in the design report decide. Held records
      are not sources of run-time rules.
  reading_of_references:
    id: F-READ
    order: For each reference in this file, apply the first applicable rule below
      and stop. R4 applies only to phrases listed in self_reference_table with rule_id
      R4.
    rules:
    - id: R1
      text: '"This contract", "this contract file", "this file", "this experiment",
        "this specification", "this protocol", "this frozen contract", "the frozen
        contract", "this text", "this amendment", "this draft", "this design", "this
        successor", "this successor contract", "this fresh block", "this successor_contract
        block", and "EXP-AUXIN-339fb0" mean the YAML file whose top-level key is successor_contract
        (the file that contains this successor_contract block). A gate or requirement
        naming one of these phrases is satisfied only by this file at the launch commit,
        never by any EXP-AUXIN-7e2e3d file and never by any refused draft.'
    - id: R2
      text: A repository path beginning experiments/EXP-AUXIN-339fb0/ is read as written.
        A path beginning experiments/EXP-AUXIN-7e2e3d/ is provenance only and is never
        opened, hashed or compared at run time. A relative path beginning implementation/
        means experiments/EXP-AUXIN-339fb0/implementation/.
    - id: R3
      text: A reference to a decision, review, finding, report, design report, correction,
        task or transcript gives provenance only, except where F-PRE expressly requires
        loading the named dispatch_preconditions_carried string by the sha256 this
        contract cites.
    - id: R4
      text: A phrase listed in self_reference_table with rule_id R4 names the object
        that table row describes (within the entry or section that contains the phrase),
        never an external document.
  approval:
    id: F-APPROVAL
    status: draft
    approved_by: null
    approved_if_and_only_if: A committed Coordinator decision, OFFICIAL once its ledger
      archive is verified against Git by tools/research_dispatch.py, approves EXP-AUXIN-339fb0
      by name, after a review round under a review plan frozen before any reviewer
      ran has reviewed this file at the sha256 that decision names. In any other state
      this contract is not approved and authorizes nothing.
    how_approval_is_recorded: In that decision only. This file is never edited afterwards,
      not even this fresh block.
  custody:
    id: F-CUSTODY
    defined_terms:
      contract_file: The successor contract YAML of EXP-AUXIN-339fb0 at the launch
        commit.
      implementation_tree: experiments/EXP-AUXIN-339fb0/implementation/typed/ only.
      successor_contract_sha256: Sha256 of contract_file bytes at launch.
      trial_plan: experiments/EXP-AUXIN-339fb0/implementation/typed/trial-plan.json.
      manifest: experiments/EXP-AUXIN-339fb0/implementation/typed/manifest.yaml.
      dirty_summary: Output of git status --porcelain=v1 at launch, recorded verbatim
        in manifest.
    scope: Custody binds contract_file, implementation_tree, trial_plan and manifest
      only. Custody binds no file under experiments/EXP-AUXIN-7e2e3d/.
    trial_plan_rule: trial_plan records successor_contract_sha256 at launch. The run
      recomputes it at launch and at every stage boundary; mismatch is evidence-integrity
      failure and stops immediately.
    manifest_rule: manifest records dirty_summary, launch commit, implementation snapshot
      task and commit, successor_contract_sha256, tool versions, third-party distributions
      and the inference block. Launch is refused if dirty_summary lists contract_file
      or any path under implementation_tree. A dirty_summary line naming any other
      path is recorded and refuses nothing.
    admission_item_successor_hash: Admission requires successor_contract_sha256 in
      trial_plan to equal the sha256 of contract_file at the launch commit.
    invalidation_after_approval: Any edit of contract_file after approval is evidence-integrity
      failure. No edit of any AMD-* file under experiments/EXP-AUXIN-7e2e3d/amendments/
      and no mismatch against any incorporates.sha256 of a held amendment is an invalidation
      rule of this contract.
    independence: No gate, stop, launch refusal, admission item, validity rule, invalidation
      rule or outcome depends on the bytes, hash or git status of any file under experiments/EXP-AUXIN-7e2e3d/.
      No run-time procedure opens those paths. No rule READs FROM, stands on, or binds
      by content-digest any EXP-AUXIN-7e2e3d path. No corrective_overlays custody
      rule names an AMD edit or an incorporates.sha256 comparison as a run-time invalidation.
  write_scope:
    id: F-WRITE
    paths:
    - experiments/EXP-AUXIN-339fb0/
    implementation_modules: The run uses new modules under experiments/EXP-AUXIN-339fb0/implementation/typed/
      and edits no implementation file of any other experiment.
    note: contract_file is placed under experiments/EXP-AUXIN-339fb0/ only by a later
      archived act. The draft contract of EXP-AUXIN-339fb0 lives in the design directory
      until then.
  revision_rule:
    id: F-REV
    text: This contract is never rewritten in place and no amendment layers it. Any
      change, including one a review requires, is a new successor contract under a
      new EXP id that states every rule once. This is the only revision rule. No later
      amendment of any experiment may revise, layer, or pre-register a rule for this
      contract.
  review_attestation_requirement:
    id: F-ATT
    discharges:
    - PD-C14b284-1
    - PD-C36b01a-1
    text: 'Any blind re-derivation report, and any report that carries a review_attestation
      block, under a review plan that reviews this contract MUST set inside that attestation
      block all of: (1) review_attestation.task_id to the reviewing TASK id (PD-C14b284-1);
      (2) review_attestation.joints_owned to the list of joint ids that report owns
      (for a single-joint blind card, a one-element list such as [EJ7]); and (3) review_attestation.verdict
      or review_attestation.verdicts naming the joint verdict(s) (PD-C36b01a-1). Outer
      report.task_id, outer joint_owned, or outer verdict alone do not satisfy this
      requirement. A missing or empty review_attestation.task_id, missing joints_owned,
      or missing both verdict and verdicts is a procedure defect of that report.'
  n4_bound_comparison:
    id: F-N4
    discharges: DF-G1 (DEC-20260928-c4f3dc defects_to_discharge)
    reads_with:
    - protocol_normative.success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED]
    - protocol_normative.controls entry C-BOUND
    - protocol_normative.stopping_rules bound-evaluator stop
    - protocol_normative.definitions.gate_evaluation_mode
    text: On each declared C-BOUND state, the N4 condition is met if and only if gate
      1, gate 2 or gate 3 of C-BOUND fails on either path, matching the bound-evaluator
      stopping rule. Exact equality of a real-valued bound is never tested; gate-2
      tolerance applies.
  constructed_bound_states:
    id: F-BOUND-CONSTRUCTED
    discharges: DF-G2
    text: BOUND states outside the declared C-BOUND set occur only in reviewer-evaluation
      mode and are outside the protocol for runs. F-N4 decides comparisons in that
      mode; a reviewer error is not a run outcome.
  threshold_index:
    id: F-INDEX
    discharges: DF-G3
    text: protocol_normative.threshold_index is non-normative. No gate, stop, validity
      rule or outcome reads it. Cut-offs govern from their own clauses. No threshold
      inventory of this contract is completed by conjunction with any held AMD field.
  q0_11_status:
    id: F-Q011
    text: conventions.Q0-11 is absent from protocol_normative.conventions of this
      contract. Reference reading is decided only by F-READ, F-PRE and F-PREC as named
      in the design report. No Q0-11 DO-NOT-TAKE rule conflicts with F-PRE load-by-hash
      of DEC-20260927-f680f7.dispatch_preconditions_carried.
  execution_preconditions:
    id: F-PRE
    text: 'Any future executor card carries, unweakened, DEC-20260927-f680f7 dispatch_preconditions_carried
      (cited, not restated; sha256 of the loaded string: c3be35ae13929b45fc10dbf65f2b28cdb10a1e2580b6d7d6b57b1cf6fcd1e553)
      and protocol_normative.tools_and_admission.provisioning_precondition. Loading
      that named string by the cited sha256 is expressly allowed by F-READ R3 and
      is not forbidden by any conventions entry.'
  authorization: This contract authorizes no run, no implementation dispatch and no
    executor card. It approves nothing and sets no execution-authorization field.
  non_claims:
  - Asserts nothing about any curve, census value, whether H-AUXIN-6db354 is true,
    any deployed system or any exponent.
  - Does not rehabilitate prior runs named in EXP-AUXIN-7e2e3d records.
  - Does not rehabilitate refused drafts EXP-AUXIN-edd104, EXP-AUXIN-bafa2e, EXP-AUXIN-92dccc,
    EXP-AUXIN-55c6c0 or EXP-AUXIN-369078.
