    reserved_topics: >-
      On revision (F-REV), approval (F-APPROVAL), custody (F-CUSTODY), write
      scope (F-WRITE), reference reading (F-READ), and execution admission
      (protocol_normative.execution_admission), only the fresh fields and
      protocol_normative sections named in the design report decide. Held
      records are not sources of run-time rules.

  reading_of_references:
    id: F-READ
    order: >-
      For each reference in this file, apply the first applicable rule below and
      stop. R4 applies only to phrases listed in self_reference_table with
      rule_id R4.
    rules:
    - id: R1
      text: >-
        "This contract", "this file", "this experiment", "this specification",
        "this protocol", "this frozen contract", "the frozen contract", and
        "EXP-AUXIN-92dccc" mean the file that contains this successor_contract
        block. A gate or requirement naming one of these phrases is satisfied
        only by this file at the launch commit, never by any EXP-AUXIN-7e2e3d
        file.
    - id: R2
      text: >-
        A repository path beginning experiments/EXP-AUXIN-92dccc/ is read as
        written. A path beginning experiments/EXP-AUXIN-7e2e3d/ is provenance
        only and is never opened, hashed or compared at run time. A relative path
        beginning implementation/ means
        experiments/EXP-AUXIN-92dccc/implementation/.
    - id: R3
      text: >-
        A reference to a decision, review, finding, report, design report,
        correction, task or transcript gives provenance only.
    - id: R4
      text: >-
        A phrase listed in self_reference_table with rule_id R4 names the object
        that table row describes (within the entry or section that contains the
        phrase), never an external document.

  approval:
    id: F-APPROVAL
    status: draft
    approved_by: null
    approved_if_and_only_if: >-
      A committed Coordinator decision, OFFICIAL once its ledger archive is
      verified against Git by tools/research_dispatch.py, approves
      EXP-AUXIN-92dccc by name, after a review round under a review plan frozen
