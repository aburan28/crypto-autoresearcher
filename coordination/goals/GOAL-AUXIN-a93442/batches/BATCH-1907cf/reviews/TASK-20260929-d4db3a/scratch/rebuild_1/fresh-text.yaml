  precedence:
    id: F-PREC
    text: >-
      This file is the only governing text of EXP-AUXIN-92dccc. No other file
      governs any part of it. EXP-AUXIN-7e2e3d, its specification and every
      amendment are unchanged, cited for provenance only, and govern nothing in
