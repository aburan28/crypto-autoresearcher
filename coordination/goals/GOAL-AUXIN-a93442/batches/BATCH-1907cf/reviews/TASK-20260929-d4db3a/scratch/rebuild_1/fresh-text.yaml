  hypothesis_binding:
    id: F-H
    text: >-
      This experiment tests H-AUXIN-6db354 as that record stands (status
      proposed; not edited by this contract). Falsification conditions reach
      outcomes only through protocol_normative.falsification_condition_mapping
      and success_criterion.outcomes stated in this file. The
