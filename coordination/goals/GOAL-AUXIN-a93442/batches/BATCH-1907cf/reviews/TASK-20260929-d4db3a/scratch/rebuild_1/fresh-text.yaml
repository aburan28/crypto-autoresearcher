      nothing.
    how_approval_is_recorded: >-
      In that decision only. This file is never edited afterwards, not even this
      block.

  custody:
    id: F-CUSTODY
    defined_terms:
      contract_file: The successor contract YAML of EXP-AUXIN-92dccc at the launch commit.
      implementation_tree: experiments/EXP-AUXIN-92dccc/implementation/typed/ only.
      successor_contract_sha256: Sha256 of contract_file bytes at launch.
      trial_plan: experiments/EXP-AUXIN-92dccc/implementation/typed/trial-plan.json.
      manifest: experiments/EXP-AUXIN-92dccc/implementation/typed/manifest.yaml.
      dirty_summary: Output of git status --porcelain=v1 at launch, recorded verbatim in manifest.
    scope: >-
      Custody binds contract_file, implementation_tree, trial_plan and manifest
      only. Custody binds no file under experiments/EXP-AUXIN-7e2e3d/.
    trial_plan_rule: >-
      trial_plan records successor_contract_sha256 at launch. The run recomputes
      it at launch and at every stage boundary; mismatch is evidence-integrity
      failure and stops immediately.
    manifest_rule: >-
      manifest records dirty_summary, launch commit, implementation snapshot task
      and commit, successor_contract_sha256, tool versions, third-party
      distributions and the inference block. Launch is refused if dirty_summary
      lists contract_file or any path under implementation_tree. A dirty_summary
      line naming any other path is recorded and refuses nothing.
    admission_item_successor_hash: >-
      Admission requires successor_contract_sha256 in trial_plan to equal the
      sha256 of contract_file at the launch commit.
    invalidation_after_approval: >-
      Any edit of contract_file after approval is evidence-integrity failure.
    independence: >-
      No gate, stop, launch refusal, admission item, validity rule,
      invalidation rule or outcome depends on the bytes, hash or git status of
      any file under experiments/EXP-AUXIN-7e2e3d/. No run-time procedure opens
      those paths.

  write_scope:
    id: F-WRITE
    paths:
    - experiments/EXP-AUXIN-92dccc/
    implementation_modules: >-
      The run uses new modules under
      experiments/EXP-AUXIN-92dccc/implementation/typed/ and edits no
      implementation file of any other experiment.
    note: >-
      contract_file is placed under experiments/EXP-AUXIN-92dccc/ only by a
      later archived act. This draft lives in the design directory.

  revision_rule:
    id: F-REV
    text: >-
      This contract is never rewritten in place and no amendment layers it. Any
      change, including one a review requires, is a new successor contract under
      a new EXP id that states every rule once. This is the only revision rule.

  n4_bound_comparison:
    id: F-N4
    discharges: DF-G1 (DEC-20260928-c4f3dc defects_to_discharge)
    reads_with:
    - protocol_normative.success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED]
    - protocol_normative.controls entry C-BOUND
    - protocol_normative.stopping_rules bound-evaluator stop
    - protocol_normative.definitions.gate_evaluation_mode
    text: >-
      On each declared C-BOUND state, the N4 condition is met if and only if
      gate 1, gate 2 or gate 3 of C-BOUND fails on either path, matching the
      bound-evaluator stopping rule. Exact equality of a real-valued bound is
      never tested; gate-2 tolerance applies.

  constructed_bound_states:
    id: F-BOUND-CONSTRUCTED
    discharges: DF-G2
    text: >-
      BOUND states outside the declared C-BOUND set occur only in
      reviewer-evaluation mode and are outside the protocol for runs. F-N4
      decides comparisons there; a reviewer error is not a run outcome.

  threshold_index:
    id: F-INDEX
    discharges: DF-G3
    text: >-
      protocol_normative.threshold_index is non-normative. No gate, stop,
      validity rule or outcome reads it. Cut-offs govern from their own clauses.

  execution_preconditions:
    id: F-PRE
    text: >-
      Any future executor card carries, unweakened, DEC-20260927-f680f7
