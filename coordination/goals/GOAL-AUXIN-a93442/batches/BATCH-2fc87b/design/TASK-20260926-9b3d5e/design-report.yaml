  goal_text_questions:
    - id: GTQ-1
      text: >-
        GOAL-AUXIN-a93442 pause condition 3 ("a hit near sqrt(r) on a deployed
        curve" as stop-and-escalate) has two unruled readings of scale
        (DEC-20260923-a4c3d5 limitations): near sqrt(r) in divisor size, or
        near the typed floor. Which does the goal intend?
      how_the_draft_handles_it: >-
        It relies on neither. It defines no escalate trigger, and every run
        package goes to independent validation and red team before any further
        goal work whatever its values (interpretation_limits), which satisfies
        the condition's intent under either reading. The Coordinator should
        rule the reading in a goal-level decision; the draft needs no change
        either way.
    - id: GTQ-2
      text: >-
        GOAL-AUXIN-a93442 completion criterion 4 requires the reproduction to
        pass a planted-divisor positive control and a no-divisor null control
        "at toy scale". Do deployed-size controls (256 and 521 bits) satisfy
        "toy scale", or is a separate toy-scale control required?
      how_the_draft_handles_it: >-
        The draft makes no claim to discharge criterion 4 (non_claims). Ruling
        is the Coordinator's.

  defects_found:
    - id: D-1
      where: DR-2 versus DR-11
      text: >-
        The brainpoolP384r1 C-FIELD case of the refused predecessor cannot be
        kept: its field prime has no closed form, so it can be stated neither by
        literal (DR-11) nor by reference (DR-2, Q0-1). The case was dropped with
        reason; the row keeps the confounder check. A reviewer may prefer a
        different resolution.
    - id: D-2
      where: read_scope_note (DR-11 for BATCH-09aadd)
      text: >-
        "No integer value from them" is ambiguous for non-census integers that
        also occur in those reports (revision number "-14" of the IETF draft,
        section numbers, the 272-bit routing size, the frozen 3600). This draft
        uses such identifiers and protocol constants; it uses no census,
        control or finding value.
    - id: D-3
      where: DR-8 locators
      text: >-
        The EIP-197 and draft-14 locators and their parse rules were written
        without reading either document (outside read scope and no network
        use). Their layout is assumed from reviewer descriptions; a mismatch
        would be found only at Stage P, as an UNPINNED row or an infrastructure
        stop.
    - id: D-4
      where: recalled provenance
      text: >-
        The P-256 field-prime expression, the GMP-ECM curves column, the pypdf
        naming from 3.0.0 and the ECPP/Pratt criteria are recalled (marked in
        the file). Each is either a declared constant or checked at run time
        (CF-2 extraction cross-check; admission self-tests), so no gate rests on
        the recollection being right.
    - id: D-5
      where: DR-9 in-process PARI
      text: >-
        Timeout determinacy relies on PARI alarm() interrupting factor() when
        called through cypari2; the draft makes this an admission self-test
        rather than asserting it.
    - id: D-6
      where: tooling
      text: >-
        Glob and Grep returned no results inside the worktree during this
        session, so every search was done by reading files directly.
        Reviewers should not assume a text search was performed.

