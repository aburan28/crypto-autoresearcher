        - path: amendment.controls[C-FIELD].changed_from_d1d10_with_reason
          quote: "The brainpoolP384r1 case is dropped because its field prime has no closed form and cannot be stated without a literal; that row remains covered by the confounder check"
      reviewer_test: >-
