# Design report for TASK-20260926-9b3d5e (GOAL-AUXIN-a93442, BATCH-2fc87b).
# Producer: fresh Coordinator-role session. Zero runs; nothing computed (DR-16).
# This report states no census value, control integer or reviewer finding value
# (DR-11). All quotations below are from the amendment file named in
# deliverable, by field path; every field path exists in that file.
design_report:
  task_id: TASK-20260926-9b3d5e
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-2fc87b
  recorded_at: '2026-09-26'
  deliverable: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
  amendment_id: AMD-EXP-AUXIN-7e2e3d-20260926-typed
  amendment_status: review_required
  approval_block_names: DEC-20260926-96f970
  new_file_check: >-
    Before writing, a Read of the deliverable path returned "File not found";
    the file was created new. No other file was written except this report.
  runs_performed: 0
  computations_performed: none (every size statement in the amendment is a hand argument from its recipe, stated in the file for reviewers to check)

  route_ruling:
    ruling: amendment
    reason: >-
      Every one of the sixteen entries is an instrument, custody, tool,
      provenance or labelling defect that an additive text can repair without
      changing the measured quantity, the frozen list, the cost definitions or
      the claim ceiling. The governing hypothesis H-AUXIN-6db354 already states
      the typed quantities, the descriptive-only reading, the BOUND rules
      including multiple composite parts, and a falsification condition for a
      declared-state BOUND evaluator control, so the amendment needs no
      statement the hypothesis cannot carry. DR-14's stop does not fire.
    route_risks_for_the_composing_coordinator:
      - >-
        C-PLANT-PL adds a 521-bit construction search. It is inside the
        existing experiment scope (a control, not a new measurement), but a
        reviewer may judge a new control at a new size to exceed "amendment";
        REVIEW-AUXIN-20260926-2fc87b K-route decides.
      - >-
        The two pinned-revision locators (EIP-197 at a resolved commit;
        draft-irtf-cfrg-pairing-friendly-curves-14) were specified without
        reading either document (see attestation). If a reviewer finds the
        named revision or its layout does not match PR-EIP197 / PR-IETF-DRAFT,
        the fix is a new amendment text, not a route change.

  hypothesis_restatement_proposal: none
  hypothesis_restatement_reason: >-
    H-AUXIN-6db354 carries the protocol as written: its statement types both
    branches, its assumptions fix BN254-r to alt_bn128 and the pins to primary
    sources, its predictions are gate outcomes of controls only, and its
    falsification conditions include the BOUND evaluator control. The one
    extension in the amendment not named in H is C-PLANT-PL, which is an
    additional instance of the planted-positive control class H already
    predicts passes; it adds no prediction about a deployed row.

  discharge_table:
    - entry: 1
      defect: D1 parse determinacy (VAL-20260923-c3c90c choices C1, C2, C3, C5, C6)
      clauses:
        - path: amendment.definitions.line_numbering
          quote: "Lines are delimited by LF (U+000A) ONLY. The line number of a character is 1 plus the number of LF characters before it."
        - path: amendment.definitions.whitespace_set
          quote: "the whitespace set is the characters U+0009, U+000A, U+000B, U+000C, U+000D, U+0020, U+0085 and U+00A0. A backslash U+005C inside a value span is a line-continuation mark and is removed"
        - path: amendment.change.D1_pins.parse_rules.PR-SP800
          quote: "A clean decimal form with a different digit count is a printed expression whose operators were lost in the derived text ... recorded as decimal_span_not_a_literal and ignored."
        - path: amendment.change.D1_pins.parse_rules (PR-SEC2, PR-RFC5639, PR-RFC7748, PR-IETF-DRAFT, PR-EIP197)
          quote: "Each following line is a continuation if, after whitespace removal, it consists of hex digits only and has at least 4 characters; the first line that is not a continuation ends the value."
      reviewer_test: >-
        Apply each parse rule by hand, from the rule text alone, to the staged
        .txt blocks named in change.D1_pins.rows (for example sp800-186.txt
        blocks "3.2.1.3." and "3.2.3.1."; sec2-v2.txt secp256k1). Confirm each
        yields exactly one representation and one value with no reader choice:
        in particular that the Ed25519 field-prime decimal span is ignored as
        decimal_span_not_a_literal, that the Ed25519 order uses the clean
        decimal form because "(=" is not followed by "0x", and that the P-256
        field-prime decimal span is CONTAMINATED. Record any block where two
        readers could obtain different spans.
    - entry: 2
      defect: BLS12-381 (and BN254) locator on a time-dependent source; no fallback discipline
      clauses:
        - path: amendment.change.D1_pins.rows[BLS12-381-r].source
          quote: "PINNED REVISION, retrieved at Stage P: the archived Internet-Draft https://www.ietf.org/archive/id/draft-irtf-cfrg-pairing-friendly-curves-14.txt. ... There is NO fallback source and no substitution of any other revision."
        - path: amendment.change.D1_pins.rows[BN254-r].source
          quote: "K is the most recent commit that modified EIPS/eip-197.md with committer date strictly before 2026-09-26T00:00:00Z ... Git history is immutable, so K and its bytes cannot drift."
        - path: amendment.change.D1_pins.retrieval_rule
          quote: "If a pinned revision cannot be retrieved ... that is an INFRASTRUCTURE STOP of the package before any factoring: no other revision, mirror or document is substituted"
      reviewer_test: >-
        Fetch both named revisions (outside any run) and check that PR-IETF-DRAFT
        finds a block titled "(BLS12-381)" with labels p, r, h, t in a form the
        rule reads, and that PR-EIP197's two regular expressions match the
        intended values first in eip-197.md at the resolved commit. THIS
        PRODUCER DID NOT PERFORM EITHER CHECK (attestation.not_verified).
    - entry: 3
      defect: No digit verification of .txt-derived rows against the authoritative PDF
      clauses:
        - path: amendment.change.D1_pins.pdf_digit_check
          quote: "The check PASSES if and only if that string occurs as a contiguous substring of the normalized PDF text. A FAIL makes the row UNPINNED with reason pdf_digit_mismatch"
        - path: amendment.change.D1_pins.staged_source_binding
          quote: "Before any parse, the executor computes the sha256 of each staged file it reads and compares it with the value this file states. A mismatch is an evidence-integrity stop"
      reviewer_test: >-
