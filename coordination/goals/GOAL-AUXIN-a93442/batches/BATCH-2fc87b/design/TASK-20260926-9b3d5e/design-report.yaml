    - entry: 9
      defect: Seconds per cofactor; timeout determinacy with in-process PARI
      clauses:
        - path: amendment.change.D6_factoring.clock
          quote: "The budget clock is the executor process's monotonic wall clock (Python time.monotonic()), read immediately before and after every factoring call on a part"
        - path: amendment.change.D6_factoring.timeouts
          quote: "F2 (in-process PARI): each call is issued as the GP expression alarm(A, factor(n)) with A = floor(R) seconds ... Any overrun ... is charged to the integer, is recorded, and is never refunded."
        - path: amendment.change.D6_factoring.reporting
          quote: "for EACH part, seconds charged in each of F0 to F3"
      reviewer_test: >-
