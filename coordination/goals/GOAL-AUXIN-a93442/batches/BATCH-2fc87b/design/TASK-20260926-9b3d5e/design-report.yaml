      reviewer_test: See q0_closure_table; for each item check the quoted convention removes the choice.
    - entry: 7
      defect: Provisioning of declared tools (K-provision)
      clauses:
        - path: amendment.tools_and_admission.absence_rule
          quote: "Provisioning the declared tools is not part of this text; their absence at execution is an infrastructure stop (REVIEW-AUXIN-20260926-2fc87b K-provision), and any executor card for a run under this amendment carries provisioning as a dispatch precondition."
        - path: amendment.authorization
