# =============================================================================
# Re-scoping ranking for GOAL-AUXIN-a93442, required by DEC-20260926-96f970
# diminishing_returns_guard and next_actions item 1, before any new batch opens.
#
# This is a coordination record, not a decision record, not an amendment and
# not evidence. It mints no id, opens no batch, writes no amendment, edits no
# record, launches no run and sets no scientific_execution_authorized. It is
# uncommitted. The opening Coordinator decision of the next batch cites it and
# fixes the scope; this file does not.
# =============================================================================
rescope_ranking:
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-2fc87b
  experiment_id: EXP-AUXIN-7e2e3d
  hypothesis_id: H-AUXIN-6db354
  refused_amendment: AMD-EXP-AUXIN-7e2e3d-20260926-typed
  required_by: DEC-20260926-96f970 (diminishing_returns_guard; next_actions item 1)
  decision_commit: dc4b00ca56 on coord/ecdlp-portfolio-20260927
  recorded_at: '2026-09-26'
  written_by: coordinator
  status_effect: none. H-AUXIN-6db354 stays proposed. GOAL-AUXIN-a93442 stays active. Zero runs.

  inputs_read:
    - ledger/decisions/DEC-20260926-96f970.yaml (read in full)
    - agents/coordinator.md (read in full)
    - AGENTS.md (read in full via the session's standing rules)
  inputs_not_read: >-
    The refused amendment, its design report, the three review reports and
    the review plan were not opened. Every joint and defect fact below is
    taken from DEC-20260926-96f970 and cited by its DF and RI ids.

  # ---------------------------------------------------------------------------
  # What the ranking has to answer to: the broken joints, and what held.
  # ---------------------------------------------------------------------------
  broken_joints:
    J1:
      - {id: DF-1, kind: execution, text: "BN254-r locator matches nothing on its own pinned eip-197.md revision (backtick before q). If BN254-r ends up unpinned, a null-arm bit class disappears."}
      - {id: DF-2, kind: control design, text: "FP is seeded with the two C-FIELD values, so the confounder control cannot detect an FP missing the extracted primes (mutation M-FP passes)."}
    J5:
      - {id: DF-5, kind: text, text: "One over-scoped pairing-family sentence, imported from H-AUXIN-6db354 interpretation_limits."}
    J6:
      - {id: DF-3, kind: execution, text: "PARI version_command reads cypari2.__version__, which does not exist; admission item 1 cannot run."}
      - {id: DF-4, kind: interface, text: "In-process timeout named as an e_ALARM return; through cypari2 it raises an interrupt exception. Admission item 3 and F2 timeout recognition are undetermined."}
    J4_minor:
      - {id: DF-6, kind: reporting field, text: "bin_at_least undefined for a BOUND value that bins NEAR_FLOOR (K-indeterminate)."}
  held_joints: >-
    J2 (typed costs, BOUND evaluator), J3 (conventions, constructibility,
    calibration) and J4 (blind determinacy, full agreement with J3 on Q1 to Q5)
    hold. The recipe-and-convention layer has now held in two rounds, and the
    D2/D3, D4 and D7/D10 regression groups do not regress.
  pattern: >-
    Three of the five substantive defects (DF-1, DF-3, DF-4) are defects a
    text review only finds by running the text against the live source or the
    real tool build. The other two are local: one control-definition clause
    (DF-2) and one prose sentence (DF-5). DF-5 was introduced by the second
    revision itself, and DF-1 went into the second revision unverified (design
    report D-3). So a wide rewrite adds its own new breaks, and an unexecuted
    pin or gate breaks whatever text contains it.

  scope_note_on_option_3: >-
    As stated in the request, option 3 covers DF-1 to DF-5. Next action item 1
    of DEC-20260926-96f970 binds every scope: it must discharge DF-1 to DF-6
    and address or declare RI-1 to RI-9. In this ranking, option 3 therefore
    means: supersede only the fields named in DF-1 to DF-6, and address or
    declare RI-1 to RI-9 in place. That is RS-C of the decision, with nothing
    added. Its review plan covers only those fields plus the regression set.

  # ---------------------------------------------------------------------------
  # The ranking. Measured against a full third revision as the baseline.
  # ---------------------------------------------------------------------------
  ranking:
    - rank: 1
      option: 3
      decision_alias: RS-C
      label: narrow corrective amendment over the broken fields only
      reason_tied_to_joints: >-
        Every edit lands on a joint that broke. Every byte of J2, J3 and J4,
        which held twice, stays the same, bound by the refused amendment's
        content hash (snapshot sha256 prefix 3c57978c91b6) rather than
        retyped. Retyping held text is how the second revision picked up
        DF-5, so leaving it alone takes that risk away. DF-2 and DF-5 are one
        clause and one sentence. DF-1, DF-3 and DF-4 are fixed by executing
        them: next action item 1 already requires running every pin locator
        against its pinned source and the admission gate against the declared
        tool builds before submission. Those two execution checks are what
        makes a narrow amendment enough here. It takes one review round, and
        J1 and J6 each keep one owner. Unlike option 1, it does not split DF-2
        away from the C-FIELD values (a J3 item) that DF-2 refers to. It also
        does not split DF-1 away from the null-arm bit class that DF-1's
        consequence reaches.
      costs_and_risks: >-
        (a) The approved text would be three layers deep: the v1
        specification, the held parts of a refused amendment incorporated by
        hash, and the corrective fields. Readability is not a broken joint,
        but a reviewer has to be able to name the governing text for each
        field without ambiguity. (b) The pin and tool layer and the census
        text still pass or fail as one approval. If an executed fix to DF-3
        or DF-4 still breaks, the whole amendment is refused again.
    - rank: 2
      option: 1
      decision_alias: RS-A
      label: split the pins and tool-admission layer into its own amendment
      reason_tied_to_joints: >-
        Every break in J1 and J6, and most of the last round's breaks, sit in
        this layer. Reviewing it alone, with executed pins and a provisioned
        admission gate, means a pin or tool defect can no longer refuse a
        census text that has proved determinate. This answers risk (b) of
        option 3 directly.
      why_not_first: >-
        The layer does not split cleanly along the broken joints. DF-2's FP
        definition is a J1 field, but it is defined by reference to the
        C-FIELD values, which are J3 and would stay in the census amendment.
        DF-1's consequence (BN254-r unpinned, so a null-arm bit class
        disappears) reaches the census protocol's null arm. Splitting
        therefore adds a cross-amendment interface that neither round has
        reviewed. It needs two review rounds instead of one, and it adds
        amendment layers rather than removing them. DF-5, the J5 break, gains
        nothing from the split.
    - rank: 3
      option: 2
      decision_alias: RS-B
      label: successor experiment in place of a third amendment
      reason_tied_to_joints: >-
        Its benefit, stating every rule once, answers the readability cost,
        which is not a joint that broke. It re-types J2, J3 and J4, the three
        joints that held, and so reopens all six joints and the regression
        set to review. It aims at none of DF-1 to DF-6 more precisely than
        option 3 does. It ranks above a full third revision only because, for
        the same surface, it produces one readable governing file instead of
        a fourth layer.
    - rank: 4
      option: baseline
      label: full third revision of the amendment
      reason_tied_to_joints: >-
        This is the surface that produced DF-5 and carried DF-1 unverified.
        It re-types held joints without the readability gain of option 2, and
        it is the path the diminishing-returns guard exists to question.

  first_option:
    option: 3
    decision_alias: RS-C
    conditions_carried_into_the_opening_decision:
      - Held text is incorporated by content hash, not retyped, with a field-by-field governing-text table (v1, refused-typed-by-hash, corrective) so no reader has to choose which text applies.
      - Before submission, execute every pin locator against its pinned revision and the PARI version command and timeout path against the declared cypari2/gp builds, and archive the transcripts with the draft. This is where DF-1, DF-3 and DF-4 are discharged, not in prose.
      - DF-2 discharge includes a control that fails when FP omits an extracted field prime (the M-FP mutation must fail under the corrected text).
      - The DF-5 sentence is removed or rescoped in the amendment. The H-AUXIN-6db354 correction stays next action item 2 and is not folded in silently.
      - The review plan is limited to the DF fields, the RI items and the D2/D3, D4 and D7/D10 regression groups. It still carries a prior, keys and a blind re-derivation, is frozen before the draft exists, and puts the red-team verdicts under the key tools/check_review_independence.py reads (PD-C2).

  switch_conditions:
    to_option_1:
      - >-
        The declared tools (GMP-ECM, pypdf, the minimum Python, the cypari2/gp
        build) cannot be provisioned inside the design batch, so the admission
        gate cannot be executed before submission (K-provision). Then the pin
        and tool layer cannot be verified alongside the census text, and it
        should be split out and reviewed once provisioning exists, rather
        than holding up the census fields.
      - >-
        A review of the option-3 amendment breaks J1 or J6 again on an
        executed-layer defect while J2 to J5 hold. That would be the third
        refusal from the same layer, and at that point splitting it off is
        worth its extra interface.
    to_option_2:
      - >-
        The governing-text table cannot be made determinate: a reviewer
        cannot name the governing text for some field without reading all
        three layers, or incorporating a refused amendment by hash is ruled
        not approvable.
      - >-
        RI-1 (mapping H-AUXIN-6db354's falsification conditions to outcomes)
        shows the amendments retire or demote enough conditions that K-route
        should engage, meaning this is no longer the same experiment.
      - >-
        The next action item 2 correction to H-AUXIN-6db354 changes its
        interpretation limits enough that the experiment's stated binding to
        H needs rewriting, not just a pointer.
    to_full_third_revision: >-
      None foreseen. It ranks below every alternative on the joint evidence.
      A new break in J2, J3 or J4 (a K-regression firing) would reopen the
      whole ranking, not select this directly.

  closes_nothing: >-
    This ranking deprioritises no lead. Options 1 and 2 stay live, each with
    the switch conditions stated above. No path is closed.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null (policy default requested)
    served_by: >-
      Cursor "coordinator" custom subagent under Cursor's Auto model router.
      The concrete resolved model identifier is not exposed to this session.
    resolved_model_id: not exposed (unverified)
    model_verified: false
    fallback_used: unknown. Whether Auto served a model meeting the policy cannot be checked from inside the session. Not asserted either way.
    degraded_allowed: false
    amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.

  ids_minted: none
  records_edited: none
  runs_launched: 0
  commits_made: none
  asserts_nothing_about: >-
    Any curve, any census value, whether H-AUXIN-6db354 is true, any deployed
    system, any exponent, or EXP-FROB-30006a.
