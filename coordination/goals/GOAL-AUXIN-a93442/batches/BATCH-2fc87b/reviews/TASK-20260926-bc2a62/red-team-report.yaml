red_team_report:
  id: RT-20260926-40d75b
  id_mint_note: >-
    tools/allocate_id.py has no red-team-report type; token drawn with
    secrets.token_hex(3) and grepped free across the checkout before use.
  task_id: TASK-20260926-bc2a62
  archived_by: TASK-20260926-fee2f3
  goal: GOAL-AUXIN-a93442
  batch: BATCH-2fc87b
  review_plan: REVIEW-AUXIN-20260926-2fc87b
  claim_under_review: >-
    The producer snapshot at commit f4478e5885 (TASK-20260926-b2d068):
    AMD-20260926-typed.yaml (sha256 3c57978c...eeaad6) and design-report.yaml
    (sha256 4d1cdadb...7d7b), both matching the snapshot receipt's path_sha256
    at HEAD 837376db08 with no diff from f4478e5885. Scope of this report:
    joints J2 (typed cost definitions, BOUND evaluator, bins, hypothesis
    binding) and J5 (labelling, over-scoped sentences, S1-S8) ONLY. No
    whole-claim verdict is given.

  inference:
    requested_policy: review-adversarial
    runtime: cursor Task subagent, model inherit
    resolved_model_id: not exposed by the runtime to this session
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      Backend substitution by the runtime (model inherit); handoff
      fallback_allowed permits it. Reasoning was run at the review depth the
      policy requests; no requirement was knowingly degraded.
    degraded_requirements: []

  joint_verdicts:
    J2: holds
    J2_qualifier: holds, with surviving objections O-J2-1 to O-J2-4 (none a break)
    J5: breaks
    J5_qualifier: >-
      breaks on one over-scoped sentence (O-J5-1) carried into the amendment's
      interpretation_limits; the remaining J5 items hold or are low-severity.

  # ---------------------------------------------------------------------------
  J2:
    verdict: holds
    formula_comparison:
      sources_read_by_this_session:
        - citation: Cheon, EUROCRYPT 2006, IACR archive copy (sha256 2e04bcbc...e5e73c5a)
          provenance: retrieved
          read: abstract p.1, Theorem 1 p.4, Theorem 2 p.6 (page images)
        - citation: Cheon, J. Cryptology 2010, author final manuscript StrongDH_JoC_Final2.pdf (sha256 fd7746b9...af70b4de)
          provenance: retrieved
          read: sec. 2.1 Theorem 1 p.6, Theorem 2 p.10, Lemmas 1-2
        - citation: Springer typeset versions of both papers
          provenance: recalled
          read: NOT READ
      draft_vs_source:
        T_minus: >-
          sqrt((r-1)/d) + sqrt(d): matches Theorem 1 leading step count (both
          versions) without the log p / Exp_G factor and O() constant. HOLDS.
        T_plus: >-
          sqrt((r+1)/d) + d: matches Theorem 2 (linear d term, powers i = 1..2d
          in both sources; the 2006 abstract states i = 0..d, and the draft
          correctly cites the theorem, not the abstract). HOLDS.
        input_models: d-power inputs [x^i]P as in each theorem. HOLDS.
        memory_column: max{sqrt(m/d), sqrt(d)} as in both sources. HOLDS (entry 13).
        erh_and_generator_labels: >-
          plus branch labelled ERH-conditional (2010 Theorem 2 assumes ERH for
          a generator of F*_{p^2}); minus branch generator p^{1/4+o(1)} with
          heuristic factoring. HOLDS (entry 12), with O-J2-4.
        floors_and_ceiling: >-
          F_minus, F_plus, C_b closed forms reproduced against brute-force
          minimisation at toy r in {13, 107, 1019} on both paths (A: mpmath 170
          digits; B: Decimal prec 170). HOLDS (computations.json
          j2_i_toy_formula_checks).
    bound_evaluator:
      witness_set: >-
        W = {e * prod(S) : e | F, S subset of parts} implemented literally.
        HOLDS.
      c_bound_states: >-
        Same-shape analogues (seed 2026092663; starts moved by 2^250 so that
        no draft integer is built) of BND-1, BND-2, BND-3 each returned exactly
        the status, witness, bin / bin_at_least and flag the text fixes; the
        single-cofactor contrast returned the witness and UNDETERMINED the text
        states. Hand arguments checked analytically. HOLDS.
      ptm_e: Always BOUND, witness as the text fixes, bound pair brackets the true minimum. HOLDS.
    bins:
      edges: >-
        s exactly 3/4: EXACT gives INTERMEDIATE with flag; BOUND gives
        UNDETERMINED with bin_at_least INTERMEDIATE. Determined. At s exactly
        3/4 + tau the literal clauses of definitions.bins give two answers
        (NEAR_FLOOR and INTERMEDIATE). Numerically unreachable at the declared
        precision, but the text claims bins "never give two answers" (O-J2-2).
      tie_rule: relative 1e-100, smallest tied divisor reported; implemented and exercised. HOLDS.
    coverage_entries:
      '11': Unit statement present verbatim beside rho (see J5). HOLDS for J2's purposes.
      '12': ERH and generator labels match the sources. HOLDS (O-J2-4 low).
      '13': Memory column matches both sources. HOLDS.
      '14': Theorem 2 cited as the source of T_plus, not the 2006 abstract. HOLDS.
      '16': >-
        Hypothesis binding to H-AUXIN-6db354 holds on the measured quantity,
        but the mapping of H's falsification conditions to the draft's outcomes
        is not written and two of them are demoted (O-J2-1). Moderate; not a
        break.
    regression_groups:
      D2: >-
        Provenance correct: the 2010 manuscript and 2006 archive copy were read
        by TASK-20260923-635c5c (RT-20260923-38bbbf); the design session read
        neither paper, and the draft says so. This session re-read both.
        HOLDS.
      D3: >-
        Unfactored-row and r+1-witness-row regressions (seed 2026092666)
        produce the categories the text fixes. HOLDS.
    rc2: >-
      C-PLANT-PL's plus-branch part is about 518 bits, above the 272-bit
      F2/F3 routing size, from analytic bounds on M_L and the windows (integer
      not built, RB-5). declared_properties arguments check; one looseness:
      "t within 2^-18 of s" should be relative to s (O-J2-3).

  # ---------------------------------------------------------------------------
  J5:
    verdict: breaks
    over_scoped_sentences:
      - id: O-J5-1
        file: AMD-20260926-typed.yaml
        field: interpretation_limits (pairing-family item)
        quote: >-
          On the two pairing-family rows (BN254-r, BLS12-381-r) the family
          polynomials force divisors; deep values there are the expected case
          and are reported in their own stratum.
        why_over_scoped: >-
          (a) Frozen-expression residue: under the TYPED costs this amendment
          introduces, the family-forced divisors do not yield a deep value on
          every branch of both rows (computations.json key
          pairing_family_forced_depth, seed 2026092668; values withheld from
          this report per RB-10). The premise was true of the retired
          expression, not of the typed one. (b) It predicts a category on
          deployed rows, contradicting the draft's own "NO value is predicted"
          for deployed rows. (c) It reads a bin as family-caused, contradicting
          "No bin on any row is read as curve-specific" (same field, previous
          item) and D3.semantics. PTM-C shows the deep category arises on
          uniformly random primes, on the plus branch frequently at 256 bits,
          so a deep value on a pairing row is not attributable to the family
          by this pipeline. Not present in the d1d10 regression list; taken
          from H-AUXIN-6db354 interpretation_limits.
        severity: break for J5
        fix: >-
          Delete the causal and predictive clauses. Keep only: "BN254-r and
          BLS12-381-r are reported in their own stratum (expected_structure_flag
          true); no category is predicted for them and none is read as
          family-caused." Composition note: H-AUXIN-6db354 carries the same
          sentence and may need a correction record.
      - id: O-J5-2
        file: design-report.yaml
        field: route_ruling.reason
        quote: >-
          without changing the measured quantity, the frozen list, the cost
          definitions or the claim ceiling
        why_over_scoped: >-
          The amendment's supersedes_fields replaces cost_expression and E_r,
          which are cost definitions. Inaccurate self-description of the
          amendment's reach.
        severity: low-moderate
        fix: Name the superseded cost fields in the reason.
      - id: O-J5-3
        file: design-report.yaml
        field: hypothesis_restatement_reason
        quote: The one extension in the amendment not named in H is C-PLANT-PL
        why_over_scoped: C-FIELD-MUTATION is also not named in H.
        severity: low
        fix: List both.
    unit_statement: >-
      Present verbatim beside rho in change.D9_labelling.unit_statement_beside_rho;
      whitespace-normalised comparison against CORR-20260923-f5f060 equal
      (computations.json unit_statement_verbatim_comparison). No same-unit
      sentence found; "identical accounting" appears only inside quoted
      prohibitions. HOLDS.
    secondary_metric: Minus-branch only and labelled arithmetic. HOLDS.
    s1_to_s8_recheck:
      S1: fixed
      S2: fixed
      S3: fixed
      S4: fixed (withdrawn; RC2 route checked above)
      S5: fixed (narrowed to 256 bits)
      S6: fixed (no "almost any" or "practically unreachable" in either file)
      S7: fixed
      S8: fixed
    tripwires: T1, T2, T3 not fired; no statement matching any of them in either producer file.

  # ---------------------------------------------------------------------------
  proves_too_much_controls:
    PTM-A:
      result: >-
        Rebuilt exactly from the BATCH-ba0b0d PTM-2 construction (candidate
        count equals the printed integer; gp primality proofs pass; outside
        the C-INERT window). Both branches EXACT, NEAR_CEILING (inert side),
        not flagged.
      signature: MET
    PTM-B:
      result: >-
        RFC 5639 brainpoolP384r1 p parsed at LF lines 683-684; confounder
        reasons [field_prime] before any factoring. With clause 1 disabled the
        list is empty (the survival location, covered by C-FIELD-MUTATION); the
        true q gets [].
      signature: MET
    PTM-C:
      result: >-
        16 uniformly random primes each at 256 and 384 bits (seed 2026092662;
        sampler and seed declared in computations.json at 2026-09-27T04:58:00Z,
        sha256 dac69c55...efe5, before any prime was evaluated). Random primes
        receive the same statuses and bins as deployed rows under the literal
        rules, including deep (NEAR_FLOOR) values, at both sizes where
        factoring allows; paths A/B agree and floor invariants hold on every
        branch. The draft's general bin semantics read no category as
        curve-specific.
      signature: >-
        MET for D3 semantics and the null-arm text; VIOLATED by the single
        sentence O-J5-1, which reads the deep category as family-caused.
      note: >-
        First attempt crashed (PARI alarm() returns t_ERROR rather than
        raising); helper fixed and re-run from the same seed. Recorded in
        computations.json.
    PTM-D:
      result: Every T_plus(d) >= sqrt(r) at r = 1019 and at 66- and 131-bit r; the minimiser is <= sqrt(r).
      signature: MET
    PTM-E:
      result: BOUND in every declared state with two or three composite parts (including duplicates); witness as fixed; bounds bracket the true minimum.
      signature: MET

  objections:
    - id: O-J5-1
      joint: J5
      severity: high (breaks J5)
      text: Pairing-family sentence in amd interpretation_limits is a frozen-expression residue, predicts deployed-row categories and reads a bin as family-caused (see J5).
    - id: O-J2-1
      joint: J2
      severity: moderate
      text: >-
        No explicit mapping from H-AUXIN-6db354's falsification conditions to
        the draft's outcomes. H FC2 (field prime used as r) becomes an
        invalid_measurement "never negative", and falsification_criterion
        "not falsified by any deployed-row value" demotes a deployed-row
        admission failure; H FC4 (product mismatch) becomes VOID and then
        S_PARTIAL_TABLE, a success-with-voids outcome. Inherited from
        specification.yaml lines ~308 and ~329.
      fix: Add a table H-FC -> draft outcome, and state which H conditions the amendment retires, with reason.
    - id: O-J2-2
      joint: J2
      severity: low
      text: definitions.bins gives two answers at s = 3/4 + tau exactly; text claims never two answers.
      fix: State clause precedence (lower-depth side wins), consistent with the flag rule.
    - id: O-J2-3
      joint: J2
      severity: low
      text: '"t within 2^-18 of s" in C-PLANT-PL declared_properties should be relative to s.'
    - id: O-J2-4
      joint: J2
      severity: low
      text: >-
        Minus-branch label attributes the whole p^{1/4+o(1)} generator cost to
        factoring; the 2010 source splits it into a deterministic generator
        step given the factorization plus heuristic O(p^{1/4}) factoring.
    - id: O-J5-2
      joint: J5
      severity: low-moderate
      text: design-report route_ruling.reason says cost definitions unchanged; supersedes_fields replaces cost_expression and E_r.
    - id: O-J5-3
      joint: J5
      severity: low
      text: design-report hypothesis_restatement_reason omits C-FIELD-MUTATION as a second extension not named in H.
    - id: X-J3-note
      joint: none owned (pointer for composition only; not a verdict)
      text: No outcome is defined for a deployed row rejected by the confounder check, nor for a VOID null-arm branch.

  required_controls:
    - Delete or rewrite O-J5-1 in the amendment (and correct H-AUXIN-6db354 by a correction record if the Coordinator agrees).
    - Add the H falsification-condition mapping (O-J2-1).
    - Add bin clause precedence (O-J2-2).

  counterexample_or_mutation: >-
    PTM-C random primes receiving the deep category defeat the family-causal
    reading in O-J5-1; forced-divisor depths under typed costs
    (computations.json pairing_family_forced_depth) defeat its premise on at
    least one branch. PTM-B clause-1 mutation shows the field-prime survival
    location, covered by C-FIELD-MUTATION.

  baseline_comparison: >-
    Typed formulas reproduce Cheon 2006/2010 Theorems 1 and 2 leading terms
    (retrieved sources); rho baseline 0.5 is kept in a separate unit with the
    verbatim CORR-20260923-f5f060 statement. No exponent is moved; the draft
    claims none.

  heuristic_challenges:
    - Plus branch rests on ERH (2010 Theorem 2); labelled. Minus branch generator step rests on heuristic factoring; label compresses the source (O-J2-4).

  cost_model_challenges:
    - Typed exponents omit the log p / Exp_G factor and O() constants; disclosed by the unit statement. No further challenge within J2.

  reduction_and_scope_challenges:
    - O-J5-1 extends a category prediction to named deployed rows beyond what the descriptive-bin design supports.
    - O-J2-1 narrows H's falsification scope without saying so.

  proof_architecture_challenges:
    - proof_obligations for BOUND branches are discharged by C-BOUND on declared states only; pipeline-produced BOUND states are disclosed as an assumption in interpretation_limits. Consistent with PTM-E; no further challenge.

  narrowest_supported_statement: >-
    On joints J2 and J5 only: the amendment's typed costs, memory column,
    input models and labels match Cheon 2006 Theorems 1-2 and the 2010
    manuscript as read; its BOUND evaluator and bins behave as the text fixes
    on same-shape analogues and on PTM-A, B, D, E, and on random primes
    (PTM-C); its unit statement is verbatim. One interpretation sentence
    (pairing-family deep values as expected) is not supported by the typed
    definitions and contradicts the draft's descriptive-bin rule.

  next_concrete_action: >-
    Coordinator: compose with J1/J3/J4/J6 owners; if adopted, the producer
    issues an additive amendment removing the O-J5-1 clauses and adding the
    H-FC mapping and bin precedence, then J5 is re-checked on that sentence
    alone.

  artifact_paths:
    - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/reviews/TASK-20260926-bc2a62/red-team-report.yaml
    - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/reviews/TASK-20260926-bc2a62/computations.json

  review_attestation:
