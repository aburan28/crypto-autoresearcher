  # ===========================================================================
  # J6 -- TOOLS, ADMISSION, BUDGET MEASUREMENT AND CUSTODY
  #       (D6, D8; D7 and D10 regression; coverage entries 7 to 10)
  # ===========================================================================
  J6:
    verdict: breaks
    decisive_reason: >-
      The admission gate cannot be executed as written on any cypari2 I could
      test. Its PARI version_command, python3 -I -c "import cypari2;
      print(cypari2.__version__); ...", raises AttributeError, because
      cypari2 has no __version__ attribute. I executed it on 2.2.2 (base) and
      2.2.4 (scratch, latest), and inspected the 2.1.3 and 2.2.0 sources.
      Admission item (1) therefore fails before any tool is admitted.
      Separately, the text's in-process timeout signal does not occur under
      cypari2. The text says "an alarm return (PARI error e_ALARM)", and
      admission item (3) says alarm(1, while(1, )) "returns an alarm error".
      Through cypari2, alarm(A, expr) instead RAISES
      cysignals.signals.AlarmInterrupt, a KeyboardInterrupt subclass that
      "except Exception" does not catch and that GP-side iferr() cannot catch
      either. In gp itself the expression does return t_ERROR e_ALARM. So two
      things turn on an undeclared reading: whether admission (3) passes, and
      how F2 recognises a timeout. A literal implementation aborts the process
      instead. Under K-provision, "a gate that cannot be executed as written
      is a text break". These are tool and text defects, NOT mathematical
      results (VB-8).
    base_environment_presence:
      reported_separately_from_gate: true
      GMP-ECM: ABSENT from the base environment (no ecm on PATH)
      PARI/GP: gp 2.17.3 (Homebrew) and cypari2 2.2.2 present
      pypdf: ABSENT from the base python
      python: base 3.9.10, BELOW the declared minimum 3.10 (sys.stdlib_module_names, which the import rule needs, does not exist before 3.10)
      provisioned_under_scratch_for_K-provision: >-
        GMP-ECM 7.0.6, built from ecm-7.0.6.tar.gz (sha256 7d20ece6...e8a5)
        against GMP 6.3.0. A uv venv with Python 3.12.13, cypari2 2.2.4
        (bundled PARI 2.17.2), cysignals 1.12.6 and pypdf 6.19.0. GMP-ECM 7.0.4,
        the declared minimum, was not tested.
    admission_gate_as_written:
      item_1_versions: >-
        ECM: the banner command returns "GMP-ECM 7.0.6 ..." and parses to
        7.0.6 >= 7.0.4. PASS, and F-J1-2 is fixed. PARI: AttributeError, so
        the gate CANNOT BE EXECUTED AS WRITTEN. pypdf 6.19.0 >= 3.0.0 PASS.
        Python 3.12.13 PASS.
      item_2_ecm_self_test: >-
        PASS. The factor 2147483647 was found on curve 3, in 0.07 s. GMP-ECM
        draws sigma at random, so this self-test is nondeterministic, with a
        negligible failure probability.
      item_3_alarm_self_test: >-
        Raises AlarmInterrupt after 1.01 s instead of returning. PASS or FAIL
        depends on reading; not determined.
      item_4_certificates: >-
        Executable. My path-A stand-in plus my library-free verifier ACCEPT
        2^89-1 and 2^607-1. Note: at cypari2's default stack (8 MB),
        primecert(2^607-1) raises a PARI stack overflow. It succeeds after
        pari.allocatemem(2e9). The text leaves stack size to the implementation.
      item_5_tamper: PASS. With top N replaced by 2^89+1, the certificate is REJECTED.
      items_6_7: Not executable at review time, because implementation/typed/ and trial-plan.json do not exist yet. This is expected and is not a defect.
      item_8_pdf: PASS under pypdf 6.19.0. The normalized sp800-186.pdf text contains "discretelogarithm".
      determines_admission: >-
        NO, because item 1 crashes on the PARI line and item 3 is
        reading-dependent. Everything else in the gate is determinate.
    coverage:
      - entry: 7
        defect: GMP-ECM and PARI/GP provisioning (F-J1-1) under K-provision
        finding: >-
          Text handling holds. absence_rule makes absence an infrastructure
          stop and makes provisioning a dispatch precondition. Base-environment
          absence is recorded above. It is a dispatch precondition for any
          executor card, not a text break. The gate itself fails to execute;
          see entry 8.
      - entry: 8
        defect: version-reporting commands (F-J1-2); ECM curves-per-level column (F-J1-3)
        finding: breaks_on_PARI_version_command; ecm_parts_hold
        detail: >-
          ECM: the version is read from the factoring-call banner, and this
          works on 7.0.6. The curves-per-level column is a list of declared
          constants, B1 2e3:25 through 85e7:210000, with the last level
          repeated. A second reader cannot choose another, so F-J1-3 is
          closed.
          Provenance defect, minor and not load-bearing: the draft says these
          values "follow the GMP-ECM README's expected-curves table as recalled".
          The retrieved GMP-ECM 7.0.6 README Table 1 differs in every row: it
          starts at 11e3 with 74 curves, has no 2e3 row, and gives 77666 or
          69408 curves at 85e7 against the draft's 210000. The recalled
          citation is wrong for that version. Because the column is declared as
          a constant, determinacy is unaffected.
          PARI: see decisive_reason.
      - entry: 9
        defect: seconds per cofactor (F-J1-4); budget and timeout with in-process PARI (F-J1-5)
        finding: seconds_rule_holds; timeout_signal_breaks
        detail: >-
          Seconds: per part and per stage F0-F3, with time.monotonic() read
          around every factoring call, in process or in a subprocess. The
          remaining budget is R = 3600 minus the seconds charged, and certificate
          time is kept apart. This is determinate. For an integer with two
          composite parts of at most 272 bits, F2 processes them in ascending
          size, each call as alarm(floor(R), factor(n)); if floor(R) < 1 the
          part is not called and stays unfactored. So when the timeout fires is
          determinate. How it is recognised is not (AlarmInterrupt; see
          decisive_reason).
          Observation, immaterial within scope: F3 does not fix an order when
          two composite parts exceed 272 bits, and the first part would take
          the repeated last level. Such parts cannot coexist here, because
          every m_b has at most 522 bits and two parts over 272 bits would need
          more than 544. "Ascending size" in F2 is read as numeric value.
      - entry: 10
        defect: unbound imports (F-J1-7); snapshot bytes versus launch commit (F-J1-8)
        finding: holds_with_minor_observations
        detail: >-
          Imports: python3 -I, three allowed classes, and ANY module inside the
          repository but outside typed/ is forbidden. There is an AST audit at
          admission and a sys.modules audit at launch and at every stage
          boundary. Launch comparison: the working-tree bytes and the
          launch-commit bytes of every typed/ file must equal the verified
          implementation snapshot's path_sha256 before Stage A0 completes, and
          any missing, extra or differing file refuses launch. I found no
          route to an unbound import or to launch on differing bytes that
          breaks no written rule.
          Observations, none a break:
          (a) Under -I the script directory is not on sys.path. I tested this
          on 3.12, where a sibling import fails with ModuleNotFoundError. So
          run.py must add typed/ to sys.path itself, which the text allows but
          does not say.
          (b) The audits detect static imports and sys.modules entries, not
          code exec()'d from a repository file or a module object never
          inserted in sys.modules. The written rule ("every module the run
          loads") still forbids that.
          (c) A virtual environment located inside the repository would make
          cypari2 both allowed (class b) and forbidden ("ANY module whose file
          lies inside the repository"). The environment must live outside the
          repository.
