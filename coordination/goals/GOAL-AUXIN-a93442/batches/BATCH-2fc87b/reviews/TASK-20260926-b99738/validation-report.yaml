  # ===========================================================================
  # J1 -- PINS AND THE FIELD-PRIME CONFOUNDER (D1; coverage entries 1 to 4)
  # ===========================================================================
  J1:
    verdict: breaks
    decisive_reason: >-
      The BN254-r locator fails on its own pinned revision. I resolved K by the
      GitHub API call the text gives, which returned 9e393a79d993 (committer
      date 2022-05-06). I retrieved eip-197.md at K: HTTP 200, 8727 bytes,
      sha256 96355ab6...e89d. PR-EIP197 takes r from the first match of
      "prime order q\s*=\s*([0-9]+)". That regular expression matches NOTHING in
      the file, because the markdown puts a backtick between "order " and "q"
      ("cyclic groups of prime order `q = ...`", line 55). A literal executor
      therefore reaches locator_failure, and the row is UNPINNED. A non-literal
      executor tolerates the backtick, which is an undeclared choice. The plan
      lists "a locator that fails on its pinned revision" as a J1 breaking
      artifact. The design report says its producer never checked this locator
      (design-report D-3, not_verified). The p regex does match.
      This is an instrument and text defect. It is NOT a mathematical result
      and says nothing about any curve (VB-8). An UNPINNED row is not a
      negative result (draft locator_failure clause).
    secondary_break: >-
      C-FIELD is still partly self-referential. FP is defined as every
      extracted field prime "together with the two C-FIELD expression values".
      So each C-FIELD case is a member of FP by definition, and clause (1)
      fires on it whatever extraction produced. I ran a reviewer mutation,
      M-FP, in which FP is built from the two C-FIELD values only, with every
      extracted prime dropped. Under M-FP, C-FIELD returns exactly its
      expected reasons: CF-1 gives [field_prime, hasse] and CF-2 gives
      [field_prime]. C-FIELD-MUTATION also returns its expected lists, [hasse]
      and []. Yet brainpoolP384r1's field prime presented as r is then
      ADMITTED with an empty reason list. That is the CORR-20260923-64ee17 C1
      failure. So the declared controls cannot detect an FP that omits the
      extracted primes. The separate extraction_cross_check gate does test
      extraction against the closed forms, and it holds (see entry 4). What
      the controls miss is FP construction, and the reason is that the text
      seeds FP with the values the control tests.
    coverage:
      - entry: 1
        defect: D1 parse determinacy (F-J1-9; choices C1, C2, C3, C5, C6; RT X1)
        finding: holds_for_staged_files
        detail: >-
          I applied PR-SP800, PR-SEC2, PR-RFC5639 and PR-RFC7748 by my own code,
          from the rule text alone, to every named block (computations.json
          section_2). All eight staged-file rows pin, with no reader's choice.
          Each is prime and passes the hasse clause. Each cross-source is equal:
          sec2 n and p for P-224/256/384/521, and the rfc7748 order for
          Ed25519-L. The internal_consistency_only comparisons for P-256 and
          secp256k1 agree.
          C1 is closed by PR-SP800 VALUE (hex first; decimal compared only at
          equal digit count). C2 is closed by definitions.whitespace_set
          (backslash removed). C3 is closed by the CONTAMINATED and
          decimal_span_not_a_literal rules: P-224/256/384/521 p decimal is
          CONTAMINATED and Ed25519 p decimal is decimal_span_not_a_literal, so
          hex is used. Ed25519 n uses the clean decimal form because "(=" is not
          followed by "0x".
          C5 is closed by definitions.line_numbering (LF only). My spans use it,
          and brainpoolP384r1 q is on lines 698-699.
          C6 is closed textually (raw markdown, no HTML conversion), but the
          closing locator fails; see decisive_reason.
          One interpretive point is resolved by the text's own usage. Label
          regexes with "^" and no "$" (^[A-Za-z]{1,4}:) are prefix matches;
          full-match reading would extend the P-256 h span into n's hex. The
          same file uses an explicit "$" where it means a whole line, and it
          uses ^L\s*[:=] as a prefix in PR-IETF-DRAFT, so I count this as
          determined.
      - entry: 2
        defect: BLS12-381-r locator on a time-dependent source
        finding: holds
        detail: >-
          I retrieved draft-irtf-cfrg-pairing-friendly-curves-14.txt from the
          ietf.org archive: HTTP 200, 175678 bytes, sha256 deb806a9...f67a,
          2026-09-27T04:37:23Z. Revision -15 returns 404, so -14 is both the
          pinned revision and the latest. PR-IETF-DRAFT finds block
          "4.2.1. ... (BLS12-381)" (line 887) and reads the labels t (line 904,
          the signed sum of powers of two), p (957-959), r (961-962) and h
          (972) with no choice. The family check holds (r = t^4 - t^2 + 1;
          p = (t - 1)^2 r / 3 + t, with exact division), r is 255 bits and
          prime, and the hasse clause holds. For an unreachable pinned revision
          the text says: infrastructure stop, nothing substituted
          (retrieval_rule). -13 and -11 give locator_failure under the same
          rule. That is irrelevant because they are not named.
          Residual, minor: the text states no expected sha256 for -14's bytes.
          It relies on IETF archive immutability and records the digest at
          retrieval.
      - entry: 3
        defect: PDF digit check of .txt-derived rows
        finding: holds
        detail: >-
          The procedure is determinate: pypdf extract_text joined by "\n", then
          whitespace set and backslashes removed, then lowercased, then a
          contiguous-substring test. Every r, p and h from sp800-186.txt, and
          every sec2-v2.txt value, PASSES against the bound PDFs. I ran it under
          pypdf 6.19.0 and pypdf 3.1.0 (3.0.0 is not published on PyPI). The
          normalized sec2-v2 text differs between the two versions, but every
          verdict is identical. Weakness, not a determinacy defect: the test is
          positional-free, so a short string such as h = "1" passes trivially.
      - entry: 4
        defect: C-FIELD self-reference; clause order; multi-reason recording; mutation check
        finding: partly_discharged
        detail: >-
          Discharged: the clause order (1) field_prime, (2) not_prime, (3) hasse
