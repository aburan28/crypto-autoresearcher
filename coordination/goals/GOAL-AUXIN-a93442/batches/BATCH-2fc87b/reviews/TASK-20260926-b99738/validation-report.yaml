      ii_bls: See coverage entry 2. The locator reaches one integer on the pinned revision, and that revision is the latest.
      iii_pdf: See coverage entry 3. The comparison rule is determinate.
      iv_field_prime_substitutions: >-
        brainpoolP384r1 p presented as r gives [field_prime]. NIST-P-384 p, a
