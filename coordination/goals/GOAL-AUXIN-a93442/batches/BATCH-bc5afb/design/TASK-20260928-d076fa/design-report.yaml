  # ---------------------------------------------------------------------------
  # THE OBSTRUCTION.
  # ---------------------------------------------------------------------------
  obstruction:
    statement: >-
      AMD-EXP-AUXIN-7e2e3d-20260928-gated was written as the LAST layer of a
      four-layer construction. It contains no provision for a later layer. Four
      of its protocol-content fields decide whether any incorporated field
      governs, and how the governing layer of a leaf is determined. A fifth
      layer that incorporates gated by sha256 and leaves these four fields in
      force either governs nothing or gives some leaves two governing rows.
      So before a DF-G1 span can govern falsification condition N4, all four
      must be superseded, at least in part. DF-G1, DF-G2, DF-G3 and O-1 name
      none of them.
    fields:
      - id: OB-1
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
        field: incorporates_by_hash.status_of_the_incorporated_files
        value_sha256: 098b57b8c803f54528c269426d3668b39aae7b2e21a9d05dec6949690a9a2412
        governing_row: gated:incorporates_by_hash.status_of_the_incorporated_files, layer gated
        why_it_obstructs: >-
          This field lets the incorporated narrow and typed fields govern a run
          only through gated and only if gated itself is approved, as gated's
          approval block defines it. That block (envelope) makes approval
          depend on DEC-20260928-c4f3dc approving gated. DEC-20260928-c4f3dc
          decided revise, so the condition can never be met. If a fifth layer
          incorporates gated and leaves this field in force, no typed or narrow
          leaf governs. That includes the N4 condition
          (typed:success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED].condition),
          stopping_rules item 10, the C-BOUND gates and
          success_criterion.decidability, which are the clauses DF-G1 exists to
          make determinate. A DF-G1 span would then attach to a clause that does
          not govern. Approving gated's fields by reference in a later composing
          decision would not help, because this field's own condition would
          still be in force. A decision cannot rewrite a field.
      - id: OB-2
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
        field: precedence
        value_sha256: f4aebb32cf6d84376bbcff245e670bad5e052cbdc725abb6533e12c52cdf48de
        governing_row: gated:precedence, layer gated
        why_it_obstructs: >-
          The field lists the governing layers as a closed set of four (v1,
          typed-by-hash, narrow-by-hash, gated) in a fixed order. Every leaf's
          single governing layer must be named in gated's own
          governing_text_table. A fifth layer is outside that set. Gated's
          addition rule does not open the set either: an addition "supersedes
          nothing" and "no union member overrides another", so an addition that
          adds a fifth layer to the set overrides the member that closes it.
      - id: OB-3
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
        field: governing_text_table
        rows: 992
        layers_named: [v1, typed-by-hash, narrow-by-hash, gated]
        governing_row: gated:governing_text_table, layer gated
        why_it_obstructs: >-
          The table assigns the whole N4 condition leaf to typed-by-hash, and
          it assigns every gated span DF-G2 and DF-G3 would supersede
          (corrective.c_bound_gating.expected_value_source,
          corrective.threshold_index) to gated. A DF-G1, DF-G2 or DF-G3 span
          row in the new layer would be a second governing row for a leaf that
          gated's table already assigns. Precedence (OB-2) requires exactly one
          row. So to leave one row per leaf, the gated rows for those leaves
          must be superseded.
      - id: OB-4
        file: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
        field: reading_of_self_references
        value_sha256: 6fa36d964e408bba5a52fdd744c8aebd7408a7bd3942036e6119b262a5bf2b1f
        governing_row: gated:reading_of_self_references, layer gated
        why_it_obstructs: >-
          This field resolves "this text" and "this protocol", in every layer,
          to the combined governing text read through gated's
          governing_text_table. N4's comparison depends on exactly this kind of
          self-reference: it names the value this text fixes, as quoted in
          gated corrective.c_bound_gating.expected_value_source. While OB-4
          governs, N4's own reference resolves through a table that has no
          fifth-layer row. A DF-G1 span in a fifth layer would then not be
          reached from the clause it is meant to govern, and whether it is
          reached would depend on an unstated reading.
    precedent: >-
      The prior round faced the same structure, one layer down, and resolved it
      by supersession under a NAMED item. Gated's supersedes_fields supersedes
      narrow's precedence, governing_text_table,
      incorporates.reading_of_self_references and incorporates.status_of_that_file
      whole. It also supersedes spans of incorporates.what_is_incorporated
      (span G-WII) and envelope_not_incorporated.rule (span G-ENV). All six are
      filed under erratum ER-1, which DEC-20260927-f680f7 named (as cited in
      gated's supersedes_fields_note; that decision was not opened here). The
      supersedes_fields_note gives the reason: leaving any of them in force
      would make an older clause's outcome change without supersession.
      Narrow's incorporates.status_of_that_file had the same approval tie that
      OB-1 has. Gated's replacement records that narrow's condition "can no
      longer be met". This round's defect list, DEC-20260928-c4f3dc
      defects_to_discharge, names no counterpart of ER-1.
    routes_examined_and_why_each_fails:
      - route: Supersede OB-1 to OB-4 (the gated-round method)
        result: >-
          This is the only coherent construction found. It supersedes held
          gated spans beyond those DF-G1 names, which is the CD-6 first branch,
          and it breaches CD-4 and claim part (5) of the review plan. It was not
          drafted, as the stop rule and the operator instruction both require.
      - route: State the fifth layer and DF-G1 purely as additions (union reading)
        result: >-
          Under gated precedence, an addition may not override another member
          of its union. An addition that adds a fifth layer to OB-2's closed
          set, or that makes OB-1's condition satisfiable by some decision
          other than DEC-20260928-c4f3dc, overrides a union member. Such an
          addition either changes an older clause's outcome without supersession
          (the DF-N1 class, K-layer-outcome (a)) or leaves the outcome dependent
          on a reading the text does not state (the CD-6 second branch, and
          K-layer-outcome (b) under the stricter reading). Rejected.
      - route: Treat gated's incorporates_by_hash block as envelope, so it is excluded from incorporation and not superseded
        result: >-
          Rejected. Gated treated the identical narrow fields as protocol
          content and superseded them under ER-1. It did not list them in
          narrow_envelope_not_incorporated. Reclassifying the same structure as
          envelope now would be a disguised supersession, and review-plan RJ3
          (vi) tests exactly this.
      - route: Let the composing decision approve gated's fields by reference (K-approve wording)
        result: >-
          Does not remove OB-1. Once approved, the field still states its own
          condition, and that condition names gated's approval under
          DEC-20260928-c4f3dc. OB-2 to OB-4 are also unaffected.
    generality: >-
      The obstruction is not specific to how DF-G1 is worded. It applies to
      ANY additive layer placed on top of gated, including one that discharged
      only DF-G2, DF-G3 or O-1. The ranker did not open the amendment text
      (rescope-ranking.yaml inputs_not_read; DEC-20260928-4fcf71 limitations),
      so the ranking could not have seen it. This bears directly on the
      review-plan prior's overturning item (3): the producer stopped because
      DF-G1 cannot be stated without superseding held spans.
    resource_check:
      examined: true
      reading: >-
        What blocks a fifth layer here is gated's closed, self-referential
        construction. That same closure is what REVIEW-AUXIN-20260928-104724
        found total and single-valued (RJ3 held). It is a resource for option 2
        (RS-B): a successor experiment that states every rule once also states
        one precedence rule, one table and one approval condition. It inherits
        none of OB-1 to OB-4. It is not a resource for any further additive
        layer.

