  ranking:
    - rank: 1
      scope_id: S-discharge
      label: one further additive layer discharging DF-G1, DF-G2 and DF-G3 and carrying O-1
      form_fixed_by_this_ranking: >-
        One new additive amendment file, stated against H-AUXIN-6db354, that
        incorporates AMD-EXP-AUXIN-7e2e3d-20260928-gated by sha256 (and through
        it AMD-20260927-narrow and AMD-20260926-typed by their hashes). It adds
        or supersedes only the spans DF-G1, DF-G2 and DF-G3 name, and adds the
        reader-map entry O-1 asks for. DF-G1 must be discharged by normative
        text, because it governs a run-time decision (N4 and the stopping rule
        DEC-20260928-c4f3dc K-approve names); a non-normative declaration
        cannot discharge it. DF-G2 may be discharged either by naming the
        source of the expected fields for a reviewer-constructed BOUND state
        or by an explicit statement that such states are outside the protocol
        except in reviewer-evaluation mode. DF-G3 may be discharged either by
        a counting convention or by declaring the threshold index
        non-normative; under the second route the index is excluded from
        blind comparison in REVIEW-AUXIN-20260928-bc5afb. The producer picks
        the route for DF-G2 and DF-G3 and records why; the plan tests either.
      transclusion_ruling: >-
        Not permitted in this scope. Held text is incorporated by hash and
        cited by span anchor; no held span is retyped, paraphrased or
        transcluded. (The batch's binding_for_every_scope left this to the
        ranking.)
      reason_tied_to_joints: >-
        Every joint held in REVIEW-AUXIN-20260928-104724, so the only open
        items are DF-G1 to DF-G3 and O-1, and each has a named local
        discharge. The case the BATCH-104724 ranking made for option 2 rested
        on the remaining breaks being cross-layer (NJ4, NJ5). That premise no
        longer holds: RJ3 found no outcome changed without supersession and
        the four-layer table outcome-determinate at the governing-text level,
        which is the result the REVIEW-AUXIN-20260928-104724 prior named as
        its first overturning item and said would weaken the case for option
        2. DF-G1 is older than the gated spans and applies equally under the
        narrow and typed texts, so it is a statement the protocol has never
        made; option 2 would have to make the same choice in the same words,
        and gains nothing on it by stating every rule once. The same holds
        for DF-G2 (a missing source statement) and DF-G3 (a missing
        convention). A further layer keeps in force, by hash, the executed pin
        and tool layer that broke twice and has now held for two rounds, the
        scope and mapping layer, the recipe layer the blind joint agreed on
        again, and DF-N1 and DF-N2 as discharged.
      costs_and_risks: >-
        (a) A FIFTH layer of text (v1, typed, narrow, gated, new). Every
        clause in an older layer that reads a field the new layer touches is
        a place for a DF-N1-class break; the obvious candidate is any clause
        that reads N4 once its comparison is stated (the stopping rule
        DEC-20260928-c4f3dc names). (b) Stating DF-G1 may change the tested
        meaning of N4 and so touch the RI-1 N4 row. (c) This is the fourth
        additive round; the diminishing-returns guard exists because narrow
        repairs can surface one new defect per round. (d) The stricter
        K-layer-outcome reading, adopted above, makes this round harder to
        pass than the last.
      conditions_that_answer_the_risks:
        - {id: CD-1, text: "Reader map over all five layers for every span the new layer adds or supersedes: every older clause that reads the field (gate 1, every N condition, every stopping rule, every expected block, every reporting rule) with its outcome under the new text. Includes the O-1 entry for narrow span BN-K."}
        - {id: CD-2, text: "DF-G1 is stated so that exactly one reading of N4's bound comparison is textual on every C-BOUND state and every constructed BOUND state, and the text states whether that changes N4's tested meaning. If it does, the RI-1 N4 row is updated in the same layer."}
        - {id: CD-3, text: "DF-G2 and DF-G3 each take one of the routes named in form_fixed_by_this_ranking, and the design report records which route and why. A DF-G3 non-normative declaration names every clause, if any, that reads the index; if any normative clause reads it, the non-normative route is not available."}
        - {id: CD-4, text: "Supersede or add only spans named by DF-G1, DF-G2, DF-G3 and O-1. Incorporate AMD-20260928-gated by sha256 77d1d5bfd8bf9d1c164903742c501f7161cc1b47814420d1957d6e39da9a8f3f; retype nothing held; edit no existing amendment."}
        - {id: CD-5, text: "Touch no executed-layer field (pins, locators, FP, tool admission, timeout). If the producer finds it must, it re-executes and archives transcripts, and K-executed-layer governs."}
        - {id: CD-6, text: "Producer stop rule. If DF-G1 cannot be stated without superseding held spans beyond those DF-G1 names, or any of DF-G1 to DF-G3 cannot be discharged within five layers without a clause whose outcome then depends on an unstated reading, the producer stops without a draft and reports it. That report selects option 2 at the next selection point without re-ranking S-discharge."}
        - {id: CD-7, text: "Pre-committed end of the additive lineage. ANY revise decision on this round's draft under K-revise-defect, K-indeterminate or K-layer-outcome (stricter reading) ends the additive lineage: the next selection point takes option 2 (RS-B) without re-ranking S-discharge. K-regression reopens the whole ranking instead. K-executed-layer or K-provision in its failing branch sends the next selection point to re-rank option 1 against option 2. K-infra decides nothing."}
    - rank: 2
      scope_id: S-option-2
      decision_alias: RS-B
      label: successor experiment stating every rule once
      movement: Unchanged at rank 2 from the BATCH-104724 ranking.
      reason_tied_to_joints: >-
        It stays the only structural alternative to layering and the
        pre-committed successor under CD-6 and CD-7. The disclosed stricter
        reading points toward it, and a fifth layer is the cost it avoids. It
        is ahead of option 1 because it would address the layering cost
        directly, where option 1 addresses no open item.
      why_not_first: >-
        None of DF-G1 to DF-G3 is a layering defect, so stating every rule
        once aims at them no more precisely than S-discharge does: the same
        three statements must be written either way. It would re-type every
        layer that held in REVIEW-AUXIN-20260928-104724 (RJ1 to RJ4) and the
        executed layer, reopening every joint, the whole regression set and
        the full control-integer re-derivation; a rewrite is how DF-5 entered
        the second revision. It also needs a new EXP id and a restated binding
        to H-AUXIN-6db354, and an additive plan amendment reconciling
        "retypes no held text" (shell producer_eligibility; batch
        binding_for_every_scope) with verbatim transclusion, as
        DEC-20260928-2f8768 option_2_practical_note records. Its own switch
        conditions have not fired under the official composition.
      stays_live_under: >-
        CD-6 (producer stop) or CD-7 (any revise on this round's draft under
        K-revise-defect, K-indeterminate or K-layer-outcome); K-layer or
        K-route-switch in REVIEW-AUXIN-20260928-bc5afb; or the H-AUXIN-6db354
        correction changing the experiment's binding to H.
    - rank: 3
      scope_id: S-option-1
      decision_alias: RS-A
      label: split the pins and tool-admission layer into its own amendment
      movement: Unchanged at rank 3 from the BATCH-104724 ranking.
      reason_tied_to_joints: >-
        Its only benefit is isolating the pin and tool layer so a defect there
        cannot refuse a determinate census text. That layer held for a second
        consecutive round (K-executed-layer not fired, K-provision not
        engaged), and none of DF-G1, DF-G2, DF-G3 or O-1 lies in it, so a
        split discharges nothing open. Its recorded costs stand: an unreviewed
        cross-amendment interface, two review rounds, and more layers of text.
      stays_live_under: >-
        K-executed-layer, or K-provision in its failing branch, firing in
        REVIEW-AUXIN-20260928-bc5afb (possible only if the new layer touches
        the executed layer, CD-5).
