control_plane_correction:
  schema: crypto.autoresearch.control_plane_correction.v1
  id: CORR-20260907-9f5fa9
  goal_id: GOAL-SATIC-c49b77
  batch_id: BATCH-127c82
  recorded_at: '2026-09-07'
  recorded_by: coordinator
  prepared_by_task: TASK-20260907-9ceaba
  archived_by: null
  archived_by_reason: >-
    NO NODE OF BATCH-127c82 CAN ARCHIVE THIS RECORD, and one was not added. The
    lane's every non-archive task was assigned to exactly one archive at
    opening (TASK-20260907-9ceaba -> TASK-20260907-814b9f snapshot;
    TASK-20260907-39511d -> TASK-20260907-e7cc96 snapshot;
    TASK-20260907-6fbd6d and TASK-20260907-c3d2d8 -> TASK-20260907-9b71ea
    ledger), `archive.source_task_ids` may not be empty, and a second archive
    naming an already-assigned source is a validation error. Retrofitting a
    node would additionally fail the dispatcher's own verifier: it requires an
    archive commit to change exactly its declared paths, and these two paths
    are committed by the repair commit named below, so no later commit can
    change them. This is CORR-20260907-5afd89's invariant met a second time,
    in a queue that had already anticipated it once; recorded rather than
    worked around. Durability here rests on the commit and the two digests
    below, which any reader can re-check with `git show <commit>:<path> |
    sha256sum`.
  repair_commit_self_locating: >-
    This record cannot carry the sha of the commit that introduces it. Locate
    it with `git log --oneline --follow --
    coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/corrections/CORR-20260907-9f5fa9.yaml`;
    that commit's message names CORR-20260907-9f5fa9 and
    TASK-20260907-6fbd6d, and it changes exactly the two paths in
    `correct_disposition.digests` and this record. A second backfill commit was
    not spent to embed a sha that git already answers.
  correction_kind: required_review_plan_field_omitted_at_freeze_then_completed_additively
  corrects_only: >-
    ONE OMITTED FIELD in ledger/handoffs/TASK-20260907-6fbd6d.yaml:
    `review_plan.blind_rederivation.assigned_to`, which the handoff schema
    requires whenever `blind_rederivation.required` is true and which the
    record did not carry when TASK-20260907-814b9f archived it. Nothing else in
    that handoff, and nothing at all in the frozen protocol
    coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/contracts/known-bad-control.json,
    in the approval DEC-20260907-ca563a, or in any other record, is corrected.
  scientific_effect: none
  scientific_effect_detail: >-
    ZERO, and doubly so. This lane has produced no measurement, no run, no
    verdict and no evidence record -- it opened a queue. And the control it
    will run asserts nothing about SATIC, summation polynomials or the ECDLP
    even once executed: it measures a verification procedure's sensitivity to a
    planted defect. This correction adds one ownership field to an unexecuted
    task card. It moves no hypothesis status, no goal status, no impediment
    state, and no bound.

  # =====================================================================
  # 1. THE DEFECT
  # =====================================================================
  defect:
    id: BLIND-REDERIVATION-UNOWNED
    superseded_records:
      - record: ledger/handoffs/TASK-20260907-6fbd6d.yaml
        clause: review_plan.blind_rederivation (missing `assigned_to`)
        commit: 40f36578902844ecfe48ca21d7aedbb9eb46230b
    superseded_by_reference_never_edited: false
    superseded_by_reference_note: >-
      DELIBERATELY FALSE HERE, and this is the one place this correction
      departs from CORR-20260907-5afd89's pattern, so the departure is stated
      rather than left to be noticed. That correction superseded a FALSE
      ASSERTION, which is repaired by reference: the wrong sentence stays in
      history and the correction points at it. This defect is an ABSENT
      REQUIRED FIELD in a live, not-yet-dispatched instruction to a worker.
      Superseding it by reference alone would leave the operative task card
      still missing the field and `tools/validate_ledger.py` still reporting
      the error, so the field was completed IN PLACE, additively.
    what_the_clause_asserted: >-
      It asserted -- correctly, and this is unchanged -- that a blind
      re-derivation of three load-bearing quantities is REQUIRED, named those
      quantities, named the four producer artifacts it must stay blind from,
      fixed the method ordering (compute from git, record, only then read
      trials.json), and stated its own bound. What it never said in the field
      the schema reserves for it was WHO PERFORMS IT.
    why_it_is_false: >-
      Not false -- INCOMPLETE, and incomplete in exactly the way the field
      exists to prevent. AGENTS.md's review architecture requires one named
      owner per obligation because an unowned obligation is visible before the
      round instead of after the claim ships. An unowned re-derivation is the
      same defect one level down.
    how_it_was_checked: >-
      `python3 tools/validate_ledger.py` after the opening snapshot archive
      returned 30 errors against an inherited baseline of 29, and the one new
      error named a file this lane wrote.
    verifier_output_verbatim: >-
      ledger/handoffs/TASK-20260907-6fbd6d.yaml:
      review_plan.blind_rederivation.assigned_to is required when required is
      true
    intent_was_never_ambiguous: >-
      Stated so a reader does not have to reconstruct it, and NOT as an excuse:
      the omission is the Coordinator's and the validator is right to refuse
      it. The lane has exactly one reviewer; all four joints and both
      proves-too-much objects in the same review_plan already carry
      `assigned_to: TASK-20260907-6fbd6d`; and `method_required` describes the
      reviewer performing the re-derivation. The completed value is therefore
      the only value the field could have taken, which is why completing it is
      additive rather than a decision made after the fact.
    the_generic_defect: >-
      A required schema field can be omitted from a record that reads as
      complete, because the record's PROSE carried the obligation and the
      author checked the prose. Authoring a review_plan and running
      `validate_ledger.py` BEFORE the snapshot archive rather than after would
      have caught this at zero cost; the archive is what made the repair
      expensive to describe.

  # =====================================================================
  # 2. THE REPAIR
  # =====================================================================
  correct_disposition:
    what_was_done: >-
      `assigned_to: TASK-20260907-6fbd6d` was appended to the
      `review_plan.blind_rederivation` block of
      ledger/handoffs/TASK-20260907-6fbd6d.yaml, preceded by a comment naming
      this correction record. No existing line of that file was altered,
      reordered, weakened or removed.
    why_in_place_and_not_a_new_id: >-
      AGENTS.md rule 15. `TASK-20260907-6fbd6d` and the path
      ledger/handoffs/TASK-20260907-6fbd6d.yaml both appear in the BINDING
      FIELDS of a COMPLETED archive -- TASK-20260907-814b9f's
      `archive.path_sha256` and `archive.record_ids` at commit
      40f36578902844ecfe48ca21d7aedbb9eb46230b. That commit is immutable, so a
      remap would leave its declared set and the live tree permanently
      irreconcilable. The rule names supersession as the alternative to
      renaming; supersession under a NEW id is a rename of the operative
      record by another route, since the queue, T7's `source_task_ids` and
      T6's `depends_on` all name this id. In place, additive, plus this
      record, is the repair the rule leaves available.
    digests:
      archived_bytes_at_40f36578: a331adf8fbe0b0771686918d9d1b1f141c63c35125747312cb3255906326f179
      repaired_bytes: 51f49ac4ac446da1322e0164004c83440f5ac7d5f1c83687b4e58bb41508a38f
      recover_the_archived_bytes_with: >-
        git show 40f36578902844ecfe48ca21d7aedbb9eb46230b:ledger/handoffs/TASK-20260907-6fbd6d.yaml
    the_opening_archive_still_verifies: >-
      TASK-20260907-814b9f's receipt binds the BYTES AT ITS COMMIT, which git
      holds unchanged; the dispatcher reads them with `git show
      <commit>:<path>`, not from the working tree. The gate
      `completed_archive_commits_verified` was re-run after this repair and the
      result is recorded in section 3 rather than assumed here.
    exactly_one_archival_task_requirement: >-
      Unsatisfiable for these two paths and not faked. See `archived_by_reason`
      above. The repaired handoff's ARCHIVED state remains owned by
      TASK-20260907-814b9f, whose receipt correctly describes the bytes it
      committed; what has no dispatcher-verified receipt is the repaired
      revision and this record.
    what_was_deliberately_not_done:
      - >-
        `blind_rederivation.required` was NOT set to false. That would have
        turned the validator green by deleting the obligation, which CLAUDE.md
        names directly: a check you moved to match what you just measured has
        stopped being a check.
      - >-
        The frozen protocol contracts/known-bad-control.json was NOT touched,
        by this repair or otherwise. Its mutation targets, trial set, pass/fail
        predicate, negative arm and stopping rule are exactly as approved in
        DEC-20260907-ca563a.
      - >-
        DEC-20260907-ca563a was NOT edited to mention this. It is a committed
        approval; this record supersedes nothing in it.
      - >-
        TASK-20260907-814b9f's completed archive block was NOT re-backfilled to
        the repaired digest. Doing so would make a committed receipt describe
        bytes its commit does not contain -- a false receipt, in exchange for
        cosmetic tidiness.
      - >-
        The two defects DEC-20260905-6e8621 left for a superseding record --
        the `by_severity` low/informational miscount in the bound report bytes,
        and `research_goal.updated_at` still reading 2026-09-05 -- were NOT
        repaired here. They are not this lane's work and are carried forward
        unchanged in DEC-20260907-ca563a.

  # =====================================================================
  # 3. POST-REPAIR VERIFICATION
  # =====================================================================
  post_repair_verification:
    recorded_after_running: true
    dispatcher_gate_completed_archive_commits_verified: true
    dispatcher_all_gates_true: true
    dispatcher_ready_set:
      - TASK-20260907-39511d
    dispatcher_note: >-
      Re-rendered after the repair with `--claims refs`. All eleven gates true,
      TASK-20260907-814b9f's receipt accepted unchanged. This is the empirical
      confirmation that an in-place repair of an archived path does not
      invalidate its receipt: the verifier compares the receipt against the
      bytes at the bound commit.
    validate_ledger_error_count: 29
    validate_ledger_baseline: 29
    validate_ledger_new_errors_naming_this_lane: 0
    validate_ledger_note: >-
      30 before the repair, 29 after, against the inherited baseline of 29
      under GOAL-ECRANK-002, EXP-ECDLP-bbb42f and EXP-ECRANK-76a70d. Those 29
      are not this lane's and were not touched. Grepping the full output for
      BATCH-127c82, TASK-20260907-*, DEC-20260907-ca563a, CORR-20260907-9f5fa9
      and GOAL-SATIC returns nothing.
    note: >-
      Both fields are filled from actual command output in the same act that
      writes this record; if either is left reading PENDING in a committed
      revision, the check was not run and the record must not be read as
      saying it was.

  binding_for_later_readers: >-
    Read the handoff at its current bytes for the operative instruction, and
    commit 40f36578902844ecfe48ca21d7aedbb9eb46230b for what
    TASK-20260907-814b9f actually archived. The two differ by exactly one added
    field and one comment. The review_plan's recorded prior, joints, blindness
    declaration and proves-too-much objects were all written before any
    reviewer existed and are byte-identical across the two revisions -- this
    repair did not touch them, which is checkable by diffing the archived bytes
    against the current ones.

  asserts_nothing_about: >-
    SATIC, summation polynomials, the ECDLP, the sensitivity of any
    verification procedure, the outcome of BATCH-127c82's control, the state of
    IMP-1 or IMP-3, or either completion criterion of GOAL-SATIC-c49b77. It
    records one omitted ownership field in a task card and its repair.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []
    resolved_model: claude-opus-5 (Cursor cloud agent session)
    model_verified: false
    model_verified_note: >-
      No `python3 -m orchestration.adapter doctor --probe` was run in this
      session, so the resolved identifier is unverified configuration by this
      program's own definition. Recorded as false rather than inherited from
      the probe DEC-20260905-6e8621 read.
    independent_session: false
