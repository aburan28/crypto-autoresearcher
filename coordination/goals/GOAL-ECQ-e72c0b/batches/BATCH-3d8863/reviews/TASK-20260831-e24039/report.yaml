  claim_under_review: 'The REPAIRED successor design PROTO-ECQ-e72c0b-b83032 (protocol-v2, from TASK-20260831-b83032):
    does it close DEC-20260831-fada1e repairs R1-R4 soundly while keeping the independently corroborated two-sided
