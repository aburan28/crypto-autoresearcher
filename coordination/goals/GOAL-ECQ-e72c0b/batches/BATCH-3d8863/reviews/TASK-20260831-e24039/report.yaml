  joint_J1R:
    joint_statement: Does protocol-v2's specified computation now cover the FULL L(S,2) - including the S-unit group
      contribution r1+r2-1 >= 1 and class-group data when h(L) > 1 - with a finite, honestly costed procedure? Does
      the re-derived Stage A cost model follow from that computation (not from a bitvector count)? Is the two-sided
      decision gate stated over the TRUE Selmer group with the S-sufficiency precondition satisfied by construction?
    verdict: CONCUR
    worked_evidence:
    - step: hand_rederivation_of_the_true_object_dimension
      method: Re-derived dim_F2(O_{L,S}^*/(O_{L,S}^*)^2) from the standard S-unit divisor exact sequence, by hand,
        independently of protocol-v2's own restatement. The divisor sequence for a number field L and finite prime
        set S_L is 0 -> O_L^* -> O_{L,S}^* -> Z^{S_L} -> Cl(L) -> Cl_S(L) -> 0 (valuation map on the middle arrow).
        Since Cl(L) is finite, the image of Z^{S_L} in Cl(L) is finite, so the kernel of Z^{S_L} -> Cl(L) has the
        SAME RANK as Z^{S_L}, i.e. rank |S_L|, independent of h(L). Hence rank(O_{L,S}^*) = rank(O_L^*) + |S_L|,
        a fact that holds with NO dependence on the class number's actual value - class-group data enters only when
        one wants EXPLICIT generators of that kernel (family (iii) of protocol-v2's generating_set_specification),
        never the rank/dimension itself.
      result: 'CONFIRMS the document''s central repair claim: the dimension formula dim_F2 L(S,2) = |S_L| + rank(O_L^*)
        + e is correct, and protocol-v2''s own stated distinction ("What DOES depend on class-group data is not
        the DIMENSION but the EXPLICIT GENERATING SET") is the mathematically correct distinction, not a rationalization.
        This directly repairs J1''s original finding (the predecessor''s bitvector object of dimension |S_L| alone
        was a proper subgroup missing the rank(O_L^*) >= 1 unit-group directions).'
    - step: dirichlet_signature_check
      method: For a cubic field L, r1 + 2*r2 = 3 with r1, r2 >= 0 integers. The only solutions are (r1,r2) = (3,0)
        [totally real] and (1,1) [one real embedding, one complex pair]; (r1,r2) = (0, 1.5) is not integral, ruling
        out any signature giving rank(O_L^*) = 0 or negative, exactly as protocol-v2 states.
      result: rank(O_L^*) = r1+r2-1 is exactly 2 (signature (3,0)) or exactly 1 (signature (1,1)) - matches protocol-v2's
        stated values verbatim. CONFIRMED CORRECT.
    - step: torsion_correction_e_hand_check
      method: Checked protocol-v2's parenthetical "e in {0,1} is a torsion correction (from the root of unity -1)"
        by hand. mu_L (roots of unity in L) always contains -1 for any number field L (since -1 is in Q and has
        order exactly 2), so mu_L[2] = {1,-1} has order exactly 2 ALWAYS - never order 1. For a finite abelian group
        A, |A/2A| = |A[2]| (standard finite-abelian-group fact), so dim_F2(mu_L/mu_L^2) = dim_F2(mu_L[2]) = 1 ALWAYS,
        not "0 or 1" as the hedge states.
      result: 'MINOR CORRECTION, NOT A BREAKING ARTIFACT. e should be stated as exactly 1 for every number field
        (not a variable in {0,1}). This does not propagate to any wrong number anywhere in the document: every actual
        arithmetic use of e in protocol-v2 (the |S_L|+2+1=63 bound in propagated_bound/honest_cost_model, and the
        "enlarges by at most 3" claim, which is tight only when rank=2 AND e=1, both at their true maxima) already
        plugs in e=1. The hedge is loosely worded but harmless; flagged for a future precision pass, not disqualifying
        under J1R''s breaking_artifact definition (no dimension miscount, no unspecified-computation-presented-as-
        finite, no closure-table overclaim resulted from it).'
    - step: finiteness_and_honest_cost_disclosure_check
      method: Checked whether protocol-v2 specifies HOW the S-unit/class-group generating set is computed, per the
        attack plan, rather than waving at it. generating_set_specification names three concrete families (fundamental
        units via a cited standard algorithm class; principal-prime generators; non-principal-prime-power generators
        via Cl(L)), and feasibility_finding_stated_plainly gives an order-of-magnitude subexponential-cost argument
        (Buchmann/ Hafner-McCurley-class algorithms, GRH-conditional and unconditional) rather than asserting tractability.
        The finding is explicitly labeled "A DESIGN-TIME ESTIMATE, NOT A MEASURED RESULT" with an explicit statement
        that a bounded probe "could in principle contradict this estimate."
      result: 'Matches the Coordinator''s own recorded prior almost exactly ("I expect the repair to concede the
        honest cost is far beyond the original 2^21 bitvector estimate and likely infeasible... the honest outcome
        is a scoped statement of what remains decidable, NOT approval for execution"). CONFIRMED: this is a genuinely
        finite (terminating, in-principle-computable), honestly-costed procedure, gated behind a declared budget
        (Stage A''.1), not an open-ended or silently-assumed-tractable one. No overclaim found.'
    - step: closure_by_omission_check
      method: 'Checked for the Coordinator''s named failure mode: deleting the enumeration stage, or watering the
        decision rule to a conditional heuristic. Compared decision_rule_integrity against the predecessor''s READING
        (a)/(b) as restated in protocol-v2: both readings are restated as unconditional ("no 32nd point, ever" /
        "no conjecture load-bearing"), and what_changed_is_reachability_not_the_rule explicitly separates repair-induced
        REACHABILITY changes from the RULE itself, which is stated as untouched. Checked closure_table''s R1 row:
        status "closed_at_design_level" carries an explicit residual_open_item (Stage A''.1 feasibility undetermined
        without execution, expected infeasible, never asserted proven infeasible) rather than a bare "closed".'
      result: NOT TRIGGERED. The enumeration stage is restructured (Stage A'.0-A'.3) but not deleted; Stage A'.3's
        honest lower-bound fallback is explicitly barred from licensing READING (a) closure ("CAN NEVER be used
        for READING (a) closure"). The closure_table's own residual_open_item is consistent with, not contradicted
        by, the surrounding prose - it does not claim more than the design states. CONFIRMED CORRECT.
    - step: s_sufficiency_precondition_check
      method: The joint names an "S-sufficiency precondition satisfied by construction." Searched protocol-v2.yaml
        in full (all sections read for this task) for an explicit statement or proof of this precondition under
        that name or an equivalent restatement.
      result: 'OBSERVATION, NOT A DEFECT. No section of protocol-v2 names or explicitly argues "S-sufficiency" as
        such. Its SUBSTANCE is nonetheless satisfied: S := {2} union {primes | Delta(E)} is exactly the standard
        sufficient prime set for 2-descent / Selmer-group computation (2 and all primes of bad reduction), which
        is what repair_r2.corrected_construction produces. The precondition is met by the construction actually
        adopted, but the document never states or cites the standard theorem that makes it sufficient (as opposed
        to merely necessary) - a completeness gap in the writeup, not a mathematical error, and not sufficient on
        its own to break this joint since the construction the joint actually cares about is correct.'
    verdict_rationale: 'CONCUR. The definitional/computational-object error J1 originally found (Stage A testing
      a proper subgroup of the true L(S,2)) is correctly repaired: the true object, its dimension formula, and the
      class-group-independence of that dimension are all independently re-derivable and correct by hand. The re-derived
      cost model correctly separates the (now-corrected) enumeration cost from the previously-omitted generating-set
      cost, discloses the latter''s likely infeasibility as a design-time estimate rather than a measured result,
      and gates Stage A'' honestly rather than silently assuming tractability. The closure table''s "closed_at_design_level"
      status for R1 is not an overclaim: its own residual_open_item correctly scopes what remains open. Two minor,
      non-breaking findings are recorded above (the e in {0,1} hedge should read e = 1 always, with no numeric consequence
      anywhere in the document; the S-sufficiency precondition is met in substance but never named or justified
      as such) for a future precision pass, not as grounds for DISSENT under this joint''s own breaking_artifact
      definition.'
  joint_J4R:
