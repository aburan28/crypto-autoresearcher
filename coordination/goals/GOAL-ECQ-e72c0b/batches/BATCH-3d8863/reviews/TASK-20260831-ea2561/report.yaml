  joint_J2:
    title: STAGE C CERTIFICATE ROUTE - certificate route + halving-induction soundness
    verdict: DISSENT
    verdict_scope: 'Scoped dissent: the certificate route AS DOCUMENTED is not yet sound for every case the document
      itself uses it for. Neither finding below threatens the PRIMARY claim path on curve 302 itself (trivial torsion,
      Stage-0-established) once the identified defects are fixed; both threaten claims the document makes about
      material this joint was assigned to check (the resolvent-cubic prime-set argument, and the nonzero-torsion
      controls'' theoretical backing).'
    finding_1_resolvent_cubic_identity:
      severity: moderate, harmless-in-effect-for-curve-302
      claim_attacked: search_boundary.stage_a_selmer_computation.tracked_object and idea.claim both assert "Delta_E
        = 16*disc(resolvent cubic of the short-Weierstrass form)" and call it "a standard identity", using it to
        argue the resolvent cubic "introduces no new primes of Q beyond bad_primes(Delta_E)" -- the load-bearing
        basis for Stage A's frozen prime set S. Review-plan J2 attack_plan item (1) explicitly assigns checking
        this identity by hand for a curve with a1, a3 nonzero (curve 302 has a1=a2=a3=1), which is what follows.
      hand_derivation: 'Standard facts (Silverman AEC III.1, recalled): for ainvs (a1,a2,a3,a4,a6), b2=a1^2+4a2,
        b4=2a4+a1a3, b6=a3^2+4a6, c4=b2^2-24b4, c6=-b2^3+36b2b4-216b6, and the polynomial identity 1728*Delta =
        c4^3 - c6^2 (always true, independent of the model). There are TWO materially different ways to reach a
        short Weierstrass form y^2=x^3+A*x+B from a general model with a1,a3 != 0, and the document (baseline_reproduction.short_weierstrass_conversion.method)
        itself names both without choosing between them: "A, B exact rationals (or, after clearing denominators,
        integers up to a fixed scaling)". (a) TRANSLATION-ONLY (u=1, A,B left as exact rationals): complete the
        square via y'' = y + (a1*x+a3)/2 (no scaling, only a shift), then the cube via x'' = x + b2/12 (again a
        pure shift). This changes NO coordinate by a scale factor, so it leaves Delta EXACTLY invariant. For this
        h(t)=t^3+A*t+B, disc(h) = -4A^3-27B^2, and since this is the SAME curve just translated, disc(h) = Delta/16
        exactly (equivalently Delta = 16*disc(h)) -- i.e. in THIS reading the document''s identity is exactly correct.
        (b) STANDARD c4,c6-SCALED FORM (the form actually printed in most references and used to get an INTEGRAL
        model): A=-27*c4, B=-54*c6. Then disc(h) = -4A^3-27B^2 = -4*(-27c4)^3 - 27*(-54c6)^2 = 78732*c4^3 - 78732*c6^2
        = 78732*(c4^3-c6^2) = 78732*1728*Delta. Factoring: 78732 = 2^2*3^9, 1728 = 2^6*3^3, so 78732*1728 = 2^8*3^12
        = 136,048,896. So disc(h) = 2^8*3^12*Delta in THIS reading -- Delta = disc(h)/16 is off by a factor of 2^8*3^12,
        NOT the "16*" relation the document states. Conclusion: the identity "Delta_E = 16*disc(resolvent cubic)"
        is exactly true under reading (a) and FALSE by a huge, specific factor under reading (b); the document does
        not commit to which reading it means when it calls this "a standard identity" in search_boundary and idea.claim,
        even though baseline_reproduction''s OWN text correctly flags that "this transformation and its effect on
        Delta by an explicit power of the scaling unit are RE-DERIVED SYMBOLICALLY at Stage 0... not asserted here
        as a specific numeric formula, to avoid a load-bearing recalled constant." search_boundary does exactly
        what baseline_reproduction warns against: it asserts the specific numeric constant (16x) as settled, in
        a load-bearing spot, without the scaling-unit caveat.'
      practical_consequence_for_curve_302: 'Harmless in effect, disclosed rather than hidden: under reading (b)
        (the more standard, integral-model convention), the only "new" primes the 2^8*3^12 factor could contribute
        are 2 and 3, and curve 302''s frozen bad_primes list already contains both ("2","3" are the first two entries).
        So whichever reading Stage 0 actually implements, S = {2} union {primes dividing Delta(E)} remains exhaustive
        for THIS curve -- the prime-set argument''s CONCLUSION survives, but not because the cited identity is correct
        as stated; it survives by a curve-specific coincidence the document does not name.'
      required_change: 'Replace "a standard identity" with the exact identity for whichever conversion convention
        Stage 0 actually adopts (translation-only: Delta=16*disc(h) exactly; scaled/integral: disc(h)=2^8*3^12*Delta),
        and add an explicit Stage-0 sub-check that any primes introduced by the chosen scaling (2 and 3, under the
        scaled convention) are already members of bad_primes(Delta_E) before relying on S''s exhaustiveness -- this
        happens to hold for curve 302 but is not proven to hold in general, and the protocol''s own language ("a
        standard identity") implies a generality it has not demonstrated.'
    finding_2_halving_induction_scope_gap:
      severity: substantive, primary finding
      claim_attacked: certificate_route.matrix_rank_implies_independence_proof, advertised as "SELF-CONTAINED, RE-DERIVED
        HERE RATHER THAN IMPORTED UNCRITICALLY", and used throughout the document (including by controls.nearby_object_control
        and controls.rational_2_torsion_applicability) to justify "matrixRank - torsionRank = n implies Z-independence
        of n points modulo torsion" for ANY curve, torsion-trivial or not.
      hand_derivation_of_the_given_proof: 'Re-derived step by step. Psi: E(Q) -> direct-sum over p in S'' of E(F_p)/2E(F_p)
        is a composite of the reduction homomorphism E(Q)->E(F_p) (a group homomorphism at any prime of good reduction,
        standard fact) and the quotient map to E(F_p)/2E(F_p); since the target has exponent 2, Psi(2P)=0 for all
        P, so Psi factors through E(Q)/2E(Q). Given Sigma(a_i*P_i)=O with a minimal counterexample M=max|a_i|>0:
        applying Psi gives Sigma(a_i mod 2)*row_i = 0 in the F2 target. If some a_i is odd, this is a NONTRIVIAL
        F2 relation among the rows (the vector (a_i mod 2) is nonzero), contradicting the rows being linearly independent
        (matrixRank=n, full rank). So every a_i is even, a_i=2*b_i; Sigma(b_i*P_i) is directly computable via the
        rational group law (no existence question), and 2*Sigma(b_i*P_i)=Sigma(a_i*P_i)=O, so Sigma(b_i*P_i) is
        in E(Q)[2]. THIS IS WHERE THE PROOF USES TRIVIAL TORSION: it concludes Sigma(b_i*P_i)=O because E(Q)_tors={O}
        (Stage 0), giving a strictly smaller relation with the SAME points, contradicting minimality of M. I find
        NO flaw in this chain for the case it is actually stated for (E(Q)_tors={O}): the odd/even split, the homomorphism
        property, and the descent termination (well-founded on max|a_i| in Z) are all correct and standard. This
        is the part the coordinator''s prior expected to break (a "parity gap"); it does not break here.'
      the_actual_gap: 'The proof''s opening line is explicit: "Suppose Sigma(a_i*Pi) = O (TORSION IS TRIVIAL, SO
        ANY RELATION REDUCES TO THE IDENTITY)" -- this hypothesis is BAKED INTO the setup, not a side remark. For
        a curve with nontrivial torsion (as controls.nearby_object_control and controls.rational_2_torsion_applicability
        explicitly require: "a curve WITH nontrivial rational torsion... plus the torsion generator"), a Z-relation
        among points need not reduce to O; it reduces to Sigma(a_i*P_i) = T for T ranging over E(Q)_tors, and the
        step "Sigma(b_i*P_i) is in E(Q)[2], hence O" fails outright -- it is only in E(Q)[2], which for a torsion-bearing
        curve is NOT trivial, so the descent does not automatically terminate at the zero relation; the argument
        would need to be re-run in the quotient E(Q)/E(Q)_tors (or equivalently track torsion-generator rows through
        the SAME mod-2 argument) to reach the general "matrixRank - torsionRank = n" conclusion, and the document
        supplies NONE of that extension. It supplies torsion_rows (adding rows for a torsion generator) and asserts
        torsion_row_rank is "computed as the F2-rank of the torsion-generated subspace", but nowhere re-derives
        why subtracting that rank from matrixRank is exactly the right correction -- it is stated as a definition/recipe,
        not proved from the given induction, which explicitly excludes this case in its own first sentence.'
      why_this_matters: 'This is precisely the review-plan''s requested breaking_artifact: "a specific unstated
        precondition of the halving induction." The precondition is: E(Q)_tors = {O}. The document calls the proof
        "self-contained" while using its conclusion (matrixRank - torsionRank = n, in general) for curves the proof''s
        own hypothesis excludes. This does NOT threaten curve 302''s own Stage-C certificate (trivial torsion, in
        scope of the proof as literally written), but it DOES mean two of the document''s own required controls
        (nearby_object_control, rational_2_torsion_applicability) rest on an unproven generalization of the very
        theorem those controls exist to stress-test -- see joint J3 and proves_too_much object 2 below.'
      required_change: Either (a) supply the general proof (working in E(Q)/E(Q)_tors, or extending the mod-2 argument
        to explicitly carry torsion-generator rows through the same minimal-counterexample logic), or (b) restrict
        the document's claimed theorem to torsion-trivial curves only and state PLAINLY that the nonzero-torsion
        controls' "expected_outcome" is a design-time PREDICTION pending that separate proof, not a corollary of
        the proof actually given.
    finding_3_reduction_map_precondition:
      severity: minor, non-fatal
      claim_attacked: certificate_route.reduction_map / good_primes_and_preconditions
      hand_derivation: 'For a prime p of good reduction, the reduction map E(Q)->E(F_p) is classically defined on
        ALL of E(Q) via projective coordinates: a point whose affine x-coordinate has p in its denominator reduces
        (correctly, as a group homomorphism) to O in E(F_p), not to an "undefined" value. The document instead treats
        such (point, prime) pairs as failures of a stated precondition ("requiring p not divide either coordinate''s
        denominator... which (point, prime) pairs were skipped... extending S'' with an additional prime"), which
        is an operationally different (and unnecessarily lossy) convention: the mathematically correct row entry
        there is simply the zero vector for that prime''s block, not a skip.'
      practical_consequence: 'Not fatal: since each of the finitely many points has only finitely many denominator
        primes, and the good-prime candidates are unbounded, S'' can always be extended to route around every collision,
        so the WORKAROUND achieves the same practical effect as the correct convention for a fixed, finite point
        set. But the document should say this (a completeness argument: only finitely many exclusions per point,
        infinitely many candidate primes, so extension always succeeds) rather than leaving "how that was handled"
        as an ad hoc, unproven per-run decision.'
      required_change: State either the correct reduce-to-O convention (preferred, avoids the workaround entirely)
        or the finite-exclusion completeness argument for why extending S' is always sufficient.
  joint_J3:
    title: CONTROLS ADEQUACY
    verdict: DISSENT
    sibling_question_method: 'Per the attack plan: for each control, "would this control PASS even if the property
      it claims to isolate were violated?" Applied to all five controls below.'
    finding_1_no_ascent_control_exists:
      severity: substantive, primary finding
      analysis: 'Enumerate the five controls'' predicted outcomes: null_control (rank STAYS at 31), P32=P1+P2 (rank
        STAYS at 31), P32=2*P1 (rank STAYS at 31), positive_control (rank equals a SEPARATE, unrelated curve''s
        own known rank -- not a test of curve 302''s own pipeline instance detecting a NEW point), nearby_object_control
        (rank equals a SEPARATE curve''s small declared count, again not curve 302''s pipeline). Every one of these
        is a "stays the same or matches a DIFFERENT curve''s already-known value" test. NONE of them is a test of
        the one behavior Stage C must actually exhibit if Stage B ever succeeds: given curve 302''s own 31-point
        basis PLUS a KNOWN, independently verified Z-INDEPENDENT 32nd point (at a comparable coordinate/height scale),
        does the pipeline correctly ASCEND matrixRank to 32? Sibling-question test applied to null_control specifically:
        null_control would PASS (rank stays 31) under the CORRECT implementation, but it would ALSO pass under a
        completely broken implementation that is simply incapable of ever reporting rank > 31 for ANY 32nd point
        -- e.g. because the good-prime list S'' selection procedure or the F2 character-basis dimension is systematically
        insufficient at curve 302''s actual coordinate scale (naive height up to ~468, per the frozen JSON, and
        the document''s own interpretation_limits already flag this scale as a source of low power for Stage B;
        the identical scale risk applies to Stage C''s reduction map, which is never stress-tested at this scale
        by any control). The null control''s PASS signature is therefore INDISTINGUISHABLE between "correctly detects
        the duplicate row" and "cannot detect independence at all, at any input." This exact argument extends to
        BOTH proves_too_much controls (they too only test "stays at 31") and to positive_control / nearby_object_control
        (they test ascent, but on curves and point sets that are NOT curve 302 and are not disclosed to be at a
        comparable coordinate/height scale, so a pass there does not certify that the SAME pipeline instance, configured
        for curve 302''s actual denominators and prime list, can ascend).'
      missing_sibling_control: 'A control using a KNOWN, independently documented, GENUINELY Z-independent point
        ADDED to an already-certified basis, at a comparable scale to the target case, expecting matrixRank - torsionRank
        to correctly ASCEND to the new higher value. Concretely: extend positive_control''s own rank-r curve with
        one more independently verified generator to rank r+1 (a small, well-known curve where an (r+1)-th generator
        is independently documented, e.g. an LMFDB curve one rank higher than whatever positive_control settles
        on), and require the pipeline to report exactly r+1, not r. Without this, the coordinator''s own stated
        worry ("the null control... [is] weak evidence of independence sensitivity") is CONFIRMED and shown to extend
        to the entire control suite, not just the null control.'
      breaking_artifact_named: A degenerate certificate-route implementation that always reports matrixRank = (number
        of points in the frozen 31-point baseline) and NEVER increases regardless of what is appended -- e.g. a
        bug that caps the F2 matrix's column dimension at whatever was needed for the 31-point Stage-0 reproduction
        and silently truncates or ignores rows beyond that -- would PASS Stage 0's own rank31_baseline_certificate
        (31 points -> rank 31, correct), PASS null_control (32nd row duplicate or not, rank stays "31" either way),
        PASS both proves_too_much controls (same reason), and PASS positive_control / nearby_object_control if those
        are run on entirely separate smaller problem instances not sharing this bug's trigger condition. It would
        then FAIL SILENTLY -- reporting "not independent" -- on a genuine Stage-B witness, which is exactly the
        single most consequential wrong answer this protocol can produce (a false negative on a real discovery),
        and no control in the current suite would have caught it before that point.
    finding_2_deferred_concrete_curves_compound_finding_1:
      severity: minor, disclosed
      analysis: 'positive_control and nearby_object_control both explicitly defer their exact curve and generators
        to a future Stage-0 sub-task ("not asserted here"). This is disclosed, not hidden, so it is not treated
        as an independent adequacy failure. But it compounds finding 1: because no concrete curve is named yet,
        no one has checked whether either control''s points will be anywhere near curve 302''s own coordinate/height
        scale (~468 in natural-log units) -- so even once instantiated, these controls may continue to exercise
        a much easier regime than the one Stage C must actually perform in, leaving the ascent gap in finding 1
        unaddressed by controls as currently specified.'
    finding_3_null_control_arithmetic_is_correctly_forced:
      severity: none (confirms design, not a defect)
      hand_derivation: 'Independently re-verified: phi maps into an F2-vector space, so every nonzero element equals
        its own inverse (order divides 2); therefore Psi(-P) = -Psi(P) = Psi(P) identically, with no dependence
        on P or the specific reduction primes chosen. Row 32 (for Q=-P1) is therefore LITERALLY the same vector
        as row 1, not merely "expected" to be -- this holds by the group-theoretic structure of the target alone
        and needs no computation to verify for this specific curve. This part of the design is correctly and exactly
        reasoned; my dissent above is about what the control''s outcome can and cannot distinguish, not about whether
        the stated arithmetic is right.'
  proves_too_much_analysis:
    object_1_null_certificate:
      description: 31 frozen points plus Q=-P1; true independence count 31.
      verdict: CONCUR
      analysis: 'Identical object to the protocol''s own null_control (see J3 finding 3). The predicted failure
        signature (route must report 31, not 32) is FORCED by the group-homomorphism structure of Psi into an F2-vector
        space (Psi(-P)=Psi(P) always), independent of any implementation detail beyond correctness of the reduction
        map itself. If implemented as specified, this object cannot slip through: I find no configuration under
        which the design, correctly implemented, would report 32 here. This is the one place in the whole certificate
        route where the design-level guarantee is airtight rather than merely plausible.'
    object_2_full_2_torsion_curve:
      description: Rank-0 curve with full rational 2-torsion, e.g. y^2 = x^3 - x (true torsion 2-rank 2, true independent-point
        count 0); a route reporting torsionRank=0 or a rank of 3 from three "independent" rows overcounts.
      verdict: DISSENT
      hand_derivation: 'E: y^2=x^3-x has rational 2-torsion points (0,0), (1,0), (-1,0) with (-1,0)=(0,0)+(1,0);
        E(Q)_tors is the Klein four-group (Z/2)^2, generated by (0,0) and (1,0) (standard, recalled fact -- this
        is a well-known CM curve, conductor 32). Reduction mod an odd prime p of good reduction is injective on
        prime-to-p torsion (Silverman AEC VII.3.1, recalled), so for p odd and good, (0,0) and (1,0) reduce to two
        DISTINCT nonzero 2-torsion points of E(F_p). A naive implementation that computes matrixRank of the two-row
        matrix from these torsion generators WITHOUT subtracting torsionRank would, for any p where these two reduced
        points'' images in E(F_p)/2E(F_p) are F2-linearly independent (generic behavior, though not asserted here
        as guaranteed for every specific small p), report matrixRank=2 and (with torsionRank naively left at 0)
        overclaim rank 2 where the true rank is 0 -- exactly the review-plan''s own named failure signature. The
        protocol''s nearby_object_control / rational_2_torsion_applicability is well-aimed at this exact failure
        mode IN PRINCIPLE. However, per J2 finding 2, the document''s OWN proof of "matrixRank - torsionRank = n
        implies independence" is derived ONLY for E(Q)_tors={O}; it does not establish, and no other part of the
        document establishes, that subtracting torsionRank is the mathematically CORRECT correction for a curve
        with nontrivial torsion (as opposed to a plausible recipe). So the design-level guarantee that the route
        "must FAIL (report the true, smaller number) on this object" is not yet PROVEN by anything in this document
        -- it is asserted by definition/recipe (controls.nearby_object_control.expected_outcome) without the supporting
        theorem. I dissent on the CLAIM that this object''s correct rejection is design-guaranteed; I concur that
        the control is aimed at the right failure mode and would likely surface the naive bug in practice, which
        is a weaker claim than the document makes.'
      required_change: 'Same as J2 finding 2''s required change: prove the general (nonzero-torsion) form of matrix_rank_implies_independence_proof,
        or explicitly downgrade controls.nearby_object_control''s expected_outcome from a proven guarantee to a
        design-time prediction pending that proof.'
  summary_for_coordinator:
    J2: 'DISSENT (scoped) -- two defects found by hand: an imprecisely-cited resolvent-cubic identity (harmless
      in effect for curve 302, but stated more generally than justified) and a halving-induction proof that is explicitly
      scoped to trivial torsion yet is relied on for two nonzero-torsion controls. Neither defect threatens curve
      302''s own primary certificate path once corrected; both must be fixed before the controls or the general
      prime-set argument can be trusted as written.'
    J3: DISSENT -- all five controls test "stays the same / matches a different instance", none tests "correctly
      ascends on curve 302's own pipeline at curve 302's own scale"; a permanently-stuck-at-31 implementation would
