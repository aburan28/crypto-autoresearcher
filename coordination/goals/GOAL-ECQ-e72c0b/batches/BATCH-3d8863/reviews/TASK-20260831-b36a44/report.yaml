  joint_J2R:
    title: THE CERTIFICATE ROUTE RESTATEMENT
    verdict: DISSENT
    verdict_scope: 'Scoped dissent, narrower than round 1''s J2 DISSENT. Two of three sub-repairs are correctly
      closed (resolvent-cubic identity, reduction-map precondition). The halving-induction scope-restatement sub-repair
      is INCOMPLETE: protocol-v2''s own supersession_map names a third location using the theorem''s unscoped conclusion
      (proof_search_map.method_ceiling.nearby_object_control) as one this repair closes, but the repair''s operative
      text never touches that location, which still stands, verbatim, with the original unscoped overclaim.'
    subfinding_1_resolvent_cubic_identity_CONCUR: 'protocol-v2.repair_r3_certificate_route_soundness.resolvent_cubic_identity
      commits explicitly to the translation-only short-Weierstrass conversion (y''=y+(a1x+a3)/2, x''''=x''+b2/12
      -- pure shifts, no scaling) and derives, rather than asserts as "a standard identity", Delta_E = 16*disc(h)
      exactly for this convention. Re-derived independently by hand: a pure coordinate translation changes no scale
      factor, so Delta(E) is invariant under it (Delta is a weight-12 form of the coefficients under the full transformation
      group, but translations carry weight-0 scaling u=1, so Delta is exactly preserved); for h(t)=t^3+A*t+B, disc(h)
      = -4A^3-27B^2 is the standard cubic discriminant, and the curve identity Delta = -16*(4A^3+27B^2) for a curve
      already in short Weierstrass form (Silverman AEC III.1, recalled) gives Delta = 16*disc(h) directly. This
      derivation is GENERAL in a1,...,a6 (the shift formulas use a1, a2, a3 symbolically, not assuming any vanish),
      correctly closing this sub-finding for curve 302''s own a1=a2=a3=1 case. CONCUR: this sub-repair is sound
      and matches the round-1 red-team hand derivation''s reading (a) exactly (TASK-20260831-ea2561, joint_J2, finding_1.hand_derivation),
      now stated as the document''s committed convention rather than an ambiguous "standard identity."'
    subfinding_2_reduction_map_precondition_CONCUR: 'protocol-v2.repair_r3_certificate_route_soundness.reduction_map_precondition
      adopts the projective-reduction convention red-team''s finding_3 preferred: clear a point''s projective triple
      (X:Y:Z) to have gcd coprime to p, reduce mod p, and treat a vanishing reduced Z as image O -- a well-defined
      group-homomorphism value for every point at every good prime, with no skipped pairs and no ad hoc "extend
      S''" workaround. Checked by hand: this is always possible (any rational point has an integral coprime-triple
      representative simultaneously valid at every prime, since one representative works for all p at once), so
      "defined on ALL of E(Q) with no exceptions" is correctly stated, not merely asserted. CONCUR: this closes
      J2 finding_3 in full, as protocol-v2.repair_r3...reduction_map_precondition.closes claims.'
    subfinding_3_halving_induction_scope_INCOMPLETE_DISSENT: 'protocol-v2.repair_r3_certificate_route_soundness.halving_induction_scope
      states: "The theorem ... IS PROVEN ... ONLY FOR E(Q)_tors = {O}. This scope restriction is now stated as the
      theorem''s ACTUAL hypothesis EVERYWHERE IT IS CITED, not merely in the proof''s opening line" -- a document-wide,
      blanket claim. Its own operative downgraded_controls field, however, names only two locations as actually
      downgraded: "controls.nearby_object_control and controls.rational_2_torsion_applicability ... have their expected_outcome
      DOWNGRADED from a proven guarantee to a DESIGN-TIME PREDICTION." Compare against protocol-v2''s OWN supersession_map
      (the entry closing "J2 finding_2 (DEC-20260831-fada1e R3)"), which lists a THIRD location as superseded by
      this exact repair section: "proof_search_map.method_ceiling.nearby_object_control", alongside the two controls
      fields. That third location''s text (predecessor protocol.yaml, lines 531-542, verified directly this session)
      reads: "A curve WITH nontrivial rational 2-torsion ... If the pipeline naively computed matrixRank alone (without
      correctly identifying and subtracting torsionRank), it would OVERCLAIM independence ... the desired conclusion
      (matrixRank - torsionRank = declared point count) would be FALSE under the naive (uncorrected) computation"
      -- phrasing that, by contraposition, asserts the CORRECTED computation''s conclusion (matrixRank - torsionRank
      = declared point count) IS true, i.e. exactly the unscoped, design-guaranteed nonzero-torsion claim J2 finding_2
      attacked, worded independently of and in addition to the two control fields. protocol-v2''s repair_r3.halving_induction_scope
      text never quotes, restates, or downgrades this location. Since protocol-v2 is a supersede-by-reference document
      (its own supersession_map.method: "omission is not itself a repair"), and this location IS named in superseded_sections
      (not omitted), a future reader is directed to "apply repair_r3.halving_induction_scope" to it -- but that
      section''s actual content gives no instruction for THIS specific location beyond the blanket "everywhere it
      is cited" assertion, which is therefore FALSIFIED by the document''s own bookkeeping: at least one location
      the document itself flags as needing the restatement does not have it. breaking_artifact matched: "A use of
      the route outside its now-stated scope" -- proof_search_map.method_ceiling.nearby_object_control is exactly
      such a use, left standing unscoped after the repair. DISSENT on this sub-finding: the halving-induction scope
      restriction is not yet restated everywhere protocol-v2 (by its own supersession_map''s admission) says it
      needs to be.'
    minor_residual_not_dissented: controls.positive_control (inherited unchanged) still defers its reference curve's
      identity and generators to a future Stage-0 sub-task and its expected_outcome phrasing ("matrixRank - torsionRank
      equals the curve's known ... rank exactly") does not commit to that reference curve having trivial torsion.
      If a nontrivial-torsion curve is later chosen there, this control would ALSO silently rely on the unscoped
      general theorem. This is not raised as a dissent point because (a) it is unchanged from the predecessor and
      was not part of J2's original three findings or protocol-v2's supersession_map, so it is not a NEW overstatement
      introduced by v2, and (b) the curve is explicitly undetermined, so no concrete overclaim exists yet to attack.
      Flagged for a future Stage-0 gate to fix by construction (choose a trivial-torsion reference curve), not as
      a break in this round.
  joint_J3R:
    title: CONTROLS, INCLUDING THE NEW POSITIVE-DETECTION CONTROL
    verdict: DISSENT
    verdict_scope: 'The new control (repair_r4_leave_one_out_ascent_battery) is only HALF sound. Its positive ascent
      half correctly closes the J3 ascent-detection gap. Its named "sibling null" half is mathematically incorrect
      as specified: a CORRECT implementation of the certificate pipeline necessarily ASCENDS on it too, identically
      to the positive half, so it cannot discriminate the failure modes repair_r4 claims it brackets.'
    positive_half_CONCUR: 'For each i, B_i = the 30 known points excluding Pi, required matrixRank-torsionRank=30
      (a direct corollary of the Stage-0 rank-31 certificate: a linearly independent 31-row set has every 30-row
      subset also independent -- checked, correct, standard linear algebra, no new proof needed). Then B_i union
      {Pi}, required ascent to 31 (this IS the full 31-point set, whose rank is already Stage-0-established). This
      construction genuinely requires the pipeline to detect Pi''s independence relative to the smaller basis B_i,
      at curve 302''s own coordinate/height scale, using curve 302''s own data -- satisfying review-plan-v2''s stated
      bar ("whose success REQUIRES certifying a known new point") and closing J3 finding_2''s scale-deferral compound
      concern (this is not a smaller, deferred reference curve; it is curve 302 itself). CONCUR on this half.'
    sibling_null_half_DISSENT_worked_attack: 'repair_r4.sibling_null specifies "Q_i := -Pi (or, equivalently, any
      fixed Z-linear combination of B_i''s own 30 points)", added to B_i, "REQUIRED outcome ... STAYS at 30 (no
      ascent), by the SAME group-homomorphism argument the predecessor''s null_control ... already established (phi(-P)
      = phi(P) in an F2-target, so Q_i''s row duplicates an existing row or is a linear combination of existing
      rows, exactly as in the original 31-point case)." Hand-derivation of why this is WRONG: Psi(-Pi) = Psi(Pi)
      IDENTICALLY -- this is not in dispute; it is the same proven, unconditional F2-vector-space fact the round-1
      red-team report independently re-verified for the original null_control (TASK-20260831-ea2561, joint_J3, finding_3:
      "every nonzero element equals its own inverse ... Psi(-P)=Psi(P) identically, with no dependence on P or the
      specific reduction primes chosen"). The ORIGINAL null_control adds Q=-P1 to the FULL 31-point basis, which
      ALREADY CONTAINS P1 -- there, Psi(Q)=Psi(P1) is trivially a duplicate of an EXISTING row (row 1 is present),
      so the augmented matrix''s rank correctly stays at 31. But repair_r4''s leave-one-out sibling null adds Q_i=-Pi
      to B_i, which EXCLUDES Pi by construction. Psi(Q_i)=Psi(Pi) is therefore the row for the point THAT WAS REMOVED,
      not a row already present in B_i. Since the full 31-point matrix has rank exactly 31 (Stage-0 baseline, an
      uncontested premise this very repair invokes one paragraph earlier for the positive half), all 31 rows are
      F2-linearly independent as a set -- which means Psi(Pi) is NOT in the span of {Psi(Pj) : j != i}, i.e. NOT
      a linear combination of B_i''s 30 rows (if it were, the full 31-row set would have rank <= 30, contradicting
      the Stage-0 certificate). Appending a row equal to Psi(Pi) to the rank-30 matrix B_i therefore NECESSARILY
      raises the rank to 31 -- an ASCENT, identical in outcome to the positive half, not "stays at 30." The document''s
      own parenthetical, "Q_i := -Pi (or, equivalently, any fixed Z-linear combination of B_i''s own 30 points)",
      is itself the tell: -Pi is presented as interchangeable with "a linear combination of B_i''s own 30 points,"
      but it demonstrably is NOT one (that is exactly what independence of the 31-point set means) -- the document
      conflates the ORIGINAL null_control''s setting (P1 present in the base set, so -P1 duplicates an existing
      row) with this leave-one-out setting (Pi absent from the base set, so -Pi is a genuinely new, independent
      row), and the argument that was valid in the first setting was copied into the second without re-checking
      that its premise (the negated point''s row is already present) still holds.'
    consequence_for_repair_r4: 'Because Psi(-Pi)=Psi(Pi) exactly, the "sibling null" as specified is not merely
      wrong in its predicted outcome -- it is NUMERICALLY IDENTICAL, row for row, to the positive ascent test (both
      append the exact same F2 vector, Psi(Pi), to the exact same matrix B_i). It therefore has ZERO discriminating
      power between "correctly detects Pi''s independence" and "always ascends regardless of what is appended" --
      precisely the indistinguishability defect J3''s original finding_1 attacked the predecessor''s five controls
      for ("breaking_artifact_named: a degenerate ... implementation that ALWAYS INCREMENTS matrixRank regardless
      of input ... would PASS the positive ascent test but FAIL this sibling null" -- repair_r4''s own why_this_closes_j3
      argument). Since the sibling null cannot actually fail differently from the positive test (both require exactly
      the same row, Psi(Pi), to be recognized as independent), the always-ascends bug repair_r4 claims this pair
      "brackets" would in fact PASS BOTH halves, which is exactly the failure mode the pair was introduced to rule
      out. This reopens, in a new form, the ascent/no- ascent indistinguishability J3 finding_1 identified in the
      predecessor, inside the very control meant to close it. breaking_artifact matched: "A control that passes
      without the pipeline ever detecting a new point" -- here inverted: the null half as specified cannot PASS
      (report no ascent) under a correct implementation at all, so the pair does not test what repair_r4 claims.
      required_change (not this report''s to author, but named for the producer): a valid sibling null must add
      a row that IS demonstrably a linear combination of B_i''s own 30 rows -- e.g. Q_i := some Pj already in B_i
      (Psi(Pj) trivially duplicates an existing row), or Q_i := 2*Pj for some Pj in B_i (the all-zero-row argument
      from the predecessor''s P32_equals_2_times_P1 control, inherited unchanged and structurally valid), or an
      actual Z-linear combination of two or more of B_i''s own points via the group law -- NOT -Pi, which is excluded
      from B_i by the leave-one-out construction itself and is therefore never a combination of B_i''s remaining
      rows.'
    original_five_controls_status: 'Confirmed unaffected and correctly reflected: null_control and positive_control
      (inherited unchanged), both proves_too_much controls (inherited unchanged, addressed below), and nearby_object_control/rational_2_torsion_applicability
      (downgraded per repair_r3, subfinding_3 above notes this downgrade is INCOMPLETE at one location but the controls.*
      fields themselves are correctly reworded). No original control''s predicted outcome was silently altered.'
  proves_too_much_analysis:
    object_1_null_certificate:
      description: 31 frozen points plus Q=-P1; true independence count 31.
      verdict: CONCUR
      analysis: 'Unaffected by any repair in protocol-v2: null_control is in inherited_unchanged, and none of R1-R4
        touches Stage C''s original 31-point null test. Re-confirmed by hand, independently of the round-1 report:
        Psi(-P1)=Psi(P1) forces row 32 to duplicate row 1 exactly, regardless of implementation detail beyond reduction-map
        correctness (itself now MORE precisely specified by repair_r3''s projective-reduction convention, which
        if anything strengthens this object''s airtightness rather than weakening it). CONCUR: the route must, and
        by this design does, report the true, smaller number (31) on this object.'
    object_2_full_2_torsion_curve:
      description: Rank-0 curve with full rational 2-torsion (E(Q)_tors = (Z/2)^2, e.g. y^2=x^3-x); true independent-point
        count 0; a route reporting torsionRank=0 or a rank of 2/3 overcounts.
      verdict: DISSENT (narrowed from round 1, not closed)
      analysis: 'repair_r3.halving_induction_scope''s closes field asserts this DISSENT is closed: "no longer claiming
        the rejection of the full-2-torsion null object is design-guaranteed; it remains a credible, disclosed prediction."
        Verified: this IS the correct move in principle (it is red-team''s own round-1 required_change option (b),
        and downgrading an unproven guarantee to a disclosed prediction is a legitimate way to close a proves_too_much
        DISSENT per the inventor protocol''s controls-before-belief standard). But the failure_signature this joint
        must apply -- "the certificate route must report the true, smaller numbers on each known-false object; certifying
        independence where a Z-relation exists means the route is wrong somewhere unread" -- is a claim about the
        WHOLE document, and J2R subfinding_3 above establishes that proof_search_map.method_ceiling.nearby_object_control
        (a location this exact repair section''s own supersession_map entry claims to cover) still states, un-downgraded,
        that the corrected computation DOES achieve "matrixRank - torsionRank = declared point count" for a nontrivial-torsion
        curve -- i.e., still asserts, at that one location, exactly the design-guaranteed rejection of an object
        like this one that repair_r3 elsewhere disclaims. The document is therefore internally inconsistent about
        whether this object''s correct rejection is proven or merely predicted: controls.* correctly says "predicted,
        not proven"; proof_search_map.method_ceiling still reads as "proven." DISSENT stands, narrowed to this one
        un-repaired location rather than the round-1 finding''s full breadth (which spanned three locations, two
        of which are now correctly downgraded).'
    net_effect: 'Object 1 is airtight and unaffected. Object 2''s DISSENT is not fully closed: the intended fix
      (downgrade to disclosed prediction) is sound in the two locations it was actually applied, but protocol-v2''s
      own supersession_map names a third location the repair never reaches, leaving a design-guaranteed overclaim
      standing there and contradicting the closure the closure_table (R3: closed_at_design_level) and repair_r3.closes
      both assert.'
