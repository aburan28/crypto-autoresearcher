  - joint: J1
    title: Stage A Selmer decision rule
    verdict: DISSENT
    scope_note: 'This joint bundles two separable questions, both explicitly named in review-plan.yaml''s attack_plan:
      (i) the abstract logical implication -- IF dim Sel_2(E) is known EXACTLY, does the two-sided reading follow;
      and (ii) attack-plan item (a) -- is the declared enumeration over S/L(S,2) "genuinely exhaustive, or does
      it test a subgroup". Finding on (i) is CONCUR. Finding on (ii) is a confirmed break: the enumeration as specified
      in protocol.yaml does not actually compute dim Sel_2(E), so the joint verdict is DISSENT.'
    worked_attack:
      part_1_exact_sequence_rederivation: "Re-derived by hand, from the statement of the sequence alone (per attack_plan,\
        \ \"not the producer's chain\"). Given: E/Q, E(Q)_tors = {O} (trivial), rank(E) >= 31 already certified\
        \ via 31 exhibited independent points, and the exact sequence 0 -> E(Q)/2E(Q) -> Sel_2(E) -> Sha(E)[2] ->\
        \ 0 (exact, unconditional, textbook). By Mordell-Weil (unconditional theorem), E(Q) is finitely generated;\
        \ with trivial torsion, E(Q) ~= Z^rank(E), so E(Q)/2E(Q) ~= (Z/2Z)^rank(E) and dim_F2(E(Q)/2E(Q)) = rank(E)\
        \ exactly -- no hypothesis beyond trivial torsion and Mordell-Weil is used here. Exactness of the sequence\
        \ gives dim Sel_2(E) = dim(E(Q)/2E(Q)) + dim Sha(E)[2]\n             = rank(E) + dim Sha(E)[2],\nand since\
        \ dim Sha(E)[2] >= 0 always (it is the dimension of an F2-vector space, never negative), rank(E) <= dim\
        \ Sel_2(E) unconditionally, with no conjecture (no BSD, no GRH, no finiteness of Sha) anywhere in this step.\
        \ If dim Sel_2(E) = 31 exactly: since rank(E) >= 31 (already certified) and rank(E) <= dim Sel_2(E) = 31,\
        \ rank(E) = 31 is FORCED, and moreover dim Sha(E)[2] = 0 is a CONSEQUENCE of this squeeze, not an assumption\
        \ fed into it. This matches protocol.yaml's READING (a) (lines 287-292) exactly and is mathematically sound\
        \ and fully unconditional as stated. If dim Sel_2(E) >= 32: rank(E) = dim Sel_2(E) - dim Sha(E)[2] could\
        \ still equal 31 if dim Sha(E)[2] >= dim Sel_2(E) - 31 >= 1, so a 32nd independent point is licensed but\
        \ not guaranteed -- matches READING (b) (lines 293-301) and is correctly, honestly hedged (no overclaim\
        \ of guarantee). CONCUR on this abstract implication: it is the correct, unconditional consequence of the\
        \ exact sequence given trivial torsion and the certified rank >= 31 floor."
      part_2_enumeration_exhaustiveness_attack__THE_BREAK: 'Attack-plan item (a) asks whether "the enumeration over
        2^|S_L| classes [is] genuinely exhaustive, or does it test a subgroup". protocol.yaml states, at search_boundary.stage_a_selmer_computation
        (lines 899-930) and again at claim (line 279) and object_first (lines 205-210) and target_complexity (lines
        752-753): S = {2} union {primes dividing Delta(E)}, and enumeration_order (line 916-930) literally specifies:
        "Index each of the 2^|S_L| classes of L(S,2), where S_L is that set of primes of L [above S], by the bit-vector
        of exponents (0 or 1) over S_L in that fixed order" -- i.e. the protocol treats L(S,2) as IN BIJECTION with
        subsets of S_L, dimension exactly |S_L|, generated purely by the primes of L above S. This is FALSE for
        L(S,2) as actually defined (the group of square classes in L*/(L*)^2 whose divisor is supported on primes
        above S, i.e. the S-unit group O_{L,S}^* mod squares). By the S-unit theorem, dim_F2(O_{L,S}^*/(O_{L,S}^*)^2)
        = |S_L| + rank(O_L^*) + e for a small torsion term e in {0,1}, where rank(O_L^*) is the ORDINARY (non-S)
        unit rank of L given by Dirichlet''s unit theorem: rank(O_L^*) = r1 + r2 - 1, where r1, r2 are L''s real
        and complex places. L is here the cubic resolvent field (degree 3 over Q, since torsion:[] in the frozen
        JSON forces the resolvent cubic to be irreducible -- protocol.yaml''s own rational_2_torsion_applicability
        control at lines 1079-1081 notes this). For a degree-3 field, r1 + 2*r2 = 3, so (r1,r2) is either (3,0)
        [totally real, unit rank 2] or (1,1) [one real place, one complex pair, unit rank 1]. EITHER WAY rank(O_L^*)
        >= 1, strictly positive -- there is no cubic field with unit rank 0 (that would require r1+r2=1, impossible
        given r1+2r2=3 with r1,r2 >= 0 integers). Therefore dim_F2 L(S,2) = |S_L| + rank(O_L^*) + e > |S_L| by at
        least 1, in every case, regardless of the class number of L. This is exactly why full 2-descent via the
        cubic resolvent is fundamentally harder than descent via a rational 2-isogeny: the latter''s ambient group
        Q(S,2) is a bitvector space over S alone PRECISELY BECAUSE Q has unit rank 0 (Dirichlet: r1+r2-1 = 1+0-1
        = 0 for Q), so "|S| bits, no more" is valid ONLY in that degenerate case. protocol.yaml itself correctly
        distinguishes L(S,2) from Q(S,2) at the tracked_object level (line ~906-909: "NOT the squarefree-integer
        space Q(S,2)... inapplicable here"), but its concrete enumeration_order procedure (lines 916-930) then silently
        reverts to describing exactly the Q(S,2)-style construction (pure bitvectors over a prime list) applied
        to L(S,2), omitting the unit-group generators of O_L^* entirely, and omitting any treatment of Cl(L)[2]
        (needed when h(L) is even, to correct for primes of S_L that are not principal). Consequence for the decision
        gate: a literal implementation of enumeration_order as written enumerates a PROPER SUBGROUP of the true
        L(S,2) -- it never constructs or tests any class that requires a nontrivial unit-group component. Any genuine
        Selmer class (an element of the true Sel_2(E) subset of L(S,2)) whose representative is not expressible
        purely as a product of the chosen S_L-prime generators would never be generated, hence never tested for
        local solubility, hence silently absent from the reported count. A run of this literal procedure reporting
        "dim Sel_2(E) = 31" therefore establishes only that 31 classes WITHIN THE INCOMPLETE TESTED SUBSPACE pass
        local solubility -- it does not establish that the TRUE dim Sel_2(E) (computed over the full L(S,2)) equals
        31. The true dim Sel_2(E) could be strictly larger, hiding room for a genuine 32nd independent point that
        this procedure, as specified, structurally cannot detect. This is a concrete instance of review-plan.yaml''s
        own predicted breaking pattern: "a class ... survives outside the enumerated space" (the missing unit-group-derived
        classes are exactly such a class), "silently turning ''dim = 31'' into a non-decisive lower bound" on the
        TESTED subspace rather than an exact value of Sel_2(E) itself. Note this is not a mere cost/completeness
        caveat (already disclosed honestly elsewhere as a budget-ceiling risk in budgets_and_stops.stage_a_selmer_computation,
        lines 1140-1179): a budget ceiling that halts early is reported as "undetermined within budget" (correct,
        per AGENTS.md rule 3/5). This is different and worse: the enumeration_order procedure, even if run to COMPLETION
        against its own stated 2^|S_L| bound with unlimited budget, still could not reach the true dim Sel_2(E),
        because its ambient candidate space is the wrong (too small) group by construction, not merely budget-truncated
        within the right group.'
      part_3_decision_gate_arithmetic_phrasing_minor_note: 'Attack-plan item (b) asks whether the decision gate''s
        "equal to E(Q)_tors[2]=0 plus the already-certified 31" arithmetic (line 944) is right given trivial torsion.
        Read literally as "31 = 0 + 31" it is not false, but it is an imprecise/incomplete gloss: the actual unconditional
        justification (part_1 above) is dim Sel_2(E) = rank(E) + dim Sha(E)[2] with dim Sha(E)[2] >= 0 forcing the
        squeeze -- Sha(E)[2] is never named at the decision_gate itself, only in the separate `mechanism` block
        (lines ~302-309). This is a documentation-clarity gap, not a mathematical error, and is NOT counted as part
        of the breaking_artifact for this verdict; noted for completeness since attack-plan item (b) explicitly
        asked for it to be checked.'
      part_4_conjecture_dependency_check: 'Attack-plan item (c): named dependency set. READING (a) as derived in
        part_1 requires only Mordell-Weil finite generation (theorem) and exactness of the 2-descent sequence (theorem)
        -- CONFIRMED fully unconditional, no BSD/GRH/Sha-finiteness needed, consistent with protocol.yaml''s own
        claim. READING (b) is correctly stated as licensed-not-guaranteed (Sha(E)[2] possibly nonzero is disclosed,
        lines 293-301 and interpretation_limits lines 685-693) -- CONFIRMED not overclaimed as unconditional. No
        issue found in this sub-item.'
    breaking_artifact: protocol.yaml's search_boundary.stage_a_selmer_computation.enumeration_order (lines 916-930),
      and its restatements of the prime-set/enumeration size at lines 205-210, 279-280, 752-753, and 910-912, describe
      L(S,2) as generated solely by bit-vectors over S_L (the primes of the cubic resolvent field L above S), with
      dimension exactly |S_L|. This omits the unit-group contribution rank(O_L^*) = r1+r2-1 >= 1 (Dirichlet's unit
      theorem, forced positive for any degree-3 field since r1+2r2=3 admits no solution with r1+r2 <= 1) and any
      class-group correction. The enumeration as literally specified therefore tests a proper subgroup of the true
      L(S,2), not the ambient space Sel_2(E) actually lives in. A reported "dim Sel_2(E) = 31" from this procedure
      would not be the exact quantity the decision gate (line 943-949) requires to invoke unconditional closure
      -- it would be the dimension of a strictly smaller tested space, and the true dim Sel_2(E) could exceed it,
      leaving room for an undetected 32nd independent point.
    recommended_fix_note: 'Not prescriptive (out of scope for this review), but for the Coordinator''s use: any
      second full-2-descent-via-cubic-resolvent write-up that fixes enumeration_order would need to specify how
      the S-unit group O_{L,S}^*/(O_{L,S}^*)^2 is actually computed (a nontrivial number-field computation requiring
      the unit group and, if h(L) > 1, class-group data of L, not merely a sorted prime list) -- this is a genuine
      implementation-complexity increase, not a cosmetic fix, and materially changes the Stage A cost model in budgets_and_stops
      (lines 1140-1179), which currently costs only the S_L bitvector space.'
  - joint: J4
    title: Baseline reproduction specification fidelity
    verdict: DISSENT
    scope_note: 'Per attack_plan: check every protocol-quoted constant verbatim against the frozen JSON; check the
      short-Weierstrass conversion''s stated role is coherent; check the torsion-determination method is stated
      at a strength that proves E(Q)_tors = {O} exactly, not merely |E(F_p)| constraints. Most checks CONCUR; one
      derived (not directly quoted) constant is verifiably wrong against the correctly-quoted source data, which
      is sufficient for DISSENT on fidelity.'
    worked_attack:
      verbatim_constant_checks_PASS: 'Checked digit-for-digit against coordination/goals/GOAL-ECQ-e72c0b/baseline/icarm_curve_302_20260824.json.
        ainvs (a1,a2,a3,a4,a6): protocol.yaml quotes ("1","1","1","-1284727764113567728281797636015784768866707681415849262157224232063",
        "560368321454261339256859338901915312332769858684945406858043869199456710681989058863306170127006181"),
        matching JSON `ainvs` field exactly, entry for entry. Discriminant: protocol.yaml''s 204-digit string (lines
        ~274-276) matches JSON `discriminant` (line 38) character-for-character on manual segment-by-segment comparison
        (compared in 10-digit chunks; no discrepancy found). rank_lower_bound: JSON value 31 matches every protocol.yaml
        reference to "31 exhibited/certified points". torsion: JSON `torsion: []` (trivial) matches protocol.yaml''s
        repeated "E(Q)_tors trivial" / "E(Q)_tors[2] = 0" claims. Spot-checked two rational-denominator example
        points explicitly quoted in protocol.yaml''s baseline_reproduction.on_curve_checks (line ~829-831): x =
        8050101189939018648004785213625795/9 matches JSON `points` entry (JSON line 102) verbatim; x = -11477003798992551861310315487329257523535/8922169
        matches JSON `points` entry (JSON line 162, the final point) verbatim. All 31 `points` array entries were
        counted in the JSON (lines 41-164, 31 bracketed [x,y] pairs) and match protocol.yaml''s stated count of
        31.'
      prime_set_construction_check__THE_BREAK: 'protocol.yaml repeatedly derives, from the frozen JSON''s `bad_primes`
        list, the claim "|S| <= 21 (20 listed bad primes plus 2)" -- at lines 205-210 ("|S| is bounded by the 20
        listed bad primes... plus 2"), line 279-280 ("at most 21 primes -- 20 listed bad primes plus 2"), lines
        752-753 ("|S| <= 21 (20 bad primes plus 2)"), and lines 910-912 ("S = {2} union {primes dividing Delta(E)}...
        |S| <= 21 (20 listed bad primes plus 2"). This treats "2" as an ADDITIONAL element beyond the 20 listed
        bad primes. Checked against the frozen JSON''s `bad_primes` array (JSON lines 16-37): it contains exactly
        20 entries, and the FIRST entry (JSON line 17) is "2" itself -- curve 302 already has bad reduction at 2.
        Therefore S = {2} union {primes dividing Delta(E)} = bad_primes exactly, as a SET, with |S| = 20, not 21:
        the protocol''s own declared construction double-counts the prime 2 (once via the explicit "{2}" term, once
        via bad_primes[0] = "2"). Numerically the stated bound "|S| <= 21" is not violated (20 <= 21 remains true),
        but it is not the actual value the protocol''s own correctly-quoted source data yields, and the error propagates:
        the |S_L| <= 3|S| <= 63 bound at lines 210, 753, and 1143 should read <= 60 under the correct |S| = 20,
        and the enumeration_order instruction to "sort S in ascending numeric order" (line 917) is ambiguous about
        whether S is built as a genuine set (2 appears once) or as a literal union/concatenation of the singleton
        {2} with the bad_primes list (2 could appear twice, corrupting the canonical-order sort and the induced
        "primes of L above S" step by processing 2''s splitting behavior in L twice). This is exactly the class
        of check attack-plan item asks for under "prime-set guidance": a protocol-derived constant that does not
        follow from the frozen record it claims to derive from.'
      short_weierstrass_identity_check_PASS: 'Verified by symbolic inspection (no computation, pure algebraic identity
        check): for E: y^2 = x^3 + Ax + B (short Weierstrass), the standard discriminant is Delta_E = -16(4A^3 +
        27B^2) (Silverman AEC III.1). The resolvent cubic here is x^3 + Ax + B itself (its roots are the 2-torsion
        x-coordinates), with disc(x^3+Ax+B) = -4A^3 - 27B^2 by the standard cubic-discriminant formula. Then 16*disc(resolvent
        cubic) = 16*(-4A^3-27B^2) = -16(4A^3+27B^2) = Delta_E exactly. protocol.yaml''s claimed identity "Delta_E
        = 16*disc(resolvent cubic)" (used at lines ~205-210 and in baseline_reproduction.short_weierstrass_conversion.why_needed)
        is CORRECT for a curve already in short Weierstrass form. protocol.yaml correctly flags (confounders, lines
        ~663-670) that curve 302 is NOT given in short form (a1=a2=a3=1, all nonzero per the frozen JSON) and that
        the conversion must be re-derived at Stage 0 before this identity is used to fix S -- this caveat is appropriately
        conservative and not a break.'
      torsion_determination_strength_check_PASS: 'protocol.yaml''s torsion_determination method (gcd of #E(F_p)
        over >= 2 good odd primes, citing injectivity of reduction on prime-to-p torsion at good primes p, Silverman
        AEC VII.3.1) is stated at the correct strength: reduction mod a good ODD prime p is injective on the prime-to-p
        part of E(Q)_tors, so if gcd(#E(F_p1), #E(F_p2), ...) = 1 over several distinct good odd primes, no prime
        can divide every #E(F_pi), forcing E(Q)_tors = {O} exactly and unconditionally -- this is a genuine proof
        of triviality, not merely a divisibility constraint on #E(F_p) individually. This matches the frozen JSON''s
        torsion: [] and is not merely restating |E(F_p)| bounds. No issue found.'
      sha256_check_NOT_VERIFIABLE_under_zero_execution: protocol.yaml's header_note (line ~16-18) and claim block
        (line ~277) both cite "sha256 2bd422f34d0566f79c53f6bc94c6ec5f9ff048cd88fcc300f53e0b397af2e67b" for the
        frozen baseline JSON file. This hash is not itself a field inside the JSON and cannot be independently confirmed
        by hand derivation -- computing a SHA-256 digest requires execution (the HARD RULE 1 zero-execution constraint
        on this review explicitly forbids command execution and computer algebra). This is DISCLOSED as unverified
        by this review, neither confirmed nor contradicted; it is not counted toward this verdict either way.
    breaking_artifact: protocol.yaml's repeated derived claim "|S| <= 21 (20 listed bad primes plus 2)" (lines 205-210,
      279-280, 752-753, 910-912) does not follow from the frozen JSON's own bad_primes array (JSON lines 16-37),
      whose first entry is already "2" (curve 302 has bad reduction at 2). The correct value is |S| = 20 exactly,
      since S = {2} union bad_primes = bad_primes as a set. This is a verifiable mismatch between a protocol-stated
      derived quantity and what actually follows from the correctly-quoted frozen source data, propagating into
      the |S_L| <= 3|S| <= 63 cost bound (should read <= 60) and creating a duplicate-element ambiguity risk in
      the literal "S = {2} union {primes dividing Delta(E)}" construction instruction if implemented as concatenation
      rather than true set union.
    severity_note: 'Bounded severity: the numeric safety margin (20 <= 21) means the stated upper bound is not itself
      violated, and every other verbatim-quoted baseline constant checked (ainvs, discriminant, rank_lower_bound,
      torsion, two spot-checked point coordinates, point count, the Delta_E=16*disc(resolvent cubic) identity, the
      torsion determination method''s strength) CONCURS with the frozen record. DISSENT is issued because the joint''s
      own charge is fidelity of the baseline-reproduction specification against the frozen record, and this is a
      genuine, checkable failure of that fidelity on the prime-set derivation specifically named in the attack plan,
      not a judgment call.'
  summary_for_coordinator: 'Both owned joints return DISSENT. J1: the abstract two-sided decision rule (given an
    exactly-computed dim Sel_2(E)) is correctly and unconditionally derived from the exact sequence and trivial
    torsion, but the concrete Stage A enumeration procedure as specified tests a proper subgroup of the true L(S,2)
    -- it omits the unit-group contribution of the cubic resolvent field L (Dirichlet unit rank r1+r2-1 >= 1, unlike
    the degenerate Q(S,2) case where Q''s unit rank is 0), so a reported "dim Sel_2(E) = 31" from this literal procedure
    would not be the exact value the closure reading needs, and the "unconditional, forever" claim does not follow
    as specified. J4: every directly-quoted frozen constant checked (ainvs, discriminant, rank_lower_bound, torsion,
    sample point coordinates, point count, the resolvent-cubic discriminant identity, and the torsion-determination
