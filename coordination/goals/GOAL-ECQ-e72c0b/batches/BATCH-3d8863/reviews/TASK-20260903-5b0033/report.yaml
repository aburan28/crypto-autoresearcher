  R2b:
    joint_text_restated: The sibling null is replaced by one that appends a row OUTSIDE the span of B_i, with predicted
      outcome "stays at 30 while the matrix changes", so it can discriminate detection from always-ascent.
    verdict: CONCUR
    verdict_scope_note: 'CONCUR on the substance protocol-v3 actually had to close (restoring discriminating power
      between an always-ascends bug and a stuck-never-ascends bug, per J3R''s worked attack on Q_i=-P_i). Two non-breaking
      observations are recorded below: one about a terminology inversion in the review-plan/DEC''s own "outside
      the span" phrasing relative to standard linear algebra, and one about an under-justified-but-true side claim
      in protocol-v3''s own text. Neither triggers review-plan-v3''s stated breaking_artifact for R2b.'
    worked_evidence:
    - hand_rederivation_of_the_original_defect: 'Re-derived, independently, why protocol-v2''s Q_i := -P_i failed.
        Psi is stated (inherited, unchanged throughout this chain) to be a group homomorphism into an F2-vector
        space. In such a space every element is its own inverse (v+v=0 implies -v=v), so Psi(-P_i) = -Psi(P_i) =
        Psi(P_i) by the homomorphism property composed with the target''s characteristic-2 self-inverse property.
        Since the full 31-point set has rank exactly 31 (baseline_reproduction.rank31_baseline_certificate, inherited,
        not reopened here), Psi(P_i) cannot be a linear combination of {Psi(P_j) : j != i} = B_i''s own rows --
        if it were, the full 31-row matrix would have rank <= 30, contradicting the certified 31. So Psi(Q_i) =
        Psi(P_i) is the SAME vector the positive ascent test appends, and appending it necessarily ascends the reduced
        basis''s rank from 30 to 31 -- NOT "stays at 30". The pair becomes two copies of the same test. This independently
        confirms J3R''s finding as restated in protocol-v3''s repair_diff_note.'
    - hand_verification_of_the_replacement: 'Re-derived protocol-v3''s replacement construction, Q_i := 2*P_{j(i)}
        for P_{j(i)} already in B_i. Psi(2*P) = 2*Psi(P) by the homomorphism property, and 2*v = 0 for every v in
        an F2-vector space (characteristic 2), so Psi(Q_i) = 0 identically, for EVERY choice of P_{j(i)}, independent
        of curve arithmetic. Appending the all-zero row to any matrix leaves its rank unchanged by ordinary linear
        algebra (the zero vector is the trivial linear combination of any row set, hence always already "in the
        span"). This correctly predicts "stays at 30". Because Psi(Q_i)=0 differs from Psi(P_i) (nonzero, per rank31_baseline_certificate
        above), the sibling null''s prediction (30) now genuinely differs from the positive test''s prediction (31):
        the pair is no longer degenerate, and an always-ascends bug fails the null while a stuck bug fails the positive
        test, exactly the intended bracketing. This is the SAME all-zero-row mechanism protocol-v1''s own controls.proves_too_much.P32_equals_2_times_P1
        (inherited unchanged throughout this chain) already used and had accepted; protocol-v3 is re-applying an
        already-validated trick to the reduced basis, not introducing an unverified one.'
    - non_breaking_observation_1_span_terminology_inversion: 'review-plan-v3''s own joint text (and DEC-20260831-6d4a85''s
        required_next_repairs entry 2, and the coordinator_prior above it) state the requirement as "append a row
        OUTSIDE the span of B_i, [with] predicted outcome stays at 30". Read literally, against the standard linear-algebra
        sense of "span" used everywhere else in this document chain (matrix rank, F2-vector-space arguments), this
        is inverted: appending any row OUTSIDE span(B_i) necessarily INCREASES rank by exactly one (standard linear
        algebra, no curve-specific content), so "outside the span" and "stays at 30" cannot both hold for the same
        appended row -- they are mutually exclusive, not jointly required. The row that correctly produces "stays
        at 30" must be INSIDE span(B_i) (the zero vector counts, trivially). protocol-v3''s own construction is,
        and must be, a row INSIDE the linear span (Psi(Q_i)=0), which is the mathematically correct choice notwithstanding
        the plan''s literal wording. Charitably, "span of B_i" in the plan''s phrasing most likely was intended
        informally -- as "the SET of B_i''s 30 points/rows themselves" (i.e. avoid a literal duplicate), matching
        the coordinator_prior''s own parenthetical gloss, "indistinguishable from a duplicated row" -- rather than
        the F2-linear span. Under that reading protocol-v3''s Q_i, a genuinely distinct rational point not literally
        equal to any of B_i''s 30 points (see next item), does satisfy "outside [the set] B_i" while its ROW is
        (correctly) inside the linear span. This is flagged as a terminology inconsistency in the binding review-plan/DEC
        text worth tightening in a future joint, not as a defect in protocol-v3, since protocol-v3''s actual mathematics
        is the correct resolution of the substantive problem (restoring discriminating power) regardless of which
        reading of "span" is intended.'
    - non_breaking_observation_2_under_justified_distinctness_claim: 'protocol-v3''s corrected_sibling_null_construction
        argues 2*P_{j(i)} != any P_k in B_i''s index set "for any curve where P_{j(i)} is not itself 2-torsion (curve
        302 has trivial torsion, so 2*P_{j(i)} != any P_k ... unconditionally on curve 302 specifically)". This
        stated reason (non-2-torsion) is necessary but not by itself sufficient to rule out an accidental coincidence
        2*P_j = P_k for some k != j; it does not, as literally written, exclude that possibility. The conclusion
        is nonetheless TRUE and provable by a stronger, already-inherited fact this document does not cite here:
        if {P_1,...,P_31} are Z-independent (rank31_baseline_certificate, inherited, not reopened), then 2*P_j -
        P_k = O for j != k would be a nontrivial integer relation among independent generators (coefficients -2
        at j, +1 at k, not all zero), contradicting independence outright. This is a strictly stronger and sufficient
        argument than the one protocol-v3 gives. Flagged as a reasoning-chain gap with a true conclusion -- not
        breaking, since the claim protocol-v3 needs (Q_i is not a literal duplicate of an existing B_i point, avoiding
        the naive-duplicate-detection loophole) does hold, just for a better reason than stated.'
    breaking_artifact_check: 'Neither breaking artifact from review-plan-v3 is present. "The new null is itself
      in the span (degenerate again)" -- Psi(Q_i)=0 IS in the linear span (trivially), which is precisely why it
      correctly predicts no ascent; this is the required, non-degenerate behavior, not a recurrence of J3R''s defect
      (J3R''s defect was that the OLD null''s row was numerically IDENTICAL to the positive test''s own appended
