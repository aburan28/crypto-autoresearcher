  derivation:
    quantity_restated: E/Q, E(Q)_tors trivial. 31 certified Z-independent rational points (so the subgroup they
      generate is free abelian of rank 31). An exact computation over a finite prime set S returns dim_{F2} Sel_2(E)
      = 31.
    baseline_facts_used:
      torsion: '[] (trivial) — matches the stated E(Q)_tors = 0'
      rank_lower_bound: 31
      points_listed: 31
      bad_primes_count: 20
      bad_primes_first_entry: '2'
      note: 2 already appears as bad_primes[0]; it is not a 21st prime to be added separately. Any set S built as
        "bad_primes ∪ {2}" from this record has |S| = 20, not 21.
    part_i:
      title: Strict implication for rank(E(Q)) and Sha(E)[2]
      theorem_used: "The fundamental 2-descent exact sequence (unconditional; follows from the long exact Galois-cohomology\
        \ sequence of the Kummer sequence 0 -> E[2] -> E -> E -> 0 over Q, with Sel_2 defined as classes locally\
        \ in the image of the Kummer map at every place of Q, and Sha[2] defined as the everywhere-locally-trivial\
        \ classes not coming from E(Q)):\n  0 -> E(Q)/2E(Q) -> Sel_2(E/Q) -> Sha(E/Q)[2] -> 0.\nThis sequence, and\
        \ its exactness, requires NO conjecture: not BSD, not GRH, not finiteness of Sha. Sha(E)[2] is a perfectly\
        \ well-defined F2-vector space (the 2-torsion of the abelian group Sha(E/Q)) whether or not Sha(E/Q) itself\
        \ is known to be finite."
      step_1_dimension_count: E(Q)_tors trivial => E(Q) ≅ Z^r as an abstract group, r = rank(E(Q)) => E(Q)/2E(Q)
        ≅ (Z/2Z)^r exactly, dim_{F2} E(Q)/2E(Q) = r. (If torsion were nontrivial with even order this count would
        need a correction term from 2-torsion of the torsion subgroup; here it is zero by hypothesis.)
      step_2_lower_bound_on_r: 31 CERTIFIED Z-independent points generate a subgroup of E(Q) of rank exactly 31
        (independence certification, e.g. via non-vanishing of a regulator/height-pairing determinant under rigorous
        interval arithmetic, is itself an unconditional computational fact once "certified" is taken at face value
        — it is not a probabilistic or conjectural claim). This gives r = rank(E(Q)) >= 31.
      step_3_upper_bound_on_r: From the exact sequence, the map E(Q)/2E(Q) -> Sel_2(E/Q) is INJECTIVE, so dim E(Q)/2E(Q)
        <= dim Sel_2(E/Q), i.e. r <= dim Sel_2(E). Given dim Sel_2(E) = 31 exactly (and PROVIDED the S-sufficiency
        precondition of part (iii) holds, so that the computed group really is the true Sel_2(E/Q) and not merely
        a subgroup of it), r <= 31.
      step_4_combine: 31 <= r <= 31 => r = rank(E(Q)) = 31, exactly.
      step_5_sha: 'Exactness of the sequence gives dim Sha(E)[2] = dim Sel_2(E) - dim E(Q)/2E(Q) = 31 - 31 = 0.
        So Sha(E)[2] = 0: the 2-torsion subgroup of the Tate-Shafarevich group is trivial (not merely small — exactly
        trivial, on this scope).'
      conclusion: rank(E(Q)) = 31 (exact) and Sha(E)[2] = 0 (exact), STRICT, PROVIDED the S-sufficiency precondition
        (part iii) is met and the 31-point independence certificate and the dim Sel_2 = 31 computation are each
        correct.
      dependency_set:
        load_bearing_conjectures: []
        note: NONE. No conjecture (not BSD, not GRH, not finiteness of Sha, not any heuristic) is load-bearing for
          this implication as stated. The baseline record's own commentary field says "BSD + GRH certified to rank
          31" — that describes how the rank-31 LOWER BOUND was originally found/motivated (e.g. an analytic-rank
          search), which is a distinct, non-load-bearing provenance note. It plays no role once (a) the 31 points
          are independently CERTIFIED (unconditional, not merely BSD/GRH-suggested) and (b) dim Sel_2 = 31 is established
          by an EXACT finite computation over a SUFFICIENT S. If either input were instead merely BSD/GRH-suggested
          rather than certified/exact, the conclusion would degrade to conditional — but that is not what is stated
          here.
        load_bearing_non_conjectural_facts:
        - the fundamental 2-descent exact sequence (theorem, unconditional)
        - correctness of the 31-point independence certificate
        - correctness of the exact Sel_2 = 31 computation
        - S-sufficiency of the prime set S used in that computation (part iii)
    part_ii:
      title: Strict meaning of dim Sel_2(E) >= 32
      setup: Two distinct readings must be separated, because they license very different amounts.
      reading_A_only_a_lower_bound: 'If all that is established is dim Sel_2(E) >= 32 as an INEQUALITY (no exact
        value known/claimed), this licenses NOTHING beyond what the points already gave: r <= dim Sel_2(E) still
        holds, but since dim Sel_2(E) itself is only known to be >= 32 (could be 32, 40, or larger), there is NO
        finite upper bound extractable on r from this alone. The only usable fact remains r >= 31 from the certified
        points. This is the trap: a LOWER bound on Sel_2 dimension gives no upper bound on rank; only an EXACT (or
        explicitly upper-bounded) Sel_2 computation does.'
      reading_B_exact_value_m_geq_32: "If instead the SAME exact-computation procedure that gave 31 in the base\
        \ case instead returns dim Sel_2(E) = m for some established exact m >= 32 (the natural reading of \"the\
        \ strict meaning of dim Sel_2 >= 32\" as a counterfactual outcome of the same protocol), then:\n  r + dim\
        \ Sha[2] = m   (exactness)\n  r >= 31              (certified points, unchanged)\n  r <= m             \
        \  (injectivity)\n=> r ranges over the integers in [31, m], and correspondingly\n   dim Sha[2] = m - r ranges\
        \ over [0, m-31], STRICTLY LINKED to r\n   (once r is pinned, Sha[2]'s dimension is pinned, and vice versa\
        \ —\n   but the Selmer computation alone pins neither individually).\nFor the boundary case m = 32: r in\
        \ {31, 32}, dim Sha[2] in {1, 0} respectively — exactly two consistent scenarios, not one."
      what_is_licensed:
      - rank(E(Q)) is bounded above by m (a strictly weaker upper bound than the m=31 case, which pinned rank exactly).
      - rank(E(Q)) is bounded below by 31 (unchanged, from the points already in hand).
      - dim Sha(E)[2] = m - r, i.e. Sha[2]-dimension and the excess rank above 31 trade off exactly one-for-one.
      what_is_NOT_licensed:
      - That rank(E(Q)) = m. This would require INDEPENDENTLY ruling out any nontrivial Sha[2] contribution (e.g.
        an explicit second descent / visibility argument resolving every extra Selmer class), which the Selmer dimension
        alone does not do.
      - 'That Sha(E)[2] is nontrivial. Equally not implied: it is entirely consistent with dim Sel_2 = m that r
        = m and Sha[2] = 0 — i.e. that m - 31 further independent points exist and simply have not yet been found/certified.
        Only 31 points are certified in the given statement; the Selmer bound is silent on whether more exist.'
      - 'That a 32nd (or further) rational point EXISTS or is constructible. Sel_2 classes correspond to torsors
        (2-covers / homogeneous spaces) of E; a torsor being an element of Sel_2 means it is locally soluble everywhere,
        not that it has a rational point. An "extra" Selmer class beyond the known 31-generated subgroup may correspond
        exactly to a nontrivial Sha element: a torsor soluble everywhere locally but with NO rational point at all.
        The Selmer computation cannot by itself distinguish "there is an unfound point" from "there is a genuine
        Sha obstruction."'
      - Anything about finiteness of Sha(E/Q) as a whole group. A 2-Selmer computation only ever touches the 2-torsion
        Sha(E)[2]; the finiteness of Sha(E/Q) is a separate, deep, BSD-adjacent statement not addressed by this
        computation in either direction.
    part_iii:
      title: The S-sufficiency precondition, stated precisely
      classical_definition_of_Sel2: 'Sel_2(E/Q) = { classes c in H^1(Q, E[2]) : for every place v of Q (finite and
        infinite), the localization res_v(c) lies in the image of the local Kummer map E(Q_v)/2E(Q_v) -> H^1(Q_v,
        E[2]) }. This is a condition at ALL places of Q, unrestricted — computing it in practice requires reducing
        to a FINITE search, which is exactly what restricting to a finite S is for.'
      unramifiedness_lemma_unconditional: 'Standard fact (unconditional): a class in H^1(Q, E[2]) arising as the
        image of a point of E(Q) under the Kummer map, or more generally any class actually lying in Sel_2(E/Q),
        is UNRAMIFIED outside the set of primes of bad reduction for E together with the prime 2. Equivalently:
        for a prime p not dividing 2 and not a prime of bad reduction, the local condition at p is automatically
        satisfied by every class in Sel_2(E/Q), and no separate check at p is needed.'
      precise_precondition: "Let Bad(E) be the set of primes of bad (additive or multiplicative) reduction for E\
        \ (a global minimal model). S is SUFFICIENT for a finite-S computation (search classes unramified outside\
        \ S, locally soluble at every place in S union the real place) to equal the TRUE Sel_2(E/Q) if and only\
        \ if:\n  (a) S contains Bad(E) union {2}  — necessary, by the unramifiedness\n      lemma: omitting a bad\
        \ prime or 2 shrinks the search space below\n      the true Sel_2, generally UNDERCOUNTING (excluding true\
        \ Selmer\n      classes that are forced to ramify at the omitted prime); and\n  (b) the local solubility\
        \ condition is checked correctly and\n      completely at every prime in S AND at the real place infinity\n\
        \      (even though infinity is not itself a member of S in the\n      ramification sense, its local condition\
        \ is not automatically\n      satisfied and must not be silently dropped — for a curve with 3\n      real\
        \ 2-torsion x-coordinate roots this condition is genuinely\n      restrictive, not vacuous).\nGiven (a),\
        \ classes outside S are automatically locally soluble by the unramifiedness lemma, so no infinite check\
        \ is required — this is what converts an infinite-place condition into a finite computation. Enlarging S\
        \ beyond Bad(E) union {2} does not break correctness (any extra required local checks at the added primes\
        \ are automatically satisfied for true Selmer classes, by the same lemma) but is wasted work; it is (a)\
        \ union {2} ⊆ S that is the necessary floor."
      applied_to_baseline: 'From the frozen baseline: bad_primes has 20 entries and bad_primes[0] = "2", i.e. 2
        IS one of the 20 listed bad primes (not an additional 21st element). So if S is constructed as "bad_primes
        union {2}" from this record, |S| = 20 exactly, and this |S| satisfies precondition (a) by construction PROVIDED
        the "bad_primes" field in the frozen record itself correctly and completely enumerates the primes of bad
        reduction of a global minimal model of E (a data-integrity assumption about the frozen JSON, not a mathematical
        conjecture, and one I cannot verify further from the JSON alone — I take the field''s stated meaning at
        face value).'
      assessing_the_one_sentence_repaired_procedure: 'The gloss given in review-plan-v2.yaml is: "the S-unit group
        of the cubic resolvent field over S, plus class-group data if needed, locally soluble classes enumerated."
        Assessed purely on the mathematics, without reading protocol-v2 itself:

        This is the outline of the CLASSICAL, UNCONDITIONAL cubic-resolvent 2-descent method (applicable because
        E(Q)_tors is trivial, so the 2-division polynomial is an irreducible-or-not cubic and L = Q[T]/f(T) is its
        resolvent field). The descent map sends E(Q)/2E(Q) -> L*/(L*)^2 (more precisely into the subgroup of classes
        with N_{L/Q} landing in a fixed square-class, since the image lies in classes satisfying a norm condition),
        and Sel_2(E/Q) is computed as the subgroup of that target satisfying: unramified outside S_L (primes of
        L above S), the norm condition, and local solubility at every place above S_L union the archimedean places
        of L. This is a standard, fully unconditional, computable recipe requiring no BSD, GRH, or heuristic — PROVIDED
        it is executed completely.

        The phrase "plus class-group data if needed" is precisely where completeness can fail, and is exactly the
        failure mode this description does not, by itself, rule out. By Dirichlet''s unit theorem, O_L^* has rank
        r1+r2-1 (r1 real places, r2 complex-place pairs of the cubic field L; for a cubic field r1+r2-1 is 0 (totally
        complex embedding into signature (1,1), r1=1,r2=1, rank=1) or 2 (totally real, r1=3,r2=0, rank=2)), plus
        torsion {±1}. The S-unit group O_{L,S}^* has rank (r1+r2-1) + |S_L| where S_L is the set of primes of L
        above S. If the class number h(L) = 1, every S-unit is (up to global units and torsion) directly expressible
        from valuations at S_L, and "class-group data" is genuinely not needed — O_{L,S}^*/(O_{L,S}^*)^2 is read
        off directly from Dirichlet''s theorem. If h(L) > 1, a prime P above some p in S_L may be non-principal;
        O_{L,S}^*/O_L^* is then only correctly computed by identifying which combinations of primes above S become
        principal, which requires the CLASS GROUP of L (or at least its S-part / 2-part). Omitting this when h(L)
        > 1 does not overcount — it UNDERCOUNTS O_{L,S}^*/(O_{L,S}^*)^2 (misses valid S-unit generators), which
        undercounts candidate Selmer classes, which would make a computed dim Sel_2 come out TOO SMALL relative
        to the true value.

        So: the one-sentence method, taken as a description of WHAT to compute, is the correct unconditional recipe
        for the true Sel_2(E/Q) whenever it is executed to completion, i.e. whenever class-group data actually IS
        supplied and used everywhere h(L) > 1 requires it (and S itself satisfies part (a) above). Whether a specific
        run of it does so — in particular whether computing or certifying Cl(L) at curve-302''s discriminant scale
        is itself feasible without invoking a GRH-conditional class-group algorithm (e.g. a Buchmann-style computation,
        whose termination/correctness proof is typically GRH- conditional unless independently certified) — is NOT
        something the one-sentence gloss settles, and I have deliberately not read protocol-v2 to find out. That
        completeness/feasibility question is exactly what joint J1R (a different, non-blind reviewer task) is positioned
        to check by reading the actual repaired computation; this report can only state the precondition and the
        two directions in which a computation can go wrong (missing bad primes/2 in S, or missing class-group data
        when h(L) > 1), both of which point toward UNDERCOUNTING dim Sel_2 as the failure mode to watch for, not
        overcounting.'
    cross_check_with_review_plan_context: 'This derivation is consistent with, and was reached independently of,
      two structural facts already visible in review-plan-v2.yaml itself (which I was told to read as my binding
      instructions, not as the forbidden protocol/report): the coordinator_prior''s expectation that the honest
      S-unit-group cost is far beyond a naive bitvector estimate and plausibly infeasible at this discriminant scale,
      and J4R''s assigned check that |S| = 20 (not 21, since 2 is already bad_primes[0]) — both match what I derive
      above from the baseline JSON and standard descent theory alone, without having read protocol-v2''s own treatment
      of either point.'
  procedure_deviations: []
