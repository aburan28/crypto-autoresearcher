review_plan:
  claim_under_review: >-
    The REPAIRED successor design PROTO-ECQ-e72c0b-b83032 (protocol-v2, from
    TASK-20260831-b83032): does it close DEC-20260831-fada1e repairs R1-R4
    soundly while keeping the independently corroborated two-sided decision
    rule intact (dim Sel_2 = 31 forces rank exactly 31 and Sha[2]=0,
    unconditionally; dim >= 32 only licenses; no conjecture load-bearing,
    subject to the S-sufficiency precondition)? Zero execution; design tier.
  coordinator_prior: >-
    Recorded before any re-reviewer ran. R1 is the load-bearing repair: the
    producer must specify a FINITE computation of O_{L,S}^*/(O_{L,S}^*)^2 for
    the cubic resolvent field L of curve 302. I expect the repair to concede
    the honest cost is far beyond the original 2^21 bitvector estimate and
    likely infeasible at curve 302's discriminant scale - and the honest
    outcome is a scoped statement of what remains decidable, NOT approval
    for execution. I expect R2 (|S|=20) and R3 (scope restrictions) to be
    routine. I expect R4's positive-detection control to be accepted if its
    success genuinely requires certifying a new point on curve-302-scale
    data. If protocol-v2 instead DELETES the enumeration stage or waters the
    decision rule down to a conditional heuristic, that is closure by
    omission and I expect the reviewers to catch it.
  joints:
    - joint: >-
        J1R - THE REPAIRED STAGE A ENUMERATION. Does protocol-v2's specified
        computation now cover the FULL L(S,2) - including the S-unit group
        contribution r1+r2-1 >= 1 and class-group data when h(L) > 1 - with
        a finite, honestly costed procedure? Does the re-derived Stage A
        cost model follow from that computation (not from a bitvector
        count)? Is the two-sided decision gate stated over the TRUE Selmer
        group with the S-sufficiency precondition satisfied by construction?
      assigned_to: TASK-20260831-e24039
      attack_plan: >-
        Re-derive the dimension arithmetic of L(S,2) from Dirichlet's unit
        theorem and the exact descent sequence, by hand, for a cubic field
        with the specified S: check the producer's stated dim bounds
        include the unit contribution (they were absent in the reviewed
        version). Then attack the finiteness claim: does the repair specify
        HOW generating sets of the S-unit group are computed (or honestly
        defer it as an open feasibility item), and does the cost model
        account for it? Where the Coordinator expects it to break: an
        honestly-stated infeasibility that the closure table upgrades to
        'closed' without flagging the residual.
      breaking_artifact: A dimension miscount, an unbounded/unspecified
        computation presented as finite, or a closure-table row claiming
        more than the design states.
    - joint: >-
        J2R - THE CERTIFICATE ROUTE RESTATEMENT. Is the halving-induction
        argument now stated at a scope covering every use, or explicitly
        restricted everywhere it is used? Is the resolvent-cubic claim
        derived for a1,a3 != 0 or dropped? Is the reduction-map
        precondition restated per projective reduction?
      assigned_to: TASK-20260831-b36a44
      attack_plan: >-
        Diff protocol-v2's certificate_route against the reviewed version:
        check each of the three J2 sub-findings is either repaired or
        explicitly scoped down, and that no NEW overstatement was
        introduced (the restricted route must still cover every place the
        v2 document itself uses it). Re-check the halving-induction step
        for the parity gap the round-1 attack suspected.
      breaking_artifact: A use of the route outside its now-stated scope,
        or a restated proof with the same gap.
    - joint: >-
        J3R - CONTROLS. Does the repair add a positive-detection control on
        curve-302-scale data whose success REQUIRES certifying a known new
        point, with a named sibling null - and do the original five controls
        remain with their predicted outcomes intact?
      assigned_to: TASK-20260831-b36a44
      attack_plan: >-
        Check the new control's success condition actually depends on the
        pipeline detecting a NEW point (not on a re-derived known point,
        which would be another stays-same control in disguise), and that
        its data scale is curve-302-like (the round-1 finding). Name what
        defect it isolates that the other controls do not.
      breaking_artifact: A control that passes without the pipeline ever
        detecting a new point.
    - joint: >-
        J4R - PRIME-SET AND BOUNDARY FIDELITY. Is |S| = 20 correctly derived
        (2 in the frozen bad_primes), the construction a true set union, and
        the |S_L| bound propagated - with every quoted frozen constant still
        verbatim-faithful and the zero-execution boundary intact?
      assigned_to: TASK-20260831-e24039
      attack_plan: >-
        Check protocol-v2's prime-set section against the frozen JSON
        (bad_primes first entry is 2), confirm the set-union construction
        and the propagated |S_L| bound, and re-verify the directly quoted
        constants (discriminant, ainvs, torsion) are unchanged from the
        reviewed version. Confirm experiments_run = 0 and
        mathematical_claims = [] throughout.
      breaking_artifact: Any misquoted frozen constant, wrong |S|, or an
        execution artifact.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Single re-review round; reviewers run concurrently (or sequentially
      under the queue cap) and may not read each other's reports.
  proves_too_much:
    objects:
      - >-
        The null certificate object: 31 frozen points plus Q = -P1 - true
        independence count 31; a route reporting 32 has proved too much.
      - >-
        A rank-0 curve with full rational 2-torsion: true torsion 2-rank 2;
        a route reporting torsionRank = 0 or rank 3 from three rows is
        overcounting.
    failure_signature: >-
      The certificate route must report the true, smaller numbers on each
      known-false object; certifying independence where a Z-relation exists
      means the route is wrong somewhere unread.
    assigned_to: TASK-20260831-b36a44
  blind_rederivation:
    required: true
    quantity: >-
      From ONLY the statement 'E over Q, E(Q)_tors trivial, 31 certified
      Z-independent rational points, dim Sel_2(E) computed exactly over a
      finite prime set S equals 31', re-derive (i) the strict implication
      for rank(E(Q)) and Sha[2] with its dependency set, (ii) what
      dim >= 32 licenses, (iii) whether the REPAIRED enumeration as
      described in one sentence ('the S-unit group of the cubic resolvent
      field over S, plus class-group data if needed, locally soluble
      classes enumerated') computes the true Selmer group - stating the
      S-sufficiency precondition precisely.
    parameters: >-
      The frozen curve-302 ainvs and 31 points, read ONLY from
      coordination/goals/GOAL-ECQ-e72c0b/baseline/icarm_curve_302_20260824.json.
    blind_from:
      - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260831-b83032/protocol-v2.yaml
      - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260831-b83032/task-report.yaml
      - ledger/handoffs/TASK-20260831-b83032.yaml
    assigned_to: TASK-20260831-5f39cb
  procedure_deviations: []
