  repairs_made_per_finding:
    - repair: R1
      finding_closed: J1
      reviewer: validator (TASK-20260831-234e80)
      summary: >-
        Replaced the predecessor's Stage A enumeration (a pure |S_L|-
        dimensional bitvector space over the primes of L above S) with the
        true object, O_{L,S}^*/(O_{L,S}^*)^2, whose dimension is
        |S_L| + rank(O_L^*) + e (rank(O_L^*) >= 1 always, for a cubic
        field, by Dirichlet's unit theorem -- the exact gap J1 identified).
        Re-derived the Stage A cost model to include the previously-omitted
        S-unit/class-group generating-set cost, and stated plainly that this
        cost is, at curve 302's actual discriminant scale (~664 bits),
        likely infeasible with any presently known algorithm (an
        order-of-magnitude analogy to factoring/discrete-log difficulty at
        comparable bit length, disclosed as a design-time estimate, not a
        measured result). Specified what remains decidable: a cheap,
        unconditional signature computation (Stage A'.0); a bounded,
        possibly-failing class-group attempt (Stage A'.1, gating exact
        closure); and an honest, always-available lower-bound fallback
        (Stage A'.3, the predecessor's original procedure relabeled
        correctly as a lower bound, sufficient to license search but never
        to close READING (a)).
      status: closed_at_design_level
      residual_open_item: >-
        Whether Stage A'.1 is tractable for curve 302's actual L is
        undetermined without execution; out of scope for this repair.
    - repair: R2
      finding_closed: J4
      reviewer: validator (TASK-20260831-234e80)
      summary: >-
        Corrected the prime-set construction to a true set union
        (S := bad_primes union {2}, idempotent), fixing |S| = 20 for curve
        302 specifically (bad_primes' own first entry is already "2",
        verified directly against the frozen JSON in this session) rather
        than the predecessor's double-counted |S| <= 21. Propagated the
        correction into |S_L| <= 60 (not <= 63), and removed the
        duplicate-element sort ambiguity by mandating an explicit
        set/dedup construction step before the canonical ascending sort.
      status: closed_fully
      residual_open_item: none
    - repair: R3
      finding_closed: 'J2 (all three findings) and proves_too_much object_2'
      reviewer: red-team (TASK-20260831-ea2561)
      summary: >-
        Three sub-fixes. (a) Restricted the halving-induction
        soundness argument's stated scope everywhere to E(Q)_tors = {O}
        (matching its own proof's actual hypothesis), leaving curve 302's
        own primary certificate path fully proven and unaffected (trivial
        torsion), and downgraded the two nonzero-torsion controls'
        expected_outcome from a proven guarantee to a disclosed design-time
        prediction pending a separate, not-yet-supplied proof. (b) Derived
        (rather than merely asserted as "a standard identity") the
        resolvent-cubic discriminant relation Delta_E = 16*disc(resolvent
        cubic) for a1,a3 != 0 by committing explicitly to a translation-only
        short-Weierstrass conversion convention, under which the identity
        holds exactly and generally (not merely as a curve-302 coincidence
        under the alternative scaled convention the predecessor left open).
        (c) Restated the reduction-map precondition per projective
        reduction: every point reduces to a well-defined image in E(F_p)
        (O when the coordinate triple's reduced Z vanishes), removing the
        predecessor's ad hoc skip-and-extend-S' workaround entirely.
      status: closed_at_design_level
      residual_open_item: >-
        The general (nonzero-torsion) halving-induction theorem remains an
        open proof obligation, affecting only the two downgraded auxiliary
        controls, not curve 302's own certificate path.
    - repair: R4
      finding_closed: J3
      reviewer: red-team (TASK-20260831-ea2561)
      summary: >-
        Added a leave-one-out ascent battery: for each of curve 302's 31
        known points Pi, run Stage C on the reduced 30-point basis (required
        matrixRank - torsionRank = 30), then on the reduced basis plus Pi
        (required ascent to 31) -- a positive-detection control on curve
        302's own pipeline instance at curve 302's own coordinate/height
        scale, whose success requires the pipeline to certify Pi as a
        genuinely new independent point relative to the reduced basis, with
        ground truth supplied independently by Stage 0's existing rank-31
        certificate. Named the required sibling null: the same reduced
        basis with a known DEPENDENT point (Q_i = -Pi) added back, expected
        to show no ascent (stays at 30). The pair brackets both failure
        directions (spurious-always-ascends and stuck-never-ascends) that
        J3's five-control critique showed the predecessor's control suite,
        individually or jointly, did not guarantee against for this
        pipeline instance at this scale.
      status: closed_at_design_level
      residual_open_item: >-
        Closes certification-ascent detection only; does not test Stage B's
        search power at large heights, which remains an open, already-
        disclosed gap.

