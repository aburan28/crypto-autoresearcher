      'J2 (red-team, TASK-20260831-ea2561, DISSENT, all three findings) and
      proves_too_much object_2 (DISSENT)'
    addresses_repair: 'R3 of DEC-20260831-fada1e'

    halving_induction_scope:
      repair_diff_note: >-
        DIFF AGAINST protocol.certificate_route.matrix_rank_implies_
        independence_proof (predecessor lines ~1313-1330), which opens
        "Suppose Sigma(a_i*Pi) = O (torsion is trivial, so any relation
        reduces to the identity)" -- a hypothesis baked into the proof's own
        first sentence -- yet is invoked generally by
        controls.nearby_object_control and
        controls.rational_2_torsion_applicability for curves WITH
        nontrivial torsion, where the proof's own final step ("Sigma(b_i*Pi)
        is in E(Q)[2], hence O since E(Q)_tors={O}") does not go through
        (E(Q)[2] is not trivial for such curves, so the induction does not
        automatically terminate at the zero relation).
      chosen_repair: >-
        RESTRICT SCOPE EVERYWHERE, per DEC-20260831-fada1e R3's disjunctive
        option and matching red-team's own required_change option (b)
        exactly. The theorem
        "matrixRank - torsionRank = n implies the n points are
        Z-independent modulo torsion" IS PROVEN, IN THIS DOCUMENT AND ITS
        PREDECESSOR, ONLY FOR E(Q)_tors = {O}. This scope restriction is now
        stated as the theorem's ACTUAL hypothesis everywhere it is cited,
        not merely in the proof's opening line. Curve 302 itself has trivial
        torsion (frozen JSON, Stage-0-established per
        baseline_reproduction.torsion_determination, inherited unchanged),
        so the PRIMARY certificate path for curve 302's own Stage C run is
        entirely unaffected and remains fully proven as stated.
      downgraded_controls: >-
        controls.nearby_object_control and
        controls.rational_2_torsion_applicability (predecessor, inherited by
        reference) have their expected_outcome DOWNGRADED from a proven
        guarantee to a DESIGN-TIME PREDICTION PENDING A SEPARATE PROOF not
        supplied by this document or its predecessor. Concretely: the claim
        that "matrixRank - torsionRank equal to the declared count" is the
        mathematically CORRECT statement for a nontrivial-torsion curve is
        now labeled explicitly as UNPROVEN HERE (it would require re-running
        the minimal-counterexample induction in E(Q)/E(Q)_tors, or carrying
        torsion-generator rows explicitly through the same mod-2 argument --
        named as a FUTURE PROOF OBLIGATION, not attempted in this
        zero-execution repair, and NOT silently re-asserted as already
        established). Both controls are RETAINED in the design (they remain
        well-aimed at the intended failure mode, per red-team's own
        proves_too_much object_2 finding: "well-aimed but resting on an
        unproven generalization"), but any future run of them must report
        its outcome as evidence ABOUT the recipe's practical behavior on
        that test curve, never as a certified proof of the general theorem.
      closes: >-
        J2 finding_2 (the scope gap itself) and proves_too_much object_2
        (the DISSENT is closed by no longer claiming the rejection of the
        full-2-torsion null object is design-guaranteed; it remains a
        credible, disclosed prediction, matching red-team's own concurred
        weaker claim: "the control is aimed at the right failure mode and
        would likely surface the naive bug in practice").
      what_remains_open: >-
        The GENERAL (nonzero-torsion) form of
        matrix_rank_implies_independence_proof is not supplied by this
        repair and remains an explicit open proof obligation. It is not
        needed for curve 302's own primary certificate path (trivial
        torsion), only for the two auxiliary controls, whose downgrade
        above is the honest disposition until that proof exists.

    resolvent_cubic_identity:
      repair_diff_note: >-
        DIFF AGAINST protocol.object_first_analysis's and idea.claim's
        "Delta_E = 16*disc(resolvent cubic)... a standard identity" (lines
        ~205-210, ~279-280), and against
        baseline_reproduction.short_weierstrass_conversion.method's
        unresolved choice of conversion convention ("A, B exact rationals...
        or, after clearing denominators, integers up to a fixed scaling" --
        both options left open, lines ~854-865). J2 finding_1 showed the
        identity is exactly true under a TRANSLATION-ONLY conversion
        (Delta_E = 16*disc(h) exactly, no extra factor) but FALSE by a
        factor of 2^8*3^12 under the SCALED/integral c4,c6 convention
        (A=-27c4, B=-54c6), and the predecessor did not commit to which
        convention it meant, calling an ambiguous identity "standard".
      chosen_repair: >-
        COMMIT EXPLICITLY to the TRANSLATION-ONLY conversion:
        short_weierstrass_conversion is defined as completing the square
        via y' = y + (a1*x+a3)/2 (a pure shift, no scaling) followed by
        completing the cube via x'' = x' + b2/12 (again a pure shift),
        yielding A, B as exact rationals (NOT integers via an additional
        scaling step -- baseline_reproduction.short_weierstrass_conversion.
        method's second, scaled option is WITHDRAWN by this repair). Under
        this convention alone, Delta_E = 16*disc(h) holds EXACTLY for ANY
        a1,...,a6 (not merely as a curve-302-specific coincidence, and not
        merely for a1=a3=0): this is a DERIVATION, not an assertion of
        a "standard identity" -- the derivation is the one red-team
        performed by hand (report TASK-20260831-ea2561, joint_J2,
        finding_1.hand_derivation, reading (a)), reproduced here as this
        repair's own load-bearing justification rather than cited
        secondhand: translation changes no coordinate by a scale factor, so
        Delta is exactly invariant under it, and disc(h) for the resulting
        depressed cubic h(t) = t^3 + A*t + B equals Delta/16 by the standard
        cubic-discriminant formula disc(t^3+At+B) = -4A^3-27B^2 applied to
        the (translation-invariant) Delta = -16(4A^3+27B^2) identity for a
        curve already in short form.
      closes: >-
        J2 finding_1 in full. The identity is no longer asserted as
        "standard" without qualification; it is derived for the SPECIFIC,
        now-mandated conversion convention, removing the ambiguity red-team
        found, and the derivation holds generally (any a1,a3, not merely
        curve 302's coincidental case where the scaled convention's extra
        primes 2,3 already sit in bad_primes).
      what_remains_open: >-
        None for this specific identity; it is now a general, derived fact
        under the mandated convention. (Whether the ACTUAL third-party
        verifier at github.com/icarm/elliptic-rank uses the same
        translation-only convention remains part of the predecessor's
        already-disclosed, inherited-unchanged open item that verify.ts was
        never retrieved this program-wide; not reopened or narrowed by this
        repair.)

    reduction_map_precondition:
      repair_diff_note: >-
        DIFF AGAINST protocol.certificate_route.reduction_map and
        good_primes_and_preconditions (predecessor lines ~1269-1284), which
        required "p not divide either coordinate's denominator" as a
        precondition and treated a violation as a skipped (point, prime)
        pair requiring S' to be extended to route around it.
      chosen_repair: >-
        RESTATE THE PRECONDITION PER PROJECTIVE REDUCTION, adopting
        red-team's preferred (non-workaround) convention: for a point
        Pi = (x:y:1) in projective coordinates, reduction mod a good prime p
        is defined on ALL of E(Q) with no exceptions, by clearing Pi's
        coordinate triple to (X:Y:Z) with gcd of the three coordinates
        coprime to p (always possible by scaling, since the triple is
        defined only up to a common scalar), then reducing each coordinate
        mod p. If the resulting Z is 0 mod p (equivalently, p divides the
        denominators of both x and y in a way that forces the reduced point
        to the line at infinity), the image is O in E(F_p) -- a well-defined
        group-homomorphism value, not an undefined or skipped case. The row
        for that (point, prime) pair is then simply the ZERO VECTOR in
        E(F_p)/2E(F_p), not an omission.
      closes: >-
        J2 finding_3. good_primes_and_preconditions is correspondingly
        restated: it publishes, per run, which primes were used and why
        each was of good reduction, but no longer publishes "which (point,
        prime) pairs were skipped" -- there are none under this convention
        -- and the ad hoc "extending S' with an additional prime" workaround
        instruction is removed.
      what_remains_open: >-
        None; this is a closed, standard convention adopted in place of an
        ad hoc one, per red-team's own stated preference and its
        acknowledgment that the predecessor's workaround, while not fatal,
        was unproven per-run rather than derived.

  # ===========================================================================
  # REPAIR R4 (closes J3): positive-detection control on curve-302-scale
  # data whose success requires certifying a known new point.
  # ===========================================================================
  repair_r4_leave_one_out_ascent_battery:
    closes_finding: 'J3 (red-team, TASK-20260831-ea2561, DISSENT)'
    addresses_repair: 'R4 of DEC-20260831-fada1e'
    repair_diff_note: >-
      DIFF AGAINST protocol.controls (predecessor lines ~989-1107) as a
      CLOSED set. J3's finding_1 showed every one of the predecessor's five
      controls (null, both proves_too_much objects, positive, nearby_object)
      tests either "stays the same" or "matches a DIFFERENT curve's already-
      known value" -- none tests whether Stage C's pipeline, run on CURVE
      302's OWN data at CURVE 302's OWN coordinate/height scale (naive
      height up to ~468 natural-log units, per the frozen JSON), correctly
      ASCENDS matrixRank when a genuinely new independent point is added.
      J3 named the missing sibling control explicitly: "a control using a
      KNOWN, independently documented, GENUINELY Z-independent point ADDED
      to an already-certified basis, at a comparable scale to the target
      case, expecting matrixRank - torsionRank to correctly ASCEND." This
      repair adds exactly that control, constructed entirely from already-
      frozen curve-302 data (no new curve, no execution, no fabricated
      point).
    control_design_leave_one_out_ascent: >-
      For each index i in {1, ..., 31} (budget permitting; see
      budget_note), construct the REDUCED basis B_i = the 30 known points of
      curve 302 excluding Pi. Run the IDENTICAL Stage C certificate pipeline
      (certificate_route, inherited unchanged) on B_i alone: the EXPECTED,
      REQUIRED outcome is matrixRank - torsionRank = 30 exactly (this is
      itself a corollary of baseline_reproduction.rank31_baseline_
      certificate, inherited unchanged, which already establishes the full
      31-point set has matrixRank - torsionRank = 31; if the 31-point set is
      independent, every 30-point subset is independent too, a standard
      linear-algebra fact requiring no new proof). Then run the SAME
      pipeline on B_i union {Pi} (i.e. the full 31-point set, but computed
      FRESH from this reduced starting point rather than reusing the
      Stage-0 result): the REQUIRED outcome is matrixRank - torsionRank = 31
      -- an ASCENT from 30 to 31, on curve 302's OWN pipeline instance, at
      curve 302's OWN coordinate/height scale, using curve 302's OWN frozen
      prime list and reduction machinery. This directly satisfies
      DEC-20260831-fada1e R4's literal requirement: success of this control
      REQUIRES the pipeline to CERTIFY that Pi is a genuinely new
      independent point relative to B_i -- Pi is treated, for the purposes
      of this control, as an unknown candidate whose independence the
      pipeline must ITSELF detect and ascend on, with the ground truth to
      check the control's output against supplied independently by
      baseline_reproduction.rank31_baseline_certificate (Stage 0), not by
      this control circularly assuming its own answer.
    sibling_null: >-
      NAMED PER THE REPAIR'S REQUIREMENT: for the SAME reduced basis B_i,
      instead of adding back the genuine Pi, add back a KNOWN DEPENDENT
      point at the SAME scale -- reusing the predecessor's own
      proves_too_much construction pattern but applied to the 30-point
      basis rather than the 31-point one: Q_i := -Pi (or, equivalently,
      any fixed Z-linear combination of B_i's own 30 points). The REQUIRED
      outcome is matrixRank - torsionRank STAYS at 30 (no ascent), by the
      SAME group-homomorphism argument the predecessor's null_control and
      proves_too_much controls already established (phi(-P) = phi(P) in an
      F2-target, so Q_i's row duplicates an existing row or is a linear
      combination of existing rows, exactly as in the original 31-point
      case). Run in the SAME session, on the SAME reduced basis, immediately
      alongside the positive leave-one-out test above, this sibling null
      brackets the failure mode the positive test alone cannot rule out: an
      implementation that ALWAYS increments matrixRank regardless of input
      (spuriously ascending even on a dependent point) would PASS the
      positive ascent test but FAIL this sibling null; an implementation
      that NEVER increments matrixRank beyond its Stage-0 baseline (the
      "permanently-stuck-at-31"-style bug J3 named, here manifesting as
      "permanently-stuck-at-30") would PASS this sibling null but FAIL the
      positive ascent test. Neither bug can pass both members of the pair,
      which is exactly the property J3's finding_1 showed the predecessor's
      five controls, individually or jointly, did not guarantee for THIS
      pipeline instance at THIS scale.
    why_this_closes_j3: >-
      J3's breaking_artifact was a degenerate implementation that "always
      reports matrixRank = (number of points in the frozen 31-point
      baseline) and NEVER increases regardless of what is appended", which
      J3 showed would PASS all five predecessor controls. That exact
      degenerate implementation FAILS the positive leave-one-out ascent
      test above (it would report matrixRank=30 for B_i union {Pi}, not the
      required 31, since the bug is defined by never exceeding a cap tied to
      the ORIGINAL 31-point run, and B_i union {Pi} being re-computed fresh
      from a 30-point start would not hit that cap under the described bug
      mechanism, or if it did, it would fail to show the required ascent
      either way) -- either way, the specific failure mode J3 named is now
      caught by a control run on curve 302's own instance, closing the gap.
    budget_note: >-
      Cost is O(31) reruns of the ALREADY-NEGLIGIBLE Stage C pipeline
      (budgets_and_stops.stage_c_certificate_assembly, inherited unchanged,
      already estimates "under a few CPU-minutes" per single run), so
      running the FULL battery of 31 leave-one-out pairs (62 pipeline runs:
      31 positive-ascent plus 31 sibling-null) is itself negligible relative
      to Stage A's cost and is RECOMMENDED to run in full rather than a
      sampled subset, since a single failing i among 31 would already be
      diagnostic. If a future Coordinator budget constrains this, a
      declared minimum of at least 3 distinct i values (not adaptively
      chosen after seeing partial results, per the program's own
      quantifier_order discipline inherited from
      IDEA-20260829-c705b4/07fd5f) is the floor below which this control's
      diagnostic value is not asserted.
    what_remains_open: >-
      This control closes the CERTIFICATION ascent-detection gap only: it
      demonstrates the pipeline can correctly recognize and ascend on an
      ALREADY-KNOWN point at curve-302 scale. It does NOT test, and this
      document does not claim it tests, whether Stage B's SEARCH mechanism
      would ever LOCATE a genuinely new candidate point at comparable height
      in the first place -- that gap (Stage B's disclosed low expected power
      at curve 302's actual height scale, per protocol.interpretation_limits,
      inherited unchanged) remains fully OPEN and is explicitly not
      conflated with what this repair closes.

  # ===========================================================================
  # Decision-rule integrity: the independently corroborated two-sided rule
  # is kept intact.
  # ===========================================================================
  decision_rule_integrity:
    statement: >-
      READING (a) and READING (b) of the predecessor's idea.claim (lines
      ~287-301) are LOGICALLY UNCHANGED by every repair above: IF dim
      Sel_2(E) is known EXACTLY to equal 31, rank(E) = 31 exactly and
      unconditionally (no 32nd point, ever, on this curve); IF dim Sel_2(E)
      is known EXACTLY to be >= 32, a bounded search (Stage B) is licensed
      but not guaranteed. This is exactly the abstract implication the
      validator's J1 report CONCURRED is "the correct, unconditional
      consequence of the exact sequence given trivial torsion and the
      certified rank >= 31 floor" (TASK-20260831-234e80, joint_J1,
      part_1_exact_sequence_rederivation), and exactly what the blind
      re-derivation (TASK-20260831-46a7e5, per DEC-20260831-fada1e's
      review_round_provenance) independently corroborated as unconditional
      in both readings, no conjecture load-bearing.
    what_changed_is_reachability_not_the_rule: >-
      Repairs R1-R4 change ONLY the conditions under which each reading is
      actually REACHABLE, never the rule itself: repair_r1 makes explicit
      that READING (a) closure requires the FULL, EXACT Stage A'.2
      computation (which may be infeasible at curve 302's scale, per
      feasibility_finding_stated_plainly), and that the honest fallback
      Stage A'.3 can license READING (b)'s search half but never READING
      (a)'s closure half; repair_r2 corrects an arithmetic input to that
      same computation; repair_r3 narrows the certificate route's PROVEN
      scope (trivial torsion) without touching the decision rule at all
      (the certificate route is downstream of Stage A entirely); repair_r4
      adds a detection control without touching the rule.
    no_reading_is_assumed: >-
      Exactly as the predecessor stated, neither reading is assumed before
      Stage A' runs; this successor design changes nothing about that
      posture.

  # ===========================================================================
  # Closure table: which finding each repair closes, and what remains open.
  # ===========================================================================
  closure_table:
    - repair: R1
      closes_finding: J1
      status: closed_at_design_level
      residual_open_item: >-
        Feasibility of Stage A'.1 (class-group/S-unit generating-set
        computation) at curve 302's real scale is undetermined without
        execution; expected infeasible per honest_cost_model, never
        asserted as proven infeasible.
    - repair: R2
      closes_finding: J4
      status: closed_fully
      residual_open_item: none
    - repair: R3
      closes_finding: >-
        J2 (all three findings) and proves_too_much object_2
      status: closed_at_design_level
      residual_open_item: >-
        The general (nonzero-torsion) form of the halving-induction theorem
        remains an open proof obligation, deferred, affecting only the two
        downgraded auxiliary controls, not curve 302's own primary
        certificate path.
    - repair: R4
      closes_finding: J3
      status: closed_at_design_level
      residual_open_item: >-
        Stage B's search-power gap at curve 302's actual height scale
        remains open and undisturbed by this repair; this control closes
        certification-ascent detection only, not search power.

  # ===========================================================================
  # Zero-execution and model-provenance attestation.
  # ===========================================================================
  zero_execution_attestation:
    commands_executed: 0
    computer_algebra_used: false
    verifier_or_solver_runs: 0
    bash_tool_invocations: 0
    method: >-
      Read (on the files listed in task_context.inputs_read) and Write (on
      this file and task-report.yaml, both inside write_scope) only. Every
      arithmetic and algebraic claim above (the S-unit dimension formula,
      the translation-only resolvent-cubic identity, the leave-one-out
      subset independence corollary, the order-of-magnitude class-group
      cost estimate) was derived or cited by hand/symbolic reasoning in this
      session, never executed on a machine or a computer-algebra system.
      The Bash tool was not invoked at any point in this task, including for
      timestamping, to avoid any ambiguity about whether that counts as the
      hard rule's "command execution."
  inference_provenance:
    requested_policy: research-deep
    requested_reasoning_effort: high
    resolved_model: >-
      Claude Sonnet 5 (model ID claude-sonnet-5), running as the top-level
      Claude Code session dispatched directly against this task's handoff
      (per CLAUDE.md, subagent frontmatter effort binds only when a
      materialized .claude/agents/idea-generator.md subagent runs within an
      orchestrating session; this task ran as a direct top-level session).
    reasoning_effort_dial_disclosure: >-
      DISCLOSED, NOT SILENTLY SUBSTITUTED, matching the disclosure pattern
      both reviewed reports (TASK-20260831-234e80, TASK-20260831-ea2561)
      already established for this exact gap: Claude Code binds `effort:`
      only in per-subagent frontmatter; it exposes no reasoning-effort
      parameter at the top-level session layer this task actually ran at.
      No `effort: high` configuration was or could be applied to this
      session by this runtime. This is recorded as a capability gap of the
      runtime layer this task ran at, not a downgrade this session chose.
    fallback_used: false
    degraded_requirements:
      - reasoning_effort_dial_unavailable_at_top_level_session_layer
    model_verified: false
    model_verified_note: >-
      Self-reported model identity per this runtime's own system
      identification; not probe-verified against orchestration/adapter
      doctor.
