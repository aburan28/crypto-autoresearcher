    operative_rewrite: >-
      REPLACES protocol.proof_search_map.method_ceiling.nearby_object_control
      (protocol-v1 lines 531-542) verbatim, in place, at the third location
      protocol-v2's supersession_map named but never reached. NEW TEXT: "A
      curve WITH nontrivial rational 2-torsion (unlike curve 302, whose
      torsion is trivial per the frozen JSON), run through the IDENTICAL
      Stage C pipeline with a small independent point set plus the torsion
      generator. If the pipeline naively computed matrixRank alone (without
      correctly identifying and subtracting torsionRank), it would OVERCLAIM
      independence by including the torsion point as if it contributed to
      the rank. UNLIKE THE ORIGINAL (protocol-v1) STATEMENT OF THIS CONTROL,
      the corrected computation's conclusion -- matrixRank - torsionRank =
      declared point count -- is NOT asserted here as a proven, design-
      guaranteed outcome for a curve with nontrivial torsion. Per
      protocol-v2.repair_r3_certificate_route_soundness.halving_induction_scope,
      certificate_route.matrix_rank_implies_independence_proof is proven, in
      this document chain, ONLY for E(Q)_tors = {O}; the general
      (nonzero-torsion) form of that theorem remains an explicit OPEN PROOF
      OBLIGATION (protocol-v2 repair_r3.halving_induction_scope.what_remains_open),
      not attempted anywhere in this repair chain. This control's expected
      outcome is therefore a DESIGN-TIME PREDICTION PENDING A SEPARATE
      PROOF, identical in epistemic status to
      protocol-v2's controls.nearby_object_control and
      controls.rational_2_torsion_applicability (both already correctly
      downgraded), NOT a design-guaranteed rejection of the naive bug. A
      future run of this control must report its outcome as evidence about
      the recipe's practical behavior on that test curve, never as a
      certified proof of the general theorem -- exactly the same disposition
      protocol-v2 already applied to the other two locations. This remains
      simultaneously the method_ceiling's nearby-object control and the
      rational_2_torsion_applicability control; all three locations now
      share this one downgraded status, with no location left asserting the
      unscoped guarantee."
