      outside its now-stated scope" surviving at one location the document's
      own bookkeeping claimed to have closed. This repair removes that
      surviving use by rewriting the location's operative text in place,
      not merely re-annotating it, so no location in the combined document
      (protocol-v1 as amended by protocol-v2 as amended by this document)
