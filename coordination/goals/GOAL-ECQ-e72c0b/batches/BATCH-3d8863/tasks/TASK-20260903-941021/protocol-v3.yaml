  # ===========================================================================
  # REPAIR R2b (closes J3R sibling_null_half / DEC-20260831-6d4a85 R2b):
  # replace the degenerate sibling null with a genuinely dependent row.
  # ===========================================================================
  repair_r2b_sibling_null_replacement:
    closes_finding: >-
      J3R sibling_null_half_DISSENT_worked_attack (red-team,
      TASK-20260831-b36a44, joint_J3R); equivalently R2b of
      DEC-20260831-6d4a85 / required_next_repairs entry 2.
    repair_diff_note: >-
      DIFF AGAINST protocol-v2.repair_r4_leave_one_out_ascent_battery.sibling_null
      in full. protocol-v2 specified "Q_i := -Pi (or, equivalently, any
      fixed Z-linear combination of B_i's own 30 points)", added to the
      reduced basis B_i (the 30 known points excluding Pi), with required
      outcome "STAYS at 30". Red-team's J3R hand-derivation showed this is
      FALSE: since the full 31-point set has rank exactly 31 (Stage-0
      baseline, uncontested), Psi(Pi) is NOT in the F2-span of {Psi(Pj) : j
      != i} = B_i's own rows (if it were, the full 31-row set would have
      rank <= 30, contradicting Stage-0). Because Psi(-Pi) = Psi(Pi)
      identically (the same order-2 F2-vector-space fact the original
      null_control already established), appending Q_i = -Pi to B_i appends
      EXACTLY the row Psi(Pi) -- numerically identical to the positive
      ascent test's own appended row -- which a CORRECT implementation must
      therefore ASCEND on, not hold at 30. The two halves become
      indistinguishable, giving the pair zero discriminating power: an
      always-ascends bug would PASS BOTH, exactly the failure mode the pair
      was introduced to rule out. protocol-v2's own parenthetical
      ("equivalently, any fixed Z-linear combination of B_i's own 30
      points") was the tell -- -Pi is presented as such a combination but
      demonstrably is not one, since Pi is excluded from B_i by the
      leave-one-out construction itself. This repair replaces the
      construction with one that IS genuinely such a combination.
    corrected_sibling_null_construction: >-
      FOR EACH i in {1, ..., 31} (matching control_design_leave_one_out_ascent's
      own index range, inherited unchanged), define j(i) as the smallest
      index in {1, ..., 31} \ {i} (i.e. the smallest-indexed point still
      present in B_i; well-defined for every i since B_i always has 30
      elements). Define Q_i := 2 * P_{j(i)}, using curve 302's own frozen
      point P_{j(i)} (already an element of B_i) and the SAME group-law
      doubling operation certificate_route already performs elsewhere in
      this design chain (baseline_reproduction, inherited unchanged; no new
      operation is introduced). Append Q_i to B_i (NOT to B_i union {Pi} --
      this sibling null, like protocol-v2's, is run on the reduced basis
      alone, immediately alongside the positive ascent test, per
      protocol-v2's unchanged budget_note). REQUIRED outcome: matrixRank -
      torsionRank STAYS AT 30 (no ascent) -- while the MATRIX ITSELF
      CHANGES, since Q_i = 2*P_{j(i)} is, as an integer/rational point of
      E(Q), a genuinely different point from every point already in B_i for
      any curve where P_{j(i)} is not itself 2-torsion (curve 302 has
      trivial torsion, so 2*P_{j(i)} != any P_k for k in B_i's index set,
      unconditionally on curve 302 specifically) -- so this is NOT the
      weaker, trivially-duplicate-row test "add a point already literally
      present in B_i" (e.g. Q_i := P_k for some k != i), which a naive
      always-duplicate-detecting implementation could pass by string/object
      equality alone without exercising the pipeline's actual F2-reduction
      arithmetic; Q_i is a distinct point whose ROW happens to vanish.
    halving_condition_for_the_divisibility_lemma: >-
      STATED EXPLICITLY, PER THE HANDOFF'S REQUIREMENT. Psi (the map from
      E(Q) into the F2-vector space whose images form the matrix's rows,
      per certificate_route, inherited unchanged) has target an F2-VECTOR
      SPACE, in which 2*v = 0 for every element v (the defining property of
      characteristic-2 arithmetic: v + v = 0). Since Psi is a group
      homomorphism (the same homomorphism property
      protocol-v2.repair_r4_leave_one_out_ascent_battery.sibling_null
      already invoked for Psi(-P)=Psi(P), and the same property
      certificate_route.matrix_rank_implies_independence_proof's
      halving-induction argument is itself built on), Psi(2*P) = 2*Psi(P) =
      0 for EVERY point P in E(Q), UNCONDITIONALLY -- independent of which
      point is doubled, independent of that point's own independence status
      relative to any basis, and independent of curve 302's specific
      arithmetic. This is THE DIVISIBILITY LEMMA the halving-induction
      argument's own base case rests on (a point in 2E(Q) is, by
      construction, invisible to Psi -- exactly the fact
      matrix_rank_implies_independence_proof's induction uses to force a
      minimal-counterexample relation down to the identity one halving step
      at a time, inherited unchanged from protocol-v1/protocol-v2). Because
      Q_i = 2*P_{j(i)} is IN 2E(Q) by construction (it is twice a rational
      point), Psi(Q_i) = 0 -- THE ZERO VECTOR, not merely some row in the
      span of B_i's rows, but literally the all-zero row. Appending an
      all-zero row to any matrix leaves its rank unchanged, by ordinary
      linear algebra with no dependence on B_i's specific entries: this is
      the SAME all-zero-row argument protocol-v1's own
      controls.proves_too_much.P32_equals_2_times_P1 (inherited unchanged
      throughout this entire repair chain) already used for the original
      31-point basis, now correctly re-applied to the 30-point reduced
      basis B_i instead of being conflated with the -Pi construction that
      does not share this property.
    why_this_correctly_brackets: >-
      An "always-ascends" bug (reports matrixRank incremented regardless of
      what is appended) FAILS this corrected sibling null: it would report
      31 for B_i union {Q_i} when the required, provably-correct outcome is
      30, since Psi(Q_i)=0 unconditionally regardless of implementation
      correctness elsewhere. A "stuck" bug (never increments beyond a
      cached baseline) FAILS the positive ascent test (never reaching 31 on
      B_i union {Pi}) while spuriously PASSING this sibling null (correctly,
      if accidentally, reporting no change) -- exactly the intended
      asymmetric bracketing repair_r4's why_this_closes_j3 (inherited
      unchanged) already argued for, now actually achieved: neither bug
      passes both members of the pair, because the pair's two appended rows
      are now genuinely different (Psi(Pi), independent and nonzero, versus
      Psi(Q_i)=0, dependent and literally zero) rather than accidentally
      identical as protocol-v2's construction made them.
    what_remains_open: >-
      UNCHANGED from protocol-v2.repair_r4_leave_one_out_ascent_battery.what_remains_open:
      this control closes the CERTIFICATION ascent-detection gap only
      (positive half: correctly ascends on a genuinely new independent
      point; corrected sibling null: correctly holds on a genuinely
      dependent point). It does not test, and this document does not claim
      it tests, whether Stage B's SEARCH mechanism would ever LOCATE a
      genuinely new candidate point at comparable height in the first
      place; that gap remains fully open.

