  revisions_made_per_finding:
    - revision: R2a
      finding_closed: >-
        J2R subfinding_3_halving_induction_scope_INCOMPLETE_DISSENT
        (red-team, TASK-20260831-b36a44, joint_J2R), and, jointly, the
        residual narrowing of proves_too_much object_2 that names the same
