      repair_diff_note_summary: >-
        protocol-v2's own supersession_map named
        proof_search_map.method_ceiling.nearby_object_control (protocol-v1
        lines 531-542) as superseded by repair_r3.halving_induction_scope,
        but repair_r3's operative text (downgraded_controls) only actually
        rewrote two of the three locations it claimed to cover, leaving
        this third location standing verbatim with an unscoped guarantee
        (by contraposition of its own sentence). protocol-v3 performs the
        supersession protocol-v2 already claimed: it rewrites this location
        in place to the same "design-time prediction pending a separate
        proof" status already correctly applied elsewhere, closing both the
        bookkeeping/text mismatch and the resulting proves_too_much
        object_2 residual.
      status: closed_at_design_level
    - revision: R2b
      finding_closed: >-
        J3R sibling_null_half_DISSENT_worked_attack (red-team,
        TASK-20260831-b36a44, joint_J3R).
      repair_diff_note_summary: >-
        protocol-v2's leave-one-out sibling null used Q_i := -Pi added to
        the reduced basis B_i (Pi excluded). Because the full 31-point set
        has rank exactly 31 (Stage-0 baseline), Psi(Pi) is provably
        independent of B_i's own rows, so Psi(-Pi)=Psi(Pi) makes the
        "sibling null" numerically identical to the positive ascent test --
        zero discriminating power. protocol-v3 replaces the construction
        with Q_i := 2*P_{j(i)} for P_{j(i)} already in B_i, using the
        halving/divisibility lemma (Psi is F2-valued and a homomorphism, so
        Psi(2P)=0 identically for every P, unconditionally) to guarantee an
        all-zero appended row -- provably no ascent, while still appending
        a genuinely distinct rational point (not a literal duplicate row),
        restoring the pair's intended bracketing of the always-ascends and
        stuck-never-ascends failure modes.
      status: closed_at_design_level
    - revision: R2c
      finding_closed: >-
        J4R discriminant_figure_fidelity_check (validator,
        TASK-20260831-e24039, joint_J4R).
      repair_diff_note_summary: >-
        protocol-v2's feasibility passage stated three mutually inconsistent
        size figures for the frozen discriminant-derived quantity (~204
        decimal digits / on the order of 10^200 / ~664-bit). protocol-v3
        hand-recounts the frozen discriminant string directly (two
        independent chunking passes, cross-checked, converging on 197
        decimal digits after catching and correcting a transcription slip
        mid-pass) and restates ONE internally consistent set: 197 decimal
        digits, magnitude on the order of 10^196, bit-length ~653-654 bits
        (derived arithmetically from the recounted digit count via the
        standard d*log2(10) conversion, not independently hand-counted).
        repair_r1's qualitative feasibility conclusion (cryptographic-scale,
        likely-infeasible-with-known-algorithms, disclosed as a design-time
        estimate never a proven or measured result) is explicitly stated to
        survive this correction unchanged.
      status: closed_fully

