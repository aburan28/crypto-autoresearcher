  # ===========================================================================
  # Object-first generation (docs/inventor-protocol.md section 1;
  # KN-TECH-056). This sibling goal-area (Mordell-Weil rank over Q) is
  # mined by two established families already active in this program.
  # ===========================================================================
  object_first_analysis:
    established_families_declared_off_limits:
      - name: elliptic-surface / Mestre-Nagao specialisation search
        source: GOAL-ECQ-001 (closed), GOAL-ECQ-002 (closed_at_budget)
        description: >-
          Constructs a high-generic-rank elliptic surface over Q(t) (a
          rational elliptic surface bounded by Shioda-Tate at 10d-2, or a
          Mestre quartic construction), sieves specialisations t by a
          Mestre-Nagao score, and 2-descent-certifies the best-scoring
          fibres. Tracked object: the specialisation parameter t and the
          curve family's generic Mordell-Weil rank. Best certified so far in
          this program: rank 12-13 over Q, against the frozen baseline's
          rank >= 31.
        why_off_limits_here: >-
          This protocol does not construct any new curve or family. It
          starts from ONE frozen, already-rank->=31 equation (curve 302) and
          asks only whether that SAME equation admits a 32nd independent
          point. Family search is a materially different tracked object and
          would not extend curve 302 itself; it is excluded as the primary
          lens by design, not by oversight.
      - name: number-field degree reduction / base-field search
        source: GOAL-ECRANK-001 (completed), GOAL-ECRANK-002
        description: >-
          Holds a curve fixed (or nearly so) and searches over number fields
          K of varying degree for rank(E(K)) >= target, using multiquadratic
          twists and field-degree bookkeeping. GOAL-ECRANK-001 explicitly
          scopes rank >= 31 OVER Q as excluded and unreachable by its own
          method.
        why_off_limits_here: >-
          This protocol stays over Q throughout (the goal's literal target).
          No base-field search of any kind appears in any stage below.
      - name: geometric-rank / Galois-module isotypic-decomposition search
        source: >-
          GOAL-ECQ-2298dc (blocked) and its sibling ideas
          (IDEA-20260829-ece95f, IDEA-20260829-de0a52, IDEA-20260829-073172)
        description: >-
          Reads generic rank over Q(t) off the Galois-module structure of a
          high-geometric-rank surface's Mordell-Weil space, or infers the
          base rank behind the record ladder from indirect statistical or
          height-lattice signals, without exhibiting a curve.
        why_off_limits_here: >-
          These target the QUESTION "what family produced the record ladder"
          and explicitly disclaim exhibiting any curve or point
          (IDEA-20260829-02418a: "This measures the RECORD's structure...
          not progress toward GOAL-ECQ-e72c0b's completion criteria").
          This protocol's object is deliberately narrower and more concrete:
          decide and, if warranted, exhibit a 32nd point on ONE fixed curve.
    candidate_objects_considered:
      - object: >-
          The candidate 32nd point P32 itself, as a naive-height-bounded
          rational point (x, y) on the fixed curve 302.
        genuinely_new_or_repackaging: >-
          Repackaging. This is exactly the classical "search for a rational
          point of bounded height" object every 2-descent/point-search tool
          already tracks. Its lossy-projection test technically passes (a
          height-bounded search box discards the curve's group structure and
          everything about points outside the box) but the object gives no
          traction: curve 302's KNOWN points already have naive heights up
          to ~468 (natural-log units, per the frozen JSON's naive_height
          field), and DEC-20260824-b7557b lane L1 (cited via
          IDEA-20260829-073172) already measured that an x-coordinate
          enumeration reaching only 8 decimal digits against curve 302's
          exhibited ~33-digit numerators covers 0 of a 95,899,629-candidate
          box -- a documented dead end for naive enumeration at this scale.
        concretely_testable: yes, but at prohibitive and unbounded cost --
          see search_boundary below.
        how_far_it_survives: >-
          Does not survive past a feasibility check: unbounded naive height
          search cannot be made finite without an independent argument for
          WHERE to look, which is exactly what the next object supplies.
        verdict: rejected as the PRIMARY search lens; retained only as the
          final verification step once Stage A/B below narrow the search.
      - object: >-
          The 2-Selmer class of curve 302: its image under the connecting
          homomorphism E(Q)/2E(Q) -> Sel_2(E) subset of a finite F2-vector
          space H indexed by local solubility conditions at a
          DETERMINISTICALLY FIXED finite prime set S.
        genuinely_new_or_repackaging: >-
          Adaptation, not new mathematics (classical 2-descent, Silverman
          AEC X.4; the underlying exact sequence
          0 -> E(Q)/2E(Q) -> Sel_2(E) -> Sha(E)[2] -> 0 is textbook). What is
          new to THIS program is using it as a decisive PRE-SEARCH GATE for
          this exact completion criterion: no committed record in this
          program's corpus (grepped this session; see novelty_status below)
          computes an exact Selmer-rank UPPER bound on any candidate rank-31
          curve before attempting a point search. IDEA-20260829-c705b4
          builds a related but distinct F2-reduction instrument (reduction
          mod good primes into E(F_p)/2E(F_p)) that is explicitly a
          LOWER-bound-only certificate on a GIVEN point set -- it "certifies
          points it is given and finds none" (its own interpretation_limits).
          The Selmer computation is the complementary UPPER-bound half that
          record does not attempt.
        lossy_projection_test: >-
          PASSES. The projection discards the curve's coordinates, its
          Mordell-Weil group, every point's height, and every point outside
          the descent map's kernel structure, retaining only a vector of
          |S| local-solubility bits. What it discards is discarded
          COMPATIBLY with the target's operations: the connecting
          homomorphism phi is a group homomorphism (phi(P+Q) = phi(P) o
          phi(Q) in the F2-vector-space picture, phi(2P) = 0 identically by
          construction), so addition and doubling propagate deterministically
          through the retained data alone. It is NOT a change of coordinates:
          from the Selmer class alone one cannot recover a point, a
          coordinate, or even whether a given class is realized by an actual
          rational point (that gap is exactly Sha(E)[2], and is the method's
          honest ceiling, stated in method_ceiling below).
        concretely_testable: >-
          Yes -- a finite, deterministic enumeration over F2^|S| local
          conditions, |S| bounded by the 20 listed bad primes of curve 302
          plus 2 (see search_boundary; the resolvent-cubic discriminant
          introduces no NEW primes beyond bad_primes(Delta_E), a standard
          fact restated in baseline_reproduction).
        how_far_it_survives: >-
          Survives to a genuine DECISIVE two-outcome test (see search_boundary
          Stage A): either dim Sel_2(E) = 31 exactly, which UNCONDITIONALLY
          proves rank(E) = 31 exactly (killing the extension on curve 302
          specifically, forever, with a named mechanism), or dim Sel_2(E) >=
          32, which licenses (but does not guarantee, because of possible
          Sha) a bounded search for an actual witness. This is the object
          this protocol is actually built around.
        verdict: ADOPTED as Stage A's tracked object.
      - object: >-
          Short vectors of the rank-3 "near-solution" lattice attached to a
          box on the real curve (Elkies' ANTS-IV linearisation lattice).
        genuinely_new_or_repackaging: >-
          Adaptation -- IDEA-20260829-07fd5f already proposes exactly this
          object for this program, unexecuted, targeting different curves
          (the in-repo rank-12 curve's non-section points and 20 of the
          censored Mestre fibres), not curve 302.
        lossy_projection_test: >-
          PASSES, per that record's own analysis (cited verbatim there):
          discards the group law entirely, retains only a box's linear
          approximation data, propagates deterministically under box
          refinement.
        concretely_testable: yes, but ONLY as the second half of a two-stage
          pipeline (see search_boundary Stage B); by itself it has no finite
          halting condition on a curve whose existing points already reach
          height ~468.
        how_far_it_survives: >-
          Survives as Stage B's engine, gated by Stage A's outcome, with an
          honestly low expected power at curve 302's actual height scale
          (interpretation_limits below).
        verdict: ADOPTED as Stage B's search engine, credited to
          IDEA-20260829-07fd5f rather than re-derived here.
      - object: >-
          Reduction of each point into E(F_p)/2E(F_p) over good primes p,
          stacked as rows of an exact F2 matrix (IDEA-20260829-c705b4's
          tracked object).
        genuinely_new_or_repackaging: adaptation; not re-derived here, cited
          and adopted verbatim as Stage C's certificate instrument.
        lossy_projection_test: PASSES per that record's own analysis.
        concretely_testable: yes, unexecuted in this program to date.
        how_far_it_survives: >-
          Survives to exactly what that record's own method_ceiling states:
          an unconditional LOWER bound on independence of a GIVEN point set,
          never an existence proof and never an upper bound. That asymmetry
          is why Stage A (an upper-bound tool) is a necessary complement,
          not a redundant addition.
        verdict: ADOPTED as Stage C's certificate instrument.

