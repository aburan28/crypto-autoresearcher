        verified_by: idea-generator session 2026-08-30; full record read at
          ledger/proposals/IDEA-20260829-02418a.yaml
      - ref: GOAL-ECQ-e72c0b
        provenance: internal
        claim: >-
          Completion criteria verbatim (exact discriminant nonsingularity,
          32 exact on-curve points, unconditional independence certificate
          with published F2 matrix, exact torsion determination, and the
          exclusion of BSD/GRH/analytic rank/floating regulator/timeout as
