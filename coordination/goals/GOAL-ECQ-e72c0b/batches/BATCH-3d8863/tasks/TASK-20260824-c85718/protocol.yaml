protocol:
  protocol_id: PROTO-ECQ-e72c0b-c85718
  title: >-
    A finite, unconditional, two-stage decision-and-certification protocol for
    extending frozen ICARM curve 302 (exact rank >= 31 lower bound) to a
    certified rank >= 32, or for closing that specific extension with a named
    exact obstruction
  status: design_only_zero_execution
  experiments_run: 0
