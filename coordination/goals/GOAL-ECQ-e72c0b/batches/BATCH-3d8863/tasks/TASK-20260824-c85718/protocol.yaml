  # ===========================================================================
  idea:
    id: PROTO-ECQ-e72c0b-c85718
    title: >-
      Selmer-gated point search and F2-reduction certification for a 32nd
      independent point on frozen ICARM curve 302
    class: composition
    claim: >-
      EXACT, TWO-SIDED, PRE-DECLARED. Let E be the exact curve given by
      ainvs (a1,a2,a3,a4,a6) = ("1","1","1",
      "-1284727764113567728281797636015784768866707681415849262157224232063",
      "560368321454261339256859338901915312332769858684945406858043869199456710681989058863306170127006181"),
      the frozen ICARM curve 302, with the frozen discriminant
      56986667162894850943626331069759320443067423220527305082244725946223212417010574363800489149279120357391198820328667683955054948591887684940751932057558936585975074155693048247805850350226862080000
      (all verbatim from the frozen JSON, response_sha256
      2bd422f34d0566f79c53f6bc94c6ec5f9ff048cd88fcc300f53e0b397af2e67b) and 31
      exhibited rational points already independently reproduced in Stage 0
      before Stage A begins. Compute S = {2} union {primes dividing
      Delta(E)} (a finite, deterministic set of at most 21 primes -- 20
      listed bad primes plus 2) and the exact 2-Selmer rank dim Sel_2(E) via
      a finite deterministic local-solubility enumeration over the full
      2-descent space L(S,2) of the etale cubic algebra
      L = Q[t]/(resolvent cubic) (see search_boundary Stage A; NOT the
      2-isogeny space Q(S,2), which curve 302's trivial rational 2-torsion
      rules out).
      READING (a): if dim Sel_2(E) = 31 exactly (matching E(Q)_tors[2] = 0,
      independently established), then rank(E) = 31 EXACTLY and
      UNCONDITIONALLY (via the exact sequence 0 -> E(Q)/2E(Q) -> Sel_2(E) ->
      Sha(E)[2] -> 0, which needs no heuristic), and NO 32nd independent
      point exists on this exact curve -- this closes the extension of
      curve 302 specifically, with a named, checkable mechanism, forever.
      READING (b): if dim Sel_2(E) >= 32, a bounded, finite, deterministic
      point search (Stage B) is licensed but NOT guaranteed to succeed
      (Sha(E)[2] may be nonzero, or the witness height may exceed the
      declared search box); a positive witness is certified in Stage C by
      an exact, unconditional F2-reduction independence matrix over 32
      points (31 known plus the candidate), matrixRank - torsionRank = 32,
      torsionRank = 0 (given E(Q)_tors = {} already established). Both
      readings are pre-declared, both are informative, and neither is
      assumed before Stage A runs.
    mechanism: >-
      Two exact, textbook facts compose. (1) The connecting homomorphism of
      2-descent phi: E(Q) -> H (a finite F2-vector space built from local
      conditions at S) has kernel exactly 2E(Q), giving the exact sequence
      0 -> E(Q)/2E(Q) -> Sel_2(E) -> Sha(E)[2] -> 0; since Sha(E)[2] has
      F2-dimension >= 0 always, dim(E(Q)/2E(Q)) <= dim Sel_2(E)
      UNCONDITIONALLY, and since E(Q)_tors is trivial (Stage 0),
      dim(E(Q)/2E(Q)) = rank(E) exactly, so rank(E) <= dim Sel_2(E) always,
      with equality forced when dim Sel_2(E) equals the already-certified
      lower bound 31. (2) Given a candidate 32-point set (31 known plus one
      candidate), the reduction homomorphism at each good prime p induces
      E(Q)/2E(Q) -> E(F_p)/2E(F_p); stacking these over a frozen prime list
      gives an exact F2 matrix whose rank, by a halving induction on the
      minimal counterexample coefficient (identical in shape to
      IDEA-20260829-c705b4's soundness argument, re-derived independently
      here rather than imported uncritically), certifies Z-independence
      modulo torsion when full rank is attained. Composing (1) before (2)
      converts an otherwise unbounded search into a two-outcome decision
      procedure: (1) decides whether search is worth attempting at all, (2)
      certifies a witness if search succeeds.
    novelty_status: adaptation
    citations:
      - ref: IDEA-20260829-c705b4
        provenance: internal
        claim: >-
          Proposes and fully specifies (unexecuted) the F2-reduction
          independence-certificate instrument this protocol's Stage C
          adopts verbatim as its certificate engine, including its own
          proposed reproduction of matrixRank=31 on curve 302's known 31
          points as a "third_party_witness_reproduction" prediction --
          exactly this protocol's Stage 0 obligation. Also states the
          instrument's ceiling precisely: "A MATRIX RANK IS A LOWER BOUND,
          NEVER AN EXACT RANK AND NEVER AN UPPER BOUND", which is the exact
          gap Stage A (Selmer computation) exists to fill.
        verified_by: idea-generator session 2026-08-30; full record read at
          ledger/proposals/IDEA-20260829-c705b4.yaml
      - ref: IDEA-20260829-07fd5f
        provenance: internal
        claim: >-
          Proposes and fully specifies (unexecuted) an Elkies-ANTS-IV
          lattice-reduction point-search instrument with a measured cost
          exponent alpha, targeted at different curves (in-repo rank-12
          curve, 20 censored Mestre fibres), NOT at curve 302. This
          protocol's Stage B adopts its search engine and box-lattice
          object rather than re-deriving one, and explicitly does not
          duplicate its target curves.
        verified_by: idea-generator session 2026-08-30; full record read at
          ledger/proposals/IDEA-20260829-07fd5f.yaml
      - ref: IDEA-20260829-02418a
        provenance: internal
        claim: >-
          A complementary, distinct-projection proposal (height-lattice
          isometry forensics) on the SAME frozen curve-302 input file,
          explicitly disclaiming any point exhibition or rank claim. Cited
          to show this protocol does not duplicate it: that record discards
