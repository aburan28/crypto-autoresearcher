  # ===========================================================================
  # 9. Pareto honesty. Required by handoff item 9.
  # ===========================================================================
  pareto:
    dominated_by: >-
      CHECKED, NOT AN UNCHECKED NULL. Frontier rows checked across time,
      memory, and data/query cost: (1) ICARM curve 302 ITSELF (the frozen
      third-party leaderboard record, rank_lower_bound = 31, unconditional
      per its own verifier's claim, NOT YET independently reproduced by
      this program) already dominates every result this protocol could
      produce on the "certified rank over Q" axis UNLESS Stage B succeeds
      in exhibiting a genuine 32nd point -- i.e. this protocol's own target
      (rank >= 32, unconditional, on curve 302) is not yet held by anyone
      this program can cite as a checked row. (2) On the "certified rank
      over Q, by THIS program's own instruments" axis, the strongest row
      this program has itself produced is rank 12-13 (GOAL-ECQ-001/002,
      GOAL-ECRANK-002 carry-forward); curve 302 (pending Stage 0
      reproduction) already exceeds that by a wide margin as a RETRIEVED,
      not yet reproduced, third-party claim. (3) IDEA-20260829-c705b4
      dominates on certificate-instrument specification maturity (it fully
      specifies Stage C's engine already) but has not executed it; this
      protocol does not compete with it, it depends on it. (4)
      IDEA-20260829-07fd5f dominates on point-search-instrument
      specification maturity for the DIFFERENT curves it targets; this
      protocol's Stage B depends on it without executing it either. (5) The
      time/memory/data cost of the ICARM board's OWN search process that
      originally produced curve 302 is UNKNOWN and UNDISCLOSED in the
      retrieved baseline record, and is not independently measurable by
      this program; this axis is recorded as "unknown, not zero" rather
      than omitted. On the specific axis this protocol competes on --
      "a finite, unconditional, sequenced decision-and-certification
      procedure for extending curve 302's OWN known point set by exactly
      one point" -- no row in this program's corpus dominates it, because
      no row attempts the Selmer-gated sequencing this protocol proposes.
    sota_delta: >-
      QUANTITATIVELY, per the handoff's exact required framing: EXACTLY ONE
      ADDITIONAL CERTIFIED INDEPENDENT POINT (31 -> 32 on the SAME curve
      302), IF and ONLY IF Stage A returns dim Sel_2(E) >= 32 AND Stage B
      exhibits a witness within its declared bounded search box AND Stage C
      certifies it AND the full review_architecture concurs. If instead
      Stage A returns dim Sel_2(E) = 31 exactly, sota_delta on the POINT-
