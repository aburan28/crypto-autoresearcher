  summary: >-
    Composed and materialized PROTO-ECQ-e72c0b-c85718: a finite,
    unconditional, two-stage decision-and-certification protocol for
    extending frozen ICARM curve 302 (exact rank >= 31 lower bound) to a
    certified rank >= 32, or closing that specific extension with a named
    exact obstruction. Stage 0 independently reproduces the frozen baseline
    (discriminant, 31 on-curve checks, torsion, and a 31-point independence
    certificate) using code independent of the ICARM verifier. Stage A
    computes the exact 2-Selmer rank of curve 302 via a finite,
    deterministic local-solubility enumeration over a frozen prime set S
    (|S| <= 21: the 20 listed bad primes plus 2) -- a genuine two-outcome
    discriminating test decided before any search cost is paid: dim
    Sel_2(E) = 31 exactly closes the extension unconditionally forever (no
    heuristic, no BSD/GRH); dim Sel_2(E) >= 32 licenses (but does not
    guarantee) a bounded Stage B point search, adopting the unexecuted
    Elkies-lattice instrument from IDEA-20260829-07fd5f without duplicating
    its target curves. Stage C certifies any witness via an exact
    F2-reduction independence matrix, adopting IDEA-20260829-c705b4's
    unexecuted instrument and extending it with a self-contained
    halving-induction soundness proof re-derived in the protocol itself.
    Full controls specified per the handoff: null control (Q=-P1, must
    return matrixRank=31), positive control (a small Cremona-table curve,
    exact generators deferred to execution rather than asserted from
    memory), a combined nearby-object/rational-2-torsion-applicability
    control (a torsion-bearing curve where omitting the torsion-rank
    subtraction would overclaim rank), and both required proves-too-much
    cases (P32=P1+P2 forced dependent by the descent map's group-
    homomorphism property; P32=2*P1 forced to an all-zero row by the
    descent map's kernel being exactly 2E(Q)) -- both are design-time
    arguments requiring no execution. Budgets and stops given per stage,
    with Stage A's worst-case 2^21 local-solubility-test cost flagged as
    the dominant cost risk (Hensel-lifting precision at an ~81-digit bad
    prime) and a small, explicitly zero-mathematical-claim dry-run cost
    probe recommended before any Coordinator commits a Stage A wall-clock
    budget. Object-first analysis names and excludes three established
    sibling families already active in this program (Mestre-Nagao
    elliptic-surface search, GOAL-ECQ-001/002; number-field degree
    reduction, GOAL-ECRANK-001/002; Galois-module isotypic decomposition,
    GOAL-ECQ-2298dc) as off-limits, and scores four candidate tracked
    objects on novelty/testability/survival, adopting the 2-Selmer class as
    Stage A's object (a genuinely new sequencing in this program's corpus,
    though the underlying mathematics is textbook 2-descent) while
    crediting the Stage B and Stage C objects to their originating
    unexecuted ledger proposals rather than re-deriving them. Pareto block
    gives a checked (not null) dominated_by and a quantitative sota_delta
    exactly as the handoff requires: "exactly one additional certified
    independent point," conditional on success, with an honest disclosure
    that the protocol still delivers a strictly stronger (exact, not
    lower-bound) rank determination for curve 302 even in the negative-
    Stage-A outcome. Review architecture (producer snapshot -> independent
    validator -> red team -> blind rederivation -> nondegraded
    review-breakthrough at max -> Coordinator decision) is specified as a
    plan for a future Coordinator to adopt, with an explicit statement that
    opening it is a Coordinator action not authorized, initiated, or
    implied by this document.
