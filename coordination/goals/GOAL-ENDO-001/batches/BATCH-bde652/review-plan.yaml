review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-bde652
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-bde652
  work_unit: sixth-generation-host-binding-repair
  recorded_at: '2026-08-30'
  recorded_by: coordinator
  recorded_before_any_reviewer_ran: true
  claim_scope: >-
    Reviews may change only the disposition of this static repair package
    (repaired emit script, extended schema rule, re-executed controls). They
    cannot establish a JINV, ECDLP, isogeny, exponent, speedup, scientific
    closure, breakthrough, hypothesis, goal-status, implementation, or
    experiment authorization, and they cannot declare HOST-BINDING-ENFORCEABILITY
    closed beyond what the archived package delivers against the v5 threat
    model (caller-supplied bindings).
  coordinator_prior: >-
    The RT-J2-O1 repair is mechanically simple: absolute-path resolution
    removes PATH as a caller-controlled input, and I expect it to close that
    objection outright when attacked by exactly the method that found it
    (prepending fake binaries). My prior for the red team's residual probing
    is that it will NOT accept "absolute paths" as the whole story: the likely
    findings are (a) residual trust in the host's own system binaries and
    runtime (dyld variables, a compromised /bin) which the repair cannot
    remove and can only DECLARE -- acceptable as a disclosed limitation
    because the v5 threat model treats the host as trusted infrastructure,
    but it must be declared in the narrowed provenance text, not assumed
    silently; and (b) a definitional fight over RT-J3-O1's extension -- what
    exactly counts as empty AFTER NORMALIZATION for filesystem_id versus
    host_id (whitespace-only, non-canonical device strings), where a sloppy
    rule could either still pass junk or STOP legitimate values. I expect the
    disposition to come back PASS-with-disclosed-residual-trust, or REVISE on
    a definitional defect in the normalization rule. If both reviewers find
    the package fully clean with NO disclosed limitation, that is the surprise
    to record and probe skeptically before composing PASS.
  prior:
    expectation: >-
      RT-J2-O1 closes under the exact attack that found it; residual trust in
      host system binaries surfaces and must be declared, not silent; the
      empty-after-normalization rule is the likeliest place for a new defect.
    decision_if_overturned: >-
      If both reviewers find the package clean with no disclosed limitation,
      record that surprise explicitly and probe it in the ledger archive
      before composing PASS; if either finds a defect, preserve it without
      outvoting it.
  joints:
    - joint: J1-repair-correctness-and-nondegression
      assigned_to: TASK-20260830-3ebb0b
      role: validator
      attack_plan: >-
        Verify each repair against its own objection text in
        DEC-20260830-a575a3: RT-J2-O1 by diffing the repaired script's command
        invocations against PATH-resolved equivalents and confirming every
        external command is an absolute path with no shell lookup; RT-J2-O3 by
        confirming the paste-from-different-mount attack is documented as an
        explicit verification step a reviewer performs (compare the receipt's
        mount against the reviewer's own df for the worktree), not merely
        named; RT-J3-O1 by instantiating the extended rule by hand on worked
        examples (absent key, null, empty string, whitespace-only,
        non-canonical device string) and requiring STOP or PASS exactly as the
        rule text demands. Then check nondegression: no v5 rule from
        j3-closure-v5.yaml, no v2 schema field semantics from
        receipt-schema-v2.yaml, and no BATCH-90392b/BATCH-820ee8 closure is
        weakened, and no predecessor byte is edited (the package is additive).
        Perform the blind re-derivation: re-derive the expected host_id,
        filesystem_id, filesystem_mount for THIS host from the repaired
        schema's provenance declarations and the host's own identity surfaces,
        never reading the repaired emit script or procedure, and compare
        against the repaired demo receipt.
      expected_break: >-
        A PATH-resolved command surviving in the repaired script, a
        normalization rule that passes junk or STOPs legitimate values, or any
        predecessor byte changed.
    - joint: J2-adversarial-re-attack-of-repaired-procedure
      assigned_to: TASK-20260830-4213a6
      role: red-team
      attack_plan: >-
        Re-attempt the EXACT attack that found RT-J2-O1: prepend fake hostname
        and df binaries to PATH and run the repaired script; require the
        emitted values to be unaffected. Then hunt residual and new escapes:
        spoofable absolute paths (does any pinned path resolve into a
        caller-writable directory?), the script's own internal PATH or
        environment use (sh builtins, command substitution), dyld/library
        injection on the pinned system binaries, mount-namespace or symlink
        tricks against the mount the script reports, and the
        paste-from-different-mount attack (run the script from a different
        mount and attempt to pass the result off). State whether RT-J2-O1 is
        closed against the v5 threat model and whether every residual trust
        assumption (host system binaries, host runtime) is DECLARED in the
        narrowed provenance text rather than silent. Verify the repaired demo
        receipt was machine-produced by the repaired script.
      expected_break: >-
        Any caller-controlled value still reaching the output through the
        repaired procedure, or an undeclared residual trust assumption.
    - joint: J3-rule-extension-integrity
      assigned_to: TASK-20260830-4213a6
      role: red-team
      attack_plan: >-
        Execute the package's extended missing_receipt_field rule against the
        full value-shape battery: absent key, null, empty string,
        whitespace-only, zero-width characters, non-canonical device strings,
        duplicate keys, and a legitimate unusual-but-real value (e.g. an
        oddly-formatted device name). Require STOP on the junk shapes and PASS
        on the legitimate one; any rule that STOPs a value a real host could
        legitimately emit is a defect equal in kind to one that passes junk.
        Confirm the extension regresses none of the three original STOP cases
        (caller-supplied, missing, v1-receipt) from the BATCH-820ee8 control
        report, and that the re-executed control report actually records the
        PATH-prepending and empty/null controls as executed with outcomes.
      expected_break: >-
        A junk shape that passes, or a legitimate host value that STOPs.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/tasks/TASK-20260830-31b79c/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/review-plan.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/dispatch_queue.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/tasks/TASK-20260825-74615f/j3-closure-v5.yaml
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/reviews/TASK-20260830-3ebb0b/
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/reviews/TASK-20260830-4213a6/
    attestation_required: >-
      Each reviewer states exactly what it read, confirms it did not read the
      sibling report, and discloses policy/model provenance. Independence is
      a fresh session and disjoint context, not a distinct-model quorum.
  proves_too_much:
    required: true
    assigned_to: TASK-20260830-4213a6
    objects:
      - same-heading repair whose absolute paths resolve into a caller-writable directory
      - same-heading repair whose normalization rule accepts whitespace-only values as present-and-valid
      - same-heading repair whose demo values do not match the host's identity surfaces
    failure_signature: >-
      The argument "this repair closes RT-J2-O1 and RT-J3-O1 under the v5
      threat model" must FAIL on each known-false object: the review must
      return STOP or REVISE on an object where the repair demonstrably does
      not close what it claims, and the argument surviving any object is a
      review-method failure that forces REVISE of the disposition.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260830-3ebb0b
    quantity: >-
      The host identity surfaces themselves: from the repaired schema's
      provenance declarations and the host alone, re-derive the expected
      host_id, filesystem_id, and filesystem_mount for THIS host by querying
      the host's own identity surfaces, never reading the repaired emit
      script or procedure.
    blind_from:
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/tasks/TASK-20260830-31b79c/emit_host_binding_v2.sh
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/tasks/TASK-20260830-31b79c/emit_procedure_v2.md
    agreement_means: >-
      Agreement is evidence the repaired demo values are real; disagreement
      localises to either the schema's provenance declaration or the repaired
      procedure -- two named suspects, not an undifferentiated failure.
