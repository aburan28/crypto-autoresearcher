schema: crypto.autoresearch.stop_control_report.v2
stop_control:
  id: TASK-20260830-31b79c-stop-control
  task_id: TASK-20260830-31b79c
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-bde652
  predecessor_report: >-
    coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/tasks/TASK-20260830-78b00f/stop-control-report.yaml
  additive_note: >-
    This report is an ADDITIVE successor. Cases a, b, c below re-execute the
    predecessor's three cases against the REPAIRED package
    (emit_host_binding_v2.sh, repair-package-v6.yaml) and are evaluated the
    same way the predecessor evaluated them (construction against the v5/v6
    rule text); the predecessor report and its cases are not edited. Cases
    PATH-PREPEND and EMPTY-NULL are NEW controls added by this batch's
    review-plan.yaml and DEC-20260830-a575a3.bounded_successor_repair_condition.
  evaluated_against:
    - >-
      coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/tasks/TASK-20260825-74615f/j3-closure-v5.yaml
      operation_schema_v2.host_binding (binding_rule_v2, missing_receipt_field;
      unedited, frozen, literal copies below)
    - >-
      coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/tasks/TASK-20260830-31b79c/repair-package-v6.yaml
      missing_receipt_field_v2 (this task's additive extension)
  execution_kind: mixed
  execution_kind_note: >-
    Cases a/b/c (re-executed originals) and EMPTY-NULL are STATIC RULE
    EVALUATIONS: constructed or worked objects are evaluated by hand against
    the cited rule text, exactly as the predecessor report's
    execution_kind: static_construction_against_v5_rule_text did. Case
    PATH-PREPEND is a REAL, ACTUALLY-EXECUTED shell control: the repaired
    script and, for comparison, the unmodified v1 predecessor script were
    both actually run under a PATH-prepended hostile-binary attack in this
    session; see runtime-session-receipt.json for the exact commands and
    captured stdout/exit codes.
  experiment_runs_executed: 0
  scientific_result: false
  producer_code_executed: true
  producer_code_executed_note: >-
    "producer_code_executed: true" here means shell-script execution of the
    (repaired and, for comparison, unrepaired) emit_host_binding scripts as
    part of the PATH-PREPEND control and the demo receipt -- governance
    tooling execution, not an EXP-JINV-bd141d experiment run. Zero
    EXP-*/RUN-* experiment runs were executed, per the task's authorized
    budget (maximum_runs: exactly 1 task attempt, 0 experiment runs
    authorized).
  network_used: false

  v5_rule_text_cited:
    binding_rule_v2: >-
      "host_observation.host_id, host_observation.filesystem_id, and
      host_observation.filesystem_mount (each normalized as above) must be
      exactly equal to the corresponding normalized
      runtime-session-receipt.json host_binding.* fields. Equality against
      any other source (including a caller-declared 'active binding' field)
      is rejected."
    caller_input_is_never_authoritative: true
    forbidden_source: "host_observation object supplied by the caller/consumer"
    missing_receipt_field: STOP
    receipt_field_absent_handling: >-
      "If runtime-session-receipt.json lacks host_binding.host_id,
      host_binding.filesystem_id, or host_binding.filesystem_mount, the
      validity check itself is unevaluable and STOPs; no fallback host
      source is substituted."
  v6_rule_text_cited:
    missing_receipt_field_v2: >-
      See repair-package-v6.yaml missing_receipt_field_v2.rule_text and
      normalization_definition_exact (literal, this task's own additive
      rule; reproduced in full there, cited by reference here to avoid
      duplicating the normative text in two places).

  cases:

    - case: a
      label: caller-supplied-binding
      re_executed_from: predecessor case (a), same construction
      construction: >-
        Identical construction to the predecessor's case (a): a
        caller-shaped host_observation object, internally self-consistent
        and matching a caller-declared "active binding" field, that does
        NOT match this task's own runtime-session-receipt.json
        host_binding.* fields (produced by emit_host_binding_v2.sh from
        this host's own identity surfaces via pinned absolute paths).
      concrete_object:
        receipt_host_binding:
          host_id: "Mac.attlocal.net"
          filesystem_id: "/dev/disk5s1"
          filesystem_mount: "/Volumes/SSD990"
          source: "emit_host_binding_v2.sh on this host (this task's demo-receipt-v2.json)"
        caller_host_observation:
          host_id: "evil-host.example.com"
          filesystem_id: "/dev/fakedev"
          filesystem_mount: "/mnt/fake"
        caller_declared_active_binding:
          host_id: "evil-host.example.com"
          filesystem_id: "/dev/fakedev"
          filesystem_mount: "/mnt/fake"
      v5_rule_evaluated: binding_rule_v2
      evaluation: >-
        The caller_host_observation does NOT equal the receipt_host_binding
        (all three fields differ). binding_rule_v2 demands equality against
        the receipt host_binding.* only, and rejects equality against any
        caller-declared "active binding" field. caller_input_is_never_
        authoritative is true.
      outcome: STOP
      v6_change: none
      v6_change_note: >-
        Unaffected by the RT-J2-O1/O3/O2-scoped repairs in this batch:
        binding_rule_v2 itself is not touched by this package
        (missing_receipt_field_v2 is additive and separate from
        binding_rule_v2). This case remains STOP for the identical reason
        it was STOP under the v1 predecessor.

    - case: b
      label: missing-binding
      re_executed_from: predecessor case (b), same construction
      construction: >-
        A v1-shaped receipt with only the absence note in host_binding,
        lacking host_binding.host_id, host_binding.filesystem_id, and
        host_binding.filesystem_mount.
      concrete_object:
        host_binding:
          note: >-
            This session has no live runtime harness; no
            host_binding.host_id/filesystem_id/filesystem_mount fields are
            asserted.
        has_host_id: false
        has_filesystem_id: false
        has_filesystem_mount: false
      v5_rule_evaluated: missing_receipt_field
      v6_rule_evaluated: missing_receipt_field_v2
      evaluation: >-
        All three fields are absent. Both missing_receipt_field (v5,
        absence-only) and missing_receipt_field_v2 (this package's
        extension, absence OR empty-after-normalization) fire identically
        on absence: "the validity check itself is unevaluable and STOPs; no
        fallback host source is substituted."
      outcome: STOP
      v6_change: none
      v6_change_note: >-
        missing_receipt_field_v2 is a superset of missing_receipt_field on
        the absence case: it changes nothing for genuinely absent fields,
        it only adds coverage for present-but-empty-after-normalization
        fields (see EMPTY-NULL case below).

    - case: c
      label: v1-receipt-under-v2-schema
      re_executed_from: predecessor case (c), same construction
      construction: >-
        The same real v1 corpus receipt
        (coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-0d566b/runtime-session-receipt.json,
        schema v1) parsed under the v2/v6 schema.
      concrete_object:
        source_file: >-
          coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-0d566b/runtime-session-receipt.json
        schema: "crypto.autoresearch.runtime_session_receipt.v1"
        host_binding_keys: ["note"]
        has_host_id: false
        has_filesystem_id: false
        has_filesystem_mount: false
      v5_rule_evaluated: missing_receipt_field
      v6_rule_evaluated: missing_receipt_field_v2
      evaluation: >-
        Same as case (b): all three fields absent under both the v5 rule
        and this package's v6 extension. Both STOP identically. The v2
        parser's acceptance of this receipt as schema-VALID does not
        satisfy either binding rule -- the named weakening from
        receipt-schema-v2.yaml (schema-validity != binding-rule
        satisfaction) is unchanged and unedited by this package.
      outcome: STOP
      v6_change: none

    - case: PATH-PREPEND
      label: path-prepend-attack-against-repaired-script
      new_control: true
      construction: >-
        Exactly the BATCH-820ee8 red team's original attack
        (RT-20260830-d85fdf, confirmed in DEC-20260830-a575a3): a directory
        containing hostile `hostname` and `df` shell scripts was created
        (fake `hostname` prints "caller-controlled-hostname"; fake `df`
        prints a single data line with device "/dev/fakedev" and mount
        "/mnt/fake"), made executable, and prepended to $PATH ahead of the
        real system directories.
      actually_executed: true
      commands_run:
        - >-
          export PATH="<fake-bin-dir>:$PATH"; sh
          coordination/goals/GOAL-ENDO-001/batches/BATCH-820ee8/tasks/TASK-20260830-78b00f/emit_host_binding.sh
          (UNMODIFIED v1 predecessor script, read-only, for comparison only
          -- no predecessor byte was written or edited)
        - >-
          export PATH="<fake-bin-dir>:$PATH"; sh
          coordination/goals/GOAL-ENDO-001/batches/BATCH-bde652/tasks/TASK-20260830-31b79c/emit_host_binding_v2.sh
          (REPAIRED v2 script, this task's own artifact)
      observed_output:
        v1_predecessor_under_path_prepend: >-
          {"schema":"crypto.autoresearch.runtime_session_receipt.v2","host_binding":{"host_id":"caller-controlled-hostname","filesystem_id":"/dev/fakedev","filesystem_mount":"/mnt/fake"},"emitted_at":"2026-08-30T18:06:45Z"}
        v1_exit_code: 0
        v2_repaired_under_path_prepend: >-
          {"schema":"crypto.autoresearch.runtime_session_receipt.v2","host_binding":{"host_id":"Mac.attlocal.net","filesystem_id":"/dev/disk5s1","filesystem_mount":"/Volumes/SSD990"},"emitted_at":"2026-08-30T18:06:47Z"}
        v2_exit_code: 0
      evaluation: >-
        The UNREPAIRED v1 script emits the caller-controlled values
        (host_id="caller-controlled-hostname", filesystem_id="/dev/fakedev",
        filesystem_mount="/mnt/fake") under PATH-prepend, exactly
        replicating RT-20260830-d85fdf's original finding (RT-J2-O1
        confirmed reproducible). The REPAIRED v2 script, run in the SAME
        shell with the SAME hostile PATH prepended, emits the real host's
        values (host_id="Mac.attlocal.net", filesystem_id="/dev/disk5s1",
        filesystem_mount="/Volumes/SSD990") -- identical to its own
        PATH-unmodified demo run (demo-receipt-v2.json). The repaired
        script's output is UNAFFECTED by the PATH-prepend attack, because
        it resolves hostname/df/date/sed/awk/tr/tail by pinned absolute
        path and never consults PATH for any of them.
      outcome: PASS
      outcome_definition_for_this_control: >-
        PASS means "output unaffected by the attack" (the objective stated
        in this task's dispatch), which is the desired, closing outcome for
        RT-J2-O1 -- distinct from the STOP/PASS vocabulary used for
        validity-rule cases above, where STOP is the desired outcome. This
        control tests the SCRIPT's resistance to a supply-chain-style
        environment attack, not a validity RULE's firing behavior.

    - case: EMPTY-NULL
      label: missing_receipt_field_v2-against-value-shape-battery
      new_control: true
      construction: >-
        Five worked host_binding objects, each varying ONE field
        (filesystem_id chosen as the representative field; the same
        normalization and rule text applies identically to host_id and
        filesystem_mount per missing_receipt_field_v2.scope) through the
        value shapes required by DEC-20260830-a575a3 and this batch's
        dispatch: absent, null, empty-string, whitespace-only, and one
        legitimate unusual-but-valid value.
      instances:
        - shape: absent
          object: '{"host_binding":{"host_id":"Mac.attlocal.net","filesystem_mount":"/Volumes/SSD990"}}'
          note: filesystem_id key is not present at all.
          rule_applied: missing_receipt_field_v2
          normalization_trace: >-
            step_1_trim: N/A (no value to trim). step_3_emptiness_test: N/A
            (this is the pre-existing absent-field clause, not the new
            emptiness clause).
          outcome: STOP
          rationale: >-
            Absent field; fires under the original absence clause
            (unchanged from v5's missing_receipt_field), which
            missing_receipt_field_v2 preserves unmodified.

        - shape: null
          object: '{"host_binding":{"host_id":"Mac.attlocal.net","filesystem_id":null,"filesystem_mount":"/Volumes/SSD990"}}'
          note: filesystem_id is JSON literal null.
          rule_applied: missing_receipt_field_v2
          normalization_trace: >-
            A JSON null has no string value to trim or normalize; per
            json_null_handling, this is treated as ABSENT of a usable
            string value and STOPs under the absence clause (most JSON
            parsers expose this as None/null rather than a string), OR, if
            a producer instead stringified it to the four characters
            "null", step_1_trim leaves "null" unchanged, step_2 does not
            alter it (not empty and not slash-bearing in a way that
            matters), and step_3_emptiness_test matches the case-
            insensitive four-character literal "null" -> empty-after-
            normalization.
          outcome: STOP
          rationale: >-
            Covered under BOTH the absence clause (JSON null as an object)
            and, redundantly and for defense in depth, the literal-"null"
            string clause in step_3_emptiness_test. Either reading STOPs.

        - shape: empty-string
          object: '{"host_binding":{"host_id":"Mac.attlocal.net","filesystem_id":"","filesystem_mount":"/Volumes/SSD990"}}'
          note: filesystem_id is present as the empty string "".
          rule_applied: missing_receipt_field_v2
          normalization_trace: >-
            step_1_trim: "" trimmed is still "". step_2_case_and_slash:
            lowercasing/slash-stripping an empty string leaves "".
            step_3_emptiness_test: zero-length string -> empty-after-
            normalization: true.
          outcome: STOP
          rationale: >-
            This is exactly the gap RT-J3-O1 named: v5's missing_receipt_field
            fired ONLY on absence and would have let this PASS the field-
            presence check (the key exists). missing_receipt_field_v2's
            step_3_emptiness_test closes it: an empty string is empty-
            after-normalization and STOPs.

        - shape: whitespace-only
          object: '{"host_binding":{"host_id":"Mac.attlocal.net","filesystem_id":"   \t  ","filesystem_mount":"/Volumes/SSD990"}}'
          note: filesystem_id is present as three spaces, a tab, and two more spaces.
          rule_applied: missing_receipt_field_v2
          normalization_trace: >-
            step_1_trim: "   \t  " trimmed (leading+trailing ASCII
            whitespace including tab) becomes "". step_2_case_and_slash: ""
            is unchanged. step_3_emptiness_test: zero-length string ->
            empty-after-normalization: true.
          outcome: STOP
          rationale: >-
            Named explicitly in the objection text ("whitespace after
            normalization"). step_1_trim converts whitespace-only input to
            the empty string, which step_3_emptiness_test then catches.
            This is the exact whitespace_only_handling clause in
            repair-package-v6.yaml.

        - shape: legitimate-unusual-but-valid-value
          object: '{"host_binding":{"host_id":"Mac.attlocal.net","filesystem_id":"/dev/disk9s99999x","filesystem_mount":"/Volumes/SSD990"}}'
          note: >-
            filesystem_id is an oddly-numbered, non-standard-looking but
            NON-EMPTY device string -- the kind of real value an unusual
            host configuration (e.g. many nested APFS volumes, an exotic
            device-mapper name, a container overlay device) could
            legitimately emit. It is deliberately chosen to look suspicious
            without being empty, null, or whitespace.
          rule_applied: missing_receipt_field_v2
          normalization_trace: >-
            step_1_trim: no leading/trailing whitespace, unchanged.
            step_2_case_and_slash: lowercased (already lowercase), no
            trailing slash to strip, unchanged: "/dev/disk9s99999x".
            step_3_emptiness_test: non-zero-length, and not the literal
            "null" -> empty-after-normalization: false.
          outcome: PASS
          rationale: >-
            missing_receipt_field_v2 STOPs only on absence or on
            empty/"null"-after-normalization; a non-canonical but non-empty
            string is explicitly carved out in
            step_3_emptiness_test ("No other value is treated as empty").
            This value PASSES missing_receipt_field_v2. It may still be
            rejected by a DIFFERENT rule (binding_rule_v2's equality check
            against the receipt, if this were a host_observation being
            compared) -- that is a separate rule from a separate objection
            and is out of scope for this case, which tests
            missing_receipt_field_v2 alone. This is the required negative
            control per review-plan.yaml J3 ("any rule that STOPs a value a
            real host could legitimately emit is a defect equal in kind to
            one that passes junk"): the rule does NOT stop it.

      summary_of_battery: >-
        4 of 5 shapes (absent, null, empty-string, whitespace-only) STOP
        under missing_receipt_field_v2, closing exactly the RT-J3-O1 gap
        (empty-string and whitespace-only were the two shapes the v5
        original rule text did not cover, since it names only "lacks
        host_binding.host_id/filesystem_id/filesystem_mount"). The 1
        legitimate-unusual-but-valid shape PASSES, confirming the extension
        does not overreach into STOPping real values, per the review plan's
        stated failure mode to avoid.

  summary:
    original_three_cases_under_repaired_package: STOP, STOP, STOP (unchanged from predecessor)
    path_prepend_control: PASS (repaired script's output unaffected by the attack; unrepaired v1 predecessor's output IS affected, confirming the attack and the repair both actually function)
    empty_null_battery: 4 STOP / 1 PASS, matching the required shape (junk STOPs, legitimate value PASSes)
    no_predecessor_byte_edited: true
    weakening_introduced: none_new
    weakening_introduced_note: >-
      The one named weakening carried forward unedited from v1/v5 (v2
      schema-validity does not imply v5 binding-rule satisfaction, cases b
      and c) is unchanged by this package. No new weakening is introduced
      by missing_receipt_field_v2 or by the absolute-path repair: both are
      strictly additive coverage increases (missing_receipt_field_v2 covers
      strictly more STOP cases than missing_receipt_field, and the
      absolute-path repair removes an attack surface without changing any
      STOP outcome from the original three cases).
    residual_disclosed_items_unrepaired:
      - RT-J2-O2 (self-attestation) -- explicitly out of scope, not repaired
      - >-
        host-system-binary/runtime trust boundary (named in
        emit_procedure_v2.md as part of the RT-J2-O1 repair's narrowed
        provenance declaration) -- disclosed, not a defect, not claimed
        closed
