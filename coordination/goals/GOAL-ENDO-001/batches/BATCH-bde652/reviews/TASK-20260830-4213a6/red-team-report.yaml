  proves_too_much:
    required: true
    argument_tested: >-
      "this repair closes RT-J2-O1 and RT-J3-O1 under the v5 threat model"
    objects:
      - id: PTM-1
        description: >-
          Same-heading repair whose absolute paths resolve into a
          caller-writable directory.
        construction: >-
          Copied emit_host_binding_v2.sh to my own scratchpad
          (never touching the producer's file), created a directory INSIDE
          my own scratchpad (owned by me, confirmed writable with `[ -w
          ... ]`), placed a hostile `hostname` binary there
          (echoes "PTM1-ATTACKER-OVERWROTE-PINNED-PATH"), and edited the
          THROWAWAY COPY's HOSTNAME_BIN constant to point at that
          caller-writable path, exactly as if it had been "verified and
          pinned" by an authoring session that failed to check the target
          directory's ownership.
        known_false_basis: >-
          If the "verified absolute path" itself lives in a directory the
          caller can write to, pinning it accomplishes nothing: the caller
          can overwrite the file the pin points to directly, with ZERO
          PATH manipulation required. The argument "this repair closes
          RT-J2-O1" is false for this object.
        method_applied: >-
          The SAME method I used against the real package (item 2b above):
          check the ownership and writability of the pinned path's
          resolved location, not merely whether the string is
          "/absolute/looking".
        observed: >-
          Ran the mutated throwaway copy with an UNMODIFIED PATH (no attack
          needed at all): output was
          {"...,"host_binding":{"host_id":"PTM1-ATTACKER-OVERWROTE-PINNED-PATH",...}}.
          My method (checking ownership/writability of the resolved path,
          which I performed for the real package and would perform again
          here) immediately flags the pinned path as caller-writable and
          returns REVISE/STOP for this object.
        result: rejected
        outcome: FAIL_as_required
        location_of_survival: none -- my method does not accept this object.

      - id: PTM-2
        description: >-
          Same-heading repair whose normalization rule accepts
          whitespace-only values as present-and-valid.
        construction: >-
          Wrote a throwaway text file (own scratchpad only, NOT
          repair-package-v6.yaml) restating missing_receipt_field_v2's
          rule_text unchanged but with step_1_trim REMOVED entirely, so
          step_3_emptiness_test operates directly on the raw (untrimmed)
          value.
        known_false_basis: >-
          Without the trim step, a whitespace-only value (e.g. "   \t  ")
          remains non-empty (length > 0) and is not the literal "null", so
          step_3 does not flag it -- the mutated rule PASSES a
          whitespace-only value, exactly the defect RT-J3-O1 named and this
          package claims to have fixed. The argument "this repair closes
          RT-J3-O1" is false for this object.
        method_applied: >-
          The SAME battery-evaluation method I used against the real
          package (J3 item 1): hand-trace the whitespace-only test case
          through the object's own stated normalization steps.
        observed: >-
          Tracing "   \t  " through the mutated rule: step_2 (case/slash)
          does not touch it (still "   \t  ", length 6); step_3: not
          zero-length, not literal "null" -> empty-after-normalization =
          FALSE -> PASS. My method, which explicitly runs this exact
          shape against the stated rule, correctly detects PASS where STOP
          is required and flags this as a defect.
        result: rejected
        outcome: FAIL_as_required
        location_of_survival: none -- my method does not accept this object.

      - id: PTM-3
        description: >-
          Same-heading repair whose demo values do not match the host's
          identity surfaces.
        construction: >-
          Wrote a throwaway demo-receipt.json (own scratchpad only) with
          host_id="mars-rover-99.example.net",
          filesystem_id="/dev/marsdisk0", filesystem_mount="/mnt/mars".
        known_false_basis: >-
          None of these values corresponds to any surface of the actual
          reviewing host; a demo receipt with these values could not have
          been produced by running the real script on this host. The
          argument "this repair's demo evidence is real" is false for this
          object.
        method_applied: >-
          The SAME comparison method I used against the real package (J2
          item 4): run `hostname` and `df -P .` on this host myself and
          compare.
        observed: >-
          This host's real values (Mac.attlocal.net, /dev/disk5s1,
          /Volumes/SSD990) match NONE of the three PTM-3 fields. My method
          immediately flags disagreement on all three fields and rejects
          the object as fabricated.
        result: rejected
        outcome: FAIL_as_required
        location_of_survival: none -- my method does not accept this object.

    overall_result: >-
      All three known-false objects are REJECTED by my review method (the
      required failure signature: STOP/REVISE on each). None of the three
      objects survives. This confirms my method is not over-generous on
      exactly the axes the review plan named: it independently checks
      absolute-path OWNERSHIP/WRITABILITY (not just path syntax), it
      independently re-traces the STATED normalization steps against
      worked value shapes (not just reads the producer's summary table),
      and it independently queries the host's own surfaces to compare
      against demo values (not just reads the producer's comparison
      claim). The proves-too-much control PASSES; this review's method is
      not the source of a false-positive PASS on any of the three named
      known-false shapes. This gives no license to soften the two REAL
      findings above (RT-J2-O4, RT-J3-O2/O3) found against the ACTUAL
      package -- the control validates the METHOD, not the artifact.

  objections:
    - id: RT-J2-O4
      severity: material
      status: open
      class: procedure_invocation_command_itself_path_resolvable
      summary: >-
        emit_procedure_v2.md Step 1's documented invocation
        (`sh coordination/.../emit_host_binding_v2.sh`) uses a bare "sh"
        token resolved by the CALLER's PATH before the repaired script's
        internal absolute-path pins ever execute. A caller who prepends a
        hostile `sh` binary to PATH -- the same mechanism, one more binary,
        as the exact attack that found RT-J2-O1 -- causes the documented
        procedure to emit fully fabricated output without ever running the
        real script. Confirmed empirically; the shebang-invocation route
        (`./emit_host_binding_v2.sh`) is immune, confirmed empirically.
        Undisclosed in the narrowed provenance declaration, which names
        "the /bin/sh interpreter executing this script" only as a
        host-integrity (byte-tampering) trust boundary, not as a residual
        caller-controlled-PATH vector.
      required_repair: >-
        Pin `sh` itself as an eighth verified absolute path in the
        documented Step 1 command, or switch the documented invocation to
        the shebang route; add a corresponding stop-control case
        demonstrating the fix under a hostile-`sh`-in-PATH attack.

    - id: RT-J3-O2
      severity: minor_to_moderate
      status: open
      class: normalization_ascii_only_trim_misses_unicode_zero_width_junk
      summary: >-
        missing_receipt_field_v2's step_1_trim strips ASCII whitespace
        only; a field consisting solely of Unicode zero-width/invisible
        characters (e.g. U+200B) is not trimmed, is non-empty and not
        literal "null" post-normalization, and therefore PASSES the rule
        despite being junk no real host surface would emit. Confirmed by
        direct computation. Mitigated (not eliminated) by binding_rule_v2's
        equality check when evaluated -- the same named weakening already
        disclosed for the original RT-J3-O1 gap.
      required_repair: >-
        Extend the trim/emptiness definition to cover Unicode
        Default_Ignorable_Code_Point / zero-width characters, or
        explicitly document the residual gap.

    - id: RT-J3-O3
      severity: minor
      status: open
      class: normalization_literal_null_string_false_positive_risk
      summary: >-
        step_3_emptiness_test treats any field whose normalized value
        equals the four-character string "null" (case-insensitive) as
        empty-after-normalization -- STOPping a real host whose hostname
        or device string genuinely is "null", which the review plan's own
        standard treats as a defect equal in kind to passing junk. Low
        real-world probability; entirely undisclosed as a trade-off.
      required_repair: >-
        Document the trade-off explicitly in repair-package-v6.yaml, or
        narrow the literal-string clause's applicability.

  required_controls:
    - >-
      A stop-control case (PATH-PREPEND-SH or equivalent) exercising the
      documented invocation command itself under a hostile `sh` in PATH,
      required before RT-J2-O1 can be claimed closed against the full
      scope of its own objection text.
    - >-
      A value-shape instance for missing_receipt_field_v2 covering at
      least one Unicode zero-width character shape, required before
      RT-J3-O1's closure claim can be made without qualification.

  counterexample_or_mutation: >-
    Primary: hostile `sh` prepended to PATH, invoked via the documented
    `sh <script>` command, produces fully fabricated schema-conformant
