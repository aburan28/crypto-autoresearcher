  attack_plan_execution:

    - item: "1. RT-J2-O1 -- absolute-path resolution, no PATH lookup"
      objection: RT-J2-O1
      method: >-
        (a) Statically enumerated every _BIN pin (HOSTNAME_BIN=/bin/hostname,
        DF_BIN=/bin/df, DATE_BIN=/bin/date, SED_BIN=/usr/bin/sed,
        AWK_BIN=/usr/bin/awk, TR_BIN=/usr/bin/tr, TAIL_BIN=/usr/bin/tail) and
        grepped the script for every bare occurrence of hostname/df/date/sed/
        awk/tr/tail outside of a "$..._BIN" reference or a comment -- none
        found; every invocation in executable code is a quoted "$..._BIN"
        reference. printf and [ are confirmed POSIX sh builtins (not PATH-
        resolved). The shebang #!/bin/sh is kernel-exec-resolved, not a shell
        PATH lookup, and is outside the v5 threat model (caller-supplied
        bindings via an environment variable the caller controls).
        (b) Independently confirmed all 7 pinned absolute paths exist and are
        executable on THIS host via `test -x`.
        (c) LIVE RE-EXECUTION (not merely static reading): built a hostile
        fakebin/ directory (fake `hostname` printing
        "caller-controlled-hostname"; fake `df` printing a data line with
        device /dev/fakedev and mount /mnt/fake), prepended it to PATH, and
        ran emit_host_binding_v2.sh. It emitted the REAL host's values
        unaffected (host_id "Mac.attlocal.net", filesystem_id
        "/dev/disk5s1", filesystem_mount "/Volumes/SSD990" -- identical to
        its own PATH-unmodified demo run). Confirmed the attack apparatus
        itself is real by running a bare `hostname` under the same hostile
        PATH: it printed "caller-controlled-hostname" (the fake binary was
        genuinely shadowing the real one for any PATH-based lookup).
        (d) CONTROL COMPARISON: ran the identical hostile-PATH attack,
        read-only, against the v1 predecessor script
        (BATCH-820ee8/TASK-20260830-78b00f/emit_host_binding.sh). It emitted
        the hostile caller-controlled values (host_id
        "caller-controlled-hostname", filesystem_id "/dev/fakedev",
        filesystem_mount "/mnt/fake"), confirming the vulnerability the
        repair claims to close is real and reproducible, and that the
        repaired script -- not some accident of this host's PATH -- is what
        defeats it.
      result: >-
        Reproduces exactly the outcome repair-package-v6.yaml and
        stop-control-report-v6.yaml's PATH-PREPEND case claim. No PATH-
        resolved command survives in emit_host_binding_v2.sh.
      verdict: holds

    - item: "2. RT-J2-O3 -- paste-from-different-mount, reviewer-runnable verification"
      objection: RT-J2-O3
      method: >-
        Read emit_procedure_v2.md's "PASTE-FROM-DIFFERENT-MOUNT VERIFICATION
        (repairs RT-J2-O3)" section: it names the attack surface explicitly
        (a receipt's filesystem values are real but may describe the wrong
        working directory/mount if captured elsewhere and pasted in) and
        gives 5 explicit, numbered, human-executable steps (identify the
        claimed working directory; independently run `df -P
        <that-exact-worktree-path>` on the same host; normalize per the
        stated v5 rules; compare against the receipt's filesystem_id/mount;
        treat disagreement, including an undetermined one, as STOP). This is
        a procedure, not a bare mention. I then EXECUTED it as a worked
        example: ran `df -P
        /Volumes/SSD990/crypto-autoresearcher/.worktrees/endo-gate5-complete-20260829`
        myself and compared the normalized result against
        demo-receipt-v2.json.
      result: >-
        My independently-run df matches demo-receipt-v2.json's
        filesystem_id (/dev/disk5s1) and filesystem_mount (/Volumes/SSD990)
        exactly, confirming the verification step is genuinely runnable and
        produces a determinate agreement/disagreement outcome, not merely
        rhetorical.
      verdict: holds

    - item: "3. RT-J3-O1 -- missing_receipt_field_v2 hand-instantiation"
      objection: RT-J3-O1
      method: >-
        Hand-traced repair-package-v6.yaml's missing_receipt_field_v2
        rule_text and normalization_definition_exact (step_1_trim,
        step_2_case_and_slash, step_3_emptiness_test) against the required
        worked-example battery, BEFORE reading the producer's own worked
        battery in stop-control-report-v6.yaml, then cross-checked.
      worked_examples:
        - shape: absent_key
          trace: "no value present -> fires under the pre-existing absence clause"
          expected_by_rule_text: STOP
          my_hand_traced_result: STOP
          agrees_with_producer_battery: true
        - shape: "json null"
          trace: >-
            no usable string value; falls under absence clause or the
            literal-"null" clause per json_null_handling -- both paths STOP
          expected_by_rule_text: STOP
          my_hand_traced_result: STOP
          agrees_with_producer_battery: true
        - shape: empty_string
          trace: "step_1_trim('') = ''; step_3: zero-length -> empty-after-normalization"
          expected_by_rule_text: STOP
          my_hand_traced_result: STOP
          agrees_with_producer_battery: true
        - shape: whitespace_only
          trace: >-
            "   \t  " trimmed by step_1 (ASCII space/tab/newline/CR) becomes
            ''; step_3 zero-length -> empty-after-normalization
          expected_by_rule_text: STOP
          my_hand_traced_result: STOP
          agrees_with_producer_battery: true
        - shape: legitimate_unusual_device_string
          example_value: "/dev/disk9s99"
          trace: >-
            non-zero-length after trim, not the literal "null"
            case-insensitive -> NOT empty-after-normalization; rule text
            explicitly carves this case out ("No other value is treated as
            empty")
          expected_by_rule_text: PASS
          my_hand_traced_result: PASS
          agrees_with_producer_battery: true
      producer_battery_cross_check: >-
        stop-control-report-v6.yaml's own EMPTY-NULL case battery (absent,
        null, empty-string, whitespace-only "   \t  ", and
        "/dev/disk9s99999x") independently arrives at the identical 5
        outcomes (4 STOP + 1 PASS) via the identical normalization trace.
        My hand-instantiation was performed against the rule TEXT, not
        copied from this file, and agrees with it exactly.
      additional_observation_not_required_by_my_battery: >-
        Not part of my assigned 5-shape battery, but noted for completeness:
        step_1_trim is defined as ASCII whitespace only (space, tab, newline,
        CR). A field consisting solely of a non-ASCII/zero-width character
        (e.g. U+200B) would NOT be trimmed to "" by step_1 and would
        therefore NOT be caught by step_3's zero-length test, nor does it
        match the literal "null" test -- it would PASS as
        not-empty-after-normalization despite being visually blank. This is
        a narrower, unexercised edge of the same objection class RT-J3-O1
        addresses. It is not one of the 5 shapes I was asked to instantiate,
        it is not something I am aware the schema or v5 rule ever claimed to
        cover, and I do not treat it as a J1 break -- I flag it as a
        limitation for the record because the sibling J3 joint's plan does
        list "zero-width characters" in its own battery and I want the
        Coordinator to have this cross-reference without my speaking to J3's
        verdict (which I do not own and did not evaluate).
      verdict: holds

    - item: "4. Nondegression"
      method: >-
        (a) Confirmed via git that receipt-schema-v2.yaml and
        j3-closure-v5.yaml each have exactly ONE commit in their entire
