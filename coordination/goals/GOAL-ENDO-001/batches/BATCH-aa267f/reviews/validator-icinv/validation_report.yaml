    findings: []
    notes: >-
      This check establishes only that the file was not modified. It does not
      establish that Arm A0 actually called the frozen functions rather than
      reimplementing them; that is a separate claim (execution report section 8,
      "shared set reproduces the committed functions' hit counts", 39
      cross-checks per run) which is OUT OF THIS TASK'S SCOPE and NOT verified
      here.

