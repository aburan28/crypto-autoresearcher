        correction's prose and not an error. Recorded because a later reader
        diffing the two strings would otherwise think one of us is wrong.
    - id: F-C3-2
      severity: material
      text: >-
        FALSE STATEMENT IN THE CORRECTION. `required_action` says: "The
        superseded run directories remain in place and are not deleted. Their
        supersession is declared from the superseding runs' own side." The
        first sentence is true. THE SECOND IS FALSE. I grepped every one of the
        19 run manifests: no manifest contains any `supersedes` /
        `superseded_by` field, and the only manifests mentioning supersession
