  - id: C4
    title: Was the terminal state emitted by code or chosen by a human?
    verdict: passed
    summary: >-
      EMITTED BY CODE, and I established it the strongest way available: I
      RE-EXECUTED the frozen decision rule read-only, from the currently
      committed harness code against the committed stage artifacts, and it
      reproduced the committed decision-rule-evaluation.json EXACTLY --
      43431 characters of canonical JSON, byte-equal.
    deciding_number: >-
      Re-executed `evaluate_decision_rule(s1s, s2s, s3s)` in-process (writing
      nothing, creating no run directory), loading the same nine stage records
      the committed run resolved. Canonical JSON of my output vs the committed
      artifact: EQUAL, 43431 == 43431 characters, after restoring the two keys
      the CALLER adds outside the rule (`source_run_resolution` and
      `null_first_evidence`; the rule itself returns neither, verified). Of 17
      top-level keys, 16 matched directly and the 17th was a caller-added key.
    checks:
      computed_inside_the_run:
        verified: true
        evidence: >-
          harness/run_fullgroup.py `evaluate_decision_rule`, lines 1131-1144:
          a single if/elif chain assigning a local `terminal`, returned at line
          1185 as "terminal_state". The decide branch (line 1394) calls it and
          writes the result. Nothing reads a terminal state from a file, an
          argument, or an environment variable. command.txt is
          `python3 -m harness.run_fullgroup --stage decide` -- no state is
          passed on the command line.
      written_to_decision_rule_evaluation_json:
        verified: true
        path: experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-fg-decision/decision-rule-evaluation.json
        value: INVALID
        corroborating_records: >-
          manifest run.result.metrics.terminal_state = "INVALID",
          run.result.valid = false, run.result.invalid_reason naming the SR3
          rule, and stdout.log line 6 "TERMINAL STATE: INVALID" / line 11
          "INVALIDATION: Arm A0 failed the baseline-reproduction control
          (p=6007)".
      invalid_is_state_0_and_first_in_the_frozen_order:
        verified: true
        contract: >-
          specification.yaml `frozen_decision_rule.evaluation_order`
          ("evaluated STRICTLY IN THIS ORDER and the first that fires is the
          run's verdict"), then state_0_INVALID, state_1_PREMISE_FAILED,
          state_2_OUTCOME_A, state_3_OUTCOME_B, state_4_OUTCOME_C.
        code: >-
          The if/elif chain tests in exactly that order:
          `if invalidations: "INVALID"` / `elif premise_failed:
          "PREMISE-FAILED"` / `elif aggregate == "COLLAPSES": "OUTCOME-A"` /
          `elif aggregate == "PERSISTS" and S == "POSITIVE": "OUTCOME-B"` /
          `elif aggregate == "PERSISTS" and S == "NEGATIVE": "OUTCOME-C"`.
          The final `else` sets INVALID and appends an explicit
          "decision rule reached no state" invalidation rather than guessing --
          that branch did not execute (the invalidations list contains exactly
          one entry and it is the SR3 rule).
      no_outcome_state_reached:
        verified: true
        numbers:
          terminal_state: INVALID
          invalidations_count: 1
          invalidations_entry: 'rule "Arm A0 failed the baseline-reproduction control", p 6007'
          premise_failures_count: 0
          premise_failures_note: empty list, so state_1 did not fire
        independent_replay: >-
          I re-applied the CONTRACT's evaluation order by hand to the record's
          own reported values (invalidations non-empty; premise_failures empty;
          aggregate PERSISTS; S NEGATIVE) and obtained INVALID, agreeing with
          the record. The deciding input -- gate_passed false at p = 6007 --
          I verified independently under C2 from the measured 1.2315293 (fb=4)
          and 1.1125313 (fb=5) against the frozen floor 1.3.
      metric_set_does_not_depend_on_which_state_fired:
        verified: true
        structural_argument: >-
          Every metric field is computed UNCONDITIONALLY, above or beside the
          if/elif chain, and returned unconditionally: `per_prime` (loop ending
          line 1114), `verdicts` (1115), `n_persist`/`n_collapse` (1117-1118),
          `aggregate` (1125), `S` (1129), `sensitivity` (1147-1153, after the
          chain but not guarded by it). The chain assigns one string. No metric
          is inside a branch.
        empirical_confirmation: >-
          The committed record, whose terminal state is INVALID, nonetheless
          carries every metric: per_prime for all three primes,
          persistence_verdicts, aggregate_persistence PERSISTS, majority_counts
          {PERSISTS: 2, COLLAPSES: 0}, majority_shape "2-0",
          stratification_verdict NEGATIVE, stratification_positive_primes [],
          null_first_evidence for all three primes, the full `inputs` constant
          block, source_run_resolution, and ALL NINE seed x T sensitivity
          combinations. 13 of 13 required metric keys present, 0 missing.
    findings:
    - id: F-C4-1
      severity: material
      text: >-
        THE ASYMMETRY A REVIEWER MUST SEE, STATED PLAINLY. Had the SR3
        invalidation not fired, the same chain on the same numbers would have
        emitted OUTCOME-C (aggregate PERSISTS, S NEGATIVE) -- which under the
        contract's own falsification_criterion (F-i) REFUTES H-ICINV-6c7920:
        "the over-dispersion survives a certified full-group sampler, so it is
        not a coverage artifact". So the invalidation blocked an outcome
        adverse to the hypothesis under test. I checked for outcome shopping
        specifically because of this and found NONE: the gate is frozen in an
        approved contract, its firing is reproducible from a number I
        re-derived myself, the chain is fixed order, and the full persistence
        and stratification statistics were computed and written anyway. But the
        incentive gradient is real and it points at the SUCCESSOR: the
        amendment CORR-20260807-14431d requires must not be designed in a way
        that avoids reaching OUTCOME-C. This should be an explicit constraint
        on the amendment, and neither correction states it.
    - id: F-C4-2
      severity: minor
      text: >-
        `run.code.dirty` is TRUE in the decision run's manifest, at commit
        d2c311fd3be9f07453ea2852ce6d0a3090141409 (which IS an ancestor of
        HEAD). The run's `integrity` block hashes ONLY harness/exp_icinv.py --
        neither harness/exp_icinv_fullgroup.py nor harness/run_fullgroup.py,
        i.e. the two modules that actually computed the terminal state, is
        hash-pinned in any run record. Taken alone that would leave "emitted by
        code" verifiable only for code that cannot be identified. My read-only
        re-execution neutralises this FOR THE DECISION RECORD specifically:
        the currently committed code reproduces that artifact exactly. It does
        NOT neutralise it for the seventeen MEASUREMENT runs, which I did not
        re-execute. A successor contract should hash-pin every harness module a
        run loads, not just the one the edit prohibition names.
    - id: F-C4-3
      severity: informational
      text: >-
        SR6's clause "the set of reported metrics does not depend on which
        state fired" is satisfied by the decision rule. Note a DIFFERENT and
        legitimate reduction that a hasty reader could conflate with it: SR3's
        halt did suppress measurement at p = 6007 (no Arm B persistence
        statistic, no cell-aggregates.json, no committed_hit_checks). That is
        SR3 stopping the RUN, not the terminal state selecting the REPORT, and
        the Executor records it explicitly in section 6 of the execution report.
        The two mechanisms are distinct and only the second would be outcome
        shopping.
    not_verified:
    - >-
      That the seventeen measurement runs' artifacts are reproducible from
      committed code. I re-executed only the decision rule. `dirty: true`
      applies to those runs as well and they are not module-hash-pinned.
    - >-
      The nine underlying stage records' internal statistics (F_p, VR_pooled,
      chi-square bands, the variance-decomposition identity) were not
      recomputed from per-curve data. My re-execution consumed them as inputs.

