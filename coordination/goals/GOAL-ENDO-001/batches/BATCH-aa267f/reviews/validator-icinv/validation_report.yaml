      identical_at:
      - worktree (HEAD, clean)
      - 02487c19 (approval receipt commit named by the task)
      - ed04d107 (the approval snapshot commit the receipt binds)
      - HEAD (2d75b6c5)
      commits_touching_path_in_02487c19..HEAD: 0
    corroboration: >-
      All 19 run records under experiments/EXP-ICINV-4d33aa/runs/ carry
