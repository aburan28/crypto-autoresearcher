    checks (C1-C5) against the completed execution of EXP-ICINV-4d33aa and
    nothing else. It is not a full-scope validation of the run, the contract,
    the instrument, or the campaign. Anything outside C1-C5 is unchecked and is
    listed in `limitations`.
  reviewed_snapshot:
    branch: claude/ecdlp-endomorphism-analysis-4m2w3z
    head_commit: 2d75b6c5cca33cf9616b115250cbdba2c38ed262
    approval_snapshot_commit: ed04d107612e47d5f0ba4a9a80a716797d56bfe0
    approval_snapshot_receipt_commit: 02487c1918fca88051b5ff3bf3248e648d9857a8
    worktree_dirty: false
    worktree_only_artifacts: none
    committed_check: >-
      `git status --porcelain` is empty and every artifact cited below is
      tracked in HEAD (`git ls-files --error-unmatch` on the run artifacts
