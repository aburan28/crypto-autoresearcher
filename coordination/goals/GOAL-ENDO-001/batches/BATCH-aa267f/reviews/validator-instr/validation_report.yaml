  # ======================================================================
  # what this report does NOT do, and what it did not check
  # ======================================================================
  limitations:
    authority_limits:
      - This report changes no research status, writes no evidence record, and edits no raw artifact.
      - >-
        A passing report makes these five receipts ADMISSIBLE. It does NOT
        support an ECDLP claim, does NOT demonstrate a speedup, does NOT
        establish that NULL-C should be replaced or that it should be retained,
        and does NOT authorize promotion or closure of GOAL-ENDO-001 or of any
        hypothesis. Tier remains TOY and sota_delta remains zero on every axis.
      - >-
        C1 passing means the cheap arithmetic refutation of the "committed 664x
        is the group order" diagnosis did not fire. That is the ABSENCE of a
        refutation, not evidence for the diagnosis.
      - >-
        C2 passing means the eleven functions did not CHANGE. It does not mean
        their behaviour is correct; CORR-20260807-a05e1e and CORR-20260807-9f83be
        record that two of them were defective and one is still confounded.
    not_checked:
      - >-
        THE CANONICAL ARTIFACT TELL WAS NOT CHECKED. docs/inventor-protocol.md
        section 3 makes the decay of a quantity against the parameter meant to
        destroy it the deciding test, and this contract's own
        `what_non_decay_means` says so. The run reports NON-MONOTONE ratio
        verdicts in 17/36 cells at POOL_A, 18/36 at POOL_B, 23/36 at POOL_C and
        16/36 at POOL_D along the N ladder, and attributes most of them to Monte
        Carlo noise near R = 1. I did not verify a single one of those counts,
        the CTRL-NSURR surrogate curves they are read against, or the
        attribution. This is the largest unchecked item and it is the one most
        likely to matter.
      - S0 pool freeze, class_census completeness at either prime, and the realized pool tables.
      - S2 committed-fixture reproduction (all 11 fixtures) - only the two S1 fixtures were recomputed.
      - S3 measurement - the per-curve functional values, CTRL-TWIST, and the liftable-count identity counts.
      - CTRL-NSURR entirely, including whether the ESTIMATED slopes and their standard errors are right.
      - CTRL-POWER beyond the delta=0 row - the power curves, delta*, and the two_class_block flagging.
      - Whether the 200 replicate draws of any control were generated as the declared seed rule specifies; controls.json stores no per-replicate p-values, and re-running writes outside my write scope.
      - The determinism_requirement (bit-for-bit reproduction of any arm from its declared tuple) - not exercised.
      - Budget, timing, throughput and resource records, including the claimed 28000 permutations/second and the 0.97 CPU-hour total.
      - Deviations D2-D5 and D7-D17 individually, except where they intersected C1-C5.
      - SC1-SC8 as success criteria, and the P1-P8 scorecard other than P1, P2 and P4's p-hat sub-clause.
      - The contract's own approval provenance and whether the user authorization it records actually occurred.
      - Whether harness/run_blocknull.py implements the declared blocking, statistics and permutation semantics correctly in general; I exercised only _Layout.statistics and the frozen-function boundary.
    method_limits:
      - >-
        For C5(c) I reconstructed a candidate pre-repair kernel because the real
        one is unrecoverable. A reconstruction that reproduces the mechanism is
        not proof that the reconstruction is what ran.
      - >-
        For C3 I verified the interval, the classification and the counting, not
        the underlying draws.

