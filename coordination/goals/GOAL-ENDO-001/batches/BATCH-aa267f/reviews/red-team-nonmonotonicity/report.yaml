  claim_under_review: >-
    execution_report.md section 12 item 3: "Non-monotone ratio verdicts along
    the N ladder occur in 17/36 cells at POOL_A, 18/36 at POOL_B, 23/36 at
    POOL_C and 16/36 at POOL_D (functional x statistic). ... Most non-monotone
