  scope_note: >-
    SINGLE TARGET, DELIBERATELY NARROW. This report attacks EXACTLY ONE
    unexamined attribution: the execution report's claim (section 12, item 3)
    that the non-monotone ratio verdicts along the N ladder are Monte-Carlo
    noise. Nothing else in EXP-INSTR-85b102 is reviewed. Two independent
    Validators passed ten enumerated checks on this batch and both recorded
    this item as NOT CHECKED (validator-instr `limitations.not_checked`, first
