    functional-by-functional.

  authority_limits:
    - This report changes no research status, writes no evidence record, edits no raw artifact, and commits nothing.
    - >-
      It is written under the assigned write_scope only. Hand this path to the
      Coordinator's ledger archive task for a durable commit; the Red Team does
      not commit in a shared worktree.
    - >-
      Finding a control void is not finding the underlying phenomenon absent.
      The disposition of the 50/144 residue is UNDETERMINED and this review does
      not close it; what it closes is the claim that CTRL-VALUESHUFFLE
      determined it.
    - >-
      Nothing here weakens the two Validators' passed checks, the S1/S2 gates,
      the frozen-function receipt, the CTRL-NULLOBJ 28/28 size calibration, the
      D6 stopping-rule disposition, or the pre-registered contradiction of
      IDEA-20260807-34754f. All stand exactly as recorded.
    - >-
      A negative verdict on this control is not a statement that the lane is
      dead. Per docs/inventor-protocol.md section 4 the named obstruction is
      stated (Delta_max does not order the null means of N-uncoupled
      functionals; the residue statistic sees only N-band assignment) and the
      forward guidance names what remains open (the version-1 blocked
      conditional test's `two_torsion_x` rejection at POOL_C and POOL_D).

  reproduction:
    note: >-
      Every number in this report was computed by this reviewer from the
      committed artifacts. Scripts were written in a session scratchpad and are
      NOT research artifacts; each is short enough to restate. The operations,
      in order: (1) re-implement the verdict rule and run it on both ratio
      fields in all 144 cells of the four operative results.json, asserting
      agreement with the committed boolean; (2) re-derive T_obs and the
      closed-form null mean from per_curve.csv + rung_table.json using the
      specification's formulas with no harness import, and compare to the
      committed values in 720 cells; (3) rebuild the residue pipeline
      independently and confirm the observed 50 and per-pool 10/10/16/14;
      (4) test ladder nestedness at all 16 adjacent rung pairs; (5) run 30
      within-class and 30 within-finest-block shuffles; (6) run 300 free
      shuffles retaining the full cell bitmap and confirm the committed null;
      (7) run 60 pure-N surrogate replicates; (8) compute R^2(value, N) and
      eta^2(value, finest band) per (pool, functional) and sweep exclusion
      thresholds; (9) recompute the 24/24 vs 74/120 contingency and its Fisher
