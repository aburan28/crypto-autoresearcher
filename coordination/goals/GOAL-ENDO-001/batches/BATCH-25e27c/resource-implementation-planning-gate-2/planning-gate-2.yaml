        - id: ARITH-9
          claim: 'the residual after removing the dominant term is 219032804608 bytes, about 51.0x the retained cap'
          worked: >-
            50449135844608-50230103040000 = 219032804608; 4294967296*50 =
            214748364800; 219032804608-214748364800 = 4284439808, which is less
