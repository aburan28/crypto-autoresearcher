      carried_from_the_first_gate_and_already_tool_verified_by_both_reviews:
        note: >-
          ARITH-1 through ARITH-5 were stated by the first gate as hand
          arithmetic, and BOTH independent reviews recomputed all five with tools
          and reported agreement with zero failures. They are carried here at
          their committed values and are NOT re-derived; the tool verification
          is the reviews' and is cited as theirs.
        ARITH_1: '2*20000*13*5 = 2600000'
        ARITH_2: 'ceil(50449135844608/536870912) = 93969'
        ARITH_3: '48*3600*0.8 = 138240'
        ARITH_4: 'floor(0.8*8589934592) = 6871947673'
        ARITH_5: '25*1073741824 = 26843545600'
      new_in_this_gate:
        - id: ARITH-6
          claim: 'the eight retained-byte components sum to the declared total 50449135844608'
          worked: >-
            16777216+123806592000 = 123823369216; +528640000 = 124352009216;
            +94658793216 = 219010802432; +769600 = 219011572032; +21059584 =
            219032631616; +172992 = 219032804608; +50230103040000 =
            50449135844608
          result: agrees_with_the_declared_total
