        NOT A CLOSURE AND NOT A RECOMMENDATION TO CLOSE. It is an estimate
        section reporting that a declared serialization budget does not fit a
        declared cap set. It says nothing about JINV, about isogeny classes,
        about any hypothesis, or about ECDLP, in either direction, at any scale.

