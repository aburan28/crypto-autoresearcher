schema: crypto.autoresearch.resource_and_implementation_planning_gate.v1
planning_gate:
  id: PLANGATE2-GOAL-ENDO-001-BATCH-25e27c
  task_id: <ALLOCATE-TASK-ID>
  task_id_note: >-
    LITERAL PLACEHOLDER, NOT AN IDENTIFIER. This session has no shell and could
    not run 'python3 tools/allocate_id.py --next task --date 20260819' nor
    --check the result. Every <ALLOCATE-...> token in this file is a placeholder
    of the same kind the BATCH-25e27c package used for PENDING-ALLOCATION, and
    for the same reason: a 6-hex token must be minted without scanning state, and
    guessing one is the collision failure AGENTS.md rule 14 exists to prevent.
    NO IDENTIFIER WAS INVENTED HERE AND NONE MAY BE.
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-25e27c
  experiment_id: EXP-JINV-bd141d
  work_unit_slug: resource-implementation-planning-gate-2
  role: coordinator
  recorded_at: '2026-08-19'
  document_kind: static_nonautomatic_resource_and_implementation_planning_gate
  document_status: authored_pending_batch_opening_decision_and_two_independent_reviews
  experiment_runs_executed: 0
  experiment_runs_authorized: 0
  supersedes_nothing: true
  supersedes_nothing_note: >-
    THIS DOCUMENT EDITS NOTHING AND SUPERSEDES NOTHING. The BATCH-25e27c
    planning-gate package at snapshot 7ee825ff9849542d681e02781fcaaa21a36ca5fb
    is IMMUTABLE and was not touched, corrected, normalized, or rewritten by
    this session. This is a SECOND gate authored beside it, in its own work-unit
    directory, at the same scope. Where this gate differs from the first, the
    difference is stated in objection-disposition.yaml against the objection
    that produced it, so a reader can see what changed and why without diffing.

  # ==================================================================
  # ADMISSION STATUS - read this before treating the document as work
  # ==================================================================
  admission_status:
    authored_under: >-
      The GOAL-ENDO-001 goal-head next_action as reconciled 2026-08-19 and
      recorded in DEC-20260819-3ef73a, which directs a SECOND bounded
      nonautomatic resource-and-implementation-planning gate at UNCHANGED SCOPE
      and adds four constraints C-A, C-B, C-C, C-D.
    batch_opening_decision_for_this_second_gate: not_read_by_this_session
    batch_opening_decision_search_performed:
      method: filename_glob_only
      pattern: 'ledger/decisions/DEC-20260819-*.yaml'
      root: 'the working tree of branch claude/endo-001-gate2-20260819'
      matches_returned: 1
      the_single_match: ledger/decisions/DEC-20260819-3ef73a.yaml
      what_that_match_is: >-
        The goal-head reconciliation itself, which is NOT a batch-opening
        decision. Its own projection_integrity note states in terms that NO
        BATCH IS OPENED, CLOSED, OR CHECKPOINTED by it and that the action it
        records is nonautomatic.
      method_limitation_stated_because_R_10_binds: >-
        THIS IS A FILENAME GLOB, NOT A CONTENT SEARCH, AND IT IS NARROWER THAN
        ANY ABSENCE CONCLUSION WOULD BE. A batch-opening decision for this
        second gate carrying any other date token would not appear in it, and
        this session ran no content search over ledger/decisions/ and holds no
        shell with which to run one. THIS DOCUMENT THEREFORE ASSERTS NO ABSENCE.
        Whether a batch-opening decision for this gate exists is UNDETERMINED BY
        THIS SESSION and is a question for the session that can search.
    consequence_stated_plainly: >-
      A planning document authored against a goal-head next_action is a PLAN
      whatever its admission status, and this one authorizes nothing under any
      reading. But a reader must not infer from its existence that a batch was
      opened for it, that a dispatch queue exists, that task budgets were
      declared, or that two independent reviews were commissioned. NONE OF THAT
      IS ESTABLISHED HERE. This gate is complete as a document and INCOMPLETE as
      a work unit, and the second of those is the honest half to say out loud.
    what_would_make_it_a_work_unit: >-
      A separately authorized Coordinator batch-opening decision naming this
      work-unit slug, a dispatch queue with non-null budgets in every handoff, a
      snapshot archive run alone, two independent review-adversarial xhigh
      reviews in disjoint fresh sessions, and a ledger archive run alone whose
      post-commit verification the dispatcher accepts. Until then nothing here
      is durable evidence of anything.

  # ==================================================================
  # WHAT THIS IS
  # ==================================================================
  what_this_document_is: >-
    The SECOND bounded NONAUTOMATIC resource-and-implementation-planning gate
    for EXP-JINV-bd141d Phase B, authored at the UNCHANGED SCOPE the
    GOAL-ENDO-001 goal-head next_action fixes. It BEGINS FROM the fail-closed
    resource_incomplete disposition and LEAVES IT THERE. It specifies the six
    contents that next_action names in its own words - estimates, budgets,
    stopping rules, controls, artifacts, and a fresh authorization boundary - and
    it preserves the eighteen obligations that next_action lists, bound BY EXACT
    REFERENCE in the sibling file preservation-binding.yaml rather than
    re-transcribed. It exists because the first attempt at this gate
    (BATCH-25e27c, TASK-20260815-f04b54) drew REVISE from both of its
    independent reviews and was recorded by DEC-20260818-c52d54 as NOT APPROVED
    AS A FINAL GATE with ten standing material objections. Those ten are disposed
    one at a time in objection-disposition.yaml.
  what_this_document_is_not: >-
    It is not an approval, not a contract, not an amendment, not a protocol
    change, not a resource change, not a dispatch, not a schedule, and not a
    measurement. It contains no observation, no run, no timing, no statistic,
    and no curve, target, plant bank, or null bank. It is not a decision record
    and it opens no work unit.

  # ------------------------------------------------------------------
  # PROVENANCE RULE - deliberately SCOPED, not universal
  # ------------------------------------------------------------------
  provenance_rule_for_the_numbers_in_this_document:
    the_rule: >-
      Every number in this document falls into exactly one of four declared
      classes, and its class is stated where the number appears: (1) READ, cited
      to the committed artifact and field it was read from; (2) HAND-ARITHMETIC,
      derived from READ numbers by integer arithmetic written out in full so a
      reviewer with a shell can recompute it in one command, and marked
      tool_verified false; (3) PRECEDENT-CITED, equal to a figure declared for a
      different task in a committed record, cited to that record and EXPLICITLY
      NOT DERIVED; (4) UNDERIVED, disclosed as underived with its reason in
      underived-register.yaml.
    why_this_is_scoped_and_not_universal: >-
      BECAUSE THE FIRST GATE MADE THE UNIVERSAL VERSION OF THIS CLAIM TWICE AND
      FIFTEEN OF ITS OWN NUMBERS FALSIFIED IT. DEC-20260818-c52d54 ruling R-2
      recorded those two universal self-claims as FALSE AS STATED and true only
      of the estimates section. This document therefore does not make a
      universal claim about itself. It makes a four-class claim with an explicit
      register, and the register is a separate file so it can be checked against
      the document rather than taken on trust.
    class_3_carries_a_warning_it_must_not_lose: >-
      A PRECEDENT-CITED figure is NOT a derived budget and must never be quoted
      as one. It is a declared ceiling for a DIFFERENT task, and
      DEC-20260815-f7e2d4 says of those very ceilings 'Both figures are
      arithmetic sums of DECLARED CEILINGS, not predictions of duration and not
      measurements. Nothing has run.' Class 3 is stronger than bare assertion
      and weaker than derivation, and it is labelled as its own class precisely
      so the difference cannot be lost in a summary.
    binding_effect_of_R_2_honoured_here: >-
      DEC-20260818-c52d54 R-2 binds every successor: 'NO LATER DECISION MAY CITE
      ANY OF THE FIFTEEN MAGNITUDES AS A DERIVED BUDGET.' This document cites
      none of them as derived. Six of the fifteen are re-stated as class 3
      PRECEDENT-CITED with their committed antecedents named; nine are moved to
      class 4 UNDERIVED; and no envelope total over them is asserted at all.

  # ==================================================================
  # AUTHORIZES NOTHING
  # ==================================================================
  authorizes_nothing:
    statement: >-
      THIS GATE AUTHORIZES NOTHING. It does not authorize implementation. It
      does not authorize Phase B. It does not authorize any control or
      experiment. It does not authorize target or curve access. It does not
      authorize JINV or transport work. It does not authorize N18. It does not
      authorize science. It does not authorize status change. It does not
      authorize ECDLP work or any ECDLP claim. It does not authorize closure. It
      does not authorize breakthrough. It does not authorize publication. It
      does not authorize network write. It does not authorize execution. It is a
      static planning document and nothing else. Nothing in it becomes
      automatic, scheduled, presumed, or pre-approved by having been written
      down here, and no later reader may treat any PROPOSED item below as
      granted.
