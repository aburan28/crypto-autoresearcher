      asserts no speedup. There is no Pareto frontier for it to be dominated on,
      and inventing a comparison with Pollard rho, BSGS or any ECDLP baseline
      would be a category error. THIS IS A REASONED not_applicable WITH ITS
      REASON STATED, NOT A BARE NULL.
