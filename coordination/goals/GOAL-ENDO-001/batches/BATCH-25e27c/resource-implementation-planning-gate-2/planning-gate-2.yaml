        The estimating work has been done to the limit of what a zero-run static
        document can do: eight items each with method, inputs, units and
        uncertainty, and the four that cannot be derived without a measurement
        disclosed as underived with their reasons in a separate register. THE
        RESULT IS WORSE THAN THE FIRST GATE REPORTED, AND IT IS NOT MEANT TO BE
        ENCOURAGING. The four byte, artifact, shard and I/O gates are not four
        independent failures but one structure; the dominant term in that
        structure exceeds the retained cap by roughly 1.17e4 on its own; and
