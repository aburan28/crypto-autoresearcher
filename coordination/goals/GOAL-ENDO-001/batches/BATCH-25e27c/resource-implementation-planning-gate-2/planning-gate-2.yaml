          (b) This gate is ZERO-RUN and STATIC and executes no benchmark, no
          runner and no instrument. (c) This session has no shell and could not
          have measured anything had it been permitted to. (d) Extrapolating from
          historical JINV timings is not available as a substitute: preservation
          obligation 17 leaves two harness paths omitted and uncured with
          retroactive normalization prohibited, so no source-pinned historical
          rate exists to extrapolate from.
        forbidden_substitutes: >-
          No value is invented, interpolated, guessed, carried over from another
          experiment, or back-filled from a desired conclusion. A missing
          estimate stays missing.
      E2:
        estimate_id: E2
        quantity: wall-clock time per run and per shard of the protocol-v7 Phase B workload
        units: 'seconds per run, against cap 21600; and seconds per shard'
        gate_state_read: FAIL_MISSING_ESTIMATE
        status: UNDERIVED_DISCLOSED
        register_entry: UR-2
        method_that_would_derive_it: >-
          Per-stage wall-seconds rate x stage cardinality, summed, then divided
          by the declared shard plan and by the declared parallelism, with the
          parallelism assumption stated explicitly and host load averages
          recorded at start and at every stage boundary.
        inputs_that_exist: 'the nine exact stage cardinalities; the committed shard-count lower bound 93969'
        inputs_that_do_not_exist: 'every per-stage wall-seconds rate; the parallelism the host would actually deliver; the shard plan itself'
        uncertainty: 'UNQUANTIFIED. See E1.'
        why_not_derived_here: same four reasons as E1
        optimism_warning: >-
          Any future wall-clock estimate that divides a serial total by an
          assumed parallelism is OPTIMISTIC BY CONSTRUCTION and must declare that
          assumption in the same field as the number. A shard count of at least
          93969 against a frozen maximum_runs_or_shards of 24 means the division
          is not available at all under current caps.
        load_spread_warning_added_in_this_gate: >-
          RT-O4. The committed E14 C1 precondition restated verbatim under
          budgets records a host that has recently run between load 18 and 116 on
          14 cores. A load spread of that size is a wall-time spread of the same
          order, so any future wall estimate must report the load under which it
          was taken or it is not comparable with any other.
      E3:
        estimate_id: E3
        quantity: peak resident memory of the protocol-v7 Phase B workload
        units: 'bytes, against memory_preflight_80_percent_bytes 6871947673 and maximum_memory_bytes 8589934592'
        gate_state_read: FAIL_MISSING_ESTIMATE
        status: UNDERIVED_DISCLOSED
        register_entry: UR-3
        method_that_would_derive_it: >-
          Maximum over the nine stages of the measured peak resident set size for
          that stage at its exact cardinality, or a proven implementation bound -
          a streaming design whose live-set size is bounded by construction and
          argued, not measured.
        inputs_that_exist: >-
          The nine exact stage cardinalities; and the temporary_working_bytes
          estimate 1610612736 against cap 17179869184, which the worksheet
          records as the ONE PASSING check (temporary_working_check.pass true),
          read first-hand by this session.
        inputs_that_do_not_exist: the peak resident set size of any stage under any implementation
        uncertainty: 'UNQUANTIFIED. See E1.'
        why_not_derived_here: same four reasons as E1
        do_not_confuse: >-
          temporary_working_bytes PASSING IS NOT A PEAK-MEMORY ESTIMATE AND MUST
          NEVER BE CITED AS ONE. They are different quantities against different
          caps, and only the first has a committed value. Substituting the one
          passing check for the missing estimate would be the cheapest available
          way to make a gate look like it had moved, and it is refused by name.

