    placeholder_token_form: '<ALLOCATE-...>'
    placeholder_token_note: >-
      This gate uses the angle-bracket form rather than the first gate's
      PENDING-ALLOCATION, for the same reason and with the same effect: it is not
      a 6-hex token and cannot collide with a real one. The two forms are
      interchangeable in intent; the difference is cosmetic and is recorded so no
      reader treats it as significant.
