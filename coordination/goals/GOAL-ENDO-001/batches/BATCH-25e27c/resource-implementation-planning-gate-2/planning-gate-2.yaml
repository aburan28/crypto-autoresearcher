    single_host_assumption_stated_explicitly_in_this_gate:
      why: >-
        RT-O12 SUSTAINED AS A NARROW GAP. The first gate charged time, memory,
        retained bytes, largest single artifact, shard count, logical I/O and
        free disk, but charged NO communication or network cost, and the
        single-host reading that makes that legitimate was never written down as
        an assumption.
      the_assumption: >-
        EVERY ESTIMATE E1 THROUGH E8 ASSUMES ONE DECLARED EXECUTION HOST. No
        estimate charges communication, network transfer, or cross-host
        coordination cost, and no cell exists in which to record one.
      the_condition_under_which_it_fails: >-
        E6 requires at least 93969 shards. If any future design distributed those
        shards across hosts, communication would become a real and possibly
        dominant term with nowhere to be recorded, and every estimate here would
        understate that design's cost. A distributed design is therefore OUTSIDE
        the scope of these estimates and would need its own cost model.
      direction: 'CONSERVATIVE - stating it can only reveal uncharged cost, never remove charged cost'

