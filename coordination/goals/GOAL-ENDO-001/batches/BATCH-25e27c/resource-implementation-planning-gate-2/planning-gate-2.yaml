  # ------------------------------------------------------------------
  # 6. A FRESH AUTHORIZATION BOUNDARY
  # ------------------------------------------------------------------
  fresh_authorization_boundary:
    label: a fresh authorization boundary
    nature: >-
      THIS IS A DESCRIPTION OF A BOUNDARY, NOT A GRANT OF ONE. READING THIS
      SECTION CONFERS NOTHING. It states what a later, separately authorized
      Coordinator decision would have to grant explicitly, what such a decision
      would STILL not grant, and what evidence it would have to see before it
      could be written at all.
    what_a_later_decision_would_have_to_grant_explicitly:
      - 'A named, budgeted authorization for PB-1 (read-only host preflight refresh), stating explicitly that it materializes nothing and consumes no experiment run identifier, and stating the prior that the committed observation already fails this gate by about 14.83x.'
      - 'A named, budgeted authorization for PB-2 (rate-constant derivation), stating explicitly whether it is separable from instrument execution and refusing it if it is not, and DECLARING THE REDUCTION FACTOR AND CARDINALITIES at which the rate is to be measured.'
      - 'A named authorization for PB-3 (implementation design against the frozen caps), which is static authoring and creates no evidence, and which must either supply a sharded logical-I/O model or record that the logical-I/O gate cannot be settled on paper.'
      - 'Independent review authority for PB-4, at review-adversarial, xhigh, non-degradable, in two disjoint independent sessions REQUIRED TO USE DIFFERENT CONSTRUCTIONS and not merely different sessions.'
      - 'Archive authority for PB-5, content-first, run alone, post-commit verified, with the snapshot and ledger tiers budgeted as separate tasks.'
      - 'Separately and additionally: any change to a frozen resource cap, which is a RESOURCE CHANGE and is not implied by any estimate, any design, or any review verdict.'
    a_list_of_this_shape_can_steer_and_that_is_recorded: >-
      THE VALIDATOR FLAGGED THIS EXACT STRUCTURE IN THE FIRST GATE: a six-item
      list mapping one-to-one onto PB-1..PB-5 plus a cap change 'can steer a
      successor toward approve the menu'. It concluded the section describes and
      does not grant, and this gate keeps the same structure because the mandate
      requires stating what a later decision would have to grant. THE
      COUNTERWEIGHT IS KEPT EXPLICIT: EV-PRE-3 names lane closure as one of two
      honest routes and this gate recommends NEITHER, and EV-PRE-1 is now scoped
      so that closure is reachable without running any of the six.
    what_such_a_decision_would_still_not_grant:
      - implementation of the Phase B workload
      - Phase B execution
      - any control run, experiment run, instrument run, or JINV run
      - target or curve access
      - JINV or transport work
      - N18 implementation, contracting, or approval
      - any scientific interpretation
      - any research-status, hypothesis-status, experiment-status, or goal-status change
      - any ECDLP work or ECDLP claim
      - closure of the goal or of any lane
      - any breakthrough claim
      - publication of any claim
      - any transfer of a one-N N=19507 toy statement to a second N or to cryptographic scale
      - any credit against resource_incomplete by compression, deduplication, hash-only substitution, omitted cells, or budget widening
      - resolution of OBD-1, which requires its own separately authorized goal-head reconciliation
      - any edit to the first gate's package, to either review artifact, or to any committed ledger record
    evidence_such_a_decision_would_have_to_see_first:
      - id: EV-PRE-1
        status: RESCOPED_IN_THIS_GATE
        closes: RT-O8
        scope_of_this_precondition: >-
          APPLIES ONLY TO A DECISION THAT WOULD AUTHORIZE MATERIALIZATION ON A
          HOST. A CLOSURE DECISION AND A CAP-CHANGE DECISION REQUIRE NO HOST
          OBSERVATION AND ARE NOT BLOCKED BY THIS PRECONDITION.
        requirement: >-
          For a decision that would authorize materialization on a host: a
          CURRENT free-disk observation on the declared execution host, replacing
          the inherited, unrefreshed v3 statfs (E8), recorded with host,
          filesystem, and timestamp - OR an explicit written statement that no
          such observation is available and that the decision proceeds without
          one, which fails the frozen preflight minimum by construction.
        why_the_rescope_was_necessary: >-
          RT-O8 SUSTAINED. As first written, EV-PRE-1 offered no alternative
          while its siblings did, and its block was scoped to 'evidence such a
          decision would have to see FIRST', where 'such a decision' was ANY
          later authorizing decision. EV-PRE-3 itself names the two honest
          remaining routes as a separately authorized cap change or closure of
          this lane with its obstruction named, AND NEITHER OF THOSE NEEDS A
          STATFS. A planning document cannot make a run automatic by authorizing
          it - the first gate conspicuously did not - BUT IT CAN MAKE A RUN
          UNAVOIDABLE BY WRITING THE PRECONDITION LIST SO THAT EVERY EXIT RUNS
          THROUGH IT. A Coordinator who wanted to close this lane tomorrow with
          its obstruction named would have been told by the first gate that it
          must first see a host measurement. That was scheduling pressure inside
          a boundary description. NEITHER REVIEW CALLED IT AN AUTHORIZATION AND
          NEITHER DOES THIS GATE.
      - id: EV-PRE-2
        status: CARRIED_UNCHANGED
        requirement: >-
          Derived per-stage CPU, wall, and peak-memory rates (E1, E2, E3) with
          control CT-4 MEASURED - including the wall-rate load-dependence check
          and the cardinality-doubling check bound to all three quantities - or
          an explicit statement that they remain underived.
      - id: EV-PRE-3
        status: CARRIED_UNCHANGED_IN_SUBSTANCE
        requirement: >-
          A design that brings retained bytes, the largest individual artifact,
          the shard count, and total logical I/O within the frozen caps WITHOUT
          any prohibited credit - or an explicit written statement that it
          cannot, in which case only two honest routes remain visible from the
          committed record: a separately authorized resource-cap change, or
          closure of this lane with its obstruction named. THIS GATE CHOOSES
          NEITHER ROUTE AND RECOMMENDS NEITHER.
        what_AR_1_adds_to_the_difficulty_of_the_first_branch: >-
          Such a design must clear the dominant term by roughly 1.2e4 AND the
          residual by roughly 51. That is stated so a later decision is not
          surprised by it, and it is NOT a recommendation to take the second
          branch. Declining to search because a target looks hard is premature
          closure, which this program treats as symmetric with overclaiming.
      - id: EV-PRE-4
        status: CARRIED_UNCHANGED
        requirement: >-
          The status of the separate blockers that no estimate touches, each at
          its committed value as bound in preservation-binding.yaml: N18; the
          C-TRANSPORT-CERT with its four requirements; the second matched N; the
          one-N N=19507 toy ceiling; and the historical two-harness-path
          discrepancy. THIS GATE CHANGES NONE OF THEM AND DISCHARGES NONE OF
          THEM.
      - id: EV-PRE-5
        status: CARRIED_UNCHANGED
        requirement: >-
          The two-directional instrument control of completion criterion C4 and
          pause condition P1, UNDISCHARGED at the time of this writing. An
          instrument that has not both detected a plant and rejected a matched
          null cannot support a conclusion, so NO AMOUNT OF RESOURCE PLANNING
          REACHES A RESULT THROUGH IT.
      - id: EV-PRE-6
        status: CARRIED_UNCHANGED
        requirement: >-
          The separately recorded specification gap named as N17 in the
          GOAL-ENDO-001 goal head's retained superseded next_action note - the
          frozen EXP-JINV-bd141d specification.yaml instantiating no
          factor_base_sizes list and no target count - which that note records as
          blocking raw data collection regardless of the isogeny question. THIS
          GATE NEITHER ADJUDICATES NOR DISCHARGES N17; it is named because a
          later authorization would have to see its status, and because silently
          planning around it would be dishonest.
      - id: EV-PRE-7
        status: NEW_IN_THIS_GATE
        requirement: >-
          THE DISPOSITION OF OBD-1. Preservation obligation 6's clause admits two
          readings, and under the frozen contract's reading an approved,
          decision-cited manifest is bound by NO obligation at all. Both
          independent reviews confirmed and strengthened the defect. A later
          decision that relies on the obligation-6 binding must see whether OBD-1
          has been adjudicated by a separately authorized goal-head
          reconciliation, because it is not adjudicated here and this gate has no
          authority to adjudicate it.
      - id: EV-PRE-8
        status: NEW_IN_THIS_GATE
        requirement: >-
          THE RESULT OF RC-1, or an explicit statement that it remains
          unperformed. RC-1 is the zero-run static perturbation of the committed
          formula chain that the red team recommended and DEC-20260818-c52d54
          carried as item 1 of its single next action. It costs minutes, needs no
          host, consumes no run identifier, and has been performed by NO SESSION
          so far. This gate establishes the dependency algebraically instead, and
          says so, but the algebraic route is not RC-1 and does not replace it.
    boundary_self_check:
      does_this_section_grant_anything: false
      does_this_document_grant_anything: false
      is_any_item_above_scheduled: false
      is_any_item_above_automatic: false
      does_any_precondition_here_force_a_run_on_a_path_that_does_not_need_one: false
      does_any_precondition_here_force_a_run_on_a_path_that_does_not_need_one_basis: >-
        EV-PRE-1 is the only precondition naming a host measurement and it is now
        scoped to materialization decisions only, with closure and cap-change
        decisions excluded by name. The other seven need no host.

