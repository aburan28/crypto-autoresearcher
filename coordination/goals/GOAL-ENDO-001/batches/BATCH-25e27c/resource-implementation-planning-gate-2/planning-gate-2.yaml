  # ==================================================================
  # DISCHARGE OF THE FOUR HEAD CONSTRAINTS C-A .. C-D
  # ==================================================================
  head_constraint_discharge:
    C_A:
      constraint_as_read: >-
        Before authoring anything, read the two independent review reports
        (TASK-20260815-fa8f06 validator, TASK-20260815-3ec919 red team),
        EV-JINV-d080c6 and DEC-20260818-c52d54, then fold their REVISE findings
        in as explicit constraints. The head states that the session which wrote
        it COULD NOT READ ANY OF THEM and that no successor may treat that
        sentence as having summarized, anticipated, discharged or narrowed them.
      status: DISCHARGED
      how_discharged: >-
        All four were read IN FULL by this session, in the working tree of
        branch claude/endo-001-gate2-20260819, BEFORE any byte of this document
        was written: the validation report end to end (1430 lines, read in two
        contiguous passes), the red-team report end to end (1057 lines),
        EV-JINV-d080c6 end to end (994 lines), and DEC-20260818-c52d54 end to
        end (1053 lines). The preservation manifest (598 lines), the
        batch-opening decision DEC-20260815-f7e2d4 (546 lines) and the first
        gate itself (953 lines) were read in full as well, because a gate that
        fixes ten objections against a document it has not read would be
        guessing.
      what_the_reviews_actually_said_recorded_here_because_the_head_could_not: >-
        BOTH RETURNED REVISE AND NEITHER BROKE THE FACTUAL LAYER. Between them
        the two reviews recomputed 17 SHA-256 values, 11 sizes, 12 commits, 33
        arithmetic and cost values, 3 suite manifest hashes from an
        independently reconstructed canonical encoding, 1 recursive type
        manifest hash, a 441350-node census in all six categories, 26 committed
        formula fields, an eight-component byte sum and 2 budget totals, WITH
        ZERO MISMATCHES ON EITHER SIDE. All 18 obligations verified, 0 dropped,
        0 reworded, 0 silently resolved. Both looked for smuggled authorization
        by two different methods - exhaustive key enumeration and prose attack -
        and both found NONE; resource_incomplete stayed fail-closed with 0 gates
        cleared and 0 of the five prohibited credits taken, confirmed three ways
        by the validator and by a five-route attack by the red team. The REVISE
        verdicts rest on record integrity, provenance discipline, framing,
        control design, one stopping-rule gap and one archive-custody defect.
        The single most consequential finding ran AGAINST the producer: its own
        material finding MF-2 asserted an absence that the committed tree
        contradicts.
      folded_in_as_explicit_constraints_where: objection-disposition.yaml, one entry per objection
    C_B:
      constraint_as_read: >-
        Open binding defect OBD-1 remains OPEN and is NOT resolved here.
        Choosing which reading obligation 6 carries is a goal-head-interpretation
        act reserved to a separately authorized Coordinator decision; a producer
        may NEVER make it silently.
      status: HONOURED_BY_NOT_ACTING
      how_honoured: >-
        This gate selects NEITHER reading of the obligation-6 clause. All three
        candidate manifests remain bound, by reference, in
        preservation-binding.yaml. No sentence in this document states which
        manifests the clause means, ranks the two readings, or narrows either.
        OBD-1 is recorded as OPEN and UNRESOLVED with its authority statement
        cited to DEC-20260818-c52d54 ruling R-3.
      note_on_the_temptation_that_was_refused: >-
        Both reviews INDEPENDENTLY STRENGTHENED the case for reading B - the
        validator found the third manifest in nine committed places including
        the controlling decision and the neutral evidence record, and the red
        team established by direct computation that it hashes the list literally
        named type_alias_suite. That is a real accumulation of support, and
        acting on it here would still be the forbidden act, because the
        authority question is not how strong the case is but who may decide.
        The strengthening is RECORDED so the authorized decision can weigh it;
        it is not acted on.
    C_C:
      constraint_as_read: >-
        Material finding MF-2 is SUPERSEDED and must not be carried forward as a
        live finding; its absence claim is false, the value is present as
        '441,350' at line 624 of the committed v6 queue, and rule R-10 binds
        every successor.
      status: HONOURED
      how_honoured: >-
        MF-2 IS NOT RESURRECTED ANYWHERE IN THIS WORK UNIT. No sentence here
        asserts that 441350 is absent from any file, restates MF-2's claim, or
        treats obligation 8's provenance attribution as defective.
        preservation-binding.yaml carries MF-2's RETIREMENT (R-1) as a
        superseding note against obligation 8 and binds obligation 8 at its
        committed values unchanged.
      R_10_compliance_of_this_document: >-
        THIS DOCUMENT MAKES NO ABSENCE CLAIM ABOUT ANY COMMITTED ARTIFACT. That
        is the compliance route chosen deliberately: a session with no shell
        cannot run the exact search R-10 requires, so rather than record a
        weakly-searched absence it records none. The two places where an absence
        would otherwise have been natural to state are handled as follows. (1)
