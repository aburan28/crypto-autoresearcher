  # ------------------------------------------------------------------
  # THE FOURTEEN FORBIDDEN ITEMS, CHECKED ONE AT A TIME
  # ------------------------------------------------------------------
  fourteen_forbidden_items_self_check:
    where_the_fourteen_come_from: >-
      The closing sentence of the GOAL-ENDO-001 goal-head next_action, which
      states that the action 'is not automatic and does not itself authorize'
      the fourteen items enumerated below; and, in the same enumeration and the
      same order, the first limitation of DEC-20260815-f7e2d4. Both were read by
      this session and the two lists agree item for item.
    count: 14
    method_of_this_self_check: >-
      NOT A TEXT SEARCH AND NOT A TONE READING. Each of the fourteen was taken
      in turn and this Coordinator asked of its own draft the question the red
      team asked of the first package: is there any sentence, field, default,
      omission, or precondition ordering in this document that authorizes,
      presumes, schedules, or makes automatic this item. The answer is recorded
      per item below. THIS IS A MITIGATION PERFORMED BY THE AUTHOR ON ITS OWN
      TEXT, AND AN AUTHOR CHECKING ITSELF IS THE WEAKEST FORM OF THIS CHECK. It
      does not substitute for the two independent reviews, which own this
      surface and attacked it first and hardest on the first package.
    items:
      - n: 1
        item: implementation
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          PB-3 proposes implementation-DESIGN AUTHORING only, is marked
          experiment_runs_authorized 0, and is stated to require its own
          separately authorized decision. No sentence directs anyone to
          implement.
      - n: 2
        item: Phase B
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          Phase B appears only as the SUBJECT OF AN ESTIMATE. Every estimate
          E1-E8 carries 'what_this_estimate_does_not_do', and the resource
          disposition after all eight is resource_incomplete with 0 gates
          cleared. Estimating a workload is not scheduling it.
      - n: 3
        item: any control or experiment
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          CT-1..CT-5 are REQUIREMENTS ON A LATER MEASUREMENT, and the controls
          section opens by saying so. CT-3 is repaired and CT-4 rescoped in this
          gate; a repaired control is still an unmeasured control, and SR-8
          states that an unmeasured control is not a passed control.
      - n: 4
        item: target or curve access
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          No target, curve, plant bank, or null bank is named as accessible, and
          SR-6 stops any work that would touch one. The artifacts section lists
          plant banks, null banks, curve censuses and target files under
          'artifacts_this_gate_would_never_produce'.
      - n: 5
        item: JINV or transport work
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          jinv_work_authorized and transport_work_authorized are false, jinv
          runs 0, and the C-TRANSPORT-CERT blocker is carried at its committed
          status by preservation-binding.yaml with authorized_or_executed false.
      - n: 6
        item: N18
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          N18 appears only in EV-PRE-4 as a STATUS a later decision would have
          to see, carried at its committed value. n18_authorized is false.
      - n: 7
        item: science
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          scientific_interpretation_authorized is false. The obstruction this
          gate restates is a fact about a declared serialization budget and is
          labelled as such; reading it as a result about JINV, isogeny classes,
          or any mathematical object is refused explicitly in nonclaims.
      - n: 8
        item: status change
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          research, hypothesis, experiment and goal status change are each
          separately false. This document is not a decision record and cannot
          transition anything; only a committed Coordinator decision can.
      - n: 9
        item: ECDLP
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          ecdlp_work_or_claim_authorized is false, sota_delta is zero on the
          ECDLP axis, and nonclaims states no ECDLP claim is asserted in either
          direction.
      - n: 10
        item: closure
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          closure_authorized is false, and EV-PRE-3 keeps lane closure on the
          table as one of two honest routes while recommending NEITHER. The
          rescoping of EV-PRE-1 demanded by RT-O8 makes closure REACHABLE
          without a host measurement; that removes an obstacle to closure, it
          does not authorize one, and this gate recommends no closure.
      - n: 11
        item: breakthrough
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          breakthrough_authorized is false, claim_tier is toy, and no candidate,
          excess, or break is stated anywhere, so pause condition P3 is not
          engaged.
      - n: 12
        item: publication
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          publication_authorized is false. This document makes no claim
          proportionate to publication and asserts nothing outside the one-N
          N=19507 toy ceiling.
      - n: 13
        item: network write
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          network_write_authorized is false. This session performed no network
          operation of any kind, and the file it writes is a local working-tree
          file that is not committed by it.
      - n: 14
        item: execution
        granted_by_this_document: false
        how_the_draft_was_held_to_it: >-
          execution_authorized, automatic_execution and automatic_continuation
          are all false, and experiment_runs_executed is 0. No command was run
          by this session; it holds no shell.
    residual_pressure_check:
      why_this_sub_check_exists: >-
        THE FIRST PACKAGE PASSED THE FOURTEEN-ITEM CHECK AND STILL DREW TWO
        FINDINGS OF RESIDUAL PRESSURE. The red team's verdict on the clause was
        'The package HONOURS the goal head's NONAUTOMATIC requirement. It does
        not authorize. It should be REVISED so that it also does not PRESSURE.'
        Checking only the fourteen would therefore have missed exactly what the
        review found, so the two named pressure routes are checked separately.
      route_1_precondition_ordering_RT_O8:
        status_in_the_first_package: >-
          EV-PRE-1 required a current host free-disk observation with no
          alternative, on a precondition list scoped to EVERY later authorizing
          decision - so a closure decision and a cap-change decision, neither of
          which needs a host, were routed through a host measurement.
        status_in_this_gate: REPAIRED
        how: >-
          EV-PRE-1 is scoped in this gate to a decision that would authorize
          MATERIALIZATION ON A HOST, and it now carries the explicit statement
          that a closure decision and a cap-change decision require no host
          observation. See fresh_authorization_boundary.
      route_2_dispatch_readiness_RT_O3:
        status_in_the_first_package: >-
          Fifteen precisely-stated uncited budget figures, plus a summed
          envelope, plus an exact path-and-record-type inventory, left a
          dispatch-ready package whose only missing element was an identifier
          token.
        status_in_this_gate: NARROWED_DELIBERATELY
        how: >-
          Nine of the fifteen figures are now UNDERIVED rather than stated as
          magnitudes, the summed envelope is REMOVED rather than restated, and
          the six that remain are marked PRECEDENT-CITED with a warning that
          they are not derived budgets. A package with nine holes in its budget
          table is harder to dispatch by copying, and that is the intended
          effect and is stated as intended.
        what_is_deliberately_NOT_done: >-
          The exact-path artifact inventory is KEPT, because the goal head names
          'artifacts' as one of the six required contents and removing it would
          fail the mandate to reduce a pressure the reviews explicitly declined
          to call authorization. The identifier tokens stay unminted.

