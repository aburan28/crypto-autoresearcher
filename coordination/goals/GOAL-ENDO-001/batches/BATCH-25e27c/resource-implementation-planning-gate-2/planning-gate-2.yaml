    # ---------------- AR-1: the new finding of this gate ------------------
    AR_1_residual_after_removing_the_dominant_term:
      status: NEW_FINDING_OF_THIS_GATE
      severity_direction: CONSERVATIVE_MAKES_THE_OBSTRUCTION_WORSE
      why_it_is_recorded: >-
        BECAUSE THE FORWARD GUIDANCE BOTH REVIEWS OFFERED IS INCOMPLETE IN A WAY
        THAT WOULD MISLEAD A DESIGN AUTHOR. DEC-20260818-c52d54 R-4 records, as
        the batch's most useful output, that 'ONE LEVER CONTROLS ALL FOUR GATES'
        with 'a single scalar target of roughly a 1.2e4-fold reduction'. The
        first half is right. The second invites the reading that reducing that
        one term by ~1.2e4 would bring the gates within the caps. IT WOULD NOT.
      the_arithmetic: >-
        Removing the dominant term ENTIRELY leaves the other seven retained
        components summing to 219032804608 bytes against a retained cap of
        4294967296 - still over by a factor of about 51. A 1.2e4-fold reduction
        of the dominant term leaves about 4185841920 bytes of it, so the retained
        total would be about 223218646528, about 52 times the cap. THE DOMINANT
        TERM CANNOT BE REDUCED ENOUGH, BY ANY FACTOR INCLUDING INFINITY, TO PASS
        THE RETAINED-BYTE GATE.
      the_four_gates_evaluated_at_the_limit_where_the_dominant_term_is_zero:
        retained_byte_gate:
          residual_estimate_bytes: 219032804608
          cap_bytes: 4294967296
          pass: false
          exceedance_approx: 51.0
        shard_gate:
          residual_estimate_shards: 408
          cap_runs_or_shards: 24
          pass: false
          exceedance_exact: 17.0
        logical_io_gate:
          residual_estimate_bytes: 657098413824
          cap_bytes: 274877906944
          pass: false
          exceedance_approx: 2.39
        individual_artifact_gate:
          residual_estimate_bytes: 123806592000
          cap_bytes: 536870912
          pass: false
          exceedance_approx: 230.6
          conditionality_that_must_not_be_dropped: >-
            THIS ONE FIGURE IS CONDITIONAL AND IS THE WEAKEST OF THE FOUR. The
            worksheet defines the largest required logical artifact as the
            dominant term itself, so it does not say which component becomes the
            largest single artifact once that term is removed. 123806592000 is
            map_context_headers, the largest of the seven residual components,
            and the figure above assumes that component is ONE logical artifact.
            THE WORKSHEET DOES NOT STATE THAT, and this session did not
            establish it. The other three residual figures do not depend on the
            assumption.
      the_correct_forward_guidance: >-
        The dominant term is NECESSARY to reduce and NOT SUFFICIENT. A design
        that attacks it alone fails all four gates no matter how far it gets. Any
        admissible design must reduce the dominant term by roughly 1.2e4 AND
        reduce the residual seven components by roughly 51 - and the residual is
        dominated in turn by map_context_headers at 123806592000 and
        primitive_source_records at 94658793216, which together are about 99.7
        percent of it. THAT IS TWO LEVERS AND A THIRD BEHIND THEM, NOT ONE.
      relation_to_R_4: >-
        THIS REFINES R-4, IT DOES NOT OVERRULE IT. R-4's algebraic claim - that
        the four gates are deterministic functions of one total dominated by one
        term - is confirmed here from the committed formulas first-hand. R-4's
        own words are that the reduction is needed 'before ANY of E4-E7 can
        pass', which is a necessity claim and is correct. What is added is that
        necessity is not sufficiency, and the addition cuts toward fail-closed,
        which R-4 requires of anything cited from it.
      tool_verified: false
      reviewer_obligation: >-
        THE VALIDATOR AND RED TEAM HOLD BASH AND MUST RECOMPUTE ARITH-6 THROUGH
        ARITH-12 RATHER THAN READ THEM. A disagreement is a MATERIAL finding
        against this document and fires SR-5. AR-1 is hand arithmetic by a
        session with no calculator, and it is the single most attackable new
        claim in this gate.

    independent_arithmetic_checks_performed_by_this_session:
      method: >-
        Exact integer arithmetic performed by hand on values read first-hand from
