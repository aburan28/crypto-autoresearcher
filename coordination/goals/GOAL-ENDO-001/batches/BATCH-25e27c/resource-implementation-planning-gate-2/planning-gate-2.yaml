        one term. So the four failed byte, individual-artifact, shard and
        logical-I/O gates are not four independent lines of evidence. THEY MOVE
        TOGETHER. Reporting them as four corroborating failures overstates the
        robustness of the record, and - the more useful half - it hides from a
        design author that the four are not four separate problems to solve.
      direction: >-
        CONSERVATIVE. This correction cannot be used to clear any gate. The
        dominant term alone exceeds the retained cap by roughly 1.17e4 (see
