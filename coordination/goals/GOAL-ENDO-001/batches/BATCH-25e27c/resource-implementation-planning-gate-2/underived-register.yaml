schema: crypto.autoresearch.underived_register.v1
underived_register:
  id: UNDERIVED-GOAL-ENDO-001-BATCH-25e27c-GATE-2
  task_id: <ALLOCATE-TASK-ID>
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-25e27c
  experiment_id: EXP-JINV-bd141d
  work_unit_slug: resource-implementation-planning-gate-2
  role: coordinator
  recorded_at: '2026-08-19'
  companion_to: planning-gate-2.yaml

  # ==================================================================
  # WHY THIS FILE EXISTS AND WHAT IT IS FOR
  # ==================================================================
  purpose: >-
    EVERY FIGURE THIS GATE COULD NOT DERIVE, WITH WHY. The first gate made two
    UNIVERSAL claims about its own numbers and fifteen of its own numbers
    falsified both. DEC-20260818-c52d54 ruling R-2 recorded those claims as FALSE
    AS STATED and true only of the estimates section. This gate therefore makes
    no universal claim and instead carries an explicit register, in a separate
    file, so the claim can be CHECKED AGAINST THE DOCUMENT rather than taken on
    trust. A reviewer who finds a number in planning-gate-2.yaml that is neither
    cited, nor written out as hand arithmetic, nor precedent-cited to a named
    committed antecedent, nor listed here, HAS FOUND A DEFECT AND SHOULD REPORT
    IT AS MATERIAL.
  the_standard_this_register_is_held_to: >-
    THE VALIDATOR CALLED THE FIRST GATE'S UNDERIVED DISCLOSURE 'THE RIGHT
    HANDLING AND THE STRONGEST THING IN THIS PACKAGE'. That is the standard, and
    the point of this file is to extend that handling to the budget figures the
    first gate stated as magnitudes instead. A PLAUSIBLE NUMBER IN PLACE OF AN
    HONEST UNDERIVED IS THE FAILURE MODE HERE, and none is written anywhere in
    this work unit.
  what_UNDERIVED_means_here:
    it_means: >-
      NO COMMITTED ARTIFACT THIS SESSION READ SUPPLIES THE VALUE, AND THIS
      SESSION HAS NO MEANS TO PRODUCE IT. The value is absent, not small, not
      large, and not bounded.
    it_does_not_mean: >-
      A WIDE INTERVAL. There is no interval. Reporting an underived quantity as
      an interval, a range, an order of magnitude, or a rough figure would
      convert a missing number into a fabricated one, and every entry below that
      could be misread that way says so in its own uncertainty field.
    it_is_not_an_excuse: >-
      Each entry names WHAT WOULD DERIVE IT and WHO COULD. An underived entry
      with no route to derivation would be a dead end dressed as a disclosure.

  entry_count: 20
  entries_that_are_estimates: 4
  entries_that_are_budget_figures: 10
  entries_that_are_neither: 6

  # ==================================================================
  # A. THE FOUR UNDERIVED ESTIMATES - carried unchanged from the first gate
  # ==================================================================
  estimates:

    - id: UR-1
      field: 'planning-gate-2.yaml estimates.missing_estimates.E1'
      quantity: total CPU consumption of the protocol-v7 Phase B workload
      units: 'CPU-seconds, comparable against 138240 and 172800'
      value: UNDERIVED
      gate_state: FAIL_MISSING_ESTIMATE
      carried_unchanged_from_the_first_gate: true
      why_underived:
        - 'The committed worksheet''s own estimate_status for all nine stages says the value is missing until a separate implementation bound or read-only benchmark supplies it. Read first-hand by this session.'
        - 'This gate is zero-run and static and executes no benchmark, no runner and no instrument.'
        - 'This session has no shell and could not have measured anything had it been permitted to.'
        - 'No source-pinned historical rate exists to extrapolate from, because preservation obligation 17 leaves two harness paths omitted and uncured with retroactive normalization prohibited. THE VALIDATOR VERIFIED THIS REASON AND CALLED IT AN HONEST REASON, NOT AN EXCUSE.'
      what_exists: 'the nine exact stage cardinalities, all committed and all read first-hand'
      what_is_missing: 'every per-unit rate. No committed artifact this session read contains a CPU-seconds-per-unit figure for any of the nine stages.'
      uncertainty: 'UNQUANTIFIED AND UNBOUNDED IN BOTH DIRECTIONS. This is not a wide interval and must not be reported as one.'
      what_would_derive_it: 'the per-stage rate measurement described in E1.method_that_would_derive_it, paired with control CT-4 measured'
      who_could_derive_it: 'a separately authorized PB-2, which no decision has granted'

    - id: UR-2
      field: 'planning-gate-2.yaml estimates.missing_estimates.E2'
      quantity: wall-clock time per run and per shard of the protocol-v7 Phase B workload
      units: 'seconds per run against cap 21600; seconds per shard'
      value: UNDERIVED
      gate_state: FAIL_MISSING_ESTIMATE
      carried_unchanged_from_the_first_gate: true
      why_underived: 'the same four reasons as UR-1'
      what_exists: 'the nine exact stage cardinalities; the committed shard-count lower bound 93969'
      what_is_missing: 'every per-stage wall-seconds rate; the parallelism the host would actually deliver; the shard plan itself'
      uncertainty: 'UNQUANTIFIED. See UR-1.'
      optimism_warning_attached: >-
        Any future wall-clock estimate that divides a serial total by an assumed
        parallelism is OPTIMISTIC BY CONSTRUCTION and must declare that
        assumption in the same field as the number. Under the current caps the
        division is not available at all: a shard count of at least 93969 faces a
        frozen maximum of 24.
      load_spread_warning_added_in_this_gate: >-
        RT-O4. The committed E14 C1 clause, now reproduced verbatim at both
        citation sites, records a host that has recently run between load 18 and
        116 on 14 cores. A load spread of that size is a wall-time spread of the
        same order, so any future wall figure must report the load under which it
        was taken or it is not comparable with any other.

    - id: UR-3
      field: 'planning-gate-2.yaml estimates.missing_estimates.E3'
      quantity: peak resident memory of the protocol-v7 Phase B workload
      units: 'bytes, against 6871947673 and 8589934592'
      value: UNDERIVED
      gate_state: FAIL_MISSING_ESTIMATE
      carried_unchanged_from_the_first_gate: true
      why_underived: 'the same four reasons as UR-1'
      what_exists: 'the nine exact stage cardinalities; the temporary_working_bytes estimate 1610612736 against cap 17179869184, the ONE PASSING check, read first-hand by this session'
      what_is_missing: 'the peak resident set size of any stage under any implementation'
      uncertainty: 'UNQUANTIFIED. See UR-1.'
      the_substitution_that_is_refused_by_name: >-
        temporary_working_bytes PASSING IS NOT A PEAK-MEMORY ESTIMATE AND MUST
        NEVER BE CITED AS ONE. They are different quantities against different
        caps and only the first has a committed value. THIS IS THE CHEAPEST
        AVAILABLE WAY TO MAKE A GATE LOOK LIKE IT HAD MOVED, and it is refused
        here as it was in the first gate, which the validator recorded as the
        correct call.

    - id: UR-4
      field: 'planning-gate-2.yaml estimates.failed_gates.E8'
      quantity: current free disk on the declared execution host
      units: bytes free
      value: UNDERIVED
      partial: true
      partial_explanation: >-
        E8 IS HALF DERIVED AND HALF UNDERIVED, AND THE HALVES MUST NOT BE
        CONFLATED. The committed inherited observation - 1809797120 bytes free
        against a required 26843545600, at a 4096-byte block size - is READ
        first-hand from the worksheet and is not underived. THE CURRENT FREE
        SPACE ON ANY HOST IS UNDERIVED AND TOTALLY UNKNOWN.
      gate_state: FAIL_INHERITED_READ_ONLY_V3_OBSERVATION
      carried_unchanged_from_the_first_gate: true
      why_underived: >-
        The committed observation is explicitly an inherited, unrefreshed statfs
        from a reviewed static snapshot and is STALE BY CONSTRUCTION. It must not
        be quoted as a present-tense fact about any machine. Obtaining a current
        value is a HOST MEASUREMENT, this gate performs none, and this session
        has no shell with which to perform one.
      uncertainty: 'for the current host, TOTAL; for the committed observation, it is a point observation of one filesystem at one past moment on a host this session cannot identify from what it read'
      the_prior_that_must_travel_with_it: >-
        RT-O9. The only committed observation ALREADY FAILS the frozen preflight
        minimum by about 14.83x, so a refresh is expected to fail also unless the
        declared execution host differs materially from the v3 host. STATED AS AN
        ACCURACY POINT AND NOT AS AN ARGUMENT TO SKIP THE REFRESH.
      what_would_derive_it: 'a single read-only statfs on the declared execution host, recorded with host identity, filesystem and timestamp'
      who_could_derive_it: 'a separately authorized PB-1, which no decision has granted'

  # ==================================================================
  # B. THE TEN UNDERIVED BUDGET FIGURES
  # ==================================================================
  budget_figures_context: >-
    THIS BLOCK IS THE DIRECT ANSWER TO RULING R-2. Of the fifteen budget
    magnitudes both reviews found asserted without source or underived
    disclosure, NINE ARE RECORDED HERE AS UNDERIVED and six are recorded in
    planning-gate-2.yaml as PRECEDENT_CITED_NOT_DERIVED with their committed
    antecedents named. A tenth entry, UR-14, is this task's own budget, which the
    first gate could state and this one cannot. STRUCTURAL NOTE: THIS KEY AND THE
    TWO BELOW ARE NOTES ABOUT THE budget_figures LIST AND ARE SIBLINGS OF IT, NOT
    MEMBERS OF IT. They were originally authored one level deeper, which made the
    list items siblings of a mapping key and made this file fail yaml.safe_load;
    the keys were moved out rather than the list moved in, because a note about a
    set of register entries is not one of the entries.
  budget_figures_the_binding_effect_being_honoured: >-
    'NO LATER DECISION MAY CITE ANY OF THE FIFTEEN MAGNITUDES AS A DERIVED
    BUDGET.' None is cited as derived anywhere in this work unit, including the
    six that carry an antecedent.
  budget_figures_why_not_all_fifteen_are_here: >-
    BECAUSE SIX GENUINELY HAVE A COMMITTED ANTECEDENT AND MARKING THEM UNDERIVED
    WOULD UNDERSTATE WHAT THE RECORD CONTAINS. R-2 named the remedy precisely,
    and named which items it applies to: this batch's own declared task budgets
    would serve for three of the five items, and two items have no visible
    antecedent at all. Understating the record is a failure in the other
    direction and this campaign records under-claims with the same care as
    overclaims.

  budget_figures:
    - id: UR-5
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-1.wall_clock_seconds'
      first_gate_stated: 600
      value_in_this_gate: UNDERIVED
      why_underived: >-
        NO COMMITTED ANTECEDENT EXISTS, AND R-2 SAYS SO IN TERMS: 'PB-1's 600 and
        PB-2's 3600 have no visible antecedent at all.' Both reviewers enumerated
        every field of the item and found no source, provenance, derivation,
        basis or citation for the figure. The item's one citation-bearing field
        cites a load-average RECORDING requirement, not a duration. This session
        read the only committed budget source available - the declared task
        budgets of BATCH-25e27c - and it contains no preflight task and therefore
        no antecedent for this figure.
      what_would_derive_it: 'a measured duration of a comparable read-only host preflight, or a declared ceiling set by the decision that authorizes PB-1'
      who_could_derive_it: 'the decision that authorizes PB-1, in its own handoff, which is where a budget belongs'
      note: 'A BUDGET IS SET BY THE DECISION THAT GRANTS THE WORK. A planning gate proposing one without an antecedent is pricing work nobody granted, which is precisely RT-O3.'

    - id: UR-6
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-1.memory_gb'
      first_gate_stated: 1
      value_in_this_gate: UNDERIVED
      why_underived: 'as UR-5. No committed antecedent, and the declared task budgets contain no preflight task.'
      what_would_derive_it: 'a measured peak resident set size of a comparable read-only host preflight, or a declared ceiling set by the authorizing decision'

    - id: UR-7
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-1.disk_bytes'
      first_gate_stated: 1048576
      value_in_this_gate: UNDERIVED
      why_underived: >-
        As UR-5, AND WITH AN ADDITIONAL REASON THAT APPLIES TO ALL FIVE DISK
        FIGURES: the only committed budget source this session read - the
        declared_task_budgets block of DEC-20260815-f7e2d4 - CARRIES
        wall_clock_seconds AND memory_gb ONLY, AND NO disk FIGURE FOR ANY OF THE
        FIVE TASKS. There is therefore no antecedent of any kind for a disk
        budget in this campaign's committed record that this session read.
      what_would_derive_it: 'the measured size of the artifacts a comparable task actually wrote, or a declared ceiling set by the authorizing decision'

    - id: UR-8
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-2.wall_clock_seconds'
      first_gate_stated: 3600
      value_in_this_gate: UNDERIVED
      why_underived:
        - 'NO COMMITTED ANTECEDENT EXISTS. R-2 names this figure alongside PB-1''s as having no visible antecedent at all.'
        - >-
          A SECOND AND INDEPENDENT REASON, NEW IN THIS GATE. PB-2's workload is
          a rate measurement at REDUCED CARDINALITY, and THE REDUCTION FACTOR IS
          NOWHERE SPECIFIED - not in the first gate, not here, not in any
          committed artifact this session read (see UR-16). A duration budget for
          a workload whose size is undeclared is not underivable merely for want
          of a rate; THERE IS NO DECLARED WORKLOAD FOR IT TO BE A BUDGET FOR.
        - >-
          A THIRD REASON THAT CUTS AGAINST ANY FIGURE OFFERED LATER. The
          committed E14 C1 clause records a host that has run between load 18 and
          116 on 14 cores, so a wall-clock ceiling that does not state the load it
          assumes is not a ceiling. This is the impeaching half of the citation
          the first gate dropped at both sites.
      what_would_derive_it: 'a declared reduction factor and declared cardinalities, plus a measured rate at those cardinalities under recorded load, or a declared ceiling set by the authorizing decision'

    - id: UR-9
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-2.memory_gb'
      first_gate_stated: 2
      value_in_this_gate: UNDERIVED
      why_underived: >-
        As UR-8, and with a sharper edge than the wall figure: PB-2's stated
        failure mode IS a working set leaving cache or memory, so a memory
        ceiling for it is exactly the quantity most sensitive to the reduction
        factor nobody has declared. The transition point at which that happens is
        itself unnamed (see UR-17).
      what_would_derive_it: 'a declared reduction factor plus a measured peak resident set size at those cardinalities, or a declared ceiling set by the authorizing decision'

    - id: UR-10
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-2.disk_bytes'
      first_gate_stated: 1073741824
      value_in_this_gate: UNDERIVED
      why_underived: >-
        As UR-7 and UR-8. No disk antecedent exists in the committed budget
        source, and no declared reduction factor exists from which an output size
        could follow.
      an_additional_reason_this_particular_figure_is_worth_removing: >-
        R-2's secondary item found that under one natural correspondence the
        first gate's figure for this field EXCEEDED THE FROZEN
        individual_artifact_bytes_max OF 536870912, while the sentence claiming
        every figure was below every corresponding cap never said which cap
        corresponded to which figure. Removing the figure removes the ambiguity
        rather than resolving it by preference.

    - id: UR-11
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-3.disk_bytes'
      first_gate_stated: 8388608
      value_in_this_gate: UNDERIVED
      why_underived: >-
        The committed antecedent covers this item's wall_clock_seconds and
        memory_gb - both are PRECEDENT_CITED to the first gate's static-authoring
        producer task - BUT CARRIES NO DISK FIGURE FOR ANY TASK. The asymmetry is
        recorded rather than smoothed over: two of this item's three figures have
        an antecedent and one does not.
      what_would_derive_it: 'the measured size of a comparable design document, or a declared ceiling set by the authorizing decision'

    - id: UR-12
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-4.disk_bytes'
      first_gate_stated: 4194304
      value_in_this_gate: UNDERIVED
      why_underived: 'as UR-11. The antecedent covers wall and memory for both review tasks and carries no disk figure.'

    - id: UR-13
      field: 'planning-gate-2.yaml budgets.proposed_not_authorized PB-5.disk_bytes'
      first_gate_stated: 4194304
      value_in_this_gate: UNDERIVED
      why_underived: 'as UR-11. The antecedent covers wall and memory for the archive tasks and carries no disk figure.'
      an_additional_disclosure_about_this_item: >-
        PB-5 NAMES TWO DIFFERENT ARCHIVE KINDS AND CARRIES ONE FIGURE PER FIELD,
        and the committed antecedent covers only one of the two tiers: the
        snapshot-archive task of the first gate was declared at 1200 s / 2 GB and
        the ledger-archive task at 1800 s / 2 GB. The wall figure carried in this
        gate is the LEDGER tier and is labelled as such. A later decision must
        budget the two archives as SEPARATE TASKS at their own antecedents.

    - id: UR-14
      field: 'planning-gate-2.yaml budgets.this_task_actual_budget'
      quantity: 'this task''s own wall_clock_seconds, memory_gb and maximum_runs'
      value: UNDERIVED
      new_in_this_gate: true
      why_underived: >-
        STRUCTURAL, NOT AN OVERSIGHT, AND IT IS A DEFECT THIS GATE DECLARES
        AGAINST ITSELF. The first gate could state 5400 / 4 / 1 because
        DEC-20260815-f7e2d4 had declared exactly those values for its producer
        task before the work began. NO SUCH DECISION WAS READ BY THIS SESSION FOR
        THIS WORK UNIT, and no dispatch queue for it was read, so this task HAS NO
        DECLARED BUDGET TO REPORT.
      why_a_plausible_figure_was_not_written_instead: >-
        BECAUSE IT WOULD MANUFACTURE A BUDGET NOBODY SET. This Coordinator's own
        role contract requires rejecting a handoff whose budget fields are null;
        the honest response to having no budget is to record that, not to invent
        one that would make the record look complete. A DISCLOSED NULL IS A
        DEFECT; AN INVENTED FIGURE IS A FABRICATION.
      what_this_means: >-
        A null budget field is a defect of this WORK UNIT'S ADMISSION, not of the
        document's content. It is cured by the batch-opening decision that admits
        this gate declaring non-null budgets for it, which is the same act that
        would give this task an identifier.
      relation_to_the_admission_status_disclosure: >-
        SAME ROOT CAUSE, RECORDED IN TWO PLACES DELIBERATELY. See
        planning-gate-2.yaml admission_status, which records that whether a
        batch-opening decision exists for this work unit is UNDETERMINED BY THIS
        SESSION, with the exact glob that was run and its narrowness stated. See
        also UR-20.

  # ==================================================================
  # C. OTHER FIGURES AND FACTS THIS GATE COULD NOT PRODUCE
  # ==================================================================
  other:

    - id: UR-15
      quantity: 'the SHA-256 of each of the five files this task writes'
      value: null
      why_null: >-
        NO SHELL AND NO HASHING TOOL. NULL IS THE CORRECT VALUE AND A
        PLAUSIBLE-LOOKING HEX STRING WOULD BE FABRICATION UNDER AGENTS.md RULE 9.
        No hash-shaped string was written anywhere in this work unit.
      who_must_fill_it: >-
        The dispatching session, after the commit, in the archive receipt - AND
        THIS IS EXACTLY THE STEP THAT DID NOT HAPPEN FOR THE FIRST GATE. RT-O11
        found all four path hashes and both commit fields still null in the
        durable record with only one commit ever having touched the receipt.
        Leaving them null was the correct call; the defect was that nothing filled
        them afterwards. planning-gate-2.yaml
        artifacts.archive_custody_requirement_added_in_this_gate binds any
        archive of this work unit to fill them and to obtain post-commit
        acceptance.
      this_gate_inherits_the_same_exposure: true

    - id: UR-16
      quantity: 'PB-2''s reduction factor and the cardinalities at which a rate would be measured'
      value: UNDERIVED
      why_underived: >-
        NOT SPECIFIED ANYWHERE - not in the first gate, not in this one, and not
        in any committed artifact this session read. The red team recorded this as
        HC-1(a): without a reduction factor the linearity claim has no stated
        domain and no budget for PB-2 can be checked against it.
      why_this_gate_does_not_supply_one: >-
        Choosing a reduction factor is a design decision about a measurement
        nobody has authorized, and it would determine the very budgets this
        register declares underived. Supplying one here would be planning work
        into existence.
      what_would_derive_it: 'the decision that authorizes PB-2, which must declare it in the same record that budgets it'
      carried_into: 'planning-gate-2.yaml fresh_authorization_boundary, second grant item'

    - id: UR-17
      quantity: 'the cardinality at which PB-2''s working set stops fitting in memory or cache'
      value: UNDERIVED
      why_underived: >-
        The failure mode is correctly identified but the transition point is not
        named. The red team recorded as HC-1(b) that THE COMMITTED CARDINALITIES
        WOULD LET A LATER ANALYSIS BOUND ONE, so this is a gap that could be
        narrowed rather than an unknowable.
      why_this_gate_does_not_bound_it: >-
        Bounding it requires a memory model of an implementation that does not
        exist, and this gate is scoped to planning rather than to design analysis
        and holds no measurement. RECORDED AS AN OPEN GAP OF THIS PLAN, NOT
        REPAIRED.
      who_could_narrow_it: 'a separately authorized PB-3, which is the design task, using the committed cardinalities'

    - id: UR-18
      quantity: 'which residual component constitutes the largest single logical artifact once the dominant term is removed'
      value: UNDERIVED
      new_in_this_gate: true
      context: >-
        This is the one conditional figure inside AR-1 and it is the weakest of
        that finding's four sub-figures. The worksheet defines the largest
        required logical artifact BY THE DOMINANT TERM ITSELF, so it does not say
        what becomes largest when that term is removed.
      what_this_gate_asserted_and_how_it_qualified_it: >-
        AR-1 states the residual individual-artifact figure as 123806592000 - the
        largest of the seven residual components - against a cap of 536870912, at
        about 230.6x, AND FLAGS IN THE SAME FIELD that this assumes that component
        is ONE logical artifact, WHICH THE WORKSHEET DOES NOT STATE AND THIS
        SESSION DID NOT ESTABLISH.
      why_it_does_not_weaken_AR_1: >-
        THE OTHER THREE RESIDUAL FIGURES DO NOT DEPEND ON THE ASSUMPTION. The
        retained-byte residual of about 51x, the shard residual of exactly 17x and
        the logical-I/O residual of about 2.39x follow from the eight-component
        sum alone. AR-1's conclusion - that the dominant term is necessary and not
        sufficient - stands on those three without this one.
      what_would_derive_it: 'a design statement of which retained components are materialized as single artifacts, which is PB-3''s work'

    - id: UR-19
      quantity: 'the result of RC-1, the zero-run static perturbation of the committed formula chain'
      value: 'NOT PERFORMED BY ANY SESSION'
      why_not_performed_here: >-
        RC-1 IS A COMPUTATION AND THIS SESSION HOLDS NO SHELL. The red team
        recommended it as the cheapest control in its report and named it as the
        single action for the ledger-archive task; that task refused it correctly,
        because it too had no shell and RC-1 was not among its declared
        deliverables, and carried it forward. IT HAS NOW BEEN CARRIED FORWARD
        TWICE WITHOUT BEING RUN.
      what_this_gate_did_instead: >-
        Established the dependency ALGEBRAICALLY by reading the five governing
        formula fields first-hand and re-deriving two of the products by hand
        (ARITH-7 and ARITH-8). THAT IS NOT RC-1 AND IS NOT RECORDED AS RC-1: RC-1
        perturbs and recomputes, and a perturbation would additionally surface the
        residual behaviour that AR-1 reaches by subtraction.
      cost_if_performed: 'minutes, no host access, no run identifier, no experiment, no evidence record'
      carried_into: 'planning-gate-2.yaml EV-PRE-8'

    - id: UR-20
      quantity: 'whether a batch-opening decision exists for this work unit'
      value: 'UNDETERMINED BY THIS SESSION'
      why_undetermined: >-
        A CONTENT SEARCH OF ledger/decisions/ REQUIRES A SHELL AND THIS SESSION
        HAS NONE. What it could run, and did, is a FILENAME GLOB for the pattern
        'ledger/decisions/DEC-20260819-*.yaml' over the working tree, which
        returned exactly ONE match, ledger/decisions/DEC-20260819-3ef73a.yaml -
        the goal-head reconciliation, which is not a batch-opening decision and
        whose own bookkeeping note states that no batch is opened, closed or
        checkpointed by it.
      why_this_is_recorded_as_undetermined_and_NOT_as_an_absence: >-
        BECAUSE R-10 BINDS AND THE GLOB IS NARROWER THAN AN ABSENCE CONCLUSION
        WOULD BE. A batch-opening decision carrying any other date token would not
        appear in a glob on that pattern. THE SEARCH IS RECORDED WITH ITS PATTERN,
        ITS ROOT AND ITS COUNT SO A READER CAN SEE EXACTLY HOW WIDE IT WAS, and
        no conclusion wider than the search is drawn from it. Two R-10 failures
        occurred in this campaign on one day, one from a wrong search unit and one
        from a wrong search scope, and recording a search does not validate it.
      consequence: 'UR-14 - this task has no declared budget to report - and planning-gate-2.yaml admission_status'
      who_could_determine_it: 'any session with a shell, in one content search'

  # ==================================================================
  # D. RELIANCE DISCLOSURES - figures relied on but not verified at source
  # ==================================================================
  reliance_disclosures:
    why_this_block_exists: >-
      A DISCLOSED RELIANCE IS A GOOD OUTCOME; AN UNDISCLOSED ONE IS THE FAILURE
      MODE. Everything below is a value this gate USES but did not verify at
      source. Each is attributed to the session that produced it. NONE IS
      RE-ASSERTED AS THIS SESSION'S FINDING.
    the_one_source_this_session_did_open_first_hand:
      path: experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
      read_in_full: true
      what_that_covers: >-
        The thirteen resource caps, the nine per-item serialization byte bounds,
        the eight retained-byte components and their declared total, the nine
        stage cardinality bases and their null estimate statuses, the five
        governing formula fields, the three aggregate checks with null estimates,
        the free-disk observation, the preflight contract's five credit flags, the
        controlling disposition and its eight reasons, the frozen dimensions, and
        the estimate_kind self-label.
