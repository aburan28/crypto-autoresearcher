schema: crypto.autoresearch.objection_disposition.v1
objection_disposition:
  id: OBJDISP-GOAL-ENDO-001-BATCH-25e27c-GATE-2
  task_id: <ALLOCATE-TASK-ID>
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-25e27c
  experiment_id: EXP-JINV-bd141d
  work_unit_slug: resource-implementation-planning-gate-2
  role: coordinator
  recorded_at: '2026-08-19'
  companion_to: planning-gate-2.yaml

  purpose: >-
    One entry per standing objection against the BATCH-25e27c planning-gate
    package, with what this second gate does about it. This file is the audit
    trail a reviewer uses to check that the second gate answered the reviews
    rather than restating the first gate with a new name.

  # ------------------------------------------------------------------
  # HOW THE SET OF TEN WAS DETERMINED
  # ------------------------------------------------------------------
  derivation_of_the_ten:
    source: >-
      DEC-20260818-c52d54, rationale item 1: 'there are ten material objections
      across the two reports (one validator, nine red team)', and
      material_blockers_overruled 0 with the note that every one is sustained,
      carried, or - in the single case of MF-2 - ruled against the PRODUCER
      rather than against the reviewer who raised it.
    the_validator_material_objection: OBJ-1
    validator_objection_counts_as_read: 'material_objections 1, minor_objections 2, observations_not_objections 6, checks_performed 61, checks_passed 58, checks_failed_against_the_package 3'
    the_nine_red_team_material_objections: [RT-O1, RT-O2, RT-O3, RT-O4, RT-O5, RT-O6, RT-O7, RT-O8, RT-O11]
    red_team_objection_counts_as_read: 'objections 12, material_objections 9, minor_objections 3, total_mismatches_found 0, sr5_fires false'
    the_three_red_team_minor_objections: [RT-O9, RT-O10, RT-O12]
    how_the_nine_were_identified: >-
      By reading the severity field of each of the red team's twelve objections
      in the committed report and separating them. RT-O9, RT-O10 and RT-O12
      carry severity minor; the other nine carry severity material. Nine plus
      the validator's one is ten, which reconciles with the decision's own
      count. THIS IS AN ENUMERATION OF A CLOSED TWELVE-ITEM LIST READ IN FULL,
      NOT A PATTERN SEARCH.
    what_is_NOT_in_the_ten_and_is_carried_anyway: >-
      OBJ-2, OBJ-3, RT-O9, RT-O10 and RT-O12. All five were SUSTAINED by
      DEC-20260818-c52d54 at minor severity and none is dismissed. They are
      carried in a separate block below rather than folded into the ten, because
      collapsing severities is exactly what ruling R-2 forbade for the one
      finding that carries two.
    the_one_finding_that_carries_two_severities:
      finding: 'the fifteen asserted budget magnitudes'
      raised_as: 'validator OBJ-3 at MINOR and red team RT-O3 at MATERIAL, independently and without contact'
      ruling: >-
        R-2 SUSTAINED IT AND RECORDED BOTH READINGS WITHOUT COLLAPSING EITHER
        INTO THE OTHER. The validator kept it MINOR because PB-1..PB-5 are
        explicitly proposals that are not grants and an asserted ceiling on
        unauthorized future work misleads nobody about anything measured. The red
        team kept it MATERIAL because an unsourced precise number whose only
        possible use is to justify a budget nobody granted is 'the residue of
        authorization even when the authorization words are all correct'.
      handled_here_as: >-
        TWO ENTRIES, NOT ONE. RT-O3 sits in the ten; OBJ-3 sits in the additional
        block. Both point at the same repair, and the repair is described once
        and referenced twice so the two severities stay visible.

  disposition_vocabulary:
    ADDRESSED_BY_CHANGE: 'the second gate changes what it says or how it says it, and the change is named'
    ADDRESSED_BY_REMOVAL: 'the second gate does not carry the thing objected to at all'
    ADDRESSED_BY_ADDITION: 'the second gate adds something the first lacked'
    CARRIED_NOT_REPAIRABLE_HERE: 'the objection is sustained and its repair is outside this document''s scope or capability; it is carried forward with who must repair it'
    NO_CHANGE_NEEDED_WITH_REASON: 'the objection does not bear on this document, and why'
  disposition_vocabulary_note: >-
    NO ENTRY BELOW USES A DISPOSITION MEANING 'DISMISSED', BECAUSE NOTHING IS
    DISMISSED. material_blockers_overruled is 0 in DEC-20260818-c52d54 and it is
    0 here. This gate overrules no reviewer finding.

  # ==================================================================
  # THE TEN STANDING MATERIAL OBJECTIONS
  # ==================================================================
  standing_objections:

    - n: 1
      id: OBJ-1
      raised_by: 'validator TASK-20260815-fa8f06'
      severity_as_raised: MATERIAL
      ruling_in_DEC_20260818_c52d54: 'R-1, MF-2 RETIRED_AS_NOT_REPRODUCIBLE - ruled AGAINST THE PRODUCER, not against the reviewer'
      the_objection: >-
        The producer's own material finding MF-2 asserted that the frozen
        contract's obligation-8 provenance attribution 'does not reproduce',
        because a search of the committed BATCH-d7e255 v6 dispatch_queue.json for
        the literal 441350 found no occurrence. THE ATTRIBUTION DOES REPRODUCE.
        The value is present in that exact file, in the exact completion note the
        contract cites, WRITTEN WITH A THOUSANDS SEPARATOR. The conclusion is now
        carried in two immutable committed records and two commit messages, in
        the direction of manufacturing a defect that does not exist.
      disposition: ADDRESSED_BY_REMOVAL
      what_this_gate_does: >-
        MF-2 IS NOT RESURRECTED ANYWHERE IN THIS WORK UNIT. No sentence in any of
        the five files asserts that 441350 is absent from any file, restates
        MF-2's claim, or treats obligation 8's provenance attribution as
        defective. preservation-binding.yaml binds obligation 8 at its committed
        values unchanged and carries R-1's RETIREMENT as a superseding note
        against it.
      what_this_gate_deliberately_does_not_do: >-
        IT DOES NOT EDIT THE RECORDS THAT CARRY MF-2. The preservation manifest,
        the snapshot receipt and the two commit messages are immutable and were
        not touched. R-1 retires MF-2 BY SUPERSEDING RECORD AND BY NOTHING ELSE,
        and this gate is not even that record - it is a reader of it.
      the_committed_fact_this_gate_relies_on: >-
        Head constraint C-C states that 441350 is present as '441,350' at line
        624 of that file. THIS SESSION DID NOT RUN THAT SEARCH and holds no
        shell. The fact is relied on as established by the validator, which ran
        it and reported grep -c '441350' returning 0 and grep -c '441,350'
        returning 1; by the adjudicating session, which reran it independently
        with ripgrep and confirmed the matched line lies inside the tasks[0]
        object whose id is TASK-20260813-5b8a62; and by head constraint C-C,
        which searched with the separator-tolerant pattern 441,?350.
      the_transferable_lesson_this_gate_adopts: >-
        R-10, ADOPTED AS A STANDING CAMPAIGN REQUIREMENT. Both of the producer's
        failures were NEGATIVE CLAIMS ABOUT ABSENCE, and every one of its
        eighteen positive read-claims reproduced. This gate's response is
        structural rather than procedural: IT MAKES NO ABSENCE CLAIM AT ALL, and
        the one place where an absence would have been natural to state - whether
        a batch-opening decision exists for this work unit - is recorded as
        UNDETERMINED with the exact glob, root and count, and with the glob's
        narrowness stated.
      residual_carried: >-
        R-1 records an open question it declined to settle: whether campaign
        convention additionally requires a ledger/corrections/CORR-* record for a
        retired material finding. THAT IS STILL OPEN. It is not settled here
        either - ledger/corrections/ is outside this work unit's write scope and
        this gate writes no ledger record of any kind.

    - n: 2
      id: RT-O1
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: cost_model
      ruling_in_DEC_20260818_c52d54: 'R-4, SUSTAINED_AND_BOTH_CUT_CONSERVATIVELY'
      the_objection: >-
        The gate's 'four gates fail by roughly 1e2 to 1e5' framing PRESENTS ONE
        FACT AS FOUR. E7 = 3 x E4 exactly, E5 is 99.5658 percent of E4, and
        E6 = ceil(E4 / individual cap), so E5, E6 and E7 are deterministic
        functions of E4 and E4 is 99.57 percent one term. The gate demonstrably
        knew the worksheet carries formula fields, because it reproduced E6's
        formula as ARITH-2 and did not reproduce E7's - A SELECTIVE FAILURE TO
        CARRY PROVENANCE, NOT AN ABSENCE OF IT.
      disposition: ADDRESSED_BY_CHANGE
      what_this_gate_does:
        - >-
          Adds estimates.dependency_structure_of_the_four_failed_byte_shard_io_gates,
          quoting the five committed formula fields exactly as read, including
          E7's '3*retained_artifact_bytes_upper' which the first gate withheld.
        - >-
          Replaces the 'overshoots four gates by roughly 1e2 to 1e5' framing in
          estimates_summary and in resource_disposition with the correct
          statement that the four move together and are not four independent
          lines of evidence.
        - >-
          Corrects E7's method field, which described 'exact-cardinality
          accounting of every declared replay visit and serialization pass' where
          the source says a three-times multiplier.
        - >-
          Names the single dominant term, all_replacement_pairs_upper =
          196211340000 pairs at a declared 256 bytes each, as forward guidance the
          first gate withheld.
      how_this_gate_verified_it_rather_than_copying_the_objection: >-
        BY OPENING THE COST SOURCE FIRST-HAND. This session read
        v4-cost-worksheet.json in full and read the five formula fields directly,
        then re-derived two of the three dependencies by hand: ARITH-7 confirms
        196211340000*256 = 50230103040000, and ARITH-8 confirms
        50449135844608*3 = 151347407533824. THAT IS A DIFFERENT CONSTRUCTION FROM
        THE RED TEAM'S, WHICH IS THE POINT - the correlated-judgement risk in
        this campaign is real and it fired once already on MF-2.
      what_this_gate_ADDS_that_the_objection_did_not_say:
        finding: AR-1
        statement: >-
          RT-O1's forward guidance is INCOMPLETE IN A WAY THAT WOULD MISLEAD A
          DESIGN AUTHOR, and R-4 repeats it as the batch's most useful output: one
          lever, a single scalar target of roughly a 1.2e4-fold reduction. The
          dependency claim is right. The sufficiency implication is wrong.
          REDUCING THE DOMINANT TERM ALONE - EVEN TO ZERO - LEAVES THE RETAINED
          GATE FAILING BY ABOUT 51, THE SHARD GATE BY EXACTLY 17, AND THE
          LOGICAL-I/O GATE BY ABOUT 2.39. See planning-gate-2.yaml AR-1 and
          ARITH-9 through ARITH-13.
        direction: 'CONSERVATIVE - it makes the obstruction worse and creates no headroom'
        relation_to_R_4: >-
          REFINES, DOES NOT OVERRULE. R-4's own words are that the reduction is
          needed 'before ANY of E4-E7 can pass', which is a necessity claim and is
          correct. AR-1 adds that necessity is not sufficiency.
        tool_verified: false
        attackable: >-
          YES, AND DELIBERATELY SO. AR-1 is hand arithmetic by a session with no
          calculator and is the most attackable new claim in this gate. SR-5 is
          widened to fire on any reviewer recomputation that disagrees with it.
      direction_binding_honoured: >-
        R-4 binds successors: 'Any successor that cites RT-O1 or RT-O2 as headroom
        is misreading this decision.' This gate cites neither as headroom and adds
        SR-11, a stopping rule that refuses any successor sentence that does.
      residual_carried:
        item: RC-1
        status: 'STILL UNPERFORMED BY ANY SESSION'
        why_not_performed_here: >-
          RC-1 is a computation and this session holds no shell. The algebraic
          route taken instead - reading the formula fields and re-deriving two
          products by hand - settles the direction of movement, but IT IS NOT RC-1
          AND IS NOT RECORDED AS RC-1.
        carried_to: 'planning-gate-2.yaml EV-PRE-8, as evidence a later decision must see'

    - n: 3
      id: RT-O2
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: cost_model_omitted_cost
      ruling_in_DEC_20260818_c52d54: 'R-4, SUSTAINED, CONSERVATIVE'
      the_objection: >-
        E7 is a fixed three-pass model over the retained total and E5 is
        explicitly the individual-artifact check WITHOUT SHARDING, but E6
        establishes that any admissible design needs AT LEAST 93969 shards under
        the frozen individual-artifact cap. A 93969-way shard-and-merge design
        necessarily re-reads and re-writes across the merge boundary, and that
        I/O is not in a flat 3x multiplier. E5's uncertainty field flags the
        sharding conditionality; E7's never propagates it. CONSEQUENCE: E7 =
        151347407533824 IS NOT AN UPPER BOUND FOR ANY RUNNABLE DESIGN under the
        frozen caps; for admissible sharded designs it behaves as a LOWER bound.
        THIS IS THE ONE PLACE IN THE ESTIMATES SECTION WHERE THE STATED DIRECTION
        OF UNCERTAINTY IS WRONG.
      disposition: ADDRESSED_BY_CHANGE
      what_this_gate_does: >-
        E7's uncertainty field is replaced by
        uncertainty_direction_CORRECTED_IN_THIS_GATE, which states what the first
        gate said, why it was wrong, and the corrected statement: the figure is an
        upper bound FOR THE UNSHARDED MODEL ONLY, is not an upper bound for any
        design runnable under the frozen caps, behaves as a LOWER bound for
        admissible sharded designs, and therefore UNDERSTATES the exceedance of
        about 550.6x. The correction is labelled CONSERVATIVE and carries the
        falsification the red team named.
      falsification_carried_verbatim_in_intent: >-
        'Exhibit any single-pass streaming design over at least 93969 shards whose
        total logical I/O is at most 3x the retained bytes with no prohibited
        credit. If one exists, RT-O2 is wrong and this correction should be
        struck.' Carried into E7 so the correction can be refuted rather than only
        believed.
      knock_on_change_this_gate_makes: >-
        PB-3's on-paper-judgement assumption is qualified by the same fact
        (red team HC-2): the very gate PB-3 is supposed to settle on paper is the
        one whose paper model does not survive the design PB-3 must produce. A
        later decision authorizing PB-3 must either supply a sharded I/O model or
        record that the logical-I/O gate cannot be settled on paper. THAT
        QUALIFICATION IS NEW IN THIS GATE.

    - n: 4
      id: RT-O3
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: authorization_surface_and_provenance
      also_raised_independently_as: 'validator OBJ-3 at MINOR - see the additional block; the two severities are NOT collapsed'
      ruling_in_DEC_20260818_c52d54: 'R-2, SUSTAINED, with a binding effect on every successor'
      the_objection: >-
        The document asserted UNIVERSALLY, twice, that every number in it was
        read from a committed artifact and cited to it, or disclosed as UNDERIVED
        with its reason. FIFTEEN OF ITS OWN NUMBERS SATISFY NEITHER DISJUNCT: the
        wall_clock_seconds, memory_gb and disk_bytes of each of PB-1 through
        PB-5. Both reviewers enumerated every field of all five items and found
        no source, provenance, derivation, basis or citation for any magnitude
        and no underived disclosure. The per-item assumption field names a
        methodological assumption about the nature of the work, never a basis for
        the number. Fifteen precise uncited figures plus a summed envelope plus
        an exact path-and-record-type inventory leave a dispatch-ready package
        whose only missing element is an identifier token.
      disposition: ADDRESSED_BY_CHANGE_AND_REMOVAL
      binding_effect_honoured: >-
        R-2 binds every successor: 'NO LATER DECISION MAY CITE ANY OF THE FIFTEEN
        MAGNITUDES AS A DERIVED BUDGET.' THIS GATE CITES NONE OF THEM AS DERIVED.
      what_this_gate_does:
        - >-
          Replaces the universal self-claim with a SCOPED four-class provenance
          rule (READ, HAND-ARITHMETIC, PRECEDENT-CITED, UNDERIVED) whose class is
          stated at every number, backed by a separate register file so the claim
          can be checked against the document rather than taken on trust.
        - >-
          Assigns SIX of the fifteen to PRECEDENT_CITED_NOT_DERIVED with their
          committed antecedent named - the BATCH-25e27c declared task budgets in
          DEC-20260815-f7e2d4 - and carries that source's OWN warning that
          declared ceilings are not predictions of duration and not measurements.
        - >-
          Moves the other NINE to UNDERIVED with reasons, in
          underived-register.yaml: all three PB-1 figures, all three PB-2
          figures, and the disk_bytes of PB-3, PB-4 and PB-5.
        - >-
          REMOVES the budget envelope total entirely rather than restating it,
          and states the removal as deliberate with three reasons.
        - >-
          REMOVES the relation_to_frozen_caps sentence, which R-2's secondary item
          found was either false under one natural correspondence or inapplicable
          under the other, and reassurance rather than a check either way.
      why_nine_and_not_fifteen_underived: >-
        BECAUSE SIX GENUINELY HAVE A COMMITTED ANTECEDENT AND NINE GENUINELY DO
        NOT. R-2 named the remedy precisely: 'for PB-3, PB-4 and PB-5 this
        batch's own declared task budgets would serve, if stated' and 'PB-1's 600
        and PB-2's 3600 have no visible antecedent at all.' The declared budgets
        block carries wall_clock_seconds and memory_gb only and NO disk figure for
        any task, which is why all five disk figures are underived and not
        precedent-cited. Marking the six underived as well would have been
        available and would have understated what the record actually contains.
      why_PRECEDENT_CITED_IS_ITS_OWN_CLASS_AND_NOT_CALLED_DERIVED: >-
        A DECLARED CEILING FOR A DIFFERENT TASK IS NOT A DERIVATION OF THIS
        TASK'S COST. It is a precedent for what an equivalently-shaped task was
        allowed to consume. Calling it derived would be the exact substitution
        R-2 forbids, so it is a third class with a warning attached, and no later
        decision may quote a class-3 figure as a derived budget either.
      residual_pressure_effect: >-
        NARROWED AND STATED AS DELIBERATE. A budget table with nine holes and no
        envelope is harder to dispatch by copying. The exact-path artifact
        inventory is KEPT, because the goal head names artifacts as one of the six
        required contents and removing it would fail the mandate to reduce a
        pressure both reviews explicitly declined to call authorization.

    - n: 5
      id: RT-O4
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: hidden_assumption_and_selective_citation
      flagged_by_the_red_team_as: 'the sharpest citation finding'
      ruling_in_DEC_20260818_c52d54: 'R-5, SUSTAINED, with an explicit binding effect on successors'
      the_objection: >-
        The gate cites the goal head's E14 C1 load precondition TWICE - at
        PB-1.precedent_read and at CT-4.source_read - and BOTH TIMES DROPS the
        committed clause that the host has RECENTLY RUN BETWEEN LOAD 18 AND 116
        ON 14 CORES and that the whole cost model is A LINEAR EXTRAPOLATION FROM
        ONE 128.234 s RUN, rendering it instead as declining to start above 'a
        DECLARED LOAD THRESHOLD'. THE OMITTED CLAUSE IS THE STRONGEST COMMITTED
        EVIDENCE AGAINST PB-2's LINEAR-EXTRAPOLATION ASSUMPTION - the assumption
        the gate itself names in three places as the weakest link in the whole
        plan. The gate cites the sentence for the part that supports proposing
        PB-1 and omits the part that impeaches PB-2. It is also the exact inverse
        of RT-O3: there, numbers appear without sources; here, a source's
        committed number is replaced by prose, in a document whose stated rule is
        that every number is cited to a committed artifact.
      disposition: ADDRESSED_BY_CHANGE
      binding_effect_honoured: >-
        R-5 binds successors: 'Any successor that carries PB-2 forward must
        reproduce the committed clause VERBATIM, including the 128.234 s
        single-run basis, the 18-116 load range and the 14-core count, in the same
        field as the citation.' DONE, AT BOTH SITES.
      what_this_gate_does: >-
        The committed clause is reproduced VERBATIM in a
        committed_text_verbatim field at PB-1 and again at PB-2 - reproduced at
        both, not cross-referenced from one, because the first gate's failure was
        that it dropped the impeaching half at both. Each site states what the
        restored half costs the plan. CT-4's first destroying parameter cites the
        same clause and points at the verbatim reproduction under budgets rather
        than paraphrasing it a third time.
      how_this_session_obtained_the_verbatim_text: >-
        BY READING IT IN THE COMMITTED GOAL HEAD, NOT BY COPYING THE RED TEAM'S
        QUOTATION. The text was located with a content search for the literal
        128.234 over ledger/goals/GOAL-ENDO-001/goal.yaml with fourteen lines of
        surrounding context, which returned the clause spanning lines 853-859 of
        the file as it stands in this working tree, and the surrounding context
        was read to confirm the clause was taken whole rather than truncated at a
        fold.
      a_line_number_divergence_recorded_rather_than_harmonised: >-
        The two reviews cite lines 627-633 for this text and this session reads it
        at 853-859. BOTH ARE CORRECT FOR THE FILE EACH SESSION READ: the
        2026-08-19 head reconciliation added material above the note and shifted
        its offsets. THE TEXT IS THE SAME AND ONLY THE OFFSET MOVED. Recorded so
        no later reader treats the divergence as a defect, and because an
        unexplained line-number mismatch between a review and a successor is
        exactly the kind of thing that gets read as a discrepancy when it is not.
      knock_on_change_this_gate_makes: >-
        E2 gains a load_spread_warning stating that a load spread of the recorded
        size is a wall-time spread of the same order, so any future wall estimate
        must report the load under which it was taken or it is not comparable
        with any other.

    - n: 6
      id: RT-O5
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: stopping_rules
      ruling_in_DEC_20260818_c52d54: 'R-6, ALL_SUSTAINED'
      the_objection: >-
        NO STOPPING RULE CAN REFUSE PB-3, THE PLAN'S CENTRAL DELIVERABLE. SR-2's
        three thresholds gate E1/E2/E3 only; SR-3 fires only when a design fits a
        cap BY TAKING one of the five prohibited credits; SR-1 is disk, SR-4
        budget, SR-5 recomputation disagreement, SR-6 scope escape, SR-7 policy,
        SR-8 unmeasured control, SR-9 one-N transfer. NOTHING binds a PB-3 design
        against E4-E7. The concrete counterexample stands and is not answerable by
        argument: a PB-3 design reducing retained bytes tenfold to 5.0e12 using
        NONE of the five prohibited credits is still about 1164x over the retained
        cap and still needs about 9313 shards against a cap of 24, and fires none
        of SR-1 through SR-9. The general clause promises each rule 'can fire
        against the interest of whoever is running the work'; for the item most
        likely to be argued about, none can.
      disposition: ADDRESSED_BY_ADDITION
      what_this_gate_does: >-
        Adds SR-10, which observes any PB-3 design and fires on retained bytes >
        4294967296, or largest individual artifact > 536870912, or shards > 24,
        or total logical I/O > 274877906944, with the action STOP, the meaning
        that a design that misses the caps has not fitted them however large its
        improvement, and the refusability that its four thresholds are the frozen
        caps restated at their committed values and fixed before any design
        exists.
      the_rule_is_tested_against_the_counterexample_that_defeated_the_first_set: >-
        CHECKED EXPLICITLY. The red team's 5.0e12 design crosses SR-10's first
        threshold at about 1164x and its third at about 9313 shards against 24.
        SR-10 FIRES. A rule added to answer a counterexample and not checked
        against it would be decoration.
      the_rule_is_also_tested_against_this_gates_own_new_finding: >-
        A design that drives the dominant term to ZERO still leaves retained bytes
        at 219032804608 and shards at 408, so SR-10 fires on the AR-1 limit case
        too.
      wording_provenance: >-
        The red team supplied a cheapest_fix wording for exactly this rule. SR-10
        follows it in substance and thresholds, with the meaning and
        refusable_because fields written out as the other nine rules carry them.
      a_second_rule_added_beyond_the_objection:
        id: SR-11
        why: >-
          NOT REQUESTED BY ANY REVIEW. R-4 binds successors not to cite RT-O1 or
          RT-O2 as headroom, and AR-1 creates a third finding with the same risk.
          A binding effect that lives only in a decision record is easy for a
          successor to miss; a stopping rule in the plan itself is not. SR-11
          refuses any successor sentence citing AR-1, the dependency structure,
          RT-O1 or RT-O2 as headroom or as a route to clearing a gate.

    - n: 7
      id: RT-O6
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: controls
      ruling_in_DEC_20260818_c52d54: 'R-6, SUSTAINED - CT-3 CANNOT FAIL'
      the_objection: >-
        CT-3's null object is a NUISANCE POPULATION, NOT A NULL, and its
        destroying parameter cannot make it fail. Two defects. (a) SHAPE MATCHING
        IS DEFINITIONAL, NOT DEMONSTRATED: the committed formula for
        p_rank_nuisance_total_map_contexts is literally
        'd0_intended_total_map_contexts', so the cardinality is COPIED FROM THE
        INTENDED ARM BY DEFINITION and its equality is evidence of nothing about
        shape. (b) THE DESTROYING PARAMETER TESTS THE WRONG THING: at k = 0 both
        arms are unplanted, so indistinguishability is satisfied by construction.
        It measures a false-positive rate and never tests whether the null is
        matched ON P-RANK, the only property CT-3 exists to control. A CONTROL
        THAT COULD NEVER HAVE FAILED IS DECORATION.
      disposition: ADDRESSED_BY_CHANGE
      what_this_gate_does: >-
        CT-3 is REPAIRED. Its matched null object becomes the same nuisance
        population at the same cardinality WITH THE P-RANK STRUCTURE REMOVED - the
        p-rank randomized across the population, every other structure held fixed.
        Its destroying parameter becomes THE P-RANK ITSELF rather than the plant
        count: hold k FIXED AND NON-ZERO, randomize the p-rank, and REQUIRE THE
        MEASURED P-RANK EFFECT TO VANISH. The k = 0 false-positive check is
        RETAINED as a clearly-labelled secondary check rather than discarded,
        because it is a real check on a real thing and the objection was that it
        was presented as the p-rank control.
      can_the_repaired_control_fail: >-
        YES. It fails whenever the measured effect survives p-rank randomization.
        That is the whole content of the repair.
      cost: 'the same measurement CT-3 already required; no new measurement is introduced'
      how_this_session_verified_defect_a_rather_than_copying_it: >-
        BY READING THE FORMULA FIELD FIRST-HAND. This session opened
        v4-cost-worksheet.json and read exact_cardinalities
        .p_rank_nuisance_total_map_contexts, whose formula field is literally the
        string 'd0_intended_total_map_contexts' and whose value is 386786400,
        equal to d0_intended_total_map_contexts. The definitional copy is
        confirmed at source and not taken on the red team's word.
      what_this_gate_does_not_do: >-
        IT DOES NOT MEASURE THE REPAIRED CONTROL AND DOES NOT AUTHORIZE MEASURING
        IT. A repaired control is still an unmeasured control and SR-8 stops any
        quantity that leans on one. The gate states this in terms, because
        'repaired' reads like progress and is not.

    - n: 8
      id: RT-O7
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: controls
      ruling_in_DEC_20260818_c52d54: 'R-6, SUSTAINED - CT-4 WOULD REJECT CORRECT MEASUREMENTS'
      the_objection: >-
        CT-4's measured quantity is 'any per-stage CPU, wall, or peak-memory RATE'
        and its destroying parameter is HOST LOAD, with the rule 'a rate that does
        not move with load is measuring the clock, not the work'. That is right
        for the WALL rate and wrong for the other two: CPU-seconds is
        substantially load-invariant BY CONSTRUCTION - that is precisely why one
        measures CPU time rather than wall time - and peak resident set size is
        essentially load-invariant. Applied literally to a correct CPU-seconds
        measurement, CT-4 REJECTS IT. A false-positive control is the exact mirror
        of RT-O6's control that cannot fire, and both are failures of the same
        discipline.
      disposition: ADDRESSED_BY_CHANGE
      what_this_gate_does: >-
        CT-4 is RESCOPED into two explicitly separated destroying parameters.
        Parameter 1, HOST LOAD, is bound to THE WALL RATE ONLY, with an explicit
        statement that load-invariance in CPU-seconds and peak resident set size
        is EXPECTED AND CORRECT AND MUST NOT BE READ AS A CONTROL FAILURE.
        Parameter 2, CARDINALITY DOUBLING, is bound to ALL THREE quantities and
        carries the refutation condition that if doubling the stage cardinality
        does not approximately double CPU-seconds, the extrapolation is refuted
        and E1, E2 and E3 stay UNDERIVED rather than being filled with a number.
      no_new_measurement_required: >-
        CONFIRMED. The second parameter was already correctly specified in the
        first gate and was already doing the work for CPU and memory without being
        bound to them. The repair is a rewrite of the control's scope, exactly as
        the red team said.
      strengthening_adopted_beyond_the_objection: >-
        HC-1's recommendation is folded in: run the cardinality-doubling check at
        THREE OR MORE cardinalities rather than two and report the residual from
        linearity, so a superlinearity anywhere in the tested range refutes the
        extrapolation.
      can_the_rescoped_control_still_reject_a_correct_measurement: >-
        NO. A correct load-invariant CPU-seconds measurement now passes parameter
        1 vacuously, because parameter 1 does not apply to it, and is tested by
        parameter 2, which does.

    - n: 9
      id: RT-O8
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: authorization_surface
      ruling_in_DEC_20260818_c52d54: 'R-6, SUSTAINED - and explicitly NOT recorded as an authorization'
      the_objection: >-
        EV-PRE-1 requires a CURRENT free-disk observation on the declared
        execution host and offers NO alternative, while its siblings do. Its block
        is scoped to 'evidence such a decision would have to see FIRST', where
        'such a decision' is ANY later authorizing decision - but EV-PRE-3 itself
        names the two honest remaining routes as a separately authorized
        resource-cap change or CLOSURE OF THIS LANE WITH ITS OBSTRUCTION NAMED,
        and NEITHER needs a statfs. A planning document cannot make a run
        automatic by authorizing it - this one conspicuously does not - BUT IT CAN
        MAKE A RUN UNAVOIDABLE BY WRITING THE PRECONDITION LIST SO THAT EVERY EXIT
        RUNS THROUGH IT. As written, a Coordinator who wanted to close this lane
        tomorrow with its obstruction named would be told by this document that it
        must first see a host measurement. THIS IS NOT AN AUTHORIZATION and
        neither review called it one; it is scheduling pressure inside a boundary
        description, fixable in one clause.
      disposition: ADDRESSED_BY_CHANGE
      what_this_gate_does: >-
        EV-PRE-1 is RESCOPED. It now carries an explicit scope field stating that
        it APPLIES ONLY TO A DECISION THAT WOULD AUTHORIZE MATERIALIZATION ON A
        HOST, and that A CLOSURE DECISION AND A CAP-CHANGE DECISION REQUIRE NO
        HOST OBSERVATION AND ARE NOT BLOCKED BY IT. Its requirement also gains the
        alternative its siblings had - or an explicit written statement that no
        such observation is available and that the decision proceeds without one,
        which fails the frozen preflight minimum by construction.
      why_this_matters_more_than_its_size: >-
        IT IS THE ONE FINDING IN THE WHOLE SET THAT CHANGED WHAT THE DOCUMENT
        COULD DO TO A FUTURE DECISION. Everything else on the list changes what
        the document SAYS. This one changed which exits were reachable, and the
        exit it blocked was the one that costs nothing and needs no host.
      what_the_rescope_does_NOT_do: >-
        IT DOES NOT RECOMMEND CLOSURE AND DOES NOT MAKE CLOSURE EASIER TO JUSTIFY.
        It makes closure REACHABLE WITHOUT A HOST MEASUREMENT, which is a
        statement about procedure and not about merits. EV-PRE-3 still names both
        routes and this gate still recommends NEITHER. Premature closure remains a
        failure symmetric with overclaiming.
      boundary_self_check_extended_because_of_this_finding: >-
        planning-gate-2.yaml's boundary_self_check gains a fifth question - does
        any precondition here force a run on a path that does not need one - with
        its basis stated. A self-check that would have passed the first gate
        unchanged would not have caught this.

    - n: 10
      id: RT-O11
      raised_by: 'red team TASK-20260815-3ec919'
      severity_as_raised: material
      class: archive_custody_infrastructure
      ruling_in_DEC_20260818_c52d54: 'R-8, RECORDED_AS_INFRASTRUCTURE_SIGNAL_AND_CARRIED_NOT_REPAIRED_HERE'
      the_objection: >-
        snapshot-receipt.json declares nine post-commit verification requirements
        of the dispatching session, among them 'path_sha256 filled for all four
        keys' and 'actual first parent recorded, not assumed'. In the durable
        record all four path hashes and both commit fields are null, and exactly
        one commit has ever touched the receipt, so nothing filled them and
        nothing can without superseding. The receipt's own durability rule reads
        'Until the post-commit verifier accepts the commit, nothing bound here is
        durable evidence.'
      disposition: CARRIED_NOT_REPAIRABLE_HERE
      why_it_cannot_be_repaired_here: >-
        THE RECEIPT IS IMMUTABLE, IS OUTSIDE THIS WORK UNIT, AND THIS SESSION HAS
        NO SHELL WITH WHICH TO COMPUTE A HASH. Writing one would be fabrication
        under AGENTS.md rule 9. The repair is a superseding receipt written by an
        authorized session that holds a shell, and it is not this document's to
        write.
      it_is_infrastructure_signal_and_is_recorded_as_such: >-
        A custody-bookkeeping defect is NEVER a negative mathematical result about
        JINV, transport, isogeny classes, an instrument, a curve, a prime, or
        ECDLP, in either direction, at any scale. LEAVING THE FIELDS NULL RATHER
        THAN FABRICATING THEM WAS THE CORRECT CALL; the defect is that the filling
        step never happened afterwards.
      how_far_it_is_already_answered: >-
        SUBSTANTIALLY, AND THAT IS RECORDED SO IT IS NOT RE-RAISED AS WORSE THAN
        IT IS. The validator established that the content binding for that archive
        EXISTS - in the BATCH-25e27c queue archive block - and recomputed all four
        values there, all matching. The red team independently computed all four
        artifact hashes and confirmed snapshot equals HEAD equals working tree for
        each. THE CONTENT IS VERIFIED; IT IS SIMPLY NOT VERIFIED BY THE RECEIPT.
      what_this_gate_does_instead: >-
        Adds artifacts.archive_custody_requirement_added_in_this_gate, which binds
        any snapshot or ledger archive OF THIS WORK UNIT to fill path_sha256 for
        every declared path, record the actual first parent rather than assume it,
        leave generated_paths_skipped empty, and obtain the dispatcher's
        post-commit acceptance - and states that nothing in this work unit is
        durable evidence until that verifier accepts.
      this_gates_own_hash_fields: >-
        NULL, WITH THEIR REASON, FOR EXACTLY THE SAME REASON AND WITH THE SAME
        EXPOSURE. This gate cannot compute the hashes of its own five files
        either. It therefore inherits RT-O11's risk rather than escaping it, and
        says so rather than implying it has solved a problem it has only
        documented.
      structural_item_carried_not_solved: >-
        A reader holding only a snapshot receipt cannot content-verify an archive,
        because the content binding lives in dispatch_queue.json, which the batch's
        own constraint declares control-plane only and not a task artifact. THAT
        IS A CONVENTION-LEVEL TENSION, NOT A DEFECT OF EITHER GATE, and it is
        recorded for whoever revisits archive-receipt shape.

