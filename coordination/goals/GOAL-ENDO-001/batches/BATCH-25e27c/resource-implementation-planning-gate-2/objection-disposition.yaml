  independence_note: >-
    THE TWO REVIEWS THIS FILE DISPOSES ARE NOT DISTINCT-MODEL CORROBORATION. Both
    reviewers and the first gate's producer resolve to the same backend and model
    family; both reviewers disclosed it unprompted; neither resolved model id was
    probe-verified. Their agreement is CORRELATED SAME-MODEL JUDGEMENT - one
    opinion sampled twice - and no record may describe this batch as cross-model
    confirmation or as a quorum. What IS genuinely uncorrelated is their
    CONSTRUCTIONS: one executed the committed self-test in an audited scratch copy
    and re-derived the same values without it; the other never executed the pinned
    module at all, deriving the canonical encoding itself and reimplementing the
    census. THAT CONVERGENCE BY DIFFERENT ROUTE IS THE PART WORTH RELYING ON. This
    Coordinator session resolves to the same family again, which is why it opened
    the cost source first-hand rather than working from the reviews' quotations
    wherever it could.
  the_correlated_failure_mode_is_not_hypothetical_here: >-
    IT FIRED. On MF-2 the red team ran the producer's own too-narrow search, got
    the same zero, and endorsed the conclusion as exactly right, while the
    validator varied the search and found the truth. TWO OF THREE SAME-FAMILY
    SESSIONS MADE THE IDENTICAL MISTAKE; ONE DID NOT, BECAUSE IT VARIED ITS
    METHOD. That is the strongest available argument for a genuinely
    distinct-model or distinct-construction reviewer on any future absence claim,
    and it is why PB-4 in this gate requires the two reviews to use DIFFERENT
    CONSTRUCTIONS and not merely different sessions.
