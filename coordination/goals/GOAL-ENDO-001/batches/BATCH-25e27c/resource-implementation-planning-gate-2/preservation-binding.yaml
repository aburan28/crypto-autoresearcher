        The first manifest recorded that two count fields the contract places
        inside its obligation-6 binding block live, in the committed source,
        under a different neighbouring object. THE VALUES AGREE; ONLY THEIR
        LOCATION DIFFERS. Carried, not repaired.
      preserved_unchanged_by_this_gate: true
      this_session_recomputed: nothing

