schema: crypto.autoresearch.preservation_binding.v1
preservation_binding:
  id: PRESBIND-GOAL-ENDO-001-BATCH-25e27c-GATE-2
  task_id: <ALLOCATE-TASK-ID>
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-25e27c
  experiment_id: EXP-JINV-bd141d
  work_unit_slug: resource-implementation-planning-gate-2
  role: coordinator
  recorded_at: '2026-08-19'
  companion_to: planning-gate-2.yaml
  obligation_count: 18
  obligations_dropped: 0
  obligations_reworded: 0
  obligations_silently_resolved: 0
  obligations_re_transcribed_by_this_session: 0

  # ==================================================================
  # WHY THIS FILE BINDS BY REFERENCE AND TRANSCRIBES NOTHING
  # ==================================================================
  binding_method:
    method: BINDING_BY_EXACT_REFERENCE
    this_file_contains_zero_obligation_verbatim_strings: true
    the_rule_this_file_follows: >-
      THE EIGHTEEN obligation_verbatim STRINGS ARE NOT REPRODUCED ANYWHERE IN
      THIS WORK UNIT. Each obligation is bound by an exact pointer to the field
      that already holds it, in a committed artifact, at a path stated in full.
      A reader who needs the text reads it there.
    why: >-
      A SECOND TRANSCRIPTION OF EIGHTEEN FROZEN STRINGS IS A SECOND OPPORTUNITY
      TO CORRUPT ONE, AND THIS SESSION HAS NO PARSER AND NO HASHING TOOL WITH
      WHICH TO PROVE A TRANSCRIPTION FAITHFUL. The GOAL-ENDO-001 head itself
      refused to re-transcribe them for exactly this reason when it was
      reconciled on 2026-08-19, and incorporated them BY EXACT REFERENCE
      instead. This file does the same thing for the same reason. Copying
      eighteen strings correctly is not a skill this session can demonstrate; not
      copying them is.
    what_this_costs: >-
      A READER CANNOT SEE THE OBLIGATION TEXT IN THIS FILE. That cost is
      accepted. Every entry carries the exact path and field where the text
      lives, and a subject_descriptor written by this Coordinator so a reader
      knows which obligation is which without the text being restated.
    subject_descriptors_are_not_the_obligations:
      statement: >-
        EACH ENTRY BELOW CARRIES A subject_descriptor. IT IS THIS COORDINATOR'S
        OWN NON-NORMATIVE DESCRIPTION OF WHICH OBLIGATION THE ENTRY IS ABOUT. IT
        IS NOT THE OBLIGATION, IT IS NOT A PARAPHRASE OF THE OBLIGATION OFFERED
        AS EQUIVALENT, AND IT HAS NO BINDING FORCE WHATEVER. If a descriptor and
        the referenced obligation_verbatim ever appear to disagree, THE
        obligation_verbatim GOVERNS ABSOLUTELY and the descriptor is simply
        wrong.
      why_they_are_included_at_all: >-
        Without them this file is eighteen numbered pointers and a reviewer
        cannot navigate it. The descriptors buy navigability at the cost of a
        clearly-labelled non-authoritative gloss, which is a better trade than
        either an unusable file or a second transcription.

  # ------------------------------------------------------------------
  # THE AUTHORITATIVE SOURCES, IN PRECEDENCE ORDER
  # ------------------------------------------------------------------
  authoritative_sources:
    primary:
      path: coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate/tasks/TASK-20260815-f04b54/preservation-manifest.yaml
      field_for_obligation_n: 'preservation_manifest.obligations[n=<n>].obligation_verbatim'
      obligation_count_declared_there: 18
      why_primary: >-
        It is the committed, immutable, independently reviewed enumeration. BOTH
        REVIEWS CHECKED IT AGAINST THE GOAL HEAD AND BOTH FOUND ALL EIGHTEEN
        PRESENT VERBATIM WITH ZERO DROPPED, ZERO REWORDED AND ZERO SILENTLY
        RESOLVED. The validator additionally split the goal head's own clause
        independently and obtained exactly 18 fragments matching the manifest's
        18 entries one-for-one AND IN ORDER, and found the manifest's 18 strings
        byte-identical to the frozen contract's 18 after whitespace
        normalization with zero mismatches. The red team compared all eighteen
        against the head clause by clause and found none dropped, none summarized
        away, none softened.
      immutable: true
      edited_by_this_session: false
    secondary_the_mutable_head:
      path: ledger/goals/GOAL-ENDO-001/goal.yaml
      field: 'research_goal.next_action_note_20260819_endo_head_reconcile_superseded_exact'
      what_it_is: >-
        The retained exact prior next_action, produced by RENAMING THE next_action
        KEY IN PLACE without re-indentation, so its parsed scalar is unchanged and
        only the key name differs. The eighteen obligations live inside it and the
        current next_action incorporates them BY EXACT REFERENCE to this key.
      why_secondary_rather_than_primary: >-
        IT IS THE MUTABLE HEAD. It has been reconciled three times in this
        campaign's recorded history and may be reconciled again. The committed
        manifest cannot change. Where the two are compared they agree, per both
        reviews.
    tertiary_the_controlling_decision:
      path: ledger/decisions/DEC-20260813-d14d6b.yaml
      field: 'coordinator_decision.next_actions[0].action'
      action_id: separate_bounded_jinv_resource_and_implementation_planning_gate
      relation_to_the_head: >-
        The validator tested the producer's claim that this is the identical
        sentence and VERIFIED it: next_actions has length 1, and the action field
        is 1222 characters, identical to the goal head's next_action at 1222
        characters after whitespace normalization. THAT CHARACTER COUNT AND THAT
        EQUALITY ARE THE VALIDATOR'S FINDINGS. This session measured neither and
        asserts neither; it has no parser and no character-counting tool.

  # ------------------------------------------------------------------
  # THE FOLD TRAP - RECORDED SO IT DOES NOT PRODUCE A SECOND FALSE FINDING
  # ------------------------------------------------------------------
  fold_trap_warning:
    severity: 'LIVE - it has already produced one false finding in this campaign'
    the_trap: >-
      SIX OF THE EIGHTEEN OBLIGATIONS - NUMBERS 1, 6, 7, 11, 14 AND 17 - ARE
      SPLIT ACROSS A LINE BREAK IN THE RAW BYTES OF THE FOLDED YAML SCALAR THAT
      HOLDS THEM IN THE GOAL HEAD, and match their obligation_verbatim strings
      ONLY AFTER YAML FOLDING. A raw byte search for the complete text of one of
      them therefore returns ZERO MATCHES WHILE THE OBLIGATION IS PRESENT AND
      INTACT.
    the_documented_instance: >-
      The head records, measured against the file before the 2026-08-19
      reconciliation: a raw byte search for the COMPLETE text of obligation 14 -
      which is broken by a newline immediately after a hyphenated token near its
      middle - returned ZERO matches, while a folding-aware multiline search for
      the same obligation returned TWO. A FOLD-BLIND CHECK WILL TELL YOU AN
      OBLIGATION IS MISSING WHEN IT IS NOT.
    what_this_session_did_about_it: >-
      IT DID NOT RUN ANY SUCH SEARCH, IN EITHER FORM, AND MAKES NO CLAIM IN
      EITHER DIRECTION ABOUT THE PRESENCE OR ABSENCE OF ANY OBLIGATION TEXT IN
      THE GOAL HEAD. It has no shell, so it could not have run a folding-aware
      search, and running only the fold-blind form would have been the exact
      trap. The presence of all eighteen in the head is carried as the finding of
      the two independent reviews, which checked it with tools and by
      independent clause-splitting.
    the_binding_rule_for_successors: >-
      ANY FUTURE ASSERTION THAT AN OBLIGATION IS MISSING FROM THE HEAD MUST PARSE
      THE SCALAR, OR SEARCH ACROSS THE FOLD, BEFORE IT IS MADE. A separator-free
      or fold-blind search returning nothing is not evidence of absence; it is
      the R-10 failure repeating in a new form.
    relation_to_R_10: >-
      SAME FAILURE, DIFFERENT SURFACE. R-10 was adopted after two absence claims
      failed because a search was narrower than the conclusion drawn from it. The
      fold trap is a third way for a search to be narrower than its conclusion -
      narrower in UNIT rather than in pattern or scope. Head constraint C-C
      records that two R-10 failures occurred in this campaign on one day, one
      from a wrong search unit and one from a wrong search scope.

  # ==================================================================
  # THE EIGHTEEN, BOUND BY REFERENCE
  # ==================================================================
