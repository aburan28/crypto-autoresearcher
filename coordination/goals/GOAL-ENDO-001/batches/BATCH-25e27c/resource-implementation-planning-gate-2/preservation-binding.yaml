      split_across_a_line_break_in_the_head: true
      binding_carried_from: 'preservation-manifest.yaml obligations[n=6].binding_recorded_by_this_manifest, which bound THREE manifests, not two'
      binding_status: ALL_THREE_CANDIDATE_MANIFESTS_REMAIN_BOUND
      manifests_bound: 3
      manifest_hashes_restated_here: false
      manifest_hashes_restated_here_reason: >-
        DELIBERATELY NOT RESTATED. The three hashes are bound at
        preservation-manifest.yaml obligations[n=6].binding_recorded_by_this_manifest
        and are cited there rather than retyped here. Retyping three 64-character
        hex strings by hand, in a session with no hashing tool to check them
        against, is the same avoidable transcription risk as retyping the
        obligations. THE COMMITTED MANIFEST IS THE BINDING; THIS FILE POINTS AT
        IT.
      open_binding_defect: true
      open_binding_defect_id: OBD-1
      obd_1_status: OPEN_AND_NOT_RESOLVED_BY_THIS_GATE
      obd_1_substance_without_selecting_a_reading: >-
        The obligation's own words admit TWO READINGS of which pair of manifests
        is meant. Under the frozen contract's reading, one approved,
        decision-cited manifest present in the approved bytes is bound by NO
        OBLIGATION AT ALL. The producer BOUND ALL THREE, STATED BOTH READINGS,
        AND SELECTED NEITHER, which the frozen contract itself instructed and
        which both reviews explicitly endorsed as the correct call.
      what_both_reviews_added_recorded_because_it_strengthens_the_defect: >-
        BOTH STRENGTHENED IT INDEPENDENTLY, AND THE SECOND READING GAINED
        COMPUTATIONAL SUPPORT. The validator recomputed the contested manifest
        hash from the 45-entry object it names and found it reproduces exactly,
        and found it in NINE committed places - three more than the producer
        claimed, INCLUDING THE CONTROLLING DECISION AND THE NEUTRAL EVIDENCE
        RECORD - while finding it ZERO times in the committed work-unit queue
        where the other two occur four and five times respectively. That
        asymmetry independently EXPLAINS how the frozen contract's reading arose
        and CONFIRMS that under that reading an approved, decision-cited manifest
        is bound by no obligation. The red team, independently and by direct
        computation, established which named object each of the two 45-entry
        manifests hashes, and concluded that this makes the defect MATERIAL
        RATHER THAN COSMETIC.
      why_this_gate_does_not_act_on_that_strengthening: >-
        BECAUSE THE AUTHORITY QUESTION IS NOT HOW STRONG THE CASE IS BUT WHO MAY
        DECIDE. Head constraint C-B states that OBD-1 remains open, is not
        resolved, and that choosing a reading is a goal-head-interpretation act
        reserved to a separately authorized Coordinator decision that cites the
        artifact it relies on and supersedes rather than edits the frozen
        binding - and that a producer may NEVER make it silently.
        DEC-20260818-c52d54 ruling R-3 records that the adjudicating Coordinator
        did not have the authority either and said so rather than resolving it
        quietly. THIS GATE HAS LESS AUTHORITY THAN THAT DECISION, NOT MORE.
      what_this_gate_does_instead: >-
        Keeps all three bound, records the strengthening so the authorized
        decision can weigh it, and adds EV-PRE-7 to planning-gate-2.yaml so that
        any later decision relying on this obligation's binding must first see
        whether OBD-1 has been adjudicated.
      what_would_close_it: >-
        A later, separately authorized Coordinator decision that states which
        reading the next_action carries, cites the artifact it relies on, and
        supersedes rather than edits the frozen contract's binding - performed
        through a goal-head reconciliation of the kind this campaign has
        performed twice.
      what_is_NOT_at_risk_from_OBD_1: >-
        NO APPROVED BYTE, NO BOUND VALUE AND NO TERMINAL RECORD. All three
        manifest hashes reproduce exactly under both reviews. OBD-1 IS A DEFECT
