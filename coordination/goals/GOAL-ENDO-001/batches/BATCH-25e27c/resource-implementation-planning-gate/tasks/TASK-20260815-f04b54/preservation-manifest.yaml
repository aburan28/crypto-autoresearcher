        severity: material
        statement: >-
          A THIRD, DISTINCT ALIAS-SUITE MANIFEST EXISTS IN THE APPROVED v6
          BYTES AND IS NOT BOUND BY THE FROZEN CONTRACT. The contract binds
          'both manifests' to the alias-universe manifest 595ccde1... and the
