          and in three independent committed places (v6.yaml type_alias_suite,
          the TASK-20260813-737a9f snapshot receipt, and the controlling
          decision DEC-20260813-d14d6b), a third manifest hash
          7415d195d5c7c2cd099b566a5c123f4adb3f45fb19c2ccc7077b37cf23da9c43
          belonging to the type_alias_suite itself and distinct from both.
        two_candidate_readings:
          reading_A: >-
            'both manifests' = the alias-universe manifest 595ccde1... and the
            legacy mutation manifest e96a9359.... This is the frozen contract's
            reading. Against it: the legacy manifest already has its own
            separate obligation, number 7, so this reading makes obligation 6
            partly redundant with obligation 7 and leaves 7415d195... bound by
            no obligation at all.
          reading_B: >-
            'both manifests' = the two ALIAS manifests, the alias-universe
            595ccde1... and the alias-suite 7415d195..., which is the natural
            reading of a clause whose subject is 'the 45-case alias suite' and
            whose sibling obligation 7 separately covers the legacy suite and
            its manifest. Against it: it is not what the frozen contract says.
        action_taken: >-
          BOUND, NOT RESOLVED. All three manifests are bound below. This
          session did NOT silently pick a reading, and does not have the
          authority to resolve the ambiguity; resolution is for a later,
          separately authorized decision.
