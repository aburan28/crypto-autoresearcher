  what_this_document_is: >-
    This is the ONE separate bounded NONAUTOMATIC resource-and-implementation-
    planning gate required verbatim by the GOAL-ENDO-001 goal-head next_action
    (ledger/goals/GOAL-ENDO-001/goal.yaml, field next_action, lines 185-203 of
    that file as read by this session) and by the single next_action of
    DEC-20260813-d14d6b (field next_actions[0].action, action_id
    separate_bounded_jinv_resource_and_implementation_planning_gate). It BEGINS
    FROM the fail-closed resource_incomplete disposition and LEAVES IT THERE.
    It specifies the six contents that next_action names in its own words -
    estimates, budgets, stopping rules, controls, artifacts, and a fresh
    authorization boundary - and it preserves the eighteen obligations that
    next_action lists, whose per-obligation bindings and independent-read
    results are in the sibling file preservation-manifest.yaml.

  what_this_document_is_not: >-
    It is not an approval, not a contract, not an amendment, not a protocol
    change, not a resource change, not a dispatch, not a schedule, and not a
    measurement. It contains no observation, no run, no timing, no statistic,
    and no curve, target, plant bank, or null bank. Every number in it was read
    from a committed artifact and is cited to that artifact, or is disclosed as
    UNDERIVED with its reason.

  authorizes_nothing:
    statement: >-
      THIS GATE AUTHORIZES NOTHING. It does not authorize implementation. It
      does not authorize Phase B. It does not authorize any control or
      experiment. It does not authorize target or curve access. It does not
      authorize JINV or transport work. It does not authorize N18. It does not
      authorize science. It does not authorize status change. It does not
      authorize ECDLP work or any ECDLP claim. It does not authorize closure.
      It does not authorize breakthrough. It does not authorize publication. It
      does not authorize network write. It does not authorize execution. It is
      a static planning document and nothing else. Nothing in it becomes
      automatic, scheduled, presumed, or pre-approved by having been written
      down here, and no later reader may treat any PROPOSED item below as
      granted.
    implementation_authorized: false
    phase_b_authorized: false
    control_runs_authorized: 0
    experiment_runs_authorized: 0
