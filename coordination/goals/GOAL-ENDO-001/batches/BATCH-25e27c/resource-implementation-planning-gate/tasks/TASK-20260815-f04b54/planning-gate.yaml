      - 'ledger/decisions/DEC-20260813-d14d6b.yaml: resource_incomplete_preservation.controlling_disposition'
    producing_an_estimate_does_not_clear_a_gate: >-
      EXPLICIT AND LOAD-BEARING. This document ESTIMATES, or discloses as
      underived, the three missing v3/v4 estimates and the five failed v3/v4
      gates. Producing an estimate is not passing a check, and passing a check
      is not clearing the disposition. resource_incomplete is cleared only by a
      later, separately authorized Coordinator decision acting on evidence this
      gate does not have and does not create. Nothing below may be read as that
      decision. On the committed upper bounds themselves, four of the five
      failed gates fail by factors of roughly 1e2 to 1e5 (see estimates E4-E7),
      so the estimates in this document make the fail-closed disposition MORE
      firmly grounded, not less.
