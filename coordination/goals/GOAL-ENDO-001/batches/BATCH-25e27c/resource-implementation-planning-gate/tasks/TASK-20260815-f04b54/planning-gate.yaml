  fresh_authorization_boundary:
    label: a fresh authorization boundary
    nature: >-
      THIS IS A DESCRIPTION OF A BOUNDARY, NOT A GRANT OF ONE. Reading this
      section confers nothing. It states what a later, separately authorized
      Coordinator decision would have to grant explicitly, what such a decision
      would STILL not grant, and what evidence it would have to see before it
      could be written at all.
    what_a_later_decision_would_have_to_grant_explicitly:
      - 'A named, budgeted authorization for PB-1 (read-only host preflight refresh), stating explicitly that it materializes nothing and consumes no experiment run identifier.'
      - 'A named, budgeted authorization for PB-2 (rate-constant derivation), stating explicitly whether it is separable from instrument execution and refusing it if it is not.'
      - 'A named authorization for PB-3 (implementation design against the frozen caps), which is static authoring and creates no evidence.'
      - 'Independent review authority for PB-4, at review-adversarial, xhigh, non-degradable, in two disjoint independent sessions.'
      - 'Archive authority for PB-5, content-first, run alone, post-commit verified.'
      - 'Separately and additionally: any change to a frozen resource cap, which is a RESOURCE CHANGE and is not implied by any estimate, any design, or any review verdict.'
    what_such_a_decision_would_still_not_grant:
      - implementation of the Phase B workload
      - Phase B execution
      - any control run, experiment run, instrument run, or JINV run
      - target or curve access
      - JINV or transport work
      - N18 implementation, contracting, or approval
      - any scientific interpretation
      - any research-status, hypothesis-status, experiment-status, or goal-status change
      - any ECDLP work or ECDLP claim
      - closure of the goal or of any lane
      - any breakthrough claim
      - publication of any claim
      - any transfer of a one-N N=19507 toy statement to a second N or to cryptographic scale
      - any credit against resource_incomplete by compression, deduplication, hash-only substitution, omitted cells, or budget widening
    evidence_such_a_decision_would_have_to_see_first:
      - id: EV-PRE-1
        requirement: 'A CURRENT free-disk observation on the declared execution host, replacing the inherited, unrefreshed v3 statfs (E8), recorded with host, filesystem, and timestamp.'
      - id: EV-PRE-2
        requirement: 'Derived per-stage CPU, wall, and peak-memory rates (E1, E2, E3) with control CT-4 MEASURED, including the load-dependence and cardinality-doubling checks, or an explicit statement that they remain underived.'
      - id: EV-PRE-3
        requirement: >-
          A design that brings retained bytes, the largest individual artifact,
          the shard count, and total logical I/O within the frozen caps WITHOUT
          any prohibited credit - or an explicit written statement that it
          cannot, in which case only two honest routes remain visible from the
          committed record: a separately authorized resource-cap change, or
          closure of this lane with its obstruction named. THIS GATE CHOOSES
          NEITHER ROUTE AND RECOMMENDS NEITHER.
      - id: EV-PRE-4
        requirement: >-
          The status of the separate blockers that no estimate touches: N18
          (unapproved, uncontracted, unimplemented, unexecuted); the
          source-pinned independently reverified same-k
          scalar-orientation-preserving C-TRANSPORT-CERT (not authorized, not
          executed); the second matched N (required, not satisfied); the one-N
          N=19507 toy ceiling (binding); and the historical two-harness-path
          discrepancy (preserved, uncured).
      - id: EV-PRE-5
        requirement: >-
          The two-directional instrument control of criterion C4 and pause
          condition P1, undischarged at the time of this writing. An
          instrument that has not both detected a plant and rejected a matched
          null cannot support a conclusion, so no amount of resource planning
          reaches a result through it.
      - id: EV-PRE-6
        requirement: >-
          The separately recorded specification gap named as N17 in the
          GOAL-ENDO-001 goal head's retained superseded next_action note - the
          frozen EXP-JINV-bd141d specification.yaml instantiating no
          factor_base_sizes list and no target count - which that note records
          as blocking raw data collection regardless of the isogeny question.
          THIS GATE NEITHER ADJUDICATES NOR DISCHARGES N17; it is named because
          a later authorization would have to see its status, and because
          silently planning around it would be dishonest.
    boundary_self_check:
      does_this_section_grant_anything: false
      does_this_document_grant_anything: false
      is_any_item_above_scheduled: false
      is_any_item_above_automatic: false

  scope_and_claim_boundary:
    claim_tier: toy
    sota_delta: zero on time, memory, data, query, exponent, JINV, ECDLP, trapdoor, scientific-status, closure, and breakthrough axes
    dominated_by: 'not_applicable: this is a mandatory planning gate, not a competing time-memory-data-query attack mechanism'
    tested_scale: none; this document measures nothing
    one_N_ceiling: 'N = 19507 only; a second matched N does not exist'
    transfer_assumptions: none are made, because nothing here is transferred anywhere
    completion_criteria_effect: 'NONE OF C1, C2, C3, C4 IS MET OR ADVANCED. A planning gate is not a lane adjudication, not an oracle-class simulability determination, and not an instrument control.'
    pause_conditions_effect: 'P1, P2, P3 are not engaged: this document takes no instrument reading, bears on H-STR-002 in neither direction, and states no candidate, excess, or break.'
    hypothesis_effect: none in either direction at any scale

  nonclaims:
