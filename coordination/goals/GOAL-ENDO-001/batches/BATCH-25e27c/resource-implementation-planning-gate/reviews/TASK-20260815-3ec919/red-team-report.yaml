    this harness every policy alias currently falls back to one backend, so this
    red-team review, the concurrent validator review, and the reviewed producer
    work all resolve to models on the SAME backend. "Independent" here means an
    independent session, an independent context, and a from-scratch reading of
    the snapshot bytes - NOT independent judgement from a different model
    family. This batch must not present two same-model reviews as stronger
    corroboration than they are: two agreeing reviews from one model are one
    model's judgement rendered twice, and correlated error is the failure mode
    that independence exists to catch. I did not read, wait for, coordinate
    with, or receive any message from the validator, and I wrote nothing outside
    my declared write scope.

