  objections:
    - id: RT-O1
      severity: material
      class: cost_model
      locus: 'planning-gate.yaml estimates.failed_gates E4, E5, E6, E7; and estimates.estimates_summary.honest_reading'
      title: The four failed byte/shard/IO gates are not four independent facts; they are one quantity counted four times.
      finding: >-
        E7's method field states 'exact-cardinality accounting of every declared
        replay visit and serialization pass, committed as an upper bound'. The
        committed source says something different and simpler: the
        v4-cost-worksheet.json formula for total_logical_io_bytes_upper is
        literally '3*retained_artifact_bytes_upper'. This session verified
        E7 = 3 x E4 EXACTLY. Further: E5's committed formula is
        'all_replacement_pairs_upper*256', and that single component is
        50230103040000 bytes = 99.5658 percent of the entire E4 retained total;
        and E6's committed formula is
        'ceil(retained_artifact_bytes_upper/536870912)'. So E5, E6 and E7 are
        all deterministic functions of E4, and E4 is 99.57 percent one term.
        estimates_summary then reports that the workload 'overshoots four gates
        by roughly 1e2 to 1e5', and resource_disposition repeats that 'four of
        the five failed gates fail by factors of roughly 1e2 to 1e5'. That
        phrasing presents four independent lines of evidence where there is
        one. The gate demonstrably knew the worksheet carries formula fields --
        it reproduced E6's formula as ARITH-2 -- so this is a selective failure
        to carry provenance, not an absence of it.
      why_it_matters: >-
        Two ways. (a) It inflates the apparent robustness of the fail-closed
        disposition: four corroborating failures is a stronger-looking record
        than one failure viewed four ways. (b) More usefully, it is
        ACTIONABLE FORWARD GUIDANCE the gate withholds. A PB-3 author reading
        the gate as written would believe four separate cap problems must be
        solved. In fact ONE lever -- all_replacement_pairs_upper, 196211340000
        pairs at 256 bytes each -- controls all four simultaneously.
      direction: >-
        This objection does NOT help anyone clear the gate. The single
        underlying quantity still exceeds the retained cap by 11695x on its
        own. Reporting it strengthens rather than weakens fail-closed.
      cheapest_falsification: >-
        Zero-run, ~10 lines: reduce all_replacement_pairs_upper alone by a
        factor f in the committed formula chain and recompute E4, E5, E6, E7.
        If all four do not move together, RT-O1 IS WRONG and should be struck.

    - id: RT-O2
      severity: material
      class: cost_model_omitted_cost
      locus: 'planning-gate.yaml estimates.failed_gates E7 (method, uncertainty) and E5 (uncertainty)'
      title: The logical-I/O figure is an UNSHARDED model presented as an upper bound, while the shard gate says sharding is mandatory.
      finding: >-
        E7 is retained x 3 -- a fixed three-pass model. E5 is explicitly the
        'individual_artifact_check_WITHOUT_SHARDING'. But E6 states that any
        admissible design needs AT LEAST 93969 shards under the frozen
        individual-artifact cap. A 93969-way shard-and-merge design necessarily
        re-reads and re-writes across the merge boundary; that I/O is not in a
        flat 3x multiplier over the retained total. E7's uncertainty field says
        only 'upper bound as above; no credit may reduce it' and never states
        that the bound is conditional on the unsharded model. E5's uncertainty
        field DOES flag that a sharding design would change the
        individual-artifact question and require its own authorization -- but
        the same conditionality is never propagated to E7.
      consequence: >-
        E7 = 151347407533824 is NOT an upper bound for any design that could
        actually be run under the frozen caps. For admissible (sharded)
        designs it behaves as a LOWER bound. Calling it an upper bound is the
        one place in the estimates section where the stated uncertainty
        direction is wrong.
      direction: >-
        Again conservative: the true admissible-design I/O is HIGHER, so this
        makes fail-closed more firmly grounded. It cannot be used to take
        credit against resource_incomplete.
      cheapest_falsification: >-
        Exhibit any single-pass streaming design over 93969 shards whose total
        logical I/O is <= 3x retained bytes with no prohibited credit. If one
        exists, RT-O2 is wrong.

    - id: RT-O3
      severity: material
      class: authorization_surface_and_provenance
      locus: 'planning-gate.yaml what_this_document_is_not; budgets.proposed_not_authorized PB-1..PB-5'
      title: The document states a universal provenance rule about itself that fifteen of its own numbers violate -- and they are precisely the budget numbers.
      finding: >-
        what_this_document_is_not asserts, without qualification: 'Every number
        in it was read from a committed artifact and is cited to that artifact,
        or is disclosed as UNDERIVED with its reason.' The
        budgets.proposed_not_authorized block carries fifteen substantive
        numeric figures -- wall_clock_seconds, memory_gb and disk_bytes for
        each of PB-1 through PB-5 (600/1/1048576, 3600/2/1073741824,
        5400/4/8388608, 5400/4/4194304, 1800/2/4194304). This session audited
        every field of all five items: NONE carries a citation to a committed
        artifact and NONE is marked UNDERIVED. PB-2 through PB-5 have no
        citation-bearing field at all. PB-1 has exactly one, precedent_read,
        and it cites the load-average RECORDING requirement, not the
        600-second figure. The contrast with the estimates section is stark:
        E1, E2 and E3 are scrupulously marked UNDERIVED_DISCLOSED with reasons,
        and limitations lists five items, none of which is 'the PB budget
        figures are underived'.
      why_this_is_the_authorization_finding: >-
        This is the exact mechanism the goal head's NONAUTOMATIC clause exists
        to prevent: pricing an item so precisely that running it looks
        pre-approved. Fifteen precise, uncited figures plus a summed envelope
        (16800 s, 1091567616 bytes) plus exact output paths and record types
        constitute a dispatch-ready package missing only the ID tokens. The
        document says loudly and repeatedly that these are not grants, and this
        session found NO sentence that grants them -- see
        authorization_surface_assessment. But an unsourced precise number whose
        only possible use is to justify a budget nobody granted is the residue
        of authorization even when the authorization words are all correct.
      cheapest_falsification: >-
        Point to any committed artifact stating 600 s for a host preflight or
        3600 s for a rate-constant derivation. If one exists, this objection
        narrows to a missing citation rather than an underived figure.

    - id: RT-O4
      severity: material
      class: hidden_assumption_and_selective_citation
      locus: 'planning-gate.yaml budgets.proposed_not_authorized PB-1.precedent_read (lines 503-508) and controls CT-4.source_read (line 739)'
      title: The gate cites the E14 C1 load precondition twice, and both times drops the committed clause that undercuts its own weakest assumption.
      finding: >-
        The committed goal head text (ledger/goals/GOAL-ENDO-001/goal.yaml,
        lines 627-633) reads: 'record 1/5/15-minute load averages and core
        count at start and at every rung boundary, and DO NOT START above
        1-minute load average 28 on 14 cores, since the host has recently run
        between 18 and 116 on 14 cores and the whole cost model is a linear
        extrapolation from one 128.234 s run'. The gate's PB-1.precedent_read
        renders this as recording load averages 'and declining to start above a
        DECLARED LOAD THRESHOLD'. String counts in the two files:
        goal.yaml contains '128.234' 4 times, 'load average 28' once, 'between
        18 and 116' once, '14 cores' 3 times. planning-gate.yaml contains
        '128.234' ZERO times, '116' ZERO times, '14 cores' ZERO times, and
        'declared load threshold' twice. (The five '28' substrings in the gate
        were checked individually and are all incidental fragments of larger
        numerals such as 50448685858816 and 138240.)
      why_it_matters: >-
        Two distinct harms. (a) A concrete committed NUMBER -- threshold 28 on
        14 cores -- was available and was replaced by prose, in a document
        whose stated rule is that every number is cited to a committed
        artifact. This is the inverse of RT-O3: there, numbers appear without
        sources; here, a source's number is dropped. (b) Far more seriously,
        the omitted clause is the single strongest piece of committed evidence
        AGAINST PB-2's linear-extrapolation assumption -- the assumption the
        gate itself calls 'THE WEAKEST LINK IN THE WHOLE PLAN'. The goal head
        records that this very campaign already built a cost model by linear
        extrapolation from ONE 128.234 s run on a host whose load has ranged
        from 18 to 116 on 14 cores. The gate cites the sentence for the part
        that supports proposing PB-1 and omits the part that impeaches PB-2.
        The same omission also silently threatens PB-2's uncited 3600 s budget:
        a ~6x load spread on the intended host is a ~6x wall-time spread.
      cheapest_falsification: >-
        grep the gate for '128.234', '116', or 'load average 28'. Any hit
        falsifies the omission claim. (Run: zero hits.)

    - id: RT-O5
      severity: material
      class: stopping_rules
      locus: 'planning-gate.yaml stopping_rules.rules SR-1..SR-9'
      title: No stopping rule binds the outcome of PB-3, the plan's single most consequential proposed item.
      finding: >-
        SR-2's thresholds are exactly three: cpu-seconds > 138240, wall-seconds
        per run > 21600, peak memory > 6871947673. Those gate E1/E2/E3 only.
        SR-3 fires only when a design fits a cap BY TAKING one of the five
        prohibited credits. SR-1 is disk, SR-4 budget, SR-5 recomputation
        disagreement, SR-6 scope escape, SR-7 policy, SR-8 unmeasured control,
        SR-9 one-N transfer. NOTHING in the set binds a PB-3 design against the
        four failed byte/shard/IO gates E4-E7.
      concrete_counterexample: >-
        Suppose PB-3 returns a design reducing retained bytes from
        50449135844608 to 5.0e12 -- a genuine 10x engineering improvement,
        using NO compression, NO deduplication, NO hash-only substitution, NO
        omitted cell and NO budget widening. It is still ~1164x over the
        4294967296 retained cap and still needs ~9313 shards against a cap of
        24. SR-1 does not fire (not a disk observation). SR-2 does not fire (not
        a CPU/wall/memory estimate). SR-3 does not fire (no credit taken). SR-4
        through SR-9 do not fire. The plan's own rule set returns no stop. Only
        EV-PRE-3, which is a precondition on a future DECISION rather than a
        stopping rule on the WORK, would catch it.
      why_it_matters: >-
        The general_clause promises 'each can fire against the interest of
        whoever is running the work'. For the deliverable most likely to be
        argued about, none can fire at all. A rule set that cannot refuse the
        central deliverable is incomplete.
      cheapest_fix: >-
        One rule: 'SR-10. Observation: any PB-3 design. Threshold: retained
        bytes > 4294967296, or largest individual artifact > 536870912, or
        shards > 24, or logical I/O > 274877906944. Action: STOP; the design
        does not fit the frozen caps and the disposition remains fail-closed.'

    - id: RT-O6
      severity: material
      class: controls
      locus: 'planning-gate.yaml controls.eventual_phase_b_quantities CT-3'
      title: CT-3's null object is a nuisance population, not a null, and its destroying parameter cannot make it fail.
      finding: >-
        CT-3 names as its matched_null_object 'the p-rank nuisance map contexts
        (p_rank_nuisance_total_map_contexts = 386786400), the same-shape
        nuisance population'. Two defects. (a) SHAPE MATCHING IS DEFINITIONAL,
        NOT DEMONSTRATED: the committed formula for
        p_rank_nuisance_total_map_contexts in v4-cost-worksheet.json is
        literally 'd0_intended_total_map_contexts'. The cardinality is COPIED
        from the intended arm by definition, so its equality is evidence of
        nothing about shape. (b) THE DESTROYING PARAMETER TESTS THE WRONG
        THING: CT-3's signal_destroying_parameter is 'the plant count k, as in
        CT-1; at k = 0 the nuisance and intended arms must be
        indistinguishable'. At k = 0 BOTH arms are unplanted populations, so
        indistinguishability is satisfied by construction. It measures a
        false-positive rate; it does not test whether the null is matched ON
        P-RANK, which is the only property CT-3 exists to control.
      why_it_matters: >-
        This campaign family has repeatedly found controls blind to what they
        were built to catch. The question is not 'does a control exist' but
        'could it ever have failed'. CT-3 as written could not.
      cheapest_discriminating_control: >-
        Hold k FIXED and non-zero, and randomize the p-rank across the nuisance
        population while holding every other structure fixed. Require the
        measured p-rank effect to vanish as p-rank is randomized. That is the
        null object of the same shape with the p-rank structure REMOVED, which
        is what CT-3 needs and does not have. It costs the same measurement
        CT-3 already requires.

    - id: RT-O7
      severity: material
      class: controls
      locus: 'planning-gate.yaml controls CT-4.signal_destroying_parameter'
      title: CT-4 binds host load as the destroying parameter for three quantities, but load only bites on one of them -- so applied literally it rejects correct measurements.
      finding: >-
        CT-4's measured_quantity is 'any per-stage CPU, wall, or peak-memory
        RATE'. Its signal_destroying_parameter is HOST LOAD, with the rule 'a
        rate that does not move with load is measuring the clock, not the
        work'. That rule is correct for WALL rate. It is wrong for the other
        two: CPU-seconds is substantially load-invariant by construction --
        that is precisely why one measures CPU time rather than wall time --
        and peak resident set size is essentially load-invariant. A reviewer
        applying CT-4 as written to a correct CPU-seconds measurement would
        observe 'the rate did not move with load' and, per CT-4's own sentence,
        reject it.
      classification: >-
        This is a FALSE-POSITIVE control -- a control that fires when it should
        not -- which is the mirror of RT-O6's control that cannot fire. Both
        are failures of the same discipline.
      cheapest_fix: >-
        Scope the parameters: bind load-dependence to the WALL rate only, and
        bind CT-4's already-present second_destroying_parameter (cardinality
        doubling must approximately double CPU-seconds) to all three. The
        second parameter is correctly specified and already does the work for
        CPU and memory.

    - id: RT-O8
      severity: material
      class: authorization_surface
      locus: 'planning-gate.yaml fresh_authorization_boundary.evidence_such_a_decision_would_have_to_see_first, EV-PRE-1'
      title: EV-PRE-1 makes a host measurement a precondition for EVERY later decision, including decisions that need no host at all.
      finding: >-
        EV-PRE-1 requires 'A CURRENT free-disk observation on the declared
        execution host, replacing the inherited, unrefreshed v3 statfs (E8),
        recorded with host, filesystem, and timestamp.' It offers NO
        alternative. Its siblings do: EV-PRE-2 ends 'or an explicit statement
        that they remain underived', and EV-PRE-3 ends 'or an explicit written
        statement that it cannot'. The block's own heading scopes it to
        'evidence such a decision would have to see FIRST', where 'such a
        decision' is any later authorizing decision. But EV-PRE-3 itself names
        the two honest remaining routes as 'a separately authorized
        resource-cap change, or CLOSURE OF THIS LANE with its obstruction
        named'. NEITHER of those requires a current statfs.
      why_this_is_the_sharp_edge: >-
        The goal head's next_action is NONAUTOMATIC. A planning document cannot
        make a run automatic by authorizing it -- this one conspicuously does
        not, and this session found no sentence that does. But it CAN make a
        run unavoidable by writing the precondition list so that every forward
        path runs through it. As written, a Coordinator who wanted to close
        this lane tomorrow with its obstruction named would be told by this
        document that it must first see a host measurement. That is scheduling
        pressure toward PB-1 embedded in a boundary description. It is not an
        authorization, and this report does not call it one; it is the closest
        thing to one in the package, and it is fixable in one clause.
      cheapest_fix: >-
        Scope it: 'EV-PRE-1 applies only to a decision that would authorize
        MATERIALIZATION on a host. A closure decision or a cap-change decision
        requires no host observation.'

    - id: RT-O9
      severity: minor
      class: stopping_rules_and_framing
      locus: 'planning-gate.yaml stopping_rules SR-1; budgets PB-1.purpose'
      title: SR-1 presumes the run it gates and cannot fire today, while the only committed observation already violates its threshold by 14.83x.
      finding: >-
        SR-1's observation is 'refreshed free-disk preflight on the declared
        execution host'. No refreshed preflight exists, so SR-1 has no binding
        force on the present state and its evaluation requires PB-1 to have
        run. Meanwhile the ONLY committed observation -- 1809797120 bytes free
        against a required 26843545600 -- already fails SR-1's threshold by
        exactly 1310720/88369 = 14.832351x, a figure this session recomputed.
        PB-1's purpose field describes the work neutrally as 'replace the
        inherited stale free-disk observation (E8) with a current one', which
        reads as routine hygiene. It is not: it is a re-test of a check that
        currently fails by more than an order of magnitude, and unless the
        execution host differs materially from the one in the v3 snapshot the
        expected outcome of PB-1 is another failure.
      relation_to_premature_closure: >-
        Stated as an accuracy point, NOT as an argument to skip PB-1. A cheap
        measurement that is expected to fail is still worth taking, and this
        report does not recommend against it. What is objectionable is
        budgeting it in language that hides the prior.
      cheapest_fix: >-
        One clause in PB-1.purpose: 'the committed observation fails this gate
        by ~14.8x; a refresh is expected to fail also unless the declared
        execution host differs from the v3 host.'

    - id: RT-O10
      severity: minor
      class: under_claim
      locus: 'preservation-manifest.yaml obligation 8, field node_count_recomputation'
      title: The manifest declares its own central number unverifiable without a validator run. That is false, and this session verified it with zero runs.
      finding: >-
        Obligation 8 records 'node_count_recomputation: not performed;
        recomputing a 441350-node census requires running the committed public
        validator, which this zero-run task does not do.' The premise is
        incorrect. The census requires only parsing the committed
        v5-derivation-fixtures.json and traversing it with exact type() tests
        -- a static read of committed bytes, no validator execution, no run.
        This session performed it and obtained dict 40313, list 20036, string
        180689, integer 100276, boolean 31, null 100005, total 441350: exact
        agreement in all six categories. The manifest hash 20ab60e1 was
        likewise reproduced by reimplementing the algorithm from the READ
        source, without executing the pinned module.
      why_it_matters: >-
        Premature closure and overclaiming are symmetric failures. Here the
        package UNDER-claims its own verifiability, and the effect was to leave
        obligation 8's central number carried as unverified when it was cheaply
        checkable. Recorded so the correction is durable, not as a criticism of
        a session that genuinely had no shell.
      status_after_this_report: obligation 8's node count and manifest hash are now independently verified.

    - id: RT-O11
      severity: material
      class: archive_custody_infrastructure
      locus: 'snapshot-receipt.json path_sha256 (4 keys), commit_sha, parent_sha, post_commit_verification.required_of_the_dispatching_session'
      title: The archive receipt's content binding is empty in the durable record, and its own durability rule therefore reports the package as not-yet-durable.
      finding: >-
        The receipt declares nine post-commit verification requirements 'of the
        dispatching session', among them 'path_sha256 filled for all four keys'
        and 'actual first parent recorded, not assumed'. At origin/main HEAD,
        path_sha256 is null for 4 of 4 keys and commit_sha and parent_sha are
        both null. 'git log --all' shows EXACTLY ONE commit ever touched the
        receipt (7ee825ff itself), so no later commit filled them and none can
        without superseding. CLAUDE.md states that archive receipts bind to
        CONTENT first and that research_dispatch.py verifies path_sha256; with
        all four null there is no content binding to verify. The receipt's own
        durability_rule reads 'Until the post-commit verifier accepts the
        commit, nothing bound here is durable evidence.' It also renders
        assignment item 5 given to this task -- 'Verify the four path hashes of
        this archive once the dispatching session has filled them' --
        unsatisfiable as written.
      classification: >-
        INFRASTRUCTURE SIGNAL ABOUT CUSTODY. This is NOT negative evidence
        about the planning gate and NOT a mathematical finding. The producer's
        and archiver's decision to leave them null rather than fabricate them
        was CORRECT and is explicitly the right call under AGENTS rule 5; the
        defect is that the filling step never happened afterwards.
      mitigation_already_in_hand: >-
        This session independently computed all four artifact hashes and
        confirmed snapshot == HEAD == working tree for every one of them, so
        the content is in fact verified -- just not BY THE RECEIPT. The four
        values are recorded in this report's recomputation_performed block and
        in the runtime session receipt, and can be transcribed into a
        superseding receipt.
      cheapest_fix: >-
        The ledger-archive task TASK-20260815-48d541 writes a superseding
        receipt carrying the three producer-artifact hashes plus commit_sha
        7ee825ff and parent_sha bf2ce5d1, with the receipt's own entry left
        null under the existing self_hash_rule.

    - id: RT-O12
      severity: minor
      class: omitted_cost
      locus: 'planning-gate.yaml estimates (whole section)'
      title: Communication cost is charged nowhere and the single-host assumption that makes that benign is never stated.
      finding: >-
        The estimate set charges time (E1, E2), memory (E3), retained bytes
        (E4, E5), shard count (E6), logical I/O (E7) and disk (E8). It charges
        NO communication or network cost. Under the single-host reading -- the
        document consistently says 'the declared execution host', singular --
        that is legitimate. But the single-host assumption is never written
        down as an assumption, and E6 requires at least 93969 shards; if a
        future design distributed those shards across hosts, communication
        would become a real and possibly dominant term with no cell to record
        it in.
      assessment: >-
        Reported as a narrow gap rather than a defect. This is the program's
        standing concern -- that cost claims omit exactly what dominates at
        scale -- and on this package memory and I/O ARE charged, which is the
        main thing. Recording the single-host assumption explicitly closes it.

  authorization_surface_assessment:
    instruction_followed: >-
      Attacked first and hardest, per the handoff and the dispatching
      instruction. Every field, sentence, default and omission in
      planning-gate.yaml was examined for language that authorizes, presumes,
      schedules, or makes automatic any of the fourteen forbidden items.
    explicit_authorization_found: none
    detail: >-
      authorizes_nothing carries a statement plus 27 explicit false/zero
      fields; the batch task record carries a parallel block; the snapshot
      receipt carries a 40-field authorization_effect block; and
      fresh_authorization_boundary opens 'THIS IS A DESCRIPTION OF A BOUNDARY,
      NOT A GRANT OF ONE. Reading this section confers nothing.' The
      boundary_self_check answers false to all four self-questions. The
      artifacts section marks every prospective path
      'prospective_if_and_only_if_separately_authorized', uses
      PENDING-ALLOCATION placeholder tokens rather than guessed identifiers,
      and states 'This session has no shell and minted nothing' -- which this
      session confirmed: identifiers_minted is 0 and no ID in the package
      collides. The budgets block opens 'THEY ARE NOT GRANTS.' No sentence
      was found that grants, schedules, or makes automatic implementation,
      Phase B, a control or experiment, target or curve access, JINV or
      transport work, N18, science, a status change, ECDLP, closure,
      breakthrough, publication, network write, or execution.
    residual_pressure_found: >-
      Two findings short of authorization, reported above and NOT inflated
      into authorization: RT-O8, where EV-PRE-1's unqualified wording makes a
      host measurement a precondition for every forward path including ones
      that need no host; and RT-O3, where fifteen precisely-stated uncited
      budget figures plus an exact path-and-record-type inventory leave a
      dispatch-ready package whose only missing element is an ID token. Each
      is a wording defect with a one-clause fix. Together they are the residue
      of authorization in a document that never grants it.
    verdict_on_the_nonautomatic_clause: >-
      The package HONOURS the goal head's NONAUTOMATIC requirement. It does not
      authorize, and this report does not claim otherwise. It should be
      REVISED so that it also does not PRESSURE.

  resource_incomplete_attack:
    routes_tested:
      compression_credit: not taken; recorded false in v6.yaml exact_cost_cross_binding and prohibited by SR-3
      deduplication_credit: not taken; same
      hash_only_substitution: not taken; same
      omitted_cell: not taken; the eight retained-byte components were summed by this session and reproduce the stated total exactly, so no cell is missing
      budget_widening: not taken; every frozen cap is restated at its committed value and this session compared all eleven against v6.yaml and the worksheet
    caps_restated_vs_committed: all eleven agree exactly
    gates_cleared_by_the_package: 0
    disposition_after_the_package: resource_incomplete, fail_closed
    finding: >-
      NO ROUTE WAS FOUND by which the package clears, relaxes, re-disposes,
      widens, or takes credit against the fail-closed disposition. The
      document's own load-bearing sentence -- 'Producing an estimate is not
      passing a check, and passing a check is not clearing the disposition' --
      is honoured throughout. RT-O1 and RT-O2 both cut in the conservative
      direction and cannot be used to take credit.

  scope_statement_attack:
    claim_tier_read: toy
    sota_delta_read: zero on time, memory, data, query, exponent, JINV, ECDLP, trapdoor, scientific-status, closure, and breakthrough axes
    one_N_ceiling_read: N = 19507 only; a second matched N does not exist
    dominated_by_field: >-
      CHECKED, NOT READ PAST. The field is 'not_applicable: this is a mandatory
      planning gate, not a competing time-memory-data-query attack mechanism.'
      That is a reasoned not_applicable with its reason stated, not a bare null,
      so it is not a fabrication under AGENTS rule 5. This session agrees a
      governance planning gate has no Pareto frontier to be dominated on: it
      claims no time, memory, data or query cost for any attack.
    outward_transfer_language_found: none
    finding: >-
      No place was found where a toy-scale, one-N N=19507 fact is written so a
      later reader could carry it to a second N, to cryptographic scale, to an
      exponent, to a speedup, or to an ECDLP claim. SR-9 forbids the transfer
      by name, completion_criteria_effect states that none of C1-C4 is met or
      advanced, and pause_conditions_effect states P1-P3 are not engaged. This
      section is CHECKED AND CLEAR.

  preservation_obligations_attack:
    scope_of_this_attack: >-
      The sibling validator checks that all eighteen bind to committed
      artifacts. This session asked the DIFFERENT question it was assigned: is
      any obligation unfalsifiable as written, or satisfiable by prose rather
      than by an artifact?
    obligations_bound_to_a_recomputable_artifact_value: 'obligations 1, 2, 3, 5, 6, 7, 8, 10, 11, 12, 16, 18'
    obligations_satisfiable_only_by_status_prose: 'obligations 13 (N18), 14 (C-TRANSPORT-CERT), 15 (second matched N), 17 (two-harness discrepancy)'
    finding_on_the_prose_obligations: >-
      These four bind to STATUS STRINGS -- 'unapproved_uncontracted_unimplemented_unexecuted',
      'authorized_or_executed: false', 'separately_required_unchanged',
      'preserved_uncured' -- rather than to a recomputable value. That is NOT a
      defect of the manifest: these obligations are about the ABSENCE of work,
      and an absence has no hash. They are falsifiable in the only way an
      absence can be: by exhibiting the work. This session checked and found no
      N18 implementation, no executed C-TRANSPORT-CERT, no second matched N,
      and both harness paths still omitted and uncured. Their falsification
      route is therefore real but asymmetric, and the manifest is right to bind
      them as it does.
    obligation_4_note: >-
      Obligation 4 ('both independent orders') binds to boolean flags in v6.yaml
      rather than to a recomputed cross-order byte identity. Recomputing it
      would require executing the pinned validator, which this task may not do.
      It is the one value-bearing obligation this session could not
      independently recompute; recorded as such, NOT as a defect.
    verbatim_fidelity: >-
      All eighteen obligation_verbatim strings were compared against the goal
      head next_action clause by clause. All eighteen appear, none is dropped,
      none is summarized away, none is softened. The ten
      minor_wording_or_attribution_notes the producer self-declared were
      spot-checked at obligations 3, 8, 16 and 17 and are accurately
      characterized; obligation 17's note correctly reports that the contract's
      rendering is WEAKER than the committed source and flags it rather than
      harmonising it.
    open_binding_defect_OBD_1_assessment: >-
      CONFIRMED AND STRENGTHENED BY RECOMPUTATION. This session established by
      direct computation what the producer could only read: 7415d195 is the
      hash of the 45-entry list literally named 'type_alias_suite'
      (suite_name: type_alias_suite, exact_count: 45), while 595ccde1 is the
      hash of the 45-entry 'type_alias_universe.positions' list. The frozen
      contract's reading of 'the 45-case alias suite and both manifests' binds
      595ccde1 and the legacy e96a9359, leaving unbound the manifest of the
      object the clause literally names. That makes OBD-1 MATERIAL rather than
      cosmetic. THIS REPORT DOES NOT RESOLVE IT: choosing a reading requires a
      separately authorized superseding decision that does not exist in this
      batch, and the producer was right to bind all three and decline. The new
      information is that reading B now has computational support, which a
      later decision should weigh.

  required_controls:
    - id: RC-1
      target: RT-O1 and RT-O2 (the dependency collapse and the unsharded I/O model)
      control: >-
        THE CHEAPEST CONTROL IN THIS REPORT, AND THE ONE RECOMMENDED. A
        zero-run, static perturbation of the committed formula chain: reduce
        all_replacement_pairs_upper alone by a factor f and recompute E4, E5,
        E6 and E7 from the committed formulas. If all four move together, the
        package's 'four independent gates' framing is confirmed wrong and a
        PB-3 author gains the single controlling lever. If they do not move
        together, RT-O1 is refuted and should be struck from this report.
      cost: minutes, no host access, no run identifier, no experiment
      would_it_materially_narrow_the_package: >-
        Yes. It converts 'four gates overshoot by 1e2 to 1e5' into 'one
        quantity overshoots by 1.2e4 and controls all four', which is the
        difference between four design problems and one.
    - id: RC-2
      target: RT-O6 (CT-3's null object)
      control: >-
        Hold the plant count k fixed and non-zero and randomize the p-rank
        across the nuisance population, holding all other structure fixed;
        require the measured p-rank effect to vanish. This is the matched null
        with the p-rank structure REMOVED, which is what a null object means.
      note: NAMED, NOT AUTHORIZED. This control is not approved by this report and must not be run on its authority.
    - id: RC-3
      target: RT-O7 (CT-4's mis-scoped destroying parameter)
      control: >-
        Split CT-4: bind load-dependence to the WALL rate only, and bind the
        cardinality-doubling check to CPU-seconds and peak memory as well. No
        new measurement is required; this is a rewrite of the control's scope.
    - id: RC-4
      target: the whole package's factual layer
      control: >-
        ALREADY DISCHARGED BY THIS SESSION. Every recomputable value was
        recomputed: 6 file hashes, 3 file sizes, 3 suite manifest hashes, 1
        recursive type manifest hash, a 441350-node census in 6 categories, 26
        committed formulas, 5 ARITH checks, 5 exceedance factors, an 8-component
        byte sum, 2 budget totals, 7 commits, and both material findings. Zero
        mismatches.

  counterexample_or_mutation: >-
    For RT-O5, the concrete counterexample is a PB-3 design that reduces
    retained bytes tenfold to 5.0e12 using none of the five prohibited credits.
    It remains ~1164x over the retained cap and needs ~9313 shards against a cap
    of 24, yet triggers none of SR-1 through SR-9. This single hypothetical is
    sufficient to show the stopping-rule set cannot refuse the plan's central
    deliverable, and it is cheaper to state than any argument about the rules'
    general adequacy.

  baseline_comparison:
    applicable_in_the_pollard_rho_bsgs_sense: false
    reason: >-
      The artifact under review is a governance planning gate. It proposes no
      attack, claims no time-memory-data-query cost, and asserts no speedup
      against any baseline. Comparing it with Pollard-rho, BSGS, or a
      specialized ECDLP baseline would be a category error, and the package
      correctly says so in its dominated_by field rather than inventing a
      comparison.
    baseline_actually_applied: >-
      The correct baseline for a mandated planning gate is the mandate. This
      session compared the package clause by clause against the goal head
      next_action (ledger/goals/GOAL-ENDO-001/goal.yaml), against
      DEC-20260813-d14d6b as the sole substantive authority, and against
      DEC-20260815-f7e2d4 as the batch-opening decision.
    result: >-
      The next_action names six required contents; all six are present under
      exactly those words. It names eighteen obligations; all eighteen are
      carried verbatim and bound. It requires the gate to BEGIN FROM
      resource_incomplete; the package begins and ends there with zero gates
      cleared. It forbids fourteen kinds of authorization; the package grants
      none of them. DEC-20260815-f7e2d4 is a batch-opening decision whose scope
      is 'batch_opening_approved_static_nonautomatic_planning_gate_only' with
      material_blockers_overruled 0, and the package does not exceed it. The
      package meets its mandate.

  heuristic_challenges:
    - id: HC-1
      heuristic: 'PB-2: a rate can be measured at REDUCED cardinality on the same code path and extrapolated LINEARLY in the stage cardinality.'
      explicit_and_numbered_in_the_package: >-
        Yes, and flagged by the package itself in three separate places as the
        weakest assumption in the plan. Credit where due: this is exactly the
        disclosure discipline the profile asks for.
      challenge: >-
        The disclosure is right and the justification is still missing. (a) The
        reduced cardinality is NEVER SPECIFIED -- no reduction factor appears
        anywhere -- so neither the 3600 s budget nor the 1 GiB disk figure can
        be checked against it, and the linearity claim has no stated domain.
        (b) The package identifies the correct failure mode (working set
        leaving cache or memory) but does not name the transition point, even
        though the committed cardinalities would let it bound one. (c) Most
        seriously, per RT-O4, the committed goal head records that this campaign
        ALREADY built a cost model as 'a linear extrapolation from one 128.234 s
        run' on a host that has run between load 18 and 116 -- and the package
        cites that field twice while omitting that clause. A numbered heuristic
        whose strongest committed counter-evidence is dropped from its own
        citation is not yet justified.
      cheapest_experiment_that_would_expose_the_deviation: >-
        The cardinality-doubling check already written into CT-4's
        second_destroying_parameter, run at three or more cardinalities rather
        than two, with the residual from linearity reported. If CPU-seconds is
        superlinear in cardinality anywhere in the tested range, the
        extrapolation is refuted and E1-E3 stay underived rather than being
        filled with a number -- which is what the package already says must
        happen. The control is correctly specified; it simply must be run
        before any rate is believed.
    - id: HC-2
      heuristic: 'PB-3: a design can be judged against the caps on paper, from exact cardinalities, without executing it.'
      package_position: >-
        The package correctly restricts this to the byte, shard and I/O gates
        and explicitly excludes CPU, wall and peak memory, which is why PB-2 is
        separate. That restriction is sound.
      challenge: >-
        Sound but incomplete, and RT-O2 is why. Paper judgement of the I/O gate
        rests on the committed 3x multiplier, which is an UNSHARDED model. Any
        design that must shard 93969 ways cannot be judged against E7 on paper
        without first replacing the 3x model with one that accounts for the
        merge. So the very gate PB-3 is supposed to settle on paper is the one
        whose paper model does not survive the design PB-3 must produce.
    - id: HC-3
      heuristic: 'PB-1: a statfs, a core count, and three load averages are read-only host observations that materialize nothing and consume no experiment run identifier.'
      package_position: >-
        Stated, and paired with an honest self-limiting clause: 'IF a later
        decision judges that this cannot be separated from instrument
        execution, then it must NOT be authorized under this shape.' That
        clause is good practice and this report endorses it.
      challenge: >-
        None on the substance -- a statfs is a read. The objection is RT-O9's:
        the framing omits that the check currently fails by 14.83x, so the
        heuristic is fine while the expectation set around it is not.
    - id: HC-EXEMPLAR-PROFILE
      exemplar_profile_applicability: >-
        docs/target-result-profile.md governs exponent-first, heuristic-conditional
        claims on central hard problems. This package makes NO exponent claim, NO
        asymptotic claim, and NO claim about a hard problem in either direction;
        its claim tier is toy and its sota_delta is zero on eleven named axes.
        The exemplar's heuristic-inventory, random-model-transfer, scale-honesty,
        hidden-overhead, cost-bookkeeping, reduction-instantiation and
        scope-inflation challenges were considered and are NOT APPLICABLE to a
        governance planning document. Applying them here would be the category
        error the package's own dominated_by field avoids. The three heuristics
        above are engineering assumptions, and they are challenged as such.

  cost_model_challenges:
    - see: RT-O1
      summary: E7 = 3 x E4 exactly; E5 = 99.57 percent of E4; E6 = ceil(E4/cap). Four 'independent' failures are one quantity.
    - see: RT-O2
      summary: The 3x I/O model is unsharded while >=93969 shards are mandatory, so E7 is not an upper bound for any admissible design.
    - see: RT-O3
      summary: Fifteen PB budget figures are neither cited nor marked underived, against the document's own universal provenance rule.
    - see: RT-O4
      summary: The one citation in the budgets block drops the committed threshold and the committed counter-evidence to PB-2.
    - see: RT-O12
      summary: Communication cost uncharged; the single-host assumption that makes that benign is unstated.
    - id: CMC-OPTIMISM-INVENTORY
      optimistic_assumptions_flagged_as_optimistic:
        - 'PB-2 linear extrapolation in cardinality -- flagged by the package AND by HC-1; OPTIMISTIC.'
        - 'Any future wall-clock estimate dividing a serial total by an assumed parallelism -- the package flags this itself in E2.optimism_warning; OPTIMISTIC, and correctly noted as unavailable under a 24-shard cap against a 93969 requirement.'
        - 'E7 as an UPPER bound -- OPTIMISTIC in the sharded regime, per RT-O2. This is the one direction-of-uncertainty error found.'
        - 'PB-1 at 600 s, PB-2 at 3600 s on a host recorded as running between load 18 and 116 on 14 cores -- OPTIMISTIC and uncited, per RT-O3 and RT-O4.'
        - 'E5 as one-sided (could be lower under a different design) -- correctly stated by the package; NOT optimistic.'
        - 'E6 as one-sided upward and irreducible by argument -- correctly stated; NOT optimistic.'
    - id: CMC-MEMORY-AND-IO-COVERAGE
      memory_and_io_charged_not_only_time: >-
        CHECKED AND LARGELY CLEAR. The program's standing concern is that cost
        claims omit what dominates at scale. This package charges peak memory
        (E3, against an 8 GB cap and a 6871947673-byte 80-percent check), retained
        bytes (E4), largest single artifact (E5), shard count (E6), logical I/O
        (E7) and free disk (E8) -- not merely time. Memory is charged but
        UNDERIVED, and the package says so and refuses to substitute the passing
        temporary_working_bytes figure for it, which is the correct call and is
        called out explicitly in E3.do_not_confuse. The gaps found are RT-O2
        (I/O model conditionality) and RT-O12 (communication), not an
        across-the-board omission.

  reduction_and_scope_challenges:
    - id: RS-1
      finding: >-
        NO CORROLLARY-VIA-CITED-REDUCTION appears in this package. It asserts no
        theorem, invokes no published reduction, and instantiates no cited
        result, so the reduction-instantiation challenge has no target here.
        Recorded as checked, not as absent by oversight.
    - id: RS-2
      finding: >-
        NO SCHEME SCOPE IS CLAIMED, affected or safe. There is no
        affected-vs-safe list to inflate. Checked and clear.
    - id: RS-3
      finding: >-
        The package's own scope statement is narrower than its content in one
        respect worth recording in the under-claiming direction: it says
        'tested_scale: none; this document measures nothing', which is true of
        measurement but understates that the document performs a substantial
        amount of exact integer verification against committed artifacts. That
        verification is not a measurement and the package is right not to call
        it one; noted only so a later reader does not conclude the document did
        nothing checkable. It did, and all of it checks out.

  proof_architecture_challenges:
    applicability: >-
      docs/inventor-protocol.md section 8 binds proof-oriented proposals
      carrying a proof_search_map. This package is not a proof-oriented
      proposal, states no theorem, and carries no proof_search_map, so the six
      proof-architecture attacks have no target. Considered and recorded as
      not applicable rather than silently skipped.
    one_attack_that_did_transfer:
      name: method-ceiling attack
      application: >-
        Derived the largest claim the package's resource measure can support
        under ideal tuning. Under the frozen caps, the ceiling is reached by
        the single quantity all_replacement_pairs_upper: even granting perfect
        implementation, zero overhead, and full parallelism, the retained-byte
        gate alone requires roughly a 1.2e4-fold reduction in that one term
        before ANY of E4-E7 can pass. That ceiling does not reach the headline
        -- the headline being 'Phase B is executable under the frozen caps' --
        so Phase B fails against the caps before implementation, on the
        committed numbers alone.
      consequence_for_the_verdict: >-
        This SUPPORTS the package's fail-closed conclusion and is the strongest
        independent reason to believe resource_incomplete is correctly held. It
        is offered as corroboration of the disposition, NOT as a closure of the
        lane, which this report has no authority to recommend and does not.

  premature_closure_check:
    does_the_package_foreclose_a_lane_without_a_measured_obstruction: false
    assessment: >-
      Checked in both directions, per the obligation that premature closure is
      symmetric with overclaiming. The package explicitly declines to close:
      EV-PRE-3 names the two honest remaining routes -- a separately authorized
      resource-cap change, or closure with its obstruction named -- and states
      'THIS GATE CHOOSES NEITHER ROUTE AND RECOMMENDS NEITHER.' That is the
      correct posture for a planning gate, and it is NOT a fatigue report: the
      obstruction here is MEASURED, in the strong sense that it is an exact
      integer accounting from committed cardinalities which this session
      rederived formula by formula. A count of screened-and-rejected mechanisms
      would not satisfy the C1 closure standard; a 1.2e4-fold cap overshoot
      computed from exact cardinalities is a named obstruction with an argument.
    under_claiming_found: >-
      Yes, twice, and both are recorded as objections rather than praise:
      RT-O10 (the package declares its own central number unverifiable when it
      is cheaply verifiable) and RT-O1 (the package establishes, but never
      states, that one quantity controls all four failed gates -- which is the
      forward guidance a future PB-3 author most needs).

