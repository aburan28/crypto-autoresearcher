    executes zero runs, and grants no authorization. EVERY VALUE IN IT THAT CAN
    BE INDEPENDENTLY RECOMPUTED WAS RECOMPUTED BY THIS SESSION AND EVERY ONE
    REPRODUCES EXACTLY -- six file hashes, three sizes, three suite manifest
    hashes, the recursive type manifest hash, a 441350-node census in all six
