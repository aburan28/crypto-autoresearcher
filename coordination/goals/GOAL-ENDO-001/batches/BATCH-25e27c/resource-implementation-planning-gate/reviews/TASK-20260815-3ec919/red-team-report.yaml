      'coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate/tasks/TASK-20260815-f04b54/preservation-manifest.yaml': 'eca86493591400cd219cedcb907129dcf176d730444299423564171e585d6cb5'
