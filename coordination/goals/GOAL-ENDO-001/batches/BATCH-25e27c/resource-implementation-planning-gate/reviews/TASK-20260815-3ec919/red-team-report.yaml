  verdict: REVISE
  verdict_scope: >-
    Scoped strictly to the exact bytes of the four paths committed in snapshot
    7ee825ff9849542d681e02781fcaaa21a36ca5fb (first parent
    bf2ce5d19c42e41352a37b1c8473e71939284c33). This verdict is about a static
    planning document and nothing else. It is not experiment evidence, not JINV
    evidence, not transport evidence, not ECDLP evidence, not a status change,
    not a closure, not a breakthrough, not an authorization, and not a
    scientific statement in either direction at any scale.
  verdict_statement: >-
    REVISE. The package's headline dispositions survive attack and I could not
    break them: gates_cleared is 0, resource_incomplete remains fail-closed,
    all eighteen preservation obligations are carried verbatim and none is
    dropped, reworded, split, merged, or generalized, zero experiment runs
    occurred, and no operative authorization field is true. Every file hash,
    every derived manifest hash, every arithmetic check and every exceedance
    factor I independently recomputed AGREES with the frozen contract and the
    package. There is no hash mismatch to report.
    The package nevertheless carries twenty individually named objections, of
    which eleven are material. The most consequential are: MF-2 is a
    literal-string search artifact rather than a provenance defect and has
    already propagated into four records and a commit message (O-1); estimate
    E1's load-bearing reason (d) is contradicted by a committed run record
    inside the producer's own read scope (O-2); four of the five failed gates
    are one number expressed four ways and are presented as independent
    corroboration (O-3); E7's stated method is not the method the committed
    source uses (O-4); EV-PRE-3 asserts that only two routes remain, which is a
    closure-shaped exhaustiveness claim contradicted elsewhere in the same
    document (O-6); the exact cardinalities the whole cost model rests on are
    governed by two parameters that the package's own EV-PRE-6 records as
    un-instantiated and blocked by N17 (O-7); one authorization-boundary bullet
    instructs a later decision what to conclude rather than what to decide
    (O-10); and PB-2 defines a class of execution of the experiment's own stage
    code that is declared outside the run-record regime (O-11).
  failing_to_break_is_not_evidence: >-
    FAILING TO BREAK THIS PLAN WOULD NOT BE EVIDENCE THAT THE PLAN IS CORRECT,
    and the items I could not break are recorded below as things I could not
    break, not as things that are true. This report creates no experiment
    authority, no JINV authority, no transport authority, no ECDLP authority,
    no status change, no closure, no breakthrough, no publication, no network
    write, and no execution authority. A REVISE from me is an instruction to
    the Coordinator to adjudicate, not a permission for anyone to act.

