  cost_model_checks:
  - id: CM-1
    check: cost_unit_honesty
    result: PASS
    detail: >-
      Every one of the eight cost items declares its unit: E1 CPU-seconds
      (explicitly made comparable against cpu_preflight_80_percent_seconds
      138240 and total_cpu_seconds 172800), E2 seconds per run and per shard, E3
      bytes, E4/E5/E7/E8 bytes, E6 a count of shards. No table entry is
      unitless. The frozen caps are restated with their units and I confirmed
      all eleven against the committed source unchanged.
  - id: CM-2
    check: memory_reported_alongside_time
    result: PASS
    detail: >-
      Memory is not an afterthought here - it is the binding constraint and is
      treated as one. E3 is a dedicated peak-memory item; the caps table carries
      maximum_memory_gb 8 and the derived 80-percent cap 6871947673 which I
      recomputed; E4, E5 and E7 are byte-denominated gates that fail by 1e2 to
      1e5. The time items (E1, E2) are the ones that cannot be produced at all.
      The package is explicit that the byte and shard gates are what fail-closed
      is closed on.
  - id: CM-3
    check: optimistic_assumptions_flagged
    result: PASS
    detail: >-
      Two are flagged, both in the same field as the number they affect. E2's
      optimism_warning states that any wall-clock estimate dividing a serial
      total by an assumed parallelism is OPTIMISTIC BY CONSTRUCTION and must
      declare that assumption alongside the number, and notes the division is
      unavailable at 93969 shards against a cap of 24. PB-2's linear-cardinality
      extrapolation is flagged as THE WEAKEST LINK IN THE WHOLE PLAN, in its own
      field, in CT-4, and again in limitations - three times. The reason given
      is technically correct: linearity fails when a working set stops fitting
      in memory or cache, which is exactly the regime the retained-byte and
      logical-I/O overshoots describe.
  - id: CM-4
    check: time_memory_tradeoff_noted_where_memory_binds
    result: PASS
    detail: >-
      E5 records that its check is explicitly WITHOUT SHARDING and that a
      sharding design would change the individual-artifact question, would
      itself be a protocol design change requiring separate authorization,
      contract and review, and does not exist in any committed artifact. That is
      the tradeoff stated honestly rather than assumed away. E6 correctly
      records the shard count as a one-sided MINIMUM that cannot be reduced by
      argument.
  - id: CM-5
    check: per_attempt_cost_times_inverse_success_probability
    applicable: false
    reason: >-
      Recorded as not-applicable with the reason rather than omitted. E4-E7 are
      exact-cardinality UPPER BOUNDS on a deterministic workload, not expected
      costs under a heuristic; there is no success probability in this cost
      model, and no total is computed as if success were certain because no
      probabilistic total is computed at all. If a later design introduces a
      randomized or heuristic step, this check becomes live.
  - id: CM-6
    check: estimate_method_reproduces_its_number
    result: PASS
    detail: >-
      This is the fabrication check under AGENTS.md core rule 9, and it is the
      one I weighted most heavily. Every stated method reproduces its stated
      number: ARITH-1 through ARITH-5 all reproduce exactly; all five exceedance
      factors reproduce to the precision claimed; and every hand-computed
      intermediate remainder reproduces EXACTLY - 449985792, 460513280,
      164558714624, 1506385920, and the 24*3915 = 93960 bracket. That is
      fourteen-digit integer arithmetic performed without a calculator and it is
      right. I found no number in the document that its own method fails to
      produce, and no number that was invented, interpolated, or back-filled.
  - id: CM-7
    check: missing_data_stays_missing
    result: PASS
    detail: >-
      E1, E2, E3 and the current-host half of E8 are declared UNQUANTIFIED AND
      UNBOUNDED IN BOTH DIRECTIONS, with the explicit warning that this 'is not
      a wide interval and must not be reported as one'. forbidden_substitutes
      rules out inventing, interpolating, guessing, carrying over from another
      experiment, and back-filling from a desired conclusion. No estimate was
      substituted for a missing measurement anywhere. This satisfies the
      Validator prohibition against substituting an estimate for a missing
      measurement, applied by the producer to itself.

  proof_architecture_checks:
  - id: PA-1
    check: proof_search_map_required
    applicable: false
    reason: >-
      This is not a proof-oriented proposal. It states no theorem, no asymptotic
      bound, no certificate family, no reduction and no closure argument. The
      approved v6 amendment does carry a proof_search_map block, which is
      unchanged by this batch. Recorded as not-applicable rather than omitted.
  - id: PA-2
    check: inventor_protocol_section_6_ladder_for_an_unexecutable_improvement
    applicable: false
    reason: >-
      No improvement is claimed at any scale. claim_tier is toy, sota_delta is
      zero on every declared axis, dominated_by is recorded as not_applicable
      with a stated reason, and the package asserts explicitly that nothing in
      it is an attack, an exponent, a speedup, or evidence for or against any
      hypothesis. There is therefore no speedup claim whose step-2 scaled-down
      measurement could be missing. Recorded with the reason rather than
      omitted, because the absence of a claim is the thing that makes the ladder
      inapplicable and a later reader should be able to check that.
  - id: PA-3
    check: pareto_honesty
    result: PASS
    detail: >-
      dominated_by is 'not_applicable: this is a mandatory planning gate, not a
      competing time-memory-data-query attack mechanism' - a stated reason
      rather than an unchecked null, which is what the protocol requires.
      sota_delta is quantitative and zero on eleven named axes. Consistent with
      v6.yaml pareto_assessment and DEC-20260813-d14d6b, which I read.
  - id: PA-4
    check: premature_closure_avoided
    result: PASS
    detail: >-
      Under docs/inventor-protocol.md, declining to pursue a lane because it
      looks saturated is a failure mode symmetric with overclaiming. A resource
      overshoot of 1e2 to 1e5 is exactly the situation where a document might
      quietly recommend closure. This one does not: EV-PRE-3 names the two
      honest routes if no design fits and then states 'THIS GATE CHOOSES NEITHER
      ROUTE AND RECOMMENDS NEITHER'. It also names N17 and the undischarged C4/P1
      instrument control - blockers nothing in this batch obliged it to raise.
      I found no steering, no suppression, and no mischaracterization of the
      lead, and I looked for it specifically.

  limitations:
  - >-
    OBLIGATION 4 IS THE ONE I COULD NOT REDERIVE. 'Both independent orders' -
    the claim that separately initialized ascending and descending derivations
    agree on exact selected, p and aggregate byte identity - is present in
    v6.yaml as a set of declared fields, and the committed public validator's
    self-test output reports no order-identity result. I read it; I did not
    reproduce it. Stated as a limitation, not as a failure.
  - >-
    The density half of obligation 2 ('row 8 at 1/6') was READ from v6.yaml
    preserved_positive_derivation.selected_density, not rederived - the verifier
    emits selected_factor_base_size 8 but no density. The row-8 half and the
    row's hash were rederived.
  - >-
    My hash recomputations bind the CURRENT committed tree and the approval
    snapshot d3d336b7. They cannot prove that no other worktree or unmerged
    branch holds a divergent copy of these artifacts; I checked reachability
    from this HEAD only, and I did not fetch origin/main (no network write, and
    fetching is the dispatching session's responsibility, not a reviewer's).
  - >-
    The nine stage cardinalities were verified against the committed v4 cost
    worksheet, which is the same single source the producer used. Neither of us
    independently rederived a cardinality from the underlying contract. The
    producer disclosed this limitation itself and I am repeating rather than
    resolving it.
  - >-
    I ran the committed public validator's --self-test, --list-mutations and
    --list-type-aliases. I did NOT audit the validator's internal logic line by
    line, so my rederivation inherits that program's correctness. Its bytes are
    hash-verified against the approved package and it was independently
    red-teamed under TASK-20260813-1851d0, but a verifier that is wrong in the
    same way as the artifact it checks would not be caught by this review.
  - >-
    This review and the reviewed package resolve to THE SAME MODEL ON THE SAME
    BACKEND (anthropic:claude-opus-5), verified by me through
    'python3 -m orchestration.adapter resolve'. Independence here is session,
    context and from-scratch reading plus a shell the producer did not have. It
    is not independent judgement from a different model family and must not be
    presented as such. Correlated blind spots between this review and the
    package are possible and unmeasured.
  - >-
    E8's committed observation is a statfs from a host neither the producer nor
    I can identify from the committed record. I did not take a current statfs -
    that is PB-1, which is not authorized. The current free space on any host
    remains unknown, exactly as the package says.
  - >-
    Nothing in this review is an experiment, a measurement of any JINV, isogeny,
    curve or ECDLP quantity, or evidence in either direction about any
    hypothesis. It is an integrity check on records.

