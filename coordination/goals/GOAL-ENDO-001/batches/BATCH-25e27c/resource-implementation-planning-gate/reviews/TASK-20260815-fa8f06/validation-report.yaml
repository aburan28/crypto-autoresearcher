        require inventing a probability, which is the failure this document
        avoids everywhere else. Correctly absent.
    do_not_confuse_traps_named_by_the_package: >-
      One, and it is the trap this reviewer would otherwise have had to raise:
      temporary_working_bytes is the single PASSING check in the whole resource
      block, and the package forbids citing it as a peak-memory estimate by
      name. Confirmed a different quantity against a different cap.

  # ------------------------------------ tests of anchors and self-attestations
  anchor_and_self_attestation_tests:
    why_this_section_exists: >-
      This program has repeatedly been bitten by pre-registration anchors that
      turn out to be unverifiable self-attestations, and by verified_by fields
      asserting a reading nobody performed. Every anchor in this package was
      identified and tested rather than accepted.
    anchor_1:
      anchor: 'stopping_rules.declared_in_advance / declared_before_any_measurement_exists'
      testable: true
      test: 'does any measurement these rules govern already exist?'
      result: ESTABLISHES_WHAT_IT_CLAIMS
      basis: 'zero runs in the batch, zero successor work units in the tree, bytes fixed in a commit authored 2026-08-15T17:20:39Z, exactly one commit has ever touched the file'
    anchor_2:
      anchor: "preservation-manifest cross_read_agreement: agrees, on every obligation"
      risk: 'this is the field most likely to be a verified_by asserting a reading nobody performed'
      scope_correctly_declared_by_the_producer: >-
        Yes, and unusually carefully: "Every 'agrees' below therefore means AN
        INDEPENDENT READ OF THE COMMITTED RECORD NAMED FOUND THE SAME VALUE,
        and never means a hash was recomputed or a size was measured."
      test: 're-perform the cited reads for all eighteen obligations'
      result: EVERY_POSITIVE_READ_CLAIM_REPRODUCES
      detail: >-
        All eighteen "agrees" claims were re-read against the files and fields
        cited, and every cited field was present with the cited value. Not one
        positive read-claim failed.
      the_pattern_that_did_fail: >-
        THE FAILURES ARE ALL NEGATIVE CLAIMS, NOT POSITIVE ONES. The producer's
        two assertions that something is ABSENT from a committed artifact
        (OBJ-1: the literal 441350 in the v6 queue; OBJ-2: equality_included as
        a literal field name) are the only two statements in the package that
        do not survive re-verification, and both failed for the same reason -
        a search narrower than the conclusion drawn from it. THIS IS A USEFUL
        AND TRANSFERABLE FINDING: this producer's positive bindings are
        trustworthy and its absence claims are not, and an absence claim needs
        the search that produced it recorded alongside it.
    anchor_3:
      anchor: 'snapshot-receipt existence_check_performed_by_this_session ("All three producer artifacts were opened and read end to end by this session")'
      testable_by_a_third_party: false
      result: UNVERIFIABLE_SELF_ATTESTATION
      is_it_material: false
      why_not: >-
        Nothing contradicts it, and it is made immaterial by the content
        binding: the four path hashes filled by the dispatching session were
        recomputed here and all four match, so what the archive took custody of
        is established by arithmetic rather than by the claim.
    anchor_4:
      anchor: 'commit 23c66739a message: "Dispatcher post-commit verification accepts the archive: paths_verified 4, generated_paths_skipped empty, all ten gates passing."'
      testable: PARTIALLY
      committed_verifier_receipt_exists: false
      why_no_receipt_exists: 'paths_verified is emitted into the gitignored generated dispatch_plan.json; no committed artifact carries it, by design'
      what_was_verified_here_instead: >-
        The four checkable components: exactly four paths in the commit, all
        four declared, all four hashes recomputed and matching,
        generated_paths_skipped empty as declared in the receipt. All four
        hold.
      what_remains_unverified: >-
        The literal phrase "all ten gates passing" has no committed artifact
        behind it and this session did not enumerate ten gates. Recorded as a
        claim resting on a commit message, with its checkable substance
        independently confirmed.
    anchor_5:
      anchor: 'preservation-manifest source_of_obligations, claiming the identical sentence is DEC-20260813-d14d6b next_actions[0].action'
      testable: true
      result: VERIFIED
      detail: 'identical to the goal head after whitespace normalization; both 1222 characters; the DEC has exactly one next_action'
    anchor_6:
      anchor: 'snapshot-receipt hash_provenance.actions_taken_by_this_authoring_session (six counters, all zero)'
      testable_by_a_third_party: false
      result: UNVERIFIABLE_SELF_ATTESTATION_BUT_CORROBORATED
      corroboration: >-
        The receipt is internally consistent with the counters: commit_sha,
        parent_sha and all four path_sha256 values are null, no placeholder was
        invented, and the receipt's own entry is null rather than a fabricated
        self-hash. A session that had computed hashes would have had no reason
        to leave them null. The receipt also states plainly WHY they are null
        and who fills them, which is the honest form.

  # ----------------------------------------------- observations, not objections
  observations:
    - id: OBS-1
      about: 'snapshot-receipt.json path_sha256 values are all null in the committed file'
      finding: >-
        Correct and unavoidable: an immutable committed record cannot be
        back-filled, and a receipt cannot contain a hash of itself. The content
        binding lives in the queue's archive block, filled at commit
        23c66739aa192e52fcb2007bae647d106bc46bed, where all four values are
        present and all four were recomputed here and match.
      consequence_worth_recording: >-
        A reader holding ONLY the snapshot receipt cannot content-verify this
        archive; the binding lives in dispatch_queue.json, which this batch
        explicitly declares "control-plane coordination only ... not a task
        artifact, is owned by no task". The content binding for a task artifact
        therefore resides in a file the batch says is not a task artifact.
        Structural, follows repository convention, no action implied here.
    - id: OBS-2
      about: 'batch.yaml has drifted from reality'
      finding: >-
        batch.yaml still records scaffolding_status
        authored_not_dispatched_not_committed and state: queued for all five
        tasks, while the queue records TASK-20260815-f04b54 and
        TASK-20260815-39fd27 as completed.
      why_it_is_not_a_finding_against_the_package: >-
        batch.yaml was committed at 74602c15 as the batch-opening record, is in
        no task's write scope in this batch, and the producer package does not
        depend on it. The queue is the live control plane. Noted for the
        Coordinator only.
    - id: OBS-3
      about: 'the dispatch-given commit the producer recorded but could not verify'
      finding: >-
        runtime-session-receipt.json records
        committed_batch_commit_given_in_dispatch
        74602c154415546ff5bae8cc225419f5af412f16 with
        committed_batch_commit_verified_by_this_session false. VERIFIED HERE:
        it exists, it is the batch-opening commit "coord: open GOAL-ENDO-001
        BATCH-25e27c", it is an ancestor of origin/main, and it is an ancestor
        of the snapshot 7ee825ff. The snapshot receipt was right to refuse to
        promote it into a commit_sha or parent_sha; it is neither.
    - id: OBS-4
      about: 'the producer understated its own evidence in three places'
      finding: >-
        A consistent conservative bias, worth recording because it is the
        opposite of the usual failure. (a) OBD-1: the third manifest occurs in
        nine committed places, not the three claimed - including the
        controlling decision DEC-20260813-d14d6b AND the neutral evidence
        record EV-JINV-55ff88, which makes the defect STRONGER than reported.
        (b) MF-2: the value occurs in at least nine places, not the five
        claimed. (c) OBJ-2: an exact field match was downgraded to "a
        paraphrase".
    - id: OBS-5
      about: 'sota_delta renderings differ between committed sources'
      finding: >-
        DEC-20260813-d14d6b lists JINV among the zero-delta axes; v6.yaml's
        pareto_assessment does not; batch.yaml renders it as the integer 0;
        EV-JINV-55ff88 has no sota_delta field at all. The planning gate uses
        the decision's fuller form including JINV. The choice is correct.
        Recorded so no later reader mistakes the divergence for a defect.
    - id: OBS-6
      about: 'the queue is not in the commit, and the queue archive block is'
      finding: >-
        The batch's own constraint that the queue path "must not appear in
        either the snapshot or the ledger commit scope" is satisfied: the queue
        is absent from 7ee825ff. It was separately amended at 23c66739a to
        carry the archive block. Both are correct and consistent, and the queue
        bytes at HEAD, at 23c66739a and at origin/main are byte-identical
        (sha256 b4975b5ad7d80c57f53e9413b4034209814335626c5317bde2f78bcdc80dfbb3).

  # ---------------------------------------------------------- limitations
  limitations_of_this_validation:
    - 'This report binds ONLY the bytes of commit 7ee825ff9849542d681e02781fcaaa21a36ca5fb. It says nothing about any later state of any file.'
    - >-
      Independence here is session, context and from-scratch reading only. This
      review resolves to the same backend and model family as the producer and
      as the concurrent red team. A blind spot common to that family would
      survive all three. The mitigation used was mechanical: values were
      recomputed with tools, and every finding is anchored to a rerunnable
      command.
    - >-
      The cost chain was traced three levels down and terminates in nine
      per-item serialization byte constants and the frozen_dimensions block of
      v4-cost-worksheet.json. THOSE TERMINAL CONSTANTS WERE NOT INDEPENDENTLY
      DERIVED HERE from the underlying v3 contract or from any measurement.
      They are asserted in a committed, previously reviewed and approved
      artifact. Anyone relying on E4-E7 relies on that approval, not on this
      report.
    - >-
      The 441350-node recursive census, the 45/45 alias rejections, the 122/122
      legacy rejections and the 2/2 latent probe rejections were verified BY
      RUNNING THE COMMITTED VALIDATOR. Its correctness as a validator is
      inherited from the terminal v6 review (TASK-20260813-1851d0,
      DEC-20260813-d14d6b) and was not re-audited here beyond a full read of
      its side-effect surface. The six positive hashes and the three suite
      manifests were additionally recomputed WITHOUT the validator, so those
      specific values do not depend on trusting it.
    - >-
      tools/research_dispatch.py was deliberately NOT run, because it would
      write coordination/**/dispatch_plan.json, outside this task's write
      scope. Its `paths_verified` output was therefore not obtained; the four
      facts it would report were verified directly against the commit object
      instead.
    - 'No probe receipt for the model that actually answered this session was obtainable; AUTORESEARCH_POLICY and AUTORESEARCH_BACKEND are unset in this environment. The resolved model id in the runtime receipt is a genuine self-report, recorded as unprobed.'
    - 'The red team report was not read, by instruction. Nothing here reflects or anticipates it.'
    - 'Some producer statements are self-attestations about its own session that no third party can test (anchors 3 and 6 above). They are recorded as such rather than counted as verified.'

