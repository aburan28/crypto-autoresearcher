      total by an assumed parallelism is "OPTIMISTIC BY CONSTRUCTION" and the
      division is not even available under current caps, since a minimum of
      93969 shards faces a frozen maximum of 24. PB-2's linearity assumption is
      flagged as the plan's weakest link in three places and paired with CT-4.
    memory_reported_alongside_time: true
    memory_detail: 'E3 peak memory sits beside E1 CPU and E2 wall in the same block; every PB item carries memory_gb beside wall_clock_seconds; the envelope reports memory_gb_peak_any_single_item beside wall_clock_seconds and disk_bytes.'
