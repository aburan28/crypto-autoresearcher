  findings:
  - id: V-1
    severity: MATERIAL
    class: refuted_producer_finding
    title: 'MF-2 IS REFUTED. The frozen contract''s obligation-8 provenance attribution DOES reproduce; the producer''s search missed a thousands separator.'
    what_the_package_asserts: >-
      preservation-manifest.yaml obligation 8 material_finding MF-2, repeated in
      summary.material_findings (2), in material_findings[MF-2].one_line, in
      snapshot-receipt.json carried_forward_second_material_finding, and in the
      snapshot commit message: 'the contract attributes the literal 441350 to
      the committed BATCH-d7e255 dispatch_queue.json, where it does not occur
      ... THE VALUE AGREES; only the contract's statement of where it was read
      from does not reproduce.'
    what_i_recomputed:
      half_a_absence_of_the_bare_literal: 'CONFIRMED. grep -c "441350" on coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/dispatch_queue.json returns 0. The producer''s observation is literally true.'
      half_b_agreement_elsewhere: 'CONFIRMED AND BROADER. 441350 occurs in the TASK-20260813-1851d0 red-team report, the TASK-20260813-5eb6ef approval determination, the TASK-20260813-737a9f snapshot receipt, the TASK-20260813-c93855 ledger receipt, experiments/EXP-JINV-bd141d/amendments/v6.yaml, and additionally in DEC-20260813-d14d6b, EV-JINV-55ff88, v6-derivation-fixtures.json and v6-derivation-validator.py. All agree on the value.'
      the_refutation: >-
        THAT FILE WRITES THE NUMBER WITH A THOUSANDS SEPARATOR. grep -c
        "441,350" on the same file returns 1, and the occurrence is
        'preserves ... 441,350 recursively typed nodes' inside
        tasks[TASK-20260813-5b8a62].completion_note - EXACTLY the field the
        contract names. The same note also contains, verbatim, 'and both latent
        dict/list container probes', and TASK-20260813-1851d0's completion_note
        contains '2/2 latent container probes'. The same file uses comma
        formatting throughout for the very sizes obligation 1 binds - '25,996
        bytes', '41,624 bytes', '28,105 bytes', '40,257 bytes', each appearing
        twice.
    adjudication: >-
      The frozen contract's obligation-8 provenance line - '441350 and the two
      latent dict/list container probes are read from the TASK-20260813-5b8a62
      and TASK-20260813-1851d0 completion notes in the committed v6 queue' -
      REPRODUCES EXACTLY, for BOTH halves. MF-2's conclusion is FALSE. It is a
      false positive generated by a literal-substring search against a file that
      formats integers with separators. The producer reported its search
      honestly and this is not fabrication under AGENTS.md rule 9 - the tool
      genuinely returned nothing - but the inference drawn from the empty result
      is wrong, and it is now propagated into three immutable records and a
      commit message.
    why_this_matters: >-
      A later reader inherits a recorded statement that a committed coordination
      record fails to support its own contract. It does not. Left standing, MF-2
      would cast doubt on the provenance discipline of the BATCH-d7e255 queue,
      which is the declared source for most of the frozen contract's values.
    resolution_required: SUPERSEDING_RECORD_ONLY
    resolution_note: >-
      I did not correct anything and must not. The preservation manifest, the
      snapshot receipt and the commit are immutable. A Coordinator decision or
      correction record must state that MF-2 is refuted, cite the comma-formatted
      occurrence, and restate the material-findings count. Editing any of the
      three records in place would be the exact failure SR-5 forbids.
    cheapest_falsification_of_my_finding: 'grep -c "441,350" coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/dispatch_queue.json -> 1'
  - id: V-2
    severity: MATERIAL_CORROBORATING
    class: mechanism_identified
    title: 'The frozen contract''s "both manifests" reading is an artifact of its own declared source, and I can now show why.'
    what_i_recomputed: >-
      The third alias manifest 7415d195... has ZERO occurrences in the committed
      BATCH-d7e255 dispatch_queue.json, while 595ccde1... and e96a9359... both
      occur there. That queue's TASK-20260813-5b8a62 completion_note says 'The
      immutable v5 mutation and alias-universe manifests remain e96a9359... and
      595ccde1...' - which is, word for word, the contract's 'both manifests'.
      The contract's own hash_provenance declares its source as 'the BATCH-d7e255
      v6 dispatch_queue.json archive blocks and completion notes, and the
      GOAL-ENDO-001 goal head'.
    adjudication: >-
      The contract binds two manifests because its declared source names exactly
      two. This is NOT a defect in the contract's honesty - hash_provenance
      already warns that every value was read rather than recomputed and invites
      exactly this correction. It is the mechanism that produced OBD-1, and it
      is the SAME mechanism as V-1: a value present in the approved bytes but
      absent, or differently rendered, in the coordination record the contract
      was written from. Both findings say the same thing about this campaign -
      the coordination queue is a faithful but LOSSY projection of the approved
      package, and any binding read from it must be re-read against the package
      itself.
    forward_guidance: >-
      Future frozen contracts in this campaign should read hash bindings from
      the approved artifacts (v6.yaml, the fixtures, the public validator
      constants) and cite the queue only as corroboration, not the other way
      round.
  - id: V-3
    severity: MATERIAL
    class: adjudication_of_producer_finding
    title: 'MF-1 / OBD-1 CONFIRMED, and stronger than the producer stated. Binding all three manifests was correct and is not a silent widening. Reading B is better supported, but I do not select it.'
    third_manifest_exists: true
    third_manifest_sha256: 7415d195d5c7c2cd099b566a5c123f4adb3f45fb19c2ccc7077b37cf23da9c43
    distinct_from_both_bound_manifests: true
    distinctness_evidence: >-
      Three different values for three different objects, all read directly out
      of experiments/EXP-JINV-bd141d/amendments/v6.yaml: type_alias_universe.
      manifest_sha256 = 595ccde1... (the 45-position alias UNIVERSE enumeration,
      carrying terminal_v5_accepted_count 36 and terminal_v5_rejected_count 9);
      type_alias_suite.manifest_sha256 = 7415d195... (the 45-case alias SUITE
      itself, location fixture_overlay.type_alias_suite, exact_count 45,
      exact_rejections_required 45); legacy_mutation_suite.
      canonical_manifest_sha256 = e96a9359... (the 122-case legacy suite).
    the_three_places_the_producer_named_verified:
    - 'experiments/EXP-JINV-bd141d/amendments/v6.yaml line 259, block type_alias_suite, field manifest_sha256: CONFIRMED'
    - 'coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/archives/TASK-20260813-737a9f/snapshot-receipt.json line 57, field validation.type_alias_suite_manifest_sha256: CONFIRMED'
    - 'ledger/decisions/DEC-20260813-d14d6b.yaml line 271, block recursive_type_and_suite_integrity, field type_alias_suite.manifest_sha256: CONFIRMED'
    five_further_places_the_producer_did_not_name:
    - 'ledger/evidence/EV-JINV-55ff88.yaml line 264'
    - 'experiments/EXP-JINV-bd141d/amendments/v6-derivation-validator.py line 46, as the module constant ALIAS_SUITE_SHA256'
    - experiments/EXP-JINV-bd141d/amendments/v6-derivation-fixtures.json
    - 'coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/reviews/TASK-20260813-1851d0/red-team-report.yaml line 307, field suite_manifest_sha256'
    - 'coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/archives/TASK-20260813-c93855/ledger-receipt.json line 191, and decisions/TASK-20260813-5eb6ef/approval-determination.yaml line 399'
    occurrences_total: 'eight committed places, not three'
    decisive_new_evidence_for_reading_b: >-
      The approved package's OWN public validator partitions the manifests
      exactly as reading B does. It declares two alias-side constants,
      ALIAS_UNIVERSE_SHA256 and ALIAS_SUITE_SHA256, against ONE legacy-side
      constant LEGACY_MUTATION_SHA256; and its self-test emits three separately
      named keys, type_alias_universe_manifest_sha256, type_alias_manifest_sha256
      and legacy_mutation_manifest_sha256. Obligation 7's own words are 'the
      unchanged 122-case legacy suite and manifest' - SINGULAR - so under
      reading A obligation 6 would duplicate obligation 7's manifest while
      leaving an approved manifest bound by nothing. Reading B - 'both
      manifests' = the two ALIAS manifests - is grammatically natural, matches
      the approved bytes' own partition, and leaves no manifest unbound.
    do_i_select_a_reading: false
    why_i_do_not_select: >-
      Choosing a reading of the goal head's own next_action is a goal-head
      interpretation act. The Validator verifies evidence; it does not decide
      what the evidence means. I record that reading B is better supported and
      leave the choice to a separately authorized Coordinator decision that
      supersedes rather than edits.
    was_binding_three_correct_or_a_silent_widening: CORRECT_NOT_A_WIDENING
    three_independent_grounds:
      ground_1_it_was_instructed: >-
        The frozen contract's own both_manifests_reading clause says, in terms:
        'IF the producer finds in the approved v6 bytes a THIRD, distinct
        alias-suite manifest that this reading misses, it MUST bind that
        manifest as well and record the discrepancy as an open binding defect.
        It must NOT silently pick one reading.' The producer did precisely that.
        This is compliance with the contract, not an extension of it, and it is
        therefore not the producer widening anything.
      ground_2_nothing_was_resolved: >-
        The producer stated both readings, argued against each, selected
        neither, and recorded OBD-1 as OPEN with what_would_close_it naming a
        separately authorized superseding decision. An obligation that is bound
        and disclosed as ambiguous has not been resolved.
      ground_3_zero_preservation_consequence: >-
        This is the point that keeps OBD-1 in proportion, and it required a
        shell to establish. 7415d195... is a literal INSIDE v6.yaml, whose exact
        25996 bytes at sha256 9ead7de5... obligation 1 already binds; the alias
        suite object itself lives at fixture_overlay.type_alias_suite inside
        v6-derivation-fixtures.json, whose exact 28105 bytes at sha256
        7051d603... obligation 1 also already binds. I recomputed both and both
        agree. So under EITHER reading of obligation 6, the third manifest is
        already preserved transitively by obligation 1, and resolving the
        ambiguity either way changes nothing about what must be preserved on the
        current committed tree. Binding it a second time adds a redundant check,
        never a new burden, and cannot cause a later preservation check to fail
        that would otherwise pass.
    residual_risk: >-
      OBD-1 remains a genuine INTERPRETIVE defect in the frozen contract and
      should be closed by supersession, because a future contract derived from
      this one could inherit the two-manifest reading in a context where
      obligation 1 does not cover the third object. It is not, however, a
      preservation failure today.
    do_not_treat_disclosure_as_resolution: >-
      I did not accept the producer's binding merely because it was disclosed. I
      verified the third manifest's existence in eight committed places, its
      distinctness from both bound manifests, its independent rederivation by
      the committed verifier, and the transitive-binding argument above, before
      concluding that bind-and-disclose was the correct response.
  - id: V-4
    severity: MINOR_MATERIAL
    class: stale_counter
    title: 'The package''s material-findings counters are now stale in the conservative direction.'
    detail: >-
      preservation-manifest.yaml summary.material_findings = 2 and
      open_binding_defects = 1; planning-gate.yaml open_binding_defects.count =
      1; the producer receipt findings_summary records 1 and 2; the snapshot
      receipt carries both forward. With MF-2 refuted (V-1), the honest reading
      is ONE standing material finding (MF-1 / OBD-1) plus one superseded false
      finding. The counters over-report a defect rather than hiding one, which
      is the safe direction, but they are wrong and must be restated.
    resolution_required: SUPERSEDING_RECORD_ONLY
  - id: V-5
    severity: MINOR
    class: undisclosed_provenance
    title: 'CT-4 and PB-1 quote the E14 C1 / E14 C3 text without disclosing that it lives in a SUPERSEDED goal-head note.'
    detail: >-
      The quoted requirements are faithful - I verified the 1/5/15-minute load
      averages, the core count at start and at every rung boundary, the declared
      load threshold, and 'declining to start is a DISPATCH DEFERRAL that
      consumes no run identifier, is not a budget event, is not a result and is
      never negative evidence', plus the E14 C3 cost guard's 60-percent stop
      being a BUDGET EVENT. But that text sits in
      next_action_note_20260811_batch_d7e255_jinv_volc_archive_superseded, a
      RETAINED SUPERSEDED note. CT-4 labels it 'read as precedent, not as
      authority for any new run', which is the right frame; PB-1's
      precedent_read does not carry the same qualifier and reads as though the
      requirement is live.
    why_it_matters: 'Small, but it is exactly the class of provenance looseness that produced OBD-1 and V-1. A precedent read from a superseded note should say so.'
    resolution_required: 'disclosure in the Coordinator decision, or in any successor that carries PB-1 forward'
  - id: V-6
    severity: MINOR
    class: control_design_gap
    title: 'CT-1, CT-2 and CT-3 specify only the endpoint k = 0, not a decay expectation across intermediate k.'
    detail: >-
      docs/inventor-protocol.md section 3 names the canonical artifact tell as a
      quantity that FAILS TO DECAY as the parameter meant to destroy it
      increases. As written, CT-1/CT-2/CT-3 are checkable only at the endpoint
      (at k = 0 the detection rate must fall to the null rate). A quantity that
      is correct at k = 0 but non-monotone in between would pass. CT-4 states
      the full form and should be the model.
    note: >-
      CT-1's 'increasing null-bank replicate count must not increase detection'
      and CT-2's tie rule are both genuine falsifiers and partly compensate.
      This is a strengthening item, not a defect that invalidates the controls.
    resolution_required: 'address in any successor that authorizes measuring CT-1..CT-3'
  - id: V-7
    severity: MINOR
    class: coverage_gap_in_stopping_rules
    title: 'No stopping rule covers PB-3''s own failure mode.'
    detail: >-
      PB-3 is 'a static design that either fits the frozen caps without any
      prohibited credit, or states in writing that it cannot'. Nothing in
      SR-1..SR-9 fires on a PB-3 that does neither - an indefinite authoring
      loop. SR-4 catches it only by budget exhaustion, which is a BUDGET EVENT
      and therefore explicitly not a statement about the design. Given E4-E7
      overshoot by 1e2 to 1e5, the 'it cannot' branch is the likely one and it
      needs a rule that makes writing it down mandatory rather than optional.
    resolution_required: 'address in any successor that authorizes PB-3'
  - id: V-8
    severity: FORWARD_GUIDANCE
    class: inventor_protocol
    title: 'If a later decision uses E4-E7 to close this lane, they must be recorded as a measured obstruction with a resource_check.'
    detail: >-
      The package correctly declines to recommend closure (EV-PRE-3: 'THIS GATE
      CHOOSES NEITHER ROUTE AND RECOMMENDS NEITHER'), so no obstruction block is
      required of it, and premature closure is correctly avoided. But E4-E7 are
      already a quantified obstruction with exact values, units and a stated
      scope. Under docs/inventor-protocol.md, a negative result claiming this
      lane is dead would need them written as an obstruction block with value,
      units, error bars, the runs read from, the scope claimed, AND a
      resource_check asking which theory reads a 5e13-byte retained-artifact
      requirement as an asset. Naming this now so a later closure cannot be
      written as prose.
    not_a_defect_of_this_package: true

