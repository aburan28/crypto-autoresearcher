  # ---------------------------------------------------------------- verdict
  verdict:
    handoff_vocabulary_verdict: REVISE
    handoff_vocabulary_note: >-
      The handoff (ledger/handoffs/TASK-20260815-fa8f06.yaml, constraints[12])
      sets the bar as: "Return PASS only if every check above holds with ZERO
      MATERIAL OBJECTION." Three objections are named below, one of them
      material. The bar is therefore not met and the verdict is REVISE.
    role_contract_terminal_verdict: failed
    role_contract_terminal_verdict_meaning: >-
      READ THIS BEFORE QUOTING THE TOKEN. agents/validator.md offers only
      `passed | failed | incomplete | invalid` and has no `revise` token, so
      REVISE is forced onto `failed`. HERE `failed` MEANS EXACTLY ONE THING:
      the package did not clear the handoff's zero-material-objection PASS bar.
      It does NOT mean the planning gate is void, that any bound value is
      wrong, that any obligation was dropped, that a gate was cleared, that a
      run occurred, or that anything scientific failed. Every one of those
      checks PASSED and is itemised below. The objections are record-integrity
      and provenance-discipline items, all repairable by a superseding record
      without touching a single byte of the reviewed artifacts.
    scope_of_this_verdict: >-
      This verdict binds to the exact bytes of commit
      7ee825ff9849542d681e02781fcaaa21a36ca5fb and to nothing else. It is not
      experiment evidence, not JINV evidence, not ECDLP evidence in either
      direction, not a status change, not a closure, not a breakthrough, and
      not an authorization. It approves no work. A REVISE here does not
      reopen, invalidate, or disturb DEC-20260813-d14d6b, EV-JINV-55ff88, the
      approved v6/protocol-v7 bytes, or any terminal v5/v6 record.
    material_objections: 1
    minor_objections: 2
    observations_not_objections: 6
    checks_performed: 61
    checks_passed: 58
    checks_failed_against_the_package: 3

  # -------------------------------------------------- independence disclosure
  independence:
    independent_session: true
    is_the_producer: false
    producer_session_continued_consulted_or_reused: false
    read_method: from_scratch_reading_of_the_committed_snapshot
    same_backend_disclosure: >-
      STATED PLAINLY AS THE HANDOFF REQUIRES. On this harness every policy
      alias currently falls back to one backend. This review and the reviewed
      work therefore resolve to models on the SAME backend and the same model
      family. "Independent" here means an independent session, an independent
      context, and a from-scratch reading of the committed bytes. IT DOES NOT
      MEAN INDEPENDENT JUDGEMENT FROM A DIFFERENT MODEL FAMILY, and no record
      relying on this report may describe it as cross-model corroboration.
    sibling_red_team_correlation_disclosure: >-
      The sibling red team TASK-20260815-3ec919 runs CONCURRENTLY with this
      review and resolves to the SAME model family as this session. ANY
      AGREEMENT BETWEEN THE TWO REPORTS IS CORRELATED SAME-MODEL JUDGEMENT AND
      MUST NOT BE RECORDED AS DISTINCT-MODEL CORROBORATION. Two agreeing
      reviews from one model family are one opinion sampled twice.
    red_team_directory_read: false
    red_team_contacted_or_coordinated_with: false
    shared_correlated_failure_mode_that_neither_review_can_rule_out: >-
      Both reviewers and the producer share a training distribution, so a
      systematic blind spot common to that distribution would survive both
      reviews unremarked. The mitigation actually available was mechanical
      rather than judgemental: this session recomputed values with tools
      instead of reading them, and every finding below is anchored to a
      command a third party can rerun.

