      The producer's preservation manifest names, as what_would_verify_it,
      "run the committed public validator ... --self-test and compare its
      derived hashes". THAT POINTER WAS EXERCISED, NOT ASSERTED. The validator
      was copied to a scratch directory outside the repository and run there,
      after auditing its whole side-effect surface (no open() for write, no
      network, no subprocess, no mkdir; its own docstring states it "performs
      no network, harness, experiment, target, curve, or measurement operation,
      and writes no cache files"). Two further scripts written by this session
      recomputed the same quantities from the raw fixtures WITHOUT the
      validator, so the validator is not the sole witness to its own claims.
    is_this_an_experiment_run: false
    why_not: >-
      A deterministic static fixture self-test over committed bytes
      materialized no plant bank, no null bank, no curve and no target,
      consumed no run identifier, wrote nothing under experiments/, and
      produced no observation about any mathematical object. It is hash
      recomputation, which the handoff requires. experiment_runs_executed
      remains 0.
