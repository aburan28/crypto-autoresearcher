  # ---------------------------------- inventor-protocol checks required of this role
  inventor_protocol_checks:
    section_3_null_object_controls:
      applicable: true
      statistical_signal_correlation_bias_or_excess_reported_by_this_package: none
      finding: >-
        The package reports NO measured quantity of any kind, so there is no
        signal to have been measured against a null. What section 3 asks for
        PROSPECTIVELY is present and is the strongest structural feature of
        this document: for every quantity a successor would eventually measure,
        a matched null object OF THE SAME SHAPE is named in advance, with the
        identical-instrument requirement and the parameter whose change must
        destroy the signal.
      what_the_measured_quantity_should_do_is_stated: true
      per_control_decay_statement:
        CT-1: 'at k=0 the detection rate must fall to the null rate; increasing null-bank replicate count must NOT increase detection'
        CT-2: 'at k=0 the actual crater must not be the unique strict extremum more often than a pseudo-crater is; every tie is nondetection, so a control cannot be rescued by counting ties as hits'
        CT-3: 'at k=0 the nuisance and intended arms must be indistinguishable'
        CT-4: 'as the 1-minute load average rises the measured wall rate must degrade; doubling the stage cardinality must approximately double CPU-seconds'
        CT-5: 'at zero planted amplitude the instrument must reject'
      canonical_artifact_tell_addressed: true
      canonical_artifact_tell_detail: >-
        The tell is a quantity that does not decay when the parameter meant to
        destroy it increases. This package names that tell explicitly in the
        one place it is easiest to overlook - CT-4, a control on the ESTIMATES
        rather than on the science: "a rate that does not move with load is
        measuring the clock, not the work." Applying the null-object discipline
        to an engineering measurement is unusual and correct.
      unmeasured_is_not_passed: 'stated in the controls principle and again as stopping rule SR-8'
    section_6_scale_ladder:
      applicable_at_all: false
      why: >-
        The ladder governs a claimed improvement that cannot be executed at the
        scale where it would matter. THIS PACKAGE CLAIMS NO IMPROVEMENT. Its
        own scope block records claim_tier toy, sota_delta zero on every named
        axis, tested_scale "none; this document measures nothing", and
        transfer_assumptions "none are made, because nothing here is
        transferred anywhere". There is no extrapolation to check.
      step_2_absence_is_not_a_failure_here: >-
        STATED EXPLICITLY BECAUSE THE ROLE CONTRACT MAKES STEP 2 A `failed`
        WHEN A SPEEDUP IS CLAIMED. No speedup is claimed anywhere in this
        package, so the missing scaled-down whole-pipeline measured ratio is
        correctly absent rather than a defect. If any successor work unit ever
        claims a ratio, step 2 becomes mandatory then.
      step_1_assumption_isolation_present_prospectively: >-
        PB-2 isolates the single load-bearing assumption (linear extrapolation
        of a rate in stage cardinality), NAMES ITS SPECIFIC FAILURE MODE
        ("linearity in cardinality is exactly what fails when a working set
        stops fitting in memory or in cache, which is the regime the
        retained-byte and logical-I/O overshoots say this workload is in"),
        assigns it a dedicated control (CT-4), and pre-commits to refusing the
        estimate if CT-4 is not measured. The document names this its own
        weakest link in three separate places.
      step_4_reproducibility_pointer_exercised: true
      step_4_detail: >-
        THIS IS THE RUNG THAT APPLIED, AND IT WAS EXERCISED RATHER THAN
        ASSERTED. The package's reproducibility pointer is the committed public
        validator's --self-test. It was run from scratch in a clean scratch
        directory, exit 0, status pass, and every derived value it produces
        reproduces the bound values. Two independent scripts written by this
        session reproduced the same quantities without the validator.
    premature_closure_check:
      finding: >-
        The package does not decline to search. EV-PRE-3 keeps both routes open
        - a separately authorized resource-cap change, or lane closure with the
        obstruction named - and recommends neither. Under the protocol's
        symmetry between overclaiming and premature closure, that is the
        correct posture for a document with no measurement behind it.
    pareto_honesty:
      claim_tier: toy
      sota_delta: 'zero on time, memory, data, query, exponent, JINV, ECDLP, trapdoor, scientific-status, closure, and breakthrough axes'
      dominated_by: 'not_applicable: a mandatory planning gate, not a competing attack mechanism'
      present_and_honest: true

