    units_declared: PARTIAL
    units_detail: 'E1 CPU-seconds; E2 seconds per run and per shard; E3 bytes; E4/E5/E7 bytes; E6 count of shards. E8 alone lacks an explicit units field though its values are self-labelling. Seven of eight explicit.'
