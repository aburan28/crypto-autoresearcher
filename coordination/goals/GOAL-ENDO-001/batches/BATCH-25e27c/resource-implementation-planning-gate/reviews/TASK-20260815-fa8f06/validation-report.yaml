      assumption_naming: 'Every one of PB-1 through PB-5 names the assumption its figures rest on, and PB-2 names its own weakest link (linearity in cardinality fails exactly when a working set stops fitting in memory or cache, which is the regime the retained-byte and logical-I/O overshoots say this workload is in). That is an unusually honest self-criticism and it is repeated in three places.'
