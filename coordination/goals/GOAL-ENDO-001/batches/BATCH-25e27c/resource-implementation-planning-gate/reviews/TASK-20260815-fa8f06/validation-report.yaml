  # ------------------------------------------------------------- objections
  objections:
    - id: OBJ-1
      severity: MATERIAL
      title: "The producer's own material finding MF-2 is not reproducible as stated, and asserts a negative that the committed tree contradicts."
      obligation: 8
      located_at:
        - 'preservation-manifest.yaml, obligations[n=8].material_finding.statement'
        - 'preservation-manifest.yaml, material_findings[MF-2].one_line'
        - 'snapshot-receipt.json, carried_forward_second_material_finding.statement'
        - 'commit message of 7ee825ff9849542d681e02781fcaaa21a36ca5fb, paragraph beginning "MF-2:"'
        - 'commit message of 23c66739aa192e52fcb2007bae647d106bc46bed, paragraph beginning "and MF-2"'
      what_the_package_asserts: >-
        "The producer searched that committed file for the literal 441350 and
        found no occurrence", and concludes that the frozen contract's
        obligation-8 provenance line - which attributes 441350 and the two
        latent container probes to the TASK-20260813-5b8a62 and
        TASK-20260813-1851d0 completion notes in the committed BATCH-d7e255 v6
        dispatch_queue.json - "does not reproduce".
      what_this_session_found: >-
        THE ATTRIBUTION DOES REPRODUCE. The value is present in that exact
        file, in that exact completion note, written with a thousands
        separator. tasks[0], which is TASK-20260813-5b8a62, has a
        completion_note containing verbatim: "all six inherited positive
        hashes, 441,350 recursively typed nodes, and all three stored-object
        bindings", and in the same note "45/45 bool/int aliases ... and both
        latent dict/list container probes". tasks[2], which is
        TASK-20260813-1851d0, has a completion_note containing "2/2 latent
        container probes" and "recursive census and manifests". Both cited
        sources carry what the contract says they carry.
      counts_measured: 'grep -c "441350" on that file returns 0; grep -c "441,350" on the same file returns 1'
      root_cause: 'a search for a separator-free digit string, generalized into a conclusion about the record rather than about the search'
      why_this_is_material: >-
        Not because any bound value is wrong - 441350 is correct and this
        session derived it by execution - but because a finding recorded as
        OPEN against the frozen contract, and carried into two immutable
        committed records and two commit messages, misstates a committed
        artifact. The handoff's own rule is "RECOMPUTE, DO NOT COPY ... Report
        any mismatch as MATERIAL." This is a mismatch between the package's
        assertion and the tree, in the direction of manufacturing a defect that
        does not exist.
      cheapest_falsification_of_this_objection: >-
        Run, from the repository root:
        grep -c '441,350' coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/jinv-phase-b-v6-type-strictness-repair/dispatch_queue.json
        If it returns 0, this objection is wrong and MF-2 stands. It returns 1.
      what_would_close_it: >-
        A superseding record - never an edit to any committed artifact -
        recording that MF-2 is RETIRED AS NOT REPRODUCIBLE, that the frozen
        contract's obligation-8 provenance attribution is accurate, and citing
        the comma-formatted occurrence. Obligation 8's binding itself needs no
        change.
      does_this_affect_any_bound_value: false
      does_this_affect_the_resource_disposition: false
      does_this_affect_the_authorization_surface: false
    - id: OBJ-2
      severity: MINOR
      title: "Obligation 3's wording note asserts a second negative that the committed tree contradicts."
      obligation: 3
      located_at: 'preservation-manifest.yaml, obligations[n=3].note_on_wording'
      what_the_package_asserts: >-
        "The contract's field 'equality_included: true' is not a literal field
        name in the committed source. Its substance is carried by the committed
        pair ... Recorded as a paraphrase whose substance agrees, not as a
        verbatim field match."
      what_this_session_found: >-
        `equality_included` IS a literal field name in the committed source. It
        occurs 4 times in experiments/EXP-JINV-bd141d/amendments/v5-derivation-fixtures.json,
        and it is a KEY OF THE STORED p_value_numerator OBJECT ITSELF - the
        object this session re-derived independently in both orders, which
        reads {"denominator": 20001, "equality_included": true, "plus_one":
        true, "reference_equal_count": 1, "reference_greater_or_equal_count":
        10000, "value": 10001}. It also appears at
        ledger/decisions/DEC-20260813-d14d6b.yaml line 289.
      direction_of_error: >-
        CONSERVATIVE. The producer understated the strength of its own binding,
        downgrading an exact field match to "a paraphrase". Nothing was
        overclaimed. Same root cause as OBJ-1: the search covered v6.yaml and
        the receipts but not the composed v5 fixture where the object actually
        lives.
      cheapest_falsification: >-
        grep -c 'equality_included' experiments/EXP-JINV-bd141d/amendments/v5-derivation-fixtures.json
        If it returns 0, this objection is wrong. It returns 4.
      what_would_close_it: 'a superseding note recording that obligation 3 is a verbatim field match, not a paraphrase'
    - id: OBJ-3
      severity: MINOR_BUT_CENTRAL_TO_THIS_TASKS_OBJECTIVE
      title: "Fifteen budget magnitudes are ASSERTED, and that falsifies two universal claims the document makes about itself."
      located_at: 'planning-gate.yaml, budgets.proposed_not_authorized, items PB-1 through PB-5'
      finding: >-
        Each of PB-1..PB-5 declares wall_clock_seconds, memory_gb and
        disk_bytes - fifteen magnitudes in total. NONE of the five items
        carries any source, provenance, derivation, basis or citation field for
        those magnitudes (the item keys are id, title, purpose, the three
        magnitudes, maximum_runs, experiment_runs_authorized, assumption, and
        for PB-1/PB-2 one extra prose field). The `assumption` field on each
        names a METHODOLOGICAL assumption about the nature of the work - "a
        statfs is a read-only host observation", "a rate can be measured at
        reduced cardinality and extrapolated linearly" - and never a basis for
        the number. Nor is any magnitude disclosed as underived, the way E1-E3
        are.
      why_it_matters: >-
        The document makes the claim UNIVERSALLY, twice, and the budgets
        section falsifies it both times.
        (a) what_this_document_is_not: "Every number in it was read from a
        committed artifact and is cited to that artifact, or is disclosed as
        UNDERIVED with its reason."
        (b) nonclaims[3]: "No number in this document was invented,
        interpolated, or back-filled. Every one is cited to a committed
        artifact or disclosed as underived with a reason."
        Fifteen numbers satisfy neither disjunct.
      the_asymmetry_this_exposes: >-
        The estimates section is scrupulous about the derived/underived
        distinction and is the best part of this package. The budgets section
        is not held to the same standard, and the document does not notice.
        Three of the five magnitudes are recognisable as this batch's own
        declared task budgets (PB-3 5400/4 equals the producer's, PB-4 5400/4
        equals each reviewer's, PB-5 1800/2 is the ledger-archive tier), which
        would be a perfectly good provenance IF STATED. It is not stated.
        PB-1's 600 and PB-2's 3600 have no visible antecedent at all.
      handoff_criterion_status: >-
        The handoff's literal budget test - "no field is null and every figure
        names the assumption it rests on" - PASSES. This objection is against
        the task OBJECTIVE's stricter test ("derived rather than asserted") and
        against the document's own self-description, not against the handoff's
        checklist.
      severity_reasoning: >-
        Kept MINOR because these are explicitly PROPOSALS THAT ARE NOT GRANTS,
        each carrying experiment_runs_authorized 0, none authorized, each
        requiring its own separately authorized decision, handoff and review
        before existing as work. An asserted ceiling on unauthorized future
        work misleads nobody about anything measured. It is recorded because
        this task exists to distinguish derived from asserted, and here the
        answer is asserted.
      cheapest_falsification: >-
        Point to any field inside any PB-1..PB-5 item that cites a committed
        artifact for its wall_clock_seconds, memory_gb or disk_bytes, or that
        marks the magnitude underived. This session enumerated the keys of all
        five items and found none.
      what_would_close_it: >-
        Either cite the antecedent for each magnitude (for PB-3/PB-4/PB-5, this
        batch's own declared budgets would do), or mark them
        UNDERIVED_DISCLOSED as E1-E3 are, or narrow the two universal claims to
        the estimates section which is where they hold.
      secondary_precision_note_within_this_objection: >-
        budgets.proposed_budget_envelope_totals.relation_to_frozen_caps says
        "Every figure above is below every corresponding frozen cap" without
        saying which cap corresponds to which figure. Under one natural
        correspondence it is not true: PB-2's disk_bytes 1073741824 and the
        1091567616-byte envelope both exceed individual_artifact_bytes_max
        536870912. Under the correspondence the same field's next sentence
        implies - these are planning-support budgets, not Phase B budgets - the
        comparison does not apply at all. Either way the sentence is
        reassurance rather than a check. No grant, no measurement, no
        consequence; recorded for precision.

