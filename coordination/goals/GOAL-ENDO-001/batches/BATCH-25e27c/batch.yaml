objective: >-
  Open exactly one separate bounded NONAUTOMATIC resource-and-implementation-planning
  gate, beginning from the fail-closed resource_incomplete disposition, as the
  GOAL-ENDO-001 goal-head next_action requires verbatim. One zero-run Coordinator
  producer authors a static planning-gate package specifying estimates, budgets,
  stopping rules, controls, artifacts, and a fresh authorization boundary, and
  preserving all eighteen preservation obligations the next_action lists. The package
  is snapshotted alone, independently validated, independently red-teamed, and
  ledger-archived alone. This batch serves that next_action and nothing beyond it.

authorizes_nothing: >-
  THIS BATCH AUTHORIZES NOTHING. It does not authorize implementation. It does not
  authorize Phase B. It does not authorize any control or experiment. It does not
  authorize target or curve access. It does not authorize JINV or transport work.
  It does not authorize N18. It does not authorize science. It does not authorize
  status change. It does not authorize ECDLP work or any ECDLP claim. It does not
  authorize closure. It does not authorize breakthrough. It does not authorize
  publication. It does not authorize network write. It does not authorize execution.
  Opening the batch is nonautomatic and confers none of these by existing.

resource_disposition: resource_incomplete
resource_disposition_note: >-
  The gate BEGINS FROM resource_incomplete and LEAVES IT THERE. The producer may
  propose estimates and budgets; it may not clear, lift, relax, re-dispose, widen,
  or declare satisfied the fail-closed disposition, and may take no compression,
  deduplication, hash-only-substitution, omitted-cell, or budget-widening credit.
  Only a later, separately authorized Coordinator decision may act on the estimates;
  this batch does not contain that authorization.

goal_head_policy: >-
  ledger/goals/GOAL-ENDO-001/goal.yaml is in NO task write scope in this batch. The
  mutable goal head moves only under a separately authorized goal-head reconciliation,
  which is this campaign's own established practice (jinv-v5-goal-head-reconciliation,
  jinv-v6-goal-head-reconciliation). This batch checkpoints instead, by writing the
  write-once shard ledger/goals/GOAL-ENDO-001/checkpoints/BATCH-25e27c.yaml in the
  ledger archive at close.

completion_criteria_status: >-
