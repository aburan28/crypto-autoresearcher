hash_and_commit_provenance: >-
  Every archive in this batch starts with commit_sha null, parent_sha null, and an
  EMPTY path_sha256 map. That is BY CONSTRUCTION, NOT BY OMISSION: the authoring
  session has no Bash, cannot compute SHA-256 or read git, and the commits those
  hashes would bind do not exist yet. The dispatching session computes and fills them
  at archive time, after each commit, and post-commit verifies the receipt. No
  placeholder hash was invented and none may be.

ledger_record_id_provenance: >-
  The ledger archive's declared paths carry the placeholder tokens
  EV-JINV-PENDING-ALLOCATION and DEC-20260815-PENDING-ALLOCATION. THESE ARE NOT
  IDENTIFIERS. AGENTS.md rule 14 requires a random 6-hex token minted by
  tools/allocate_id.py without scanning state; the authoring session has no Bash and
  could not mint one, and guessing would be exactly the collision failure the rule
  exists to prevent. 'PENDING-ALLOCATION' is not 6-hex and so can never collide with
  a real token. The archiving session mints both ids, --checks them, and substitutes
  them into the queue's artifact_paths, write_scope and record_ids and into the task
  card in one control-plane edit before staging.

