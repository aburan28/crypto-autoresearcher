review_plan:
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-686cd3
  work_unit: resource-implementation-planning-gate-2-review-and-rc1
  recorded_at: '2026-08-24'
  recorded_by: coordinator
  claim_scope: >-
    The review can change only the disposition of the static second planning-gate
    package and its zero-run RC-1 cost-chain check. It cannot establish a JINV,
    ECDLP, isogeny, transport, exponent, speedup, closure, or breakthrough claim.
  prior:
    expectation: >-
      I expect at least one reviewer to find a remaining record-integrity,
      provenance, control, or scope defect despite the second gate's repairs. I
      expect RC-1 to confirm that the retained-byte, individual-artifact, shard,
      and logical-I/O expressions share the replacement-pair term while also
      exposing the non-dominant residual. I expect no scientific evidence in
      either direction. A PASS, if returned, can approve only the exact static
      planning package at its snapshot and cannot authorize implementation.
    decision_if_overturned: >-
      If both reviews find the package clean and RC-1 does not reproduce the
      stated formula relation, the Coordinator must record that surprise and
      re-evaluate the package's interpretation rather than treating agreement
      with this prior as a promotion gate.
  joints:
    - id: J1-static-binding-and-preservation
      owner_task_id: TASK-20260824-453079
      question: >-
        Do the five immutable gate-2 files preserve the eighteen obligations,
        bind every claimed source, disclose every underived quantity, and keep
        resource_incomplete fail-closed without silently authorizing work?
      worked_attack_plan:
        - Re-parse all five files and independently enumerate every obligation and authorization field.
        - Recompute the three amendment hashes, sizes, manifest hashes, and the stated numeric chain from source files.
        - Search for omitted, duplicated, contradictory, or silently reworded obligations using a folding-aware comparison.
        - Run a known-false control package with one obligation removed and one authorization flag raised; the review method must reject it.
    - id: J2-rc1-and-cost-chain
      owner_task_id: TASK-20260824-453079
      question: >-
        Does the RC-1 artifact faithfully perturb only all_replacement_pairs_upper
        and recompute E4-E7 from the committed formulas, with no fabricated
        measurement or scientific interpretation?
      worked_attack_plan:
        - Re-derive the baseline and every factor case from v4-cost-worksheet.json without reading the producer's RC-1 implementation first.
        - Independently enumerate all numeric fields in the RC-1 report and check units, integer rounding, and residual terms.
        - Apply a known-false control by perturbing a different source term; the stated single-lever relation must not be claimed for that control.
    - id: J3-scope-cost-and-falsification
      owner_task_id: TASK-20260824-5d19e1
      question: >-
        Can the gate's framing, controls, stopping rules, budgets, and forward
        guidance be interpreted as a hidden authorization or as a stronger
        cost/science claim than its declared scope supports?
      worked_attack_plan:
        - Attack each of the fourteen forbidden authorization items and each budget/stopping-rule boundary in prose and structured fields.
        - Independently recompute the dominant and residual cost terms by a different construction from the validator's row-by-row derivation.
        - Use a known-false control document that contains the same headings but one deliberately smuggled authorization; confirm the review would reject it.
        - State the cheapest next falsification control and any remaining obstruction with units and scope.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - tools/research_dispatch.py
      - experiments/EXP-JINV-bd141d/
      - ledger/decisions/DEC-20260824-fa5fa0.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/review-plan.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/archives/TASK-20260824-7fa0ca/snapshot-receipt.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate-2/
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/reviews/TASK-20260824-453079/
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/reviews/TASK-20260824-5d19e1/
    attestation_required: >-
      Each reviewer must state exactly what it read, confirm it did not read the
      sibling report, and disclose the resolved model and policy. Independence is
      a fresh session and disjoint context; it is not claimed to be distinct
      model-family corroboration.
  proves_too_much_control:
    required: true
    construction: >-
      Each reviewer must run its assigned checking method against a deliberately
      known-false control package with one removed obligation or one true
      authorization field. If the method accepts the known-false control, the
      review is a protocol failure and must return REVISE or FAIL rather than PASS.
    result_interpretation: >-
      Passing the control shows only that the review method can detect the planted
      defect. It does not prove the gate correct. Failing to reject the control is
      evidence against the review method, not evidence against JINV or ECDLP.
  blind_rederivation:
    required: true
    blind_from:
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/rc1-recompute.py
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/rc1-report.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/runtime-session-receipt.json
    rederiver_task_id: TASK-20260824-453079
    quantity: >-
      Baseline and factor-specific E4, E5, E6, and E7 values derived from the
      committed worksheet, including the residual after reducing the dominant term.
    source_rule: >-
      The validator must start from the statement of the quantity and committed
      source parameters alone, then compare its independent result to RC-1 only
      after its derivation is complete. Reusing the producer's script or report
      before deriving is not a blind re-derivation.
  procedure_deviations: []
  expected_outputs:
    - independent validation report with scoped PASS, REVISE, or FAIL
    - independent red-team report with scoped PASS, REVISE, or FAIL
    - final Coordinator decision that composes the joints without outvoting a dissent
