validation_report:
  id: VAL-20260824-453079
  task_id: TASK-20260824-453079
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-686cd3
  snapshot_commit: 43d028826579a4cb72595c91a055f470a9e18758
  review_scope: >-
    Independent validation of J1 (static binding and preservation) and J2
    (RC-1 and cost chain) only. The verdict is limited to the snapshotted
    static planning package and its zero-run RC-1 artifact integrity. This
    report makes no scientific, cryptanalytic, ECDLP, JINV, isogeny, transport,
    exponent, speedup, closure, or breakthrough claim.
  ordering:
    historical_opening_decision: >-
      Read from the committed historical bytes with git show
      43d028826579a4cb72595c91a055f470a9e18758:ledger/decisions/DEC-20260824-fa5fa0.yaml.
      The later administrative correction CORR-20260824-85b304 was not read and
      was not used as a replacement source blob.
    blind_rederivation_before_producer: true
    blind_rederivation_source: experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
    producer_materials_opened_after_derivation:
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/rc1-recompute.py
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/rc1-report.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/tasks/TASK-20260824-5d12b1/runtime-session-receipt.json
  run_ids: []
  artifact_checks:
    - check: snapshot path inventory and content hashes
      result: PASS_WITH_EXPLICIT_SELF_BINDING_LIMITATION
      evidence: >-
        The snapshot receipt declares 11 paths, 10 source-content paths, and
        11 path-hash keys. All 10 non-self expected SHA-256 values recomputed
        from the snapshot commit match exactly. The receipt's own path hash is
        null as declared by its self-neutrality explanation.
      limitation: >-
        snapshot-receipt.json also carries commit_sha: null and parent_sha:
        null. The supplied snapshot commit and its actual first parent were
        checked directly in Git, but no separate post-commit binding receipt
        was used to turn those null fields into a claim about the receipt blob.
    - check: exact snapshotted package identity
      result: PASS
      evidence: >-
        The five gate-2 package files, the frozen review plan, the historical
        opening decision, and the three RC-1 artifacts are byte-identical to
        the snapshot commit. The package YAML files parse successfully. The
        opening decision was read from the requested historical commit, not
        from a later correction.
    - check: preservation obligation coverage
      result: PASS_FOR_BINDING_STRUCTURE
      evidence: >-
        preservation-binding.yaml declares 18 obligations with n values 1
        through 18, one exact reference of the form
        preservation-manifest.yaml obligations[n=<n>].obligation_verbatim per
        entry, zero dropped, zero reworded, zero silently resolved, and zero
        re-transcribed strings. Its explicit OBD-1 open marker is preserved;
        the historical opening decision records the separately authorized
        interpretation and explicitly leaves the immutable package unchanged.
      limitation: >-
        The referenced upstream preservation-manifest.yaml was not one of the
        exact snapshotted input paths opened in this session, so this check
        validates the package's reference/count/preservation structure rather
        than independently re-reading every upstream obligation_verbatim byte.
    - check: underived quantity disclosure
      result: PASS
      evidence: >-
        underived-register.yaml has 20 entries partitioned as 4 estimate, 10
        budget-figure, and 6 other entries, with IDs UR-1 through UR-20. E1,
        E2, E3, and E8 point to UR-1 through UR-4 respectively; the remaining
        budget and auxiliary quantities are explicitly classified rather than
        silently promoted to derived measurements.
    - check: authorization and fail-closed preservation
      result: PASS
      evidence: >-
        authorizes_nothing contains no non-false/non-zero authorization value;
        experiment_runs_executed and experiment_runs_authorized are both 0.
        resource_disposition remains resource_incomplete and fail_closed at
        both ends, with 0 gates cleared, 3 missing estimates, 5 failed gates,
        and no credit from compression, deduplication, hash-only substitution,
        cell omission, or budget widening.
    - check: required static planning contents and boundary
      result: PASS
      evidence: >-
        The package declares estimates, budgets, stopping rules, controls,
        artifacts, and a fresh authorization boundary. It contains 11 stopping
        rules SR-1 through SR-11, five eventual controls CT-1 through CT-5,
        six explicitly named grants that require a later decision, 16 explicit
        non-grants, and eight evidence preconditions. The controls are stated
        as unmeasured and none is recorded as passed by this gate.
    - check: source and runtime provenance fields
      result: REVISE_REQUIRED_FOR_RC1_RECEIPT
      evidence: >-
        The RC-1 report's worksheet SHA-256 matches the committed worksheet,
        and the snapshot hashes match the script, report, and runtime receipt.
        The producer receipt records requested_policy executor-mechanical,
        resolved_model_id gpt-5-codex, model_verified false, fallback_used
        false, an empty degraded_requirements list, and Bedrock selected,
        contacted, and used all false. Those provenance fields are explicit;
        the commit/raw-result binding defect is recorded below.
  metric_recomputations:
    - quantity: blind baseline E4-E7 chain
      source: experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
      derivation: >-
        all_replacement_pairs_upper = 21,223,987,200 + 174,987,352,800 =
        196,211,340,000. The non-replacement residual is the eight-component
        retained-byte sum minus the replacement-pair component:
        219,032,804,608 bytes. With replacement_pair_max 256 and individual
        artifact cap 536,870,912, the independently derived values are E4
        retained bytes 50,449,135,844,608; E5 individual-artifact bytes
        50,230,103,040,000; E6 exact-ceiling shard count 93,969; and E7
        logical I/O 151,347,407,533,824.
      producer_comparison: exact_match
    - quantity: factor-specific RC-1 cases
      source: experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
      rounding: >-
        Integer cardinalities use floor division by the factor; shard counts
        use exact integer ceiling. No floating-point estimate was used.
      cases:
        - factor: 2
          all_replacement_pairs_upper: 98105670000
          E4_retained_bytes: 25334084324608
          E5_individual_artifact_bytes: 25115051520000
          E6_shard_count: 47189
          E7_logical_io_bytes: 76002252973824
          residual_bytes: 219032804608
          producer_comparison: exact_match
        - factor: 12000
          all_replacement_pairs_upper: 16350945
          E4_retained_bytes: 223218646528
          E5_individual_artifact_bytes: 4185841920
          E6_shard_count: 416
          E7_logical_io_bytes: 669655939584
          residual_bytes: 219032804608
          producer_comparison: exact_match
        - factor: 1000000000
          all_replacement_pairs_upper: 196
          E4_retained_bytes: 219032854784
          E5_individual_artifact_bytes: 50176
          E6_shard_count: 408
          E7_logical_io_bytes: 657098564352
          residual_bytes: 219032804608
          producer_comparison: exact_match
    - quantity: residual preservation across perturbations
      result: PASS
      evidence: >-
        For the baseline and all three factor cases, E4 minus E5 equals the
        same 219,032,804,608-byte residual. E4 is residual plus replacement
        subtotal, E5 is the perturbed replacement subtotal, E6 is the exact
        ceiling of E4 over the individual-artifact cap, and E7 is 3 times E4.
        The report does not fabricate a measurement or reinterpret the chain
        scientifically.
  control_checks:
    - control: J1 known-false authorization control
      mutation: authorizes_nothing.implementation_authorized = true
      result: REJECTED_BY_CHECKER
      interpretation: >-
        The unmutated package is accepted by the static checker; the single
        true authorization field is rejected. This demonstrates detection of
        the planted false package and does not validate any scientific claim.
    - control: J1 known-false preservation control
      mutation: remove obligation n=18 from the in-memory binding list
      result: REJECTED_BY_CHECKER
      interpretation: >-
        The checker rejects the resulting 17-entry/non-contiguous binding
        package. This is a second proves-too-much guard for the preservation
        method; it is not evidence about the research direction.
    - control: J2 known-false different-source perturbation
      mutation: >-
        Change only serialization_upper_bound_model.bytes_per_item_upper.
        replacement_pair_max from 256 to 257 while leaving
        all_replacement_pairs_upper unchanged at 196,211,340,000.
      recomputed_values:
        E4_retained_bytes: 50645347184608
        E5_individual_artifact_bytes: 50426314380000
        E6_shard_count: 94335
        E7_logical_io_bytes: 151936041553824
      result: REJECTED_BY_CHECKER
      interpretation: >-
        The changed source is replacement_pair_max, not
        all_replacement_pairs_upper, so the single-lever RC-1 relation is not
        claimed for this known-false control. Accepting it would have been a
        proves-too-much failure.
  heuristic_validation_checks: []
  cost_model_checks:
    - check: units and formulas
      result: PASS
      evidence: >-
        The four expressions carry byte, shard-count, and logical-I/O units;
        the report states fixed residual, replacement-pair bytes, exact shard
        ceiling, and 3x logical-I/O propagation. The residual is retained in
        E4 and E7 rather than being incorrectly removed.
    - check: zero-run boundary
      result: PASS
      evidence: >-
        The RC-1 report states experiment_runs 0, no target/curve/JINV/
        transport/instrument access, and static formula propagation only.
  proof_architecture_checks:
    - check: applicability
      result: NOT_APPLICABLE
      reason: >-
        This is a static planning package and zero-run cost-chain check, not a
        theorem, reduction, asymptotic bound, or proof-oriented proposal.
  findings:
    - scope: J2
      disposition: REVISE
      defect: >-
        The producer runtime receipt records git.commit
        eff32192d03b29bef98e26a81be1a893326a6148, but that commit predates the
        RC-1 artifact commit and does not contain rc1-recompute.py,
        rc1-report.yaml, or runtime-session-receipt.json. The command therefore
        is not reproducible from the receipt's recorded commit alone. The
        receipt also points raw_machine_readable_result at /tmp/rc1-report.json;
        that JSON stdout is not among the snapshotted artifacts, while the
        YAML report is a separate representation rather than the retained raw
        stdout path.
      required_revision: >-
        Supply a superseding receipt or archive binding with a commit/worktree
        identity that actually binds the executed script and retain the raw
        machine-readable result under the declared artifact scope. Preserve
        the already verified numeric report; do not rerun or reinterpret it as
        scientific evidence merely to repair custody.
    - scope: J1
      disposition: PASS
      defect: none_found_in_static_binding_structure
      note: >-
        OBD-1 remains visibly open in the immutable preservation binding and is
        not silently rewritten. The historical opening decision is the separate
        interpretation record; this validator does not change either record.
  limitations:
    - >-
      No experiment was executed, no experiment run ID was created, and no
      scientific or hypothesis conclusion is supported or weakened here.
    - >-
      The snapshot receipt's commit_sha and parent_sha are null by its stated
      self-neutrality design. The supplied snapshot commit and first parent
      were verified directly, but no unavailable post-commit probe/binding was
      invented.
    - >-
      The exact upstream preservation-manifest.yaml obligation bytes were not
      opened because they are not among the exact snapshotted input paths used
      for this review; the package's binding structure and snapshot identity
      were checked instead.
    - >-
      This native Codex session had no task-scoped adapter model-probe receipt.
      The session's policy/model provenance and that absence are recorded in
      runtime-session-receipt.json; no probe result is asserted.
  no_scientific_claim: true
  verdict: incomplete
  scoped_verdict: REVISE
  joint_verdicts:
