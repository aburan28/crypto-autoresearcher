    quantity: residual retained-artifact bytes after setting the dominant replacement-pair term to zero
    observed_static_value: 219032804608
    units: bytes
    measurement_status: exact_zero_run_static_arithmetic_not_measurement
    error_bars: not_applicable_to_exact_integer_arithmetic
    source_scope: >-
      One frozen EXP-JINV-bd141d Phase B serialization upper-bound worksheet,
      under its declared caps and one-host static cost model. It is not a
      measurement of a mathematical object, implementation, machine, or ECDLP.
    supporting_static_records:
      - experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json retained_artifact_upper_bytes
      - planning-gate-2.yaml estimates.AR_1_residual_after_removing_the_dominant_term
      - planning-gate-2.yaml estimates.independent_arithmetic_checks_performed_by_this_session.new_in_this_gate[ARITH-9..ARITH-13]
    resource_check:
      examined: true
      reading: >-
        The same residual is a design constraint and a resource for a separately
        authorized representation/sharding analysis: it identifies the next
        static terms that must be modelled, while it does not close the lane or
        establish impossibility. Any distributed or sharded design must add its
        merge/communication model rather than treating the unsharded 3x figure
        as sufficient.
      spawned_ids: []
      status_effect: none

  narrowest_supported_statement: >-
    In the exact snapshotted static package, the authorization flags are
    fail-closed under the tested recursive scan and the known-false control is
    rejected, while an independent decomposition reproduces the dominant and
    residual byte terms. However, the package is not ready for a scoped PASS:
    its materialization precondition can be read as allowing missing host
    evidence, PB-3 lacks an explicit stop for unevaluable cost terms, and CT-1
    through CT-5 do not pre-register quantitative decision boundaries. These
    are procedural REVISE findings only. No scientific claim follows.

  next_concrete_action: >-
    Create a superseding static package revision that hard-fails the
    no-observation materialization branch, adds an unknown/unevaluable PB-3 stop,
    and gives every control an exact metric, cardinality/replicate plan,
    tolerance or effect-size rule, uncertainty treatment, and PASS/STOP decision.
    Re-run the known-false smuggled-authorization control and add the two static
    boundary controls before any further review or any implementation decision.

