    V2_admissibility_filter:
      status: completed
      methodology: >-
        Extracted `admissibility` (and `resource`/`resource_label`) from all
        27 records programmatically, then read the `admissibility_argument`
        field in full for every record whose value was not a plain
        `admissible`. Cross-checked each against H-ENDO-001's exact test
        (does the mechanism reduce to applying an endomorphism to points of
        G and nothing more?) and against DECOMPOSITION.md's own resource
        taxonomy (R4 -- the isogeny graph, acting on curves not points -- is
        explicitly named as escaping the filter, and T1 transport is the
        basis of half the campaign's lanes).
      finding: >-
        24 of 27 records are plainly `admissible`. Three carry compound
        self-invented status strings, none of which is schema-enforced:
        IDEA-20260811-319a07 (`admissible_with_a_caveat_stated_in_full`),
        IDEA-20260811-68fa90
        (`admissible_as_a_class_level_result_and_inadmissible_as_an_ecdlp_mechanism`),
        and IDEA-20260811-61ecae (`inadmissible_generic_group`). 319a07 and
        68fa90 both name their kernel/point-touching step explicitly and
        argue -- correctly, on this reviewer's independent read -- that it
        is not their whole content, so neither is a violation. NAMED PER THE
        HANDOFF'S "do not soften this" INSTRUCTION: IDEA-20260811-61ecae is
        the one record in the batch whose own text states that its online
        phase (steps 5-7) applies isogenies to points of G, and whose
        admissibility field begins with the word `inadmissible`. On this
        reviewer's independent reading, 61ecae does NOT meet the checklist's
        precise test ("reduces to applying an endomorphism to points of G
        AND NOTHING MORE") -- its deliverable is a two-sided
        (construction + matching lower bound) complexity argument about a
        preprocessing MODEL (R8/R4), of which the point-transport step is
        one ingredient, not the whole content, and the record's own
        admissibility_argument (part D of its claim) exhibits exactly the
        simulation that shows why this is a closure and not an attack. This
        is presented as a FINDING for Coordinator adjudication (see
        findings F-01 below), not as a hard V2 failure, because: (a) the
        letter of the standing constraint ("A proposal whose only use of phi
        is to apply it to points of G ... must not be filed") is in tension
        with a record whose SELF-LABEL uses the word "inadmissible" while
        being filed; (b) the record's content is a legitimate, transparently
        argued negative result of exactly the kind the campaign's closure
        standard (docs/inventor-protocol.md) asks for; (c) a stricter literal
        reading would also close half of lane L13's transport-based
        reasoning, which DECOMPOSITION.md's own T1/T5 machinery depends on.
        No other record in the batch is inadmissible on its face.
