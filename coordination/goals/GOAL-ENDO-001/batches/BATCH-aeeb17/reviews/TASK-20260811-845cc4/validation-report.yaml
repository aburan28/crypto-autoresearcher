        ad0ff7,b1b94c,d27383,d69ebe,d8ff09,e2accc,e6399d,e64549} -- corrected
        count: 6 of these lack a literal field but 5 carry the same content
        inline in interpretation_limits or falsification_conditions; only
        IDEA-20260811-b1b94c and IDEA-20260811-d8ff09 rely purely on prose)
