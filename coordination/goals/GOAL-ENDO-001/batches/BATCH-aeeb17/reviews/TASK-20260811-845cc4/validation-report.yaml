    V5_claim_discipline:
      status: completed
      methodology: >-
        Programmatic check across all 27: claim_tier == 'toy' (27/27) and
        sota_delta contains the word 'zero'/'ZERO' (27/27), dominated_by
        non-null and non-empty (27/27), each checked against a violation
        list that came back empty. HARDER VERSION: grepped all 27 files for
        exponent/speedup-implying phrases ("breaks ECDLP", "solves ECDLP
        in", "beats rho", "below rho", "faster than rho",
        "cryptographically relevant", "practical attack"); read every hit in
        its surrounding paragraph.
      finding: >-
        No violation. Every hit found is a CONDITIONAL or NEGATIVE statement
        rather than an assertion: IDEA-20260811-40c0b5's "solves ECDLP in
        time T ... yields an oracle-free ECDLP algorithm" is the antecedent
        of a simulation theorem proving Direction-2 can never be a source of
        a break (a closure, stated as "FORALL ... THERE EXISTS"), not a
        claimed break. IDEA-20260811-ae0f6f's "index calculus beats rho ...
        iff rho(the ratio) decays as a negative power of N" is an explicit
        biconditional defining a measurable criterion, with the record's own
        measurement (Theta(N^{(m-1)/2}), landing exactly ON the birthday
        threshold) showing the antecedent does not currently hold.
        IDEA-20260811-319a07's "sub-exponential ... IF a polynomial-time
        algorithm existed" (D5) is explicitly flagged in the record itself as
        "a CONDITIONAL whose antecedent this record argues is false" and is
        additionally covered by the record's own p2_p3_flags (below).
        dominated_by is checked in every deep-reviewed record against the
        declared frontier (parallel rho at 0.886*sqrt(N), O(1) memory;
        automorphism-discounted rho at <= sqrt(6); BSGS) and is populated
        honestly, never `null`.
    V6_p2_p3_routing:
      status: completed
      methodology: >-
        Extracted the `p2_p3_flags`/`pause_flags` field (or, where absent,
        grepped `interpretation_limits` and `falsification_conditions` for
