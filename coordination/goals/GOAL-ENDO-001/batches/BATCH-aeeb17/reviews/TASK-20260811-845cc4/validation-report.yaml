  findings:
    - id: F-01
      severity: medium
      file: ledger/proposals/IDEA-20260811-61ecae.yaml
      field: idea.admissibility
      description: >-
        The record's own admissibility value ("inadmissible_generic_group")
        uses the word "inadmissible" for a record that was filed, while the
        batch's standing constraint states "A proposal whose only use of phi
        is to apply it to points of G is INADMISSIBLE ON ITS FACE and must
        not be filed." The record's admissibility_argument explains that its
        online phase does apply isogeny transport to points of G, but argues
        this is not its "only use" of phi and that the record's constructive
        half (a matching upper and lower bound on a preprocessing model) is
        what earns it a place in the corpus. This reviewer's independent
        reading concurs the record does not meet the checklist's precise
        test ("and nothing more") and is a legitimate closure, but the
        terminology is confusing enough, and the standing constraint's letter
        strict enough, that it should not be adjudicated by a reviewer alone.
      what_would_settle_it: >-
        A Coordinator ruling on whether "inadmissible on its face" gates
        FILING (in which case 61ecae's self-label is itself a disclosed
        near-violation the Coordinator must rule on explicitly) or
        characterizes a MECHANISM's relationship to H-ENDO-001 (in which case
        self-flagging while filing is correct as done here). Either way, a
        recommendation: future batches should use a strict binary
        admissible/inadmissible value with all nuance moved to
        admissibility_argument, to avoid a status string that reads as
        self-contradicting at a glance.
    - id: F-02
      severity: high
      file: ledger/proposals/IDEA-20260811-68fa90.yaml
      field: idea.pause_flags, idea.claim (B), idea.target_complexity
      description: >-
        The record extracts a vectorization-with-preprocessing algorithm for
        the Cl(O)-torsor group action, S*T = Otilde(h) unconditionally and
        S*T^2 = Otilde(h) conditional on HB-2, which it states beats the
        sqrt(h) meet-in-the-middle baseline for that (non-ECDLP) problem. The
        record self-flags this "by analogy with P3, not under it" and states
        no ECDLP excess anywhere; this reviewer independently confirmed the
        record's own target_complexity states the ECDLP exponent is
        unchanged at 1/2 and sota_delta against ECDLP is exactly zero "by
        part (D), which is a derivation." novelty_status is `unverified`
        because external literature (where a landmark/hitting-set
        preprocessing construction for a group action is a natural idea that
        may already be published) could not be checked this session.
      what_would_settle_it: >-
        The independent review-adversarial session the record itself
        requests, specifically checking: (a) whether the S*T=Otilde(h)
        unconditional construction is already published (this validator
        cannot check external literature -- see NOT COMPLETABLE below); (b)
        whether HB-2 (the conditional half) is sound; (c) whether the
        vectorization-speedup framing, even though scoped away from ECDLP by
        transport theorem T1/T2 per IDEA-20260811-d8ff09's identical
        reasoning, should itself be treated as P2/P3-adjacent by the
        Coordinator given it concerns the same class-group action structure
        H-STR-002 and DEFER-BATCH009-001 bear on. Recommend this specific
        record be named explicitly in the Coordinator's adjudicating
        decision rather than resolved by silent inclusion in a batch
        approval.
    - id: F-03
      severity: low
      file: five idea-report.yaml files under coordination/.../tasks/*/
      field: (schema, top-level keys)
      description: >-
        The five task-level idea-report.yaml files use inconsistent field
        names for the same content across producers: TASK-20260811-5ff234 and
        TASK-20260811-6ca12c use `ids: {filed: [...], left_unused: [...]}`,
        while the other three use flat `ids_filed`/`ids_unused` lists. All
        five are internally well-formed YAML and all five carry the required
        content (filed ids, unused ids, rejected objects, novelty screen
        performed, honest accounting), so this is a schema-consistency
        observation, not a defect that blocks review.
      what_would_settle_it: >-
        A Coordinator note in a future handoff pinning the idea-report.yaml
        field names, so a future automated dispatch-plan check can verify
        idea-report completeness programmatically rather than by manual read.

  batch_coverage_hypothesis_assessment:
    hypothesis_under_review: >-
      BATCH-CARD.md section 1's pre-registered claim: "The fourteen lanes are
      indexed by RESOURCE (R1-R8) applied to a single curve's ECDLP instance.
      Generation has therefore been dense in 'resource x one curve's point
      group' and sparse in objects the indexing cannot express."
    assessment: >-
      SUPPORTED, on the novelty-screen evidence reviewed. The 27 filed
      records' central objects genuinely fall outside the R1-R8-on-one-curve
      frame the 146-record corpus was dense in: the torsor coordinate X_m
      and the ray class group Cl_m(O) (319a07); the landmark table / advice
      structure on a whole isogeny class (61ecae, 68fa90); the
      answer-branching entropy of an oracle transcript (a343de); the
      rational-point count of the Semaev variety itself, rather than a
      solver-measured proxy for it (04a75a); the twist pair and shared
      x-line as an object (01a208); the Drinfeld-module exponent-ring
      structure (e2accc). For a large majority of these, the internal grep
      screens found ZERO or near-zero prior hits for the central mechanism
      -- independently confirmed for the 9 deep-reviewed records, where this
      reviewer re-ran or spot-checked the cited grep patterns' plausibility
      against the corpus's known content rather than trusting the reported
      counts. HOWEVER, per the constraint's own instruction to "say so
      plainly": the CONCLUSIONS these new objects support are overwhelmingly
      closures and negatives (matching DECOMPOSITION.md section 5's own
      pre-registered prediction that the campaign's most likely genuine
      deliverable is a negative), not live mechanisms. Of 27 records, zero
      claim a live attack-relevant mechanism; the two most "positive" results
      in the batch (61ecae's tight non-separation with a matching bound, and
      68fa90's vectorization-only speedup) are both explicitly scoped away
      from ECDLP and both self-flagged for independent review. So: the
      coverage hypothesis is confirmed in the narrow sense (new objects were
      found, the axes were not merely relitigating the existing 146 in new
      language), but the batch does NOT reopen the campaign's overall
      trajectory toward negatives -- if anything it adds two more
      well-argued closures (L10's folk-obstruction correction in 319a07, and
      the ordinary-shadow-of-the-exemplar closure in d8ff09) to that
      trajectory, plus one genuinely new theory instrument
      (a343de's entropy-floor closure criterion) that the Coordinator may
      find has standing value independent of any ECDLP claim.

