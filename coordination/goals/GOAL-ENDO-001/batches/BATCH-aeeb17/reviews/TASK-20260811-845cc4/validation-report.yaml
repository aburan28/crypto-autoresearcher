        for "H-STR-002", "phi-stable", "factor base", "automorphism-discounted"
        to independently find any candidate P2/P3-bearing record the
        author might have missed.
      finding: >-
        No P3 violation (no record STATES an excess over the
        automorphism-discounted rho baseline for ECDLP) and no unflagged
        P2-adjacency found. One record requires explicit Coordinator
        attention and is the single most consequential routing item in the
        batch: IDEA-20260811-68fa90 self-flags, in a custom `pause_flags`
        field ("FLAGGED FOR INDEPENDENT REVIEW BEFORE ANY PROMOTION, BY
        ANALOGY WITH P3 AND NOT UNDER IT"), that its part (B) appears to beat
        the sqrt(h) meet-in-the-middle baseline for the group-action
        vectorization DLP (a DIFFERENT problem from ECDLP: online exponent
        1/4 -> 1/6 at advice p^{1/3}, unconditional). This reviewer
        independently confirmed: (a) the record's own target_complexity
        states "ECDLP time exponent: UNCHANGED AT 1/2, and nothing in this
        record touches it"; (b) sota_delta is stated against ECDLP as
        "exactly zero, by part (D)"; (c) the exponents given ARE stated in
        the record (not withheld), which the record itself justifies as
        necessary "without them there is no claim to review" while affirming
        "it states no ECDLP excess anywhere." This is the correct handling
        of a baseline-adjacent-but-not-ECDLP result under the letter of P3
        (which is scoped to ECDLP / the rho baseline) -- but it is exactly
        the kind of candidate the Coordinator should route to an independent
        review-adversarial session before any promotion, per the record's
        own request. Flagged here as finding F-02. IDEA-20260811-319a07
        similarly self-flags a conditional branch (D5, and Prediction 3) as
        "P3: FLAGGED AS ADJACENT, NOT TRIGGERING," correctly handled.
    V7_fact_claims:
      status: completed_for_A1_seed_partial_for_the_rest
      methodology: >-
        Independently re-derived, by hand, the two elementary facts the A1
        seed hinges on: (i) the isomorphism C_d: d*y^2=f(x) -> short
        Weierstrass Y^2=X^3+a*d^2*X+b*d^3 via (x,y)->(d*x,d^2*y) -- verified
        by direct substitution: Y^2 = d^4*y^2 = d^4*f(x)/d = d^3*f(x) =
        d^3*x^3+a*d^3*x+b*d^3 = (dx)^3+a*d^2*(dx)+b*d^3 = X^3+a*d^2*X+b*d^3,
        confirming X=d*x, i.e. the twist's x-coordinates in the STANDARD
        short-Weierstrass model are d times the original curve's, so the
        x-lines coincide LITERALLY only in the non-standard model d*y^2=f(x),
        exactly as IDEA-20260811-01a208 claim (A) and the batch's disclosed
        seed correction state. (ii) IDEA-20260811-04a75a's point-count
        identity a_1(a_1-1) + b_1(b_1-1) = 2p^2+2t^2-2p for a_1=p-t, b_1=p+t
        -- independently expanded: (p-t)(p-t-1)+(p+t)(p+t-1) =
        [p^2-2pt+t^2-p+t] + [p^2+2pt+t^2-p-t] = 2p^2+2t^2-2p, confirming the
        record's claimed main term (p^2-p+t^2) after dividing by 2. Both
        check out exactly. Also read the A1 task report's own
        `seed_verification` block (idea-report.yaml) and confirm it reaches
        the identical conclusion, independently derived by this reviewer
        before reading it: the seed as literally stated in the handoff is
        FALSE in the standard short-Weierstrass model and TRUE only in
        d*y^2=f(x), and both A1 filed records (01a208, 04a75a) state this
        correction explicitly rather than silently building on the false
        literal reading.
      finding: >-
        A1's specific mandated fact-check is VERIFIED CORRECT: the axis
        neither naively accepted the handoff's seed nor silently ignored it,
        but refined it precisely and used the refined (correct) version
        throughout. This is the named deliverable the handoff asked for and
        it is satisfied. Beyond the mandated A1 seed check, this reviewer
        additionally spot-verified two further [fact] claims independently
        (the isomorphism in mechanism 61ecae/a343de's Shoup-pigeonhole
        argument was read for internal consistency, not re-derived from
