    V4_controls_and_falsifiability:
      status: completed
      methodology: >-
        Confirmed `controls`, `minimal_test`, and `falsification_conditions`
        are non-empty for all 27 records programmatically. Read the controls
        in full for the 9 deep-reviewed records and spot-checked the rest.
      finding: >-
        Every record that measures anything carries at least one MATCHED
        NULL (a same-shape object designed to fail the same test), and
        several carry an unusually complete battery: e.g.
        IDEA-20260811-61ecae's four controls (matched random-regular-graph
        null, a cycle-graph negative control, a planted-signal positive
        control, and an L=h identity-arm overhead control);
