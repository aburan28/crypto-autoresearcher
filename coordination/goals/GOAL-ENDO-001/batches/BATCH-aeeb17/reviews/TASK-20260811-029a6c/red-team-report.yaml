      735c6b's Claim 1 (independently re-derived, confirmed correct) is
      itself the most important cost-model challenge in the batch and this
      review adopts it rather than duplicating it: the CGK preprocessing
      frontier's full cost is monotonically minimized at the no-advice
      corner, so no L13 record built on that frontier (61ecae, 68fa90,
      7d4f62, and the corpus's earlier a127ab/a2fb45/ea3915) can beat rho
