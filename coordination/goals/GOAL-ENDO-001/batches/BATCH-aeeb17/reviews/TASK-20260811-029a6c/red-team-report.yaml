  claim_under_review: >-
    The 27 IDEA-20260811-* records filed by BATCH-aeeb17's five
    idea-generator producers at snapshot c3127ebfd, per the task handoff's
    R1-R7 checklist, with the Coordinator's own five named "headline results"
