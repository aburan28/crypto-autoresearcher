  # =====================================================================
  # Objections / findings, with severity, target, and settle criteria
  # =====================================================================
  objections:
    - id: F-01
      severity: major_curable_by_scope_correction
      target: >-
        ledger/proposals/IDEA-20260811-61ecae.yaml, claim block (C) ("THE
        INEQUALITY THAT IS THE RESULT...holds at EVERY point of the
        frontier") and claim block (F) ("THE CRITICALITY OBSERVATION...gamma
        = o(1) always"), fed by heuristic_assumptions.HA-2; propagates into
        ledger/proposals/IDEA-20260811-735c6b.yaml claim (E) ("Claim 4"),
        which reuses "h = N^{1/2+o(1)}" without re-deriving it.
      objection: >-
        HA-2 states "h = h(D) = |D|^{1/2+o(1)} = N^{1/2+o(1)}", and its
        rigorous_support text asserts "|D| = 4p - t^2 = Theta(p) = Theta(N)
        away from the endpoints" as though automatic. It is not: the record's
        own stated assumptions require only N > 4*sqrt(p) (needed for a
        unique order-N subgroup), which permits N as small as p^{1/2+eps}, a
        regime nowhere near Theta(p). Write N = p^{1-delta} for cofactor
        exponent delta = 1 - log(N)/log(p) in [0, 1/2). Since h ~ p^{1/2}
        (fact, away from the Hasse endpoints) and the record writes h =
        N^{1/2+gamma}, algebra gives gamma = delta / (2(1-delta)), which is 0
        only at delta=0 (near-prime-order curves) and grows to 1/2 as delta
        approaches its own permitted ceiling of 1/2. Re-deriving part (C)'s
        central inequality with this substituted: L <= S_DL becomes tau <=
        1/2 - gamma rather than tau <= 1/2. CONCRETE EXAMPLE: a curve with N
        ~ p^{0.7} (cofactor ~p^{0.3}, satisfying the record's own N >
        4*sqrt(p) requirement with margin) has gamma ~ 0.214, so the "free"
        region of the frontier the record claims holds "at EVERY point"
        shrinks from (0, 1/2] to (0, ~0.286] -- the top third of the claimed
        frontier is NOT free under this record's own construction. At the
        boundary of the record's own admissibility (N approaching
        p^{1/2+eps}), gamma approaches 1/2 and the construction's advantage
        collapses to nothing anywhere on the frontier.
      what_would_settle_it: >-
        Add an explicit scope condition (N = p^{1-o(1)}, equivalently
        bounded cofactor) to the assumptions block and restate part (F)'s
        "not by design" claim conditionally on it; OR derive gamma as an
        explicit function of the cofactor exponent and show the achievability
        construction and the matching lower bound (D) both still cancel for
        the FULL range N > 4*sqrt(p) the record's assumptions currently
        permit (this review did not find a way to make that work and did not
        exhaustively search for one). Either fix is pure derivation, zero
        compute.
      severity_note: >-
        This narrows, and does not refute, the mechanism. The achievability
        construction (B)/(C) and the matching lower bound (D) both appear
        internally sound for tau <= 1/2 - gamma under the corrected
        dependency; "keep the narrowest valid conclusion when a candidate
        fails" per this role's operating rules.

    - id: F-02
      severity: minor_already_substantially_self_corrected
      target: >-
        ledger/proposals/IDEA-20260811-319a07.yaml, title and claim (D1)
        ("the folk obstruction...is FALSE").
      objection: >-
        The title and claim (D1) assert the corpus's "curves and points are
        different objects" obstruction is categorically FALSE, which is
        substantially more dramatic than the record's own D5 disclaimer ("No
        such algorithm is proposed here and the record's own prediction is
        that none exists") and its zero sota_delta / zero new computational
        capability. The dramatic framing propagated uncritically into the
        Coordinator's snapshot commit message ("the folk obstruction is
        FALSE") -- exactly the kind of headline that risks being cited
        without its qualifiers in a later synthesis.
      what_would_settle_it: >-
        Already substantially settled downstream, not by this review: commit
        f0589402 (RQ-RAYCL-3985f4, opened from this record after c3127ebfd
        and before this review returned) independently states the same
        deflationary reading as its own EXPECTED outcome (T1). No further
        action required beyond a Coordinator synthesis that quotes D3/D5
        alongside any future citation of the "folk obstruction is FALSE"
        headline. Downgraded from what would otherwise be a major finding
        because the correction the finding would demand has already, in
        substance, been made in the one downstream record that acted on it.

    - id: F-03
      severity: minor_batch_internal_duplication_risk
      target: >-
        ledger/proposals/IDEA-20260811-e6399d.yaml claim (D) ("the
        obstruction, named...a torsor admits no index calculus") versus
        ledger/proposals/IDEA-20260811-319a07.yaml claim (D3) ("the
        coordinate obstruction, named...computing psi IS the ECDLP").
      objection: >-
        Both records present themselves as independent obstructions reaching
        a consistent conclusion via "different arguments" (e6399d's own
        why_not_a_renamed_known_approach block says the two obstructions "are
        independent" and neither implies the other). On inspection both rest
        on the same underlying fact: the map connecting curve-side
        (class-group / index-calculus-decomposable) data to point-side (the
        value of k) data is exactly the ECDLP-solving map, whichever name it
        is given (psi in 319a07, the missing "effective coordinate map c" in
        e6399d). e6399d's "a torsor has no monoid, hence stage (iv) of index
        calculus cannot be expressed" is one instantiation of "the connecting
        map is uncomputable except via Pohlig-Hellman", not obviously a
        second, independent argument for it.
      what_would_settle_it: >-
        Check whether e6399d's obstruction survives if 319a07's specific
        coordinate map psi were shown computable by some route OTHER than
        Pohlig-Hellman -- if e6399d's "no monoid" argument would then also
        collapse, the two are the same fact in two vocabularies and should be
        cross-referenced as such rather than filed as independent closures;
        if e6399d's argument survives that hypothetical, it is genuinely
        independent and the batch should say so more strongly than
        "orthogonal questions".

    - id: F-04
      severity: informational_axis_scope
      target: >-
        Axis A4 as a whole (IDEA-20260811-{a343de,ad0ff7,ae0f6f,b1b94c,
        d27383,a28c44}.yaml), relative to BATCH-CARD.md section 1's
        pre-registered coverage hypothesis.
      objection: >-
        All six A4 records are internally rigorous and mutually cross-
        referential (a good sign of a coherent sub-program), but every
        mechanism is generic-group-model proof technique with no dependence
        on endomorphisms, isogenies, or CM structure -- the same theorems
        would apply verbatim to an augmented-GGM DLP on any prime-order
        group. This makes A4 the axis least clearly responsive to the
        batch's own stated hypothesis that generation has been "sparse in
        objects the [resource] indexing cannot express" for reasons specific
        to THIS campaign's central objects.
      what_would_settle_it: >-
        A Coordinator note stating explicitly whether A4's oracle-entropy
        instruments are considered part of the endomorphism/isogeny-specific
        corpus (in which case the batch's coverage claim for A4 should be
        revised downward) or a general-purpose GGM toolkit that happens to be
        filed under this campaign's L12 audit lane for lack of a better home
        (a legitimate placement, but a different claim than "reached a new
        axis").

    - id: F-05
      severity: informational_positive_finding
      target: >-
        ledger/proposals/IDEA-20260811-735c6b.yaml, Claim 1, cross-checked
        against ledger/proposals/IDEA-20260811-61ecae.yaml,
        IDEA-20260811-68fa90.yaml, IDEA-20260811-7d4f62.yaml.
      objection: (not an objection; recorded as a positive finding per this role's mandate to credit what survives attack)
      argument: >-
        735c6b's Claim 1 (full cost on the CGK frontier S*T^2=N is minimized
        at the no-advice corner) was independently re-derived by hand in this
        review and is correct: full cost >= S*T = N/T is strictly decreasing
        in T, so it is minimized at the largest admissible T = Theta(sqrt(N))
        with S = Theta(1), reproducing plain rho exactly. This is a genuine,
        citable, batch-internal self-correction that substantially deflates
        the practical (not model-theoretic) significance of the whole A3
        headline result, and it was produced by the SAME batch rather than by
        this review -- worth crediting as evidence against the R7
        "make-work" reading, not only as a caveat on 61ecae.
      what_would_settle_it: n/a; recorded as confirmed and correct.

