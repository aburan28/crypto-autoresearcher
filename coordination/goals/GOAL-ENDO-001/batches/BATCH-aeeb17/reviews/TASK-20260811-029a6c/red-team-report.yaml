        field analogues (e2accc, e64549), and the ordinary shadow of the
        p^{1/3+o(1)} exemplar (d8ff09) all engage objects genuinely outside
        the one-curve resource indexing. This axis's records are also the
        most consistently well-scoped of the batch (see per-record verdicts).
    overall_saturation_reading: >-
      MIXED, STATED PLAINLY AS THE HANDOFF ASKS. Three of five axes (A2, A3,
      A5) demonstrably reached objects the fourteen-lane index does not
      express. Two of five (A1, A4) look substantially closer to "existing
