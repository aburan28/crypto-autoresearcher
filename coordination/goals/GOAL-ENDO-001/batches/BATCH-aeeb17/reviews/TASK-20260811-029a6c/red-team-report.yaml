  counterexample_or_mutation: >-
    THE CHEAPEST DECISIVE CHECK FOUND IN THIS REVIEW, zero compute, already
    performed by hand: for IDEA-20260811-61ecae, compute gamma = delta /
    (2*(1-delta)) where delta = 1 - log(N)/log(p), for a curve satisfying the
    record's own stated admissibility (N > 4*sqrt(p)) but with a non-trivial
    cofactor, e.g. N ~ p^{0.7} (delta = 0.3). This gives gamma ~ 0.214, so the
    record's own frontier inequality L <= S_DL (equivalently tau <= 1/2)
    becomes tau <= 1/2 - gamma ~ 0.286: the top third of the claimed "free at
    every point of the frontier" region is not free for this admissible
    curve. This is cheaper than the record's own `minimal_test` Stage 0
    (which checks only the landmark/DL-entry bit-unit cancellation and never
    examines the N-vs-p dependency HA-2 smuggles in) and Stage 1 (toy
    compute). It does not refute the mechanism -- the achievability
    construction and matching lower bound both still appear to cancel
    correctly once tau is restricted to (0, 1/2 - gamma] -- so the correct
    reading is a scope narrowing (F-01), not a kill.

  baseline_comparison:
    correct_baselines_for_this_regime:
      - "Parallel Pollard rho with distinguished points: 0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006). Every record's dominated_by field cites this correctly."
      - "Automorphism-discounted rho on CM curves: 0.886*sqrt(N/|Aut|), bounded by a further sqrt(6) (KN-TECH-018) -- correctly treated as baseline calibration, never an exponent, in every record checked; no P3 violation found anywhere in the 27 records or in the field survey."
      - "BSGS: sqrt(N) time and memory, N^{2/3+o(1)} full cost (KN-TECH-031, KN-TECH-035) -- correctly cited where relevant (A4's degree-charging records, 735c6b)."
      - "Corrigan-Gibbs-Kogan generic-group preprocessing, S*T^2 = Omega~(eps*N) (KN-LIT-013) -- correctly quoted by 61ecae/68fa90/735c6b/7d4f62; the record this review checked most closely (735c6b) additionally supplies the Wiener full-cost repricing that shows this frontier itself is dominated by rho."
      - "Van Oorschot-Wiener time-memory interpolation and the AT^2 lower bound -- correctly deferred to 735c6b by 61ecae rather than silently assumed away; this review confirms that deferral was honored."
