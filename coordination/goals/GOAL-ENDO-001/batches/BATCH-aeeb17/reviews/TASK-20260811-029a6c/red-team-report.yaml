      note: >-
        Ray class groups Cl_m(O)/Cl_n(O) acting on curve-POINT PAIRS
        (319a07, e6399d's companion object) and the quantifier-lattice
        pricing of L10 reductions (503098, 40c0b5) are genuinely outside the
        one-curve resource framing; the object indexed is a joint curve x
        point structure, not a resource applied to one curve's group.
