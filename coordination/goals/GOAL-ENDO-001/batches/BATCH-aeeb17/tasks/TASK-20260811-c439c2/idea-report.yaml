  ids_filed:
  - id: IDEA-20260811-a28c44
    short: >-
      FB-GGM: the forward/backward generic group model; Theorem FB-1 shows free
      unlimited point CREATION (unknown discrete log, arbitrary label predicate)
      preserves the bound at (g+s+2)^2/N, so the index-calculus escape is not in
      factor-base construction. Requests an R1 split (fwd/bwd) and a new
      taxonomy entry R9 (relation discovery).
    class: mechanism
    resource: R1 audited and split; new entry R9 requested
    priority: high
  - id: IDEA-20260811-a343de
    short: >-
      The answer-branching floor: a SIMULATOR-FREE closure criterion. Any oracle
      emitting o(log_2 N) bits total is closed at exponent 1/2 without
      exhibiting a simulator; the floor log_2 N - O(1) is achieved to within
      O(m log m) bits by one arity-m decomposition query over a known-log base.
      Two-sided, so the boundary is located rather than bounded.
    class: mechanism
    resource: none (audit)
    priority: high
  - id: IDEA-20260811-ad0ff7
    short: >-
      The weakest non-simulable oracle returns ONE BIT: an arity-graded
      single-bit decision oracle breaks the bound in m*L queries by a
      search-to-decision reduction, so the witness is superfluous; and one bit
      total non-adaptively provably cannot, so the load-bearing feature is
      adaptivity in the target, not answer width.
    class: algorithm
    resource: R1
    priority: medium
  - id: IDEA-20260811-ae0f6f
    short: >-
      The Bezout fixed point: exact crossover inequalities C < N^{(m-1)/2}
      (known-log base) and C < N^{(m-3)/4} (unknown-log base), and at the naive
      cost C = L^{m-1} the known-log method costs Theta(sqrt(N)) EXACTLY for
      every arity. Reduces the campaign to one measurable scalar - the
      search-space efficiency C/L^{m-1} and its exponent in N.
    class: mechanism
    resource: R1 (R2 explicitly not load-bearing)
    priority: high
  - id: IDEA-20260811-b1b94c
    short: >-
      Instance rigidity: the rigidity profile r(q) = min(q,2) for any concrete
      instance versus r(q) = q for Shoup's random injection, closing the whole
      "structured labeling" family of model refinements with a named
      obstruction, and giving the forward exponent 5/2 for curve-randomised
      models via h(O) about p^{1/2}.
    class: control
    resource: none (audit)
    priority: medium
  - id: IDEA-20260811-d27383
    short: >-
      The degree ceiling: degree doubles per multiplication and is capped at p,
      so the entire degree-charging lower-bound family (polynomial
      interpolation, generic ring model) certifies at most O(log N) operations
      and can never be the R1-fitted analogue of Shoup. Excludes AOM_d
      explicitly. Forward pointer: non-scalar multiplicative complexity, with a
      tiny-scale two-directional measurement attached.
    class: mechanism
    resource: R1 (audits the R1-fitted model family)
    priority: medium

