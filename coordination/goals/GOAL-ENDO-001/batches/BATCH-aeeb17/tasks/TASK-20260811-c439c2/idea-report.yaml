        DECOMPOSITION.md section 2.
    taxonomy_amendment_requested:
      requested_by: IDEA-20260811-a28c44
      request: >-
        Split R1 into R1-fwd (coordinate read-out, closed by
        IDEA-20260807-070d03) and R1-bwd (point creation from field data, closed
