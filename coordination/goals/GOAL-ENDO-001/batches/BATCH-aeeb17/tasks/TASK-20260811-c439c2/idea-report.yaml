  rejected_candidate_objects:
  - object: The existential width Z of an oracle's candidate set
    reason: >-
      PRIOR ART, IDEA-20260807-7270d1, which defines Z, proves the Z/N per-query
      simulator error bound, states the criterion q*Z = o(N), and computes Z for
      every verdict on the books. Declared off-limits as a primary lens for this
      session per inventor-protocol section 1. It is CITED throughout and two
      records (a343de, ad0ff7) state their exact relationship to it, including a
      concrete oracle on which the Z criterion and the entropy criterion give
      different answers.
  - object: The factor-base membership bit b(R) = [x(R) in S]
    reason: >-
      PRIOR ART, IDEA-20260807-070d03, which adjudicates it as (N-weak)
      non-simulable but self-computable, verdict PUB, and derives the arity-1
      cost N/(2 sqrt(L)) with optimum sqrt(N)/2. Off-limits as a primary lens.
      Used as the m = 1 baseline slice of ae0f6f.
  - object: The algebraic degree d of the variety defining an oracle (AOM_d)
    reason: >-
      PRIOR ART, IDEA-20260806-530fdd / H-AOM-8d4a83. Off-limits as a primary
      lens. d27383 EXPLICITLY EXCLUDES it from its closure and verifies the
      exclusion as a blocking stage, because AOM_d charges the simulator and the
      closure concerns charging the adversary.
  - object: The adjudication decision tree / verdict alphabet for L12
    reason: >-
      PRIOR ART, IDEA-20260807-63056d and IDEA-20260807-5ddd98 (procedure and
      four-quadrant control catalogue). Off-limits. Its Q0 signature-freeze
      discipline is USED by three of this batch's records as a stated dependency.
  - object: The four-cell oracle-framing dichotomy (simulable / self-computable)
    reason: >-
      PRIOR ART, IDEA-20260807-5876b8. Off-limits as a primary lens. b1b94c
      operates in its neighbourhood and declares the overlap rather than hiding
      it.
  - object: >-
      The unordered pair {x(P+Q), x(P-Q)} on the Kummer line E/{+-1}, tracked
      through a walk
    reason: >-
      REJECTED ON THE LOSSY-PROJECTION TEST, and it is the exact shape of the
      inventor protocol's own cautionary example (KN-LIT-7595's
      (Delta, Pi) = (x xor y, x*y)). The pair DOES propagate -- x(P+Q) and
      x(P-Q) are the two roots of a quadratic whose coefficients are rational in
      x(P), x(Q) -- so the projection is compatible with the operation, but the
      compatibility is two-valued: following q steps produces 2^q branches, and
      resolving the branch requires exactly the y-coordinate information the
      projection discarded. So it is lossy, it propagates, and it propagates
      USELESSLY. Rejected before any experiment, at zero cost, which is what the
      test is for.
  - object: >-
      The Maurer-style label-free generic model versus Shoup's labeled model, as
      a separation axis for curve-structured problems
    reason: >-
      REJECTED AS NOT CURVE-SPECIFIC AND AS MOVING NOTHING. The distinction
      concerns whether the adversary manipulates handles or labels; both models
      give exponent 1/2 for DLP, and the difference does not interact with any
      resource in R1-R8. It is also the one place in this session where an
      external ingredient would most likely exist, and web search was
      unavailable, so the honest disposition is a rejection with a
      re-examination note rather than a speculative filing. RECOMMENDED FOLLOW-UP
      for a session with web access: check the label-versus-no-label separation
      literature and log anything relevant to knowledge/literature/ (this task's
      write_scope did not permit writing there).
  - object: >-
      Preprocessing / advice-string generic bounds (Corrigan-Gibbs-Kogan,
      Bernstein-Lange, AT^2) applied to the L12 boundary
    reason: >-
      OUT OF LANE BY BATCH DESIGN. That is axis A3 (TASK-20260811-f58f22, lane
      RQ-MTGT-2cabee) and this task must not adjudicate it. a343de's method
      ceiling explicitly declares the preprocessing regime outside its scope and
      says why (the k-set is not uniform on a single N and the pigeonhole must be
      restated per instance). b1b94c passes a QUANTITATIVE pointer to A3 -- the
      rigidity profile rises from 2 to 5/2 under curve randomisation, the +1/2
      being exactly log_N h(O) -- as a pointer and not as a claim.
  - object: >-
      Random self-reducibility of the DLP as a simulability certificate
    reason: >-
      REJECTED AS KNOWN AND AS YIELDING NO SEPARATION. Worst-case to average-case
      self-reducibility of the DLP is classical, holds in both the generic and
      the real model, and therefore separates nothing; it would be a renamed
      known approach in the exact sense agents/idea-generator.md prohibits.
  - object: >-
      A quantum-oracle separation (which curve-structured oracles admit an
      efficient quantum simulator)
    reason: >-
      OUT OF SCOPE FOR THIS CAMPAIGN. GOAL-ENDO-001 and DECOMPOSITION.md are
      classical throughout, no lane covers quantum adversaries, and a proposal
      there would have no lane of record and no baseline in the program's
      frontier rows. Noted so that its absence is a decision rather than an
      oversight.
  - object: >-
      "Structured labeling" refinements of Shoup's model (give the labels
      algebraic structure and re-prove the bound)
    reason: >-
      GENERATED, THEN CLOSED RATHER THAN FILED AS A PROPOSAL. This was the most
      obvious response to the axis's "the right MODEL" brief and it does not
      work: instance rigidity caps the completion count at the instance count.
      Rather than discarding it silently, the closure was filed as
      IDEA-20260811-b1b94c with its obstruction named, its argument written, and
      three surviving classes identified with numbers - which is the
      inventor-protocol section 4 standard and the reason it appears here as both
      a rejection and a record.
  - object: >-
      Degree-charging models for R1 (polynomial interpolation, generic ring
      model)
    reason: >-
      SAME DISPOSITION: generated as the second most obvious answer to the
      "right model" brief, closed by the degree ceiling, and filed as the closure
      IDEA-20260811-d27383 with its obstruction (degree doubles per
      multiplication), its witness (X^{p-1}), its exclusion (AOM_d), and its
      surviving class (non-scalar multiplicative complexity) with a tiny
      measurement attached.

  p2_p3_flags:
    p2_phi_stable_factor_bases:
      raised: false
      argument: >-
        NO RECORD IN THIS TASK USES ANY EQUIVARIANCE PROPERTY OF ANY FACTOR BASE.
        IDEA-20260811-ae0f6f and IDEA-20260811-ad0ff7 are the only two records
        in which a factor base appears at all, and in both the base is
        ARBITRARY: ae0f6f's derivation uses only its cardinality L, and ad0ff7's
        reduction is proved FORALL bases with the universal quantifier written
        first and an unknown-log null control designed to make that visible. The
        mechanism H-STR-002's weaken (DEC-20260727-009) concerned equivariance of
        a phi-stable base; the mechanism used here is a cost balance against a
        combinatorial count for any base whatsoever, which the weaken did not
        touch. DEFER-BATCH009-001 remains open and unretracted and nothing in
        this task discharges, supports, weakens or restores H-STR-002.
        THE JUDGEMENT IS FLAGGED FOR THE COORDINATOR TO ROUTE rather than
        assumed: because the object is a factor base, a reviewer may disagree,
        and ae0f6f's interpretation_limits records that if so, pause condition P2
        applies and the record waits.
    p3_automorphism_discounted_baseline:
      raised: false
      argument: >-
        NO RECORD STATES ANY COST BELOW THE AUTOMORPHISM-DISCOUNTED RHO BASELINE,
        AND NONE IS IMPLIED. IDEA-20260811-ae0f6f derives EQUALITY with the
        birthday bound at the naive decomposition cost (Theta(sqrt(N)), and a
        strict Pareto LOSS once its sqrt(N) memory is charged), never anything
        below it, and its crossover statements are conditionals whose antecedents
        are not known to hold. IDEA-20260811-ad0ff7's sub-birthday numbers are
        QUERY counts against an oracle that is free by assumption, and the record
        requires the oracle's implementation cost to be quoted beside every one
        of them.
        THREE RECORDS CARRY EXPLICIT P3 HANDLING INSTRUCTIONS for measurements
        that could later engage the condition: ae0f6f (a measured search-space
        efficiency exponent below -0.05), a28c44 (a measured generic
        relation-finding exponent below 0.40), and d27383 (a measured non-scalar
        shortcut in the ECDL interpolation polynomial). In each case the
        instruction is to FLAG, STOP, AND HAND TO THE COORDINATOR for an
        independent review-adversarial session, and NOT to state the excess in
        any record. KN-TECH-018's sqrt(6) is treated as baseline calibration and
        never as an exponent, in every record that mentions it.
    admissibility_filter_H_ENDO_001:
      compliance: >-
        ALL SIX RECORDS ARE ADMISSIBLE AND NONE RETESTS H-ENDO-001. No record
        applies an endomorphism to any point of G; the filter is not used,
        needed, or tested anywhere in this task. Every record names its resource
