    lossy_projection_test:
      applied_to_every_filed_object: true
      results: >-
        All six filed objects pass BOTH halves: each discards a genuinely
        non-recoverable part of the state, and what each retains propagates
        deterministically under a stated operation. Two of them pass in an
        instructive way and both records say so explicitly. (i) ad0ff7's
        decomposability bit does NOT propagate under the group law and DOES
        propagate under the adversary-chosen peeling map - the general lesson
        recorded there is that a tracked object need not propagate under the
        target's native operation provided the algorithm may choose the
        operation, which is precisely the freedom a non-generic adversary has.
        (ii) d27383's algebraic degree PASSES the test cleanly and is still
        useless, because its propagation is multiplicative while the cost being
        counted is additive - the general lesson recorded there is that passing
        the lossy-projection test is necessary and nowhere near sufficient, and
        that a multiplicatively-propagating object can only ever certify a
        logarithmic bound. Both lessons are offered as candidate entries for
        KN-OPEN-019 (the missing ECDLP object enumeration) and neither is written
        to knowledge/, which is outside write_scope.
      rejection_by_the_test: >-
        ONE object was rejected by the test alone, at zero cost: the Kummer-line
        unordered pair, which propagates two-valuedly and therefore branches
        2^q times over q steps.
    dominated_by: >-
      AS AN ATTACK, FOR EVERY ONE OF THE SIX RECORDS AND FOR THE TASK AS A WHOLE:
      dominated by every row of the prime-field frontier, checked row by row
      rather than asserted. Parallel Pollard rho with distinguished points at
      0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006);
      the automorphism-discounted variant on CM curves at a constant factor at
      most sqrt(6) (KN-TECH-018), which is baseline calibration and never an
      exponent; BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031). No record
      occupies any point on that frontier and `null` would be a fabrication under
      AGENTS.md rule 5.
      AS THEORY, PER RECORD AND NOT AGGREGATED: a28c44 is dominated by Shoup's
      model (KN-TECH-005) on generality and dominates it on nothing except
      coverage of one primitive it does not define; a343de is INCOMPARABLE to the
      simulator-exhibition technique of KN-FIND-b7e091 (each closes oracles the
      other cannot) and incomparable to IDEA-20260807-7270d1's q*Z criterion,
      with the two agreeing exactly at q = 1; ad0ff7 is dominated by
      IDEA-20260807-7270d1's (D) witness on query count (1 versus m*L) and
      dominates it on answer width (1 bit versus log_2 N), so neither dominates
      in the Pareto sense; ae0f6f is dominated by IDEA-20260807-070d03 on the
      degree argument and dominates it on the cost accounting; b1b94c is
      dominated by IDEA-20260807-5876b8 on operational reach and dominates it on
      quantification; d27383 is dominated on every axis by Shoup's bound as a
      lower-bound method, which is the record's finding rather than a concession.
    sota_delta: >-
      ZERO, QUANTITATIVELY AND FOR EVERY RECORD: 0 time, 0 memory, 0 queries, 0
      data against every attack baseline. Nothing in this task is an attack and
      none is claimed, in conformance with the batch card's section 4 and the
      handoff's claim-discipline constraint.
      THE NON-ZERO DELTAS ARE ALL AGAINST THE CAMPAIGN'S OWN STATE OF KNOWLEDGE
      and are stated in their own units: the closure boundary is located at
      log_2 N bits with a matching construction within O(m log m) bits (previously
      unlocated); the minimal bound-breaking oracle's answer width drops from
      about log_2 N bits to exactly 1 bit at a cost of a factor
      m*(m! N)^{1/m} in queries; the crossover for prime-field index calculus is
      given in closed form as C < N^{(m-1)/2} respectively C < N^{(m-3)/4}, with
      the gap N^{(m+1)/4} between the two factor-base variants, replacing an
      undetermined C; the rigidity profile is fixed at min(q,2) against Shoup's
      q, with the curve-randomised value 5/2; and the degree-charging family's
      certification ceiling is fixed at log_2 p against a sqrt(N) target, a gap
      of N^{1/2}/log_2 N. One capability (R1-bwd) moves from unadjudicated to
      closed and one (R9, relation discovery) is isolated as the sole unclosed
      resource in the fourteen-lane decomposition.
    enumerated_closures:
    - closure: >-
        The family of model refinements of the form "replace Shoup's random
        injection by a structured labeling reflecting the curve, then re-prove a
        lower bound".
      mechanism: >-
        INSTANCE RIGIDITY. The number of labelings of any set of formal linear
        forms consistent with SOME instance is bounded by the number of
        instances, N(N-1), independently of how many labels are revealed; and the
        bound is ATTAINED already at two independent forms. So the rigidity
        profile is r(q) = min(q,2) against Shoup's r(q) = q, a simulator has no
        freedom from the third query onward, and committing to two labels commits
        to k. No hiding-preserving simulator answers label-valued queries.
      record: IDEA-20260811-b1b94c
      forward_guidance: >-
        Three surviving classes, with numbers. CLASS 1 curve-randomised models,
        profile min(q, 5/2) because h(O) is about p^{1/2} - axis A3's territory,
        passed as a pointer. CLASS 2 charged-primitive models - instantiated in
        this batch by a28c44 and a343de, each with a proved bound. CLASS 3
        algebraic-power models - closed separately by d27383 with its own
        surviving pointer.
    - closure: >-
        The family of R1-fitted lower bounds that charge ALGEBRAIC DEGREE:
        polynomial-interpolation bounds for the discrete logarithm, generic-ring
        arguments of that shape, and any adversary-charging reading of a
        degree-graded oracle model.
      mechanism: >-
        DEGREE DOUBLES PER MULTIPLICATION, so degree is a logarithmic complexity
        measure for straight-line programs; and over F_p every degree is at most
        p-1. Therefore any degree lower bound certifies at most log_2(p-1)
        operations, exponentially below sqrt(N). The witness that no repair is
        available inside the measure is X^{p-1}: maximal degree, logarithmic
        cost. A measure on which the hardest-degree object is among the cheapest
        cannot support a sqrt(N) bound.
      record: IDEA-20260811-d27383
      exclusions: >-
        AOM_d (IDEA-20260806-530fdd) is NOT closed - it charges the SIMULATOR,
        where degree is the right unit - and the exclusion is verified as a
        blocking stage before the closure is written. Degree bounds also retain a
        real scoped consequence: they unconditionally rule out a closed-form
        low-degree formula for the discrete logarithm.
      forward_guidance: >-
        NON-SCALAR MULTIPLICATIVE COMPLEXITY, which is not a logarithmic measure
        (about sqrt(D) necessary for generic coefficients). A non-scalar lower
        bound of N^{1/2-o(1)} for the ECDL interpolation polynomial would be an
        unconditional sqrt(N)-scale bound for algebraic algorithms with no oracle
        idealisation - the right target profile. THE OBSTRUCTION IS STATED WITH
        THE OPPORTUNITY: such bounds fail for explicit polynomials and proving
        one is a known hard problem. A tiny two-directional measurement at
        p < 32, with a matched random-function null and a planted control, is
        attached and decides whether the direction is worth opening.
    - closure: >-
        R1-bwd, the point-creation half of resource R1: producing a handle to a
        group element from field data, with the discrete logarithm unknown, under
        any predicate on labels.
      mechanism: >-
        AN EXPLICIT SIMULATOR WITH AN UNBOUNDED-RANK STATE. The fresh-variable
        formal-linear-form simulator adjoins a new indeterminate per creation and
        answers by formal comparison; divergence requires two formally distinct
        linear forms over (1, k, e_1, ..., e_s) to coincide at the true values,
        which for prime N happens with probability exactly 1/N per pair. Union
        bound gives (g+s+2)^2/N, INDEPENDENT OF THE PREDICATE.
      record: IDEA-20260811-a28c44
      forward_guidance: >-
        The escape is therefore not in factor-base construction. The unique
        remaining capability is RELATION DISCOVERY, proposed as taxonomy entry
        R9, whose cost is IDEA-20260807-070d03's open C and whose threshold is
        IDEA-20260811-ae0f6f's crossover inequality. The boundary of the generic
        model runs exactly between CREATE and RELATE.
    - closure: >-
        The class of augmenting oracles whose TOTAL answer-branching entropy over
        an execution is o(log_2 N) bits - closed at exponent 1/2 WITHOUT
        exhibiting a simulator, including oracles for which no simulator exists.
      mechanism: >-
        In the generic model the group oracle contributes zero branching about k
        conditioned on no formal collision, so the adversary's whole view ranges
        over at most 2^t values for fixed coins and its output takes at most 2^t
        values, while k is uniform on at least N - binom(g+2,2) values.
        Pigeonhole.
      record: IDEA-20260811-a343de
      forward_guidance: >-
        The criterion is INCOMPARABLE to the simulator-exhibition technique, with
        one oracle exhibited on each side; the correct operational rule is to try
        the entropy criterion first because it is free, and fall back to building
        a simulator. Above the floor the criterion is SILENT, never negative, and
        reading a failed closure as an attack is the inverse error the record
        guards against.
    non_closures_explicitly_declined:
    - >-
      NO CLAIM IS MADE THAT THE L12 IDEA SPACE IS SATURATED. The batch card's
      pre-registered hypothesis was that generation has been thin outside
      "resource applied to one curve's point group". For this axis the screen
      supports that hypothesis in a specific and checkable way: the lane's nine
      existing records all track functions of the rank-2 formal linear form, and
      the four objects filed here that are new to the corpus (access direction,
      answer entropy, the witness-free decision bit, the search-space
      efficiency ratio) are new precisely because they are not.
    - >-
      NO DIRECTION IS DECLARED IMPOSSIBLE. Both closures name surviving classes
      with numbers, per inventor-protocol section 7.
    - >-
      The value of C - the cost of one arity-m decomposition over F_p - remains
      OPEN and is not closed by anything in this task. ae0f6f gives the threshold
      it must cross and the ratio to measure; it does not claim the ratio's
      value.
    open_directions_for_the_next_session:
    - >-
      D1. CLOSE THE QUERY-COUNT GAP FOR ONE-BIT ORACLES. a343de says log_2 N bits
      suffice in principle; ad0ff7 achieves the break with m*N^{1/m} single-bit
      queries. The gap is m*N^{1/m}/log_2 N. The obvious attempt - binary-search
      on k via DECIDE(Q - [c]P) - fails for a NAMED reason: the adversary cannot
      predict the answers without deciding decomposability itself, so the bits
      received are not bits it can invert. This is an
      information-versus-computation gap and it is the sharpest open question
      this axis produced.
    - >-
      D2. THE FIXED-ARITY COLLAPSE. Does ONE fixed-arity single-bit decision
      oracle suffice, without the arity grading? Named obstruction: padding with
      the identity gives "sum of AT MOST m", and that relation is not closed
      under the peeling subtraction. Exhaustively testable at N <= 2^12 over
      adaptive strategies of small depth.
    - >-
      D3. THE PRIME LADDER FOR THE SEARCH-SPACE EFFICIENCY. Measure the exponent
      in N of C_measured / L^{m-1} at fixed m and fixed L/sqrt(N), with the
      enumeration arm measured rather than assumed as the denominator and the
      F_{q^2} subfield arm as the blocking positive control. Pre-registered null:
      exponent 0. THIS IS THE SINGLE MOST DECISIVE EXPERIMENT THIS AXIS CAN
      RECOMMEND and it is cheaper than the campaign's current instrument
      calibration work.
    - >-
      D4. EXTERNAL INGREDIENT SCOUTING, BLOCKED THIS SESSION. Four specific
      checks a session with web access should run and log to
      knowledge/literature/: (a) the label-versus-no-label generic-model
      separation literature; (b) polynomial-interpolation lower bounds for the
      ECDL (Coppersmith-Shparlinski, Lange-Winterhof, Kiltz-Winterhof), which
      would confirm or correct d27383's scope claim; (c) generic-ring-model
      results and their charging convention; (d) any published statement of a
      crossover threshold for prime-field index calculus, which would make
      ae0f6f an ingredient rather than a proposal. Each is a novelty check this
      task could not perform.
    - >-
      D5. KN-OPEN-019 CONTRIBUTIONS. Two candidate general entries for the
      missing ECDLP object enumeration emerged and are recorded in the filed
      proposals rather than in knowledge/ (which is outside write_scope): a
      tracked object need not propagate under the target's native operation if
      the algorithm may choose the operation it propagates under (ad0ff7); and an
      object whose propagation is multiplicative while the counted cost is
      additive can only ever certify a logarithmic bound, which is checkable at
      the moment the object is proposed (d27383).
    - >-
      D6. THE CROSS-AXIS POINTER TO A3. Curve randomisation raises the rigidity
      profile from 2 to 5/2, the +1/2 being exactly log_N h(O). If axis A3 wants
      a model-side justification for treating the isogeny class as one
      algorithmic object, that exponent is it. Passed as a pointer;
      IDEA-20260811-b1b94c claims nothing about lane L13 and adjudicates nothing
      there.

  ranking_and_first_test:
    ranking_by_expected_information_gain_per_unit_cost:
    - '1. IDEA-20260811-a343de (entropy floor) - highest. Ninety minutes of
      derivation, a two-sided result, and the only object in this batch that
      would be citable outside this program as stated.'
    - '2. IDEA-20260811-ae0f6f (Bezout fixed point) - highest actionability.
      Ninety minutes to the fixed point plus the extension-field falsifier, and
      its output is a spending instruction that is useful whichever way it comes
      out.'
    - '3. IDEA-20260811-a28c44 (FB-GGM) - closes a capability and names the sole
      remaining one; two hours, no compute.'
    - '4. IDEA-20260811-b1b94c (instance rigidity) - the cheapest measurement in
      the batch (exhaustive enumeration at N in the low hundreds) and the largest
      novelty risk.'
    - '5. IDEA-20260811-ad0ff7 (one-bit oracle) - real but its main effect is to
      sharpen a boundary a343de locates more decisively.'
    - '6. IDEA-20260811-d27383 (degree ceiling) - prevents a plausible
      misinvestment in exactly the model the axis brief invites, but enables
      nothing directly and its measurement is a long shot.'
    test_first: IDEA-20260811-a343de
    why_this_minimal_test_is_the_cheapest_valid_discriminator: >-
      Its Stage 0 is ninety minutes of derivation with no curve, no solver, no
      run and no fixture to build, and it has exactly one joint that can break:
      whether conditioning on no formal collision really leaves the group
      transcript free of k-dependence when the adversary chooses its group
      operations adaptively as a function of earlier oracle answers. If that
      joint holds, the record delivers a two-sided characterisation - a floor of
      log_2 N - O(1) bits and a construction achieving it within O(m log m) -
      and a closure criterion that requires no simulator and therefore closes
      oracles the campaign currently cannot close at all. If it fails, the record
      dies for the price of an afternoon and takes IDEA-20260811-ad0ff7's Theorem
      D-3 with it, which makes it the highest-leverage single check in the batch.
      A close second is IDEA-20260811-ae0f6f's extension-field falsifier - redo
      the identical cost derivation with the membership condition linearised by
      Weil restriction and check the conclusion FLIPS - because a cost model that
      condemns prime fields must exonerate extension fields or it is condemning
      arithmetic, and that check also costs nothing.
