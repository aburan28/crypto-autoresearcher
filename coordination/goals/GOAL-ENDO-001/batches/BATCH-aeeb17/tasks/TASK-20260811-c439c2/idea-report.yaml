  axis_coverage:
    constructive_separations_requested: >-
      COVERED, and this is the axis's primary deliverable. Lane L12 has been used
      destructively (take an oracle, exhibit a simulator, close at 1/2). Three of
      the six records invert that posture and CONSTRUCT: IDEA-20260811-a28c44
      constructs a positive simulability result for a primitive nobody had
      modelled (so the boundary's near side is now bounded);
      IDEA-20260811-ad0ff7 constructs a bound-breaking adversary from a one-bit
      oracle (so the boundary's far side is now lowered);
      IDEA-20260811-a343de constructs both directions at once and locates the
      boundary exactly in the answer-branching coordinate.
    weakest_non_simulable_oracle: >-
      ANSWERED IN TWO COORDINATES, with matching constructions in both.
      IN OUTPUT ENTROPY: the weakest possible bound-breaking oracle emits at
      least log_2 N - O(1) bits in total (IDEA-20260811-a343de, Theorem E-1) and
      log_2 N + O(m log m) bits suffice, delivered by ONE arity-m decomposition
      query over a known-log base (Theorem E-3). The boundary is located to an
      additive O(m log m).
      IN ANSWER WIDTH: one bit per query suffices, with the witness withheld and
      the base fixed (IDEA-20260811-ad0ff7, Theorems D-1 and D-2), at the price
      of m*L queries. One bit TOTAL, non-adaptively, provably does not
      (Theorem D-3). So the load-bearing feature is adaptivity in the target and
      the query count, not the width of the answer.
      IN THE PRIMITIVE LATTICE: within {ADD, EQ, CREATE, RELATE}, every subset
      without RELATE preserves exponent 1/2 (IDEA-20260811-a28c44, Theorem
      FB-1), and RELATE plus CREATE breaks it (cited from
      IDEA-20260807-7270d1's (D) witness). The boundary runs exactly between
      CREATE and RELATE.
    x_coordinate_oracle_R1_verdict: >-
      THE AXIS'S HEADLINE QUESTION -- "is the x-coordinate-as-field-element
      oracle provably non-simulable, and is there a query-count crossover?" --
      IS ANSWERED NEGATIVE, AND THE NEGATIVE IS SUBSTANTIATED RATHER THAN
      ASSERTED. There is NO query-count crossover for the coordinate oracle,
      because the coordinate map is answerable at zero error and O(log N) group
      operations by a simulator that instantiates a concrete instance. That
      verdict already exists in the corpus (IDEA-20260807-070d03, cell (b) PUB;
      IDEA-20260807-5876b8, lemma L1) and this task does not re-litigate it. What
      the task ADDS is the reason behind it -- IDEA-20260811-b1b94c's instance
      rigidity, r(q) = min(q,2), which shows the phenomenon is not about curves
      or coordinates at all -- and the two coordinates in which a crossover DOES
      exist and is located (entropy and answer width, above). It also SPLITS R1:
      the read-out half is closed by -070d03, the point-creation half is closed
      by IDEA-20260811-a28c44, and the capability neither covers (relation
      discovery) is proposed as a new taxonomy entry R9.
    quantitative_crossover_that_tells_the_program_where_to_spend: >-
      DELIVERED BY IDEA-20260811-ae0f6f. Prime-field index calculus beats
      0.886*sqrt(N) iff the cost of one arity-m decomposition satisfies
      C < N^{(m-1)/2} (known-log base) or C < N^{(m-3)/4} (unknown-log base);
      and if C equals the search-space size L^{m-1} that
      IDEA-20260807-070d03's degree fact forces, the known-log method costs
      Theta(sqrt(N)) EXACTLY, for every arity. Two consequences the Coordinator
      can act on. (1) INCREASING THE ARITY IS WORTHLESS BY ITSELF: the exponent
      is arity-independent at the naive cost. (2) THE ONE DECISIVE MEASUREMENT
      is the exponent in N of the ratio C_measured / L^{m-1} on a prime ladder,
      with a pre-registered null of zero -- NOT the dependence of C on
      factor-base structure at fixed N, which is IDEA-20260807-070d03's
      already-filed and complementary question and which is worth only a constant
      unless the ratio also decays.
    the_right_model: >-
      COVERED FROM BOTH SIDES. POSITIVELY: two models are defined and each
      carries one proved bound -- FB-GGM with Theorem FB-1
      (IDEA-20260811-a28c44), and the answer-branching model with Theorem E-1
      and its matching construction E-3 (IDEA-20260811-a343de). Both grant the
      adversary capabilities Shoup's model forbids and both still bound it, which
      is what the handoff asked for ("defining that model correctly and proving
      ONE bound in it is a complete deliverable").
      NEGATIVELY: the two most natural alternative model families are closed with
      named obstructions -- structured labelings by instance rigidity
      (IDEA-20260811-b1b94c) and degree-charging by degree doubling
      (IDEA-20260811-d27383) -- each with forward guidance naming what remains.
      The closures and the constructions are independent: either closure could be
      wrong without touching either bound.
    binding_constraint_KN_FIND_b7e091: >-
      EXTENDED, NEVER REVISITED, in all six records. Its four oracle verdicts are
      used as a REGRESSION FIXTURE in three of them (a343de, b1b94c, a28c44) with
      a pre-registered prediction of ZERO changed verdicts, and each of those
      records halts its own line if any verdict changes. Its third category,
      "non-simulable but useless", is given the quantitative criterion it lacked
      (a343de's E-2) rather than a correction.

