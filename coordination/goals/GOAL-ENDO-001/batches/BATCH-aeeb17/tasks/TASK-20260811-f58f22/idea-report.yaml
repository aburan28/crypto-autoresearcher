  tooling_failure:
    what: >-
      WebSearch and WebFetch were unavailable for the entire session. Every call
      (two WebSearch, three WebFetch against eprint.iacr.org) returned the same
      backend error naming us.anthropic.claude-haiku-4-5-20251001-v1:0 as
      unavailable.
    consequence: >-
      NO EXTERNAL CITATION IN THIS TASK WAS VERIFIED AGAINST ITS SOURCE. The
      handoff instructed the axis to "use WebSearch/WebFetch to get these bounds
      right -- misquoting them makes the whole axis worthless". That instruction
      could not be followed. The mitigation actually taken: every generic
      preprocessing bound quoted in the five records is taken from a COMMITTED
      CORPUS ENTRY and is cited to that entry rather than to the paper, with the
      corpus entry's own "not verified here" caveat carried forward. Specifically
      S*T^2 = Omega~(eps*N) is quoted from KN-LIT-013 and KN-TECH-005, whose own
      notes state the full CGK paper was not read; the full-cost statements are
      quoted from KN-TECH-035 and KN-TECH-031, whose notes state that the wiring
      derivation in KN-LIT-094 was not re-checked; the structured-GGM statements
      are quoted from KN-LIT-7606, whose note states the full text was not read.
      Bernstein-Lange and Mihailescu could NOT be quoted with exponents from any
      primary source and are referred to only as relayed by KN-TECH-005 and by
      IDEA-20260807-a127ab; NO Mihailescu exponent is asserted anywhere in the
      five records, because none could be checked.
    classification: >-
      Infrastructure failure. Under AGENTS.md rule 3 it is not negative
      mathematical evidence and it is not treated as one. It is the reason every
      record carries novelty_status unverified except IDEA-20260811-735c6b and
      -73e9a5, which are labelled adaptation because their techniques are
      explicitly taken from committed corpus entries.
    what_a_reviewer_should_fetch_first:
      - iacr:2017/1113 Corrigan-Gibbs, Kogan -- the exact S*T^2 statement, its log factors, and whether any multi-instance or structured-family variant is treated.
      - Bernstein-Lange, non-uniform cracks / free precomputation -- the exact exponents and what is credited to Mihailescu.
      - iacr:2026/384 Corrigan-Gibbs, Henzinger, Wu -- whether the delta-framework can express structure on the SET OF ENCODINGS rather than on group elements. This single question decides whether IDEA-20260811-7d4f62 is necessary or is superseded by a citation.
      - Any published time-space tradeoff or non-uniform security bound for cryptographic GROUP ACTIONS. This decides whether IDEA-20260811-68fa90 part (B) is new or known, and known is the expected answer.

