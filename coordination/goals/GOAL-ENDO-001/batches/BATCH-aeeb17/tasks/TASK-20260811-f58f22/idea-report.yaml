    Five records were filed against a permitted range of four to eight, and the
    handoff states explicitly that filing fewer than eight is a correct outcome.
    Two further candidates were drafted and then MERGED rather than filed thin:
    (i) a standalone bounded-preprocessing (P, S, T) model record was merged into
