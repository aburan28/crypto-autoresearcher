    full-cost claims beside it; (ii) a standalone "criticality of h = N^{1/2}"
    record was merged into IDEA-20260811-61ecae as its claim (F), because the
    criticality is a corollary of that record's frontier inequality and filing it
    separately would have manufactured a second record out of one line of algebra.
    The three unused identifiers are returned unused and unminted.

  axis_coverage:
    outcome_a_separation: >-
      PURSUED AND NOT FOUND FOR ECDLP, WITH A CONSTRUCTION RATHER THAN A SHRUG.
      IDEA-20260811-61ecae builds the strongest class-amortised preprocessing
      scheme this session could construct -- it reaches a uniformly random,
      previously unseen class member at the fixed-curve operating point -- and its
      own analysis shows it lands exactly ON the Corrigan-Gibbs--Kogan frontier and
      never below. A separation WAS found, but for a different problem: the same
      machinery gives a genuine advice/online tradeoff for VECTORIZATION
      (IDEA-20260811-68fa90), which is a class-level problem. That is reported as
      an isogeny-crypto candidate with high declared prior of prior art, and the
      same record proves it cannot transfer to ECDLP.
    outcome_b_lower_bound: >-
      DELIVERED IN TWO FORMS AT TWO STRENGTHS. (i) A reduction:
      IDEA-20260811-61ecae part (D) carries the CGK bound verbatim into the
      adaptive class-structured model by walking the fixed-group challenge to a
      random class member, so the class-structured achievable region equals the
      generic one, tightly. This needs no compute at all, which the handoff named
      as the cleanest citable negative available. (ii) A model:
      IDEA-20260811-7d4f62 specifies the torsor-structured generic group with
      preprocessing and states the conjecture the reduction does not reach --
      covering algorithms that use the transport oracle adaptively -- with its two
      named failure points and a blocking null model.
    the_transport_tension_the_handoff_demanded_be_resolved: >-
      RESOLVED RATHER THAN DODGED, AND THE RESOLUTION IS THE BATCH'S MAIN IDEA.
      The handoff required every scheme to say which transport it needs and pay
      for it. The answer: the scheme needs ONLY random transport. It never
      computes an isogeny between two specified curves. The challenge curve is
      walked forward (cheap direction) until it collides with a precomputed
      landmark whose path is stored in the advice, so the specified-transport
      problem is paid for OFFLINE, in advance, at advice cost N^{1/2-tau} bits --
      and that cost is dominated by the DL advice budget N^{1-2tau} at every point
      of the frontier. The same cheap direction then carries the lower bound back
      into the model. THE ASYMMETRY THAT COULD HAVE PRODUCED A SEPARATION IS
      EXACTLY WHAT FORBIDS ONE.
    generic_bounds_charged_not_gestured_at:
      corrigan_gibbs_kogan: >-
        S*T^2 = Omega~(eps*N) for prime order N, quoted from KN-LIT-013 and
        KN-TECH-005, used as the frontier that every record's operating point is
        compared against, and used as the lower bound transported into the
        adaptive model. The corpus entry's caveat (full paper not read) is carried
        into every record that cites it.
      bernstein_lange_and_mihailescu: >-
        CHARGED HONESTLY BY REFUSING TO QUOTE WHAT COULD NOT BE CHECKED. The
        S = T = N^{1/3} operating point is cited as relayed by KN-TECH-005 and by
        IDEA-20260807-a127ab. NO Mihailescu exponent is asserted anywhere, because
        no primary source could be reached; the reviewer's fetch list records this
        as the second item.
      at2_and_full_cost: >-
        CHARGED AS ITS OWN RECORD (IDEA-20260811-735c6b) rather than as a caveat.
        Wiener full cost via KN-TECH-035 and KN-TECH-031 (BSGS N^{2/3+o(1)}), with
        the result that the full-cost optimum of the CGK frontier is the no-advice
        corner, so single-target preprocessing never beats rho once storage is
        charged for the time it is occupied.
      memory_access_pattern: >-
        CHARGED EXPLICITLY. The landmark scheme's Theta(h/L) random probes into an
        L-entry table are re-priced under RAM, 3-D and 2-D wiring latency; the
        landmark budget survives all three, with exact equality against the DL
        budget in the 2-D row at every point of the frontier.
      preprocessing_time: >-
        CHARGED AS THE (P, S, T) axis, where the class's only nonzero honestly
        charged gain lives and where its size is exactly h = N^{1/2+o(1)}.

