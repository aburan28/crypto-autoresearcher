  honest_accounting:
    objects_considered:
      - name: The position of a curve in the Cl(O)-torsor (the class address), and dually the advice's reach over the class.
        lossy_projection_test: >-
          PASSED. Discards the Weierstrass coefficients, all point data, the model
          and the x-line, retaining one element of a group of size h ~ p^{1/2}
          against a state of Theta(log p) bits plus a point set of size N. What is
          discarded is discarded compatibly with the target's operation (an
          ell-isogeny step multiplies the address by the corresponding ideal
          class), so the retained part propagates deterministically. This is not a
          change of coordinates: nothing about the curve equation is recoverable
          from the address without a class-polynomial evaluation, and nothing about
          the points is recoverable at all.
        distinguishing_property: >-
          A ONE-WAY dynamical variable -- cheap to propagate forward from a known
          start, expensive to recover for a curve handed to you. That is T5
          restated as a property of the object, and it is what the batch's flagship
          exploits (it collides with the variable rather than recovering it).
        survives_until: >-
          Any step of degree sharing a factor with N (never, for small-ell walks);
          non-fundamental discriminant, where the torsor fragments into volcano
          levels; and any question about the curve equation or the x-line, where
          the projection has already discarded the answer -- which is why this
          object says nothing about lane L1.
      - name: The identification map between two encodings of Z/N, tracked by its computational cost rather than its existence.
        lossy_projection_test: >-
          PASSED. Sends a pair of curves to one number, discarding both curves
          entirely; propagates under composition by the triangle inequality, which
          needs nothing about the curves.
        distinguishing_property: >-
          It is the only coordinate on which the three ensembles of
          IDEA-20260811-73e9a5 differ -- retention is 1 in two of them and the
          isogeny class differs from the free one only by a cost, never by a
          retention.
      - name: The cost functional (P, S, T, area x time) itself, tracked as the accounting convention changes.
        lossy_projection_test: >-
          PASSED in the audit sense -- the re-pricing rules act on the tuple alone,
          so the tuple determines the re-priced tuple.
        distinguishing_property: >-
          It is the object on which the lane's amortisation claims live or die, and
          two of its coordinates were priced at zero by the model everyone was
          quoting.
      - name: The multi-encoding GGM knowledge state (formal linear forms in k, tagged by encoding).
        lossy_projection_test: >-
          PASSED -- Op adds forms within an encoding, Step copies a form to a
          neighbour unchanged; both act on the retained part alone. The lossiness
          is not free only at the collision event, which is exactly what a GGM
          proof must bound.
        distinguishing_property: >-
          Whether it can tell the LINKED family from the INDEPENDENT family is the
          crux of IDEA-20260811-7d4f62 and the point of disagreement with
          IDEA-20260807-ea3915.
    dominated_by: >-
      AS AN ATTACK, EVERY RECORD FILED HERE IS DOMINATED, and the frontier was
      checked row by row across time, memory and data/queries rather than
      asserted: parallel Pollard rho with distinguished points at 0.886*sqrt(N)
      group operations with O(1) memory and Theta(sqrt(N)) full cost (KN-TECH-001,
      KN-TECH-006, KN-TECH-035); the automorphism-discounted variant at
      0.886*sqrt(N/r) with r <= 3 (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N)
      memory, N^{2/3+o(1)} full cost (KN-TECH-031); Bernstein-Lange /
      Corrigan-Gibbs--Kogan preprocessing on the frontier S*T^2 = Omega~(N)
      (KN-LIT-013), which dominates the flagship on implementation complexity and
      ties it on every cost axis; Kuhn-Struik multi-target rho at sqrt(M*N)
      (IDEA-20260807-406fef). No row is beaten on any axis by anything filed here,
      and IDEA-20260811-735c6b's Claim 1 strengthens that domination by showing
      the whole preprocessing frontier loses to row 1 under full cost.
      AS A CLASS-LEVEL (NON-ECDLP) RESULT, IDEA-20260811-68fa90 part (B) is
      dominated in the quantum column by Kuperberg-style subexponential
      vectorization, dominated at S <= sqrt(h) by plain claw-finding, and possibly
      dominated outright by published work this session could not reach -- which
      is why its novelty_status is unverified.
      AS MODEL AND INSTRUMENT WORK, IDEA-20260811-7d4f62 is dominated by
      KN-LIT-7606 wherever that paper's delta-framework reaches, and determining
      whether it reaches here is that record's own minimal-test step 5.
    sota_delta: >-
      ZERO against every attack baseline, stated quantitatively rather than as a
      word. Online time at the tau = 1/3 operating point is N^{1/3} against rho's
      0.886*N^{1/2} -- a ratio already available for a FIXED curve from the
      published preprocessing literature; the isogeny class's contribution to that
      ratio is a factor of exactly N^{o(1)}, which is the honest number this task
      produces. Against the campaign's own prior best in the lane, the flagship
      removes an N^{1/4} online addressing term from a127ab's adaptive case and
      replaces it with an N^{1/6} advice term at tau = 1/3; that is a delta against
      an internal proposal, not against any published attack. In the other
      direction, IDEA-20260811-735c6b reprices the lane's best advice operating
      point from N^{1/3} processor steps to N^{2/3} full cost, a worsening of
      N^{1/6} against rho.
    enumerated_closures:
      - closure: >-
          The adaptive class-structured preprocessing problem has the same
          achievable (S, T) region as the fixed-group problem, up to N^{o(1)}.
        mechanism: >-
          Two-sided. UPPER: landmark-walk advice reaches a uniformly random unseen
          member using only the cheap direction of T5, with landmark budget
          L = h/T dominated by the DL budget S = N/T^2 at every point of the
          frontier, because 1/2 - tau <= 1 - 2*tau for tau <= 1/2, an inequality
          that is tight precisely because h = N^{1/2+o(1)}. LOWER: the same cheap
          direction converts any class-model algorithm into a fixed-group one at
          Otilde(1) overhead, so the CGK bound transfers verbatim.
        forward_guidance: >-
          Remaining open: algorithms that use the transport oracle adaptively or
          correlate information across encodings (IDEA-20260811-7d4f62's model);
          non-fundamental discriminants; anything reading field data (lane L1);
          quantum models.
      - closure: >-
          Under Wiener full cost, no point of the preprocessing frontier costs less
          than the no-advice corner, so single-target advice never beats rho once
          storage is charged for the time it occupies.
        mechanism: >-
          Full cost >= S*T = N/T on the frontier, which is monotone decreasing in
          T, so the optimum is the endpoint T = Theta(sqrt(N)), S = Theta(1).
        forward_guidance: >-
          The exception is an advice table with a predictable access order, which
          could be streamed rather than resident; whether the frontier algorithm
          has one is an open read, recorded as HC-1.
      - closure: >-
          Class-level advice cannot answer point-level questions -- the class
          address and the secret k are independent, because transport preserves k
          across the whole class.
        mechanism: >-
          T1 makes k constant on the transport orbit, so the orbit position and k
          are independent random variables. Advice about the orbit therefore
          carries zero information about k.
        forward_guidance: >-
          This does NOT close statistics that read the curve equation, which are
          lane L1's and are handed over untouched. The nearest prior statement is
          IDEA-20260807-7c00e6's congruence-counting argument, and the two are
          complementary.
      - closure: >-
