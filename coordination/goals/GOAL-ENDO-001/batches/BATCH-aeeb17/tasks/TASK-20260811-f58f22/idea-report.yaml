  rejected_candidate_objects:
    - object: >-
        The class ensemble as a source of many independent iteration functions for
        a shared rho -- transport the instance to all h members and run collision
        search across the ensemble.
      rejected_because: >-
        ALREADY FILED AS A CLOSURE. IDEA-20260807-7c00e6 records it as inadmissible
        on its face -- Tate fixes N across the class so there is no second modulus
        to CRT against, and the ensemble is exactly parallel collision search with
        h iteration functions at an extra isogeny evaluation per step, strictly
        worse than rho on one curve. Regenerating it would have been a
        rediscovery, which the handoff names as the single most costly failure
        mode available to this task.
    - object: >-
        The h distinct x-coordinate views of the same abstract group supplied by
        the class, used as an enlarged factor base or a cross-view relation source
        for index calculus.
      rejected_because: >-
        ALREADY CLOSED WITH A DEGREE OBSTRUCTION in IDEA-20260807-bb03d3 -- the
        number of curves reachable by an isogeny of degree at most X is O(X), so M
        views force degree >= cM, the summation polynomial inherits that degree,
        and the algebraic cost multiplies by M^m against a factor-base benefit of
        only M. Nothing in the preprocessing framing changes that arithmetic.
    - object: >-
        Advice-encoding compression -- exploiting a classmate with small
        j-invariant, small CM discriminant, or a sparse model to write the SAME
        table in fewer bits (IDEA-20260807-a2fb45's OPEN-2).
      rejected_because: >-
        Genuinely open, genuinely in scope, and genuinely not worth an exponent-
        first record. The best case is O(1) bits per entry, which a2fb45 already
        predicts; it is a constant-factor question and the batch's search bias
        rules it low priority unless it is a building block for something, and it
        is not. Left open and named in open_directions rather than filed thin.
    - object: >-
        Batch addressing -- amortising the landmark walk across M challenge curves
        by correlating their walks, in the hope of a sqrt(M) saving analogous to
        Kuhn-Struik.
      rejected_because: >-
        Worked out and found to give nothing. Once one challenge is addressed, the
        others are no easier -- the torsor supplies no relation between distinct
        challenges' addresses that a shared walk could exploit, so M challenges
        cost M independent hitting times. It is one honest paragraph, not a record,
        and it is recorded here so the next session does not redo it.
    - object: >-
        The quantum column -- Kuperberg-style subexponential vectorization makes
        addressing free, so quantum class-amortisation needs O(1) landmarks.
      rejected_because: >-
        True and moot. An adversary who can run Kuperberg can run Shor, and Shor
        solves the ECDLP outright, so the class contributes nothing in any model
        where the addressing saving would matter. One sentence, filed as a note
        inside IDEA-20260811-61ecae's scope limits rather than as a record.
    - object: >-
        The class as a worst-case-to-average-case self-reduction for ECDLP --
        "any instance can be moved to a uniformly random class member in O(log p)
        steps, so worst case equals average case over the class".
      rejected_because: >-
        TRUE, ELEMENTARY, AND EMPTY. The reduction exists (it is T1 plus T5's cheap
        direction) but its "average case" is over CURVES, and by T1 the secret k is
        unchanged by the move, so the instance's difficulty as a function of k is
        untouched. The self-reduction randomises the only coordinate that was
        already known to be irrelevant. It is used as a PROOF DEVICE inside
        IDEA-20260811-61ecae part (D), which is its correct home; as a mechanism it
        is vacuous.
    - object: >-
        Volcano-level structure as an advice index -- stratify the advice by
        endomorphism-ring level so that addressing can use the level as a partial
        address.
      rejected_because: >-
        Scoped out and then found weak. The five records assume D fundamental, in
        which case there are no levels at all. For non-fundamental D the level is a
        publicly computable coarse address (IDEA-20260808-4d77a6 gives a cheap
        partial instrument for it), but the number of levels is O(log f), so it
        partitions the class into O(log p) blocks and saves at most a log factor of
        addressing -- a log-cofactor gain, explicitly low priority under the
        program's exponent-first bias, and not a building block for anything here.
    - object: >-
        Advice about the ISSUER rather than the curve -- precomputing for the space
        of curves a standards body might generate.
      rejected_because: >-
        Not a class-structure question at all. The set of curves a generation
        procedure can emit is not an isogeny class and the axis's object does not
        appear anywhere in it. Out of scope for A3 and recorded so that the
        boundary is visible.

