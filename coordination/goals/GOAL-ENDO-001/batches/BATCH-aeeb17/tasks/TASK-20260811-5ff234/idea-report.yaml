  rejected_objects:
    - id: R1
      object: >-
        The invalid-curve / twist-oracle setting: an unvalidated x-only ladder that
        accepts a twist point and returns [k] times it.
      reason: >-
        Requires an ORACLE outside the campaign's model. It is a protocol-implementation
        attack, not an ECDLP algorithm, and with the oracle removed there is nothing to
        compute. Filing it would smuggle a stronger adversary model into a batch whose
        standing constraints fix the model. Recorded in IDEA-20260811-01a208's
        interpretation_limits as explicitly out of scope.
    - id: R2
      object: >-
        The Weil restriction Res_{F_{p^2}/F_p} of E base-changed to F_{p^2}, as a
        two-dimensional abelian surface joining E and E^d.
      reason: >-
        It is F_p-isogenous to the PRODUCT E x E^d, i.e. completely split, so there is
        no genus-2 Jacobian to descend along and GHS-style Weil descent has no cover.
        This is IDEA-20260808-45af43's O-SPLITRESTRICTION in the n = 2 case and filing
        it would be a rediscovery. The cheaper fibre-product argument that reaches the
        same conclusion IS filed, in IDEA-20260811-01a208 claim (D), with the
        relationship disclosed.
    - id: R3
      object: The Kummer line as a state-space reduction for a search.
      reason: >-
        Two independent reasons. (i) The deck-group object is already
        IDEA-20260807-dadcd2, which generalises summation polynomials to an arbitrary
        coordinate map with deck group Gamma_f and computes the degree law
        |Gamma_f|^{m-2}; a "which quotient do you track" proposal is that record's
        object under new notation. (ii) The residue is the |Aut| = 2 constant, and
        DECOMPOSITION L6 plus KN-TECH-018 fix the automorphism discount as baseline
        CALIBRATION at most sqrt(6), never an exponent. Filing a constant-factor
        record against a pause-condition-P3-sensitive baseline is exactly the kind of
        record the batch card asks producers not to file. The classification
        observation that survives -- the only lossy projections compatible with the
        group law are quotients by subgroups and by automorphisms -- is stated in
        IDEA-20260811-18bb47 claim (E) for the subgroup half; the automorphism half is
        left to L6 where the calibration lives.
    - id: R4
      object: The sextic and quartic twist families of j = 0 and j = 1728 curves.
      reason: >-
        Closed by IDEA-20260808-45af43 with three independent limbs (Tate, gcd of
        orders, split Weil restriction). Any record here would be a rediscovery. The
        one place the j = 0 / j = 1728 stratum DOES appear in this batch is as a
        PREDICTED OUTLIER in IDEA-20260811-04a75a's point count, where the larger
        automorphism group changes the fibre size of the x-map -- a different use of the
        same curves and one the batch's own P3 note is careful to distinguish from a
        search speedup.
    - id: R5
      object: >-
        E(F_{p^2}) as a single object containing both E(F_p) and E^d(F_p), with the DLP
        pushed into the eigenspace decomposition (the trace-zero route).
      reason: >-
        The eigenspace containing G is G itself, so the DLP is unchanged; and the
        program already carries an independently verified negative on trace-zero
        cross-encoding transfer, recorded as P1501 and the P1545 audit assignment in
        ledger/FINDING-PF-IC-001.md. Re-proposing it would re-tread an existing
        negative. The eigenspace decomposition IS used in this batch, but as the
        MECHANISM of an obstruction (O-EIGENSPLIT) rather than as a route.
    - id: R6
      object: >-
        A second modulus from the twist: combining a congruence mod N with one mod
        N' = p + 1 + t by CRT.
      reason: >-
        Requires a k-preserving F_p-rational map from G into the twist. No such map
        exists: the twists have different traces, so every F_p-morphism between them is
        zero (Tate), and O-EIGENSPLIT independently shows the shared Semaev variety
        transmits nothing. This is the obstruction IDEA-20260808-45af43 named
        O-ONEMODULUS, reached again from the pair rather than the sextic family, and it
        is recorded rather than filed.
    - id: R7
      object: >-
        The set S_E = {x : chi(f(x)) = +1} as an additively or multiplicatively
        structured subset of F_p to be sieved.
      reason: >-
        NOT rejected outright -- promoted into IDEA-20260811-157d66, where it is closed
        by two independent obstructions (O-LABELLOSSLESS, O-WEILFLAT) with a scaling
        test that has a genuine negative outcome. Recorded here so the reader can see
        that the candidate was considered as a sieve target and downgraded to a closure
        rather than silently dropped.
    - id: R8
      object: >-
        The point count of the summation variety at m = 4 and above, and its zeta
        function.
      reason: >-
        Deferred, not rejected. The exhaustive enumeration cost rises from O(p^2) at
        m = 3 to O(p^3) at m = 4, and the fibre and boundary case analysis acquires
        several new cases. IDEA-20260811-04a75a names it as future work and explicitly
        does NOT claim the m = 4 formula. If the m = 3 result survives, m = 4 is the
        obvious successor and it is named as such rather than assumed.
    - id: R9
      object: The Cl(O)-vectorization / ECDLP reduction in either direction.
      reason: Out of scope -- it is axis A2's object (TASK-20260811-6ca12c).
    - id: R10
      object: Modular polynomials Phi_ell and modular curves as the index-calculus surface.
      reason: Out of scope -- it is axis A5's object (TASK-20260811-6d56a7).
    - id: R11
      object: >-
        The cofactor coset label as a free partition function for a rho walk or a
        distinguished-point predicate.
      reason: >-
        It is at best a constant-factor question about walk quality and cannot move an
        exponent, which the program's exponent-first bias ranks below the filing
        threshold; and it is P3-adjacent in spirit, since any measured walk improvement
        would have to be separated from the automorphism discount before it could be
        stated. Recorded instead as named forward guidance in IDEA-20260811-18bb47
        claim (F)(i), with the constant-factor ceiling stated in advance so that a later
        session cannot inflate it.

