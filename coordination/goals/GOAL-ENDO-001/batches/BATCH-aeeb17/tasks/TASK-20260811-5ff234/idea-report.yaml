  seed_verification:
    instruction: >-
      The handoff supplied a specific [open] seed and instructed: VERIFY it before
      building on it, record it if it fails, do not assert it as true. This block is
      that verification, performed by derivation only.
    findings:
      - seed_clause: >-
          "The quadratic twist E^d has trace -t, so it is in a DIFFERENT isogeny class
          and T1/T2/T4 say nothing whatever about it."
        verdict: TRUE, BUT ALREADY IN THE CORPUS AND THEREFORE NOT AVAILABLE AS NOVELTY
        detail: >-
          #E + #E^d = 2p + 2 gives t^d = -t; by Tate's theorem two curves over F_p are
          F_p-isogenous iff they have equal point counts; t = -t forces t = 0, which is
          excluded for ordinary curves. This is exactly claim (B) of
          IDEA-20260807-e41559, filed 2026-08-07, which states it in the same words and
          uses it to empty an affected-scope set. The seed is confirmed and is credited
          to that record in IDEA-20260811-01a208; nothing in this batch claims it.
      - seed_clause: >-
          "E and E^d SHARE THE SAME x-LINE: the map E -> E/{+-1} = P^1 and the same map
          for E^d have the same image."
        verdict: TRUE ONLY AFTER AN IDENTIFICATION THE SEED DOES NOT STATE
        detail: >-
          In the short Weierstrass model the quadratic twist is
          y^2 = x^3 + a d^2 x + b d^3 and its x-coordinates are d times those of E, so
          the two x-lines coincide only after the substitution x -> d x. In the model
          d y^2 = f(x) the coincidence is literal. The seed as written is therefore
          model-dependent and would produce a spurious mismatch in any measurement that
          used the short Weierstrass model. THIS IS RECORDED AS A PARTIAL FAILURE OF
          THE SEED AS STATED, and the correction is claim (A) of IDEA-20260811-01a208,
          which states the identification explicitly and makes it a required line item
          in that record's metrics.
      - seed_clause: >-
          "for x in F_p the value x^3 + a x + b is either a square (x lifts to E), a
          non-square (x lifts to E^d), or zero (both)."
        verdict: TRUE in the model d y^2 = f(x)
        detail: >-
          Elementary, and it is the source of #E + #E^d = 2p + 2 by summing 2
          contributions per x plus two points at infinity.
      - seed_clause: >-
          "a factor base of x-values is simultaneously a factor base for E and for
          E^d."
        verdict: TRUE AND STRENGTHENED, BUT THE CONSEQUENCE IS NEGATIVE
        detail: >-
          Strengthened: the summation polynomial is not merely shared in shape but is
          the SAME POLYNOMIAL, because the F_pbar-isomorphism between the two models
          fixes x (IDEA-20260811-01a208 claim (B)). The consequence is nevertheless
          negative: every mixed-label solution splits under Frobenius into one relation
          on each curve separately (O-EIGENSPLIT), so the shared variety carries no
          cross-curve congruence. The surviving residue is an exact factor of 2 in a
          two-target setting, filed as a constant and not as a result.
      - seed_clause: >-
          "#E * #E^d and #E + #E^d = 2p + 2 are exact relations across the pair."
        verdict: TRUE
        detail: >-
          #E * #E^d = (p + 1 - t)(p + 1 + t) = (p + 1)^2 - t^2 = #E(F_{p^2}), and the
          sum is 2p + 2. Both were used: the product underlies the eigenspace
          decomposition in IDEA-20260811-01a208 claim (C), and the pair of counts
          underlies the point-count derivation in IDEA-20260811-04a75a claim (B).
    net_seed_verdict: >-
      The seed's arithmetic is correct, one of its five clauses is model-dependent in a
      way that would break a measurement, and its headline observation was already
      filed in the corpus nine days earlier. The seed's productive content turned out
      to be not the non-isogeny but the SHARED SUMMATION POLYNOMIAL, which the seed did
      not state, and which is what IDEA-20260811-04a75a builds on.

  second_mandate_verdict:
    question: >-
      Exactly which maps does the H-ENDO-001 admissibility argument NOT govern, with
      the quantifier order written out; and if the boundary is airtight, say so and
      name why.
    verdict: >-
      AIRTIGHT FOR THE HOMOMORPHIC CLASS, WITH ONE NAMED CRACK. Filed in full as
      IDEA-20260811-00391a and, from the group side, as IDEA-20260811-18bb47.
    governed_set_quantifier_order: >-
      forall E/F_p ordinary, forall N prime with N | #E(F_p) and E[N] NOT contained in
      E(F_p), forall G the order-N subgroup, forall phi in End_{F_p}(E), exists lambda
      in Z/N, forall R in G: phi(R) = [lambda] R.
    why_airtight: >-
      The argument's one non-automatic hypothesis is phi(G) contained in G, which holds
      exactly when the N-Sylow of E(F_p) is cyclic, i.e. exactly when E[N] is not
      rational. If E[N] IS rational then the Weil pairing puts mu_N into F_p, so
      N | p - 1 and the embedding degree is 1 -- and those curves are broken outright by
      MOV / Frey-Ruck. So the filter can fail only on curves a published attack already
      breaks. That is the name of the airtightness: SCALARITY FAILURE REQUIRES RATIONAL
      FULL N-TORSION, AND RATIONAL FULL N-TORSION IS EMBEDDING DEGREE ONE. Two
      independent derivations of the same boundary are filed, one from the map side
      (00391a) and one from the group side (18bb47); the report flags explicitly that
      their agreement is NOT independent confirmation, since they share the Weil-pairing
      step.
    ungoverned_classes_and_what_governs_them_instead:
      - class: U1 -- publicly computable NON-homomorphic maps with source G
        governed_by: nothing here; this is resource R1 and it is the surviving lane
        status: open, and it is the largest lane in the field
      - class: U2 -- maps whose source is not a group (x-line, curve equation, j-line, isogeny graph)
        governed_by: k-independence of curve-only data (DECOMPOSITION L7's obstruction)
        status: closed for the k-question; live as instrumentation
      - class: U3 -- maps homomorphic only on a subset S of G
        governed_by: >-
          Balog-Szemeredi-Gowers plus Freiman-Ruzsa structure theory in Z/N at CONSTANT
          density; NOTHING at density N^{-c}
        status: >-
          GENUINELY OPEN and it is this task's single forward-guidance item. Named in
          IDEA-20260811-00391a claim (F) with its heuristic H2 and a validation route.
      - class: U4 -- maps defined over F_{p^k} rather than F_p
        governed_by: >-
          Galois-character rigidity: Hom between the two Frobenius eigenspaces vanishes
          unless p^k = 1 mod N, so the price is exactly the embedding degree
        status: closed, at the same price MOV pays
      - class: U5 -- maps into non-abelian groups
        governed_by: the image of a cyclic group is abelian, so the map factors
        status: closed in one line
      - class: U6 -- maps whose source is a tuple of instances
        governed_by: the preprocessing frontier (Corrigan-Gibbs-Kogan)
        status: out of scope here; it is axis A3's object
      - class: U7 -- homomorphisms out of the FULL group into an N-coprime target
        governed_by: >-
          O-EXPONENT (IDEA-20260811-18bb47 claim (C)): coprime exponents force
          triviality on G, information-theoretically and without any computability
          hypothesis
        status: closed, with the Tate-Lichtenbaum pairing as the worked example
    relation_to_prior_art: >-
      IDEA-20260727-005 already enumerated maps out of G by TARGET (Chevalley-Barsotti:
      unipotent, toric, abelian-variety) and already named the non-algebraic lane as the
      survivor. This task's contribution is the SOURCE-side enumeration, the quantifier
      statement, the cyclicity/k_emb equivalence, O-EXPONENT, and the U3 crack. A
      reviewer who locates any of those five in 005 should treat the corresponding part
      of IDEA-20260811-00391a as a rediscovery, and the record says so in its own
      discriminated_from field.

