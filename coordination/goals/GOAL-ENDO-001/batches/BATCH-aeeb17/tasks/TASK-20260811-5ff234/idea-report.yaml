      this session -- Sylow cyclicity, the Weil-pairing divisibility, the Frobenius
      eigenspace splitting, the fibre-product degeneration, the coprimality triviality,
      and the group-order arithmetic behind the point count. The claims marked [open]
      -- above all the exact point-count identity N_3 = p^2 - p + t^2 + B and its
      stratum-constant boundary term -- are predictions with declared tests. Two facts
      are RELAYED rather than derived and are flagged in their records: the Frobenius
      eigenvalue decomposition of E[N] (relayed via IDEA-20260807-569c82's own flagged
      relay) and the Weil character-sum constant. One prediction (the Jacobi-sum
      evaluation for CM curves) is relayed and is deliberately isolated so its failure
      does not contaminate its record.
    dominated_by: >-
      As attacks: every record in this batch is dominated by every row of the frontier
      the program maintains, because none of them is an attack. Checked row by row:
      parallel Pollard rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-discounted variant at
      0.886 sqrt(N/r) with r at most 6 (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N)
      memory (KN-TECH-031); the preprocessing frontier at N^{1/3} online with N^{1/3}
      advice, S T^2 = Omegatilde(N) (Corrigan-Gibbs-Kogan, charged in DEC-20260727-008);
      and, on the k_emb = 1 family only, MOV / Frey-Ruck transfer into F_p^*
      (KN-TECH-032). No row is left unchecked and dominated_by is NOT set to null
      anywhere in this batch.
      As theory: IDEA-20260811-00391a is partially dominated by IDEA-20260727-005, whose
      target-side classification already covers the residual case; IDEA-20260811-01a208
      is partially dominated by IDEA-20260807-e41559 (non-isogeny) and
      IDEA-20260808-45af43 (splitting obstruction); IDEA-20260811-18bb47 is partially
      dominated by IDEA-20260727-005 and IDEA-20260807-569c82; IDEA-20260811-157d66's
      force comes entirely from Weil's theorem, which it claims no credit for. Only
      IDEA-20260811-04a75a is, on the evidence of the greps recorded above, dominated by
      nothing in this repository -- and it is dominated on MATURITY by every existing L1
      measurement, since those exist and it does not.
    sota_delta: >-
      ZERO, quantitatively and in every record. No attack, no speedup, no exponent, no
      change to any cost function against any curve. The two non-zero deltas in the
      batch are both against the campaign's OWN instruments and are stated as such:
      (i) IDEA-20260811-04a75a offers an exact integer measurement of relation yield at
      O(p^2) field operations in place of a sampled solver proxy at O(p^3), which is an
      instrument cost improvement and not an attack cost improvement; (ii)
      IDEA-20260811-01a208 offers an exact factor of 2 in relation search across a
      two-target twist pair, which is a constant and is filed as a constant.
    enumerated_closures:
      - name: O-EIGENSPLIT
        object: mixed-label solutions of the shared summation polynomial
        mechanism: >-
          Applying Frobenius to a relation mixing the two eigenspaces and adding and
          subtracting forces each part to sum into E[2]; so the mixed relation is
          equivalent to one relation on each curve separately and carries the zero
          congruence modulo the odd prime N.
        forward_guidance: >-
          Remaining open in the neighbourhood: relations mixing eigenspaces over a
          LARGER extension, where more than two eigenvalues are available, which is a
          different object and belongs to the trace-zero material already recorded as a
          negative (P1501); and mixed relations at m greater than 3, where the 2-torsion
          remainder is larger.
      - name: O-EMPTYFIBRE
        object: the fibre product E x_{P^1} E^d over F_p
        mechanism: >-
          A rational point requires f(x) to be simultaneously a square and d times a
          square with d a non-square, forcing f(x) = 0. The fibre product therefore has
          rational points only over the 2-torsion, so there is no correspondence to push
          relations along.
        forward_guidance: >-
          Remaining open: fibre products over the x-line with covers of DEGREE greater
          than 2, which are IDEA-20260727-005's E3 cover exits and are closed there on
          cost rather than on emptiness.
      - name: O-LABELLOSSLESS
        object: the twist-label function chi(f(x))
        mechanism: >-
          Pointwise equality of labels forces f g to be a square polynomial, by a
          Hasse-Weil count on w^2 = f g; separability and monicity then force f = g. So
          the label determines the curve and the projection discards nothing.
        forward_guidance: >-
          Remaining open: labels of HIGHER-DEGREE characters, or labels of tuples rather
          than points, which are not covered by a one-dimensional counting argument.
      - name: O-WEILFLAT
        object: the Fourier spectrum of the twist-label function
        mechanism: >-
          Weil's character-sum bound makes every nontrivial additive and multiplicative
          coefficient O(sqrt(p)) uniformly in the curve, while a matched random label
          has maximum coefficient of order sqrt(p log p); so the two halves of the
          x-line are character-indistinguishable beyond the noise floor.
        forward_guidance: >-
          Remaining open: higher-order correlations and statistics of tuples, which no
          one-dimensional character bound touches. This is the honest boundary of the
          closure and it is stated three times in the record because it is the boundary
          a reader is most likely to overrun.
      - name: O-EXPONENT
        object: homomorphisms out of E(F_p) into an N-coprime target
        mechanism: >-
          For R in G, the image satisfies both psi(R)^N = 1 and psi(R)^{exp(A)} = 1;
          coprime exponents force psi(R) = 1. Information-theoretic, with no
          computability hypothesis needed.
        forward_guidance: >-
          Remaining open: targets whose exponent IS divisible by N, which is exactly
          IDEA-20260727-005's three-class classification and is closed there on cost per
          class rather than on triviality.
      - name: >-
          The scope boundary of H-ENDO-001 (no obstruction code assigned; it is a scope
          statement, not an obstruction)
        object: the class of maps the filter's argument reaches
        mechanism: >-
          Scalarity needs only that the N-Sylow of E(F_p) is cyclic; the alternative
          forces mu_N into F_p and hence embedding degree 1, which is the MOV-broken
          family. The filter and the MOV predicate are one arithmetic condition in two
          languages.
        forward_guidance: >-
          Remaining open, and it is the batch's single named crack: publicly computable
          PARTIAL homomorphisms defined on a subset of G of density N^{-c}. Constant
          density is handled by Balog-Szemeredi-Gowers plus Freiman-Ruzsa in Z/N;
          sub-polynomial density is handled by nothing the record could find.
    open_directions_for_the_next_session:
      - >-
        RUN IDEA-20260811-04a75a's stage 0 and stage 1. It is a few minutes of exact
        integer arithmetic at p = 4001 and it either confirms an identity that derives
        the gating lane's central prediction, or produces a within-stratum residual that
        reopens the lane. Both outcomes are worth more than any further ideation on this
        axis.
      - >-
        Settle the U3 crack: is there a publicly computable partial homomorphism out of
        G at density N^{-c}? This is the one place the admissibility filter is silent
        and it has never been examined in this campaign. It is a THEORY question and
        needs no compute.
      - >-
        Extend the point count to m = 4 if m = 3 survives (rejected_objects R8).
      - >-
        Re-do the coset dichotomy in the COMPOSITE-order setting, where the primality of
        N is used essentially and the argument does not transfer.
      - >-
        Confirm the two relayed facts flagged across this batch: the Frobenius
        eigenvalue decomposition of E[N] for ordinary curves, and the Weil character-sum
        constant. Both are cheap literature checks and both are load-bearing for one
        prediction each.
      - >-
        Perform the external literature search this session could not: the point count of
        a summation-polynomial variety is the one claim in the batch with no internal
        prior art, and it is exactly the kind of claim the index-calculus literature may
        already contain.

