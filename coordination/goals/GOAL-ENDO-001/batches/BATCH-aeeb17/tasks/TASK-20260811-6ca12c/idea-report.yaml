  rejected_candidate_objects:
    - object: >-
        THE SCALAR FIBRE COSET k + n as a subset of O (the set of endomorphisms
        acting on G as multiplication by k).
      why_it_looked_promising: >-
        It reformulates ECDLP as "find any element of an unknown coset of an
        index-N sublattice of O", which is a lattice problem and invites
        lattice machinery.
      reason_rejected: >-
        FAILS THE LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2).
        The coset k + n determines k exactly, so the projection discards
        nothing; it is a change of coordinates, not a new object. Recorded here
        rather than filed, because the test costs nothing and its outcome is the
        useful part.
    - object: >-
        THE NORM-HEIGHT mu(k) = min{Nrd(alpha) : alpha = k mod n}, a
        submultiplicative height on Z/N induced by the ring structure of O.
      why_it_looked_promising: >-
        Genuinely lossy (many k share a minimal norm), propagates by exact
        inequalities mu(k1 k2) <= mu(k1) mu(k2), and has the shape of the object
        behind meet-in-the-middle smoothness arguments in the exemplar paper.
      reason_rejected: >-
        Its congruence content is exactly the ring surjection lambda : O -> Z/N,
        which is PUBLICLY COMPUTABLE in polylog time -- so it is the
        endomorphism-image oracle of KN-FIND-b7e091 (Oracle D) in new notation.
        A meet-in-the-middle over alpha = u + v*theta with the group-based test
        [lambda]P =? Q reduces to a generic MITM over Z/N at exponent 1/2 with
        no new congruence, which is H-ENDO-001 exactly. Rejected as closed at
        exponent 1/2 by an existing finding, EXTENDED to a new object rather
        than re-litigated, per the standing constraint.
    - object: >-
        THE FAMILY OF CLASSES WITH N | h(O) as a discriminating nearby object,
        separating "no bridge because of the size/coprimality accident" from "no
        bridge for a structural reason".
      why_it_looked_promising: >-
        A clean two-explanation discriminator with a cheap toy construction.
      reason_rejected: >-
        NEAR-DUPLICATE. IDEA-20260807-bbdcf3 already names it as escape regime
        E1, already states its construction at toy scale, and already predicts
        the outcome. Filing it again would be the rediscovery failure mode the
        handoff names as the single most costly available. The structural half
        of the question is answered instead inside IDEA-20260811-319a07, which
        shows k lives in the kernel of the ray-class extension where no size
        obstruction applies at all -- a strictly stronger answer than the
        experiment would have given.
    - object: >-
        AN EQUIVARIANT BRIDGE k |-> [a]^k in Cl(O), so that vectorization
        inverts an exponentiation and the class-group discrete logarithm
        (Hafner-McCurley, subexponential) finishes the job.
      why_it_looked_promising: >-
        It is the one bridge shape that would evade the Hom = 0 obstruction,
        since Z -> Cl(O) by k |-> [a]^k is a genuine homomorphism from Z and is
        non-constant.
      reason_rejected: >-
        Computing [a]^k from Q without knowing k requires an operation that
        drives the class-group action by a hidden scalar carried in a point.
        No such operation exists in the model, and the record that would state
        this is exactly IDEA-20260811-319a07's coordinate obstruction, where it
        is folded in as clause D5 with the subexponential prize stated as a
        conditional. Filing it separately would have duplicated 319a07.
    - object: >-
        THE WEIL / TATE PAIRING as a bridge from the point group to the class
        group.
      why_it_looked_promising: >-
        Pairings are the standard way to move information out of a point group.
      reason_rejected: >-
        They land in mu_N inside F_{p^k}^*, not in Cl(O). That is lane L8 /
        resource R7 and the classical MOV-Frey-Ruck setting, which
        DECOMPOSITION.md already scopes; it is not a class-group bridge and
        pretending otherwise would be a category error of the kind this axis
        exists to catch.
    - object: >-
        LENSTRA'S ISOMORPHISM E(F_p) -> O/(pi - 1) COMPUTED WITH A DL ORACLE, as
        a Direction-1 mechanism.
      why_it_looked_promising: >-
        The isomorphism is the coupling between the point world and the ring
        world, and computing it looks like it should buy something.
      reason_rejected: >-
        The O-module structure on the prime-order subgroup is ALREADY public:
        theta acts on G as a scalar computable in polylog time from (t, D, f,
        N), because pi acts as the identity on G. So a DL oracle adds nothing
        the public data does not already give. The observation is folded into
        IDEA-20260811-45676a's simulation lemma, where it does real work, rather
        than filed as a mechanism it is not.
    - object: >-
        NON-UNIFORM / PREPROCESSING VARIANTS of the self-addressing barrier
        (advice consisting of precomputed blind in-class curves).
      why_it_looked_promising: >-
        Advice defeats the "the reduction knows its own walk" argument.
      reason_rejected: >-
        It does not help -- advice supplies k-INDEPENDENT blind curves, and a
        Direction-2 bridge needs a k-DEPENDENT one -- and, more importantly, the
        preprocessing model is axis A3's territory (RQ-MTGT-2cabee, resource R8,
        lane L13) in this same batch. Folded into IDEA-20260811-40c0b5's
        quantifier audit as one clause rather than filed, to avoid colliding
        with a sibling task.
    - object: >-
        THE CANONICAL-REPRESENTATIVE MAP gamma : Cl(O) -> (Z/N)^*/{+-1} taking
        each class to the multiplier of its reduced binary quadratic form.
      why_it_looked_promising: >-
        Unlike the raw cocycle, gamma is a well-defined function of the class,
        so it is the one gauge-fixed candidate bridge.
      reason_rejected: >-
        NOT REJECTED OUTRIGHT -- DEMOTED. It is not polynomial-time computable
        (the reduced form has norm up to about sqrt(|D|) = p^{1/2} and
        evaluating that isogeny costs its degree), so it cannot be a reduction.
        It survives as a MEASUREMENT inside IDEA-20260811-3d05e3, where its
        statistical structure is a cheap two-outcome test with a stated
        detection floor.

  p2_p3_flags_raised:
    P2:
      status: NONE RAISED
      detail: >-
        No filed record touches a factor base, phi-stable or otherwise. H-STR-002
        and its open replication obligation DEFER-BATCH009-001 are untouched in
        both directions by all six records. Pause condition P2 does not fire.
    P3:
      status: TWO RECORDS FLAGGED AS ADJACENT, NONE TRIGGERING
      records: [IDEA-20260811-40c0b5, IDEA-20260811-4e0422, IDEA-20260811-319a07]
      detail: >-
        Three records contain conditional statements whose consequent is an
        exponent below the p^{1/2} baseline: 40c0b5 states the lane's ceiling as
        p^{1/4} (the cost of the granted oracle's own elimination, not a
        candidate); 4e0422 section (D) states that a sub-baseline k-blind
