        session must stop, flag, and hand it to the Coordinator for an
        independent review-adversarial session rather than record a number. The
        Coordinator may wish to attach that routing instruction formally when
        archiving.
    admissibility_filter:
      status: ONE RECORD FLAGGED FOR EXPLICIT COORDINATOR ATTENTION
      record: IDEA-20260811-319a07
      detail: >-
        319a07's admissibility field is `admissible_with_a_caveat_stated_in_full`
        rather than a bare `admissible`, because the kernel of its exact sequence
        acts on the point exactly as H-ENDO-001 describes (an endomorphism acting
        as a scalar). The record states in full why that is not its content --
        its content is the diagram, the split, and the naming of the
        non-computable arrow -- and it treats H-ENDO-001's scalar collapse as an
        INPUT that makes its identification exact. A reviewer who disagrees
        should reject the record on that ground rather than on any other, and the
        flag is raised here so that the disagreement, if it exists, is cheap to
        find.
    taxonomy_request:
      record: IDEA-20260811-319a07
      detail: >-
        The record proposes a candidate NEW taxonomy sub-entry R5' -- level
        structure at the Frobenius modulus m = (pi - 1), whose norm is
        #E(F_p) -- rather than silently stretching R5 (which DECOMPOSITION.md
        scopes to ell != N). The decision is left to the Coordinator; the record
        also names R3 and R4 so it is not unlabelled in the meantime.

  honest_accounting:
    objects_considered:
      - the elimination ledger (query count and the price of not having asked)
      - the ray-class coordinate of a curve-with-level-structure pair
      - the (Z/N)^*-valued scalar cocycle on the class-group Cayley graph
      - the simulator's consistency obligation
      - the constructor's own ignorance (curve produced versus address computable)
      - the quantifier prefix of a claim, with elimination prices
      - the scalar fibre coset k + n (rejected, lossy-projection test)
      - the norm-height mu on Z/N (rejected, closed by KN-FIND-b7e091)
      - the canonical-representative map gamma (demoted to a measurement)
    depth_of_verified_structure: >-
      NONE VERIFIED. This session produced proposals only and executed nothing.
      Every claim in every filed record is labelled [fact] (elementary and
      verifiable) or [open] (to be tested), every external citation is marked
      as not re-verified this session, and every measured prediction is stated
      with a null object and a falsifier. No structure was verified at any tier,
      deterministic or probabilistic.
    dominated_by: >-
      Every filed record, considered as an attack, is dominated across time,
      memory and data/queries by every row of the prime-field frontier this
      campaign recognises: parallel Pollard rho with distinguished points at
      0.886*sqrt(N) group operations with O(1) memory (KN-TECH-001,
      KN-TECH-006); the automorphism-discounted variant at 0.886*sqrt(N/|Aut|)
      on CM curves (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory
      (KN-TECH-031); Pollard kangaroo at about 2*sqrt(W) on an interval of width
      W; van Oorschot-Wiener at sqrt(N^3/w) with memory w. On the adjacent
      vectorization axis they are dominated by meet-in-the-middle isogeny search
      at about h^{1/2}. Each row was checked individually. dominated_by is NOT
      null for any record and is not close to null.
    sota_delta: >-
      ZERO, quantitatively: 0.886*sqrt(N) group operations before this session
      and 0.886*sqrt(N) after, on every curve, with no change to any memory or
      query figure. Nothing here is an attack and none is claimed. The
      non-numeric delta, stated so it is not mistaken for a numeric one: one
      cost ceiling for a lane previously closed only inside models
      (IDEA-20260811-40c0b5); one algebraic object that fuses the lane's two
      worlds together with the exact sequence that splits its vectorization
      problem (319a07); one verified gap in a committed closure, patched
      (3d05e3); one barrier proposal for the direction where the cost argument
      is provably vacuous (45676a); one corrected falsification criterion for a
      committed record plus a named open problem replacing a vaguely named
      residual class (4e0422); and one priced quantifier lattice (503098).
    enumerated_closures:
      - closure: >-
          DIRECTION 2 IS DEGENERATE: no reduction from ECDLP to
          Cl(O)-vectorization can produce a result that is not already an
          oracle-free result.
        mechanism: >-
          The oracle's elimination cost (classical ordinary vectorization, about
          h^{1/2} = p^{1/4} time and memory) lies BELOW the baseline it is asked
          to beat (rho at p^{1/2}); inlining the elimination costs
          q*p^{1/4+o(1)} additive.
        scope_and_conditions: >-
          Conditional on the p^{1/4} vectorization cost (unverified externally
          this session; a literature check falsifies or confirms it at zero
          cost) and on knowledge of End(E). Memory-poor readings must recompute
          along van Oorschot-Wiener, where the margin disappears.
        forward_guidance: >-
          The only oracles worth studying in this lane are ones whose
          elimination cost EXCEEDS p^{1/2}. Two are named:
          ray-class vectorization (319a07), whose elimination cost is p^{1/2}
          precisely because it contains ECDLP, and k-blind in-class sampling
          (4e0422).
      - closure: >-
          THE MULTIPLICATIVE BRIDGE DOES NOT EXIST: the (Z/N)^*-valued scalar
          cocycle on the class-group Cayley graph defines no nontrivial
          homomorphism Cl(O) -> (Z/N)^*.
        mechanism: >-
          FULL HOLONOMY. Restricted to loops the cocycle equals lambda_alpha,
          the image of a generator under the surjective ring map O -> O/n =
          Z/N; surjectivity means every loop value is realisable, so the
          observed scalar is a function of the chosen path and not of the class.
        scope_and_conditions: >-
          Scoped to cocycles valued in the multiplier group. Says nothing about
          cocycles valued in ell-torsion structure for ell != N. Measured, not
          just derived: the toy-scale holonomy test in 3d05e3 falsifies it in an
          hour if it is wrong.
        forward_guidance: >-
          Move the cocycle's coefficients: the ell-torsion-valued cocycle is NOT
          gauge, because torsion coordinates identify the isogeny taken. That is
          resource R5 and it is the boundary of 45676a's barrier.
      - closure: >-
          NO REDUCTION OF SHAPE S: no reduction from Cl(O)-vectorization to
          ECDLP that uses only the N-primary point data exists relative to a
          transparent-point generic group action oracle.
        mechanism: >-
          The point data is simulable, because the multiplier assignment is a
          coboundary (the holonomy lemma above), so the simulator may choose the
          trivial one; the classical collision bound then gives
          Omega(sqrt(h)) = Omega(p^{1/4}) queries.
        scope_and_conditions: >-
          Model-relative: the model hides the j-invariants, which are public in
          reality. Proposed, not proved -- the simulation lemma is measured by
          3d05e3 and the collision argument is to be reproduced in-house rather
          than cited, since web search was unavailable.
        forward_guidance: >-
          The boundary is R5 (ell-torsion for ell != N), NOT R1 -- which
          contradicts the residual class every previous L10 closure names, and
          is the single most reusable output of this session.
      - closure: >-
          THE CORPUS'S FOLK OBSTRUCTION "curves and points are different
          objects" IS FALSE as a categorical statement.
        mechanism: >-
          E(F_p) = E[m] for m = (pi - 1)O, so pairs (curve, rational point) form
          a torsor under the ray class group Cl_m(O), and the exact sequence
          1 -> (O/m)^*/{+-1} -> Cl_m(O) -> Cl(O) -> 1 splits ray-class
          vectorization into ECDLP (kernel) times curve vectorization
          (quotient). The true obstruction is that exactly one arrow of the
          diagram -- the coordinate map psi from points to O/m -- is not
          computable, and computing it IS the ECDLP.
        scope_and_conditions: >-
          Scoped to O maximal and E[m] O-cyclic; simple transitivity is carried
          as a proof obligation tested by a counting identity, not asserted.
        forward_guidance: >-
          The computable part of psi is exactly the Pohlig-Hellman part, which
          is empty for prime N with trivial cofactor. Any partial computation of
          psi beyond it would give L_p(1/2) and is the lane's only remaining
          exponent-relevant target; the characteristic-zero branch of that
          target is already closed by IDEA-20260808-5158fa.
      - closure_correction: >-
          IDEA-20260807-5d7606's PUBLISHED FALSIFIER IS SATISFIABLE and its
          declared boundary is therefore wrong, although its mathematics stands.
        mechanism: >-
          Hash x(Q) into a short exponent vector over the split small primes and
          apply the class-group action: polynomial time given End(E), in-class
          by construction, and non-constant in k because the action is free.
        scope_and_conditions: >-
          Requires the factorisation of D. Does not contradict OBS-1, which is
          about bridges factoring through the subgroup lattice.
        forward_guidance: >-
          The corrected criterion has three conditions -- in-class, BLIND, and
          address-determines-enough-of-k -- and the binding one is blindness,
          isolated as BLIND-SAMPLE(p, t) whose cheapest known route costs
          exactly the rho baseline.
    open_directions_for_the_next_session:
      - >-
        ZERO-COST AND FIRST: verify the classical cost of ordinary-curve
        vectorization at fixed trace. Two rows of 503098's price table, the
        whole of 40c0b5, and part of 4e0422 turn on it. One literature check
        decides whether Direction 2 is degenerate or reopened.
      - >-
        ONE CPU-HOUR AND SECOND: run 3d05e3's holonomy measurement. It
        simultaneously tests 45676a's load-bearing lemma, calibrates against a
        quantity the corpus already trusts (the endomorphism scalar), and would
        reopen Direction 1 if holonomy is not full.
      - >-
        Is BLIND-SAMPLE(p, t) solvable below p^{1/2}, or lower-boundable in a
        restricted model (walk-and-point-count algorithms)? A lower bound makes
        the Direction-2 closure unconditional in that model; an upper bound
        reopens the lane and is of independent interest to the isogeny
        trusted-setup literature.
      - >-
        Extend the ray-class diagram of 319a07 to NON-MAXIMAL orders, where
        m = (pi - 1) may fail to be coprime to the conductor. The campaign's
        volcano lane (L2) lives entirely in that regime, so the extension is
        where 319a07 and L2 would meet.
      - >-
        The ell-torsion-valued cocycle for small ell != N, which both 3d05e3 and
        45676a name as the residual object and neither develops. It is the only
        object this session found that is NOT gauge, and it is resource R5,
        which the campaign's lane L7 owns but has not connected to L10.
      - >-
        Whether a barrier survives when the adversary also sees j-invariants.
        45676a's model hides them and says so; that is its largest honest
        weakness and closing it would be a materially stronger theorem.
      - >-
        For the Coordinator, not for a producer: the taxonomy question of R5'
        (level structure at the Frobenius modulus), and the routing of the three
        P3-adjacent conditionals listed above.

