  filed_records:
    - id: IDEA-20260811-25ad05
      class: mechanism
      answers_sub_question: >-
        (d) the deflation stated as a theorem, and (c) does level structure move
        any cost functional.
      one_line: >-
        The level structure is publicly samplable in p^{o(1)} -- and when
        E(F_p) is cyclic, constructible from the instance's own P via
        [c]R = P -- so its elimination cost is exponent 0 and every algorithm
        that merely receives it is simulated without it; separately, the seed's
        tracked object is a bijection modulo F_p-isomorphism and therefore
        FAILS the lossy-projection test of docs/inventor-protocol.md section 2.
      verdict_supported: T1, on two independent legs, with part (E) stating
        explicitly what T1 still needs (the algorithmic branch).
    - id: IDEA-20260811-34a6d8
      class: measurement
      answers_sub_question: >-
        (b) is there ANY publicly computable partial information about psi
        beyond the Pohlig-Hellman content of the cofactor.
      one_line: >-
        The quotient map E(F_p) -> E(F_p)/q E(F_p) is FREE (for q = n it is
        literally multiplication by the cofactor, since pi acts as the identity
        so n acts as the integer N); only the identification with F_{Norm(q)}
        costs sqrt(Norm(q)). Under the campaign's own prime-order-subgroup
        convention the computable part of psi yields EXACTLY ZERO bits of k for
        every cofactor c -- because psi(Q) = k*c vanishes modulo every prime
        ideal dividing c -- not the log2(c) the seed predicts. The seed's
        planted-signal control ("0 bits at c = 8 means the instrument is blind,
        run set INVALID") would, run as written, have discarded a correct
        instrument; it belongs on the full-group arm, where it is a genuine
        positive control.
      verdict_supported: T1 on the partial-information axis, with the T2 branch
        written as a pre-declared P3 stopping rule.
    - id: IDEA-20260811-9402e9
      class: control
      answers_sub_question: >-
        (a) the hard gate, the counting identity #X_m = #Cl_m(O).
      one_line: >-
        Both sides of the identity evaluate to h(O) * #(O/m)^* / #im(O^*) by
        elementary arguments that never mention the action, so the identity
        holds whether or not the action is simply transitive and cannot test it
        -- and it is USED AS A PREMISE in the freeness step, which is the
        cleanest statement of the circularity. Meanwhile the seed's [open]
        obligation is a three-line derivation for O maximal. The record swaps
        them: the identity becomes a regression fixture, and the
        orbit-and-stabilizer test (with a planted NON-TRANSITIVE control on
        which the identity must still pass) becomes the gate.
      verdict_supported: >-
        Neither T1 nor T2 directly -- it repairs the instrument the other three
        depend on, and it strengthens the seed's algebra while removing its
        experimental content.
    - id: IDEA-20260811-9bc805
      class: algorithm
      answers_sub_question: >-
        (c) does any cost functional move -- answered with exponents rather
        than with a shrug.
      one_line: >-
        The fusion supplies exactly one ECDLP algorithm: a birthday collision
        search on the pair torsor, correct, and costing
        sqrt(#Cl_m) = p^{3/4+o(1)} -- p^{1/4} WORSE than rho, because the
        fusion multiplies the search spaces (h * N) instead of splitting one.
        Restricting to the fibre IS rho at p^{1/2}; the Pohlig-Hellman
        decomposition of the extension gives max(p^{1/4}, p^{1/2}) = p^{1/2},
        exactly the baseline; and the only sub-exponential corner (index
        calculus in Cl_m) is blocked at a named step -- relations are
        computable, the TARGET has no computable ideal representative, and
        producing one is psi.
      verdict_supported: T1, quantitatively, over an enumerated algorithm family.

