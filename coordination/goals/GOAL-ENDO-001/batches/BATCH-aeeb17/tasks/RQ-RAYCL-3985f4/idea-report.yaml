  rejected_objects:
    - object: >-
        THE RAY-CLASS COORDINATE OF A PAIR (the seed's own tracked object,
        IDEA-20260811-319a07).
      considered_as: the obvious primary lens for this question.
      rejected_because: >-
        Fails the lossy-projection test. Given simple transitivity it is a
        BIJECTION X_m -> Cl_m(O), and what it discards -- the Weierstrass model
        and the point's affine coordinates -- is discarded by F_p-isomorphism,
        which is ECDLP's own symmetry group. So it is injective on the state
        space modulo the target's symmetry: a change of coordinates, not a new
        object. The seed's survival_score ("perfectly identifying", "not
        constant on the instance family") is the diagnostic rather than the
        virtue. Recorded, with its honest limit, as part (D) of
        IDEA-20260811-25ad05: this closes "new object", not "new algorithm",
        which is why IDEA-20260811-9bc805 exists.
    - object: >-
        THE COHOMOLOGY CLASS OF THE PAIR TORSOR (the class of X_m in H^1 of the
        acting group).
      considered_as: >-
        the natural "is the torsor split?" invariant, and the one place a
        genuine obstruction could have lived.
      rejected_because: >-
        The torsor is trivialised by any known element, and we have one for
        free: the instance's own pair (E, R) is a point of X_m produced from
        public data (IDEA-20260811-25ad05 Lemma 3). A torsor with a known
        rational point has trivial class by construction, so the invariant is
        identically zero and carries zero bits, on every instance. Zero
        discriminating power, and it fails the section-2 test in the opposite
        direction from the coordinate: it loses everything, including the
        answer.
    - object: >-
        THE RAY CLASS FIELD K_m AND ITS ARTIN SYMBOLS (the characteristic-zero
        lift at the LARGER modulus m = (pi - 1), as opposed to
        IDEA-20260808-5158fa's n = (N, pi - 1)).
      considered_as: >-
        a second, independent route to a partial computation of psi, and the
        natural "bigger modulus, more structure" move.
      rejected_because: >-
        The same computation 5158fa performs at n goes through verbatim at m:
        the canonical prime of K above p is (pi), whose Artin symbol is the
        class of pi mod m, and pi = 1 mod m BY THE DEFINITION OF m. So the
        symbol is trivial and p splits completely in K_m over the ring class
        field -- a strictly stronger instance of the closure 5158fa already
        records, at a modulus where it is even more immediate. Enlarging the
        modulus makes the obstruction MORE severe, not less. Recorded as a
        consistency cross-check in IDEA-20260811-25ad05's discriminated_from,
        deliberately NOT filed as a record of its own, because a record whose
        content is "5158fa's argument also works here, faster" is a repackaging.
    - object: >-
        THE FILTRATION BY INTERMEDIATE MODULI (level structures at each divisor
        d | m, and the graded pieces of the resulting tower).
      considered_as: >-
        a way to get a Pohlig-Hellman-style ladder on the torsor.
      rejected_because: >-
        Each level is publicly samplable by exactly the argument of
        IDEA-20260811-25ad05 Lemma 1-2 (the density is the Euler product over
        the primes dividing that divisor), so the whole tower has elimination
        cost p^{o(1)}; and the graded pieces are precisely the per-prime
        components already priced in IDEA-20260811-34a6d8, where their
        information content about k is measured at zero. The object is a
        repackaging of two records that already exist, in new notation -- the
        exact regression docs/inventor-protocol.md section 1 warns about.
    - object: >-
        FROBENIUS AT AN AUXILIARY PRIME q != p, as a source of a computable
        character on the torsor.
      considered_as: the one escape 5158fa leaves open on availability grounds.
      rejected_because: >-
        Not computable from (E, P, Q) over F_p: it needs the reduction of the
        lifted point at q, which is not available. This is 5158fa's escape (iii)
        and it is closed on availability, not on cost. Re-filing it would be
        re-treading a recorded closure.
    - object: >-
        THE SPECTRAL DATA / EXPANSION CONSTANT OF THE Cl_m(O)-CAYLEY GRAPH ON
        X_m, tracked as the walk's generating set is varied.
      considered_as: >-
        the only route by which the p^{3/4} torsor walk could be pushed down.
      rejected_because: >-
        Expansion changes constants and mixing time, not the birthday exponent,
        so the best it could do is improve the constant in front of an algorithm
        that is already p^{1/4} above the baseline. Its ONE interesting branch
        -- sub-birthday collision behaviour -- is already written into
        IDEA-20260811-9bc805 as an explicit falsifier and P3 stopping condition,
        which is the honest place for it. Filing it as a separate object would
        have produced a record whose only content is "measure the constant".
    - object: >-
        THE LEVEL STRUCTURE TAKEN UP TO Aut(E) (the automorphism-quotient
        refinement of X_m).
      considered_as: a finer object on curves with extra automorphisms.
      rejected_because: >-
        It is the automorphism discount already recorded as KN-TECH-018, where
        sqrt(6) is BASELINE CALIBRATION and never an exponent, and the standing
        constraints forbid treating it as one. Both sides of the counting
        identity move together under it (IDEA-20260811-9402e9's D_0 = -3, -4
        control uses exactly this), so it is also a demonstration that the
        identity is action-blind rather than a candidate object.
    - object: >-
        THE ORBIT-AND-STABILIZER PAIR (adopted, not rejected -- listed here for
        completeness of the enumeration).
      considered_as: the replacement gate.
      rejected_because: >-
        NOT REJECTED. It passes the section-2 test (the action table is not
        recoverable from the pair), it has a defined one-step propagation
        (adjoin a generator, recompute the orbit closure), and it dissolves at a
        stated boundary (the p^{3/2} enumeration budget). It is the tracked
        object of IDEA-20260811-9402e9.

  honest_accounting:
    objects_considered: >-
      Eight, enumerated in rejected_objects. Three were adopted as tracked
      objects of filed records -- the elimination cost of an auxiliary input
      (25ad05), the norm-graded component vector of psi (34a6d8), the
      orbit-and-stabilizer pair (9402e9), and the accumulated exponent vector of
