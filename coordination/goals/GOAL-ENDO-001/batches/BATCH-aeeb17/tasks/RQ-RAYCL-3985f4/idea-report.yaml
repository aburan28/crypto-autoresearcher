      enumeration for the ECDLP (KN-OPEN-019), so the family-to-object mapping
      used here is a sketch and not a taxonomy, and the off-limits lists in each
      record say so.
    depth_of_verified_structure: >-
      NOTHING IN THIS SESSION IS VERIFIED. Zero runs were performed (the handoff
      allowed none) and this session has no Bash, so no computation of any kind
      was executed. Every quantitative statement in the four records is either
      (i) a symbolic derivation at `derivation` tier under
      docs/claims-and-verification.md -- a checkable argument, never "proved" --
      or (ii) a PREDICTION with a pre-registered falsifier. Two of the
      derivations rest on facts relayed at [recall-confident] and NOT externally
      verified (Lenstra's CM structure theorem; the Deuring/Waterhouse count),
      and all four records inherit that status explicitly. The strongest honest
      description of this deliverable is: an argued, falsifiable T1 case with
      its measurements specified and none of them taken.
    dominated_by: >-
      NOT NULL, and checked row by row across time, memory and data/queries
      against every entry of the prime-field frontier this campaign recognises:
      parallel Pollard rho with distinguished points (0.886*sqrt(N) group
      operations, O(1) memory -- KN-TECH-001, KN-TECH-006); automorphism-
      discounted rho on CM curves (0.886*sqrt(N/|Aut|) -- KN-TECH-018, where
      sqrt(6) is calibration and never an exponent); BSGS (sqrt(N) time and
      sqrt(N) memory -- KN-TECH-031); Pollard kangaroo on an interval of width W
      (about 2*sqrt(W)); van Oorschot-Wiener at sqrt(N^3/w) with memory w.
      Three of the four records mount no attack at all and are dominated by
      every row on time. The fourth (IDEA-20260811-9bc805) DOES exhibit an
      algorithm, at p^{3/4+o(1)} time and O(1) memory, and it is Pareto-dominated
      by parallel rho on the full vector: it ties on memory, loses on time by
      p^{1/4}, and consumes no data or queries. There is no memory setting at
      which it wins (its van Oorschot-Wiener curve is p^{9/4}/w^{1/2} against
      rho's p^{3/2}/w^{1/2}).
    sota_delta: >-
      ZERO, quantitatively: 0.886*sqrt(N) group operations with O(1) memory
      before this session, 0.886*sqrt(N) with O(1) memory after. No exponent
      moves in the favourable direction anywhere in the four records. The
      negative delta is stated too, because it is a real number rather than a
      hedge: the one algorithm produced costs p^{3/4+o(1)}, i.e. p^{1/4} MORE
      than the incumbent. The session's contribution is entirely in the
      structure of the argument and in three corrections to a filed record
      (the vacuous gate, the discharged [open] obligation, the mis-specified
      bit count and its planted-signal control).
    enumerated_closures:
      - closure: >-
          THE LEVEL-STRUCTURE-AS-ADVICE FAMILY IS CLOSED. Mechanism: a
          (pi - 1)-level structure is producible from public data with the
          correct distribution in O(log p * log log p) group operations (density
          rho_m = prod (1 - 1/Norm(q)) >= 1/(C log log p) by Mertens, plus
          rejection sampling), and when E(F_p) is cyclic a generator R with
          [c]R = P is constructed from the instance's own base point. Therefore
          any algorithm receiving such a structure is simulated by one that does
          not, at additive p^{o(1)} cost, per instance and not merely on
          average. FORWARD GUIDANCE: what remains open is the class of auxiliary
          structures CORRELATED WITH THE SECRET -- exhibit an element of X_m
          that public sampling cannot reproduce and whose possession helps.
          Record: IDEA-20260811-25ad05.
      - closure: >-
          THE RAY-CLASS COORDINATE IS NOT A NEW OBJECT. Mechanism: given simple
          transitivity it is a bijection onto Cl_m(O), and its only losses are
          the Weierstrass model and the point's affine coordinates -- data
          quotiented out by F_p-isomorphism, which is ECDLP's own symmetry
          group. A projection injective modulo the target's symmetry is a change
          of coordinates (docs/inventor-protocol.md section 2). FORWARD
          GUIDANCE, AND IT IS A REAL LIMIT: this closes "new object", NOT "new
          algorithm" -- a bijective re-coordinatisation can carry content when
          the new coordinates support new operations, which is exactly how index
          calculus beats generic search. Record: IDEA-20260811-25ad05 part (E).
      - closure: >-
          THE COUNTING IDENTITY IS NOT A GATE. Mechanism: #X_m and #Cl_m(O) both
          evaluate to h(O) * #(O/m)^* / #im(O^* -> (O/m)^*) by derivations that
          never mention the action -- one geometric (curves x generators /
          automorphisms), one ideal-theoretic (the elementary exact sequence) --
          so the identity holds under both the transitive and the
          non-transitive hypothesis and is an observation collision under
          section 8 audit 2. It is moreover a PREMISE of the freeness step, so
          it cannot be that step's test. FORWARD GUIDANCE: keep it as a
          regression fixture; use orbit size and stabilizer order as the gate,
          with a planted NON-TRANSITIVE control on which the identity must still
          pass. Record: IDEA-20260811-9402e9.
      - closure: >-
          THE COMPUTABLE PART OF psi CARRIES ZERO BITS OF k UNDER THE CAMPAIGN'S
          INSTANCE CONVENTION. Mechanism: for a full generator R with [c]R = P,
          psi(Q) = k*c, which vanishes modulo every prime ideal q dividing c;
          the only component carrying information about k is the one at
          n = (N, pi - 1), and computing it costs Theta(sqrt(N)), i.e. the
          baseline. The quotient MAP is free; only the identification with
          F_{Norm(q)} is expensive. FORWARD GUIDANCE: the enumeration covers
          components at primes dividing m within a budget; what remains open is
          joint functions of several components, and functions of x(Q) as a
          field element (the latter routed to KN-FIND-b7e091 and
          IDEA-20260807-413fcc, which are extended and never revisited).
          Record: IDEA-20260811-34a6d8.
      - closure: >-
          NO WALK ON THE TORSOR BEATS rho, AND THE SUB-EXPONENTIAL CORNER IS
          BLOCKED AT A NAMED STEP. Mechanism: the computable group elements are
          small-split-prime classes and known kernel scalars, so every
          torsor-based algorithm is a Cayley-graph walk whose cost is the
          birthday bound of the subgroup it uses -- p^{3/4} (full group, since
          #Cl_m = h * #E = p^{3/2}), p^{1/2} (kernel, which IS rho), p^{1/4} but
          k-free (quotient), p^{1/2} (two-stage Pohlig-Hellman over the exact
          sequence). Index calculus in Cl_m(O) has computable RELATIONS (a
          smooth principal (alpha) gives both its factorisation and alpha mod m)
          but no computable representative for the TARGET class, and producing
          one is psi. FORWARD GUIDANCE: three named ways out, each a P3 event if
          it fired -- a generating set with sub-birthday collision behaviour; a
          computable homomorphism from Cl_m(O) onto a small group nontrivial on
          the kernel (the char-p analogue of what IDEA-20260808-5158fa closes in
          char 0 and IDEA-20260811-34a6d8 measures at zero bits); and a method
          of producing a target ideal representative. Record:
          IDEA-20260811-9bc805.
    what_is_NOT_closed: >-
      Stated explicitly so this session's output is not read as more than it is.
      (i) Non-maximal orders: every derivation here is scoped to O maximal, and
      for f_E > 1 the ideal theory needs proper ideals and m may share the
      conductor -- simple transitivity is genuinely open there. (ii) The two
      relayed facts remain externally unverified and everything inherits that.
      (iii) The algorithm enumeration covers WALKS over the computable
      generating set; it is not a lower bound and covers nothing outside that
      family. (iv) Nothing here says ECDLP is hard, and nothing here bears on
      any deployed curve. (v) None of the four records has been run: every
      exponent and every bit count is a prediction with a falsifier, not a
      measurement.
    open_directions_for_next_session:
