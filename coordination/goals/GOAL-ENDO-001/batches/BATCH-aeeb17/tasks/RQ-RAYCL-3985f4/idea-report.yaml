      It attacks the sub-question the question record itself names as the
      sharpest T1/T2 discriminator, and it is the only test in this session
      whose two outcomes correspond to two DIFFERENT verdicts rather than to
      "confirmed" and "bug". A measured 0 in Arm I with Arm II firing at
