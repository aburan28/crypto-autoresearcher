  axis_coverage:
    channel_1_modular_curves_as_the_surface:
      status: answered, with both a closure and one measurable survivor
      answer: >-
        YES, such a scheme exists -- it is the published subexponential method for computing
        endomorphism rings of ordinary curves. It solves for the class group / endomorphism
        ring, i.e. the Cl(O)-QUOTIENT direction of an extension whose KERNEL direction is
        where k lives. It computes nothing about k, and the obstruction is that index
        calculus's target-decomposition stage requires a monoid structure that a torsor does
        not have (IDEA-20260811-e6399d). The one thing left open in the modular direction is
        whether a LOW-DEGREE coset invariant exists in Tate-normal-form coordinates; that is
        measurable and is IDEA-20260811-d69ebe.
    channel_2_function_field_and_drinfeld:
      status: answered, both halves, as "it does not transfer and here is the exact step"
      answer: >-
        DRINFELD HALF: the ingredient is F_q-linearity of the module action in the exponent
        (conditions D1-D3); the failing step over F_p is D3, linearity, not representability;
        the CM order cannot substitute, and the rank-2 torsion substitution is closed by an
        explicit eigenvalue computation. The one elliptic setting where the ingredient
        survives is N = p, already known (IDEA-20260811-e2accc). HIGH-GENUS HALF: the
        ingredient is a free genus parameter; three candidate sources over F_p are closed at
        named steps and the fourth, the level-N modular curve, is priced at Omega(N) against
        0.886*sqrt(N) (IDEA-20260811-e64549).
    channel_3_ordinary_shadow_of_the_quaternion_method:
      status: answered, and the intuitive framing is corrected
      answer: >-
        The p^{1/3} argument consumes (i) a canonical target E^{(p)} computable without the
        answer, (ii) a rigorously SHORT target relative to the graph size, and (iii) a
        BRANCHING graph in which smooth isogenies of degree <= X number X^2. Over F_p: (i)
        degenerates because E^{(p)} = E, making OneEnd free; (ii) becomes Minkowski's
        sqrt(|D|), which equals the generic distance, so there is no slack; (iii) collapses to
        X^{1+o(1)} because horizontal isogenies correspond to ideals. The three together give
        exactly p^{1/4} = sqrt(h), the known ordinary algorithm. So commutativity does not
        kill the method: it makes the isogeny problem EASIER and severs it from the ECDLP by
        transport (IDEA-20260811-d8ff09).
    fourth_channel_not_requested:
      status: opened and closed inside e6399d
      answer: >-
        Class field theory was imported as a fourth channel (the marked class as a
        ray-class-type torsor in characteristic p). It is filed inside e6399d rather than
        separately, and it is explicitly discriminated from the corpus's existing
        characteristic-zero treatment (IDEA-20260808-5158fa).

