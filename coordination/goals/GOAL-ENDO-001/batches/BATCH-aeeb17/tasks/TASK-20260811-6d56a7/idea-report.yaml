    channel: 1 (modular curves as the surface)
    class: measurement
    one_line: >-
      Both recorded closures of the X_1(N) fibre coordinate are Galois-theoretic and every
      fibre point is F_p-rational, so neither bounds the minimal ALGEBRAIC DEGREE of a
      Delta_d-coset invariant in Tate-normal-form coordinates; that quantity has a derived
