    enumerated_closures:
    - closure: Index calculus over a factor base of curves or marked pairs cannot constrain k
      mechanism: >-
        Index calculus's target-decomposition stage requires a monoid structure on the objects
        being decomposed. The Cl(O) direction has one and is k-independent; the fibre
        direction carries k and is a torsor, which has no distinguished point and no
        multiplication. Named in IDEA-20260811-e6399d (D), with the one exception (the Tate
        self-pairing at embedding degree 1) identified.
      standard_met: >-
        Named obstruction, argument, and forward guidance (find an effective coordinate map;
        its unique known instance is a self-pairing). Not a count of rejected mechanisms.
    - closure: The exemplar's OneEnd problem is vacuous over F_p, and its template gives exactly the known sqrt(h)
      mechanism: >-
        E^{(p)} = E for an F_p-rational model, so Frobenius solves OneEnd for free.
        Commutativity then removes branching (X^2 -> X^{1+o(1)}, because horizontal isogenies
        correspond to ideals) and removes short-target slack (Minkowski's sqrt(|D|) equals the
        generic distance, whereas the exemplar's (p/2)^{1/3} beats it), and the two cancel to
        p^{1/4} = sqrt(h). Named in IDEA-20260811-d8ff09.
      standard_met: >-
        Named obstruction, quantitative argument with a two-row exponent table, and forward
        guidance naming the two quantities a future ordinary-exponent claim must move.
    - closure: The Drinfeld linear-algebra route reaches elliptic curves over F_p only in the anomalous case
      mechanism: >-
        The attack needs three conditions -- the exponent ring contains a field, the module is
        a vector space over it, the action is linear in the exponent -- and the third fails
        over F_p because k |-> [k]P is Z-linear and not linear over any proper coefficient
        set. Representability (base-b digits) is not linearity, and is already priced at BSGS.
        The conditions are restored exactly when N = p, via the formal logarithm. Named in
        IDEA-20260811-e2accc.
      standard_met: >-
        Named obstruction (condition D3), self-contained derivation, forward guidance (a
        transfer must restore D3 and say how), and a recorded observation collision that scopes
        the negative honestly.
    - closure: The high-genus function-field route has no free genus parameter over F_p, and its one canonical object is Omega(sqrt(N))-dominated
      mechanism: >-
        F_p has no proper subfield, so Weil descent has no input; isogenies preserve dimension,
        so the endomorphism ring cannot manufacture one; relations must be evaluated in one
        group, so a cross-class factor base gives size and not structure; and the level-N
        modular curve has genus forced to Theta(N^2), so any model costs Omega(N) against
        0.886*sqrt(N). Named in IDEA-20260811-e64549.
      standard_met: >-
        Three obstructions and one price, each with an argument, plus forward guidance
        isolating the single surviving escape (a function evaluable from the Tate normal form
        without a model) and handing it to a companion record.
