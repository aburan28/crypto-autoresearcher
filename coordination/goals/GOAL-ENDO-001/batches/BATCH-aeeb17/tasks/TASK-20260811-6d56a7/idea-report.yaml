      non-simulability of the chi_d oracle.
    resource: R1, R2 (+ argued sub-entry R2m, model of the MARKED pair)
    recommended_priority: medium
  - id: IDEA-20260811-d8ff09
    channel: 3 (the ordinary shadow of the quaternion method)
    class: mechanism
    one_line: >-
      E^{(p)} = E over F_p so the exemplar's target problem OneEnd is VACUOUS there; and the
      exemplar's template, specialised to ordinary curves, gives exactly p^{1/4} = sqrt(h)
      because commutativity removes branching (X^2 -> X^{1+o(1)}) and removes short-target
      slack (Minkowski's sqrt(|D|) IS the generic distance). Commutativity does not kill the
      method -- it makes the isogeny problem EASIER and severs it from the ECDLP by T1/T2.
    resource: R3, R4
    recommended_priority: high
  - id: IDEA-20260811-e2accc
    channel: 2 (function-field and Drinfeld analogues)
    class: mechanism
    one_line: >-
      The Drinfeld DLP is easy because the exponent ring F_q[T] CONTAINS F_q and the action
      is F_q-linear, so the unknown is a coordinate vector. Isolated into three necessary
      conditions D1-D3; over F_p all three fail and the essential failure is D3 (LINEARITY,
      not representability). The unique elliptic setting where they hold is N = p, so the
      Drinfeld gift and the anomalous-curve break are one phenomenon. Two CM substitutions
      closed, the second by the explicit eigenvalue computation diag(1, p mod N) on E[N].
    resource: R6 (part D), R5 (part E2)
    recommended_priority: medium
  - id: IDEA-20260811-e64549
    channel: 2 (function-field analogues, high-genus half) and 1
    class: mechanism
    one_line: >-
      The high-genus gift is that GENUS IS A FREE PARAMETER. Over F_p it fails at three named
      steps -- no proper subfield (no Weil descent input), isogenies preserve dimension (End
      cannot manufacture one), relations must be evaluated in ONE group (the class gives size,
      not structure) -- and the one canonical high-genus object, the level-N modular curve,
      has genus forced to (N-5)(N-7)/24, so any model costs Omega(N) against rho's
      0.886*sqrt(N). The Tate normal form costs O(log p), and that asymmetry is the only
      escape route, handed to d69ebe.
    resource: R1, R2, R7 (+ a proposed taxonomy COLUMN, dimension-preserving vs dimension-multiplying)
    recommended_priority: medium
  - id: IDEA-20260811-e6399d
    channel: 1 (modular curves as the surface)
    class: mechanism
    one_line: >-
      A j-invariant factor base with Phi_ell incidences is a real, published scheme and it
      computes the ACTING GROUP. The set of MARKED pairs in one ordinary class is simply
      transitive under an extension 1 -> (Z/N)^*/{+-1} -> Cl_n(O) -> Cl(O) -> 1, with k the
      kernel coordinate. Relation collection operates on the quotient. The obstruction is
      structural rather than a cost estimate: index calculus stage (iv) requires a MONOID and
      a torsor has none. One missing map named, with its unique known instance (the Tate
      self-pairing at embedding degree 1).
    resource: R3, R4
    recommended_priority: high

