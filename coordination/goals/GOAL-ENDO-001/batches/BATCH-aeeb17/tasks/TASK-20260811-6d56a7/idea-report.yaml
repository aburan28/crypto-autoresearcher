  honest_accounting:
    objects_considered:
    - The marked class of pairs (E', P') in one ordinary isogeny class, as a torsor under an extension of Cl(O) by (Z/N)^*/{+-1}
    - The coset of k in (Z/N)^*/Delta_d, i.e. the image of the marked pair in an intermediate cover X_Delta(N)
