  host_binding_enforceability_assessment:
    status: narrowed
    against_v5_threat_model: >-
      NARROWED, but LESS than the package claims. The emit procedure removes
      the caller's ability to supply values through the SCHEMA (the script
      reads host surfaces and accepts no arguments). However, the PATH
      manipulation finding (RT-J2-O1) shows a caller CAN supply values
      THROUGH the PROCEDURE by controlling PATH, which is within the v5
      threat model (caller-supplied bindings). The package's claim "a caller
      can no longer supply arbitrary host_binding values THROUGH the emit
      procedure" is FALSE: PATH manipulation is a way to supply values
      through the procedure. The self-attestation gap (RT-J2-O2) is disclosed
      and expected: a compromised session can hand-write a receipt. The
      CWD-dependence (RT-J2-O3) is partially disclosed: the script captures
      the CWD's filesystem, not a fixed host identity. So the narrowing is
      from "specifiable rule, no harness" to "emitted rule with runnable
      harness and declared verification, residual self-attestation gap
      disclosed, PLUS PATH manipulation gap NOT disclosed, PLUS CWD-dependence
      gap PARTIALLY disclosed." The PATH gap means the narrowing is incomplete
      against the v5 threat model.
    against_malicious_runtime_threat_model: >-
      NOT CLOSED. A compromised emitting session can hand-write a receipt
      with arbitrary values, run the script on a different host and paste the
      output, or manipulate PATH to make the script emit caller-supplied
      values. Independent reviewer verification (running hostname and df -P .
      on the same host) is the detection mechanism, not automatic enforcement.
      This is disclosed in the package for the self-attestation gap, but the
      PATH manipulation gap is NOT disclosed.
    coordinator_prior_vindicated: >-
      The coordinator's prior expected a self-attestation gap in J2 (VINDICATED:
      RT-J2-O2 is the expected disclosed limitation). The prior expected the
      STOP control to fire in J3 (VINDICATED: all three cases STOP correctly).
      The prior expected v2 optionality to weaken the missing-binding STOP
      (VINDICATED: the named weakening is confirmed). The prior did NOT
      anticipate the PATH manipulation finding (RT-J2-O1), which is a NEW,
      UNDISCLOSED defect that BREAKS the provenance claim. This is the
      surprise the coordinator said to treat skeptically: it is not "all
      three joints clean with no disclosed limitation" — J2 breaks on an
      undisclosed defect.

  narrowest_supported_statement: >-
    The independent J2 attack found that the emit procedure's provenance claim
    is violated by PATH manipulation: the script uses PATH-resolved hostname
    and df binaries, so a caller controlling PATH can make the script emit
    caller-supplied values for all three host_binding fields through the
    procedure. This is within the v5 threat model (caller-supplied bindings)
    and is not disclosed in the package. The self-attestation gap is
    confirmed and disclosed (a compromised session can hand-write a receipt).
    The demo receipt is consistent with a real script run but indistinguishable
    from a hand-written one. The J3 attack confirmed the v5 STOP fires
    correctly in all three required cases (caller-supplied, missing,
    v1-under-v2), with the named weakening (schema-validity != binding-rule
    satisfaction) disclosed. No new v2-specific escape was found that defeats
    the binding rule when evaluated. The empty-string/null gap (RT-J3-O1) is a
    non-blocking observation about the missing_receipt_field rule's coverage.
    The proves-too-much control passed: all three known-false objects were
    rejected. HOST-BINDING-ENFORCEABILITY is narrowed from "specifiable rule,
    no harness" to "emitted rule with runnable harness and declared
    verification, residual self-attestation gap disclosed, PLUS PATH
    manipulation gap not disclosed," against the v5 threat model
    (caller-supplied bindings). Against a malicious-runtime threat model: not
    closed. This statement is limited to the exact static package and creates
    no scientific, status, or authorization result.

