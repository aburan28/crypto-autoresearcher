    network_used: false

  j2_attack_plan:
    joint: J2-emit-procedure-verifiability-and-demo-reality
    verdict: breaks
    items:

      - item: 1
        attack: >-
          Follow the procedure EXACTLY (honest path) and verify the script
          produces real host_binding values.
        construction: >-
          Ran `sh emit_host_binding.sh` from the worktree root. Captured
          stdout and exit code. Compared output to the host's own identity
          surfaces (hostname, df -P .).
        expected: >-
          Script exits 0 and emits a JSON block with host_id, filesystem_id,
          filesystem_mount matching the host's surfaces.
        observed: >-
          Exit code 0. Output:
          {"schema":"crypto.autoresearch.runtime_session_receipt.v2","host_binding":{"host_id":"Adams-MacBook-Pro.local","filesystem_id":"/dev/disk5s1","filesystem_mount":"/Volumes/SSD990"},"emitted_at":"2026-08-30T02:45:01Z"}
          Values match hostname (Adams-MacBook-Pro.local) and df -P .
          (/dev/disk5s1, /Volumes/SSD990).
        result: honest_path_confirmed

      - item: 2
        attack: >-
          DEVIATE: hand-write a receipt with caller-supplied values and
          evaluate whether the v5 binding_rule_v2 detects the forgery.
        construction: >-
          Constructed a forged receipt with host_id="evil-host.example.com",
          filesystem_id="/dev/fakedev", filesystem_mount="/mnt/fake". Evaluated
          against binding_rule_v2 with a matching caller-supplied
          host_observation.
        expected: >-
          If the host_observation is independently produced (from the host's
          surfaces), the binding_rule_v2 rejects (inequality). If the
          host_observation is caller-supplied (matching the forged receipt),
          the binding_rule_v2 PASSES on equality but the source rule is
          violated.
        observed: >-
          With a caller-supplied host_observation matching the forged receipt,
          binding_rule_v2 PASSES (equality holds). The source rule ("emitted
          by the runtime harness at session start") is VIOLATED but NOT
          automatically detected. This is the self-attestation gap, which IS
          disclosed in the package (what_this_does_not_attest, limitation).
        result: self_attestation_gap_confirmed_disclosed

      - item: 3
        attack: >-
          DEVIATE: run the script from a different mount point and paste the
          output into a receipt on the real host.
        construction: >-
          Ran `sh emit_host_binding.sh` from /tmp (which resides on a
          different filesystem: /dev/disk3s5, /System/Volumes/Data). Compared
          output to the worktree-root run.
        expected: >-
          If the script captures the CWD's filesystem (not a fixed host
          identity), running from a different mount produces different
          filesystem_id and filesystem_mount values.
        observed: >-
          DIFFERENT VALUES when run from /tmp vs worktree root:
          - From /tmp: filesystem_id=/dev/disk3s5, filesystem_mount=/System/Volumes/Data
          - From worktree: filesystem_id=/dev/disk5s1, filesystem_mount=/Volumes/SSD990
          The script captures the CWD's filesystem, not a fixed host identity.
          A session could run the script from a different mount and paste the
          output, producing values that are REAL (from the script) but from a
          different filesystem. This is PARTIALLY disclosed: the schema says
          "the filesystem device identifier of the working directory the
          procedure runs in," but the paste-from-different-mount attack is not
          explicitly called out.
        result: cwd_dependence_confirmed_partially_disclosed

      - item: 4
        attack: >-
          DEVIATE: supply caller values via PATH manipulation. The script
          uses PATH-resolved hostname and df. Can a caller controlling PATH
          make the script emit caller-supplied values THROUGH the procedure?
        construction: >-
          Created a fake hostname binary in /tmp/rt-d85fdf-attacks/fakebin/
          that echoes "caller-controlled-hostname". Prepended that directory
          to PATH. Ran `PATH=/tmp/.../fakebin:$PATH sh emit_host_binding.sh`.
          Separately, created a fake df binary returning /dev/fakedev and
          /mnt/fake, and ran the script with that in PATH.
        expected: >-
          If the script uses absolute paths for hostname and df, PATH
          manipulation has no effect. If the script uses PATH-resolved
          binaries, the caller can control the output.
        observed: >-
          PATH manipulation SUCCEEDED for BOTH hostname AND df:
          - Fake hostname: script emitted host_id="caller-controlled-hostname"
          - Fake df: script emitted filesystem_id="/dev/fakedev",
            filesystem_mount="/mnt/fake"
          The script uses PATH-resolved `hostname` and `df`, NOT absolute
          paths. A caller controlling PATH can make the script emit
          caller-supplied values for ALL THREE host_binding fields THROUGH
          the procedure. This CONTRADICTS the provenance claim: "it is never
          read from caller input, environment variables the caller controls,
          or repository state." PATH IS an environment variable the caller
          controls, and the script's output is determined by which binaries
          PATH resolves. This is NOT disclosed in the package.
        result: path_manipulation_breaks_provenance_claim

      - item: 5
        attack: >-
          Verify the demo receipt was actually produced by the procedure it
          ships with (commands, working directory, timestamps consistent with
          the producer's runtime-session-receipt.json).
        construction: >-
          Compared demo-receipt.json values and emitted_at timestamp to the
          host's current surfaces and the producer's runtime-session-receipt.json
          recorded_at and host_binding.emitted_at.
        expected: >-
          Demo values match the host's surfaces. Demo timestamp precedes the
          producer receipt timestamp. Producer commands list includes the emit
          invocation that produced the demo.
        observed: >-
          Demo values match the host's surfaces exactly (Adams-MacBook-Pro.local,
          /dev/disk5s1, /Volumes/SSD990). Demo emitted_at (02:35:47Z) precedes
          producer receipt recorded_at (02:39:05Z) by ~3.5 minutes, consistent
          with "first test run, then produce demo, then final run for receipt."
          Producer commands list includes "sh .../emit_host_binding.sh >
          demo-receipt.json (produce demo-receipt.json)." The demo is
          CONSISTENT with a real script run. HOWEVER, a hand-written receipt
          with the same values would be INDISTINGUISHABLE from a script-produced
          one, because the script's output format is documented in
          emit_procedure.md and the values are the host's own surfaces that
          anyone can query. The demo cannot be proven to be script-produced
          vs hand-written; it is only consistent with script production.
        result: demo_consistent_but_indistinguishable_from_handwritten

      - item: 6
        attack: >-
          Check whether ANY independent cross-check exists that a reviewer or
          dispatcher could run to falsify a binding value, and name precisely
          what a compromised emitting session could still lie about.
        construction: >-
          Enumerated all available cross-checks and assessed their coverage
          and limitations.
        expected: >-
          If independent cross-checks exist, name them and their limitations.
          If none exist, state that the binding is self-attested.
        observed: >-
          Independent cross-checks available to a reviewer/dispatcher:
          1. Run `hostname` on the same host and compare to receipt host_binding.host_id
          2. Run `df -P .` on the same host (from same CWD) and compare filesystem_id/mount
          3. Re-run emit_host_binding.sh on the same host and compare output
          LIMITATIONS:
          - After the fact, not at emission time
          - Require the reviewer to be on the SAME host (not remote)
          - Require the reviewer to be in the SAME working directory (for df)
          - NOT automatic; no dispatcher enforces them
          - Detect a MISMATCH (forged values) but cannot prove the values
            were emitted by the script vs hand-written to match
          - A session that runs the script on a different host/mount and
            pastes the output produces values that are REAL but from the wrong
            host; a reviewer on the session's actual host would detect the
            mismatch, but only if they run the check
          What a compromised emitting session can STILL lie about:
          1. Whether emit_host_binding.sh was actually run (no execution proof in receipt)
          2. Whether the values came from the script vs hand-written (indistinguishable)
          3. Whether the script was run on THIS host vs a different host (values are real but wrong host)
          4. Whether the working directory was the real one vs a different mount (df captures CWD)
          5. The emitted_at timestamp (can be hand-written)
          6. Whether PATH was manipulated to make hostname/df return caller values
        result: cross_checks_exist_but_not_automatic_self_attestation_confirmed

    j2_summary: >-
      The J2 joint BREAKS. The self-attestation gap is real and disclosed
      (expected by the coordinator's prior). But the PATH manipulation finding
      (item 4) is a NEW, UNDISCLOSED defect: the script uses PATH-resolved
      hostname and df binaries, so a caller controlling PATH can make the
      script emit caller-supplied values for ALL THREE host_binding fields
      THROUGH the procedure. This contradicts the provenance claim "never read
      from... environment variables the caller controls" (PATH is such a
      variable) and the claim "a caller can no longer supply arbitrary
      host_binding values THROUGH the emit procedure" (PATH manipulation IS a
      way to supply values through the procedure). This is within the v5
      threat model (caller-supplied bindings) and is not disclosed. The demo
      receipt is consistent with a real script run but indistinguishable from
      a hand-written one. Independent cross-checks exist but are not automatic.

  j3_attack_plan:
    joint: J3-stop-control-integrity-and-escape-surface
    verdict: holds
    items:

      - item: a
        attack: >-
          Execute the package's STOP control against a caller-supplied binding.
          Require STOP.
        construction: >-
          Constructed a caller-shaped host_observation (evil-host.example.com,
          /dev/fakedev, /mnt/fake) that does NOT match the receipt's
          host_binding (Adams-MacBook-Pro.local, /dev/disk5s1, /Volumes/SSD990).
          Evaluated against binding_rule_v2.
        expected: STOP
        observed: >-
          The caller_host_observation does NOT equal the receipt_host_binding
          (all three fields differ). Under binding_rule_v2, the host_observation
          must equal the receipt host_binding.* — it does not. Equality against
          the caller-declared active binding is explicitly rejected.
          caller_input_is_never_authoritative: true. Outcome: STOP.
          v2_weakening: none for this case.
        result: stop_fires_correctly

      - item: b
        attack: >-
          Execute the STOP control against a missing binding (v1-shaped receipt
          with only host_binding.note). Require STOP.
        construction: >-
          Constructed a v1-shaped receipt with host_binding = {note: "..."},
          lacking host_id, filesystem_id, filesystem_mount. Evaluated against
          missing_receipt_field.
        expected: STOP
        observed: >-
          The receipt lacks host_binding.host_id, filesystem_id, and
          filesystem_mount. Under receipt_field_absent_handling, "the validity
          check itself is unevaluable and STOPs; no fallback host source is
          substituted." missing_receipt_field: STOP. The v2 parser accepts this
          as schema-valid (backward compatible), but the STOP fires at the
          binding-rule layer. The weakening (schema-validity != binding-rule
          satisfaction) is NAMED in receipt-schema-v2.yaml.
          Outcome: STOP. v2_weakening: named.
        result: stop_fires_correctly_with_named_weakening

      - item: c
        attack: >-
          Execute the STOP control against an actual v1 corpus receipt under
          the v2 schema. Require STOP.
        construction: >-
          Used the actual v1 receipt from
          coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-0d566b/runtime-session-receipt.json
          (schema: crypto.autoresearch.runtime_session_receipt.v1,
          host_binding keys: [note]). Evaluated under v2 schema and v5
          missing_receipt_field.
        expected: STOP
        observed: >-
          The v1 receipt's host_binding block contains only a "note" key. It
          lacks host_id, filesystem_id, filesystem_mount. Under
          receipt_field_absent_handling, the validity check STOPs. The v2
          parser accepts this receipt as schema-valid (v1 backward
          compatibility). The STOP fires at the binding-rule layer. Same
          weakening as case (b), confirmed against a real corpus receipt.
          Outcome: STOP. v2_weakening: named.
        result: stop_fires_correctly_against_real_corpus_receipt

      - item: escape_hunt
        attack: >-
          Hunt for a NEW escape the v2 addition opens: a field value shape
          that satisfies the schema while defeating the binding rule (empty
          string, placeholder, wildcard, non-canonical encoding, duplicate
          keys), and any place the procedure's outputs are trusted where the
          v5 schema demanded verification.
        constructions_and_results:
          - escape: empty_string
            shape: 'host_binding.host_id = "" (key present, value empty)'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: true
            note: >-
              The missing_receipt_field STOP fires on ABSENCE (key not in
              dict), not on emptiness. An empty string is "present" so the
              STOP does not fire. The binding_rule_v2 compares "" against the
              host_observation (non-empty) and rejects via inequality. Partial
              escape: avoids missing-field STOP, caught by binding rule. Full
              escape only if consumer skips binding rule (the named weakening).
          - escape: whitespace_only
            shape: 'host_binding.host_id = "   " (whitespace, key present)'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: true
            note: >-
              After normalization (trim), becomes "". Same as empty_string.
          - escape: null_value
            shape: 'host_binding.host_id = null (key present, value null)'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: true
            note: >-
              Key IS present (value is null). missing_receipt_field does NOT
              fire. binding_rule_v2 compares null against host_observation
              (string) -> type mismatch -> rejected. Same gap as empty_string.
          - escape: placeholder
            shape: 'host_binding.host_id = "unknown"'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: true
            note: >-
              Fields present and non-empty. missing_receipt_field does NOT
              fire. binding_rule_v2 compares "unknown" against real hostname
              -> not equal -> rejected. Partial escape only.
          - escape: non_canonical_encoding
            shape: 'host_binding.filesystem_id = "/DEV/DISK5S1" (uppercase)'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: false
            note: >-
              v5 normalization: lowercase, trimmed -> "/dev/disk5s1". If
              host_observation is also normalized, they match. This is CORRECT
              behavior (normalization handles case), not an escape.
          - escape: duplicate_keys
            shape: '{"host_id": "real-host", "host_id": ""}'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: true
            note: >-
              JSON spec: duplicate keys undefined. python3 json.loads takes
              LAST value (""). If all consumers use the same parser, no
              discrepancy. Escape requires DIFFERENT parsers handling
              duplicates differently. Not a v2-specific escape.
          - escape: wrong_type
            shape: 'host_binding = "string" (not an object)'
            schema_valid: ambiguous
            missing_field_stop_fires: true
            binding_rule_catches: true
            note: >-
              Malformed receipt. Not a v2-specific escape.
          - escape: extra_fields
            shape: 'host_binding = {host_id, filesystem_id, filesystem_mount, note: "extra"}'
            schema_valid: true
            missing_field_stop_fires: false
            binding_rule_catches: false
            note: >-
              v1+v2 hybrid. Three authoritative fields present. Extra note is
              ignored by binding_rule_v2. Not an escape.
        escape_hunt_result: >-
          No NEW escape found that defeats the binding rule when it is
          actually evaluated. The named weakening (schema-validity !=
          binding-rule satisfaction) is the only escape, and it requires the
          consumer to SKIP the binding rule evaluation. Empty strings,
          whitespace-only values, null values, and placeholders avoid the
          missing-field STOP but are caught by the binding rule's equality
          check (assuming the host_observation is honestly produced). The
          empty-string/null gap (RT-J3-O1) is a non-blocking observation about
          the missing_receipt_field rule's coverage: it fires on absence, not
          on emptiness or null. The binding rule catches these values, but
          only if evaluated.
        result: no_new_v2_specific_escape_found

    j3_summary: >-
      The J3 joint HOLDS. The v5 STOP fires correctly in all three required
      cases (caller-supplied, missing, v1-under-v2). The named weakening
      (schema-validity != binding-rule satisfaction) is disclosed and correct.
      No NEW v2-specific escape was found that defeats the binding rule when
      evaluated. The empty-string/null gap (RT-J3-O1) is a non-blocking
      observation: the missing_receipt_field STOP fires on absence but not on
      emptiness or null, creating a gap in the missing-field rule's coverage.
      The binding rule catches empty/null values via inequality, but only if
      the consumer evaluates it. This is a specific instance of the named
      weakening, not a new escape.

  proves_too_much:
    required: true
    assigned_to: TASK-20260830-d85fdf
    argument_tested: >-
      "this package makes the host binding authoritative"
    objects:

      - id: PTM-1
        description: >-
          Same-heading package whose emit procedure reads host_binding values
          from an environment variable the caller controls (e.g., host_id=$HOST_ID).
        known_false_basis: >-
          If the emit procedure reads host_binding from an env var the caller
          controls, the binding is caller-controlled, not authoritative. This
          is the exact v5 threat model attack (caller-supplied bindings).
        argument_tested: >-
          Does the argument "this package makes the host binding authoritative"
          still hold for this object?
        result: rejected
        method_basis: >-
          My review method detects this by reading the emit procedure and
          checking whether it reads from env vars or uses PATH-resolved
          binaries. For this object, the script directly reads $HOST_ID,
          which is an env var the caller controls. I would return STOP/REVISE.
          CROSS-CHECK: My method detected a SIMILAR issue in the ACTUAL
          package (J2-ATTACK-4: PATH manipulation of hostname and df). The
          actual package's script uses PATH-resolved binaries, which is
          INDIRECT env var control. My method caught this and recorded it as
          RT-J2-O1. This confirms my method is discriminating for this
          object class: it catches both direct env var reads AND indirect
          PATH manipulation.

      - id: PTM-2
        description: >-
          Same-heading package whose demo receipt contains host_binding values
          with no corresponding host identity surface (e.g., host_id="mars-rover-7").
        known_false_basis: >-
          If the demo values don't match any host's surfaces, the demo is
          fabricated, not produced by the procedure. The binding is not real.
        argument_tested: >-
          Does the argument "this package makes the host binding authoritative"
          still hold for this object?
        result: rejected
        method_basis: >-
          My review method detects this by running the verification commands
          (hostname, df -P .) and comparing to the demo values. For this
          object, "mars-rover-7" != actual hostname, so the demo is fabricated.
          I would return STOP/REVISE.
          CROSS-CHECK: My method verified the ACTUAL package's demo values
          match the host's surfaces (J2-ATTACK-5: Adams-MacBook-Pro.local,
          /dev/disk5s1, /Volumes/SSD990 all match). This confirms my method
          is discriminating: it accepts real values and rejects fabricated ones.

      - id: PTM-3
        description: >-
          Same-heading package whose STOP control checks only field presence,
          not provenance (not equality against host_observation).
        known_false_basis: >-
          If the STOP control checks only presence, a caller can supply
          arbitrary values (keys present, values caller-controlled) and pass.
          The v5 binding_rule_v2 demands equality, not just presence.
        argument_tested: >-
          Does the argument "this package makes the host binding authoritative"
          still hold for this object?
        result: rejected
        method_basis: >-
          My review method detects this by checking whether the STOP control
          evaluates binding_rule_v2 (equality) or only checks field presence.
          For this object, the STOP only checks presence, so caller-supplied
          values pass. I would return STOP/REVISE.
          CROSS-CHECK: My method verified the ACTUAL package's STOP control
          evaluates binding_rule_v2 (equality), not just presence (J3-CASE-A:
          caller-supplied binding that doesn't match the receipt is REJECTED
          by the binding rule). The actual package's STOP is NOT presence-only.
          This confirms my method is discriminating: it accepts
          equality-checking STOPs and rejects presence-only STOPs.

    overall_result: >-
      All three known-false objects are rejected by my review method. The
      argument "this package makes the host binding authoritative" FAILS on
      each object. My method is discriminating: it catches env var control
      (direct and indirect via PATH), fabricated demo values, and
      presence-only STOPs. The actual package's issues (PATH manipulation,
      self-attestation) were detected by the same method, confirming it is
      not over-generous. The proves-too-much control PASSES.

  objections:

    - id: RT-J2-O1
      severity: material
      class: provenance_claim_violated_by_path_manipulation
      status: open
      locus: >-
        emit_host_binding.sh lines 57 (hostname), 61 (df), 64 (df column 1),
        73 (df mount column); receipt-schema-v2.yaml host_binding.fields.host_id.provenance,
        filesystem_id.provenance, filesystem_mount.provenance
      finding: >-
        The emit_host_binding.sh script uses PATH-resolved `hostname` and `df`
        binaries, not absolute paths. A caller controlling the PATH environment
        variable can prepend a directory containing a fake `hostname` binary
        (returning "caller-controlled-hostname") and/or a fake `df` binary
        (returning "/dev/fakedev" and "/mnt/fake"), and the script will emit
        those caller-supplied values as the host_binding fields. This was
        confirmed by execution: with a fake hostname in PATH, the script
        emitted host_id="caller-controlled-hostname"; with a fake df in PATH,
        the script emitted filesystem_id="/dev/fakedev" and
        filesystem_mount="/mnt/fake". This contradicts the provenance claim in
        receipt-schema-v2.yaml: "it is never read from caller input,
        environment variables the caller controls, or repository state." PATH
        IS an environment variable the caller controls, and the script's
        output is determined by which binaries PATH resolves. It also
        contradicts the claim in emit_procedure.md: "A caller can no longer
        supply arbitrary host_binding values THROUGH the emit procedure: the
        script reads the host's surfaces and accepts no arguments." PATH
        manipulation IS a way to supply values through the procedure. This is
        within the v5 threat model (caller-supplied bindings) and is NOT
        disclosed in the package.
      required_repair: >-
        Use absolute paths for hostname and df in emit_host_binding.sh (e.g.,
        /bin/hostname, /usr/bin/hostname, /bin/df, /usr/sbin/df, with platform
        detection for macOS vs Linux), OR narrow the provenance claim to
        explicitly state: "PATH is assumed trusted; the script does not defend
        against PATH manipulation. A caller controlling PATH can make the
        script emit caller-supplied values." The chosen repair must be
        reflected in both emit_host_binding.sh and the provenance declarations
        in receipt-schema-v2.yaml.
      control_evidence:
        - J2-ATTACK-4: fake hostname in PATH -> script emits "caller-controlled-hostname"
        - J3-ESCAPE-TEST: fake df in PATH -> script emits "/dev/fakedev" and "/mnt/fake"

    - id: RT-J2-O2
      severity: material
      class: self_attestation_gap
      status: disclosed_in_package
      locus: >-
        receipt-schema-v2.yaml host_binding.what_this_does_not_attest,
        host_binding.limitation; emit_procedure.md "What this binding does NOT attest"
      finding: >-
        The host_binding fields are self-attested by the emitting session.
        Nothing in the package INDEPENDENTLY cross-checks the capture at
        emission time. A compromised emitting session can hand-write a receipt
        with arbitrary host_binding values, or run the script on a different
        host and paste the output. Independent reviewer verification (running
        hostname and df -P . on the same host) is the cross-check that detects
        a misreported binding, but it is not automatic and must be performed
        deliberately. This IS disclosed in the package
        (what_this_does_not_attest, limitation_disclosed: true, limitation).
        The coordinator's prior expected this finding. It is the expected
        scope of what this batch closes, not a defect.
      required_repair: none
      required_repair_note: >-
        This is a disclosed limitation, not a defect. No repair required.
        However, the PATH manipulation finding (RT-J2-O1) makes this gap
        WORSE than disclosed: a caller can supply values through the
        procedure (via PATH), not just by hand-writing. The disclosure
        should be updated to reflect RT-J2-O1 if that objection is not
        repaired by using absolute paths.

    - id: RT-J2-O3
      severity: minor
      class: cwd_dependence_not_fully_disclosed
      status: partially_disclosed
      locus: >-
        emit_host_binding.sh lines 61, 73 (df -P . captures CWD's filesystem);
        receipt-schema-v2.yaml filesystem_id.provenance, filesystem_mount.provenance
      finding: >-
        The script captures the working directory's filesystem (df -P .),
        not a fixed host identity. Running the script from a different mount
        point produces different (real) filesystem_id and filesystem_mount
        values. This was confirmed by execution: from /tmp, the script emitted
        filesystem_id="/dev/disk3s5" and filesystem_mount="/System/Volumes/Data"
        (different from the worktree root's /dev/disk5s1 and /Volumes/SSD990).
        A session could run the script from a different mount and paste the
        output, producing values that are REAL (from the script) but from a
        different filesystem. This is PARTIALLY disclosed: the schema says
        "the filesystem device identifier of the working directory the
        procedure runs in," but the paste-from-different-mount attack is not
        explicitly called out as a residual risk.
      required_repair: >-
        Add an explicit note in emit_procedure.md and/or receipt-schema-v2.yaml
        stating: "The binding captures the CWD's filesystem at emission time.
        A session that runs the script from a different mount point and pastes
        the output produces values that are real but from a different
        filesystem. Independent reviewer verification must run df -P . from
        the same working directory the session used."
      control_evidence:
        - J2-ATTACK-3: script run from /tmp produces different filesystem values

    - id: RT-J3-O1
      severity: minor
      class: missing_field_stop_does_not_cover_empty_or_null
      status: open
      locus: >-
        j3-closure-v5.yaml operation_schema_v2.host_binding.missing_receipt_field,
        receipt_field_absent_handling; receipt-schema-v2.yaml
        host_binding.missing_receipt_field
      finding: >-
        The v5 missing_receipt_field STOP fires on ABSENCE (key not present in
        the host_binding object), not on emptiness or null. A hand-written
        receipt with host_binding.host_id = "" (empty string) or null has the
        key PRESENT, so the missing_receipt_field STOP does NOT fire. The
        binding_rule_v2 then compares "" or null against the host_observation
        (non-empty string), which fails via inequality and is rejected. So
        empty/null values are caught by the binding rule, but only if the
        consumer evaluates it. If a consumer only checks schema-validity
        (parses under v2) and skips the binding rule (the named weakening),
        empty/null values pass. This is a specific instance of the named
        weakening, not a new escape. However, the missing_receipt_field rule's
        coverage gap (absence vs emptiness) is worth noting because the emit
        script's failure_behavior explicitly catches empty strings ("returns
        an empty string after trimming"), but the v5 rule's
        missing_receipt_field does not.
      required_repair: >-
        Extend the missing_receipt_field rule (or add a new rule) to fire on
        empty-after-normalization values, not just absent fields. For example:
        "If runtime-session-receipt.json lacks host_binding.host_id,
        filesystem_id, or filesystem_mount, OR if any of these fields is empty
        or null after normalization, the validity check itself is unevaluable
        and STOPs." Alternatively, add an explicit "empty_or_null_receipt_field:
        STOP" rule. This closes the gap between the emit script's
        failure_behavior (which catches emptiness) and the v5 rule's
        missing_receipt_field (which catches only absence).
      control_evidence:
        - J3-ESCAPE-TEST: empty string values -> key present, missing_field_stop does not fire
        - J3-ESCAPE-TEST: null values -> key present, missing_field_stop does not fire

  counterexample_or_mutation:
    primary_attempted: >-
      PATH manipulation of emit_host_binding.sh: a fake hostname binary
      prepended to PATH made the script emit host_id="caller-controlled-hostname".
      A fake df binary made the script emit filesystem_id="/dev/fakedev" and
      filesystem_mount="/mnt/fake". This is a caller-supplied binding THROUGH
      the procedure, contradicting the provenance claim.
    secondary_attempted: >-
      Hand-written forged receipt with caller-supplied values matching a
      caller-supplied host_observation. The binding_rule_v2 PASSES on equality
      but the source rule is violated (self-attestation gap, disclosed).
    cwd_attempted: >-
      Script run from /tmp (different mount) produces different real values
      that could be pasted into a receipt on the actual host.
    empty_null_attempted: >-
      Empty-string and null values in host_binding fields bypass the
      missing_receipt_field STOP but are caught by the binding_rule_v2
      inequality check (if evaluated).
    no_new_v2_escape_found: true
    no_new_v2_escape_basis: >-
      No field value shape was found that satisfies the v2 schema while
      defeating the binding rule when the binding rule is actually evaluated.
      The named weakening (schema-validity != binding-rule satisfaction) is
      the only escape, and it requires the consumer to skip the binding rule.

