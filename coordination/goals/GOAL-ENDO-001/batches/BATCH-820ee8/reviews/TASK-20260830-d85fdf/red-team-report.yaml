  construction:
    kind: independent_static_adversarial_instrumentation_review
    method: >-
      The J2 and J3 worked attack-plan items were executed item by item against
      the v2 package. For J2: (1) the emit procedure was followed exactly
      (honest path) and the script's output verified against the host's own
      identity surfaces; (2) a forged receipt with caller-supplied values was
      constructed and evaluated against the v5 binding_rule_v2; (3) the script
      was run from a different mount point (/tmp) to test CWD-dependence; (4)
      PATH manipulation was tested by prepending a fake hostname binary to
      PATH, and separately a fake df binary, to test whether the script's
      provenance claim holds under environment control; (5) the demo receipt
      was verified against the host's surfaces and the producer's
      runtime-session-receipt.json timeline; (6) the available independent
      cross-checks were enumerated and their limitations assessed. For J3:
      (a) the STOP control was executed against a caller-supplied binding;
      (b) against a missing binding; (c) against an actual v1 corpus receipt
      under the v2 schema; then an escape hunt tested empty strings,
      whitespace-only values, placeholders, non-canonical encodings, duplicate
      keys, null values, wrong types, and extra fields. The proves-too-much
      control was run against all three known-false objects. This attacks the
      written boundary directly and does not reproduce the validator's assigned
      blind re-derivation.
    producer_code_executed: true
    producer_code_executed_note: >-
      emit_host_binding.sh was executed as an adversary (honest run, PATH
      manipulation, CWD variation) to test its provenance claim. No experiment
      runner was invoked, no target/curve/instrument was accessed, no network
      was used, and no repository writes occurred outside the review directory.
