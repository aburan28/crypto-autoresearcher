      - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/tasks/TASK-20260825-74615f/j3-closure-v5.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-0d566b/runtime-session-receipt.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-306cc8/runtime-session-receipt.json
