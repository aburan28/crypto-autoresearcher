objective: >-
  Produce and review one bounded runtime-harness attachment package that
  closes the carried-forward named open item HOST-BINDING-ENFORCEABILITY from
  the BATCH-90392b scoped-PASS closure (DEC-20260825-dc7a01, EV-JINV-7c4242):
  the authoritative host binding of the v5 closure schema is currently a
  SPECIFIABLE RULE, not an enforced closure, because the
  crypto.autoresearch.runtime_session_receipt.v1 schema carries a host_binding
  block with only an absence note, while
  coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/tasks/TASK-20260825-74615f/j3-closure-v5.yaml
  already defines what an authoritative binding must contain and how a
  caller-supplied or missing binding must STOP. The package comprises: (1) a
  runtime-session-receipt schema extension to v2 adding
  host_binding.host_id, host_binding.filesystem_id, and
  host_binding.filesystem_mount with declared provenance and verification
  semantics consistent with the v5 authoritative-binding rule; (2) a minimal,
  runnable procedure by which any dispatched session emits a receipt with a
  REAL, verifiable host binding for its own session, sourced from the host's
  own identity surfaces and never from caller input; (3) a demonstration
  receipt emitted by the producer's own session exercising that procedure;
  and (4) a control proving the v5 STOP still fires on a caller-supplied or
  missing binding under the v2 schema. The batch then obtains fresh
  independent validator and red-team reviews at review-adversarial/xhigh and
  a Coordinator ledger archive. Static instrumentation only: no experiment
  run, no implementation of EXP-JINV-bd141d, no Phase B, no target or curve
  access, no JINV, transport, N18, science, hypothesis/status change, closure,
  breakthrough, or resource-disposition change is authorized.
constraints:
