review_plan:
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-718595
  work_unit: resource-implementation-planning-gate-4-repair-and-review
  recorded_at: '2026-08-24'
  recorded_by: coordinator
  claim_scope: >-
    Reviews may change only the disposition of this successor static planning
    package. They cannot establish a JINV, ECDLP, isogeny, exponent, speedup,
    closure, breakthrough, hypothesis, goal-status, or resource-disposition claim.
  coordinator_prior: >-
    I expect the successor to repair the prior J1 pointer and to make the J3
    boundaries substantially more explicit, but I expect at least one reviewer
    to find a remaining scope, typing, canonical-statistic, or cost-envelope
    defect. I expect no scientific evidence. A clean review can approve only
    this exact static package and cannot authorize implementation.
  prior:
    expectation: >-
      At least one scoped defect is likely to remain after these repairs; no
      scientific evidence is expected.
    decision_if_overturned: >-
      If both reviewers find the package clean, record that surprise explicitly
      and keep resource_incomplete fail-closed; if either finds a defect, preserve
      it without outvoting it.
  joints:
    - id: J1-preservation-and-authorization-closure
      owner_task_id: TASK-20260824-932862
      assigned_to: TASK-20260824-932862
      question: >-
        Does the successor point to the existing immutable manifest, preserve
        all 18 obligations and OBD-1 history, and keep every authorization false
        or zero without editing predecessor records?
      worked_attack_plan:
        - Verify the corrected manifest path exists and hash-pin the immutable source.
        - Compare all 18 exact references and test a removed-obligation mutation.
        - Test planted implementation, materialization, and resource authorization.
    - id: J2-custody-continuity
      owner_task_id: TASK-20260824-932862
      assigned_to: TASK-20260824-932862
      question: >-
        Does the successor preserve the already PASSed deterministic RC-1 custody
        without reopening or overstating it?
      worked_attack_plan:
        - Blindly rederive the frozen RC-1 baseline and factor cases from the worksheet before reading current custody output.
        - Verify source/raw hashes and snapshot/archive bindings after derivation.
        - Run a source-identity known-false mutation and require rejection.
    - id: J3-global-stop-and-control-canonicalization
      owner_task_id: TASK-20260824-4927cd
      assigned_to: TASK-20260824-4927cd
      question: >-
        Do typed applicability, host observations, PB-3 schema/STOP propagation,
        canonical CT formulas, boundary fixtures, and resource envelopes close
        every prior J3 escape without hidden authorization?
      worked_attack_plan:
        - Launder host materialization through missing/false applicability and malformed typed observations.
        - Add an extra unknown PB-3 term/cap and test every dependent action for global STOP.
        - Evaluate canonical CT equality, denominator, invalid-record, and resource-exhaustion fixtures.
        - Test a same-heading planted authorization package and record the rejection.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - tools/research_dispatch.py
      - experiments/EXP-JINV-bd141d/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/reviews/TASK-20260824-135261/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/reviews/TASK-20260824-8766e5/
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-718595/reviews/TASK-20260824-932862/
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-718595/reviews/TASK-20260824-4927cd/
    attestation_required: >-
      Each reviewer states exactly what it read, confirms it did not read the
      sibling report, and discloses policy/model provenance. Independence is a
      fresh session and disjoint context, not a distinct-model quorum.
  proves_too_much:
    required: true
    assigned_to: TASK-20260824-4927cd
    objects:
      - same-heading package with materialization applicability omitted
      - same-heading package with an unknown extra PB-3 merge term
      - same-heading package with implementation_authorized=true
    construction: >-
      Review the argument against objects where its claimed fail-closed boundary
      is deliberately false. Accepting any object is a review-method failure and
      forces REVISE or FAIL.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260824-932862
    blind_from:
      - experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-983ef2/raw-result.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-983ef2/runtime-session-receipt.json
    quantity: frozen RC-1 baseline, factor cases, and fixed residual
  procedure_deviations: []
  expected_outputs:
    - independent validator report with scoped PASS, REVISE, or FAIL
    - independent red-team report with scoped PASS, REVISE, or FAIL
    - final Coordinator decision composing the joints without outvoting dissent
