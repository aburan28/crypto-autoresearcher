  objections:
    - id: RT-J3-O1
      severity: material
      class: hidden_authorization_and_scope
      locus: repaired_boundaries.materialization.applies_when; materialization_on_host
      title: The host-observation STOP is gated by an unbound caller-supplied flag.
      finding: >-
        REPAIR-MAT-1 applies only when materialization_on_host == true. The
        package does not define this predicate as a derived property of the
        operation, require it to be present, or reject a contradictory label.
        A same-heading mutation with operation=materialize_host,
        materialization_on_host=false (or omitted), and
        current_host_observation=null matches no STOP row. The planned
        KF-MAT-NO-OBS control therefore rejects only an honest true-labelled
        input, not a caller that launders host materialization through the
        applicability bit.
      impact: >-
        A future dispatcher can bypass the required current-host observation
        without violating any literal row in the repaired table. That is a
        procedural escape, not a scientific result.
      required_repair: >-
        Bind materialization_on_host to an operation schema or derive it from
        the actual requested action. Missing, false, or contradictory
        applicability metadata must STOP whenever the action can allocate or
        materialize host resources; no alternate non-host branch may be inferred
        by omission.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.repaired_boundaries.materialization
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/review-plan.yaml#review_plan.joints.J3-stop-controls-and-scope

    - id: RT-J3-O2
      severity: material
      class: host_observation_boundary
      locus: repaired_boundaries.materialization.required_observation and decision_table
      title: Finite negative or semantically malformed host values pass the repaired observation gate.
      finding: >-
        The STOP row checks missing/nonfinite required fields, while the
        accepted row requires only known, fresh, and complete. It does not
        require free_disk_bytes or memory_bytes to be finite nonnegative byte
        quantities with a defined integer/unit encoding, nor does it define
        timestamp parsing, future timestamps, clock source, or host binding.
        For example, status=known, a fresh observed_at, free_disk_bytes=-1,
        and memory_bytes=-1 does not satisfy any listed STOP condition because
        the values are finite and present. The same gap applies to an empty
        host_id or an unparseable-but-present observed_at unless a separate
        check is supplied.
      impact: >-
        A malformed observation can be admitted to the subsequent checks and
        can understate available resources or evade freshness semantics. The
        current no-observation control does not cover this boundary.
      required_repair: >-
        Specify a typed host-observation schema: nonempty host identity,
        parseable timestamp from an agreed clock, no future timestamp beyond a
        stated skew rule, nonnegative integer byte values, and an explicit
        host/filesystem binding. Every type/unit/clock failure must STOP.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.repaired_boundaries.materialization.required_observation

    - id: RT-J3-O3
      severity: material
      class: pb3_uncertainty_and_cost_scope
      locus: repaired_boundaries.pb3.required_terms, required_model_fields, and numeric-cap rows
      title: PB-3 does not define a closed cost schema or an unknown-cap STOP.
      finding: >-
        PB-3 names four required terms and two required model fields, but it
        does not enumerate the numeric cap inputs, their units, model
        subfields, or the complete set of terms consumed by
        sharded_merge_model/residual_artifact_grouping. The phrase
        model_evaluable is not defined. An input with the four named terms
        finite, an extra cost term such as merge_pass_bytes=UNKNOWN, or an
        unknown/missing cap, can fall through the listed rows because the
        unknown predicate is only stated for the named terms/model fields.
        The table then offers evaluate_numeric_caps without a rule saying that
        every cap and every model-dependent term must be known, dimensionally
        compatible, and conservative.
      impact: >-
        PB-3 can appear numerically evaluable while omitting a merge, transfer,
        retention, or cap term. This is a direct scope/cost escape through an
        underived quantity, even though the single planned KF-PB3-UNKNOWN case
        correctly rejects logical_io_bytes=UNKNOWN plus a missing model.
      required_repair: >-
        Add a closed PB-3 input schema and formula manifest. Require every
        referenced term, cap, unit conversion, model subfield, and residual
        grouping to be present, finite, nonnegative where applicable, and
        evaluable; any unknown, extra-unbound, dimensionally inconsistent, or
        non-conservative term must STOP and leave the corresponding estimate
        underived.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.repaired_boundaries.pb3
        - experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json#preflight_contract

    - id: RT-J3-O4
      severity: material
      class: hidden_authorization_and_stop_propagation
      locus: repaired_boundaries.pb3 decision_table and stop_preserves_resource_incomplete
      title: The PB-3 STOP action is scoped to interpretation, not to every downstream resource action.
      finding: >-
        The unknown/invalid PB-3 action is
        STOP_REFUSE_FIT_OR_PASS_INTERPRETATION. The package does state
        stop_preserves_resource_incomplete, but it does not define a consuming
        state transition that rejects materialization, scheduling, dispatch,
        implementation, or resource-disposition changes whenever PB-3 is
        unknown. A caller that is not currently asking for a fit or pass
        interpretation can therefore continue after the same unknown cost
        input. The static authorization flags do not substitute for a
        machine-readable propagation rule in a successor action.
      impact: >-
        Unknown PB-3 can be treated as irrelevant to an adjacent action, which
        is precisely the hidden authorization/cost escape the repair was meant
        to close. The package must fail closed across all actions that depend on
        the quantity, not only across one named interpretation.
      required_repair: >-
        Define PB-3 STOP as a global dependency failure: no fit, pass, resource
        approval, materialization, schedule, dispatch, implementation, or
        disposition transition may proceed while any PB-3 input is unknown or
        unevaluable. Require an explicit Coordinator decision to supersede a
        STOP, without treating the supersession as an automatic pass.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.repaired_boundaries.pb3
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.authorization_boundary

    - id: RT-J3-O5
      severity: material
      class: quantitative_control_definition
      locus: quantitative_controls.common.uncertainty_rule and CT-1 through CT-5 metric fields
      title: The CT controls name statistics but do not fully define reproducible computations.
      finding: >-
        The common rule permits a paired bootstrap with 10000 resamples, while
        CT-3 names an exact binomial-log ratio interval, but neither route fixes
        the resampling unit, bootstrap interval construction and endpoint
        convention, seed, treatment of duplicate/invalid observations, or the
        exact exact-ratio method. The metric fields are labels rather than
        formulas: collision event encoding, unique-output event encoding,
        pairing, the rate denominator, and the effect estimator are not
        defined. Two compliant readers can therefore produce different 95%
        intervals and different boundary classifications from identical raw
        records. My boundary evaluator produced deterministic results only by
        supplying its own interpretation; that does not establish that the
        package is mechanically deterministic.
      impact: >-
        The planned KF-CT-BOUNDARY control can catch an implementation that
        follows one chosen interpretation, but it cannot catch ambiguity in the
        package until the statistic and interval algorithms are canonical.
      required_repair: >-
        Register exact formulas, units, outcome encodings, pairing key,
        resampling unit, bootstrap algorithm and endpoint rule, random seed,
        exact CT-3 interval construction, rounding/precision policy, and
        invalid-record handling. A boundary test must consume that canonical
        specification rather than a reviewer-supplied evaluator.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.common
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-1
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-3

    - id: RT-J3-O6
      severity: material
      class: quantitative_boundary_ambiguity
      locus: CT-2, CT-4, and CT-5 tolerance_or_effect_rule fields
      title: Several boundary predicates remain prose-level and admit operator discretion.
      finding: >-
        CT-2 says the point estimate is “not positive beyond that tolerance”
        without an inequality. CT-4 does not define wall-rate ratio, its
        denominator, or what constitutes a clock anomaly; its one-sided
        wall-rate bound has no explicit lower/validity predicate. CT-5 names a
        “signal effect” and an “absolute effect” but does not define whether the
        estimator is signed before subtraction, how the destroyed point
        estimate relates to the interval, or which strata are paired. These are
        not harmless wording differences at equality: they determine whether a
        record is PASS_CONTROL_ONLY or STOP.
      impact: >-
        The package's stated no-operator-judgment boundary is not met for
        these cases. A favorable interpretation can turn an underdefined
        boundary into a pass, while a conservative interpretation can stop it.
      required_repair: >-
        Replace each prose predicate with a formula over named fields and units,
        including denominator positivity, valid timing/clock rules, signed or
        absolute effect construction, and inclusive endpoint semantics. Add
        synthetic equality, just-inside, just-outside, zero-denominator, and
        invalid-clock fixtures for each CT.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-2
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-4
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-5

    - id: RT-J3-O7
      severity: material
      class: control_cost_model
      locus: CT-1 through CT-5 cardinality_replicates and common.replicate_policy
      title: The preregistered control workload has no bounded resource envelope.
      finding: >-
        CT-5 requires 1000 baseline trials, 1000 signal-destroyed trials, and
        1000 matched-null trials for each of those 2000 trials: 2,002,000 raw
        trial observations before any 10000-resample bootstrap work. The common
        rule also requires seeds, cardinality, and raw observations to be
        retained, but the repair package supplies no per-CT wall-clock, CPU,
        memory, disk, total-data, or bootstrap-cost cap and no stop condition
        for resource exhaustion. The queue's maximum_runs=1 and
        experiment_runs_authorized=0 prohibit experiment runs; they do not
        bound a later control task's data and compute cost.
      impact: >-
        A future control implementation can consume an unbounded or
        practically dominant budget while still satisfying the stated
        cardinality. The package's scope/cost repair is incomplete even if all
        statistical boundaries are later made precise.
      required_repair: >-
        Add a declared total control budget and per-CT envelopes for CPU,
        wall-clock, memory, disk/raw retention, and bootstrap work. Make any
        cap, timeout, missing record, or resource exhaustion STOP without
        converting it into a scientific negative; specify whether raw records
        may be streamed and how retained artifacts remain auditable.
      references:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/repair-package.yaml#repair_package.quantitative_controls.CT-5
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/dispatch_queue.json#tasks.TASK-20260824-8766e5.handoff.budget

  required_controls:
    execution_kind: static_declarative_review_control
    experiment_runs_executed: 0
    experiment_command_runner_invoked: false
    scientific_observations: []
    controls:
      - id: KF-MAT-NO-OBS
        construction: materialization_on_host=true; current_host_observation=null
        expected: STOP_REFUSE_MATERIALIZATION
        observed: STOP_REFUSE_MATERIALIZATION
        result: rejected_known_false_input
        method_note: >-
          Evaluated against the written decision table in memory; no host,
          filesystem, target, curve, or instrument was accessed.
      - id: KF-PB3-UNKNOWN
        construction: logical_io_bytes=UNKNOWN; sharded_merge_model=missing
        expected: STOP_REFUSE_FIT_OR_PASS_INTERPRETATION
        observed: STOP_REFUSE_FIT_OR_PASS_INTERPRETATION
        result: rejected_known_false_input
        method_note: >-
          Evaluated against the written PB-3 table in memory; no cost-producing
          source or experiment was executed.
      - id: KF-CT-BOUNDARY
        construction: >-
          Synthetic inclusive-boundary, just-outside, minimum-cardinality, and
          timing-boundary records were evaluated for each CT using the stated
          inequalities. The evaluator returned PASS_CONTROL_ONLY at the
          inclusive cases and the named STOP at each outside case.
        expected: deterministic_opposite_classifications
        observed:
          CT-1: [PASS_CONTROL_ONLY, STOP_NO_SIGNAL_CLAIM]
          CT-2: [PASS_CONTROL_ONLY, STOP_NO_UNIQUENESS_CLAIM]
          CT-3: [PASS_CONTROL_ONLY, STOP_NO_RATE_EQUIVALENCE_CLAIM]
          CT-4: [PASS_CONTROL_ONLY, STOP_NO_SCALING_CLAIM, STOP_NO_SCALING_CLAIM]
          CT-5: [PASS_CONTROL_ONLY, STOP_NO_VANISHING_EFFECT_CLAIM]
        result: review_method_control_rejected_known_false_inputs
        method_note: >-
          This confirms only that the red-team's explicit interpretation of the
          declared inequalities rejects the mutations. It does not prove the
          package is unambiguous; RT-J3-O5 and RT-J3-O6 explain why a canonical
          statistic/interval specification is still required.
      - id: KF-AUTH-PLANTED
        construction: >-
          Same-heading package mutation with implementation_authorized=true,
          experiment_runs_authorized=1, and resource_disposition=ready.
        expected: REJECT_FORBIDDEN_AUTHORIZATION
        observed: REJECT_FORBIDDEN_AUTHORIZATION
        result: rejected_known_false_input
        method_note: >-
          The mutation is rejected against the explicit authorization
          boundary; it was not executed as an experiment or treated as an
          approval.
    control_command: >-
      python3 - <<'PY' static in-memory decision-table evaluator; it asserted
      all four control groups and printed STATIC_REVIEW_CONTROLS_OK. No file
      was created by the evaluator.
    control_method_verdict: holds
    control_method_limitation: >-
      These are construction-level tests of the declarative rules, not an
      execution of an implementation. A future implementation still needs to
      be checked against the repaired canonical schema.

  counterexample_or_mutation:
    primary: >-
      Host-materialization laundering: set operation=materialize_host,
      materialization_on_host=false, current_host_observation=null. The
      current table has no matching STOP row because REPAIR-MAT-1 applies only
      under the caller-controlled true predicate.
    secondary: >-
      PB-3 omission: keep the four named terms finite and the two named model
      fields present, but set an unlisted merge-pass/transfer term or a numeric
      cap to UNKNOWN. The package has no closed schema row requiring that
      omitted input to STOP.
    planted_authorization: >-
      implementation_authorized=true with experiment_runs_authorized=1 and
      resource_disposition=ready; the red-team method rejected this known-false
      package, so the method did not accept a planted authorization.

  baseline_comparison:
    applicable: false
    statement: >-
      Pollard-rho, BSGS, specialized ECDLP baselines, and SOTA comparisons are
      not applicable to this J3 static governance review. No algorithmic gain,
      scientific cost, exponent, or speedup is claimed.
    claim_tier: toy
    sota_delta: zero
    cost_comparison_relevant_to_J3: >-
      The only relevant cost observation is procedural: CT-5's declared
      cardinality is 2,002,000 raw trial observations before bootstrap work,
      without a control-specific resource envelope.

  heuristic_challenges: []
  cost_model_challenges:
    - objection_id: RT-J3-O3
      statement: >-
        PB-3 has no closed list of cost terms, cap inputs, units, or model
        subfields, so unknown or omitted costs can evade the STOP.
    - objection_id: RT-J3-O7
      statement: >-
        CT-5's 2,002,000 raw observations plus bootstrap work are not bounded
        by a declared CPU, wall, memory, disk, or retained-data budget.
    - objection_id: RT-J3-O2
      statement: >-
        Host byte quantities are not constrained to typed nonnegative bytes;
        malformed finite values can pass the host gate.
  reduction_and_scope_challenges:
    - objection_id: RT-J3-O1
      statement: >-
        The host-materialization applicability bit is not bound to the actual
        operation, permitting a scope escape before any scientific action.
    - objection_id: RT-J3-O4
      statement: >-
        PB-3 STOP is not explicitly propagated to every downstream action that
        could change resource disposition or begin work.
    - objection_id: RT-J3-O6
      statement: >-
        CT PASS/STOP labels do not become authorization, but the package does
        not give successor consumers a canonical machine-readable transition
        that prevents them from treating a PASS_CONTROL_ONLY result as a green
        light.
  proof_architecture_challenges:
    - applicability: not_applicable
      reason: >-
        This task reviews a static procedural boundary and makes no theorem,
        reduction, certificate, or asymptotic claim.

  narrowest_supported_statement: >-
    The written decision-table interpretation rejects all four planned
    known-false control constructions, and the red-team review method therefore
    holds its own proves-too-much check. The J3 repair is nevertheless not
    complete: host applicability and value validity, PB-3 input closure and
    STOP propagation, CT statistic/boundary formalization, and CT resource
    budgets remain underdefined. The only supported disposition from this
    review is J3=REVISE with resource_incomplete preserved; no scientific or
    official research-state statement follows.
  next_concrete_action:
    owner: coordinator
    action: >-
      Create an additive successor repair, leaving this package immutable. Make
      the host-operation predicate derived and typed; add nonnegative,
      parseable, clock/host-bound observation rules; define a closed PB-3
      formula/cap schema and global STOP propagation; formalize CT-1 through
      CT-5 estimators, CI algorithms, endpoint and invalid-data semantics; add
      equality/inside/outside/zero-denominator/clock fixtures; and declare
      per-CT and total control resource caps including CT-5 raw retention and
      bootstrap cost. Re-run the same four controls plus the two bypass
      mutations above, then obtain a fresh independent J3 review before any
      disposition or status decision.
    stop_condition: >-
      Until those successor fields and controls are independently reviewed,
      no implementation, materialization, control execution, interpretation,
      resource-disposition change, status change, or scientific conclusion is
      authorized by this report.
