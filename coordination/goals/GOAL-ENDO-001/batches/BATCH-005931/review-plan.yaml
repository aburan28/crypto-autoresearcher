review_plan:
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-005931
  work_unit: resource-implementation-planning-gate-3-repair-and-review
  recorded_at: '2026-08-24'
  recorded_by: coordinator
  claim_scope: >-
    Review may change only the disposition of the superseding static repair
    package and its deterministic RC-1 custody record. It cannot establish a
    JINV, ECDLP, isogeny, transport, exponent, speedup, closure, or breakthrough
    claim.
  prior:
    expectation: >-
      I expect the repair to close the three J3 procedural defects and make the
      RC-1 custody reproducible, but I expect at least one reviewer to find a
      remaining boundary or provenance defect. I expect no scientific evidence.
    decision_if_overturned: >-
      If both reviews find the repair clean, the Coordinator must record that
      surprise and still keep resource_incomplete fail-closed; if either finds a
      defect, it is preserved without outvoting it.
  joints:
    - id: J1-repair-completeness-and-preservation
      owner_task_id: TASK-20260824-135261
      question: >-
        Does the repair package address every prior REVISE finding while keeping
        the immutable gate-2 package, scope, OBD-1 history, and authorization
        boundary unchanged?
      worked_attack_plan:
        - Reparse the repair package and map each prior finding to one explicit field and STOP action.
        - Check that every repair is additive/superseding and no frozen record is edited.
        - Run a known-false package with one repair field removed and one authorization raised; reject it.
    - id: J2-custody-and-deterministic-output
      owner_task_id: TASK-20260824-135261
      question: >-
        Does the retained raw RC-1 output come from the exact committed source,
        preserve the verified values, and remain reproducible without claiming a
        scientific rerun?
      worked_attack_plan:
        - Blindly derive the expected baseline, factor cases, and residual from the frozen worksheet before opening the custody report.
        - Compare source hashes, command, raw JSON, report, and receipt after derivation.
        - Run a known-false source-identity mutation and require the custody check to reject it.
    - id: J3-stop-controls-and-scope
      owner_task_id: TASK-20260824-8766e5
      question: >-
        Are missing observations, unknown PB-3 costs, and all CT-1 through CT-5
        controls governed by explicit quantitative STOP/PASS rules without
        hidden authorization or scientific overclaim?
      worked_attack_plan:
        - Construct no-observation materialization, unknown-PB-3, and each control-boundary edge case.
        - Confirm every edge case returns STOP or remains explicitly underived.
        - Run a known-false same-heading package with a planted authorization and reject it.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - tools/research_dispatch.py
      - experiments/EXP-JINV-bd141d/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-686cd3/review-plan.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/review-plan.yaml
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/archives/TASK-20260824-4ed6e4/snapshot-receipt.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-ab65a6/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-983ef2/
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/reviews/TASK-20260824-135261/
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/reviews/TASK-20260824-8766e5/
    attestation_required: >-
      Each reviewer states exactly what it read, confirms it did not read the
      sibling report, and discloses model/policy provenance. Independence is a
      fresh session and disjoint context; it is not distinct model-family quorum.
  proves_too_much_control:
    required: true
    construction: >-
      Each reviewer tests its assigned method against a same-heading package
      with one repair removed and one forbidden authorization set true. Acceptance
      of that package is a protocol failure and forces REVISE or FAIL.
    result_interpretation: >-
      Passing the control tests only the review method; it does not prove the
      repair correct. Failing it is evidence against the method, not against JINV.
  blind_rederivation:
    required: true
    blind_from:
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-983ef2/raw-result.json
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/tasks/TASK-20260824-983ef2/runtime-session-receipt.json
    rederiver_task_id: TASK-20260824-135261
    quantity: >-
      RC-1 baseline, three factor cases, and fixed residual derived from the
      frozen worksheet before reading the custody producer's output.
  procedure_deviations: []
  expected_outputs:
    - independent validator report with scoped PASS, REVISE, or FAIL
    - independent red-team report with scoped PASS, REVISE, or FAIL
    - final Coordinator decision composing the joints without outvoting dissent
