  repaired_boundaries:
    materialization:
      rule_id: REPAIR-MAT-1
      applies_when: materialization_on_host == true
      required_observation:
        field: current_host_observation
        required: true
        freshness_seconds: 3600
        required_fields: [host_id, observed_at, free_disk_bytes, memory_bytes, observation_status]
        accepted_status: known
      decision_table:
        - condition: observation_missing_or_null
          action: STOP_REFUSE_MATERIALIZATION
        - condition: observation_status in [unknown, unavailable, invalid, stale]
          action: STOP_REFUSE_MATERIALIZATION
        - condition: any_required_field_missing_or_nonfinite
          action: STOP_REFUSE_MATERIALIZATION
        - condition: observation_known_and_fresh_and_complete
          action: continue_to_separate_non_authorizing_checks
      no_observation_alternative_is_admissible: false
      pass_requires: current_host_observation_known_fresh_complete
      stop_preserves_resource_incomplete: true
    pb3:
      rule_id: REPAIR-PB3-1
      required_terms:
        - retained_bytes
        - largest_artifact_bytes
        - shard_count
        - logical_io_bytes
      required_model_fields: [sharded_merge_model, residual_artifact_grouping]
      unknown_values: [null, UNKNOWN, unknown, unavailable, invalid, nonfinite, unevaluable]
      decision_table:
        - condition: any_required_term_or_model_missing_unknown_invalid_nonfinite_or_unevaluable
          action: STOP_REFUSE_FIT_OR_PASS_INTERPRETATION
        - condition: all_terms_finite_nonnegative_and_model_evaluable
          action: evaluate_numeric_caps
        - condition: any_numeric_cap_exceeded
          action: STOP_REFUSE_FIT_OR_PASS_INTERPRETATION
        - condition: all_numeric_caps_satisfied
          action: remain_unapproved_and_return_to_coordinator
      unknown_is_not_zero: true
      underived_quantity_policy: leave_corresponding_estimate_underived
      stop_preserves_resource_incomplete: true

  quantitative_controls:
    common:
      execution_authorized_by_this_file: false
      unmeasured_control_is_not_pass: true
      missing_or_invalid_record_action: STOP
      uncertainty_rule: >-
        Use the pre-registered statistic and its stated 95% confidence interval
        (paired bootstrap, 10000 resamples, or exact binomial interval where
        applicable). If an interval cannot be computed, STOP. Boundary equality
        is handled exactly by the rule below; no operator discretion is allowed.
      replicate_policy: >-
        Replicates are independent seeded records; seeds, cardinality, and raw
        observations must be retained before evaluation.
    CT-1:
      metric: absolute_difference_in_collision_rate_vs_matched_null
      cardinality_replicates: 1000 signal trials and 1000 matched-null trials, paired by seed
      tolerance_or_effect_rule: |-
        PASS only if the 95% CI for (signal_rate - null_rate) contains 0 and
        its upper endpoint is <= 0.02; otherwise STOP.
      uncertainty_treatment: paired bootstrap 95% CI; STOP if fewer than 1000 valid pairs
      pass_behavior: PASS_CONTROL_ONLY
      stop_behavior: STOP_NO_SIGNAL_CLAIM
    CT-2:
      metric: excess_unique_output_rate_signal_minus_matched_null
      cardinality_replicates: 1000 signal trials and 1000 matched-null trials, paired by seed
      tolerance_or_effect_rule: |-
        PASS only if the 95% CI upper endpoint for the difference is <= 0.02
        and the point estimate is not positive beyond that tolerance; otherwise STOP.
      uncertainty_treatment: paired bootstrap 95% CI; invalid or missing pairs STOP
      pass_behavior: PASS_CONTROL_ONLY
      stop_behavior: STOP_NO_UNIQUENESS_CLAIM
    CT-3:
      metric: ratio_of_observed_signal_rate_to_matched_null_rate
      cardinality_replicates: 1000 signal trials and 1000 matched-null trials; minimum null count 20
      tolerance_or_effect_rule: |-
        PASS only if the two-sided 95% CI for the ratio is contained in [0.80, 1.25];
        zero or fewer than 20 null events is STOP, not a favorable ratio.
      uncertainty_treatment: exact binomial-log ratio interval; undefined denominator STOP
      pass_behavior: PASS_CONTROL_ONLY
      stop_behavior: STOP_NO_RATE_EQUIVALENCE_CLAIM
    CT-4:
      metric: paired_cpu_seconds_ratio_under_doubled_input_and_wall_rate_change
      cardinality_replicates: 30 independent seed pairs at baseline and doubled input
      tolerance_or_effect_rule: |-
        PASS only if the 95% CI for doubled/baseline CPU ratio is contained in
        [1.80, 2.20] and the 95% CI for wall-rate ratio is <= 0.60; otherwise STOP.
      uncertainty_treatment: paired bootstrap 95% CIs; any timeout, missing timing, or clock anomaly STOP
      pass_behavior: PASS_CONTROL_ONLY
      stop_behavior: STOP_NO_SCALING_CLAIM
    CT-5:
      metric: signal_effect_after_signal_destroying_parameter_minus_matched_null_effect
      cardinality_replicates: 1000 baseline trials and 1000 signal-destroyed trials, each with 1000 matched-null trials
      tolerance_or_effect_rule: |-
        PASS only if the 95% CI for destroyed-minus-null absolute effect is
        contained in [-0.02, 0.02] and the destroyed point estimate is <= 0.02;
        otherwise STOP.
      uncertainty_treatment: paired bootstrap 95% CI; incomplete strata STOP
      pass_behavior: PASS_CONTROL_ONLY
      stop_behavior: STOP_NO_VANISHING_EFFECT_CLAIM

  known_false_static_controls:
    - id: KF-MAT-NO-OBS
      input_mutation: materialization_on_host=true with current_host_observation=null
