    - "Check 3: the generic arm is confirmed (by direct re-execution) to be
      an exact code-path identity (speedup exactly 1.0 on every seed in
      both the committed 20-seed run and my independent 5-seed re-run),
      matching its documented role as a self-check rather than independent
