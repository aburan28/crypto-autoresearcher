  checks:
    - id: CHECK-1-targets_uniform_fix
      claim_checked: >
        harness/exp_icinv.py targets_uniform correctly finds the
        highest-order candidate point among up to max_candidates liftable
        x-coordinates, fixing the degenerate-point bug (CORR-20260807-9f83be);
        spot check on curve p=4001,a=2175,b=1450 should yield ~300 distinct
        targets from targets_uniform(E,3972,300,20260807), not ~1.
      verdict: PASS
      evidence:
        - "Read harness/exp_icinv.py:312-370 (_point_order, targets_uniform).
          _point_order implements the standard 'order from a known multiple'
          reduction: for each distinct prime q | n, repeatedly divides the
          running candidate o by q while (o/q)*P is still the identity
          (E.mul(...) is None). This is a correct, standard algorithm."
        - "targets_uniform scans x = 2 .. E.p-1 (up to max_candidates
          successful lifts), computes each lifted point's exact order via
          _point_order, and keeps the point of largest order seen, stopping
          early only if a full-order (cyclic-generator) point is found. It
          then derives targets as E.mul(h % gen_order, G) for the retained
          highest-order G. This matches the described fix exactly."
        - "Ran the exact prescribed one-liner: `python3 -c \"from
          harness.toycurve import EllipticCurve; from harness import
          exp_icinv as ex; E=EllipticCurve(4001,2175,1450);
          tg=ex.targets_uniform(E,3972,300,20260807); print(len(set(tg)))\"`
          -> printed 275 (close to 300, not near 1: PASS per the stated
          threshold)."
        - "Confirmed E.order() for this curve is 3972, matching the `order`
          argument used in the spot check (rules out a mismatched/fabricated
          test parameter)."
        - "Reproduced the internal search loop to expose the actual base
          point/order found: G=(4,1712), gen_order=1986 (exactly half of
          3972, i.e. the group is non-cyclic and this single-generator
          sampler reaches its largest cyclic subgroup, 200/200 candidates
          exhausted without finding a full-order point -- consistent with
          the docstring's stated, honestly-declared limitation)."
        - "Independently confirmed the OLD bug narrative: the first liftable
          x is x=3, giving point (3,0), and E.mul(2,(3,0)) is None, i.e. it
          really is a 2-torsion point of order exactly 2 (via
          _point_order too). This matches the synthesis's and the code
          docstring's account of the original defect."
        - "Sanity-checked the 275/300 distinct count against a birthday-
          collision approximation for uniform sampling from a group of size
          gen_order=1986: expected distinct ~= 1986*(1-exp(-300/1986)) =
          278.4, closely matching the observed 275. This confirms 275 is the
          expected result of correct uniform sampling over a group of order
          1986, not a sign of residual degeneracy."
      notes: >
        Fix verified both by code reading and by independent re-execution,
        including reproducing the pre-fix bug on the same curve to confirm
        the defect narrative is real (not just the fix). No discrepancy
        found.
    - id: CHECK-2-mtgt_crossover
      claim_checked: >
        harness/run_mtgt2.py build_table_incremental costs one E.add per
        entry (not a scalar mult); harness/isogeny_class.py velu_odd raises
        on even ell; independent re-run at p=50021, ells 3/7/13 shows ratios
        all > 1.0 (transport losing), growing with ell.
      verdict: PASS
      evidence:
        - "harness/run_mtgt2.py:53-64 build_table_incremental: loop body is
          exactly `R = E.add(R, P); out.append((R, s))` per entry -- one
          point addition, no E.mul/double-and-add. Confirmed by direct
          reading, contrasted in-file with build_table_batch (line 44-50,
          the deliberately-kept 'INFLATED' comparison baseline using
          `E.mul(s, P)` per entry)."
        - "harness/isogeny_class.py:388-413 velu_odd: first statement is
          `if ell % 2 == 0: raise ValueError(...)`, with a docstring
          explaining exactly the prior silent-identity-map defect (D1) this
          replaces. Confirmed by direct reading."
        - "Ran the exact prescribed command: `python3 -m harness.run_mtgt2
          --p 50021 --table-size 200 --ells 3,7,13 --no-write`. Output:
          ell=3 ratio=1.572, ell=7 ratio=4.836, ell=13 ratio=9.168; all
          `certified=True`, `same_class=True`; crossover_ell_estimate=None
          (no ell in range where transport wins)."
        - "Cross-checked shape against the committed run
          experiments/EXP-MTGT-952db3/runs/RUN-MTGT-p50021sweep
          (command.txt confirms --table-size 400, full ell sweep
          3..31): committed ratios ell=3:1.471, ell=7:4.765, ell=13:9.636,
          ..., ell=31:21.554, strictly increasing with ell throughout. My
          independent re-run at table-size 200 (1.572 / 4.836 / 9.168)
          matches the committed run's values at matching ell within ~10%
          (consistent with timing noise / different table_size / different
          machine load, not a discrepancy in the claim), and reproduces the
          same monotone-growing-with-ell shape."
        - "The synthesis's stated range '~1.5x at ell=3 to ~21x at ell=31'
          matches the committed run's actual ratios (1.471 and 21.554)
          essentially exactly -- not a rounding-favorable exaggeration."
      notes: >
        Both code-level claims (incremental-table-cost, even-ell guard) and
        the qualitative sweep-shape claim (transport loses everywhere,
        monotonically worse with ell, no crossover in range) independently
        reproduce. Minor incidental observation (not part of the four
        checks, not blocking): raw-result.json's top-level 'raw' payload
        does not itself carry command/revision, but command.txt and
        manifest.yaml alongside it in the run directory do -- provenance is
        present, just split across files rather than inlined in the metrics
        JSON.
