      the synthesis says it is, and it was verified to actually behave that
      way rather than merely asserted."
    - "Check 4: the binomial-null (NULL-B) comparison functions as the
      null-object control against which the reported over-dispersion is
      measured; see the null-object-control note under CHECK-4 evidence for
      the AGENTS.md-mandated 'does the effect decay under its destroying
      parameter' analysis, which the synthesis passes honestly (reports
      non-decay rather than hiding or overclaiming it)."
    - "No other positive/negative controls (e.g. full artifact-hash
      verification of every file in EXP-MTGT-952db3 / EXP-EWALK-5ca18c /
      EXP-ICINV-55c2d8, dirty-tree/environment audits, or the N1/N2
