  checks:

  - id: V1
    question: IS IT ACTUALLY FROZEN?
    answer: >-
      YES. Every rule in SR3-v3 was walked. No gating quantity is described in
      prose without a number, stated as a range, or left with an estimator whose
      form is undetermined. The three ambiguities found are drafting defects in
      branches that are PROVABLY UNREACHABLE under this contract, and none of
      them is a numeric free parameter.
    walked:
      applies_at_primes: p = 4001 and p = 6007 only -- pinned; p = 2003 and
        NULL-R explicitly ungated, unchanged from v2.
      frozen_inputs: T = 400, the thirteen factor-base sizes, n_rows 13, seed
        20260807, arm A0, class_role primary, and the two reference run ids --
        all pinned; the reference digests independently reproduce.
      n_j: read at run time but DETERMINED, not chosen -- the curve set comes
        from v2's A2 (harness/run_saturation.py:run, full stop) and A6 pins the
        hash of every source file executed. Verified constant at 138 / 140.
      estimators: mbar_j = (m_A0_j + m_ref_j)/2; se_j; gamma2_j(m_ref_j, T);
        sigma_VR(VR_ref_j, n_j, gamma2_j); sd_j = sqrt(2) sigma_VR; z_j; w_j --
        all closed form, no free constant anywhere in the chain.
      thresholds: 3.5 (two-sided, both statistics); G2 aggregate "at most one of
        thirteen"; G3b 0.25; G3c 0.25 with C_4001 = 1.918 and C_6007 = 1.591;
        G5 "more than two of thirteen"; G1 and G4 structural booleans. All
        numbers.
      range_shaped_quantities: >-
        every "approximately", "of order" and "about" in the file
        (2.0e-3, 5e-2, kappa 2.9, 0.94, 4.9%) occurs inside a block explicitly
        marked non-gating (`false_failure_probability_of_the_frozen_gate`,
        `consequence_if_wrong`, `illustrative_annex_non_gating`,
        `a_looser_gate_has_not_bought_a_stronger_claim`). No gating threshold is
        a range.
    findings:
    - id: F-V1.1
      severity: drafting_defect_unreachable_on_this_contract
      title: G2 states one rule three ways that do not coincide in states G5 permits
      detail: >-
        G2 reads: "Every non-degenerate row must PASS the reproduction test
        above. AGGREGATE TOLERANCE: AT MOST ONE (1) OF THE THIRTEEN ROWS AT A
        PRIME MAY FAIL AND THE PRIME STILL REPRODUCES -- that is, at least 12 of
        13 (92.3%) must pass, counted over non-degenerate rows." The universal
        first sentence is contradicted by the second; and "at least 12 of 13"
        does not coincide with "at most one failure counted over non-degenerate
        rows" whenever a row is degenerate -- with the two degenerate rows G5
        expressly permits, "at least 12 of 13" is unsatisfiable while the
        non-degenerate reading admits 10 of 11. A later session could cite
        whichever reading suited a result.
      why_it_does_not_defeat_the_freeze: >-
        The branch is UNREACHABLE. G5 declares a row degenerate iff
        mbar_j(1 - mbar_j) = 0 or VR_ref_j <= 0. Read from the frozen
        references: m_ref lies in [0.016285714285714285, 0.9723731884057971] and
        VR_ref >= 1.1125313273888915 > 0 at every row of both primes; and
        mbar = (m_A0 + m_ref)/2 with 0 < m_ref < 1 cannot equal 0 or 1 for any
        m_A0 in [0, 1]. No row can be degenerate, so all three readings coincide
        and G2 is unambiguous on this contract.
      required_before: any amendment that changes the seed, T, the curve set,
        the sampler or the references must resolve the wording first.
    - id: F-V1.2
      severity: minor_unreachable
      title: the operating-row rule does not say whose densities or how to break a tie
      detail: >-
        G3 defines the operating row as "the row whose mean |3V| / #E is closest
        to 1/3! = 0.16666666" and requires re-derivation, but does not state
        whether the densities are Arm A0's or the reference's, and specifies no
        tie-break. On the frozen configuration the two coincide and there is no
        tie: p = 4001 gives 0.16281 at fb = 8 against 0.22266 at fb = 9;
        p = 6007 gives 0.15260 at fb = 9 against 0.20212 at fb = 10. The
        truncated constant 0.16666666 does not change either argmin.
    - id: F-V1.3
      severity: minor_resolved_by_the_specification
      title: VR_ref_j is not bound to an artifact field, and the reference carries two candidates
      detail: >-
        v3 defines VR_ref_j as "the frozen reference run's pooled NULL-B variance
        ratio at row j" without naming the field. The reference raw-result.json
        carries both `variance_ratio` (1.2315292605941532 at p = 6007, fb = 4)
        and `residual_over_binomial_ratio` (1.226302284117542 at the same row).
        specification.yaml resolves it uniquely -- `variance_ratio_pooled` is
        "observed per-curve rate variance divided by the NULL-B binomial null
        variance mubar(1-mubar)/T", which I confirmed equals
        observed_variance / binomial_null_variance = `variance_ratio` exactly.
        So the quantity is determined; naming the field would remove the last
        inch of executor judgement.
    - id: F-V1.4
      severity: BLOCKING_BEFORE_EXECUTION
      title: >-
        the frozen MUST-report on per-curve exactness is UNSATISFIABLE from any
        committed artifact, and its natural repair is forbidden by A9
      detail: >-
        `per_curve_exactness_reported_not_gating` freezes: "The run MUST report,
        per row, the maximum absolute difference between Arm A0's per-curve rate
        and the reference's per-curve rate, and the count of curves at which
        they differ." THE REFERENCE'S PER-CURVE RATES DO NOT EXIST IN ANY
        COMMITTED ARTIFACT. RUN-ICINV-f09176 and RUN-ICINV-p4001-fixed each
        contain exactly command.txt, environment.json, manifest.yaml,
        raw-result.json, stdout.log and stderr.log; their raw-result.json carries
        only row-level aggregates (fb_size, mean_rate, n_curves,
        observed_variance, binomial_null_variance, variance_ratio,
        residual_over_binomial_ratio, mean_density_3V_over_order, verdict) and no
        per-curve array. The asymmetry is real and I checked both sides: the
        EXP-ICINV-4d33aa runs DO emit per-curve tables (140 curve rows with
        r, n1, n2, coverage), so the Arm A0 side is available and the reference
        side is not.
      why_it_bites: >-
        A9 forbids re-measuring or substituting a reference and makes doing so
        INVALID. A version-3 Executor therefore faces three bad options and the
        amendment names none of them: (a) omit the report and be non-compliant
        with the frozen amendment; (b) re-derive the reference's per-curve rates
        by re-running the committed sampler at the frozen seed -- which IS
        re-measuring the reference and makes the run INVALID under A9, a third
        INVALID termination for a third non-mathematical reason; (c) report it
        as unavailable, which is the right answer but is a deviation the
        amendment does not authorize.
      second_order_consequence: >-
        The block's stated purpose is defeated too: "the condition is therefore
        reported so that a version-4 amendment can promote it on evidence" --
        the scheduled evidence can never be produced while A9 stands, so the
        promotion path is closed rather than deferred.
      the_amendment_names_this_failure_mode_one_sentence_earlier: >-
        "freezing a strict condition whose satisfaction has not been checked is
        precisely how this experiment produced two INVALID terminations." The
        satisfiability of this condition was not checked. The block does
        disclose that per-curve exactness was never verified from a committed
        artifact; what it did not notice is that the data does not exist.
      recommended_repair_before_execution: >-
        A superseding minimal amendment, or an explicit instruction in the
        execution handoff, that either (i) restricts the per-curve report to Arm
        A0's own per-curve rates plus the row-level comparison the reference does
        support, or (ii) declares the reference-side per-curve comparison
        UNAVAILABLE BY ARTIFACT and records that A9 makes it permanently so. Not
        a Validator's to write; recorded here as the defect.
      not_affected: >-
        The sibling requirement in
        `empirical_check_of_the_declared_heuristics_reported_not_gating`
        (observed per-row excess kurtosis and between-curve variance) IS
        satisfiable, because it concerns the run's own per-curve estimates.
        Neither requirement is gating, so neither can make SR3-v3 fail; the risk
        is an Executor's response to an impossible MUST.

  - id: V2
    question: ARE se_j AND sd_j CORRECT?
    answer: >-
      BOTH FORMULAE ARE CORRECT AS THE SAMPLING STANDARD DEVIATIONS OF THE
      DIFFERENCES THEY ARE APPLIED TO, under the two-sample independence premise,
      and the factor of 2 and the factor of sqrt(2) are justified by that
      structure rather than assumed. Derived independently below. Four findings
      attach, all in the permissive direction and none creating an admissibility
      risk.
    independent_derivations:
      se_j: >-
        Hold the curve set fixed. Curve c's estimate is X_c/T with
        X_c ~ Binomial(T, mu_c). The row mean is m = (1/n) sum_c X_c/T, so
        Var(m) = (1/(nT)) * mean_c[mu_c(1 - mu_c)]. For two INDEPENDENT
        measurements of the same row,
        Var(m_A0 - m_ref) = Var(m_A0) + Var(m_ref) = 2 mean_c[mu_c(1-mu_c)]/(nT).
        THE FACTOR 2 IS THE SUM OF TWO EQUAL VARIANCES, i.e. it comes from the
        two-sample structure and is not a fudge. Substituting mbar(1-mbar) for
        mean_c[mu_c(1-mu_c)] gives exactly the frozen
        se_j = sqrt(2 mbar(1-mbar)/(nT)) = sqrt(2) sigma_m(j). CONFIRMED.
      direction_of_the_substitution: >-
        mean_c[mu_c(1-mu_c)] = mbar(1-mbar) - Var_c(mu_c), so mbar(1-mbar)
        OVERSTATES the variance by exactly the between-curve variance of the true
        rates -- conservative statistically, permissive as a gate, exactly as the
        amendment declares. CONFIRMED in direction; see F-V2.1 on magnitude.
      sd_j: >-
        For a sample of size n with excess kurtosis gamma2, the sample variance
        S^2 has Var(S^2) = sigma^4 (2/(n-1) + gamma2/n). VR = S^2 divided by the
        NULL-B null variance mbar(1-mbar)/T; treating the denominator as fixed
        gives sigma_VR = VR sqrt(2/(n-1) + gamma2/n), which is the frozen form,
        and the difference of two independent measurements multiplies it by
        sqrt(2). THE sqrt(2) IS AGAIN THE TWO-SAMPLE SUM. CONFIRMED. gamma2_j is
        the exact excess kurtosis of Binomial(T,m)/T and reproduces numerically
        at all four annex rows.
    findings:
    - id: F-V2.1
      severity: arithmetic_misstatement_non_gating_permissive
      title: the declared approximation's magnitude is understated by a factor of ~4.3
      detail: >-
        `declared_approximation_in_the_conservative_direction` says the factor is
        "within 0.15% of 1 at every row of both primes" and in the same sentence
        gives its own bound "(VR-1)/T <= 0.0065". Those two statements disagree.
        I computed the factor at every row: max (VR_ref - 1)/T = 0.006470 at
        p = 4001, fb = 18 (VR_ref = 3.5881004922763506). The factor is therefore
        within 0.65% of 1 ON THE VARIANCE and 0.32% ON THE STANDARD DEVIATION --
        not 0.15%, and not "at every row".
      also: >-
        the record calls (1 - (VR-1)/T) "the exact factor". Under its own model
        VR ~= 1 + (T-1) Var_c(mu)/(m(1-m)), so the exact factor carries (T-1),
        not T; and the quantity given is the ratio true/stated, not an
        overstatement factor, so "overstates ... by the exact factor
        (1 - (VR-1)/T)" reads backwards.
      consequence: >-
        NONE for admissibility. The approximation still runs in the permissive
        direction and 0.32% on the sd remains far below the 6.5% by which 3.5
        sits under the Sidak value it is compared to. This is an accuracy defect
        in a frozen record, not a design defect.
    - id: F-V2.2
      severity: undeclared_premise_permissive
      title: the independence premise behind the factor 2 and the sqrt(2) is not a declared heuristic
      detail: >-
        Both factors require the two measurements' TARGET STREAMS TO BE
        INDEPENDENT. Under the frozen configuration they are IDENTICAL -- same
        committed sampler, same seed 20260807, same class, same T, same grid --
        i.e. maximally dependent, and the true sampling sd of the applied
        difference is 0, not se_j or sd_j. The amendment discloses the identity
        in `known_vacuity_under_the_frozen_seed`, but HEUR-SR3-1 declares only
        that the CURVE SET is fixed; nothing in `declared_heuristics` numbers the
        independence premise that the two-sample factors rest on.
      consequence: >-
        The frozen tolerance is infinitely conservative on this configuration, so
        there is no admissibility risk. The finding is that a premise the
        estimator rests on is disclosed narratively rather than numbered
        alongside HEUR-SR3-1 and HEUR-SR3-2.
    - id: F-V2.3
      severity: model_tension_permissive
      title: HEUR-SR3-1 and HEUR-SR3-2 rest on different randomness models
      detail: >-
        `uncertainty_estimator` claims "Everything below follows from that single
        model". It does not. HEUR-SR3-1 fixes the curve set, so the between-curve
        spread of the true rates mu_c is a CONSTANT and not sampling noise --
        which is precisely what licenses se_j to carry no between-curve term.
        HEUR-SR3-2 then applies the i.i.d.-sample formula for sd(S^2) to the
        across-curve sample, which counts that same between-curve spread as
        RANDOM. Under HEUR-SR3-1's own model the sd of S^2 is
        sqrt(4 sigma_mu^2 sigma_e^2/n + 2 sigma_e^4/(n-1)), which is 0.98, 0.87
        and 0.69 times the frozen sd_j at VR = 1.23, 2.0 and 3.59 respectively --
        so the frozen sd_j is up to about 45% larger than that model implies.
      second_component: >-
        sd_j also treats the NULL-B denominator mbar(1-mbar)/T as a constant
        although it is estimated from the same data. The relative sd of m at the
        noisiest row (p = 6007, fb = 4) is about 3.3%, comparable to the 3.4%
        kurtosis correction the amendment took care to include and to disclose.
      consequence: >-
        Both effects are permissive and neither creates an admissibility risk.
        But HEUR-SR3-2's `consequence_if_wrong` -- the "kappa of order 2.9 raises
        the whole-gate false failure from 2.0e-3 to of order 5e-2" sensitivity --
        is computed under a resampled-curve model that HEUR-SR3-1 excludes, so
        the residual risk the amendment states is, under the protocol's own
        randomness model, if anything an over-statement of the risk. That is the
        honest direction to err in; the finding is that the claim of a single
        coherent model is not correct.
    - id: F-V2.4
      severity: arithmetic_that_understates_the_record_s_own_disclosure
      title: the two-sample sqrt(2) is applied to z and w but omitted from G3b
      detail: >-
        `disclosed_thinness_that_is_NOT_repaired_here` applies one pair of
        figures to BOTH G3b and G3c: "about 1.08 estimated sampling standard
        deviations at p = 4001's operating row and about 1.25 at p = 6007's".
        By the amendment's own structure that is right for G3c, a comparison
        against a FIXED CONSTANT (0.25/sigma_VR = 1.0779 and 1.3188), and wrong
        for G3b, a comparison of TWO MEASUREMENTS, whose sampling sd is
        sd_j = sqrt(2) sigma_VR: 0.25/sd_j = 0.7622 at p = 4001 and 0.9325 at
        p = 6007. The sqrt(2) the record applies to z and w is omitted exactly
        where including it would make its own disclosed thinness look worse.
      magnitude: >-
        under a fresh independent redraw the two-sided false-failure probability
        of G3b alone would be 0.446 at p = 4001 and 0.351 at p = 6007, against
        0.281 and 0.187 for G3c.
      consequence: >-
        Non-gating today: G3b's delta is 0 by construction under the frozen seed.
        It must be corrected before any amendment that changes the seed, T, the
        curve set or the sampler -- which is the exact condition the block itself
        sets ("ANY future amendment that changes the seed, T, the curve set or
        the sampler MUST revisit it before dispatch"). Feeds F-V3.2.

  - id: V3
    question: DOES THE FAMILY DEFINITION MATCH THE DECISION RULE?
    answer: >-
      THE ACCOUNTING IS COHERENT. The 52-test family and the per-prime firing
      rule are used for two DIFFERENT purposes and the amendment does not confuse
      them: 52 supports only the Sidak direction claim (that multiplicity bought
      no width), while the gate's own false-failure probability is derived
      separately and correctly from the per-prime aggregate rule. Two findings
      attach, one about the family-size sensitivity of the direction claim and
      one about how DEC-20260810-6b4554 restates the probability.
    detail: >-
      52 = 13 rows x 2 gated primes x 2 statistics is the correct count of tests
      that could individually fire, and it correctly excludes p = 2003 and NULL-R,
      which SR3 does not gate. The family-wise figure 0.0239 is NOT the gate's
      failure rate and is never used as one; the gate fires per prime, and
      `false_failure_probability_of_the_frozen_gate` re-derives that separately
      as q + C(12,2) q^2 per prime and 1.97e-3 over two primes, which I
      reproduced exactly. The decomposition is exhaustive for G2 and G3a
      together: a prime fails if the operating row fails (G3a) or if two or more
      of the remaining twelve fail (G2). Degenerate rows would reduce the number
      of live tests below 52, which is conservative for the Sidak comparison.
    findings:
    - id: F-V3.1
      severity: sensitivity_worth_stating
      title: the "3.5 is stricter than Sidak" claim is family-size sensitive, and the record uses the most flattering family
      detail: >-
        The claim's SIGN depends on the family size. Solving
        1 - (1 - 2Q(3.5))^k = 0.01 gives a crossover at k = 21.60: for k >= 22
        the Sidak threshold exceeds 3.5 (so 3.5 is the stricter gate), and for
        k <= 21 it does not. Recomputed Sidak thresholds for a 1% family-wise
        rate: k = 52 gives 3.7277; k = 26 (the per-prime family of 13 rows x 2
        statistics, which is the family the aggregate rule actually fires over)
        gives 3.5492; k = 13 gives 3.3624, at which 3.5 would be LOOSER than
        Sidak. Choosing the largest defensible family maximises the apparent
        strictness margin: it falls from 0.228 at k = 52 to 0.050 at k = 26.
      assessment: >-
        The conclusion SURVIVES the family that matches how the rule fires
        (3.5492 > 3.5 at k = 26), so the direction claim is not wrong and no
        looseness was bought. But the margin is an order of magnitude thinner
        than 52 suggests, and a reader is entitled to the per-prime figure
        beside it. Recommend the per-prime Sidak value be recorded alongside, in
        any successor.
    - id: F-V3.2
      severity: material_overstatement_in_the_committed_decision_record
      title: DEC-20260810-6b4554 drops the exclusion qualifier the amendment attaches to 2.0e-3
      detail: >-
        The amendment is careful: its `value` field reads "Approximately 2.0e-3
        ... EXCLUDING G1, G4 and G3b/G3c for which no sampling model is stated."
        DEC-20260810-6b4554 rationale item 4 restates it as "the whole-gate
        false-failure probability, approximately 2.0e-3, computed from the frozen
        constants", with no exclusion. By the amendment's own disclosure --
        corrected for F-V2.4 -- the excluded G3b is the check most likely to fire
        on a fresh draw: 0.25 is 0.76 sd of the two-sample difference at
        p = 4001 and 0.93 at p = 6007, i.e. two-sided false-failure probabilities
        of about 0.45 and 0.35. That is more than two orders of magnitude above
        2.0e-3 and would dominate any fresh-draw gate failure.
      assessment: >-
        The amendment is CORRECT and the decision's summary of it is NOT. The
        decision's own limitation (iii) does disclose the +/-0.25 thinness, so
        the fact is somewhere in the record; the defect is that the headline
        number is presented unqualified in a committed decision, where a later
        reader will take it as the gate's risk. Under the frozen seed no
        fresh-draw risk is realized at all, so nothing operational turns on it
        today.

  - id: V4
    question: IS THE POST-HOC DISCLOSURE COMPLETE?
    answer: >-
      SUBSTANTIALLY YES, AND UNUSUALLY SO -- the six declared items are genuine,
      each is stated against the amendment's own interest, and the single most
      damaging fact (that under the frozen seed the differences are identically
      zero, so G2 exercises the threshold 3.5 not at all) is disclosed
      prominently in both records rather than buried. I searched for elements
      chosen with reference to the observed failures that are NOT disclosed and
      found no fitted quantity and no hidden leniency. Three findings attach: one
      composite-disclosure gap that matters, and two precision points that do
      not.
    verified_disclosures: >-
      the decision to redesign at all; the user's choice of direction with the
      failed rows in view; retiring the band knowing where the reference crosses;
      retaining G3b and G4 as gating knowing both passed under version 2;
      promoting G3c to gating knowing it passed with deltas 0.0002028 and
      -0.0122358; and the kurtosis correction whose effect is largest at exactly
      the rows that failed, quantified at 3.4% at p = 6007 fb = 4 and 0.10% at
      fb = 9. I recomputed the kurtosis figures (1.03442 and 1.00101) and confirm
      the amendment's conclusion that a 3.4% widening at the noisiest row does
      not rescue anything.
    findings:
    - id: F-V4.1
      severity: composite_disclosure_gap_material_to_a_reader
      title: every sub-check is individually disclosed as known-to-pass; the conjunction never is
      detail: >-
        Assembling the record's own facts: G1 passes (n_curves constant at 138 /
        140 in both references and equal to Arm A0's); G2 passes with z = w = 0
        at every row -- I recomputed the deltas independently from the reference
        raw-results and got |z| <= 1.5e-14 and w = 0 exactly; G3a passes; G3b's
        delta is 0 by construction; G3c's deltas are 0.0002028 and -0.0122358,
        both inside +/-0.25; G4's monotonic_decay is False in both references;
        G5 cannot fire (F-V1.1). THEREFORE SR3-v3, APPLIED TO THE FROZEN
        CONFIGURATION AGAINST THE FROZEN REFERENCES, IS KNOWN IN ADVANCE TO PASS
        IN ITS ENTIRETY. The amendment states this for G2 alone, and separately
        records that G3b, G3c and G4 were seen to pass, and separately records
        that no reference row was degenerate. It never draws the conjunction.
      why_it_matters: >-
        It is the single fact a reader most needs when weighing whether the third
        execution's SR3 is a control at all. A gate that is known in advance to
        pass is, for that run, an implementation-drift detector and nothing more
        -- which is what the amendment says of G2 and what is in fact true of the
        whole gate. This is NOT an undisclosed element and NOT a fabrication:
        every component is on the record and the amendment's honesty at the
        component level is real. The synthesis is missing from both v3 and
        DEC-20260810-6b4554, and it is the natural place for a later reader to
        be misled about what the redesign buys.
    - id: F-V4.2
      severity: attribution_precision_low_inert
      title: the design implements candidate (b) plus a piece of candidate (c)
      detail: >-
        v3 labels the whole block "Candidate (b) of DEC-20260809-de11f9 N10-v3,
        as elected by the user". G2's aggregate tolerance -- at most one of
        thirteen rows may fail and the prime still reproduces -- is a revision of
        SR3's all-thirteen-rows requirement, which is candidate (c)'s content,
        not (b)'s. It was not smuggled: the dispatching task card
        (coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/task-cards/TASK-20260810-dca469.md)
        directs "the per-row and aggregate decision rules, including what
        fraction of rows may fail and still reproduce". So the authority for that
        element is the Coordinator's card, not the user's election, and the
        record attributes it to the election. Note it is sized BELOW what
        candidate (c) would have required to cover the observed two-row crossing.
      consequence: inert on the frozen configuration (no row fails); material
        only for a future re-draw.
    - id: F-V4.3
      severity: provenance_precision_low_no_numerical_consequence
      title: values labelled "reference" are read from a file that carries only Arm A0's
      detail: >-
        The annex's `m_ref_as_read` figures and `known_vacuity`'s "the smallest
        reference mean rate read from RUN-ICINV-99f722/baseline-reproduction.json
        is 0.016285714285714292 ... and the largest is 0.9723731884057976"
        attribute to the REFERENCE numbers that file does not contain:
        baseline-reproduction.json carries `mean_rate` (Arm A0's) and
        `reference_variance_ratio`, but NO reference mean rate. The reference's
        own values, read from the artifacts A4 and A9 require the run to read,
        are 0.016285714285714285 and 0.9723731884057971. They differ only in the
        last floating-point digits, so no annex figure changes, but a version-3
        run sourcing m_ref_j correctly will not reproduce the annex's last digits
        -- which the annex's own `status` block already anticipates by giving the
        run's computation precedence.
    - id: F-V4.4
      severity: unverifiable_by_a_validator_recorded_as_unchecked
      title: the user's election of candidate (b) cannot be corroborated from committed artifacts
      detail: >-
        The election appears in three Coordinator-authored artifacts of the same
        dispatching session: the task card, v3's `authority_to_resume`, and
        DEC-20260810-6b4554. No user-authored artifact records it. What I CAN
        corroborate independently: DEC-20260809-de11f9 does reserve the third
        attempt as "a user decision, not dispatched automatically", does name
        three candidates, and candidate (b)'s wording is quoted VERBATIM. The
        records are also careful to label the authority as the user's and to
        distinguish it from a Coordinator self-grant, which is the correct form.
        The election itself is outside what a Validator can verify and is
        recorded here as UNCHECKED, not as passed.

  - id: V5
    question: IS THE "NOT REVERSE ENGINEERED" ARGUMENT SOUND?
    answer: >-
      ITS CONCLUSION HOLDS; ITS STATED ARGUMENT IS WEAKER THAN IT READS. The
      aggregate tolerance was not sized to absorb the observed failure -- two
      rows crossed and the tolerance is one. But the counterfactual that carries
      the argument has an antecedent that CANNOT OCCUR, and the two rows in
      question are not failures under v3 at all.
    the_specific_check_requested: >-
      WOULD THE TWO PREVIOUSLY-FAILING ROWS PASS THEIR PER-ROW z AND w TESTS
      INDIVIDUALLY? YES, TRIVIALLY. Recomputed independently from the reference
      raw-results rather than from baseline-reproduction.json: at p = 6007,
      fb = 4 (VR_ref = 1.2315292605941532), dm = +6.9e-18 gives z = +9.2e-15
      against a 3.5se half-width of 2.647e-3, and dVR = 0 exactly gives w = 0
      against a 3.5sd half-width of 0.756. At fb = 5 (VR_ref =
      1.1125313273888915), dm = 0 gives z = 0 and dVR = 0 gives w = 0, against
      3.567e-3 and 0.672. Both rows pass with roughly fourteen orders of
      magnitude of margin. (The residual 1e-17-scale differences are
      floating-point summation-order artifacts between the two files, not
      measurement differences.)
    does_that_change_the_argument: >-
      YES, IN ITS FORCE THOUGH NOT ITS CONCLUSION. The sentence "If the version-2
      failure had been a G2 failure, this aggregate rule would have failed the
      prime anyway" is a counterfactual whose antecedent is impossible under the
      frozen protocol: no row CAN be a G2 failure when the two measurements are
      identical by construction, which is the same fact the amendment argues at
      length elsewhere. The rebuttal is therefore VACUOUS rather than false --
      the observation constrains the aggregate tolerance in neither direction,
      because the tolerance is inert. What actually cures the observed failure is
      not merely retiring the band (A8) but THE CHANGE OF TESTED QUANTITY: from
      Arm A0's ABSOLUTE level against a hull fitted to an earlier sample, to the
      DIFFERENCE between two measurements that are equal by construction. The
      amendment's "two rows crossed and G2 permits one" phrasing invites a reader
      to think v3 still counts those rows as failures and rejects them; in fact
      v3 passes both with z = w = 0. That flatters the design's apparent
      strictness. The conclusion the argument is offered for -- that the cure is
      A8, openly, and not a tolerance quietly sized to absorb the failure --
      SURVIVES and is if anything strengthened: nothing in v3 is sized to absorb
      the failure, because the failure mode is removed outright.
    findings:
    - id: F-V5.1
      severity: argument_quality_conclusion_survives
      title: the non-reverse-engineering rebuttal rests on an impossible counterfactual
      detail: as stated above. Recommend any successor state it as "the aggregate
        tolerance is INERT on the observed data (no row fails), so it cannot have
        been sized to absorb the failure" rather than as a counterfactual about a
        G2 failure that cannot occur.
    - id: F-V5.2
      severity: direction_selective_quantitative_claim
      title: '"tighter, not looser" holds upward and fails downward at 23 of 26 rows'
      detail: >-
        `a_looser_gate_has_not_bought_a_stronger_claim` compares the retired
        band's UPWARD slack at the p = 6007 operating row (an Arm A0 reading 3.6
        against a reference of 1.5787641552269556, "a 128% discrepancy" -- I
        confirm 128.03%) against G2's admitted discrepancy there ("about 0.94" --
        I confirm 3.5 sd_j = 0.9383). Downward the comparison REVERSES: the
        band's downward slack at that row is 1.5788 - 1.3 = 0.2788, i.e. 17.66%,
        against G2's +/-0.9383 -- G2 admits 3.4 times the downward deviation the
        band did. I computed this at every row of both primes: G2's half-width
        EXCEEDS the band's downward slack at 23 of 26 rows, the three exceptions
        being p = 4001 fb = 18 and fb = 22 and p = 6007 fb = 18, all at the
        saturated end where the reference sits near the band ceiling. Downward is
        the direction in which the version-2 failure actually occurred.
      assessment: >-
        The SUBSTANTIVE point stands and the amendment also states it correctly:
        "what v3 removed is a requirement about the REFERENCE'S ABSOLUTE LEVEL
        that was never a reproduction requirement; what it added is a per-row
        agreement requirement that the previous gate did not impose at all." The
        two gates test different things and are not orderable by tightness in
        general. The finding is that the record's quantitative headline is
        supported only in the upward direction, and that the honest statement is
        the qualitative one it already makes.
    - id: F-V5.3
      severity: none_verified_in_the_amendment_s_favour
      title: the central mitigation claim is TRUE and is not overstated
      detail: >-
        I verified by reading the formulae and by recomputing every row from the
        reference artifacts with no other input that THE ACCEPTANCE REGION AT
        EVERY ROW IS A FUNCTION OF (T, n_j, mbar_j, VR_ref_j) AND OF gamma2_j
        (itself a function of m_ref_j and T) AND OF NOTHING ELSE. There is no
        dependence on row index, on prime, on which rows failed, or on any
        quantity fitted to a sample. The tolerance is widest at fb = 4 (16.25% of
        the rate) and narrowest at the operating rows (4.73% and 4.88%) purely
        because a Binomial(400, 0.016) proportion is noisier than a
        Binomial(400, 0.166) one -- true independently of anything the version-2
        run reported, exactly as claimed. No hidden leniency at the two failed
        rows was found. T = 400 and the thirteen factor-base sizes are confirmed
        as frozen in the version-1 pre-registration, and the hull-fitting
        diagnosis is confirmed as predating the run that exposed it (v2's A5,
        2026-08-07, quoted faithfully).

  - id: V6
    question: DOES ANYTHING DOWNSTREAM MOVE?
    answer: >-
      NO. I diffed `unchanged_and_still_frozen` item by item against
      specification.yaml and amendments/v2.yaml. Every element it names exists in
      the specification as described and is untouched by v3. Nothing that
      converts a measurement into a claim moved. Two observations attach, neither
      of which is a defect against v3.
    verified_unchanged:
    - state_2's persistence statistic F_p, verbatim intact, including the 1.3
      threshold on ARM B's VR_pooled, the exclusion of "inconclusive" rows from
      BOTH numerator and denominator, and the one-third inconclusive cap.
    - PERSISTS iff F_p >= 1/2; the three-prime majority; the two-prime
      disagreement INVALID; threshold_1_3_rationale (Arm B must fall below the
      ENTIRE committed range, not its middle) -- all intact and correctly
      characterised by A8's scope limit.
    - OUTCOME-A with all four mandatory qualifications (i)-(iv); the S_POSITIVE
      rule with the 20 / 8-19 / <8 stratum floors; S1 (3-sigma mean split, the
      exact formula); S2 (VR_within <= 0.6 VR_pooled plus its own chi-square
      band at df = n-2); S3 (factor 2 stratum ratio); OUTCOME-B; OUTCOME-C;
      evidence_strength_calibration_frozen (3-0 permits `replicated`, 2-1 caps at
      `preliminary`).
    - SR1, SR2, SR4, SR5, SR6 and SR3's ORDERING (still before Arm B, a failure
      still stops stage 3 rather than degrading it).
    - the invalidation-rule list, including class_census agreement, the exact
      support certificates, the identical curve-set / factor-base / target-count
      / seed requirement, the shared-sum-set requirement, the 1e-9
      variance-decomposition identity, the no-dropped-curves rule, the NULL-C
      prohibition, and the prohibition on modifying harness/exp_icinv.py. The
      rule "Arm A0 fails the baseline-reproduction control -> INVALID" is
      retained in force and re-pointed at SR3-v3 by A8, which is a redirection of
      the control it names, not a weakening of the rule.
    - the primes {2003, 4001, 6007}, the thirteen factor-base sizes, target
      counts {100, 400, 1600} with primary 400, the three seeds, arity 3, the
      operating density 1/3!, the stratum floors, and "all five tail checks"
      (specification.yaml's required_artifacts names exactly five).
    - scale_relevance tier toy and sota_delta zero; `exploratory_only` and the
      UNCONDITIONAL `preliminary` evidence cap, which v3 carries forward and
      argues should be strengthened rather than lifted --
      `confirmatory_status_strengthened_2026_08_10` makes the case for the cap
      worse, never better, which is the correct direction.
    - v2's changes A2, A3, A4 and its A6 blocking precondition, all retained; A1
      is discharged by A9 rather than relaxed, and A9's freeze of the references
      is a genuine tightening whose digests I verified.
    findings:
    - id: F-V6.1
      severity: observation_v3_silently_repairs_a_version_2_substitution
      title: G3c is a RESTORATION of the specification's literal text, not only a new strengthening
      detail: >-
        specification.yaml's BASELINE-REPRODUCTION CONTROL states the
        operating-row tolerance literally as "operating-density row within +-0.25
        of 1.918 (p = 4001) and 1.591 (p = 6007)" -- i.e. against the contract's
        PROSE CONSTANTS, which is v3's G3c. The version-2 run instead made the
        comparison against the REFERENCE's operating value gating
        (`operating_row_within_tolerance`) and reported the contract's own
        literal comparison as `contract_stated_reference_reported_not_gating`.
        v3 makes BOTH gating, which restores the specification's literal
        requirement AND keeps version 2's substitute. v3 describes G3c as "NEWLY
        GATING IN VERSION 3", accurate against version 2's execution but not
        against the frozen specification, in which G3c is the original
        requirement and G3b was the substitution. The net effect is a
        strengthening on either reading; the finding is only that the record does
        not name the version-2 substitution it is correcting.
    - id: F-V6.2
      severity: naming_trivial
      title: A5 and A6 are v2 post-review notes, not entries in v2's `changes`
      detail: >-
        v3's unchanged list calls A6 an "Amendment v2 change". In v2, A5 and A6
        appear under `post_review_notes_2026_08_07` as
        `A5_new_standing_caution_on_the_band` and
        `A6_blocking_precondition_added`, while `changes` holds A1-A4. Their
        force is unaffected and A6's blocking status is correctly carried into
        v3's `approval_scope_limit`.

  proof_architecture_checks:
  - check: baseline fixture
    result: >-
      APPLICABLE AND VERIFIED IN THE NARROW SENSE AVAILABLE. The claimed
      reproduction reproduces exactly: Arm A0 matches both frozen references at
      13 of 13 rows with a variance-ratio delta of exactly 0.0 and a mean-rate
      delta below 1.4e-17. The frozen references' digests reproduce. What this
      does NOT establish is any mathematical claim; it establishes that two
      identically-seeded calls to the same committed sampler agree, which is what
      F-V4.1 says a reader must weigh it as.
  - check: strictness witness
    result: >-
      NOT SATISFIED AS A GENERAL CLAIM AND NOT NEEDED FOR THIS ARTIFACT. v3
      claims the new gate is tighter "in the one respect that matters"; F-V5.2
      shows that claim is direction-selective. No improvement claim of any other
      kind is made and none is credited.
  - check: quantifier fidelity
    result: >-
      VERIFIED. The false-failure probability is stated per row, per prime and
      over two primes with the quantifier order explicit at each step, and it is
      correctly labelled a computed property of the frozen rule under a declared
      model rather than an empirical claim or a prediction about any run.
  - check: nearby-object control
    result: not applicable to a control redesign; recorded rather than omitted.

  heuristic_validation_checks:
  - heuristic: HEUR-SR3-1 (fixed curve set; only the target stream is random)
    pre_registered: yes, in this amendment, before any version-3 execution.
    validation_status: >-
      structural rather than empirical -- it follows from the frozen
      class-selection rule and is enforced by G1. Verified against the artifacts:
      n_curves is constant at 138 (p = 4001) and 140 (p = 6007) across all
      thirteen rows of each reference and equals Arm A0's counts.
    finding: see F-V2.2 (the independence of the two target streams, which the
      factor 2 and the sqrt(2) require, is a separate premise and is not numbered).
  - heuristic: HEUR-SR3-2 (per-curve estimates behave as an approximately
      independent sample with binomial excess kurtosis; mixing distribution taken
      to have zero excess kurtosis)
    pre_registered: yes.
    labelled_as_an_assumption: yes, explicitly, and its `validation_status` reads
      "SCHEDULED, NOT SATISFIED" with a non-gating per-row reporting requirement
      as the scheduled validation and an explicit prohibition on any claim being
      stated as if it were validated. This is the correct handling.
    finding: see F-V2.3 -- its randomness model conflicts with HEUR-SR3-1's, and
      its stated adverse sensitivity is computed under the model HEUR-SR3-1
      excludes. The reporting requirement that validates it IS satisfiable
      (unlike the per-curve exactness requirement, F-V1.4), because it concerns
      the run's own per-curve estimates.
  - heuristic_validation_scale: >-
      TOY. p in {2003, 4001, 6007}, n_curves 138 / 140, T = 400. Nothing here is
      scale-matched to any cryptographic parameter and the amendment offers no
      transfer. Recorded as a limitation, per AGENTS.md rule 7.

