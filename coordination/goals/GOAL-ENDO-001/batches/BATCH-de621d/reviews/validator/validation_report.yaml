    corroborated only by Coordinator-authored artifacts of the dispatching
    session; DEC-20260809-de11f9 independently confirms the reservation to the
    user and the verbatim candidate text, but no user-authored artifact exists in
    the repository and a Validator cannot verify a user utterance.
  - >-
    I did not evaluate whether the SR3-v3 design is the BEST of the three
    candidates, only whether the filed design is frozen, arithmetically correct,
    and not quietly sized to pass. Candidate selection was the user's and is out
    of scope.
  - >-
    My recomputations of se_j, sd_j and gamma2_j verify the amendment's formulae
    and its arithmetic. They cannot verify that the underlying statistical model
    is the right one for the physical process, and F-V2.3 records a real tension
    between the two declared models. Both discrepancies I could sign run in the
    permissive direction, so neither creates an admissibility risk on this
    contract; on a fresh draw they would need re-derivation.
  - >-
    I did not execute the experiment, did not dispatch execution, did not edit
    any committed record including v3.yaml and DEC-20260810-6b4554, did not
    commit, and stayed entirely out of RQ-CANL-63098f, DEC-20260810-2c7e3c and
    all EXP-CANL-*, which a concurrent red-team task is reviewing. Zero runs were
    executed, matching the task's budget.
  - >-
    Findings F-V2.1, F-V2.4, F-V3.2, F-V4.2, F-V4.3, F-V6.1 and F-V6.2 are
    accuracy and presentation defects in immutable committed records. They are
    recorded here for a superseding record to address; nothing in them may be
    repaired by editing v3.yaml or DEC-20260810-6b4554 (AGENTS.md rule 4).

  recommendations_for_the_coordinator:
