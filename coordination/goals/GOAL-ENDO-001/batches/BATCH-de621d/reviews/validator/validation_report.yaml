    THIS REVIEW AND THE REVIEWED AMENDMENT RESOLVE TO MODELS ON THE SAME BACKEND.
    This harness has one usable backend, so "independent" here means an
    independent session, an independent context and a fresh reading of the
    committed artifacts -- NOT independent judgement from a different model. Any
