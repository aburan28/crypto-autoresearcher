    - id: V2
      question: >-
        Does targets_B's support equal E(F_p) on >=15 curves spread across
        different classes, verified by this Validator's own point
        enumeration, not by reading order-verification.json/support-
        certificates.json and trusting them?
      answer: "YES. CONFIRMED on 16 independently-constructed curves across 16 distinct classes (exceeds the >=15 minimum)."
      method: >-
        Own from-scratch elliptic-curve arithmetic (point addition/doubling,
        a square-root lookup table built by squaring every residue mod p once)
        and an independent curve-FINDING procedure: for each sampled (t,p)
        from the independently re-derived V1 family, randomly drew Weierstrass
        (a,b) pairs over F_p and did full brute-force point enumeration until
        one was found whose point count equals the target order p+1-t. This
        deliberately does NOT reuse the run's own (a,b) values from order-
        verification.json/support-certificates.json -- it constructs
        DIFFERENT curve instances of the same isogeny class from scratch, which
        is a stronger independence property than recomputing the order of the
        run's own listed curves would have been (any curve of that trace has
        the same #E(F_p) by Tate's isogeny theorem, so this still tests the
        class-level claim). Sample: 15 curves chosen from a fixed random
        selection spread across the whole 59-member family's index range, plus
        the t=211 aut-arm class (16 total, 16 distinct t/p/D values).
      results: >-
        All 16 curves: #E(F_p) enumerated == p+1-t == 19507 exactly (order_ok=
        true for all 16). Support check: for each curve, built the cyclic
        subgroup generated by an arbitrary single nonzero point and compared it
        by SET EQUALITY against the full independently-enumerated point set;
        equal for all 16 (support_ok=true for all 16). Sampled t values:
        -269,-233,-217,-205,-197,-119,-115,-89,25,47,71,97,181,203,247,211.
      agrees_with_run: >-
        Matches order-verification.json (2212 rows, all_pass:true,
        order_matches_N:true for every row) and support-certificates.json (2212
        rows, all_pass:true) in direction and content on every sampled class;
        not a byte-for-byte comparison since different (a,b) instances were
        used by design (see method).
      unchecked: >-
        The remaining ~2196 of 2212 curves (all curves outside this 16-curve
        sample) were not individually re-verified by this Validator; the
        group-theoretic argument under V4/V5 below (N=19507 prime => every
        nonzero point on any curve of order N generates the whole group, by
