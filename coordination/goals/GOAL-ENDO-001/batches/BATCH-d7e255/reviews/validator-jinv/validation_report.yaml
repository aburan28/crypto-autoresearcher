        under V2, and reported as verified for all 2212 curves in the family
        by the run's own SR2), and 19507 is prime with gcd(107,19507)=1, NO
        curve of trace t=211 -- crater or floor, and indeed no curve anywhere
        in this N=19507 family -- can carry a point of order 107. This is not
        an empirical fact that could vary curve-to-curve within the class; it
        follows deductively from the shared group order alone, which is
        exactly why the exhaustive single-curve check under V4 generalises.
        find_kernel_generator's own precondition (order % ell == 0) therefore
        fails identically on every curve of the class by the same necessary
        argument, confirming the Executor's report's own reasoning
        (transport-certificates.json's stated obstruction) rather than merely
        replicating its output.

