      answer: "YES to both, independently confirmed, plus a genuine exhaustive computational check (not merely 'if feasible' -- performed)."
      arithmetic_recomputation:
        N_is_prime: {recomputed: true, method: "own trial-division primality test on 19507"}
        p_is_prime: {recomputed: true, method: "own trial-division primality test on 19717"}
        p_plus_1_minus_t_equals_N: {computed: "19717+1-211 = 19507", equals_N: true}
        t_squared_minus_4p_equals_D: {computed: "211^2 - 4*19717 = -34347", equals_D: true}
        D_factorisation: {computed: "-3*107^2 = -34347", equals_D: true}
        gcd_107_19507: {computed_by_own_euclidean_algorithm: 1, claimed: 1, agrees: true}
      independent_point_order_check: >-
        Constructed an ACTUAL elliptic curve of trace t=211 over F_p=19717 by
        random search (own code, independent of both toycurve.lift_x and
        exp_icinv_fullgroup.enumerate_points_table): found (a,b)=(15172,6318),
        fully enumerated its point set (19507 points via own square-root-table
        method), confirmed order == 19507 == N. Then EXHAUSTIVELY computed
        107*P (own double-and-add scalar multiplication) for ALL 19507 points
        on this curve: zero nonzero points P satisfy 107*P = O. This directly,
        computationally confirms no point of order dividing 107 exists on this
        concrete curve of the t=211 class -- not merely inferred from gcd, and
        not merely "if feasible" but actually executed.
      group_theoretic_argument: >-
        Because N=19507 is prime (independently confirmed above) and #E(F_p)=N
        for every curve of this class by Tate's isogeny theorem (independently
        confirmed for 16 curves under V2, and consistent with the run's own
        2212-curve SR2 certification), Lagrange's theorem forces every point's
        order to divide N. Since N is prime, the only possible orders are 1 and
        19507. 107 is neither, and 107 does not divide N (gcd=1), so this
        result is NOT specific to the one curve exhaustively checked above --
        it is a mathematically necessary consequence of the group order N=19507
        being prime and coprime to 107, and therefore holds for EVERY curve of
        this class (indeed every curve of the entire matched-order family, all
        of which share #E=N by construction).

