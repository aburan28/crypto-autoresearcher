      method: >-
        Fresh, self-written Python script (no import of, or reference to,
        harness/exp_jinv_matched.py). For t in [-400,400]\{0}: p=N+t-1;
        require p prime (own trial-division primality test); D=(t-2)^2-4N;
        require D<0 (this is exactly the Hasse-bound/ordinariness condition
        for t!=0, since D=t^2-4p<0 <=> |t|<2*sqrt(p), and t=0 is the only
        value in this range with p|t, i.e. the only supersingular case, so
        excluding t=0 and requiring D<0 correctly enumerates the ordinary
        family); then decompose D=f^2*D0 with D0 the (unique) fundamental
        discriminant, via own from-scratch is_squarefree/is_fundamental_
        discriminant helpers (standard D0 = 1 mod 4 squarefree, or D0 = 4m
