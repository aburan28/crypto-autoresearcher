  - id: V1
    question: >-
      Do the elimination polynomial and its F_p-factorisation type for both
      witness curves, and S_3 support on >=10 census curves, independently
      reproduce?
    answer: "YES. REPRODUCE EXACTLY."
    method: >-
      Fresh `sage` session (`/usr/local/bin/sage`, invoked directly, no import
      of harness/exp_icinv_geometry.py), own from-scratch code transcribing
      only the frozen S_3 formula in specification.yaml
      (`preregistered_prediction.formula` /
      `ideal_definition.formula`): S_3 = (x1-x2)^2 x3^2 -
      2((x1+x2)(x1x2+a)+2b)x3 + ((x1x2-a)^2-4b(x1+x2)) over GF(4001); ideal
      <S_3, dS_3/dx1, dS_3/dx2, dS_3/dx3>; `elimination_ideal([x1,x2])`;
      monic univariate generator; `.factor()`.
    results:
    - curve: [17, 1345]
      recomputed_elimination_polynomial: x3^3 + 17*x3 + 1345
      recomputed_factorisation_type: [1, 1, 1]
      claimed: (1,1,1)
      agrees: true
      also_recomputed: "fp_points=6, fp_x3_values=[306,1661,2034] (dim=0, all 3 roots rational)"
    - curve: [148, 2766]
      recomputed_elimination_polynomial: x3^3 + 148*x3 - 1235
      recomputed_factorisation_type: [1, 2]
      claimed: (1,2)
      agrees: true
      also_recomputed: "fp_points=0, fp_x3_values=[] (dim=0)"
    - check: order-independence spot check
