      class_F1: {"13": 138}
      control_F1: {"10": 1, "13": 137}
      control_F1_outlier: {a: 9, b: 0, j: 1728, support: 10, independently_recomputed_in_sage: true, agrees: true}
      class_F4b: {"(1, 1, 1)": 66, "(1, 2)": 72}
      control_F4b: {"(1, 1, 1)": 21, "(1, 2)": 68, "(3,)": 49}
      agrees_with_verdict.json_and_execution_report.md: true

  - id: V2
    question: >-
      Is the D-4 defect diagnosis (root-vs-point predicate confusion in
      RUN-ICINV-geom-m3, fixed in -v2) concretely correct for (148,2766), and
      do the two runs' raw per-curve F4b values actually agree?
    answer: "YES. CONFIRMED CONCRETELY. This does NOT override the review (per the handoff's instruction, checked explicitly)."
    findings:
    - >-
      Elimination polynomial for (148,2766) independently recomputed as
      x3^3+148x3-1235 (V1), matching execution_report.md's quoted polynomial
      exactly.
    - >-
      Hand-verified factorisation: (x3-615)(x3^2+615x3-1722) mod 4001 expands
      to x3^3 + (615-615)x3^2 + (-1722-615^2 mod 4001)x3 + 615*1722 mod 4001
      = x3^3 + 148x3 + 2766, and 2766 = -1235 mod 4001 -- the claimed
      factorisation is algebraically correct.
    - >-
      Independently confirmed the FULL 3-variable variety (not just the
      elimination polynomial) has 0 F_p-rational points for (148,2766)
      (`I.variety()` empty, dim=0), matching backend_B_msolve.fp_points=0 in
      both RUN-ICINV-geom-m3/backend-crosscheck.json and
      RUN-ICINV-geom-m3-v2/backend-crosscheck.json.
    - >-
      Read RUN-ICINV-geom-m3/backend-crosscheck.json for (148,2766) directly:
      agreements.backend_B_linear_factor_count = false, while
      agreements.backend_C_elimination_type = true and all Betti/order-
      independence agreements are true. This confirms the defect was confined
      to exactly the flag the report names: a comparison of the elimination
      polynomial's degree-1-factor count (1, from factype [1,2]) against
      msolve's distinct_x3_values_in_F_p (0) -- two different quantities.
    - >-
      Counted `backend_B_linear_factor_count == false` across
      RUN-ICINV-geom-m3/backend-crosscheck.json's 30-curve subsample: exactly
      14, matching "14 of 30" exactly. RUN-ICINV-geom-m3-v2's crosscheck for
      the same 30 curves has all_backend_B_agree: true (the fixed predicate
      compares fp_points/fp_x3_values, both recorded 0/[] for this curve in
      both backend_A and backend_B_msolve).
    - >-
      Diffed the raw `elimination.factorisation_type` field between
      RUN-ICINV-geom-m3/per-curve-invariants.json and
      RUN-ICINV-geom-m3-v2/per-curve-invariants.json for ALL 138 curves
      (exceeds the >=10 requirement): zero differences, including (148,2766)
      (elimination.polynomial, .degree, .factorisation_type byte-identical in
      both runs). Also diffed s3_support, betti, regularity_of_quotient_S_mod_J,
      singular_locus_affine.{dimension,degree} and elimination.degree across
      all 138 curves between the two runs: zero differences in every family.
      This directly confirms "every PRIMARY invariant in the superseded run
      agrees with its replacement" for ALL primary families, not just F4b.
    - id: F-V2.1 (minor, does not affect the artifact under review)
      severity: commit_message_narrative_error_not_an_artifact_defect
      detail: >-
        The COMMIT MESSAGE of the snapshot commit 1721063e4 (git log prose,
        not a reviewed artifact) states: "Verified concretely for (17,1345):
        both backends in fact agree (0 rational points, one non-extending
        rational root)." This is WRONG: (17,1345) has 6 F_p-rational points
        and factorisation type (1,1,1) -- ALL THREE roots are rational, not
        one non-extending root. The description "0 rational points, one
        rational root" matches (148,2766), not (17,1345). The COMMITTED
        ARTIFACT actually under review, execution_report.md section 4, states
        this correctly for (148,2766) -- the artifact is right, only the free-
        text commit message narrative names the wrong witness curve. Recorded
        per SC-1 (fabricate/omit nothing); does not affect verdict.json, any
        run artifact, or this review's PASSED numbers-reproduce finding.

  - id: V3
    question: >-
      Is the class-vs-control F4b comparison (class 2 distinct, control 3
      distinct) computed correctly, and does the control-set construction
      match the contract's stated design? (Facts only, no interpretation, per
      SC-4.)
    answer: "Numbers confirmed correct. Construction matches the contract's stated design. NOT INTERPRETED (SC-4/V3 instruction) -- no view is offered on whether this comparison favours or refutes class-invariance."
    recomputed_from_raw_per_curve_arrays:
      class_F4b_distinct_values: 2
      class_F4b_multiset: {"(1, 1, 1)": 66, "(1, 2)": 72}
      control_F4b_distinct_values: 3
      control_F4b_multiset: {"(1, 1, 1)": 21, "(1, 2)": 68, "(3,)": 49}
      matches_verdict.json_and_execution_report.md_table: true
    control_set_construction_check:
      contract_text: >-
        "Random ordinary curves at p = 4001 drawn from traces OTHER than
        t = 30, with the drawn traces and the RNG seed recorded in the run
        record. Same prime, same Weierstrass family, same symbolic pipeline,
        same grading, same monomial order." (specification.yaml
        control_set.construction)
      recorded_in_control-set-invariants.json.draw:
        seed: 20260810
        rng: "python random.Random(20260810).sample"
        pool_size: 7794
        drawn: 138
        distinct_traces_drawn: 100
        excluded_traces: [30, 0]
        excluded_reason: "t=30 is the class under test; t=0 is supersingular (not ordinary)"
      independently_confirmed:
        control_curve_count: 138
        distinct_(a,b)_pairs_in_control: 138 (no duplicates)
        distinct_traces_among_control: 100
      matches_contract: true
      note: >-
        The contract's prose does not explicitly say to exclude t=0, but its
        own control_set.construction requires "ordinary curves", and t=0 is
        the supersingular trace at p=4001; excluding it is required by, not a
        deviation from, the stated design.

  - id: V4
    question: >-
      Does koszul_all_regular_sequence_on_class:false hold on independent
      recomputation for >=2 curves, and does gauge_all_agree:true hold under
      an independently-chosen (u^4 a, u^6 b) transform for >=2 curves?
    answer: "YES, BOTH, by methods different from the harness's own shortcut."
    koszul_recheck:
      method: >-
        NOT the harness's codimension-vs-generator-count shortcut. Direct
        ideal-quotient (colon-ideal) zero-divisor test: for the homogenised
        generators g_1..g_4 in generator order, test at each step i whether
        (I_{i-1} : g_i) != I_{i-1} (g_i a zero-divisor mod the ideal generated
        by the previous g's) -- the definitional test for a regular sequence,
        independent of the codimension/Cohen-Macaulay shortcut the harness
        uses.
      results:
      - curve: [148, 2766]
        generator_degrees: [4, 3, 3, 3]
        zerodivisor_at_step: [false, false, true, true]
        is_regular_sequence: false
      - curve: [17, 1345]
        generator_degrees: [4, 3, 3, 3]
        zerodivisor_at_step: [false, false, true, true]
        is_regular_sequence: false
      cross_checked_against: >-
        koszul-indicator.json for both curves: is_regular_sequence: false,
        codimension_projective: 3 (< 4 generators), generator_degrees
        [3,3,3,4] (same multiset, different listing order) -- consistent
        conclusion via the harness's own (different) method.
      class_all_regular_sequence_control_all_regular_sequence: "both false, per koszul-indicator.json; consistent with 2/2 spot-checked curves failing the test"
    gauge_recheck:
      method: >-
        Self-chosen u (NOT the run's recorded seeded u), fresh recomputation
        of support/elimination-degree/factorisation-type on
        (u^4 a mod p, u^6 b mod p).
      results:
      - curve: [148, 2766]
        u_chosen_by_validator: 777
        gauged_curve: [1845, 1070]
        base: [13, 3, "(1, 2)"]
        gauged: [13, 3, "(1, 2)"]
        agree: true
      - curve: [17, 1345]
        u_chosen_by_validator: 3333
        gauged_curve: [2103, 1686]
        base: [13, 3, "(1, 1, 1)"]
        gauged: [13, 3, "(1, 1, 1)"]
        agree: true
      cross_checked_against: "gauge-recheck.json: all_class_agree=true, all_control_agree=true"

  - id: V5
    question: >-
      Does an independent probe of this host confirm the D-2 backend
      characterisation (msolve present and used as backend B; no second
      off-the-shelf resolution engine; standalone Singular present but not
      independent; Koszul-homology route as backend C)?
    answer: "YES, CONFIRMED."
    independent_probe_results:
      msolve: "/opt/homebrew/bin/msolve, version 0.9.5 (confirmed by direct `msolve -h` invocation: 'msolve library for polynomial system solving, version 0.9.5'); matches backend-provenance.json exactly"
      macaulay2_M2: "absent (`which` returns nothing; matches absent_probe.M2/Macaulay2 = null)"
      magma: "absent (matches absent_probe.magma = null)"
      giac: "absent (matches absent_probe.giac = null)"
      standalone_singular: >-
        Found at /var/tmp/sage-10.9-current/local/bin/Singular, version
        "4.4.1" (Jan 2025 build) -- IDENTICAL version string to backend A's
        libsingular (4.4.1, raw 44100), and located inside the Sage 10.9
        installation tree, not a separate distribution. No other Singular
        binary found anywhere else searched (/usr/local, /opt/homebrew).
        Consistent with the report's "same engine as libsingular, not
        independent" classification; cannot be proven byte-identical from
        outside, but the evidence (same version, inside the Sage tree, no
        other install found) supports the classification rather than
        contradicting it.
      sage_version: "10.9, release 2026-05-04 -- confirmed via `sage --version`, matches backend-provenance.json"
      backend_A_self_test: >-
        Independently recomputed the minimal free resolution of (xy,yz,zx) in
        QQ[x,y,z]: S(0) <-- S(-2)^3 <-- S(-3)^2 <-- 0, i.e. ranks 1,3,2 --
