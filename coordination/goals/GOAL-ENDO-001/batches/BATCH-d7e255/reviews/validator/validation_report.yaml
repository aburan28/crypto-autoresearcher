  - id: V6
    question: >-
      Does every run manifest carry requested_policy, resolved binding,
      actual answering model, fallback_used, and a named
      model_judgement_steps list? Does any reported number trace to an
      unnamed judgement step?
    answer: >-
      Manifest fields: YES for every run that has a manifest. No reported
      number traces to an unnamed step. TWO ADDITIONAL, MATERIAL FINDINGS
      recorded below that this check surfaced and that are not literally one
      of V1-V5/V7 but are squarely within the Validator's manifest/
      reproducibility remit (agents/validator.md point 3).
    manifest_field_check:
      runs_with_manifest: [RUN-ICINV-geom-gates, RUN-ICINV-geom-m3, RUN-ICINV-geom-m3-v2, RUN-ICINV-geom-m4, RUN-ICINV-geom-m4-v3]
      all_five_carry:
        requested_policy: executor-implementation
        policy_binding_resolves_to: "anthropic:claude-sonnet-5"
        actual_answering_model: claude-opus-5
        fallback_used: true
        model_judgement_steps_present: true (899 chars, non-empty, names 4 specific steps -- backend-B choice, census-reference choice, affine-degree/regular-sequence definitional choice, second-monomial-order choice)
      RUN-ICINV-geom-m4-v2: >-
        correctly has NO manifest.yaml (only 4 of 15 artifacts written,
        confirmed by directory listing: backend-provenance.json,
        class-census.json, command.txt, support-derivation.json, all same-
        second mtime), consistent with D-6's "abandoned, no manifest ever
        produced" narrative.
      unnamed_judgement_check: >-
        Every reported number traces to command.txt's exact re-executable
        `sage -python harness/exp_icinv_geometry.py --stage ... --run-id ...`
        invocation; the model_judgement_steps text is explicit that these are
        the ONLY points where model judgement (not exact computation) entered,
        and names them individually rather than leaving any unnamed.
    finding_F-V6.1_source_provenance_gap:
      severity: material_reproducibility_finding_does_not_change_any_primary_number
      title: >-
        The exact source code that produced the PRIMARY m=3 result
        (RUN-ICINV-geom-m3-v2) was never committed to git and is not
        recoverable from this repository; only its sha256 pin survives.
      detail: >-
        harness/exp_icinv_geometry.py is recorded as "untracked" in every
        run's manifest (code.dirty: false, commit: 5ecab6c78 unchanged
        throughout -- the file sits outside git's tracked tree at every run).
        Comparing the per-file sha256 pinned in code.source.files across the
        five manifests: RUN-ICINV-geom-gates and RUN-ICINV-geom-m3 pin
        7ac1030ceb2e73bf...; RUN-ICINV-geom-m3-v2 AND RUN-ICINV-geom-m4 pin
        8fb54bc546c2983e...; RUN-ICINV-geom-m4-v3 pins 91384d9c216aff44...
        (verified: `shasum -a 256` on the manifest's own recorded hex). `git
        log --all -- harness/exp_icinv_geometry.py` shows exactly ONE commit
        ever touched this path (1721063e4, the snapshot commit itself), and
        `git show 1721063e4:harness/exp_icinv_geometry.py | shasum -a 256`
        gives 91384d9c216aff44... -- the SAME as the CURRENT working-tree
        file, and the SAME as only RUN-ICINV-geom-m4-v3's pin. The two
        earlier code versions (7ac1030c..., used for gates+m3; and
        8fb54bc5..., used for m3-v2+m4 -- INCLUDING THE PRIMARY RESULT) exist
        nowhere in git history or the working tree; only their hashes are
        recorded.
      what_this_does_and_does_not_mean: >-
        Does NOT mean the numbers are wrong: this Validator independently
        recomputed the primary numbers (V1-V4) from the frozen mathematical
        specification with fresh, self-written code, not by re-running any
        historical version of the harness -- those recomputations are
        unaffected by which harness version ran. DOES mean
        execution_report.md section 9's claim "Reproducible from the recorded
        commands and the pinned source hashes at the recorded commit" is
        false for 4 of 5 completed runs (gates, m3, m3-v2, m4): a third party
        cannot literally re-execute the code that produced them today, only
        verify that the currently-committed file's hash does NOT match the
        pin (which is itself how this gap was detected -- it is a disclosed-
        by-mismatch gap, not a silent one). Only RUN-ICINV-geom-m4-v3 (the
        SECONDARY m=4 result) is bit-exactly reproducible from the current
        repository state.
        Supporting evidence that the code change between the m3 (7ac1030c)
        and m3-v2 (8fb54bc5) versions did not alter the primary computation
        path: every primary invariant (s3_support, betti,
        regularity_of_quotient_S_mod_J, singular_locus_affine
        dimension/degree, elimination degree AND factorisation type) is
        byte-identical across all 138 curves between RUN-ICINV-geom-m3 and
        RUN-ICINV-geom-m3-v2 (checked under V2), consistent with the report's
        claim that only the cross-check predicate changed.
    finding_F-V6.2_m4_status_label_mismatch:
      severity: presentation_inconsistency_underlying_cause_still_clearly_infrastructure
      title: >-
        RUN-ICINV-geom-m4's own manifest records status:completed_invalid,
        not status:failed_infrastructure as execution_report.md's run table
        and executor_assessment.runs.failed both state.
      detail: >-
        `experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-geom-m4/manifest.yaml`
        line 9: `status: completed_invalid`. `result.invalid_reason`:
        "OSError: [Errno 28] No space left on device: '...'" -- this is the
        literal `"%s: %s" % (type(exc).__name__, exc)` format used by the
        CURRENTLY-COMMITTED harness's generic-exception branch, not its
        OSError/MemoryError special-case branch (which would read
        "infrastructure_error (OSError: ...)"). Consistent with F-V6.1: this
        run executed under an EARLIER harness version (8fb54bc5..., shared
        with m3-v2) that evidently lacked the OSError special-case later
        added before m4-v3 (whose own manifest correctly uses
        status:completed_valid for its own successful run, so this cannot be
        checked directly against m4-v3's code, but the format match to the
        generic branch is exact and the special-case branch's differently-
        worded format is absent). SR1/SR2/SR3 gates passed before the crash
        (confirmed directly in the manifest's own stopping_rules list), and
        no SR6-budget stopping-rule entry appears for this run (the disk
        exhaustion was caught by the generic `except Exception`, not the
        `Budget` exception class that SR6 checks) -- so describing it as
        "SR6 fired" in execution_report.md section 2 is also a looser,
        narrative use of "budget" than the contract's own SR6 definition
        (wall-clock/memory only).
      does_not_change: >-
        AGENTS.md rule 5 protection (never negative mathematical evidence)
        applies regardless of which status label is used -- the underlying
        cause, an OSError from external disk exhaustion, is unambiguous in
        both the manifest and the report, and this run is not cited anywhere
        as evidence for or against any invariant. No primary m=3 result is
        affected; RUN-ICINV-geom-m4 contributes no number used in verdict.json.

  - id: V7
    question: >-
      Did RUN-ICINV-geom-m4-v3 compute ONLY monomial support and singular
      locus (per arities.secondary_scope), with Betti table/regularity
      genuinely not_computed rather than silently omitted or fabricated?
    answer: "YES, CONFIRMED."
    findings:
    - >-
      m4-invariants.json and m4-class-invariants.json: the `betti` and
      `regularity` fields are the literal string "not_computed" for every one
      of 138 class + 138 control per-curve entries -- confirmed by taking the
      union of all class+control betti/regularity values and finding it is
      the single-element set {"not_computed"}; not a placeholder number, not
      a fabricated value.
    - >-
      `not_computed_reason` field present and quotes the contract's own
      language: "Contract arities.secondary_scope: at m=4 the Betti table and
      regularity are secondary and may be reported as not_computed. This is a
      BUDGET statement under AGENTS.md rule 5 and is NEVER reported as
      constancy." -- matches specification.yaml's `arities.secondary_scope`
      wording.
    - >-
      Structural confirmation from the currently-committed harness (this is
      the ONE run, per F-V6.1, whose exact executed source IS recoverable
      and verified to match): `invariants_m4()` computes only S4's
      `s4_support`/`s4_total_degree` and `singular_locus_affine`
      {dimension, degree} from the ideal's dimension/mult; it contains no
      call to `graded_free_resolution` or any Betti-table computation on the
      m=4 path at all, and hardcodes `"betti": "not_computed", "regularity":
      "not_computed"` in its return value. Genuinely not computed, not
      silently omitted (the fields are present with an explicit marker).
    - >-
      s4_support and singular_locus_affine ARE genuinely numeric and
      per-curve: class multisets {391:1, 439:137} (support) and {(2,39):138}
      (singular locus dim/degree); control {225:1, 439:137} and {(2,39):138}
      -- matching execution_report.md section 6's table exactly.

