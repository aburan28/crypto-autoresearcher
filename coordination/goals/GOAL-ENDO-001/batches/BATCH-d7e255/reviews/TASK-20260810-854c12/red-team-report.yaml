        fraction reaches X%, decided before any noise-model arithmetic") would
        close this reading entirely.
      what_would_change_my_mind: >-
        A dated note, prior to or independent of the reachability
        computation, stating why 1536 specifically (not any nearby power of
        two) was chosen as terminal.
    - id: OBJ-3
      severity: minor
      target: "amendment v1 change G3 (the original 12/24/48 ladder and 5% threshold)"
      objection: >-
        By DEC-20260810-5aeeaa's own admission, G3's two Coordinator-set
        numbers were "not set against any noise model" and turned out jointly
        infeasible (reachability ~1.2e-4 at 24->48). G3 received the lighter
        approve-on-filing review track that amendment v1's own approval note
