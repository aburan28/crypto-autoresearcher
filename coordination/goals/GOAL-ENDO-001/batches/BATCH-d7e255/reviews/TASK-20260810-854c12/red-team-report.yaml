        broader gloss on the same condition is not.
      what_would_change_my_mind: >-
        A demonstration that this run's Arm A0 values were never committed, or
        were retracted/superseded before this snapshot. Checked: no SUPERSEDED.yaml
        marker exists in that run's directory (unlike several sibling runs in
        the same batch that do carry one), and its manifest status is
        `completed_valid`.
    - id: OBJ-2
      severity: minor
      target: "amendments/v2.yaml change E6/E7 -- selection of the terminal rung (T1, 1536 seeds)"
      objection: >-
        No criterion for choosing exactly five more doublings (to 1536), as
        opposed to three (to 384) or ten, is stated independently of the
        friendly-hypothesis reachability arithmetic, which is computed in the
        same filing that declares the terminal rung. This does not prove
        reverse-engineering, but the amendment does not rule it out either, and
