  # ====================================================================
  # PART 1 -- the four conditions, attacked one at a time
  # ====================================================================
  condition_dispositions:
    condition_a_acceptance_region_not_moved:
      disposition: HOLDS_NARROWLY_INCOMPLETE_AS_STATED
      reading_attempted: >-
        Two different objects both answer to "the acceptance region" and the
        amendment's language conflates them. OBJECT 1: the numeric SR3 v3
        interval itself (mean +- z*sd, per-row coverage 259/260, family-wise
        0.05, z = Phi^{-1}(519/520)). Verified byte-for-byte unchanged in
        changes E6/E7 and in the "unchanged_and_still_frozen" block of
        amendments/v2.yaml -- TRUE, this object is not moved. OBJECT 2: the set
        of (rung, per-row-relative-change) outcomes that count as "HEUR-INSTR-2
        validated / F4 does not fire" -- i.e. the decision boundary of the
        META-question the ladder exists to answer. THIS SET STRICTLY GROWS:
        originally only rungs 2 and 3 (two chances) could produce a PASS;
        change E6 adds five more (rungs 4-8, seven chances total). Under
        Explanation A (ordinary sampling noise, HEUR-INSTR-4), the noise scale
        1/(2*sqrt(n_prev)) shrinks monotonically with n, so later chances are
        SYSTEMATICALLY more likely to pass than earlier ones (independently
        re-derived below, F-02) -- this is not symmetric coin-flipping across
        the seven chances, it is a biased-toward-eventual-pass sequence by
        construction. Whether that counts as "the acceptance region" depends
        entirely on which object a reader has in mind, and amendments/v2.yaml
        answers only for object 1.
      verdict: >-
        NOT a violation of SR4 NO WIDENING in the literal sense DEC-20260810-5aeeaa
        defines it (SR4 governs the numeric interval; that is untouched). But
        "the acceptance region is not moved" as a FULL answer to the freeze
        question is incomplete: it is true of the gate's final interval and
        silent about the meta-decision boundary (how many chances the
        ladder gets to declare stabilization), which the amendment does move,
        by design. This is named as a scope gap in the record's own language,
        not as a hidden defect in the mechanism -- T1/T2/T4 (see condition d)
        are exactly what is supposed to bound that second object, and they are
        evaluated on their own merits there.

    condition_b_no_visible_datum_to_fit_toward:
      disposition: FAILS_AS_STATED_IN_DEC-20260810-5aeeaa_HOLDS_AS_STATED_IN_V2_YAML
      the_two_wordings_are_not_the_same_claim: >-
        amendments/v2.yaml's own text (the_freeze_question_confronted_rather_than_assumed)
        says: "the data this gate will gate is a successor Arm A0 measurement
        of EXP-ICINV-4d33aa ... whose successor run does not exist." That is
        narrow and TRUE -- verified below. DEC-20260810-5aeeaa's gloss on the
        same condition (adjudication_item_1) says the stronger claim: "no
        candidate arm value has been observed by anyone. There is nothing this
        extension could be fitted to." That is a falsifiable, absolute claim,
        and the handoff instructs attacking DEC's stated conditions, not merely
        the amendment's own (narrower) wording.
      the_search_performed: >-
        Searched experiments/EXP-ICINV-4d33aa/ at the declared snapshot
        (60060084d) for any committed Arm A0 (primary-class) measurement,
        under any contract version, at the same 13 density rows and the same
        reference seed/target-count convention (seed 20260807, T=400) the SR3
        v3 characterization is measuring. `git ls-tree -r 60060084d --
        experiments/EXP-ICINV-4d33aa/` and manifest greps across all run
        directories.
      what_was_found: >-
        experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-fg-primary-v2-p4001/
        (batch_id BATCH-aa267f, an EARLIER batch than BATCH-d7e255, status
        `completed_valid`, contract_version 2, class_role `primary`) contains
        Arm A0's own committed per-row variance-ratio values at seed 20260807,
        T=400, across all 13 frozen density rows -- e.g. (fb, VR_pooled):
        (4, 1.1241), (5, 1.1556), (6, 1.3384), (7, 1.4340), (8, 1.2249),
        (9, 1.0995), (10, 1.4031), (11, 1.7603), (12, 1.7462), (13, 1.9300),
        (15, 2.4074), (18, 3.0768), (22, 3.2411), read directly from
        `decision-rule-evaluation.json`/`raw-result.json` under that run
        (verified via `git show 60060084d:<path>`, not the working tree). Its
        baseline-reproduction gate (`gate_passed: true`,
        `every_row_in_band_1_3_to_3_6: true`) also passed. This is a real,
        named, committed, readable number -- exactly what "no candidate arm
        value has been observed by anyone" denies exists.
      the_mitigating_fact_which_narrows_but_does_not_eliminate_the_finding: >-
        RUN-ICINV-fg-primary-v2-p4001's command line
        (`python3 -m harness.run_fullgroup --stage 3 --p 4001`) and manifest
        confirm it used `exp_icinv.targets_uniform`, the sampler DEC-20260810-a4bec4
        later prohibited for any NEW measurement arm (standing_control_restatement_v2
        clause (a)); a future Arm A0 measurement under EXP-ICINV-4d33aa's
        still-unwritten amendment v3 must use `targets_B` instead, per that same
        restated control. Since H-ICINV-6c7920 (whether targets_uniform's
        over-dispersion is a sampler artifact) is UNRESOLVED, the old value's
        numeric closeness to a future targets_B measurement is itself disputed
        and cannot be assumed -- so it is not a reliable, ready-made target to
        "fit toward" in the strong hull-fitting sense. But it IS a visible
        number, in the same units, at the same rows, on the same class, that a
        reader (or a future Coordinator judging whether the resulting interval
        "looks right") could be anchored by even informally; the amendment's
        text does not disclose it, and DEC-20260810-5aeeaa's absolute claim
        that no such value exists is checkably false.
      verdict: >-
        Condition (b) AS WRITTEN IN amendments/v2.yaml holds (the specific
        successor-run claim is true). Condition (b) AS GLOSSED IN
        DEC-20260810-5aeeaa ("no candidate arm value has been observed by
        anyone") is FALSE and should be corrected. See DISSENT below -- this is
        the one item in this report that rises to a documentation-correction
        DISSENT, not merely a note.

    condition_c_filed_before_the_governed_data_exists:
      disposition: ATTEMPTED_AND_HELD
      what_was_checked: >-
        amendments/v2.yaml's own "affected_runs" section states rungs 4-8 are
        not measured and RUN-INSTR-36c8cf-phaseA-v2-57ca9a's rungs 1-3 are "not
        re-cut, not re-run and not re-scored." Checked
        sr3v3-interval-stability.json directly: it records exactly three rungs
        (12, 24, 48 seeds) with `accepted_rung: null`; no rung-4+ entry exists
        anywhere in the committed run artifacts. Checked the manifest's `code`
        block for any untracked successor-run source under
        harness/exp_instr_36c8cf/ beyond phase_a_v2.py, sr3v3.py,
        sr1_g1.py, refvalues_v2.py -- none found. No leaked partial
        measurement at rung >=4 exists in the snapshot.
      caveat_named_rather_than_treated_as_a_failure: >-
        The literal claim (no rung>=4 DATA exists) holds. A narrower,
        related concern -- whether the SHAPE of the extension (how many more
        doublings, and specifically why 1536 as the terminal rung) was chosen
        blind to the friendly-hypothesis reachability arithmetic -- does NOT
        hold and is addressed under change E6/E7 and finding F-01/F-03 below.
        That is a different claim from condition (c) and is not conflated with
        it here.
      verdict: HOLDS. Attempted to break it; could not.

    condition_d_deterministic_ladder_with_pre_declared_bidirectional_terminal_outcome:
      disposition: HOLDS_PROCEDURALLY_WEAKER_ON_PERMANENCE
      what_was_checked: >-
        T1 (terminal rung = 8/1536 seeds, no further contract extension), T2
        (first passing rung is accepted, continuing past it is outcome shopping
        under SR7 and INVALIDATES the run), T3 (terminal outcome declared now
        in both directions: pass -> accept that rung's interval; fail at
        768->1536 -> F4 fires TERMINALLY, gate redesign goes to the USER, not
        back to the Coordinator), T4 (a budget stop is distinct from a terminal
        outcome and is never a pass or a terminal F4).
      what_survives_attack: >-
        T2's enforcement mechanism (INVALID run on rung-shopping) is real and
        mechanical, not merely a promise -- it changes the run's own terminal
        state, which is exactly the kind of hard consequence the campaign's
        other invalidation rules use elsewhere in this contract. T4 correctly
        separates infrastructure failure from either outcome, consistent with
        AGENTS.md rule 5. T3's reassignment of the terminal-failure remedy to
        THE USER (not the Coordinator) is a genuine structural difference from
        "the Coordinator can just try again": it moves the next decision to a
        different, non-recursive actor, which is the correct response to
        exactly the two-step precedent DEC-20260810-5aeeaa itself invokes
        (Coordinator-repairing-its-own-parameter is the risk the two-step
        exists to catch).
      what_does_not_survive_attack: >-
        T1's "no further amendment to this contract may lengthen it" is a
        POLICY COMMITMENT by the same role (Coordinator) that could write a
        superseding record, not a structural or code-enforced guarantee.
        Nothing in tools/validate_ledger.py or the harness refuses a
        hypothetical future amendment ordinal 3 that reopens the ladder; the
        campaign's own convention (corrections/amendments supersede by
        reference, never edit) means a written "never again" is exactly the
        kind of statement a later record can supersede. T3's redirection to the
        user mitigates but does not eliminate this: nothing prevents the user,
        informed only by "one more doubling would likely pass" (the same
        reachability arithmetic used here), from directing exactly the same
        extension pattern one level up, and that possibility is not foreclosed
        by anything in amendments/v2.yaml. This is forward guidance, not a
        defect in the current filing -- T3 does name a different remedy
        (a fixed-precision criterion "a function of the seed count alone",
        immune to this failure mode) as the correct next step on terminal
        failure, and that is the right answer; it is simply not yet adopted.
      verdict: >-
        HOLDS as a procedural matter WITHIN this dispatched contract (a real
        terminating, bidirectionally-pre-declared, mechanically-enforced-by-invalidation
        stopping point exists). Its cross-session PERMANENCE is a policy
        commitment, which is weaker than the amendment's confident phrasing
        ("no further amendment...may lengthen it") implies, though this is
        named as an observation for the next Coordinator to guard against
        rather than a defect in what v2 itself does.

  # ====================================================================
  # PART 2 -- E6 and E7 by name
  # ====================================================================
  change_E6_attack:
    what_it_actually_changes: >-
      Extends the seed-rung list from {12,24,48} to {12,24,48,96,192,384,768,1536}
      by plain, mechanical doubling (each new rung ADDS to the previous rung's
      seed set, keeping the ladder nested, matching E2's own convention).
      Leaves coverage, estimator, quantiles, the 13 density rows, T=400, the
      family scope limit, and the 5% threshold textually untouched.
    does_it_alter_the_statistical_decision_procedure_that_was_not_already_true: >-
      YES, in one specific, quantifiable way not present in the original
      12/24/48 ladder: it multiplies the number of independent CHANCES the
      ladder gets to satisfy the 5%-at-every-row rule from 2 (rungs 2, 3) to 7
      (rungs 2-8), and -- independently re-derived and confirmed correct below
      -- under HEUR-INSTR-4 the per-chance pass probability rises
      monotonically with n (1.2e-4 at 24->48 up to ~0.93 at 768->1536, per
      DEC-20260810-5aeeaa's own table). This is the quantitative content behind
      condition (a)'s incompleteness above: the ladder's own designer
      (DEC-20260810-5aeeaa) explicitly concedes "a rule that always eventually
      passes if you are allowed to keep sampling has no falsifying power at
      all" and names T1/T2 as the fix. The fix is real (see condition d) but
      it does not erase the fact that E6 changes something E2 did not have:
      seven chances at a monotonically-improving pass probability instead of
      two.
    independent_arithmetic_check_performed: >-
      Re-derived the noise-scale formula 1/(2*sqrt(n_prev)) independently from
      the stated model (s_n^2 = S_A/n, s_2n^2=(S_A+S_B)/(2n), Var(ln chi2_n) ~
      2/n for large n, derivative of 0.5*ln((1+u)/2) at u=1 is 0.25) and it
      reproduces DEC-20260810-5aeeaa's seven stated values exactly: 0.1443
      (12->24), 0.1021 (24->48), 0.0722 (48->96), 0.0510 (96->192), 0.0361
      (192->384), 0.0255 (384->768), 0.0180 (768->1536). ONE REFINEMENT NOTED:
      Var(ln chi2_n) is exactly trigamma(n/2), which EXCEEDS the large-n
      approximation 2/n at small n (trigamma(6) ~ 0.1813 vs 2/12 = 0.1667 at
      n=12, a ~9% understatement of true noise at the EARLIEST rungs,
      converging to negligible by n_prev >= 96). This refinement, if applied,
      makes the EARLY-rung reachability figures (24->48, 48->96) even SMALLER
      -- i.e. the observed rung-1/2/3 failures look even more like ordinary
      noise under HEUR-INSTR-4, not less -- and leaves the TERMINAL rung's
      figure (0.93 at n_prev=768) essentially unchanged, since trigamma(384) ~
      2/384 to high precision. This check does not change any conclusion in
      this report; it is recorded because it was performed, per the task's own
      instruction to attempt to break every load-bearing number rather than
      accept it.
    c4_n_bias_direction_disclosed_by_E6: see finding F-03 below.
    verdict: >-
      E6's mechanism (extend the ladder) is honestly described. Its
      completeness claim ("changes no acceptance region") is TRUE of the
      numeric SR3 v3 interval and INCOMPLETE as a full answer to the freeze
      question, for the reason given under condition (a).

  change_E7_attack:
    what_it_actually_changes: >-
      Adds T1 (terminal rung), T2 (first-pass-wins, rung-shopping invalidates),
      T3 (bidirectional pre-declared terminal outcome with named forward
      guidance on failure), T4 (budget stop is neither outcome). Its own stated
      purpose is explicit: "WITHOUT IT ... THE OBJECTION ... WOULD BE CORRECT.
      THIS CHANGE IS THE CONDITION ON WHICH THE EXTENSION IS DEFENSIBLE AT
      ALL." E7 is therefore not incidental machinery; it is load-bearing for
      the entire freeze-question defense, and DEC-20260810-5aeeaa says so in
      the same words.
    does_T2_plus_a_terminal_rung_actually_prevent_hull_fitting_or_only_narrow_it: >-
      T2 prevents the CLASSIC form of hull-fitting on THIS quantity: shopping
      among multiple PASSING rungs for the narrowest or widest interval is
      mechanically forbidden (invalidates the run). It does NOT, and cannot by
      construction, prevent the softer form named under condition (a): more
      chances at a monotonically-rising pass probability. T1's terminal rung
      bounds that softer form to a FINITE number of chances (seven) rather than
      infinite, which is real protection (verified below it leaves genuine
      residual failure probability, not near-zero), but it narrows the
      objection rather than eliminating the underlying mechanism (a ladder
      whose stopping criterion becomes easier to satisfy simply by adding more
      data, regardless of whether the added precision serves the gate's
      purpose -- see F-01, F-02).
    was_the_choice_of_ladder_lengths_itself_data_informed_a_distinction_without_a_difference_test: >-
      PARTIAL DISTINCTION, NOT A FULL ONE. "We saw rungs 1-3 fail before
      choosing how to extend, but the extension RULE (mechanical doubling, same
      convention as E2) does not target any specific candidate VALUE" holds up
      with respect to fitting a NUMERIC interval to an observed arm value --
      verified no such value from THIS characterization exists at rungs 4-8
      (condition c). It does NOT fully hold up with respect to the SELECTION OF
      THE TERMINAL RUNG ITSELF: amendments/v2.yaml's own
      "reachability_and_cost_derived_not_measured" section states the
      friendly-hypothesis pass probability at the chosen terminal transition
      (768->1536: ~0.93) in the SAME document that declares 1536 as terminal
      (T1), and NO independent selection criterion for "why exactly 1536, not
      384 or 3072" is given anywhere in the amendment other than "five more
      doublings" and "stays within budget (~11%)." Five more doublings from 48
      is itself an arbitrary count -- three more doublings (to 384) would leave
      a much larger, arguably more genuinely falsifying residual failure
      probability (1-0.51=49% under the stated model at the 384->768
      transition being skipped, versus 1-0.93=7% at the terminal chosen). The
      amendment does not explain why seven-chances-to-93%-reachable was
      preferred over, say, five-chances-to-51%-reachable, and the reachability
      figures were visibly computed before or alongside the terminal-rung
      declaration. This is not proof that 1536 was reverse-engineered from the
      probability target, but the amendment does not rule it out either, and
      the burden the task assigns is to name a reading under which the
      distinction fails to hold up cleanly -- this is that reading.
    verdict: >-
      E7 genuinely defeats the STRONGEST, classical form of optional stopping
      (infinite sample-until-pass with outcome cherry-picking). It does NOT
      fully insulate the CHOICE of terminal rung from the same data-awareness
      concern the two-step process exists to catch; that choice was made with
      the friendly-hypothesis reachability arithmetic already computed and
      visible in the same filing, and no rung-length-selection criterion
      independent of that arithmetic is stated.

  # ====================================================================
  # PART 3 -- the four remaining named attack surfaces
  # ====================================================================
  attack_surface_terminal_rung_sufficiency:
    finding_id: F-01
    question: >-
      Is 1536 seeds actually enough to make the 5% rule reachable, or does the
      "unreachable by construction" problem simply recur at a higher rung?
    finding: >-
      It recurs, but at a SHRINKING and, by the terminal rung, small-but-nonzero
      rate -- which is the intended and correct behaviour IF HEUR-INSTR-4
      holds, not a defect on its own. Under the stated Gaussian/independent-rows
      model, reachability at the terminal transition (768->1536) is ~0.93, a
      FLOOR per DEC-20260810-5aeeaa's own caveat (row correlation and any
      non-Gaussian tail make the true figure lower, possibly much lower). So
      1536 is NOT sufficient to GUARANTEE a pass -- there remains at least a
      genuine ~7% (floor) residual chance of a terminal F4 even if
      HEUR-INSTR-4 is exactly true, which is real falsifying content, not a
      rubber stamp. But "reachable at rung 8" (rung-to-rung relative change
      <5%) and "narrow enough in absolute terms to be a USEFUL admissibility
      gate" are two different sufficiency questions; amendment v2 only
      addresses the first. At rung 3 the observed absolute half-widths already
      range 0.53-1.35 across rows on a statistic whose old literal band
      spanned [1.3, 3.6] (width 2.3) -- whether an interval built from data
      that "stabilizes" under the 5% rule is tight enough to be a meaningful
      gate, independent of whether it stabilizes at all, is not evaluated
      anywhere in v2 and is out of this report's scope (it is a question about
      the gate's power, not about the freeze discipline), but it is named here
      as an open question the eventual accepted interval should carry.
    severity: minor_informational
    successor_action: >-
      When (if) a rung is accepted under T2, the accepting record should also
      report the accepted interval's absolute half-width beside its
      "5%-stabilized" verdict, so a reader can independently judge whether
      "stabilized" also means "useful," rather than reading stabilization
      alone as sufficiency.

  attack_surface_no_visible_datum_leakage:
    finding_id: F-02
    question: >-
      Does the amendment's author, or the decision, have access to any data
      from rungs beyond 48 that would make the extension look more favorable
      than a blind pre-registration would justify? Look for leakage.
    finding: >-
      NO leakage of rung>=4 DATA was found (condition c holds, see above). But
      a different, real form of "seeing the data before responding" exists and
      is disclosed by the record itself, not hidden: the SHAPE of the response
      (extend by doubling, to a terminal rung with ~93% friendly-hypothesis
      reachability) is a function OF the observed rung-1/2/3 half-widths,
      computed via the noise-scaling model calibrated on that same data
      (DEC-20260810-5aeeaa's "corrected nested sequence" is derived FROM the
      general model, but its application to justify THIS SPECIFIC extension
      length is informed by having watched rungs 1-3 fail at 2.72 and 2.31
      standard deviations). This is the same phenomenon named under E7's
      "distinction without a difference" test above, restated for this
      surface: no numeric candidate value leaked, but the DESIGN of the
      remedy is not blind to the failure's magnitude.
    severity: minor
    successor_action: >-
      None required beyond what F-01/E7 already recommend (name an
      independent, non-reachability-derived criterion for rung-count
      selection in future ladder amendments of this kind).

  attack_surface_c4_bias_disclosure:
    finding_id: F-03
    question: >-
      Does disclosing a permissive-direction c4(n) bias without correcting it
      undermine SR4 NO WIDENING in substance, or is a data-independent,
      estimator-inherent sub-1% bias a different category from widening?
    independent_check_of_the_numbers: >-
      c4(n) is the standard small-sample bias-correction constant for a sample
      standard deviation (c4(n) = sqrt(2/(n-1)) * Gamma(n/2)/Gamma((n-1)/2));
      the large-n approximation c4(n) ~= 1 - 1/(4n) gives c4(48) ~= 0.99479 and
      c4(1536) ~= 0.99984, matching the amendment's stated 0.99473 and 0.99984
      closely (small residual from truncating the asymptotic series). The
      claimed ~0.5% expected widening from rung 3 to rung 8 --
      (0.99984-0.99473)/0.99473 ~= 0.51% -- is arithmetically correct.
      Independently checked and held.
    finding: >-
      A DIFFERENT CATEGORY FROM SR4-STYLE WIDENING, BUT NOT A NEUTRAL ONE.
      SR4 targets a DISCRETIONARY Coordinator act taken IN RESPONSE TO a
      specific observed failure. The c4 effect is a DETERMINISTIC,
      data-independent property of the frozen estimator E1 (raw, uncorrected
      sample sd) interacting with more data; no one "chose" it and it would
      occur identically regardless of what the data showed. On that basis it
      is correctly NOT classified as SR4 widening. But its DIRECTION is not
      neutral: it is a small, systematic, KNOWN-IN-ADVANCE drift that happens
      to move the interval in exactly the permissive direction a hull-fit
      would want, and disclosure alone does not neutralize that drift's
      practical effect on the gate's stringency -- it only makes the drift
      auditable. The magnitude (~0.5%, against per-row half-widths of order
      0.5-1.4) is small enough that it is very unlikely to be decisive on its
      own, and refusing to correct it now (since a correction would itself be
      "changing the estimator after seeing a result", which E1's own logic
      forbids) is the right call GIVEN that E1 was already frozen uncorrected
      in amendment v1. The origin of this defect is therefore in v1's original
      estimator choice (an uncorrected sample sd, rather than sd/c4(n)), not a
      new defect introduced by v2; v2 is simply the first place it becomes
      visible and quantified, and it discloses rather than hides it, which is
      the correct response given the estimator cannot be changed now without
      violating the very rule this discipline exists to enforce.
    severity: minor_disclosed_and_bounded
    successor_action: >-
      No action on THIS amendment (correcting the estimator now would itself
      be a post-hoc change forbidden by the same logic that prevents relaxing
      the 5% threshold). Record for any FUTURE gate of this shape: choose a
      bias-corrected (sd/c4(n)) estimator at the point the estimator is first
      frozen, before any ladder is run, so the direction-of-drift question
      never arises.

  attack_surface_reachability_argument_generality:
    finding_id: F-04
    question: >-
      Does DEC-20260810-5aeeaa's "the rule was effectively unreachable at 48
      seeds by construction" argument create a general precedent that any
      stopping-rule failure can be retroactively excused by showing it was
      improbable to pass? Does T3 close that loophole or only narrow it? Does
      the argument, if accepted, also indict the ORIGINAL 12/24/48 ladder as
      unsound from the start?
    does_it_indict_the_original_ladder: >-
      YES, AND DEC-20260810-5aeeaa SAYS SO ITSELF: "neither [the ladder nor the
      threshold] was set against any noise model, exactly as neither was set
      against a cost measurement." Both the ladder (12/24/48) and the
      threshold (5%) were COORDINATOR-set in amendment v1 change G3, not
      user-set, and amendment v1 was APPROVED ON FILING -- WITHOUT the two-step
      independent-validation process now applied to v2 -- specifically because
      v1's approval note frames its repaired defects (G1, G2) as USER decisions
      "not an attribution review could overturn." G3 (the actual component that
      turned out to be broken) is explicitly `decided_by: coordinator`, not the
      user, and its own text concedes it was "made now, with the same
      no-data-in-view property as G2" -- i.e. blind, which prevented fitting to
      OBSERVED data but did not and could not prevent the two numbers being
      jointly infeasible BY CONSTRUCTION, which is exactly what happened. This
      is a genuine process gap in how v1 was approved, not merely a property of
      v2: a Coordinator-set numeric pair, bundled into an amendment alongside
      user-set items, received the LIGHTER (approve-on-filing) review track
      that amendment v1's own approval note reserves for user decisions.
    does_T3_close_the_loophole_or_narrow_it: >-
      NARROWS IT TO THIS ONE LADDER. T1 explicitly scopes its permanence to
      "this contract" and "this Coordinator or any successor [under this
      contract]"; nothing in AGENTS.md, docs/claims-and-verification.md, or
      tools/validate_ledger.py establishes a STANDING, campaign-wide rule that
      any future "reachability-argument" repair of a failed stopping rule MUST
      carry a pre-declared terminal rung, a bidirectional terminal outcome, and
      two independent adversarial validations before approval. That discipline
      was applied here by this Coordinator's own judgment, citing the earlier
      EXP-ICINV-4d33aa precedent as a norm rather than an enforced rule. A
      future Coordinator facing an inconvenient stopping-rule failure is not
      mechanically required to reproduce this discipline; only institutional
      memory and cost (this route visibly delayed EXP-JINV-bd141d and
      EXP-VOLC-9f5571 through the C4 block, which the record states plainly)
      discourage a cheaper, less careful repeat.
    is_it_a_dangerous_general_move: >-
      Potentially, if the underlying arithmetic ever becomes a rhetorical
      device rather than a falsifiable model. Two properties keep THIS
      instance from being that: (1) it is a quantitative, independently
      re-derivable prediction (verified above) that makes a falsifiable claim
      about rungs NOT YET measured (HEUR-INSTR-4's own falsification condition,
      E9 D1: "if the observed changes ... do not shrink at the predicted rate
      ... HEUR-INSTR-4 is refuted ... without waiting for rung 8"), not merely
      a post-hoc excuse for the observed failure; (2) it does not retroactively
      convert the OBSERVED rung-1/2/3 failures into a pass -- F4 firing at
      rung 3 stands exactly as recorded. What generalizes as a genuine risk is
      the PATTERN (fail -> compute a reachability story -> extend), which is
      legitimate exactly when paired with this level of falsifiability and
      cost, and illegitimate the moment either is dropped.
    severity: process_finding_moderate
    successor_action: >-
      Recommend (not mandate -- outside this report's authority) that the
      Coordinator codify this pattern as a STANDING requirement in
      docs/claims-and-verification.md or AGENTS.md: any amendment that repairs
      a Coordinator-set (not user-set) stopping-rule failure via a
      reachability-style argument must (i) state a falsification condition for
      its own repair mechanism testable before its terminal rung, (ii) declare
      a terminal rung/attempt count and a bidirectional terminal outcome in
      advance, and (iii) receive independent adversarial review before
      approval -- rather than relying on each Coordinator session to
      reinvent the EXP-ICINV-4d33aa precedent from memory.

