    - >-
      Per KN-LIT-7593's charged-invariant principle (cited in this campaign's
      own standing rules): the REVIEW cost of this two-step validation route
      (two independent review-adversarial sessions, non-null budgets, blocking
      C2/C3 through criterion C4) is real and is recorded honestly by
