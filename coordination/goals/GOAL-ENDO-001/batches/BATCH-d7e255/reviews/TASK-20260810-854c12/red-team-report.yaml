  heuristic_challenges:
    - >-
      HEUR-INSTR-4 (numbered, in amendments/v2.yaml) is the load-bearing
      heuristic for the entire terminal-rung sufficiency argument (F-01). Its
      falsification condition (E9 D1: observed relative changes at rungs 4+
      must shrink at the predicted 1/(2*sqrt(n_prev)) rate) is explicit,
      numbered, and testable before the terminal rung -- this is genuinely
      well-formed as a heuristic record, unlike the earlier, non-numbered
      "Delta_max(N) orders the null means" assumption this reviewer's peers
      found undocumented elsewhere in this campaign (RT-20260807-743198,
      OBJ-2). Whether HEUR-INSTR-4 is actually TRUE (vs the heavy-tail
      Explanation B) is explicitly out of this report's scope and is
      TASK-20260810-c9655a's (V1's) question, not re-litigated here.
    - >-
      The "random-model transfer" question from the exemplar profile does not
      directly apply here (this is not a structured-object-vs-random-integer
      claim), but a close analogue does: the noise-scale model
      1/(2*sqrt(n_prev)) assumes the per-seed variance-ratio distribution
      behaves enough like a chi-square-based sd estimator for the large-n
      approximation Var(ln chi2_n) ~ 2/n to apply. Independently checked above
      (F-01/E6 arithmetic check): the exact quantity is trigamma(n/2), which
      exceeds 2/n at small n_prev and converges to it above ~n_prev=100. This
      is a genuine, checkable gap in the model's precision at the EARLIEST
      rungs (already passed) and is immaterial at the terminal rung.

  cost_model_challenges:
