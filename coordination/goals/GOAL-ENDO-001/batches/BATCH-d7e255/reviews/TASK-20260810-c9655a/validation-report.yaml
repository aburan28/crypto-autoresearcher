  # =====================================================================
  # 4. NEW ANALYSIS: LEAVE-ONE-OUT RE-CHARACTERISATION OF THE TWO
  #    EXCEEDANCES, AND A NULL-OBJECT CALIBRATION OF THE RESULT
  # =====================================================================
  single_row_outlier_analysis:
    motivation: >-
      docs/inventor-protocol.md section 3 (bound on this role by
      agents/validator.md) requires any reported signal to be checked
      against a null object of the same shape before it is read as
      evidence, and requires stating what the quantity should do as the
      destroying parameter increases. The D2 diagnostic amendment v2
      change E9 proposes (and this report's own exceedance check above,
      matching DEC's) is an IN-SAMPLE check: the interval a point is
      tested against is fitted FROM THE SAME SAMPLE THAT INCLUDES THAT
      POINT. This self-references, and for a single dominant outlier it
      SELF-MASKS: an outlier inflates its own row's sd estimate, which
      widens the interval, which makes the same outlier look less extreme
      than it would against an externally-fit reference. This report tests
      for that effect directly with a leave-one-out (LOO) recomputation
      and calibrates the result against a synthetic Gaussian null of
      identical shape (n=48, i.i.d.).
    fb_22_leave_one_out:
      rung_2:
        outlier_seed: 20260830
        outlier_value: 4.823088291321419
        in_sample_z: (4.8231-3.1582)/0.4968 = 3.351
        loo_mean_excluding_outlier: 3.0858
        loo_sd_excluding_outlier: 0.3557
        loo_z: 4.884
        loo_upper_endpoint: 4.1139
        exceeds_loo_endpoint_by: 0.7091
      rung_3:
        outlier_seed: 20260830
        outlier_value: 4.823088291321419
        in_sample_z: (4.8231-3.1610)/0.4675 = 3.556
        loo_mean_excluding_outlier: 3.1257
        loo_sd_excluding_outlier: 0.4024
        loo_z: 4.218
        loo_upper_endpoint: 4.2889
        exceeds_loo_endpoint_by: 0.5342
      interpretation: >-
        The in-sample check (what DEC-20260810-5aeeaa and amendment v2's D2
        diagnostic both rely on) reports this point as 3.56 sigma at rung 3.
        Excluding it from its own row's mean/sd estimate before scoring it
        (LOO) shows it is really 4.22 sigma against the OTHER 47 points --
        materially more extreme, exactly the direction and magnitude the
        self-masking mechanism predicts (the outlier alone inflates
        sd_sample_n_minus_1 from 0.4024 to 0.4675, about 16%). This is a
        concrete, worked demonstration that the in-sample D2 diagnostic
        the amendment proposes for future rungs systematically
        UNDER-STATES the tail excess of exactly the kind of single-point
        anomaly it is meant to catch.
    fb_22_is_row_localized_not_seed_globally_hot: >-
      Seed 20260830's z-score against every OTHER row's rung-3 mean/sd was
      computed: fb=4 z=-0.294, fb=5 z=-0.694, fb=6 z=-0.983, fb=7 z=-0.569,
      fb=8 z=-0.030, fb=9 z=-0.359, fb=10 z=+0.532, fb=11 z=+1.047,
      fb=12 z=+0.681, fb=13 z=-0.082, fb=15 z=-0.606, fb=18 z=+0.220,
      fb=22 z=+3.555 (rank 48/48, the row's own maximum). This seed is
      UNREMARKABLE (|z|<1.1) at all twelve other rows and extreme only at
      fb=22, the highest-density row (mean_density_3V_over_order = 0.9725,
      the row closest to full factor-base saturation of the thirteen). This
      rules out "a globally hot seed whose whole target draw is atypical"
      as the explanation and is consistent with either (a) a genuine rare
      single draw from a row-specific heavier right tail near saturation,
      or (b) an ordinary one-in-many-draws fluke local to one (seed, row)
      cell.
    fb_11_contrast_is_a_different_mechanism: >-
      Seed 20260852 (the fb=11 outlier) was checked the same way and shows
      a DIFFERENT pattern: fb=4 z=-0.290, fb=5 z=-1.428, fb=6 z=-0.788,
      fb=7 z=+0.392, fb=8 z=+0.351, fb=9 z=+2.313 (rank 48/48), fb=10
      z=+1.229, fb=11 z=+3.231 (rank 48/48), fb=12 z=+2.273 (rank 48/48),
      fb=13 z=+1.116, fb=15 z=+0.562, fb=18 z=+2.315 (rank 47/48), fb=22
      z=+1.650. This seed is elevated (z > +1) at SEVEN of the thirteen
      rows simultaneously, is the row maximum at three rows (fb=9, fb=11,
      fb=12), and is near-maximal at three more. This is exactly what
      DEC-20260810-5aeeaa's own already-disclosed structural property
      predicts ("the thirteen rows share curves and share seed-independent
      sum sets, so they are positively correlated") -- one seed's
      particular target/curve draw pushes many rows up together. It is
      therefore NOT distinguishing evidence for a heavy right tail specific
      to fb=11's own marginal distribution; it looks like an ordinary
      instance of the cross-row correlation the contract already discloses.
    null_object_calibration_monte_carlo: >-
      To calibrate whether the fb=22 rung-3 LOO deviation (4.218 sigma) is
      surprising under a TRUE i.i.d. Gaussian population of the same shape
      (n=48), this report ran its own Monte Carlo (Python stdlib `random`,
      seed 20260810917, disclosed and reproducible, 20000 trials, ZERO
      dependency on any run artifact -- a synthetic null of the same shape
      per docs/inventor-protocol.md section 3): for each trial, draw 48
      i.i.d. N(0,1) values, compute the LOO z-score of the sample maximum
      (mean/sd of the OTHER 47), record it. Result: median LOO-max-z 2.345,
      90th percentile 3.063, 99th percentile 3.877, max over 20000 trials
      5.757. P(LOO-max-z >= 4.22) = 71/20000 = 0.00355 (about 1 in 280) for
      a SINGLE row tested this way. The parallel skewness check gives a
      similar order: P(|g1| >= 1.045 at n=48) = 0.0039; P(|g1| >= 1.769 at
      n=24, the rung-2 figure) = 0.0006 (about 1 in 1670), i.e. the rung-2
      skew value is even less likely under pure Gaussian noise than the
      rung-3 value -- consistent with the same single outlier dominating a
      smaller sample more.
    multiple_comparisons_context: >-
      13 rows were examined this way at rung 3 (and, since the ladder is
      nested and this is the SAME outlier seed carried from rung 2 into
      rung 3, this is one anomalous observation, not two independent
      ones). A naive Bonferroni correction over the 13 rows against the
      single-row per-test rate 0.00355 gives an approximate family-wise
      rate of 13 * 0.00355 = 0.046, about 1 in 22 -- a BORDERLINE result,
      not a decisive one. This is the honest, properly-calibrated
      significance of the fb=22 signal: notably more extreme than the
      in-sample check suggests, and not explainable as an ordinary
      cross-row-correlation artifact (unlike fb=11's exceedance), but also
      not so improbable under pure chance, at one row out of thirteen and
      one seed out of forty-eight, that it forces Explanation B over A.
    what_should_happen_as_the_destroying_parameter_increases: >-
      Per docs/inventor-protocol.md section 3, the report states explicitly
      what this quantity should do as the parameter meant to destroy a
      pure-noise artifact increases. Under Explanation A, as the ladder
      extends toward 1536 seeds, fb=22's SAMPLE sd should stop being
      dominated by any one point (a single outlier's contribution to the
      total sum of squares shrinks as roughly 1/n), and NEW points at
      comparable or larger relative extremity should NOT keep appearing at
      fb=22 specifically more often than at the other twelve rows. Under
      Explanation B (localized to high-density rows), new comparably- or
      more-extreme points SHOULD keep appearing at fb=22 (and possibly
      fb=18, the second-highest-density row) at a rate exceeding what the
      Monte Carlo null above predicts, even as n grows. This is precisely
      the falsification route amendment v2's own HEUR-INSTR-4 text and E9
      D1 diagnostic gesture toward (the ratio of observed relative change
      to 1/(2*sqrt(n_prev)) "staying materially above 1 as n grows") --
      but change E9's own D2 diagnostic is the in-sample check this report
      has just shown under-detects exactly this. A LOO or externally-fit
      diagnostic, applied at minimum to fb=18 and fb=22, is needed for that
      future check to be trustworthy; the currently-specified D2 diagnostic
      is not sufficient on its own to settle this by rung 8, because it can
      systematically fail to flag exactly the localized single-point
      excess this analysis found.

  # =====================================================================
  # 5. VERDICT
  # =====================================================================
  verdict_on_explanation_A_vs_B: INCONCLUSIVE
  verdict_basis: >-
    Twelve of the thirteen density rows show no evidence distinguishing
    Explanation A from Explanation B: their skewness (|g1| up to 0.80),
    kurtosis (-1.37 to +1.08), and instability magnitudes (worst observed
    z-scores 2.72 and 2.31 sigma as maxima over 13 correlated rows) are
    fully consistent with ordinary small-n sampling noise on a Gaussian
    population, matching DEC-20260810-5aeeaa's own probability estimates
    (~0.08, ~0.24) almost exactly. The fb=11 exceedance is explained by an
    already-disclosed, ordinary mechanism (cross-row correlation from one
    seed's shared target/curve draw, confirmed here by that seed's
    elevated z-score at seven of thirteen rows) and does not favour B.

    The fb=22 exceedance is different and is the entire reason this report
    does not return a clean A. It is driven by a single seed
    (of 48) that is unremarkable at all twelve other rows (ruling out a
    globally-hot-seed / cross-row-correlation account for THIS point) and
    that, under a leave-one-out recomputation, is a 4.22-4.88 sigma
    outlier against the row's OTHER draws -- materially more extreme than
    the in-sample check the contract relies on suggests (3.56 sigma),
    because the in-sample check lets the outlier inflate its own
    denominator. Calibrated against a genuine i.i.d.-Gaussian null object
    of the same shape (n=48, 20000-trial Monte Carlo, seed 20260810917,
    disclosed), a LOO deviation this large occurs about 1 time in 280 for
    a single row, or about 1 time in 22 after a 13-row multiple-comparisons
    correction. That is suggestive of a genuine row-specific tail excess
    at exactly the row nearest factor-base saturation (mean density
    0.9725, the highest of the thirteen), but it is ONE occurrence, at ONE
    row, from ONE seed, at ONE prime, unreplicated -- not strong enough on
    its own to establish Explanation B, and not weak enough to dismiss as
    ordinary noise either.

    A second, independent finding compounds the uncertainty rather than
    resolving it: the D2 in-sample exceedance diagnostic that amendment v2
    proposes to rely on at rungs 4-8 has a demonstrated blind spot for
    exactly this kind of localized single-point excess (the self-masking
    effect shown above), so extending the ladder under the CURRENTLY
    SPECIFIED diagnostic cannot be trusted, on its own, to correctly
    discriminate A from B at fb=22 (or other high-density rows) even after
    many more rungs.
  what_would_resolve_it: >-
    (1) A leave-one-out or externally-referenced tail diagnostic (not the
    current in-sample mean +/- z*sd D2 check) applied at minimum to fb=18
    and fb=22 at every future rung, so a future "interval stabilised" or
    "no comparable outlier reappeared" reading is not itself subject to
    the self-masking bias documented here. (2) Replication at a second
    prime (p=6007, already blocked pending F4 resolution) and/or a second
    independent seed family at p=4001, to see whether a comparably extreme
    single point recurs specifically at the highest-density row(s). (3)
    Tracking, at every future rung, whether NEW points at fb=18/fb=22
    exceed the Monte-Carlo-calibrated LOO threshold at a rate above what
    the disclosed null predicts (about 1-in-280 per row per rung under
    pure Gaussian noise) -- a rate that stays elevated across several
    further rungs would favour B; a rate that falls back to the null rate
    would favour A. None of this is authorized or performed by this task.

  dissent_statement: >-
    THIS IS NOT A DISSENT IN THE LITERAL SENSE DEC-20260810-5aeeaa's
    what_would_clear_it AND amendments/v2.yaml's
    validation_required_before_approval DEFINE: this report does not
    return Explanation B, so the explicit trigger ("IF IT RETURNS THE
    HEAVY-TAIL EXPLANATION, THIS AMENDMENT MUST BE WITHDRAWN") is not met
    by the letter of this verdict.

    THIS IS A QUALIFIED, PARTIAL NON-CONCURRENCE, STATED PRECISELY SO A
    COORDINATOR CAN ACT ON IT WITHOUT RE-DERIVING IT: this report does
    NOT concur that the evidence in RUN-INSTR-36c8cf-phaseA-v2-57ca9a
    establishes HEUR-INSTR-4 (ordinary sampling noise) over the competing
    explanation. The nested-ladder noise-scale ARITHMETIC that motivates
    extending the ladder is independently confirmed correct (section 1
    above) -- that part of amendment v2's reasoning is sound. But (a) a
    genuine, properly null-calibrated, row-localized signal exists at
    fb=22 that is not explained away by ordinary cross-row correlation
    (unlike fb=11's exceedance) and is not resolved by 48 seeds at one
    prime; and (b) the specific diagnostic (D2, in-sample mean +/- z*sd)
    amendment v2 proposes to rely on at rungs 4-8 to catch exactly this
    kind of signal has a demonstrated blind spot for it. Approving
    amendment v2 AS CURRENTLY WRITTEN -- extend the ladder, keep the same
    in-sample D2 diagnostic -- risks reaching rung 8 with an
    "interval stabilised" reading that does not actually rule out a
    row-localized heavy tail at fb=22 (or fb=18), because the diagnostic
    that would need to catch it cannot. This report recommends the
    Coordinator and the paired red-team session (TASK-20260810-854c12)
    weigh this before any successor decision treats V1 as a clean
    concurrence with HEUR-INSTR-4, and recommends the concrete diagnostic
    fix above (LOO or externally-referenced check at fb=18/fb=22) as a
    condition attached to, not a replacement for, extending the ladder.
    This report does not withdraw, approve, or amend anything; that
    remains a Coordinator act.

  scope_and_admissibility_limits:
  - >-
    claim_tier toy on everything in this report. NO ATTACK, NO EXPONENT,
    NO SPEEDUP. Nothing here bears on H-ICINV-6c7920, EV-ENDO-10109d,
    endomorphism structure, |D_0|, or ECDLP difficulty in either direction.
    This report is entirely about the sampling behaviour of one statistic
    (the variance ratio) at one prime (p=4001), one geometry (trace-30,
    138 curves), and the stopping-rule/seed-ladder design built on it.
  - >-
    ADMISSIBILITY-ONLY, PER standing_control_restatement_v2 CLAUSE (c). All
    figures in this report are drawn from
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a's SR3 v3 characterisation, which
    re-measured the historical reference run EXP-ICINV-55c2d8 /
    RUN-ICINV-p4001-fixed at ITS OWN frozen sampler
    (exp_icinv.targets_uniform), per clause (b) of
    standing_control_restatement_v2 -- this report independently confirmed
    that clause was followed by reading conflict-1.json's
    what_the_reference_run_s_own_sampler_is field
    ("exp_icinv.targets_uniform, via harness/run_saturation.py. Read at
    run time from the reference run's own manifest command and code path,
    not assumed"), which matches the reference run's own declared command
    in sr3v3-reference-sampling.json's reference_run block. Everything
    this report computes therefore INHERITS THE H-ICINV-6c7920 DISPUTE
    WHOLESALE: if that hypothesis is later supported, the reference run's
    over-dispersion, the per-row sampling distribution characterised here,
    and every skewness/LOO figure derived from it are artifacts of the
    sampler, and this report's verdict on Explanation A vs B is a
    statement about that sampler's artifact behaviour, not about any curve
    or class. This report's verdict may not be cited as supporting any
    within-class, between-class, over-dispersion, or curve-side claim in
    either direction, and it is not so worded above.
  - >-
    ONE VALID RUN, ONE PRIME (p=4001), ONE GEOMETRY (trace 30, 138 curves,
    T=400), RUNGS 1-3 ONLY (12/24/48 seeds), UNREPLICATED. p=6007 is
    not_measured and this report neither measures it nor can extend the
    ladder past rung 3 -- no_compute_authorized_note in the handoff
    forbids new runs, and none were performed.
  - >-
    This report performed NO NEW HARNESS EXECUTION and consumed NO run
    identifier. All computation was read-and-reason over the seven
    artifacts hash-checked above, plus one disclosed, seeded, synthetic
    Monte Carlo null (20000 trials, Python stdlib `random`, seed
    20260810917) that draws on no run artifact whatsoever.
  - >-
    The secondary reachability-arithmetic finding (section 1,
    secondary_finding) is reported for completeness because it was found
    during independent re-derivation, but it is NOT one of the four named
    completion-gate deliverables of this task and does not change the
    verdict on Explanation A vs B.

  findings:
  - id: F-1
    severity: none_confirmatory
    title: Nested-ladder noise-scale formula 1/(2*sqrt(n_prev)) reproduces exactly at all 7 transitions.
    evidence: nested_ladder_noise_arithmetic.figures above.
    successor_action: none; cite these figures as independently verified.
  - id: F-2
