  # =====================================================================
  # 1. NESTED-LADDER NOISE ARITHMETIC -- RE-DERIVED, NOT ADOPTED
  # =====================================================================
  nested_ladder_noise_arithmetic:
    method: >-
      Re-derived from first principles, independently of DEC-20260810-5aeeaa's
      text, then compared. Model: rung n (n_prev seeds) has sum-of-squares
      S_A with approximately n_prev degrees of freedom; rung 2*n_prev is
      NESTED (adds n_prev new, independent seeds with sum-of-squares S_B,
      approximately n_prev more degrees of freedom, since every ladder in
      this contract -- E2 of amendment v1 and E6 of amendment v2 alike --
      doubles at every rung). s_n^2 = S_A/n_prev, s_2n^2 = (S_A+S_B)/(2 n_prev).
      log(s_2n/s_n) = 0.5*log((1+u)/2), u = S_B/S_A. For a chi-square variate
      with k degrees of freedom, Var(log(chi2_k/k)) -> 2/k for large k (from
      chi2_k approximately N(k, 2k)), so Var(log u) = Var(log S_B) + Var(log
      S_A) (independence) -> 2/n_prev + 2/n_prev = 4/n_prev. d/d(log u) of
      0.5*log((1+u)/2), evaluated at u=1 (e^0=1), is 0.5 * u/(1+u) |_{u=1} =
      0.25. By the delta method, Var(log(s_2n/s_n)) ~ 0.25^2 * 4/n_prev =
      0.25/n_prev, so SD(log(s_2n/s_n)) ~ 1/(2*sqrt(n_prev)). Since
      relative_change (as reported in sr3v3-interval-stability.json) is
      |half_width_new - half_width_old| / half_width_old and half_width is
      proportional to sd, and log(1+x) ~ x for small x, relative_change is
      modelled as approximately |Z| * 1/(2*sqrt(n_prev)) for Z ~ N(0,1).
      This is the SAME derivation DEC-20260810-5aeeaa's
      arithmetic_check_of_the_input_offered_by_the_archiving_session states;
      it was re-derived here independently step by step (not copied) and
      every step above checks out.
    figures:
    - transition: '12 -> 24'
      n_prev: 12
      sigma_recomputed: 0.144338
      dec_stated: 0.1443
      match: exact
    - transition: '24 -> 48'
      n_prev: 24
      sigma_recomputed: 0.102062
      dec_stated: 0.1021
      match: exact
    - transition: '48 -> 96'
      n_prev: 48
