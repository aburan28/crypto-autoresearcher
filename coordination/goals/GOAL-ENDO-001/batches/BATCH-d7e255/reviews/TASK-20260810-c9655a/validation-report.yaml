        dec_stated_z: 2.31
        match: exact
      median_max_of_13_absolute_standard_normals: 1.943
      recomputed_via: >-
        Solve (2*Phi(m)-1)^13 = 0.5 for m: 2*Phi(m)-1 = 0.5^(1/13) =
        0.948074, Phi(m) = 0.974037, m = Phi^-1(0.974037) = 1.9427.
      match_to_dec: exact (DEC states 1.943)
      probability_max_of_13_at_or_beyond_observed:
        rung_1_to_2: {recomputed: 0.0815, dec_stated: '~0.08', match: consistent}
        rung_2_to_3: {recomputed: 0.2398, dec_stated: '~0.24', match: consistent}
      note: >-
        These probabilities use P(max_13 |Z| >= t) = 1 - (2*Phi(t)-1)^13
        under the independent-rows approximation, which both this report and
        DEC-20260810-5aeeaa flag as understating the true probability given
        the rows share curves and seed-independent sum sets (positive
        correlation). Both the sigma-formula figures and the observed-z
        figures reproduce DEC-20260810-5aeeaa's stated numbers exactly; no
        divergence found on this sub-check.

    secondary_finding_not_requested_but_material_reachability_probabilities: >-
      NOT ONE OF THE FOUR NAMED DELIVERABLES OF THIS TASK, BUT FOUND WHILE
      RE-DERIVING THE ARITHMETIC AND REPORTED BECAUSE THE TASK IS
      REVIEW-ADVERSARIAL. DEC-20260810-5aeeaa's
      what_the_corrected_arithmetic_says_about_the_observed_values and
      amendments/v2.yaml's reachability_and_cost_derived_not_measured both
      state: "requiring every one of thirteen rows to move by less than 5%
      has probability about 1.2e-4 at the 24->48 transition, about 0.006 at
      48->96, about 0.095 at 192->384, about 0.51 at 384->768 and about 0.93
      at 768->1536" (independent-rows Gaussian model, P = (2*Phi(0.05/sigma)
      - 1)^13). This report recomputed P for all six future-facing
      transitions from the SAME model and the SAME sigma values verified
      exact above (P(single row within 5%) = 2*Phi(0.05/sigma)-1, then
      raised to the 13th power):
      24->48: recomputed 2.98e-06 vs DEC's stated 1.2e-04 (ratio ~40x);
      48->96: recomputed 1.64e-04 vs DEC's stated 6.0e-03 (ratio ~37x);
      96->192: recomputed 5.79e-03, NOT STATED BY DEC (this transition is
      silently absent from DEC's list -- five values are given for six
      future transitions);
      192->384: recomputed 9.47e-02 vs DEC's stated 9.5e-02 (exact match);
      384->768: recomputed 5.13e-01 vs DEC's stated 5.1e-01 (exact match);
      768->1536: recomputed 9.30e-01 vs DEC's stated 9.3e-01 (exact match).
      The last three transitions match DEC's own stated values to two
      significant figures; the first two do not, by roughly 37-40x, and the
      96->192 transition is missing from DEC's list entirely. This report
      could not identify from the committed text what computational step
      produced DEC's 24->48 and 48->96 figures; several plausible alternate
      formulas were tried (one-sided rather than two-sided Phi, a t rather
      than normal reference, a doubled-sigma threshold) and none reproduced
      DEC's exact stated values either. THIS DOES NOT CHANGE THE QUALITATIVE
      CONCLUSION DEC DRAWS ("effectively unreachable at 48 seeds by
      construction") -- if anything the corrected 2.98e-06 makes that
      conclusion MORE true, not less, since it is an even smaller
      probability than DEC states. It also does not bear on the A-vs-B
      question this task asks (reachability under the Gaussian model is
      computed ASSUMING Explanation A holds; it is a self-consistency check
      within A, not a test of A against B). It is flagged here as a
      concrete, independently-confirmed arithmetic defect in
      DEC-20260810-5aeeaa's own text -- the same class of defect
      (transitions attached to the wrong label, one entry silently dropped)
      that DEC itself found and corrected in the archiving session's
      original noise-scale sequence. A Coordinator carrying this decision
      forward should not cite the 1.2e-4 / 0.006 figures as verified; the
      192->384 / 384->768 / 768->1536 figures and the 0.1443/0.1021/...
      sigma sequence ARE independently verified and may be cited.

  # =====================================================================
  # 2. SKEWNESS AND TAIL-WEIGHT AT ALL 13 ROWS, EVERY RUNG REACHED (1,2,3)
  # =====================================================================
  skewness_and_tail_weight:
    formulas_used: >-
      Population-moment (biased) sample skewness g1 = m3 / m2^1.5, where mk
      = (1/n) * sum((x_i - xbar)^k). Bias-adjusted sample skewness G1 =
      (sqrt(n*(n-1))/(n-2)) * g1 (the "Excel SKEW" / adjusted Fisher-Pearson
      convention). Excess kurtosis = m4/m2^2 - 3 (Fisher convention, 0 under
      a true Gaussian). Computed directly from the per_seed_ratios recorded
      in sr3v3-reference-sampling.json for every (fb_size, rung) cell, with
      no dependency on the sd_sample_n_minus_1 or half_width fields also
      recorded there (those were independently recomputed too, see next
      note, purely as an artifact-integrity check).
    sd_and_half_width_recomputation_check: >-
      Before computing skewness/kurtosis, this report recomputed
      sd_sample_n_minus_1 and half_width = z * sd from the raw
      per_seed_ratios at all 13 rows x 3 rungs (39 cells) and diffed against
      the values stored in sr3v3-reference-sampling.json. Maximum absolute
      difference found: 2.220446049250313e-16 (float ULP), i.e. the stored
      summary statistics are bit-level faithful to the stored raw per-seed
      values. This is an artifact-integrity finding, not a new statistic.
