    title: DEC-20260810-5aeeaa's reachability-probability narrative (1.2e-4 at 24->48, 0.006 at 48->96) does not reproduce under its own stated model; the 96->192 transition is silently missing from its list.
    evidence: nested_ladder_noise_arithmetic.secondary_finding_not_requested_but_material_reachability_probabilities above.
    successor_action: >-
