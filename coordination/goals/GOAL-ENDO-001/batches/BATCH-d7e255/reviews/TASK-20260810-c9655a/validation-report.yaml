      match: exact
    - transition: '192 -> 384'
      n_prev: 192
      sigma_recomputed: 0.036084
      dec_stated: 0.0361
      match: exact
    - transition: '384 -> 768'
      n_prev: 384
      sigma_recomputed: 0.025516
      dec_stated: 0.0255
      match: exact
    - transition: '768 -> 1536'
      n_prev: 768
      sigma_recomputed: 0.018042
      dec_stated: 0.0180
      match: exact
    verdict_on_this_sub_check: >-
      CONFIRMED IN FULL. DEC-20260810-5aeeaa's corrected nested-ladder noise
      scale 1/(2*sqrt(n_prev)) reproduces exactly at every one of the seven
      transitions the amendment declares (rungs 1 through 8). This report
      does not merely check the arithmetic offered; it re-derived the
      formula's own justification (the chi-square asymptotic variance and
      the delta-method derivative) from scratch, and it holds.

