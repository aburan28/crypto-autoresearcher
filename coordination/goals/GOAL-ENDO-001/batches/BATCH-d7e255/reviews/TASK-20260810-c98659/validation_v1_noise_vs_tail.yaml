  # =====================================================================
  limitations:
    - >-
      ONE RUN, ONE PRIME, ONE GEOMETRY, 48 SEEDS PER ROW, UNREPLICATED. Every
      conclusion is scoped to p = 4001, the trace-30 class of 138 curves at ~12 bits,
      T = 400, the thirteen frozen rows, this sampler and this solver.
    - >-
      THE NONPARAMETRIC BOOTSTRAP CANNOT SEE A TAIL BEYOND THE OBSERVED RANGE. It
      reproduces the observed skew and kurtosis exactly but cannot extrapolate a
      heavier tail than 48 points reveal. The ladder-replay result is therefore
      "THE TAIL PRESENT IN THIS DATA DOES NOT DEFEAT THE GATE", not "no tail could".
      A distribution whose pathology only appears beyond the 1-in-48 quantile would
      be invisible to it, and to every other test here.
    - >-
      BELOW SYSTEMATIC SKEW ~0.30 THE AGGREGATE TEST CANNOT DISCRIMINATE (power
      0.709 at 0.30, and less below). That range is exactly what the chi-square
      generative model predicts and what the ladder replay measures to be harmless,
      but it is NOT MEASURED TO BE ABSENT and must not be reported as absent.
    - >-
      EVERY SIMULATION FIGURE IN THIS REPORT IS MY OWN MONTE CARLO, NOT A RUN
      ARTIFACT. It gates nothing and creates no evidence record. Replicate counts and
      rng seeds are stated where used (40000/seed 20260810; 60000 and 200000/seed
      4001; 400000 and 6000/seed 6007; 30000, 20000, 8000 and 5000/seed 115813;
      20000/seed 3972). Monte-Carlo error is +/- 0.01 or better on every probability
      quoted to two decimals.
    - >-
      THE CROSS-ROW CORRELATION USED IN EVERY NULL OBJECT WAS ESTIMATED FROM THE SAME
      48 POINTS. A 13x13 correlation from n = 48 is noisy and needed a nearest-PD
      repair; mean off-diagonal r = 0.151 (range -0.284 to +0.774), effective
      independent rows 5.7 by participation ratio and 11.8 by the Cheverud/Nyholt
      measure. The null-object probabilities inherit that estimation error.
    - >-
      MY FIRST GRUBBS p-VALUE FORMULA WAS INVERTED AND RETURNED p > 1. It is
      discarded and superseded by the corrected values recorded above. Recorded so
      the error is auditable rather than silently dropped.
    - >-
      I DID NOT RE-RUN tools/check_run_source_provenance.py --strict, and I did not
      re-execute any rung. The extrapolated ladder cost is UNCHECKED for the reason
      stated in cost_model_checks. The CONFLICT-1 adjudication and the freeze
      question are outside this review's scope; the freeze question is V2's.
    - >-
      THE CONCURRENT RED-TEAM REPORT WAS NOT READ. If it dissents, its dissent stands
      independently of this report; a `passed` here does not answer it.
    - >-
      A PASSED VALIDATION MEANS THE RECEIPT IS ADMISSIBLE EVIDENCE. IT DOES NOT
      SUPPORT AN ECDLP CLAIM, DEMONSTRATE A SPEEDUP, VALIDATE HEUR-INSTR-2 OR
      HEUR-INSTR-3, DISCHARGE CRITERION C4, OR AUTHORIZE PROMOTION. HEUR-INSTR-2
      remains not validated at 12, 24 or 48 seeds.

  what_would_settle_the_residual_uncertainty:
    - >-
      THE DATA DID SETTLE THE QUESTION AS POSED, so this is a list of what would
      close the two narrow gaps above, not a substitute for a verdict.
    - >-
      GAP 1 (skew below ~0.30). The extended ladder settles it for free: at rung 8
      each row has 1536 draws, at which the aggregate skew test's detection floor
      falls by a factor sqrt(32) ~ 5.7. NO SEPARATE EXPERIMENT IS NEEDED -- the
      amendment already produces the data that closes its own residual uncertainty,
      which is an additional reason to approve rather than withdraw. Requiring the
      per-row shape statistics to be REPORTED at every rung reached (E6 already
      reports interval, half-width and extremes) would make this automatic.
    - >-
      GAP 2 (a tail beyond the 1-in-48 quantile). Only more seeds can see it, and
      the ladder supplies them. A second prime (p = 6007) would give an independent
      family, but it is not_measured by the frozen stop rule and unblocking it is not
      this review's to propose.
    - >-
      IF THE COORDINATOR WANTS THE ESTIMATOR QUESTION SETTLED SEPARATELY from the
      ladder: the finite-n under-coverage in F-V1-2 is an analytic fact, not an
      empirical one -- t_(n-1)*sqrt(1+1/n) against z is exact and needs no run at
      all. It is a user decision on a user-selected gate, and it is independent of
      noise-vs-tail.

