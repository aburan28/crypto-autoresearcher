    what_it_corrected: >-
      That per-row skewness/kurtosis tests at n = 48 are badly underpowered and a
      bare null from them would read as evidence for noise and could license an
      unsupported approval.
    accepted_in_full: true
    consequence: >-
      Per-row moment tests are reported below WITH their detection floors and are
      given NO independent weight. The load-bearing evidence is the matched-symmetric
      ladder replay above and the null-object calibration of the exceedance signal.
    power_of_the_per_row_moment_test_at_n_48:
      se_G1: 0.3431
      detection_floor_at_2se: "|skew| = 0.686 -- nothing below this is detectable"
      measured_power_P_reject:
        true_skew_0.00_size: {two_se_rule: 0.049, shapiro: 0.055, dagostino: 0.057, jarque_bera: 0.038}
        true_skew_0.30: {two_se_rule: 0.123, shapiro: 0.102, dagostino: 0.116, jarque_bera: 0.076}
        true_skew_0.46: {two_se_rule: 0.210, shapiro: 0.193, dagostino: 0.187, jarque_bera: 0.151}
        true_skew_0.61: {two_se_rule: 0.315, shapiro: 0.296, dagostino: 0.269, jarque_bera: 0.226}
        true_skew_0.95: {two_se_rule: 0.567, shapiro: 0.563, dagostino: 0.476, jarque_bera: 0.434}
        true_skew_1.41: {two_se_rule: 0.880, shapiro: 0.941, dagostino: 0.780, jarque_bera: 0.748}
      reading: >-
        THE COORDINATOR IS RIGHT. A per-row moment test at n = 48 is blind across
        the whole skew range that matters, and a per-row null is not a finding.
    power_of_the_13_row_AGGREGATE_skew_test:
      method: correlation-aware, one-sided 5% critical value for the mean of 13 per-row G1
      critical_value: 0.1994
      observed_mean_skew: 0.1811
      measured_power: {true_skew_0.30: 0.709, true_skew_0.45: 0.948, true_skew_0.52: 0.984, true_skew_0.61: 0.995, true_skew_1.00: 1.000}
      reading: >-
        THIS null IS a finding, because its detection floor is stated: a UNIFORM
        right skew of 0.45 or more across rows is excluded at 95% power, and 0.30 at
        71% power. The observed 0.1811 sits just under the critical value and
        essentially on the chi-square model's own prediction of 0.2108. BELOW ABOUT
        SKEW 0.30 THIS DATA CANNOT SPEAK -- and that is precisely the range the
        generative model predicts and the ladder replay measures to be harmless.

