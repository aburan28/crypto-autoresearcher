  # =====================================================================
  the_single_question:
    question: >-
      Is the E3 stability failure at p = 4001 noise in the sd estimator (more seeds
      fix it; extend the ladder), or a right-skewed / heavy-tailed per-row sampling
      distribution (no number of seeds fixes it; the estimator is wrong)?
    answer: NOISE
    confidence: >-
      Well supported for the tail range this data can see, and explicitly silent
      below systematic skew ~0.30 -- a range the generative model already predicts
      and which the ladder replay measures to be harmless.

    what_the_null_distribution_SHOULD_be_under_the_contracts_own_model: >-
      STATED FIRST, BECAUSE EVERYTHING BELOW DEPENDS ON USING THE RIGHT NULL OBJECT.
      Per seed the statistic is the cross-curve variance of the m = 3 decomposition
      rate over N = 138 curves at T = 400 targets, divided by the binomial null
      variance. THAT IS A RATIO OF QUADRATIC FORMS AND HAS NO A-PRIORI REASON TO BE
      SYMMETRIC. Under the contract's own generative model it is asymptotically a
      scaled chi-square-type statistic, for which skewness = 2*CV and excess
      kurtosis = 6*CV^2 EXACTLY, both strictly positive. With the measured per-row
      CV of 0.083-0.148 the model PREDICTS per-row skew 0.166-0.296, mean 0.2108.
      A MILD RIGHT SKEW IS THE PREDICTED NULL BEHAVIOUR HERE, NOT A PATHOLOGY, and
      a Gaussian is the wrong-shape null object for this statistic. The observed
      mean per-row skew is 0.1811 -- marginally BELOW the model's own prediction.

    decisive_test_matched_symmetric_ladder_replay:
      provenance: >-
        CONTROL ADDED BY THE DISPATCHING SESSION MID-REVIEW (charter correction),
        not chosen by this reviewer after seeing its own first result. Recorded so
        the provenance is auditable. It replaced per-row moment tests as the
        load-bearing evidence.
      method: >-
        Resample whole seed-COLUMNS (13-vectors) with replacement from the run's own
        48 columns, preserving both per-row marginals and cross-row correlation;
        replay the frozen nested schedule 12/24/48/96/192/384/768/1536 with every
        rung a PREFIX of the next, exactly as rung 3 contains rung 2; apply the
        unchanged E3 5% rule at every row; stop at the first rung that meets it.
        5000 replicates, rng seed 115813. Compared against a MATCHED SYMMETRIC NULL
        built by reflecting each row's centred values about its own mean -- IDENTICAL
        per-row mean, variance AND kurtosis, skew identically zero -- which isolates
        skew alone; and against Gaussian (skew 0, excess kurt 0) and chi-square
        NULL-B (skew 2*CV) references at matched mean and variance.
      result:
        observed_P_stabilise_by_1536: 0.9482
        matched_symmetric_null: 0.9472
        gaussian_reference: 0.9656
        chi2_NULLB_reference: 0.9666
        observed_minus_matched_symmetric: +0.0010
        monte_carlo_se_of_the_difference: "<= 0.0100"
        per_transition_observed: {96_192: 0.011, 192_384: 0.119, 384_768: 0.513, 768_1536: 0.882}
        per_transition_matched_symmetric: {96_192: 0.015, 192_384: 0.130, 384_768: 0.504, 768_1536: 0.876}
      interpretation_rule_fixed_before_reading_the_number: >-
        If the observed data stabilises at a rate indistinguishable from the matched
        symmetric null, skew is not what defeats the gate; if markedly less often, a
        tail the estimator cannot absorb is implicated.
      reading: >-
        INDISTINGUISHABLE. Removing skew entirely, while holding mean, variance and
        kurtosis fixed, changes the gate's stabilisation probability by +0.0010
        against a Monte-Carlo se of 0.0100. SKEW CONTRIBUTES NOTHING MEASURABLE TO
        THE E3 FAILURE. The ~1.8 pp gap between observed/symmetric (0.948/0.947) and
        Gaussian/chi-square (0.966/0.967) is attributable to the observed EXCESS
        KURTOSIS, which the symmetric null retains and the Gaussian does not -- a
        small, quantified cost of about two points of stabilisation probability at
        the terminal rung, entirely consistent with extending the ladder.

    the_exceedance_signal_confirmed_as_fact_and_refuted_as_evidence:
      recomputed_from_raw: >-
        CONFIRMED EXACTLY. At rung 3, fb = 11 max 3.3357628 vs upper endpoint
        3.2613729, and fb = 22 max 4.8231 vs upper endpoint 4.5123. Both upper,
        none lower, 2 of 624. Both endpoints recompute to the recorded values to
        1e-9 from the raw per-seed ratios.
      they_are_two_events_not_one: >-
        CHECKED, BECAUSE A SHARED SEED WOULD HAVE COLLAPSED THE SIGNAL TO ONE
        OBSERVATION. fb = 11's argmax is seed 20260852; fb = 22's is 20260830.
        Different seeds. The two exceedances are genuinely two events.
      the_expected_count_of_2.4_IS_WRONG: >-
        A MATERIAL ERROR IN THE DECISION AND IN THE RUN'S OWN FRAMING. 13*48/260 =
        2.4 treats the interval endpoints as KNOWN CONSTANTS. They are estimated
        from the same 48 points, so the test is on SELF-NORMALISED extremes. Measured
        by simulation under a Gaussian null with the observed cross-row correlation
        (40000 replicates): E[upper] = 0.784, E[lower] = 0.789, TOTAL 1.57 -- a
        realised in-sample rate of 0.00252 per observation against the nominal
        0.00385. So 2 observed exceedances sit ABOVE 1.57 expected, not comfortably
        below 2.4. The decision's "consistent in count" reading is drawn from the
        wrong expectation, though the direction of the error works against the
        decision's own conclusion rather than for it.
      null_object_calibration_which_is_what_actually_settles_it:
        gaussian_null_P_at_least_2_all_upper: 0.099
        chi2_NULLB_null_P_at_least_2_all_upper: 0.365
        reading: >-
          Against a Gaussian straw null the configuration sits at p ~ 0.10 -- already
          not evidence. Against the SHAPE-CORRECT null, the contract's own generative
          model in which a variance ratio is right-skewed by 2*CV, the probability is
          0.365. THE OBSERVED EXCEEDANCE PATTERN IS EXACTLY WHAT THE CORRECT NULL
          PREDICTS. It is not a signal.
      same_result_in_the_moderate_tail: >-
        Pooled across all 13 rows with robust (median/MAD) standardisation, n = 624:
        at |z| > 2 there are 28 upper against 15 lower, difference +13. Under a
        Gaussian null with the observed correlation, E[upper] = 17.54, E[lower] =
        17.47, P(difference >= 13) = 0.043 and P(upper >= 28) = 0.047 -- a marginal
        p ~ 0.04 that a Gaussian-null analysis would have reported as a finding.
        Under the chi-square NULL-B model, E[upper] = 22.20, E[lower] = 13.01,
        P(difference >= 13) = 0.317, P(upper >= 28) = 0.186. THE ENTIRE APPARENT
        ASYMMETRY IS ABSORBED BY THE SKEW THE STATISTIC IS SUPPOSED TO HAVE. This is
        the inventor-protocol section 3 point in its sharpest form: the choice of
        null object flips the conclusion, and the Gaussian is the wrong shape.
      likelihood_comparison: >-
        For the exact observed (2 upper, 0 lower): P = 0.0696 under Gaussian, 0.2197
        under lognormal skew 0.30, 0.2161 under skew 0.46, 0.1507 under skew 0.61,
        0.0378 under skew 0.95, and 0.1893 under the chi-square NULL-B model.
        Likelihood ratios against Gaussian: 3.16, 3.11, 2.17, 0.54, 2.72. So a MILD
        right skew is favoured over Gaussian by a factor of about 3 -- and the
        contract's own predicted skew explains it just as well (2.72). A GENUINELY
        HEAVY RIGHT TAIL IS DISFAVOURED: skew 0.95 would have produced about 5.7
        upper exceedances, and its likelihood ratio is 0.54, i.e. WORSE than
        Gaussian.

    does_the_upper_tail_KEEP_EXTENDING_as_seeds_are_added:
      why_this_is_the_discriminator: >-
        Under noise the per-row SHAPE is fixed and only the sd estimate wobbles;
        under a heavy tail the upper extreme keeps extending as n grows. The rungs
        are strict prefixes, so blocks A = seeds[0:12], B = [12:24], C = [24:48] are
        DISJOINT and the shapes measured on them are independent.
      fb_22_the_only_significantly_non_normal_row: >-
        ITS MAXIMUM LIVES IN BLOCK B, AT INDEX 21 -- INSIDE RUNG 2. Doubling from 24
        to 48 seeds produced NOTHING above it: block C max 3.9899 against the
        standing 4.8231. For the very row that supposedly carries the heaviest tail,
        24 fresh seeds produced NO NEW UPPER EXTREME AT ALL. Its shape by block:
        skew 0.75 (A), 2.01 (B), 0.05 (C), with block-C excess kurtosis -0.61. THE
        SHAPE DID NOT REPLICATE OUT OF SAMPLE.
      fb_11: >-
        Maximum new at rung 3 (index 43), which is what doubling n does under any
        distribution and carries no information by itself.
      across_all_rows: >-
        10 of 13 rows have their 48-seed maximum in block C against 6.5 expected
        under exchangeability; correlation-aware Gaussian null gives P(>= 10) =
        0.100. Not significant.
      reading: >-
        The tail does NOT keep extending. This is the canonical artifact-tell test
        of the inventor protocol run in the direction that matters here, and the
        quantity behaves as the noise hypothesis requires.

    fb_22_is_one_outlying_seed_not_a_tail:
      full_sample_n48: skew 1.079, excess kurt 2.296, Shapiro p 0.01120, D'Agostino p 0.00098, Jarque-Bera p 0.000293
      multiplicity: Bonferroni over 13 rows gives 0.0127 (D'Agostino) and 0.0038 (JB) -- a real departure, the only one
      drop_the_single_maximum_n47: skew 0.406, excess kurt -0.054, Shapiro p 0.278, JB p 0.530
      drop_the_top_two_n46: skew 0.321, excess kurt -0.059, Shapiro p 0.456
      grubbs: >-
        fb = 22 G = 3.5554 against G_crit(5%, N=48) = 3.1118, p = 0.0063,
        Bonferroni over 13 rows 0.082. fb = 11 G = 3.2311, p = 0.0298, Bonferroni
        0.388. (My first Grubbs p-value formula was inverted and produced p > 1;
        it is discarded and these are the corrected values.)
      reading: >-
        A REAL HEAVY TAIL SURVIVES DELETION OF ITS LARGEST POINT. This does not:
        every departure statistic collapses to unremarkable on removing one seed,
        and the same row's 24 fresh seeds are symmetric and light-tailed. fb = 22
        carries ONE outlying seed, and one outlying seed in 624 observations is not
        a distributional shape.

    the_decisions_same_rows_claim_does_not_survive_base_rate_correction: >-
      VERIFIED INDEPENDENTLY AND IT IS TRUE BUT UNINFORMATIVE. 8 of 13 rows fail E3
      at rung 3 (4,7,8,9,11,15,18,22), so P(two named rows both fail) = (8/13)(7/12)
      = 0.359. "Both exceeding rows are among the rows that fail the stability rule"
      therefore carries essentially no information. Worse for the tail story: skew
      and kurtosis do NOT predict the SIZE of the stability failure --
      Spearman(skew, |relative half-width change|) = +0.42 (p = 0.15),
      Spearman(excess kurt, .) = +0.12 (p = 0.69), Spearman(CV, .) = -0.02
      (p = 0.94). THE LARGEST RUNG-3 INSTABILITY IS fb = 7 AT 0.2354, WHOSE EXCESS
      KURTOSIS IS +0.017 -- essentially Gaussian. The rows that most badly fail the
      gate are not the rows with any tail.

