  # =====================================================================
  findings_for_the_coordinator_and_the_user:
    - id: F-V1-1
      severity: correction_required_in_the_successor_decision
      finding: >-
        Two of the five reachability figures in DEC-20260810-5aeeaa are attached one
        rung late: "1.2e-4 at 24->48" is the 48->96 value (true 24->48 is 2.98e-06)
        and "0.006 at 48->96" is the 96->192 value. The three figures that select the
        terminal rung (0.095, 0.51, 0.93) are correct. No conclusion changes and the
        error understates rather than overstates the decision's own case, but the
        decision presents these as "the decisive computation" and it should be
        superseded on this point.
    - id: F-V1-2
      severity: material_finding_about_the_estimator
      finding: >-
        THE c4 DISCLOSURE IS INCOMPLETE, AND THE OMITTED EFFECT IS LARGER AND RUNS
        THE OTHER WAY. Amendment v2 E6 discloses that the sample sd is biased low, so
        a longer ladder yields a ~0.5% wider and hence more permissive interval. That
        is correct (I measure +0.517%) and I ACCEPT LEAVING IT UNCORRECTED: c4(n) is
        a function of n alone, cannot be tuned to any observed value, and applying it
        would be an estimator change after seeing data -- which in this campaign is a
        user decision. BUT there is a SECOND finite-n effect, unmentioned, and it is
        anti-permissive and much larger. Because BOTH the mean and the sd are
        estimated, mean +/- z*sd UNDER-COVERS out of sample. Measured on pure
        Gaussian rows with NO SKEW WHATSOEVER (400000 replicates), the realised
        two-sided tail probability against a nominal 0.003846 is 0.00627 at n = 48
        (1.63x nominal), 0.00946 at n = 24 (2.46x), 0.01816 at n = 12 (4.72x),
        falling to 0.00404 at n = 768 (1.05x) and 0.00398 at n = 1536 (1.04x). The
        exact analytic factor is t_(n-1)(519/520)*sqrt(1+1/n) = 3.0727 at n = 48
        against the frozen z = 2.8905. CONSEQUENCES: (i) the net finite-n direction
        of the estimator at n = 48 is ANTI-permissive, not permissive, so the c4
        disclosure taken alone overstates the case that a longer ladder is more
        permissive; (ii) this is a SECOND and larger reason the extension is the
        right repair, since it is finite-n mis-calibration rather than skew that
        makes the n = 48 interval wrong, and it converges away by about n = 384;
        (iii) it is a genuine, quantified weakness of HEUR-INSTR-3 at coverage
        259/260 that has nothing to do with tails and was not previously recorded.
        RECOMMENDING AN ESTIMATOR CHANGE IS NOT MINE TO ENACT: this is reported so
        the Coordinator and the user can decide whether the t-based prediction factor
        belongs in a future versioned amendment. It does not block approving v2.
    - id: F-V1-3
      severity: worth_recording
      finding: >-
        The ladder has a measured ~5.3% probability of reaching the terminal rung
        1536 without stabilising (P(stabilise by 1536) = 0.948 on the run's own
        bootstrapped data, 0.947 against the matched symmetric null, 0.966 against
        Gaussian). Amendment v2 T3 already declares that outcome in advance in both
        directions, which is exactly what keeps the extension from being optional
        stopping. Stating the number costs nothing and forecloses a later reading
        that a terminal F4 was unexpected.
    - id: F-V1-4
      severity: worth_recording
      finding: >-
        The measured excess kurtosis, not skew, is the only channel by which the
        per-row distribution degrades the ladder, and it is small. The nested
        relative sd generalises to sqrt((kappa+2)/(8n)); with the per-row measured
        kappa the independent-row product at 768->1536 falls from 0.930 to 0.862,
        and fb = 22 alone (kappa = 2.296) drops to 0.941. That is about two points of
        stabilisation probability at the terminal rung -- a real cost, quantified,
        and not disqualifying.
    - id: F-V1-5
      severity: methodological_note
      finding: >-
        The nested formula 1/(2 sqrt(n_prev)) is a large-n approximation and is
        optimistic at the small rungs (true 0.1873 / 0.1156 / 0.0763 against
        analytic 0.1443 / 0.1021 / 0.0722 at n_prev = 12 / 24 / 48). The Coordinator's
        correction of the archiving session was right in model and direction; a
        successor that quotes small-rung figures should use simulated rather than
        asymptotic values.

  # =====================================================================
  heuristic_validation_checks:
    - check: pre-registered prediction
      result: >-
        SATISFIED FOR E3 AND NOT AT ISSUE. The 5% rule, the rungs 12/24/48, the
