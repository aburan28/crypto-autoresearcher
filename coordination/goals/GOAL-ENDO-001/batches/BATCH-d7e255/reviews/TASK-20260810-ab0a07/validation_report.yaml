  # =====================================================================
  # 8. VALIDATOR CAPABILITY PROBE -- NOT EVIDENCE
  # =====================================================================
  validator_capability_probe:
    status: PROBE ONLY. NOT A MEASUREMENT. MUST NOT BE CITED AS A RESULT.
    why_it_was_run: >-
      Required to answer the task's adversarial SR3 question -- whether an
      independent path exists that the executor missed -- which cannot be
      answered by reading artifacts. Bounded to five curves and framed exactly
      as the Coordinator framed its own stage-0 probe in the handoff: it
      establishes what the instruments can do and nothing about the class.
    scope: >-
      Five class members: (441,294), (17,1345), (109,2740), (134,1423),
      (148,2766). One curve for the msolve path. No gauge control, no control
      set, no monomial-order control, no completeness. Nothing here is scoped,
      replicated or controlled to the contract's standard.
    observations:
    - >-
      On all five, the affine ideal I_3 = <S_3, dS_3/dx1, dS_3/dx2, dS_3/dx3>
      over GF(4001) has dimension 0 and vector_space_dimension 6, and its
      HOMOGENISATION has dimension 1.
    - >-
      LATENT INSTRUMENT HAZARD IN A COORDINATOR ARTIFACT. The handoff's
      stage_0_gate_note (TASK-20260810-ab0a07 lines 116-117, 122-123) states
      "The affine singular-locus dimension is available as `Ideal.dimension()`"
      and reports "`Ideal.dimension()` returned 1 on all three probe curves".
      The affine dimension is 0; 1 is the HOMOGENISED dimension. This is exactly
      the affine-versus-projective conflation the contract's
      `affine_vs_projective` clause (specification.yaml lines 117-121) forbids,
      sitting inside the dispatch record. THE RUN IS NOT AFFECTED -- the handoff
      itself forbade carrying the probe value forward, and the run carried
      nothing forward, computing no dimension at all. Flagged so the successor
      does not inherit it.
    - >-
      On all five, Sage's MPolynomialIdeal has NO `.degree()` method in 10.9
      (AttributeError), the sibling of the handoff's recorded `.betti()` gap.
      A successor must obtain singular-locus degree by another route on the
      primary backend too.
    - >-
      On all five, the elimination ideal I_3 n F_p[x3] is generated by exactly
      x3^3 + a x3 + b -- the curve's own cubic -- and its F_p-factorisation type
      is [1,1,1] on (441,294), (17,1345), (109,2740), (134,1423) and [1,2] on
      (148,2766).
    forward_implication_for_the_coordinator: >-
      If that shape is generic across the class, then one of the four PRIMARY
      invariant families -- the elimination polynomial's factorisation type --
      is the splitting type of x^3 + ax + b, i.e. a function of E(F_p)[2], which
      is not preserved by 2-isogenies and is already non-constant on these five
      members. The CLASS-VARYING direction would then be reached for a reason
      with no Semaev content, mirroring the S_4 outlier. This is a five-curve
      probe and proves nothing; it is recorded because it bears directly on
      whether the SR3 stop blocked work of value and on how the successor
      contract should be written. It must be reproduced under the contract, with
      C-GAUGE, C-ORDER and the control set, before it is anything at all.

