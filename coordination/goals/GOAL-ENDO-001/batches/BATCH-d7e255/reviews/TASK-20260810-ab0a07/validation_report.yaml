      plus the gauged outlier model: 391 for both models of the outlier's
      j-invariant, 439 for all 12 others.

  # =====================================================================
  # 4. THE S_4 OUTLIER -- adjudicated  (task item 5)
  # =====================================================================
  s4_outlier_adjudication:
    question_posed: >-
      "A single deviating curve is exactly the shape of both a real discovery
      and an off-by-one bug." Which is it, or what would settle it?
    answer: >-
      IT IS NEITHER A BUG NOR A DISCOVERY ABOUT ISOGENY CLASSES. It is a real,
      exactly characterised, CHARACTERISTIC-INDEPENDENT degeneration of the
      fourth summation polynomial that depends only on the j-invariant of the
      individual curve and makes no reference to the trace, the class, or any
      isogeny. The measurement is correct; its isogeny content is zero. This is
      settled below, not merely conjectured.
    curve_is_genuinely_in_the_class: true
    curve_membership_evidence: >-
      EllipticCurve(GF(4001), [441, 294]) has trace_of_frobenius 30,
      j_invariant 2257, cardinality 3972, |Aut| 2, discriminant 1152 != 0 --
      recomputed by me, matching the recorded row for TOY-P12-bc0b3378 exactly.
      j = 2257 is present in my independently enumerated j-set for the class.
    exact_cause:
      vanishing_count: 48 of the 439 S_4 monomials
      condition_over_F_4001: b^2 - 500 a^3 = 0
      condition_over_Z: a^3 + 8 b^2 = 0
      equivalence_note: >-
        8 * 500 = 4000 = -1 mod 4001, so 500 = -1/8 and b^2 = 500 a^3 is exactly
        a^3 + 8 b^2 = 0.
      derivation: >-
        Factoring the 48 vanishing coefficient polynomials over GF(4001)[a,b]
        gives, in every case, a * (b^2 - 500 a^3), b * (b^2 - 500 a^3) or
        (b^2 - 500 a^3) up to a unit. The same computation carried out over
        QQ[a,b] (S_4 has support 439 over QQ as well) shows EXACTLY 48
        coefficients divisible by a^3 + 8 b^2, so this is not an artefact of
        characteristic 4001.
      it_is_a_pure_j_condition: >-
        On a^3 = -8 b^2 one gets 4a^3 + 27b^2 = -5 b^2 and
        j = 1728 * 4a^3/(4a^3 + 27b^2) = 1728 * 32/5, which in F_4001 is
        exactly 2257. I confirmed computationally: the locus b^2 = 500 a^3
        carries 4000 non-singular (a, b) points and EVERY ONE has j = 2257.
        Support is therefore a function of j alone here, which is also why
        C-GAUGE cannot move it.
    other_class_members_satisfying_the_same_condition:
      count: 0
      method: >-
        I evaluated b^2 - 500 a^3 at all 138 recorded (a, b). Exactly one member
        satisfies it: TOY-P12-bc0b3378. The class has 138 DISTINCT
        j-invariants, so no second member can lie on a single-j locus.
      answers_the_question: >-
        "check whether any OTHER curve in the class satisfies that same
        condition but was scored 439" -- NO. There is no off-by-one: no member
        satisfying the condition was scored 439, and no member scored 391
        without satisfying it.
    complete_degeneration_stratification:
      note: >-
        Computed by me, not by the run. The 439 S_4 coefficients over QQ[a,b]
        have exactly these non-constant irreducible factors, with multiplicity
        of occurrence across coefficients:
        a (248), b (214), a^3 + 8b^2 (48), -a^3 + 8b^2 (36), -a^3 + 12b^2 (6),
        3a^3 + 32b^2 (6), a^3 + 6b^2 (4), 5a^3 + 48b^2 (1).
      consequence: >-
        Each of the six a^3/b^2 loci is a single j-invariant. Evaluating S_4
        support at a representative model of every j in F_4001 gives support 439
        for 3993 of the 3999 values of j not in {0, 1728}, and reduced support
        at exactly six: j = 135 -> 438, j = 1426 -> 433, j = 2180 -> 435,
        j = 2257 -> 391, j = 2836 -> 403, j = 3344 -> 433. Separately j = 0 ->
        191 and j = 1728 -> 225, both excluded from this class by T4 since
        D_0 = -59.
      what_this_settles: >-
        The 391 stratum is the DEEPEST of six universal degeneration loci of
        S_4, and the class of 138 j-invariants contains one of the six. The
        arithmetic of coincidence, stated as arithmetic and explicitly NOT as a
        p-value or a run statistic: any 138 curves drawn from the 3999
        admissible j-invariants contain 138 * 6/3999 = 0.207 special curves on
        average. Observing one is unremarkable. Decisively, the condition is a
        polynomial identity in (a, b) with no reference to trace or isogeny, so
        even a hit at odds of one in a million would carry no class
        information.
    null_object_control_status: MISSING, and correctly declared missing
    null_object_note: >-
      docs/inventor-protocol.md section 3 requires a statistical signal to be
      measured against a null object of the same shape. The contract's own
      C-CONTROL-SET is exactly that null object (138 random ordinary curves at
      p = 4001 from other traces), and it was NOT computed -- SR4 is downstream
      of SR3. The run states this plainly in control-set-invariants.json and in
      verdict.json's `measurement_not_interpretation` field, and draws no
      inference. That is the correct handling of a lead without its control.
      What the run does NOT state, and what a reader needs, is what the quantity
      SHOULD do: S_4 support is constant in the trace and varies only with j, so
      the null object would exhibit the same phenomenon at the same rate, and
      the "excess" does not decay as class membership is destroyed because it
      never depended on it. That is supplied here so the lead is not carried
      forward as an unexplained anomaly.
    verdict_on_the_outlier: >-
      REAL MEASUREMENT, CORRECTLY REPORTED, ZERO ISOGENY CONTENT. It should be
      recorded as a property of the summation polynomial S_4 (a six-point
      degeneration locus in the j-line), not as a lead about isogeny-class
      invariance, and it must not be cited as CLASS-VARYING evidence.

  # =====================================================================
  # 5. CONTROL CHECKS
  # =====================================================================
  control_checks:
  - control: C-SUPPORT
    contract_ref: specification.yaml line 190
    status: discharged
    independently_verified: true
    detail: See M1. 13 / 9 / 10 re-derived by me in Sage and in sympy.

  - control: C-CENSUS
    contract_ref: specification.yaml line 185
    status: discharged
    independently_verified: true
    detail: >-
      See M3. Re-derived by me from Sage's elliptic-curve machinery and PARI's
      Hurwitz class number, with no harness code in the path, and cross-checked
      against the closed-form class-number computation for the order chain of
      D_0 = -59, conductor 16.

  - control: C-GAUGE
    contract_ref: specification.yaml lines 166-169, 136-139
    status: discharged
    independently_verified: true
    detail: >-
      I re-verified all 138 entries of gauge-recheck.json myself. For each
      member I checked (i) the recorded (gauged_a, gauged_b) equals
      (u^4 a, u^6 b) in GF(4001), (ii) the exact polynomial identity
      S_3^{(u^4 a, u^6 b)}(u^2 x1, u^2 x2, u^2 x3) == u^8 * S_3^{(a,b)}(x1,x2,x3)
      holds in GF(4001)[x1,x2,x3], and (iii) monomial support is preserved.
      ZERO failures on 138 curves. The outlier is included: u = 1711, gauged
      model (2118, 2496); I independently computed the S_4 support of the GAUGED
      model in sympy and obtained 391, matching the ungauged 391.
    caveat: >-
      C-GAUGE is a real implementation control but it is weak against the
      question being asked, and that should be understood rather than assumed.
      S_3 is weighted-homogeneous of weight 8 (wt x = 2, wt a = 4, wt b = 6), so
      the identity holds identically for every u and cannot fail unless the code
      is wrong. More importantly the same scaling argument shows monomial
      support is constant on the full orbit {(l^2 a, l^3 b)}, which includes
      both quadratic twists; hence support is a function of j alone and C-GAUGE
      cannot discriminate a curve difference from a model difference. It
      discharges "the implementation is right", not "the difference is real".

  - control: C-BACKEND
    contract_ref: specification.yaml lines 170-172, 147-149
    status: NOT SATISFIABLE ON THIS HOST -- this is the gate that fired
    independently_verified: partially; see the SR3 findings below
    detail: >-
      Performed for what is coverable: S_3 support cross-checked by sympy on all
      138 (zero disagreements) and S_4 support on a declared subsample (s0: 20
      curves; s1: 21 curves) with zero disagreements. `clean_two_backend_cross_
      check_claimed: false` is recorded explicitly and no clean cross-check is
      claimed anywhere in the package. I independently reproduced the sympy
      cross-check on the outlier and 12 further members and agree.

  - control: C-ORDER
    contract_ref: specification.yaml lines 173-177
    status: not_computed
    admissible: true
    detail: >-
      Applies to resolution-derived quantities; no ideal was built. Recorded as
