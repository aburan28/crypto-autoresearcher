    under AGENTS.md rule 5 and is NOT negative mathematical evidence.

    THE S_4 OBSERVATION IS ADMISSIBLE AS A MEASUREMENT AND IS NOT A LEAD ABOUT
    ISOGENY CLASSES. This report establishes its exact cause: 48 of the 439 S_4
    coefficients carry the factor a^3 + 8b^2 over QQ as well as over F_4001, a
    locus that is a single j-invariant (j = 1728*32/5 = 2257 in F_4001), one of
    six such universal degeneration loci of S_4 in the j-line, and one of the
    138 class members happens to lie on it. It should be recorded as a property
    of S_4, not carried forward as an anomaly.

