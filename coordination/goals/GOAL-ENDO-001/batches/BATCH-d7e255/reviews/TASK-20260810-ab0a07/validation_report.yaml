  # =====================================================================
  # 6. THE SR3 DETERMINATION -- adversarially tested  (task item 2)
  # =====================================================================
  sr3_adversarial_review:
    claim_under_test: >-
      "graded Betti numbers, CM-regularity and singular-locus degree have NO
      independent backend on this host in either verdict direction, so contract
      success criterion (3) is unmeetable."
    outcome_verdict: CORRECT IN OUTCOME, OVER-BROAD IN ONE OF THE THREE METRICS
    binary_inventory_i_performed:
      absent_confirmed: >-
        `command -v` returns nothing for M2, macaulay2, Macaulay2, Singular,
        singular, magma, cocoa, CoCoA, gap, maple, mathematica. The run's three
        recorded FileNotFoundError probes (Macaulay2, standalone Singular,
        Magma) are truthful.
      present_found_by_me: >-
        sage 10.9 (/usr/local/bin/sage), msolve 0.9.5 (/opt/homebrew/bin/msolve),
        gp (PARI, /opt/homebrew/bin/gp), sympy 1.14.0, and a bundled Singular
        binary inside SAGE_ROOT/local/bin (Singular, ESingular, TSingular).
      bundled_singular_assessment: >-
        The bundled Singular DOES compute minimal free resolutions (mres/betti),
        so the CAPABILITY exists on the host. It is not an INDEPENDENT backend:
        it is the same installation and, for resolutions, the same engine Sage
        itself calls. The run and the handoff both label it a second code path
        and not a backend, and refuse to claim agreement from it. I agree with
        that call; a self-consistency check between two entry points to the same
        Singular is not a cross-check.
      gp_assessment: PARI/gp computes no minimal free resolution. No path there.
    where_the_run_is_right:
      graded_betti_numbers: >-
        Genuinely uncovered. Graded Betti numbers of I are NOT determined by the
        initial ideal, so no Groebner-basis engine can supply them by
        post-processing; a resolution engine is required, and the only one on
        this host is Sage/its bundled Singular. Criterion (3) is unmeetable on
        this metric alone, which is sufficient for the gate to fire.
      castelnuovo_mumford_regularity: >-
        Effectively uncovered. The one theoretical loophole is Bayer-Stillman:
        in generic coordinates reg(I) = reg(gin_revlex(I)), so a regularity
        number could in principle be extracted from an independent grevlex GB
        after a generic linear change of coordinates. That is writing a new
        regularity algorithm on top of msolve, not using a second backend, and
        it needs generic coordinates that destroy the sparsity of the very
        ideals at issue. I record it as a theoretical possibility that does not
        change the gate, not as a path the executor missed.
    where_the_run_is_over_broad:
      metric: singular_locus_degree
      finding: >-
        backend-provenance.json lists singular_locus_degree among
        `primary_metrics_with_no_independent_cross_check`. THAT CLASSIFICATION
        IS WRONG BY THE RUN'S OWN STANDARD. msolve supports `-g 2`, printing the
        full reduced grevlex Groebner basis; degree is a function of the initial
        ideal exactly as dimension is, and the run already credits msolve with
        singular_locus_dimension, which requires the same staircase
        post-processing. An inconsistent standard was applied to two metrics of
        the same kind.
      demonstration_i_performed: >-
        On the f_V-free Jacobian ideal I_3 = <S_3, dS_3/dx1, dS_3/dx2, dS_3/dx3>
        of ONE curve (a, b) = (441, 294), msolve returned the reduced grevlex GB
        [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294]. Taking
        grevlex leading monomials {x1, x2^2, x3^3} in pure python and computing
        the Hilbert-series numerator (1, -1, -1, 0, 1, 1, -1) by the standard
        recursion gives (1-t)^3 * q(t), hence affine dimension 0 and degree
        q(1) = 6. SageMath on the same ideal returns dimension 0 and
        vector_space_dimension 6. Independent agreement, obtained with no Sage
        in the computation path.
      does_it_change_the_gate: NO
      why_not: >-
        Criterion (3) requires the cross-check to cover EVERY primary metric on
        which a difference could be claimed. Graded Betti numbers remain
        uncovered, so criterion (3) remains unmeetable and the terminal
        infrastructure stop stands unchanged. The defect is in the gate's stated
        justification (three uncovered metrics claimed, two actually uncovered),
        not in its conclusion.
    is_the_stop_self_serving:
      assessment: NO
      reasoning: >-
        Three separable reasons. (i) The stop was PRE-RECORDED BY THE
        COORDINATOR AT DISPATCH: the handoff's second_backend_note states the
        cross-check cannot be met as written on this host and instructs the
        executor to raise it at SR3 rather than work around it. The executor did
        not invent the escape. (ii) The stop is costly to the executor, not
        cheap: it forgoes the entire deliverable and returns a
        failed_infrastructure receipt. (iii) The gate condition is objectively
        true and I verified it independently by binary inventory. The one thing
        that shades toward self-service is the over-broad third metric, which
        makes the gate look more forced than it is; it is recorded as a defect
        for that reason.
    scope_observation_on_S_4:
      note: >-
        The run computed the S_4 monomial support -- a contract SECONDARY metric
        -- inside the SR1 stage, i.e. before the SR3 gate it then stopped at, and
        that computation produced the package's most quotable output. This is
        not an SR3 violation (SR3 forbids computing a RESOLUTION before the
        backends are declared, and no ideal was built) and it is not outcome
        shopping: s0 and s1 both computed and reported it, so the metric set does
        not depend on the outcome, satisfying SR7. Recorded so a reader knows the
        headline observation came from a stage the run's own gate ordering did
        not require.

  # =====================================================================
  # 7. RUN INTEGRITY AND D2 / D4  (task items 6, 7, 8)
  # =====================================================================
