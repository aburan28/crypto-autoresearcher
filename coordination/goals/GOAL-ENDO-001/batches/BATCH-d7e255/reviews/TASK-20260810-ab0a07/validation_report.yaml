  # =====================================================================
  # 3. METRIC RECOMPUTATIONS  (task items 3, 4, 5)
  # =====================================================================
  metric_recomputations:
  - id: M1
    metric: SR1 symbolic support derivation, 13 / 9 / 10
    reported: {generic: 13, a_eq_0: 9, b_eq_0: 10}
    recomputed: {generic: 13, a_eq_0: 9, b_eq_0: 10}
    agrees: true
    method: >-
      Validator-authored Sage script building S_3 = (x1-x2)^2 x3^2 -
      2((x1+x2)(x1 x2 + a) + 2b) x3 + ((x1 x2 - a)^2 - 4b(x1+x2)) over
      GF(4001)[a,b][x1,x2,x3] with a, b free indeterminates, counting
      len(poly.monomials()); and, separately, sympy 1.14.0 in host python3 with
      the same formula. Both give 13 / 9 / 10. The hand argument also closes:
      3 monomials from (x1-x2)^2 x3^2, 5 from the linear-in-x3 term
      (x1^2x2x3, x1x2^2x3, a x1 x3, a x2 x3, b x3), 5 from the constant term
      (x1^2x2^2, a x1x2, a^2, b x1, b x2) = 13; setting a = 0 kills the four
      a-bearing monomials -> 9; setting b = 0 kills the three b-bearing
      monomials -> 10.
    binding_check: >-
      The sha256 binding of the reference record is real (A3). The run did not
      transcribe 13/9/10; it regex-extracted them from a record whose digest it
      recorded and which I re-hashed independently.

  - id: M2
    metric: S_3 monomial support per class member, all 138
    reported: '{13: 138}, 1 distinct value'
    recomputed: '{13: 138}, 1 distinct value'
    agrees: true
    method: >-
      Validator Sage evaluation of S_3 at each recorded (a,b) over GF(4001),
      counting monomials; plus sympy over modulus=4001 on the outlier and 12
      randomly chosen members. Per-curve comparison against
      per-curve-invariants.json: 138 curve_ids in common, ZERO mismatches.

  - id: M3
    metric: SR2 census -- 138 members, D, D_0, conductor, Hurwitz mass, |Aut|
    reported: >-
      138 members; D = -15104 = -59 * 16^2; observed weighted mass
      sum 2/|Aut(E)| = 138.0 = H(4p - t^2) = 138.0; |Aut| multiset {2: 138};
      253 traces at p = 4001 all agreeing, zero disagreements
    recomputed: >-
      138 members; D = -15104; weighted mass 138 = H(15104) = 138; |Aut|
      multiset {2: 138}; 138 DISTINCT j-invariants; every member of order 3972;
      253 traces spanning [-126, 126], ZERO disagreements
    agrees: true
    method: >-
      Fully independent of harness/isogeny_class.py. Validator Sage script
      looping j over GF(4001), constructing EllipticCurve(j=j), enumerating
      E.twists(), taking short_weierstrass_model(), and accumulating
      2/|E.automorphisms()| per trace_of_frobenius; the predicted mass taken
      from PARI as `pari(4*p - t^2).qfbhclassno()`. 253 traces is also the
      correct count a priori since 126^2 = 15876 < 4p = 16004 < 16129 = 127^2.
    cross_check_by_hand: >-
      D_0 = -59, conductor 16. Kronecker(-59, 2) = -1 since -59 = 5 mod 8, so
      h(-59 f'^2) = 3 * f' * (3/2) for f' > 1, giving h = 3, 9, 18, 36, 72 for
      f' = 1, 2, 4, 8, 16 and H(15104) = 3+9+18+36+72 = 138. This reproduces
      both the class size AND the committed true-volcano-level distribution
      {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} from theory alone.
    member_level_check: >-
      The j-invariant SET of my independent census is IDENTICAL to the
      j-invariant set of class-census.json (138 = 138, exact set equality). I
      then re-verified every one of the 138 recorded members individually by
      constructing EllipticCurve(GF(4001), [a, b]) and comparing
      trace_of_frobenius, j_invariant, cardinality and |automorphisms| against
      the recorded row: 0 failures out of 138.

  - id: M4
    metric: S_4 monomial support over the class
    reported: '{439: 137, 391: 1}, 2 distinct values; outlier TOY-P12-bc0b3378'
    recomputed: '{439: 137, 391: 1}, 2 distinct values; outlier TOY-P12-bc0b3378'
    agrees: true
    method: >-
      Validator Sage script computing S_4 = Res_t(S_3(x1,x2,t), S_3(x3,x4,t))
      SYMBOLICALLY over GF(4001)[a,b], retaining each x-monomial's coefficient
      as a polynomial in (a,b), then evaluating the 439 coefficient polynomials
      at each recorded (a,b). Per-curve comparison against
      per-curve-invariants.json: 138 curve_ids, ZERO mismatches. Independently
      re-checked with sympy 1.14.0 in host python3 (`sympy.resultant` then
