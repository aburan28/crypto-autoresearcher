    this session and every one matched.

    PASSED DOES NOT MEAN, AND THIS RECEIPT DOES NOT SUPPORT: any statement about
    whether Semaev geometry is an isogeny-class invariant, in either direction;
    any ECDLP claim; any speedup, exponent movement or sota_delta; the closure
    of the d_reg axis of RQ-ICINV-475b5e; any change to H-ICINV-d5e351, which
