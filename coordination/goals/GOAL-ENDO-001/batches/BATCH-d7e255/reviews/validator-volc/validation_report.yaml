  metric_recomputations:
    - id: V1
      check: >-
        Independently re-derive SR1's Velu-2 volcano reconstruction on p=4001,
        t=30 WITHOUT reading or trusting runs/_source/volc_graph.py, and
        confirm the FIXED Velu-2 formula (v=3x0^2+a, no doubling) is
        mathematically correct, not merely numerically matching.
      method: >-
        Own from-scratch Python implementation, written in this session:
        (1) naive Legendre-symbol point counting to find a trace-30 seed
        curve; (2) Velu-2 image formula derived from first principles from
        the general Velu odd-point term (t_Q=2*(3x^2+A) for a +/-Q pair) by
        recognizing a 2-torsion point is self-paired and must NOT be
        doubled (t_Q=3x0^2+A) -- this is exactly the defect/fix distinction
        under review, re-derived rather than copied; (3) each computed
        Velu-2 image independently cross-validated against the classical
        weight-2 modular polynomial Phi_2(j(E),j(E'))=0 mod p (an isogeny
        existence certificate wholly independent of Velu's own formula);
        (4) own discrete-orbit-minimum canonicalizer for (a,b)~(u^4a,u^6b)
        isomorphism classes (validated by independent large random sampling
        finding the same distinct-class count the BFS eventually confirms);
        (5) own tree-center algorithm to identify crater vertices from raw
        graph structure (after fixing an initial version that over-pruned
        to the empty set -- see anomaly note below).
      result: CONFIRMED, with an added structural finding not stated in the executor's report.
      detail: >-
        Phi_2(j0,j1) mod 4001 = 0 for all three Velu-2 images of the seed
        curve, confirming the formula produces genuinely 2-isogenous curves
        (not merely trace-preserving by coincidence). A single BFS from one
        seed closes at exactly 46 curves, not 138; independent large random
        sampling (22269 trials, 400 trace-30 hits) found 132+ distinct
        isomorphism classes, proving the 46-vertex closure was correct but
        incomplete-by-construction, not a bug. Diagnosis, independently
        derived: D_0=-59, h(-59)=3, and Kronecker(-59,2)=-1 (since -59 mod 8
        = 5) -- the crater is INERT at ell=2, meaning ZERO horizontal edges
        connect its 3 crater vertices, so the 138-curve class is the UNION
        OF 3 DISJOINT TREES under pure 2-isogeny, each rooted at one crater
        vertex. Running the BFS from 3 independently-found seeds (one per
        component) gives three size-46 components with IDENTICAL per-tree
        level histograms {0:1,1:3,2:6,3:12,4:24}; the AGGREGATE across all
        three is {0:3,1:9,2:18,3:36,4:72} -- an EXACT match to the executor's
        (and the design doc's) reported distribution, obtained via a fully
        independent implementation. Edge count cross-check: 3 trees of 46
        nodes have 3*45=135 undirected edges = 270 directed edges, exactly
        matching the executor's reported "270 directed edges, 0 unmatched."
        This disconnected-tree structure is a genuine, previously-unstated
        structural fact about this specific p=4001 gate object; it does not
        contradict the executor's reported AGGREGATE histogram (which is
        what the contract's C-VELU-GATE actually requires and what SR1 gates
        on) and is offered here as bonus context, not as a defect.
      anomaly_disclosed: >-
        A first implementation of the crater-detection (leaf-pruning) step
        in this review's own code had a bug (removed vertices down to the
        EMPTY set instead of stopping at the tree center) -- caught and
        fixed by this reviewer before reporting, in the same spirit as, and
        independently of, the executor's own disclosed defect-catching. Not
        counted as a finding against the run under review; disclosed per
        AGENTS.md rule 9 (unexpected observations recorded, not discarded).
    - id: V2
      check: >-
        Independently re-derive SR2's family-construction numbers (59
        candidates: 51 f=1, 7 f=3, 1 f=107) from N=19507, and independently
        confirm #E=19507 for the t=211, p=19717 class specifically.
      method: >-
        Own from-scratch search (sympy.isprime, own fundamental-discriminant/
        conductor factoring routine, independent of harness/isogeny_class.py's
        fundamental_discriminant), over t in [-400,400] (wider than the
        executor's own [-320,320] scan, to rule out a range-choice artifact --
        the Hasse bound self-limits the admissible range to about +-282, so
        the wider scan is a superset check).
      result: >-
        CONFIRMED EXACTLY. total_candidates=59, f=1 count=51, f=3
        count=7, f=107 count=1 (t=211,p=19717,D0=-3) -- reproduces the
        executor's SR2 numbers and MATCHED-ORDER-DESIGN.md's committed
        numbers digit-for-digit, via an independently-written search.
        p+1-t = 19717+1-211 = 19507 = N, verified directly; p=19717 confirmed
        prime; D=t^2-4p=-34347=-3*107^2 confirmed directly.

