  # =====================================================================
  # Q1 -- THE PRIORITY
  # =====================================================================
  q1_answer:
    question: >-
      For the t=211, p=19717, D=-34347=-3*107^2 class, does a Frobenius-
      rational kernel (polynomial, not point) exist for the crater<->floor
      107-isogeny -- via the Elkies eigenspace/kernel-polynomial method that
      this same Coordinator used successfully on P-256 for horizontal
      isogenies, now applied at ell=107, the class's OWN CONDUCTOR (a
      vertical/volcano isogeny, not horizontal)?
    answer: KERNEL EXISTS
    confidence: high
    method_disclosure: >-
      This was NOT settled by trusting the Coordinator's framing, the
      executor's diagnosis, or any prior literature recollection alone. Two
      independent lines of evidence were produced from scratch in this
      review session and cross-checked against each other:
      (A) a general algebraic derivation from local CM-order theory
      (below), and (B) an executable, from-scratch numerical confirmation on
      a toy instance of the exact same shape (same fundamental discriminant
      D_0=-3, ell inert in O_K and exactly equal to the conductor -- p=19,
      t=1, ell=5, D=-75), verified via 5-division-polynomial factorization
      over F_19 using sympy, entirely independent of anything in
      harness/isogeny_class.py or volc_graph.py. Scripts and their output are
      reported in derivation_and_evidence below; nothing here is asserted
      without either a completed algebraic proof or an executed, printed
      computation in this session.
    derivation_and_evidence:
      - >-
        STEP 1, arithmetic re-verified independently (not merely re-quoting
        the design doc): D=t^2-4p=211^2-4*19717=-34347=-3*107^2 exactly;
        N=p+1-t=19507=19717+1-211, matching the family's own N; 107 is prime,
        squares exactly D's 107-part (v_107(D)=2), so D_0=-3, conductor
        f_pi=107 to the first power exactly -- a DEPTH-1 volcano at ell=107,
        as the contract states.
      - >-
        STEP 2, the char. polynomial of Frobenius mod 107: x^2-211x+19717
        mod 107 = x^2-104x+29 mod 107. Discriminant = 104^2-4*29 mod 107 = 0
        exactly (computed in this session, not assumed from D0*107^2's
        obvious divisibility alone -- the char-poly discriminant equals D
        itself, so this is the same fact restated, but independently
        recomputed as a cross-check). Repeated root r = 104 * inverse(2,107)
        mod 107 = 52; verified r^2 mod 107 = 29 = p mod 107 exactly. So
        Frobenius has a REPEATED eigenvalue mod 107 for EVERY curve in this
        isogeny class (crater and floor alike -- the characteristic
        polynomial of Frobenius is the same for the whole class by
        definition of "isogeny class").
      - >-
        STEP 3, is 107 split/inert/ramified in O_K=Z[(1+sqrt(-3))/2]?
        Kronecker(-3,107): 107 mod 3 = 2 (not 1), so -3 is a non-residue mod
        107, i.e. Kronecker(-3,107)=-1: 107 is INERT (unramified) in O_K.
        This is the FIRST point where the vertical case at the conductor
        prime genuinely differs from the horizontal P-256 precedent: at a
        horizontal ell (ell coprime to the conductor), inert means the WORST
        case for rational subgroups (Frobenius acts irreducibly on E[ell],
        ZERO rational lines). At the volcano's OWN conductor prime, this
        review found the opposite holds at the crater (STEP 4) -- inert here
        turns out to be the BEST case, not the worst, because the governing
        mechanism is different (repeated-eigenvalue local ring structure
        forced by ell | conductor, not the split/inert/ramified
        classification of a torsion action away from the conductor).
      - >-
        STEP 4, the CRATER (f_E=1, End(E)=O_K, the j=0 curve): because 107 is
        inert (unramified) in O_K, O_K tensor Z_107 is a DVR with residue
        field F_(107^2), and conjugation on O_K reduces mod 107 to the
        residue field's own Frobenius x->x^107. Since conductor(Z[pi])=107
        exactly, pi = pi-bar mod 107*O_K (a general fact: pi-bar-pi is
        divisible by exactly the conductor). Combining: (pi mod 107) =
        (pi mod 107)^107 in F_(107^2), i.e. pi mod 107 is FIXED by the
        residue Frobenius, i.e. pi mod 107 lies in the PRIME SUBFIELD F_107.
        Multiplication by a prime-field scalar on the 2-dimensional F_107
        vector space O_K/107*O_K (which equals E[107] as a Galois module at
        the crater) is literally SCALAR multiplication -- hence Frobenius
        acts as a SCALAR on E[107] at the crater, and EVERY one of the 108
        (=107+1) F_107-lines (order-107 subgroups) is individually
        Frobenius-stable. All 108 degree-107 isogenies from the crater are
        therefore F_p-rational, each with an individually rational kernel
        polynomial of degree (107-1)/2=53 (the standard Elkies-style object,
        obtainable as gcd(psi_107(x), h(x)) for the appropriate eigenspace
        factor h, or equivalently as one of psi_107(x)'s degree-53 rational
        factors -- this review did not need to name the exact polynomial to
        establish EXISTENCE, and existence is what Q1 asks).
      - >-
        STEP 5, generalization to ALL non-floor levels: the same local
        computation (done symbolically with a generic order O_i=Z+ell^i*O_K,
        0<=i<d, minimal-polynomial coefficients T,M of a generator omega of
        O_K, and pi=c+ell^(d-i)*k*omega with gcd(k,ell)=1) shows the
        multiplication-by-pi matrix on O_i/ell*O_i is EXACTLY c*Identity
        (scalar) whenever i<d, and becomes a genuine nontrivial Jordan block
        (nonzero off-diagonal term k) exactly when i=d (the floor, where
        O_d=Z[pi] exactly). This derivation is general -- it uses no property
        of D_0=-3 beyond "ell inert/unramified, ell exactly divides the
        conductor" -- so it is NOT an artifact of j=0's extra automorphisms.
        Consequence for the FLOOR (the 36 f_E=107 curves, generic j,
        |Aut|=2): Frobenius acts as a nontrivial Jordan block on E[107],
        meaning EXACTLY ONE of the 108 order-107 subgroups is individually
        Frobenius-stable at each floor vertex (the unique eigenline, which
        is also the unique O=Z[pi]-submodule of index 107 in O/107*O, a
        clean ideal-theoretic cross-check of the same linear-algebra fact).
      - >-
        STEP 6, DUALITY closes the argument: since crater->floor_j isogenies
        (108 of them from the crater alone) are rational, and the dual of a
        rational isogeny is rational, each floor vertex that receives at
        least one of those 108 has a rational dual edge back to the crater
        -- consistent with, and independently confirming, the "exactly one
        rational kernel per floor vertex" finding from STEP 5 via a
        completely different route (global duality vs. local ring theory).
        BOTH directions of the crater<->floor 107-isogeny therefore have at
        least one Frobenius-rational kernel. A Frobenius-rational kernel for
        the crater<->floor isogeny in this experiment's exact class EXISTS.
      - >-
        STEP 7, EXECUTABLE NUMERICAL CONFIRMATION on an exact-shape toy
        analog, run in this session (not asserted, executed): D_0=-3
        (SAME as the real class), ell=5 chosen as the smallest prime with
        ell = 2 mod 3 (Kronecker(-3,5)=-1, inert, matching ell=107's
        inertness), p=19, t=1, D=-75=-3*5^2 (depth-1 volcano, crater j=0
        with N=19 curves, floor j in {4,6} with N=19 each -- 3 isomorphism
        classes total, matching h(-3)+h(-75)=1+2=3). The 5-division
        polynomial psi_5(x) (degree 12, computed symbolically from the
        standard recursive division-polynomial formulas, independently
        coded in this session) was factored over GF(19) with sympy for all
        three curves:
          CRATER (a=0,b=10): psi_5 factors into SIX distinct rational
            quadratic factors (degree pattern [2,2,2,2,2,2]) -- ALL 6
            (=5+1) order-5 subgroups individually F_19-rational. Matches
            STEP 4's prediction exactly (crater = scalar Frobenius = all
            ell+1 kernels rational).
          FLOOR j=4 (a=1,b=4) and FLOOR j=6 (a=1,b=18): psi_5 factors as
            ONE rational quadratic factor plus ONE irreducible degree-10
            factor (degree pattern [2,10]) -- EXACTLY ONE of the 6 order-5
            subgroups is individually F_19-rational; the other 5 collapse
            into a single Frobenius orbit of length 5 (degree 2*5=10),
            consistent with a unipotent (non-diagonalizable) action fixing
            exactly one point of P^1(F_5) and cycling the rest. Matches
            STEP 5's prediction exactly (floor = Jordan block = exactly 1
            of ell+1 kernels rational).
        This is an independent, executable cross-check of the algebraic
        derivation above, on the SAME fundamental discriminant as the real
        problem, and it confirms the derivation rather than merely being
        consistent with it.
    material_correction_to_coordinator_framing: >-
      YES -- state this explicitly per the handoff's instruction. The
      a72f28b1e snapshot commit's "cross-cutting finding" calls this a
      "genuine, previously unrecorded tension in the frozen design" between
      T1 (abstractly fine per the design doc) and E2/E3's explicit-Velu
      requirement (blocked). That framing UNDERSTATES what is actually true:
      it is not merely that T1 survives "abstractly" while E2/E3's own
      explicit construction is blocked for an unrelated, deeper reason --
      rather, THE SAME KERNEL-POLYNOMIAL OBJECT THAT WOULD DISCHARGE E2/E3'S
      EXPLICIT-VELU REQUIREMENT PROVABLY EXISTS. The frozen contract's
      level_construction and transport paragraphs (specification.yaml
      inputs.within_class_arm.level_construction, inputs.t5_arm.transport)
      are not asking for something unconstructible; they are asking for
      something this harness's point-based toolkit (velu_odd,
      find_kernel_generator) cannot build. "Wrong tool, not wrong design" is
      the correct diagnosis, exactly as the handoff anticipated as one of
      the two valid outcomes.
    q1b_downstream_sufficiency: >-
      Existence of a rational kernel POLYNOMIAL is necessary but the handoff
      correctly flags it is not automatically sufficient for T1/T5's actual
      operational needs; this review addresses both, clearly labelled as
      THIS REVIEWER'S OWN derived, falsifiable predictions -- NOT as
      something EXP-VOLC-9f5571 measured, since the harness cannot currently
      construct this object at all (T1/T5 remain correctly UNREACHED in the
      reviewed run; nothing here promotes them).
      T1 TRANSPORT: sufficient in principle, via a standard, well-established
      technique (the Elkies kernel-polynomial method used throughout SEA-style
      point counting): the isogeny is computable entirely by F_p polynomial
      arithmetic (gcd/resultant operations on division polynomials), never
      requiring an explicit point in a field extension. This is not a novel
      proposal of this review; it is the standard alternative to point-based
      Velu whenever the kernel is Galois-stable but not pointwise-rational.
      Building it (degree-53 kernel polynomials at ell=107) is a genuine
      implementation gap in this harness, not a mathematical obstruction.
      T5 WALK: existence is NOT the whole story here, and this review found a
      genuinely surprising structural fact (confirmed on the toy analog, STEP
      7) worth flagging explicitly as a testable prediction for any successor
      implementation: at the crater, ALL 108 kernels are rational (many down
      edges); at EVERY floor vertex, ONLY 1 kernel is rational (a single up
      edge back to the crater) and there are NO rational floor-to-floor
      horizontal edges at ell=107 itself. The graph (once buildable) is a
      hub-and-spoke star centered at the crater, not a richly-connected
      regular graph -- reaching the crater from ANY floor vertex would take
      exactly 1 step deterministically (not a matter of walk-length
      distribution at all), and branch (ii)'s local test (count of rational
      107-isogenies from a vertex) would be a PERFECT zero-error
      discriminator (108-ish vs. exactly 1), fully consistent with, and
      considerably strengthening, the contract's own stated expectation for
      HEUR-VOLC-1 (specification.yaml t5_arm.branch_ii_locality: "a floor
      vertex has exactly one [rational isogeny]... a crater vertex has
      more"). This is stated as a prediction to be checked by an actual
      implementation, not as a result of this run or this review.
    what_would_further_settle_it: >-
      Nothing about EXISTENCE is left open by this review. What remains
      genuinely open for a FUTURE EXECUTOR task (not for this review to do):
      (a) actually implement the ell=107 kernel-polynomial construction
      (division polynomials mod the 19717-curve's coefficients, gcd against
      the Frobenius-eigenspace factor, Velu's generalized formulas for a
      degree-53 kernel polynomial) and re-run SR5/T5/T1-transport; (b)
      confirm computationally, at the real ell=107 scale, that the
      hub-and-spoke prediction (108-vs-1) holds exactly as it did at the
      toy ell=5 scale -- this review's toy check is strong corroborating
      evidence via a general, ell-independent algebraic argument, not a
      substitute for checking it at the actual parameters.

