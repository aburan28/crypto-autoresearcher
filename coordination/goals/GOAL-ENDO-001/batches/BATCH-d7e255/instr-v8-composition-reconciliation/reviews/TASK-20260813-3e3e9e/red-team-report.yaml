    REVISE the exact snapshot-bound v8 proposal before approval as a future
    executable protocol definition. The six snapshot paths, ordered source
    bytes, total 2270-leaf classification, 51-edge topology, scalar types,
    materialized canonical outputs, v5/v6 preservation fixtures, zero-authority
    values, and both quarantined mutation fingerprints independently recompute.
    Latest-entry and ordered-entry invocations also reproduce byte-identical
    resolved-contract and origin-trace artifacts. Four material static defects
    nevertheless remain. Post-snapshot custody is optional at the resolver CLI;
    both normal entry strategies return PASS without checking it. With custody
    enabled, arbitrary string-valued archive commit and parent identifiers pass,
    even when the queue and the rendered plan no longer bind the same queue.
    A fabricated three-field plan that was never produced by the dispatcher also
    passes as the canonical-plan authority. Finally, the implementation does not
    honor its declared global lowest-priority-integer rule for multi-fault inputs:
    two independently executed collisions return lower-precedence error codes.
    These are approval-blocking but additively repairable custody and error-order
    defects, so the narrow verdict is REVISE rather than FAIL.
