  objections:
    - severity: material_approval_blocker
      subject: post_snapshot_custody_is_optional
      statement: >-
        The v8 input says every post-snapshot consumer must verify custody, but
        resolver.py defaults check_custody to false. Latest-entry, ordered-entry,
        and both return status PASS and materialized canonical outputs without
        reading any of the three custody authorities.
      repairable_additively: true
    - severity: material_approval_blocker
      subject: final_commit_and_parent_are_presence_checked_not_verified
      statement: >-
        Custody checks only that queue archive.commit_sha and parent_sha are
        strings. Arbitrary 40-hex replacements pass while the plan still carries
        the old source_queue_sha256. The resolver never checks the actual Git
        object, first parent, changed paths, snapshot reachability, or queue-plan
        source binding, so the exact cd3e430/3c2afd identity is not enforced.
      repairable_additively: true
    - severity: material_approval_blocker
      subject: canonical_rendered_plan_is_not_authenticated_or_reproduced
      statement: >-
        The resolver accepts any JSON file containing a matching three-field
        archive row. A fabricated minimal file passes without dispatcher schema,
        source_queue_sha256, plan_sha256, ten gates, dispatch set, or canonical
        reproduction. The third authority therefore remains reader-supplied.
      repairable_additively: true
    - severity: material_protocol_ambiguity
      subject: declared_total_error_priority_is_not_implemented_globally
      statement: >-
        The resolver raises during local validation instead of collecting all
        predicates and choosing the smallest declared priority. Missing plus
        invalid ownership returns OWNERLESS_FIELD rather than
        PATH_DISPOSITION_MISSING; missing pointer plus edge-id drift returns
        UNRESOLVED_CONTRADICTION rather than OVERRIDE_POINTER_MISSING.
      repairable_additively: true

  required_controls:
    - control: mandatory_post_snapshot_custody
