  checks_performed:
    - id: RT-JINV-A1
      subject: strict_yaml_and_version_identity
      result: PASS
      finding: >-
        Duplicate-key-rejecting YAML parsing returned one mapping with
        experiment_id EXP-JINV-bd141d, amendment_ordinal 1, base_version 1,
