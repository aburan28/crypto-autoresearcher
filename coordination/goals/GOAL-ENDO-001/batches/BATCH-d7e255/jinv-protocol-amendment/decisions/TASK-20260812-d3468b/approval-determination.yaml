      - No D0, Aut, transport, relation-collection, ECDLP, speedup, trapdoor, exponent, closure, or breakthrough claim follows.
      - No time, memory, data, query, or cryptanalytic advantage over Pollard rho or BSGS is claimed.

  continuing_gates:
    all_version_1_terms_not_explicitly_amended:
      status: binding_unchanged
      includes:
        - controls
        - metrics and definitions
        - replication seeds and independent-instance declarations
        - stopping and invalidation rules
        - thresholds and resolution limits
        - run-validity and artifact requirements
        - success and falsification criteria
        - wall-clock, CPU, memory, and maximum-run ceilings
        - claim tier, claim ceiling, and scale boundary

    phase_b_whole_disposition_matched_null_and_detection:
      status: blocking_future_interpretation
      requirement: >-
        Before any future D0-arm or Aut-arm verdict is read, EXP-INSTR-36c8cf
        Phase B must measure both the planted-signal detection floor and the
        matched-null false-positive behavior for every statistic at all thirteen
        rows, T = 400, and the actual JINV class and r-stratum geometry. It must
        also apply the complete frozen correlated-row majority disposition to
        the matched null and report its decision-level false-positive rate;
        acceptable per-cell behavior alone does not discharge this gate.
      failed_or_missing_cell_effect: blocks_interpretation_not_a_negative_jinv_result
      amendment_repairs_this_gate: false

    baseline_identity:
      status: required_for_future_run
      requirement: >-
        Version-1 SR4 must reproduce the committed p = 4001, t = 30 baseline
        identity under targets_B at every declared factor-base row before any
        N = 19507 measurement is interpreted.

    budget_feasibility:
      status: required_before_future_execution_authorization
      hard_ceiling_wall_clock_seconds_per_run: 21600
      hard_ceiling_total_cpu_hours: 48
      hard_ceiling_memory_gb: 8
      version_1_maximum_runs_ceiling: 24
      static_nominal_m3_additions_over_2212_curves: 248628800
      static_maximum_row_target_memberships_over_three_seeds: 34507200
      arithmetic_values_are_benchmarks: false
      requirement: >-
        A separate future Executor handoff must carry a source-bound
        pre-execution cost worksheet for the exact thirteen rows, target
        memberships, support and baseline checks, Phase B, transport,
        serialization, and review overhead. It must retain the frozen stopping
        rule and the 48-CPU-hour cap. Resource exhaustion is infrastructure or
        budget evidence only and is never a null JINV result.

    n18_and_c_transport:
      status: blocking_experiment_success
      requirement: >-
        N18 must separately freeze, implement, and independently review the
        vertical ell = 107 Frobenius-eigenspace or kernel-polynomial
        construction. C-TRANSPORT-CERT must then source-pin and independently
        reverify at least one scalar-orientation-preserving same-k transport
        certificate. The numeric amendment supplies neither component and does
        not make rational-kernel existence or an ell = 5 toy analogue sufficient.

    second_matched_n_and_claim_ceiling:
      status: binding
      requirement: >-
        N = 19507 remains one toy geometry. Any future positive remains
        preliminary and unreplicated until a prospectively declared second
        matched N reproduces it. Any future negative is limited to the exact
        tested N = 19507 axis and only after every control and closure
        deliverable passes. No transfer to larger scale or to ECDLP cost is
        authorized.

