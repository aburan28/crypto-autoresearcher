  objections:
    - id: O-INSTR-V4-1
      severity: material_blocking
      subject: diagnostic_semantics_are_not_standalone_or_fully_reconciled
      statement: >-
        v4 excludes v2 and v3 inheritance but imports their diagnostics only by
        names. It leaves one explicit parent conflict unresolved (tail expectation)
        and omits the exact LOO/null construction required to make diagnostic
        reports reproducible. This violates the literal complete-standalone and
        every-material-difference gates even though diagnostics cannot change E3.
      cheapest_repair: >-
        In a new superseding amendment, define one canonical diagnostic schema:
        the exact tail expectation selected; the deterministic rule choosing the
        excluded point; all mean, sample-sd, score, sign/absolute-value, and tie
        conventions; the identical statistic simulated by the fresh null; the null
        trial count and recorded seed; the correlation-aware aggregate method or an
        exact immutable source binding; and explicit null/not-applicable values for
        rung-1 transition fields. Repeat that every output is unconditional and has
        zero state-transition authority.
      approval_blocking: true

    - id: O-INSTR-V4-2
      severity: material_blocking
      subject: sampler_and_claim_scope_restatement_is_only_a_label
      statement: >-
        The exact targets_uniform historical-reference exception, targets_B rule
        for new arms, H-ICINV-6c7920 inheritance, r-stratification, and conflict
        handling live in DEC-20260810-5aeeaa, not in the execution base v4 names.
        Generic carry-forward wording does not make a standalone contract
        executable and risks a future sampler substitution or scope inflation.
      cheapest_repair: >-
        Transcribe the five clauses verbatim into the successor amendment or bind
        the exact decision path, field, and content SHA-256, and explicitly require
        that same text in any later Executor handoff. State which SR3 family is the
        historical-reference exception and that all Phase B/JINV measurement arms
        remain targets_B.
      approval_blocking: true

    - id: O-INSTR-V4-3
      severity: material_curable
      subject: terminal_parent_T6_interpretation_has_no_explicit_disposition
      statement: >-
        v4 narrows terminal failure to non-validation of HEUR-INSTR-2 but does not
        say whether it rejects or supersedes the terminal parent's prospective
        HEUR-INSTR-4 inference. Silence is not a reconciliation-matrix disposition.
      cheapest_repair: >-
        Add an explicit row selecting the narrowest intended terminal inference.
        If no automatic HEUR-INSTR-4 inference is intended, say so. If a scoped
        inference is retained, state its exact tested boundary and required later
        review. Do not decide that empirical question from this Red Team report.
      approval_blocking: true

    - id: O-INSTR-V4-4
      severity: minor_clarity
      subject: runtime_z_and_downstream_tense
      statement: >-
        Restate runtime computation of z from 519/520 and the no-transcription
        invalidation rule. Also replace `before any JINV execution` with wording
        limited to further affected measurement or future verdict interpretation.
      approval_blocking_alone: false

  required_controls:
