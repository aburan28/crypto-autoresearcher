    dispatcher agrees with the canonical dispatcher on all 54 frozen
    policy/alias/effort/role combinations, all five v10 task handoffs, the
    unknown-policy rejection, and the below-floor rejection. A fresh -I -B
    process also observed no sys.modules object-identity, repository, tracked,
    untracked, cache, bytecode, or designated temporary-state delta around the
    ordinary positive public resolve. Every enumerated frozen malformed-input
    cell and inherited v10 matrix cell reproduced. However, the stronger claim
    that every malformed public control is normalized and adjudicated exactly
    once is false. A stateful list subclass can present latest_entry during the
    validation traversal, present bogus during tuple conversion, and receive a
    successful result whose summary contains the unsupported strategy. A list
    subclass can also execute a process-global sys.modules side effect and
    still receive success. Separately, an exact FaultFixture carrying an exact
    ResolutionFailure whose diagnostics are a two-pass list subclass passes
    validation on the first traversal and raises raw RuntimeError during the
    later merge; final adjudication is never called. These are additive,
    mechanically repairable public-boundary defects. No experiment, scientific
    result, status transition, ECDLP claim, closure, or breakthrough follows.
