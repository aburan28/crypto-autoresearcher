    - >-
      Make DiagnosticCollector.capture contain failures raised while merging a
      caught ResolutionFailure, then route them to TYPE_COERCION or
      UNRESOLVED_CONTRADICTION so one final adjudication still occurs. Freeze a
      regression cell proving that the two-pass diagnostics falsifier produces
