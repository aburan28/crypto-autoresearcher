        FaultFixture is retained. DiagnosticCollector.capture then calls
        merge_nested inside its ResolutionFailure exception handler; an
        exception raised by that merge is outside the handler's sibling
        Exception clause and escapes raw. The observed RuntimeError therefore
        has no compiled diagnostic list and zero final-adjudicator calls.
      cheapest_falsifier: >-
        An exact ResolutionFailure with a nonempty list subclass that yields a
        valid row on its first traversal and raises RuntimeError on its second.

  required_controls:
    - >-
