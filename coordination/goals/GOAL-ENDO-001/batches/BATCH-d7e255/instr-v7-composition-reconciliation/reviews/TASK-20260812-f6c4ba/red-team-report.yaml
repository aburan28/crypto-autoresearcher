  verdict: REVISE
  verdict_scope: protocol_design_integrity_only
  verdict_statement: >-
    REVISE the exact snapshot-bound v7 proposal before approval as a future
    executable protocol definition. The ordered paths, byte identities,
    exclusions, controlling v6 disposition, zero-authority boundary, and v6
    RNG fixtures independently recompute. They do not, however, define one
    executable resolver. First, v7 requires its named self-neutral snapshot
    receipt to supply final commit, parent, two-of-two custody, and an empty
    generated-path skip list, but that receipt contains null final commit and
    self-path values and no skip-list field; the missing facts are split across
    an unreferenced completed-queue archive object and a freshly rendered
    plan. Under v7's own missing-or-null rule, the positive input is invalid.
    Second, after treating the enumerated common record metadata as
    source-qualified provenance, direct prefix expansion leaves 158 parsed
    leaves in v1, v4, v5, and v6 outside any machine-readable owner prefix;
    several are executable-composition, preservation, history, or authority
    leaves. Prose scopes such as same_semantic_subject and
    each_changes_entry_field_named_by_that_entry do not map those leaves to
    resolved paths without reader judgement. Third, the positive fixture gives
    expected booleans but no exact resolved-contract or origin-trace preimage
    and digest, so the claimed latest-entry/ordered-entry equality cannot be
    independently recomputed, and several negative fixtures admit competing
    first error codes. These are material but narrowly additively repairable
    composition defects, so the verdict is REVISE rather than FAIL.
