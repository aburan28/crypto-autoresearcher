  verdict_statement: >-
    REVISE the exact four-path protocol-v4 snapshot before approval or any
    separate implementation or execution planning. The complete harness
    preflight, authenticated-native-session exception, canonical dispatch,
    terminal and current snapshot custody, structural geometry, six of the
    seven blocker-to-repair definitions, deterministic fixture arithmetic, and
    the fail-closed resource_incomplete disposition all withstand independent
    static audit. Two material protocol-integrity defects prevent the required
    unqualified PASS. First, row_order_invariance requires an
    exact_full_frozen_key but never enumerates that key, while the fixture's
    declared key grammar omits class, curve or source-record identity, rung,
    bank or nuisance direction, and Aut orientation. Distinct required records
    can therefore share one fixture key, so the ascending/descending join is not
    uniquely defined and the fixture does not test the collision. Second, the
    cost worksheet's exact-cardinality table defines
    d0_bank_row_statistic_cells as 2*20000*13*5 = 2,600,000, but the
    reference_and_outer_null_banks stage cites the same field name as 5,200,000.
    The retained-byte arithmetic uses 2,600,000, so the stage basis and the
    aggregate cannot both be the exact same cardinality. These defects are
    prospective, local, and additively repairable; custody is intact, so REVISE
    is proportional and FAIL is not.
