  material_protocol_blockers:
    - blocker_index: 1
      report_objection_id: O-JINV-PB-1
      subject: target_seed_breaks_synchronous_whole_grid_null
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The frozen null label includes target_seed, while the governing coupling
        rule requires the identical 51-class permutation at all target seeds,
        rows, statistics, trace-pair views, and nuisance views. Under the stated
        SHA-256 sorting algorithm the differing label preimages can produce
        different permutations, so both clauses cannot govern simultaneously.
      required_repair: >-
        Freeze one seed-free permutation identity per null replicate over the
        exact canonical 51 class identifiers and require byte-identical replay
        digests across every coupled view.
    - blocker_index: 2
      report_objection_id: O-JINV-PB-2
      report_subfinding: source_record_exposure_and_pairing
      subject: source_record_replacement_exposure_is_not_localized
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The 51-class weight and replacement-count formula do not state whether
        exposure is once per class, once per curve, once per target seed, or on
        an aggregate source array. They also do not freeze destination
        population, same-curve pool selection, source/destination pairing, or
        randomized-rounding scope. Unequal class sizes therefore admit
        different class-mean effects and floors under multiple text-compliant
        implementations.
      required_repair: >-
        Freeze the complete per-statistic exposure, destination, pairing,
        replacement-pool, rounding, and seed algorithm from source IDs alone.
    - blocker_index: 3
      report_objection_id: O-JINV-PB-2
      report_subfinding: liftability_unit_normalization
      subject: variable_W_is_not_normalized_to_400_target_equivalents
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The ladder denotes k replacements per 400 target equivalents, whereas
        liftable_density consumes a curve- and row-dependent prefix of length
        W. The snapshot does not choose k, k*W/400 with a frozen integer rule,
        or another exact conversion. Pool exhaustion and existing randomized
        rounding cannot supply the missing unit.
      required_repair: >-
        Freeze one exact integer W-to-400 normalization and its rounding,
        exposure, pairing, and exhaustion semantics before any planted output.
    - blocker_index: 4
      report_objection_id: O-JINV-PB-3
      subject: aut_detection_floor_has_no_aut_predicate
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The only detected-replicate predicate requires a D0 whole-grid p-value,
        an operating-row direction, and seven of thirteen rows. No executable
        Aut counterpart says how a strict-high or strict-low planted replicate
        is detected, how target seeds aggregate, or how cross-row and
        cross-statistic multiplicity is controlled.
      required_repair: >-
        Freeze a per-row, per-statistic, per-orientation Aut detection rule with
        strict-extreme tie handling, exact 1/37 reference probability, target-
        seed aggregation, and any cross-row or cross-statistic multiplicity.
    - blocker_index: 5
      report_objection_id: O-JINV-PB-4
      subject: null_false_positive_reference_bank_is_undefined
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The 20,000 whole-grid null trials are flagged by their own controlling
        family p-values, but no inner/reference bank or exact leave-one-out rule
        defines those p-values. Ranking the bank against itself, leave-one-out,
        disjoint outer and inner banks, and cross-fitting yield different
        estimators and deterministic-label requirements.
      required_repair: >-
        Freeze either an analytically justified exact leave-one-out formula or
        deterministic disjoint outer trials and inner reference banks, including
        coupling, labels, denominators, equality handling, and replay digests.
    - blocker_index: 6
      report_objection_id: O-JINV-PB-5
      subject: aggregation_pooling_nuisance_plants_and_specificity_are_incomplete
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The three target seeds have no frozen aggregation algebra; the operating
        row does not choose curve-weighted versus equal-class pooling; the
        p-rank and row-reversal nuisance plants lack the D0 plant's complete
        mechanics; and responding equally to D0 and nuisance-p has neither a
        numeric statistic nor threshold, equality rule, or explicit
        instrument_blocked consequence. These choices affect cell identity,
        floors, and the whole-grid disposition.
      required_repair: >-
        Freeze target-seed and operating-row aggregation, exact nuisance plants,
        and one quantitative intended-versus-nuisance specificity statistic
        with a predeclared pass/block threshold and equality treatment.
    - blocker_index: 7
      report_objection_id: O-JINV-PB-6
      subject: end_to_end_cost_and_artifact_volume_are_not_bound
      status: blocking_unoverruled
      overruled: false
      finding: >-
        Timing and sizing only unplanted primitive construction at three rows
        does not establish feasibility for all plant rungs and replicates,
        corrected null banks, pseudo-crater work, confidence intervals,
        replacement-map materialization, canonical serialization, disk volume,
        deterministic replay, or sharding. The unresolved exposure semantics
        also change the static cardinalities by more than an order of magnitude.
      required_repair: >-
        Bind a source-derived stage table for CPU, peak memory, disk and artifact
        bytes, mapping contexts, replay, and run or shard count at the corrected
        exact cardinalities, then apply the existing 80-percent stop to the
        complete upper estimate.
