  determination_statement: >-
    Preserve the exact version-3 Phase-B proposal, content-first snapshot,
    self-neutral receipt, and independent report unchanged, but do not approve
    the amendment or any execution derived from it. Fresh independent Red Team
    TASK-20260813-2ad661 returned REVISE for protocol-design integrity after
    confirming the snapshot custody, complete actual geometry, source hashes,
    five-statistic inventory, all thirteen rows, two D0 signs, two Aut
    orientations, resource stops, and zero-authority boundary. Those positive
    checks remain valid within their stated scope, but they do not overrule the
    report's seven material protocol blockers. The exact bytes do not yet define
    one deterministic complete Phase-B control procedure: the whole-grid null
    label contradicts the required cross-target-seed coupling; source-record
    exposure and pairing are not localized; the variable-length liftability
    vector is not normalized to the 400-target-equivalent ladder; the generic
    detection predicate is D0-specific and leaves Aut non-executable; the
    20,000-trial null reference bank is undefined; seed aggregation,
    operating-row pooling, nuisance plants, and quantitative specificity are
    incomplete; and the preflight cost gate omits the full replacement, null,
    serialization, storage, and replay volume. The defects are prospective and
    additively repairable, so the proportional disposition is REVISE rather
    than REJECT. N18/C-TRANSPORT with scalar-orientation-preserving same-k
    transport, a second matched N, and the historical two-harness-path scope
    discrepancy remain separate blockers under every outcome.

