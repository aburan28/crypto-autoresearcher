  protocol_checks:
    - id: RT-JINV-B1
      subject: exact_statistics_rows_signs_and_arms
      result: PASS_WITH_EXECUTABILITY_BLOCKERS_BELOW
      finding: >-
        The declared D0 inventory is decomposition_rate_m2,
        decomposition_rate_m3, liftable_density,
        decomposition_efficiency_m2, and decomposition_efficiency_m3 at all
        thirteen factor-base rows and both D0 signs. Efficiency is explicitly
        derived from its planted rate and receives no direct plant. The Aut
        inventory names the same five statistics where the required primitive
        pools exist at all thirteen rows and both strict_high and strict_low
        orientations. Missing or mathematically undefined cells must be
        explicit and block rather than disappear.
      direct_metric_rank_p_value_or_synthetic_output_assignment_authorized: false

    - id: RT-JINV-B2
      subject: source_level_planting_identity
      result: REVISE
      finding: >-
        The principle correctly prohibits direct assignment of a metric, rank,
        p-value, class mean, correlation, verdict, or synthetic output and
        requires actual same-curve points or x records followed by unchanged
        aggregation. But replacement_count_formula is attached to a 51-class
        weight and does not state whether floor(k*abs(weight)) is applied once
        per class, once per curve, once per target seed, or to an aggregate
        source array. The alternatives yield different class-mean effects when
        class sizes range from 8 to 80 curves, so they produce different floors.
        The same ambiguity reaches source/destination selection and pairing
        when a class contains many same-curve pools.
      actual_source_boundary_positive: true
      exposure_unit_and_pairing_frozen: false

    - id: RT-JINV-B3
      subject: liftability_ladder_unit
      result: REVISE
      finding: >-
        The ladder is denominated in primitive replacements per 400 target
        equivalents and labels 32,16,8,4,2,1 as 8,4,2,1,0.5,0.25 percent.
        liftable_density instead consumes a curve- and row-dependent prefix of
        length W. The proposal does not say whether k records, k*W/400 records,
        or another exact integer rule is replaced, and therefore does not define
        the claimed fraction or permit cross-statistic comparison of floors.
        Pool exhaustion and randomized rounding cannot resolve a missing unit.

    - id: RT-JINV-B4
      subject: synchronous_correlated_whole_grid_null
      result: REVISE
      finding: >-
        d0_whole_grid_inference requires one identical 51-class permutation at
        all thirteen rows, every statistic, and every target seed. The frozen
        deterministic label is instead
        EXP-JINV-bd141d|v3|null|rep=REP|target_seed=TARGET_SEED. Under the
        declared sha256_sort_without_replacement algorithm, different target
        seeds give different label preimages and therefore do not bind the same
        permutation. The prose coupling rule and the executable label rule
        conflict. Row-independent or seed-independent permutations cannot be
        chosen later by interpretation; the label must encode the one governing
        permutation unambiguously.
      row_independent_permutations_controlling: false
      same_seed_permutation_guaranteed_by_current_label: false

    - id: RT-JINV-B5
      subject: d0_power_familywise_multiplicity_and_floor
      result: PASS_WITH_NULL_ESTIMATOR_REVISION_REQUIRED
      finding: >-
        For one declared D0 sign, the seventh-largest signed rho across all
        thirteen retained rows, then the maximum across the five statistics,
        is a coherent correlated family statistic when driven by one synchronous
        permutation. The plus-one p-value, alpha 0.05 with equality rejecting,
        operating-row direction, at-least-seven-of-thirteen direction, 200
        plant replicates, estimated power at least 0.90, Wilson lower bound at
        least 0.80, smallest passing rung, at-or-above-32 block, and below-1
        bound are all prospectively stated. No favorable row or statistic may
        be dropped.
      multiplicity_across_five_statistics_and_thirteen_rows: present

    - id: RT-JINV-B6
      subject: complete_correlated_d0_matched_null_false_positive_rate
      result: REVISE
      finding: >-
        The proposal declares 20,000 whole-grid null trials and flags a trial
        when its controlling family p-value is at most 0.05, but it does not
        define the reference distribution used to compute each null trial's
        own p-value. Ranking each trial against the same 20,000 trials, including
        itself, makes the reported FPR largely a rank identity; leave-one-out,
        an independently labelled outer bank, and a separately generated inner
        bank give different exact p-values and Wilson flags. The complete
        correlated-null gate therefore lacks an executable nesting or
        cross-fitting rule and deterministic labels for all required banks.
      declared_wilson_upper_pass_threshold: 0.075
      declared_nominal_level: 0.05
      governing_reference_bank_frozen: false

    - id: RT-JINV-B7
      subject: aut_both_orientations_exact_pseudo_crater_and_detection_floor
      result: REVISE
      finding: >-
        The contract correctly prohibits an aggregate Aut verdict, requires
        strict_high and strict_low separately, uses all 37 pseudo-crater
        designations, treats ties as nonflags, keeps the exact 1/37 reference,
        and forbids replacing it by 0.05. That exactly bounds the static rank
        test. But detection_floor.detected_replicate_requires demands a
        controlling_whole_grid_p_value at 0.05, an operating-row statistic, and
        seven of thirteen rows: these are D0 predicates and have no defined Aut
        counterpart. The floor_definition nevertheless requires a separate Aut
        floor per statistic and orientation. No frozen rule says whether an Aut
        planted replicate is detected by strict extreme at that row, by 1/37,
        by a cross-row family, or by a seed aggregate. Hence the required Aut
        floor cannot be computed from these bytes.
      exact_pseudo_crater_enumeration_shape: PASS
      aut_floor_detection_predicate: MISSING

    - id: RT-JINV-B8
      subject: target_seed_aggregation_and_cell_identity
      result: REVISE
      finding: >-
        Three target-draw seeds remain binding, but the 13-row cell tables and
        both arm statistics do not say whether seed-level source arrays and
        statistics are pooled, averaged, tested separately, or treated as the
        200 plant replicates' substrate. The plant and pseudo-crater labels omit
        target_seed while the null label includes it. This is not harmless
        shorthand: target membership, crater rank, replacement availability,
        class means, and the complete family statistic can change with the
        aggregation rule.

    - id: RT-JINV-B9
      subject: operating_row_nuisance_directions_and_specificity_disposition
      result: REVISE
      finding: >-
        The operating row is selected before planted/null outcomes, which is a
        sound boundary, but unplanted pooled |3V|/N does not specify curve-weighted
        versus equal-class weighting across unequal class sizes. The p-rank
        plant and row reversal are mandatory yet lack the D0 plant's exact
        midrank, centered-weight, sign, source-exposure, and mapping rules.
        Finally, the prose says a statistic responding equally to intended D0
        and nuisance-p planting is not specific enough, but neither equally nor
        the resulting block is quantified in instrument_blocked. An Executor
        could therefore emit instrument_pass after a declared specificity
        failure, or choose a tolerance after seeing the response.
      no_outcome_shopping_fully_mechanical: false

    - id: RT-JINV-B10
      subject: artifacts_replay_and_budget
      result: REVISE
      finding: >-
        The artifact list is broad and the replay rule is appropriately strict,
        while resource_incomplete, failed_infrastructure, and invalid are kept
        separate from science. But the preflight sizes only unplanted primitive
        construction at three rows and does not explicitly time or size the
        replacement maps, all plant rungs and replicates, nested or cross-fitted
        null work, confidence intervals, and canonical serialization. Before
        liftability records, three seeds already imply 27,627,600 target-record
        positions over 1,771 curves and thirteen rows. If the unresolved plant
        exposure is per curve and seed, the declared three primitive plants
        imply 497,296,800 curve-row-seed-rung-sign-replicate mapping contexts
        before their replacement pairs are serialized. This is static cardinality
        arithmetic, not a timing claim, and it shows why exposure semantics and
        full artifact-size accounting must precede authorization under the
        48-CPU-hour and 8-GB ceilings.
      feasibility_demonstrated: false
      budget_exhaustion_is_scientific_evidence: false

    - id: RT-JINV-B11
      subject: stopping_invalidations_remaining_blockers_and_authority
      result: PASS
      finding: >-
        Missing cells, depleted opposite pools, source/hash/geometry drift,
        direct metric assignment, adaptive choice, timeout, crash, and budget
        exhaustion receive non-scientific terminal dispositions. N18 and the
        scalar-orientation-preserving C-TRANSPORT-CERT remain unattempted and
        blocking. A second matched N remains mandatory before broader JINV
        interpretation. The historical scope discrepancy remains uncured.
        Authorized experiment runs are zero; no source, harness, JINV, control,
        status, evidence, goal, ECDLP, closure, or breakthrough authority is
        created.

  objections:
    - id: O-JINV-PB-1
      severity: material_approval_blocker
      subject: target_seed_breaks_the_declared_synchronous_null
      statement: >-
        The null label includes target_seed while the coupling rule requires one
        class permutation shared across target seeds. Both cannot govern.
      cheapest_correction_or_falsification_route: >-
        Freeze one seed-free class-permutation label per null replicate, freeze
        the exact canonical 51 class IDs it sorts, and add a replay assertion
        that the permutation digest is byte-identical for every row, statistic,
        target seed, trace-pair view, and nuisance view.

    - id: O-JINV-PB-2
      severity: material_approval_blocker
      subject: source_record_plant_exposure_and_liftability_unit_are_unbound
      statement: >-
        Per-class and per-curve replacement interpretations are both compatible
        with the text and yield unequal class-mean effects; the W-length
        liftability vector has no exact conversion from the 400-target ladder.
      cheapest_correction_or_falsification_route: >-
        Freeze the destination population, exposure unit, seed dimension,
        randomized-rounding scope, same-curve replacement-pool selection,
        source/destination pairing, and exact W-to-400 integer normalization for
        each primitive statistic. Recompute static expected map cardinalities
        before execution.

    - id: O-JINV-PB-3
      severity: material_approval_blocker
      subject: aut_detection_floor_has_no_aut_detection_predicate
      statement: >-
        The only detected-replicate rule requires D0 whole-grid and majority-row
        predicates, so it cannot decide a single-row strict-high or strict-low
        Aut plant.
      cheapest_correction_or_falsification_route: >-
        Add an explicit per-row, per-statistic, per-orientation Aut predicate,
        including target-seed aggregation, strict-extreme tie handling, its exact
        1/37 probability, and any cross-row or cross-statistic multiplicity rule.

    - id: O-JINV-PB-4
      severity: material_approval_blocker
      subject: matched_null_fpr_reference_is_self_ambiguous
      statement: >-
        The 20,000 null trials do not have a frozen inner/reference bank rule,
        so the declared FPR may be a tautological rank of a bank against itself
        rather than a test of the complete decision procedure.
      cheapest_correction_or_falsification_route: >-
        Freeze either an exact leave-one-out formula with proof of its level or
        deterministic disjoint outer trials and inner permutation banks, with
        synchronous coupling, labels, p-value denominators, equality treatment,
        and replay digests declared before data.

    - id: O-JINV-PB-5
      severity: material_protocol_ambiguity
      subject: seed_pooling_operating_pooling_and_nuisance_gate_are_not_mechanical
      statement: >-
        Target-seed aggregation, operating-row class/curve weighting, exact
        p-rank and row-reversal plants, and the tolerance for not responding
        equally to D0 and p are unspecified even though they affect floors and
        instrument_pass.
      cheapest_correction_or_falsification_route: >-
        Freeze one aggregation algebra and quantitative specificity statistic
        with pass/block threshold, then place its failure explicitly in the
        whole-grid disposition.

    - id: O-JINV-PB-6
      severity: material_future_execution_blocker
      subject: preflight_does_not_bind_end_to_end_cost_or_artifact_volume
      statement: >-
        Measuring unplanted primitive construction at three rows does not by
        itself estimate hundreds of plant iterations, null inference, mapping
        materialization, canonical output, and deterministic replay.
      cheapest_correction_or_falsification_route: >-
        Add a source-bound stage table for CPU, peak memory, disk/artifact bytes,
        and shard/run count at the corrected exact cardinalities. Apply the
        existing 80-percent stop to the complete upper estimate, not only source
        construction.

  required_controls:
    - control: deterministic_synchronous_permutation_replay
      description: >-
        One static fixture must show the same 51-index permutation digest at all
        rows, all five statistics, all three target seeds, both signs, trace-pair
        views, p-nuisance views, and row-reversal views for each null replicate.
      experiment_runs_consumed_by_this_review: 0
    - control: source_plant_cardinality_and_pairing_fixture
      description: >-
        On one unequal-size trace-pair class and one singleton Aut crater,
        enumerate the exact destination records, replacement pools, rounding,
        pair maps, per-curve/per-class exposure, and liftability normalization
        from labels alone. This is a prospective static fixture, not permission
        to generate experimental data.
      experiment_runs_consumed_by_this_review: 0
    - control: arm_specific_detection_replay
      description: >-
        Freeze one D0 and one Aut synthetic-identity fixture made only from
        declared source IDs and demonstrate that every branch reaches exactly
        one floor/bound/block disposition without applying D0 predicates to Aut.
      experiment_runs_consumed_by_this_review: 0
    - control: full_procedure_null_calibration_design
      description: >-
        Predeclare the outer-versus-reference null construction or exact
        leave-one-out calculation and show analytically that its p-value and
        Wilson gate characterize the full correlated family decision rather
        than a marginal row or a bank ranked against itself.
      experiment_runs_consumed_by_this_review: 0
    - control: quantitative_nuisance_specificity_gate
      description: >-
        Define the intended-versus-p response statistic, both nuisance signs,
        row reversal, acceptance threshold, equality rule, and explicit
        instrument_blocked consequence before any response is visible.
      experiment_runs_consumed_by_this_review: 0
    - control: end_to_end_static_cost_worksheet
      description: >-
        Bind source construction, target memberships, all plant maps, null
        banks, pseudo-crater rows, intervals, canonical artifacts, replay, peak
        memory, disk bytes, and run/shard count to the exact corrected protocol.
      experiment_runs_consumed_by_this_review: 0

  counterexample_or_mutation: >-
    Keep every source ID and null replicate number fixed and substitute target
    seed 20260811 for 20260810 in the proposal's own whole_grid_null label. The
    UTF-8 label preimage changes, so sha256_sort_without_replacement no longer
    binds the identical class permutation that coupling_rule requires. Both
    outputs can claim compliance with a different sentence of the same frozen
    contract. A second observation-fiber collision is to apply the class weight
    once to each class versus once to every curve in that class: both use only
    actual same-curve records and the same formula, but unequal class sizes make
    their planted class means and detection floors differ. These static
    counterexamples require no control or experiment execution.

  baseline_comparison: >-
    Pollard-rho, BSGS, and specialized ECDLP baselines are inapplicable to this
    no-compute instrument-contract review. Relative to approved numeric
    amendment v1 and DEC-20260812-dd9364, the proposal materially supplies the
    required actual 51-class and 37-vertex geometry, five-statistic source-level
    plant intent, correlated family statistic, both Aut orientations, explicit
    power/FPR thresholds, artifacts, resource stops, and zero authority. It does
    not yet meet the closest baseline for an executable preregistration: one
    deterministic algorithm for every cell and disposition, with no post-source
    choice among semantically different implementations.

  heuristic_challenges:
    - >-
      HEUR-JINV-2 remains unvalidated. Actual-source replacement demonstrates
      detector response to a declared perturbation only after the perturbation
      is uniquely defined; it is not evidence that a natural D0 or Aut mechanism
      generates that perturbation.
    - >-
      Whole-class label permutation assumes exchangeability under the matched
      null, while pseudo-crater designation assumes the null rank is represented
      by designating any of the 37 actual vertices. The proposal can test these
      instrument nulls but cannot convert their eventual pass into a curve-side
      finding or a proof of natural exchangeability.
    - >-
      Replacing actual liftability records may produce a valid source-record
      perturbation without corresponding to the prefix of any real curve. Its
      ceiling is detector sensitivity to that source-level relabelling, not a
      biological or mathematical model of how an endomorphism effect arises.

  cost_model_challenges:
    - >-
      The 48-CPU-hour, 8-GB, 24-run ceilings are hard and honest, but feasibility
      is not established. The present exposure ambiguity changes the mapping
      context count by more than an order of magnitude, so no unique cost model
      exists until it is repaired.
    - >-
      The preflight's three-row primitive construction sample omits explicit
      measurement or upper bounding of replacement-map cardinality, complete
      null calibration, canonical serialization, disk volume, and replay. A
      resource_incomplete result would remain non-scientific, but predictable
      incompleteness should be caught before dispatch rather than discovered
      after partial artifact generation.

  reduction_and_scope_challenges:
    - >-
      No relation-collection cost, target descent, source recovery, scalar
      orientation, ECDLP solve, time-memory improvement, trapdoor, or exponent
      claim is under review. N18 and independently reverified same-k transport
      remain separate blockers even after a future instrument pass.
    - >-
      One N = 19507 toy geometry cannot transfer to a second N or cryptographic
      scale. A future positive stays preliminary until a prospective second-N
      replication; a future negative can close only the exact tested axis after
      every control and closure deliverable passes.
    - >-
      This REVISE is a protocol-design disposition only. It does not weaken or
      refute H-JINV-5a0b9e, validate historical JINV bytes scientifically, or
      change any experiment, hypothesis, batch, goal, evidence, source, or
      knowledge status.

  proof_architecture_challenges:
    - attack: exact_baseline_reproduction
      result: PASS
      finding: >-
        Snapshot topology, v2/v1/source hashes, 59/51/46/5/1771/2212 geometry,
        Aut 1+36 structure, and r=0-only support independently reproduce.
    - attack: observation_fiber
      result: FAIL_FOR_CURRENT_PROPOSAL
      finding: >-
        The same actual source arrays and declared weights admit per-class and
        per-curve maps with different class-mean effects and floors.
      missing_separator: exact_exposure_and_pairing_algorithm
    - attack: quantifier_order
      result: FAIL_FOR_CURRENT_PROPOSAL
      finding: >-
        The Executor can choose target-seed aggregation, liftability scaling,
        and nuisance tolerance after the source geometry is known, although the
        control claims those choices are frozen before outcomes.
    - attack: boundary_and_strictness
      result: FAIL_FOR_CURRENT_PROPOSAL
      finding: >-
        The shared detected-replicate predicate embeds D0 but not Aut, and the
        specificity warning is not embedded as an instrument_blocked boundary.
    - attack: compositional_invariant
      result: FAIL_FOR_CURRENT_PROPOSAL
      finding: >-
        Adding target_seed to the deterministic label destroys the required
        whole-grid coupling while leaving every individual permutation valid.
    - attack: method_ceiling
      result: PASS_FOR_SCOPE_ONLY
      finding: >-
        Even a corrected instrument pass can support only admissibility of the
        exact detector at this toy geometry, never a JINV or ECDLP conclusion.
    - attack: nearby_object
      result: FAIL_FOR_CURRENT_PROPOSAL
      finding: >-
        A seed-wise-permuted grid and a synchronously permuted grid are both
        accepted by different frozen clauses even though they have different
        cross-seed null covariance.

  narrowest_supported_statement: >-
    Exact snapshot commit 7cbb25bc2d5e268b2c0e71ef0a6637e377ed0a71
    with first parent 947eaf60238225f5fcc9cd12203a9a497e717b85
    durably binds the 22,700-byte Phase-B proposal and its self-neutral receipt.
    The proposal faithfully binds the actual 59-class/2,212-curve source
    geometry, the 51 conductor-1 classes and 1,771 curves, the 46 distinct
    absolute D0 values with five duplicates, the 37-vertex Aut 1+36 geometry,
    and r=0 only. It also preserves actual-source-only planting intent, all
    statistics and rows, both D0 signs, both Aut orientations, hard budgets,
    missing-cell blocks, N18/transport and second-N barriers, and zero authority.
    It does not yet define one deterministic complete Phase-B procedure, so its
    approval state must remain pending/revise and no control or JINV execution
    may rely on it.

  next_concrete_action: >-
    The Coordinator should author a new additive superseding amendment without
