  verdict: REVISE
  verdict_scope: protocol_design_integrity_only
  verdict_statement: >-
    REVISE the exact snapshot-bound v9-e9e3bf package before contract-only
    approval. The exact six-path snapshot, current bytes, v8 custody positive
    path, both resolver strategies, frozen 1,363-row payload subdigests, both
    actual-input v8 collisions, five injected cross-phase collisions, source
    priority-table drift, all 625 ordered error pairs in both insertion orders,
    and the b480/b7cb quarantines independently pass. The static self-test's
    16-row custody matrix also reports its declared winners. One material
    control-flow defect remains: the public normal resolution path calls
    load_positive_custody_bundle before entering collect_custody_diagnostics
    and outside DiagnosticCollector.capture. Missing receipt bytes therefore
    escape as FileNotFoundError, while malformed, unreachable, stale,
    wrong-parent, extra-path, hash-drifted, schema-drifted, duplicate-task, and
    topology-drifted queue authorities escape as DispatchError. The self-test
    does not exercise this path; it first loads a valid bundle, mutates the
    already parsed objects, and calls collect_custody_diagnostics directly.
    A lower-priority exception from that uncaptured loader can consequently
    escape ahead of an already-collected higher-priority diagnostic. This
    contradicts the package's collect-all-applicable and single global
    adjudicator contract. The defect is additive and mechanically repairable,
    so the narrow verdict is REVISE rather than FAIL.
