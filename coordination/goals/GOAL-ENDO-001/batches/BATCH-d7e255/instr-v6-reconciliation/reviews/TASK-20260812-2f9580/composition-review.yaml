    future executable protocol definition. V6 uniquely freezes the RNG repair
    tested by TASK-20260812-d5fe6d, but it does not uniquely compose that repair
    with v5's executable diagnostic, sampler-control, and terminal-state
    contract. A latest-amendment-only reader can lawfully follow v6's
    supersedes_for_future_execution clause while omitting mandatory v5 fields.
    An ordered additive reader retains those fields only by supplying an
    unstated composition policy and must also choose undeclared precedence
    between conflicting v5 and v6 RNG clauses. Because v6 bytes do not force
    both readers to one complete executable contract, PASS is precluded. The
    ambiguity is repairable by an additive v7 and is not irreconcilable, so the
    verdict is REVISE rather than DISSENT.
