    the observed-versus-nominal tail distinction, freezes and passes the LOO and
    seeded D5 fixture, exact-binds the five standing sampler controls, explicitly
    supersedes automatic T6/HEUR-INSTR-4 inference, and preserves the v4
    terminal-only state machine, family order, budgets, historical boundary, and
    zero authority. One deterministic-reporting blocker remains. The SHA-256 seed
    label template contains an unresolved PURPOSE token for production D2 and D6;
    only the D5 fixture supplies a concrete purpose string, `loo_null`, and that
    string does not follow the root-seed mapping-key name. D6 additionally does
    not pin the NumPy discrete bootstrap-index primitive or a raw index-buffer
    digest, has no seeded D6 output fixture, and does not state the disposition of
    a bootstrap trial whose per-row G1 has zero scale. Two implementations can
    therefore obey the stated self-normalized or whole-vector-bootstrap method yet
    derive different seeds and emit different mandatory D2/D6 reports. This is a
    curable no-compute protocol-definition defect, not scientific dissent and not
    evidence about any instrument, heuristic, curve, JINV result, or ECDLP.
