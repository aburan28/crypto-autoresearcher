  determination_statement: >-
    Preserve the exact amendment-v4/protocol-v5 proposal, its static fixture,
    exact cost worksheet, content-first snapshot and receipt, immutable v3
    lineage, and fresh independent report unchanged, but do not approve the
    amendment or any implementation, Phase B, control, instrument, JINV,
    curve-measurement, or execution activity derived from it. Fresh independent
    Red Team TASK-20260813-c9bd90 returned REVISE for protocol-design and
    custody scope. It independently reproduced the exact four-path custody,
    seventeen-slot key grammar and all fifteen applicability partitions,
    duplicate rejection, eighteen-record adversarial fixture, the positive
    repair from thirteen legacy-key collisions to zero new-key collisions, all
    seven isolated collision-dimension mutations, the corrected 2,600,000-cell
    D0 null-bank cardinality, every dependent retained-byte, I/O, shard and cap
    calculation, and the fail-closed resource_incomplete boundary. Those
    positive repairs remain valid only within the reviewed static scope. They
    do not overrule material objection O-JINV-V5-c9bd90: the fixture omits the
    raw rational density for every candidate operating row and omits a frozen
    queried-family-statistic identity and reference-population selector for the
    p-value numerator. The stored selected_operating_row and
    p_value_numerator therefore are not unique functions of frozen raw inputs.
    Changing both outputs in both order passes and recomputing their hashes
    leaves every declared collision, key-set, equality, and hash assertion
    passing. The defect is local, prospective, and additively repairable, so
    REVISE rather than FAIL is proportional. resource_incomplete remains
    controlling and non-scientific. N18, the independently reverified,
    source-pinned, same-k, scalar-orientation-preserving C-TRANSPORT-CERT, a
    second matched N, the one-N N=19507 toy ceiling, and the historical
    two-harness-path discrepancy remain separate blockers under every outcome.

