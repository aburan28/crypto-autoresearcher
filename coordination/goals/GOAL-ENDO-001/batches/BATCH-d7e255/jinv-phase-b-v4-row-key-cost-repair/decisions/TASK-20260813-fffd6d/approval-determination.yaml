  material_protocol_blockers:
    - blocker_index: 1
      report_objection_id: O-JINV-V5-c9bd90
      subject: selected_row_and_p_numerator_are_not_functions_of_raw_fixture
      status: blocking_unoverruled
      overruled: false
      finding: >-
        selected_operating_row stores only row 8's density despite candidate
        rows 4, 8 and 22, so the exact minimum-distance and smaller-row tie rule
        cannot be evaluated from raw inputs. p_value_numerator stores a count
        but does not bind the exact queried family statistic or the reference
        population selected for greater-or-equal comparison. Both objects can
        be changed in both passes and rehashed without altering any raw record
        or failing any declared comparison.
      counterexample: >-
        Leave all eighteen raw records, keys, encounter orders, per-key
        statistics, family statistic, detection floor, disposition, and zero
        collisions unchanged. In both passes replace the operating row with
        factor-base size 22 at density 8/48 and replace the p-value numerator
        with reference count 17 plus one equals 18; recompute both output hashes
        and the aggregate hash. Every declared ascending/descending equality,
        collision, key-set, and self-hash assertion still passes.
      required_repair: >-
        Freeze all candidate-row raw rational densities and the exact
        row-selection and tie algorithm. Freeze the queried family-statistic
        identity, reference-population selector, greater-or-equal comparison
        rule, equality handling, and plus-one numerator rule. Require an
        independent recomputation validator to derive both outputs from raw
        records in separately initialized ascending and descending passes and
        to reject coordinated mutations of outputs and dependent hashes.
