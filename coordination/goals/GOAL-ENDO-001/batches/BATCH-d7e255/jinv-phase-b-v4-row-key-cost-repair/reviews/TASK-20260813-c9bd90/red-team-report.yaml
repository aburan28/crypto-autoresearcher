  counterexample_or_mutation: >-
    Starting from the exact canonical fixture, leave all eighteen raw records,
    seventeen-slot keys, encounter orders, per-key statistics, family
    statistic, floor, disposition, and zero-collision count unchanged. In both
    pass objects replace the operating row by factor-base size 22 with density
    8/48 and replace the p numerator by count 17 plus one equals 18. Recompute
    their canonical hashes and the aggregate hash. The ascending and descending
    key sets remain equal, encounter hashes remain different, every named
    order-output hash is equal between passes, and every new hash matches its
    stored object. Because no raw derivation assertion fails, the current
    fixture accepts a coordinated substitute. This is a static in-memory
    counterexample only; no repository artifact or experiment was mutated.

