  objections:
    - id: O-JINV-V5-c9bd90
      severity: material_approval_blocker
      subject: two_required_order_outputs_are_not_functions_of_the_raw_fixture
      statement: >-
        The card requires selected_operating_row and p_value_numerator to be
        independently derived from the same raw records in two isolated order
        passes. The fixture stores both results twice but omits their complete
        inputs and exact derivation functions. Row selection has no density for
        every candidate factor-base row. The p-numerator has no explicit query
        statistic or reference-population selector. Equal copies and their
        hashes therefore demonstrate equality, not independent derivation.
      cheapest_falsification_result: >-
        Mutate both results in both passes, recompute those two hashes and the
        aggregate hash, and change no raw record. All declared comparison and
        self-hash assertions still pass. The frozen observable cannot
        distinguish the stored outputs from coordinated substitutes.
      relation_to_v3_objections: >-
        O-JINV-V4-2 is closed. O-JINV-V4-1's literal collision defect is closed,
        but its required independent downstream derivation is not fully closed.

  required_controls:
