  verdict_statement: >-
    REVISE the exact four-path amendment-v5/protocol-v6 snapshot before
    approval or any separate resource, implementation, or execution planning.
    Content-first custody passes. The exact positive fixture contains all
    thirteen candidate rows, one predeclared query, and 20,000 explicit unique
    full reference records. Independent exact-rational reconstruction selects
    factor-base row 8 at density 1/6 and counts 10,000 references greater than
    or equal to the query value 1/2, including exactly one equality, so the
    plus-one value is 10001/20001. Separately initialized ascending and
    descending passes agree. The public validator rejects the prior lockstep
    selected-row, p-numerator, and dependent-hash counterfeit with raw inputs
    unchanged, and its frozen self-test rejects all 122 declared mutations at
    their expected first terminals. The original raw-underdetermination in
    O-JINV-V5-c9bd90 is therefore repaired for the exact frozen positive
    object. An unqualified PASS is nevertheless unavailable because a new
    material type-alias defect remains in the public validator. Python
    structural equality treats JSON true as integer 1 and false as integer 0
    in many contract, expected-output, preserved-lineage, blocker, and
    authority comparisons. Of 45 exhaustively enumerated bool/int swaps in
    the non-raw semantic objects, 36 canonically encoded byte-distinct aliases
    are accepted. In the cheapest counterexample,
    expected_derived.selected_operating_row.row_density.numerator changes from
    integer 1 to boolean true while all raw inputs and every dependent hash
    remain unchanged; validate-only still returns pass even though that stored
    output object's canonical SHA-256 changes from 3ae73601... to 5c98f55b....
    Thus exact output-byte equality, stale-hash rejection, and exact typed
    selector/boundary preservation are not enforced. This is a local,
    prospective, additively repairable validator defect, so REVISE rather than
    FAIL is proportional. The verdict is not a JINV, ECDLP, experiment,
    scientific, research-status, closure, or breakthrough verdict.
