  determination_statement: >-
    Preserve the exact amendment-v5/protocol-v6 proposal, public validator,
    20,000-record canonical fixture, content-first snapshot and receipt,
    terminal v4 lineage, and fresh independent report unchanged, but do not
    approve the amendment or any resource, implementation, Phase B, control,
    instrument, JINV, curve-measurement, transport, N18, or execution activity
    derived from it. Fresh independent Red Team TASK-20260813-7f11a5 returned
    REVISE for protocol-design and custody scope. It independently reconstructed
    all thirteen raw candidate rows, selected factor-base row 8 at density 1/6
    in separately initialized ascending and descending passes, iterated and
    verified the exact one-record query and all 20,000 explicit unique full
    references, counted 10,000 references greater than or equal to query value
    1/2 including exactly one equality, and derived the plus-one value
    10001/20001. The public validator rejects the prior coordinated selected-row,
    p-numerator, and dependent-hash counterfeit with raw inputs unchanged and
    rejects all 122 frozen declared mutations at their expected first terminals.
    O-JINV-V5-c9bd90 is therefore closed for the exact frozen positive raw
    object. Those positive repairs do not overrule new material objection
    O-JINV-V6-7f11a5. Python structural equality treats JSON true as integer 1
    and false as integer 0 in load-bearing semantic comparisons. Exhaustive
    static attack found 36 accepted byte-distinct aliases among 45 bool/int
    swaps. Changing only
    expected_derived.selected_operating_row.row_density.numerator from integer
    1 to boolean true, while leaving all raw inputs and dependent hashes
    unchanged, changes the stored selected object's canonical SHA-256 from
    3ae73601f050c441df7367f602ed9f1a378bebcf8f90a7f1b98cd2d7bc6019e4
    to 5c98f55b2fa96707211fe23578e1d0dc0769a9e104a32028a8ecb92a79f5e772
    yet validate-only returns PASS. Exact typed output-byte equality,
    stored-output hash binding, and exact typed selector, boundary, blocker,
    and authority preservation therefore are not enforced. The defect is local,
    prospective, and additively repairable, so REVISE rather than FAIL is
    proportional. resource_incomplete remains controlling and non-scientific.
    N18, source-pinned independently reverified same-k
    scalar-orientation-preserving C-TRANSPORT-CERT, a second matched N, the
    one-N N=19507 toy ceiling, and the historical two-harness-path discrepancy
    remain separate blockers under every outcome.

