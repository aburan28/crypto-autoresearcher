  material_protocol_blockers:
    - blocker_index: 1
      report_objection_id: O-JINV-V6-7f11a5
      subject: public_validator_accepts_byte_distinct_bool_int_aliases
      status: blocking_unoverruled
      overruled: false
      finding: >-
        The strict parser preserves JSON booleans and integers as distinct
        canonical scalar types, but many semantic checks then compare nested
        Python objects with structural equality. Python treats True as equal to
        1 and False as equal to 0. Of 45 exhaustively enumerated one-at-a-time
        bool/int swaps in non-raw semantic objects, 36 byte-distinct aliases
        pass. Accepted positions include derivation target and selector fields,
