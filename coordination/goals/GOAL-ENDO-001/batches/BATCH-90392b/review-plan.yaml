review_plan:
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-90392b
  work_unit: resource-implementation-planning-gate-5-repair-and-review
  recorded_at: '2026-08-25'
  recorded_by: coordinator
  claim_scope: >-
    Reviews may change only the disposition of this fifth-generation static
    planning package. They cannot establish a JINV, ECDLP, isogeny, exponent,
    speedup, closure, breakthrough, hypothesis, goal-status, or
    resource-disposition claim.
  coordinator_prior: >-
    I expect this successor to close all five named RT-J3 objections at the
    schema level (closed enums, recursive key-equality, pinned statistical
    algorithms, closed action registry) because each objection's
    required_repair in the BATCH-718595 red-team report names an exact,
    specifiable closure. I expect the red team to still find at least one
    residual escape: the most likely candidates are (a) the new
    schedule/concurrency aggregation rule for total resource envelopes, which
    is a genuinely new compositional claim rather than a restatement, and (b)
    whether the "immutable authoritative host binding sourced from the
    runtime harness" is actually unforgeable given this repair chain has no
    real runtime harness to source it from — it may only be specifiable as a
    rule, not yet enforceable, which is itself a limitation worth surfacing
    rather than papering over. I do not expect any scientific evidence.
  prior:
    expectation: >-
      At least one scoped defect or an honestly-disclosed enforceability gap
      is likely to remain; no scientific evidence is expected.
    decision_if_overturned: >-
      If both reviewers find the package clean, record that surprise
      explicitly and keep resource_incomplete fail-closed; if either finds a
      defect, preserve it without outvoting it.
  joints:
    - id: J1J2-continuity-undisturbed
      owner_task_id: TASK-20260825-0d566b
      assigned_to: TASK-20260825-0d566b
      question: >-
        Does this successor leave the already-PASSED BATCH-718595 J1
        (preservation/authorization closure) and J2 (RC-1 custody continuity)
        material completely untouched, unedited, and unreopened, and does it
        avoid silently reintroducing any of the seven now-closed BATCH-005931
        J3 defects into the J1/J2-owning files?
      worked_attack_plan:
        - Diff this batch's snapshot commit against BATCH-718595's snapshot commit and confirm zero bytes changed under TASK-20260824-d7f960/.
        - Re-check the 18 obligation references and OBD-1 open status are still bound exactly as BATCH-718595's validator confirmed them.
        - Test a same-heading planted-authorization mutation against the new package and require rejection, exactly as the BATCH-718595 controls did.
    - id: J3-fifth-generation-closure
      owner_task_id: TASK-20260825-306cc8
      assigned_to: TASK-20260825-306cc8
      question: >-
        Do the closed operation-effect-class enum and authoritative host
        binding, the recursive PB-3 schema and resource composition, the
        executable CT-1 through CT-5 semantics, and the closed
        dependent-action registry remove RT-J3-O8 through RT-J3-O12 without
        opening a new procedural escape?
      worked_attack_plan:
        - Attempt the exact RT-J3-O9 counterexample against the new package (merge_pass_bytes nested inside merge_model) and require STOP.
        - Attempt the exact RT-J3-O8 counterexample (a caller-shaped active host binding matching a caller-supplied observation) and require STOP because the binding must be read from the immutable runtime-session-receipt.json, not the observation package.
        - Instantiate CT-3's interval algorithm and CT-5's signedness rule from the pinned formulas by hand on at least one worked numeric example and confirm the schema is unique (two independent readings cannot diverge).
        - Request a dependent action outside the closed enum (e.g. "audit_readback") while PB-3 state is unknown and require a global STOP before dispatch.
        - Rerun the full existing 81-control matrix plus the five new named controls (nested-PB3 escape, zero-baseline CT-4, CT-5 signedness, unlisted-action, host-binding forgery) as static construction-level fixtures and record every outcome against its expectation.
        - Evaluate whether the "authoritative host binding" is actually enforceable in a package with no live runtime harness, or is only a specifiable rule; if the latter, require this limitation to be stated explicitly rather than presented as closed.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - tools/research_dispatch.py
      - experiments/EXP-JINV-bd141d/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-718595/
      - coordination/goals/GOAL-ENDO-001/batches/BATCH-005931/
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-0d566b/
        - coordination/goals/GOAL-ENDO-001/batches/BATCH-90392b/reviews/TASK-20260825-306cc8/
    attestation_required: >-
      Each reviewer states exactly what it read, confirms it did not read the
      sibling report, and discloses policy/model provenance. Independence is
      a fresh session and disjoint context, not a distinct-model quorum.
  proves_too_much:
    required: true
    assigned_to: TASK-20260825-306cc8
    objects:
      - same-heading package with the operation effect-class enum omitting the non-host value
      - same-heading package with an unlisted dependent-action label routed around global STOP
      - same-heading package with a caller-supplied host binding not sourced from the runtime-session-receipt
    construction: >-
      Review the argument against objects where its claimed fail-closed
      boundary is deliberately false. Accepting any object is a review-method
      failure and forces REVISE or FAIL.
  blind_rederivation:
    required: false
    reason: >-
      No new numeric baseline or cost quantity is introduced by this batch;
      the frozen RC-1 baseline and factor cases were already blindly
      rederived and PASSED in BATCH-718595's validator report
      (VAL-20260824-9eeff7) and are not reopened here. TASK-20260825-0d566b
      instead re-verifies non-disturbance of that already-passed material
      (see joint J1J2-continuity-undisturbed).
  procedure_deviations: []
  expected_outputs:
    - independent validator report with scoped PASS, REVISE, or FAIL on J1J2-continuity-undisturbed
    - independent red-team report with scoped PASS, REVISE, or FAIL on J3-fifth-generation-closure
    - final Coordinator decision composing both joints without outvoting dissent
