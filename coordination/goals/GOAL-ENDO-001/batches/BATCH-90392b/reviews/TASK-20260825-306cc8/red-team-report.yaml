  proves_too_much:
    required: true
    assigned_to: TASK-20260825-306cc8
    objects:
      - id: PTM-1
        description: >-
          Same-heading package with the operation effect-class enum omitting
          the non-host value (none_no_host_effect removed from the enum).
        known_false_basis: >-
          Without none_no_host_effect, requested_action=inspect_static has no
          legal effect-class value. This is the exact RT-J3-O8 defect the
          predecessor found: the non-host branch is not canonically
          representable and STOPs by schema rejection rather than selecting a
          canonical path.
        argument_tested: >-
          Does the v5 closure's argument (that the enum is closed and
          inspect_static resolves canonically) still hold for this object?
        result: rejected
        v5_basis: >-
          The v5 closure's own rules detect the omission:
          operation_effect_class.derivation says "if: requested_action ==
          inspect_static, operation_effect_class: none_no_host_effect", but
          closure_rule: exact_enum_membership_required with
          unknown_or_missing_value: STOP would STOP because
          none_no_host_effect is absent from the enum. The closure's argument
          does NOT go through for this known-false object; it correctly
          detects the defect.

      - id: PTM-2
        description: >-
          Same-heading package with an unlisted dependent-action label routed
          around global STOP (the global STOP does not apply to the unlisted
          label).
        known_false_basis: >-
          This is the exact RT-J3-O12 defect: a caller can satisfy the tested
          global list while routing the same unknown PB-3 state through an
          unlisted action, bypassing global STOP.
        argument_tested: >-
          Does the v5 closure's argument (that global STOP dominates every
          dependent action and unknown labels STOP before dispatch) still
          hold for this object?
        result: rejected
        v5_basis: >-
          The v5 closure's own rules detect the bypass:
          global_stop_v2.applies_to: dependent_action_registry_v2.enum (the
          closed 14-member set), and unknown_action_label:
          STOP_before_dispatch. An unlisted label is not a member of the
          enum, so it STOPs before dispatch regardless of whether global STOP
          "applies to" it. The closure's argument does NOT go through for
          this known-false object; the unlisted label cannot be routed around
          STOP.

      - id: PTM-3
        description: >-
          Same-heading package with a caller-supplied host binding not sourced
          from the runtime-session-receipt (the binding is read from the
          caller's host_observation object instead).
        known_false_basis: >-
          This is the exact RT-J3-O8 defect: a future consumer can make the
          active binding caller-shaped and satisfy the equality check with a
          self-consistent but untrusted host observation.
        argument_tested: >-
          Does the v5 closure's argument (that the binding is sourced
          exclusively from the immutable runtime-session-receipt.json) still
          hold for this object?
        result: rejected
        v5_basis: >-
          The v5 closure's own rules detect the forgery:
          caller_input_is_never_authoritative: true, forbidden_source:
          host_observation object supplied by the caller/consumer, and
          binding_rule_v2: "Equality against any other source (including a
          caller-declared 'active binding' field) is rejected." The closure's
          argument does NOT go through for this known-false object; a
          caller-supplied binding is rejected by the sourcing rule.
    overall_result: >-
      All three known-false objects are rejected by the v5 closure's own
      rules. The argument does not survive any object where its claimed
      fail-closed boundary is deliberately false. The proves-too-much control
      passes.

  objections:
    - id: RT-J3-O8
      severity: material
      class: applicability_schema_and_binding_provenance
      status: closed_at_schema_level_with_disclosed_limitation
      locus: >-
        operation_schema_v2.operation_effect_class and
        operation_schema_v2.host_binding
      finding: >-
        The v5 closure addresses both halves of RT-J3-O8. (1) The
        operation_effect_class enum now includes none_no_host_effect as an
        explicit non-host value (6 members: 5 host + 1 non-host), with
        closure_rule: exact_enum_membership_required and
        unknown_or_missing_value: STOP. requested_action=inspect_static
        resolves deterministically to none_no_host_effect via the derivation
        table, closing the "no legal non-host effect-class value" gap. (2)
        The host binding is sourced exclusively from
        runtime-session-receipt.json's host_binding.* fields, with
        caller_input_is_never_authoritative: true and binding_rule_v2
        rejecting equality against any source other than the receipt. This
        closes the "does not define the source, authority, immutability, or
        canonical identity of that binding" gap at the schema level.
      residual_limitation: >-
        The authoritative host binding is a SPECIFIABLE RULE, not an enforced
        closure. The actual runtime-session-receipt.json has no
        host_binding.* fields (only a note explaining their absence), so the
        validity check STOPs as unevaluable. Whether a future runtime harness
        emits host_binding.* under its own authority is a property of that
        harness, not of this schema. This limitation is explicitly disclosed
        in operation_schema_v2.host_binding.limitation and known_limitations,
        and is the one residual gap the completion gate explicitly allows
        ("no unresolved schema gap other than the disclosed harness-binding
        limitation").
      required_repair_met: true
      control_evidence:
        - KF-MAT-NO-OBS (4 mutations): STOP
        - KF-HOST-MALFORMED (7 mutations): STOP
        - KF-HOST-BINDING-FORGERY: STOP
        - PTM-1 (enum omitting non-host value): rejected
        - PTM-3 (caller-supplied host binding): rejected

    - id: RT-J3-O9
      severity: material
      class: pb3_closed_schema_escape
      status: closed
      locus: >-
        repair.pb3_v2.model_v2.nested_schemas and
        repair.pb3_v2.formula_operand_closure
      finding: >-
        The v5 closure addresses all of RT-J3-O9. The PB-3 schema is now
        fully recursive: every nested model key (serialization_model,
        merge_model, residual_artifact_grouping, unit_conversions,
        conservativeness_basis) has its own closed key/value schema with
        unknown_key_at_this_level: STOP at each nesting level. The
        formula_operand_closure registers every formula operand
        (retained_terms, residual_artifact_bytes, individual_artifact_terms,
        read_bytes, write_bytes, replay_bytes) with explicit type, unit, and
        cap binding. The closure_rule states no formula may consume an
        operand absent from the registry. The exact RT-J3-O9 counterexample
        (merge_pass_bytes nested inside merge_model) is explicitly STOPped by
        the unlisted_nested_term_rule. The residual_artifact_grouping
        requires residual_key to equal residual_artifact_bytes, closing the
        "does not name the residual key" gap. The merge_model's
        merge_pass_bytes_bound_to enum (allowed: [logical_io_bytes]) with
        double_count_guard (allowed:
        [merge_output_excluded_from_retained_terms]) closes the
        "non-conservative conversion inside merge_model" gap.
      required_repair_met: true
      control_evidence:
        - KF-PB3-EXTRA: STOP
        - KF-PB3-UNKNOWN-CAP (2 mutations): STOP
        - KF-PB3-NESTED-ESCAPE: STOP
        - PTM-1: rejected (indirectly, via recursive key-equality)

    - id: RT-J3-O10
      severity: material
      class: canonical_control_statistics
      status: closed
      locus: >-
        repair.control_semantics_v2.per_record_schema,
        per_ct_event_predicates, interval_algorithm_CT3, bootstrap_pin,
        CT4_definition, CT5_definition
      finding: >-
        The v5 closure addresses all of RT-J3-O10. A complete per-record
        schema (ct_trial_record.v1) is defined with trial_id, pair_key, seed,
        signal_value, null_value, is_duplicate, and event fields, plus
        duplicate_identity_key: [pair_key, seed]. Per-CT event predicates
        are defined for CT-1 through CT-5. CT-3's interval algorithm is named
        to one specific closed-form construction
        (clopper_pearson_log_ratio_95_CI) with endpoints defined via
        Beta-distribution quantile inversion and explicit boundary
        conventions. The bootstrap pins PRNG (PCG64), resampling unit (one
        paired trial row), index/duplicate handling, percentile interpolation
        (linear), and decimal arithmetic (decimal128_or_higher). CT-4 defines
        wall_rate as inputs_processed / wall_seconds with wall_seconds > 0
        required, plus cpu_seconds_baseline > 0 and wall_seconds_baseline > 0
        required. CT-5 defines destroyed_effect and destroyed_null_effect as
        explicitly signed quantities with predicate_operates_on:
        signed_value_not_absolute_value. I instantiated CT-3's interval
        algorithm and CT-5's signedness rule by hand on worked numeric
        examples and confirmed the schema is unique: two independent readings
        cannot diverge because the rules pin one interpretation
        deterministically.
      required_repair_met: true
      control_evidence:
        - KF-CT-BOUNDARY (19 fixtures): all expected classifications
        - KF-CT4-ZERO-BASELINE (2 variants): STOP
        - KF-CT5-SIGNEDNESS: signed reading accepted, absolute rejected
        - CT-3 hand-instantiation: unique, deterministic
        - CT-5 hand-instantiation: unique, signedness pinned

    - id: RT-J3-O11
      severity: material
      class: resource_envelope_composition
      status: closed
      locus: >-
        repair.resource_composition_v2.per_ct_formulas,
        aggregation_rule, total_bootstrap_resamples_cap,
        host_demand_inequalities
      finding: >-
        The v5 closure addresses all of RT-J3-O11. Per-CT formulas are
        defined for CT-1 through CT-5, mapping raw record count and bootstrap
        resamples to bytes/CPU/wall/memory/disk/logical_io. The aggregation
        rule states its schedule/concurrency model in words (sequential
        within a control, concurrent across controls up to max_concurrent=2)
        and defines per_control_to_total mappings for bytes, disk, logical_io,
        cpu, wall, and memory. The total_bootstrap_resamples_cap is 40000 (4
        bootstrap-using controls x 10000) with violation: STOP. Host demand
        inequalities compare host free_disk_bytes and memory_bytes against
        predicted demand with violation: STOP. The memory_bytes_total is the
        peak concurrent demand (sum of the two largest per-control memory
        values), which is correct for a concurrent schedule. The CPU total is
        schedule-independent (sum), which is correct.
      observation_non_blocking: >-
        The wall_seconds_total formula ceil(sum(wall_seconds) /
        max_concurrent) is an idealized perfect-packing lower bound that can
        underestimate actual wall time for uneven control durations (e.g.,
        one 100s control and four 1s controls: formula gives 52s, actual
        schedule gives 102s). This is a non-conservative direction for a
        planning estimate. However, it is not a blocking defect because: (1)
        the formula is explicitly stated, not hidden; (2) wall_seconds_total
        is not used in the host_demand_inequalities (only disk and memory are
        checked against host observation); (3) the total wall_seconds_max cap
        (21600 from the predecessor manifest) still applies with exhaustion:
        STOP; (4) this is a static planning gate, not an execution; (5) the
        estimated total (~43s) is far below the cap (21600s). The
        coordinator_prior predicted this as a possible residual escape; it is
        noted here but does not open a hidden path to work.
      required_repair_met: true
      control_evidence:
        - KF-RESOURCE-EXHAUSTION: all expected classifications
        - total_bootstrap_resamples_cap: 40000, violation STOP
        - host_demand_inequalities: disk and memory, violation STOP

