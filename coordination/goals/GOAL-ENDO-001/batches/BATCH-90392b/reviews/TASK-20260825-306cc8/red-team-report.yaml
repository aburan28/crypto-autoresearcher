      (see control_rerun_assessment below); this is a predecessor-accounting
      gap, not a v5 testing gap.

  worked_attack_plan_results:
    - item: 1
      attack: >-
        Attempt the exact RT-J3-O9 counterexample (merge_pass_bytes nested
        inside merge_model) against the new package and require STOP.
      construction: >-
        Preserve the exact PB-3 top-level allowed_terms and allowed_caps key
        sets, then place an unlisted merge_pass_bytes term as a key under
        repair.pb3_v2.model_v2.merge_model while keeping the top-level key
        set exact. This is the exact counterexample from the predecessor
        red-team report (RT-J3-O9 counterexample_or_mutation).
      expected: STOP
      observed: STOP
      v5_basis: >-
        pb3_v2.model_v2.nested_schemas.merge_model declares
        required_keys: [merge_pass_count, merge_pass_bytes_bound_to,
        double_count_guard] and unknown_key_at_this_level: STOP. The
        unlisted_nested_term_rule explicitly states: "Any key under
        merge_model other than merge_pass_count, merge_pass_bytes_bound_to,
        and double_count_guard is an unbound_nested_field and STOPs, closing
        the RT-J3-O9 counterexample_or_mutation of hiding merge_pass_bytes
        or a conversion inside merge_model." The key merge_pass_bytes is not
        one of the three allowed keys, so it is rejected at the nesting
        level, not only at the top level.
      result: rejected_known_false_input

    - item: 2
      attack: >-
        Attempt the exact RT-J3-O8 counterexample (caller-shaped active host
        binding matching a caller-supplied observation) and require STOP
        because the binding must come from the immutable
        runtime-session-receipt.json, not the observation package.
      construction: >-
        Supply a caller-shaped host_observation object whose host_id,
        filesystem_id, and filesystem_mount are internally self-consistent
        and match a caller-declared "active binding" field, but do not match
        this task's runtime-session-receipt.json host_binding.* fields. This
        is the exact counterexample from the predecessor red-team report
        (RT-J3-O8 finding and applicability counterexample).
      expected: STOP
      observed: STOP
      v5_basis: >-
        operation_schema_v2.host_binding.binding_rule_v2 states: "Equality
        against any other source (including a caller-declared 'active
        binding' field) is rejected." caller_input_is_never_authoritative:
        true. forbidden_source: host_observation object supplied by the
        caller/consumer. Additionally, the actual runtime-session-receipt.json
        produced by this task contains no host_binding.host_id,
        host_binding.filesystem_id, or host_binding.filesystem_mount fields
        (only a note explaining their absence). Per missing_receipt_field:
        STOP and receipt_field_absent_handling, the validity check itself is
        unevaluable and STOPs; no fallback host source is substituted. The
        caller-shaped binding is therefore rejected twice over: once by the
        sourcing rule (caller input is never authoritative) and once by the
        missing-receipt STOP (the authoritative source is absent).
      result: rejected_known_false_input

    - item: 3
      attack: >-
        Instantiate CT-3's interval algorithm and CT-5's signedness rule
        from the pinned formulas by hand on at least one worked numeric
        example and confirm the schema is unique (two independent readings
        cannot diverge).
      ct3_worked_example: >-
        CT-3 construction: clopper_pearson_log_ratio_95_CI. Inputs: k1=500
        signal events out of n1=1000, k2=500 null events out of n2=1000.
        Step 1: For k1=500, n1=1000, compute Clopper-Pearson 95% CI via
        Beta-distribution quantile inversion: p1_lo = BetaInv(0.025; 500,
        501), p1_hi = BetaInv(0.975; 501, 500). By normal approximation for
        large n at p=0.5, this is approximately [0.469, 0.531]. Step 2: For
        k2=500, n2=1000, identically p2_lo approx 0.469, p2_hi approx 0.531.
        Step 3: Ratio CI = [p1_lo/p2_hi, p1_hi/p2_lo] = [0.469/0.531,
        0.531/0.469] = [0.883, 1.132]. Step 4: CT-3 predicate from
        control-formula-manifest.yaml: null_event_count >= 20 AND CI.lower
        >= 0.80 AND CI.upper <= 1.25. Here k2=500 >= 20 (pass), CI.lower
        = 0.883 >= 0.80 (pass), CI.upper = 1.132 <= 1.25 (pass) ->
        PASS_CONTROL_ONLY. Boundary check: k2=19 -> null_event_count=19 <
        20 -> STOP (matches denominator-19 fixture). k2=0 ->
        denominator_zero: STOP (matches denominator-0 fixture). The
        construction names a specific closed-form (Clopper-Pearson exact
        binomial via Beta-distribution quantile inversion) with explicit
        endpoint formulas (p_lo = BetaInv(0.025; k, n-k+1), p_hi =
        BetaInv(0.975; k+1, n-k)) and boundary conventions (k=0 -> p_lo=0,
        k=n -> p_hi=1). Two independent readers applying this construction
        to the same (k1, k2, n1, n2) compute the same endpoints
        deterministically. The schema is unique.
      ct5_worked_example: >-
        CT-5 construction: signedness rule. Inputs: destroyed_effect = -0.01
        (signal-destroyed stratum mean of signal_i - null_i), destroyed_null
        _effect = +0.02 (baseline stratum mean). point_estimate =
        destroyed_effect - destroyed_null_effect = -0.01 - 0.02 = -0.03
        (signed). Suppose bootstrap CI = [-0.015, 0.01] (signed). CT-5
        predicate from control-formula-manifest.yaml: CI.lower >= -0.02 AND
        CI.upper <= 0.02 AND point_estimate <= 0.02. SIGNED reading:
        CI.lower = -0.015 >= -0.02 (pass), CI.upper = 0.01 <= 0.02 (pass),
        point_estimate = -0.03 <= 0.02 (pass) -> PASS_CONTROL_ONLY.
        ABSOLUTE reading (the forbidden one): abs(point_estimate) = 0.03 <=
        0.02 (FAIL) -> STOP_NO_VANISHING_EFFECT_CLAIM. The signed and
        absolute readings DIVERGE: signed says PASS, absolute says STOP.
        The v5 schema's CT5_definition.signedness_rule explicitly states:
        "point_estimate = destroyed_effect - destroyed_null_effect is
        retained signed through comparison against CI.lower and CI.upper; an
        absolute value is never substituted for point_estimate or for the CI
        bounds." predicate_operates_on: signed_value_not_absolute_value.
        Only the signed reading is accepted; the absolute reading is
        forbidden. Two compliant consumers cannot diverge because the rule
        pins one interpretation. The schema is unique.
      expected: schema_is_unique
      observed: schema_is_unique
      result: review_method_control_holds

    - item: 4
      attack: >-
        Request a dependent action outside the closed enum (e.g.
        "audit_readback") while PB-3 state is unknown and require a global
        STOP before dispatch.
      construction: >-
        Request dependent action label "audit_readback" (not a member of
        dependent_action_registry_v2.enum) while PB-3 state is unknown
        (unknown_tokens include null, UNKNOWN, unknown, unavailable, invalid,
        nonfinite, unevaluable).
      expected: STOP_before_dispatch
      observed: STOP_before_dispatch
      v5_basis: >-
        dependent_action_registry_v2.unknown_action_label: STOP_before_dispatch.
        global_stop_v2.triggers includes "dependent action label not a member
        of dependent_action_registry_v2.enum". global_stop_v2.applies_to:
        dependent_action_registry_v2.enum (the closed 14-member set).
        global_stop_v2.effects: all_dependent_actions: STOP. The label
        "audit_readback" is not among the 14 enum members (fit, pass,
        resource_approval, materialization, schedule, dispatch,
        implementation, disposition, control_execution, instrument_execution,
        measurement, interpretation, envelope_admission,
        authorization_transition), so it STOPs before dispatch. The
        control-rerun-v5.yaml KF-UNLISTED-ACTION control tests the same rule
        with "recompute_estimate" and observes the same STOP.
      result: rejected_known_false_input

    - item: 5
      attack: >-
        Rerun the full existing 81-control matrix plus the five new named
        controls (nested-PB3 escape, zero-baseline CT-4, CT-5 signedness,
        unlisted-action, host-binding forgery) as static construction-level
        fixtures and record every outcome against its expectation.
      expected: all_expected_classifications_reproduced
      observed: all_expected_classifications_reproduced
      result: review_method_control_holds
      detail: see control_rerun_assessment below

    - item: 6
      attack: >-
        Evaluate whether the "authoritative host binding" is actually
        enforceable in a package with no live runtime harness, or is only a
        specifiable rule; if the latter, require that limitation to be
        stated explicitly rather than presented as closed.
      assessment: >-
        The authoritative host binding is a SPECIFIABLE RULE, not an enforced
        closure. The actual runtime-session-receipt.json produced by this
        task contains no host_binding.host_id, host_binding.filesystem_id,
        or host_binding.filesystem_mount fields; it contains only a note
        explaining their absence and pointing to the disclosed limitation.
        The schema's missing_receipt_field: STOP correctly makes the
        validity check unevaluable (STOP) in the absence of these fields,
        which is the correct fail-closed behavior, but it means no host
        binding is actually validated. Whether a future runtime harness
        emits host_binding.* under its own authority, tamper-resistant and
        outside caller control, is a property of that harness, not of this
        schema. This limitation IS stated explicitly in the v5 package:
        operation_schema_v2.host_binding.limitation_disclosed: true, with a
        full LIMITATION block (lines 111-127 of j3-closure-v5.yaml) stating
        "this closure is therefore a SPECIFIABLE RULE pending an attached,
        verified runtime harness... it is not yet a fully enforced closure
        in the absence of such a harness. This gap is explicitly carried
        forward and not presented as closed." It is also restated in
        known_limitations (lines 467-474). The producer followed the
        contract constraint (dispatch_queue.json line 74): "Explicitly flag,
        rather than silently resolve." This is honest disclosure, not
        papering over.
      result: limitation_disclosed_not_presented_as_closed

  control_rerun_assessment:
    reran_81_control_matrix:
      - family: KF-MAT-NO-OBS
