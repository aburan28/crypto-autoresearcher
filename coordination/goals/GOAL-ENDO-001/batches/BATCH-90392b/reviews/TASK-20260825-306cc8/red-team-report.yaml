      new named controls were re-evaluated as static construction-level
      fixtures; (6) the enforceability of the authoritative host binding was
      assessed against the actual runtime-session-receipt.json. The
      proves-too-much control was run against all three known-false objects.
      This attacks the written boundary directly and does not reproduce the
      validator's assigned blind RC-1 arithmetic custody derivation.
    producer_code_executed: false
    experiment_runner_invoked: false
    target_or_curve_accessed: false
    network_used: false
    static_control_count: 81
    static_control_result: >-
      All 81 declared known-false and edge cases in the predecessor report's
      named families, plus the five new named controls, produced their
      expected STOP, PASS-at-inclusive-boundary, or admissible-equality
