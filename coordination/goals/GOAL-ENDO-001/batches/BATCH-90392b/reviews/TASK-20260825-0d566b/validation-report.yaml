      verdict is issued. The disclosed host-binding enforceability limitation
      and the 81-control count reconciliation anomaly are J3 matters owned by
      the red-team sibling and are not adjudicated here.
    - >-
      The exact serving model identifier is not exposed by this task
      interface. The runtime receipt records resolved_model_id as
      zai/glm-5.2 and model_verified false rather than inventing or
      probe-verifying an identifier; this session honored the requested
      review-adversarial policy without fallback or degradation and did not
      run a model probe.
    - >-
      The byte-identity check rests on Git object identity (commit ancestry
      and empty diff) rather than a separate hash registry for the
      TASK-20260824-d7f960 files, because the BATCH-718595 snapshot receipt
      did not record per-file hashes for those three files (it recorded the
      preservation-manifest source hash and the BATCH-005931 producer hashes).
      Git's content-addressed object store provides the byte-identity
      guarantee directly: an empty diff between two commits for a path means
      the blob object IDs are identical.
    - >-
      No experiment, control run, target/curve access, JINV work, transport
      work, N18 work, status transition, ledger edit, queue edit, or commit
      was performed by this validator.
