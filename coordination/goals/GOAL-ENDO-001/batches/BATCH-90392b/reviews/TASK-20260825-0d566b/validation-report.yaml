        J3 defects themselves (which is the red team's joint, not this one).
  control_checks:
    - control: KF-J1J2-PLANTED-AUTHORIZATION
      mutation: >-
        Constructed a deep in-memory copy of j3-closure-v5.yaml's
        authorization_boundary block (the same heading structure) and set
        implementation_authorized: true, experiment_runs_authorized: 1, and
        resource_disposition: ready. No repository file was written; no code
        was executed; no experiment runner was invoked. This is a static
        review-method control exactly analogous to BATCH-718595's
        KF-J1-PLANTED-AUTHORIZATION control.
      expected: reject_forbidden_authorization_boundary
      result: REJECTED_BY_REVIEW_RULE
      method_note: >-
        The mutated boundary violates the package's fail-closed invariants.
        j3-closure-v5.yaml dependent_action_registry_v2.global_stop_v2.effects
        requires authorization: unchanged_false_or_zero, and the
        authorization_boundary itself requires every field to be false or
        zero with resource_disposition: resource_incomplete and
        gates_cleared: 0. A value of implementation_authorized: true (or
        experiment_runs_authorized: 1, or resource_disposition: ready)
        violates every_authorization_false_or_zero and triggers STOP. The
        known-false object is correctly rejected. An argument that ACCEPTED
        this known-false object would be wrong (proves-too-much principle);
        the package's fail-closed boundary does not accept it. No repository
        checker pass is claimed.
      proves_too_much_assessment: >-
        This is the required proves-too-much control for this joint: the
        argument (fail-closed authorization boundary) is run against an object
        for which its conclusion is KNOWN FALSE (a package that grants
        authorization). The argument correctly rejects the known-false
        object, so the control holds. Accepting it would have forced REVISE
        or FAIL.
