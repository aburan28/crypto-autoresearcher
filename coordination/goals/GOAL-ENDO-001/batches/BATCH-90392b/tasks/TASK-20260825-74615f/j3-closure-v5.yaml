schema: crypto-autoresearch.static_j3_global_stop_repair.v2
repair:
  id: TASK-20260825-74615f-j3
  task_id: TASK-20260825-74615f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-90392b
  predecessor_batch: BATCH-718595
  predecessor_task: TASK-20260824-efdcc2
  closes_objections: [RT-J3-O8, RT-J3-O9, RT-J3-O10, RT-J3-O11, RT-J3-O12]
  controlling_decisions: [DEC-20260824-4a4dbc]
  status: additive_static_successor_pending_review
  experiment_id: null
  experiment_runs_authorized: 0
  experiment_runs_executed: 0
  scientific_result: false
  scientific_conclusion: null
  additive_note: >-
    This file adds fields on top of, and does not edit, replace, or
    reinterpret, TASK-20260824-efdcc2/j3-global-stop-repair.yaml or
    TASK-20260824-efdcc2/control-formula-manifest.yaml. Both predecessor
    files remain the frozen, immutable, read-only base. Where this file
    restates a predecessor value (e.g. global_stop.applies_to) it is a
    literal copy for closure purposes, not a correction.

  authorization_boundary:
    implementation_authorized: false
    phase_b_authorized: false
    control_runs_authorized: 0
    instrument_runs_authorized: 0
    target_or_curve_access_authorized: false
    jinv_work_authorized: false
    transport_work_authorized: false
    n18_authorized: false
    scientific_interpretation_authorized: false
    hypothesis_status_change_authorized: false
    experiment_status_change_authorized: false
    goal_status_change_authorized: false
    resource_disposition_change_authorized: false
    closure_authorized: false
    breakthrough_authorized: false
    publication_authorized: false
    network_write_authorized: false
    automatic_execution: false
    resource_disposition: resource_incomplete
    gates_cleared: 0

  preservation:
    prior_package_edited: false
    prior_decision_edited: false
    interpretation: additive successor; no predecessor byte (BATCH-718595 or earlier) is rewritten

  # ---------------------------------------------------------------------
  # RT-J3-O8 closure: closed operation_effect_class enum + authoritative
  # host binding sourced only from runtime-session-receipt.json.
  # ---------------------------------------------------------------------
  operation_schema_v2:
    closes: RT-J3-O8
    operation_effect_class:
      schema_id: operation_effect_class.v1
      enum:
        - allocates_host_memory
        - writes_filesystem
        - starts_process
        - reserves_scheduler
        - changes_implementation_state
        - none_no_host_effect
      closure_rule: exact_enum_membership_required
      unknown_or_missing_value: STOP
      derivation:
        # requested_action=inspect_static is the only in-scope non-host action;
        # it resolves deterministically to the explicit non-host value.
        - if: requested_action == inspect_static
          operation_effect_class: none_no_host_effect
        - if: requested_action in [materialize_host, materialize_filesystem, schedule, dispatch, implement]
          operation_effect_class: must_be_one_of [allocates_host_memory, writes_filesystem, starts_process, reserves_scheduler, changes_implementation_state]
        - if: requested_action not in operation_schema.requested_action_enum
          action: STOP
      non_host_branch_is_canonical: true
      note: >-
        This replaces the predecessor's undefined non-host branch. It does not
        alter host_resource_required derivation, which remains
        "requested_action in host_resource_actions OR resource_effect_class in
        host_resource_effect_classes" exactly as in TASK-20260824-efdcc2.
    host_binding:
      schema_id: authoritative_host_binding.v1
      source: >-
        The active execution binding used by host_observation.validity.binding_rule
        is read exclusively from this task's own immutable
        runtime-session-receipt.json fields host_binding.host_id,
        host_binding.filesystem_id, and host_binding.filesystem_mount, emitted
        by the runtime harness at session start.
      caller_input_is_never_authoritative: true
      forbidden_source: host_observation object supplied by the caller/consumer
      normalization:
        filesystem_id: lowercase, trimmed, no trailing slash
        filesystem_mount: absolute POSIX path, trailing slash stripped except root "/"
        host_id: trimmed, case-preserved
      binding_rule_v2: >-
        host_observation.host_id, host_observation.filesystem_id, and
        host_observation.filesystem_mount (each normalized as above) must be
        exactly equal to the corresponding normalized
        runtime-session-receipt.json host_binding.* fields. Equality against
        any other source (including a caller-declared "active binding" field)
        is rejected.
      missing_receipt_field: STOP
      receipt_field_absent_handling: >-
        If runtime-session-receipt.json lacks host_binding.host_id,
        host_binding.filesystem_id, or host_binding.filesystem_mount, the
        validity check itself is unevaluable and STOPs; no fallback host
        source is substituted.
      limitation_disclosed: true
      limitation: >-
        LIMITATION (required disclosure): this repair chain has no live
        runtime harness attached to this static-authoring session to emit a
        genuine host_binding.* block; this task's own
        runtime-session-receipt.json (produced below) is the deliverable
        showing the receipt SHAPE this rule depends on, not a proof that a
        given runtime harness populates host_binding.* with tamper-evident,
        authoritative values in general. Whether "sourced from the runtime
        harness" is actually enforceable — i.e., whether the harness's
        receipt-emission step is itself trusted, tamper-resistant, and
        outside caller control — is a property of the runtime harness that
        issues the receipt, not of this schema. This closure is therefore a
        SPECIFIABLE RULE pending an attached, verified runtime harness that
        emits host_binding.* under its own authority; it is not yet a fully
        enforced closure in the absence of such a harness. This gap is
        explicitly carried forward and not presented as closed.

  # ---------------------------------------------------------------------
  # RT-J3-O9 closure: fully recursive PB-3 schema closure.
  # ---------------------------------------------------------------------
  pb3_v2:
    closes: RT-J3-O9
    base: pb3_closed_cost_manifest.v2   # unchanged predecessor identity, extended below
    schema_id: pb3_closed_cost_manifest.v3
    unknown_tokens: [null, UNKNOWN, unknown, unavailable, invalid, nonfinite, unevaluable]

    top_level_allowed_terms: [retained_bytes, largest_artifact_bytes, shard_count, logical_io_bytes,
      temporary_working_bytes, cpu_seconds, wall_seconds, memory_bytes, bootstrap_resamples]
    top_level_allowed_caps: [retained_bytes_max, largest_artifact_bytes_max, shard_count_max,
      logical_io_bytes_max, cpu_seconds_max, wall_seconds_max, memory_bytes_max, free_disk_bytes_min]

    formula_operand_closure:
      schema_id: pb3_formula_operand_registry.v1
      operands:
        retained_terms:
          type: array_of_uint64
          unit: bytes
          cap: bound_to_retained_bytes_max
          role: enumerated_addends_of_retained_bytes
        residual_artifact_bytes:
          type: uint64
          unit: bytes
          cap: bound_to_retained_bytes_max
          role: single_named_residual_term_of_retained_bytes
          must_appear_in: repair.pb3_v2.model_v2.residual_artifact_grouping.residual_key
        individual_artifact_terms:
          type: array_of_uint64
          unit: bytes
          cap: bound_to_largest_artifact_bytes_max
          role: enumerated_candidates_of_largest_artifact_bytes
        read_bytes:
          type: uint64
          unit: bytes
          cap: bound_to_logical_io_bytes_max
          role: addend_of_logical_io_bytes
        write_bytes:
          type: uint64
          unit: bytes
          cap: bound_to_logical_io_bytes_max
          role: addend_of_logical_io_bytes
        replay_bytes:
          type: uint64
          unit: bytes
          cap: bound_to_logical_io_bytes_max
          role: addend_of_logical_io_bytes
      closure_rule: >-
        Every operand referenced by any formula in repair.pb3_v2.formulas_v2
        must be a member of this operand registry with an explicit type, unit,
        and cap binding. No formula may consume an operand absent from this
        list. Any operand token present in a formula input but absent from
        this registry is an unbound_operand and STOPs.
      unbound_operand: STOP

    model_v2:
      schema_id: pb3_model_closure.v1
      required_fields: [serialization_model, merge_model, residual_artifact_grouping, unit_conversions, conservativeness_basis]
      exact_key_equality_at_every_level: true
      nested_schemas:
        serialization_model:
          required_keys: [format, exact_or_conservative, retained_term_source]
          format: {type: enum, allowed: [flat_manifest_v1]}
          exact_or_conservative: {type: enum, allowed: [exact_upper_bound, conservative_upper_bound]}
          retained_term_source: {type: enum, allowed: [declared_manifest_only]}
          unknown_key_at_this_level: STOP
        merge_model:
          required_keys: [merge_pass_count, merge_pass_bytes_bound_to, double_count_guard]
          merge_pass_count: {type: uint64, unit: count}
          merge_pass_bytes_bound_to:
            type: enum
            allowed: [logical_io_bytes]
            rule: >-
              Any byte-valued quantity attributable to a merge pass (including
              a term named merge_pass_bytes) must be bound to logical_io_bytes
              via read_bytes/write_bytes/replay_bytes; it is never a standalone
              addend of retained_bytes and never an unbound key under
              merge_model.
          double_count_guard: {type: enum, allowed: [merge_output_excluded_from_retained_terms]}
          unknown_key_at_this_level: STOP
          unlisted_nested_term_rule: >-
            Any key under merge_model other than merge_pass_count,
            merge_pass_bytes_bound_to, and double_count_guard is an
            unbound_nested_field and STOPs, closing the RT-J3-O9
            counterexample_or_mutation of hiding merge_pass_bytes or a
            conversion inside merge_model.
        residual_artifact_grouping:
          required_keys: [residual_key, residual_unit, residual_conservativeness]
          residual_key: {type: string, constraint: must_equal residual_artifact_bytes}
          residual_unit: {type: enum, allowed: [bytes]}
          residual_conservativeness: {type: enum, allowed: [exact_upper_bound, conservative_upper_bound]}
          unknown_key_at_this_level: STOP
        unit_conversions:
          required_keys: [conversion_table, rounding_rule]
          conversion_table: {type: array_of_objects, each: {from_unit: string, to_unit: string, factor: nonnegative_decimal}}
          rounding_rule: {type: enum, allowed: [exact_or_conservative_only]}
          unknown_key_at_this_level: STOP
        conservativeness_basis:
          required_keys: [basis, justification_ref]
          basis: {type: enum, allowed: [exact_upper_bound, conservative_upper_bound]}
          justification_ref: {type: string, constraint: nonempty_after_trim}
          unknown_key_at_this_level: STOP
      unknown_nested_field_at_any_level: STOP

    formulas_v2:
      retained_bytes: "sum(retained_terms) + residual_artifact_bytes"
      largest_artifact_bytes: "max(individual_artifact_terms)"
      shard_count: "ceil(retained_bytes / largest_artifact_bytes_max)"
      logical_io_bytes: "sum(read_bytes) + sum(write_bytes) + sum(replay_bytes)"
      formula_to_input_dependency_map:
        retained_bytes: [retained_terms, residual_artifact_bytes]
        largest_artifact_bytes: [individual_artifact_terms]
        shard_count: [retained_bytes, largest_artifact_bytes_max]
        logical_io_bytes: [read_bytes, write_bytes, replay_bytes]

    closure_v2:
      input_key_set_equals_allowed_terms_and_caps: true
      recursive_key_set_equals_nested_schemas_at_every_level: true
      every_formula_operand_registered_in_formula_operand_closure: true
      every_model_reference_resolves_once: true
      every_unit_matches_formula_dimension: true
      every_bound_is_nonnegative_and_conservative: true
      residual_must_be_bound_and_not_double_counted: true
      temporary_bootstrap_raw_retention_disk_terms: >-
        temporary_working_bytes and bootstrap_resamples are top-level allowed
        terms already present in the predecessor's allowed_terms and remain
        bound there (not formula operands of retained_bytes/logical_io_bytes).
        raw_retention_bytes and disk_bytes are explicitly bound to the
        separate resource-envelope schema (repair.resource_composition_v2
        below) and are never PB-3 formula operands.
      unknown_extra_unbound_inconsistent_nonconservative_or_unevaluable_at_any_nesting_level: STOP

  # ---------------------------------------------------------------------
  # RT-J3-O10 closure: executable CT-1..CT-5 record schema and semantics.
  # ---------------------------------------------------------------------
  control_semantics_v2:
    closes: RT-J3-O10
    per_record_schema:
      schema_id: ct_trial_record.v1
      fields:
        trial_id: {type: uint64, constraint: unique_within_control}
        pair_key: {type: string, constraint: nonempty_after_trim, role: joins signal and null rows of the same paired trial}
        seed: {type: string, constraint: "matches UTF8 \"TASK-20260825-74615f/<control>/<replicate>\" per control-formula-manifest.v1 seed rule"}
        signal_value: {type: decimal128, unit: control_defined, constraint: finite}
        null_value: {type: decimal128, unit: control_defined, constraint: finite}
        is_duplicate: {type: bool, rule: "true iff (pair_key, seed) matches an earlier record in the same control; duplicate records STOP the control"}
        event: {type: bool, rule: per_control_event_predicate_below}
      unpaired_or_missing_row: STOP
      duplicate_identity_key: [pair_key, seed]
    per_ct_event_predicates:
      CT-1: "event = (signal_value - null_value) contributes to mean(signal_i - null_i); no boolean event, estimate is the paired mean itself"
      CT-2: "event = (unique_signal_i - unique_null_i) contributes to mean(unique_signal_i - unique_null_i); unique_signal_i/unique_null_i are signal_value/null_value restricted to non-duplicate pair_key rows"
      CT-3: "event = 1 iff signal_value == 1 (signal_event) or null_value == 1 (null_event); signal_event_rate = sum(signal event)/1000, null_event_rate = sum(null event)/1000"
      CT-4: "event = none (CT-4 is a timing control); signal_value/null_value hold cpu_seconds and wall_seconds respectively for baseline and doubled-input replicate pairs"
      CT-5: "event = 1 iff the trial's stratum (baseline or signal-destroyed) contributes a nonzero destroyed effect component; destroyed_effect and destroyed_null_effect are per-stratum signed means, not per-record booleans"
    interval_algorithm_CT3:
      name: clopper_pearson_log_ratio_95_CI
      construction: >-
        Named closed-form: for signal_event_count k1 out of n1=1000 and
        null_event_count k2 out of n2=1000, compute the Clopper-Pearson exact
        binomial 95% CI endpoints [p1_lo, p1_hi] for k1/n1 and [p2_lo, p2_hi]
        for k2/n2 using the standard Beta-distribution quantile inversion
        (p_lo = BetaInv(0.025; k, n-k+1), p_hi = BetaInv(0.975; k+1, n-k) with
        the usual k=0 -> p_lo=0 and k=n -> p_hi=1 boundary conventions). The
        reported ratio CI is [p1_lo/p2_hi, p1_hi/p2_lo] (log-ratio endpoints
        obtained by exponentiating the sum of the per-proportion log-CI
        endpoints), giving a conservative ratio interval from the two
        independent per-proportion Clopper-Pearson intervals.
      endpoints_defined: true
    bootstrap_pin:
      prng_algorithm: PCG64
      prng_seed_source: >-
        UTF8 "TASK-20260825-74615f/<control>/bootstrap", SHA256-derived
        uint64, per control-formula-manifest.v1 seed rule, used as the PCG64
        seed state
      resampling_unit: one_paired_trial_row
      index_handling: sample_with_replacement_over_trial_id_index_of_the_control
      duplicate_handling: >-
        Records already excluded as is_duplicate=true at the per-record
        schema layer are never present in the resampling population; the
        bootstrap draws only from non-duplicate paired rows.
      percentile_interpolation: linear   # numpy/R "type 7" style linear interpolation between order statistics
      resample_count: 10000
      decimal_arithmetic: decimal128_or_higher, matching control-formula-manifest.v1 precision rule
    CT4_definition:
      wall_rate: inputs_processed / wall_seconds
      denominator_positivity: wall_seconds > 0 required; wall_seconds <= 0 is STOP
      cpu_seconds_baseline_positivity: cpu_seconds_baseline > 0 required; cpu_seconds_baseline <= 0 is STOP
      wall_seconds_baseline_positivity: wall_seconds_baseline > 0 required; wall_seconds_baseline <= 0 is STOP
      zero_or_negative_denominator: STOP
    CT5_definition:
      destroyed_effect: >-
        signed quantity = mean(signal_value_i - null_value_i) computed over
        the signal-destroyed stratum's 1000 paired trials
      destroyed_null_effect: >-
        signed quantity = mean(signal_value_i - null_value_i) computed over
        the baseline stratum's 1000 paired trials
      predicate_operates_on: signed_value_not_absolute_value
      signedness_rule: >-
        point_estimate = destroyed_effect - destroyed_null_effect is retained
        signed through comparison against CI.lower and CI.upper; an absolute
        value is never substituted for point_estimate or for the CI bounds.
    invalid_uncomputable_cases:
      malformed_record: STOP
      missing_record: STOP
      duplicate_record: STOP
      unpaired_record: STOP
      zero_or_negative_denominator: STOP
      nonfinite_interval_endpoint: STOP
      uncomputable_interval: STOP

  # ---------------------------------------------------------------------
  # RT-J3-O11 closure: per-CT and total resource composition.
  # ---------------------------------------------------------------------
  resource_composition_v2:
    closes: RT-J3-O11
    per_ct_formulas:
      schema_id: per_ct_resource_formula.v1
      common:
        record_bytes_per_record: 512   # bytes for one ct_trial_record.v1 row, fixed encoding width
        bootstrap_cpu_seconds_per_resample: 0.002
        bootstrap_wall_seconds_per_resample: 0.0021   # accounts for scheduling overhead; sequential within a control
        bootstrap_memory_bytes_per_resample: 4096
      CT-1: {raw_record_count: 1000, bootstrap_resamples: 10000,
             bytes: "1000 * record_bytes_per_record", cpu_seconds: "0.05 + 10000*bootstrap_cpu_seconds_per_resample",
             wall_seconds: "0.05 + 10000*bootstrap_wall_seconds_per_resample", memory_bytes: "8388608 + 10000*bootstrap_memory_bytes_per_resample",
             disk_bytes: "1000 * record_bytes_per_record", logical_io_bytes: "3 * 1000 * record_bytes_per_record"}
      CT-2: {raw_record_count: 1000, bootstrap_resamples: 10000,
             bytes: "1000 * record_bytes_per_record", cpu_seconds: "0.05 + 10000*bootstrap_cpu_seconds_per_resample",
             wall_seconds: "0.05 + 10000*bootstrap_wall_seconds_per_resample", memory_bytes: "8388608 + 10000*bootstrap_memory_bytes_per_resample",
             disk_bytes: "1000 * record_bytes_per_record", logical_io_bytes: "3 * 1000 * record_bytes_per_record"}
      CT-3: {raw_record_count: 1000, bootstrap_resamples: 0,
             bytes: "1000 * record_bytes_per_record", cpu_seconds: 0.05, wall_seconds: 0.05,
             memory_bytes: 8388608, disk_bytes: "1000 * record_bytes_per_record",
             logical_io_bytes: "3 * 1000 * record_bytes_per_record"}
      CT-4: {raw_record_count: 30, bootstrap_resamples: 10000,
             bytes: "30 * record_bytes_per_record", cpu_seconds: "0.01 + 10000*bootstrap_cpu_seconds_per_resample",
             wall_seconds: "0.01 + 10000*bootstrap_wall_seconds_per_resample", memory_bytes: "4194304 + 10000*bootstrap_memory_bytes_per_resample",
             disk_bytes: "30 * record_bytes_per_record", logical_io_bytes: "3 * 30 * record_bytes_per_record"}
      CT-5: {raw_record_count: 3000, bootstrap_resamples: 10000,
             bytes: "3000 * record_bytes_per_record", cpu_seconds: "0.15 + 10000*bootstrap_cpu_seconds_per_resample",
             wall_seconds: "0.15 + 10000*bootstrap_wall_seconds_per_resample", memory_bytes: "16777216 + 10000*bootstrap_memory_bytes_per_resample",
             disk_bytes: "3000 * record_bytes_per_record", logical_io_bytes: "3 * 3000 * record_bytes_per_record"}
      formula_note: >-
        raw_record_count for CT-5 is 1000 (baseline) + 1000 (signal-destroyed)
        + 1000 (paired null per control-formula-manifest.v1) = 3000 trial rows.

    aggregation_rule:
      schedule_and_concurrency_model: >-
        Within one control, all bootstrap resamples and record processing run
        sequentially (sequential_within_a_control). Across controls, up to
        max_concurrent=2 controls (per dispatch_queue.json max_concurrent) may
        run concurrently; the remaining controls queue and run sequentially as
        slots free.
      per_control_to_total:
        bytes_total: sum(bytes over CT-1..CT-5)
        disk_bytes_total: sum(disk_bytes over CT-1..CT-5)
        logical_io_bytes_total: sum(logical_io_bytes over CT-1..CT-5)
        cpu_seconds_total: sum(cpu_seconds over CT-1..CT-5)   # CPU total is schedule-independent
        wall_seconds_total: >-
          ceil(sum(wall_seconds over CT-1..CT-5) / max_concurrent), reflecting
          the concurrent-up-to-2 schedule; this replaces the predecessor's
          total_wall_cap-equals-one-per-control-cap statement with an explicit
          concurrency-derived total.
        memory_bytes_total: >-
          max over any schedule-feasible concurrent subset of size
          max_concurrent of (sum of memory_bytes of the subset); with
          max_concurrent=2 this is the sum of the two largest per-control
          memory_bytes values (CT-5 and CT-1, or CT-5 and CT-2), i.e. the peak
          concurrent memory demand, not a naive sum of all five controls.

    total_bootstrap_resamples_cap:
      total_bootstrap_resamples_max: 40000   # 4 bootstrap-using controls (CT-1,CT-2,CT-4,CT-5) x 10000
      violation: STOP
    total_temporary_and_raw_caps:
      temporary_working_bytes_total_max: 268435456
      raw_retention_bytes_total_max: 4294967296   # unchanged from predecessor per-control cap; single control at a time retains raw
      violation: STOP

    host_demand_inequalities:
      schema_id: host_demand_check.v1
      disk_inequality: "host_observation.free_disk_bytes >= resource_composition_v2.aggregation_rule.per_control_to_total.disk_bytes_total + total_temporary_and_raw_caps.raw_retention_bytes_total_max"
      memory_inequality: "host_observation.memory_bytes >= resource_composition_v2.aggregation_rule.per_control_to_total.memory_bytes_total"
      host_observation_source: >-
        host_observation here is the typed, receipt-bound observation defined
        under operation_schema_v2.host_binding; it is never caller-supplied.
      violation: STOP
      unevaluable_inequality_missing_operand: STOP

  # ---------------------------------------------------------------------
  # RT-J3-O12 closure: closed dependent-action registry.
  # ---------------------------------------------------------------------
  dependent_action_registry_v2:
    closes: RT-J3-O12
    schema_id: dependent_action_registry.v1
    enum:
      - fit
      - pass
      - resource_approval
      - materialization
      - schedule
      - dispatch
      - implementation
      - disposition
      - control_execution
      - instrument_execution
      - measurement
      - interpretation
      - envelope_admission
      - authorization_transition
    closure_rule: exact_enum_membership_required
    unknown_action_label: STOP_before_dispatch
    global_stop_v2:
      stop_token: J3_STOP
      default: STOP
      applies_to: dependent_action_registry_v2.enum   # closed set, supersedes predecessor's 8-item applies_to list additively
      precedence: any STOP dominates every continue/pass/approval branch for every listed action
      triggers:
        - missing, false, contradictory, or unevaluable operation applicability
        - missing, malformed, stale, future, unbound, or semantically invalid host observation
        - PB-3 unknown, extra-unbound, inconsistent, nonconservative, or unevaluable term/cap/model at any nesting level
        - CT record invalid, incomplete, unpaired, duplicate, unevaluable, or outside canonical rules
        - any per-control or total resource envelope exhausted, uncapped, or unevaluable
        - dependent action label not a member of dependent_action_registry_v2.enum
      effects:
        all_dependent_actions: STOP
        resource_disposition: resource_incomplete
        authorization: unchanged_false_or_zero
        scientific_interpretation: none
        disposition_transition: forbidden_without_coordinator_record

  scope:
    in_scope: [static_operation_schema, typed_observation, closed_pb3_manifest, global_stop,
      control_contract, resource_envelopes, dependent_action_registry]
    out_of_scope: [implementation, phase_b, target, curve, jinv, transport, n18, science, experiments, controls_run]
    controls_are_planned_not_executed: true

  known_limitations:
    - >-
      operation_schema_v2.host_binding is a specifiable rule sourced from
      runtime-session-receipt.json's host_binding.* fields; this static
      repair chain has no live runtime harness attached to populate those
      fields under independent authority, so the rule is pending an attached,
      verified harness rather than fully enforced today. See the disclosed
      limitation under operation_schema_v2.host_binding.limitation above.
    - >-
      This closure is a zero-run static declarative package. Passing its own
      internal predicates does not constitute an implementation run, a
      control execution, or a scientific result.
