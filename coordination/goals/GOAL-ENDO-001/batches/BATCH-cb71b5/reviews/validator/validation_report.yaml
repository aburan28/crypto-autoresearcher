  findings:
  - id: F-01
    severity: material
    scope: all eleven run manifests in the batch
    what_i_checked: >-
      Whether `run.code.commit` + `run.code.dirty` in each manifest actually binds
      the run to reproducible source. I ran `git cat-file -e e34afdd0:<path>` for
      each of the six harness modules and `git log --diff-filter=A` to find where
      they entered history.
    what_i_found: >-
      Every manifest records `commit: e34afdd0c3137c038042cae7c68495c700977afd,
      dirty: false`. None of harness/isogeny_class.py, exp_icinv.py, run_icinv.py,
      run_jinv.py, run_ewalk2.py or run_volc_mtgt.py exists at e34afdd0; all six were
      introduced by the snapshot commit 22eb74ba itself. The mechanism is
      harness/runner.py:git_state(), which computes dirty as
      `git status --porcelain --untracked-files=no` -- so brand-new, untracked
      experiment code is invisible to the dirtiness check by construction. An
      independent party following the recorded binding would check out e34afdd0 and
      find no harness module at all. The certificates inherit the same wrong sha in
      `verifier_commit`.
    recommend: >-
      Record a correction stating that the true code state for all eleven runs is
      the tree committed at 22eb74ba, and fix `git_state()` to treat untracked files
      under harness/ and tools/ as dirty (or to record `git stash create`/tree hash
      instead of HEAD). This is a repository-wide receipt defect, not specific to
      this campaign, and every earlier run written with new untracked code carries
      it too.
  - id: F-02
    severity: material
    scope: RUN-MTGT-p4001e2; harness/isogeny_class.py velu_odd/velu_image; harness/run_volc_mtgt.py run_mtgt
    what_i_checked: >-
      I re-executed `run_mtgt`'s class selection and kernel construction at p=4001,
      ell=2 from the pinned snapshot and printed the kernel, the target curve
      coefficients and phi(P).
    what_i_found: >-
      For ell=2 the kernel-representative loop `for _ in range((ell-1)//2)` executes
      zero times, so `kernel_pts = []`. `velu_odd` sums over an empty S, giving
      v = w = 0 and returning (a-0, b-0) = (a, b). `velu_image` with an empty kernel
      returns its argument. Concretely, on the class the run selects (trace -124,
      N=2063, a=444, b=888): target curve == source curve, kernel_gen = (935,0),
      phi(P) = P = (1299,2024), and the transported table is element-identical to the
      source table. So `entries_surviving: 300`, `entries_failing_certificate: 0`,
      `all_entries_on_target_curve: true`, `transport_certificate_verified: true`
      and `same_isogeny_class: true` are all satisfied by the identity map. The run
      is a null measurement presented as a transport measurement.
    recommend: >-
      Mark RUN-MTGT-p4001e2 invalid_measurement by correction (do not edit it), make
      `velu_odd`/`velu_image`/`run_mtgt` refuse even ell explicitly the way `run_volc`
      already refuses ell != 2, and add a non-degeneracy assertion to every transport
      certificate: kernel size == ell > 1 AND (a',b') is not F_p-isomorphic to (a,b).
      Any citation of "three MTGT runs" must become two.
  - id: F-03
    severity: material
    scope: RUN-VOLC-p2003e3, RUN-VOLC-p4001e7
    what_i_checked: >-
      I re-ran both runs' exact recorded commands against the pinned snapshot code
      with --no-write.
    what_i_found: >-
      Both return `{"invalid": true, "reason": "volcano level determination for
      ell=N needs the modular polynomial Phi_N, which is not implemented; refusing
      to report a level rather than reporting a wrong one"}` and, per
      run_volc_mtgt.main's `if not v.get("invalid")` guard, would never have written
      a VOLC run record. The version of `ell_subgroup_count`/`run_volc` that
      produced these two records has been REMOVED from the tree. This is the exact
      opposite of the handling given to the EWALK defect, where `rho_steps` was
      deliberately retained unchanged so the superseded run stays reproducible -- and
      the batch commit message cites that retention as its policy.
    recommend: >-
      Either restore the superseded `ell_subgroup_count` behind an explicit
      `--legacy-torsion-count` flag so the two records reproduce, or record a
      correction marking both runs `invalid_measurement / not reproducible` and stop
      citing "three VOLC runs". As it stands only RUN-VOLC-p4001e2 is a reproducible
      VOLC receipt.
  - id: F-04
    severity: material
    scope: EXP-INSTR-2d32ba, EXP-ICINV-180a0d, EXP-JINV-6c5b8e, EXP-EWALK-4fc679, EXP-EWALK-cc0353, EXP-VOLC-9fec05, EXP-MTGT-321a54
    what_i_checked: >-
      Whether a frozen experiment contract exists for each experiment, against which
      I could check that the positive and negative controls match what was approved
      before execution (validator responsibility 4; AGENTS.md core rule 3).
    what_i_found: >-
      Every one of the seven experiment directories contains only `runs/`. There is
      no specification.yaml, contract.yaml or equivalent, in the tree or in commit
      22eb74ba. Older experiments in this repository (e.g. experiments/EXP-GGM-001)
      carry specification.yaml. I therefore verified the controls against the code
      and the campaign narrative, which is a weaker check: I can confirm the controls
      that were RUN are correct, but not that they are the controls that were
      DECLARED before running, and not that no control was dropped.
    recommend: >-
      Archive the seven contracts (they may be written now and marked as
      reconstructed-after-the-fact, which is honest and still useful) before any
      evidence record cites these runs, and treat the pre-registration status of the
      decomposition's section-5 predictions as the substitute in the meantime --
      those ARE dated and committed, which is why this is `incomplete` and not
      `invalid`.
  - id: F-05
    severity: minor
    scope: RUN-ICINV-p4001-a metrics.decay_verdict; harness/run_icinv.py window_decay
    what_i_checked: >-
      I recomputed the full-field within-class liftable-count variance and compared
      it against what the identity actually predicts.
    what_i_found: >-
      `window_decay`'s docstring asserts that over the full field the liftable count
      "is an exact function of the trace and is therefore class-invariant BY
      DEFINITION", and the verdict tests `< 1e-9`. That is wrong: the identity is
      L = (#E - 1 + z)/2, so the correct prediction is Var_within(L) = Var_within(z)/4,
      not zero. I verified per class that Var(L) equals Var(z)/4 to machine
      precision (traces 30 and -30: 0.251348778 both; traces 18 and -18:
      0.247422680 both) and that the mean over classes is 0.24938572928901642
      against the recorded 0.24938572928898783 -- agreement to 2.9e-14, i.e. float
      summation order. The recorded verdict "NOT explained by the trace identity --
      investigate" is a threshold bug, and the correct reading is the exact
      opposite: the decay behaves precisely as the identity predicts.
    recommend: >-
      Already superseded by CORR-20260807-2c9ae4 per the Coordinator's message; I
      confirm that correction independently and it is correct. Change the threshold
      to compare against mean Var(z)/4 rather than zero.
  - id: F-06
    severity: minor
    scope: harness/exp_icinv.py permutation_null; RUN-ICINV-p4001-a, RUN-VOLC-p4001e2
    what_i_checked: The p-value convention and its floor.
    what_i_found: >-
      `permutation_null` returns `#{null <= observed}/iterations` with no +1
      correction, so p = 0 is attainable and the smallest non-zero value is
      1/iterations. The reported liftable_density p = 0.0005 IS 1/2000, i.e. the
      floor -- it is a censored value meaning "p <= 0.0005", not a point estimate.
    recommend: Use (worse+1)/(iterations+1) and report floored values as inequalities.
  - id: F-07
    severity: material
    scope: RUN-ICINV-p4001-a permutation_null interpretation strings
    what_i_checked: >-
      What alternative hypotheses the mean-within-group-variance permutation
      statistic actually has power against. I ran it on planted data of three shapes.
    what_i_found: >-
      The tail convention is CORRECT (lower tail; a grouping that carries information
      drives the statistic down). Planted mean shifts are detected decisively
      (groups with means 0/5/10 and sd 1: observed 0.928 vs null mean 18.16, p =
      0.0000). Under a pure null the p-values are approximately uniform and slightly
      conservative (P(p<0.05) = 0.033 over 300 replicates). BUT planted
      variance-only structure with equal means is NOT detected (sd 0.5/1/2, equal
      means: p = 0.065). So the statistic's real power is against between-class MEAN
      differences -- which for decomposition rate are driven by #E, the very quantity
      that defines the class, i.e. the TRIVIAL alternative. The reported string
      "class grouping carries no detectable information" therefore over-states what
      a non-significant result licenses: it means "no detectable between-class mean
      shift in this functional", not "no information".
    recommend: >-
      Restate the conclusion as a bounded non-detection naming the statistic and its
      power ("no between-class mean shift detectable at n=472, iterations=2000"), and
      note that had it fired, the first explanation to exclude would have been the
      #E difference and not structure. Also note the three-functional multiplicity:
      m=3 at p=0.062 is uncorrected and borderline.
  - id: F-08
    severity: minor
    scope: RUN-INSTR-p4001-a and RUN-ICINV-p4001-a
    what_i_checked: command.txt of both runs.
    what_i_found: >-
      Both record the identical string `python3 -m harness.run_icinv --p 4001 --fb-m2
      40 --fb-m3 13 --window 400 --targets 400 --controls 3 --suffix p4001-a`. One
      invocation wrote two run records in two different experiment directories. That
      is legitimate (the instrument control is blocking and runs first) but nothing in
      either manifest says so, so the two receipts look like independent runs.
    recommend: Add a `co_produced_with` field or say it in the manifest note.
  - id: F-09
    severity: minor
    scope: RUN-JINV-p1009-a metrics
    what_i_checked: >-
      Whether the Groebner numbers are labelled with the same care as
      harness/semaev.py, which states that sympy "does not expose the true degree of
      regularity" and that its outputs are "implementation-bound proxies".
    what_i_found: >-
      They are, in `groebner_cost`'s docstring, explicitly and correctly. The
      labelling does NOT propagate into the run's metrics or manifest, where
      `gb_max_degree`, `gb_size_mean` and `gb_seconds_mean` appear unqualified.
      Separately: gb_max_degree is 4 in all three arms (no difference at all); the
      wall-time differences are 0.4% (j0) and 0.7% (j1728) against generic, with no
      variance reported and 40% of the systems returning the trivial ideal {1}; and
      the basis-size difference is +3.4% for j1728, i.e. LARGER, not cheaper. The
      batch commit message's "moves Groebner cost by ~3%" is therefore reporting a
      basis-size increase as a cost movement without saying which metric or which
      direction.
    recommend: >-
      Carry the proxy label into the metrics keys (e.g. gb_size_mean_proxy), report
      dispersion for the timing, separate trivial-ideal from non-trivial systems, and
      restate the ~3% claim with its metric and sign. The only exact, defensible
      j-invariant difference in this run is the S_3 support 9/10/13, which I
      confirmed by hand.
  - id: F-10
    severity: material
    scope: harness/run_ewalk2.py generic arm; CORR-20260807-df0585 required_action
    what_i_checked: >-
      Whether `generic:speedup = 1.000` is a definitional self-check or a tautology.
      I traced the arguments both modes pass to `rho`.
    what_i_found: >-
      For the generic arm `zeta` is None, so `phi, ao = (None, 1)` and `lam = None`.
      Both modes then call `rho(..., phi=None, lam=None, aut_order=2, max_steps=...)`
      with the same seed -- LITERALLY IDENTICAL ARGUMENTS. The two calls are the same
      pure function on the same input. A speedup of exactly 1.000 is therefore
      guaranteed by construction and cannot fail for ANY bug: it exercises no branch
      of the canon/multiplier bookkeeping the correction exists to protect. It is a
      tautology, not a self-check. The run's own note ("identical BY CONSTRUCTION and
      a speedup of exactly 1.0 there is a self-check") is candid about the first half
      and wrong about the second. This matters because CORR-20260807-df0585's
      required_action mandates this arm as the standing self-check for all future
      quotient walks in the program.
    recommend: >-
      Make the generic arm exercise the machinery: run the quotient mode with an
      explicitly trivial automorphism phi = identity and lam = 1 and aut_order = 2,
      so `canon` and the multiplier path are actually executed and a bookkeeping bug
      would change the answer. Then 1.000 becomes a real invariant. Amend the
      correction's required_action accordingly.
  - id: F-11
    severity: material
    scope: RUN-EWALK-p100003-a; the "94.7% of the ceiling" claim in the batch commit message
    what_i_checked: >-
      I re-ran the j0 arm from the pinned snapshot and computed per-trial dispersion,
      which the run record does not report.
    what_i_found: >-
      Per-curve step counts have coefficient of variation 0.40-0.61 over 24 trials.
      Standard errors of the means are 8-12%, giving per-curve speedups
      1.636 +- 0.262 and 1.658 +- 0.200 at 1 sigma. The headline 1.641 is thus
      statistically indistinguishable from the ceiling sqrt(3) = 1.732 AND from 1.4
      AND from 1.9. "94.7% of the ceiling, never above" reads as a precise
      agreement; at n=24 it is not a measurement precise enough to support that
      reading, and the `exceeds_incremental_ceiling_by_15pct: false` flag would not
      fire even if the true value were at the ceiling. No uncertainty appears
      anywhere in the run record. Additionally the arm aggregates by an unweighted
      mean of raw step counts across curves with N = 99667 and N = 11149, which is
      only harmless here because the two per-curve ratios happen to agree.
    recommend: >-
      Report per-trial sd and a bootstrap CI on the ratio, aggregate per-curve
      ratios rather than raw step means, and raise trials until the CI excludes at
      least one of {1.0, sqrt(2), sqrt(3)}. Until then state the result as
      "consistent with the sqrt(|Aut|/2) ceiling, not distinguishable from it".
  - id: F-12
    severity: minor
    scope: RUN-EWALK-p100003-a `prediction` and `ratio_observed_over_predicted`
    what_i_checked: >-
      Why every arm reports ratio_observed_over_predicted in a narrow band around
      1.40-1.52 instead of around 1.0.
    what_i_found: >-
      `rho` stores EVERY visited point in `seen`, so it is a full-memory birthday
      search whose expected length is 1.2533*sqrt(M), not the distinguished-point rho
      constant 0.886*sqrt(M) that `prediction` uses. 1.2533/0.886 = 1.414, which is
      exactly the observed offset. I confirmed the identification numerically: the
      plain arm's observed means (284.46, 92.79, 143.04, 80.17) match
      1.2533*sqrt(N/2) (279.8, 93.6, 139.7, 80.7) to within 2.4% on all four curves.
      So the per-arm ratios are systematically mislabelled by a factor sqrt(2). The
      headline speedup is a ratio of two arms and is unaffected.
    recommend: >-
      Use 1.2533 (or state the memory model) in `prediction`, or rename the field to
      make clear it is a ratio against the distinguished-point convention rather than
      against this implementation's own expectation.
  - id: F-13
    severity: minor
    scope: harness/exp_icinv.py _targets; cross-curve independence of decomposition rates
    what_i_checked: >-
      Whether the binomial null's independence assumption holds ACROSS curves, since
      that is what a residual-variance-below-1 diagnostic would be testing.
    what_i_found: >-
      `_targets` is documented as deriving target x-values from "the seed and the
      CURVE-INDEPENDENT index only", so every curve is probed with the same hashed
      x-sequence and the target multisets overlap heavily across curves. Within a
      curve, given the sum set, the per-target Bernoulli model is fine; ACROSS curves
      the hit indicators are positively correlated by construction. That is exactly
      the mechanism that makes a residual-to-binomial variance ratio below 1
      possible without the covariate explaining anything.
    recommend: See limitations L-03 for the substantive answer to the |3V| question.
  - id: F-14
    severity: material
    scope: ledger/corrections/CORR-20260807-df0585.yaml, the_defect.how_it_was_caught
    what_i_checked: >-
      The claim that "the generic arm's speedup of 0.991 -- where the two modes are
      identical by construction and the value must be exactly 1.000 -- showed the
      collision bookkeeping was not sound". I ran the superseded `rho_steps` on a
      generic curve at p=1009 in both modes with the recorded seeds and compared
      per-trial step sequences.
    what_i_found: >-
      In the SUPERSEDED code the two modes are NOT identical by construction. `canon`
      there is the identity in plain mode and `min(R,-R)` in quotient mode, so the
      quotient arm detects negation collisions the plain arm never sees and (because
      it `continue`s without storing) diverges from it. The per-trial step sequences
      differ -- e.g. trial 5 gives 14 steps plain and 15 quotient -- so the sequences
      are provably not identical. The generic arm's 0.991 in EXP-EWALK-cc0353 was a
      genuine (broken-bookkeeping) measurement, not a violated tautology. The
      assertion quoted is true of the NEW code (run_ewalk2) and false of the code it
      is describing.
      Everything else in the correction I checked is accurate: the defect location,
      the mechanism (an automorphism acts as a scalar so canonicalisation must
      multiply the exponents by lambda^i), the classification as an implementation
      failure that is never negative mathematical evidence, the scope limitation, and
      `what_this_does_not_affect` (JINV shares no code with rho_steps; ICINV and
      INSTR use no walk code -- both confirmed by import graph and by the fact that
      RUN-ICINV-p4001-a reproduces bit-exactly).
    recommend: >-
      Supersede the correction with an amended `how_it_was_caught` stating the real
      tell: a quotient walk cannot be 260x SLOWER than the walk it quotients, which
      the correction also says and which IS decisive on its own. Do not weaken the
      rest of the record; it is right.
  - id: F-15
    severity: minor
    scope: RUN-EWALK-p100003-a certificate block
    what_i_checked: >-
      docs/claims-and-verification.md: "Every run that claims a solve or a relation
      MUST emit a certificate".
    what_i_found: >-
      The run reports `solve_rate: 1.0` for the j0 arm (48 solved DLP instances) and
      0.979 for generic, and records `certificate: {kind: none, verifier: no-claim}`.
      The solve is internally checked (`rho` returns k only after E.mul(k,P)==Q) but
      no certificate is stored and the wrapper's independent verifier is never
      invoked. RUN-JINV-p1009-a, by contrast, does carry a verified `decomposition`
      certificate, so the discipline is understood and was simply not applied here.
    recommend: Emit one `discrete_log` certificate per arm (P, Q, k, curve).
  - id: F-16
    severity: minor
    scope: RUN-VOLC-p4001e2
    what_i_checked: The relation between the reported level label and the other functionals.
    what_i_found: >-
      For ell=2, `ell_subgroup_count` returns the number of roots of x^3+ax+b, which
      is numerically identical to `two_torsion_x_count`, a functional the ICINV
      battery reports separately. The run's own strata confirm it: stratum 1 has
      two_torsion_x [1] and stratum 3 has [3]. The stratification test is therefore a
      test of whether the 2-torsion root count predicts decomposition rate, under a
      volcano-level name. This is mathematically correct (for ell=2 the vertex degree
      IS the root count) and I verified the volcano structure independently, but the
      identity should be disclosed so nobody reads the two functionals as independent
      evidence.
    recommend: State the identity in the run note.
  - id: F-17
    severity: material
    scope: RUN-VOLC-p2003e3; harness/run_volc_mtgt.py ell_subgroup_count docstring
    what_i_checked: >-
      Whether the recorded reason for the degenerate `levels_observed: [1]` is the
      real one. I computed the Frobenius discriminant, its fundamental part, the
      conductor, and the splitting of 3.
    what_i_found: >-
      The selected class is trace 36 at p=2003, #E = 1968, D = -6716 = -1679 * 2^2,
      so D0 = -1679 and conductor f = 2. Since 3 does not divide f, the 3-volcano has
      NO DEPTH -- the whole class sits on the crater and there is nothing to
      stratify, whatever counting method is used. This is a power failure of the
      class selection (`run_volc`'s `deep` preference found no 3-deep class and fell
      back to "order divisible by ell"), and the run record does not report it: unlike
      RUN-VOLC-p4001e2 and p4001e7, the p2003e3 metrics carry no
      `frobenius_conductor`, `fundamental_discriminant` or `volcano_has_depth_at_ell`
      key at all. The docstring's blame on undercounting is a real but secondary
      cause: (D|3) = +1, so 3 splits and the true crater degree is 2, while the run
      reported 1.
    recommend: >-
      Record the real reason (conductor 2, no 3-adic depth) alongside the
      undercounting one. Contrast with RUN-VOLC-p4001e7, where I confirm the recorded
      reason IS the real and complete one.
  - id: F-18
    severity: minor
    scope: all three RUN-MTGT records
    what_i_checked: The basis of `transport_over_rebuild`.
    what_i_found: >-
      All timings are single-shot Python wall clock in the range 1.1e-4 to 2.8e-3
      seconds, with no repetition, no warm-up and no dispersion. The three ratios are
      0.155, 0.057 and 0.415 -- a factor of seven apart -- and the batch commit
      message reports "~1/6 the cost of rebuilding", which is the p2003e3 value only.
      The 0.057 figure additionally comes from the identity-map run (F-02).
    recommend: >-
      Count group operations and Velu evaluations instead of seconds (both are
      already tracked), or repeat the timing. Report all three ratios or none.
  - id: F-19
    severity: minor
    scope: harness/run_volc_mtgt.py build_table used as the rebuild baseline
    what_i_checked: What the "rebuild" arm actually costs.
    what_i_found: >-
      `build_table` computes [s]P by an independent double-and-add for every
      s = 1..size, i.e. O(log s) group operations each, where a table of CONSECUTIVE
      multiples is built with one addition per entry. The rebuild baseline is
      therefore inflated by roughly a log factor, which flatters
      `transport_over_rebuild` in transport's favour. The verdict_note's conclusion
      (the ST^2 frontier is unmoved) does not depend on the ratio and stands.
    recommend: Build the baseline table incrementally, or state the inefficiency.
  - id: F-20
    severity: material
    scope: harness/isogeny_class.py verify_transport; the campaign's transport-certificate claim
    what_i_checked: >-
      Whether the function the instrument's module docstring names as the transport
      certificate ("`verify_transport` re-derives k on the target curve and
      compares") is exercised by any executed run. I grepped every call site in the
      snapshot and then called it myself.
    what_i_found: >-
      `verify_transport` is NEVER CALLED by any of the six executed experiments; the
      only occurrences are its own definition, the module docstring and `__all__`.
      `rational_isogeny_count` is likewise dead. RUN-MTGT uses a separate inline
      per-entry check. Called directly, `verify_transport` verifies correctly at
      ell=3 (order_preserved, dlog_preserved, verified all true) and RAISES
      IndexError at ell=2 because it indexes `kernel_pts[0]` on an empty list -- the
      same even-ell defect as F-02, merely hidden in run_mtgt.
      On the independence question specifically: what the MTGT inline check
      establishes IS independent of the isogeny computation in the sense that
      matters -- it recomputes [s]phi(P) on the target curve with plain
      double-and-add from harness/toycurve.py and compares against the transported
      entry, so a Velu bug that broke the homomorphism property would be caught. What
      it does NOT establish, and what F-02 exploits, is that phi is an isogeny of
      degree ell at all: the identity map passes every clause.
    recommend: >-
      Either call `verify_transport` from run_mtgt (and fix the even-ell path) or
      stop describing it as the campaign's transport certificate. Add the
      non-degeneracy clauses named in F-02.

