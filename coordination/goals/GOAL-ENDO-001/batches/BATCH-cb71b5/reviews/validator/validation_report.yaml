    result: 12/12 configurations pass every clause. No identity maps at odd ell.
    status: passed
  - id: C-06
    control: Wilson-Hilferty adequacy at the df actually used
    method: >-
      Compared the WH 95% acceptance interval against exact chi-square quantiles
      computed from the regularized incomplete gamma function (mpmath, 30 dps) at
      df = 39, 40, 60, 97, 103, 137, 140 -- the full range n_curves-1 takes in this
