      itself is now superseded by CORR-20260807-a05e1e for between-class use; see
      L-02.
  - check: correspondence validity
    result: >-
      NOT APPLICABLE in the exemplar's sense (no Deuring-style substitute sampling).
      The nearest analogue is the census, which substitutes a class-number identity
      for exhaustive verification, and it IS certified against the theorem
      (Deuring/Hurwitz-Kronecker) and independently reverified here (C-01).
  - check: scale binding
    result: >-
      PASS. Everything runs at p <= 100003 (17 bits), DECOMPOSITION.md section 6
      caps every record at claim_tier toy, and no run record asserts otherwise. No
      crypto-scale claim appears anywhere in the batch.
  - check: cost-unit honesty
    result: >-
      REVISE. The MTGT cost tables declare wall-clock seconds but not a group- or
      field-operation count, report no memory beside time, and are single-shot at
      the sub-millisecond scale (F-18). The EWALK `prediction` field declares group
      operations but uses the wrong constant for the implemented algorithm (F-12).
      The JINV Groebner numbers are correctly declared as implementation-bound
      proxies in code but not in the metrics (F-09).
  - check: cost bookkeeping (per-attempt cost x inverse success probability)
    result: >-
      NOT APPLICABLE -- no success-probability-conditioned cost is claimed anywhere in
      this batch, and no asymptotic claim is made. The one place it could bite,
      EWALK, reports solve rates (1.0 and 0.979) alongside step counts rather than
      folding them together, which is the honest presentation.

  cost_model_checks:
  - check: dominated_by declared and checked
    result: >-
      PASS. DECOMPOSITION.md section 6 states every lane is dominated by parallel
      Pollard rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006) and by
      the automorphism-discounted variant (KN-TECH-018), with sota_delta zero and no
      speedup claimed. That is consistent with everything I measured: the largest
      effect in the batch is a sqrt(3) constant that the cited baseline already
      contains.
  - check: memory reported beside time
    result: FAIL for MTGT (F-18). Manifest-level peak_rss is recorded for every run,
      but the experiment's own cost comparison is time-only.
  - check: optimistic assumptions flagged
    result: >-
      PARTIAL. The EWALK ceiling_note and the MTGT verdict_note are both candid and
      correct. The rebuild baseline's inefficiency (F-19) and the single-shot timing
      (F-18) are not flagged.

  proof_architecture_checks:
  - check: baseline fixture / exact baseline reproduction
    result: >-
      PASS. The census reproduces the Hurwitz-Kronecker baseline exactly (not
      approximately) on 304 ordinary traces across two primes plus 252 at p=4001,
      and the global mass identity sum_t W(t) = 2p holds exactly at all three primes.
  - check: strictness witness for an improvement claim
    result: >-
      NOT APPLICABLE -- no improvement is claimed. The one measured ratio (EWALK
      1.641) is explicitly bounded by a pre-stated ceiling and is reported as
      calibration, which is the correct handling. F-11 concerns its precision, not
      its direction.
  - check: observation collisions bound to enumerated scope
    result: >-
      PASS with one gap. The within-class measurements are over a CERTIFIED-COMPLETE
      class (138 of 138 curves), which is the strongest possible scope binding and I
      verified the completeness independently. The gap is F-16: the VOLC "level"
      observable collides exactly with the ICINV `two_torsion_x` observable and the
      collision is not declared.
  - check: interface preservation across the transport arrow
    result: >-
      PARTIAL. Determinism, order preservation and the discrete log are all
      preserved and independently checked at odd ell (C-05, and the MTGT per-entry
      check). Degree and non-degeneracy are NOT checked, which is exactly what F-02
      exploits.
  - check: method ceiling and nearby-object control
    result: >-
      PASS on the ceiling (sqrt(|Aut|/2) is correctly derived from the method's own
      resource measure -- both arms quotient by negation, which I verified
      independently via the birthday-bound match in M-08). FAIL on the nearby-object
      control: the preregistered nearby object is the generic curve, and that arm is
      a tautology (F-10), so the control was not actually run.
  - check: quantifier fidelity
    result: >-
      PASS. No universal claim is made from the per-instance witnesses; every
      conclusion is scoped to the tested primes, traces and curves, and
      DECOMPOSITION.md section 6 states the scope explicitly.

  validation_ladder_checks:
    note: >-
      docs/inventor-protocol.md section 6 applies only weakly here because NO
      improvement is claimed at any scale. Recorded for completeness.
    step_1_assumptions_isolated: >-
      PASS. Enumeration completeness, the liftable identity, instrument sensitivity
      and the transport property are each isolated and measured separately, each with
      a named failure mode. The census in particular names the failure mode it caught
      (imprimitive forms, 60 of 127 traces at p=1009) rather than asserting success.
    step_2_scaled_down_pipeline_with_measured_ratio: >-
      NOT APPLICABLE -- there is no claimed speedup to observe as a ratio. The one
      ratio measured (EWALK) IS a measured ratio against a same-code baseline rather
      than a projection, which is the right shape; its weakness is precision (F-11)
      and the fact that its negative case is a tautology (F-10), not extrapolation.
    step_3_real_scale_cheats: NOT APPLICABLE -- no real-scale partial run exists.
    step_4_reproducibility_pointer_exercised: See C-12. Partially failed.

  null_object_controls:
    assessment: >-
      This batch is unusually good on this axis and I want to say so plainly. Every
      reported number that could be an artifact has a matched null: the instrument
      has a two-directional control that is BLOCKING and that I reproduced (C-06,
      M-04); over-dispersion is measured against its own binomial sampling
      distribution, which I independently calibrated (C-07); grouping information is
      measured against a label permutation with group sizes held fixed, whose tail
      convention I verified is correct (C-08); and the campaign ran a DECAY TEST
      asking what the liftable-density signal should do as the window grows to the
      full field -- which is precisely the inventor-protocol section 3 move. The one
      missing null is C-11: there is no null object for the transport certificate,
      and the identity map is exactly the null object that would have been caught
      (F-02).
    decay_behaviour: >-
      The decay test behaves as the mathematics requires, and the run's own verdict
      to the contrary is a threshold bug (F-05). Within-class liftable count-variance
      rises with window size and then collapses to Var(z)/4 at W = p, which is
      exactly what the identity predicts. This is the correct outcome and should be
      reported as a PASSED decay control, not as "investigate".

  limitations:
  - id: L-01
    text: >-
      I could NOT verify controls against a frozen experiment contract, because no
      contract exists for any of the seven experiments (F-04). Everything I say about
      controls is a statement about the controls that WERE run, verified against the
      code and against DECOMPOSITION.md section 5; it is not a statement that these
      are the controls that were declared before execution.
  - id: L-02
    text: >-
      CORR-20260807-a05e1e (target-sampler confound) and CORR-20260807-2c9ae4 (decay
      verdict) were committed in snapshot 96f0b5ca DURING this review and are outside
      the snapshot my task card names. I did not validate them as records. I note
      independently that (a) my own F-13 identifies the same cross-curve dependence
      mechanism in `_targets` from first principles, and (b) my M-05 confirms
      CORR-2c9ae4's arithmetic exactly, including its stated 2.9e-14 residual. I did
      NOT re-run the permutation null on the `-uniform` runs, because those artifacts
      are not in 22eb74ba and my contract forbids validating working-tree-only
      receipts; that check should be dispatched against a committed snapshot.
  - id: L-03
    text: >-
      The specific claim I was asked to reproduce -- "the m=3 decomposition-rate
      over-dispersion is fully explained by sum-set size |3V|, residual-to-binomial
      variance ratio 0.73 at p=2003" -- DOES NOT APPEAR ANYWHERE in the reviewed
      snapshot. There is no p=2003 ICINV run in 22eb74ba, no |3V| covariate is
      computed by any committed code, and no residual-variance analysis exists in any
      run record, in DECOMPOSITION.md, or in either correction. I could not reproduce
      a number that is not in the artifacts under review; status `not_verified`.
      What I CAN answer, and do: (i) the m=3 over-dispersion is real and large at
      p=4001, ratio 1.37-2.20 across all four classes with chi2 of 133-302 against
      accept ceilings of 126-171, and it is NOT a calibration artifact (C-07). (ii) A
      residual-to-binomial ratio BELOW 1 IS ITSELF A PROBLEM, not a success. Under the
      intended model -- true rate r_i a function of |3V_i|, observations
      Binomial(T, r_i) independent across curves -- the residual variance is bounded
      BELOW by the binomial variance, with equality only if |3V| absorbs all
      systematic variation. A ratio of 0.73 means the residuals are 27% LESS variable
      than independent sampling noise, which is impossible under that model and
      therefore falsifies one of its assumptions rather than confirming the
      explanation. The three live explanations, in order of likelihood here: fitting
      the covariate in-sample without an (n-k)/n degrees-of-freedom correction;
      cross-curve dependence of the targets, which this harness demonstrably has
      because `_targets` uses a curve-independent hashed x-sequence so every curve is
      probed with an overlapping target multiset (F-13); and |3V| being a
      deterministic function of the same data. "Fully explained" is not a supportable
      reading of a sub-1 ratio in any of those cases. If the number is real, it should
      be re-derived with an out-of-sample or cross-validated residual and with targets
      drawn independently per curve.
  - id: L-04
    text: >-
      I did not re-run RUN-JINV-p1009-a end to end (sympy Groebner over 22 curves x
      24 targets, wall time dominated by F-09's own noise problem). I verified its
      load-bearing exact quantity (S_3 support) by independent hand derivation and
      its certificate by inspection; the Groebner timings are UNVERIFIED and, per
      F-09, are not measurements I would recommend anyone rely on.
  - id: L-05
    text: >-
      I did not verify the batch's ledger records beyond the goal record and
      CORR-20260807-df0585, and I did not run tools/validate_ledger.py against these
      records (the batch commit message reports 122 pre-existing errors on main and
      zero from these records; I did not confirm that count).
  - id: L-06
    text: >-
      Resource records (peak_rss_bytes, cpu_seconds) are present in every manifest but
      I did not attempt to verify them; they are not reproducible quantities.
  - id: L-07
    text: >-
      The working tree changed under me throughout (five new RUN directories, two
      modified harness modules, one new Coordinator commit). Everything above is
      pinned to 22eb74ba. If any producer has since fixed any of these findings in
      the working tree, that fix is not in the snapshot I was asked to validate and
      is not credited here.

  what_i_am_explicitly_NOT_saying:
  - >-
    None of the findings above shows a mathematical error in the campaign's
    conclusions. The census is right, the identity is right, Velu is right, the
    statistics are right, and the two negatives the campaign reports (no detectable
    class information, no detectable volcano-level information) survive my attack on
    them. The defects are receipt integrity, one dead measurement (F-02), two
    unreproducible records (F-03), and reporting precision.
  - >-
    A passed or revised artifact verdict here means the receipt is admissible
    evidence. It does not support any ECDLP claim, does not demonstrate a speedup,
    and does not authorise promotion of anything.
  - >-
    The EWALK 1.641 is consistent with the sqrt(|Aut|/2) ceiling and never exceeds
    it. That is a calibration result, exactly as the lane intended, and it is NOT
    evidence of any advantage over the automorphism-discounted rho baseline that
    KN-TECH-018 already records.

