red_team_report:
  id: RT-20260807-6042b7
  task_id: TASK-20260807-redteam-cb71b5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  role: red-team
  reviewed_snapshot: 22eb74baa5e22f1ffcd974dc58e88395797ed3c4
  reviewed_branch: claude/ecdlp-endomorphism-analysis-4m2w3z
  independent_session: true
  originated_the_claim: false

  snapshot_drift_note: >-
    HEAD moved from 22eb74ba to 96f0b5ca ("snapshot 2: 109 proposals, 108 draft
    contracts, sampler correction") during this review, and CORR-20260807-a05e1e,
    CORR-20260807-2c9ae4, EXP-ICINV-9b1f7c and EXP-JINV-dd60d3 landed with it. I
    reviewed 22eb74ba as instructed and read the later state only to check which
    objections were already self-caught. Where the Coordinator's mid-task update
    supplied corrected numbers I attack those numbers, as directed. Working-tree
    artifacts are named where they bear on a conclusion but are never treated as
    durable evidence.

  claim_under_review: >-
    The five conclusions C1-C5 the Coordinator proposes to enter in the ledger for
    BATCH-cb71b5: (C1) within a completely enumerated F_p-isogeny class the measured
    attack-cost functionals reduce to exact class invariants, the 2-torsion structure,
    or sum-set size, and a label-permutation null shows the class grouping carries no
    detectable information about decomposition rate; (C2) a special j-invariant
    genuinely simplifies S_3 (9/10 monomials against 13) but moves Groebner cost by
    only ~3%, dominated by the factor-base polynomials; (C3) the automorphism-quotient
    walk speedup is bounded by sqrt(|Aut|/2), measures 94.7% of it, and the shortfall
    is fruitless-cycle cost; (C4) volcano level carries no detectable information
    (p=0.391); (C5) a preprocessing table transports across an ell-isogeny with every
    entry certified at ~1/6 the cost of rebuilding, moving a point on the ST^2=N
    frontier but not the frontier.

  # ------------------------------------------------------------------
  per_conclusion_verdict:
    C1:
      verdict: OVERSTATED
      one_line: >-
        The null clause survives on the corrected instrument and should be kept; the
        "reduce to" clause does not, because the batch's own pre-registered prediction
        of ZERO within-class variance in relation yield is falsified at two primes on
        the corrected sampler, and "or sum-set size |3V|" names that variance rather
        than explaining it.
      keep: >-
        "At p in {4001, 6007}, m in {2,3}, |V| <= 40, under a uniform target sampler,
        the isogeny-class grouping carries no detectable information about
        order-normalised decomposition efficiency (permutation p = 0.131, 0.295 at
        p=4001; 0.196, 0.691 at p=6007), and #E and the S_3 monomial support are
        exactly class-invariant, as they must be."
      drop: >-
        Any wording that reads as invariance of relation yield, and the superseded
        p-values 0.538 / 0.062 (forbidden by CORR-20260807-a05e1e).
      objections: [O1, O2, O3, O4, O5, O16]
    C2:
      verdict: OVERSTATED
      one_line: >-
        The monomial-support half is SOUND and I re-derived 13/9/10 by hand. The cost
        half quotes a figure that appears in no run metric, in a direction the data
        does not support, with no dispersion estimate and no ablation behind
        "dominated by the factor-base polynomials".
      keep: >-
        "S_3 has exactly 13 monomials generically, 9 at j=0 (a=0) and 10 at j=1728
        (b=0). This is an exact symbolic fact, independent of any sampler."
      drop: >-
        "~3%", and the attribution to the factor-base polynomials.
      objections: [O6, O7]
    C3:
      verdict: OVERSTATED
      one_line: >-
        The sqrt(|Aut|/2) ceiling is CORRECTLY stated and correctly incremental
        against this program's negation-inclusive rho convention. Everything after it
        is one draw from a distribution whose mean sits ON the ceiling, and the
        attributed cause is contradicted by the run's own counter.
      keep: >-
        "The corrected automorphism-quotient walk solves 48/48 and does not exceed
        sqrt(|Aut|/2) beyond negation in the mean; the discount is a constant, never
        an exponent (KN-TECH-018)."
      drop: >-
        "94.7%" as a measured quantity, and "the shortfall is fruitless-cycle cost".
      objections: [O8, O9]
    C4:
      verdict: UNSUPPORTED
      one_line: >-
        Volcano level was not measured. The stratifying variable is character-for-
        character the 2-torsion root count, it resolves floor vs non-floor only, and
        the crater - the maximal-order case the lane exists to test - is 3 of 138
        curves pooled with 63 others. I ran the correct 5-level test; the conclusion
        survives, but as my measurement, not the batch's.
      keep: >-
        Nothing as evidenced. As a hypothesis it is now supported by RT-20260807-6042b7
        section 10 of the notes, at p=4001 only, with the crater unpowered.
      drop: >-
        The phrase "volcano level" and the figure p=0.391 as evidence about End(E) depth.
      objections: [O13, O4]
    C5:
      verdict: REFUTED
      one_line: >-
        The ell=2 run measures the identity map; the 6x is against a rebuild baseline
        inflated by log2(N) for the table shape actually used, and against a correct
        baseline transport LOSES at every odd ell; and the experiment costs an
        operation no attacker would perform.
      keep: >-
        "Transport is exact: 400/400 and 300/300 entries pass an independent per-entry
        certificate on the target curve at ell = 3 and ell = 7. The ST^2 = N
        preprocessing frontier is unmoved, because T1 preserves N and therefore
        preserves the bound - this is a theorem, not a measurement."
      drop: >-
        "~1/6 the cost of rebuilding", and RUN-MTGT-p4001e2 entirely.
      objections: [O10, O11, O12]

  # ------------------------------------------------------------------
  objections:

    - id: O1
      severity: critical
      conclusion: C1
      exact_claim_attacked: >-
        "the measured attack-cost functionals reduce to: exact class invariants,
        the 2-torsion structure, or sum-set size |3V|"
      argument: >-
        DECOMPOSITION.md section 5 prediction 1 was pre-registered as "**zero**
        variance in relation yield (which depends on N and factor-base size only)".
        It is falsified. On the CORRECTED uniform-sampler instrument
        (EXP-ICINV-9b1f7c), the target class at p=4001 AND at p=6007 reports
        decomp_rate_m2 and decomp_rate_m3 both `over-dispersed` against their own
        binomial null. On the committed p=4001 run the m=3 variance ratio is 2.04
        (chi2 = 279 on df = 137); my replication of the committed code at p=2003
        gives over-dispersion in EVERY class, ratios 1.48-5.92. Within the p=4001
        t=30 class, best/worst relation yield is 1.497x and best/mean is 1.164x, and
        neither the 2-torsion count (means 0.5334 vs 0.5275) nor |Aut| (constant 2)
        explains it. "or sum-set size |3V|" is a re-description of the varying
        quantity, not an account of it - |mV| IS the thing that varies. The
        campaign's own T3 says that when C varies the campaign gets a target,
        min over the class of C. C1 as drafted converts a falsified prediction into
        a definition and closes the gating lane on it. Under AGENTS rule 8 the
        falsification must be recorded as such.
      cheapest_falsification: >-
        Already run, in the batch's own artifacts: read the `verdicts_target` block of
        RUN-ICINV-p4001-uniform and RUN-ICINV-p6007-uniform. If either reports
        `invariant` for decomp_rate at either m, O1 fails.

    - id: O2
      severity: critical
      conclusion: C1
      exact_claim_attacked: >-
        the implicit claim that the over-dispersion in decomposition rate is an
        artifact of sum-set saturation and therefore carries no attack content
      argument: >-
        Inventor-protocol section 3 requires naming the parameter that should destroy
        the signal and showing it does. For a sum-set functional that parameter is
        |mV|/#E. The batch ran a window-decay control for liftable_density and NO
        decay control for decomp_rate, and it chose fb_m3 = 13, which is the most
        saturated point available (rate 0.53). I ran the missing control on the same
        class with the committed code, varying only |V|:
        ratio 0.930 (rate 0.023), 1.032 (0.044), 1.175 (0.075), 1.265 (0.114),
        1.337 (0.224), 1.826 (0.369), 2.037 (0.531); the verdict flips from
        `invariant` to `over-dispersed` at rate 0.114. So the over-dispersion DOES
        decay as the density falls - which is the correct behaviour for a saturation
        artifact and is a point in the batch's favour - but it is still 1.27-1.34 at
        densities 0.11-0.22, which bracket the 1/m! = 0.167 density at which a real
        m=3 decomposition operates. The batch measured at the one density where the
        artifact is largest and reported the result as the general case.
      cheapest_falsification: >-
        Hold |mV|/#E fixed at ~1/6 by choosing |V| per prime, and sweep p over
        {2003, 4001, 6007, 10007, 16001}. If the variance ratio decays toward 1 as p
        grows - the Weil-error scaling p^{-1/2} predicts it should - the invariance
        conclusion is earned and C1 can be written strongly. If it stays flat, that is
        the canonical artifact tell inverted: a real within-class signal, and L1 must
        stay open. Cost: 5 runs, ~4 minutes each in the existing harness.

    - id: O3
      severity: major
      conclusion: C1
      exact_claim_attacked: >-
        "a label-permutation null shows the isogeny-class grouping carries no
        detectable information about decomposition rate"
      argument: >-
        Two problems, one already conceded and one not. (a) The p-values C1 was
        drafted around, 0.538 and 0.062, are exactly the rows CORR-20260807-a05e1e
        forbids citing; cite RUN-ICINV-p4001-uniform / p6007-uniform instead.
        (b) NOT conceded: NULL-C was never power-characterised. EXP-INSTR-2d32ba
        certifies NULL-B only - both directions of its control carry
        `null_kind: NULL-B binomial` - so goal completion criterion C4 ("every
        instrument used to support any conclusion has passed both directions of its
        RQ-INSTR-f8faa0 control") is UNMET for the instrument C1 and C4 lean on.
        I characterised it: planting a between-class mean shift into the real p=4001
        rate_m3 values, NULL-C detects delta = 0.005 (0.9% of the mean) with power
        1.00 and delta = 0.002 with power 0.08. NULL-C is a between-class MEAN
        detector - which is precisely the #E confound a05e1e identifies - and it has
        no defined sensitivity to within-class structure, which is the campaign's
        actual question (that is NULL-B's job, and NULL-B says over-dispersed). Also
        note NULL-C's median p on the unperturbed real data is 0.059, not 0.5: the
        baseline already leans low from the #E spread.
      cheapest_falsification: >-
        Add a NULL-C arm to EXP-INSTR: synthesise curves in fake classes with a
        planted within-class structure that leaves class means equal, and report the
        smallest structure NULL-C sees. ~20 lines, seconds to run. If it detects a
        within-class effect at all, O3(b) fails.

    - id: O4
      severity: major
      conclusion: [C1, C4]
      exact_claim_attacked: >-
        every negative in the batch, wherever it is phrased as "no detectable
        information" or "carries no information" rather than as a bound
      argument: >-
        EXP-INSTR-2d32ba does record a sensitivity floor and its own note says a null
        "bounds within-class variation only BELOW this spread; it does not establish
        exact invariance". That honesty must survive into the ledger text, with
        numbers. Computing the floor at the parameters actually used (chi-square
        dispersion, Wilson-Hilferty band, as the harness does): EXP-ICINV target class
        (n=138, T=400) detects variance ratio >= 1.250, i.e. an excess sd >= 2.36% of
        the mean; control classes (n=98) >= 2.58%; EXP-VOLC whole class (n=138, T=300)
        >= 3.19%; the larger VOLC stratum (n=72) >= 3.80%; and the CRATER stratum
        (n=3) >= 9.82%, which bounds nothing. On the question of whether an effect
        could appear only at crypto scale, the answer splits and both halves matter.
        For the functionals actually measured - liftable density, decomposition rate,
        all Weil-error-driven - relative within-class spread scales like p^{-1/2}, so
        toy scale is the MOST favourable place to see them and a toy null is a genuine
        (if narrow) bound. For the functionals L1 declares and the batch did not
        measure - solving degree, first-fall degree, Macaulay rank profile - the
        answer is yes: at p=1009, m=3 the Groebner max degree is 4 in every arm, so
        there is no regularity to measure and toy scale has essentially zero power on
        exactly the quantities that carry index-calculus cost. C1 and C4 must not be
        allowed to read as bounds on those.
      cheapest_falsification: >-
        None needed; this is a wording obligation. It fails only if the ledger text
        states the bounds with these numbers and the tested scope.

    - id: O5
      severity: critical
      conclusion: C1
      exact_claim_attacked: >-
        "the measured attack-cost functionals" - i.e. the sufficiency of the measured
        set, and hence the closure of the gating lane L1
      argument: >-
        The charge of near-circularity is upheld. L1 declares five functionals:
        Semaev/Groebner solving degree, first-fall degree, relation yield, factor-base
        decomposition probability, Macaulay rank profile. The batch measured items 3
        and 4 - which are the same quantity, and the one pair that is ~|mV|/#E with
        #E class-invariant by construction - and did not measure items 1, 2 or 5,
        which are the ones that carry the attack cost and the ones that could vary.
        Worse, relation yield is measured by EXHAUSTIVE ENUMERATION of the sum set
        and membership testing. That measures the decomposition PROBABILITY. Index
        calculus does not pay the probability; it pays the cost of DECIDING and
        FINDING a decomposition, which is the polynomial-system solve. The batch has
        measured the numerator of the wrong fraction. See `unmeasured_functionals`
        below for the concrete list, which is the deliverable requested.
      cheapest_falsification: >-
        Measure item (U1) below - the Macaulay/first-fall degree profile - on 40
        curves of the p=4001 t=30 class. It needs no Groebner engine: build the
        Macaulay matrix of <S_3(x1,x2,xT), f_V(x1), f_V(x2)> degree by degree and
        record the degree of first rank deficiency. Pure Python linear algebra over
        F_p, ~150 lines, minutes. If the profile is identical on all 40 curves, O5
        fails for that functional and C1 becomes much stronger than it currently is.

    - id: O6
      severity: major
      conclusion: C2
      exact_claim_attacked: >-
        "the Groebner cost ... moves by only ~3%"
      argument: >-
        No metric in any JINV run equals 3%. RUN-JINV-p1009-a reports
        gb_seconds_ratio_vs_generic = 0.9956 (j0, -0.44%) and 0.9933 (j1728, -0.67%).
        The corrected RUN-JINV-p1009-uniform reports 0.9877 (j0, -1.23%) and 1.0113
        (j1728, +1.13%) - the j1728 effect CHANGES SIGN between samplers, which is by
        itself sufficient to establish that these differences are noise. The only ~3%
        quantity anywhere is gb_size_mean for j1728 at +3.41%, i.e. the special-j
        basis is LARGER, the opposite of the claimed direction. And no arm reports any
        dispersion estimate: 6, 4 and 12 curves times 14 targets, one repetition, no
        CI. A sub-1% wall-clock difference in a sympy Buchberger run is unresolvable
        at that design.
      cheapest_falsification: >-
        Report a bootstrap CI on gb_seconds_mean per arm from the per-target timings
        already in the raw records. If the j0 and generic intervals are disjoint, O6
        fails.

    - id: O7
      severity: major
      conclusion: C2
      exact_claim_attacked: >-
        "the Groebner cost is dominated by the factor-base polynomials"
      argument: >-
        Nothing in any run splits the ~0.206 s into an S_3 component and a factor-base
        component. This is a causal attribution with no ablation behind it. It is also
        the load-bearing half of C2 - it is what converts "31% fewer monomials" into
        "does not matter" - so it cannot ride on plausibility. Separately, note that
        the whole comparison sits at gb_max_degree = 4 in every arm, i.e. in a regime
        where the system is trivial and there is no solving degree to speak of; a
        monomial-support difference that mattered would have to show up in the degree
        of regularity, which this design cannot see (see O4, O5).
      cheapest_falsification: >-
        One ablation, minutes: time the same ideal with the factor-base polynomials
        f_V(x1), f_V(x2) replaced by generic dense polynomials of the same degree, and
        again with S_3 replaced by a dense degree-4 form of full support. Two numbers
        settle the attribution. If the factor-base substitution moves the time and the
        S_3 substitution does not, O7 fails.

    - id: O8
      severity: critical
      conclusion: C3
      exact_claim_attacked: >-
        "measures 94.7% of it; the shortfall is fruitless-cycle cost"
      argument: >-
        Two independent refutations. (a) The 1.641 is one draw. Running the committed
        run_ewalk2 unmodified at the same p and trials across 8 seeds gives
        1.3705, 1.6411, 1.6521, 1.6806, 1.7100, 1.8646, 1.9227, 2.0333: mean 1.7344,
        sd 0.2046, against a ceiling of sqrt(3) = 1.7321. The mean sits ON the
        ceiling; 1.641 is 0.4 sigma below it; and 3 of 8 seeds EXCEED it. At seed 4
        the ratio-to-ceiling is 1.1739, which trips the harness's own
        `exceeds_incremental_ceiling_by_15pct` and therefore GOAL-ENDO-001 pause
        condition P3. I am NOT claiming the walk beats sqrt(|Aut|) - I am claiming
        that at n=2 curves x 24 trials the design can support neither a "94.7%"
        reading nor an "exceeds" alarm, and that the reported seed happens to be one
        where the alarm does not fire. (b) `fruitless_total` is 0 in every arm of the
        reported run. The run's own counter says there was no fruitless-cycle cost to
        attribute the shortfall to. A more likely mechanism, if the shortfall is real,
        is that canonicalisation to the lexicographically smallest of 6 orbit elements
        biases the x-coordinate downward and so biases the r=32 partition function
        `cR[0] % r`, degrading walk randomness - an instrument artifact, not a
        property of automorphism-quotient rho.
      cheapest_falsification: >-
        Re-run at 16 curves x 200 trials across 5 seeds and report the speedup with a
        bootstrap CI, plus the empirical distribution of `cR[0] % 32` in each mode. If
        the CI excludes sqrt(3) from below and the partition distribution is flat,
        O8(a) fails and the shortfall is real.

    - id: O9
      severity: major
      conclusion: C3
      exact_claim_attacked: >-
        the standing of the generic arm as a self-check, and the completeness of the
        remedy required by CORR-20260807-df0585
      argument: >-
        CORR-20260807-df0585 requires that "any future automorphism-quotient walk in
        this program must ... include the generic-curve arm as a self-check, where a
        speedup of exactly 1.000 is the required output". In run_ewalk2, for
        kind == "generic", zeta is None, so phi = None, lam = None and aut_used = 2 in
        BOTH modes: rho() receives identical arguments and is deterministic. The raw
        rows confirm it - identical mean_steps to the digit in every configuration I
        ran. The check therefore CANNOT fail, and more importantly the
        `lam != +-1` branch of `canon` - the exact site of the defect the correction
        was written about - is never executed in the generic arm. The mandated
        self-check is structurally incapable of detecting the defect class it was
        mandated for. Compounding this, the |Aut| = 4 case, where the old defect
        produced the 260x slowdown, was REFUSED at p = 100003 (100003 = 3 mod 4) and
        so has never been re-measured. I ran it at p = 100057 (= 1 mod 12): j1728
        observed 1.3974 against ceiling sqrt(2) = 1.4142, ratio 0.9881, 48/48 solved,
        0 fruitless; j0 1.9292, ratio 1.1138. The corrected code IS sound at |Aut| = 4
        - but that is my measurement, and it cost 0.3 seconds.
      cheapest_falsification: >-
        Add a mutation arm: run j0 in quotient mode with a deliberately wrong
        eigenvalue lam' = lam + 1 and confirm the walk degrades to at least the plain
        arm. That is a real self-check and it is three lines. Also re-run at
        p = 100057 so both special j values appear in one record.

    - id: O10
      severity: critical
      conclusion: C5
      exact_claim_attacked: >-
        RUN-MTGT-p4001e2's status as a measurement of isogeny transport at all
      argument: >-
        `velu_odd` loops `range((ell-1)//2)`, which is EMPTY at ell = 2, so it returns
        (a, b) unchanged; `transport_table` then calls `velu_image` with an empty
        kernel list, which returns its argument. Verified: source (a,b) = (444,888),
        target (a2,b2) = (444,888), j = 737 on both sides, velu_image(P) == P. The run
        measures the IDENTITY MAP. Its `same_isogeny_class: true`,
        `transport_certificate_verified: true`, `entries_lost_to_kernel: 0` and
        `all_entries_on_target_curve: true` are all trivially true of the identity,
        and its transport_over_rebuild = 0.0575 is the most favourable ratio in the
        batch - it is the cost of copying 300 tuples. The record is committed
        `valid: true` with no correction. `run_volc` refuses ell != 2; `run_mtgt`
        refuses nothing.
      cheapest_falsification: >-
        Print (a2, b2) alongside (a, b) in the record. If they differ at ell = 2, O10
        fails. They do not.

    - id: O11
      severity: critical
      conclusion: C5
      exact_claim_attacked: >-
        "at ~1/6 the cost of rebuilding"
      argument: >-
        `build_table` is `[(E.mul(s,P), s) for s in range(1, S+1)]` - a full
        double-and-add per entry - for a table of CONSECUTIVE multiples, which costs
        one addition per entry ([s]P = [s-1]P + P). Measured inflation of the rebuild
        baseline: 10.6-11.8x across eight (p, ell) settings, i.e. exactly log2(N), as
        the algorithm predicts. Against a correct rebuild, transport LOSES everywhere:
        ratios 1.64 (ell=3), 3.13 (5), 4.20 (7), 7.12 (11), 8.72 (13), 15.74 (23).
        Against the batch's own baseline the ratios are 0.140, 0.271, 0.394, 0.672,
        0.751, 1.344, and a least-squares fit gives transport/rebuild = 0.0601*ell -
        0.0256, crossing 1.0 at ell = 17.1 - so even on the batch's own terms
        transport stops winning at ell ~ 17, and the batch reported ell = 3 as the
        headline. The scale-free statement, which is what belongs in a ledger:
        transport costs (ell-1)/2 Velu evaluations per entry, each ~1 inversion plus
        O(1) multiplications; a consecutive-multiples rebuild costs 1 addition per
        entry, ~1 inversion plus 3 multiplications. The ratio is therefore ~(ell-1)/2,
        INDEPENDENT of p and N, and 6x is an artifact of toy log2(N) = 10 plus the
        wrong baseline. If the intended object is instead a random-multiples table -
        where each entry genuinely costs a scalar multiplication - the ratio is
        ~(ell-1)/(2*log2 N), and at crypto scale log2 N = 256 rather than 10, so the
        toy number understates the crypto-scale advantage by ~25x, in the other
        direction. Either way "~1/6" is not a scale-free constant and must not be
        written as one. Finally, the fixed cost of CONSTRUCTING the isogeny - finding
        the ell-torsion generator, forming the kernel - is excluded from
        transport_seconds entirely; per KN-LIT-7593 an eliminated dimension is not a
        speedup until the invariant's own cost is in the total.
      cheapest_falsification: >-
        Replace `build_table` with the incremental construction and re-run the three
        committed MTGT settings. If transport still wins at ell = 3, O11 fails. It
        does not: the measured ratio becomes 1.64.

    - id: O12
      severity: major
      conclusion: C5
      exact_claim_attacked: >-
        the threat model, and the absence of an affected-vs-safe scope statement
      argument: >-
        T1 is a bijection on instances, so an attacker holding a table on E and a
        target (P', Q') on E' does not transport the table. He pushes the TARGET
        through the dual isogeny at a cost of 2 Velu evaluations - O(ell) field
        operations, independent of the table size S - and solves on E. The experiment
        measured an O(S*ell) operation against an O(S*log N) alternative when the
        relevant operation is O(ell) per target and is paid once. The correct
        multi-target statement is STRONGER than the measured one, and C5's second
        clause still holds - but for a reason the measurement does not supply:
        ST^2 = N is a bound in N, T1 preserves N, therefore the bound is preserved.
        That is a theorem and should be stated as one. On scope: no deployed
        prime-field system publishes two distinct F_p-isogenous curves as separate DL
        instances with the same N, so the multi-target premise is not merely
        unfavourable, it does not arise. The one deployment-relevant instance the
        Coordinator should check and state explicitly rather than leave implicit is
        the Curve448 / Ed448 4-isogeny (RFC 7748 / RFC 8032); Curve25519 and Ed25519
        are birationally equivalent, i.e. isomorphic up to twist, and are outside
        T1's premise entirely. Even for Curve448/Ed448 there is no advantage: both
        carry the same N and the same k, so there is one instance, not two targets.
        Write that as "safe because the setting does not arise", NOT as "safe because
        a different attack dominates" - inflating the second reading would be scope
        inflation in the direction of the claim.
      cheapest_falsification: >-
        Name one deployed protocol that publishes two F_p-isogenous curves with the
        same group order as distinct DL instances. If one exists, O12's scope clause
        fails and L13 acquires a real threat model.

    - id: O13
      severity: critical
      conclusion: C4
      exact_claim_attacked: >-
        "Volcano level (2-volcano, genuine level diversity: 72 curves at degree 1,
        66 at degree 3) carries no detectable information (permutation p=0.391)"
      argument: >-
        Volcano level was not the variable tested. `ell_subgroup_count(E, ., 2)` and
        `exp_icinv.two_torsion_x_count(p, a, b)` are character-for-character the same
        expression, and I verified they agree on all 138 curves. At p=4001, t=30:
        D = -15104 = -59 * 16^2, so the 2-volcano has depth 4 and FIVE levels, with
        sizes h(-59 * f'^2) = 3, 9, 18, 36, 72 from crater to floor, summing to 138 =
        the enumerated class size. The reported strata {1: 72, 3: 66} are the floor
        (72) and levels 0-3 POOLED (3+9+18+36 = 66). End(E)-conductor depth, which is
        the variable L2 declares, takes 5 values; 2 were resolved; and the crater -
        3 curves, maximal order O_K, the single most structurally distinguished case
        and exactly the one the lane exists to test - is invisible, pooled with 63
        non-maximal curves, and at n=3 the design detects nothing below a 9.8% excess.
        I ran the correct test: built the full 2-isogeny graph on the class (Velu with
        a 2-torsion kernel, v = 3x0^2+a, w = x0*v, a' = a-5v, b' = b-7w, edges resolved
        up to (a,b) ~ (u^4 a, u^6 b)), assigned each curve its level by distance to
        the floor, recovered exactly {0:3, 1:9, 2:18, 3:36, 4:72}, and ran the same
        permutation null: p = 0.3115 on true level, against p = 0.3708 on the batch's
        binary. Level means: 0.4800 (crater, n=3), 0.4456, 0.4489, 0.4411, 0.4519.
        So the CONCLUSION survives - but on my measurement, at one prime, with the
        crater unpowered. Additionally, two of the three committed VOLC runs
        (p2003e3, p4001e7) are `valid: true` while the COMMITTED harness now returns
        `{"invalid": True}` for ell != 2, and RUN-VOLC-p4001e7's `levels_observed: [0]`
        is the disclosed miscount; no correction record covers either.
      cheapest_falsification: >-
        Run the 5-level stratification at a prime whose target class has a LARGE
        crater and 2-power conductor - search for t with D = D0*f^2, 2 | f, and
        h(D0) >= 30, so the crater alone carries 30+ curves. That is the only design
        that can say anything about the maximal order. Enumeration cost is the same
        O(p^2) census the batch already pays.

    - id: O14
      severity: major
      conclusion: [C1, C2, C3, C4, C5]
      exact_claim_attacked: >-
        the artifact-policy record backing every run C1-C5 cite
      argument: >-
        All six snapshot-1 manifests record
        `code.commit: e34afdd0c3137c038042cae7c68495c700977afd, dirty: false`.
        `git ls-tree -r e34afdd0` contains NONE of harness/{exp_icinv, isogeny_class,
        run_icinv, run_jinv, run_ewalk2, run_volc_mtgt}.py; they first appear at
        22eb74ba. The tree was necessarily dirty and the recorded provenance is false
        as written. The snapshot-2 runs record it correctly (`dirty: true`, commit
        22eb74ba / 96f0b5ca), so this is a fixed convention error - but C1-C5 cite
        the snapshot-1 runs, so it must be superseded by a correction rather than
        left standing. Separately: no experiment-contract file exists for any of the
        seven experiments, so goal completion criterion C1 ("an archived experiment
        contract with an executed, independently reviewed run") is unmet for every
        lane, and none of C1-C5 may be cited as satisfying it.
      cheapest_falsification: >-
        `git ls-tree -r e34afdd0 --name-only | grep harness/run_icinv`. If it returns
        a path, O14 fails.

    - id: O15
      severity: minor
      conclusion: T5 as carried into C1-C5
      exact_claim_attacked: >-
        "a random class member is reachable in O(log p) isogeny steps under
        GRH-conditional rapid mixing, but a specified one is vectorization-hard"
      argument: >-
        Taking CORR-20260807-2c9ae4 items (B) and (C) as given, I do not re-derive the
        "dies on cost" error. Two residual points remain and are cheap to fix.
        (a) GRH-conditional rapid mixing is a statement about the CRATER Cayley graph
        of Cl(O) with a chosen small-prime generating set. In the class the batch
        actually used, f = 16 and 135 of 138 curves are BELOW the crater, so "a
        uniformly random curve in the class is reachable in O(log p) steps" does not
        follow from crater mixing alone: descending and horizontal steps must be
        counted separately, and the stationary distribution of the natural walk is not
        uniform on the class. (b) None of C1-C5 carries the GRH qualifier, and none of
        them actually invokes T5, so the cheap fix is to drop T5 from the conclusion
        set rather than to restate it. The substantive point that must NOT be lost:
        decomposition rate is computable from (a, b) alone in |V|^m additions with no
        discrete log, so goodness is locally detectable, T5 clause (ii) is satisfied,
        and T5 therefore does NOT close the lane that O1 and O2 leave open. T5 must
        not be used to close L1.
      cheapest_falsification: >-
        None required; this is a statement-hygiene objection. It fails if the ledger
        text either omits T5 or states it with its hypotheses and marks it unmeasured.

    - id: O16
      severity: minor
      conclusion: C1
      exact_claim_attacked: >-
        C1's standing as a closure of the campaign's gating lane
      argument: >-
        C1 as drafted is a closure. Inventor-protocol section 4 requires a named
        obstruction, an argument, and forward guidance naming what remains open. C1
        has a candidate obstruction ("the functionals reduce to class invariants plus
        2-torsion plus sum-set size"), but for the |mV| term the argument is a
        re-description (O1) and the forward guidance is absent. Without it, C1 is a
        report about which functionals this batch chose to measure - a statement about
        the search, not about the problem - and its honest status is `unverified`.
      cheapest_falsification: >-
        Add the forward-guidance paragraph naming `unmeasured_functionals` U1-U6 below
        with parameters and a revisit condition. That converts C1 into a real closure
        of the tested scope.

  # ------------------------------------------------------------------
  # THE REQUESTED DELIVERABLE: functionals that could plausibly vary within an
  # isogeny class, were NOT measured, and would matter for an attack.
  unmeasured_functionals:

    - id: U1
      name: first-fall degree / degree of regularity of the Semaev decomposition ideal
      varies_within_class: >-
        YES, plausibly. The ideal is <S_m(x1..x_{m-1}, xT), f_V(x1), ..., f_V(x_{m-1})>
        and its coefficients are functions of (a, b), which vary within the class. The
        degree of regularity is a discrete integer that can jump; nothing in T4 or in
        H-ENDO-001 constrains it, because it is a property of the polynomial system,
        i.e. resource R1/R2, not of the group.
      matters_for_an_attack: >-
        This IS the index-calculus cost. Relation collection costs
        (1 / decomposition-probability) x (cost of one solve), and the solve is
        d_reg-driven with complexity ~ binom(n + d_reg, d_reg)^omega. A single unit of
        d_reg is worth more than every constant factor in this batch combined. The
        batch measured the probability and not the solve.
      why_it_is_the_top_pick: >-
        It is the one functional in L1's declared list that is (i) unmeasured,
        (ii) not a function of (#E, |V|) by construction, and (iii) exponent-bearing
        rather than constant-bearing.
      cheapest_measurement: >-
        No Groebner engine needed. Build the Macaulay matrix degree by degree over F_p
        and record the first degree at which the rank falls below the number of
        monomials - the first-fall degree - for every curve in the p=4001 t=30 class.
        Pure Python row reduction, ~150 lines. Report the profile as an exact vector
        per curve and use `exact_null_verdict`, not a permutation test: any variation
        at all is a positive.

    - id: U2
      name: Macaulay rank profile and the trivial-solution fraction of the decomposition variety
      varies_within_class: >-
        YES. The JINV runs already record `trivial_fraction` (0.393-0.417 across arms)
        and never analysed its within-class variance. Curves with more trivial or
        degenerate solutions waste more solves per useful relation.
      matters_for_an_attack: >-
        Directly multiplies relation-collection cost, and unlike U1 it is measurable at
        toy scale today with code already in the harness.
      cheapest_measurement: >-
        Re-run the existing JINV `groebner_cost` over the 138 curves of one class
        instead of across j-families, and run `binomial_null_verdict` on
        trivial_fraction. Hours of compute at most; the code exists.

    - id: U3
      name: >-
        the factor-base size |V| required to reach a fixed decomposition rate, i.e. the
        inverse of what was measured
      varies_within_class: >-
        YES, and this is the honest form of the signal O1 and O2 identify. The batch
        fixed |V| and measured the rate; the attacker fixes the target rate and pays
        for |V|. My saturation sweep shows rate(|V|) differs by curve.
      matters_for_an_attack: >-
        |V| sets the linear-algebra dimension, which is the second stage of index
        calculus and is where the memory cost lives. A curve needing 5% less |V| for
        the same yield buys a ~10% linear-algebra saving. Constant-factor, but it is
        the constant an attacker would actually collect, and it is the one T3 tells the
        campaign to minimise over the class.
      cheapest_measurement: >-
        Binary-search |V| per curve to hit rate = 1/m!, report the distribution of
        |V|* across the class, and pair it with a cost model: is
        (search cost to find a good curve) < (saving x number of relations)? That
        arithmetic is the thing that turns O1 from an anomaly into a decision, and the
        batch never does it.

    - id: U4
      name: >-
        the group structure E(F_p) = Z/n1 x Z/n2 and the cofactor's smooth part
      varies_within_class: >-
        YES - CORR-20260807-2c9ae4 item (B) already concedes T4 omitted it. `n1 > 1`
        happens for some class members and not others.
      matters_for_an_attack: >-
        Modest but real and completely concrete: it changes the cost of finding a point
        of exact order N and of clearing the cofactor, it decides whether a rational
        2-isogeny (hence a cheap transport) exists at all, and it changes the
        distinguished-point predicate's collision statistics. It does NOT touch N, so
        it cannot move the exponent - say so explicitly so it is not oversold.
      cheapest_measurement: >-
        `exp_icinv.group_structure` already exists and is called with
        `with_group=False` in every run. Flip the flag.

    - id: U5
      name: >-
        the isogeny-degree profile: the multiset of ell for which E admits a rational
        ell-isogeny, and the graph distance from E to the crater
      varies_within_class: >-
        YES by definition - that is what the volcano is. Never measured as a COST
        functional; only used as a stratification label, and even then wrongly (O13).
      matters_for_an_attack: >-
        It is the transport cost in T1 and therefore the price of every lane that
        proposes to move between curves, including L13/C5. If min-cost curves exist
        (U1, U3), this is what you pay to reach one, and it is the quantity that
        decides whether the T5 gate binds. Currently the campaign asserts a
        reachability dichotomy without having measured either side of it.
      cheapest_measurement: >-
        The 2-isogeny graph construction in section 10 of my notes generalises: for
        each small ell, count roots of Phi_ell(j(E), Y) over F_p. Modular polynomials
        for ell <= 13 are small and tabulable; this also repairs `ell_subgroup_count`
        for odd ell, which currently returns None.

    - id: U6
      name: >-
        the additive-energy / Fourier profile of the factor base as a subset of E(F_p)
      varies_within_class: >-
        Unknown, which is the point. It is the quantity KN-FIND-5c1a03 identifies as
        the precise measure of the prime-field gap ("does the non-algebraic factor
        base achieve algebraic-type Fourier flatness"), and no experiment in this
        campaign touches it.
      matters_for_an_attack: >-
        It is the program's own named structural gap. If it varies within an isogeny
        class, that is a within-class handle on the exact quantity three independent
        analyses converged on. If it does not, that is a strong and citable negative
        connecting GOAL-ENDO-001 to KN-FIND-5c1a03.
      cheapest_measurement: >-
        Additive energy E(V) = #{(a,b,c,d) in V^4 : a+b = c+d} by direct enumeration
        over the same 138-curve class, |V| = 40, against a random-subset null of the
        same size in the same group. O(|V|^2) per curve; minutes. This is the highest
        upside-per-CPU-second item on the list.

    explicitly_dismissed:
      - >-
        Coefficient height / bit-length of (a, b): varies within the class but is
        meaningless over F_p, where every coefficient is p-sized. Not a functional.
      - >-
        Embedding degree, CM field, discriminant D, #E, N, and the S_3 monomial
        support: exactly class-invariant, correctly so, and the batch verified it.
        Measuring them again buys nothing.
      - >-
        Anything evaluated only on points of G: closed on its face by the
        admissibility filter and H-ENDO-001. Do not re-open.

  # ------------------------------------------------------------------
  required_controls:
    - >-
      BLOCKING for C1: the saturation-decay control of O2 - hold |mV|/#E fixed near
      1/m! and sweep p. Without it, C1 cannot distinguish invariance from a saturation
      artifact measured at the one density where the artifact is largest.
    - >-
      BLOCKING for C1 and C4: a NULL-C arm in EXP-INSTR. Goal criterion C4 requires
      both directions of the instrument control for every instrument supporting a
      conclusion; NULL-C has neither.
    - >-
      BLOCKING for C4: the 5-level stratification of O13, and a class chosen so the
      crater is not n=3.
    - >-
      BLOCKING for C5: rebuild the MTGT baseline incrementally (O11) and mark
      RUN-MTGT-p4001e2 invalid (O10).
    - >-
      Required for C3: >= 5 seeds with a bootstrap CI, plus the wrong-eigenvalue
      mutation arm and the p = 1 mod 12 run so |Aut| = 4 appears in a batch record.
    - >-
      Required for C2: a dispersion estimate on gb_seconds_mean, and the factor-base
      ablation.
    - >-
      Required for every negative: state it as a bound with the numbers in O4, and
      state the tested scope (p, m, |V|, sum-set density, sampler).

  counterexample_or_mutation: >-
    The single cheapest mutation that changes a stated conclusion: replace
    `build_table` in harness/run_volc_mtgt.py with the one-addition-per-entry
    construction and re-run the committed MTGT settings. The measured
    transport/rebuild ratio goes from 0.155 to 1.64 at ell = 3 and from 0.415 to 4.20
    at ell = 7, and C5's headline inverts. Nothing else about the experiment changes.
    Runner-up, equally cheap: print (a2, b2) next to (a, b) in the MTGT record, which
    exposes RUN-MTGT-p4001e2 as the identity map.

  baseline_comparison:
    correct_baselines_for_this_regime:
      - "Pollard rho with distinguished points: 0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006). The convention already folds in the sqrt(2) negation discount."
      - "Automorphism-discounted rho on CM curves: 0.886*sqrt(N/|Aut|), i.e. a further sqrt(|Aut|/2), bounded by sqrt(6) (KN-TECH-018, Wiener-Zuccherato, Duursma-Gaudry-Morain). C3's ceiling is correctly stated and correctly incremental."
      - "BSGS: sqrt(N) time and sqrt(N) memory - the memory axis C5 must be compared on."
      - "van Oorschot-Wiener parallel rho: 0.886*sqrt(N)/w on w processors with O(1) memory each. This is the row C5's ST^2 discussion has to sit beside, because it is the practical frontier point for the time-memory axis."
      - "Bernstein-Lange / Mihailescu preprocessing: ST^2 = N up to logs. C5's second clause is correct against this, but by theorem (T1 preserves N) rather than by the measurement performed."
      - "Closest specialized baseline for L1: Gaudry/Diem summation-polynomial index calculus, which does not beat rho over prime fields at all; the batch's Semaev measurements are therefore calibration inside a method that is already dominated."
    sota_delta: >-
      Zero. No conclusion in C1-C5 claims or implies a speedup over any row above, and
      after O8 and O11 none of them supports one either. C3's 1.641 is a constant
      factor already inside KN-TECH-018's sqrt(6) bound; C5's ratio inverts under a
      correct baseline; C1, C2, C4 are negatives.
    dominated_by: >-
      NOT null. Every lane in BATCH-cb71b5 is dominated on all three axes by parallel
      Pollard rho with distinguished points (time 0.886*sqrt(N)/w, memory O(1) per
      processor, data/queries none) and, on CM curves, by its automorphism-discounted
      variant. C5's transport is additionally dominated on time by ordinary table
      construction for every odd ell at every N tested, and on data by the fact that
      it requires a second published isogenous curve, which no deployment provides.
      Checked against every row listed above, on time, memory, and data/queries.

  heuristic_challenges:
    - >-
      The batch states no numbered heuristics, which is correct for a measurement batch
      but means the exemplar-profile heuristic inventory does not apply. What DOES
      apply, and is violated, is the pre-registration in DECOMPOSITION.md section 5.
      Prediction 1 ("zero variance in relation yield") is falsified; prediction 2
      ("no effect stratified by volcano level") is untested because level was not
      measured; prediction 3 ("reproduce sqrt(|Aut|) and nothing more") is confirmed in
      the mean but at a design that cannot resolve it. Pre-registered predictions that
      fail must be recorded as failed (AGENTS rule 8), not absorbed into the
      conclusion's wording.
    - >-
      The one implicit heuristic that IS load-bearing and unstated: that
      exhaustive-enumeration decomposition probability is a proxy for index-calculus
      cost. It is not (O5). If C1 keeps that step it must state it as an assumption
      and pair it with a falsification condition.
    - >-
      T5 is cited, not proved, and is GRH-conditional; C1-C5 carry no qualifier (O15).

  cost_model_challenges:
    - "C5: rebuild baseline inflated by log2(N) = 10.6-11.8x measured; correct scale-free ratio is ~(ell-1)/2, so transport loses for every ell >= 3 on the table shape used (O11)."
    - "C5: isogeny-construction cost excluded from transport_seconds entirely; per KN-LIT-7593 an eliminated dimension is not a speedup until the invariant's own cost is charged."
    - "C5: the measured operation is O(S*ell); the operation an attacker performs is O(ell) per target, independent of S (O12). The experiment costs the wrong thing."
    - "C5: no memory axis anywhere. A preprocessing claim without S beside T is incomplete against BSGS and against van Oorschot-Wiener."
    - "C3: 'per-attempt cost' is reported as mean_steps over 24 trials on 2 curves and never multiplied by an inverse success probability; the generic arm's solve_rate is 0.979, so its mean_steps is a conditional-on-success statistic and its ratio to the j0 arm (solve_rate 1.0) is not like-for-like."
    - "C3: mean_steps is averaged across curves with N = 99667 and N = 11149, which is dimensionally wrong - the pooled mean is dominated by the larger-N curve. The per-curve ratios happen to agree (1.636, 1.658), so nothing is broken here, but the summary statistic should be the mean of per-curve ratios."
    - "C1/C2: no cost model at all is attached to the within-class variation. If relation yield varies by 1.16x above the mean, the attacker's decision is (search cost to find such a curve) versus (yield saving x relation count). That arithmetic is the deliverable and it is missing (U3)."

  reduction_and_scope_challenges:
    - "T1 is elementary and correct and I do not challenge it."
    - "T2 (class-wide vulnerability) follows from T1 only up to transport cost, and transport cost is exactly what U5 says was never measured. The 'up to transport cost' qualifier must survive into any citation of T2."
    - "T4 omitted the group structure - conceded in CORR-20260807-2c9ae4 (B); U4 names it as an unmeasured functional and notes it cannot move the exponent."
    - "T5 as re-stated after CORR-20260807-2c9ae4 (C) no longer closes anything asymptotically, which means it also no longer supports closing L1. Do not let the corrected T5 be used for the purpose the uncorrected one was written for (O15)."
    - "Scope: no deployed prime-field scheme publishes two distinct F_p-isogenous curves as separate DL instances. Curve448/Ed448 (4-isogeny, RFC 7748/8032) is the one instance to check and disclose; Curve25519/Ed25519 is a birational equivalence and is outside T1's premise. Write the safe list as 'the setting does not arise', never as 'a different attack dominates' (O12)."
    - "Every conclusion is toy scale: p <= 100003 for C3, p <= 6007 for C1, p = 4001 for C4, p in {2003, 4001} for C5, p = 1009 for C2. claim_tier: toy, without exception (AGENTS rule 7)."

  proof_architecture_challenges:
    - >-
      Observation-fiber attack, on C4: the observable is `ell_subgroup_count(., ., 2)`.
      I placed distinct ground-truth objects on the same fiber - a crater curve
      (End(E) = O_K, conductor 1) and a level-3 curve (conductor 8) both return 3 -
      and they sit on opposite sides of the claimed conclusion's subject matter. The
      missing separator is the distance-to-floor in the 2-isogeny graph, which I
      computed (O13). This is a direct falsifier of identifiability for C4.
    - >-
      Boundary and strictness attack, on C5: the old method (rebuild) is NOT embedded
      as the stated boundary; it is embedded as a deliberately weakened version of
      itself, inflated by log2(N). The proposed perturbation is not strictly better;
      against the correct boundary it is strictly worse (O11).
    - >-
      Method-ceiling attack, on C3: the ceiling is correct at sqrt(|Aut|/2) <= sqrt(3)
      and is a constant. Under ideal tuning the method cannot reach an exponent, which
      the batch says. The ceiling is not the problem; the resolution is (O8).
    - >-
      Nearby-object attack, on C1: the closest object where the desired conclusion is
      false is the extension-field case, where a factor base defined by a Frobenius
      condition IS algebraic and index calculus DOES beat rho. The batch's method -
      exhaustive sum-set enumeration - cannot distinguish the two cases, because it
      never touches the algebraic structure that separates them. That is the signature
      of a missing problem-specific ingredient, and it is the same ingredient
      KN-FIND-5c1a03 names (U6).
    - >-
      Quantifier order, on C1: the claim is being made as "for all functionals C in the
      measured set, for all classes, C is class-determined". What was tested is "there
      exists a class (t=30 at p=4001, plus 3 controls at each of 2-3 primes) such that
      for the 5 functionals chosen, ...". The witness class was selected by
      `pick_classes` as the LARGEST ordinary class, which is a biased draw: largest
      class means largest Hurwitz class number means largest conductor f, hence
      DEEPEST volcano and SMALLEST crater fraction (3/138 here). The selection is
      "never by a measured functional", which is the right guard against outcome
      selection - but it systematically under-samples maximal-order curves, which is
      the structurally distinguished stratum. That is a real design bias, not a
      fabrication, and it is one line to fix.

  narrowest_supported_statement: >-
    At p in {1009, 2003, 4001, 6007, 100003, 100057}, on completely enumerated
    F_p-isogeny classes certified against the Hurwitz-Kronecker class number, under a
    uniform target sampler: (i) #E, the CM discriminant and the Semaev S_3 monomial
    support are exactly class-invariant, and the S_3 support is exactly 13 generically,
    9 at j=0 and 10 at j=1728 - an exact symbolic fact; (ii) the full-field liftable
    x-count satisfies #liftable = (#E - 1 + z)/2 on every curve of every class tested,
    so its within-class variation is entirely the 2-torsion structure; (iii) the
    isogeny-class grouping carries no information about order-normalised decomposition
    efficiency that a label-permutation null can detect at these parameters
    (p = 0.131, 0.295, 0.196, 0.691), where that null is a between-class mean detector
    with power 1.00 at a 0.9% mean shift and no characterised sensitivity to
    within-class structure; (iv) within-class relation yield IS over-dispersed against
    its binomial null at both primes and both m, with a best/worst spread of 1.497x at
    p=4001 that decays monotonically as the sum-set density falls and is not explained
    by 2-torsion, |Aut|, or any class invariant - this is an open observation, not a
    closed one; (v) the corrected automorphism-quotient walk solves 48/48 and does not
    exceed sqrt(|Aut|/2) in the mean over 8 seeds at |Aut| = 6, and lands at
    ratio 0.988 of its ceiling at |Aut| = 4; (vi) a preprocessing table transports
    across a genuine ell-isogeny with every entry independently certified, at ell = 3
    and ell = 7, at a per-entry cost of ~(ell-1)/2 Velu evaluations, which is more than
    a correct rebuild costs; and the ST^2 = N frontier is unmoved because T1 preserves
    N. All toy scale. No lane produces a speedup over parallel rho and none is claimed.

  next_concrete_action: >-
    Before any evidence record is written: (1) mark RUN-MTGT-p4001e2 invalid via a
    correction - it measures the identity map - and rebuild the MTGT baseline
    incrementally, which inverts C5's headline; (2) rewrite C4 to say "2-torsion
    structure / floor-vs-interior", not "volcano level", and attach the 5-level result
    from my notes section 10 as the actual measurement; (3) restate C1's negatives as
    the bounds in O4 with their numbers, and record DECOMPOSITION.md prediction 1 as
    FALSIFIED. Then, as the single next experiment, run U1: the Macaulay first-fall
    degree profile over the 138 curves of the p=4001 t=30 class, with
    `exact_null_verdict` as the test. It is the only unmeasured functional in L1's own
    declared list that is exponent-bearing, it needs no Groebner engine, and either
    outcome is publishable - an identical profile across the class is the strong
    closure C1 is currently reaching for without having earned, and any variation at
    all reopens the gating lane on the quantity that actually governs index-calculus
    cost.

  cheapest_decisive_test:
    for_the_batch_as_a_whole:
      name: >-
        Fixed-density scaling sweep: hold |mV|/#E at 1/m! and vary p
      what_it_decides: >-
        Whether the within-class over-dispersion in relation yield is a saturation
        artifact of the batch's parameter choice - in which case C1 is a real closure
        and can be written strongly - or a genuine within-class signal, in which case
        L1 must stay open and the campaign's centre of gravity moves to U3's cost
        arithmetic. This one measurement decides the sign of the batch's headline
        conclusion.
      protocol: >-
        For each p in {2003, 4001, 6007, 10007, 16001}, take the largest ordinary
