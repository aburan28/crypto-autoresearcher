  # ---------------------------------------------------------------------------
  # 4. IN-SESSION ARITHMETIC INTEGRITY CHECKS (NOT EVIDENCE, NOT A RUN)
  # ---------------------------------------------------------------------------
  in_session_checks:
    disclaimer: >-
      Performed by hand on the transcribed decimal strings during this planning session.
      No program was executed and no run record exists. These are transcription-integrity
      checks whose value is that they tie values from DIFFERENT mirror pages together
      through identities the SafeCurves rendering does not enforce cell-by-cell, so a
      single-digit transcription slip on any one page would break them. The Executor
      must re-derive all of them mechanically; until then they are unreplicated.
    - id: CHECK-1
      identity: 'B*(A^2-4) with A=2065150, B=1'
      worked: 'A^2 = 2065150^2 = 4264844522500; A^2-4 = 4264844522496'
      compares: pages/equation.txt equation cell vs pages/equation.txt "Elliptic? Result" cell
      outcome: consistent
    - id: CHECK-2
      identity: 't = p + 1 - h*l with h = 8'
      worked: >-
        8*l = 2^383 + 8*166236275931373516105219794935542153308039234455761613271
        = 2^383 + 1329890207450988128841758359484337226464313875646092906168;
        t = (2^383 - 187) + 1 - 8*l = -186 - 1329890207450988128841758359484337226464313875646092906168
        = -1329890207450988128841758359484337226464313875646092906354
      compares: 'pages/field.txt (p) + pages/base.txt (l) + pages/ladder.txt (h) vs pages/disc.txt (t)'
      outcome: 'EXACT match with the published trace, all 58 digits'
      why_it_matters: >-
        Four separate pages are tied by one identity. It also shows the trace is not an
        independent datum: given p, l and h it is forced, which is the same argument
        verify.sage makes with the l^2 > 16p uniqueness condition (satisfied here since
        l ~ 2^380 so l^2 ~ 2^760 >> 16p ~ 2^387).
    - id: CHECK-3
      identity: "h*l + h'*l' = 2p + 2  (curve order plus twist order)"
      worked: >-
        8*l + 4*l' = (2^383 + 8c) + (2^383 - 4c') where
        c = 166236275931373516105219794935542153308039234455761613271 and
        c' = 332472551862747032210439589871084306616078468911523226635;
        c' - 2c = 93, so 8c - 4c' = -372 and the sum is 2^384 - 372 = 2*(2^383-187) + 2
      compares: 'pages/base.txt (l) + pages/twist.txt (l-prime, twist cofactor) + pages/field.txt (p)'
      outcome: 'EXACT match'
    - id: CHECK-4
      identity: 'Elligator-2 predicate of verify.sage: (p+1-t) even AND b != 0 in short Weierstrass form'
      worked: >-
        p+1-t = 8l is even. b = (2A^3-9A)/(27B^3); b = 0 would require 2A^2 = 9 in F_p,
        i.e. 8529689045000 = 9, false as integers and both sides are far below p, so
        b != 0.
      compares: 'pages/verify.txt predicate vs pages/ind.txt published cell'
      outcome: 'consistent with the published "Elligator 2: Yes"'
      limitation: >-
        This reproduces SafeCurves'' OWN predicate, which is weaker than the prose on
        ind.html (the prose additionally excludes j-invariant 1728 and the single curve
        y^2=x^3+x). Whether the prose condition also holds is a lane-11 task, not
        settled here.
    - id: CHECK-5
      identity: 'consistency of the published D factorization with the published prime list'
      worked: >-
        the three odd factors printed on disc.txt for M-383 each occur as separate lines
        in the M-383 block of primeproofs.txt
      outcome: consistent
      limitation: >-
        This checks membership, not the product. Re-multiplying the factorization to D,
        and re-deriving D from t and p, is a lane-6 task.

  # ---------------------------------------------------------------------------
  # 5. CONFLICTS AND AMBIGUITIES
  # ---------------------------------------------------------------------------
  conflicts:
    - id: CONFLICT-1
      status: no_conflict_found
      statement: >-
        Between the user intake and the staged mirror there is NO numeric or cell-level
        disagreement for M-383: curve name, equation, modulus, attribution and all eleven
        cells match. Per independence_caveat this is a transcription check, so the
        finding is "intake correctly transcribed", not "intake verified".
    - id: CONFLICT-2
      status: resolved_ambiguity_in_derived_text
      statement: >-
        pages/rigid.txt (whitespace-normalized) renders the E-382 / M-383 / Curve383187
        rows so that the comment "p is largest prime smaller than 2^383; B=1; A > 2 is as
        small as possible." appears immediately after Curve383187, and a careless reader
        could attach it to M-383.
      resolution: >-
        Read pages/rigid.html (sha256 503df9ebf177adc98b9aee9518721d322cbfe463d7bf1ec8dfd8eab9d1f177ad):
        the M-383 row's third cell is literally empty ("<td><p>\n</p></td>"), as is
        E-382's. THE COMMENT BELONGS TO Curve383187, NOT M-383.
      consequence: >-
        SafeCurves rates M-383 "fully rigid" WITHOUT PUBLISHING A GENERATION RULE FOR IT
        ON THAT PAGE. Combined with pages/verify.txt, where `rigid` is READ FROM A FILE
        as an input and the script only checks
        `saferigid &= (rigid == 'fully rigid' or rigid == 'somewhat rigid')`, the rigid
        cell is an EDITORIAL ANNOTATION, not a computed output. Reproducing it therefore
        requires an external generation transcript - see UNRETRIEVED-1 and audit lane 7.
      this_is_not: >-
        This is NOT a claim that M-383 is non-rigid, manipulated, or suspicious. It is a
        statement about what the retrieved source does and does not contain.
    - id: CONFLICT-3
      status: open_scope_note
      statement: >-
        M-383 and Curve383187 share the SAME prime p = 2^383-187 and the same shape,
        differing only in A (2065150 vs 229969). index.txt records that the authors
        "subsequently recommended switching to M-383" but gives no reason. Any audit code
        keyed on p alone will not distinguish the two curves.
      consequence: >-
        Curve383187 is the ideal parameter-matched control for every lane (identical
        field, identical shape, identical cofactor 2^3), and a lane whose measurement
        returns the same value for both curves is measuring p, not the curve.
      cross_campaign_note: >-
        A grep of the repository shows a sibling campaign GOAL-SCURVE-31fc17 whose records
        also mention M-383/Curve383187. It is outside this task's read_scope and was NOT
        read. Flagged for the Coordinator as a possible control-sharing or duplication
        overlap.

  # ---------------------------------------------------------------------------
  # 6. UNRETRIEVED SOURCES, WITH EXACT FAILURE MODE
  # ---------------------------------------------------------------------------
  unretrieved:
    - id: UNRETRIEVED-1
      source: >-
        Aranha, Barreto, Pereira, Ricardini, "A note on high-security general-purpose
        elliptic curves", IACR ePrint 2013/647
      why_needed: >-
        The only plausible primary statement of the M-383 GENERATION TRANSCRIPT (the rule
        that selects A = 2065150). Required to reproduce or challenge the rigid cell,
        and required by the "deterministic parameter-generation transcript audit"
        diagnostic.
      status: located_not_read
      how_located: >-
        WebSearch performed in this session returned the eprint URL with matching title
        and author list. Provenance of the pointer: retrieved (WebSearch result list).
        Provenance of the paper's CONTENTS: none - not read.
      failure_mode: >-
        Deliberately not fetched. Per the retrieval briefing, WebFetch in this environment
        returns a small-model summary that corrupts numeric data, and this role has no
        Bash, so no faithful copy can be obtained here. Fetching it would have produced a
        paraphrase that could not be cited for any digit and could not settle the
        rigidity question.
      successor_condition: >-
        A Bash-capable staging task should curl https://eprint.iacr.org/2013/647 (and its
        PDF) into a hash-pinned mirror analogous to SAFECURVES-20260825, after which audit
        lane 7 becomes executable. Until then lane 7 is DEFERRED-WITH-BOUND, not skipped.
    - id: UNRETRIEVED-2
      source: 'https://safecurves.cr.yp.to/ and all criterion pages, fetched live by this role'
      status: not_attempted_this_session
      failure_mode: >-
