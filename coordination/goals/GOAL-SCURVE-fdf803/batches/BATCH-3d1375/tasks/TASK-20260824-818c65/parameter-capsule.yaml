  independence_caveat:
    statement: >-
      M-383 was INTRODUCED BY THE SAFECURVES WORK ITSELF (SafeCurves index lists it as
      "2013 Aranha-Barreto-Pereira-Ricardini" and its criterion cells are computed and
      published by SafeCurves). The user intake row is a transcription of that same
      SafeCurves table. THEREFORE THE STAGED MIRROR AND THE INTAKE ARE NOT INDEPENDENT
      SOURCES. Where they agree, the only thing established is that the intake was
      transcribed correctly from SafeCurves. Agreement is a TRANSCRIPTION CHECK and
      NOTHING MORE; it confers no independent confirmation of any criterion value.
    consequence_for_the_audit: >-
      Independent reproduction of any criterion for M-383 requires recomputation from
      (p, A, B, x1, y1, l) by this program's own code and certificates, plus - for the
      rigidity criterion - a source outside SafeCurves for the generation transcript
      (see UNRETRIEVED-1).
    second_order_caveat: >-
      The mirror pages themselves were produced by one script (verify.sage, staged at
      pages/verify.txt). Two SafeCurves pages agreeing about M-383 is therefore also
      not two independent computations; it is one computation rendered into two tables.
      The genuine cross-checks available inside the mirror are the ARITHMETIC identities
      of section 4, which tie values from different pages together through relations the
      script does not enforce cell-by-cell.

