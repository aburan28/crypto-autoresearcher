  # ---------------------------------------------------------------------------
  # DELIVERABLES
  # ---------------------------------------------------------------------------
  artifacts:
    - path: coordination/goals/GOAL-SCURVE-fdf803/batches/BATCH-3d1375/tasks/TASK-20260824-818c65/parameter-capsule.yaml
