  # ---------------------------------------------------------------------------
  # COMPLETION GATE
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: 'The parameter capsule distinguishes user intake from retrieved primary or authoritative sources and records provenance and unresolved conflicts.'
      met: true
      where: >-
        parameter-capsule.yaml sections source_classes, independence_caveat,
        mirror_files_read, parameters (per-field source + intake_agrees/intake_silent),
        conflicts (CONFLICT-1..3), unretrieved (UNRETRIEVED-1..3). Every retrieved value
        carries file path plus sha256 and the label
        'retrieved (staged mirror SAFECURVES-20260825)'.
    - item: 'The audit plan covers every one of the eleven criteria in the declared category, with a certificate or explicit bound, controls, falsifier, budget, and stopping rule.'
      met: true
      where: >-
        audit-plan.yaml criterion_lanes L1-L11. Category assignment matches the goal's
        criterion_categories: basic_parameter_requirements = L1 field, L2 equation,
        L3 base; ecdlp_security_requirements = L4 rho, L5 transfer, L6 disc;
        ecc_security_beyond_ecdlp = L7 rigid, L8 ladder, L9 twist, L10 complete, L11 ind.
        Ten lanes carry a re-verifiable certificate; L7 carries an EXPLICIT BOUND instead
        and says so.
    - item: 'The plan covers every declared additional diagnostic, or records a concrete reason and successor condition for a deferred diagnostic.'
      met: true
      where: >-
        audit-plan.yaml additional_diagnostics D1-D8, one per declared item in goal order.
        D4 and D8 are explicitly cross-references to L5 and L7 rather than duplicate
        computations. D5 is partially_planned with the class number declared uncomputed
        and a successor condition. D8 is DEFERRED_WITH_BOUND with a two-part successor
        condition. D7 carries a declared scope cut on multi-scalar formulas.
    - item: 'Positive, parameter-matched negative, and same-shape null controls are explicit and run before belief in any later task.'
      met: true
      where: >-
        audit-plan.yaml control_policy (blocking: true, with the void rule and the decay
        requirement) and controls CTRL-ANOM, CTRL-BN254, CTRL-SECP, CTRL-P224,
        CTRL-BP256T1, CTRL-383187, CTRL-25519, NULL-MONT-RAND, NULL-PRIMELIST-SHUFFLE,
        NULL-TRANSCRIPT-SHUFFLE. Every lane names its own three. Stage 0 of
        execution_order is the blocking control stage.
    - item: 'The report states that no curve attack ran and makes no safety or vulnerability conclusion.'
      met: true
      where: 'this record, no_attack_statement and no_safety_conclusion_statement.'

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICT BETWEEN INTAKE AND RETRIEVED SOURCES
  # ---------------------------------------------------------------------------
  intake_vs_retrieved:
    numeric_conflicts_found: 0
    cell_conflicts_found: 0
    detail: >-
      The user intake (curve name, equation y^2 = x^3+2065150x^2+x, modulus 2^383-187,
      attribution 2013 Aranha-Barreto-Pereira-Ricardini, and all eleven cells True)
      matches the staged mirror exactly.
    why_this_is_not_verification: >-
      M-383 was introduced by the SafeCurves work itself and its criterion cells are
      SafeCurves' own published outputs. The intake is a transcription of that same table.
      The mirror and the intake are therefore NOT INDEPENDENT SOURCES: their agreement
      establishes only that the intake was transcribed correctly. It is a transcription
      check and nothing more. Independent reproduction remains entirely outstanding.
    second_order: >-
      The mirror's own pages are all outputs of one script (verify.sage, staged at
      pages/verify.txt), so two SafeCurves pages agreeing is one computation rendered
      twice, not two computations. The only genuine internal cross-checks available were
      the arithmetic identities of parameter-capsule section 4, which tie values from
      different pages through relations the rendering does not enforce; CHECK-2 (trace
      re-derived exactly from p, l, h across four pages) and CHECK-3 (8l + 4l' = 2p+2
      across three pages) both closed exactly.
    open_items:
      - id: CONFLICT-2
        status: resolved_within_task
        summary: >-
          The derived-text file pages/rigid.txt renders the rigidity comment cell so that
          it appears to belong to M-383; the binding pages/rigid.html shows M-383's cell is
          EMPTY and the comment belongs to Curve383187. Resolved against the HTML.
        consequence_for_the_goal: >-
          SafeCurves publishes NO generation rule for M-383 on its rigidity page, and
          verify.sage reads `rigid` from a file rather than computing it. The rigid cell is
          an editorial annotation. This is the reason lane L7 / diagnostic D8 is deferred
          with a bound, and it is a finding about the SOURCE, not about the curve.
      - id: CONFLICT-3
        status: open_scope_note
        summary: >-
          M-383 and Curve383187 share the identical prime p = 2^383-187, shape, cofactor
          and twist cofactor, differing only in A. Any lane keyed on p alone cannot
          distinguish them - which is why Curve383187 is the plan's parameter-matched
          negative control throughout.
      - id: CROSS-CAMPAIGN
        status: flagged_not_investigated
        summary: >-
          A repository-wide grep shows a sibling campaign GOAL-SCURVE-31fc17 whose records
          also mention M-383/Curve383187. It is outside this task's read_scope and was NOT
          read. Flagged for the Coordinator as a possible overlap or control-sharing
          opportunity; this producer makes no claim about its contents.

  # ---------------------------------------------------------------------------
  # RETRIEVAL LOG (every attempt, every outcome)
  # ---------------------------------------------------------------------------
  retrieval_log:
    - source: 'inputs/SAFECURVES-20260825/pages/{index,field,equation,base,rho,transfer,disc,rigid,ladder,twist,complete,ind,primeproofs,verify}.txt and pages/rigid.html'
      method: 'Read tool on the hash-pinned staged mirror'
      outcome: success
      label: 'retrieved (staged mirror SAFECURVES-20260825), with per-file sha256 recorded in the capsule'
      honesty_note: 'This role did NOT perform the fetch. The mirror was staged by the top-level orchestration session per inputs/SAFECURVES-20260825/source_record.yaml.'
    - source: 'https://eprint.iacr.org/2013/647 (Aranha-Barreto-Pereira-Ricardini, "A note on high-security general-purpose elliptic curves")'
      method: WebSearch (pointer only)
      outcome: 'located; URL, title and author list confirmed in search results. CONTENTS NOT READ.'
      label: 'pointer retrieved; contents unretrieved'
      why_not_fetched: >-
        Per the task briefing and inputs/SAFECURVES-20260825/source_record.yaml, WebFetch in
        this environment returns a small-model summary that demonstrably corrupts numeric
        data, and this role has no Bash. A fetch would have produced a paraphrase citable
        for nothing load-bearing. Not attempting it is the honest choice, and it is recorded
        as UNRETRIEVED-1 with a successor condition rather than as a soft citation.
    - source: 'https://safecurves.cr.yp.to/* fetched live'
      method: not attempted
      outcome: 'no attempt; the 502-on-WebFetch defect is a previously confirmed environment observation, not re-tested here'
      label: unretrieved
      honesty_note: 'Operational observation only, never mathematical evidence.'
    - source: 'per-curve verify.html input directories (p, l, x0, y0, A, B, primes, rigid)'
      method: 'checked mirror contents'
      outcome: 'not present in the mirror - a scope boundary of the staging task, not a retrieval failure'
      label: unretrieved
      consequence: 'the plan constructs (x0,y0) itself in lane L3 rather than importing it'

  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - object: 'the M-383 parameter tuple (p, A, B, x1, y1, l, h) together with its derived invariants (t, D, k, l'', h'')'
        why_this_object: >-
          The task is a sourcing and planning task, so the tracked object is the tuple
          itself and the projection under study is "which invariants of the tuple are
          independently recomputable, and from what". This is the object the goal named.
        lossy_projection_test: >-
          PASSES as a projection but only weakly, and the plan says so. Each criterion cell
          is an extremely lossy projection of the tuple: eleven booleans from a 383-bit
          object. What each discards is discarded compatibly with the operation that
          matters for that cell - e.g. ord_l(p) is invariant under F_p-isogeny because p and
          l are class invariants (IDEA-20260807-98a970), and numorder2 is invariant under
          F_p-isomorphism. The booleans are NOT a change of coordinates: nothing about the
          curve is recoverable from them, which is exactly why CTRL-383187 (same p, same
          verdicts, different everything else) is the plan's central control.
        depth_of_verified_structure: >-
          NONE VERIFIED BY COMPUTATION. Depth reached: transcription plus five hand-checked
          integer identities, two of which (CHECK-2, CHECK-3) close exactly across three or
          four independently rendered mirror pages. Tier: planning arithmetic, unreplicated.
      - object: 'the SafeCurves verify.sage predicate set, as an object distinct from the SafeCurves prose criteria'
        why_this_object: >-
          Not asked for, and the more useful find. Reading pages/verify.txt shows the eleven
          published cells are produced by predicates that are in three cases STRICTLY WEAKER
          than the prose criteria the page states: `ind` is just ((p+1-t) even and b != 0),
          `ladder` is just existence of a Montgomery model with no timing or simplicity
          content, and `rigid` is not computed at all - it is read from a file.
        lossy_projection_test: >-
          PASSES. The predicate set is a lossy projection of the criteria: it discards every
          non-arithmetic requirement (constant-time, simplicity, process provenance) and
          retains exactly the arithmetic core, which propagates deterministically from the
          tuple. That is a genuinely different object from "the criterion", and confusing
          the two is how an audit would overclaim.
        depth_of_verified_structure: >-
          Retrieved and read; the three weakenings are quoted from the staged script text.
          Not further verified.
    dominated_by: 'n/a (no result claimed)'
    dominated_by_justification: >-
      This task produced a sourcing capsule and a plan. It claims no algorithm, no bound, no
      speedup and no measurement, so there is no Pareto frontier row for it to sit on. The
      audit plan it proposes is, as an INSTRUMENT, dominated on authority by the SafeCurves
      analysis itself (which produced every target value and has stood since 2013) and by
      the standards' own parameter-validation procedures; it dominates them on nothing
      except that its outputs would carry re-verifiable certificates inside this program's
      ledger. That is the same honest position IDEA-20260807-98a970 records for itself.
    sota_delta: >-
      Zero on every attack axis - time, memory, data/queries - because no attack is claimed
      or proposed. Quantitative delta as DATA: the program's corpus previously held zero
      sourced M-383 parameters (a grep of knowledge/ for "SafeCurves" returns no files);
      this capsule adds 16 sourced parameter fields plus 11 comparison cells plus 7
      supporting quantities, each with file path and sha256, and 5 integer identities two of
      which close exactly across separately rendered pages. Delta as SCOPE: it converts
      "the intake says True" into "the intake is a correct transcription of a non-independent
      source, and here is the exact predicate that produced each cell and the exact
      certificate that would reproduce it".
    closures:
      - closure: 'Independent reproduction of the `rigid` cell for M-383 is CLOSED to this program from the currently retrieved sources.'
        obstruction: >-
          Named: the rigid value is an INPUT to verify.sage, not an output
          (pages/verify.txt: saferigid &= (rigid == 'fully rigid' or rigid == 'somewhat rigid')),
          and SafeCurves' rigid comment cell for M-383 is literally empty in the binding HTML.
          No retrieved source states the generation rule.
        argument: >-
          A rigidity rating is a claim about a PROCESS. No amount of computation on the
          artifact can distinguish "A = 2065150 was produced by the minimal-A rule" from
          "A = 2065150 was chosen and is consistent with the rule". Reproduction therefore
          requires an external transcript, and the only located candidate (ePrint 2013/647)
          could not be retrieved faithfully by this role.
        forward_guidance: >-
          The classes that remain: (a) stage ePrint 2013/647 and read the transcript;
          (b) reproduce the rule FORM on Curve25519, where SafeCurves does publish the full
          constraint list including the two rejected candidates 358990 and 464586 - success
          there validates the harness, failure falsifies the conjectured rule form;
          (c) run the full minimal-A search at 64 bits and declare the transfer assumption.
          None of these is closed; all three are cheap.
        this_is_not_a_saturation_claim: >-
          Explicitly not. Premature closure is a failure mode symmetric with overclaiming
          (KN-TECH-056). This closure is scoped to "from the sources retrieved in this task"
          and carries a two-part successor condition that removes it.
      - closure: 'Exact class number h(D) at |D| ~ 2^383 is CLOSED in this environment.'
        obstruction: 'Pure Python, no class-group machinery (ENV-1). |D| ~ 2^383 puts an exact class number far out of reach by any route available here.'
        argument: 'SafeCurves itself declines to compute it ("this has not been incorporated into SafeCurves", pages/disc.txt) and offers only the GRH heuristic h(D) ~ sqrt(|D|).'
        forward_guidance: 'D5 reports the conductor structure exactly and the class number only as a GRH-conditional estimate, labelled as such. A class-group dependency would reopen it; that is a Coordinator decision, not proposed here.'
      - closure: 'Full 383-bit point counting (SEA) is CLOSED in this environment.'
        obstruction: 'ENV-1: no Sage, no PARI, pure Python.'
        argument: 'Every lane was costed against this. The COST PIVOT (ENV-2) removes the need for it in ten of eleven lanes by converting factorization into verification against the published prime list; only lane L7''s search over candidate A values genuinely needs it.'
        forward_guidance: 'L7 is bounded rather than abandoned: a cheap-necessary-condition sieve at 383 bits plus a full search at <= 64 bits with a declared transfer assumption.'
    open_directions:
      - 'Stage ePrint 2013/647 with per-file sha256, then execute L7/D8 in full. This is the single highest-information-per-dollar remaining item and it is blocked only on infrastructure.'
      - >-
        Investigate the M-383 vs Curve383187 pair as a research object in its own right:
        two curves over the SAME prime, both rated fully safe, with the authors recommending
        a switch from one to the other for a reason no retrieved source states. Whatever
        distinguishes them is invisible to all eleven criteria, which makes it a candidate
        for a twelfth diagnostic under the goal's "deliberately non-exhaustive" clause.
      - >-
        The verify.sage predicate/prose gap (ind, ladder, rigid) is a general finding about
        the SafeCurves methodology that applies to every curve in the table, not just M-383.
        It belongs in knowledge/techniques or knowledge/literature as a curation item if a
        future task confirms it against the live source. NOT promoted here: this producer
        read a staged mirror, and a methodology claim about a third party should rest on a
        source the claimant fetched.
      - >-
        The published relevant-primes list (ENV-2) is a reusable asset for every SafeCurves
        curve in this program, not just M-383. A one-time task that parses primeproofs.html
        into per-curve machine-readable prime lists with verified Pocklington chains would
        make the certificate-heavy lanes cheap for every future curve audit.
      - >-
        x1 = 12 for M-383 is conspicuously small and no retrieved source explains the base
        point choice. Base-point selection is not one of the eleven criteria and is not a
        defect; it is an unexplained parameter, and unexplained parameters are exactly what
        the rigidity criterion exists to surface. Worth a scoped question.

  # ---------------------------------------------------------------------------
  # LIMITATIONS
  # ---------------------------------------------------------------------------
  limitations:
    - 'Nothing was computed by machine. Every number in the capsule is transcribed from the staged mirror or derived by hand, and the hand derivations are unreplicated.'
    - 'The mirror is SafeCurves'' own output and is not independent of the intake. Agreement is transcription fidelity only.'
    - 'The mirror''s .txt files are tag-stripped derivations; the .html/.pdf files are binding. One derived-text ambiguity was found and resolved against the HTML (CONFLICT-2). Other pages were not exhaustively re-checked against their HTML, so further such ambiguities may exist.'
    - 'The audit plan''s time budgets are engineering estimates for pure-Python 383-bit arithmetic, not measurements. They will be wrong; the stopping rules are what keep that from mattering.'
    - 'Lane L7 / diagnostic D8 is deferred with a bound. Any dossier built from this plan must report the rigid cell as unreproduced until the successor condition is met.'
    - 'D5 does not compute a class number and D7''s search is bounded at 10^5 samples per formula family, which cannot exclude failure sets of density below ~10^-5. Both state their bound rather than claiming absence.'
    - 'This producer read only the three files in its read_scope plus the staged mirror. Sibling campaign GOAL-SCURVE-31fc17 was not read, so any duplication with it is unassessed.'

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (proposals only - the Coordinator decides)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - proposed_role: 'infrastructure staging (Bash-capable, non-research)'
      objective: 'Mirror ePrint 2013/647 (abstract page and PDF) with per-file sha256 into inputs/, in the SAFECURVES-20260825 pattern, with a source_record.yaml.'
      unblocks: 'audit-plan lane L7 and diagnostic D8; goal completion criterion 1 for the rigidity cell.'
      cost: minutes
    - proposed_role: 'infrastructure staging (Bash-capable, non-research)'
      objective: 'Parse inputs/SAFECURVES-20260825/pages/primeproofs.html into per-curve machine-readable relevant-prime lists with a Pocklington verifier, staged as a derived artifact with hashes.'
      unblocks: 'the COST PIVOT (ENV-2) for every certificate-heavy lane, for M-383 and for every other SafeCurves curve this program audits.'
      cost: low
    - proposed_role: executor
      objective: 'Execute audit-plan Stage 0 through Stage 2 only (the cheapest decisive subset, ~400 s): the blocking control registry, L1-L3, and L8/L10/L11.'
      why_first: >-
        It is the smallest subset that (a) proves the instrument fires on positive controls,
        (b) proves the pipeline checks the supplied prime list rather than trusting it, and
        (c) already reproduces four of the eleven criteria with certificates verifiable in
        microseconds. Every later stage is gated on it.
      cost: '~400 s compute'
    - proposed_role: 'idea-generator (successor, scoped)'
      objective: >-
        Propose a twelfth, sourced, measurable parameter-level diagnostic under the goal's
        "deliberately non-exhaustive" clause, targeting whatever distinguishes M-383 from
        Curve383187 - two curves over the same prime, both rated safe on all eleven cells,
        with an unexplained author recommendation to switch.
      precondition: 'ePrint 2013/647 staged, since the reason for the switch is most likely stated there.'
    - proposed_role: 'validator / red-team'
      objective: >-
        Adversarial review of THIS capsule and plan before any execution: specifically, whether
        the control registry can distinguish "the lane measures the curve" from "the lane
        measures the prime" for every lane, and whether any lane's falsifier is unreachable.
      why: 'A plan whose controls cannot fail is not a plan, and that is cheaper to catch here than after 2725 s of compute.'
