      value_from_mirror: 52885740957
      producer_desk_arithmetic:
        computation: '229969^2 = (230000-31)^2 = 52900000000 - 14260000 + 961 = 52885740961; minus 4 = 52885740957'
        outcome: exact match with the mirror value
        caveat: >-
          Producer hand arithmetic. Queued for mechanical re-verification as
