  # ---------------------------------------------------------------------------
  # 4. THE ELEVEN CELLS, AS PUBLISHED, AS COMPARISON TARGETS
  # ---------------------------------------------------------------------------
  preregistered_comparison_targets:
    warning: >-
      Every value in this block is a TARGET to be reproduced or challenged, not
      a result. Both the intake and the mirror assert them; per
      independence_adjudication those two are one source.
    cells:
      field:
        intake: true
        mirror_cell: 'p prime? True'
        mirror_file: pages/field.txt
      equation:
        intake: true
        mirror_cell: 'Elliptic? True; B(A^2-4) = 52885740957'
        mirror_file: pages/equation.txt
      base:
        intake: true
        mirror_cell: '(x1,y1) on curve? True; l prime? True; l(x1,y1)=0? True'
        mirror_file: pages/base.txt
      rho:
        intake: true
        mirror_cell: 'Cost for rho above 2^100? True; cost = 2^189.8'
        mirror_file: pages/rho.txt
        producer_desk_arithmetic:
          formula_as_scripted: 'rho = log(pi/4 * l)/log(4) = log2(0.886*sqrt(l))'
          computation: 'log2(l) = 380.000 (l = 2^380*(1+~2^-192)); 0.5*380 - 0.17460 = 189.825 -> "189.8"'
          outcome: consistent with the published cell
          caveat: producer hand arithmetic; queued as CHK-RHO-1
      transfer:
        intake: true
        mirror_cell: 'additive safe True; multiplicative safe True; embedding degree = (l-1)/15'
        mirror_file: pages/transfer.txt
        criterion_as_scripted: 'requirement is (l-1)/ord_l(p) <= 100; published cofactor is 15'
      disc:
        intake: true
        mirror_cell: 'D approx -2^382.8, |D| > 2^100 True'
        mirror_file: pages/disc.txt
      rigid:
        intake: true
        mirror_cell: >-
          'fully rigid', with note "p is largest prime smaller than 2^383; B=1;
          A > 2 is as small as possible."
        mirror_file: pages/rigid.txt
        critical_scope_note: >-
          THIS CELL IS NOT COMPUTED BY verify.sage. The script does
          `rigid = readfile('rigid').strip()` and then
          `saferigid &= (rigid == 'fully rigid' or rigid == 'somewhat rigid')`.
          The rigidity verdict is an EDITORIAL INPUT to the SafeCurves pipeline,
          not an output of it. Any reproduction of this cell must reconstruct
          and test the generation transcript itself (LANE-RIGID / LANE-D8).
      ladder:
        intake: true
        mirror_cell: 'Montgomery ladder? True; cofactor 2^3'
        mirror_file: pages/ladder.txt
      twist:
        intake: true
        mirror_cell: >-
          combined-attack cost 2^188.3 (above 2^100 True); l' as above; cofactor
          2^3, twist cofactor 2^2; twist rho 2^190.3 True; twist additive-safe
          True; twist multiplicative-safe True; twist embedding degree (l'-1)/1
        mirror_file: pages/twist.txt
        producer_desk_arithmetic:
          twist_rho: '0.5*381 - 0.17460 = 190.325 -> "190.3"; consistent'
          combined_attack: >-
            Reimplementing the scripted greedy loop by hand: v=2 is peeled while
            2 | #E or 2 | #E'; #E carries 2^3 and #E' carries 2^2, so the loop
            runs 3 times, giving precomp = 2+2+2 = 6 and joint = l/8 = 2^377;
            then log2(6 + sqrt(pi/4 * 2^377)) = log2(6 + 2^188.325) = 188.325 ->
            "188.3". Consistent with the published cell.
          caveat: producer hand arithmetic; queued as CHK-TWIST-1 and CHK-TWIST-2
      complete:
        intake: true
        mirror_cell: >-
          complete single-scalar True; complete multi-scalar True; number of
          points of order 2 = 1; number of points of order 4 = 2
        mirror_file: pages/complete.txt
      ind:
        intake: true
        mirror_cell: 'Supports indistinguishability True; notes "Elligator 2: Yes."'
        mirror_file: pages/ind.txt
        criterion_as_scripted: >-
          verify.sage sets indistinguishability = ((p+1-t) even AND short-
          Weierstrass b != 0), i.e. "has a point of order 2 and j != 1728".

  # ---------------------------------------------------------------------------
  # 5. PRODUCER DESK CHECKS ON THE STAGED TEXT (consistency, not sourcing)
  # ---------------------------------------------------------------------------
  producer_desk_checks:
    disclosure: >-
      These are hand computations on small integers taken from the staged pages.
      They are reported so a reviewer can redo each in one line. They are NOT
      experiment results, NOT evidence, and every one is queued for mechanical
      re-verification in audit-plan.yaml. Any that a machine later contradicts
      is a producer error and supersedes this block.
    checks:
      - id: CHK-DESK-1
        statement: 'B(A^2-4) = 229969^2 - 4 = 52885740957'
        matches_mirror: true
      - id: CHK-DESK-2
        statement: 'p mod 4 = 1 (2^383 = 0 mod 4; -187 = 1 mod 4)'
        consequence: >-
          p is NOT 3 mod 4, so Elligator 1 is inapplicable by its own stated
          precondition. Consistent with the mirror reporting only "Elligator 2:
          Yes." for this curve.
      - id: CHK-DESK-3
        statement: 'p mod 8 = 5 (2^383 = 0 mod 8; 187 = 3 mod 8)'
        consequence: >-
          Square roots in F_p use the p = 5 mod 8 branch, not the p = 3 mod 4
          branch. Directly relevant to point-decompression exceptional sets
          (diagnostic D6) and to any constant-time sqrt in a reference
          implementation.
      - id: CHK-DESK-4
        statement: 'p mod 3 = 1 (2^383 = 2 mod 3; 187 = 1 mod 3)'
        consequence: >-
          F_p contains three cube roots of unity, so the Montgomery-to-short-
          Weierstrass conversion in verify.sage has a well-defined s with
          s^3 = 1/B; relevant to LANE-LADDER's certificate.
      - id: CHK-DESK-5
        statement: 'A = 229969 = 1 mod 4, so (A-2)/4 is NOT an integer for Curve383187'
        contrast: >-
          For every "M-" curve in the same table the corresponding value IS
          integral: M-221 A=117050 -> (A-2)/4 = 29262; M-383 A=2065150 ->
          516287; M-511 A=530438 -> 132609; and Curve25519 A=486662 -> 121665.
          All four have A = 2 mod 4; Curve383187 has A = 1 mod 4.
        consequence: >-
          This is the load-bearing arithmetic behind unresolved conflict
          CONF-2 below, and it is the discriminator LANE-D8 is built on.
      - id: CHK-DESK-6
        statement: 'A(2A^2-9) = 229969 * 105771481913, both factors nonzero and far below p'
        consequence: >-
          The short-Weierstrass b = (2A^3-9A)/27 is nonzero, i.e. j != 1728.
          Feeds LANE-IND and diagnostic D3 (automorphism group).
      - id: CHK-DESK-7
        statement: 'A^2 = 52885740961 != 3, and 52885740961 < p'
        consequence: >-
          The short-Weierstrass a = (3-A^2)/3 is nonzero, i.e. j != 0. Together
          with CHK-DESK-6 this pins Aut(E) = {+-1} exactly (p > 3, j not in
          {0,1728}), which is what diagnostic D3 needs.
      - id: CHK-DESK-8
        statement: >-
          Leading-digit and magnitude coherence of the identity #E + #E' = 2p+2
          under the published cofactors: 8*l ~ 2^383 and 4*l' ~ 2^383 sum to
          ~2^384 ~ 2p+2.
        NOT_a_verification: >-
          A full-precision check of 8l = p+1-t was NOT completed by hand and is
          NOT claimed. It is queued as CHK-BASE-2 for mechanical evaluation.
      - id: CHK-DESK-9
        statement: >-
          The primeproofs page lists, among Curve383187's "relevant proven
          primes", exactly l, l' and p as its last three entries, and also
          contains 1168118569486389440308203361557649499676771110259307362471795835525621803683357571467152044105461,
          the large factor appearing in the published factorization of D.
        consequence: cross-page internal consistency of the staged mirror
        source_file: inputs/SAFECURVES-20260825/pages/primeproofs.txt
        source_sha256: 4b6c69f64451c946645513073feae6f89806f4c790715ded1a2c7b103545d549

  # ---------------------------------------------------------------------------
  # 6. UNRESOLVED CONFLICTS AND GAPS
  # ---------------------------------------------------------------------------
  unresolved_conflicts:
    - id: CONF-1
      severity: structural
      title: Intake and mirror are one source, not two
      statement: >-
        See independence_adjudication. No criterion is raised above `unverified`
        by their agreement.
      resolution_route: >-
        Retrieve ePrint 2013/647 (independent for the tuple and the transcript),
        and recompute every derived quantity in-program from (p, A, B) alone.
      blocks_goal_completion_criterion: >-
        "Reconcile the exact parameter tuple to retrieved primary or
        authoritative sources" -- partially met (one retrieved primary source,
        the SafeCurves site itself), not fully met (no independent second source).

    - id: CONF-2
      severity: material
      title: >-
        The staged rigidity transcript is self-inconsistent across M-383 and
        Curve383187, which share a prime, a shape and a cofactor profile
      statement: >-
        rigid.txt gives Curve383187 the note "p is largest prime smaller than
        2^383; B=1; A > 2 is as small as possible." field.txt shows M-383 and
        Curve383187 carry the IDENTICAL p = 2^383-187. equation.txt shows both
        are Montgomery with B=1. twist.txt shows both carry cofactor 2^3 and
        twist cofactor 2^2. Yet A = 229969 for Curve383187 and A = 2065150 for
        M-383. Under ONE identical constraint set at most one of them can be
        "the smallest A > 2 satisfying it". The staged transcript therefore does
        not, as written, determine either curve.
      candidate_explanation_NOT_a_finding: >-
        HYPOTHESIS ONLY: the M-series carries an unstated additional constraint
        A = 2 mod 4 (making (A-2)/4 integral, the quantity multiplied by inside
        a Montgomery ladder), which Curve383187's A = 1 mod 4 fails. CHK-DESK-5
        shows the congruence pattern holds across M-221, M-383, M-511 and
        Curve25519. This is a hypothesis with a hand-verified necessary
        condition, NOT a sourced fact about either designer's intent.
      already_falsified_alternative: >-
        "The two curves use different cofactor requirements" is FALSIFIED by the
        staged twist.txt: both are (2^3, 2^2) at the same p.
      resolution_route: >-
        LANE-D8 in audit-plan.yaml. Definitive resolution requires ePrint
        2013/647's own generation description.
      why_it_matters: >-
        `rigid` is the one criterion SafeCurves does not compute (see
        preregistered_comparison_targets.rigid.critical_scope_note). A
        transcript that does not determine the parameter is not a rigidity
        certificate, whatever the cell says. This is a statement about the
        AVAILABLE TEXT, not about the curve, and it is not an ECDLP claim of any
        kind.

    - id: CONF-3
      severity: minor
      title: Intake's provenance sentence is not corroborated by retrieved text
      statement: >-
        The intake says "authors subsequently recommended switching to M-383".
        The staged index.txt carries the same sentence, so by CONF-1 that is not
        corroboration. A WebSearch result summary pointed at ePrint 2013/647 and
        described a revision note about replacing the 383-bit curve with a more
        implementation-friendly one, but the paper itself was NOT fetched and a
        search-engine summary is not a source. Recorded as unresolved.

    - id: CONF-4
      severity: minor
      title: Page version skew inside the mirror
      statement: >-
        index.html is version 2017.01.22 while field.html, rho.html,
        ladder.html and verify.html are 2013.10.13 and equation.html is
        2013.10.14. The eleven-cell summary table and the per-criterion tables
        were therefore last regenerated at different times. No disagreement was
        observed between them for Curve383187, but the skew is recorded so a
        later disagreement is not mistaken for a computation error.

  retrieval_gaps:
    - id: GAP-1
      what: 'SafeCurves Pocklington proof pages, proof/<n>.html'
      why_needed: >-
        primeproofs.txt lists WHICH primes SafeCurves proved; the proofs
        themselves live at per-prime URLs that were not staged. Without them the
        mirror supports no primality certificate for p, l or l'.
      failure_mode: not staged in SAFECURVES-20260825; this role has no Bash and
        WebFetch returns HTTP 502 for every safecurves.cr.yp.to URL
      successor_condition: >-
