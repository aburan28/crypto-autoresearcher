      source_sha256: 666a0adf68bde7d1b5c3d0011486ecc5b93d6b4ee6363b8a98079567758c157c
      how_safecurves_obtains_it: >-
        NOT by point counting. verify.sage computes t = p+1-l*round((p+1)/l),
