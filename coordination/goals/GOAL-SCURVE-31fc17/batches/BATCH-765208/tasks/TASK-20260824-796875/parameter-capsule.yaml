parameter_capsule:
  task_id: TASK-20260824-796875
  goal_id: GOAL-SCURVE-31fc17
  question_id: RQ-SCURVE-b10b2c
  batch_id: BATCH-765208
  role: idea-generator
  produced_at: '2026-08-25'
  curve: Curve383187
  status: planning_artifact_only
  authority_note: >-
    This capsule is a SOURCING and RECONCILIATION record produced by a planning
    task. It runs no curve attack, creates no experiment result, and makes no
    statement that Curve383187 is safe, unsafe, vulnerable, or free of
    vulnerabilities. Nothing here is an evidence record. Local lane identifiers
    (LANE-*, CHK-*, CONF-*) are internal to this task's artifacts and are NOT
    canonical ledger IDs; only the Coordinator allocates those.

  inference:
    requested_policy: research-deep
    fallback_allowed: false
    degraded_allowed: false
    answering_model: claude-opus-5
    answering_runtime: claude_code (idea-generator subagent, effort=high)
    policy_honored: true
    fallback_used: false
    note: >-
      Recorded per handoff. No downgrade was taken; had the requested policy
      been unavailable the task would have been refused rather than degraded.
    provider_screen: >-
      No provider, backend, endpoint, or model identifier containing "Bedrock"
      (case-insensitive) was selected, requested, or used.

  # ---------------------------------------------------------------------------
  # 1. SOURCE CLASSES. Read this before reading any number below.
  # ---------------------------------------------------------------------------
  source_classes:
    - class: user_supplied_unverified_intake
      definition: >-
        The SafeCurves cells and the parameter fragments carried in
        ledger/goals/GOAL-SCURVE-31fc17/goal.yaml and
        ledger/questions/RQ-SCURVE-b10b2c.yaml under `intake`. Preregistered
        COMPARISON TARGETS. Not evidence, not ground truth.
      records:
        - ledger/goals/GOAL-SCURVE-31fc17/goal.yaml
        - ledger/questions/RQ-SCURVE-b10b2c.yaml
    - class: retrieved_primary_text_staged_mirror
      definition: >-
        Raw curl bytes of safecurves.cr.yp.to, staged with per-file sha256 by a
        non-research orchestration session. Cited as
        "retrieved (staged mirror SAFECURVES-20260825)" plus file sha256. It IS
        primary text; this producer did NOT fetch it, and says so.
      records:
        - inputs/SAFECURVES-20260825/source_record.yaml
    - class: unretrieved
      definition: >-
        Named, located, not obtained in this task. Failure mode recorded
        verbatim. Never paraphrased into support.
    - class: producer_desk_arithmetic
      definition: >-
        Small-integer arithmetic performed by this producer, by hand, on digits
        transcribed from the staged mirror. Stated with the exact operands so a
        reviewer can redo it in one line. It is a CONSISTENCY CHECK on the
        staged text, not an independent source, and every instance is queued for
        mechanical re-verification in the audit plan.

  # ---------------------------------------------------------------------------
  # 2. THE INDEPENDENCE PROBLEM. Read this before comparing intake to mirror.
  # ---------------------------------------------------------------------------
  independence_adjudication:
    finding: >-
      THE INTAKE AND THE STAGED MIRROR ARE NOT INDEPENDENT SOURCES FOR THIS
      CURVE. Curve383187 is not a curve that SafeCurves merely evaluated: it is
      listed on safecurves.cr.yp.to itself, with its equation, prime, base
      point, orders, trace, discriminant and every one of the eleven verdicts
      generated by the SafeCurves verify.sage script. The user intake table is
      the SafeCurves table. Agreement between them is therefore A TRANSCRIPTION
      CHECK ON ONE SOURCE AND NOTHING MORE. It raises no criterion above
      `unverified` and confers no corroboration.
    what_would_be_independent:
      - >-
        The originating paper: Aranha, Barreto, Pereira, Ricardini, "A note on
        high-security general-purpose elliptic curves", Cryptology ePrint
        Archive 2013/647 (UNRETRIEVED in this task; see unretrieved_sources).
        Independent for the parameter tuple and for the GENERATION TRANSCRIPT,
        which is the one criterion (rigid) that SafeCurves does not compute.
      - >-
        Any third-party recomputation of the orders, trace, discriminant and
        embedding degrees from p and A alone -- which is what this program's own
        audit lanes are for. A recomputation inside this program IS independent
        of SafeCurves, because it consumes only (p, A, B) and re-derives the
        rest.
    consequence_for_the_plan: >-
      Every audit lane in audit-plan.yaml is specified to consume ONLY (p, A, B)
      plus, where a factorization is needed, a HINT list. A hint may come from
      the mirror; a hint is never a certificate. Verification must stand alone.

  # ---------------------------------------------------------------------------
  # 3. THE TUPLE
