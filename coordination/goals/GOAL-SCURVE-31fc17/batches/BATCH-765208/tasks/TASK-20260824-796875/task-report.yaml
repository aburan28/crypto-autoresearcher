  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    object_considered: >-
      THE CERTIFICATE-BEARING DERIVATION CHAIN from the raw triple (p, A, B) to
      each of the eleven SafeCurves cells, tracked as a dependency DAG whose
      nodes are exact identities, witnessed modular computations, or declared
      UNRESOLVED. Lossy-projection test applied and answered in
      audit-plan.yaml `object_first_frame`: the projection is severely lossy
      (~2^383 points down to a few dozen integers), irreversible, and discards
      compatibly with every F_p-isomorphism and model change the criteria are
      stated up to -- which is exactly why the retained data propagates
      deterministically. It is NOT a change of coordinates. It is also NOT NEW:
      it is the standard curve-validation projection, and it is recorded as
      `known`.
    objects_enumerated_and_not_chosen:
      - object: 'the isogeny class of E (tracking curves 2-isogenous or l-isogenous to E)'
        why_not: >-
          Would be the right object for a "walk to a weaker curve" question, but
          p, l and the embedding degree are class invariants
          (IDEA-20260807-b92080), so the projection is CONSTANT along the class
          and carries no information for a criterion audit. Recorded because the
          constancy is the reason, not because the object is uninteresting.
      - object: 'the 2-adic filtration of E(F_p) (the 2-Sylow subgroup as a tracked object)'
        why_not: >-
          Actually retained in miniature: LANE-COMPLETE uses precisely the
          cyclicity of the order-8 2-Sylow to derive numorder4 = 2 without
          computing division points. A full 2-descent object would be a larger
          apparatus for a fact one Legendre symbol already settles.
      - object: 'the parameter-generation transcript as a formal object (a constraint set plus a search order)'
        why_not: >-
          CHOSEN, as LANE-D8. It is the only node in the DAG that SafeCurves'
          own script does not compute at all, and CONF-2 shows the published
          transcript does not determine the parameter. This is the single place
          in the audit where the program can add something the reference
          pipeline does not have.
    depth_of_verified_structure: >-
      NOTHING WAS VERIFIED COMPUTATIONALLY IN THIS TASK. Depth achieved is
      exactly: (a) retrieved primary text read and transcribed with per-file
      sha256; (b) nine small-integer desk checks performed by hand on staged
      digits (parameter-capsule.yaml `producer_desk_checks`, CHK-DESK-1..9), each
      queued for mechanical re-verification and none treated as evidence; (c) one
      internal inconsistency in the retrieved text located and stated (CONF-2);
      (d) a plan. Deterministic and probabilistic tiers are separated in advance
      (audit-plan.yaml E3) so that no later run can blur them.
    dominated_by: >-
      n/a (no result claimed). Checked explicitly rather than asserted: against
      every attack row this program tracks on the frontier for a prime-field
      curve of this size -- rho at 0.886*sqrt(l) with O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted rho on CM curves (KN-TECH-018), BSGS
      at sqrt(l)/sqrt(l) (KN-TECH-031) and its n^{2/3+o(1)} full cost
      (KN-TECH-035), MOV/Frey-Ruck at small embedding degree (KN-TECH-032), the
      anomalous additive transfer (KN-TECH-033) -- this task proposes no attack
      and therefore competes with none of them. As an AUDIT INSTRUMENT the
      incumbent is SafeCurves' own verify.sage, which dominates this plan on
      authority, on having been run, and on having Sage available; this plan
      dominates it on exactly three points, stated narrowly: (i) it certifies the
      group order by Hasse uniqueness where verify.sage infers the trace by
      rounding, (ii) it derives numorder4 from 2-Sylow cyclicity instead of
      computing division points, and (iii) it treats rigidity as a testable
      transcript rather than reading a verdict from a file. None of the three is
      an exponent, and (ii) is a constant-factor methodological convenience.
    sota_delta: >-
      Zero speedup against any attack baseline, on every axis (time, memory,
      data/queries). Quantitatively as DATA: this program's corpus held zero
      Curve383187 parameter values before this task (novelty screen: 1 hit in
      knowledge/, KN-LIT-6351, a heuristically seeded SafeCurves entry containing
      no curve data; 3 hits in ledger/, all this goal's own records). The capsule
      now carries the full tuple -- p, A, B, (x1,y1), l, cofactor 8, t, l', twist
      cofactor 4, D with its published factorization, both embedding degrees --
      each with a source file, a sha256 and a page version string. As SCOPE: it
      converts three cells from "asserted by a table" to "specified with a
      certificate format and a falsifier", and it converts the `rigid` cell from
      an unexamined True into a located, named inconsistency (CONF-2) with a
      designed discriminating test.
    enumerated_closures:
      - closure: >-
          The A-minimality clause of the rigidity transcript CANNOT be certified
          at p = 2^383-187 in this executor environment.
        mechanism: >-
          Deciding minimality requires, for each candidate A in (2, 229969),
          whether #E and #E' have the required {8*prime, 4*prime} shape. That is
          point counting on ~2.3e5 curves over a 383-bit field. Under environment
          assumption E1 (pure Python, no Sage, no PARI) no SEA implementation is
          available, and BSGS at 383 bits costs ~2^191 operations per curve. The
          obstruction is named (absence of a point-counting oracle), the argument
          is a cost count, and it is a closure of THIS ENVIRONMENT, not of the
          question.
        forward_guidance: >-
          Two classes remain open. (1) VERIFICATION INSTEAD OF SEARCH: if ePrint
          2013/647 states the generation rule, the task becomes checking that
          229969 satisfies it and that a stated smaller candidate does not --
          which needs point counting on O(1) curves, not O(10^5). (2) SCALED
          ELIMINATION: LANE-D8 tests candidate constraint sets at 40-64 bits and
          at 255 bits (Curve25519, the one curve whose transcript is fully
          published), which can ELIMINATE constraint sets even though it cannot
          confirm one at 383 bits.
      - closure: >-
          The intake table and the staged SafeCurves mirror cannot corroborate
          each other for this curve, at any effort level.
        mechanism: >-
          Curve383187 is listed and evaluated on safecurves.cr.yp.to itself, and
          the intake row IS that row. This is not a retrieval shortfall that more
          fetching would fix; the two artifacts have one origin. Named
          obstruction: source non-independence.
        forward_guidance: >-
          Two classes of genuinely independent evidence remain: (1) the
          originating publication, ePrint 2013/647, independent for the tuple and
          decisive for the transcript; (2) in-program recomputation from (p, A, B)
          alone, which is independent by construction and is what every lane in
          audit-plan.yaml is specified to do. The plan chooses (2) as the primary
          route precisely because it does not depend on retrieval succeeding.
      - closure: >-
          The staged mirror supports NO primality certificate for p, l or l'.
        mechanism: >-
          primeproofs.html lists which primes SafeCurves proved; the Pocklington
          proofs live at per-prime proof/<n>.html URLs that were not staged, and
          this role has no Bash while WebFetch returns HTTP 502 for every URL on
          the host. Operational, not mathematical.
        forward_guidance: >-
          The prime list is still usable as a HINT pool under the hint-and-verify
          discipline (audit-plan E2), and closing our own chains from that pool
          is strictly better than retrieving theirs because it is independent.
          Retrieval of the proof pages remains a cheap fallback (GAP-1).
    open_directions_for_next_session:
      - 'Execute the control battery and LANE-BASE. Everything else in the DAG consumes #E = 8l; certify it first.'
      - >-
          Stage a hash-pinned mirror of ePrint 2013/647 following the
          SAFECURVES-20260825 pattern. It is the single highest-value retrieval
          in this campaign: it is the only identified independent source for the
          tuple AND the only plausible resolution of CONF-2.
      - >-
          Run H4's whole-table check (recompute all 60 published cost cells for
          all 20 mirror curves in exact arithmetic). It costs seconds, validates
          the cost-cell instrument across the entire table at once, and any cell
          outside its 0.05 bracket is a located discrepancy.
      - >-
          Consider a scoped handoff for one measurable diagnostic the goal's
          deliberately non-exhaustive list does not name: the joint structure of
          l-1 and l'-1 beyond their embedding-degree cofactors (15 and 1). The
          pair (15, 1) is a two-integer observable and the campaign has no
          baseline for what the pair looks like across the mirror's 20 curves.
          Cheap, and it is a measurement, not an attack.
      - >-
          KN-OPEN-019 (no written object-enumeration for the ECDLP) remains open
          and is untouched by this task. The object enumeration in
          `objects_enumerated_and_not_chosen` above is a three-item sketch scoped
          to a parameter audit, and is explicitly NOT a taxonomy.

  # ---------------------------------------------------------------------------
  # WHAT WAS FOUND, STATED AT ITS TIER
  # ---------------------------------------------------------------------------
  findings_at_planning_tier:
    - id: F1
      tier: 'observation about retrieved text'
      statement: >-
        SafeCurves' verify.sage does NOT compute the `rigid` cell. It executes
        `rigid = readfile('rigid').strip()` and accepts the string "fully rigid"
        or "somewhat rigid". Rigidity is an editorial INPUT to the SafeCurves
        pipeline, not an output of it.
      source: 'retrieved (staged mirror SAFECURVES-20260825), pages/verify.txt, sha256 9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79'
      consequence: 'the `rigid` comparison target is of a different evidentiary kind from the other ten and is handled separately (LANE-RIGID, LANE-D8)'
    - id: F2
      tier: 'internal inconsistency in retrieved text'
      statement: >-
        M-383 and Curve383187 share the prime p = 2^383-187, the Montgomery
        shape, B = 1, cofactor 2^3 and twist cofactor 2^2, yet carry A = 2065150
        and A = 229969 respectively, while rigid.html gives Curve383187 the note
        "p is largest prime smaller than 2^383; B=1; A > 2 is as small as
        possible." Under one identical constraint set at most one of the two can
        be minimal. The alternative explanation "different cofactor requirements"
        is falsified by the staged twist table, which shows the profiles are
        identical.
      source: 'pages/rigid.txt, pages/field.txt, pages/equation.txt, pages/twist.txt (sha256 in the capsule)'
      hypothesis_not_a_finding: >-
        An unstated M-series clause A = 2 mod 4 would explain it; CHK-DESK-5
        verifies by hand that M-221, M-383, M-511 and Curve25519 all satisfy it
        and Curve383187 does not. This is a hypothesis with a necessary condition
        checked, not a sourced fact.
      explicitly_not: >-
        NOT a security claim, NOT an ECDLP claim, and NOT a statement that either
        curve is weak. Per the goal's own claim_boundaries a rigidity failure is
        not a break. This is a statement about a documentation string.
    - id: F3
      tier: 'observation about method'
      statement: >-
        verify.sage obtains the trace as t = p+1-l*round((p+1)/l), guarded by
        l^2 > 16p -- an inference from l, not a certified point count. The
        `disc`, `twist`, `complete` and `ind` cells all consume t.
      consequence: >-
        LANE-BASE step (iv) replaces the inference with a Hasse-uniqueness
        certificate consuming only (p, A, B, x1, y1, l): since l > 4*sqrt(p), the
        Hasse interval contains at most one multiple of l, so exhibiting a point
        of order l forces #E = 8l exactly. This is the plan's clearest
        methodological addition and it costs one ladder multiplication.
    - id: F4
      tier: 'producer desk arithmetic, queued for mechanical re-verification'
      statement: >-
        Three published cells were reconstructed by hand from the scripted
        formulas and matched: rho 2^189.8 (0.5*380 - 0.1746 = 189.825), twist rho
        2^190.3 (0.5*381 - 0.1746 = 190.325), and combined-attack 2^188.3 (the
        greedy peels v = 2 three times because #E carries 2^3 and #E' carries
        2^2, giving precomp = 6 and joint = l/8 = 2^377, hence
        log2(6 + 2^188.325) = 188.325). Also B(A^2-4) = 229969^2-4 = 52885740957
        matched exactly.
      status: 'consistency checks on the staged text; NOT evidence, NOT experiment results, superseded by any mechanical result that disagrees'

  limitations:
    - 'No computation of any kind was executed. Every prediction in the audit plan is a preregistered target, not an observation.'
    - >-
      The only retrieved primary source is the staged SafeCurves mirror, which is
      not independent of the intake for this curve (CONF-1). One retrieved source
      that is the same source as the intake does not satisfy the goal's first
      completion criterion in full, and this report does not claim it does.
    - 'ePrint 2013/647 was NOT retrieved (GAP-3). A WebSearch result list confirmed its existence, authors and URL; nothing else was taken from it.'
    - >-
      WebFetch was deliberately NOT used for any numeric value. The environment
      briefing and inputs/SAFECURVES-20260825/source_record.yaml document that it
      returns a small-model summary that corrupts digits and that two calls on
      one URL disagreed with each other. This is an operational observation about
      tooling and is never mathematical evidence.
    - >-
      The greps used for the mandatory novelty/duplication check touched
      knowledge/ and ledger/ paths outside the handoff's literal read_scope. They
      were read-only, were confined to the patterns "383187" and
      "SafeCurves|safecurves", and are disclosed in the capsule's
      novelty_screen.scope_disclosure rather than left implicit.
    - >-
      The lane budgets assume environment assumption E1 (pure Python, no Sage, no
      PARI), inherited from IDEA-20260807-98a970 and NOT verified in this task. If
      E1 is false the budgets are wrong -- most likely too pessimistic -- and
      LANE-D8's declared infeasibility at 383 bits would need re-examination
      rather than acceptance.
    - >-
      LANE-D8 is the weakest lane and says so in its own record: it validates a
      method at 40-64 bits and 255 bits and transfers nothing automatically to
      383 bits. Its transfer assumption is H3 and H3 claims no rigorous support.

  proposed_successor_handoffs:
    - proposed_id: null
      note: 'This producer allocates no identifiers. Descriptions only; the Coordinator mints IDs and assigns work.'
    - role: executor
      objective: >-
        Execute the audit-plan control battery in its declared order as a
        standalone gate, then LANE-EQUATION and LANE-BASE. Emit the group-order
        certificate (#E = 8l via Hasse uniqueness) as the batch's first artifact.
      why_first: 'cheapest valid discriminator; seven downstream cells consume #E; negative outcome is as informative as positive'
      budget_suggestion: '900 s; the compute is milliseconds, the budget is for harness and certificate emission'
      blocking: 'the control battery is a hard gate; if any control fails, no target cell may be interpreted'
    - role: 'top-level orchestration (not a research role)'
      objective: >-
        Stage a hash-pinned mirror of https://eprint.iacr.org/2013/647 following
        the SAFECURVES-20260825 pattern, with per-file sha256 and a
        source_record.yaml carrying the same fidelity caveats.
      why: 'the only identified independent source for the tuple, and the only plausible resolution of CONF-2 and GAP-3'
      note: 'infrastructure remedy, not research; it asserts nothing about any curve'
    - role: executor
      objective: >-
        Run H4 across the whole mirror: recompute rho, twist-rho and
        combined-attack cost cells for all 20 curves in exact rational/interval
        arithmetic and compare against the published strings.
      why: 'validates the cost-cell instrument across 60 cells at once for seconds of compute; any cell outside its 0.05 bracket is a located discrepancy'
    - role: idea-generator
      objective: >-
        Scoped proposal for one additional sourced, measurable parameter-level
        diagnostic not on the goal's declared list, per the goal's own
        "deliberately non-exhaustive" clause -- candidate named in
        honest_accounting.open_directions_for_next_session.
      note: 'requires a new scoped handoff; this task added nothing to the diagnostic list on its own authority'

  unresolved_conflicts_between_intake_and_retrieved_sources:
    summary: >-
      NO NUMERIC DISAGREEMENT was found between the intake and the retrieved
      staged mirror. The intake carries three fields -- curve name, equation
      y^2 = x^3+229969x^2+x, modulus 2^383-187 -- plus the provenance sentence
      and the eleven True cells, and all of them match the mirror
      character-for-character. THAT AGREEMENT IS A TRANSCRIPTION CHECK AND
      NOTHING MORE: Curve383187 is listed on safecurves.cr.yp.to itself, so the
      intake row IS the mirror row and the two are one source (CONF-1). No
      criterion is raised above `unverified` by it.
    conflicts_carried_forward:
      - 'CONF-1 (structural): intake and mirror are not independent for this curve. Resolution requires ePrint 2013/647 or in-program recomputation.'
      - >-
        CONF-2 (material): the staged rigidity transcript does not determine
        either M-383''s or Curve383187''s A, since both sit at the same prime with
        the same shape and the same cofactor profile under the same published
        note. Assigned to LANE-D8. Not a security claim.
      - >-
        CONF-3 (minor): the intake''s "authors subsequently recommended switching
        to M-383" is corroborated only by the same mirror sentence and by an
        unretrieved-paper search snippet. Recorded as unresolved.
      - >-
        CONF-4 (minor): page version skew inside the mirror (index.html
        2017.01.22 vs field/rho/ladder/verify 2013.10.13 and equation
        2013.10.14). No disagreement observed for Curve383187; recorded so a
        future one is not mistaken for a computation error.
    goal_pause_condition_check: >-
      The goal's pause condition "Primary or authoritative sources leave an
      unresolved conflict in the named curve's parameter tuple" is NOT triggered.
      The TUPLE itself is internally consistent across every staged page and
      shows no numeric conflict. CONF-2 concerns the GENERATION TRANSCRIPT
      documentation, not the tuple. This distinction is drawn deliberately and is
      offered for the Coordinator to overrule if it reads the condition more
      broadly; the Coordinator, not this producer, decides.
