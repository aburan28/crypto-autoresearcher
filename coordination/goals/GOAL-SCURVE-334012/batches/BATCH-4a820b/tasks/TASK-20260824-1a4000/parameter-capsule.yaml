  # ----------------------------------------------------------------------
  # 6. HAND ARITHMETIC (layer C) - cheap checks, honestly labelled
  # ----------------------------------------------------------------------
  internal_consistency_hand_checks:
    status: >-
      PERFORMED BY HAND IN THIS SESSION ON THE TRANSCRIBED DECIMAL TAILS. Not a
      run, not a run record, not evidence. Each is restated as a machine
      obligation in audit-plan.yaml. Their value is that a transcription error
      would very likely have broken one of them, and none broke.
    checks:
    - id: HC-1
      identity: 'd*(1-d) = 3617 * (-3616) = -13079072, so the printed ellipticity value should equal p - 13079072.'
      arithmetic: 'p ends ...494931472367; 931472367 - 13079072 = 918393295; equation.txt prints ...494918393295.'
      outcome: consistent
      machine_obligation: L02
    - id: HC-2
      identity: >-
        (p+1-t) + (p+1+t) = 2p+2. If both orders are 8*l and 8*l' then
        l + l' must equal (2p+2)/8 = (2^415 - 32)/8 = 2^412 - 4.
      arithmetic: >-
        l = 2^411 - c with c = 33364140863755142520810177694098385178984727200411208589594759;
        l' = 2^411 + c' with c' = 33364140863755142520810177694098385178984727200411208589594755;
        c - c' = 4, so l + l' = 2^412 - 4.
      outcome: consistent
      significance: >-
        This ties p, l, l' and the two cofactors 8 and 8 together in one
        identity. It is the single cheapest cross-check available on this tuple
        and it is the reason lane D01 can certify both orders without any point
        counting.
      machine_obligation: D01
    - id: HC-3
      identity: 'l^2 > 16p, the uniqueness condition SafeCurves relies on to determine the trace without point counting.'
      arithmetic: 'l is about 2^411 so l^2 is about 2^822; 16p is about 2^418.'
      outcome: 'consistent by an enormous margin'
      machine_obligation: L03, D01
    - id: HC-4
      identity: '0.886*sqrt(l) with l about 2^411 gives about 2^(205.5 - 0.175) = 2^205.3.'
      outcome: 'consistent with the 2^205.3 printed in rho.txt'
      machine_obligation: L04
    - id: HC-5
      identity: 'p = 2^414 - 17 with 4 | 2^414, so p = -17 = 3 (mod 4).'
      outcome: 'p is 3 mod 4'
      significance: >-
        Relevant to lane L11 only as context: Elligator 1 requires p = 3 mod 4
        AND a special form of d. SafeCurves reports Elligator 2 for this curve,
        not Elligator 1, and L11 must test the Elligator 2 predicate that
        verify.sage actually uses, not the Elligator 1 prose condition.
      machine_obligation: L11

