  # ----------------------------------------------------------------------
  # 2. THE INDEPENDENCE PROBLEM - stated up front, not buried
  # ----------------------------------------------------------------------
  independence_analysis:
    finding: >-
      THE MIRROR AND THE INTAKE TABLE ARE NOT INDEPENDENT SOURCES FOR THIS
      CURVE. Curve41417 was introduced by Bernstein and Lange, who are also the
      authors of SafeCurves; the intake row is a transcription of the SafeCurves
      table itself. Their agreement is therefore ONE source agreeing with
      ITSELF, not corroboration, and it must not be scored as such by any
      downstream task.
    consequence_for_the_goal: >-
      Goal completion criterion 1 ("reconcile the exact parameter tuple to
      retrieved primary or authoritative sources") is met only in the weak sense
      of "reconciled against the originating source". A SECOND-SOURCE
      reconciliation is NOT available from the staged mirror and is recorded
      below as an open gap, not as a satisfied criterion.
    what_would_constitute_independence:
    - An independent implementation's test vectors for Curve41417 that were not
      derived from safecurves.cr.yp.to.
    - A standards document containing the tuple. CHECKED AND ABSENT - see
      standards_absence_check below.
    - Machine recomputation of every derived quantity from (p, d, x1, y1) alone,
      which is what audit-plan.yaml lanes L01-L11 exist to do. THIS IS THE ONLY
      INDEPENDENCE ROUTE ACTUALLY AVAILABLE IN THIS ENVIRONMENT, and it is
      independence-by-recomputation, not independence-by-second-source.
    standards_absence_check:
      method: >-
        Grep for the literals "41417" and "3617" across every specification
        staged in inputs/SAFECURVES-20260825/specs/.
      result: >-
        Four incidental digit hits (sec2-v1.txt, sec2-v2.txt, sp800-186.txt,
        rfc5903.txt); the sp800-186.txt hit was inspected and is the bare token
        "3617" inside an unrelated digit string. No occurrence of "Curve41417"
        in any staged standard.
      interpretation: >-
        Curve41417 is NOT present in SEC 2 v1/v2, RFC 7748, RFC 5639, RFC 5903,
        FIPS 186-5, or SP 800-186 as staged. This is an observation about the
        staged corpus, NOT a claim that no standard anywhere contains it.

