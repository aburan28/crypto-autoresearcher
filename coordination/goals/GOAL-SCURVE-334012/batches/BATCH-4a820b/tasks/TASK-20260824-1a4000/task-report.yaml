  # ----------------------------------------------------------------------
  # UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ----------------------------------------------------------------------
  unresolved_conflicts:
    count: 0
    detail: >-
      ZERO textual conflicts between the user intake and the staged mirror.
      Every intake field that has a mirror counterpart (curve name, equation
      x^2+y^2 = 1+3617x^2y^2, modulus 2^414 - 17, attribution "2013
      Bernstein-Lange (formerly named Curve3617)", and all eleven expected
      criteria as True) agrees character for character.
    why_this_is_not_corroboration: >-
      Curve41417 was introduced by Bernstein and Lange, the authors of
      SafeCurves. The intake row IS a transcription of the SafeCurves table. The
      two sources are one source, and their agreement measures transcription
      fidelity only. Recording it as corroboration would be the exact error the
      handoff warns against.
    pause_condition_assessment: >-
      The goal's pause_condition "primary or authoritative sources leave an
      unresolved conflict in the named curve's parameter tuple" is NOT
      triggered: there is no conflict. That is a factual statement about the
      absence of disagreement and NOT a statement that completion criterion 1
      has been satisfied in substance - see the gaps below.

  # ----------------------------------------------------------------------
  # LIMITATIONS
  # ----------------------------------------------------------------------
  limitations:
  - id: LIM-1
    limitation: >-
      NO INDEPENDENT SECOND SOURCE EXISTS FOR THE PRIMITIVE TUPLE
      (p, d, x1, y1). Everything in the capsule descends from one origin. Eight
      of the twelve recorded quantities (l, h, t, D, twist order, twist
      cofactor, and both embedding degrees) can be made independent by
      RECOMPUTATION under audit-plan lanes L01-L11; the four primitives cannot,
      by any route available in this environment.
    consequence_for_the_goal: >-
      Goal completion criterion 1 is satisfied only in the weak sense of
      "reconciled against the originating source". Any dossier that reports it
      as fully satisfied would overstate the evidence.
  - id: LIM-2
    limitation: >-
      ePrint 2014/526, "Curve41417: Karatsuba revisited" (Bernstein,
      Chuengsatiansup, Lange), was IDENTIFIED via WebSearch but NOT RETRIEVED.
      Its digits are not in this capsule and none were paraphrased from memory.
      Even if retrieved it would be only partially independent, sharing two of
      three authors with SafeCurves.
    failure_mode_recorded: >-
      Not a network failure. The search succeeded and returned metadata only.
      Obtaining the digits would require WebFetch, which is quarantined in this
      session as summarizer-mediated and digit-corrupting, and this role has no
      Bash.
  - id: LIM-3
    limitation: >-
      THE AUDIT PLAN DEPENDS ON THE AUDITED SOURCE FOR ONE INPUT. Lanes L05,
      L06, L09, D01, D04 and D05 avoid integer factorization entirely by trial
      dividing against the prime list SafeCurves itself published in
      primeproofs.txt. That is what makes the audit cost minutes rather than
      months, and it is a genuine circularity of CONVENIENCE, though not of
      LOGIC: each listed prime carries its own Pocklington proof, which L00
      re-verifies, and a wrong or incomplete list produces a residual not equal
      to 1 and is caught by every consuming lane's stopping rule rather than
      silently accepted.
  - id: LIM-4
    limitation: >-
      TWO DIAGNOSTIC COMPONENTS ARE CAS-BOUND AND DEFERRED: the class number
      h(D) in D05, and the full d-minimality transcript in D08. Both carry a
      named obstruction, a cost estimate, and a successor condition. Neither is
      attempted, precisely so that a foreseeable budget stop is not produced and
      then misread.
  - id: LIM-5
    limitation: >-
      RIGIDITY HAS A CEILING NO COMPUTATION REMOVES. L07 Part A can only confirm
      what the designers say they did; even a complete D08 run would confirm
      minimality UNDER THE STATED CONSTRAINTS, never that those were the
      constraints actually used or that no other constraint was silently
      applied.
  - id: LIM-6
    limitation: >-
      THE PLAN IS A PARAMETER AUDIT AND CANNOT SPEAK TO IMPLEMENTATIONS. No lane
      tests constant-time behaviour, side channels, RNG quality, protocol
      composition, or any deployed software. It reproduces threshold predicates
      from one published criterion set.
  - id: LIM-7
    limitation: >-
      N3's full eleven-cell null vector is NOT runnable at 414 bits in this
      environment, because the null curve's own order would require point
      counting. The runnable half is the shape-level lanes plus a scaled-down
      full vector at a 30-bit prime. Both halves must be reported and the
      restriction must not be dropped.
  - id: LIM-8
    limitation: >-
      Every digit was read from a derived .txt file. source_record.yaml declares
      the .html the authority and the .txt a convenience. Lane L00 exists to
      close this and until it runs, every capsule digit carries a one-step
      derivation risk.

  # ----------------------------------------------------------------------
  # WEBFETCH INTEGRITY RESPONSE
  # ----------------------------------------------------------------------
  webfetch_integrity_response:
    coordinator_warning_received: true
    warning_summary: >-
      WebFetch in this environment returns a small-model SUMMARY, not page
      bytes, and that summarizer was shown against raw curl bytes of RFC 7748 to
      collapse three distinct constants into one wrong value, misreport a
      cofactor, and return a subgroup-order tail of the wrong length, with two
      fetches of one URL disagreeing with each other.
    my_exposure: none
    detail: >-
      ZERO WebFetch calls were made in this session, before or after the
      warning. Every digit in parameter-capsule.yaml was read with the Read tool
      from a hash-pinned local file under inputs/SAFECURVES-20260825/. No value
      is quarantined because no value passed through the summarizer. The single
      WebSearch call returned bibliographic metadata and no digits were taken
      from it.
    rules_carried_forward_into_the_plan: >-
      audit-plan lane L00 requires re-derivation from the authoritative .html
      rather than the derived .txt, and requires every file sha256 to be
      re-verified against source_record.yaml before any lane consumes a value.

  # ----------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md 5)
  # ----------------------------------------------------------------------
  honest_accounting:
    objects_considered: 'see audit-plan.yaml honest_accounting.objects_considered (five adopted, one rejected with its reason).'
    dominated_by: 'n/a (no result claimed). Checked: this task proposes no algorithm, so no frontier row applies. The nearest relevant frontier, rho at 0.886*sqrt(l) with O(1) memory, is neither improved nor challenged.'
    sota_delta: >-
      ZERO on time, memory, data and queries. The delta is evidentiary: the
      corpus held zero certified Curve41417 values before this task and holds
      zero after it, since this task produced a PLAN and not a measurement. What
      changed is that eleven criterion cells and eight diagnostics now have a
      preregistered, falsifiable, costed route to certification, with predictions
      fixed in advance so that reproducing SafeCurves would be a controlled
      result rather than a retrospective rationalization.
    enumerated_closures: 'three, each with a named obstruction, an argument, and the classes that remain - see audit-plan.yaml honest_accounting.enumerated_closures.'
    premature_closure_check: >-
      No lane and no combination of lanes is claimed to close the security
      question for this curve, and no direction is declared impossible. The
      declared diagnostic list is treated as deliberately non-exhaustive, per
      the goal's own claim_boundaries.
    novelty_status: known
    novelty_basis: >-
      Reproducing SafeCurves criteria is a routine published exercise that
      verify.html explicitly invites third parties to perform. The corpus screen
      (grep of ledger/, knowledge/, coordination/ for "Curve41417" and of
      knowledge/ for "SafeCurves") found only KN-LIT-6351, a low-confidence
      bulk-seeded stub containing no parameters, and IDEA-20260807-98a970, which
      is reused rather than duplicated. Novel WITHIN THIS PROGRAM as data; not
      novel as mathematics; claimed as neither.

  # ----------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (Coordinator decides; this proposes only)
  # ----------------------------------------------------------------------
  proposed_successor_handoffs:
  - id: SUCC-1
    to_role: executor
    priority: 1
    objective: >-
      Run lane N3's shape-level half plus the L00 source-integrity pass, and
      report the null curve's result vector alongside the file-hash table,
      before any Curve41417 criterion lane is interpreted.
    why_first: >-
      N3 is the cheapest measurement in the plan and the only one whose two
      outcomes lead to materially different conclusions about how much
      information a SafeCurves row carries. L00 is its precondition because a
      derivation error in the .txt layer would corrupt every later comparison.
    estimated_budget: 'under 5 CPU-minutes plus about 30 analyst-minutes.'
  - id: SUCC-2
    to_role: executor
    priority: 2
    objective: 'Run C1, C2, C3 (blocking positive controls), then lanes L01-L11 and D01-D07 in the stated order, emitting one certificate per lane.'
    estimated_budget: 'about 10 CPU-minutes plus about 2 analyst-hours of transcription.'
  - id: SUCC-3
    to_role: 'a session with Bash or a byte-faithful fetch path'
    priority: 3
    objective: >-
      Stage ePrint 2014/526 with a sha256 into inputs/, the way
      SAFECURVES-20260825 was staged, to close capsule GAP-2. Record explicitly
      that it is only partially independent of SafeCurves.
  - id: SUCC-4
    to_role: coordinator
    priority: 4
    objective: >-
      Decide whether to authorize a CAS environment. If yes, promote D05's class
      number and D08's full d-minimality transcript together in ONE handoff;
      they are the only two CAS-bound items in the plan. Estimated cost of the
      binding item is 1 to 3 CPU-days, trivially parallel.
  - id: SUCC-5
    to_role: idea-generator
    priority: 5
    objective: >-
      Generate the portfolio-scale version of N3: how many of the eleven
      SafeCurves criteria does a RANDOM complete Edwards curve over a prime
      2^n - c pass, as a function of n? No record in this program asks this, and
      the answer bounds how much information any single SafeCurves row carries -
      which is the question that would make this whole campaign's eleven-cell
      reproductions interpretable rather than merely correct.
