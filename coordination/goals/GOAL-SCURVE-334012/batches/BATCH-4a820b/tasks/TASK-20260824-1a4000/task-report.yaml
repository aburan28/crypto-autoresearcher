  # ----------------------------------------------------------------------
  # COMPLETION GATE
  # ----------------------------------------------------------------------
  completion_gate:
  - item: >-
      The parameter capsule distinguishes user intake from retrieved primary or
      authoritative sources and records provenance and unresolved conflicts.
    met: true
    where: 'parameter-capsule.yaml: source_layers, independence_analysis, tuple.*.source_layer, unresolved_conflicts, retrieval_log.'
    how: >-
      Three explicitly named layers (A user intake, B staged mirror, C my own
      hand arithmetic) with a per-field source_layer, file path, file sha256,
      and originating URL. Zero textual conflicts were found AND the capsule
      states, in independence_analysis and again in unresolved_conflicts, that
      zero conflicts is uninformative here because the intake was transcribed
      from the same table the mirror contains. Three open gaps are recorded with
      successor conditions.
  - item: >-
      The audit plan covers every one of the eleven criteria in the declared
      category, with a certificate or explicit bound, controls, falsifier,
      budget, and stopping rule.
    met: true
    where: 'audit-plan.yaml: lanes L01-L11.'
    how: >-
      field/L01, equation/L02, base/L03 under basic_parameter_requirements;
      rho/L04, transfer/L05, disc/L06 under ecdlp_security_requirements;
      rigid/L07, ladder/L08, twist/L09, complete/L10, ind/L11 under
      ecc_security_beyond_ecdlp - matching the goal's criterion_categories
      exactly, in the declared criterion_order. Each of the eleven carries
      mechanism, quantitative prediction, certificate or explicit bound,
      controls, budget, stopping rule, falsifier and honest limitation. L05 and
      L09 additionally carry the honest lower-bound fallback with its true
      (non-succinct) verification cost stated.
  - item: >-
      The plan covers every declared additional diagnostic, or records a
      concrete reason and successor condition for a deferred diagnostic.
    met: true
    where: 'audit-plan.yaml: lanes D01-D08.'
    how: >-
      All eight declared diagnostics are mapped one-to-one onto D01-D08 with the
      goal's wording carried in each lane's declared_diagnostic field. Six are
      status planned. D05 is partially_planned: its main body runs, and its
      class-number component is deferred with a named obstruction (no
      class-group algorithm; ENV-1 no CAS), a stated reason, and two alternative
      successor conditions. D08 is DEFERRED_WITH_PARTIAL_PASS: a runnable
      non-squareness screen now, and the full transcript deferred with a costed
      successor condition (roughly 3600 SEA point counts, 1 to 3 CPU-days with a
      CAS, trivially parallel).
  - item: >-
      Positive, parameter-matched negative, and same-shape null controls are
      explicit and run before belief in any later task.
    met: true
    where: 'audit-plan.yaml: controls block, with a BLOCKING gating_rule.'
    how: >-
      POSITIVE: C1 Anomalous (additive transfer and small |D| must fire), C2
      BN(2,254) (multiplicative transfer, small |D|, extra automorphisms must
      fire), C3 synthetic small-field positives for the four boolean-only lanes
      L02/L08/L10/L11. PARAMETER-MATCHED NEGATIVE: N1 E-521 and N2
      Ed448-Goldilocks, each with its matching assumptions AND its deliberate
      mismatches stated, plus an instruction that lanes sensitive to a mismatched
      parameter must not use that control. SAME-SHAPE NULL: N3, a complete
      Edwards curve over the IDENTICAL p = 2^414-17 with a seeded random
      non-square d_null, and N4, the shuffled rigidity transcript. The gating
      rule states that a control failure voids every measurement in that lane
      family as an instrument failure under AGENTS.md rule 5, not as a finding
      about any curve.
  - item: 'The report states that no curve attack ran and makes no safety or vulnerability conclusion.'
    met: true
    where: 'this report: claim_status block above.'

  # ----------------------------------------------------------------------
  # HANDOFF CONSTRAINT COMPLIANCE
  # ----------------------------------------------------------------------
  constraint_compliance:
  - constraint: 'Every SafeCurves True/False cell is user-supplied unverified intake and a preregistered comparison target; it is not evidence.'
    complied: true
    note: >-
      Enforced structurally: the capsule's comparison_table carries a
      reading_rule stating that the 'textual_conflict' column has ZERO
      corroborative weight and that only the 'audit_lane' column can ever carry
      weight, and every row's independent_status is 'unverified'.
  - constraint: 'For a curve SafeCurves itself introduced, the mirror and the intake table are NOT independent; say so explicitly.'
    complied: true
    note: >-
      Stated in capsule independence_analysis.finding as the first substantive
      block of the document, repeated in unresolved_conflicts.interpretation,
      and again in audit-plan closure 3. Also recorded: eight of the twelve
      tuple quantities appear in NO intake field at all and are therefore
      single-source with no comparison target whatsoever.
  - constraint: 'A failure of rigidity, ladder, completeness or indistinguishability is not by itself an ECDLP break.'
    complied: true
    note: 'carried in the honest_limitation of L07, L08, L10 and L11 individually.'
  - constraint: 'Anomalous and BN(2,254) are positive-control candidates, not newly discovered attacks; their parameters still require sourced reproduction.'
    complied: true
    note: >-
      C1 and C2 both require transcription AND self-verification (base point on
      curve, subgroup order times base point neutral) BEFORE use, and both are
      labelled as positive-control candidates rather than discoveries.
  - constraint: 'Reuse IDEA-20260807-98a970 for embedding-degree, anomalous, and full-torsion coverage rather than duplicating it.'
    complied: true
    note: >-
      L05 and D04 both carry an explicit reuse_declaration. The EXACT-k and
      LOWER-BOUND certificate formats, the three degenerate flags (p congruent
      to 1 mod l; l equal to p; l^2 dividing the curve order), the
      decay-parameter control on K, the planted small-k positives, and the
      representability wall are taken unchanged. NO new embedding-degree
      mechanism was minted.
  - constraint: 'Define positive, parameter-matched negative, and same-shape null controls before interpreting any signal.'
    complied: true
  - constraint: 'For every planned lane state mechanism, quantitative prediction, certificate or bound, budget, stopping rule, falsifier, honest limitation.'
    complied: true
  - constraint: 'Retrieve and read sources during this task; record provenance for every citation; do not promote recalled references to support.'
    complied: 'partially, with the deviation disclosed below'
    deviation: >-
      I did not RETRIEVE any source myself. My role has no Bash and the WebFetch
      path is defective in this environment. I READ a hash-pinned local mirror
      that a prior orchestration session retrieved by curl, and I labelled every
      citation "retrieved (staged mirror SAFECURVES-20260825)" with the file
      sha256, never as my own retrieval. NOTHING was cited from memory. The one
      WebSearch call returned bibliographic metadata only and its source is
      recorded as unretrieved.
  - constraint: 'Use only public parameters and generated controls; never test, request, store, or derive a live private key.'
    complied: true
  - constraint: 'Do not run a curve attack, create an experiment result, or state that the curve is safe, unsafe, vulnerable, or free of vulnerabilities.'
    complied: true
  - constraint: 'Infrastructure errors, timeouts and budget stops are operational observations, never mathematical evidence.'
    complied: true
    note: >-
      Applied prospectively as a design decision: D08 and D05's class-number
      component are DEFERRED rather than attempted, precisely so that a
      predictable budget stop is not manufactured and then mistaken for a
      result.
  - constraint: 'Never select a provider, backend, endpoint or model identifier containing Bedrock.'
    complied: true

