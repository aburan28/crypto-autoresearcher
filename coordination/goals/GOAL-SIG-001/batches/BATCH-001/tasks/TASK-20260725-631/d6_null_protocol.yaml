d6_null_protocol:
  task_id: TASK-20260725-631
  goal_id: GOAL-SIG-001
  batch_id: BATCH-001
  status: review_only_freeze
  protocol_id: SIG-D6-NULL-RECAL-v1
  repairs:
    - EV-SIG-005
    - DEC-20260720-001
    - KN-FIND-027
  invalidates_baseline:
    id: LEGACY-T11-D6-SHARED-SRPRED
    statement: >-
      The EXP-SIG-005 D>=6 baseline that compares a T11 degree-histogram
      boolean_null arm to the Semaev arm under a shared Froberg sr_pred, without
      an equal-ncols / support-alignment gate, is permanently invalid for any
      residual_D, deficit_D, extra_D, or birth-law claim at D>=6.
    demonstrated_by:
      - RUN-EXP-SIG-005-k   # n=9 null D6: C5 FAIL
      - RUN-EXP-SIG-005-h   # n=9 sem D6 quantities computed against broken baseline
    pinned_failure_cell:
      n: 9
      t: 3
      ti: 0
      seed: 1
      D: 6
      sem_ncols: 29332
      null_ncols: 31180
      shared_sr_pred: 28068
      null_rank: 31179
      null_deficit: -3111
      null_extra: 4986
      null_residual_6: 4986
      retracted_sem_residual_6: 2615
      retracted_sem_deficit_6: 776
      retracted_sem_extra_6: 8897
    quarantine_rule: >-
      Never cite residual_6=2615, deficit_6=776, extra_6=8897 from RUN-h, nor
      any D>=6 cascade magnitude from EXP-SIG-005, as structural evidence.
      Mentions allowed only under quarantine / invalidation / repair narrative
      fields. Reuse of LEGACY-T11-D6-SHARED-SRPRED without recalibration is a
      claim-integrity failure, not a mathematical result.
  authorization: >-
    Review-only freeze. No rank, syzygy, residual, or Macaulay measurement is
    authorized in BATCH-001 or by this artifact. Independent red-team /
    protocol-review PASS (if later granted) only unlocks scheduling of a later
    executor calibration task under a fresh write_scope plus a separate
    Coordinator ledger authorization. Protocol PASS is not a cascade result,
    not a birth-law confirmation, and not an H-SIG-001 status change.
  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; model is authorized
      fallback under AMEND-PATH-001-001. fallback_used is infrastructure/policy,
      not mathematical evidence.
  separation_from_dreg_ctrl_b:
    statement: >-
      DREG CTRL-B (GOAL-DREG-001) measures support-restricted null rank for
      deficit_genuine on the d_reg / rank channel. This SIG protocol re-derives
      a calibrated null baseline for the signature / non-rewritable residual
      instrument (extra_D, residual_D, closure ranks A_*). Do not treat a CTRL-B
      PASS/admission as discharging this protocol, and do not treat this
      protocol PASS as minting deficit_genuine.
    shared_insight_only: >-
      Both recognize that unequal Macaulay column supports at D6 confound
      arm comparisons; the instruments, metrics, and admission predicates differ.
  instrument:
    object: >-
      F5 / signature-tracked non-rewritable residuals and Macaulay syzygy
      extras on boolean chained Semaev (t=3) — NOT the normal() proxy, NOT
      Yokoyama #G* closure in this batch, NOT DREG block-m4ri deficit_genuine.
    pinned_code_refs:
      experiment: EXP-SIG-005
      h013_sha256: 1ba96fe477c9dc2e7c551c96353c8361d21e40134551342636b2f13015c09087
      builders:
        - experiments/EXP-SIG-005/src/h013_f5_signatures.sage
        - experiments/EXP-SIG-005/src/semaev_tree.py
        - experiments/EXP-SIG-005/src/macaulay_export.py
        - experiments/EXP-SIG-005/src/ic_first_fall_fast.py
    forbid:
      - normal_proxy_as_yokoyama_object
      - reuse_of_LEGACY-T11-D6-SHARED-SRPRED_without_recalibration
      - treating_ENOSPC_OOM_timeout_as_negative_cascade_evidence
  cells:
    primary_calibration:
      n: 12
      t: 3
      ti: 0
      seed: 2
      D_max: 6
      rationale: >-
        EXP-SIG-003/005 P2 birth-law anchor (standard instance). Preferred
        first equal-ncols recalibration cell once measurement is authorized.
    regression_witness:
      n: 9
      t: 3
      ti: 0
      seed: 1
      D_max: 6
      rationale: >-
        Exact cell that demonstrated C5 failure (RUN-k). Used only to prove
        the legacy baseline trips CG-NCOLS / CG-NULL-ZERO and that the
        recalibrated construction either PASS-calibrates or fails closed.
      note: >-
        n=9 remains the documented anomalous size for D4 residuals; a PASS
        at n=9 alone does not admit n-growth laws at D6.
    optional_replication_if_budget:
      n: 12
      seed: 2026
      D_max: 6
  definition:
    name: SIG-D6-NULL-RECAL
    claim_tier: toy
    statement: >-
      Re-derive a D>=6 support-aligned null control for the SIG signature
      instrument such that (i) sem and null Macaulay column sets are identical
      at every measured D in {3,4,5,6}, (ii) a recalibrated semi-regular
      prediction sr_pred_calib is pinned and matched by the null arm, and
      (iii) null extras and residual_D are zero through D=6. Only then may
      Semaev-arm D>=6 cascade observables be computed against that baseline.
    constructions:
      primary:
        id: ALIGN-SEM-SUPPORT
        procedure: >-
          Build boolean chained Semaev and T11 degree-histogram boolean_null
          exactly as EXP-SIG-005. At each D in {3,4,5,6}, form Macaulay column
          sets sem_cols(D), null_cols(D). Diagnostic-only: record
          |null_cols\\sem_cols| and degree histogram of the deleted set.
          For calibrated metrics, restrict the null Macaulay matrix to exactly
          sem_cols(D) before rank / Koszul / residual analysis (delete
          null_cols\\sem_cols). Sem arm uses its native support. Require
          aligned_ncols(D) == |sem_cols(D)| for both arms' calibrated matrices.
        deleted_set_rule: exactly null_cols minus sem_cols
        set_hash_algorithm_id: sha256_sorted_monomial_canonical_v1
        set_hash_procedure: >-
          Canonical monomial line = comma-joined sorted variable indices
          (empty monomial → empty string). Sort by (deg, tuple(sorted(vars))).
          Publish restricted_support_hash = SHA-256 of utf-8 newlines over
          sem_cols lines; deleted_set_hash over (null_cols\\sem_cols).
          Admission fails if hashes mismatch an independent rebuild or if
          deleted_set != null_cols\\sem_cols.
        sr_pred_calib_rule: >-
          Pin sr_pred_calib(D) only after alignment. Accept a candidate only if
          the aligned null satisfies rank_null_aligned(D) == sr_pred_calib(D),
          extra_null_aligned(D) == 0, and residual_D_null_aligned == 0 for every
          D in {3,4,5,6}. Candidate sources, tried in order: (A) Froberg
          semireg_rank_pred on null equation degrees if it matches the aligned
          null ranks at all D<=6; (B) empirical null-aligned ranks themselves,
          labeled empirical_null_rank_baseline, usable only as a control zeroing
          baseline — never as a theorem-grade semi-regularity certificate beyond
          the measured cells. If neither yields null extra=0 and residual=0 at
          D=6 after alignment, outcome is CALIB_NO_GO (instrument), not cascade
          falsification.
      secondary_diagnostic:
        id: REJECT-UNTIL-NCOLS-MATCH
        procedure: >-
          Optional diagnostic only: re-sample T11 boolean_null seeds until
          native ncols_null(D6) == ncols_sem(D6) within budget. If found, still
          require CG-* gates and residual_6_null == 0. Failure to find such a
          seed is not negative mathematical evidence (budget/search censor).
        status: non_blocking_diagnostic
    metrics_after_calibration_only:
      - ncols_sem_D
      - ncols_null_native_D
      - ncols_aligned_D
      - deleted_ncols_D
      - deleted_degree_histogram_D
      - restricted_support_hash
      - deleted_set_hash
      - sr_pred_calib_D
      - rank_null_aligned_D
      - extra_null_aligned_D
      - residual_D_null_aligned
      - after_pass_only__extra_6_sem
      - after_pass_only__A3_6_A4_6_A5
      - after_pass_only__residual_6_sem
      - after_pass_only__deficit_6_vs_sr_pred_calib
  calibration_gates:
    # These gates are the completion_gate requirement: they would have caught
    # the EXP-SIG-005 D6 ncols mismatch before any residual_6 citation.
    - id: CG-NCOLS
      name: equal_aligned_column_support
      machine_check: >-
        For every measured D in {3,4,5,6}: ncols of the calibrated sem matrix
        equals ncols of the calibrated null matrix equals |sem_cols(D)|.
        Additionally record native ncols_null(D); if native ncols_null(D) !=
        ncols_sem(D) at any D>=6, the legacy unaligned baseline MUST be marked
        invalid for that cell (this predicate alone fails RUN-k: 31180 != 29332).
      would_have_caught: >-
        RUN-EXP-SIG-005-k / RUN-h D6 comparison under shared sr_pred without
        equal ncols (31180 vs 29332).
      fail_code: CALIB_FAIL_NCOLS
    - id: CG-SRPRED
      name: sr_pred_calib_matches_aligned_null
      machine_check: >-
        For every D in {3,4,5,6}: rank_null_aligned(D) == sr_pred_calib(D).
        Shared legacy sr_pred that matches neither arm (RUN-k: 28068 vs null
        rank 31179 / sem rank 27292) is forbidden as the calibrated baseline.
      would_have_caught: >-
        Use of shared_sr_pred=28068 that matched neither arm at D6.
      fail_code: CALIB_FAIL_SRPRED
    - id: CG-NULL-ZERO
      name: aligned_null_semiregular_through_D6
      machine_check: >-
        For every D in {3,4,5,6}: extra_null_aligned(D) == 0 and
        residual_D_null_aligned == 0 (closure empty when lower extras are 0).
        Equivalent to repaired C5 at D6 under alignment.
      would_have_caught: >-
        RUN-k c5_null_zero_d6_extra_and_rank=False and
        c5_null_residual6_zero=False (extra/residual_6 = 4986).
      fail_code: CALIB_FAIL_NULL_EXTRA
    - id: CG-D5-CONTINUITY
      name: preserve_valid_D_le_5_null
      machine_check: >-
        On the same cells, unaligned or aligned null at D in {3,4,5} still
        satisfies extra=0 and rank==prediction (EV-SIG-002..005 continuity).
        A repair that breaks the already-valid D<=5 null control is rejected.
      fail_code: CALIB_FAIL_D5_REGRESSION
    - id: CG-SUPPORT-HASH
      name: deleted_set_and_support_hashes
      machine_check: >-
        When ALIGN-SEM-SUPPORT deletes columns: deleted_set == null_cols\\sem_cols,
        deleted_ncols and deleted_degree_histogram published, and
        restricted_support_hash / deleted_set_hash match independent rebuild
        under sha256_sorted_monomial_canonical_v1. Blocks ncols-only mutations
        that delete the wrong columns.
      fail_code: CALIB_FAIL_SUPPORT_HASH
    - id: CG-LEGACY-QUARANTINE
      name: legacy_d6_magnitudes_not_structural
      machine_check: >-
        No EV/DEC/goal citation in the successor package treats
        residual_6=2615, deficit_6=776, or extra_6=8897 from RUN-h as
        structural cascade evidence. Quarantine-field mentions only.
      fail_code: CALIB_FAIL_LEGACY_REUSE
  admission_metrics:
    - cell_identity_matches_declared_n_t_ti_seed_Dmax
    - instrument_sha256_matches_EXP-SIG-005_pins
    - CG-NCOLS_pass
    - CG-SRPRED_pass
    - CG-NULL-ZERO_pass
    - CG-D5-CONTINUITY_pass
    - CG-SUPPORT-HASH_pass_if_alignment_used
    - CG-LEGACY-QUARANTINE_pass
    - certificate_kind_calibration_not_cascade_claim
  outcomes:
    CALIB_PASS:
      requires: all_admission_metrics_pass
      meaning: >-
        A recalibrated D>=6 null baseline exists for the admitted cells under
        SIG-D6-NULL-RECAL. Downstream cascade measurement may be scheduled
        only by Coordinator ledger authorization.
    CALIB_NO_GO:
      requires: >-
        Honest exhaustion of primary construction (and optional secondary
        diagnostic if attempted) with CG-NULL-ZERO or CG-SRPRED failing after
        alignment, without infra censoring.
      meaning: >-
        Instrument cannot presently host a semi-regular equal-ncols null at
        D>=6. Cascade degree-axis claims remain closed. This is an instrument
        no-go, not evidence against residual_D birth structure.
    failed_infrastructure:
      meaning: >-
        ENOSPC/OOM/timeout/kill (AGENTS rule 5) — never CALIB_NO_GO and never
        cascade evidence. Replicate under repaired host resources.
  after_protocol_review_pass_allows_execution_only:
    - schedule_later_executor_calibration_task_under_fresh_write_scope
    - requires_separate_coordinator_ledger_authorization_before_measurement
    - does_not_admit_residual_6_or_birth_law
    - does_not_change_H-SIG-001_status
    - is_not_a_cryptanalytic_result
  after_calib_pass_admissible_observables:
    requires:
      - admitted_calibration_run_receipt
      - all_admission_metrics_pass
      - coordinator_authorization_for_measurement_batch
    then_allows:
      - residual_6_sem_vs_aligned_null_zero_baseline
      - birth_law_test_residual_6_gt_0_at_admitted_cells
      - extra_6_sem_and_closure_ranks_A3_6_A4_6_A5
      - deficit_6_vs_sr_pred_calib_under_equal_ncols
      - degree_axis_cascade_characterization_extension_to_D_eq_6_toy_only
    still_requires_separate_decision: >-
      Whether birth-law / exploitability conclusions update H-SIG-001 remains
      Coordinator-only after independent review of measurement evidence.
  after_calib_pass_still_inadmissible:
    - any_EXP-SIG-005_D6_magnitude_as_structural_evidence
    - residual_6_from_RUN-EXP-SIG-005-h
    - deficit_6_from_RUN-EXP-SIG-005-h
    - unaligned_native_null_D6_under_shared_sr_pred
    - d_reg_sem_less_than_d_reg_null_claim
    - solver_impact_or_sub_rho_claim
    - crypto_scale_or_medium_tier_upgrade
    - DREG_deficit_genuine_citation_via_this_protocol
    - n_growth_law_at_D6_from_single_cell
  already_admissible_without_this_protocol:
    # Cascade remains open only for D<=5 per DEC-20260720-001 / KN-FIND-027
    - D4_residual_law_2n_over_3_plus_1_through_n24
    - D4_deficit_8n_over_3
    - D3_non_Koszul_count_1_on_lattice
    - residual_5_series_through_n18_including_non_monotone_drop
    - D5_deficit_cross_instrument_continuity_with_DREG
  always_not_claimed:
    - crypto_scale_ECDLP_advantage_or_impossibility
    - protocol_PASS_is_cascade_evidence
    - protocol_PASS_is_H-SIG-001_status_change
    - equivalence_of_fallback_model_to_research-sol-max
    - CTRL-B_discharge
    - theorem_grade_semi_regularity_beyond_measured_toy_cells
  budgets_for_later_executor_only:
    wall_clock_seconds_estimate: 3600
    peak_rss_gb_estimate: 24
    disk_safety:
      note: >-
        Relocate Sage TMPDIR/SAGE_TMP off full root volume; ENOSPC at D6 was
        already observed on RUN-l/RUN-n (rule 5).
    write_root: later_executor_task_write_scope_only
  claim_tier: toy
  scope_limits:
    - boolean_chained_Semaev_m_eq_t_eq_3_ti_eq_0
    - toy_n_in_declared_cells_only
    - fixed_degree_proxies_through_D6_not_full_d_reg
    - single_curve_family_boolean_decomposition
