  protocol_under_review: SIG-D6-NULL-RECAL-v1
  claim_under_review: >-
    Frozen review-only protocol SIG-D6-NULL-RECAL-v1 (TASK-20260725-631) is
    complete, verifiable, and honest: it permanently invalidates
    LEGACY-T11-D6-SHARED-SRPRED / EXP-SIG-005 D6 magnitudes; its calibration
    gates would catch the unequal-ncols D6 failure; and it does not authorize
    measurement or reopen the D>=6 cascade without later CALIB_PASS plus
    separate Coordinator ledger authorization.
  verdict: REVISE
  verdict_basis: >-
    Authorization honesty and legacy D6 invalidation hold at snapshot
    91d10c79cec0. Native unequal-ncols (RUN-k 31180 vs 29332) is caught by the
    CG-NCOLS native-mismatch clause. However the protocol's own definition
    requires identical column *sets*, while CG-NCOLS only machine-checks
    cardinalities, and CG-SUPPORT-HASH is admission-optional
    (`_pass_if_alignment_used`). The secondary diagnostic
    REJECT-UNTIL-NCOLS-MATCH searches equal native counts only. Cheapest
    mutation: equal-|cols| but unequal supports yields a path that can claim
    CALIB_PASS without set-identity admission — the same ncols-only hole
    DREG CTRL-B already closed. CG-D5-CONTINUITY "unaligned or aligned"
    wording is also ambiguous. Blocking REVISE until set-equality is a hard
    gate on every CALIB_PASS path.
  breakthrough_claimed: false
  official_state_transition: none
  measurement_authorized: false
  cascade_d6_reopened: false

