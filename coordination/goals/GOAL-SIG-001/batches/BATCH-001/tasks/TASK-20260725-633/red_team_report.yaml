    - OBJ-633-2  # CG-D5-CONTINUITY or → and

  next_concrete_action: >-
    Coordinator ledger-archives this REVISE (TASK-20260725-634), then opens a
    scoped producer repair under a fresh write_scope to (1) make calibrated
    support-set equality + support/deletion hashes unconditional admission
    metrics on every CALIB_PASS path, (2) rewrite CG-NCOLS to set equality,
    (3) close secondary native-match as count-only or require set equality,
    and (4) replace CG-D5-CONTINUITY "or" with explicit unaligned AND aligned
    conjuncts. Re-dispatch independent red-team on the repaired snapshot.
    Do not authorize measurement or treat this review as cascade evidence.

