  required_controls:
    - id: CTRL-SUPPORT-SET
      status: REQUIRED_FOR_PASS
      what: >-
        Hard admission: for every measured D in {3,4,5,6}, calibrated null
        column set equals sem column set (set equality and/or matching
        restricted_support_hash on both arms). Counts alone are insufficient.
      discriminates: >-
        True support alignment from equal-ncols / wrong-column mutations.
    - id: CTRL-SUPPORT-HASH-UNCONDITIONAL
      status: REQUIRED_FOR_PASS
      what: >-
        Remove `_pass_if_alignment_used` optionality; require
        deleted_set==null_cols\\sem_cols (deleted_ncols may be 0), publish
        hashes, and fail closed on rebuild mismatch for every CALIB_PASS path
        including any retained secondary native-match path.
      discriminates: >-
        ALIGN-only hash gating from secondary count-match bypass.
    - id: CTRL-D5-BOTH-MODES
      status: REQUIRED_FOR_PASS
      what: >-
        CG-D5-CONTINUITY must require unaligned D<=5 C5 continuity AND aligned
        D<=5 null-zero / rank match when alignment is used.
      discriminates: >-
        Historical D<=5 preservation from ALIGN regressions masked by "or".
    - id: CTRL-AUTH-SPLIT-PRESERVE
      status: PRESERVED
      what: >-
        Keep review_only_freeze, dual authorization (protocol-review PASS ≠
        measurement; CALIB_PASS ≠ cascade citation without Coordinator auth),
        and always_not_claimed cascade / H-SIG-001 guards.
      discriminates: >-
        Methodology scheduling from illicit D>=6 reopen.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation (zero new algebra): keep |null_cols(D6)|
    == |sem_cols(D6)| (or delete any |null\\sem| columns that are not exactly
    null_cols\\sem_cols so counts match) while leaving null_cols ≠ sem_cols as
    sets. Under the frozen card, CG-NCOLS can pass on counts; CG-SUPPORT-HASH
    can be skipped if ALIGN is not declared; secondary REJECT-UNTIL-NCOLS-MATCH
    even searches for this count match. Expected honest outcome after repair:
    CALIB_FAIL_SUPPORT_HASH / CALIB_FAIL_NCOLS (set form). This mutation is
    exactly the ncols-only failure mode already closed in GOAL-DREG-001 CTRL-B
    admission_metrics.

  baseline_comparison: >-
    Closest specialized baseline remains the EXP-SIG-005 T11 boolean_null under
    C5 (extra=0 and rank==sr_pred through the measured degree; residual_D=0 when
    lower extras vanish). Pollard-rho / BSGS are out of scope for this
    review-only instrument-repair freeze — no end-to-end attack-cost path is
    claimed or owed. Relative to the broken LEGACY-T11-D6-SHARED-SRPRED
    baseline, the protocol correctly invalidates D6 magnitudes; relative to a
    support-aligned null, the frozen gates are incomplete until CTRL-SUPPORT-SET
    is hard-mandatory. Protocol REVISE is not a cascade falsification and not a
    birth-law result.

  narrowest_supported_statement: >-
    At committed snapshot 91d10c79cec0, SIG-D6-NULL-RECAL-v1 honestly freezes a
    review-only repair intent: LEGACY-T11-D6-SHARED-SRPRED / EXP-SIG-005 D6
    magnitudes stay quarantined; native unequal-ncols would have been caught;
    BATCH-001 authorizes no measurement and does not reopen D>=6 cascade or
    change H-SIG-001. The card is not yet PASS-complete because equal column
    *support* (sets/hashes) is not an unconditional CALIB_PASS admission gate
    and CG-D5-CONTINUITY is or-ambiguous. Coordinator must require a producer
    repair before scheduling any calibration executor.

