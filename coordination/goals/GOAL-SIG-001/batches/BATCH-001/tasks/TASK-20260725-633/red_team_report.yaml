  falsification_axes:
    legacy_d6_baseline_invalidation:
      result: NOT_FALSIFIED
      assessment: >-
        invalidates_baseline LEGACY-T11-D6-SHARED-SRPRED correctly pins the
        RUN-k/RUN-h cell (n=9,t=3,ti=0,seed=1,D=6; ncols 31180 vs 29332;
        shared_sr_pred 28068 matching neither arm; null residual_6=4986) and
        quarantines residual_6=2615 / deficit_6=776 / extra_6=8897. Matches
        EV-SIG-005 / DEC-20260720-001 / KN-FIND-027 (cascade admissible only
        for D<=5; D6 magnitudes retracted). Invalidates the broken *baseline
        construction*, not all untested D>=6 nulls — consistent with KN-FIND-027
        limits.
    unequal_ncols_gate_catches_run_k:
      result: NOT_FALSIFIED
      assessment: >-
        CG-NCOLS explicitly records that native ncols_null(D6)!=ncols_sem(D6)
        marks the legacy unaligned baseline invalid and cites 31180!=29332.
        That clause would have blocked the EXP-SIG-005 D6 citation path.
    equal_support_vs_equal_ncols_completeness:
      result: FALSIFIED
      assessment: >-
        definition.statement requires identical column sets, but CG-NCOLS
        machine_check only enforces equal cardinalities after calibration.
        CG-SUPPORT-HASH (set/hash identity) is optional via
        CG-SUPPORT-HASH_pass_if_alignment_used. Secondary
        REJECT-UNTIL-NCOLS-MATCH admits equal native *counts* without set
        identity. ncols-only mutation survives — REVISE blocker OBJ-633-1.
    authorization_does_not_reopen_cascade:
      result: NOT_FALSIFIED
      assessment: >-
        status=review_only_freeze; authorization forbids rank/syzygy/residual
        measurement in BATCH-001; after_protocol_review_pass_allows_execution_only
        unlocks only later executor scheduling + separate Coordinator ledger
        auth; after_calib_pass_admissible_observables still requires
        coordinator_authorization_for_measurement_batch; always_not_claimed
        includes protocol_PASS_is_cascade_evidence and
        protocol_PASS_is_H-SIG-001_status_change. No illicit D>=6 reopen.
    d5_continuity_gate_verifiability:
      result: FALSIFIED_AMBIGUITY
      assessment: >-
        CG-D5-CONTINUITY says "unaligned or aligned null ... still satisfies".
        Inclusive-or reading allows preserving only one mode. Repair intent
        needs both: keep historical unaligned D<=5 C5, and require aligned
        D<=5 zeros when ALIGN-SEM-SUPPORT is used (OBJ-633-2).
    dreg_ctrl_b_cross_discharge:
      result: NOT_FALSIFIED
      assessment: >-
        separation_from_dreg_ctrl_b correctly forbids treating CTRL-B PASS as
        discharging this protocol and vice versa; instruments differ
        (signature residual vs deficit_genuine).

  objections:
    - id: OBJ-633-1
      severity: blocking
      category: ncols_only_vs_set_identity
      objection: >-
        Completeness/verifiability failure: CALIB_PASS can be claimed without
        proving calibrated null support == sem support as sets. CG-NCOLS name
        is equal_aligned_column_support but its machine_check is cardinality
        equality to |sem_cols(D)|. admission_metrics lists
        CG-SUPPORT-HASH_pass_if_alignment_used, so the only set/hash gate is
        skippable when ALIGN is not used. Secondary construction
        REJECT-UNTIL-NCOLS-MATCH stops at native ncols_null(D6)==ncols_sem(D6)
        (counts), not set equality, and is not forbidden as a CALIB_PASS path
        once CG-* count/residual gates pass.
      consequence: >-
        Equal-cardinality but unequal monomial supports at D6 can reintroduce
        the support confound under a false CALIB_PASS — the mutation DREG
        CTRL-B already treats as insufficient (ncols-only gate). Definition
        claim (i) ("column sets are identical") is not enforced by a hard
        admission metric on every path.
      required_repair: >-
        Make support-set identity mandatory for every CALIB_PASS path: require
        calibrated_null_cols(D)==sem_cols(D) (or identical
        restricted_support_hash on both arms) at each D in {3,4,5,6}; promote
        CG-SUPPORT-HASH (or a renamed CG-SUPPORT-SET) to an unconditional
        admission_metric; rewrite CG-NCOLS machine_check to set equality (counts
        as derived); if secondary native-match remains, require
        null_cols==sem_cols as sets (not mere |ncols|), or mark secondary
        non-admissible for CALIB_PASS.
    - id: OBJ-633-2
      severity: blocking
      category: d5_continuity_or_ambiguity
      objection: >-
        CG-D5-CONTINUITY machine_check uses "unaligned or aligned", which a
        literal reader can satisfy by checking only the unaligned historical
        null while an ALIGN repair silently regresses D<=5 aligned extras /
        rank==prediction.
      consequence: >-
        A broken ALIGN construction could still pass CG-D5-CONTINUITY and
        proceed toward CALIB_PASS, violating the stated "must not break the
        already-valid D<=5 null control" intent.
      required_repair: >-
        Replace "or" with explicit conjuncts: (a) unaligned null at D in
        {3,4,5} still has extra=0 and rank==prediction (EV-SIG-002..005
        continuity); AND (b) when ALIGN-SEM-SUPPORT is used, aligned null at
        those D also has extra_null_aligned=0 and
        rank_null_aligned==sr_pred_calib (or the D<=5 prediction pin).
    - id: OBJ-633-3
      severity: nonblocking
      category: sem_not_subset_null_explicit_fail
      objection: >-
        ALIGN-SEM-SUPPORT specifies only deleting null_cols\\sem_cols. If
        sem_cols is not a subset of null_cols, restriction cannot yield
        |sem_cols| columns; fail-closed behavior is implied by CG-NCOLS
        requiring aligned ncols==|sem_cols| but is not an explicit fail_code /
        published intersection metric.
      consequence: >-
        Implementers may pad, impute, or silently drop sem-only columns.
        After OBJ-633-1 set-equality repair this becomes a documentation
        clarity item; until then it compounds the support-identity hole.
      required_repair: >-
        Require sem_cols ⊆ null_cols (publish |sem_cols\\null_cols|) or
        immediate CALIB_FAIL_SUPPORT_SUBSET / CALIB_NO_GO; forbid padding.
    - id: OBJ-633-4
      severity: nonblocking
      category: machine_check_label_honesty
      objection: >-
        CG-LEGACY-QUARANTINE is labeled machine_check but is a successor-package
        citation/review predicate over EV/DEC/goal text, not a numeric matrix
        check.
      consequence: >-
        Mild honesty/verifiability nit; does not by itself reopen D6 cascade if
        quarantine_rule remains binding in Coordinator review.
      required_repair: >-
        Relabel as package_review_check (or supply a closed boolean checker_id
        over named citation fields) before executor admission packaging.

  fatal_objections:
    - OBJ-633-1
    - OBJ-633-2

