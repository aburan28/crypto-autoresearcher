  control_checks:
  - id: C1
    control: >-
      NULL OBJECT for the two-arm envelope law. Random degree-matched elliptic surfaces over
      Q(T) with deg A = 8, deg B = 12 (so d = 2), the same T-box, minimalisation, envelope
      construction and segmented fit, and no Mestre structure at all. Three nulls with
      coefficient magnitudes spanning three orders, 35 families each.
    status: RUN BY THE VALIDATOR; the producer ran no null object for the law
