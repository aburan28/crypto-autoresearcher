    detail: >-
      STEEP ARM FAILS THE CONTROL. The nulls give steep-arm slope medians 24.04, 24.02, 24.09
      with IQR about [23.94, 24.13] at R^2 = 1.000, against the Mestre scan's 22.10 with IQR
      [19.83, 24.32] at R^2 = 0.898. A structureless surface reproduces "slope 12d = 24"
      BETTER than Mestre's families do, because it is a restatement of deg c4 = 8 and
      deg c6 = 12 giving h ~ 24 log t. It carries no information about Shioda-Tate, the
      construction, or the tuple. FLAT ARM PASSES THE CONTROL. All three nulls have no flat
      arm at all: left-arm slope about 21 at R^2 about 0.998, i.e. one straight line across
      the whole box. The Mestre families' left arm sits at median -0.48 with R^2 0.075. The
      two-arm structure, which is the half H-ECQ-8b600d's lever rests on, survives.
