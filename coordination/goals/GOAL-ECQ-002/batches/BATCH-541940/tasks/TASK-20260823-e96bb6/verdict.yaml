  findings:
  - id: F1
    severity: major
    joint: J1
    statement: >-
      report.md section 2 states that none of the 46 low-envelope ceiling->=-12 families
      produced a certified rank-12 fibre inside the searched T-box. Eight of them produced
      twelve, including the report's own section 1 and section 4 headline curve. The report
      contradicts itself.
    what_is_true: >-
      No rank-12 fibre was found BELOW 79.329; the minimum height over all certified rank-12
      fibres anywhere is 86.77369390941135. The substantive fact, which is more informative
      and is stated nowhere, is that within a family the envelope minimum and the rank-12
      locus are disjoint: the headline family's envelope minimum is at t = 4 with h =
      69.28330998318052, where I independently certified the rank as 8, while its rank-12
      fibre is at t = 23, 17.49 log units higher.
    also_unreported: >-
      That 69.28330998318052 sits BELOW the frozen r >= 12 incumbent 69.33884136527462. It is
      not a cell, because the certified rank there is 8, but it is the closest near-miss in the
      run and it appears nowhere in the report.
  - id: F2
    severity: major
    joint: J1
    statement: >-
      The "fibre at T = infinity" column of report.md section 3 is not read from the fibre
      data. It equals sum(m_v - 1) + 1 on every row. The true fibre at infinity is I_4 for
      13352 families and I_6 for 39; no family has I_8, I_10, I_12 or I_14. Only 48 of 13391
      families have all finite fibres irreducible, so "18 to 20 I_1 fibres over the finite
      T-line" and "the type of THAT fibre decides everything" are false for 13343 families.
    consequence: >-
      The generalisation claimed from the BATCH-da59ec I_4-at-infinity finding does not hold:
      the I_4 at infinity is nearly universal here and explains none of the variation. The real
      discriminating variable is the presence of reducible fibres over the FINITE T-line, and
      the rank-hosting families are exactly those with none. The numbers in the table
      (sum(m_v - 1), ceilings, family counts, minimum envelopes, maximum certified ranks) are
      all correct and all reproduce; only the mechanism attached to them is wrong.
  - id: F3
    severity: moderate
    joint: J1
    statement: >-
      report.md section 5 states that the ceiling stratification explains far more of the
      envelope's variance than the content statistic does. One-way eta^2 by ceiling class is
      0.028; R^2 of the envelope on log P2 is 0.192. The claim is backwards by about seven
      times, and within the dominant ceiling-9 class the content R^2 is unchanged at 0.192.
  - id: F4
    severity: moderate
    joint: J1
    statement: >-
      The steep arm of the two-arm law fails a null-object control and the flat arm passes it.
      See control C1. The half of the law the report emphasises is a degree count that a
      structureless degree-matched surface reproduces at R^2 = 1.000, better than Mestre's
      families do; the half the hypothesis' lever actually rests on is real and specific to the
      construction. The report also leaves unmeasured the hypothesis' own strongest claim, that
      the envelope minimum is governed by the flat-arm intercept, which regresses at R^2 =
      0.7732.
  - id: F5
    severity: minor
    joint: J1
    statement: >-
      report.md section 4 reports "our best certified" at thresholds r >= 3, 4 and 5 as
      29.7728 without saying that this curve is frozen ICARM board curve id 108, which
      best_candidates.json does record. No cell is claimed there, so C1' is not at risk, but a
      reader of the report alone would take a rediscovered board curve for a curve this
      program exhibited.
  - id: F6
    severity: minor
    joint: J1
    statement: >-
      462 families were dropped from the scans with no per-family record and no reason
      recorded, and 13391 rows contain one duplicate family (Mestre's published tuple A also
      appears under its canonical translate, with an identical envelope of 79.62377190070106,
      which incidentally confirms the declared translation symmetry is exact). I established
      independently that all 248 missing admissible tuples at spread <= 56 are genuinely
      degenerate, so the exclusion is mathematically correct and only the documentation is
      missing.
  - id: F7
    severity: minor
    joint: J1
    statement: >-
      INTERMEDIATE_BENCHMARK = 79.329 is hard-coded in build_deliverables.py. It is declared as
      coming from H-ECQ-8b600d rather than the frontier file and H-ECQ-8b600d does carry
      79.329, but the frozen board's actual value for curve 1 is 79.32867457792244, so the
      benchmark is a rounded transcription rounded in the direction that makes it marginally
      easier to beat. Immaterial against a +7.4447 miss; recorded because it is exactly the
      class of number the review plan's pre-committed disbelief names. Every one of the 30
      frontier values proper IS read at run time and reproduces.
  - id: F8
    severity: minor
    joint: J1
    statement: >-
      report.md section 3's characterisation of the scope of Mestre's published rank->=-11
      statement is a claim about a paper no agent in this program has read. Under AGENTS.md
