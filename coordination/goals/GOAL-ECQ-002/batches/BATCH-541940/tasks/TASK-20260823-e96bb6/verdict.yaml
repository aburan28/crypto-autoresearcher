  - id: C7
    control: >-
      Decay check on the steep arm, i.e. does h(t) - 24 log t behave as a bounded offset the
      way an asymptotic slope of 24 requires?
    result: fail_for_the_reported_explanation
    detail: >-
      Across the eight large-t nodes the residual fluctuates by 13.2 to 43.0 log units WITHIN
      a single family, against a total steep-arm rise of only about 71.9. Local slopes at
      t = 2000 to 20000 hit exactly 24.000 for several families, so truncation at t = 800 is
      not the mechanism. 3850 of 13391 fitted steep slopes EXCEED 24, up to 75.70, which a
      downward truncation bias cannot produce. The report's stated explanation for the 22.10
      median, "what a box truncated at t = 800 should produce", is not supported; the cause is
      arithmetic minimalisation fluctuation.
  - id: C8
