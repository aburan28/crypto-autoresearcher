red_team_report:
  id: RT-20260823-33a825
  task_id: TASK-20260823-33a825
  batch_id: BATCH-541940
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-8b600d
  joints_owned: [J3, J4]
  verdicts:
    J3: breaks_in_part
    J4: breaks
  snapshot_sha_read: b6e071e03f84361ae1b6da3055ffaeb5ca1c8685
  read_sibling_reports: false
  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    reasoning_effort: xhigh
    fallback_used: false
    degraded_requirements: []
    model_verified: false
    model_verified_note: >-
      No `python3 -m orchestration.adapter doctor --probe` was run in this session, so the model
      identifier is self-reported configuration, exactly as the producer recorded for itself.
    independent_session: true
  retrieval:
    search_knowledge_available: false
    note: >-
      No MCP retrieval tool was exposed to this session. Corpus checks were done by direct read of
      `knowledge/` (grep + file read). Absence of a hit is not evidence that something was not tried.

  claim_under_review: >-
    That tuple choice moves the naive-height envelope of Mestre's construction by 220 log units but
    that this spread is NOT the useful lever, because envelope and attainable rank are two readings
    of the same fibre configuration at T = infinity (report section 3); that the required null
    ladder, varying the number of rational sections 2k at matched coefficient content, shows rank
    buys something at the bottom (k=0 worse) and nothing at the top (k=4 better than k=6), and that
    at the envelope minima the rank present is largely not coming from the construction's sections;
    and that no cell was taken.

  verdict_summary:
    j3_lever_itself: >-
      HOLDS. Tuple choice really does move the envelope and it is not an artifact of tuple size.
      Inside a fixed 0.25-wide log-P2 band the envelope still spans 90 to 120 log units with an
      interquartile range of 25 to 34 (n = 1659 at log P2 in [7.50, 7.75]: 46.92 to 167.17). A
      pure size statistic explains only R^2 = 0.19 (log P2) or 0.27 (log spread) of the variance.
      The scaling quotient the scan uses is exactly information-preserving on the control I ran.
    j3_stratification_table: >-
      BREAKS on the mechanism and on the min-envelope column. The stratifying column is
      mislabelled for 99.64 percent of rows, and the min-envelope ordering does not survive the
      two controls the same report applies elsewhere.
    j4_null: >-
      BREAKS. The k=0 rung is not a null object: it carries large forced rational rank. The ladder
      is unmatched on the very variable section 3 declares dominant, its matching statistic is not
      a size for three of its four rungs, and two rungs lost more than half their intended sample
      without disclosure.
    c1prime: >-
      Nothing here satisfies C1', and the negative is correctly established on the numbers I could
      re-derive. Two scope corrections and one omission are recorded below.

  # ------------------------------------------------------------------ J3
  objections:

  - id: RT-J3-O1
    joint: J3
    severity: high
    target: "report.md section 3, column 'fibre at T = inf'; the sentence 'the type of THAT fibre decides everything'"
    claim_attacked: >-
      "Each has 18-20 I_1 fibres over the finite T-line and exactly one multiplicative fibre at
      T = infinity, and the type of THAT fibre decides everything", with rows labelled I_14, I_12,
      I_10, I_8, I_6, I_4.
    objection: >-
      The column is not a measurement. It is I_(sum+1) computed from the row's own sum(m_v - 1),
      and it is wrong for 13343 of 13391 families. I read the producer's own `fibre_types` field,
      whose last entry is the place `infinity`, and cross-tabulated it against `sum_m_v_minus_1`.
      The ACTUAL fibre at T = infinity is I_4 for 13352 families (99.71 percent) and I_6 for 39.
      It is a near-constant across the whole scan and it stratifies nothing. The label agrees with
      the truth only in the 48 ceiling-13 families that happen to have I_6 there, i.e. 0.36 percent
      of rows. The quantity that actually varies is the number of REDUCIBLE FINITE fibres, and the
      generic configuration is six finite I_2 fibres plus the universal I_4 at infinity, giving
      sum = 9 and ceiling 9. The classes are, exactly - ceiling 15 (n=14) 20 finite I_1 and nothing
      reducible; ceiling 13 (n=82) either 18 I_1 or 16 I_1 plus two I_2; ceiling 11 (n=5) 14 I_1
      plus two I_2; ceiling 9 (n=13257) six finite I_2; ceiling 7 (n=16) four I_2 plus two I_3, or
      eight I_2; ceiling 5 (n=17) four I_2 plus two I_4. So the sentence "18-20 I_1 fibres" is true
      only of the 48 families at ceiling 13 or 15 and false of the 13257-family class it is used to
      describe. I re-derived the construction and the whole fibre census independently, from the
      statement of the construction in H-ECQ-8b600d and PARI polynomial arithmetic, importing none
      of the producer's scripts, and reproduced the producer's sum(m_v - 1), ceiling, fibre list and
      Euler check exactly on six tuples. The NUMBERS in the table are right. The causal attribution
      on top of them is wrong, and it is the part a future batch would be aimed by.
    why_it_matters: >-
      A batch aimed at "control the fibre at infinity" would be aimed at a constant. The steerable
      quantity is whether the discriminant acquires repeated roots over the finite T-line.
    evidence:
      - "cross-tab over tuple_envelope_scan.json families: (sum_m_v_minus_1, ceiling, actual fibre at infinity) -> n"
      - "independent re-derivation, six tuples: (0,1,2,5,6,7) sum 13 ceiling 5 I_4 at inf; (0,1,2,3,4,5) sum 9 ceiling 9 I_4; (0,1,55,56,57,62) sum 3 ceiling 15 I_4; (-17,-16,10,11,14,17) sum 3 ceiling 15 I_4; (0,20,40,45,52,77) sum 5 ceiling 13 I_6; (0,4,17,18,26,31) sum 5 ceiling 13 I_6"
      - "Euler check sum(deg * v_disc) = 24 = 12d in all six, recomputed independently"
    disposition: >-
      The table's numeric columns may be carried forward. The column heading and the mechanism
      sentence must not be, in any evidence, decision or knowledge record. The correct restatement
      is in RT-J3-R1.

  - id: RT-J3-O2
    joint: J3
    severity: high
    target: "report.md section 3, 'min envelope' column and the reading 'the two classes that can host rank 12 are the two classes whose envelopes sit 20 to 40 log units above everything else'"
    claim_attacked: >-
      "What it does do is jump once, at exactly the place that matters -- 29.77 at ceiling 11, then
      50.45 at ceiling 13 and 70.26 at ceiling 15."
    objection: >-
      The jump does not survive the two controls the same report applies in section 6, and section 3
      applies neither. (1) CONTENT. The ceiling classes are not content-matched: minimum log P2 is
      2.862 at ceiling 9, 4.965 at ceiling 13 and 7.082 at ceiling 15. The high-ceiling classes live
      at systematically larger coefficient content, which the report's own regression says costs
      about 14.7 log units of envelope per unit of log P2. (2) SAMPLE SIZE. A minimum over 13257
      draws is not comparable with a minimum over 82 or 14. Applying the section-6 protocol to the
      section-3 table - restrict every class to the common log P2 window [7.0824, 8.1209], then
      subsample the ceiling-9 population to each class's size 20000 times and read off where the
      observed minimum falls in that null - gives: ceiling 5 p = 0.001, ceiling 7 p = 0.004,
      ceiling 11 p = 0.026, ceiling 13 p = 0.033, ceiling 15 p = 0.275, where p is P(size-matched
      generic-class minimum <= observed). Every high-ceiling class is at or BELOW the size-matched
      generic minimum, and ceiling 13 is better than 96.7 percent of size-38 draws from the generic
      class. Restricting to the exhaustively enumerated box (spread <= 74, n = 13077) gives the same
      answer to three decimals. Independently, the pooled regression I fitted on the null-ladder
      data gives envelope = 12.14 + 13.82 log P2 - 0.30 ceiling: after adjusting for content the
      ceiling coefficient has the OPPOSITE sign to the claimed mechanism.
    why_it_matters: >-
      This is the step that converts "P1 is confirmed by a wide margin" into "that reading is the
      wrong one". With the controls applied, the data do not show that a high ceiling costs envelope.
      They show that high-ceiling tuples are RARE and that the ones enumerated so far happen to be
      large. That is a density obstruction, not a coupling, and it has different forward guidance.
    evidence:
      - "common log P2 window across all six ceiling classes [7.082400, 8.120900]; in-window minima 47.188 / 53.356 / 46.922 / 64.079 / 53.033 / 72.168 for ceilings 5/7/9/11/13/15"
      - "20000-draw size-matched subsampling null from the in-window ceiling-9 population (n = 6966)"
      - "pooled OLS on the null-ladder window rows, n = 337"
    disposition: >-
      The mechanism sentence "The same reducible fibre that buys a small model destroys the
      Mordell-Weil rank that made the model worth having" is NOT supported at the tested scale and
      must not be promoted. The rank half of the coupling is supported and is stated in RT-J3-R2.

  - id: RT-J3-O3
    joint: J3
    severity: high
    target: "report.md section 2, 'none of those 46 produced a certified rank-12 fibre inside the searched T-box'; section 8 budget note"
    claim_attacked: >-
      The load-bearing negative that overturns the raw-envelope reading of P1.
    objection: >-
      The scoping words are present and correct, and the report does say the searched fibre sets are
      smaller than the families offer. What is missing is the number, and the number is small. I
      reconstructed the coverage from the three rank-search run records. Of the 46 families with
      envelope below 79.329 and ceiling >= 12, SIX WERE NEVER RANK-SEARCHED AT ALL, and across the
      other 40 the search covered 1244 of 3358 available (family, t) pairs, i.e. 37.0 percent. Class
      coverage is worse where it matters most: 38 of 82 ceiling-13 families at 19.8 percent of their
      fibres, and 3 of 14 ceiling-15 families at 8.5 percent of their fibres. Runs 006 and 011 also
      carried `--max-families 60`, `--t-per-family 40` and `30`, and `--height-cap 120` and `130`,
      so the box searched was smaller than the declared T-box by construction as well as by budget.
      The observed hit rate is 12 certified rank-12 fibres in 1391 searched ceiling->=13 fibres,
      about 0.9 percent; the 2114 unsearched fibres among the 46 are therefore not obviously empty.
      A timeout is never negative mathematical evidence, and this conclusion is carrying weight it
      cannot bear at 37 percent coverage.
    evidence:
      - "RUN-ECQTUP-416e78-005 3898 fibres / 332 families; -006 584 fibres / 18 families, time_budget_reached true, 2 PARI alarms; -011 687 fibres / 23 families, time_budget_reached true, 1 PARI alarm"
      - "union over the three searches: 363 distinct families, 5169 fibres with a computed ceiling"
    disposition: >-
      Report the coverage fraction beside the negative in any record that cites it. The next action
      in `next_concrete_action` finishes the 2114 fibres and settles it.

  - id: RT-J3-O4
    joint: J3
    severity: medium
    target: "report.md section 2, 'only 46 have a Shioda-Tate ceiling that even permits rank 12'"
    claim_attacked: >-
      That the ceiling is a valid filter for discarding the other 1443 low-envelope families.
    objection: >-
      The ceiling bounds rank MW(E/Qbar(T)), the GENERIC rank. It does not bound the rank of a
      specialisation over Q, which is at least the generic rank and can exceed it. This program's
      own curated finding KN-FIND-6b3e17 already narrows exactly this quantifier and adds that the
      published record ladder "is built from `extra` of order +10 to +12 on higher surfaces". The
      report flags the caveat once, honestly, and then leans on the filter as if it were binding.
      In this batch's favour, and I checked it: across all 5169 searched fibres with a computed
      ceiling, ZERO exceeded their family's ceiling and only 7 attained it, so `extra <= 0` here.
      But that is measured at 0.36 percent coverage of the ceiling-9 class (3454 of 967761 fibres),
      and it is a statement about small |t|.
    disposition: >-
      Keep the filter as an efficient heuristic with its measured support ("extra <= 0 in 5169
      fibres over |t| <= 800"), never as a structural impossibility for the discarded 1443.

  - id: RT-J3-O5
    joint: J3
    severity: low
    target: "report.md section 5, 'flat arm slope: median -0.48 -- flat, as the law says'"
    claim_attacked: >-
      That the measured envelope obeys the piecewise law H-ECQ-8b600d asserts, per family.
    objection: >-
      Median flat-arm R^2 is 0.075, interquartile range [0.019, 0.174]; the flat-arm slope has
      interquartile range [-3.31, +2.72] and 5-95 percent range [-7.66, +6.15], with 31 percent of
      families above +2 and 37 percent below -2. A slope near zero with R^2 near 0.08 is scatter,
      which is CONSISTENT with flat but is not evidence for a law. The median is doing all the work
      and the population is very heterogeneous. This touches J1 (the validator's joint) and is
      recorded here only because "the envelope" is the object my joint is about.
    disposition: >-
      Do not describe the flat arm as a fitted law without the per-family R^2 distribution beside it.

  - id: RT-J3-C1
    joint: J3
    severity: none
    target: "report.md section 7, canonical form quotients scaling a_i -> L a_i, T -> L T"
    claim_attacked: >-
      That quotienting tuple space by the scaling symmetry does not discard reachable envelopes.
    objection: >-
      CONTROL RUN AND IT CLEARS THE PRODUCER. I measured the envelope over the identical 73-value
      T-box for L times (0,1,2,5,6,7), L = 1,2,3,5,7, with my own implementation. All five give
      25.429739 exactly, at t = L. The quotient is information-preserving on this control and the
      220-unit spread is not inflated or deflated by it. Recorded because a spread reported over a
      quotient is exactly the kind of thing that should be checked and was not.
    disposition: No action.

  # ------------------------------------------------------------------ J4
  - id: RT-J4-O1
    joint: J4
    severity: critical
    target: "report.md section 6, final paragraph; scripts/null_ladder.py docstring 'k = 0 -> 0 sections (generic rank 0 by construction)'"
    claim_attacked: >-
      "the k = 0 families -- which have no rational section by construction -- reached certified
      ranks of 6, 5, 5, 4, 4 ... at their envelope minima ... At the small-|t| specialisations where
      the envelope lives, the rank that is actually there is largely not coming from the
      construction's sections."
    objection: >-
      THE NULL IS NOT A NULL, AND THE READING IS INVERTED. I ran the null-object control the batch
      owes and did not run: 79 RANDOM elliptic curves y^2 = x^3 + Ax + B sampled at matched naive
      height (h approximately 60, 70 and 93), measured with the SAME instrument (PARI ellrank under
      an alarm). Result: maximum rank 2, mean 0.48 / 0.67 / 0.58 by band, and ZERO of 79 at rank >= 3.
      The k=0 rung's 15 certified curves sit at h = 69.05 to 103.62 and give 12 of 15 at rank >= 3,
      5 of 15 at rank >= 4, and one at rank 6. Under the hypothesis that k=0 curves behave like
      random curves of the same height that outcome is not close to possible. So the k=0 families
      carry large FORCED rational rank, and the mechanism is available in the construction itself:
      with three irreducible quadratic factors the twelve geometric sections occur in
      Galois-conjugate pairs, and the TRACE of a conjugate pair is a rational point. `n_sections`
      counts rational roots and therefore reports 0; the rational Mordell-Weil rank is not 0. The
      ladder's contrast is therefore roughly 11 down to 5, not 11 down to 0, and the sentence about
      where the rank comes from is exactly backwards - it is coming from the construction, from the
      part the ladder failed to remove.
    secondary_confound: >-
      The comparison is also made at unmatched height. The k=6 certified curves span h = 25.43 to
      66.24 and the k=0 curves span 69.05 to 103.62. Rank rises steeply with height in this very
      data. "Comparable ranks" across a 30-log-unit height gap is not a comparison.
    evidence:
      - "own run, 79 random curves, PARI ellrank under a 10 s alarm, seed 20260823; h~60 n=25 resolved 25 dist {0:13,1:12}; h~70 n=30 resolved 30 dist {0:12,1:16,2:2}; h~93 n=25 resolved 24 dist {0:10,1:14}"
      - "RUN-ECQTUP-416e78-007 certified_at_envelope_argmin k0: ranks 2,3,3,4,5,2,3,5,6,2,4,4,4,3,3 at h 69.05..103.62, ellrank r_low = r_high in 14 of 15"
    disposition: >-
      The final paragraph of section 6 must not be carried into any record. The ladder needs a
      bottom rung that actually has no rational sections - see RT-CONTROL-2.

  - id: RT-J4-O2
    joint: J4
    severity: high
    target: "report.md section 6 table and scripts/null_ladder.py docstring 'varies EXACTLY the parameter the premise says matters, and nothing else'"
    claim_attacked: >-
      That the ladder holds everything fixed except the number of rational sections.
    objection: >-
      It does not hold the fibre configuration fixed, and by the report's own section 3 the fibre
      configuration is the variable that "explains far more of the variance" than content. Ceiling
      composition per rung, read from the run record: k6 has 147 of 150 at ceiling 9; k4 has 57 of
      68 at ceiling 13 plus 4 at 15; k2 has 25 at 13 and 12 at 15; k0 has 45 at 13 and 10 at 15. The
      treatment arm is essentially the generic ceiling-9 population and the null arms are majority
      high-ceiling. The cause is the generation scheme, not k: for k=6 admissibility is obtained by
      REJECTION (0.15 percent of tuples survive phi = 0), for k<6 it is obtained by SOLVING the last
      quadratic's constant term for phi = 0, and solved families land in the no-finite-collision
      stratum far more often. So the ladder is matched on the weak covariate and unmatched on the
      strong one. This also produces an internal contradiction the report does not notice: under
      section 3's mechanism the k=4 rung, being mostly ceiling 13, should have been WORSE than the
      mostly-ceiling-9 treatment; it is better. Sections 3 and 6 cannot both be read as written.
    evidence:
      - "RUN-ECQTUP-416e78-007 rungs: per-rung Counter of surface.shioda_tate_ceiling"
      - "null_ladder.py gen_rung solves `solve_last_n` for admissibility; tuple_scan filters for it"
    disposition: >-
      Any restatement of section 6 must either stratify by ceiling or match on it. My covariate-
      adjusted version is in RT-J4-R1 and it changes the interpretation, not the sign.

  - id: RT-J4-O3
    joint: J4
    severity: high
    target: "scripts/admissible.py content_p2 docstring 'the natural size of a tuple'; report.md section 6 'matched coefficient content'"
    claim_attacked: >-
      That log P2 matches the rungs on size.
    objection: >-
      P2 is the sum of squares of the CENTRED ROOTS. That is a size only when the roots are real.
      The null rungs have irreducible quadratic factors with complex-conjugate roots, for which
      P2 = s^2 - 2n can be zero or negative. It is: 34 of 150 rows on the k=0 rung, 16 of 72 on k=2,
      2 of 68 on k=4 and 0 of 150 on the treatment have content_P2 <= 0. `matched_null` takes
      math.log of content_P2 and keeps only rows with content_P2 > 0, so 52 of 440 null rows are
      DROPPED FROM EVERY CONTENT-MATCHED COMPARISON, and 23 percent of the rung the report calls
      "clearly worse" disappears without a line of disclosure. The exclusion is also not random - it
      selects on the root configuration, which is the manipulated variable. NARROWEST TRUE
      CONCLUSION, and I checked it rather than assuming: the dropped rows have similar envelopes
      (k0 dropped median 134.36 against kept 136.64; k2 108.49 against 112.91), so this is a
      disclosure and construct-validity defect, NOT a result-changing one.
    disposition: >-
      State the drop count in any record quoting the matched-window table, and use a matching
      statistic that is a size for complex roots (for instance sum of |root|^2, or log of the
      Mahler measure of q).

  - id: RT-J4-O4
    joint: J4
    severity: high
    target: "RUN-ECQTUP-416e78-007 rung sizes versus generation counts"
    claim_attacked: >-
      That the reported rung sizes are the samples that were drawn.
    objection: >-
      `generation` records n_generated = 150 for each of k4, k2 and k0. The measured rungs are 68,
      72 and 150. So 82 of 150 k=4 families and 78 of 150 k=2 families were generated and then
      failed measurement, against zero attrition on k=0 and on the treatment. That is 55 percent and
      52 percent DIFFERENTIAL attrition on exactly the two middle rungs, and `null_ladder.py` keeps
      only rows with status 'measured', so the lost families are not recorded anywhere and the loss
      cannot be audited for bias. The rung carrying the report's most surprising claim - that going
      from 8 to 12 rational sections buys nothing - is 45 percent of its intended sample, and the
      report gives its n as 68 and 44 with no mention that 150 were drawn.
    disposition: >-
      Record the attrition and, on any rerun, persist the failed families with their failure reason.

  - id: RT-J4-O5
    joint: J4
    severity: medium
    target: "report.md section 6, both readings"
    claim_attacked: >-
      Two directional conclusions stated with no uncertainty of any kind.
    objection: >-
      No confidence interval, standard error, or test appears anywhere in section 6, and the
      quantity compared is a median of 44 to 147 heavy-tailed observations. I computed them.
      In-window bootstrap (20000 resamples): median(k6) - median(k4) = +21.56 with 95 percent CI
      [+8.59, +32.78]; k6 - k2 = -10.04 [-23.64, +4.89]; k6 - k0 = -35.27 [-46.27, -29.09]. After
      adjusting for BOTH content and ceiling (pooled OLS, n = 337), mean residuals are k6 -11.41
      [-14.58, -8.19], k4 -17.53 [-24.64, -10.08], k2 -0.86 [-7.74, +6.28], k0 +25.95
      [+21.18, +30.63]. BOTH of the report's directional readings survive my adjustment as
      statements about the measured populations - k0 is much worse, k4 is not worse than k6. What
      does not survive is what either one MEANS, because of RT-J4-O1 and RT-J4-O2.
    disposition: >-
      Carry the intervals, not the bare medians, into any evidence record.

  # ------------------------------------------------------------------ C1'
  - id: RT-C1-O1
    joint: J4
    severity: medium
    target: "report.md section 4, 'none of the four is a board curve rediscovered'"
    claim_attacked: >-
      That the batch's certified output contains no rediscovered published curve.
    objection: >-
      True of the four curves the report displays, and materially incomplete. `best_candidates.json`
      carries twelve `records`, and three of them - the best certified curves at rank thresholds 3,
      4 and 5 - have `already_on_the_frozen_icarm_board: true`. The curve is ainvs [1,-1,0,-415,3481],
      curve_key 19929:-2917917, h = 29.772761127041008, which is ICARM snapshot id 108, submitted by
      David Renshaw with the commentary "From the tables of Elkies-Watkins 2004, 'Elliptic curves of
      large rank and small conductor' (ANTS-VI, arXiv:math/0403374)". So the section-3 table's
      ceiling-11 row minimum, 29.773, IS a published curve. The Coordinator's P1 instruction to
      "check it is not simply a board curve rediscovered" fired on a real case and the firing is not
      in the report. Read the other way, which the report also does not do: this is the batch's
      strongest positive control - the pipeline independently rediscovered an Elkies-Watkins curve
      at its exact board height - and it is unclaimed.
    disposition: >-
      Say both things explicitly in the evidence record. Also note that no CREMONA check was
      performed anywhere; only the ICARM snapshot was checked, and C1' names both.

  - id: RT-C1-O2
    joint: J4
    severity: low
    target: "best_candidates.json records; C1' clause on the ICARM verifier"
    claim_attacked: >-
      That the deliverable is submission-ready material for C1'.
    objection: >-
      C1' requires acceptance by the ICARM verifier (exact 2-descent, quadratic characters at good
      primes, no floating point). The rank-12 candidate's RUN RECORD carries
      `pari_ellrank_r_low = pari_ellrank_r_high = 12`, which is a descent-based DETERMINATION of the
      rank and is the single most relevant field for that clause. It is not carried into
      `best_candidates.json`, which reports only `rank_lower_bound`. The material exists and the
      submission-format artifact drops it.
    disposition: >-
      Carry `pari_ellrank_r_low/r_high` and its alarm status into any ICARM-format record.

  - id: RT-C1-O3
    joint: J4
    severity: low
    target: "the task card's framing 'NO cell taken at any of 30 rank thresholds'"
    claim_attacked: >-
      The breadth of the established negative.
    objection: >-
      The frozen frontier does carry 30 rank thresholds. `best_candidates.json` compares TWELVE,
      because thresholds 13 to 30 have no certified curve from this batch to compare. The honest
      statement is "no cell taken at the 12 thresholds where this batch certified a curve, and no
      curve at all at thresholds 13 to 30". Same operational conclusion, narrower tested scope. This
      is a Coordinator framing, not a producer claim; the producer's own report says twelve.
    disposition: Use the twelve-threshold wording.

  # ------------------------------------------------- what I verified and cleared
  independent_rederivations:
  - id: RT-RD1
    what: The ICARM naive-height definition the whole comparison depends on.
    method: >-
      Recomputed h = log max(|c4|^3, c6^2) on the minimal model from the a-invariants of seven
      frozen-snapshot board curves, using no producer code and the board's own numbers as ground
      truth.
    result: >-
      Agreement to 0.000000e+00 on ids 42, 55, 50, 157, 244, 276 and 273 (h = 11.613603, 24.317973,
      61.506851, 69.338841, 85.189258, 118.770177, 442.085423), and every one of those models is
      already minimal. The producer's height function is definitionally aligned with the board.
    verdict: agrees
  - id: RT-RD2
    what: The four reported candidate curves and the two published controls.
    method: >-
      Own implementation of the construction from the statement in H-ECQ-8b600d (p = q(x-T)q(x+T),
      g the monic degree-6 truncation with deg(p - g^2) <= 5, r = g^2 - p), own quartic invariants,
      own minimalisation, from the TUPLE and t alone.
    result: >-
      [0,20,40,45,52,77] t=23 -> 86.7736939094; [0,1,53,55,64,67] t=9 -> 74.1214782342;
      [0,1,29,32,33,37] t=10 -> 61.1273905394; [0,2,44,49,51,58] t=4 -> 68.6386346419;
