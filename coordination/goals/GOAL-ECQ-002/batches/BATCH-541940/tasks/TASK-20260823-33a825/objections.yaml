  required_controls:
  - id: RT-CONTROL-1
    name: Size-matched, content-matched restratification of the section-3 table
    why: >-
      It is the cheapest thing that decides whether the ceiling costs envelope or whether the
      high-ceiling classes are merely rare and large. It uses no new compute.
    procedure: >-
      Restrict every ceiling class to the common log P2 window, subsample the ceiling-9 class to
      each class's size 20000 times, and report the observed minimum's percentile in that null
      beside the raw minimum. Run this on the exhaustive box separately from the mixture.
    status: RUN BY THIS REVIEW; result in RT-J3-O2.
  - id: RT-CONTROL-2
    name: A bottom rung that actually has no rational sections
    why: >-
      RT-J4-O1 shows the current k=0 rung is not one. Without it the ladder measures a contrast of
      about 11 to 5, not 11 to 0, and P3 is only half-tested.
    procedure: >-
      Build q irreducible of degree 6 with Galois group containing no index-2 subgroup fixing a
      section pair (or simply take q irreducible with group S_6), still solving phi = 0, so that no
      conjugate-pair trace is rational. Verify the claim rather than assume it, by exhibiting that
      ellrank finds no more points than the random-curve null at matched height.
    status: NOT RUN; owed.
  - id: RT-CONTROL-3
    name: Random-curve rank null at matched naive height
    why: >-
      It is the null object for every rank claim in this batch and nothing in the batch has one.
      Any statement of the form "rank r at height h is / is not impressive" is uninterpretable
      without it.
    procedure: >-
      Sample A, B so that log max(|c4|^3, c6^2) lands in the target band, run the same PARI ellrank
      under the same alarm, report the rank distribution.
    status: >-
      RUN BY THIS REVIEW at h approximately 60, 70 and 93, n = 79, resolved 78. Max rank 2, mean
      0.5 to 0.7, zero at rank >= 3. Should be extended to h approximately 80 and 100 and to n = 200
      before it is cited as a distribution rather than as a bound.
  - id: RT-CONTROL-4
    name: Finish the truncated rank search on the 46 load-bearing families
    why: RT-J3-O3. The negative that carries the batch's central interpretive move is at 37 percent coverage.
    procedure: >-
      Search the 2114 unsearched (family, t) pairs among the 46, including the 6 families never
      touched, with no height cap and no --max-families, and report the coverage fraction reached.
    status: NOT RUN; owed.
  - id: RT-CONTROL-5
    name: Ceiling-stratified null ladder
    why: RT-J4-O2. The ladder is unmatched on the dominant covariate.
    procedure: >-
      Either generate each rung within a fixed ceiling stratum, or report the ladder separately
      within ceiling 9 and within ceiling 13. Both are free given the existing data for the second.
    status: PARTIALLY RUN BY THIS REVIEW as a covariate adjustment; see RT-J4-O5.

  counterexample_or_mutation: >-
    The decisive mutation is RT-CONTROL-3 applied to the k=0 rung, and it is already run. Take the
    identical instrument and point it at a random elliptic curve of the same naive height: 79 draws
    at h approximately 60, 70 and 93 give a maximum rank of 2 and zero curves at rank >= 3, while
    the batch's "rank 0 by construction" rung gives 12 of 15 at rank >= 3 and one at rank 6. The
    quantity that the parameter k was supposed to destroy did not decay when k went to 0, which is
    the canonical artifact tell of docs/inventor-protocol.md section 3 - except that here it is not
    an artifact in the measurement, it is a mis-specified null object. The cheapest mutation that
    would confirm the mechanism I name is to take one k=0 family, form the trace P + P^sigma of one
    Galois-conjugate pair of sections at the family's envelope argmin, and check it is a rational
    point of infinite order on the minimal model. That costs one number-field arithmetic call.

  proves_too_much_control:
    assigned: false
    run_anyway: true
    object_chosen: The section-3 mechanism applied to its own ceiling-11 row.
    result: >-
      The argument "more reducible fibres buy a smaller model and cost rank" already fails inside
      its own table between rows 3 and 4: ceiling 11 (fewer reducible fibres) has min envelope
      29.773, LOWER than ceiling 9's 30.323. The report calls that pair "within the noise of very
      unequal class populations" and then treats a pair of the same kind, ceiling 11 against ceiling
      13, as the decisive jump. One standard of evidence is applied to the comparisons that
      contradict the mechanism and another to the comparison that supports it. Separately, the
      29.773 that anchors the "noise" row is a published Elkies-Watkins curve (RT-C1-O1), so the row
      is not a measurement of this construction's reach at all.

  baseline_comparison:
    note: >-
      Pollard-rho and BSGS are ECDLP baselines and do not apply to a rank-record search; recorded
      here so their absence is a scoping statement rather than an omission.
    declared_baseline: >-
      The pre-registered frozen ICARM frontier, coordination/goals/GOAL-ECQ-002/baseline/
      frontier_20260823.json, snapshot sha256 118db069...cadc59, which I recomputed and confirmed.
      Every one of the twelve comparable rows misses, by +5.4548 (r >= 5) to +17.4349 (r >= 12).
      No row is close.
    construction_class_baseline: >-
      ICARM id 1, ainvs [0,0,1,-6349808647,193146346911036], rank 12, h = 79.32867457792244,
      commentary "Found by Mestre (1982) ... via Dujella's elliptic-curve rank-records tables".
      Best here at certified rank 12 is 86.7737, so +7.4447. NOT beaten.
    closest_specialised_baseline: >-
      Elkies-Watkins 2004, "Elliptic curves of large rank and small conductor", ANTS-VI,
      arXiv:math/0403374, as represented on the frozen board by id 108
      (ainvs [1,-1,0,-415,3481], rank 5, h = 29.772761127041008). This batch's pipeline
      REDISCOVERED that exact curve and reported it as its own best at rank thresholds 3, 4 and 5.
      That is the correct comparator for the low-rank end and the report does not name it.
    dominated_by:
      time: null
      memory: null
      data_or_queries: null
      axis_check: >-
        `dominated_by` is deliberately left unset because this deliverable makes no
        time/memory/query claim to compare - the deliverable's axes are (certified rank, naive
        height) and on THOSE the result is dominated on every one of the twelve rows by the frozen
        frontier, and additionally at ranks 3-5 by Elkies-Watkins 2004 which it rediscovered. Stated
        as an axis-by-axis check rather than a null so that no later reader reads a null as "checked
        and clear".
    provenance_of_citations:
      icarm_snapshot: retrieved (read directly from the committed frozen snapshot file)
      elkies_watkins_2004: >-
        kb-adjacent. The bibliographic identification comes from the frozen ICARM snapshot's own
        `commentary` field, which I read. The PAPER itself was not opened in this session. Treat as
        a pointer, not as support, until an agent reads it.
      dujella_tables: recalled (named in the snapshot's commentary; not opened here)
      kn_find_6b3e17: internal (read directly at knowledge/findings/KN-FIND-6b3e17.md)

  coordinator_priors_judged:
  - prior: P1
    coordinator_expected: >-
      Tuple choice moves the envelope substantially, roughly the 79-to-110 spread; the prior that
      predicts success and is therefore most suspect.
    verdict: RIGHT, AND BY MORE THAN PREDICTED, AND NOT A DESIGNED ARTIFACT.
    basis: >-
      Raw spread 220.26. More to the point, the size-artifact hypothesis is refused by the data: at
      essentially fixed coefficient content (log P2 window of width 0.25) the envelope still spans
      90 to 120 log units with IQR 25 to 34, and the exact scaling symmetry that could have
      manufactured spread is quotiented soundly (RT-J3-C1). You did not design the measurement to
      satisfy this prior.
    what_to_disbelieve_first_judged: >-
      MIS-SPECIFIED, and I am holding you to it. "ANY REPORTED ENVELOPE BELOW 79.329" compares a
      rank-UNCONDITIONED envelope minimum with a rank-12 board record. Followed literally it flags
      1489 non-events; the 25.43 minimum is a rank-2 curve and beats nothing, since the r >= 1 cell
      sits at 11.6136 and the r >= 2 cell at 13.5255. The correct disbelief target is "any reported
      height below the frozen frontier value AT THE CERTIFIED RANK CLAIMED", and that target has
      zero hits. The second half of your instruction - "check it is not simply a board curve
      rediscovered" - DID fire, on a real case at ranks 3-5 (RT-C1-O1), and was not surfaced by the
      producer. The precaution was well founded; the threshold in it was not.
  - prior: P2
    coordinator_expected: Best tuple lands near 79 and does not reach the r >= 12 cell.
    verdict: HELD.
    basis: >-
      Best at certified rank 12 is 86.7737, above 79.329 and above 69.33884136527462. No claimed
      cell, so the escalation to review-breakthrough is not triggered and the goal need not pause on
      that ground.
  - prior: P3
    coordinator_expected: The required null shows clearly higher envelopes, confirming rank buys something.
    verdict: HELD AT THE BOTTOM RUNG ONLY, AND FOR A SMALLER RANK CONTRAST THAN YOU SUPPOSED.
    basis: >-
      k=0 is worse by +37 log units of adjusted mean residual with a clean interval, so the premise
      does not collapse. But the ladder is not monotone (k=4 is better than k=6), and RT-J4-O1 shows
      the bottom rung retains roughly half the construction's rank, so "rank buys something" is
      demonstrated for the step 11 to about 5 and is UNTESTED for the step to 0. Your
      `if_contradicted` branch ("the entire A2 premise collapses") is NOT triggered, and it must not
      be reported as triggered.
  - prior: pre_committed_disbelief
    items_checked:
      any_cell_taken: >-
        None claimed, none present. All four C1' conditions independently considered: the numbers
        fail first, and the Cremona check and the live-board re-read were never performed either.
      transcribed_frontier_values: >-
        CLEARED. Every value in best_candidates.json is read at run time by build_deliverables.py;
        I recomputed the snapshot sha256 and it matches. The one hand-carried constant, 79.329, is
        explicitly labelled as coming from the hypothesis and not from the frontier file, and it
        rounds board id 1's 79.32867457792244 correctly.
      ceiling_from_generic_K3_bound: >-
        CLEARED, and better than cleared. Every ceiling is computed from the family's own fibre
        configuration and I reproduced six of them from scratch. The generic bound 18 is reached by
        no family, and the reason is structural (RT-J3-R1).

  coordinator_failure_modes_tested:
  - failure_mode: >-
      Twice re-aimed the campaign at a target called "soft" on a criterion that did not support the
      word.
    finding: >-
      The batch's conclusions do NOT license the aim they appear to license. Section 3 reads as
      "Axis A2 runs into a structural obstruction", and the obstruction it names - the fibre at
      infinity, and a ceiling that costs envelope - is not the one the data measure (RT-J3-O1,
      RT-J3-O2). The obstruction that IS measured is a density-and-rate statement and it does not
      close the tuple lever. Stated properly it is: (i) in an exhaustive census of admissible
      canonical tuples of spread <= 74, only 90 of 13077 (0.69 percent) have ceiling >= 13, and only
      one of those has log P2 < 5, two below 6, twelve below 7; and (ii) among 296 searched
      ceiling->=13 fibres below h = 80, zero reached rank 12 and four reached rank 11, against
      P(rank >= 12) of 0.002 at h in [80,90], 0.006 at [90,100] and 0.044 at [100,120]. That is an
      obstruction with a quantity, a value and a scope, and its forward guidance is "the search was
      cut off, finish it and change what you enumerate", not "the lever is dead".
  - failure_mode: >-
      Told the user a prior batch's negative verdict was a false negative when it was a true
      negative.
    finding: >-
      Not repeated here, and I checked in the direction that would embarrass the batch rather than
      the direction that would embarrass you. The negative is a TRUE negative on the numbers: I
      re-derived the height definition against the board, the four candidates from the tuple alone,
      the frozen sha, and the counts, and every one agrees. 86.7737 really does miss 79.329 by
      +7.4447. What is wrong in this batch is the EXPLANATION attached to the negative, not the
      negative.
  - failure_mode: Infrastructure outcomes read as mathematical evidence.
    finding: >-
      The report handles this correctly in section 8 and states the direction of the bias. The
      defect is that the coverage is never quantified, and at 37 percent on the load-bearing set it
      needed to be (RT-J3-O3). My own random-curve null was itself truncated by wall clock at
      n = 79; I report it as a bound, not a distribution.

  restatements:
  - id: RT-J3-R1
    replaces: "the type of the fibre at T = infinity decides everything"
    statement: >-
      EVERY admissible Mestre family in this scan carries a multiplicative fibre at T = infinity of
      type I_4 (13352 of 13391) or I_6 (39). That fibre is essentially a constant of the
      construction and it costs 3 (or 5) unconditionally, so the construction's own Shioda-Tate cap
      is 15, never the generic elliptic-K3 18. What varies between tuples is the number of
      REDUCIBLE FINITE fibres - six I_2 fibres in 99 percent of families, zero in the 14 families
      that attain ceiling 15 - and the ceiling is 15 minus that finite contribution.
    status: verified by independent re-derivation on six tuples; consistent with all 13391 rows.
  - id: RT-J3-R2
    replaces: "envelope and attainable rank are two readings of the same fibre configuration"
    statement: >-
      The RANK half of the coupling is supported: across 5169 searched fibres no certified rank
      exceeded its family's ceiling, only 7 attained it, and all 12 certified rank-12 fibres lie in
      ceiling-13 or ceiling-15 families. The ENVELOPE half is not supported: with content and class
      size matched, high-ceiling classes are at or below the size-matched generic minimum, and the
      fitted ceiling coefficient is -0.30 per unit after adjusting for content. The honest coupling
      is between the ceiling and the RARITY of high-ceiling tuples in a small-spread box, not
      between the ceiling and the envelope.
    status: verified on the committed data; scoped to spread <= 74 exhaustive plus 312 sampled.

  resource_reading:
    examined: true
    obstruction_reread_as_asset: >-
      The universal I_4 at T = infinity is a hard, tuple-independent cap of 15 on rank MW over
      Qbar(T) for this entire construction - which is worth stating on its own, since the hypothesis
      and the report both still reason against 18. Its complement is a FREE PRE-FILTER that the
      batch did not use: a tuple can host rank 12 only if its discriminant is squarefree, or nearly
      so, over the finite T-line, and that is one resultant on a degree-20 polynomial, microseconds,
      with no height measurement and no PARI ellrank. In the exhaustive box it cuts the measurement
      set from 13077 to 90. The batch spent essentially its whole measurement budget on families
      that structurally could not host the target rank, and the filter that would have prevented it
      costs nothing. Charging the filter's own cost, as KN-LIT-7593 requires, does not change this:
      the resultant is cheaper than a single one of the 73 height evaluations it replaces.
    spawned_ids: []
    spawned_note: >-
      No new record IDs minted by this review. The pre-filter and the cap-of-15 statement are
      candidates for the ranking and for a KN-FIND, and they change no status on their own.

  narrowest_supported_statement: >-
    Over 13391 admissible Mestre families (an exhaustive census of canonical admissible integer
    6-tuples of spread <= 74 plus 312 sampled to spread 600 plus the two published tuples), each
    measured on one fixed 73-value T-box with |t| <= 800, the minimal-model naive-height envelope
    varies by 220 log units, and it varies by 90 to 120 log units even at fixed coefficient content,
    so tuple choice is a real lever on the envelope. Of those families, 90 in the exhaustive box
    (0.69 percent) have a Shioda-Tate ceiling of 13 or 15; every one of the 13391 has a
    multiplicative fibre at T = infinity, of type I_4 or I_6, which caps the construction at 15
    rather than 18. A rank search covering 5169 of the available (family, t) pairs - 37 percent of
    the load-bearing 46 families, 19.8 percent of the ceiling-13 class and 8.5 percent of the
    ceiling-15 class, with three runs stopped by wall clock - certified rank 12 at twelve fibres,
    the smallest at naive height 86.7737, which misses the frozen r >= 12 cell (69.3389) by +17.4349
    and the published construction-class best (79.3287) by +7.4447. No cell was taken at any of the
    twelve thresholds where this batch certified a curve, and no curve was certified at thresholds
    13 to 30. NOT SUPPORTED at this scale: that the fibre at T = infinity varies or explains
    anything; that a higher Shioda-Tate ceiling costs envelope; that families of ceiling <= 11
    cannot host a rank-12 specialisation; that the required null contrasts rank 11 against rank 0;
    and that the rank present at the envelope minima is not coming from the construction.

  next_concrete_action: >-
    Before any re-aim of GOAL-ECQ-002, run ONE bounded job that settles the only live question this
    batch leaves: enumerate admissible canonical 6-tuples with the free squarefree-discriminant
    pre-filter of `resource_reading` applied FIRST, over a spread box large enough to yield a few
    hundred ceiling->=13 families at log P2 below 6, then rank-search all of them plus the 2114
    unsearched fibres of the existing 46 across the full declared T-box with no height cap, and
    report the coverage fraction reached and the certified-rank-versus-height curve with the
    random-curve null of RT-CONTROL-3 beside it. That job tests the tuple lever where it has never
    been tested - high ceiling at LOW content - and it also completes the truncated negative. If it
    returns no rank-12 fibre below 79.329 at full coverage, the lever is closed with a measured
    obstruction; if it returns one, the batch's central interpretive move was wrong. Either way it
    is one job, and it is the same job.

