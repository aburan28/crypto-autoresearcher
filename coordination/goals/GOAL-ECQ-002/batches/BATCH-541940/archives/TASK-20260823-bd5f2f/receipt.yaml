open_items_flagged_not_resolved:

- id: O-REVIEWER-CODE-UNARCHIVED
  raised_by: this archival task
  item: >-
    Both reviewers wrote and ran substantial code that exists nowhere. The
    validator's independent Mestre re-derivation, its rank certifier, its
    from-scratch ceiling computation, its null-object generator and segmented-fit
    harness, and its flat-arm intercept regression; the red team's independent
    construction and fibre census, its 20000-draw subsampling null, its 79-curve
    random-curve rank null, its bootstrap and its covariate-adjusted regression.
    None was declared in either reviewer's artifact_paths and none is bound here.
  why_it_matters: >-
    THE BATCH'S BEST POSITIVE RESULT - the flat-arm intercept regression at
    R^2 = 0.7732 - AND ITS MOST CONSEQUENTIAL NEGATIVE - that the required null is
    not a null - BOTH LIVE ONLY INSIDE REVIEW PROSE. EV-ECQ-8ee697 declares them
    at derivation-grade for exactly this reason. BATCH-da59ec recorded the same
    defect and it is uncured.
  disposition: >-
    RECORDED, NOT RESOLVED, and expressly not fixable here: binding a file that
    does not exist is not available, and expanding a terminated reviewer's write
    scope after the fact is not either. The structural remedy is prospective and
    belongs in the next review round's handoffs - a reviewer that runs code
    declares that code as a deliverable BEFORE it runs, in its dispatch_queue.json
    artifact_paths.

- id: O-BATCH-DOCS-UNBOUND
  raised_by: TASK-20260823-1f16e5 (this batch), and TASK-20260823-452f5f as O-ORCH-DOCS-UNBOUND
  item: >-
    Batch-level Coordinator documents - review_plan.yaml above all, where the
    recorded priors live - were not content-bound by any receipt.
  disposition: >-
    SETTLED FOR THE CAMPAIGN by DEC-20260823-ee9162 R11 and honoured here in
    Group C of path_sha256. The rule already existed (DEC-20260823-839fc6 R11a);
    WHAT WAS MISSING WAS THE MECHANISM, and the mechanism is that a batch's ledger
    archival task must LIST those documents in its dispatch_queue.json
    artifact_paths at queue-creation time so the role bound by the rule has a
    declared slot in which to honour it. That fix is component (i) of the next
    action. This receipt closes the item conditionally on the gate accepting the
    superset; see staging_instruction.

- id: O-GOAL-YAML-THIRD-INSTANCE
  raised_by: this archival task
  item: >-
    ledger/goals/GOAL-ECQ-002/goal.yaml carries a next_action two batches stale
    ("Run BATCH-da59ec"), a latest_verified_commit pointing at BATCH-f2341e's
    snapshot, and a latest_verified_commit_note that DEC-20260823-ee9162 R9(e)
    supersedes. It is absent from this task's declared artifact_paths for the
    THIRD CONSECUTIVE BATCH.
  disposition: >-
    RECORDED, NOT RESOLVED. Charged to the Coordinator. Component (e) of the next
    action requires that path in the declared artifact_paths, and a fourth failure
    should be treated as an archive defect rather than as paperwork. Until then
    the checkpoint and the decision are the committed record of the goal's one
    next action.

- id: O-KNOWLEDGE-PROMOTION-OWED
  raised_by: this archival task
  item: >-
    DEC-20260823-ee9162 is `support` on `replicated` evidence, which makes a
    KN-FIND promotion MANDATORY. knowledge/ is in neither this task's declared
    artifact_paths nor, in the required regenerated-INDEX form, its practical
    reach. SECOND CONSECUTIVE INSTANCE; the BATCH-da59ec promotion is still owed
    under the identical blocker.
  disposition: >-
    OWED AND BLOCKED, NOT DECLINED. The finding is pre-declared in full in
    DEC-20260823-ee9162 knowledge_promotion.pre_declared_finding - title,
    statement, worked instance, proof_status, verbatim scope line, and an explicit
    list of what must NOT be written into it - so it cannot drift while it waits.
    Discharging both owed findings is component (f) of the next action.

- id: O-KNOWLEDGE-PROMOTION-SCHEMA
  raised_by: this archival task, on the orchestrating session's prompting
  item: >-
    knowledge_promotion has no representation for "promotion owed but blocked".
    tools/validate_ledger.py accepts a non-empty `promoted` or a non-empty
    `not_warranted` and nothing else, so a MANDATORY promotion prevented by an
    archival task's declared write scope must be filed under a key whose name
    means it was declined. SECOND CONSECUTIVE BATCH.
  why_it_matters: >-
    A schema that can only say "promoted" or "not warranted" silently converts
    every blocked promotion into a declined one, and the conversion is invisible
    to any later audit that counts fields rather than reading them. TWO
    PROMOTIONS ARE CURRENTLY OWED BY THIS CAMPAIGN - this batch's and
    BATCH-da59ec's - and a field-counting audit would report zero.
  disposition: >-
    WORKED AROUND HERE, NOT FIXED. DEC-20260823-ee9162 populates `not_warranted`
    with a first clause that refuses the key's name. R20 proposes the real
    remedy: a third state `owed_blocked` carrying the blocker, the pre-declared
    finding and the discharging task, with the check accepting any one of the
    three. The schema is not this task's to change.

- id: O-RUN-INDEX-MECHANICAL
  raised_by: this archival task, on the orchestrating session's prompting
  item: >-
    tools/validate_ledger.py indexes runs only at
    experiments/*/runs/*/manifest.yaml while this campaign's runs live under the
    batch tree, so this batch's thirteen run references resolved to nothing and
    EV-ECQ-8ee697 failed validation on thirteen "unknown run" errors.
  why_it_matters: >-
    EXP-ECQ-7ea4c3 recorded this pattern EXPRESSLY so it would not be
    rediscovered a fourth time, and it was rediscovered a fourth time. THREE
    NOTES IN THREE RECORDS HAVE NOW FAILED TO PREVENT ONE RECURRENCE. That is
    evidence about the remedy, not about the diligence of any batch: a
    documentary remedy for a mechanical defect does not work.
  disposition: >-
    RECORDED AS A HARNESS FINDING. The remedy must be mechanical - either the
    validator also indexes coordination/goals/*/batches/*/tasks/*/runs, or the
    run harness writes to an experiments/ path from the start. The index port at
    experiments/EXP-ECQ-a7d948/ restores resolvability for THIS batch and is
    neither the fix nor a substitute for the missing pre-registered contract; see
    external_remedy_recorded_not_owned and DEC-20260823-ee9162 R21.

- id: O-BRANCH-SYNC
  raised_by: this archival task
  item: >-
    BRANCH SYNC NOT PERFORMED BY THIS ROLE. AGENTS.md and CLAUDE.md require
    fetching origin/main and MERGING (never rebasing) it into the working branch
    before an archival commit, and recording the base commit checked and the merge
    outcome in the task receipt. This role has no shell.
  disposition: >-
    DELEGATED to the orchestrating session, which must fetch origin/main, run
    `python3 tools/merge_digest.py --since $(git merge-base HEAD origin/main)
    --until origin/main` before resuming, merge origin/main into the working
    branch, and record the base commit and merge outcome. NEVER RESOLVE A SYNC
    CONFLICT BY EDITING A RECORD: stop and create a superseding record under a new
    id.
  pr_obligation: >-
    THIS ARCHIVE INTRODUCES TWO NEW RECORD IDS - EV-ECQ-8ee697 and
    DEC-20260823-ee9162 - so the branch must be pushed and a PR against main
    opened or refreshed NAMING BOTH. A record that exists only in a local commit
    is unpublished, not durable evidence. The checkpoint shard
    ledger/goals/GOAL-ECQ-002/checkpoints/BATCH-541940.yaml is a write-once shard
    of an existing GOAL record rather than a new id, and should be named in the PR
    description alongside them.

- id: O-MANIFEST-SUPERSESSION
  raised_by: EV-ECQ-d9ffe6, carried by EV-ECQ-cbc837, carried again here
  item: >-
    No run manifest in this campaign carries supersedes / superseded_by, and
    RUN-ECQTUP-416e78-002's manifest still reads completed_valid on a
    known-invalid run. Third consecutive batch.
  disposition: >-
    RECORDED, NOT RESOLVED. Correct under AGENTS.md rule 2, which forbids editing
    the manifest, and wrong for a reader of manifests alone. The remedy is a
    schema field or a per-task supersessions record emitted by the harness at
    write time, never an edit.

runtime_split:
  declared_in: the dispatch envelope for this task and the campaign runtime for GOAL-ECQ-002
  authored_by: coordinator subagent (all three ledger records, this receipt, and every judgement in them)
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell (tools: Read, Grep,
    Glob, Write, Edit, SendMessage). It therefore AUTHORS the ledger records and
    the archive receipt and makes every archival judgement, and the orchestrating
    session executes only the mechanical sha256 computation and the `git add` /
    `git commit` of exactly the paths this receipt declares. This is a tooling
    split, NOT a worker committing into shared state: no producer or reviewer
    stages anything here, the staged set is fixed by this record before the commit
    exists, and the dispatcher's post-commit verifier binds the commit back to
    these hashes.
  coordinator_could_not_execute:
  - sha256sum over any declared path
  - git ls-files, and therefore any authoritative statement of what is tracked or dirty
  - git fetch / merge / push / commit, and therefore commit_sha and parent_sha
  - re-execution or re-verification of any producer or reviewer computation
  - python3 -m orchestration.adapter doctor --probe, and therefore model verification
  what_this_role_did_do: >-
    Read the handoff, the dispatch queue entry, the goal record, the governing
    hypothesis, the review plan, the snapshot receipt, both Coordinator input
    documents, the two prior checkpoints, a prior evidence record and a prior
    decision for shape, the record templates, and BOTH BLIND REVIEW RECORDS IN
    FULL. Verified the run set's validity before interpreting any result.
    Composed the two blinded reviews, which report on their own joints and cannot
    see each other's by construction. Adjudicated every objection and every
    finding. Judged C1' and C2 separately. Recorded the Coordinator's own errors.
    Settled the batch's open items. Wrote EV-ECQ-8ee697, DEC-20260823-ee9162, the
    checkpoint shard, and this receipt. It computed no hash and ran no command.
  precedent: >-
    Same split as TASK-20260823-1f16e5 and TASK-20260823-0a2461 and
    TASK-20260823-452f5f and TASK-20260823-744c38 and GOAL-ECQ-001
    TASK-20260822-66bacf. Consistency is intentional: the verifier and any auditor
    should see one stable pattern rather than a per-batch improvisation.

