digest_status:
  supplied: >-
    TWELVE of twelve, in two stages. FOUR - the blind review records - were
    transcribed verbatim by this role from the orchestrating session's supply
    file orchestrator_review_sha256.json (committed at 848a12538). The other
    EIGHT were computed by the orchestrating session's verify-and-commit gate and
    written into path_sha256 above, replacing this role's sentinels, exactly as
    the procedure directs. THIS ROLE COMPUTED NO HASH AND VERIFIED NONE BY
    RECOMPUTATION, at either stage.
  pending: >-
    NONE. Every sentinel has been replaced. The group comments in path_sha256
    still describe the sentinel discipline because that is the discipline under
    which the paths were declared, and the comments are retained as the record of
    it rather than rewritten to match the outcome.
  ONE_DIGEST_IS_KNOWN_STALE_AND_MUST_BE_RECOMPUTED: >-
    ledger/decisions/DEC-20260823-ee9162.yaml WAS EDITED AFTER THE GATE HASHED
    IT. R20 asserted that DEC-20260823-839fc6 had filed its owed-and-blocked
    promotion in free-text keys the validator ignores. THAT WAS WRONG - that
    record carries `not_warranted` at line 1563, the same borrowed key this
    decision uses - and this role corrected it rather than let a false statement
    about a committed record ship. The correction strengthens R20 rather than
    weakening it. CONSEQUENCE, STATED PLAINLY BECAUSE A CONTENT MISMATCH IS FATAL
    TO THIS ARCHIVE: the value now recorded for that path,
    9f413b58f952ff4eeef2583cdd54d536c7a5611965448cf1ce24994f9cbc9c03, IS STALE
    AND WILL NOT MATCH THE TREE. The gate must recompute that one digest and
    overwrite it before staging. The digests for EV-ECQ-8ee697.yaml and the
    checkpoint shard are unaffected - neither file was touched after hashing -
    and so are the four review digests.
  the_sentinel_discipline_in_retrospect: >-
    RETAINED AS WRITTEN AND VINDICATED BY THIS VERY DEFECT. A sentinel is
    distinguishable from a stale hash at a glance; a stale hash is not
    distinguishable from a correct one by reading. The only thing that caught the
    staleness above was this role knowing it had edited the file, which is not a
    control. THE CONTROL IS THE GATE RECOMPUTING EVERY DIGEST IMMEDIATELY BEFORE
    STAGING RATHER THAN TRUSTING ANY VALUE IN THIS RECEIPT, INCLUDING ITS OWN
    EARLIER OUTPUT.
  the_sentinel_is_not_a_hash: >-
    IT IS A REFUSAL, MADE VISIBLE. This role has no shell, cannot compute sha256,
    and will not author placeholder, estimated or null digits that a verifier or a
    later auditor could mistake for computed ones - the same refusal recorded and
    honoured by the snapshot archive TASK-20260823-1f16e5. A receipt still
    carrying a sentinel at commit time is a FATAL ARCHIVE DEFECT: the
    verify-and-commit gate must replace every sentinel with the computed digest
    before staging, and must abort non-zero rather than commit one.
  superseded_note: >-
    A PRIOR COORDINATOR NOTE HELD THAT THE DISPATCHER'S COMPLETED-ARCHIVE CHECK IS
    UNSATISFIABLE UNDER THIS SESSION'S DURABILITY-COMMIT PATTERN. THAT IS WRONG
    AND IS SUPERSEDED BY DEC-20260823-ee9162 R9(e). binding_mode content_first is
    the SUPPORTED path, not a workaround: CLAUDE.md binds archive receipts to
    CONTENT first and treats commit reachability as advisory, and this batch's
    snapshot archive passed under it with all 100 declared digests verified
    against the tree and its commit b6e071e03 real, reachable and carrying its
    declared parent c377b9c57. The note carried in
    ledger/goals/GOAL-ECQ-002/goal.yaml latest_verified_commit_note and in
    CORRECTION-archive-completed-verification.md is superseded by reference; those
    records are immutable and are not edited, and the claim must not be repeated.

post_authoring_amendments:
  immutability_status: >-
    NO IMMUTABILITY RULE IS ENGAGED. All four records of this task were authored,
    amended and re-checked BEFORE ANY OF THEM WAS COMMITTED. AGENTS.md rule 2
    binds committed records; an uncommitted working file under the authoring
    task's own write_scope is still being written. Had any of these been
    committed, the amendments below would have been superseding records under new
    ids instead, and would have said so.
  amendments:
  - >-
    DEC-20260823-ee9162 knowledge_promotion GAINED A `not_warranted` FIELD.
    tools/validate_ledger.py line 510 fails an empty `promoted` unless
    `not_warranted` is non-empty, and it reads no other key, so the record's
    explanation under `status` and `reason` was invisible to it. THE FIELD'S NAME
    ASSERTS THE OPPOSITE OF WHAT THIS ROLE DETERMINED, so its first clause
    disarms the name: promotion IS warranted, is MANDATORY, and is blocked by
    this task's declared artifact set. The alternative offered by the
    orchestrating session - carry the validation error as a known defect rather
    than file the finding under a misstating key - was seriously considered and
    declined, because a field whose own text refuses its key name is legible to a
    later reader while an unvalidatable record is a standing obstacle to everyone.
    THE SCHEMA DEFECT ITSELF IS RECORDED AS R20 AND AS AN OPEN ITEM rather than
    absorbed by the workaround.
  - >-
    DEC-20260823-ee9162 GAINED R20 (the knowledge_promotion schema cannot express
    "owed but blocked") AND R21 (the run-index gap is mechanical and three
    documentary remedies have failed). Both are additive; ids R1 to R19 are
    unchanged and every reference to them from EV-ECQ-8ee697, the checkpoint and
    this receipt still resolves.
  - >-
    DEC-20260823-ee9162 R15 GAINED CLAUSE (g). The artifact-size rule governs
    bytes a producer ORIGINATES, not a copy of already-committed content, which
    adds tree entries and no new objects because git is content-addressed. Added
    because R15 and the run-index remedy met immediately and the naive reading of
    R15 would have blocked the remedy on a cost that is not being incurred.
  - >-
    ledger/goals/GOAL-ECQ-002/checkpoints/BATCH-541940.yaml GAINED TWO OPEN ITEMS
    and its EXP-* item was extended to name the index port and to state that the
    port closes nothing about the finding.
  - >-
    DEC-20260823-ee9162 R20 WAS CORRECTED AFTER THE GATE HAD ALREADY HASHED THE
    FILE. Its first draft asserted that DEC-20260823-839fc6 filed its
    owed-and-blocked promotion in free-text keys the validator ignores. That was
    an assertion about a committed record made WITHOUT READING IT, and it is
    false: that record carries `not_warranted` at line 1563, the same borrowed
    key this decision uses. Corrected before commit. The correction makes R20's
    point stronger - two consecutive decisions forced into the same misstatement
    is a property of the schema, not of either author - and it leaves that path's
    recorded digest STALE. See digest_status.
  not_amended_and_why:
  - >-
    EV-ECQ-8ee697 IS UNCHANGED. Its experiment_ids stays EMPTY and its
    experiment_ids_note stands exactly as written. The index port postdates it,
    fixes run RESOLVABILITY, and cannot supply a pre-registered contract that had
    to exist before a producer ran. Amending it to point at EXP-ECQ-a7d948 would
    convert a standing finding about this campaign's discipline into a paperwork
    entry, which is precisely the quiet reshaping this program forbids.

external_remedy_recorded_not_owned:
  what: >-
    experiments/EXP-ECQ-a7d948/ - an additive validator index port of this
    batch's thirteen run records, created by the ORCHESTRATING SESSION after this
    task's evidence record was authored, following the EXP-ECQ-7ea4c3 precedent.
    Originals unmodified and authoritative; each ported manifest records the
    original's sha256 and carries it as source_manifest_verbatim;
    run.experiment_id is the only field added outright; producer field names are
    MAPPED to the validator's schema with every mapped value drawn from a named
    producer field and the producer's own fields retained unchanged alongside;
    and a certificate.kind outside the allowed enum is mapped to `none` with the
    original preserved under certificate.mapped_from rather than silently
    recategorised.
  why_it_is_recorded_here: >-
    Because a reader of this archive will otherwise find thirteen run references
    that resolve through a path this receipt never mentions, and because the
    session that built it disclosed its own error in building it - a first
    attempt that omitted the raw results on the reasoning that the snapshot
    receipt already binds those bytes, which was wrong both because the validator
    requires the artifact present and because copying already-committed bytes
    costs no new objects. That disclosure is the reason the port can be trusted
    and it belongs in the audit trail.
  it_is_not_in_this_archive: >-
    EXP-ECQ-a7d948 IS NOT IN THIS TASK'S write_scope, IS NOT IN ITS DECLARED
    artifact_paths, AND IS NOT BOUND BY path_sha256 ABOVE. It is neither staged
    nor content-bound here. AGENTS.md requires every artifact to be assigned to
    exactly one archival task, so THE ORCHESTRATING SESSION OWES IT ITS OWN
    ARCHIVAL ASSIGNMENT with its own declared paths and digests; it must not ride
    along on this commit and it must not remain unassigned.
  it_closes_nothing: >-
    It does not close EV-ECQ-8ee697's fourth-consecutive-gap finding, it does not
    make this batch pre-registered, and no record here may cite it as an EXP-*
    contract. See DEC-20260823-ee9162 R21.

commit_provenance:
  why_this_block_exists: >-
    READ THIS BEFORE CONCLUDING ANYTHING FROM COMMIT ARCHAEOLOGY. This archive
    commit does NOT introduce the four review records; they were committed at
    848a12538 before this task began, which is also what discharges the
    refutation-artifact ordering requirement. What this commit introduces is the
    three ledger records, this receipt, and - if they are still uncommitted - the
    two held-back COORDINATOR documents. A verifier assuming one commit carried
    all twelve declared paths will be looking in the wrong place.
  review_records_committed_at: 848a12538
  snapshot_archive_commit: b6e071e03f84361ae1b6da3055ffaeb5ca1c8685
  snapshot_archive_parent: c377b9c57
  producer_artifacts_introduced_by: d6bb961e7
  binding_order: >-
    Content-first. path_sha256 is the primary binding; commit reachability is
    advisory. A content mismatch on any declared path is FATAL to this archive.
    If a computed digest does not match the tree, the archive fails - THE RECEIPT
    IS NOT TO BE EDITED TO AGREE WITH THE TREE, and a conflict inside a ledger
    record is resolved by a superseding record under a new id, never by an edit
    picking one side.

artifact_set_derivation:
  method: >-
    DERIVED, not hand-listed. For a LEDGER archive the write_scope of the tasks
    being archived is the reviewers' two task directories, and the set is their
    declared deliverables (two files each, four in total, and both reviewers
    declared exactly those and wrote nothing else), plus the ledger records this
    decision itself creates, plus the batch-level Coordinator documents that
    DEC-20260823-ee9162 R11 binds to this archive.
  why_this_matters: >-
    A hand-listed artifact set has been wrong three times in this program. Note
    the shape of the derivation differs from the snapshot's: there, git was the
    enumerator over one producer write_scope; here the set is small, fully
    declared in dispatch_queue.json for the reviewers, and enumerable by reading.
    THE ORCHESTRATING SESSION MUST STILL CROSS-CHECK IT with
    `git ls-files -- <each reviewer write_scope>` before staging and abort if
    either reviewer wrote a file this receipt does not name.
  reviewer_write_scopes_enumerated:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-e96bb6
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-33a825
  reviewer_declared_deliverables_matched: >-
    Both reviewers' own artifact_paths blocks, read at the end of their records,
    list exactly the two files each that this receipt binds. Neither declared any
    analysis script or auxiliary output - AND BOTH RAN SUBSTANTIAL CODE THAT IS
    THEREFORE UNARCHIVED. That is recorded as an open item rather than repaired
    here, because binding a file that does not exist is not available to this
    role and expanding a reviewer's write_scope after the fact is not either.
  limits_of_this_check: >-
    NAME-LEVEL ONLY. This role read all four review records in full for CONTENT,
    which is its job here, but computed no hash and re-derived no producer or
    reviewer quantity. Every number in EV-ECQ-8ee697 and DEC-20260823-ee9162 is
    cited to the reviewer or session that measured it.

