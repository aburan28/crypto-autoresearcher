  raised_by: this archival task
  item: >-
    The batch-level files the reviewers will read -- review_plan.yaml,
    dispatch_queue.json, and the supply file orchestrator_path_sha256.json, all
    directly under coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/ -- are NOT
