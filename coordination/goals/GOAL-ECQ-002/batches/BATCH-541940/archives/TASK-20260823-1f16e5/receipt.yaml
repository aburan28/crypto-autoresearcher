hash_set_derivation:
  method: >-
    DERIVED, not hand-listed. The orchestrating session enumerated the producer's
    declared write_scope
    (coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78)
    with `git ls-files -z -- <write_scope> | xargs -0 sha256sum`, git being the
    authority on what is tracked, and additionally cross-checked the tracked set
    against a filesystem walk of the same path. The two sets are identical: nothing
    under the write_scope is untracked, and nothing tracked is absent from disk.
  why_this_matters: >-
    A hand-listed artifact set has been wrong three times in this program. The
    derivation requirement is the systemic fix first logged by TASK-20260823-744c38
    and first honoured by TASK-20260823-452f5f; this is its second application, and
    the first in which git rather than a supplied declaration was the enumerator.
  independent_check_performed_by_this_role:
    what: >-
      Derivation is a claim, not a guarantee, so it was checked rather than assumed.
      BEFORE the hash set existed, and while refusing to author digits it could not
      compute, this role independently enumerated the producer's write_scope with
      its own read-only file-listing tool and predicted the structure and the count.
      It then compared that prediction path-by-path against the 100 supplied keys.
    result: >-
      AGREEMENT ON ALL 100 PATHS, and the independent prediction was made before the
      supply file existed, so it is a genuine cross-check rather than a readback.
      Structure: 3 declared artifact_paths + 1 undeclared top-level artifact
      (implementation.md) + 5 results/ + 12 scripts/ + 79 runs/ (13 run records x 6
      files = 78, plus VALIDITY-CORRECTION-RUN-002.md) = 100, matching the supply
      file's own declared file_count of 100. Run ids run contiguously
      RUN-ECQTUP-416e78-001 ... -013 with no gap, and each carries the full six-file
      set (command.txt, environment.json, manifest.yaml, raw-result.json,
      stderr.log, stdout.log).
    limits_of_this_check: >-
      It is a NAME-LEVEL check only. This role computed no hash and read no producer
      artifact for content. It cannot confirm that any digest is correct. That
      confirmation is the orchestrating session's verify-and-commit gate, which
      recomputes all 100 digests from this receipt against the working tree and
      checks the keyset against `git ls-files` before staging anything.

