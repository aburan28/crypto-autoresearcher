observations_on_the_hash_table_only:
  preamble: >-
    THE FOLLOWING ARE ARITHMETIC OBSERVATIONS ON THE TABLE OF DIGESTS AND NOTHING
    MORE. This role read no producer artifact for content, recomputed no hash, and
    re-derived no quantity. Each item is offered to the validator as a cheap,
    concrete, checkable starting point. NONE IS A FINDING, NONE IS A DEFECT CLAIM,
    and none casts doubt on any measurement. Innocent readings exist for every one
    of them.
  items:
  - id: O-RUN-002-EQUALS-RESULTS-RAW
    observation: >-
      RUN-ECQTUP-416e78-002/raw-result.json and results/tuple_envelope_scan_raw.json
      carry the SAME sha256 (4eaaf904...c6e63bda9), i.e. they are byte-identical.
    why_it_is_recorded: >-
      RUN-ECQTUP-416e78-002 is the KNOWN-INVALID run above. A file under results/ is
      byte-identical to that run's raw output. There are entirely innocent readings --
      for instance that results/ mirrors every run's raw output by construction (see
      O-RESULTS-MIRROR-RUNS, which shows the same one-to-one pattern for runs 001,
      003 and 004), so the invalid run's raw file would appear there mechanically and
      carry no downstream weight. There are also readings that would matter to the
      completeness of the quarantine.
    disposition: >-
      RECORDED FOR THE VALIDATOR, NOT ADJUDICATED. THIS ARCHIVE ASSERTS NO DEFECT. The
      checkable question is whether anything downstream of the height gate consumed
      results/tuple_envelope_scan_raw.json, and that is answered from content this
      receipt did not read. It belongs to TASK-20260823-e96bb6's validity checks.

  - id: O-RESULTS-MIRROR-RUNS
    observation: >-
      Four raw-result.json files each equal a distinct file under results/:
      RUN-...-001 = results/selftest_construction.json (61ec84ba...),
      RUN-...-002 = results/tuple_envelope_scan_raw.json (4eaaf904...),
      RUN-...-003 = results/tuple_envelope_scan_admissible.json (bdf48bee...),
      RUN-...-004 = results/certified_candidates.json (04bd3e29...).
    disposition: >-
      Consistent on its face with results/ files being copied into run records as
      raw-result.json, the same pattern the predecessor archive observed for
      BATCH-da59ec. Recorded as context for O-RUN-002-EQUALS-RESULTS-RAW. NOT a claim
      about any file's contents.

  - id: O-RUN-012-013-IDENTICAL
    observation: >-
      RUN-ECQTUP-416e78-012 and RUN-ECQTUP-416e78-013 have BYTE-IDENTICAL command.txt
      (407090dc...) AND byte-identical raw-result.json (c5cf7606...), which is also
      the sha256 of the declared artifact best_candidates.json. Their manifest.yaml
      and stdout.log differ.
    why_it_is_recorded: >-
      Two run records executing an identical command and producing an identical raw
      result, with the later one's output equal to a declared deliverable. Innocent
      readings include a deliberate reproducibility re-run (which would be a good
      sign, not a bad one) or a deliverable rebuild. This archive cannot distinguish
      them; it read neither manifest.
    disposition: >-
      RECORDED FOR THE VALIDATOR, NOT ADJUDICATED. It bears on expected run count and
      raw/summary agreement, both of which are that task's declared checks.

  - id: O-RUN-009-STREAMS
    observation: >-
      RUN-ECQTUP-416e78-009 is the ONLY run whose stdout.log is EMPTY
      (e3b0c442...b7852b855 is the sha256 of the empty byte string) and the ONLY run
      whose stderr.log is NON-empty (a2fb8b56...). In all twelve other runs the
      pattern is exactly reversed: stderr empty, stdout non-empty.
    why_it_is_recorded: >-
      An isolated stream inversion is the kind of thing that is either completely
      routine (a diagnostic step that logs to stderr by design) or the visible edge of
      an infrastructure event. The distinction is legible only from content, and per
      AGENTS.md rule 3 an infrastructure event would be infrastructure signal, never
      negative mathematical evidence.
    disposition: >-
      RECORDED FOR THE VALIDATOR, NOT ADJUDICATED. The run has a complete six-file
      record and a non-empty raw-result.json (131963ef...), so nothing here suggests a
      truncated run.

  - id: O-PRIMARY-DELIVERABLE-UNMATCHED
    observation: >-
      tuple_envelope_scan.json (460e8824...) matches NO run's raw-result.json, while
      the other declared deliverable best_candidates.json matches two
      (RUN-...-012 and -013).
    disposition: >-
      Consistent on its face with that deliverable being ASSEMBLED by
      scripts/build_deliverables.py rather than copied from a single run, which is
      ordinary. Recorded only so that a reviewer tracing each deliverable back to a
      run record does not read the absence of a match as a missing provenance link.
      NOT a claim about how the file was built.

  - id: O-ENVIRONMENT-UNIFORM
    observation: >-
      environment.json is byte-identical (c21a7826...) across all 13 run records, and
      stderr.log is the empty file in 12 of 13 (see O-RUN-009-STREAMS).
    disposition: >-
      Recorded as a plain fact about the table. Same pattern as BATCH-da59ec.

