size_note:
  total: 343984576 bytes (328.0 MiB) across 100 files
  large_files: >-
    Six files exceed 2 MB and three exceed 44 MB: RUN-ECQTUP-416e78-002/raw-result.json
    (~75 MB), results/tuple_envelope_scan_raw.json (~75 MB),
    RUN-ECQTUP-416e78-010/raw-result.json (~59 MB),
    RUN-ECQTUP-416e78-003/raw-result.json (~44 MB),
    results/tuple_envelope_scan_admissible.json (~44 MB), and
    tuple_envelope_scan.json (~16 MB).
  action_taken: NONE. Nothing was compressed, trimmed, pruned, or relocated.
  why_nothing_was_done: >-
    These files are ALREADY in committed, pushed history (see commit_provenance).
    Compressing them now would shrink the repository by nothing -- the blobs are
    already in the object store and in every clone -- and it would change the bytes
    on disk, breaking the exact digests bound above that two blind reviewers are
    about to read at a fixed sha. Rewriting history to remove them is forbidden
    outright: AGENTS.md prohibits rewriting history over pushed run records. The
    only cost-free moment to act on package size was before the producer wrote, and
    it has passed.
  recommendation_for_future_producers: >-
    ONE LINE, ADDRESSED TO TASK-20260823-bd5f2f AND NOT DECIDED HERE: future
    producer handoffs should carry an explicit artifact-size budget with a declared
    split between a compact committed summary and a large raw scan retained out of
    band or capped at source, since a 328 MiB batch is cheap to create and permanent
    to carry.
  why_it_is_referred_rather_than_settled: >-
    A package-size policy binds every future campaign, not just this batch. Setting
    it silently inside a snapshot archive -- whose entire job is to freeze bytes
    without judging them -- would make a program-wide rule out of one archival
    task's convenience. The ledger archive is the right place, with the reviewers'
    reports in hand.

