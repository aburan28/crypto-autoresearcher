    this role cannot move them.
  why_it_matters: >-
    Both reviewers read committed state at the snapshot sha. For these files that
    binding rests on commit reachability alone, which CLAUDE.md treats as advisory,
    rather than on a hash. A later edit to review_plan.yaml would not fail this
    archive -- and review_plan.yaml is where the Coordinator's recorded priors live,
    which is exactly the file whose immutability the review architecture depends on.
  disposition: >-
    RECORDED, NOT RESOLVED, and expressly NOT fixed by expanding the hash set:
    binding paths outside the producer's write_scope is the scope expansion an
    isolated archive commit forbids. This is the SECOND campaign batch to raise it
    (see O-ORCH-DOCS-UNBOUND on TASK-20260823-452f5f, which is still open). The
    ledger archive TASK-20260823-bd5f2f should settle it once for the campaign.

