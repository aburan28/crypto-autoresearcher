review_plan:
  batch_id: BATCH-541940
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-8b600d
  authored_by: coordinator (orchestrating session)
  authored_before_any_producer_ran: true
  recorded_priors:
  - id: P1
    prior: >-
      I EXPECT TUPLE CHOICE TO MOVE THE ENVELOPE SUBSTANTIALLY -- roughly the 79-to-110 spread
      already bracketed by Mestre tuple A (~79.6 measured by the BATCH-f2341e validator) against
      Nagao (109.505). This is the OPPOSITE polarity to my last two priors, both of which predicted
      failure and were confirmed. A prior that predicts success is the one I am most likely to have
      designed the measurement to satisfy.
    if_contradicted: >-
      A FLAT envelope-vs-tuple relationship falsifies the lever outright and is a complete result.
      Do not let me rescue it by widening tuple size or reporting the best single tuple as if it
      were the trend.
    what_to_disbelieve_first: >-
      ANY REPORTED ENVELOPE BELOW 79.329, because that would beat the published construction-class
      best on the board. Recompute such a curve's height from its minimal a-invariants alone before
      accepting it, and check it is not simply a board curve rediscovered.
  - id: P2
    prior: >-
      I EXPECT THE BEST TUPLE TO LAND NEAR 79 AND NOT TO REACH THE r>=12 CELL (~69.34). Beating
      79.329 would already outperform the published construction-class best; beating 69.339
      additionally requires beating an active program that improved twice in two months.
    if_contradicted: escalate to review-breakthrough (degradable false); if that tier cannot be
      served, PAUSE the goal rather than downgrade.
  - id: P3
    prior: >-
      I EXPECT THE REQUIRED NULL (low-generic-rank family, same shape) TO SHOW CLEARLY HIGHER
      envelopes, confirming that rank buys something.
    if_contradicted: >-
      If the null shows the SAME envelopes, then rank buys nothing on the size axis and the entire
      A2 premise -- three batches of it -- collapses. That is the most valuable outcome available
      here and must be reported prominently, not buried. It has been owed since BATCH-f2341e and
      never run, which is itself a finding about this campaign's discipline.
  pre_committed_disbelief:
  - Any claim that a cell was taken; C1' has four conditions and all must be checked independently.
  - Any frontier value that was TRANSCRIBED rather than read from the frozen file at run time.
  - Any ceiling taken from the generic K3 bound instead of the family's own fibre configuration.
  joints:
    validator: "J1 the envelope law and per-family ceilings; J2 independent re-derivation of the best candidate's height and rank."
    red_team: "J3 does tuple choice really move the envelope, or is the spread an artifact of tuple size or selection; J4 is the required null adequate, and would anything satisfy C1' honestly."
  escalation_rule: >-
    A claimed cell routes to review-breakthrough per routing_rules; that policy is degradable: false,
    so if it cannot be served the goal PAUSES rather than downgrading.
