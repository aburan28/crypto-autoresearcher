    published CONSTRUCTION rather than transcribing a printed equation. The
    producer also reports a failure of its own method: its Nagao transcription
    failed a hand consistency check at two independent coefficients, which the
    producer attributes to its own retrieval pipeline rather than to the
    literature. Recorded as the producer's own account; this archive neither
    confirms nor disputes it.
