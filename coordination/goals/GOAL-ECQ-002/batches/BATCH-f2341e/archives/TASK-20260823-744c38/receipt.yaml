    NOTHING IN THIS RECEIPT IS A VERDICT. Where a gate, check, control or agreement
    figure is named above, it is named because the archive must identify what it is
    freezing -- not because this archive has evaluated it. This role did not re-run
    the pipeline, did not recompute a single hash, did not re-derive a rank, and did
    not read the producers' artifacts for correctness. Whether CHECK 1 in fact
    reproduces the board, whether the falsifier was correctly operationalised before
    the numbers were read, whether the invalid runs were correctly quarantined,
    whether the verified-vs-cited split is honest, and whether any of it supports
    H-ECQ-d60d07 are open questions belonging to TASK-20260823-6040d1 (validator),
    TASK-20260823-07a54b (red team) and the ledger archive TASK-20260823-d26c06.
