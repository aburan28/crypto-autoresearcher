    Reviewers: treat the producers' reports as the claims under test and this
    receipt as an inventory. If this receipt and a producer artifact disagree about
    any substantive number, the producer artifact is the object of review and this
    receipt is wrong.

producer_self_reported_deviations_recorded_not_adjudicated:

- id: SR-INVALID-RUNS
  reported_by: TASK-20260823-01d3d9 (report.md, section 6)
  reported_as: >-
    RUN-ECQPIPE-01d3d9-002 and -003 marked invalid_measurement: cypari raises
    PARI's alarm() as AlarmInterrupt, which is not an Exception subclass, so the
    first two timeout guards did not catch it and the run aborted. The producer
    states it fixed this by catching BaseException, kept both defective runs in
    place with their reason, re-ran under the new id -004, and used nothing from
    -002/-003.
  archive_disposition: >-
    RECORDED. Consistent on its face with AGENTS.md rule 3 (an infrastructure
    outcome is not negative mathematical evidence) and rule 2 (supersede, do not
    overwrite). Whether the quarantine is complete -- i.e. that no number in
    pipeline_validation.json descends from -002/-003 -- is a reviewer check, not an
    archival one, and is NOT asserted here.

- id: SR-REGULATOR-DEFECT
  reported_by: TASK-20260823-01d3d9 (report.md, section 6)
  reported_as: >-
    A defect in the emitted ICARM record's numerical regulator (computed over all
    exhibited points rather than the certified independent subset) found and
    corrected after runs -006 ... -009; pipeline.py fixed and the four runs repeated
    under new ids -011 ... -014, with -006 ... -009 left in place and declared
    superseded for the regulator field only. pipeline_validation.json is stated to
    be assembled from the reruns.
  archive_disposition: >-
    RECORDED. The superseded runs remain in the tree by the producer's account,
    which is the correct handling under rule 2. NOT VERIFIED HERE: that
    pipeline_validation.json actually draws from -011 ... -014 rather than
    -006 ... -009 is a checkable claim and is left to the validator. Note that the
    runs/ directories carrying both the superseded and the superseding records are
    NOT bound by this receipt (see O-RUNS).

- id: SR-UNMEASURED-CONDUCTORS
  reported_by: TASK-20260823-01d3d9 (report.md, sections 1 and 6)
  reported_as: >-
    8 conductor computations exceeded a 15 s guard, retried at 130 s, 7 still
    exceeding it and left unmeasured rather than estimated; separately, board curve
    #288 stores no conductor at all on the board's side.
  archive_disposition: >-
    RECORDED as the producer's account of missing data reported as missing, which
    is what rule 5 requires. The archive does not evaluate whether the exclusion of
    those curves from a denominator was handled correctly.

- id: SR-METHOD-FAILURE-D1CB76
  reported_by: TASK-20260823-d1cb76 (report.md, and candidate_families.json)
  reported_as: >-
    The producer reports that its own session had NO code-execution tool, that no
    rank, regulator, minimal model or naive height was computed by it, that the
    polynomial-identity check the handoff names as the minimum could not be run
    except in one hand-checkable case, and that in that one case the check FAILED
    at two independent coefficients of its Nagao transcription. It attributes the
    failure to its retrieval pipeline, not to the literature.
  archive_disposition: >-
    RECORDED AND FLAGGED FOR REVIEW, not adjudicated. A producer reporting the
    failure of its own method is the behaviour the program wants; whether the
    attribution to retrieval (rather than to the source) is supported, and what the
    verified-vs-cited split is worth given that constraint, are exactly joint 1 of
    TASK-20260823-6040d1. This archive takes no position.

orchestration_caused_deviations:

- id: D-PROVENANCE-ASYMMETRY
  kind: artifact_provenance_deviation
  severity: real; recorded; affects how one archived path may be cited
  origin: ORCHESTRATING SESSION (transcription), with the proximate cause in the
    producer's runtime
  subject: coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-d1cb76/report.md
  what: >-
    THE TWO ARCHIVED PATHS OF TASK-20260823-d1cb76 DO NOT HAVE THE SAME PROVENANCE,
    and a later reader must not assume they do.
    candidate_families.json WAS written to disk by the idea-generator subagent
    itself and is the authoritative machine-readable deliverable.
    report.md was NOT. The subagent reports two attempts to write that path, both
    refused by its runtime ("Subagents should return findings as text, not write
    report files"); it returned the narrative as its output record and the
    ORCHESTRATING SESSION transcribed it to that path so a declared artifact of the
    task was not silently missing.
  consequences_stated_so_no_reader_has_to_guess:
  - Authorship of the narrative is the subagent's; the transcription is the orchestrator's.
  - >-
    The file was written AFTER the subagent terminated. It is NOT evidence of what
    the subagent had on disk at any point during its run, and it cannot be used to
    establish the timing or the on-disk state of anything.
  - >-
    Where report.md and candidate_families.json disagree, the JSON is authoritative.
    This is the producer's own stated ordering and this archive adopts it as the
    citation rule for these two paths.
  - >-
    A reviewer may legitimately treat the transcribed narrative as lower-integrity
    than the JSON. That is a reviewer's call; the asymmetry is recorded here so it
    is available to be made.
  in_file_marker: >-
    report.md carries a provenance header stating all of the above. The header is
    part of the hashed content (007f600f...98cb3) and must survive any later
    handling of the file.
  contrast_with_goal_ecq_001: >-
    Unlike D-WRITE-SCOPE in TASK-20260822-66bacf, this orchestrator write went into
    a TERMINAL producer's scope, not a live one, so it could not have interfered
    with the producer's reasoning. The write-scope obligation recorded there
    ("hold an artifact outside a producer's write_scope until it terminates") was
    met in timing. What is deviant here is provenance, not concurrency.
  not_a_licence: >-
    Recording this is not a finding that orchestrator transcription of a producer
    deliverable is acceptable practice. The alternative -- a missing declared
    artifact plus a note saying why -- was available. The tradeoff was made by the
    orchestrating session, not by this archive, and it is logged as a deviation
    against the orchestration layer.

- id: D-BASE-COMMIT-DRIFT
  kind: recorded_fact, not a defect
  origin: normal operation
  what: >-
    TASK-20260823-01d3d9's report states its base commit as 446ba7331 with the
    working tree dirty with that task's own artifacts only. The repo head at which
    the 31 hashes above were computed is d1c4bf175dea869b7154bfa80c309ff0bd852fd5.
    The two differ because commits landed between the producer starting and the
    hashes being taken.
  effect: >-
    None asserted. Recorded so that a reviewer comparing the producer's stated base
    commit against the snapshot commit does not re-derive the difference as an
    anomaly. The content binding is to the hashes above, at d1c4bf175, and is
    independent of which commit the producer started from.

runtime_split:
  declared_in: ledger/goals/GOAL-ECQ-002/goal.yaml (campaign runtime) and the
    dispatch envelope for this task
  authored_by: coordinator subagent (this record and every archival judgement in it)
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell. It therefore AUTHORS
    the archive receipt and every archival judgement, and the orchestrating session
    executes only the mechanical sha256 computation and the `git add` / `git commit`
    of exactly the paths declared in path_sha256. This is a tooling split, NOT a
    worker committing into shared state: no producer or reviewer stages anything
    here, the staged set is fixed by this record before the commit exists, and the
    dispatcher's post-commit verifier binds the commit back to these hashes.
  coordinator_could_not_execute:
  - sha256sum over the declared paths (all 31 supplied pre-computed; see context.hashes_supplied_by)
  - git fetch / merge / push / commit, and therefore commit_sha and parent_sha
  - any determination of which paths are already tracked or committed (see O-RUNS)
  - re-execution or re-verification of any producer computation
  precedent: >-
    Identical split to GOAL-ECQ-001 TASK-20260822-66bacf, whose receipt records the
    same hashes_supplied_by and runtime_split. Consistency is intentional: the
    verifier and any auditor should see one stable pattern rather than a per-batch
    improvisation.

open_items_flagged_not_resolved:

- id: O-SCOPE
  raised_by: this archival task
  item: >-
    HASHED SET IS A SUPERSET OF THE DISPATCH QUEUE'S artifact_paths. dispatch_queue.json
    declares 4 artifact_paths across the two producers (2 each); 31 paths were hashed
    and are bound here. The 27 extra are TASK-20260823-01d3d9's pipeline/ source tree
    (17 paths) and results/ outputs (10 paths).
  why_it_is_recorded_rather_than_treated_as_an_error: >-
    That producer's handoff lists three deliverables, the second being "the pipeline
    source, runnable, with a documented entry point taking a family and a parameter
    box", which artifact_paths did not enumerate; and the two declared artifacts
    reference the results/ files as their raw inputs. Binding them is therefore
    faithful to the handoff even though it exceeds the queue's artifact_paths list.
    The expansion was made by the orchestrating session in choosing what to hash;
    this role bound exactly the supplied set and expanded nothing.
  disposition: >-
    RECORDED. The ledger archive should reconcile dispatch_queue.json's artifact_paths
    with the handoff deliverables for future batches, so the declared set and the
    hashed set are decided in one place before a producer runs.

- id: O-RUNS
  status: CLOSED before this receipt was committed. The item is retained in full,
    not deleted, because the miss and its correction are the audit trail.
  raised_by: this archival task
  item: >-
    AS ORIGINALLY RAISED: the run records were NOT bound by this receipt.
    TASK-20260823-01d3d9's report names 16 immutable run records,
    runs/RUN-ECQPIPE-01d3d9-001 ... -016, each with manifest.yaml, raw-result.json,
    stdout.log, stderr.log, environment.json and command.txt. NONE of those paths
    was in the first path_sha256 set, because no hashes for them were supplied.
    This included the two runs marked invalid_measurement (-002, -003), the runs
    the producer declares superseded (-006 ... -009) and the runs it declares
    superseding (-011 ... -014).
  why_it_mattered: >-
    Both reviewers are instructed to read ONLY committed state at the snapshot sha.
    Seed integrity, expected run count, schema-complete manifests and raw/summary
    agreement are all checks against run records. Unbound, the run-level half of
    validity would have rested on commit reachability alone, which CLAUDE.md treats
    as advisory.
  original_disposition_before_closure: >-
    RECORDED, NOT RESOLVED, and expressly NOT fixed by expanding the staged set --
    staging paths whose hashes were not supplied is exactly the scope expansion an
    isolated archive commit forbids. This is the same gap logged as O2 in
    TASK-20260822-66bacf, where it went unclosed.
  closed_by: >-
    The ORCHESTRATING SESSION, which computed the 96 missing hashes and supplied
    them in orchestrator_path_sha256_runs_addendum.json (hashed_at_utc
    2026-08-23T01:47Z, head 08bc79516). It also stated that the original omission
    was the orchestrator's and not the archiving role's. This role then transcribed
    all 96 pairs into path_sha256 above, bringing the bound set to 127 paths.
  closed_at_stage: >-
    BEFORE the snapshot commit exists. This edit COMPLETES an uncommitted record
    rather than overwriting a committed one, so AGENTS.md rule 2 (supersede, never
    overwrite) is not engaged. Had the receipt already been committed, the correct
    remedy would have been a superseding receipt, not this edit.
  what_the_closure_does_and_does_not_establish:
    does: >-
      All 96 run-record paths are now content-bound at the hashes above, so a
      reviewer's run-level checks bind to content rather than to commit
      reachability, and a later mutation of any run record fails the archive.
    does_not: >-
      It establishes NOTHING about the runs themselves. It does not verify seed
      integrity, run count, manifest schema completeness, raw/summary agreement or
      control comparability; it does not confirm that -002/-003 are properly
      quarantined or that -011 ... -014 in fact supersede -006 ... -009 in
      pipeline_validation.json. Those are the validator's checks and remain
      entirely open. Binding a file is not reading it, and this role read none of
      them.
  residual_note: >-
    This role still cannot determine which paths are tracked or committed. The
    orchestrating session must ensure all 127 declared paths are staged in the
    snapshot commit; a path bound here but absent from the commit is a defect the
    post-commit verifier must catch.
  process_finding_recorded_against_the_orchestration_layer: >-
    A producer's run records were not in the hash set handed to the archive, and
    the gap was found only because the archiving role enumerated the producer's
    deliverables against the supplied set rather than trusting it. The hash set
    handed to an archive should be derived from the producer's write_scope, not
    assembled by hand. Recorded for the goal record; a standing process change is a
    separate coordinator decision, not a snapshot archive's to make.

- id: O-BRANCH-SYNC
  raised_by: this archival task
  item: >-
    BRANCH SYNC NOT PERFORMED BY THIS ROLE. AGENTS.md and CLAUDE.md require fetching
    origin/main and merging (never rebasing) it into the working branch before an
    archival commit, and recording the base commit checked and the merge outcome in
    the task receipt. This role has no shell.
  disposition: >-
    DELEGATED to the orchestrating session, which must fetch origin/main, merge it
    into the working branch, and record the base commit and merge outcome. Repo head
    supplied to this role at hashing time was
    d1c4bf175dea869b7154bfa80c309ff0bd852fd5. Never resolve a sync conflict by
    editing a record: stop and create a superseding record.
  pr_obligation: >-
    The branch must be pushed and a PR against main opened or refreshed. This
    archive introduces NO new GOAL/RQ/IDEA/H/EXP/EV/DEC/TASK/KN record ids
    (record_ids is empty), so this commit owes no new record names to a PR
    description. The ledger archive TASK-20260823-d26c06 will owe EV-ECQ-d9ffe6 and
    DEC-20260823-51726e.

- id: O-BLINDNESS
  raised_by: this archival task
  item: >-
    Both reviewers are dispatched blind to each other. The commit message for this
    snapshot must say THAT the producers' artifacts landed and never WHAT they
    found -- verbose archive commit messages leaked one reviewer's findings to a
    still-blind reviewer via git log in GOAL-ECQ-001 (BI-1), and this batch's
    producers have already reported gate outcomes that would prejudice both joints
    if restated in a commit subject.
  disposition: >-
    Recorded as a binding constraint on the orchestrating session's commit message,
    per the dispatch envelope's own constraint list. This receipt itself is
    committed content the reviewers may read; it is written to be an inventory, and
    non_endorsement above states why nothing in it should be read as a finding.

