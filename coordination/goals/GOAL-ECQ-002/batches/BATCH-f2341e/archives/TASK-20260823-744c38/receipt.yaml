  what_it_produced_stated_structurally: >-
    A family-agnostic specialise -> Mestre-Nagao score -> exact descent ->
    height/conductor -> ICARM-record pipeline, its source, and the outputs of its
    validation runs. The producer's own execution report states: 16 run records
    (-001 ... -016) of which 2 are marked invalid_measurement; a CHECK 1
    reproduction gate against the frozen ICARM snapshot reported as passing 289/289
    on rank, naive height, Faltings height, minimal discriminant and curve_key,
    with conductor at 280/281 computed and 7 conductors left unmeasured after a
    retry and reported as unmeasured rather than estimated; a CHECK 2 falsifier run
    in which the mechanism is reported NOT falsified; a Mestre-Nagao ordering run
    with a random-sample control; a null-object control run; and a regulator defect
    found and corrected mid-task, with the affected runs repeated under new ids.
    EVERY ITEM IN THIS SENTENCE IS THE PRODUCER'S OWN REPORT OF ITS OWN WORK,
    transcribed here so the archive says what it is freezing. See
    non_endorsement below.

non_endorsement:
