  - id: J2-G2
    where_corrected: EV-ECQ-d9ffe6 run_ids_supersession_note and UC-4
    summary: >-
      No manifest carries supersedes / superseded_by, and -006 and -011 share
      command.txt, git_commit 446ba733 and git_dirty true, so THE SUPERSEDED
      RUNS ARE NOT REPRODUCIBLE FROM THEIR OWN RECORDS. The supersession is
