runtime_split:
  authored_by: >-
    coordinator subagent -- this receipt, EV-ECQ-d9ffe6, DEC-20260823-51726e,
    the BATCH-f2341e checkpoint, and every archival and adjudicative judgement
    in them.
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell. It therefore
    AUTHORS the records and fixes the staged path set BEFORE the commit exists;
    the orchestrating session executes only the mechanical sha256 computation
    and the `git add` / `git commit` of exactly the paths in path_sha256. This
    is a tooling split, NOT a worker committing into shared state: no producer
    or reviewer stages anything, and the dispatcher's post-commit verifier
    binds the commit back to these hashes afterwards.
  coordinator_could_not_execute:
  - sha256sum over the declared paths (all null above; see hashes_pending)
  - git fetch / merge / push / commit, and therefore commit_sha and parent_sha
  - any determination of which paths are already tracked or committed
  - re-execution or re-verification of any producer or reviewer computation
  precedent: >-
    Identical split to GOAL-ECQ-001 TASK-20260822-2fa82a and to this batch's
    snapshot archive TASK-20260823-744c38. Consistency is intentional.
  independent_reproduction_by_the_orchestrating_session: >-
    ONE EXCEPTION, RECORDED BECAUSE IT MATTERS AND BECAUSE ITS STATUS MUST NOT
    BE OVERSTATED. The orchestrating session independently reproduced J1-F1's
    arithmetic (right/left = 1557504 = 1248^2 at every coefficient). That is
    corroboration of the validator's finding from a second computation, and it
    is welcome -- but it is NOT an independent review: it comes from the same
    layer that repeated the original false negative, and it was performed after
    reading the validator's report. It is recorded as corroboration, not as a
    second blind re-derivation.

