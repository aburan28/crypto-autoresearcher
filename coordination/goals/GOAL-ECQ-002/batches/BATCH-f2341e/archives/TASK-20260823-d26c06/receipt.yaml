what_this_archive_does:
  adjudication_performed: true
  statement: >-
    UNLIKE THE SNAPSHOT ARCHIVE, THIS ONE JUDGES. It commits the round's
    evidence record, its coordinator decision, and the goal checkpoint. It
    composes two blind adversarial reviews on disjoint joints, judges C1 and C2
    separately and explicitly, addresses all fourteen red-team objections,
    records the corrections owed against a producer and against the
    orchestration layer, and sets exactly one next action.
  status_effects:
    hypothesis_status_changed: false
    hypothesis_status_detail: >-
      H-ECQ-d60d07 remains `proposed`, deliberately: neither of its declared
      falsification conditions fired, and moving a status on evidence that
      triggered neither would be changing a success criterion after seeing the
      outcome. Its targeting clause is WEAKENED, its Mestre-Nagao licence is
      NARROWED to rank ordering, its mechanism is NARROWED to require small
      family coefficients AND small parameter, and its method_ceiling is
      CORRECTED to d = 2 exactly / ceiling 18 over C-bar and 17 over Q(T). All
      of that binds through DEC-20260823-51726e; the hypothesis file is
      immutable and IS NOT EDITED BY THIS ARCHIVE. A superseding hypothesis is
      a component of the next action.
    goal_status_changed: false
    goal_status_detail: >-
      GOAL-ECQ-002 remains `active`. C2 is judged MET and C1 is judged NOT MET,
      recorded in the write-once checkpoint shard bound above. No pause
      condition fired. The goal is NOT closed on C2.
    evidence_record_written: true
    decision_record_written: true
    goal_checkpoint_written: true
    knowledge_promoted: false
    knowledge_promotion_detail: >-
      not_warranted, with a stated reason and PRE-DECLARED promotion triggers,
      in DEC-20260823-51726e knowledge_promotion and in the checkpoint. The
      decision is `weaken` on evidence of strength `preliminary`, so the
      mandatory rule is not triggered; both candidate findings were considered
      and each fails a concrete test (unreplicated program classification; a
      derivation-tier C2 result with no archived certificate).
      knowledge/INDEX.md is generated and gitignored, and nothing was promoted,
      so it is neither regenerated nor staged.
    goal_yaml_not_touched: >-
      ledger/goals/GOAL-ECQ-002/goal.yaml is NOT in this receipt's declared set
      and was NOT edited, so it still carries `C2.met: false` and does not
      carry C1'. THE COMMITTED RECORD OF BOTH JUDGEMENTS IS THE DECISION AND
      THE CHECKPOINT. Reconciling goal.yaml is an explicit component of the
      next action and its archive's declared path set must include goal.yaml.
      Recorded here as well as in both ledger records so no reader takes the
      stale flag as a judgement.

