orchestration_caused_deviations:

- id: D-NO-REVIEW-PLAN
  kind: process_defect
  severity: moderate; recorded; affects the auditability of this whole round
  origin: THE ORCHESTRATION LAYER / COORDINATOR
  what: >-
    THIS REVIEW ROUND RAN WITH NO DECLARED review_plan. Verified directly
    against coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/
    dispatch_queue.json: none of its five handoffs carries the key. AGENTS.md
    "Review architecture" and templates/research-records.md require one written
    BEFORE any reviewer runs, carrying the Coordinator's recorded prior,
    enumerated singly-owned joints, declared blindness, a proves_too_much block
    and any blind re-derivation. Joints were assigned in launch messages only.
    GOAL-ECQ-001 BATCH-7e06d3 HAD A PLAN; this round regressed.
  consequence_stated_concretely: >-
    tools/check_review_independence.py has no plan to compose this round
    against, and "the Coordinator's prior was recorded first" cannot be
    established after the fact. The cost is paid in this very archive: both
    reviews went against the campaign, and there is no committed prior against
    which to say whether that was expected. That distinction -- "the reviewers
    concurred" versus "the reviewers concurred with what the Coordinator
    already believed" -- is exactly what a recorded prior exists to preserve,
    and for this round it is permanently lost.
  remedy: >-
    Binding on the next batch: no reviewer is dispatched without a committed
    review_plan. Component (b) of DEC-20260823-51726e N1.
  found_by: the validator (J2-G8), not by the layer that caused it.

- id: D-BLINDNESS-EXPOSURE
  kind: partial_blindness_exposure
  severity: real; disclosed; no finding leaked
  origin: THE ORCHESTRATION LAYER
  what: >-
    While diagnosing why its own deliverable appeared already tracked, the
    validator ran `git log --oneline` and `git show --stat` and thereby saw the
    sibling commit's SUBJECT LINE and three FILE NAMES (redteam_report.md,
    objections.yaml, analysis/redteam_controls.py). NO CONTENT WAS READ. It
    opened no file under TASK-20260823-07a54b, its conclusions were already
    fixed, and it DISCLOSED THE ENCOUNTER per its role contract rather than
    proceeding quietly.
  proximate_cause: >-
    The orchestration layer committing a reviewer's in-flight file while a
    blind round was live. The exposure is a consequence of that, not of
    anything the validator chose to do.
  mitigation_that_worked_and_is_worth_naming: >-
    The commit message said only THAT the artifacts landed and never WHAT they
    found -- the standing rule adopted after GOAL-ECQ-001's BI-1 and required
    again by the snapshot receipt's O-BLINDNESS item. A file name is not a
    finding; the three names carry no verdict. THE RULE DID ITS JOB. Recorded
    as evidence that the remedy adopted in DEC-20260822-564044 N4 is effective,
    not merely aspirational.
  effect_on_this_archive: none asserted. The two reports' substantive findings
    are disjoint and the validator's were fixed beforehand.

- id: D-MIDFLIGHT-COMMIT
  kind: process_defect
  severity: moderate; recorded
  origin: THE ORCHESTRATION LAYER
  what: >-
    The validator's deliverable was committed at aaf472e16 BEFORE that task
    declared completion -- the same pattern recorded three times against the
    orchestration layer in GOAL-ECQ-001. Harmless in content here: the
    committed blob a83ce3d74bc0b448bd2cebb02326cbb3216d69e4909571e44ae34334202af2c4
    is byte-identical to everything preceding the report's ADDENDUM. But a
    mid-flight commit of a reviewer's report is indistinguishable after the
    fact from a completed one.
  disposition: >-
    Answered rather than merely logged: see
    context.which_commit_carries_the_final_reviewer_text, which names the final
    version and gives the verifier a concrete way to catch the wrong one.

- id: D-UNDECLARED-REFUTATION-ARTIFACT
  kind: artifact_declaration_defect
  severity: real; corrected by this archive
  origin: THE ORCHESTRATION LAYER / COORDINATOR HANDOFF
  what: >-
    analysis/redteam_controls.py, the only durable form of the controls on
    which this round's adverse finding rests, was omitted from
    TASK-20260823-07a54b's artifact_paths.
  ordering_deviation_recorded_honestly: >-
    docs/claims-and-verification.md requires a refutation artifact to be
    archived BEFORE the decision that relies on it. The file WAS committed at
    da7756023, before this decision was authored, so the ordering requirement
    is met in substance. What it lacked was a DECLARATION, and this receipt
    supplies it IN THE SAME COMMIT as the decision rather than in a prior
    snapshot archive. That residual deviation is charged to the orchestration
    layer and is recorded in EV-ECQ-d9ffe6
    proof_artifact_ordering_deviation, not smoothed over.
  found_by: the red team, which flagged the omission rather than assuming it away.

- id: D-NO-EXPERIMENT-CONTRACT
  kind: process_defect, REPEATED
  severity: moderate; recorded; a repeat of a defect this program already
    refused to make a precedent
  origin: THE ORCHESTRATION LAYER / COORDINATOR
  what: >-
    No experiments/<EXP-ID>/specification.yaml exists for BATCH-f2341e.
    EV-ECQ-0d142e accepted the handoff-plus-hypothesis substitute ONCE for
    GOAL-ECQ-001 and stated in terms that it "is not a precedent, and a future
    rank campaign owes an EXP-* contract". GOAL-ECQ-002 is that campaign and it
    did not pay.
  disposition: >-
    Recorded, with the protocol of record named explicitly in EV-ECQ-d9ffe6 so
    no number here is unprotocolled, and with an EXP-* contract made component
    (h) of the single next action. Not accepted a second time as a substitute.

producer_and_reviewer_findings_carried_not_repaired:
  principle: >-
    Producer and reviewer artifacts are IMMUTABLE. Every correction below lives
    in the ledger records this archive commits, never in the artifact.
  items:
  - id: J1-F1
    where_corrected: DEC-20260823-51726e R1; EV-ECQ-d9ffe6 OBS-1
    summary: >-
      The Nagao consistency-check CONCLUSION is false (right/left = 1557504 =
      1248^2 at every one of t^0..t^6, so the point lies on the transcribed
      quartic). NAGAO-1994 reinstated as a candidate pending source retrieval.
      The correction is recorded against the producer AND against the
      orchestration layer, which repeated the false negative without testing
      it. Limit preserved: this does NOT establish the coefficients are
      Nagao's.
  - id: J1-F2
    where_corrected: DEC-20260823-51726e R5; EV-ECQ-d9ffe6 OBS-2
    summary: >-
      T-degrees (4,4,6,6,8), not (6,7,8,9,10); d = 2 EXACTLY, ceiling 18 over
      C-bar / 17 over Q(T), replacing a method_ceiling guard failing open by 20.
  - id: J2-G1
    where_corrected: EV-ECQ-d9ffe6 UC-4
    summary: >-
      snapshot_sha256_declared is null in reproduce_icarm_all.json,
      reproduce_icarm_conductor_retry.json and pipeline_validation.json. The
