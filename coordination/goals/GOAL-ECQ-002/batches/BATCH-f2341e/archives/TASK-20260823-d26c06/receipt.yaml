hashes_pending:
  status: TRUE AT AUTHORING TIME. EVERY VALUE IN path_sha256 IS null.
  who_must_fill_them: >-
    The ORCHESTRATING SESSION, before or at the moment of the commit. This role
    has no shell under this runtime and cannot compute a sha256 (see
    runtime_split).
  binding_instruction_to_the_post_commit_verifier: >-
    A null hash IS A FAILURE, NEVER A PASS. CLAUDE.md binds archive receipts to
    CONTENT FIRST and treats commit reachability as advisory; an unfilled hash
    means the path is committed but NOT content-bound, and this archive is not
    durable evidence until every value above is a real digest that matches the
    tree. Do not interpret null as "not applicable" and do not fill a hash from
    anything other than a recomputation over the committed blob. If a hash does
    not match, the archive FAILS ON THAT PATH -- THE RECEIPT IS NOT TO BE
    EDITED TO AGREE WITH THE TREE.
  why_the_receipt_is_authored_with_nulls_rather_than_waiting: >-
    Because the alternative is worse. The three ledger records are created BY
    this task and cannot be hashed before they exist; a receipt cannot contain
    its own hash any more than a commit can contain its own sha. The path SET
    is what this role is responsible for and it is fixed here, before the
    commit exists, which is the property an isolated archive commit actually
    needs. The digests are mechanical.

