red_team_report:
  id: RT-20260823-123bd6
  task_id: TASK-20260823-07a54b
  goal_id: GOAL-ECQ-002
  batch_id: BATCH-f2341e
  hypothesis_id: H-ECQ-d60d07
  snapshot_commit_read: ab0aa5404319796966241478dc44e25592139b44
  joints_owned: [3, 4]
  joint_verdicts:
    joint_3_is_the_r15_cell_soft: breaks
    joint_4a_pre_registration: breaks
    joint_4b_method_novelty: breaks
  blindness:
    read_sibling_reports: false
    not_read: coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-6040d1/**
  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    reasoning_effort: xhigh
    fallback_used: false
    degraded_requirements: []
    independent_session: true
    model_verified: false
    model_verified_note: no `adapter doctor --probe` ran in this session

  claim_under_review: >-
    GOAL-ECQ-002 AXIS A2 and H-ECQ-d60d07: that the ICARM r>=15 naive-height cell is
    SOFT -- minimum naive height jumping 85.189 -> 118.770 from r>=14 to r>=15 against
    steps of +9.4 and +6.6 either side -- and that specialising a published high-rank
    Q(t) family at small parameters is the lever that reaches it; together with C1,
    that a curve taking at least one record cell against the pre-registered frontier
    is a satisfaction of the campaign.

  objections:

    - id: OBJ-1
      joint: 3
      severity: critical
      title: The soft-cell claim is a program-incidence artifact; the discriminating control was never run.
      statement: >-
        The 85.189 -> 118.770 step is real under an exchangeability null, but it is
        fully explained by WHICH SEARCH PROGRAM contributed at WHICH RANK -- a covariate
        the board ships in its own `commentary` field and that the campaign never read.
        Permuting naive-height residuals within each program, preserving the observed
        program x rank incidence, raises p from < 3.3e-5 to 0.2175. The parameter that
        should destroy the signal does destroy it.
      evidence:
        control: analysis/redteam_controls.py::control_3_condition_on_program
        unconditional_null_p: 0.00000     # < 1/30000
        program_conditioned_null_p: 0.21747
        n_permutations: 30000
        seed: 20260823
        trend: log h = 3.5549 + 0.0974*r on ranks 10-20 (x1.1023 per rank), n=158
        incidence:
          ELKIES_JMM23: {12: 2, 13: 2, 14: 1}
          KLAGSBRUN: {12: 1, 13: 1, 14: 1, 16: 1, 20: 1}
          MESTRE_SPEC: {11: 3, 12: 7, 13: 5, 14: 6, 15: 12, 16: 29, 17: 17, 18: 14, 19: 6, 20: 6}
      consequence: >-
        AXIS A2's stated justification does not survive. The step measures the seam
        between search programs, not a property of rank 15.

    - id: OBJ-2
      joint: 3
      severity: critical
      title: Within the campaign's OWN method class, 118.770 is the global minimum over all ranks 12-20.
      statement: >-
        Restricted to Mestre/Fermigier family specialisation -- precisely the mechanism
        H-ECQ-d60d07 proposes -- the minimum naive height by exact rank is 206.81 (r=12),
        136.69 (13), 134.43 (14), 118.77 (15), 141.59 (16), 136.79 (17), 159.97 (18),
        166.83 (19), 200.28 (20). The campaign selected as its "soft" target the single
        point at which its own method has performed best on the entire board.
      evidence:
        control: analysis/redteam_controls.py::control_4_per_program_frontier
        mestre_spec_min_by_exact_rank: {12: 206.81, 13: 136.69, 14: 134.43, 15: 118.77, 16: 141.59, 17: 136.79, 18: 159.97, 19: 166.83, 20: 200.28}
        our_method_deficit_at_r14: 134.43 - 85.19 = 49.24
        our_method_deficit_at_r15: 0.00 (the class holds the cell)
      consequence: >-
        Expected edge at r>=15 is negative for this method. The largest headroom for
        this method is at r=14, where a different program (Elkies JMM23) holds the cell.

    - id: OBJ-3
      joint: 3
      severity: major
      title: The Coordinator's stated alternative (few rank-15 submissions) is arithmetically unavailable and should be retired, not carried.
      statement: >-
        The r>=15 cell is a minimum over 115 curves and the r>=14 cell over 125 -- ten
        extra draws, not a small-sample regime. There are MORE curves of rank exactly
        15 (15) than of rank exactly 14 (10). The counting story predicts the opposite
        of what is observed.
      evidence:
        control: analysis/redteam_controls.py::control_0_reproduce_frontier
        n_at_or_above: {13: 137, 14: 125, 15: 115, 16: 100}
        exact_rank_counts: {12: 11, 13: 12, 14: 10, 15: 15, 16: 32, 17: 21}
      consequence: >-
        This specific worry is resolved and must not be recycled as unresolved
        uncertainty. The real alternative is OBJ-1, which is different in kind.

    - id: OBJ-4
      joint: 3
      severity: major
      title: "Which side is anomalous: #244 is unremarkable, #276 is the high one -- but neither is anomalous within its own program."
      statement: >-
        Under the untrended permutation over ranks 13/14/15 (medians 141.8/144.3/145.3,
        so near-exchangeable), P(min of rank-14 group <= 85.189) = 0.624 and P(min of
        rank-15 group >= 118.770) = 0.016. So the r>=15 incumbent is the high one, not
        #244 the low one. But #244 is the ONLY rank-14 output of the Elkies JMM23
        program and #276 is the BEST output of the Mestre-specialisation program, so
        within program neither is anomalous. The Coordinator's binary is the wrong
        question and its answer under the naive null is misleading.
      evidence:
        control: analysis/redteam_controls.py::control_1_untrended_permutation
        n_permutations: 200000
        seed: 20260823
        p_step_ge_observed: 0.01465
        p_min15_ge_118_77: 0.01622
        p_min14_le_85_19: 0.62376

    - id: OBJ-5
      joint: 3
      severity: major
      title: The r>=15 cell has the second-thinnest margin in its rank window and moved 41 hours before the freeze.
      statement: >-
        Incumbent-to-runner-up margin at r>=15 is 1.872 (1.58%), against 4.82%, 6.42%,
        9.14%, 7.07%, 8.17%, 3.50% at r>=13, 14, 16, 17, 19, 20; only r>=18 (0.42%) is
        thinner in the 13-20 window, and across all 29 thresholds r>=15 ranks
        sixth-thinnest (behind r>=8 0.03%, r>=18 0.42%, r>=6 0.82%, r>=10 0.84%,
        r>=29 1.39%). The cell fell 214.16 -> 118.77 between
        2026-05-27 and 2026-08-21, with the last improvement landing 2026-08-21T08:28Z
        against a snapshot taken 2026-08-23T00:43Z. "Soft" is the wrong word for the
        thinnest-margin, fastest-moving cell in its neighbourhood.
      evidence:
        control: analysis/redteam_controls.py::control_5_cell_timeline
        margins_pct: {13: 4.82, 14: 6.42, 15: 1.58, 16: 9.14, 17: 7.07, 18: 0.42, 19: 8.17, 20: 3.50}
        margins_pct_thinnest_overall: {8: 0.03, 18: 0.42, 6: 0.82, 10: 0.84, 29: 1.39, 15: 1.58}
        cell_history: ['2026-05-27 214.162', '2026-05-29 131.746', '2026-06-11 127.132', '2026-06-24 125.334', '2026-06-26 120.642', '2026-08-21 118.770']
      consequence: >-
        The campaign's success probability must include third-party movement at the
        measured ambient rate (~10% in 84 days), which the goal acknowledges in prose
        and C1 does not implement.

    - id: OBJ-6
      joint: 4a
      severity: critical
      title: C1 read literally is satisfied by a curve from Cremona's tables. Three of them beat the frozen r>=1 cell.
      statement: >-
        Exhaustive over all minimal Weierstrass models a1 in {0,1}, a2 in {-1,0,1},
        a3 in {0,1}, a4,a6 in [-12,12] -- a range that provably contains every model
        under the target height -- keeping those below the frozen r>=1 naive-height cell
        11.613603 and certifying a rational point of infinite order in exact Fraction
        arithmetic with non-torsion proved against Mazur's theorem, THREE curves beat
        the cell. The batch's incidental 53a1 is not even the best of them.
      evidence:
        control: analysis/redteam_controls.py::control_6_r1_cell_is_hollow
        hits:
          - {ainvs: [0, 1, 1, 0, 0], curve: 43a1, c4: 16, c6: -280, disc: -43, naive_height: 11.269579, generator: [-1, 0]}
          - {ainvs: [1, -1, 1, 0, 0], curve: 53a1, c4: -15, c6: -297, disc: -53, naive_height: 11.387464, generator: [0, 0]}
          - {ainvs: [1, 1, 1, 1, 0], curve: 83a1, c4: -47, c6: 199, disc: -83, naive_height: 11.550443, generator: [0, 0]}
        frozen_r1_cell: 11.613603032723672
        frozen_r1_holder: curve id 42 = 37a1
        note: >-
          Every discriminant is a squarefree prime, so each model is minimal and the
          heights are the board's own quantity. The convention was re-derived
          independently here and reproduces ids 42, 244, 276 to 0.0e0. Faltings heights
          and conductors for 43a1/83a1 were NOT computed; no claim is made about the
          other two r>=1 cells.
      verdict: >-
        HOLLOW CLOSURE. Submitting such a curve satisfies C1's letter while saying
        nothing about H-ECQ-d60d07. The protocol should forbid it.
      remedy_proposed: >-
        C1': a curve FIRST EXHIBITED BY THIS PROGRAM -- absent from the frozen snapshot,
        not obtainable by lookup from Cremona/LMFDB/Dujella, provenance traced to a
        specific family, parameter and run id -- accepted by the ICARM verifier, taking
        the PRE-DECLARED target cell (rank threshold >= 15, metric = naive height)
        against BOTH the frozen frontier AND the live board re-read at submission time.
        Any other cell taken is a secondary outcome, never C1 satisfaction.

    - id: OBJ-7
      joint: 4a
      severity: major
      title: The rank threshold is not pre-registered; only the frontier is.
      statement: >-
        The goal's AXIS A2 names r>=15 but C1 names no threshold at all. A curve
        certified at rank 12 beating 69.34 would satisfy C1 while FALSIFYING
        H-ECQ-d60d07, whose falsification clause is explicitly about failing to reach
        rank >= 15 under 118.770. Freezing the board without freezing the cell leaves
        the goalpost mobile, and OBJ-2 shows which way it rolls: our method's deficit
        is smallest at ranks 12-14, so a post-hoc threshold choice drifts toward cells
        where a hit says least about the hypothesis.

    - id: OBJ-8
      joint: 4a
      severity: major
      title: Ninety cells, one of which needs to fall; and the frozen frontier can only get easier.
      statement: >-
        The frozen frontier is 30 rank thresholds x 3 metrics = 90 cells. One certified
        rank-15 curve competes in 45 of them simultaneously. C1 requires "at least one".
        The probability that a large search takes SOME cell is not the probability that
        the thesis is right, and C1 does not distinguish them. Separately, C1's
        operative comparison is against the PRE-REGISTERED frontier; the live-board
        re-read is required for reporting, not for satisfaction, so a curve could
        satisfy C1 against a stale frontier while being beaten on the live board.

    - id: OBJ-9
      joint: 4b
      severity: critical
      title: The r>=15 incumbent IS a rank-12 Mestre Q(T) family specialised at a small integer parameter. The method is not novel here.
      statement: >-
        Curve 276's own commentary in the frozen snapshot: "Mestre rank-12 quartic
        family on the integer sextuple {-114,-112,44,55,57,70} at T=176 ... Found by
        enumerating the Mestre locus 12*p5=5*p2*p3 exhaustively over the integers ...
        all 59479 primitive centered sextuples with |a_i|<=500 come out of 4.21e10
        subsets in 87 s on 24 threads ... the gain is exhaustive coverage at this
        scale, not a new family ... Rank is exactly 15, not only a lower bound: ellrank
        returns [15,15,0]." This is H-ECQ-d60d07's mechanism, at a HIGHER family rank
        (12 vs the recommended >= 11), already executed.
      evidence:
        source: coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json, curve id 276, commentary field
        corroborating_curves:
          - {id: 235, rank: 15, h: 120.642, note: "3-parameter sub-family of the Mestre locus, sextuple {0,7,133,136,430,434}, T=162"}
          - {id: 86, rank: 15, h: 127.132, note: "specialization T=1043/2 of the Fermigier rank-12 Mestre family, staged Nagao-sum sieve over ~1.9M specializations"}
          - {id: 159, rank: 17, h: 136.790, note: "Mestre/Fermigier family at T=2454, Mestre-Nagao sieve"}
          - {id: 241, rank: 18, h: 159.975, note: "rational Mestre (u,v) search, u=-1/2, v=7/2, T=429/2"}
          - {id: 275, rank: 20, h: 200.283, note: "generalized Mestre/Fermigier family, u=-3, v=-1/2, T=10239/176"}
        share_of_board: 106 of 158 curves at ranks 12-20 are Mestre-family specialisations
      consequence: >-
        Expected edge is NEGATIVE, not near zero: (1) family rank -- they enumerate a
        rank-12 Mestre locus exhaustively, TASK-20260823-d1cb76 recommends a rank->=11
        family whose exact coefficients were not computed and whose one transcribed
        competitor failed its own consistency check; (2) compute -- 4.21e10 subsets on
        24 threads vs 21600 s total with max_concurrent 2 on 4 cores; (3) selection --
        they gate on exact height before MN scoring, we order by MN; (4) adversary --
        the three cells below ours are Elkies', and the incumbent is another LLM-driven
        agent that landed 41 hours before our freeze.

    - id: OBJ-10
      joint: 4b
      severity: major
      title: dominated_by for the C1 axis is not null and must not be recorded as null.
      statement: >-
        Under docs/inventor-protocol.md, an unchecked `dominated_by: null` is a
        fabrication under AGENTS core rule 9. For GOAL-ECQ-002's C1 axis the correct
        entry is a populated list. TASK-20260823-d1cb76 correctly declined to assert
        null (recording "n/a (no result claimed)"), but the goal record's AXIS A2
        narrative asserts a soft target without naming the incumbent method at all.
      required_entry:
        dominated_by:
          - "ICARM curve 276 (Bettridge/Clovis Mint, 2026-08-21): rank-12 Mestre family at T=176, exhaustive locus enumeration, 24 threads -- holds the exact cell targeted"
          - "ICARM curves 157/158/244 (Elkies JMM23 program, submitted by Sutherland): hold the r>=12, r>=13, r>=14 naive-height cells"
        sota_delta:
          r15_naive_height_cell: 0.0
          method: negative, itemised in OBJ-9

    - id: OBJ-11
      joint: 4b
      severity: major
      title: The Mestre-Nagao ordering optimises the wrong coordinate for a HEIGHT record -- confirmed twice, independently.
      statement: >-
        The campaign's target is a JOINT (rank >= 15 AND height < 118.770). Mestre-Nagao
        is a marginal RANK proxy. The executor measured height directly: difference
        -2.59, p = 0.76, and the smallest curve of each family came as often from the
        random arm (min 15.72 ordered vs 11.39 random). The r>=15 incumbent's own
        commentary reaches the same conclusion and states it as its design rationale:
        "gating on exact naive height or log|D| already under the standing record BEFORE
        any Mestre-Nagao scoring: record fibres are downward height fluctuations at
        fixed T-scale, not top Nagao scorers."
      remedy_proposed: >-
        Do not drop the ordering step -- reorder the pipeline. Gate on exact naive
        height first (falsifier_height.py measures the (a,b) fit in seconds), then use
        Mestre-Nagao to order WITHIN the height-admissible set. This is the incumbent's
        architecture and our own control independently points to it.

    - id: OBJ-12
      joint: 4b
      severity: minor
      title: The +0.633 / p=0.068 result is consistent with GOAL-ECQ-001 and is under-powered, not negative.
      statement: >-
        GOAL-ECQ-001's p = 6.1e-8 is a TOP-vs-BOTTOM contrast (28/29 vs 0/9 reaching
        rank >= 9). The contrast comparable to BATCH-f2341e's is TOP-vs-RANDOM,
        28/29 vs 16/25, which I recomputed by Fisher exact as p = 3.4e-3 two-sided --
        not 6.1e-8. The five orders of magnitude live in the bottom arm, which
        BATCH-f2341e never ran. Separately, the arm overlap the executor honestly
        disclosed UNDERSTATES the effect: with 47 box points and 15 per arm,
        E[shared] = 15^2/47 = 4.79 (32% of the random arm), so the observed difference
        is (47-15)/47 = 0.681 of the disjoint-arm contrast, implying +0.930 rather than
        +0.633. p = 0.067 two-sided is |z| = 1.83, SE ~ 0.346; n = 32 per arm suffices
        at the corrected effect. This is an under-powered design, and H-ECQ-d60d07's
        licence for MN as an ORDERING prefilter is not disturbed by it.
      cheapest_fix: >-
        Add a bottom-15 arm. It is the single measurement that produced GOAL-ECQ-001's
        strong result and costs the same as one existing arm.

    - id: OBJ-13
      joint: 4a
      severity: minor
      title: The report artifact of TASK-20260823-d1cb76 was transcribed by the orchestrator after the subagent terminated.
      statement: >-
        That file states its own provenance honestly and names candidate_families.json
        as authoritative, which is the right handling. Recorded here only so that no
        downstream synthesis cites its narrative as a producer-written artifact. It is
        an orchestrator transcription of a returned text output, written after the
        producing session ended.

    - id: OBJ-14
      joint: 4a
      severity: minor
      title: The snapshot archive receipt carries commit_sha and parent_sha null and record_ids empty.
      statement: >-
        TASK-20260823-744c38's receipt has `commit_sha: null`, `parent_sha: null` and
        `record_ids: []`, and states that the hashing role had no shell and transcribed
        96+31 hashes without recomputing any of them. Per AGENTS "Durable research
        commits" the dispatcher's post-commit verifier binds to content first, so this
        can fail loudly but not pass quietly -- the receipt argues this itself and is
        right. Flagged so the ledger archive fills the commit fields rather than
        inheriting nulls. This is an evidence-integrity note, not a mathematical
        finding, and it did not affect any objection above: I read the artifacts from
        the snapshot commit directly and re-verified the database's declared sha256
        myself (match).

  required_controls:
    - id: RC-1
      name: program-conditioned permutation (RUN, this task)
      statement: >-
        Permute naive-height residuals within generative search program, preserving
        program x rank incidence, and recompute the r=15 step. Cost ~40 s of stdlib
        Python on the frozen snapshot; no descent, no network.
      status: run
      result: p 0.00003 -> 0.2175; the soft-cell claim does not survive
    - id: RC-2
      name: exhaustive small-model r>=1 control (RUN, this task)
      statement: >-
        Enumerate all minimal Weierstrass models below a target naive height and
        certify an infinite-order point in exact arithmetic.
      status: run
      result: 3 Cremona-table curves beat the frozen r>=1 cell; best is 43a1 at 11.269579
    - id: RC-3
      name: method-conditioned headroom measurement (NOT RUN, owed)
      statement: >-
        For each Mestre/Fermigier sextuple already named in the board's commentary
        (#276 {-114,-112,44,55,57,70}; #235 {0,7,133,136,430,434}; #86 Fermigier
        {0,55,314,378,1007,1036}), run falsifier_height.py to obtain (a,b) and report
        the height-admissible parameter box at the r>=14 target 85.189 alongside the
        box at the r>=15 target 118.770. Decides where this method has room.
      status: not_run
      why_it_matters: >-
        It is the measurement that turns OBJ-2 from a board observation into a
        campaign decision, and it needs no new family and no new retrieval.
    - id: RC-4
      name: bottom arm for the Mestre-Nagao control (NOT RUN, owed)
      statement: Add a bottom-15 Mestre-Nagao arm to the existing 4-family design.
      status: not_run
    - id: RC-5
      name: nearby-object control already declared in H-ECQ-d60d07 (PARTIALLY RUN by the producer)
      statement: >-
        H-ECQ-d60d07's nearby_object_control asks for a generic-rank-0/1 null base over
        the same parameter range. The executor ran DEMO-NULL-r0 and reported it. That
        control is satisfied for the rank claim and says nothing about the height claim,
        which is the coordinate this campaign actually needs.
      status: run_by_producer_for_rank_only

  counterexample_or_mutation: >-
    The decisive mutation is a relabelling, not a new object: hold the measurement
    (minimum naive height by rank threshold) fixed and vary only the assumed
    generative process. Under one process the r>=15 step is a 3e-5 anomaly; under the
    process the data actually names it is a 0.22 fluctuation. The concrete
    counterexample to "the cell is soft for our method" is the Mestre-specialisation
    frontier itself, on which 118.770 at rank 15 is that method's global best over
    ranks 12-20 -- i.e. the campaign's target is its own method's high-water mark.
    The concrete counterexample to C1 is 43a1 = [0,1,1,0,0], naive height 11.269579,
    generator (-1,0), which takes a frozen record cell and was known in the 1980s.

  baseline_comparison:
    axis: ICARM r>=15 minimum naive height (the campaign's own declared axis)
    incumbent: 118.77017663505484 (curve 276, rank exactly 15, 2026-08-21)
    incumbent_method: >-
      rank-12 Mestre quartic family, integer sextuple {-114,-112,44,55,57,70}, T=176;
      exhaustive enumeration of the Mestre locus 12*p5=5*p2*p3 -- 59479 primitive
      centered sextuples with |a_i|<=500 from 4.21e10 subsets in 87 s on 24 threads;
      exact-height gating BEFORE Mestre-Nagao scoring; hyperellratpoints + ellratpoints;
      15 independent integral points settled exactly by ellrank
    proposed_method: >-
      published Q(t) family of generic rank > 8 specialised at small parameters,
      Mestre-Nagao ordering, exact descent (H-ECQ-d60d07 / TASK-20260823-01d3d9)
    same_method_class: true
    our_best_in_class_on_this_board: 118.77 (i.e. the incumbent itself)
    our_deficit_at_r15: 0.0 units of headroom -- the class already holds the cell
    our_deficit_at_r14: 49.24 (class best 134.43 vs cell 85.19, cell held by Elkies JMM23)
    nearest_specialised_baseline_our_method_does_not_match: >-
      Elkies JMM23 program (curves 157/158/244) -- holds r>=12, r>=13, r>=14 at
      69.34 / 75.76 / 85.19 and contributes nothing at rank >= 15
    dominated_by:
      - ICARM curve 276 (Bettridge/Clovis Mint) -- same method class, holds the target cell
      - ICARM curves 157/158/244 (Elkies JMM23) -- hold the three cells immediately below
    dominated_by_checked_axes: [naive height, rank threshold, method class, compute]
    dominated_by_axes_not_checked: [Faltings height, log conductor]
    sota_delta: 0.0 on the r>=15 naive-height cell; negative on method, per OBJ-9

  heuristic_challenges:
    - id: HC-1
      target: >-
        H-ECQ-d60d07 assumption 2, "the Mestre-Nagao statistic is a heuristic ORDERING
        prefilter only", licensed by GOAL-ECQ-001's dose-response.
      challenge: >-
        The licence transfers for RANK ordering and does not transfer to HEIGHT, which
        is the coordinate this campaign's target requires. Two independent measurements
        say so: our own arm comparison (height difference -2.59, p = 0.76, minimum from
        the random arm) and the incumbent's published design rationale. The assumption
        is not wrong; its stated scope is wider than what supports it.
      status: scope_must_be_narrowed_not_withdrawn
    - id: HC-2
      target: >-
        H-ECQ-d60d07 mechanism: "specialising at SMALL parameters buys high rank and
        small height at once."
      challenge: >-
        The producer's own falsifier measured naive height as a + b*log H(t) with b
        growing steeply in generic rank (2.1, 5.6, 21.2, 67.4 at generic rank 0,1,3,5)
        and an intercept `a` that is a property of the FAMILY, not of small t --
        DEMO-SEC5-BIGCOEFF has a = 506.6 and no admissible parameter at all. So
        "small parameter" does not imply "small height"; "small family coefficients AND
        small parameter" does. The mechanism as stated in the hypothesis omits the
        binding constraint, and the extrapolation of b to generic rank 12-14 is
        explicitly labelled by the producer as extrapolation. That labelling is correct
        and should be preserved in any synthesis.
      status: mechanism_understated_its_own_binding_constraint
    - id: HC-3
      target: Silverman specialisation as motivation.
      challenge: >-
        Correctly quarantined by H-ECQ-d60d07 assumption 1 and by the producer's
        certifier, which takes rank only from exact independence. No objection. Noted
        so that a reader does not mistake silence for an unexamined step.
      status: holds

  cost_model_challenges:
    - id: CM-1
      statement: >-
        The campaign's cost model prices descent and does not price the SEARCH VOLUME
        the incumbent already spent. The incumbent covered 59479 sextuples x (T = m/n,
        n <= 8) in 87 s on 24 threads and still reports that "the cheap search scored
        this fibre 14" -- the 15th point came from ellrank, and nearly all other
        candidates capped rigorously at exactly 13 or 14. Total expected cost to take
        this cell is per-attempt cost x inverse success probability over a search space
        the incumbent has already swept at |a_i| <= 500; our per-attempt cost is not
        the issue, our success probability on unswept volume is, and it has not been
        estimated anywhere in the batch.
    - id: CM-2
      statement: >-
        Campaign budget is 21600 s wall clock with max_concurrent 2 on a 4-core box.
        The incumbent's enumeration alone is 87 s x 24 threads = ~2088 core-seconds for
        the sextuple sweep, with the per-fibre descent on top. Matching its coverage is
        not the constraint; exceeding it is, and no batch has costed that.
    - id: CM-3
      statement: >-
        Third-party movement is an unpriced cost. The r>=15 cell fell ~10% in 84 days
        and moved 41 hours before the freeze. Any expected-value calculation for C1
        must multiply by P(cell still open at submission), which no record states.

  reduction_and_scope_challenges:
    - id: RS-1
      statement: >-
        C1 satisfaction does not reduce to H-ECQ-d60d07 support. They are different
        claims (OBJ-7, OBJ-8) and the goal record does not say which governs a headline.
        This must be fixed before a curve exists, not after.
    - id: RS-2
      statement: >-
        Nothing in this report bears on C2, the base-rank axis. C2 is internal, carries
        the campaign's research content, and is untouched. Do not let a negative finding
        on A2 be read across to A1/C2.
    - id: RS-3
      statement: >-
        No scope inflation was found in the producer artifacts. TASK-20260823-01d3d9
        states its tested scope (generic rank <= 5 demo families, |t| <= 30 or |t| <= 15
        with denominator <= 2, PARI 2.15.4, one 4-core machine) and does not generalise
        beyond it; TASK-20260823-d1cb76 separates rank over Q(t) from rank over
        Q-bar(t) explicitly and flags KLOOSTERMAN-2005-GEOM15's rank claim as geometric.
        Both are recorded here as passing, since an audit that finds nothing must say so.

  proof_architecture_challenges:
    - id: PA-1
      attack: nearby-object
      statement: >-
        The closest object for which "this cell is soft" is FALSE is the r>=18 cell,
        whose incumbent-to-runner-up margin is 0.42% -- even thinner than r>=15's 1.58%
        -- and which shows a log-step of 0.157, the second largest in the table. The
        soft-cell argument applied unchanged to r>=18 would call it soft too, and it is
        plainly the most contested cell on the board. The argument does not distinguish
        "under-attacked" from "attacked to saturation by one method"; the missing
        separator is exactly the program covariate of OBJ-1.
    - id: PA-2
      attack: proves-too-much
      statement: >-
        Run the soft-cell argument against a known-false object: the r>=2 cell, where
        the step from r>=1 is 1.91 absolute but the log-step is 0.152 -- larger than
        r>=18's and comparable to r>=11's. The argument's shape ("a large step against
        smaller steps either side means room") would flag it, yet the r>=2 cell is held
        by a curve of conductor ~200 and there is no meaningful "room" claim to be made
        about rank-2 curves of tiny height. The argument survives on an object where its
        conclusion is uninteresting, which localises the fault to the absence of any
        model of what the step SHOULD be. §3.2's trend model supplies one; the goal
        record does not.
    - id: PA-3
      attack: method-ceiling
      statement: >-
        The largest claim the resource measure supports: with the campaign's own
        measured height law h = a + b*log H(t) and b in the 20-100 range for families of
        interest, the admissible parameter box at the r>=15 target is |t| <~ 2-5 for
        b ~ 70-120 and |t| <~ 89 for the one real candidate family measured
        (KLOOSTERMAN-2005-GEOM15, b = 22.62). The producer states this and states that
        the +2 above generic rank must therefore come from somewhere other than
        parameter volume. That ceiling analysis is sound and is the strongest part of
        the batch. It is also, read together with OBJ-9, an argument that the
        incumbent's answer -- more sextuples rather than more T -- is the correct one
        and is already implemented at 24-thread scale.
    - id: PA-4
      attack: quantifier-order
      statement: >-
        TASK-20260823-d1cb76's proposal states its quantifier order correctly (EXISTS a
        sextuple and EXISTS T0 such that the points span rank >= 9, THEREFORE FOR ALL T
        the sections span rank >= 9, reversed by the homomorphism property). No silent
        witness-after-instance choice found. Recorded as passing.

  narrowest_supported_statement: >-
    On the pre-registered ICARM snapshot of 2026-08-23 (sha256 118db069...cadc59, 289
    curves, re-verified in this task), the step in minimum naive height from the r>=14
    cell (85.189) to the r>=15 cell (118.770) is statistically real under an
    exchangeability null (look-elsewhere-corrected p < 3.3e-5) and is NOT explained by
    submission counts -- the r>=15 cell is a minimum over 115 curves and there are more
    curves of rank exactly 15 (15) than of rank exactly 14 (10). It IS explained by the
    search programs that produced the curves: conditioning the same permutation on the
    program x rank incidence disclosed in the board's own commentary raises p to 0.2175.
    The r>=14 incumbent (#244) is unremarkable within its rank window (p = 0.62); the
    r>=15 incumbent (#276) is the high one (p = 0.016). Restricted to Mestre-family
    specialisation -- the mechanism H-ECQ-d60d07 proposes -- 118.770 at rank 15 is the
    minimum over all ranks 12-20, so the cell is that method's best result rather than
    its soft target. Separately, three curves in Cremona's tables (43a1 h = 11.269579,
    53a1 11.387464, 83a1 11.550443), each certified here by an exhibited infinite-order
    point in exact arithmetic, beat the frozen r>=1 naive-height cell of 11.613603, so
    C1 read literally is satisfiable without any new mathematics.
  scope_limits:
    - These are statements about one frozen snapshot of one leaderboard and about the
      method attributions its commentary field discloses.
    - They are NOT statements about the difficulty of constructing a rank-15 curve of
      naive height below 118.770. Nothing here shows such a curve does not exist or
      cannot be found; the Klagsbrun-batch interpolation (~106.6) is positive evidence
      that it can.
    - The program classification is derived from free-text commentary present on 250 of
      289 curves; 39 carry none and fall into OTHER.
    - The permutation nulls assume height residuals are exchangeable after a log-linear
      rank trend, within group or within program respectively; that is an approximation
      calibrated on this dataset alone.
    - No hypothesis or goal status was changed. No commit was made. Nothing was written
      outside the assigned write_scope.

  what_remains_open:
    - >-
      A rank-15 curve below 118.770 very probably exists and is reachable: the
      Klagsbrun batch covers ranks 12,13,14,16 and skips 15, and interpolating its own
      14 -> 16 entries gives ~106.6. This is a submission gap in a third party's
      dataset and is evidence FOR attainability, by that method.
    - The Elkies JMM23 program reached 85.189 at rank 14 and stops there on this board.
      Whether it extends to rank 15 is unmeasured and is the highest-value open question
      in this neighbourhood. It is not the method this campaign proposes.
    - C2, the base-rank axis, is entirely untouched by this report.
    - Whether Mestre-family specialisation can beat its OWN class best of 134.43 at
      rank 14 -- where the cell sits at 85.189 and is held by a different program -- is
      unmeasured and cheap to bound (RC-3).

  next_concrete_action: >-
    Re-aim the C1 axis at rank 14 before spending another batch on rank 15, and rewrite
    C1 to C1' (OBJ-6 remedy) before any curve exists. The deciding measurement is RC-3
    and needs no new family and no new retrieval: take the Mestre/Fermigier sextuples
    already named in the board's own commentary (#276 {-114,-112,44,55,57,70},
    #235 {0,7,133,136,430,434}, #86 Fermigier {0,55,314,378,1007,1036}), run the batch's
    existing falsifier_height.py to obtain (a,b) per sextuple, and report the
    height-admissible parameter box at the r>=14 target 85.189 next to the box at the
    r>=15 target 118.770. If both boxes are empty, C1 is out of reach for this method
    and the honest deliverable is the measured (rank, height) frontier plus that
    statement, which is a real result and must be recorded as one rather than as a
    fatigue report.

