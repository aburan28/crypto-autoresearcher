  limitations:
    - This report covers only the two assigned joints. It is not a verdict on the batch,
      on H-ECQ-d60d07, or on GOAL-ECQ-002's criteria; the Coordinator composes.
    - My exact certifier and my invariant code were written here from the mathematical
      statements, but both use PARI for ellminimalmodel, .omega, ellglobalred and ellcard,
      as the producer's do. A defect inside those PARI primitives would not be caught by
      either implementation.
