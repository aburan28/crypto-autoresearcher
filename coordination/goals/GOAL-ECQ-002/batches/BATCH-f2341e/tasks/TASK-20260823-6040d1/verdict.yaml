  findings:
    - id: J1-F1
      joint: 1
      severity: major
      title: the Nagao consistency-check conclusion is false, and it was load-bearing
      status_in_producer_record: listed under verified_here; drives NAGAO-1994's "NOT USABLE" status
      what_reproduces: >-
        The producer's hand arithmetic is exactly right. t^6: left 451584, right
        703343886336 = 14017536 - 6307891200 + 709637760000. t^5: left 3403008, right
        5300198572032. Both confirmed symbolically here.
      what_is_false: >-
        Computing all seven coefficients, right/left = 1557504 at EVERY ONE of t^0..t^6,
        and 1557504 = 1248^2. The point ((t+703)/15, 1248*N(t)/75) lies EXACTLY on the
        transcribed quartic. The producer's statement "by factors that are not squares
        and so are not absorbed by any rescaling" is false, and was decidable from the
        two numbers it already had with one division and no code-execution tool.
      consequence: >-
        NAGAO-1994 -- rank exactly 12 over Q(t), peer-proved (Scholten Cor. 1), the
        highest exactly-known Q(t) rank in the candidate list -- was marked
        "TRANSCRIPTION UNRELIABLE -- DO NOT USE" and set aside on a false negative, and
        the recommendation moved to MESTRE-1991-QT11 (>= 11, cited from a paper title)
        partly because of it. sota_delta records "vs Nagao 12 -> -1" without recording
        that the -1 was self-inflicted.
      scope_of_the_correction: >-
        This does NOT establish that the transcription is Nagao's equation. It
        establishes that the evidence offered for corruption does not support that
        conclusion: equation and point are internally consistent up to y -> 1248*y.
        Source retrieval is still required before the family is used.
      corroboration: >-
        Re-deriving from those same coefficients: deg A = 8, deg B = 12, gcd(A,B) = 1,
        deg Delta = 20 -> d = 2 exactly, elliptic K3, ceiling 18 / 17. The producer's
        conditional d <= 2 derivation was correct.
      remedy: >-
        A superseding record reinstating NAGAO-1994 as a candidate pending source
        retrieval. Never an edit to the immutable producer artifact.
    - id: J1-F2
      joint: 1
      severity: moderate
      title: the recommended base's Shioda-Tate ceiling is stated 20 too loose
      detail: >-
        Predicted T-degrees (6,7,8,9,10) for (r_4..r_0) are listed under verified_here;
        the true degrees are (4,4,6,6,8). The bound direction is safe, but the ceiling
        derived from it (deg A <= 16, deg B <= 24, d <= 4, ceiling up to 38) is 20 above
        the true 18. method_ceiling exists precisely so that an over-claim is visible
        immediately; a ceiling loose by 20 is that guard failing open. The producer did
        mark it "must be confirmed by the executor".
      corrected_value: d = 2 exactly; ceiling 18 over C-bar, 17 over Q(T)
    - id: J1-F3
      joint: 1
      severity: moderate
      title: the "small coefficients" argument for the recommended tuple is about the tuple, not the family
      detail: >-
        Measured here: tuple (-17,...,17) yields r_i coefficients up to ~1e10 and
        specialised minimal models at h = 79.6..107.6; tuple (399,...,0) yields ~1e20 and
        h = 122.5..144.0. The rank-11 specialisation I certified sits at h = 107.614
        against a frozen r >= 11 cell of 61.507, leaving ~11 units of the 118.770 budget
        to buy the remaining +4 rank. That is a much tighter box than the report's
        "heights in the 60-120 range => mechanism intact" reading suggests.
    - id: J1-F4
      joint: 1
      severity: minor
      title: verified_by names URLs rather than the verifying agent
      detail: >-
        AGENTS.md rule 9 and templates/research-records.md expect verified_by to name the
        agent. Separately, the sole source for rank >= 11 over Q(T) is Mestre's paper
        titles; the CRAS notes were not opened, which the producer discloses. The
        re-derivation in this report discharges that claim independently.
    - id: J2-G1
      joint: 2
      severity: moderate
      title: run artifacts do not bind the snapshot they consumed
      detail: >-
        snapshot_sha256_declared is null in reproduce_icarm_all.json,
        reproduce_icarm_conductor_retry.json and pipeline_validation.json, while the
        report asserts the declared sha256. Verified independently here that the file
        consumed is the pre-registered one, so no substantive harm -- but the records do
        not establish it on their own, which is what a pre-registered baseline is for.
    - id: J2-G2
      joint: 2
      severity: moderate
      title: supersession is not recorded in the run records, and the superseded runs are not reproducible
      detail: >-
        No manifest carries supersedes / superseded_by. -006 and -011 share identical
        command.txt, git_commit 446ba733 and git_dirty true, so the code edit that
        distinguishes them is captured nowhere. The supersession is recoverable only by
        hashing results/ against raw-result.json, which this task did. Same gap applies
        to -002/-003 vs -004.
      recommendation: the ledger archive should record the supersession explicitly; future runs should hash the source tree into the manifest
    - id: J2-G3
      joint: 2
      severity: minor
      title: the Faltings-convention evidence sentence mislabels one rival convention
      detail: >-
        On curve 42 the 0.30 miss is (1/12)log|Delta| - (1/2)log A, correct; but -log A
        misses by 0.9965, not 0.70. The 0.70 miss belongs to (1/12)log|Delta| - log A.
        The conclusion (-1/2 log A, no discriminant term) is independently confirmed here
        on all 289 curves.
    - id: J2-G4
      joint: 2
      severity: minor
      title: "'r_low matched our exact certification in every non-timeout case' is inaccurate"
      detail: >-
        In RUN-...-016 there are 6 non-timeout cases with r_low = r_high = 1 and no
        generator returned, so the entry carries no certified_rank and is summarised as
        0. Direction is conservative -- the certifier under-reports, never over-reports --
        so section 4b's "max 1, mean 0.4 / 0.2" understates rather than inflates.
    - id: J2-G5
      joint: 2
      severity: minor
      title: "'Both arms fully descended' overstates"
      detail: 9/60 (ordered) and 11/60 (control) PARI ellrank calls timed out; in those cases the certificate rests on the family's prescribed sections alone. Disclosed per entry, not in the section-3 table.
    - id: J2-G6
      joint: 2
      severity: limitation
      title: the two arms are not disjoint, quantified
      detail: >-
        24 of 60 ordered-arm draws also appear in the control arm (8, 5, 4, 7 of 15 per
        family) from boxes of only 45-47 non-singular points. Close to what independent
        uniform sampling would force, so it is a box-size consequence rather than a bias,
        but the permutation test's exchangeability assumption is only approximately met
        and "top 15 of ~46" is a top-third selection ratio -- a shallow test of an
        ordering statistic. No certified rank is affected.
    - id: J2-G7
      joint: 2
      severity: minor
      title: missing certified_rank is imputed as 0, and the rule is stated in code only
      detail: >-
        summarise_validation.py:113 uses c.get('certified_rank', 0). For DEMO-NULL-r0 all
        11 such entries have PARI r_low = r_high = 0, so the imputation is correct and the
        null-control numbers stand. For RUN-...-016 it is not (see J2-G4).
    - id: J2-G8
      joint: out_of_scope_process
      severity: moderate
      title: this review round has no declared review_plan
      detail: >-
        Neither dispatch_queue.json nor the handoff envelope carries a review_plan.
        AGENTS.md "Review architecture" requires one before any reviewer runs, with the
        Coordinator's recorded prior, enumerated owned joints and declared blindness. My
        joints were assigned in the launch message only, so tools/check_review_independence.py
        has no plan to check this round against and "the prior was recorded first" cannot
        be established after the fact. A defect in the round's setup, not in either
        producer's work.

