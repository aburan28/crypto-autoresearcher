      ~1e-15 absolute, not exact.
    - The Mestre generic-rank re-derivation certifies rank E(Q(T)) >= 11 for the span of
      the 12 exhibited sections. It is a lower bound and says nothing about the exact
      generic rank, and 11 is the ceiling of that method (12 affine sections, one spent as
      origin; r_4(T) is not a square in Q[T] for either tuple, so there is no rational
      point at infinity to add a twelfth class).
    - J1-F1 shows the producer's evidence does not support "transcription corrupted". It
      does not show the transcribed coefficients are Nagao's equation. Source retrieval is
      still required.
