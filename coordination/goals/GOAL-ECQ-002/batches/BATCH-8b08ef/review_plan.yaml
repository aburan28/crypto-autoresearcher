review_plan:
  batch_id: BATCH-8b08ef
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-0ed5c8
  authored_by: coordinator (orchestrating session)
  authored_before_any_producer_ran: true
  authored_before_any_producer_ran_note: >-
    This file is written, committed and content-bound BEFORE TASK-20260823-827765 is dispatched. It
    is bound by this batch's LEDGER archive (TASK-20260823-3eedf3) per DEC-20260823-ee9162 R11,
    whose artifact_paths name it explicitly at queue-creation time -- the mechanism that was missing
    for two consecutive batches.

  campaign_position: >-
    BATCH-8b08ef IS THE FOURTH AND LAST BATCH UNDER THE DECLARED CAMPAIGN BUDGET
    (campaign_budget.maximum_batches = 4). DEC-20260823-ee9162 N2 pre-declared, before this batch's
    outcome was known, that when pause condition P1 fires at the close of batch 4, GOAL-ECQ-002
    moves to `closed_at_budget` unless batch 4 meets C1'. NO EXTENSION IS GRANTED AND NONE IS
    IMPLIED. Reviewers should read every claim in this batch knowing that the Coordinator has a
    standing incentive to find one last positive, and should hold it to that.

  standing_negative: >-
    NO CELL HAS BEEN TAKEN IN THREE BATCHES, ON ANY METRIC, AT ANY RANK THRESHOLD. Best at certified
    rank >= 12 is 86.77369390941135, against a frozen r >= 12 cell of 69.33884136527462 and a
    published construction-class benchmark of 79.32867457792244. Rank >= 31 over Q remains an open
    world record (30, Alpoge-Howell 2026) and nothing in this campaign is progress toward it.

  claim_under_review: >-
    AS THE PRODUCER WILL STATE IT, not as the Coordinator would restate it: that enumerating
    admissible canonical 6-tuples with the free squarefree-discriminant pre-filter applied FIRST,
    over a spread box large enough to populate the stratum, yields a few hundred families of
    Shioda-Tate ceiling >= 13 at log P2 below 6; that rank-searching all of them plus the 2114
    unsearched fibres of BATCH-541940's 46 load-bearing families, across the full declared T-box
    with no height cap and no family cap, reaches a stated coverage fraction; and that the resulting
    minimum minimal-model naive height at certified rank >= 12 either does or does not fall below
    the construction-class benchmark read from the frozen snapshot at run time. Plus the three
    controls: a bottom rung with genuinely no rational sections (verified, not assumed), the
    random-curve rank null extended to n = 200 at h approximately 60, 70, 80, 93 and 100, and a
    second-implementation replication of the flat-arm intercept regression with a run record.

  coordinator_prior: >-
    I EXPECT BRANCH B, AND I EXPECT NOT TO REACH IT. Specifically: I expect the pre-filtered
    enlarged box to populate the stratum (P1), I expect the best certified rank->=12 height in it to
    land ABOVE 79.32867457792244 (P2), I expect the genuine null rung to show clearly higher
    envelopes than the k = 6 treatment (P3), and I expect FULL coverage NOT to be reached inside
    3600 s (P4) -- which would fire branch C rather than branch B and would leave the campaign
    closing at budget with a coverage fraction rather than a closed lever. The individual priors,
    their contradiction branches, and what to disbelieve first are below and are what the reviewers
    hold me to.

  recorded_priors:
  - id: P1
    prior: >-
      I EXPECT THE SQUAREFREE-DISCRIMINANT PRE-FILTER OVER AN ENLARGED SPREAD BOX TO POPULATE THE
      STRATUM: at least 200 families of ceiling >= 13 at log P2 below 6, against TWO in the
      exhaustive spread <= 74 census of 13077. THIS IS THE PRIOR EVERYTHING ELSE RESTS ON AND IT IS
      THE ONE I HAVE NOT MEASURED. It is a rate extrapolation from a box where the observed count is
      one family below log P2 = 5 and twelve below 7, and I am extrapolating it into a region the
      census does not cover.
    if_contradicted: >-
      If the enlarged box does not populate the stratum, THE JOB CANNOT TEST THE LEVER AT ALL and
      neither branch A nor branch B of H-ECQ-0ed5c8 fires. The population count IS the result, and
      it falsifies this hypothesis's population claim. Do not let me rescue it by searching the old
      census harder, by widening the target to ceiling >= 12, or by relaxing log P2 < 6 after seeing
      the count. Any change to either threshold after the enumeration has run requires a versioned
      protocol_amendment record and must be reported as one.
    what_to_disbelieve_first: >-
      ANY REPORTED HEIGHT BELOW THE FROZEN FRONTIER VALUE AT THE CERTIFIED RANK CLAIMED. THIS IS THE
      CORRECTED TARGET AND IT REPLACES A MIS-SPECIFICATION OF MY OWN. The BATCH-541940 plan said
      "any reported envelope below 79.329", which compares a rank-UNCONDITIONED envelope minimum
      against a rank-12 board record: followed literally it flags 1489 non-events, and the 25.4297
      minimum is a rank-2 curve that beats nothing, since the r >= 1 cell sits at 11.6136 and the
      r >= 2 cell at 13.5255. The red team held me to that and was right (DEC-20260823-ee9162 R13).
      Under the corrected target, recompute the curve's height from its minimal a-invariants alone,
      prove the model globally minimal, and re-certify the rank with your own code before accepting
      anything.
    and_also_disbelieve: >-
      ANY REPORTED CURVE THAT HAS NOT BEEN CHECKED AGAINST THE FROZEN SNAPSHOT BY curve_key AND BY
      a-invariants, AND AGAINST CREMONA'S TABLES. Both keys, because BATCH-541940 reported frozen
      board curve id 108 (ainvs [1, -1, 0, -415, 3481], curve_key 19929:-2917917,
      h = 29.772761127041008, Elkies-Watkins 2004 per the snapshot commentary) as its own best at
      rank thresholds 3, 4 and 5, and NEITHER THE PRODUCER NOR I CAUGHT IT -- my own multimetric
      table listed it as "our best". Cremona, because C1' names Cremona's tables explicitly and NO
      CREMONA CHECK HAS BEEN PERFORMED ANYWHERE IN THIS CAMPAIGN. Read the finding the other way
      too, which nobody did: a pipeline independently rediscovering a published curve at its exact
      board height is a strong external positive control, and it should be claimed as one.
  - id: P2
    prior: >-
      I EXPECT THE BEST CERTIFIED RANK->=12 HEIGHT IN THE NEW STRATUM TO LAND ABOVE THE BENCHMARK
      79.32867457792244, though below the current 86.77369390941135 -- my point expectation is the
      low 80s. I do not expect the r >= 12 cell (69.33884136527462) to be reached and I do not
      expect C1' to be met.
    if_contradicted: >-
      A CERTIFIED RANK->=12 HEIGHT BELOW THE BENCHMARK IS BRANCH A, AND IT MEANS MY OWN CENTRAL
      INTERPRETIVE MOVE IN BATCH-541940 WAS WRONG. Report it as that, prominently, and do not let me
      absorb it as a refinement. A CLAIMED CELL -- a certified rank r at a height below the frozen
      frontier value at that r, satisfying all four C1' conditions -- routes to review-breakthrough
      per the escalation rule below.
  - id: P3
    prior: >-
      I EXPECT RT-CONTROL-2, THE BOTTOM RUNG WITH GENUINELY NO RATIONAL SECTIONS, TO SHOW CLEARLY
      HIGHER ENVELOPES THAN THE k = 6 TREATMENT -- i.e. that the 12-sections-against-0 contrast is
      real, which has never been tested. The BATCH-541940 k = 0 rung retained large forced rational
      rank (12 of 15 at rank >= 3 against 0 of 79 random curves at matched height), so the ladder
      measured a contrast of about 11 down to 5, not 11 down to 0.
    if_contradicted: >-
      If the genuine null rung shows envelopes INDISTINGUISHABLE from the k = 6 treatment, then rank
      buys nothing on the size axis and the entire A2 premise -- four batches of it -- must be
      REWRITTEN rather than re-aimed. That is the most valuable outcome available in this batch and
      it must be reported prominently, not buried. It has been owed since BATCH-f2341e.
  - id: P4
    prior: >-
      I EXPECT FULL COVERAGE NOT TO BE REACHED WITHIN THE 3600 s PRODUCER CAP. Recorded before the
      run precisely so that a truncated run is read as truncation. BATCH-541940 spent 2460.9 s and
      reached 37.0 percent of a smaller target, with three runs stopped by wall clock and three PARI
      alarms.
    if_contradicted: >-
      Full coverage reached inside budget makes branch B decidable and is a better outcome than I
      expect. If coverage is below 1.00, NEITHER BRANCH FIRES: that is branch C, the coverage
      fraction with its numerator and denominator IS the reportable result, and no negative may be
      claimed from it. A timeout, PARI alarm or crash is an infrastructure outcome and never
      negative mathematical evidence.

  pre_committed_disbelief:
  - >-
    Any claim that a cell was taken. C1' has four conditions -- first exhibited by this program, not
    obtainable by lookup (Cremona included), takes a PRE-DECLARED cell against the frozen frontier,
    and holds against the live board re-read at submission -- and every one must be checked
    independently, in that order, with the later ones examined even when an earlier one fails.
  - >-
    Any reported height below the frozen frontier value at the certified rank claimed (the corrected
    target of P1).
  - >-
    Any frontier or benchmark value TRANSCRIBED rather than read from the frozen file at run time.
    The producer is required to abort the run if the value it reads differs from the audit values in
    H-ECQ-0ed5c8. The value 79.329 is wrong and must appear nowhere; the exact value is
    79.32867457792244.
  - >-
    Any curve reported without a board check by curve_key AND by a-invariants and a Cremona check.
  - >-
    Any Shioda-Tate ceiling taken from the generic K3 bound 18 rather than the family's own fibre
    configuration. The construction's own cap is 15 and no family reaches 18.
  - >-
    Any negative -- of any kind, at any threshold -- stated without its coverage fraction beside it,
    as numerator over denominator. This is the defect BATCH-541940 was charged with and the number
    (37.0 percent) had to be reconstructed by a reviewer from run records.
  - >-
    Any "null" rung whose absence of rational sections is asserted rather than verified, and any
    ladder rung whose reported n differs from the n generated without the attrition being disclosed.
    Two rungs lost 55 and 52 percent of their intended samples undisclosed last batch.
  - >-
    Any statistic quoted as a median without its uncertainty, and any comparison between populations
    that is not matched on coefficient content AND on class size.

  joints:
  - joint: >-
      J1 -- IS THE ENUMERATED STRATUM WHAT IT CLAIMS TO BE? Is the squarefree-discriminant
      pre-filter sound (no false negatives on the ceiling->=13 target set), is the reported
      population of ceiling->=13 families at log P2 < 6 real, and is every ceiling computed from the
      family's own fibre configuration against a cap of 15?
    assigned_to: TASK-20260823-cb510c
    attack_plan: >-
      Re-enumerate a sub-box independently, with your own resultant / squarefree test written from
      the definition of the discriminant and not from the producer's code, and cross-tabulate your
      filter decision against the producer's per-family ceiling for every family in that sub-box.
      Hunt specifically for the failure that would invalidate the whole job: A FAMILY WITH CEILING
      >= 13 THAT THE FILTER DISCARDED. Re-derive from scratch at least six families spanning the
      ceiling classes present, with the full fibre census, the place at infinity, and the Euler check
      sum(deg * v_disc) = 24 = 12d. Confirm the reported population count at log P2 < 6 by your own
      count, and confirm that log P2 is computed the same way it was in BATCH-541940 so the
      comparison to two-in-13077 is a comparison.
    breaking_artifact: >-
      One exhibited family with ceiling >= 13 that the pre-filter discarded, with its fibre census
      and Euler check; or a population count materially below the reported one; or one family whose
      ceiling does not reproduce from its own fibre configuration.
  - joint: >-
      J2 -- DOES THE BEST CANDIDATE SURVIVE INDEPENDENT RE-DERIVATION, AND IS EVERY REPORTED CURVE
      THIS PROGRAM'S? Re-derive the best candidate's naive height from its a-invariants alone,
      settle global minimality, re-certify its rank from the exhibited points with your own code,
      and independently check the provenance of EVERY reported curve against the frozen snapshot by
      curve_key AND by a-invariants and against Cremona's tables.
    assigned_to: TASK-20260823-cb510c
    attack_plan: >-
      Compute c4, c6 and Delta yourself in exact integer arithmetic, verify c4^3 - c6^2 = 1728 Delta,
      and settle minimality by factoring Delta and bounding max_p v_p(Delta). Certify rank by your
      own F_l-reduction certifier with l > 16, with positive controls against published board curves
      of known rank and negative controls on deliberately dependent point sets; verify every
      exhibited point lies on the curve in rational arithmetic first. Then intersect the FULL
      certified set -- not the handful the report displays -- against the frozen snapshot on both
      keys, and run the Cremona check that has never been run. State plainly whether
      pari_ellrank_r_low / r_high is carried into the submission-format deliverable; C1' names the
      ICARM verifier and BATCH-541940's deliverable dropped that field.
    breaking_artifact: >-
      A height or rank that does not reproduce; a model that is not globally minimal where minimality
      is claimed; or any reported curve present in the frozen snapshot or in Cremona's tables.
  - joint: >-
      J3 -- IS THE COVERAGE CLAIM REAL, AND IS EVERY CONCLUSION BOUND TO THE SET ACTUALLY SEARCHED?
      Reconstruct the coverage fraction from the run records rather than from the report, check that
      every attempted row is persisted with a status and a reason, check that the 2114 unsearched
      fibres of the existing 46 were actually finished, and check that no infrastructure outcome is
      read as a negative.
    assigned_to: TASK-20260823-d03635
    attack_plan: >-
      Take the raw run records and count, yourself: families enumerated, families filtered, families
      rank-searched, (family, t) pairs available against pairs searched, per ceiling class, and the
      six families BATCH-541940 never touched. Compare your numerator and denominator against the
      report's. Check every run's time_budget_reached, PARI alarm count and exit status, and check
      whether any conclusion in the report is stated over a set larger than the set searched -- that
      is exactly how BATCH-541940's "none of those 46" statement came to be false while eight of
      them had produced twelve rank-12 fibres. Then apply the quantifier test of H-ECQ-0ed5c8
      proof_search_map.quantifier_order to every negative sentence in the report.
    breaking_artifact: >-
      A coverage fraction materially below the reported one; a negative stated at partial coverage
      without it; an attempted row that fell into an arithmetic difference with no tuple and no
      reason recorded; or a branch-B claim on coverage below 1.00.
  - joint: >-
      J4 -- IS THE NULL ACTUALLY A NULL, AND WOULD ANYTHING HERE SATISFY C1' HONESTLY? Verify by
      your own computation that RT-CONTROL-2's bottom rung has no rational sections, judge whether
      the extended random-curve null (n = 200) is a distribution or still a bound, and judge all four
      C1' conditions independently.
    assigned_to: TASK-20260823-d03635
    attack_plan: >-
      Do not accept "q is irreducible with Galois group S_6" as a proof that the rung has no
      rational sections. Take one family from the rung at its envelope argmin, form the trace
      P + P^sigma of a Galois-conjugate pair of sections, and check whether it is a rational point of
      infinite order on the minimal model -- one number-field arithmetic call, and it is the exact
      mechanism by which the previous k = 0 rung retained about half the construction's rank. Then
      run or re-run the matched random-curve null at the heights the rung actually occupies, and
      report attrition on every rung as generated-against-measured. Finally, take the four C1'
      conditions in order and answer each one, including the ones that are moot because an earlier
      one failed.
    breaking_artifact: >-
      A rational point of infinite order on a rung declared section-free; a rung whose reported n
      differs from its generated n without disclosure; a matched comparison that drops rows on a
      criterion correlated with the manipulated variable; or a C1' condition passed by assertion
      rather than by check.

  blindness:
    mutual: true
    lifted_for: []
    rationale: null
    enforcement: >-
      Both reviewers read ONLY committed state at the snapshot sha produced by TASK-20260823-8ea188,
      and neither opens, lists for content, or searches any path under the sibling's task directory.
      Any batch-level Coordinator analysis document written after the producer terminates is HELD
      OUT OF THE REPOSITORY while the blind round is live, as in BATCH-541940, and is declared for
      content binding by this batch's ledger archive. The snapshot archive role reads no producer
      artifact for content, precisely so that it cannot leak one.

  proves_too_much:
    required_note: >-
      THIS BLOCK WAS MISSING FROM THE LAST TWO REVIEW PLANS AND BOTH REVIEWERS SUPPLIED IT
      UNPROMPTED. Obtaining the substance by the reviewers' own discipline is not a procedure. It is
      assigned here (DEC-20260823-ee9162 R12).
    objects:
    - >-
      (i) MESTRE'S PUBLISHED TUPLE A, (-17, -16, 10, 11, 14, 17), whose rank over Q(T) is at least
      11 per the construction-class record and whose envelope reproduces at 79.6237719007 at t = 4
      by two implementations sharing no code. The ceiling code must not assign it a ceiling below
      11, and the pre-filter must not discard it.
    - >-
      (ii) A GENERIC CEILING-9 FAMILY, six finite I_2 fibres, of the class holding 13257 of 13391
      families. The pre-filter MUST DISCARD it. A filter that keeps this filters nothing, and the
      whole cost argument for the job collapses.
    - >-
      (iii) THE BATCH-541940 k = 0 RUNG, known to retain large forced rational rank. Any argument of
      the form "no rational sections implies no rational rank" must FAIL on it, visibly.
    - >-
      (iv) FROZEN BOARD CURVE id 108, ainvs [1, -1, 0, -415, 3481], curve_key 19929:-2917917. Any
      provenance check that reports this program's output as novel must FLAG it, on either key.
    failure_signature: >-
      An argument or filter that SUCCEEDS on object (ii) -- keeping a generic ceiling-9 family in the
      target stratum -- or that passes object (iv) as novel, or that concludes rank 0 on object
      (iii), or that assigns object (i) a ceiling below 11, has proved too much and is wrong
      somewhere it has not been read closely enough. Report the object, the step at which the
      argument goes through, and what the correct behaviour would have been. A control that cannot
      fail is not a control: state explicitly what each object's PASS looks like before running it.
    assigned_to: >-
      TASK-20260823-cb510c owns objects (i) and (ii); TASK-20260823-d03635 owns objects (iii) and
      (iv). One owner per object, for the same reason there is one owner per joint.

  blind_rederivation:
    required: true
    required_note: >-
      ALSO MISSING FROM THE LAST TWO PLANS. Declared here, with the honesty clause the BATCH-541940
      red team applied to itself unprompted.
    quantity: >-
      TWO QUANTITIES, STATED AS STATEMENTS AND NOT AS METHODS. (1) The minimal-model naive height of
      the batch's best certified rank->=12 curve, defined as log max(|c4|^3, c6^2) evaluated on the
      globally minimal model, computed from the curve's a-invariants alone. (2) The Shioda-Tate
      ceiling of a stated admissible 6-tuple, defined as 18 - sum_v deg(v)(m_v - 1) over the fibre
      configuration of the associated elliptic surface, including the place at infinity, with the
      Euler check sum(deg * v_disc) = 24 = 12d reported alongside.
    parameters: >-
      The tuple and the specialisation parameter t exactly as recorded in the producer's
      machine-readable deliverable, and the reported a-invariants; nothing else. Do not take the
      producer's c4, c6, Delta, fibre list or ceiling as input.
    blind_from:
    - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/scripts
    - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/report.md
    - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/implementation.md
    - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/scripts
    assigned_to: TASK-20260823-cb510c
    honesty_clause: >-
      DECLARE WHAT YOU READ, IN ORDER. If you read any blind_from path before writing your own
      implementation, say so and declare the re-derivation NOT FULLY BLIND, as the BATCH-541940 red
      team did about surface.py and measure.py. An honest partial blindness is worth more than a
      claimed full one, and agreement is weighted accordingly.

  escalation_rule: >-
    A CLAIMED CELL -- a curve of certified rank r whose minimal-model naive height is below the
    frozen frontier value at threshold r, offered as satisfying C1' -- routes to review-breakthrough
    (validator-breakthrough and red-team-breakthrough, policy review-breakthrough, degradable
    false). If that tier cannot be served without a silent downgrade, pause condition P3 fires and
    the GOAL PAUSES rather than downgrading. IF IT DOES NOT FIRE, THE REASON MUST BE RECORDED: an
    escalation rule that never says why it did not fire is indistinguishable from one nobody
    checked.

  coverage_truncation_rule: >-
    Branch B of H-ECQ-0ed5c8 may be asserted ONLY at coverage 1.00 of the enumerated target stratum
    and of the 2114 previously unsearched fibres, with numerator and denominator reported. Below
    1.00, the batch reports branch C: the coverage fraction is the result, no negative is claimed,
    and the goal closes at budget on a partial measurement stated as partial. The Coordinator is
    bound by this sentence as much as the producer is.

  what_the_reviewers_must_hold_the_coordinator_to:
  - >-
    The four recorded priors above, judged as given -- including any that VINDICATE the Coordinator.
    Recording only the corrections would be its own distortion, and the BATCH-541940 red team said
    so explicitly about P1.
  - >-
    The corrected disbelief target. If I revert to a rank-unconditioned comparison anywhere, say so.
  - >-
    The budget statement. The campaign's accounting convention charges PRODUCER wall clock only and
    therefore UNDERSTATES true consumption -- the BATCH-541940 red team alone reported about 2600 s
    of its own compute, and validator and archival sessions are unmeasured. If any record of mine
    repeats the remaining figure as though it were the truth rather than a convention, flag it.
  - >-
    The scope guard. Rank >= 31 over Q is an open world record; if any record of mine reads as
    progress toward it, flag it.
  - >-
    The absence of an EXP-* contract. It is a dispatch precondition of this batch, not an open item.
    If the producer ran without one committed beforehand, that is a procedure deviation and must be
    recorded as one.

  procedure_deviations: []
