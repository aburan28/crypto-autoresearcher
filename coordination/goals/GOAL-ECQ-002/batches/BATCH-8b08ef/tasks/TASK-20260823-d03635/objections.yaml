objections:

  - id: RT-ECQ002-B4-OBJ-001
    joint: J4
    severity: critical
    type: infrastructure_outcome_read_as_negative
    title: >
      12 of 13 RT-CONTROL-2 rung fibres are alarm-interrupted, not measured;
      the report says "13 generated, 13 measured, 0 refused"
    artifact: >
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/null_controls.json
    location: >
      report.md lines 233, 237-238; null_controls.json RT_CONTROL_2.generated_against_measured
      and RT_CONTROL_2.rung_certified_rank_distribution
    finding: >
      The null_controls.json row-level data shows 12 of 13 rung fibres have
      status=attempted_not_measured with reason=pari_ellrank_alarm_point_search_truncated.
      Only 1 rung fibre (row 10, tuple [0,5,16,18,22,29] at t=1) was actually measured,
      with certified rank 1. The summary field generated_against_measured says
      n_rungs_measured: 13, which is false. The rung_certified_rank_distribution
      says {"0": 12, "1": 1}, presenting 12 alarm-interrupted fibres as certified rank 0.
    rule_violated: >
      AGENTS.md rule 5 (a timeout/alarm is not evidence against a mathematical hypothesis);
      review_plan.yaml breaking_artifact for J4 ("a rung whose reported n differs from
      its generated n without disclosure"); review_plan.yaml pre_committed_disbelief
      ("Any 'null' rung whose absence of rational sections is asserted rather than verified,
      and any ladder rung whose reported n differs from the n generated without the attrition
      being disclosed")
    impact: >
      The central RT-CONTROL-2 contrast ("12 of 13 at rank 0 sits with the random-curve
      null, and apart from the 12-section treatment at identical content") is built on
      12 infrastructure outcomes presented as certified rank 0. The report's own alarm
      discipline (section 3) says alarmed fibres "count as attempted-not-measured in
      the coverage denominator, never as a searched fibre that found nothing," but this
      discipline is NOT applied to RT-CONTROL-2.
    required_fix: >
      Correct generated_against_measured to n_rungs_measured: 1. Correct
      rung_certified_rank_distribution to {"1": 1}. Label the 12 alarm-interrupted
      fibres as attempted_not_measured in the summary. Re-run the 12 fibres at a longer
      alarm (90s+) to either certify rank 0 or find rational points. Until then, the
      12-sections-against-0 contrast is measured on 1 pair, not 13.
    status: sustained

  - id: RT-ECQ002-B4-OBJ-002
    joint: J4
    severity: major
    type: unverified_mechanism
    title: >
      The trace map P + P^sigma was not constructed for any rung family;
      the irreducibility argument is mathematically correct but the review plan
      explicitly says not to accept it as proof
    artifact: >
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/null_controls.json
    location: >
      report.md lines 252-254; review_plan.yaml lines 222-225
    finding: >
      The report honestly discloses that the trace map was not constructed. But the
      review plan's attack_plan for J4 says: "Do not accept 'q is irreducible with
      Galois group S_6' as a proof that the rung has no rational sections. Take one
      family from the rung at its envelope argmin, form the trace P + P^sigma of a
      Galois-conjugate pair of sections, and check whether it is a rational point of
      infinite order on the minimal model." This was not done by the producer and not
      by this reviewer either (PARI nffactor encountered a variable-priority issue
      within budget).
    rule_violated: >
      review_plan.yaml attack_plan for J4 (the trace map construction is a required step,
      not optional)
    impact: >
      The null object's section-freeness is argued by irreducibility + S_6, which is
      mathematically sound but is the exact argument the review plan says not to accept.
      The k=0 proves-too-much object PASSES precisely because the trace map IS rational
      for Galois-stable conjugate pairs; without constructing it for the S_6 rung, we
      cannot confirm the contrast is between "trace is rational" (treatment) and
      "trace is not rational" (rung).
    required_fix: >
      Construct the trace map P + P^sigma for at least one rung family at its envelope
      argmin, in number-field arithmetic, and check whether it is a rational point of
      infinite order on the minimal model. This is one number-field arithmetic call.
    status: sustained

  - id: RT-ECQ002-B4-OBJ-003
    joint: J4
    severity: minor
    type: unverified_citation
    title: >
      "Rank >= 31 over Q remains an open world record (30, Alpoge-Howell 2026)"
      is an unverified recalled citation
    artifact: >
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/report.md
    location: >
      report.md line 32
    finding: >
      The citation "Alpoge-Howell 2026" appears without a full reference and without
      provenance marking. Under AGENTS.md rule 9, every citation carries its provenance
      (recalled | retrieved | kb | internal). This appears to be a recalled citation
      and should be marked as such. It is used as a scope guard, not as support for a
      claim, but it should still be marked.
    rule_violated: >
      AGENTS.md rule 9 (citation provenance)
    impact: >
      Minor. The citation is used as a scope guard ("nothing here is progress toward it")
      and not as support for any decision. But it should be marked as recalled until
      verified.
    required_fix: >
      Mark the citation as provenance: recalled, or verify it through the knowledge base
      and upgrade to provenance: kb or provenance: retrieved.
    status: sustained

