digest_status:
  supplied: >-
    TWENTY-ONE of twenty-one, computed by the orchestrating session (which, in
    this session, also performed the coordinator authoring and therefore has a
    shell, unlike the coordinator subagent of the three prior batches). The four
    review records, the three ledger records, the reconciled goal.yaml, the two
    batch-level Coordinator documents, the two KN-FIND entries and the nine
    validator scripts are all bound by content. NO SENTINEL REMAINS.
  recomputation_discipline: >-
    THE GATE, NOT THIS RECORD, COMPLETES THE BINDING. The verify-and-commit gate
    must recompute every one of the twelve digests immediately before staging
    rather than trusting any value in this receipt, and must abort non-zero on
    any mismatch. A content mismatch on any declared path is FATAL to this
    archive; the receipt is NOT to be edited to agree with the tree, and a
    conflict inside a ledger record is resolved by a superseding record under a
    new id, never by an edit picking one side.
  commit_sha_and_parent: >-
    NOT SATISFIABLE BY ANY ROLE IN THE SAME COMMIT, and null by design. The
    orchestrating session fills both in the dispatch queue's archive block
    post-commit. THIS IS A DECLARED RUNTIME SPLIT UNDER binding_mode
    content_first, WHICH IS THE SUPPORTED PATH AND NOT AN UNMET GATE -- see
    DEC-20260823-ee9162 R9(e), which supersedes the earlier claim that the
    dispatcher's completed-archive check is unsatisfiable under this pattern.

