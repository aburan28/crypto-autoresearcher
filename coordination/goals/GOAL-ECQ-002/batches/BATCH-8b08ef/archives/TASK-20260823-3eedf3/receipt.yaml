  binding_order: >-
    Content-first. path_sha256 is the primary binding; commit reachability is
    advisory. A content mismatch on any declared path is FATAL to this archive.

artifact_set_derivation:
  method: >-
    DERIVED, not hand-listed. For a LEDGER archive the set is the reviewers' two
    task directories' declared deliverables (two files each, four in total, and
    both reviewers declared exactly those and wrote nothing else), plus the three
    ledger records this decision creates, plus the reconciled goal.yaml (declared
    in artifact_paths for the first time), plus the two batch-level Coordinator
    documents that DEC-20260823-ee9162 R11(b) binds to this archive, plus the two
    KN-FIND entries that discharge the owed promotions.
  why_this_matters: >-
    A hand-listed artifact set has been wrong three times in this program. The
    orchestrating session must STILL cross-check it with `git ls-files -- <each
    reviewer write_scope>` before staging and abort if either reviewer wrote a
    file this receipt does not name.
  reviewer_write_scopes_enumerated:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-d03635
  reviewer_declared_deliverables_matched: >-
    Both reviewers' own artifact_paths blocks, read at the end of their records,
    list exactly the two files each (validation_report.md + verdict.yaml for the
    validator; redteam_report.md + objections.yaml for the red team). The pre-
    commit cross-check with git over both write_scopes found that the VALIDATOR
    ALSO WROTE NINE ANALYSIS SCRIPTS (ceiling_test.py, ceiling_v3-v7.py,
    validator_analysis.py, validator_ceiling_full.py, validator_rederive.py) in
    its own write_scope, none of them declared. The RED TEAM WROTE NO SCRIPTS;
    its analysis was inline in the session and was not saved as files. The nine
    validator scripts are the code behind the PASS verdict's independent re-
    derivations and, unlike BATCH-541940's inline reviewer code, they EXIST as
    files. They are therefore staged and bound as Group F, a recorded superset,
    rather than left untracked. The red team's inline code remains unarchived
    (O-REVIEWER-CODE-UNARCHIVED), and the structural remedy -- a reviewer that
    runs code declares that code as a deliverable BEFORE it runs -- remains
    prospective.
  limits_of_this_check: >-
    NAME-LEVEL ONLY. Every number in EV-ECQ-5c2c0a and DEC-20260823-722a46 is
    cited to the reviewer or session that measured it.

