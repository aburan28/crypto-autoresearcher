open_items_flagged_not_resolved:

- id: O-RT-CONTROL-2-REPAIR
  raised_by: TASK-20260823-d03635 (OBJ-001, OBJ-002), composed here
  item: >-
    The RT-CONTROL-2 null object is defective: 12 of 13 rung fibres were
    alarm-interrupted (attempted_not_measured), not measured, and the report's
    summary fields present them as certified rank 0. The rank-vs-size contrast is
    withdrawn, not corrected, in this record.
  disposition: >-
    RECORDED, NOT RESOLVED, and expressly not fixable here: it requires re-running
    the 12 fibres at a longer alarm and constructing the trace map, which is a
    next action outside this batch's budget. It does NOT affect the branch-C
    result (coverage, population count, no cell), which is fully validated.

- id: O-ALPOGE-HOWELL-CITATION
  raised_by: TASK-20260823-d03635 (OBJ-003), composed here
  item: >-
    The "Alpoge-Howell 2026, rank 30 over Q" reference is provenance `recalled`
    and unverified.
  disposition: >-
    RECORDED, NOT RESOLVED. It is used only as a scope guard that RESTRICTS what
    may be claimed, so it is conservative in the direction that matters whether or
    not the figure 30 is exact. It is flagged for verification through the
    knowledge base before any decision rests on it.

- id: O-RUN-MANIFEST-COMMIT
  raised_by: the adoption, recorded here
  item: >-
    The run manifests cite the original commit d077b4c41698c06e2aef38bbecc9342bf1478a20,
    which is not reachable from this branch after the cherry-pick adoption.
  disposition: >-
    RECORDED, NOT A DEFECT. Its content is reachable here as ec5184e9c and the
    original sha remains on origin/claude/elliptic-curve-high-rank-h0y9j2. The
    binding is content (path_sha256) per this campaign's content-first receipts.

- id: O-CREMONA-CHECK
  raised_by: standing limitation, carried here
  item: >-
    No Cremona check has been performed anywhere in this campaign, and C1' names
    Cremona's tables. PARI elldata is not installed and no network call is
    permitted, so the check is impossible offline.
  disposition: >-
    RECORDED, NOT RESOLVED. The conductor bound (all reported curves >= 500000) is
    decisive only in the absent direction and is labelled as such. This remains a
    standing limitation on any C1' claim.

- id: O-REVIEWER-CODE-UNARCHIVED
  raised_by: this archival task
  item: >-
    The VALIDATOR's analysis code (ceiling re-derivation, height re-derivation,
    rank certifier) EXISTS as nine scripts in its write_scope and IS NOW
    ARCHIVED as Group F of this receipt, a recorded superset, so the PASS
    verdict's independent re-derivations are reproducible from the repository.
    The RED TEAM's analysis code (coverage reconstruction, q1/Galois re-
    derivation) was inline in the session and was NOT saved as files, so it
    remains unarchived.
  disposition: >-
    PARTIALLY RESOLVED. The validator's code is bound; the red team's inline
    code is not, and cannot be, because it does not exist as files. The
    structural remedy is prospective: a reviewer that runs code declares that
    code as a deliverable BEFORE it runs, in its dispatch_queue.json
    artifact_paths, so the archive can bind it rather than improvise a superset.

- id: O-MANIFEST-SUPERSESSION
  raised_by: standing defect, carried here
  item: >-
    No run manifest in this campaign carries supersedes / superseded_by in the
    schema the validator reads, and RUN-ECQSTR-827765-008's manifest reads
    implementation_error with a hand-written superseded_by note. Fourth
    consecutive batch.
  disposition: >-
    RECORDED, NOT RESOLVED. Correct under AGENTS.md rule 2 (no editing a
    manifest), wrong for a reader of manifests alone. The remedy is a schema
    field or a per-task supersessions record emitted by the harness at write
    time, never an edit.

- id: O-BRANCH-SYNC
  raised_by: this archival task
  item: >-
    BRANCH SYNC. AGENTS.md requires fetching origin/main and MERGING (never
