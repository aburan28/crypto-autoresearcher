  why_this_block_exists: >-
    READ THIS BEFORE CONCLUDING ANYTHING FROM COMMIT ARCHAEOLOGY. This archive
    commit does NOT introduce the producer's artifacts; those were committed at
    the snapshot archive 767d38e4146115b4038bdb80438f24e924779db3 (parent
    ffa72a628b5451c168d496b4b360ce676b49cf8b) before the reviewers ran. This
    commit introduces the four review records, the three ledger records, the
    reconciled goal.yaml, and this receipt. A verifier assuming one commit
    carried all twelve declared paths will be looking in the wrong place.
  snapshot_archive_commit: 767d38e4146115b4038bdb80438f24e924779db3
  snapshot_archive_parent: ffa72a628b5451c168d496b4b360ce676b49cf8b
  adoption_commit: ffa72a628b5451c168d496b4b360ce676b49cf8b
  adoption_commit_detail: >-
    The batch was ADOPTED, not run in this worktree: two coordinator sessions
    independently opened this goal's batch 4, and the committed BATCH-8b08ef
    opening and producer run were cherry-picked from
    claude/elliptic-curve-high-rank-h0y9j2 onto current main on the user's
    direction. The adoption commit ffa72a628 carries the goal-head
    reconciliation (component e) and the two KN-FIND promotions (component f).
    The run manifests cite the original commit d077b4c41698c06e2aef38bbecc9342bf1478a20,
    which is not reachable from this branch after the cherry-pick; its content is
    reachable here as ec5184e9c and the original sha remains on the source
