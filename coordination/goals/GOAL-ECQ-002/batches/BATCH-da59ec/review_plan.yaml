review_plan:
  batch_id: BATCH-da59ec
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-a609f8
  authored_by: coordinator (orchestrating session)
  authored_at: '2026-08-23'
  authored_before_any_producer_ran: true
  why_this_exists: >-
    BATCH-f2341e ran with NO declared review_plan. Its validator recorded that as J2-G8, a
    Coordinator failure. Without a prior recorded in advance, a favourable result cannot be
    distinguished from a result the Coordinator wanted, and the reviewers have nothing to hold the
    Coordinator to. This file fixes that for BATCH-da59ec and is committed before dispatch.

  recorded_priors:
  - id: P1
    prior: >-
      I EXPECT THE ADMISSIBLE BOX TO BE EMPTY AT ALL THREE PRE-DECLARED TARGETS. Nagao's
      transcribed quartic carries coefficients up to 6.47e18 before passing to Weierstrass form,
      where the invariants push higher; the r>=12 target is naive height 69.339, which needs
      roughly |c4| <= 1e30 on the minimal model. My honest expectation is that Nagao is far too
      large and that this batch's result is a measured (a, b) plus "this family cannot reach these
      cells".
    if_contradicted: >-
      A NON-EMPTY BOX IS THE FIRST THING TO DISBELIEVE. If the producer reports one, reviewers
      should assume a height-convention error or a minimalisation bug before accepting it, and
      should recompute the height of at least one reported curve from its a-invariants with their
      own code. BATCH-f2341e pinned the conventions (naive = log max(|c4|^3, c6^2) on the minimal
      model; Faltings with NO (1/12)log|Delta|); a result that disagrees with those is wrong.
  - id: P2
    prior: >-
      I EXPECT MINIMALISATION TO STRIP A LOT, which is the one reason P1 might fail honestly. The
      coefficients carry visible structure (14017536 = 2^10 * 3^4 * 13^2, and 330112972800 =
      14017536 * 23550 exactly). How much survives is genuinely unknown to me and is the single
      number this batch exists to measure.
    if_contradicted: no action; this prior is deliberately weak and is recorded to show the
      uncertainty was acknowledged in advance rather than discovered afterwards.
  - id: P3
    prior: >-
      I EXPECT CERTIFIED RANK >= 12 at small t, matching the cited generic rank.
    if_contradicted: >-
      A certified rank BELOW 12 at several good t is evidence the transcribed coefficients are NOT
      Nagao's published equation, notwithstanding that the transcription is self-consistent. That
      would make source retrieval blocking and the family withdrawn. It must NOT be explained away
      as descent timeouts; a timeout is an infrastructure outcome, never a low rank.

  pre_committed_disbelief:
  - >-
    ANY CLAIM THAT A CELL WAS TAKEN. C1' requires a curve first exhibited by this program, at a
    PRE-DECLARED cell, against both the frozen frontier and the live board. Reviewers must check
    all four conditions independently, and must check the curve is not in the frozen snapshot and
    not a Cremona-table curve. The r>=1 and r>=15 cells are excluded by the hypothesis and a claim
    on either is void on its face.
  - >-
    ANY REPORT THAT MESTRE-NAGAO ORDERING HELPED. It is used only AFTER an exact height gate this
    round. It is neither validated nor refuted by prior work and must not be described as either.
  - >-
    ANY INHERITANCE OF THE BATCH-f2341e "SOFT CELL" FRAMING. It was broken. No record in this
    batch may rest on it.

  joints:
    validator: >-
      J1 the Nagao object itself: is the transcription self-consistent as claimed (the identity at
      all seven coefficients, ratio 1557504 = 1248^2), does its surface degree and Shioda-Tate
      ceiling hold, and is any certified rank genuinely backed by that many exhibited independent
      points in exact arithmetic. J2 the height measurement: recompute (a, b) and the admissible
      box independently, and re-derive the height of any reported candidate from a-invariants alone.
    red_team: >-
      J3 the target choice: are the three pre-declared cells reachable in principle by ANY method,
      or has the Coordinator simply moved from one unreachable cell to three others? Compute the
      program-conditioned picture for r>=12/13/14 as was done for r>=15. J4 provenance and novelty:
      is Nagao genuinely unrepresented on the board, or does the commentary show incumbents already
      used it; and would any curve produced here satisfy C1' honestly.

  escalation_rule: >-
    If a cell IS taken, the review tier escalates to review-breakthrough (validator-breakthrough
    and red-team-breakthrough at max effort) under routing_rules in orchestration/model-policies.yaml,
    because that is a claimed record against an external public leaderboard. That policy is
    degradable: false; if it cannot be served, the goal PAUSES rather than downgrading.
