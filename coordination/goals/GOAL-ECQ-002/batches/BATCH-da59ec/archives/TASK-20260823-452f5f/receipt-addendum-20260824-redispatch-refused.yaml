refusal:
  what_was_asked: >-
    Write coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/archives/
    TASK-20260823-452f5f/receipt.yaml as a snapshot archive of the BATCH-da59ec
    producer TASK-20260823-f88f54, with every path_sha256 value null and a
    `hash_status: filled_at_staging` disclosure, so that a blind Validator and
    Red Team could then read committed, hash-pinned state.
  what_was_found: >-
    THAT FILE ALREADY EXISTS, IS COMPLETE, AND IS BETTER THAN THE ONE ASKED FOR.
    It binds 94 paths with 94 filled 64-hex digests computed by the
    orchestrating session at repo head b07a88cc52f64902f80ea9f1bc34980c2a62986f,
    derived by a recursive walk of the producer's write_scope. AND the review
    round it was supposed to gate HAS ALREADY RUN AND BEEN ADJUDICATED.
  therefore: >-
    Writing the requested file would have been an OVERWRITE of an immutable,
    merged record, and the overwriting content would have been materially FALSE
    in three separate ways (see falsehoods_that_would_have_been_published).
    The deliverable is refused and this addendum is written in its place, inside
    the same declared write_scope.
  rules_that_compel_the_refusal:
  - 'AGENTS.md rule 2 / CLAUDE.md non-negotiable rule 2: run records, ledger
    records and knowledge entries are immutable; corrections supersede, never
    overwrite.'
  - 'This task''s own handoff, ledger/handoffs/TASK-20260823-452f5f.yaml,
    constraints[4]: "Records are immutable: supersede, never overwrite." The
    handoff forbids the act the dispatch card asked for.'
  - 'AGENTS.md rule 5 / CLAUDE.md non-negotiable rule 5: never fabricate. A
    receipt stating "the blind reviewers are about to read this" when they have
    already reported, and stating null where 94 verified digests stand, is a
    fabricated account of the archive''s state.'
  falsehoods_that_would_have_been_published:
  - >-
    THE HASHES. 94 verified digests would have been replaced by 94 nulls. The
    ledger archive TASK-20260823-0a2461 and the correction record
    CORRECTION-stale-receipt-hash.md both establish, in terms, that a null hash
    in a receipt IS A FAILURE AND NEVER A PASS. Regressing filled digests to
    null would manufacture exactly that failure against an archive that does not
    have it, and would make a merged, content-bound archive un-bindable.
  - >-
    THE PURPOSE CLAUSE. The requested receipt states it is "the gate between the
    producer and the review round" and that the reviewers have not started. Both
    reviewers have terminated and their artifacts are on disk and bound; see
    round_state below. That sentence is now false.
  - >-
    THE STATUS CLAUSE. The requested receipt states it changes no hypothesis or
    goal status "-- that is the later ledger archive's job (TASK-20260823-0a2461),
    which stays blocked." TASK-20260823-0a2461 is NOT blocked: it ran, and
    DEC-20260823-839fc6 moved H-ECQ-a609f8 from `proposed` to `rejected` (scoped).
    A record asserting a completed transition is still pending is a false
    statement about official state.
  what_was_NOT_done_and_is_worth_stating: >-
    No file in this directory was edited. receipt.yaml was read and left exactly
    as found. No hash was recomputed, altered, or invented. No status was
    changed. Nothing was written outside write_scope. No ledger record was
    touched.

