orchestration_caused_deviations:

- id: D-PREDECLARED-VALUES
  kind: pre-declaration integrity defect
  severity: real; recorded; attributed by the orchestrating session to itself
  origin: ORCHESTRATING SESSION (Coordinator)
  artifact: coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/CORRECTION-predeclared-target-values.md
  artifact_state: committed in the batch directory before this archive; NOT bound by this receipt (see O-ORCH-DOCS-UNBOUND)
  what: >-
    Two of the three PRE-DECLARED incumbent values in H-ECQ-a609f8 do not match the
    frozen baseline frontier_20260823.json: r>=12 differs by 6.0e-5 and r>=13 by
    5.3e-4; r>=14 is identical. Curve ids (157, 158, 244) and submitters agree in
    both places; only the height values differ.
  who_found_it: >-
    Raised by the producer TASK-20260823-f88f54 as a flagged anomaly (report.md
    section 7); confirmed independently by the orchestrating session before any
    archive.
  what_the_correction_record_states: >-
    That the fault is the Coordinator's, not the producer's and not the reviewers';
    that the producer used the PRE-DECLARED values as the gate because they are the
    stricter of the two; that against measured gaps of 24-40 it changes no
    conclusion; that it matters anyway, because a pre-declared value that does not
    match its own frozen source is not pre-declared in any meaningful sense and,
    had the result been close, would have been indistinguishable from moving the
    goalposts; that H-ECQ-a609f8 is NOT edited; that the frozen baseline wins where
    the two disagree; and that the ledger archive TASK-20260823-0a2461 must carry
    the correction into the evidence and decision records.
  archive_disposition: >-
    RECORDED, NOT ADJUDICATED. This archive does not rule on whether the correction
    is complete, on whether "changes no conclusion" is right, or on what the defect
    is worth. It records that the defect exists, that it was self-reported by the
    orchestration layer, that no committed record was overwritten, and that it is
    owed to TASK-20260823-0a2461. Reviewers may weigh it themselves; it is offered
    as a fact about the batch's provenance, not as a mitigation.

- id: D-MULTIMETRIC-CHECK-PROVENANCE
  kind: artifact_provenance_deviation
  severity: real; recorded; determines how the artifact may be cited
  origin: ORCHESTRATING SESSION (Coordinator)
  artifact: coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/COORDINATOR-multimetric-check.md
  artifact_state: committed in the batch directory before this archive; NOT bound by this receipt (see O-ORCH-DOCS-UNBOUND)
  provenance_stated_precisely_so_no_reader_has_to_guess:
  - >-
    IT IS NOT A PRODUCER ARTIFACT. It was written by the orchestrating session
    AFTER TASK-20260823-f88f54 returned, using that producer's outputs as input. It
    is outside the producer's write_scope and was authored after the producer
    terminated, so it is not evidence of anything the producer had on disk or
    computed.
  - >-
    IT IS NOT REVIEWED. No validator and no red team has seen it. It carries none of
    the independence the review architecture exists to supply.
  - >-
    IT IS NOT EVIDENCE. Its own header calls it "triage input for the ledger
    archive. Not evidence". No evidence or decision record exists for this batch
    yet, and this receipt creates none.
  what_it_contains: >-
    A comparison of four certified curves (t = 62, 1, 2, 0) against the frozen
    frontier cell at each curve's own certified rank threshold, on three metrics --
    naive height, Faltings height and log conductor -- concluding in its own words
    that NO cell is taken on any metric, with the closest approach stated as t = 1
    on Faltings height. It states that conductors are the producer's and that log N
    was computed by the orchestrating session from exact integers, and that
    comparisons use the frozen baseline rather than the mis-transcribed
    H-ECQ-a609f8 values.
  unestablished_hypothesis_it_floats:
    marked: UNESTABLISHED
    content: >-
      The document proposes that HIGH RANK AND SMALL SIZE ARE SERVED BY DIFFERENT
      METHOD CLASSES -- that specialising a high-rank Q(t) family buys rank and pays
      in size while the small-curve cells are held by direct search -- and that if
      so, the campaign's A2 premise is wrong at the root rather than in its choice
      of family.
    the_document_s_own_qualification: >-
      It states plainly "THIS IS NOT ESTABLISHED", that it rests on two families,
      one measured in a single box, and on a program attribution derived from
      free-text commentary that was itself unreplicated, and that it is written to
      be attacked rather than absorbed.
    archive_position: >-
      MARKED UNESTABLISHED AND LEFT THERE. This archive neither endorses nor
      disputes it, and it must not be cited as a finding, as evidence, or as a
      reason to close or deprioritise anything. If it is to bear weight it needs a
      record and review of its own.
  archive_disposition: >-
    RECORDED. Its presence in the batch directory is a fact about what the reviewers
    will find at the snapshot sha, which is why it is inventoried here with its
    provenance attached rather than left to be discovered without one. See
    O-MULTIMETRIC-EXPOSURE.
  not_a_licence: >-
    Recording this is not a finding that a Coordinator running its own post-hoc
    analysis into a producer's batch directory is acceptable practice. The
    alternative -- commissioning the same check as a producer task with a handoff,
    a run record and review -- was available. The tradeoff was made by the
    orchestrating session, not by this archive, and is logged as a deviation against
    the orchestration layer.

- id: D-BASE-COMMIT-DRIFT
  kind: recorded_fact, not a defect
  origin: normal operation
  what: >-
    The producer's report states its repo commit at execution as
    a039e9630b27f63c204eeff0e41ffeda3eddc6d2 with a clean tree at start. The repo
    head at which the 94 hashes were computed is
    b07a88cc52f64902f80ea9f1bc34980c2a62986f. The two differ because commits landed
    between the producer starting and the hashes being taken.
  effect: >-
    None asserted. Recorded so a reviewer comparing the producer's stated base
    commit against the snapshot commit does not re-derive the difference as an
    anomaly. The content binding is to the hashes above and is independent of which
    commit the producer started from.

runtime_split:
  declared_in: the dispatch envelope for this task and the campaign runtime for GOAL-ECQ-002
  authored_by: coordinator subagent (this record and every archival judgement in it)
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell. It therefore AUTHORS
    the archive receipt and every archival judgement, and the orchestrating session
    executes only the mechanical sha256 computation and the `git add` / `git commit`
    of exactly the paths declared in path_sha256. This is a tooling split, NOT a
    worker committing into shared state: no producer or reviewer stages anything
    here, the staged set is fixed by this record before the commit exists, and the
    dispatcher's post-commit verifier binds the commit back to these hashes.
  coordinator_could_not_execute:
  - sha256sum over the declared paths (all 94 supplied pre-computed; see context.hashes_supplied_by)
  - git fetch / merge / push / commit, and therefore commit_sha and parent_sha
  - any determination of which paths are already tracked or committed
  - re-execution or re-verification of any producer computation
  what_this_role_did_do: >-
    Read the handoff, the dispatch queue, the supplied hash file, the review plan,
    the producer's report and the two orchestration-layer documents; enumerated the
    producer's write_scope with a read-only listing tool and compared it against the
    supplied key set; transcribed all 94 pairs; and wrote this receipt. It read no
    producer artifact for correctness.
  precedent: >-
    Same split as TASK-20260823-744c38 (BATCH-f2341e) and GOAL-ECQ-001
    TASK-20260822-66bacf. Consistency is intentional: the verifier and any auditor
    should see one stable pattern rather than a per-batch improvisation.

open_items_flagged_not_resolved:

- id: O-DERIVATION-VERIFIED
  raised_by: this archival task
  item: >-
    THE DERIVED SET WAS CHECKED, NOT ASSUMED. The dispatch envelope required this
    role to verify the write_scope-derived set against the queue's declared
    artifact_paths and raise an item if anything was still missing. All 3 declared
    artifact_paths are present; an independent name-level enumeration of the
    write_scope found no path present in the tree and absent from the set, and no
    key outside the write_scope. Run ids are contiguous 001-012 with a complete
    six-file set each.
  disposition: >-
    NO GAP FOUND at name level. Recorded as a positive result of the systemic fix
    logged by TASK-20260823-744c38, and recorded WITH ITS LIMITS: this role could
    not hash anything, could not see ignored or hidden files, and could not
    determine tracked-vs-untracked status. The orchestrating session must still
    ensure all 94 declared paths are staged; a path bound here but absent from the
    commit is a defect the post-commit verifier must catch, not a rounding error.

- id: O-ORCH-DOCS-UNBOUND
  raised_by: this archival task
  item: >-
    TWO ORCHESTRATION-LAYER DOCUMENTS THE REVIEWERS WILL READ ARE NOT CONTENT-BOUND
    BY THIS RECEIPT: CORRECTION-predeclared-target-values.md and
    COORDINATOR-multimetric-check.md, both directly under
    coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/. They lie outside the
    producer's write_scope, so the derivation correctly excluded them, and outside
    this task's write_scope, so this role cannot move them. The same is true of
    review_plan.yaml and dispatch_queue.json, which are the reviewers' declared
    inputs.
  why_it_matters: >-
    Both reviewers read committed state at the snapshot sha. For these files that
    binding rests on commit reachability alone, which CLAUDE.md treats as advisory,
    rather than on a hash. A later edit to either document would not fail this
    archive.
  disposition: >-
    RECORDED, NOT RESOLVED, and expressly NOT fixed by expanding the hash set --
    binding paths whose hashes were not supplied is exactly the scope expansion an
    isolated archive commit forbids, and these are not the producer's artifacts. The
    ledger archive TASK-20260823-0a2461 should decide, once and for the campaign,
    whether batch-level Coordinator documents are content-bound by the snapshot
    archive, by a separate archive, or not at all.

- id: O-MULTIMETRIC-EXPOSURE
  raised_by: this archival task
  item: >-
    COORDINATOR-multimetric-check.md states "the reviewers have not seen it", yet it
    sits in a directory that both reviewers' declared read_scope includes
    (coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec) and that will be
    committed at the snapshot sha they are told to read. Unless something prevents
    it, both reviewers can read it, and it contains the orchestrating session's own
    post-hoc conclusion plus an unestablished hypothesis about method classes.
  why_it_matters: >-
    The reviewers are dispatched blind to each other and are asked for independent
    verdicts on exactly this subject matter -- the red team's J3 is the reachability
    of the target cells by any method, which is what the unestablished hypothesis
    speaks to. A Coordinator conclusion sitting in their read path is the same class
    of exposure as a verbose commit message, which leaked a reviewer's finding to a
    blind sibling in GOAL-ECQ-001 (BI-1).
  disposition: >-
    RECORDED, NOT RESOLVED. Whether that exposure is acceptable, or whether the
    document should be moved, held back, or explicitly put to the reviewers as a
    target to attack (which is what the document itself asks for), is the
    orchestrating session's call BEFORE the review round is dispatched. This archive
    does not make it, does not remove the file, and does not endorse its contents.
    D-MULTIMETRIC-CHECK-PROVENANCE above states its provenance so that a reviewer
    who does read it cannot mistake it for a producer artifact or for evidence.

- id: O-RUN-011-012-EQUAL
  raised_by: this archival task
  item: >-
    AN ARITHMETIC OBSERVATION ON THE HASH TABLE, offered for checking and asserted
    as nothing more. RUN-ECQNAG-f88f54-011/raw-result.json and
    RUN-ECQNAG-f88f54-012/raw-result.json carry the SAME sha256
    (563299c864b2...a83f), which is also the sha256 of the declared artifact
    nagao_height_budget.json. The producer's report (section 9.4) describes -011 as
    a superseded deliverable build whose fibre count was 1258, corrected in -012 to
    the union count 1137.
  why_it_is_recorded: >-
    Two run records the producer describes as differing in a reported number carry
    byte-identical raw results. There are innocent readings -- for instance that the
    corrected deliverable was written back into both directories, or that the
    differing number lives in a file other than raw-result.json -- and there are
    readings that would matter to rule 2 (supersede, never overwrite). This archive
    cannot distinguish them: it read none of these files and computed none of these
    hashes.
  disposition: >-
    RECORDED FOR THE VALIDATOR, NOT ADJUDICATED. It is a checkable question about
    the run records now bound above, and it belongs to TASK-20260823-72505a's
    validity checks (expected run count, manifest completeness, raw/summary
    agreement, quarantine of superseded runs). NOTHING IS INFERRED HERE about
    whether a defect exists, and nothing in the producer's reported measurements is
    called into question by this receipt.
  related_observation_recorded_at_the_same_level: >-
    Also purely arithmetic on the table: the raw-result.json of runs -001 ... -009
    each equal a distinct file under results/ (step1_nagao_identity,
    step2_weierstrass, step2b_minimalisation, falsifier_height_004/_005/_006,
    falsifier_height_probe_wide, step5_rank_probe, step5b_rank_probe respectively),
    consistent on its face with results/ files being copied into run records as
    raw-result.json; the stdout.log of -004, -005 and -006 are byte-identical to one
    another while their raw results differ; and every environment.json is
    byte-identical across all 12 runs. These are observations on the hash table
    alone. They are NOT verifications, NOT claims about file contents, and NOT
    assessments of any run.

- id: O-BRANCH-SYNC
  raised_by: this archival task
  item: >-
    BRANCH SYNC NOT PERFORMED BY THIS ROLE. AGENTS.md and CLAUDE.md require fetching
    origin/main and merging (never rebasing) it into the working branch before an
    archival commit, and recording the base commit checked and the merge outcome in
    the task receipt. This role has no shell.
  disposition: >-
    DELEGATED to the orchestrating session, which must fetch origin/main, merge it
    into the working branch, and record the base commit and merge outcome. Repo head
    supplied to this role at hashing time was
    b07a88cc52f64902f80ea9f1bc34980c2a62986f. Never resolve a sync conflict by
    editing a record: stop and create a superseding record.
  pr_obligation: >-
    The branch must be pushed and a PR against main opened or refreshed. This
    archive introduces NO new GOAL/RQ/IDEA/H/EXP/EV/DEC/TASK/KN record ids
    (record_ids is empty), so this commit owes no new record names to a PR
    description. The ledger archive TASK-20260823-0a2461 will owe EV-ECQ-cbc837 and
    DEC-20260823-839fc6.

- id: O-BLINDNESS
  raised_by: this archival task
  item: >-
    Both reviewers are dispatched blind to each other. The commit message for this
    snapshot must say THAT the producer's artifacts landed and never WHAT they
    found. The producer has reported outcomes at every joint the reviewers are being
    asked to judge; restating any of them in a commit subject would prejudice both.
    A verbose archive commit message leaked one reviewer's findings to a still-blind
    reviewer in GOAL-ECQ-001 (BI-1).
  disposition: >-
    Recorded as a binding constraint on the orchestrating session's commit message,
    per the dispatch envelope's own constraint list. This receipt is itself committed
    content the reviewers may read; it is written as an inventory, and
    non_endorsement above states why nothing in it should be read as a finding.

