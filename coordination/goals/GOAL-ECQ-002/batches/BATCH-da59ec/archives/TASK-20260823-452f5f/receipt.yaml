source_tasks:
- id: TASK-20260823-f88f54
  role: producer (executor)
  commissioning_goal: GOAL-ECQ-002
  batch: BATCH-da59ec
  hypothesis_under_test: H-ECQ-a609f8
  status: terminal
  declared_artifact_paths_in_dispatch_queue:
