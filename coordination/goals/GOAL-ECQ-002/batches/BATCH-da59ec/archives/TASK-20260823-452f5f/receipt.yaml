  - coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-f88f54/cell_reachability.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-f88f54/report.md
  paths_bound_here: 94 (the 3 declared paths plus scripts/, results/ and all 12 run records)
  execution_facts_as_the_producer_reports_them:
    runs_recorded: 12 (RUN-ECQNAG-f88f54-001 ... -012, contiguous)
    runs_marked_defective_by_the_producer: >-
      3. RUN-...-008 (implementation_error: called evaluate_candidate with
      want_record=False, skipping the point search, so it produced no rank numbers;
      superseded by -009). RUN-...-010 and RUN-...-011 (deliverable-build errors: a
      missed key name and a hard-coded fibre count of 1258 that double counted a
      121-parameter overlap; superseded by -012). The producer states all three are
      preserved in place, marked, and that nothing was reused from them.
    timeouts: 0 (producer's report, sections 0, 3 and 4)
    crashes: 0 reported
    budget: >-
      declared 3600 s / 4 GB / 80 runs; producer reports ~100 s wall clock, peak RSS
      under 1 GB, 12 runs used.
    inference_as_reported: >-
      requested policy executor-implementation, answered by claude-opus-5, producer
      states no fallback and no downgrade.
  what_it_produced_stated_structurally: >-
    A height-budget measurement for the transcribed NAGAO-1994 family and a
    per-target reachability statement at the three pre-declared cells of
    H-ECQ-a609f8, plus the scripts, raw results and run records behind them. The
    producer's own report states: all three admissible boxes are EMPTY at the exact
    height gate; that because the gate left nothing, MESTRE-NAGAO ORDERING WAS NEVER
    RUN, there being no admissible set to order; and that NOTHING WAS SUBMITTED TO
    ICARM and no submission artifact exists. It further reports a symbolic
    re-verification of the Nagao identity, a quartic-to-Weierstrass conversion with
    an independent cross-check, a wide robustness probe recorded separately from the
    declared box, a secondary rank probe with certified lower bounds, and an
    independent recomputation of every reported height from a-invariants. EVERY ITEM
    IN THIS PARAGRAPH IS THE PRODUCER'S OWN ACCOUNT OF ITS OWN WORK, transcribed so
    the archive says what it is freezing. See non_endorsement below.

non_endorsement:
  statement: >-
    NOTHING IN THIS RECEIPT IS A VERDICT. Where a gate, box, check, control or
    figure is named above, it is named because the archive must identify what it is
    freezing -- not because this archive has evaluated it. This role did not re-run
    the pipeline, did not recompute a single hash, did not re-derive a height or a
    rank, and did not read the producer's artifacts for correctness. THIS ARCHIVE
    TAKES NO POSITION ON WHETHER THE THREE BOXES ARE IN FACT EMPTY, on whether the
    height convention or the minimalisation is right, on whether any certified rank
    is genuinely backed by that many independent exhibited points, on whether the
    exact gate really preceded any ordering step, or on what any of it means for
    H-ECQ-a609f8's falsification clauses. It likewise takes no position on the
    multi-metric check recorded below.
  reviewer_instruction: >-
    Reviewers: treat the producer's report as the claim under test and this receipt
    as an inventory. If this receipt and a producer artifact disagree about any
    substantive number, the producer artifact is the object of review and this
    receipt is wrong. The recorded priors P1-P3 in review_plan.yaml, not this
    receipt, are what the Coordinator is to be held to.

