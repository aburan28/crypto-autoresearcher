unarchived_computation:
  item: >-
    THE TWO LARGEST MEASUREMENTS OF THIS ROUND ARE NOT ARCHIVED AS CODE OR DATA.
    The red team evaluated 141221 fibre heights and ran 200000 permutation
    replicates; the validator re-derived 1137 fibre heights with its own Kraus
    minimalisation and swept 7593 more, wrote its own rank certifier, and
    computed -A_p over eight primes for NAGAO and five null families. NONE OF IT
    HAS A RUN RECORD, AN ARCHIVED SOURCE FILE OR A RAW RESULT. Both reviewer
    write_scopes contain exactly their two report files.
  why_it_matters: >-
    DEC-20260823-839fc6 is `reject_scoped` partly on those numbers. They are
    recorded in EV-ECQ-cbc837 at DERIVATION GRADE -- reproducible in principle
    from the reports' own stated enumerations and definitions, agreeing across
    three implementations, and never cited as certificates. BATCH-f2341e had the
    opposite problem and the better outcome: its red team's controls script
    existed but was undeclared, and the ledger archive added it. Here there is
    nothing to add.
  disposition: >-
    RECORDED, NOT CURED. Archiving the enumerations and the minimalisation code
    is listed in DEC-20260823-839fc6 owed_items. THE SYSTEMIC FIX IS A HANDOFF
    ONE: a reviewer whose deliverable will be relied on numerically must have
    its analysis directory in its declared artifact_paths BEFORE it runs. That
    is the same DERIVE-DO-NOT-HAND-LIST rule, applied to reviewers rather than
    producers.

open_items_flagged_not_resolved:

- id: O-PROOF-ARTIFACT-ORDERING
  raised_by: this archival task
  item: >-
    docs/claims-and-verification.md requires the refutation artifact to be
    archived BEFORE the decision that relies on it. Both derivation notes
    DEC-20260823-839fc6's `reject_scoped` rests on -- the 12d slope bound and
    the Shioda-Tate ceiling computation -- live inside REVIEW REPORTS, which
    this archive binds, i.e. potentially in the same commit as the decision.
  what_is_known: >-
    The red team's artifacts were committed during the round: the validator's
    own blindness disclosure records the subject line of commit ac5f28d6d,
    "TASK-20260823-eaf799 artifacts land". This role has no shell and cannot
    determine the commit state of validation_report.md.
  disposition: >-
    THE ORCHESTRATING SESSION MUST RECORD, in the dispatch queue's archive block
    or in its task receipt, WHICH COMMIT CARRIES EACH OF THE FOUR REVIEW
    ARTIFACTS. Where an artifact and the decision citing it land together it is
    a residual ordering deviation charged to the orchestration layer and never
    to a reviewer, already recorded in EV-ECQ-cbc837 proof_artifact_ordering.
    THE STRUCTURAL REMEDY IS A SECOND SNAPSHOT ARCHIVE OF THE REVIEW ROUND
    before the ledger archive, whenever the refutation artifact will come from a
    reviewer. Not fixed here, because creating a snapshot archive is not this
    task's scope.

- id: O-KNOWLEDGE-PROMOTION-BLOCKED
  raised_by: this archival task
  item: >-
    A MANDATORY KNOWLEDGE PROMOTION COULD NOT BE PERFORMED. DEC-20260823-839fc6
    is `reject_scoped` on `replicated` evidence, which under
    agents/coordinator.md requires promoting a KN-FIND in this same ledger
    archive with a regenerated knowledge/INDEX.md. knowledge/ is in neither this
    task's write_scope nor its artifact_paths.
  disposition: >-
    OWED AND BLOCKED, NOT DECLINED. Recorded in DEC-20260823-839fc6
    knowledge_promotion with the finding's title, statement, worked instance,
    proof_status and verbatim scope line PRE-DECLARED IN FULL so it cannot drift
    while it waits, and in the BATCH-da59ec checkpoint. It is component (f) of
    the single next action. NOT fixed by writing outside write_scope: an
    undeclared path in an isolated archive commit is exactly what the archive
    discipline forbids, and breaking it to satisfy another rule would leave both
    broken.

- id: O-REVIEWER-ARTIFACT-DECLARATION
  raised_by: this archival task
  item: >-
    Neither reviewer's declared artifact_paths included an analysis or code
    directory, so the round's heaviest computation is unarchived (see
    unarchived_computation). The dispatch queue declared two files per reviewer
    and both reviewers wrote exactly two files, so NO RULE WAS BROKEN -- the
    declaration itself was too narrow.
  disposition: >-
    RECORDED, PROSPECTIVE FIX ONLY. A reviewer whose numbers will be relied on
    must carry its analysis directory in its declared artifact_paths before it
    runs. Belongs to the next batch's dispatch, not to this archive.

- id: O-BRANCH-SYNC
  raised_by: this archival task
  item: >-
    BRANCH SYNC NOT PERFORMED BY THIS ROLE. AGENTS.md and CLAUDE.md require
    fetching origin/main and MERGING (never rebasing) it into the working branch
    before an archival commit, and recording the base commit checked and the
    merge outcome in the task receipt. This role has no shell.
  disposition: >-
    DELEGATED to the orchestrating session, which must fetch origin/main, merge
    it into the working branch, and record the base commit and the merge
    outcome. NEVER RESOLVE A SYNC CONFLICT BY EDITING A RECORD: stop and create
    a superseding record. Also run
    `python3 tools/merge_digest.py --since $(git merge-base HEAD origin/main) --until origin/main`
    before resuming the goal, per CLAUDE.md.
  pr_obligation: >-
    THIS ARCHIVE INTRODUCES TWO NEW LEDGER RECORD IDS -- EV-ECQ-cbc837 and
    DEC-20260823-839fc6 -- plus a write-once goal checkpoint shard, so the
    branch MUST be pushed and a PR against main opened or refreshed NAMING BOTH
    IDS. A record that exists only in a local commit is unpublished, not durable
    evidence.

- id: O-COMMIT-MESSAGE
  raised_by: this archival task
  item: >-
    The snapshot archive's O-BLINDNESS constraint required a contentless commit
    message WHILE ANY REVIEWER WAS LIVE. BOTH REVIEWERS HAVE NOW TERMINATED AND
    REPORTED, so that constraint is spent and this commit may name what it
    contains.
  disposition: >-
    The commit message should name TASK-20260823-0a2461 and the two record ids,
    and may state the batch's outcome. It must not overstate it: no cell was
    taken, C1' is not met, and nothing here is progress toward rank >= 31 over Q.

- id: O-GOAL-RECORD-STALE
  raised_by: this archival task
  item: >-
    ledger/goals/GOAL-ECQ-002/goal.yaml carries next_action "Run BATCH-da59ec
    ...", a latest_verified_commit pointing at BATCH-f2341e's snapshot, and an
    objective stating the elliptic-K3 ceiling as "cap 18 over C, 17 over Q",
    which DEC-20260823-839fc6 R7 corrects for the surface this batch measured.
  disposition: >-
    NOT FIXED HERE -- the path is not in this task's declared artifact set and
    this archive stages only declared paths. THE COMMITTED RECORD OF THE GOAL'S
    ONE NEXT ACTION IS DEC-20260823-839fc6 N1 AND THE BATCH-da59ec CHECKPOINT.
    Reconciliation is component (e) of that action, with goal.yaml in the
    declared path set. SECOND CONSECUTIVE BATCH OWING IT; charged to the
    Coordinator.

runtime_split:
  declared_in: the dispatch envelope for this task and the campaign runtime for GOAL-ECQ-002
  authored_by: coordinator subagent (this record, the three ledger records, and every judgement in them)
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell. It therefore
    AUTHORS the adjudication and the receipt, and the orchestrating session
    executes only the mechanical sha256 computation and the `git add` /
    `git commit` of exactly the paths declared in path_sha256, plus the fetch /
    merge / push and the PR. This is a tooling split, NOT a worker committing
    into shared state: no producer or reviewer stages anything here, the staged
    set is fixed by this record before the commit exists, and the dispatcher's
    post-commit verifier binds the commit back to these hashes.
  coordinator_could_not_execute:
  - sha256sum over the declared paths (no hash file was supplied for this task)
  - git fetch / merge / push / commit, and therefore commit_sha and parent_sha
  - any determination of which paths are tracked, or of which commit carries which review artifact
  - re-execution or re-verification of any producer or reviewer computation
  precedent: >-
    Same split as TASK-20260823-452f5f, TASK-20260823-d26c06 (BATCH-f2341e
    ledger) and GOAL-ECQ-001 TASK-20260822-2fa82a. Consistency is intentional:
    the verifier and any auditor should see one stable pattern rather than a
    per-batch improvisation.

