hashes_pending:
  status: TRUE AT AUTHORING TIME. EVERY VALUE IN path_sha256 IS null.
  why_no_hash_file_was_available: >-
    Unlike the snapshot archive, this role was supplied NO pre-computed hash
    file. coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/orchestrator_path_sha256.json
    covers the PRODUCER's 94 paths at the snapshot head and covers none of the
    thirteen paths above. This role has no shell and cannot compute a sha256
    (see runtime_split).
  who_must_fill_them: THE ORCHESTRATING SESSION, before or at the moment of the commit.
  binding_instruction_to_the_post_commit_verifier: >-
    A NULL HASH IS A FAILURE, NEVER A PASS. This is the rule
    DEC-20260823-51726e OBJ-14 established and it is restated here rather than
    inherited. CLAUDE.md binds archive receipts to CONTENT FIRST and treats
    commit reachability as advisory; an unfilled hash means the path is
    committed but NOT content-bound, and this archive is not durable evidence
    until every value above is a real digest recomputed over the committed blob
    and matching the tree. Do not interpret null as "not applicable". IF A HASH
    DOES NOT MATCH, THE ARCHIVE FAILS ON THAT PATH AND THE RECEIPT IS NOT TO BE
    EDITED TO AGREE WITH THE TREE.
  why_the_receipt_is_authored_with_nulls_rather_than_waiting: >-
    Because the alternative is worse. Three of the thirteen paths are CREATED BY
    this task and cannot be hashed before they exist; a receipt cannot contain
    its own hash any more than a commit can contain its own sha. THE PATH SET is
    what this role is responsible for, and it is fixed here, before the commit
    exists, which is the property an isolated archive commit actually needs. The
    digests are mechanical.

