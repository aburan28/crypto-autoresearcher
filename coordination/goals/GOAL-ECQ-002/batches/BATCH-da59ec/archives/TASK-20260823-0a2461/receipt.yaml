declared_set_expansion:
  dispatch_queue_artifact_paths_for_this_task: 4
  paths_bound_here: 13
  derivation_method: >-
    DERIVED, NOT HAND-LISTED, and the derivation is stated so it can be checked.
    (i) The three ledger records this task authors, which are three of its four
    declared artifact_paths. (ii) A read-only recursive enumeration of BOTH
    SOURCE TASKS' write_scopes -- the directories
    coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-72505a
    and .../TASK-20260823-eaf799 -- which contain exactly two files each and no
    subdirectories. (iii) The batch-level Coordinator documents, per the ruling
    below.
  independent_check_performed_by_this_role:
    what: >-
      Derivation is a claim, not a guarantee. This role enumerated both reviewer
      write_scopes with its own listing tool and compared the result against
      each reviewer's own declared artifact_paths in dispatch_queue.json and
      against the artifact_paths each reviewer restated in its own deliverable.
    result: >-
      AGREEMENT, EXACTLY AND WITH NO SURPLUS. TASK-20260823-72505a contains
      validation_report.md and verdict.yaml and nothing else;
      TASK-20260823-eaf799 contains redteam_report.md and objections.yaml and
      nothing else. Both match the queue's declared artifact_paths and both
      reviewers' own restatements. NO ANALYSIS DIRECTORY, NO CONTROLS SCRIPT AND
      NO UNDECLARED FILE EXISTS in either scope -- which is a difference from
      BATCH-f2341e, where analysis/redteam_controls.py was found outside the
      declared set and had to be added. THAT DIFFERENCE IS A REAL COST, NOT A
      TIDINESS WIN: this round's red team performed 141221 fibre evaluations and
      200000 permutation replicates and archived NO CODE, so its controls are
      not reproducible from any committed artifact. See
      unarchived_computation below.
    limits_of_this_check: >-
      NAME-LEVEL ONLY. It cannot see dotfiles or gitignored paths, it says
      nothing about whether any hash is correct, and it cannot determine
      tracked-versus-untracked status.
  ruling_on_batch_level_coordinator_documents:
    item: O-ORCH-DOCS-UNBOUND, raised by the snapshot receipt TASK-20260823-452f5f and referred to this archive to settle "once and for the campaign".
    ruling: >-
      SETTLED: BATCH-LEVEL COORDINATOR DOCUMENTS ARE CONTENT-BOUND, AND THE
      BINDING ARCHIVE IS THE BATCH'S LEDGER ARCHIVE. They cannot go into a
      producer snapshot -- they are not the producer's artifacts and binding
      them there is exactly the scope expansion an isolated snapshot forbids --
      and leaving them bound by commit reachability alone, which CLAUDE.md
      treats as ADVISORY, means a later edit to a document a blind reviewer read
      would fail no archive at all. Three of the four bound here were in both
      reviewers' declared read scope and two of them are load-bearing for this
      round's findings (the CORRECTION is cited by both reviewers; the
      multimetric check is the object the red team's J3 attacked).
    bound_here:
    - review_plan.yaml -- the Coordinator's priors, whose value depends entirely on their not having moved
    - CORRECTION-predeclared-target-values.md
    - COORDINATOR-multimetric-check.md
    - COORDINATOR-open-items-settled.md
    - orchestrator_path_sha256.json -- the file the snapshot receipt transcribed its 94 hashes from, and therefore load-bearing for the snapshot's own derivation claim
    deliberately_NOT_bound:
    - path: coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/dispatch_queue.json
      reason: >-
        THE DISPATCHER WRITES commit_sha AND parent_sha INTO ITS archive BLOCK
        AFTER THIS COMMIT. An archive that precedes those writes cannot
        content-bind the file: the hash would be guaranteed to mismatch, and a
        guaranteed-failing binding trains a verifier to ignore failures. Its
        integrity is protected by commit history instead, and this is recorded
        as a known limit rather than a preference.
    - path: coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/dispatch_plan.json
      reason: generated and gitignored (CLAUDE.md, "Generated artifacts are never committed"); rebuilt on demand.
    - path: coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/dispatch_plan.md
      reason: same.
    - path: ledger/goals/GOAL-ECQ-002/goal.yaml
      reason: >-
        NOT IN THIS TASK'S DECLARED ARTIFACT SET, so it is neither modified nor
        bound. It carries a stale next_action, a stale latest_verified_commit
        and an objective stating the K3 ceiling as 18/17. THE COMMITTED RECORD
        OF THE GOAL'S ONE NEXT ACTION AND OF THE CEILING CORRECTION IS
        DEC-20260823-839fc6 AND THE BATCH-da59ec CHECKPOINT. Reconciling
        goal.yaml is component (e) of the next action and its archive's declared
        path set must include it. Second consecutive batch owing this; charged
        to the Coordinator.
    - path: knowledge/findings/ and knowledge/INDEX.md
      reason: >-
        OUTSIDE THIS TASK'S write_scope, AND THAT IS A DEFECT RATHER THAN A
        DESIGN. DEC-20260823-839fc6 is `reject_scoped` on `replicated` evidence,
        which MANDATES a KN-FIND promotion in this same ledger archive. The
        promotion is therefore OWED AND BLOCKED, not declined; its content is
        pre-declared in full in the decision so it cannot drift, and it is
        component (f) of the next action. Fourth instance of the
        declared-set-assembled-by-hand defect.
  path_count: 13
  binding_order: >-
    CONTENT-FIRST. path_sha256 is the primary binding and commit reachability is
    advisory (CLAUDE.md, "Archive receipts bind to CONTENT first"). A content
    mismatch on any declared path is FATAL to this archive.
  note_on_already_committed_paths: >-
    TEN OF THE THIRTEEN PATHS ARE ALREADY COMMITTED AND UNCHANGED, so they will
    not appear in this commit's diff. THAT IS NOT A DEFECT AND MUST NOT BE READ
    AS ONE. Content-first binding means the verifier recomputes each declared
    hash against the TREE AT THE COMMIT, not against the commit's changed-file
    list. A verifier that requires every declared path to appear in the diff
    would reject every ledger archive this program makes, since a ledger archive
    exists precisely to bind artifacts produced earlier.

