    - id: P2
      prior: minimalisation strips a lot
      outcome: holds
      held_to: >-
        98.7 to 120.2 stripped in naive height, c4 34 -> 17-20 digits and c6 51 -> 25-30 digits.
        Reproduced independently at t = 0, 1, 2, 3, 703. Nowhere near enough: floor 109.5 against
        targets 69.3-85.2.
    - id: P3
      prior: certified rank >= 12 at small t
      outcome: contradicted_on_its_face
      recommended_action: DO NOT take the if_contradicted action (withdraw the family)
      held_to: >-
        Score at small t is 1 for (t=1, rank 14) and 2 against (t=0 rank 6, t=2 rank 11); t=62 is not
        small t. The producer's reason for setting the shortfalls aside is unsupported by its own data
        (F3). The correct reason is different and stronger. First, t = 0 was guaranteed in advance to
        drop: a1 = a3 = 0 and a4, a6 contain only EVEN powers of t, so t -> -t is an involution,
        MW tensor Q splits into eigenspaces, and a section in the anti-invariant part has y odd in t,
        so at t = 0 its y-coordinate vanishes and it specialises into E_0[2], contributing nothing to
        rank E_0(Q). The whole anti-invariant eigenspace dies at t = 0; measured 6 against generic ~12
        is exactly the 6 + 6 split that shape predicts. t = 0 is the one parameter in the box that
        should never have been used to test P3. Second, the generic rank is independently corroborated
        near 12 by the null-controlled -A_p measurement (H6). t = 2 short by one is an ordinary
        Silverman specialisation exception.
      note: >-
        Source retrieval remains blocking, but on the strength of F2, not of P3.

  coordinator_multimetric_check:
    status_of_file: unreviewed Coordinator analysis, not evidence; attacked as instructed
    arithmetic: reproduces
    detail: >-
      All twelve gaps in the table were recomputed from the frozen baseline and the producer's
      submission records and match. Two additions that STRENGTHEN it: all three frozen frontier
      metrics are monotone non-decreasing in the rank threshold, so comparing each curve at its own
      certified threshold is the maximally favourable comparison rather than an arbitrary one; and
      extending the sweep to EVERY (curve, threshold k <= certified rank, metric) triple still gives
      0 cells taken, with the five smallest gaps all on Faltings height (+2.571, +3.182, +3.457,
      +3.891, +3.952).
    conclusion_holds: >-
      YES, and over a strictly larger comparison set than the one tabulated: none of the four
      certified curves takes any frozen cell on any of the three frozen metrics at any threshold it
      qualifies for.
    scope_correction: >-
      "NO cell on ANY metric" is a claim about THREE metrics. frontier_20260823.json carries only
      min_naive_height, min_faltings_height and min_log_conductor; the file's own preamble names a
      fourth (discriminant), which is not in the frozen baseline and is unchecked. Faltings heights
      and conductors are the producer's PARI values, inherited and not recomputed by either the
      Coordinator or this validator, so two of the three metrics rest on one implementation.
    method_class_hypothesis: UNESTABLISHED, and weaker than the file's own caveat
    why_weaker: >-
      n = 2 is generous: the four NAGAO rows are four fibres of ONE surface, not four independent
      observations. The other arm of the claim - that the small-curve cells are held by direct search
      that cannot reach high rank - has NO measurement at all behind it, only an unreplicated free-text
      attribution, so that half is at n = 0 rather than n = 2. The selection confound is unnamed: both
      measured families were chosen BECAUSE their generic rank is published and exact, and explicitly
      written-down high-rank constructions are large for reasons unrelated to any intrinsic rank-size
      tradeoff. And on the only within-family data available, the prediction runs backwards: across the
      four fibres, certified ranks 6, 11, 12, 14 carry heights 124.4, 111.2, 109.5, 119.5 - the height
      is flat in rank, and the highest-rank fibres are not the largest. The missing decisive control is
      a LOW generic rank family of the same shape through the identical falsifier_height.py, and nobody
      has run it.

