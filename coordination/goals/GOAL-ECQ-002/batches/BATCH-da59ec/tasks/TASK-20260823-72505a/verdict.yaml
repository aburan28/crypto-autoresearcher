  what_failed_and_what_did_not: >-
    The MEASUREMENT is admissible and is confirmed independently and more strongly than the
    producer claimed: every one of the 1137 fibre heights was re-derived from the transcribed
    family with the validator's own Kraus minimalisation, with zero disagreements, and a
    further independent 7593-parameter sweep found nothing lower. What fails are four RECORDED
