    The remedy is supersession, not repair, and the height-budget result should be carried
    forward with the corrections in reasons_failed applied.

  reasons_failed:
    - id: F1
      severity: high
      claim_broken: "Shioda-Tate ceiling 18, ceiling over Q 17"
      where: BATCH-f2341e/tasks/TASK-20260823-d1cb76/candidate_families.json -> surface_degree_d;
        carried into this task's card. NOT restated in the producer's own deliverables.
      finding: >-
        18/17 is the generic elliptic-K3 bound 10d-2 and is not this surface's ceiling. Computed
        here from the transcribed model: deg Delta = 20 and Delta is squarefree (20 fibres of type
        I_1), while v_inf(Delta) = 4 with v_inf(a4) = 0, so the fibre at t = infinity is
        multiplicative of type I_4. Euler number 20 + 4 = 24, as a K3 requires. The trivial
        lattice therefore has rank 2 + 3 = 5, and Shioda-Tate gives
        rank MW(E/Qbar(t)) = rho - 5 <= 15, hence rank E(Q(t)) <= 15 as well.
      consequence: >-
        Axis A1's headroom on this base is 2 above the cited rank 13, not 4 or 5. Any plan that
        budgets against 17 budgets against a number this object does not have.
    - id: F2
      severity: high
      claim_broken: >-
        'batch_f2341e_verdict_overturned: true', and 'the transcription in
        candidate_families.json is SELF-CONSISTENT'
      where: nagao_height_budget.json -> step1_self_consistency; H-ECQ-a609f8 assumption 1;
        the Coordinator's handoff constraint to TASK-20260823-f88f54.
      finding: >-
        The point AS TRANSCRIBED, ((t+703)/15, N(t)/75), does NOT lie on the transcribed quartic.
        Only the RESCALED point ((t+703)/15, 1248*N(t)/75) does. BATCH-f2341e tested the retrieved
        pair and its FAILS verdict is correct about that pair; it was a true negative, not a false
        one, and it has not been overturned. What is established is that the quartic and N(t) come
        from one object up to a single unsourced rational scaling of y whose square root is 1248.
        The 1248 was supplied to the producer in the Coordinator's handoff, so the producer's check
        is confirmatory, not an independent derivation of it.
      not_broken: >-
        The identity itself reproduces digit-for-digit at all seven coefficients with constant ratio
        1557504 = 1248^2, verified against an independent hand transcription with independent
        polynomial arithmetic. Two further coherence facts found here point the same way:
        4*lead(a4)^3 + 27*lead(a6)^2 = 0 exactly, and the fibre bookkeeping closes at Euler number 24.
    - id: F3
      severity: medium
      claim_broken: "t = 0 and t = 2 fall short of 12 ... a shortfall is a SEARCH outcome, never a
        statement that the rank is below 12"
      where: report.md section 5
      finding: >-
        Contradicted by the batch's own artifact. step5b_rank_probe.json records
        pari_search_r_low == pari_search_r_high and timed_out = false at all four parameters, so the
        rank is DETERMINED at 6 (t=0), 14 (t=1), 11 (t=2) and 12 (t=62). There was no timeout to
        attribute the result to. The Coordinator's handoff constraint forbids REPORTING an upper
        bound as a rank, which is right, but it does not license describing a measured matched
        upper bound as an unfinished search; the bound should have been disclosed with its caveat
        that PARI's 2-descent bound may rest on GRH-conditional class-group data.
    - id: F4
      severity: low
      claim_broken: "peak RSS well under 1 GB"
      where: report.md header
      finding: >-
        runs/RUN-ECQNAG-f88f54-009/manifest.yaml records max_rss_kb 3651036 = 3.48 GiB. The declared
        budget was 4 GB, so there is no budget breach, but the report's resource line is off by a
        factor of 3.5 against its own run record.

  findings_that_hold:
    - id: H1
      finding: "All 94 declared paths verify at the snapshot sha: 94 recomputed sha256, 94 match,
        0 mismatch, 0 missing."
    - id: H2
      finding: >-
        Reproducibility pointer EXERCISED, not asserted. Both deliverables were rebuilt from scratch
        from a git archive export of the task tree and reproduced their declared sha256 exactly
        (563299c8... and fd683d58...), and both re-runs reproduced the corresponding run's stdout.log
        byte for byte.
    - id: H3
      finding: >-
        The height measurement reproduces exactly and independently. Enumeration verified as SETS
        (457 and 801, union 1137, overlap 121); own least squares gives a = 135.975835,
        b = 0.387490, R^2 = 0.00041752, identical to the record; min/median/max identical. Every one
        of the 1137 fibre heights was re-derived from the transcribed family with the validator's own
        Kraus minimalisation, no PARI and no producer code: ZERO disagreements above 1e-9.
        Independent minimum 109.5051651866501 at t = +-62, minimality of that model proved
        exhaustively.
    - id: H4
      finding: >-
        All three admissible boxes are EMPTY, under the pre-declared values (gaps +40.166384 /
        +33.745431 / +24.315907) AND under the frozen baseline values (+40.166324 / +33.744903 /
        +24.315907). A further independent sweep of 7593 parameters found 0 below any target, and
        showed the lower envelope has an interior minimum near H(t) = 62 and RISES beyond
        H(t) = 100 rather than merely flattening.
    - id: H5
      finding: >-
        All four certified rank lower bounds re-derived with an independent certifier (own group law,
        own E(F_p) counting, own mod-l independence argument): 6, 14, 11, 12, every point exactly on
        its curve, and every curve verified Q-isomorphic to the NAGAO fibre at that t with an
        explicit u^2. All 12 non-zero coefficients of a4 and a6 are identical to the producer's, and
        d = 2 / elliptic K3 is confirmed unconditionally given the transcription.
    - id: H6
      finding: >-
        NEW null-controlled evidence that the transcribed family's generic rank really is near 12.
        Under Rosen-Silverman with Tate's conjecture - known for elliptic K3 surfaces over Q, which
        F1's computation establishes this surface to be - the diagnostic -A_p gives 11.50, 11.99,
        12.88 at p = 2003, 4001, 6007, while five same-shape random quartic families pushed through
        the identical pipeline give a mean of 0.073 and stay at 0 for the same primes. The quantity
        concentrates as p grows, which is what it should do. This is internal evidence about the
        transcribed object's rank; it is NOT evidence that the object is Nagao's published equation.

  named_check_RUN_011_012:
    question: routed by COORDINATOR-open-items-settled.md, item O-RUN-011-012-EQUAL
    answer: "(a)"
    determinate: true
    agents_md_rule_2_engaged: false
    finding: >-
      The 1258 defect never reached raw-result.json, so the stated supersession reason does not
      describe what differs between the two runs. The diff between step6b_deliverables.py and
      step6c_deliverables.py is two hunks and both are inside cell_reachability.json's 'scope' and
      'summary' strings; nagao_height_budget.json is untouched, and 1137 is len(all_rows) in BOTH
      scripts rather than a hard-coded value, so the budget file was always correct. The run wrapper
      copies the DECLARED raw-result path - nagao_height_budget.json - into raw-result.json, which is
      why the two runs share a sha256 while genuinely differing. The records are NOT identical: the
      preserved stdout.log of RUN-011 says "over 1258 fibres" and RUN-012 says "over 1137 distinct
      fibres", so the defect is visible in RUN-011's own record. Confirmed by re-execution from a
      clean export: step6b reproduced sha 563299c8... and RUN-011's stdout.log byte for byte;
      step6c reproduced both declared deliverable hashes and RUN-012's stdout.log byte for byte.
    owed: >-
      A one-line correction to report.md section 9.4 stating that RUN-011's defect was confined to
      two descriptive strings in cell_reachability.json and never entered a computed quantity.
    separate_integrity_point: >-
      All twelve manifests carry status completed_valid, including RUN-008 (called an
      implementation_error in the report) and RUN-010/-011 (called superseded). The harness derives
      status from the exit code and cannot mark a run invalid afterwards without editing an immutable
      manifest, so the producer recorded invalidity in prose. Correct under rule 2, but a reader of
      RUN-008's manifest alone would take an implementation error for a valid measurement. The run
      schema needs a superseded_by field, or the task scope needs a supersessions record.

  recorded_priors:
    - id: P1
      prior: all three admissible boxes empty
      outcome: not_contradicted
      held_to: >-
        The agreeable direction was given the scrutiny the disagreeable one would have got. (a, b, R^2)
