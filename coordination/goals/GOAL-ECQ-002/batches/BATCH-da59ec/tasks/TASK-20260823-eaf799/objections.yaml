  claim_under_review: >-
    That BATCH-da59ec's re-aim from the r>=15 ICARM cell to the r>=12/13/14 cells is a sound
    target choice; that the measured emptiness of NAGAO-1994's admissible box at all three cells
    supports the Coordinator's hypothesis that high rank and small size are served by different
    method classes and that GOAL-ECQ-002's A2 premise is wrong at the root; that NAGAO-1994 is
    unrepresented on the frozen board; and that nothing produced in this batch satisfies C1'.

  # ---------------------------------------------------------------- objections
  objections:

  - id: RT-J3-O1
    joint: J3
    severity: high
    target: COORDINATOR-multimetric-check.md, method-class hypothesis (premise)
    claim_attacked: >-
      "the small-curve cells appear to be held by direct search over small curves, which buys size
      cheaply and cannot reach high rank."
    objection: >-
      FACTUALLY REFUTED by the primary source the board's own commentary cites for all three
      incumbents. Elkies' JMM 2023 slides state the opposite in the author's words: "We could not
      approach r = 11 by searching all E up to height H: too many such (~ H^{4+6} = H^10)." The
      method is an algebraic parametrisation of the moduli space M_{1,k+1} of genus-1 curves with
      k+1 marked points (weighted projective models for k <= 4, Grassmannian of lines in P^4 for
      k = 5), reducing the count from H^10 to H^{10-k}, followed by an approximate Mestre-Nagao
      product to select candidates and ellratpoints to certify. Both sides of the claimed
      dichotomy are algebraic construction plus parameter search; the dichotomy does not exist.
      Two secondary consequences: (a) the incumbent that holds all three pre-declared cells runs
      ON Mestre-Nagao scoring, the heuristic H-ECQ-a609f8 demotes as unvalidated; (b) the
      identification is exact, not inferred - the slide's r=12 row (N = 26145292874820119408329144,
      a4 = -932733487) equals board #88 digit for digit, and r=13 equals board #89.
    evidence:
      - retrieved https://abel.math.harvard.edu/~elkies/Elkies_JMM23.pdf (HTTP 200, 126560 bytes),
        text extracted from its FlateDecode streams
      - icarm_database_20260823.json curves 88, 89, 157, 158, 244 (commentary + ainvs + conductor)
    provenance_of_citation: retrieved
    disposition: >-
      The method-class hypothesis must not be carried into any evidence or decision record in the
      form written. A defensible restatement exists and is different: Elkies parametrises
      (E, P_1..P_k) so smallness is built in and rank emerges; Mestre/Nagao parametrise a rank-r
      family over Q(t) so rank is built in and size emerges. That version is supportable; the one
      on file is not.
    what_would_settle_it: already settled by source retrieval.

  - id: RT-J3-O2
    joint: J3
    severity: high
    target: COORDINATOR-multimetric-check.md; H-ECQ-a609f8 supersedes_reason (inherited from BATCH-f2341e)
    claim_attacked: >-
      The per-rank Mestre-specialisation minima 206.81(12) 136.69(13) 134.43(14), used to argue
      that the specialisation class is 49-137 log units away from the small-curve cells.
    objection: >-
      CLASSIFIER ARTIFACT, and the artifact is localised to exactly the two ranks where the
      conclusion is drawn. The numbers come from an unvalidated free-text classifier over board
      commentary with no ground truth. Board #1 (r=12, h=79.329) reads "Found by Mestre (1982).
      A historical rank >= 12 record, via Dujella's ... tables" and #3 (r=14, h=96.986) reads
      "Found by Mestre (1986)." A classifier keyed on the board's SOURCING ("via Dujella") files
      these outside the construction class; a classifier keyed on the METHOD ("Found by Mestre")
      files them inside it. The Coordinator's hypothesis is about METHOD classes, so the second is
      the classifier that answers its question. Under it the construction-class minima become
      79.329(12), 136.687(13), 96.986(14) - deltas of 127.48 and 37.44 - and the gaps to the cells
      become +9.99 and +11.80 rather than +137.47 and +49.24. Ranks 13 and 15-20 are unchanged.
      "No amount of work on the specialisation axis takes those cells" is contradicted by the
      board's own data at a distance of ten log units.
    evidence:
      - my classification of all 289 frozen curves under two classifiers V1 (sourcing) and V2 (method)
      - icarm_database_20260823.json curves 1, 3, 157, 158, 244, 200
      - >-
        permutation null, within-rank label shuffle at ranks exactly 12/13/14, N = 200000 --
        summed gap 247.64 (V1) vs 82.71 (V2); p < 1e-5 both; P(Elkies holds all three minima
        under the null) = 0.0031
    provenance_of_citation: >-
      internal for the classification; the reading of #1/#3 as construction-class rests on the
      board attribution plus my own recollection of Mestre's method and is marked RECALLED - I
      have not read Mestre 1982/1986. The finding does not depend on which classifier is right,
      only on the demonstrated fact that the choice is underdetermined and flips the magnitude.
    disposition: >-
      Any record citing per-class per-rank minima must state its classifier and its sensitivity.
      RT-J3-O1 refutes the same hypothesis independently from a retrieved source, so this
      objection is corroborating rather than load-bearing.
    what_would_settle_it: >-
      Read Mestre 1982 (rank >= 12) and Mestre 1986 (rank >= 14) and record whether those curves
      were produced by his construction. Cheap; one retrieval each.

  - id: RT-J3-O3
    joint: J3
    severity: high
    target: H-ECQ-a609f8 target_cells_predeclared; goal.yaml AXIS A2 rationale
    claim_attacked: >-
      That re-aiming from r>=15 to r>=12/13/14 corrects the previous batch's target error.
    objection: >-
      THE RE-AIM MOVED TO STRICTLY HARDER TARGETS AND CONFLATED TWO NOTIONS OF "SOFT". Frontier
      steps from the frozen file: r11->12 +7.832, 12->13 +6.421, 13->14 +9.429, 14->15 +33.581,
      15->16 +6.563. r>=15 is the largest step below rank 17 - the single most anomalous cell in
      the range, i.e. the softest on the criterion the goal record itself uses. The three new
      targets are on-trend AND lower in absolute naive height by 33.6 to 49.4, hence harder for
      any method. BATCH-f2341e's red team showed r>=15 was hard FOR THE MESTRE METHOD CLASS; the
      goal record's "soft" is about the FRONTIER'S SHAPE. The re-aim fixed the first and destroyed
      the second, and no record in this batch notices the trade.
    evidence:
      - frontier_20260823.json frontier_by_rank_threshold, steps computed by me
      - goal.yaml objective ("jumps 85.19 -> 118.77 ... against steps of 9.4 and 6.6 on either
        side") - both figures verify exactly, 9.429 and 6.563
    disposition: >-
      The next hypothesis must state which notion of "soft" its target selection uses and defend
      the choice against the other.
    what_would_settle_it: not a matter of further measurement; it is a stated-criterion defect.

  - id: RT-J3-O4
    joint: J3
    severity: medium
    target: BATCH-f2341e red team, inherited by this batch's context
    claim_attacked: >-
      "#244 is the only rank-14 output of the Elkies JMM23 program, which stops at 14."
    objection: >-
      HALF RIGHT, AND THE WRONG HALF IS LOAD-BEARING. On the frozen snapshot #244 IS the only
      rank-14 output - confirmed; the lineage is exactly five curves (#88 r12, #157 r12, #89 r13,
      #158 r13, #244 r14). But "stops at 14" is a property of the SNAPSHOT, not of the method - a
      count of what a program has published so far, which docs/inventor-protocol.md section 4
      classifies as a fatigue report rather than a statement about the object. Three pieces of
      evidence against it: the retrieved Jan-2023 slides list candidates for r = 12 and r = 13
      ONLY, so #244 (created 2026-07-06) is a rank the program gained INSIDE the window the board
      covers; #157/#158 (2026-06-24) beat #88/#89 (2026-06-11) at the same ranks two weeks later;
      and Elkies' closing slide lists as still to be done "Massive runs, extensive statistics."
      The three pre-declared cells are therefore the current output frontier of a LIVE, ADVANCING
      program that improved twice in two months - the worst available choice against the
      live-board risk C1' explicitly cares about.
    evidence:
      - icarm_database_20260823.json created_at fields for 88, 89, 157, 158, 244
      - retrieved Elkies_JMM23.pdf slide 8 and slide 13
    provenance_of_citation: retrieved
    disposition: >-
      Record that these cells carry elevated third-party movement risk, and that a "program stops
      at rank k" statement needs an argument, not a snapshot count.
    what_would_settle_it: re-read the live board before any submission, as C1' already requires.

  - id: RT-J3-O5
    joint: J3
    severity: high
    target: H-ECQ-a609f8 mechanism; nagao_height_budget.json height_fit_measured
    claim_attacked: >-
      "the height grows only LOGARITHMICALLY in the parameter (h ~ a + b log H(t)), so the binding
      constraint is the family's own (a, b)"; reported (a, b) = (135.9758, 0.3875), R^2 = 0.000418.
    objection: >-
      WRONG FUNCTIONAL FORM; THE REPORTED b IS AN ARTIFACT OF WHERE THE BOX WAS PLACED. The true
      law is piecewise. I measured both arms on my own code path: h = 119.42 + 0.062 log|t|
      (R^2 = 0.00005, n = 40) for small |t|, and h = 11.32 + 24.14 log|t| (R^2 = 0.891, n = 77,
      t = 1000..20000) for large |t|, crossing at |t| ~ 89, with the observed argmin at |t| = 62.
      The producer fitted ONE line across a V whose vertex lies at the edge of its own box,
      entirely inside the flat arm. R^2 ~ 0.0004 is not "the parameter explains none of the
      variation"; it is the signature of the wrong model. The asymptotic slope is forced:
      deg(a4, a6) = (8, 12) means d = 2 and h(E_t) = 12d log|t| + O(1) = 24 log|t| + O(1), against
      a measured 24.14. Combined with the Shioda-Tate cap rank <= 10d - 2, generic rank r forces
      slope >= 1.2(r + 2). The batch's CONCLUSION does not use the fit (the producer says so
      explicitly and is right), but the HYPOTHESIS'S MECHANISM does, and it is carried forward as
      "surviving unfalsified".
    evidence:
      - my fits over integer t in [1,40] and [1000,20000], 141221 total fibre evaluations
      - step2_weierstrass.json weierstrass_over_Qt (deg a4 = 8, deg a6 = 12)
      - nagao_height_budget.json height_fit_measured
    disposition: >-
      The mechanism statement in any superseding hypothesis must be replaced by the piecewise law
      and the 12d slope bound. This is a correction that STRENGTHENS the program: it is a derived
      obstruction requiring no free-text program attribution.
    what_would_settle_it: already measured.

  - id: RT-J4-O1
    joint: J4
    severity: low
    target: H-ECQ-a609f8 mechanism
    claim_attacked: >-
      "Nagao is not visibly represented [on the board], so the (a, b) it carries is unmeasured by
      the incumbents rather than already optimised by them."
    objection: >-
      LOOSELY STATED AND THE INFERENCE IS WEAK. Board #74 (r >= 21, h = 255.693) is a Nagao curve:
      "Provenance: Nagao-Kouya (1994), 'An example of elliptic curve over Q with rank >= 21,' as
      reproduced in Nagao, 'Construction of high-rank elliptic curves.'" So Nagao IS represented,
      as a source of a curve. Separately, "Nagao" appears throughout the board as a SIEVE
      ("Mestre-Nagao stage sieve", "native M = 6000 Nagao rescore", "Nagao-Mestre prime-sum
      sieve") and, per RT-J3-O1, inside the incumbent Elkies pipeline. The claim is true in the
      only sense that matters - no board curve is a specialisation of Nagao's rank-12 Q(t) family
      - but the inference drawn from it ("unused, therefore an unexploited lever") is the
      nobody-tried-it inference, and the opposite reading (Mestre/Fermigier have been tuned for
      forty years and Nagao's has not been because it is worse) is equally consistent with the
      same fact. The measurement has now settled it in the second direction: 109.505 versus
      Mestre's own 79.329 at rank 12.
    evidence:
      - icarm_database_20260823.json curve 74; commentary of curves 275, 243, 159, 205, 200, 196
    disposition: correct the wording in any superseding record; the conclusion is unaffected.
    what_would_settle_it: n/a - a phrasing and inference defect, now measured against.

  - id: RT-J4-O2
    joint: J4
    severity: high
    target: coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json (preregistered baseline)
    claim_attacked: >-
      COORDINATOR-multimetric-check.md: "the ICARM board keeps a record per (rank threshold x
      METRIC) - naive height, Faltings height, log conductor, discriminant ... Result: every
      metric, every certified curve, NONE taken."
    objection: >-
      THE FROZEN BASELINE HAS NO DISCRIMINANT CELL, SO THE CHECK COVERED THREE OF THE FOUR METRICS
      IT NAMES. frontier_20260823.json carries only min_naive_height, min_faltings_height,
      min_log_conductor. The board plainly scores log|D|: #276's own commentary reads "Rank-15
      records in naive height, log|D| and Faltings: ... log|D| = 108.6915 (beats 110.5171)". Under
      C1' a claim must be measured against the FROZEN frontier; a discriminant-cell claim is
      therefore currently UNJUDGEABLE against it - exactly the failure mode
      preregistered_baseline.why exists to prevent. Nothing hangs on it this round; it would hang
      on it the moment a curve got close.
    evidence:
      - frontier_20260823.json (three metrics only)
      - icarm_database_20260823.json curve 276 commentary; discriminant field present on all 289
    disposition: >-
      REPAIRABLE FROM THE AUTHORITATIVE SNAPSHOT, and I repaired it - see required_controls
      RT-C-D. Derived cells: r>=12 -> 61.2909 (#157), r>=13 -> 65.8371 (#158), r>=14 -> 77.1267
      (#244), r>=15 -> 108.6915 (#276), validated against the board's own commentary to 4 dp.
      A superseding baseline record should carry these and record the snapshot sha256 it derived
      them from.
    what_would_settle_it: done; needs only to be written into a superseding record.

  - id: RT-CORR-O1
    joint: cross-cutting (Coordinator asked this be checked)
    severity: medium
    target: CORRECTION-predeclared-target-values.md
    claim_attacked: >-
      "It changes no conclusion ... The pre-declared (frozen) values were used as the gate, which
      for r >= 12 and r >= 13 is the stricter of the two."
    objection: >-
      THE CONCLUSION-INVARIANCE CLAIM IS CORRECT AND I VERIFIED IT (gaps 24.3-40.2 against
      transcription errors of 6.0e-5 and 5.3e-4). THE REASONING OFFERED FOR IT IS BACKWARDS.
      "Stricter" is conservative for a CLAIM ("we took the cell"). The operative test this round
      is a FALSIFICATION: clause 1 of H-ECQ-a609f8 declares the hypothesis falsified if the box is
      empty, and a LOWER target makes the box MORE likely empty. The stricter gate is therefore
      anti-conservative for the test actually run, and it biases toward the Coordinator's own
      recorded prior P1. It does not matter at a gap of 24-40. It would matter at 0.001, and "it
      changes no conclusion here" is precisely the sentence the correction itself argues is not
      good enough.
    evidence:
      - H-ECQ-a609f8 falsification clause 1
      - cell_reachability.json (gate values used) and CORRECTION document's own table
    disposition: >-
      Record the direction-of-bias analysis alongside the correction. The disposition ("the
      baseline wins", derive future targets by computation, record the sha256) stands and is right.
    what_would_settle_it: n/a - a reasoning defect, not a numerical one.

  - id: RT-CORR-O2
    joint: cross-cutting (the Coordinator asked what ELSE was transcribed rather than derived)
    severity: medium
    target: BATCH-f2341e candidate_families.json NAGAO-1994.weierstrass_coefficients_in_t;
      TASK-20260823-f88f54 report.md section 1; H-ECQ-a609f8 assumption 1
    claim_attacked: >-
      "The point ((t+703)/15, 1248*N(t)/75) lies exactly on the transcribed quartic ... the
      BATCH-f2341e verdict ('FAILS') was a false negative, caused by testing the section with
      y = N/75 instead of y = 1248*N/75."
    objection: >-
      STILL WRONG IN THE COMMITTED RECORD, AND THE DIAGNOSIS IS INVERTED. Every one of the
      thirteen distinct integer coefficients of the transcribed quartic is EXACTLY divisible by
      1557504 = 1248^2 (14017536/S = 9; 28035072/S = 18; 4205260800/S = 2700; 247954636800/S =
      159200; 330112972800/S = 211950; 617005209600/S = 396150; 46063725926400/S = 29575350;
      99527168931840/S = 63901710; 1388825681338368/S = 891699592; 10445363957523456/S =
      6706476489; 443009190070886400/S = 284435346600; 6473450277365760000/S = 4156297690000).
      So the transcription equals 1557504 * Q0 for an integral Q0, and the PUBLISHED section
      ((t+703)/15, N(t)/75) lies on y^2 = Q0 exactly, unmodified. BATCH-f2341e's "FAILS" was a
      CORRECT verdict on a quartic that is not the published equation; the repair is to divide the
      equation by 1248^2, not to multiply the point by 1248. Numerically harmless - 1248^2 is a
      square, so y -> 1248y is a Q-isomorphism and every minimal model, height, rank, conductor
      and discriminant is unchanged (independently confirmed by RT-C-A, which reproduces every
      reported height to 1e-10 from the SCALED quartic). But the record now asserts
      self-consistency where the stronger and more useful statement is available: THE
      TRANSCRIPTION IS PROVABLY NOT THE PUBLISHED EQUATION. This is a direct instance of the
      correction's own stated root cause, "DERIVE, DO NOT TRANSCRIBE", still live.
    evidence:
      - candidate_families.json families[1].weierstrass_coefficients_in_t (all 13 coefficients)
      - my divisibility check, exact integer arithmetic
      - RT-C-A height re-derivation
    disposition: >-
      A superseding record should state the 1248^2 scaling explicitly, state that it is a square
      and therefore height/rank-neutral, and re-scope "source retrieval remains owed" accordingly.
    what_would_settle_it: >-
      OCR of the Project Euclid scan of Nagao 1994, or a clean pdftotext extraction of
      arXiv:math/9709235 equation (1), compared against Q0 rather than against the scaled quartic.

  - id: RT-P1-O1
    joint: cross-cutting (measurement design, per the task card's explicit instruction)
    severity: medium
    target: TASK-20260823-f88f54 report.md headline; cell_reachability.json deciding_number strings
    claim_attacked: >-
      "Zero of 1137 distinct measured fibres has naive height below any of the three targets";
      "measured minimum naive height 109.505165 over 1137 distinct fibres".
    objection: >-
      1137 IS THE PARAMETER COUNT; THE FIBRE COUNT IS 569. a4 and a6 contain ONLY EVEN POWERS OF t
      (a4: 8,6,4,2,0; a6: 12,10,8,6,4,2,0), so E_t and E_{-t} are the SAME Weierstrass equation.
      Verified empirically with zero exceptions: the 1137 union parameters yield exactly 569
      distinct naive heights and 569 distinct (naive, Faltings) pairs, and every +-t pair agrees
      to 12 decimals. The JSON key n_distinct_parameters_measured is correctly named; the three
      deciding_number strings and report.md both say "distinct FIBRES". The reported search volume
      is overstated by exactly 2x. This is the same class of error as the 1258 -> 1137 fix the
      batch already made, and the corrected run did not catch it. Conclusion unaffected (0 of 569
      is still 0), but falsification clause 3 requires a bounded-search negative to be reported
      WITH THE VOLUME COVERED, and the volume covered is half what is reported. Arithmetic of the
      union itself is right: 457 + 801 - 121 = 1137, and I reproduce 1137 distinct parameter
      strings exactly.
    evidence:
      - step2_weierstrass.json weierstrass_over_Qt a4, a6
      - falsifier_height_004.json and falsifier_height_probe_wide.json rows, de-duplicated by me
    disposition: correct the volume in the evidence record; no conclusion moves.
    what_would_settle_it: done.

  - id: RT-P1-O2
    joint: cross-cutting (box choice, per the task card's explicit instruction)
    severity: informational_resolved
    target: TASK-20260823-f88f54 declared box
    claim_attacked: >-
      That the declared box (|num t| <= 60, den <= 6) plus the integer-only wide probe (|t| <= 400)
      is sufficient support for "this family cannot reach these cells at any parameter".
    objection: >-
      THE MEASURED MINIMUM SITS AT |t| = 62 - ON THE SEAM between the two probes. The declared box
      reaches |t| <= 60; the wide probe is den = 1 only. The region 60 < |t| at denominator > 1 -
      exactly where the minimum lives, and exactly the region the board's own incumbents mine
      ("wide-denominator vectorized sieve", fibres at T = 10239/176, 3251/8, 2229/16, 1459/4) -
      was NEVER measured. That is the cheapest available route to overturning an empty box and it
      was not taken. I TOOK IT: 141221 fibres (integers 1..20000; all rationals 30 <= t <= 140
      with denominator <= 60; all rationals 40 <= t <= 200 with denominator <= 12), 248x the
      producer's 569 distinct fibres, on an independent code path. GLOBAL MINIMUM STILL EXACTLY
      109.505165 AT t = +-62, second lowest 109.531002, nothing below. Denominator monotonically
      HURTS (per-denominator minima 109.51, 117.79, 135.84, 134.43, 148.10, 144.16, 156.18,
      151.07, 162.21, 156.42, 167.03, 160.80). THE OBJECTION IS RAISED AND ANSWERED IN THE SAME
      BREATH: the box was, by luck or judgement, placed on the true minimum, and the empty-box
      result is far more robust than the batch was able to claim.
    evidence: my controls RT-C-B and RT-C-C
    disposition: >-
      Upgrade the narrowest supported statement to the 141221-fibre envelope. The producer's
      conclusion is not weakened; its support is enlarged 248-fold.
    what_would_settle_it: answered.

  # ---------------------------------------------------------- required controls
  required_controls:

  - id: RT-C-A
    name: blind re-derivation of the load-bearing quantity
    status: RUN BY ME
    method: >-
      committed candidate_families.json quartic -> PARI ellfromeqn -> ellminimalmodel -> c4, c6 ->
      h = log max(|c4|^3, c6^2). Imports nothing from TASK-20260823-f88f54 and never uses its I/J
      Weierstrass model.
    result: >-
      AGREES TO 1e-10 on ten fibres (t = 0, 1, 2, 3, +-58, +-62, -50, 703), including the headline
      109.5051651867 and the fit inputs 124.3997067790, 119.5342918572, 111.2170207052.
    verdict: the producer's height measurement is correct.

  - id: RT-C-B
    name: the uncovered crossover band at non-unit denominator
    status: RUN BY ME
    method: 40 <= t <= 200, every denominator <= 12, gcd = 1; 7361 fibres.
    result: nothing below 109.505165; denominator monotonically increases the height.
    verdict: the region the producer's box excluded is barren.

  - id: RT-C-C
    name: volume attack (248x the producer's distinct-fibre count)
    status: RUN BY ME
    method: integers 1..20000 (20000 fibres) + rationals 30 <= t <= 140, denominator <= 60 (121221).
    result: global minimum still exactly 109.505165 at t = +-62. Lower envelope does not descend.
    verdict: the empty box is real and much better supported than reported.

  - id: RT-C-D
    name: the fourth metric the frozen baseline omits
    status: RUN BY ME
    method: >-
      derive min log|Delta| per rank threshold from the frozen icarm_database_20260823.json, and
      compute log|Delta| for the four certified Nagao curves from their minimal a-invariants.
    result: >-
      Derivation validated against the board's own commentary (#276 states log|D| = 108.6915;
      I compute 108.6915). Cells r>=12/13/14 = 61.2909 / 65.8371 / 77.1267. Nagao gaps +27.83
      (t=1, r>=14) to +87.21 (t=0, r>=6). NO CELL TAKEN ON THE FOURTH METRIC EITHER.
    verdict: the Coordinator's "NONE taken" conclusion survives the metric it did not check.

  - id: RT-C-E
    name: null-object control for the program-conditioned signal
    status: RUN BY ME
    method: >-
      within-rank permutation of program labels at ranks exactly 12/13/14, N = 200000 replicates,
      under both classifiers.
    result: >-
      Signal is real - P(Elkies lineage holds the minimum at all three ranks under the null) =
      0.0031; p < 1e-5 on the summed gap under both classifiers. Magnitude is not robust: summed
      gap 247.64 (V1) vs 82.71 (V2).
    verdict: >-
      A controlled finding for the DESCRIPTIVE claim; not a controlled finding for the MAGNITUDE,
      which is the only part the Coordinator's inference uses.

  - id: RT-C-F
    name: source retrieval of the load-bearing recalled citation
    status: RUN BY ME
    method: fetch and text-extract the URL the board's own commentary cites for all three incumbents.
    result: premise of the method-class hypothesis refuted; see RT-J3-O1.
    verdict: converts the campaign's central attribution from inference to a retrieved source.

  - id: RT-C-G
    name: decay test (what the reported quantity should have done)
    status: RUN BY ME
    method: >-
      name the parameter meant to destroy the empty box (search volume) and state what the
      measurement should look like as it increases.
    result: >-
