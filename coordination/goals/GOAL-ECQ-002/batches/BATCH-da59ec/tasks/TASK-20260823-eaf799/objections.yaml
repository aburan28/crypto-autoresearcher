    nearest object where its conclusion is false: board #1 (Mestre 1982, rank 12, h = 79.329). The
    argument still goes through - it classifies #1 out of the construction class on the strength of
    the words "via Dujella" - and that is where the survival happens. An argument whose conclusion
    is decided by which clause of a free-text sentence the classifier keys on is not an argument
    about method classes.
  - >-
    OBSERVATION-FIBER ATTACK. Hold "program label from commentary" fixed and vary the underlying
    object: #1 and #205 are both rank-12 Mestre-construction curves at h = 79.329 and 206.812, and
    the commentary places them on opposite sides of the conclusion. The missing separator is a
