red_team_report:
  id: RT-20260823-eaf799
  task_id: TASK-20260823-eaf799
  batch_id: BATCH-da59ec
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-a609f8
  joints_owned: [J3, J4]
  verdicts:
