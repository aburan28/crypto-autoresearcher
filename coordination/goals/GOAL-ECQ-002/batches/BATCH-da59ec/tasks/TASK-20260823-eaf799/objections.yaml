  proof_architecture_challenges:
  - >-
    METHOD-CEILING ATTACK. Applied to the specialisation lever and it produces the derived
    obstruction of RT-J3-O5: for an elliptic surface of degree d, h(E_t) = 12d log|t| + O(1), and
    generic rank r forces d >= ceil((r+2)/10), hence slope >= 1.2(r+2). Buying generic rank at
    least doubles the growth rate of fibre height in the Weil height of the parameter, so the
    usable fibres are confined to a bounded region of small-height parameters - which is exactly
    what RT-C-C measured. The ceiling does not forbid reaching the cells; it forbids the
    SMALL-PARAMETER LEVER from being what reaches them.
  - >-
