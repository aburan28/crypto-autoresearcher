audit:
  id: AUDIT-CERTBIN-4d3853-20261002
  hypothesis_id: H-CERTBIN-4d3853
  experiment_id: EXP-CERTBIN-1bfef5
  source_idea: IDEA-20260926-917981
  recorded_at: '2026-10-02'
  recorded_by: coordinator
  zero_runs: true

  bottleneck: >-
    Whether any representation-level choice other than the set V can move
    a closure outcome (Proposition B says no), and whether W_4 sees the
    set at all on structured V (measured on three V-sets at 144 RC-1
    targets). Decidable by arm-(a) identity regression + structured-set
    rates; SAT engines and n=131 cost out of scope.

  baseline_embedding:
    parameter_slice: >-
      Incumbent = RC-1 cell itself (polynomial V, archived M_4/W_4 labels
      of RUN-CERTBIN-c417e0 on 144 targets). Arm (a) is the exact
      reproduction under a coordinate change.
    reproduction_check: >-
      Arm (a) must reproduce every archived label, iteration count and
      dimension exactly (288/288). Any disagreement after instrument
      regression is the headline (instrument defect or Proposition B
      counterexample).
    status: declared_in_contract

  observation_collision:
    observable: >-
      The triple (M_4 label, W_4 label, first iteration containing 1) per
      target per V-set.
    distinct_preimage_search: >-
      Two V-sets with equal kappa but different tensors could give
      different rates; polynomial V and stable V both have kappa=17 at
      l=9,n=17, so a rate difference exhibits the finer tensor invariant
      as the object.
    status: declared_in_contract

  quantifier_order: >-
    Propositions B and F: FORALL n, V, x_R, D, FORALL bases (and for F,
    FORALL Frobenius-stable V): exact equalities. Empirical E-SET/E-POLY:
    FOR the 144 archived targets and the three named V-sets. NOT CLAIMED:
    SAT engines, n=19/131 cost, ECC2K-130 break.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      Closure outcomes are basis-invariant (proved); on the RC-1 targets
      the W_4 rate is r_poly, r_norm, r_stab and the M_4 rate is as
      measured per set; on the stable set one certificate per Frobenius
      orbit transfers and verifies 17-fold. Never certifies cost or a
      break at n=131; never claims basis-invariance for SAT/DPLL.
    nearby_object_control: >-
      Arm (a) identity; S62 satisfiable per set; arm (d) random V shape
      null; n=19 documentation that no stable V exists; saturation
      pre-data; separate-process certificate verification including
      transfers; memory-beside-time.
    status: declared_in_contract

  proof_obligations_count: 6
  audits_applicable:
