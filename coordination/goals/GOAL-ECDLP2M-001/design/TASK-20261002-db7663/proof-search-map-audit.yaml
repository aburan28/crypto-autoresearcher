  baseline_embedding:
    parameter_slice: >-
      Incumbent = j=0 product-law budgets (D3=11.010251 at m=4;
      plain m=3 ≈ -15.55) and 1db0e8 enumeration-class line ≈123.97.
      Degenerate case of THIS proposal: the same expressions at j=0 / r=B'/262
      must reproduce those fixtures before any j=2 value is read.
    reproduction_check: >-
      Stage 0 Python fixture from (R,N,m,theta,w) alone must print D3,
      plain m=3, and 1db0e8 line within 0.01 bit before any j=2 budget.
      m=5 must report infeasibility (proves-too-much).
    status: declared_in_contract

  observation_collision:
    observable: >-
      The budget-column value, and at toy scale the pair (cyclomatic number,
      cycle-relation weight) of the j=2 large-prime graph.
    distinct_preimage_search: >-
      Same budget whether the 2LP shape is cheap or expensive for real
      solvers — column cannot distinguish; only the named oracle measurement
      separates them. Toy cycle count matching G(n,M) can be genuine
      randomness or finite-size artifact: separated by sweeping V', Z/(4r)
      replica, and finite-size G(n,M) simulation.
    status: declared_in_contract

  quantifier_order: >-
    FOR ALL m in {3,4}, theta in [1/2,1], w in [m,32m], and B with
    B<=0.162 B' at the cap: the j=2 per-attempt budget is at most the
    claim-(C) maximum. FOR ALL enumeration-class oracles: total >=
    2 r N C_2(B')/B'^2. NOT CLAIMED: EXISTS an oracle meeting any budget;
    any algebraic-oracle bound; any m>=5 value.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      Under the product-law convention the j=2 row leaves budgets 2^8.71
      (m=3) and 2^22.34 (m=4) against plain 2^-15.55 and 2^11.01; in the
      enumeration class every large-prime row is above matched rho; at toy
      scale the j=2 graph matches the random-graph model within band.
      Never certifies that an oracle meets a budget.
    nearby_object_control: >-
      j=0 fixture (D3 / -15.55 / 1db0e8 line); m=5 infeasibility;
      Z/(4r) replica; finite-size G(n,M); certificate re-summation;
