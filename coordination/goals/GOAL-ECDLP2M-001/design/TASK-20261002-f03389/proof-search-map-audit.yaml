  bottleneck: >-
    Whether any constructible subspace family at dimension l <= n/2 has
    abscissa density beyond the binomial extreme-value prediction, given
    that the Weil bound does not forbid it. Decidable by Stage-0 vacuity
    arithmetic + support corrections, Stage-1 RC-1 anchor, Stage-2 F0
    binomial null, Stage-3 F1/F2/F3 vs ordinary control, and Stage-4
    named O-* reading; no Magma/Sage required.

  baseline_embedding:
    parameter_slice: >-
      l=n whole-field density 1/2-1/2^n; l=1 trivial 0/1; RC-1 V={deg<9}
      at n=17 within 256±40. Degenerate case before any family census.
    reproduction_check: >-
      Stage 0 must freeze vacuity table for n in {17,19,23,131} and
      re-derive the abscissa condition. Stage 1 must report RC-1 count
      within 256±40 before Stage 2.
    status: declared_in_contract

  observation_collision:
    observable: >-
      Abscissa density of V and its maximum over a family, per
      (n, l, family, curve).
    distinct_preimage_search: >-
      High density from (i) H_struct or (ii) extreme-value of large
      unstructured N. Separated by reporting N + extreme-value prediction
      beside every maximum, and by the ordinary-curve control (same N):
      (ii) matches both curves; (i) need not.
    status: declared_in_contract

  quantifier_order: >-
    (B) FORALL n, FORALL subspaces V of dim l inside ker Tr: count =
    2^{l-1}+E with |E|<=2^{n/2}. (D) EXISTS family/toy cell exceeding
    extreme-value by Stage-0 threshold — contract PREDICTS negation
    (H_random). NOT claimed: measured density at l=33,n=131; exponent;
    ECC2K-130 break.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      Vacuity certificate at n=131 for every l<=66, plus toy census
      maxima with extreme-value and ordinary-control contrast at
      n in {17,19,23}. Ceiling on attack: at most 2^m in yield
      (4 bits at m=4), never an exponent.
    nearby_object_control: >-
      BLOCKING ordinary curve of the same n; F0 binomial null;
      RC-1 anchor; extreme-value prediction beside every maximum.
    status: declared_in_contract

  proof_obligations_count: 5
  audits_applicable:
