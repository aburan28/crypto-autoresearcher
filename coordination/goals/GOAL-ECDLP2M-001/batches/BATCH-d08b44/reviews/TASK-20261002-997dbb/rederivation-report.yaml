        conjugates are F_2-independent.
      admissible_readings:
      - w = t (used)
      reading_used: w = t at n = 23.
      quantities_affected: none
      magnitude: >-
        In f_23's basis the least-integer normal element is also t (= 2), so both clauses give the same
        w.
    - id: Q0-13
      topic: affine-only counting and the coset containing O
      text_quoted: >-
        Every class, class size and count below is over the affine points of E only; the point at infinity
        belongs to no class and carries no mass.
      admissible_readings:
