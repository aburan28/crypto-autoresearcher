rederivation:
  task_id: TASK-20261002-997dbb
  scope: >-
    Exact arithmetic on four curves y^2 + xy = x^3 + Ax^2 + B: CELL-K13 (A = 0, B = 1 over F_2^13), CELL-K19
    (A = 0, B = 1 over F_2^19), CELL-K23 (A = 0, B = 1 over F_2^23), CELL-O19 (A = 46693, B = 306147 over
    F_2^19 with t^19 + t^5 + t^2 + t + 1). Toy scale; nothing is extrapolated.
  libraries:
    interpreter: /usr/local/bin/python3, CPython 3.11.15
    numpy: 2.4.6
    sympy: 1.14.0
    mpmath: 1.3.0
    PyYAML: 6.0.1
    own_code: >-
      gf2lib.py (pure-Python GF(2)[t] and GF(2^n) arithmetic, Ben-Or / Rabin / trial-division irreducibility,
      Gauss-Jordan over GF(2), affine binary-curve arithmetic, numpy vectorised field with discrete-log
      tables) and the scripts listed in computations.json, written for this task
    not_available: >-
      galois, PARI/cypari2, Sage and gmpy2 are not installed; nothing was installed.
  Q0:
    statement: >-
      Q0 is NOT empty. Seven items (Q0-1 to Q0-7) are genuine choices left by the definitions and can
      change reported values; Q0-8 to Q0-13 were examined and change nothing. The largest dependence is
      Q0-1, which moves every CELL-K23 Q2 row.
    items:
    - id: Q0-1
      topic: >-
        whether the type-II rule is accepted at each n (field polynomial and w of CELL-K23)
      text_quoted: >-
        otherwise, where a type-II optimal normal basis exists, the recurrence polynomial f_n (f_0 = 1,
        f_1 = t + 1, f_(i+1) = t f_i + f_(i-1)), accepted only if irreducible, with t normal and multiplication
        complexity exactly 2n - 1; otherwise the lowest-weight irreducible polynomial, least as an integer.
      admissible_readings:
      - >-
        INCLUSIVE: a type-II optimal normal basis of F_2^n exists iff 2n + 1 is prime and either 2 is
        primitive mod 2n + 1, or 2n + 1 = 3 mod 4 and 2 generates the quadratic residues (the classification
        usually credited to Mullin, Onyszchuk, Vanstone and Wilson, with completeness by Gao and Lenstra;
        provenance recalled, not retrieved, and not load-bearing because every arithmetic fact below was
        computed).
      - >-
        NARROW: only the sub-case with 2 primitive mod 2n + 1 is called type II (some texts call the other
        sub-case type IIb or type III).
      reading_used: INCLUSIVE.
      per_n:
      - >-
        n = 13: 2n + 1 = 27 is not prime, so no type-II basis under either reading; f_13 = t^13 + t^12
        + t^10 + t^9 + t^8 + t^2 + t + 1 is reducible (factor degrees 1, 3, 9). Rule not accepted.
      - >-
        n = 19: the card names the field polynomial (DF-8 first clause); 2n + 1 = 39 is not prime and
        f_19 is reducible (factor degrees 1, 6, 12). Rule not accepted, so w is the least-integer normal
        element.
      - >-
        n = 23: 47 is prime, the order of 2 mod 47 is 23 (2 is not primitive) and 47 = 3 mod 4, so a type-II
        basis exists under INCLUSIVE and not under NARROW. f_23 = t^23 + t^22 + t^20 + t^16 + t^8 + t^7
        + t^6 + t^4 + 1 is irreducible (Ben-Or, Rabin, exhaustive trial division, sympy), t is normal
        and the multiplication complexity is 45 = 2n - 1. Accepted under INCLUSIVE.
      quantities_affected: >-
        CELL-K23 field polynomial and w (Q1) and every CELL-K23 Q2 row: all 36 rows change in at least
        one field under NARROW. The K23 group order, factorisation, N, log2 N, E/2E, E/4E and alphabets
        do not depend on it.
      magnitude: >-
        Under NARROW the field is t^23 + t^5 + 1 with w = t + 1. In that basis Tr(x) is the coefficient
        of t^0, so F3@0 becomes 2E-pure (purity_2 0 -> 1 at M = 16, 32 and 128) and F5[F3@0] has half
        as many classes (16 -> 8, 32 -> 16, 128 -> 64). Other rows move by small amounts. The full alternative
        table is under Q0_sensitivity.CELL-K23_narrow_reading_rows.
    - id: Q0-2
      topic: reading of F1's M quantile classes
      text_quoted: >-
        F1, the normal-basis Hamming weight of x in M quantile classes (the mid-CDF of Binomial(n, 1/2))
      admissible_readings:
      - >-
        R1: class = floor(M * Fmid(k)) with Fmid(k) = P(W < k) + P(W = k)/2, W ~ Binomial(n, 1/2), k the
        Hamming weight; each weight goes to the equal-probability bin that contains the midpoint of its
        probability mass.
      - >-
        R1': ceil(M * Fmid(k)) - 1; differs from R1 only when M * Fmid(k) is an integer.
      - >-
        R2: floor(M * P(W < k)), the bin containing the left end of the mass of k.
      - >-
        R3: ceil(M * P(W <= k)) - 1, the bin containing the right end.
      - >-
        R4: min(M - 1, floor(M * P(W <= k))), the CDF capped.
      reading_used: >-
        R1. No tie occurs at any (n, M) used, including the M/4 alphabets inside F5, so R1 and R1' coincide
        exactly (checked with exact rationals in three implementations).
      quantities_affected: F1 and F5[F1] rows only.
      magnitude: >-
        See Q0_sensitivity.<cell>.F1_readings: each alternative reading against R1, field by field (R2,
        R3 and R4 change n_classes, the class sizes and purity_2 of F1 at every M, and change F5[F1] at
        most M).
    - id: Q0-3
      topic: >-
        order of the normal-basis coordinates (index 0) and direction of the F2 cyclic window
      text_quoted: >-
        F2 at offsets 0, floor((n - r)/2), n - r, a cyclic window of r normal-basis coordinates ... Frobenius
        is the cyclic shift of the coordinate vector.
      admissible_readings:
      - >-
        Index i is the coefficient of w^(2^i) (used), or any rotation or reflection of that indexing,
        e.g. i <-> w^(2^(n-1-i)).
      - >-
        The window covers indices o, o+1, ..., o+r-1 (used), or o, o-1, ..., o-r+1.
      - >-
        Packing of the r coordinates into a label value: immaterial, since every bijection gives the same
        partition.
      reading_used: >-
        Index i = coefficient of w^(2^i); window o .. o+r-1; Frobenius x -> x^2 moves coordinate i to
        i+1.
      quantities_affected: >-
        CELL-O19 ORD-F2 rows only. On Koblitz cells no F2 or F5[F2@0] value depends on this.
      magnitude: >-
        Koblitz cells: every one of the n cyclic windows gives identical statistics for F2 and for F5[F2@o]
        at every M on K13, K19 and K23 under both Q0-1 readings (checked exhaustively). Reason: Frobenius
        (x, y) -> (x^2, y^2) is a group automorphism of a curve defined over F_2; it shifts the coordinate
        vector by one and fixes every coset of 4E (it acts as 1 on E/4E, since among the units of Z/4
        only 1 satisfies X^2 + X + 2 = 0 mod 4). Ordinary cell: no such automorphism. Reversed indexing
        maps offsets (0, mid, n - r) to (n - r, n - r - mid, 0), and the values and the range over all
        19 offsets are under Q0_sensitivity.CELL-O19. The ordinary cell is the nearby object where the
        invariance must fail, and it does fail there, so the invariance is not an artifact of the code.
    - id: Q0-4
      topic: bit order and position of a polynomial-basis window (F3)
      text_quoted: >-
        F3 at the same offsets, a window of r polynomial-basis coordinates ... bit j is the coefficient
        of t^j.
      admissible_readings:
      - >-
        Offset counted from t^0 upward: bits o .. o+r-1 (used).
      - >-
        Offset counted from t^(n-1) downward: bits n-r-o .. n-1-o.
      - >-
        Bit order inside the window: immaterial to the partition. Cyclic or not: immaterial, since o +
        r <= n for every stated offset.
      reading_used: Bits o .. o+r-1 of the integer encoding.
      quantities_affected: >-
        F3 / ORD-F3 rows (offsets 0 and n - r swap; the middle offset moves by one when n - r is odd)
        and F5[F3@0], which would use the top r - 2 bits.
      magnitude: >-
        See Q0_sensitivity.<cell>.F3_counted_from_top (ORD_F3_counted_from_top on CELL-O19) and the ranges
        over every window position.
    - id: Q0-5
      topic: which end of the least rotation is leading (F4)
      text_quoted: >-
        F4, the leading r coordinates of the least cyclic rotation of x's normal-basis vector
      admissible_readings:
      - >-
        (a) least = lexicographically least with c_0 compared first; leading = its first r coordinates
        (used).
      - >-
        (b) least = least integer sum c_i 2^i (c_(n-1) most significant); leading = its r most significant
        coordinates. This is (a) applied to the reversed vector.
      - >-
        (c) least as in (b); leading = c_0 .. c_(r-1), its r least significant coordinates.
      - (d) least as in (a); the last r coordinates.
      reading_used: (a).
      quantities_affected: F4 and F5[F4] rows.
      magnitude: >-
        (a) and (b) are different partitions for r >= 4: they differ on necklaces with intermediate longest
        zero-runs, e.g. classes 0010 / 0011 at r = 4. They nevertheless give identical values in every
        reported field of every row on every Koblitz cell, because the largest classes (long zero-runs),
        the pure classes and the smallest class (x = 1, the all-ones vector) are invariant under reversal
        (probe_f4_symmetry*.py). (c) and (d) change many fields; see Q0_sensitivity.<cell>.F4_readings.
    - id: Q0-6
      topic: how F1 and F4 are read at alphabet 2 (r = 1) inside F5
      text_quoted: >-
        The composite 4 t + h4 is read as the pair (t(x), h4(P)), with t the named family at alphabet
        M/4 (so r replaced by log2(M/4) in its definition, offset 0 for F2@0 and F3@0).
      admissible_readings:
      - >-
        F1 at alphabet 2 by R1 (used): weight <= 6 -> 0, weight >= 7 -> 1 (n = 13, a median split with
        no tie); R2 and R3 give the same split; R4 splits at 5 | 6.
      - >-
        F4 at r = 1 by (a) or (b) (used): the label is 1 only for the all-ones vector, which is x = 1
        because Tr(w) = 1; by (c) or (d) it is a different one-bit label.
      - >-
        Treat the r = 1 arms as degenerate and omit them; not taken, since the card defines twelve arms
        at every alphabet.
      reading_used: As defined, with R1 and (a); arms computed.
      quantities_affected: >-
        Only CELL-K13 at M = 8 (M/4 = 2): rows F5[F1] and F5[F4].
      magnitude: >-
        F5[F4] at K13 M = 8 under (a): 6 classes, the smallest of size 1 (the two points over x = 1 lie
        in T+4E and 3T+4E), c_4 = 2. Under (c) or (d): 5 classes and c_4 = 1. F5[F1] under R4: smallest
        780 -> 286, largest 1222 -> 1716, c_2 5592 -> 5098, c_4 3302 -> 2263; under R2 and R3: identical.
    - id: Q0-7
      topic: real against rounded arithmetic in R-M
      text_quoted: >-
        Rule R-M: M = 2^r with r = floor(log2(N) / p + 1/2), p = 3 for the N^(1/3) arm and 4 for the N^(1/4)
        arm, with N = l, the largest prime divisor of the cell's group order
      admissible_readings:
      - >-
        exact real arithmetic (used, by the integer test 2^(p(2r-1)) <= N^2 < 2^(p(2r+1)))
      - float64 log2
      - log2 N rounded to the four decimals Q1 reports
      - coarser rounding of log2 N
      reading_used: >-
        Exact. Float64, 50-digit mpmath, sympy and log2 N rounded to 4 decimals all give the same r on
        every cell.
      quantities_affected: >-
        The alphabet row set of CELL-O19, and so which ORD rows exist, under coarse rounding only.
      magnitude: >-
        CELL-O19 at p = 4: log2(N)/4 + 1/2 = 4.99956 (N = 261823 < 2^18 = 262144), 0.00044 below the floor
        boundary. Rounding log2 N to 2 or fewer decimals (18.00) gives r = 5, M = 32 instead of M = 16;
        the ORD rows at M = 32 are under Q0_sensitivity.CELL-O19.RM_rounding_M32_rows. Every other (cell,
        p) value is at least 0.155 from an integer (smallest: K13 p = 3, 0.155982).
    - id: Q0-8
      topic: which point of a fibre lies in which coset of 4E (labelling of h4)
      text_quoted: >-
        Any fixed bijection of the cosets of 4E onto 0, 1, 2, ... gives the same partition of the affine
        points into classes, and every quantity below depends only on that partition.
      admissible_readings:
      - >-
        The card fixes this. Implementation note: the two points P, -P over an x outside 2E lie in T +
        4E and 3T + 4E; q2_enum.py and xcheck_pure.py assign them to those two cosets arbitrarily.
      reading_used: >-
        Arbitrary assignment, which provably changes no statistic: the multiset of (label, coset) pairs
        is unchanged by the swap.
      quantities_affected: none
      magnitude: >-
        Confirmed on CELL-K13 by recomputing all 24 rows with the true h4(P), read off [#E/4]P in {O,
        Q4, T2, -Q4} for every point (xcheck_k13_points.py): identical.
    - id: Q0-9
      topic: >-
        alphabet row set when alphabets coincide; fixed alphabet on the ordinary cell
      text_quoted: >-
        M = 16 on CELL-K13, CELL-K19 and CELL-K23. A fixed alphabet that coincides with an R-M alphabet
        of the same cell is one row.
      admissible_readings:
      - set union (used)
      - whether the fixed alphabet also applies to CELL-O19
      reading_used: Set union; no fixed alphabet on CELL-O19.
      quantities_affected: none
      magnitude: >-
        The p = 3 and p = 4 alphabets never coincide on any cell. K13: fixed 16 = R-M p = 3; K19: fixed
        16 = R-M p = 4; K23: fixed 16 is its own row. Applying 16 to O19 would coincide with its p = 4
        alphabet.
    - id: Q0-10
      topic: DF-8 fallback polynomial and least-integer normal element
      text_quoted: >-
        otherwise the lowest-weight irreducible polynomial, least as an integer ... otherwise the least
        integer whose n conjugates are F_2-independent.
      admissible_readings:
      - >-
        Unique under the card element encoding; no admissible alternative found.
      reading_used: As stated.
      quantities_affected: none
      magnitude: >-
        n = 13 has no irreducible trinomial; the two pentanomials below t^13 + t^4 + t^3 + t + 1 as integers
        (t^13 + t^3 + t^2 + t + 1, t^13 + t^4 + t^2 + t + 1) are reducible; sympy confirms all 380 smaller
        candidates reducible. w = t + 1 on K13, K19 and O19: 1 and t are not normal there (sympy DomainMatrix
        rank).
    - id: Q0-11
      topic: irreducibility test form and multiplication-complexity definition
      text_quoted: >-
        The irreducibility check is the Ben-Or form of the Rabin test. ... multiplication complexity exactly
        2n - 1
      admissible_readings:
      - >-
        Ben-Or (used) or Rabin form; complexity = number of nonzero entries of T in w * w^(2^i) = sum_j
        T_ij w^(2^j) (used, standard).
      reading_used: Ben-Or; complexity as the nonzero count of T.
      quantities_affected: none
      magnitude: >-
        Ben-Or, Rabin, exhaustive trial division and sympy gf_irreducible_p agree on every polynomial
        examined. T has 45 = 2n - 1 nonzero entries at n = 23 (own code and sympy).
    - id: Q0-12
      topic: w where the type-II rule is accepted
      text_quoted: >-
