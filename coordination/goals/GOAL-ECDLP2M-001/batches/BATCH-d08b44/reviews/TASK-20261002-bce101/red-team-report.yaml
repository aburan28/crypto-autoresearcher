  - id: REC-1
    severity: finding under RW4-7, cured in this review
    text: >-
      The recalled Sorenson-Webster bound (CODE-CORE DETERMINISTIC_MR_LIMIT and the CODE-CERT docstring,
      provenance recalled) supports a design figure. CODE-S0 koblitz_orders marks n admissible through
      core.is_prime, whose determinism rests on that bound. That yields the Stage 0 list 'admissible degrees
      below 64: 5, 7, 9, 13, 19, 23, 41', on which the ladder choice rests. PD-B4-8 says the recalled
      items support no decision rule, which is true; it does not say they support no design figure.
    retrieval: >-
      Retrieved 2026-10-02 by this review. J. Sorenson and J. Webster, 'Strong Pseudoprimes to Twelve
      Prime Bases', arXiv:1509.00864 (Math. Comp. 86 (2017) 985-1003), Theorem 1.1 in the ar5iv rendering:
      psi_12 = 318665857834031151167461 and psi_13 = 3317044064679887385961981. The contract's bound is
      psi_13, and its bases are the first 13 primes (SPRP_BASES, SMALL_PRIMES), so the use is correct.
      Delta: none.
    re_derivation: >-
      REC-1 in computations.json. Without the bound, every odd part the test passes was proved prime by
      complete trial division, and every failing base is itself a proof of compositeness. The admissible
      set is [5, 7, 9, 13, 19, 23, 41], equal to CODE-S0 (True) and to the sheet. psi_13 = 1287836182261
      x 2575672364521 is accepted by both CODE-CERT's guard and core.is_prime, so the documented scope
      boundary of RV-10 is exact.
  - id: REC-2
    severity: finding under RW4-7, non-load-bearing, cured in this review
    text: >-
      The recalled Gumbel model (PD-B4-8) behind stage_0.null_scale's uniform-label design estimates was
      re-derived here. Each conditional frequency has binomial-normal sd sqrt(M/S) over M^3 cells; the
      maximum of M^3 standard normals has location sqrt(6 ln M) and scale 1/sqrt(6 ln M); W is the Gumbel
      q99 - q50. All five rows (M = 8 to 128) reproduce to three decimals. The sheet labels them underestimates,
      and no rule, floor or sentence consumes them.
  ptm:
    failure_signature_quoted: >-
      A correct protocol keeps each known-false conclusion out of reach. PTM-A returns the full divisor
      set and reads G = M on both homomorphisms at the declared S. PTM-B returns the subgroup filters
      and reads G = M. PTM-C reads about M/2 on every declared M and is labelled a positive control.
    PTM-A:
      met_signature: true
      certificate_part: >-
        Carve-out arithmetic on the n = 17 Koblitz cell, with no curve point. Order by route A = 130972
        = [[2, 2], [137, 1], [239, 1]]. CODE-CERT divisors_from_factorisation gives 12 divisors, [1, 2,
        4, 137, 239, 274, 478, 548, 956, 32743, 65486, 130972], including 548 (True) and 956 (True). capacity(order,
