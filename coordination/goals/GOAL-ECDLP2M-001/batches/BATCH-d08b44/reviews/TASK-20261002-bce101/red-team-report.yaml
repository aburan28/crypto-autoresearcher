  objections:
  - >-
    OS-V4-1 (breaking): the effective LEAD floor and the exact-free and exact-carrying offsets are stated
    for every arm from XF(1) and XC(1) measurements; contradicted by the contract's own C-8 and by SCOPE-1.
  - >-
    OS-V4-2: three certificate sentences omit 'below l' (carried from version 3).
  - >-
    OBJ-2: single-replicate NEG-path floors are read as bounds; no detection rate at the floor; the rank
    branch of L3 is misdescribed in two sentences.
  - >-
    OBJ-3: 'the Z/l floor is an underestimate' is argued, not shown.
  - >-
    OBJ-4: the NEG row's mechanism string carries no floor.
  - >-
    OBJ-5: H's PC-16c rate sentence lacks 'design' and the bound.
  - >-
    OBJ-6: two internal citations unlabelled in the specification's internal_inputs.
  - >-
    OBJ-7: two carried with-orbit figures lack an inline conditional label.
  - >-
    OBJ-8: the excluded-reads discharge of C8 rests on a partly reconstructed producer attestation.
  required_controls:
  - >-
    RC-1: before any NEG is quoted as excluding excess at a floor, measure P(L3 | XF(rho_floor)) and P(L3
    | XC(rho_floor)) over at least 20 fresh design replicates per (cell, M) shape on permitted groups,
    and report the floor at a stated detection rate (owner J3 or the next producer).
  - >-
    RC-2: report offset_F = (q50 - median stratified-shuffle median of F) / W per declared role at run
    time, from data the run already records, and quote each role's effective LEAD floor 3 W + max(0, offset_F)
    beside its verdict.
  - >-
    RC-3: tabulate the C-5 Z/l reference floors beside the NEG-path floors per (l, M), or drop the word
    'underestimate'.
  counterexample_or_mutation: >-
    The planted marginal-only exact-free label of the contract's own C-8 at the K13@16 shape (offset -3.98
    W) is a counterexample to 'for an exact-free role L1 needs ... 4.40 W'. The SCOPE-1 F4-like exact-free
    label (offsets -0.66, -0.28, 0.40 W) is one at all three lead keys.
  cheapest_falsification: >-
    Of the J4 claim 'no sentence says more than its measurement': read C-8's RR-2/PLANTED/stratified row
    (E_RL/W 3.931, E_Sh/W -0.045, Z/(4 x 2011), M = 16) against H line 646 and E line 340. Zero compute,
    and it falsifies the sentences' universal. SCOPE-1 at the K13@16 shape (about 5 s) reproduces it for
    an F4-like label.
  uncharged_cost_terms:
  - >-
    The detection probability behind each NEG-path floor. Reading a NEG as a bound at the floor charges
    it implicitly as 1; it was measured once (OBJ-2).
  - >-
    The arm-specific L1 offset. The effective LEAD floor charges every exact-free arm XF(1)'s offset (OS-V4-1).
  - >-
    The Z/l-to-NEG-path floor ratio behind 'underestimate', asserted without the ratio (OBJ-3).
  - >-
    Not J4's to price: the false-fire rates and their EXCH and MARGIN bounds (J3), and the run cost (RV-13,
    J3).
  null_and_nearby_object_controls:
    checked:
    - >-
      PTM-A: the composite-order nearby object where the capacity is not 2 bits (carve-out arithmetic),
      plus the gate on a permitted analog, plus a known-false input (non-homomorphisms) that the gate
      refuses.
    - >-
      PTM-B: Z/2^16 and Z/2^18, where every 2-power alphabet is exact; certificate, gate and rules all
      see it.
    - >-
      PTM-C: the key on Z/l' as the far-end positive control, with the relabelled windows as nulls (PC-7c),
      and LEAD reached along the ladder and flat.
    - >-
      SCOPE-1: an exact-free label for which the effective-LEAD-floor sentence's conclusion is false (the
      nearby-object attack on that sentence).
    - >-
      The contract's own C-8 UNIFORM label (offset +5.82 W) as the null: the XF-like offset tracks a near-uniform
      marginal.
    missing:
    - A replicate control for the NEG-path floors (RC-1).
    - >-
      A per-role offset control (RC-2), so that the effective LEAD floor quoted beside a verdict is that
      role's own.
  baseline_comparison: >-
    Not a J4 quantity. Within J4: matched rho 2^60.8090 = sqrt(pi l / (4 x 131)) (CORR-20260922-81aeab)
    appears on reference lines only. The (C4) floors 2^62.4833 (N = 4l) and 2^61.4833 (N = l) are stated
    above it with their ambients, and no measured statistic is compared with rho.
  heuristic_challenges:
  - >-
    HEUR-B2 is stated as a heuristic of transfer, never a bound, over about 108 bits of log2 l (ladder)
    and 90 bits (fixed alphabet). Within J4 the sentences keep that scope, and 'it transfers only what
    lies above the NEG-path floors' inherits OBJ-2: what lies above a single-replicate floor is not measured
    at a stated rate.
  cost_model_challenges:
  - >-
    OS-V4-1 is a cost-model defect of the LEAD branch: the threshold a LEAD must clear is mis-stated for
    skewed arms.
  reduction_and_scope_challenges:
  - >-
    OS-V4-2: the certificate's scope qualifier 'below l' is dropped in three sentences.
  - >-
    The transfer of a NEG-path floor from Z/(q l') to the curve cell is stated as an assumption (IF-9,
    l' within 0.006 bit); the label-form caveat is present in the hypothesis and audit but absent from
    the specification's NEG row ('those planted mixtures' only).
  proof_architecture_challenges:
  - >-
    Observation-fiber attack on DF-12: hold the decision clause L1 fixed and vary the arm's marginal.
