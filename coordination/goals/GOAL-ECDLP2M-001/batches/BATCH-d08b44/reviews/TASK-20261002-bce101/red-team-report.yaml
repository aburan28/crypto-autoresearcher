  findings:
  - id: OS-V4-1
    severity: breaking (J4)
    kind: over-scoped floor statement in the LEAD-reach scoping (RV-5)
    sentences: *id001
    quotes:
    - >-
      H line 646: For an exact-free role L1 needs a stratified excess of about 3 W plus the measured offset
      of 4.40, 3.41 and 2.34 W at the three lead keys (about 7.4, 6.4 and 5.3 W in all);
    - >-
      E line 340: for exact-carrying labels it is within 0.16 W of 0. The effective LEAD floor for exact-free
      arms is therefore E_Sh of about 7.4 W, 6.4 W and 5.3 W at the three lead keys (design figures).
    - >-
      E line 698 (SR-4): For an exact-free arm L1 requires about 3 W plus the measured offset (2.3 to
      4.4 W at the lead shapes, design figure C-6).
    - >-
      A line 6459 (DF-12): the second term is positive because the saturated null itself carries the exact
      component.
    measurement_scope: >-
      negpath_floor_table defines the offset as (q50 of the saturated null minus the median shuffle median
      of XF(1)) / W. It was measured for XF(1) (exact-free, near-uniform marginal) and XC(1) only, on
      Z/(q l') at each shape.
    why_wider: >-
      By the contract's own decision_clauses, E_RL - E_Sh = (median stratified-shuffle median of THE ARM)
      - q50. The offset therefore depends on the arm's marginal. A skewed marginal raises the shuffle
      median, roughly to M times its largest class fraction, and can push the offset below zero, at which
      point L1 is implied by L3 and the effective LEAD floor is L3's 3 W.
    contract_internal_evidence: >-
      (1) C-8, at the K13@16 lead shape (Z/(4 x 2011), M = 16, saturated null q50 6.154, W 0.639), reads
      the planted marginal-only EXACT-FREE label at E_RL/W 3.931 and E_Sh/W -0.045. That is an offset
      of -3.976 W: L1 holds while L3 fails, so for this exact-free label the effective LEAD floor is 3
      W, not 7.4 W. The UNIFORM label at the same shape reads 5.823 W, which is XF-like. The exact-carrying
      XCO1 reads -2.117 W and XCO2 -5.282 W, against 'within 0.16 W of 0'. (2) The declared exact-free
      role F4 has a skewed marginal by the C-4 enumeration: largest class 2809 of 8011 at K13 M 16, 75051
      of 523491 at K19 M 64, 743177 of 8383411 at K23 M 128. A stratified shuffle of an exact-free label
      cannot put G below about M times its largest class fraction (5.61, 9.18, 11.35). With the C-6 saturated-null
      q50 and W at the lead shapes (6.175/0.842, 11.107/1.582, 16.271/2.977), F4's offset is therefore
      at most about 0.67, 1.22 and 1.65 W, against the stated 4.40, 3.41 and 2.34 W.
    review_computation_SCOPE_1: >-
      Corroboration on permitted groups, recomputing no contract value. The label is exact-free and synthetic:
      0 with F4's largest-class fraction, else uniform on F4's remaining image. It was read exactly as
      CODE-NEGP reads XF(1), with shared within-stratum permutations, 50 saturated draws per seed and
      ten seeds. Offsets: K13@16 shape -0.656 W (q50 6.143, W 0.759, median shuffle median 6.641); K19@64
      shape -0.282 W; K23@128 shape 0.404 W. The contract's values are 4.40, 3.41 and 2.34 W. For an F4-like
      role the effective LEAD floor, 3 W plus max(0, offset), is 3.00, 3.00 and 3.40 W at the three lead
      keys, against the stated 7.4, 6.4 and 5.3 W.
    consequence: >-
      The sentences misstate what L1 requires of skewed exact-free roles. They understate LEAD reach for
      F4-like roles, which can read LEAD from about 3 to 3.4 W of stratified excess. DF-12 states a false
      sign as a mechanism. For exact-carrying roles the 'within 0.16 W of 0' premise is false for XCO1/XCO2-like
      labels (and, by the same arithmetic, for F1, F5xF1 and F5xF4, whose marginals are skewed). Its conclusion
      that the LEAD floor equals the NEG floor still holds wherever the offset is at most 0. No decision
      rule changes: the code reads L1 and L3 directly. A review-breakthrough round triggered by a LEAD,
      or a reader of a NEG or ART-RES, would be misinformed about the floor the instrument actually applied
      to that role.
    remedy: >-
      Local text. State the offset as arm-specific, offset_F = (q50 - median stratified-shuffle median
      of F) / W, with effective LEAD floor 3 W + max(0, offset_F). Quote 4.40, 3.41 and 2.34 W as the
      near-uniform-marginal instance (XF(1)), and quote the planted marginal-only label of C-8 (-3.98
      W) as the skewed instance. Delete the sign claim of DF-12 and the universal of definitions.effective_lead_floor_for_exact_free_arms.
      Optionally report offset_F per role at run time; it follows from the recorded E_RL and E_Sh, so
      no new computation is needed.
    direction_note: >-
      The error runs in the conservative direction for LEAD claims. It is breaking because the plan's
      breaking artifact is direction-free and the sentence is false of a declared role. A composer may
      weigh direction; this review does not lower the classification for it.
  - id: OS-V4-2
    severity: >-
      material wording, non-load-bearing; carried verbatim from version 3 (H-BINSTD-17cf9d lines 65 and
      275)
    sentences: *id002
    quotes:
    - >-
      H line 67 (title): On the composite ambient group of ECC2K-130 every exactly sum-compatible filter
      has alphabet in 1, 2, 4, so the exact capacity is 2 bits
    - >-
      H line 311 and A line 5497 (strongest_certifiable_claim): On ECC2K-130 every exactly sum-compatible
      filter has alphabet at most 4
    why: >-
      The certificate proves that every exact alphabet divides 4l, so the alphabets BELOW l are 1, 2 and
      4. The three sentences drop 'below l'. Read literally, they deny the exact filters of alphabet l,
      2l and 4l that exist on the group: CODE-CERT's PC-CERT-1 itself requires the six divisors of 4l.
      That is PTM-B's failure signature ('a certificate finding no alphabet between 4 and the order')
      transposed to prose. The code does not commit it (PTM-A and PTM-B pass). Statement (A), Q-CERT and
      the CERT row carry the qualifier, so no rule or figure depends on the wrong form.
    remedy: Insert 'below l' (or 'of alphabet below l') in the three sentences.
    verdict_weight: >-
      Not used for the J4 verdict. The plan's J4 text ('no over-scoped sentence') would admit it as a
      break item on its own; the composer may weigh it.
  - id: OBJ-2
    severity: non-breaking objection
    sentences: *id003
    text: >-
      The NEG-path floor of each (cell, M) is ONE 10-seed design replicate per (shape, rho): the smallest
      grid rho at which L3 held for it and for every larger grid rho (negpath_floor_table.method). No
      detection rate at the floor is measured or stated, and the selection rule picks the weakest rho
      that passed once, which biases the quoted floor toward a lucky pass. Several sentences read a NEG
      as a bound at that floor: 'bounds' (E line 934, A line 7442, H line 607, A line 5446), 'asserts
      absence only above' (H line 212), 'says only that ... lies below what resolves those planted mixtures'
      (E line 854), 'what NEG certifies' (A line 6385). Each is hedged to the planted class and to the
      (cell, M), which J4's (cell, M) test accepts, but none carries the replicate count or a detection
      probability. Two sentences (H line 622, A line 6372) also describe a NEG as 'excess below 3 W on
      enough seeds', which misses L3's rank branch: L3 fails when fewer than 8 seeds sit at the rank floor
      even with median E_Sh at least 3 W.
    cheapest_falsification: >-
      Not run here (RW4-5 reserves floor and rate values to J3; this review recomputes none). Repeat CODE-NEGP
      shape_readings('K13@16') under 20 fresh stream labels (label='negp-rep%d'), summarize each, and
      count L3 for XF at rho = 0.6, 0.7 and 0.8 (about 6 minutes at the C-6 timing of 18 s per shape).
      If P(L3 | XF(0.7)) is below about 0.9, the sentences that read a NEG at K13@16 as excluding XF(0.7)-strength
      excess overstate the measurement.
    remedy: >-
      State the floors as single-replicate design figures and either measure the detection rate at each
      quoted floor or replace 'bounds' with 'L3 resolved the planted mixture from rho = ... in one design
      replicate'.
