        The code meets the signature. The three certificate SENTENCES of OS-V4-2 would not, read literally.
    PTM-C:
      met_signature: true
      object: >-
        Z/l'Z with the log-interval key at l' = 2011, 130927 and 2095867 (adjacent permitted primes, order
        checked in code) across the declared M grid (16 and 8; 64 and 16; 128, 32 and 16). It runs through
