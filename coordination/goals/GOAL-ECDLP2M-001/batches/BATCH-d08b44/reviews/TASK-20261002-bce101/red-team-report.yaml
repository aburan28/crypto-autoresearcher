      - >-
        2011@8 G_key_median 4.877 (G/M 0.610), PC-7 True, L1 True, L3 True, rank-floor seeds 10, relabelled
        windows L3 [False]
      - >-
        130927@64 G_key_median 43.300 (G/M 0.677), PC-7 True, L1 True, L3 True, rank-floor seeds 10, relabelled
        windows L3 [False]
      - >-
        130927@16 G_key_median 10.022 (G/M 0.626), PC-7 True, L1 True, L3 True, rank-floor seeds 10, relabelled
        windows L3 [False]
      - >-
        2095867@128 G_key_median 87.164 (G/M 0.681), PC-7 True, L1 True, L3 True, rank-floor seeds 10,
        relabelled windows L3 [False]
      - >-
        2095867@32 G_key_median 20.582 (G/M 0.643), PC-7 True, L1 True, L3 True, rank-floor seeds 10,
