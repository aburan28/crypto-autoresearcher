        passes.
      gate_part: >-
        Run on the permitted analog Z/(4 x 139 x 241) (order 133996, factorisation [[2, 2], [139, 1],
        [241, 1]], certificate divisors [1, 2, 4, 139, 241, 278, 482, 556, 964, 33499, 66998, 133996]).
        The cell itself and every group whose order is divisible by 137 or 239 are excluded beyond the
        arithmetic carve-out, and an exact homomorphism of alphabet 548 or 956 exists only on such groups.
        The PC-5 code path (est.exact_gain_stream with tab[P] % M, the body of pc5_composite with the
        alphabet tuple as a parameter) was run at the analog alphabets 556 = 4 x 139 and 964 = 4 x 241,
        at S = [67108864, 134217728]; S_of(556), S_of(964) equal S_of(548), S_of(956): True. Result: passed
        True, G = 556 and 964, nonexact_used 0 and 0, used 309136 and 929258 (each at least M^2/2), seed
        0 as PC-5 declares.
      known_false_control_added: >-
        The UNCHANGED gate.pc5_composite (548, 956) on the same analog, where i mod 548 and i mod 956
        are not homomorphisms (548 and 956 do not divide 133996). Result: passed False, G None at both
        alphabets, every used cell non-exact (300304 and 913922). The gate does not read G = M where the
        conclusion is false.
      deviation: >-
        The gate part ran on an isomorphism-type analog with adjacent permitted primes, not on CELL-K17C
        (declared_groups_rule); recorded, not a PTM failure.
    PTM-B:
      met_signature: true
      Z_2_16: >-
        Certificate: 17 divisors 2^0 to 2^16, of which 13 lie strictly between 4 and the order; capacity
        below the order 15.0 bits. Unchanged gate.pc1_exact_grid(N = 2^16): passed True; G = M exactly
