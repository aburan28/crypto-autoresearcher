      (mine) against at most 1.0116 (producer); SR-5/SR-6 contingent review
      cost under the null about 0 on both.
  reduction_and_scope_challenges:
    - >-
      Rates measured on Z/l at fixed M = 16 (PC-16b, PC-16c and the slow-decay
      rate) are quoted as properties of L2 in the LEAD-reach scoping. The LEAD
      branch is read at growing M on the curve path, where they do not
      transfer.
    - >-
      Design figures on permitted groups are transferred to the declared
      groups by shape (log2 l within 0.006). I relied on the same transfer and
      saw no sign it fails; it is an assumption on both sides.
  proof_architecture_challenges:
    - >-
      Compositional-invariant attack on the LEAD rule (L1 and L2 and L3).
      Deleting L2 changes PC-16c's verdict in 0 of 3000 runs, so the guard
      certifies the composite through L1/L3 and leaves L2's own contribution
      untested.
    - >-
      Nearby object: the version-3 decay is the closest object on which L2
      decides. Version 4 moved the guard off it to buy a low false-fail rate,
      and with it lost the guard's sensitivity.
  null_and_nearby_object_controls:
    checked: >-
      Every null label class against its own stratified shuffles: pooled
      rank-floor rate 0.0633 per seed over 61 label-keys, at or below 1/11
      as exchangeability requires. The largest single deviation (K23 M = 16
