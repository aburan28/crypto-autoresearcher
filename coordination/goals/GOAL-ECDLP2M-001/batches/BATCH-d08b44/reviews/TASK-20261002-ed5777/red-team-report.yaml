    all.
  baseline_comparison: >-
    Not a speedup claim; no rho, BSGS or specialised baseline enters J3. The
    nearby objects used are the version-3 PC-16c decay (rho = 1, 0.9, 0.8), on
    which L2 IS exercised (L1 and L3 at all three, LEAD 0.12), and the exact
    and planted-marginal labels of PTM-D.
  heuristic_challenges:
