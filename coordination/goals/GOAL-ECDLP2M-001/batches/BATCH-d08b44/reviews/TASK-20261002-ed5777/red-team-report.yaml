    ii_structural_premise:
      verdict: holds
      check: >-
        From parameter arithmetic only. CELL-K13, K19, K23 and K41 have orders
        8012 = 4 x 2003, 523492 = 4 x 130873, 8383412 = 4 x 2095853 and
        2199025563772 = 4 x 549756390943, each l an odd prime (rechecked here;
        the orders are a carve-out). An ordinary binary curve has the single
        2-torsion point (0, sqrt(B)), so the 2-Sylow subgroup is cyclic, and
        with 4 dividing the order and 8 not dividing it, it is Z/4; E is
        cyclic, E/4E is Z/4 and E/2E its quotient. The strata the rules
        assume (four cosets of 4E) are right. CELL-O19 has order 523646 = 2 x
        261823, so 2E = 4E, and its strata are the two cosets of 2E. Every
        declared alphabet (Koblitz 8, 16, 32, 64, 128; ordinary 16, 64) is
        divisible by q, so q r + e is defined everywhere (M/q in 2, 4, 8, 16,
        32 and 8, 32). The h4 stratum is the halving presentation, needing
        Tr(A) = 0 (a = 0 cells) and a point of order 4 outside 2E, which
        every element of order 4 of a cyclic group of order 4l is. PC-4b
        gates it.
      minor_text_item: >-
        The structural_premise prose (specification and audit sheet) lists the
        F5 inner alphabets as "M / 4 in 2, 4, 8, 32"; 16 (CELL-K19 at M = 64)
        is missing. Prose only; the code computes M // 4 correctly.

    rv1_sr6_against_degenerate_rows_and_ptm_f:
      verdict: holds
      mechanism: >-
        A reading is EXACT only if every used conditioning cell is a point
        mass. A pair whose sum is an exceptional point puts the exceptional
        label into a used cell as a second sum label, which breaks that
        cell's point mass, so the reading is not EXACT. An exceptional label
        can enter the used-cell image as a cell coordinate only if about
        MIN_CELL pairs share it, which needs a mass f with f S of about 1600
        or more. Then exp(-f S) makes an all-avoiding seed impossible. So on
        any EXACT reading of a near-exact label the used-cell image lies in
        the exact quotient's labels.
      measured: >-
        Near-exact labels on Z/(4 x 1999), K13 shape: EXACT on 144, 56 and 20
        of 400 seeds at M = 8 (k = 1, 2, 3), with used-cell image size 4 on
        every one; the version-3 whole-support clause would have fired on 123,
        55 and 20 seeds. For k = 2 (the F5xF4-at-M = 8 pattern) that is 0.1375
        per seed, about 0.77 per ten-seed run, which independently reproduces
        DEC-20260929-585602 D-1 (about 0.75). K41 shape: the two-point label
        EXACT on 300 of 300 seeds with image 4; the 1.7e-4 mass pattern never
        EXACT; the F5xF4-like label twice EXACT, image 4. sr6_check with NO
        exemption table: 0 fires in 2000 resampled runs over every null,
        near-exact and degenerate-pattern label. The REGULAR F5xF4 rows nearest
        the threshold (K19 M = 16, 1.77 percent; K13 M = 16, 7.17 percent)
        cannot read EXACT. Each of their 16 used cells has about 2000 pairs
        with about 1.8 percent off-function sums.
      exemption_by_name: >-
        Present and correctly limited to the three DEGENERATE rows. By the
        mechanism above it is not needed for SR-6, and it does no harm.
      degeneracy_rule: >-
        degeneracy.classify marks every PTM-F object DEGENERATE (k of 7995
        points; masses 0.0076 and 1.7e-4).

    rv2_pc16c_and_ir23:
      verdict: BREAKS (artifact "L2 left without a blocking control")
      what_holds: >-
        PC-16c is outside z_ladder.passed and the clearance. Its failure blocks
        LEAD only (families.stage3 lead_guard_passed) and voids no NEG, so the
        version-3 D-2 voiding is gone. Its false-fail is about 0 (0 of 3000
        resampled runs; the producer bound is 0.0092).
      the_break: >-
        PC-16c as frozen does not exercise L2. Decay probe on Z/l' (l' = 1999,
        130859, 2095837) at M = 16, the PC-16c law, 300 seeds per prime, 3000
        resampled runs. At the third cell (rho = 0.4) the planted mixture's
        median E_Sh/W is 0.75 and L1 and L3 hold in 0 of 400 runs; at the
        second cell (rho = 0.7) both hold in every run (E_Sh/W 5.96). So
        P(L1 and L3 at all three) = 0 of 3000. With L2 replaced by "always
        holds", P(LEAD) is still 0 of 3000. The guard's verdict is decided by
        L1/L3 at rho = 0.4, and an L2 that never rejects anything would pass
        it. No other control exercises L2's false-pass direction. PC-16,
        PC-16b and PC-16d all require L2 to HOLD, so "always holds" passes
        them too.
      contract_text_contradicted: >-
        IR-23(c) "PC-16c tests only L2's false-pass direction. L2 stays guarded
        by a blocking control for the branch it governs"; rv2_route.chosen "L2
        stays guarded by a blocking control for the branch it governs (PC-16c
        for LEAD)"; revision_discharge RV-2 "L2 kept guarded by a blocking
        control for LEAD (PC-16c)"; rule_sweep L2 "guard - PC-16c (rho 1, 0.7,
        0.4) blocks LEAD if a planted decay of that size reads LEAD".
      on_the_LEAD_path: >-
        Declared roles reach LEAD at the curve-path lead keys (CELL-K13 M =
        16, CELL-K19 M = 64, CELL-K23 M = 128), where M and S grow along the
        ladder. On the permitted lead shapes Z/(4 l'), read through the
        committed classify_family over the three lead keys (2000 runs), XF
        decays in planted strength read LEAD: rho = 1, 0.9, 0.8 in 2000 of
        2000 (E_Sh/W 10.3, 15.6, 17.6, so Z grows); rho = 1, 0.8, 0.6 in 93
        percent; rho = 1, 0.7, 0.6 in 84 percent. The PC-16c-like decay rho =
        1, 0.7, 0.4 is never LEAD there either, again because L1 fails at the
        third shape (P(L1) = 0), not because of L2. Z = E_Sh / V_s scales with
        the instrument's resolution, which grows with M and S, so a
        resolution-standardised slope reads as non-decay any filter whose
        strength falls more slowly than resolution rises. The contract's
        LEAD-reach sentence reports this weakness only on Z/l at fixed M = 16
        ("rho = 1, 0.9, 0.8 read LEAD in 1 of 20 design replicates ... about
        0.046"). On that path my exact figure is 0.118 (0.123 in 3000 runs,
        agreeing with DEC-20260929-585602's 0.117); the producer's 0.046 comes
        from 7 of 200 per-seed slopes, whose binomial interval includes my
        0.060. On the LEAD path the same decay is LEAD in essentially every
        run.
      consequence_scope: >-
        No NEG is affected and a null run is unaffected. The exposure is the
        LEAD branch's specificity. A declared role whose excess decays along
        the ladder, slowly in rho, reads LEAD with high probability and opens
        the SR-4 route (a max-tier round of about 43200 s and an independent
        replication of about 80000 CPU-s, per lead_route_contingent), with no
        control in the run able to show that L2 let it through. SR-4 routes
        LEAD to review and replication BEFORE interpretation, so this is a
        cost-and-specificity defect, not a path to an unreviewed claim.
      cheapest_remedy: >-
        Choose the guard's decay so that L1 and L3 hold at all three cells and
        only L2 can reject it. Then add a design-time mutation criterion: the
        guard must FAIL when clause_L2 is replaced by "always holds". On
        permitted primes at M = 16: rho = 1, 0.8, 0.7 gives P(LEAD) 0.0007 in
        3000 runs (exact 4.0e-4) and with L2 mutated 1.0; rho = 1, 0.8, 0.65
        gives 0 in 3000 (exact 1.0e-6) and mutated 1.0. Re-verify on the
        declared Z/l primes at S0. Correct the IR-23(c), rv2_route, RV-2 and
        rule_sweep sentences. Re-scope the LEAD-reach sentence to the curve
        path with its measured rate there, or add a curve-path decay guard on
        the ISO lead shapes, or redefine L2 on a resolution-invariant
        quantity. The choice belongs to the designer; any of these is local.

    iv_planted_filters:
      setting: >-
        XF(rho) (exact-free) on the permitted lead shapes Z/(4 x 1999) at M = 16,
        Z/(4 x 130859) at 64, Z/(4 x 2095837) at 128, read as family arms (ten
        within-stratum shuffles, the exact-saturated null), classified by the
        committed classify_family over the three lead keys, 2000 resampled
        runs (pools 400, 65 and 39 seeds). The stated XF NEG-path floors (0.7,
        0.5, 0.5) correspond to standardised excess e_f = 3.77, 3.13 and 5.29 W
        (median E_Sh/W at the floor rho). Multiples use the grid rho nearest k
        e_f. At K13 the largest attainable is 10.3 W (rho = 1), so 4x is capped
        there.
      table:
        - {config: 'OWN 1x (rho 0.7, 0.5, 0.5)', P_L3_per_shape: '0.992, 0.627, 1.0', P_L1_per_shape: '0, 0, 0.10', verdicts: 'ART-RES 1.0', false_NEG: 0.0}
        - {config: 'FLAT 1x (common 5.29 W; rho 0.8, 0.6, 0.5)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '0, 0.03, 0.08', verdicts: 'ART-RES 1.0', false_NEG: 0.0}
        - {config: 'OWN 2x (rho 0.9, 0.6, 0.6)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '0.31, 0.03, 1.0', verdicts: 'LEAD 0.0125, ART-RES 0.9875', false_NEG: 0.0}
        - {config: 'FLAT 2x (common 10.58 W; rho 1, 0.8, 0.6, K13 capped)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 0.93, ART-RES 0.07 (L2 fails 7 percent)', false_NEG: 0.0}
        - {config: 'OWN 4x (rho 1, 0.8, 0.9, K13 capped)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 1.0', false_NEG: 0.0}
        - {config: 'FLAT 4x (common 21.15 W; rho 1, 1, 0.9, K13 and K19 capped)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 1.0', false_NEG: 0.0}
        - {config: 'GROWING 1x, 2x, 4x (rho 0.7, 0.6, 0.9)', P_L3_per_shape: '0.9955, 1, 1', P_L1_per_shape: '0, 0.04, 1.0', verdicts: 'ART-RES 1.0 (L1 fails at K13)', false_NEG: 0.0}
        - {config: 'DECAYING 4x, 2x, 1x (rho 1, 0.6, 0.5)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 0.035, 0.09', verdicts: 'ART-RES 1.0; L2 holds 0.5 percent; with L2 forced LEAD 0.15 percent', false_NEG: 0.0}
        - {config: 'PC-16c-like decay (rho 1, 0.7, 0.4)', P_L3_per_shape: '1, 1, 0.19', P_L1_per_shape: '1, 1, 0', verdicts: 'ART-RES 1.0; never LEAD, decided by L1 at K23, not by L2', false_NEG: 0.0}
        - {config: 'version-3 slow decay (rho 1, 0.9, 0.8)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 1.0 (L2 holds in every run)', false_NEG: 0.0}
        - {config: 'decay rho 1, 0.8, 0.6', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 0.93', false_NEG: 0.0}
        - {config: 'decay rho 1, 0.7, 0.6', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 0.84', false_NEG: 0.0}
        - {config: 'control XF(1) at all three (PC-16d XF)', P_L3_per_shape: '1, 1, 1', P_L1_per_shape: '1, 1, 1', verdicts: 'LEAD 1.0', false_NEG: 0.0}
      false_NEG_at_each_multiple: >-
        For a filter present at all three lead keys, NEG (L3 at none) occurred
        in 0 of 2000 runs at 1x, 2x and 4x. Per key at 1x the stated floor,
        L3 misses in 0.8 percent (K13 M = 16), 37.3 percent (K19 M = 64) and 0
        percent (K23 M = 128). At 2x and 4x, 0 percent at every key.
      reading_against_the_plan: >-
        "LEAD reachable exactly as L2 is pre-registered": yes. Wherever L1 and
        L3 hold at all three keys, LEAD follows L2's non-decay rule. "A
        PC-16c-like decay never LEAD": yes, but via L1 at the third shape,
        not L2. Slower decays in strength read LEAD at 84 to 100 percent
        (rv2_pc16c_and_ir23).

    rv4_neg_path_floor:
      verdict: holds, with one precision objection
      check: >-
        The C-6 floors are measured on the NEG path (stratified shuffle,
        exact-saturated null, L3, on permitted groups of each shape), and my
        independent measurement agrees with them to one grid step. Floor
        distribution over 2000 realisations: XF at K13@16 is 0.7 in 97.9
        percent (stated 0.7); at K19@64 it is 0.5 in 65.3 and 0.6 in 34.8
        percent (stated 0.5); at K23@128 0.5 in 81.6 and 0.4 in 18.5 percent
        (stated 0.5). XC at K13@16 is 0.9 in 76.5 and 0.8 in 23.5 percent
        (stated 0.9); 0.6 at K19@64 (99.5 percent); 0.5 at K23@128 (100
        percent).
      precision_objection: >-
        The floor is one realisation's "smallest grid rho with L3 at it and
        above". At K19 M = 64 the quoted XF floor 0.5 resolves L3 in only 65
        percent of runs. A planted mixture at the quoted floor is missed 35
        percent of the time there, so the NEG sentence "resolved by L3 from
        rho = 0.5 at K19 M = 64" overstates. A floor defined by a resolution
        probability (the smallest grid rho with P(L3) at least 0.95 over
        replicated realisations) would read 0.6 at that shape and leave the
        others unchanged. Non-breaking under the plan; the sentence itself is
        J4's.

    rv5_lead_reach_and_effective_floor:
      verdict: holds for reach, with a scoping objection
      reach: >-
        PC-16d is a curve-path LEAD-reach control. XF(1) and XC(1) classify
        LEAD in 2000 of 2000 runs; exact L2 failure 4e-32 (XF) and 0 (XC);
        L1 margin at K13 M = 16 with E_RL/W minimum 3.86, 5th percentile
        4.57, median 5.32 against 3. PC-16 and PC-16b reach LEAD on Z/l as
        stated.
      effective_LEAD_floor: >-
        The stated offsets 4.40, 3.41 and 2.34 W (effective floors about 7.4,
        6.4 and 5.3 W) are single-realisation design figures. My medians over
        2000 runs are about 4.9, 2.9 and 2.7 W (floors about 7.9, 5.9 and 5.7
        W), so the figure moves by about 0.5 W in either direction with the
        realisation of W. That is acceptable as a design figure; it should be
        quoted with its spread.
      scoping_objection: >-
        The LEAD-reach sentence scopes L2's weakness with a Z/l fixed-M rate
        (about 0.046) that is low by about 2.5x even on Z/l (0.118) and does
        not describe the curve path, where the same decay reads LEAD about
        always (rv2_pc16c_and_ir23). The rate is J3's; the sentence is J4's.

    v_reachability_from_generative_quantities:
      method: >-
        For each declared role at each key: the label's marginal (fixed by its
        definition), the IR-12 used mass it implies, and the best-case
        stratified excess any assignment with that marginal can reach, M
        minus the median stratified-shuffle G. The shuffle median depends only
        on the per-stratum label multiset. That is compared with the 3 W L3
        needs. Marginals are taken from uniform n-bit strings (no curve) and
        cross-checked against the frozen C-4 degeneracy figures.
      F5xF4_LEAD_unreachable: >-
        F5xF4 = 4 t + h4 with t the top r - 2 bits of the least cyclic
        rotation. At CELL-K13 M = 16 (a lead key), t = 0 on 92.8 percent of the
        points (C-4: 574 of 8011 off; uniform 13-bit strings 1 - L_13 / 2^13 =
        0.936). Best-case stratified excess with the on-curve fraction is 0.59
        W median (5th to 99th percentile 0.44 to 0.73; maximum 0.83 in 1000
        runs). With the string marginal it is 0.48 W (maximum 0.63 in 200
        runs). L3 needs 3 W. So L3 can never hold for F5xF4 at the K13 lead
        key, and F5xF4 can never be LEAD. The code-path dry call C-7 shows
        "F5xF4 LEAD true" with synthetic statistics, which is true of the code
        and false of the role.
      F5xF4_blind_rows_not_flagged: >-
        Best-case stratified excess for F5xF4: K19 M = 16 0.30 W (REGULAR,
        c_4/N = 0.0177); K23 M = 32 2.72 W median (exceeds 3 W in fewer than 1
        realisation in 10, even with a perfectly structured t); K23 M = 16 0.10
        W and K41 M = 16 0 W (DEGENERATE, flagged); K19 M = 64 13.9 W and K23 M
        = 128 26.6 W (reachable). Only the three DEGENERATE rows are declared
        uninformative. The NEG of F5xF4 at K13 M = 16 and K19 M = 16 is equally
        uninformative beyond the exact component and is not flagged.
      F5xF4_heur_b2_fixed16_unfalsifiable: >-
        F5xF4's fixed-alphabet held-out test has premise "no L3 at M = 16 on
        K13, K19, K23" and consequent "no L3 at K41 M = 16". Every one of
        those keys is blind for F5xF4, so the test is always defined, always
        "premise true, consequent true", and can never falsify HEUR-B2 for
        this role. That bears on C7 ("H2 measured") for one role.
      other_roles: >-
        Every other declared Koblitz role reaches L3 (best-case excess many
        times 3 W) at every lead key, so NEG, LEAD, ART-RES and ART-DEF are all
        generatively reachable. Ordinary roles reach NEG, ART-RES and ART-DEF.
        IR-12 cannot make any declared role ART-DEF: the smallest expected
        used mass is 0.77 (F5xF1 at K23 M = 16) and every other is at least
        0.78 against 0.5.
      verdict: >-
        BREAKS (artifact "a declared outcome no data can reach") for F5xF4 and
        LEAD. Precedent: version 3's D-8 (vacuous NEG) was composed
        non-breaking. This instance is a declared outcome closed by the role's
        own definition, contradicting the RV-3 reading "every declared arm can
        reach every outcome its table assigns" when read generatively, which
        is the half of RV-3 J3 owns. The composer weighs it.
      cheapest_remedy: >-
        Record that F5xF4's LEAD branch is closed by its own marginal (or drop
        it from the LEAD-eligible roles). Flag its NEG at K13 M = 16 and K19 M
        = 16 (and K23 M = 32) as uninformative beyond the exact component, by
        a best-case-excess criterion (M minus the shuffle median below 3 W)
        alongside the 1 percent degeneracy cut. State that its fixed-alphabet
        HEUR-B2 test is undefined.

    vi_rv13_pricing:
      verdict: holds under the null; one uncharged term outside it
      check: >-
        The specification prices at most 1.0116 attempts per clean run (about
        260600 CPU-s for a clean run) and an SR-5/SR-6 contingent review cost
        below 0.002 s under the null. My table gives 1.0006 attempts (point),
        at most 1.048 (conservative), and SR-5/SR-6 null rates of 0, so both
        agree. The LEAD route's cost is priced as contingent (about 43200 s of
        max-tier review plus about 80000 CPU-s of replication).
      uncharged_term: >-
        The probability that the LEAD route opens under a non-null alternative
        is not priced, and on the LEAD path it is high for slowly decaying
        planted filters (rv2_pc16c_and_ir23). RV-13 asked for the contingent
        cost under the null, which is met; this is a cost-model observation,
        not an RV-13 defect.

    design_conditions_in_the_rules:
      C1: >-
        Holds. No outcome row states a below-rho cell (table_note), and SR-4
        routes any LEAD to review-breakthrough at max and independent
        replication before interpretation, with no interpretation written.
      C5: >-
        Holds in the rules. The halving criterion is re-derived from the group
        law (Curve.in_2E docstring; definitions.halving_and_the_exact_filters);
        nothing is relayed through IDEA-20260922-1b16d7 or IDEA-20261001-39014f.
        Wagner and FHLM at source were not re-read here (J4/J1).
      C7: >-
        Holds in the rules, except that HEUR-B2 is not measured for F5xF4 at
        the fixed alphabet (its held-out test cannot falsify, see
        v_reachability). H1's validation plan is committed and fires at about
        0.02 under its own model by construction.

  # ---------------------------------------------------------------------------
  ptm:
    failure_signature_quoted: >-
      PTM-D collapses (a) and preserves (b). PTM-E reads NEG on both labels.
      PTM-F reads NEG at every k, is marked degenerate, and SR-6 does not
      fire.
    PTM-D:
      performed: true
      object: >-
        (a) The exact label i mod M on Z/(M l') with strata i mod q, and (b) the
        planted marginal-only label on Z/(q l'). Both at every declared (q, M)
        shape (K13 16 and 8; K19 64 and 16; K23 128, 32 and 16; K41 16; O19 64
        and 16) at the declared S, ten seeds, with ten within-stratum shuffles
        and the exact-saturated null (and the uniform null for (b)'s kept
        test).
      result: >-
        (a) G = M exactly at every shape. The stratified-shuffle median
        collapses onto the saturated null, from 0.06 W to 0.28 W above its
        q50 and at or below q99 on every seed, at all ten shapes. (b) The
        marginal is preserved: shuffle median above the uniform q50 by 9.9 to
        32.8 W_u (at least 3 needed), median E_Sh/W from -0.20 to 0.23, L3
        false at every shape (at most 2 of 10 rank-floor seeds).
      meets_failure_signature: true
    PTM-E:
      performed: true
      object: >-
        (i) A weight-class label whose every class is parity-pure (w ~
        Binomial(n, 1/2) conditioned on w = e mod 2, label 2 class + parity),
        and (ii) XCO2 = 4 r + h4 with r from the skewed law. Both on Z/(4 l')
        at every Koblitz key (K13 16, 8; K19 64, 16; K23 128, 32, 16; K41 16),
        read as family arms and classified by classify_family over the lead
        keys.
      result: >-
        NEG in 2000 of 2000 resampled runs for both. L3 never held at any key.
        L1 held for XCO2 at most keys (the skewed residual against the
        saturated null, as the contract states) and for the parity-pure label
        at some; L1 enters no NEG.
      meets_failure_signature: true
    PTM-F:
      performed: true
      object: >-
        h4 refined on k = 1, 2, 3 exceptional points (labels 4 + e there) on
        Z/(4 x 1999) at M = 8 and 16, the two-point label at every Koblitz
        key, and pseudo-random exceptional sets of mass 0.0076 (K23 M = 16
        pattern) and 1.7e-4 (K41 M = 16 pattern). Fed to sr6_check with no
        exemption table, to the stratified comparison, to classify_family over
        all Koblitz keys, and to degeneracy.classify.
      result: >-
        SR-6 fired 0 times; every EXACT reading had used-cell image size 4.
        L3 never held (median E_Sh/W 0.00). The two-point label classified NEG
        in 2000 of 2000 runs over all Koblitz keys. degeneracy.classify marked
        every object DEGENERATE. The version-3 clause would have fired on 206
        of the 528 EXACT readings, which is the defect RV-1 removed.
      meets_failure_signature: true

  # ---------------------------------------------------------------------------
  claim_under_review: >-
    J3 of REVIEW-BINSTD-B-20261002-d08b44, items i to vi, as the plan states
    them. Version 4's stopping, invalidation and admission rules leave a
    correctly functioning null run cleanly classified (P(clean) at least 0.8,
    every rule at or below 0.05). SR-6 is kept off near-exact degenerate rows
    with a near-exact control declared. L2 is kept guarded while NEG is no
    longer voided at the version-3 rate. NEG is read on a floor measured on the
    NEG path. LEAD is reached exactly as pre-registered. RV-13 is priced.
  objections:
    - id: O-1
      severity: breaking (plan J3 artifact "L2 left without a blocking control")
      text: >-
        PC-16c as frozen is insensitive to L2. Its decay fails L1 and L3 at
        the third cell in every run, so the guard passes with L2 replaced by
        "always holds" (0 of 3000 LEAD either way). No other blocking control
        exercises L2's false-pass direction. IR-23(c), rv2_route, the RV-2
        discharge and the rule_sweep assert the opposite.
      evidence: computations.json outputs out/res_decay.json (guards "PC-16c AS FROZEN", per_rho_Z_l_reference)
      remedy: rv2_pc16c_and_ir23.cheapest_remedy
    - id: O-2
      severity: breaking (plan J3 artifact "a declared outcome no data can reach")
      text: >-
        F5xF4 cannot reach LEAD: at the CELL-K13 lead key its best-case
        stratified excess is 0.59 W against 3 W. Its NEG at K13 M = 16 and K19
        M = 16 is uninformative and unflagged, and its fixed-alphabet HEUR-B2
        test cannot falsify.
      evidence: out/res_iso.json reachability_F5xF4_like; out/res_reach_k13_curvefrac.json; marginals.json; the frozen C-4 summary (574 of 8011; 9274 of 523491)
      remedy: v_reachability_from_generative_quantities.cheapest_remedy
    - id: O-3
      severity: material, non-breaking under the plan (rates for RV-5 scoping; the sentence is J4's)
      text: >-
        On the LEAD path L2 does not separate decaying planted filters (rho =
        1, 0.9, 0.8 LEAD 100 percent; 1, 0.8, 0.6 93 percent; 1, 0.7, 0.6 84
        percent). The contract's quoted rate for that decay (about 0.046) is
        off-path and low by about 2.5x even on Z/l at fixed M = 16 (0.118).
      evidence: out/res_planted.json; out/res_decay.json (version-3 guard row)
    - id: O-4
      severity: minor, non-breaking (RV-4 precision)
      text: >-
        The XF NEG-path floor at K19 M = 64 (0.5) resolves L3 in 65 percent of
        realisations; the quoted floors are single realisations without a
        resolution probability.
      evidence: out/res_iso.json own_neg_path_floor_hist and L3_rate_by_rho
    - id: O-5
      severity: minor (prose)
      text: >-
        The structural_premise lists the F5 inner alphabets as 2, 4, 8, 32 and
        omits 16. The effective LEAD floor offsets are single-realisation
        figures that move by about 0.5 W with W.
  required_controls:
    - >-
      An L2 guard whose planted decay keeps L1 and L3 at all three cells (for
      example rho = 1, 0.8, 0.7 or 1, 0.8, 0.65 at M = 16 on the Z/l ladder),
      with its false-fail computed and a design-time mutation criterion: the
      guard must fail when clause_L2 is replaced by "always holds".
    - >-
      A LEAD-specificity statement measured on the curve path at the lead
      alphabets (or a curve-path decay guard on the ISO lead shapes, or an L2
      on a resolution-invariant quantity).
    - >-
      A best-case-excess flag for blind rows (M minus the stratified-shuffle
      median below 3 W), covering F5xF4 at K13 M = 16, K19 M = 16 and K23 M =
      32, with F5xF4's LEAD recorded as unreachable.
  counterexample_or_mutation: >-
    MUTATION. Replace est.clause_L2's verdict by "holds" and re-read PC-16c on
    the permitted Z/l ladder at M = 16 (rho = 1, 0.7, 0.4). PC-16c still
    passes in 3000 of 3000 resampled runs, exactly as with the real L2. The
    same mutation applied to the guard rho = 1, 0.8, 0.7 turns 0.07 percent
    LEAD into 100 percent. COUNTEREXAMPLE. On the curve-path lead shapes the
    planted decay rho = 1, 0.9, 0.8 reads LEAD in 2000 of 2000 runs.
  cheapest_falsification: >-
    Of the contract's claim that L2 is guarded: the L2 mutation above. It
    costs about 30 s of CPU on the stored per-seed records (about 6 min to
    regenerate on four cores) and needs no curve. Of the F5xF4 LEAD branch:
