  survived_attack: >-
    Partly. The null false-fire machinery, the SR-6 repair, the
    voiding-separation of PC-16c, the NEG-path floors and the structural
    premise survived my best attack and agree with an independent
    implementation. The claim that L2 remains guarded did not survive (a
    one-line mutation), and neither did the reading that every declared role
    can reach every outcome (F5xF4 cannot reach LEAD). Remaining uncertainty,
    named. (a) My rates and the producer's come from permitted groups
    transferred by shape, and neither side measured the declared groups. (b)
    The resampled run counts rest on finite pools (39 seeds at K23 M = 128,
    65 at K19 M = 64), so zero-event bounds there are indicative, not
    independent-run Clopper-Pearson bounds. (c) The F5xF4 bound uses the
    on-curve fraction from C-4 (J1/J5 check it) and the marginal of the
    inner label, not its joint law, which cannot raise the bound. (d)
    Whether the composer weighs O-2 as breaking given the D-8 precedent is
    a composition question; the plan lists the artifact.
