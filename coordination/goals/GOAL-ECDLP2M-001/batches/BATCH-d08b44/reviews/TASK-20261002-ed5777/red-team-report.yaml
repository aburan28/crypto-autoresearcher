    longer voids NEG. The quoted NEG-path floors are reproduced to one grid
    step. However, PC-16c does not test L2, L2 does not separate slowly
    decaying planted filters on the LEAD path, and F5xF4 cannot be LEAD.
    Nothing here bears on any curve's security, any filter's existence on a
    declared cell, or any k-list cost.
