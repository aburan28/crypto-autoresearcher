  verdict_J3: breaks
  verdict_summary: >-
    J3 BREAKS on two of the plan's frozen J3 breaking artifacts, and holds on
    the rest. (1) "L2 left without a blocking control" (RV-2, IR-23(c)): the
    version-4 PC-16c guard, with its strengthened decay rho = 1, 0.7, 0.4, never
    reaches the point where L2 decides. Its third cell fails L1 and L3 in 3000
    of 3000 resampled runs. Replacing L2 by "always holds" leaves PC-16c
    passing in 3000 of 3000 runs, so a false-pass defect in L2 is invisible to
    the only control said to guard it. The contract states the opposite
    (IR-23(c) "PC-16c tests only L2's false-pass direction. L2 stays guarded
    by a blocking control for the branch it governs"; rv2_route; RV-2
    discharge). On the path a declared role's LEAD is actually read on (the
    curve-path lead keys at M = 16, 64, 128), L2 also does not separate
    decaying planted filters: rho = 1, 0.9, 0.8 reads LEAD in 2000 of 2000
    runs, rho = 1, 0.8, 0.6 in 93 percent. The contract's quoted rate for that
    decay (about 0.046) is measured off-path, on Z/l at fixed M = 16, and is
    itself about 2.5 times too low there (0.118). (2) "A declared outcome no
    data can reach" (RV-3 from generative quantities): F5xF4 can never be
    LEAD. Its inner label is constant on 92.8 percent of CELL-K13's points at
    the lead key M = 16 (C-4: 574 of 8011 off). The best-case stratified
    excess any assignment with that marginal can reach is 0.59 W (maximum
    0.83 W in 1000 runs) against the 3 W L3 needs. The same role is
    equally blind at CELL-K19 M = 16 (0.30 W). Neither row is flagged
    uninformative, and F5xF4's fixed-alphabet HEUR-B2 held-out test can never
    be falsified. WHAT HOLDS. The null false-fire table: my independent table,
    written before the producer's was opened, agrees with it rule by rule
    within the stated bounds. Every stopping, invalidation and admission rule
    is computed and at or below 0.05 (largest about 0.0006 point, PC-16b), and
    P(clean) is 0.9994 point (0.954 conservative) against the producer's 0.9886
    union bound. The structural premise holds. SR-6 as revised cannot fire on
    near-exact or degenerate rows (0 fires in 528 EXACT near-exact readings;
    the version-3 clause would have fired on 206). PC-16c can no longer void
    NEG. The NEG-path floors are measured on the NEG path. PTM-D, PTM-E and
    PTM-F each meet the failure signature. RV-13 is priced under the null and
    agrees with my table. Every remedy is local and cheap (objections O-1 to
    O-3). The plan's own prior placed the most likely J3 break at the
    false-fire table and the second most likely at "an RV-2 remedy that
    separates PC-16c from clearance and leaves L2 without a blocking control".
    The first did not break; the second did.

