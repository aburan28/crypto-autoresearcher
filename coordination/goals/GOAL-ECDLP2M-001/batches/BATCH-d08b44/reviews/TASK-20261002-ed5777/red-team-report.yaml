    - O-2 (breaking under the plan's artifact list; precedent noted)
    - O-3 (material)
    - O-4 (minor)
    - O-5 (minor)
  narrowest_supported_statement: >-
    On permitted groups of the declared shapes, read through the committed
    decision code, version 4's stopping, invalidation and admission rules
    leave a correctly functioning null run cleanly classified with
    probability about 0.999 (every rule at or below about 6e-4 point). SR-6
