      refutation at that rate should be read with that prior.
  cost_model_challenges:
    - >-
      Uncharged term: the probability that the LEAD route (about 43200 s of
      max-tier review plus about 80000 CPU-s of replication) opens on a
      non-null, slowly decaying role. On the LEAD path it is high, and no
      control in the run can show L2 let it through.
    - >-
