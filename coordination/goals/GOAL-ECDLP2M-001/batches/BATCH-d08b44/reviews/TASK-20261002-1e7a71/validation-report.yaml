        Discharged. Exhaustive n = 23 purities reported (item iii); the DF-8
        type-II acceptance at n = 23 is stated load-bearing for F3@0
        (specification definitions.df8_load_bearing_note, DF-8), and I
        confirmed the claim independently - F3@0 purity_2 is 1 at M = 128, 32
        and 16 under the fallback field t^23 + t^5 + 1 (the least irreducible
        trinomial) and 0 under the accepted 13697489; the CELL-O19
        p = 4 R-M boundary is stated in prose, and my arithmetic gives
        log2(261823) / 4 + 1/2 = 4.999558, 0.00044 below 5, so M = 16 by the
        exact integer test and 32 under two-decimal rounding.
