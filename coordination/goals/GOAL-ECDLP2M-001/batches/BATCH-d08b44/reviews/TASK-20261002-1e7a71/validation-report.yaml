    iv_role_map_and_own_dry_calls:
      code_reading: >-
        CODE-FAM keys every Stage 2 reading by ROLE. stage2_cell zips
        role_names(koblitz) (KOBLITZ_ROLES, twelve fixed names; ORDINARY_ROLES,
        six) positionally onto the label tuple of arms(), whose order is
        F1, F2 at offsets 0, floor((n - r) / 2), n - r, F3 at the same
        offsets, F4, F5xF1, F5xF2@0, F5xF3@0, F5xF4 (ordinary F2 then F3), so
        @mid and @end mean the same object relative to (n, r) on every cell;
        the slot count equals the role count on both cell kinds and the three
        offsets are distinct on every declared (cell, M) (n - r is at least
        9, at CELL-K13 M = 16).
        stage3 classifies exactly KOBLITZ_ROLES with the lead keys (K13, 16),
        (K19, 64), (K23, 128) and ORDINARY_ROLES without; heur_b2_held_out
        iterates KOBLITZ_ROLES with "defined" requiring every involved
        (cell, M) present, valid and estimated; sr6_check reads the
        degeneracy rows by (cell, role, M). One verdict per declared role
        and one L2 interval per Koblitz role whenever its lead keys exist.
      own_dry_calls: >-
        my_drycalls.py builds its own synthetic per-seed statistics keyed by
        the declared cell ids, alphabets and role names (no group element;
        the declared ladder log2 l values enter only as numbers, as in C-7,
        inside the name-grid carve-out) and feeds them to the committed
        families.stage3, heur_b2_held_out,
        sr6_check and stage1_gate.issue_clearance. Results -
        (a) null grid NEG 18, an L2 interval for every Koblitz role, every
        held-out test defined; (b) a LEAD plant at the three lead keys reads
        LEAD for each of the twelve Koblitz roles in turn (the four version-3
        unreachable F2 and F3 mid and end roles included); (c) RENAME - the
        LEAD-planted F2@mid entry at (CELL-K19, 64) renamed to its version-3
        numeric name F2@6 gives F2@mid ART-DEF ("RV-7, a lead key is missing
        or invalidated"), the renamed key is classified as nothing, every
        other role NEG, no voiding; renaming all six F2 and F3 entries at
        (CELL-K23, 128) to numeric names gives ART-DEF for the four mid and
        end roles (the @0 roles keep their key, since the numeric name for
        offset 0 coincides with the role name); renaming a non-lead key
        (F4 at CELL-K13, 8) keeps F4 classifiable (NEG) and makes its ladder
        held-out test undefined; (d) DROP - removing F5xF3@0 at (CELL-K23,
        128) under a LEAD plant gives ART-DEF; removing RLFAM's lead key
        fails PC-15 and voids the run (ART-DEF 18); (e) IR-2 invalid at a
        lead key gives ART-DEF 18; IR-2 invalid at (CELL-K23, 32) leaves NEG
        and undefines the ladder held-out test; (f) a dropped or missing
        ladder cell and a PC-17 failure on CELL-K23 give ART-DEF 18, a PC-17
        failure on CELL-K41 alone leaves NEG 18; (g) a failed PC-16c guard
        turns a planted LEAD into ART-DEF (LEAD-BLOCKED) and voids no NEG;
        (h) an unestimated lead key gives ART-DEF and an unestimated off-lead
        key leaves NEG; (i) ordinary roles - one renamed key leaves NEG on the
        other estimated key, both keys dropped or both unestimated give
        ART-DEF, an excess gives ART-RES; (j) sr6_check exempts a DEGENERATE
        row by name and fires on a REGULAR row with a used image of size 6.
      committed_namegrid_C7: >-
        Reproduced byte for byte (sha256 4369aad6...). Grid of 138 (cell, M,
        name) keys; every Koblitz role reaches NEG, LEAD, ART-RES and ART-DEF
        and every ordinary role NEG, ART-RES and ART-DEF, each with every
        other role NEG in the same scenario; failures []; run-level voiding
        as the sheet states.
      verdict_on_item: pass

    v_rv7_rv8_rv12_in_code:
      RV-7: >-
        In code. classify_role returns ART-DEF for a dropped or voided ladder
        cell (ladder_ok false) and for a missing or IR-2-invalid lead key
        before est.classify_family is reached, NOT-ESTIMATED becomes ART-DEF,
        and an ordinary role with no valid or no estimated (cell, M) is
        ART-DEF; a Koblitz NEG therefore needs all three lead keys estimated
        and an ordinary NEG at least one. Shown by C-7 and by dry calls (c),
        (d), (e), (f), (h), (i).
      RV-8: >-
        Aligned in the text-to-code direction. issue_clearance refuses every
        cell unless each of RUN_LEVEL_REQUIRED (certificate, pc1, pc5,
        gate_K17C, pc6c, z_ladder, pc16d, pc18, calibration_RC1) is present
        with passed True; pc1 carries PC-1 and its PC-6a shuffle check,
        z_ladder carries PC-7 and PC-7c (and PC-16, PC-16b); IR-1, IR-6 (PC-1
        part) and IR-7 now say the run is void. Dry call (k) - the clearance
        is refused when any one of the nine records fails or is missing, when
        the cell's gate fails or belongs to another cell, or when PC-9 fails;
        pc16c is not required.
      RV-12: >-
        In code or assigned. families.stage3 applies IR-17 (PC-15), IR-22
        (PC-17 per cell and in Stage 3), SR-3 and the PC-16c lead block;
        stage2_cell sets ir2_invalid from W and every V_s (IR-2 positivity);
        SR-1's run-level stop is issue_clearance's refusal, and stage2_cell
        raises without a clearance (dry call (l)). The driver must pass the
        PC-17 records, the dropped cells, the PC-16c record and the S0-6
        degeneracy rows, as missing_instruments assigns explicitly. PC-9's
        curve readings go through CurveView (gate_cell), which samples on the
        curve for CELL-K17C instead of through the table the reference uses,
        so a curve-sampler defect is no longer invisible by construction
        (its power is not measured here; J3's domain).
      verdict_on_item: pass

