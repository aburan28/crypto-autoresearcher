    ii_degeneracy_recomputation:
      lineage: >-
        DISJOINT. Own scripts indep_enum.py (CELL-K13, CELL-K19, CELL-K23,
        CELL-O19, exhaustive) and indep_k41.py (CELL-K41, sampled), which
        import no producer module (no binstd_core, families, audit, degeneracy
        or estimator). The field polynomial and normal element are derived
        from the DF-8 text (named polynomial; type-II ONB recurrence with w = t;
        else lowest weight, least integer, least normal element), with my own
        irreducibility test, rank test and GF(2) matrix inverse. The stratum is
        obtained by a DIFFERENT METHOD from the producer's halving
        presentation: a generator g of the cyclic group is found by the
        route-B order test, every point is reached as k g by walking the
        multiples (log/antilog field tables), and the class of P in E/4E
        (resp. E/2E) is k mod 4 (resp. k mod 2). The walk itself re-verifies
        each order (k g returns to the 2-torsion point at k = N/2). On
        CELL-K41, 131072 independent uniform k in [1, N - 1] are mapped to
        k g by a fixed-base comb with extended-Euclid inversion, the class
        again k mod 4.
      definitions_followed: >-
        Labels on affine points only. image size = non-empty label classes;
        smallest and largest class; c_2 (resp. c_4) = the number of affine
        points minus the sum over the cosets of 2E (resp. 4E) of the largest
        number of points of that coset sharing one label; c_q / N with q = 4
        on Koblitz cells and 2 on CELL-O19 and N the affine count; purity_2
        (resp. purity_4) = the fraction of affine points in label classes on
        which the coset of 2E (resp. 4E) is constant; class EXACT-FUNCTION if
        c_q = 0, DEGENERATE if 0 < c_q / N <= 0.01, REGULAR otherwise. Label
        conventions where the specification text is silent (bit order inside
        a window, which end of the least rotation is "leading", the F1
        quantile rounding) were read from CODE-FAM's formulas and re-coded,
        not imported (limitations L-2).
      fields_and_normal_elements_agree: >-
        CELL-K13 t^13 + t^4 + t^3 + t + 1 (8219), w = t + 1 (3); CELL-K19 and
        CELL-O19 the named t^19 + t^5 + t^2 + t + 1 (524327), w = 3; CELL-K23
        the type-II polynomial 13697489, w = t (2); CELL-K41 the type-II
        polynomial 3792463659891, w = t. Identical to the producer's cell_meta
        on every cell; affine counts 8011, 523491, 8383411, 523645 identical.
      exhaustive_rows:
        compared: 96
        agreeing_exactly: 96
