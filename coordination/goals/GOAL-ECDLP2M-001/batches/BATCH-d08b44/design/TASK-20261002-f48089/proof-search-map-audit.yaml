            l-component, floor((i mod l) M / l), with probability rho, else a
            uniform label on M (est.planted_mixture);
          XC(rho), EXACT-CARRYING: q t + (i mod q), with t the same mixture of
            the key at alphabet M / q.
        shape_floor reports, per shape and class, the NEG-PATH FLOOR (the
        smallest grid rho at which L3 holds for it and every larger grid rho),
        the LEAD FLOOR (the same with L1 and L3) and the exact-free offset
