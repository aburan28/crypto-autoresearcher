        def interval_key(l, M):
            """The log-interval key i -> floor(i M / l) (carried)."""
            return lambda i: (i * M) // l


        def z_ladder(seeds=est.SEEDS, rhos=RHOS, ladder=Z_LADDER, prefix="CELL-Z-"):
