        """CODE-NEGP, negpath.py, of EXP-BINSTD-811a2e (version 4): the
        curve-path (NEG-path) controls of RV-4 and RV-5.

        On a group of a declared Stage 2 cell's SHAPE, Z/(q l) with strata
        i mod q (q = 4 for a Koblitz cell, 2 for CELL-O19), at the declared
        alphabet M and the declared S, two planted filter classes are read
