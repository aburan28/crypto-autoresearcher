      - {id: DF-1, subject: the presentation of the E/4E filter, status: carried}
      - {id: DF-2, subject: the composite alphabets constructed, status: carried}
      - {id: DF-3, subject: order proofs by route, status: carried}
      - {id: DF-4, subject: uniform sampling with the abscissa 0 at probability one half, status: carried}
      - {id: DF-5, subject: the l_fibre and l_image conventions, status: carried}
      - {id: DF-6, subject: evaluating h4 by halving, status: 'carried; supplies the stratum of every Koblitz arm, gated by PC-4b'}
      - {id: DF-7, subject: the stratified null, status: 'carried (generalised to every curve-cell arm in version 3)'}
      - {id: DF-8, subject: the field polynomial and normal basis made executable, status: 'carried; RV-14 - the type-II acceptance at n = 23 is load-bearing for F3@0 (EXP-BINSTD-811a2e definitions.df8_load_bearing_note)'}
      - id: DF-9
        subject: F1 is a mixed object (carried)
        finding: The parity of F1's normal-basis weight is Tr(x) (FHLM 4.2), which is h2 on the a = 0 cells; F1 carries the exact E/2E bit on its parity-pure classes.
      - id: DF-10
        subject: a label that uses few of its M values reads a large G (REVISED)
        finding: >-
          G = M x max p counts an unused alphabet, so a label with image size m
          below M reads G of at least M / m. SR-6 now reads the image over the
          labels of USED conditioning cells (CD4-3), and L3 is unaffected
          because the shuffle preserves the image.
      - id: DF-11
        subject: near-exact degenerate rows (NEW, RV-1)
        finding: >-
          A row that is an h4 function except on a set of c_q points reads
          EXACT on a seed whose S sums avoid that set (probability about
          exp(-S c_q / N)). C-4 finds three such rows, all F5xF4 (CELL-K13 M = 8,
          c_4 = 2; CELL-K23 M = 16, 63712; CELL-K41 M = 16, about 1.63e-4 of
          the points); only the first has a material per-seed chance (0.129).
      - id: DF-12
        subject: the exact-free offset of L1 (NEW, RV-5)
        finding: >-
          For an exact-free arm, E_RL = E_Sh - (q50 of the saturated null - the
          median shuffle median); the second term is positive because the
          saturated null itself carries the exact component. C-6 measures it
          at 4.40, 3.41 and 2.34 W at the three lead shapes (1.42 to 7.98 W
          across all shapes), and within about 0.16 W of 0 for exact-carrying
          labels, so the effective LEAD floor for exact-free arms is about 7.4,
          6.4 and 5.3 W of stratified excess.

  # ===========================================================================
  # PASS CRITERIA, STATED BEFORE EXECUTION (the version-3 text carried, with
  # the version-4 changes marked). Placed in SR-1 and IR-1 to IR-25 of
  # EXP-BINSTD-811a2e. A change after a run begins requires a versioned
  # protocol_amendment (IR-16). Notation as version 3 - uniform gate null
  # q50_u, q99_u, W_u over 200 pooled draws; family null the exact-saturated
  # label q r + e over 500 pooled draws with q50, q99, W and per-seed V_s;
  # EXACT is G == M with every used conditioning cell a point mass; OCCUPIED
  # is at least half of the M^2 cells used and no more excluded than used.
  # ===========================================================================
  pass_criteria_stated_before_execution:
    run_level:
      - {id: PC-CERT-1, criterion: 'alphabets below l exactly [1, 2, 4] with 2 bits; six divisors of 4l; the subgroup gives [1] and 0 bits', on_failure: IR-19}
      - {id: PC-CERT-2, criterion: 'divisors exactly 2^0 to 2^17; 16 bits below the order', on_failure: IR-19}
      - {id: PC-CERT-3, criterion: 'the twelve divisors of 130972 exactly; below 239 exactly [1, 2, 4, 137]; log2(137) bits', on_failure: IR-19}
      - {id: PC-CERT-4, criterion: 'the three malformed factorisations each raise ValueError (guard scope probable-prime, RV-10, stage_0.capacity_certificate)', on_failure: IR-19}
      - id: PC-1
        arm: the low log2(M) bits on Z/2^17 at M in 8, 16, 32, 64, 128 at S = 2^s(M), seeds 0 to 9 (carried)
        criterion: EXACT and OCCUPIED on every seed; the median of its ten unstratified shuffles at most q99 of ten uniform draws per seed (pooled over the seeds), on every seed
        on_failure: IR-1 (run void; RV-8)
      - id: PC-5
        arm: dlog mod 548 and dlog mod 956 on CELL-K17C at S = 2^26 and 2^27, seed 0 (carried)
        criterion: G == M, no non-exact used cell, at least half of the M^2 cells used
        on_failure: IR-4
      - id: PC-6c
        arm: carried. The exact label i mod M on Z/(16 x 2003) at M = 16 and Z/(64 x 2003) at M = 64, strata i mod 4, stream "pc6c", ten stratified shuffles per seed, against the exact-saturated null 4 r + (i mod 4)
        criterion: the direct reading EXACT and OCCUPIED on every seed, and on every seed the median of its ten stratified shuffles at most q99 of the saturated null
        on_failure: IR-20 (run void)
      - id: PC-7
        arm: the log-interval key on Z/lZ at every ladder prime and declared alphabet, seeds 0 to 9 (carried)
        criterion: the median over seeds of G at least M / 3 and below M; L1 and L3 hold for the key at that (l, M)
        on_failure: IR-7 (run void; RV-8)
      - {id: PC-7c, arm: 'three relabelled bit windows at every (l, M) (carried)', criterion: L3 holds for none of them, on_failure: IR-7}
      - id: PC-16
        arm: the key along the Z/l ladder at the N^(1/3) alphabets 16, 64, 128 (carried)
        criterion: classify_family returns LEAD
        on_failure: IR-18 (run void)
      - id: PC-16b
        arm: the key at the fixed alphabet M = 16 on all three ladder primes (carried)
        criterion: classify_family over the three (l, 16) keys returns LEAD
        false_fail_rate_stated: 0.0031 per run (95 percent bound, C-5; CD4-15)
        on_failure: IR-23(b) (run void)
      - id: PC-16c
        arm: >-
          REVISED (RV-2). Planted mixtures at M = 16 decaying along the ladder -
          rho = 1 (the key) at l = 2003, rho = 0.7 at l = 130873, rho = 0.4 at
          l = 2095853 (CODE-GATE DECAY_RHOS)
        criterion: classify_family over the three (l, 16) keys does NOT return LEAD
        false_fail_rate_stated: 0.0092 per run (95 percent bound, C-5)
        on_failure: IR-23(c) - LEAD BLOCKED in the run (a role meeting the LEAD threshold reads ART-DEF, LEAD-BLOCKED); nothing else is voided. NOT a clearance criterion.
      - id: PC-16d
        arm: >-
          NEW (RV-5). On ISO-K13 at M = 16, ISO-K19 at M = 64 and ISO-K23 at
          M = 128 (the declared lead shapes, groups Z/(4 l), strata i mod 4,
          stream "pc16d", ten seeds), XF(1) (the log-interval key of the
          l-component, exact-free) and XC(1) (4 t + (i mod 4) with t the key at
          M / 4, exact-carrying), read exactly as family arms are read
        criterion: est.classify_family over the three lead keys returns LEAD for XF(1) and for XC(1)
        on_failure: IR-25 (run void)
      - id: PC-18
        arm: carried. XCO1 and XCO2 on the isomorphism types of the five Stage 2 cells' groups, at every family alphabet, stream "pc18", read as family arms
        criterion: for XCO1 and XCO2, L3 holds at no estimated (cell, M), and classify_family over the lead keys ISO-K13@16, ISO-K19@64, ISO-K23@128 returns NEG
        on_failure: IR-21 (run void)
      - {id: PC-11, arm: calibration row P1 on CELL-RC1 and CELL-K19 (carried), criterion: l_fibre exactly 1 and b exactly 2 on every fibre pair, on_failure: IR-5}
      - {id: PC-12, arm: row P2 on the full group (carried), criterion: b exactly 1 on every fibre pair, on_failure: IR-5}
      - {id: PC-13, arm: row P2 on the odd-order subgroup (carried), criterion: l_image exactly 0, on_failure: IR-5}
      - {id: PC-14, arm: 'b = M / G for h2 (carried)', criterion: abs(b - 2 / G_h2) below 1e-6, on_failure: IR-5}
    per_cell:
      - id: PC-8
        arm: setup and admission (AR-B1, AR-B1-C, AR-O), carried
        criterion: as version 3, the cell's largest prime factor proved prime by complete trial division to its integer square root
        on_failure: IR-8, IR-9
      - {id: PC-2, arm: 'the uniform gate null at every gate alphabet, 20 per seed (carried)', criterion: 'every draw OCCUPIED, W_u > 0', on_failure: IR-2}
      - {id: PC-3, arm: 'h2 at M = 2, S = 512 (carried)', criterion: EXACT and OCCUPIED on every seed, on_failure: IR-3}
      - {id: PC-4, arm: 'the constructed h4 at M = 4, S = 2048 (carried)', criterion: 'CK-H4 on 10^4 pairs; EXACT and OCCUPIED on every seed', on_failure: 'IR-3, IR-10'}
      - id: PC-4b
        arm: the halving presentation against the constructed h4 on 10^4 sampled points (carried)
        criterion: zero mismatches
        on_failure: IR-10 - every Koblitz arm on the cell is invalid
      - {id: PC-6a, arm: 'the unstratified shuffle of h2 (and h4) (carried)', criterion: 'on every seed the shuffle median at most q99_u', on_failure: IR-6}
      - {id: PC-6b, arm: 'the planted marginal-only label, unstratified, at every gate M >= 8 (carried)', criterion: 'L1 against the uniform gate null; the median of its shuffle medians exceeds q50_u by at least 3 W_u; L3 against the uniform gate null fails', on_failure: IR-6}
      - id: PC-6d
        arm: carried. The planted marginal-only label at M = 16 on every Stage 2 cell, ten stratified shuffles per seed, against the exact-saturated null at M = 16 on the gate stream
        criterion: the median over seeds of its stratified-shuffle medians exceeds q50_u by at least 3 W_u, and L3 against the exact-saturated null fails
        on_failure: IR-20 for that cell
      - id: PC-9
        arm: >-
          Carried as redefined in version 3, with one change (RV-12). The
          out-of-family filter (polynomial-basis coordinates of x at positions
          1, 3, ..., 2r - 1) at the PC-9 alphabet (8 on CELL-K13; 16 on
          CELL-K19, CELL-O19, CELL-K17C), curve-sampled on stream "pc9", seeds 0
          to 9, against 200 index-sampled readings from a verified table. On
          CELL-K17C the curve-sampled readings are drawn ON THE CURVE through
          CurveView (version 3 drew them through the same table).
        criterion: the median of the curve-sampled readings within the 0.005 and 0.995 type-1 quantiles of the index-sampled reference. The exhaustive population value on CELL-K13 is REPORTED, NOT CHECKED.
        on_failure: IR-11
        not_available_on: CELL-K23 and CELL-K41 (declared, carried)
      - id: PC-10
        arm: ordering, guarded in code (carried)
        criterion: stage2_cell raises unless handed a clearance issued by issue_clearance for that cell, which requires every run-level record in RUN_LEVEL_REQUIRED passed (certificate, pc1, pc5, gate_K17C, pc6c, z_ladder, pc16d, pc18, calibration_RC1), the cell's check_gate passed, and its PC-9 passed where declared. PC-16c is NOT in RUN_LEVEL_REQUIRED.
        on_failure: IR-14
    stage_2_validity:
      - {id: PC-15, arm: 'RLFAM, a held-out uniform label read exactly as a family arm', criterion: verdict NEG, on_failure: 'IR-17 (applied in families.stage3)'}
      - id: PC-17
        arm: carried. XCO1 and XCO2 built from each declared cell's own stratum, read on every Stage 2 (cell, M)
        criterion: per cell, L3 holds for neither at any estimated (cell, M) (pc17_cell); in Stage 3, the classification of each is NEG
        on_failure: IR-22 (applied in families.stage3)
      - id: IR-2-check
        arm: NEW in code (RV-12). The exact-saturated null of every Stage 2 (cell, M)
        criterion: W > 0 and every V_s > 0 (stage2_cell sets ir2_invalid otherwise)
        on_failure: IR-2 - that (cell, M) invalid; at a lead key every Koblitz role ART-DEF
    decision_clauses:
      per_seed_quantities: >-
        Carried. For role F at (cell, M) and seed s: G_F(s); E_RL(s) = G_F(s) -
        q50; E_Sh(s) = G_F(s) - the median of its ten STRATIFIED shuffle
        readings; p(s) = (1 + the number of those readings at least G_F(s)) /
        11; Z(s) = E_Sh(s) / V_s. ESTIMATED by the IR-12 mass rule.
      L1: the median over seeds of E_RL is at least 3 W (carried)
      L2: >-
        Carried. NON-DECAY. On the ladder cells at their N^(1/3) alphabets, one
        OLS slope of Z(s) against log2 l per seed; the interval is the second
        smallest to the second largest of the ten slopes; L2 HOLDS when the
        interval's upper end is at least 0.
      L3: the median over seeds of E_Sh is at least 3 W, and p(s) = 1/11 on at least 8 of 10 seeds (carried)
      lead_floor: >-
        Carried, with the RV-5 statement. LEAD needs L1 and L3 at all three
        ladder cells at N^(1/3), plus L2. For an exact-free role L1 needs a
        stratified excess of about 3 W plus the exact-free offset (DF-12).
      classification: >-
        REVISED (RV-7, RV-2, RV-12), per Koblitz role, in families.stage3 -
        ART-DEF if a ladder cell is dropped or voided (SR-3, IR-22 per cell) or
        a lead key is missing or IR-2-invalid; ART-DEF (NOT-ESTIMATED) if a lead
        key is not estimated; LEAD if L1 and L3 hold at all three lead keys and
        L2 holds, unless the PC-16c lead guard failed, then ART-DEF
        (LEAD-BLOCKED); NEG if L3 holds at no estimated valid (cell, M) and at
        least one such (cell, M) exists; ART-RES otherwise. Ordinary roles -
        ART-DEF with no valid or no estimated (cell, M); ART-RES on any L3; NEG
        otherwise. Then, if PC-15 or PC-17 fails in Stage 3, every
        classification is replaced by ART-DEF (IR-17, IR-22). One verdict and
        one L2 interval per declared Koblitz role are returned.
      sr6_exact_reading: >-
        REVISED (RV-1). families.sr6_check fires only for a reading on a
        prime-l cell that is EXACT, whose image counted over the labels of
        used conditioning cells lies outside 1, 2, 4, and whose (cell, role, M)
        the frozen degeneracy table does not record as EXACT-FUNCTION or
        DEGENERATE.
    degeneracy:
      id: CODE-DEGEN rule (RV-1), stated before execution
      quantities: >-
        Per declared (cell, role, M) with labels on affine points only - image
        size; smallest and largest class; c_2 = the sum over the cosets of 2E
        of (affine points in the coset minus the largest number of them sharing
        one label) and, on Koblitz cells, c_4 the same for 4E; c_q / N with q =
        4 (Koblitz) or 2 (ordinary); purity_2 and purity_4 as CODE-AUDIT.
        Exhaustive on CELL-K13, CELL-K19, CELL-K23 and CELL-O19; on CELL-K41 a
        uniform sample of 2^20 affine points (seed crc32 of
        "degen-sample:CELL-K41") with binomial standard errors and intervals
        (Wilson-type, non-degenerate at an estimate of 0).
      rule: >-
        EXACT-FUNCTION when c_q = 0; DEGENERATE when 0 < c_q / N <= 0.01;
        REGULAR otherwise. Consequences, fixed now - SR-6's image clause is
        exempt by name for EXACT-FUNCTION and DEGENERATE rows; every row is
        still read and classified; a NEG on such a row is reported as
        uninformative beyond the exact component; a REGULAR row is unaffected.
        The audit never changes a classification rule.
      prediction_before_c4: >-
        Written before C-4 was requested. F5xF4 at M = 8 on CELL-K13 is
        DEGENERATE (c_4 = 2, the two points of order 4, as DEC-20260929-585602
        records); other F5xF4 rows may be near the threshold; F1 to F4 and the
        ordinary roles REGULAR. A prediction, not a result.
    audit:
      id: CODE-AUDIT pass rule, carried unchanged from version 3
      rule: >-
        An arm at (cell, M) is EXACT-CARRYING when purity_2 >= 0.05 or
        (Koblitz) purity_4 >= 0.05; every arm is already stratified (route
        (a)), so the audit changes no procedure. At S0-6 CODE-AUDIT must
        reproduce its frozen C-4 table row line for row line (IR-24, seconds
        excluded).
    heur_b1:
      rule: Carried unchanged (CODE-HB1; nine fixed bins with edges 24, 27, 30, 32, 34, 36, 39, 42; 8 degrees of freedom; the 99th percentile computed in code; the maximum-count tail 1 - (1 - P(X >= max))^200 below 0.01 refutes; a bin with expected count below 5 makes the chi-squared reported and not read).
    heur_b2_held_out:
      rule: >-
        Carried, BY ROLE (RV-3). For each declared Koblitz role - LADDER test,
        premise L3 false at every estimated valid (cell, M) of CELL-K13 and
        CELL-K19, consequent L3 false at every estimated valid (cell, M) of
        CELL-K23; FIXED-ALPHABET test, premise L3 false at M = 16 on CELL-K13,
        CELL-K19 and CELL-K23, consequent L3 false at M = 16 on CELL-K41. Each
        test is DEFINED only when every involved (cell, M) is estimated and
        valid.

  # ===========================================================================
  # RULE SWEEP: every gate and rule checked for a false PASS and a false FAIL,
  # with the version-4 computed rates where C-5 gives them.
  # ===========================================================================
  rule_sweep:
    - rule: L3 (stratified)
      false_pass_mode: an exact component or marginal skew read as excess
      guard: stratification by the complete exact quotient; PC-6d, PC-17, PC-18; the rank floor on 8 of 10 seeds
      null_rate: P(Bin(10, 1/11) >= 8) = 1.774e-7 per (role, cell, M) under within-stratum exchangeability (CODE-FF B_L3)
    - rule: L1 (against the exact-saturated null)
      false_pass_mode: an exact-content-only label with a skewed residual (XCO2) passes L1 (C-8, E_RL / W 5.236)
      guard: L1 is never sufficient; LEAD needs L3; L1 enters no NEG
      false_fail_mode: an exact-free genuine filter must also beat the exact-free offset (DF-12); stated as the effective LEAD floor
    - rule: L2 (non-decay)
      false_pass_mode: a slowly decaying excess reads LEAD
      guard: PC-16c (rho 1, 0.7, 0.4) blocks LEAD if a planted decay of that size reads LEAD; a decay as slow as rho 1, 0.9, 0.8 read LEAD in 1 of 20 design replicates and is disclosed as not separated
      false_fail_mode: a flat excess fails L2
      rate: 0.0031 per run on the flat control (PC-16b, C-5)
    - rule: PC-16b (blocking)
      false_fail_rate: 0.0031 per run; its failure voids the run (IR-23(b)); stated, not re-run (a re-run would select)
    - rule: PC-16c (LEAD guard)
      false_pass_mode: none (it can only block LEAD)
      false_fail_mode: the planted decay reading LEAD by noise
      rate: 0.0092 per run (bound; 0 of 200 per-seed slopes non-negative, mean -3.26 per bit, sd 0.87); its effect blocks LEAD only, so under the null it changes no classification
    - rule: PC-16d (blocking)
      false_fail_mode: XF(1) or XC(1) failing L1, L3 or L2 on a lead shape by noise
      rate: 0.0068 per run (MARGIN from the C-6 rho = 1 readings; C-5)
    - rule: PC-17 and PC-18 (blocking)
      false_fail_mode: an exact-content-only label meeting L3 by chance (rank bound) or being unestimated
      rate: about 3.5e-6 each (C-5)
    - rule: PC-6c
      false_pass_mode: an identity shuffle keeps the exact label and FAILS PC-6c (C-8 mutation - medians 16.0 against q99 6.84), so PC-6c cannot pass a broken shuffle of that kind
    - rule: PC-6d
      false_pass_mode: an identity shuffle would pass PC-6d; PC-6c catches it, so the pair pins the branch from both sides
    - rule: IR-12 (not estimated)
      guard: NEG is read only on estimated valid (cell, M); at a lead key the role is ART-DEF (NOT-ESTIMATED); the smallest expected used mass over every declared row and held-out label is 0.75 (XCO2 at the K23 M = 128 shape, C-5), so the per-seed not-estimated probability is negligible
    - rule: NEG-path floor
      false_pass_mode: a NEG reported without its floor, or against the Z/l floor
      guard: success criterion clause (6) requires the C-6 floor beside every NEG; the Z/l floor is labelled a reference
    - rule: SR-6 clause (2), revised
      false_pass_mode: a near-exact degenerate row fires a certificate stop (the version-3 defect)
      guard: the used-cell image rule and the degeneracy exemption; 0 fires in 1400 near-exact seeds (C-5) against 182 for the version-3 clause
      false_fail_mode: a genuinely exact filter of alphabet above 4 on a REGULAR row not stopping - impossible below l by Q-CERT; on an exempt row the exemption applies only to rows within one percent of an h4 function
    - rule: HEUR-B2 held-out tests
      false_pass_mode: a test reported as passed when cells were unestimated or invalid
      guard: DEFINED only when every involved (cell, M) is estimated and valid
    - rule: PC-9
      false_pass_mode: a curve-sampler defect on CELL-K17C hidden by sampling both sides through the same table
      guard: CurveView (RV-12); the toy-curve Monte Carlo passes 20 of 20 (C-5)

