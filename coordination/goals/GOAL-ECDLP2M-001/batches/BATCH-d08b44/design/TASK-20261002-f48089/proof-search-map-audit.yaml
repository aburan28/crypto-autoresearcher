      - {shape: K13@8, declared: 'CELL-K13, M 8', group: 'Z/(4 x 2011)', W: 0.396, q50: 4.938, XF_NEG_floor: 0.8, XF_LEAD_floor: none, XC_NEG_floor: none, XC_LEAD_floor: none, XF1_offset_W: 7.98, note: 'XC(1) E_Sh / W -0.09; no exact-carrying mixture is resolved at this shape'}
      - {shape: K19@64, declared: 'CELL-K19, M 64 (lead key)', group: 'Z/(4 x 130927)', W: 1.582, q50: 11.107, XF_NEG_floor: 0.5, XF_LEAD_floor: 0.7, XC_NEG_floor: 0.6, XC_LEAD_floor: 0.6, XF1_offset_W: 3.41}
