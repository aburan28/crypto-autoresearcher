  # ===========================================================================
  # RV-6 -- EVERY GROUP, CURVE AND LABEL USED BY A DESIGN COMPUTATION, AND THE
  # CORRECTED VERSION-3 STATEMENT.
  # ===========================================================================
  groups_curves_and_labels_used:
    rule: >-
      DEC-20261002-8cabf8 R-DECLARED-GROUPS and the card's declared_groups -
      no computation C-5 to C-8 on a group whose order is divisible by 2003,
      130873, 2095853, 549756390943, 261823, 32603, 137 or 239, on Z/2^17, or
      on a curve over F_2^n with n in 13, 17, 19, 23 or 41. Version 4 declares
      no cell beyond version 3's, so the list needs no extension. Every group
      below had its order checked against the excluded primes in code
      (negpath.check_permitted_order) before use.
    permitted_primes: >-
      negpath.adjacent_permitted_prime, the least prime above each declared
      prime outside the excluded list - 2003 to 2011, 130873 to 130927,
      2095853 to 2095867, 549756390943 to 549756390949, 261823 to 261847.
    groups:
      - {group: 'Z/(4 x 2011)', order: 8044, used_by: 'C-5 small (PC-3, PC-4, PC-6a exact instances at M = 2, 4; gate instances PC-2, PC-6b, PC-6d, IR-2 at M = 8, 16), C-5 nearexact (k = 1, 2, 3), C-6 K13@16 and K13@8, C-8 (shuffle property, RR-2, SR-6 near-exact)'}
      - {group: 'Z/(16 x 2011)', order: 32176, used_by: 'C-5 small (PC-6c instance), C-8 (RR-10 PC-6c pin)'}
      - {group: 'Z/(64 x 2011)', order: 128704, used_by: 'C-5 small (PC-6c instance)'}
      - {group: 'Z/(4 x 130927)', order: 523708, used_by: 'C-5 small (gate instance at M = 64), C-6 K19@64 and K19@16'}
      - {group: 'Z/(4 x 2095867)', order: 8383468, used_by: 'C-5 small (gate instance at M = 32), C-5 gate128 (M = 128), C-6 K23@128, K23@32 and K23@16'}
      - {group: 'Z/(4 x 549756390949)', order: 2199025563796, used_by: 'C-5 nearexact (frac 1.7e-4 at M = 16), C-6 K41@16'}
      - {group: 'Z/(2 x 261847)', order: 523694, used_by: 'C-6 O19@64 and O19@16'}
      - {group: 'Z/2011, Z/130927, Z/2095867', order: 'prime', used_by: 'C-5 zladder (PC-7, PC-7c, PC-16, PC-16b and the Z/l floor on the permitted ladder) and pc16bc (200 seeds, PC-16b and PC-16c rates)'}
      - {group: 'Z/2^16', order: 65536, used_by: 'C-5 small (PC-1 instance)'}
    curves:
      - {curve: 'the toy Koblitz curve a = 0, b = 1 over F_2^9', order: '508 = 4 x 127', used_by: 'C-5 small toy_curve (exact controls h2 and h4, CK-H4, PC-4b, the calibration rows, PC-9 by curve against index sampling)'}
    synthetic_labels_and_names:
      - C-5 analytic - label marginals of every declared role and held-out label on SYNTHETIC uniform n-bit vectors at n = 13, 19, 23, 41 (bit strings, not curve points or group elements), for the estimability and occupancy bounds.
      - C-7 namegrid - the declared cell ids, alphabets and role names as dictionary KEYS with hand-built synthetic statistics; no group element is constructed (the carve-out).
    declared_curve_cells_touched:
      - C-4 only (the carve-out) - CELL-K13, CELL-K19, CELL-K23, CELL-O19 exhaustively and CELL-K41 by a 2^20-point sample, by CODE-AUDIT and CODE-DEGEN label-class enumeration against the 2E and 4E cosets; no gain, shuffle, null draw, estimator, rule rate or decision clause.
  corrected_statement_rv6:
    version_3_statement: The version-3 sheet stated that its design-time dry calls touched no declared cell.
    correction: >-
      That statement was incomplete. The version-3 utility synthetic_dry_call
      (CODE-XCO, C-5 of version 3) ran on IsoCell("DRY-K13", 2003, 4, 13), a
      cyclic group of order 4 x 2003 - the isomorphism type of CELL-K13's
      group and the group of the declared ISO-K13 - and on Z/(16 x 2003), the
      group of the declared CELL-ZS16 (DEC-20260929-585602 SD-2, TB-4). Under
      R-DECLARED-GROUPS both are excluded groups. Version 4 removes that
      utility (CX-2), recomputes every design figure on permitted groups, and
      carries no figure of the version-3 dry call.

  # ---------------------------------------------------------------------------
  completion_gate_selfcheck:
    - gate: the three files exist at their declared paths, are new and parse (C-2); no other file changed; the version-1 to version-3 files unchanged
      met: >-
        As far as this session can attest - the three files were written at
        paths that held no file, no other repository file was created or
        edited, and the version-1 to version-3 files were only read (their
        C-9 hashes are re-taken in round 3). The parse of all three files is
        the round-3 C-2 relay.
    - gate: both records carry supersedes naming their version-3 id
      met: YES. H-BINSTD-9b29a0 supersedes H-BINSTD-17cf9d; EXP-BINSTD-811a2e supersedes EXP-BINSTD-c9c8a2; each with a supersession note citing DEC-20260929-585602, DEC-20261002-8cabf8 R-FORM and TASK-20261002-f48089.
    - gate: every C1 to C8 condition, every RV-1 to RV-15 item and DI-FF and DI-SP map to a named clause in the discharge tables
      met: YES (design_conditions_discharge; revision_discharge).
    - gate: the degeneracy audit, the false-fire table with the aggregate clean-classification probability, the floor table and the end-to-end dry call present as import-safe code with relayed outputs
      met: YES - CODE-DEGEN with degeneracy_audit_table, CODE-NEGP with negpath_floor_table, CODE-DRY with C-7 and C-8, CODE-FF with false_fire_table (every rule at or below 0.05; P(clean) at least 0.9886; expected attempts at most 1.0116).
    - gate: every design computation inside C-1 to C-9 and on permitted groups, with the group list present
      met: YES (groups_curves_and_labels_used; C-4 and C-7 are the card's carve-outs).
    - gate: carried blocks unchanged or in constants_delta; code blocks byte-identical or in code_delta
      met: YES (constants_delta CD4-1 to CD4-20; code_delta, seven byte-identical blocks and CX-1 to CX-7).
    - gate: the stake only as a ceiling; no below-rho cell; no raw-G to below-rho derivation; the LEAD branch pre-registered and routed; no D-quantity as a budget
      met: YES. The stake appears once, at its row of stage_0.ideal_tree_table; heur_b2_thresholds.named_exponent forbids mapping any statistic onto the table; SR-4 routes LEAD and writes no interpretation; D1 to D3 appear only in refusals.
    - gate: approved_by null and the approval block names DEC-20261002-962278; zero runs
      met: YES; runs_launched 0 in all three files.

  no_speedup_attestation: >-
    The three files were written to state no ECDLP speedup, exponent move,
    deployed-curve verdict, filter of capacity above 2 bits on ECC2K-130,
    below-rho cell on ECC2K-130 or lane closure as an outcome. Every
    occurrence of speedup, below rho, stake, lead, exponent, closed or closure
    is a prohibition, a routing instruction, a ceiling label, a quotation of
    the selection decision, a definition of a decision rule, or a statement
    about a planted positive control on a permitted group; no sentence maps a
    raw-G or other statistic onto a below-rho reading.

  procedure_deviations:
    - id: PD-B4-1
      severity: disclosed
      what: >-
        This session's context was compacted once after the round-2 relay; the
        read attestation's first part is reconstructed (read_attestation.note).
        No runtime transcript was read to reconstruct it.
      consequence: the pre-compaction read order is approximate; nothing in the three files depends on it.
    - id: PD-B4-2
      severity: disclosed
      what: >-
        The runtime forced two interim hand-backs (after the round-1 and
        round-2 requests) before the work was complete; the coordinator
        resumed this session each time. Those interim reports are superseded
        by the final hand-back.
      consequence: none on the records.
    - id: PD-B4-3
      severity: disclosed (infrastructure)
      what: >-
        A container restart at about 14:14Z killed the first K23@128 C-6
        attempt after about 1 h 30 min with empty output (kept in
        x/interrupted/). The shape was re-run alone and completed (5161 s,
        exit 0). An infrastructure event, not a result.
      consequence: none; only the second, complete output is used.
    - id: PD-B4-4
      severity: disclosed (DB4-12)
      what: >-
        CODE-FF was revised after a session computation (CX-7): the first
        combine under the pinned bytes 9d56b1fe... gave invalid bounds; only
        the combine path was changed and combine was re-run in round 3 on the
        same shard files. The superseded hash and both combine outputs are
        recorded.
      consequence: the shard outputs bind the superseded bytes for the functions they ran, which the revision did not touch; the round-3 C-1 relay pins the new bytes.
    - id: PD-B4-5
      severity: disclosed
      what: >-
        This producer expected c4_audit.out to hash equal to the version-3
        C-4 stdout and said so in its round-2 request; it did not, because of
        the wall-clock seconds fields. The expectation was wrong; the finding
        and its consequence (IR-24 excludes those fields) are recorded in
        design_computations.round_2.c4_audit_against_version_3.
      consequence: CD4-14.
    - id: PD-B4-6
      severity: disclosed (read scope)
      what: >-
        A files-with-matches search of ledger/hypotheses/ for the status line
        "review_required" displayed one file name, H-BINSTD-0dd2ce. It was not
        opened. If it belongs to the EXP-BINSTD-178742 lineage, which the card
        excludes beyond its id, this is an incidental exposure of one id and
        of the fact that it carries that status line.
      consequence: nothing from it is used.
    - id: PD-B4-7
      severity: disclosed
      what: >-
        The C-2 scan for 3.12+ tokens flagged "type " in CODE-XCO; it is the
        docstring phrase "isomorphism types", not the 3.12 type statement.
      consequence: none.
    - id: PD-B4-8
      severity: disclosed
      what: >-
        Recalled items, none supporting a decision rule - the strong
        probable-prime determinism bound quoted beside PC-CERT-4 (recalled),
        the type-II ONB criterion (carried, self-checked), and the Gumbel
        spread behind the uniform-label design estimates (labelled
        underestimates).
      consequence: none.
    - id: PD-B4-9
      severity: disclosed, design choices beyond the RV list
      what: >-
        (1) The degeneracy threshold DEG_FRAC = 0.01 (CD4-4). (2) Both RV-2
        remedies rather than one. (3) The near-exact control also at a
        pseudo-random exceptional set of mass 1.7e-4 (the n = 41 pattern). (4)
        The NEG-path floors use the grid 1 to 0.3 in steps of 0.1 rather than
        the Z/l grid, so floors are resolved where they lie. (5) CODE-FF bounds
        some rules by EXCH order-statistic laws, which assume that a correct
        shuffle or curve-sampled reading has the null's law; the assumption is
        stated in each row's method.
      consequence: each is recorded with its reason; the composer judges whether any exceeds what DEC-20260929-585602 permits.
    - id: PD-B4-10
      severity: disclosed (infrastructure, as the session reported it)
      what: >-
        While the round-3 computations ran, the host was shared with other
        lanes' processes (a benchmark runner and a blind reviewer). No round-3
        item is timing-sensitive; the round-2 timings in this sheet may also
        include contention from concurrent jobs (up to three ran in parallel).
      consequence: none on any figure except wall-clock seconds, which no rule reads.
    - id: PD-B4-11
      severity: disclosed
      what: >-
        The sheet was edited after the round-3 relay (pinning CODE-FF,
        embedding the round-3 outputs and the false-fire table, this list).
        No code string other than CODE-FF changed after round 1, and CODE-FF
        did not change after round 3. The final verify round (C-1 equals_pin
        for all fourteen blocks, the C-2 parse, sha256 of the three files) is
        requested of the session; its result is reported in the hand-back and
        re-derived by the snapshot TASK-20261002-8b2165, not embedded here (an
        embedding would change the hash it reports).
      consequence: the snapshot recomputes every pin from the committed bytes; a mismatch is a custody finding.

  asserts_nothing_about: >-
    Any curve's security; whether index calculus beats rho on any curve;
    whether any oracle meets any budget; whether any filter has capacity above
    2 bits on ECC2K-130 or anywhere; what any declared role reads on any
    declared cell (no gain, shuffle, null draw, estimator or clause was
    computed on one); whether this contract will be approved; any other
    lane's object; any BATCH-ccfdc6 record; any EXP-QSP-70b731 run;
    EXP-FROB-30006a or any RUN-FROB value; the AUXIN census; any content of
    DEC-20261002-08c3f8, H-CERTBIN-6e6287 or EXP-CERTBIN-fad576. This sheet is
    a design audit; its relays are design figures, and its code is committed
    text not run as an experiment.
