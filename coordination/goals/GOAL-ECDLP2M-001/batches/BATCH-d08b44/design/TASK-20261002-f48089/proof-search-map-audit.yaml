        """CODE-HB1, heurb1.py, of EXP-BINSTD-c9c8a2 (version 3): the HEUR-B1
        validation (RR-9). On CELL-K19: 200 independent pairs of lists of 2^8
        distinct uniform points, 262 distinct target points drawn under the seed
        crc32 of "heurb1-targets:CELL-K19", DIRECT pair-sum counting, a
        chi-squared comparison against Binomial(2^16, 262 / N_E) with NINE BINS
        FIXED HERE (edges 24, 27, 30, 32, 34, 36, 39, 42) and 8 degrees of
        freedom, and the maximum-count tail. The rule is stated in the audit
        sheet before execution. No engine, no solver.

        Committed by TASK-20260929-749b50. NOT RUN by the design task (CODE-S0
        calls bin_probs and chi2_quantile for the design-time binning only).
        Importing this module executes nothing beyond definitions and constants.
        """
        import math
        import random

        import estimator as est

        HB1_CELL = "CELL-K19"
        HB1_PAIRS = 200
        HB1_LIST = 256
        HB1_TARGETS = 262
        HB1_EDGES = (24, 27, 30, 32, 34, 36, 39, 42)
        HB1_DOF = len(HB1_EDGES)
        HB1_ALPHA = 0.01
        HB1_MIN_EXPECTED = 5.0


        def binom_logpmf(k, n, p):
            return (math.lgamma(n + 1) - math.lgamma(k + 1) - math.lgamma(n - k + 1)
                    + k * math.log(p) + (n - k) * math.log1p(-p))


        def binom_cdf(k, n, p):
            """P(X <= k), summed exactly over 0 .. k (k is small here)."""
            if k < 0:
                return 0.0
            return min(1.0, sum(math.exp(binom_logpmf(j, n, p)) for j in range(0, k + 1)))


        def binom_sf(k, n, p):
            """P(X >= k)."""
            return max(0.0, 1.0 - binom_cdf(k - 1, n, p))


        def bin_probs(n, p, edges=HB1_EDGES):
            """Probabilities of the fixed bins [0, e1), [e1, e2), ..., [e8, inf)."""
            probs, lo = [], 0
            for hi in edges:
                probs.append(binom_cdf(hi - 1, n, p) - binom_cdf(lo - 1, n, p))
                lo = hi
            probs.append(1.0 - binom_cdf(lo - 1, n, p))
            return probs


        def bin_index(count, edges=HB1_EDGES):
            for i, hi in enumerate(edges):
                if count < hi:
                    return i
            return len(edges)


        def _gamma_p_series(a, x):
            term = 1.0 / a
            total = term
            ap = a
            for _ in range(100000):
                ap += 1.0
                term *= x / ap
                total += term
                if abs(term) < abs(total) * 1e-16:
                    break
            return total * math.exp(-x + a * math.log(x) - math.lgamma(a))


        def _gamma_q_cf(a, x):
            tiny = 1e-300
            b = x + 1.0 - a
            c = 1.0 / tiny
            d = 1.0 / b
            h = d
            for i in range(1, 100000):
                an = -i * (i - a)
                b += 2.0
                d = an * d + b
                if abs(d) < tiny:
                    d = tiny
                c = b + an / c
                if abs(c) < tiny:
                    c = tiny
                d = 1.0 / d
                de = d * c
                h *= de
                if abs(de - 1.0) < 1e-16:
                    break
            return math.exp(-x + a * math.log(x) - math.lgamma(a)) * h


        def chi2_sf(x, dof):
            """P(chi-squared with dof degrees of freedom >= x)."""
            if x <= 0:
                return 1.0
            a, y = dof / 2.0, x / 2.0
            if y < a + 1.0:
                return 1.0 - _gamma_p_series(a, y)
            return _gamma_q_cf(a, y)


        def chi2_quantile(prob, dof):
            """The prob-quantile of chi-squared with dof degrees of freedom."""
            lo, hi = 0.0, 1000.0
            for _ in range(200):
                mid = 0.5 * (lo + hi)
                if chi2_sf(mid, dof) > 1.0 - prob:
                    lo = mid
                else:
                    hi = mid
            return 0.5 * (lo + hi)


        def distinct_points(cell, rng, k):
            out, seen = [], set()
            while len(out) < k:
                P = cell.sample(rng)
                key = cell.key(P)
                if key in seen:
                    continue
                seen.add(key)
                out.append(P)
            return out


        def heurb1_validate(cell, order_verified, pairs=HB1_PAIRS, list_size=HB1_LIST,
                            n_targets=HB1_TARGETS):
            """S2-5. Returns the counts, the binned histogram, the chi-squared with
            its 99th percentile, the tail check and the pre-registered verdict."""
            trng = random.Random(est.seed_of("heurb1-targets", cell.id))
            targets = set(cell.key(P) for P in distinct_points(cell, trng, n_targets))
            counts = []
            for i in range(pairs):
                rng = random.Random(est.seed_of("heurb1-lists", cell.id, i))
                L1 = distinct_points(cell, rng, list_size)
                L2 = distinct_points(cell, rng, list_size)
                c = 0
                for S in L1:
                    for T in L2:
                        R = cell.add(S, T)
                        if R is not None and cell.key(R) in targets:
                            c += 1
                counts.append(c)
            n = list_size * list_size
            p = n_targets / order_verified
            probs = bin_probs(n, p)
            expected = [pairs * x for x in probs]
            observed = [0] * len(probs)
            for c in counts:
                observed[bin_index(c)] += 1
            chi2 = sum((o - e) ** 2 / e for o, e in zip(observed, expected))
            crit = chi2_quantile(1.0 - HB1_ALPHA, HB1_DOF)
            applicable = min(expected) >= HB1_MIN_EXPECTED
            mx = max(counts)
            tail_p = 1.0 - (1.0 - binom_sf(mx, n, p)) ** pairs
            chi2_refutes = applicable and chi2 > crit
            tail_refutes = tail_p < HB1_ALPHA
            return {"cell": cell.id, "order_verified": order_verified, "mean": n * p,
                    "counts": counts, "edges": list(HB1_EDGES), "observed": observed,
                    "expected": expected, "dof": HB1_DOF, "chi2": chi2, "chi2_99": crit,
                    "chi2_applicable": applicable, "max_count": mx, "tail_p": tail_p,
                    "refutes_heur_b1": chi2_refutes or tail_refutes}
