      lead_route_contingent:
        status: CONTINGENT, ESTIMATE, not in this contract's budget (carried)
        text: >-
          If an arm reads LEAD, SR-4 routes it to (i) an independent
          review-breakthrough round at max, at least three cards at the card
          budget of 14400 s wall each (about 43200 s of max-tier sessions), and
          (ii) an independent replication of that arm's ladder reading in a
          separate session and implementation, about 80000 CPU-seconds (22
          CPU-hours). Opened only by a new Coordinator decision.
      contingent_review_cost_of_stop_rules: >-
        RV-13. SR-5 and SR-6 open a review round (about 43200 s of max-tier
        sessions each). Under the null their per-run firing rates are 0 (SR-5,
        SR-6 clause (1)) and at most about 4e-8 (SR-6 clause (2) as revised,
        false_fire_table), so the expected contingent review cost is below
        0.002 s per run; under the version-3 clause it was about 0.75 x 43200 s
