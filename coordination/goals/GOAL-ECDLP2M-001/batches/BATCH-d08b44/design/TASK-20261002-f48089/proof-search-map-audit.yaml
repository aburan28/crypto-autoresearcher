        """CODE-FF, falsefire.py, of EXP-BINSTD-811a2e (version 4): the NULL
        FALSE-FIRE TABLE of DI-FF (C-5). A DESIGN UTILITY; the experiment's
        driver never calls it. It touches no declared cell and no group in
        R-DECLARED-GROUPS: every group is Z/(q l') or Z/l' with l' from
        negpath.adjacent_permitted_prime (orders checked), Z/2^16, or the
        non-declared toy Koblitz curve n = 9; every other label is synthetic.

        For every stopping, invalidation and admission rule of
        EXP-BINSTD-811a2e it computes a per-run firing probability under the
        contract's own null (a correctly functioning run in which every declared
        arm carries nothing beyond the exact components), by one of four
        methods, each named in its row: EXACT (a derivation coded here: the
        rank clause of L3 under within-stratum exchangeability, a search-failure
        or occupancy tail bound, or a deterministic exact control); MC (Monte
        Carlo of the committed rule on a permitted group, seeds recorded, with
        a one-sided 95 percent upper bound on the rate); MARGIN (a Cantelli
        bound from per-seed means and standard deviations measured on a
        permitted group, the standard deviation inflated by INFLATE); or
        MARGIN-EXTRAPOLATED (flagged). The aggregate clean-classification
        probability is bounded below by 1 minus the sum of the rates that can
        stop, void or ART-DEF a null run (a union bound).

        Sub-commands (argv): analytic | nearexact | pc16bc START COUNT |
        zladder | small | gate128 | combine FILE ... Each prints one JSON
        document. Seeds are enumerated and every derived seed is
        est.seed_of(label, ...) of a recorded label.

        Committed by TASK-20261002-f48089. Importing executes nothing.
        """
        import json
        import math
        import random
        import sys
        from array import array

        import binstd_core as core
        import calibration_rows as cal
        import estimator as est
        import families as fam
        import exact_content as xco
        import stage1_gate as gate
        import negpath as negp
        import dryrun as dry

        INFLATE = 2.0
        ALPHA = 0.05
        RANK_P = 1.0 / (est.R_SH + 1)
        NEW_DECAY = gate.DECAY_RHOS
        OLD_DECAY = (1.0, 0.9, 0.8)
        STAGE2_KEYS = tuple((c, M) for c in sorted(est.FAMILY_ALPHABETS) for M in est.FAMILY_ALPHABETS[c])
        N_DECLARED_ROWS = sum(len(fam.role_names(c in fam.KOBLITZ_CELLS)) for c, _M in STAGE2_KEYS)
        GATE_ALPHABETS = {"CELL-K13": (2, 4, 8, 16), "CELL-K19": (2, 4, 16, 64),
                          "CELL-K23": (2, 4, 16, 32, 128), "CELL-K41": (2, 4, 16),
                          "CELL-O19": (2, 16, 64), "CELL-K17C": (2, 4, 16), "CELL-RC1": (2, 4)}
        N_CELLS_N = {"CELL-K13": 13, "CELL-K19": 19, "CELL-K23": 23, "CELL-K41": 41, "CELL-O19": 19}


        # ---------------------------------------------------------------- helpers
        def binom_tail(n, p, k):
            """P(Bin(n, p) >= k), summed exactly."""
            if k <= 0:
                return 1.0
            if p <= 0.0:
                return 0.0
            p = min(p, 1.0)
            return min(1.0, sum(math.comb(n, j) * p ** j * (1.0 - p) ** (n - j) for j in range(k, n + 1)))


        def poisson_below(mean, k):
            """P(Poisson(mean) < k)."""
            if mean > 50.0 * k + 1000.0:
                return 0.0
            term = math.exp(-mean)
            tot = 0.0
            for j in range(k):
                tot += term
                term *= mean / (j + 1)
            return min(1.0, tot)


        def poisson_at_least(mean, k):
            return max(0.0, 1.0 - poisson_below(mean, k))


        def p_upper(k, n, alpha=ALPHA):
            """One-sided 1 - alpha upper bound for a binomial proportion with k
            successes in n trials (exact, by bisection)."""
            if n == 0:
                return 1.0
            lo, hi = k / n, 1.0
            for _ in range(80):
                mid = 0.5 * (lo + hi)
                if 1.0 - binom_tail(n, mid, k + 1) > alpha:
                    lo = mid
                else:
                    hi = mid
            return hi


        def mean_sd(vals):
            n = len(vals)
            mu = sum(vals) / n
            var = sum((v - mu) ** 2 for v in vals) / max(1, n - 1)
            return mu, math.sqrt(var)


        def cantelli_below(vals, t, inflate=INFLATE):
            """Per-seed bound on P(X < t): one-sided Chebyshev from the sample mean
            and the INFLATED sample standard deviation; 1.0 unless mean > t."""
            mu, sd = mean_sd(vals)
            sd *= inflate
            d = mu - t
            if d <= 0:
                return 1.0
            if sd == 0:
                return 0.0
            return sd * sd / (sd * sd + d * d)


        def cantelli_above(vals, t, inflate=INFLATE):
            """Per-seed bound on P(X >= t); 1.0 unless mean < t."""
            return cantelli_below([-v for v in vals], -t, inflate)


        def median_fail(p_seed):
            """P(the median of ten seeds falls on the wrong side) <= P(at least
            five of ten seeds do)."""
            return binom_tail(10, p_seed, 5)


        def every_seed_fail(p_seed):
            return 1.0 - (1.0 - min(1.0, p_seed)) ** 10


        def B_L3():
            """L3's false-pass bound for a label exchangeable with its shuffles
            within strata: the rank p-value is at its floor 1/11 with probability
            at most 1/11 per seed, independently over seeds, and L3 needs 8 of 10."""
            return binom_tail(10, RANK_P, 8)


        def log_nk_bound(N, k, p):
            """log10 of C(N, k) p^k (0 < p), the negative-association bound on k
            or more of N multinomial cells falling below their threshold."""
            if p <= 0.0:
                return -1e300
            return (math.lgamma(N + 1) - math.lgamma(k + 1) - math.lgamma(N - k + 1)) / math.log(10) \
                + k * math.log10(p)


        def occupancy_fail(M, S):
            """P(a draw of a label uniform on M values is not OCCUPIED at S):
            more than half of the M^2 cells below MIN_CELL (or more excluded than
            used), bounded by C(M^2, k) p^k with k = M^2 // 2 + 1 and p the
            Poisson lower tail of one cell."""
            p = poisson_below(S / float(M * M), est.MIN_CELL)
            k = (M * M) // 2 + 1
            lg = log_nk_bound(M * M, k, p)
            return 0.0 if lg < -300 else min(1.0, 10.0 ** lg)


        def permitted_ladder():
            return tuple((negp.adjacent_permitted_prime(l), a, m) for l, a, m in gate.Z_LADDER)


        def permitted(l, q=1):
            p = negp.adjacent_permitted_prime(l)
            negp.check_permitted_order(q * p)
            return p


        # --------------------------------------------------------------- analytic
        def synthetic_marginal(n, M, koblitz, points=1 << 16):
            """Label marginals of every declared role and held-out label at (n, M)
            on SYNTHETIC coordinates: c and x uniform n-bit vectors, e uniform on
            the q strata, c's weight parity tied to e (DF-9) on a Koblitz shape.
            An approximation of the curve marginal (x is uniform over the field,
            not over the abscissae of a curve), stated as such."""
            rng = random.Random(est.seed_of("ff-marg", n, M, int(koblitz)))
            wb = fam.weight_buckets(n, M)
            wb4 = fam.weight_buckets(n, M // 4) if koblitz else None
            roles = fam.role_names(koblitz)
            q = 4 if koblitz else 2
            cnt = [[0] * M for _ in roles]
            x1 = [0] * M
            for _ in range(points):
                e = rng.randrange(q)
                while True:
                    c = rng.getrandbits(n)
                    if (not koblitz) or (core.popcount(c) & 1) == (e & 1):
                        break
                x = rng.getrandbits(n)
                labs = fam.labels_from_parts(n, M, c, x, e, koblitz, wb, wb4)
                for k in range(len(roles)):
                    cnt[k][labs[k]] += 1
                while True:
                    w = core.popcount(rng.getrandbits(n))
                    if (w & 1) == (e & 1):
                        break
                x1[wb[w]] += 1
            pis = {roles[k]: [v / points for v in cnt[k]] for k in range(len(roles))}
            pis["XCO1"] = [v / points for v in x1]
            pis["RLFAM"] = [1.0 / M] * M
            m = M // q
            x2 = [0.0] * M
            for r in range(m):
                for e in range(q):
                    x2[q * r + e] += (1.0 / q) * (0.5 if r == 0 else 0.5 / (m - 1))
            pis["XCO2"] = x2
            return pis


        def expected_used_mass(pi, S):
            """E[used mass / S] for a label with marginal pi on i.i.d. pairs: the
            pair mass of cells (a, b) with at least MIN_CELL pairs, Poisson cells."""
            tot = 0.0
            for a in pi:
                if a == 0.0:
                    continue
                for b in pi:
                    m = a * b
                    lam = S * m
                    if lam >= 400.0:
                        tot += m
                    elif lam >= 20.0:
                        tot += m * poisson_at_least(lam, est.MIN_CELL)
            return tot


        def not_estimated_seed(E, S):
            """APPROXIMATE per-seed probability that the used mass falls below one
            half, by Hoeffding on S pair indicators about the mean E."""
            if E <= 0.5:
                return 1.0
            return math.exp(-2.0 * S * (E - 0.5) ** 2)


        def sr6_analytic(S):
            """Per-seed bound for the REVISED SR-6 image clause on a label that is
            a function of the exact quotient except on a set of mass f carrying
            labels outside the quotient's image: firing needs an EXACT reading
            (no pair with regular cell labels and an exceptional sum, at most
            exp(-S f (1 - f)^2)) AND an exceptional label in a used cell (at least
            MIN_CELL pairs with an exceptional P or Q, Poisson(2 S f) >= 100);
            the bound is the maximum over f of the smaller of the two."""
            best, arg = 0.0, None
            for i in range(0, 361):
                f = 10.0 ** (-9.0 + i * 0.025)
                if f >= 0.5:
                    break
                v = min(math.exp(-S * f * (1.0 - f) ** 2), poisson_at_least(2.0 * S * f, est.MIN_CELL))
                if v > best:
                    best, arg = v, f
            return {"S": S, "bound_per_seed": best, "at_f": arg}


        def analytic():
            out = {"kind": "ff-analytic", "B_L3": B_L3(), "rank_p": RANK_P,
                   "n_declared_rows": N_DECLARED_ROWS, "stage2_keys": len(STAGE2_KEYS)}
            est_rows = []
            for cid, M in STAGE2_KEYS:
                koblitz = cid in fam.KOBLITZ_CELLS
                S = est.S_of(M)
                pis = synthetic_marginal(N_CELLS_N[cid], M, koblitz)
                for name, pi in sorted(pis.items()):
                    E = expected_used_mass(pi, S)
                    est_rows.append({"cell_shape": cid, "M": M, "S": S, "name": name,
                                     "expected_used_mass": E, "not_estimated_per_seed": not_estimated_seed(E, S),
                                     "lead_key": (cid in est.LEAD_ALPHABET and est.LEAD_ALPHABET[cid] == M)})
            out["estimability"] = est_rows
            occ = []
            for cid, Ms in sorted(GATE_ALPHABETS.items()):
                for M in Ms:
                    occ.append({"cell": cid, "M": M, "S": est.S_of(M),
                                "per_draw_not_occupied": occupancy_fail(M, est.S_of(M))})
            out["gate_occupancy"] = occ
            out["pc5_occupancy"] = [{"M": M, "S": est.S_of(M), "S_over_M2": est.S_of(M) / float(M * M),
                                     "not_occupied": occupancy_fail(M, est.S_of(M))} for M in (548, 956)]
            out["pc1_occupancy"] = [{"M": M, "not_occupied": occupancy_fail(M, est.S_of(M))}
                                    for M in gate.Z2_ALPHABETS]
            out["pc8_search_failure_per_search"] = 0.5 ** 200
            out["sr6_revised_bound"] = [sr6_analytic(S) for S in sorted(set(est.S_of(M) for _c, M in STAGE2_KEYS))]
            return out


        # ------------------------------------------------------------- nearexact
        def nearexact(seeds_k=400, seeds_frac=200, frac=1.7e-4):
            """SR-6 (revised) against the near-exact degenerate control on permitted
            groups: (a) the K13 shape Z/(4 l'), M = 8, S = 2^13, h4 refined on k =
            1, 2, 3 exceptional points (CODE-DRY near_exact), 400 seeds each; (b)
            the K41 shape Z/(4 l'), M = 16, S = 2^15, h4 refined on a pseudo-random
            set of mass frac (the F5xF4-at-n = 41 pattern), 200 seeds."""
            out = {"kind": "ff-nearexact"}
            l13 = permitted(2003, 4)
            for k in (1, 2, 3):
                cell = xco.IsoCell("FFNX%d-%d" % (k, l13), l13, 4, 13)
                rs = dry.sr6_readings(cell, l13, k, 8, range(seeds_k), "ffnx")
                out["K13shape_k=%d" % k] = {
                    "l": l13, "M": 8, "S": est.S_of(8), "seeds": seeds_k,
                    "exact_seeds": sum(1 for x in rs if x["exact"]),
                    "v3_clause_fires": sum(1 for x in rs if x["v3_fires"]),
                    "v4_clause_fires": sum(1 for x in rs if x["v4_fires"]),
                    "predicted_exact_rate": math.exp(-est.S_of(8) * k / float(4 * l13 - 1))}
            l41 = permitted(549756390943, 4)
            cell = xco.IsoCell("FFNXF-%d" % l41, l41, 4, 41)
            cut = int(frac * 4294967296)
            fn = lambda i: (i % 4) + (4 if ((i * 2654435761) % 4294967296) < cut else 0)
            M, S = 16, est.S_of(16)
            ex = v3 = v4 = 0
            for s in range(seeds_frac):
                stream = est.PairStream(cell, s, S, label="ffnxf")
                U = stream.support(S)
                lab = est.cache_labels(cell, stream, U, fn)
                g = est.gain(stream, S, lab, M)
                if fam.is_exact(g, M):
                    ex += 1
                    if est.image_size(lab, U) not in fam.SR6_ALLOWED_IMAGES:
                        v3 += 1
                    if len(fam.used_cell_image(stream, S, lab, M)) not in fam.SR6_ALLOWED_IMAGES:
                        v4 += 1
            out["K41shape_frac"] = {"l": l41, "M": M, "S": S, "frac": frac, "seeds": seeds_frac,
                                    "exact_seeds": ex, "v3_clause_fires": v3, "v4_clause_fires": v4,
                                    "predicted_exact_rate": math.exp(-S * frac)}
            return out


        # ----------------------------------------------------------------- pc16bc
        def pc16bc(start, count):
            """Per seed, on the permitted Z/l' ladder at M = 16, S = 2^15: the key
            on the three primes (PC-16b), the version-4 decay (key, 0.7, 0.4) and
            the version-3 decay (key, 0.9, 0.8) (PC-16c), each read as z_ladder
            reads the key, with the seed's own 50 uniform null draws."""
            lad = permitted_ladder()
            primes = [l for l, _a, _m in lad]
            M, S = gate.FLAT_M, est.S_of(gate.FLAT_M)
            out = []
            for s in range(start, start + count):
                rec = {"seed": s, "primes": primes, "arms": {}, "null_G": {}}
                for idx, l in enumerate(primes):
                    cell = gate.ZCell("FF16-Z-%d" % l, l)
                    stream = est.PairStream(cell, s, S, label="ff16")
                    U = stream.support(S)
                    nd = est.null_distribution(stream, S, U, M, cell.id, s)
                    rec["null_G"][str(l)] = [d["G"] for d in nd]
                    key = est.cache_labels(cell, stream, U, gate.interval_key(l, M))
                    arms = [("key", key)]
                    for rho in sorted(set((OLD_DECAY[idx], NEW_DECAY[idx]))):
                        if rho < 1.0:
                            arms.append(("mix%g" % rho, est.planted_mixture(
                                key, U, M, rho, est.seed_of("decay", cell.id, M, rho, s))))
                    for name, lab in arms:
                        rd = est.read_arm(stream, S, U, lab, M, cell.id, name, s)
                        rec["arms"]["%s@%d" % (name, l)] = {
                            "G": rd["direct"]["G"], "shuffle_median": est.median(rd["shuffle"]),
                            "shuffle_max": max(rd["shuffle"]),
                            "p": (1 + sum(1 for x in rd["shuffle"] if x >= rd["direct"]["G"])) / (est.R_SH + 1.0),
                            "estimated": rd["direct"]["used"] > 0 and 2 * rd["direct"]["used_mass"] >= rd["direct"]["S"]}
                out.append(rec)
            return {"kind": "ff-pc16bc", "start": start, "count": count, "primes": primes,
                    "old_decay": list(OLD_DECAY), "new_decay": list(NEW_DECAY), "seeds": out}


        # ---------------------------------------------------------------- zladder
        def zladder():
            lad = permitted_ladder()
            for l, _a, _m in lad:
                negp.check_permitted_order(l)
            z = gate.z_ladder(rhos=(1.0,), ladder=lad, prefix="FF-Z-")
            c = gate.pc16c_decay(ladder=lad, prefix="FF-Z-")
            return negp.jsonable({"kind": "ff-zladder", "ladder": lad, "z_ladder": z, "pc16c_instance": c})


        # ------------------------------------------------------------------ small
        def gate_instance(l, M, seeds, tag, with_sat=True):
            """PC-2, PC-6b, PC-6d and IR-2 on Z/(4 l) at M, applied as check_gate
            and stage2_cell apply them; per-seed margins returned."""
            cell = xco.IsoCell("FFG-%s-%d" % (tag, l), l, 4, 0)
            S = est.S_of(M)
            uni, sat, pu, ps = [], [], [], []
            for s in seeds:
                stream = est.PairStream(cell, s, S, label="ffgate")
                U = stream.support(S)
                e = est.cache_labels(cell, stream, U, lambda i: i % 4)
                uni.append(est.null_distribution(stream, S, U, M, cell.id, s, draws=est.R_RL_GATE))
                pl = est.planted_marginal_labels(U, M, est.seed_of("planted", cell.id, M, s))
                pu.append(est.read_arm(stream, S, U, pl, M, cell.id, "planted", s))
                if with_sat:
                    sat.append(est.null_distribution(stream, S, U, M, cell.id + "/GSAT", s, strata=e, q=4))
                    pl2 = est.planted_marginal_labels(U, M, est.seed_of("planted-strat", cell.id, M, s))
                    ps.append(est.read_arm(stream, S, U, pl2, M, cell.id, "planted-strat", s, e))
            nu = est.summarize_null(uni)
            rows_u = est.seed_rows(pu, nu, nu["V"])
            kept_u = [est.median(rd["shuffle"]) - nu["q50"] for rd in pu]
            res = {"l": l, "M": M, "S": S, "seeds": list(seeds), "W_u": nu["W"], "q50_u": nu["q50"],
                   "occupied_all": all(gate.occupied(d, M) for ds in uni for d in ds),
                   "pc6b_pass": (est.clause_L1(rows_u, nu) and est.median(kept_u) >= 3.0 * nu["W"]
                                 and not est.clause_L3(rows_u, nu)),
                   "pc6b_E_RL": [r["E_RL"] for r in rows_u], "pc6b_kept": kept_u,
                   "pc6b_rank_hits": sum(1 for r in rows_u if r["p"] <= RANK_P + 1e-12)}
            if with_sat:
                ns = est.summarize_null(sat)
                rows_s = est.seed_rows(ps, ns, ns["V"])
                kept_s = [est.median(rd["shuffle"]) - nu["q50"] for rd in ps]
                mult = []
                for ds in sat:
                    vals = {}
                    for d in ds:
                        vals[d["G"]] = vals.get(d["G"], 0) + 1
                    mult.append(max(vals.values()))
                res.update({"W_sat": ns["W"], "V_sat": ns["V"],
                            "ir2_ok": ns["W"] > 0 and all(v > 0 for v in ns["V"]),
                            "pc6d_pass": est.median(kept_s) >= 3.0 * nu["W"] and not est.clause_L3(rows_s, ns),
                            "pc6d_kept": kept_s, "pc6d_rank_hits": sum(1 for r in rows_s if r["p"] <= RANK_P + 1e-12),
                            "sat_max_multiplicity_per_seed": mult, "sat_draws_per_seed": est.R_RL})
            return res


        def exact_instance(l, M, seeds, tag):
            """PC-3/PC-4 (EXACT and OCCUPIED) and PC-6a (unstratified shuffle at most
            q99 of the uniform gate null) for the exact label i mod M on Z/(4 l)."""
            cell = xco.IsoCell("FFX-%s-%d" % (tag, l), l, 4, 0)
            S = est.S_of(M)
            uni, reads = [], []
            for s in seeds:
                stream = est.PairStream(cell, s, S, label="ffgate")
                U = stream.support(S)
                uni.append(est.null_distribution(stream, S, U, M, cell.id, s, draws=est.R_RL_GATE))
                lab = est.cache_labels(cell, stream, U, lambda i, M=M: i % M)
                reads.append(est.read_arm(stream, S, U, lab, M, cell.id, "exact", s))
            nu = est.summarize_null(uni)
            return {"l": l, "M": M, "S": S,
                    "exact_occupied_all": all(gate.exact(rd["direct"], M) and gate.occupied(rd["direct"], M)
                                              for rd in reads),
                    "shuffle_medians": [est.median(rd["shuffle"]) for rd in reads], "q99_u": nu["q99"],
                    "W_u": nu["W"], "pc6a_pass": all(est.median(rd["shuffle"]) <= nu["q99"] for rd in reads)}


        def toy_curve():
            """The non-declared toy Koblitz curve n = 9 (order 508 = 4 x 127): the
            exact controls, CK-H4, PC-4b, the calibration rows, and PC-9 (curve
            against index sampling) by Monte Carlo."""
            cell = gate.CurveCell("FF-T9", 9, 0, 1, "koblitz_prime_l", None)
            C = cell.C
            N = core.order_lucas(9, 0)
            negp.check_permitted_order(N)
            fac = core.prime_factors(N)
            rng = random.Random(est.seed_of("ff-toy", 9))
            out = {"n": 9, "order": N, "factorisation": sorted(fac.items()),
                   "route_C_agrees": core.count_by_trace(C) == N, "hasse_unique": core.hasse_unique(9, N)}
            ok, why, _P = core.prove_order(C, N, fac, rng)
            out["route_B"] = why
            g4 = core.point_of_order_4(C, N, rng)
            h2, _ = core.make_h2(C)
            h4c, _ = core.make_h4_constructed(C, N, g4)
            h4h, _ = core.make_h4_halving(C, g4)
            out["h4_is_hom"] = core.verify_homomorphism(C, h4c, 4, rng)
            mism = 0
            for _ in range(10000):
                P = C.sample_point(rng)
                if not (h4c(P) == h4h(P)):
                    mism += 1
            out["pc4b_mismatches"] = mism
            for name, h, M in (("h2", h2, 2), ("h4", h4c, 4)):
                flags = []
                for s in est.SEEDS:
                    S = est.S_of(M)
                    stream = est.PairStream(cell, s, S, label="fftoy")
                    U = stream.support(S)
                    lab = est.cache_labels(cell, stream, U, h)
                    g = est.gain(stream, S, lab, M)
                    flags.append(gate.exact(g, M) and gate.occupied(g, M))
                out["%s_exact_occupied_every_seed" % name] = all(flags)
