      The contract's own null - a correctly functioning run in which every
      declared role and held-out label carries nothing beyond the exact
      components. A rule's per-run rate is the probability that it stops the
      run, voids it or a cell, or turns a role ART-DEF, under that null,
      bounded by the method named in its row (EXACT, MC with a 95 percent
      upper bound, MARGIN with the standard deviation inflated by 2, or EXCH
      order-statistic laws). The aggregate is a union bound.
