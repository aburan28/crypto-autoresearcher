        import stage1_gate as gate
        import negpath as negp

        NULL = {"q50": 5.0, "q99": 6.0, "W": 1.0, "V": [0.5] * 10}
        LOG2_DECLARED = [math.log2(2003), math.log2(130873), math.log2(2095853)]
        LEAD_LEVELS = (4.0, 6.0, 8.0)


        # ------------------------------------------------------------ C-7 namegrid
        def syn_rows(kind, level=0.0):
            rows = []
            for s in est.SEEDS:
                if kind == "excess":
                    e_sh, e_rl, p = level + 0.05 * s, level + 0.05 * s, 1.0 / 11.0
                else:
                    e_sh, e_rl, p = (0.2 if s % 2 else -0.2), 0.1, 6.0 / 11.0
                rows.append({"seed": s, "G": NULL["q50"] + e_rl, "E_RL": e_rl, "E_Sh": e_sh,
                             "p": p, "V": 0.5, "Z": e_sh / 0.5, "used": 64, "excluded": 0,
                             "estimated": not (kind == "unestimated")})
            return rows


        def entry(kind="null", level=0.0, invalid=False):
            return {"rows": syn_rows(kind, level), "null": dict(NULL), "image_sizes": [16] * 10,
                    "used_cell_images": [None] * 10, "ir2_invalid": invalid}


        def declared_grid():
            grid = []
            for cid in sorted(est.FAMILY_ALPHABETS):
                koblitz = cid in fam.KOBLITZ_CELLS
                for M in est.FAMILY_ALPHABETS[cid]:
                    for name in fam.role_names(koblitz) + fam.HELD_OUT_NAMES:
                        grid.append((cid, M, name))
            return grid


        def build_outs(plants=None, drop=()):
            plants = plants or {}
            outs = {}
            for cid, M, name in declared_grid():
                if cid in drop:
                    continue
                spec = plants.get((cid, M, name), ("null", 0.0, False))
                outs.setdefault(cid, {})[(name, M)] = entry(*spec)
            return outs


