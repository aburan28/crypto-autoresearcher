        """CODE-CALIB, calibration_rows.py, of EXP-BINSTD-6f1e66 (FIXTURE-B2 of
        version 1, carried with its import repointed to CODE-CORE and PC-14 taking
        the gate's h2 reading): the two exact calibration rows of
        IDEA-20260926-d06324, absorbed as the calibration of the bucket-gain
        instrument, read on CELL-RC1 and CELL-K19.

        ROW P1  x-coordinate projection:  l_fibre == 1 and b == 2, EXACTLY.
        ROW P2  halving-trace bit h2:     b == 1 EXACTLY on the full group, and
                                          l_image == 0 on the odd-order subgroup.

        Both readings of L are reported (l_fibre, log2 of the mean fibre size, and
        l_image, log2 of the image size); see design finding DF-5.
        Committed by TASK-20260929-291567. NOT RUN by the design task.
        """
        import math

        from binstd_core import INF, make_h2


        def x_projection(C):
            """pi(P) == x(P); its fibre is the pair P, -P (a singleton at x == 0)."""

            def pi(P):
                return "inf" if P is INF else P[0]

            return pi


        def fibre_of_x(C, x):
            P = C.lift_x(x)
            if P is None:
                return []
            Q = C.neg(P)
            return [P] if P == Q else [P, Q]


        def row_p1(C, rng, fibre_pairs=32):
            """EXACT row: for fibres of size at most 2 the sums are enumerated in
            full, so b is exact and not sampled."""
            pi = x_projection(C)
            sizes, bs = [], []
            got = 0
            while got < fibre_pairs:
                x1 = rng.randrange(1, C.F.q)
                x2 = rng.randrange(1, C.F.q)
                f1, f2 = fibre_of_x(C, x1), fibre_of_x(C, x2)
                if len(f1) == 0 or len(f2) == 0 or x1 == x2:
                    continue
                vals = set()
                for A in f1:
                    for B in f2:
                        vals.add(pi(C.add(A, B)))
                sizes.extend([len(f1), len(f2)])
                bs.append(len(vals))
                got += 1
            mean_fibre = sum(sizes) / len(sizes)
            return {"row": "P1", "l_fibre": math.log2(mean_fibre), "l_image": None,
                    "b": sum(bs) / len(bs), "b_values": sorted(set(bs)), "exact": True}


        def row_p2_full_group(C, rng, fibre_pairs=32, per_pair=4096):
            """h2 is a homomorphism, so every sampled fibre pair gives exactly one
            value of h2(A + B): b == 1 EXACTLY."""
            h, M = make_h2(C)
            bs = []
            for _ in range(fibre_pairs):
                a = rng.randrange(M)
                b = rng.randrange(M)
                vals = set()
                drawn = 0
                while drawn < per_pair:
                    A = C.sample_point(rng)
                    if not (h(A) == a):
                        continue
                    B = C.sample_point(rng)
                    if not (h(B) == b):
                        continue
                    S = C.add(A, B)
                    if S is INF:
                        continue
                    vals.add(h(S))
                    drawn += 1
                bs.append(len(vals))
            return {"row": "P2-full-group", "l_image": math.log2(M),
                    "b": sum(bs) / len(bs), "b_values": sorted(set(bs)), "exact": False,
                    "note": "sampled; a homomorphism admits only b == 1"}


        def row_p2_odd_subgroup(C, N, rng, trials=4096):
            """On the odd-order subgroup h2 is constant, so the IMAGE has size 1
            and l_image == 0; l_fibre is reported beside it."""
            odd = N
            while odd % 2 == 0:
                odd //= 2
            h, _M = make_h2(C)
            cof = N // odd
            image = set()
            for _ in range(trials):
                G = C.mul(cof, C.sample_point(rng))
                if G is INF:
                    continue
                image.add(h(G))
            return {"row": "P2-odd-subgroup", "l_image": math.log2(len(image)),
                    "l_fibre": math.log2(odd), "image": sorted(image), "cofactor": cof,
                    "exact": False}


        def check_calibration(p1, p2g, p2o, gate_h2_G=None):
            """PC-11 to PC-14 exactly as pre-registered; gate_h2_G is the gate's h2
            reading on the same cell (PC-14, b == M / G with M == 2)."""
            fails = []
            if not (abs(p1["l_fibre"] - 1.0) < 1e-12):
                fails.append("PC-11 row P1 l_fibre is not exactly 1")
            if not (p1["b_values"] == [2]):
                fails.append("PC-11 row P1 b is not exactly 2 on every fibre pair")
            if not (p2g["b_values"] == [1]):
                fails.append("PC-12 row P2 b is not exactly 1 on the full group")
            if not (abs(p2o["l_image"]) < 1e-12):
                fails.append("PC-13 row P2 l_image is not exactly 0 on the odd subgroup")
            if gate_h2_G is not None and not (abs(p2g["b"] - 2.0 / gate_h2_G) < 1e-6):
                fails.append("PC-14 b == M / G fails between the fixtures")
