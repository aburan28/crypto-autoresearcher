                    "S": S, "permitted": permitted, "null": est.summarize_null(null), "reads": reads}


        def summarize(sr, rhos=NEG_RHOS):
            """Clauses, margins and the two floors per class."""
            ns = sr["null"]
            W = ns["W"]
            per = {}
            for (name, rho), rd in sr["reads"].items():
                rows = est.seed_rows(rd, ns, ns["V"])
                ok = est.estimated(rows)
                med_sh = est.median([est.median(x["shuffle"]) for x in rd])
                per["%s@%g" % (name, rho)] = {
                    "class": name, "rho": rho, "estimated": ok,
                    "L1": ok and est.clause_L1(rows, ns), "L3": ok and est.clause_L3(rows, ns),
                    "E_Sh_over_W": est.median([r["E_Sh"] for r in rows]) / W if W > 0 else None,
                    "E_RL_over_W": est.median([r["E_RL"] for r in rows]) / W if W > 0 else None,
                    "offset_over_W": (ns["q50"] - med_sh) / W if W > 0 else None,
                    "rank_floor_seeds": sum(1 for r in rows if r["p"] <= 1.0 / (est.R_SH + 1) + 1e-12),
                    "rows": rows, "shuffle_max": [max(x["shuffle"]) for x in rd]}
            floors = {}
            for name in ("XF", "XC"):
                neg, lead, neg_open, lead_open = None, None, True, True
                for rho in sorted(rhos, reverse=True):
                    d = per["%s@%g" % (name, rho)]
                    if neg_open:
                        if d["L3"]:
