        def beta_expect(fn, a, b, grid=20000):
            """E[fn(U)] for U ~ Beta(a, b), by the midpoint rule on [0, 1]."""
            lg = math.lgamma(a + b) - math.lgamma(a) - math.lgamma(b)
            tot = 0.0
            for i in range(grid):
                u = (i + 0.5) / grid
                tot += fn(u) * math.exp(lg + (a - 1) * math.log(u) + (b - 1) * math.log1p(-u))
            return min(1.0, tot / grid)


        def exch_shared_quantile_rate(n_null, p=0.99, seeds=10):
            """EXCH. A check "median of ten readings at most the type-1 p-quantile
            of n_null null draws, on every one of `seeds` seeds", the quantile
            shared by the seeds, when each reading is exchangeable with a null
            draw (the shuffled or curve-sampled reading has the null's law). The
            exceedance probability of the order statistic of rank ceil(p n) is
            U ~ Beta(n - r + 1, r); a median of ten above it needs five of ten
            readings above it. Returns E_U[1 - (1 - P(Bin(10, U) >= 5))^seeds]."""
            r = max(1, int(math.ceil(p * n_null - 1e-9)))
            return beta_expect(lambda u: 1.0 - (1.0 - binom_tail(10, u, 5)) ** seeds, n_null - r + 1, r)


        def exch_band_rate(n_ref, lo_p=0.005, hi_p=0.995):
            """EXCH. PC-9: the median of ten curve readings outside the type-1
            [lo_p, hi_p] quantiles of n_ref reference readings of the same law."""
            r_hi = max(1, int(math.ceil(hi_p * n_ref - 1e-9)))
            r_lo = max(1, int(math.ceil(lo_p * n_ref - 1e-9)))
            up = beta_expect(lambda u: binom_tail(10, u, 5), n_ref - r_hi + 1, r_hi)
            down = beta_expect(lambda u: binom_tail(10, u, 5), r_lo, n_ref - r_lo + 1)
            return min(1.0, up + down)


        def point_mass_upper(maxima, draws, alpha=ALPHA):
            """The largest point mass pi of the null G law consistent, at level
            alpha, with every one of len(maxima) seeds showing at most max(maxima)
            equal values among its draws: P(Bin(draws, pi) <= m)^seeds = alpha."""
            m, n = max(maxima), len(maxima)
            lo, hi = 0.0, 1.0
            for _ in range(80):
                mid = 0.5 * (lo + hi)
                if (1.0 - binom_tail(draws, mid, m + 1)) ** n > alpha:
                    lo = mid
                else:
                    hi = mid
            return hi


        def tie_bound_pi(pi, need, n_draws):
            """Per-seed bound on need or more of n_draws draws sharing one value
            when no value has mass above pi: C(n_draws, need) pi^(need - 1)."""
            lg = (math.lgamma(n_draws + 1) - math.lgamma(need + 1) - math.lgamma(n_draws - need + 1)) \
                / math.log(10) + (need - 1) * math.log10(max(pi, 1e-300))
            return 0.0 if lg < -300 else min(1.0, 10.0 ** lg)


        def tie_bound(maxcount, draws, need, n_draws):
            """Per-seed bound on need or more of n_draws null draws sharing one
            G value: C(n_draws, need) pi^(need - 1), pi the upper bound on the
            largest point mass from the observed largest multiplicity."""
            pi = p_upper(maxcount, draws)
            lg = (math.lgamma(n_draws + 1) - math.lgamma(need + 1) - math.lgamma(n_draws - need + 1)) \
                / math.log(10) + (need - 1) * math.log10(pi)
            return 0.0 if lg < -300 else min(1.0, 10.0 ** lg)


        def z_of(rec, arm, l):
            a = rec["arms"]["%s@%d" % (arm, l)]
            g = rec["null_G"][str(l)]
            v = est.quantile(g, est.WIDTH_QUANTILE) - est.quantile(g, 0.50)
            return (a["G"] - a["shuffle_median"]) / v if v > 0 else None


        def pc16bc_tables(docs):
            seeds = sorted((r for d in docs for r in d["seeds"]), key=lambda r: r["seed"])
            primes = docs[0]["primes"]
            xs = [math.log2(l) for l in primes]
            plans = {"flat": ("key", "key", "key"),
                     "new_decay": tuple("key" if r >= 1.0 else "mix%g" % r for r in NEW_DECAY),
                     "old_decay": tuple("key" if r >= 1.0 else "mix%g" % r for r in OLD_DECAY)}
            slopes = {k: [] for k in plans}
            for rec in seeds:
                for k, arms in plans.items():
                    ys = [z_of(rec, arms[i], primes[i]) for i in range(3)]
                    if all(y is not None for y in ys):
                        slopes[k].append(est.ols_slope(xs, ys))
            reps = {k: {} for k in plans}
            for b in range(len(seeds) // 10):
                block = seeds[10 * b:10 * b + 10]
                for k, arms in plans.items():
                    cells_M, keys = {}, []
                    for i, l in enumerate(primes):
                        pooled = [g for rec in block for g in rec["null_G"][str(l)]]
                        ns = est.null_summary([{"G": g} for g in pooled])
                        rows = []
                        for rec in block:
                            a = rec["arms"]["%s@%d" % (arms[i], l)]
                            gl = rec["null_G"][str(l)]
                            v = est.quantile(gl, est.WIDTH_QUANTILE) - est.quantile(gl, 0.50)
                            e_sh = a["G"] - a["shuffle_median"]
                            rows.append({"G": a["G"], "E_RL": a["G"] - ns["q50"], "E_Sh": e_sh,
                                         "p": a["p"], "V": v, "Z": e_sh / v if v > 0 else None,
                                         "estimated": a["estimated"]})
                        cells_M[(l, 16)] = {"rows": rows, "null": ns}
                        keys.append((l, 16))
                    v = est.classify_family(cells_M, keys, xs)["verdict"]
                    reps[k][v] = reps[k].get(v, 0) + 1
            out = {"seeds": len(seeds), "replicates": len(seeds) // 10, "replicate_verdicts": reps}
            for k, sl in slopes.items():
                mu, sd = mean_sd(sl)
                neg = sum(1 for x in sl if x < 0)
                out[k] = {"per_seed_slopes": len(sl), "mean_slope_per_bit": mu, "sd": sd,
                          "negative": neg, "non_negative": len(sl) - neg}
            n = len(slopes["flat"])
            out["PC-16b_L2_fail_rate_bound"] = binom_tail(10, p_upper(out["flat"]["negative"], n), 9)
            n = len(slopes["new_decay"])
            out["PC-16c_new_false_fail_rate_bound"] = binom_tail(10, p_upper(out["new_decay"]["non_negative"], n), 2)
            out["PC-16c_new_false_fail_rate_point"] = binom_tail(10, out["new_decay"]["non_negative"] / float(n), 2)
            n = len(slopes["old_decay"])
            out["PC-16c_old_false_fail_rate_point"] = binom_tail(10, out["old_decay"]["non_negative"] / float(n), 2)
            return out


        def key_margin_rate(rows, shmax, W, M=None):
            """MARGIN: the PC-7 / PC-16d criteria of one key at one (shape, M)."""
            G = [r["G"] for r in rows]
            r = 0.0
            if M is not None:
                r += median_fail(cantelli_below(G, M / 3.0)) + median_fail(cantelli_above(G, float(M)))
            r += median_fail(cantelli_below([x["E_RL"] for x in rows], 3.0 * W))
            r += median_fail(cantelli_below([x["E_Sh"] for x in rows], 3.0 * W))
            r += binom_tail(10, cantelli_below([g - m for g, m in zip(G, shmax)], 0.0), 3)
            return min(1.0, r)


        def l2_fail_rate(z_lists, xs):
            """MARGIN: L2 fails when at least 9 of 10 per-seed slopes are negative."""
            sl = [est.ols_slope(xs, [z[s] for z in z_lists]) for s in range(len(z_lists[0]))]
            return binom_tail(10, cantelli_below(sl, 0.0), 9), sl


