                "EXACT rank bound (L3 needed at three lead keys)", 15 * BL)
            add("SR-5", "stop and report", "a null run", "EXACT: a null run contradicts no promoted finding", 0.0)
            add("SR-6 clause (1)", "stop and route", "a null run", "EXACT: PO-1 (no exact filter strictly between 4 and l)", 0.0)
            ne_doc = by["ff-nearexact"][0]
            v4f = sum(v["v4_clause_fires"] for k, v in ne_doc.items() if isinstance(v, dict) and "v4_clause_fires" in v)
            v3f = sum(v["v3_clause_fires"] for k, v in ne_doc.items() if isinstance(v, dict) and "v3_clause_fires" in v)
            b6 = max(x["bound_per_seed"] for x in an["sr6_revised_bound"])
            add("SR-6 clause (2), revised", "stop and route", "every Stage 2 reading, near-exact controls by MC",
                "EXACT bound per seed times readings; MC fires v4 %d (v3 clause %d)" % (v4f, v3f),
                min(1.0, (N_DECLARED_ROWS + 3 * len(STAGE2_KEYS)) * 10 * b6))
            add("IR-13, IR-14, IR-15, IR-16, IR-24, SR-2", "void or checkpoint", "a correctly functioning run",
                "EXACT: not data-dependent (procedure, custody, infrastructure)", 0.0)
            art_res = N_DECLARED_ROWS * BL
            add("false ART-RES (not a stop)", "an arm reads ART-RES", "every declared (cell, role, M)",
                "EXACT rank bound", art_res, counted=False)
            total = sum(x["per_run_rate"] for x in rows if x["counted_in_clean"])
            clean = max(0.0, 1.0 - total)
            worst_rule = max(rows, key=lambda x: x["per_run_rate"] if x["counted_in_clean"] else -1.0)
            return {"kind": "ff-table", "rows": rows,
                    "every_rule_at_or_below_0_05": all(x["at_or_below_0_05"] for x in rows),
                    "sum_of_counted_rates": total,
                    "clean_classification_probability_lower_bound": clean,
                    "clean_all_NEG_probability_lower_bound": max(0.0, clean - art_res),
                    "expected_attempts_per_clean_run": (1.0 / clean) if clean > 0 else None,
                    "largest_counted_rule": worst_rule["rule"], "pc16bc": bc,
                    "B_L3": BL, "inflate": INFLATE}


        def main(argv):
            cmd = argv[0] if argv else ""
            if cmd == "analytic":
                out = analytic()
            elif cmd == "nearexact":
                out = nearexact()
            elif cmd == "pc16bc":
                out = pc16bc(int(argv[1]), int(argv[2]))
            elif cmd == "zladder":
                out = zladder()
            elif cmd == "small":
                out = small()
            elif cmd == "gate128":
                out = gate128()
            elif cmd == "combine":
                out = combine([json.load(open(f)) for f in argv[1:]])
            else:
                raise SystemExit("usage: falsefire.py analytic | nearexact | pc16bc START COUNT | "
                                 "zladder | small | gate128 | combine FILE ...")
            print(json.dumps(negp.jsonable(out), sort_keys=True))


        if __name__ == "__main__":
            main(sys.argv[1:])

