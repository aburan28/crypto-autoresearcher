      file: stage1_gate.py
      extract_as: experiments/EXP-BINSTD-811a2e/impl/stage1_gate.py
      version_4_status: CHANGED (code_delta CX-3)
      version_3_reference_sha256: 98caf3d56c8b7cd04b12518235423331ee6fbe292fcb5597843799f734c84d4a
      reference_sha256: 87f82409ef68144ce3c14c86453cd2792e2fd33695c56e2d1b7636cf8c18f624
      code: |
        """CODE-GATE, stage1_gate.py, of EXP-BINSTD-811a2e (version 4): the
        declared cells; setup and admission (AR-B1, AR-B1-C, AR-O) with every toy
        l proved prime by complete trial division (RR-11); the per-cell gate
        (PC-2, PC-3, PC-4, PC-4b, PC-6a, PC-6b, PC-6d and the PC-9 readings); the
        run-level controls PC-1, PC-5, PC-6c, PC-7, PC-7c, PC-16, PC-16b with the
        Z/l reference floor; the PC-16c lead guard; PC-9; and issue_clearance,
        the PC-10 guard (RR-10). Pass criteria are stated in the audit sheet
        above this code and placed in SR-1 of the specification.

        VERSION 4 CHANGES (code_delta CX-3): (1) RV-2 - PC-16c is pc16c_decay, a
        LEAD guard with the stronger planted decay DECAY_RHOS = (1.0, 0.7, 0.4),
        outside z_ladder.passed and outside the clearance; its record goes to
        families.stage3 as lead_guard_passed. (2) RV-6 - z_ladder and
        pc16c_decay take the ladder and a cell-id prefix as parameters, so that
        design computations run on permitted primes; the declared Z_LADDER is
        the default used by the run. (3) RV-5 - the clearance requires the
        curve-path LEAD-reach record "pc16d" (negpath.pc16d_curve_reach). (4)
        RV-12 - PC-9's curve-sampled readings are taken through CurveView, so
        on CELL-K17C they are sampled on the curve and not through the verified
        table the reference also uses. (5) z_ladder's report is keyed by
        strings and carries the key's per-seed rows and shuffle maxima.

        RUN ORDER, as the specification's S1-0: (1)
        certificate.certificate_controls; (2) pc1_exact_grid; (3) setup_cell on
        all seven curve cells; (4) pc5_composite; (5) gate_cell, check_gate and
        pc9_cell on CELL-K17C; (6) pc6c_stratified_exact; (7) z_ladder and
        pc16c_decay; (8) negpath.pc16d_curve_reach; (9)
        exact_content.pc18_isomorph_gate; (10) gate_cell and check_gate on
        CELL-RC1 with the calibration rows. Then per Stage 2 cell: gate_cell,
        check_gate, pc9_cell where declared, issue_clearance, and only then
        families.stage2_cell, which raises without the clearance.

        Committed by TASK-20261002-f48089 (version-3 text by TASK-20260929-749b50
        otherwise unchanged). NOT RUN by the design task except on permitted
        groups through CODE-FF (C-5). Pure Python 3, standard library only.
        Importing this module executes nothing beyond definitions and constants.
        """
        import math
        import random

        import binstd_core as core
        import certificate
        import estimator as est
        import families as fam
        import exact_content as xco

        INF = core.INF
        T19 = (1 << 19) | (1 << 5) | (1 << 2) | (1 << 1) | 1
        T17 = (1 << 17) | (1 << 3) | 1
        TD_PROOF_LIMIT = 1 << 40

        CELLS = {
            "CELL-K13": {"n": 13, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 8012, "fac": {2: 2, 2003: 1}},
            "CELL-K19": {"n": 19, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": T19, "order": 523492, "fac": {2: 2, 130873: 1}},
            "CELL-K23": {"n": 23, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 8383412, "fac": {2: 2, 2095853: 1}},
            "CELL-K41": {"n": 41, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 2199025563772,
                         "fac": {2: 2, 549756390943: 1}},
            "CELL-K17C": {"n": 17, "A": 0, "B": 1, "kind": "koblitz_composite",
                          "poly": T17, "order": 130972, "fac": {2: 2, 137: 1, 239: 1}},
            "CELL-O19": {"n": 19, "A": 46693, "B": 306147, "kind": "ordinary",
                         "poly": T19, "order": 523646, "fac": {2: 1, 261823: 1}},
            "CELL-RC1": {"n": 17, "A": 97044, "B": 126251, "kind": "ordinary",
                         "poly": T17, "order": 130412, "fac": {2: 2, 32603: 1}},
        }
        # (l, alphabets, lead alphabet); M = 16 added at 2095853 (RR-5).
        Z_LADDER = ((2003, (16, 8), 16), (130873, (64, 16), 64), (2095853, (128, 32, 16), 128))
        Z2_ALPHABETS = (8, 16, 32, 64, 128)
        RHOS = (1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.25, 0.125, 0.0625)
        FLAT_M = 16
        DECAY_RHOS = (1.0, 0.7, 0.4)
        PC6C_SHAPES = (("CELL-ZS16", 2003, 16, 16), ("CELL-ZS64", 2003, 64, 64))
        PC6D_M = 16
        RUN_LEVEL_REQUIRED = ("certificate", "pc1", "pc5", "gate_K17C", "pc6c",
                              "z_ladder", "pc16d", "pc18", "calibration_RC1")


        # ------------------------------------------------------------------ cells
        class CurveCell:
            """A binary-curve cell; add returns None for the identity."""

            def __init__(self, cid, n, A, B, kind, poly=None):
                self.id, self.n, self.kind = cid, n, kind
                self.F, self.NB, self.field_record = core.build_field(n, poly)
                self.C = core.Curve(self.F, A, B)
                self.mask = (1 << n) - 1

            def sample(self, rng):
                return self.C.sample_point(rng)

            def add(self, P, Q):
                return self.C.add(P, Q)

            def key(self, P):
                return (P[0] << self.n) | P[1]

            def unpack(self, k):
                return (k >> self.n, k & self.mask)


        class TableCell(CurveCell):
            """A cyclic cell sampled through its verified discrete-logarithm table."""

            def attach(self, pts, tab):
                self.pts, self.tab = pts, tab

            def sample(self, rng):
                return self.pts[rng.randrange(1, len(self.pts))]


        class CurveView:
            """RV-12. A view of a curve cell that always samples ON THE CURVE
            (Curve.sample_point), whatever the cell's own sampler; for a
            CurveCell it reproduces the cell's own stream exactly."""

            def __init__(self, cell):
                self.id, self.cell = cell.id, cell

            def sample(self, rng):
                return self.cell.C.sample_point(rng)

            def add(self, P, Q):
                return self.cell.C.add(P, Q)

            def key(self, P):
                return self.cell.key(P)

            def unpack(self, k):
                return self.cell.unpack(k)


        class IndexCell:
            """PC-9 reference sampler: indices of a verified table, sums by index."""

            def __init__(self, cid, pts):
                self.id, self.pts, self.N = cid, pts, len(pts)

            def sample(self, rng):
                return rng.randrange(1, self.N)

            def add(self, i, j):
                s = (i + j) % self.N
                return None if s == 0 else s

            def key(self, i):
                return i

            def unpack(self, k):
                return self.pts[k]


        class ZCell:
            """Z/NZ with non-identity sampling; points are integers."""

            def __init__(self, cid, N):
                self.id, self.N = cid, N

            def sample(self, rng):
                return rng.randrange(1, self.N)

            def add(self, i, j):
                s = (i + j) % self.N
                return None if s == 0 else s

            def key(self, i):
                return i

            def unpack(self, k):
                return k


        # --------------------------------------------------------- setup (PC-8)
        def prove_prime_by_trial_division(m):
            """RR-11. A proof of primality by complete trial division to isqrt(m);
            None when m is at or above TD_PROOF_LIMIT."""
            if m >= TD_PROOF_LIMIT:
                return None
            if m < 2:
                return False
            if m % 2 == 0:
                return m == 2
            r = math.isqrt(m)
            d = 3
            while d <= r:
                if m % d == 0:
                    return False
                d += 2
            return True


        def setup_cell(cid, rng=None):
            """PC-8, carried, plus the trial-division proof of the cell's l."""
            spec = CELLS[cid]
            if rng is None:
                rng = random.Random(est.seed_of("setup", cid))
            kind, n = spec["kind"], spec["n"]
            if kind == "koblitz_composite":
                cell = TableCell(cid, n, spec["A"], spec["B"], kind, spec["poly"])
            else:
                cell = CurveCell(cid, n, spec["A"], spec["B"], kind, spec["poly"])
            C = cell.C
            rec = {"cell": cid, "kind": kind, "field": cell.field_record}
            fails = []
            if not (cell.field_record["irreducible"] and cell.field_record["nb_self_check"]):
                fails.append("PC-8 the field polynomial or normal-basis check failed")
            if kind.startswith("koblitz"):
                N = core.order_lucas(n, spec["A"])
                rec["order_route_A"] = N
                if n <= 19:
                    rec["order_route_C"] = core.count_by_trace(C)
                    if not (rec["order_route_C"] == N):
                        fails.append("PC-8 routes A and C disagree")
            else:
                N = core.count_by_trace(C)
                rec["order_route_C"] = N
            rec["order"] = N
            rec["order_design_time"] = spec["order"]
            if not (N == spec["order"]):
                fails.append("IR-9 the recomputed order differs from the design-time order; halt and refer")
            fac = None
            try:
                fac = core.prime_factors(N)
            except ArithmeticError as err:
                fails.append("PC-8 %s" % err)
            rec["factorisation"] = None if fac is None else sorted(fac.items())
            if fac is not None:
                if not (fac == spec["fac"]):
                    fails.append("PC-8 the factorisation differs from the design-time factorisation")
                ok, why, _P = core.prove_order(C, N, fac, rng)
                rec["route_B"] = why
                rec["hasse_unique"] = core.hasse_unique(n, N)
                if not (ok and rec["hasse_unique"]):
                    fails.append("PC-8 the order is not proved by route B")
                v = 0
                while N % (1 << (v + 1)) == 0:
                    v += 1
                rec["cofactor"] = 1 << v
                l_cell = max(fac)
                rec["l"] = l_cell
                rec["l_primality"] = core.primality_record(l_cell)
                rec["l_complete_trial_division_proof"] = prove_prime_by_trial_division(l_cell)
                if not (rec["l_complete_trial_division_proof"] is True):
                    fails.append("PC-8 the largest prime factor is not proved prime by complete trial division")
                if kind == "koblitz_prime_l" and not (fac == {2: 2, l_cell: 1}):
                    fails.append("AR-B1 the order is not 4 times a prime")
                if kind == "ordinary" and not (v in (1, 2) and fac == {2: v, l_cell: 1}):
                    fails.append("AR-O the cofactor is not 2 or 4 with a prime odd part")
                rec["order4_search_made"] = v == 2
                rec["point_of_order_4"] = None
                if v == 2:
                    rec["point_of_order_4"] = core.point_of_order_4(C, N, rng)
                    if rec["point_of_order_4"] is None:
                        fails.append("PC-8 no point of order 4 found")
                below, bits = certificate.capacity(N, fac, l_cell)
                rec["certificate_alphabets_below_l"] = below
                rec["certificate_bits"] = bits
                if cid in est.RULE_ALPHABETS:
                    got = tuple(1 << est.alphabet_exponent(math.log2(l_cell), p) for p in (3, 4))
                    rec["alphabets_by_rule"] = got
                    if not (got == est.RULE_ALPHABETS[cid]):
                        fails.append("PC-8 rule R-M gives alphabets that differ from the design-time table")
                if kind == "koblitz_composite":
                    g = core.find_generator(C, N, fac, rng)
                    if g is None:
                        fails.append("AR-B1-C no generator of order exactly N found")
                    else:
                        try:
                            pts, tab = core.build_dlog(C, g, N)
                            cell.attach(pts, tab)
                            rec["generator"] = g
                            rec["dlog_entries"] = len(tab)
                        except ArithmeticError as err:
                            fails.append("AR-B1-C %s" % err)
            rec["admitted"] = len(fails) == 0
            rec["failures"] = fails
            return cell, fac, rec


        # ------------------------------------------------------- per-cell gate
        def gate_grid(cid, forms_h4):
            """The gate alphabets with their S by rule R-S (carried)."""
            Ms = set(est.FAMILY_ALPHABETS.get(cid, ())) | {2}
            if forms_h4:
                Ms.add(4)
            if cid in est.PC9_ALPHABET:
                Ms.add(est.PC9_ALPHABET[cid])
            return {M: est.S_of(M) for M in sorted(Ms)}


        def pc9_filter(M):
            """RR-10. The PC-9 filter, OUTSIDE the declared family: the
            polynomial-basis coordinates of x at positions 1, 3, ..., 2r - 1
            (r = log2 M), packed into r bits. No declared arm is a window with
            gaps."""
            r = M.bit_length() - 1

            def f(P):
                x = P[0]
                v = 0
                for j in range(r):
                    v |= ((x >> (2 * j + 1)) & 1) << j
                return v

            return f


        def exact(g, M):
