            ("CELL-K23", "sampled", (128, 32, 16)),
            ("CELL-K41", "sampled", (16,)),
        )


        def linear_chunks(images, n):
            """Byte-chunk tables of the F_2-linear map sending t^j to images[j]."""
            tabs = []
            for k in range(0, n, 8):
                tab = [0] * 256
                for v in range(256):
                    acc = 0
                    for b in range(8):
                        if (v >> b) & 1 and k + b < n:
                            acc ^= images[k + b]
                    tab[v] = acc
                tabs.append(tab)
            return tabs


        def apply_chunks(tabs, a):
            v, k = 0, 0
            for tab in tabs:
                v ^= tab[(a >> k) & 255]
                k += 8
            return v


        def poly_inverse(a, mod):
            """Inverse of a nonzero a modulo the irreducible mod over F_2, by the
            extended Euclidean algorithm."""
            if a == 0:
                raise ZeroDivisionError("inverse of zero")
            r0, r1 = mod, a
            s0, s1 = 0, 1
            while r1:
                qq, rem = 0, r0
                d1 = r1.bit_length()
                while rem and rem.bit_length() >= d1:
                    sh = rem.bit_length() - d1
                    qq ^= 1 << sh
                    rem ^= r1 << sh
                r0, r1 = r1, rem
                s0, s1 = s1, s0 ^ core.clmul(qq, s1)
            if not (r0 == 1):
                raise ArithmeticError("not invertible")
            return core.pmod(s0, mod)


        class FastCell:
            """One declared curve cell with fast linear maps, cross-checked."""

            def __init__(self, cid):
                spec = gate.CELLS[cid]
                self.cid = cid
                self.cell = gate.CurveCell(cid, spec["n"], spec["A"], spec["B"], spec["kind"], spec["poly"])
                self.F, self.C, self.NB = self.cell.F, self.cell.C, self.cell.NB
                self.n = self.F.n
                self.A, self.B = spec["A"], spec["B"]
                self.order = spec["order"]
                self.koblitz = spec["kind"].startswith("koblitz")
                basis = [1 << j for j in range(self.n)]
                self.tmask = 0
                for j in range(self.n):
                    self.tmask |= self.F.trace(basis[j]) << j
                self.ht = linear_chunks([self.F.half_trace(b) for b in basis], self.n)
                self.nbt = linear_chunks([self.NB.to_nb(b) for b in basis], self.n)
                self.trA = self.tr(self.A)
                self.T2 = self.C.T2
                self.g4, self.ng4, self.h4c, self.h4h = None, None, None, None
                if self.koblitz:
                    rng = random.Random(zlib.crc32(("audit-g4:" + cid).encode("ascii")))
                    self.g4 = core.point_of_order_4(self.C, self.order, rng)
                    if self.g4 is None:
                        raise ArithmeticError("no point of order 4 on %s" % cid)
                    self.ng4 = self.C.neg(self.g4)
                    self.h4c = core.make_h4_constructed(self.C, self.order, self.g4)[0]
                    self.h4h = core.make_h4_halving(self.C, self.g4)[0]

            def tr(self, a):
                return core.popcount(a & self.tmask) & 1

            def H(self, a):
                return apply_chunks(self.ht, a)

            def to_nb(self, a):
                return apply_chunks(self.nbt, a)

            def mul(self, a, b):
                return core.pmod(core.clmul(a, b), self.F.mod)

            def inv(self, a):
                return poly_inverse(a, self.F.mod)

            def add(self, P, Q):
                x1, y1 = P
                x2, y2 = Q
                if x1 == x2:
                    if y2 == (x1 ^ y1):
                        return None
                    if x1 == 0:
                        return None
                    lam = x1 ^ self.mul(y1, self.inv(x1))
                    x3 = self.mul(lam, lam) ^ lam ^ self.A
                    y3 = self.mul(x1, x1) ^ self.mul(lam ^ 1, x3)
                    return (x3, y3)
                lam = self.mul(y1 ^ y2, self.inv(x1 ^ x2))
                x3 = self.mul(lam, lam) ^ lam ^ x1 ^ x2 ^ self.A
                y3 = self.mul(lam, x1 ^ x3) ^ x3 ^ y1
                return (x3, y3)

            def h2(self, P):
                return self.tr(P[0]) ^ self.trA

            def h4(self, P):
                """The halving presentation (DF-6), with the fast maps."""
                b0 = self.tr(P[0])
                P1 = P if b0 == 0 else self.add(P, self.ng4)
                if P1 is None:
                    return b0
                x1, y1 = P1
                lam = self.H(x1 ^ self.A)
                b1 = self.tr(y1 ^ self.mul(lam ^ 1, x1))
                return (b0 + 2 * b1) % 4

            def points_at(self, x):
                if x == 0:
                    return [self.T2]
                xi = self.inv(x)
                c = x ^ self.A ^ self.mul(self.B, self.mul(xi, xi))
                if self.tr(c):
                    return []
                z = self.H(c)
                y = self.mul(x, z)
                return [(x, y), (x, y ^ x)]

            def all_points(self):
                yield self.T2
                for x in range(1, self.F.q):
                    for P in self.points_at(x):
                        yield P

            def sampled_points(self, rng, count):
                """DF-4: uniform on the affine points."""
                got = 0
                q = self.F.q
                while got < count:
                    x = rng.randrange(q)
                    if x == 0:
                        if rng.getrandbits(1):
                            got += 1
                            yield self.T2
                        continue
                    pts = self.points_at(x)
                    if not pts:
                        continue
                    got += 1
                    yield pts[rng.getrandbits(1)]

            def crosscheck(self, rng, alphabets):
                """Blocking. Fast maps against CODE-CORE, and the audit's labels
                against families.arms, on sampled points."""
                h2c = core.make_h2(self.C)[0]
                for _ in range(CROSSCHECK_POINTS):
                    P = self.C.sample_point(rng)
                    x = P[0]
                    if not (self.to_nb(x) == self.NB.to_nb(x)):
                        return "to_nb"
                    if not (self.tr(x) == self.F.trace(x)):
                        return "trace"
                    if not (self.H(x) == self.F.half_trace(x)):
                        return "half_trace"
                    if not (self.h2(P) == h2c(P)):
                        return "h2"
                    if P not in self.points_at(x):
                        return "lift"
                    if self.koblitz and not (self.h4(P) == self.h4c(P)):
                        return "h4"
                for M in alphabets:
                    names, fn, slot = fam.arms(self.cell, M, self.h4h, h2c)
                    wb = fam.weight_buckets(self.n, M)
                    wb4 = fam.weight_buckets(self.n, M // 4) if self.koblitz else None
                    for _ in range(LABEL_CHECK_POINTS):
                        P = self.C.sample_point(rng)
                        e = self.h4(P) if self.koblitz else self.h2(P)
                        mine = fam.labels_from_parts(self.n, M, self.to_nb(P[0]), P[0], e,
                                                     self.koblitz, wb, wb4)
                        if not (fn(P)[:slot] == mine):
                            return "labels at M=%d" % M
                return None


        def binomial_se(p, n):
            return math.sqrt(max(p * (1.0 - p), 0.0) / n)


        def audit_cell(cid, mode, alphabets, sample_points=SAMPLE_POINTS):
            """The audit rows of one cell."""
            t0 = time.time()
            fc = FastCell(cid)
            rng = random.Random(zlib.crc32(("audit:" + cid).encode("ascii")))
            bad = fc.crosscheck(rng, alphabets)
            if bad is not None:
                raise ArithmeticError("CODE-AUDIT cross-check failed on %s: %s" % (cid, bad))
            n = fc.n
            per_M = []
            for M in alphabets:
                names = fam.family_names(fc.koblitz, n, M)
                wb = fam.weight_buckets(n, M)
                wb4 = fam.weight_buckets(n, M // 4) if fc.koblitz else None
                per_M.append((M, names, wb, wb4, [dict() for _ in names]))
            if mode == "exhaustive":
                pts = fc.all_points()
            else:
                pts = fc.sampled_points(random.Random(zlib.crc32(("audit-sample:" + cid).encode("ascii"))), sample_points)
            total = 0
            for P in pts:
                total += 1
                x = P[0]
                c = fc.to_nb(x)
                b2 = fc.h2(P)
                e = fc.h4(P) if fc.koblitz else b2
                for M, names, wb, wb4, tabs in per_M:
                    labs = fam.labels_from_parts(n, M, c, x, e, fc.koblitz, wb, wb4)
                    for k in range(len(names)):
                        t = tabs[k].get(labs[k])
                        if t is None:
                            tabs[k][labs[k]] = [1, 1 << b2, 1 << e]
                        else:
                            t[0] += 1
                            t[1] |= 1 << b2
                            t[2] |= 1 << e
            if mode == "exhaustive" and not (total == fc.order - 1):
                raise ArithmeticError("CODE-AUDIT enumerated %d affine points on %s, expected %d"
                                      % (total, cid, fc.order - 1))
            rows = []
            for M, names, wb, wb4, tabs in per_M:
                for k, name in enumerate(names):
                    tab = tabs[k]
                    p2 = sum(t[0] for t in tab.values() if t[1] in (1, 2)) / total
                    p4 = None
                    if fc.koblitz:
                        p4 = sum(t[0] for t in tab.values() if t[2] in (1, 2, 4, 8)) / total
                    arm, off = (name.split("@") + [None])[:2]
                    flag = p2 >= PURITY_FLAG or (p4 is not None and p4 >= PURITY_FLAG)
                    rows.append({
                        "cell": cid, "arm": arm, "offset": off, "M": M, "mode": mode,
                        "points": total, "classes": len(tab),
                        "smallest_class": min(t[0] for t in tab.values()),
                        "purity_2": round(p2, 6),
                        "se_2": None if mode == "exhaustive" else round(binomial_se(p2, total), 6),
                        "purity_4": None if p4 is None else round(p4, 6),
                        "se_4": None if (p4 is None or mode == "exhaustive") else round(binomial_se(p4, total), 6),
                        "exact_carrying": flag})
            meta = {"cell": cid, "mode": mode, "points": total, "field_poly": fc.F.mod,
                    "normal_element": fc.NB.w, "g4": fc.g4, "seconds": round(time.time() - t0, 1)}
            return meta, rows


        def run_audit(cell_ids=None):
            metas, rows = [], []
            for cid, mode, alphabets in AUDIT_CELLS:
                if cell_ids and cid not in cell_ids:
                    continue
                meta, r = audit_cell(cid, mode, alphabets)
                metas.append(meta)
                rows.extend(r)
            return {"cells": metas, "rows": rows,
                    "exact_carrying": sorted({"%s %s@%s" % (r["cell"], r["arm"], r["offset"])
                                              for r in rows if r["exact_carrying"]})}


        def main(argv):
            """One JSON line per cell, per row and for the flag list."""
            out = run_audit(argv)
            for meta in out["cells"]:
                print(json.dumps({"cell_meta": meta}, sort_keys=True))
            for row in out["rows"]:
                print(json.dumps(row, sort_keys=True))
            print(json.dumps({"exact_carrying": out["exact_carrying"]}, sort_keys=True))


        if __name__ == "__main__":
            main(sys.argv[1:])
