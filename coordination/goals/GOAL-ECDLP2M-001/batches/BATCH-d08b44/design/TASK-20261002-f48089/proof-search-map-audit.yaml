  structural_premise:
    source: card DI-SP; stated from parameter arithmetic only, before any calibration figure of this sheet
    statement: >-
      CELL-K13, CELL-K19, CELL-K23 and CELL-K41 have order 4 l with l an odd
      prime; a binary curve has exactly one point of order 2, so the 2-Sylow
      subgroup is cyclic of order 4, the group is cyclic, E/4E has order 4 and
      E/2E is its quotient: the strata are the four cosets of 4E (q = 4).
      CELL-O19 has order 2 l, so 4E = 2E and the strata are the two cosets of
      2E (q = 2). Every declared alphabet is a power of two divisible by q
      (Koblitz 8, 16, 32, 64, 128; ordinary 16, 64), so the exact-saturated
      label q r + e is defined at every declared (cell, M) with M / q in 2, 4,
      8, 16, 32 (Koblitz) and 8, 32 (ordinary), and the F5 composites use
      alphabets M / 4 in 2, 4, 8, 32. The stratified shuffle acts on positions
      and is defined at every M.

