      precision_loss_stated: >-
        Intervals are order statistics of ten independent per-seed readings
        (about an 80 percent interval); q99 of the family null is the sixth
        largest of 500 draws, and each seed's Z is standardised by its own
        width V_s, so the L2 interval carries no common-mode width error.

