        from array import array

        import estimator as est
        import exact_content as xco
        import stage1_gate as gate

        NEG_RHOS = (1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3)
        EXCLUDED_PRIMES = (2003, 130873, 2095853, 549756390943, 261823, 32603, 137, 239)
        # shape id -> (declared cell, declared l, q, M): every declared Stage 2 (cell, M)
        SHAPES = {
            "K13@16": ("CELL-K13", 2003, 4, 16),
            "K13@8": ("CELL-K13", 2003, 4, 8),
            "K19@64": ("CELL-K19", 130873, 4, 64),
            "K19@16": ("CELL-K19", 130873, 4, 16),
            "K23@128": ("CELL-K23", 2095853, 4, 128),
            "K23@32": ("CELL-K23", 2095853, 4, 32),
            "K23@16": ("CELL-K23", 2095853, 4, 16),
            "K41@16": ("CELL-K41", 549756390943, 4, 16),
            "O19@64": ("CELL-O19", 261823, 2, 64),
            "O19@16": ("CELL-O19", 261823, 2, 16),
        }
        LEAD_SHAPES = ("K13@16", "K19@64", "K23@128")


        def _key(k):
            if isinstance(k, str):
                return k
            if isinstance(k, tuple):
                return "|".join(str(x) for x in k)
            return str(k)


        def jsonable(obj):
            """Tuple keys to strings, arrays and tuples to lists, for json.dumps."""
            if isinstance(obj, dict):
                return {_key(k): jsonable(v) for k, v in obj.items()}
            if isinstance(obj, (list, tuple, array)):
                return [jsonable(v) for v in obj]
            return obj


        def adjacent_permitted_prime(l):
            """The least prime above l that is not an excluded prime, proved by
            complete trial division (stage1_gate.prove_prime_by_trial_division)."""
            p = l + 1
            while True:
                if p not in EXCLUDED_PRIMES and gate.prove_prime_by_trial_division(p) is True:
                    return p
                p += 1


        def check_permitted_order(N):
            """RV-6. Raise if a design-time group order is excluded."""
            for p in EXCLUDED_PRIMES:
                if N % p == 0:
                    raise ValueError("order %d is divisible by the excluded prime %d" % (N, p))
            if N == (1 << 17):
                raise ValueError("Z/2^17 is an excluded group")
            return N


        def strat_perms(strata, U, tag, count=est.R_SH):
            """count within-stratum permutations of the support positions."""
            groups = {}
            for i in range(U):
                groups.setdefault(strata[i], []).append(i)
            out = []
            for r in range(count):
                rng = random.Random(est.seed_of("negp-perm", tag, r))
                perm = list(range(U))
                for key in sorted(groups):
                    idx = groups[key]
