    null_scale:
      statement: >-
        Carried model, relabelled. The random label's G is M times a MAXIMUM
        over about M^3 empirical frequencies; its location sits near
        1 + sqrt(M^3 / S) sqrt(6 ln M), its spread near sqrt(M^3 / S) /
        sqrt(6 ln M). THE DESIGN ESTIMATES BELOW ARE UNDERESTIMATES at large M,
        as the version-2 red team's review computations showed
        (TASK-20260929-7d8385; quoted where DEC-20260929-8c3cb2 quotes them,
        and not restated here, CD4-12). The version-4 family null is the
        exact-saturated label, whose location and width are MEASURED per
        (cell, M) at run time; the C-6 design figures on permitted groups of
        each shape are in negpath_floor_table (for example q50 6.18 and W 0.84
        at the K13 M = 16 shape, q50 16.27 and W 2.98 at the K23 M = 128
        shape).
      design_estimates_at_S_equal_128_M2_uniform_label_underestimates:
        - {M: 8, G_minus_1_location: 0.883, W_estimate: 0.300}
        - {M: 16, G_minus_1_location: 1.442, W_estimate: 0.367}
        - {M: 32, G_minus_1_location: 2.280, W_estimate: 0.464}
        - {M: 64, G_minus_1_location: 3.532, W_estimate: 0.599}
        - {M: 128, G_minus_1_location: 5.396, W_estimate: 0.785}

    resolving_floor:
      statement: >-
        RESTATED (RV-4). A NEG reading at a (cell, M) says the role's
        stratified controlled excess lies below 3 W of the exact-saturated null
        at the declared S on enough seeds that L3 fails, never that G = 1. THE
        FLOOR QUOTED BESIDE NEG IS THE NEG-PATH FLOOR of negpath_floor_table
        (C-6), measured on permitted groups of the same shape on the path NEG
        is read on, for an exact-free (XF) and an exact-carrying (XC) planted
        mixture of the log-interval key.
      z_l_reference_floor: >-
        Carried as a REFERENCE ONLY. CODE-GATE z_ladder measures at run time,
        on Z/lZ, the smallest grid rho (RHOS = 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.25,
        0.125, 0.0625) at which L1 and L3 hold for it and every larger grid rho.
        It is reported beside the NEG-path floor and is an UNDERESTIMATE of it:
        on Z/l there is no stratum to absorb and the null is uniform.
      relevance: The floor limits what NEG certifies about weak excesses only, and only for the planted class measured.

    bootstrap_removal:
