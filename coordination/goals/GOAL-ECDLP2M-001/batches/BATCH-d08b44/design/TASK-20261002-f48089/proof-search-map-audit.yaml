                floors[name] = {"NEG_floor_rho": neg, "LEAD_floor_rho": lead,
                                "grid_bottom": min(rhos),
                                "NEG_floor_at_grid_bottom": neg == min(rhos)}
            return {"kind": "negp-shape", "sid": sr["sid"], "cell": sr["cell"],
                    "declared_cell": sr["declared_cell"], "l": sr["l"], "q": sr["q"],
                    "M": sr["M"], "S": sr["S"], "permitted": sr["permitted"],
                    "null": {"q50": ns["q50"], "q99": ns["q99"], "W": W, "V": ns["V"]},
                    "per": per, "floors": floors, "rhos": list(rhos)}


        def shape_floor(sid, seeds=est.SEEDS, rhos=NEG_RHOS, permitted=True):
            return summarize(shape_readings(sid, seeds, rhos, permitted), rhos)


        def lead_reach(summaries, rho=1.0):
            """classify_family over the three lead shapes for XF(rho) and XC(rho)."""
            by_sid = {s["sid"]: s for s in summaries}
            out = {}
            for name in ("XF", "XC"):
