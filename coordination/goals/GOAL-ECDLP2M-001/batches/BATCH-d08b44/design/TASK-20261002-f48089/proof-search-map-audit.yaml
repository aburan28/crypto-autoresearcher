        """
        import math

        import binstd_core as core
        import estimator as est

        CLEARANCE_TOKEN = "PC-10 cleared by stage1_gate.issue_clearance"
        HELD_OUT_NAMES = ("RLFAM", "XCO1", "XCO2")
        XCO_NAMES = ("XCO1", "XCO2")
        KOBLITZ_ROLES = ("F1", "F2@0", "F2@mid", "F2@end", "F3@0", "F3@mid", "F3@end",
                         "F4", "F5xF1", "F5xF2@0", "F5xF3@0", "F5xF4")
        ORDINARY_ROLES = ("ORD-F2@0", "ORD-F2@mid", "ORD-F2@end",
                          "ORD-F3@0", "ORD-F3@mid", "ORD-F3@end")
        KOBLITZ_CELLS = ("CELL-K13", "CELL-K19", "CELL-K23", "CELL-K41")
        ORDINARY_CELLS = ("CELL-O19",)
        PRIME_L_CELLS = KOBLITZ_CELLS + ORDINARY_CELLS
        SR6_ALLOWED_IMAGES = (1, 2, 4)
        SR6_EXEMPT_CLASSES = ("EXACT-FUNCTION", "DEGENERATE")
        HELD_OUT_TESTS = (
            ("ladder", ("CELL-K13", "CELL-K19"), None, ("CELL-K23",), None),
            ("fixed16", ("CELL-K13", "CELL-K19", "CELL-K23"), 16, ("CELL-K41",), 16),
        )


        def weight_buckets(n, M):
            """F1 quantile classes: bucket(w) = min(M - 1, floor(M C(w))), C the
            mid-CDF of Binomial(n, 1/2) (carried)."""
            tot = float(2 ** n)
            out, acc = [], 0
            for w in range(n + 1):
                pw = math.comb(n, w)
                out.append(min(M - 1, int(math.floor(M * (acc + pw / 2.0) / tot))))
                acc += pw
            return out


        def rotr(c, k, n):
            k %= n
            mask = (1 << n) - 1
            return ((c >> k) | (c << (n - k))) & mask


        def min_rotation(c, n):
            """The Frobenius-canonical representative: the least cyclic rotation."""
            best = c
            for k in range(1, n):
                v = rotr(c, k, n)
                if v < best:
                    best = v
            return best


        def offsets(n, r):
            """The three declared offsets of F2 and F3 at window width r."""
            return (0, (n - r) // 2, n - r)


        def family_names(koblitz, n, M):
            """The declared arm names at alphabet M, in label order, with NUMERIC
            offsets (carried; CODE-AUDIT's key). Stage 2 and Stage 3 key arms by
            role_names instead (RV-3)."""
            r = M.bit_length() - 1
            offs = offsets(n, r)
            pre = "" if koblitz else "ORD-"
            names = []
            if koblitz:
                names.append("F1")
            names += [pre + "F2@%d" % o for o in offs]
            names += [pre + "F3@%d" % o for o in offs]
            if koblitz:
                names += ["F4", "F5xF1", "F5xF2@0", "F5xF3@0", "F5xF4"]
            return names


        def role_names(koblitz):
            """RV-3. The declared role of each label position, in label order,
            independent of n and M: offsets 0, floor((n - r) / 2) and n - r are
            the roles @0, @mid and @end."""
            return KOBLITZ_ROLES if koblitz else ORDINARY_ROLES


        def role_pairs(koblitz, n, M):
            """(numeric name, role) in label order, for reports that show both."""
            names = family_names(koblitz, n, M)
            roles = role_names(koblitz)
            if not (len(names) == len(roles)):
                raise ValueError("the declared label order does not match the role list")
            return list(zip(names, roles))


        def labels_from_parts(n, M, c, x, e, koblitz, wb, wb4):
            """The declared arms at alphabet M, in the order of family_names, from
            c (the normal-basis coordinate vector of x), x (the polynomial-basis
            integer) and, on a Koblitz cell, e (the h4 class). The formulas are the
            version-2 CODE-FAM formulas unchanged. wb = weight_buckets(n, M), wb4 =
            weight_buckets(n, M // 4) on a Koblitz cell."""
            r = M.bit_length() - 1
            mask = M - 1
            out = []
            if koblitz:
                out.append(wb[core.popcount(c)])
            for o in offsets(n, r):
                out.append(rotr(c, o, n) & mask)
            for o in offsets(n, r):
                out.append((x >> o) & mask)
            if koblitz:
                r4 = r - 2
                m4 = (M // 4) - 1
                mr = min_rotation(c, n)
                out.append((mr >> (n - r)) & mask)
                out.append(4 * wb4[core.popcount(c)] + e)
                out.append(4 * (c & m4) + e)
                out.append(4 * (x & m4) + e)
                out.append(4 * ((mr >> (n - r4)) & m4) + e)
            return tuple(out)


        def arms(cell, M, h4h=None, h2=None):
            """Names, one tuple-valued label function and the stratum slot. The
            function returns the family labels followed by the point's exact
            stratum: h4 by the halving presentation on a Koblitz cell (used only
            after PC-4b), h2 on an ordinary cell. Every arm is stratified by that
            slot (RR-1 route (a)). Carried unchanged; names are numeric."""
            n = cell.n
            NB = cell.NB
            koblitz = cell.kind.startswith("koblitz")
            if koblitz and h4h is None:
                raise ValueError("a Koblitz cell needs the h4 stratum")
            if (not koblitz) and h2 is None:
                raise ValueError("an ordinary cell needs the h2 stratum")
            names = family_names(koblitz, n, M)
            wb = weight_buckets(n, M)
            wb4 = weight_buckets(n, M // 4) if koblitz else None

            def fn(P):
                x = P[0]
                c = NB.to_nb(x)
                e = h4h(P) if koblitz else h2(P)
                return labels_from_parts(n, M, c, x, e, koblitz, wb, wb4) + (e,)

            return names, fn, len(names)


        def require_clearance(cell_id, clearance):
            """PC-10 in code (RR-10): raise unless the clearance was issued for this
            cell by stage1_gate.issue_clearance after every required control."""
            ok = (isinstance(clearance, dict) and clearance.get("cleared") is True
                  and clearance.get("cell") == cell_id
                  and clearance.get("token") == CLEARANCE_TOKEN)
            if not ok:
                raise RuntimeError("PC-10: Stage 2 on %s without a valid clearance" % cell_id)


        def is_exact(d, M):
            """EXACT: G == M with every used conditioning cell a point mass."""
            return d["G"] == M and d["point_mass_used"] == d["used"]


        def used_cell_image(stream, S, lab, M):
            """RV-1. The labels that occur in USED conditioning cells (at least
            MIN_CELL pairs): the cell labels a and b and every sum label c seen in
            them. SR-6's image clause counts this set, not the whole support."""
            MM = M * M
            cnt = {}
            pid = stream.pid
            for k in range(0, 3 * S, 3):
                key = lab[pid[k]] * MM + lab[pid[k + 1]] * M + lab[pid[k + 2]]
                cnt[key] = cnt.get(key, 0) + 1
            nab = {}
            for key, v in cnt.items():
                ab = key // M
                nab[ab] = nab.get(ab, 0) + v
            seen = set()
            for key in cnt:
                ab = key // M
                if nab[ab] >= est.MIN_CELL:
                    seen.add(ab // M)
                    seen.add(ab % M)
                    seen.add(key % M)
            return sorted(seen)


        def stage2_cell(cell, setup, clearance, seeds=est.SEEDS):
            """Stage 2 on one cleared cell: every declared arm (keyed by ROLE) at
            every family alphabet, seeds 0 to 9, plus RLFAM (PC-15) and XCO1, XCO2
            (PC-17), each read with ten shuffles stratified by the exact quotient
            and judged against the exact-saturated null q r + e measured here on
            the same pairs (50 draws per seed, per-seed widths). Records the
            support image size, the used-cell image of every EXACT reading (RV-1)
            and the IR-2 positivity check (W > 0 and every V_s > 0) per (role, M)
            (RV-12)."""
            require_clearance(cell.id, clearance)
            Ms = est.FAMILY_ALPHABETS[cell.id]
            grid = {M: est.S_of(M) for M in Ms}
            koblitz = cell.kind.startswith("koblitz")
            h4h, h2, q = None, None, 2
            if koblitz:
                h4h = core.make_h4_halving(cell.C, setup["point_of_order_4"])[0]
                q = 4
            else:
                h2 = core.make_h2(cell.C)[0]
            roles = role_names(koblitz)
            Smax = max(grid.values())
            res, null_draws, images, used_images = {}, {}, {}, {}
            for s in seeds:
                stream = est.PairStream(cell, s, Smax)
                for M, S in sorted(grid.items()):
                    U = stream.support(S)
                    _names, fn, slot = arms(cell, M, h4h, h2)
                    labs = est.cache_label_tuples(cell, stream, U, fn, slot + 1)
                    e = labs[slot]
                    null_draws.setdefault(M, []).append(est.null_distribution(
                        stream, S, U, M, cell.id + "/SAT", s, strata=e, q=q))
                    items = [(roles[k], labs[k]) for k in range(slot)]
                    items.append(("RLFAM", est.random_labels(U, M, est.seed_of("rlfam", cell.id, M, s))))
                    items.append(("XCO1", est.exact_content_x1(U, cell.n, weight_buckets(cell.n, M), e,
                                                               est.seed_of("xco1", cell.id, M, s))))
                    items.append(("XCO2", est.exact_content_x2(U, M, e, q, est.seed_of("xco2", cell.id, M, s))))
                    for name, lab in items:
                        rd = est.read_arm(stream, S, U, lab, M, cell.id, name, s, e)
                        res.setdefault((name, M), []).append(rd)
                        images.setdefault((name, M), []).append(est.image_size(lab, U))
                        ui = used_cell_image(stream, S, lab, M) if is_exact(rd["direct"], M) else None
                        used_images.setdefault((name, M), []).append(ui)
            nulls = {M: est.summarize_null(by_seed) for M, by_seed in null_draws.items()}
            out = {}
            for (name, M), readings in res.items():
                ns = nulls[M]
                ir2 = not (ns["W"] > 0 and all(v > 0 for v in ns["V"]))
                out[(name, M)] = {"rows": est.seed_rows(readings, ns, ns["V"]), "null": ns,
                                  "image_sizes": images[(name, M)],
                                  "used_cell_images": used_images[(name, M)],
                                  "ir2_invalid": ir2}
            return out


        def sr6_check(outs, degeneracy=None):
            """RV-1. SR-6 clause (2) as revised: on a prime-l cell, a reading that
            is EXACT whose USED-CELL image size lies outside 1, 2, 4 fires, unless
            the frozen degeneracy table (CODE-DEGEN, re-run at S0-6) records that
            (cell, role, M) as EXACT-FUNCTION or DEGENERATE, in which case it is
            exempt by name with the table's class. Returns fired, the firing
            readings and the exempted readings."""
            exempt = {}
            for row in (degeneracy or ()):
                if row.get("class") in SR6_EXEMPT_CLASSES:
                    exempt[(row["cell"], row["role"], row["M"])] = row["class"]
            fires, exempted = [], []
            for cid in sorted(outs):
                if cid not in PRIME_L_CELLS:
                    continue
                for (name, M), d in sorted(outs[cid].items()):
                    for s, ui in enumerate(d.get("used_cell_images", ())):
                        if ui is None or len(ui) in SR6_ALLOWED_IMAGES:
                            continue
                        tag = {"cell": cid, "role": name, "M": M, "seed": s, "used_image": ui}
                        if (cid, name, M) in exempt:
                            tag["exempt_as"] = exempt[(cid, name, M)]
                            exempted.append(tag)
                        else:
                            fires.append(tag)
            return {"fired": len(fires) > 0, "fires": fires, "exempted": exempted}


        def _entries(outs, name, cells, M=None):
            valid, invalid = {}, []
            for cid in cells:
                for key, d in outs.get(cid, {}).items():
                    if key[0] == name and (M is None or key[1] == M):
                        if d.get("ir2_invalid"):
                            invalid.append((cid, key[1]))
                        else:
                            valid[(cid, key[1])] = d
            return valid, invalid


        def _art_def(reason, invalid=()):
            return {"verdict": "ART-DEF", "reason": reason, "L2": None, "per_cell": None,
                    "invalid_keys": sorted(invalid)}


        def classify_role(outs, name, cells, lead_keys, log2_ns, ladder_ok=True, lead_guard=True):
            """One verdict for one declared name. With lead_keys (Koblitz roles and
            the held-out labels): ART-DEF when a ladder cell is dropped or voided
            (SR-3) or a lead key is missing or invalidated (RV-7); else
            est.classify_family, with NOT-ESTIMATED reported as ART-DEF and LEAD
            reported as ART-DEF when the PC-16c lead guard failed. Without
            lead_keys (ordinary roles): ART-DEF with no valid or no estimated
            (cell, M) (RV-7, D-8); else ART-RES on any L3, NEG otherwise."""
            valid, invalid = _entries(outs, name, cells)
            if lead_keys is not None:
                if not ladder_ok:
                    return _art_def("SR-3: a ladder cell is dropped or voided", invalid)
                missing = [k for k in lead_keys if k not in valid]
                if missing:
                    return _art_def("RV-7: a lead key is missing or invalidated: %s" % missing, invalid)
                v = est.classify_family(valid, list(lead_keys), list(log2_ns))
                out = {"verdict": v["verdict"], "reason": None, "L2": v["L2"],
                       "per_cell": v["per_cell"], "invalid_keys": sorted(invalid)}
                if v["verdict"] == "NOT-ESTIMATED":
                    out["verdict"] = "ART-DEF"
                    out["reason"] = "IR-12: a lead key is not estimated (NOT-ESTIMATED)"
                elif v["verdict"] == "LEAD" and not lead_guard:
                    out["verdict"] = "ART-DEF"
                    out["reason"] = "IR-23 as revised: PC-16c failed, so LEAD is blocked"
                return out
            if len(valid) == 0:
                return _art_def("no valid (cell, M) for this arm", invalid)
            per, est_any, l3_any = {}, False, False
            for key, d in valid.items():
                ok = est.estimated(d["rows"])
                l3 = ok and est.clause_L3(d["rows"], d["null"])
                per[key] = {"estimated": ok, "L3": l3}
                est_any = est_any or ok
                l3_any = l3_any or l3
            if not est_any:
                return _art_def("RV-7: no estimated (cell, M) (NOT-ESTIMATED)", invalid)
            return {"verdict": "ART-RES" if l3_any else "NEG", "reason": None, "L2": None,
                    "per_cell": per, "invalid_keys": sorted(invalid)}


        def _l3_flags(outs, name, cells, M=None):
            flags = []
            for cid in cells:
                for key, d in outs.get(cid, {}).items():
                    if key[0] == name and (M is None or key[1] == M):
                        if d.get("ir2_invalid") or not est.estimated(d["rows"]):
                            flags.append(None)
                        else:
                            flags.append(est.clause_L3(d["rows"], d["null"]))
            return flags


        def _expected_count(cells, M):
            if M is None:
                return sum(len(est.FAMILY_ALPHABETS[c]) for c in cells)
            return len(cells)


        def heur_b2_held_out(outs):
            """RR-4, by role (RV-3). HEUR-B2's testable consequent per declared
            Koblitz role: a test is DEFINED when every involved (cell, M) is
            present, valid and estimated; HEUR-B2 is falsified on the tested
            range when a defined test has its premise (no L3 on the fitting
            cells) true and its consequent (no L3 on the held-out cells) false."""
            res = {}
            for name in KOBLITZ_ROLES:
                row = {}
                for tag, fit, fit_M, held, held_M in HELD_OUT_TESTS:
                    f = _l3_flags(outs, name, fit, fit_M)
                    h = _l3_flags(outs, name, held, held_M)
                    defined = (len(f) == _expected_count(fit, fit_M)
                               and len(h) == _expected_count(held, held_M)
                               and all(v is not None for v in f + h))
                    premise = defined and not any(f)
                    consequent = defined and not any(h)
                    row[tag] = {"defined": defined, "premise": premise,
                                "consequent": consequent,
                                "falsified": premise and not consequent}
                res[name] = row
            return res


        def stage3(outs, log2_ns, pc17=None, dropped=(), lead_guard_passed=True):
            """Stage 3. outs[cell] is the stage2_cell output of every read cell;
            log2_ns lists log2 l of the ladder cells in LADDER order; pc17 maps a
            cell to its exact_content.pc17_cell record; dropped lists cells that
            failed admission or their gate; lead_guard_passed is PC-16c's record.
            A cell whose PC-17 failed is voided (IR-22). Returns one verdict per
            declared role (NEG, LEAD, ART-RES or ART-DEF with its reason), one L2
            interval per Koblitz role, PC-15 and PC-17 as read in Stage 3, the
            voiding applied in code (IR-17, IR-22, SR-3) and the HEUR-B2
            held-out tests."""
            pc17 = pc17 or {}
            voided_cells = set(dropped)
            pc17_failed = []
            for cid, r in pc17.items():
                if not (isinstance(r, dict) and r.get("passed") is True):
                    voided_cells.add(cid)
                    pc17_failed.append(cid)
            live = {cid: o for cid, o in outs.items() if cid not in voided_cells}
            ladder_ok = all(c in live for c in est.LADDER)
            lead_keys = tuple((c, est.LEAD_ALPHABET[c]) for c in est.LADDER)
            verdicts = {}
            for name in KOBLITZ_ROLES:
                verdicts[name] = classify_role(live, name, KOBLITZ_CELLS, lead_keys, log2_ns,
                                               ladder_ok, lead_guard_passed)
            for name in ORDINARY_ROLES:
                verdicts[name] = classify_role(live, name, ORDINARY_CELLS, None, log2_ns)
            held = {}
            for name in HELD_OUT_NAMES:
                held[name] = classify_role(live, name, PRIME_L_CELLS, lead_keys, log2_ns, ladder_ok, True)
            pc15 = held["RLFAM"]["verdict"] == "NEG"
            pc17_stage3 = all(held[x]["verdict"] == "NEG" for x in XCO_NAMES)
            voided = not (pc15 and pc17_stage3)
            if not ladder_ok:
                why = "SR-3: a ladder cell is dropped or voided; nothing is classified NEG or LEAD"
            else:
                why = "IR-17 or IR-22: PC-15 or PC-17 failed in Stage 3; no arm is classified"
            final = {}
            for name in KOBLITZ_ROLES + ORDINARY_ROLES:
                v = dict(verdicts[name])
                if voided:
                    v["verdict_before_voiding"] = v["verdict"]
                    v["verdict"] = "ART-DEF"
                    v["reason"] = why
                final[name] = v
            counts = {}
            for v in final.values():
                counts[v["verdict"]] = counts.get(v["verdict"], 0) + 1
            return {"verdicts": final, "held_out_labels": held,
                    "PC-15": pc15, "PC-17": pc17_stage3, "pc17_failed_cells": sorted(pc17_failed),
                    "voided": voided, "ladder_ok": ladder_ok,
                    "dropped_or_voided_cells": sorted(voided_cells),
                    "lead_guard_passed": lead_guard_passed, "outcome_counts": counts,
                    "heur_b2_held_out": heur_b2_held_out(live)}
