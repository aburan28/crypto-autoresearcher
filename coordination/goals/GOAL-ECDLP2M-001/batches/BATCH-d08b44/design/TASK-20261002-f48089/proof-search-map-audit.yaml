      - {shape: K41@16, declared: 'CELL-K41, M 16 (fixed alphabet)', group: 'Z/(4 x 549756390949)', W: 0.664, q50: 6.088, XF_NEG_floor: 0.7, XF_LEAD_floor: 0.9, XC_NEG_floor: 0.8, XC_LEAD_floor: 0.8, XF1_offset_W: 5.49}
      - {shape: O19@64, declared: 'CELL-O19, M 64', group: 'Z/(2 x 261847)', W: 1.463, q50: 7.680, XF_NEG_floor: 0.5, XF_LEAD_floor: 0.6, XC_NEG_floor: 0.5, XC_LEAD_floor: 0.5, XF1_offset_W: 1.42}
      - {shape: O19@16, declared: 'CELL-O19, M 16', group: 'Z/(2 x 261847)', W: 0.615, q50: 3.772, XF_NEG_floor: 0.7, XF_LEAD_floor: 0.8, XC_NEG_floor: 0.7, XC_LEAD_floor: 0.7, XF1_offset_W: 2.14}
    exact_carrying_offsets: For XC the offset is within about 0.16 W of 0 at every shape (the saturated null carries the same exact component), so the XC LEAD floor equals its NEG floor everywhere.
    no_grid_bottom_floor: At no shape and for neither class is the NEG floor at the grid bottom (0.3); every floor is resolved inside the grid or is "none".
    reading: >-
      DESIGN FIGURES for the planted class (mixtures of the log-interval key
      of the l-component, exact-free or with the exact quotient attached).
      A NEG at a declared (cell, M) bounds a role's stratified excess only
      relative to the row of its shape: it says the role is weaker on L3 than
      the planted mixture at the row's floor. At K13 M = 8 no exact-carrying
      excess is bounded at all. The transfer from Z/(q l') to the declared
      group of the same shape (log2 l' - log2 l at most 0.006) is an
      assumption (IF-9), and other forms of excess may be resolved at other
      strengths.
