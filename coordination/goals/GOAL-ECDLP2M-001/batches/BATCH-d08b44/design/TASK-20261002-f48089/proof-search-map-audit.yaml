    capacity_certificate:
      title: The exact sum-compatible filter capacity of the ECC2K-130 ambient group (carried; code guarded)
      ambient: THE FULL GROUP of order 4l for the capacity; the target subgroup of order l for its subgroup line
      argument: Carried unchanged (quasigroup, associativity, group, homomorphism, Lagrange; PO-1).
      result:
        admissible_alphabets_below_l: [1, 2, 4]
        exact_capacity_below_l_bits: 2.00
        exact_capacity_of_the_target_subgroup_bits: 0.00
      corollary_used_by_rr1: >-
        Every exact sum-compatible map on the group of order 4l with alphabet
        below l is a homomorphism onto a group of order 1, 2 or 4, hence a
        function of the E/4E class h4 (E/4E is the unique quotient of order 4
        of a cyclic group, and E/2E is its quotient). This is why h4 is the
        complete stratum on every Koblitz cell, and h2 on CELL-O19 (order
        2 x 261823, quotients of order 1 and 2 below its odd prime).
      control_readings_as_pass_criteria:
        - id: PC-CERT-1
          input: 'order 4l with factorisation {2: 2, l: 1}; bound l'
          required: 'alphabets below l exactly [1, 2, 4]; 2 bits; the full divisor set of 4l has six members; the target subgroup (order l, factorisation {l: 1}) gives [1] and 0 bits'
        - id: PC-CERT-2
          input: 'order 2^17 with factorisation {2: 17}; bound 2^17'
          required: divisors exactly 2^0 to 2^17 (eighteen); capacity below the order 16 bits
        - id: PC-CERT-3
          input: 'order 130972 with factorisation {2: 2, 137: 1, 239: 1}; bound 239'
          required: divisors exactly 1, 2, 4, 137, 239, 274, 478, 548, 956, 32743, 65486, 130972; below 239 exactly [1, 2, 4, 137]; capacity log2(137)
        - id: PC-CERT-4
          input: 'order 130972 with the malformed factorisations {4: 1, 32743: 1}, [(2, 1), (2, 1), (32743, 1)] and [(2, 2), (137, 1), (239, 1), (3, 0)]'
          required: each refused with ValueError before any divisor is formed
          guard_scope_note: >-
            RV-10, stated beside PC-CERT-4. CODE-CERT's guard checks each factor
            with a strong probable-prime test; that is a PROOF of primality only
            below the recalled deterministic bound 3317044064679887385961981
            (recalled, not retrieved), so for the 129-bit l its scope is
            probable-prime. The certificate's divisor set of 4l rests on the
            primary source's primality statement either way, and every toy l is
            proved prime separately by complete trial division at setup.
      primality_of_l: Carried. l is not proved prime here; the divisor set of 4l rests on the primary source's statement; the version-2 review produced a Pocklington-Lehmer certificate as corroboration only (DEC-20260929-8c3cb2 limitations).

