  # ===========================================================================
  # RR-1 ROUTE (carried value-identical from version 3), with the version-4
  # route statements for RV-1 and RV-2.
  # ===========================================================================
  rr1_route:
    chosen: >-
      Carried. ROUTE (a). Every curve-cell arm, every held-out label (RLFAM,
      XCO1, XCO2) and every random-label reference of the family clauses is
      STRATIFIED BY THE EXACT QUOTIENT: by the E/4E class h4 (alphabet 4) on
      every Koblitz cell, by the E/2E class h2 on CELL-O19. The
      histogram-preserving shuffle permutes labels only among support points
      with the same stratum value, and the family null is the exact-saturated
      random label q r + e (e the stratum, r uniform on M/q values, q = 4 or
      2), measured on the same pairs by the same gain code. On the Z/l cells
      (prime order) the stratum is constant and both reduce to the
      unstratified forms.
    why_this_removes_the_exact_components: >-
      Carried. By Q-CERT every exact sum-compatible map on a group of order
      4l below l is a function of h4 (on CELL-O19, of order 2 x 261823, of
      h2). A stratified shuffle preserves each label's joint distribution
      with the stratum exactly over the support, and so preserves every exact
      component a label carries, while destroying every other relation
      between point and label. E_Sh therefore measures excess beyond the
      exact components. C-8 checks the property on a permitted group (the
      joint histogram with the stratum is kept; 0.94 of positions move).
    why_not_route_b: Carried unchanged from version 3 (sampling from 4E collapses the F5 composites, triggers SR-6 by construction and makes the gate's exact controls constant).
    pricing: Carried; the costs are in EXP-BINSTD-811a2e budget.stage_split.
    exact_quotient_audit: CODE-AUDIT (carried byte-identical), with its pass rule in pass_criteria_stated_before_execution.audit and its C-4 table in design_computations.
  rv1_route:
    chosen: >-
      Both remedies the requirement offers in part, plus the audit. (1) SR-6
      clause (2) counts the image only over labels that occur in USED
      conditioning cells (families.used_cell_image), so an exceptional point
      that occurs in fewer than MIN_CELL pairs cannot enter the image. (2)
      Every declared (cell, role, M) is audited for degeneracy (CODE-DEGEN,
      C-4) under a rule stated before execution, and rows the frozen table
      records as EXACT-FUNCTION or DEGENERATE are exempt BY NAME from the
      clause (families.sr6_check reads the S0-6 rows). F5xF4 at M = 8 on
      CELL-K13 is recorded DEGENERATE (c_4 = 2 of 8011) and EXEMPTED, not
      dropped: it is still read and classified, and a NEG on it is reported
      as uninformative beyond the exact component. (3) The near-exact control
      is declared (CTL-NEAREXACT) and run at design time (C-5, C-8).
    why_not_exhaustive_verification_before_stopping: >-
      An exhaustive combining-rule verification on a prime-l cell at the
      declared alphabets is not a cheap step at n = 41, and the used-cell
      rule plus the frozen table removes the false trigger without it. The
      exhibit route of SR-6 clause (1) still requires exhaustive verification.
    why_exempt_rather_than_drop: >-
      Dropping a declared row would change the declared family after an
      audit; exempting it from one stopping clause keeps every row's reading
      and states its limit.
  rv2_route:
    chosen: >-
      BOTH remedies. PC-16c's planted decay is strengthened to rho = 1, 0.7,
      0.4 (DECAY_RHOS) and its branch of IR-23 is confined to LEAD: a PC-16c
      failure blocks LEAD (ART-DEF, LEAD-BLOCKED) and voids no NEG, ART-RES or
      other reading, because NEG is read on L3 alone and PC-16c tests only
      L2's false-pass direction. PC-16c is outside z_ladder.passed and outside
      the clearance. L2 stays guarded by a blocking control for the branch it
      governs (PC-16c for LEAD) and its false-fail side by PC-16b (blocking).
      The computed slope (mean -3.26 per bit, sd 0.87, 200 seeds) replaces
      the version-3 hand figure of about -2.5.
    computed_rates: PC-16c false-fail bound 0.0092 per run (0 of 200 per-seed slopes non-negative); the version-3 decay would have had a point rate of about 0.046 (7 of 200).

