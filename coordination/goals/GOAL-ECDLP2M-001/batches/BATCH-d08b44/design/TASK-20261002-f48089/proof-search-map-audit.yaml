                        t = est.planted_mixture(km, U, m, rho, est.seed_of("negp-xc", cell.id, M, rho, s))
                    xc = array("H", [q * t[i] + e[i] for i in range(U)])
                    for name, lab in (("XF", xf), ("XC", xc)):
