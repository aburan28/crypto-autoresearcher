                "ceiling_model_thresholds": [threshold(k, o) for k in (4, 8, 16, 32)
                                             for o in (False, True)],
                "floors": floors(),
                "koblitz_orders": koblitz_orders(63),
                "sample_table": sample_table(),
                "certificate": certificate.certificate_controls(),
                "heurb1_design": heurb1_design(),
            }
            for key in sorted(out):
                print(json.dumps({key: out[key]}, sort_keys=True))


        if __name__ == "__main__":
            main()
