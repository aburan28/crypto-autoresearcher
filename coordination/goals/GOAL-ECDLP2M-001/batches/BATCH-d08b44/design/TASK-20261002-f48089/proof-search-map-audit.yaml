        on a Koblitz cell and q = 2 on CELL-O19, and c_q / N the fraction of the
        N affine points (estimated on the sample at n = 41): EXACT-FUNCTION when
        c_q = 0 (the label is a function of the exact quotient and carries only
        the certificate's exact component); DEGENERATE when 0 < c_q / N <=
        DEG_FRAC = 0.01 (it carries only the exact component up to at most one
        percent of the points); REGULAR otherwise. What follows (fixed now):
        SR-6's image clause is exempt by name for EXACT-FUNCTION and DEGENERATE
        rows (families.sr6_check); every row is still read and classified like
        any other, and a NEG on such a row is reported as uninformative about
        anything beyond the exact component. The column p_exact_seed =
