        """CODE-S0, stage0.py, of EXP-BINSTD-c9c8a2 (version 3): the Stage 0
        design arithmetic (zero compute; its output is a design figure, never a
        measurement): matched rho; the ideal-tree ceiling table in the
        target-subgroup ambient; the gap and closure lines in both named
