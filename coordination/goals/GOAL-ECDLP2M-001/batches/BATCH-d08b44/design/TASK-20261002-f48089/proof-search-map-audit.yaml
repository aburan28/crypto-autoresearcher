        def population_gain(pts, lab_of_point, M):
            """The exhaustive value on CELL-K13: REPORTED, NOT CHECKED (RR-8)."""
            N = len(pts)
            lab = [0] + [lab_of_point(pts[i]) for i in range(1, N)]
            MM = M * M
            cnt = [0] * (MM * M)
            for i in range(1, N):
                base = lab[i] * MM
                for j in range(1, N):
                    s = i + j
                    if s >= N:
                        s -= N
                    if s == 0:
                        continue
                    cnt[base + lab[j] * M + lab[s]] += 1
            best = 0.0
            for ab in range(MM):
                row = cnt[ab * M:(ab + 1) * M]
                nab = sum(row)
                if nab:
                    v = max(row) / nab
                    if v > best:
                        best = v
            return M * best


        def reference_distribution(pts, lab_of_point, M, S, cid, R_ref=200):
            """PC-9 reference: R_ref index-sampled readings of S pairs (carried)."""
            cell = IndexCell(cid, pts)
