  # ===========================================================================
  # C-6 -- THE NEG-PATH FLOOR TABLE (RV-4) AND THE CURVE-PATH LEAD REACH
  # (RV-5). DESIGN FIGURES on permitted groups Z/(q l') of each declared shape.
  # ===========================================================================
  negpath_floor_table:
    source: design_computations round_2 jobs c6-* (CODE-NEGP shape_floor, permitted=True) and l (negpath lead)
    method: >-
      Per declared (cell, M) shape, on Z/(q l') with l' =
      negpath.adjacent_permitted_prime(l) (order checked against the excluded
      primes in code), strata i mod q, the declared M and S, ten seeds, ten
      stratified shuffles per seed shared by the labels of a seed, the
      exact-saturated null of 50 draws per seed (500 pooled): XF(rho) and
      XC(rho) on the grid NEG_RHOS = 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3. The
      NEG floor is the smallest grid rho at which L3 holds for it and every
      larger grid rho ("none" when L3 fails at rho = 1); the LEAD floor the
      same with L1 and L3. The exact-free offset is (q50 of the saturated
      null minus the median shuffle median of XF(1)) / W.
