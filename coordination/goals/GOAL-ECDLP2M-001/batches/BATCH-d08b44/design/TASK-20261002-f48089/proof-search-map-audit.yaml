        2^20 affine points), with labels on affine points only: (a) the image
        size (non-empty label classes); (b) the smallest and largest class in
        points; (c) c_2, the least number of affine points on which the label
        differs from some function of the coset P + 2E (the sum over the cosets
        of the points in the coset minus the largest number of them sharing one
        label) and, on Koblitz cells, c_4, the same for P + 4E; (d) purity_2 and
        purity_4 exactly as CODE-AUDIT defines them. Points are enumerated with
        CODE-AUDIT's FastCell (cross-checked against CODE-CORE and
        families.arms before any count) and labelled by families.labels_from_parts.
        It NEVER computes a bucket gain, a shuffle, a null draw, an estimator, a
        rule rate or a decision clause.

