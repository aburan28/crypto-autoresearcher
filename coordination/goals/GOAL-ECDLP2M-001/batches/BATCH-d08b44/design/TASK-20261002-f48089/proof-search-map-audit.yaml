        which is why L1 needs more stratified excess than L3 for an exact-free
        arm (RV-5). pc16d_curve_reach is the RUN-TIME control PC-16d: XF(1) and
        XC(1) on the three lead shapes must classify LEAD under
        est.classify_family with L2 as pre-registered.

        Design computations (C-6) call shape_floor with permitted=True, which
        replaces the declared prime by adjacent_permitted_prime, the least prime
        above it outside R-DECLARED-GROUPS, and checks the group order; the run
        calls pc16d_curve_reach on the declared ISO lead shapes. Shuffles: ten
