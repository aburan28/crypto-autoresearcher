  jrd1:
    verdict: holds
    verdict_summary: >-
      JRD1 HOLDS as the plan states its claim and against the plan's list of
      breaking artifacts. Every round-1 constructed input (A8; B5, which is the
      payload-skip case, B7 and B8; path cases f to l; C6d; C8; C12c) fails
      its named revised check (PTM-RD1). The canonicaliser returns a hit or a
      non-canonical finding on every one of 49 new path forms and on two
      case-folding variants, and passes the four legitimate controls. Every
      failure branch WO-R-20 names, and every branch the plan lists, leaves a
      record check_run accepts, or no manifest and a runner receipt that the
      execution report must record (EC-2). Certificates bind per row with
      rules for repeated and K-coefficient lambda, and the checker exits 3
      unless identity_holds is recomputed true. Every JRD1 item has a clause,
      work orders and an acceptance check that fails on a constructed input.
      Every work order carries the DR-13 statement (37 of 37). Nothing of
      round 1 is edited. Every relayed R-C1 to R-C4, R-C8 (JRD1 part) and
      R-C9 output reproduces. PTM-RD2 meets its signature. The joint
      nevertheless carries seventeen surviving objections, seven of them
      moderate. The two CLOSEST CALLS are SO-1 (YAML duplicate keys) and SO-2
      (hard links). A strictly literal reading of attack (ii)'s breaking
      sentence could count either as a break. This reviewer does not, and
      states why so the composer can rule otherwise. Both lie outside the
      canonicaliser that attack (ii) targets, and both need a deliberate
      construction equal in power to omitting the read, which no
      declaration-based M9 can detect. Round-1 precedent (SO-3, a kfield.py
      re-export disguise) treated such constructions as surviving objections.
      Five moderate objections (SO-3 to SO-7) are defects in work orders that
      the round-2 executors would implement as written. Three would make M9
      report F_ind on legitimate executions: retries, paths that later move,
      and reads outside the checkout. One is an interplay between the
      execution-phase time scope and how tools/experiment_execution.py chains
      launches. One is a missing row-coverage check.

