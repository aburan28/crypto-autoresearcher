    attack_ii_new_path_forms:
      canonicaliser: >-
        code_blocks.path_canon_code (sha256 2cf9b884...), which WO-R-11 makes
        normative: path_problems, blind_hit and evaluate_declaration. Run with
        PRODUCTION oracles as WO-R-11 words them (os.path.lexists under the
        checkout; any component a symlink) over a synthetic mock checkout in
        private scratch whose files carry the ten blind_from names and
        placeholder content; the real blind_from paths were never touched.
      result: >-
        Every form is rejected as non-canonical or is a hit
        (blind_from_respected false): trailing "/." and "/./"; "//" leading and
        inner; backslash and mixed separators; a symlinked parent, a leaf
        symlink and a symlink to a blind_from parent; NFC and NFD accents, a
        fullwidth solidus, a zero-width space and a non-breaking-hyphen
        look-alike; percent-encoded slash and hyphen; glob **, ?, *.json and
        brace expansion; git pathspec magic, :/ top, HEAD:path object spec and
        an exclude pathspec; extents in parentheses with and without a space;
        an absolute path inside the checkout, a file:// URL and a ~ path;
        "./", "././", "../" and double "../" chains and a "../<checkout>/"
        round trip; bare blind_from directories, a bare parent, and the bare
        top-level parents analysis, coordination and experiments; a case
        variant (and, under a case-folding existence oracle, a case variant of
        a file and of a parent, both hits); trailing newline, tab, a Windows
        drive path, another worktree's absolute path, a trailing dot, a ".."
        inside a segment name, a path inside a blind_from FILE, "." and the
        empty path. The controls stay TRUE: a sibling directory sharing a
        string prefix, a file name extending a blind_from file name, free text
        with colons and parentheses in the extent field, and an entry without
        an extent. 81 of 81 attack and control rows met (C04).
      closest_calls: >-
        Outside path forms, two constructions leave blind_from_respected TRUE.
        SO-1 is a document-layer form: YAML duplicate keys, which
        yaml.safe_load silently resolves to the last value. SO-2 is a
        filesystem-layer form: a hard link to a blind_from file. A plain copy
        of a blind_from file elsewhere in the tree is also TRUE, and no path
        rule can see it.
      honest_declarations_rejected: >-
        Four honest declarations come out FALSE, which would make M9 report
        F_ind. h1 is an interpreter stdlib file outside the checkout (SO-5).
        h2 is a tracked file moved after it was read, evaluated at execution
        time (SO-4). h3 is a generated, gitignored file (SO-4). h4 is a
        directory listing written with a trailing slash. The design's own
        read_attestation, which it calls canonical, fails its own rule on 3 of
        38 entries, all trailing-slash listings (SO-16) (C04).
      time_scope: >-
        AC-28's E1 to E7 reproduce (C03). Under the reference
        evaluate_execution, a retry of a trial under a fresh run id gives a
        second block for that trial, and the result is FALSE ("2 blocks").
        WO-R-22's text admits it ("exactly one block naming its own trial and
        run id") (SO-3). A block for an unplanned trial name that carries a
        hit and an exemption sets a later Band-L trial FALSE (correct) (C04).

    attack_iii_failure_branches:
      method: >-
        Each branch's run directory built from the work-order text (WO-R-3,
        WO-R-5, WO-R-20) by this reviewer's own writers. The run directory
        includes the files tools/experiment_execution.py writes itself. Read
        statically, those are launch.json, command.txt and environment.json
        before the payload; stdout.log and stderr.log created before Popen; and
        the receipt last, whenever the supervisor survives (computations
        static_readings S1). Each run directory was fed to
        tools/validate_ledger.py check_run (imported for check_run only, fresh
        Ctx), and each failed record also to AC-2 (ii)'s predicate (C06).
      rows:
        - branch: FB-1
          what: exception after 3 finished rows
          record: terminal failed manifest after raw-result.json
          check_run: clean
          ac2_ii_predicate: true
        - branch: FB-2
          what: MemoryError (reserve released first)
          record: terminal failed manifest after raw-result.json
          check_run: clean
          ac2_ii_predicate: true
        - branch: FB-3
