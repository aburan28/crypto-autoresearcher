  # ---------------------------------------------------------------------------
  surviving_objections:
    - id: SO-1
      items: [DR-3, D-6, CC-4]
      severity: moderate (closest call; not counted as a break)
      objection: >-
        Document-layer duplicate keys. WO-R-11 names no loader for the
        declaration files, and yaml.safe_load, the repository's loader,
        silently keeps the last of duplicate keys. Three constructions name a
        blind_from path in the committed text while blind_from_respected comes
        out TRUE. y1 puts two path keys in one entry, blind first. y2 appends a
        second paths_read key under read_attestation, which replaces the first
        list. y3 duplicates the read_attestation block. y1 and y3 are deliberate
        constructions. y2 is the one plausibly accidental form: lines appended
        to the end of a report. A strictly literal reading of attack (ii)'s
        sentence "a non-canonical entry that leaves blind_from_respected true"
        could count these as a break. This reviewer does not, because they sit
        outside the canonicaliser that attack (ii) targets and have the same
        power as omission.
      constructed_input: C04 cases y1, y2 and y3
      repair: >-
        Load every declaration file with a loader that rejects duplicate keys
        (the C04 sketch refuses all three), and treat a load error as
        blind_from_respected false. Add y1 to y3 to AC-11 and AC-16.
    - id: SO-2
      items: [DR-3, D-6]
      severity: moderate (closest call; not counted as a break)
      objection: >-
        Filesystem aliasing beyond symlinks. A hard link inside the checkout
        to a blind_from file is canonical, exists, is not a symlink and is not
        a hit, so it comes out TRUE (C04 al1, samefile true). A copy (al2) is
        outside any path rule. git never creates a hard link in a working tree,
        so one would have to be made deliberately; that has the same power as
        omission.
      constructed_input: C04 cases al1 and al2
      repair: >-
        Add an inode test (os.path.samefile, or st_dev and st_ino) of every
        declared file against every blind_from file to the production oracles.
        Record as a limitation that M9 cannot see content copies.
    - id: SO-3
      items: [DR-3, CC-1, D-8]
      severity: moderate
      objection: >-
        A retry fails M9 under the reference while the text admits it. WO-R-22
        requires "exactly one block naming its own trial and run id", but the
        reference evaluate_execution, which WO-R-22 makes normative, counts
        blocks by trial only. A trial retried under a fresh run id therefore
        reads "2 blocks", gives blind_from_respected false and checker exit 7
        (F_ind, "I_indep invalid"). The append-only, hash-chained file then
        cannot validate that trial at all. Retries are expected: FB-11 and
        FB-12 consume run directories (experiment_execution.py line 195), and
        this lane's history includes an infrastructure failure and a claim
        expiry (DEC-20261002-e0aa2b R-DIRS). AC-28 has no retry case.
      constructed_input: C04 case T1
      repair: >-
        Key blocks by (trial, run_id) as the text says. Add to AC-28 a retry
        case (expected true) and two blocks for the same (trial, run_id)
        (expected false).
    - id: SO-4
      items: [DR-3, D-6]
      severity: moderate
      objection: >-
        Existence is evaluated against the execution checkout, not against the
        commit of the declaration. An honest entry that existed when read, but
        was later moved (for example a goal record sharded by
        tools/shard_goal.py) or that is generated and gitignored
        (ledger/.index/), is "does not exist in the checkout" at execution. M9
        is then false and the trial is F_ind on an honest declaration.
      constructed_input: C04 cases h2 and h3
      repair: >-
        Test existence at the commit that binds each declaration file (git
        cat-file -e <commit>:<path>, as C04 does for the design's own
        attestation), with a declared class for generated or untracked files.
    - id: SO-5
      items: [DR-3, CC-4, DR-11]
      severity: moderate
      objection: >-
        There is no admissible form for a read outside the checkout. The
        specification requires the executor's report to "declare every path it
        read", but WO-R-11 admits only repo-relative paths. An honest, complete
        declaration that includes an interpreter or library file therefore
        never gives M9 true, and an executor who leaves the read out breaks the
        specification. The design's own attestation needed separate
        relay_files_read and outside_repository_reads fields for exactly this
        case.
      constructed_input: C04 case h1
      repair: >-
        Add a separate out_of_checkout list. A path inside any checkout or
        worktree of this repository is mapped to its repo-relative form and
        matched (another worktree's copy of a blind_from file is then a hit).
        Every other out-of-checkout read is listed without setting M9 false.
    - id: SO-6
      items: [DR-3, D-6]
      severity: moderate
      objection: >-
        The stated time scope does not fit how the runner chains launches.
        (a) A trial's M9 reads the blocks up to and including its own, and
        that block is committed before launch. A read made during the trial's
        own counting therefore falls only on later trials, although
        invalidation_rules[0] concerns reads during Stage 2 to 4 counting "for
        that run". This is the first horn of round-1 SO-1, which DR-3's
        prescribed remedy leaves. (b) tools/experiment_execution.py run_plan
        launches every eligible trial back to back in one invocation (lines
        443-450) and has no trial filter (lines 455-459). Band L and the bridge
        have no mutual dependencies, so "one block appended and committed
        before each launch" can be met only by appending blocks in advance or
        by racing the loop. stage-compare-sealed is launched as soon as the
        three Band-H trials validate. That leaves no reliable window in which
        the execution session can read the sealed files after the freeze,
        write compare-map-r1.yaml and commit the exempt block before compare
        launches. Compare's first attempt then fails (no block of its own, no
        compare map) and consumes its run directory.
      constructed_input: static reading S1; C04 E-cases
      repair: >-
        State the execution procedure. Examples are successive plans that stop
        before stage-compare-sealed, or a closing-report recomputation of every
        trial's M9 over the final chain by declared_at windows. Record the
        residual of (a) as a limitation. Part (b) also touches WO-R-14 and
        D-5's mechanism (JRD2); see referred_to_composer R-2.
    - id: SO-7
      items: [D-2, D-3 accounting half, D-8]
      severity: moderate
      objection: >-
        The checker does not check row coverage. Suppose a payload silently
        drops candidates and exits 0. identity_holds still holds on the
        remaining rows, so a checker written from WO-R-8 and WO-R-9, and the
        design's own reference cert_accounting_code.check, both exit 0. A
        truncated cell would then be output_validated, with the dropped
        candidates neither completed nor named. The success criterion says
        "unfinished work named", and WO-R-3 says "never estimate unfinished
        rows".
      constructed_input: C05 cases X1 and X1-ref
      repair: >-
        check.py recomputes the cell's candidate list by rule name
        (candidates.py) and requires rows with row_index 0 to G-1 whose lambdas
        equal the enumeration, each completed or instrument_error. Otherwise
        it exits 10 (incomplete).
    - id: SO-8
      items: [DR-4, D-2]
      severity: minor
      objection: >-
        AC-24 and WO-R-21 are worded as literal reachability: "no r1/runner
        module except census.py and controls.py reaches any r1/indep module".
        Read that way they fail the legitimate layout, because main.py
        dispatches lazily to census.py and audit_indep.py must obtain traces
        through it. The gateway reading passes that layout and still flags
        C12b, C12c and C12d.
      constructed_input: C07 clean layout under R-lit versus R-gw
      repair: >-
        State the rule as edges. Only census.py and controls.py may import
        from r1/indep, and only r1.indep.api; reachability is computed with
        those two modules as terminal nodes.
    - id: SO-9
      items: [DR-4, D-6]
      severity: minor
      objection: >-
        AC-10's static graph "FROM main.py's Stage-0 path" has no extraction
        rule. A closure over every import in main.py, lazy ones included,
        flags the legitimate dispatch. The runtime argv form decides correctly
        either way.
      constructed_input: C07 clean layout, P-full versus P-s0
      repair: >-
        Define the path as main.py's module-level imports, plus the imports in
        its stage0 dispatch branch, plus stage0.py's closure.
    - id: SO-10
      items: [DR-4, D-7]
      severity: minor
      objection: >-
        AC-12's named cases restate round-1 C8's S4 to S6 as random.random(),
        random.seed(time.time()) and random.Random(os.urandom(8)). Round 1's
        S4 to S6 were in fact an alias import (from random import Random as R;
        R(7)), random.getrandbits(8) and random.Random(time.time_ns()). The
        executors may not read round-1 reports, so they will not construct
        S4. An attribute-only scan passes S4 and the import random as rnd and
        from random import randint forms.
      constructed_input: C08 R1-S4, X1, X2 under W-attr
      repair: Restate round-1 S4 to S6 verbatim and require alias resolution in the scan.
    - id: SO-11
      items: [DR-1, D-8]
      severity: minor
      objection: >-
        WO-R-14 says compare.py "exits non-zero without opening a sealed path"
        but does not map that exit to a WO-R-20 branch or stop code. If the
        bootstrap catches only Exception, a sys.exit in a stage module bypasses
        records.py. Only the provisional running record then remains: it is
        check_run-clean but carries no error or stop code, and AC-2 (ii)'s
        predicate is false.
      constructed_input: C06 case OB-1
      repair: >-
        Make FB-1 cover BaseException including SystemExit, or require stage
        modules to raise. Name a stop code for a COMPARE freeze failure.
    - id: SO-12
      items: [DR-2, D-2]
      severity: minor
      objection: >-
        The field used for re-verification is unstated. WO-R-8 binds
        (row_index, cell, lambda, N) but not the modulus. A check.py that takes
        the modulus from the certificate file accepts certificates computed in
        another field (exit 0); one that takes it from the route table by cell
        exits 3.
      constructed_input: C05 case X2 on synthetic cell syn-a-06-04
      repair: >-
        State that kfield.py re-verifies in the cell's route-table modulus and
        that the file's modulus field must equal it.
    - id: SO-13
      items: [DR-1, CC-3]
      severity: minor
      objection: >-
        AC-25's FB-12 procedure ("confirm the receipt records the attempt")
        needs tools/experiment_execution.py in run mode. authorize (lines
        249-313) requires a live claim on origin refs and a non-zero-run
        executor task. The alternative is run_plan with an injected gate on a
        scratch git root. The design names neither, and a zero-run review card
        may be barred from both. Static reading establishes the receipt (S1).
      constructed_input: static reading S1
      repair: >-
        Say which, or accept the static reading of execute_trial's except
        clause and receipt as the FB-12 evidence.
    - id: SO-14
      items: [DR-1, D-8, CI-6]
      severity: minor
      objection: >-
        WO-R-18's --synthetic driver writes command.txt, environment.json,
        stdout.log and stderr.log, but the design does not say they are
        written before the payload starts, as the runner writes them. check_run
        requires them even for a provisional record (validate_ledger lines
        1122-1128). If they are written at the end, AC-2 (i) and AC-25's FB-11
        case fail on a correct payload.
      constructed_input: static readings S1 and S2
      repair: Require the synthetic mode to write them first.
    - id: SO-15
      items: [DR-13]
      severity: minor
      objection: >-
        DR-13's second sentence is "the sessions of TASK-20261002-c5d9e7 and
        TASK-20261002-323713 hold no card that authors or checks Stage 0, C2
        or C4 values". The design carries it only for the Stage-0 hand-note
        author (stage0_mechanism.who_and_when), not for the execution batch's
        checking and validating roles.
      constructed_input: design text
      repair: Add it to plan_requirements.scope_note or execution_card_conditions.
    - id: SO-16
      items: [DR-3]
      severity: minor (consistency)
      objection: >-
        The design calls its own read_attestation "canonical repo-relative
        POSIX paths", yet 3 of its 38 entries fail its own rule: trailing-slash
