  method:
    operands_and_seeds: >-
      A polynomial is a bit-packed Python int (bit i is the coefficient of
      X^i). A random operand of exact degree D is X^D +
      random.Random(seed).getrandbits(D). The generator is CPython
      random.Random (MT19937). Each seed is the first 8 bytes (big-endian) of
      SHA-256 of a label. Labels are JRD3|prod|D|a and JRD3|prod|D|b (product
      operands, exact degree D-1 each, the reading of degree below D),
      JRD3|msq|D|m (monic modulus, exact degree D) and JRD3|msq|D|a (exact
      degree D-1), JRD3|gcd|D|a and JRD3|gcd|D|b (exact degree D), and
      JRD3|ge|m (m rows of getrandbits(m)). Every family uses the same seeds,
      so all three multiply bit-identical operands. Operand SHA-256 digests
      are in every item record.
    E_INT: >-
      Kronecker substitution into one Python int per operand. Each coefficient
      occupies a k-byte slot, k least with 256^k > min(len a, len b), where
      len is the number of coefficients. That minimum bounds every integer
      convolution value, so no carry can cross a slot. Spreading uses
      format(x, 'b'), reversal, translation to 0/1 bytes, a strided bytearray
      assignment and int.from_bytes. Multiplication is CPython int
      multiplication. Extraction takes the low byte of each slot from
      to_bytes, its parity, and int(..., 2). At the QR2 degrees, slot widths
      are 3 bytes for the 2^20, 2^22 and 5^10 products and for every Barrett
      product up to 2^24 (those have D-1 coefficients), and 4 bytes for the
      2^24 product and everything at 5^11 and above. The supplementary small
      degrees use 1 or 2 bytes. Conversions are inside the timed region.
    E_DEC: >-
      The same substitution in base 10 with decimal.Decimal. Each slot has k
      decimal digits, k least with 10^k > min(len a, len b): 7 digits at 2^20,
      2^22 and 5^10, 8 at 2^24, 5^11 and 6^10, 9 at 3^17. The bit lies in the
      slot's units digit. The operand is built as a digit string, converted by
      decimal.Decimal(str), and multiplied in a Context(prec=MAX_PREC,
      Emax=MAX_EMAX, Emin=MIN_EMIN) that traps Inexact and Rounded, so a
      non-exact product would raise. str() converts back, and each slot's
      parity is the parity of its units digit (10^j is even for j >= 1). The
      multiplication algorithm is libmpdec's internal choice, and only its
      measured scaling is reported.
    E_NP: >-
      np.unpackbits of the operand bytes gives the 0/1 vectors. np.fft.rfft at
      the least 5-smooth length >= len a + len b - 1, a pointwise product,
      then np.fft.irfft and np.rint. Parity is int64 & 1, taken in
      2^24-element chunks, followed by np.packbits and int.from_bytes.
      Exactness: every convolution value is an integer <= min(len a, len b) <=
      1.3e8, and the largest observed rounding residual |c - rint(c)| over all
      unsplit E-NP products was 1.35e-08 (recorded per item), far below 0.5.
      No split was needed for exactness, so the primary E-NP items are
      unsplit. Where an unsplit item failed under RLIMIT_AS, a
      memory-motivated variant was also run (one Karatsuba level over F_2 on
      top of the family product, i.e. three half-size products). It is
      reported as split_variant and never replaces the primary outcome.
    modular_squaring: >-
      a^2 mod m. s = a^2 is formed by F_2-linear zero interleaving: O(D) byte
      operations, the same code for every family, inside the timed region. The
      reduction is Barrett with mu = floor(X^(2D)/m), of degree D, precomputed
      once per modulus by Newton iteration g <- f g^2 mod X^(2l) on f =
      rev_D(m) (characteristic 2). mu is computed outside the timed process
      and loaded from file. Its bits are identical whichever family computed
      it, because E-NP and E-DEC agree bit for bit at every QR2 degree up to
      6^10. At 3^17 only E-DEC completed it. The timed reduction is q =
      floor(floor(s/X^D) mu / X^D), one family product of D-1 by D+1
      coefficients, then r = s + q m, a second family product of the same
      shape. For polynomials this quotient is exact whenever deg s <= 2D-1, so
      there is no correction step. Every item checks deg r < D. Given correct
      products, that certifies q is the true quotient, since any other q'
      gives deg(s - q'm) >= D.
    classical_gcd: >-
      Euclid's algorithm on bit-packed Python ints: while b != 0, reduce a mod
      b by repeated a ^= b << (deg a - deg b) until deg a < deg b, then swap.
      Both operands have exact degree D, and there is one process per degree.
      Verification uses Stein's binary gcd, an independent algorithm, on the
      same operands in separate processes (degrees listed per ladder row as
      stein_equal). At every degree there is an untimed check that the
      returned gcd divides both operands.
    elimination: >-
      QR4: an m x m matrix over F_2 with uniform entries (rows =
      getrandbits(m)), rows stored as Python ints. Forward Gaussian
      elimination with leading-bit pivots, processed row by row. Each row is
      XOR-reduced by the pivot row owning its current leading bit until it
      acquires a new leading bit (and becomes a pivot) or vanishes. The pivot
      rows in decreasing leading-bit order, followed by the zero rows, form a
      row echelon form. This is checked (strictly decreasing leading bits) and
      the rank is recorded. Reduced row echelon form is not computed.
    verification: >-
      Products are verified when the SHA-256 of the full result equals that of
      a second family on identical operands. Modular squarings are verified
      when deg r < D holds in-process and SHA-256 of r and of q equals that of
      a second family on identical (a, m). The Barrett constant is
      cross-checked between E-NP and E-DEC where both completed, and at 3^17
      it is certified indirectly by the deg r < D check of both verifying
      families. No randomised evaluation identity was used: a randomised check
      needs reduction modulo a random irreducible, which is extension-field
      arithmetic excluded by BR-6. All engines and the Barrett and gcd
      routines also passed a schoolbook unit test of 2127 cases before the
      campaign, including all-ones operands at slot boundaries.
    timing_and_rss: >-
      Seconds are time.perf_counter around the one timed operation: a product,
      or the interleave plus the two Barrett products. One sample per item.
      Peak RSS is getrusage(RUSAGE_SELF).ru_maxrss, sampled immediately after
      the timed operation. It is the process-lifetime peak, including the
      interpreter, imports and operand generation or loading, and is reported
      in MiB. VmHWM and VmPeak are also in computations.json. The bash time
      real/user/sys of each process is recorded beside it. sys time is a large
      share for the large-array families because fresh multi-GB allocations
      are page-faulted.
