  QR3:
    method: >-
      For each family, t_sq(B) is the measured modular-squaring time when B is
      a QR2 degree. When B lies between two completed QR2 degrees it is a
      linear interpolation in (log2 D, log2 seconds). Outside the completed
      range (above or below) it is the family's least-squares power law over
      its completed QR2 degrees (squaring_fits). t_gcd(B) comes from the gcd
      fit. T_A = G(d) (131 t_sq(B) + t_gcd(B)) / 86400 days. The smallest
      column uses the least of the three families' t_sq(B), naming the family.
      The route is X if M is FAIL or T_A > 90 days, else D. marginal is true
      when 30 < T_A <= 270 days. Numbers carry four significant digits.
      Extrapolated values rest on the fitted power law holding beyond the
      measured range, which these measurements cannot test; basis records
      which case applies.
    memory_rule_as_applied: >-
      A family column is FAIL if (R1) B is a degree at which this task
      measured that family's modular squaring, or the gcd, and the item did
      not complete because of RLIMIT_AS (MemoryError); or (R2/R3) B exceeds
      the largest degree at which that item completed and max(2B, rho B) >
      2^36 bits, where rho is the measured whole-process peak RSS in bits
      divided by D at that largest completed degree. R2 applies to the
      family's modular squaring and R3 to the gcd. Otherwise the column is
      PASS, including every B below the smallest measured degree. The smallest
      column is FAIL only if all three family columns are FAIL. Alternative
      readings are QR0-14 to QR0-17.
    reason_codes: >-
      R1-modsq-not-completed-at-B and R1-gcd-not-completed-at-B mean the item
      measured at exactly B did not complete under RLIMIT_AS.
      R2-modsq-rss-extrapolation means max(2B, rho B) > 2^36 bits with rho
      from the family's modular squaring at its largest completed degree.
      R3-gcd-rss-extrapolation is the same with rho from the gcd at its
      largest completed degree. none means PASS.
