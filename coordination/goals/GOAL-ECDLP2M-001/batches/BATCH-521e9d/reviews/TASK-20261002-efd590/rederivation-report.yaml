  QR1:
    definition_check: >-
      Every QR1 value is an exact integer computation (qr1.py). G(d) was
      obtained by enumerating all 2^d monic polynomials of degree d and
      testing whether the support lies in {X^(2^i), i >= 0}. The constant term
      is excluded because X^0 is not of that form. log2 B comes from a
      60-digit Decimal logarithm, rounded to two decimals; no value lies
      within 1e-20 of a rounding tie. B = d^(q+1) > 2^s in every cell, so 2^s
      never attains the maximum. L12 and L13 share q = 10 and therefore B, and
