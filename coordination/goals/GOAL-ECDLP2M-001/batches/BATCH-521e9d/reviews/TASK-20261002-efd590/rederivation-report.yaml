  runs_launched: 0
  scope: >-
    Blind re-derivation of the quantities QR0 to QR4 exactly as the card
    defines them, for joint JRD3 only. Every value below was computed or
    measured by this task with its own code (Python standard library; numpy
    only inside the E-NP family), from the card's definitions alone. Operands
    are random polynomials over F_2 and random F_2 matrices only. Zero
    experiment runs. Nothing was compared with any other report (BR-5).
    Measured values describe this host and these implementations only.
