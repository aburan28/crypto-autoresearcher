  limitations:
    - id: LIM-01
      text: >-
        Measured values hold for the recorded host of each item, CPython
        3.11.15 and numpy 2.4.6, one operation per item. Run-to-run variance
        was not characterised. Every completed QR2, QR4 and gcd value, and so
        every QR3 input, was measured on H1 (Xeon @ 2.80GHz). The QR2 items
        run on H2 (Xeon @ 2.10GHz) after the second restart were
        C-msq-E-INT-3p17, C-msq-E-INT-5p11, C-msq-E-INT-6p10,
        C-prod-E-INT-3p17, C-prod-E-INT-5p11, C-prod-E-INT-6p10. Their outcome
        is reported as observed on H2. A non-completion within the watchdog on
        H2 does not by itself show the same on H1. The measured host-control
        ratios, H2 seconds over H1 seconds on identical seeded items, are
        H-prod-E-INT-2p20 H2/H1 = 0.810; H-msq-E-INT-2p20 H2/H1 = 0.826;
        H-prod-E-INT-2p22 H2/H1 = 0.824; H-prod-E-DEC-2p24 H2/H1 = 0.838;
        H-prod-E-NP-2p24 H2/H1 = 1.128; H-gcd-2p20 H2/H1 = 0.772.
    - id: LIM-02
      text: >-
        Every QR3 value at a B outside a family's completed QR2 range is a
        power-law extrapolation. Above the range it assumes the fitted
        exponent continues, and nothing here tests that. Below 2^20 it is a
        downward extrapolation. Against the supplementary small-degree
        measurements, measured over extrapolated is E-INT 2^4 36.5; E-INT 2^8
        0.797; E-INT 2^12 0.606; E-INT 2^16 0.556; E-DEC 2^4 8.43; E-DEC 2^8
        0.781; E-DEC 2^12 0.873; E-DEC 2^16 1.25; E-NP 2^4 828; E-NP 2^8 39.2;
        E-NP 2^12 2.42; E-NP 2^16 1.16. The extrapolation therefore
        understates per-call overhead at the smallest degrees by up to the
        largest of these factors, and differs by less than a factor of 2 near
        2^16 (QR0-10). Cost units are wall-clock seconds and days on one core.
        No parallelism, time-memory trade-off or success-probability factor is
        applied, because T_A as the card defines it contains none.
    - id: LIM-03
      text: >-
        The memory verdict follows the card's two-part rule literally.
        Whole-process RSS per bit (QR0-16) inflates rho for the gcd, where the
        interpreter baseline dominates. In the primary table R3 fires in 105
        family-column entries and is the only FAIL reason in 0 of them, so no
        verdict rests on R3 alone. Alternative A7 (baseline subtracted)
        changes no verdict, and A8 (per input bit) changes the verdicts listed
        under QR0-16.
    - id: LIM-04
      text: >-
        Watchdog expiries and MemoryErrors are recorded as non-completions
        only. They are not values and not evidence about any quantity beyond
        this implementation, host and limit.
    - id: LIM-05
      text: >-
        Exact verification is by second-family SHA-256 agreement. Two
        independent implementations agreeing on the same wrong result is not
        excluded by a probability bound; it is excluded only by the
        independence of their arithmetic (Karatsuba integers, decimal NTT and
        float FFT). At 3^17 the E-NP evidence is the split variant. The gcd is
        verified by Stein's algorithm at 2^16, 2^17, 2^18, 2^19, 2^20, 2^21,
        2^22, and only by divisibility at 2^23, 2^24.
    - id: LIM-06
      text: >-
        The six E-INT items at 5^11, 6^10 and 3^17 ran on H2 and each reached
        the 3600 s watchdog. Their non-completion reflects CPython int
        multiplication on H2 within that watchdog. It is not a memory outcome.
    - id: LIM-07
      text: >-
        The card's advisory wall-clock budget (18000 s) was exceeded. Most of
        the excess is the six E-INT items and the gcd item at the end of the
        ladder, each of which ran until its 3600 s watchdog, plus the re-runs
        of the two items killed by the two container restarts (see
        interruptions). The campaign wall clock is in computations.json
        (raw_outputs.campaign.log).
