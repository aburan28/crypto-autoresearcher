  QR2:
    units: >-
      seconds are perf_counter seconds for one operation. peak_rss_mib is
      ru_maxrss in MiB (process-lifetime peak, sampled right after the timed
      operation). outcome is completed, MemoryError or watchdog_expiry, and an
      item that did not complete carries no value. verified means SHA-256
      equality with a second family on identical operands; for modular
      squaring it also requires deg r < D. bash_time is the bash time keyword
      output for the whole process, and it includes operand generation,
      loading and verification work outside the timed operation. Product
      operands have exact degree D-1; modular squaring uses m of exact degree
      D and a of exact degree D-1.
    product:
      E-INT:
        - {D: "2^20", host: "H1", outcome: "completed", seconds: 1.689e+01, peak_rss_mib: 5.041e+01, verified: true, verified_against: "E-DEC+E-NP", bash_time: "real=16.946 user=16.760 sys=0.054"}
