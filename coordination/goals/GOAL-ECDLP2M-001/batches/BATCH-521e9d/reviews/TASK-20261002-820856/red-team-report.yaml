  verdict:
    jrd2: breaks
    summary: >-
      JRD2 BREAKS at attack (iii), on PTM-RD5 and on disguises the plan did not
      name. It holds at (i), (iv) in scope and (vi). (ii) records differences
      inside the marginal band and no breaking condition. (1) PTM-RD5 is not
      met. The design's own R-C8 demonstration code, run unchanged on one more
      synthetic cell, (n, n') = (8, 3) with modulus z^8+z^4+z^3+z+1, flags its
      own legitimate A-DENSE on 2 of 20 rows (lambda = X^3 and X^3+X^2+X; rule
      R2) and reports "met" false. The value-based L-class test fires because
      A-DENSE's own operand X^(2^n) + X mod H equals rad(L) by value. An
      A-DENSE that performs WO-I-4 step (6) ("Split G into irreducible factors
      over F_2") is flagged far more often. With Berlekamp's split it is
      flagged on 88 of 140 rows: R4 on every row with deg G >= 2 and G !=
      rad(L), and R2 on the two (8, 3) rows above. With a distinct-degree and
      equal-degree split it is flagged on 14 of 140 rows (on the six itemised
      cells, exactly the rows where G = rad(L) by value), including 4 rows of
      the plan's own trace-audit cell syn-a-10-03. No standard
      WO-I-4-conformant split passes every row. The reference A-DENSE passes on
      the three R-C8 cells only because it skips step (6) and enumerates K on
      an unsplit G. (2) The six named disguises D3a to D3f are rejected on 140
      of 140 rows each, by both the reference audit and an audit written here
      from the WO-I-10 text. Five constructions the plan did not name return
      I_direct's quantity and pass R0 to R4. D3g2 reduces modulo a multiple U*L
      rebuilt from lambda (admitted on 140 of 140 rows). D3g does the same with
      M = mul(L, U) (137 of 140). D3h applies the K-root primitive to L itself
      (140 of 140). D3k forges a KERNEL token through the public TPoly
      constructor and the public value slot that interface.primitive_layer
      specifies (140 of 140). D3e2 takes gcd(H, U*L) and then I_direct's
      squarings (124 of 140; count equal to I_direct's on 130). Two more pass
      static S1 to S4 as worded. D3i computes I_direct off the trace with
      coefficient lists. D3t behaves legitimately only when traced, and AC-7
      traces only syn- calls. Provenance does not survive re-wrapping: a token
      is a public integer that any route can reattach. (3) This is not evidence
      for K-new-record (b). A candidate local remedy, written and tested here,
      rejects every trace-visible disguise above on every row where it differs
      from a legitimate step. D3h passes it only on the 8 rows where L itself
      is irreducible of degree dividing n, where kroots(L) is S-BERL's own
      single-factor step. It uses a modulus whitelist by provenance, H-class
      and H-descendant classes exempt from value tests, a kroots input rule and
      a handle registry. On the same rows it passes S-BERL (0 of 242 flagged)
      and DDF-split A-DENSE (0 of 242), with 3 residual flags of 242 on
      Berlekamp-split A-DENSE. The remedy is local in place but structural in
      kind: whitelist, not blacklist. It is a demonstration on synthetic cells,
      not a proof that no further disguise exists. Everything else in JRD2
      holds as stated below, with objections. The rule replay reproduces the
      route line except at the marginal row (10, 4), whose route turns on the
      above-ladder gcd exponent (1.9826 measured top segment against 2). The
      amendment is in scope in kind, but its headline anchor is not
      byte-identical to the frozen sentence.
    prior_comparison: >-
      The plan's prior put the break at (iii), first at a copy that drops
