  jrd2:
    i_rule_replay:
      method: >-
        Own script (rule_replay.py), written from R-ROUTE-RULE's text and the
        relayed R-C5 and R-C6 items before the route table was read. For each
        of the 113 census and calibration rows it computes (q, r) = divmod(n,
        n'), s = n' - r, B = max(2^s, d^(q+1)) and G (census 8, 12, 32, 64, 128
        by degree; Stage 1 2^d; C5 100; C6 4; C2 to C4 1). (M): a declared
        engine's squaring is feasible if measured at a degree >= B; otherwise
        max(2B, rho B) is compared with 2^36 bits, rho being VmPeak in bits
        over the degree at that engine's top completed item. The same test is
        applied to the gcd. (T): T_A = G (131 t_sq(B) + t_gcd(B)), with t_sq
        the amortized squaring of the fastest engine with a feasible memory
        verdict, and log-log interpolation between ladder points. Above the
        ladder the replay fits t_sq proportional to B and t_gcd proportional to
        B^2 (the classical-Euclid model). Sensitivity variants use the
        top-segment gcd exponent, a least-squares exponent over G20 to G24, and
        unamortized squarings.
      result: >-
        Band L, (A) on 15 groups (264 rows) and S on 45 groups (2664 rows), of
        which 40 fail (M). Marginal rows are (10, 4) at 91.56 days and (11, 5)
        at 212.3 days. Bridge, Band H, Stage 1, C2 to C4, C5 at n' = 33 and C6
        are all (A). No bridge or Band-H row is substituted. C5 at n' = 11 is
        (M)-infeasible at d = 7 (B = 7^12), but the specification runs that arm
        by I_direct only.
      comparison_with_design_table: >-
        Row by row, the design's route_map differs from the replay only at
        stage2-bandL-n10/d4: A-DENSE at 88.43 days in the design, S-BERL at
        91.56 days in the replay. The difference is entirely the above-ladder
        gcd exponent. The design's application rule (1) uses the top-segment
        exponent 1.9826 (G23 to G24); the replay's primary uses 2. Under the
        replay's own top-segment variant the row is A at 88.4273 days, equal to
        the design's figure; under the least-squares variant it is A at 52.9
        days. Every other row and every T_A detail agrees. The design's
        route_line_code, loaded by path with its pinned digest, reproduces the
        design's Band-L map and every A-DENSE detail T_A from its literal
        tables. Those tables equal the session_computations R-C5 and R-C6 items
        field for field (0 mismatches over 57 items). With only the gcd
        exponent fixed at 2, route_line_code itself flips exactly this row
        (routemap_check.py).
      threshold_horizon_formula_check: >-
        Threshold 90 days, marginal band (30, 270], the 131 literal, G x (131
        t_sq + t_gcd), the 2^36-bit ceiling, the fastest feasible engine and
        the exclusion of composition and factorisation are all exactly
        R-ROUTE-RULE's. No other threshold, horizon or cost formula enters the
        route.
      finding: >-
        HOLDS on the rule as written. R-ROUTE-RULE says t_gcd is "measured (or
        fitted and labelled)" and does not fix the extrapolation, so the
        design's labelled top-segment fit is an admissible application, and the
        one differing row is marginal. Recorded for the composer (objection
        O-RT-5). The design asserts that application rule (1) was "fixed before
        any rate exists", but the committed record cannot show it.
        procedure.interim_hand_backs states that route_line_code was written
        after the relays, and the design file has a single commit (the
        snapshot). The route of the 12 rows of (10, 4) therefore rests on an
        extrapolation choice whose quantifier order is unverified, 16-fold
        beyond the last measured gcd degree.

    ii_boundary_remeasurement:
      protocol: >-
        Items M01 to M13 ran one process at a time, each wrapped as { time
        timeout 3600 python3 -I <block> <args> ; }. RLIMIT_AS = 8 GiB was set
        inside every process (header rlimit_as [8589934592, 8589934592]). nproc
        (4) and /proc/loadavg were recorded before and after every item. Seed
        20261008 was used, independent of the design's 20261002. Operands are
        uniformly random F_2[X] polynomials from a sha256-derived stream, with
        no cell. The declared engines were timed with the design's own pinned
        blocks (engine_bench_code, gcd_bench_code), as R-RATES makes them the
        engine identity. E-INT, an exact cross-engine product check and an
        independent classical gcd were timed with the red team's own
        rt_bench.py. numpy 2.4.6 and libmpdec 2.5.1 were used. This host
        reports platform fc-v80; the design's relays came from fc-v51.
      host_load_disclosure: >-
        Other sessions shared the host: loadavg 1.0 to 2.3 during the series on
        4 CPUs. This reviewer's own trace-harness runs (17:09 to 17:23Z)
        overlapped the tail of M02 and M03. Two of its waiting loops (17:37 to
        18:04Z) busy-read /dev/zero on one core, overlapping M03's tail and
        M04's first 20 minutes. The loop was replaced by a sleeping poll at
        18:04Z, and load fell from about 2.0 to 1.0. Contention can only
        lengthen a time, and no item was discarded or re-run.
      gcd_watchdog_note: >-
        The 2^28 modular squaring was not re-measured. On the design's host it
        took 50 m 8 s, and this host runs the classical gcd 2 to 33 percent
        slower, so it risked the 3600-s watchdog. Driver 1 was stopped while
        M03 ran (M03 completed), and driver 2 measured np mul at 2^28 and np
        sqrmod at 5^12, the same 8-block FFT regime, as labelled proxies. This
        is an instrument decision, not a result.
      measured: >-
        Declared gcd (classical Euclid, gcd_bench_code): 2^22 186.129 s, 2^23
        562.457 s, 2^24 1911.826 s, against the design's 139.534, 472.09 and
        1865.691 (ratios 1.334, 1.191, 1.025; my top-segment exponent 1.7651
        against the design's 1.9826). E-NP squaring (engine_bench_code,
        amortized over 131): 5^12 1344.76 s (ratio 0.989), 6^10 102.337 s
        (1.118), 3^17 379.643 s (1.181). E-NP product at 2^28: 824.703 s
        (1.119). E-DEC squaring at 6^10: 328.678 s (1.357; E-NP remains the
        faster engine). VmPeak: E-NP sqrmod 5^12 3,985,992 kB and np mul 2^28
        3,851,456 kB, against the design's 3,985,988 and 3,851,452. E-DEC
        sqrmod 6^10 2,609,504 kB. Every product and squaring passed the
        identity check modulo a random irreducible of degree 89, and every gcd
        passed its divisibility checks. Own items: E-INT and the exact
        cross-check are reported below. An independent classical Euclid written
        here (rt_bench.py gcd) took 200.587 s at 2^22, 1.08 times the design
        block on this host, so the declared gcd implementation is not slow. Its
        2^23 item (M13) was killed when driver 2's background wrapper reached
        its 2-hour limit at about 19:25Z, an instrument condition, and was not
        re-run. Every ratio lies inside the factor 3 of R-ROUTE-RULE and of the
        blind tolerance.
      rows: >-
        T_A in days by R-ROUTE-RULE's formula: the design figure, then the
        range over the re-measured variants in remeasure_line_out.json
        (squaring from the design relay or from this host, gcd from the design
        relay or this host, gcd exponent above 2^24 equal to 2 or to the top
        segment). (10, 4), B = 2^28, G = 12, design 88.43 (A): 60.39 to 96.20,
        A in 6 of 16 variants. It is A in every variant using this host's
        top-segment exponent (1.7651). With the design's exponent (1.9826) it
        is A only under the design's own squaring or the same-regime proxy,
        which scales the 5^12 squaring to 2^28 by the design's 2^28 to 5^12
        ratio (88.16). It is S under exponent 2, and under the design's
        exponent with either upward squaring proxy (linear scaling 90.11,
        product ratio 91.43). With this host's gcd and exponent 2 it is 93.20
        (S). (11, 5), B = 5^12, G = 32, design 205.6 (S): 145.2 to 215.9, S in
        every variant; the measured 5^12 squaring lowers it by about 0.7 days.
        (14, 6), B = 6^10, G = 64, design 26.44 (A): 22.5 to 28.3, A and below
        the 30-day band edge in every variant. (8, 3), B = 3^17, design 13.78
        (A): 10.4 to 15.1 (A). (12, 6) and (13, 6), design 794 (S): 503.5 to
        844.0 (S). (14, 7), design 1029 (S): 696.8 to 1086.0 (S).
      breaking_conditions: >-
        None met. No substituted row has T_A at most 30 days on a declared
        engine in any variant (the smallest is (11, 5) at 145.2 days). No
        derivation-(A) row exceeds 270 days on every declared engine (the
        largest is (10, 4) at 96.2 days). No memory verdict is contradicted:
        every item inside the ladder completed under 8 GiB with VmPeak equal to
        the design's to within 0.01 percent, and no above-ladder verdict was
        measurable inside the watchdog.
      engine_outside_the_declared_set: >-
        E-INT (CPython Karatsuba on Kronecker-spread operands, excluded on
        dominance) was measured, verified modulo a random irreducible of degree
        127. At 2^20 its amortized squaring took 27.921 s, 59.9 times E-NP
        (0.466 s) and 12.0 times E-DEC (2.318 s). At 2^22 it took 288.537 s,
        119.3 times E-NP and 28.7 times E-DEC. The gap widens with degree
        (Karatsuba against FFT and NTT). The dominance exclusion holds at both
        degrees measured, and it would fail only if E-INT were faster than both
        declared engines at some boundary degree. No other CI-5 engine is
        importable: gmpy2, flint, scipy, galois, cffi and numba are absent.
        sympy is present but pure-Python and not a faster engine. NATIVE was
        not measured (see engine_declaration_dr_5 and scope_limits).
      fft_exactness: >-
        An independent numpy engine written here (block 2^25, nine full block
        products) produced a degree-2^27 product of two random degree-2^26
        operands that is BITWISE EQUAL to the exact decimal product (traps on
        Inexact and Rounded), with maximum rounding error 5.59e-9, and also
        verified modulo a random irreducible of degree 127 (M11). E-NP's blocks
        never exceed 2^25 coefficients, so the exactness-critical object is one
        2^25 by 2^25 block product, which is the same at every B >= 2^25. The
        largest absolute rounding error recorded at the largest degrees the
        design relies on was 6.05e-9 (np mul at 2^28, 81 block products) and
        5.59e-9 (np sqrmod at 5^12, 237 block products), against the 0.25
        guard. The guard's distance-to- nearest-integer cannot detect an error
        above 0.5, so the bitwise cross-check and the degree-89 identity are
        the exactness evidence, not the guard.
      wo_i_14_verification_cost: >-
        The design block's own verification (four big_mod reductions modulo a
        degree-89 p) took 13.268 s at 5^12, 3.575 s at 6^10 and 7.559 s at
        3^17, against squarings of 1337.5, 101.7 and 377.5 s (1.0, 3.5 and 2.0
        percent). At 2^28 this adds about 0.25 days to (10, 4)'s 88.43 (design
        fit), to about 88.7, and moves no route (O-RT-9).
      finding: >-
        The re-measurement holds within its band. Rates on the declared engines
        reproduce within the factor 3 (worst 1.357). The only route that moves
        is the marginal (10, 4): through the gcd exponent above the ladder and,
        at the 3-percent level, through the choice of squaring proxy at 2^28.
        That is recorded under O-RT-5 and RC-3 and is not a break by the plan's
        attack (ii) criteria.
    iii_trace_and_independence:
      method: >-
        Own primitive layer (harness/rt_trace.py) that emits WO-I-10's event
        schema {seq, op, ins, out, mats, mats_out, k, label, after_arith}. Its
        TPoly has __slots__ (value, token) exactly as interface.primitive_layer
        words it (immutable; copy and deepcopy return self; __bool__ and
        __reduce__ raise). Own audit of R0 to R4 written from the WO-I-10 text.
        The design's reference audit() (trace_audit_demo_code, pinned digest,
        loaded by path, never edited) is applied to the same events.
        Brute-force N by enumeration of F_(2^n). Cells, all synthetic with n
        outside {4, 7, 11, 12, 13, 31, 131} and at most 19: the three R-C8
        cells syn-a-09-04, syn-a-10-03 and syn-a-15-04, plus own cells (n, n')
        = (8, 3), (14, 5), (17, 4), (16, 3) and (18, 5). Every non-linearized
        F_2 lambda of exact degree 3 and 4 (as AC-7 words it), and also degrees
        2 and 5 on three cells. The new disguise routes live in a separate
        module (harness/rt_new_routes.py). An AST check of S1 to S3 as worded
        finds no violation in it.
      named_disguises: >-
        D3a to D3f, written as AC-7 words them, are each rejected on 140 of 140
        rows (deg 3 and 4, seven cells) and 102 of 102 rows (deg 2 and 5, three
        cells), by both audits. Each returns brute force's N on every row.
        Rules fired as AC-7 predicts (D3c also fires R1 under the reference
        audit; D3d fires R0 for the re-wrap).
      legitimate_routes: >-
        S-BERL passes on every row (0 flagged by either audit). For A-DENSE,
        see PTM-RD5 below: the design's reference variant fails at (8, 3), and
        the WO-I-4-conformant variants fail widely.
      unnamed_disguises: >-
        All return I_direct's quantity deg gcd(X^(2^n) - X, L), equal to brute
        force except where noted. D3g: L built as AC-7 does, M = mul(L, U) with
        U = X^2 + X + 1 from the lifts, n squarings of X modulo M, then gcd(M,
        U (t + X)), whose degree minus 2 is N. Admitted on 137 of 140 rows and
        102 of 102. D3g2: as D3g, but U*L is rebuilt from lambda as shift(U,
        2^n') + mul(lambda, U), so no L token ever exists. Admitted on 140 of
        140 and 102 of 102. D3h: kroots(L), since no rule constrains the input
        of the K-side root primitive. Admitted on 140 of 140 and 102 of 102.
        D3k: S-BERL's own Q - I kernel is computed, a kernel token is copied,
        each squaring of the residue's public value is done off-trace with
        format/translate (no bitwise operator), and the results are re-wrapped
        as TPoly(value, kernel_token) before mod(., L) and gcd(L, .). R3 and R2
        exempt KERNEL operands, so it is admitted on 140 of 140 and 102 of 102.
        D3e2: D = gcd(H, U*L), the F-1 collapse through a value-built multiple
        of L, then I_direct's squarings modulo D and a gcd. Admitted on 124 of
        140 and 89 of 102; count equals I_direct's on 130 of 140 and 93 of 102
        (every miss is a row where U divides H and n is even, adding exactly 2
        (10 of 10 rows checked); a U coprime to H removes them). D3i: I_direct
        off the trace on coefficient lists, with a decoy A-DENSE trace.
        Admitted on 138 of 140 and 101 of 102 (flagged only where the decoy
        itself hits the (8, 3) false flag). Every unnamed disguise passes
        static S1 to S3 as worded.
      why_they_pass: >-
        Every rule R1 to R3 is conditioned on an L-CLASS modulus or gcd input.
        L-class is value equality with L or rad(L), or descent through gcd,
        div_exact, sqrt or a product of two L-class inputs. A multiple of L
        made with a non-L-class factor is not L-class, so R1 to R3 never see
        it. R4 governs matrices only, and no rule governs kroots. Tokens are
        public integers in a public slot, and the TPoly constructor is not
        reserved to the primitive layer. Any route can therefore attach any
        provenance. S2 forbids only bitwise operators and four int methods.
        Coefficient-list arithmetic with + and % remains, the public value slot
        gives the raw integer, and decimal is importable in every r1/indep
        module.
      answer_to_the_plan: >-
        The trace does not carry provenance that survives re-wrapping (D3k).
        AC-7 does not reject every I_direct disguise round 1 did not try (D3g,
        D3g2, D3h, D3k and D3e2 on the trace; D3i off it; D3t aware of it). It
        does not pass PTM-RD5 (below). The independence TEXT rule (WO-I-6) is
        satisfied by S-BERL's own construction: Q rows have e = 2i < 2 deg rad
        L <= 2^(n'+1), gcds use derivatives, divisors and kernel polynomials,
        and S-BERL passes R1 at bound 2^(n'+1) on every row. The text rule is
        therefore restated correctly. Its mechanisation is incomplete.

    iv_amendment:
      path_id_and_mechanics: >-
        At experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml, id
        AMD-20261002-09957b, version 1 to 2, kind additive, approved_by null,
        approval block naming DEC-20261002-ff2bd5, precedence over version 1
        limited to the fields it names. refused_predecessor is
        AMD-20261002-1303c4 at amendment-v2.yaml with sha256 a736f483...134e,
        which equals the file on disk. amendment-v2.yaml is untouched (hash
        equals the TASK-20261002-f0f7e0 value). R-AMD-PATH-2 is complied with.
      field_by_field: >-
        Against specification.yaml version 1. (1) changes.A1.supersedes
        inputs.instruments.I_indep as to the algorithm on 44 named Band-L
        groups: A1. (2) A1.substitute_route (S-BERL definition,
        why_independent_of_I_direct): A1, required by R-AMEND-SCOPE. (3)
        A1.infeasibility_argument and
        where_derivation_A_runs_and_is_calibrated_by_C1_before_Band_H: A1,
        required content. (4) A1.consequence_for_S1 and
        consequence_for_M1_to_M9: consequence statements R-AMEND-SCOPE
        requires; no metric definition changes, and M4's slack is already "if
        I_indep exposes it". (5) A1.consequence_for_the_headline: a consequence
        statement DR-8 requires; classification below. (6)
        changes.A1-C1.supersedes stages.stage_1.requirement and C2 to C4,
        applied per route: A1-consequential tightening, labelled so, as
        DEC-20261002-6e68d8 R-AMD classifies it. (7)
        A1-C1.consequence_for_the_pre_Band_H_calibration_per_depth and
        calibration_statement: DR-8 consequence statements. (8)
        pre_data_assessment, scope_check, affected_runs, unaffected_runs,
        confirmatory_status: statements, not field changes. No change touches
        preregistered_prediction, falsification_criterion, the M1 to M9
        definitions, certificate_semantics, the candidate set, the cells,
        seeds, claim_tier, the field model or any tolerance. There is no A2, no
        A3 and no tightening of blind_from, stopping rules or invalidation
        rules beyond A1-C1. The C6 count does not appear in the amendment.
        TQR-2 is not fired in this reading.
      necessity: >-
        R-ROUTE-RULE applied to the design's rates leaves 44 Band-L groups
        infeasible: 40 by (M) and 4 by (T) only. This agrees with the replay
        except that the replay's primary fit adds (10, 4), which the amendment
        leaves on derivation (A). The amendment is necessary on at least the
        2652 rows it changes. Its necessity on (11, 5) rests on the classical
        gcd's 14.6-fold extrapolation and on excluding a sub-quadratic gcd
        (objection O-RT-6).
      per_depth: >-
        Stated for q + 1 = 2 (n' = 66; Stage-1 (11, 6) and (13, 7), toy n), 3
        (n' = 44; Stage-1 (7, 3), C2 to C4, toy n), 4 (n' = 33; NONE) and 6 and
        above. The depth with no exact declared reference is q + 1 = 4
        (stage4-bandH-n33), as round-1 O-5 found. Correct.
      headline_binding: >-
        Present but NOT byte-bound. Parsed from the specification's folded
        scalar, the frozen headline sentence reads "... agreed on Band L (n'' =
        3..14) and bridge n'' = 22; ...", with two apostrophes, because '' is
        literal inside a block scalar. The amendment quotes it with one
        apostrophe, truncates it with "; ...", and anchors the qualifier
        "immediately after 'agreed on Band L (n' = 3..14)'", a string that does
        not occur in the frozen sentence (checked by script). AC-30 (i) as
        worded ("quotes ... byte-identically") would fail on the amendment
        itself. The DR-8 binding is therefore ambiguous to a mechanical reader
        (objection O-RT-7).
      headline_classification: >-
        On PD-13, the producer's own disclosure, the qualifier as worded ("any
        headline written from it carries this qualifier ... A headline without
        the qualifier ... is not the honest headline of version 2") prescribes
        new headline text. The success_criterion field fixes that text, and
        R-AMEND-SCOPE forbids changing the success_criterion. Read as a
        definition of what "I_indep" denotes in the frozen sentence's Band-L
        clause under version 2, it is a consequence statement inside scope.
        DR-8 asks for that and R-AMEND-SCOPE requires consequence statements.
        Recommendation: reword it as a definitional reading of the unedited
        sentence, anchored byte-exactly. The composer rules.
      labels: The dual-route requirement is labelled an A1-consequential tightening (A1-C1). Round-1 O-7 is answered.

    v_dr9:
      reading_a: >-
        An A1 change. Derivation (A) as H-QSP-cd0c90 and IDEA-20260916-3f7a1c
        state it assumes lambda in F_2[X]. The proposal's own assumptions say
        so, and its K-coefficient generalisation sits in IDEA-20260916-5c9d6e.
        A-TWIST is therefore a different derivation, with internal provenance
        only. If C5 is a calibration cell (it calibrates the instrument against
        artifacts), a non-(A) route there is "an A1 change" under
        R-ROUTE-RULE's last sentence, and putting it in A1 would route it
        through the composer's approval with its synthetic-only calibration
        stated.
      reading_b: >-
        A reading of C5's own text. C5 directs "100 random K-coefficient lambda
        ... a Band-H spot at n' = 33 (I_indep only)", so the frozen
        specification itself requires I_indep on K-coefficient lambda there.
        The specification's source proposal (IDEA-20260916-3f7a1c, minimal_test
        Stage 4, read here) names exactly this arm: "null object (100 random
        lambda in F_{2^131}[X] at d = 3 and d = 7, n' = 33) with the twisted H
        of IDEA-20260916-5c9d6e". Its (A) statement lists "Transfer: to
        K-coefficients with twists". C5 is "not load-bearing for replication",
        and the design's route line classifies it as a control, not as census
        or calibration.
      what_the_text_supports: >-
        Reading (b). Reading (a) defeats itself under R-ROUTE-RULE. A1 admits a
        route "only where derivation (A) is shown infeasible", and at C5K-np33
        B <= 2401, so (M) and (T) both find derivation (A) feasible. The A1
        clause reading (a) calls for could never be admitted, and the frozen
        specification's own K-coefficient arm would become unexecutable. The
        infeasibility A1 speaks of is cost, not inapplicability. Reading (b)
        costs only a disclosure, which the design makes (limitations
        A-TWIST-CAL; AC-20 on syn-t cells).
      recommendation: >-
        Reading (b), with two conditions for the composer's record. First,
        A-TWIST's correctness rests on internal derivations (WO-I-5, restated
        from IDEA-20260916-5c9d6e via the refused design) and on synthetic
        brute-force checks only, so its C5K-np33 output is a model check, as C5
        already is. Second, the amendment's A1 block should not appear to
        decide the point: its controls_unchanged sentence lists C5K-np33 as
        A-TWIST under A1's heading. A note that it states version 1's reading
        would suffice. The composer rules.

    vi_other_items:
      r_c6_diag: >-
        HOLDS. WO-R-12 computes c6_exact_count_diagnostic under
        result.diagnostics, flags disagreement, fires no stopping rule and
        changes no exit code. WO-R-9 repeats this and AC-27 tests it with a
        mutation. The amendment does not mention it. It is not a criterion.
      dr_11_and_ci_1: >-
        HOLDS. WO-I-1 lists the minimum read set: the I_indep card, AGENTS.md,
        agents/executor.md, the specification, H-QSP-cd0c90,
        IDEA-20260916-3f7a1c, the revision design, DEC-20261002-ff2bd5 and the
        approved amendment. It lies inside TASK-20261002-38ffea's read_scope
        (card read here). That read_scope names no blind_from path and no bound
        closure file. EI-3 and the read_scope_note bar implementation/*.py,
        r1/runner and every round-1 file, and AC-16 checks both the minimum set
        and the maximum. Note: the read_scope includes dispatch_queue.json and
        DEC-20261002-6e68d8, which describe but do not contain the bound
        closure.
      ci_3: HOLDS. WO-I-3 makes the route a name-keyed literal with no comparison or arithmetic on n, n', q, r, s, d, B or deg L; AC-6 and AC-29 check it.
      ci_4_and_d_3_indep_half: HOLDS. WO-I-7 and WO-I-8 raise RootSearchFailure and InvariantViolation, define N = len(roots), and allow no swallowing except clause; AC-5 uses fault injection plus an AST scan.
      d_4: >-
        HOLDS in structure. One A-DENSE callable (WO-I-11, AC-8), and both
        census routes on every Stage-1 cell and on C2 to C4 (A1-C1, AC-8).
        Qualified by PTM-RD5: AC-7 as worded cannot certify a WO-I-4-conformant
        A-DENSE.
      d_5_and_stage_1_coverage: >-
        HOLDS. The trial graph is stage0, then stage1, then stage5-controls,
        then the twelve Band-L trials and the bridge, then Band H (depending on
        every stage-2 trial and the bridge), then COMPARE. Fixture STOPs
        therefore precede census work as stopping_rules[1] requires, and Band H
        waits on every Band-L and bridge cell as stopping_rules[2] requires.
        AC-9 has a mutation. C5F-np33 computes I_indep on Band-H census lambda
        before Stage 4, but opens nothing sealed (c5_note).
      cc_4_work_order: HOLDS. WO-I-1 binds the I_indep author to read nothing in blind_from, and WO-R-11 and WO-R-22 implement M9.
      engine_declaration_dr_5: >-
        HOLDS with objections. E-NP (numpy 2.4.6, version recorded) and E-DEC
        (libmpdec 2.5.1) are declared, as DR-5 asks. I_direct may use neither
        engine and writes its own CPython-integer arithmetic and classical gcd.
        The shared classical Euclid algorithm is named and addressed. E-INT is
        excluded on dominance, not on a specification sentence (PD-1); the
        dominance claim is measured in ii. NATIVE is excluded on plan-binding
        grounds. The specification's may_read admits gf2rc.c as a generic
        helper and required_artifacts admits reused generic helpers with
        provenance, so this exclusion also rests on mechanics more than on a
        specification sentence. gcc and clang are present on this host. The
        design's "specification reason" for the classical gcd cites the clause
        "Optional single-candidate half-gcd spot check at n' = 33 is OUT OF
        SCOPE for v1". That clause concerns an optional direct check at Band H,
        not I_indep's gcd engine (objection O-RT-6). DR-5's own words
        ("classical-gcd seconds") independently sanction the classical gcd.

    round_1_artifacts: >-
      Each round-1 JD2 breaking artifact or objection against the revision. O-1
      ((12, 5), (13, 5) should be (A)): caught; both are A-DENSE at 9.94 days.
      O-2 (engine set): caught; numpy and decimal are declared and E-INT is
      excluded on measured dominance (ii). O-3 (D3b, D3c admitted; text rule
      contradicted by Q): caught for D3b and D3c (140 of 140 rejected) and for
      the text rule (S-BERL satisfies it). O-4 (A-TWIST): argued both ways (v).
      O-5 (per depth): caught. O-6 (headline binding): present but not
      byte-bound (iv). O-7 (tightening label): caught. O-8 (C6 exact count):
      admitted as a non-blocking diagnostic only, per R-C6-DIAG. O-9 (minimum
      read set): caught. Round-1 rates for comparison: classical gcd 165.2 s at
      2^22 and 1996.6 s at 2^24, and a numpy Barrett squaring of 50.44 s at
      5^11 (round-1 computations.json key_figures_relied_on). The design's are
      139.5 s, 1865.7 s and 85.96 s. The squaring differs by a factor of 1.7
      between two honest numpy implementations, inside the factor 3.

  ptm_rd3:
    object: R-ROUTE-RULE as the revision applies it, on stage3-bridge-n22 d = 3 and stage4-bandH-n66 d = 7
    performed: >-
      Yes, statically and through the revision's own code. route_line_code's
      evaluate() and route_for() were applied to the route_quantities_code
      rows. For the bridge, n' = 22, d = 3: q = 5, r = 21, B = 729 (3^6), fails
      none, T_A 1.28e-6 days, route A-DENSE. For Band H, n' = 66, d = 7: q = 1,
      r = 65, B = 49 (7^2), fails none, T_A 9.10e-7 days, route A-DENSE.
      route_table.route_map and AMD-20261002-09957b A1
      (unchanged_derivation_A_census_rows: the bridge and all of Band H) agree.
      The own replay agrees.
    signature: MET (both cells route to derivation (A) in the table, the code and the amendment)

  ptm_rd4:
    object: the six disguises D3a to D3f on synthetic cells, through AC-7 on WO-I-10's trace schema as worded
    performed: yes (iii above; ptm_rd45_deg34.json, ptm_rd45_patched3_deg34.json, ptm_rd45_patched3_deg25.json, design_demo_extra_cells_out.jsonl)
    signature_for_the_six: >-
      MET. All six are rejected on every synthetic row tested, 242 distinct
      (cell, lambda) rows by both audits. The design's own demo, run on five
      further cells ((8, 3), (14, 5), (17, 4), (16, 3), (18, 5)), also rejects
      all six on every row.
    beyond_the_six: >-
      NOT MET for the class. Five trace-visible constructions that the plan did
      not name return I_direct's quantity and are admitted
      (iii.unnamed_disguises). Two static-rule bypasses pass as well: D3i off
      the trace and D3t, which is trace-aware (O-RT-8). The card asks whether
      the check rejects every disguise "including those round 1 did not try".
      It does not.

  ptm_rd5:
    object: S-BERL and A-DENSE as the revision defines them, on the PTM-RD4 cells
    performed: yes
    signature: NOT MET
    detail: >-
      S-BERL: no false flag on any row. A-DENSE as the design's reference
      writes it (G not split; kroots by enumeration on G): flagged R2 on 2 of
      20 rows of (8, 3), lambda = 0x8 and 0xe. In both, the operand R + X
      (X^(2^8) + X mod H) equals rad(L) by value (0x42 and 0x56), so the
      value-based L-class test treats it as L-class. The design's demo code,
      unchanged, reports met false for its A-DENSE on that cell
      (design_demo_extra_cells_out.jsonl). A-DENSE with step (6) implemented as
      WO-I-4 requires it fails more often. Berlekamp's method on G (the
      splitter r1/indep already carries for S-BERL) is flagged on 88 of 140
      rows: R4, because a Q - I over a modulus that is not L-class is not "Q -
      I", plus R2 on the two (8, 3) rows. Distinct-degree plus equal-degree
      factorisation is flagged on 14 of 140 rows (R2, and R1 or R3 at (8, 3)).
      On the six cells itemised, these are exactly the 10 rows where G equals
      rad(L) by value, and they include syn-a-10-03 lambda = 0xa, 0xd, 0x1a and
      0x1c of the plan's own trace-audit cells. Berlekamp-split fails where G
      != rad(L) and DDF-split fails where G = rad(L). No standard split method
      passes every AC-7 row, so the A-DENSE that passes is the one that skips
      the step the work order requires. This is the known-truth failure the
      plan names: the check would make A-DENSE uncertifiable.

  objections:
    - id: O-RT-1
      severity: breaks_joint
      attack: (iii) PTM-RD5
      statement: >-
        The value-based L-class test flags legitimate A-DENSE whenever one of
        its own operands equals rad(L) or L by value. The design's R-C8 code,
        unchanged, flags its own A-DENSE on (8, 3) for lambda = X^3 and X^3 +
        X^2 + X: R + X = X^(2^8) + X mod H equals rad(L) (0x42 and 0x56), so
        gcd(H, R + X) fires R2. R-C8 passed only because its three cells avoid
        this coincidence.
      evidence: harness/design_demo_extra_cells.py and design_demo_extra_cells_out.jsonl; ptm_rd45_deg34.json (computations.json)
      cheapest_fix: >-
        Exempt tokens of H provenance from the value test: H itself (the exact
        shift(one, 2^s) + lambda^(o(q+1)) construction for the cell), its gcd
        and div_exact descendants, and residues modulo them. Apply the value
        test only to tokens outside those classes. Then re-run R-C8 on at least
        the cells of this report, including (8, 3).
    - id: O-RT-2
      severity: breaks_joint
      attack: (iii) PTM-RD5
      statement: >-
        WO-I-4 step (6) requires splitting G over F_2, and AC-7 rejects both
        standard ways of doing it. Berlekamp's split of G fails R4 on every row
        with deg G >= 2 and G != rad(L) (88 of 140), because "Q - I" is defined
        only over L-class moduli. Distinct-degree and equal-degree
        factorisation fails R2 (and R1 or R3) on every itemised row where G
        equals rad(L) by value (14 of 140), including four rows of the R-C8
        cell syn-a-10-03. The reference A-DENSE passes only by enumerating K on
        an unsplit G, which WO-I-7's root search does not do and which does not
        scale to n = 131.
      evidence: ptm_rd45_deg34.json and ptm_rd45_patched3_deg34.json (A-DENSE-BERL, A-DENSE-DDF rows)
      cheapest_fix: >-
        Admit Q - I over H-descendant moduli in R4. With O-RT-1's exemption,
        this lets both split methods pass. Make the reference A-DENSE perform
        step (6) by each method, so that PTM-RD5 tests the route the work order
        defines.
    - id: O-RT-3
      severity: breaks_joint
      attack: (iii), disguises beyond the six
      statement: >-
        Multiples of L launder provenance. Reducing modulo M = L*U, or modulo
        U*L rebuilt from lambda, and then taking gcd(M, U (t + X)) gives
        I_direct's count, and no rule fires (D3g on 137 of 140 rows, D3g2 on
        140 of 140). The same holds for gcd(H, U*L) followed by I_direct's
        squarings modulo the result (D3e2, 124 of 140). R1 to R3 trigger only
        on an L-class modulus or gcd input, and a multiple of L with a
        non-L-class factor is not L-class.
      evidence: harness/rt_new_routes.py (d3g, d3g2, d3e2); ptm_rd45_patched3_deg34.json, ptm_rd45_patched3_deg25.json
      cheapest_fix: >-
        Replace the blacklist with a whitelist. A reduction is allowed only
        modulo an H-class token, an H-descendant or an L-class token (and
        X-power residues modulo L-class keep R1's bound). gcd partners are
        whitelisted per class. Outside H provenance, a token whose value is a
        nonzero multiple of rad(L) counts as L-class for R1 to R3. Add D3g,
        D3g2 and D3e2 to AC-7's named mutations.
    - id: O-RT-4
      severity: breaks_joint
      attack: (iii), provenance through re-wrapping
      statement: >-
        interface.primitive_layer makes TPoly's slots public (value, token) and
        does not reserve its constructor to gf2x. A route can therefore compute
        off-trace on t.value and re-attach any existing token, such as a KERNEL
        token, which R2 and R3 exempt (D3k, 140 of 140 admitted). No rule
        constrains kroots, so kroots(L) returns the K-roots of L directly (D3h,
        140 of 140). Both pass S1 to S4 as worded.
      evidence: harness/rt_new_routes.py (d3k, d3h), harness/rt_static.py output
      cheapest_fix: >-
        Make the slots private (_value, _token), so that S3 forbids access.
        Keep a registry in gf2x that refuses any handle it did not issue (R7).
        Add R6: kroots only on an irreducible split factor of degree dividing
        n, produced by a split step. Add D3h and D3k to AC-7's named mutations.
    - id: O-RT-5
      severity: material (marginal row; not a break under the plan's band rule)
      attack: (i)
      statement: >-
        The route of stage2-bandL-n10/d4 (12 rows) turns on the above-ladder
        gcd exponent: 1.9826 gives 88.43 days (A-DENSE) and 2.0 gives 91.56
        days (S-BERL), with t_gcd extrapolated 16-fold beyond the last measured
        degree. route_table.application_fixed_in_advance says the fit was fixed
        before any rate existed. The design file has a single commit, and
        procedure.interim_hand_backs says route_line_code was written after the
        relays, so the committed record cannot show that order.
      evidence: rule_replay_out.json (route_variants), routemap_check_out.json (route_flips_if_gcd_exponent_2)
      cheapest_fix: >-
        Have the session produce the bytes or digest of hand-back 1 showing
        application rule (1) before relay-r1-bench.txt. Otherwise record (10,
        4) as disputed (it is marginal) and measure the classical gcd above
        2^24 (RC-3), so that the row stops resting on a 16-fold extrapolation.
    - id: O-RT-6
      severity: material (scope of the route line)
      attack: (ii), engine set
      statement: >-
        Both marginal rows are gcd-dominated: the classical gcd is about 68
        percent of T_A at (11, 5) and about 71 percent at (10, 4). The design's
        "specification reason" for the classical gcd cites the clause that puts
        an optional single-candidate half-gcd spot check at n' = 33 out of
        scope for v1. That clause concerns a direct Band-H check, not I_indep's
        gcd. DR-5's own words ("classical-gcd seconds") are the real sanction.
        The route of (11, 5) (32 rows) holds only while a sub-quadratic gcd is
        excluded: a gcd 5.8 times faster than the extrapolated classical one at
        5^12 moves it to derivation (A).
      evidence: rule_replay_out.json; remeasure_line_out.json
      cheapest_fix: >-
        Cite DR-5 instead of the half-gcd clause. In engine_declaration and the
        amendment's infeasibility_argument, state that the substitution of (11,
        5), and the margin of (10, 4), are conditional on excluding a
        sub-quadratic gcd. Carry it as a limitation, beside NATIVE-EXPOSURE.
    - id: O-RT-7
      severity: precision (DR-8 binding; AC-30 (i) fails as worded)
      attack: (iv)
      statement: >-
        The amendment anchors the A1 qualifier at "agreed on Band L (n' =
        3..14)". The frozen headline sentence, parsed from the specification's
        folded scalar, reads "(n'' = 3..14)" with two apostrophes. The quote is
        also truncated, so it is not byte-identical, and AC-30 (i) as worded
        fails on the amendment itself.
      evidence: computations.json headline_check
      cheapest_fix: >-
        Quote the parsed sentence exactly and anchor on bytes it contains.
        Reword the qualifier as a definitional reading of the unedited sentence
        rather than as an insertion (PD-13).
    - id: O-RT-8
      severity: material (AC-7's stated limit overclaims)
      attack: (iii), static rules
      statement: >-
        AC-7's limit says S2 and S3 "close the bypasses this design can name".
        Two bypasses pass S1 to S4 as worded. D3i runs I_direct off the trace
        with + and % on coefficient lists: lambda arrives as an int, and
        decimal is importable in every r1/indep module. D3t branches on the
        trace flag or the syn- prefix and behaves legitimately only when
        traced. The trace audit runs only on traced syn- calls, and WO-I-11's
        no-branch rule covers A-DENSE only and not the trace flag.
      evidence: harness/rt_new_routes.py (d3i, d3t); harness/rt_static.py; d3t_demo_out.json
      cheapest_fix: >-
        State the audit's ceiling: it constrains primitive-layer computation on
        traced calls only. Make tracing invisible to routes (the primitive
        object always records). Pass lambda only as a TPoly. Restrict decimal
        to engines.py. Extend WO-I-11 and AC-8's no-branch AST rule to every
        route function and to the trace flag and the cell name. Make JRI2's
        code reading an explicit certification item for off-primitive
        arithmetic in route modules.
    - id: O-RT-9
      severity: minor (cost model)
      attack: (ii)
      statement: >-
        T_A omits WO-I-14's mandatory runtime verification of every squaring
        (four big_mod reductions modulo a degree-89 p). The design's own
        benchmark records it as verify_seconds. Re-measured with the design
        block on this host, it is 13.268 s at 5^12, 3.575 s at 6^10 and 7.559 s
        at 3^17, which is 1.0, 3.5 and 2.0 percent of one squaring. At (10, 4)
        this adds about 0.25 days to 88.43, giving about 88.7. No route moves,
        but it narrows the marginal row's margin.
      cheapest_fix: Include it in t_sq, or disclose it beside the composition and factorisation exclusions.
    - id: O-RT-10
      severity: minor (amendment text)
      attack: (iv)
      statement: >-
        A1.why_independent_of_I_direct says R0 to R4 "make this rule
        mechanical" and cites R-C8. In view of O-RT-1 to O-RT-4 the sentence
        overstates what the check certifies.
      cheapest_fix: Restate the sentence once the audit is repaired, citing the extended demonstration.
    - id: O-RT-11
      severity: observation (route-neutral)
      attack: (ii), memory
      statement: >-
        Linear extrapolation of E-NP's VmPeak per degree (rho = 122.87 bits) is
        conservative above 2^25. The FFT block buffers are capped at 2^25
        coefficients, and the relayed VmPeak grows by about 4.6 bytes per
        coefficient between 3^17 and 2^28. Groups with B in (5.6e8, about
        1.2e9], (9, 4) and (7, 3), may in fact fit in 8 GiB. They fail (T) at
        more than 800 days in any case, so no route changes.
      cheapest_fix: Record the conservatism; no route action.
    - id: O-RT-12
      severity: minor (engine separation has no check)
      attack: (vi) DR-5
      statement: >-
        engine_declaration.i_direct_engine and WO-R-1 say I_direct and
        kfield.py import neither numpy nor decimal. No acceptance check tests
        this: AC-24 covers reachability of r1/indep only, and AC-7 audits
        I_indep only. The statement that I_direct may not use E-NP or E-DEC is
        therefore prose without a check that can fail.
      cheapest_fix: >-
        Add to AC-24 (audit_indep.py's import graph) the rule that i_direct.py
        and kfield.py reach no numpy and no decimal import, with the mutation
        "import numpy in i_direct.py".

  required_controls:
    - >-
      RC-1. Re-run R-C8 on at least eight synthetic cells, including (n, n') =
      (8, 3), with A-DENSE performing WO-I-4 step (6) by Berlekamp and by DDF
      plus EDF. PTM-RD5 must pass on every row under both audit
      implementations.
    - >-
      RC-2. Extend AC-7's named mutations with D3g, D3g2, D3e2, D3h and D3k, as
      defined in harness/rt_new_routes.py. Each must fail on every row. Record
      D3i and D3t as static and code-reading items with their own AST
      mutations.
    - >-
      RC-3. A classical-gcd measurement above 2^24 under a watchdog long enough
      for it. Alternatively, a step-rate measurement of a partial Euclid run at
      2^26 to 2^28, inside 3600 s, with the fit labelled. Then (10, 4) and (11,
      5) no longer rest on 16-fold and 14.6-fold extrapolations.
    - >-
      RC-4. Run AC-30 (i) against the amendment as committed (it fails today),
      then against the corrected anchor.
    - RC-5. Include WO-I-14 verification time in the per-trial projections and claim-TTL guidance, or disclose its size.

  counterexample_or_mutation: >-
    The cheapest discriminating mutation for the independence check is D3g2.
    Build U = X^2 + X + 1 from the lifts and M = shift(U, 2^n') + mul(lambda,
    U), which is U*L by value with no L token. Set t = mod(X, M), apply n times
    t = sqrmod(t, M), and return deg gcd(M, mul(add(t, X), U)) - 2. It returns
    I_direct's count on every synthetic row tested, and the as-worded rules R0
    to R4 pass it on 242 of 242 rows. The cheapest one for the other direction
    is a single row: the design's own demo code on (n, n') = (8, 3), lambda =
    X^3, where its legitimate A-DENSE is flagged R2.

  baseline_comparison: >-
    No ECDLP cost claim is under review: no group, discrete log or speedup is
    claimed, so Pollard rho and BSGS comparisons do not apply. dominated_by is
    not applicable (no algorithmic deliverable) and sota_delta is none. The
    relevant baselines are internal. (1) For the route line: derivation (A) on
    the declared engines against round-1 JD2's independent implementation and
    this reviewer's re-measurement (ii). The two numpy Barrett implementations
    differ by a factor of 1.7 at 5^11. The classical gcd agrees within 15
    percent between round 1 and the design, and this host is 2.5 to 33 percent
    slower again. (2) For independence: the closest baseline is I_direct
    itself. Every admitted disguise computes I_direct's quantity by I_direct's
    own mechanism (X^(2^n) modulo L, a multiple or a divisor of it, then a gcd;
    or the root search of L itself), so the check has to separate algorithms,
    not costs, and the trace-visible ones are separable by a whitelist (the
    candidate remedy).

  heuristic_challenges:
    - >-
      Not a heuristic-conditional claim in the exemplar's sense. HEUR-1 is the
      specification's null prior and is not load-bearing for the route line or
      the independence check. The model assumptions that are load-bearing are
      the rule's extrapolations. t_gcd above 2^24 is taken proportional to B^e,
      with e = 1.9826 (design) or 2 (theory), for 16-fold and 14.6-fold
      extrapolations. t_sq above 2^28 is taken proportional to B. Memory is
      taken as rho times B. Cheapest test of each: one gcd above 2^24 (RC-3),
      one squaring at 6^11 (route-neutral), and a VmPeak probe at 2^29
      (route-neutral, O-RT-11).
    - >-
      Random dense operands as a timing proxy for H. FFT, decimal and Barrett
      costs do not depend on the data. The classical gcd's step count does
      depend weakly on operand structure: measured steps are 0.54 B to 0.65 B
      on random pairs, and H and R + X are dense of degree B. No systematic
      deviation is expected, and none was tested on structured operands. Doing
      so would mean building H on a cell, which is out of bounds here.

  cost_model_challenges:
    - O-RT-6 (gcd-dominated marginal rows; the sub-quadratic gcd exclusion is DR-5's, not the specification's)
    - O-RT-9 (WO-I-14 verification omitted from T_A)
    - >-
      E-NP is block-quadratic above 2^25: with blocks of at most 2^25
      coefficients, a 2^28 product takes 8 x 8 = 64 block FFT products. The
      block size is an engine parameter the design fixes without measuring an
      alternative. It moves only the squaring share of the marginal rows:
      halving t_sq leaves (11, 5) at about 172 days, still S-BERL, and moves
      (10, 4) further into derivation (A).
    - >-
      Host dependence. The design's relays come from fc-v51 and this reviewer's
      from fc-v80. The rates are host properties, and the factor-3 allowance in
      R-ROUTE-RULE and the blind tolerance are what absorb the difference.
      Measured ratios, this host over the design: classical gcd 1.334, 1.191
      and 1.025 at 2^22, 2^23 and 2^24; E-NP squaring 0.989 to 1.181; E-NP
      product 1.119; E-DEC squaring 1.357.
    - O-RT-11 (memory extrapolation conservative; route-neutral)

  reduction_and_scope_challenges:
    - >-
      A1.why_independent_of_I_direct is right about S-BERL's algorithm. It
      overstates the mechanical guarantee (O-RT-10). The agreement M1 = 0 on
      the 2652 changed rows would be agreement of two algorithms on the same L,
      sharing the classical Euclid algorithm class but no code. That is the
      independence the specification asks for, provided the check that
      certifies it is repaired.
    - >-
      Scope of the route line. It is a property of this host class, CPython
      3.11.15, numpy 2.4.6, libmpdec 2.5.1, the classical gcd and E-NP's
      2^25-block design. It is not a property of derivation (A). The
      amendment's infeasibility_argument should say that the (T)-only
      substitutions, (11, 5), (12, 6), (13, 6) and (14, 7), are
      engine-relative. The 40 (M) substitutions also fail (T) at every engine
      measured here, so they do not depend on the engine choice.

  proof_architecture_challenges:
    - >-
      Observation-fiber attack on AC-7. Holding the audit's observation fixed
      (no L-class modulus, no L-class gcd input, no matrix application), D3g2
      and a legitimate A-DENSE-plus-S-BERL trace sit in the same fiber, one on
      each side of the independence conclusion. The missing separator is the
      provenance of moduli and gcd partners (a whitelist), not L-class
      membership.
    - >-
      Quantifier-order attack on the route line. The extrapolation rule was
      chosen by the party that drew the line, and the committed record cannot
      show it was chosen before the rates. The only row it moves is marginal
      (O-RT-5).
    - >-
      Nearby-object attack on PTM-RD5. The same legitimate A-DENSE on a
      neighbouring synthetic cell, (8, 3) instead of the R-C8 cells, is
      flagged. The value-based L-class predicate depends on value coincidences,
      not on the route. The separator is H provenance (O-RT-1).
    - >-
      Method-ceiling attack on the trace audit. A trace audit can constrain
      only traced primitive calls. D3i (off-trace) and D3t (trace-aware) are
      outside its ceiling by construction, so AC-7 cannot carry the
      independence claim alone, whatever its rules (O-RT-8). This bounds the
      claim and does not make it false: static narrowing plus JRI2's code
      reading are the backstop the design already names.

  narrowest_supported_statement: >-
    On the committed bytes of TASK-20261002-9831c4, the revision's route line
    is DEC-20261002-c01bb7 R-ROUTE-RULE applied to its own relayed R-C5 and
    R-C6 rates with a labelled top-segment gcd fit, and it is reproducible from
    route_line_code. An exponent-2 fit changes only the marginal row
    stage2-bandL-n10/d4. Bridge and Band H are on derivation (A) (PTM-RD3 met).
    On synthetic cells with n in {8, 9, 10, 14, 15, 16, 17, 18}, AC-7 as worded
    in WO-I-10 rejects the six named disguises on every row. It admits five
    other trace-visible constructions of I_direct's quantity (D3g, D3g2, D3e2,
    D3h, D3k), and two static-rule bypasses (D3i off the trace, D3t
    trace-aware) pass S1 to S4. It flags legitimate A-DENSE: the design's own
    reference at (8, 3), and WO-I-4-conformant splits widely. A whitelist-style
    remedy tested here closes the trace-visible gaps on those cells.
    AMD-20261002-09957b is inside R-AMEND-SCOPE in kind, at R-AMD-PATH-2's path
    and id, with its headline anchor not byte-identical to the frozen sentence.
    Nothing here bears on N_K(L) on any declared cell, H-QSP-cd0c90,
    EV-QSP-a6aa4b or any curve.

  next_concrete_action: >-
    For DEC-20261002-ff2bd5 (composer), under K-design-revise, a recommendation
    and not a ruling. Name as the first next action one producer revision
    confined to WO-I-10, AC-7 and interface.primitive_layer, plus the
    amendment's headline anchor (O-RT-1 to O-RT-4, O-RT-7, O-RT-8). It should
    carry R-C8 re-run on the extended cell and disguise set (RC-1, RC-2) and
    the gcd measurement of RC-3. DR-7 broke again in its class, so the remedy
    is structural in kind (whitelist and handle registry instead of an L-class
    blacklist) but local in place. The candidate remedy here shows a check that
    rejects every trace-visible disguise tried and passes S-BERL and DDF-split
    A-DENSE on every tested row. That is evidence against K-new-record (b), not
    a proof of the remedy's completeness.

  scope_limits:
    - >-
      Synthetic cells only: n in {8, 9, 10, 14, 15, 16, 17, 18}, n' in {3, 4,
      5}, lambda of exact degree 2 to 5, F_2 coefficients. A-TWIST was not
      exercised. No instrument ran on a declared cell.
    - >-
      The candidate remedy (harness/rt_patched.py) was tested only against the
      disguises built here and still leaves 3 false flags on Berlekamp-split
      A-DENSE. It is offered as evidence that a local remedy exists in
      principle, not as a specification.
    - >-
      Timings come from one host, fc-v80, with 4 CPUs shared with other
      sessions (loadavg recorded per item). They come from a single sample per
      item and seed 20261008. Contention can only lengthen a time. The 2^28
      modular squaring was not re-measured (watchdog risk); np mul at 2^28 and
      np sqrmod at 5^12 stand in, labelled. E-INT was measured at 2^20 and 2^22
      only. NATIVE, a sub-quadratic gcd and the gcd above 2^24 were not
      measured.
    - >-
      Bound-formula arithmetic (q, r, s, B, G) and timing arithmetic were done
      for declared census and calibration rows, as attack (i) directs. No N,
      root, gcd, H polynomial, composite iterate or decision statistic was
      computed on any declared cell.
    - No statement here concerns any integer N_K(L), any run of EXP-QSP-70b731 or EXP-QSP-33b442, H-QSP-cd0c90's standing or EV-QSP-a6aa4b.

