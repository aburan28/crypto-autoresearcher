  # ---------------------------------------------------------------------------
  composer_rulings:
    - id: CW-R1
      subject: JRD1 referral R-1 (SO-1 and SO-2 under attack (ii)'s breaking sentences)
      ruling: >-
        SO-2 IS A BREAK; SO-1 IS NOT. The plan's breaking artifact is "a
        blind_from-equivalent path form that is not a hit" and its attack
        list counts a filesystem alias, "a symlinked parent", as a path form.
        A hard link to a blind_from file is the same file under another
        canonical name; the reference canonicaliser returns
        blind_from_respected TRUE on it (C04 al1). An honest executor who
        opens such a path and declares exactly what it opened passes M9. The
        "same power as omission" argument does not remove it from the
        sentence, and applying the sentence as written is not a widening
        (CR-8). SO-1 is a document-layer construct: the loader resolves
        duplicate keys before any entry is evaluated, the evaluated entry is
        canonical and is not a hit, and neither sentence names a document
        form. It stays a surviving objection whose repair is mandatory in any
        successor. Consequence: JRD1 breaks narrowly at DR-3/D-6; the remedy
        is local (an inode identity test in the production oracle and a
        duplicate-key-rejecting loader), with a stated ceiling that a
        declaration check cannot see content copies.
    - id: CW-R2
      subject: PD-13 and JRD2 iv headline classification
      ruling: >-
        INSIDE R-AMEND-SCOPE AS A CONSEQUENCE STATEMENT; DEFECTIVE IN ITS
        ANCHOR. DR-8 and the plan's JRD2 claim require the A1 qualifier to be
        bound to the frozen headline sentence, so a qualifier is in scope by
        construction and TQR-2 does not fire. As committed it quotes the
        sentence with one apostrophe where the parsed specification has two,
        truncates it, and anchors on a string the sentence does not contain;
        AC-30 (i) as worded fails on the amendment itself (JRD2 O-RT-7). Any
        successor words it as a definitional reading of what I_indep denotes
        in the unedited sentence under version 2, anchored on bytes the
        parsed sentence contains.
    - id: CW-R3
      subject: JRD2 O-RT-5, the order of route_line_code's extrapolation rule
      ruling: >-
        RECORDED, NOT A KEY. route_table.application_fixed_in_advance says the
        rule was fixed before any rate existed; procedure.interim_hand_backs
        says route_line_code was written after the relays; the design file has
        one commit. The committed record cannot show the order. The only row
        the choice moves is the marginal (10, 4), which the plan lists as
        disputed. A successor fixes its extrapolation rule in a committed
        artifact before any rate is measured.
    - id: CW-R4
      subject: JRD2 O-RT-6, the classical gcd's specification reason
      ruling: >-
        The half-gcd clause the design cites concerns an optional Band-H
        direct check, not I_indep's gcd. DR-5's own words ("classical-gcd
        seconds") sanction the classical gcd. The substitution of (11, 5) and
        the margin of (10, 4) are conditional on excluding a sub-quadratic
        gcd; a successor carries that as a limitation beside NATIVE-EXPOSURE.

