  dr9_ruling:
    question: A-TWIST on C5K-np33 -- an A1 change (reading a) or a reading of C5's own text (reading b)
    inputs: design a_twist; JRD2 v_dr9 (both readings argued; recommends (b) with two conditions)
    ruling: >-
      READING (b). C5 itself directs 100 random K-coefficient lambda at a
      Band-H spot n' = 33 with I_indep only, so the frozen specification
      already requires I_indep on K-coefficient lambda there, and the
      specification's source proposal names the twisted H for exactly this
      arm. Reading (a) defeats itself: A1 admits a route only where
      derivation (A) is shown infeasible by R-ROUTE-RULE's (M) and (T), and at
      C5K-np33 B is at most 2401, so A1 could never admit a route there and
      the specification's own K-coefficient arm would become unexecutable.
      Inapplicability is not the infeasibility A1 speaks of.
    conditions:
      - >-
        C-DR9-1. A-TWIST's correctness rests on internal derivations and on
        synthetic brute-force checks only (A-TWIST-CAL). Its C5K-np33 output
        is a model check, as C5 already is, and any successor's independence
        certification must cover A-TWIST, which this round did not exercise
        (JRD2 scope_limits).
      - >-
        C-DR9-2. No amendment lists C5K-np33 under an A1 heading as if A1
        decided it. AMD-20261002-09957b's controls_unchanged sentence does;
        a successor amendment states that it records version 1's reading.
    amendment_agreement: >-
      Not applicable as a condition of approval (CR-14 binds only under
      K-design-accept); the amendment is not approved. The ruling agrees with
      the amendment's substance and requires C-DR9-2 of any successor.

