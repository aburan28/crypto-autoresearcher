        def provisional(run_dir, run_id):
            write_manifest(run_dir, body(run_id, "running", {
                "raw_result_pending": True, "certificate": {"kind": "none"},
                "validity_status": "incomplete", "validity_reason": "attempt in progress"}))


        def terminal_failed(run_dir, run_id, stop_code, error_class, rows_finished):
            """WO-R-20: raw-result.json first (error, stop code, finished-row count), then the manifest."""
            raw(run_dir, {"schema": "qsp70b731.r1.raw.v1", "status": "failed", "stop_code": stop_code,
                          "error": {"class": error_class, "message": "synthetic"},
                          "rows_finished": rows_finished, "rows_file_sha256": None, "f_codes": ["F6"]})
            write_manifest(run_dir, body(run_id, "failed", {
                "certificate": {"kind": "none"}, "valid": False, "validity_status": "incomplete",
                "validity_reason": "%s: %s" % (stop_code, error_class), "stop_code": stop_code,
                "raw_result": {"path": "raw-result.json"}}))


        def terminal_completed(run_dir, run_id, status="completed"):
            raw(run_dir, {"schema": "qsp70b731.r1.raw.v1", "status": "completed", "rows": []})
            write_manifest(run_dir, body(run_id, status, {
                "certificate": {"kind": "none"}, "valid": True, "validity_status": "valid",
