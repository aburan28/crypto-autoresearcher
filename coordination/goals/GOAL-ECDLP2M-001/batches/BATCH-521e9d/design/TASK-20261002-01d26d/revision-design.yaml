  engine_declaration:
    requirement: DR-5 and RP-4 (DEC-20261002-6e68d8 DR-5; DEC-20261002-c01bb7 R-RATES, R-ROUTE-RULE).
    i_indep_product_engine_set:
      - id: E-NP
        definition: >-
          numpy (version recorded per run; the R-C5 relay prints the host's)
          real FFT: operands as 0/1 coefficient arrays, split into blocks of at
          most 2^25 coefficients, each block product computed by numpy.fft.rfft
          and irfft at the smallest even 2,3,5-smooth length at least the block
          product length, in float64, rounded to the nearest integer; the largest
          absolute rounding error of every block product is recorded and must be
          below 0.25, else EngineExactnessError (an IndepError); the parities are
          accumulated by XOR. Exactly make_np of code_blocks.engine_bench_code.
      - id: E-DEC
        definition: >-
          The standard-library decimal module (libmpdec, version recorded):
          Kronecker substitution with k decimal digits per coefficient, k the
          number of decimal digits of the smaller operand length (so 10^k exceeds
          every coefficient sum), multiplication in a context with prec MAX_PREC
          that traps Inexact, Rounded, InvalidOperation, Overflow and
          DivisionByZero; parities read from the last digit of each k-digit slot.
          Exactly make_dec of code_blocks.engine_bench_code.
    modular_squaring: >-
      Shared by both engines and exactly as engine_bench_code: A^2 by bit
      spreading (linear, no product); Barrett reduction modulo the monic H of
      degree B with mu = X^(2B) div H computed once per modulus by Newton
      inversion of the reversed H (in characteristic 2, g <- f g^2 mod X^(2k));
      Q = ((A^2 div X^B) mu) div X^B; R = A^2 + Q H. In I_indep every squaring is
      verified at run time by the identity A^2 = Q H + R modulo a random
      irreducible p of degree 89 (WO-I-14).
    declared_gcd: >-
      The classical Euclidean algorithm on bit-packed CPython integers, reducing
      a modulo b by repeated a ^= b << (deg a - deg b): exactly gcd_classical of
      code_blocks.gcd_bench_code. Specification reason: the specification records
      the absence of a sub-quadratic GF(2)[X] engine as the program's state
      (I_direct text, citing DEC-20260917-793ae2 NA-6 item iii, not read here) and
      puts a half-gcd "OUT OF SCOPE for v1 (impediment-prone; would require a
      protocol amendment and machine pre-flight)"; DEC-20261002-6e68d8 DR-5 asks
      for "classical-gcd seconds".
    engine_per_row: >-
      For each derivation-(A) (cell, d) the route table carries, as data keyed by
      the cell name, the engine R-C7 found fastest at B among engines whose memory
      verdict is feasible; I_indep uses that engine for every product of that row
      (CI-3: data, never a computed threshold). Synthetic cells exercise both
      engines (WO-I-12).
    excluded_engines_inside_CI_5:
      - id: E-INT
        engine: CPython integer multiplication (Karatsuba) of Kronecker-spread operands
        reason: >-
          The specification makes derivation (A) the I_indep route on every
          census cell and admits a substitute only where it is shown infeasible
          (I_indep text; R-AMEND-SCOPE A1); R-ROUTE-RULE reads only the FASTEST
          engine of the declared set. The set must therefore contain the fastest
          admissible engines, and an engine slower than a declared engine at every
          boundary degree changes no T_A. E-INT is the engine of the refused
          design's model E, measured by round-1 JD2 at 6.1 to 6.6 times slower
          than model E's rate (attributed, red-team report O-2), while JD2 timed
          numpy FFT and decimal 12 to 49 times faster than model E at B = 5^11
          (attributed, cost_model_challenges). The reason is dominance, not a
          sentence of the specification (PD-1). It is falsifiable: an E-INT
          modular squaring faster than both declared engines at any boundary
          degree breaks the exclusion and the line is redrawn.
      - id: NATIVE
        engine: native code loaded through ctypes or a compiled extension (for example built from analysis/qsp-ecc2k130/explore/gf2rc.c)
        reason: >-
          The specification admits gf2rc.c only as a generic helper the I_indep
          author may READ with provenance stated (independence_declaration.may_read)
          and requires the implementation under experiments/EXP-QSP-70b731/implementation/
          with provenance (required_artifacts). A compiled object is a build
          product of a compiler neither the specification nor CI-5 declares (CI-5
          fixes the interpreter only), it is not bound by the plan's source_sha256
          (tools/experiment_execution.py load_plan binds sources by hash;
          runtime_lock is null), and R-RATES requires the timed engine to be the
          pinned design block. Disclosed exposure: a native carry-less product
          could move marginal rows toward derivation (A).
      - id: OTHER-THIRD-PARTY
        engine: gmpy2, python-flint, scipy, galois or any other third-party package
        reason: >-
          Not named by the specification or by DR-5, which admits numpy by name
          with its version recorded; each would add a dependency the plan does not
          bind. R-C5's header prints whether each is importable (find_spec, no
          import); an importable one is recorded as an unmeasured exposure.
      - id: DOMINATED-VARIANTS
        engine: numpy.convolve or polymul (direct, quadratic) and decimal base-case multiplication
        reason: Same packages as E-NP and E-DEC with asymptotically slower algorithms; not separate engines.
    i_direct_engine: >-
      I_direct may NOT use E-NP or E-DEC, numpy or decimal for polynomial
      arithmetic, nor any r1/indep module. It uses CPython-integer shift and XOR
      arithmetic written by the runner author: squaring by bit spreading,
      reduction modulo the sparse L = X^(2^n') + lambda by folding (X^(2^n') =
      lambda(X) modulo L, lambda of degree at most 7, so no large product is
      needed), and its own classical Euclidean gcd.
    shared_primitive_and_independence: >-
      Shared between the instruments: the CPython integer type with its bitwise
      operators (a language primitive) and the classical Euclidean ALGORITHM
      (the specification names a gcd in both instrument definitions). No CODE is
      shared: the I_indep author reads nothing of implementation/*.py or
      r1/runner (CI-1, AC-16) and r1/indep imports nothing from them (AC-7
      static rule S2); the runner imports only r1.indep.api (AC-24, transitive).
      AC-7's trace rules R1 to R4 forbid I_indep from applying its gcd, its
      squaring or any reduction to I_direct's operands (X-power residues modulo
      L or a divisor of L beyond 2^(n'+1); gcds of L-class polynomials with
      anything other than an L-class polynomial, a derivative or a Berlekamp
      kernel polynomial).

