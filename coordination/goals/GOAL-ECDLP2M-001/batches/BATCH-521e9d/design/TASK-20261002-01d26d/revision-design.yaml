        with python3 tools/allocate_id.py --next run --area QSP and --check before
        TASK-20261002-909f2c is dispatched and records in the queue's
        tasks_state_revisions, one per trial in the order listed; none equal to
        any run id of any earlier plan (R-C9) or of the sixteen bound directories.
      argv: >-
        ["python3", "experiments/EXP-QSP-70b731/implementation/r1/runner/main.py",
        "--trial", <trial id>, "--run-id", <run id>, "--out", "{run_dir}",
        "--context", "experiments/EXP-QSP-70b731/execution-context-r1.yaml"], plus
