        "experiments/EXP-QSP-70b731/stage0/hand-derivation-note-r1.yaml", and for
        stage-compare-sealed "--stage4-runs" with the three Band-H run ids and
        "--compare-map", "experiments/EXP-QSP-70b731/compare/compare-map-r1.yaml".
      check_argv: '["python3", "experiments/EXP-QSP-70b731/implementation/r1/runner/check.py", "{run_dir}"]'
      artifacts: >-
        manifest.yaml, raw-result.json, attempt-start.yaml, rows.jsonl,
        certificates-index.json for every trial; stage0-hand-note.yaml and
        stage0-checklist.json for stage0-hand-gate; compare-report.json for
        stage-compare-sealed. rows.jsonl is in allow_empty_artifacts for
        stage0-hand-gate and stage-compare-sealed. Certificate files live under
        certs/ and are bound through certificates-index.json.
      memory_mb: 8192 for every trial
      watchdog_seconds: null for every trial (time budget advisory); claim TTL per EC-3
      per_trial_fields: >-
        id, run_id, stage, n_prime, cells, routes and engines (copied from the
        route table), argv, check_argv, artifacts, allow_empty_artifacts,
        memory_mb, watchdog_seconds, depends_on, note, projection_note (the R-C7
        figure, labelled a planning figure).
      cells_per_trial:
        stage0-hand-gate: [stage0-hand-gate]
        stage1-toy-calibration: [stage1-toy-calibration/n11-np6, stage1-toy-calibration/n13-np7, stage1-toy-calibration/n7-np3]
        stage5-controls: [stage5-controls/C2, stage5-controls/C3, stage5-controls/C4, stage5-controls/C5F-np11, stage5-controls/C5K-np11, stage5-controls/C5F-np33, stage5-controls/C5K-np33, stage5-controls/C6-np11, stage5-controls/C6-np33]
        stage2-bandL-n<k>: '[stage2-bandL-n<k>] for k = 3 to 14'
        stage3-bridge-n22: [stage3-bridge-n22]
        stage4-bandH-n<k>: '[stage4-bandH-n<k>] for k in {33, 44, 66}'
        stage-compare-sealed: none (comparison of frozen Band-H outputs with the sealed EXP-QSP-33b442 Stage-3 files)
      cell_moduli: >-
        K_131 = z^131 + z^13 + z^2 + z + 1 (specification) for every n = 131 cell;
        the toy moduli of the refused design's route_map (z^4+z+1, z^7+z+1,
        z^11+z^2+1, z^13+z^4+z^3+z+1, z^31+z^3+1, z^12+z^3+1), recalled standard
        low-weight irreducibles, each tested irreducible before use (WO-I-2,
        WO-R-6); a failure is an infrastructure stop and a substitute modulus
        needs a Coordinator decision.
    fixed_paths_written_later: >-
      execution-context-r1.yaml, execution-readset-r1.yaml,
      stage0/hand-derivation-note-r1.yaml and compare/compare-map-r1.yaml under
