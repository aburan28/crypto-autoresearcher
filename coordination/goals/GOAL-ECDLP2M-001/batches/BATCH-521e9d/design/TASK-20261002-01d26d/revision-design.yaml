      CI-6 and the card: field degree n outside {4, 7, 11, 12, 13, 31, 131} and at
      most 19. (q, r, s) are divmod arithmetic by this producer; no N, root or H was
      computed by this producer on any of them. Moduli are recalled standard
      irreducibles (provenance recalled); every test first checks irreducibility.
