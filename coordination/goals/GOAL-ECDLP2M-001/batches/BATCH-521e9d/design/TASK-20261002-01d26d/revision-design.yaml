                print(json.dumps({"case": case_id, "label": label, "check_run_errors": errors,
                                  "check_run_clean": clean, "expected_clean": clean_expected,
                                  "ac2_predicate": ac2, "expected_ac2": ac2_expected, "met": met},
                                 sort_keys=True))
            print(json.dumps({"summary": "check_run-failure-records", "all_expectations_met": all_met}))
            return 0 if all_met else 1


        if __name__ == "__main__":
            sys.exit(main())
