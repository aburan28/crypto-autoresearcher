      - id: EC-1
        text: Linux is a DISPATCH PRECONDITION of the execution card (DR-4, CC-3); the card names the host and its sys.platform before any claim.
      - id: EC-2
        text: >-
          The execution report records every attempt whose payload could not
          write a record (WO-R-20 FB-11 and FB-12): trial, run id, receipt status
          and detail, and the reason; such attempts are infrastructure, never
          evidence, and their run directories are never reused.
      - id: EC-3
        text: >-
          The execution card sizes its claim TTL per trial from
          route_table.claim_ttl_guidance (R-C7), because a trial cut at
          claim expiry ends as an incomplete attempt.
    approval_binding: >-
      approved_by stays null and task_id is TASK-20261002-909f2c.
      tools/experiment_execution.py load_plan refuses a null approved_by, so the
      file as frozen cannot be executed or loaded unmodified (AC-23 loads a
      scratch copy; PD-3). A later execution batch writes a successor plan that
      changes only approved_by, task_id and queue, with the same trials, run ids,
      argv and digests.
    trials:
      count: 20
      ids_and_order: >-
        stage0-hand-gate, stage1-toy-calibration, stage5-controls,
        stage2-bandL-n3 to stage2-bandL-n14 (12), stage3-bridge-n22,
        stage4-bandH-n33, stage4-bandH-n44, stage4-bandH-n66,
        stage-compare-sealed; the trials array in this topological order; the
        trial ids equal the twenty of trial-plan.json (R-C9).
      depends_on: As d5_ordering.placement, exactly.
      run_ids: >-
