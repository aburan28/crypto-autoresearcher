        """Failure-record demonstration for the EXP-QSP-70b731 r1 revision design
        (TASK-20261002-01d26d), R-C8 (DR-1): the reference record writers of WO-R-3, WO-R-5
        and WO-R-20 write synthetic run directories under ./checkrun_demo/ (the current
        directory is the session's scratch), and tools/validate_ledger.py check_run,
        imported as a function only with a fresh context, checks each manifest; the AC-2,
        AC-15 and AC-25 predicate is applied to each failure record. Round-1 cases A2, A6,
        A8, A9 and A11 are included by name. The run ids are synthetic strings that no
