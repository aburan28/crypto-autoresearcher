        """
        import json
        import os
        import shutil
        import sys

        import yaml

        REPO = "/home/user/crypto-autoresearcher"
        OUT = "checkrun_demo"
        RAW_FAILURE_KEYS = ("status", "stop_code", "error", "rows_finished")


        def atomic_write(path, text):
            tmp = path + ".tmp"
            with open(tmp, "w", encoding="utf-8") as handle:
                handle.write(text)
                handle.flush()
                os.fsync(handle.fileno())
            os.replace(tmp, path)


        def companions(run_dir):
            for name, text in (("command.txt", '["python3", "main.py", "--synthetic"]\n'),
                               ("environment.json", '{"python": "synthetic"}\n'),
                               ("stdout.log", ""), ("stderr.log", "")):
                with open(os.path.join(run_dir, name), "w", encoding="utf-8") as handle:
                    handle.write(text)


        def body(run_id, status, result):
            return {"run": {
                "id": run_id, "experiment_id": "EXP-QSP-70b731", "trial_id": "synthetic-demo",
                "status": status,
                "plan": {"path": "synthetic", "sha256": None, "task_id": None, "approved_by": None},
                "code": {"commit": "synthetic-demo-commit", "dirty": False, "dirty_paths": [],
                         "command": "python3 r1/runner/main.py --synthetic syn-a-15-04"},
                "environment": {"python": sys.version.split()[0], "platform": sys.platform},
                "inference": {"requested_policy": None, "payload_model_invocations": 0},
                "inputs": {"parameters": {"stage": "synthetic", "cells": ["syn-a-15-04"], "field_bits": 15},
                           "seeds": {"base_seed": 20260920}, "read_set": {"declared": True}},
                "timing": {"started_at": "2026-10-02T00:00:00Z", "finished_at": None},
