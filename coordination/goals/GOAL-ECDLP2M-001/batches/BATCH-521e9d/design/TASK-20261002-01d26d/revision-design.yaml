  calibration_per_depth:
    requirement: DR-8; carried holding part HP-7 (refused design d4_calibration).
    band_h_code_path: >-
      Band H runs A-DENSE at n = 131 with s = 1 and composition depth q + 1 = 4
      (n' = 33), 3 (n' = 44) and 2 (n' = 66), B at most 2401. One A-DENSE
      callable serves every cell (WO-I-11, AC-8); Band H differs from the
      calibration rows only in the integers q, r, s, d, the engine and the cell's
      modulus.
    depths:
      - depth_q_plus_1: 2
        band_h_cell: stage4-bandH-n66
        exact_declared_references: >-
          Stage-1 cells (11, 6) and (13, 7) (q = 1), every F_2 lambda of exact
          degree 2 to 7, each I_indep route compared exactly with I_direct (toy
          n, not n = 131).
      - depth_q_plus_1: 3
        band_h_cell: stage4-bandH-n44
        exact_declared_references: >-
          Stage-1 cell (7, 3) (q = 2) against I_direct; fixtures C2 (7, 3), C3
          (31, 15) and C4 (12, 6) against forced counts (C4 is vacuous for (A) at
          r = 0, as the specification says). Toy n only.
      - depth_q_plus_1: 4
        band_h_cell: stage4-bandH-n33
        exact_declared_references: >-
          NONE. No declared cell with an exact reference has q + 1 = 4. C5F-np33
          (n = 131, q + 1 = 4) is a null object without an exact reference; C6-np33
          (q + 1 = 4) is checked only against Proposition 2's complete-splitting
          dichotomy (the DR-10 exact-count diagnostic is non-blocking and its
          formula's provenance is recalled). Only synthetic cells (syn-a-15-04,
          syn-a-10-03 and syn-t-15-04, q = 3) exercise depth 4 against brute force.
      - depth_q_plus_1: 6 and above
        band_h_cell: none
        exact_declared_references: >-
          At n = 131 derivation (A) is cross-checked by C1 against I_direct only
          on the bridge (q + 1 = 6) and on the Band-L rows R-C7 routes to A-DENSE
          (q + 1 from 10 to 17); none has depth 2, 3 or 4.
    consequence: >-
      The specification's sentence that Band-L and bridge agreement "calibrates
      it before Band H" holds after A1 in a narrower sense, stated per depth
      above: depths 2 and 3 are calibrated exactly at toy n only, depth 4 has no
      exact declared reference anywhere, and the n = 131 calibration exercises
      depths of 6 and above. A defect appearing only jointly at n = 131 and depth
      at most 4 is not excluded by calibration. Band H's completeness still rests
      on derivation (A), as in version 1.

  d5_ordering:
    carried_from: HP-4, refused design d5_ordering (lines 585-651), held by round-1 JD2 (DEC-20261002-6e68d8 R-JD2)
    reading: >-
      Restated. The specification's only order clauses are stage_compare.when
      ("after Stage 4 freeze"), stage_4.freeze_rule, stopping_rules[0] (Stage 0
      fails, no census numbers), stopping_rules[1] (a wrong proves-too-much
      fixture STOPs, F5), stopping_rules[2] (a Band-L or bridge disagreement
      stops the cell and Band H waits) and stopping_rules[5]. Stage numbers are
      labels; no clause places stage_5's control arms after the census. A STOP
      on a wrong fixture has content only if census work remains to be stopped,
      and a fixture failure found after COMPARE would follow the opening of the
      sealed artifacts against an instrument the fixture shows wrong, which the
      freeze rule exists to prevent. So the text permits, and the stopping rules
      require, the blocking controls C2 to C6 before every census trial. The
      closing-report items of stage_5 stay last. No A2 clause.
    placement:
      - {position: 1, trial: stage0-hand-gate, depends_on: []}
      - {position: 2, trial: stage1-toy-calibration, depends_on: [stage0-hand-gate]}
      - {position: 3, trial: stage5-controls, depends_on: [stage0-hand-gate, stage1-toy-calibration]}
      - {position: '4 to 15', trial: 'stage2-bandL-n3 ... stage2-bandL-n14', depends_on: [stage0-hand-gate, stage1-toy-calibration, stage5-controls]}
      - {position: 16, trial: stage3-bridge-n22, depends_on: [stage0-hand-gate, stage1-toy-calibration, stage5-controls]}
      - {position: '17 to 19', trial: 'stage4-bandH-n33, -n44, -n66', depends_on: 'stage0-hand-gate, stage1-toy-calibration, stage5-controls, all twelve stage2 trials, stage3-bridge-n22'}
      - {position: 20, trial: stage-compare-sealed, depends_on: [stage4-bandH-n33, stage4-bandH-n44, stage4-bandH-n66]}
      - {position: after 20, trial: none (execution-card closing report; aggregation of committed outputs only), depends_on: []}
    mechanism: >-
      Each payload's checker exits non-zero on its stop condition (WO-R-9), the
      runner records the trial not output_validated, and every dependent trial
      stays waiting_on_dependencies (tools/experiment_execution.py coverage).
      One Band-L cell's stop does not stop another Band-L cell; Band H depends on
      all of them.
    c5_note: >-
      C5's n' = 33 F_2 arm draws lambda of degree 3 and 7, which are Band-H census
      candidates; its I_indep values are computed before Stage 4. That opens
      nothing sealed and is not a comparison (see also limitations_carried DR-12).

  stage0_mechanism:
    carried_from: HP-3, refused design stage0_mechanism (lines 652-729), held by round-1 JD1 (no census-code path)
    who_and_when: >-
      Restated. The hand note is written in the EXECUTION batch a later
      Coordinator decision opens for trial-plan-r1.json, never in BATCH-521e9d,
      by the session that decision names, by hand (no code executed for its
      mathematical content, no r1 module loaded). Its author is neither the
      I_indep author (TASK-20261002-38ffea) nor the runner author
      (TASK-20261002-909f2c), and is not the session of TASK-20261002-c5d9e7 or
      TASK-20261002-323713 (DR-13). It is committed at
      experiments/EXP-QSP-70b731/stage0/hand-derivation-note-r1.yaml after that
      batch's execution approval and before stage0-hand-gate is launched.
    note_schema: >-
      Restated: schema qsp70b731.stage0.hand.v1; test_only false; cell (4, 3)
      with F_16 = F_2[z]/(z^4+z+1) checked irreducible by hand; author_session
      and computation_attestation; the derivation as prose (lambda(z)^(2^k) =
      lambda(z^(2^k)) for lambda in F_2[X]; the chain x^(2^(kn')) =
      lambda^(ok)(x); y = x^(2^r); H; the bound; the closing test); per lambda
      (exactly X^2+X+1 and X^3+1) q, r, s, d, the bound, H written out by hand,
      whether H vanishes or loses degree (d = 2 is the tie d^(q+1) = 2^(n'-r) =
      4), a 16-row table (element, x^8, lambda(x), is_root), roots_of_L, N_hand,
      H's roots in F_16, the closing test per H-root, the passing set and the
      slack; verdict and verdict_reason; read_declaration as a list of {path,
      extent} entries in canonical form (WO-R-11).
    trial_mechanics: >-
      Restated. The stage0-hand-gate payload does bookkeeping only: copies the
      committed note into the run directory and checks the copy equals HEAD's
      blob; checks the schema; refuses test_only notes; checks (n, n') = (4, 3)
      and the lambda set; per lambda checks the table has 16 distinct elements,
      roots_of_L equals the elements marked is_root, N_hand equals
      len(roots_of_L) and the passing set's size, slack equals listed H-roots
      minus N_hand; reads the verdict. NO field arithmetic. A failed check or a
      fail verdict is F0 (checker exit 9). For each of the ten blind_from paths
      it records os.path.exists on the path itself and never lists, opens or
      reads it; a missing path stops the gate (exit 9).
    no_census_code: >-
      Restated with the DR-4 repair. main.py imports at module level only the
      standard library and r1/runner/manifest.py, context.py, errors.py (and
      PyYAML); every stage module is imported lazily inside the stage dispatch.
      stage0.py imports only manifest.py, readset.py, context.py, errors.py, the
      standard library and PyYAML. AC-10 computes the static transitive import
      graph FROM main.py's Stage-0 path and runs the runtime guard THROUGH THE
      PLAN'S ARGV FORM (python3 .../r1/runner/main.py --trial stage0-hand-gate
      ...); stage0.py asserts at start and at exit that no module of r1/indep
      and none of census.py, controls.py, i_direct.py, kfield.py, certs.py,
      compare.py is in sys.modules; a hit is exit 9 with stop_code STAGE0-GUARD
      after the failure record (WO-R-20).
    m9: Computed per run from declared, canonical read sets (WO-R-11, WO-R-22); never a constant.
    stage0_rows: Stage 0 emits no measurement rows (rows_completed 0, certificate_bearing 0); the hand values live in the note.
    produced_in_this_batch: none

  interface:
    layout:
      indep: >-
        experiments/EXP-QSP-70b731/implementation/r1/indep/ (TASK-20261002-38ffea
        only): __init__.py; api.py (entry and invariants); routes.py (the literal
        route and engine table); route_a.py (A-DENSE, A-TWIST); route_berl.py
        (S-BERL); and the PRIMITIVE modules gf2x.py (TPoly and F_2[X] primitives),
        engines.py (E-NP, E-DEC, Barrett squaring, classical gcd), fieldk.py (K
        and K[Y] arithmetic, root finding), trace.py (event recording and the
        R0 to R4 audit); errors.py; tests/ (synthetic cells only). Names below
        api.py may differ; the WO-I rules bind whatever files exist, with the
        primitive/route split stated in the implementation report.
      runner: >-
        experiments/EXP-QSP-70b731/implementation/r1/__init__.py and r1/runner/
        (TASK-20261002-909f2c only): main.py (bootstrap), context.py, manifest.py,
        records.py (failure-branch writers, WO-R-20), readset.py, stage0.py,
        candidates.py, i_direct.py, kfield.py, census.py, controls.py, certs.py,
        accounting.py, compare.py, check.py, plan_check.py, audit_indep.py,
        seeds.py, errors.py, tests/.
      plan: experiments/EXP-QSP-70b731/trial-plan-r1.json (TASK-20261002-909f2c)
      import_rule: >-
        The runner imports I_indep only as r1.indep.api (count_roots, routes_for,
        engine_for, the exception classes). r1/indep imports nothing from
        r1/runner. All r1 imports are absolute under r1; no r1 module imports a
        top-level name equal to a bound module (candidates, check, driver,
        field_f2n, gf2_poly, i_direct, i_indep); main.py and check.py assert after
        imports that none of those names is in sys.modules.
    entry_function:
      module: r1/indep/api.py
      signature: |
        def count_roots(cell: str, n: int, n_prime: int, lam, *, route: str | None = None,
                        rng_seed: int, trace: bool = False) -> dict:
            ...
        def routes_for(cell: str, d: int) -> tuple[str, ...]:
            ...
        def engine_for(cell: str, d: int) -> str | None:
            ...
      arguments: >-
        cell: the name exactly as in the route table (or a syn- name); unknown
        raises UnknownCell. n, n_prime: must equal the table's values
        (ArgumentMismatch); the field modulus comes from the table. lam: an int
        for F_2 coefficients (bit i = coefficient of X^i) or a tuple of ints for K
        coefficients (entry i = coefficient of X^i as a K element); the wrong form
        raises ArgumentMismatch. route: None when routes_for gives one route,
        else one of them (RouteNotApproved otherwise). rng_seed: the only
        randomness source. trace: accepted only for cells whose name starts with
        syn- (TraceNotAllowed otherwise); when true the return value carries the
        trace (WO-I-10). routes_for and engine_for are pure table lookups.
      return_schema: >-
        schema qsp70b731.r1.indep.v2: cell, n, n_prime, q, r, s, d echoed; lambda
        (hex, or list of hex for K form); route; engine (E-NP, E-DEC or null for
        S-BERL); N; roots (lowercase hex polynomial-basis vectors over the cell
        modulus, sorted, pairwise distinct, len(roots) == N); orbits (list of
        {rep, size} partitioning roots; empty with flag NO_FROBENIUS_ORBITS for K
        coefficients); bound = max(2^s, d^(q+1)); h_degree, h_roots_in_K, slack
        (A routes; null for S-BERL); factor_degrees; flags from {SQUARE_LAMBDA,
        H_DEGREE_BELOW_BOUND, NO_FROBENIUS_ORBITS, LINEARIZED_LAMBDA};
        squarings_verified (A routes: count of runtime-verified squarings);
        max_round_error (E-NP); rng_seed echoed; trace (only when requested).
      invariants_enforced_before_return: >-
        N == len(roots) == sum of orbit sizes (when given); roots pairwise
        distinct; each root x satisfies x^(2^n') == lambda(x) in K by I_indep's own
        arithmetic; for A routes N <= h_roots_in_K <= h_degree and
        squarings_verified == n. A violation raises InvariantViolation; no partial
        result is returned.
      exceptions: >-
        UnknownCell, ArgumentMismatch, RouteNotApproved, TraceNotAllowed,
        ModulusNotIrreducible, HVanishes, FactorDegreeInconsistent,
        RootSearchFailure, BerlekampSplitIncomplete, EngineExactnessError,
        EngineVerificationError, InvariantViolation, all subclasses of IndepError.
        The runner records a raised IndepError as a row with status
        instrument_error (class and message) and N null, never a count.
    primitive_layer:
      rule: >-
        Every F_2[X] value a route handles is a TPoly created and transformed only
        by gf2x primitives; the reference is code_blocks.trace_audit_demo_code
        (classes TPoly, TMat, Prim). TPoly: __slots__ (value, token), immutable
        (__setattr__ raises), __copy__ and __deepcopy__ return the same object, so
        a copy, a list element or a view keeps the token; no __int__, __index__,
        __getitem__ or __iter__; __bool__ raises (zero tests go through the
        is_zero primitive); __reduce__ raises (no pickle round trip).
      primitives: >-
        lift(value, label) with label in {one, X, lambda, modulus_P}; add, mul,
        sqr, shift(a, k), mod(a, m), mulmod(a, b, m), sqrmod(a, m), gcd(a, b),
        div_exact(a, b), deriv(a), sqrt(a), compose(lam, a), degree(a),
        is_zero(a), equal(a, b); matrix primitives mat_rows(rows),
        mat_add_identity(M), mat_left_kernel(M) (returns TPoly kernel vectors),
        mat_apply(M, v), mat_mul(A, B); K-side root primitives in fieldk
        (kroots(a) and the closing-test evaluations), which act modulo the field
        modulus P.
      trace_event_schema: >-
        One event per primitive call, in call order: {seq, op, ins: [input
        tokens], out: [output tokens], mats: [input matrix tokens], mats_out:
        [output matrix tokens], k (shift amount), label and after_arith (lift)}.
        Side tables, emitted only when trace=True on a synthetic cell: values
        (token -> polynomial as hex) and matrix_rows (matrix token -> rows as
        hex). Tokens are object identities assigned at creation, never value
        digests.

  work_orders:
    dr13_note: >-
      Every work order below carries the field tq3 with the DR-13 statement
      verbatim (DEC-20261002-6e68d8 DR-13; REVIEW-QSP-RD-20261002-521e9d TQR-3);
      AC-30 checks that each one does.
    WO-I:
      executor_task: TASK-20261002-38ffea
      scope: >-
        I_indep under experiments/EXP-QSP-70b731/implementation/r1/indep/ and
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/implementation/TASK-20261002-38ffea/implementation-report.yaml,
        from the specification's I_indep text, derivation (A) as H-QSP-cd0c90 and
        IDEA-20260916-3f7a1c state it, this design, and AMD-20261002-09957b A1 if
        DEC-20261002-ff2bd5 approves it. It carries no code of the bound
        i_indep.py, gf2_poly.py or i_direct.py; this producer read none of them.
      items:
        - id: WO-I-1
          title: Reads, imports, custody, minimum read set (CI-1, CI-2, CC-4, DR-11)
          text: >-
            MINIMUM READ SET (DR-11), each inside TASK-20261002-38ffea's read_scope:
            ledger/handoffs/TASK-20261002-38ffea.yaml; AGENTS.md; agents/executor.md;
            experiments/EXP-QSP-70b731/specification.yaml;
            ledger/hypotheses/H-QSP-cd0c90.yaml;
            ledger/proposals/IDEA-20260916-3f7a1c.yaml;
            coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/design/TASK-20261002-01d26d/revision-design.yaml;
            ledger/decisions/DEC-20261002-ff2bd5.yaml; and
            experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml if that
            decision approved it. The card's read_scope is the maximum. Read
            nothing in the specification's blind_from, no file of
            experiments/EXP-QSP-70b731/implementation/*.py, nothing under r1/runner/,
            no round-1 file and no review report. Import only the standard library
            (math, random, typing, dataclasses, functools, itertools, collections,
            hashlib, json, os, sys, time, array, decimal), numpy (E-NP only, in
            engines.py) and r1.indep modules; no importlib, __import__, exec, eval,
            compile, ctypes, gc, pickle, copyreg, marshal, inspect, sys.path or
            sys.modules edits. New files under r1/indep/ only. Record every path
            read, in order, in implementation-report.yaml
            read_attestation.paths_read as {path, extent} mappings with canonical
            paths (WO-R-11 form).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-2
          title: Interface
          text: >-
            Implement count_roots, routes_for and engine_for exactly as
            interface.entry_function states, with its argument checks, return
            schema v2, invariants and exception classes. At first use of a cell,
            test its modulus for irreducibility over F_2 (Rabin or Ben-Or) and
            raise ModulusNotIrreducible on failure; cache per modulus.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-3
          title: Route and engine selection by name (CI-3, DR-6)
          text: >-
            routes.py holds ONE dict literal keyed by cell name: n, n_prime,
            modulus (z-polynomial string), coefficient form (F2 or K), and a dict
            literal from degree d to {routes: tuple of route names, engine: E-NP,
            E-DEC or null}. For declared cells it equals the route_map R-C7 prints
            (and A1's changed rows, if approved) byte for byte in substance; for
            synthetic cells it equals synthetic_cells. routes_for and engine_for
            look up (cell, d); count_roots dispatches through a dict from route
            name to function. No comparison operator and no arithmetic on n, n',
            q, r, s, d, B or deg L may occur in routes.py or in api.py's dispatch
            path; an unknown (cell, d) raises.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-4
          title: A-DENSE, derivation (A) for F_2-coefficient lambda
          text: >-
            Given cell, lambda in F_2[X] of degree d, n, n' and the cell modulus P
            (K = F_2[z]/(P)), through gf2x primitives on the row's engine: (1) q, r
            = divmod(n, n'); s = n' - r. (2) Lam_0 = Y; Lam_(j+1) = compose(lambda,
            Lam_j) for j = 0 .. q, so Lam_(q+1) = lambda^(o(q+1)). (3) H =
            shift(one, 2^s) + Lam_(q+1); HVanishes if zero; record h_degree and flag
            H_DEGREE_BELOW_BOUND when h_degree < max(2^s, d^(q+1)). (4) R = Y mod H,
            then n modular squarings R <- sqrmod(R, H) by the engine's Barrett
            squaring, each VERIFIED (WO-I-14). (5) G = gcd(H, R + Y) by the
            declared classical gcd; verify G divides H and R + Y exactly. (6) Split
            G into irreducible factors over F_2; every factor degree must divide n,
            else FactorDegreeInconsistent. (7) For each factor find its deg f roots
            in K (WO-I-7) and record the Frobenius orbit. (8) For each K-root y of H
            compute x = lambda^(oq)(y) in K and accept y iff x^(2^r) == y and
            x^(2^n') == lambda(x) in K. (9) N = number of accepted y; roots = the
            corresponding x; orbits the images of the y-orbits; h_roots_in_K = deg
            G; slack = deg G - N. Correctness (IDEA-20260916-3f7a1c claims (A) and
            (C)): a K-root x of L gives the K-root y = x^(2^r) of H with x =
            lambda^(oq)(y); an accepted y gives a root x with x^(2^r) = y; distinct
            accepted y give distinct x.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-5
          title: A-TWIST, derivation (A) for K-coefficient lambda (C5K-np33; syn-t cells)
          text: >-
            Notation: sigma is z -> z^2 on K; mu^(sigma^j) applies sigma^j to the
            coefficients of mu in K[X]; mu(z)^(2^j) = mu^(sigma^j)(z^(2^j)). If
            x^(2^n') = lambda(x), induction gives x^(2^(kn')) = Lam_k(x) with Lam_1
            = lambda and Lam_(k+1) = lambda^(sigma^(kn')) o Lam_k. For x in K, x =
            x^(2^n) = Lam_q(x)^(2^r) = M(x^(2^r)) with M = Lam_q^(sigma^r) =
            lambda^(sigma^((q-1)n'+r)) o ... o lambda^(sigma^r). Put y = x^(2^r);
            then y^(2^s) = lambda(M(y)). So every K-root x of L gives a K-root y of
            H_tw(Y) = Y^(2^s) + lambda(M(Y)), of degree at most max(2^s, d^(q+1)),
            with x = M(y); conversely y in K with x = M(y), x^(2^r) = y and L(x) =
            0 is such a root, distinct y giving distinct x. For lambda in F_2[X],
            H_tw is derivation (A)'s H. Steps: build M innermost first in K[Y]
            (M_0 = Y; M_(j+1) = lambda^(sigma^(jn'+r))(M_j), j = 0 .. q-1); H_tw =
            Y^(2^s) + lambda(M_q); HVanishes if zero; R = Y^(2^n) mod H_tw in K[Y];
            G = monic gcd(H_tw, R - Y); all roots of G lie in K, found by
            equal-degree splitting over K (trace map with seeded random beta);
            closing test x = M(y), x^(2^r) == y, x^(2^n') == lambda(x); N, roots,
            flag NO_FROBENIUS_ORBITS, orbits empty, slack = deg G - N. This
            derivation is restated from the refused design's WO-I-5 (provenance
            internal; round-1 JD2 checked it against brute force on 123 synthetic
            cases, attributed). Status under DR-9: a_twist.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-6
          title: S-BERL, the A1 substitute (only on rows R-C7 and A1 assign; Stage 1; C2 to C4)
          text: >-
            Restated from HP-6. (1) L = shift(one, 2^n') + lambda in F_2[X]. (2)
            rad(L), the product of the distinct irreducible factors, by the
            characteristic-2 squarefree algorithm: d = deriv(f); if d = 0, recurse
            on sqrt(f); else g = gcd(f, d), w = div_exact(f, g), and rad(f) = w if
            deg g = 0, else lcm(w, rad(g)) = div_exact(mul(w, rad(g)), gcd(w,
            rad(g))). (3) Berlekamp: m = deg rad(L); Q rows X^(2i) mod rad(L) for
            i < m, row 0 = mod(one, rad(L)) and row i = mod(shift(row i-1, 2),
            rad(L)), never by squaring a residue; Q - I by mat_add_identity; its
            left kernel by mat_left_kernel (Gaussian elimination on bit-packed
            rows); k = kernel dimension = number of distinct irreducible factors.
            (4) Split: from {rad(L)}, for each kernel polynomial v and each current
            factor g of degree above 1, h = gcd(g, mod(v, g)); when 0 < deg h < deg
            g replace g by h and div_exact(g, h); stop at k factors; fewer after all
            vectors raises BerlekampSplitIncomplete. (5) N = sum of deg f over the
            factors whose degree divides n; roots by WO-I-7 for each; factor_degrees
            reported; slack and h_degree null. Basis: an irreducible F_2 polynomial
            has a root in F_(2^n) iff its degree divides n, all its roots then lie
            there and are distinct (standard; provenance recalled; Stage 1 and the
            synthetic tests are the checks). INDEPENDENCE TEXT RULE (DR-7,
            restated so that S-BERL's own Q construction satisfies it): modulo L or
            any divisor of L, S-BERL forms residues X^e only with e < 2^(n'+1) (the
            Q rows, e = 2i < 2 deg rad(L) <= 2^(n'+1)), each from the previous by
            one multiplication by X^2 and one reduction; it forms no product of two
            residues, squares no residue, and applies neither Q nor any power of Q
            to a vector (its only matrix operations are forming Q - I and taking
            its left kernel); it takes gcds of L or of a divisor of L only with its
            formal derivative, with another divisor of L, or with a Berlekamp
            kernel polynomial reduced modulo the current factor; and it reduces
            modulo L or a divisor of L nothing but Q rows, kernel polynomials and
            divisors of L. AC-7's rules R1 to R4 are this rule made mechanical.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-7
          title: Roots in K of an irreducible F_2 factor (CI-4)
          text: >-
            Find all deg f roots in K of an irreducible f in F_2[Y] with deg f
            dividing n, by a method of the author's choice in fieldk.py
            (equal-degree splitting of f over K with Tr(beta Y), random beta, or an
            embedding of F_2[Y]/(f) into K), seeded only from rng_seed, inside a
            declared finite attempt budget (a module constant stated in the
            report). Exhausting it raises RootSearchFailure; each root is checked by
            evaluating f in K; the orbit {y^(2^i)} must have exactly deg f distinct
            elements, else InvariantViolation. No code path skips a factor.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-8
          title: Failure semantics (D-3, CI-4)
          text: >-
            Every failure raises an IndepError subclass. No except clause in
            r1/indep swallows an exception, returns a count or continues past a
            factor (no bare except; no except Exception followed by pass, continue
            or a numeric return); AC-5 checks by AST and by fault injection. N is
            defined as len(roots), so under-listing cannot be reported as a count.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-9
          title: Seeds (D-7, DR-4)
          text: >-
            count_roots constructs exactly one random.Random(rng_seed) and passes it
            down (root search, the verification modulus of WO-I-14). No other Random
            is constructed, no module-level random function is called, and nothing
            is seeded from time, os.urandom, a literal or a literal combined with a
            parameter (the F-10 shape random.Random(0xC0FFEE ^ d) is the AC-12
            mutation). The report lists every place randomness is drawn.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-10
          title: Operand-provenance trace and the independence rules (CI-1, D-4, DR-7)
          text: >-
            STATIC (S1 to S4). S1 imports as WO-I-1. S2 bitwise operators (^, &, |,
            <<, >>, ~) and int methods bit_length, bit_count, to_bytes, from_bytes
            appear only in the primitive modules (gf2x.py, engines.py, fieldk.py,
            trace.py), never in api.py, routes.py, route_a.py or route_berl.py. S3
            route modules access no attribute whose name starts with an underscore,
            and call none of getattr, setattr, vars, object.__getattribute__ or
            __dict__. S4 TPoly and TMat have the properties of
            interface.primitive_layer, and lift is called only in each route's
            input stage, before any other primitive. TRACE. With trace=True on a
            synthetic cell, every primitive call is an event in the
            interface.trace_event_schema. AUDIT RULES, applied by trace.py (and,
            independently written from this text, by the runner's audit_indep.py):
            a token is L-CLASS if its value equals L or rad(L) of the cell, or it is
            the output of gcd with an L-class input, of div_exact or sqrt of an
            L-class input, or of mul of two L-class inputs; DERIV if it is deriv of
            an L-class token; KERNEL if it is an output of mat_left_kernel, or
            mod(kernel, L-class), or kernel plus the constant 1; X-POWER(e, M) if
            it is congruent to X^e modulo M by provenance (lift X is e = 1, lift one
            e = 0; shift adds k; mul, sqr, mulmod and sqrmod add exponents of
            X-power inputs with compatible moduli; mod keeps e and sets M; mat_apply
            of a Q matrix doubles e). A matrix is Q if its rows are X-POWER(2i, f)
            for i = 0 .. deg f - 1 with f L-class; Q - I if it is mat_add_identity
            of a Q matrix. R0 a lift after the first arithmetic event, with a label
            outside {one, X, lambda, modulus_P}, or of a value other than 1, X, the
            input lambda or P. R1 an output reduced modulo an L-class modulus with
            X-POWER exponent e >= 2^(n'+1). R2 a gcd with an L-class input whose
            other input is not L-class, DERIV or KERNEL. R3 a reduction (mod,
            mulmod, sqrmod) modulo an L-class modulus of an operand that is not
            X-POWER, KERNEL or L-class. R4 any mat_apply or mat_mul, or
            mat_left_kernel of a matrix other than Q - I. The rules are applied to
            the event list; a violation of any rule fails AC-7. The reference
            implementation is code_blocks.trace_audit_demo_code (audit()), run under
            R-C8. Moduli are compared by token or exact value, operands only by
            provenance; value equality is used for nothing but the L-class test.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-11
          title: One A-DENSE code path (D-4 calibration)
          text: >-
            A single function implements A-DENSE for every cell the table assigns
            to it; it does not branch on the cell name or on n, n', q, r, s, d or
            the engine except as loop bounds, arithmetic operands and the engine
            object passed in. Allowed branches are data-dependent only (Euclid
            termination, splitting outcomes, H = 0, the closing test, verification
            outcomes).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-12
          title: Tests (CI-5, CI-6, DR-4)
          text: >-
            Under r1/indep/tests/, run under /usr/local/bin/python3 (CPython
            3.11.15), on synthetic cells only: every name in synthetic_cells is
            defined in the test tree (AC-19). Brute force: test-only code
            enumerating all 2^n elements x and keeping those with x^(2^n') ==
            lambda(x), written independently of the routes. For every syn-a, syn-b
            and syn-ab cell and every F_2 lambda of exact degree 2 to 7 the route's
            N and root set equal brute force, on BOTH engines; syn-a-17-04 and
            syn-b-17-04 agree row for row; syn-t cells: 20 seeded K-coefficient
            lambda per degree 2 to 4 agree with brute force and A-TWIST on F_2
            lambda equals A-DENSE; syn-a-10-05 with lambda = X returns N = 32;
            forced root-search failure raises RootSearchFailure on one A-DENSE and
            one S-BERL row; forced under-listing raises InvariantViolation; a forced
            rounding-guard trip and a forced squaring-verification failure raise;
            the trace audit (WO-I-15) passes A-DENSE and S-BERL and rejects D3a to
            D3f on syn-a-09-04, syn-a-10-03 and syn-a-15-04. Tests mint no RUN id
            and write only under their own temporary directories.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-13
          title: Implementation report
          text: >-
            implementation-report.yaml: read_attestation.paths_read as ordered
            {path, extent} mappings (canonical paths; WO-R-11 form), with the
            statement that none is a blind_from path, a bound closure file or an
            r1/runner file; every file written with its sha256; the primitive/route
            module split; the mapping from each WO-I-4, WO-I-5 and WO-I-6 step to the
            function implementing it; the route literal as written; the attempt
            budget of WO-I-7; the trace-audit outputs on the legitimate and D3 cases;
            test commands, interpreter and outputs; the numpy and libmpdec versions;
            served model with fallback_used; no run value of any declared cell.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-14
          title: Engines and runtime verification (DR-5)
          text: >-
            engines.py implements E-NP and E-DEC exactly as make_np and make_dec of
            code_blocks.engine_bench_code (transcription with provenance "this
            design" is admitted), the shared Barrett squaring (barrett_mu,
            barrett_sqrmod) and the declared gcd (gcd_classical of
            code_blocks.gcd_bench_code). The rounding guard raises
            EngineExactnessError at 0.25. RUNTIME VERIFICATION: per A-route call,
            draw one random irreducible p of degree 89 from the call's Random and
            check every modular squaring by A^2 = Q H + R modulo p and deg R < deg H
            (big_mod and the 16-bit reduction table of engine_bench_code); a
            failure raises EngineVerificationError. The gcd output G is checked to
            divide H and R + Y exactly. The engine used on a row is the one
            routes.py names for (cell, d).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-I-15
          title: Trace audit in I_indep (DR-7)
          text: >-
            trace.py records events when tracing is on and implements the R0 to R4
            audit of WO-I-10 on an event list. The tests insert D3a to D3f (defined
            in AC-7, written with the gf2x primitives) as scratch routes on the
            synthetic cells of WO-I-12 and require: each disguise returns brute
            force's N (it is I_direct in disguise) and is flagged on every row;
            A-DENSE and S-BERL are flagged on no row.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.

    WO-R:
      executor_task: TASK-20261002-909f2c
      scope: >-
        r1/__init__.py, r1/runner/, trial-plan-r1.json and
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/implementation/TASK-20261002-909f2c/implementation-report.yaml.
        Discharges D-1, D-2, the accounting half of D-3, D-5, D-6, D-7, D-8, DR-1
        to DR-4, CC-1 to CC-4, CI-2, CI-5, CI-6. The executor may not read this
        round's or round 1's review reports; every round-1 constructed input it
        must test is defined in acceptance_checks.
      items:
        - id: WO-R-1
          title: Reads, imports, reuse, I_direct engine
          text: >-
            The author may read the bound closure and r1/indep (to integrate, never
            to edit). r1/runner imports nothing from implementation/*.py and from
            r1/indep only r1.indep.api (in census.py and controls.py only).
            Third-party: PyYAML (version recorded). check.py may import
            tools/validate_ledger.py, plan_check.py tools/experiment_execution.py.
            I_direct (i_direct.py) and the wrapper's K arithmetic (kfield.py) are
            runner code written from the specification; neither imports numpy,
            decimal or any r1/indep module (engine_declaration.i_direct_engine).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-2
          title: Run manifest (D-1)
          text: >-
            Every payload writes manifest.yaml with one top-level key run whose body
            carries: id, experiment_id, trial_id, status (running | completed |
            completed_invalid | failed; never an expired form), plan {path, sha256,
            authority commit from launch.json, task_id, approved_by}, code {commit,
            dirty, dirty_paths excluding the run directory, command (exact argv,
            shell-quoted), entry, source_sha256 recomputed for every r1 file and the
            amendment, specification_sha256, amendment_sha256}, environment {python
            version and executable, implementation, platform, sys.platform, machine,
            hostname, RLIMIT_AS read back, dependencies with versions (numpy and
            libmpdec where loaded), runtime_lock}, inference {requested_policy,
            backend, resolved_model_id, model_provenance, model_verified,
            reasoning_effort, fallback_used, fallback_reason,
            degraded_requirements, payload_model_invocations 0, copied from the
            execution context with its path and sha256}, inputs {parameters (stage,
            cells, n, n', field_bits, moduli, candidate rule and count, route and
            engine per (cell, d)), seeds (WO-R-16), context (path, sha256), read_set
            (M9)}, timing {started_at, finished_at, elapsed_seconds, peak RSS,
            per-route seconds}, result {certificate {kind none}, raw_result (path,
            sha256), valid, validity_status (valid | invalid | incomplete),
            validity_reason, invalid_reason, f_codes, stop_code, accounting
            (WO-R-8), metrics (M1 to M9 as the stage defines them), freeze (Stage
            4), diagnostics (WO-R-12), headline}.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-3
          title: Attempts are visible (D-8, DR-1)
          text: >-
            main.py is a bootstrap that imports at module level only the standard
            library, PyYAML and manifest.py, context.py, errors.py, records.py. Its
            first act after argv parsing writes manifest.yaml with status running,
            result.raw_result_pending true, result.certificate.kind none and every
            other required field filled, and a write-once attempt-start.yaml; it
            then installs handlers turning SIGTERM, SIGINT and SIGHUP into an
            exception, reserves a 64 MiB emergency bytearray, and only then imports
            the stage modules. Every terminal write is atomic (temporary file,
            fsync, os.replace), and raw-result.json is ALWAYS written before the
            terminal manifest. Completion writes raw-result.json then the terminal
            manifest; every failure branch follows WO-R-20. rows.jsonl keeps every
            finished row with an fsync per row. Never estimate unfinished rows.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-4
          title: Interpreter and environment (CI-5)
          text: >-
            CPython 3.11 or later, no 3.12-only API; sys.version and sys.executable
            recorded per run; the plan's argv starts with python3 and the execution
            host's interpreter is recorded, never assumed.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-5
          title: Linux gate (CC-3, DR-1)
          text: >-
            First act after the provisional manifest: if sys.platform is not linux,
            follow WO-R-20 branch FB-4 (raw-result.json with stop_code PLATFORM,
            the error and rows_finished 0, then the failed manifest) and exit 2.
