  code_blocks:
    extraction_method: >-
      Pinned. yaml.safe_load of this file; the block named B is the string value
      at revision_design.code_blocks.B.source (a literal block scalar); it is
      written byte-for-byte as UTF-8 to <scratch>/B.py with no transformation; its
      reference sha256 is the sha256 of exactly those UTF-8 bytes. R-C1's command
      performs this for every block. Every block is guarded by if __name__ ==
      "__main__", so importing it executes nothing.
    route_quantities_code:
      purpose: R-C3 route quantities. Import-safe; cells selected by name; bound-formula arithmetic only.
      reference_sha256: fac06b2567399144722adba362d959c430b4dcabe74cff9814e835f57406881b
      source: |
        """Route quantities for the EXP-QSP-70b731 r1 revision design (TASK-20261002-01d26d).

        DESIGN FIGURE ONLY (R-C3). Integer and floating-point arithmetic on the cells
        the frozen specification declares, selected by name: for each (cell, d),
        n = q n' + r, s = n' - r, B = max(2^s, d^(q+1)), log2 B, the group size G under
        the specification's candidate rule (or the control's declared draw count), and
        the 2B-bit memory floor against 2^36 bits (8 GiB). It computes no N, no root,
        no gcd, no H polynomial and no decision statistic on any cell. Importing this
        module executes nothing; run it through its __main__ entry.
        """
        import json
        import math

        FIELD_N = 131
        CEILING_BITS = 2 ** 36


        def census_group(d):
            """Census candidates of exact degree d (3..7): 2^d less the 4 linearized degree-4 shapes."""
            return 2 ** d - (4 if d == 4 else 0)


        def stage1_group(d):
            """Stage-1 candidates of exact degree d (2..7): every polynomial of exact degree d."""
            return 2 ** d


        def declared_cells():
            """(name, n, n', {d: G}, kind) for every declared cell, by name."""
            cells = [("stage0-hand-gate", 4, 3, {2: 1, 3: 1}, "hand")]
            for name, n, n_prime in (("stage1-toy-calibration/n11-np6", 11, 6),
                                     ("stage1-toy-calibration/n13-np7", 13, 7),
                                     ("stage1-toy-calibration/n7-np3", 7, 3)):
                cells.append((name, n, n_prime, {d: stage1_group(d) for d in range(2, 8)}, "calibration"))
            cells += [
                ("stage5-controls/C2", 7, 3, {2: 1}, "fixture"),
                ("stage5-controls/C3", 31, 15, {128: 1}, "fixture"),
                ("stage5-controls/C4", 12, 6, {1: 1}, "fixture"),
                ("stage5-controls/C5F-np11", FIELD_N, 11, {3: 100, 7: 100}, "direct_only"),
                ("stage5-controls/C5K-np11", FIELD_N, 11, {3: 100, 7: 100}, "direct_only"),
                ("stage5-controls/C5F-np33", FIELD_N, 33, {3: 100, 7: 100}, "control"),
                ("stage5-controls/C5K-np33", FIELD_N, 33, {3: 100, 7: 100}, "control_twisted"),
                ("stage5-controls/C6-np11", FIELD_N, 11, {4: 4}, "control"),
                ("stage5-controls/C6-np33", FIELD_N, 33, {4: 4}, "control"),
            ]
            for n_prime in range(3, 15):
                cells.append(("stage2-bandL-n%d" % n_prime, FIELD_N, n_prime,
                              {d: census_group(d) for d in range(3, 8)}, "census_bandL"))
            cells.append(("stage3-bridge-n22", FIELD_N, 22,
                          {d: census_group(d) for d in range(3, 8)}, "census_bridge"))
            for n_prime in (33, 44, 66):
                cells.append(("stage4-bandH-n%d" % n_prime, FIELD_N, n_prime,
                              {d: census_group(d) for d in range(3, 8)}, "census_bandH"))
            return cells


        def quantities(n, n_prime, d):
            q, r = divmod(n, n_prime)
            s = n_prime - r
            two_term = 2 ** s
            d_term = d ** (q + 1)
            return q, r, s, two_term, d_term, max(two_term, d_term)


        def main():
            rows = []
            for name, n, n_prime, groups, kind in declared_cells():
                for d in sorted(groups):
                    q, r, s, two_term, d_term, B = quantities(n, n_prime, d)
                    rows.append({
                        "cell": name, "kind": kind, "n": n, "n_prime": n_prime, "d": d,
                        "q": q, "r": r, "s": s, "depth_q_plus_1": q + 1,
                        "B": B, "B_power_form": ("%d^%d" % (d, q + 1)) if d_term >= two_term else ("2^%d" % s),
                        "log2_B": round(math.log2(B), 6),
                        "G": groups[d],
                        "floor_bits_2B": 2 * B,
                        "floor_le_2^36": 2 * B <= CEILING_BITS,
                    })
            for row in rows:
                print(json.dumps(row, sort_keys=True))
            census = [row for row in rows if row["kind"].startswith("census")]
            band_l = [row for row in rows if row["kind"] == "census_bandL"]
            print(json.dumps({
                "summary": "route-quantities",
                "rows": len(rows),
                "census_rows_total": sum(row["G"] for row in census),
                "band_l_rows_total": sum(row["G"] for row in band_l),
                "band_l_rows_floor_exceeds_2^36": sum(row["G"] for row in band_l if not row["floor_le_2^36"]),
                "band_l_groups_floor_exceeds_2^36": ["%s/d%d" % (row["cell"], row["d"]) for row in band_l
                                                     if not row["floor_le_2^36"]],
                "max_B_bridge_and_bandH": max(row["B"] for row in census if row["kind"] != "census_bandL"),
            }, sort_keys=True))


        if __name__ == "__main__":
            main()
    candidate_count_code:
      purpose: R-C4 candidate counts under the frozen rule, and the C5 draw-pool sizes (DR-12). Import-safe; no field arithmetic.
      reference_sha256: c33a4a2d5ac0b9a29c2ca0b5b822d37995e8aee0a33676935ad10ce827747f0b
      source: |
        """Candidate counts for the EXP-QSP-70b731 r1 revision design (TASK-20261002-01d26d).

        DESIGN FIGURE ONLY (R-C4). Counts polynomials of F_2[X] (bit-packed: bit i is the
        coefficient of X^i) by exact degree under the specification's candidate rule,
        selected by rule name: census = every non-linearized lambda of exact degree 3..7
        (affine shapes and squares included); Stage 1 = every lambda of exact degree 2..7.
        Also the size of the C5 F_2 draw pool at d = 3 and d = 7 (DR-12). No field
        arithmetic on any cell. Importing this module executes nothing.
        """
        import json


        def is_linearized(p):
            """True iff p is a nonzero sum of monomials X^(2^i), i >= 0 (no constant term)."""
            if p == 0:
                return False
            i = 0
            while p:
                if p & 1 and (i == 0 or i & (i - 1)):
                    return False
                p >>= 1
                i += 1
            return True


        def is_affine_linearized(p):
            """True iff p is a linearized polynomial plus the constant 1."""
            return bool(p & 1) and is_linearized(p ^ 1)


        def is_square(p):
            """True iff every monomial of p has an even exponent (p = mu^2 over F_2)."""
            i = 0
            while p:
                if p & 1 and i & 1:
                    return False
                p >>= 1
                i += 1
            return True


        def per_degree(d):
            polys = range(1 << d, 1 << (d + 1))
            linearized = [p for p in polys if is_linearized(p)]
            return {
                "d": d,
                "all": len(polys),
                "linearized": len(linearized),
                "linearized_hex": [format(p, "x") for p in linearized],
                "affine_linearized": sum(1 for p in polys if is_affine_linearized(p)),
                "square": sum(1 for p in polys if is_square(p)),
                "non_linearized": len(polys) - len(linearized),
                "non_linearized_square": sum(1 for p in polys if is_square(p) and not is_linearized(p)),
            }


        def main():
            table = {d: per_degree(d) for d in range(1, 8)}
            for d in sorted(table):
                print(json.dumps(table[d], sort_keys=True))
            census = sum(table[d]["non_linearized"] for d in range(3, 8))
            stage1 = sum(table[d]["all"] for d in range(2, 8))
            print(json.dumps({
                "summary": "candidate-counts",
                "census_per_cell": census,
                "census_per_degree": {str(d): table[d]["non_linearized"] for d in range(3, 8)},
                "census_excluded_linearized": sum(table[d]["linearized"] for d in range(3, 8)),
                "census_squares": sum(table[d]["non_linearized_square"] for d in range(3, 8)),
                "census_affine": sum(table[d]["affine_linearized"] for d in range(3, 8)),
                "stage1_per_cell": stage1,
                "stage1_per_degree": {str(d): table[d]["all"] for d in range(2, 8)},
                "band_l_rows": 12 * census,
                "bridge_rows": census,
                "band_h_rows": 3 * census,
                "stage1_rows": 3 * stage1,
                "c6_linearized_degree4_hex": table[4]["linearized_hex"],
                "c5_f2_draw_pool_d3": table[3]["all"],
                "c5_f2_draw_pool_d7": table[7]["all"],
            }, sort_keys=True))


        if __name__ == "__main__":
            main()
    engine_bench_code:
      purpose: R-C5 engine rates (DR-5). Defines E-NP, E-DEC, the Barrett squaring and the verification the I_indep engines reuse (WO-I-14).
      reference_sha256: d6243021ea256984ff0276b5ebbe8a0dc3f26b29e953aaef3638e0ce3833b1dc
      source: |
        """Engine-rate benchmark for the EXP-QSP-70b731 r1 revision design (TASK-20261002-01d26d).

        DESIGN FIGURE ONLY (R-C5). Times ONE product, or ONE modular squaring with its
        Barrett precomputation timed separately, of uniformly random F_2[X] polynomials
        of a stated degree D drawn from a declared seed, on one engine of the declared
        I_indep product engine set:
          np  -- E-NP: numpy real FFT of 0/1 coefficient blocks of at most 2^25
                 coefficients, rounded to integers; the largest rounding error is
                 recorded and must stay below 0.25 (rounding guard);
          dec -- E-DEC: standard-library decimal (libmpdec) by Kronecker substitution,
                 k decimal digits per coefficient with 10^k above every coefficient
                 sum, under a context that traps Inexact and Rounded.
        Modular squaring: A^2 by bit spreading (linear), then Barrett reduction modulo
        a monic H of degree D with mu = X^(2D) div H precomputed by Newton inversion of
        the reversed H; Q = ((A^2 div X^D) * mu) div X^D; R = A^2 + Q*H.
        RLIMIT_AS = 8 GiB is set inside this process before any engine import. No
        operand is a lambda, an L, an H of any cell, a composite iterate or
        X^(2^n) - X, and none is built from any declared cell: operands are random
        monic polynomials of degree exactly D (D - 1 for the squared residue) from a
        seed-derived stream.
        Verification: every result is checked exactly by a randomised evaluation
        identity modulo a uniformly random irreducible polynomial p of prime degree 89
        over F_2 (product: a*b = c and deg c = deg a + deg b; squaring: A^2 = Q*H + R
        and deg R < D); a false identity passes with probability at most
        deg(E)/(2^89 - 2) <= 2^-58 here, E the nonzero error polynomial (deg E <= 2D).

        Usage (importing this module executes nothing):
            python3 engine_bench_code.py ENGINE OP DEGREE SEED
            ENGINE in {np, dec}; OP in {mul, sqrmod}; DEGREE an integer or 'b^e'.
        Exit codes: 0 verified; 2 usage; 3 MemoryError (instrument condition);
        4 verification failed; 5 rounding guard tripped; 1 any other exception.
        """
        import hashlib
        import importlib.util
        import json
        import os
        import platform
        import random
        import resource
        import sys
        import time
        from array import array

        AS_LIMIT = 8 * 2 ** 30
        NP_BLOCK = 2 ** 25
        CHECK_DEGREE = 89
        ROUND_GUARD = 0.25
        SQ_TABLE = {48: "00", 49: "01"}


        class RoundingGuard(Exception):
            pass


        def emit(record):
            print(json.dumps(record, sort_keys=True), flush=True)


        def read_loadavg():
            try:
                with open("/proc/loadavg", encoding="ascii") as handle:
                    return handle.read().strip()
            except OSError as error:
                return "unavailable: %s" % error


        def proc_status():
            out = {}
            try:
                with open("/proc/self/status", encoding="utf-8", errors="replace") as handle:
                    for line in handle:
                        key, _, value = line.partition(":")
                        if key in ("VmPeak", "VmHWM", "VmSize", "VmRSS"):
                            out[key + "_kB"] = int(value.split()[0])
            except (OSError, ValueError, IndexError) as error:
                out["error"] = str(error)
            return out


        def parse_degree(text):
            if "^" in text:
                base, exponent = text.split("^", 1)
                return int(base) ** int(exponent)
            return int(text)


        def stream(label):
            digest = hashlib.sha256(label.encode("utf-8")).digest()
            return random.Random(int.from_bytes(digest[:8], "big"))


        def random_monic(rng, degree):
            return rng.getrandbits(degree) | (1 << degree)


        def clmul_small(x, y):
            out = 0
            while y:
                if y & 1:
                    out ^= x
                x <<= 1
                y >>= 1
            return out


        def pmod_small(x, p, k):
            while x.bit_length() > k:
                x ^= p << (x.bit_length() - 1 - k)
            return x


        def irreducible_prime_degree(p, k):
            """For prime k: p of degree k is irreducible iff p has no root in F_2 and X^(2^k) = X mod p."""
            if not p & 1 or bin(p).count("1") % 2 == 0:
                return False
            x = 2
            for _ in range(k):
                x = pmod_small(clmul_small(x, x), p, k)
            return x == 2


        def random_irreducible(rng, k):
            while True:
                p = (1 << k) | rng.getrandbits(k) | 1
                if irreducible_prime_degree(p, k):
                    return p


        def reduction_table(p, k):
            """Multiples of p whose bits k..k+15 equal the index: table[t] = t*X^k - (t*X^k mod p)."""
            table = [0] * 65536
            for j in range(16):
                top = 1 << (k + j)
                table[1 << j] = top ^ pmod_small(top, p, k)
            for t in range(3, 65536):
                low = t & -t
                if t != low:
                    table[t] = table[t ^ low] ^ table[low]
            return table


        def big_mod(c, p, k, table):
            """c mod p for a bit-packed polynomial c of any degree (Horner in base X^16)."""
            if c == 0:
                return 0
            nwords = (c.bit_length() + 15) // 16
            words = array("H")
            words.frombytes(c.to_bytes(2 * nwords, "big"))
            if sys.byteorder == "little":
                words.byteswap()
            rem = 0
            for word in words:
                rem = (rem << 16) | word
                rem ^= table[rem >> k]
            return rem


        def check_tools(label):
            p = random_irreducible(stream(label + "|check"), CHECK_DEGREE)
            return p, reduction_table(p, CHECK_DEGREE)


        def mulmod_small(x, y, p):
            return pmod_small(clmul_small(x, y), p, CHECK_DEGREE)


        def verify_product(a, b, c, p, table):
            start = time.perf_counter()
            va, vb, vc = (big_mod(x, p, CHECK_DEGREE, table) for x in (a, b, c))
            holds = mulmod_small(va, vb, p) == vc
            degree_ok = c.bit_length() == a.bit_length() + b.bit_length() - 1
            return {"identity_holds": holds, "degree_ok": degree_ok, "verified": holds and degree_ok,
                    "check_modulus_hex": format(p, "x"),
                    "verify_seconds": round(time.perf_counter() - start, 3)}


        def verify_sqrmod(A, H, Q, R, p, table):
            start = time.perf_counter()
            va, vh, vq, vr = (big_mod(x, p, CHECK_DEGREE, table) for x in (A, H, Q, R))
            holds = mulmod_small(va, va, p) == (mulmod_small(vq, vh, p) ^ vr)
            degree_ok = R.bit_length() < H.bit_length()
            return {"identity_holds": holds, "degree_ok": degree_ok, "verified": holds and degree_ok,
                    "check_modulus_hex": format(p, "x"),
                    "verify_seconds": round(time.perf_counter() - start, 3)}


        def make_np():
            import numpy as np

            stats = {"max_round_error": 0.0, "block_products": 0, "block": NP_BLOCK}

            def bits_of(x):
                nbits = x.bit_length()
                raw = np.frombuffer(x.to_bytes((nbits + 7) // 8, "little"), dtype=np.uint8)
                return np.unpackbits(raw, bitorder="little")[:nbits]

            def int_of(bits):
                return int.from_bytes(np.packbits(bits, bitorder="little").tobytes(), "little")

            def fft_len(n):
                best = 2
                while best < n:
                    best *= 2
                f5 = 1
                while f5 < best:
                    f35 = f5
                    while f35 < best:
                        m = f35
                        while m < n:
                            m *= 2
                        if m % 2 == 0 and m < best:
                            best = m
                        f35 *= 3
                    f5 *= 5
                return best

            def mul(a, b):
                if a == 0 or b == 0:
                    return 0
                abits = bits_of(a)
                bbits = bits_of(b)
                na, nb = abits.shape[0], bbits.shape[0]
                out = np.zeros(na + nb - 1, dtype=np.uint8)
                lb_max = min(nb, NP_BLOCK)
                for i0 in range(0, na, NP_BLOCK):
                    ablk = abits[i0:i0 + NP_BLOCK].astype(np.float64)
                    la = ablk.shape[0]
                    length = fft_len(la + lb_max - 1)
                    fa = np.fft.rfft(ablk, length)
                    del ablk
                    for j0 in range(0, nb, NP_BLOCK):
                        bblk = bbits[j0:j0 + NP_BLOCK].astype(np.float64)
                        n = la + bblk.shape[0] - 1
                        fb = np.fft.rfft(bblk, length)
                        del bblk
                        fb *= fa
                        c = np.fft.irfft(fb, length)
                        del fb
                        c = c[:n]
                        r = np.rint(c)
                        np.subtract(c, r, out=c)
                        np.abs(c, out=c)
                        err = float(c.max())
                        del c
                        stats["block_products"] += 1
                        if err > stats["max_round_error"]:
                            stats["max_round_error"] = err
                        if not err < ROUND_GUARD:
                            raise RoundingGuard("E-NP rounding error %r at block (%d, %d)" % (err, i0, j0))
                        np.fmod(r, 2.0, out=r)
                        out[i0 + j0:i0 + j0 + n] ^= r.astype(np.uint8)
                        del r
                    del fa
                return int_of(out)

            return mul, stats, {"engine": "E-NP", "numpy": np.__version__}


        def make_dec():
            import decimal

            context = decimal.Context(prec=decimal.MAX_PREC, Emax=decimal.MAX_EMAX,
                                      Emin=decimal.MIN_EMIN,
                                      traps=[decimal.Inexact, decimal.Rounded, decimal.InvalidOperation,
                                             decimal.Overflow, decimal.DivisionByZero])
            parity = str.maketrans("0123456789", "0101010101")
            stats = {"digits_per_coefficient": []}

            def mul(a, b):
                if a == 0 or b == 0:
                    return 0
                k = len(str(min(a.bit_length(), b.bit_length())))
                table = {48: "0" * k, 49: "0" * (k - 1) + "1"}
                if k not in stats["digits_per_coefficient"]:
                    stats["digits_per_coefficient"].append(k)
                x = decimal.Decimal(format(a, "b").translate(table))
                y = decimal.Decimal(format(b, "b").translate(table))
                product = context.multiply(x, y)
                del x, y
                text = str(product)
                del product
                return int(text[(len(text) - 1) % k::k].translate(parity), 2)

            return mul, stats, {"engine": "E-DEC", "decimal": decimal.__version__,
                                "libmpdec": getattr(decimal, "__libmpdec_version__", "unknown")}


        def square_spread(a):
            if a == 0:
                return 0
            return int(format(a, "b").translate(SQ_TABLE), 2)


        def reverse_bits(x, width):
            return int(format(x, "0%db" % width)[::-1], 2)


        def barrett_mu(H, D, mul):
            """mu = X^(2D) div H for monic H of degree D, by Newton inversion of rev(H) mod X^(D+1)."""
            f = reverse_bits(H, D + 1)
            g = 1
            precision = 1
            while precision < D + 1:
                precision = min(2 * precision, D + 1)
                mask = (1 << precision) - 1
                g = mul(f & mask, square_spread(g) & mask) & mask
            return reverse_bits(g, D + 1)


        def barrett_sqrmod(A, H, D, mu, mul):
            S = square_spread(A)
            Q = mul(S >> D, mu) >> D
            R = S ^ mul(Q, H)
            return Q, R


        def main(argv):
            if len(argv) != 5 or argv[1] not in ("np", "dec") or argv[2] not in ("mul", "sqrmod"):
                print(__doc__, file=sys.stderr)
                return 2
            engine_name, op, degree_text = argv[1], argv[2], argv[3]
            degree = parse_degree(degree_text)
            seed = int(argv[4])
            limit_error = None
            try:
                resource.setrlimit(resource.RLIMIT_AS, (AS_LIMIT, AS_LIMIT))
            except (ValueError, OSError) as error:
                limit_error = str(error)
            for name in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "MKL_NUM_THREADS"):
                os.environ[name] = "1"
            label = "r1-bench|%s|%d|%d" % (op, degree, seed)
            item = "%s/%s/%s" % (engine_name, op, degree_text)
            try:
                nproc = len(os.sched_getaffinity(0))
            except (AttributeError, OSError):
                nproc = None
            emit({"kind": "header", "item": item, "engine": engine_name, "op": op, "degree": degree,
                  "degree_text": degree_text, "seed": seed, "operand_label": label,
                  "python": sys.version, "executable": sys.executable,
                  "machine": platform.machine(), "platform": platform.platform(),
                  "cpu_count": os.cpu_count(), "nproc": nproc, "loadavg_before": read_loadavg(),
                  "rlimit_as": list(resource.getrlimit(resource.RLIMIT_AS)), "rlimit_error": limit_error,
                  "importable": {name: importlib.util.find_spec(name) is not None
                                 for name in ("numpy", "gmpy2", "flint", "scipy", "galois")}})
            record = {"kind": "result", "item": item}
            stats = {}
            wall = time.perf_counter()
            try:
                mul, stats, version = make_np() if engine_name == "np" else make_dec()
                record["engine_version"] = version
                rng = stream(label)
                p, table = check_tools(label)
                if op == "mul":
                    a = random_monic(rng, degree)
                    b = random_monic(rng, degree)
                    emit({"kind": "progress", "item": item, "stage": "operands ready"})
                    start = time.perf_counter()
                    c = mul(a, b)
                    record["seconds_product"] = round(time.perf_counter() - start, 3)
                    emit({"kind": "progress", "item": item, "stage": "product done",
                          "seconds_product": record["seconds_product"]})
                    record["verification"] = verify_product(a, b, c, p, table)
                else:
                    H = random_monic(rng, degree)
                    A = random_monic(rng, degree - 1)
                    emit({"kind": "progress", "item": item, "stage": "operands ready"})
                    start = time.perf_counter()
                    mu = barrett_mu(H, degree, mul)
                    record["seconds_precompute"] = round(time.perf_counter() - start, 3)
                    emit({"kind": "progress", "item": item, "stage": "precompute done",
                          "seconds_precompute": record["seconds_precompute"]})
                    start = time.perf_counter()
                    Q, R = barrett_sqrmod(A, H, degree, mu, mul)
                    record["seconds_squaring"] = round(time.perf_counter() - start, 3)
                    record["seconds_per_squaring_amortized_131"] = round(
                        record["seconds_squaring"] + record["seconds_precompute"] / 131.0, 3)
                    emit({"kind": "progress", "item": item, "stage": "squaring done",
                          "seconds_squaring": record["seconds_squaring"]})
                    record["verification"] = verify_sqrmod(A, H, Q, R, p, table)
                verified = record["verification"]["verified"]
                record["status"] = "ok" if verified else "verification_failed"
                code = 0 if verified else 4
            except MemoryError as error:
                record["status"] = "MemoryError"
                record["detail"] = str(error)[:300]
                code = 3
            except RoundingGuard as error:
                record["status"] = "rounding_guard"
                record["detail"] = str(error)
                code = 5
            except Exception as error:
                record["status"] = "exception"
                record["detail"] = "%s: %s" % (type(error).__name__, str(error)[:300])
                code = 1
            record["engine_stats"] = stats
            record["seconds_wall_item"] = round(time.perf_counter() - wall, 3)
            record["peak_rss_bytes"] = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024
            record["proc_status"] = proc_status()
            record["loadavg_after"] = read_loadavg()
            emit(record)
            return code


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
    gcd_bench_code:
      purpose: R-C6 gcd rates (DR-5, DR-6). Defines the declared classical gcd (WO-I-14).
      reference_sha256: 302f926313cf6d1811ef84285cb8e18006a9643e874882a4c46be1eab1c042e2
      source: |
        """Classical-gcd benchmark for the EXP-QSP-70b731 r1 revision design (TASK-20261002-01d26d).

        DESIGN FIGURE ONLY (R-C6). Times the DECLARED I_indep gcd -- the classical
        Euclidean algorithm on bit-packed CPython integers, reducing a modulo b by repeated
        a ^= b << (deg a - deg b) -- on one random pair (a, b) of degrees D and D - 1 with a
        planted common factor g0 of degree 32: a = g0*u, b = g0*v with g0, u, v uniformly
        random monic polynomials from a seed-derived stream. No operand is a lambda, an L,
        an H, a composite iterate or X^(2^n) - X, and none is built from any declared cell.
        RLIMIT_AS = 8 GiB is set inside the process.
        Verification (exact): the returned r is nonzero, g0 divides r, and r divides a and
        b (remainders computed 16 bits at a time). That r is the GREATEST common divisor
        follows from the Euclidean recurrence (each step replaces (a, b) by (a + X^k b, b),
        which keeps the set of common divisors, and the loop ends at a zero remainder); it
        is not certified by a second method.

        Usage (importing this module executes nothing):
            python3 gcd_bench_code.py DEGREE SEED      (DEGREE an integer or 'b^e', >= 64)
        Exit codes: 0 verified; 2 usage; 3 MemoryError; 4 verification failed; 1 other.
        """
        import hashlib
        import json
        import os
        import platform
        import random
        import resource
        import sys
        import time
        from array import array

        AS_LIMIT = 8 * 2 ** 30


        def emit(record):
            print(json.dumps(record, sort_keys=True), flush=True)


        def read_loadavg():
            try:
                with open("/proc/loadavg", encoding="ascii") as handle:
                    return handle.read().strip()
            except OSError as error:
                return "unavailable: %s" % error


        def proc_status():
            out = {}
            try:
                with open("/proc/self/status", encoding="utf-8", errors="replace") as handle:
                    for line in handle:
                        key, _, value = line.partition(":")
                        if key in ("VmPeak", "VmHWM", "VmSize", "VmRSS"):
                            out[key + "_kB"] = int(value.split()[0])
            except (OSError, ValueError, IndexError) as error:
                out["error"] = str(error)
            return out


        def parse_degree(text):
            if "^" in text:
                base, exponent = text.split("^", 1)
                return int(base) ** int(exponent)
            return int(text)


        def stream(label):
            digest = hashlib.sha256(label.encode("utf-8")).digest()
            return random.Random(int.from_bytes(digest[:8], "big"))


        def random_monic(rng, degree):
            return rng.getrandbits(degree) | (1 << degree)


        def pmod_small(x, p, k):
            while x.bit_length() > k:
                x ^= p << (x.bit_length() - 1 - k)
            return x


        def reduction_table(p, k):
            table = [0] * 65536
            for j in range(16):
                top = 1 << (k + j)
                table[1 << j] = top ^ pmod_small(top, p, k)
            for t in range(3, 65536):
                low = t & -t
                if t != low:
                    table[t] = table[t ^ low] ^ table[low]
            return table


        def big_mod(c, p, k, table):
            if c == 0:
                return 0
            nwords = (c.bit_length() + 15) // 16
            words = array("H")
            words.frombytes(c.to_bytes(2 * nwords, "big"))
            if sys.byteorder == "little":
                words.byteswap()
            rem = 0
            for word in words:
                rem = (rem << 16) | word
                rem ^= table[rem >> k]
            return rem


        def divides(divisor, dividend):
            k = divisor.bit_length() - 1
            if k == 0:
                return True
            return big_mod(dividend, divisor, k, reduction_table(divisor, k)) == 0


        def small_mul(g, u):
            out = 0
            i = 0
            while g:
                if g & 1:
                    out ^= u << i
                g >>= 1
                i += 1
            return out


        def gcd_classical(a, b):
            """The declared I_indep gcd: classical Euclid on bit-packed integers."""
            steps = 0
            while b:
                db = b.bit_length()
                la = a.bit_length()
                while la >= db:
                    a ^= b << (la - db)
                    la = a.bit_length()
                    steps += 1
                a, b = b, a
            return a, steps


        def main(argv):
            if len(argv) != 3:
                print(__doc__, file=sys.stderr)
                return 2
            degree_text = argv[1]
            degree = parse_degree(degree_text)
            seed = int(argv[2])
            if degree < 64:
                print(__doc__, file=sys.stderr)
                return 2
            limit_error = None
            try:
                resource.setrlimit(resource.RLIMIT_AS, (AS_LIMIT, AS_LIMIT))
            except (ValueError, OSError) as error:
                limit_error = str(error)
            item = "gcd/%s" % degree_text
            label = "r1-bench|gcd|%d|%d" % (degree, seed)
            try:
                nproc = len(os.sched_getaffinity(0))
            except (AttributeError, OSError):
                nproc = None
            emit({"kind": "header", "item": item, "degree": degree, "degree_text": degree_text,
                  "seed": seed, "operand_label": label, "python": sys.version,
                  "executable": sys.executable, "machine": platform.machine(),
                  "platform": platform.platform(), "cpu_count": os.cpu_count(), "nproc": nproc,
                  "loadavg_before": read_loadavg(),
                  "rlimit_as": list(resource.getrlimit(resource.RLIMIT_AS)), "rlimit_error": limit_error})
            record = {"kind": "result", "item": item}
            wall = time.perf_counter()
            try:
                rng = stream(label)
                g0 = random_monic(rng, 32)
                a = small_mul(g0, random_monic(rng, degree - 32))
                b = small_mul(g0, random_monic(rng, degree - 33))
                emit({"kind": "progress", "item": item, "stage": "operands ready"})
                start = time.perf_counter()
                r, steps = gcd_classical(a, b)
                record["seconds_gcd"] = round(time.perf_counter() - start, 3)
                record["steps"] = steps
                record["gcd_degree"] = r.bit_length() - 1
                start = time.perf_counter()
                planted = r != 0 and divides(g0, r)
                if r == 0 or r.bit_length() - 1 > 4096:
                    common = None
                else:
                    common = divides(r, a) and divides(r, b)
                verified = bool(planted and common)
                record["verification"] = {"nonzero": r != 0, "planted_factor_divides_result": planted,
                                          "result_divides_both_operands": common, "verified": verified,
                                          "maximality": "by the Euclidean recurrence; not separately certified",
                                          "verify_seconds": round(time.perf_counter() - start, 3)}
                record["status"] = "ok" if verified else "verification_failed"
                code = 0 if verified else 4
            except MemoryError as error:
                record["status"] = "MemoryError"
                record["detail"] = str(error)[:300]
                code = 3
            except Exception as error:
                record["status"] = "exception"
                record["detail"] = "%s: %s" % (type(error).__name__, str(error)[:300])
                code = 1
            record["seconds_wall_item"] = round(time.perf_counter() - wall, 3)
            record["peak_rss_bytes"] = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024
            record["proc_status"] = proc_status()
            record["loadavg_after"] = read_loadavg()
            emit(record)
            return code


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
    elim_bench_code:
      purpose: R-C6 Gaussian elimination over F_2 (S-BERL projections).
      reference_sha256: 2aa44d1fc8dbea06d5dbe2bccdcf83cd9ac3a13248763c15e1e118feb7da0a9d
      source: |
        """F_2 Gaussian-elimination benchmark for the EXP-QSP-70b731 r1 revision design
        (TASK-20261002-01d26d), R-C6 (S-BERL projections).

        DESIGN FIGURE ONLY. Times forward elimination of a uniformly random m x m matrix
        over F_2, m = 2^K, rows bit-packed in CPython integers and augmented by their
        combination vectors, pivoting on leading bits (rows grouped by bit length), which
        yields the rank and a basis of the left kernel: the operation S-BERL performs on
        Q - I. The matrix is random (seed-derived), never a Berlekamp matrix of any cell.
        RLIMIT_AS = 8 GiB is set inside the process.
        Verification: every left-kernel vector w satisfies w M = 0 exactly; the kernel
        vectors are independent (distinct leading bits after mutual reduction); the
        reduced nonzero rows have distinct leading bits; and E = T M (T the tracked
        combinations, E the reduced rows) passes Freivalds' test with 64 random vectors,
        so a false E passes with probability at most 2^-64. rank + nullity = m then
        certifies the rank.

        Usage (importing this module executes nothing):
            python3 elim_bench_code.py K SEED
        Exit codes: 0 verified; 2 usage; 3 MemoryError; 4 verification failed; 1 other.
        """
        import hashlib
        import json
        import os
        import random
        import resource
        import sys
        import time

        AS_LIMIT = 8 * 2 ** 30


        def emit(record):
            print(json.dumps(record, sort_keys=True), flush=True)


        def read_loadavg():
            try:
                with open("/proc/loadavg", encoding="ascii") as handle:
                    return handle.read().strip()
            except OSError as error:
                return "unavailable: %s" % error


        def proc_status():
            out = {}
            try:
                with open("/proc/self/status", encoding="utf-8", errors="replace") as handle:
                    for line in handle:
                        key, _, value = line.partition(":")
                        if key in ("VmPeak", "VmHWM", "VmSize", "VmRSS"):
                            out[key + "_kB"] = int(value.split()[0])
            except (OSError, ValueError, IndexError) as error:
                out["error"] = str(error)
            return out


        def stream(label):
            digest = hashlib.sha256(label.encode("utf-8")).digest()
            return random.Random(int.from_bytes(digest[:8], "big"))


        def eliminate(rows, m):
            buckets = {}
            for i, row in enumerate(rows):
                aug = (row << m) | (1 << i)
                buckets.setdefault(aug.bit_length(), []).append(aug)
            echelon = []
            xors = 0
            for top in range(2 * m, m, -1):
                group = buckets.pop(top, None)
                if not group:
                    continue
                pivot = group[0]
                echelon.append(pivot)
                for row in group[1:]:
                    row ^= pivot
                    xors += 1
                    buckets.setdefault(row.bit_length(), []).append(row)
            kernel = [row for key in sorted(buckets) for row in buckets[key]]
            return echelon, kernel, xors


        def verify(rows, m, echelon, kernel, rng):
            mask = (1 << m) - 1
            kernel_exact = True
            for w in kernel:
                if w >> m:
                    kernel_exact = False
                    break
                acc = 0
                c = w
                while c:
                    low = c & -c
                    acc ^= rows[low.bit_length() - 1]
                    c ^= low
                if acc:
                    kernel_exact = False
                    break
            basis = {}
            independent = True
            for w in kernel:
                x = w
                while x:
                    lead = x.bit_length()
                    if lead in basis:
                        x ^= basis[lead]
                    else:
                        basis[lead] = x
                        break
                if not x:
                    independent = False
                    break
            distinct = len({e.bit_length() for e in echelon}) == len(echelon)
            freivalds = True
            for _ in range(64):
                x = rng.getrandbits(m)
                y_bits = "".join("1" if (row & x).bit_count() & 1 else "0" for row in reversed(rows))
                y = int(y_bits, 2)
                for e in echelon:
                    if ((e & mask) & y).bit_count() & 1 != ((e >> m) & x).bit_count() & 1:
                        freivalds = False
                        break
                if not freivalds:
                    break
            rank_certified = (kernel_exact and independent and distinct and freivalds
                              and len(echelon) + len(kernel) == m)
            return {"kernel_vectors_exact": kernel_exact, "kernel_independent": independent,
                    "echelon_leading_bits_distinct": distinct, "freivalds_64": freivalds,
                    "rank_plus_nullity_equals_m": len(echelon) + len(kernel) == m,
                    "verified": rank_certified}


        def main(argv):
            if len(argv) != 3:
                print(__doc__, file=sys.stderr)
                return 2
            k, seed = int(argv[1]), int(argv[2])
            m = 1 << k
            limit_error = None
            try:
                resource.setrlimit(resource.RLIMIT_AS, (AS_LIMIT, AS_LIMIT))
            except (ValueError, OSError) as error:
                limit_error = str(error)
            item = "elim/2^%d" % k
            try:
                nproc = len(os.sched_getaffinity(0))
            except (AttributeError, OSError):
                nproc = None
            emit({"kind": "header", "item": item, "m": m, "seed": seed, "python": sys.version,
                  "cpu_count": os.cpu_count(), "nproc": nproc, "loadavg_before": read_loadavg(),
                  "rlimit_as": list(resource.getrlimit(resource.RLIMIT_AS)), "rlimit_error": limit_error})
            record = {"kind": "result", "item": item, "m": m}
            wall = time.perf_counter()
            try:
                rng = stream("r1-bench|elim|%d|%d" % (k, seed))
                rows = [rng.getrandbits(m) for _ in range(m)]
                start = time.perf_counter()
                echelon, kernel, xors = eliminate(rows, m)
                record["seconds_elimination"] = round(time.perf_counter() - start, 3)
                record["rank"] = len(echelon)
                record["nullity"] = len(kernel)
                record["row_xors"] = xors
                start = time.perf_counter()
                record["verification"] = verify(rows, m, echelon, kernel, stream("r1-bench|elim-check|%d|%d" % (k, seed)))
                record["verification"]["verify_seconds"] = round(time.perf_counter() - start, 3)
                verified = record["verification"]["verified"]
                record["status"] = "ok" if verified else "verification_failed"
                code = 0 if verified else 4
            except MemoryError as error:
                record["status"] = "MemoryError"
                record["detail"] = str(error)[:300]
                code = 3
            except Exception as error:
                record["status"] = "exception"
                record["detail"] = "%s: %s" % (type(error).__name__, str(error)[:300])
                code = 1
            record["seconds_wall_item"] = round(time.perf_counter() - wall, 3)
            record["peak_rss_bytes"] = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024
            record["proc_status"] = proc_status()
            record["loadavg_after"] = read_loadavg()
            emit(record)
            return code


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
    path_canon_code:
      purpose: R-C8 demonstration and reference for DR-3 (WO-R-11, WO-R-22; AC-11, AC-16, AC-28).
      reference_sha256: 2cf9b88446896010f6faa8767f0038bfefc5d0298523f6082624622003e18b28
      source: |
        """Read-declaration canonicaliser and blind_from matcher for the EXP-QSP-70b731 r1
        revision design (TASK-20261002-01d26d): the reference that the r1 runner's
        readset.py (WO-R-11, WO-R-22) and the AC-11, AC-16 and AC-28 checks implement, with
        its demonstration (R-C8) on the case list the design states. Paths are compared as
        strings plus an injected existence and symlink oracle (a mock tree in the
        demonstration); nothing named is opened, listed or read. Importing this module
        executes nothing; run it through its __main__ entry.
        """
        import hashlib
        import json
        import posixpath
        import re
        import sys

        BLIND_FROM = (
            "experiments/EXP-QSP-33b442/implementation/",
            "experiments/EXP-QSP-33b442/runs/",
            "experiments/EXP-QSP-33b442/execution-report.yaml",
            "experiments/EXP-QSP-33b442/analysis.md",
            "experiments/EXP-QSP-33b442/amendments/",
            "knowledge/techniques/KN-TECH-54c38e.md",
            "coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-5fa7d5/",
            "analysis/qsp-ecc2k130/explore/shape_census_131.json",
            "analysis/qsp-ecc2k130/explore/explore.json",
            "analysis/qsp-ecc2k130/explore/explore_fast.json",
        )
        SEALED_TREE = "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3"
        SEGMENT = re.compile(r"[A-Za-z0-9_.@+=,-]+\Z")


        def path_problems(path):
            """Reasons a declared path is not a bare canonical repo-relative POSIX path."""
            if not isinstance(path, str):
                return ["path is not a string"]
            if not path:
                return ["empty path"]
            problems = []
            if path != path.strip():
                problems.append("surrounding whitespace")
            if not path.isascii():
                problems.append("non-ASCII character (no Unicode normalisation form is canonical)")
            if path.startswith("/"):
                problems.append("absolute path")
            if path.endswith("/"):
                problems.append("trailing slash")
            if "\\" in path:
                problems.append("backslash")
            for part in path.split("/"):
                if part == "":
                    problems.append("empty segment")
                elif part in (".", ".."):
                    problems.append("dot segment")
                elif not SEGMENT.match(part):
                    problems.append("segment outside [A-Za-z0-9_.@+=,-]")
            if not problems and posixpath.normpath(path) != path:
                problems.append("not normalised")
            return sorted(set(problems))


        def blind_hit(path, blind=BLIND_FROM):
            """The blind_from entry the path equals, lies inside, or is a parent of (also case-folded)."""
            for entry in blind:
                target = entry[:-1] if entry.endswith("/") else entry
                for x, y in ((path, target), (path.casefold(), target.casefold())):
                    if x == y or x.startswith(y + "/") or y.startswith(x + "/"):
                        return entry
            return None


        def evaluate_declaration(entries, exists, symlinked, blind=BLIND_FROM, exempt=None):
            """entries: None (declaration file missing) or the parsed list. Returns (respected, findings)."""
            if entries is None:
                return False, ["declaration file missing"]
            if not isinstance(entries, list) or not entries:
                return False, ["declaration empty or not a list"]
            findings = []
            for index, entry in enumerate(entries):
                if not isinstance(entry, dict) or "path" not in entry or set(entry) - {"path", "extent"}:
                    findings.append("entry %d: not a {path, extent} mapping" % index)
                    continue
                path = entry["path"]
                problems = path_problems(path)
                if "extent" in entry and not isinstance(entry["extent"], str):
                    problems.append("extent is not a string")
                if not problems:
                    if symlinked(path):
                        problems.append("traverses a symlink")
                    elif not exists(path):
                        problems.append("does not exist in the checkout")
                if problems:
                    findings.append("entry %d %r: non-canonical (%s)" % (index, path, "; ".join(problems)))
                    continue
                hit = blind_hit(path, blind)
                if hit and not (exempt and exempt(path)):
                    findings.append("entry %d %r: blind_from hit (%s)" % (index, path, hit))
            return not findings, findings


        def chain_digest(blocks):
            body = [{key: value for key, value in block.items() if key != "prefix_sha256"} for block in blocks]
            return hashlib.sha256(json.dumps(body, sort_keys=True).encode("utf-8")).hexdigest()


        def with_chain(blocks):
            out = []
            for block in blocks:
                block = dict(block)
                block["prefix_sha256"] = chain_digest(out)
                out.append(block)
            return out


        def in_sealed_tree(path):
            return path == SEALED_TREE or path.startswith(SEALED_TREE + "/")


        def evaluate_execution(blocks, trial_id, freeze_verified, exists, symlinked, blind=BLIND_FROM):
            """M9 of one trial over the append-only execution declaration (WO-R-22)."""
            for index, block in enumerate(blocks):
                if block.get("prefix_sha256") != chain_digest(blocks[:index]):
                    return False, ["hash chain broken at block %d" % index]
            own = [index for index, block in enumerate(blocks) if block.get("trial") == trial_id]
            if len(own) != 1:
                return False, ["trial %s has %d blocks (exactly one required)" % (trial_id, len(own))]
            findings = []
            for block in blocks[:own[0] + 1]:
                exempt = None
                if block.get("exemption") == "post_freeze_sealed_read":
                    if trial_id == "stage-compare-sealed" and freeze_verified:
                        exempt = in_sealed_tree
                    else:
                        findings.append("exemption of block %s not honoured for trial %s"
                                        % (block.get("trial"), trial_id))
                ok, more = evaluate_declaration(block.get("entries"), exists, symlinked, blind, exempt)
                findings.extend(more)
            return not findings, findings


        CLEAN = [
            "ledger/hypotheses/H-QSP-cd0c90.yaml",
            "ledger/proposals/IDEA-20260916-3f7a1c.yaml",
            "experiments/EXP-QSP-70b731/specification.yaml",
        ]
        MOCK_FILES = set(CLEAN) | {
            "experiments/EXP-QSP-33b442/runs/mock-run/mock-file.json",
            "experiments/EXP-QSP-33b442/implementation/x.py",
            "experiments/EXP-QSP-33b442/analysis.md",
            "experiments/EXP-QSP-33b442/execution-report.yaml",
            "experiments/EXP-QSP-33b442/amendments/mock.yaml",
            "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3/mock-cell.json",
            "knowledge/techniques/KN-TECH-54c38e.md",
            "knowledge/techniques/KN-TECH-54c38e.md.bak",
            "coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-5fa7d5/mock.txt",
            "analysis/qsp-ecc2k130/explore/shape_census_131.json",
            "analysis/qsp-ecc2k130/explore/explore.json",
            "analysis/qsp-ecc2k130/explore/explore_fast.json",
            "experiments/EXP-QSP-33b4420/notes.md",
            "mock/link-to-33b442/analysis.md",
        }
        SYMLINKS = {"mock/link-to-33b442"}


        def mock_exists(path):
            return path in MOCK_FILES or any(name.startswith(path + "/") for name in MOCK_FILES)


        def mock_symlinked(path):
            parts = path.split("/")
            return any("/".join(parts[:i]) in SYMLINKS for i in range(1, len(parts) + 1))


        def decl(*paths):
            return [{"path": p, "extent": "full"} for p in paths]


        CASES = [
            ("a", "clean declaration", [decl(*CLEAN)], True),
            ("b", "blind_from directory as the specification writes it", [decl(*CLEAN, "experiments/EXP-QSP-33b442/runs/")], False),
            ("c", "empty declaration", [[]], False),
            ("d", "declaration file missing", [None], False),
            ("e", "file under a blind_from directory", [decl(*CLEAN, "experiments/EXP-QSP-33b442/runs/mock-run/mock-file.json")], False),
            ("f", "blind_from file in the 'path (extent)' form", [decl(*CLEAN, "knowledge/techniques/KN-TECH-54c38e.md (full)")], False),
            ("g", "absolute path to a blind_from file", [decl(*CLEAN, "/home/user/crypto-autoresearcher/analysis/qsp-ecc2k130/explore/explore.json")], False),
            ("h", "'./' prefix on a blind_from directory member", [decl(*CLEAN, "./experiments/EXP-QSP-33b442/implementation/x.py")], False),
            ("i", "blind_from directory without its trailing slash", [decl(*CLEAN, "experiments/EXP-QSP-33b442/runs")], False),
            ("j", "'..' traversal to a blind_from file", [decl(*CLEAN, "experiments/EXP-QSP-70b731/../EXP-QSP-33b442/analysis.md")], False),
            ("k", "parent directory of blind_from entries, trailing slash", [decl(*CLEAN, "experiments/EXP-QSP-33b442/")], False),
            ("k2", "parent directory of blind_from entries, canonical form", [decl(*CLEAN, "experiments/EXP-QSP-33b442")], False),
            ("l", "directory with an extent annotation in the path", [decl(*CLEAN, "experiments/EXP-QSP-33b442/amendments/ (file names only)")], False),
            ("m", "trailing '/.'", [decl(*CLEAN, "experiments/EXP-QSP-33b442/runs/.")], False),
            ("n", "doubled slash", [decl(*CLEAN, "experiments//EXP-QSP-33b442/analysis.md")], False),
            ("o", "backslash separators", [decl(*CLEAN, "experiments\\EXP-QSP-33b442\\analysis.md")], False),
            ("p", "symlinked parent resolving into a blind_from entry", [decl(*CLEAN, "mock/link-to-33b442/analysis.md")], False),
            ("q", "non-ASCII look-alike hyphen", [decl(*CLEAN, "experiments/EXP‐QSP-33b442/analysis.md")], False),
            ("q2", "decomposed accent (NFD form)", [decl(*CLEAN, "knowledge/techniques/KN-TECH-54c38é.md")], False),
            ("r", "percent-encoded segment", [decl(*CLEAN, "experiments/EXP-QSP-33b442%2Fruns")], False),
            ("s", "glob string", [decl(*CLEAN, "experiments/EXP-QSP-33b442/**")], False),
            ("s2", "git pathspec string", [decl(*CLEAN, ":(glob)experiments/EXP-QSP-33b442/runs/*")], False),
            ("t", "extent in parentheses without a space", [decl(*CLEAN, "experiments/EXP-QSP-33b442/analysis.md(lines-1-20)")], False),
            ("u", "case variant of a blind_from file", [decl(*CLEAN, "Experiments/EXP-QSP-33B442/analysis.md")], False),
            ("v", "bare top-level directory above blind_from entries", [decl(*CLEAN, "analysis")], False),
            ("w", "bare string entries instead of {path, extent} mappings", [list(CLEAN)], False),
            ("x", "relative fragment naming no checkout path", [decl(*CLEAN, "EXP-QSP-33b442/runs")], False),
            ("y", "surrounding whitespace", [decl(*CLEAN, " experiments/EXP-QSP-33b442/analysis.md")], False),
            ("z", "two clean declarations (I_indep and runner reports)", [decl(*CLEAN), decl(CLEAN[0])], True),
            ("z2", "one clean declaration and one with a hit", [decl(*CLEAN), decl("knowledge/techniques/KN-TECH-54c38e.md")], False),
            ("ctl1", "decoy sibling directory sharing a string prefix (legitimate)", [decl(*CLEAN, "experiments/EXP-QSP-33b4420/notes.md")], True),
            ("ctl2", "decoy file whose name extends a blind_from file name (legitimate)", [decl(*CLEAN, "knowledge/techniques/KN-TECH-54c38e.md.bak")], True),
            ("ctl3", "free text in the extent field (legitimate)", [[{"path": CLEAN[0], "extent": "lines 1-40 (statement)"}]], True),
        ]

        EXEC_BLOCKS = [
            {"trial": "stage0-hand-gate", "run_id": "RUN-SYNTHETIC-01", "entries": decl(CLEAN[2])},
            {"trial": "stage2-bandL-n3", "run_id": "RUN-SYNTHETIC-02", "entries": decl(CLEAN[0])},
            {"trial": "stage4-bandH-n33", "run_id": "RUN-SYNTHETIC-03", "entries": decl(CLEAN[1])},
            {"trial": "stage-compare-sealed", "run_id": "RUN-SYNTHETIC-04",
             "entries": decl(SEALED_TREE + "/mock-cell.json"), "exemption": "post_freeze_sealed_read"},
        ]


        def exec_cases():
            chained = with_chain(EXEC_BLOCKS)
            rerun = with_chain(EXEC_BLOCKS + [{"trial": "stage4-bandH-n44", "run_id": "RUN-SYNTHETIC-05",
                                               "entries": decl(CLEAN[1])}])
            outside = with_chain(EXEC_BLOCKS[:3] + [dict(EXEC_BLOCKS[3],
                                                         entries=decl("experiments/EXP-QSP-33b442/implementation/x.py"))])
            tampered = [dict(block) for block in chained]
            tampered[1]["entries"] = decl(CLEAN[1])
            return [
                ("E1", "Band-L trial with a clean prefix", chained, "stage2-bandL-n3", True, True),
                ("E2", "COMPARE after verified freezes, sealed read exempt", chained, "stage-compare-sealed", True, True),
                ("E3", "COMPARE with unverified freezes", chained, "stage-compare-sealed", False, False),
                ("E4", "Band-H re-run whose prefix contains the sealed read", rerun, "stage4-bandH-n44", True, False),
                ("E5", "exemption claimed outside the sealed tree", outside, "stage-compare-sealed", True, False),
                ("E6", "trial without a block of its own", chained, "stage3-bridge-n22", True, False),
                ("E7", "an earlier block edited after the chain was written", tampered, "stage-compare-sealed", True, False),
            ]


        def main():
            all_met = True
            for case_id, label, declarations, expected in CASES:
                findings = []
                respected = True
                for entries in declarations:
                    ok, more = evaluate_declaration(entries, mock_exists, mock_symlinked)
                    respected = respected and ok
                    findings.extend(more)
                met = respected == expected
                all_met = all_met and met
                print(json.dumps({"case": case_id, "label": label, "expected_respected": expected,
                                  "blind_from_respected": respected, "met": met,
                                  "first_finding": findings[0] if findings else None}, sort_keys=True))
            for case_id, label, blocks, trial, freeze, expected in exec_cases():
                respected, findings = evaluate_execution(blocks, trial, freeze, mock_exists, mock_symlinked)
                met = respected == expected
                all_met = all_met and met
                print(json.dumps({"case": case_id, "label": label, "trial": trial, "freeze_verified": freeze,
                                  "expected_respected": expected, "blind_from_respected": respected,
                                  "met": met, "first_finding": findings[0] if findings else None}, sort_keys=True))
            print(json.dumps({"summary": "path-canonicaliser", "all_expectations_met": all_met}))
            return 0 if all_met else 1


        if __name__ == "__main__":
            sys.exit(main())
    cert_accounting_code:
      purpose: R-C8 demonstration and reference for DR-2 (WO-R-7 to WO-R-9; AC-3, AC-4).
      reference_sha256: 7de4d01b56ff2e19f4b9615b8999823c3ddab09e4cf4b0516ab8541840457434
      source: |
        """Per-row certificate binding and accounting for the EXP-QSP-70b731 r1 revision
        design (TASK-20261002-01d26d): the reference that the r1 runner's certs.py,
        accounting.py and check.py (WO-R-7 to WO-R-9) and the AC-3 and AC-4 checks
        implement, with its demonstration (R-C8) on synthetic fixtures over the synthetic
        cell syn-x-05-02 (n = 5, n' = 2, K = F_2[z]/(z^5 + z^2 + 1)), outside every
        declared field degree. Round-1 constructed inputs B2 to B8 are cases (B5 is the
        payload-skip case; B7 appears in its legitimate per-row form and in the refused
        design's shared-file form), with K-coefficient lambda rows. The disk is an
        in-memory dictionary; nothing outside the process is written. Importing this
        module executes nothing; run it through its __main__ entry.
        """
        import hashlib
        import json
        import random
        import sys

        N, N_PRIME, MODULUS, CELL = 5, 2, 0b100101, "syn-x-05-02"


        def kmul(x, y):
            out = 0
            while y:
                if y & 1:
                    out ^= x
                y >>= 1
                x <<= 1
                if x >> N:
                    x ^= MODULUS
            return out


        def frob(x, k):
            for _ in range(k):
                x = kmul(x, x)
            return x


        def modulus_irreducible():
            """Degree 5: irreducible iff no root in F_2 and not divisible by z^2 + z + 1."""
            if not MODULUS & 1 or bin(MODULUS).count("1") % 2 == 0:
                return False
            a, b = MODULUS, 0b111
            while a.bit_length() >= b.bit_length():
                a ^= b << (a.bit_length() - b.bit_length())
            return a != 0


        def lam_eval(lam, x):
            acc = 0
            if isinstance(lam, int):
                for i in range(lam.bit_length() - 1, -1, -1):
                    acc = kmul(acc, x) ^ ((lam >> i) & 1)
                return acc
            for coefficient in reversed(lam):
                acc = kmul(acc, x) ^ coefficient
            return acc


        def lam_text(lam):
            if isinstance(lam, int):
                return format(lam, "x")
            return ".".join(format(c, "x") for c in lam)


        def lam_parse(text):
            if "." in text:
                return tuple(int(c, 16) for c in text.split("."))
            return int(text, 16)


        def lam_key(lam):
            if isinstance(lam, int):
                return "f2-" + format(lam, "x")
            return "k-" + hashlib.sha256(lam_text(lam).encode("ascii")).hexdigest()[:16]


        def roots_of(lam):
            return [x for x in range(1 << N) if frob(x, N_PRIME) == lam_eval(lam, x)]


        def cert_path(row_index, lam):
            return "certs/%s/r%06d-%s.json" % (CELL, row_index, lam_key(lam))


        def sha(blob):
            return hashlib.sha256(blob).hexdigest()


        def make_rows(lams):
            rows = []
            for index, lam in enumerate(lams):
                roots = roots_of(lam)
                rows.append({"row_index": index, "lambda": lam_text(lam), "N": len(roots),
                             "roots": [format(x, "x") for x in roots], "status": "completed",
                             "certificate_path": cert_path(index, lam) if roots else None})
            return rows


        def cert_blob(row, roots=None):
            body = {"schema": "qsp70b731.r1.cert.v2", "cell": CELL, "n": N, "n_prime": N_PRIME,
                    "modulus": format(MODULUS, "x"), "row_index": row["row_index"],
                    "lambda": row["lambda"], "N": row["N"],
                    "roots": row["roots"] if roots is None else roots}
            return json.dumps(body, sort_keys=True).encode("ascii")


        def payload(lams, mode):
            """The payload model: rows, the files it writes, the index and its own accounting."""
            rows = make_rows(lams)
            disk, index = {}, {}
            positive = [row for row in rows if row["N"] > 0]
            for row in positive:
                if mode in ("skip", "swap") and row is positive[0]:
                    continue
                path = row["certificate_path"]
                if mode == "shared":
                    path = "certs/%s/%s.json" % (CELL, lam_key(lam_parse(row["lambda"])))
                    row["certificate_path"] = path
                short = row["roots"][:-1] if mode == "underlist" and row is positive[0] else None
                disk[path] = cert_blob(row, short)
                index[path] = sha(disk[path])
            if mode == "swap":
                phantom = {"row_index": 999, "lambda": "7", "N": 1, "roots": ["1"]}
                path = "certs/%s/r%06d-f2-7.json" % (CELL, 999)
                disk[path] = cert_blob(phantom)
                index[path] = sha(disk[path])
            reported = {"rows_completed": len(rows), "zero_N_rows": sum(1 for row in rows if row["N"] == 0),
                        "certificate_bearing": len(disk), "files_on_disk": len(disk)}
            if mode == "delete":
                del disk[positive[0]["certificate_path"]]
            if mode in ("alter", "alter_reindexed"):
                path = positive[0]["certificate_path"]
                body = json.loads(disk[path])
                body["roots"][0] = format(int(body["roots"][0], 16) ^ 1, "x")
                disk[path] = json.dumps(body, sort_keys=True).encode("ascii")
                if mode == "alter_reindexed":
                    index[path] = sha(disk[path])
            if mode == "inflate":
                reported["certificate_bearing"] += 1
            return rows, disk, index, reported


        def reverify(blob, row):
            cert = json.loads(blob)
            bound = (cert.get("row_index"), cert.get("cell"), cert.get("lambda"), cert.get("N"))
            if bound != (row["row_index"], CELL, row["lambda"], row["N"]):
                return "certificate does not bind this row (row index, cell, lambda, N)"
            lam = lam_parse(cert["lambda"])
            roots = [int(x, 16) for x in cert["roots"]]
            if len(set(roots)) != len(roots):
                return "roots not pairwise distinct"
            if len(roots) != cert["N"]:
                return "root count differs from N"
            for x in roots:
                if not 0 <= x < (1 << N) or frob(x, N_PRIME) != lam_eval(lam, x):
                    return "a listed root does not satisfy x^(2^n') = lambda(x)"
            return None


        def check(rows, disk, index, reported):
            """Exit 3 (F_acct) unless identity_holds recomputed from disk is true, every file
            is bound to exactly one row, and the payload's accounting equals the recomputation."""
            completed = [row for row in rows if row["status"] == "completed"]
            zero = sum(1 for row in completed if row["N"] == 0)
            bearing, bound, findings = 0, set(), []
            for row in completed:
                if row["N"] == 0:
                    if row.get("certificate_path") is not None:
                        findings.append("row %d: N = 0 with a certificate path" % row["row_index"])
                    continue
                path = row.get("certificate_path")
                if path != cert_path(row["row_index"], lam_parse(row["lambda"])):
                    findings.append("row %d: certificate path is not the per-row path" % row["row_index"])
                    continue
                if path in bound:
                    findings.append("row %d: file already bound to another row" % row["row_index"])
                    continue
                blob = disk.get(path)
                if blob is None:
                    findings.append("row %d: certificate file missing" % row["row_index"])
                    continue
                if index.get(path) != sha(blob):
                    findings.append("row %d: certificate hash differs from the index" % row["row_index"])
                    continue
                problem = reverify(blob, row)
                if problem:
                    findings.append("row %d: %s" % (row["row_index"], problem))
                    continue
                bound.add(path)
                bearing += 1
            orphans = sorted(set(disk) - bound)
            if orphans:
                findings.append("files bound to no row: %s" % orphans)
            recomputed = {"rows_completed": len(completed), "zero_N_rows": zero,
                          "certificate_bearing": bearing, "files_on_disk": len(disk)}
            identity = bearing + zero == len(completed)
            if reported != recomputed:
                findings.append("payload accounting differs from the recomputation")
            code = 0 if identity and not orphans and reported == recomputed else 3
            return code, dict(recomputed, identity_holds=identity), findings


        def main():
            f2_lams = list(range(4, 16))
            with_replacement = [4, 6, 5, 7] * 7 + [4, 6]
            random.Random(20261002).shuffle(with_replacement)
            k_pool = [(0, 2, 1), (0, 3, 1), (0, 5, 1)]
            k_draws = [k_pool[i % 3] for i in range(10)]
            cases = [
                ("B1", "conforming exhaustive rows", f2_lams, "conform", 0),
                ("B2", "one certificate deleted after the payload", f2_lams, "delete", 3),
                ("B3", "one root altered after the payload, index stale", f2_lams, "alter", 3),
                ("B3b", "one root altered and the index rewritten", f2_lams, "alter_reindexed", 3),
                ("B4", "reported certificate_bearing raised by one", f2_lams, "inflate", 3),
                ("B5", "payload-skip: the writer skips one N > 0 row, accounting honest", f2_lams, "skip", 3),
                ("B6", "under-listing: a file lists fewer roots than N", f2_lams, "underlist", 3),
                ("B7", "thirty draws with replacement, per-row certificates", with_replacement, "conform", 0),
                ("B7-shared", "the same draws, one file per (cell, lambda) as the refused design named them",
                 with_replacement, "shared", 3),
