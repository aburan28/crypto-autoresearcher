        12, 13), 10 (n' = 14). With s in {1, 4, 5, 9, 12}.
    horizon_robustness:
      statement: >-
        From the measured figures (R-C7, information only, never a route): if
        every time were three times smaller, exactly one row flips,
        stage2-bandL-n11/d5 from S-BERL to A-DENSE. If every time were three
        times larger, exactly one row flips, stage2-bandL-n10/d4 from A-DENSE to
        S-BERL. Memory verdicts do not scale, so the 40 memory-failure groups
        are robust to any time factor. Within a factor of 3 either way, the
        route map is therefore stable except at the two marginal rows. 3 is the
        DEC-20261002-c01bb7 measurement-uncertainty allowance and the blind
        card's tolerance.
      contestable_rows: >-
        stage2-bandL-n10/d4 (88.43 days against the 90-day line) and
        stage2-bandL-n11/d5 (205.6 days) rest on the 5^12 and 2^28 E-NP squaring
        items and on the gcd extrapolated above 2^24. All three ran under host
        contention (rate_tables.contention). The route is the scale-1 map as the
        rule requires. A blind re-measurement that moves either row across 90
        days is a K-design-revise matter for the composer, not a producer choice.
