        - id: WO-R-6
          title: Census and calibration rows
          text: >-
            candidates.py enumerates by rule name the census set (every
            non-linearized lambda of exact degree 3 to 7; 244) and the Stage-1 set
            (every lambda of exact degree 2 to 7; 252), ascending degree then
            integer value, flags square, affine_linearized, linearized; counts equal
            R-C4's. Moduli from the route table, each tested irreducible by kfield.py
            before use (failure: FB-6-like infrastructure stop, stop_code MODULUS).
            Per row: I_direct where the specification runs it (N = deg gcd(X^(2^n)
            - X, L) by repeated squaring modulo L and the runner's classical gcd);
            count_roots once per route in routes_for(cell, d); wrapper verification
            and certificate (WO-R-7); the row appended to rows.jsonl with an fsync.
            Row fields: row_index (0-based in the trial), lambda, lambda_key,
            degree, n, n', q, r, s, I_direct_N (null in Band H), I_indep_N per route,
            route(s), engine, bound, ratio, slack, h_degree, flags, agree per route
            (null in Band H), certificate_path (null iff N = 0), root_count_listed,
            wrapper_verified, rng_seed, seconds per instrument, status (completed
            | instrument_error), error. raw-result.json holds the rows, per-cell
            summaries, M1 or M2 (or Stage-1 agreement counts per route), the M4
            histogram and orbit-carrying count per cell, the C7 square listing, and
            Band-L HEUR-1 tail figures labelled model checks. memory_mb 8192.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-7
          title: Wrapper re-verification and per-row certificates (D-2, DR-2)
          text: >-
            For each row with N > 0 (any route, and I_direct's root listing on C5
            n' = 11 rows), the payload, using kfield.py only, checks every listed
            root x: x^(2^n') == lambda(x) in K, pairwise distinct, count equal to N,
            each orbit closed under squaring with its stated size (F_2 lambda), and
            equal sets across routes on dual-route cells. It writes ONE FILE PER
            ROW at certs/<cell slug>/r<row_index, 6 digits>-<lambda_key>.json, where
            lambda_key is f2-<hex> for an F_2 lambda and k-<first 16 hex of
            sha256(canonical K text)> for a K-coefficient lambda (canonical K text:
            the coefficients low to high as lowercase hex joined by "."). Content
            (schema qsp70b731.r1.cert.v2): run and trial ids, cell, n, n', modulus,
            row_index, lambda (canonical text), N, per route roots and orbits, and
            wrapper_verification {verifier, roots_checked, all_satisfy_L,
            pairwise_distinct, count_equals_N, orbits_closed,
            sets_equal_across_routes, verified, failures}. REPEATED LAMBDA (C5 draws
            with replacement): every row has its own file; two rows never share a
            path. N = 0 rows write no file and carry certificate_path null.
            certificates-index.json lists every file with path, sha256, row_index,
            N and verified. The reference is code_blocks.cert_accounting_code.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-8
          title: Accounting from files on disk, per row (D-2, D-3, DR-2)
          text: >-
            accounting.py computes per trial and per stage, from rows.jsonl and the
            certs directory as found: rows_completed; zero_N_rows; positive_rows;
            certificate_bearing = the number of completed rows with N > 0 whose
            certificate_path equals the per-row path, whose file exists, hashes to
            the index, binds that row (row_index, cell, lambda, N) and re-verifies
            root by root, each file bound to at most one row; files_on_disk; orphan
            files (bound to no row); identity_holds = (certificate_bearing +
            zero_N_rows == rows_completed). A row whose root_count_listed differs
            from its I_indep_N raises InvariantViolation in the payload. The
            headline is written only when identity_holds is true and there is no
            orphan; otherwise it is null and validity is invalid with F_acct.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-9
          title: Checker without fallback, and stop codes (D-3, D-5, DR-2)
          text: >-
            check.py <run_dir> runs in a separate process and trusts no payload
            counter. In order: manifest has top-level run and check_run (imported
            from tools/validate_ledger.py, fresh Ctx) reports no error, else exit 8;
            the accounting of WO-R-8 is recomputed from disk with kfield.py, and the
            checker EXITS 3 (F_acct) UNLESS identity_holds recomputed from disk is
            true, files_on_disk equals certificate_bearing (no orphan) and the
            payload's accounting equals the recomputation; M9 must be true, else
            exit 7 (F_ind); Stage-0 bookkeeping and verdict, else exit 9 (F0);
            fixtures C2 to C4 must equal (8, 32768, 64) on I_direct and every
            I_indep route and C6 must agree with Proposition 2, else exit 5 (F5);
            any non-square row with verified N above its bound, exit 6 (F1); Stage
            1, Band L and bridge rows must have I_direct_N equal to every route's
            I_indep_N, else exit 4 (F_agree); any instrument_error row, exit 10
            (incomplete). Otherwise 0. Any exception inside the checker exits 2,
            never 0. COMPARE disagreements (F_rep) and the C6 diagnostic (WO-R-12)
            never change the exit code.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-10
          title: Stage 0 mechanics (D-6, DR-4)
          text: >-
            stage0.py implements stage0_mechanism exactly, including the lazy-import
            discipline of main.py and the sys.modules guard at start and exit. A
            --allow-test-fixture flag accepts a test_only note at a synthetic cell
            for tests only; production refuses it.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-11
          title: M9 canonical read sets (D-6, CC-4, DR-3)
          text: >-
            readset.py implements path_problems, blind_hit and evaluate_declaration
            of code_blocks.path_canon_code, with the production oracles exists(p) =
            os.path.lexists(<checkout>/p) and symlinked(p) = any component of p
            under the checkout is a symlink. A declaration is a list of {path,
            extent} mappings; path is a bare canonical repo-relative POSIX path
            (ASCII segments of [A-Za-z0-9_.@+=,-], no empty, "." or ".." segment,
            no leading or trailing slash, no backslash, no surrounding whitespace,
            normalised, existing, not through a symlink); extent is free text in its
            own field. Any non-canonical entry, a bare string entry, an empty list
            or a missing file sets blind_from_respected FALSE. After
            canonicalisation, an entry is a HIT if it equals a blind_from entry
            (trailing slash removed), lies inside one, or is a PARENT of one; the
            comparison is repeated case-folded. Declarations loaded: the I_indep
            and runner implementation reports' read_attestation.paths_read, the
            hand-note author's read_declaration, and the execution read set of
            WO-R-22 up to the trial's own block. Each file is hashed and must equal
            HEAD's blob. Nothing is hard-coded.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-12
          title: Controls trial (C2 to C6) and the C6 diagnostic (DR-10)
          text: >-
            C2 (7, 3, X^2+X), C3 (31, 15, X^128+X^8+X^2+X) and C4 (12, 6, X): I_direct
            and every route routes_for names; forced 8, 32768, 64. C5: for n' in {11,
            33}, d in {3, 7} and coefficient field in {F_2, K}, 100 lambda of exact
            degree d drawn with replacement from the named stream of WO-R-16 (F_2:
            leading 1, lower bits uniform; K: lower coefficients uniform in K,
            leading uniform in K minus 0); n' = 11 arms by I_direct only (its root
            listing gives certificates), n' = 33 arms by I_indep (A-DENSE for F_2,
            A-TWIST for K); M7 histograms, orbit-carrying counts, Poisson upper
            tails, labelled model checks; a null row with verified N above its bound
            is F1. C6: the four linearized degree-4 shapes at n' = 11 (I_direct and
            A-DENSE) and n' = 33 (A-DENSE), against Proposition 2 of KN-LIT-4fe9d2
            (f dividing T^n - 1 over F_2, runner code); disagreement is F5.
            DIAGNOSTIC (DR-10, R-C6-DIAG): beside C6's frozen check the runner
            records, per C6 row, c6_exact_count_diagnostic = 2^(deg gcd(f, T^n - 1))
            (formula provenance RECALLED, supports nothing) and a flag when it
            differs from N; the diagnostic is written under result.diagnostics,
            fires no stopping rule, enters no criterion and never changes an exit
            code (AC-27).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-13
          title: Square and degenerate rows (C7)
          text: >-
            Rows with square lambda are listed separately per cell with the n' - 1
            reduction noted and excluded from HEUR-1 summaries; they stay in M1, M2
            and M5.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-14
          title: COMPARE
          text: >-
            compare.py takes the three Stage-4 run ids and, before opening anything
            sealed, verifies each execution receipt reads output_validated and each
            manifest's result.freeze holds frozen true with sha256 values equal to
            the current raw-result.json and certificates-index.json; any failure
            exits non-zero without opening a sealed path. It then reads
            experiments/EXP-QSP-70b731/compare/compare-map-r1.yaml (written after
            the freeze by the execution batch under WO-R-22's exemption), reads the
            sealed files through it and writes compare-report.json (per candidate
            lambda, n', frozen N, sealed N, agree, certificate path; M3; every
            disagreement in full). The runner author never reads the sealed files.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-15
          title: Stage-4 freeze record
          text: >-
            Each Band-H payload, after rows and certificates are complete and
            accounting holds, writes result.freeze {frozen true, raw_result_sha256,
            certificates_index_sha256, declared_at} in its terminal manifest.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-16
          title: Seeds (D-7, DR-4)
          text: >-
            seeds.py: base seed 20260920; a stream is random.Random(int.from_bytes(
            sha256(label).digest()[:8], 'big')); labels
            '20260920|indep|<trial>|<cell>|<row_index>|<route>' per I_indep call,
            '20260920|direct-roots|<cell>|<row_index>' for I_direct root listing,
            '20260920|C5|np=<n'>|d=<d>|field=<F2 or K>' for C5 sampling. The
            manifest's seeds block prints the rule and every C5 label; rows carry
            their rng_seed. No other Random construction and no module-level random
            call exists in r1/runner (AC-12).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-17
          title: trial-plan-r1.json
          text: Exactly as plan_requirements states.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-18
          title: Tests and acceptance tools (CI-5, CI-6, DR-4)
          text: >-
            Under r1/runner/tests/ and as tools in r1/runner/: plan_check.py (AC-9,
            AC-13, AC-14, AC-15, AC-23, AC-29), audit_indep.py (AC-6, AC-7, AC-8,
            AC-10, AC-12, AC-24 static and trace parts) and a synthetic driver entry
            (main.py --synthetic <cell>) that writes a complete run directory in
            scratch, including command.txt, environment.json, stdout.log and
            stderr.log, and accepts the test hooks QSP_R1_TEST_FAULT and
            QSP_R1_TEST_PLATFORM only with --synthetic. The test tree defines every
            name in synthetic_cells (AC-19). Synthetic cells only; no RUN id
            minted; /usr/local/bin/python3 (CPython 3.11.15).
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-19
          title: Implementation report
          text: >-
            implementation-report.yaml: read_attestation.paths_read as ordered
            canonical {path, extent} mappings; the file list with sha256; the
            mapping from D-1 to D-8, DR-1 to DR-4 and each JRD1 acceptance check to
            code; the outputs of every acceptance check on synthetic cells,
            including every round-1 constructed input as a named case; the
            read-only status view of the plan (AC-23); any I_indep interface issue;
            served model with fallback_used; no run value of any declared cell.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-20
          title: Failure-branch matrix (DR-1, D-8, CC-3)
          text: >-
            records.py writes every failure record; the reference is
            code_blocks.checkrun_demo_code (terminal_failed). A terminal failed
            record is: raw-result.json (schema qsp70b731.r1.raw.v1; status failed,
            stop_code, error {class, message}, rows_finished (completed rows in
            rows.jsonl), rows_file_sha256 or null, f_codes) written atomically
            FIRST, then manifest.yaml with status failed, valid false,
            validity_status incomplete, validity_reason and stop_code, then exit
            with the branch's code. Branches. FB-1 any exception after the
            bootstrap (stop_code EXCEPTION, F6, exit 2). FB-2 MemoryError (MEMORY;
            the emergency reserve is released first). FB-3 SIGTERM, SIGINT, SIGHUP
            (SIGNAL). FB-4 Linux gate (PLATFORM, rows 0). FB-5 RLIMIT_AS read back
            different from the plan's memory_mb (RLIMIT). FB-6 execution context
            refused: not HEAD's blob, bad schema, test_only true (CONTEXT). FB-7
            launch.json, plan or source digest mismatch (LAUNCH). FB-8 Stage-0
            sys.modules guard (STAGE0-GUARD, exit 9). FB-9 a Stage-0 bookkeeping
            failure or fail verdict is NOT a payload failure: the payload completes
            (completed_invalid, F0) and the checker exits 9. FB-10 instrument_error
            rows: the payload completes (completed_invalid, incomplete) and the
            checker exits 10. FB-11 SIGKILL, OOM kill, watchdog or claim expiry:
            nothing can be written; the provisional running manifest (raw pending,
            certificate none) remains and check_run accepts it; the execution
            receipt records the state. FB-12 failure before the bootstrap writes
            (interpreter missing, preexec RLIMIT_AS failure, darwin, a syntax error,
            argv parse failure): no manifest exists; the execution card's report
            records the attempt with the runner's receipt (plan_requirements
            execution_card_conditions EC-2). FB-13 failure while writing terminal
            records: atomic replacement leaves either the provisional or the
            terminal manifest, and raw-result.json precedes the manifest, so
            check_run accepts what remains. FB-14 checker non-zero after a payload
            exit 0: the manifest is already terminal with raw-result.json.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-21
          title: Transitive import audit and the independent trace audit (DR-4, DR-7)
          text: >-
            audit_indep.py computes, from the AST of every r1 module (no import),
            the transitive import graph within r1 and flags importlib, __import__,
            exec, eval and compile anywhere. Rules: no r1/runner module except
            census.py and controls.py reaches any r1/indep module, and those two
            reach only r1.indep.api (the graph through kfield.py, certs.py,
            accounting.py, check.py and every other module included); r1/indep
            reaches no r1/runner module; stage0.py's and main.py's Stage-0 path
            reach no census module (AC-10). It also implements the R0 to R4 trace
            audit of WO-I-10 from that text, independently of r1/indep/trace.py,
            and runs it on traces count_roots returns on synthetic cells.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
        - id: WO-R-22
          title: Execution-phase read declaration and its time scope (DR-3, SO-1)
          text: >-
            The execution session's declaration lives at
            experiments/EXP-QSP-70b731/execution-readset-r1.yaml (schema
            qsp70b731.r1.readset.v1), written by the execution batch, never by this
            batch. It is APPEND-ONLY: a list of blocks {trial, run_id, declared_at,
            prefix_sha256, entries: [{path, extent}], exemption (optional)}, one
            block appended and COMMITTED BEFORE EACH LAUNCH; prefix_sha256 is the
            sha256 of the canonical JSON of all earlier blocks, so an edited earlier
            block breaks every later hash. The payload requires the file to equal
            HEAD's blob, the hash chain to verify, and exactly one block naming its
            own trial and run id. A trial's M9 reads the blocks up to and including
            its own. EXEMPTION post_freeze_sealed_read: the block the execution
            session appends before stage-compare-sealed, after reading the sealed
            EXP-QSP-33b442 Stage-3 files to write compare-map-r1.yaml, may carry it;
            it is honoured only for the stage-compare-sealed trial, only after the
            three Stage-4 freeze records verify (WO-R-14 checks), and only for paths
            inside experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3 (the
            specification's stage_compare.may_open). In any other trial's prefix the
            exempt block counts as hits. The reference is evaluate_execution of
            code_blocks.path_canon_code.
          tq3: >-
            DR-13: evaluating any H polynomial, root, gcd or count on a declared
            cell, by tool or by hand, is a TQ-3 event; such checks run only on
            synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131}.
    execution_context_file:
      path: experiments/EXP-QSP-70b731/execution-context-r1.yaml
      written_by: The execution batch (not BATCH-521e9d), committed before the first trial; immutable; the payload refuses it unless its bytes equal HEAD's blob.
      schema: >-
        context_schema qsp70b731.r1.context.v1; test_only false;
        execution_task_id; execution_batch_id; execution_approval_decision;
        inference block; read_declarations (paths of the I_indep and runner
        implementation reports, the hand note, and
        experiments/EXP-QSP-70b731/execution-readset-r1.yaml); hand_note path.

  acceptance_checks:
    common: >-
      Every check runs on synthetic cells (synthetic_cells), on copies of r1 files
      in the reviewer's scratch, or statically; none runs an instrument on a
      declared cell, mints a RUN id or executes trial-plan-r1.json. Each names a
      mutation or constructed input under which it must fail; a check that cannot
      be made to fail breaks its joint. Round-1 constructed inputs are restated
      here as named cases because the executors may not read round-1 reports.
      Round-2 owners follow REVIEW-QSP-RI-20261002-521e9d (JRI1 runner side, JRI2
      I_indep side).
    items:
      - id: AC-1
        discharges: D-1
        procedure: >-
          main.py --synthetic syn-a-15-04 into a scratch run directory; check_run
          (fresh Ctx) on its manifest; then every WO-R-2 field present.
        fails_when: any check_run error line, or a WO-R-2 field missing or null without a stated reason.
        named_cases: >-
          A2 (flat manifest without a top-level run key; check_run reports
          "expected top-level key 'run'" and check.py exits 8); A4 (no inference
          block) and A5 (environment an empty mapping), which check_run passes and
          the field clause fails.
      - id: AC-2
        discharges: D-8, D-1, DR-1
        procedure: >-
          (i) Start main.py --synthetic syn-a-17-04 and SIGKILL it after the first
          row is in rows.jsonl; check_run on the manifest left behind. (ii) Run it
          with QSP_R1_TEST_FAULT=after_row:1 (forced exception after one row);
          check_run on the result and the predicate: status failed, raw-result.json
          present with status, stop_code, error and rows_finished. (iii) Feed the
          named case A8 to the same check_run call and predicate.
        fails_when: >-
          (i) no manifest, not running with raw_result_pending true and
          certificate kind none, or a check_run error; (ii) a check_run error or a
          missing raw-result field; (iii) A8 accepted.
        named_cases: >-
          A8 (round 1, MUST FAIL): status failed, validity_reason set,
          raw_result_pending carried from the provisional record, the four
          companions present, no raw-result.json; check_run reports "run directory
          missing artifact 'raw-result.json'". A6 (killed provisional record) and
          A9 (A8 plus raw-result.json) pass. Demonstrated by checkrun_demo_code.
        mutation: Disable the provisional write in a scratch copy; (i) fails. Write the terminal manifest before raw-result.json; (ii) fails under an injected crash between the writes.
      - id: AC-3
        discharges: D-2, DR-2
        procedure: >-
          On synthetic runs with N > 0 rows, including a C5-style with-replacement
          sample: every N > 0 row has its own file at its per-row path, the index
          lists every file, check.py re-verifies every root with kfield.py, and
          check.py exits 3 unless identity_holds recomputed from disk is true, no
          file is orphaned and the payload's accounting equals the recomputation.
        fails_when: a named case below gets an exit other than its expected one.
        named_cases: >-
          B1 conforming exhaustive (exit 0); B2 one certificate deleted after the
          payload (exit 3); B3 one root altered, index stale (exit 3); B3b one root
          altered and the index rewritten (exit 3); B4 reported certificate_bearing
          raised by one (exit 3); B5 the PAYLOAD-SKIP case, the cert writer skips
          one N > 0 row with honest accounting (exit 3); B7 thirty draws with
          replacement over the four exact-degree-2 F_2 lambda with per-row files
          (exit 0); B7-shared the same draws named one file per (cell, lambda) as
          the refused design named them (exit 3); B8 the SWAP, one N > 0 row
          without a file plus a phantom file for a lambda outside the rows (exit
          3); K1 K-coefficient lambda drawn with replacement, per-row files (exit
          0); K1-shared (exit 3). Demonstrated on syn-x-05-02 by
          cert_accounting_code.
        mutation: The cases B2 to B8 and K1-shared are the mutations.
      - id: AC-4
        discharges: D-3 (accounting half), DR-2
        procedure: >-
          B6: a synthetic row whose certificate lists fewer roots than N; the
          payload (route stub in scratch) must raise InvariantViolation and
          check.py on the written fixture must exit 3. AST scan of check.py for any
          branch returning 0 after a failed condition.
        fails_when: the row counts certificate-bearing, the checker exits 0, or a fallback branch exists.
        mutation: B6 itself.
      - id: AC-5
        discharges: D-3 (I_indep half), CI-4
        procedure: >-
          In a scratch copy make the root search fail for one factor; call
          count_roots on a synthetic A-DENSE row and a synthetic S-BERL row; then
          the runner on that row. AST scan of r1/indep for except clauses that
          pass, continue or return a number.
        fails_when: a count is returned, a factor skipped, or the runner records anything but instrument_error.
        mutation: The forced failure itself.
      - id: AC-6
        discharges: D-4, CI-3, DR-9
        procedure: >-
          Load routes.py's literal statically and compare it key by key (routes
          and engine) with route_table.route_map and synthetic_cells; call
          routes_for and engine_for for every declared (cell, d) (lookups only);
          AST-scan routes.py and api.py's dispatch for comparison operators or
          arithmetic on n, n', q, r, s, d, B or deg L. C5K-np33 carries exactly
          the route the composer's DR-9 ruling gives.
        fails_when: any key, route, engine or modulus differs; a size test selects a route; an unknown cell does not raise.
        mutation: Insert "if B > 2**24" selecting a route on one cell in a scratch copy.
      - id: AC-7
        discharges: D-4, CI-1, DR-7 (PTM-RD4, PTM-RD5)
        procedure: >-
          STATIC: rules S1 to S4 of WO-I-10 over r1/indep. TRACE: with trace=True,
          run A-DENSE and S-BERL and the six disguises below, each written with the
          gf2x primitives in a scratch copy of r1/indep, on syn-a-09-04,
          syn-a-10-03 and syn-a-15-04 for every non-linearized F_2 lambda of exact
          degree 3 and 4; apply the R0 to R4 audit with BOTH implementations
          (r1/indep/trace.py and r1/runner/audit_indep.py), and compare each
          route's N with brute force. Reference demonstration:
          trace_audit_demo_code (R-C8).
        named_cases: >-
          MUST FAIL on every row (each returns I_direct's quantity, deg gcd(X^(2^n)
          - X, L)). D3a: t = mod(X, L), then n times t = sqrmod(t, L), then
          gcd(t + X, L) (fires R1, R2). D3b: the same with t = mod(mul(t, t), L)
          under generic names (R1, R2). D3c: S-BERL's own Q rows modulo rad L,
          v = mod(X, rad L), n times v = mat_apply(Q, v), then gcd(v + X, rad L)
          (R4, R1, R2). D3d: the residue copied (copy.copy, a list element, a view)
          so the two operands are distinct objects of equal value, mod(mul(t,
          copy), L), alternating with a re-wrap of its raw value by lift after
          arithmetic (R0, R1, R3, R2). D3e: a route labelled derivation (A) that
          builds H and takes gcd(mod(H, rad L), rad L), the refused design's F-1
          collapse (R3, R2). D3f: X^(2^n) modulo L as mulmod of two table entries
          mod(shift(one, 2^(n-1)), L) and mod(shift(X, 2^(n-1) - 1), L), never
          squaring a named residue (R1, R2). MUST PASS with no flag and brute
          force's N on every row: A-DENSE (WO-I-4, including the n squarings
          modulo H and the gcd with Y^(2^n) - Y) and S-BERL (WO-I-6, including
          its Q - I construction and kernel elimination). Round 1's D3b and D3c are
          the JD2 constructions; D3a is the literal PTM-D3 object.
        fails_when: a disguise passes on any row, a legitimate route is flagged on any row, a count differs from brute force, or the two audit implementations disagree.
        mutation: The disguises are the mutations; also remove rule R3 from a scratch audit and show D3e then passes R3.
        limit: >-
          A static and trace audit constrains computations made through the
          primitive layer; S2 and S3 close the bypasses this design can name, and
          JRI2's reading of the code remains the backstop.
