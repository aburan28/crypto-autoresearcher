                         yaml.safe_dump({"id": run_id, "status": "completed"}, sort_keys=True))


        def failure(stop_code, error_class, rows):
            return lambda d, i: (provisional(d, i), terminal_failed(d, i, stop_code, error_class, rows))


        CASES = [
            ("R1", "conforming completed record", lambda d, i: (provisional(d, i), terminal_completed(d, i)), True, None),
            ("A6", "killed after the provisional record (FB-11)", provisional, True, None),
            ("A8", "refused-design failed record without raw-result.json", lambda d, i: (provisional(d, i), refused_design_failed(d, i)), False, False),
            ("A9", "FB-1 exception after one row", failure("EXCEPTION", "RuntimeError", 1), True, True),
            ("FB-2", "MemoryError", failure("MEMORY", "MemoryError", 3), True, True),
            ("FB-3", "SIGTERM", failure("SIGNAL", "SignalTermination", 2), True, True),
            ("FB-4", "Linux gate (WO-R-5)", failure("PLATFORM", "PlatformRequirement", 0), True, True),
            ("FB-5", "RLIMIT_AS read-back mismatch", failure("RLIMIT", "ResourceLimit", 0), True, True),
            ("FB-6", "execution context refused", failure("CONTEXT", "ContextRefused", 0), True, True),
            ("FB-7", "launch or source digest mismatch", failure("LAUNCH", "LaunchMismatch", 0), True, True),
            ("FB-8", "Stage-0 census-module guard", failure("STAGE0-GUARD", "Stage0Guard", 0), True, True),
