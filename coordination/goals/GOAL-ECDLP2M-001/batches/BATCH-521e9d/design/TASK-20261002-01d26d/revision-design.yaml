      - {name: syn-a-15-04, n: 15, n_prime: 4, modulus: 'z^15+z+1', q: 3, r: 3, s: 1, route: A-DENSE, exercises: "depth q + 1 = 4 (the n' = 33 shape); composite n; trace audit"}
      - {name: syn-a-17-06, n: 17, n_prime: 6, modulus: 'z^17+z^3+1', q: 2, r: 5, s: 1, route: A-DENSE, exercises: "depth 3, s = 1 (the n' = 44 shape)"}
      - {name: syn-a-17-09, n: 17, n_prime: 9, modulus: 'z^17+z^3+1', q: 1, r: 8, s: 1, route: A-DENSE, exercises: "depth 2, s = 1 (the n' = 66 shape)"}
      - {name: syn-a-17-03, n: 17, n_prime: 3, modulus: 'z^17+z^3+1', q: 5, r: 2, s: 1, route: A-DENSE, exercises: "depth 6 (the bridge shape)"}
      - {name: syn-a-17-04, n: 17, n_prime: 4, modulus: 'z^17+z^3+1', q: 4, r: 1, s: 3, route: A-DENSE, exercises: "s above 1; paired with syn-b-17-04"}
      - {name: syn-a-10-03, n: 10, n_prime: 3, modulus: 'z^10+z^3+1', q: 3, r: 1, s: 2, route: A-DENSE, exercises: "composite n; depth 4; trace audit"}
      - {name: syn-a-10-05, n: 10, n_prime: 5, modulus: 'z^10+z^3+1', q: 2, r: 0, s: 5, route: A-DENSE, exercises: "r = 0 (the C4 situation); N = 32 at lambda = X"}
