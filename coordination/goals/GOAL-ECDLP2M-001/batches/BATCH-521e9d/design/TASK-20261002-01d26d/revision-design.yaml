  verdict:
    summary: >-
      EXP-QSP-70b731 can be made executable under the frozen specification plus
      ONE additive amendment (AMD-20261002-09957b: A1 and its A1-consequential
      dual-route tightening; R-C7 showed it required), with every
      round-1 defect repaired locally. DR-1 to DR-4 and DR-11 to DR-14 are
      work-order and acceptance-check repairs inside the frozen fields. DR-5
      declares the I_indep product engine set {E-NP (numpy FFT), E-DEC
      (standard-library decimal)} with the classical Euclidean gcd on CPython
      integers, and times them on random synthetic operands through R-C5 and
      R-C6. DR-6 draws the route line ONLY by DEC-20261002-c01bb7 R-ROUTE-RULE
      applied by route_line_code (R-C7) to those measurements; the line is not
      chosen here. DR-7 replaces the round-1 trace (function, modulus degree,
      modulus digest) by an object-provenance trace with audit rules R0 to R4,
      demonstrated (R-C8) to reject D3a to D3f and pass legitimate A-DENSE and
      S-BERL on synthetic cells. DR-8 and DR-9 are statements of the amendment and
      of a_twist (reading (b) adopted; the composer rules). DR-10 is admitted as
      a non-blocking diagnostic only. D-5 is carried by reading (no A2); D-6 needs
      no A3.
    status_of_the_route_line: >-
      Drawn by R-C7 (route_line_code, exit 0, cross-checks equal). On Band L,
      derivation (A) (A-DENSE) is feasible on 16 (cell, d) groups (276 rows)
      and infeasible on 44 groups (2652 rows), which take S-BERL. Of those 44,
      40 fail the memory test and 4 fail the time test only. Bridge and Band H
      are A-DENSE on every row. Stage 1 and C2 to C4 run A-DENSE+S-BERL. Two
      rows are marginal: n' = 10 d 4 at 88.43 days (A-DENSE) and n' = 11 d 5 at
      205.6 days (S-BERL). A time factor of 3 either way flips exactly one of
      them, so the map is otherwise stable. AMD-20261002-09957b is therefore
      required and written.
    most_contestable_points:
      - >-
        The exclusion of E-INT (CPython-integer Karatsuba of Kronecker-spread
        operands) from the declared product engine set rests on dominance, not on
        a sentence of the specification (engine_declaration, PD-1). It is
        checkable: an E-INT squaring faster than both declared engines at any
        boundary degree breaks it.
      - >-
        t_sq is the measured seconds of one modular squaring plus the measured
        Barrett precomputation divided by the 131 squarings a candidate performs
        (PD-7); the unamortized figure is printed beside it for information.
      - >-
        Reading (b) of A-TWIST on C5K-np33 (a reading of C5's own text, no
        amendment) is adopted over reading (a); both are argued in a_twist.
      - >-
        The value-based identification of L-class moduli (exact equality with L
        or rad(L)) inside the provenance audit (WO-I-10 rule set) is a deliberate
        addition to object provenance, never applied to operands.
      - >-
        The two marginal rows. stage2-bandL-n10 d 4 sits at 88.43 days against
        the 90-day line and stage2-bandL-n11 d 5 at 205.6 days. Both rest on
        E-NP squaring items and a gcd extrapolation measured under host
        contention (PD-10). A factor of 3 flips each one. The blind rate card
        can move them, which is a composer matter.
      - >-
        The A1 headline qualifier (PD-13), and that the S-BERL rows' indicative
        projections leave Q construction and splitting unmeasured.

