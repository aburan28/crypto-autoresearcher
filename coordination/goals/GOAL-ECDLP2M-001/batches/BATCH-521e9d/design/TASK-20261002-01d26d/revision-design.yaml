  route_table:
    rule:
      source: DEC-20261002-c01bb7 R-ROUTE-RULE, frozen before any measurement and restated verbatim in substance
      statement: >-
        For a census or calibration (cell, d) with n = q n' + r, s = n' - r,
        B = max(2^s, d^(q+1)) and G the candidates of exact degree d under the
        specification's candidate rule, derivation (A) is INFEASIBLE iff (M) a
        modular squaring or the gcd at degree B on the I_indep engine does not
        complete under RLIMIT_AS = 8 GiB (measured where B lies within the
        measured ladder; above it, the larger of 2B bits and the measured
        peak-address-space-per-bit ratio extrapolated linearly, against 2^36
        bits), OR (T) T_A = G x (131 x t_sq(B) + t_gcd(B)) exceeds 90 days, with
        t_sq the measured seconds per modular squaring at degree B on the fastest
        engine of the declared I_indep set and t_gcd the measured or fitted
        (labelled) seconds of the declared gcd at degree B. Composition and
        factorisation costs are excluded and disclosed. Rows with 30 < T_A <= 270
        days are flagged marginal. Bridge and Band H are never substituted.
      application_fixed_in_advance: >-
        How route_line_code reads the relays, fixed before any rate exists:
        (1) t_sq,e(B) for engine e is seconds_per_squaring_amortized_131 of e's
        verified sqrmod items (one squaring plus the Barrett precomputation over
        131); between ladder degrees it is interpolated linearly in log-log; below
        the lowest it is extrapolated with the lowest segment's exponent; above
        the highest completed degree with the highest segment's exponent (at
        least 1.0); every non-ladder value is labelled fitted. (2) Memory for e at
        B: feasible if a sqrmod item of e at a degree >= B completed and no item
        of e at a degree <= B ended in MemoryError; otherwise the estimate
        max(2B, rho_e B) against 2^36 bits, rho_e = VmPeak in bits at e's highest
        completed degree divided by that degree. The same for the gcd from the
        R-C6 gcd items. (3) The engine of a row is the fastest e with a feasible
        memory verdict; (M) fails if none, or if the gcd's memory verdict fails.
        (4) t_gcd(B) is interpolated and extrapolated as in (1) from the verified
        gcd items. (5) (T) uses the literal 131 for every row. (6) The route:
        Band-L census rows A-DENSE if feasible, else S-BERL (A1); bridge and Band
        H A-DENSE if feasible, else INFEASIBLE (a K-new-record trigger, never
        substituted); Stage-1 cells and C2 to C4 A-DENSE+S-BERL if any census row
        is S-BERL (A1-consequential), else A-DENSE, and INFEASIBLE if (A) fails
        there; C5F-np33, C6-np11 and C6-np33 A-DENSE; C5K-np33 A-TWIST (a_twist,
        reading (b)); C5F-np11 and C5K-np11 NONE-I_DIRECT-ONLY; stage 0 HAND.
        (7) Information only, never a route: the quadratic gcd extrapolation and
        the unamortized squaring time.
    route_vocabulary:
      A-DENSE: Derivation (A) as the specification states it (WO-I-4).
      S-BERL: The A1 substitute, Berlekamp factor-degree count (WO-I-6); only on rows R-C7 marks infeasible for (A).
      A-DENSE+S-BERL: Both routes on every candidate of a calibration cell or fixture, each compared with I_direct or the forced count.
      A-TWIST: Derivation (A) in its coefficient-twisted form for K-coefficient lambda (WO-I-5); C5K-np33 only.
      NONE-I_DIRECT-ONLY: C5 at n' = 11, which the specification runs by I_direct only.
      HAND: Stage 0; no instrument runs.
