        eight-file closure may launch under an approval issued before it),
        DEC-20261002-a63f13 C-EQ (all six earlier plans bind that closure) and
        DEC-20261002-6e68d8 (the refused round-1 repair design and its defect list
        DR-1 to DR-14); states that r1 is a new closure and every trial runs under
        a fresh run id.
      platform_requirement: linux
      interpreter_note: argv starts with python3; CPython 3.11 or later; the host's sys.version and sys.executable are recorded per run (CI-5).
      runtime_lock: null
      scope_note: >-
        Must state: the trial order of d5_ordering; that A1 of AMD-20261002-09957b
        (if approved) governs the I_indep routes and engines per (cell, d); TW-C1
        (any evidence review of these runs that could contradict EV-QSP-a6aa4b is
        review-breakthrough at max); the DR-12 limitation verbatim from
        limitations_carried; the execution_card_conditions EC-1 to EC-3; and that
        no run of this plan is evidence until a separately approved execution and
        its validation.
