  a_twist:
    requirement: DR-9 (DEC-20261002-6e68d8 DR-9; round-1 JD2 O-4). The composer DEC-20261002-ff2bd5 rules.
    route: A-TWIST on stage5-controls/C5K-np33 (WO-I-5)
    reading_a:
      claim: An A1 change, listed in the amendment's changed rows.
      argument: >-
        Derivation (A) as H-QSP-cd0c90 states it applies to lambda in F_2[X];
        A-TWIST is a different derivation (coefficient twists), so I_indep on the
        K-coefficient arm is not derivation (A) "as stated". If C5 counts as a
        "census or calibration cell" of R-AMEND-SCOPE A1 (the controls calibrate
        the instrument against artifacts, and the refused amendment treated C2 to
        C4 as calibration cells), the route belongs in A1 with its source and its
        synthetic-only calibration. Round-1 JD2 recommended this.
      difficulty: >-
        A1 admits a route only "where derivation (A) is shown infeasible", and
        R-ROUTE-RULE decides infeasibility only by (M) and (T); at C5K-np33, B is
        at most 2401, so the rule finds derivation (A) feasible and A1 could not
        place a different route there. Derivation (A) is inapplicable to
        K-coefficient lambda, which is not the infeasibility A1 speaks of.
    reading_b:
      claim: A reading of C5's own text; no amendment.
      argument: >-
        C5 itself directs "100 random K-coefficient lambda ... a Band-H spot at
        n' = 33 (I_indep only)", so the frozen specification already requires
        I_indep to run on K-coefficient lambda. Its I_indep text says "build the
        difference / H polynomial ... take its K-roots ... apply the CLOSING TEST";
        for K coefficients the H polynomial that makes those steps correct is the
        twisted one, which the specification's source proposal names for exactly
        this arm ("null object (100 random lambda in F_(2^131)[X] at d = 3 and d =
        7, n' = 33) with the twisted H of IDEA-20260916-5c9d6e",
        IDEA-20260916-3f7a1c minimal_test Stage 4; IDEA-20260916-5c9d6e itself not
        read). A-TWIST coincides with derivation (A) on F_2 lambda. C5 is a control,
        "not load-bearing for replication", and not a census or calibration cell,
        so R-ROUTE-RULE and A1 do not govern it.
    adopted: reading_b
    adopted_reason: >-
      It needs no amendment clause whose admissibility R-ROUTE-RULE contradicts,
      and it rests on the specification's own C5 sentence. The cost is disclosed:
      A-TWIST is calibrated on synthetic cells only (AC-20) and its derivation's
      provenance is internal (WO-I-5). If the composer rules reading (a), the A1
      clause text is "C5K-np33 d in {3, 7}: A-TWIST (WO-I-5); lambda not in
      F_2[X]; calibrated on syn-t cells only", and it needs a version of the
