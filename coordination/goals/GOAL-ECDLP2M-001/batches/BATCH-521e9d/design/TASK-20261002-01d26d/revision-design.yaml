        version and R-C2 parsed a later one (session custody note). The relay
        arrived as relay-r2.txt. No further INCOMPLETE hand-back was made
        before the final one.
    writers: >-
      Every line of revision-design.yaml and AMD-20261002-09957b.yaml was
      written by this one session (TASK-20261002-01d26d, Coordinator role)
      across its context reset and its resumption. No other session wrote
      either file. The top-level session ran R-C1 to R-C9 and wrote the relay
      files in scratch only.
    disclosures:
      - id: PD-1
        text: >-
          E-INT (CPython-integer Karatsuba of Kronecker-spread operands) is
          excluded from the declared I_indep product engine set on a dominance
          argument, not on a sentence of the specification (engine_declaration).
      - id: PD-2
        text: >-
          E-INT is not measured under R-C5; the card requires measurement of the
          excluded engines the design NAMES as a comparison, and the design names
          none. A reviewer who doubts dominance can request it as a comparison
          item; the route rule uses the declared set only.
      - id: PD-3
        text: >-
          AC-23 exercises tools/experiment_execution.py load_plan on a scratch copy
          of trial-plan-r1.json carrying a placeholder approved_by, because
          load_plan refuses a null approved_by; the committed plan keeps
          approved_by null.
      - id: PD-4
        text: >-
          A grep of KN-LIT-4fe9d2 for "Proposition 2" displayed lines 111-114,
          which discuss divisors of X^131 - 1. Nothing displayed was used or is
          restated.
      - id: PD-5
        text: >-
          Reading IDEA-20260916-3f7a1c lines 380-419 displayed a prediction about
          control C6 (near line 410). It was not used and is not restated.
      - id: PD-6
        text: >-
          The specification and H-QSP-cd0c90 display fractions derived from
          earlier evidence. None is restated here or used for any route, rate or
          check.
      - id: PD-7
        text: >-
          t_sq(B) amortizes the Barrett precomputation over the 131 squarings of a
          candidate; the unamortized time is printed beside it for information and
          never enters the rule.
      - id: PD-8
        text: >-
          The gcd benchmark verifies a common divisor exactly and divisibility by
          the planted factor; maximality rests on the Euclidean recurrence, not on
          a second method.
      - id: PD-9
        text: >-
          After the context reset the session searched its own runtime transcripts
          outside the repository for tool-call path arguments only, to make
          read_attestation exact (read_attestation.outside_repository_reads).
      - id: PD-10
        text: >-
          Host contention. R-C5 and R-C6 ran on a shared 4-CPU host while other
          sessions' agents ran Python, with loadavg up to about 5 (session
          disclosure; per-item loadavg in the relay and the R-C7 "rate" lines).
          The items behind the two marginal rows (R-C5.19, R-C5.20, R-C6.G24)
          ran under load. Contention can only lengthen a time, which biases the
          rule toward substitution. No item was discarded or re-run, and the
          route is the rule applied to what was measured.
