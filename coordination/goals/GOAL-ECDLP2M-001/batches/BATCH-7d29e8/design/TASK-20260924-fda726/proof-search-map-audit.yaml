        design_recompute: 'D = 4 only: 112.1594 - 285.5 = -173.3406; D = 12 and D = 20 deferred to Stage 7'
        status: D = 4 agrees; the others are not computed at design time
      - id: PF-4
        proposal: D* about 20, 16, 12 at omega = 2, 2.37, 3 on the illustrative surface against 285.5
        design_recompute: none (a D* read); Stage 7 only, labelled R-I, never read as the cell's D*
        status: not computed
      - id: PF-5
        proposal: Macaulay memory about 2^35 at D = 4 and about 2^122 at D = 20
        design_recompute: 'D = 4: log2 binom(576, 4) = 32.08 rows (W6.1), and 576^4 would give 36.68; D = 20 deferred'
        status: D = 4 DISAGREES under either reading (FD-7)
      - id: PF-6
        proposal: 283 control sized l about 31, nvar about 279, t 9, against rho 141.5
        design_recompute: >-
          Sizing inconsistent with the 571 sizing (floor at 283, ceiling at 571);
          the contract computes both l = 31 and l = 32 (FD-8). rho 141.5 is the
          naive column; corrected 136.2534 (K-283) and 140.8257 (B-283)
        status: recorded, recomputed in Stage 7
      - id: PF-7
        proposal: 571 rho 2^285.5 with the Koblitz sqrt(m) saving folded in
        design_recompute: 285.5 = 571/2 carries no saving; corrected 279.7471 (K-571), 284.8257 (B-571)
        status: DISAGREES (FD-9)
      - id: PF-8
        proposal: the 2^99 advantage, gone by D about 16
        design_recompute: >-
          99 is EXP-SEMBIN-992e73's naive margin (-99.193), not a session
          figure; against the corrected rows -93.4401 and -98.5188 at the
          fixture point; "gone by D about 16" is a D* read, Stage 7 only
        status: partly recomputed at D = 4
      - id: PF-9
        proposal: the multipliers that close the D = 4 gap are "the 5!, stage and cofactor multipliers"
        design_recompute: M1, M2 (12!), M3a, M3b, M3c (4!), M4 (lemma L-INT, W6)
        status: DISAGREES on the list (FD-4)

  # ---------------------------------------------------------------------------
  findings:
    - id: FD-1
      what: >-
        The proposal's title and claim (B) say the universal justification of
        Assumption 1 is FALSE by KN-FIND-936151. KN-FIND-936151 states that it
        asserts NOTHING about Semaev's Assumption 1, which it calls correctly
        stated and not refuted; what it forecloses is citing d_F <= d'_F as a
        theorem. The design uses the finding's own wording everywhere, so that
        tripwire TA-2 (contradiction of validated evidence) does not fire.
    - id: FD-2
      what: >-
        omega in block_n4w has Semaev's stated domain 2.376 <= omega <= 3
        (Section 4.5.2, line 1088), and the frozen evaluation exists only at
        omega = 3. The proposal's omega = 2 is out of that domain. Moving omega
        from 3 to 2 lowers the solve term by 32.58 bits at n = 283 (W9), more
        than the 283 row's +6.149 margin at omega = 3, so the omega = 3 sign
        pattern (the known truths of PTM-A and PTM-B) cannot be assumed at other
        omega. The contract gates PTM-A/B at omega = 3 only, reports the other
        omega, and routes any non-positive row (RT-4). No sign at other omega
        is asserted here.
    - id: FD-3
      what: >-
        The corrected time-only column does not remove 409: it lies only 0.67
        to 5.51 bits below the naive column there (W8), against a 37.956-bit
        deficit. Claim (A)'s "exactly one" therefore rests on
        H-SEMBIN-97ea23's memory-charged coherent baseline and on BR-1, not on
        any time-only column.
    - id: FD-4
      what: >-
        The proposal names "the 5!" among the reconciling multipliers. No term
        of the frozen model is 5!. The inverse-yield factor is m*! = 12! and the
        degree normaliser at D = 4 is 4! (L-INT, W6).
    - id: FD-5
      what: >-
        The multiplier separating an XL-binomial surface from Semaev's
        n^(D omega) form, log2 D! plus a falling-factorial term, depends on D
        and is about 73 bits between the readings at D = 12, omega = 3 (W10).
        Reconciliation at D = 4 alone cannot fix D*; hence the interval.
    - id: FD-6
      what: >-
        Semaev's block_n4w estimate is itself a conjecture in the source ("We
        think the same approach is applicable to solve the equations coming
        from (5) as well, with the block size n", lines 1070-1072). It is part
        of H1 as H1a.
    - id: FD-7
      what: >-
        The proposal's memory figure "about 2^35 at D = 4" does not reproduce:
        log2 binom(576, 4) = 32.08 and log2 576^4 = 36.68.
    - id: FD-8
      what: >-
        The proposal sizes the 571 illustrative surface with a ceiling
        (l = 48 = ceil(571/12)) and the 283 control with a floor
        (l about 31, while ceil(283/9) = 32). The contract computes both at 283.
    - id: FD-9
      what: >-
        The proposal describes 2^285.5 as the K-571 rho with the Koblitz
        saving folded in. It is the naive 571/2 with no saving (as
        DEC-20260924-99ce20 F-4 anticipated).
    - id: FD-10
      what: >-
        The proposal's dominated_by says no row varies D_solve off 4.
        H-SEMBIN-97ea23 lists degree_bound_variants [4, 5, 6] and quotes a
        degree-5 sensitivity of +19.4 bits at n = 409 from COST-SEMBIN-8d123b.
        That is a nearby object, not a duplicate (c4_duplicate_check); it is
        carried as cross-check C-XDEG. Hand arithmetic puts the R-M degree-5
        increment at 409 nearer that figure (19.03) than the R-B one (26.03)
        (W11), in a metric this session did not read, so nothing is concluded.
    - id: FD-11
      what: >-
        SEMBIN's cost records use the opposite margin sign to EXP-SEMBIN-992e73:
        H-SEMBIN-97ea23 quotes COST-SEMBIN-8d123b's time-only margin at 409 as
        +37.78, while EXP-SEMBIN-992e73 records margin_vs_vow_bits -37.781 at
        409, positive there meaning rho wins. Importing a coherent margin
        without negation would invert claim (A). Rule SN-1 normalises and
        checks the convention on exactly this pair before any import.
    - id: FD-12
      what: >-
        At 571 the frozen argmin m* = 12 beats m = 13 by only 0.0402 bit
        (W4.7). Under R-B and R-M this gap does not move with D or omega (L-ARG),
        but a blind re-derivation that reads k with a ceiling, as Section 4.5.2
        writes it, gets 181.7236 at m = 12 and may choose another m. This is the
        J5 undetermined choice the review plan expects; the contract fixes the
        unceiled reading as part of the fixture model and reports the ceiled
        one as C-CEIL.

  # ---------------------------------------------------------------------------
  procedure_disclosures:
    - id: PD-1
      severity: disclosed
      what: >-
        No shell. Nothing was hashed or executed by this session. The
        instrument sha256 is copied from RUN-SEMBIN-a7a2f3 and is re-checked by
        Stage 0 of the contract.
    - id: PD-2
      severity: disclosed
      what: >-
        While deriving the closed form of R-B and sizing the D grid, the
        designer formed a rough, order-of-magnitude sense of where R-B might
        cross. No value was written down, none is recorded here, and it set no
        threshold: the prediction band 12-20 is copied verbatim from the
        proposal, the grid 2..64 was fixed to contain the proposal's
        hundreds branch as the no-crossing outcome, and the tolerance is the
        rounding half-width of the recorded target. The prior is therefore
        not blind, and the reviewer should read P-C as the proposal's
        prediction, not the designer's.
    - id: PD-3
      severity: disclosed
      what: >-
        docs/claims-and-verification.md, docs/inventor-protocol.md and
        docs/target-result-profile.md are in the card's read scope but were not
        opened. Their obligations were taken from AGENTS.md,
        agents/coordinator.md, templates/research-records.md and KN-TECH-080.
    - id: PD-4
      severity: disclosed
      what: >-
        search_knowledge was not available in this session. Corpus checks were
        by grep and glob over the read scope, and no empty result is treated as
        evidence of absence.
    - id: PD-5
      severity: disclosed
      what: >-
        The frozen fixture is restated in EXP-NISTBIN-451dfa so the contract is
        self-contained. This sheet is canonical, and the restatement was
        written to match it number for number.

  conditions_not_fully_met_at_design_time:
    - id: NM-1
      condition: C1
      what: >-
        Claim (A) is DESIGNED at every FIPS, Certicom and Oakley degree
        (Stage 5, BR-1) but not EVALUATED here. The Certicom and Oakley primary
        inputs (inputs/CERTICOM-CHALLENGE-2009/, inputs/RFC2409-OAKLEY-EC2N/)
