  proposal_figure_register:
    rule: >-
      C5. Every figure IDEA-20260922-7d6d43 computed in its own session, or
      asserted without an archived artifact, is listed here. None is cited as a
      result anywhere in the three files. The contract recomputes all of them
      in Stage 7, after the gates, labelled illustrative. At design time only
      figures at D <= 4 were recomputed by hand, because any figure at D > 4 on
      the proposal's surface is a margin off the fixture degree and its D* is a
      D* read, which C2 forbids before the fixture passes.
    entries:
      - id: PF-1
        proposal: per-solve log2 34.7, 49.8, 64.2 at D = 2, 3, 4, omega = 2, nvar 576 (proof_search_map.baseline_embedding.reproduction_check)
        design_recompute: '34.6747, 49.8346, 64.1594 (W6.2, W6.3), memory log2 binom(576, D) = 17.34, 24.92, 32.08 rows'
        status: agrees to the proposal's precision
      - id: PF-2
