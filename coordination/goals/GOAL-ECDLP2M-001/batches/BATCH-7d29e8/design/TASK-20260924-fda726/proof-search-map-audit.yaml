  # ---------------------------------------------------------------------------
  audits:
    A1_bottleneck_and_baseline_fixture:
      bottleneck: >-
        The degree bound 4 in Semaev's per-solve estimate n^(4 omega)
        (paper_fulltext.md lines 1068-1072). It is the exponent Assumption 1
        pins, it has been checked in this program only at n <= 21, and it
        carries the whole 571 margin: at omega = 3 each unit of D is worth
        3 log2 571 = 27.47 bits under R-B. Decision-changing because it fixes
        the threshold against which any later true-degree measurement is read
        and whether the reachability table records the cell as a point
        estimate or a conditional cost with an edge.
      baseline_parameter_slice: >-
        D = 4, omega = 3, n = 571, m = t = 12, unceiled k, stage 1 only, cofactor
        charged: the frozen instrument's own evaluation, 186.307 (F1 target).
      reproduction: >-
        Symbolic and by fixture. Symbolically, L-EXT: both extensions reduce to
        the frozen per-solve cost at D = 4. By fixture, F1 (frozen_c2_fixture
        above) with F2 at every omega. Hand consistency: W4.4 and W4.5.
      baseline_defect_found_in_the_proposal: >-
        The proposal's baseline quoted the naive 571 column 2^285.5 and
        described it as having the Koblitz saving folded in, which it does not
        (285.5 = 571/2). Replaced by the corrected column (rho_column).
        DEC-20260924-99ce20 recorded this as PRESENT BUT DEFECTIVE IN SUBSTANCE;
        this sheet supplies the missing audit.
    A2_observation_collision:
      observable: >-
        The interval [D*_B(c, omega), D*_M(c, omega)], read from the sign of the
        time-only margin against the corrected column.
      collisions_found:
        - id: OC-1
          what: >-
            Every D-extension f with f(4) = 4 omega log2 n passes F1 and F2. R-B
            and R-M are two such, equal at D = 4 and about omega (log2 D! -
            log2 4!) apart elsewhere (W10). The fixture observable does not
            separate them.
          separating_condition: >-
            None available inside Parts 1-2. Resolved by reporting both and
            quoting only the interval; P-S reports the width. A third reading
            proposed by a reviewer can be added only by amendment.
        - id: OC-2
          what: >-
            A fake first fall degree d'_F <= 4 and a true solving degree of 4
            present the same number to a surface that accepts a degree input.
            This is the KN-FIND-936151 error.
          separating_condition: >-
            IR-1: the contract accepts no degree input at all; D is a grid
            variable. IR-2 states what any later overlay must discharge.
        - id: OC-3
          what: >-
            The naive column and the coherent baseline disagree at 409, so a
            live-cell count is baseline-dependent (PTM-C).
          separating_condition: BR-1 admits only the coherent reading for LIVE.
        - id: OC-4
          what: >-
            Among the instrument's own readings at D = 4 the fixture does
            separate: block_n4w 186.307, macaulay4 213.0618, f4_std 226.8183
            (total-cost joint convention, RUN-SEMBIN-aa5161), and the ceiled k
            reading 181.7236 at m = 12.
          separating_condition: F1 identifies the reading; no collision remains among those.
      scope_of_search: >-
        The instrument's readings as recorded in RUN-SEMBIN-aa5161, the two
        D-extensions, the proposal's illustrative surface, the corpus's
        degree-variation rows reachable from H-SEMBIN-97ea23, and the
        fake-versus-true degree distinction of KN-FIND-936151.
    A3_quantifier_order:
      statement: >-
        FOR EACH curve c in {K-571, B-571}, reading R in {R-B, R-M} and omega
        on the grid, D*_R(c, omega) := min { D in {2, ..., 64} : mu_R(c, D,
        omega) > 0 }, and FOR ALL D in {2, ..., 64}, mu_R(c, D, omega) < 0 iff
        D < D*_R(c, omega) (by L-MON), conditional on H1, H3, H4.
      dependencies_allowed: >-
        D* may depend on c (through rho only), R and omega. The argmin m may
        not depend on D or omega and is checked not to (L-ARG, C-ARG). No
        witness depends on a seed; there is no randomness.
      what_is_not_quantified: >-
        Nothing ranges over the true solving degree of any system. The
        statements E1 (EXISTS a true degree below D* at the m = 12 shape) and
        E2 (the true degree exceeds D*) are Part-3 statements and are not
        reachable from this contract.
      claim_A_order: >-
        For the fixed point D = 4, omega = 3, kappa = 1: FOR ALL degrees n in
        the declared list, class(n) under BR-1; the prediction is that the
        LIVE set equals {571}.
    A4_method_ceiling_and_nearby_object_control:
      strongest_certifiable_claim: >-
        D*(omega) in the reconciled model, assuming H1: per 571 curve and
        in-domain omega, the interval [D*_B, D*_M] at which the model's
        time-only cost first exceeds the corrected matched-rho figure, with
        the Macaulay memory figure beside it.
      ceiling: >-
        The method evaluates a cost formula. It cannot certify a solving
        degree, a relation, a solve or any property of a curve, and its D* is
        no sharper than the R-B/R-M bracket, which is a model-uncertainty floor
        that no tuning of this contract removes. It also cannot validate H1's
        shape off D = 4.
      nearby_object_control:
        - >-
          PTM-A, the 283 row: at D = 4, omega = 3 against the corrected column,
          +11.3961 (K-283) and +6.8237 (B-283), design figures W5.6, rho-wins
          as the frozen evaluation (+6.149 against naive, EXP-SEMBIN-992e73
          RESULTS and raw-result, confirmed at source). Gate G4.
        - >-
          PTM-B at 163 (K-163, B-163), 233 (K-233, B-233) and the declared
          Certicom degree 131 (ECC2K-130, ECC2-131), same point, same rule.
          EXP-SEMBIN-992e73 records +42.27, +22.228 and +49.92 against naive,
          so by L-UB each stays positive against the corrected column. Gate G4.
        - >-
          At omega other than 3 there is no known truth (FD-2), so these rows
          are reported and routed (RT-4), never gated.
        - >-
          PTM-C is excluded by BR-1 and PTM-D by IR-1, both by rule.
      null_object: >-
        The random-system null of matched shape belongs with Part 3 (C6) and is
        not designed here.
      pareto_note: >-
        As an attack: none claimed; parallel rho is the frontier at 571. As an
        analysis: dominated by EXP-SEMBIN-992e73 on the point estimate and by
        H-SEMBIN-97ea23 / COST-SEMBIN-8d123b on memory-charged D in {4, 5, 6}
        at the FIPS labels; not dominated on a zero locus in D against the
        corrected column, which no record in this session's reach computes.
        sota_delta on every ECDLP cost axis is zero; no curve moves.
    A5_strictness_and_interfaces:
      strictness: >-
        not_applicable. No strict improvement over any baseline is claimed,
        and the design says so; the contract prices an existing method.
      interfaces:
        - id: I1
          arrow: illustrative XL surface (R-I) to the frozen block_n4w instrument
          lemma: L-INT
        - id: I2
          arrow: frozen instrument at D = 4 to the D-extensions R-B and R-M
          lemma: L-EXT with L-ARG and L-SPREAD
        - id: I3
          arrow: primary curve parameters to the matched-rho column
          lemma: rho_column convention with C-PARAM and C-RHOCONV
        - id: I4
          arrow: SEMBIN's coherent margins to this contract's sign and corrected column
          lemma: SN-1 and the delta shift, with L-MONO
        - id: I5
          arrow: time-only D* to any memory-charged crossing
          lemma: L-MONO (stated, not used for any prediction)
        - id: I6
          arrow: any later measured degree to the surface's D axis
          lemma: IR-1 and IR-2 (excluded from this contract; binding on any overlay)
      lemmas:
        - id: L-ARG
          responsibility: size
          statement: >-
            Under R-B and R-M the argmin over m of stage 1 is independent of D
            and omega, and equals the D = 4 argmin (12 at 571, 9 at 283).
          proof: >-
            C_R(n, D, omega) = min over m of A(n, m) + S_R(n, D, omega), and S_R
            depends on n, D and omega only, because both readings evaluate the
            Macaulay quantity at the block size n and not at a variable count
            that depends on m or t. So the argmin is the argmin of A(n, m),
            with ties broken identically. W4.7 and W5.5 give the runner-up gaps
            0.0402 bit (571) and 0.1775 bit (283), which are D- and
            omega-invariant for the same reason. This fails for the frozen
            macaulay4 reading, whose variable count N = tk + (t - 2) n depends
            on m; that reading is not used.
        - id: L-EXT
          responsibility: baseline
          statement: >-
            C_B(n, 4, omega) = C_M(n, 4, omega) = C_I(n, omega) for every n and
            omega.
          proof: >-
            S_B(n, 4, omega) = 4 omega log2 n, and S_M(n, 4, omega) = omega
            (W(n, 4) - W(n, 4) + 4 log2 n) = 4 omega log2 n, which is the
            frozen block_n4w per-solve cost. The A part is shared.
        - id: L-INT
          responsibility: interface
          statement: >-
            With t* = m*, l = ceil(n/t*), nvar = t* l and the illustrative
            C_Ill(D, omega) = l + omega log2 binom(nvar, D):
            C_R(n, D, omega) - C_Ill(D, omega) = M1 + M2 + omega M3_R(D) + M4,
            and the frozen model and the illustrative surface BOTH omit M5, M6
            and kappa.
          multipliers:
            - id: M1
              name: relation-count exponent, unceiled k = n/m* against the illustrative ceiled l
              value_at_571: -0.4166667
              depends_on_D: 'no'
              depends_on_omega: 'no'
            - id: M2
              name: inverse per-attempt success probability, -log2 P = log2 m*! + (n - m* k) + eq. (11) correction
              value_at_571: 28.8354552
              depends_on_D: 'no'
              depends_on_omega: 'no'
              note: The largest omitted factor, 12! at 571. The proposal's "5!" matches no term of the model (FD-4).
            - id: M3a
              name: block size n against the illustrative variable count nvar, D log2(n/nvar)
              value_at_571_D4: -0.0503123
              depends_on_D: 'yes, linearly: -0.0125781 per degree at 571 (per unit omega)'
              depends_on_omega: 'yes, multiplied by omega'
            - id: M3b
              name: falling-factorial correction, D log2 nvar - log2 (nvar)(nvar - 1)...(nvar - D + 1)
              value_at_571_D4: 0.0150586
              depends_on_D: 'yes, about D(D - 1)/(2 nvar ln 2)'
              depends_on_omega: 'yes, multiplied by omega'
            - id: M3c
              name: degree normaliser log2 D!, the gap between n^D and binom(n, D)
              value_at_571_D4: 4.5849625
              depends_on_D: 'yes, and it dominates: log2 D!'
              depends_on_omega: 'yes, multiplied by omega'
              note: >-
                This is the multiplier the review plan's J3 hunts. It is where
                R-B (which keeps n^D) and R-M (which keeps binom(n, D) and
                freezes log2 4! at D = 4) part company.
            - id: M4
              name: stage convention
              value_at_571: 0 in the stage-1-only convention
              depends_on_D: 'in the total-cost convention only, log2(1 + 2^(stage 2 - stage 1)), below 2^-90 at 571 for D >= 4 because stage 2 = 2 k* = 95.17'
              depends_on_omega: 'no'
            - id: M5
              name: row weight and sparsity of the Macaulay matrix
              value_at_571: not modelled by either surface
              depends_on_D: 'yes'
              depends_on_omega: 'interacts with it: omega = 2 stands in for sparse linear algebra only if row weight is charged, and it is not'
              direction: omission is optimistic for index calculus
            - id: M6
              name: number of blocks or equations handled per attempt in the block-structured solve
              value_at_571: not modelled; Semaev's n^(4 omega) is per relation
              depends_on_D: 'no'
              depends_on_omega: 'no (depends on m)'
              direction: omission is optimistic for index calculus
            - id: kappa
              name: unit conversion between index-calculus operations and rho iterations
              value_at_571: 1 (not charged)
              depends_on_D: 'no'
              depends_on_omega: 'no'
              direction: unknown in general; H-SEMBIN-97ea23 records about 20 in n over kappa in {1, 10, 100}
          M3_by_reading: >-
            M3_B(D) = D log2 n - log2 binom(nvar, D) = M3a(D) + M3b(D) + M3c(D).
            M3_M(D) = W(n, D) - W(n, 4) + 4 log2 n - log2 binom(nvar, D).
          proof: >-
            Substitution of the definitions. At D = 4, omega = 3 the terms sum
            to the frozen value (W6.4-W6.11). Numerical check F3 (control C-INT)
            at 571 and 283.
          consequence: >-
            The proposal's reconciliation route, the illustrative surface plus
            the multipliers fitted at D = 4 and held constant, is
            R-FIT(D) = C_Ill(D) + M1 + M2 + omega M3(4). Then
            R-FIT(D) - C_B(D) = -omega (M3_B(D) - M3_B(4)), which is strictly
            negative for D > 4 and grows like omega (log2 D! - log2 4!), about
            73 bits at D = 12, omega = 3 (W10). R-FIT differs from R-M only by
            about omega (D - 4) 0.0126 bit at 571. R-FIT is therefore never
            used; R-M is its principled form, and R-B is the literal
            substitution of D for 4 in the printed estimate. Agreement at
            D = 4 does NOT transfer to the D* reading; the bracket does.
        - id: L-MON
          responsibility: correctness
          statement: For each c, R, omega the margin mu_R(c, D, omega) is strictly increasing in D on 2..64, so D* is well defined and unique.
          proof: >-
            S_B increases by omega log2 n > 0 per degree. S_M increases by
            omega (W(n, D + 1) - W(n, D)) > 0 because the sum gains a positive
            term. rho does not depend on D.
        - id: L-SPREAD
          responsibility: interface
          statement: For D >= 4, C_B >= C_M with equality only at D = 4, hence D*_B <= D*_M at 571.
          proof: >-
            C_B - C_M = omega (g(D) - g(4)) with g(D) = D log2 n - W(n, D).
            g(D + 1) - g(D) = log2 n - log2(1 + binom(n, D + 1)/sum_{d <= D}
            binom(n, d)) >= log2 n - log2(1 + (n - D)/(D + 1)) =
            log2(n (D + 1)/(n + 1)) > 0 for D >= 1, n >= 2. Both 571 margins
            are negative at D = 4 (W4.8), so both crossings are at D >= 5,
            where C_B >= C_M, so R-B crosses first.
        - id: L-UB
          responsibility: scope
          statement: >-
            For every ordinary binary curve y^2 + xy = x^3 + a x^2 + b, b != 0,
            rho(c) <= 0.5 log2(pi (2^n + 1 + 2^(n/2 + 1))/8) < n/2 - 0.67, so a
            positive margin against the naive column or against rho_ub implies a
            positive margin against rho(c).
          proof: >-
            The point (0, b^(1/2)) is its own negative, so it has order 2 and
            h >= 2. Hasse bounds h r by 2^n + 1 + 2^(n/2 + 1). With k >= 1 the
            bound follows. Applies to the y^2 + xy form of the FIPS, Certicom
            binary and Oakley EC2N curves; Stage 0 confirms the form per curve.
        - id: L-MONO
          responsibility: scope
          statement: >-
            Under H-SEMBIN-97ea23's product-minimum metric at kappa = 1, a
            positive time-only margin implies a coherent loss for index calculus
            whenever its working set is at least 6n bits; and lowering the rho
            side by delta can turn a coherent win into a loss but never a loss
            into a win.
          proof: >-
            H-SEMBIN-97ea23's mechanism gives rho's product minimum 2 x 3n x W
            and index calculus's product T0 x WS. If T0 > W and WS >= 6n then
            T0 x WS > 6n W. A degree-4 Macaulay row set of an n-variable block
            already exceeds 6n bits for n >= 7. The shift lowers only the rho
            side. Not claimed for the hard-budget metric (its C3).
        - id: L-ASM
          responsibility: runtime
          statement: >-
            Assembly. For each c, R, omega with G1-G4 passed, the D* statement
            of the hypothesis holds in the model.
          proof: >-
            Per-attempt cost times inverse success probability, explicit:
            log2 stage 1 = k* (relations needed) + (-log2 P) (inverse
            per-attempt success probability) + S_R(D, omega) (per-attempt
            solve cost). L-EXT with F1 anchors the model to the recorded row,
            L-ARG fixes m*, L-MON makes D* unique with the stated sign pattern,
            L-SPREAD orders the two readings. Conditional on H1 (S_R brackets
            the per-attempt cost), H3 (P realised) and H4 (rho).

  heuristic_register:
