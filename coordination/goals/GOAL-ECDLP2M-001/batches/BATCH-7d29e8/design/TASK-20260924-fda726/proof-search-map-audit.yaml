        IR-3 and L-UB decide those rows without r wherever the naive margin is
        positive.
    - id: NM-2
      condition: C1 and C4
      what: >-
        The coherent-baseline values BR-1 needs (EV-SEMBIN-4125ec,
        EXP-SEMBIN-2c40bb, RUN-SEMBIN-3ae91c, COST-SEMBIN-8d123b) are outside the
        read scope and were not read. H-SEMBIN-97ea23's status (supported) and
        its 460 sparse / 520 dense crossovers were confirmed only as that
        record states them (predictions, with a status note that every stated
        numeric prediction was met). If Stage 0 cannot locate per-degree
        coherent margins, BR-1 returns UNRESOLVED and P-A reads NOT ESTABLISHED.
    - id: NM-3
      condition: C5
      what: >-
        Proposal figures at D > 4 (margins at D = 12 and 20, the D* values and
        the D = 20 memory figure) were not recomputed at design time, because
        doing so is a D* read before the fixture passes. They are recomputed in
        Stage 7 after the gates.
    - id: NM-4
      condition: C6
      what: >-
        As C6 prescribes, H1 is validated inside the contract by C2 and the 283
        control. Both act at D = 4 only, so H1's shape off D = 4, which is what
        D* depends on, is bracketed rather than validated. Stated plainly so
        that no D* is read as more than the bracket.

