  # CA-4. Value-by-value comparison, made BEFORE any key was applied.
  j1_versus_j5_versus_contract:
    tolerances_applied: >-
      Plan agreement_tolerance. Q1: 0.01 bit per curve, exact on r's bit length
      and on k. Q2: the smaller of the C2 tolerance frozen in EXP-NISTBIN-451dfa
      (absolute 5.0e-4 bit, inclusive) and 0.1 bit, i.e. 5.0e-4 bit on log2 cost,
      and exact on the optimising m.
    Q1:
      - {curve: K-571, contract: 279.7471, J1: 279.74707460, J5: 279.74707460, J5_minus_contract: -2.5e-5, bit_length: {J1: 570, J5: 570}, k: {contract_rule: 571, J1: 571, J5: 571}, agree: true}
      - {curve: B-571, contract: 284.8257, J1: 284.82574806, J5: 284.82574806, J5_minus_contract: +4.8e-5, bit_length: {J1: 570, J5: 570}, k: {contract_rule: 1, J1: 1, J5: 1}, agree: true}
      - {curve: K-283, contract: 136.2534, J1: 136.25341894, J5: 136.25341894, J5_minus_contract: +1.9e-5, bit_length: {J1: 281, J5: 281}, k: {contract_rule: 283, J1: 283, J5: 283}, agree: true}
      - {curve: B-283, contract: 140.8257, J1: 140.82574806, J5: 140.82574806, J5_minus_contract: +4.8e-5, bit_length: {J1: 282, J5: 282}, k: {contract_rule: 1, J1: 1, J5: 1}, agree: true}
    Q1_reading: >-
      All four within 0.01 bit; bit lengths and k exact. J1 and J5 agree with
      each other to eight decimals. J5 reports no undetermined choice for Q1.
      K-indeterminate does NOT fire on C1. Under PD-R1 J1's concurrence is weak
      corroboration (informed prior); J5's is the independent confirmation.
    Q2:
      contract_target: {log2_cost: 186.307, m_star: 12, t_star: 12, reading: 'frozen instrument, k_reading "unceiled" (k = n/m), omega 3.0, block_n4w, charged, stage 1, t = m, m in 2..30'}
      J1: {path_A: 186.30695179, path_B: 186.30695179, m_star: 12, pass_as_frozen: true, ceiled_k_reading_value: 175.138304, ceiled_k_reading_m_star: 15}
      J5_by_reading:
        - {reading: 'KR-real (k = n/m), omega 3 -- TAKEN', value: 186.30695179, m: 12, minus_contract: -4.8e-5, within_tolerance: true, m_exact: true, blind: 'value yes; the argmin m = 12 NOT blind (EXPOSURE-2)'}
        - {reading: 'KR-ceil (k = ceil(n/m)), omega 3 -- co-admissible', value: 175.13830370, m: 15, minus_contract: -11.169, within_tolerance: false, m_exact: false, blind: yes}
        - {reading: 'KR-real, omega 2.376', value: 163.450, m: 12, note: 'omega not pinned by blind-inputs Q2 (PD-C2); the contract pins 3.0'}
        - {reading: 'KR-ceil, omega 2.376', value: 152.282, m: 15, note: as above}
      Q2_reading: >-
        No implementation disagreement. On every reading both J1 and J5
        evaluated, the values agree: KR-real 186.30695179 at m 12 (J1 two paths,
        J5 two numeric paths) and the ceiled reading 175.1383 at m 15 (J1
        J1-ii discrimination, J5 KR-ceil). The divergence is a reading choice,
        not an arithmetic fault: Semaev 2015 defines k = ceil(n/m) at every
        appearance, while its Section 4.5.2 optimisation and (per J1) its Table 3
        evaluate m! 2^(n/m) n^12, i.e. k = n/m. The contract names the frozen
        instrument's unceiled reading, and F1 discriminates it, but the contract
        does not state it as a model-identification choice against the paper's
        definition, and the choice moves the fixture value by about 11.2 bits and
        m* from 12 to 15.
    key_consequence: >-
      K-fixture does NOT fire: J1 reports the fixture passing as frozen, and J5's
      Q2 under its taken reading is within tolerance with exact m. The
      reading-dependent divergence is exactly the case K-indeterminate is written
      for ("J5 reports an undetermined choice that changes Q1 or Q2"), so
      K-indeterminate FIRES, on C2 (not C1, since Q1 is determined and J1 = J5).
      "Whichever implementation looks right": both do; the defect is the
      contract's unstated identification choice. The Q0-02 omega choice is also
      reported as value-changing; it arises because blind-inputs.yaml's Q2
      definition did not pin omega (PD-C2) while the contract pins 3.0 and the
      paper evaluates only at 3. Its bearing on D*(omega) is carried by J3's
      OMEGA-CTRL, not by C2. Q0-05 (cofactor) is a non-admissible reading by J5's
      own account and does not count.

