  # ---------------------------------------------------------------------------
  rulings_on_deviations_disclosures_provenance:
    - id: RL-C5
      subject: c2pnb source tier (J5 Q0-01, Q0-02; J2 m-J2-4)
      ruling: >-
        The 1997 ANSI X9.62 working draft is not "the edition and annex that
        publishes these five curves, or a primary standard that reproduces them
        verbatim and says so" (SR-SRC-1; blind-inputs sources.ansi_x962_c2pnb).
        Under the frozen rules the five rows stay NOT COMPUTED and IMP-X962
        stands. The contract satisfies K-impediment for them (recorded, claims
        out of scope, substitution forbidden; J2 confirms all three). Because J5
        reports an admissible choice that would change those rows, K-indeterminate
        is applied narrowly on C5. Neither side is preferred; there is no
        arithmetic disagreement. The revision decides BY RULE, before reading
        any value, whether a committee working draft is admitted as a separately
        labelled source tier, how the standard-name mapping is recorded
        (c2pnb176v1 is OpenSSL's label and RFC 3279 lists c2pnb176w1; SR-SRC-5
        already requires the mapping), and how NOT COMPUTED rows are compared.
        The revision design session must not transcribe any c2pnb value from the
        TASK-20260924-624abf report. A value frozen in a revision needs its own
        blind re-derivation.
    - id: RL-GGMP
      subject: IMP-GGMP and condition C4 (O-7)
      ruling: >-
        The impediment reflected the producer session's lack of a web tool, not
        unreachability. TASK-20260924-eaf78a retrieved eprint 2020/1315 (version
        20201023:084514, provenance retrieved, PDF sha256 1f15e3da...a182c83).
        K-impediment's C4 branch is therefore moot for the revision. The revision
        reads the source itself, or cites the archived report's retrieval, and
        replaces the "unread" lines by amendment. The contract's wording was
        accurate for its session and is not a defect by itself. The KN-LIT-796
        frontmatter inconsistency (INC-2) is routed to curation (NA-3).
    - id: RL-O6
      subject: L3 against GGMP Lemma 3.3 in the raw basis
      ruling: >-
        Not a tripwire in this round (TB-2 names validated evidence records and
        promoted findings, and no record proposes that the lemma fails). The red
        team's observation rests on two toy cells and is a pointer, not a
        finding. Pre-declared routing: the revision states the basis-dependence
        explicitly. Any record that proposes that GGMP Lemma 3.3 fails as stated
        is a claim of contradiction under AGENTS.md rule 12 and runs at
        review-breakthrough at max, in whichever round first states it.
    - id: RL-FIPS
      subject: RI-1 FIPS hash attribution (m-J2-5; J5 limitation)
      ruling: >-
        Resolved as to fact by two independent retrievals. The defect is the
        attribution sentence in inputs/FIPS186-4-BINARY-CURVES/source_record.yaml.
        This is a provenance defect, not a mathematical result. No value is
        affected. It is routed to an additive correction (NA-2) and is not
        repaired by edit.
    - id: RL-J5-LEAK
      subject: J5 leak assessment (four near items)
      ruling: >-
        Accepted: no leak. None of the four items states an ord_n(2) value at a
        Q1 modulus, a k, a residue or a verdict. The Bailey et al. statement that
        Frobenius acts as a scalar s on the order-l subgroup implies the
        ECC2K-130 verdict structurally, as lemma L1 does for every row. J5
        computed the residue directly, so its agreement on that row is
        arithmetic confirmation, and the verdict was never in doubt structurally.
    - id: RL-J5-SCOPE
      subject: J5 scope disclosures
      ruling: >-
        A runtime permission denial of a proxy-status probe (not retried), a
        web.archive.org egress block, and PyPI installs into scratch are
        infrastructure facts. None is evidence about any quantity (CB-9). The
        third-party Internet Archive copy of the draft is a provenance qualifier
        on the c2pnb draft tier only, which RL-C5 keeps out of the frozen rules.
