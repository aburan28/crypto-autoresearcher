  joints:
    - joint: J1
      title: Rank derivation, interface and reproduction fixture
      verdict: holds
      decisive_reason: >-
        I re-derived both rank statements from the contract's text: lemma L3
        through the Chinese remainder theorem and Vandermonde independence, and
        lemma L4 through the lambda^j proportionality. On planted matrices at
        the fixture prime they agree with two independent rank routines, with
        zero disagreements. The admission rule AR-1 refuses a short-orbit leg,
        the 2-torsion point (0,1), before any rank is read. Every n = 17 fixture
        value reproduces, and G1 is gated before any cell. The ker-g basis can
        be computed from the text. Section B19793 names one saving. None of the
        defects below is load-bearing. The most consequential is that the ker-g
        column is identically zero across the design (M-J1-1).
      attack_i_rank_derivation_and_short_orbit:
        rederivation: >-
          Raw class basis. pi_G commutes with tau, and tau acts on G as lambda
          (L1), so conjugation sends column (O, e) to (O, e + j mod k), and row
          j on orbit O is X^j f_O(X) mod (X^k - 1). Because k divides r - 1 and
          r does not divide k, X^k - 1 has k distinct roots in F_r. The CRT
          evaluation map is an invertible change of column coordinates, under
          which row j becomes (zeta^j f_O(zeta)). The k by k Vandermonde matrix
          on the distinct zeta is invertible, so rank = #{zeta in mu_k : some
          f_O(zeta) != 0}. Reducing mod a divisor h projects onto Z(h). The
          quotient is h = X - lambda. Its coordinate is lambda^j f_O(lambda),
          so the rank is at most 1, and it equals 1 iff some f_O(lambda) != 0.
          L4's logarithm argument shows this holds whenever pi_G(R) != O.
          Corollaries. Legs P and -tau^d(P) give k - 1 in the class basis and
          k in the point basis. Legs P and tau^d(P) give k, since -1 is not in
          mu_k for odd k. This matches L3, L4 and every listed corollary.
        computed: >-
          RC-rank_checks, at r = 65587, k = 17, lambda = 17184. CTL-PLANTED (i)
          form: 20 matrices U diag(I_rho, 0) V of shape 17 by 68 for each rho in
          {1, 8, 9, 17}; both routines return rho every time. CTL-PLANTED (ii)
          structured polynomials f = 1, (X^k - 1)/(X - z0) and prod over z not
          in S (|S| = 8): raw ranks 17, 1, 8; quotient ranks 1, 0, 1; planted-h
          (degree 4) ranks 4, 1, 2; all equal EVAL. L3 corollaries at d = 1, 2,
          5 and 16: minus case 16 in the class basis and 17 in the point basis,
          plus case 17, quotient 1. 300 random multi-orbit relations with small
          integer coefficients, in the raw, quotient and planted-h bases: zero
          disagreements among own elimination, sympy DomainMatrix rank and
          EVAL. Adversarial f vanishing at 1, 2, 10 and 16 roots all agree.
        short_orbit_relation: >-
          RC-fixture_n17, on E_1 over F_{2^17} with W = ker f1(tau), which has
          dimension 8, is tau-stable, contains 0 and does not contain 1. The
          2-torsion point T = (0, 1) has tau-orbit length 1 and x(T) = 0 in W,
          so a bare test of x in W would admit it. The contract's F_W clause
          pi_G(P) != O excludes it: 205 affine points have x in W, 204 are in
          F_W, and (0, 1) is the only exclusion. The relation R = P + T with P
          in F_W has pi_G(R) != O. AR-1 refuses it at step P2-2 (leg (0,1) not
          in F_W), before P2-3 reads any rank. IR-9 would invalidate the run if
          such a relation were admitted, and RS-1 to RS-4 draw legs from F_W
          only. A control relation with both legs in F_W passes AR-1. The rules
          therefore exclude the short-orbit leg before any rank is read.
      attack_ii_fixture:
        values_checked: >-
          RC-fixture_n17. #E_1(F_{2^17}) = 131174 by the Lucas recurrence
          (s_17 = -101) and by brute-force point count; it equals 2 x 65587, and
          65587 is prime. r - 1 = 2 x 3 x 17 x 643, so 17 divides 65586.
          lambda = 17184 satisfies lambda^17 = 1 and lambda != 1, has
          multiplicative order exactly 17, and is a root of X^2 - X + 2 mod r.
          [lambda]P0 = tau(P0) holds on three seeded random generators of G.
          The other root, 48404, has order 65586 and fails the point test.
          Phi_17(lambda) = 0 mod r. Over F_2, Phi_17 = f1 f2 with f1 =
          0b100111001 (X^8+X^5+X^4+X^3+1) and f2 = 0b111010111. Both are
          irreducible (own trial division; sympy agrees), their canonical order
          is f1 < f2, and their product was re-multiplied. The 0/1 lifts at
          lambda are f1-hat = 59282 and f2-hat = 6277 mod r, both nonzero, as
          KN-OPEN-095df5 records. Non-gating cross-check: ker f1(tau) has 102
          nonzero x carrying points, in 6 orbits of 17, and ker f2(tau) has 119
          in 7 orbits, as IDEA-20260915-8fe0ef records.
        gate_order: >-
          The order is P0-ENV, then P0-G0 (planted controls on the fixture r;
          no cell), then P0-G1 (the fixture), then G2, G3, Part 1, P2-E1 and the
          cells. Under SR-2 and IR-2 a fixture failure stops the run and nothing
          downstream is read. The fixture is therefore frozen as a gate that
          runs before any new cell. DEC-20260924-99ce20 S2 says the n = 17 cell
          runs first. G0 comes before it, but G0 is an instrument self-test on
          planted matrices, not a cell.
      attack_iii_kerg_basis:
        as_written: >-
          For the defining g, g-hat is the 0/1 integer lift, and h_g = gcd(g-hat
          mod r, X^k - 1) = prod over {i : g-hat(lambda^i) = 0 mod r} of (X -
          lambda^i). The ker-g coordinates of row j on orbit O are the deg h_g
          coefficients of X^j f_O mod h_g, the rank is taken over F_r, and it is
          0 when deg h_g = 0. This is computable from the text.
        computed: >-
          At the fixture (RC-fixture_n17) deg h_g = 0 for f1, f2, (X+1)f1 and
          (X+1)f2. The fixture gives only the trivial case, so I also computed
          on a planted prime (RC-kerg_search, RC-rank_checks): n = 23, g = the
          canonical degree-11 f1 = 0b101011100011, p = 47, where h_g = X - 18
          (degree 1, equal to sympy's gcd over GF(47)). There, 200 random
          relations and a monomial relation give rank_kerg equal to EVAL under
          both routines.
      attack_iv_b19793: >-
        Lemma L8 and section_b19793 state one saving. The lambda-eigenblock
        system IS the orbit-quotient system, with the same dimension |V|/k and
        the same rows. The text says it is "one saving named twice" and that it
        "must not be multiplied with the orbit quotient". The H statement and
        constructive_transforms are consistent with this. L8's premise, that k
        dividing r - 1 gives ord_k(r) = 1 and a split X^k - 1, holds.
      other_J1_items: >-
        The planted controls can return each of 1, n' and k (verified above).
        The raw-to-quotient change of coordinates is its own lemma (L5) and has
        its own proof obligation with responsibility interface. The
        point-to-class merge in L5b gives rank_class <= rank_point, because
        rank(A M) <= rank(A).
      findings:
        - id: M-J1-1
          severity: material, non-breaking under the plan's criterion
          what: >-
            The ker-g column is identically zero across the whole design.
            deg h_g = 0 for all 32 pairs of the four stable divisors with the
            eight toy primes, n in {17, 23, 31, 41} and a in {0, 1}
            (RC-kerg_cells). g-hat(1) is the weight of g, which is never 0 mod
            r, so h_g is nontrivial only when r divides Res(g-hat, Phi_n). Those
            resultants have 9 to 33 bits (RC-kerg_search). Their only prime
            factors congruent to 1 mod n are 47 (n = 23), 1613, 3163 and 5519
            (n = 31), and 83 (n = 41), and none of these is a cell prime.
            rank_kerg is therefore 0 on every relation the protocol can read, a
            value fixed by integer arithmetic before any run. Collision (4) of
            the proof_search_map (a ker-g rank of n' from the relayed lemma,
            versus a coincidental count) cannot occur on any cell. The
            prediction "no preferred outcome among 0, 1, n'" leaves unstated a
            value that is already determined. The planted-h arm of CTL-PLANTED
            (ii) is the only place the ker-g pipeline is exercised
            non-trivially.
          why_not_a_break: >-
            The plan's criterion for attack (iii) is an undefined or ambiguous
            basis. This basis is defined and computable. The Coordinator should
            nonetheless know that, at every cell, the column says nothing about
            the relayed Lemma 3.3 beyond this: the hypothesis g-hat(lambda^i) =
            0 fails.
        - id: D-J1-2
          severity: minor, wording, non-load-bearing
          what: >-
            L4 says the quotient rank "equals 1 exactly when" pi_G(R) != O, but
            the proof gives only the "if" direction, and the converse is false.
            On the fixture curve (RC-rank_checks, L4_converse_witness), legs P1,
            P2 and P3 in three distinct class orbits with P1 + P2 + P3 = T =
            (0, 1) have pi_G(R) = O and quotient rank 1 (both routines, EVAL
            1). A related wording problem is in the H statement. Read literally
            as R != O, "rank is exactly 1 for every relation with target not O"
            is also false: legs P and T - P give R = T != O, class f = 0 and
            quotient rank 0 (H_target_not_O_literal_witness).
          why_not_a_break: >-
            Both cases are excluded before any rank is read. AR-1 requires
            pi_G(R) != O, RS-1 targets lie in G minus O, the quantifier order
            says target R in G minus O, and IR-9 applies. No prediction, rule,
            outcome or success criterion uses the converse. Read literally, the
            plan's breaking artifact "a rank statement the text does not derive"
            matches. I judge it non-load-bearing, and the composer may weigh it
            differently. Fix by erratum: "equals 1 whenever pi_G(R) != O", and
            "target in G minus O".
        - id: m-J1-3
          severity: minor, clarity
          what: >-
            definitions.ker_g_basis says "on orbit O" without saying whether
            this is a class orbit or a point orbit. The two readings can
            differ. At the planted p = 47, n = 23 case, three legs in three
            point orbits that merge into one class orbit with f = 1 + X^5 -
            X^21 give ker-g rank 0 on the class reading and 1 on the point
            reading (RC-rank_checks, class_vs_point_contrast_m3). Context fixes
            the class reading: the definition's g-hat(tau)Q = O with Q in G, the
            H statement's "those zeta" of the unknown-indexed raw basis, and
            DC-B2. The difference cannot arise for m = 2, since 1 is not a root
            of h_g, and it cannot arise anywhere in this design, since deg h_g =
            0 (M-J1-1).
        - id: m-J1-4
          severity: minor, clarity
          what: >-
            The canonical class representative Q_O is "least x(Q)", which does
            not break the tie between Q and -Q, because they share x. The
            contract correctly says that representative choices change f_O by a
            unit and change no rank (verified). Only the recorded orbit
            polynomials can differ in sign between implementations.
        - id: O-J1-5
          severity: observation
          what: >-
            The contract's positive criterion departs from the literal positive
            branch of DEC-20260924-99ce20 S2 ("raw rank k and quotient rank 1 on
            every relation"). In the contract, raw class rank is the L3 value,
            which is k - 1 on relations with legs P and -tau^d(P) (DC-B1). The
            departure is mathematically correct (verified above), is declared,
            and is tested by RS-4. The composer should read S2's positive branch
            through DC-B1.
