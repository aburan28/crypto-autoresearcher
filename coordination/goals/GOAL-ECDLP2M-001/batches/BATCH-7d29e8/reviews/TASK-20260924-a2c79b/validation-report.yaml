    - joint: J2
      title: Controls, toy-degree screen, row sourcing and completeness (C1, C5)
      verdict: breaks
      decisive_reason: >-
        The frozen cell-admission rule E1 cannot be satisfied at two of the four
        positive-arm degrees. At n = 17, the a = 0 curve has #E_0 = 130972 = 2^2
        x 137 x 239, and its largest prime, 239, does not exceed 2^8 = 256. At n
        = 41, the a = 1 curve has #E_1 = 2199020947334 = 2 x 739 x 2543 x
        585071, and its largest prime, 585071, does not exceed 2^20 = 1048576.
        So P2-E1 finds no complete pair at n = 17 or n = 41, and SR-5 halts
        every execution before any rank readout with status incomplete_C1. By
        construction, O-SUPPORT condition (4) cannot be reached, and the audit
        sheet's C1 status "met" does not hold. The contract disclosed this as
        unknowable before a run, but integer arithmetic fixes it. This is a
        protocol-design (completeness) defect under C1. It is not a
        mathematical result about H-BINSTD-ce4f38, about any rank identity, or
        about any curve.
      decisive_evidence: >-
        RC-toy_screen gives E1 as integer arithmetic on the Lucas orders.
        RC-e1_crosscheck confirms all eight toy orders independently: the
        closed form alpha^n + beta^n agrees with the Lucas loop, the
        brute-force count at (17, 0) is 130972, and [N]P = O holds on seeded
        random points of every curve. Status of the other cells: at n = 23 both
        curves are admitted (r = 2095853 and 4196903); at n = 31 both are
        admitted (r = 1439393 and 41231); at n = 41, a = 0 is admitted (r =
        549756390943). At all eight primes, including the two that fail the
        bound, n divides r - 1 and a lambda candidate of order n exists, so
        AR-2 alone would pass. The failure is the bound r > 2^floor(n/2) alone.
      remedy_space_not_chosen: >-
        For the Coordinator, not decided here. Possible remedies are to change
        the E1 bound, to allow a second prime on the same curve, or to change a
        positive-arm degree. Any of them is an amendment under a new version,
        and the choice is the Coordinator's.
      attack_i_toy_screen: >-
        RC-toy_screen, two routes (the prime-divisor test and iterated powers).
        All seven orders reproduce: 17 gives 8, 23 gives 11, 31 gives 5 and 41
        gives 20 (positive arm, ord < n - 1); 19 gives 18, 29 gives 28 and 37
        gives 36 (forced-negative arm, ord = n - 1). Each degree is in the
        correct arm. The factor degrees of X^n - 1 over F_2 are [1,8,8],
        [1,11,11], [1,5,5,5,5,5,5], [1,20,20], [1,18], [1,28] and [1,36], each
        factor passing an own Rabin test with the product re-multiplied. The
        usable sets are empty exactly at 19, 29 and 37. The four divisors per
        positive n, in the contract's canonical order, have degrees {8,9},
        {11,12}, {15,16} and {20,21}, which matches its j and l. The hand checks
        in toy_degree_screen are arithmetically right.
      attack_ii_rules_in_procedure: >-
        The |V| < 4n exclusion is in procedure step P2-4, as well as in
        cells.positive_arm.disjointness_exclusion. The two-curves rule is in
        P2-E1, CTL-TWO-CURVES, SR-5, SR-6 and success criterion (4). Both are in
        the procedure, not only in prose. The two-curves rule is present but
        cannot be satisfied (the decisive reason). A minor point: success
        criterion (5)'s phrase "outside the |V| < 4n exclusion for the
        disjointness reading" is loosely attached. The exclusion affects only a
        confirmatory reading, because every relation is checked against EVAL
        regardless.
      attack_iii_row_sourcing:
