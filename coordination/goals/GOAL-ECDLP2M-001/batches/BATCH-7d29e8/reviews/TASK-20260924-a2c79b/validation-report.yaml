          Horner traces replays correctly (RC-rows_check). The five c2pnb rows
          cannot be sourced. ANSI X9.62 is not under inputs/, and my retrieval
          attempt reached only a bot-challenge page (HTTP 403) on the ANSI
          webstore. That the standard is sold rather than freely published is
          recalled, not verified. The contract handles this under K-impediment.
        rows:
          - row: K-163
            named_source: FIPS 186-4 D.1.3.1.1 (SRC-FIPS)
            in_inputs: 'yes; inputs/FIPS186-4-BINARY-CURVES/'
