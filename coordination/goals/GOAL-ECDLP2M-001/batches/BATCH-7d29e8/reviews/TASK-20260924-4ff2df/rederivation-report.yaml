  charging_audit:
    note: >-
      At this tier an uncharged term is a finding. None of these changes Q1 or
      Q2 as defined; they bound what the defined figures mean.
    Q2_uncharged_or_absorbed_terms:
      - term: memory
        finding: >-
          The model charges no memory. Derived from the model's own quantities
          (not part of Q2), the stage-2 relation matrix holds about
          (m+1) 2^k nonzeros: 2^51.28 under KR-real (m = 12) and 2^43 under
          KR-ceil (m = 15). The stage-1 Macaulay-matrix memory per system is
          not modelled at all.
      - term: F4 overall-to-largest-step ratio
        finding: The paper observed about 3 at n ≈ 50 and did not charge it. Charging it adds 1.585 bits.
      - term: block-structured solving at block size n
        finding: >-
          The paper states it as a belief ("We think the same approach is
          applicable"). The default-F4 alternative costs 40.5 bits more under
          KR-real and 43.6 bits more under KR-ceil at omega = 3, and its argmin
          moves to m = 10.
      - term: Assumption 1 at n = 571
        finding: >-
          Unverified at this n. The paper's experiments reach n ≤ 40, and the
          spec lines 172-179 say the same. Every Q2 row is conditional on it.
      - term: per-trial point arithmetic, Weil descent, relation check, stage-2 ring arithmetic mod r
        finding: >-
          These are polynomial and far below n^12 per trial. They are absorbed
          legitimately at 3 dp, but they are not charged.
      - term: unit conversion
        finding: >-
          The model counts F_2 operations, while rho counts group operations.
          The paper compares the two without any conversion factor.
      - term: inverse success probability
        finding: Charged as 1/P, with P from the stated heuristic eq. (11), as required.
    Q1_uncharged_terms:
      - >-
        The per-step cost of computing the class representative (up to m
        squarings for the Frobenius orbit, plus the sign), fruitless-cycle
        handling, and distinguished-point memory for parallel collision search.
        sqrt(pi r/(4k)) is the expected iteration count only, by definition.

