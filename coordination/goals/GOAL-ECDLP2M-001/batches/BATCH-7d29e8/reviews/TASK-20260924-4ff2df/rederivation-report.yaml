  Q1:
    definition_used: >-
      log2 sqrt(pi r / (4k)) = (log2 pi + log2 r - 2 - log2 k) / 2, where r is the
      FIPS base-point order, k is the Frobenius class order (k = 1 for a curve
      with no model over a proper subfield), and pi is exact.
    precision: >-
      mpmath at 60 digits and Python decimal at 70 digits (with its own ln and
      a Machin-formula pi) agree to better than 1e-20 bit. The float path
      agrees to within 1e-13 bit. The four-decimal values are rounded from
      25-digit values. The tolerance is 0.01 bit, and the bit length and k are
      exact.
    unit: expected group operations (iterations) of Pollard rho, per the definition
    curves:
      K-571:
        r_decimal: '1932268761508629172347675945465993672149463664853217499328617625725759571144780212268133978522706711834706712800825351461273674974066617311929682421617092503555733685276673'
        r_bit_length: 570
        r_source: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md lines 7023-7029 (section D.1.3.5.1)
        h: 4
        h_source: >-
          FIPS lines 6634-6635 ("h = 4 if a = 0") with a = 0 at line 7021.
          Confirmed because h r = 2^571 + 1 - V(571) holds exactly.
        k: 571
        how_k_established: >-
          FIPS D.4 (lines 8090-8117) defines tau(x,y) = (x^2,y^2) and
          mu = (-1)^(1-a) = -1, and gives V(m) = mu V(m-1) - 2 V(m-2). That is
          the Lucas sequence of x^2 - mu x + 2, the characteristic polynomial of
          tau. The polynomial itself is a recalled standard fact (see
          citations); it is confirmed below by the exact order identity. V(571) was computed
          here from the D.4 Lucas recurrence and equals the printed V(571)
          (lines 8168-8170), and h r = 2^571 + 1 - V(571) exactly. Because r
          does not divide h, the order-r subgroup is unique and tau-stable, and
          tau acts on it as a root lambda of x^2 + x + 2 mod r. The two roots
          were computed with an own Tonelli-Shanks square root of -7 mod r.
          Exactly one satisfies lambda^571 = 1 mod r, as tau^571 = identity on
          E(F_2^571) requires, and that root is not 1. Independently, the
          tau-fixed points are E(F_2), which has 4 points, so tau cannot act
          trivially on a subgroup of prime order r > 4. Since 571 is prime,
          ord(lambda) = 571.
        log2_sqrt_pi_r_over_4k: '279.7470745970547380062611'
        value_4dp: '279.7471'
        supplementary_without_frobenius_log2_sqrt_pi_r_over_4: '284.3257480647361593990216'
      B-571:
        r_decimal: '3864537523017258344695351890931987344298927329706434998657235251451519142289560424536143999389415773083133881121926944486246872462816813070234528288303332411393191105285703'
        r_bit_length: 570
        r_source: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md lines 7060-7066 (section D.1.3.5.2)
        h: 2
        h_source: >-
          FIPS lines 6634-6635 ("For each pseudorandom curve, the cofactor is
          h = 2"). 2r lies in the Hasse interval of 2^571 (the trace has 286 bits).
        k: 1
        how_k_established: >-
          By the definition's second clause. 571 is prime, so F_2 is the only
          proper subfield. The polynomial-basis b (FIPS lines 7072-7074,
          2f40e7e 2221f295 ...) is neither 0 nor 1, so j = 1/b is not in F_2 and
          the curve has no model over F_2, even up to isomorphism.
        log2_sqrt_pi_r_over_4k: '284.8257480647361593990216'
        value_4dp: '284.8257'
      K-283:
        r_decimal: '3885337784451458141838923813647037813284811733793061324295874997529815829704422603873'
        r_bit_length: 281
        r_source: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md lines 6852-6854 (section D.1.3.3.1)
        h: 4
        h_source: >-
          FIPS lines 6634-6635 with a = 0 at line 6851. Confirmed because
          h r = 2^283 + 1 - V(283) holds exactly (V(283) at line 8143).
        k: 283
        how_k_established: >-
          As for K-571, with mu = -1. The computed V(283) equals the printed
          value, and the order identity holds exactly. Of the two roots of
          x^2 + x + 2 mod r, exactly one satisfies lambda^283 = 1, and it is not
          1. Since 283 is prime, ord(lambda) = 283.
        log2_sqrt_pi_r_over_4k: '136.2534189433202182386133'
        value_4dp: '136.2534'
        supplementary_without_frobenius_log2_sqrt_pi_r_over_4: '140.3257480647361593990216'
      B-283:
        r_decimal: '7770675568902916283677847627294075626569625924376904889109196526770044277787378692871'
        r_bit_length: 282
        r_source: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md lines 6887-6891 (section D.1.3.3.2)
        h: 2
        h_source: FIPS lines 6634-6635. 2r lies in the Hasse interval of 2^283 (the trace has 142 bits).
        k: 1
        how_k_established: >-
          By the definition's second clause. 283 is prime, and the
          polynomial-basis b (FIPS lines 6897-6898, 27b680a c8b8596d ...) is
          neither 0 nor 1.
        log2_sqrt_pi_r_over_4k: '140.8257480647361593990216'
        value_4dp: '140.8257'
    structural_remark: >-
      B-571 and B-283 share the fractional part .82574806..., because
      r = (2^m + 1 - t)/2 with |t| < 2^(m/2+1) makes log2 r = m - 1 to about
      2^(-m/2). The Koblitz values follow from 4r = 2^m + 1 - V(m) in the same
      way. This is a self-consistency check, not a comparison with any other
      source.

  Q2:
    n: 571
    fixed_by_definition_and_spec: >-
      Paper's own convention: stage 1 only, t = m, one system (5) per trial.
      D = 4, so the solve exponent is 4 omega. Block-structured solve cost
      n^(4 omega) with n = 571 (spec line 181). The solve cost is charged (spec
      lines 56-57, 148-150). Yield from eq. (11), taken as realized (spec line
      180). 2^k relations. Stage 2 is 2^(k omega') with omega' = 2, eq. (16).
      Integer m in [2, 30].
    formula_as_evaluated: |
      log2 C_total(n) = log2( C1(m*) + C2(m*) ),   m* = argmin over integer m in [2, 30] of log2 C1(m)
      log2 C1(m) = k(m) + 4*omega*log2(n) - log2 P(m)            (eq. 15, block-structured solve n^(4 omega))
      P(m)       = 1 - exp( -2^(m*k(m) - n) / m! )                (eq. 11, t = m, |V| = 2^k(m), q = 2^n)
                 ~ 2^(m*k(m) - n) / m!                            (Section 4.5.2 approximation)
      log2 C2(m) = omega' * k(m),  omega' = 2                     (eq. 16)
      n = 571, D = 4, omega = 3 unless stated
      KR-real (taken):     k(m) = n/m, so P = 1 - exp(-1/m!) ~ 1/m! and C1 = m! * 2^(n/m) * n^12
      KR-ceil (co-admissible): k(m) = ceil(n/m)
    values_by_admissible_reading:
      - reading: KR-real, omega 3, charged, block (TAKEN)
        optimising_m: 12
        t: 12
        k: 571/12 = 47.583333... (the factor-base subspace has dimension ceil = 48; the formula uses n/m)
        runner_up: m = 13, 0.0402 bit higher
