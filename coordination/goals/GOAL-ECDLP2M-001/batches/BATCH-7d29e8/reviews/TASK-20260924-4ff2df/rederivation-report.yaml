        log2_C2: '95.166666666666666667'
        log2_total: '186.30695179326879341'
        value_3dp: '186.307'
      - reading: KR-ceil, omega 3, charged, block
        optimising_m: 15
        t: 15
        k: 39
        mk_minus_n: 14
        runner_up: m = 19, 4.5053 bit higher
        argmin_at_cap: false
        log2_C1_eq11_exp: '175.13830370327457982'
        log2_C1_approx_yield: '175.13830369423673519'
        log2_C1_approx_yield_exact_integer: 'log2(15! * 2^25 * 571^12) = log2(52708760283190736168442459585095801263081144713216000) = 175.1383036942367351900664'
        log2_C2: '78'
        log2_total: '175.13830370327457982'
        value_3dp: '175.138'
      - reading: KR-real, omega 2.376, charged, block
        optimising_m: 12
        log2_total: '163.45021384260313379'
        value_3dp: '163.450'
      - reading: KR-ceil, omega 2.376, charged, block
        optimising_m: 15
        log2_total: '152.28156575260892019'
        value_3dp: '152.282'
    spread_over_admissible_readings: >-
      11.169 bits from k-rounding alone at omega = 3. Admitting omega = 2.376
      widens it to 34.025 bits (152.282 to 186.307). The spec and the paper
      together do not determine a single value at the 0.01-bit level.
    readings_not_admissible_reported_for_transparency:
      - {reading: 'KR-real, absorbed (solve factor 1)', optimising_m_stage1: 12, log2_C1: '76.418788568914679989', log2_total_at_that_m: '95.166669943847326451', note: 'stage 2 dominates; the argmin of the total would be m = 15'}
      - {reading: 'KR-ceil, absorbed (solve factor 1)', optimising_m_stage1: 15, log2_C1: '65.250140478920466392', log2_total_at_that_m: '78.000209436735001077', note: 'stage 2 dominates; the argmin of the total would be m = 19'}
      - {reading: 'KR-real, omega 3, default F4 [n(m-1)]^12', optimising_m: 10, log2_total: '226.81832455516284967'}
      - {reading: 'KR-ceil, omega 3, default F4 [n(m-1)]^12', optimising_m: 10, log2_total: '218.71842613261006641'}
    unit_of_cost: >-
      "Operations" in the paper's sense for (15). Per its Section 4.4 these are
      ground-field operations of the Boolean system, i.e. F_2 operations, with
      every O-constant set to 1, multiplied by the dimensionless expected number
      of solved systems 2^k/P. Stage 2 counts sparse linear-algebra
      operations. This is not the group-operation unit of Q1.
    k571_vs_b571: >-
      Identical. Every term of the model is a function of n = 571 and of m, k,
      omega, D and omega' alone. The curve constant B enters the equations but
      not the cost. Assumption 1 is stated for any B, and the paper's Table 1
      (B = 1, the Koblitz case) and Table 2 (random B) show the same
      d_F4 = 4. r, h and the Koblitz Frobenius appear nowhere in the model.
      Only the rho baselines of Q1 differ between the two curves.
    landscape_note: >-
      The full per-m table for m = 2..30 is in computations.json at
      raw_outputs.q2.landscape_omega3_charged_block. Under KR-real the curve is
      smooth, with its minimum at m = 12 (186.307) and m = 13 at 186.347.
      Under KR-ceil it is jagged because the ceiling slack mk - n (1 to 29 bits)
      is credited as probability. The minimum is at m = 15 (slack 14, 175.138),
      then m = 19 (slack 18, 179.644) and m = 10 (slack 9, 180.679). Extending
      the range to m in [2, 570] leaves both argmins unchanged.
    independence_of_the_value_from_the_exposures: >-
      No Table 3 cell was used. Both readings' values come only from the
      formulas above. The KR-real argmin (12) coincides with EXPOSURE-2 and is
      therefore not blind. The KR-ceil argmin (15) and all log2 costs are blind
