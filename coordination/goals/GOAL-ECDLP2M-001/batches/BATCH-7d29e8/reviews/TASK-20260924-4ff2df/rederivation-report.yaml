  Q0:
    report_note: >-
      The list below is not empty. Items marked value_change none were
      examined and do not move any reported value at the reported precision.
      Q1 has no undetermined choice. Formula quotes from the Semaev text are
      normalised transcriptions of its pdfminer extraction, with flattened
      superscripts restored as ^(...) and ceiling glyphs as ⌈ ⌉; they are not
      byte-verbatim. The cited line numbers locate the extracted text.
    items:
      - id: Q0-01
        topic: rounding of the factor-base dimension k in the Q2 cost model
        quotes:
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md line 541
            text: 'Let V be a set of all polynomials in α of degree < k = ⌈n/m⌉'
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 602-605 (Assumption 1) and 1064
            text: 'k = ⌈n/m⌉ ... collecting a system of ≤ 2^k, k = ⌈n/m⌉ linear relations'
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 1074-1089, eq. (15)
            text: '2^k n^(4ω) / P(n, m, m, k) ≈ (m! / 2^(mk−n)) 2^k n^(4ω) ... For ω = 3 that is at most m! 2^(n/m) n^12'
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 1132-1134
            text: 'For each n in the range one finds m, where the first stage complexity m!2^(n/m)n^12 is minimal.'
          - source: experiments/EXP-SEMBIN-992e73/specification.yaml lines 34-35 (objective)
            text: 'the optimized cost under Section 4.5.2''s own convention'
          - source: experiments/EXP-SEMBIN-992e73/specification.yaml lines 116-117 (C-CAP)
            text: 'a degenerate argmin with k = n/m near 3'
        admissible_readings:
          - id: KR-real
            reading: >-
              k = n/m, real-valued, in both 2^k and the yield. Eq. (15) then
              equals m!2^(n/m)n^(4 omega) exactly. This is the rule the paper
              states for its own optimisation (Section 4.5.2), which the spec
              calls Section 4.5.2's own convention; the spec's C-CAP text also
              writes k = n/m.
            status: taken (Q2 fallback rule, take it from Semaev 2015 as published)
          - id: KR-ceil
            reading: >-
              k = ceil(n/m), the paper's definition of k at every appearance and
              the only k for which Assumption 1 is stated, used literally in
              eq. (15). The paper calls m!2^(n/m)n^12 an upper bound on this
              ("at most").
            status: co-admissible, value reported
          - id: KR-floor-or-hybrid
            reading: >-
              k = floor(n/m), or ceil in 2^k with n/m in the yield. Neither is
              supported by any text.
            status: not admissible, not evaluated
        depends: Q2 value, Q2 optimising m and k, Q2 stage-2 value
        value_change: >-
          11.169 bits at omega = 3 (186.307 vs 175.138), with argmin m 12 vs 15.
          Under KR-ceil the model credits the ceiling slack mk - n (14 bits at
          m = 15) as extra decomposition probability while charging the same
          n^12 solve cost. That is why its landscape is jagged; see
          Q2.landscape_note.
      - id: Q0-02
        topic: value of the linear-algebra constant omega
        quotes:
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 1088-1089
            text: 'operations, where 2.376 ≤ ω ≤ 3 is the linear algebra constant. For ω = 3 that is at most m!2^(n/m)n^12.'
          - source: experiments/EXP-SEMBIN-992e73/specification.yaml line 181
            text: 'the block-structured n^{4 omega} solving cost of Section 4.5.2'
        admissible_readings:
          - id: OM-3
            reading: omega = 3, the only value at which the paper evaluates the model
            status: taken
          - id: OM-2.376
            reading: >-
              omega = 2.376, the lower end of the paper's stated range. The paper
              never evaluates at it. The value is linear in omega:
              log2 C(omega) = log2 C(3) - 4 (3 - omega) log2 571.
            status: admissible under the stated range, value reported
        depends: Q2 value only; the argmin is unchanged because n^(4 omega) does not depend on m
        value_change: -22.857 bits at omega = 2.376
      - id: Q0-03
        topic: form of the eq. (11) yield
        quotes:
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 404-417, eq. (11)
            text: 'P(q, m, t, |V|) = 1 − (1 − 1/q)^K ≈ 1 − (1 − 1/q)^(|V|^t/t!) ≈ 1 − e^(−|V|^t/(q t!))'
          - source: inputs/SEMAEV-2015-310/paper_fulltext.md lines 1066-1067
            text: 'P(n, m, m, k) ≈ 2^(mk−n)/m!'
          - source: experiments/EXP-SEMBIN-992e73/specification.yaml line 180
            text: 'eq. (11)''s yield taken as realized rather than as an upper bound'
        admissible_readings:
          - {id: PF-exp, reading: '1 - exp(-2^(mk-n)/m!)', status: used for the headline digits}
          - {id: PF-pow, reading: '1 - (1 - 2^-n)^(2^(mk)/m!)', status: evaluated}
          - {id: PF-approx, reading: '2^(mk-n)/m!', status: evaluated}
        depends: Q2 value
        value_change: none at 3 dp (1.5e-9 bit under KR-real, 9.0e-9 bit under KR-ceil)
