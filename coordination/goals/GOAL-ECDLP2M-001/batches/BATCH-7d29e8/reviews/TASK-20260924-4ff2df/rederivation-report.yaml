  scope: >-
    Q1 is the defined closed-form rho iteration count for four FIPS 186-4 curves
    with parameters as printed. Q2 is the value of a heuristic cost formula at
    n = 571, conditional on Assumption 1 (d_F4 ≤ 4, supported in the paper only
    up to n = 40), on the conjectured block-structured solving cost and on the
    eq. (11) random-mapping yield. No solver was run and nothing was measured.
    Neither value is a statement about the security of any curve in either
    direction. No evidence tier above a heuristic_estimate attaches to Q2.

