    holds_or_breaks_summary: >-
      (i) PTMs: B, C and D (as specified) are met; A is met on raw and quotient
      only. (ii) R2 exclusions hold. (iii) Rho holds. (iv) Scope breaks.

  # ===========================================================================
  objections:
    - id: O-1
      joint: J3
      severity: high
      objection: >-
        No rule checks that a quotient row is a true equation on the
        logarithms. An orientation-flipped or otherwise mislabelled instrument
        passes every gate, control and invalidation rule, and reads as
        O-SUPPORT-consistent. The quotient certificate failed on 36/36
        relations at n = 23 and 90/93 at n = 17 (M2).
      required_change: >-
        Add the per-relation quotient certificate and the per-leg label
        certificate as an invalidation rule (RC-1, RC-2).
    - id: O-2
      joint: J3
      severity: high
      objection: >-
        A conjugate-construction defect is classified as a falsification
        outcome. Via P2-6, SR-8 and falsification (b) it becomes O-REFUTE-L3,
        whose decision is "the raw-basis accounting is corrected by the
        counterexample certificate". This held on 93/93 and 36/36 relations
        (M1). Replication does not protect against it, because the defect is
        deterministic.
      required_change: >-
        Bind conjugate row j to tau^j of row 0 with its own on-curve
        certificate. Admit a P2-6 candidate to O-REFUTE only after RC-1 to RC-3
        pass on it; otherwise classify it as an instrument defect (RC-3).
    - id: O-3
      joint: J3
      severity: medium
      objection: >-
        The contract claims its separators split collision (3), but they do
        not. The null object forms no conjugate row, the non-stable control
        tests membership only, and the raw readout routes M1 to refutation and
        passes M2.
      required_change: >-
        Restate collision (3)'s separator as RC-1 to RC-3, and pre-register M1
        and M2 as instrument self-tests that must be invalidated (RC-6).
    - id: O-4
      joint: J3 and J4
      severity: medium
      objection: >-
        The ker-g column has no null expectation, and it is flat across the
        presence and absence of Frobenius. It reads 0 on the null object and
        on every relation at both Koblitz cells, because deg h_g = 0 for all
        four divisors under both lifts. At these cells the per-relation ker-g
        rank adds nothing beyond the per-divisor g-hat(lambda^i) mod r.
      required_change: >-
        State the ker-g expectation at k = 1 (not computed, or excluded from
        any basis-difference reading), and say so under IR-5 (RC-4). For (C),
        report the raw class rank of single-base relations against n', beside
        g-hat(lambda^i) mod r, as the quantity that bears on Lemma 3.3.
    - id: O-5
      joint: J3
      severity: low
      objection: >-
        "Imposes the identities g-hat(tau) Q = O that the relayed proof needs"
        states the characteristic-2 (0/1-lift) reading as the proof's need.
        GGMP eq. (4), read over Z, is the other lift, and the source fixes
        neither.
      required_change: Qualify the sentence as in attack_iii_ggmp.wording_delta.
    - id: O-6
      joint: J3
      severity: medium
      objection: >-
        L3's raw-rank prediction (k for a relation with an orbit hit by exactly
        one column) contradicts GGMP Lemma 3.3 ("at most n'") in the raw
        factor-base basis, the basis GGMP's Theorem 3.4 proof uses it in. The
        review computation shows raw class rank k (17, 23) at n' = 8 and 11.
        The contract does not say this. Left implicit, an O-SUPPORT reading
        would silently become a claim that a published lemma fails as stated.
      required_change: >-
        State the contradiction, and the bases in which the lemma does and does
        not hold. It holds trivially in the orbit quotient (rank 1 <= n'), and
        in any quotient where l(lambda) = 0 mod r. Record that any
        evidence-stage statement that GGMP Lemma 3.3 is false as stated is
        routed per AGENTS.md rule 12 at the Coordinator's judgement. This is
        not a tripwire in this round.
    - id: O-7
      joint: J3
      severity: low
      objection: >-
        IMP-GGMP presents a limitation of the producer's tools as
        unreachability of the source. The source is reachable (C-02 and C-03).
      required_change: >-
        A Coordinator act: clear IMP-GGMP against an archived record of the
        read (this report, or a KN-LIT record superseding KN-LIT-796), then
        update the "unread" lines by amendment. The contract's wording was
        accurate for its session and is not a defect by itself.
    - id: O-8
      joint: J4
      severity: medium
      objection: >-
        Three sentences say the contract "lowers a claimed gain" but name no
        claimant. The retrieved GGMP text states its relation-count factor
        once ("reduce the number of linearly independent relations we need to
        collect by a factor n", section 3.2) and derives it from the reduction
        to orbit representatives that the per-orbit unit formalises.
        IDEA-20260922-1a081a C3 (lines 56-72 read) divides the Frobenius-aware
        relation count by m once. Neither contains the double count these
        sentences presuppose.
      required_change: >-
        Name the record and field that counts k rows per solve against a system
        of dimension |V|/k, or strike the sentences. The accounting-unit claim
        itself is unaffected.
    - id: O-9
      joint: J4
      severity: medium
      objection: >-
        The bottleneck sentences state a log2 k-bit movement or ambiguity of
        every Frobenius row's relation column, and they relay 3.46 bits at
        c2pnb176v1 on k = 11, which the contract records as NOT COMPUTED
        (IMP-X962; K-impediment).
      required_change: >-
        Restate the bottleneck as "the relation-yield column must name its
        basis; this contract fixes it", with no bit movement. Mark any c2pnb
        figure "if k = 11 (unverified, IMP-X962)", or drop it.
    - id: O-10
      joint: J4
      severity: medium
      objection: >-
        On PTM-A the rules are silent on whether rank_kerg is computed. If
        P2-3 applies, they report rank_kerg = 0 against raw = quotient = 1 on
        every null relation, which is a forbidden basis difference. The
        ker_g_basis definition presupposes ord(lambda) = k with lambda != 1,
        which cannot hold at k = 1.
      required_change: RC-4.
    - id: O-11
      joint: J4
      severity: medium
      objection: >-
        The PTM-D object, as enumerated ((a, b) = (1, 1)), is defined over
        F_2. Under definitions.k_and_q it is a (q, k) = (2, 15) cell on which
        AR-2 passes (lambda = 4, order 3). Only the handed (8, 5) makes
        lambda = 1. The rejection is overdetermined by E1's size bound, so a
        defective lambda != 1 clause goes undetected. If E1 recomputes r
        (211), a different subgroup is admitted.
      required_change: RC-5.
    - id: O-12
      joint: J3
      severity: low
      objection: >-
        CTL-NULL and CTL-NONSTABLE run after the rank readouts (P2-5 after
        P2-1 to P2-4). They block by invalidation, not as gates.
      required_change: Move P2-5 before P2-3, or state that no rank is readable until P2-5 passes.

  required_controls:
    - id: RC-1
      control: >-
        Per-relation on-curve quotient certificate: sum over hit orbits O of
        [f_O(lambda) mod r] Q_O == pi_G(R). A failure is an instrument defect
        (new IR). Cost: at most m + 1 scalar multiplications per relation. This
        review shows separating power: it holds on all correctly labelled
        relations and fails on 126/129 M2 relations.
    - id: RC-2
      control: >-
        Per-leg label certificate: pi_G(P) == eps [lambda^e] Q_O, recomputed by
        scalar multiplication independently of the tau-orbit search that
        assigned (e, eps).
    - id: RC-3
      control: >-
        Conjugate-row binding. Row j's legs must equal tau^j(row-0 legs), and
        row j carries its own on-curve certificate for the target [lambda^j] R
        = tau^j(R). A P2-6 candidate counterexample is read as O-REFUTE-L3 or
        O-REFUTE-Q only if RC-1 to RC-3 pass on it; otherwise it is an
        instrument defect.
    - id: RC-4
      control: >-
        A ker-g null expectation. At k = 1, do not compute rank_kerg and record
        that as the rule, or report deg h_g and exclude it from any
        basis-difference reading. Extend IR-5 accordingly. Report the
        per-divisor g-hat(lambda^i) mod r as the content of the ker-g column,
        and give the raw class rank against n' as the (C)-relevant reading.
    - id: RC-5
      control: >-
        Re-specify PTM-D with b not in F_2, so that (q, k) follows from
        definitions.k_and_q. The first such object is (a, b) = (1, 2), with
        #E(F_8) = 10 and r0 = 5. Run AR-2 in isolation, without E1's size
        bound, and record that the rejection reason is lambda = 1. Add the
        mutation test "AR-2 with the lambda != 1 clause deleted must admit it".
        State AR-2 as ord(lambda) = k (lambda^(k/p) != 1 for every prime p
        dividing k).
    - id: RC-6
      control: >-
        Pre-registered instrument self-tests. The copy-row builder (M1) and the
        orientation-flipped labeller (M2) must each INVALIDATE the run, on one
        toy cell, before any rank is read.

  counterexample_or_mutation: >-
    M2 at the E1-admissible cell n = 23, a = 0 (r = 2095853, lambda = 93194,
    W = ker f1(tau) with f1 = 0b101011100011). RS-4 minus relation with d = 14,
    legs (422818, 4777288) and (3943724, 7032392), and R = (7039478, 3202314).
    Correct and flipped labellings both give raw class rank 22 = EVAL 22 and
    quotient rank 1. The on-curve quotient certificate holds for the correct
    labels and fails for the flipped ones. Reproduce with computations.json C-09
    (script embedded; seed label n23-a0-RS4).

  baseline_comparison: >-
    The contract proposes no algorithm and states no cost, and
    asymptotic_claim is null. Against Pollard rho: its convention sqrt(pi r/(4k))
    is correct and calibrated to Bailey et al. section 2 (recomputed above).
    Against BSGS: not applicable, since no time-memory claim is made. Against
    the closest specialised baseline, GGMP's Frobenius-invariant factor-base
    accounting (retrieved and read): the per-orbit unit, one quotient row per
    solve in a system of dimension |F|/n, restates GGMP's relation-count factor
    and does not lower it. dominated_by does not appear in the three files. It
    is not owed by a design contract that makes no cost claim. The only
    cost-direction statements are the sentences under O-8 and O-9, and those
    are objected to rather than checked against a frontier.

  heuristic_challenges:
    - >-
      H-261004-0 ("none") is accepted for the arithmetic. The rank identities
      L1 to L4 are unconditional given correct labels. The claim that the
      measurement tests them is conditional on label and construction
      correctness, which no rule checks (O-1, O-2). That is an unverified
      instrument assumption, not a heuristic.
    - >-
      The recalled structural ingredient (Frobenius satisfies pi^2 - t pi + 2 =
      0) is relayed by GGMP p. 7 as "X^2 +- tX + q = 0 (mod r)", with t defined
      via |E(F_{q^n})|, which looks like a slip in the source. That relays the
      ingredient but does not verify it. It is not load-bearing, because
      definitions.lambda confirms each candidate by [lambda] P0 = tau(P0). The
      provenance should stay recalled.
    - >-
      H-261004-1 is excluded and is not smuggled in. The statement says "one
      solve contributes exactly one row", not "one rank".

  cost_model_challenges:
    - >-
      There is no cost claim to challenge. RC-1 to RC-3 add at most m + 1
      scalar multiplications per relation. The entire review computation (two
      Koblitz cells, the null object, the forced-negative degrees and the F_8
      self-test) took 13.5 s wall-clock on one core, so the controls are
      negligible against the contract's 12 CPU-hour advisory budget.
    - >-
      "At the charged orbit-canonicalisation cost" (H predicted_gain) names a
      cost the contract does not measure. That is consistent with excluding
      Part 3, and it should not be read as measured.

  reduction_and_scope_challenges:
    - O-6 (L3 against GGMP Lemma 3.3 in the raw basis; routing at the evidence stage).
    - O-8 and O-9 (implied correction of an unnamed claimed gain; log2 k-bit column movement; the unverified c2pnb k).
    - >-
      Claim (C) of IDEA-20260922-261004 cannot be adjudicated by rank_kerg as
      operationalised (O-4). Now that the source is read, the adjudicating
      quantities are g-hat(lambda^i) mod r per divisor, which tests the proof's
      identity l(pi) P = O on G, and the raw class rank of single-base
      relations against n'.

  proof_architecture_challenges:
    - kind: observation_fiber
      finding: >-
        With quotient rank 1 and raw rank = EVAL held fixed, varying the
        labelling orientation gives valid and invalid quotient equations of
        identical readout (M2). The missing separator is RC-1.
    - kind: quantifier_order
      finding: >-
        The quantifier audit lists representative and sign choices as changing
        f_O by a unit multiple (X^s or -1), and so changing no rank. It omits
        the automorphism X -> X^{-1} of mu_k. Every rank the contract reads is
        invariant under it, but the quotient equation is not. "Ranks equal the
        L3 values" is therefore necessary and not sufficient for the content of
        L4 and L5.
    - kind: nearby_object
      finding: >-
        rank_kerg reads 0 on the null object and on both Koblitz cells. The
        column cannot distinguish the objects it is meant to distinguish (O-4).
    - kind: compositional_invariant
      finding: >-
        Deleting AR-2's lambda != 1 clause leaves G3 passing through E1's size
        bound. The first step that should fail does not (O-11).
    - kind: method_ceiling
      finding: >-
        The ker-g column's ceiling is deg h_g, which is a per-divisor
        arithmetic quantity. At both toy cells deg h_g = 0 for every divisor,
        so the column's per-relation content is nil there.

  surviving_objections: >-
    After the contract's own safeguards (single-run caution, replication,
    counterexample archiving and its interpretation_limits), O-1, O-2, O-4,
    O-6, O-8, O-9, O-10 and O-11 survive. O-3, O-5, O-7 and O-12 are
    clarifications that any revision can absorb.

  narrowest_supported_statement: >-
    This statement covers the committed snapshot (hashes verified) and the
    review computations in computations.json: toy cells E_0 at n = 17 (r = 239,
    not E1-admissible) and n = 23 (r = 2095853, E1-admissible); the null object
    at n = 17; the forced-negative n = 19, 29 and 37; and the F_8 to F_{2^15}
    self-test. On those, EXP-BINSTD-178742's rules block on null and non-stable
    failures. They keep PTM-B's and PTM-C's known-false conclusions out of
    reach, keep raw = quotient on PTM-A, and reject PTM-D's lambda = 1 subgroup
    as literally specified. The contract carries the corrected rho convention
    with no residual superseded figure, excludes H-261004-1, Part 3 and the K/B
    comparison, and authors the census once. The rules do NOT separate
    instrument labelling or conjugate-construction defects from genuine rank
    outcomes. They leave the ker-g column without a null expectation, and they
    specify the PTM-D object inconsistently with definitions.k_and_q. Five
    sentences imply a correction to a claimed gain that the retrieved GGMP text
    does not contain. Nothing here concerns the cost or security of any curve,
    and nothing concerns an exponent.

  scope_limits:
    - Verdicts cover J3 and J4 only. There is no whole-contract verdict, and J1, J2 and J5 were not performed.
    - >-
      The review computations are the reviewer's own toy-size script. They are
      not the executor's instrument, not a run, and not evidence about
      H-BINSTD-ce4f38.
    - >-
      Where a clause is ambiguous (whether P2-3 applies to CTL-NULL relations;
      whether the self-test's handed (q, k) overrides k_and_q; whether E1
      recomputes r), both readings are reported.
    - >-
      The GGMP comparison is against version 20201023:084514, the only version
      in the archive's history, read through a pypdf extraction whose math
      spacing is imperfect. The lemma's text was normalised by hand, and the
      raw extraction is embedded.
    - >-
      The Lemma 3.3 observation (O-6) comes from two toy cells with one
      divisor each for the relation readout. It is a pointer for the evidence
      stage, not a finding.

