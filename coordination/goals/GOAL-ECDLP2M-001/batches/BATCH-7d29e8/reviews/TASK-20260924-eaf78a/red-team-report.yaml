  # ===========================================================================
  J3:
    joint: >-
      J3. Observation collision, nearby-object controls and GGMP provenance (C4).
    verdict: breaks
    verdict_reason: >-
      Three parts hold. The plan's constructed collision (a measured rank n' that
      comes from short orbits) cannot arise at prime k, and the rules would read
      it correctly as an instrument defect. The null-object and non-stable
      controls are blocking. Nothing is attributed to GGMP, and KN-OPEN-095df5's
      relay of Lemma 3.3 is accurate against the retrieved source. The joint
      breaks on the observation collision itself. Collision (3) is the one the
      contract claims to separate: genuine quotient absorption versus an
      instrument defect. Its separators (the raw readout, the null object and the
      non-stable control) do not separate two constructed instrument defects.
      M1, a copy-row conjugate builder, is routed through P2-6 and SR-8 to a
      counterexample certificate and the O-REFUTE-L3 outcome on every relation,
      and no invalidation rule fires. M2, an orientation-flipped labeller, passes
      every rule and reads as consistent with L3 and L4, although the quotient
      row it produces is a false equation on the logarithms. That happened on
      36/36 relations at the E1-admissible cell and on 90/93 at n = 17. No rule
      checks the identity that the quotient row exists to encode.

    attack_i_planned_collision:
      constructed: >-
        A relation with a leg in a short (length-1) orbit, fed to the contract's
        rules. The only such points with x in W are those of E(F_2). At both toy
        cells only T = (0, 1) has x in W; its G-part is O. I built R = P + T with
        P in F_W, and also the mutated base F_W united with {T}.
      reading_by_the_rules: >-
        AR-1 and IR-9 reject the leg, because pi_G(T) = O means T is not in F_W
        (4/4 cases at each cell). IR-7 invalidates the run if any class or point
        orbit of the wrong length appears. Even if the leg is admitted, a
        length-1 orbit column is constant across the k conjugate rows. It
        therefore lies along the zeta = 1 Vandermonde vector and can change the
        raw rank by at most +1, only in the zeta = 1 coordinate. An exhaustive
        check covered every one- or two-term +-1 orbit polynomial on one full
        orbit, with and without a length-1 column. The only (rank without, rank
        with) pairs were (16, 17) and (17, 17) at k = 17, and (22, 23) and
        (23, 23) at k = 23.
      result: >-
        At prime k no short orbit can produce a measured rank n' with 1 < n' <
        k - 1. The case the plan asks about therefore cannot occur, and any short
        orbit is read correctly as an instrument defect before any rank is read.
        The histogram is not the separator for sub-k ranks with all-k histograms.
        The RS-4 minus value k - 1 (16 at n = 17, 22 at n = 23) and the 32/61
        RS-1 relations at n = 17 with rank 16 all have all-k histograms. The
        evaluation lemma (EVAL) separates them, and it agreed with RANK-A and
        RANK-B on every correctly built relation (93/93 at n = 17, 36/36 at
        n = 23).
      holds_or_breaks: holds

    attack_i_unplanned_collisions:
      - id: M1
        mutation: >-
          A conjugate builder that never applies tau: all k rows equal row 0.
          This is the instrument named in the contract's own collision (3).
        what_the_rules_do: >-
          Raw rank is 1, and EVAL computed from row 0's orbit polynomials is k or
          k - 1. RANK-B agrees with RANK-A, because the matrix really has rank 1,
          so IR-14 does not fire. P2-6 then classifies the relation as a
          candidate counterexample. SR-8 continues the run, and falsification
          criterion (b) and outcome O-REFUTE-L3 apply ("On O-REFUTE-L3, the
          raw-basis accounting is corrected by the counterexample certificate").
          IR-7, IR-8, IR-9 and IR-13 are unaffected.
        measured: 93/93 relations at n = 17, a = 0 and 36/36 at n = 23, a = 0 go to the P2-6 counterexample path; no invalidation rule fires.
        caveat: >-
          Suppose the executor builds conjugate rows by polynomial shift X^j f_O
          in the same routine that CTL-PLANTED (ii) exercises. Then G0 would
          catch a defect in that routine. The contract's conjugate_family
          definition names the curve-side construction first ("every leg
          replaced by tau^j of that leg") and allows both. Under the curve-side
          construction nothing binds row j to tau^j of row 0.
        reading: >-
          MISREAD. An instrument defect is classified as a falsification outcome,
          not as invalid. The safeguard "a single run is never grounds for
          reject_scoped; weaken plus replication applies" does not help, because
          a deterministic defect replicates.
      - id: M2
        mutation: >-
          An orientation-flipped labeller. The shift e of each leg is found by
          searching tau^{-e}(Q_O) instead of tau^{e}(Q_O), so e becomes -e mod k,
          while the quotient still evaluates at lambda.
        what_the_rules_do: >-
          The flip replaces f_O(X) by f_O(X^{-1}). That permutes mu_k, so the raw
          rank equals EVAL on the relabelled polynomials. The quotient rank stays
          1, the RS-4 tail checks (k - 1 minus-sign, k plus-sign) still pass,
          and orbit histograms are unchanged. The null object forms no conjugate
          row. CTL-NONSTABLE tests set membership only. G1 checks [lambda] P0 =
          tau(P0), not the labeller. No gate, control or invalidation rule fires,
          and the success criterion reads O-SUPPORT-consistent.
        measured: >-
          At n = 23, a = 0 (E1-admissible): 36/36 relations are consistent with
          L3, all have quotient rank 1, and the on-curve quotient certificate
          fails on all 36. At n = 17, a = 0: 93/93 are consistent and the
          certificate fails on 90 (3 relations have labels invariant under the
          flip). Explicit instance (computations.json C-09), n = 23, RS-4 minus,
          d = 14. Correct labels (e, eps) = (22, +1) and (13, -1); flipped
          labels (1, +1) and (10, -1). Raw 22 = EVAL 22 and quotient 1 in both
          cases. sum_O [f_O(lambda)] Q_O equals pi_G(R) = (7039478, 3202314)
          for the correct labels and (2243964, 7413272) for the flipped ones.
        reading: >-
          MISREAD. The readout cannot tell a valid per-orbit equation from a
          false one of the same rank. The quotient rank is 1 for almost any
          labelling, so it does not test L4's content: that the quotient row is
          the true equation sum_O f_O(lambda) y_O = log pi_G(R). This is an
          observation-fiber collision with the separator missing. It bears on
          J1's interface obligation L5, but no J1 ruling is made here.
      - id: M3
        mutation: Short-orbit legs (see attack_i_planned_collision).
        reading: Read correctly (rejected by AR-1 and IR-9; IR-7 as backstop).
    cheapest_separator: >-
      A per-relation on-curve quotient certificate: check sum over hit orbits O
      of [f_O(lambda) mod r] Q_O == pi_G(R). This costs at most m + 1 scalar
      multiplications per relation. Add a per-leg label certificate pi_G(P) =
      eps [lambda^e] Q_O, recomputed by scalar multiplication independently of
      the tau-orbit search, and bind row j to tau^j (legs_j == tau^j(legs_0),
      target [lambda^j] R, each with its own on-curve certificate). A failure
      should be a new invalidation rule, an instrument defect, and a P2-6
      candidate should reach O-REFUTE only after passing all three. In this
      review the certificate held on every correctly labelled relation (93/93
      and 36/36) and failed on 126 of the 129 M2 relations.

    attack_ii_control_blocking:
      CTL-NULL: >-
        BLOCKING. It is blocking: true, and SR-6 says "CTL-NULL, CTL-NONSTABLE
        or CTL-TWO-CURVES fails at any n, so the run stops and is invalid". IR-5
        covers k != 1, a formed conjugate row, and raw rank != quotient rank.
        The requirement that tau(P) must fail to lie on E_b has no IR of its
        own, but it is covered indirectly: if b were in F_2 then d_min = 1,
        k = n, and IR-5 fires.
      CTL-NONSTABLE: >-
        BLOCKING. SR-6 applies, and IR-6 fires if the control "admits any
        conjugate family as relations over W'". "Report no rank for them" is
        not itself an invalidation condition (minor).
      ordering_note: >-
        P2-5 runs after the P2-1 to P2-4 rank readouts, so both controls act as
        post-hoc invalidators rather than pre-read gates. SR-6's "stops and is
        invalid" makes nothing readable, so blocking holds. Moving P2-5 before
        P2-3, or marking ranks unreadable until P2-5 passes, would make this
        explicit.
      separation_claim: >-
        Collision (3) in the hypothesis's observation_collision and in the audit
        sheet's AUD-2 names "the null object must show k = 1" and "the
        non-stable control must refuse every family" as separators. Neither can
        detect a conjugate-builder or labelling defect. The null object forms no
        conjugate row, and the non-stable control tests set membership. See M1
        and M2.
      holds_or_breaks: holds (both block); the separation claim built on them does not.

    attack_iii_ggmp:
      reached: true
      provenance: retrieved
      source: >-
        Galbraith, Granger, Merz, Petit, "On Index Calculus Algorithms for
        Subfield Curves", IACR Cryptology ePrint Archive 2020/1315.
      version_reached: >-
        The only version listed in the archive's version history,
        "20201023:084514 PDF update (most recent)". The landing page reads
        "History 2020-10-23: received" and "Publication info: Preprint. MINOR
        revision."
      retrieval:
        urls:
          - https://eprint.iacr.org/2020/1315
          - https://eprint.iacr.org/archive/versions/2020/1315
          - https://eprint.iacr.org/2020/1315.pdf
        retrieved_at: '2026-09-24T16:29:55Z'
        http_status: 200
        pdf_bytes: 523513
        pdf_sha256: 1f15e3da7d4b85c647348e06668cdb4ad60996c8800d320bf02720fa4a182c83
        pdf_metadata: CreationDate D:20201021101015Z; pdfTeX-1.40.20; 20 pages
        text_extraction: pypdf 6.19.0; extracted-text sha256 fa8ffe1e83cc4d479a0c0150bac66400105c2a79dddb3bea73fa54335ede5f30
        location: Section 3.2, PDF page 9 (Lemma 3.3 and its proof, equation (4)); p. 10 note after Theorem 3.4
        excerpt_in: computations.json C-04 (raw extraction of PDF pages 7-10; the landing page lists licence CC BY)
      lemma_3_3_as_read: >-
        (Math normalised from the extraction.) "Let F be a Frobenius invariant
        factor base of dimension n' defined by the polynomial l(X) = sum_{j=0}^{n'}
        c_j X^j dividing X^n - 1 in F_q[X]. Given a decomposition of a point R =
        sum_{i=1}^m P_i as sum of elements in F, the Frobenius action provides at
        most n' linearly independent relations." Proof: "This is an immediate
        consequence of pi^{n'}(sum_i P_i) = sum_i pi^{n'}(P_i) = sum_i
        sum_{j=0}^{n'-1} c_j pi^j(P_i) = sum_{j=0}^{n'-1} c_j pi^j(sum_i P_i)
        (4)". Page 10 adds: "Note, that the linear dependence in Lemma 3.3 is a
        consequence of all the points in the sum having been chosen from the
        same factor base."
      comparison_with_the_contract:
        attribution: >-
          HOLDS. The three files attribute nothing to GGMP. H-BINSTD-ce4f38's
          assumptions and interpretation_limits, EXP-BINSTD-178742's
          definitions.ker_g_basis and interpretation_limits, and the audit
          sheet's IMP-GGMP all state that the paper was not read. For the
          producer session that was true.
        relay_accuracy: >-
          ACCURATE. KN-OPEN-095df5 relays the statement and that "its proof needs
          l(pi) to annihilate factor-base points". Both match the retrieved text:
          the proof's middle equality is the point identity pi^{n'}(P_i) =
          sum_{j<n'} c_j pi^j(P_i) for each factor-base point.
        wording_delta: >-
          The ker_g_basis definition says the 0/1 lift "imposes the identities
          g-hat(tau) Q = O that the relayed proof needs". Equation (4), read over
          Z, uses X^{n'} - sum_{j<n'} c_j X^j. The 0/1 lift X^{n'} + sum_{j<n'}
          c_j X^j is its characteristic-2 reading, and the source fixes no integer
          lift. For l = Phi_n the 0/1 lift vanishes at all k - 1 primitive k-th
          roots (16 at n = 17, 22 at n = 23), while the eq.(4)-literal lift
          vanishes at none. KN-OPEN-095df5's "consistent with the conclusion
          holding only for l = Phi_n" therefore presupposes the 0/1 reading. For
          the four proper divisors used, both lifts give deg h_g = 0 at both toy
          cells, so the choice does not change this review's readout. The
          contract already labels the lift a declared choice; the sentence
          should say "under the characteristic-2 (0/1-lift) reading of GGMP
          eq. (4)".
        impediment_status: >-
          IMP-GGMP depended on the producer session, which had no web tool. The
          source itself is reachable (computations.json C-02 and C-03). The
          impediment's recheck, "Retrieval of https://eprint.iacr.org/2020/1315",
          succeeds. Its clears_when ("An agent reads eprint 2020/1315 at source
          and records provenance retrieved in a new record") can be met by this
          report once archived, or by a KN-LIT record that supersedes
          KN-LIT-796. That is a Coordinator act; claim (C) stays scoped until it
          is done.
        lemma_versus_L3: >-
          See objection O-6. For a relation over a single stable base with an
          orbit hit by exactly one column, the contract's lemma L3 predicts raw
          rank k. That contradicts Lemma 3.3's "at most n'" read in the raw
          factor-base basis, which is the basis GGMP's Theorem 3.4 proof uses
          ("we only need to find (1/n') q^{n'} such relations"). The review
          computation observed this at both toy cells, at n' = 8 and n' = 11:
          raw class rank 17 and 23 respectively on relations with a singly hit
          orbit. It also found g-hat(lambda^i) != 0 mod r for every i, so the
          identity l(pi) P = O used in the proof does not hold on G there. The
          contract does not state this incompatibility.
      holds_or_breaks: holds (with the wording delta O-5, the routing point O-6 and the impediment point O-7)

  # ===========================================================================
  J4:
    joint: >-
      J4. R2 boundaries, rho convention and scope (C2, C3, dacfc2), with the
      proves-too-much objects PTM-A to PTM-D.
    verdict: breaks
    verdict_reason: >-
      Several parts hold. The R2 exclusions hold, and the rho convention and
      net-gap sentence are correct with no residual sqrt(2k) or sqrt(2n)
      figure. The census is authored once. PTM-B and PTM-C meet their failure
      signatures, and PTM-D meets its signature as literally specified. The
      joint breaks on (iv). Three sentences say the contract "lowers a claimed
      gain", and two more state a log2 k-bit movement or ambiguity in the
      relation column, but no record is named as the claimant. The one
      published source now read states the relation-count factor once, derived
      from the same orbit-representative reduction the per-orbit unit
      formalises. The 3.46-bit c2pnb176v1 figure rests on a k the contract
      itself records as NOT COMPUTED. There are two secondary defects. On PTM-A
      the rules can report a basis difference (rank_kerg = 0 against raw =
      quotient = 1) that nothing forbids. The PTM-D object, as enumerated, is
      defined over F_2, and under the contract's own k_and_q rule AR-2 passes
      on it.

    ptm_results:
      - id: PTM-A
        object: >-
          Null object E_b: y^2 + xy = x^3 + x^2 + b over F_2[X]/(X^17 + X^3 + 1),
          b = 0x17573 (first seeded draw). #E_b = 131030 = 2 x 5 x 13103 by direct
          count, r = 13103 > 2^8. W = ker f1(tau), |F_W| = 256; 73 relations
          (11 RS-1, 62 RS-3).
        rules_applied: >-
          The d_min fixed-point test gives d_min = 17 and k = 1. tau(P) is not on
          E_b. The raw class rank equals the quotient rank, which is 1, on 73/73
          relations, and IR-5 does not fire.
        ker_g_column: >-
          The contract does not say whether P2-3's four-basis readout applies to
          CTL-NULL relations. If it does, ker_g_basis at k = 1 gives mu_1 = {1}
          and g-hat_{f1}(1) = weight(f1) = 5, which is nonzero mod 13103. So
          h_g = 1, deg 0, and rank_kerg = 0 on 73/73 relations: a basis
          difference (0 against raw = quotient = 1) on an object with no
          Frobenius, with no invalidation rule covering it. The definition also
          presupposes ord(lambda) = k with lambda != 1, which cannot hold at
          k = 1. The same value 0 is what rank_kerg reads on every relation at
          both Koblitz toy cells (deg h_g = 0 for all four divisors at n = 17 and
          n = 23, under both lifts). The ker-g column therefore does not change
          when the parameter that should destroy a Frobenius effect (k -> 1)
          changes. That is the artefact tell.
        against_failure_signature: >-
          MET for raw and quotient. NOT MET, or undefined, for ker-g: under the
          natural reading of P2-3 the rules report a basis difference on PTM-A,
          which the failure signature forbids.
      - id: PTM-B
        object: >-
          A seeded random non-stable W' of the first stable W's dimension, on
          E_0 at n = 17 (dim 8, dim C(W') = 0, |F_W'| = 248, 5 families from
          32 targets) and at n = 23 (dim 11, dim C(W') = 0, |F_W'| = 2072, 7
          families). The first seeded draw was accepted in each case.
        rules_applied: >-
          The membership test finds that every family leaves the base; only
          row 0 stays in F_W' (5/5 and 7/7). CTL-NONSTABLE admits zero families,
          and IR-6 does not fire.
        note: >-
          The membership gate is the only barrier. With the gate removed, the
          rank routine returns k on every non-stable family (17 on 5/5, 23 on
          7/7). Nothing in the rank readout itself distinguishes stable from
          non-stable bases, and no reading should credit it with doing so.
        against_failure_signature: MET (no conjugate family counted as relations).
      - id: PTM-C
        object: n in {19, 29, 37}.
        rules_applied: >-
          Rabin's test shows Phi_n irreducible over F_2 at all three n; ord_n(2)
          = 18, 28, 36; the divisor degrees of X^n - 1 are {0, 1, n - 1, n}; the
          usable set (2 <= l <= n - 2) is empty; IR-3 does not fire. This is the
          PTM-C readout only; arm membership is J2's.
        power_check: >-
          A mutated enumerator that takes the order of 2 in (Z/n)^*/{+-1}
          (d = 9, 14, 18) would report usable dimensions {9, 10}, {14, 15} and
          {18, 19}. IR-3 fires on it at all three n, so the control has power
          against that plausible defect.
        against_failure_signature: MET (nothing to measure; no stable base of usable dimension).
      - id: PTM-D
        object: >-
          CTL-ADMISSION-SELFTEST exactly as specified. Curves over F_8 =
          F_2[z]/(z^3 + z + 1) are enumerated with (a, b) lexicographic by bit
          pattern, b != 0. The first with a prime factor >= 5 is (a, b) = (1, 1),
          with #E(F_8) = 14 and r0 = 7. P has order 7. The cell is embedded in
          F_2[w]/(w^15 + w + 1) and handed over with (q, k) = (8, 5).
        rules_applied_as_specified: >-
          tau_8(P) = P. The AR-2 candidates mod 7 are the double root lambda = 1,
          since X^2 + 5X + 8 = (X - 1)^2 mod 7. AR-2's lambda != 1 clause
          rejects. MET.
        rules_applied_under_contract_definitions: >-
          (a, b) = (1, 1) has both coefficients in F_2. definitions.k_and_q
          therefore gives d_min = 1, q = 2 and k = 15 (composite), not the
          handed (8, 5). Under that reading lambda for the 2-power Frobenius on
          P is 4, of order 3: lambda^15 = 1 and lambda != 1, so AR-2 PASSES.
          The cell is then rejected only by E1's size bound (7 <= 2^7). Suppose
          instead the admission routine recomputes r as the largest prime factor
          of #E(F_{2^15}) = 32494 = 2 x 7 x 11 x 211. Then r* = 211, and for the
          8-power Frobenius lambda* = 188 (lambda*^5 = 1, lambda* != 1); 211 > 2^7
          and 211^2 does not divide #E, so a different subgroup is admitted.
        mutation: >-
          Delete AR-2's lambda != 1 clause. The self-test still "rejects", via
          E1's size bound, so G3 has no power against that defect.
        corrected_object: >-
          The first (a, b) with b not in F_2 and a prime factor >= 5 is (1, 2):
          #E(F_8) = 10, r0 = 5, d_min = 3, q = 8, k = 5, lambda = 1. AR-2
          rejects it under the contract's own definitions. E1's size bound also
          rejects it (5 <= 2^7), so AR-2 must run in isolation, with the
          rejection reason recorded.
        latent: >-
          AR-2 ("lambda^k = 1 and lambda != 1") certifies ord(lambda) = k only
          for prime k. The toy cells have prime k, so this is latent. It matters
          for any composite-k row, which the c2pnb_prediction already flags as
          outside the prime-k theory.
        against_failure_signature: >-
          MET as literally specified; under every reading the lambda = 1
          subgroup is never admitted to a rank readout. The CONTROL is
          mis-specified: its object contradicts definitions.k_and_q, and its
          rejection is overdetermined.

    r2_exclusions:
      finding: HOLDS
      detail: >-
        No clause measures assembled-matrix rank growth (H-261004-1), pipeline
        cost (Part 3), the K/B memory comparison, or Block Wiedemann/Lanczos
        cost. Every hit in sweep C-06 is an exclusion clause. Specification
        metrics.secondary asks for "wall clock and peak RSS per step, reported
        beside the analytic size of the largest object". That is machine
        telemetry under the artifact policy, not a K/B comparison, and it should
        not later be read as one. section_dacfc2 derives |V|/k only. In this
        review |V|/k equalled the class-orbit count at both cells (85/17 = 5 and
        1012/23 = 44).
    census_authored_once:
      finding: HOLDS
      detail: >-
        structural_certificate.authored_once_here is the single derivation.
        H-BINSTD-ce4f38 (statement (D), predictions, proof_obligations) restates
        the values and cites the certificate. The audit sheet points to it
        ("See EXP-BINSTD-178742 structural_certificate.census"). No second
        derivation exists. If O-CENSUS-DISAGREE ever fires, those restatements
        need supersession too. The census values themselves are J5's and were
        not recomputed here.
    rho_convention:
      finding: HOLDS
      convention_in_contract: >-
        sqrt(pi r / (4 k)), with sqrt(pi/4) = 0.886 as the negation-only row.
        net_gap_restated says matched rho falls by exactly sqrt(k) = sqrt(n)
        relative to negation-only rho, and the contract states no
        index-calculus-to-rho gap. This satisfies DEC-20260924-99ce20 C2 and
        matches CORR-20260922-0d365e and Bailey et al. section 2 ("reduces the
        number of iterations by a factor of sqrt(2 * 131)" relative to generic
        rho, and sqrt(pi l/(2*2*131)) * 1.069993 ~ 2^60.9).
      residual_superseded_figure: >-
        None. No 0.886 sqrt(r)/sqrt(2k), sqrt(2n), 2^111.4 or 2^232 figure
        appears in any of the three files (sweep C-06).
      recomputation: >-
        This is arithmetic under the convention, taken from the contract's
        frozen r strings; it is not a security statement. ECC2K-130: log2 l =
        129.000000 (l / 2^129 - 1 = 8.2e-21), log2 sqrt(pi l/(4 * 131)) =
        60.809, and 60.907 with the 1.069993 walk factor. The contract gives
        60.81 and 60.91; Bailey gives 60.9. Negation-only 64.326, net fall
        3.517 = 0.5 log2 131. K-233: log2 r = 231.000, convention 111.394
        (CORR-20260922-0d365e gives 111.393), negation-only 115.326, net fall
        3.932 = 0.5 log2 233.
      note: >-
        "Exactly sqrt(k)" is a ratio of convention formulas under the
        random-mapping model. Real walks carry further factors, such as Bailey's
        1.069993, and the contract's calibration shows that. This is not a
        defect.

    over_scoped_sentences:
      - file: ledger/hypotheses/H-BINSTD-ce4f38.yaml
        field: hypothesis.interpretation_limits[5]
        quote: "This hypothesis lowers a claimed gain. It asserts nothing about the cost or the security of any standardized curve and moves no exponent."
        why: >-
          It implies that some recorded or published gain is overstated, but
          names none. See O-8.
      - file: experiments/EXP-BINSTD-178742/specification.yaml
        field: experiment.interpretation_limits[4]
