  incidental_observations_not_joint_verdicts:
    - id: INC-1
      owner_joint: J2 (TASK-20260924-a2c79b); C1 two-curves rule
      observation: >-
        I hit this while choosing my own toy cell. #E_0(F_{2^17}) = 130972 =
        2^2 x 137 x 239 by the Lucas recurrence, and a direct count over
        F_2[X]/(X^17 + X^3 + 1) agrees. The largest prime 239 is below
        2^floor(17/2) = 256, so rule E1 does not admit (n, a) = (17, 0). Under
        P2-E1 and SR-5, n = 17 then lacks a complete pair, and the run would
        halt with status incomplete_C1 before any rank readout. The contract's
        C1 residual anticipates this possibility. By contrast, at n = 23 both
        curves are admitted (r_0 = 2095853, r_1 = 4196903). n = 31 and 41 were
        not computed. This is recorded under AGENTS.md core rule 8. It is not
        a J3 or J4 verdict, and the ruling is J2's.
    - id: INC-2
      owner: knowledge curation
      observation: >-
        knowledge/literature/KN-LIT-796.md's frontmatter says
        "citation_verified: read", while its body says the entry was generated
        from the PDF's first two pages and relays the abstract without
        verification. DEC-20260924-99ce20 C4 treats it as abstract-level. This
        is not a contract defect.
    - id: INC-3
      owner: Coordinator
      observation: >-
        The "log2 k bits against the attacker" framing of O-8 and O-9
        originates in DEC-20260924-99ce20 S2 decision_it_changes, which is
        outside this review's object. The retrieved GGMP text does not support
        it either. This is a pointer, not a ruling on that decision.

