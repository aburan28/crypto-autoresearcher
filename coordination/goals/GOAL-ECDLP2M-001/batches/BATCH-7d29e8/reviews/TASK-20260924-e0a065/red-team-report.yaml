  # ===========================================================================
  J3:
    verdict: breaks
    decisive_reason: >-
      The reconciliation is exact at D = 4 only (L-EXT, F2 and F3 are all D = 4
      statements), and D* is read at D = 5..64. The contract concedes the
      reconciliation does not transfer (OC-1, the L-INT consequence paragraph,
      NM-4) and replaces transfer with the heuristic bracket [R-M, R-B] of H1.
      That bracket holds constant two multipliers that are D-dependent on the
      contract's own table or on the source's own text -- M5, the sparsity
      regime and hence the effective linear-algebra exponent (L-INT marks it
      depends_on_D yes and leaves it unmodelled in both readings; Semaev lines
      476-479 make the XL constant depend on sparsity, down to 2), and the
      block-size exponent of H1a, which Semaev states at degree 4 only (lines
      1067-1072) and the contract extends to every D without naming it. Two
      extensions that pass F1 and F2 by construction, each releasing one of
      these, cross at least 2 degrees outside [D*_B, D*_M] for every crossing
      degree in the P-C band 12 to 20 at omega 2.807 and 3.0 (on opposite
      sides), and the contract states M5's direction the wrong way for every
      in-domain omega. That is the plan's breaking artifact "a D-dependent
      multiplier treated as a constant", with the construction the plan asks for.

    attack_i_multiplier_table:
      note: >-
        Every multiplier L-INT names, plus the ones the plan lists and the ones
        found here. Values at n = 571, m* = 12, l = 48, nvar = 576 are review
        computations (computations.json, J3_multiplier_values_n571_m12). They
        are multiplier values, not costs or margins.
      rows:
        - multiplier: M1 relation-count exponent, unceiled k = n/m* against ceiled l
          contract_says: not D-dependent, not omega-dependent
          reviewer: >-
            AGREE. k - l = -0.4166667 at every D; it lives in A(n, m), which
            neither reading touches.
        - multiplier: M2 inverse per-attempt success probability, -log2 P
          contract_says: not D-dependent, not omega-dependent
          reviewer: >-
            AGREE. 28.8354552 bits at m = 12 at every D; eq. (11) has no
            degree in it. The reconciliation of M1 and M2 therefore transfers to
            every D exactly, because both readings share A(n, m) by
            construction.
        - multiplier: M3a block size n against the illustrative variable count nvar
          contract_says: D-dependent, linear, about -0.0126 bit per degree per unit omega
          reviewer: >-
            AGREE on value (-0.0503 at D = 4, -0.1509 at D = 12). NOTE that nvar
            = t l = 576 is not the Boolean variable count of system (5), which is
            n(t - 2) + kt = 6281 at t = 12 (Semaev line 612; the frozen
            instrument's macaulay4 reading). Both sides of M3a are block-size
            proxies, so M3a is small by construction and says nothing about the
            block-size exponent (row M7 below).
        - multiplier: M3b falling-factorial correction
          contract_says: D-dependent, about D(D - 1)/(2 nvar ln 2)
          reviewer: AGREE. 0.0151 at D = 4, 0.1664 at D = 12.
        - multiplier: M3c degree normaliser log2 D!
          contract_says: D-dependent and dominant; the gap between n^D and binom(n, D)
          reviewer: >-
            AGREE. 4.585 at D = 4, 28.835 at D = 12, 61.077 at D = 20. It is
            carried by the bracket: R-B uses the full normaliser g(D), R-M holds
            g(4). R-M is therefore itself the fitted-at-4-held-constant reading
            (the contract says R-FIT differs from R-M by about omega (D - 4)
            0.0126 bit and calls R-M its principled form). This multiplier is
            handled honestly by the interval and by P-S, and is NOT the breaking artifact.
        - multiplier: M4 stage convention
          contract_says: 0 in stage-1-only; D-dependent only in the total-cost convention, below 2^-90
          reviewer: AGREE. Stage 2 = 2 k* has no degree in it.
        - multiplier: M5 row weight and sparsity of the Macaulay matrix
          contract_says: >-
            D-dependent; not modelled by either surface; omission optimistic for
            index calculus
          reviewer: >-
            D-DEPENDENT AND HELD CONSTANT (at zero, with omega fixed per cell) --
            THE BREAKING ARTIFACT. Semaev lines 476-479 give the XL cost as O(n^(omega' d1))
            with 2 <= omega' <= 3 "a linear algebra constant, which depends on
            the sparsity of the matrix. It may be that omega' = 2 for a very
            sparse matrix". The Macaulay matrix sparsifies as D grows (row weight
            fixed by the equation, width growing like n^D), so the effective
            exponent is a function of D; each D*(omega) cell holds it fixed.
            DIRECTION MIS-STATED: omitting row weight is optimistic for index
            calculus only in the flagged omega = 2.0 block. For every in-domain
            omega (2.376, 2.807, 3.0), leaving out the sparse regime makes each
            higher-D solve dearer than the model's own source allows, so D* is
            placed too EARLY -- the closure (E2) side. Quantified in
            smallest_numerical_cases (b).
        - multiplier: M6 number of blocks or equations per attempt
          contract_says: not D-dependent (depends on m)
          reviewer: >-
            AGREE for the count of blocks. The Macaulay row count (number of
            equations times the degree-(D - deg f) width, not the degree-D
            width) is D-dependent and unnamed; the memory columns call the
            Macaulay width "rows". Second order against a 27-bit degree step;
            not quantified here.
        - multiplier: kappa unit conversion
          contract_says: not D-dependent; 1; about 20 in n over kappa in {1, 10, 100}
          reviewer: AGREE. Up to 6.6 bits, D-independent.
        - multiplier: M7 (NOT NAMED) block-size exponent of H1a
          contract_says: absent from L-INT; carried inside H1a
          reviewer: >-
            D-DEPENDENT AND HELD CONSTANT. Semaev line 1068 prices standard F4 at
            [n(m - 1)]^(4 omega); lines 1070-1072 conjecture the block approach
            "with the block size n. That reduces the complexity of finding the
            relation to n^(4 omega)" -- a statement made at degree 4 under
            Assumption 1. F1 selects block_n4w among the instrument's readings at
            D = 4 (audit OC-4), and both extensions then keep block size n at
            every D. The ratio to the standard-F4 count is (m* - 1)^(D omega),
            per unit omega D log2 11 = 13.84 bits at D = 4 and 41.51 at D = 12.
            An extension that keeps block size n at D = 4 (so passes F1 and F2)
            and lets growth above D = 4 follow the F4 count n(m* - 1) lies ABOVE
            R-B and moves the crossing EARLIER. Quantified in
            smallest_numerical_cases (c). Semaev's own Tables 1-2, the only
            measurements of this object, show per-solve time varying by more than
            five orders of magnitude with the chain length at fixed n and d_F4 = 4
            (n = 15, m = 5, t = 2, 3, 4, 5 take 0.0006, 0.0339, 12.95 and 174.47
            s; tables.yaml table_2). That is a dependence on the number of blocks,
            which block_n4w erases by conjecture.
        - multiplier: M8 (NOT NAMED) the optimising m
          contract_says: argmin m* = 12 invariant in D and omega (L-ARG)
          reviewer: >-
            TRUE INSIDE THE MODEL, FALSE UNDER H2. L-ARG holds because S has no
            m in it (verified; runner-up gap 0.040183 bit at 571, 0.177482 at
            283). H2 posits D_solve(m). With the degree depending on m, the
            threshold is a curve D*(m) and D*(m) <= D*(12): A(571, m) - A(571, 12)
            is 70.95 bits at m = 4 (2.58, 2.76, 3.26 R-B degree-steps at omega
            3.0, 2.807, 2.376), 44.69 at m = 5, 28.24 at m = 6. See
            attack_iv_quantifier_order.
        - multiplier: plan item -- the stage split
          reviewer: Covered by M4; D-independent in the stage-1 convention.
        - multiplier: plan item -- the cofactor charge
          reviewer: >-
            In joint_balance.py charge_cofactor toggles the whole per-solve term
            (solve = 0 when False, line 200-201), so "the cofactor" is S itself,
            the D-dependent axis. The contract's A = stage 1 with
            charge_cofactor False is correct. The curve cofactor h enters only
            the rho side (r = |E| / h), D-independent.
        - multiplier: plan item -- the omega exponent's domain
          reviewer: See attack_ii_omega and row M5.

    smallest_numerical_cases:
      method: >-
        Pairs of D-extensions that coincide at D = 4 for every omega (so both
        pass F1 and F2, which OC-1 already concedes of any such pair) are crossed
        against a FREE budget B (threshold minus the D-independent part). No rho
        value is used and no crossing at n = 571 is located. For each pair the
        report gives the smallest reference crossing degree at which some B, and
        then every B, gives a misplacement of 2 or more degrees.
      a_normaliser_fitted_at_4:
        pair: R-M (g(4) held) against R-B (g(D))
        n571: >-
          some B from reference crossing D = 7, every B from D = 10, at every
          in-domain omega. Inside the contract's interval by construction.
        smallest_case_found: >-
          The misplacement is not a large-n effect. At omega 3 it already occurs
          at the first degree above the fixture for every n from 2 to 8 -- a
          crossing at D = 5 moves by 2 or more (degenerate below n = 5, where the
          Boolean Macaulay width saturates at 2^n). Worked example n = 8, omega 3,
          B = 37.8679 bits -- R-B crosses at D = 5, R-M at D = 7.
        disposition: Handled by the contract (interval plus P-S). Not the breaking artifact.
      b_linear_algebra_exponent_fitted_at_4:
        pair: R-M against S_sp(D) = 4 omega log2 n + 2 (W(n, D) - W(n, 4))
        n571: >-
          omega 3.0 -- some B from D*_M = 6, every B from 9. omega 2.807 -- 7
          and 10. omega 2.376 -- 9 and 15. Worked example at omega 3, B =
          149.7009 bits -- R-M crosses at 6, S_sp at 8.
        inside_P_C_band: >-
          For every R-M crossing degree 12 to 20 the misplacement is 3 to 11
          degrees at omega 3.0 and 3 to 9 at 2.807; at 2.376 it is 1 to 2 for
          crossings 12 to 14 and 2 to 4 for 15 to 20. S_sp crosses LATER than
          D*_M, outside the interval.
      c_block_exponent_fitted_at_4:
        pair: R-B against S_hyb(D) = 4 omega log2 n + (D - 4) omega log2(n (m* - 1))
        n571: >-
          some B from D*_B = 9, every B from 12, at every in-domain omega.
          Worked example at omega 3, B = 221.6077 bits -- R-B crosses at 9,
          S_hyb at 7.
        inside_P_C_band: >-
          For every R-B crossing degree 12 to 20 the misplacement is 2 to 5
          degrees at every in-domain omega. S_hyb crosses EARLIER than D*_B,
          outside the interval.
      reading: >-
        The interval [D*_B, D*_M] is the spread between two chosen readings, not
        a bracket of the model uncertainty the contract's own multiplier list
        implies. Both omitted D-dependent multipliers move a crossing in the
        prediction band by at least 2 degrees, in opposite directions, so the
        honest envelope is wider on both sides.

    attack_ii_omega:
      finding: >-
        omega HAS a meaning inside block_n4w -- it is eq. (15)'s linear-algebra
        constant with stated domain 2.376 <= omega <= 3 (Semaev line 1088) and a
        free field of the frozen Model (joint_balance.py lines 125-140 and 167).
        So D*(omega) is not read where omega has no meaning. But the fixture F1
        and the only recorded evaluation exist at omega = 3 alone (curve_table.py
        uses the Model default 3.0), and at other omega the anchor is F2, an
        identity that cannot fail. G4's known truth is also omega = 3 only. At
        in-domain omega 2.376 the contract's own formula puts K-283 and B-283
        below the corrected rho at D = 4 (margins -8.933 and -13.505 bits), and
        B-283 is within +0.536 bit at omega 2.807. The D*(2.376) cells, a third
        of P-C, are read in a model whose nearby-object control is not merely
        ungated there but lands on the side the failure signature names. The
        contract foresees this (FD-2) and routes it (RT-4), and still scores P-C
        on those cells. omega = 2.0 is outside eq. (15)'s domain but inside
        Semaev's XL omega' domain [2, 3] (lines 476-479); the contract's
        out-of-domain flag is right for block_n4w, and the flagged block is where
        the sparse regime of M5 actually lives.

    attack_iii_heuristics:
      H1:
        fields_present: statement, rigorous_support, random_model_justification (none claimed), supporting_results, validation_route, falsification_condition
        objections:
          - id: H1-Q
            what: >-
              QUANTIFIER MISMATCH. formal_statement is quantified at "n = 571,
              m = t = 12". Its only non-circular falsification_condition is
              "Outside it -- a measured per-solve cost at toy n whose growth in the
              solving degree falls outside the [S_M, S_B] bracket". A toy-n
              measurement cannot falsify a statement quantified at n = 571, and no
              measurement at n = 571 is feasible. As stated, H1 has no
              falsification condition any feasible observation can trigger.
          - id: H1-V
            what: >-
              IN-CONTRACT FALSIFIERS ARE VOID TRIGGERS. H1.falsification_condition
              lists "F1 fails, F2 fails, or the rules place K-283, B-283, 163, 233
              or 131 below rho at D = 4, omega = 3 (G4)". The hypothesis's own
              falsification_conditions classify F1, F2 and G1 failure as "VOID, not
              refuted" and G4 failure as "VOID for the D* reading". The two lists
              contradict each other, and under the second none of the in-contract
              conditions can falsify H1.
          - id: H1-C
            what: >-
              VALIDATION IS SELF-CONSISTENCY. F1 compares the frozen instrument
              with a row the same instrument produced through the same call path
              (RUN-SEMBIN-a7a2f3). F2 is an identity by construction (L-EXT). G4's
              known truths are outputs of the same model (EXP-SEMBIN-992e73
              evaluates the same instrument). None can fail unless the code or the
              rho column is wrong, and none bears on whether Semaev's per-solve
              cost is right at D = 4 or elsewhere. C6 is discharged in form; the
              contract's own label, "instrument consistency", is the accurate one,
              and scale_relevance's "H1, which is validated here at D = 4 only"
              overstates it. The only measurements of this object (Semaev Tables
              1-2, d_F4 = 4, n = 12..21 and one row at n = 40) are not used.
          - id: H1-L
            what: >-
              LOWER EDGE UNSUPPORTED. The rigorous_support clause (dense
              elimination of a matrix with 2^W(n, D) columns) gives a per-solve
              cost of omega W(n, D), which lies omega g(4) below S_M at every D,
              D = 4 included -- 13.77 bits at omega 3. The clause supports the
              upper edge only. The lower edge is the fixture value carried forward
              with the D = 4 slack held constant.
          - id: H1-S
            what: >-
              SCALE DISCLOSURE. RQ-NISTBIN-06157b constraint 2 requires any
              statement about m = 571 to state "the ratio of the extrapolation span
              to the measured span". The d_star_sentence template does not. For the
              record, Semaev's measured span is n <= 21 (one row at 40), t <= 6 and
              at most 60 Boolean variables; the m = t = 12 system at n = 571 has
              6281, about 105 times more, at twice the largest chain length. H1's
              off-D shape has no measured span at any n.
      H2:
        fields_present: statement, rigorous_support (none), random_model_justification (random-system null, left with Part 3), validation_route (pointer to GOAL-SEMBIN-fcb7a2), falsification_condition
        objections:
          - id: H2-U
            what: >-
              UNNUMBERED BRIDGE. formal_statement names "The true (U-4-discharged)
              solving degree D_solve(m)". U-4 bookkeeping discharges the
              first-fall inequality d_F <= d'_F (KN-FIND-936151 section 4), not a
              solving degree. Getting from a first fall degree to d_F4 is Semaev's
              first fall degree assumption, "Although not generally correct" (line
              519). IR-2 requires that step as "a separately numbered heuristic
              equating it with the solving degree"; H1-H4 contain none. The wording
              is inherited from DEC-20260924-99ce20 S1 scope.
          - id: H2-N
            what: >-
              MISSING ARGUMENT. H2 is "a law in m" extrapolated "to the m = 12,
              n = 571 shape". The extrapolation also spans n (21 to 571) and
              k = n/m (a toy n at m = 12 has k below 2, against 47.6 at 571). A
              law with no n or k argument cannot be falsified along the axis the
              extrapolation mostly spans. "Disagreement with the random-system
              null" is not quantified.
          - id: H2-OK
            what: >-
              Numbered, pointer-only, enters no prediction, and the random-system
              null is left with Part 3 as C6 says. These parts hold.

    attack_iv_quantifier_order:
      holds_in_part: >-
        The cliff is derived and nothing ranges over the true solving degree
        (audit A3). D* is never presented as measured (definitions.d_star,
        interpretation_limits, the d_star_sentence template).
      hidden_quantifier_m: >-
        D* is defined at the D = 4 argmin m* = 12, which L-ARG makes invariant
        only because the per-solve term has no m in it. Under H2 the degree
        depends on m, so the index-calculus side loses the cell only if the true
        degree exceeds D*(m) for EVERY m, with D*(m) <= D*(12). Any single-m
        comparison can therefore close the cell prematurely by up to 2.6 to 3.3
        R-B degree-steps at m = 4. The audit sheet writes the closure event with
        the single-m quantifier (J4.cell_sentences S-13). The contract hands one
        per-omega threshold to GOAL-SEMBIN-fcb7a2 ("the threshold any later
        true-degree measurement must be read against").
      hidden_quantifier_omega: >-
        omega is held fixed across all D inside each D*(omega) cell, although the
        source makes the XL constant sparsity-dependent (row M5).

    what_survives: >-
      L-INT is a genuine lemma, not prose; it names M1-M6 and kappa, and its
      D-dependence classification is right except for M5's direction and the
      missing M7 and M8. L-EXT, L-MON, L-SPREAD and L-ARG hold inside the model
      (L-MON and L-SPREAD checked on D = 2..64 at n = 283 and 571 for every
      in-domain omega; R-B lies below R-M only at D = 2 and 3, which L-SPREAD
      excludes). The D-independent reconciliation (M1, M2, M4) transfers to every
      D exactly. R-B is the source's own eq. (13), O(n^(omega d_F4)), with the
      block size substituted, so the upper edge is sourced. D* is never presented
      as measured. As a derived quantity -- D* in the dense, fixed-omega,
      block-size-n model at m = 12 -- D* is well defined and correctly
      specified.
    what_would_make_it_hold: >-
      Either (i) carry M5 and M7 as explicit readings (S_sp and S_hyb, or better
      ones), report D* as the envelope over all readings, correct M5's stated
      direction, and add M7 and M8 to L-INT; or (ii) restrict every D* sentence,
      the decision mapping and the threshold handed to GOAL-SEMBIN-fcb7a2 to "the
      dense, fixed-omega, block-size-n model at m = 12". In both cases restate H1
      over a range of n that includes the toy ladder (or number the transfer
      assumption separately), reconcile H1's falsification_condition with the
      VOID rules, and number the first-fall-to-solving-degree bridge that H2's
      wording presupposes.

  # ===========================================================================
  J4:
    verdict: holds
    decisive_reason: >-
      At every point where a known truth exists, the contract's rules -- not
      only its prose -- keep each known-false conclusion out of reach. PTM-A and
      PTM-B land on the rho-wins side at D = 4, omega = 3. PTM-C is excluded by
      BR-1 with V-5 and C-BR1 behind it. PTM-D is refused by IR-1 (no input
      path) and, for any later overlay, by IR-2's U-4 rule, which the fake
      witness fails. No clause designs Part 3 or re-measures a SEMBIN quantity.
      Every E1, E2 and cell-verdict route names review-breakthrough at max, and
      RT-0 covers every valid run. The surviving objections are real (RT-4 is
      certain to fire; the claim-(A) degree list omits 359; three wording routes)
      but none is a breaking artifact the plan lists.

    ptm_results:
      - id: PTM-A
        object: K-283 and B-283 at D = 4 under the reconciled surface and the corrected column
        known_truth_confirmed_at_source: >-
          YES. EXP-SEMBIN-992e73 RESULTS.md, row 283 -- 147.65 against naive
          141.5, margin +6.15, rho wins; raw-result.json log2_cost 147.649,
          m_star 9. The run evaluates at the Model default omega 3.0
          (curve_table.py line 55). No difference from the plan's citation.
        computed: >-
          C_B = C_M = 147.649478 at m* = 9 (own re-implementation; the instrument
          was not imported). K-283 rho 136.253419 from FIPS r and k = 283, margin
          +11.396059 (+11.396078 against the contract's frozen column 136.2534).
          B-283 rho 140.825748, margin +6.823730 (+6.823778 against 140.8257).
          Naive margin +6.149478 reproduces the recorded +6.149.
        against_failure_signature: MET (rho wins at D = 4, omega = 3, in both curves).
        beyond_known_truth: >-
          At omega 2.376 the same rule gives -8.933 (K-283) and -13.505 (B-283);
          at 2.807, +5.108 and +0.536. No known truth exists there (FD-2), so
          this is not a PTM failure. It is a J3 finding (attack_ii_omega) and it
          fires RT-4.
      - id: PTM-B
        object: >-
          FIPS 163 and 233, and Certicom 239 (ECC2K-238, ECC2-238), declared
          before evaluation as the Certicom degree with the smallest recorded
          rho-wins margin (+20.34), i.e. the most inconvenient available. The
          contract's own G4 choice, 131 (+49.92), is evaluated alongside.
        known_truth_confirmed_at_source: >-
          YES. RESULTS.md rows 163 +42.27, 233 +22.23, 239 +20.34, 131 +49.92, all
          rho wins, omega 3.0.
        computed: >-
          At D = 4, omega 3 against the corrected column -- K-163 +46.618, B-163
          +42.944, K-233 +27.335, B-233 +22.903, ECC2K-238 +25.460 (k = 239),
          ECC2-238 +21.509 (h = 4 per the Certicom document). Contract's 131 --
          ECC2K-130 +54.606, ECC2-131 +50.589.
        against_failure_signature: MET for every declared object.
        beyond_known_truth: >-
          At omega 2.376 ECC2-238 is +1.789 and B-233 +3.274; at 2.0 every one of
          233 and 239 is below rho. G4's Certicom choice (131) is the least
          stressful; 239 would be the stronger gate.
      - id: PTM-C
        object: 409 read against the naive column instead of the coherent baseline
        known_truth: >-
          H-SEMBIN-97ea23 (supported, DEC-20260915-fad1c1) -- C1 holds under all
          four storage readings, with coherent crossovers above 409 (460 sparse,
          520 dense).
        computed: >-
          BR-1 re-implemented verbatim. (i) The naive column offered with the
          coherent margins missing -- UNRESOLVED, never LIVE; BR-1 has no slot for
          it and the only time-only slot, clause (b), can only make a row DEAD.
          (ii) The naive margin pasted INTO the coherent slot -- LIVE. BR-1's
          text forbids exactly this substitution and V-5 invalidates it. (iii) The
          coherent sign pattern H-SEMBIN-97ea23 records (IC dearer under every
          reading) -- DEAD by clause (a) after SN-1 and the delta shift (delta
          5.338 bits for K-409, 0.500 for B-409). SN-1 sign check, using the
          COST-SEMBIN-8d123b figure as H-SEMBIN-97ea23 quotes it -- -37.781 plus
          37.78 gives -0.001, within 0.01.
        against_failure_signature: MET (excluded by the baseline rule before any cell is counted).
        residual: >-
          The barrier is the rule text plus the import slice, and the slice is
          under-pinned. H-SEMBIN-97ea23's grid carries at least ten axes,
          including baseline_charging_modes (with the non-coherent record point),
          alpha_grid [0.0 .. 1.0], degree_bound_variants [4, 5, 6], cofactor and
          k readings. BR-1 pins D = 4, omega, kappa and storage reading, and
          inputs names product-minimum. C-BR1's unit test sets coherent margins to
          missing values and would not catch a mis-sliced import, which (ii) shows
          is all it takes.
      - id: PTM-D
        object: >-
          A fake d'_F fed as D. KN-FIND-936151 and EV-SEMBIN-1ca3c8 record NO
          descended-system toy n at which fake and true readings differ
          (boundary -- "N <= 3 variables. Nothing is checked at the N of any
          descended system"). The object used is therefore witness A (F_2[X, Y],
          f1 = X^2 Y, f2 = XY + X, d'_F = 2, d_F = 3), the recorded instance with
          fake different from true. Disclosed as procedure deviation PD-1.
        computed: >-
          (a) IR-1 -- the surface takes D only from the literal grid 2..64, with
          no argument, file field or configuration key for a recorded degree, so
          offering d'_F = 2 is not an admissible call; V-2 invalidates any run
          that reads one. (b) IR-2 for a later overlay -- all 64 fake witnesses
          realising d'_F = 2 were enumerated (g1, g2 in span{1, X, Y, XY}); none
          has unreduced max_i deg(g_i f_i) <= 2; the minimum is 3. The overlay is
          inadmissible, consistent with the witness being a counterexample to
          Lemma 4.
        against_failure_signature: MET (rejected as an inadmissible input before any D* is read).

    fake_degree_input_search:
      admissible_fake_degree_input_found: false
      objections:
        - id: FD-IR1
          what: >-
            IR-1 is broader than the contract can execute. It says the code "reads
            no field named or labelled as a degree" and V-2 invalidates "any D
            value read from a file, argument or record". C-XDEG must select
            COST-SEMBIN-8d123b's "degree-5 sensitivity row", and BR-1 must select
            the degree-bound-4 slice of coherent-baseline records whose declared
            grid includes degree_bound_variants [4, 5, 6] (H-SEMBIN-97ea23
            test_boundary; the records themselves are outside this card's read
            scope). Both read a degree-labelled field. Neither is a fake first
            fall degree, but the literal rule cannot be kept, and a rule that
            must be reinterpreted at execution is the path by which a later
            reading gets loosened. Narrow IR-1 to "no recorded degree enters the D
            axis or any cost formula", with the two row selectors listed by path
            and field.
        - id: FD-H2
          what: >-
            H2's "true (U-4-discharged) solving degree" names an object admissible
            only through the unnumbered first-fall-to-solving-degree bridge (J3
            H2-U). IR-2 would still refuse a later overlay made that way, so this
            is a latent route, not an admissible input.
        - id: FD-CONV
          what: >-
            IR-2 defines the solving degree as "the maximal degree reached by the
            solving computation, the analogue of Assumption 1's d_F4". Semaev
            reports that, for systems with a solution, the degree-4 steps "were
            followed by at most three more steps, where step degree was 5, 6, 7
            with the message No pairs to reduce", and records d_F4 = 4 (lines
            632-637). So "maximal degree reached" can read as up to 7 while
            Semaev's d_F4 reads 4 -- two readings up to 3 degrees apart on the only
            measured data. The fixture anchors D = 4 to Semaev's d_F4 reading. Pin
            that convention in IR-2.

    r2_boundaries:
      part_3_designed: false
      sembin_or_sdeg_quantity_re_measured: false
      closest_clause:
        file: experiments/EXP-NISTBIN-451dfa/specification.yaml
        field: controls C-XDEG
        quote: >-
          Cross-check against the program's earlier degree sensitivity. At n =
          409, omega = 3, compute C_B(409, 5, 3) - C_B(409, 4, 3) and C_M(409, 5,
          3) - C_M(409, 4, 3), and set them beside COST-SEMBIN-8d123b's recorded
          degree-5 row ... Reports which D-extension, if either, the earlier
          record used.
        ruling: >-
          Arithmetic on a modelled SEMBIN quantity, diagnostic and non-gating,
          not a measurement. Consistent with DEC-20260924-99ce20 S1 r2_owner ("The
          surface is arithmetic over SEMBIN's published numbers, not a
          re-measurement") and DEC-20260924-4f8a03 R2. Its only problem is FD-IR1.
      other_clauses_checked: >-
        scope.out_of_scope (Part 3 excluded, SEMBIN recomputation excluded, FROB
        and lane-B orbit savings excluded); H-NISTBIN-dec5e1 scope_note; H2
        validation_route (pointer only). H2's falsification_condition prefigures
        Part 3's analysis (residuals against m, matched-shape null); C6 requires a
        falsification condition, so this is not a design of Part 3.

    cell_sentences:
      note: >-
        Every sentence in the three files that opens, closes or gives a verdict on
        the 571 cell, or defines E1 or E2, found by a case-insensitive sweep for
        cell, E1, E2, live, verdict, open, close, decid, threshold, plausible,
        below rho, beats and wins (command in computations.json), then read in
        context.
      routing_clause_names_tier: >-
        YES. H-NISTBIN-dec5e1 routing.tier "review-breakthrough at max,
        non-degradable"; specification routing.tier the same, with RT-0 to RT-6
        each naming "review-breakthrough round at max" and RT-6 forbidding a
        lower tier.
      items:
        - id: S-1
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: statement
          quote: >-
            The strongest statement any outcome can certify is D*(omega) in the
            reconciled model, assuming H1. No outcome of this hypothesis opens or
            closes the 571 cell.
          ruling: Ceiling sentence. Compliant.
        - id: S-2
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: statement
          quote: >-
            together with its claim (A) that at D = 4 and omega = 3, under baseline
            rule BR-1 (...), 571 is the only live degree among the FIPS, Certicom
            and Oakley degrees.
          ruling: >-
            A prediction under test (P-A), scoped to D = 4 and one omega, required
            by C1, routed (RT-0, RT-4, RT-5). Not TA-1. Its universal over the
            families is evaluated over a list that omits 359 (X-1).
        - id: S-3
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: mechanism
          quote: >-
            The whole 571 margin reported by EXP-SEMBIN-992e73 therefore sits on
            one integer, the solving degree, which the program has checked only at
            n <= 21
          ruling: >-
            Not a verdict. Overstated framing -- at D = 4 omega alone moves the
            per-solve term by 4 x 0.624 x log2 571 = 22.86 bits between 3 and
            2.376, and the H1a reading choice moves the D = 4 cost by 26.75 bits
