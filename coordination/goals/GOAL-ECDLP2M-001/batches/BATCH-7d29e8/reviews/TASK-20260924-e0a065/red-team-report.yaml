            condition (CLAUDE.md rule 9). (Quoted with the source's colons after
            "K2x" and "K4" rendered as dashes.)
        - id: S-11
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: routing.rules RT-0 to RT-6 and routing.note
          quote: >-
            RT-1 any output, sentence or reading that reads as E1 (...) goes to its
            own review-breakthrough round at max. RT-2 ... E2 (the 571 cell closed)
            ... RT-3 any verdict on the 571 cell beyond D*(omega) in the reconciled
            model assuming H1 ... This contract has no input from which the true
            solving degree could be read, so E1 and E2 cannot be outputs of a
            valid run.
          ruling: Routing clauses. Name the tier. Compliant.
        - id: S-12
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: output_templates.d_star_sentence, claim_a_sentence and forbidden
          quote: >-
            It states nothing about the true solving degree of any system and
            nothing about the security of any curve. ... the LIVE set of the frozen
            cost model is {set}, with {u} degrees UNRESOLVED. This is a count at
            one parameter point of a cost model under Assumption 1's degree and is
            not a verdict on any cell. ... Any sentence using "break", "weak",
            "vulnerable", "safe", "secure", "attack succeeds", "opens" or "closes"
            about any curve or cell.
          ruling: >-
            Scoped and routed. Objections -- the claim-(A) template uses LIVE, the
            program's cell-status word, while disclaiming a cell verdict, and the
            forbidden list omits "live" and "decides"; the d_star_sentence omits
            the extrapolation-span ratio RQ-NISTBIN-06157b requires (J3 H1-S) and
            the dense, fixed-omega, block-size-n qualifier. The claim-(A) output
            exists because C1 of DEC-20260924-99ce20 requires it, while C7 caps
            Parts 1-2 at D*(omega); the tension is the decision's, and the composer
            should rule on it (X-3).
        - id: S-13
          file: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-fda726/proof-search-map-audit.yaml
          field: audits.A3_quantifier_order.what_is_not_quantified
          quote: >-
            The statements E1 (EXISTS a true degree below D* at the m = 12 shape)
            and E2 (the true degree exceeds D*) are Part-3 statements and are not
            reachable from this contract.
          ruling: >-
            Definitional, routed by RT-2, not TA-1. The most substantive wording
            defect -- this E2 ("the true degree exceeds D*", at one m) is weaker
            than the routing's E2 ("the 571 cell closed"), which needs the degree
            to exceed D*(m) at every m and needs the model scope. A later
            single-m result would arrive pre-labelled as closure.
        - id: S-14
          file: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-fda726/proof-search-map-audit.yaml
          field: frozen_c2_fixture.margins_against_both_corrected_rows.note and audits.A1_bottleneck_and_baseline_fixture.bottleneck
          quote: >-
            They are the fixture point of a model and are NOT a verdict on the 571
            cell (tripwire TA-1). ... Decision-changing because it fixes the
            threshold against which any later true-degree measurement is read
          ruling: First compliant; second carries the S-4 objection.
        - id: S-15
          file: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-fda726/proof-search-map-audit.yaml
          field: audits.A4_method_ceiling_and_nearby_object_control.strongest_certifiable_claim and c1_c8_discharge_table C7
          quote: >-
            D*(omega) in the reconciled model, assuming H1 ... no sentence opens or
            closes the cell
          ruling: Compliant.

    routing_calibration:
      id: RT4-CERTAIN
      what: >-
        RT-4 routes "any degree other than 571 ... with a non-positive corrected
        time-only margin at any omega including 2.0" to its own
        review-breakthrough round. On the contract's own formulas it fires on
        every valid run -- K-409 and B-409 at every omega, including omega 3.0
        (-32.444, -37.282; the contract's W8.3 and FD-3 already establish this);
        K-283 and B-283 at 2.376 and 2.0; K-233, B-233, ECC2K-238 and ECC2-238
        at 2.0; and 359 at every omega if it were listed. This over-routes rather
        than under-routes, but a rule certain to fire carries no information and
        adds a guaranteed extra non-degradable round, which under RT-6 can hold a
        run's result un-promoted over a pre-documented artifact. Route only a
        sign that differs from a pre-registered expectation table.

    surviving_objections: [RT4-CERTAIN, PTM-C residual, FD-IR1, FD-H2, FD-CONV, S-3, S-4, S-9, S-10, S-12, S-13, X-1]

  # ===========================================================================
  cheapest_falsification:
    performed: >-
      For J3's transfer-and-bracket claim. Evaluate, beside R-B and R-M, the two
      D-extensions that pass F1 and F2 by construction and release the
      contract's own D-dependent multipliers -- S_sp (effective linear-algebra
      exponent falling to Semaev's XL value 2 above D = 4) and S_hyb (growth
      above D = 4 at the standard-F4 variable count n(m* - 1)). The bracket
      claim is refuted if either crosses 2 or more degrees outside [D*_B,
      D*_M]. Done here against a free budget -- refuted for every crossing
      degree 12 to 20 at omega 2.807 and 3.0. It costs one line per reading in
      Stage 6 and needs no measurement.
    not_performed_pointer: >-
      For H1 itself (an empirical claim), the cheapest falsifier is a toy-n
      measurement of per-solve F4 cost against forced maximal degree at fixed n,
      testing whether the increment per degree stays inside [omega
      log2((n - D)/(D + 1)), omega log2 n] for some in-domain omega. That is
      SDEG/ICPERF measurement territory and a pointer here, as the contract says.

  uncharged_cost_terms:
    - term: sparse or XL linear-algebra regime (M5; Semaev lines 476-479)
      d_dependent: true
      direction: omission raises every higher-D solve cost for in-domain omega, moving D* earlier (closure side); stated the other way in the contract
      magnitude: 2 or more degrees of misplacement for crossings 12 to 20 at omega 2.807 and 3.0
    - term: block-size exponent above D = 4 (M7; H1a extended beyond Semaev's degree-4 statement)
      d_dependent: true
      direction: omission lowers every higher-D solve cost, moving D* later (the index-calculus side)
      magnitude: 2 to 5 degrees for R-B crossings 12 to 20 at every in-domain omega
    - term: m-dependence of the solving degree against a single-m threshold (M8)
      d_dependent: not a D multiplier; a quantifier
      direction: a single-m threshold can declare closure early
      magnitude: D*(m) below D*(12) by up to 2.6 to 3.3 R-B steps at m = 4
    - term: Macaulay row count and shape (rows = equations x degree-(D - deg f) width)
      d_dependent: true
      direction: not determined here
      magnitude: second order against a 27-bit step; not quantified
    - term: F4 step count (Semaev lines 499-501, total over largest step about 3 at n about 50)
      d_dependent: weakly
      direction: raises cost
      magnitude: at most about 1.6 bits
    - term: memory in the D* reading
      d_dependent: true
      direction: disclosed; by L-MONO a memory-charged crossing is no later than the time-only D*
      magnitude: not computed by the contract; disclosed
    - term: kappa
      d_dependent: false
      direction: unknown in general; disclosed
      magnitude: up to 6.6 bits over kappa in {1, 10, 100}

  null_and_nearby_object_controls:
    checked:
      - >-
        PTM-A nearby object (283) at the known-truth point -- works (rho wins by
        11.40 and 6.82 bits).
      - >-
        The same nearby object at in-domain omega 2.376 -- FAILS in the direction
        the failure signature names (-8.93, -13.51), with no known truth to
        contradict. The D*(2.376) cells have no working control.
    missing:
      - >-
        An independent-truth nearby object. G4's known truths are outputs of the
        same model, so G4 is a regression check on the column shift and the
        implementation, not a proves-too-much control on the cost model.
      - >-
        Any control on H1's off-D shape. None exists in the contract; the named
        route is an SDEG/ICPERF pointer. Accepted as scoped, but it means the
        D-shape that D* depends on has zero validation.
      - >-
        The random-system null. Correctly left with Part 3 (C6). For a
        derivation, a null on the cliff itself is not meaningful.

  extrapolation:
    span: >-
      Assumption 1 is checked here only at n <= 21 (EV-ICPERF-a8080e via
      EXP-SEMBIN-992e73). Semaev's measurements reach n = 21 (one row at 40),
      t <= 6 and at most 60 Boolean variables. The D* statement concerns n = 571,
      t = 12 and 6281 variables -- about 27 times in n, 2 times in t and 105
      times in variables. H1's off-D shape has no measured span at all.
    breaks_first: >-
      The block-size conjecture at D above 4 (M7), then the fixed
      linear-algebra exponent as the matrix sparsifies (M5), then the single-m
      threshold (M8).

  survival_statement: >-
    J3 did not survive. The derivation of D* inside the dense, fixed-omega,
    block-size-n model at m = 12 is sound. The claim that the D = 4
    reconciliation, through [R-M, R-B], carries to the D where D* is read did not
    survive -- two F1/F2-consistent extensions built from the contract's own
    D-dependent multipliers fall outside the interval by 2 or more degrees across
    the prediction band. Remaining uncertainty -- whether a true block-structured
    solve behaves like any of these readings is unknown; the objection is that
    the interval understates the model uncertainty, not that it is wrong. J4
    survived. Each PTM keeps its known-false conclusion out of reach by rule at
    the point where a known truth exists. Remaining uncertainty -- PTM-C's
    protection depends on an under-pinned import slice; two latent wording routes
    (FD-H2, FD-CONV) could let a later record read a first-fall or
    differently-defined degree as D; and the claim-(A) list is incomplete (X-1).

  cross_joint_observations:
    - id: X-1
      for: composer; bears on C1 (J1's joint) and on RT-4
      what: >-
        The claim-(A) Certicom list {97, 109, 131, 163, 191, 239}, copied from
        EXP-SEMBIN-992e73, omits the binary degree 359. The contract's own named
        source for Certicom parameters lists ECC2-353 and ECC2K-358 over
