            to one 27.47-bit degree step. The framing feeds S-10's "deciding
            measurement".
        - id: S-4
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: proof_search_map.bottleneck
          quote: >-
            It is decision-changing because it fixes the threshold any later
            true-degree measurement must be read against.
          ruling: Not a verdict. Single-m threshold (J3 attack_iv). Wording objection.
        - id: S-5
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: predictions P-A note
          quote: >-
            It is not a verdict on the 571 cell or on any other cell, and any
            outcome that changes the count is routed to review-breakthrough.
          ruling: Compliant.
        - id: S-6
          file: ledger/hypotheses/H-NISTBIN-dec5e1.yaml
          field: routing.rule and routing.e1_e2_note
          quote: >-
            any result, sentence or reading that reads as E1 (index calculus below
            rho at 571 at the TRUE solving degree), E2 (the 571 cell closed), any
            verdict on the 571 cell beyond D*(omega) in the reconciled model
            assuming H1, a second LIVE degree, 571 DEAD under BR-1, or any degree
            other than 571 below the corrected time-only column at any omega, is
            routed to its own review-breakthrough round at max. ... E1 and E2 are
            Part-3 outcomes.
          ruling: Routing clause. Names the tier. Compliant.
        - id: S-7
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: objective
          quote: >-
            The decision this changes is how the reachability table records the
            571 cell -- as a conditional computed cost with a named cliff edge
            D*(omega) in the reconciled model, or as an unqualified point estimate;
            and which threshold GOAL-SEMBIN-fcb7a2's true-degree work would be
            read against.
          ruling: >-
            Scoped; compliant. The single threshold carries the S-4 objection.
            (Quoted with the source's colon after "cell" rendered as a dash.)
        - id: S-8
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: frozen_c2_fixture.margins_at_fixture_point
          quote: >-
            At D = 4, omega = 3 the model's stage-1 cost 186.3070 (...) lies
            93.4401 bits below the corrected K-571 figure 279.7471 and 98.5188
            bits below the corrected B-571 figure 284.8257. These are the fixture
            point of a model under Assumption 1's degree, NOT a verdict on the 571
            cell.
          ruling: >-
            Required by C2 ("The margin is quoted against both corrected rows"),
            labelled as the fixture point of a model. Not TA-1. Figures quoted from
            the object, not computed here.
        - id: S-9
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: procedure stage 8 and invalidation_rules V-8
          quote: >-
            RESULTS.md states no sentence about the 571 cell other than the
            templated D* sentence. ... V-8 any sentence in RESULTS.md about the 571
            cell outside output_templates
          ruling: >-
            Inconsistent pair. Stage 8 allows only the D* sentence about 571;
            output_templates also contains claim_a_sentence, which necessarily
            states 571's class, and V-8 allows any template. Minor; make Stage 8
            read "outside output_templates".
        - id: S-10
          file: experiments/EXP-NISTBIN-451dfa/specification.yaml
          field: success_criterion.decision_mapping
          quote: >-
            K1, K2 and K2x -- the threshold lies within reach of plausible solving
            degrees, and Part 3 is pointed to GOAL-SEMBIN-fcb7a2 as the deciding
            measurement for the 571 cell, with the interval [D*_B, D*_M] per omega
            as the threshold. K4 -- the cell stays conditional and Part 3 is not
            prioritised on its account.
          ruling: >-
            Not a verdict, and inherited verbatim in substance from
            DEC-20260924-99ce20 S1 decision_it_changes. Three objections -- "the
            deciding measurement for the 571 cell" drops "in the reconciled model
            assuming H1" and the every-m quantifier; "plausible solving degrees" is
            undefined; "per omega" does not say whether the flagged omega = 2.0
