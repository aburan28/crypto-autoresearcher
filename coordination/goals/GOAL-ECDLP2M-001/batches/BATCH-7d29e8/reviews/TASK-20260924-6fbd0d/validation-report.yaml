            order 2^n + 1 - V_n equals h r exactly. k is established by computation.
            For the Koblitz curves the Frobenius eigenvalue lambda (a root of
            x^2 + x + 2 mod r) has lambda^n = 1 and lambda != 1 with n prime, so
            k = n. For the B-curves b is not in F_2 and n is prime, so k = 1.
          table:
            - {curve: K-571, bit_length: 570, h: 4, k: 571, log2_matched_rho: 279.74707460, contract: 279.7471, abs_diff: 2.54e-5}
