            max_i deg(g_i f_i) <= d'_F at that instance, and report the result as
            discharged by that bookkeeping, never by Lemma 4. IR-2 also reproduces the
            section 2 rule to state which side each placement of S_fe is on.
            H-NISTBIN-dec5e1's third assumption says Lemma 4 as printed is false as a
            universal statement over F_2 under the equality reading. It also says the
            findings assert nothing about Semaev's Assumption 1 (correctly stated, not
            refuted) and nothing about descended systems or curves. That matches the
            finding's header and EV-SEMBIN-1ca3c8's boundaries, and nothing says
            Assumption 1 is refuted. The audit sheet's C4 attestation names each source
