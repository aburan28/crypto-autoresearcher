  scope_restatement: >-
    The object is a DERIVATION-ONLY contract: closed-form evaluation of Semaev 2015's
    cost model as frozen in EXP-SEMBIN-81dc96 (block_n4w, t = m, stage 1, unceiled k,
    m 2..30). It is extended in D by R-B and R-M, with a D grid of 2..64, omega in
    {2.376, 2.807, 3.0} plus 2.0 flagged, and parameter labels n = 571 and 283 plus
    the claim-(A) degrees. The budget is one run of 900 s at 1 GB, with no solver and
    no curve. Its scale_relevance "crypto" describes parameter labels only, and the
    contract says so. Within J1 and J2 no toy-scale result is presented at crypto
    scale. This review's own computations are the rho column at four FIPS curves and
    ECC2K-130, and the fixture at D = 4, omega = 3, n in {571, 283}. No speedup is
    claimed by the object, so no baseline-ratio measurement applies.

