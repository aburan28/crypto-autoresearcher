  # ---------------------------------------------------------------- findings
  findings:
    - id: F-01
      severity: major
      check: V2
      summary: >-
        Flat manifests fail the run-record schema. validate_ledger.py names
        all 14 manifests ("expected top-level key 'run'"), and none of the
        lines is grandfathered. Artifact-policy fields are missing: the
        inference block and dirty-tree state are absent everywhere; command
        and commit exist only in runner sidecars; there is no validity
        reason. Specification invalidation rule 7 makes such a run
        schema-incomplete and not evidence.
      file_refs:
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-*/manifest.yaml (14 files)
        - experiments/EXP-QSP-70b731/implementation/driver.py lines 436-456 (manifest writer)
        - tools/validate_ledger.py check_run (expected top-level key 'run')
      contract_refs: ['specification.invalidation_rules[6]', 'specification.required_artifacts[0]', 'AGENTS.md Artifact policy']
    - id: F-02
      severity: major
      check: V4
      summary: >-
        No root-list certificate exists for any N > 0 row: every
        certificate_path is null, and no certificate file exists in any
        directory. Yet the reported certificate_bearing is positive in 13
        directories. Under the specification's certificate-bearing
        definition, the M5 identity fails on every stage with rows; the
        specification names this F_acct ('accounting defect; headline
        invalid'). A required artifact is absent: root-list certificates,
        with wrapper re-verification, for every candidate with N > 0. The
        driver's own row comment says certificate_bearing counts only rows
        with listed and verified roots, but no root is written to disk.
      file_refs:
        - experiments/EXP-QSP-70b731/implementation/driver.py line 116 (cert = None), line 133, lines 212-214
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-9312f7/raw-result.json and manifest.yaml (summary.certificate_bearing)
        - experiments/EXP-QSP-70b731/runs/<12 Stage-2 dirs>/raw-result.json and manifest.yaml
      contract_refs: ['specification.certificate_semantics', 'specification.metrics.primary M5', 'specification.falsification_criterion F_acct', 'specification.required_artifacts[2]', 'specification.tail_checks[2]']
    - id: F-03
      severity: minor
      check: V4
      summary: >-
        8 rows have root_count_listed below I_indep_N with
        root_list_deferred false: RUN-QSP-86e0d2 result.rows[150] and [194];
        RUN-QSP-383952 result.rows[142] and [215]; RUN-QSP-2e1ff8
        result.rows[24], [29], [43] and [48]. All are on path A-L. The driver
        counts them as certificate-bearing. check.py lines 59-60 accept them
        through a fallback. The cause of the under-listing was not
        determined. One code path that would produce it is the silent skip
        of a factor whose root search fails (i_indep.py lines 83-84).
      file_refs:
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-86e0d2/raw-result.json
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-383952/raw-result.json
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-2e1ff8/raw-result.json
        - experiments/EXP-QSP-70b731/implementation/check.py lines 38-64
    - id: F-04
      severity: major
      check: V5
      summary: >-
        The blocking control C1 and the Stage-1 calibration are not
        comparable with what they are meant to calibrate. On 2904 of 2928
        Band-L rows, I_indep took path A-L. That path is a duplicate of
        I_direct's deg-gcd algorithm over the same shared gf2_poly
        primitives, not derivation (A). Derivation (A) (path A-H) ran on only
        24 Band-L rows (d = 3 at n' = 12, 13, 14). Stage 0 and Stage 1 used
        enumeration (path A-toy). So no calibration stage exercised the A-H
        path that Band H relies on. On 2904 rows, C1 is a comparison of one
        algorithm with itself. The specification defines I_indep as resting on
        derivation (A), and expects Band-L/bridge agreement to calibrate it
        before Band H. The bridge cell, where every row would take A-H,
        did not complete (RUN-QSP-715b58). This is a conformance issue in
        the hash-bound implementation approved through the plans. It is not
        a statement about the integers.
      file_refs:
        - experiments/EXP-QSP-70b731/implementation/i_indep.py lines 52-61 (_independent_gcd_count), 253-305 (count_via_L_listing), 307-322 (measure_indep path selection)
        - experiments/EXP-QSP-70b731/implementation/gf2_poly.py lines 144-168 (repeated_square_x_mod_L, gcd_degree_with_L)
        - experiments/EXP-QSP-70b731/implementation/i_direct.py count_direct
        - experiments/EXP-QSP-70b731/runs/<12 Stage-2 dirs>/raw-result.json result.rows[].I_indep_path
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-9312f7/raw-result.json result.per_cell[].rows[].I_indep_path
      contract_refs: ['specification.inputs.instruments.I_indep', 'specification.controls C1', 'specification.stages.stage_1', 'specification.inputs.instruments.which_cells_direct_vs_derivation']
    - id: F-05
      severity: medium
      check: V5
      summary: >-
        The blocking proves-too-much fixtures C3 and C4, the null object C5
        and the linearized arm C6 are absent. C2 was not run as a control
        trial; only its fixture row in Stage-1 data exists. All six plans
        order stage5-controls after the census and comparison stages, so no
        bound census trial is gated by these controls. This is a
        completeness finding, never negative evidence.
      file_refs:
        - experiments/EXP-QSP-70b731/trial-plan-run2.json trials[19] (stage5-controls, RUN-QSP-15a2ab)
      contract_refs: ['specification.controls C2-C6', 'specification.stopping_rules[1]', 'specification.success_criterion S3']
    - id: F-06
      severity: minor
      check: V5
      summary: >-
        The Stage-0 hand gate is computed by census code, where the
        specification says 'compute: ZERO for the mathematical gate; no
        census code runs'. The driver calls i_direct.count_direct and
        i_indep.measure_indep at (4,3), driver.py lines 173-174, and the
        I_indep spot takes the enumeration path, not derivation (A).
        derivation_A_restated is a static string in driver.py.
        intersection_empty is hard-coded True (line 167); I recomputed it as
        an empty intersection, so the claim holds. No code confirms that
        the blind_from paths exist. blind_from_respected: true in all 14
        manifests is a constant (driver.py line 451), and
        executor_read_set is the static STATIC_READ_DECLARATION (line 44).
        Neither is a per-run measurement.
      file_refs:
        - experiments/EXP-QSP-70b731/runs/RUN-QSP-1df59e/stage0-derivation-note.json
        - experiments/EXP-QSP-70b731/implementation/driver.py lines 44-58, 139-196, 451
      contract_refs: ['specification.stages.stage_0', 'specification.metrics.secondary M9']
    - id: F-07
      severity: info
      check: V6
      summary: >-
        Claim TASK-20260921-f80a35 (BATCH-9dbda3) has no release record. It
        expired at 07:23:17Z, the same instant RUN-QSP-715b58 was
        terminated. The archival commits of RUN-QSP-327529 (11097f58ac,
        2026-09-21T13:20:08Z) and RUN-QSP-715b58 (c44a10a2db, 14:06:01Z)
        post-date that expiry. The run-time windows themselves were covered.
      file_refs: [coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-9dbda3/claims/TASK-20260921-f80a35.1.claim.json]
    - id: F-08
      severity: info
      check: V6
      summary: >-
        DEC-20260921-5de324 records decided_at and recorded_at as
        2026-09-21T12:00:00Z. That is later than its commit (162ce5c5ba,
        2026-09-21T03:22:00Z) and later than the runs it authorizes
        (03:24:32Z to 07:23:17Z). The field reads as a placeholder; the
        commit order is consistent.
      file_refs: [ledger/decisions/DEC-20260921-5de324.yaml]
    - id: F-09
      severity: info
      check: V3
      summary: >-
        DEC-20260921-5de324 decision_scope says the run_ids are carried
        byte-identical from the frozen plan. trial-plan-run2.json changes
        stage0-hand-gate's run_id from RUN-QSP-cec70a to RUN-QSP-1df59e,
        together with its argv; the plan's own supersession_reason
        discloses the change.
      file_refs: [ledger/decisions/DEC-20260921-5de324.yaml, experiments/EXP-QSP-70b731/trial-plan-run2.json]
    - id: F-10
      severity: info
      check: V3
      summary: >-
        The hash-bound source contains fixed internal RNG seeds that are not
        declared in the specification's seeds or in the manifests:
        i_indep.py line 102 random.Random(0xC0FFEE ^ d), and gf2_poly.py
        line 294 random.Random(0x70B731 ^ (d << 16) ^ degree(f)). They are
        deterministic, bound by source_sha256, and used in root finding.
      file_refs: [experiments/EXP-QSP-70b731/implementation/i_indep.py, experiments/EXP-QSP-70b731/implementation/gf2_poly.py]
    - id: F-11
      severity: info
      check: V5
      summary: >-
        On path A-H, N equals the number of y-roots that pass the closing
        test, and the y-roots come from roots_of_f2_poly_in_K. That routine
        skips a factor when _find_one_root_iso returns None (i_indep.py
        lines 83-84). A failure there would undercount N without any flag.
        On the 24 Band-L A-H rows, I_direct cross-checks it. At Band H no
        such cross-check exists. This concerns trials not yet run, and is
        recorded for whoever plans them.
      file_refs: [experiments/EXP-QSP-70b731/implementation/i_indep.py lines 64-89, 181-227]
    - id: F-12
      severity: info
      check: V4
      summary: >-
        peak_rss_mb in the manifest is at least the raw-result value in all
        14 directories, and differs in 13. This follows from the code:
        driver.py calls getrusage separately for the raw result (line 416)
        and for the manifest (line 444). It is not a mismatch of a single
        measurement.
      file_refs: [experiments/EXP-QSP-70b731/implementation/driver.py lines 408-456]
    - id: F-13
      severity: info
      check: V2
      summary: >-
        RUN-QSP-cec70a and RUN-QSP-715b58 have no manifest.yaml or
        raw-result.json, and validate_ledger.py does not check them.
      file_refs: [experiments/EXP-QSP-70b731/runs/RUN-QSP-cec70a/, experiments/EXP-QSP-70b731/runs/RUN-QSP-715b58/]
    - id: F-14
      severity: info
      check: V4
      summary: >-
        check.py's root 're-verification' re-executes the producer's own
        i_indep.measure_indep on at most 5 rows per run (at most 2 per cell
        in Stage 1). It can detect non-determinism or a tampered raw result,
        but not an instrument fault. On A-L rows it repeats I_direct's
        algorithm.
      file_refs: [experiments/EXP-QSP-70b731/implementation/check.py lines 67-100]

