    V2:
      name: manifest schema completeness
      verdict: fail
      reasons:
        - >-
          All 14 manifests that exist are FLAT: there is no top-level 'run'
          key. tools/validate_ledger.py check_run reports one error per file,
          "expected top-level key 'run'", for all 14, both with
          --no-baseline and with the baseline applied. None of the 14 lines
          is grandfathered: the baseline, the legacy run inventory and
          tools/run_supersession_registry.yaml do not mention
          EXP-QSP-70b731. check_run returns at the shape error, so none of
          the nested required fields (id, status, code, environment, inputs,
          timing, result) is present under the schema it applies.
        - >-
          Against the AGENTS.md artifact-policy list, each of the 14 manifests
          has the same profile. PRESENT in the manifest: parameters and seed
          (stage, n_prime, base_seed), python version, platform and hostname,
          timestamps and resources (started_at, finished_at,
          elapsed_seconds, peak_rss_mb), validity, executor_read_set and
          blind_from_respected. NOT in the manifest, but present in the
          runner's sidecar files of the same directory: the exact command
          (command.txt, launch.json) and the git commit (environment.json
          commit = receipt authority.commit). ABSENT everywhere in the run
          directory: dirty-tree state; the inference block (requested policy,
          backend, resolved model id, model_verified, reasoning effort,
          fallback); a validity reason; and dependency versions beyond the
          interpreter (the driver imports only the standard library and
          hash-bound modules, and runtime_lock is null).
        - >-
          RUN-QSP-cec70a and RUN-QSP-715b58 have no manifest.yaml and no
          raw-result.json, because the driver produced none. Only the
          runner's generated files exist, and validate_ledger.py does not
          see these two directories at all.
        - >-
          The specification's invalidation rule 7 reads: 'A run missing
          AGENTS.md artifact-policy manifest fields is schema-incomplete and
          not evidence.' Its required_artifacts also ask for a run manifest
          carrying every artifact-policy field.
      validate_ledger_lines_naming_bound_files: 14
      owner_claim_check: >-
        Agrees with MSG-20260921-2f25b1 and MSG-20260921-6b90fe: driver.py
        writes a flat manifest and there are 14 error lines. The owner's
        absolute counts (91 new errors against 77) were not recomputed at
        the owner's commit. On the shared working tree at review time, the
        baselined run reports 122 new errors, of which 14 name these files.
    V3:
      name: seed integrity
      verdict: pass
      reasons:
        - >-
          For all 16 directories, the plan argv with {run_dir} substituted
          equals launch.json argv, and launch.json argv equals command.txt.
          The plan check_argv equals launch.json check_argv. run_id, trial_id
          and plan_sha256 agree across plan, launch.json and the receipt.
          Every run_dir ends in experiments/EXP-QSP-70b731/runs/<run_id>.
        - >-
          In all 14 manifests and raw results, run_id, stage and n_prime
          equal the argv values, and base_seed equals the specification's
          base_seed (20260920). No argv carries a seed. No manifest or raw
          result has a seed field other than base_seed.
        - >-
          Parameters were recomputed independently of the driver. Every
          Stage-2 row set equals the specification's candidate rule exactly:
          the 244 exact-degree-3..7 polynomials over F_2 minus the 4
          linearized degree-4 shapes, with no duplicates, n = 131, and n' as
          in argv. Each Stage-1 cell equals the 252 exact-degree-2..7
          polynomials, and the three cells are (11,6), (13,7) and (7,3) as
          specified. The Stage-0 rows are lambda = X^2+X+1 and X^3+1 at
          (4,3), as specified. In every row, q and r equal divmod(n, n'),
          degree, square flag and bound equal max(2^(n'-r), d^(q+1)), and the
          affine flag matches the definition documented in candidates.py.
        - >-
          Order: under trial-plan-run2.json the 15 attempts started in plan
          order (indices 0 to 14) and did not overlap. Each started only
          after every depends_on trial had finished output_validated. No
          rerun lies outside a plan: stage0-hand-gate has two attempts, each
          under its own approved plan with its own run id. RUN-QSP-cec70a
          (trial-plan-run.json) failed as infrastructure_error, and
          RUN-QSP-1df59e is the fresh-id retry under trial-plan-run2.json.
      observations:
        - F-09
        - F-10
    V4:
      name: raw/summary agreement
      verdict: fail
      verdict_scope: >-
        The failure is confined to certificate accounting (F-02, F-03). Every
        other comparison agrees, including the checker re-run.
      reasons:
        - >-
          AGREES in all 14 directories with a raw result:
          - Every manifest summary field equals the corresponding
            raw-result.json result field.
          - rows_completed, zero_N_rows, root_list_deferred_rows and the
            disagreement counts recompute from the raw rows.
          - The per-row agree flags recompute from the two N columns.
          - agreement_ok and all_agree are consistent with those counts.
          - The Stage-1 per-cell sums equal the totals, and
            per_cell_agreement equals per_cell.
          - The validity label is consistent with disagreement_count.
          - started_at and elapsed_seconds are equal between manifest and
            raw result.
          - stdout.log is consistent with the raw result (stage, n_prime,
            elapsed_seconds).
          - check.stdout.log is ok:true for the run directory named in
            launch.json, consistent with the receipt's status, returncode 0
            and check_returncode 0.
          - Every receipt artifact_sha256 equals the bound bytes, and the key
            set equals the runner's expected set.
          - The Stage-0 derivation note's numeric_spot equals the raw rows,
            and hand_gate_ok recomputes from the note.
        - >-
          Checker re-run: implementation/check.py (snapshot bytes, source
          hash verified) is deterministic. Its RNG seeds are fixed in
          source, and it does no file writes or network access, so it is a
          pure function of the committed manifest.yaml, raw-result.json and
          hash-bound implementation. I re-ran it in scratch on all 14
          directories that have a committed raw result. All 14 re-runs
          returned 0 with stdout ok:true and empty stderr (2026-10-02
          05:13:12Z to 05:26:48Z). This equals the original
          check.stdout.log ok:true and the receipt's check_returncode 0 in
          every directory. It was not applicable to RUN-QSP-cec70a or
          RUN-QSP-715b58, which have no committed raw result.
        - >-
          FAILS: certificate accounting (F-02). The specification counts a
          row as certificate-bearing only if N > 0, a root-list certificate
          file exists, and the wrapper has re-verified every listed root.
          No certificate file exists in any directory, and every row's
          certificate_path is null: driver.py line 116 hard-codes
          cert = None. Yet the reported certificate_bearing is positive in 13
          directories (RUN-QSP-9312f7 and the 12 Stage-2 directories),
          because it counts N > 0 rows. Under the specification's definition
          the M5 identity (certificate_bearing + zero_N_rows =
          rows_completed) fails on every stage that has rows, Stage 0
          included. The specification names this F_acct ('accounting defect;
          headline invalid').
        - >-
          FAILS: listing consistency (F-03). In 8 rows (RUN-QSP-86e0d2: 2,
          RUN-QSP-383952: 2, RUN-QSP-2e1ff8: 4), root_count_listed is below
          I_indep_N while root_list_deferred is false. The driver still
          counts these rows as certificate-bearing, against its own stated
          rule at driver.py lines 212-214 (listed and verified roots).
          check.py's accounting passes them through its fallback branch at
          check.py lines 59-60.
      observations:
        - F-12
        - F-14
    V5:
      name: control comparability
      verdict: fail
      reasons:
        - >-
          Controls and calibrations in the specification: the Stage-0 hand
          re-derivation gate, the Stage-1 toy three-cell calibration, and
          C1 to C7.
        - >-
          Stage-0 gate: present as RUN-QSP-1df59e. It ran under the same
          environment as the trials it gates (linux, py3.13.15, the same
          container host, authority commit 2e0b0f0a96), with the same
          source_sha256 and specification hash. It does not conform to the
          specification (F-06): it is computed by census code, and its
          I_indep spot uses the enumeration path, not derivation (A).
        - >-
          Stage-1 calibration: present as RUN-QSP-9312f7, with the same
          environment, sources and authority commit as Stage 2. All 756
          I_indep rows took the enumeration path ('A-toy', n <= 20,
          i_indep.py lines 313-314). The calibration therefore exercised
          neither of the I_indep paths its Stage-2 dependents used (A-L,
          A-H), nor the A-H path that Band H depends on (F-04).
        - >-
          C1 (blocking): present inside every Stage-2 directory as per-row
          I_direct against I_indep. I_indep took path A-L on 2904 of 2928
          Band-L rows. Path A-L (i_indep.py _independent_gcd_count, lines
          52-61) is the same deg-gcd algorithm as I_direct
          (gf2_poly.py gcd_degree_with_L and repeated_square_x_mod_L, lines
          144-168), built from the same shared gf2_poly primitives (square,
          mod_pow2_x_plus_lam, gcd). Derivation (A), path A-H, ran on only
          24 rows: d = 3 at n' in {12, 13, 14}. The recorded paths match the
          path-selection formula in every row. On those 2904 rows, C1
          compares two executions of one algorithm. It cannot detect a fault
          in the gcd count or in the shared arithmetic, and whatever it
          records there says nothing about derivation (A) (F-04).
        - >-
          C2: not run as a control trial. Its fixture (7, 3, X^2+X) is one
          of the Stage-1 toy rows, and that row returns the contract's
          forced value under both I_direct (gcd) and I_indep (enumeration).
          C3, C4, C5 (null object), C6 (linearized arm): ABSENT, because
          stage5-controls (RUN-QSP-15a2ab) never ran. C7 (reporting): square
          flags are present in every row and recompute correctly.
        - >-
          Dependency order: respected by every attempt (see V3). However, all
          six plans place stage5-controls (C2 to C6) after
          stage-compare-sealed. As a result, no bound trial is gated by the
          blocking proves-too-much, null or linearized controls, which the
          specification's stopping rules treat as blocking. This is a
          completeness finding, not negative evidence (F-05).
        - >-
          The RUN-QSP-cec70a attempt (darwin, py3.12.8) gates nothing: it
          failed before the payload started, and its successor
          RUN-QSP-1df59e ran under the same environment as the dependents.
      observations:
        - F-11
    V6:
      name: provenance and binding
      verdict: pass
      reasons:
        - >-
          plan_sha256: all 16 receipts and launch records name a plan whose
