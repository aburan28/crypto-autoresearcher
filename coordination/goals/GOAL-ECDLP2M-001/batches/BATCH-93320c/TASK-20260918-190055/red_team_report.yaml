red_team_report:
  id: RT-20260920-df6fd0
  task_id: TASK-20260918-190055
  claim_under_review: >-
    (1) IDEA-20260918-6c07e1: no F_2-coefficient quasi-subfield polynomial
    splits completely over F_(2^131) at any n' in [2,129], any deg lambda.
    (2) IDEA-20260918-9abf42: exactly 2^f Frobenius-stable F_2-subspaces for
    odd prime n with f=1+(n-1)/ord_n(2); four at n=131 dims {0,1,130,131};
    re-derives Prop 2; toy ladders uncontrolled for ord_n(2).
  objections:
    - id: O-1
      target: IDEA-20260918-6c07e1 title / claim (E) wording
      severity: scope
      text: >-
        "WITH NO DEGREE BOUND" and "WHATEVER deg lambda IS" overclaim.
        Huang Definition 3.1 does not explicitly require deg lambda < 2^{n'};
        without that normalisation complete splitting constrains deg L mod 131,
        not 2^{n'}. (S4) already hedges; title does not. Does not break (E)
        under S4.
    - id: O-2
      target: IDEA-20260918-9abf42 preregistration / IDEA-20260906-a77711 cite
      severity: breaks_citation_path
      text: >-
        a77711 Lemma A1/Prediction A is about invariant rewriting of the orbit
        system I_orb vs I_R for a pi-stable V. It does not imply equal
        first-fall degree between stable and random dim-4 factor bases at n=7.
        Misquoting that prior into a preregistration corrupts the
        preregistration. Ladder design still holds; citation must be repaired.
    - id: O-3
      target: IDEA-20260918-9abf42 novelty (iii) / (ii)
      severity: novelty_thin
      text: >-
        Module correspondence re-deriving Prop 2 is mathematically correct but
        classical; a77711 already states the primitive-root four-subspace case.
        Novelty (ii) at n=131 is largely prior; (i) closed form and (iv) ladder
        confound remain usable.
    - id: O-4
      target: single-reviewer round setup
      severity: process
      text: >-
        One reviewer owns all eight joints; no cross-joint independence.
        Disclosed in the handoff. Insufficient for promotion; adequate for
        C-7 non-claim-changing screen.
  required_controls:
    - >-
      Before citing 6c07e1 in any decision: supersede title/claim to state
      explicit deg lambda < 2^{n'}.
    - >-
      Before any FROB contract from 9abf42: rewrite preregistered_prediction so
      A-vs-B null is a new prior, not a corollary of a77711 Lemma A1.
    - >-
      Promotion round (if any) must use multi-reviewer joint ownership under
      review-breakthrough; this report does not substitute.
  counterexample_or_mutation: >-
    Cheapest discriminating mutation for 6c07e1: exhibit any lambda in F_2[X],
    deg lambda < 2^{n'}, with exactly 2^{n'} roots in F_(2^131) for some
    n' in [2,129] — none expected; arithmetic slip on ord_131(2) would be
    cheaper and was independently refuted. For 9abf42 counting: factor T^n-1
    at any odd prime and disagree with 2^f / dim set — n=23 and n=43 agree.
    For ladder: run n=7 A-vs-B only after citation repair.
  baseline_comparison: >-
    6c07e1 permits exactly the published complete splitters at n=131
    (n' in {1,130,131}) and at (7,3), (31,15); does not dominate rho
    (no attack claimed). 9abf42 counting matches Prop 2 linearized
    classification at n=131 and the program's FROB module prior; no ECDLP
    cost row moves. dominated_by fields on both proposals were checked as
    n/a for attack cost and honest for exclusion/existence instruments.
  heuristic_challenges: []
  cost_model_challenges:
    - >-
      Neither proposal claims an attack exponent; both correctly state zero
      ECDLP cost delta. No hidden per-attempt vs total-cost confusion because
      no attempt cost is charged.
  reduction_and_scope_challenges:
    - >-
      6c07e1 (S1): approximate regime genuinely free (nearest legal |V| within
      64 of 2^{n'}); record does not quietly claim it — scope limit real.
    - >-
      6c07e1 (S2): K-coefficient escape confirmed by cX counterexample.
    - >-
      Prop 2 attribution confirmed as iff over F_p-linearized L_f only;
      does not cover non-linearized lambda (6c07e1 correctly separate).
  proof_architecture_challenges:
    - >-
      Quantifier order on 6c07e1 is genuine forall-n'-forall-lambda (under S4);
      no existential witness. On 9abf42 counting: forall odd primes, exact
      equalities. Ladder claim has different quantifier order (exists cell) —
      correctly separated in the record.
    - >-
      Observation-fiber: congruence depends on n' alone, blind to lambda —
      strength and limit both acknowledged; not a break.
    - >-
      J-8: root-set orbits vs subspace lattice are different objects; linearized
      case overlaps; non-linearized exclusion is not a corollary of the count.
  narrowest_supported_statement: >-
    (1) For all n' in [2,129] and all lambda in F_2[X] with deg lambda < 2^{n'},
    X^{2^{n'}}+lambda(X) does not split completely over F_(2^131).
    (2-counting) For all odd primes n, F_(2^n) has exactly 2^{1+(n-1)/ord_n(2)}
    Frobenius-stable F_2-subspaces, dimensions as subset sums of irreducible
    degrees of T^n-1; at n=131 exactly {0,1,130,131}.
    (2-ladder) Stratify FROB toys on ord_n(2); n=7 stable-vs-random dim-4 is
    admissible; do not attribute A-vs-B fall-degree equality to a77711.
  next_concrete_action: >-
    Coordinator composes this report under C-7 (no status change from this
    verdict alone). If either derivation is to be cited: supersede 6c07e1
    wording for S4 honesty; repair 9abf42 a77711 preregistration citation.
