  open_issues:
    - id: OI-1
      issue: >-
        The card says "What holds" items change only where an RD item forces
        it, and also requires every non-breaking item answered. Where an
        answer touches a "What holds" item (N-J1-1, N-J1-2, N-J2-2, N-J2-3,
        N-J3-2 to N-J3-4, O-J4-1, O-J4-3, O-J5-1, O-J5-2, O-J6-1, O-J6-2,
        K2x wording, reused ids), version 3 changes it additively or in
        wording only, changes no carried value, and lists it in
        constants_delta with that non-breaking item as its forcing item. The
        composer rules whether that reading is acceptable.
    - id: OI-2
      issue: >-
        Values version 3 newly freezes were computed blind to the J9
        directory but not blind to J9-quoted figures in permitted inputs (the
        BATCH-b67954 composition worksheet and DEC-20260925-41f6dc). Every
        such value comes from committed code CB-2; a comparison with J9 is
        informed on the producer's side (audit disclosures).
    - id: OI-3
      issue: >-
        NF-01 to NF-03 and NF-14 cannot be computed from the blind card's
        whitelist (the Certicom text and the audit sheet are not on it); J1
        and J8 re-derive them. NF-04 is not separable from its answer.
    - id: OI-4
      issue: >-
