    card_item: PV3-12 (DEC-20260925-41f6dc R-HOLDS; DEC-20261002-0983f2 R-HOLDS)
    statement: >-
      The version-3 row set does NOT change the HOLD-F and HOLD-G row-set
      condition. Version 3 changes no row, degree, m, h or r of the
      claim-(A) set (CD-01 changes wording only), and its new Stage-0
      Certicom check reconciles the Certicom rows against Appendix A of the
      frozen primary input itself, which is exactly the reconciliation source
      the condition names (Certicom Appendix A, FIPS 186-4, RFC 2409; never
      EXP-SEMBIN-992e73). Nothing in version 3 requires the condition's text,
      sources or scope to change. As before, version 3 is not approved, so its
      row set is not an official row set for either hold.
    not_carried: No lane-B hold, no X-KOBLITZ, no HOLD-A to HOLD-E statement (PV3-12).
  x_certbin_lane_side: >-
    Every Certicom m, a, b, h and r is read from Appendix A of the primary
    input only (spec inputs.curve_parameters.certicom; CB-1 reads labels, m and
    the field polynomial from the same text); no CERTBIN record was read or
    adopted (DEC-20261002-0983f2 R-XCERTBIN).

