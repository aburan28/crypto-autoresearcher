  rd7_statement:
    rekeyed_condition: >-
      K4 revisit sub-condition (i), DEGREE-GROWTH EVENT: a record committed
      AFTER the Coordinator decision that records the K4 deprioritisation,
      and not a GOAL-SEMBIN-fcb7a2 true-degree record (those are (iii)) - a
      validated evidence record of any goal, a knowledge finding, or a primary
      source archived under inputs/ with provenance - that reports, for a
      Semaev summation-polynomial descent system of the shape of system (5)
      at any (n, m), a solving degree in the d_F4 convention of IR-2,
      discharged as IR-2 requires, above Assumption 1's bound 4.
    event_it_keys_to: >-
      An external record of degree growth beyond Assumption 1's bound. It is
      not a function of this run's threshold table, which D-10 fixes by
      closed forms once F1 passes, so the run cannot make it certain or
      impossible.
    why_it_can_hold_and_fail_when_the_deprioritisation_is_made: >-
      At the moment K4 is recorded the condition is open: it is keyed to
      records committed after that decision, so no existing record and no
      output of the run settles it. It HOLDS if such a record is later
      committed (Semaev's own measurements record d_F4 at most 4 at their toy
      sizes, so a later measurement above 4 is a possible but not a certain
      event); it FAILS for as long as none is. Neither branch is fixed in
      advance, unlike version 2's (i), which held in every run at the grid's
      lower edge of m (DEC-20260925-41f6dc R-S10).
    why_it_points_the_right_way: >-
      K4 deprioritises Part 3 because, in the model, the scored threshold
      lies above every plausible solving degree (definitions.plausible_solving_degree),
      so a measured degree inside the plausible range could not reach it.
      Evidence that the solving degree grows with the system beyond
      Assumption 1's bound raises the chance that the true degree reaches the
      threshold, which is exactly what makes the Part 3 measurement more worth
      making. It never fires from a small-m grid-edge entry (PTM-G's known
      truth): it reads no entry of the table at all.
    relation_to_ii_and_iii: >-
      (ii), a numbered M7 or M8 reading by a successor contract, and (iii), any
      GOAL-SEMBIN-fcb7a2 true-degree record, are carried; (ii) is reworded for
      RD-6. (i) and (iii) are disjoint by construction (different record
      sources).
