  # ---------------------------------------------------------------------------
  newly_frozen_values:
    definitions_are_value_free: true
    rule: >-
      EVERY value version 3 freezes and version 2 did not, as an NF-nn item
      with (a) its location by file and field path, never its value, and (b) a
      value-free definition that stands alone, in the contract's own names
      (MR_B, MR_M, MR_C8, W, R-B, R-M, D*_R, D*real_B, A, MI-1). The pre-review
      gate copies each definition byte-exact to the blind card. Version 3
      freezes NO D*, D*(m), C-CEIL-T or D*real_B value and NO M7 range
      endpoint, so none appears below. Default tolerance 0.01 bit on log2
      quantities and exact on integers. In every definition: log2 is the
      binary logarithm; W(N, D) = log2 of the sum over d = 0..D of
      binom(N, d); MI-1 is the reading k = n/m taken as a real number and
      "the ceiled reading" is k = ceil(n/m); A(n, m) = k - log2 P with
      P = 1 - exp(-2^(m k - n)/m!), Semaev 2015 eq. (11) at t = m; omega = 3;
      C_I(n, 3.0) = the first minimum over m in 2..min(30, n), taken in
      ascending m with strict less-than, of A(n, m) + 4 omega log2 n, and its
      argmin m* (t = m).
    items:
      - id: NF-01
        location: proof-search-map-audit.yaml proof_search_map_audit.code_blocks.CB-1.source (constant CERTICOM_BINARY_CURVE_COUNT); specification.yaml experiment.controls (C-COVER).pass_criterion ("the frozen count")
        definition: >-
          The number of distinct curve labels of the form ECC2-<digits> or
          ECC2K-<digits> (binary curves; labels of the form ECCp-<digits> are
          prime-field curves and are not counted) that head a curve block in
          Appendix A "Curve Details" of
          inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, Appendix A
          being every line after the last line whose text is exactly "A Curve
          Details".
        tolerance: exact
        separable: true
        blind_note: >-
          The Certicom text is not on the blind card's whitelist, so the blind
          card cannot compute this item; joint J1 re-derives it with its own
          parser (plan J1 attack (i)).
      - id: NF-02
        location: proof-search-map-audit.yaml proof_search_map_audit.code_blocks.CB-1.source (constant CERTICOM_BINARY_DEGREE_COUNT); specification.yaml experiment.controls (C-COVER).pass_criterion ("the frozen count of distinct degrees")
        definition: >-
          The number of distinct field degrees m among the curves counted in
          NF-01, each curve's m being the integer printed on the line of the
          form "m = <integer>" in its own Appendix A block.
        tolerance: exact
        separable: true
        blind_note: As NF-01 (not computable from the blind whitelist; J1 re-derives it).
      - id: NF-03
        location: proof-search-map-audit.yaml proof_search_map_audit.code_blocks.CB-1.source (constants APPENDIX_HEADING, BINARY_FAMILIES, LABEL_RE, DEGREE_RE, FIELD_POLY_RE, DEFAULT_APPENDIX, DEFAULT_SPEC)
        definition: >-
          The reading rule of the coverage check, not a number: Appendix A
          begins after the last line equal to "A Curve Details"; a label line
          is a line whose whole stripped text is ECC2-, ECC2K- or ECCp-
          followed by digits; a curve block runs from its label line to the
          next label line of any family; a binary block must contain exactly
          one line of the form "m = <integer>" and its first line of the form
          "f = x^<integer>..." must carry that same integer; the input paths
          are the Certicom text named in NF-01 and the contract's own
          specification file (read only by the design-time self-test).
        tolerance: exact (rule identity)
        separable: true
        blind_note: A rule, reviewed by J1 against the text; no blind computation applies.
      - id: NF-04
        location: proof-search-map-audit.yaml proof_search_map_audit.code_blocks.CB-1.source (constants SELF_TEST_SPURIOUS_ROW, SELF_TEST_MISLABEL)
        definition: >-
          DEFINITION NOT SEPARABLE FROM ITS ANSWER. These two constants are
          chosen self-test fixtures, not derived quantities: one prime-field
          Appendix-A label offered as a spurious Stage-5 row, and one binary
          curve offered at the degree given by its label suffix instead of its
          printed m. No re-derivation applies; joint J1 runs its own mutations.
        tolerance: not applicable
        separable: false
      - id: NF-05
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-KR) and session_computations.c_all_out_verbatim (CB-2 key kreading_table); specification.yaml experiment.definitions.model_identification_choices[0].disclosed_consequence and controls (C-PTM).ceiled_slack
        definition: >-
          For each n in {79, 89, 97, 109, 131, 155, 163, 185, 191, 233, 239,
          283, 359, 409, 571} (the claim-(A) degrees) and for each k reading in
          {MI-1, the ceiled reading}: (a) C_I(n, 3.0) and its argmin m*; (b)
          the runner-up m (the m with the second-smallest value of
          A(n, m) + 4 omega log2 n, ties to the lower m) and the gap between
          the two values; (c) at the argmin m*, with t = m* and D = 4, the
          Macaulay rows MR_B = 4 log2 n, MR_M = W(n, 4) and MR_C8 =
          log2 binom(nvar, 4) with nvar = m* ceil(n/m*) (report nvar too), the
          dense entries 2 MR_B, 2 MR_M and 2 MR_C8, and the relation store
          log2 of 2^k, that is k at m* under that k reading; (d) the relation
          store k at the runner-up m under that k reading; (e) the move, C_I
          under the ceiled reading minus C_I under MI-1, and its sign.
        tolerance: 0.01 bit on every log2 figure and move; exact on m*, runner-up m and nvar
        separable: true
      - id: NF-06
        location: specification.yaml experiment.definitions.model_identification_choices[0].disclosed_consequence; H-NISTBIN-dec5e1.yaml hypothesis.version_3.heuristic_assumptions[0].mi_1; proof-search-map-audit.yaml proof_search_map_audit.frozen_c2_fixture.model.model_identification
        definition: >-
          The items (a), (c) and (e) of NF-05 at n = 571, n = 283 and n = 359
          only, under both k readings: C_I(n, 3.0) and its argmin m* under MI-1
          and under the ceiled reading, the move ceiled minus MI-1, MR_B and
          MR_M at D = 4, and the relation store k at each reading's own m*.
        tolerance: 0.01 bit on log2 figures and moves; exact on m*
        separable: true
      - id: NF-07
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entries DF-FIX and DF-CEIL12), frozen_c2_fixture.target.memory_beside and secondary_target.memory_beside; specification.yaml experiment.input_rules (SN-1).memory_beside
        definition: >-
          (i) For each n in {571, 283, 359, 409}, at the MI-1 argmin m* of
          C_I(n, 3.0) (t = m*, D = 4): MR_C8 = log2 binom(nvar, 4) with
          nvar = m* ceil(n/m*) (report nvar), and the dense entries 2 MR_B,
          2 MR_M and 2 MR_C8 (MR_B = 4 log2 n, MR_M = W(n, 4)). (ii) At n = 571
          and m equal to the MI-1 argmin of C_I(571, 3.0), under the ceiled
          reading (t = m, D = 4): the stage-1 value A(571, m) + 4 omega
          log2 571, MR_C8 with its nvar, the dense entry 2 MR_C8, and the
          relation store ceil(571/m).
        tolerance: 0.01 bit on log2 figures; exact on nvar
        separable: true
      - id: NF-08
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-JP), frozen_c2_fixture.what_the_fixture_does_see, audits.A1_bottleneck_and_baseline_fixture.bottleneck, audits.A2_observation_collision (OC-4); specification.yaml experiment.proof_search_map.bottleneck; H-NISTBIN-dec5e1.yaml hypothesis.version_3.mechanism and version_3.proof_search_map.bottleneck
        definition: >-
          At the parameter point n = 571, m = t = 10, D = 4, MI-1 (the argmin
          that RUN-SEMBIN-aa5161 records for the frozen instrument's macaulay4
          and f4_std solving readings in the total-cost convention, joint over
          (m, t)): (a) the Boolean variable count of Semaev 2015's system (5)
          at chain length t as the frozen instrument computes it, N5 =
          int(round(t k + max(t - 2, 0) n)) with k = n/m, and the exact value
          t k + (t - 2) n before rounding; (b) MR_MAC = W(N5, 4); (c) the dense
          entries 2 MR_MAC; (d) the relation store k.
        tolerance: exact on N5; 0.01 bit on log2 figures
        separable: true
      - id: NF-09
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-JP), frozen_c2_fixture.what_the_fixture_does_see, audits.A2_observation_collision (OC-4); specification.yaml experiment.proof_search_map.bottleneck; H-NISTBIN-dec5e1.yaml hypothesis.version_3.proof_search_map.bottleneck
        definition: >-
          At the parameter point of NF-08, for the f4_std reading (per-solve
          cost [n (t - 1)]^(4 omega)): the variable count n (t - 1); the rows
          figure in power form, MR_F4 = 4 log2(n (t - 1)); the rows figure in
          monomial form, W(n (t - 1), 4); the dense entries twice each; and the
          relation store k = n/m.
        tolerance: exact on n (t - 1); 0.01 bit on log2 figures
        separable: true
      - id: NF-10
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-JP); specification.yaml experiment.proof_search_map.bottleneck; H-NISTBIN-dec5e1.yaml hypothesis.version_3.mechanism
        definition: >-
          The memory move beside the time difference between the macaulay4
          figure at the point of NF-08 and the block_n4w figure C_I(571, 3.0)
          at its MI-1 argmin m*: (a) MR_MAC of NF-08 minus MR_B = 4 log2 571;
          (b) MR_MAC minus MR_M = W(571, 4); (c) the relation store of NF-08
          minus the relation store 571/m* at that m*.
        tolerance: 0.01 bit
        separable: true
      - id: NF-11
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-A571) and session_computations.c_all_out_verbatim (CB-2 keys A_571_by_m and A_571_summary); specification.yaml experiment.definitions.model_identification_choices[0].direction and bias_of_the_handed_table
        definition: >-
          For each integer m from 2 to 30: A(571, m) under MI-1, A(571, m)
          under the ceiled reading, and their difference (ceiled minus MI-1);
          then the number of m at which that difference is negative, zero and
          positive, and its minimum and maximum over m.
        tolerance: 0.01 bit on each A and difference; exact on the counts
        separable: true
      - id: NF-13
        location: proof-search-map-audit.yaml proof_search_map_audit.design_figures (entry DF-ILL) and proposal_figure_register (PF-3, PF-5, PF-6)
        definition: >-
          The illustrative reading R-I's Macaulay count log2 binom(nvar, D):
          (a) with nvar = t* ceil(571/t*), t* the MI-1 argmin of C_I(571, 3.0),
          at D = 12 and at D = 20; (b) at D = 4 with nvar = t* l for each of
          l = floor(283/t*) and l = ceil(283/t*), t* the MI-1 argmin of
          C_I(283, 3.0) (the two sizings the proposal and the contract's
          reading_R_I name for n = 283).
        tolerance: 0.01 bit
        separable: true
      - id: NF-14
        location: proof-search-map-audit.yaml proof_search_map_audit.code_blocks.CB-1.reference_sha256 and CB-2.reference_sha256; specification.yaml experiment.controls (C-COVER).reference_digest
        definition: >-
          For each ID in {CB-1, CB-2}: the sha256 of the UTF-8 encoding of the
          string at proof_search_map_audit.code_blocks.<ID>.source of the
          version-3 audit sheet, read with PyYAML safe_load, and that byte
          count.
        tolerance: exact
        separable: true
        blind_note: A custody pin, not a model quantity; joint J8 reproduces it. The audit sheet is not on the blind whitelist.
    numbering_note: >-
      NF-12 is not used (a planned runner-up item was folded into NF-05 (b)
      and (d)); the numbering is not renumbered so that the contract's and
      the audit sheet's citations stay stable.

