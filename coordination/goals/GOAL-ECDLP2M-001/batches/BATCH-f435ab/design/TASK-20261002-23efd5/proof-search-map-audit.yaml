      variable count N5 = 5139 of system (5), Macaulay rows 2^44.72 =
      W(N5, 4), dense entries 2^89.45, relation store 2^57.10); and 226.8183
      for f4_std (m* = t* = 10 under MI-1; Macaulay rows 2^49.31 in the power
      form D log2(n (t - 1)) with n (t - 1) = 5139, or 2^44.72 in monomial
