  audits:
    A1_bottleneck_and_baseline_fixture:
      bottleneck: >-
        The degree bound 4 in Semaev's per-solve estimate n^(4 omega) (paper
        lines 1068-1072, as the version-1 sheet cites them), checked in this
        program only at n <= 21. It does NOT carry the whole 571 margin
        (D-8 S-4). At n = 571 one R-B degree step is 27.47 bits at omega 3
        and multiplies the Macaulay rows by 571 (+9.16 bits; relation store
        unchanged at 2^47.58); omega from 3 to 2.376 is 22.86 bits at D = 4
        with no memory change (rows 2^36.63 or 2^32.04, store 2^47.58);
        block_n4w against macaulay4 is 26.75 bits, with block_n4w's rows
        2^36.63 and store 2^47.58 at m* = 12 against macaulay4's rows 2^44.72
        (N5 = 5139) and store 2^57.10 at m = t = 10 (DF-JP; c8_scan location
        (6), RD-2). The degree is the input made an axis because a later
        true-degree measurement can be read against it.
      baseline_parameter_slice: >-
        D = 4, omega = 3, n = 571, m = t = 12, unceiled k (MI-1), stage 1 only,
        cofactor charged: 186.307 (F1 target), Macaulay rows 2^36.63 (R-B) or
        2^32.04 (R-M), relation store 2^47.58.
      reproduction: symbolic (L-EXT) and by fixture (F1 with F2 at every grid omega); CB-2 reproduces the fixture value to four decimals (DF-FIX)
    A2_observation_collision:
      observable: the interval [D*_B(c, 3.0, m), D*_M(c, 3.0, m)] at m* = 12 and over the M-SET, read from the sign of the time-only margin against the corrected column
      collisions_found:
        - {id: OC-1, note: 'R-B and R-M equal at D = 4, about omega (log2 D! - log2 4!) apart elsewhere; resolved by the interval (P-S)'}
        - {id: OC-2, note: 'fake d-prime_F <= 4 against true degree 4; IR-1 accepts no degree input, IR-2 states the discharge (with H6 for any first fall degree, and the U-3 disclosure)'}
        - {id: OC-3, note: 'the naive column and the coherent baseline disagree at 409, so a claim-(A) count is baseline-dependent (PTM-C); BR-1 admits only the pinned coherent reading, now with the multi-match refusal'}
        - id: OC-4
          what: >-
            VERSION 3 (RD-2, c8_scan location (3)). Among the instrument's own
            readings at D = 4 the fixture separates block_n4w 186.307 (m* 12;
            Macaulay rows 2^36.63 or 2^32.04, relation store 2^47.58),
            macaulay4 213.0618 (m* = t* = 10; rows 2^44.72 = W(5139, 4), dense
            2^89.45, relation store 2^57.10) and f4_std 226.8183 (m* = t* =
            10; rows 2^49.31 in power form or 2^44.72 in monomial form,
            relation store 2^57.10), in the total-cost joint convention of
            RUN-SEMBIN-aa5161, and the ceiled k reading 181.7236 at m = 12
            (rows 2^36.63 or 2^32.04, relation store 2^48). No memory figure is
            missing.
          separating_condition: F1 identifies the reading; no collision remains among those.
        - id: OC-5
          what: >-
            Readings outside the restricted model (a sparse S_sp, a hybrid
            S_hyb, a block-size exponent other than R-B's, a different
            optimising m) would all pass F1 and F2, being free to agree at
            D = 4; for M7 the direction is now stated conditionally (RD-6).
          separating_condition: none inside this contract; resolved by the restricted-model option, every D* sentence scoped, the threshold handed as D*(m) over m
    A3_quantifier_order:
      statement: >-
        FOR EACH c in {K-571, B-571}, R in {R-B, R-M}, the scored omega = 3 and
        each m in the M-SET, D*_R(c, 3.0, m) := min { D in {2, ..., 64} :
        mu_R(c, D, 3.0; m) > 0 }, and FOR ALL D in {2, ..., 64},
        mu_R(c, D, 3.0; m) < 0 iff D < D*_R(c, 3.0, m) (L-MON), conditional
        on H1, H5, H3 and H4, inside the restricted model, under MI-1.
      what_is_not_quantified: >-
        Nothing ranges over the true solving degree. E1 is an EXISTS-m
        statement; E2 needs EVERY m, BOTH readings, a true degree at least
        D*_R + 1 and a named lower edge that H1 does not assert (RD-5).
        Neither is reachable from this contract.
    A4_method_ceiling_and_nearby_object_control:
      strongest_certifiable_claim: >-
        D*(m) in the reconciled model, under its numbered readings (MI-1
        among them, with C-CEIL-T beside it), assuming H1 (with H5), inside
        the dense, fixed-omega, block-size-n model.
      ceiling: >-
        The method evaluates a cost formula and cannot certify a solving
        degree, a relation, a solve or any property of a curve; its D* is no
        sharper than the R-B/R-M reading interval and no wider than the
        restricted model. M5 and M8 each move D* one way only (M5 too early
        at in-domain omega; M8 only earlier); M7's direction is conditional
        (RD-6). It cannot validate H1 (H1-C).
      nearby_object_control:
        - >-
          PTM-A, 283: at D = 4, omega 3, MI-1, against the corrected column,
          +11.3961 (K-283) and +6.8237 (B-283) (version-1 sheet W5.6, cited),
          with Macaulay rows 2^32.58 (R-B) or 2^27.98 (R-M) and relation store
          2^31.44 beside them. Gate G4.
        - >-
          PTM-B at 163 (rows 2^29.39, store 2^23.29), 233 (rows 2^31.46, store
          2^25.89) and 239 (ECC2-238 +21.5093, ECC2K-238 +25.4598, version-2
          sheet WC3, cited; rows 2^31.60, store 2^26.56). Gate G4, MI-1 only.
        - >-
          Ceiled slack (O-J5-2): under the ceiled reading C_I(283, 3.0) is
          141.5270 at m* = 10 (rows 2^32.58 or 2^27.98, store 2^29), which the
          contract discloses and never gates.
        - PTM-C excluded by BR-1, PTM-C-SLICE by C-BR1 (b) to (e), PTM-D by IR-1, PTM-F by the UNRESOLVED-row rule, all by rule (carried).
    A5_strictness_and_interfaces:
      strictness: not_applicable; no strict improvement is claimed; the contract prices an existing method
      interfaces: >-
        I1 L-INT (illustrative R-I to block_n4w); I2 L-EXT with L-ARG and
        L-SPREAD (instrument at D = 4 to R-B and R-M); I3 the rho column with
        C-PARAM and C-RHOCONV; I4 SN-1 and the delta shift with L-MONO,
        through pinned_coherent_row and multi_match_rule; I5 L-MONO (time-only
        D* to a memory-charged crossing); I6 IR-1 and IR-2 (any later
        measured degree to the D axis, with H6, the U-3 disclosure and the
        one-k comparison).
      lemmas_restated:
        - id: L-ARG
          statement: Under R-B and R-M the argmin over m of stage 1 is independent of D and omega and equals the D = 4 argmin (12 at 571, 9 at 283).
          proof: >-
            C_R(n, D, omega) = min over m of A(n, m) + S_R(n, D, omega), and
            S_R depends on n, D and omega only. The runner-up gaps are 0.0402
            bit at 571 (m = 13; relation store 2^43.92 against 2^47.58) and
            0.1775 bit at 283 (m = 10; store 2^28.30 against 2^31.44), with
            Macaulay rows m-independent (DF-RUNNER), and they are D- and
            omega-invariant for the same reason. It fails for the macaulay4
            reading, whose variable count depends on m and t; that reading is
            not used for any D*.
        - id: L-EXT
          statement: C_B(n, 4, omega) = C_M(n, 4, omega) = C_I(n, omega) for every n and omega.
          proof: S_B(n, 4, omega) = 4 omega log2 n = S_M(n, 4, omega); the A part is shared.
        - id: L-INT_version_3
          statement: >-
            With t* = m*, l = ceil(n/t*), nvar = t* l and the illustrative
            C_Ill(D, omega) = l + omega log2 binom(nvar, D):
            C_R(n, D, omega) - C_Ill(D, omega) = M1 + M2 + omega M3_R(D) + M4,
            and the frozen model and the illustrative surface both omit M5, M6
            and kappa; M7 and M8 lie outside the restricted model.
          multipliers:
            M1: 'relation-count exponent, k* - l = -0.4167 at 571 (version-1 sheet W6.4); memory beside it - the relation store is 2^47.58 under k* against 2^48 under l (a -0.42-bit store difference); D- and omega-independent'
            M2: 'inverse per-attempt success probability, -log2 P = 28.8355 at 571 (log2 12!; W6.5); it moves time only - Macaulay rows 2^36.63 or 2^32.04 and relation store 2^47.58 unchanged; D-independent'
            M3: 'per-solve normaliser M3_B(4) = 4 log2 571 - log2 binom(576, 4) = 4.5497 at 571 (M3a -0.0503, M3b 0.0151, M3c log2 4! = 4.5850; W6.6 to W6.9), the gap between the R-B rows 2^36.63 and the illustrative rows 2^32.08; D-dependent, carried by the readings'
            M4: 'stage convention, 0 in the stage-1-only convention; in the total-cost convention below 2^-90 at 571 because stage 2 is 2 k* = 95.17 bits of sparse linear algebra on the relation matrix, whose memory is the relation store 2^47.58'
            M5: 'row weight and sparsity, not modelled; direction for in-domain omega - its omission places D* too EARLY (version-2 correction, BATCH-7d29e8 red team J3-M5, attributed)'
            M6: 'number of blocks per attempt, not modelled; omission optimistic for index calculus'
            kappa: 'operation-unit conversion, 1 (not charged); direction unknown in general'
            M7: >-
              block-size exponent above D = 4, not modelled. DIRECTION
              CONDITIONAL (RD-6): for a non-decreasing M7 reading S_7 equal to
              S_B at D <= 4, D*_7 <= D*_B whenever S_7(D*_B) >= S_B(D*_B), and
              D*_7 >= D*_B whenever S_7(D*_B - 1) <= S_B(D*_B - 1) (proof in
              the contract's definitions.restricted_model.m7_direction). An F4
              row count growing faster than n per degree places D* no later; a
              binomial count in the Boolean variables of system (5), anchored
              at D = 4, grows faster only up to some degree and places D* later
              for crossings above it (BATCH-b67954 red team BA-J4-2, attributed).
            M8: 'optimising m under H2; A(571, m) >= A(571, m*) at every m under MI-1, so D*_R(c, 3.0, m) <= D*_R(c, 3.0, m*); one-way, earlier'
          restricted_model_consequence: >-
            The contract takes the restricted-model option: M5, M7 and M8 are
            named outside the model and are not priced. M5 and M8 each have one
            stated direction; M7's direction is conditional and stated as a
            lemma, never as one way.
          consequence: >-
            The proposal's route, R-FIT(D) = C_Ill(D) + M1 + M2 + omega M3(4),
            differs from C_B(D) by -omega (M3_B(D) - M3_B(4)), strictly negative
            for D > 4 and about 73 bits at D = 12, omega 3 (version-1 sheet W10,
            73.1465 bits), where the readings' Macaulay rows are 2^109.89 (R-B)
            against 2^80.92 (R-M) (DF-STEP); R-FIT is never used. R-M is its
            principled form and R-B the literal substitution of D for 4.
        - id: L-MON
          statement: For each c, R and omega the margin mu_R(c, D, omega) is strictly increasing in D on 2..64.
          proof: S_B increases by omega log2 n > 0 per degree; S_M by omega (W(n, D + 1) - W(n, D)) > 0; rho does not depend on D.
        - id: L-SPREAD
          statement: For D >= 4, C_B >= C_M with equality only at D = 4, hence D*_B <= D*_M at 571.
          proof: >-
            C_B - C_M = omega (g(D) - g(4)) with g(D) = D log2 n - W(n, D), and
            g(D + 1) - g(D) >= log2(n (D + 1)/(n + 1)) > 0. Both 571 margins
            are negative at D = 4 (93.4401 and 98.5188 bits below the corrected
            figures, rows 2^36.63 or 2^32.04, store 2^47.58), so both crossings
            are at D >= 5, where R-B crosses first.
        - id: L-UB
          statement: For every ordinary binary curve y^2 + xy = x^3 + a x^2 + b, b != 0, rho(c) <= 0.5 log2(pi (2^n + 1 + 2^(n/2 + 1))/8), so a positive margin against rho_ub implies one against rho(c).
          proof: The point (0, b^(1/2)) has order 2, so h >= 2; Hasse bounds h r; k >= 1. (Rho side only; no Macaulay matrix.)
        - id: L-MONO
          statement: >-
            Under H-SEMBIN-97ea23's product-minimum metric at kappa = 1, a
            positive time-only margin implies a coherent loss for index
            calculus whenever its working set is at least 6n bits; lowering
            the rho side by delta can turn a coherent win into a loss but never
            a loss into a win.
          proof: As the version-1 sheet states it (cited); a degree-4 Macaulay row set of an n-variable block already exceeds 6n bits for n >= 7.
        - id: L-ASM_version_3
          statement: Assembly. For each c, R and omega with G1 to G4 passed, the D* statement of the hypothesis holds in the model.
          proof: >-
            Per-attempt cost times inverse success probability, explicit:
            log2 stage 1 = k* (relations needed) + (-log2 P) (inverse
            per-attempt success probability) + S_R(D, omega) (per-attempt solve
            cost). L-EXT with F1 anchors the model to the recorded row, L-ARG
            fixes m*, L-MON makes D* unique, L-SPREAD orders the two readings.
            VERSION 3 (RD-5): read as a statement about the cost of a solve
            rather than about the model, the assembly needs H1 (version 3,
            an upper edge on the per-solve cost only), H5, H3 and H4; because
            H1 has no lower edge, no lower bound on any true cost follows from
            any D* (E2).

