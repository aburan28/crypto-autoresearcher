    CB-1:
      name: certicom_coverage.py
      purpose: RD-1. The Stage-0 Certicom coverage check (control C-COVER), a whole-Appendix scan gated on the frozen binary-curve count.
      rd_items: [RD-1]
      reference_sha256: 7e76be311e2063e3235f527d6abccb0165ca53865810bf1c3204b102f9269574
      utf8_bytes: 9282
      reference_source: allowed session computation C-1 (session_computations below), reproduced by sha256sum of the extracted file
      changed_after_C-1: false
      source: |
        """EXP-NISTBIN-451dfa version 3, Stage-0 Certicom coverage check (RD-1).

        A whole-Appendix scan of Appendix A ("Curve Details") of the primary input
        inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, made without reading
        the contract's certicom_rows list, compared with the Stage-5 Certicom row
        list as a set of (curve label, field degree m) pairs and gated on the
        frozen binary-curve count. Binary curves only: labels ECC2-<digits> and
        ECC2K-<digits>; prime-field labels ECCp-<digits> are skipped.

        Import-safe: the module level holds only imports, constants and function
        definitions. Nothing is read, computed or printed on import. Execution
        happens only under __main__ (the design-time self-test, allowed session
        computation C-3) or when Stage 0 calls certicom_coverage().
        """

        import json
        import os
        import re
        import sys

        APPENDIX_HEADING = "A Curve Details"
        CERTICOM_BINARY_CURVE_COUNT = 15
        CERTICOM_BINARY_DEGREE_COUNT = 9
        BINARY_FAMILIES = ("ECC2", "ECC2K")
        LABEL_RE = re.compile(r"^(ECC2K|ECC2|ECCp)-([0-9]+)$")
        DEGREE_RE = re.compile(r"^m\s*=\s*([0-9]+)$")
        FIELD_POLY_RE = re.compile(r"^f\s*=\s*x\^([0-9]+)")
        DEFAULT_APPENDIX = os.path.join("inputs", "CERTICOM-CHALLENGE-2009",
                                        "challenge-2009_text.md")
        DEFAULT_SPEC = os.path.join("experiments", "EXP-NISTBIN-451dfa",
                                    "specification.yaml")
        SELF_TEST_SPURIOUS_ROW = ("ECCp-97", 97)
        SELF_TEST_MISLABEL = ("ECC2-353", 353)


        def parse_appendix_a(text):
            """Scan every line after the LAST line equal to APPENDIX_HEADING.

            Returns a dict: start_line (1-based), labels (every curve label found,
            in order), rows (one per binary curve: curve, family, m, label_line,
            m_line, f_line) and problems (binary blocks that could not be read).
            """
            lines = text.split("\n")
            starts = [i for i, line in enumerate(lines)
                      if line.strip() == APPENDIX_HEADING]
            if not starts:
                return {"start_line": None, "labels": [], "rows": [],
                        "problems": ["Appendix A heading not found"]}
            start = starts[-1]
            labels = []
            for i in range(start + 1, len(lines)):
                hit = LABEL_RE.match(lines[i].strip())
                if hit:
                    labels.append((i, hit.group(1), hit.group(1) + "-" + hit.group(2)))
            rows = []
            problems = []
            for j, (i, family, curve) in enumerate(labels):
                if family not in BINARY_FAMILIES:
                    continue
                end = labels[j + 1][0] if j + 1 < len(labels) else len(lines)
                degree_hits = []
                poly_hits = []
                for q in range(i + 1, end):
                    s = lines[q].strip()
                    d_hit = DEGREE_RE.match(s)
                    if d_hit:
                        degree_hits.append((q + 1, int(d_hit.group(1))))
                    f_hit = FIELD_POLY_RE.match(s)
                    if f_hit:
                        poly_hits.append((q + 1, int(f_hit.group(1))))
                if len(degree_hits) != 1:
                    problems.append("%s at line %d: %d field-degree lines, expected 1"
                                    % (curve, i + 1, len(degree_hits)))
                    continue
                m_line, m = degree_hits[0]
                if not poly_hits or poly_hits[0][1] != m:
                    problems.append("%s at line %d: field polynomial degree does not equal m = %d"
                                    % (curve, i + 1, m))
                    continue
                rows.append({"curve": curve, "family": family, "m": m,
                             "label_line": i + 1, "m_line": m_line,
                             "f_line": poly_hits[0][0]})
            return {"start_line": start + 1,
                    "labels": [c for (_, _, c) in labels],
                    "rows": rows, "problems": problems}


        def certicom_coverage(appendix_text, stage5_rows):
            """G1 coverage verdict for the Certicom input (control C-COVER).

            appendix_text: the full text of the primary input, read unmodified.
            stage5_rows: the Stage-5 Certicom row list as (curve label, m) pairs.
            PASS iff the scan finds exactly CERTICOM_BINARY_CURVE_COUNT binary
            curves with distinct labels at CERTICOM_BINARY_DEGREE_COUNT distinct
            degrees, every binary block is read without a problem, and the Stage-5
            list holds exactly the same (label, m) pairs, each once.
            """
            parsed = parse_appendix_a(appendix_text)
            reasons = list(parsed["problems"])
            pairs = [(r["curve"], r["m"]) for r in parsed["rows"]]
            pair_set = set(pairs)
            binary_labels = [c for c in parsed["labels"]
                             if c.split("-")[0] in BINARY_FAMILIES]
            if len(set(binary_labels)) != len(binary_labels):
                reasons.append("a binary curve label occurs more than once in Appendix A")
            if len(pairs) != CERTICOM_BINARY_CURVE_COUNT:
                reasons.append("Appendix A binary-curve count %d differs from the frozen count %d"
                               % (len(pairs), CERTICOM_BINARY_CURVE_COUNT))
            degrees = sorted(set(m for (_, m) in pairs))
            if len(degrees) != CERTICOM_BINARY_DEGREE_COUNT:
                reasons.append("Appendix A binary-degree count %d differs from the frozen count %d"
                               % (len(degrees), CERTICOM_BINARY_DEGREE_COUNT))
            stage5 = [(str(c), int(m)) for (c, m) in stage5_rows]
            stage5_set = set(stage5)
            if len(stage5) != CERTICOM_BINARY_CURVE_COUNT:
                reasons.append("Stage-5 Certicom row count %d differs from the frozen count %d"
                               % (len(stage5), CERTICOM_BINARY_CURVE_COUNT))
            if len(stage5_set) != len(stage5):
                reasons.append("a Stage-5 Certicom row occurs more than once")
            for (c, m) in sorted(pair_set - stage5_set):
                reasons.append("binary curve of Appendix A absent from Stage 5: %s at m = %d"
                               % (c, m))
            for (c, m) in sorted(stage5_set - pair_set):
                reasons.append("Stage-5 row that is not a binary curve of Appendix A"
                               " at that degree: %s at m = %d" % (c, m))
            return {"verdict": "PASS" if not reasons else "FAIL",
                    "reasons": reasons,
                    "appendix_start_line": parsed["start_line"],
                    "appendix_binary_count": len(pairs),
                    "appendix_binary_degrees": degrees,
                    "appendix_binary_rows": parsed["rows"],
                    "stage5_count": len(stage5)}


        def omission_self_test(appendix_text, stage5_rows):
            """C-3 self-test on in-memory copies of the Stage-5 row list only.

            Fifteen single-row omissions, one spurious row and one mislabelled
            degree; each must FAIL. The input file is never modified.
            """
            base = [(str(c), int(m)) for (c, m) in stage5_rows]
            cases = []
            for idx in range(len(base)):
                mutated = base[:idx] + base[idx + 1:]
                res = certicom_coverage(appendix_text, mutated)
                cases.append({"case": "omit %s (m = %d)" % base[idx],
                              "kind": "omission", "verdict": res["verdict"],
                              "reasons": res["reasons"]})
            res = certicom_coverage(appendix_text, base + [SELF_TEST_SPURIOUS_ROW])
            cases.append({"case": "add spurious row %s (m = %d)" % SELF_TEST_SPURIOUS_ROW,
                          "kind": "spurious", "verdict": res["verdict"],
                          "reasons": res["reasons"]})
            label, wrong_m = SELF_TEST_MISLABEL
            mislabelled = [(c, wrong_m if c == label else m) for (c, m) in base]
            res = certicom_coverage(appendix_text, mislabelled)
            cases.append({"case": "mislabel %s at m = %d" % (label, wrong_m),
                          "kind": "mislabel", "verdict": res["verdict"],
                          "reasons": res["reasons"]})
            omissions = [c for c in cases if c["kind"] == "omission"]
            detected = [c for c in omissions if c["verdict"] == "FAIL"]
            spurious = [c for c in cases if c["kind"] == "spurious"]
            mislabel = [c for c in cases if c["kind"] == "mislabel"]
            summary = {
                "omissions_detected": "%d/%d" % (len(detected), len(omissions)),
                "spurious_detected": all(c["verdict"] == "FAIL" for c in spurious),
                "mislabel_detected": all(c["verdict"] == "FAIL" for c in mislabel),
                "mislabel_applied": any(c == label for (c, _) in base),
            }
            summary["all_detected"] = (
                len(detected) == len(omissions) == CERTICOM_BINARY_CURVE_COUNT
                and summary["spurious_detected"] and summary["mislabel_detected"]
                and summary["mislabel_applied"])
            return {"cases": cases, "summary": summary}


        def load_stage5_rows(spec_path):
            """Design-time stand-in for Stage 5: the contract's certicom_rows."""
            import yaml
            with open(spec_path, encoding="utf-8") as fh:
                doc = yaml.safe_load(fh)
            rows = doc["experiment"]["inputs"]["curve_parameters"]["certicom_rows"]["rows"]
            return [(r["curve"], int(r["m"])) for r in rows]


        def main(argv):
            repo = argv[1] if len(argv) > 1 else os.getcwd()
            with open(os.path.join(repo, DEFAULT_APPENDIX), encoding="utf-8") as fh:
                appendix_text = fh.read()
            stage5_rows = load_stage5_rows(os.path.join(repo, DEFAULT_SPEC))
            unmodified = certicom_coverage(appendix_text, stage5_rows)
            test = omission_self_test(appendix_text, stage5_rows)
            ok = unmodified["verdict"] == "PASS" and test["summary"]["all_detected"]
            print(json.dumps({"unmodified_inputs": unmodified, "self_test": test,
                              "c3_overall": "OK" if ok else "NOT OK"}, indent=1))
            return 0 if ok else 1


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
    CB-2:
      name: design_figures.py
      purpose: >-
        RD-2, RD-3, RD-8 and RD-9 (allowed session computation C-4). Memory
        columns at each time figure's own parameter point, including the
        macaulay4 and f4_std joint-convention figures at their own argmin; the
        k-reading comparison at every claim-(A) degree (571, 283 and 359
        included); A(571, m) under both k readings; the memory beside the
        carried degree-step and illustrative figures.
      rd_items: [RD-2, RD-3, RD-8, RD-9]
      reference_sha256: 96a681bc0f900cade3e42b60f80f92a3680056da91434674e19027978400d8cb
      utf8_bytes: 9695
      reference_source: allowed session computation C-1 (session_computations below), reproduced by sha256sum of the extracted file
      changed_after_C-1: false
      source: |
        """EXP-NISTBIN-451dfa version 3, closed-form design figures (C-4).

        Serves RD-2, RD-3, RD-8 and RD-9 of DEC-20260925-41f6dc: the memory columns
        at each time figure's own parameter point, the k-reading comparison (MI-1,
        k = n/m, against the ceiled reading, k = ceil(n/m)) at every claim-(A)
        degree, A(571, m) under both readings, and the memory beside the carried
        degree-step and illustrative figures. Every number printed is a DESIGN
        FIGURE of the contract's abstract model, never a result.

        Import-safe: the module level holds only imports, constants and function
        definitions; nothing runs on import. The module imports neither
        experiments/EXP-SEMBIN-81dc96/code/joint_balance.py nor anything under
        experiments/*/runs/, opens no file, instantiates no curve and runs no
        solver. The Boolean variable count of system (5) follows the frozen
        instrument's formula as read in its text (log2_solve_cost, macaulay4
        branch): N5 = int(round(t k + max(t - 2, 0) n)).
        """

        import json
        import math
        from fractions import Fraction

        OMEGA = 3.0
        M_LO = 2
        M_HI = 30
        FIXTURE_DEGREE = 4
        CLAIM_A_DEGREES = (79, 89, 97, 109, 131, 155, 163, 185, 191, 233, 239, 283,
                           359, 409, 571)
        FIXTURE_DEGREES = (571, 283, 359, 409)
        # Parameter point (n, m, t) of the two joint-convention time figures at
        # n = 571 (macaulay4 and f4_std), transcribed by the producer from
        # experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/raw-result.json,
        # correction_1_joint_optimum, improvement_table row n = 571 of each reading
        # (m_star 10, t_star 10; reading labels k=unceiled, D=4). Not opened here.
        JOINT_POINT_571 = (571, 10, 10)
        DEGREE_STEP_POINTS = ((409, 5), (571, 12))
        ILLUSTRATIVE_NVAR_POINTS = ((576, 2), (576, 3), (576, 4), (576, 12),
                                    (576, 20), (279, 4), (288, 4))
        READINGS = ("MI-1", "ceiled")


        def r4(x):
            return round(float(x), 4)


        def width(nvars, degree):
            """W(nvars, D): log2 of the sum over d = 0..D of binom(nvars, d)."""
            return math.log2(sum(math.comb(nvars, d) for d in range(degree + 1)))


        def log2_binom(nvars, degree):
            return math.log2(math.comb(nvars, degree))


        def k_exact(n, m, reading):
            """k = n/m under MI-1 (an exact rational) or k = ceil(n/m) (ceiled)."""
            if reading == "MI-1":
                return Fraction(n, m)
            if reading == "ceiled":
                return Fraction(-(-n // m))
            raise ValueError("unknown k reading %r" % (reading,))


        def a_value(n, m, reading):
            """A(n, m) = k - log2 P with P = 1 - exp(-2^(m k - n) / m!), eq. (11)."""
            k = k_exact(n, m, reading)
            log2_x = float(m * k - n) - math.log2(math.factorial(m))
            p = -math.expm1(-(2.0 ** log2_x))
            return float(k) - math.log2(p)


        def stage1(n, m, reading, omega=OMEGA, degree=FIXTURE_DEGREE):
            """Stage 1 at t = m under block_n4w: A(n, m) + degree * omega * log2 n."""
            return a_value(n, m, reading) + degree * omega * math.log2(n)


        def ordered_m(n, reading):
            """(stage-1 value, m) over m = 2..min(30, n), ascending by value with
            ties to the lower m: the first entry is the first minimum over
            ascending m with strict less-than."""
            vals = [(stage1(n, m, reading), m) for m in range(M_LO, min(M_HI, n) + 1)]
            return sorted(vals, key=lambda vm: (vm[0], vm[1]))


        def memory_at(n, m, degree, reading):
            """MR_B, MR_M, MR_C8 (nvar = m ceil(n/m)), dense entries and the
            relation store log2(2^k) = k at the point (n, m, t = m, D, reading)."""
            nvar = m * (-(-n // m))
            mr_b = degree * math.log2(n)
            mr_m = width(n, degree)
            mr_c8 = log2_binom(nvar, degree)
            return {"MR_B": r4(mr_b), "MR_M": r4(mr_m), "MR_C8": r4(mr_c8),
                    "nvar_C8": nvar, "dense_B": r4(2 * mr_b),
                    "dense_M": r4(2 * mr_m), "dense_C8": r4(2 * mr_c8),
                    "relation_store": r4(k_exact(n, m, reading))}


        def fixture_points():
            out = []
            for n in FIXTURE_DEGREES:
                m_star = ordered_m(n, "MI-1")[0][1]
                entry = {"n": n, "m": m_star, "t": m_star, "D": FIXTURE_DEGREE,
                         "k_reading": "MI-1",
                         "convention": "stage 1 only, t = m, block_n4w",
                         "C_I": r4(stage1(n, m_star, "MI-1"))}
                entry.update(memory_at(n, m_star, FIXTURE_DEGREE, "MI-1"))
                out.append(entry)
            return out


        def ceiled_at_fixture_m():
            n = 571
            m_fix = ordered_m(n, "MI-1")[0][1]
            entry = {"n": n, "m": m_fix, "t": m_fix, "D": FIXTURE_DEGREE,
                     "k_reading": "ceiled",
                     "convention": "stage 1 only, t = m, block_n4w, at the MI-1 argmin",
                     "stage1": r4(stage1(n, m_fix, "ceiled"))}
            entry.update(memory_at(n, m_fix, FIXTURE_DEGREE, "ceiled"))
            return entry


        def joint_points_571():
            n, m, t = JOINT_POINT_571
            k = k_exact(n, m, "MI-1")
            n5_exact = t * k + max(t - 2, 0) * n
            n5 = int(round(t * float(k) + max(t - 2, 0) * n))
            mac = width(n5, FIXTURE_DEGREE)
            f4_vars = n * (t - 1)
            f4_pow = FIXTURE_DEGREE * math.log2(f4_vars)
            f4_mon = width(f4_vars, FIXTURE_DEGREE)
            m_fix = ordered_m(n, "MI-1")[0][1]
            block_rows_b = FIXTURE_DEGREE * math.log2(n)
            block_rows_m = width(n, FIXTURE_DEGREE)
            fixture_store = float(k_exact(n, m_fix, "MI-1"))
            return {
                "point": {"n": n, "m": m, "t": t, "D": FIXTURE_DEGREE,
                          "k_reading": "MI-1",
                          "convention": "total cost, joint over (m, t), as recorded"},
                "N5_exact": str(n5_exact), "N5": n5,
                "macaulay4": {"MR_MAC": r4(mac), "dense_MAC": r4(2 * mac),
                              "relation_store": r4(k)},
                "f4_std": {"n_times_t_minus_1": f4_vars, "MR_F4": r4(f4_pow),
                           "dense_F4": r4(2 * f4_pow),
                           "MR_F4_monomial_form": r4(f4_mon),
                           "dense_F4_monomial_form": r4(2 * f4_mon),
                           "relation_store": r4(k)},
                "memory_move_beside_macaulay4_minus_block_n4w": {
                    "block_n4w_m_star": m_fix,
                    "rows_MR_MAC_minus_MR_B": r4(mac - block_rows_b),
                    "rows_MR_MAC_minus_MR_M": r4(mac - block_rows_m),
                    "relation_store_change": r4(float(k) - fixture_store)},
            }


        def kreading_row(n):
            row = {"n": n}
            best = {}
            for reading in READINGS:
                ordered = ordered_m(n, reading)
                (v1, m1), (v2, m2) = ordered[0], ordered[1]
                best[reading] = v1
                row[reading] = {"C_I": r4(v1), "m_star": m1, "runner_up_m": m2,
                                "runner_up_gap": r4(v2 - v1),
                                "memory_at_m_star": memory_at(n, m1, FIXTURE_DEGREE,
                                                              reading),
                                "relation_store_at_runner_up":
                                    r4(k_exact(n, m2, reading))}
            row["move_ceiled_minus_MI1"] = r4(best["ceiled"] - best["MI-1"])
            row["direction"] = ("ceiled lower" if best["ceiled"] < best["MI-1"]
                                else "ceiled not lower")
            return row


        def a_table(n):
            rows = []
            lower = equal = higher = 0
            diffs = []
            for m in range(M_LO, min(M_HI, n) + 1):
                a_mi1 = a_value(n, m, "MI-1")
                a_ceil = a_value(n, m, "ceiled")
                d = a_ceil - a_mi1
                diffs.append(d)
                if d < 0:
                    lower += 1
                elif d == 0:
                    equal += 1
                else:
                    higher += 1
                rows.append({"m": m, "A_MI1": r4(a_mi1), "A_ceiled": r4(a_ceil),
                             "ceiled_minus_MI1": r4(d)})
            summary = {"n": n, "m_count": len(rows),
                       "count_ceiled_below_MI1": lower, "count_equal": equal,
                       "count_ceiled_above_MI1": higher,
                       "largest_drop": r4(min(diffs)),
                       "smallest_drop": r4(max(diffs))}
            return rows, summary


        def degree_steps():
            points = []
            for n, degree in DEGREE_STEP_POINTS:
                points.append({"n": n, "D": degree,
                               "MR_B": r4(degree * math.log2(n)),
                               "MR_M": r4(width(n, degree)),
                               "MR_B_at_4": r4(FIXTURE_DEGREE * math.log2(n)),
                               "MR_M_at_4": r4(width(n, FIXTURE_DEGREE))})
            return {"points": points,
                    "log2_571_rows_per_R_B_degree_step": r4(math.log2(571))}


        def illustrative():
            points = [{"nvar": nv, "D": d, "log2_binom": r4(log2_binom(nv, d))}
                      for nv, d in ILLUSTRATIVE_NVAR_POINTS]
            return {"points": points, "four_log2_576": r4(4 * math.log2(576))}


        def build():
            a_rows, a_summary = a_table(571)
            return {
                "block": "CB-2 design_figures (allowed session computation C-4)",
                "label": "DESIGN FIGURES of the contract's abstract model; never results",
                "omega": OMEGA,
                "m_grid": [M_LO, M_HI],
                "fixture_points_MI1": fixture_points(),
                "ceiled_at_fixture_m_571": ceiled_at_fixture_m(),
                "joint_points_571": joint_points_571(),
                "kreading_table": [kreading_row(n) for n in CLAIM_A_DEGREES],
                "A_571_by_m": a_rows,
                "A_571_summary": a_summary,
                "degree_steps": degree_steps(),
                "illustrative_memory": illustrative(),
            }


        def dump(result):
            """Valid JSON with one list item per line."""
            out = ["{"]
            keys = list(result)
            for i, key in enumerate(keys):
                tail = "," if i + 1 < len(keys) else ""
                value = result[key]
                if isinstance(value, list):
                    out.append(" " + json.dumps(key) + ": [")
                    for j, item in enumerate(value):
                        comma = "," if j + 1 < len(value) else ""
                        out.append("  " + json.dumps(item) + comma)
                    out.append(" ]" + tail)
                else:
                    out.append(" " + json.dumps(key) + ": " + json.dumps(value) + tail)
            out.append("}")
            return "\n".join(out)


        if __name__ == "__main__":
            print(dump(build()))

