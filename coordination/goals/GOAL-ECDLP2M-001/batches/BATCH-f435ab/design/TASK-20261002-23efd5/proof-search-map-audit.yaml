        (k_reading "unceiled", omega 3.0, omega_prime 2.0, degree 4, yield_law
        "eq11"). Value = the first minimum, over m = 2, 3, ..., 30 in ascending
        order with strict less-than, of jb.stage_costs(n, m, m, Model)[0]
        (stage 1 only, t = m), which is curve_table.py's stage1_only_min(n,
        PAPER, t_eq_m=True, m_hi=30) exactly.
      model_identification: >-
        The k-rounding reading is the numbered choice MI-1. F1 identifies the
        frozen instrument's reading under MI-1, not a model the published text
        alone determines. VERSION 3 (RD-8): the ceiled reading lowers C_I at
        both targets (CB-2 kreading_table: at 571 by 11.1686 bits, 186.3070
        at m* 12 to 175.1383 at m* 15; at 283 by 6.1225 bits, 147.6495 at m*
        9 to 141.5270 at m* 10), so a ceiled evaluation FAILS the pass rule
        at both, by far more than the tolerance; Macaulay rows unchanged
        (2^36.63 or 2^32.04 at 571; 2^32.58 or 2^27.98 at 283), relation
        store 2^47.58 to 2^39 at 571 and 2^31.44 to 2^29 at 283.
    target:
      row: EXP-SEMBIN-992e73, RUN-SEMBIN-a7a2f3, raw-result.json, rows entry n = 571, block paper_convention_t_eq_m_stage1_only
      log2_cost: 186.307
      m_star: 12
      t_star: 12
      memory_beside: >-
        Macaulay rows 2^36.63 (R-B form, 4 log2 571) or 2^32.04 (R-M form,
        W(571, 4)) or 2^32.08 (C8 form, nvar 576); dense entries 2^73.26,
        2^64.08 or 2^64.16; relation store 2^47.58 (k* = 571/12). CB-2 output
        fixture_points_MI1, n = 571.
      source_record_status: >-
        DEC-20260918-4b7e21 ITEM-1: RUN-SEMBIN-a7a2f3 is a reproduction target
        and a design artifact, not evidence; used only as a reproduction target
        for the instrument's call path. RUN-SEMBIN-aa5161 (approved) records
        the same value.
      secondary_target:
        row: n = 283 at the same convention (RUN-SEMBIN-a7a2f3)
        log2_cost: 147.649
        m_star: 9
        t_star: 9
        memory_beside: >-
          Macaulay rows 2^32.58 (R-B form, 4 log2 283) or 2^27.98 (R-M form,
          W(283, 4)) or 2^28.06 (C8 form, nvar 288); dense entries 2^65.16,
          2^55.97 or 2^56.13; relation store 2^31.44 (k* = 283/9). CB-2 output
          fixture_points_MI1, n = 283.
    tolerance:
      value: 5.0e-4
      unit: bit, absolute, on log2 cost, inclusive
      argmin: exact on m* and t*
      basis: >-
        The target is recorded to three decimals, so a correct evaluation must
        round to it; 5.0e-4 is that rounding half-width, and the instrument is
        deterministic closed-form arithmetic, so nothing justifies more slack.
        Not revisable after any evaluation (the contract's V-4).
      margin_note: >-
        CB-2 gives C_I(571, 3.0) = 186.3070 at m* = 12 (Macaulay rows 2^36.63
        or 2^32.04, relation store 2^47.58) and C_I(283, 3.0) = 147.6495 at
        m* = 9 (rows 2^32.58 or 2^27.98, relation store 2^31.44) to four
        decimals (fixture_points_MI1), consistent with both targets. CB-2 rounds to four
        decimals, so the exact distances are not restated as this producer's
        figures: the version-1 sheet (W4.5, W5.4, cited, hand arithmetic)
        records 4.82e-5 and 4.783e-4 bit, and the BATCH-b67954 validator
        reports 4.784e-4 of 5.0e-4 at 283 (attributed, provenance internal).
        The 283 closeness is an artifact of the three-decimal grid.
    pass_rule: >-
      PASS iff |C_I(571, 3.0) - 186.307| <= 5.0e-4 with argmin m = t = 12, AND
      |C_I(283, 3.0) - 147.649| <= 5.0e-4 with argmin m = t = 9. Anything else
      is FAIL. (Unchanged.) Memory beside both targets (not part of the rule):
      at 571 Macaulay rows 2^36.63 or 2^32.04 and relation store 2^47.58; at
      283 rows 2^32.58 or 2^27.98 and relation store 2^31.44.
    gate: >-
      G2. On FAIL the run stops (SR-1), gates.json records the failure, and
      nothing after Stage 2 is computed: no extension identity, no claim-(A)
      count, no surface, NO D* and no threshold table. (Unchanged but for the
      stopping-rule id, renamed from S-1.)
