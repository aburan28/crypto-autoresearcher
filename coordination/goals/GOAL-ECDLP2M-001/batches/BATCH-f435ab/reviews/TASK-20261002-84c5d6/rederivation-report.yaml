derivations:
  A_of_n_m:
    expression: A(n, m) = k + log2(1/P(n, m, m, k)) = k + (n - m k) + log2(m!) = n - (m - 1) k + log2(m!)
    KR-A: A(n, m) = n/m + log2(m!)   (since m k = n)
    KR-B: A(n, m) = n - (m - 1) ceil(n/m) + log2(m!)
    from_the_paper:
    - Stage 1 collects "a system of <= 2^k, k = ceil(n/m) linear relations (7)" (line 1064); log2 of the relation count is k, the 2^k factor of (15).
    - P(n, m, m, k) ~ 2^(mk - n)/m! "see Section 4.3" (lines 1065-1067), which is eq. (11) of Section 4.3 (lines 396-431) in its small-yield form |V|^t/(q t!), with q = 2^n, |V| = 2^k and t = m (line 429).
    - First-stage cost (15) = 2^k n^(4 omega) / P(n, m, m, k) ~ m! 2^(n - mk) 2^k n^(4 omega) operations (lines 1074-1088). A drops the per-system factor n^(4 omega) (lines 1068-1072). So C_B(n, 4, omega; m) = log2 of (15) exactly, because S_B(n, 4, omega) = 4 omega log2 n.
    - 'Consistency: the paper''s bound "for omega = 3 that is at most m! 2^(n/m) n^12" (lines 1088-1091) is the KR-A form bounding the KR-B form from above; NF-11 finds A(KR-B) < A(KR-A) at every m in 2..30.'
  N5:
    formula: 'N5(n, t, k) = (t - 2) n + t k; at t = m: (m - 2) n + m k'
    KR-B: '(m - 2) n + m ceil(n/m), an integer; the count the paper''s text supports (k is always the integer ceil(n/m): lines 360, 541, 602-603, 617, 623, 1064)'
    KR-A: (m - 2) n + m (n/m) = (m - 1) n exactly; unrounded = nearest = ceil; the paper writes this as "~ (m - 1)n" (line 372)
    paper_lines:
      system_5: '228-238 (t = 2: line 240)'
      unknown_domains: '228'
      count_general_t: 611-613 ("n(t - 1) coordinate equations in n(t - 2) + kt variables")
      count_t_eq_m: 367-372 ("(m - 1)n multivariate equations in (m - 2)n + km ~ (m - 1)n variables")
      k_and_V: 360, 540-542, 602-604
    saved_before_amendment_formula_was_read: true
  rho_and_k_c:
    rho: rho(c) = 0.5 log2(pi r / (4 k_c)), r = base point order n of FIPS 186-4 D.1.3
    k_c_K-571: Frobenius pi:(x,y)->(x^2,y^2) is an endomorphism of K-571 (a=0, all coefficients in F_2). <G> is the unique order-r subgroup of E(F_2^571) (r prime, r^2 does not divide 4r), so pi acts on it as multiplication by lambda, a root of T^2 - mu T + 2 mod r (mu = -1). Exactly one root satisfies lambda^571 = 1 mod r (pi^571 = identity on E(F_2^571)); the other satisfies lambda^571 = 2^571 mod r. lambda != 1, and 571 is prime, so ord(lambda) = 571 = k_c.
    k_c_B-571: '571 is prime, so F_2 is the only proper subfield of F_2^571. For y^2 + xy = x^3 + x^2 + b, j = 1/b. b (polynomial basis, FIPS lines 7072-7074) is not 0 or 1, and b^2 != b in F_2^571, so j is not in F_2: E is not isomorphic over the algebraic closure to any curve defined over F_2, E^(2^i) is not isomorphic to E for 0 < i < 571, and the only Frobenius power that maps E to itself is pi^571, the identity on E(F_2^571). The Frobenius class map is trivial: k_c = 1.'
