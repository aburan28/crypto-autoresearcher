  # ---------------------------------------------------------------------------
  PTM-G:
    performed: true
    declared_before_evaluation: >-
      computations.json declarations.PTM-G (object, predicate formalisation,
      worlds W0 to W4, control object, failure signature), hashed
      bd641dbef355110111d9b1349623691f97290b3e4e62d293506ab1149dd196cf at
      07:26:01Z before any evaluation; s02 refuses to run unless the hash
      matches.
    a_on_the_closed_form_table: >-
      I evaluated the threshold table at every m in 2..30, both readings, both
      571 curves, under MI-1 and under C-CEIL-T (computation C-02). Grid-edge
      entries are m = 2 for both curves under both k readings, with A(571, 2) =
      286.8457 against rho 279.7471 and 284.8257. f_i takes no table argument.
      Paired with the identical table, it is false in W0, W3 and W4 and true in
      W1 and W2. So it is neither fixed true nor fixed false by the table, and
      no grid-edge entry can fire it.
    control_object: >-
      The version-2 sub-condition (i) ("an entry of this run's threshold table
      at some m other than m* is at or below 20"), evaluated on the same tables,
      is TRUE under both k readings and for each (curve, reading) separately.
      It is certain twice over: the m = 2 grid edge, and the largest entry of
      the whole MI-1 table being 10. The instrument separates the known-certain
      object from the rekeyed one.
    b_on_the_named_event: >-
      The event can occur and can fail to occur, and in kind it would make
      Part 3 more worth measuring (J6.rd7 above). Probe W2, a record at
      k > ceil(n/m): (i) also fires on degree growth in a regime Assumption 1
      does not cover, which the archived primary source already reports
      (OBJ-J6-1).
    failure_signature_met: >-
      YES. The rekeyed sub-condition is neither fixed true nor fixed false by
      the closed-form table, does not fire from a grid-edge entry, and names an
      event that would make the Part 3 measurement more worth making. One
      sub-event (W2) is weakly informative; it errs toward reopening and does
      not reach PTM-G's known-false conclusion.

  PTM-I:
    performed: true
    declared_before_evaluation: computations.json declarations.PTM-I (same hash as PTM-G)
    computed: >-
      Computations C-02 and C-03, own code. S_7(571, D, 3; m) = 3 (W(N5, D) -
      W(N5, 4)) + 12 log2 571 with N5 = int(round(t k + max(t - 2, 0) n)) =
      571 (m - 1), t = m, k = 571/m (MI-1), D in 4..64, m in 2..30. At m = 12
      (N5 = 6281) the per-step growth exceeds R-B's (27.472 bits) through D = 10
      and falls below from D = 11. The cumulative difference Delta(D) = S_7 -
      S_B peaks at +10.6287 at D = 10 and is +1.4367 at 18 and -0.9405 at 19.
      Hence the binomial reading places D* no later for crossings 6..18, no
      earlier for crossings 20..64, and is undetermined at 19. For m <= 6 it
      never grows faster than R-B above D = 4 and places D* no earlier at
      every crossing. Across m the "no earlier" range starts at 9 (m = 7), 20
      (m = 12), 40 (m = 20) and 63 (m = 29). At m = 30 it is empty inside the
      grid (D_0(30) = 64; X = 64 is undetermined). Of the 58 actual MI-1
      crossings (29 m values, 2 curves) the reading moves D* later at 1 (B-571,
      m = 5: 6 to 7), earlier at 17 (for example K-571, m = 8: 8 to 7), and
      leaves 40 unchanged (computation C-02).
    against_stated_ranges: >-
      The contract freezes no M7 range endpoint. Its one quantified range, the
      attributed "D >= 19" at m = 12, is one degree wider than the computed
      "no earlier" range (X >= 20) but contains no X with Delta(X) > 0, so it
      passes the declared test (OBJ-J4-7). The audit L-INT example's
      range fails at every m in 7..30 under the sentence's own reading
      (J4.rd6 above).
    failure_signature_met: >-
      YES for the plan's literal signature: no in-force sentence asserts a
      one-way EARLIER (or "only earlier") M7 direction over a range on which
      PTM-I moves D* later, so PTM-I does not reach its known-false conclusion.
      The declared symmetric extension fails at one sentence. That extension:
      a one-way LATER sentence must not claim a range containing X with
      Delta(X) > 0. The audit L-INT_version_3 M7 example fails it, which is
      the J4 break.
    note_on_the_plan_known_truth_wording: >-
      The plan's PTM-I known_truth reads "its growth per degree step falls
      below R-B's above some degree, so it moves D* later than R-B for
      crossings above that degree". Taken literally with "that degree" the
      per-step crossover, it is the same conflation and is false for crossings
      between the per-step crossover (11 at m = 12) and the cumulative
      crossover (19 to 20). A reviewer checking the audit sentence against that
      wording would pass it. Recorded for the composer; not a deviation of
      this report.

