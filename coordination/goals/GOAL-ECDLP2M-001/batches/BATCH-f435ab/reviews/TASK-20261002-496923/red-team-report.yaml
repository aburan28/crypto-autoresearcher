      classification: EXTERNAL
      classification_basis: >-
        No clause of (i) reads the run's threshold table or any run output; its
        arguments are records committed after the deprioritising decision.
        Formalised as f_i(records) in the hashed declarations (computation C-01)
        and evaluated in C-02 (PTM-G below).
      can_occur: >-
        Yes. A declared synthetic record satisfying every clause makes f_i true
        (world W1). The event is realistic. Semaev 2015 itself reports maximal
        degree above 4 when k > ceil(n/m) (inputs/SEMAEV-2015-310/paper_fulltext.md
        lines 1054-1056, read). The program's corpus records "Unreproduced
        counter-data in the KN-LIT-e77232 comment thread" of step degree 5 at
        n = 45, m = t = 2 on the diagonal k = ceil(n/m)
        (knowledge/open-problems/KN-OPEN-d218ec.md, status open, read). The
        same n = 45, m = t = 2 degree-5 report also appears in Kosters and Yeo,
        arXiv:1503.08001, as a fetch tool extracted it (provenance retrieved,
        not line-verified, PD-RT-7). A validated reproduction committed later
        would fire (i).
      can_fail: >-
        Yes. With no qualifying record (world W0), or one committed before the
        decision (W4), or a GOAL-SEMBIN-fcb7a2 true-degree record (W3, which is
        (iii)), f_i is false. When the deprioritisation is recorded, (i) is open
        by construction. False-PASS check: a GOAL-DREG-001 Macaulay-rank degree
        record (the quantity KN-OPEN-d218ec says may differ from Semaev's d_F4)
        does not fire (i), because the IR-2 convention clause excludes it, as it
        should.
      direction: >-
        Right in kind. K4 deprioritises Part 3 because the scored threshold lies
        above every plausible degree, so recorded degree growth beyond 4 raises
        the chance a true degree reaches it. (i) does not fire from a grid-edge
        entry: it reads no entry at all.
      k4_branch_reachability_context: >-
        Not a defect of (i), but it governs what RD-7 buys. Under the contract's
        own closed forms the four scored cells at m* = 12 (MI-1, omega 3) are
        D*_B = 8 and 8 and D*_M = 9 and 10 (K-571, B-571). So D*_lo = 8 and
        D*_hi = 10, and once F1 passes neither K3 nor K4 (nor K2 or K2x) can be
        the class of a valid run. The largest entry of the whole MI-1 table is
        10 (computation C-02, K4_reachability). The K4 deprioritisation, and so
        this revisit condition, is a pre-registered clause on a branch the
        closed forms exclude for this contract. It would bind only a successor
        contract whose model admits K4. Routed to the composer under D-10 (J3's
        item), not ruled here.
