        - location: spec success_criterion.decision_mapping K4 revisit (ii)
          class: CONDITIONAL ("so the revisit fires whichever way")
          ptm_i: consistent
        - location: spec interpretation_limits (third entry) and hypothesis version_3 interpretation_limits.entries[0]
          class: CONDITIONAL plus RANGE-RESTRICTED with an unquantified endpoint
          ptm_i: >-
            "a consistent binomial reading does the second [places D* no
            earlier] for crossings at high degree" is true wherever "high" means
            X >= D_0(m) + 1 and never false, since the sentence claims no lower
            endpoint and no "only". It hides an m-dependence the threshold table
            needs: D_0(m) = 5 for m <= 6 (no earlier at every crossing 5..64), 19
            at m = 12, 64 at m = 30. Non-breaking.
        - location: audit audits.A5_strictness_and_interfaces L-INT_version_3 multipliers.M7
          class: CONDITIONAL lemma, plus two examples; the second is a RANGE-RESTRICTED ONE-WAY "later" sentence
          text: >-
            "An F4 row count growing faster than n per degree places D* no
            later; a binomial count in the Boolean variables of system (5),
            anchored at D = 4, grows faster only up to some degree and places D*
            later for crossings above it (BATCH-b67954 red team BA-J4-2,
            attributed)."
          ptm_i: >-
            BREAKS. The first example is correct: the f4_std power form anchored
            at D = 4 has Delta >= 0 at every D for every m (nearby-object
            control, computation C-05), so it places D* no later. In the second
            example the sentence's own first clause fixes "grows faster" as
            growth per degree step, so "some degree" is the last degree at which
            the binomial count grows faster than R-B per step. The sentence then
            claims "later" for every crossing above that degree. PTM-I refutes
            this at every m in 7..30. At m = 12 the last faster step is D = 10,
            yet the cumulative difference stays positive through D = 18
            (Delta(18) = +1.4367), so for crossings at 11..18 the binomial
            reading places D* NO LATER (lemma (a)), never later. Counterexample
            ranges per m are m = 7: 6-7, m = 8: 7-9, m = 9: 8-11, m = 11: 10-16,
            m = 12: 11-18, m = 20: 19-38, m = 30: 29-63 (computation C-03). An
            ACTUAL crossing of the contract's own MI-1 table refutes it as
            well. At K-571, m = 8 the last faster step is D = 6 and the R-B
            crossing is at 8 (margin -0.7686 at D = 7). The binomial reading
            crosses at 7 (margin +1.3419), which is EARLIER, against the
            sentence's "later". Reading "some degree" instead as the cumulative
            crossover makes the clause "grows faster only up to [18]" false,
            since per-step growth is slower from D = 11. Under either single
            referent the sentence states something false about the PTM-I
            object. This is the per-step versus cumulative conflation that the
            spec's m7_direction avoids. It errs in the direction that
            overstates how long index calculus stays cheaper under M7.
        - location: audit audits.A5 L-INT_version_3 restricted_model_consequence; audit A4 ceiling; audit A2 OC-5; audit findings FD-16
          class: CONDITIONAL or descriptive
          ptm_i: >-
            Consistent in themselves, but restricted_model_consequence ("M7's
            direction is conditional and stated as a lemma, never as one way")
            is contradicted by the M7 multiplier text two lines above it.
        - location: worksheet rd6_search.result
          class: discharge claim
          ptm_i: >-
            "No in-force sentence states a one-way direction for M7 over any
            degree range." False on its face: the audit L-INT example, the
            attributed m7_direction range and the "for crossings at high degree"
            sentences each state one. RD-6 permits range restriction, so ranges
            are allowed; the audit's range is the wrong range.
        - location: superseded, not in force
          class: one-way EARLIER (version 2)
          ptm_i: >-
            Hypothesis version_2 interpretation_limits "M7 ... would place D*
            EARLIER than R-B" (false at every m <= 6 and for high crossings at
            every m) is replaced by the version_3 in_force_list_rule. Correctly
            not in force.
      no_one_way_earlier_sentence_in_force: >-
        No in-force sentence asserts a one-way EARLIER (or "only earlier") M7
        direction over any range. Every one-way statement of that form in force
        is about M5 or M8, not M7.
      cheapest_fix: >-
        One sentence. Replace the audit's second example with the m7_direction
        form: "a binomial count ... grows faster than R-B per degree step only
        up to some degree d_x(m) - 1 and more slowly above it; its cumulative
        cost stays above R-B's up to D_0(m) - 1, so it places D* no later for
        crossings at or below D_0(m) - 1 and no earlier for crossings at or
        above D_0(m) + 1 (at 571, m = 12: d_x = 11, D_0 = 19; no earlier for
        X >= 20, undetermined at 19)". Correct the worksheet's rd6_search result
        and qualify the attributed "D >= 19" the same way.
