    - id: OBJ-J4-1
      joint: J4 (adjacent to RD-5; not in the plan's J4 claim)
      severity: material, non-breaking under the plan's J4 artifacts; breakthrough direction
      location: spec definitions.e1_e2.E1 (carried verbatim from version 2)
      statement: >-
