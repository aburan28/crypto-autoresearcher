    rd5:
      result: holds
      side_by_side:
        formal_statement: >-
          H-NISTBIN-dec5e1 version_3 H1.formal_statement: "... completing at
          maximal degree D (grid 2..64) costs 2^S operations with S AT MOST
          S_B(n, D, omega) + omega log2 n, that is, at most the R-B reading ...
          plus one degree step (omega log2 n bits) ... H1 asserts NO LOWER EDGE:
          neither S_M(n, D, omega) ... nor any other quantity is claimed to
          bound S from below."
        lower_edge_note: >-
          H1.lower_edge: "H1-L DISCHARGED BY REMOVAL (RD-5, the second route
          DEC-20260925-41f6dc offers). The lower edge is gone from BOTH the
          formal statement above and the falsification condition below; S_M is
          not claimed to bound any solving cost."
        falsification_condition: >-
          H1.falsification_condition: "H1-V, external only, at n in N_toy, and
          ONE-SIDED (RD-5): a measured per-solve cost of system (5) at a solving
          degree D that EXCEEDS S_B(n, D, omega) by more than one degree step
          (omega log2 n bits). A measured cost below S_M, or below any other
          quantity, falsifies nothing, because H1 asserts no lower edge."
        reading: >-
          The three agree: the formal statement asserts S <= S_B(D) + one step
          and no lower edge, and the falsifier fires exactly when that upper
          edge is exceeded. The edge is gone from both places, from H5 ("No
          lower edge is transferred") and from every in-force sentence of the
          four files: every in-force "lower edge" or "lower bound" mention
          denies the edge or names E2's external requirement, and the
          bracket/lower-edge wording survives only in superseded version-1 and
          version-2 H1 fields (computation C-07).
      toy_cost_trace: >-
        Computation C-02 (J4.toy_cost), n in {21, 40}, omega 3, D in {4, 5, 6}:
        a measured per-solve cost one degree step and 0.5 bit below S_M (for
        example n = 21, D = 5: S = 44.6891 against S_M 58.3661, S_B 65.8848)
        leaves version 3's H1 formal statement satisfied and its falsification
        condition silent, so version 3 does NOT call H1 falsified (version 2's
        reading interval would have). The upper-side control, one step and 0.5
        bit above S_B, fires the version-3 falsifier at every point.
      e2_trace: >-
        Computation C-02 (J4.E2_trace) over every m in 2..30, both 571 curves,
        MI-1, omega 3. D_true(m) = D*_M at every m: E2's degree clause fails
        under R-M, and the model margin under the named lower edge
        S >= S_M(D_true - 1) is not positive everywhere (m = 12: -15.83 bits
        for K-571, -3.00 for B-571), so a true degree exactly at D*_M is
        correctly NOT routed as E2. D_true(m) = D*_M + 1: the clause holds at
        every m for B-571; for K-571 it fails only at m = 3, where the readings
        invert (D*_M = 3 < D*_B = 4), because E2 demands both readings; the
        margin under the named lower edge is then positive at every m. E2 is
        reachable only with the external lower edge, which H1 does not assert,
        as the contract says. The "+ 1" reconciliation is sound and errs only
        toward NOT closing.
      e2_grid_edge_note: >-
        At m = 2 the threshold is the token "D* <= 2" for both curves (A(571, 2)
        exceeds rho by 7.10 and 2.02 bits), so the model margin is positive for
        every per-solve cost; E2's clause still requires D_true(2) >= 3. That is
        over-strict (false-FAIL direction, conservative) and the "+ 1" is
        undefined on a token. Minor (OBJ-J4-6).
