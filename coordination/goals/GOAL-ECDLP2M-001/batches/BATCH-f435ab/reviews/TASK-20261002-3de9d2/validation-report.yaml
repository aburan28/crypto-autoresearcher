    with_rule_as_applied:
      rule: A time figure is WITH memory only if a memory figure for the SAME OBJECT stands in the same sentence
        or the same list item (plan J2 attack (ii), card V2-9). No character window, no pointer, no 'same field'.
      sentence: within one YAML scalar (folded scalars re-joined), a span ending at '.', '!' or '?' followed by
        whitespace; decimal points, abbreviations and factorial '!' are not sentence ends
      list_item: the innermost YAML sequence entry; a one-line flow-mapping row; one output line of the embedded
        CB-2 log (CB-2 prints one JSON list item per line). A YAML mapping and its sibling keys are NOT a list item.
      time_figure: 'an index-calculus log2 cost, cost component (A(n, m), per-solve cost, stage-2 cost), margin,
        difference between readings or k readings, per-step cost, runner-up gap, or a quoted, carried or proposal
        figure of any of these. Rho-side figures are listed as RHO (no Macaulay matrix; their distinguished-point
        memory is uncharged and disclosed). Not time figures: parameters, degrees and D* bands, counts, tolerances,
        fixture agreement residuals (audit L1168-1169), span ratios, run budgets, digests, line and section numbers,
        and memory figures themselves.'
      false_pass_and_false_fail_of_the_rule: 'FALSE PASS guarded: a pointer (DF-A571 ''this entry is the in-force
        statement''; c8_sweep ''WITH via DF-A571'') and a memory figure for a different object in the same item
        (disclosures L1941-1945 quote 2^44.72 beside -4.58) are not counted as WITH; a memory word without a memory
        figure (''memory beside the 26.75-bit figure'') is not a memory figure. FALSE FAIL guarded: a figure whose
        memory is in its own list item but a different sentence is WITH (e.g. spec L748-753 SN-1, L406-412 MI-1);
        a long single sentence carrying all memory is WITH (spec L1784-1797); one-line flow rows with a memory key
        are WITH (audit L1189-1190); rho figures are not counted as WITHOUT; tolerances and residuals are not time
        figures.'
