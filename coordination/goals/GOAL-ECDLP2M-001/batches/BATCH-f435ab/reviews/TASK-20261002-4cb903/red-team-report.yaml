    - id: O-RT-06
      joint: J7
      severity: minor; new
      location: audit constants_delta (CD-07); worksheet open_issues OI-1
      finding: >-
        O-J4-2's additions to definitions.d_star and
        output_templates.d_star_sentence (hunks H25, H75, H76) touch the D-4
