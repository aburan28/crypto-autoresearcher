    - id: O-RT-04
      joint: J7 (C6; D-5 H1-Q and H1-S)
      severity: material; hidden assumption; carried verbatim from version 2
      location: hypothesis version_3 H5.formal_statement and extrapolation_span; spec output_templates.threshold_sentence; d_star_of_m
      finding: >-
        H5 transfers H1's upper edge "at n = 571 with m = t = 12 ... and at
        n = 283 with m = t = 9". The handed MI-1 threshold table, however, is
        read at every m in 2..30 at n = 571, "under the same numbered readings
        and assumptions" (threshold_sentence). So the transfer at (571, m)
        for m other than 12 is unnumbered. The disclosed span (104.7 times in
        variable count) is m = 12's. Across the M-SET, n(t - 1) runs from 571
        (9.5 times the measured 60 variables) at m = 2 to 16559 (276.0 times)
        at m = 30. The threshold_sentence carries no span at all.
      repair: >-
        Restate H5 over every m in the M-SET at n = 571, with k = 571/m under
        MI-1 and k = ceil(571/m) for C-CEIL-T. Put the per-m span beside the
        threshold table or in threshold_sentence.
