    - id: O-RT-08
      joint: J7
      severity: minor; carried; avoidable at execution
      location: spec invalidation_rules V-2 and V-11; metrics.primary (second item)
      finding: >-
        A literal reader could void a valid run through two clauses. V-2's
        "any column labelled only 'degree'" also catches a claim-(A)
        extension-degree column labelled "degree". V-11's "a C-CEIL-T value
        entering ... the MI-1 threshold table" collides with metrics.primary's
        handed table, which carries the C-CEIL-T column beside the MI-1
        entries.
      repair: '"any D-axis column labelled only degree"; "an MI-1 entry computed from, or replaced by, a C-CEIL value".'
    - id: O-RT-09
      joint: J7 (D-8 S-13 walk; RD-5 is J4's, so this is a pointer for J4's owner too)
      severity: minor; carried; routing-conservative
      location: spec definitions.e1_e2.E1
      finding: >-
        Under H1 (version 3), S <= S_B(D) + omega log2 n = S_B(D + 1), so the
        model margin at a true degree D_true is at most mu_B(D_true + 1).
        That bound is non-positive only when D_true <= D*_B - 2. E1 ("the true
        solving degree ... is below D*_R") also admits D_true = D*_R - 1, where
        H1 supports no sign. This mirrors the "+ 1" that RD-5 added to E2. As a
        routing label the over-inclusion is conservative (RT-1). As a stated
        definition, it overstates by one degree what H1 and H5 support.
      repair: Have E1 name the tolerance (D_true <= D*_B - 2 under R-B), as E2 now does.
