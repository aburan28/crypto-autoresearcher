  objections:
    - id: O-RT-01
      joint: J7
      severity: >-
        material; carried unchanged from version 2. Non-breaking under the
        purposive reading; breaking under the literal one.
      location: spec input_rules IR-1 (the sentence beginning "The code opens no file", line 676); SN-1.rule; inputs.cross_check_records; controls C-XDEG (including the version-3 RD-9 sentence)
      finding: >-
        IR-1 says "The code opens no file under any experiments/*/runs/
        directory other than the two declared raw-result.json files and the
        coherent-baseline records." The only committed copy of
        COST-SEMBIN-8d123b is
        experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml.
        It is neither of those things: the contract lists it under
        cross_check_records, not inputs.coherent_baseline.records. Yet SN-1's
        sign check, IR-1's own row selector RS-2, and C-XDEG must read it.
        Version 3's RD-9 sentence adds "the record's own memory figure, if it
        states one, is reported beside it by Stage 6". A valid run therefore
        cannot honour both. If it honours the whitelist, SN-1 cannot use the
        record, so "no SEMBIN margin is imported and every row that needs one
        is UNRESOLVED", which reroutes P-A. If it honours SN-1, it breaches
        IR-1, and no rule states a consequence for that. Separately, only one
        raw-result.json (RUN-SEMBIN-a7a2f3) is declared as a read input,
        although IR-1 speaks of two.
      repair: >-
        Add the cross-check record path to IR-1's whitelist. Name the second
        raw-result.json, or say "the declared raw-result.json".
    - id: O-RT-02
      joint: J7 (bears on J5 through V-9)
      severity: material; carried (version 3 edited the clause to add SR-6, but added no V-rule)
      location: spec success_criterion.protocol_success
      finding: >-
        "The run is VALID iff SR-2, SR-3 and SR-6 did not fire, G1 to G4
        passed, C-IND agreed, and every required artifact exists." The clause
        names no invalidation rule. Read literally, runs that only a V-rule
        catches are VALID: I1c (V-6), I2e (V-11) and I1a (rule_sweep.out).
        stage_order_enforcement ("is invalid (invalidation rule V-6)") and
        falsification_criterion ("VOID ... when the run is invalid or G1, G2
        or G4 fails") use "invalid" in the V-rule sense, so the purposive
        reading invalidates. The contract states no precedence between the two.
      repair: Add "and no invalidation rule V-1 to V-11 fired" to protocol_success.
    - id: O-RT-03
      joint: J7
      severity: material; carried
      location: spec invalidation_rules V-6; stage_order_enforcement; required_artifacts (gates.json, raw-result.json, manifest.yaml)
      finding: >-
        V-6's first clause, "a D* table present while gates.json records any
        of G1 to G4 as not passed", does not cover a D* table written while
        gates.json is absent. Its second clause covers only a D* computed
        before stage 6. Invalid run I1a (gates evaluated and held in memory,
        D* table written, gates.json written last) is therefore caught only by
        three things. First, the stage-order assertion, in conforming code.
        Second, reading the required artifact "gates.json (... written before
        any surface)" as part of protocol_success. Third, the purposive
        reading of V-6. The archived artifacts carry no order evidence: git
        keeps no mtimes, raw-result.json's block order is fixed by
        construction, and the manifest records only the run's start and end
        times.
      repair: >-
        Reword V-6 as "... while gates.json is absent or does not record every
        one of G1 to G4 as passed ...". Make the order checkable: have
        raw-result.json's gates block carry the sha256 of gates.json as
