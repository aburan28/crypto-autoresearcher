      joint: J7 (C4)
      severity: procedural; new in version 3. Non-breaking judged by substance (verified by this reviewer); breaking under a strict procedural reading of C4.
      location: spec baseline_rule.multi_match_rule (first sentence); input_rules IR-2 (version-3 sentences) and IR-2.why; audit c1_c8_discharge_table C4 row and read_attestation
      finding: >-
