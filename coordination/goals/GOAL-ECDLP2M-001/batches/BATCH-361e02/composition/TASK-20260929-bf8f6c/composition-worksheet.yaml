  j5_versus_contract:
    rule: >-
      CB-4. J5 values against the frozen audit sheet stage_0.koblitz_orders,
      stage_0.sample_table, the cells block of the specification, the certificate
      readings and stage_0.ideal_tree_table.gap_and_closure_both_ambients.
