      J5 reports eight choice points. Every adopted reading coincides with the
      contract's stated model: N = p, round half up, real L, M = 1 counting, a
      strict bound, and summing sample sizes before taking logs. The alternatives
      are recorded for localisation only and none was adopted. The only reading
      that changes a compared entry is the card's own S rule constant (the 548
      row above), which is a card-versus-contract model difference, not a J5
      choice. K-indeterminate is not triggered. Had the stricter reading been
      taken, the effect would be an added revise on C6 naming S(548), and the
      decision is revise regardless.
    reading: >-
      Two implementations that share nothing agree on every order,
      factorisation, admissibility flag, alphabet and gap entry. Under PD-R1 and
      PD-R5 J1's concurrence is informed. J5 is the structurally blind check, and
      it confirms the Stage 0 arithmetic and the repriced grid.

