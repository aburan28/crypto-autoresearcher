    - joint: J3
      owner: TASK-20260929-7d8385
      reviewer_verdict: breaks
      composed: breaks
      key: K-revise-defect
      breaking_artifacts_met:
        - artifact: a null that lands outside the null outcome
          finding: RT-O1
          composer_verification: >-
            Verified against the frozen bytes. Specification 376-386 defines F1 as
            the normal-basis Hamming weight of x in M quantile classes; CODE-FAM
            arms computes wb[popcount(NB.to_nb(x))] (audit 3271-3276);
            CODE-CORE make_h2 returns Tr(x(P)) + Tr(A) (audit 2077-2087), so
            h2 = Tr(x) on the a = 0 cells; specification 338-341 stratifies the
            shuffle for the F5 composites only. In a normal basis {b, b^2, ...,
            b^(2^(n-1))}, Tr(b^(2^i)) = Tr(b) = 1 for a normal element, so Tr(x)
            is the parity of x's normal-basis weight. On every parity-pure weight
            bucket F1 therefore determines h2 exactly. The contract's own DF-7
            (audit 1254-1268) states that an exact component alone satisfies L1
            and L3 "with no family content" and defines the family null as excess
            beyond the known bits. By the contract's own definition, a label with
            no content beyond h2 is a null of the family comparison, and it lands
            in LEAD. Raw aggregate checked (red-team computations.json 2175-2190):
            F1MODEL LEAD 7, RLFAM NEG 7, F1MARG (same weight marginal without the
            parity) NEG 7, F1STRAT (h2-stratified shuffle) NEG 6.
        - artifact: a LEAD branch unreachable by a planted filter at the stated floor
          finding: RT-O3
          composer_verification: >-
            Met in letter: 0 of 14 at the floor. Weight noted. The stated floor is
            the L1/L3 threshold itself (3 W; specification 356-357), so a filter
            planted exactly at it passes each cell's clause about half the time,
            and 0 of 14 is expected. The heavier evidence is elsewhere. A flat
            standardised excess at 2x and 4x the floor gave LEAD 4 of 14 and
            7 of 14. A constant raw excess above every floor gave 0 of 14. Growing
            key mixtures gave 13 to 14 of 14. Specification 358-361 confirms
            that L2 requires the second-smallest of ten per-seed Z-slopes to be at
            least 0 (a test of growth), and that one W per (cell, M)
            standardises every seed (common-mode error).
      breaking_artifacts_not_met: [a closed-form null allowance governing a maximum statistic, an SR-4 clause satisfied by occupancy alone (L2 held 0 of 7 for the random label), a stake or lead sentence as an outcome, an unlabelled per-orbit line]
