      - "CELL-Z2 (Z/2^17) PC-1 grid, gate rows at M = 2, 4 and 16 (fixed alphabets, not R-M quantities)"
      - "J5 rows with no contract counterpart: n = 5, 7, 9 and the K17C and RC1 R-M alphabets"
      - "the closure line (not a J5 quantity; J1 reproduces it to 5e-5 bit)"
