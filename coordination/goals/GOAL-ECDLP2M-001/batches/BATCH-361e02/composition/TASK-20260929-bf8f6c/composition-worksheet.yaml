      reading and rounding rule; Q4 0.01 bit per entry and 0.1 bit on totals
      after matching the contract's N reading and rounding rule; Q5 0.05 bit.
      Contract reading: N = l (largest prime divisor), r = floor(log2 N / p +
      1/2) (round half up), S = 2^ceil(log2(128 M^2)).
    rows:
      - {quantity: "Q1 admissible a = 0 degrees below 64", j5: "5 7 9 13 19 23 41", contract: "5 7 9 13 19 23 41", tolerance: exact, result: agree}
      - {quantity: "Q1 CELL-K13 order", j5: "8012 = 2^2 x 2003", contract: "8012 = 4 x 2003 admissible", tolerance: exact, result: agree}
      - {quantity: "Q1 CELL-K19 order", j5: "523492 = 2^2 x 130873", contract: "523492 = 4 x 130873 admissible", tolerance: exact, result: agree}
      - {quantity: "Q1 CELL-K23 order", j5: "8383412 = 2^2 x 2095853", contract: "8383412 = 4 x 2095853 admissible", tolerance: exact, result: agree}
      - {quantity: "Q1 CELL-K41 order", j5: "2199025563772 = 2^2 x 549756390943", contract: "2199025563772 = 4 x 549756390943 admissible", tolerance: exact, result: agree}
      - {quantity: "Q1 CELL-K17C order and divisor set", j5: "130972 = 2^2 x 137 x 239; 12 divisors incl 548 956", contract: "130972 = 4 x 137 x 239; full twelve-divisor set, [1 2 4 137] below 239", tolerance: exact, result: agree}
      - {quantity: "Q1 n = 29 and 31", j5: "4 x 8353 x 16067 and 4 x 373 x 1439393, inadmissible", contract: "same, INADMISSIBLE, not declared", tolerance: exact, result: agree}
      - {quantity: "Q2 CELL-O19 order", j5: "523646 = 2 x 261823 (t^19+t^5+t^2+t+1, A 46693, B 306147)", contract: "523646 = 2 x 261823, same curve", tolerance: exact, result: agree}
      - {quantity: "Q2 CELL-RC1 order", j5: "130412 = 2^2 x 32603 (t^17+t^3+1, A 97044, B 126251)", contract: "130412 = 4 x 32603, same curve", tolerance: exact, result: agree}
      - {quantity: "Q2 Z/lZ at l = 130873", j5: "l = 130873", contract: "CELL-Z-130873", tolerance: exact, result: agree}
      - {quantity: "Q3 log2 N / p and M under N = l", j5: "K13 3.6560 2.7420 -> 16 8; K19 5.6659 4.2495 -> 64 16; K23 6.9997 5.2498 -> 128 32; O19 5.9994 4.4996 -> 64 16; Z-130873 64 16; K41 13.0000 9.7500 -> 8192 1024", contract: "same values and alphabets (K41 at N^(1/3) and N^(1/4) priced and declined)", tolerance: exact, result: agree}
      - {quantity: "Q3 the #E reading (shown, not used)", j5: "K13 16 8; K19 64 32; K23 256 64; O19 64 32", contract: "same", tolerance: exact, result: agree}
      - {quantity: "Q3 near-boundary row", j5: "O19 N^(1/4) 4.4996, 4.4e-4 below the half", contract: "4.4996, 0.0004 below the half, recorded", tolerance: exact, result: agree}
      - {quantity: "Q4 S at every power-of-two M", j5: "S_pow2 = 2^ceil(log2(100 M^2)) = 2^(2r+7)", contract: "S = 2^ceil(log2(128 M^2)) = 2^(2r+7)", tolerance: 0.01 bit, result: "agree, 0 bit on every R-M row (K13 15 13; K19 19 15; K23 21 17; O19 19 15; Z-130873 19 15; K41 declined rows 33 27), and on M = 16 fixed-alphabet rows by M"}
      - {quantity: "Q4 floor 100 x M^2 at 548 and 956", j5: "log2 S_min 24.8399 and 26.4456", contract: "2^24.84 and 2^26.45 stated as the 100 x M^2 floor", tolerance: 0.01 bit, result: agree}
      - quantity: "Q4 S at 548"
        j5: "S_pow2 = 2^25 (ceil of 100 x M^2)"
        contract: "S = 2^26 (ceil of 128 x M^2 = 2^25.1961)"
        tolerance: 0.01 bit after matching the contract's rounding rule
        result: >-
          Not a disagreement between implementations. The one-bit difference is
          entirely the rule constant: the card's S_pow2 rounds 100 x M^2, while
          the contract's rule R-S rounds 128 x M^2. The plan applies the
          tolerance after the contract's rule is matched. J5's log2 S_min 24.8399
          plus log2 1.28 (0.3561) is 25.1960, which is the contract's own
          25.1961, whose ceiling is 26. Once the rule is matched the entries
          agree, and the contract's S is at or above J5's floor. At 956 both
          rules give 2^27.
      - {quantity: "Q4 totals", j5: "per-cell log2(S_min(M_1/3) + S_min(M_1/4)) over the two R-M rows", contract: "per-cell sum of declared S over every row including gate and fixed-M rows", tolerance: 0.1 bit, result: "not compared as a matched pair: the definitions differ. Composer reconciliation, not a blind comparison: J5 sums x 1.28 equal the contract's R-M portion (K13 40960, K19 557056, K23 2228224), and adding the gate and fixed-M rows gives the contract totals 43520, 559616, 2263552 exactly"}
