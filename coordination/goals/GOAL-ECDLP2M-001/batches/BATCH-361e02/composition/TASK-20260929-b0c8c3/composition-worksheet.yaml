          receipt's extracted_sha256. Both compile. stage0 passes its own S0
          (140 of 140, 10 of 10). Coded G1 equals the rule text conjunct by
          conjunct. G1 exercises I1 and I2 in the module Stage 2 imports under
          IR-6. I2 at a new distinguished point is specified and coded. AR-MU
          is binary-only. The F / -F reseed rule is coded. Seeds and generator
          agree. No instrument sits in or imports the shared index_calculus
          package. Every template field is present: status review_required,
          approved_by null, approval block naming DEC-20260929-1f5fcb,
          supersedes present. Version-1 files unedited. Zero runs.
        breaking_artifacts_present: none on the plan's J2 list as written
        defects_carried: >-
          J2-D1 (moderate): the procedure step 2 self-tests other than
          AR-FIELD and AR-ORDER (the I1 seeded system; I4 points and
          table/schoolbook agreement; oracle A against brute force) carry no
          stop, halt or invalidation consequence. The binary-cell instrument
          code (I3 to I5) is not committed and sits outside IR-6. An
          incomplete oracle A could drive both binary cells to LOW-COV and a
          declared NEGATIVE from an instrument defect. J2-D2 (low): comparator
          memory not printed at the m = 4 cap-slice and envelope upper ends.
          J2-D3 (negligible): wording at exactly 100000 attempts. O-J2-2: the
          "no numpy" instruction against the CERTBIN helpers. O-J2-3: "any
          prime-field object" wording (J4-D3).
        composer_note_on_J2_D1: >-
          The plan's J2 breaking item "a Stage 2 instrument ungated" is tied in
          the joint text to I1 and I2 (R-J2-5), which G1 gates. The composer
          applies the list as written and does not widen it after reading the
          report (CA-8). J2 holds. J2-D1 is still a pre-registration gap in
          the direction the program's rules forbid (an instrument failure
          could read as a declared negative). It is a mandatory item of the
          revision (R2-J2-1), and the next plan should put it on the J2
          breaking list explicitly.
        composed_disposition: holds
        key_applied: none triggered by this joint
      - joint: J3
        owner: TASK-20260929-594e8d
        reviewer_verdict: breaks
        breaking_artifact_matched: >-
          The plan's J3 item "a declared outcome no data can reach". IR-5
          (specification line 720) invalidates the RUN when per-target and
          shared units are summed into one figure. success_criterion (line
          730) and contract_label.RUN-ARTIFACT (line 781) list IR-5 as a
          run-wide invalidation. The gated observable AM3, and the reported
          FR_by_L, are defined on per_target_cost(L) = (shared_units + sum of
          the cell's per-target units) / L (lines 344 to 347; declared metric
          line 596). The committed binstd_core.ic_observables computes and
          emits that figure for every cell. H-BINSTD-7951d2 proof_obligations
          (line 404) repeat "never summed into one figure". Read as written,
          every run is RUN-ARTIFACT, and POSITIVE, NEGATIVE and NOT-VALIDATED
          are unreachable by any data. The falsification criterion, which
          routes through NEGATIVE, is therefore unreachable as well. The
          composer verified each cited clause against the frozen bytes.
        purposive_reading_ruling: >-
          The red team offers a purposive reading of IR-5, restoring version
          1's scope ("invalidates that fit") and carve-out, under which every
          declared outcome is reachable. The composer does not adopt it. The
          frozen text is unambiguous and run-wide. IR-5 is not coded (run_valid
          is an input to stage2_outcome), so an executor or a person would have
          to decide it. Choosing the reading that rescues approval after
          reading the reports would change an invalidation rule of a frozen
          protocol without a protocol_amendment, which a composition cannot do
          (CA-8; AGENTS.md prohibitions). The remedy is one clause, written
          into the contract, not an interpretation in this decision.
        what_holds: >-
          Everything else on J3, under the purposive reading, holds.
          (1) The text rules equal the coded classifiers on 200000 fuzzed
          inputs and on every axis combination. (2) Every declared outcome is
          reached by internally consistent reviewer patterns. (3) No gated
          observable is confined inside its band. (4) The no-reuse null
          separates on AM1, AM2 and AM3 and reads KR below 0.125 in every
          simulated run, depending on no unmeasured constant. (5) T_u and
          T_cmp are two-sided. (6) CTL-6 is wired into IR-10 and G1 (c).
          (7) A2 and A3 are restated at m = 2. (8) Predictions match their
          metrics as defined, including the unit for retries. (9) The modal
          label under the contract's own random model is POSITIVE (about 0.84
          in the reviewer's Monte Carlo). These are review computations on an
          abstract model, not observations.
        further_defects: >-
          J3-D2 (material): G1 fails in about 9 percent of runs in which the
          contract's own model holds. The cause is the control's KR band: at
          mu = 1/32 and B = 128 its sampling relative sd is about 12.9 percent
          against a band of about +-0.223 in log. The audit's most_likely
          basis is correct for the binary cells and wrong for the control.
          With seeds fixed, this is a prior over seed sets, not a property of
          the frozen seeds. J3-D3 (moderate): in the reuse arm, AM1 to AM3
          reduce to two scalars (rho_rel, a_bar). AM3 is dominated by AM1, and
          the L-dimension of "the FORM of the amortisation law" is not
          testable by the reuse arm as designed. J3-D4 (moderate): the
          obstruction H1 cites (KN-FIND-007 target coverage) lands in
          LOW-RETRY, which is referred to an instrument audit with no
          criterion and no outcome. J3-D5, J3-D6, J3-D7 (minor): the relation
          kept at mu about 1 depends on an unfixed return order; three
          producer patterns are not producible data; two CTL-6 conjuncts
          cannot fail.
        composed_disposition: breaks, on C5 (the validation pairing's decision table cannot reach any declared outcome other than RUN-ARTIFACT as written)
        key_applied: K-revise-defect
      - joint: J4
        owner: TASK-20260929-594e8d
