          deployed run are designed. PTM-A to PTM-C meet their signatures.
        defects_carried: >-
          J4-D1 (moderate): the TW-01 containment clause and its c-sensitivity
          are c = 1 statements. At the Bernstein-Lange constants the contract
          itself carries, the clause's justification fails over the committed
