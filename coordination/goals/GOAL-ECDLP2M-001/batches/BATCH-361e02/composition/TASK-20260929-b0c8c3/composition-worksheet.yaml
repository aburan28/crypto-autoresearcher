        composed_disposition: holds
        key_applied: none triggered by this joint
      - joint: J5
        owner: TASK-20260929-739a0c
        reviewer_verdict: inconclusive (by design; BL-5 forbids the reviewer's own comparison)
        composed_disposition: agrees with the contract's frozen figures within the agreement tolerance on every compared quantity (see j5_versus_contract)
        key_applied: K-indeterminate not triggered; the K-approve J5 condition is met
        k_infra_reading: >-
          The inconclusive attestation is the designed verdict, not a joint the
          reviewer could not run. Every Q0 to Q7 output was delivered
