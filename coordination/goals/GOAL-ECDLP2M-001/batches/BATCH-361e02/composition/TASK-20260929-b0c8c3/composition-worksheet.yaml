  joint_table:
    note: >-
      One row per joint. Every joint has exactly one owner and an attested
      verdict; none is unowned or unattested. Each disposition is this
      composer's reading of the owner's report against the plan's own
      breaking_artifact list. It is not a vote count (CA-3).
