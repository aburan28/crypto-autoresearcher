    coverage_of_declared_outcomes: >-
      H1-POSITIVE (P1), H1-NEGATIVE-COVERAGE (P2), H1-NEGATIVE-DEVIANT (P3,
      P5, P14), H1-MIXED (P4), H1-ARTIFACT (P7, P8), H1-INCOMPLETE (P12);
      H2-POSITIVE (P1), H2-NEGATIVE (P9), H2-MIXED (P10), H2-ARTIFACT (P13),
      H2-INCOMPLETE (P12); contract POSITIVE (P1), NEGATIVE (P2, P3, P5, P9,
      P14), NOT-VALIDATED (P4, P7, P8, P10, P12, P13), RUN-ARTIFACT (P6,
      P11). Every declared outcome has a reaching pattern.
    totality: >-
      The per-cell class is a total function of the test results (PASS if no
      test fails; else LOW-COV, LOW-RETRY, HIGH or SPLIT by the sides of the
      failing tests). The H1 axis is a total function of (validity flags,
      class pair): 1 + 8 + 1 + 15 = 25 class pairs over five classes, all
      assigned. The H2 axis is total over (validity flags, three pass bits).
      The contract label is total over the axis pair. So every reachable
      result lands in exactly one declared outcome.
    most_likely_pattern:
      pattern: P1
      assigned: POSITIVE
      basis: >-
        Under the contract's random model (H1 true on every cell, H2's
        Kuhn-Struik law) every band is at least three standard deviations of
        the model's own sampling spread: T_delta 3.3 sd (graph spread from the
        cited Monte Carlo), T_u 3 sd, T_a 3 sd, T_cmp 3.3 sd, and KR and FR at
        least four to five relative sd (derivation_notes D-4). Treating the
        tests as independent normals, a cell passes with probability about
        0.99 and the IC axis reads POSITIVE with probability about 0.98 (a
        normal-approximation design figure, not a result). For H2 the
        Kuhn-Struik model gives c(L) from 1.000 to 1.128 and exponent_rho
        -0.4805, inside both bands; the least robust H2 quantity is the
        L = 1 pooling constant (relative sd about 0.10 from 30 seeds against
        150 reference solves, by the Rayleigh ratio 0.52), whose excursion
        maps to H2-MIXED, a declared outcome. The binary cells' L up to 256
        exceeds N_G^(1/4), where the distinguished-point overhead may lift
        c(L) toward 1.3; that pattern maps to H2-MIXED or H2-NEGATIVE, both
        declared.

