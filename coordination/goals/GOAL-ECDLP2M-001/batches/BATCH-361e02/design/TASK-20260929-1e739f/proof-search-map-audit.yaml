  kn_tech_080_audits:
    audit_1_bottleneck_and_baseline_embedding:
      status: filled
      bottleneck: >-
        Whether an arity-m oracle at the cap locus has per-attempt cost C
        below sqrt(N_prime / B_cap) up to the disclosed constants. Every other
        quantity of the preprocessing row is model arithmetic. The question
        this row is built to inform is DEC-20260928-63addc S1
        decision_it_changes (whether the reachability table carries a second
        budget row and how m >= 4 oracle records are read against it); that
        is a Coordinator decision after the run, not a claim of this record.
      parameter_slices: >-
        (i) L = 1. The L = 1 slice of model M_m reproduces a single-target
        product law term by term, and WHICH law depends on the attempt
        convention (R-J1-2). At m = 4 on the sub-cap base log2 B = 29.036035
        the attempts are 1/mu = 2^19.44 in both the model (smooth A(mu)) and
        the D3 definition, so the slice reproduces the pinned D3 tie: with
        T_shared evaluated from the model terms, log2(IC(1)/rho_1) at
        C = 2^11.010251 is about 4e-7 bit (TASK-20260928-d5024b E04), and the
        L = 1 tie budget is 11.010251 up to about 1e-6 bit (TASK-20260928-a75ba7
        PTM-B). At m = 5 on B = B_cap(5), the model charges A(1) = 1.582
        attempts per relation while D3 charges one attempt per relation, so
        the slice reproduces the 1.58-attempt (proposal-convention)
        single-target law: its tie budget is D3(5) - log2 A(1) = 32.4142
        (to about 2e-5 bit of the frozen 32.414212), and at C = 2^D3(5) it
        reads IC(1)/rho_1 = 1.5239, that is 0.6077 bit above rho_1, not the
        tie. (ii) C = T_gen reproduces the generic frontier point:
        B_cap T_gen = P_gen, an algebraic identity (PTM-A). (iii) m = 23 with
        B = 524 known-log points is IDEA-20260926-178821's zero-relation row
        as the L = 1, S = 524 endpoint (cited by id; not re-derived).
      symbolic_check: >-
        CORRECTED (R-J1-2). log2(B_cap T_gen) - log2 P_gen = log2 B_cap +
        (log2 N_prime - log2 B_cap)/2 - (log2 N_prime + log2 B_cap)/2 = 0
        identically. The version-1 sentence "at g = 0 in each window the lower
        root is s = 1 because b = T_shared/rho = 1 by the definition of the
        budget" is withdrawn. At g = 0: in the m = 5 D3 convention
        b = 1.523877 and log2 L_lo = 1.2155 (TASK-20260928-d5024b E04; the
        version-1 step_8 hand figure 1.2158 agrees), because D3 charges one
        attempt per relation and M5 charges A(1); in the m = 5 proposal
        convention b = 1 up to 1.3e-8 bit and log2 L_lo = 0 (the tie); on the
        m = 4 sub-cap slice b - 1 = 2.8e-7 and log2 L_lo = 8.1e-7 bit (the
        tie, the residual being smooth attempts against 1/mu). stage0_code
        prints all four L = 1 quantities from the model terms, so each can
        fail (R-J1-3; design_figures l1_slices).
      frozen_fixture: >-
        fixture_code below (binstd_core.py): the Stage 1 gate G1 on CTRL-ZN,
        standard library only, runnable as committed, with its pass criterion
        stated before execution in its docstring, in fixture_pass_criterion
