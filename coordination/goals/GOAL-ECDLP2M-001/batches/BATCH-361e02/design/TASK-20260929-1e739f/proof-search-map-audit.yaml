  derivation_notes:
    D-1_m4_closed_forms: >-
      Upper edge. For small ab the upper root is L_hi about (1/a)^2 with
      a = A(mu) retry_4 C / rho_1. Above the cap mu grows (mu = 2^8.4 at
      log2 B = 35.996) and A(mu) tends to 1, so the upper edge tends to
      2 (log2 rho_1 - log2 retry_4 - log2 C) = 2 (60.809036 - 0.109768 -
      11.010251 - g) = 99.378 - 2g, against the cap value 2 (log2 rho_1 -
      log2 kappa_4 - log2 C) = 2 (60.809036 - 0.771496 - 11.010251 - g) =
      98.055 - 2g; the difference 2 log2 A(1) = 1.3235 bit is the version-1
      miss. Lower edge. With A(mu) about 1/mu below the cap, T_shared = K C /
      B^3 + 4 B^2 (K = 24 x 2^131) is minimised at B^5 = 3 K C / 8, so
      log2 B* = 29.036035 + g/5 and T_shared,min scales as C^(2/5); with
      b = 1 at g = 0 this gives b_min = 2^(0.4 g) and log2 L_lo about 0.8 g
      (0.00, 4.80, 8.00, 10.40, 11.20 at g = 0, 6, 10, 13, 14, at log2 B* =
      29.04, 30.24, 31.04, 31.64, 31.84), departing upward once B* nears the
      cap (16.05 at g = 20 and 29.29 at g = 30, TASK-20260928-d5024b E04).
      Cap slice upper end at log2 C = 11.010251: 2 (60.809036 - 0.771496 -
      11.010251) = 98.0546, printed 98.05.
    D-2_contiguity: >-
      Claim: at fixed C, the set of log2 B at which the M4 window is
      non-empty is an interval, and the union of the windows over it is one
      interval. Proof. Write t = ln B and mu = B^4 / K. Non-emptiness is
      4 a b < 1 with a b proportional to f(t) = C A^2 B + 4 A B^2 (A = A(mu),
      constant factors dropped). d ln A / d t = -4 mu / (e^mu - 1), which is
      increasing in t because mu / (e^mu - 1) is decreasing in mu and mu
      increases with t; so ln A is convex in t, and ln(A^2 B) = 2 ln A + t and
      ln(A B^2) = ln A + 2t are convex in t. Each term is log-convex, a sum of
      log-convex functions is log-convex, hence f is log-convex, so
      quasi-convex, and {t : f(t) < const} is an interval. On that interval
      L_lo(B) and L_hi(B) are continuous with L_lo < L_hi, so the set
      {(B, L) : L_lo(B) < L < L_hi(B)} is connected and its projection on L
      (the union) is an interval. Consequence: the continuum envelope is
      contiguous at every g below the closing g. The discrete 0.01-bit grid
      can only fail contiguity where adjacent windows fail to overlap; near
      the edge of the B-interval the window width grows like the square root
      of the distance to the edge while the centre moves linearly, so no
      gap is expected; stage0_code reports the grid flag and the minimum
      overlap, and a false flag with the continuum claim intact is a grid
      artefact to be reported, not a figure change.
    D-3_determined_law_m2: >-
      At m = 2 a relation is an edge (with signs) between its two leg columns;
      R = B relations give a random multigraph of mean degree c = 2R/B = 2. A
      column is determined iff its component contains an unbalanced cycle
      (sign product -1) or a coefficient-2 loop; tree components are touched
      but carry one free variable whatever the solver (TASK-20260928-a75ba7
      J3.collision reading_2). The giant component has fraction y = 1 -
      exp(-c y): iterating from 0.8 gives 0.7981, 0.79734, 0.797026, 0.796899,
      0.796847, 0.796826, converging to 0.796812; it contains unboundedly
      many cycles, each unbalanced with probability 1/2, so it is determined
      with probability tending to 1, while small components hold O(1)
      vertices in cycles; hence delta_inf = 0.796812 and u = delta_inf^2 =
      0.634909. A reviewer Monte Carlo of the abstract graph gives mean
      determined 0.7983 at B = 128 and 0.7970 at B = 512, with the 5th to 95th
      percentile of delta_hat^2 [0.5393, 0.7252] and [0.5892, 0.6826]
      (TASK-20260928-d5024b E05). The graph-level sd of delta_hat is then
      0.0356 at B = 128 and 0.0178 at B = 512 (half-width over 2 x 1.645),
      that is 0.403 / sqrt(B) at both sizes; the T_delta band is 3.3 sd.
      Touched values, diagnostics only: tau = 1 - e^-2 = 0.864665, touched
      usable tau^2 = 0.747645.
    D-4_attempts_knee_slopes: >-
      Attempts law (multi-decomposition acceptance): an attempt returns
      Poisson(mu) decompositions, each usable independently with probability
      u, so it succeeds with p = 1 - exp(-mu u). At mu = 1: e^-0.634909 =
      0.5488116 x 0.9656933 = 0.5299836, p = 0.4700164, a_2(1) = 2.127585;
      single-decomposition acceptance would give 1 / ((1 - e^-1) u) = 2.492,
      17 percent more, which T_a resolves (relative sd of a_bar about 2
      percent at 1365 targets). On CTRL-ZN mu = 2 x 128^2 / 1048583 =
      0.0312498 (N from TASK-20260928-d5024b E06); mu u = 0.0198408, p =
      0.0196452, a_2 = 50.903; A(mu) = 1 / 0.0307666 = 32.503. Knee:
      K_pred = B A(mu) / a_2 = B p / (1 - e^-mu): 128 x 0.0196452 / 0.0307666
      = 81.731 on CTRL-ZN; 512 x 0.4700164 / 0.6321206 = 380.70 on a nominal
      binary cell (B = 512, mu = 1). sigma_pred = LS slope of log2(K/L + 1)
      on log2 L: on CTRL-ZN over L = 1 to 1024 the ordinates are 6.370360,
      4.421750, 2.610616, 1.187166, 0.399730, 0.110784 (x = 0, 2, ..., 10,
      Sxx = 70, Sxy = -44.787), slope -0.6398; over L = 1, 4, 16, (2.610616 -
      6.370360) / 4 = -0.9399. Nominal binary: ordinates 8.576298, 6.587590,
      4.631905, 2.796682, 1.314473, 0.456044 give -0.8322; over 1, 4, 16,
      -0.9861. Sensitivity: on the six-cell grid a factor 2 in K moves the
      slope by about 0.06 to 0.08, so AM3 is sensitive mainly to L-dependence
      of the per-target cost. Sampling: relative sd of the mean attempts
      about 1.549 / 2.128 / sqrt(1365) = 2.0 percent on a binary cell;
      graph-level spread of u about 3.4 percent (from the 5 to 95 percent
      interval); relation attempts about 2.7 percent; so KR and FR carry a
      relative sd of about 4 to 5 percent and their 20 to 25 percent bands
      are four to five sd. Fixture expectations (J2-D8 recomputed): shared
      lookups 128 x 32.50 x 256 = 2^20.02; per target 50.90 x 256 = 2^13.67.
    D-5_null_expectation: >-
      The null solves each target by collecting fresh relations until both
      legs of its stored decomposition are determined. With edges added one
      at a time, P(both legs determined) is about y(2R/B)^2, so the expected
      number of relations is about (B/2) times the integral over c of
      (1 - y(c)^2): 1 up to c = 1, then about 0.675 (c from 1 to 2), 0.222
      (2 to 3), 0.105 (3 to 5) and 0.01 beyond, about 2.01 in all, that is
      about 1.0 B relations. So the null's per-target units are about the
      shared units, KR_null about 1/K_pred (0.012 on CTRL-ZN; 0.0026 nominal
      binary), FR_null about K_pred (82; 381), and over L = 1, 4, 16 with
      knee about 1 the fitted slope is (log2 1.0625 - log2 2) / 4, about
      -0.228, so d_sigma_null is about +0.71 (CTRL-ZN) and +0.76 (nominal
      binary). Order-of-magnitude design expectations, not criteria; the
      criterion is only that the null lies outside every AM band and reads
      KR below 0.125.
    D-6_memory: >-
      LA matrix m B_cap entries at 8 bytes: log2 = log2 m + log2 B_cap + 3.
      Krylov working vectors, three vectors of B_cap residues at 17 bytes:
      log2 = log2 51 + log2 B_cap = 5.672425 + log2 B_cap (39.5687, 33.2538,
      29.0877, 23.9598, 16.6256). Totals by lsum: m = 4: 39.568666 + log2(1 +
      2^-0.672425) = 39.568666 + 0.702633 = 40.2713; m = 5: 33.253803 +
      0.835391 = 34.0892; m = 6: 29.087734 + 0.956932 = 30.0447; m = 8:
      24.287401 + 0.845436 = 25.1328; m = 16: 17.953134 + 0.483804 = 18.4369.
      Comparator: at least 8 L_hi entries (walk between distinguished points
      at most one eighth of the per-target walk rho_1 / sqrt(L), so entries
      stored >= rho_1 sqrt(L) x 8 sqrt(L) / rho_1 = 8 L) at 34 bytes: log2
      entries = 3 + log2 L_hi, log2 bytes = log2 entries + 5.087463.
    D-7_m5_g2: >-
      D3 convention, x = 35.075936: b = 2^(x - 32.565930) + 0.099827 =
      5.69623 + 0.09983 = 5.79606, log2 L_lo = 2 log2 b = 5.0701 (4ab about
      7e-7); log2 L_hi = 2 (log2 rho_1 - log2 kappa_5 - x) = 2 x 25.0219 =
      50.0439. Proposal convention, x = 34.414212: b = 2^1.848282 + 0.099827
      = 3.60070 + 0.09983 = 3.70053, log2 L_lo = 3.7755; log2 L_hi = 2 x
      25.683664 = 51.3673. At C = 2^D3(5), b = 1.523877 (TASK-20260928-d5024b
      E04) and IC(1)/rho_1 = b + a with a about 7e-9, so log2 = 0.6077.
    D-8_kuhn_struik: >-
      Kuhn-Struik Theorem 1 (retrieved via TASK-20260928-a75ba7): E_L about
      sqrt(pi N / 2) sum over t < L of C(2t, t) / 4^t, for L << N^(1/4). The
      sum equals 2 L C(2L, L) / 4^L (checked at L = 1, 2, 4). c(L) = E_L /
      (sqrt(L) E_1): L = 4: 2.1875 / 2 = 1.09375; L = 16: 32 x 601080390 /
      4294967296 / 4 = 1.11960; L = 64: 128 x C(128, 64) / 4^64 / 8 = 1.12618;
      L = 256: 1.12783; limit 2 / sqrt(pi) = 1.12838. Model exponent_rho =
      -0.5 + LS slope of log2 c(L) = -0.5 + 0.01946 = -0.4805. The range
      condition L << N^(1/4) is violated at the toy L beyond about 20 to 30;
      the model value is a design expectation, not a claim.
    D-9_admissible_ranges: >-
      KR: per-target units are at least one attempt (w units), so K_hat =
      shared / mean <= shared / w = relation attempts, and KR <= relation
      attempts / K_pred = a_pred x rho_rel; K_hat > 0. FR: mean per-target
      units lie in [w, MAX_ATTEMPTS w]. d_sigma: the fit uses every declared
      L cell with no selection; with per-L means free, log2 cost(L) is free
      above log2(S/L + w), so the slope is unbounded; for constant per-target
      cost p, log2(S/L + p) has slope in (-1, 0) on any grid. exponent_rho:
      log2(mean total / L) = log2 c(L) + log2 W1 - 0.5 log2 L, an identity, so
      exponent_rho = -0.5 + slope(log2 c); with log2 c in [-1, 1] and LS
      weights (x - 4)/40 on x = 0, 2, 4, 6, 8 (sum of |w| = 0.3) the slope of
      log2 c lies in [-0.3, 0.3]; with log2 c in [log2 0.8, log2 1.3] =
      [-0.3219, 0.3785] it lies in [-0.105, 0.105]. KR x FR = (shared / mean /
      K_pred) (mean / (a_pred w)) = relation attempts / (B A(mu)) = rho_rel.
    D-10_pattern_classification: >-
      Hand classification of the synthetic patterns with the coded bands.
      P1: every test at its prediction, T_u residual about 0, T_a difference
      0, T_cmp difference 0: PASS on all cells; G1 passes (null outside all
      AM bands, KR 0.012 and 0.0026 below 0.125; pools give exponent -0.4805,
      all c(L) in [0.8, 1.3]). P2 (B = 512, n_dec = round(1365 x 3.40) =
      4641): T_delta band [0.7380, 0.8556], 0.70 low; T_u residual 0.40 -
      0.49 = -0.09 against 0.0220, low; T_a p = 1 - e^-0.4 = 0.32968, 1/p =
      3.0333, difference +0.367 against 0.2017, low; KR 0.66 low; FR 1.60 low;
      d_sigma +0.13 low; T_cmp difference -0.235 against 0.2093, low: LOW-COV.
      P3: T_delta 0.88 high; T_u residual 0; T_a at its conditional value;
      KR 1.147 and FR 0.872 inside; T_cmp difference +0.139 against about
      0.218, pass: HIGH. P5: T_delta low; T_u residual 0.49 - 0.49 = 0; T_a
      1/p = 2.5815 against a_bar 1.2, high; T_cmp difference -0.145 against
      about 0.211, pass: SPLIT. P6: CTRL-ZN T_u residual 0.55 - 0.635209 =
      -0.085 against 0.0289, low: LOW-COV, so G1 fails. P9: exponent from the
      pools -0.5 + 0.1206 = -0.379 outside [-0.6, -0.4], pools above 1.3, all
      inside [0.5, 2]: H2 fails on both binary cells. P10: pool 1.35 above
      1.3 on BIN-KOB-19 only. P13: pool 2.3 outside [0.5, 2]: IR-3b. P14:
      coverage tests pass (T_cmp variance with n_dec about 1.1e6 is the graph
      term only; difference 0); T_a, KR, FR, d_sigma all low: LOW-RETRY.

