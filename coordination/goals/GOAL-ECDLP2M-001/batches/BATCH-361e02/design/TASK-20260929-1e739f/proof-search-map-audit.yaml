        instrument code (I1, I2, the IC arms, the gates, the classifier) that
        the Stage 2 driver imports unchanged, so the gate tests the
        instruments Stage 2 reads (R-J2-5). Not a plan: code.
    audit_2_observation_collision:
      status: filled
      observable: >-
        Version 2 retires the knee-rule exponent (confined to [-1.0805,
        -0.9195] on the designed knee cells for any data; DEC-20260928-cec92e
        R-J2-1). The amortisation observables are the knee ratio KR, the
        flattening ratio FR, and the fitted exponent over ALL L cells against
        its model value (d_sigma), plus the H1 tests (T_delta on the
        determined fraction, T_u on leg uniformity, T_a on attempts, T_cmp
        against the control). Definitions in EXP-BINSTD-517186
        definitions.observables_and_tests.
      collision_found: >-
        YES, and version 2 separates each preimage on a gated observable.
        (O1) genuine reuse of the stored logarithm vector: KR about 1, FR
        about 1, d_sigma about 0 (design figures, derivation_notes D-4).
        (O2) over-complete relation set (R = 4B): delta_hat about 0.9993,
        above the T_delta band and above the 0.95 CTL-6 threshold, so IR-10
        invalidates the cell (ARTIFACT, nothing read); version 1 let it read
        POSITIVE once the control's band was met. (O3) no-reuse null (fixed
        setup plus an independent per-target solve, identical accounting):
        run as the CTL-8 null arm on CTRL-ZN and BIN-ORD-19. Design
        expectation KR about 1/K_pred (about 0.012 on CTRL-ZN, 0.0026 on a
        nominal binary cell), FR about K_pred (about 82 and 381), d_sigma
        about +0.71 and +0.76 (derivation_notes D-5); it must fail all three
        amortisation gates and read KR below 0.125, else IR-9 invalidates
        the IC reading. Version 1's O3 passed both exponent bands (-0.970).
        (O4) coverage-limited reuse (legs concentrated on undetermined
        columns): T_delta or T_u or T_cmp fail low, FR high, KR low: per-cell
        class LOW-COV, and LOW-COV on both binary cells is the NEGATIVE
        outcome H1-NEGATIVE-COVERAGE. (O5) the no-reuse null fed as if it
        were the reuse arm (PTM-D counterfactual): coverage tests pass, T_a
        and all AM gates fail low: class LOW-RETRY, reaching
        H1-NEGATIVE-DEVIANT, never POSITIVE.
      separating_conditions: >-
        KR, FR and d_sigma with pre-registered two-sided bands; the CTL-8
        null arm wired into IR-9 (and into G1 on CTRL-ZN); CTL-6 wired into
        IR-10; the two-sided T_cmp against the control; CERT-LOG, which
        certifies the stored vector exists; setup operations kept out of
        shared_units by the accounting identity (IR-10).
    audit_3_quantifier_order:
      status: filled
      statement: >-
        FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at base
        size B, under A1 to A6 and H1: IC(L) = T_shared(B, C) + L
        per_target(B, C), and at B = B_cap the leading-order precomputation
        equals P_gen at C = T_gen. FOR ALL g below the critical value THERE
        EXISTS a non-empty window of L on which IC(L) < c rho_1 sqrt(L) holds
        under H2 with c = 1. NOT CLAIMED: that any oracle has C at or below
        any budget; that any point lies below the generic frontier.
      witness_dependence: >-
        The window endpoints depend on m, g, the base size B AND the generic
        multi-target constant c (the version-1 statement omitted c; a75ba7
        proof_architecture_challenges): log2 L_hi moves by +2 log2 c, +0.35
        bit at Kuhn-Struik's 2/sqrt(pi) and +2.20 to +2.48 bits at the
        Bernstein-Lange L-target constants 2.15 to 2.36, so c = 1 is the
        narrowest window. At m = 5 the contract fixes B = B_cap(5) and
        states the m = 5 window as a B = B_cap statement; no m = 5 envelope
        over B is computed or promised (R-J1-4). At m = 4 the envelope is over
        the ONE committed range log2 B in [29.036035, 35.996035] (R-J1-1). The
        toy observables depend on the cell's measured B_c and mu_c and on the
        seed stream; they are normalised so that the predicted value is the
        same on every cell (1, 1, 0, delta_inf, 0, 1), and the per-cell
        prediction formulas are one function of (B_c, mu_c).
      failure_mode_checked: >-
        A witness depending on the target set (leakage between L cells) is
        excluded by disjoint fresh targets with recorded seed labels; the null
        arm's targets (t = 1365 to 1385) are disjoint from the reuse arm's
        (t = 0 to 1364).
    audit_4_method_ceiling_and_nearby_object_control:
      status: filled
      ceiling: >-
        The strongest certifiable claim (H-BINSTD-7951d2
        proof_search_map.method_ceiling): a frontier column with its
        conventions, the pinned D3 column, the m = 5 window at B = B_cap(5),
        the m = 4 slices and envelope on one range, and a toy validation at
        m = 2 of the FORM of the amortisation law under H1 and of the pooled
        law under H2 on two binary n = 19 cells and a relabelled Z/NZ
        control. It never certifies C at n = 131 for any oracle, never a
        window at deployed L, and never a point below the frontier.
      nearby_objects: >-
        The relabelled Z/NZ group (N the least prime above 2^20, base 2^7,
        mu about 1/32) with the enumeration oracle, where the random model of
        H1 holds by construction (Stage 1 gate); the ordinary against the
        Koblitz n = 19 cell (no Frobenius is used; CTL-2 is wired into the
        outcome table as H1-MIXED and H2-MIXED); the no-reuse null (CTL-8,
        PTM-D); PTM-A (C = T_gen reads on the frontier with zero relaxation);
        PTM-B (the L = 1 slices, now evaluated from the model terms); PTM-C
        (the m = 5 window empty at g = 14; identical normalised predictions
        on all three cells).
      closed_form_cross_check: >-
        With a = kappa_m C / rho_1 and b about A(1) B_cap C / rho_1, 4ab = 1
        gives C_crit = T_gen sqrt(pi / (8 A(1) kappa_m)), so g_crit =
        (T_gen - c0) + (1/2) log2(pi / (8 A(1) kappa_m)) less a small LA
        correction: 12.256 at m = 5 (D3 convention) and log2 C_crit = 42.144
        at the m = 4 cap slice (exact quadratic 42.138; TASK-20260928-d5024b
        E04). stage0_code computes both routes; a disagreement above 0.05 is a
        defect in one of them (self-check).
    strictness_obligation:
      status: not_applicable
      not_applicable_reason: >-
        No strict improvement over any baseline is claimed. The proposal's
        clause that an oracle below T_gen would be the first ECDLP algorithm
        below the S T^2 = N_prime line is tripwire TW-01 and is excluded from
        every outcome, prediction and success criterion
        (EXP-BINSTD-517186 outcome_table.never_an_outcome and
