    interface_obligations:
      status: filled
      items:
        - The lift from L = 1 to L targets (boundary_lift) is exact under A1 to A6; which single-target law the L = 1 slice reproduces is stated per convention (audit_1 parameter_slices).
        - The projection interface pi_G from base points to subgroup classes may merge columns; the merge count is reported; columns are classes, never points.
        - >-
          UNIT INTERFACE, corrected (R-J1-6). At deployed parameters T_shared
          adds B A(mu) C, in group-operation equivalents, to m B^2 modular
          multiply-adds at an assumed one-to-one rate. This is a MODEL
          ASSUMPTION (A6 of H-BINSTD-7951d2), inherited from the pinned
          product law and the D3 column, so the comparisons are internally
          consistent; it is not a measured rate. On the toy cells no unit is
          crossed: oracle work units, group operations and la_ops are separate
          columns and every gated observable is a ratio of oracle work units.
        - "The ambient interface: decomposition counts in the full group (N = 4r on ECC2K-130; #E = 2q and 4l on the binary toys; N on CTRL-ZN); targets in the prime-order subgroup; rho on N_prime at deployed parameters and on the subgroup order on the toys."
        - >-
          The comparator interface: the windows use c rho_1 sqrt(L) with
          c = 1 (H2 (i)); the frontier column uses S T^2 = N_prime in 129-bit
          words at N_prime = r/262 (H2 (ii)); the conventions travel with the
