        znv = p["zn"]
        zc = _cell(znv, None, p.get("zn_pools", KS_POOLS), p.get("zn_null", NULL_ZN))
        g1 = (zc["reuse"]["phi"] == "PASS" and zc["null"]["discriminates"] and zc["ctl6"]["ok"]
              and RHO_EXP_BAND[0] <= zc["rho"]["exponent_rho"] <= RHO_EXP_BAND[1]
              and zc["rho"]["instrument_ok"] and p.get("certificates", True))
        res = {"G1": g1, "zn_phi": zc["reuse"]["phi"]}
        if not g1:
            res["contract"] = "RUN-ARTIFACT"
            return res
        cells = {ORD_CELL: _cell(p["ord"], znv, p.get("ord_pools", KS_POOLS),
                                 p.get("ord_null", NULL_BIN), p.get("ord_ctl6", True)),
                 KOB_CELL: None if p.get("kob_halted") else _cell(p["kob"], znv, p.get("kob_pools", KS_POOLS),
                                                                  None, p.get("kob_ctl6", True))}
        res["phi"] = {k: (None if v is None else v["reuse"]["phi"]) for k, v in cells.items()}
        res.update(stage2_outcome({"rho": zc["rho"]}, cells, p.get("run_valid", True),
                                  {KOB_CELL: bool(p.get("kob_halted"))}))
        return res


    def stage1(path):
        N = least_prime_above(1 << 20)
        G = RelabelledZN(N)
        oracle = ZNOracle(G)
        z = run_cell(G, oracle, ZN_CELL, with_null=True)
        z["N"] = N
        z["base_reseeds"] = oracle.reseeds
        z["G1"] = g1_checks(z)
        z["G1_pass"] = all(z["G1"].values())
        with open(path, "w") as fh:
            json.dump(z, fh, indent=1, default=str)
        nobs = z["null"]["observables"]
        print(json.dumps({"N": N, "phi": z["reuse"]["phi"], "tests": z["reuse"]["tests"],
                          "values": z["reuse"]["values"],
                          "null": {"KR": nobs["KR"], "FR": nobs["FR"], "d_sigma": nobs["d_sigma"]},
                          "exponent_rho": z["rho"]["exponent_rho"],
                          "pooling": {L: v["pooling_constant"] for L, v in z["rho"]["per_L"].items()},
                          "G1": z["G1"], "G1_pass": z["G1_pass"]}, indent=1))
        return 0 if z["G1_pass"] else 1


