  admissible_ranges:
    rule: >-
      For every gated observable, the set of values it can take for ARBITRARY
      data under the contract's admission and fit rules, beside its pass
      band. None is confined inside its pass band; each can fail on both
      sides unless noted. Derivations in derivation_notes D-9.
    items:
      - observable: AM1 knee ratio KR = (shared_units / mean per-target units) / K_pred
        admissible: "(0, a_pred x rho_rel], rho_rel = relation attempts / (B A(mu)); design about (0, 2.13] on a binary cell and (0, 50.9] on CTRL-ZN"
        pass_band: "[0.8, 1.25]"
        can_fail: both sides
      - observable: AM2 flattening ratio FR = mean per-target units / (a_pred x units per attempt)
        admissible: "[1 / a_pred, MAX_ATTEMPTS / a_pred]; about [0.47, 47000] on a binary cell, [0.0196, 1965] on CTRL-ZN"
        pass_band: "[0.8, 1.25]"
        can_fail: both sides
      - observable: AM3 d_sigma = fitted slope over ALL L cells minus sigma_pred
        admissible: >-
          unbounded in both directions for arbitrary per-L means (no admission
          rule selects cells); for per-target cost constant in L the fitted
          slope lies in (-1, 0) and sigma_pred in (-1, 0), so d_sigma lies in
          (-1 - sigma_pred, -sigma_pred): about (-0.17, +0.83) on a nominal
          binary cell and (-0.36, +0.64) on CTRL-ZN
        pass_band: "[-0.10, +0.10]"
        can_fail: both sides
      - observable: T_delta delta_hat = determined columns / B_c
        admissible: "[0, 0.95) (IR-10 above 0.95; delta_hat <= touched fraction <= 1)"
        pass_band: "delta_inf +/- 3.3 x 0.403 / sqrt(B_c): [0.679, 0.914] at B = 128; [0.738, 0.856] at B = 512"
        can_fail: both sides
      - observable: T_u u_hat - delta_hat^2
        admissible: "[-delta_hat^2, 1 - delta_hat^2]"
        pass_band: "+/- 3 sqrt(delta_hat^2 (1 - delta_hat^2) / n_dec)"
        can_fail: both sides
      - observable: T_a a_bar - 1/p (attempts)
        admissible: "[1 - 1/p, MAX_ATTEMPTS - 1/p]"
        pass_band: "+/- 3 sqrt(1 - p) / p / sqrt(n_t)"
        can_fail: both sides
      - observable: T_cmp u_hat(binary) - u_hat(CTRL-ZN)
        admissible: "[-1, 1]"
        pass_band: "+/- 3.3 sqrt(var_c + var_ZN)"
        can_fail: both sides
      - observable: null arm (CTL-8) must lie OUTSIDE the AM1, AM2 and AM3 bands and read KR below 0.125
        admissible: as for AM1 to AM3 (the null is fed to the same functions)
        pass_band: n/a (IR-9 fires if the null lands inside any AM band)
        can_fail: IR-9 is reachable (P7)
      - observable: pooling constant c(L)
        admissible: "(0, infinity); a value outside [0.5, 2] invalidates the rho reading (IR-3 on CTRL-ZN via G1; IR-3b on a binary cell)"
        pass_band: "[0.8, 1.3] (H2)"
        can_fail: both sides inside the instrument band
      - observable: exponent_rho
        admissible: >-
          by the identity exponent_rho = -0.5 + LS slope of log2 c(L) on
          log2 L, and c(L) in [0.5, 2]: [-0.8, -0.2]. DISCLOSED LINK: if every
          c(L) lies in [0.8, 1.3], exponent_rho lies in [-0.605, -0.395], so
          given the pooling band the exponent band [-0.6, -0.4] adds only the
          two slivers; the exponent is kept because S1 names it and it can
          fail on data that also fail the pooling band.
        pass_band: "[-0.6, -0.4]"
        can_fail: both sides
      - observable: link between AM1 and AM2
        admissible: "KR x FR = rho_rel exactly (an identity), so AM1 adds the relation-phase attempt law A(mu) to AM2"
        pass_band: n/a
        can_fail: n/a (disclosed identity)

