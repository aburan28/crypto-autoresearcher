  sources_retrieved:
    rule: >-
      R-SRC. The version-1 red team (TASK-20260928-a75ba7) retrieved these
      sources on 2026-09-29; URLs and digests are copied from its
      computations.json retrieval block. This producer did not re-fetch them
      (it held no retrieval tool call in this session) and cites them with
      provenance retrieved, verified_by TASK-20260928-a75ba7. The PDFs sit
      outside the repository (open_issues OI-2). Text extraction lost some
      glyphs (epsilon, Omega, the tilde, <<); reconstructions are marked in
      that report.
    items:
      - id: SRC-CGK
        document: Corrigan-Gibbs and Kogan, The Discrete-Logarithm Problem with Preprocessing, IACR ePrint 2017/1113 (EUROCRYPT 2018), PDF dated August 3, 2021
        urls: ["https://eprint.iacr.org/2017/1113", "https://eprint.iacr.org/2017/1113.pdf"]
        pdf_sha256: f9550f7d9a0701e17bc2fe2c9faea7e1fed546f572d307f8e1adc6994f75de08
        extracted_text_sha256: 3ce82591487ad9295b5a1fa3eaa0eda6bc34e4c64c4cfadee8373122073c2aa9
        provenance: retrieved
        verified_by: TASK-20260928-a75ba7
        statements_used: >-
          Theorem 2: a generic algorithm with an S-bit advice string and at
          most T online queries succeeding with probability epsilon in a group
          of prime order N satisfies S T^2 = Omega-tilde(epsilon N), the tilde
          hiding logarithmic factors in N; composite order: the largest prime
          factor p replaces N. Theorem 10: preprocessing time P and online
          time T satisfy P T + T^2 = Omega(epsilon N) (operator glyph
          reconstructed). Section 7.1: the matching construction stores S
          group elements with their logarithms in O(S log N) bits. Section 2:
          an inversion oracle changes running time by at most a log factor.
      - id: SRC-KS
        document: Kuhn and Struik, Random Walks Revisited, SAC 2001, LNCS 2259, pp. 212-229
        urls: ["https://ac.informatik.uni-freiburg.de/publications/publications/sac01.pdf"]
        pdf_sha256: 369ff4cfe50ae108cc514862cbf307c53354742780f2a7fe2fa175e3c6d73fe4
        second_copy_sha256: 7448759e4d1a2d9d502af0d76dab2703d3b55987998ab0c0483458230ca34408
        extracted_text_sha256: 094519e3d64c8683347636af6b38c669c1dc2c107031b4d8400a004a37599efe
        provenance: retrieved
        verified_by: TASK-20260928-a75ba7
        statements_used: >-
          Theorem 1: E_L about sqrt(pi N / 2) sum over t < L of C(2t, t)/4^t
          for L << N^(1/4) (relation glyph reconstructed from the proof step),
          approximately sqrt(2 L N) = (2/sqrt(pi)) sqrt(L) sqrt(pi N / 2), a
          multi-target constant 1.128 relative to the single-target mean.
      - id: SRC-BL
        document: Bernstein and Lange, Computing small discrete logarithms faster, IACR ePrint 2012/458 (INDOCRYPT 2012)
        urls: ["https://eprint.iacr.org/2012/458", "https://eprint.iacr.org/2012/458.pdf"]
        pdf_sha256: 204d47c34c410b594d2212370dde79e97883b9fdcb5a8b8ab6880a228d26d3b7
        extracted_text_sha256: 34345d6fd63532385ab45982c304dd6d796cfc2123e6597a0440d0107126c4eb
        provenance: retrieved
        verified_by: TASK-20260928-a75ba7
        statements_used: >-
          Abstract: in a group of order l, 1.77 l^(1/3) multiplications on
          average with a table of l^(1/3) entries precomputed with
          1.24 l^(2/3); Table 4.1: 15 measured (precomputation, main)
          constants at l about 2^48 with T up to 1024 entries; restatement of
          Kuhn-Struik's range "only for L << l^(1/4)". The L-target constants
          2.15 to 2.36 used for the sensitivity are the red team's arithmetic
          on these points, not a statement of the paper.
      - id: SRC-YUN
        document: Yun, Generic Hardness of the Multiple Discrete Logarithm Problem, IACR ePrint 2014/637 (EUROCRYPT 2015)
        urls: ["https://eprint.iacr.org/2014/637"]
        provenance: retrieved (abstract page only); the M = o(N) range relayed through the CGK text
        verified_by: TASK-20260928-a75ba7
        statements_used: the generic multi-instance lower bound of order sqrt(M N), as a pointer for the sqrt(L) form above N^(1/4); not load-bearing.

