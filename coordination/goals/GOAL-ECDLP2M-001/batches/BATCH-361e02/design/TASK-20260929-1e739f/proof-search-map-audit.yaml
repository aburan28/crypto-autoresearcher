  tripwire_preregistration:
    id: TW-01 (DEC-20260928-63addc C3; plan TA-1)
    text: >-
      The clause of IDEA-20260926-20ba8f claim (C) that an oracle with C below
      T_gen would be the first ECDLP algorithm below the S T^2 = N_prime line
      is not an outcome, a prediction or a success criterion of
      H-BINSTD-7951d2, EXP-BINSTD-517186 or this sheet. By the closed form in
      audit_4, every non-empty crossing window is a conditional whose
      antecedent lies 1.34 to 1.40 bits under the T_gen column value at
      B = B_cap (1.01 bit over all m = 4 bases; TASK-20260928-a75ba7), so the
      windows are the first-below-the-line clause restated in multi-target
      form. Therefore any reading that plugs a measured per-attempt cost into
      a window figure is a TW-01 reading, pre-registered to
      review-breakthrough at max in its own round, never in this one. The
      producer's reading, stated so it cannot drift: an oracle at exactly
      C = T_gen is ON the frontier within the disclosed constants in the
      Bernstein-Lange convention, and no oracle is known to this program at
      any C below any budget.

