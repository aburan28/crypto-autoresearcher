        a = A(mu) retry_m C / rho_1; b = (B A(mu) C + m B^2) / rho_1."""
        mu = 2.0 ** (m * xB - LOG2(math.factorial(m)) - N_BITS)
        A = attempts(mu)
        la = LOG2(A * retry(m)) + x - log2_rho
        lb = lsum(xB + LOG2(A) + x, LOG2(m) + 2.0 * xB) - log2_rho
