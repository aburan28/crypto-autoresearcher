    def h1_axis(phi, halted, ic_invalid):
        if ic_invalid:
            return "H1-ARTIFACT"
        if halted.get(ORD_CELL) or halted.get(KOB_CELL):
            return "H1-INCOMPLETE"
        a, b = phi[ORD_CELL], phi[KOB_CELL]
        if a == "PASS" and b == "PASS":
            return "H1-POSITIVE"
        if a == "PASS" or b == "PASS":
            return "H1-MIXED"
        if a == "LOW-COV" and b == "LOW-COV":
            return "H1-NEGATIVE-COVERAGE"
        return "H1-NEGATIVE-DEVIANT"


    def h2_axis(h2, halted, rho_invalid):
        if rho_invalid:
            return "H2-ARTIFACT"
        if halted.get(ORD_CELL) or halted.get(KOB_CELL):
            return "H2-INCOMPLETE"
        if h2[ZN_CELL] and h2[ORD_CELL] and h2[KOB_CELL]:
            return "H2-POSITIVE"
        if not h2[ORD_CELL] and not h2[KOB_CELL]:
            return "H2-NEGATIVE"
        return "H2-MIXED"


    def contract_outcome(run_valid, h1, h2):
        if not run_valid:
            return "RUN-ARTIFACT"
        if h1 == "H1-POSITIVE" and h2 == "H2-POSITIVE":
            return "POSITIVE"
        if h1.startswith("H1-NEGATIVE") or h2 == "H2-NEGATIVE":
            return "NEGATIVE"
        return "NOT-VALIDATED"


    def stage2_outcome(zn, cells, run_valid, halted):
        """zn: the Stage 1 CTRL-ZN result (only zn['rho']['h2_pass'] is read);
        cells: {ORD_CELL: result or None, KOB_CELL: result or None}; run_valid is
        False when S0 stopped the run, G1 failed, or IR-1, IR-2, IR-5, IR-6 or
        IR-7 fired; halted marks cells halted by S3, S5, IR-4 or IR-8."""
        halted = dict(halted)
        for name, c in cells.items():
            if c is None:
                halted[name] = True
        phi, h2 = {}, {ZN_CELL: zn["rho"]["h2_pass"]}
        ic_invalid = rho_invalid = False
        for name, c in cells.items():
            if halted.get(name):
                continue
            phi[name] = c["reuse"]["phi"]
            h2[name] = c["rho"]["h2_pass"]
            ic_invalid = ic_invalid or not c["ctl6"]["ok"]
            if name == ORD_CELL:
                ic_invalid = ic_invalid or ("null" not in c) or not c["null"]["discriminates"]
            rho_invalid = rho_invalid or not c["rho"]["instrument_ok"]
        h1a = h1_axis(phi, halted, ic_invalid)
        h2a = h2_axis(h2, halted, rho_invalid)
        return {"H1": h1a, "H2": h2a, "contract": contract_outcome(run_valid, h1a, h2a)}


