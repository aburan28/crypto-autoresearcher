        """CODE-GATE, stage1_gate.py, of EXP-BINSTD-6f1e66: the declared cells;
        cell setup and admission (AR-B1 for the prime-l Koblitz cells, AR-B1-C for
        the composite cell, AR-O for the ordinary cells, R-6); the Stage 1 gate of
        every cell (PC-2, PC-3, PC-4, PC-4b, PC-6a, PC-6b and the PC-9 curve
        readings, seeds 0 to 9 enumerated, R-10); and the run-level controls PC-1
        (the exact low-bits grid on Z/2^17, R-5), PC-5 (the composite cell at 548
        and 956, R-3), PC-7, PC-7c and PC-16 with the measured resolving floor
        (the Z/lZ object with the log-interval key, R-7), and PC-9 (exhaustive and
        index-sampled references, R-7). Pass criteria are stated in the audit
        sheet above this code and placed in SR-1 of the specification.

        RUN ORDER (procedure S1-0 to S1-7): certificate.certificate_controls,
        pc1_exact_grid, setup_cell for every declared cell, pc5_composite,
        z_ladder, the calibration rows, then gate_cell, check_gate and (where
        declared) pc9_cell per admitted cell. No Koblitz-specific arm is read on
        any cell before all of these pass (PC-10, IR-14).

        Committed by TASK-20260929-291567. NOT RUN by the design task. Pure
        Python 3, standard library only.
        """
        import math
        import random
        from array import array

        import binstd_core as core
        import certificate
        import estimator as est

        INF = core.INF
        T19 = (1 << 19) | (1 << 5) | (1 << 2) | (1 << 1) | 1
        T17 = (1 << 17) | (1 << 3) | 1

        # Design-time inputs; each is checked at setup and a disagreement halts the
        # cell (IR-8, IR-9). CELL-O19 and CELL-RC1 are the IDEA-20260926-d06324
        # cells.
        CELLS = {
            "CELL-K13": {"n": 13, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 8012, "fac": {2: 2, 2003: 1}},
            "CELL-K19": {"n": 19, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": T19, "order": 523492, "fac": {2: 2, 130873: 1}},
            "CELL-K23": {"n": 23, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 8383412, "fac": {2: 2, 2095853: 1}},
            "CELL-K41": {"n": 41, "A": 0, "B": 1, "kind": "koblitz_prime_l",
                         "poly": None, "order": 2199025563772,
                         "fac": {2: 2, 549756390943: 1}},
            "CELL-K17C": {"n": 17, "A": 0, "B": 1, "kind": "koblitz_composite",
                          "poly": T17, "order": 130972, "fac": {2: 2, 137: 1, 239: 1}},
            "CELL-O19": {"n": 19, "A": 46693, "B": 306147, "kind": "ordinary",
                         "poly": T19, "order": 523646, "fac": {2: 1, 261823: 1}},
            "CELL-RC1": {"n": 17, "A": 97044, "B": 126251, "kind": "ordinary",
                         "poly": T17, "order": 130412, "fac": {2: 2, 32603: 1}},
        }
        # The Z/lZ ladder mirrors the Koblitz ladder: (l, alphabets, lead alphabet).
        Z_LADDER = ((2003, (16, 8), 16), (130873, (64, 16), 64), (2095853, (128, 32), 128))
        Z2_ALPHABETS = (8, 16, 32, 64, 128)


        # ------------------------------------------------------------------ cells
        class CurveCell:
            """A binary-curve cell; points are affine (x, y) tuples, add returns
            None for the identity, key packs a point into one int."""

            def __init__(self, cid, n, A, B, kind, poly=None):
                self.id, self.n, self.kind = cid, n, kind
                self.F, self.NB, self.field_record = core.build_field(n, poly)
                self.C = core.Curve(self.F, A, B)
                self.mask = (1 << n) - 1

            def sample(self, rng):
                return self.C.sample_point(rng)

            def add(self, P, Q):
                return self.C.add(P, Q)

            def key(self, P):
                return (P[0] << self.n) | P[1]

            def unpack(self, k):
                return (k >> self.n, k & self.mask)


        class TableCell(CurveCell):
            """A cyclic cell sampled through its verified discrete-logarithm table:
            uniform non-identity points, sums by the group law."""

            def attach(self, pts, tab):
                self.pts, self.tab = pts, tab

            def sample(self, rng):
                return self.pts[rng.randrange(1, len(self.pts))]


        class IndexCell:
            """PC-9 reference sampler: uniform pairs of non-identity indices of a
            verified table, sums by index arithmetic, points by lookup."""

            def __init__(self, cid, pts):
                self.id, self.pts, self.N = cid, pts, len(pts)

            def sample(self, rng):
                return rng.randrange(1, self.N)

            def add(self, i, j):
                s = (i + j) % self.N
                return None if s == 0 else s

            def key(self, i):
                return i

            def unpack(self, k):
                return self.pts[k]


        class ZCell:
            """Z/NZ with non-identity sampling; points are integers."""

            def __init__(self, cid, N):
                self.id, self.N = cid, N

            def sample(self, rng):
                return rng.randrange(1, self.N)

            def add(self, i, j):
                s = (i + j) % self.N
                return None if s == 0 else s

            def key(self, i):
                return i

            def unpack(self, k):
                return k


        # --------------------------------------------------------- setup (PC-8)
        def setup_cell(cid, rng=None):
            """PC-8. Build the cell and apply its admission rule
            (definitions.group_order_and_admission). Returns (cell, factorisation,
            record)."""
            spec = CELLS[cid]
            if rng is None:
                rng = random.Random(est.seed_of("setup", cid))
            kind, n = spec["kind"], spec["n"]
            if kind == "koblitz_composite":
                cell = TableCell(cid, n, spec["A"], spec["B"], kind, spec["poly"])
            else:
                cell = CurveCell(cid, n, spec["A"], spec["B"], kind, spec["poly"])
            C = cell.C
            rec = {"cell": cid, "kind": kind, "field": cell.field_record}
            fails = []
            if not (cell.field_record["irreducible"] and cell.field_record["nb_self_check"]):
                fails.append("PC-8 the field polynomial or normal-basis check failed")
            if kind.startswith("koblitz"):
                N = core.order_lucas(n, spec["A"])
                rec["order_route_A"] = N
                if n <= 19:
                    rec["order_route_C"] = core.count_by_trace(C)
                    if not (rec["order_route_C"] == N):
                        fails.append("PC-8 routes A and C disagree")
            else:
                N = core.count_by_trace(C)
                rec["order_route_C"] = N
            rec["order"] = N
            rec["order_design_time"] = spec["order"]
            if not (N == spec["order"]):
                fails.append("IR-9 the recomputed order differs from the design-time order; halt and refer")
            fac = None
            try:
                fac = core.prime_factors(N)
            except ArithmeticError as err:
                fails.append("PC-8 %s" % err)
            rec["factorisation"] = None if fac is None else sorted(fac.items())
            if fac is not None:
                if not (fac == spec["fac"]):
                    fails.append("PC-8 the factorisation differs from the design-time factorisation")
                ok, why, _P = core.prove_order(C, N, fac, rng)
                rec["route_B"] = why
                rec["hasse_unique"] = core.hasse_unique(n, N)
                if not (ok and rec["hasse_unique"]):
                    fails.append("PC-8 the order is not proved by route B")
                v = 0
                while N % (1 << (v + 1)) == 0:
                    v += 1
                rec["cofactor"] = 1 << v
                l_cell = max(fac)
                rec["l"] = l_cell
                rec["l_primality"] = core.primality_record(l_cell)
                if not rec["l_primality"]["prime"]:
                    fails.append("PC-8 the largest prime factor is not proved prime")
                if kind == "koblitz_prime_l" and not (fac == {2: 2, l_cell: 1}):
                    fails.append("AR-B1 the order is not 4 times a prime")
                if kind == "ordinary" and not (v in (1, 2) and fac == {2: v, l_cell: 1}):
                    fails.append("AR-O the cofactor is not 2 or 4 with a prime odd part")
                rec["order4_search_made"] = v == 2
                rec["point_of_order_4"] = None
                if v == 2:
                    rec["point_of_order_4"] = core.point_of_order_4(C, N, rng)
                    if rec["point_of_order_4"] is None:
                        fails.append("PC-8 no point of order 4 found")
                below, bits = certificate.capacity(N, fac, l_cell)
                rec["certificate_alphabets_below_l"] = below
                rec["certificate_bits"] = bits
                if cid in est.RULE_ALPHABETS:
                    got = tuple(1 << est.alphabet_exponent(math.log2(l_cell), p) for p in (3, 4))
                    rec["alphabets_by_rule"] = got
                    if not (got == est.RULE_ALPHABETS[cid]):
                        fails.append("PC-8 rule R-M gives alphabets that differ from the design-time table")
                if kind == "koblitz_composite":
                    g = core.find_generator(C, N, fac, rng)
                    if g is None:
                        fails.append("AR-B1-C no generator of order exactly N found")
                    else:
                        try:
                            pts, tab = core.build_dlog(C, g, N)
                            cell.attach(pts, tab)
                            rec["generator"] = g
                            rec["dlog_entries"] = len(tab)
                        except ArithmeticError as err:
                            fails.append("AR-B1-C %s" % err)
            rec["admitted"] = len(fails) == 0
            rec["failures"] = fails
            return cell, fac, rec


        # ------------------------------------------------------- per-cell gate
        def gate_grid(cid, forms_h4):
            """The gate alphabets of a cell with their S by rule R-S: the family
            alphabets, 2 (h2), 4 where h4 is formed, and the PC-9 alphabet."""
            Ms = set(est.FAMILY_ALPHABETS.get(cid, ())) | {2}
            if forms_h4:
                Ms.add(4)
            if cid in est.PC9_ALPHABET:
                Ms.add(est.PC9_ALPHABET[cid])
            return {M: est.S_of(M) for M in sorted(Ms)}


        def f2_at_0(cell, M):
            """The PC-9 filter: the low log2(M) normal-basis coordinates of x (the
            arm F2 at offset 0), read at the gate only as an estimator check and
            never reused as a Stage 2 reading."""
            NB = cell.NB
            mask = M - 1
            return lambda P: NB.to_nb(P[0]) & mask


        def exact(g, M):
            return g["G"] == M and g["point_mass_used"] == g["used"]


        def occupied(g, M):
            return g["used"] >= (M * M) // 2 and g["excluded"] <= g["used"]


        def gate_cell(cell, setup, seeds=est.SEEDS):
            """Stage 1 on one admitted curve cell, seeds 0 to 9 enumerated (R-10):
            for every gate alphabet the random-label null (PC-2) and, at M >= 8,
            the planted marginal-only filter with its shuffles (PC-6b); the exact
            controls h2 and, on Koblitz cells, the constructed h4 with their
            shuffles (PC-3, PC-4, PC-6a); CK-H4 and PC-4b on 10^4 sampled points;
            and the curve-sampled readings of the PC-9 filter."""
            C = cell.C
            N = setup["order"]
            forms_h4 = cell.kind.startswith("koblitz") and setup.get("point_of_order_4") is not None
            grid = gate_grid(cell.id, forms_h4)
            rec = {"cell": cell.id, "seeds": list(seeds), "grid": grid, "arms": {}, "pc9_curve": []}
            rng = random.Random(est.seed_of("gate", cell.id))
            h2, _ = core.make_h2(C)
            exacts = [("h2", h2, 2)]
            if forms_h4:
                g4 = setup["point_of_order_4"]
                h4c, _ = core.make_h4_constructed(C, N, g4)
                h4h, _ = core.make_h4_halving(C, g4)
                exacts.append(("h4", h4c, 4))
                rec["h4_is_hom"] = core.verify_homomorphism(C, h4c, 4, rng)
                mism = 0
                for _ in range(10000):
                    P = C.sample_point(rng)
                    if not (h4c(P) == h4h(P)):
                        mism += 1
                rec["h4_presentation_mismatches"] = mism
            pc9_M = est.PC9_ALPHABET.get(cell.id)
            Smax = max(grid.values())
            for s in seeds:
                stream = est.PairStream(cell, s, Smax)
                for M, S in grid.items():
                    U = stream.support(S)
                    rec["arms"].setdefault(("null", M), []).extend(
                        est.null_distribution(stream, S, U, M, cell.id, s))
                    if M >= 8:
                        planted = est.planted_marginal_labels(U, M, est.seed_of("planted", cell.id, M, s))
                        rec["arms"].setdefault(("planted", M), []).append(
                            est.read_arm(stream, S, U, planted, M, cell.id, "planted", s))
                for name, h, M in exacts:
                    S = grid[M]
                    U = stream.support(S)
                    lab = est.cache_labels(cell, stream, U, h)
                    rec["arms"].setdefault((name, M), []).append(
                        est.read_arm(stream, S, U, lab, M, cell.id, name, s))
                if pc9_M is not None:
                    S = grid[pc9_M]
                    U = stream.support(S)
                    lab = est.cache_labels(cell, stream, U, f2_at_0(cell, pc9_M))
                    rec["pc9_curve"].append(est.gain(stream, S, lab, pc9_M)["G"])
            return rec


        def check_gate(rec):
            """PC-2, PC-3, PC-4, PC-4b, PC-6a and PC-6b on one cell, exactly as
            pre-registered. Returns the verdict and the measured null summaries
            that Stage 2 reuses."""
            fails = []
            arms = rec["arms"]
            nulls = {}
            for M in rec["grid"]:
                draws = arms[("null", M)]
                ns = est.null_summary(draws)
                nulls[M] = ns
                if not all(occupied(d, M) for d in draws):
                    fails.append("PC-2 a random-label draw is not occupied at M=%d" % M)
                if not (ns["W"] > 0):
                    fails.append("PC-2 the null width is not positive at M=%d" % M)
            for name, M in (("h2", 2), ("h4", 4)):
                if (name, M) not in arms:
                    continue
                for rd in arms[(name, M)]:
                    if not (exact(rd["direct"], M) and occupied(rd["direct"], M)):
                        fails.append("PC-3/PC-4 %s does not read exactly %d on every seed" % (name, M))
                        break
                for rd in arms[(name, M)]:
                    if not (est.median(rd["shuffle"]) <= nulls[M]["q99"]):
                        fails.append("PC-6a the shuffle does not collapse %s" % name)
                        break
            if "h4_is_hom" in rec and not rec["h4_is_hom"]:
                fails.append("PC-4 the constructed h4 is not a homomorphism; DF-1 re-opened")
            if rec.get("h4_presentation_mismatches", 0) > 0:
                fails.append("PC-4b the halving presentation differs from the constructed h4")
            for M in rec["grid"]:
                if M < 8:
                    continue
                readings = arms[("planted", M)]
                rows = est.seed_rows(readings, nulls[M])
                kept = est.median([est.median(rd["shuffle"]) for rd in readings]) - nulls[M]["q50"]
                if not (est.clause_L1(rows, nulls[M]) and kept >= 3.0 * nulls[M]["W"]
                        and not est.clause_L3(rows, nulls[M])):
                    fails.append("PC-6b the planted marginal-only filter is not preserved at M=%d" % M)
            return {"passed": len(fails) == 0, "failures": fails, "nulls": nulls}


        # ------------------------------------------------------------------ PC-9
        def dlog_table(cell, N, fac):
            """A verified generator's N-entry table (R-10), for PC-9."""
            if hasattr(cell, "pts"):
                return cell.pts
            rng = random.Random(est.seed_of("generator", cell.id))
            g = core.find_generator(cell.C, N, fac, rng)
            if g is None:
                raise ArithmeticError("no generator of order exactly N on %s" % cell.id)
            pts, _tab = core.build_dlog(cell.C, g, N)
            return pts


        def population_gain(pts, lab_of_point, M):
            """PC-9 exhaustive: G over every ordered pair of non-identity indices
            with a non-identity sum, by index arithmetic on a verified table."""
            N = len(pts)
            lab = [0] + [lab_of_point(pts[i]) for i in range(1, N)]
            MM = M * M
            cnt = array("I", [0]) * (MM * M)
            for i in range(1, N):
                base = lab[i] * MM
                for j in range(1, N):
                    s = i + j
                    if s >= N:
                        s -= N
                    if s == 0:
                        continue
                    cnt[base + lab[j] * M + lab[s]] += 1
            best = 0.0
            for ab in range(MM):
                row = cnt[ab * M:(ab + 1) * M]
                nab = sum(row)
                if nab:
                    v = max(row) / nab
                    if v > best:
                        best = v
            return M * best


        def reference_distribution(pts, lab_of_point, M, S, cid, R_ref=200):
            """PC-9 reference: R_ref index-sampled readings of S pairs from a
            verified table (sums by index arithmetic, no curve arithmetic), by the
            same gain code."""
            cell = IndexCell(cid, pts)
            vals = []
            for r in range(R_ref):
                stream = est.PairStream(cell, 1000 + r, S)
                U = stream.support(S)
                lab = est.cache_labels(cell, stream, U, lab_of_point)
                vals.append(est.gain(stream, S, lab, M)["G"])
            return vals


        def pc9_check(curve_values, ref_values):
            lo = est.quantile(ref_values, 0.005)
            hi = est.quantile(ref_values, 0.995)
            m = est.median(curve_values)
            return {"curve_median": m, "ref_lo": lo, "ref_hi": hi, "passed": lo <= m <= hi}


        def pc9_cell(cell, setup, fac, gate_rec, R_ref=200):
            """PC-9 on a declared cell: the index-sampled reference, and on the
            PC9_EXHAUSTIVE cells the exhaustive population value as well."""
            M = est.PC9_ALPHABET[cell.id]
            pts = dlog_table(cell, setup["order"], fac)
            fn = f2_at_0(cell, M)
            ref = reference_distribution(pts, fn, M, est.S_of(M), "PC9-" + cell.id, R_ref)
            out = pc9_check(gate_rec["pc9_curve"], ref)
            if cell.id in est.PC9_EXHAUSTIVE:
                out["G_population"] = population_gain(pts, fn, M)
            return out


        # ------------------------------------------------------ run-level controls
        def pc1_exact_grid(seeds=est.SEEDS):
            """PC-1 (R-5): on Z/2^17 the low log2(M) bits are an exact filter of
            every declared alphabet; at S = 2^s(M) it must read EXACT and OCCUPIED
            on every seed, and collapse under the shuffle (PC-6a) to at most q99
            of ten random-label draws per seed."""
            cell = ZCell("CELL-Z2", 1 << 17)
            fails, out = [], {}
            for M in Z2_ALPHABETS:
                S = est.S_of(M)
                recs = []
                for s in seeds:
                    stream = est.PairStream(cell, s, S)
                    U = stream.support(S)
                    lab = est.cache_labels(cell, stream, U, lambda i, M=M: i % M)
                    rd = est.read_arm(stream, S, U, lab, M, cell.id, "lowbits", s)
                    nulls = est.null_distribution(stream, S, U, M, cell.id, s, draws=10)
                    recs.append({"arm": rd, "null": nulls})
                    if not (exact(rd["direct"], M) and occupied(rd["direct"], M)):
                        fails.append("PC-1 the low bits do not read exactly M=%d on seed %d" % (M, s))
                ns = est.null_summary([d for r in recs for d in r["null"]])
                for r in recs:
                    if not (est.median(r["arm"]["shuffle"]) <= ns["q99"]):
                        fails.append("PC-6a the shuffle does not collapse the low-bits filter at M=%d" % M)
                        break
                out[M] = {"null": ns, "G": [r["arm"]["direct"]["G"] for r in recs]}
            return {"passed": len(fails) == 0, "failures": fails, "readings": out}


        def pc5_composite(cell, seed=0):
            """PC-5 (R-3): the constructed dlog-mod-M homomorphisms of CELL-K17C
            streamed at S = 2^s(M) for M in 548 and 956 (seed 0, the declared
            exception)."""
            fails, out = [], {}
            tab = cell.tab
            for M in (548, 956):
                S = est.S_of(M)
                r = est.exact_gain_stream(cell, seed, S, lambda P, M=M: tab[P] % M, M)
                out[M] = r
                if not (r["G"] == M and r["nonexact_used"] == 0 and r["used"] >= (M * M) // 2):
                    fails.append("PC-5 the composite exact filter does not read M=%d" % M)
            return {"passed": len(fails) == 0, "failures": fails, "readings": out}


        def interval_key(l, M):
            """The log-interval key: M equal-length intervals of Z/lZ,
            i -> floor(i M / l) (the top log2(M) bits when l is a power of two)."""
            return lambda i: (i * M) // l


        def z_ladder(seeds=est.SEEDS, rhos=(0.5, 0.25, 0.125, 0.0625)):
            """PC-7, PC-7c, PC-16 and the measured resolving floor on Z/lZ at the
            ladder primes of Z_LADDER (R-7)."""
            fails, report, key_cells = [], {}, {}
            log2_ns, lead_keys = [], []
            for l, alphabets, lead_M in Z_LADDER:
                cell = ZCell("CELL-Z-%d" % l, l)
                bits = l.bit_length()
                perm = list(range(l))
                random.Random(est.seed_of("relabel", cell.id)).shuffle(perm)
                grid = {M: est.S_of(M) for M in alphabets}
                Smax = max(grid.values())
                acc = {}
                for s in seeds:
                    stream = est.PairStream(cell, s, Smax)
                    for M, S in grid.items():
                        U = stream.support(S)
                        d = acc.setdefault(M, {"null": [], "arms": {}})
                        d["null"].extend(est.null_distribution(stream, S, U, M, cell.id, s))
                        key = est.cache_labels(cell, stream, U, interval_key(l, M))
                        d["arms"].setdefault("key", []).append(
                            est.read_arm(stream, S, U, key, M, cell.id, "key", s))
                        r = M.bit_length() - 1
                        for o in (0, (bits - r) // 2, bits - r):
                            win = est.cache_labels(cell, stream, U, lambda i, o=o, M=M: (perm[i] >> o) % M)
                            d["arms"].setdefault("relabel@%d" % o, []).append(
                                est.read_arm(stream, S, U, win, M, cell.id, "relabel@%d" % o, s))
                        for rho in rhos:
                            mix = est.planted_mixture(key, U, M, rho, est.seed_of("mix", cell.id, M, rho, s))
                            d["arms"].setdefault("mix%g" % rho, []).append(
                                est.read_arm(stream, S, U, mix, M, cell.id, "mix%g" % rho, s))
                for M, d in acc.items():
                    ns = est.null_summary(d["null"])
                    rows = {a: est.seed_rows(v, ns) for a, v in d["arms"].items()}
                    g_key = est.median([r["G"] for r in rows["key"]])
                    ok7 = (g_key >= M / 3.0 and g_key < M and est.clause_L1(rows["key"], ns)
                           and est.clause_L3(rows["key"], ns))
                    if not ok7:
                        fails.append("PC-7 the log-interval key is not read at l=%d M=%d" % (l, M))
                    for a in rows:
                        if a.startswith("relabel") and est.clause_L3(rows[a], ns):
                            fails.append("PC-7c %s reads a controlled excess at l=%d M=%d" % (a, l, M))
                    floor = None
                    for rho in sorted(rhos, reverse=True):
                        ra = rows["mix%g" % rho]
                        if est.clause_L1(ra, ns) and est.clause_L3(ra, ns):
                            floor = rho
                    report[(l, M)] = {"null": ns, "G_key_median": g_key, "PC-7": ok7,
                                      "resolving_floor_rho": floor}
                    key_cells[(cell.id, M)] = {"rows": rows["key"], "null": ns}
                log2_ns.append(math.log2(l))
                lead_keys.append((cell.id, lead_M))
            lead = est.classify_family(key_cells, lead_keys, log2_ns)
            if not (lead["verdict"] == "LEAD"):
                fails.append("PC-16 the LEAD branch is not reached by the log-interval key ladder")
            return {"passed": len(fails) == 0, "failures": fails, "report": report, "PC-16": lead}

