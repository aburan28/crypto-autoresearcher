  # ===========================================================================
  # STAGE 0 -- ZERO COMPUTE. Committed BEFORE any run; design figures only.
  # ===========================================================================
  stage_0:
    status: committed before any run; this sheet is its archival form
    method_note: >-
      Hand arithmetic by this producer, written out step by step, or quoted
      with its source. No shell and no calculator program was used. CODE-S0
      recomputes every figure at execution (procedure S0-5), and the success
      criterion requires agreement to the stated tolerances.

    pinned_inputs:
      curve: ECC2K-130, y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2 + z + 1)
      group_order: 4l
      l: '680564733841876926932320129493409985129'
      l_source: >-
        inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md lines 1093 to 1096,
        Appendix A, read at source in this task: "The group order is
        |E(F2131)| = 4l, where l is the 129-bit prime l =
        680564733841876926932320129493409985129." Provenance retrieved (an
        in-repository primary source), verified_by TASK-20260929-291567.
      log2_l: 129.0000 (129 plus about 1.2e-20; version-1 audit sheet, carried)
      rho: >-
        2^60.8090 = sqrt(pi l / (4 x 131)) under CORR-20260922-81aeab; J5 of
        version 1 60.80903656 (carried). AMBIENT: the target subgroup of order l.
      log2_262: 8.0334 (carried)
      log2_17: 4.0875 (carried)

    budget_quantity_statement: >-
      NO BUDGET QUANTITY IS USED. None of D1 (the floor-to-rho gap 2^-4.41), D2
      (the per-target oracle budget 2^+5.71) or D3 (the re-optimised per-attempt
      budget 2^+11.01), pinned by CORR-20260928-4cb669 at m = 4, is used, and no
      per-attempt oracle budget of any kind is asserted. PRICING RULE CARRIED
      FROM CORR-20260928-4cb669: an m >= 4 design that prices against a
      per-attempt budget uses D2 or D3 and never D1; this contract prices no
      oracle at all, and were a successor ever to need a per-attempt comparator
      it would be D3 (2^+11.01 at m = 4), never D1. The only reference quantity
      is matched rho, on the ceiling and HEUR-B2 threshold lines only.

    capacity_certificate:
      title: The exact sum-compatible filter capacity of the ECC2K-130 ambient group (carried; now also code)
      ambient: THE FULL GROUP of order 4l for the capacity; the target subgroup of order l for its subgroup line
      argument: >-
        Carried unchanged from version 1 (Steps 1 to 8; blind-confirmed by J5
        and re-derived by the validator, DEC-20260928-9d9c47 J1): invertibility
        in each argument makes f a quasigroup; associativity of addition and
        surjectivity of h make f associative; an associative quasigroup is a
        group; h is a surjective homomorphism; Lagrange gives M dividing the
        group order. The order enters only as divisibility, never as primality.
      result:
        admissible_alphabets_below_l: [1, 2, 4]
        exact_capacity_below_l_bits: 2.00
        exact_capacity_of_the_target_subgroup_bits: 0.00
      as_code: >-
        CODE-CERT divisors_from_factorisation and capacity, taking a
        factorisation {p: e} checked only by its product; certificate_controls
        returns the three readings below and their pass flags (PC-CERT-1 to
        PC-CERT-3). At setup the same function reads each cell's alphabets from
        its verified factorisation (setup record certificate_alphabets_below_l).
      control_readings_as_pass_criteria:
        - id: PC-CERT-1
          input: 'order 4l with factorisation {2: 2, l: 1}; bound l'
          required: 'alphabets below l exactly [1, 2, 4]; 2 bits; the full divisor set of 4l has six members; the target subgroup (order l, factorisation {l: 1}) gives [1] and 0 bits'
        - id: PC-CERT-2
          input: 'order 2^17 with factorisation {2: 17}; bound 2^17'
          required: divisors exactly 2^0 to 2^17 (eighteen); capacity below the order 16 bits
        - id: PC-CERT-3
          input: 'order 130972 with factorisation {2: 2, 137: 1, 239: 1}; bound 239'
          required: divisors exactly 1, 2, 4, 137, 239, 274, 478, 548, 956, 32743, 65486, 130972; below 239 exactly [1, 2, 4, 137]; capacity log2(137)
      primality_of_l: >-
        R-12. l is NOT proved prime in this design. The certificate's divisor set
        of 4l rests on the primary source's statement that l is a 129-bit prime
        (pinned_inputs.l_source, read at source here), corroborated by BPSW
        probable-prime tests in two version-1 reviews (DEC-20260928-9d9c47
