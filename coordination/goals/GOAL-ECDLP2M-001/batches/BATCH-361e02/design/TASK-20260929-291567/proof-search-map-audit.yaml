      gap_and_closure_both_ambients:
        rule: >-
          R-9. The needed alphabet, the exact capacity, the per-level gap and the
          closure line, each in ONE NAMED AMBIENT, reported side by side. The
          version-1 gap column and closure line, which subtracted the full-group
          capacity from the target-subgroup alphabet (DEV-J1-1), are withdrawn by
          supersession and appear nowhere in version 2. Closure line: the same
          tree at the exact capacity G, per attempt, k L (L/G)^(j - 1).
        per_level_gap_step: gap = log2(needed alphabet L) - log2(capacity), in the named ambient
        target_subgroup_ambient:
          ambient: N = l, log2 N = 129.0000; capacity 0 bits (alphabet 1), from the certificate's subgroup line
          rows:
            - {k: 4, needed_bits: 43.0000, capacity_bits: 0.0000, gap_bits: 43.0000, log2_per_attempt: 45.0000, closure_log2: 88.0000}
