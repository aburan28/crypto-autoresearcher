        from primality: a factorisation is checked only by its product, and
        primality enters only through the factorisation the caller certifies.

        Committed by TASK-20260929-291567. NOT RUN by the design task.
        """
        import math

        L_ECC2K130 = 680564733841876926932320129493409985129
        CERT3_DIVISORS = [1, 2, 4, 137, 239, 274, 478, 548, 956, 32743, 65486, 130972]


        def divisors_from_factorisation(order, fac):
            """Every divisor of order, from {p: e} whose product must equal order."""
            prod = 1
            for p, e in fac.items():
                prod *= p ** e
            if not (prod == order):
                raise ValueError("the factorisation does not multiply to the order")
            divs = [1]
            for p, e in sorted(fac.items()):
                new = []
                for d in divs:
                    pk = 1
                    for _ in range(e + 1):
                        new.append(d * pk)
                        pk *= p
                divs = new
            return sorted(set(divs))


        def capacity(order, fac, bound):
            """The admissible alphabets strictly below bound, and the exact
            capacity in bits, the base-2 logarithm of the largest of them."""
            below = [d for d in divisors_from_factorisation(order, fac) if d < bound]
            return below, math.log2(max(below))


        def certificate_controls():
            """PC-CERT-1 to PC-CERT-3, exactly as pre-registered."""
            out = {}
            l4 = 4 * L_ECC2K130
            fac4 = {2: 2, L_ECC2K130: 1}
            below, bits = capacity(l4, fac4, L_ECC2K130)
            sub_below, sub_bits = capacity(L_ECC2K130, {L_ECC2K130: 1}, L_ECC2K130)
            n_div = len(divisors_from_factorisation(l4, fac4))
            out["PC-CERT-1"] = {
                "full_group_alphabets_below_l": below,
                "full_group_bits": bits,
                "divisor_count_of_4l": n_div,
                "target_subgroup_alphabets_below_l": sub_below,
                "target_subgroup_bits": sub_bits,
                "primality_basis": "l prime as stated by SRC-ECC2K130 Appendix A; not proved (R-12)",
                "passed": (below == [1, 2, 4] and abs(bits - 2.0) < 1e-12 and n_div == 6
                           and sub_below == [1] and abs(sub_bits) < 1e-12),
            }
            z = 1 << 17
            divs = divisors_from_factorisation(z, {2: 17})
            _zb, zbits = capacity(z, {2: 17}, z)
            out["PC-CERT-2"] = {
                "divisors": divs,
                "bits_below_order": zbits,
                "passed": divs == [1 << i for i in range(18)] and abs(zbits - 16.0) < 1e-12,
            }
            c = 4 * 137 * 239
            fac3 = {2: 2, 137: 1, 239: 1}
            cdivs = divisors_from_factorisation(c, fac3)
            cb, cbits = capacity(c, fac3, 239)
            out["PC-CERT-3"] = {
                "divisors": cdivs,
                "below_239": cb,
                "bits_below_239": cbits,
                "passed": (cdivs == CERT3_DIVISORS and cb == [1, 2, 4, 137]
                           and abs(cbits - math.log2(137)) < 1e-12),
            }
            out["passed"] = all(out[k]["passed"] for k in ("PC-CERT-1", "PC-CERT-2", "PC-CERT-3"))
            return out

