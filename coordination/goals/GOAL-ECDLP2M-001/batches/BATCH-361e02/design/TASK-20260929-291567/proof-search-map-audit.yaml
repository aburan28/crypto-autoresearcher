    sample_table:
      rule_R_M: >-
        M = 2^r with r = floor(log2(N) / p + 1/2), p = 3 for the N^(1/3) arm and
        4 for the N^(1/4) arm. N READING: N = l, the largest prime divisor of the
        cell's group order, which is the order of the target subgroup, the
        ceiling table's ambient. The #E reading is shown beside each row and NOT
        USED. Fixed-alphabet and gate arms name their M.
      rule_R_S: >-
        S = 2^s with s = ceil(log2(128 M^2)); for M = 2^r this is s = 2r + 7 and
        S / M^2 = 128 exactly. 128 x M^2 is at or above 100 x M^2 (R-3), and the
        margin keeps the expected share of observed conditioning cells below
        MIN_CELL = 100 near 0.6 percent (a Poisson(128) count falls below 100
        with probability about 0.006, z = (99.5 - 128) / sqrt(128) = -2.52), so
        IR-12 does not fire on a uniform label at the declared S.
