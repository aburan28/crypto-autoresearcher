  # ===========================================================================
  # THE FOUR KN-TECH-080 AUDITS (docs/inventor-protocol.md section 8)
  # ===========================================================================
  audit_1_bottleneck_and_baseline_reproduction:
    status: present
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on E(F_2^n) for a binary
      Koblitz curve at alphabets M on the grid of stage_0.sample_table. Every
      other quantity of the k-list route is fixed: the exact capacity by the
      certificate, the ceiling, the two floors and the HEUR-B2 thresholds by
      arithmetic. DECISION-CHANGING: the k-list column of RQ-BINSTD-b6f698's
      reachability table is a prose closure by Theorem C, and either outcome of
      this measurement replaces it with a quantity scoped to the declared
      families and tested cells.
    baseline_reproduced_symbolically:
      - slice: Z/2^n with h the low log2(M) bits (Wagner's own setting)
        reproduction: >-
          The subgroups 2^i Z/2^n are exactly the proper subgroups, so the low
          log2(M) bits are the quotient onto Z/M and read G = M exactly. In
          version 2 this slice is ALSO a blocking run-level control (PC-1) at
          every declared alphabet 8, 16, 32, 64, 128 at its declared S, so the
          estimator is shown able to read an exact filter of every declared
          alphabet at the sample size that alphabet is read at (R-5).
      - slice: the composite toy cell Z/(4 x 137 x 239) = Z/130972
        reproduction: >-
          The divisors are 1, 2, 4, 137, 239, 274, 478, 548, 956, 32743, 65486,
          130972 (137 x 239 = 32743; 2 x 32743 = 65486; 4 x 32743 = 130972).
          The admissible alphabets include 548 = 4 x 137 and 956 = 4 x 239; the
          largest divisor strictly below the largest prime factor 239 is 137,
          so the capacity below 239 is log2(137), 7.0980 bits (validator C-J1-2;
          blind J5 agrees). THE NEARBY OBJECT WHERE THE CAPACITY IS NOT 2 BITS.
          Its exact filters are read at S = 2^26 (548) and 2^27 (956) (R-3).
      - slice: Z/lZ with the log-interval key i -> floor(i M / l)
        reproduction: >-
          The key of a sum is the sum of the keys or one more, so for every
          conditioning cell the sum is split about evenly between two key
          values and the population G is about M/2. An APPROXIMATE filter the
          instrument must see: PC-7 at every ladder prime and declared alphabet,
          and PC-16, which runs the key along the Z/l ladder through the
          contract's own LEAD rules and requires the LEAD signature, so the LEAD
          branch is shown reachable by the rules as coded.
      - slice: the k-list accounting
        reproduction: >-
          Re-derived from first principles in version 1 and confirmed at source
          by the version-1 red team (IMP-WAGNER cleared): k = 2^j lists of size
          L = N^(1/(j + 1)); time of order k L. Carried unchanged.
      - slice: the halving criterion
        reproduction: >-
          Re-derived from the group law and carried unchanged: Q = 2P needs
          lam^2 + lam = x(Q) + a, solvable exactly when Tr(x(Q) + a) = 0, so Q
          lies in 2E exactly when Tr(x(Q)) = Tr(a). Verified exhaustively at
          n = 13 and 17, a in 0, 1, by TASK-20260928-062eb8 (zero
          disagreements; the reversed criterion agrees on no point).
    frozen_fixture:
      committed_here: true
      ids: [CODE-CORE, CODE-CERT, CODE-EST, CODE-GATE, CODE-FAM, CODE-CALIB, CODE-S0]
      form: >-
        Seven block scalars under code_blocks, each extractable by the single
        pinned method of code_blocks_rule, with pass criteria stated ABOVE the
        code in pass_criteria_stated_before_execution and placed in stopping
        rule SR-1 and the invalidation rules of EXP-BINSTD-6f1e66, so that NO
        KOBLITZ-SPECIFIC ARM IS READ ON A CELL BEFORE ITS GATE AND EVERY
        RUN-LEVEL CONTROL HAVE PASSED.
      not_executed: >-
        Not run by this producer. A reviewer may extract, compile, import, and
        dry-call functions on synthetic inputs as a REVIEW COMPUTATION, recorded
        as such, and may not execute any driver as an experiment on a cell.
    audit_1_verdict: >-
      PRESENT WITH SUBSTANCE. Five symbolic reproductions, three of which are
      now blocking controls with committed code (PC-1, PC-5, PC-7 and PC-16),
      and a frozen fixture committed as code.

  audit_2_observation_collision:
    status: present
    observable: >-
      Per (cell, family, M, seed): the pair (M, G(h)), its excess over the
      measured random-label null of the same (cell, M) and over the family's
      own histogram-preserving shuffle, and the behaviour of the standardised
      excess along the ladder n in 13, 19, 23.
    collisions_searched_and_named:
      - id: OC-1
        two_objects: >-
          A genuine approximate homomorphism, and a filter whose MARGINAL is
          skewed so that a heavy bucket makes the maximum conditional
          probability large with no propagation content.
        why_it_is_a_real_collision: >-
          KN-FIND-ffe1df RT-EXP-1: popcount and digit-sum tripped their
          refutation criterion on E(F_p) and were both false positives, the
          matched-marginal shuffle reproducing them. F1 (normal-basis weight
          classes) and F4 (canonical-representative leading window) have skewed
          marginals, so the design is aimed at exactly this object.
        separator: >-
          VERSION 2 (R-1). The histogram-preserving resampling of labels ACROSS
          POINTS under a recorded seed (every bucket keeps its exact size over
          the support; every arithmetic relation between a point and its label
          is destroyed). The version-1 rule permuted bucket LABELS, under which
          G is exactly invariant (DEV-J2-1, J3-BREAK-1), so it separated
          nothing. The repaired separator is pinned by two gate checks it can
          fail: PC-6a (every exact control collapses to the random-label null
          under it) and PC-6b (a planted marginal-only filter keeps its excess
          under it and is not mistaken for propagation). Decision clause L3
          judges every family against its own shuffle.
      - id: OC-2
        two_objects: A genuinely low G, and a G that is low or zero because the conditional table is too sparse to estimate.
        separator: >-
          S = 2^ceil(log2(128 M^2)) per (cell, M), mean occupancy 128 per
          conditioning cell (R-3); an arm whose used conditioning cells hold
          less than half of the S pairs is NOT ESTIMATED and never a null
          (IR-12); PC-2
          requires the random label to use at least half the conditioning cells
          at every declared (cell, M); PC-9 pins the estimator against the
          exhaustive population (CELL-K13) and against index-sampled references
          (CELL-K19, CELL-O19, CELL-K17C).
      - id: OC-3
        two_objects: A filter that is approximately compatible, and a filter that is SECRETLY EXACT.
        separator: >-
          The certificate: on a prime-l cell only alphabets 1, 2, 4 are exact
          below l. A family reading G = M with every used cell a point mass at
          an alphabet outside 1, 2, 4 on a prime-l cell is SR-6 and routes to
          review-breakthrough; readings exactly 2 or 4 are compared pointwise
          with h2 and h4. The F5 composites carry the exact h4 component by
          construction and are judged against a stratified null that keeps it
          (DF-7), so the known 2 bits are not read as a family excess.
      - id: OC-4
        two_objects: An instrument that can see capacity and approximate filters, and one that reads a null everywhere.
        separator: >-
          Forced non-null readings on nearby objects, each blocking: PC-5 (548
          and 956 on CELL-K17C at their declared S), PC-1 (every declared
          alphabet exact on Z/2^17), PC-7 and PC-16 (the log-interval key read
          at every ladder prime and alphabet and reaching the LEAD signature
          along the Z/l ladder). A failure makes no null on any cell admissible
          (IR-1, IR-4, IR-7, IR-18).
      - id: OC-5
        two_objects: >-
          A family excess that does not decay along the ladder, and an excess
          that only appears to grow because the null of a maximum statistic
          grows with the occupancy S/M^2 and with M.
        separator: >-
          NEW IN VERSION 2 (R-2, J3-BREAK-2). Clause L2 fits the per-seed slope
          of the SHUFFLE-SUBTRACTED excess standardised by the measured null
          width of the same (cell, M), never of G - 1 itself, so a random label
          measured on the same pairs has expected excess zero at every cell
          whatever its occupancy. PC-15 runs a held-out random label through
          the full rules and requires NEG.
    audit_2_verdict: >-
      PRESENT WITH SUBSTANCE. Five named collisions, each with a separator that
      is a blocking control or a decision clause with committed code, and two
      of them (OC-1, OC-5) repair the exact defects that made the version-1
      instrument unreadable.

  audit_3_quantifier_order:
    status: present
    statements:
      - id: Q-CERT
        claim: >-
          FOR ALL finite abelian groups G, FOR ALL M and FOR ALL maps h from G
          onto an alphabet of size M for which THERE EXISTS a combining rule f
          with h(P + Q) = f(h(P), h(Q)) for ALL P, Q in G and f invertible in
          each argument: M divides the order of G and h is a group
          homomorphism. HENCE for the group of order 4l with l prime, every M
          strictly below l lies in 1, 2, 4.
        dependencies_allowed: >-
          f may depend on h and G, never on the pair (P, Q) and never on a
          target. Primality enters only when the divisor set of a specific
          order is read off; CODE-CERT takes a factorisation and never assumes
          a factor prime.
      - id: Q-MEAS
        claim: >-
          FOR THE TESTED cells (the ladder n in 13, 19, 23 at N^(1/3) and
          N^(1/4); the fixed-alphabet arms at n = 23 and 41 with M = 16; the
          ordinary cell at n = 19), FOR THE DECLARED arms (twelve on a Koblitz
          cell, six on the ordinary cell), AT LEVEL 1 ONLY: each arm is
          classified NEG, LEAD, ART-RES or NOT-ESTIMATED by the pre-registered
          clauses L1 to L3.
        dependencies_allowed: >-
          The reading may depend on the cell, arm, M, basis, seed and S, all
          recorded per arm. No statement is uniform over filters.
        not_claimed: >-
          Undeclared filters; TARGET-DEPENDENT filters (out of family, the
          widest open class); levels above 1; anything at n = 131; anything
          below the instrument's resolving floor at the declared S
          (stage_0.resolving_floor), which bounds what a NEG reading can mean.
      - id: Q-CEIL
        claim: >-
          IF THERE EXISTED a filter of alphabet about L with G = M at each of the
          j - 1 internal levels, THEN the ideal tree would total the CEIL row's
          figures. The antecedent is FALSE by Q-CERT for every L above 4.
        not_claimed: that any such filter exists, that any total is reachable, or any cost below matched rho attained by anything.
      - id: Q-TRANSFER
        claim: >-
          HEUR-B2, a heuristic: IF a declared arm reads NEG on the ladder and at
          the fixed-alphabet arms, THEN at n = 131 its level-1 gain at the
          alphabet L_k of the k-tree satisfies log2 G <= g*_k (stage_0
          heur_b2_thresholds), for k in 16 and 32.
        dependencies_allowed: g*_k depends on k and on the orbit switch only; it is fixed now and never tuned.
        not_claimed: >-
          That this is a bound. It transfers over about 108 bits of N (from
          log2 N at most 21.0 on the ladder to 129.0) and over the alphabet
          exponent (measured at 1/3 and 1/4, applied at 1/5 and 1/6).
    audit_3_verdict: >-
      PRESENT WITH SUBSTANCE. The certificate is universal, the measurement is
      scoped to declared objects, the ceiling is an implication with a false
      antecedent, and the transfer is a named heuristic whose consequent is now
      quantitative (R-11).

  audit_4_method_ceiling_and_nearby_object_control:
    status: present
    strongest_certifiable_claim: >-
      "On ECC2K-130 every exactly sum-compatible filter has alphabet at most 4
      (subject to PO-1 and to the primary source's primality statement for l),
      so the exact capacity of its ambient group below l is 2 bits; and on the
      toy Koblitz cells at n in 13, 19, 23 (and at M = 16 on n = 23 and 41) the
      declared arms show no controlled excess above the stated resolving floor
      at the declared S, with the exact controls reading exactly 2 and 4, the
      composite cell reading exactly 548 and 956, every declared alphabet read
      exactly on Z/2^17, and the log-interval key read and reaching the LEAD
      signature on the Z/l ladder."
    what_it_can_never_certify:
      - That no cheap filter exists. The family is DECLARED and therefore incomplete.
      - Anything about target-dependent filters, levels above 1, or the algebraic decomposition route.
      - Any excess below the resolving floor at the declared S; a NEG reading is a bound at that floor, not G = 1.
      - Any cost, margin or security statement about ECC2K-130 or any deployed curve.
      - A null at n = 131; the ladder's reach in N is HEUR-B2, a heuristic and never a bound.
    nearby_object_controls:
      - object: the composite Koblitz cell at n = 17, order 4 x 137 x 239
        where_the_hoped_for_conclusion_fails: capacity above 2 bits; exact filters 548 and 956
        blocking: true (PC-5, IR-4)
      - object: Z/lZ with the log-interval key at the ladder primes
        where_the_hoped_for_conclusion_fails: an approximate filter with G about M/2 exists; the LEAD rules must fire on it
        blocking: true (PC-7, PC-16, IR-7, IR-18)
      - object: Z/2^17 with the low-bits filter
        where_the_hoped_for_conclusion_fails: exact filters of every alphabet 2^i
        blocking: true (PC-1, IR-1; and PC-CERT-2 for the certificate)
      - object: the ordinary curve at n = 19, CELL-O19
        where_the_hoped_for_conclusion_fails: cofactor 2, capacity 1 bit, no h4; separates a Koblitz-specific reading from a coordinate-generic one
        blocking: true (its own gate; its arms classified separately)
      - object: a random label run through the full decision rules (RLFAM)
        where_the_hoped_for_conclusion_fails: nothing to find; the rules must return NEG
        blocking: true (PC-15, IR-17)
    method_tuned_on_the_target: >-
      NO. The S rule, the alphabet rule, the three clauses, the seeds, the
      draw counts, the planted objects and the family list are fixed here
      before any run; a change after a run begins requires a versioned
      protocol_amendment (IR-16).
    audit_4_verdict: PRESENT WITH SUBSTANCE, with five blocking nearby objects and the method's resolving floor stated as a limit.

  # ---------------------------------------------------------------------------
  strictness_and_interface_obligations:
    strictness:
      claimed_improvement: none
      text: >-
        No improvement over any baseline is claimed. The strictness obligation
        is the SEPARATION of three quantities: the exact capacity
        (unconditional subject to PO-1), the ceiling (conditional on a filter
        the certificate excludes), and the approximate capacity (measured, toy
        tier, above a stated resolving floor). PO-8 carries the separation and
        PO-9 the interface that must not exist (any conversion of the ceiling
        into a reachable cost), discharged by the outcome table.
    interfaces:
      - id: IF-1
        interface: Theorem C extended from prime order to a composite-order finite abelian group
        its_own_proof_obligation: PO-1, not inherited; primality is used nowhere (validator C-J1-1; exhaustive check on six small composite groups)
      - id: IF-2
        interface: the constructed h4 (scalar multiplication) against its halving presentation (DF-6)
        its_own_proof_obligation: >-
          PO-3, with gate check PC-4b: the two maps must agree on 10^4 sampled
          points of every cell that forms h4. The constructed map stays the
          tested exact control (CTL-EXACT4); the halving presentation is used
          only to evaluate the F5 composites.
      - id: IF-3
        interface: the (L, b) meter of the absorbed rows against G
        its_own_proof_obligation: PC-14, b = M / G for h2, now in SR-1 (R-10)
      - id: IF-4
        interface: the orbit-union base of the ceiling against the relation count
        its_own_proof_obligation: >-
          NOT DISCHARGED, DELIBERATELY. Conditional on the per-orbit unit no
          approved contract has fixed (CORR-20260925-649e25) AND on a trade
          class the cited record declines to price: KN-FIND-47da4e says nothing
          about orbit unions used with a materialised meet-in-the-middle oracle,
          which a k-list tree over stored lists is, and is not a promoted
          finding by its own frontmatter (confidence unverified; promotion_gate
          NOT MET) (R-11).
      - id: IF-5
        interface: the toy measurement against the deployed row
        its_own_proof_obligation: HEUR-B2 with its restated validation plan and a quantitative consequent (R-11)
      - id: IF-6
        interface: the measured random-label null against every decision threshold
        its_own_proof_obligation: >-
          PO-6, with PC-2, PC-15 and the finite-sample null-scale statement of
          stage_0.null_scale (R-2): the null is measured per (cell, M) from
          independent random labels on the same pairs and code path, never from
          resamples of the arm it judges.
    not_applicable_reason: null

