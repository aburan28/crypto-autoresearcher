    ideal_tree_table:
      model: >-
        Carried unchanged: k = 2^j lists of size L = N^(1/(j + 1)); per-attempt
        cost k L; B = L; relations R = B without orbit unknowns and B/262 with
        them; linear algebra k R^2; total R k L + k R^2; memory k L x 17 bytes.
      ambient: THE TARGET SUBGROUP of order l, N = l, log2 N = 129.0000, for every entry of rows[] (the declared ambient of the table)
      storage_convention: x-coordinate alone, 17 bytes per point; the source stores only about lg k lists (IMP-WAGNER delta), so these memory figures are conservative
      conditional_on: >-
        EVERY ROW IS A CEILING. Every total is conditional on a filter of
        alphabet about L at each of the j - 1 internal levels reading G = M,
        which the capacity certificate EXCLUDES EXACTLY for every L above 4.
        Every WITH-ORBIT row is conditional twice more: on the per-orbit
        relation-count unit that NO APPROVED CONTRACT HAS FIXED
        (CORR-20260925-649e25), and on a trade class its cited dependency
        declines to price, KN-FIND-47da4e saying nothing about orbit unions used
        with a materialised meet-in-the-middle oracle (a k-list tree over stored
        lists is one) and being, by its own frontmatter, not a promoted finding
        (confidence unverified; promotion_gate NOT MET) (R-11). The WITHOUT-ORBIT
        row is the unconditional one of each pair, still under the first
        condition.
