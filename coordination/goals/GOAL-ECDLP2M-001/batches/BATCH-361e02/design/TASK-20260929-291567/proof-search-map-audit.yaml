        """CODE-FAM, families.py, of EXP-BINSTD-6f1e66: the declared arms (F1, F2
        at three offsets, F3 at three offsets, F4 and the four F5 composites on a
        Koblitz cell; F2 and F3 at three offsets each on the ordinary cell), the
        Stage 2 driver with the held-out random-label arm RLFAM (PC-15) and the
        stratified null of the F5 composites (DF-7), and the Stage 3
        classification.

        Committed by TASK-20260929-291567. NOT RUN by the design task. Pure
        Python 3, standard library only. Stage 2 runs on a cell only after its
        gate and every run-level control have passed (PC-10, IR-14).
        """
        import math

        import binstd_core as core
        import estimator as est


        def weight_buckets(n, M):
            """F1 quantile classes: bucket(w) = min(M - 1, floor(M C(w))), C the
            mid-CDF of Binomial(n, 1/2)."""
            tot = float(2 ** n)
            out, acc = [], 0
            for w in range(n + 1):
                pw = math.comb(n, w)
                out.append(min(M - 1, int(math.floor(M * (acc + pw / 2.0) / tot))))
                acc += pw
            return out


        def rotr(c, k, n):
            k %= n
            mask = (1 << n) - 1
            return ((c >> k) | (c << (n - k))) & mask


        def min_rotation(c, n):
            """The Frobenius-canonical representative: the least cyclic rotation."""
            best = c
            for k in range(1, n):
                v = rotr(c, k, n)
                if v < best:
                    best = v
            return best


        def offsets(n, r):
            """The three declared offsets of F2 and F3 at window width r."""
            return (0, (n - r) // 2, n - r)


        def arms(cell, M, h4h=None):
            """Names, one tuple-valued label function, and per arm the index of its
            stratum slot (None, or the last slot holding h4 for an F5 composite).
            M is a power of two, at least 8 on a Koblitz cell."""
            n = cell.n
            r = M.bit_length() - 1
            NB = cell.NB
            koblitz = cell.kind.startswith("koblitz")
            pre = "" if koblitz else "ORD-"
            offs = offsets(n, r)
            wb = weight_buckets(n, M)
            mask = M - 1
            names = []
            if koblitz:
                names.append("F1")
            names += [pre + "F2@%d" % o for o in offs]
            names += [pre + "F3@%d" % o for o in offs]
            if koblitz:
                names += ["F4", "F5xF1", "F5xF2@0", "F5xF3@0", "F5xF4"]
                r4 = r - 2
                m4 = (M // 4) - 1
                wb4 = weight_buckets(n, M // 4)

            def fn(P):
                x = P[0]
                c = NB.to_nb(x)
                out = []
                if koblitz:
                    out.append(wb[core.popcount(c)])
                for o in offs:
                    out.append(rotr(c, o, n) & mask)
                for o in offs:
                    out.append((x >> o) & mask)
                if koblitz:
                    mr = min_rotation(c, n)
                    e = h4h(P)
                    out.append((mr >> (n - r)) & mask)
                    out.append(4 * wb4[core.popcount(c)] + e)
                    out.append(4 * (c & m4) + e)
                    out.append(4 * (x & m4) + e)
                    out.append(4 * ((mr >> (n - r4)) & m4) + e)
                    out.append(e)
                return tuple(out)

            strata = [None] * len(names)
            if koblitz:
                for k in range(len(names) - 4, len(names)):
                    strata[k] = len(names)
            return names, fn, strata


        def stage2_cell(cell, setup, gate_nulls, seeds=est.SEEDS):
            """Stage 2 on one admitted cell whose gate passed: every declared arm
            at every family alphabet of the cell, seeds 0 to 9, and the held-out
            random-label arm RLFAM (PC-15). F5 arms are judged against the
            stratified null (random labels 4 r + h4) measured here on the same
            pairs; every other arm against the gate's random-label null
            gate_nulls[M]."""
            Ms = est.FAMILY_ALPHABETS[cell.id]
            grid = {M: est.S_of(M) for M in Ms}
            h4h = None
            if cell.kind.startswith("koblitz"):
                h4h = core.make_h4_halving(cell.C, setup["point_of_order_4"])[0]
            Smax = max(grid.values())
            res, f5null = {}, {}
            for s in seeds:
                stream = est.PairStream(cell, s, Smax)
                for M, S in sorted(grid.items()):
                    U = stream.support(S)
                    names, fn, strata = arms(cell, M, h4h)
                    width = len(names) + (1 if h4h is not None else 0)
                    labs = est.cache_label_tuples(cell, stream, U, fn, width)
                    if h4h is not None:
                        e = labs[len(names)]
                        f5null.setdefault(M, []).extend(est.null_distribution(
                            stream, S, U, M, cell.id + "/F5", s, strata=e, q=4))
                    for k, name in enumerate(names):
                        st = None if strata[k] is None else labs[strata[k]]
                        res.setdefault((name, M), []).append(
                            est.read_arm(stream, S, U, labs[k], M, cell.id, name, s, st))
                    rl = est.random_labels(U, M, est.seed_of("rlfam", cell.id, M, s))
                    res.setdefault(("RLFAM", M), []).append(
                        est.read_arm(stream, S, U, rl, M, cell.id, "RLFAM", s))
            f5sum = {M: est.null_summary(v) for M, v in f5null.items()}
            out = {}
            for (name, M), readings in res.items():
                null = f5sum[M] if name.startswith("F5") else gate_nulls[M]
                out[(name, M)] = {"rows": est.seed_rows(readings, null), "null": null}
            return out


        def stage3(outs, log2_ns):
            """Stage 3. outs[cell] is the stage2_cell output of every read cell;
            log2_ns lists log2 l of the ladder cells in LADDER order. Ladder arms
            are classified by est.classify_family with the ladder cells at their
            N^(1/3) alphabets as the LEAD keys; ordinary-cell arms (ORD-*) read
            NEG when L3 holds at no estimated (cell, M), else ART-RES. PC-15:
            RLFAM must read NEG."""
            names = set()
            for o in outs.values():
                for key in o:
                    names.add(key[0])
            lead_keys = [(c, est.LEAD_ALPHABET[c]) for c in est.LADDER]
            verdicts = {}
            for name in sorted(names):
                cells_M = {}
                for cid, o in outs.items():
                    for key, d in o.items():
                        if key[0] == name:
                            cells_M[(cid, key[1])] = d
                if all(k in cells_M for k in lead_keys):
                    verdicts[name] = est.classify_family(cells_M, lead_keys, log2_ns)
                else:
                    l3_any = False
                    for d in cells_M.values():
                        if est.estimated(d["rows"]) and est.clause_L3(d["rows"], d["null"]):
                            l3_any = True
                    verdicts[name] = {"verdict": "ART-RES" if l3_any else "NEG",
                                      "ladder": False, "read_on": sorted(cells_M)}
            return {"verdicts": verdicts,
                    "PC-15": verdicts.get("RLFAM", {}).get("verdict") == "NEG"}

    - id: CODE-CALIB
      file: calibration_rows.py
      extract_as: experiments/EXP-BINSTD-6f1e66/impl/calibration_rows.py
      discharges: [C4 calibration rows, PC-11 to PC-14, R-10 PC-14 in SR-1]
      dependencies: binstd_core; standard library otherwise
      reference_sha256: 647b44f0bf37462f0df31db22d1e383841c29fcb218cd105359cfc6dcefcfd6d
      carried_from: version-1 FIXTURE-B2 (validator C-J2-14 found PC-11 to PC-14 satisfiable), with the import repointed and PC-14 taking the gate's h2 reading
      code: |
        """CODE-CALIB, calibration_rows.py, of EXP-BINSTD-6f1e66 (FIXTURE-B2 of
        version 1, carried with its import repointed to CODE-CORE and PC-14 taking
        the gate's h2 reading): the two exact calibration rows of
        IDEA-20260926-d06324, absorbed as the calibration of the bucket-gain
        instrument, read on CELL-RC1 and CELL-K19.

        ROW P1  x-coordinate projection:  l_fibre == 1 and b == 2, EXACTLY.
        ROW P2  halving-trace bit h2:     b == 1 EXACTLY on the full group, and
                                          l_image == 0 on the odd-order subgroup.

        Both readings of L are reported (l_fibre, log2 of the mean fibre size, and
        l_image, log2 of the image size); see design finding DF-5.
        Committed by TASK-20260929-291567. NOT RUN by the design task.
        """
        import math

        from binstd_core import INF, make_h2


        def x_projection(C):
            """pi(P) == x(P); its fibre is the pair P, -P (a singleton at x == 0)."""

            def pi(P):
                return "inf" if P is INF else P[0]

            return pi


        def fibre_of_x(C, x):
            P = C.lift_x(x)
            if P is None:
                return []
            Q = C.neg(P)
            return [P] if P == Q else [P, Q]


        def row_p1(C, rng, fibre_pairs=32):
            """EXACT row: for fibres of size at most 2 the sums are enumerated in
            full, so b is exact and not sampled."""
            pi = x_projection(C)
            sizes, bs = [], []
            got = 0
            while got < fibre_pairs:
                x1 = rng.randrange(1, C.F.q)
                x2 = rng.randrange(1, C.F.q)
                f1, f2 = fibre_of_x(C, x1), fibre_of_x(C, x2)
                if len(f1) == 0 or len(f2) == 0 or x1 == x2:
                    continue
                vals = set()
                for A in f1:
                    for B in f2:
                        vals.add(pi(C.add(A, B)))
                sizes.extend([len(f1), len(f2)])
                bs.append(len(vals))
                got += 1
            mean_fibre = sum(sizes) / len(sizes)
            return {"row": "P1", "l_fibre": math.log2(mean_fibre), "l_image": None,
                    "b": sum(bs) / len(bs), "b_values": sorted(set(bs)), "exact": True}


        def row_p2_full_group(C, rng, fibre_pairs=32, per_pair=4096):
            """h2 is a homomorphism, so every sampled fibre pair gives exactly one
            value of h2(A + B): b == 1 EXACTLY."""
            h, M = make_h2(C)
            bs = []
            for _ in range(fibre_pairs):
                a = rng.randrange(M)
                b = rng.randrange(M)
                vals = set()
                drawn = 0
                while drawn < per_pair:
                    A = C.sample_point(rng)
                    if not (h(A) == a):
                        continue
                    B = C.sample_point(rng)
                    if not (h(B) == b):
                        continue
                    S = C.add(A, B)
                    if S is INF:
                        continue
                    vals.add(h(S))
                    drawn += 1
                bs.append(len(vals))
            return {"row": "P2-full-group", "l_image": math.log2(M),
                    "b": sum(bs) / len(bs), "b_values": sorted(set(bs)), "exact": False,
                    "note": "sampled; a homomorphism admits only b == 1"}


        def row_p2_odd_subgroup(C, N, rng, trials=4096):
            """On the odd-order subgroup h2 is constant, so the IMAGE has size 1
            and l_image == 0; l_fibre is reported beside it."""
            odd = N
            while odd % 2 == 0:
                odd //= 2
            h, _M = make_h2(C)
            cof = N // odd
            image = set()
            for _ in range(trials):
                G = C.mul(cof, C.sample_point(rng))
                if G is INF:
                    continue
                image.add(h(G))
            return {"row": "P2-odd-subgroup", "l_image": math.log2(len(image)),
                    "l_fibre": math.log2(odd), "image": sorted(image), "cofactor": cof,
                    "exact": False}


        def check_calibration(p1, p2g, p2o, gate_h2_G=None):
            """PC-11 to PC-14 exactly as pre-registered; gate_h2_G is the gate's h2
            reading on the same cell (PC-14, b == M / G with M == 2)."""
            fails = []
            if not (abs(p1["l_fibre"] - 1.0) < 1e-12):
                fails.append("PC-11 row P1 l_fibre is not exactly 1")
            if not (p1["b_values"] == [2]):
                fails.append("PC-11 row P1 b is not exactly 2 on every fibre pair")
            if not (p2g["b_values"] == [1]):
                fails.append("PC-12 row P2 b is not exactly 1 on the full group")
            if not (abs(p2o["l_image"]) < 1e-12):
                fails.append("PC-13 row P2 l_image is not exactly 0 on the odd subgroup")
            if gate_h2_G is not None and not (abs(p2g["b"] - 2.0 / gate_h2_G) < 1e-6):
                fails.append("PC-14 b == M / G fails between the fixtures")
            return {"passed": len(fails) == 0, "failures": fails}

    - id: CODE-S0
      file: stage0.py
      extract_as: experiments/EXP-BINSTD-6f1e66/impl/stage0.py
      discharges: [R-3 table, R-4 orders, R-9, R-11 thresholds, R-7 readings]
      dependencies: binstd_core, certificate, estimator; standard library otherwise
      reference_sha256: b905cd5d4ffa7c4af64ee72df4b11048cc59e703a993eee7a9bfed3f810892a9
      code: |
        """CODE-S0, stage0.py, of EXP-BINSTD-6f1e66: the Stage 0 design arithmetic
        (zero compute; its output is a design figure, never a measurement):
        matched rho; the ideal-tree ceiling table in the target-subgroup ambient;
        the gap and closure lines in both named ambients (R-9); the HEUR-B2
        thresholds g*_k and c_k (R-11); the Koblitz orders and AR-B1
        admissibility for n = 3 to 63 (R-4); the alphabet and sample-size table
        (R-3); and the certificate readings (R-7). Procedure S0-5 runs it and
        compares its output with the audit sheet.

        Committed by TASK-20260929-291567. NOT RUN by the design task.
        """
        import json
        import math

        import binstd_core as core
        import certificate
        import estimator as est

        L = certificate.L_ECC2K130
        LOG2_L = math.log2(L)
        RHO = 0.5 * math.log2(math.pi * L / (4 * 131))
        LOG2_262 = math.log2(262)
        LOG2_17 = math.log2(17)


        def tree_row(k, orbit):
            """One ceiling row in the target-subgroup ambient (N = l)."""
            j = k.bit_length() - 1
            lL = LOG2_L / (j + 1)
            per = lL + j
            rel = lL - LOG2_262 if orbit else lL
            main = rel + per
            la = j + 2 * rel
            total = main + math.log2(1.0 + 2.0 ** (la - main))
            return {"k": k, "j": j, "orbit": orbit, "log2_L": lL, "log2_per_attempt": per,
                    "log2_relations": rel, "log2_main": main, "log2_la": la,
                    "log2_total": total, "margin_vs_rho": total - RHO,
                    "log2_memory_bytes": j + lL + LOG2_17}


        def gap_and_closure(k, ambient):
            """R-9: needed alphabet, capacity, gap and closure line in one named
            ambient, "subgroup" (N = l, 0 bits) or "full" (N = 4l, 2 bits)."""
            j = k.bit_length() - 1
            log2_n = LOG2_L if ambient == "subgroup" else LOG2_L + 2.0
            cap = 0.0 if ambient == "subgroup" else 2.0
            lL = log2_n / (j + 1)
            gap = lL - cap
            return {"k": k, "ambient": ambient, "log2_N": log2_n, "needed_bits": lL,
                    "capacity_bits": cap, "gap_bits": gap, "log2_per_attempt": lL + j,
                    "closure_log2": lL + j + (j - 1) * gap}


        def threshold(k, orbit):
            """R-11: the largest log2 G keeping the k-tree total at or above rho."""
            row = tree_row(k, orbit)
            j, lL = row["j"], row["log2_L"]
            if row["log2_main"] >= RHO or row["log2_la"] >= RHO:
                return {"k": k, "orbit": orbit, "g_star": lL, "c": lL / LOG2_L, "binding": False}
            need = RHO + math.log2(1.0 - 2.0 ** (row["log2_la"] - RHO))
            g = lL - (need - row["log2_main"]) / (j - 1)
            return {"k": k, "orbit": orbit, "g_star": g, "c": g / LOG2_L, "binding": True}


        def koblitz_orders(nmax=63):
            rows = []
            for n in range(3, nmax + 1):
                N = core.order_lucas(n, 0)
                odd, v = N, 0
                while odd % 2 == 0:
                    odd //= 2
                    v += 1
                rows.append({"n": n, "order": N, "v2": v, "odd_part": odd,
                             "admissible_AR_B1": v == 2 and core.is_prime(odd)})
            return rows


        S_ROWS = (
            ("CELL-K13", 2003, 8012, 3, None), ("CELL-K13", 2003, 8012, 4, None),
            ("CELL-K19", 130873, 523492, 3, None), ("CELL-K19", 130873, 523492, 4, None),
            ("CELL-K23", 2095853, 8383412, 3, None), ("CELL-K23", 2095853, 8383412, 4, None),
            ("CELL-K23", 2095853, 8383412, None, 16),
            ("CELL-K41", 549756390943, 2199025563772, None, 16),
            ("CELL-O19", 261823, 523646, 3, None), ("CELL-O19", 261823, 523646, 4, None),
            ("CELL-K17C", 239, 130972, None, 548), ("CELL-K17C", 239, 130972, None, 956),
        )


        def sample_table():
            rows = []
            for cid, l, order, parts, fixed in S_ROWS:
                if parts is None:
                    M, M_e = fixed, None
                else:
                    M = 1 << est.alphabet_exponent(math.log2(l), parts)
                    M_e = 1 << est.alphabet_exponent(math.log2(order), parts)
                s = est.sample_size_exponent(M)
                rows.append({"cell": cid, "parts": parts, "N_reading": "l", "l": l,
                             "log2_l": math.log2(l), "M": M,
                             "M_under_E_reading_not_used": M_e, "S": 1 << s,
                             "log2_S": s, "S_over_M2": (1 << s) / (M * M)})
            return rows


        def main():
            out = {
                "rho_log2": RHO,
                "log2_l": LOG2_L,
                "tree": [tree_row(k, o) for k in (4, 8, 16, 32) for o in (False, True)],
                "gap_and_closure": [gap_and_closure(k, a) for k in (4, 8, 16, 32)
                                    for a in ("subgroup", "full")],
                "heur_b2_thresholds": [threshold(k, o) for k in (4, 8, 16, 32)
                                       for o in (False, True)],
                "koblitz_orders": koblitz_orders(63),
                "sample_table": sample_table(),
                "certificate": certificate.certificate_controls(),
            }
            print(json.dumps(out, indent=1, sort_keys=True))


        if __name__ == "__main__":
            main()

