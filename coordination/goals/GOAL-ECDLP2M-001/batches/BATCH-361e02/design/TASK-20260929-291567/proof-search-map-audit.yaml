      file: estimator.py
      extract_as: experiments/EXP-BINSTD-6f1e66/impl/estimator.py
      discharges: [R-1, R-2, R-3, R-8, OC-5, DF-7]
      dependencies: standard library only
      reference_sha256: 944302ccd0826cb21dd09317b3715623f7443e35479828dbda04e99c91b10815
      code: |
        """CODE-EST, estimator.py, of EXP-BINSTD-6f1e66: the design constants and
        rules R-M and R-S (R-3), pair streams with labels cached once per
        distinct point (R-8), the bucket-gain statistic G, the
        histogram-preserving shuffle (R-1), the measured random-label null
        (R-2), the planted controls, and the pre-registered decision clauses L1,
        L2 and L3 with the classification NEG, LEAD, ART-RES or NOT-ESTIMATED.

        Committed by TASK-20260929-291567. NOT RUN by the design task. Pure
        Python 3, standard library only. No percentile bootstrap is used
        anywhere (R-8): the sampling variability of G is read from ten
        independent seeds, and the null from independent random labels, never
        from resamples of the arm it judges.
        """
        import math
        import random
        import zlib
        from array import array

        MIN_CELL = 100
        FLAT_LIMIT = 1 << 24
        R_RL = 20
        R_SH = 10
        SEEDS = tuple(range(10))

        # Design constants (audit sheet stage_0.sample_table); the ladder and PC-9
        # alphabets are re-derived by rule R-M from each verified order at setup.
        RULE_ALPHABETS = {"CELL-K13": (16, 8), "CELL-K19": (64, 16),
                          "CELL-K23": (128, 32), "CELL-O19": (64, 16)}
        FAMILY_ALPHABETS = {"CELL-K13": (16, 8), "CELL-K19": (64, 16),
                            "CELL-K23": (128, 32, 16), "CELL-K41": (16,),
                            "CELL-O19": (64, 16)}
        LADDER = ("CELL-K13", "CELL-K19", "CELL-K23")
        LEAD_ALPHABET = {"CELL-K13": 16, "CELL-K19": 64, "CELL-K23": 128}
        PC9_ALPHABET = {"CELL-K13": 8, "CELL-K19": 16, "CELL-O19": 16, "CELL-K17C": 16}
        PC9_EXHAUSTIVE = ("CELL-K13",)


        def seed_of(*parts):
            """A recorded deterministic 32-bit seed from a label (never hash())."""
            return zlib.crc32(":".join(str(p) for p in parts).encode("ascii"))


        def alphabet_exponent(log2_n, parts):
            """Rule R-M: M = 2^r with r = floor(log2(N) / parts + 1/2)."""
            return int(math.floor(log2_n / parts + 0.5))


        def sample_size_exponent(M):
            """Rule R-S: S = 2^s with s = ceil(log2(128 M^2))."""
            return (128 * M * M - 1).bit_length()


        def S_of(M):
            return 1 << sample_size_exponent(M)


        # ------------------------------------------------------------ pair streams
        class PairStream:
            """The ordered pairs of one (cell, seed): pid[3k], pid[3k + 1] and
            pid[3k + 2] are the ids of P, Q and P + Q of pair k. Ids are assigned
            in order of first appearance, so the support of the first S pairs is
            ids 0 .. U(S) - 1. Pairs whose sum is the identity are redrawn and
            counted. The cell supplies sample, add (None for the identity), key
            and unpack."""

            def __init__(self, cell, seed, S):
                self.cell_id = cell.id
                self.seed = seed
                self.S = S
                self.pid = array("I")
                self.keys = []
                self.redrawn = 0
                index = {}
                rng = random.Random(seed_of("stream", cell.id, seed))
                for _ in range(S):
                    while True:
                        P = cell.sample(rng)
                        Q = cell.sample(rng)
                        R = cell.add(P, Q)
                        if R is None:
                            self.redrawn += 1
                            continue
                        break
                    for X in (P, Q, R):
                        k = cell.key(X)
                        i = index.get(k)
                        if i is None:
                            i = len(self.keys)
                            index[k] = i
                            self.keys.append(k)
                        self.pid.append(i)

            def support(self, S):
                """U(S), the number of distinct points among the first S pairs."""
                return max(self.pid[0:3 * S]) + 1


        def cache_labels(cell, stream, U, fn):
            """R-8. Evaluate a label function once per distinct point of the
            support and cache it; every reading and every resampling reads the
            cached array."""
            out = array("H")
            for i in range(U):
                out.append(fn(cell.unpack(stream.keys[i])))
            return out


        def cache_label_tuples(cell, stream, U, fn, width):
            """As cache_labels, for a function returning a tuple of width labels
            (every arm of a cell in one pass over the support)."""
            outs = [array("H") for _ in range(width)]
            for i in range(U):
                t = fn(cell.unpack(stream.keys[i]))
                for j in range(width):
                    outs[j].append(t[j])
            return outs


        # --------------------------------------------------------------- statistic
        def gain(stream, S, lab, M):
            """G = M x the maximum over conditioning cells (a, b) with at least
            MIN_CELL samples of max_c n(a, b, c) / n(a, b), over the first S pairs.
            Returns G, used, excluded (observed cells below MIN_CELL), empty
            (unobserved cells), used_mass (the pairs in used cells) and
            point_mass_used (used cells with one sum label). Flat counter; needs
            M^3 <= FLAT_LIMIT."""
            if M * M * M > FLAT_LIMIT:
                raise ValueError("alphabet too large for the flat counter")
            MM = M * M
            cnt = array("I", [0]) * (MM * M)
            pid = stream.pid
            for k in range(0, 3 * S, 3):
                cnt[lab[pid[k]] * MM + lab[pid[k + 1]] * M + lab[pid[k + 2]]] += 1
            best, used, excluded, empty, point_mass, used_mass = 0.0, 0, 0, 0, 0, 0
            for ab in range(MM):
                row = cnt[ab * M:(ab + 1) * M]
                nab = sum(row)
                if nab == 0:
                    empty += 1
                elif nab < MIN_CELL:
                    excluded += 1
                else:
                    used += 1
                    used_mass += nab
                    top = max(row)
                    if top == nab:
                        point_mass += 1
                    v = top / nab
                    if v > best:
                        best = v
            return {"G": M * best, "used": used, "excluded": excluded, "empty": empty,
                    "used_mass": used_mass, "point_mass_used": point_mass, "S": S}


        def exact_gain_stream(cell, seed, S, label, M):
            """PC-5. Streaming reading of an EXACT filter of large alphabet: per
            conditioning cell its count and the first sum label seen; a second
            distinct sum label marks the cell non-exact. Memory O(M^2). G is M
            when every used cell is a point mass, and None otherwise."""
            MM = M * M
            nab = array("I", [0]) * MM
            first = array("i", [-1]) * MM
            bad = array("B", [0]) * MM
            rng = random.Random(seed_of("stream", cell.id, seed))
            redrawn = 0
            for _ in range(S):
                while True:
                    P = cell.sample(rng)
                    Q = cell.sample(rng)
                    R = cell.add(P, Q)
                    if R is None:
                        redrawn += 1
                        continue
                    break
                ab = label(P) * M + label(Q)
                c = label(R)
                nab[ab] += 1
                f = first[ab]
                if f < 0:
                    first[ab] = c
                elif not (f == c):
                    bad[ab] = 1
            used = excluded = empty = nonexact = 0
            for ab in range(MM):
                n = nab[ab]
                if n == 0:
                    empty += 1
                elif n < MIN_CELL:
                    excluded += 1
                else:
                    used += 1
                    if bad[ab]:
                        nonexact += 1
            G = M if (used > 0 and nonexact == 0) else None
            return {"G": G, "used": used, "excluded": excluded, "empty": empty,
                    "nonexact_used": nonexact, "redrawn": redrawn, "S": S}


        # ---------------------------------------------- shuffle, nulls and planted
        def shuffled(lab, U, seed, strata=None):
            """R-1. Histogram-preserving resampling of labels ACROSS POINTS: the
            labels of the support ids 0 .. U - 1 are reassigned to the points by a
            uniform random permutation under the recorded seed. Every bucket keeps
            its exact size over the support and every arithmetic relation between
            a point and its label is destroyed. With strata (the exact h4
            component of an F5 composite, DF-7) the permutation acts within each
            stratum, keeping the two bits the certificate already accounts for and
            destroying every other relation."""
            rng = random.Random(seed)
            if strata is None:
                vals = list(lab[0:U])
                rng.shuffle(vals)
                return array("H", vals)
            out = array("H", lab[0:U])
            groups = {}
            for i in range(U):
                groups.setdefault(strata[i], []).append(i)
            for key in sorted(groups):
                idx = groups[key]
                vals = [out[i] for i in idx]
                rng.shuffle(vals)
                for i, v in zip(idx, vals):
                    out[i] = v
            return out


        def random_labels(U, M, seed, strata=None, q=1):
            """Independent uniform labels, one per point of the support. With
            strata the label is q r + e, e the stratum (the F5 null keeps the
            exact component)."""
            rng = random.Random(seed)
            if strata is None:
                return array("H", [rng.randrange(M) for _ in range(U)])
            m = M // q
            return array("H", [q * rng.randrange(m) + strata[i] for i in range(U)])


        def planted_marginal_labels(U, M, seed):
            """PC-6b object: a random function of the point with a skewed marginal
            (bucket 0 with probability 1/2, the others uniform) and no arithmetic
            relation at all."""
            rng = random.Random(seed)
            out = array("H")
            for _ in range(U):
                if rng.random() < 0.5:
                    out.append(0)
                else:
                    out.append(1 + rng.randrange(M - 1))
            return out


        def planted_mixture(lab, U, M, rho, seed):
            """Resolving-floor object: per point, its own label with probability
            rho, otherwise an independent uniform label, fixed under the seed."""
            rng = random.Random(seed)
            out = array("H")
            for i in range(U):
                if rng.random() < rho:
                    out.append(lab[i])
                else:
                    out.append(rng.randrange(M))
            return out


        def quantile(vals, p):
            """Type-1 empirical quantile: the smallest v with F(v) >= p."""
            s = sorted(vals)
            k = max(1, int(math.ceil(p * len(s) - 1e-9)))
            return s[k - 1]


        def median(vals):
            s = sorted(vals)
            n = len(s)
            if n % 2:
                return s[n // 2]
            return 0.5 * (s[n // 2 - 1] + s[n // 2])


        def null_distribution(stream, S, U, M, cell_id, seed, draws=R_RL, strata=None, q=1):
            """R-2. The random-label arm's own measured distribution at (cell, M)
            on the same pairs and the same gain code: independent random labels
            under fresh recorded seeds, never resamples of an arm it judges."""
            out = []
            for r in range(draws):
                lab = random_labels(U, M, seed_of("rl", cell_id, M, q, seed, r), strata, q)
                out.append(gain(stream, S, lab, M))
            return out


        def null_summary(draws):
            """Pooled over seeds: q50, q99 and the null width W = q99 - q50."""
            vals = [d["G"] for d in draws]
            q50 = quantile(vals, 0.50)
            q99 = quantile(vals, 0.99)
            return {"q50": q50, "q99": q99, "W": q99 - q50, "draws": len(vals)}


        def read_arm(stream, S, U, lab, M, cell_id, arm, seed, strata=None):
            """One arm on one seed: the direct reading and R_SH histogram-
            preserving shuffles under recorded seeds, all on the same pairs."""
            direct = gain(stream, S, lab, M)
            sh = []
            for r in range(R_SH):
                s_lab = shuffled(lab, U, seed_of("sh", cell_id, arm, M, seed, r), strata)
                sh.append(gain(stream, S, s_lab, M)["G"])
            return {"direct": direct, "shuffle": sh}


        # --------------------------------------------------------- decision rules
        def seed_rows(readings, null):
            """Per seed: E_RL = G - q50, E_Sh = G - median(shuffles), the rank
            p-value against the shuffles, Z = E_Sh / W, and whether the arm is
            estimated (IR-12: the used conditioning cells hold at least half of
            the S pairs; a count rule would declare every skewed-marginal arm
            unreadable)."""
            W = null["W"]
            rows = []
            for s, rd in enumerate(readings):
                d = rd["direct"]
                g = d["G"]
                sh = rd["shuffle"]
                e_sh = g - median(sh)
                rows.append({
                    "seed": s, "G": g, "E_RL": g - null["q50"], "E_Sh": e_sh,
                    "p": (1 + sum(1 for v in sh if v >= g)) / (len(sh) + 1),
                    "Z": (e_sh / W) if W > 0 else None,
                    "used": d["used"], "excluded": d["excluded"],
                    "estimated": d["used"] > 0 and 2 * d["used_mass"] >= d["S"]})
            return rows


        def estimated(rows):
            return all(r["estimated"] for r in rows)


        def clause_L1(rows, null):
            """L1: the median over seeds of E_RL is at least 3 W."""
            return median([r["E_RL"] for r in rows]) >= 3.0 * null["W"]


        def clause_L3(rows, null, min_seeds=8):
            """L3: the median over seeds of E_Sh is at least 3 W, and the rank
            p-value is at its floor 1 / (R_SH + 1) on at least 8 of 10 seeds."""
            floor_p = 1.0 / (R_SH + 1)
            hits = sum(1 for r in rows if r["p"] <= floor_p + 1e-12)
            return median([r["E_Sh"] for r in rows]) >= 3.0 * null["W"] and hits >= min_seeds


        def ols_slope(xs, ys):
            n = len(xs)
            mx = sum(xs) / n
            my = sum(ys) / n
            sxx = sum((x - mx) ** 2 for x in xs)
            sxy = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
            return sxy / sxx


        def clause_L2(ladder_rows, log2_ns):
            """L2. ladder_rows[c] is the seed-row list at ladder cell c, in the
            order of log2_ns. One OLS slope of Z on log2 N per seed; the interval
            is the second smallest to the second largest of the ten slopes; L2
            holds when its lower end is at least 0."""
            nseeds = len(ladder_rows[0])
            slopes = []
            for s in range(nseeds):
                ys = [ladder_rows[c][s]["Z"] for c in range(len(log2_ns))]
                if any(y is None for y in ys):
                    return {"holds": False, "interval": None, "slopes": None,
                            "reason": "W is not positive on a ladder cell"}
                slopes.append(ols_slope(log2_ns, ys))
            ss = sorted(slopes)
            lo, hi = ss[1], ss[-2]
            return {"holds": lo >= 0.0, "interval": (lo, hi), "slopes": slopes}


        def classify_family(cells_M, lead_keys, log2_ns):
            """cells_M maps (cell, M) to {"rows": ..., "null": ...} for every
            (cell, M) read for the arm; lead_keys lists the ladder cells at their
            N^(1/3) alphabets, in the order of log2_ns. NOT-ESTIMATED when a lead
            key is not estimated; LEAD when L1 and L3 hold at every lead key and L2
            holds; NEG when L3 holds at no estimated (cell, M); ART-RES otherwise."""
            per = {}
            l3_any = False
            for key, d in cells_M.items():
                ok = estimated(d["rows"])
                l1 = ok and clause_L1(d["rows"], d["null"])
                l3 = ok and clause_L3(d["rows"], d["null"])
                per[key] = {"estimated": ok, "L1": l1, "L3": l3}
                l3_any = l3_any or l3
            if not all(per[k]["estimated"] for k in lead_keys):
                return {"verdict": "NOT-ESTIMATED", "per_cell": per, "L2": None}
            l2 = clause_L2([cells_M[k]["rows"] for k in lead_keys], log2_ns)
            if all(per[k]["L1"] and per[k]["L3"] for k in lead_keys) and l2["holds"]:
                verdict = "LEAD"
            elif not l3_any:
                verdict = "NEG"
            else:
                verdict = "ART-RES"
            return {"verdict": verdict, "per_cell": per, "L2": l2}

