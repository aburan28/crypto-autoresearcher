    heur_b2_thresholds:
      rule: >-
        R-11. For each k, the largest per-level gain g*_k (log2 G) at which the
        ideal k-tree of the ceiling model, run with gain G at each of its j - 1
        internal levels, keeps its total at or above matched rho, in the table's
        declared ambient (N = l). With gain G the main term is log2 R + log2(k L)
        + (j - 1)(log2 L - log2 G); the condition is 2^main + 2^LA >= 2^rho.
        c_k = g*_k / 129.0000, so the condition reads G <= l^(c_k). A tree whose
        total at G = M already lies above rho is unconstrained (g* = log2 L).
      rows:
        - {k: 4, orbit: without, g_star_bits: 43.0000, c: 0.3333, binding: false}
        - {k: 4, orbit: with, g_star_bits: 43.0000, c: 0.3333, binding: false}
        - {k: 8, orbit: without, g_star_bits: 32.2500, c: 0.2500, binding: false}
        - {k: 8, orbit: with, g_star_bits: 31.5799, c: 0.2448, binding: true}
        - {k: 16, orbit: without, g_star_bits: 24.0768, c: 0.1866, binding: true}
        - {k: 16, orbit: with, g_star_bits: 21.3859, c: 0.1658, binding: true}
        - {k: 32, orbit: without, g_star_bits: 18.2978, c: 0.1418, binding: true}
        - {k: 32, orbit: with, g_star_bits: 16.2894, c: 0.1263, binding: true}
      steps: >-
        k = 16 without: LA 55.6000 is 5.209 bits below rho, so main must reach
        60.8090 + log2(1 - 2^-5.209) = 60.8090 - 0.0395 = 60.7695; main(G = M) is
        55.6000; 3 (25.8000 - g) >= 5.1695 gives g <= 25.8000 - 1.7232 =
        24.0768. k = 32 without: LA 48.0000; the correction is 0.0002 bit; 4
        (21.5000 - g) >= 60.8088 - 48.0000 = 12.8088 gives g <= 21.5000 - 3.2022
        = 18.2978. k = 16 with: LA 39.5332, correction below 1e-6; 3 (25.8000 -
        g) >= 60.8090 - 47.5666 = 13.2424 gives g <= 25.8000 - 4.4141 =
        21.3859. k = 32 with: 4 (21.5000 - g) >= 60.8090 - 39.9666 = 20.8424
        gives g <= 21.5000 - 5.2106 = 16.2894. k = 8 with: LA 51.4332 is 9.376
        bits below rho, correction 0.0022; 2 (32.2500 - g) >= 60.8068 - 59.4666 =
        1.3402 gives g <= 32.2500 - 0.6701 = 31.5799. k = 4 both and k = 8
        without: main at G = M already above rho, unconstrained. c = g / 129.
      named_exponent: >-
        The binding row of the without-orbit line (the unconditional one of the
        pair, still under the ceiling label) is k = 32: c* = 0.1418, g* =
        18.2978 bits. On the doubly conditional with-orbit line it is k = 32:
        c = 0.1263, g* = 16.2894 bits. These are the c of R-11, "the c for
        which the tree at the exact capacity stays above matched rho": a
        declared arm whose level-1 gain at n = 131 and alphabet L_k exceeded
        l^(c_k) would make the k-tree of that row fall below matched rho under
        the ceiling model, so HEUR-B2's consequent can fail in principle.
      scope: >-
        Design figures under the ceiling model at k in 4, 8, 16, 32 only; for
        larger k the thresholds tighten further (not tabulated, not claimed).
        None is a cost, a prediction or an outcome. Measuring G at n = 131 at
        these alphabets is out of reach of this instrument (rule R-S at
        M = 2^25.8 would need S of about 2^58.6), which is why the consequent
        is a transfer statement.

