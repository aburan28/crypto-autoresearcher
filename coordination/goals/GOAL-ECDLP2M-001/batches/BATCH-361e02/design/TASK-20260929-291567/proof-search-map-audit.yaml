            - {k: 32, needed_bits: 21.5000, capacity_bits: 0.0000, gap_bits: 21.5000, log2_per_attempt: 26.5000, closure_log2: 112.5000}
          steps: >-
            closure = log2(k L) + (j - 1) x gap: k = 4, 45.0000 + 1 x 43.0000;
            k = 8, 35.2500 + 2 x 32.2500 = 35.2500 + 64.5000; k = 16, 29.8000 +
            3 x 25.8000 = 29.8000 + 77.4000; k = 32, 26.5000 + 4 x 21.5000 =
            26.5000 + 86.0000.
        full_group_ambient:
          ambient: N = 4l, log2 N = 131.0000; capacity 2 bits (alphabet 4), from the certificate's full-group line
          rows:
            - {k: 4, needed_bits: 43.6667, capacity_bits: 2.0000, gap_bits: 41.6667, log2_per_attempt: 45.6667, closure_log2: 87.3333}
            - {k: 8, needed_bits: 32.7500, capacity_bits: 2.0000, gap_bits: 30.7500, log2_per_attempt: 35.7500, closure_log2: 97.2500}
            - {k: 16, needed_bits: 26.2000, capacity_bits: 2.0000, gap_bits: 24.2000, log2_per_attempt: 30.2000, closure_log2: 102.8000}
            - {k: 32, needed_bits: 21.8333, capacity_bits: 2.0000, gap_bits: 19.8333, log2_per_attempt: 26.8333, closure_log2: 106.1667}
          steps: >-
            L = 131.0000 / (j + 1): 43.6667, 32.7500, 26.2000, 21.8333; per
            attempt L + j; gap L - 2; closure per attempt + (j - 1) x gap: k = 4,
            45.6667 + 41.6667; k = 8, 35.7500 + 2 x 30.7500 = 35.7500 + 61.5000;
            k = 16, 30.2000 + 3 x 24.2000 = 30.2000 + 72.6000; k = 32, 26.8333 +
            4 x 19.8333 = 26.8333 + 79.3333. The k = 16 values 24.2000 and
            102.8000 agree with the version-1 validator's (DEV-J1-1).
        reading: >-
          In either ambient the closure line at the exact capacity lies far
          above matched rho (at least 2^87.3 per attempt at every k in the
          table). These are design figures under the ceiling model; they assert
          no cost of any construction. Only the gap, closure and per-attempt
