          j: 2
          log2_L: 43.0000
          log2_per_attempt: 45.0000
          without_orbit: {log2_relations: 43.0000, log2_main_term: 88.0000, log2_linear_algebra: 88.0000, log2_total: 89.0000, ceiling_margin_against_rho_bits: +28.1910}
