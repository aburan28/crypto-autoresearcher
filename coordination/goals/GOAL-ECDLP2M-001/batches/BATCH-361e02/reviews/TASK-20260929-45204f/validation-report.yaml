          finding: >-
            The code tests that no reuse target is unsolved. A target solved
            on exactly its 100000th attempt "reaches 100000 attempts" in the
            text but passes the code. S5's halt wording has the same boundary.
          consequence: >-
            The event has probability of order e^-1984 on CTRL-ZN and is far
            smaller still on the binary cells at mu about 1. The intent (the
            ceiling was hit) is the same. Recorded for exactness only.
