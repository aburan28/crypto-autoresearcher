            the curve, table/schoolbook agreement on 100 pairs, and oracle A
            against a brute-force enumeration on 10 targets.
            binstd_core.stage2_outcome takes no input for them. The I3, I4
            and I5 code (gf2_19.py, bincurve.py, oracle_a19.py, driver.py,
            verify.py) is not committed and is outside IR-6.
          consequence: >-
            Certificates (CERT-REL, CERT-DL, IR-2) catch unsound oracle
            output. The I1 defects a self-test would find are largely caught
            by G1 (CERT-LOG, T_delta). Nothing gates oracle A's completeness.
            An oracle that systematically misses decompositions on some
            columns would depress delta_hat, u_hat and T_cmp on both binary
            cells, read LOW-COV and reach H1-NEGATIVE-COVERAGE, a declared
            NEGATIVE outcome, from an instrument defect. Only the
            falsification_note's general principle ("an instrument failure
            ... is never evidence") would stand in the way, and no rule
            operationalises it. A LOW-RETRY pair is already routed to an
            instrument audit; a LOW-COV pair is not. This is a
            pre-registration gap, not a mathematical result. The remedy is
            one clause adding the step 2 self-tests to CTL-7 and S3, or a new
            invalidation rule. It is not scored as breaking: the plan's "a
            Stage 2 instrument ungated" is tied in the joint text to I1 and
            I2, which G1 gates, and "an undefined self-test curve" does not
            apply because no curve remains. The composer may weigh it
            against K-approve.
