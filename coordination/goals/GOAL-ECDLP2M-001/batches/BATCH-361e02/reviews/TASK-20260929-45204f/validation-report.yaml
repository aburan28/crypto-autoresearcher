          severity: moderate (not on the plan's J2 breaking list as written; fix before execution)
          field: E procedure step 2; E instruments I1.specification (self-test) and I4.specification (self-tests); E controls CTL-7; E stopping_rules S3; E invalidation_rules
          finding: >-
            Only two of the procedure step 2 self-tests are wired to a
            consequence, both as CTL-7 admission rules that halt a cell under
            S3: AR-FIELD (the I3 field self-test) and AR-ORDER (the I4 order
            check). The I1 self-test (a seeded 6-unknown system) and the
            other I4 self-tests have no declared stop, halt or invalidation
            rule, and procedure step 2 carries no "stop unless" clause, while
