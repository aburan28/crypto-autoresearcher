            computes the envelope, m = 5 and sub-cap values but not the cap
            slice's. The text states the comparator memory only at two g = 0
            upper ends, yet E says "both memories are stated".
          consequence: >-
            The charge exists by rule and is computable. The largest
            comparator memories, the ones that show the envelope's upper L are
            unrealisable on the comparator side too, are not printed beside
            their figures.
