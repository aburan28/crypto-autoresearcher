    findings:
      - id: DEV-V-J2-1
        severity: minor
        breaks_joint: false
        kind: text-versus-code mismatch on PC-9 (R-7), not a mathematical result
        text: >-
          PC-9, as coded and as stated in SR-1, compares the median of ten
          curve-sampled readings with the 0.005 and 0.995 quantiles of 200
          index-sampled readings, both through the same gain code.
          population_gain (the exhaustive value on CELL-K13) is computed and
          returned but enters no criterion. The sheet's OC-2 separator says
          "PC-9 pins the estimator against the exhaustive population
          (CELL-K13)" and its R-7 discharge row says "PC-9 exhaustive on
          CELL-K13"; both describe a pin that neither the code nor SR-1
          implements. Version 1's criterion ("the sampled G lies inside its
          bootstrap interval around the exhaustive G") was redefined, and the
          redefinition is not listed in PD-4. The redefined check is
          well-formed and blocking (IR-11). It is also the right comparator
          once R-8 removed the bootstrap, because a sampled maximum is biased
          upward against its population value. The defect is only that the
          text claims more than the code checks.
      - id: DEV-V-J2-2
        severity: minor
        breaks_joint: false
        kind: ordering-rule wording (PC-10) against PC-9's arm
        text: >-
          The PC-9 filter f2_at_0 is the declared family arm F2 at offset 0
          (ORD-F2@0 on CELL-O19). It is read at the gate at an alphabet that is
          also a family alphabet of the cell: CELL-K13 at 8, CELL-K19 at 16 and
          CELL-O19 at 16. Streams are deterministic (seed_of("stream", cell,
          seed)), so the Stage 2 stream of the same (cell, seed) is identical,
          and the gate's PC-9 readings are the same direct G values Stage 2
          later reports for that arm. That sits against the letter of PC-10
          ("NO KOBLITZ-SPECIFIC ARM IS READ ON A CELL BEFORE ... PC-9 PASS").
          The note "never reused as a Stage 2 reading" is only nominally true.
          There is no outcome risk: every criterion is frozen before any run
          (IR-16), and only a direct G, never a shuffle, rank or
          classification, is computed at the gate. Remedy if wanted: a PC-9
          filter outside the declared family, or a separate stream label for
          PC-9.
      - id: DEV-V-J2-3
        severity: minor
        breaks_joint: false
        kind: unpinned code branch (DF-7), not in the R-list
        text: >-
          The four F5 arms use shuffled(..., strata) and the stratified
          random-label null. No gate check exercises that branch: PC-6a and
          PC-6b use the unstratified shuffle only, and a prime-l cell has no
          exact control above alphabet 4 to exercise it. The branch is correct
          by static read and by this review's dry call (C cases of
          j2_shuffle_dry.py). A defect in it would still go undetected at run
          time; its failure direction is a false NEG for the F5 arms, not a
          false LEAD. R-1's gate-check requirement is met for the shuffle R-1
          defines.
      - id: DEV-V-J2-4
        severity: minor
        breaks_joint: false
        kind: completeness of the committed instrument (C7, HEUR-B1); carried from version 1
        text: >-
          HEUR-B1's validation, procedure S2-5, has no committed code. It
          calls for 200 list pairs of 2^8 points, 262 targets, direct pair-sum
          counting, a chi-squared test against Binomial(2^16, 262 / N_E) and
          the maximum count against the Binomial upper tail. No function in
          the seven blocks counts pair sums or computes a chi-squared
          statistic or its quantile. Yet inputs.instrument.missing_instruments
          says "None. The executor writes only the run driver that calls the
          committed functions." The text also fixes no chi-squared binning and
          no degrees of freedom, although HEUR-B1's falsification condition
          ("exceeds its 99th percentile") depends on them, so a post-hoc
          binning freedom remains. The plan is carried unchanged from version
          1, where DEC-20260928-9d9c47 J2 found it to carry sample, predicted
          distribution, comparison and tail. HEUR-B1 bears only on the shape of
          the (C4) floor, never on an arm's classification.
      - id: DEV-V-J2-5
        severity: minor
        breaks_joint: false
        kind: internal inconsistency on an advisory ceiling (R-8)
        text: >-
          The sheet's cost_table.advisory_ceilings gives maximum_runs 12. The
          frozen specification's budget and the hypothesis test_boundary give
          16, with the reason: seven scientific runs, a possible seed-block
          split and up to eight infrastructure reruns. The specification
          governs. The cost-table arithmetic reproduces from its stated unit
          costs, in spot checks: CELL-K23 streams 46060 s against 46140;
          CELL-K23 counting passes 28954 s against 28950; component sum
          212890 s against "about 212600". The unit costs themselves are cited
          timings, not re-measured here.
      - id: INF-J2-a
        severity: informational
        text: >-
          PC-5 reads the composite exact filters with exact_gain_stream, a
          streaming reader separate from gain (the family estimator), because
          the flat counter needs M^3 at most 2^24. Its reading is M or None by
          construction. So PC-5 shows that the exact streaming reader sees
          capacity at 548 and 956. gain itself is pinned by PC-1 (8 to 128),
          PC-3 (2) and PC-4 (4), which covers every alphabet a family arm is
          read at.
      - id: INF-J2-b
        severity: informational
        text: >-
          PC-10 has no code-level guard: stage2_cell does not check for a
          passed gate record. Ordering rests on S1-4, IR-14 and the executor's
          driver, which is not committed.
      - id: INF-J2-c
        severity: informational
        text: >-
          CODE-GATE's docstring cites "procedure S1-0 to S1-7" and runs
          z_ladder before the CELL-K17C gate. The specification has S1-0 to
          S1-4 and orders the CELL-K17C gate first. All run-level controls must
          pass before any Koblitz arm is read, so the order carries no science.
      - id: INF-J2-d
        severity: informational
        text: >-
          The pinned reference_sha256 values were computed by the top-level
          session at the producer's request (sheet PD-1) and re-derived by the
          snapshot receipt. This review reproduces all seven from the
          committed bytes by two disjoint routes, so the pins bind the bytes
          whoever computed them.
