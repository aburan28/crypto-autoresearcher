          every seed's shuffle median is at most q99 and within W of q50:
          Z/8012 at M = 4 gives medians 1.339 to 1.396 against q50 1.378 and
          q99 1.541; M = 64 gives 5.486 to 5.886 against q50 5.647 and q99
          6.857. The shuffle COLLAPSES the exact control. The PLANTED
          marginal-only filter at M = 8 and 16 (Z/8012) and M = 16 and 64
          (Z/523492) keeps its reading. G medians 4.430, 8.784, 8.760 and
          33.734 against shuffle medians 4.398, 8.729, 8.697 and 33.863.
          E_Sh median over W is 0.10, 0.07, 0.08 and -0.16, and kept over W is
          7.5, 11.6, 11.7 and 26.9, all at least 3. L1 holds and L3 does not,
          so PC-6b passes: the shuffle PRESERVES the marginal-only filter.
          Twenty independent synthetic replicates: PC-6a 20/20 at M = 2 and 4,
          and PC-6b 20/20 at M = 8 and 16; the largest rank-floor count on any
          replicate was 5 of 10. THE GATE CAN FAIL. With the shuffle replaced
          by the identity map, or by a version-1-style alphabet relabelling,
          PC-6a fails (shuffle median 4.0 against q99 1.58). With a
          marginal-destroying uniform relabel, PC-6b fails (kept/W 0.03, and L3
          fires). The shuffle neither preserves both nor destroys both. DF-7
          stratified branch: an exact mod-16 composite with strata i mod 4
          collapses to the stratified null (shuffle medians 6.01 to 6.34
          against q50 6.11 and q99 6.90), and a planted 4t + e label is
          preserved (E_Sh/W -0.03, L3 false). Disjoint checker: my own
          collections.Counter implementation of G equals est.gain on every
          field in all 80 cross-checked direct readings and all 50
          cross-checked shuffled readings. Every checked shuffle preserves the
          label histogram exactly, and within strata the per-stratum
          histograms, while moving 676 to 28735 labels.
      - item: (iii) The measured null is drawn from independent random labels, not from resamples of the arm it judges
        computed: static read of CODE-EST, CODE-GATE and CODE-FAM; dry calls as in (ii)
        result: >-
          null_distribution draws R_RL = 20 fresh uniform random labels per
          seed, under seed_of("rl", cell, M, q, seed, r), on the same pairs and
          through the same gain code. null_summary pools 200 draws; q50 and q99
          are type-1 quantiles (q99 is the third largest) and W = q99 - q50. No
          function passes an arm's labels or readings into the null.
          gate_cell builds the null independently of every arm. stage2_cell's
          F5 null is the stratified random label 4r + h4 (fresh labels).
          RLFAM uses disjoint seed labels ("rlfam") and is judged against the
          gate null. PC-1 uses 10 fresh draws per seed, as its criterion
          states. The percentile bootstrap is gone. The plan's prior item (d)
          and its named break (a null taken from the resamples it judges) do
          not occur.
      - item: (iv) The identity replacement reads G = M at the declared S, or its exemption is stated with the vacuity
        result: >-
          The identity arm is removed and its vacuity stated: under MIN_CELL it
          reads 0, and without the exclusion G = M for any label. CTL-MAXEXACT
          replaces it. gain reads G = M exactly on exact filters at
          S = 128 M^2, with every used cell a point mass. In the dry calls the
          reading was EXACT and OCCUPIED on every seed at M = 2, 4, 16 and 64,
          with 253 to 256 of 256 cells used at M = 16. PC-5's 548 and 956 use
          exact_gain_stream (INF-J2-a) and are readable at 2^26 and 2^27
          (J1 (ii)).
      - item: (v) Each R-10 repair in code
        result: >-
          Present (static read). to_nb solves by Gauss-Jordan elimination:
          f2_inverse_columns returns the rows of B^-1, and to_nb takes parities
          of those rows against a, which is B^-1 a. NormalBasis.self_check
          tests the round trip and that squaring is the cyclic shift.
          find_generator (order exactly N by the route-B test) and build_dlog
          (raises unless the walk meets N distinct points and N g = O, so the
          table has N entries) are wired into setup_cell for AR-B1-C. Seeds
          0 to 9 are enumerated (est.SEEDS) in gate_cell, stage2_cell,
          pc1_exact_grid and z_ladder. trial_division and primality_record
          record the 10^4 bound, the factors and the complete flag. SR-1 names
          PC-7's factor 1.5 and PC-14 to 1e-6.
      - item: (vi) Every approval field; supersedes; version-2 and version-1 hashes
        result: >-
          All present (j2_fields.py). Specification: status review_required;
          approved_by null; the approval block (approved_by null,
          composing_decision DEC-20260929-8c3cb2, rule,
          implementation_authorized false, scientific_execution_authorized
          false, execution_state, status_advance_note); review_required true;
          runs_launched 0; assigned_to executor; inference_for_execution; all
          23 experiment template fields. Hypothesis: status specified;
          approved_by null; composing_decision DEC-20260929-8c3cb2;
          runs_launched 0; all 17 hypothesis template fields. HEUR-B1 and
          HEUR-B2 each carry all six heuristic template fields and a
          validation_plan. Supersedes: H-BINSTD-de2808 names H-BINSTD-0126fe,
          EXP-BINSTD-6f1e66 names EXP-BINSTD-de9678, and the sheet names both
          plus supersedes_audit. Record_kind is superseding_restatement, and
          both supersession notes cite DEC-20260928-9d9c47 (R-FORM). Hashes
          are as in object_under_review.
