  # ===========================================================================
  J1:
    joint: >-
      Stage 0, ambients, ladder and the repriced sample grid (C2, C3, C6; R-3
      arithmetic, R-4, R-7 certificate readings, R-9, R-12).
    verdict: holds
    attack_items:
      - item: (i) Koblitz a = 0 orders for every declared ladder cell, recomputed, and admissibility
        computed: >-
          Own code (j1_orders.py, j1_counts.py), with no producer module
          imported. Route L is the linear recurrence. Route F is tau^n by
          square-and-multiply in Z[tau]/(tau^2 + tau + 2), a different
          algorithm. Both run for n = 3 to 63 and n = 131 and agree everywhere.
          Factorisations come from sympy.factorint. Primality comes from sympy
          BPSW and own 40-base Miller-Rabin, plus complete trial division to the
          square root for every odd part below 2^42 (a proof). Third route: a
          brute-force point count over my own GF(2^n) arithmetic, with field
          polynomials chosen by my own rule (they differ from the contract's for
          every Koblitz cell). Fourth: route-B order proofs with my own affine
          curve arithmetic (a point of order exactly N and exactly one multiple
          of N in the Hasse window) on all seven curve cells.
        result: >-
          Admissible a = 0 degrees below 64 are exactly 5, 7, 9, 13, 19, 23, 41.
          The declared ladder cells are AR-B1-admissible, each odd part proved
          prime by complete trial division: CELL-K13 8012 = 4 x 2003, CELL-K19
          523492 = 4 x 130873 and CELL-K23 8383412 = 4 x 2095853. So is the
          fixed-alphabet cell CELL-K41, 2199025563772 = 4 x 549756390943. Not
          declared, and inadmissible: n = 29, 536830604 = 4 x 8353 x 16067; and
          n = 31, 2147574356 = 4 x 373 x 1439393. CELL-K17C is 130972 =
          4 x 137 x 239, the composite control as declared. Brute force equals
          8012, 130972, 523492 and 8383412; route B proves every declared order,
          including n = 41. The ordinary cells also check out (J2 R-6 input):
          CELL-O19 is 523646 = 2 x 261823 and CELL-RC1 is 130412 = 4 x 32603,
          each by brute force over the contract's named field polynomial and
          by route B. Every odd prime factor of every declared curve cell's
          order (2003, 137, 239, 130873, 2095853, 549756390943, 261823 and
          32603) is proved prime by complete trial division
          (j1_small_primes.py). The sheet's hand chain s_2 to s_41 (40 values) matches
          the recurrence entry by entry. Deployed row: 2^131 + 1 - s_131 =
          4 x 680564733841876926932320129493409985129, the Bailey Appendix A
          value (source bytes hash to their .sha256 file). Every declared
          ladder order equals its design-time input.
      - item: (ii) S per (cell, M) from the contract's rules, to 0.01 bit; the composite 548 and 956 carry their own S
        computed: >-
          j1_stage0.py (mpmath, 50 digits). Rule R-M (N = l, r = floor(log2 N /
          p + 1/2)) and rule R-S (s = ceil(log2(128 M^2))) were applied to every
          row of stage_0.sample_table (twelve cell rows, the gate rows, the Z/l
          ladder rows and the Z/2^17 grid), with the #E reading, S/M^2, the
          100 x M^2 comparison and the per-cell totals.
        result: >-
          Every M, S and log2 S equals the frozen table exactly (0 bit, inside
          0.01). Every S is at or above 100 x M^2. For M a power of two,
          log2 S - log2(100 M^2) = 0.3561. At 548, S = 2^26 against
          2^24.8399; at 956, S = 2^27 against 2^26.4456. So the composite
          alphabets carry their own S, with 223.47 and 146.86 pairs per
          conditioning cell. The #E-reading column reproduces (shown, not used).
          Totals reproduce exactly, for example CELL-K23 2263552 and all curve
          cells 204822016 = 2^27.6098. The N reading (l) and the rounding rule
          (round half up) are stated. Only CELL-O19 at N^(1/4) sits near a
          rounding boundary (log2 N / 4 + 1/2 = 4.99956); the contract records
          this, and M = 16 is determinate given N = 261823. Readability: at
          the declared S an exact homomorphism leaves an expected 2e-15
          (M = 548) and 16 of 913936 (M = 956) cells below MIN_CELL (exact
          Poisson tails, j1_occupancy.py), so PC-5's "at least half the cells
          used" is met with near certainty.
      - item: (iii) Gap column and closure line in each ambient; the declared ambient is the one used
        computed: >-
          j1_stage0.py, both ambients, k = 4, 8, 16 and 32. Also the whole
          ceiling table (relations, main term, linear algebra, total, margin
          and memory, with and without orbit unknowns), matched rho, DC-B1 and
          the HEUR-B2 threshold arithmetic (checked for its ambient only;
          HEUR-B2's substance is J3's).
        result: >-
          Target subgroup (N = l, capacity 0 bits): gap 43.0000, 32.2500,
          25.8000, 21.5000; closure 88.0000, 99.7500, 107.2000, 112.5000. Full
          group (N = 4l, capacity 2 bits): gap 41.6667, 30.7500, 24.2000,
