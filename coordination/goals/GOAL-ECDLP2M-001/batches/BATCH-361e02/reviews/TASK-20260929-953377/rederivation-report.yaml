    - 'Factorisations: own Pollard-Brent rho with Miller-Rabin, identical to sympy.factorint for every n; product re-multiplied. Every prime factor
      (83 distinct primes across Q1, Q2, Q5) carries an elementary recursive Lucas N-1 certificate ending in trial division below 2^20. No recalled
      deterministic-MR bound is load-bearing.'
    - 'Admissibility requires v2 = 2 and #E/4 certified prime, plus a cyclic 2-Sylow (argument below, and a computed point of order exactly 2^v2
      for every n).'
    two_sylow_argument: 'In the model y^2 + xy = x^3 + a x^2 + b with b != 0, -(x, y) = (x, x + y), so P = -P iff x = 0. x = 0 forces y^2 = b,
      which has exactly one root in F_{2^n} because squaring is bijective. So E(F_{2^n})[2] = {O, (0, sqrt b)} has order 2, and a finite abelian
      2-group whose 2-torsion has order 2 is cyclic. Hence the 2-Sylow subgroup is cyclic for every n (and for both ordinary controls). For this
      curve, [2](1,0) = (0,1) and [4](1,0) = O, so (1,0) in E(F_2) has order 4 and lies in every E(F_{2^n}): 4 | #E_n and a point of order 4 exists
      for every n. Computed certificate: for every n a point of order exactly 2^v2(#E_n) was found, and (1,0) was checked to have order 4 in each
      field.'
