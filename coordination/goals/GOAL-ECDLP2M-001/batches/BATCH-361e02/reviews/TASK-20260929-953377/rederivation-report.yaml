  Q1_koblitz_orders_and_admissibility:
    method:
      A_weil_recurrence_all_n: 'Enumerating F_2^2 gives E(F_2) = {O, (0,1), (1,0), (1,1)}, so #E(F_2) = 4, Frobenius trace t1 = 2+1-4 = -1, Frobenius
