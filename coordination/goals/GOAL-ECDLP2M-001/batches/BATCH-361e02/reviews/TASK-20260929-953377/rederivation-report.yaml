      gap_bits: '19.8333'}
    capacity_argument: 'Claim: for a finite abelian group G, an exactly sum-compatible h from G onto a set of size M exists iff M divides |G|.
      (Only if.) Write P ~ P'' when h(P) = h(P''). If P ~ P'', then for every Q, h(P+Q) = f(h(P), h(Q)) = f(h(P''), h(Q)) = h(P''+Q), so ~ is
      invariant under translation. Let H be the class of 0. Translating by -P'' and by +P'' shows that P ~ P'' iff P - P'' ~ 0, that is, iff P
      - P'' is in H. H is closed under addition (a ~ 0 and b ~ 0 give a+b ~ b ~ 0) and under negation (a ~ 0 gives 0 ~ -a), so H is a subgroup.
      The fibres of h are exactly the cosets of H, hence M = [G:H] = |G|/|H| divides |G| (Lagrange). This direction never uses invertibility of
      f. (If.) A finite abelian group has a subgroup of every order dividing |G|: it is the direct sum of its Sylow p-subgroups, and a p-group
      of order p^a has subgroups of every order p^b (induction: take C of order p by Cauchy, and pull back a subgroup of order p^(b-1) of G/C).
      Take H of order |G|/M, h the quotient map G -> G/H (onto M elements) and f the group law of G/H. Then h(P+Q) = h(P) + h(Q), and f(u, .)
      and f(., v) are translations of G/H, hence bijections. So the invertibility requirement never binds, and the capacity below X equals log2
      of the largest divisor of |G| strictly below X. It depends only on |G|, not on the group''s structure. Target subgroup, |G| = l with l prime
      (certified) and X = l: the divisors are 1 and l, the only one strictly below l is 1, so the capacity is log2 1 = 0 bits (M = 1 counts, Q0-4).
      Full group, |G| = 4l with l an odd prime > 4: the divisors are 1, 2, 4, l, 2l, 4l; those strictly below l are 1, 2, 4; the capacity is log2
      4 = 2 bits. Control: an exhaustive search over every set partition of 13 small abelian groups (orders 2 to 10, cyclic and non-cyclic) found
      the realisable M to be exactly the divisors of |G| in every case, and invertibility never failed once f was well defined.'
