      C_bsgs_python: 'n = 4-9,12-63. For random points (own sampler, uniformity checked), BSGS finds k in the Hasse interval [q+1-floor(2 sqrt
        q), q+1+floor(2 sqrt q)] with [k]P = O. Exact point orders come from stripping prime factors of k; the candidates are the multiples of
        the lcm of the point orders in the interval, filtered by further points. A single survivor is the order (the true order survives every
        filter). Seeded random irreducible modulus per n. For n = 3, 10, 11 the group exponent is too small against the Hasse width (candidates
        {"3": [4, 8, 12], "10": [968, 1056], "11": [2024, 2116]}); those n are settled by B, B2 and D.'
