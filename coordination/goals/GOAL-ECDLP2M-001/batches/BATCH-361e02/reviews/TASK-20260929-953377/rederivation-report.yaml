  Q2_control_cell_orders:
    method: 'Three independent determinations per ordinary control over the card''s modulus: B (exhaustive trace walk, C), B2 (exhaustive image
      bitmap with Fermat inversion, separate C program), C (Python BSGS in the Hasse interval, a unique candidate). Moduli checked irreducible
      (Rabin) and primitive (2^19-1 and 2^17-1 are prime); the B walk re-certifies primitivity. Factorisation by own rho, identical to sympy,
      with certificates for every prime.'
    ordinary_control_one:
      curve: y^2 + x y = x^3 + A x^2 + B over F_2[t]/(t^19 + t^5 + t^2 + t + 1)
      A: 46693
      A_as_polynomial: t^15 + t^13 + t^12 + t^10 + t^9 + t^6 + t^5 + t^2 + 1
      B: 306147
      B_as_polynomial: t^18 + t^15 + t^13 + t^11 + t^9 + t^8 + t^7 + t^6 + t^5 + t + 1
      modulus_irreducible: true
      modulus_primitive: true
      order: 523646
      factorization: 2 * 261823
      largest_prime_factor: 261823
      method_values:
        B_walk: 523646
        B2_as_bitmap: 523646
        C_bsgs: 523646
      methods_agree: true
      hasse_interval:
      - 522841
      - 525737
      factorisation_checks:
        own_equals_sympy: true
        product_ok: true
        all_factors_prime_both_tests: true
      extra_not_requested:
        v2: 1
        two_sylow_cyclic: true
        point_of_order_4: false
    ordinary_control_two:
      curve: y^2 + x y = x^3 + A x^2 + B over F_2[t]/(t^17 + t^3 + 1)
      A: 97044
      A_as_polynomial: t^16 + t^14 + t^13 + t^12 + t^11 + t^9 + t^8 + t^4 + t^2
      B: 126251
      B_as_polynomial: t^16 + t^15 + t^14 + t^13 + t^11 + t^10 + t^8 + t^5 + t^3 + t + 1
      modulus_irreducible: true
      modulus_primitive: true
      order: 130412
      factorization: 2^2 * 32603
      largest_prime_factor: 32603
      method_values:
        B_walk: 130412
        B2_as_bitmap: 130412
        C_bsgs: 130412
      methods_agree: true
      hasse_interval:
      - 130349
      - 131797
      factorisation_checks:
        own_equals_sympy: true
        product_ok: true
        all_factors_prime_both_tests: true
      extra_not_requested:
        v2: 2
        two_sylow_cyclic: true
        point_of_order_4: true
    generic_control:
      definition: 'Z/lZ, l = the odd prime factor of #E_19'
      E_19: 523492
