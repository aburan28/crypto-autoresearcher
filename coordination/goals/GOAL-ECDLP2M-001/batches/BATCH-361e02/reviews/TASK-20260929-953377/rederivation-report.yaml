      B_exhaustive_trace_walk_C: 'n = 3-32. #E = q + 1 + sum over x != 0 of (-1)^(Tr(x) + Tr(sqrt(b)/x)), since z^2 + z = c has 2 roots if Tr(c)
        = 0 and none otherwise, and x = 0 gives the single point (0, sqrt b). x runs over t^i and 1/x over t^-i for the smallest primitive modulus;
        the walk certifies that t has order exactly 2^n - 1 (0 early returns in every run), which also certifies irreducibility.'
      B2_exhaustive_image_bitmap_C: 'n = 3-24. A separately written program with a different multiplication routine and the largest irreducible
        modulus: an explicit image table of z -> z^2 + z with multiplicities, Fermat inversion x^(q-2), and a brute-force root count for y^2 =
