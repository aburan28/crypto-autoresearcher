          - {where: "H-BINSTD-de2808 461", quote: "speedup = M pi_c <= 1 + M^2 Lambda_W, reaches p^(o(1)) ONLY FOR M AT MOST p^(1/4)", class: "Q (KN-FIND-ffe1df's repaired bound; checked against the finding, lines 61-68)"}
          - {where: "H-BINSTD-de2808 437-445", quote: "These are the largest gains at which the ideal k-tree of the ceiling model ... keeps its total at or above matched rho ... an arm whose G_131 exceeded l^0.1418 at L_32 would falsify Q", class: "T (see RT-O2: its antecedent is met by F1's raw G at zero compute)"}
