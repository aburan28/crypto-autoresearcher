        result: FAILS the signature (breaks)
        detail: >-
          C2: classify_family returned LEAD in 7 of 7. L3 held at all eight
          (cell, M) in every replicate, with the rank floor on 10 of 10 seeds;
          controlled excess 2.96, 9.68 and 18.0 at K13@16, K19@64 and K23@128;
          Z about 6.3, 9.0 and 10.3. C5 (contract code): E_Sh 2.91 (K13) and
          9.71 (K19), with L3. C9 (toy n = 9 curve, contract F1 code): F1
          parity equals h2 on all 17044 sampled points whose F1 bucket is
          parity-pure; parity propagates exactly on 12508 of 12508 all-pure
          triples; L1 and L3
          at M = 8 and 16 (E_Sh 2.08 and 4.23, rank floor 10 of 10). Under a
          shuffle stratified by h2 (the DF-7 remedy) the excess vanishes: C2
