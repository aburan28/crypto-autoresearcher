          arithmetic had E_Sh of 0.05 and -0.12 against 0.21 and 0.89; L3
          fails. Both are preserved.
      PTM-E:
        object: >-
          Added by this report. The declared arm F1's structure with nothing
          else: weight classes whose parity is the exact E/2E homomorphism.
          It was run on synthetic Z/4lZ at the declared ladder shapes
          (C2 F1MODEL), on synthetic data at the K13 and K19 shapes through
          the contract's own shuffle (C5 arm c), and with the contract's own
          F1 label code on the non-declared a = 0 Koblitz curve over F_2^9
          (C9).
        known_truth: >-
          The object has no content beyond the 1-bit E/2E quotient that the
          certificate already counts, so "an approximate filter beyond the
          certificate" and "the route is live" are false for it. The contract's
          own DF-7 states the principle: an exact component alone gives "a
          large excess on every cell, satisfying L1 and L3 with no family
