    - {ref: "Fong, Hankerson, Lopez, Menezes, Field inversion and point halving revisited, CACR CORR 2003-18", provenance: retrieved, version: "CACR technical report PDF (sha256 e79f19c6...), not the IEEE ToC 2004 version", verified_by: TASK-20260929-7d8385, used_for: "Tr(c) = sum of normal-basis coordinates (4.2); Lemma 4.1(iv); Knudsen and Schroeppel attribution (Section 1)"}
