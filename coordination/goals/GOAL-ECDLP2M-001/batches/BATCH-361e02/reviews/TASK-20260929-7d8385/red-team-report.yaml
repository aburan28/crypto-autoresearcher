    proves_too_much:
      PTM-A:
        object: the composite-order n = 17 Koblitz cell (a = 0), certificate function and PC-5 gate at the declared S
        result: meets the failure signature (holds)
        detail: >-
          Order 130972, by a recurrence written here (#E(F_2) = 4, trace -1),
          by CODE-CORE order_lucas, and by route C inside setup_cell. Trial
          division written here gives {2: 2, 137: 1, 239: 1}. CODE-CERT gives
          the full twelve-divisor set, including 548 and 956, with [1, 2, 4,
          137] below 239 (7.098 bits); PC-CERT-1 to PC-CERT-3 pass.
          CODE-GATE setup_cell("CELL-K17C"), a dry call (admission only; no
          arm read), admits the cell: route B proved, Hasse unique, a
          generator of order exactly N, and a 130972-entry table. That table
          agrees with the curve law on 20000 of 20000 random index pairs.
          PC-5 then used the contract's own pc5_composite and
          exact_gain_stream at the declared S (2^26 and 2^27) on the
          isomorphic cyclic group, with a review stream id. It read G = 548
          (used 300304 = 548^2, excluded 0, non-exact 0) and G = 956 (used
          913920 of 913936, excluded 16, non-exact 0), and passed. PTM-A's
          known truth holds on both arms.
        robustness_note: >-
          RT-O8 (minor). certificate.divisors_from_factorisation checks only
          the product. Fed {4: 1, 32743: 1} for 130972 it accepts the input
          and capacity() returns [1, 4] and 2.0 bits below 239, which is
          PTM-A's failure signature, reached by malformed input. The
          contract's own flow cannot reach it (setup_cell factorises through
          core.prime_factors: trial division plus Miller-Rabin), and the
          docstring discloses that primality "enters only through the
          factorisation the caller certifies". A primality and distinctness
          guard would make the signature unreachable by construction.
      PTM-B:
        object: Z/2^n with h the low log2(M) bits, certificate function and PC-1 gate code
        result: meets the failure signature (holds)
        detail: >-
          CODE-CERT on 2^16 and 2^17 returns every 2^i, with 15 and 16 bits
          below the order. The contract's PC-1 code path (PairStream,
          cache_labels, read_arm, null_distribution, null_summary,
          exact/occupied) ran on Z/2^16 at every declared alphabet (8 to 128)
          at the declared S, with ten review seeds. Z/2^16 is a nearby object
          of the same shape, deliberately not the declared CELL-Z2 instance.
          G = M exactly on every seed, with every used cell a point mass and
          used cells at 98 percent of M^2 or more (63 of 64 at M = 8, 16298 of
          16384 at M = 128); the shuffle median was at
          most q99 on every seed; L1 and L3 hold. The rules do not report the
          null there. Separation from the null is 4.5 to 13.6 times q50 in G,
          or 25 to 62 W.
      PTM-C:
        object: the Z/lZ control with the log-interval key, Stage 2 rules and PC-7 code, every declared (l, M)
        result: meets the failure signature (holds)
        detail: >-
          Three independent calibrations at l = 2003, 130873 and 2095853 with
          M in (16, 8), (64, 16) and (128, 32), declared S. The key's median G
          / M was 0.612 to 0.680 at every (l, M). That is M/2 up to one carry,
          plus the maximum statistic's upward bias. PC-7 passed at all six
          (l, M) in 3 of 3; PC-7c (three relabelled windows never meeting L3)
          passed at all six in 3 of 3; PC-16 classified the key LEAD in 3 of
          3, with L2 intervals [2.49, 2.81], [2.66, 2.86] and [1.76, 1.96].
          The key is read as the far-end positive control on every declared M.
      PTM-D:
        object: >-
          The repaired shuffle, fed (a) an exact filter and (b) planted
          marginal-only filters on synthetic data of the declared CELL-K13
          (M = 16, S = 2^15) and CELL-K19 (M = 64, S = 2^19) shapes. The
          contract's own shuffled, read_arm, null_distribution and clauses
