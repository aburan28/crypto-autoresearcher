          margin movement ("each" or otherwise), and none uses the
          correction's framing as scope authority. The without-orbit line is
          called unconditional only "under the first condition" (the ceiling
          label). KN-FIND-47da4e (read in full) is characterised correctly:
          its own text says it "says nothing about orbit unions used with a
