  # ===========================================================================
  objections:
    - id: RT-O1
      joints: [J3, J4]
      severity: major (blocking; breaking artifacts of both joints met)
      statement: >-
        F1 carries the certificate's own exact E/2E bit, and nothing
        stratifies it. The contract's rules classify an F1-structured label
        with no content beyond h2 as LEAD: 7 of 7 at the declared shapes;
        the same mechanism appears with the contract's actual F1 code on a
        toy Koblitz curve. The pre-registered expectation "every declared arm
        reads NEG" fails for F1 by construction. The instrument cannot
        distinguish an approximate filter beyond the 2-bit certificate from
        the certificate's own quotient for this arm, and its most valuable
        branch (LEAD, routed to review-breakthrough and independent
        replication) is predicted to fire on a known exact component.
      mechanism: >-
        In a normal basis, Tr(c) = sum of the coordinates of c
        (Fong-Hankerson-Lopez-Menezes, CACR CORR 2003-18, Section 4.2,
        retrieved; Tr(w) = 1 for every normal element). On an a = 0 Koblitz
        cell, h2(P) = Tr(x(P)) (CODE-CORE make_h2). So parity(popcount(NB(x)))
        = h2(P) exactly: 0 violations exhaustively on the declared fields for
        n = 13 and 19 and on 20000 elements for n = 23 and 41 (C1); every
        point on n = 7, 9, 11 for a in {0, 1} (C10). Bailey et al. state the
        consequence for the subgroup: "in the subgroup of order l each
        x-coordinate has even Hamming weight" (lines 129-130). The contract
        samples the full group, where the parity is the E/2E class. CODE-FAM
        weight_buckets puts 90.8, 98.1 and 98.9 percent of the Binomial mass
        in parity-pure buckets at the LEAD keys K13@16, K19@64 and K23@128
        (73 to 96 percent elsewhere). The histogram-preserving shuffle
        (specification 331-343) is stratified "For the F5 composites only",
        so F1's shuffle destroys the h2 relation and the destroyed relation
        is scored as controlled excess. Z grows with M (the h2 effect scales
        as M times the central weight probability), so L2 holds too. F3
        windows do not contain the whole polynomial-basis trace support on
        any declared field (support {0, 9}, {0, 17}, {0, 1, 2, 4, 8, 16}
        and {0, 1, 2, 4, 8, 16, 32}), so F3 is clean. F2 and F4 carry no
        parity. The source proposal records the fact (IDEA-20260926-136bd3
        lines 101-103: the Hamming-weight predicate "whose parity is exactly
        Tr(x)") without drawing its consequence.
      evidence: [C1, C2 F1MODEL and F1STRAT, C5 arms c and c-prime, C9, C10]
      remedy: RC-1 and RC-2
    - id: RT-O2
      joints: [J3]
      severity: major
      statement: >-
        HEUR-B2's quantitative consequent is stated on the raw gain, which
        counts marginal skew and exact components. For the declared arms F1
        and F5xF1 it is false at n = 131 by arithmetic:
        log2 G_131(F1, L_32) >= 18.649 against g*_32 = 18.2978 (c* =
        0.1418, the named binding row), and the marginal alone breaks both
        with-orbit rows. So the heuristic is decided for these arms by their
        Binomial marginal and the certificate's 1-bit quotient, not by
        approximate sum-compatibility. For every other arm it is untestable
        at any tested N or feasible S (2^50 pairs or more). The mapping "G >
        l^(c_k) means the ceiling-model tree falls below matched rho" proves
        too much: it reads a known-useless label as crossing the threshold.
      evidence: [C8]
      remedy: RC-3
    - id: RT-O3
      joints: [J3, J4]
      severity: major (coverage of the LEAD branch; not a false-claim risk)
      statement: >-
        Clause L2 (second-smallest per-seed Z-slope >= 0, that is 9 of 10
        seeds non-negative) tests growth of the standardised excess, not
        non-decay. A constant raw excess reads as decay, because W grows with
        M: 0 of 14 LEAD, even though it stays above 3W at every cell. A
        filter held at the stated floor gives 0 of 14. Only an excess that
        grows faster than the null width reaches LEAD reliably (key
        mixtures: 13 of 14 at rho 0.6, 14 of 14 above that). For a strong
        excess with a flat mean Z, the verdict was 4 of 14 at twice the floor
        and 7 of 14 at four times. That is not the about 1 percent that
        independent slopes would give: the ten per-seed slopes share each
        cell's single measured W and q50, so the interval is
        anti-conservative against the null-width error (RT-O6), and
        null-width noise decides the verdict. The contract calls L2 a
        non-decay clause, states no LEAD floor, and writes "THE LEAD OUTCOME
        IS REACHABLE" on the strength of one control whose excess grows with
        M. Consequence: a strong filter with a non-growing standardised
        excess is recorded ART-RES (targeted replication) or LEAD
        (review-breakthrough) depending on calibration noise. That is not a
        false-claim risk, since both routes stop short of interpretation, but
        the LEAD definition neither means what its text says nor decides
        reproducibly in that regime.
      evidence: [C3 calibration and classification]
      remedy: RC-4
    - id: RT-O4
      joints: [J3]
      severity: material (minor for approval, major for the NEG row's obstruction block)
      statement: >-
        The measured resolving floor is defined as the smallest planted-mixture
        rho in {1/2, 1/4, 1/8, 1/16} at which L1 and L3 hold (CODE-GATE
        z_ladder). It is None at (2003, 16), (2003, 8) and (130873, 16) in 3
        of 3 calibrations and at (2095853, 32) in 1 of 3; the true floor lies
        near rho 0.55 at M = 16. S2-4 therefore cannot report a measured
        floor beside a NEG at any M = 8 or 16 alphabet. That includes the
        fixed-alphabet M = 16 arm, which carries the contract's longest
        transfer (to log2 l = 39). The NEG row's obstruction block would lack
        its floor there.
      evidence: [C3 calibration]
      remedy: RC-5
    - id: RT-O5
      joints: [J3]
      severity: minor
      statement: >-
        The stated design floor and null-scale estimates run well below the
        measured ones at large M. Measured q50 + 3W is 8.90 against 6.33 at
        M = 64 and 14.57 against 8.75 at M = 128. W is 1.09 against 0.60 and
        1.77 against 0.79; the audit's "about 7 to 25 percent low" understates
        this. The interpretation limits quote the estimates as the floor, and
        the relevance paragraph's "G / M of 0.1 at M = 64" should read about
        0.14.
      evidence: [C2 aggregate]
      remedy: RC-5
    - id: RT-O6
      joints: [J3]
      severity: minor
      statement: >-
        W = q99 - q50 with q99 the third largest of 200 draws is a noisy
        scale. Across 7 independent calibrations its coefficient of variation
        was 0.07 to 0.20, and at K13@16 it ranged from 0.343 to 0.671 (a
        factor of 2), so the 3W thresholds at the smallest ladder cell move
        by up to a factor of 2 between otherwise identical runs. Because one
        W per (cell, M) standardises all ten seeds, the error also enters
        every per-seed Z-slope in common. That is how L2 came to decide a
        flat-Z excess 4 to 7 times in 14 (RT-O3). The audit's "Monte Carlo
        error is a few tenths of W" understates it.
      evidence: [C2 aggregate, C3 classification]
      remedy: RC-6 and RC-4
    - id: RT-O7
      joints: [J4]
      severity: minor (subsumed by RT-O1 for remedy)
      statement: >-
        OC-1 classifies F1 as a marginal-skew object and imports KN-FIND-ffe1df
        RT-EXP-1's popcount lesson. That lesson holds on prime-order E(F_p),
        which has no exact quotient. On a binary curve with cofactor 4, F1 is
        a mixed object (marginal skew plus the exact E/2E bit), so the
        collision OC-1 names is not the only one F1 presents.
      evidence: [C1, C9]
      remedy: RC-1
    - id: RT-O8
      joints: [J4]
      severity: minor
      statement: >-
        CODE-CERT accepts any factorisation whose product is the order. With
        {4: 1, 32743: 1} it returns 2 bits on the composite cell, which is
        PTM-A's failure signature. It cannot be reached in the contract's own
        flow.
      evidence: [C6]
      remedy: RC-7
    - id: RT-O9
      joints: [J3]
      severity: minor (wording)
      statement: >-
        The hypothesis mechanism (vi) says a random label is classified NEG
        "before any Koblitz arm is read". PC-15 runs in Stage 3 after the
        arms, and IR-17 voids retroactively.
      remedy: correct the sentence

  required_controls:
    - id: RC-1
      what: >-
        Stratify the histogram-preserving shuffle of EVERY Koblitz arm by the
        exact h4 class, and every ordinary arm by h2, generalising DF-7 from
        F5 to all arms, so that controlled excess always means excess beyond
        the certificate's exact capacity. Or sample Stage 2 points from the
        target subgroup (4E, uniform Q then 4Q), where every exact component
        is constant and the capacity is 0 bits. That matches the ceiling
        table's declared ambient (N = l), which already governs rule R-M.
        CORR-20260928-4cb669 records an earlier case in this program where
        the choice between the full-group and subgroup ambients changed a
        toy measurement.
      cost: >-
        Negligible for stratification (the same ten shuffles per seed).
        Subgroup sampling costs two doublings per sampled point.
    - id: RC-2
      what: >-
        Add a blocking gate control: an exact-content-only label must read
        NEG under the rules as applied to family arms. Candidates are the F1
        weight classes tied to h2 (PTM-E of this report, in code) and 4r + h4
        with a skewed r. It would have caught RT-O1 at the gate.
    - id: RC-3
      what: >-
        Restate HEUR-B2's consequent on the controlled lift, meaning G
        against its h4-stratified shuffle, or on equiprobable-marginal arms,
        so that marginal skew and exact components can neither satisfy nor
        violate it. State for which arms the consequent is defined, and add
        any consequent that is testable at a tested N.
    - id: RC-4
      what: >-
        Pre-register what L2 means. If "non-decay" is intended, test it (for
        example, the interval's upper end >= 0, or its lower end >= -delta
        with delta stated). If growth is intended, say so, state the LEAD
        floor, and add a flat-Z planted control to the LEAD-reachability
        gate beside PC-16. Either way, make L2's interval respect the
        common-mode error: standardise each seed by a width measured on that
        seed's own draws, or propagate W's calibration uncertainty. Qualify
        "THE LEAD OUTCOME IS REACHABLE" accordingly.
    - id: RC-5
      what: >-
        Extend the planted-mixture grid above 1/2 (for example 0.6, 0.7, 0.8,
        0.9, 1) so the measured floor exists at M = 8, 16 and 32. Replace the
        design floor numbers in the interpretation limits with the measured
        values or their ranges.
    - id: RC-6
      what: >-
        Stabilise the null width with more draws (for example 1000 per
        (cell, M), about plus 50 percent counting cost at 13 arms) or with a
        width less tied to the third-largest draw.
    - id: RC-7
      what: Guard CODE-CERT with a primality and distinctness check on the factors (core.is_prime or primality_record) before forming divisors.

  counterexample_or_mutation: >-
    Counterexample to the rules' reading: the F1 arm itself. On any a = 0
    Koblitz cell with cofactor 4, F1 = (Binomial weight classes) plus (the
    exact E/2E bit, carried as weight parity). The mutation that isolates it
    is to stratify F1's shuffle by h2. The controlled excess drops from 2.9
    to 18 (L3 at every cell, LEAD) to about 0 (NEG). Neither the pair
    sample, the labels nor the random-label null changes; only the shuffle's
    respect for the certificate's exact quotient does.

  cheapest_falsification: >-
    Zero compute: the identity Tr(c) = sum of normal-basis coordinates
    (FHLM Section 4.2) together with the bucket parity-purity table of
    CODE-FAM weight_buckets (C1) shows that F1 determines h2 on 90.8 to 98.9
    percent of the mass at the LEAD keys, while the contract's shuffle is
    unstratified for F1. About 2 CPU-minutes: run the contract's own
    arms() F1 label, read_arm, null_distribution, seed_rows and clause_L3 on
    the non-declared toy a = 0 Koblitz curve over F_2^9 (507 affine points,
    S = 128 M^2, ten seeds). F1 meets L3 at M = 8 and 16 (rank floor 10 of
    10) and fails L3 once the shuffle is stratified by h2 (C9). Either
    falsifies the claim that the rules read a null as a null for every
    declared arm.

  baseline_comparison: >-
    Not a rho comparison: J3 and J4 bound no cost, and matched rho 2^60.8090
    enters only the ceiling and threshold lines (checked against
    CORR-20260922-81aeab as quoted in the contract; the contract uses no D1,
    D2 or D3). The baselines for these joints are the instrument's nulls.
    (1) The uniform random-label null separates correctly: RLFAM NEG 7 of 7.
    (2) The histogram-preserving shuffle is a correct null for arithmetic
    and preserves marginals (PTM-D). (3) It is the wrong baseline for an arm
    that carries an exact quotient; there the right baseline is the shuffle
    stratified by that quotient (DF-7 for F5 only) (RT-O1). (4) For the
    HEUR-B2 consequent, the right comparator is the lift over the stratified
    shuffle, not raw G (RT-O2).

  heuristic_challenges:
    - heuristic: HEUR-B2
      challenge: >-
        Formal statement: the consequent's quantity is mis-specified for
        skewed-marginal arms and is false by arithmetic for F1 and F5xF1
        (RT-O2). Random-model transfer: the random model (square-root
        cancellation, Theorem A-prime) bounds the averaged agreement. The
        contract records that correctly, together with the N^(1/4) reach and
        the absence of any justification at N^(1/3); the record is checked
        against KN-FIND-ffe1df lines 46-72. Scale honesty: the transfer
        distance (about 108 bits of log2 l from the ladder, 90 from the
        fixed alphabet) is stated. Validation plan: the premise is testable;
        the consequent is not, at any tested N.
    - heuristic: the Binomial-given-parity law used by this report's own bound (not a contract heuristic)
      challenge: >-
        Checked: every curve abscissa's weight parity equals Tr(x) exactly on
        n = 11, 15 and 21. Total variation to the parity-restricted Binomial
        is 0.044, 0.024 and 0.001 to 0.003, shrinking with n; Bailey et al.
        lines 1183-1185 give the same at n = 131 for even weights. The lower
        bound on G_131(F1) uses only the central-weight probability, and at
        n = 21 the empirical value is 0.3366 against 0.3364 for the model.

  cost_model_challenges:
    uncharged_terms:
      - >-
        U-1. The LEAD route's own cost, one review-breakthrough round plus an
        independent replication in a separate session and implementation, is
        not priced in budget.stage_split. Under the frozen design it is
        predicted to be incurred for F1 (7 of 7 in the synthetic model), so
        it is a near-certain, uncharged cost triggered by a known artifact.
      - >-
        U-2. A measured floor at M = 8, 16 and 32 needs mixture arms above
        rho = 1/2 (RT-O4): a small, uncharged addition to the z_ladder
        counting passes.
      - >-
        U-3. Testing HEUR-B2's consequent needs S >= 2^50 pairs per arm and
        seed at L_32 (rule R-S), or 2^58.6 at L_16 as the contract states.
        That is infeasible, and the contract discloses it. It is recorded
        here as the cost of the transfer's missing validation, not as a
        defect of the budget.
      - >-
        U-4. Stabilising W (RC-6) adds roughly 50 percent to the counting
        passes at 100 null draws per seed. It is not charged because it is
        not designed.
    note: >-
      The ceiling-model costs (ideal-tree totals, relations, linear algebra,
      memory) are J1's and were not re-derived (RB-6).

  reduction_and_scope_challenges: >-
    See over_scoped_sentences under J4. The scope sentences on the deployed
    row, the exclusions, the orbit-unknowns line and the "asserts nothing"
    blocks hold. The scope defects are in what the instrument's readings are
    said to mean (NEG for every arm, the LEAD reach, the floor, and the
    HEUR-B2 mapping).

  proof_architecture_challenges:
    - attack: observation-fiber
      result: >-
        Hold the rules' observation fixed at "LEAD" and vary the object. The
        log-interval key (a genuine approximate filter) and PTM-E (the
        certificate's exact bit dressed as weight classes) both produce it.
        The observation does not separate them. The missing separator is
        stratification by the exact quotient.
    - attack: quantifier-order
      result: >-
        The prediction quantifies over all declared arms ("every declared arm
        reads NEG"). F1 is a counterexample by construction, not by
        measurement.
    - attack: nearby-object
      result: >-
        The ordinary control CELL-O19 (cofactor 2) also has h2, but F1 is not
        formed there, so the Koblitz-specific versus coordinate-generic
        comparison cannot catch RT-O1. The composite control CELL-K17C
        carries no family arm. No nearby-object control in the design
        exercises an arm with an exact component outside F5.
    - attack: method-ceiling
      result: >-
        With L2 as written, the method cannot reproducibly certify as LEAD an
        excess whose standardised size is constant along the ladder: 0 of 14
        at the floor, 4 and 7 of 14 above it, decided by null-width noise
        (RT-O3). Its ceiling on the NEG side is the floor, which is undefined
        at M = 8 and 16 on the contract's grid (RT-O4).

  null_and_nearby_object_controls:
    checked:
      - {control: uniform random label (RLFAM) at every declared Koblitz shape, result: "NEG 7 of 7"}
      - {control: skewed-marginal nulls (planted bucket-0; weight classes with no parity), result: "NEG 7 of 7 each; preserved under the shuffle"}
      - {control: exact filters (low bits on Z/2^16; i mod M on Z/N'Z; dlog mod 548 and 956 on the n = 17 isomorph), result: "G = M exactly at the declared S; shuffles collapse"}
      - {control: log-interval key on the Z/l ladder, result: "PC-7, PC-7c and PC-16 pass 3 of 3"}
      - {control: exact-content-only label (PTM-E), result: "LEAD 7 of 7, which the rules should not produce"}
      - {control: h2-stratified shuffle on the same label, result: "NEG 6 of 6"}
      - {control: planted filters at, and above, the stated floor on the Z/l ladder (14 replicates), result: "LEAD 0 of 14 at the floor; 4 and 7 of 14 at 2x and 4x with a flat mean Z; 0 of 14 for a constant raw excess; 13 and 14 of 14 for growing mixtures at rho >= 0.6"}
    missing_in_the_contract:
      - an exact-content-only control for the family arms (RC-2)
      - a flat-Z planted control for LEAD reachability (RC-4)
      - planted-mixture strengths above 1/2 for the floor (RC-5)

  survival_statement: >-
    J3 and J4 do not survive as frozen. The repaired null works:
    random-label NEG 7 of 7, L2 not satisfied by occupancy, the shuffle
    collapsing exact filters and preserving marginal-only ones, and PTM-A to
    PTM-D all passing. But the rules do not read every null as a null: a
    declared arm carries the certificate's own exact quotient and is
    predicted to read LEAD. The LEAD branch's reach is narrower than stated,
    and HEUR-B2's consequent is decided by marginal skew for two declared
    arms. Remaining uncertainty, named rather than rounded away: the F1 to
    LEAD prediction for the declared curve cells is an inference, not a
    measurement, because measuring F1 on those cells is forbidden to this
    review. It rests on (a) a verified field identity with a retrieved
    source, (b) the parity-purity of the declared buckets (exact
    arithmetic), (c) the Binomial-given-parity law (verified on
    non-declared fields), (d) 7 of 7 synthetic replicates at the declared
    shapes with the contract's own rules, and (e) the contract's own F1 code
    on a toy Koblitz curve. Any additional structure the real F1 carries
    could only add to its excess. What would still distinguish a genuine
    F1 signal from this artifact is a reading that survives an h4-stratified
    shuffle.

  narrowest_supported_statement: >-
    Under the frozen rules of EXP-BINSTD-6f1e66, a label whose only
    arithmetic content is the certificate's exact E/2E bit is classified
    LEAD (7 of 7, at the declared ladder shapes, by the contract's own
    decision code). The declared arm F1 has exactly that bit, so as frozen
    the instrument cannot tell an approximate filter beyond the 2-bit
    certificate from the certificate's own quotient for F1. The other checked
    parts of J3 and J4 hold, with four exceptions. LEAD is reached reliably
    only by an excess that grows along the ladder; for a flat standardised
    excess it is decided by null-width noise. The NEG floor is unmeasured at
    M = 8 and 16. HEUR-B2's consequent is mis-specified for skewed arms.

  next_concrete_action: >-
    A revision of EXP-BINSTD-6f1e66 (superseding record or additive
    amendment, the composer's choice), zero runs. It would stratify every
    Koblitz arm's shuffle by h4 and every ordinary arm's by h2, or sample in
    4E (RC-1); add PTM-E as a blocking gate control (RC-2); restate
    HEUR-B2's consequent on the stratified lift (RC-3); pre-register L2's
    meaning and the LEAD floor with a flat-Z planted control (RC-4); extend
    the floor grid above 1/2 and quote measured floors (RC-5); stabilise W
    (RC-6); and guard CODE-CERT (RC-7). None of these touches the
    certificate, the ceiling table, the exclusions, the labelling or the
    routing, and all are cheap. This is a recommendation to the composer,
    not a decision.

  routed_findings:
    - to: TASK-20260929-75e9e4 (J2 owner; code and completeness)
      finding: >-
        HEUR-B1's validation (specification S2-5: direct pair-sum counting,
        chi-squared against Binomial(2^16, 262 / N_E), maximum-count tail)
        has no committed code in any of the seven blocks (grep of every
        function definition), although inputs.missing_instruments reads "None.
        The executor writes only the run driver that calls the committed
        functions". Not adjudicated here. It is not in TB-4's list.
    - to: TASK-20260929-75e9e4 (J2 owner)
      finding: >-
        Provenance update for IMP-FHLM, not a defect of the contract. In the
        CACR CORR 2003-18 version the point-halving material is Section 4
        (4.1 and 4.2), not Section 3 ("Field inversion and division"), and
        this task read it: Lemma 4.1(iv) "If (x, y) in <G>, then Tr(x) =
        Tr(a)"; the normal-basis trace sentence of 4.2; and footnote 8 on
        Tr(a) = 0 curves. The contract's accepted alternative (re-derivation
        from the group law) stands. This task re-derived the criterion and
        verified it exhaustively (C10).
    - to: J1 owner
      finding: none (no D1, D2 or D3 used as a budget anywhere, RB-11)

  prior_comparison:
    note: >-
      Against the plan's coordinator_prior, which was written before the
      object existed. Recorded for the composer; not a verdict.
    items:
      - {prior: "(a) exact controls separate from the measured null by one to two orders of magnitude", outcome: "in W units 25 to 62 W (PTM-B) and 13.5 to 58 in E_Sh at 16 and 64 (PTM-D); in G, 4.5 to 13.6 times q50"}
      - {prior: "(b) the shuffle collapses an exact filter (p about 0.9) and preserves a planted marginal-only filter (p about 0.8)", outcome: "both on every seed tested at two shapes (PTM-D)"}
      - {prior: "(c) LEAD reachable in principle only by several-unit excesses; coarse floor", outcome: "confirmed and sharpened: the floor is 1.4 to 1.7 times coarser than the design estimates at M = 64 and 128; LEAD needs a growing Z, and for a flat Z it is decided by null-width noise (RT-O3)"}
      - {prior: "(d) bootstrap under-coverage", outcome: "moot; no bootstrap, and the null uses independent random labels"}
      - {prior: "overturn event (2), the random-label null reading far below sqrt(M)/10", outcome: "did not occur; it read far above: G - 1 of 4.63 at M = 64 (prior 0.8 to 2) and 8.27 at M = 128"}
      - {prior: "J3 holds with probability about 0.55; break expected on SR-4 reachability", outcome: "breaks, but on a null the plan did not list (RT-O1), with SR-4 reachability partially breaking (RT-O3)"}
      - {prior: "J4 holds with probability about 0.75; if it breaks, on PTM-D", outcome: "PTM-D holds; J4 breaks on an added object (PTM-E) and on over-scoped sentences"}

