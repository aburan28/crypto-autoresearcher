  claim_under_review: >-
    As scoped to J3 and J4 of REVIEW-BINSTD-B-20260929-361e02. J3 concerns
    the version-2 estimator's decision rules and labelling. They must read a
    null as a null and a lead as a lead at the declared sample sizes (the
    measured random-label null per (cell, M); SR-4 reachable, with clause L2
    not satisfiable by occupancy; a resolving floor stated as an
    interpretation limit; HEUR-B2's consequent quantitative and falsifiable).
    The stake must stay a ceiling and the lead threshold must be
    pre-registered and routed. The orbit-unknowns line must carry its
    CORR-20260925-649e25 and KN-FIND-47da4e conditions. J4 concerns the R2
    boundaries and exclusions, the cited and absorbed records, PTM-A to PTM-D
    meeting their failure signatures, and the absence of over-scoped
    sentences.

  headline_findings:
    - >-
      RT-O1 (breaks J3 and J4). The declared arm F1 carries the certificate's
      own exact E/2E bit, and the rules would classify it LEAD. The parity of
      the normal-basis Hamming weight of x is Tr(x), which is h2 on a Koblitz
      cell. This is a field identity: Fong-Hankerson-Lopez-Menezes Section
      4.2, retrieved, and 0 violations on every declared field, exhaustive to
      n = 19. The declared F1 buckets are parity-pure on 90.8, 98.1 and 98.9
      percent of the mass at the three LEAD keys. Only F5 is stratified by the
      exact component (DF-7); F1's histogram-preserving shuffle destroys the
      h2 relation, so h2 registers as controlled excess. Evidence:
      (i) A label with no content beyond h2 was classified LEAD by the
          contract's own classify_family in 7 of 7 ten-seed replicates at the
          declared ladder shapes. L3 held at every (cell, M), and the L2
          interval's lower end ran from 0.073 to 0.460.
      (ii) With the shuffle stratified by h2 it read NEG in 6 of 6.
      (iii) On a toy Koblitz curve (n = 9, not declared), the contract's
          actual F1 code satisfies parity(F1) = h2 on all 17044 sampled
          points whose F1 bucket is parity-pure, and meets L1 and L3 at M = 8
          and 16; the excess vanishes under h2-stratification.
      The pre-registered expectation that every declared arm reads NEG fails
      for F1 by construction. The LEAD route (a review-breakthrough round and
      an independent replication) would fire on the certificate's own
      quotient.
    - >-
      RT-O2 (breaks J3). HEUR-B2's quantitative consequent is stated on the
      raw gain G, which counts marginal skew and exact components. For F1
      and F5xF1 it is false at n = 131 by arithmetic, with no measurement.
      The raw G at alphabet L_32 is at least 2^21.5 x 0.1386 = 2^18.65, above
      the named binding threshold g*_32 = 18.2978 (c* = 0.1418). On the
      with-orbit rows at k = 16 and 32 the marginal alone exceeds the
      threshold. For every arm the consequent is untestable at any tested N
      or feasible S.
    - >-
      RT-O3 (J3). Clause L2 tests growth of the standardised excess, not
      non-decay. Planted filters held at the stated resolving floor gave LEAD
      0 of 14, and a constant raw excess above every floor gave 0 of 14.
      Fixed-rho key mixtures, whose excess grows with M, gave 13 of 14 at
      rho 0.6. A strong excess with a flat mean Z was a coin flip (4 of 14 at
      twice the floor, 7 of 14 at four times) because all ten per-seed slopes
      share each cell's single W, so W's calibration noise moves them
      together. The contract states neither the growth requirement nor the
      LEAD floor, and "THE LEAD OUTCOME IS REACHABLE" (specification line
      831) overstates what PC-16 shows.
    - >-
      RT-O4 and RT-O5 (J3). The measured resolving floor is undefined on the
      contract's own planted-mixture grid (rho at most 1/2) at every M = 8
      and M = 16 alphabet (3 of 3 calibrations) and at M = 32 in 1 of 3, so
      S2-4 cannot report a measured floor beside a NEG there. The stated
      design floor underestimates the measured one by factors up to 1.66
      (M = 128: 14.6 against 8.8).
    - >-
      What holds. The random label reads NEG (7 of 7). Clause L2 is not
      satisfied by occupancy (random-label Z-slopes are non-negative on
      exactly 50 percent of 70 seeds, while the raw (G - 1) slopes are
      positive on 70 of 70). PC-7, PC-7c and PC-16 pass (3 of 3). PTM-A,
      PTM-B, PTM-C and PTM-D each meet their failure signature. TB-1 is not
      fired. The orbit-unknowns and KN-FIND-47da4e conditionals are labelled.
      The exclusions hold and the cited records are unedited.

  # ===========================================================================
  # J3 -- the estimator's decision rules and labelling
  # ===========================================================================
  J3:
    verdict: breaks
    breaking_artifacts_met:
      - >-
        "A null that lands outside the null outcome": met. The object is the
        null for family content beyond the certificate: the F1 weight classes
        with nothing but the exact h2 bit. It lands in LEAD in 7 of 7
        (RT-O1). The uniform random label lands in NEG in 7 of 7.
      - >-
        "An unfalsifiable HEUR-B2 consequent": met in substance, though not
        in letter. The consequent is quantitative and could fail in
        principle, but its quantity (raw G) makes it false by arithmetic for
        two declared arms. No tested N and no feasible S can test it for any
        arm (RT-O2).
      - >-
        "A LEAD branch unreachable by a planted filter at the stated floor":
        met for a planted filter held at the floor at every ladder cell (LEAD
        0 of 14) and for a constant raw excess above every floor (0 of 14).
        Not met for M-scaling key mixtures, which reach LEAD once the smallest
        ladder cell passes its floor (13 of 14 at rho 0.6) (RT-O3).
    items:
      i_random_label_null_at_declared_shape:
        verdict: holds
        construction: >-
          The groups E(F_2^n) of CELL-K13, CELL-K19, CELL-K23 and CELL-K41 are
          cyclic of order 4l, so each is isomorphic to Z/4lZ. A label that is
          a function of the point sees only the isomorphism type and the pair
          law (uniform non-identity pairs with non-identity sum, which ZCell,
          TableCell and IndexCell streams share). Streams on Z/NZ at N =
          8012, 523492, 8383412 and 2199025563772 therefore have the cells'
          distribution without any curve arithmetic. The setup used the
          declared alphabets and S (rule R-S), one stream per seed of length
          Smax with prefixes per M, 20 random labels per seed pooled to 200,
          10 shuffles per arm per seed, and ten seeds. Gains came from a numpy
          re-implementation that is bit-for-bit identical to CODE-EST gain
          (6 of 6 checks, C0). Every decision used CODE-EST seed_rows,
          null_summary, clause_L1, clause_L2, clause_L3 and classify_family,
          imported unchanged. Seven full replicates were run (C2).
        reading: >-
          RLFAM (a held-out uniform random label) was NEG in 7 of 7
          replicates. L3 held at no (cell, M) in any replicate (0 of 56), and
          no (cell, M) had more than 3 of 10 seeds at the rank floor (L3
          needs 8). PC-2 would pass: every
          one of the 200 null draws was OCCUPIED at every (cell, M) in every
          replicate. The null lands in the null outcome.
        measured_null_per_cell: >-
          Mean over 7 calibrations, q50 / W: K13@16 2.466 / 0.488 (W range
          0.343 to 0.671); K13@8 1.771 / 0.318; K19@64 5.633 / 1.090;
          K19@16 2.441 / 0.444; K23@128 9.265 / 1.767; K23@32 3.598 / 0.696;
          K23@16 2.443 / 0.410; K41@16 2.436 / 0.421.
      i_clause_L2_against_occupancy:
        verdict: holds
        reading: >-
          Across the three ladder cells at their N^(1/3) alphabets, the
          random label's per-seed raw (G - 1) slope against log2 l was
          positive on 70 of 70 seeds (mean 0.683 per bit). That is the
          occupancy and alphabet growth of a maximum statistic, and it is
          what broke version 1. The per-seed slope of Z = (G - shuffle
          median) / W was non-negative on exactly 35 of 70 seeds. L2 held in
          0 of 7 replicates, and the implied chance rate is P(at least 9 of 10
          non-negative) = 0.0107. Clause L2 is not satisfied by occupancy;
          the shuffle subtraction cancels it, as R-2 requires. The same holds
          for the skewed-marginal controls PLANT0 and F1MARG (L2 0 of 7 each).
      measured_null_calibration:
        verdict: holds in method, with objections RT-O5 and RT-O6
        reading: >-
          The null is measured per (cell, M) from 200 independent random
          labels on the same pairs and the same gain code. No closed-form
          allowance remains in any rule: 4 x M^(-1/2) appears only as
          deleted, and PC-2 is occupancy and W > 0. The finite-sample scale
          is stated with KN-FIND-ffe1df's averaged-versus-maximum record as
          the reason (audit stage_0.null_scale; the quotation checked
          against the finding, lines 46-56). The stated scale model is
          quantitatively poor at large M, however. At M = 64 and 128 the
          measured G - 1 is 4.63 and 8.27 against 3.53 and 5.40 estimated,
          and W is 1.09 and 1.77 against 0.60 and 0.79. At occupancy 128 per
          conditioning cell with M = 128 values, each count is about
          Poisson(1), and the Gaussian maximum model underestimates its tail.
          The contract says "about 7 to 25 percent low"; the measured shortfall
          in W is 45 to 56 percent (the estimate is 0.44 to 0.55 of the
          measured W).
      ii_lead_reachability_with_planted_filters:
        verdict: >-
          partially breaks. LEAD is reachable for excess that grows along the
          ladder, and unreachable at the stated floor.
        construction: >-
          The Z/lZ ladder of CODE-GATE z_ladder (l = 2003, 130873, 2095853 at
          LEAD alphabets 16, 64, 128, declared S). Planted mixtures follow the
          CODE-EST planted_mixture law: the log-interval key on a fraction rho
          of points, a uniform label on the rest. Three calibration
          replicates gave E_Sh(rho) on a fine grid. Then 14 classification
          replicates of 10 seeds each, classified by CODE-EST classify_family
          over the three LEAD keys, covered: fixed rho across the ladder
          (0.5 to 0.7); per-cell rho placing the median controlled excess at
          3W, 6W and 12W (Z held about flat); and a constant raw excess of
          7 at every cell (above 3W everywhere).
        reading: >-
          Fourteen replicates of ten seeds each, verdicts from the contract's
          classify_family. The realized median Z is given at l = 2003, 130873
          and 2095853.
          (1) Fixed-rho key mixtures, whose controlled excess grows with M:
          rho 0.5 had Z 2.1 / 5.0 / 7.5 and gave LEAD 0 of 14 (ART-RES; the
          K13-shape cell is below its floor). rho 0.55 gave LEAD 3 of 14, rho
          0.6 (Z 3.8 / 8.5 / 12.3) gave 13 of 14, and rho 0.65 and 0.7 gave
          14 of 14. For this family LEAD is reached once the smallest ladder
          cell passes 3W.
          (2) Planted filters held at the stated floor, E_Sh about 3W at every
          ladder cell (Z 2.9 / 3.1 / 3.0), gave LEAD 0 of 14 (ART-RES 14 of
          14). L1 and L3 held at all three cells in 0 of 14, and L2 in 2 of 14.
          (3) Held at twice the floor (Z 5.8 / 6.1 / 5.7, a flat mean
          profile): L1 and L3 held at all three cells in 14 of 14, but LEAD
          came out in only 4 of 14.
          (4) Held at four times the floor (Z 11.1 / 12.5 / 11.7): LEAD 7 of 14.
          (5) A constant raw excess of 7 at every cell (Z 13.7 / 6.0 / 3.7,
          above 3W everywhere): LEAD 0 of 14. L2 held in 0 of 14 and every
          verdict was ART-RES.
          Reading. The LEAD branch is reachable, but only for excess that grows
          along the ladder faster than the null width. It is unreachable for
          a filter at the stated floor and for a constant raw excess however
          far above the floor. For a strong excess with a flat mean Z, the
          verdict is close to a coin flip (4 of 14 at 2x, 7 of 14 at 4x). If
          the ten per-seed slopes were independent, a flat profile would pass
          L2 about 1 percent of the time. They are not: all ten share each
          cell's single measured W (and q50), so W's calibration error (RT-O6)
          shifts all ten slopes together. The interval from the second
          smallest to the second largest slope, a nominal 80 percent
          interval, is therefore anti-conservative against the null-width
          error. For the random label the common-mode shift is harmless,
          because E is about 0 and scaling by W does not move its sign (L2
          held in 0 of 7).
        what_the_contract_states: >-
          Three contract passages bear on this. The success criterion reads
          "THE LEAD OUTCOME IS REACHABLE: PC-16 requires the rules as coded to
          classify a known approximate filter LEAD". The resolving floor is
          stated for NEG only ("A NEG reading means an arm's controlled
          excess lies below about three measured null widths"). The decision
          clauses describe L2 as making "occupancy growth of a maximum
          statistic" unable to "pass as non-decay". No sentence states that
          LEAD further requires Z to increase along the ladder, and no LEAD
          floor is stated.
      iii_stake_lead_below_rho_and_13_bit_sentences:
        verdict: holds (TB-1 not fired)
        method: >-
          A regex sweep of the three bound files (computations.json c11,
          92 lines; audit lines 1450 to 3630 are code and were swept
          separately), plus a manual read of every hit in context.
        classification_key: >-
          P = prohibition or negation; R = routing to review-breakthrough and
          independent replication; D = definition of a decision rule or
          category; C = statement about a positive control (the log-interval
          key on Z/lZ, not a curve); CL = conditional ceiling label;
          T = counterfactual threshold arithmetic; Q = quotation of a
          selection text, design condition, tripwire or cited bound;
          X = self-attestation; O = outcome, prediction or success criterion
          stating a below-rho cell, a filter above 2 bits, or an
          uninterpreted lead (TB-1). No line is class O.
        sentences:
          - {where: "H-BINSTD-de2808 22-24, 719-721, 727", quote: "NO SPEEDUP AND NO CLOSURE IS CLAIMED ... NO ATTACK AND NO SPEEDUP ... cost below matched rho on ECC2K-130 or on any curve", class: P}
          - {where: "H-BINSTD-de2808 126-131", quote: "Nothing in this hypothesis predicts or asserts any reachable cost below matched rho ... Any reading of a lead is pre-registered to review-breakthrough at max and to independent replication before interpretation.", class: "P, R"}
          - {where: "H-BINSTD-de2808 144-146", quote: "the log-interval key on Z/lZ is read and reaches the lead signature. An arm meeting clauses L1, L2 and L3 ... is the LEAD branch and is routed, not interpreted.", class: "C, D, R"}
