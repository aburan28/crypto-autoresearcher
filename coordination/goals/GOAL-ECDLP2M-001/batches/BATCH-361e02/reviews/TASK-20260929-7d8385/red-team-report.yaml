      iv_heur_b2_consequent:
        verdict: breaks in substance (RT-O2)
        reading: >-
          The consequent can fail in principle at n = 131, but at no tested N:
          it is a statement at n = 131 only, and the contract discloses it is
          not measurable by this instrument (S of about 2^58.6 at M = 2^25.8).
          By the contract's own rule R-S, S = 128 M^2 at M = L_32 = 2^21.5 is
          2^50. Its quantity, the raw level-1 gain G = M x max_(a,b,c) pi_c(d),
          counts marginal skew and exact components as gain; the contract
          says outright that "G_131 includes any exact component of the arm".
          For F1 this has a closed-form lower bound. By averaging over the
          conditioning cells that fix h2(R), G >= M x Pr[F1(R) = c* |
          h2(R)], which is L_k x 2 x C(131, 65) / 2^131 = L_k x 0.1386 when
          the central buckets are parity-pure. They are (C8: mass in
          parity-pure buckets 0.999999 at M = 2^21, 2^22). Hence log2 G_131(F1,
          L_32) >= 18.649 > g*_32 = 18.2978, the named binding threshold. The
          marginal alone gives 17.649 > 16.2894 (k = 32 with orbit) and
          21.949 > 21.3859 (k = 16 with orbit). F5xF1 carries the same parity
          through h4 and has the same bound. The Binomial-given-parity law
          behind the bound is supported three ways. Bailey et al. lines
          1183-1185 (read) say the x-coordinates on E behave like even-weight
          words at n = 131. Exhaustive enumeration on the non-declared fields
          n = 11, 15, 21 gives total variation 0.044, 0.024 and 0.001 to the
          parity-restricted Binomial, with every abscissa's weight parity
          equal to Tr(x). So Q(F1) is false by arithmetic, for a reason (a
          heavy weight class plus the certificate's 1-bit quotient) that
          carries no approximate sum-compatibility and gives a tree no usable
          filtering: a bucket holding 7 to 14 percent of all points is not a
          1/L target set. For every other arm, Q can only be tested at
          2^50 or more pairs.
      v_orbit_unknowns_and_KN_FIND_47da4e:
        verdict: holds
        reading: >-
          CORR-20260925-649e25 (read in full) was applied item by item. The
          with-orbit line is labelled conditional in every place it bears a
          margin or threshold: hypothesis 729-734 ("CONDITIONAL, THREE TIMES
          OVER"), specification 394-401, 860-866 and 983-986, audit
          conditional_on 788-800, the with-orbit margin_readings, and HEUR-B2
