        result: meets the failure signature (holds)
        detail: >-
          (a) i mod M on Z/N'Z (N' = 8016 and 523520, homomorphisms onto Z/M)
          reads G = M exactly on every seed. Its shuffle median lies within
          [q50 - W, q50 + W] and below q99 on every seed: 2.41 to 2.52 against
