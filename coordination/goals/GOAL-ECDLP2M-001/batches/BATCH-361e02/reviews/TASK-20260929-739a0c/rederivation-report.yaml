    continuum_argument: 'For fixed m = 4 and C, write a = T_shared, b = per_target, t = ln B, u = B^4/(24 * 2^131).
      The window is nonempty iff IC(1) < R or (4ab < R^2 and R/(2b) > 1). ln A(mu) = -ln(1 - e^-u) has second t-derivative
      16u(u e^u - e^u + 1)/(e^u - 1)^2 > 0, so ln(A^2 B), ln(A B^2), ln(A B) and ln A are convex in t; hence 4ab
      = 4 retry_4 (C^2 A^2 B + 4 C A B^2) and IC(1) = C (A B + retry_4 A) + 4 B^2 are log-convex in t and their
      sublevel sets are intervals, while {R/(2b) > 1} is an up-set in t (A decreases in B). Since {IC(1) < R} lies
      inside {4ab < R^2}, and the switching point R/(2b) = 1 lies in {IC(1) < R} whenever it lies in {4ab < R^2},
      the set of log2 B with a nonempty window is one interval for every g; the endpoints are continuous there,
      so the union over the continuum is one interval. Fine-grid check (step 1e-4, 69601 points): closing g as a
      function of log2 B rises then falls (direction pattern [1, -1]), and every (g, range) nonempty set is one
      run.'
