  - id: MF-2
    finding: 'Cost units are asserted, not derivable: T_shared adds B A C (per-attempt cost) to m B^2 (unit coefficient)
      and IC is compared with R (rho steps), with no conversion between an attempt, a linear-algebra operation and
      a rho step. The windows depend on this; for example at B = B_cap(4) the term 4 B^2 = 2^69.79 exceeds R = 2^60.81,
      which puts the m = 4 lower endpoints at the cap base near 2^18 targets at g = 0.'
    scope: the model as stated on the card
