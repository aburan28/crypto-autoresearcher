    A2_A3_at_m2: >-
      Restated (A2 validation-arity clause: every decomposition returned,
      any usable one accepted, attempts geometric with p = 1 - exp(-mu u);
      A3 validation-arity clause: determined columns are those of components
      with an unbalanced cycle or a coefficient-2 loop, tree components touched
      but undetermined). A2 is silent on how the relation phase chooses among
      several decompositions (J3-D5).

    defects:
      - id: J3-D1
        severity: breaking (rules as written); remedy is one clause, zero compute
        title: IR-5 invalidates every run, because the gated observable AM3 is defined on the figure IR-5 forbids
        evidence: >-
          specification invalidation_rules IR-5 "Per-target and shared units
          summed into one figure, or any fit computed over other than the
          declared L cells, invalidates the run." (line 720); success_criterion
          lists IR-5 among the run-wide invalidations (line 730) and
          contract_label.RUN-ARTIFACT cites it (line 781).
          definitions.observables_and_tests defines AM3 on "per_target_cost(L) =
          log2((shared_units + sum of the cell's per-target units) / L)" (line
          346). The committed instrument computes and reports that figure for
          every cell (binstd_core.py lines 463, 478, 479: cost = {L:
          (shared_units + sum(by_L[L])) / L}, emitted as per_target_cost and
          FR_by_L). H-BINSTD-7951d2 proof_obligations (line 404) state "shared
          and per-target units are never summed into one figure." Version 1 wrote
          IR-5 as "invalidates that fit" and carried the carve-out "The two are
          never summed into one figure; per_target_cost(L) = (shared_ops + sum of
          per_target_ops over the L targets)/L is the quantity whose exponent is
          fitted" (EXP-BINSTD-532d7f lines 240 to 242, 551); version 2 made IR-5
          run-wide and dropped the carve-out. IR-5 is not coded: run_valid is
          passed into stage2_outcome, so its evaluation is left to an uncommitted
          driver or a person.
        consequence: >-
          Read as written, every run is RUN-ARTIFACT and POSITIVE, NEGATIVE and
          NOT-VALIDATED are unreachable by any data (Monte Carlo with IR-5
          applied: 100 percent RUN-ARTIFACT). The falsification criterion, which
          routes through NEGATIVE, is then unreachable too: the version-1 lesson
          one level down, in text rather than in an admission rule.
        remedy: >-
          Restore scope and carve-out, for example: "Reporting a cost figure that
          sums shared and per-target units in place of their separate columns
          invalidates that figure; the declared per_target_cost(L) of AM3 and
          FR_by_L is the defined exception", keep or drop IR-5 from the run-wide
          list accordingly, align the hypothesis proof obligation, and state
          which program evaluates IR-5.
      - id: J3-D2
        severity: material
        title: G1 fails in about 9 percent of runs in which the contract's own model is true, through the control's KR band
        evidence: >-
          Monte Carlo (4000 runs, uniform relation selection): G1 fails 9.2
          percent (AM1 KR alone 6.9, KR with FR 1.35, FR alone 0.55); first-found
          selection 9.75 percent. KR relative sd on CTRL-ZN is 12.9 percent
          (relation attempts 8.6 to 8.7 percent at p = 1 - exp(-1/32), graph-level u
          spread about 9 percent, a_bar sampling 2.7 percent) against a fixed band of
          about +-0.223 in log (about 1.7 sd); FR 9.8 percent (about 2.3 sd). D-4 derived the
          "four to five sd" for the binary cell only.
        consequence: >-
          Every seed label is fixed, so G1's result is predetermined: the frozen
          design carries a prior probability of about 0.09 that it fails its own
          blocking gate when H1 and H2 hold, which S2 records as a design defect;
          no rerun changes it, and only a superseding contract can clear it. The
          audit's most_likely basis misstates the control.
        remedy: >-
          Scale the KR and FR bands per cell to the model's sampling sd at that
          cell's mu and B, or add a control in the binary cells' regime (a
          relabelled Z/NZ with B = 512 and N the least prime above 2^19, so
          mu = (2B)^2 / (2N) is about 1.0, where the KR sd is about 4.6 percent),
          and restate the most-likely figure.
      - id: J3-D3
        severity: moderate
        title: The three amortisation gates reduce to two scalars; AM3 (the fit over all L) is dominated by AM1 and cannot fail alone
        evidence: >-
          In the reuse arm per-target units are attempts x w and do not depend on
          L by construction, so FR = a_bar / a_pred exactly, KR x FR = rho_rel
          exactly, and d_sigma = f(KR K_pred) - f(K_pred) up to per-L noise. AM3
          passes for KR in [0.509, 2.083] (control) and [0.421, 3.651] (binary),
          supersets of [0.8, 1.25]; 0 of 24000 simulated cell-runs had AM3
          failing with AM1 passing. Q2 shows a cell whose usable fraction is 23
          percent below prediction passing all three amortisation gates.
        consequence: >-
          Not the knee-rule defect (AM3 is not confined inside its band), but the
          number of independent amortisation gates is overstated, and the L
          dimension of "the FORM of the amortisation law" (statement (D)) is not
          testable by the reuse arm: what the cells can test is the relation-phase
          yield (rho_rel), the attempts law (a_bar) and the determined-column law
          (delta_hat, u_hat).
        remedy: >-
          Say so in the admissible-range block and in statement (D)'s gloss of
          FORM, or replace AM3 by an observable with its own failure region.
      - id: J3-D4
        severity: moderate
        title: The obstruction H1 names lands in LOW-RETRY, which the outcome table refers to an audit with no criterion and no outcome
        evidence: >-
          KN-FIND-007 defines coverage as the fraction of targets with at least
          one decomposition and says concentration lowers it at matched mean.
          Reviewer patterns (two-point yield mixtures, legs uniform, mean kept):
          target coverage 0.903, 0.808 and 0.684 of the Poisson value give
          LOW-RETRY (T_a low; AM2 low only at 0.684), KR 1.03 to 1.12 and
          d_sigma -0.003 to -0.011 inside their bands; coverage 0.955 passes
          everything. Both binary cells LOW-RETRY is H1-NEGATIVE-DEVIANT
          "referred to an instrument audit before it is interpreted"; the audit
          has no stated criterion, and there is no declared outcome for an audit
          that finds an instrument defect.
        consequence: >-
          The named NEGATIVE ("coverage-limited on subspace bases") is reachable
          only through determined-column coverage; the most direct signature of
          the obstruction the hypothesis cites is pre-labelled instrument-suspect
          and its final reading is left to an unregistered act.
        remedy: >-
          Pre-register the LOW-RETRY audit (what it checks, which outcome it
          assigns either way), and state which class a KN-FIND-007 yield deficit
          maps to; correct the paraphrase in H1's random_model_justification
          (J4-D4).
      - id: J3-D5
        severity: minor
        title: The relation kept at mu about 1 depends on an unfixed return order; the control cannot see it
        evidence: >-
          At mu = 1, 41.8 percent of relation attempts that succeed return two or
          more decompositions; run_ic_shared keeps decs[0]. The committed
          ZNOracle returns decompositions in base-index discovery order; oracle
          A's order is not fixed by any committed text or code ("for each x1 in
          V"). Under the most index-biased order, Monte Carlo E[delta_hat] on a
          binary cell is 0.7906 against 0.7969 for a uniform choice (-0.0063,
          0.36 graph-sd), u_hat 0.6255 against 0.6354, LOW-COV rate 0.40 to 0.47
          percent against 0.13 to 0.15. At the control's mu = 1/32 only about 1.6
          percent of relations are affected, so CTRL-ZN cannot detect it.
        remedy: >-
          Keep a seeded uniformly chosen decomposition, or fix and model the
          order; A2 should say which.
      - id: J3-D6
        severity: minor
        title: Three producer reachability patterns are not data the reuse arm can produce
        evidence: 'P5, P6 and P8 set FR = 1.0 against a_bar / a_pred(mu) = 0.564, 1.153 and 0.744.'
        remedy: 'Derive patterns from generative quantities through the identities (no outcome is lost: Q5, Q8, Q14).'
      - id: J3-D7
        severity: minor
        title: Two of CTL-6's three conjuncts cannot fail under the committed control code
        evidence: >-
          run_ic_shared loops until exactly B relations and charges one fixed
          units_per_attempt per call, so relations = B and the accounting identity
          hold identically on CTRL-ZN; the R = 4B over-complete preimage (O2) is
          not producible by the committed code. On the binary cells the accounting
          conjunct is live only through the uncommitted oracle A. Only
          delta_hat < 0.95 is a live test everywhere.
        remedy: 'State CTL-6 as the delta_hat test plus an integrity assertion.'
    observations:
      - id: J3-O8
        text: 'The null''s design expectations in D-5 are accurate (Monte Carlo medians KR 0.0118 and 0.0028, FR 85 and 354, d_sigma about +0.73 and +0.76).'
      - id: J3-O9
        text: 'T_u''s binomial SE is accurate (z-sd 1.00); T_a''s SE is conservative by 14 to 21 percent.'
      - id: J3-O10
        text: >-
          H2 under the random-mapping model with the I2 semantics: H2-band pass
          0.986 (control), 0.972 (BIN-ORD-19), 0.9735 (BIN-KOB-19); W1 / sqrt(pi N_G
          / 2) = 1.110, 1.056, 1.069; c(1) sd 0.097 to 0.105; exponent_rho means
          -0.483 to -0.487, never outside [-0.6, -0.4] in 5000 replicates. The
          reviewer's model is a random mapping, not the r-adding walk with r = 20.

