    EXP-BINSTD-532d7f memory_beside_time and preregistered_prediction, and the audit
    sheet stage0_recomputation steps 2 to 8, all at the snapshot bytes. Tolerances are the
    plan's: Q1, Q2, Q5 within 0.05 bit; Q3 exact on the identity and on the LA direction;
    Q4 within 1 bit per bound and 0.2 on the critical g. Compared before any key applied.
  model_inputs_that_differ: |
    The J5 card fixed the per-target constant at 1.6 and the attempt constant at 1.58, and
    the comparator inputs at 33.08 and 32.4 bits. The contract uses kappa_5 = 1.637128,
    A1 = 1.581977, and 33.075936 and 32.414212. These are card choices, not J5 choices.
    Composer's reconciliation on the reported values: the critical log2 C moves by half of
    log2((1.637128 x 1.581977)/(1.6 x 1.58)) = 0.0175 bit, which is the gap between the
    contract's 45.3319 and J5's 45.3493; upper window ends move by about twice the
    per-target log ratio (0.066) less or plus the comparator-input offset, which is the
    0.06 to 0.10 seen below.
