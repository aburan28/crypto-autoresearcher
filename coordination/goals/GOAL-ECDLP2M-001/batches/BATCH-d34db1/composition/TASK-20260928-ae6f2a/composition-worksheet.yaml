joint_table:
  note: |
    One row per joint of REVIEW-BINSTD-A-20260928-d34db1. Every joint has exactly one
    owner and an attested verdict; no joint is unowned or unattested. The composed
    disposition is this composer's reading of the report against the plan's own
    breaking_artifact list, not a count of verdicts (CA-2).
  rows:
    - joint: J1
      owner: TASK-20260928-d5024b
      reviewer_verdict: breaks
      what_holds: |
        T_gen, P_gen and B_cap column (largest difference 0.0048 bit against the two-decimal
        design figures); identity exact; LA term below P_gen at every tested m; the m = 5
        window in both conventions (bounds to 0.01, critical g to 0.004); rho convention
        exact; D3 column recomputed (largest difference 0.0041 bit); 4b65e3 section with the
        1.58 factor and the m = 8 residual recorded as a definitional difference with its
        arithmetic; D1 used nowhere as a budget (J1-C1 to J1-C13).
      breaking_artifact_matched: |
        Plan J1 items "an m = 4 window not stated exactly" and "a window bound off by more
        than 1 bit or a critical g off by more than 0.2". The m = 4 envelope over free B has
        two committed B ranges (specification stage_0: 29.036 to 33.896; stage0_code and
        audit step_9: 29.036 to 35.996 or 36.000) and its hand figures follow from neither:
        upper edge 99.38 - 2g on the code grid against the audit's 98.05 - 2g (1.33 bit),
        closing g 31.128 on the specification grid against about 31.5 (0.37). Stopping rule
        S5 would halt an approved run at Stage 0.
      corroboration: |
        The closing point on the code grid (log2 C 42.527 at log2 B 34.326, d5024b E04) is
        reproduced by TASK-20260928-a75ba7's independent PTM-A scan over log2 B in [25, 40]
        (42.527 at log2 B 34.33). Independent code, not blind.
      composed_disposition: breaks, on C2 (the m = 4 window not stated exactly); every other J1 item holds
      key_applied: K-revise-defect
    - joint: J2
      owner: TASK-20260928-d5024b
      reviewer_verdict: breaks
      what_holds: |
        Fixture exists as runnable code (stdlib imports, __main__ guard, two fits, pass test;
        dry import clean); G1 stated before execution and wired into S1, S2, IR-1 and IR-6;
        I1 implementable as written; orders recomputed and proved at setup; certificates and
        seeds declared; H1 and H2 numbered with the required validation-plan fields; memory
        table present; no approval field missing; approved_by null; zero runs; hashes match.
      breaking_artifact_matched: |
        The joint's own clause that H1 and H2 carry validation plans with sample, comparison
        and tail, read at the review-breakthrough tier. (a) The knee rule confines exponent_ic
        to [-1.0805, -0.9195] on the designed knee cells for any cost data, so the IC arms of
        G1, IR-3 and success clause (iii) cannot fail and the NEGATIVE outcome, through which
        the falsification criterion routes, is unreachable. (b) usable_fraction counts
        determined columns while the prediction 0.748 is the touched-column probability;
        under the contract's own random model the determined value at m = 2, R = B is about
        0.635, so clause (iv) fails on most relation graphs for a definitional reason. (c)
