    - {item: overturn condition 1, prior: 'J5 off the T_gen column by more than 0.5 bit', outcome: 'did not occur', located_as_predicted: n/a}
    - {item: overturn condition 2, prior: 'LA term not below P_gen at m = 4', outcome: 'did not occur (margin 7.64 bits by J1 and J5)', located_as_predicted: n/a}
    - {item: overturn condition 3, prior: 'a reviewer exhibits a published algorithm below the S T^2 = N line', outcome: 'did not occur; the red team read CGK at source and found the same form of bound', located_as_predicted: n/a}
  reading: |
    The outcome class matched the prior (revise), but the prior located the breaks on the
    wrong joints for three of four. Under the recorded per-joint probabilities, all four
    of J1 to J4 breaking had roughly 0.015 probability if treated as independent, so the
    prior was overconfident that the contract's wording and fixture were the weak points
    and did not anticipate the dominant defect: the Stage 1 and Stage 2 decision table for
    H1 cannot falsify and measures a different quantity from the one it predicts. That
    defect was found independently on two joints (J2 by the validator, J3 by the red
    team). The deployed arithmetic held on both routes, and J5, the structurally blind
    check, held on every sub-item of the prior. Per PD-R1 the concurrence of J1 with the
    column values is weak corroboration; the concurrence of J5 is not. Calibration lesson
    for the next plan: put a joint on the decision table itself (can each declared outcome
    be reached, and does each prediction match the defined metric).

blindness_and_procedure_ruling:
  rule_applied: |
    Plan blindness: mutual, not lifted; no reviewer reads another reviewer's report; J1's
    recomputation must not reach J5 before J5 returns. The plan forbids reading reports,
    not seeing a directory name, a commit subject or a file name.
  disclosed_exposures:
