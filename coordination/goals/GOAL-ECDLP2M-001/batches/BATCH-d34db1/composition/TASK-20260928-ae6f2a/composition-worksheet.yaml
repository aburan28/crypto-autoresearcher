    - {reviewer: TASK-20260928-a75ba7, exposure: 'git log --oneline -3 showed two subjects naming lane-B task TASK-20260928-4b00da', content_seen: subjects only}
    - {reviewer: TASK-20260928-a75ba7, exposure: 'listing of the shared session scratchpad showed file names written by other subagents', content_seen: none, note: none opened}
    - {reviewer: TASK-20260928-a75ba7, exposure: 'final git status showed the directory names 95abde and d5024b', content_seen: none}
    - {reviewer: TASK-20260928-95abde, exposure: 'none (no git command, no listing, four-file whitelist)', content_seen: none}
  interruption_facts: |
    d5024b and a75ba7 were each cut off by an API usage limit after reading and before
    writing anything, then resumed from their own transcripts on claude-opus-5-5 at effort
    max (claude-fable-5-1 before). Each re-ran its custody checks after resumption, relied
    on no pre-interruption output except source reads re-verified by content hash, and
    recorded the event in its attestation. d5024b discloses one pre-interruption write
    outside the repository (a validate_ledger output in the session scratchpad).
  ruling: |
    Admitted; no joint is discounted. (1) Every exposure is to a name, a commit subject,
    a file path or a line count; no value, verdict or report text of any sibling crossed,
    and each reviewer attests read_sibling_reports false. (2) The structurally blind joint
    J5 had no exposure at all, and its artifacts were generated at 01:03:49Z, before
    d5024b recorded its computations (03:19Z to 03:21Z), so J1's recomputation could not
    have reached J5 before J5 returned. (3) The J2 and J3 breaks share a defect family;
    d5024b saw only the path of the red-team report and did not open it, and the two
    reports reach the defect by different routes (d5024b by exact knee-set enumeration
    and a signed-graph Monte Carlo seeded 20260929; a75ba7 by null objects and a separate
    Monte Carlo seeded 11 to 14), so they are counted as independent findings of one
    defect, composed once. (4) The interruptions are admitted: same independent session,
    same policy and effort, backend substitution recorded as fallback_used, TA-4 not
    fired. Model independence is not claimed (DEC-20260928-65c6d7 R-INDEPENDENCE).
  procedure_deviations_recorded:
    - id: PD-C1
      text: |
        The session scratchpad is shared by the subagents of one top-level session, so
        file names written by one reviewer are visible to another. No content crossed per
        the attestations. Successor rounds give each reviewer a private scratch
        subdirectory (a75ba7 did so on its own).
    - id: PD-C2
      text: |
        This composer's own exposures: a Grep line-count call over the reviews directory
        displayed the directory names TASK-20260928-062eb8, TASK-20260928-91b346 and
        TASK-20260928-d1ad97 with line counts of their computations.json files, content
        not read; and DEC-20260928-9d9c47 was read at lines 1 to 70 (header, decision label,
        independence and the start of its custody block) as well as its selection-point
        block (lines 720 to 809). Nothing from lane B beyond the re-rank is used or stated.
    - id: PD-C3
      text: |
        The J5 card fixed the constants 1.6 and 1.58 and the rounded comparator inputs
        33.08 and 32.4, while the contract uses 1.637128, 1.581977, 33.075936 and 32.414212.
        This widened the J5 residual to 0.017 on the critical g and to 0.06 to 0.10 on upper
        window ends, all within tolerance. The next blind card should carry the contract's
        own constants and unrounded inputs, and should include the m = 4 envelope.

