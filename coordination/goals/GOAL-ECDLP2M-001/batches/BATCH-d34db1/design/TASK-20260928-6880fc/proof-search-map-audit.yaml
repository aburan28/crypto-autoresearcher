    design_findings:
      - id: DF-1
        subject: the presentation of the E/4E filter
        finding: >-
          IDEA-20260926-136bd3 writes the E/4E map as
          (Tr(x(P)), Tr(x(P/2))) for P in 2E and assigns it alphabet 4. Read
          literally, the pair on 2E has first coordinate identically 0, because
          membership in 2E is exactly Tr(x) equal to Tr(a), so on 2E the pair
          takes two values and computes the further quotient 2E/4E. THE
          ALPHABET-4 OBJECT is the quotient of the WHOLE group E onto E/4E,
          cyclic of order 4 when the 2-Sylow subgroup is cyclic of order 4.
        resolution_in_the_design: >-
          The contract CONSTRUCTS the homomorphism onto Z/4 by scalar
          multiplication (definitions.halving_and_the_exact_filters) and makes it
          the tested object, with the trace pair reported beside it as its cheap
          presentation on 2E and setup check CK-H4 recording whether the two
          agree up to a labelling. The well-definedness the record gives, that
          the unique 2-torsion point lies in 2E so both halves give the same
          second coordinate, is correct and is carried: the second coordinate is
          h2 of a half, and h2 of T is 0 because T lies in 2E.
        status: a design finding of this producer, not a correction of the record, which is not edited. Joint J2 is asked to check it.
      - id: DF-2
        subject: the composite-cell alphabets, constructed rather than asserted
        finding: >-
          The record asserts that the n equal to 17 composite cell exhibits exact
          filters of alphabet 548 and 956. The design does not assert them: it
          BUILDS them, by exhibiting a generator of the cell's group (verified
          cyclic), building a full discrete-logarithm table by enumerating that
          generator's multiples, and taking the logarithm modulo M. That is a
          surjective homomorphism onto Z/M for every divisor M of the order, so
          548 equal to 4 times 137 and 956 equal to 4 times 239 follow from the
          divisor list rather than from the record.
        status: a strengthening of the control, recorded so the reviewer of PTM-A can check that the certificate code does not assume the target order prime.
      - id: DF-3
        subject: feasibility of the required per-cell order proof at n equal to 29 and 31
        finding: >-
          The trace-based count enumerates the field and is infeasible at
          n equal to 29 and 31, so a design that required it would have made the
          ladder unrunnable. The contract instead requires the Lucas recurrence
          plus the order-N-point-and-Hasse proof of stage_0.order_proof_route,
          which is a proof and is cheap at every n in scope, with the
          enumeration used as a third route only where it is cheap.
        status: a design decision recorded so the reviewer can see that C6 is met without an infeasible step.
      - id: DF-4
        subject: sampling at n equal to 29 and 31
        finding: >-
          Points cannot be enumerated at those degrees either, so uniform pairs
          are drawn by rejection: sample x uniformly, keep it when the curve
          equation is solvable, lift, and choose the sign uniformly. That is
          uniform on the affine points. The point at infinity and the
          degenerate pairs are excluded and counted, as the estimator definition
          requires.
        status: a design decision, recorded with its uniformity argument.

