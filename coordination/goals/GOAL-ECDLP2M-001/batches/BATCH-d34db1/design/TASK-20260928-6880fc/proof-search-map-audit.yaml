        and are placed in the specification's stopping rule SR-1 and
        invalidation rules IR-1 to IR-5, so that NO KOBLITZ-SPECIFIC ARM IS READ
        ON A CELL BEFORE ITS GATE PASSES ON THAT CELL.
      not_executed: >-
        The fixture was NOT RUN by this producer. The card declares zero runs and
        this session holds no shell. The code is committed text with its pass
        criteria pre-registered; a reviewer may read it statically or perform a
        syntax check as a review computation, recorded as such.
    audit_1_verdict: >-
      PRESENT WITH SUBSTANCE. Four symbolic reproductions, one first-principles
      re-derivation of the accounting the unreadable source would have supplied,
      one first-principles re-derivation of the halving criterion, and a frozen
      fixture committed as code rather than planned.

  audit_2_observation_collision:
    status: present
    observable: >-
      The pair (M, G(h)) per filter per cell, together with the behaviour of
      G minus 1 along the ladder n in 19, 23, 29, 31.
    collisions_searched_and_named:
      - id: OC-1
        two_objects: >-
          A genuine approximate homomorphism, and a filter whose MARGINAL is
          skewed so that one heavy bucket makes the maximum conditional
          probability large with no propagation content.
        why_it_is_a_real_collision: >-
          This is not hypothetical. KN-FIND-ffe1df records exactly this pair:
          popcount and digit-sum tripped its own refutation criterion on E(F_p)
          with fitted exponents excluding zero, and BOTH were false positives
          because the matched-marginal shuffle reproduced them almost exactly.
          The declared family F1 here, the normal-basis Hamming weight, is a
          weight statistic with a binomial marginal, so this design is aimed
          straight at the object that produced that false positive.
        separator: >-
          The matched-marginal shuffle on EVERY arm: permute h's values among
          points of equal marginal bucket probability and recompute G on the
          same pairs. A genuine propagation signal must be destroyed; a marginal
          artifact must be preserved. Mandatory, blocking (CTL-SHUFFLE), and
          reported beside every G.
      - id: OC-2
        two_objects: A genuinely low G, and a G that is low only because the conditioning table is too sparse to estimate.
        separator: >-
          Conditioning cells below 100 samples are excluded and the exclusion
          count is reported (IR-12 refuses an estimate when more than half the
          cells are excluded), and the exhaustive-versus-sampled check
          CTL-SAMPLING pins the estimator against a full enumeration on one
          small combination per cell.
      - id: OC-3
        two_objects: A filter that is approximately compatible, and a filter that is SECRETLY EXACT.
        separator: >-
          Check the candidate's kernel against the subgroup lattice. On a
          prime-l cell the only proper subgroups have index 1, 2, 4, so a filter
          reading G equal to M with M outside 1, 2, 4 cannot be exact and would
          be the lead; a filter reading exactly 2 or 4 is identified with h2 or
          h4 by comparing the two maps pointwise.
      - id: OC-4
        two_objects: >-
          An instrument that can see capacity, and one that cannot see it at all
          and therefore reads a null everywhere.
        separator: >-
          The forced-nonzero readings on the nearby objects: CELL-K17C at
          alphabets 548 and 956, and the CELL-Z log-interval key at about M/2.
          Both are blocking. An instrument failing them makes NO null on ANY
          cell admissible (IR-4, IR-7). This is the sensitivity gap
          KN-FIND-ffe1df's red team recorded against its own P2 control, and
          closing it is the reason those two cells are in the design.
    audit_2_verdict: >-
      PRESENT WITH SUBSTANCE. Four named collisions, each with a separator that
      is a blocking control of the contract rather than an intention, and the
      first of them reproduces a documented false positive of the same
      statistic.

  audit_3_quantifier_order:
    status: present
    statements:
      - id: Q-CERT
        claim: >-
          FOR ALL finite abelian groups G, FOR ALL M, and FOR ALL maps h from G
          onto an alphabet of size M for which THERE EXISTS a combining rule f
          with h(P + Q) equal to f(h(P), h(Q)) for ALL P, Q in G and f
          invertible in each argument: M divides the order of G and h is a group
          homomorphism.
        dependencies_allowed: >-
          f may depend on h and on G. It may NOT depend on the pair (P, Q): that
          is the content of exact sum-compatibility and the whole strength of the
          statement. NOTHING is allowed to depend on a target.
        instantiation: >-
          HENCE, FOR THE SPECIFIC GROUP of order 4l with l prime: every
          admissible M divides 4l, so every M strictly below l lies in 1, 2, 4.
          The quantifier order matters here: the bound is on M for every h, not
          on h for some M.
      - id: Q-MEAS
        claim: >-
          FOR THE TESTED cells, FOR THE DECLARED families F1 to F5, FOR the two
          alphabets, AT LEVEL 1 ONLY: G(h) minus 1 lies within the random-label
          null spread and the fitted slope is at most 0.
        dependencies_allowed: >-
          The measured value may depend on the cell, the family, M, the basis,
          the seed and the sample size, all of which are reported per arm. NO
          statement is made uniformly over filters, so no witness is asked to be
          uniform.
        not_claimed: >-
          Anything about undeclared filters; anything about TARGET-DEPENDENT
          filters, where h is allowed to depend on the target and which are
          declared out of family and named as the widest open class; anything
          about levels above 1, whose inputs are conditioned on level-1 survival
          and are therefore neither uniform nor independent; anything at
          n equal to 131.
      - id: Q-CEIL
        claim: >-
          IF THERE EXISTED a filter of alphabet about 2^25.80 with G equal to M
          at each of three internal levels, THEN the ideal 16-list tree would
          total the CEIL row's figures. The antecedent is FALSE by Q-CERT.
        dependencies_allowed: none; the implication is arithmetic
        not_claimed: >-
          That any such filter exists, that the total is reachable, or that any
          cost below matched rho is attained by anything. A material implication
          with a false antecedent is recorded as a ceiling and never as a cost.
      - id: Q-TRANSFER
        claim: >-
          HEUR-B2, explicitly a heuristic: IF G_n minus 1 lies in the null and
          does not grow over the four measured n, THEN G_131 minus 1 is of order
          N^(-c) for some c greater than 0.
        dependencies_allowed: c may depend on the family
        not_claimed: >-
          That this is a bound. It is a transfer heuristic over about 100 bits of
          N from about 12 bits of measured range, and the record says so wherever
          the transfer appears.
    audit_3_verdict: >-
      PRESENT WITH SUBSTANCE. The universal statement is the certificate, the
      measurement is existentially scoped to declared objects, the ceiling is an
      implication with a false antecedent, and the transfer is labelled a
      heuristic. The one place a witness could smuggle in a dependency, a
      combining rule depending on the pair or a filter depending on the target,
      is named and excluded in both directions.

  audit_4_method_ceiling_and_nearby_object_control:
    status: present
    strongest_certifiable_claim: >-
      "On ECC2K-130 every exactly sum-compatible filter has alphabet at most 4,
      so the exact capacity of its ambient group below l is 2 bits; and on toy
      Koblitz cells at n in 19, 23, 29, 31 the declared Koblitz-specific filter
      families read level-1 bucket gain within the stated interval of the
      random-label null at M equal to N^(1/3) and N^(1/4), with the exact
      filters reading 2 and 4, the composite-order cell reading 548 and 956, and
      the log-interval control reading about M/2."
    what_it_can_never_certify:
      - That no cheap filter exists. The family is DECLARED and therefore incomplete; this is a property of the method, not a gap in its execution.
      - Anything about target-dependent filters, which are out of family by construction.
      - Anything about levels above 1 of a tree.
      - Anything about the algebraic decomposition route, the chained Semaev system, or any other relation source.
      - Any cost, margin or security statement about ECC2K-130 or any other deployed curve.
      - >-
        A null at n equal to 131. The method's reach in n is what the ladder
        measures and HEUR-B2 carries, as a heuristic and never as a bound.
    nearby_object_controls:
      - object: the composite-order Koblitz cell at n equal to 17, order 4 times 137 times 239
        where_the_hoped_for_conclusion_fails: >-
          There the capacity is NOT 2 bits: alphabets 548 and 956 are admissible.
          A certificate implementation that returned 2 bits there would have
          assumed the target order prime, and a gate that read the null there
          would be blind to capacity.
        blocking: true
      - object: the relabelled Z/lZ control with the log-interval key
        where_the_hoped_for_conclusion_fails: >-
          There an APPROXIMATE filter genuinely exists, with G about M/2. A rule
          that reads the null there cannot see approximate filters, and then no
          null on any Koblitz arm is admissible.
        blocking: true
      - object: Z/2^n with the low-bits filter
        where_the_hoped_for_conclusion_fails: >-
          There exact filters of every alphabet 2^i exist. A certificate that
          found no alphabet between 4 and the order there has proved too much.
        blocking: true
      - object: the ordinary curve at matched degree, CELL-O19
        where_the_hoped_for_conclusion_fails: >-
          There the cofactor is 2, so the capacity is 1 bit and h4 does not
          exist, and the Frobenius-invariant families are undefined. It separates
          a Koblitz-specific reading from a coordinate-generic one.
        blocking: true
    method_tuned_on_the_target: >-
      NO. Every threshold is pre-registered: the gate criteria, the lead
      threshold of SR-4, the null width as the reference, and the family list.
      The nearby-object controls are specified before any tuning is possible,
      and a change after a run requires a versioned protocol_amendment (IR-16).
    audit_4_verdict: >-
      PRESENT WITH SUBSTANCE. The ceiling is stated as a sentence the method
      could certify under ideal tuning, its six exclusions are named, and four
      nearby objects are blocking controls rather than remarks.

  # ---------------------------------------------------------------------------
  strictness_and_interface_obligations:
    note: >-
      KN-TECH-080 adds two obligations that are usually missing. Both are filled
      here, and the first is filled by recording that NO strict improvement is
      claimed.
    strictness:
      claimed_improvement: none
      text: >-
        NO IMPROVEMENT OVER ANY BASELINE IS CLAIMED, so no strictness obligation
        arises for an improvement. What DOES carry a strictness obligation is the
        separation the design asserts between three quantities that a careless
        reading would merge: the EXACT capacity (unconditional, 2 bits), the
        CEILING (conditional on a filter the certificate excludes), and the
        APPROXIMATE capacity (measured, toy tier). Obligation PO-8 of
        H-BINSTD-0126fe carries the separation, and obligation PO-9 carries the
        interface that must NOT exist, namely any step converting the ceiling
        into a reachable cost. PO-9 is discharged by the outcome table of the
        contract containing no such cell.
    interfaces:
      - id: IF-1
        interface: >-
          The extension of Theorem C from a prime-order group to a
          COMPOSITE-ORDER abelian group.
        its_own_proof_obligation: YES, PO-1, and it is NOT inherited from KN-FIND-ffe1df, which states the theorem for prime order and whose validator confirmed it there.
        exact_loss: >-
          None in strength, but the conclusion CHANGES SHAPE: for prime N the
          conclusion is that no M with 1 less than M less than N exists, while
          for composite order the conclusion is that M divides the order, which
          is a set of admissible alphabets rather than an emptiness statement.
          The step that must be checked is that nothing in the quasigroup
          argument uses primality: it uses invertibility of f in each argument
          (quasigroup), associativity of addition (f associative), the
          classification of associative quasigroups as groups, surjectivity of h
          (so the alphabet is a quotient), and Lagrange. Primality enters only
          when the divisor set is read off. Joint J1 of the review plan is asked
          to name any step that needs primality; this producer found none and
          records that finding as its own, not as a proof.
        non_surjective_case: >-
          If h is not surjective the argument runs on the image, giving an
          effective alphabet dividing the order. KN-FIND-ffe1df records that its
          validator confirmed exactly this case. Carried, with the same
          provenance.
      - id: IF-2
        interface: the trace-pair presentation of the E/4E filter against the constructed homomorphism onto Z/4
        its_own_proof_obligation: YES, PO-3, with setup check CK-H4 in the contract
        exact_loss: >-
          As literally written, the pair (Tr(x(P)), Tr(x(P/2))) is defined only
          on 2E, and on 2E its first coordinate is identically 0, so as a map on
          2E it takes 2 values and computes 2E/4E rather than E/4E. The
          alphabet-4 object is the homomorphism onto E/4E on ALL of E. This is
          recorded as design finding DF-1 and the CONSTRUCTED homomorphism is the
          tested object, with the pair reported beside it.
      - id: IF-3
        interface: the (L, b) meter of the absorbed IDEA-20260926-d06324 rows against the bucket gain G of this contract
        its_own_proof_obligation: YES, PO-6 covers the estimator; the identity itself is stated and checkable
        exact_loss: >-
          None: for a filter of alphabet M the two meters are related by
          b equal to M divided by G. So row P2 reading b equal to 1 is the same
          fact as G equal to 2 for h2, and the calibration rows and the gate are
          two readings of one object. The identity is stated so a reviewer can
          check the two fixtures against each other rather than trusting both.
      - id: IF-4
        interface: >-
          The orbit-union base of the ceiling, inherited from KN-FIND-47da4e,
          against the relation count of the ceiling table.
        its_own_proof_obligation: >-
          NOT DISCHARGED HERE, DELIBERATELY. Under CORR-20260925-649e25 the
          relations-equal-B/262 framing is a PER-ORBIT relation-count framing
          conditional on a per-orbit unit that NO APPROVED CONTRACT HAS FIXED.
          It is cited as a dependency and the without-orbit line is the
          unconditional one of the pair.
        exact_loss: >-
          The factor 262 equal to 2 times 131 for negation and the Frobenius
          orbit. Whether a relation in that unit is one equation or 262 is
          exactly the unfixed unit, which is why the line is labelled twice
          conditional and is never used alone.
      - id: IF-5
        interface: the toy-cell measurement against the deployed row
        its_own_proof_obligation: YES, HEUR-B2 with its own validation plan and falsification condition
        exact_loss: >-
          About 100 bits of N. Stated as a heuristic, never as a bound, wherever
          the transfer appears.
    not_applicable_reason: null

