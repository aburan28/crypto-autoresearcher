  # ===========================================================================
  # STAGE 0 -- ZERO COMPUTE. Committed BEFORE any run.
  # ===========================================================================
  stage_0:
    status: committed before any run; this sheet is its archival form
    method_note: >-
      Every figure below is this producer's own arithmetic, written out so a
      reviewer can check each step. No shell, no calculator program and no
      instrument was used; the producer holds no shell. The figures are DESIGN
      FIGURES.

    pinned_inputs:
      curve: ECC2K-130, y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2 + z + 1)
      group_order: 4l
      l: '680564733841876926932320129493409985129'
      log2_l: >-
        129.0000 to four decimals. Step: 2^129 equal to
        680564733841876926926749214863536422912; l minus 2^129 equal to
        5570914629873562217; the ratio of that difference to 2^129 is about
        8.2 times 10^(-21), so log2(l) exceeds 129 by about 1.2 times 10^(-20).
        Every entry below uses 129.0000.
      two_sylow: cyclic of order 4, unique rational point of order 2
      rho: >-
        2^60.8090, equal to sqrt(pi l / (4 times 131)) under
        CORR-20260922-81aeab. Step: pi/524 is about 0.00599583; its square root
        is about 0.0774328; log2 of that is about minus 3.6910; and
        sqrt(l) is 2^64.5000; so the product is 2^60.8090. AMBIENT: the target
        subgroup of order l.
      log2_262: >-
        8.0334. Step: 262 equal to 256 times 1.0234375; the natural logarithm of
        1.0234375 is about 0.0231672; dividing by ln 2 gives about 0.0334;
        so log2(262) equal to 8.0334. The factor 262 equal to 2 times 131 is
        negation times the Frobenius orbit length.

    budget_quantity_statement: >-
      THIS DESIGN USES NO BUDGET QUANTITY. None of D1 (the floor-to-rho gap
      2^-4.41), D2 (the per-target oracle budget 2^+5.71) or D3 (the
      re-optimised per-attempt budget 2^+11.01), as pinned by
      CORR-20260928-4cb669 at m equal to 4, appears in the hypothesis, the
      specification or this sheet, and no per-attempt oracle budget of any kind
      is asserted. The only reference quantity is matched rho, used on the
      ceiling line alone. No free-oracle floor value of KN-FIND-aa2efc is used
      either, so the ambient of the product law does not enter; the correction is
      nevertheless applied by stating the ambient of every line this design does
      use.

    capacity_certificate:
      title: The exact sum-compatible filter capacity of the ECC2K-130 ambient group
      ambient: THE FULL GROUP, of order 4l
      argument_re_run_step_by_step:
        - >-
          Step 1. Let G be any finite abelian group written additively and let h
          map G onto a set A of size M, with a combining rule f on A such that
          h(P + Q) equal to f(h(P), h(Q)) for all P, Q in G, and f invertible in
          each argument. Invertibility in each argument is exactly what a tree
          needs in order to index buckets: at a merge it must, given a target
          bucket and one side, determine the bucket required of the other side.
        - >-
          Step 2. f is a quasigroup operation on A. This is the definition:
          a binary operation invertible in each argument, that is, whose Cayley
          table is a Latin square.
        - >-
          Step 3. f is associative. Take any u, v, w in A and, by surjectivity
          of h, choose P, Q, R in G with h(P) equal to u, h(Q) equal to v,
          h(R) equal to w. Then f(f(u, v), w) equal to h((P + Q) + R) and
          f(u, f(v, w)) equal to h(P + (Q + R)), and addition on G is
          associative, so the two agree. Note what this step uses: surjectivity
          of h and associativity of addition. It does NOT use the order of G, its
          primality, or anything about M.
        - >-
          Step 4. An associative quasigroup is a group. Associativity plus
          invertibility in each argument gives solvability of u f x equal to v
          and y f u equal to v uniquely, hence an identity and inverses; A with f
          is a group of order M.
        - >-
          Step 5. h is a group homomorphism from G onto (A, f). h(P + Q) equal to
          f(h(P), h(Q)) is the homomorphism property once f is the group
          operation, and h is surjective by hypothesis.
        - >-
          Step 6. Lagrange. G/ker(h) is isomorphic to (A, f), so M divides the
          order of G. THIS IS THE ONLY PLACE THE ORDER OF G ENTERS, and it
          enters as a divisibility statement, not as a primality one.
        - >-
          Step 7. Non-surjective h. If h is not onto, run steps 1 to 6 on the
          image; the effective alphabet divides the order of G. KN-FIND-ffe1df
          records that its validator confirmed this case for prime order;
          carried, with that provenance.
        - >-
          Step 8. Instantiate on the composite ambient group of order 4l with l
          prime. The divisors of 4l are 1, 2, 4, l, 2l, 4l and no others, because
          4 equal to 2^2 and l is an odd prime. Hence every admissible alphabet
          M strictly below l lies in 1, 2, 4.
      result:
        admissible_alphabets_below_l: [1, 2, 4]
        exact_capacity_below_l_bits: 2.00
        exact_capacity_of_the_target_subgroup_bits: 0.00
        target_subgroup_note: >-
          On the subgroup of order l, l prime, the divisors are 1 and l, so the
          only admissible alphabet strictly below l is 1 and the capacity is
          0 bits. This is the prime-order statement of KN-FIND-ffe1df, unchanged.
      the_two_nontrivial_filters:
        M_equal_2: >-
          The quotient onto E/2E. Computed as P to Tr(x(P)) + Tr(a), which on
          the ECC2K-130 model with a equal to 0 is Tr(x(P)). RE-DERIVED from the
          group law in audit 1: membership in 2E is Tr(x) equal to Tr(a).
        M_equal_4: >-
          The quotient onto E/4E, cyclic of order 4 because the 2-Sylow subgroup
          is cyclic of order 4 and 4E equals the odd part. CONSTRUCTED in
          FIXTURE-B1 as P to the discrete logarithm, base a fixed generator of
          E[4], of P multiplied by c times the odd part, where c is the inverse
          of the odd part modulo 4. Its cheap presentation on 2E is the trace
          pair; see design finding DF-1.
      controls_on_this_certificate:
        - On Z/2^n the same steps return the subgroup filters of every alphabet 2^i, so the capacity below 2^n is n minus 1 bits.
        - On Z/(4 times 137 times 239) they return every divisor, including 548 and 956, so the capacity below 239 is log2(137), about 7.10 bits.
        - >-
          Both are required readings of the Stage 1 gate, so an implementation
          that returned 2 bits on either has proved too much and is caught before
          any Koblitz-specific arm is read.
      what_this_certificate_does_not_say: >-
        Nothing about APPROXIMATE filters, which is what the experiment measures;
        nothing about target-dependent filters; nothing about levels above 1;
        nothing about any cost. It is a statement about the subgroup lattice.
      proof_obligation: PO-1 of H-BINSTD-0126fe. The extension to a composite-order group is its own obligation and joint J1 is asked to attack it step by step.

    order_proof_route:
      problem: >-
        Design condition C6 requires the group order recomputed and proved at
        setup on every cell, but the trace-based count enumerates the whole
        field and is infeasible at n equal to 29 and 31.
      route_A: >-
        The Lucas recurrence. For the Koblitz curve with a equal to 0,
        #E(F_2^n) equal to 2^n + 1 minus s_n with s_0 equal to 2,
        s_1 equal to t, s_(i+1) equal to t s_i minus 2 s_(i-1) and t equal to
        minus 1. Exact integer arithmetic, cheap at every n in scope.
      route_B: >-
        A PROOF, independent of route A and cheap at every n. Let N be route A's
        value. Factor N, find a point P with [N]P equal to the point at infinity
        and [N/p]P not equal to it for every prime p dividing N; then P has order
        exactly N, so #E is at least N and is a multiple of N. By the Hasse
        bound #E lies within 2 sqrt(2^n) of 2^n + 1, an interval of width about
        4 sqrt(2^n), which for N about 2^n contains exactly one multiple of N.
        Hence #E equal to N exactly. This is a proof, needs only scalar
        multiplication, and is the route the contract requires at every cell.
      route_C: >-
        The trace-based count, used as a third route at n equal to 17 and 19
        where enumeration is cheap. Where all three routes are available they
        must agree.
      hand_values: >-
        t_19 equal to 797 and t_17 equal to 101 are INPUTS to be checked against
        route A, and the derived orders 523492 equal to 4 times 130873 and
        130972 equal to 4 times 137 times 239 are inputs to be checked against
        routes A and B. NEITHER IS CITED AS A RESULT ANYWHERE in the three
        artifacts. A disagreement halts that cell.

    ideal_tree_table:
      model: >-
        The model of EXP-BINSTD-de9678 definitions.ceiling_model, re-derived from
        first principles in audit 1: k equal to 2^j lists of size
        L equal to N^(1/(j + 1)); per-attempt cost k times L; B equal to L;
        relations R equal to B without orbit unknowns and B/262 with them;
        linear algebra k times R^2; total R times k L plus the linear algebra.
      ambient: THE TARGET SUBGROUP of order l, so N equal to l and log2(N) equal to 129.0000.
      storage_convention: >-
        One point stored as its x-coordinate alone, ceiling(131/8) equal to
