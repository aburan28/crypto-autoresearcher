  # ===========================================================================
  # THE FOUR KN-TECH-080 AUDITS
  # ===========================================================================
  audit_1_bottleneck_and_baseline_reproduction:
    status: present
    bottleneck: >-
      The level-1 bucket gain G(h) at alphabet M equal to N^(1/(j + 1)) for
      cheap filters on a binary Koblitz curve. DECISION-CHANGING: the k-list
      column of RQ-BINSTD-b6f698's reachability table is today a prose closure
      by Theorem C, and either outcome of this measurement replaces it with a
      quantity. Every other quantity in the route is fixed: the exact capacity
      by the certificate below, the ceiling and the two floors by arithmetic.
    baseline_reproduced_symbolically:
      - slice: Z/2^n with h the low log2(M) bits, Wagner's own setting
        reproduction: >-
          The subgroups 2^i Z/2^n are exactly the proper subgroups, so the
          quotient maps are exact filters of every alphabet 2^i, i from 0 to n.
          The capacity below 2^n is n minus 1 bits. Reading the low log2(M) bits
          IS the quotient onto Z/M, so it reads G equal to M exactly. This is
          the object the whole k-tree literature is stated for and the design
          must reproduce it or the certificate is vacuous.
      - slice: the composite toy cell Z/(4 times 137 times 239)
        reproduction: >-
          For a cyclic group of order N every divisor M of N gives exactly one
          quotient of order M. With N equal to 130972 equal to
          4 times 137 times 239, the divisors are 1, 2, 4, 137, 239, 274, 478,
          548, 956, 32743, 65486, 130972 (137 times 239 equal to 32743;
          2 times 32743 equal to 65486; 4 times 32743 equal to 130972). So the
          admissible alphabets include 548 equal to 4 times 137 and 956 equal to
          4 times 239, and the capacity below the largest prime factor 239 is
          log2(137) about 7.10 bits. THIS IS THE NEARBY OBJECT WHERE THE
          CAPACITY IS NOT 2 BITS.
      - slice: the relabelled Z/lZ control with the log-interval key
        reproduction: >-
          Writing the key as the top log2(M) bits of the discrete logarithm, the
          top bits of a sum agree with the sum of the top bits except for one
          carry, so the conditional distribution of the key of a sum concentrates
          on two adjacent values and G is about M/2. This is an APPROXIMATE
          filter whose existence the instrument must be able to see; it is the
          far-end positive control.
      - slice: the k-list accounting itself, RE-DERIVED because Wagner 2002 could not be read
        reproduction: >-
          Take k equal to 2^j lists of size L of uniform group elements, with an
          alphabet-M filter available at each internal level. Merge the lists in
          pairs: of the L^2 pairs from two lists, about L^2/M agree on the
          filter value, so taking M about L keeps the merged list size at about
          L while imposing log2(M) bits of constraint. After j levels of merging
          the single surviving list carries (j minus 1) levels of imposed
          constraint plus the final full match, so a solution appears with
          constant probability once L^(j + 1) is about N, that is
          L equal to N^(1/(j + 1)). The work is dominated by touching each
          element of each list once, k times L group operations. THIS
          RE-DERIVATION IS THE ONLY BASIS ON WHICH THE CEILING IS STATED; the
          Wagner citation is a pointer with provenance recalled and supports
          nothing.
      - slice: the halving criterion, RE-DERIVED from the group law
        reproduction: >-
          On y^2 + xy = x^3 + a x^2 + b, doubling P equal to (x1, y1) gives
          x(2P) equal to lam^2 + lam + a with lam equal to x1 + y1/x1. So Q is a
          double exactly when lam^2 + lam equal to x(Q) + a has a solution lam
          in F_2^n. The map z to z^2 + z is F_2-linear with kernel the two
          elements 0 and 1, so its image is the hyperplane of trace zero, and a
          solution exists exactly when Tr(x(Q) + a) equal to 0, that is
          Tr(x(Q)) equal to Tr(a). For n odd the root is lam equal to
          H(x(Q) + a) with H the half-trace, and the other root is lam + 1.
          Recovering the half: y(Q) equal to x1^2 + (lam + 1) x(Q) gives
          x1 equal to sqrt(y(Q) + (lam + 1) x(Q)) and then
          y1 equal to x1 (lam + x1). The two roots give two halves differing by
          the unique 2-torsion point (0, sqrt(b)). NOTE THE DIRECTION, which is
          the one the round-1 review finds reversed in IDEA-20260922-1b16d7:
          membership in 2E is Tr(x) EQUAL TO Tr(a), and on the ECC2K-130 model
          a is 0 so it is Tr(x) equal to 0.
    frozen_fixture:
      committed_here: true
      ids: [FIXTURE-B1, FIXTURE-B2]
      form: >-
        Runnable Python committed VERBATIM in the fixture_code and
        calibration_code block scalars of this sheet, extractable by taking the
