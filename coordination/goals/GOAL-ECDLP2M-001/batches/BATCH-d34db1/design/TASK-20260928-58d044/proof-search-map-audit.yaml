    step_9_m4_window: >-
      Model M4(B): mu(B) = B^4/(24 x 2^131); T_shared = B A(mu) C + 4 B^2;
      per target A(mu) retry_4 C. SUB-CAP SLICE, log2 B = 29.036035, C =
      2^(11.010250 + g): log2 mu = 116.144140 - 135.584963 = -19.440823, A =
      1/mu = 2^19.440823; per target 2^(19.440823 + 0.109772) C = 2^19.550595
      C, log2 a = g + 11.010250 + 19.550595 - 60.809036 = g - 30.248191; b =
      2^(59.487108 + g - 60.809036) + 2^(60.072070 - 60.809036) = 0.4 x 2^g +
