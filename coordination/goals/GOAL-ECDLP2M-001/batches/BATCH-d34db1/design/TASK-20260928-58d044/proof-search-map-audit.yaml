      14.785 (14.79). g = 0: b = 1 (the tie), log2 L_lo = 0.0000, log2 L_hi
      = 2 x 30.248191 = 60.4964 (60.50). g = 6: b = 26.2, log2 L_lo = 9.4233
      (9.42), log2 L_hi = 48.4964 (48.50). g = 10: b = 410.2, a =
      8.03015e-7, 4ab = 0.0013176, sqrt = 0.999341, s_minus = 410.34, log2
      L_lo = 17.3613 (17.36); s_plus = 1244896, log2 L_hi = 40.4954 (40.50).
