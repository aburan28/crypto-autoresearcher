  fixture_pass_criterion:
    id: G1
    stated_before_execution: true
    text: >-
      On CTRL-ZN (N the least prime above 2^20, relabelled by a seeded
      permutation, base of 2^7 elements, enumeration oracle at m = 2,
      R = B = 128 relations, 341 fresh targets in L cells 1, 4, 16, 64, 256,
