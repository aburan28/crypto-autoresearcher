      0.661724 - 60.809036) + 2^(57.484684 - 60.809036) = 2^(x - 32.565934)
      + 0.099827. Window: s between the roots of a s^2 - s + b = 0, that is
      log2 L_lo = 2 log2(2b/(1 + sqrt(1 - 4ab))) and log2 L_hi = 2
      log2((1 + sqrt(1 - 4ab))/(2a)); empty when 4ab >= 1. Critical:
      4ab = 1 with the LA term: 2^(2x - 90.663810) + 0.099827 x 2^(x -
      58.097876) = 1, x_crit = 45.3319 (the LA term lowers it by 1e-5).
      D3 CONVENTION, x = 33.075936 + g: g_crit = 45.3319 - 33.0759 = 12.256.
      g = 0: b = 2^0.510002 + 0.099827 = 1.424241 + 0.099827 = 1.524068,
      log2 b = 0.607906, ab about 1.1e-8, log2 L_lo = 1.2158 (1.22); log2
      L_hi = 2 x 27.021900 = 54.0438 (54.04). g = 6: b = 91.151 + 0.100 =
      91.251, ab = 4.29e-5, log2 L_lo = 13.0236 (13.02); L_hi: 2^21.021900 -
