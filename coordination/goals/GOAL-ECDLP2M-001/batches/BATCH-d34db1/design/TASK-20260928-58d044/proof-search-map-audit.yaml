    step_11_consistency_of_the_two_comparators: >-
      At C = T_gen(5) the Kuhn-Struik window is empty (x = 46.69 above
      x_crit = 45.33) and at C = T_gen(4) the cap-slice window is empty (x =
      43.54 above 42.14): an oracle on the advice frontier ties generic
      multi-target rho at L about S, as it must, since a table of size S
      and pooled walks obey the same L^(1/2) law (H2). The critical g of the
      Kuhn-Struik window sits below the frontier relaxation by exactly the
      IC constants, (1/2) log2(8 A1 kappa_m / pi) = 1.36 (m = 5), 1.39
      (m = 4).

  stage0_4b65e3:
    title: IDEA-20260926-4b65e3 Stage 0 section (absorbed per DEC-20260928-63addc S1)
    pinned_beside_record:
      columns: [m, pinned_D3, D3_recomputed_here, record_mu1, D3_minus_0.66, difference_record_minus_that]
      rows:
        - [4, 11.01, 11.010, 11.0, 'n/a (sub-cap, attempts 1/mu in both)', 0.01 against 11.010]
        - [5, 33.08, 33.076, 32.4, 32.414, -0.01]
        - [6, 37.39, 37.393, 36.7, 36.731, -0.03]
        - [8, 42.52, 42.522, 42.2, 41.860, +0.34]
        - [16, 'not pinned', 49.856, 49.7, 49.194, +0.51]
    factor_explained: >-
      At mu = 1 a random target has at least one decomposition with
      probability 1 - e^-1 = 0.6321 (Poisson count, H1 of the absorbed
      record), so the expected number of attempts to one success is 1/(1 -
      e^-1) = 1.5820 = 2^0.6617: 0.66 bit. The pinned D3 column of
      CORR-20260928-4cb669 is defined as one attempt per relation at the
      re-optimised base; the absorbed record's mu = 1 values at m = 5 and 6
      charge 1.58 attempts; the two differ by that 0.66 bit and agree once
      it is applied (0.01 and 0.03 bit). At m = 4 the pinned budget is the
      sub-cap optimum where attempts are 1/mu = 2^19.44 under both
      conventions, so no 0.66-bit offset exists and 11.01 matches 11.0.
    residual_at_m8: >-
      RECORDED AS A DEFINITIONAL DIFFERENCE, not resolved from the record's
      stated convention. Under the record's own m = 5, 6 convention (B_cap,
      1.58 attempts) the m = 8 value is 42.522 - 0.662 = 41.860, and the
      record wrote 42.2, which is 0.34 bit above that and 0.32 bit below the
      pinned 42.52. One candidate reconstruction reproduces 42.2 to 0.01
      bit: the mu = 2 point, B = 2^(1/8) B_cap = 2^18.4124 with attempts
      1/(1 - e^-2) = 1.1565 (0.2098 bit): 60.8090 - 18.4124 - 0.2098 =
      42.187. It is offered as a candidate only and is not attributed to
      the record, whose text names B_cap and mu = 1 at m = 8. The same
      pattern appears at m = 16 (49.7 against 49.194, +0.51), not pinned.
      This section adopts the pinned column and carries both figures.
    claim_A_mislabel_noted: >-
      IDEA-20260926-4b65e3 claim (A) reads the finding's column 2^4.4,
      2^12.4, 2^18.0, 2^25.2 as "rho / T at that same B", a per-attempt
      oracle budget. CORR-20260928-4cb669 pins the m = 4 value 2^-4.41 as D1,
      the floor-to-rho total-cost gap, never a per-attempt budget. Noted;
      not repeated: no field of the three files uses D1 as a budget.
    stages_1_2_not_absorbed: HOLD-X1 of DEC-20260928-63addc; nothing of the theta(m) ladder is specified here.

