        return P0, {t: seeded(EXP, CELL, "targets", t).randrange(1, N) for t in range(sum(L_CELLS))}


    def rho_multi(G, P0, targets, dp_bits, seed):
        N = G.N
        rng = seeded(EXP, CELL, "rho", len(targets), seed)
        mask = (1 << dp_bits) - 1
        max_len = R_ADDING << dp_bits
        ops0 = G.ops
        steps = []
        for _ in range(R_ADDING):
            c = rng.randrange(1, N)
            steps.append((G.mul(c, P0), c))
        table, solved = {}, {}
        walk_ops = walks = abandoned = 0
        per_target, certs = [], True
        for (t, Q) in targets:
            w0 = walk_ops
            k = None
            while k is None:
                walks += 1
                a, b = rng.randrange(N), rng.randrange(1, N)
                X = G.add(G.mul(a, P0), G.mul(b, Q))
                for _ in range(max_len):
                    if (X // R_ADDING) & mask == 0:
                        prev = table.get(X)
                        if prev is not None:
                            a2, t2, b2 = prev
                            if t2 == t:
                                if (b - b2) % N:
                                    k = (a2 - a) * pow(b - b2, -1, N) % N
                                else:
                                    abandoned += 1
                                break
                            if t2 in solved:
                                k = (a2 + b2 * solved[t2] - a) * pow(b, -1, N) % N
                                break
                            abandoned += 1
                            break
                        table[X] = (a, t, b)
                    M, c = steps[X % R_ADDING]
                    X = G.add(X, M)
                    a = (a + c) % N
                    walk_ops += 1
                else:
                    abandoned += 1
            ops_c = G.ops
            if not (G.mul(k, P0) == Q):
                certs = False
            G.ops = ops_c
            solved[t] = k
            per_target.append(walk_ops - w0)
        return {"walk_ops": walk_ops, "setup_ops": (G.ops - ops0) - walk_ops, "walks": walks,
                "abandoned": abandoned, "table_entries": len(table), "table_bytes": 32 * len(table),
                "per_target_walk_ops": per_target, "certs": certs}


    def run_rho(G, P0, ks, out):
        N = G.N
        dp_bits = int(math.floor(math.log2(math.sqrt(N / max(L_CELLS)) / 8)))
        cells = cells_of_targets()
        Q = {t: G.mul(k, P0) for t, k in ks.items()}
        G.ops = 0
        ref = []
        for t in cells[1] + cells[4]:
            for seed in range(RHO_SEEDS):
                r = rho_multi(G, P0, [(t, Q[t])], dp_bits, 1000 + seed)
                ref.append(r["walk_ops"])
                if not r["certs"]:
                    out.setdefault("rho_cert_failures", []).append(("ref", t, seed))
        W1 = sum(ref) / len(ref)
        per_L, certs_ok = {}, True
        for L in L_CELLS:
            tg = [(t, Q[t]) for t in cells[L]]
            runs = [rho_multi(G, P0, tg, dp_bits, seed) for seed in range(RHO_SEEDS)]
            certs_ok = certs_ok and all(r["certs"] for r in runs)
            totals = [r["walk_ops"] for r in runs]
            mean = sum(totals) / len(totals)
            per_L[L] = {"mean_total_walk_ops": mean, "totals": totals,
                        "mean_setup_ops": sum(r["setup_ops"] for r in runs) / len(runs),
                        "mean_table_entries": sum(r["table_entries"] for r in runs) / len(runs),
                        "mean_abandoned": sum(r["abandoned"] for r in runs) / len(runs),
                        "pooling_constant": mean / (math.sqrt(L) * W1),
                        "p90_over_mean": sorted(totals)[int(0.9 * len(totals)) - 1] / mean}
        xs = [math.log2(L) for L in L_CELLS]
        ys = [math.log2(per_L[L]["mean_total_walk_ops"] / L) for L in L_CELLS]
        exp_rho = slope(xs, ys)
        brng = seeded(EXP, CELL, "bootstrap", "rho")
        boots = []
        for _ in range(BOOT):
            ys_b = []
            for L in L_CELLS:
                tot = per_L[L]["totals"]
                res = [brng.choice(tot) for _ in tot]
                ys_b.append(math.log2(sum(res) / len(res) / L))
            boots.append(slope(xs, ys_b))
        boots.sort()
        out["rho"] = {"dp_bits": dp_bits, "W1_single_target_mean_walk_ops": W1, "reference_solves": len(ref),
                      "per_L": {str(L): per_L[L] for L in L_CELLS}, "exponent_rho": exp_rho,
                      "exponent_rho_boot95": [boots[int(0.025 * BOOT)], boots[int(0.975 * BOOT)]],
                      "certs_all": certs_ok}


    def main():
        N = least_prime_above(1 << 20)
        G = RelabelledZN(N, 0)
        out = {"experiment": EXP, "cell": CELL, "N": N, "perm_seed": 0}
        P0, ks = run_ic(G, out)
        run_rho(G, P0, ks, out)
        ic, rho = out["ic"], out["rho"]
        checks = {
            "exponent_ic_in_band": ic["exponent_ic"] is not None and -1.1 <= ic["exponent_ic"] <= -0.9,
            "exponent_rho_in_band": -0.6 <= rho["exponent_rho"] <= -0.4,
            "certificates": ic["cert_log"] and ic["cert_dl_all"] and rho["certs_all"],
            "pooling_in_band": all(0.5 <= rho["per_L"][str(L)]["pooling_constant"] <= 2.0 for L in L_CELLS),
        }
        out["G1"] = checks
        out["G1_pass"] = all(checks.values())
        path = sys.argv[1] if len(sys.argv) > 1 else "fixture.json"
        with open(path, "w") as fh:
            json.dump(out, fh, indent=1, default=str)
        print(json.dumps({"N": N, "exponent_ic": ic["exponent_ic"], "knee_cells": ic["knee_cells"],
                          "usable_fraction": ic["usable_fraction"], "exponent_rho": rho["exponent_rho"],
                          "pooling": {str(L): rho["per_L"][str(L)]["pooling_constant"] for L in L_CELLS},
                          "G1": checks, "G1_pass": out["G1_pass"]}, indent=1))
        sys.exit(0 if out["G1_pass"] else 1)


    if __name__ == "__main__":
        main()

