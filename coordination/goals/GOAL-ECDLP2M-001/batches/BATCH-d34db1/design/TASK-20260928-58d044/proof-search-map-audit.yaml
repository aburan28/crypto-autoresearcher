      log2 B in [29.036, 36.000] (the deliverable of stage0_code): the lower
      edge is set by the B that minimises T_shared, log2 B* = 29.036 + g/5
      while below the cap, giving log2 L_lo about 0.8 g for g up to about
      24 (4.8 at g = 6, 8.0 at g = 10, 10.4 at g = 13); the upper edge is
      set by the smallest per-target cost, at or slightly above the cap,
      log2 L_hi about 98.05 - 2g; the envelope closes near g about 31.5 (a
      base slightly above the cap, where attempts are 1.0 rather than 1.58,
      closes last; at log2 B = 34.5 the closing x is about 42.5). Whether the
      union is contiguous at each g is reported by the code. So the m = 4
      window is stated exactly as M4(B) with these two slices; it is not
      narrower than the m = 5 window, contrary to the proposal's expectation.
    step_10_memory_beside_time: >-
      S = B_cap words at 17 bytes (129-bit logarithm): log2 bytes = log2
      B_cap + 4.087463: 37.9837 (2.7e11, about 270 GB) at m = 4; 31.6688
      (3.4e9) at m = 5; 27.5028 (1.9e8) at m = 6; 22.3749 (5.4e6) at m = 8;
