      CAP SLICE, log2 B = 33.896241 (mu = 1): log2 a = x + 0.771517 -
      60.809036 = x - 60.037519; b = 2^(x + 33.896241 + 0.661724 -
      60.809036) + 2^(69.792482 - 60.809036) = 2^(x - 26.251071) + 506.19.
