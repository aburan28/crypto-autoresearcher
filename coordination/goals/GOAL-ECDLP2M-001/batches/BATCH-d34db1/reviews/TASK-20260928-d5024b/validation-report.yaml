        source: E03, E02
      - id: J2-C9
        what: every field approval requires, present or absent (attack iv)
        result: |
          Experiment fields (templates/research-records.md Experiment block;
          AGENTS.md core rule 3):
            - present: id, hypothesis_id, version 1, title, status
