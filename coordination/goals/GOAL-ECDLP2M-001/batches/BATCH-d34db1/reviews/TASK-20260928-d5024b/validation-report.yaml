  # ---------------------------------------------------------------------------
  independent_recomputation:
    recomputed_myself: |
      Every headline number of J1 was recomputed with code written in this
      session, using mpmath 1.3.0 at 50 to 60 digits, sympy 1.14.0 and the
      Python 3.11.15 standard library:
        - rho in both forms, and N_prime;
        - B_cap, T_gen and P_gen;
        - the identity, and the LA margins;
        - P_IC at C = T_gen with constants;
        - the D3 column at m = 4, 5, 6, 8, 16, and the relaxations against both
          columns;
        - the m = 5 windows in both conventions and at both rounded comparator
          values, and both critical g;
        - the m = 4 sub-cap and cap slices, and the m = 4 envelope on three
          grids;
        - the m = 5 envelope;
        - the 1.58 factor and the m = 5, 6, 8, 16 residuals, and two candidate
          reconstructions;
        - the memory figures, and D1 as context.
      For J2 I recomputed:
        - the exact range of exponent_ic under the knee rule for all 26 knee
          sets;
        - the touched-column and determined-column usable probabilities under
          H1's random model (asymptotic, plus Monte Carlo of the abstract
          relation graph at B = 128 and 512);
        - the attempts-to-usable figures, and the tail-check arithmetic;
        - #E(F_2^131) = 4r and #E(F_2^19) = 4 x 130873 by the Lucas
          recurrence, plus primality and the Hasse check;
        - the least prime above 2^20, and dp_bits.
      All sha256 digests were recomputed.
    reverified_with_disjoint_checker: |
      My code shares no code with stage0_code or fixture_code: neither was
      imported for computation, and stage0_code was never executed. Disjoint
      routes used:
        - hashes: sha256sum and Python hashlib;
        - the identity: sympy symbolic and mpmath numeric;
        - D3(4): my calculus route (B^2 = 3 rho / 20) and a numeric argmax
          (mp.findroot), against the contract's closed form;
        - critical C: the exact quadratic 4ab = 1 in C, and the closed form
          that drops LA, against stage0_code's bisection method (read, not
          run);
        - the envelope: the maximum over grid points of the exact per-B
          critical C, against stage0_code's bisection over g (read, not run);
        - r and #E: the Lucas recurrence, which is independent of the cited
          value, with sympy.isprime and an own Miller-Rabin.
    taken_on_producer_word: |
      These are taken as stated, not checked:
        - The ordinary n = 19 order 2 x 261823. It was checked only for
          primality and the Hasse bound; recomputing it would instantiate the
          curve.
        - The producer's retrieval record (quoted tool errors) and its
          statement that it held no shell. Neither can be checked from here.
        - The corpus texts behind H2 and C5 (J3's).
      The H1 figures in breaking artifact (b) are model values under the
      contract's own random model, not observations. The fixture's base
      assertion outcome for the committed seed was not evaluated.

