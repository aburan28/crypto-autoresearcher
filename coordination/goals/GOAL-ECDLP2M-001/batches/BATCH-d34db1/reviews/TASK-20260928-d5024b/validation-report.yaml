          No approval field is absent. tools/validate_ledger.py at HEAD
          d7194a40: 0 of its 100 output lines name either record (E08).
        source: E02, E08
    deviations:
      - id: J2-D1
        field: specification stages.stage_1 (G1) against audit fixture_pass_criterion and fixture_code main() checks (lines 361, 405)
        severity: moderate
        finding: |
          The specification's G1 requires "every CERT-DL, CERT-REL and CERT-LOG
          verified". The audit's criterion and the coded test check CERT-LOG
          and CERT-DL only; CERT-REL does not occur in fixture_code. The 150
          reference-solve CERT-DL results are collected in rho_cert_failures
          but excluded from the pass test. The code that decides G1 (S1 and
          IR-6 make it operative) is therefore weaker than the rule text by two
          conjuncts. CERT-LOG on every determined column would catch most
          wrong relations indirectly.
      - id: J2-D2
        field: specification instruments I1, I2 and stages.stage_1; controls CTL-1; invalidation_rules IR-3
        severity: moderate
        finding: |
          The gate runs the fixture's own FullVectorElim and rho_multi, not I1
          (the linalg.py extension) and I2 (the rho.py extension) that Stage 2
          runs on the curve cells. The only link from G1 to those instruments
          is the Stage 2 CTRL-ZN arm with IR-3, and IR-3's IC arm cannot fire
          (breaking artifact (a)). Before any curve reading, I1 is therefore
          gated only by certificates and by termination.
          I2 also leaves open whether a walk stops or continues at a new
          distinguished point. The fixture continues, capped at 20 x 2^dp_bits
          steps. That choice changes W_1, and with it the level of c(L),
          between two conforming implementations.
      - id: J2-D3
        field: specification invalidation_rules IR-6; inputs.committed_code.binding
        severity: low
        finding: |
          No reference digest or extraction method is pinned for the extracted
          fixture_code and stage0_code, so IR-6 has nothing fixed to compare
