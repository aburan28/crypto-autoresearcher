          stage0 4538f724da7fa147b68f5206af0772d5ffce04cd76034e8aa61de5b4df5db737.
      - id: J2-D4
        field: specification replication.seeds against fixture_code seeded(...) labels (E02)
        severity: low
        finding: |
          The seed labels in the fixture differ from the specification:
            - permutation: fixture "...|perm|0"; specification "...|setup|0";
            - relations: fixture one stream "...|relations"; specification
              "...|relation|<j>";
            - re-randomisation: fixture one stream per target
              "...|attempt|<t>"; specification "...|attempt|<t>|<attempt>";
            - the fixture adds reference rho solves on seeds 1000 to 1029, and
              bootstrap streams, which the specification does not name;
            - the specification calls the generator "PCG-style"; the code
              uses random.Random (Mersenne Twister) seeded through SHA-256.
          Under IR-6 the code is the operative definition for Stage 1. The
          Stage 2 driver has to follow one of the two, and the contract does
          not say which.
      - id: J2-D5
        field: fixture_code run_ic line 180
        severity: low
        finding: |
          assert len(signed) == 2 * BASE_SIZE fails if the fixed base contains
          a pair F and -F. The first-order chance for a given seed is 0.0078
          (E06). For the committed seed the outcome is fixed but was not
          evaluated here, because evaluating it would execute fixture code. A
          failure would be failed_infrastructure (IR-8), and no rule names a
          reseed. Separately, S2 says Stage 1 "stops at the first failed
          certificate", but the fixture runs to completion and then exits
          non-zero; S2 also does not name the pooling arm (IR-3 does).
      - id: J2-D6
        field: H-BINSTD-6e4713 statement (B) and (C); audit stage0_recomputation steps 4 to 9; specification memory_beside_time LA_memory_bytes
        severity: low
        finding: |
          In the hypothesis statement and the audit steps, time figures stand
          without byte figures in the same sentence. The byte figures are in
          the specification table and in step_10, so this is presentational.
          More substantively, the LA memory figure charges only the sparse
          matrix (m B_cap entries at 8 bytes). It does not charge the working
          vectors of the Wiedemann-type solve that assumption A3 names. Each
          such vector is B_cap residues mod r at 17 bytes, i.e. S bytes, and
          two of them come to 2^38.98, 2^32.67, 2^28.50, 2^23.37 and 2^16.04
          bytes at m = 4, 5, 6, 8, 16 (E03). This is an uncharged memory term.
      - id: J2-D7
        field: specification replication.independent_instances; H-BINSTD-6e4713 asymptotic_claim.claim_kind; heuristic_under_test
        severity: negligible
        finding: |
          Format only: independent_instances is a string (the template
          expects an integer); claim_kind is outside the template enumeration
          (disclosed); heuristic_under_test names the local labels H1 and H2.
      - id: J2-D8
        field: audit fixture_pass_criterion.design_expectations_not_criteria
        severity: negligible
        finding: |
          Shared lookups recompute as 2^20.02 (audit about 2^20.3). Per-target
          lookups recompute as 2^13.44 with touched columns and 2^13.68 with
          determined columns (audit about 2^13.4) (E05). These are not
          criteria.
    artifacts_and_commits_read: |
      At commit 50aa72c625af53c6674a2aa1f150ca30af11002b, read in full: the
