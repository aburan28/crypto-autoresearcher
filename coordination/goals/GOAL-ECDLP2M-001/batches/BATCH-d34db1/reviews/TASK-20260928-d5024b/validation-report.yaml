  # ---------------------------------------------------------------------------
  J2:
    joint: J2, fixture as code, protocol completeness and custody (C4, C5 for the numbered heuristics, C6, C8)
    verdict: breaks
    breaking_artifact: |
      The H1 validation arm cannot reach a pre-registered falsifying outcome,
      and its comparison is not like with like. The arm comprises the Stage 2
      success and negative outcomes, H1's falsification condition, and the IC
      arm of the Stage 1 gate G1 and of IR-3.
      (a) Exact arithmetic on definitions.fits (E05). On knee cells,
          per_target_cost(L) = (S + sum over the L targets)/L, with that sum at
          most S/4. So log2 cost(L) = log2 S - log2 L + d_L, with d_L in
          [0, log2 1.25]. The least-squares slope over the designed knee cells
          {1, 4, 16} is therefore confined to [-1.0805, -0.9195] for every
          possible per-target cost. The same confinement inside [-1.1, -0.9]
          holds for every knee set with three or more cells, or with cells four
          or more apart in log2 L (all 26 sets enumerated in E05).
          Consequences:
            - The IC-exponent arms of G1 ([-1.1, -0.9]), of IR-3 on CTRL-ZN and
              of success criterion (iii) ([-1.1, -0.85]) cannot fail.
            - The NEGATIVE outcome requires exponent_ic shallower than -0.85 on
              both binary cells, so it is unreachable. Only a knee set of
              exactly two adjacent cells admits a value in (-0.85, -0.839], at
              the very edge of the knee rule.
            - The falsification_criterion routes the proposal's expectation
              through that NEGATIVE outcome, so this contract cannot falsify
              the expectation.
      (b) Model computation under the contract's own H1 random model (E05). This
          is a model value, not an observation.
            - Definitions: usable_fraction counts DETERMINED columns
              (definitions.usable_and_retries). The prediction
              (1 - e^-m)^m = 0.748 (H1 formal_statement; preregistered_prediction
              (2)) is the TOUCHED-column probability.
            - Assumption A3 (the LA returns the full log vector of the touched
              columns) fails at m = 2, R = B by rank deficiency. The
              hypothesis names that rank deficiency itself, as a diagnostic.
            - At m = 2, R = B the determined-column usable probability is
              0.635 asymptotically (the giant component of the relation graph).
              A Monte Carlo of the abstract relation graph gives 0.639 at
              B = 128 (5th to 95th percentile 0.539 to 0.725; 24 percent of
              graphs reach 0.6732) and 0.636 at B = 512 (8 percent reach it).
            - Success criterion (iv) requires CTRL-ZN within 10 percent of
              0.748, i.e. at least 0.6732. H1's own falsification condition
              requires the same of the control as its precondition. Both are
              therefore expected to fail on most relation graphs, for a
              definitional reason, not because of any property of a base.
      (c) The retries metric is defined in attempts (definitions; metrics unit
          "attempts"). The prediction 1/0.748 = 1.34 and the tail check
          (expected maximum 4.2, anomaly above 12) count decompositions. On
          CTRL-ZN, with mu = 2^15/N = 0.03125, attempts until a usable
          decomposition are about 51 (43.5 with touched columns). The tail
          check therefore reports an anomaly on the control by construction.
      Together: the most likely execution of the frozen contract meets neither
      the positive outcome (criterion (iv) fails) nor the negative outcome
      (unreachable), and fires no invalidation rule. The outcome table makes no
      provision for that case. At this tier a validation plan that cannot be
      falsified does not pass. Every J2 breaking artifact pre-listed in the plan
      reads clean (see computed). This break is on the joint's own terms
      ("H1 and H2 carry ... validation plans with sample, comparison and tail")
      and on the tier rule.
    nature_of_the_break: |
      VA-6: a protocol-design defect, meaning a pre-registration and
      decision-table defect in the frozen contract. It is not a mathematical
      result about any curve, oracle or algorithm, and not evidence about H1 or
      H2, neither of which has been measured. Part (a) is exact; parts (b) and
      (c) are arithmetic under the contract's own random model and definitions.
    what_would_clear_it: |
      For the Coordinator; this is not a repair.
        (a) A falsifying criterion the knee rule cannot pin, for example on
            the knee-cell count, on the flattening ratio beyond the knee, or on
            a fit over all L.
        (b) Either a prediction for the determined-column usable probability
            at the run's R/B, or a touched-column measurement compared with
            the touched-column prediction.
        (c) Retries counted in decompositions, or a prediction stated in
            attempts.
    computed:
      - id: J2-C1
        what: VA-1 hashes and custody
        result: |
          The three files match the receipt at the snapshot commit, at HEAD
          and in the working tree (object_under_review; E01).
          The snapshot commit 50aa72c6 changed exactly the four declared
          paths. Its parent is the receipt's parent_sha 3932b650. The history
          of each of the three paths is that one commit, and no later commit
          touches them.
          experiments/EXP-BINSTD-532d7f/ holds only specification.yaml (no
          runs directory). The working tree has no tracked change.
          50aa72c6 is an ancestor of HEAD d7194a40. Before the interruption it
          was also found on origin/claude/index-calculus-ecdlp-ecc2k-rm3mrv.
          Holds.
        source: E01
      - id: J2-C2
        what: fixture code extracted and read statically, syntax check and dry import (attack i)
        result: |
          Extraction: fixture_code taken verbatim by yaml.safe_load of the
          committed blob. 14771 characters, 421 lines; sha256 of the UTF-8 text
          200aa0efa67688d6d2d597e952e626d29dc572647a32d44db715060323160469.
          ast.parse and compile succeed.
          Runnable in principle:
            - imports are standard library only (hashlib, json, math, random,
              sys);
            - there is a __main__ guard, with entry point main();
            - the output path is argv[1], else fixture.json;
            - seeding uses SHA-256 of label strings into random.Random;
            - N is the least prime above 2^20, which is 1048583 (E06), and
              dp_bits = 3;
            - there are two least-squares fits (over the knee cells, and over
              all five L), each with 1000 bootstrap resamples;
            - the certificates are CERT-LOG on every determined column and
              CERT-DL on every target in both arms;
            - the process exits 0 iff the G1 dict passes.
          Dry import, i.e. exec under a module name other than __main__: only
          the seven constants and the definitions executed, and nothing was
          printed.
          Static reading of the components:
            - FullVectorElim: back-substitution in reverse creation order is
              correct, because pivot rows hold only columns unpivoted at their
              creation.
            - rho_multi: correct collision algebra for same-target and
              solved-target hits.
          Nothing was run. stage0_code (sha256 of extracted text
          4538f724da7fa147b68f5206af0772d5ffce04cd76034e8aa61de5b4df5db737)
          passes ast.parse and compile. It was not imported, because it has no
          __main__ guard and import would execute Stage 0. Holds (runnable in
          principle); see J2-D1 to J2-D5.
        source: E02, E06
      - id: J2-C3
        what: the pass criterion located in the rules (attack i, ii)
        result: |
          G1 is stated before execution in specification stages.stage_1, and
          again in the audit's fixture_pass_criterion and the fixture
          docstring. Stopping rule S1 bars Stage 2 and every curve cell until
          G1 passes. S2 ends a failing Stage 1 as failed_infrastructure.
          IR-1 invalidates any curve-cell figure produced before G1, and IR-6
          any deviation from the committed code. Procedure step 3 applies G1.
          Located in the rules; no curve cell is readable before the gate.
          Holds, with the rule-versus-code differences at J2-D1.
        source: E02
      - id: J2-C4
        what: full-log-vector solve and shared-table rho specified precisely enough to implement
        result: |
          I1 extends linalg.py. EliminationState.add_row with kcoef = 0 never
          returns k, and under both pivot rules each pivot row holds only
          columns unpivoted at its creation. So I1's solve_all, run in reverse
          creation order, resolves exactly the determined set; it stops at no
          pinning row. I1 is implementable as written (linalg.py read in full).
          I2 is specified with its collision algebra, abandonment rules,
          walk cap and CERT-DL. It does not say whether a walk stops or
          continues at a new distinguished point (J2-D2). Holds.
        source: static read of src/crypto_autoresearcher/index_calculus/linalg.py and specification instruments
      - id: J2-C5
        what: Stage 2 cells defined with orders recomputed at setup (attack iii)
        result: |
          Both BIN-ORD-19 and BIN-KOB-19 are defined with the order recomputed
          two ways, primality proved (deterministic Miller-Rabin below
          3.3e24), and the cell halted on disagreement (AR-ORDER, IR-4). The
          orders are pointers, not citations.
          Pointer arithmetic, done here with integers only (E06):
            - Koblitz: the Lucas recurrence gives #E(F_2^19) = 523492 = 4 x
              130873 exactly, and 130873 is prime.
            - Ordinary: 2 x 261823 implies trace 643, inside the Hasse bound
              1448.15, and 261823 is prime. The order itself is not recomputed,
              because that would instantiate the curve.
          Holds.
        source: E06, E02
      - id: J2-C6
        what: certificates and seeds
        result: |
          Certificates: CERT-DL, CERT-REL and CERT-LOG on every reported
          logarithm and relation (CTL-3, IR-2), re-verified by a separate
          verifier process with no shared import (I5). Holds.
          Seeds: every stream is enumerated by a label string, and rho seeds
          0..29 per L. Holds, with the string differences at J2-D4.
        source: E02
      - id: J2-C7
        what: H1 and H2 validation plans (attack v)
        result: |
          H1 and H2 are numbered, and each carries a formal statement, a
          random-model justification, supporting results with provenance,
          validation_experiment_ids and a falsification condition. Each
          validation plan names the sample, the predicted distribution, the
          comparison, the tail check and the transfer assumption, and each
          transfer is stated as a heuristic (H1: only the mean transfers; H2:
          the law's form only).
          H2 (i): the pooling constant and the rho exponent compare like with
          like, as defined. H2 (ii) has no experimental validation by design:
          it enters only Stage 0 arithmetic and is falsified by a source read
          under SR-CGK or by a published algorithm. Its supporting result is a
          corpus entry, which is J3's C5 matter.
          H1 fails on the comparison: see the breaking artifact.
        source: E02, E05
      - id: J2-C8
        what: memory beside every time figure (attack vi)
        result: |
          The specification's memory_beside_time table puts S bytes, LA time
          and LA memory beside T_gen, P_gen and D3 for every m, with values
          recomputed at J1-C13. window_memory states the memory held at m = 5,
