  J1:
    joint: J1, Stage 0 recomputation and the pinned comparator (C1, C2, the 4b65e3 section)
    verdict: breaks
    breaking_artifact: |
      The m = 4 window over free B (the envelope). The contract itself calls
      the envelope the m = 4 window, since "the base size B ... is free". It is
      defined twice with different B ranges, and its committed design figures
      miss the plan's tolerance under either definition:
        - specification stages.stage_0.what: "the envelope over log2 B on a
          0.01-bit grid from 29.036 to 33.896";
        - the audit sheet's stage0_code, which Stage 0 runs unchanged (IR-6):
          grid = 29.036 + 0.01 i up to 35.996. Audit step_9_m4_window names
          the same range, "[29.036, 36.000] (the deliverable of stage0_code)".
      Recomputed with my own code (E04), with the LA term and the attempt
      constants kept:
        - Code grid: the envelope upper edge in log2 L is 99.38, 87.38, 79.38,
          73.38, 71.38, 59.38 at g = 0, 6, 10, 13, 14, 20 (39.27 at g = 30),
          i.e. 99.38 - 2g. The audit design figure is "about 98.05 - 2g", a
          1.33-bit miss. That exceeds the plan's 1-bit window-bound tolerance
          and Stage 0's own acceptance tolerance, so stopping rule S5 would halt
          an approved run at Stage 0.
        - Spec grid: the envelope closes at g = 31.128 (the cap slice). The
          audit design figure is "about 31.5", a 0.37 miss against the plan's
          0.2 critical-g tolerance.
      The audit's figures take the upper edge from the cap (spec-grid
      behaviour) and the closing g from bases above the cap (code-grid
      behaviour). No single definition reproduces both. The upper edge moves
      because the per-target cost A(mu) retry_4 C falls monotonically toward
      retry_4 C as B grows past the cap (A(1) = 1.582, A tends to 1), which
      recovers up to 2 log2 A(1) = 1.32 bits. Step_9 instead places the
      minimum "at or slightly above the cap". This matches two of the plan's
      J1 breaking artifacts: "an m = 4 window not stated exactly" and "a window
      bound off by more than 1 bit or a critical g off by more than 0.2".
    nature_of_the_break: |
      VA-6: a specification defect in the contract's statement of a
      zero-compute model quantity. There are two committed definitions of one
      grid, and a hand design figure follows from neither. It is not a
      mathematical result about any curve, oracle or algorithm. It does not
      touch the T_gen and P_gen column, the identity, the LA comparison, the
      m = 5 window or the two named m = 4 slices, all of which hold below.
