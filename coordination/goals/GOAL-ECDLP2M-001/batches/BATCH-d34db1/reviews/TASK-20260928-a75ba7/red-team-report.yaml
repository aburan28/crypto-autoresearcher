    upper_end_law:
      check_result: holds_with_objections
      rebuild: |
        The model inequality is IC(L) = T_shared + L kappa_m C below
        G(L) = c rho_1 sqrt(L), with c = 1 in the contract. At small 4ab the
        upper root is L_hi about (c rho_1 / (kappa_m C))^2. So the upper end is
        set by the flat per-target index-calculus cost against the generic
        multi-target law, and moves by 2 log2 c with that law's constant. The
        lower end is set by the shared cost against the same law.
      where_the_upper_ends_sit: |
        Design figures quoted from H statement (B), not recomputed (RA-6):
        - m = 5, D3 convention: log2 L_hi = 54.04, 42.04, 34.01, 29.30 at
          g = 0, 6, 10, 12.
        - m = 5, proposal convention: 55.37, 43.37, 35.35, 31.14.
        - m = 4, sub-cap slice: 60.50, 48.50, 40.50, 34.43, 32.22 at
          g = 0, 6, 10, 13, 14.
        - m = 4, cap slice: 98.05, 80.08, 60.07 at log2 C = 11.01, 20, 30.
        Against the reference points log2 N_prime^(1/4) = 30.24 and
        log2 N_prime^(1/3) = 40.32: every upper end except one (m = 5 D3
        g = 12, 29.30) lies above N_prime^(1/4), and ten lie above
        N_prime^(1/3).
      which_law_carries_it: |
        The generic multi-target law of H2 (i), G(L) = c rho_1 sqrt(L), taken
        with c = 1 far outside Kuhn-Struik's range. The contract says the
        upper end above 2^30 rests on the Bernstein-Lange table law (H
        heuristic_assumptions[1].random_model_justification). At source:
        - Kuhn-Struik (retrieved, SAC 2001). Theorem 1 gives
          E_L about sqrt(pi N/2) sum_(t<L) C(2t,t)/4^t "for L [<<] 4th-root N",
          which approximates to sqrt(2 L N) = (2/sqrt(pi)) sqrt(L) sqrt(pi N/2).
          That is c = 1.128, with a range condition L << N^(1/4). The relation
          glyph was lost in text extraction; the direction is fixed by the
          proof step "phi_j(L)/(sqrt N)^j about 0 if L [<<] 4th-root N".
        - Bernstein-Lange (retrieved, ePrint 2012/458) restate the same range
          ("but only for L [<<] l^(1/4)"). Their own measurements are at a
          group order of about 2^48 with table size T at most l^(1/3)
          (T = 2^16). Used as an L-target method, their table wants T about
          1.43 L. At the upper ends that is T about 2^54 to 2^98 at
          l = 2^121, i.e. 2^14 to 2^58 beyond l^(1/3), where no Bernstein-Lange
          constant was measured. Their abstract point gives an L-target
          constant 2 sqrt(alpha beta)/sqrt(pi/2) = 2.36; the best Table 4.1
          point gives 2.15.
        - Support for the sqrt(L) FORM at L far above N_prime^(1/4) comes from
          two sources. As a lower bound: Yun's generic bound T^2 = Omega(M N)
          for M = o(N), as relayed in CGK's text (Yun's abstract retrieved,
          full text not read). As an achievable construction: CGK section 7.1
          (the Mihalcik / Bernstein-Lange table, S entries in O(S log N) bits,
          S T^2 about N). Applied to L targets with unit constants, the
          section 7.1 construction totals sqrt(2 L N) (this task's
          arithmetic), the same form as Kuhn-Struik. The contract cites
          neither support.
      kuhn_struik_marking: |
        HOLDS. The recalled range is marked in H
        heuristic_assumptions[1].supporting_results[2] (provenance recalled,
        verified_by null, "RECALLED AND MARKED ... not load-bearing"). This
        task confirms it at source (Kuhn-Struik Theorem 1), and it is
        corroborated by Bernstein-Lange's retrieved text. The upper end does
        not rest on an unmarked recalled range.
      objections:
        - |
          "Rests on the Bernstein-Lange table law" is true of the exponent
          only. Bernstein-Lange's measured regime (T at most l^(1/3)) does
          not reach the T about L that the upper ends require.
        - |
          The constant c = 1 is neither Kuhn-Struik's (1.128) nor any
          Bernstein-Lange L-target constant (2.15 to 2.36). Relative to c = 1,
          log2 L_hi moves by +0.35 bit with Kuhn-Struik. It moves by +2.20 to
          +2.48 bits with the Bernstein-Lange constants, and by up to +3.14
          bits at m = 5, g = 12 (computations.json
          upper_end_law.shift_of_window_bounds_vs_c=1). Those shifts exceed
          the contract's 1-bit window tolerance. All of them widen the
          window, so the stated windows are the narrowest reading: the
          direction is conservative.
        - |
          H assumptions[3] (A4) "multi-target rho is that constant times
          sqrt(L) under H2" misstates Kuhn-Struik's own constant, which is
          2/sqrt(pi) = 1.128 times the single-target constant, not 1. This is
          consistent with the fixture's own design expectation "c(L) about
          1.0 to 1.13".
        - |
          The comparator's memory is uncharged at the upper end. For pooled
          rho to reach per-target cost rho_1/sqrt(L), the walk length 1/theta
          must be well under rho_1/sqrt(L). Under the contract's own
          overshoot rule (at most one eighth of the per-target walk), the
          distinguished-point table is at least about 8 L entries: 2^57.0
          entries at L = 2^54.04 and 2^63.5 at L = 2^60.50. So theta is not
          free. E memory_beside_time.window_memory's example (theta = 2^-20 at
          L = 2^30, about 2^56 entries) overstates the comparator's minimal
          memory at that L (about 2^33 entries by the 8 L rule) by about
          2^22.8. The windows are time-only comparisons at unequal memory, and
          the memory figure offered beside them favours the index-calculus
          side.

    cgk_comparison:
      check_result: holds_with_deltas
      source_reached:
        document: Corrigan-Gibbs and Kogan, The Discrete-Logarithm Problem with Preprocessing, IACR ePrint 2017/1113
        version: |
          PDF dated "August 3, 2021" on its title page. The ePrint page shows
          latest revision 2021-08-03, originally received 2017-11-20, "Major
          revision of an IACR publication in EUROCRYPT 2018". Fetched
          2026-09-29 from https://eprint.iacr.org/2017/1113.pdf. The file's
          sha256 is recorded in computations.json retrieval.
        provenance: retrieved
        verified_by: TASK-20260928-a75ba7 (this report)
        extraction_caveat: |
          Text was extracted from the PDF by this task's own standard-library
          extractor. Some mathematical glyphs (epsilon, Omega, the tilde,
          <<) were lost; where a quoted formula depends on a lost glyph, the
          reconstruction is marked in brackets.
      source_statements_verbatim:
        - |
          Abstract: "We show that any generic discrete-log algorithm with
          preprocessing that uses an S-bit advice string, runs in online time
          T, and succeeds with probability [epsilon], in a group of prime order
          N, must satisfy ST^2 = [Omega-tilde]([epsilon] N). Our lower bound,
          which is tight up to logarithmic factors, ..."
        - |
          Theorem 2: "Let N be a prime. Let (A0, A1) be a pair of generic
          algorithms for Z_N on L, such that A0 outputs an S-bit state, A1
          makes at most T oracle queries, ... Then ST^2 = [Omega-tilde]
          ([epsilon] N)." Section 1.1: "where the [Omega-tilde] notation hides
          logarithmic factors in N".
        - |
          Remark: "Theorem 2 treats only prime-order groups. In the more
          general case of composite-order groups a similar result holds,
          except that the bound is ST^2 = [Omega-tilde]([epsilon] p), where p
          is the largest prime factor of the group order."
        - |
          Section 1.1, Theorem 10: "any such algorithm that uses preprocessing
          time P, online time T, and achieves success probability [epsilon]
          must satisfy: PT + T^2 = [Omega]([epsilon] N)."
        - |
          Section 7.1: "At the end of the preprocessing phase, the algorithm
          stores this table of S group elements along with their discrete
          logs, using O(S log N) bits."
        - |
          Section 2: "Since providing an inversion oracle can decrease a
          generic algorithm's running time by at most a logarithmic factor, we
          omit it for simplicity."
      deltas_against_the_contract:
        - |
          (a) Form. H heuristic_assumptions[1].supporting_results[0] and
          structural_ingredients[3] state Theorem 2 correctly in form. The
          provenance label (internal, CORPUS ENTRY ONLY) is correct and
          IMP-CGK is correctly recorded. Plan key K-impediment applies, not
          K-revise-defect: no corpus entry is presented as a source read.
        - |
          (b) Unit of S. Theorem 2 counts advice in bits. The contract's
          column counts S = B_cap words of 129 bits with no conversion. In
          bits, T_gen is lower by 0.5 log2 129 = 3.51 bits. That is inside
          the Omega-tilde slack but seven times the contract's 0.5-bit
          tolerance.
        - |
          (c) Group size. Theorem 2's N is the prime group order: r here, and
          the composite-order remark gives the largest prime factor, r. The
          contract uses N_prime = r/262 (negation and the 131 Frobenius
          classes). CGK treat negation as a log-factor effect; Frobenius is
          not a generic operation at all. At N = r, T_gen is higher by
          0.5 log2 262 = 4.02 bits. With (b) together the literal Theorem 2
          convention shifts T_gen by +0.51 bit. The contract's N_prime is the
          tougher bar for index calculus and matches C1's rho convention, so
          the choice is conservative. But "generic and tight by KN-LIT-013 as
          reported" (H asymptotic_claim.prior_best) at N_prime goes beyond
          what the source states.
        - |
          (d) Precomputation axis. As a lower-bound frontier, P_gen =
          sqrt(N_prime S) is CGK Theorem 10 (PT + T^2 = Omega(epsilon N); at
          T = T_gen it forces P of order N/T_gen = P_gen, up to the same
          factors). H statement (C) attributes the P_gen axis to KN-LIT-013
          "as reported", but the corpus entry says nothing about
          preprocessing time. The source does state it, so this is a delta,
          not a break.
        - |
          (e) Precision. "ON the frontier within 0.5 bit" and "Every constant
          is disclosed" hold relative to Bernstein-Lange's measured points in
          the words and N_prime convention (PTM-A dominance check). Relative
          to KN-LIT-013 the frontier is located only up to log factors. The
          two convention choices alone move T_gen by -3.51 and +4.02 bits.
        - |
          (f) The source does not state "a bound of a different form" (H
          falsification_conditions[4]; E falsification_criterion), so the
          frontier column is not withdrawn on this read. The contract's
          SR-CGK and SR-NOSUB rules are unaffected; this read changes nothing
          in the contract by itself.

    collision:
      check_result: breaks
      contract_claim_attacked: |
        A audit_2_observation_collision.collision_found: "YES, constructed on
        paper, and the reporting rules separate it." The claimed separators
        are the usable fraction and retries against H1, the Z/NZ control
        (CTL-1), and CTL-6.
      constructed_objects:
        O1_genuine: |
          As designed. CTRL-ZN: B = 128, R = B, m = 2, mu about 1/32 (A
          fixture_pass_criterion design expectations). Binary cells: about
          512 column classes, R = B, mu_cell about 1 (AR-MU).
        O2_over_complete: |
          The audit's own object: R = 4B relations, on CTRL-ZN or on a
          binary cell. Every fresh target's first decomposition is usable,
          retries are about 1, and the shared cost is setup-dominated.
        O3_no_reuse_null: |
          A null object of the same accounting shape: a fixed shared cost
          S0 (setup) plus an independent per-target solve of cost p, with no
          stored log vector reused. For example S0 = 2^20.3 with p = 2^10, or
          S0 = 2^30 with p = 2^20.
        O4_coverage_limited: |
          O1 with the per-target cost multiplied by 4, 8 or 16 (inflated
          retries), the situation the NEGATIVE outcome is meant to catch.
      reading_1_exponent: |
        E definitions.fits fits exponent_ic over the knee cells, where
        L times mean_pt is at most shared/4. Then
        log2 per_target_cost(L) = log2 shared - log2 L + e_L with e_L in
        [0, log2 1.25]. The fitted slope is therefore confined to
        -1 +/- (log2 1.25) sum|w|/(2 Sxx) for ANY cost data:
        - [-1.161, -0.839] for knee cells {1, 4};
        - [-1.080, -0.920] for {1, 4, 16};
        - [-1.064, -0.936] for {1, 4, 16, 64};
        - [-1.048, -0.952] for all five cells.
        This task's arithmetic on each object (no randomness):
        - O1 at the design expectation: -0.958 (knee cells 1, 4, 16).
        - O2: -0.978 (knee cells 1, 4, 16, 64).
        - O3: -0.970 and -0.964 (all five cells).
        - O4: x4 gives -0.933 (knee cells 1, 4); x8 and x16 leave one knee
          cell and an undefined exponent.
        So the exponent does not separate O1, O2 or O3. A no-reuse null
        passes G1's exponent band [-1.1, -0.9] and success clause (iii)
        [-1.1, -0.85].
        Coverage limitation (O4) shows up as knee collapse, never as an
        exponent shallower than -0.85. The NEGATIVE outcome (E
        success_criterion; H falsification_conditions[3]; the negative next
        decision of DEC-20260928-63addc S1) can be reached only in a corner
        0.011 wide of the two-cell case, which the L grid and not coverage
        decides.
      reading_2_usable_fraction: |
        E definitions.usable_and_retries (and the fixture's first_usable,
        which tests membership in the solved log dictionary) counts a leg as
        usable only if its column has a DETERMINED logarithm. H1's prediction,
        0.748 = (1 - e^-2)^2, counts TOUCHED columns.
        At m = 2 the relation set is a signed random multigraph with R = B
        edges on B columns. A column is determined if and only if its
        component contains an unbalanced cycle (edge sign -s t, cycle
        product -1) or a coefficient-2 loop. Every tree component is touched
        but carries one free variable, whatever the solver.
        - Asymptotically, the determined fraction equals the giant-component
          fraction: 0.797, against a touched fraction of 0.865. The usable
          fraction is then 0.635 against H1's 0.748, 15 percent low.
        - Monte Carlo on the abstract graph (not a contract cell; seeds in
          computations.json). At B = 128 the mean is 0.638 (5 to 95 percent:
          0.539 to 0.725), and the probability of landing in H1's 10-percent
          band [0.673, 0.823] is 0.235. At B = 512 the mean is 0.636 and that
          probability is 0.082.
        - O2 reads 0.9993, always above the band.
        - H1's 0.748 is the determined value at R about 1.157 B, not at
          R = B.
      reading_3_retries: |
        Under the determined model the expected retries differ by cell.
        - CTRL-ZN (mu about 1/32, one decomposition per successful attempt):
          1.566.
        - Binary cells (mu about 1; oracle A returns every decomposition and
          any usable one is accepted): 1.345.
        H1 predicts 1.338 on every cell. The control misses the band by
        +17 percent, while the binary cells match it by coincidence.
      reading_4_success_criterion: |
        - O1 genuine. Clause (iv) part 1 passes, since binary cells about
          equal the control. Part 2, the control within 10 percent of 0.748,
          fails on about 76 percent of base draws at B = 128, so O1 is not
          POSITIVE. NEGATIVE needs the unreachable exponent. No invalidation
          rule (IR-1 to IR-8) covers a usable fraction or retries outside
          band, so O1 is not ARTIFACT either. The genuine object lands in no
          declared outcome.
        - O2 on CTRL-ZN: the control is above the band, so not POSITIVE. The
          result is correct in effect but for a mis-specified reason.
        - O2 on a binary cell with a genuine control: binary 1.0 is at least
          0.8 of the control, so clause (iv) part 1 passes; the test is
          one-sided. POSITIVE then turns only on the control's own band. In
          the roughly 24 percent of control draws that land in band, or
          after the prediction is corrected, an over-complete binary cell
          reads POSITIVE.
        - CTL-6 ("a per-target exponent near -1 with usable fraction near 1
          and retries near 1 while shared_ops is setup-dominated is the
          artefact preimage (ii) and reads nothing") describes a control's
          role only. It appears in no invalidation rule and no clause of
          success_criterion.
      reading_5_zn_control: |
        The relabelled Z/NZ control reproduces the usable fraction, which
        does not depend on mu. It does not reproduce the retries: its mu is
        about 1/32, against about 1 on the binary cells. It cannot separate
        O1 from O2 or O3 through the exponent, which is fixed by the knee
        rule, and it fails H1's band together with O1. On the quantities the
        rules actually read, the control separates nothing.
      conclusion: |
        BREAKS: the reporting rules misread the collision. They cannot place
        the genuine preimage in any declared outcome. They cannot tell it
        from a no-reuse null by the exponent. And an over-complete binary
        cell reads POSITIVE as soon as the control's band is met.
      remedy_zero_compute: |
        (1) Predict the determined-column usable fraction (the
        giant-component law at m = 2), or choose R so that the touched value
        is the prediction.
        (2) State the retry law per mu regime, with multi-decomposition
        acceptance.
        (3) Replace exponent_ic as the amortisation observable with ones
        that can fail: the flattening ratio beyond the knee against
        kappa_2 times the attempt cost, and a no-reuse null arm with the same
        accounting.
        (4) Make the binary-versus-control usable test two-sided.
        (5) Wire CTL-6 into an invalidation rule.
        (6) Restate NEGATIVE in terms of the knee location and per-target
        operations, not the exponent.

    retry_and_full_log_vector_assumptions:
      stated_as_model_assumptions: true
      where: |
        H assumptions[1] (A2, the retry factor 1/(1 - m exp(-mR/B)) at R = B)
        and H assumptions[2] (A3, "Linear algebra returns the full logarithm
        vector of the touched columns"). Both are stated as model
        assumptions, as the plan requires.
      content_objections:
        - |
          A3 is false at the validation arity. At m = 2 and R = B, 6.8 percent
          of columns are touched but undetermined (tree components). No
          linear-algebra method returns those logarithms: they are not
          determined by the relations, and "Wiedemann does return it" does
          not apply to free variables. At the deployed arities the core-excess
          lower bound gives at least 0.26 percent (m = 4) and 0.05 percent
          (m = 5) undetermined columns. The usable probability then falls from
          0.929 to at most 0.919 at m = 4, about 0.015 bit in kappa.
          Immaterial at deployed arity; material at the arity used to
          validate H1.
        - |
          A2's geometric retry law assumes one decomposition per successful
          attempt, with success probability equal to the usable probability.
          Oracle A returns all Poisson(mu) decompositions and any usable one
          is accepted. At deployed mu = 1 the contract's kappa is the higher
          figure: 1.707 against 1.653 at m = 4 (0.046 bit) and 1.637 against
          1.614 at m = 5 (0.021 bit). That is conservative toward index
          calculus. At the toys the retries depend on mu (reading_3_retries).
        - |
          H1 uses the exact touched value 1/(1 - e^-m)^m = 1.338 for its
          retry prediction. The model's kappa uses the first-order
          1/(1 - m e^-m) = 1.371 at m = 2. The two are not the same law.

    per_orbit_label:
      check_result: holds
      quotes:
        - file: H
          field: hypothesis.mechanism
          quote: |-
            The per-orbit forward guidance (iii) of the proposal (orbit-quotient advice size B/131) is a per-orbit framing under CORR-20260925-649e25: conditional on the per-orbit unit no approved contract has fixed, cited only as a dependency, never a movement (C7).
        - file: H
          field: hypothesis.interpretation_limits[5]
          quote: |-
            Forward guidance (iii) of the proposal (orbit-quotient advice size B/131 raising T_gen by log2 sqrt(131) = 3.5 bits) is a per-orbit framing under CORR-20260925-649e25: conditional on the per-orbit unit no approved contract has fixed, cited as a dependency on IDEA-20260926-201e86 (HOLD-X2), never stated as a movement (C7).
      reading: |
        CORR-20260925-649e25 item 1 is satisfied on every point:
        (a) conditional: yes.
        (b) per row: the ECC2K-130 row only, and no row parameters are
            asserted.
        (c) attribution: "of the proposal".
        (d) not authority for scope: yes.
        No unlabelled per-orbit movement appears in the three files.
        Residual: interpretation_limits[5] restates the proposal's magnitude
        (3.5 bits). For its own analogous figures, CORR-20260925-649e25
        elided the magnitudes. Here the figure is attributed and conditional,
        so it is not an unlabelled movement.
      structural_finding: |
        The per-orbit guidance is not available inside the scoped base class.
        2 has multiplicative order 130 modulo 131 (computed), so
        x^131 - 1 = (x - 1) Phi_131(x) with Phi_131 irreducible over F_2. By
        the normal basis theorem, F_(2^131) is the cyclic
        F_2[Frobenius]-module F_2[x]/(x^131 - 1). It therefore has exactly
        four Frobenius-stable F_2-subspaces, of dimensions 0, 1, 130 and 131.
        No factor base of the scoped subspace class (KN-OPEN-020, H
        interpretation_limits[7]) at cap-locus size is Frobenius-stable. The
        orbit-quotient advice size B/131 needs a Frobenius-closed base
        outside that class, and such a base changes the decomposition
        problem that defines C. The condition is therefore stronger than
        "the unit no approved contract has fixed". This is recorded for
        HOLD-X2; IDEA-20260926-201e86 was not read here.

    j3_summary: |
      J3 BREAKS on the collision (the plan's fourth J3 artifact). The
      clause is kept out of every outcome (TA-1 not fired). The Kuhn-Struik
      marking holds and is now confirmed at source. The CGK statement is
      correctly labelled as a corpus relay. The per-orbit label is present.
      Surviving J3 objections, none of which is a break by itself:
      - the frontier's location depends on the advice unit and group-size
        conventions by -3.51 and +4.02 bits, against a claimed 0.5 bit;
      - the precomputation axis is CGK Theorem 10, which is not cited;
      - the window's upper end uses a constant from neither source,
        conservative in direction;
      - the comparator's memory at the upper end is uncharged and its
        example is overstated by about 2^22.8;
      - A2 and A3 are mis-specified at the validation arity m = 2.

  # ===========================================================================
  J4:
    joint: >-
      J4 -- R2 boundaries, exclusions, and the proves-too-much controls (C6,
      C8).
    verdict: breaks
    breaking_artifact: |
      An over-scoped sentence (plan J4 breaking_artifact, fourth item):
      over_scoped_sentences items 1 and 2. The other J4 checks hold:
      - PTM-A, PTM-B and PTM-C meet their failure signatures (PTM-B with a
        0.0001-bit rounding caveat);
      - no prime-field engine cell and no deployed-parameter run is designed;
      - the 1ddce2 column is cited by id and not re-derived;
      - the contract's inputs respect the excluded reads.

    proves_too_much:
      how_run: |
        Review computations at zero compute in this task's own script
        (computations.json scripts rt_review.py). It re-implements the
        contract's cost rules from E definitions.model_Mm,
        cap_locus_and_constants and conventions_for_g. No stage0_code or
        fixture_code was executed, no RUN-* was minted, and no evidence
        record was written. None of the three amounted to a new experiment.
      PTM-A:
        performed: true
        object: An oracle with per-attempt cost exactly C = T_gen(m) at matched advice S = B_cap, m in 4, 5, 6, 8, 16.
        result: meets_failure_signature
        detail: |
          - Identity: log2(B_cap T_gen) - log2 P_gen = 0 at every m.
          - Precomputation with the constants kept: 0.666 bit above P_gen at
            m = 4, 0.662 at the others.
          - Online cost kappa_m T_gen: above T_gen by 0.771, 0.711, 0.683,
            0.666, 0.662 bits at m = 4, 5, 6, 8, 16.
          - The model window at C = T_gen is empty at every m, with
            4ab = 6.90, 6.60, 6.47, 6.39, 6.37. These equal the closed form
            8 A1 kappa_m / pi to 0.3 percent, the gap being the LA term at
            m = 4.
          - Over every base size log2 B in [25, 40] (step 0.001) at m = 4, no
            base gives a nonempty window at C = T_gen(4). The envelope's
            largest critical log2 C is 42.527 at log2 B = 34.33, which is
            1.008 bits under T_gen(4). That is the smallest margin found.
          - Against Bernstein-Lange's 16 retrieved measured points
            (precomputation factor, online factor), the object's pair
            (1.587, 1.707) at m = 4 and (1.582, 1.637) at m = 5 neither
            dominates nor is dominated. It reads on the generic frontier in
            Bernstein-Lange terms.
          No rule of the contract reports it below the frontier or reports a
          relaxation for it.
        caution: |
          The location of the line depends on convention. In T_gen, S in bits
          moves it by -3.51 bits and N = r by +4.02 bits (J3.cgk_comparison).
          The contract's rules fix N_prime and words (C1), and in that
          convention PTM-A reads on the frontier. A rule set that mixed
          conventions could read the PTM-A object several bits off the line
          in either direction. That is why the convention must travel with
          the column.
      PTM-B:
        performed: true
        object: The L = 1 slice of the multi-target cost at m = 4 on ECC2K-130 with the plain-base sub-cap optimum.
        result: meets_failure_signature_with_rounding_caveat
        detail: |
          At log2 B = 29.036035 (the contract's closed-form optimum),
          log2 mu = -19.4408. At the literal pinned per-attempt budget
          2^11.01 the relation term is 2^59.4869 and the LA term 2^60.0721.
          The one descent term at L = 1 is 2^30.5606, which is 2^-30.25 of
          rho_1.
          The largest L = 1 tie budget over every base (log2 B from 29.0 to
          35.0, step 0.0005) is 2^11.010251, at log2 B = 29.036. That is the
          pinned 11.01 to its two decimals, and no base gives a larger
          single-target budget. The slice reports the pinned single-target
          column and no other budget.
          Term by term, the slice equals the single-target product law plus
          one descent term the product law does not carry. That term moves
          the tie by about 1e-9 bit.
        rounding_caveat: |
          At the literal two-decimal pinned value C = 2^11.01, which is
          0.00025 bit under the exact tie, the model gives
          IC(1) = rho_1 x 2^-0.0001. The window's lower root then sits at
          log2 L = -0.0002, so L = 1 is formally inside the model window by
          rounding. E definitions.conventions_for_g writes D3(4) = 11.010,
          also rounded down, while stage0_code uses the unrounded recomputed
          value. At the contract's tolerances this is not an advantage. But a
          rule that reads windows at g = 0 should either measure g from the
          unrounded D3(4) = 11.010251 or treat log2 L_lo within 0.01 of zero
          as the tie.
      PTM-C:
        performed: true
        object: |
          The m = 5 window at g = 14 (above the record's critical 13.2), and the
          relabelled Z/NZ control against the ordinary and Koblitz n = 19 cells
          for the amortisation exponent.
        result: meets_failure_signature
        detail: |
          Window part. The model's critical log2 C at m = 5 (B = B_cap) is
          45.332, so the critical g is 12.252 at the pinned 33.08, 12.914 at
          the proposal convention taken as 33.08 - 0.662 = 32.418 (the
          contract's 32.414 gives 12.918), and 12.932 at the record's 32.4. At g = 13, 13.2 and 14 the window is empty in all
          three conventions:
          - 4ab = 2.82, 3.72, 11.28 (pinned);
          - 4ab = 1.13, 1.49, 4.51 (proposal convention at 32.418);
          - 4ab = 1.10, 1.45, 4.40 (record).
          With the constants kept, the record's stated critical 13.2 is
          0.27 too high, as the contract itself says.
          Exponent part. The contract predicts one index-calculus exponent
          (-1.0) and one rho exponent (-0.5) on all three cells (H
          predictions[4], [5], [7]; E CTL-2). It makes no Frobenius-dependent
          prediction.
        vacuity_note: |
          The knee rule makes the index-calculus exponent the same on every
          cell for any data (J3.collision reading_1), so this half of PTM-C is
          met vacuously. The quantity that genuinely differs by cell is the
          retries, and it differs through mu, not Frobenius (J3.collision
          reading_3). That is not a PTM-C failure.
      failure_signature_verdict: |
        All three objects meet the plan's failure_signature. PTM-A reads on
        the frontier with zero relaxation. PTM-B reads the pinned
        single-target verdict with no advantage beyond a disclosed rounding
        of 0.0001 bit. PTM-C reads an empty window at g = 14 and identical
        predicted exponents on all three cells.

    exclusions:
      prime_field_engine_cells:
        result: excluded
        quotes:
          - file: E
            field: experiment.scope.excluded[0]
            quote: |-
              The prime-field engine cells (p about 2^20 to 2^24, engines enumerate and mitm) of IDEA-20260926-20ba8f Stage 2. Routed to GOAL-ICPERF-e6b6a4 by DEC-20260928-63addc PTR-ICPERF as an amortisation instrument that goal may rank (C8).
          - file: H
            field: hypothesis.interpretation_limits[6]
            quote: |-
              The prime-field engine cells of the proposal's Stage 2 are excluded (routed to GOAL-ICPERF-e6b6a4 by DEC-20260928-63addc PTR-ICPERF); no deployed-parameter run is designed; IDEA-20260926-1ddce2's size column is cited by id as an input and not re-derived (C8).
      deployed_parameter_run:
        result: excluded
        quotes:
          - file: E
            field: experiment.scope.excluded[1]
            quote: |-
              Any run at deployed parameters (n = 131 appears only as arithmetic).
          - file: H
            field: hypothesis.test_boundary.instances[0]
            quote: |-
              ECC2K-130 at deployed parameters, arithmetic only (Stage 0 and Stage 3); no run touches n = 131.
      residual_touch_points:
        - file: E
          field: experiment.procedure[1]
          quote: |-
            2. Instrument self-tests (I3 field; I1 on a 6-unknown random system with a known solution; I2 at L = 1 against rho.py on a prime-field toy curve, same seed, same k).
          reading: |
            An instrument self-test object, not a Stage 2 engine cell. It gives
            no amortisation reading, so it does not trigger TA-3. But its curve
            is defined nowhere in the contract (no parameters, order or
            admission rule), and it is absent from scope.included and
