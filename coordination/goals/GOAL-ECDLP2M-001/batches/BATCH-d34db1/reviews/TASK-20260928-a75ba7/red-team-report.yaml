      excluded_reads_in_the_contract_inputs: |
        Respected. E inputs names no path on the plan's excluded list. The
        producer's read attestation (A read_attestation) discloses three
        things:
        - two greps that displayed lines from
          analysis/binstd-idea-review-20260926/ files, which were not opened;
        - a read of ledger/hypotheses/H-BINSTD-ce4f38.yaml as a shape
          reference;
        - a partial read of experiments/EXP-BINSTD-178742/specification.yaml
