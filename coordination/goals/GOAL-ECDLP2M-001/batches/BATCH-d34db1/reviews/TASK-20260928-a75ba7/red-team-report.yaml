        - file: H
          field: hypothesis.test_boundary.implementation
          quote: |-
            Pure Python 3.11 on the installed instruments: the prime-field index_calculus package (linalg.py extended to a full logarithm vector, rho.py extended with a shared-table multi-target mode, both specified in EXP-BINSTD-532d7f), the EXP-CERTBIN-e94b27 binary-curve modules with a GF(2^19) field module, and a Z/NZ adapter;
          reading: |
            An engine-package reference. I1 and I2 are specified as extensions
            of src/crypto_autoresearcher/index_calculus/linalg.py and rho.py,
            with no declared write location. Extending them in place would
            edit the shared prime-field package that the ICPERF engines run
            on, an R2 ownership edge. The contract should place I1 and I2
