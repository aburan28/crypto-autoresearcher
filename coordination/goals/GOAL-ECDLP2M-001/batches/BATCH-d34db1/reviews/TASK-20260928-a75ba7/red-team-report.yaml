    - The convention statement for the column (advice unit, N_prime, the
      generic constant c with its source and sensitivity).
    - Citation of this report's Corrigan-Gibbs-Kogan, Kuhn-Struik and
      Bernstein-Lange reads as retrieved sources (Theorem 2 and Theorem 10;
      Theorem 1 with its range; Table 4.1).

