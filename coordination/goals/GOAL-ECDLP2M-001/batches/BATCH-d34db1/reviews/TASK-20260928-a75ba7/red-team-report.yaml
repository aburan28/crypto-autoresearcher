            Objection, not a break; it is not a designed engine cell.
      dep4_reading: |
        Holds. The binary Stage 2 cells are the heuristic validation of H1
        and H2 (E heuristic_under_test). E scope.excluded[3] excludes any
        cross-algorithm crossing on toy cells, so no phase-cost row is
        designed. CTL-4's single-target against multi-target comparison at
