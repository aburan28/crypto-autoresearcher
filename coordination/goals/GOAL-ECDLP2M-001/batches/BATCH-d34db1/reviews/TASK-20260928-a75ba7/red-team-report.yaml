    over_scoped_sentences:
      criterion: |
        Plan J4 attack (iv): a sentence that states or implies more than a
        second budget row, a structural statement and toy exponents.
      items:
        - item: 1
          breaks: true
          file: H
          field: hypothesis.title
          quote: |-
            and its crossing windows in the oracle excess g are arithmetic on the model, validated on binary toy cells through heuristics H1 and H2
          why: |
            The toy cells test H1 and H2 at m = 2, L at most 256 and subgroup
            orders of about 2^17 to 2^20. The windows' upper ends need the
            generic law at L up to 2^60.5 (m = 4 sub-cap) and 2^98 (cap
            slice) at N_prime = 2^121, where the toys say nothing; the
            contract's own transfer rule is "law's form only". J3.collision
            also shows that the H1 validation cannot validate as specified.
            The inference spans 40 to 90 bits in L and about 100 bits in
            group size.
        - item: 2
          breaks: true
          file: H
          field: hypothesis.statement
          quote: |-
            The table has two budget rows; the corpus priced only the first; every m >= 4 oracle record is read against both.
          why: |
            It asserts, in the present tense, a program-wide reading rule.
            DEC-20260928-63addc S1 decision_it_changes poses that rule as the
            question the S1 result decides ("Whether ... every m >= 4 oracle
            record ... is read against both lines"). A hypothesis cannot
            settle it before approval or any run.
        - item: 3
          breaks: false
          file: H
          field: hypothesis.statement
          quote: |-
            generic multi-target rho, under heuristic H2, has per-target cost falling as L^(-1/2) at every L.
          why: |
            Over-broad heuristic wording. It goes beyond Kuhn-Struik's source
            range (L << N^(1/4)) and Bernstein-Lange's measured table range,
            and is literally false for L above N_prime. It is conditional on
            H2, so it is recorded as an objection.
        - item: 4
          breaks: false
          file: H
          field: hypothesis.interpretation_limits[4]
          quote: |-
            Every constant is disclosed (statement_note); the column is stated to 0.5 bit and the frontier comparison at C = T_gen is "on the frontier within 0.5 bit", never below.
          why: |
            Over-precise. The same wording is in E definitions.frontier. It
            holds relative to Bernstein-Lange in the words and N_prime
            convention only; relative to KN-LIT-013 the conventions move
            T_gen by -3.51 and +4.02 bits and the polylog slack is
            unquantified.
        - item: 5
          breaks: false
          file: E
          field: experiment.memory_beside_time.window_memory
          quote: |-
            The rho side holds a distinguished-point table of theta times rho_1 sqrt(L) entries (theta the distinguished-point rate, a free van Oorschot-Wiener parameter) at 17 bytes: at L = 2^30 and theta = 2^-20, about 2^56 entries, 2^60 bytes; stated as the comparator's tradeoff position, not as a claim.
          why: |
            It overstates the comparator's minimal memory at that L by about
            2^22.8, and theta is bounded below at the window's upper ends
            (J3.upper_end_law).
        - item: 6
          breaks: false
          file: E
          field: experiment.success_criterion
          quote: |-
            Then the POSITIVE outcome holds: the column is filed conditional on H1, H2 and C, and HOLD-X1's ladder contract states both lines.
          why: |
            Mild. It restates DEC-20260928-63addc's positive next decision
            inside an outcome. What another contract states is a Coordinator
            act, not an outcome of this one.
        - item: 7
          breaks: false
          file: H
          field: hypothesis.asymptotic_claim.time_exponent
          quote: |-
            The frontier line is log2 T_gen = (1/2)(1 - 1/m) n - const against the single-target cap line (1/2 - 1/m) n - const, a relaxation of n/(2m) bits
          why: |
            Mild. It is a structural statement about two budget lines, but it
            is stated for every n and tested only as arithmetic at n = 131.
            The same holds for the exponent form in H statement (C). It
            should be labelled as model arithmetic, untested beyond n = 131.
    j4_summary: |
      J4 BREAKS on over-scoped sentences 1 and 2. Every other J4 item
      holds, with objections: the unspecified prime-field self-test curve,
      the in-place extension edge on the shared index_calculus package, and
      over-scoped items 3 to 7.

  # ===========================================================================
  cheapest_falsification:
    statement: |
      The knee-rule null object, at zero compute. Feed E definitions.fits the
      per-target cost of a process with no stored log vector:
      per_target_cost(L) = 2^20.3/L + 2^10 over L = 1, 4, 16, 64, 256. That
      is a fixed setup plus an independent per-target solve. All five cells
      pass the knee rule and exponent_ic = -0.970, inside G1's band
      [-1.1, -0.9] and success clause (iii) [-1.1, -0.85]. The claim that
      the Stage 1 and Stage 2 index-calculus exponent validates amortisation,
      and through it H1, is therefore false as specified. The exponent is
      confined to [-1.16, -0.84] by the knee rule for any data
      (computations.json knee_rule_exponent_range and
      knee_rule_null_objects).
    runnable_as: |
      python3 rt_review.py (embedded in computations.json) prints the null
      objects' exponents. Otherwise it is four lines of arithmetic on E
      definitions.fits.
    second_cheapest: |
      The determined-column fraction of a random m = 2 relation set with
      R = B, computed at zero compute from the giant-component law. It gives
      a usable fraction of 0.635 against H1's predicted 0.748, and the
      abstract-graph Monte Carlo confirms it at B = 128 and 512.

  objections:
    - id: OBJ-1
      joint: J3
      breaks_joint: true
      text: |
        The reporting rules misread the observation collision
        (J3.collision). The exponent is fixed by the knee rule, H1's usable
        and retry predictions are mis-specified at m = 2, the binary-cell
        test is one-sided, and CTL-6 is not an invalidation rule. The
        genuine preimage lands in no declared outcome, and an over-complete
        binary cell can read POSITIVE.
    - id: OBJ-2
      joint: J3
      breaks_joint: false
      text: |
        The frontier's location depends on two conventions the column does
        not carry: advice in words rather than bits (-3.51 bits in T_gen)
        and N_prime rather than the prime order r (+4.02 bits). The contract
        claims "within 0.5 bit".
    - id: OBJ-3
      joint: J3
      breaks_joint: false
      text: |
        The precomputation axis (P_gen) of the two-axis frontier is CGK
        Theorem 10. Neither KN-LIT-013 nor the contract cites it, but H
        statement (C) attributes the axis to KN-LIT-013 "as reported".
    - id: OBJ-4
      joint: J3
      breaks_joint: false
      text: |
        The window's upper end uses the generic constant c = 1, which neither
        Kuhn-Struik (1.128) nor Bernstein-Lange (2.15 to 2.36) gives. The
        sensitivity is 2 log2 c on log2 L_hi, up to +3.1 bits. The direction
        is conservative.
    - id: OBJ-5
      joint: J3
      breaks_joint: false
      text: |
        The comparator's memory at the window's upper end is uncharged: at
        least about 8 L distinguished-point entries under the contract's own
        overshoot rule. The E window_memory example overstates it by about
        2^22.8 at L = 2^30.
    - id: OBJ-6
      joint: J3
      breaks_joint: false
      text: |
        A3 (full log vector of the touched columns) is false at m = 2,
        R = B: 6.8 percent of columns are touched but undetermined. A2's
        geometric retry law ignores multi-decomposition attempts. Both are
        immaterial at deployed m (at most 0.05 bit in kappa) and material at
        the validation arity.
    - id: OBJ-7
      joint: J3
      breaks_joint: false
      text: |
        The per-orbit guidance (iii) is labelled correctly. But no
        Frobenius-stable F_2-subspace base of cap-locus size exists in
        F_(2^131), so the orbit-quotient advice lies outside the scoped
        subspace base class. The conditional is stronger than the label
        says.
    - id: OBJ-8
      joint: J4
      breaks_joint: true
      text: |
        Over-scoped sentences: the H title ("validated on binary toy cells
        through heuristics H1 and H2") and H statement (D) ("every m >= 4
        oracle record is read against both").
    - id: OBJ-9
      joint: J4
      breaks_joint: false
      text: |
        E procedure step 2 runs a self-test on a prime-field toy curve
        defined nowhere in the contract. I1 and I2 are specified as
        extensions of the shared index_calculus package with no write
        location, an R2 ownership edge with GOAL-ICPERF-e6b6a4's engines.
    - id: OBJ-10
      joint: J4
      breaks_joint: false
      text: |
        PTM-B rounding: at the pinned two-decimal D3(4) = 11.01, or the E
        conventions_for_g value 11.010, the L = 1 slice reads 0.0001 bit
        under rho_1, and L = 1 falls formally inside the g = 0 window. The
        unrounded 11.010251 removes this.
    - id: OBJ-11
      joint: J4
      breaks_joint: false
      text: |
        Over-scoped items 3 to 7 (J4.over_scoped_sentences): "at every L",
        the 0.5-bit precision, the theta example, the HOLD-X1 clause inside
        an outcome, and the general-n exponent form.

  required_controls:
    - |
      A no-reuse null arm on CTRL-ZN and on at least one binary cell. It
      uses the same shared-cost charge and accounting, and solves each
      target without the stored vector (the CTL-4 single-target pipeline
      per target would do). The amortisation reading must differ from this
      arm on a gated observable.
    - |
      H1's usable prediction restated for determined columns (the
      giant-component law at m = 2; 0.635 at R = B), with the touched value
      kept as a diagnostic. Alternatively, choose R so that the touched
      prediction is the determined one (R about 1.157 B at m = 2).
    - |
      Retries predicted per mu regime with multi-decomposition acceptance.
      Either match the Z/NZ control's mu to the binary cells' mu (about 1),
      or keep mu about 1/32 and predict the control's own retries.
    - |
      Replace the exponent-based gate and the NEGATIVE branch with
      observables that can fail: the flattening ratio beyond the knee
      against kappa_2 times the attempt cost, the knee location, and the
      null arm above.
    - |
      Make the binary-versus-control usable comparison two-sided, and make
      CTL-6 an invalidation rule.
    - |
      State with the column: the advice unit, the group-size convention
      (N_prime with C1, not r), the generic constant c used by the windows
      together with its source and sensitivity, and the unrounded D3(4).

  counterexample_or_mutation: |
    Counterexample (O3, the no-reuse null): exponent_ic = -0.970 on five
    knee cells, which passes both exponent bands with no log vector reused.
    Mutation (O4): multiply the per-target cost by 8 (coverage-limited). The
    knee set collapses to {1}, exponent_ic is undefined, and the NEGATIVE
    outcome cannot be reached. Coverage limitation never shows as a shallow
    exponent.

  baseline_comparison: |
    For the owned joints the contract claims no gain, so the comparison is
    whether it uses the right comparators.
    - Single target: matched rho 2^60.8090 = sqrt(pi r/(4 x 131)), per C1.
    - L targets: generic pooled rho. At source, Kuhn-Struik give
      sqrt(2 L N) = 1.128 rho_1 sqrt(L) for L << N^(1/4); the contract uses
      rho_1 sqrt(L).
    - Advice S: the Bernstein-Lange measured tradeoff (online factor about
      1.38 to 2.14 times (l/T)^(1/2), precomputation factor about 0.85 to 37
      times (lT)^(1/2), at l about 2^48), with CGK's lower bound (S in bits)
      T^2 = Omega-tilde(epsilon N) and PT + T^2 = Omega(epsilon N) behind it.
    - BSGS with a stored table of S baby steps costs about N_prime/S per
      target online, which the rho-table family dominates for every S below
      N_prime. It is correctly not used.
    - The closest specialised baseline, the pinned D3 single-target column
      (CORR-20260928-4cb669), is used as the single-target comparator and is
      reproduced by the L = 1 slice (PTM-B).

  heuristic_challenges:
    - |
      H1, random-model transfer. The occupancy (touched) model is the wrong
      random model for the measured quantity at m = 2. Relations form a
      signed random graph whose tree components are touched but
      undetermined, so the prediction is 15 percent high. At deployed m the
      core-excess bound makes the error at most about 0.015 bit. The Z/NZ
      control is not a nearby object for retries, since its mu is about
      1/32 against about 1.
    - |
      H2 (i). The constant of the pooled law above N_prime^(1/4) is neither
      measured nor sourced (toy L is at most 256). The toy rho uses no
      negation or Frobenius classes while the deployed rho_1 does, so the
      pooling constant's transfer to equivalence-class walks is an
      untested assumption.
    - |
      H2 (ii). The source statement is Theorem 2 (S in bits, prime-order N,
      log-factor slack) together with Theorem 10 for the precomputation
      axis. The contract's form is consistent up to log factors and
      inconsistent with its own 0.5-bit precision claim.

  cost_model_challenges:
    uncharged_terms:
      - |
        Comparator memory at the window's upper end: at least about 8 L
        distinguished-point entries (2^57.0 at L = 2^54.04; 2^63.5 at
        L = 2^60.50). The windows compare time only at unequal memory. Index
        calculus holds 2^31.67 bytes of advice at m = 5.
      - |
        Advice unit: S counted in 129-bit words, while KN-LIT-013's bound
        counts bits. That is a factor 129 in S, or 3.51 bits in T_gen.
      - |
        The oracle's own working memory stands beside no time figure. The
        1ddce2 size column, cited by id, is where it lives.
      - |
        Undetermined columns at R = B (rank deficiency, tree components):
        uncharged in H1 and A3. At m = 2 they cost 15 percent in the usable
        fraction and 17 percent in the control's retries; at m = 4 and 5,
        at most about 0.015 bit.
      - |
        Multi-decomposition acceptance: A2 overcharges kappa by 0.046 bit
        (m = 4) and 0.021 bit (m = 5), which is conservative, and
        mis-predicts the toy retries by cell.
      - |
        The target's own descent at L = 1 is 2^-30.25 of rho_1. The
        single-target product law does not carry it; negligible.
    checked_and_charged: |
      Inverse success probability: A(mu) and the retry factor are in the
      per-target cost; A(mu) and the LA term are in T_shared. Factor-base
      construction and subgroup projection at the cap locus are not in
      T_shared. By hand they are of order B_cap times a few hundred group
      operations, far below the relation term: negligible and not a
      finding.

  reduction_and_scope_challenges:
    - |
      "Generic and tight by KN-LIT-013 as reported" at N_prime goes beyond
      the source: Theorem 2 is for a prime-order group in the generic model,
      and Frobenius is not a generic operation.
    - |
      The per-orbit guidance lies outside the scoped subspace base class
      (OBJ-7).
    - |
      The over-scoped sentences (J4.over_scoped_sentences).
    - |
      The R2 ownership edge on the shared index_calculus package (OBJ-9).

  proof_architecture_challenges:
    - |
      Observation fiber. exponent_ic takes the same value on genuine,
      over-complete and no-reuse preimages; the fiber holds objects on both
      sides of the conclusion. The missing separator is an observable that
      depends on reuse: a null arm, or the flattening beyond the knee
      against the model's per-target cost.
    - |
      Quantifier order. H proof_search_map.quantifier_order says the window
      endpoints "depend on m, g and the base size B and on nothing else".
      They also depend on the generic law's constant c, a choice above
      N_prime^(1/4) with sensitivity 2 log2 c.
    - |
      Method ceiling. "The per-target cost of index calculus scales as
      L^(-1 +/- delta)" is certifiable only as an accounting identity under
      the knee rule, not as a measured law.
    - |
      Boundary and strictness. The L = 1 embedding holds up to the
      2^-30.25 descent term and the D3(4) rounding (PTM-B).
    - |
      Nearby object. The Bernstein-Lange measured points confirm PTM-A's
      "on the frontier" reading. The Z/NZ control is a nearby object for
      the usable fraction but not for retries.

  null_and_nearby_object_controls:
    checked:
      - |
        The PTM-A object against Bernstein-Lange's 16 measured points: no
        dominance either way.
      - |
        The PTM-B L = 1 slice against the pinned D3 column: reproduced up to
        rounding.
      - |
        The PTM-C window at g = 13, 13.2 and 14: empty in three conventions.
      - |
        The knee-rule null (O3) against the exponent gate: it passes, so the
        gate is not a test.
      - |
        The over-complete object (O2) and the genuine object (O1) against
        H1's band: both fall outside it.
      - |
        Kuhn-Struik's range and constant at source; Bernstein-Lange's
        measured regime at source.
    missing_in_the_contract:
      - |
        A no-reuse null arm with identical accounting. The exponent has no
        null object of the same shape.
      - |
        A Z/NZ control at the binary cells' mu (about 1), needed for the
        retries.
      - |
        A control for the generic constant above N_prime^(1/4), which cannot
        be measured at toy scale. The window's upper end therefore needs the
        constant stated as a disclosed choice with its sensitivity.

  claim_survival: |
    Within J3 and J4 the claim did not survive intact.
    - J3 fails on the collision: the reporting rules cannot validate H1 or
      separate genuine amortisation from a no-reuse null or an
      over-complete relation set.
    - J4 fails on two over-scoped sentences.
    What survived the attack: the tripwire discipline (TA-1 not fired), the
    Kuhn-Struik marking, the CGK labelling, the per-orbit label, all three
    proves-too-much controls, and the R2 exclusions. Those, with the
    deployed arithmetic that J1 and J5 own, still distinguish the design
    from an artifact.
    Remaining uncertainty, named:
    - The determined-fraction model assumes independent uniform leg
      columns. A real subspace base could differ, which is exactly what H1
      is meant to test.
    - Theorem 10's operator glyph (Omega or Omega-tilde) and Kuhn-Struik's
      range glyph were lost in extraction and are reconstructed from
      context.
    - Bernstein-Lange's constants are transferred from l about 2^48.
    - IDEA-20260926-201e86 was not read.

  surviving_objections: |
    Every objection in the objections list survives the contract's own text.
    - Break-carrying: OBJ-1 (J3, the collision misread) and OBJ-8 (J4, the
      over-scoped title and statement (D) sentences).
    - Not break-carrying: OBJ-2 to OBJ-7 (J3: frontier conventions,
      Theorem 10 attribution, the generic constant, comparator memory, A2
      and A3 at m = 2, per-orbit guidance outside the scoped base class) and
      OBJ-9 to OBJ-11 (J4: the undefined self-test curve and in-place
      package extension, the PTM-B rounding, over-scoped items 3 to 7).
    None is resolved by the contract as written, and each has a
    zero-compute remedy (next_concrete_action).

  pointers_outside_owned_joints:
    note: |
      Pointers only, with no verdict and no adjudication (RA-9). They are
      for the owners of those joints and the composer.
    items:
      - |
        J2 (fixture). The audit sheet's fixture_code carries its own FullVectorElim and
        rho_multi, while the curve cells use I1 and I2 (extensions of
        linalg.py and rho.py) through the I5 driver. G1 passing may
        therefore not certify the instruments read on the curve cells.
      - |
        J2 (admission). E CTL-7 lists AR-MU (mu_cell in [0.5, 2]) without
        restricting it to the binary cells. The designed CTRL-ZN mu of about
        1/32 would fail it if read literally.
      - |
        J1 (pin). E conventions_for_g writes D3(4) = 11.010 while
        stage0_code uses the unrounded value (PTM-B rounding caveat).

  narrowest_supported_statement: |
    Scoped to J3 and J4, from the committed bytes of TASK-20260928-7a6424:
    - The three files state the first-below-the-line clause nowhere as an
      outcome, prediction or success criterion.
    - The frontier column is a statement about the Bernstein-Lange-type
      generic algorithm, in 129-bit words at N_prime = r/262. Relative to
      KN-LIT-013's lower bound (read at source here) it holds only up to log
      factors.
    - The crossing windows are conditionals on the per-attempt cost whose
      nonemptiness coincides with the TW-01 parameter region, computed with
      the most conservative available generic constant.
    - PTM-A, PTM-B and PTM-C meet their failure signatures under the
      contract's rules.
    - No prime-field engine cell or deployed run is designed, and 1ddce2 is
      cited by id.
    Not supported: that the Stage 1 and Stage 2 reporting rules can validate
    H1 or distinguish genuine amortisation from the constructed collision;
    and the two over-scoped sentences. Nothing here is a statement about the
    security of any curve or the cost of any oracle.

  next_concrete_action: |
    One zero-compute revision design card, named by the composer under
    K-revise-defect, would clear both breaks and every listed objection.
    Its contents:
    - The six remedies in J3.collision.remedy_zero_compute.
