    ddce2_citation:
      result: cited_by_id_not_re_derived
      where: |
        H interpretation_limits[6]; E scope.excluded[4]; E
        inputs.cited_by_id_only[1]; A c1_c8_discharge_table (C8 row) and
        read_attestation.
      reading: |
        1ddce2's size column is the size of the oracle's chained-S_3 system at
        m = 5 and 6 (ledger/proposals/IDEA-20260926-1ddce2.yaml, grepped).
        The contract's only size figures, in E memory_beside_time, are the
