    findings_arising_here_but_owned_by_another_joint:
      - id: ROUTE-TO-J2-1
        owner: TASK-20260928-91b346, joint J2 (the fixture and its pass criteria)
        what: >-
          PC-1 and MIN_CELL are jointly unsatisfiable. The identity label of
          FIXTURE-B1 gives every distinct point its own bucket, so each
          conditioning cell (a, b) holds the number of times one ORDERED PAIR OF
          POINTS was sampled, which is 1 unless a pair repeats. bucket_gain
          excludes every cell below 100 samples, so used equals 0, best stays
          0.0, and G equals 0. PC-1 asks for G exactly M and IR-1 then
          invalidates the cell, on which no arm may be read. Measured: at N equal
          to 1009 with S equal to 2^12, M_identity 1008, G equal to 0.0000, 4085
          cells all excluded; at N equal to 130873 with S equal to 2^14,
          M_identity 28896, G equal to 0.0000, 16384 cells all excluded.
          DETERMINISTIC AND INDEPENDENT OF S: sampling more only adds more
          singleton cells, and satisfying PC-1 would need about 100 repeats of a
          single ordered pair, that is S of order 100 times N squared.
        why_reported_here: >-
          It arose while feeding the PTM objects to the gate, which is my joint,
          and it bears directly on whether the PTM controls can ever be read.
          Reporting it is a good-faith duty; adjudicating it is not mine.
        not_adjudicated: true
      - id: ROUTE-TO-J1-1
        owner: TASK-20260928-91b346, joint J1 (cell setup and the C6 procedure)
        what: >-
          In fixing M per cell for my occupancy arithmetic I computed the a equal
          to 0 Koblitz orders by the Lucas recurrence and factored their odd
          parts: n equal to 17 gives 4 times 137 times 239 and n equal to 19
          gives 4 times 130873, reproducing the record's two stated inputs; but
          n equal to 29 gives 4 times 8353 times 16067 and n equal to 31 gives 4
          times 373 times 1439393, so the odd part is not prime at either degree.
          The contract admits ladder cells only when the order is 4 times a prime
          (AR-B1).
        why_reported_here: >-
          The LADDER LENGTH is what HEUR-B2 can be measured over, and that is my
          joint J3. If this holds, the ladder is n in 19 and 23 rather than four
          cells, before my occupancy finding reduces the N^(1/3) arm further.
        boundary: >-
          I ASSERT NO ADMISSION VERDICT. AR-B1 admission is the contract's own
          setup step, the contract already provides for reporting and dropping a
          failing cell, and checking that procedure is J1's. My figures are
          offered as a pointer with their method stated, nothing more.
        not_adjudicated: true

