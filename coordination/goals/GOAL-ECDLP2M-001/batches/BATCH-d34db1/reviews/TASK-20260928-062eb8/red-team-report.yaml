  cheapest_single_falsification:
    statement: >-
      Extract FIXTURE-B1's matched_marginal_shuffle and bucket_gain verbatim.
      On any cyclic group of order 4 times a small prime, build h(x) equal to x
      mod 4, draw a few thousand ordered pairs, and compute G and then G after
      the shuffle. If the two numbers are equal, PC-6 is unsatisfiable, IR-6
      voids every Stage 2 arm, and SR-4 clause 3 closes the LEAD branch.
    cost: under one minute, no curve arithmetic, no new code, no cell setup.
    why_this_is_the_cheapest: >-
      It needs no field implementation, no order proof, no normal basis and no
      sampling theory. It is one equality between two numbers, and the algebraic
      argument (G is invariant under relabelling the alphabet) predicts the
      answer before the computation runs, so a disagreement would localise to my
      transcription rather than to the mathematics.
    result_when_this_reviewer_ran_it: >-
      G equal to 4.000000 before and 4.000000 after, with the permutation
      verified to be the identity map. The falsification succeeded.

  uncharged_cost_terms_found:
    items:
    - id: COST-1
      term: the 1000-resample bootstrap on every arm
      charged: false
      size: >-
        A factor of about 1000 on every (cell, filter, M, arm), which the
        stage_split estimate omits entirely. Measured 6.92 s per pass at S equal
        to 2^20 on one core here, so about 1.92 h per arm and about 554 CPU-hours
        over 288 Stage 2 arms, against total_cpu_hours 12.
      consequence: SR-2 checkpoints the run inside Stage 2, so the ladder never completes and HEUR-B2 is never read.
    - id: COST-2
      term: the sample size the estimator's own exclusion rule requires
      charged: false
      size: >-
        S must be at or above about 100 times M squared for any estimate to
        exist. Against the declared S: n equal to 23 at M equal to N^(1/3) is
        short by 2.64 bits, n equal to 29 by 6.64 bits, n equal to 31 by 8.64
        bits; the composite control is short by 4.84 bits at M equal to 548 and
        8.44 bits at M equal to 956. Only n equal to 19 at M equal to N^(1/3) and
        the N^(1/4) arms at n equal to 19 and 23 are estimable as declared.
      consequence: >-
        The blocking composite control cannot be read (IR-4 then voids every
        null), and the decay ladder has one usable cell at the SR-4 operating
        point instead of four.
    - id: COST-3
      term: the sample size a closed-form null check requires
      charged: false
      size: >-
        PC-2's allowance 4 times M to the minus one half is met only when S is of
        order M to the fourth power, which at the primary cell's M equal to 64 is
        about 2^24.6 rather than the declared 2^20, about 4.6 bits.
      consequence: PC-2 fails and IR-2 reads nothing on that (cell, M).
    - id: COST-4
      term: the identity arm's conditioning-cell occupancy
      charged: false
      size: about 100 times N squared pairs, which is not reachable at any cell.
      consequence: PC-1 fails and IR-1 invalidates the cell. Owned by J2 and routed there (ROUTE-TO-J2-1).
    note_on_direction: >-
      Every one of these four terms makes the protocol MORE expensive or LESS
      readable. None of them, if charged, would make any cost figure smaller or
      any margin larger, so none of them flatters the ceiling or the claim. The
      cost model of the CEILING itself (k times L, B equal to L, relations,
      linear algebra, memory) is joint J1's and was not audited here, except for
      the memory-convention delta against Wagner recorded under provenance_C5.

  null_and_nearby_object_controls:
    null_object_checked: >-
      YES. A random label on a relabelled cyclic group of the primary cell's
      prime order, which is CELL-Z's own shape, at all four declared (M, S)
      points. It does NOT behave as the contract predicts: G minus 1 reads
      0.8612 and 3.1202 where 0.7071 and 0.5000 are allowed, and reads exactly 0
      where the table is too sparse. The null is the finding.
    what_the_measured_quantity_should_do: >-
      As the parameter meant to destroy the signal increases, G minus 1 should
      fall toward the random-label level. Under this estimator a RANDOM LABEL's
      own G minus 1 RISES along the declared ladder, because M grows with N while
      S is constant and then falls. A quantity whose null grows where it should
      shrink is the canonical artifact tell of docs/inventor-protocol.md section
      3, and here it is the instrument that produces it, not the object.
    nearby_object_checked: >-
      YES, both of the design's own: the composite-order cell where capacity
      exceeds 2 bits (PTM-A) and the log-interval key where an approximate filter
      genuinely exists (PTM-C), plus Wagner's own Z/2^n (PTM-B). The composite
      object FAILS at the declared sample size, and the design itself states that
      when it fails no null on any cell is admissible.
    a_control_on_my_own_controls: >-
      Each negative result above is paired with a positive one through the same
      code path: the same estimator reads G equal to M exactly on Z/2^17 at M
      equal to 32 and 64, and on a scaled composite of the same 4 times p times q
      shape at M equal to 52 and 68. So my finding is about the declared
      parameters, not about the estimator's definition, and it is falsifiable by
      raising S.

  extrapolation_attack:
    orders_of_magnitude: >-
      The measurement is at n at most 31 against a deployed degree of 131, and
      the transfer spans about 100 bits of N from a measured range the contract
      states as about 12 bits. The contract says so, in those terms, wherever the
      transfer appears.
    what_breaks_first: >-
      NOT the extrapolation. What breaks first is the 12 bits of measured range
      itself. At the SR-4 operating point M equal to N^(1/3), only n equal to 19
      is estimable at the declared sample sizes, and two further ladder cells may
      fail the contract's own admission rule for an independent reason
      (ROUTE-TO-J1-1). A slope fitted over one cell is not a slope, so HEUR-B2's
      premise cannot be evaluated and the 100-bit carry never gets a base.
    consequence_for_the_transfer_heuristic: >-
      HEUR-B2 is labelled honestly and is the right thing to measure; as costed,
      the contract cannot measure it. That is a revise-and-reprice finding, not a
      reason to doubt the heuristic.

  baseline_comparison:
    statement: >-
      No baseline comparison is claimed by the contract and none is challenged
      here. The only reference quantity is matched rho 2^60.8090, used on the
      Stage 0 ceiling line alone; the contract states that no Stage 1, 2 or 3
      outcome is a comparison against it, and this reviewer confirms that no
      procedure step or outcome row makes one. The plain two-list join floor is
      recorded as ABOVE that reference at every arity and base size, which is a
      figure against the contract's own route rather than for it.
    dominated_by_check: >-
      Not applicable to my joints: the contract claims no improvement on any axis
      (claim_kind "capacity_certificate_plus_control_measurement", with the
      departure from the template enum declared in the same field), so there is
      no Pareto row to check. Nothing in the three files asserts a position on
      the frontier, so an unchecked dominated_by cannot be hiding here.

  narrowest_supported_statement: >-
    ON MY TWO JOINTS ONLY, and asserting nothing about J1, J2 or J5. The lane-B
    contract keeps its breakthrough-shaped stake inside a ceiling label
    throughout: the stake appears once, labelled, no outcome-table cell is below
    matched rho, the lead threshold is pre-registered exactly and routed, the
    orbit-unknowns line is labelled conditional, the transfer heuristic is never
    called a bound, the exclusions hold, the cited records are unedited, no
    budget quantity is used, and the halving criterion is correct and the
    k-tree accounting agrees with Wagner at source. NO TRIPWIRE FIRED. But the
    contract's controls cannot do what its labels promise: as committed, the
    matched-marginal shuffle preserves every reading (so PC-6 is unsatisfiable,
    IR-6 voids every Stage 2 arm, and the LEAD branch is unreachable), the
    random-label null criterion is calibrated to the wrong quantity and fails at
    every declared (cell, M), and the blocking composite nearby-object control
    reads the null at the declared sample size, which by the contract's own IR-4
    makes no null admissible anywhere. Both of my joints therefore read BREAKS,
    and the defects are cheap and local to fix rather than a defect of the
    design's idea.

  remaining_uncertainty_named:
    - >-
      My shuffle-invariance result is a theorem about the statistic plus a
      measurement; the only way it is wrong is if I transcribed
      matched_marginal_shuffle incorrectly, and the transcription is embedded
      verbatim in computations.json for a reader to check against the audit
      sheet.
    - >-
      My null-scale law is a heuristic extreme-value argument validated at two
      points (predicted 0.8061 against measured 0.8612; predicted 2.4977 against
      measured 3.1202). It is the right order and slightly conservative; the
      exact constant is not established, and the conclusion (PC-2 fails as
      declared) does not depend on the constant.
    - >-
      My occupancy figures depend on M per cell, which depends on the cells'
      group orders. I computed those by the Lucas recurrence and confirmed it
      against the record's two stated orders and, at n equal to 17, against my
      own exhaustive point count. If the executor's rounding of N^(1/3) to a
      power of two differs from mine (nearest versus floor), one cell could move
      by one bit; that changes no conclusion, because the shortfalls are 2.64 to
      8.64 bits.
    - >-
      The bootstrap cost is a single-core timing on one container extrapolated
      linearly. A faster implementation could reduce it by a constant; it cannot
      absorb a factor of 1000.
    - >-
      PTM-A's certificate arm was run against the ARGUMENT because no certificate
      code exists. If a certificate implementation is added later, that arm must
      be re-run against it; my pass on the argument does not transfer to code
      nobody has written.
    - >-
      I did not test whether a repaired shuffle plus a larger S would let the
      protocol read anything, because that is a redesign and not a review. I
      state only that the two defects are local.

