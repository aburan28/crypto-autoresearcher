    surviving_objections:
      - id: J3-OBJ-1
        severity: material
        what: >-
          The bootstrap is mandatory on every arm and is absent from the cost
          model. One bucket_gain pass at S equal to 2^20 measured 6.92 seconds
          on one core of this container, so the 1000-resample bootstrap is about
          1.92 hours PER ARM, and about 554 CPU-hours over the 288 Stage 2 arms
          (6 cells times 12 families times 2 alphabets times 2 arms). The
          contract's stage_split estimate counts pair ADDITIONS only and omits
          the 1000-resample factor, about 10 bits of work, against declared
          total_cpu_hours 12 and wall_clock_seconds_per_run 21600.
        why_it_matters: >-
          The budget is advisory machine protection, so the consequence is not a
          refusal but SR-2, which checkpoints the run and is "never a negative
          result". The run would therefore stop inside Stage 2 with the ladder
          incomplete, hence no slope, hence HEUR-B2 unmeasured, and the honest
          record of that is a checkpoint rather than a finding. An
          uncharged term whose consequence is an unread experiment is worth
          fixing before approval, not after.
        caveat: >-
          Machine-dependent single-core timing extrapolated linearly. An
          order-of-magnitude statement, not a benchmark.
        remedy: >-
          Either price the bootstrap in stage_split and raise the advisory
          ceilings, or reduce the resample count with the precision loss stated,
          or compute the interval by a closed form the estimator justifies.
      - id: J3-OBJ-2
        severity: material
        what: >-
          HEUR-B2's random_model_justification rests on KN-FIND-ffe1df's
          Theorem A-prime, which bounds the BUCKET-AVERAGED agreement delta, and
          applies it to G, the MAXIMUM-bucket statistic. That finding records the
          substitution as the hole that withdrew its own headline, and records
          that the repair reaches only M at most p^(1/4) while j equal to 2 needs
          p^(1/3). The design measures at M equal to N^(1/3) AND N^(1/4), so even
          the repaired prime-field theory covers only the N^(1/4) arm, and no
          model of any kind covers the N^(1/3) arm.
        what_the_record_says_now: >-
          HEUR-B2 correctly discloses that the prime-field line is "itself
          conditional on that line's H1-prime, which the finding records as
          largely untraced" and that "No binary-field analogue is cited, and none
          is asserted". What it does not disclose is the averaged-versus-maximum
          gap, which is the more serious of the two.
        remedy: >-
          One sentence in HEUR-B2's random_model_justification recording that
          Theorem A-prime bounds delta and not G, that the repaired bound reaches
          only M at most N^(1/4), and that the N^(1/3) arm therefore has no
          random-model justification even conditionally. This lowers no claim; it
          states where the weakest link actually is.
      - id: J3-OBJ-3
        severity: material
        what: >-
          HEUR-B2's CONCLUSION is unfalsifiable as formalised. "G_131 minus 1 is
          of order N^(-c) for some c greater than 0" is satisfied at a single N by
          ANY excess below 1, since any positive number less than 1 equals N^(-c)
          for some positive c. The gloss "that is, no usable gain" does not
          follow: a family with G equal to 1.5 at a level-1 alphabet satisfies
          the stated conclusion while changing the tree's per-attempt cost by
          (M over G) to the power j minus 1.
        note_in_fairness: >-
          The heuristic's PREMISE is falsifiable on the tested range, and its
          falsification_condition is the LEAD branch, which is exactly right. The
          defect is in the formalisation of the consequent, not in the record's
          honesty, and the record's own label "never a bound" is accurate.
        remedy: >-
          State the consequent quantitatively: name the c for which the tree's
          cost at the exact capacity stays above matched rho, so the heuristic
          can fail at n equal to 131 in principle.
      - id: J3-OBJ-4
        severity: material
        what: >-
          The with-orbit line's dependency is cited against that record's own
          stated exclusion. KN-FIND-47da4e measured that the (representative,
          shift) parameterisation is COST-NEUTRAL at m equal to 2, that is, the
          orbit relabelling does not remove work, and it states that it says
          "nothing about orbit unions used with a materialised
          meet-in-the-middle oracle, which is a different trade and is priced
          elsewhere". A k-list tree over stored lists IS a materialised
          meet-in-the-middle oracle. Its own frontmatter also says
          "promotion_gate: NOT MET" and that it "may not be cited as internal
          ground truth".
        why_this_is_not_TB_2: >-
          The contract asserts no orbit saving, labels the line doubly
          conditional, and never uses it alone; and the cited record is not a
          promoted finding by its own frontmatter. There is no contradiction to
          route.
        remedy: >-
          Add the exclusion to the conditional_on field: the with-orbit line is
          conditional on the unfixed per-orbit unit AND on a trade class the
          cited record declines to price. That makes the line's dependency
          honest at the point of use rather than in a reader's memory.
      - id: J3-OBJ-5
        severity: minor but on the largest figures in the sheet
        what: >-
          The two below-rho ceiling margins at k equal to 32, minus 11.8090 and
          minus 20.8369, carry NO per-row margin_reading, while all three
          below-rho rows at k equal to 8 and 16 carry one. The second of them is
          the largest below-rho figure anywhere in the three files, larger than
          the stake TW-02 names. The table-level conditional_on field does cover
          every row, so the ceiling label exists; it is one field away from the
          two numbers most likely to be quoted out of context.
        verified: >-
          Both printed margins are internally consistent with the printed totals
          minus the printed rho (a label consistency read, NOT a recomputation of
          the table, which is J1's and J5's and which RB-6 forbids here).
        remedy: Add the margin_reading field to both k equal to 32 rows.
      - id: J3-OBJ-6
        severity: minor
        what: >-
          Procedure step S3-2 says "the four rows of the outcomes block" while
          the block has five rows and its table_note says "Five rows and no
          others". An executor following S3-2 literally drops one row of the
          table that C1 and TB-1 govern.
        remedy: Change four to five in S3-2.
      - id: J3-OBJ-7
        severity: minor, wording
        what: >-
          H-BINSTD-0126fe statement part (A) is headed "CAPACITY CERTIFICATE,
          unconditional" in the same field that calls the composite-order
          extension "a stated PROOF OBLIGATION of this hypothesis (obligation
          PO-1) and not an assumed step". A certificate whose central step is an
          open obligation is conditional on that obligation. The record does say
          "subject only to obligation PO-1" in heuristic_note and outcome row
          CERT repeats it, so the qualification exists elsewhere.
        boundary: >-
          The MATHEMATICS of the extension is joint J1's and is not adjudicated
          here. This is a labelling objection only.
        remedy: Head the part "CAPACITY CERTIFICATE, unconditional subject to PO-1".

  # ===========================================================================
  # JOINT J4
  # ===========================================================================
  joint_J4:
    scope_from_the_plan: >-
      R2 boundaries, exclusions and the proves-too-much controls (C8).
    verdict: breaks
    breaking_artifact_found: >-
      The plan's J4 breaking-artifact list includes "A PTM object on which the
      rules reach the known-false conclusion". PTM-A produces exactly that: at
      the contract's own declared sample size the Stage 1 gate reads G equal to
      0.0000, not M, on BOTH declared exact alphabets of the composite-order
      nearby object, which is the plan's declared failure signature for that
      object ("a gate that reads the null"). IR-4 then makes no null admissible
      on any cell. The boundaries and exclusions half of J4 is otherwise clean.
    where_the_plan_expected_it: >-
      The plan expected PTM-A to break "if the certificate code returns 2 bits
      on the composite cell because it assumed the target order prime". It does
      not: the certificate's argument returns the full divisor set. The break is
      one layer down, in the estimator's exclusion rule against the declared
      sample size, and it is reached without any assumption about primality.

    proves_too_much_controls:
      how_run: >-
        Review computations at toy size in this reviewer's own scripts, with
        bucket_gain transcribed verbatim from FIXTURE-B1 as the object under
        test. Cyclic models are used where the rule under test depends only on
        the group and the filter, which is the case for the certificate
        arithmetic and for the discrete-logarithm route the contract itself
        specifies for constructing exact alphabets. No curve instantiation of the
        fixture was executed; that is joint J2's.
      PTM-A:
        object: the composite-order cell of order 4 times 137 times 239 equal to 130972, fed to the certificate and to the Stage 1 gate
        performed: true
        certificate_arm: >-
          SURVIVES. The divisor set is 1, 2, 4, 137, 239, 274, 478, 548, 956,
          32743, 65486, 130972; 548 equal to 4 times 137 and 956 equal to 4
          times 239 both divide the order; the divisors strictly below the
          largest prime factor 239 are 1, 2, 4, 137, so the capacity below 239
          is log2(137) equal to 7.0980 bits. The argument does NOT return 2 bits
          and does not use primality of the order anywhere.
        gate_arm: >-
          FAILS THE DECLARED FAILURE SIGNATURE. At S equal to 2^20, the declared
          sample size, the transcribed estimator returns G equal to 0.0000 with
          zero conditioning cells used at M equal to 956 (occupancy 1.15), at
          M equal to 548 (occupancy 3.49) and even at M equal to 137 (occupancy
          55.87), because MIN_CELL equal to 100 excludes every cell of the M by M
          conditional table. PC-5 demands G equal to M inside its interval, so
          IR-4 fires: "The instrument cannot see capacity; NO null on ANY cell is
          admissible in that run."
        control_on_this_control: >-
          The RULE is sound where the sample supports it. Same shape scaled down,
          order 4 times 13 times 17 equal to 884 with alphabets 52 and 68 at
          S equal to 2^20: G reads 52.0000 and 68.0000 exactly, all cells used,
          none excluded. So the defect is the declared S against the declared M,
          not the certificate and not the estimator's definition.
        the_sharpest_form_of_the_finding: >-
          At S equal to 2^20 the only exact alphabets this instrument can read on
          the composite cell are 1, 2 and 4, which is exactly the capacity the
          prime-l cells already have. The nearby object where the capacity is NOT
          2 bits is therefore INDISTINGUISHABLE from a prime-l cell by this
          instrument, which is the entire purpose the object serves in the
          design.
        minimum_sample_sizes: >-
          An estimate needs S at or above about 100 times M squared, that is
          2^24.84 at M equal to 548 and 2^26.44 at M equal to 956, which is 25
          and 90 times the declared S, per arm, in pure Python on one core.
        second_finding_on_this_object: >-
          THERE IS NO CERTIFICATE CODE. FIXTURE-B1 contains no function that
          computes the admissible alphabet set, so the certificate arm of PTM-A
          can only be run against the ARGUMENT. A proves-too-much control on a
          certificate with no implementation cannot catch an implementation that
          assumes primality, which is precisely the failure the plan wanted this
          control to catch. Cheap remedy: add a six-line divisor-set function to
          the fixture with the three control readings of
          stage_0.capacity_certificate.controls_on_this_certificate as its pass
          criteria.
        finding_on_the_plans_own_statement: >-
          The plan's PTM-A known_truth asks the certificate to return "every
          divisor of the order below the largest prime factor, including 548 and
          956". Both 548 and 956 EXCEED 239, so no implementation can satisfy
          that clause as written. The contract's own two-part phrasing (the full
          divisor set as admissible alphabets; the capacity below 239 as
          log2(137)) is the coherent one, and the contract is right where the
          plan's control statement is not. Recorded for the composer, since a
          control whose known_truth is unsatisfiable would otherwise read as a
          contract defect.
      PTM-B:
        object: Z/2^n with h the low log2(M) bits, Wagner's own setting, at n equal to 17
        performed: true
        result: >-
          MEETS ITS FAILURE SIGNATURE on both arms. The certificate returns the
          subgroup filters of every alphabet 2^i, so the divisors between 4 and
          the order are 8 through 65536 and the capacity below 2^17 is 16 bits;
          it does NOT find "no alphabet between 4 and the order". The gate reads
          G equal to 32.0000 and 64.0000 exactly at M equal to 32 and 64 with
          S equal to 2^20, all cells used, none excluded.
        role_it_played: >-
          This is also the control that LOCALISES the PTM-A failure: the same
          estimator, the same code path, the same S, and it reads M exactly. The
          difference is only that S is at or above 100 times M squared here.
      PTM-C:
        object: the relabelled Z/lZ control with the log-interval key, l equal to 130873
        performed: true
        result: >-
          MEETS ITS FAILURE SIGNATURE. The key reads G equal to 18.8047 at M
          equal to 32 (M over 2 equal to 16, ratio 1.175) and G equal to 44.6694
          at M equal to 64 (M over 2 equal to 32, ratio 1.396). PC-7 asks for a
          factor of 1.5 of M over 2 and accepts both, so the rule CAN see an
          approximate filter and does not read the null there.
        caveat_recorded_against_the_pass: >-
          At M equal to 64 part of the excess over M over 2 is the same upward
          maximum bias measured in J3's null_scale_break, where the random label
          itself reads G minus 1 equal to 3.1202 at that (M, S). So the far-end
          positive control passes with an inflated value, and at the alphabets of
          the failing ladder cells it would read G equal to 0 for the same
          occupancy reason as PTM-A. The control passes at the operating point
          tested and is not robust across the declared grid.
      summary: >-
        PTM-A fails its declared failure signature on the gate arm and survives
        on the certificate arm; PTM-B and PTM-C each meet their failure
        signature. None was recorded not performed.

