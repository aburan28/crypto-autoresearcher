    h2_transfer_sentence:
      plan_item: J3 attack plan item (iv), design condition C7.
      quoted_formal_statement: >-
        Let F be a declared filter family and G_n(F) its measured level-1 bucket
        gain at M equal to N^(1/3) on the Koblitz cell of degree n. If G_n(F)
        minus 1 lies within the random-label bootstrap spread and is
        non-increasing in N over n in 19, 23, 29, 31, then G_131(F) minus 1 is
        of order N^(-c) for some c greater than 0 at n equal to 131, that is, no
        usable gain. THIS IS A HEURISTIC OF TRANSFER, NEVER A BOUND, and the
        extrapolation distance is about 100 bits of N from 12 bits of measured
        range.
      stated_as_a_bound_anywhere: >-
        NO. The phrase "never a bound" appears in the heuristic itself, in
        EXP-BINSTD-de9678 scale_relevance, and in EXP interpretation_limits, and
        the extrapolation distance is stated numerically in each. C7 is met on
        this point and the honesty here is better than the program's average.
      objections: J3-OBJ-2 and J3-OBJ-3, below, which attack the CONTENT of the
        heuristic rather than its labelling.

    provenance_C5:
      wagner_2002:
        reached: true
        provenance: retrieved
        version: >-
          The CRYPTO 2002 proceedings copy of the EXTENDED ABSTRACT, from the
          IACR archive. Title page reads "A Generalized Birthday Problem
          (extended abstract), David Wagner, University of California at
          Berkeley"; running heads confirm pagination from 288. Text recovered
          with this reviewer's own zlib and text-operator extractor, 62847
          characters, because no PDF tool is installed in the container.
        verbatim_on_the_accounting: >-
          "At internal nodes of height h, we use the join operator (join at
          l_h) (where l_h = hn/(1 + lg k)), except that at the root we use the
          full join operator" and "we will obtain an algorithm for the k-sum
          problem that requires O(k * 2^(n/(1+lg k))) time and space and uses
          lists of size O(2^(n/(1+lg k)))" and, for four lists, "the k-sum
          problem can be solved in O(2^(n/3)) time using lists of size
          O(2^(n/3))".
        comparison_with_the_contract: >-
          THE RE-DERIVATION IS FAITHFUL. The design's L equal to N^(1/(j+1))
          with k equal to 2^j is the source's list size 2^(n/(1+lg k)), since
          1 plus lg k equals j plus 1; the design's per-attempt cost k times L
          is the source's O(k times 2^(n/(1+lg k))). The producer re-derived
          under impediment IMP-WAGNER what the source in fact says, and this
          reviewer confirms it at source. That is a real result for the
          producer and is recorded as such.
        two_deltas_now_visible_at_source:
          - >-
            MEMORY. The source states that for k much greater than 2 the tree
            can be evaluated in postfix order, "we will need storage for only
            about lg k lists". The design charges k lists of L points. At k
            equal to 16 the design's memory column is therefore about 2 bits
            ABOVE the source's own optimised figure, so the counterfactual
            ceiling is presented as more memory-expensive than the source
            requires. The direction is conservative and does not flatter the
            ceiling, which is the right direction for a ceiling, but C7 asks for
            memory beside time and a later reader should know which convention
            the figure uses.
          - >-
            NESTING. The source's joins constrain l_h equal to h times n divided
            by (1 plus lg k) CUMULATIVE bits at height h on one coordinate, so
            the constraints NEST. The design's model asks only for "an
            alphabet-M filter available at each internal level". The per-level
            INCREMENT agrees, so the arithmetic is unaffected; but the source's
            construction needs a nested chain of quotients, a strictly stronger
            structural demand than the design states. Again the weaker demand
            makes the ceiling more generous, which is the correct direction for
            a ceiling, and it strengthens rather than weakens the certificate's
            relevance.
      fong_hankerson_lopez_menezes:
        reached: in part
        provenance: retrieved_in_part
        version: >-
          IEEE Transactions on Computers, Volume 53, Number 8, August 2004,
          pages 1047 onward, "Field Inversion and Point Halving Revisited",
          Fong, Hankerson, Lopez, Menezes, from a university-hosted copy. The
          contract cites the work as (2003), which is the Waterloo CORR 2003-18
          technical-report form of the same paper; the two year labels are the
          report and the journal, not a citation error.
        what_was_read: title, authors, abstract, index terms, Section 1 and the section roadmap.
        what_was_NOT_read: >-
          THE HALVING MATHEMATICS OF SECTION 3. The trace condition, the
          quadratic in lambda and any lemma numbering were NOT reached: the
          fetch returned only through page 1048 and this reviewer's extractor
          recovered 14222 characters in which Section 3 is glyph-encoded in
          subset fonts it cannot decode. Searches for the trace notation
          returned nothing. THE CRITERION WAS THEREFORE NOT VERIFIED AT SOURCE
          and IMP-FHLM stands, now with a narrower boundary: the paper is
          reachable, its Section 3 text is not machine-readable by the tools in
          this container.
        provenance_delta_worth_recording: >-
          The retrieved abstract and Section 1 state that the technique is "the
          point halving technique of Knudsen and Schroeppel", that the method
          "was proposed independently by Knudsen [11] and Schroeppel [22]", and
          that "Most of the material in Sections 3.1, 3.2, and 3.3 is from [11]
          and [23]". So the nearest ORIGINATING published statement of the
          criterion is Knudsen and Schroeppel, not this paper. A later
          citation-promotion record should name them rather than promoting this
          entry alone.
      halving_criterion_rederived_from_the_group_law:
        performed: true
        by: this reviewer, independently, in its own code, with no fixture used in that script
        derivation: >-
          Doubling gives x(2P) equal to lambda squared plus lambda plus a with
          lambda equal to x1 plus y1 over x1, so Q is a double exactly when
          lambda squared plus lambda equal to x(Q) plus a is solvable. The map
          z to z squared plus z is F_2-linear with kernel the two elements 0 and
          1, so its image has index 2, and the trace of z squared plus z is 0,
          so the image is exactly the trace-zero hyperplane. Hence Q lies in 2E
          exactly when Tr(x(Q)) equals Tr(a).
        exhaustive_verification: >-
          At n equal to 13 and n equal to 17, for a equal to 0 and a equal to 1
          with b equal to 1, every affine point was classified both by
          membership in the image of doubling and by the trace criterion.
          Agreement on all 8011, 8373, 130971 and 131173 points respectively,
          ZERO disagreements, and the index of 2E in E is exactly 2 in all four
          cases. The REVERSED criterion agrees on 0 points of any of the four
          curves, so the direction is not a matter of convention.
        incidental_confirmation: >-
          The exhaustive point count at n equal to 17 with a equal to 0 returned
          130972 equal to 4 times 137 times 239, reproducing the composite-cell
          order the record carries as an input, by a route independent of the
          Lucas recurrence. This is offered as a pointer for the setup step and
          is NOT an admission verdict, which is not this reviewer's joint.
        verdict: >-
          THE CONTRACT IS RIGHT. The direction stated in all three files, and the
          refusal to relay it through IDEA-20260922-1b16d7, are vindicated by an
          independent derivation and an exhaustive check. C5's accepted
          alternative is genuinely discharged.

