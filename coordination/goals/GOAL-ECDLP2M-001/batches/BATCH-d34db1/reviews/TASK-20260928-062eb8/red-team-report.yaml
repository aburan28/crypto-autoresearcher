        whether the rule catches it and reports it as a controlled null.
      construction: >-
        A filter with a binomial marginal and ZERO propagation content by
        construction, which is the strongest form of the object OC-1 names: h is
        a RANDOM function of the point (so no arithmetic relation between h(P),
        h(Q) and h(P plus Q) exists at all) whose bucket probabilities follow
        Binomial(M minus 1, one half) at M equal to 16, giving a heaviest bucket
        of probability 0.196381 against a uniform 0.0625. Group Z/130972 in a
        cyclic model, S equal to 2^16 ordered pairs, seed 11, artifact keyed
        deterministically per point. Full script and raw output in
        computations.json.
      measured:
        G_direct: 4.051948
        G_after_the_contract_shuffle: 4.051948
        G_after_a_histogram_preserving_shuffle: 4.171429
        predicted_M_times_p_max: 3.1421
        random_label_null_at_the_same_M_and_S: >-
          G equal to 2.032787, 95 percent percentile interval 2.241245 to
          2.814070 over 40 resamples, width 0.572825
        artifact_excess_in_null_widths: 5.33
      the_shuffle_rules_reading_of_it: >-
        THE RULE LABELS THE ARTIFACT AN ARTIFACT, AND FOR THE WRONG REASON. The
        contract rule preserves the artifact exactly (4.051948 to 4.051948), so
        by CTL-SHUFFLE and outcome row ART the arm is recorded as a controlled
        null. That is the right label. But the same rule preserves a GENUINE
        reading exactly as well, so the label carries no information: the rule
        did not detect marginal skew, it declined to destroy anything. A
        histogram-preserving shuffle, which is what OC-1 and RT-EXP-1 describe,
        separates the two cleanly in the same computation: it PRESERVES this
        artifact (4.05 to 4.17, as it must, the artifact being marginal-only)
        and DESTROYS an exact filter (4.000000 to 1.052267).
      consequence_for_OC1: >-
        OC-1 is the collision this design exists to separate, and its separator
        is declared mandatory and blocking on every arm. As committed, the
        separator has zero discriminating power, so the documented false
        positive that tripped the prime-field round (popcount and digit-sum in
        KN-FIND-ffe1df RT-EXP-1) would be reproduced here in the sense that
        every arm, true or false, receives the same verdict.

    shuffle_break:
      id: J3-BREAK-1
      severity: breaking
      object: >-
        EXP-BINSTD-de9678 definitions.matched_marginal_shuffle (the rule) and
        the function matched_marginal_shuffle of FIXTURE-B1 in the audit sheet
        (the implementation), together with pass criterion PC-6, invalidation
        rule IR-6, control CTL-SHUFFLE and stopping rule SR-4 clause 3.
      the_algebraic_fact: >-
        G is INVARIANT under any relabelling of the alphabet. If pi is a
        bijection of the alphabet and h-prime equals pi composed with h, then
        Pr[h-prime(P plus Q) equal to c given h-prime(P) equal to a and
        h-prime(Q) equal to b] equals Pr[h(P plus Q) equal to pi-inverse(c)
        given h(P) equal to pi-inverse(a) and h(Q) equal to pi-inverse(b)], and
        the triple map is a bijection of the index set, so the maximum over
        triples is THE SAME NUMBER. Hence G(h-prime) equals G(h) exactly, for
        every h, every sample and every M.
      why_the_committed_code_is_such_a_relabelling: >-
        The committed function computes each BUCKET's marginal count, groups
        BUCKET LABELS by equal count, and permutes labels within each group,
        returning h2(P) equal to perm[h(P)]. That is exactly pi composed with h.
        Moreover, whenever two buckets have distinct observed marginal counts,
        which is the generic case and is certain for the M equal to 2 control h2
        in any sample with unequal bucket counts, every group is a singleton and
        pi is the IDENTITY MAP.
      why_the_PROSE_rule_does_not_rescue_it: >-
        The specification prose says to group POINTS into equal-marginal classes
        and permute h's values within each class. Points sharing a bucket share a
        marginal, so a class is a union of buckets of equal marginal size; when
        the bucket marginals are distinct each class is a single bucket and
        permuting values within it changes nothing. So the prose, read strictly,
        is also non-destructive on the exact controls. This is a defect of the
        RULE and not only of the code, which matters because a fix that only
        repairs the code would leave the contract's own definition wrong.
      measured_demonstration: >-
        Exact filter h(x) equal to x mod 4 on Z/130972, S equal to 2^16: G equal
        to 4.000000 direct, G equal to 4.000000 after the contract shuffle, and
        the shuffle verified to be the identity map on that arm. PC-6 asks the
        shuffled reading to fall below 1 plus the null width; it reads 4.000000.
        The reviewer's histogram-preserving shuffle on the same arm reads
        1.052267 and passes PC-6.
      consequences:
        - >-
          PC-6 IS UNSATISFIABLE on every cell, so IR-6 fires -- "The
          matched-marginal shuffle does not destroy an exact control's reading.
          The shuffle is not functioning as a null and every Stage 2 arm on that
          cell is invalid." The contract as committed voids its own measurement
          before it reads anything.
        - >-
          SR-4 clause 3 (G_shuffle minus 1 below the null width) is
          unsatisfiable jointly with clause 1 (G minus 1 at least three null
          widths), because G_shuffle equals G. The pre-registered LEAD branch is
          therefore UNREACHABLE by construction, which means the contract cannot
          reach the outcome its own hypothesis calls the most valuable one, and
          its null prediction is unfalsifiable on the tested range in the one
          direction that matters.
        - >-
          Every exact control (h2, h4, the composite alphabets) is simultaneously
          required to read its exact value by PC-3 to PC-5 and to lose it under
          the shuffle by PC-6. Under a label permutation both cannot hold.
      cheapest_remedy: >-
        Define the shuffle as a HISTOGRAM-PRESERVING RESAMPLING ACROSS POINTS:
        collect the multiset of h-values over the sampled support and reassign
        them to points uniformly at random under a recorded seed, so every bucket
        keeps its exact size and every arithmetic relation is destroyed. Then pin
        it with a criterion the rule can fail: h2 must collapse to within the
        null width, and a planted marginal-only filter must be preserved. Both
        behaviours are exhibited in computations.json. The repair is a
        ten-line change to one function plus one sentence of the definition, and
        it is a protocol amendment under IR-16 rather than a redesign.

    null_scale_break:
      id: J3-BREAK-2
      severity: breaking for the gate, and it is a cost finding as well
      object: pass criterion PC-2, control CTL-RANDLABEL, invalidation rule IR-2
      what_the_contract_predicts: >-
        The random label reads 1 plus a term of order M to the minus one half,
        inside its own bootstrap interval, with G minus 1 at most 4 times M to
        the minus one half. That width is then the reference for every threshold
        in the contract.
      what_the_statistic_actually_does: >-
        G is M times a MAXIMUM over about M cubed empirical cell frequencies,
        each estimated from about S divided by M squared draws. Its null scale is
        therefore about the square root of (M cubed divided by S), times the
        square root of (6 times the natural log of M) for the maximum. That
        depends on S, not on M alone, and the contract's allowance agrees with it
        only when S is of order M to the fourth power.
      measured_on_a_null_object_of_the_same_shape:
        cell: Z/130873 with a random label, which is CELL-Z's own shape
        rows:
          - {M: 32, S: 2^20, G_minus_1_measured: 0.8612, predicted: 0.8061, allowed_by_PC2: 0.7071, verdict: FAILS}
          - {M: 64, S: 2^20, G_minus_1_measured: 3.1202, predicted: 2.4977, allowed_by_PC2: 0.5000, verdict: FAILS}
          - {M: 256, S: 2^20, G_measured: 0.0, cells_used: 0, verdict: FAILS}
          - {M: 1024, S: 2^18, G_measured: 0.0, cells_used: 0, verdict: FAILS}
        bootstrap_at_the_primary_operating_point: >-
          M equal to 64, S equal to 2^20, 40 resamples: 95 percent interval
          5.4363 to 6.9818, which EXCLUDES 1. The plug-in G equal to 4.1202 sits
          BELOW its own interval, because the percentile bootstrap of a maximum
          statistic is not centred on the plug-in value. So PC-2's first clause
          is not merely failed, it is the wrong instrument for this estimator.
      the_mechanism_and_why_it_matters: >-
        The M to the minus one half scale is the scale of the BUCKET-AVERAGED
        agreement, not of the maximum. KN-FIND-ffe1df records that substitution
        as the hole that withdrew its own headline: "Every theorem here bounds
        the wrong quantity... max_c pi_c >= delta... The closure therefore bounds
        a lower bound on the attacker's rate." The prime-field round was broken
        by confusing the average with the maximum, and this contract imports the
        AVERAGE's null scale as the calibration for a MAXIMUM statistic. That is
        the same confusion in a new place, and it is why the gate cannot pass.
      consequence: >-
        At the design's own primary cell and alphabet the random label fails
        PC-2, and IR-2 then says "that (cell, M) is invalid; nothing on it is
        read, because the null width is the reference for every threshold." Where
        the conditional table is too sparse instead, G reads exactly 0 and 1 is
        again outside the interval. Both regimes fail. Every declared (cell, M)
        pair in the contract falls in one regime or the other.
      cheapest_remedy: >-
        Delete the closed-form clause and calibrate the null from the
        random-label arm's own measured distribution per (cell, M), which the
        contract already computes; state PC-2 as a comparison of the family arm
        against that measured distribution rather than against 4 times M to the
        minus one half; and require S of order M to the fourth power wherever a
        closed-form check is wanted.

    lead_threshold_analysis:
      clause_1: >-
        G minus 1 at least 3 times the random-label bootstrap width at
        M equal to N^(1/3) on every admitted prime-l cell. PARTLY PROTECTED,
        because it is relative to a measured width; but the width itself is the
        width of an upward-biased maximum, so it is wide, which makes clause 1
        conservative rather than wrong.
      clause_2: >-
        Fitted slope of log(G minus 1) in log N at least 0 with its interval
        excluding negative values. SATISFIED BY THE INSTRUMENT ALONE. The null
        value of G minus 1 grows with the square root of M cubed over S, and M
        grows with N along the ladder while S is constant and then falls at
        n equal to 31, so a RANDOM LABEL has a strongly positive slope. A clause
        meant to detect a signal that fails to decay is satisfied by the
        estimator's own occupancy scaling.
      clause_3: >-
        G_shuffle minus 1 below the null width. UNSATISFIABLE jointly with
        clause 1 (see shuffle_break).
      finding: >-
        The threshold is pre-registered exactly as C1 requires and matches the
        plan word for word. It is nonetheless not a threshold: one clause cannot
        be met, one is met automatically, and the third is the only one carrying
        information. This is the answer to the plan's question about whether the
        reporting rules catch the artifact that fooled the prime-field round.

