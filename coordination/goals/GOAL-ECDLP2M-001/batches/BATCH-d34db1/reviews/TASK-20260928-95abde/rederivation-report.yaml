  Q4:
    name: m = 5 crossing window in the oracle excess g
    tolerance_from_card: 1 bit on each endpoint; 0.2 on the critical g
    definitions_used: |
      m = 5 and B = B_cap(5), log2 B = 27.5814 (Q1). C = 2^(B5 + g).
      T_shared(C) = 1.58 * B * C + 5 * B^2, every term kept.
      IC(L) = T_shared(C) + 1.6 * L * C.
      rho_multi(L) = R * sqrt(L), log2 R = 60.8090 (Q5).
      W(B5, g) = the set of L >= 1 with IC(L) < R * sqrt(L).
    method: |
      Put x = sqrt(L), A = T_shared(C), b = 1.6 * C. Then IC(L) < R sqrt(L)
      is b x^2 - R x + A < 0. Real solutions exist iff the discriminant
      D = R^2 - 4 A b is positive, and then exactly for x_minus < x < x_plus
      with x = (R -/+ sqrt(D)) / (2 b) (sympy returns the same roots). The
      real set is the open interval (x_minus^2, x_plus^2) intersected with
      L >= 1. The lower root was evaluated both as (R - sqrt(D)) / (2 b) and
      in the cancellation-free form A / (b x_plus); they agree to better than
      1e-53 relative in every nonempty case. The integer set is the set of
      integers strictly inside the interval; its extreme members were
      confirmed by evaluating the inequality itself at L_min, L_min - 1,
      L_max and L_max + 1 (all boundary checks passed). IC(L) is strictly
      increasing in C at every L, so W shrinks monotonically as g grows, and
      the critical g is the unique g at which D = 0. It was obtained in
      closed form as the positive root of
        4 * 1.6 * 1.58 * B * C^2 + 4 * 1.6 * 5 * B^2 * C - R^2 = 0
      (sympy gives the same expression), so C* does not depend on B5 and
      g_crit(B5) = log2 C* - B5; it was confirmed by a 220-step bisection on
      the sign of D in g and by evaluating W at g_crit -/+ 1e-6. Path 2
      (decimal) and the float64 pass reproduce every four-decimal value.
    endpoint_convention: |
      For a nonempty set two pairs are given. real_lower_log2 and
      real_upper_log2 are log2 of the endpoints of the real interval, the
      lower one clipped at L = 1 when the root is below 1 (only at
      B5 = 32.4, g = 0, where the root is 0.98, log2 = -0.0288).
      int_lower_log2 and int_upper_log2 are log2 of the smallest and largest
      integer L in the set, with those integers. The set is open, so the
      real endpoints themselves are not members.
