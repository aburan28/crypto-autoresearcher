  Q1:
    name: exact filter capacity
    tolerance: exact
    depends_on_isomorphism_type: false
    structural_fact_in_own_words: |
      For a finite abelian group G, an exactly sum-compatible map h from G onto a
      set of size M exists if and only if M divides |G|. Its fibres are then the
      cosets of a subgroup H of order |G|/M and the alphabet with f is a group
      isomorphic to G/H.
    argument: |
      Notation. G is a finite abelian group of order n, written additively. h maps
      G onto a set S with |S| = M, and f maps S x S to S with h(P + Q) =
      f(h(P), h(Q)) for all P, Q in G.

      Step 1, the fibres of h are the cosets of a subgroup. Put H = {P in G : h(P)
      = h(0)}. Then 0 is in H. If P and Q are in H then h(P + Q) = f(h(P), h(Q)) =
      f(h(0), h(0)) = h(0 + 0) = h(0), so P + Q is in H; a nonempty subset of a
      finite group that is closed under the operation is a subgroup, because the
      multiples P, 2P, 3P, ... of an element P of H stay in H and return to 0, so
      the inverse of P is one of them. For arbitrary P, Q: if h(P) = h(Q) then
      h(P - Q) = f(h(P), h(-Q)) = f(h(Q), h(-Q)) = h(Q - Q) = h(0), so P - Q is in
      H; conversely if P - Q is in H then h(P) = h((P - Q) + Q) = f(h(P - Q),
      h(Q)) = f(h(0), h(Q)) = h(0 + Q) = h(Q). Hence h(P) = h(Q) exactly when P
      and Q lie in the same coset of H. Because h is onto, M is the number of
      cosets, n/|H|, which divides n. This step uses only that f is one
      well-defined map; invertibility is not used.

      Step 2, the alphabet is forced to be the quotient group. The map sending the
      coset P + H to h(P) is well defined and injective by step 1 and onto because
      h is, so it is a bijection from G/H to S, and along it f is the addition of
      G/H: f(h(P), h(Q)) = h(P + Q) is the image of (P + H) + (Q + H). So (S, f)
      is a group isomorphic to G/H, and f is invertible in each argument
      automatically. The invertibility clause of the definition adds no
      restriction.

      Step 3, every divisor occurs. Claim: a finite abelian group of order n has a
      subgroup of every order d dividing n. Induction on n; d = 1 is the trivial
      subgroup. Otherwise pick a prime p dividing d. First, G contains an element
      of order p: take any nonzero a, of order m; if p divides m then (m/p)a has
      order p; if not, p divides the order n/m of the quotient of G by the
      subgroup generated by a, which is smaller than n, so by induction that
      quotient contains a coset of order p represented by some b; the order t of
      b in G is then a multiple of p and (t/p)b has order p. Let K be the
      subgroup generated by such an element, of order p. G/K is abelian of order
      n/p, and d/p divides n/p, so by induction G/K has a subgroup of order d/p;
      its preimage in G is a subgroup of order (d/p)p = d. Now for a divisor M of
      n take a subgroup H of order n/M; the quotient map from G onto G/H, with f
      the addition of G/H, is onto a set of size M, is exactly sum-compatible,
      and its f is invertible in each argument.

      Conclusion. The alphabet sizes M admitting an exactly sum-compatible onto
      map are exactly the positive divisors of |G|. The set depends on |G| alone
      and not on the isomorphism type; only the number of such maps for a given
      M (the number of subgroups of order |G|/M) varies with the type. The
      capacity below X is log2 of the largest divisor of |G| strictly smaller
      than X.
    corroboration: |
      Script q1_bruteforce_small_groups.py enumerated every set partition of every
      finite abelian group of order at most 10 (all 14 isomorphism types) and
      tested exact sum-compatibility directly from the definition. In every group
      the set of block counts M admitting a compatible partition equalled the
      divisor set of the order, every compatible partition was the coset
      partition of a subgroup, the induced f was invertible in each argument
      every time, and the number of compatible partitions with M blocks equalled
      the number of subgroups of order n/M found by an independent enumeration of
      subsets. Divisor sets of the two control orders were computed by trial
      division and again from the factorisation, and agreed.
    per_group:
      primary:
        order: "4l = 2722258935367507707729280517973639940516"
        factorisation: "2^2 times l, with l prime (verified)"
        isomorphism_types: "two: Z/4 x Z/l (cyclic) and Z/2 x Z/2 x Z/l; the set below is the same for both"
        admissible_M_description: "the six divisors of 4l"
        admissible_M:
