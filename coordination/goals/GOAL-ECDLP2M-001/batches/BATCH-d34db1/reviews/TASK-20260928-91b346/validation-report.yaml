          R k L plus k R^2, memory k L x 17 bytes, rho equal to
          sqrt(pi l / (4 x 131)) equal to 2^60.809037. log2(262) equal to
          8.033423, log2(17) equal to 4.087463.
        entries_recomputed_log2:
          k8_without_orbit: {relations: 32.2500, main_term: 67.5000, linear_algebra: 67.5000, total: 68.5000, margin_vs_rho: 7.6910}
          k8_with_orbit: {relations: 24.2166, main_term: 59.4666, linear_algebra: 51.4332, total: 59.4721, margin_vs_rho: -1.3370}
          k16_without_orbit: {relations: 25.8000, main_term: 55.6000, linear_algebra: 55.6000, total: 56.6000, margin_vs_rho: -4.2090}
          k16_with_orbit: {relations: 17.7666, main_term: 47.5666, linear_algebra: 39.5332, total: 47.5721, margin_vs_rho: -13.2370}
          k4_and_k32: recomputed as well; all entries agree with the contract to the same precision
          memory_bytes_log2: {k8: 39.3375, k16: 33.8875, k16_in_GiB: 14.80}
          entries_label: >-
