            prediction or an outcome, here or in the contract.
        comparison_to_contract: >-
          Largest absolute difference over the relations, main-term,
          linear-algebra, total and margin entries of all eight (k, orbit) rows
          is 6.4e-5 bit, far inside 0.5 bit. The L, per-attempt, memory,
          needed-alphabet columns reproduce to below 1e-4 bit. The gap column
          reproduces the contract's arithmetic (25.8000 minus 2.0000 equal to
          23.8000) but see DEV-J1-1.
      - id: C-J1-6
        title: the k equal to 8 reconciliations
        result: >-
          DC-B1: under the stated model, relations with orbit unknowns are
          32.2500 minus 8.0334 equal to 24.2166; the record's 24.7 is 0.4834 bit
          higher. The reconciled downstream figures 59.4666, 51.4332 and 59.4721
