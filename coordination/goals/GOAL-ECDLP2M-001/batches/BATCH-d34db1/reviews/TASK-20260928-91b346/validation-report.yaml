    deviations:
      - id: DEV-J1-1
        severity: material, the breaking artifact of this joint
        kind: model consistency and labelling of derived design figures (design condition C2); not a mathematical result
        fields:
          - proof-search-map-audit.yaml stage_0.ideal_tree_table.rows[k=4,8,16,32].gap_against_exact_capacity_bits
          - proof-search-map-audit.yaml stage_0.ideal_tree_table.closure_line.at_k_16 and .reading
          - proof-search-map-audit.yaml stage_0.gap_statements.per_level_gap_at_k_16_bits and .per_level_gap_step
          - H-BINSTD-0126fe.yaml statement paragraph (C), the sentences giving the 23.80-bit gap and the 2^101.20 closure cost
          - H-BINSTD-0126fe.yaml predictions[per_level_alphabet_gap_and_closure_cost_at_k_equal_16] and asymptotic_claim.time_exponent
          - EXP-BINSTD-de9678 outcomes.rows[CEIL] (the 23.80-bit gap and 2^101.20 sentences) and metrics.secondary[per_level_alphabet_gap]
        finding: >-
          The gap column and the closure line subtract the exact capacity of
          the FULL-GROUP ambient (2 bits, the certificate's 4l line) from the
          needed alphabet of the TARGET-SUBGROUP ambient (L equal to l^(1/5),
          25.8000 bits at k equal to 16), inside a table whose declared ambient
          is the target subgroup. The certificate's own subgroup line says the
          capacity in that ambient is 0 bits. Recomputed in ONE ambient: in the
          declared subgroup ambient the gap is 25.8000 bits and the closure line
          29.8000 plus 3 x 25.8000 equal to 107.2000; in the full-group ambient
          (N equal to 4l, log2 equal to 131.0000) L is 26.2000, the per-attempt
          cost 30.2000, the gap 24.2000 and the closure line 102.8000, while
          the totals of the k equal to 16 row shift by 0.8 bit and L by 0.4 bit.
          The contract's 23.8000 and 101.2000 correspond to neither. Under the
          table's own declared ambient the gap column differs from the
          consistent value by 2.0 bits in every row (and the closure line by
          6.0 bits), which is the plan's breaking artifact of a table entry
          differing by more than 0.5 bit; read in the full-group ambient the
          gap differs by 0.4 bit but the row's totals differ by 0.8 bit. No
          single ambient reproduces the k equal to 16 row to 0.5 bit in every
          column. Every self-consistent value lies ABOVE the contract's figure,
          so the mixed figure is the more attacker-favourable one and no
          conclusion of the contract depends on it; the figure is a design
          figure with a false antecedent in either ambient.
        what_would_repair_it: state the needed alphabet and the capacity in one named ambient on those lines, or report both ambients side by side, and carry the same into the CEIL row and the hypothesis; nothing else in the table moves.
