        title: HEUR-B1's relayed citation KN-FIND-007, checked at the producer's request
        result: >-
          KN-FIND-007 states, for a base D of B elements in an abelian group of
          order N, that the sum over all targets of the number of size-m
          multisets from D summing to the target is binomial(B + m minus 1, m)
          exactly, by double counting. HEUR-B1 uses the same double count on
          two lists: the sum over all targets of the number of ordered pairs
          (S, T) in L_1 x L_2 with S + T equal to the target is |L_1| |L_2|
