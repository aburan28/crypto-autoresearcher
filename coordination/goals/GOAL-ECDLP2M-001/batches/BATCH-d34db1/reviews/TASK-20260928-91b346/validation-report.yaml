    computed:
      - id: C-J2-1
        title: extraction, syntax check and dry import (review computation)
        result: >-
          yaml.safe_load of the audit sheet at the snapshot commit; the block
          scalars fixture_code.code (663 lines, 20521 bytes, sha256
          122a39a86b26c7909da80cb9a3f6fc83f936186f2dc89047433f223bf4ec81fd) and
          calibration_code.code (134 lines, 4610 bytes, sha256
          5cfec472b642086fbd0ba6f02c66669a73cd031359b0a3417913e16eb00d2667)
          were written verbatim to stage1_gate.py and calibration_rows.py in
          the scratchpad; py_compile passes for both; import succeeds for both
          (calibration_rows imports INF, Curve, GF2n, make_h2 from
          stage1_gate, all present). Neither file contains an exclamation
          mark. Pass criteria PC-1 to PC-14 are stated above the code as the
          sheet says.
      - id: C-J2-2
        title: static read of FIXTURE-B1, what is correct
        result: >-
          Carry-less multiply and reduction, inversion by exponentiation,
          trace, half-trace (n odd) and square root are correct. is_irreducible
          is the Ben-Or form of the Rabin test (gcd for every i up to n/2),
          which is a correct irreducibility test. The group law (negation,
          doubling, addition), the lift by half-trace, in_2E as
          Tr(x) equal to Tr(A), and halve (both roots of lam^2 + lam equal to
          x + A, x1 equal to sqrt(y + (lam + 1) x), y1 equal to x1 (lam + x1),
          checked by re-doubling) are correct. order_lucas is correct for the
          a in 0, 1 Koblitz curves (n equal to 1 gives 4, n equal to 2 gives 8,
          n equal to 131 gives 4l). count_by_trace is correct. is_probable_prime
          is a deterministic Miller-Rabin for every toy order in scope (bases
          to 37 decide primality below 3.3e24). prove_order plus hasse_unique
          is a valid proof of the order (a point of order exactly N and a
          unique multiple of N in the Hasse interval). point_of_order_4 is
          correct. make_h2 is the E/2E quotient. make_h4 multiplies by
          c x odd with c the inverse of the odd part modulo 4, which projects
          onto the 2-Sylow subgroup and reads the logarithm base a point of
          order 4: a surjective homomorphism onto Z/4 with kernel the odd part,
          that is the E/4E quotient. verify_homomorphism is correct.
          exact_filter_from_dlog is the quotient Z/N onto Z/M for M dividing N.
          bucket_gain implements the stated statistic with the MIN_CELL
          exclusion. check_gate implements PC-1 to PC-6 and PC-8 as written.
      - id: C-J2-3
        title: the matched-marginal shuffle as committed leaves G invariant (static proof plus dry call on synthetic integers)
        result: >-
          matched_marginal_shuffle builds a permutation perm of the alphabet
          [M] (a product of permutations within groups of buckets of equal
          sampled frequency) and returns h2 equal to perm composed with h. For
          any bijection perm of the alphabet the map (a, b, c) to
          (perm a, perm b, perm c) is a bijection on triples that carries the
          conditional counts n(a, b, c)/n(a, b) to themselves, so the maximum,
          the used count and the excluded count are identical and
          G(perm o h) equal to G(h) exactly, for every h and every sample. Dry
          call of the fixture's own bucket_gain and matched_marginal_shuffle on
          200000 synthetic integer triples (P, Q, P + Q mod 100003) with
          M equal to 16: the mod-16 label (a near-homomorphism on Z/100003, since 16 does not divide 100003) reads G 8.8571 before and 8.8571
          after; a deliberately skewed label reads 14.9313 before and 14.9313
          after. A point-level shuffle of my own that permutes h's VALUES among
          POINTS of (binned) equal marginal reads 8.914 to 1.553 on the
          homomorphism and 14.902 to 14.852 on the skewed label, which is the
          RT-EXP-1 behaviour the contract describes. With exact equality of
          sampled marginals as the class rule, even a point-level shuffle is
          nearly a no-op (8.857 to 8.426), so the contract's definition
          'equal-marginal classes' also needs a tolerance rule.
      - id: C-J2-4
        title: identity control (PC-1) at the contract's sample size (own code)
        result: >-
