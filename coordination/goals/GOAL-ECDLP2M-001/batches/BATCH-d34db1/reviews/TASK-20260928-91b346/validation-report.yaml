          R equal to L implies R k L equal to k R^2 equal to k L^2; the total is
          therefore exactly one bit above the main term, 68.5000. That is
          ARITHMETIC AND NOT A RELABELLING, and the identity holds for every k,
          which is why every without-orbit total in the table is exactly main
          plus 1.0000. DC-B3 likewise: 55.6000 is the k equal to 16 main term
