    deviations:
      - id: DEV-J2-1
        severity: fatal for the gate; the strongest breaking artifact of this joint
        kind: instrument code defect (not a mathematical result)
        fields:
          - proof-search-map-audit.yaml fixture_code.code, function matched_marginal_shuffle
          - proof-search-map-audit.yaml pass_criteria_stated_before_execution.gate_FIXTURE_B1[PC-6]
