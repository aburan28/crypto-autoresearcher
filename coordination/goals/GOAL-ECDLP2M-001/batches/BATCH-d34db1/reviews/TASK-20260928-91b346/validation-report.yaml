          - proof-search-map-audit.yaml audit_2_observation_collision.collisions_searched_and_named[OC-1].separator
        finding: >-
          The committed shuffle permutes bucket LABELS within groups of equal
          sampled frequency and composes the permutation with h. That is a
          bijective relabelling of the alphabet, under which the bucket-gain
          statistic is exactly invariant for every filter and every sample
          (C-J2-3). Consequences: PC-6 ('the shuffle destroys each exact
          reading') can never pass, so SR-1 stops every cell; CTL-SHUFFLE, the
          blocking separator of OC-1 and the artifact tell the design is
          'aimed straight at', cannot separate anything, since G_shuffle equals
          G on a genuine signal and on a marginal artifact alike. The
          definition in the specification ('permute h's values uniformly
          within each class' of points of equal marginal) describes a
          point-level shuffle, which the code does not implement, and it also
          lacks a tolerance rule for 'equal marginal', without which sampled
          marginals almost never coincide and even a point-level shuffle
          degenerates.
