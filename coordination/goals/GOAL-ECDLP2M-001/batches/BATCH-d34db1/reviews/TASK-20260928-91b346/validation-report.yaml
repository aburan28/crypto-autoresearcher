    computed:
      - id: C-J1-1
        title: the extension of Theorem C to a finite abelian group of composite order, re-derived
        derivation: >-
          Let G be a finite abelian group, h a surjection from G onto a set A of
          size M, and f a rule on A with h(P + Q) equal to f(h(P), h(Q)) for all
          P, Q in G and f invertible in each argument. (1) f is a quasigroup
          operation by definition. (2) f is associative, because for u, v, w in
          A one chooses preimages P, Q, R by surjectivity and reads
          f(f(u, v), w) equal to h((P + Q) + R) equal to h(P + (Q + R)) equal to
          f(u, f(v, w)); this uses surjectivity of h and associativity of
          addition on G only. (3) An associative quasigroup is a group: a finite
          cancellative semigroup has an identity and inverses. (4) h is then a
          surjective group homomorphism G onto (A, f). (5) Lagrange on the
          quotient G/ker(h) gives M dividing the order of G. (6) If h is not
          surjective, f restricted to the image is still a bijection in each
          argument (an injection of a finite set into itself) and the image is
          closed, so the argument runs on the image. THE ONLY STEP IN WHICH THE
          ORDER OF G ENTERS IS (5), AND IT ENTERS AS DIVISIBILITY. Primality is
          used nowhere; it is needed only to read the divisor set off. The
          contract's Steps 1 to 8 (audit sheet stage_0.capacity_certificate)
          say the same and I find no step that needs prime order. Conversely
          every quotient map G onto G/H is exactly sum-compatible, so the
          admissible alphabets are exactly the orders of quotient groups, which
          for a finite abelian group are exactly the divisors of its order.
        machine_check: >-
          Own code (j1_certificate_bruteforce.py, Python 3.11.15, standard
          library): for G in Z/6, Z/8, Z/2xZ/4, Z/2xZ/2xZ/2 (every M from 2 to
          order minus 1) and Z/12, Z/2xZ/6 (M in 2, 3, 4), every surjective map
          h with h(0) equal to 0 was enumerated, tested for exact
          sum-compatibility with a Latin-square combining rule, and each survivor
          checked. Result: exact filters exist exactly at the M dividing the
          order (none at M in 3, 5, 6, 7 on the order-8 groups, none at 4, 5 on
          Z/6), every survivor's f is a group and every survivor's kernel is a
          subgroup of index M. Counts: Z/8 M equal to 4 gives 6 filters with one
          kernel; Z/2xZ/2xZ/2 M equal to 2 gives 7 filters with 7 kernels.
      - id: C-J1-2
        title: the divisor set of 4l below l, written out
        result: >-
          divisors(4l) equal to 1, 2, 4, l, 2l, 4l (sympy 1.14.0); those
          strictly below l are 1, 2, 4; the exact capacity below l is log2(4)
          equal to 2.0000 bits. AMBIENT: the full group of order 4l. On the
          subgroup of order l the divisors are 1 and l, so the capacity below l
          is 0 bits. Controls: divisors of 2^17 below 2^17 are 2^0 to 2^16
          (capacity 16 bits); divisors of 4 x 137 x 239 equal to 130972 are
          1, 2, 4, 137, 239, 274, 478, 548, 956, 32743, 65486, 130972, containing
          548 and 956, with the largest divisor below 239 being 137
          (log2 equal to 7.0980 bits; the contract says about 7.10).
        primality_of_l: >-
          l equal to 680564733841876926932320129493409985129 (130-bit integer,
          log2 equal to 129.0000000000000000000118). sympy.isprime(l) is True;
          that is a BPSW strong-probable-prime test, NOT a proof. The primary
          source inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md (sha256
          519f330a963a226ab875e055df499a08a08f799066178372867ef8d023b4d967 matches
          its recorded digest), Appendix A at line 1096, states this l as the
          order of the prime-order subgroup. factorint(l minus 1, limit 2e6)
          gives 2^3 x 3 x 11 x 109 x 131 x 263 x 32326729 x
          21234899465981031419669 with the last cofactor probable-prime, so a
          Pocklington proof is within reach of a session that wants one; not
          performed here.
      - id: C-J1-3
        title: group orders by two independent integer routes (no curve instantiated)
        result: >-
          Route A, the Lucas recurrence s_0 equal to 2, s_1 equal to minus 1,
          s_(i+1) equal to minus s_i minus 2 s_(i-1), order 2^n + 1 minus s_n
          (own code). Route B, the norm of 1 minus alpha^n in Z[w] with
          w^2 equal to minus w minus 2, by binary exponentiation (own code,
          different algorithm). Both give: n equal to 17, 130972 equal to
          4 x 137 x 239 (s_17 equal to 101, the record's t_17); n equal to 19,
          523492 equal to 4 x 130873 with 130873 prime (s_19 equal to 797, the
          record's t_19); n equal to 23, 8383412 equal to 4 x 2095853 with
          2095853 prime; n equal to 29, 536830604 equal to 4 x 8353 x 16067;
          n equal to 31, 2147574356 equal to 4 x 373 x 1439393; n equal to 131,
          2722258935367507707729280517973639940516 equal to 4l EXACTLY. The
          2-adic valuation is 2 at every n listed. Sanity: n equal to 1 gives 4
          and n equal to 2 gives 8.
        ladder_admission_consequence: >-
          Under the contract's own admission rule AR-B1 (order equal to 4 times
          a prime), CELL-K23 is admissible and CELL-K29 and CELL-K31 ARE NOT.
          The degrees n in 5 to 63 with order 4 times a prime for the a equal
          to 0 curve are 5, 7, 9, 13, 19, 23, 41. Carried to J2 as DEV-J2-6.
      - id: C-J1-4
        title: the 2-Sylow subgroup of the deployed row, proved without instantiating the curve over F_2^131
        result: >-
          By hand: y^2 + xy equal to x^3 + 1 over F_2 has the affine points
          (0, 1), (1, 0), (1, 1), so E(F_2) has order 4; doubling (1, 0) with
          lam equal to 1 gives x3 equal to 0, y3 equal to 1, that is (0, 1),
          the unique point of order 2 (x equal to 0), so (1, 0) has order 4 and
          E(F_2) is cyclic of order 4. E(F_2) is a subgroup of E(F_2^131), whose
          order 4l has 2-part exactly 4, so the 2-Sylow subgroup of E(F_2^131)
          is E(F_2), cyclic of order 4. The unique rational 2-torsion point is
          (0, 1). The contract's statements agree.
      - id: C-J1-5
        title: the ideal k-list ceiling table under the stated model (own code, mpmath 1.3.0 at 30 digits)
        model: >-
          As EXP-BINSTD-de9678 definitions.ceiling_model states it and nothing
          else: N equal to l (log2 N equal to 129.0000), k equal to 2^j lists of
          size L equal to N^(1/(j + 1)), per-attempt cost k L, B equal to L,
