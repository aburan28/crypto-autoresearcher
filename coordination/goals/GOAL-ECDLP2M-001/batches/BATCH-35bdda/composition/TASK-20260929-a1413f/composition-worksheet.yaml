    what_this_says_about_the_prior: >-
      The prior looked at the new machinery (the stratified branch, L2,
      HEUR-B2) and that machinery held. The breaks came from edges the prior
      did not model: stop and invalidation rules whose false-fire rate on the
      contract's own null was never computed (D-1, D-2), a degenerate declared
      arm at one alphabet, and a code-level identity defect in how declared
      arms are named (D-J2-1). The next plan should require a computed
      false-fire rate for every stopping and invalidation rule under the null,
      a degeneracy audit of every declared (arm, cell, M), and an end-to-end
      stage3 dry call over the declared name grid.

