        NEG confirmed (PTM-E, PC-18 dry calls, J3 item ii). L2 is non-decay, and
        an exact-free flat filter at four times the floor reads LEAD 6 of 6; at
        twice the floor it reads ART-RES 6 of 6 because L1 against the
        exact-saturated null raises the effective floor for exact-free arms
