  sd_2_ruling:
    question: >-
      Design computation C-5 (exact_content.synthetic_dry_call) computed bucket
      gains, saturated and uniform null draws, stratified and unstratified
      shuffles and the L1 and L3 clauses on Z/(4 x 2003) and Z/(16 x 2003) at
      M = 16. The specification declares those groups as cells (ISO-K13,
      Z/(4 x 2003) with strata i mod 4, alphabet 16 for PC-18; CELL-ZS16,
      Z/(16 x 2003), alphabet 16 for PC-6c). The audit sheet records C-5 as
      "synthetic only ... no declared cell". Different stream labels were used
      and no declared stream was read.
    facts_checked_by_this_composer:
      - experiments/EXP-BINSTD-c9c8a2/specification.yaml cells.generic_controls lists CELL-ZS16 and ISO-K13 to ISO-O19 by id, and independent_variables lists "the cell (..., CELL-ZS16, CELL-ZS64, the five ISO cells)". By the contract's own text these groups are declared cells.
      - The audit sheet design_computations C-5 output carries a "PC-6c-shape" record (shuffle medians on Z/(16 x 2003), M = 16) and the RR-2 labels XCO1 and XCO2 read with gains, nulls, shuffles, L1 and L3 on Z/(4 x 2003), M = 16, which is the PC-18 reading of ISO-K13 at its lead family alphabet, under another stream label.
      - DEC-20260929-4c7ffc R-PRODUCER-COMPUTE item (5) permitted "dry calls of the shuffle or sampler on synthetic data" and states "no declared cell is measured".
      - The sheet attests that no code string changed after C-1, and C-5 ran after C-1, so no decision rule could have been tuned on the C-5 output.
    ruling: >-
      TB-4 FIRED, under the plan as written. Its condition includes "computed
      the bucket gain, a shuffle, a null draw or any decision clause on a
      declared cell at design time". ISO-K13 and CELL-ZS16 are declared cells
      by the contract's own cells block, and C-5 computed all four kinds of
      quantity on exactly those groups at a declared alphabet. A different
      stream label changes which draws were seen, not which cell was measured:
      an abstract-group cell is its group, strata and alphabet, and the law of
      every reading on it was observed. Reading "declared cell" as "declared
      cell and declared stream" would narrow the tripwire after the fact, which
      CB3-7 forbids. The plan's stated effect applies: K-revise-defect, no
      approval.
    mitigation_recorded_not_used_to_relax: >-
      (a) The code was frozen before C-5 (no code string changed after C-1),
      so no rule was tuned on it. (b) No declared stream was read, so no
      run-time reading of PC-18 or PC-6c has been pre-observed draw by draw.
      (c) The session acted inside the literal text of R-PRODUCER-COMPUTE (5),
      which did not foresee that the producer would declare isomorphism-type
      groups as cells (audit PD-B3-4 item 4); the defect is one of
      specification across three records (that ruling, the plan's J2 attack
      text "synthetic data of a declared cell's shape", and the sheet's "no
      declared cell" sentence), not of conduct. (d) The red team's review
      practice of adjacent non-declared primes (PD-RT-8) is the clean form.
    consequence: >-
      TB-4 adds one defect (RV-6) to a decision that is K-revise-defect on
      independent grounds (J2, J3, J4 breaks). It is not a mathematical
      result and bears on no curve. ISO-K13 and CELL-ZS16 are NOT burned: a
      version-4 contract may keep them, provided its design-time dry calls run
      only on groups that are not declared cells, the sheet's sentence is
      corrected, and the next opening decision's producer-compute ruling names
      the excluded groups.
    review_side_note: >-
      The validator's J2 dry calls also used Z/(4 x 2003) and Z/(16 x 2003)
      (shapes VK13 and VZS16), as the plan's J2 attack plan permitted. TB-4
      binds the producer, not reviewers, so this is not a tripwire event; it
      is recorded because version 4's plan should say "synthetic groups that
      are not declared cells" for reviewers too.

  sd_1_ruling:
    question: >-
      The red-team launch prompt (TASK-20260929-8f2efa) was written after the
      session had read the validator's hand-back and included the J3 line
      "Every arm the contract declares must actually reach each outcome the
      table assigns it, as coded, not only as described". The plan's J3 text
      already names "LEAD branch unreachable ... described one way and coded
      another". Does this bear on the weight of any overlapping finding?
    overlap_found:
      with_D_J2_1: >-
        NONE. No red-team defect is D-J2-1 (arm identity by numeric offset in
        CODE-FAM). The red team's planted-filter and HEUR-B2 dry calls patched
        LADDER, LEAD_ALPHABET and HELD_OUT_TESTS to synthetic names
        (PD-RT-5), which bypasses the naming path, and it reported RR-4
        discharged. Whatever the line carried, it did not transmit the
        finding.
      same_region_findings: >-
        D-5 (SR-3 described one way, stage3 coded another), D-8 (vacuous NEG as
        coded) and D-4 (LEAD reach on the curve-cell path) sit in the region
        the line points to (outcome reachability as coded).
    ruling: >-
      (1) The breaking red-team defects D-1 (SR-6 CD-9) and D-2 (PC-16c with
      IR-23) come from the plan's own J3 attack (i), the rule sweep frozen
      before any reviewer ran, and concern stopping and invalidation rates,
      not arm reachability. They keep full weight. (2) D-5, D-8 and D-4 keep
      their weight as findings about the contract, because each rests on the
      red team's own computation on the committed code, and this composer
      confirmed D-5 and D-8 by reading CODE-FAM stage3. They get NO weight as
      independent corroboration of any validator finding, and no statement of
      the form "two blind reviewers independently found code-versus-text
      defects in stage3" may be made from this round. (3) D-J2-1 is therefore
      a single-reviewer finding, confirmed by this composer by inspection of
      CODE-FAM family_names, offsets and stage3 (not by execution). Its weight
      comes from the code text, not from concurrence. (4) The round's mutual
      blindness held in reads but not fully in setup: one launch prompt
      carried a paraphrase shaped by a sibling report. Recorded as procedure
      deviation PD-C1 of DEC-20260929-585602, with the remedy that review
      launch prompts are written from the plan text before any sibling
      hand-back is read, or stored verbatim with the plan. (5) The ruling does
      not change the key: J2 breaks on D-J2-1, which predates the prompt, and
      J3 breaks on D-1 and D-2.

