                row.update({"D3_recomputed": d3, "D3_mu1_convention": d3 - LOG2(A1)})
            row["pinned_D3"] = PINNED_D3.get(m)
            row["record_mu1"] = RECORD_MU1[m]
            row["relaxation_over_pinned_D3"] = None if m not in PINNED_D3 else tgen - PINNED_D3[m]
            row["relaxation_over_record_mu1"] = tgen - RECORD_MU1[m]
            row["record_mu1_minus_mu1_convention"] = RECORD_MU1[m] - row["D3_mu1_convention"]
            out["rows"][m] = row
        out["m8_candidate_reconstruction_mu2"] = log2_rho - (bcap(8) + 1.0 / 8) - LOG2(attempts(2.0))

        xB5 = bcap(5)
        m5 = {"statement_scope": "B = B_cap(5) only; no m = 5 envelope over B is computed or promised (R-J1-4)"}
        for name, c0 in (("D3_convention", D3_5), ("proposal_convention", PROP_5)):
            m5[name] = {"c0": c0,
                        "critical_g": critical(lambda g, c0=c0: win(5, xB5, c0 + g), 0.0, 20.0),
                        "windows": {str(g): win(5, xB5, c0 + g) for g in G5}}
        m5["closed_form_critical_g_D3"] = ((out["rows"][5]["log2_T_gen"] - D3_5)
                                           + 0.5 * (LOG2(math.pi) - 3.0 - LOG2(A1) - LOG2(kappa(5))))
        m5["L1_log2_IC_over_rho_D3"] = ic1_over_rho(5, xB5, D3_5)
        m5["L1_log2_IC_over_rho_proposal"] = ic1_over_rho(5, xB5, PROP_5)
        m5["tie_budget"] = tie_budget(5, xB5)
        m5["tie_minus_D3"] = m5["tie_budget"] - D3_5
        m5["tie_minus_proposal"] = m5["tie_budget"] - PROP_5
        out["m5"] = m5

        xc = bcap(4)
        m4 = {"sub_cap_slice": {"log2_B": X_SUB, "c0": D3_4,
                                "critical_g": critical(lambda g: win(4, X_SUB, D3_4 + g), 0.0, 40.0),
                                "windows": {str(g): win(4, X_SUB, D3_4 + g) for g in G4_SUB},
                                "L1_log2_IC_over_rho": ic1_over_rho(4, X_SUB, D3_4),
                                "tie_budget": tie_budget(4, X_SUB)},
              "cap_slice": {"log2_B": xc,
                            "critical_log2_C": critical(lambda x: win(4, xc, x), 0.0, 60.0),
                            "closed_form_critical_log2_C": (out["rows"][4]["log2_T_gen"]
                                                            + 0.5 * (LOG2(math.pi) - 3.0 - LOG2(A1)
                                                                     - LOG2(kappa(4)))),
                            "windows": {str(x): win(4, xc, x) for x in X4_CAP}}}
        m4["sub_cap_slice"]["tie_minus_D3"] = m4["sub_cap_slice"]["tie_budget"] - D3_4

        grid = [M4_RANGE[0] + M4_STEP * i for i in range(M4_POINTS)]
        per_B = []
        for xB in grid:
            per_B.append({"log2_B": xB,
                          "critical_log2_C": critical(lambda x, xB=xB: win(4, xB, x), 0.0, 80.0),
                          "windows": {str(g): win(4, xB, D3_4 + g) for g in G4_ENV}})
        env = {}
        for g in G4_ENV:
            ws = [(r["log2_B"], r["windows"][str(g)]) for r in per_B if r["windows"][str(g)] is not None]
            if not ws:
                env[str(g)] = None
                continue
            lo = min(ws, key=lambda t: t[1][0])
            hi = max(ws, key=lambda t: t[1][1])
            srt = sorted(w for _, w in ws)
            reach, contiguous, min_overlap = srt[0][1], True, None
            for w in srt[1:]:
                gap = reach - w[0]
                min_overlap = gap if min_overlap is None else min(min_overlap, gap)
                if w[0] > reach:
                    contiguous = False
                reach = max(reach, w[1])
            env[str(g)] = {"log2_L_lo": lo[1][0], "at_log2_B_lo": lo[0], "log2_L_hi": hi[1][1],
                           "at_log2_B_hi": hi[0], "contiguous": contiguous,
                           "min_overlap_bits": min_overlap, "nonempty_B_points": len(ws)}
        best = max((r for r in per_B if r["critical_log2_C"] is not None),
                   key=lambda r: r["critical_log2_C"])
        m4["envelope"] = {"range_log2_B": list(M4_RANGE), "step": M4_STEP, "points": M4_POINTS,
                          "grid_first": grid[0], "grid_last": grid[-1], "by_g": env,
                          "closing_log2_C": best["critical_log2_C"],
                          "closing_at_log2_B": best["log2_B"],
                          "closing_g": best["critical_log2_C"] - D3_4,
                          "upper_edge_closed_form_g0": 2.0 * (log2_rho - LOG2(retry(4)) - D3_4),
                          "continuum_note": "the continuum union is contiguous at every g below the closing g (audit sheet derivation_notes D-2); the grid flag above is the discrete check",
                          "per_B": per_B}
        out["m4"] = m4

        out["comparator_memory_at_upper_ends"] = {
            "rule": "at least 8 L_hi distinguished-point entries at 34 bytes (overshoot rule)",
            "m5_D3": {str(g): dp_mem(upper(m5["D3_convention"]["windows"][str(g)])) for g in G5},
            "m5_proposal": {str(g): dp_mem(upper(m5["proposal_convention"]["windows"][str(g)])) for g in G5},
            "m4_sub_cap": {str(g): dp_mem(upper(m4["sub_cap_slice"]["windows"][str(g)])) for g in G4_SUB},
            "m4_cap": {str(x): dp_mem(upper(m4["cap_slice"]["windows"][str(x)])) for x in X4_CAP},
            "m4_envelope": {str(g): dp_mem(None if env[str(g)] is None else env[str(g)]["log2_L_hi"])
                            for g in G4_ENV},
            "at_L_2_30": dp_mem(30.0)}
        out["la_constant_sensitivity"] = la_sensitivity(xB5)

        d_inf = delta_inf()
        u_pred = d_inf * d_inf
        N_zn = least_prime_above(1 << 20)
        mu_zn = (2 * ZN_BASE) ** 2 / (2.0 * N_zn)
        h1 = {"tau": -math.expm1(-2.0), "u_touched": (-math.expm1(-2.0)) ** 2,
              "delta_inf": d_inf, "u_pred": u_pred, "N_ZN": N_zn, "mu_ZN": mu_zn,
              "a2_mu1": a2(1.0, u_pred), "a2_ZN": a2(mu_zn, u_pred), "A_ZN": attempts(mu_zn),
              "K_pred_ZN": kp(ZN_BASE, mu_zn, u_pred), "K_pred_nominal": kp(512, 1.0, u_pred),
              "sigma_ZN_L_IC": sig(kp(ZN_BASE, mu_zn, u_pred), L_IC),
              "sigma_ZN_L_NULL": sig(kp(ZN_BASE, mu_zn, u_pred), L_NULL),
              "sigma_nominal_L_IC": sig(kp(512, 1.0, u_pred), L_IC),
              "sigma_nominal_L_NULL": sig(kp(512, 1.0, u_pred), L_NULL),
              "delta_half_B128": 3.3 * S_DELTA / math.sqrt(128),
              "delta_half_B512": 3.3 * S_DELTA / math.sqrt(512),
              "single_acceptance_mu1": 1.0 / ((-math.expm1(-1.0)) * u_pred),
              "dp_bits": {"CTRL-ZN": dpb(N_zn), "BIN-ORD-19": dpb(261823), "BIN-KOB-19": dpb(130873)},
              "dp_bits_note": "binary orders 2 x 261823 and 4 x 130873 are pointers; recomputed and proved at setup"}
        out["validation_arity"] = h1

        ks = [sum(math.comb(2 * t, t) / 4 ** t for t in range(L)) / math.sqrt(L) for L in L_RHO]
        out["kuhn_struik"] = {"L": list(L_RHO), "c_L": ks,
                              "model_exponent_rho": -0.5 + slope([LOG2(L) for L in L_RHO],
