        checks = []

        def chk(name, got, want, tol):
            if want is None or got is None:
                ok = want is None and got is None
            elif isinstance(want, bool):
                ok = got == want
            else:
                ok = abs(got - want) <= tol
            checks.append({"name": name, "computed": got, "design": want, "tol": tol, "ok": ok})

        def chkw(name, got, want):
            if want is None or got is None:
                chk(name, got, want, 0.0)
            else:
                chk(name + ".lo", got[0], want[0], 1.0)
                chk(name + ".hi", got[1], want[1], 1.0)

