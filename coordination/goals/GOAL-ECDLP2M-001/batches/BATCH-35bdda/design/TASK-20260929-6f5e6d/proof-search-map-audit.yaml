  # ---------------------------------------------------------------------------
  rule_by_rule:
    rule: >-
      R2-J3-1 and DA3-3. Every invalidation, stopping and admission rule of
      EXP-BINSTD-8cb697, applied (a) to the contract's own declared metrics
      (the figures the committed program itself computes and reports, under
      any data) and (b) to the modal pattern P1 (every cell at its model
      expectation; outcome_reachability P1), with the outcome that results.
      A rule that fires on (a) or (b) would void, confine or reroute the
      modal pattern and is a design defect. Model probabilities are design
      figures (g1_calibration; the C-4 Monte Carlo supersedes the
      normal-approximation values when relayed).
    stopping_rules:
      - id: RB-S0
        rule: S0, stage0.py exits non-zero on any DESIGN disagreement or failed self-check
        evaluated_by: stage0_code main (exit status)
        own_metrics: >-
          Does not fire. Stage 0 is data-independent. The DESIGN table and the
          arithmetic are carried value-identical from version 2, whose
          committed stage0.py passed S0 by review dry import (140 of 140
          DESIGN comparisons, 10 of 10 self-checks; TASK-20260929-45204f J2
          item i). Version 3 changes only the guard and adds prints with no
          new comparison (constants_delta CD3-1, CD3-2). C-3 (the version-3
          stage0.py through its __main__ entry): exit 0, S0_pass true, 140 of
          140 comparisons ok, 10 of 10 self-checks true, failed_comparisons
          empty.
        modal_P1: not applicable (data-independent); the run proceeds to Stage 1.
        if_fired: RUN-ARTIFACT (design defect referred to the Coordinator).
      - id: RB-S1
        rule: S1, no binary cell is read before G1 passes
        evaluated_by: the driver's order of execution; IR-1 flag into run_validity
        own_metrics: not a test of any metric; it orders the stages.
        modal_P1: G1 passes with model probability 0.99425 (C-4); Stage 2 starts.
        if_fired: RUN-ARTIFACT through G1 (S2).
      - id: RB-S1b
        rule: S1b (new), Stage 2 does not start until impl-provenance.json lists every I3 to I5 file with the sha256 recorded in the execution batch's snapshot receipt
        evaluated_by: the driver before Stage 2; IR-6 flag
        own_metrics: not a test of any metric.
        modal_P1: satisfied by the execution batch's snapshot; not fired.
        if_fired: no Stage 2; RUN-ARTIFACT through IR-6 if a run proceeds regardless.
      - id: RB-S2
        rule: S2, Stage 1 runs binstd_core.py to completion; a failed G1 ends the run with fixture.json preserved
        evaluated_by: fixture_code stage1 (exit status) and g1_checks
        own_metrics: >-
          Does not fire by construction of the code; it is the consequence of
          G1, whose conjuncts are rows RB-G1a to RB-G1i.
        modal_P1: G1 passes (0.99425 under the model, C-4); not fired.
        if_fired: RUN-ARTIFACT.
      - id: RB-S3
        rule: S3, a cell halts at a failed admission rule (AR-ORDER, AR-MU, AR-FIELD, AR-CURVE, AR-ORACLE); the other cell continues
        evaluated_by: stage2_outcome from the admission flags (a missing flag halts)
        own_metrics: >-
          DEFECT FOUND AND FIXED BY THIS SWEEP. Version 2's AR-ORDER computed
          #E "by the trace count and the naive count"; the CERTBIN
          count_naive routine "enumerate[s] all (x, y) pairs (small fields
          only)", 2^38 pairs at n = 19, infeasible within the per-run wall
          clock, so as written every run would have ended at S4 or IR-8 with
          both binary cells INCOMPLETE, that is NOT-VALIDATED on every run.
          Version 3 replaces the naive count by the Hasse-interval certificate
          (E definitions.cells; D-14). AR-MU: the nominal |F| of about 1024
          gives mu_c about 1.0, inside [0.5, 2]. AR-FIELD, AR-CURVE and
          AR-ORACLE pass for correct instruments; none tests a scientific
          quantity.
        modal_P1: not fired (correct instruments; mu_c about 1).
        if_fired: the cell reads INCOMPLETE on both axes; contract NOT-VALIDATED (never NEGATIVE).
      - id: RB-S4
        rule: S4, the run ends at the wall-clock ceiling (21600 s) with partial artifacts preserved
        evaluated_by: the driver; halted flag into stage2_outcome (IR-8)
        own_metrics: >-
          Not expected to fire: the advisory estimate is minutes on CTRL-ZN and
          minutes to about an hour per binary cell (largest item the
          BIN-ORD-19 null arm, about 2^24 root solves), plus about 530 audit
          attempts per binary cell at about |F| = 1024 point subtractions
          each; with the naive count removed no step is super-linear in the
          field size beyond the 2^19-term trace count.
        modal_P1: not fired.
        if_fired: affected cells INCOMPLETE (IR-8); contract NOT-VALIDATED.
      - id: RB-S5
        rule: S5, a reuse target left unsolved when its attempt count reaches MAX_ATTEMPTS = 100000 halts that cell (binary) or fails G1 (g) (control)
        evaluated_by: stage2_outcome (reuse abandoned count) and g1_checks (g)
        own_metrics: >-
          Model probability per target (1 - p)^100000 with p = 0.01965 on
          CTRL-ZN, about e^-1984, and far smaller at mu about 1; not fired.
        modal_P1: not fired.
        if_fired: binary cell INCOMPLETE (NOT-VALIDATED); on CTRL-ZN RUN-ARTIFACT.
    invalidation_rules:
      - id: RB-IR1
        rule: IR-1, any binary-cell figure produced before G1 passed invalidates the run
        evaluated_by: run_validity (IR1_fired flag; absent counts as fired)
        own_metrics: procedural; no metric can fire it.
        modal_P1: not fired.
        if_fired: RUN-ARTIFACT.
      - id: RB-IR2
        rule: IR-2, a failed certificate or an inconsistent relation row invalidates the run
        evaluated_by: verify.py (binary), g1_checks (f) (control); IR2_fired flag into run_validity
        own_metrics: >-
          Relations are true by construction of the oracle output and every
          logarithm is solved from true relations, so certificates fail and
          rows are inconsistent only on an instrument defect; not fired.
        modal_P1: not fired.
        if_fired: RUN-ARTIFACT.
      - id: RB-IR3
        rule: IR-3, G1 failing on any conjunct (a) to (i) invalidates every reading
        evaluated_by: g1_checks; G1_pass flag into run_validity
        own_metrics: see RB-G1a to RB-G1i.
        modal_P1: G1 passes; false-fail under the model 0.575 percent at CTRL-ZN by C-4 (version 2, by reviewer Monte Carlo, 9.2 percent).
        if_fired: RUN-ARTIFACT.
      - id: RB-IR3b
        rule: IR-3b, a pooling constant outside [0.5, 2] on a binary cell invalidates that cell's rho reading
        evaluated_by: run_rho instrument_ok; stage2_outcome (H2-ARTIFACT)
        own_metrics: >-
          Under the random-mapping model with the I2 semantics the pooling
          constants stay inside [0.8, 1.3] except a c(1) excursion below 0.8
          (1.3 to 2.35 percent per cell) and never left [0.5, 2] in 1000 to
          2000 replicates per cell (TASK-20260929-594e8d J3 most_likely and
          J3-O10; H2 rules unchanged since); not fired.
        modal_P1: not fired.
        if_fired: H2-ARTIFACT; contract NOT-VALIDATED unless the H1 axis is NEGATIVE.
      - id: RB-IR4
        rule: IR-4, an order or primality disagreement, or mu_c outside [0.5, 2], invalidates that cell
        evaluated_by: AR-ORDER and AR-MU flags into stage2_outcome (cell halted)
        own_metrics: as RB-S3 (the infeasible naive count removed).
        modal_P1: not fired.
        if_fired: both axes INCOMPLETE; NOT-VALIDATED.
      - id: RB-IR5
        rule: IR-5 (rescoped), (a) a summed figure IN PLACE OF the separate columns is not read; per_target_cost(L) and FR_by_L are the defined exception; (b) a gated fit over other than the declared L cells invalidates that cell's IC reading
        evaluated_by: fixture_code ir5_check on every run_cell output; G1 (i); stage2_outcome
        own_metrics: >-
          DOES NOT FIRE on the contract's own declared figures, by
          construction: am_core produces per_target_cost(L) and FR_by_L beside
          shared_units and every per-target record's units (part a's
          exception), and records fit_cells equal to the declared L_IC or
          L_NULL it was called with (part b). outcome_patterns_main also
          applies ir5_check to an arm built by am_core
          (ir5_declared_figures_check) and requires ic_reading_valid true.
          This is the version-2 defect J3-D1 removed: IR-5 is no longer in the
          run-wide list.
        modal_P1: not fired; P1 reads POSITIVE.
        if_fired: (a) the summed figure is not read; (b) H1-ARTIFACT on a binary cell, NOT-VALIDATED; on CTRL-ZN a G1 failure.
      - id: RB-IR6
        rule: IR-6, a code file differing from its pinned sha256 invalidates the run
        evaluated_by: the driver against the snapshot receipts; IR6_fired flag
        own_metrics: not a metric.
        modal_P1: not fired.
        if_fired: RUN-ARTIFACT.
      - id: RB-IR7
        rule: IR-7, a source value replacing a frozen figure (SR-NOSUB) invalidates the run
        evaluated_by: the executor's attestation; IR7_fired flag
        own_metrics: not a metric.
        modal_P1: not fired.
        if_fired: RUN-ARTIFACT.
      - id: RB-IR8
        rule: IR-8, a timeout or crash is failed_infrastructure; the affected cell reads INCOMPLETE
        evaluated_by: the driver's halted record into stage2_outcome
        own_metrics: as RB-S4.
        modal_P1: not fired.
        if_fired: INCOMPLETE; NOT-VALIDATED.
      - id: RB-IR9
        rule: IR-9, the BIN-ORD-19 null inside any AM band or at KR >= 0.125 invalidates the IC reading (on CTRL-ZN it fails G1 (b))
        evaluated_by: null_check with the cell's own bands; stage2_outcome; g1_checks (b)
        own_metrics: >-
          Does not fire: the null's design values KR about 0.012 (control) and
          0.0026 (binary), FR about 82 and 381, d_sigma about +0.71 and +0.76
          lie outside every version-3 band (control KR [0.641, 1.560], FR
          [0.723, 1.382]; binary KR [0.851, 1.175], FR [0.877, 1.141]; d_sigma
          [-0.1, 0.1]) by large factors; the version-2 reviewer Monte Carlo
          separated the null in 100 percent of 8000 null arms per cell.
        modal_P1: not fired.
        if_fired: H1-ARTIFACT (NOT-VALIDATED); on CTRL-ZN RUN-ARTIFACT.
      - id: RB-IR10
        rule: IR-10, CTL-6 failing on a binary cell (delta_hat >= 0.95, or the integrity assertion false) invalidates the IC reading
        evaluated_by: run_cell ctl6; stage2_outcome; g1_checks (c)
        own_metrics: >-
          The integrity assertion holds by construction of run_ic_shared
          (exactly B relations; one units_per_attempt per call). The delta
          test fires under the model with probability about 1e-5 at B = 128
          (0.95 is 4.3 graph-level sd above delta_inf) and negligibly at
          B = 512; not fired.
        modal_P1: not fired.
        if_fired: H1-ARTIFACT (NOT-VALIDATED); on CTRL-ZN RUN-ARTIFACT.
      - id: RB-IR11
        rule: IR-11 (new), a discrepancy between oracle A and the brute-force decomposition set on the audit sample invalidates that cell's IC reading; a missing or short audit halts the cell
        evaluated_by: the driver's completeness re-check (I4 brute force, pinned under S1b) into stage2_outcome
        own_metrics: does not fire for a complete oracle (the audit compares two enumerations of the same set).
        modal_P1: not fired.
        if_fired: H1-ARTIFACT (NOT-VALIDATED); short or missing audit, INCOMPLETE (NOT-VALIDATED).
    admission_rules:
      - {id: RB-AR-MU, rule: 'AR-MU, mu_c in [0.5, 2], binary cells only', own_metrics: 'nominal mu_c about 1.0; not fired', modal_P1: not fired, if_fired: 'cell halted (S3, IR-4); INCOMPLETE'}
      - {id: RB-AR-ORDER, rule: 'AR-ORDER, #E by the trace count and the Hasse certificate, q and l proved prime', own_metrics: 'feasible since version 3 (RB-S3); not fired', modal_P1: not fired, if_fired: 'cell halted; INCOMPLETE'}
      - {id: RB-AR-DP, rule: 'AR-DP, dp_bits by formula', own_metrics: 'an ASSIGNMENT rule, not a test: it cannot halt a cell (version 2 listed it among the halting rules vacuously; version 3 lists it as an assignment); design expectation 3, 1, 1 checked by stage0_code', modal_P1: 'n/a', if_fired: 'n/a'}
      - {id: RB-AR-FIELD, rule: 'AR-FIELD, I3 self-test', own_metrics: 'passes for a correct field module', modal_P1: not fired, if_fired: 'cell halted; INCOMPLETE'}
      - {id: RB-AR-CURVE, rule: 'AR-CURVE (new), 100 seeded points on the curve; table and schoolbook paths agree on 100 seeded pairs', own_metrics: 'passes for a correct adapter', modal_P1: not fired, if_fired: 'cell halted; INCOMPLETE'}
      - {id: RB-AR-ORACLE, rule: 'AR-ORACLE (new), oracle A equals the brute-force set on 10 seeded targets', own_metrics: 'passes for a complete oracle', modal_P1: not fired, if_fired: 'cell halted; INCOMPLETE'}
      - {id: RB-AR-I1, rule: 'I1 self-test, G1 conjunct (h)', own_metrics: 'deterministic; i1_selftest traced by hand in D-13; passes for the committed FullVectorElim', modal_P1: not fired, if_fired: RUN-ARTIFACT}
      - {id: RB-NO-SELECTION, rule: 'no admission rule selects L cells; every fit uses all declared L cells', own_metrics: 'holds by construction (am_core fit_cells)', modal_P1: 'n/a', if_fired: 'n/a'}
    g1_conjuncts:
      - {id: RB-G1a, conjunct: '(a) CTRL-ZN reuse arm PASS', model_false_fail: '0.00575 by C-4 (T_delta low 0.00225, T_u 0.00325, AM2 low 0.002, AM1 low 0.001, T_a 0, AM3 0); normal-approximation design range 0.005 to 0.007', modal_P1: pass}
      - {id: RB-G1b, conjunct: '(b) null discriminates', model_false_fail: '0 of 4000 by C-4 (outside by factors of 40 to 400)', modal_P1: pass}
      - {id: RB-G1c, conjunct: '(c) CTL-6 delta test and integrity', model_false_fail: '0 of 4000 by C-4 (normal approximation about 1e-5)', modal_P1: pass}
      - {id: RB-G1d, conjunct: '(d) exponent_rho in [-0.6, -0.4]', model_false_fail: '0 in the version-2 reviewer random-mapping Monte Carlo (5000 replicates; rules unchanged); not in C-4', modal_P1: pass}
      - {id: RB-G1e, conjunct: '(e) c(L) in [0.5, 2]', model_false_fail: 'never failed in the version-2 reviewer Monte Carlo; not in C-4', modal_P1: pass}
      - {id: RB-G1f, conjunct: '(f) certificates', model_false_fail: '0 for correct code', modal_P1: pass}
      - {id: RB-G1g, conjunct: '(g) no reuse target abandoned at MAX_ATTEMPTS', model_false_fail: 'about e^-1984 per target; 0 of 4000 by C-4', modal_P1: pass}
      - {id: RB-G1h, conjunct: '(h) I1 self-test', model_false_fail: '0 (deterministic)', modal_P1: pass}
      - {id: RB-G1i, conjunct: '(i) IR-5 clean', model_false_fail: '0 (by construction)', modal_P1: pass}
    finding: >-
      No rule fires on the contract's own declared metrics or on P1 after the
      two fixes (IR-5 rescoped, R2-J3-1; the infeasible naive count replaced,
      RB-S3). Every rule that can fire routes to RUN-ARTIFACT, INCOMPLETE or
      ARTIFACT, never to NEGATIVE; every declared outcome keeps a reaching
      pattern (outcome_reachability).

  # ---------------------------------------------------------------------------
  g1_calibration:
    requirement: R2-J3-2 and DA3-4
    remedy_choice: >-
      Per-cell scaling of the AM1 and AM2 bands to the model's sampling sd
      (the first option of R2-J3-2), at z = 3.5 on every cell. Not chosen:
      the same-regime Z/NZ control (B = 512, N the least prime above 2^19,
      mu about 1). Reasons: (1) G1 is evaluated on CTRL-ZN, which C4 binds
      to a base of 2^7 at about 2^20, so only a regime-scaled band removes
      the control's 9 percent false-fail; an added control would not; (2)
      the relation-order effect that only a mu about 1 control could see
      (J3-D5) is removed at its source by the seeded uniform choice
      (R2-J3-5); (3) the LOW-RETRY audit reads target coverage and oracle
      completeness on the binary cell itself, so it needs no reference cell.
    model: >-
      D-11. ln FR has variance (1 - p)/n_t + (g s_lnu)^2 with x = mu u_pred,
      p = 1 - exp(-x), g = x / (exp(x) - 1) and s_lnu = 2 x 0.403 /
      (sqrt(B) delta_inf); ln KR adds the relation-attempt term exp(-mu)/B.
      Bands exp(+-3.5 s). The functions are am_bands and band_table of
      fixture_code.
    per_regime_design_figures:
      - regime: CTRL-ZN (B = 128, mu = 0.0312498, n_t = 1365)
        s_lnFR: 0.0925
        s_lnKR: 0.1270
        KR_band: '[0.641, 1.560]'
        FR_band: '[0.723, 1.382]'
        version_2_band_in_sd: 'KR 1.76 sd, FR 2.41 sd (hence the 9 percent)'
        two_sided_normal_tails_percent: 'T_delta 0.097; T_u 0.270; T_a 0.015 to 0.27 (0.27 at its nominal 3 sd; 0.015 to 0.048 at the reviewer-measured z-sd 0.79 to 0.86); AM1 0.047; AM2 0.047; AM3 about 0; null about 0; CTL-6 about 0.001'
        G1_false_fail_when_H1_H2_hold: 'about 0.5 to 0.7 percent (union bound; the KR and FR terms are positively correlated, so the bound is conservative)'
      - regime: binary nominal (B = 512, mu = 1, n_t = 1365), BIN-ORD-19 and BIN-KOB-19
        s_lnFR: 0.0376
        s_lnKR: 0.0462
        KR_band: '[0.851, 1.175]'
        FR_band: '[0.877, 1.141]'
        version_2_band_in_sd: 'KR 4.83 sd, FR 5.94 sd'
        two_sided_normal_tails_percent: 'as CTRL-ZN plus T_cmp 0.097'
        per_cell_non_PASS_when_H1_holds: 'about 0.6 to 0.8 percent'
    restated_most_likely_inputs: >-
      P(G1 fails | H1, H2) = 0.00575 by the C-4 Monte Carlo (23 of 4000; the
      normal-approximation design range was 0.005 to 0.007; version 2: 0.092
      by the TASK-20260929-594e8d Monte Carlo); P(H1-POSITIVE | G1) = 0.98843
      by C-4 (H1-MIXED 0.01157); P(H2-POSITIVE) about 0.932 (the version-2
      reviewer random-mapping Monte Carlo of the unchanged H2 rules, dominated
      by c(1) below 0.8; not in C-4). Hence P(POSITIVE) about 0.99425 x
      0.98843 x 0.932 = 0.916, NOT-VALIDATED about 0.078 (mostly H2-MIXED
      through c(1), then H1-MIXED), RUN-ARTIFACT about 0.006 (G1), NEGATIVE
      about 0.0006 (H2-NEGATIVE). Design figures, never results.
    monte_carlo:
      program: fixture_code g1_calibration (binstd_core.py --g1-calibration RUNS SEED)
      what_it_models: >-
        The contract's abstract model with H1 true: a random signed relation
        multigraph with uniform legs and B relations (seeded uniform choice
        means the kept relation's legs are uniform), the determined set by a
        signed union-find (unbalanced cycle or coefficient-2 loop), geometric
        target attempts with p = 1 - exp(-mu delta^2), Poisson thinning for
        the decomposition counts, the CTL-8 null pipeline on fresh graphs
        with its check and re-attempt schedule; every draw fed to the
        COMMITTED am_core, gate_tests, classify_cell, am_bands, null_check and
        h1_axis. No group, oracle, curve, instrument or fixture.
      not_modelled: >-
        The rho conjuncts (d), (e) and the H2 band (cited from the version-2
        reviewer Monte Carlo, rules unchanged), the certificates (f), the I1
        self-test (h), IR-5 (i), target coverage (kappa_hat is set to its
        model value) and any oracle return order.
      command: python3 binstd_core.py --g1-calibration 4000 20261001
      seed: 20261001
      runs: 4000
      output: session_computations C-4 (verbatim)
      supersedes_the_design_figures: >-
        Yes for G1 and the per-cell rates. A G1 false-fail above 5 percent at
        any regime in that output would have been a design defect of this
        version; none occurred.
    c4_per_regime_result:
      note: DESIGN FIGURES from the C-4 Monte Carlo of the contract's abstract model (4000 replicates, seed 20261001), never results about any cell. Rates are counts over 4000; a count of 23 has a binomial standard error of about 4.8.
      CTRL-ZN:
        G1_false_fail_when_H1_holds: '0.00575 (23 of 4000), all through conjunct (a), the reuse arm not PASS; (b) null 0, (c) delta test 0, (g) abandoned 0'
        per_test_fail_rate: 'T_delta low 0.00225; T_u low 0.002, high 0.00125; AM2 FR low 0.002; AM1 KR low 0.001; T_a 0; AM3 0'
        class_rate: 'PASS 0.99425; LOW-COV 0.00425; HIGH 0.00125; LOW-RETRY 0.00025'
        version_2_figure_for_comparison: 0.092 (TASK-20260929-594e8d, fixed bands)
      BIN-ORD-19 (nominal B = 512, mu = 1):
        per_cell_non_PASS_when_H1_holds: 0.00775
        class_rate: 'PASS 0.99225; HIGH 0.00475; LOW-COV 0.002; LOW-RETRY 0.001'
        null_not_discriminating: 0.0
      BIN-KOB-19 (nominal B = 512, mu = 1):
        per_cell_non_PASS_when_H1_holds: 0.006
        class_rate: 'PASS 0.994; HIGH 0.00325; LOW-COV 0.002; LOW-RETRY 0.00075'
      H1_axis_given_G1: 'H1-POSITIVE 0.98843; H1-MIXED 0.01157; no NEGATIVE and no ARTIFACT in 3977 G1-passing replicates'
      reading: >-
        Every gate's false-fail rate under the contract's own model is below
        1 percent at every cell regime (largest single test 0.00225; largest
        per-cell non-PASS 0.00775), against the plan's 5 percent line. The
        normal-approximation design figures (0.5 to 0.7 percent for G1; 0.6
        to 0.8 percent per binary cell) are confirmed. The AM1 and AM2 bands
        are no longer the leading failure source at the control (T_delta and
        T_u are). Not modelled: the rho conjuncts and the H2 band (from the
        version-2 reviewer Monte Carlo, unchanged rules), certificates, the I1
        self-test, IR-5, target coverage and oracle order.

