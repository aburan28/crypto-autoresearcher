                "m4_sub_cap_critical_g": critical(lambda g, k=k: win(4, X_SUB, D3_4 + g, k), 0.0, 40.0),
                "m5_D3_windows": {str(g): win(5, xB5, D3_5 + g, k) for g in G5},
                "m5_critical_g_D3": critical(lambda g, k=k: win(5, xB5, D3_5 + g, k), 0.0, 20.0)}
        return res


    def compute():
        log2_r, log2_Np, log2_rho, log2_rho_b, A1 = _l2r(), _l2np(), _l2rho(), _l2rho_b(), _a1()
        out = {"design_only": True, "log2_r": log2_r, "log2_N_prime": log2_Np,
               "log2_rho_form_a": log2_rho, "log2_rho_form_b": log2_rho_b,
               "rho_form_difference": log2_rho - log2_rho_b, "A1": A1, "log2_A1": LOG2(A1),
               "retry": {m: retry(m) for m in (2, 4, 5)},
               "log2_kappa": {m: LOG2(kappa(m)) for m in (4, 5)},
               "frozen_inputs": {"D3_5": D3_5, "D3_4": D3_4, "PROP_5": PROP_5, "X_SUB": X_SUB},
               "rows": {}}
        for m in MS:
            xB = bcap(m)
            tgen, pgen, la = 0.5 * (log2_Np - xB), 0.5 * (log2_Np + xB), LOG2(m) + 2.0 * xB
            la_mat = LOG2(m) + xB + LOG2(LA_ENTRY_BYTES)
            la_vec = LOG2(KRYLOV_VECTORS * WORD_BYTES) + xB
            row = {"log2_B_cap": xB, "log2_T_gen": tgen, "log2_P_gen": pgen, "log2_LA": la,
                   "P_gen_minus_LA": pgen - la, "identity_residual": (xB + tgen) - pgen,
                   "log2_PIC_over_Pgen_at_Tgen": LOG2(A1 + 2.0 ** (la - pgen)),
                   "log2_kappa_m": LOG2(kappa(m)), "S_bytes_log2": xB + LOG2(WORD_BYTES),
                   "LA_matrix_bytes_log2": la_mat, "LA_krylov_bytes_log2": la_vec,
