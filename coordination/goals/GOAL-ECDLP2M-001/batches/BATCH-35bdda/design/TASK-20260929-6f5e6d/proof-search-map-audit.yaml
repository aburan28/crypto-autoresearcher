          and E outcome_table.contract_label.RUN-ARTIFACT now read "S0 or G1
          failed, or IR-1, IR-2, IR-6 or IR-7 fired". (3) H
          proof_search_map.proof_obligations item 7 aligned: "shared and
          per-target units are always reported as separate columns; the only
          figures combining them are the declared per_target_cost(L) and
          FR_by_L, reported beside those columns (IR-5 exception)". (4) The
          evaluating program is COMMITTED: fixture_code ir5_check (applied to
          every run_cell output, folded into G1 conjunct (i) and into
          stage2_outcome), am_core (the only producer of the combined
          figures, always beside the columns) and run_validity, which
          evaluates every run-wide rule from named flags instead of a
          caller-supplied run_valid. (5) The rule-by-rule table below applies
          EVERY invalidation, stopping and admission rule to the contract's
          own declared metrics and to P1; the sweep found and fixed one
          further defect (AR-ORDER's naive count, infeasible at n = 19; RB-S3).
      - id: R2-J3-2
        kind: required_moderate
        requirement: G1 false-fail small and stated per cell regime; D-4 corrected; most_likely restated
        discharged_by: >-
          Remedy chosen: per-cell scaling. fixture_code am_bands sets the AM1
          and AM2 bands to exp(+-3.5 s) with s the model's log-space sampling
          sd at the cell's (B_c, mu_c, n_t) (D-11); gate_tests and null_check
          use them on every cell, the control included. A g1_calibration
          states the bands and the false-fail rates per regime from the
          committed Monte Carlo (binstd_core.py --g1-calibration 4000
          20261001, run by the session as C-4, output verbatim in
          session_computations): CTRL-ZN KR [0.641, 1.560], FR [0.723,
          1.382], G1 false-fail 0.00575; BIN-ORD-19 and BIN-KOB-19 at nominal
          KR [0.851, 1.175], FR [0.877, 1.141], per-cell non-PASS 0.00775 and
          0.006; every single test below 0.0023 (version 2: G1 0.092). A
          derivation_notes D-4 corrected for the control. E
          outcome_table.most_likely restated with the model probability that
          G1 fails when H1 and H2 hold.
      - id: R2-J3-3
        kind: required_moderate
        requirement: state the AM reductions in admissible_ranges and statement (D); replace AM3 or declare the L-dimension untested
        discharged_by: >-
          A admissible_ranges.reduction_in_the_reuse_arm and
          A audit_2_observation_collision.observable; H statement (D) gloss of
          "the FORM of the amortisation law"; E
          definitions.observables_and_tests (reduction paragraph). Choice: the
          L-dimension is declared NOT TESTED by the reuse arm as designed; AM3
          is kept as a gate because it is the observable on which the no-reuse
          null's L-dependence shows (d_sigma_null about +0.7), and it is
          stated to add no independent failure region in the reuse arm.
      - id: R2-J3-4
        kind: required_moderate
        requirement: pre-register the LOW-RETRY audit with both consequences; map a KN-FIND-007-direction yield deficit to a class; quote the finding's quantity in H1
        discharged_by: >-
          E outcome_table.low_retry_audit (what it checks: (i) the oracle
          completeness audit IR-11, (ii) target coverage kappa_hat against
          1 - exp(-mu_c) at z <= -3; consequences: (i) failed gives
          H1-ARTIFACT, (i) clean and (ii) deficit on both LOW-RETRY cells
          gives the new declared NEGATIVE H1-NEGATIVE-YIELD, otherwise
          H1-NEGATIVE-DEVIANT); E outcome_table.h1_axis; fixture_code
          yield_audit and h1_axis; mapping: a KN-FIND-007-direction yield
          deficit maps to per-cell class LOW-RETRY (SPLIT if KR also leaves its
          band on the high side), never LOW-COV; H H1 random_model_justification
          quotes KN-FIND-007's own quantity (coverage, "the fraction of targets
          with at least one decomposition", coverage <= min(1, mean)).
      - id: R2-J2-1
        kind: required_moderate
        requirement: wire every procedure step 2 self-test to a declared consequence; state how I3 to I5 are bound
        discharged_by: >-
          E procedure step 2 ("stop unless", per cell) and E controls CTL-7:
          the I1 seeded system is committed as fixture_code i1_selftest and is
          G1 conjunct (h) (failure: RUN-ARTIFACT); the I3 field self-test is
          AR-FIELD, the I4 point and table/schoolbook checks are AR-CURVE,
          oracle A against brute force on 10 seeded targets is AR-ORACLE, and
          the order check is AR-ORDER, each halting its cell under S3
          (INCOMPLETE, NOT-VALIDATED); after the cell, the completeness audit
          of oracle A on 256 relation attempts and every attempt of 128 reuse
          targets is IR-11 (H1-ARTIFACT). stage2_outcome evaluates all of them
          from named flags. BINDING: the I3 to I5 code is pinned in the
          EXECUTION BATCH's snapshot receipt before any run (impl-provenance.json
          with each file's sha256; stopping rule S1b; IR-6 extended to every
          impl/ file). GAP STATED: that code is written after approval and is
          reviewed by no design-round reviewer; the guards against a defect in
          it reaching a declared NEGATIVE are the step 2 self-tests, IR-11 and
          the certificates (open_issues OI-5).
      - id: R2-J4-1
        kind: required_moderate
        requirement: TW-01 containment clause as a c = 1 statement with its c-range; critical-g shift in the sensitivity
        discharged_by: >-
          E outcome_table.tw01_caution and A tripwire_preregistration
          (c = 1 statement; holds for c below about 2.01 over the committed
          m = 4 range and below about 2.52 to 2.63 at B = B_cap(m); fails on
          the m = 4 envelope at the Bernstein-Lange constants 2.15 and 2.36);
          E definitions.column_conventions (iii) adds the critical-g and
          closing-g shift of about +log2 c; A derivation_notes D-12. The
          c-independent routing rule is unchanged.
      - id: R2-J3-5
        kind: required_minor
        requirement: fix the relation kept at mu about 1
        discharged_by: >-
          Seeded uniform choice among the returned decompositions:
          fixture_code run_ic_shared (stream relchoice|<j>) and run_ic_null
          (stream null|<t>|relchoice|<j>); H assumptions A2 says so; E
          replication.seeds lists both streams.
      - id: R2-J3-6
        kind: required_minor
        requirement: derive the reachability patterns from generative quantities
        discharged_by: >-
          A outcome_reachability (every pattern built from delta_hat, u_hat,
          a_ratio, rho_rel, kappa_ratio and q_null through the reuse-arm and
          null identities); fixture_code gen_values, gen_null,
          outcome_patterns, evaluate_pattern, outcome_patterns_main (exit 0
          iff every coded assignment equals the declared one).
      - id: R2-J3-7
        kind: required_minor
        requirement: CTL-6 as the delta_hat test plus an integrity assertion
        discharged_by: E controls CTL-6 and invalidation_rules IR-10; fixture_code run_cell ctl6 (delta_below_0.95; integrity with relations_equal_B and accounting_identity, stated to hold by construction of the committed code).
      - id: R2-J4-2
        kind: required_minor
        requirement: Stage 3 as a proposed column note for a Coordinator decision
        discharged_by: E stages.stage_3 and the contract_label consequences (the note PROPOSES; whether the table carries the row is the Coordinator decision of statement (D)).
      - id: R2-J4-3
        kind: required_minor
        requirement: '"no prime-field curve and no prime-field engine cell"'
        discharged_by: E scope.excluded; A scope_delta SD3-6 (the version-2 wording is not repeated in any version-3 file).
      - id: R2-J1-1
        kind: required_minor
        requirement: L = 1 residuals at the frozen inputs; the tie rule load-bearing at m = 4
        discharged_by: A audit_1 parameter_slices (i) and l1_residuals_at_frozen_inputs; H proof_search_map.baseline_embedding.parameter_slice and reproduction_check; E definitions.conventions_for_g (tie rule stated load-bearing).
      - id: R2-J1-2
        kind: required_minor
        requirement: honest provenance of the m = 4 envelope figures on the committed grid
        discharged_by: A m4_envelope_provenance (the committed version-2 stage0.py at S0, 140 of 140 DESIGN comparisons, by review dry import; the recorded review recomputations on the exact committed grid, TASK-20260929-45204f J1 iii and TASK-20260929-739a0c Q6 as composed in DEC-20260929-1f5fcb; C-3 of this batch, the version-3 stage0.py at S0 on the committed grid, every envelope comparison ok). The frozen figures are not presented as producer hand recomputations.
      - id: R2-J1-3
        kind: required_minor
        requirement: list the LA iteration constant as a hidden cofactor with its sensitivity
        discharged_by: H asymptotic_claim.hidden_cofactor; E definitions.cap_locus_and_constants; A hidden_cofactor_la_constant; stage0_code la_sensitivity (prints at k = 1, 2, 3; no DESIGN comparison). No comparator or model change; the D3 pin uses the same k = 1.
      - id: R2-J2-2
        kind: required_minor
        requirement: comparator memory at the m = 4 cap-slice and envelope upper ends
        discharged_by: stage0_code comparator_memory_at_upper_ends.m4_cap (added) and .m4_envelope; E memory_beside_time.window_memory (figures stated, e.g. 2^102.38 entries and 2^107.47 bytes at the envelope g = 0 upper edge, 2^101.05 and 2^106.14 at the cap slice at log2 C = 11.010251); H statement (B).
      - id: R2-J2-3
        kind: required_minor
        requirement: align "reaches 100000 attempts" with the coded test
        discharged_by: E stages.stage_1 (g), A fixture_pass_criterion (g), the fixture docstring (g) and E stopping_rules S5 all read "abandoned, that is, left unsolved when its attempt count reaches MAX_ATTEMPTS = 100000 (a target solved on its 100000th attempt is solved)", which is what g1_checks and stage2_outcome test (reuse abandoned count).
      - id: R2-J2-4
        kind: required_minor
        requirement: reconcile "no numpy" with the CERTBIN helpers
        discharged_by: E definitions.impl_layout and H test_boundary.implementation name the DROPPED helpers (gf2n.py vmul, vdiv, vtrace, _vlin, vhalf_trace, vsqrt and the np_* tables; curve.py count_by_trace's numpy branch, its pure-Python branch kept; oracles_rc1.py truth_tables and oracle_B) and the KEPT scalar code (clmul, pmod, pgcd, is_irreducible, the Field and TableField scalar methods, Curve's scalar arithmetic, s3_eval_school, is_prime, _roots_quadratic, oracle_A).
      - id: R2-PROC-1
        kind: required_minor
        requirement: stage0.py import-safe
        discharged_by: stage0_code (every computation in compute() and main(), under the __main__ guard; module level holds imports, literal constants, DESIGN and definitions only); fixture_code likewise (no module-level call; DELTA_INF and U_PRED replaced by cached functions); A code_binding.import_safety; C-2 by the session (fresh-interpreter import of both modules exits 0, prints nothing, writes no file).
