  derivation_notes:
    D-1_m4_closed_forms: >-
      Carried from version 2 unchanged. Upper edge. For small ab the upper
      root is L_hi about (1/a)^2 with a = A(mu) retry_4 C / rho_1. Above the
      cap mu grows (mu = 2^8.4 at log2 B = 35.996) and A(mu) tends to 1, so the
      upper edge tends to 2 (log2 rho_1 - log2 retry_4 - log2 C) = 2 (60.809036
      - 0.109768 - 11.010251 - g) = 99.378 - 2g, against the cap value 2 (log2
      rho_1 - log2 kappa_4 - log2 C) = 2 (60.809036 - 0.771496 - 11.010251 -
      g) = 98.055 - 2g; the difference 2 log2 A(1) = 1.3235 bit is the
      version-1 miss. Lower edge. With A(mu) about 1/mu below the cap,
      T_shared = K C / B^3 + 4 B^2 (K = 24 x 2^131) is minimised at B^5 = 3 K
      C / 8, so log2 B* = 29.036035 + g/5 and T_shared,min scales as C^(2/5);
      with b = 1 at g = 0 this gives b_min = 2^(0.4 g) and log2 L_lo about
      0.8 g (0.00, 4.80, 8.00, 10.40, 11.20 at g = 0, 6, 10, 13, 14, at log2
      B* = 29.04, 30.24, 31.04, 31.64, 31.84), departing upward once B* nears
      the cap (16.05 at g = 20 and 29.29 at g = 30, TASK-20260928-d5024b E04).
      Cap slice upper end at log2 C = 11.010251: 2 (60.809036 - 0.771496 -
      11.010251) = 98.0546, printed 98.05.
    D-2_contiguity: >-
      Carried from version 2 unchanged (the log-convexity proof that the
      continuum envelope is contiguous at every g below the closing g; read
      line by line and found valid by TASK-20260929-45204f J1 item iii (d)).
      At fixed C, with t = ln B and mu = B^4 / K, non-emptiness is 4ab < 1
      with ab proportional to f(t) = C A^2 B + 4 A B^2; d ln A / d t = -4 mu /
      (e^mu - 1) is increasing in t, so ln A is convex, both terms are
      log-convex, f is log-convex hence quasi-convex, its sublevel set is an
      interval, and the projection on L of the connected set {(B, L) :
      L_lo(B) < L < L_hi(B)} is an interval. The discrete grid flag is
      stage0_code's check.
    D-3_determined_law_m2: >-
      Carried from version 2 unchanged. At m = 2 a relation is a signed edge
      between its two leg columns; R = B relations give a random multigraph
      of mean degree c = 2. A column is determined iff its component contains
      an unbalanced cycle (sign product -1) or a coefficient-2 loop; tree
      components are touched but carry one free variable whatever the solver.
      The giant component has fraction y = 1 - exp(-c y), y = 0.796812; it is
      determined with probability tending to 1; so delta_inf = 0.796812 and
      u = delta_inf^2 = 0.634909. A reviewer Monte Carlo gives mean
      determined 0.7983 at B = 128 and 0.7970 at B = 512, with the 5th to 95th
      percentile of delta_hat^2 [0.5393, 0.7252] and [0.5892, 0.6826]
      (TASK-20260928-d5024b E05), so the graph-level sd of delta_hat is 0.0356
      at B = 128 and 0.0178 at B = 512, that is 0.403 / sqrt(B). Touched
      values, diagnostics only: tau = 0.864665, touched usable 0.747645.
    D-4_attempts_knee_slopes_CORRECTED: >-
      Attempts law (multi-decomposition acceptance): an attempt returns
      Poisson(mu) decompositions, each usable independently with probability
      u, so it succeeds with p = 1 - exp(-mu u). At mu = 1: p = 0.4700164,
      a_2(1) = 2.127585; single acceptance would give 2.492. On CTRL-ZN mu =
      2 x 128^2 / 1048583 = 0.0312498; mu u = 0.0198408, p = 0.0196452, a_2 =
      50.903; A(mu) = 32.503. Knee: K_pred = B A(mu) / a_2 = 81.731 on CTRL-ZN
      and 380.70 on a nominal binary cell. sigma_pred: -0.6398 (CTRL-ZN, L_IC),
      -0.9399 (CTRL-ZN, L_NULL), -0.8322 and -0.9861 (nominal binary). All
      unchanged from version 2. SAMPLING, CORRECTED FOR THE CONTROL (R2-J3-2;
      version 2 computed the binary cell only). ln FR = ln a_bar - ln a_pred
      has three sources: the target sampling, variance (1 - p)/n_t (CTRL-ZN
      0.980355 / 1365 = 0.00071821, sd 0.0268; binary 0.5299836 / 1365 =
      0.00038827, sd 0.0197); the graph-level spread of u = delta^2, sd of ln u
      2 x 0.403 / (sqrt(B) delta_inf) (0.08941 at B = 128; 0.04470 at
      B = 512), entering ln a with the factor x / (e^x - 1), x = mu u_pred
      (0.99011 at CTRL-ZN; 0.71591 at mu = 1), so 0.08852 and 0.03200. Hence
      sd(ln FR) = 0.09249 on CTRL-ZN and 0.03758 on a binary cell. ln KR adds
      the relation-attempt count, a sum of B geometric draws with success
      probability 1 - exp(-mu), relative variance exp(-mu)/B (0.0075721 at
      CTRL-ZN, sd 0.0870; 0.00071851 at mu = 1, sd 0.0268), independent of the
      target phase: sd(ln KR) = 0.12699 on CTRL-ZN and 0.04616 on a binary
      cell. These reproduce the version-2 reviewer Monte Carlo (KR 12.9 and
      4.5 to 4.7 percent; FR 9.8 and 3.7 to 3.9 percent; TASK-20260929-594e8d
      J3). Consequence for version 2: the fixed band [0.8, 1.25] (ln 1.25 =
      0.22314) was 1.76 sd for KR and 2.41 sd for FR at the control
      (two-sided normal tails about 7.9 and 1.6 percent; reviewer Monte Carlo
      G1 false-fail 9.2 percent) but 4.83 and 5.94 sd on a binary cell, so the
      version-2 statement "KR and FR four to five sd" held for the binary
      cell only. Version 3 bands are 3.5 sd per cell (D-11). Fixture
      expectations: shared lookups 128 x 32.50 x 256 = 2^20.02; per target
      50.90 x 256 = 2^13.67.
    D-5_null_expectation: >-
      Carried from version 2 unchanged. The null solves each target by
      collecting fresh relations until both legs of its stored decomposition
      are determined: about 1.0 B relations, so its per-target units are
      about the shared units, KR_null about 1/K_pred (0.012 on CTRL-ZN; 0.0026
      nominal binary), FR_null about rho_rel K_pred (82; 381), and d_sigma_null
      about +0.71 and +0.76. Order-of-magnitude design expectations, not
      criteria (confirmed by the version-2 reviewer Monte Carlo, medians KR
      0.0118 and 0.0028, FR 85 and 354, d_sigma 0.73 and 0.76).
    D-6_memory: >-
      Carried from version 2 unchanged. LA matrix m B_cap entries at 8 bytes;
      three Krylov vectors of B_cap residues at 17 bytes, log2 = 5.672425 +
      log2 B_cap; totals by lsum 40.2713, 34.0892, 30.0447, 25.1328, 18.4369.
      Comparator: at least 8 L_hi entries at 34 bytes; log2 entries = 3 +
      log2 L_hi, log2 bytes = log2 entries + 5.087463.
    D-7_m5_g2: >-
      Carried from version 2 unchanged. D3 convention, x = 35.075936: b =
      5.79606, log2 L_lo = 5.0701, log2 L_hi = 50.0439. Proposal convention,
      x = 34.414212: b = 3.70053, log2 L_lo = 3.7755, log2 L_hi = 51.3673. At
      C = 2^D3(5), b = 1.523877 and log2(IC(1)/rho_1) = 0.6077.
    D-8_kuhn_struik: >-
      Carried from version 2 unchanged. c(L) = E_L / (sqrt(L) E_1) from
      Kuhn-Struik Theorem 1: 1.0000, 1.09375, 1.11960, 1.12618, 1.12783 at
      L = 1, 4, 16, 64, 256; limit 2/sqrt(pi) = 1.12838; model exponent_rho =
      -0.5 + 0.01946 = -0.4805. The range condition L << N^(1/4) is violated at
      the toy L beyond about 20 to 30; the model value is a design expectation.
    D-9_admissible_ranges: >-
      KR: per-target units are at least one attempt (w units), so the
      relation-attempt count is uncapped and KR is unbounded above; it is
      bounded below by a_pred / (A(mu) MAX_ATTEMPTS) (rho_rel >= 1/A(mu) at
      the minimum relation count B, a_bar <= MAX_ATTEMPTS). FR: mean
      per-target units lie in [w, MAX_ATTEMPTS w]. d_sigma: in the reuse arm
      per-target cost is flat in L, so log2 cost(L) = log2(S/L + p) and the
      slope lies in (-1, 0); minus sigma_pred gives (-1 - sigma_pred,
      -sigma_pred). exponent_rho: log2(mean / L) = log2 c(L) + log2 W1 - 0.5
      log2 L identically. KR x FR = (S / mean / K_pred) (mean / (a_pred w)) =
      relation attempts / (B A(mu)) = rho_rel, an identity.
    D-10_pattern_classification: >-
      Hand classification with the version-3 bands (binary nominal KR [0.8508,
      1.1754], FR [0.8767, 1.1406]; CTRL-ZN KR [0.6412, 1.5597], FR [0.7234,
      1.3823]; T_delta [0.7380, 0.8556] at B = 512 and [0.6793, 0.9144] at
      B = 128; T_cmp half-width about 0.209 at nominal, dominated by the
      control's graph term). P1: every residual 0, KR = FR = 1, d_sigma = 0:
      PASS on all cells; the nulls KR 0.0122 and 0.0026, FR 81.7 and 380.7,
      d_sigma +0.712 and +0.758 are outside every band; pools give exponent
      -0.4805: G1 passes; POSITIVE. P2 (delta 0.70, u 0.49): T_delta low;
      a_bar = 1/(1 - e^-0.49) = 2.5815, FR = 1.2133 above 1.1406 (low), KR =
      0.8242 below 0.8508 (low), d_sigma +0.020 (pass), T_u and T_a 0, T_cmp
      -0.145 against 0.209 (pass): LOW-COV. P3 (delta 0.88, u 0.7744): T_delta
      high; a_bar 1.8552, FR 0.8720 just below 0.8767 (high), KR 1.1468
      (pass), d_sigma -0.014, T_cmp +0.139 against 0.218 (pass): HIGH (HIGH by
      T_delta alone if FR passes). P5 (delta 0.70, u 0.49, a_bar 2.0408):
      T_delta low; T_a difference -0.541 against 0.164 (high); FR 0.9592 and
      KR 1.0425 pass; T_cmp pass: SPLIT; with P2's BIN-KOB-19 LOW-COV the pair
      is H1-NEGATIVE-DEVIANT. P6 (a_bar 1.3 x 2.1276 = 2.7659, rho_rel 1.1765,
      kappa 0.85 x 0.6321): T_a +0.638 against 0.126 (low); FR 1.30 (low); KR
      0.905 (pass); d_sigma +0.010 (pass); coverage tests pass: LOW-RETRY;
      kappa z = (0.5373 - 0.6321) / 0.00785 = -12.1, a deficit on both:
      H1-NEGATIVE-YIELD. P7: P6 with an IR-11 discrepancy: H1-ARTIFACT. P8
      (a_bar about 811): T_a, FR (381), KR (0.0026) and d_sigma (+0.746) low,
      coverage pass: LOW-RETRY; kappa nominal, z = 0, no deficit:
      H1-NEGATIVE-DEVIANT. P9: KR_null = FR_null = 1, d_sigma_null = 0, inside
      every band: IR-9. P10: delta 0.96 at or above 0.95: IR-10. P11: IR-5
      (b). P12 to P14: a binary cell halted (AR-MU; audit 127 targets below
      128; one abandoned target): INCOMPLETE on both axes. P15: exponent
      -0.5 + 0.1206 = -0.379 outside [-0.6, -0.4], pools above 1.3, all inside
      [0.5, 2]: H2-NEGATIVE. P16: pool 1.35 above 1.3 on BIN-KOB-19 only:
      H2-MIXED. P17: pool 2.3 outside [0.5, 2]: IR-3b, H2-ARTIFACT. P18
      (CTRL-ZN delta 0.66, u 0.4356): T_delta below 0.6793 (low); a_bar
      73.96, FR 1.4530 above 1.3823 (low); KR 0.6882 (pass); d_sigma +0.055
      (pass): LOW-COV, G1 fails, RUN-ARTIFACT. P19: IR-2 fired: RUN-ARTIFACT.
    D-11_per_cell_bands: >-
      am_bands: s_lnFR^2 = (1 - p)/n_t + (g s_lnu)^2, s_lnKR^2 = exp(-mu)/B +
      s_lnFR^2, bands exp(+-3.5 s). CTRL-ZN (B = 128, mu = 0.0312498, n_t =
      1365): s_lnFR = 0.092492, s_lnKR = 0.126991; 3.5 s = 0.323722 and
      0.444469; FR [0.72345, 1.38226], KR [0.64116, 1.55966]. Binary nominal
      (B = 512, mu = 1): s_lnFR = 0.037584, s_lnKR = 0.046163; 3.5 s =
      0.131543 and 0.161571; FR [0.87674, 1.14059], KR [0.85081, 1.17536]. The
      bands use the cell's measured B_c, mu_c and n_t. A two-sided 3.5-sd
      normal tail is 0.047 percent. Assumptions disclosed: log-normality of
      KR and FR (mild skew of the relation-attempt sum, skewness about
      2/sqrt(B)); independence of the relation-attempt count and the graph
      structure (legs uniform under H1). The C-4 Monte Carlo checks both.
    D-12_tw01_c_range: >-
      R2-J4-1. At c = 1 the critical log2 C sits 1.3969, 1.3607, 1.3468,
      1.3379 and 1.3360 bits under T_gen at B = B_cap(m), m = 4, 5, 6, 8, 16,
      and the m = 4 envelope closes at log2 C 1.0080 bit under T_gen(4)
      (TASK-20260929-45204f J1 information_only). With rho(L) = c rho_1
      sqrt(L), 4ab < 1 reads C^2 below a constant times c^2 when the LA term
      is negligible, so the critical log2 C rises by log2 c; at the m = 4 cap
      and on the envelope, where the LA term is not negligible, the shift is
      within about 0.01 bit of log2 c at c = 2.15 and 2.36 (margins 0.29 and
      0.15 at the m = 4 cap, 0.26 and 0.12 at m = 5, the envelope closing 0.10
      and 0.24 bit ABOVE T_gen(4); TASK-20260929-594e8d J4-D1). The
      containment clause (every non-empty window's antecedent C is below
      T_gen) therefore holds for c below 2^margin: about 2.01 over the
      committed m = 4 range (2^1.0080) and about 2.52 to 2.63 at B = B_cap(m)
      (2^1.3360 to 2^1.3969); it holds at Kuhn-Struik's c = 1.128 (margins
      1.19, 1.22, 0.83 bit at m = 5, m = 4 cap, m = 4 envelope) and fails on the
      m = 4 envelope at the Bernstein-Lange constants 2.15 and 2.36.
    D-13_i1_selftest_trace: >-
      Hand trace of fixture_code i1_selftest. Rows in order: x0 + x1 (pivot
      0); x0 - x1 reduces by pivot 0 to -2 x1 (pivot 1, normalised to x1);
      x1 + x2 reduces to x2 (pivot 2); 2 x3 (pivot 3, normalised); x3 - x4
      reduces to -x4 (pivot 4); x5 - x6 (pivot 5 with column 6 free). The row
      x0 + x2 with the consistent right-hand side reduces to zero: dependent;
      with right-hand side plus 1: inconsistent, and the elimination is not
      changed. solve_all in reverse order: column 5's row keeps column 6 (not
      determined); columns 4, 3, 2, 1 are singletons; column 0's row reduces by
      pivot 1 to a singleton. The determined set is {0, 1, 2, 3, 4} with the
      seeded values; touched {0, ..., 6}.
    D-14_order_certificate: >-
      AR-ORDER, version 3. Route 1: the trace count #E = 2 + 2 #{x != 0 :
      Tr(x + A + B/x^2) = 0}, 2^19 trace evaluations (the CERTBIN routine's
      pure-Python branch). Route 2, the Hasse certificate: h q (BIN-ORD-19:
      h = 2, pointer q = 261823; BIN-KOB-19: h = 4, pointer l = 130873) with q
      proved prime by deterministic Miller-Rabin, a seeded point P with [h]P
      != O and [h q]P = O, so q divides #E; since q > 4 sqrt(2^19) (about 2896),
      at most one multiple of q lies in the Hasse interval |#E - 2^19 - 1| <=
      2 sqrt(2^19), and it must equal h q. For BIN-KOB-19 the Lucas
      recurrence is a third route (TASK-20260928-d5024b E06). The version-2
      naive count enumerates 2^38 (x, y) pairs and is removed (RB-S3).
    D-15_coset_factor: >-
      With F_i = F intersected with the i-th coset of G (index h), the mean
      number of ordered pairs of F summing to a uniform element of G is
      sum_i |F_i| |F_-i| / |G|, against |F|^2 / #E for a uniform element of E.
      F is closed under negation, so |F_-i| = |F_i| and the ratio is h sum_i
      |F_i|^2 / |F|^2, at least 1 with equality iff F is balanced over the
      cosets (Cauchy-Schwarz). It is quadratic in the imbalance (a 3 percent
      imbalance at h = 2 changes it by about 1e-3). It is reported per binary
      cell with the coset counts, not gated; mu_c stays |F|^2 / (2 #E).

