  # ---------------------------------------------------------------------------
  admissible_ranges:
    rule: >-
      For every gated observable, the set of values it can take for
      ARBITRARY data under the contract's admission and fit rules, beside its
      pass band. None is confined inside its pass band; each can fail on both
      sides unless noted. Version-3 bands are per cell (am_bands).
    reduction_in_the_reuse_arm: >-
      R2-J3-3, stated. In the reuse arm the per-target units are attempts x
      w_c and do not depend on L by construction. Hence FR = a_bar /
      a_pred(mu_c) EXACTLY (AM2 tests the attempts law at u_pred, a
      re-normalised T_a, not flattening); KR x FR = rho_rel EXACTLY, so KR =
      rho_rel a_pred / a_bar (AM1 adds the relation-phase yield rho_rel); and
      d_sigma = sigma_pred(KR K_pred) - sigma_pred(K_pred) up to per-L
      sampling noise, so AM3 is a function of KR. AM1 to AM3 reduce to the
      pair (rho_rel, a_bar). AM3 is DOMINATED by AM1: it passes for KR in
      about [0.509, 2.083] on CTRL-ZN and [0.421, 3.651] on a binary cell
      (TASK-20260929-594e8d J3-D3), strict supersets of the version-3 KR bands
      [0.641, 1.560] and [0.851, 1.175], so it adds no independent failure
      region in the reuse arm. The L-DIMENSION of the amortisation law is NOT
      TESTED by the reuse arm as designed; AM3 is kept because the no-reuse
      null's L-dependence shows on it (d_sigma_null about +0.7).
    items:
      - observable: AM1 knee ratio KR = (shared_units / mean per-target units) / K_pred = rho_rel a_pred / a_bar
        admissible: "(a_pred / (A(mu) x 100000), infinity): about (1.6e-5, infinity) on CTRL-ZN and (1.3e-5, infinity) on a binary cell; rho_rel is uncapped"
        pass_band: per cell exp(+-3.5 s_lnKR); design CTRL-ZN [0.641, 1.560], binary nominal [0.851, 1.175]
        can_fail: both sides
      - observable: AM2 flattening ratio FR = a_bar / a_pred(mu_c)
        admissible: "[1 / a_pred, MAX_ATTEMPTS / a_pred]; about [0.0196, 1965] on CTRL-ZN, [0.470, 47002] on a binary cell"
        pass_band: per cell exp(+-3.5 s_lnFR); design CTRL-ZN [0.723, 1.382], binary nominal [0.877, 1.141]
        can_fail: both sides
      - observable: AM3 d_sigma = fitted slope over ALL L cells minus sigma_pred
        admissible: "in the reuse arm (-1 - sigma_pred, -sigma_pred) up to per-L noise: about (-0.360, +0.640) on CTRL-ZN and (-0.168, +0.832) on a binary cell; with per-L means free, unbounded"
        pass_band: "[-0.10, +0.10]"
        can_fail: both sides (dominated by AM1 in the reuse arm)
      - observable: T_delta delta_hat = determined columns / B_c
        admissible: "[0, 1]; at or above 0.95 fires IR-10"
        pass_band: "delta_inf +/- 3.3 x 0.403 / sqrt(B_c): [0.679, 0.914] at B = 128; [0.738, 0.856] at B = 512"
        can_fail: both sides
      - observable: T_u u_hat - delta_hat^2
        admissible: "[-delta_hat^2, 1 - delta_hat^2]"
        pass_band: "+/- 3 sqrt(delta_hat^2 (1 - delta_hat^2) / n_dec)"
        can_fail: both sides
      - observable: T_a a_bar - 1/p (attempts), p = 1 - exp(-mu_c u_hat)
        admissible: "[1 - 1/p, MAX_ATTEMPTS - 1/p]"
        pass_band: "+/- 3 sqrt(1 - p) / p / sqrt(n_t) (conservative: z-sd 0.79 to 0.86 under the model)"
        can_fail: both sides
      - observable: T_cmp u_hat(binary) - u_hat(CTRL-ZN)
        admissible: "[-1, 1]"
        pass_band: "+/- 3.3 sqrt(var_c + var_ZN)"
        can_fail: both sides
      - observable: kappa_hat target coverage (LOW-RETRY audit only)
        admissible: "[0, 1]"
        pass_band: "deficit iff z <= -3 against 1 - exp(-mu_c), z = (kappa_hat - kappa_pred) / sqrt(kappa_pred (1 - kappa_pred) / n_att)"
        can_fail: low side (one-sided by purpose)
      - observable: null arm (CTL-8) must lie OUTSIDE the cell's AM1, AM2 and AM3 bands and read KR below 0.125
        admissible: as for AM1 to AM3
        pass_band: n/a (IR-9 fires if the null lands inside any AM band)
        can_fail: IR-9 is reachable (P9)
      - observable: pooling constant c(L)
        admissible: "(0, infinity); outside [0.5, 2] invalidates the rho reading (G1 (e) on CTRL-ZN; IR-3b on a binary cell)"
        pass_band: "[0.8, 1.3] (H2)"
        can_fail: both sides inside the instrument band
      - observable: exponent_rho
        admissible: >-
          by the identity exponent_rho = -0.5 + LS slope of log2 c(L) on
          log2 L, and c(L) in [0.5, 2]: [-0.8, -0.2]; given the pooling band,
          [-0.605, -0.395] (disclosed link; the exponent band adds two
          slivers).
        pass_band: "[-0.6, -0.4]"
        can_fail: both sides

  # ---------------------------------------------------------------------------
  outcome_reachability:
    rule: >-
      R2-J3-6. For each declared outcome, a per-cell pattern built from
      GENERATIVE quantities through the reuse-arm identities (fixture_code
      gen_values: u = delta^2 unless set; a_bar = a_ratio / (1 - exp(-mu u));
      FR = a_bar / a_pred(mu); KR = rho_rel / FR; d_sigma =
      sigma_pred(KR K_pred) - sigma_pred(K_pred) over L_IC; n_dec = n_t a_bar
      mu; kappa_hat = kappa_ratio (1 - exp(-mu))) and the null identities
      (gen_null: K_null = 1/q_null, KR = K_null / K_pred, FR = q_null rho_rel
      K_pred, d_sigma = sigma_pred(K_null, L_NULL) - sigma_pred(K_pred,
      L_NULL)). Every pattern is data the reuse arm can produce. The patterns
      are coded in fixture_code outcome_patterns with these expected
      assignments, and outcome_patterns_main exits 0 iff the committed
      classifiers reproduce every one (a review computation; no group, no
      oracle, no measurement). The hand classifications are in D-10.
      Nominal: CTRL-ZN B = 128, mu = 0.0312498; binary B = 512, mu = 1;
      n_t = 1365; delta = delta_inf; a_ratio = rho_rel = kappa_ratio = 1;
      pools the Kuhn-Struik values 1.0, 1.094, 1.120, 1.126, 1.128; nulls
      q_null = 1.
    patterns:
      - {id: P1, pattern: 'every cell nominal; nulls nominal', classes: 'PASS, PASS, PASS; G1 passes', assigned: 'H1-POSITIVE, H2-POSITIVE, POSITIVE'}
      - {id: P2, pattern: 'both binary delta 0.70 (u 0.49; a at the conditional law; FR 1.213, KR 0.824, d_sigma +0.020)', classes: 'LOW-COV, LOW-COV', assigned: 'H1-NEGATIVE-COVERAGE, H2-POSITIVE, NEGATIVE'}
      - {id: P3, pattern: 'both binary delta 0.88 (u 0.7744; FR 0.872, KR 1.147)', classes: 'HIGH, HIGH', assigned: 'H1-NEGATIVE-DEVIANT, H2-POSITIVE, NEGATIVE'}
