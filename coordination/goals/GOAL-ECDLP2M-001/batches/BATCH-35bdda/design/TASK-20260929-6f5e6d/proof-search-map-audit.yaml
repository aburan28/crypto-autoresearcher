  kn_tech_080_audits:
    audit_1_bottleneck_and_baseline_embedding:
      status: filled
      bottleneck: >-
        Whether an arity-m oracle at the cap locus has per-attempt cost C
        below sqrt(N_prime / B_cap) up to the disclosed constants. Every other
        quantity of the preprocessing row is model arithmetic. The question
        this row is built to inform is DEC-20260928-63addc S1
        decision_it_changes (whether the reachability table carries a second
        budget row and how m >= 4 oracle records are read against it); that
        is a Coordinator decision after the run, not a claim of this record.
      parameter_slices: >-
        (i) L = 1. The L = 1 slice of model M_m reproduces a single-target
        product law term by term, and WHICH law depends on the attempt
        convention. At m = 4 on the sub-cap base log2 B = 29.036035 the
        attempts are 1/mu = 2^19.44 in both the model (smooth A(mu)) and the
        D3 definition, so the slice reproduces the pinned D3 tie. AT THE
        FROZEN INPUTS (C = 2^11.010251, log2 B = 29.036035; R2-J1-1) the model
        terms give b - 1 = -1.14e-7, log2(IC(1)/rho_1) = -1.63e-7 and a g = 0
        lower root log2 L_lo = -3.25e-7, and the L = 1 tie budget is
        11.010251407, that is 4.07e-7 bit above D3_4 (TASK-20260929-45204f
        J1-D1 and J1 item iv; TASK-20260929-594e8d J4-O6 and PTM-B; the
        committed version-2 stage0.py printed the same values). L = 1 lies
        formally inside the g = 0 window by about 3e-7 in log2 L, and the
        contract's TIE RULE (|log2 L_lo| below 1e-4 is the L = 1 tie, never
        an advantage) is LOAD-BEARING at the frozen m = 4 input: without it
        the frozen-input model would read a formal L = 1 advantage of 1.6e-7
        bit. At m = 5 on B = B_cap(5) the model charges A(1) = 1.582 attempts
        per relation while D3 charges one, so the slice reproduces the
        1.58-attempt (proposal-convention) single-target law: at the frozen
        proposal input 32.414212 the model gives b - 1 = 9.9e-6,
        log2(IC(1)/rho_1) = 1.43e-5 and log2 L_lo = 2.87e-5 (the tie, under
        the tie rule); the tie budget sits 0.66174 bit below D3(5) (the
        stated -log2 A(1) = -0.66173); and at C = 2^33.075936 (D3) it reads
        log2(IC(1)/rho_1) = 0.6078, not the tie. The version-2 residuals
        (4e-7, 8e-7, 1.3e-8) were the values at the UNROUNDED high-precision
        comparators (D3(4) = 11.010252423), not at the frozen inputs; they are
        withdrawn as frozen-input statements. (ii) C = T_gen reproduces the
        generic frontier point: B_cap T_gen = P_gen, an algebraic identity
        (PTM-A). (iii) m = 23 with B = 524 known-log points is
        IDEA-20260926-178821's zero-relation row as the L = 1, S = 524
        endpoint (cited by id; not re-derived).
      symbolic_check: >-
        log2(B_cap T_gen) - log2 P_gen = log2 B_cap + (log2 N_prime - log2
        B_cap)/2 - (log2 N_prime + log2 B_cap)/2 = 0 identically. At g = 0 in
        the m = 5 D3 convention b = 1.523877 and log2 L_lo = 1.2155 (D3
        charges one attempt per relation, M5 charges A(1)); the m = 5
        proposal-convention and m = 4 sub-cap values at the frozen inputs are
        those of parameter_slices (i). stage0_code prints every L = 1
        quantity from the model terms, so each can fail (S0 tolerances 1e-4,
        0.01, 0.001).
      frozen_fixture: >-
        fixture_code below (binstd_core.py): the Stage 1 gate G1 on CTRL-ZN,
        standard library only, import-safe, with its pass criterion stated
        before execution in its docstring, in fixture_pass_criterion and in
        EXP-BINSTD-8cb697 stages.stage_1. The same module is the instrument
        code (I1, I2, the IC arms, the bands, the gates, the classifier, the
        IR-5 check, the target-coverage audit and stage2_outcome) that the
        Stage 2 driver imports unchanged, so the gate tests the instruments
        Stage 2 reads. Not a plan: code.
    audit_2_observation_collision:
      status: filled
      observable: >-
        The per-cell tests T_delta (determined fraction), T_u (usable
        probability per decomposition), T_a (attempts per target), T_cmp
        (binary against control) and the amortisation gates AM1 (KR), AM2
        (FR), AM3 (d_sigma), plus target coverage kappa_hat (reported, and
        read by the LOW-RETRY audit). REDUCTION (R2-J3-3): in the reuse arm
        the per-target units are attempts x w and do not depend on L by
        construction, so FR = a_bar / a_pred(mu_c) exactly, KR x FR =
        rho_rel exactly (rho_rel = relation attempts / (B_c A(mu_c))), and
        d_sigma = sigma_pred(KR K_pred) - sigma_pred(K_pred) up to per-L
        sampling noise; AM1 to AM3 reduce to the pair (rho_rel, a_bar), AM3
        is dominated by AM1, and the L-dimension of the amortisation law is
        NOT tested by the reuse arm as designed.
      collision_found: >-
        YES, and each preimage is separated or routed to a declared non-POSITIVE
        outcome. (O1) genuine reuse: KR, FR about 1, d_sigma about 0. (O2)
        an over-complete relation set (R = 4B): delta_hat about 0.9993, above
        0.95, so IR-10 invalidates the cell (H1-ARTIFACT); this preimage is
        not producible by the committed run_ic_shared, which stops at exactly
        B relations, so the delta test is the live guard (CTL-6 restated,
        R2-J3-7). (O3) the no-reuse null (fixed setup plus an independent
        per-target solve, identical accounting): run as the CTL-8 null arm on
        CTRL-ZN and BIN-ORD-19; KR about 1/K_pred, FR about rho_rel K_pred,
        d_sigma about +0.71 and +0.76 (D-5); it must lie outside every AM band
        of its cell and read KR below 0.125, else IR-9 (separated by factors
        of about 40 to 400 in the version-2 reviewer Monte Carlo,
        TASK-20260929-594e8d PTM-D). (O4) coverage-limited reuse (legs on
        undetermined columns): T_delta or T_u or T_cmp low, class LOW-COV;
        both binary cells LOW-COV is H1-NEGATIVE-COVERAGE. (O5) a
        KN-FIND-007-direction yield deficit (target coverage below the Poisson
        value at matched mean): T_a low (AM2 low when strong), coverage tests
        pass, class LOW-RETRY, with kappa_hat below 1 - exp(-mu_c); both
        binary cells LOW-RETRY with that deficit, after a clean completeness
        audit, is H1-NEGATIVE-YIELD. (O6) the no-reuse null fed as if it were
        the reuse arm (PTM-D counterfactual): LOW-RETRY with target coverage
        NOMINAL, so H1-NEGATIVE-DEVIANT, never POSITIVE and never YIELD. (O7)
        an oracle that misses decompositions (an instrument defect): caught
        by the completeness audit IR-11 (H1-ARTIFACT) or by the step 2
        self-test AR-ORACLE (S3, INCOMPLETE), never routed to NEGATIVE
        through LOW-COV (R2-J2-1; residual gap in open_issues OI-5).
      separating_conditions: >-
        Two-sided per-cell bands on every gated observable; the CTL-8 null
        arm wired into IR-9 (and G1 (b) on CTRL-ZN); CTL-6 (delta test plus
        integrity assertion) wired into IR-10 and G1 (c); the two-sided
        T_cmp; target coverage kappa_hat in the LOW-RETRY audit; the
        completeness audit IR-11 and the step 2 self-tests under S3;
        CERT-LOG, which certifies the stored vector; setup operations kept
        out of shared_units by the integrity assertion.
    audit_3_quantifier_order:
      status: filled
      statement: >-
        FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at base
        size B, under A1 to A6 and H1: IC(L) = T_shared(B, C) + L
        per_target(B, C), and at B = B_cap the leading-order precomputation
        equals P_gen at C = T_gen. FOR ALL g below the critical value THERE
        EXISTS a non-empty window of L on which IC(L) < c rho_1 sqrt(L) holds
        under H2 with c = 1. NOT CLAIMED: that any oracle has C at or below
        any budget; that any point lies below the generic frontier.
      witness_dependence: >-
        The window endpoints depend on m, g, the base size B AND the generic
        multi-target constant c: log2 L_hi moves by +2 log2 c, and the
        critical log2 C (hence the critical and closing g) by about +log2 c
        (R2-J4-1; +0.17, +1.10, +1.24 bit at c = 1.128, 2.15, 2.36; exact
        when the LA term is negligible, within about 0.01 bit at the tested c
        per TASK-20260929-594e8d J4-D1), so c = 1 is the narrowest window and
        the lowest critical C. At m = 5 the contract fixes B = B_cap(5); no
        m = 5 envelope is computed or promised. At m = 4 the envelope is over
        the ONE committed range log2 B in [29.036035, 35.996035]. The toy
        observables depend on the cell's measured B_c, mu_c and n_t and on
        the seed streams; they are normalised so that the predicted value is
        the same on every cell, and the per-cell bands are one function of
        (B_c, mu_c, n_t), am_bands.
      failure_mode_checked: >-
        A witness depending on the target set (leakage between L cells) is
        excluded by disjoint fresh targets with recorded seed labels; the null
        arm's targets (t = 1365 to 1385) are disjoint from the reuse arm's
        (t = 0 to 1364).
    audit_4_method_ceiling_and_nearby_object_control:
      status: filled
      ceiling: >-
        The strongest certifiable claim (H-BINSTD-099d93
        proof_search_map.method_ceiling): a frontier column with its
        conventions, the pinned D3 column, the m = 5 window at B = B_cap(5),
        the m = 4 slices and envelope on one range, and a toy validation at
        m = 2, on two binary n = 19 cells and a relabelled Z/NZ control, of
        the three per-cell laws the reuse arm can test (relation-phase yield,
        attempts law, determined-column law) with the no-reuse null
        separated, and of the pooled law under H2. It never certifies C at
        n = 131 for any oracle, never a window at deployed L, never the
        L-dimension of the amortisation law, and never a point below the
        frontier.
      nearby_objects: >-
        The relabelled Z/NZ group (N the least prime above 2^20, base 2^7,
        mu about 1/32) with the enumeration oracle, where the random model of
        H1 holds by construction (Stage 1 gate), now with bands scaled to its
        own regime; the ordinary against the Koblitz n = 19 cell (CTL-2,
        wired as H1-MIXED and H2-MIXED); the no-reuse null (CTL-8, PTM-D);
        PTM-A; PTM-B (the L = 1 slices from the model terms, with the tie rule
        load-bearing at m = 4); PTM-C (the m = 5 window empty at g = 14;
        identical normalised predictions on all three cells and, since
        version 3, equal per-cell false-fail rates by construction of the
        bands). A same-regime Z/NZ control at B = 512 and mu about 1 was
        considered and not added (g1_calibration.remedy_choice).
      closed_form_cross_check: >-
        With a = kappa_m C / rho_1 and b about A(1) B_cap C / rho_1, 4ab = 1
        gives C_crit = T_gen sqrt(pi / (8 A(1) kappa_m)), so g_crit =
        (T_gen - c0) + (1/2) log2(pi / (8 A(1) kappa_m)) less a small LA
        correction: 12.256 at m = 5 (D3 convention) and log2 C_crit = 42.144
        at the m = 4 cap slice (exact quadratic 42.138). stage0_code computes
        both routes and self-checks them within 0.05.
    strictness_obligation:
      status: not_applicable
      not_applicable_reason: >-
        No strict improvement over any baseline is claimed. The proposal's
        clause that an oracle below T_gen would be the first ECDLP algorithm
        below the S T^2 = N_prime line is tripwire TW-01 and is excluded from
        every outcome, prediction and success criterion
        (EXP-BINSTD-8cb697 outcome_table.never_an_outcome and
        outcome_table.tw01_caution; tripwire_preregistration below).
    interface_obligations:
      status: filled
      items:
        - The lift from L = 1 to L targets (boundary_lift) is exact under A1 to A6; which single-target law the L = 1 slice reproduces is stated per convention (audit_1 parameter_slices).
        - The projection interface pi_G from base points to subgroup classes may merge columns; the merge count is reported; columns are classes, never points.
        - >-
          UNIT INTERFACE (A6 of H-BINSTD-099d93). At deployed parameters
          T_shared adds B A(mu) C, in group-operation equivalents, to k m B^2
          modular multiply-adds (k = 1, the LA iteration constant, a hidden
          cofactor listed with its sensitivity, R2-J1-3) at an assumed
          one-to-one rate, a MODEL ASSUMPTION inherited from the pinned
          product law and the D3 column. On the toy cells no unit is crossed:
          oracle work units, group operations and la_ops are separate columns
          and every gated observable is a ratio of oracle work units.
        - "The ambient interface: decomposition counts in the full group (N = 4r on ECC2K-130; #E = 2q and 4l on the binary toys; N on CTRL-ZN); targets in the prime-order subgroup; rho on N_prime at deployed parameters and on the subgroup order on the toys. The coset factor h sum_i |F_i|^2 / |F|^2 (at least 1, equal to 1 iff F is balanced over the cosets of G) is reported per binary cell."
        - >-
          The comparator interface: the windows use c rho_1 sqrt(L) with
          c = 1 (H2 (i)); the frontier column uses S T^2 = N_prime in 129-bit
          words at N_prime = r/262 (H2 (ii)); the conventions travel with the
          column (EXP-BINSTD-8cb697 definitions.column_conventions).

