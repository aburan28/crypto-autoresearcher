      - {id: P6, pattern: 'both binary KN-FIND-007 yield deficit (a_ratio 1.3, rho_rel 1/0.85, kappa_ratio 0.85; FR 1.30, KR 0.905); audits clean', classes: 'LOW-RETRY, LOW-RETRY; coverage deficit z about -12 on both', assigned: 'H1-NEGATIVE-YIELD, H2-POSITIVE, NEGATIVE'}
