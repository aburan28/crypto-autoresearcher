        chk("m4_tie_minus_D3", m4["sub_cap_slice"]["tie_minus_D3"], DESIGN["m4_tie_minus_D3"], 1e-4)
        chk("m5_L1_log2_IC_over_rho_D3", m5["L1_log2_IC_over_rho_D3"], DESIGN["m5_L1_log2_IC_over_rho_D3"], 0.01)
        chk("m5_L1_log2_IC_over_rho_prop", m5["L1_log2_IC_over_rho_proposal"], DESIGN["m5_L1_log2_IC_over_rho_prop"], 1e-4)
        chk("m5_tie_minus_D3", m5["tie_minus_D3"], DESIGN["m5_tie_minus_D3"], 0.001)
        chk("m8_candidate_reconstruction_mu2", out["m8_candidate_reconstruction_mu2"],
            DESIGN["m8_candidate_reconstruction_mu2"], 0.01)
        for key, tol in (("delta_inf", 1e-5), ("u_pred", 1e-5), ("tau", 1e-5), ("u_touched", 1e-5),
                         ("a2_mu1", 1e-4), ("mu_ZN", 1e-6), ("a2_ZN", 0.01), ("K_pred_ZN", 0.01),
                         ("sigma_ZN_L_IC", 0.005), ("sigma_ZN_L_NULL", 0.005),
                         ("sigma_nominal_L_IC", 0.005), ("sigma_nominal_L_NULL", 0.005),
                         ("single_acceptance_mu1", 0.001)):
            chk(key, h1[key], DESIGN[key], tol)
        chk("K_pred_nominal", h1["K_pred_nominal"], DESIGN["K_pred_nominal"], 0.05)
        chk("N_ZN", h1["N_ZN"], DESIGN["N_ZN"], 0)
        for name, v in DESIGN["dp_bits"].items():
            chk("dp_bits." + name, h1["dp_bits"][name], v, 0)
        for L, c, v in zip(L_RHO, ks, DESIGN["ks_c"]):
            chk("ks_c." + str(L), c, v, 0.001)
        chk("ks_exponent", out["kuhn_struik"]["model_exponent_rho"], DESIGN["ks_exponent"], 0.001)
        chk("shift_bits_advice", -0.5 * LOG2(129), DESIGN["shift_bits_advice"], 0.001)
        chk("shift_prime_order", 0.5 * LOG2(262), DESIGN["shift_prime_order"], 0.001)

        out["self_checks"] = {
            "identity_all_below_1e-9": all(abs(r["identity_residual"]) < 1e-9 for r in out["rows"].values()),
            "LA_below_Pgen_all": all(r["P_gen_minus_LA"] > 0 for r in out["rows"].values()),
            "rho_forms_agree": abs(out["rho_form_difference"]) < 1e-9,
            "frozen_D3_4_reproduces": abs(out["rows"][4]["D3_recomputed"] - D3_4) < 1e-4,
            "frozen_D3_5_reproduces": abs(out["rows"][5]["D3_recomputed"] - D3_5) < 1e-4,
            "frozen_PROP_5_reproduces": abs(out["rows"][5]["D3_mu1_convention"] - PROP_5) < 1e-4,
            "frozen_X_SUB_reproduces": abs(out["rows"][4]["sub_cap_log2_B"] - X_SUB) < 1e-4,
            "grid_last_point": abs(grid[-1] - M4_RANGE[1]) < 1e-9 and len(grid) == M4_POINTS,
            "closed_form_m5_within_0.05": abs(m5["D3_convention"]["critical_g"] - m5["closed_form_critical_g_D3"]) < 0.05,
            "closed_form_m4_cap_within_0.05": abs(m4["cap_slice"]["critical_log2_C"]
                                                  - m4["cap_slice"]["closed_form_critical_log2_C"]) < 0.05}
        out["design_comparisons"] = checks
        out["S0_pass"] = all(c["ok"] for c in checks) and all(out["self_checks"].values())
        return out


    def main(argv):
        out = compute()
        path = argv[1] if len(argv) > 1 else "stage0.json"
        with open(path, "w") as fh:
            json.dump(out, fh, indent=1)
        m4 = out["m4"]
        summary = {k: v for k, v in out.items() if k not in ("m4",)}
        summary["m4_slices"] = {"sub_cap_slice": m4["sub_cap_slice"], "cap_slice": m4["cap_slice"]}
        summary["m4_envelope"] = {k: v for k, v in m4["envelope"].items() if k != "per_B"}
        summary["failed_comparisons"] = [c for c in out["design_comparisons"] if not c["ok"]]
        print(json.dumps(summary, indent=1, default=str))
        return 0 if out["S0_pass"] else 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv))

