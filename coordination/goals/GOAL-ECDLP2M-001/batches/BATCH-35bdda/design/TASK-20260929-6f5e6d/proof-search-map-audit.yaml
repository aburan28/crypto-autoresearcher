      At mu = 1 a random target has at least one decomposition with
      probability 1 - e^-1 = 0.632121, so attempts per success are 1/(1 -
      e^-1) = 1.581977 = 2^0.661728. The pinned D3 column is defined as one
      attempt per relation at the re-optimised base; the absorbed record's
      mu = 1 values at m = 5, 6 charge 1.58 attempts; they differ by that
      0.66 bit and agree to 0.01 and 0.03 bit once it is applied. At m = 4
      the pinned budget is the sub-cap optimum where attempts are 1/mu =
      2^19.44 under both conventions, so 11.01 matches 11.0.
    residual_at_m8: >-
      RECORDED AS A DEFINITIONAL DIFFERENCE, not resolved. Under the record's
      own m = 5, 6 convention the m = 8 value would be 41.86; the record
      wrote 42.2 (+0.34). One candidate reconstruction (the mu = 2 point,
      42.187) is offered, not attributed.
    claim_A_mislabel_noted: >-
      IDEA-20260926-4b65e3 claim (A) reads the finding's m = 4 value 2^-4.41
      as a per-attempt budget; CORR-20260928-4cb669 pins it as D1, a total-cost
      gap. Noted, not repeated.
