  audit_1_bottleneck_and_baseline_reproduction:
    status: present
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on E(F_2^n) for a binary
      Koblitz curve, read AS EXCESS BEYOND THE CERTIFICATE'S EXACT COMPONENTS:
      against the arm's own histogram-preserving shuffle stratified by the
      exact quotient (h4 on a Koblitz cell, h2 on an ordinary cell) and against
      the exact-saturated random-label null q r + e of the same (cell, M).
      Every other quantity of the k-list route is fixed by the certificate and
      the Stage 0 arithmetic. Decision-changing because the k-list column is a
      prose closure by Theorem C and either outcome replaces it with a quantity
      scoped to the declared arms and tested cells.
    baseline_reproduced_symbolically:
      - slice: Z/2^n with h the low log2(M) bits
        reproduction: carried; the quotient onto Z/M reads G = M exactly; blocking run-level control PC-1 at every declared alphabet at its declared S.
      - slice: the composite toy cell Z/(4 x 137 x 239) = Z/130972
        reproduction: carried; twelve divisors, 548 and 956 exact, capacity below 239 log2(137) = 7.0980 bits; blocking PC-5 at S = 2^26 and 2^27.
      - slice: Z/lZ with the log-interval key i -> floor(i M / l)
        reproduction: >-
          carried; an approximate filter with G about M/2. Version 3 runs it
          three ways through the contract's own LEAD rules: along the ladder at
          the N^(1/3) alphabets (PC-16, excess growing with M), at the fixed
          alphabet M = 16 on all three primes (PC-16b, standardised excess flat
          by construction) and as planted mixtures with rho 1, 0.9 and 0.8 at
          M = 16 (PC-16c, excess decaying along the ladder).
      - slice: Z/(16 x 2003) and Z/(64 x 2003) with the exact label i mod M and strata i mod 4
        reproduction: >-
          NEW (RR-10). An exact filter whose content exceeds the stratum: under
          the shuffle stratified by i mod 4 it must collapse to the
          exact-saturated null 4 r + (i mod 4). Blocking run-level control PC-6c.
      - slice: the k-list accounting and the halving criterion
        reproduction: carried; the criterion re-derived from the group law (Q = 2P needs lam^2 + lam = x(Q) + a, solvable exactly when Tr(x(Q) + a) = 0), now corroborated at source by FHLM Lemma 4.1(iv) (IMP-FHLM).
