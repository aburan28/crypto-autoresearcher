        def poly_inverse(a, mod):
            """Inverse of a nonzero a modulo the irreducible mod over F_2, by the
            extended Euclidean algorithm."""
            if a == 0:
                raise ZeroDivisionError("inverse of zero")
            r0, r1 = mod, a
            s0, s1 = 0, 1
            while r1:
                qq, rem = 0, r0
                d1 = r1.bit_length()
                while rem and rem.bit_length() >= d1:
                    sh = rem.bit_length() - d1
                    qq ^= 1 << sh
                    rem ^= r1 << sh
                r0, r1 = r1, rem
                s0, s1 = s1, s0 ^ core.clmul(qq, s1)
            if not (r0 == 1):
                raise ArithmeticError("not invertible")
            return core.pmod(s0, mod)


        class FastCell:
            """One declared curve cell with fast linear maps, cross-checked."""

            def __init__(self, cid):
                spec = gate.CELLS[cid]
                self.cid = cid
                self.cell = gate.CurveCell(cid, spec["n"], spec["A"], spec["B"], spec["kind"], spec["poly"])
                self.F, self.C, self.NB = self.cell.F, self.cell.C, self.cell.NB
                self.n = self.F.n
                self.A, self.B = spec["A"], spec["B"]
                self.order = spec["order"]
                self.koblitz = spec["kind"].startswith("koblitz")
                basis = [1 << j for j in range(self.n)]
                self.tmask = 0
                for j in range(self.n):
