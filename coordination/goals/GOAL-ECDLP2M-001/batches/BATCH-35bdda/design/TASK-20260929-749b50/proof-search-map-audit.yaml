                kept = est.median([est.median(rd["shuffle"]) for rd in readings]) - nulls[M]["q50"]
                if not (est.clause_L1(rows, nulls[M]) and kept >= 3.0 * nulls[M]["W"]
                        and not est.clause_L3(rows, nulls[M])):
                    fails.append("PC-6b the planted marginal-only filter is not preserved at M=%d" % M)
            sat = None
            if rec.get("pc6d_M") is not None:
                M = rec["pc6d_M"]
                sat = est.summarize_null(arms[("satnull", M)])
                readings = arms[("planted-strat", M)]
                rows = est.seed_rows(readings, sat, sat["V"])
                kept = est.median([est.median(rd["shuffle"]) for rd in readings]) - nulls[M]["q50"]
                if not (kept >= 3.0 * nulls[M]["W"] and not est.clause_L3(rows, sat)):
                    fails.append("PC-6d the stratified shuffle does not preserve the planted marginal at M=%d" % M)
            return {"cell": rec["cell"], "passed": len(fails) == 0, "failures": fails,
                    "nulls": nulls, "pc6d_saturated_null": sat}


        # ------------------------------------------------------------------ PC-9
        def dlog_table(cell, N, fac):
            """A verified generator's N-entry table, for PC-9 (carried)."""
            if hasattr(cell, "pts"):
                return cell.pts
            rng = random.Random(est.seed_of("generator", cell.id))
            g = core.find_generator(cell.C, N, fac, rng)
            if g is None:
                raise ArithmeticError("no generator of order exactly N on %s" % cell.id)
            pts, _tab = core.build_dlog(cell.C, g, N)
            return pts


        def population_gain(pts, lab_of_point, M):
            """The exhaustive value on CELL-K13: REPORTED, NOT CHECKED (RR-8)."""
            N = len(pts)
            lab = [0] + [lab_of_point(pts[i]) for i in range(1, N)]
            MM = M * M
            cnt = [0] * (MM * M)
            for i in range(1, N):
                base = lab[i] * MM
                for j in range(1, N):
                    s = i + j
                    if s >= N:
                        s -= N
                    if s == 0:
                        continue
                    cnt[base + lab[j] * M + lab[s]] += 1
            best = 0.0
            for ab in range(MM):
                row = cnt[ab * M:(ab + 1) * M]
                nab = sum(row)
