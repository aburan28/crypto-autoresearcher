        comparison the two exact-content-only labels show no controlled excess
        (E_Sh / W of -0.063 and 0.024, rank floor on 1 of 10 seeds, L3 false),
        and under the UNSTRATIFIED comparison both meet L3 (E_Sh / W of 6.1
        and 13.1, rank floor 10 of 10) - the control can fail, and the
        unstratified rule would have read them as excess, as version 2 did
        with F1. (2) XCO2 meets L1 under the stratified comparison (E_RL / W
        4.93): L1 alone is not a separator for an exact component with a
        skewed residual; this is the rule sweep's L1 false-pass mode, and L3
        blocks it, which is why LEAD needs L3 and NEG is read on L3 only. (3)
        PC-6d shape: the planted marginal keeps 12.9 uniform-null widths under
        the stratified shuffle and does not meet L3. (4) PC-6c shape: the exact
        label i mod 16 reads exactly on every seed and its stratified shuffle
        medians (5.94 to 6.26) lie at or below the saturated q99 (6.90) on
        every seed. (5) THE EXACT-SATURATED NULL at M = 16 has q50 about 6.1
        and W about 0.71 against the uniform label's 2.45 and 0.49: the L1
        floor beyond the exact components is therefore near G = 8.3 at M = 16
        on this synthetic shape, against about 3.9 for a uniform reference. A
        genuine filter must beat what the certificate's free 2 bits already
        read; that is the intended floor and it is disclosed in the rule sweep
        (L1 false-fail mode) and in the interpretation limits.

  exact_quotient_audit_table:
    source: design_computations C-4 (CODE-AUDIT, the card's code_audit_form), DESIGN FIGURES
    summary:
      - {arm: F1, purity_2: 'K13 0.925 (M 16), 0.763 (M 8); K19 0.981 (64), 0.830 (16); K23 0.989 (128), 0.965 (32), 0.907 (16); K41 0.883 (16)', purity_4: '0.000 everywhere', verdict: EXACT-CARRYING (the E/2E bit only)}
      - {arm: 'F5xF1, F5xF2@0, F5xF3@0, F5xF4', purity_2: '1.000 everywhere', purity_4: '1.000 everywhere', verdict: EXACT-CARRYING (the E/4E class by construction)}
      - {arm: 'F2 at every offset', purity_2: '0.000 everywhere', purity_4: '0.000 everywhere', verdict: not exact-carrying}
      - {arm: 'F3 at every offset', purity_2: '0.000 everywhere', purity_4: '0.000 everywhere', verdict: not exact-carrying}
      - {arm: F4, purity_2: 'at most 0.0067 (K13, M 16)', purity_4: 'at most 0.0065 (K13, M 16)', verdict: 'not exact-carrying (a few points in classes of size 2 to 7)'}
      - {arm: 'ORD-F2, ORD-F3 at every offset (CELL-O19)', purity_2: '0.000 everywhere', purity_4: not applicable, verdict: not exact-carrying}
    sampled_rows_standard_error: CELL-K23 and CELL-K41 F1 rows carry binomial standard errors 0.0001 to 0.0003; every other sampled row is 0 or 1 with standard error 0 (sample 2^20 points)
    against_the_prediction_written_before_c4: >-
      As predicted: F1 and the four F5 composites are the only EXACT-CARRYING
      arms, on every audited cell and alphabet; F2, F3, F4 and the ordinary
      arms carry no exact component. Not predicted: F1's purity_4 is exactly 0
      (its classes determine the E/2E bit and never the E/4E class), and F4
      has a trace of coset-pure mass from classes of two to seven points. The
      review plan's prior (F3 windows clean with probability 0.8, F4 0.85,
      ordinary arms 0.8) is consistent with the table.
    consequence_under_the_pass_rule: >-
      None for the procedure: every arm is already stratified (route (a)). The
      table names F1 and the F5 composites as the arms whose raw excess would
      contain exact content, so their NEG or LEAD readings are interpretable
      only through the stratified comparison, which is the only comparison the
      rules use. CODE-AUDIT is re-run at S0-6 and must reproduce this table
      (IR-24).

