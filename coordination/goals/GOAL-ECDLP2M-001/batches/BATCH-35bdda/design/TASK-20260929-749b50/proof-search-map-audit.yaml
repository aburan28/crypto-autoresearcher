            for cid, mode, alphabets in AUDIT_CELLS:
                if cell_ids and cid not in cell_ids:
                    continue
                meta, r = audit_cell(cid, mode, alphabets)
                metas.append(meta)
                rows.extend(r)
            return {"cells": metas, "rows": rows,
                    "exact_carrying": sorted({"%s %s@%s" % (r["cell"], r["arm"], r["offset"])
                                              for r in rows if r["exact_carrying"]})}


        def main(argv):
            """One JSON line per cell, per row and for the flag list."""
            out = run_audit(argv)
            for meta in out["cells"]:
                print(json.dumps({"cell_meta": meta}, sort_keys=True))
            for row in out["rows"]:
