  # ===========================================================================
  # RR-1 ROUTE CHOICE, STATED IN TEXT (and in code: CODE-EST shuffled with
  # strata; CODE-FAM arms and stage2_cell; CODE-XCO)
  # ===========================================================================
  rr1_route:
    chosen: >-
      ROUTE (a). Every curve-cell arm, every held-out label (RLFAM, XCO1, XCO2)
      and every random-label reference of the family clauses is STRATIFIED BY
      THE EXACT QUOTIENT: by the E/4E class h4 (alphabet 4) on every Koblitz
      cell, by the E/2E class h2 on CELL-O19. The histogram-preserving shuffle
      permutes labels only among support points with the same stratum value,
      and the family null is the exact-saturated random label q r + e (e the
      stratum, r uniform on M/q values, q = 4 or 2), measured on the same pairs
      by the same gain code (the version-2 DF-7 F5 null, generalised to every
      arm). On the Z/l cells (prime order) the stratum is constant and both
      reduce to the version-2 unstratified forms.
    why_this_removes_the_exact_components: >-
      By Q-CERT every exact sum-compatible map on a group of order 4l below l
      is a function of h4 (on CELL-O19, of order 2 x 261823, of h2). A
      stratified shuffle preserves each label's joint distribution with the
      stratum exactly over the support, and so preserves every exact component
      a label carries, while destroying every other relation between point and
      label. E_Sh therefore measures excess beyond the exact components, which
      is DF-7's principle applied to every arm, as DEC-20260929-8c3cb2 RR-1(a)
      requires.
    why_not_route_b: >-
      Sampling Stage 2 from 4E (Q uniform, then 4Q) would make every exact
      component constant, but it degenerates three declared objects in ways
      that would need new rules after the fact: (1) the F5 composites 4 t + h4
      collapse to 4 t, a label using M/4 of its M values, whose raw G is at
      least 4 by construction; (2) a label constant on 4E reads G = M with
      every used cell a point mass, which is SR-6's trigger; (3) the exact
      controls h2 and h4 and the RR-2 control would become constants on the
      Stage 2 stream, so the gate could no longer show the comparison
      separating an exact component from an excess on the stream it judges.
      Route (a) keeps the version-2 arm definitions, streams and sample sizes
      unchanged.
    pricing: >-
      The shuffle stratification itself costs no extra counting pass (the same
      ten shuffles per arm and seed; a grouping of the support by stratum).
      The strata need h4 for every support point of every Koblitz Stage 2
      stream; version 2 already evaluated h4 there for F5 (one halving
      presentation per distinct point), so that is not new. The new costs are
      the saturated null at 50 draws per seed (RR-6), the held-out XCO1 and
      XCO2 arms (22 passes per (cell, M, seed)), PC-6c, PC-6d and PC-18; they
      are priced in stage_0.cost_table and in the specification's stage_split.
    exact_quotient_audit: CODE-AUDIT, with its pass rule in pass_criteria_stated_before_execution.audit and its C-4 table in design_computations.

