        # --------------------------------------------------------- setup (PC-8)
        def prove_prime_by_trial_division(m):
            """RR-11. A proof of primality by complete trial division to isqrt(m);
            None when m is at or above TD_PROOF_LIMIT."""
            if m >= TD_PROOF_LIMIT:
                return None
            if m < 2:
                return False
            if m % 2 == 0:
                return m == 2
            r = math.isqrt(m)
            d = 3
            while d <= r:
                if m % d == 0:
                    return False
                d += 2
            return True


        def setup_cell(cid, rng=None):
            """PC-8, carried, plus the trial-division proof of the cell's l."""
            spec = CELLS[cid]
