        """CODE-EST, estimator.py, of EXP-BINSTD-c9c8a2 (version 3): the design
        constants and rules R-M and R-S; pair streams with labels cached once per
        distinct point, under a stream label so that PC-9, PC-6c and PC-18 never
        share a Stage 2 stream (RR-10); the bucket-gain statistic G; the
        histogram-preserving shuffle with its stratified branch, used for EVERY
        curve-cell arm (RR-1 route (a)); the measured nulls - the uniform gate
        null and the exact-saturated family null q r + e (RR-1) with 50 draws per
        seed (RR-6) and a per-seed width (RR-3); the planted labels and the
        exact-content-only labels of the RR-2 control; and the pre-registered
        clauses L1, L2 (non-decay) and L3 with the classification NEG, LEAD,
        ART-RES or NOT-ESTIMATED.

        Committed by TASK-20260929-749b50. NOT RUN by the design task. Pure
        Python 3, standard library only. Importing this module executes nothing
        beyond definitions and constants. No percentile bootstrap is used.
        """
        import math
        import random
        import zlib
        from array import array

        MIN_CELL = 100
        FLAT_LIMIT = 1 << 24
        R_RL = 50
        R_RL_GATE = 20
        R_SH = 10
        SEEDS = tuple(range(10))
        WIDTH_QUANTILE = 0.90

        # Design constants (audit sheet stage_0.sample_table, carried); the ladder
        # and PC-9 alphabets are re-derived by rule R-M at setup.
        RULE_ALPHABETS = {"CELL-K13": (16, 8), "CELL-K19": (64, 16),
                          "CELL-K23": (128, 32), "CELL-O19": (64, 16)}
        FAMILY_ALPHABETS = {"CELL-K13": (16, 8), "CELL-K19": (64, 16),
                            "CELL-K23": (128, 32, 16), "CELL-K41": (16,),
                            "CELL-O19": (64, 16)}
        LADDER = ("CELL-K13", "CELL-K19", "CELL-K23")
        LEAD_ALPHABET = {"CELL-K13": 16, "CELL-K19": 64, "CELL-K23": 128}
        PC9_ALPHABET = {"CELL-K13": 8, "CELL-K19": 16, "CELL-O19": 16, "CELL-K17C": 16}
        PC9_EXHAUSTIVE = ("CELL-K13",)


        def seed_of(*parts):
            """A recorded deterministic 32-bit seed from a label (never hash())."""
            return zlib.crc32(":".join(str(p) for p in parts).encode("ascii"))


        def alphabet_exponent(log2_n, parts):
            """Rule R-M: M = 2^r with r = floor(log2(N) / parts + 1/2)."""
            return int(math.floor(log2_n / parts + 0.5))


        def sample_size_exponent(M):
            """Rule R-S: S = 2^s with s = ceil(log2(128 M^2))."""
            return (128 * M * M - 1).bit_length()


        def S_of(M):
            return 1 << sample_size_exponent(M)


        # ------------------------------------------------------------ pair streams
        class PairStream:
            """The ordered pairs of one (cell, seed, stream label): pid[3k],
            pid[3k + 1] and pid[3k + 2] are the ids of P, Q and P + Q of pair k.
            Ids are assigned in order of first appearance, so the support of the
            first S pairs is ids 0 .. U(S) - 1. Pairs whose sum is the identity are
            redrawn and counted. The default label "stream" reproduces the
            version-2 streams; PC-9, PC-6c and PC-18 use their own labels."""

            def __init__(self, cell, seed, S, label="stream"):
                self.cell_id = cell.id
                self.seed = seed
                self.S = S
                self.label = label
                self.pid = array("I")
                self.keys = []
                self.redrawn = 0
                index = {}
                rng = random.Random(seed_of(label, cell.id, seed))
                for _ in range(S):
                    while True:
                        P = cell.sample(rng)
                        Q = cell.sample(rng)
                        R = cell.add(P, Q)
                        if R is None:
                            self.redrawn += 1
                            continue
                        break
                    for X in (P, Q, R):
                        k = cell.key(X)
                        i = index.get(k)
                        if i is None:
                            i = len(self.keys)
                            index[k] = i
                            self.keys.append(k)
                        self.pid.append(i)

            def support(self, S):
                """U(S), the number of distinct points among the first S pairs."""
                return max(self.pid[0:3 * S]) + 1


        def cache_labels(cell, stream, U, fn):
            """Evaluate a label function once per distinct point of the support."""
            out = array("H")
            for i in range(U):
                out.append(fn(cell.unpack(stream.keys[i])))
            return out


        def cache_label_tuples(cell, stream, U, fn, width):
            """As cache_labels, for a function returning a tuple of width labels."""
            outs = [array("H") for _ in range(width)]
            for i in range(U):
                t = fn(cell.unpack(stream.keys[i]))
                for j in range(width):
                    outs[j].append(t[j])
            return outs


        def image_size(lab, U):
            """The number of distinct labels on the support (SR-6, CD-9)."""
            return len(set(lab[0:U]))


        # --------------------------------------------------------------- statistic
        def gain(stream, S, lab, M):
            """G = M x the maximum over conditioning cells (a, b) with at least
            MIN_CELL samples of max_c n(a, b, c) / n(a, b), over the first S pairs.
            Returns G, used, excluded, empty, used_mass and point_mass_used."""
            if M * M * M > FLAT_LIMIT:
                raise ValueError("alphabet too large for the flat counter")
            MM = M * M
            cnt = array("I", [0]) * (MM * M)
            pid = stream.pid
            for k in range(0, 3 * S, 3):
                cnt[lab[pid[k]] * MM + lab[pid[k + 1]] * M + lab[pid[k + 2]]] += 1
            best, used, excluded, empty, point_mass, used_mass = 0.0, 0, 0, 0, 0, 0
            for ab in range(MM):
                row = cnt[ab * M:(ab + 1) * M]
                nab = sum(row)
                if nab == 0:
                    empty += 1
                elif nab < MIN_CELL:
                    excluded += 1
                else:
                    used += 1
                    used_mass += nab
                    top = max(row)
                    if top == nab:
                        point_mass += 1
                    v = top / nab
                    if v > best:
                        best = v
            return {"G": M * best, "used": used, "excluded": excluded, "empty": empty,
                    "used_mass": used_mass, "point_mass_used": point_mass, "S": S}


        def exact_gain_stream(cell, seed, S, label, M):
            """PC-5 (carried). Streaming reading of an EXACT filter of large
            alphabet; G is M when every used cell is a point mass, else None."""
            MM = M * M
            nab = array("I", [0]) * MM
            first = array("i", [-1]) * MM
            bad = array("B", [0]) * MM
            rng = random.Random(seed_of("stream", cell.id, seed))
            redrawn = 0
            for _ in range(S):
                while True:
                    P = cell.sample(rng)
                    Q = cell.sample(rng)
                    R = cell.add(P, Q)
                    if R is None:
                        redrawn += 1
                        continue
                    break
                ab = label(P) * M + label(Q)
                c = label(R)
                nab[ab] += 1
                f = first[ab]
                if f < 0:
                    first[ab] = c
                elif not (f == c):
                    bad[ab] = 1
            used = excluded = empty = nonexact = 0
            for ab in range(MM):
                n = nab[ab]
                if n == 0:
                    empty += 1
                elif n < MIN_CELL:
                    excluded += 1
                else:
                    used += 1
                    if bad[ab]:
                        nonexact += 1
            G = M if (used > 0 and nonexact == 0) else None
            return {"G": G, "used": used, "excluded": excluded, "empty": empty,
                    "nonexact_used": nonexact, "redrawn": redrawn, "S": S}


        # ---------------------------------------------- shuffle, nulls and planted
        def shuffled(lab, U, seed, strata=None):
            """Histogram-preserving resampling of labels ACROSS POINTS. Without
            strata the labels of the support are permuted uniformly. With strata
            (the exact quotient e of every point: h4 on a Koblitz cell, h2 on an
            ordinary cell) the permutation acts within each stratum, so every
            label's joint histogram with e is kept exactly - every exact component
            the certificate counts survives - and every other relation between a
            point and its label is destroyed (RR-1 route (a))."""
            rng = random.Random(seed)
            if strata is None:
                vals = list(lab[0:U])
                rng.shuffle(vals)
                return array("H", vals)
            out = array("H", lab[0:U])
            groups = {}
            for i in range(U):
                groups.setdefault(strata[i], []).append(i)
            for key in sorted(groups):
                idx = groups[key]
                vals = [out[i] for i in idx]
                rng.shuffle(vals)
                for i, v in zip(idx, vals):
                    out[i] = v
            return out


        def random_labels(U, M, seed, strata=None, q=1):
            """Independent uniform labels. With strata the label is q r + e, e the
            stratum and r uniform on M / q values: the EXACT-SATURATED null, which
            carries the whole exact quotient and nothing else."""
            rng = random.Random(seed)
            if strata is None:
                return array("H", [rng.randrange(M) for _ in range(U)])
            m = M // q
            return array("H", [q * rng.randrange(m) + strata[i] for i in range(U)])


        def planted_marginal_labels(U, M, seed):
            """PC-6b and PC-6d object: bucket 0 with probability 1/2, the others
            uniform, a random function of the point with no arithmetic relation."""
            rng = random.Random(seed)
            out = array("H")
            for _ in range(U):
                if rng.random() < 0.5:
                    out.append(0)
                else:
                    out.append(1 + rng.randrange(M - 1))
            return out


        def planted_mixture(lab, U, M, rho, seed):
            """Resolving-floor object: per point its own label with probability
            rho, otherwise an independent uniform label, fixed under the seed."""
            rng = random.Random(seed)
            out = array("H")
            for i in range(U):
                if rng.random() < rho:
                    out.append(lab[i])
                else:
                    out.append(rng.randrange(M))
            return out


        def skewed_residual(rng, m):
            """0 with probability 1/2, otherwise uniform on 1 .. m - 1 (m >= 2)."""
            if rng.random() < 0.5:
                return 0
            return 1 + rng.randrange(m - 1)


        def exact_content_x2(U, M, strata, q, seed):
            """RR-2 label XCO2 (PTM-E (ii)): q r + e, e the point's exact stratum
            and r from a skewed law independent of the point. Its only arithmetic
            content is the exact quotient the certificate counts."""
            rng = random.Random(seed)
            m = M // q
            return array("H", [q * skewed_residual(rng, m) + strata[i] for i in range(U)])


        def exact_content_x1(U, n, wb, strata, seed):
            """RR-2 label XCO1 (PTM-E (i)): per point an independent weight w ~
            Binomial(n, 1/2) conditioned on w = e (mod 2), e the point's stratum
            (whose low bit is the E/2E class), labelled by the declared F1
            quantile rule wb. It determines the E/2E class on every parity-pure
            class and carries nothing else of the point's arithmetic."""
            rng = random.Random(seed)
            out = array("H")
            for i in range(U):
                bit = strata[i] & 1
                while True:
                    w = bin(rng.getrandbits(n)).count("1")
                    if (w & 1) == bit:
                        break
                out.append(wb[w])
            return out


        def quantile(vals, p):
            """Type-1 empirical quantile: the smallest v with F(v) >= p."""
            s = sorted(vals)
            k = max(1, int(math.ceil(p * len(s) - 1e-9)))
            return s[k - 1]


        def median(vals):
            s = sorted(vals)
            n = len(s)
            if n % 2:
                return s[n // 2]
            return 0.5 * (s[n // 2 - 1] + s[n // 2])


        def null_distribution(stream, S, U, M, cell_id, seed, draws=R_RL, strata=None, q=1):
            """The random-label arm's own measured distribution at (cell, M) on the
            same pairs and the same gain code, fresh recorded seeds, never
            resamples of an arm it judges. With strata and q it is the
            exact-saturated family null (RR-1)."""
            out = []
            for r in range(draws):
                lab = random_labels(U, M, seed_of("rl", cell_id, M, q, seed, r), strata, q)
                out.append(gain(stream, S, lab, M))
            return out


        def null_summary(draws):
            """Pooled over seeds: q50, q99 and the null width W = q99 - q50."""
            vals = [d["G"] for d in draws]
            q50 = quantile(vals, 0.50)
            q99 = quantile(vals, 0.99)
            return {"q50": q50, "q99": q99, "W": q99 - q50, "draws": len(vals)}


        def seed_width(draws):
            """RR-3. One seed's own width V_s = q90 - q50 of its null draws."""
            vals = [d["G"] for d in draws]
            return quantile(vals, WIDTH_QUANTILE) - quantile(vals, 0.50)


        def summarize_null(by_seed):
            """null_summary over the pooled draws plus the list of per-seed widths,
            in seed order."""
            out = null_summary([d for ds in by_seed for d in ds])
            out["V"] = [seed_width(ds) for ds in by_seed]
            return out


        def read_arm(stream, S, U, lab, M, cell_id, arm, seed, strata=None):
            """One arm on one seed: the direct reading and R_SH shuffles (within
            strata when given) under recorded seeds, on the same pairs."""
            direct = gain(stream, S, lab, M)
            sh = []
            for r in range(R_SH):
                s_lab = shuffled(lab, U, seed_of("sh", cell_id, arm, M, seed, r), strata)
                sh.append(gain(stream, S, s_lab, M)["G"])
            return {"direct": direct, "shuffle": sh}


        # --------------------------------------------------------- decision rules
        def seed_rows(readings, null, widths):
            """Per seed: E_RL = G - q50, E_Sh = G - median(shuffles), the rank
            p-value, Z = E_Sh / V_s with the seed's own width (RR-3), and whether
            the arm is estimated (IR-12 mass rule, carried)."""
            if not (len(widths) == len(readings)):
                raise ValueError("one width per seed is required")
            rows = []
            for s, rd in enumerate(readings):
                d = rd["direct"]
                g = d["G"]
                sh = rd["shuffle"]
                e_sh = g - median(sh)
                v = widths[s]
                rows.append({
                    "seed": s, "G": g, "E_RL": g - null["q50"], "E_Sh": e_sh,
                    "p": (1 + sum(1 for x in sh if x >= g)) / (len(sh) + 1),
                    "V": v, "Z": (e_sh / v) if v > 0 else None,
                    "used": d["used"], "excluded": d["excluded"],
                    "estimated": d["used"] > 0 and 2 * d["used_mass"] >= d["S"]})
            return rows


        def estimated(rows):
            return all(r["estimated"] for r in rows)


        def clause_L1(rows, null):
            """L1: the median over seeds of E_RL is at least 3 W."""
            return median([r["E_RL"] for r in rows]) >= 3.0 * null["W"]


        def clause_L3(rows, null, min_seeds=8):
            """L3: the median over seeds of E_Sh is at least 3 W, and the rank
            p-value is at its floor 1 / (R_SH + 1) on at least 8 of 10 seeds."""
            floor_p = 1.0 / (R_SH + 1)
            hits = sum(1 for r in rows if r["p"] <= floor_p + 1e-12)
            return median([r["E_Sh"] for r in rows]) >= 3.0 * null["W"] and hits >= min_seeds


        def ols_slope(xs, ys):
            n = len(xs)
            mx = sum(xs) / n
            my = sum(ys) / n
            sxx = sum((x - mx) ** 2 for x in xs)
            sxy = sum((x - mx) * (y - my) for x, y in zip(xs, ys))
            return sxy / sxx


        def clause_L2(ladder_rows, log2_ns):
            """L2, NON-DECAY (RR-3). One OLS slope of Z on log2 N per seed; the
            interval is the second smallest to the second largest of the ten
            slopes; L2 HOLDS when the UPPER end is at least 0 (decay is not
            established: fewer than nine of ten seeds decline)."""
            nseeds = len(ladder_rows[0])
            slopes = []
            for s in range(nseeds):
                ys = [ladder_rows[c][s]["Z"] for c in range(len(log2_ns))]
                if any(y is None for y in ys):
                    return {"holds": False, "interval": None, "slopes": None,
                            "decay_established": None,
                            "reason": "a per-seed width is not positive on a ladder cell"}
                slopes.append(ols_slope(log2_ns, ys))
            ss = sorted(slopes)
            lo, hi = ss[1], ss[-2]
            return {"holds": hi >= 0.0, "interval": (lo, hi), "slopes": slopes,
                    "decay_established": hi < 0.0}


        def classify_family(cells_M, lead_keys, log2_ns):
            """cells_M maps (cell, M) to {"rows": ..., "null": ...}; lead_keys are
            the ladder cells at their N^(1/3) alphabets in the order of log2_ns.
            NOT-ESTIMATED when a lead key is not estimated; LEAD when L1 and L3
            hold at every lead key and L2 holds; NEG when L3 holds at no estimated
            (cell, M); ART-RES otherwise."""
            per = {}
            l3_any = False
            for key, d in cells_M.items():
                ok = estimated(d["rows"])
                l1 = ok and clause_L1(d["rows"], d["null"])
                l3 = ok and clause_L3(d["rows"], d["null"])
                per[key] = {"estimated": ok, "L1": l1, "L3": l3}
                l3_any = l3_any or l3
            if not all(per[k]["estimated"] for k in lead_keys):
                return {"verdict": "NOT-ESTIMATED", "per_cell": per, "L2": None}
            l2 = clause_L2([cells_M[k]["rows"] for k in lead_keys], log2_ns)
            if all(per[k]["L1"] and per[k]["L3"] for k in lead_keys) and l2["holds"]:
                verdict = "LEAD"
            elif not l3_any:
                verdict = "NEG"
            else:
                verdict = "ART-RES"
            return {"verdict": verdict, "per_cell": per, "L2": l2}

    - id: CODE-FAM
      file: families.py
      extract_as: experiments/EXP-BINSTD-c9c8a2/impl/families.py
      discharges: [RR-1 for every arm, RR-2 (PC-17 in Stage 2 and Stage 3), RR-4 (heur_b2_held_out), RR-10 (PC-10 guard), PC-15]
      dependencies: binstd_core, estimator; standard library otherwise
      reference_sha256: 5d9b52c32ffe26829560f8aa91939e7a03a98376241c54065f71f7eb67e54706
      code: |
        """CODE-FAM, families.py, of EXP-BINSTD-c9c8a2 (version 3): the declared
        arms (F1, F2 at three offsets, F3 at three offsets, F4 and the four F5
        composites on a Koblitz cell; F2 and F3 at three offsets on the ordinary
        cell), DEFINITIONS UNCHANGED FROM VERSION 2 and now computed by one
        function, labels_from_parts, that CODE-AUDIT also uses; the Stage 2
        driver, in which EVERY arm, RLFAM and the RR-2 labels XCO1 and XCO2 are
        read with shuffles stratified by the cell's exact quotient and judged
        against the exact-saturated null (RR-1); the PC-10 guard (RR-10); and
        the Stage 3 classification with PC-15, PC-17 and the HEUR-B2 held-out
        tests (RR-4).

        Committed by TASK-20260929-749b50. NOT RUN by the design task. Pure
        Python 3, standard library only. Importing this module executes nothing
        beyond definitions and constants.
        """
        import math

        import binstd_core as core
        import estimator as est

        CLEARANCE_TOKEN = "PC-10 cleared by stage1_gate.issue_clearance"
        HELD_OUT_NAMES = ("RLFAM", "XCO1", "XCO2")
        XCO_NAMES = ("XCO1", "XCO2")
        HELD_OUT_TESTS = (
            ("ladder", ("CELL-K13", "CELL-K19"), None, ("CELL-K23",), None),
            ("fixed16", ("CELL-K13", "CELL-K19", "CELL-K23"), 16, ("CELL-K41",), 16),
        )


        def weight_buckets(n, M):
            """F1 quantile classes: bucket(w) = min(M - 1, floor(M C(w))), C the
            mid-CDF of Binomial(n, 1/2) (carried)."""
            tot = float(2 ** n)
            out, acc = [], 0
            for w in range(n + 1):
                pw = math.comb(n, w)
                out.append(min(M - 1, int(math.floor(M * (acc + pw / 2.0) / tot))))
                acc += pw
            return out


        def rotr(c, k, n):
            k %= n
            mask = (1 << n) - 1
            return ((c >> k) | (c << (n - k))) & mask


        def min_rotation(c, n):
            """The Frobenius-canonical representative: the least cyclic rotation."""
            best = c
            for k in range(1, n):
                v = rotr(c, k, n)
                if v < best:
                    best = v
            return best


        def offsets(n, r):
            """The three declared offsets of F2 and F3 at window width r."""
            return (0, (n - r) // 2, n - r)


        def family_names(koblitz, n, M):
            """The declared arm names at alphabet M, in label order."""
            r = M.bit_length() - 1
            offs = offsets(n, r)
            pre = "" if koblitz else "ORD-"
            names = []
            if koblitz:
                names.append("F1")
            names += [pre + "F2@%d" % o for o in offs]
            names += [pre + "F3@%d" % o for o in offs]
            if koblitz:
                names += ["F4", "F5xF1", "F5xF2@0", "F5xF3@0", "F5xF4"]
            return names


        def labels_from_parts(n, M, c, x, e, koblitz, wb, wb4):
            """The declared arms at alphabet M, in the order of family_names, from
            c (the normal-basis coordinate vector of x), x (the polynomial-basis
            integer) and, on a Koblitz cell, e (the h4 class). The formulas are the
            version-2 CODE-FAM formulas unchanged. wb = weight_buckets(n, M), wb4 =
            weight_buckets(n, M // 4) on a Koblitz cell."""
            r = M.bit_length() - 1
            mask = M - 1
            out = []
            if koblitz:
                out.append(wb[core.popcount(c)])
            for o in offsets(n, r):
                out.append(rotr(c, o, n) & mask)
            for o in offsets(n, r):
                out.append((x >> o) & mask)
            if koblitz:
                r4 = r - 2
                m4 = (M // 4) - 1
                mr = min_rotation(c, n)
                out.append((mr >> (n - r)) & mask)
                out.append(4 * wb4[core.popcount(c)] + e)
                out.append(4 * (c & m4) + e)
                out.append(4 * (x & m4) + e)
                out.append(4 * ((mr >> (n - r4)) & m4) + e)
            return tuple(out)


        def arms(cell, M, h4h=None, h2=None):
            """Names, one tuple-valued label function and the stratum slot. The
            function returns the family labels followed by the point's exact
            stratum: h4 by the halving presentation on a Koblitz cell (used only
            after PC-4b), h2 on an ordinary cell. Every arm is stratified by that
            slot (RR-1 route (a))."""
            n = cell.n
            NB = cell.NB
            koblitz = cell.kind.startswith("koblitz")
            if koblitz and h4h is None:
                raise ValueError("a Koblitz cell needs the h4 stratum")
            if (not koblitz) and h2 is None:
                raise ValueError("an ordinary cell needs the h2 stratum")
            names = family_names(koblitz, n, M)
            wb = weight_buckets(n, M)
            wb4 = weight_buckets(n, M // 4) if koblitz else None

            def fn(P):
                x = P[0]
                c = NB.to_nb(x)
                e = h4h(P) if koblitz else h2(P)
                return labels_from_parts(n, M, c, x, e, koblitz, wb, wb4) + (e,)

            return names, fn, len(names)


        def require_clearance(cell_id, clearance):
            """PC-10 in code (RR-10): raise unless the clearance was issued for this
            cell by stage1_gate.issue_clearance after every required control."""
            ok = (isinstance(clearance, dict) and clearance.get("cleared") is True
                  and clearance.get("cell") == cell_id
                  and clearance.get("token") == CLEARANCE_TOKEN)
            if not ok:
                raise RuntimeError("PC-10: Stage 2 on %s without a valid clearance" % cell_id)


        def stage2_cell(cell, setup, clearance, seeds=est.SEEDS):
            """Stage 2 on one cleared cell: every declared arm at every family
            alphabet, seeds 0 to 9, plus RLFAM (PC-15) and XCO1, XCO2 (PC-17), each
            read with ten shuffles stratified by the exact quotient and judged
            against the exact-saturated null q r + e measured here on the same
            pairs (50 draws per seed, per-seed widths)."""
            require_clearance(cell.id, clearance)
            Ms = est.FAMILY_ALPHABETS[cell.id]
            grid = {M: est.S_of(M) for M in Ms}
            koblitz = cell.kind.startswith("koblitz")
            h4h, h2, q = None, None, 2
            if koblitz:
                h4h = core.make_h4_halving(cell.C, setup["point_of_order_4"])[0]
                q = 4
            else:
                h2 = core.make_h2(cell.C)[0]
            Smax = max(grid.values())
            res, null_draws, images = {}, {}, {}
            for s in seeds:
                stream = est.PairStream(cell, s, Smax)
                for M, S in sorted(grid.items()):
                    U = stream.support(S)
                    names, fn, slot = arms(cell, M, h4h, h2)
                    labs = est.cache_label_tuples(cell, stream, U, fn, slot + 1)
                    e = labs[slot]
                    null_draws.setdefault(M, []).append(est.null_distribution(
                        stream, S, U, M, cell.id + "/SAT", s, strata=e, q=q))
                    for k, name in enumerate(names):
                        res.setdefault((name, M), []).append(
                            est.read_arm(stream, S, U, labs[k], M, cell.id, name, s, e))
                        images.setdefault((name, M), []).append(est.image_size(labs[k], U))
                    extra = (
                        ("RLFAM", est.random_labels(U, M, est.seed_of("rlfam", cell.id, M, s))),
                        ("XCO1", est.exact_content_x1(U, cell.n, weight_buckets(cell.n, M), e,
                                                      est.seed_of("xco1", cell.id, M, s))),
                        ("XCO2", est.exact_content_x2(U, M, e, q, est.seed_of("xco2", cell.id, M, s))),
                    )
                    for name, lab in extra:
                        res.setdefault((name, M), []).append(
                            est.read_arm(stream, S, U, lab, M, cell.id, name, s, e))
                        images.setdefault((name, M), []).append(est.image_size(lab, U))
            nulls = {M: est.summarize_null(by_seed) for M, by_seed in null_draws.items()}
            out = {}
            for (name, M), readings in res.items():
                out[(name, M)] = {"rows": est.seed_rows(readings, nulls[M], nulls[M]["V"]),
                                  "null": nulls[M], "image_sizes": images[(name, M)]}
            return out


        def _l3_flags(outs, name, cells, M=None):
            flags = []
            for cid in cells:
                for key, d in outs.get(cid, {}).items():
                    if key[0] == name and (M is None or key[1] == M):
                        if est.estimated(d["rows"]):
                            flags.append(est.clause_L3(d["rows"], d["null"]))
                        else:
                            flags.append(None)
            return flags


        def heur_b2_held_out(outs):
            """RR-4. HEUR-B2's testable consequent, per declared Koblitz arm: a
            test is DEFINED when every involved (cell, M) is estimated; HEUR-B2 is
            falsified on the tested range when a defined test has its premise
            (no L3 on the fitting cells) true and its consequent (no L3 on the
            held-out cells) false."""
            names = set()
            for o in outs.values():
                for key in o:
                    if not (key[0] in HELD_OUT_NAMES or key[0].startswith("ORD-")):
                        names.add(key[0])
            res = {}
            for name in sorted(names):
                row = {}
                for tag, fit, fit_M, held, held_M in HELD_OUT_TESTS:
                    f = _l3_flags(outs, name, fit, fit_M)
                    h = _l3_flags(outs, name, held, held_M)
                    defined = len(f) > 0 and len(h) > 0 and all(v is not None for v in f + h)
                    premise = defined and not any(f)
                    consequent = defined and not any(h)
                    row[tag] = {"defined": defined, "premise": premise,
                                "consequent": consequent,
                                "falsified": premise and not consequent}
                res[name] = row
            return res


        def stage3(outs, log2_ns):
            """Stage 3. outs[cell] is the stage2_cell output of every read cell;
            log2_ns lists log2 l of the ladder cells in LADDER order. Ladder arms
            by est.classify_family with the N^(1/3) keys as LEAD keys; others NEG
            or ART-RES. PC-15: RLFAM reads NEG. PC-17: XCO1 and XCO2 read NEG."""
            names = set()
            for o in outs.values():
                for key in o:
                    names.add(key[0])
            lead_keys = [(c, est.LEAD_ALPHABET[c]) for c in est.LADDER]
            verdicts = {}
            for name in sorted(names):
                cells_M = {}
                for cid, o in outs.items():
                    for key, d in o.items():
                        if key[0] == name:
                            cells_M[(cid, key[1])] = d
                if all(k in cells_M for k in lead_keys):
                    verdicts[name] = est.classify_family(cells_M, lead_keys, log2_ns)
                else:
                    l3_any = False
                    for d in cells_M.values():
                        if est.estimated(d["rows"]) and est.clause_L3(d["rows"], d["null"]):
                            l3_any = True
                    verdicts[name] = {"verdict": "ART-RES" if l3_any else "NEG",
                                      "ladder": False, "read_on": sorted(cells_M)}
            return {"verdicts": verdicts,
                    "PC-15": verdicts.get("RLFAM", {}).get("verdict") == "NEG",
                    "PC-17": all(verdicts.get(x, {}).get("verdict") == "NEG" for x in XCO_NAMES),
                    "heur_b2_held_out": heur_b2_held_out(outs)}

    - id: CODE-XCO
      file: exact_content.py
      extract_as: experiments/EXP-BINSTD-c9c8a2/impl/exact_content.py
      discharges: [RR-2 (PC-18 and PC-17), RR-10 (stratified-branch dry calls), C-5]
      dependencies: estimator, families; standard library otherwise
      reference_sha256: dd88236173201d656438a9986e771acd296c4f98d6962f4a4c68bd17eb90b4ea
      code: |
        """CODE-XCO, exact_content.py, of EXP-BINSTD-c9c8a2 (version 3): the
        blocking exact-content-only gate control of DEC-20260929-8c3cb2 RR-2.

        PC-18 (run level, before any arm is read): the labels XCO1 (weight
        classes tied to the E/2E class) and XCO2 (q r + e with a skewed r) are
        read, exactly as family arms are read, on the isomorphism types of the
        groups of the five Stage 2 cells, and must classify NEG. PC-17 (per
        declared cell, after its Stage 2 reads and before any classification):
        the same labels built from the cell's own strata must meet L3 nowhere.

        synthetic_dry_call is a DESIGN AND REVIEW UTILITY for the card's
        session computation C-5; the experiment's driver never calls it and it
        touches no declared cell.

        Committed by TASK-20260929-749b50. NOT RUN by the design task except as
        C-5. Importing this module executes nothing beyond definitions and
        constants.
        """
        import math

        import estimator as est
        import families as fam

        # (id, l, q, n, family alphabets): the group of a Koblitz ladder cell is
        # cyclic of order 4 l, that of CELL-O19 cyclic of order 2 l; e = i mod q.
        ISO_SHAPES = (
            ("ISO-K13", 2003, 4, 13, (16, 8)),
            ("ISO-K19", 130873, 4, 19, (64, 16)),
            ("ISO-K23", 2095853, 4, 23, (128, 32, 16)),
            ("ISO-K41", 549756390943, 4, 41, (16,)),
            ("ISO-O19", 261823, 2, 19, (64, 16)),
        )
        ISO_LEAD = (("ISO-K13", 16), ("ISO-K19", 64), ("ISO-K23", 128))
        ISO_LOG2 = (math.log2(2003), math.log2(130873), math.log2(2095853))


        class IsoCell:
            """Z/(q l)Z with uniform non-identity sampling and non-identity sums:
            the isomorphism type of a declared cell's group and its pair law. The
            exact quotient onto Z/q is i mod q."""

            def __init__(self, cid, l, q, n):
                self.id, self.l, self.q, self.n, self.N = cid, l, q, n, q * l

            def sample(self, rng):
                return rng.randrange(1, self.N)

            def add(self, i, j):
                s = (i + j) % self.N
                return None if s == 0 else s

            def key(self, i):
                return i

            def unpack(self, k):
                return k


        def xco_labels(U, n, M, e, q, cid, s, tag):
            """The two RR-2 labels on one support, from its strata e."""
            return (
                ("XCO1", est.exact_content_x1(U, n, fam.weight_buckets(n, M), e,
                                              est.seed_of(tag + "-x1", cid, M, s))),
                ("XCO2", est.exact_content_x2(U, M, e, q, est.seed_of(tag + "-x2", cid, M, s))),
            )


        def pc18_isomorph_gate(seeds=est.SEEDS, shapes=ISO_SHAPES):
            """PC-18. Returns passed, failures and a report per (cell, M, label)."""
            fails, report = [], {}
            cells_by_name = {"XCO1": {}, "XCO2": {}}
            for cid, l, q, n, alphabets in shapes:
                cell = IsoCell(cid, l, q, n)
                grid = {M: est.S_of(M) for M in alphabets}
                Smax = max(grid.values())
                acc = {M: {"null": [], "XCO1": [], "XCO2": []} for M in grid}
                for s in seeds:
                    stream = est.PairStream(cell, s, Smax, label="pc18")
                    for M, S in sorted(grid.items()):
                        U = stream.support(S)
                        e = est.cache_labels(cell, stream, U, lambda i, q=q: i % q)
                        acc[M]["null"].append(est.null_distribution(
                            stream, S, U, M, cid + "/SAT", s, strata=e, q=q))
                        for name, lab in xco_labels(U, n, M, e, q, cid, s, "pc18"):
                            acc[M][name].append(est.read_arm(stream, S, U, lab, M, cid, name, s, e))
                for M, d in acc.items():
                    ns = est.summarize_null(d["null"])
                    for name in ("XCO1", "XCO2"):
                        rows = est.seed_rows(d[name], ns, ns["V"])
                        ok = est.estimated(rows)
                        l1 = ok and est.clause_L1(rows, ns)
                        l3 = ok and est.clause_L3(rows, ns)
                        hits = sum(1 for r in rows if r["p"] <= 1.0 / (est.R_SH + 1) + 1e-12)
                        report["%s@%d/%s" % (cid, M, name)] = {
                            "estimated": ok, "L1": l1, "L3": l3, "rank_floor_seeds": hits,
                            "median_E_Sh_over_W": est.median([r["E_Sh"] for r in rows]) / ns["W"] if ns["W"] > 0 else None,
                            "q50": ns["q50"], "W": ns["W"]}
                        if l3:
                            fails.append("PC-18 %s meets L3 at %s M=%d" % (name, cid, M))
                        cells_by_name[name][(cid, M)] = {"rows": rows, "null": ns}
            for name, cells_M in cells_by_name.items():
                if all(k in cells_M for k in ISO_LEAD):
                    v = est.classify_family(cells_M, list(ISO_LEAD), list(ISO_LOG2))
                    report["classification/" + name] = v["verdict"]
                    if not (v["verdict"] == "NEG"):
                        fails.append("PC-18 %s classifies %s" % (name, v["verdict"]))
            return {"passed": len(fails) == 0, "failures": fails, "report": report}


        def pc17_cell(stage2_out):
            """PC-17 on one declared cell: XCO1 and XCO2 estimated, and L3 holding
            for neither at any (cell, M)."""
            fails = []
            for (name, M), d in stage2_out.items():
                if name in fam.XCO_NAMES:
                    if not est.estimated(d["rows"]):
                        fails.append("PC-17 %s not estimated at M=%d" % (name, M))
                    elif est.clause_L3(d["rows"], d["null"]):
                        fails.append("PC-17 %s meets L3 at M=%d" % (name, M))
            return {"passed": len(fails) == 0, "failures": fails}


        def _summary(rows, ns):
            hits = sum(1 for r in rows if r["p"] <= 1.0 / (est.R_SH + 1) + 1e-12)
            W = ns["W"]
            return {"G_median": round(est.median([r["G"] for r in rows]), 4),
                    "E_RL_over_W": round(est.median([r["E_RL"] for r in rows]) / W, 3) if W > 0 else None,
                    "E_Sh_over_W": round(est.median([r["E_Sh"] for r in rows]) / W, 3) if W > 0 else None,
                    "rank_floor_seeds": hits,
                    "estimated": est.estimated(rows),
                    "L1": est.estimated(rows) and est.clause_L1(rows, ns),
                    "L3": est.estimated(rows) and est.clause_L3(rows, ns)}


        def synthetic_dry_call(seeds=est.SEEDS):
            """C-5 (design and review utility; never called by the driver). On the
            synthetic group Z/(4 x 2003) (CELL-K13's isomorphism type) at M = 16,
