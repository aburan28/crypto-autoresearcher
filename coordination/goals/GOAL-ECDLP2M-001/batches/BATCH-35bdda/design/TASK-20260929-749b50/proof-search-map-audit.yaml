            def add(self, P, Q):
                x1, y1 = P
                x2, y2 = Q
                if x1 == x2:
                    if y2 == (x1 ^ y1):
                        return None
                    if x1 == 0:
                        return None
                    lam = x1 ^ self.mul(y1, self.inv(x1))
                    x3 = self.mul(lam, lam) ^ lam ^ self.A
                    y3 = self.mul(x1, x1) ^ self.mul(lam ^ 1, x3)
                    return (x3, y3)
                lam = self.mul(y1 ^ y2, self.inv(x1 ^ x2))
                x3 = self.mul(lam, lam) ^ lam ^ x1 ^ x2 ^ self.A
                y3 = self.mul(lam, x1 ^ x3) ^ x3 ^ y1
                return (x3, y3)

