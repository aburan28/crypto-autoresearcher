            gaps."""
            r = M.bit_length() - 1

            def f(P):
                x = P[0]
                v = 0
                for j in range(r):
                    v |= ((x >> (2 * j + 1)) & 1) << j
                return v

            return f


        def exact(g, M):
            return g["G"] == M and g["point_mass_used"] == g["used"]


        def occupied(g, M):
            return g["used"] >= (M * M) // 2 and g["excluded"] <= g["used"]


