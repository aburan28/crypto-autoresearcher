        seven calibrations) measured G - 1 of about 4.63 and 8.27 at M = 64 and
        128 against the estimates 3.53 and 5.40, and W of about 1.09 and 1.77
        against 0.60 and 0.79 (the estimate is 0.44 to 0.55 of the measured W).
        Those are uniform-label figures; the version-3 family null is the
        exact-saturated label, whose location and width are MEASURED per
        (cell, M) and not estimated here (to be computed at run time; C-5 gives
        one synthetic design figure at the K13 shape).
      design_estimates_at_S_equal_128_M2_uniform_label_underestimates:
        - {M: 8, G_minus_1_location: 0.883, W_estimate: 0.300}
        - {M: 16, G_minus_1_location: 1.442, W_estimate: 0.367}
        - {M: 32, G_minus_1_location: 2.280, W_estimate: 0.464}
        - {M: 64, G_minus_1_location: 3.532, W_estimate: 0.599}
        - {M: 128, G_minus_1_location: 5.396, W_estimate: 0.785}

    resolving_floor:
      statement: >-
        RESTATED (RR-5). A NEG reading at a (cell, M) says the arm's stratified
        controlled excess lies below 3 W of the exact-saturated null at the
        declared S, never that G = 1. The version-2 design figures (q50 + 3 W
        about 2.8, 3.5, 4.7, 6.3 and 8.8 at M = 8 to 128) are WITHDRAWN AS THE
        FLOOR: they are underestimates for a uniform label (review
        computations q50 + 3 W of about 8.90 and 14.57 at M = 64 and 128,
        RT-O5) and do not describe the version-3 reference.
      measured_floor: >-
        MEASURED at execution on Z/lZ (CODE-GATE z_ladder): the planted mixture
        (the log-interval key on a fraction rho of points, a uniform label on
        the rest) on the grid rho in 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.25, 0.125,
        0.0625; the floor at each (l, M) is the smallest grid rho at which L1
        and L3 hold for it and every larger grid rho. It exists at every (l, M)
        while PC-7 passes (rho = 1 is the key), including M = 8, 16 and 32 and
        the fixed alphabet 16 at all three primes. It is reported beside every
        NEG at the matching alphabet; at the fixed alphabet on CELL-K41 the
        floor quoted is the one at l = 2095853, M = 16 (a transfer, stated).
      relevance: >-
        The version-2 sentence "G / M of 0.1 at M = 64 leaves a branching of
        about 10 per level" is withdrawn; with the review computation q50 + 3 W
        of about 8.9 at M = 64 it reads G / M of about 0.14, a branching of
        about 7. The floor limits what NEG certifies about weak excesses only.

    bootstrap_removal:
      change: Carried. Zero percentile-bootstrap resamples.
      precision_loss_stated: >-
        Intervals are order statistics of ten independent per-seed readings
        (about an 80 percent interval); q99 of the family null is now the sixth
        largest of 500 draws (RR-6), and each seed's Z is standardised by its
        own width V_s (RR-3), so the L2 interval carries no common-mode width
        error.

    cost_table:
      status: ESTIMATES, advisory; unit costs measured at S0-4 and recorded; a run projected above its watchdog is split by seed blocks with no scientific change.
      unit_costs: Carried (u_x, u_pair, u_pass 6.6e-6 s per pair per counting pass, u_h4c, u_lab), from cited version-1 review timings.
      version_2_total: about 212600 CPU-seconds
      increments:
        - {item: 'Stage 2 family null at 50 draws (was 20 for F5 only) and the XCO1, XCO2 arms; Koblitz +52 passes per (cell, M, seed), CELL-O19 +72', seconds: 12570, steps: 'pairs per seed x 10 seeds x passes x 6.6e-6 - K13 40960 x 520 = 141; K19 557056 x 520 = 1912; K23 2260992 x 520 = 7760; K41 32768 x 520 = 112; O19 557056 x 720 = 2647'}
        - {item: 'PC-6d (saturated null 50 and planted 11 passes at M = 16) on five cells, and the h4 strata at the gate support', seconds: 4760, steps: '61 x 32768 x 10 x 6.6e-6 = 132 per cell, 660 for five; strata labels about 4100 (K41 dominant)'}
        - {item: PC-9 on its own stream, seconds: 550}
        - {item: 'Z/l ladder at 50 null draws, nine-value grid and M = 16 at 2095853 (182 passes per (l, M, seed) against 108)', seconds: 14190, steps: '20140 x 182 / 108 = 33940; plus 182 x 32768 x 10 x 6.6e-6 = 393; less 20140'}
        - {item: PC-6c on Z/(16 x 2003) and Z/(64 x 2003), seconds: 2240, steps: '61 x (32768 + 524288) x 10 x 6.6e-6'}
        - {item: 'PC-18 on five isomorphism types (72 passes per pair-seed)', seconds: 16390, steps: '3448832 pairs per seed x 10 x 72 x 6.6e-6'}
        - {item: CODE-AUDIT re-run at S0-6, seconds: 600, steps: 'estimate; C-4 records the measured time'}
      total_estimate: about 263900 CPU-seconds (73.3 CPU-hours), one worker
      advisory_ceilings: total_cpu_hours 120; wall_clock_seconds_per_run 259200; maximum_memory_gb 4; maximum_runs 16; maximum_workers 1
      maximum_runs_reconciled: 16 everywhere (RR-11) - seven scientific runs RUN-A to RUN-G, a possible seed-block split of RUN-D, up to eight infrastructure reruns
      largest_runs: RUN-A about 77800 s (45000 + 14190 + 2240 + 16390); RUN-D (CELL-K23) about 125800 s
      lead_route_contingent:
        status: CONTINGENT, ESTIMATE, not in this contract's budget (RR-11, red-team U-1)
        text: >-
          If an arm reads LEAD, SR-4 routes it to (i) an independent
          review-breakthrough round at max, at least three cards at the card
          budget of 14400 s wall each (about 43200 s of max-tier sessions), and
          (ii) an independent replication of that arm's ladder reading in a
          separate session and implementation, about 80000 CPU-seconds (22
          CPU-hours) - the ladder streams 230 + 7860 + 46140 = 54230 s, the h4
          strata and the arm's labels about 15400 s, and the arm's readings and
          nulls about 11000 s. Opened only by a new Coordinator decision. Under
          version 2 this cost was near-certain (the F1 artifact); under version
          3 it is incurred only by a reading that survives the stratified
          comparison and PC-17 and PC-18.

    design_findings:
      - {id: DF-1, subject: the presentation of the E/4E filter, status: carried}
      - {id: DF-2, subject: the composite alphabets constructed, status: carried}
      - {id: DF-3, subject: order proofs by route, status: carried}
      - {id: DF-4, subject: uniform sampling with the abscissa 0 at probability one half, status: carried}
      - {id: DF-5, subject: the l_fibre and l_image conventions, status: carried}
      - {id: DF-6, subject: evaluating h4 by halving, status: 'carried; now supplies the stratum of every Koblitz arm, gated by PC-4b'}
      - {id: DF-7, subject: the stratified null of F5, status: 'GENERALISED to every curve-cell arm (RR-1, rr1_route)'}
      - {id: DF-8, subject: the field polynomial and normal basis made executable, status: carried}
      - id: DF-9
        subject: F1 is a mixed object (NEW, RR-1)
        finding: The parity of F1's normal-basis weight is Tr(x) (FHLM 4.2), which is h2 on the a = 0 cells; F1 carries the exact E/2E bit on its parity-pure classes. CODE-AUDIT measures the coset-pure mass of every arm.
      - id: DF-10
        subject: a label that uses few of its M values reads a large G (NEW)
        finding: G = M x max p counts an unused alphabet, so a label with image size m below M reads G of at least M / m (some sum label has conditional probability at least 1 / m in every used cell), and a label of image size 4 that is a homomorphism reads G = M with point masses; F1 at M = 64 on n = 19 has at most 20 classes. SR-6 now reads the image size (CD-9); L3 is unaffected because the shuffle preserves the image.

  # ===========================================================================
  # PASS CRITERIA, STATED BEFORE THE CODE AND BEFORE ANY EXECUTION.
  # Placed in SR-1 and IR-1 to IR-24 of EXP-BINSTD-c9c8a2. A change after a run
  # begins requires a versioned protocol_amendment (IR-16).
  # Notation. Uniform gate null at (cell, M): q50_u, q99_u, W_u = q99_u - q50_u
  # over 200 pooled draws (20 per seed). Family null at (cell, M): the
  # exact-saturated label q r + e, 500 pooled draws (50 per seed), q50, q99,
  # W = q99 - q50, and per seed V_s = q90_s - q50_s of that seed's 50 draws.
  # EXACT: G == M and every used conditioning cell a point mass. OCCUPIED: at
  # least half of the M^2 conditioning cells used and no more excluded than
  # used. On the Z/l and Z/2^17 cells e is constant and both nulls are uniform.
  # ===========================================================================
  pass_criteria_stated_before_execution:
    run_level:
      - {id: PC-CERT-1, criterion: 'alphabets below l exactly [1, 2, 4] with 2 bits; six divisors of 4l; the subgroup gives [1] and 0 bits', on_failure: IR-19}
      - {id: PC-CERT-2, criterion: 'divisors exactly 2^0 to 2^17; 16 bits below the order', on_failure: IR-19}
      - {id: PC-CERT-3, criterion: 'the twelve divisors of 130972 exactly; below 239 exactly [1, 2, 4, 137]; log2(137) bits', on_failure: IR-19}
      - {id: PC-CERT-4, criterion: 'the three malformed factorisations of stage_0.capacity_certificate each raise ValueError', on_failure: IR-19}
      - id: PC-1
        arm: the low log2(M) bits on Z/2^17 at M in 8, 16, 32, 64, 128 at S = 2^s(M), seeds 0 to 9 (carried)
        criterion: EXACT and OCCUPIED on every seed; the median of its ten unstratified shuffles at most q99 of ten uniform draws per seed, on every seed
        on_failure: IR-1
      - id: PC-5
        arm: dlog mod 548 and dlog mod 956 on CELL-K17C at S = 2^26 and 2^27, seed 0 (carried)
        criterion: G == M, no non-exact used cell, at least half of the M^2 cells used
        on_failure: IR-4
      - id: PC-6c
        arm: >-
          NEW (RR-10). The STRATIFIED branch's exact control. On Z/(16 x 2003)
          at M = 16 (S = 2^15) and Z/(64 x 2003) at M = 64 (S = 2^19), stream
          label "pc6c", seeds 0 to 9: the exact label i mod M, strata i mod 4,
          read with ten stratified shuffles per seed, against the
          exact-saturated null 4 r + (i mod 4) (50 draws per seed).
        criterion: the direct reading EXACT and OCCUPIED on every seed, and on every seed the median of its ten stratified shuffles at most q99 of the saturated null (the stratified shuffle destroys every exact component beyond the stratum)
        on_failure: IR-20
      - id: PC-7
        arm: the log-interval key on Z/lZ at every ladder prime and declared alphabet, seeds 0 to 9 (carried)
        criterion: the median over seeds of G at least M / 3 and below M; L1 and L3 hold for the key at that (l, M)
        on_failure: IR-7
      - {id: PC-7c, arm: 'three relabelled bit windows at every (l, M) (carried)', criterion: L3 holds for none of them, on_failure: IR-7}
      - id: PC-16
        arm: the key along the Z/l ladder at the N^(1/3) alphabets 16, 64, 128 (carried; excess growing with M)
        criterion: classify_family returns LEAD
        on_failure: IR-18
      - id: PC-16b
        arm: NEW (RR-3). The key at the FIXED alphabet M = 16 on all three ladder primes (standardised excess flat by construction - same M, same S, the same key law)
        criterion: classify_family over the three (l, 16) keys returns LEAD
        false_fail_rate_stated: about 0.011 (L2 fails when at least 9 of 10 per-seed slopes are negative; for a slope law symmetric about 0 that is 11 / 1024)
        on_failure: IR-23
      - id: PC-16c
        arm: NEW (RR-3, false-PASS check of L2). Planted mixtures at M = 16 decaying along the ladder - rho = 1 (the key) at l = 2003, rho = 0.9 at l = 130873, rho = 0.8 at l = 2095853
        criterion: classify_family over the three (l, 16) keys does NOT return LEAD
        on_failure: IR-23 (L2 does not detect a planted decay; no arm may be classified LEAD in the run)
      - id: PC-18
        arm: >-
          NEW (RR-2, blocking before any arm is read). The exact-content-only
          labels XCO1 (an independent weight w ~ Binomial(n, 1/2) conditioned on
          w = e (mod 2), labelled by the declared F1 quantile rule) and XCO2
          (q r + e with r = 0 at probability 1/2 and otherwise uniform on 1 ..
          M/q - 1), on the isomorphism types of the five Stage 2 cells' groups
          (Z/(4 x 2003), Z/(4 x 130873), Z/(4 x 2095853), Z/(4 x 549756390943)
          with e = i mod 4, and Z/(2 x 261823) with e = i mod 2), at every
          family alphabet of the matching cell and its declared S, ten seeds,
          stream label "pc18", read EXACTLY as family arms are read (stratified
          shuffles, exact-saturated null, per-seed widths).
        criterion: for XCO1 and XCO2, L3 holds at no estimated (cell, M), and classify_family over the lead keys ISO-K13@16, ISO-K19@64, ISO-K23@128 returns NEG
        on_failure: IR-21 (the rules read an exact component as excess; no arm is read anywhere in the run)
      - {id: PC-11, arm: calibration row P1 on CELL-RC1 and CELL-K19 (carried), criterion: l_fibre exactly 1 and b exactly 2 on every fibre pair, on_failure: IR-5}
      - {id: PC-12, arm: row P2 on the full group (carried), criterion: b exactly 1 on every fibre pair, on_failure: IR-5}
      - {id: PC-13, arm: row P2 on the odd-order subgroup (carried), criterion: l_image exactly 0, on_failure: IR-5}
      - {id: PC-14, arm: 'b = M / G for h2 (carried)', criterion: abs(b - 2 / G_h2) below 1e-6, on_failure: IR-5}
    per_cell:
      - id: PC-8
        arm: setup and admission (AR-B1, AR-B1-C, AR-O), carried
        criterion: as version 2, PLUS the cell's largest prime factor proved prime by complete trial division to its integer square root (RR-11)
        on_failure: IR-8, IR-9
      - {id: PC-2, arm: 'the uniform gate null at every gate alphabet, 20 per seed (carried)', criterion: 'every draw OCCUPIED, W_u > 0', on_failure: IR-2}
      - {id: PC-3, arm: 'h2 at M = 2, S = 512 (carried)', criterion: EXACT and OCCUPIED on every seed, on_failure: IR-3}
      - {id: PC-4, arm: 'the constructed h4 at M = 4, S = 2048 (carried)', criterion: 'CK-H4 on 10^4 pairs; EXACT and OCCUPIED on every seed', on_failure: 'IR-3, IR-10'}
      - id: PC-4b
        arm: the halving presentation against the constructed h4 on 10^4 sampled points (carried)
        criterion: zero mismatches
        on_failure: IR-10 - every Koblitz arm on the cell is invalid, because the halving presentation now supplies every Koblitz arm's stratum
      - {id: PC-6a, arm: 'the unstratified shuffle of h2 (and h4) (carried)', criterion: 'on every seed the shuffle median at most q99_u', on_failure: IR-6}
      - {id: PC-6b, arm: 'the planted marginal-only label, unstratified, at every gate M >= 8 (carried)', criterion: 'L1 against the uniform gate null; the median of its shuffle medians exceeds q50_u by at least 3 W_u; L3 against the uniform gate null fails', on_failure: IR-6}
      - id: PC-6d
        arm: NEW (RR-10). The STRATIFIED branch's planted-marginal check - the planted marginal-only label at M = 16 (S = 2^15) on every Stage 2 cell, ten stratified shuffles per seed, against the exact-saturated null at M = 16 measured on the gate stream
        criterion: the median over seeds of its stratified-shuffle medians exceeds q50_u by at least 3 W_u (the stratified shuffle keeps the marginal), and L3 against the exact-saturated null fails
        on_failure: IR-20 for that cell
      - id: PC-9
        arm: >-
          REDEFINED AND DISCLOSED (RR-8; RR-10). An OUT-OF-FAMILY filter, the
          polynomial-basis coordinates of x at positions 1, 3, ..., 2r - 1, at
          the PC-9 alphabet (8 on CELL-K13; 16 on CELL-K19, CELL-O19,
          CELL-K17C), curve-sampled on a SEPARATE stream label "pc9", seeds 0
          to 9, against 200 index-sampled readings from a verified table.
        criterion: the median of the curve-sampled readings within the 0.005 and 0.995 type-1 quantiles of the index-sampled reference. The exhaustive population value on CELL-K13 is REPORTED, NOT CHECKED.
        on_failure: IR-11
        not_available_on: CELL-K23 and CELL-K41 (declared, carried)
      - id: PC-10
        arm: ordering, NOW GUARDED IN CODE (RR-10)
        criterion: stage2_cell raises unless handed a clearance issued by issue_clearance for that cell, which requires every run-level record (certificate, pc1, pc5, gate_K17C, pc6c, z_ladder, pc18, calibration_RC1) passed, the cell's check_gate passed, and its PC-9 passed where declared
        on_failure: IR-14
    stage_2_validity:
      - {id: PC-15, arm: 'RLFAM, a held-out uniform label read exactly as a family arm (stratified shuffles, saturated null)', criterion: verdict NEG, on_failure: IR-17}
      - id: PC-17
        arm: NEW (RR-2). XCO1 and XCO2 built from each declared cell's own stratum, read on every Stage 2 (cell, M) exactly as family arms
        criterion: per cell, L3 holds for neither at any estimated (cell, M) (pc17_cell); in Stage 3, the classification of each is NEG
        on_failure: IR-22
    decision_clauses:
      per_seed_quantities: >-
        For arm F at (cell, M) and seed s: G_F(s); E_RL(s) = G_F(s) - q50 (the
        exact-saturated family null); E_Sh(s) = G_F(s) - the median of its ten
        STRATIFIED shuffle readings; p(s) = (1 + the number of those readings at
        least G_F(s)) / 11; Z(s) = E_Sh(s) / V_s. ESTIMATED as carried (IR-12
        mass rule).
      L1: the median over seeds of E_RL is at least 3 W (excess over the exact-saturated null)
      L2: >-
        NON-DECAY, pre-registered (RR-3). On the ladder cells at their N^(1/3)
        alphabets, one OLS slope of Z(s) against log2 l per seed; the interval
        is the second smallest to the second largest of the ten slopes; L2
        HOLDS when the interval's UPPER end is at least 0, that is, decay is
        not established (fewer than nine of ten seeds decline).
      L3: the median over seeds of E_Sh is at least 3 W, and p(s) = 1/11 on at least 8 of 10 seeds (carried form, now against the stratified shuffle)
      lead_floor: >-
        STATED (RR-3). LEAD needs L1 and L3 at all three ladder cells at
        N^(1/3), that is a stratified controlled excess of at least 3 W and an
        excess over the saturated null of at least 3 W at every ladder cell,
        plus L2. There is no growth requirement.
      classification: carried (NOT-ESTIMATED at a lead key; LEAD; NEG when L3 holds at no estimated (cell, M); ART-RES otherwise; ordinary arms NEG or ART-RES)
      sr6_exact_reading: an arm triggers SR-6 only when a reading is EXACT and the arm's image size on the support is outside 1, 2, 4 (CD-9)
    audit:
      id: CODE-AUDIT pass rule (RR-1), stated before execution
      quantities: >-
        Per declared (cell, arm, offset, M): purity_2, the fraction of
        affine-point mass (uniform on affine points) in label classes on which
        h2 (the coset P + 2E) is constant; on Koblitz cells purity_4, the same
        for h4 (the coset P + 4E). Exhaustive on CELL-K13, CELL-K19 and
        CELL-O19; a 2^20-point uniform sample with its binomial standard error
        on CELL-K23 (and, beyond the card, CELL-K41).
      blocking_preconditions: >-
        Before any count: the fast linear maps of CODE-AUDIT agree with
        core.NormalBasis.to_nb, core trace and half-trace, core.make_h2, the
        lift, and core.make_h4_constructed on 500 sampled points; the audit's
        labels equal families.arms on 200 sampled points per alphabet; and in
        exhaustive mode the enumerated affine count equals the design-time
        order minus 1. Any failure raises; no table is produced.
      rule: >-
        An arm at (cell, M) is EXACT-CARRYING when purity_2 >= 0.05 or (Koblitz)
        purity_4 >= 0.05. Consequences, fixed now. (1) Every EXACT-CARRYING arm
        is named in the table and in H-BINSTD-17cf9d; under route (a) it is
        already stratified, so no procedure changes. (2) An EXACT-CARRYING arm
        not among those this sheet predicts (F1 and the four F5 composites on
        Koblitz cells) is a design finding recorded before any run; it changes
        nothing in the procedure, because every arm is stratified. (3) An
        ordinary arm that is EXACT-CARRYING is recorded the same way; it is
        stratified by h2. The audit never changes a classification rule.
      prediction_before_c4: >-
        Written before C-4 was requested. F5 composites purity_4 = 1 and
        purity_2 = 1 by construction. F1 purity_2 high (most weight classes
        parity-pure) and purity_4 below it. F2, F3 and F4 and the ordinary
        arms near 0. A prediction, not a result.
    heur_b1:
      rule: >-
        RR-9, CODE-HB1. On CELL-K19, 200 independent pairs of lists of 2^8
        distinct uniform points; 262 distinct target points drawn under the
        seed crc32 of "heurb1-targets:CELL-K19"; direct pair-sum counting.
        Predicted law Binomial(2^16, 262 / N_E) with N_E the verified order.
        NINE BINS FIXED NOW with edges 24, 27, 30, 32, 34, 36, 39, 42
        ([0, 24), [24, 27), ..., [39, 42), [42, inf)), 8 degrees of freedom
        (nine bins, no fitted parameter). REFUTES HEUR-B1 on the cell when the
        chi-squared statistic exceeds its 99th percentile at 8 degrees of
        freedom (computed in code) or when the maximum count's tail
        probability over 200 pairs, 1 - (1 - P(X >= max))^200, is below 0.01.
        If any bin's expected count is below 5 at the verified N_E the
        chi-squared is reported and not read, and the tail check alone
        governs (fixed now). The design-time expected counts at N_E = 523492
        are printed by CODE-S0 heurb1_design (C-3).
    heur_b2_held_out:
      rule: >-
        RR-4, CODE-FAM heur_b2_held_out. For each declared Koblitz arm: LADDER
        test, premise L3 false at every estimated (cell, M) of CELL-K13 and
        CELL-K19, consequent L3 false at every estimated (cell, M) of
        CELL-K23; FIXED-ALPHABET test, premise L3 false at M = 16 on CELL-K13,
        CELL-K19 and CELL-K23, consequent L3 false at M = 16 on CELL-K41. Each
        test is DEFINED only when every involved (cell, M) is estimated.
        HEUR-B2 is falsified on the tested range for an arm when a defined test
        has its premise true and its consequent false.

  # ===========================================================================
  # RULE SWEEP (the lane-A version-3 lesson): every gate and rule checked for a
  # false PASS as well as a false FAIL, against the contract's own controls.
  # ===========================================================================
  rule_sweep:
    - rule: L3 (stratified)
      false_pass_mode: an exact component or marginal skew read as excess
      guard: stratification by the complete exact quotient (Q-CERT corollary); PC-6d, PC-17, PC-18; the rank floor needs 8 of 10 seeds against the arm's own shuffles
      false_fail_mode: a genuine excess absorbed by the strata
      bound: only the part of an excess that is a function of h4 is absorbed, and that part is exact content the certificate counts by definition
      null_rate: under exchangeability within strata p(s) = 1/11 with probability 1/11 per seed, so the rank clause alone passes with probability about 45 x (1/11)^8 x (10/11)^2 + ... = 1.7e-7
    - rule: L1 (against the exact-saturated null)
      false_pass_mode: an exact-content-only label with a skewed residual (XCO2) passes L1
      guard: L1 is never sufficient; LEAD needs L3, which PC-17 and PC-18 show it fails; L1 enters no NEG
      false_fail_mode: a genuine filter whose G is below the saturated null's q50 + 3 W
      bound: such a filter's gain is within 3 W of what the certificate's 2 bits alone give; stated as the floor
    - rule: L2 (non-decay)
      false_pass_mode: a slowly decaying excess reads LEAD
      guard: PC-16c shows a planted decay of the size rho 1 to 0.8 at M = 16 does not reach LEAD; LEAD only routes, never interprets; slower decay than PC-16c's is disclosed as not separated (interpretation limit)
      false_fail_mode: a flat excess fails L2
      rate: about 0.011 for a symmetric slope law (11 / 1024); PC-16b pins it on a flat control
    - rule: PC-16b (blocking)
      false_fail_rate: about 0.011; its failure voids LEAD and NEG for the run (IR-23); stated, not re-run (a re-run would select)
    - rule: PC-16c (blocking)
      false_pass_mode: none (it can only block)
      false_fail_mode: a planted decay reading LEAD by noise - needs at least two of ten seeds with a non-negative slope against a mean slope of about -2.5 per bit (hand estimate from the key's excess at M = 16 and V_s noise; design figure, not computed)
    - rule: PC-17 and PC-18 (blocking)
      false_fail_mode: an exact-content-only label meeting L3 by chance, at the null rate of L3 (about 1.7e-7 per (cell, M) from the rank clause)
      false_pass_mode: an implementation in which the strata leak; PC-6c and the C-5 dry calls (unstratified comparison reads the same labels as excess) show the control can fail
    - rule: PC-6c
      false_pass_mode: a stratified shuffle that does not permute (identity) would keep the exact label and FAIL PC-6c, so PC-6c cannot pass a broken shuffle of that kind
    - rule: PC-6d
      false_pass_mode: a stratified shuffle that permuted nothing would keep the planted marginal and pass PC-6d, so PC-6d alone cannot detect an identity shuffle; PC-6c does (an identity shuffle keeps the exact label and fails PC-6c), so the pair pins the branch from both sides
    - rule: IR-12 (not estimated)
