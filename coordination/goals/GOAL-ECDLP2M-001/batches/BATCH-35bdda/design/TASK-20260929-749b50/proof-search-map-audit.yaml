  no_speedup_attestation: >-
    The three files were read back for speedup, faster, break, below rho,
    stake, lead, exponent, closed and closure. Every occurrence is a
    prohibition, a routing instruction, a ceiling label, a quotation, a
    definition of a decision rule, or a statement about a positive control on
    Z/lZ. No sentence states an ECDLP speedup, an exponent move, a
    deployed-curve verdict, a filter of capacity above 2 bits on ECC2K-130, a
    below-rho cell on ECC2K-130 or a lane closure as an outcome, and no
    sentence maps a raw-G or other statistic onto a below-rho reading.

  procedure_deviations:
    - id: PD-B3-1
      severity: disclosed
      what: >-
        This sheet was written in pieces - one whole-file write ending in a
        sentinel comment, then one edit per part or code block replacing the
        sentinel, then edits pinning the C-1 hashes and embedding the C-1 to C-5
        relays, plus small edits of this session's own text (one flow-mapping
        value quoted, one design-finding sentence corrected) before any archive.
        The result is one document.
      consequence: none beyond the disclosure; nothing was archived between steps.
    - id: PD-B3-2
      severity: disclosed (read scope)
      what: >-
        A Glob listing of coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/
        displayed file NAMES of lane-A tasks of this batch (a design directory,
        review directories, a composition worksheet and receipts). None was
        opened. The listing was made to locate this task's own directory.
      consequence: no lane-A content was read; nothing from those names is used.
    - id: PD-B3-3
      severity: disclosed
      what: >-
        docs/inventor-protocol.md was opened only as a section index; its
        section 8 is applied as AGENTS.md and agents/coordinator.md restate it
        (the four audits, the nearby-object control and the method ceiling).
        Several read_scope files were not opened (read_attestation).
      consequence: none known; every carried value is taken from the version-2 records or DEC-20260929-8c3cb2 and cited.
    - id: PD-B3-4
      severity: disclosed, design choices beyond the RR list
      what: >-
        (1) PC-16c (a decaying planted control) and PC-6d at M = 16 only.
        (2) SR-6's image-size rule (CD-9), found while checking route (b). (3)
        The family null changes from uniform to exact-saturated for every
        curve-cell arm (CD-3) - the RR-1 text names the shuffle and "the
        random-label reference where used"; this is that reference. (4) PC-18
        runs on isomorphism types of the declared groups, not on the declared
        cells, so that it can block before any arm is read without computing a
        curve label; PC-17 repeats the check on every declared cell. (5)
        CODE-AUDIT also samples CELL-K41, beyond the card's form. (6) CODE-S0
        prints the HEUR-B1 design binning.
      consequence: each is recorded with its reason; the composer judges whether any exceeds what DEC-20260929-8c3cb2 permits.
    - id: PD-B3-5
      severity: disclosed
      what: >-
