    ii_RR1_route_dry_calls:
      method: 'The validator''s driver (rr1_dry.py) called the committed CODE-EST functions (PairStream,
        shuffled with strata, null_distribution with strata and q, read_arm, seed_rows, clause_L1, clause_L3)
        on SYNTHETIC groups of the declared cells'' isomorphism types, 10 seeds, 10 stratified shuffles
        and 50 exact-saturated null draws per seed. The labels were the committed XCO1 and XCO2 builders,
        EXACT4 (a skewed function of the coset only, an exact homomorphism of image 4 or 2), PLANTED (the
        committed planted marginal-only label), KEY (the log-interval key on the odd-order component,
        an approximate filter beyond the stratum, used as a power check) and UNIFORM. Mutations: an unstratified
