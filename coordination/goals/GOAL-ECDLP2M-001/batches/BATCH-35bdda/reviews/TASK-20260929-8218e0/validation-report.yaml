    iii_RR7:
      method: Dry calls of the committed CODE-CERT on synthetic factorisations (rr7_test.py); sympy as
        the disjoint truth.
      result: 'Discharged as worded: a primality, distinctness, exponent and product guard runs before
        any divisor is formed. 13 malformed factorisations are refused, including composite factors whose
        product is correct (a well-formed list-of-lists input is also refused, for its container type).
        One is accepted, the 13-base strong pseudoprime of D-J1-1, inside the disclosed probable-prime
        scope. certificate_controls passes PC-CERT-1 to PC-CERT-4.'
    iv_RR11_RR12:
      RR-11:
      - item: name the ambient of the (C3) and (C4) floors or compute them in CODE-S0
        discharged: true
        check: stage_0.floors names each ambient; CODE-S0 floors() computes them; recomputed 62.4833 (N
          = 4l), 61.4833 (N = l), 101.0000 (C3, N = l); margins 1.6743 and 0.6743.
      - item: PO-1 and primality qualifiers in asymptotic_claim.time_exponent
        discharged: true
        check: H-BINSTD-17cf9d asymptotic_claim.time_exponent reads "SUBJECT TO PO-1 AND TO THE PRIMARY
          SOURCE'S PRIMALITY STATEMENT FOR l (RR-11)".
      - item: CELL-K41's odd part proved by complete trial division in code
        discharged: true
        check: CODE-GATE prove_prime_by_trial_division is required by setup_cell for every cell's largest
          prime factor. Dry calls return True for 2003, 130873, 2095853, 549756390943, 261823, 32603,
          239 and 137, False for 32743, and None at or above 2^40. isqrt(549756390943) = 741455 (741455^2
          = 549755517025 <= m < 549756999936). The validator's own trial division and sympy agree.
      - item: maximum_runs reconciled (12 against 16)
        discharged: true
        check: maximum_runs 16 in H-BINSTD-17cf9d test_boundary.budget, in the specification budget and
          in the audit sheet cost_table; "12" appears only in constants_delta CD-10 "before".
      - item: mechanism (vi)'s ordering corrected
        discharged: true
        check: 'Mechanism (vi) places PC-16, PC-16b, PC-16c and PC-18 before any arm, and PC-15 and PC-17
          with the arms in Stage 2, before classification. Code agrees: z_ladder and pc18 are in RUN_LEVEL_REQUIRED
          of issue_clearance. The voiding after a PC-15 or PC-17 failure is in the rules (OBS-1).'
      - item: CODE-GATE's docstring aligned with the S1 order
        discharged: true
        check: The docstring lists (1) to (9) exactly as specification S1-0, then gate_cell, check_gate,
          pc9_cell, issue_clearance and stage2_cell per cell.
      - item: the LEAD route's contingent cost priced
        discharged: true
        check: 'specification budget.lead_route_contingent and audit cost_table.lead_route_contingent:
          3 x 14400 = 43200 s of max-tier sessions; 230 + 7860 + 46140 = 54230, plus 15400 and 11000,
          gives 80630 s (stated as about 80000 s, about 22 CPU-hours). Estimates, outside the contract
          budget, labelled CONTINGENT.'
      RR-12:
        discharged: true
        check: 'IMP-FHLM carries a citation_record with provenance retrieved, verified_by TASK-20260929-7d8385,
          url, retrieval date, sha256 and sections read, and the restated boundary (the halving material
          is Section 4 in CACR CORR 2003-18; the IEEE version was read by no agent). The H-BINSTD-17cf9d
          structural_ingredients entry matches. The validator did not open the PDF (outside read scope).
          The two mathematical statements the citation carries were confirmed by computation instead:
          the trace criterion and the normal-basis trace identity hold on every point of four declared
          cells.'
    C2_C3_C6: 'C2: each floor, gap and closure line names its ambient; matched rho 2^60.8090 recomputed;
      no D1, D2 or D3 is used. C3: the with-orbit rows carry the CORR-20260925-649e25 condition in conditional_on
      and in outcome row CEIL; the without-orbit line is the unconditional one. C6: setup_cell recomputes
      orders by routes A, B and (n at most 19) C, proves every toy l by trial division, and finds the
      order-4 point; design-time orders are inputs (IR-9).'
    supporting_check_PO1: An exhaustive backtracking search on all 17 abelian groups of order at most
      12, over every alphabet 2 <= M < |G| (96 pairs), found exactly sum-compatible surjective labels
      (with a combining rule invertible in each argument) only when M divides |G|, and every one was a
      quotient by a subgroup. The solution counts equal the subgroup counts (for example 3 on Z/2 x Z/2
      at M = 2, 4 on Z/3 x Z/3 at M = 3, 7 on (Z/2)^3 at M = 2 and 4). This is a falsification attempt
      on small groups, not a proof of PO-1.
  J2:
