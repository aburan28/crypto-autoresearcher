          to version 2 ignoring docstrings
        kind: none
        covered_by: null
        status: identical
      independent_recomputation_of_carried_values: '114 frozen Stage 0 figures, covering the ideal-tree
        rows, gap and closure in both ambients, the thresholds g*_k and c_k with their binding flags,
        the floors and rho, were recomputed from the stated models with mpmath at 60 digits (stage0_mine.py;
        g*_k by bisection on the stated condition rather than by the closed form). All agree within four-decimal
        rounding except the five residues of OBS-2. The Koblitz orders by the trace recurrence agree with
        brute-force point counts for n = 3 to 20. The admissible degrees below 64 are 5, 7, 9, 13, 19,
        23 and 41 (sympy isprime). The factorisations, the sample table (every M, S and M under the #E
        reading), its totals and the certificate readings (sympy.divisors) are exact. The HEUR-B1 design
        binning agrees to 1e-9, and chi2_99 at 8 degrees of freedom is 20.090235029663233 by mpmath, the
        same value CODE-HB1 prints.'
    ii_exact_quotient_audit:
      method: 'The validator''s own enumeration (my_audit.py) shares no code with CODE-CORE, CODE-FAM
        or CODE-AUDIT. The field uses the DF-8 rule with Rabin''s irreducibility test and log/exp tables.
        The normal basis uses the least normal element and numpy Gauss-Jordan coordinates, self-checked
        by reconstruction and by Frobenius as a rotation. Points are lifted with a root table of z^2 +
        z, with no half-trace. The cosets of 2E and 4E are read off a DISCRETE-LOG WALK of a generator
        of order #E (P + 2E <-> dlog mod 2, P + 4E <-> dlog mod 4). Neither the trace criterion nor halving
        defines a coset; both are checked against the walk. The arm labels are written from the specification''s
        definitions. CELL-K23''s DF-8 type-II field polynomial was derived independently, as the minimal
        polynomial of gamma + 1/gamma for a primitive 47th root of unity (type2_poly.py). It equals 13697489,
        with t normal and multiplication complexity 45 = 2n - 1.'
      cells: CELL-K13, CELL-K19 and CELL-O19 exhaustive (as the card requires), plus CELL-K23 exhaustive
        (8,383,411 affine points) against the producer's 2^20-point sample. CELL-K41 not recomputed.
      result: '96 rows compared. 60 exhaustive rows on CELL-K13, CELL-K19 and CELL-O19 are EXACT: purity_2
        and purity_4 to the six printed decimals, class counts, smallest class sizes, the EXACT-CARRYING
        flag, the field polynomial, the normal element and the affine point count. All 36 CELL-K23 rows
        agree with the sampled rows within three standard errors (F1 z = 0.68, 0.43, -1.34; every 0 or
        1 row is exact; flags identical). The sample missed a few rare F4 and F5xF4 classes. No arm or
        declared cell (n at most 23) is left unaudited. The F1 and F5 rows are the only EXACT-CARRYING
        ones, as the contract states.'
      by_products: On every point of CELL-K13, CELL-K19, CELL-O19 and CELL-K23, the trace criterion P
        in 2E iff Tr(x) = Tr(A) (PO-2) and the identity "normal-basis weight parity = Tr(x)" (DF-9, the
        RR-1 mechanism) were confirmed against the walk cosets.
