      reading: 'The route behaves as RR-1 and RR-10 require. (a) Exact-content-only labels collapse to
        within the null width under the stratified shuffle: XCO1, XCO2 and EXACT4 have E_Sh / W within
        0.15 of 0 and fail L3 on every shape, including the CELL-K19 type at the lead alphabet M = 64.
        (b) The planted marginal-only label keeps its reading (median stratified-shuffle median 7.6 to
        24.2 uniform widths above q50_u across the four shapes) and fails L3. (c) An exact homomorphism
        beyond the stratum collapses (i mod 16 on Z/(16 x 2003): shuffle medians at or below the saturated
        q99 on every seed; the identity-shuffle mutation fails this check, so PC-6c pins the branch).
        (d) A genuine excess beyond the stratum survives (KEY meets L3 with all 10 seeds at the rank floor).
        (e) The controls are not vacuous: an unstratified shuffle makes XCO1, XCO2 and EXACT4 meet L3,
        the version-2 F1 artifact reproduced on synthetic data; stratifying by h2 only lets XCO2 and EXACT4
        meet L3 on the q = 4 shape. The stratified shuffle preserves each label''s joint histogram with
        the stratum exactly; the saturated null labels satisfy label mod q = e. The saturated null at
        the CELL-K13 type, M = 16, reproduces the contract''s C-5 design figure (q50 6.13, W 0.70 against
        "about 6.1 and 0.71"). Noted in passing, as J3 material: at M = 8 on the q = 4 shape, KEY meets
        L3 but not L1, because the saturated null already carries 2 of the 3 label bits.'
    iii_RR2_wiring:
      PC-18: Committed as CODE-XCO pc18_isomorph_gate, with its criterion stated before the code (pass_criteria
        run_level PC-18). It reads XCO1 and XCO2 through the same estimator functions as family arms,
        at every family alphabet of the five isomorphism types, with lead keys ISO-K13@16, ISO-K19@64
        and ISO-K23@128 matching LEAD_ALPHABET. It is a RUN_LEVEL_REQUIRED record of issue_clearance,
        and stage2_cell raises without a clearance, so a PC-18 failure stops every arm in code. SR-1 lists
        it, IR-21 voids the run and CTL-XCO is blocking.
      PC-17: Committed as CODE-XCO pc17_cell (per cell, not-estimated counts as failure) and as the PC-17
        flag of CODE-FAM stage3. SR-1 lists it under STAGE 2 VALIDITY and IR-22 voids the cell or the
        run. The voiding itself is applied by the rules and the driver, not by stage3 (OBS-1).
      invalidation_rule_sweep: 'IR-2, IR-6, IR-8, IR-12, IR-14, IR-17, IR-20, IR-21, IR-22 and SR-3 were
        read against the RR-2 control. None reroutes it or admits a classification without it: an unestimated
        XCO fails PC-17, a dropped ladder cell makes every arm ART-DEF, and the gate failures stop the
        cell or the run before PC-17 is reached.'
      discharged: true
    iv_RR6_RR8_RR9_RR10:
      RR-6: 'In code: R_RL = 50 per seed, pooled to 500; q99 is the type-1 quantile, the 495th smallest,
        that is the 6th largest; V_s = q90 - q50 of each seed''s 50 draws (seed_width). Priced in specification
        budget.stage_split (rr6_null_stabilisation_priced) and in the audit cost_table increments (OBS-3
        notes a carried gap in the itemised sum). Discharged.'
      RR-8: 'Disclosure route, present in all three places RR-8 names: specification definitions.pc9_redefinition,
        audit_2 OC-2 and revision_discharge RR-8. Code: pc9_check compares the curve-sampled median with
        the 0.005 and 0.995 quantiles of 200 index-sampled readings (AST-identical to version 2); pc9_cell
        reports G_population_reported_not_checked on CELL-K13 only. Discharged.'
      RR-9: 'CODE-HB1 is committed: direct pair-sum counting, nine bins fixed by edges 24, 27, 30, 32,
        34, 36, 39 and 42, 8 degrees of freedom (no fitted parameter), the chi-squared 99th percentile
        computed in code, the maximum-count tail and the expected-count-below-5 rule. A dry call on synthetic
        Z/523492 ran end to end (chi2 7.82 against 20.09, tail p 0.21, no refutation; expected counts
        equal the validator''s mpmath values). inputs.missing_instruments is corrected. Discharged.'
      RR-10: 'PC-9 uses an out-of-family filter (polynomial-basis bits at odd positions 1 to 2r - 1; no
        declared arm is a gapped window) on its own stream label "pc9". The stratified branch is gate-pinned
        by PC-6c (run level, RUN_LEVEL_REQUIRED) and PC-6d (per cell, in check_gate, required by the clearance),
        and both were exercised above. PC-10 is guarded in code: stage2_cell calls require_clearance first;
        the clearance needs all eight run-level records, the cell''s check_gate and its PC-9 where declared.
        The CELL-K19 calibration rows are enforced only if the driver passes them (OBS-1). Discharged.'
