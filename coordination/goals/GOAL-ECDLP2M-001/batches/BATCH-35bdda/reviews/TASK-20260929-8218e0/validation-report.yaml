  defects:
  - id: D-J2-1
    joint: J2
    severity: material
    title: CODE-FAM identifies F2 and F3 arms by numeric offset, so four of the twelve declared Koblitz
      arms are never classified along the ladder and their HEUR-B2 held-out tests are undefined or conflated
    artifact: CODE-FAM families.py (sha256 5d9b52c3...) family_names ("F2@%d" % o and "F3@%d" % o with
      o from offsets(n, r)), stage3 and heur_b2_held_out
    evidence: 'The declared arms are "F2 at offsets 0, floor((n - r)/2), n - r" and "F3 at the same offsets",
      twelve Koblitz arms classified per arm along the ladder (specification definitions.declared_filter_families
      and decision_clauses; HEUR-B2 "DEFINED FOR the twelve declared Koblitz arms"; success criterion
      (5) "the per-seed slopes and the L2 interval are reported for every ladder arm"). The code names
      an arm by its numeric offset, which changes with n and r: the declared F2 middle-offset arm is "F2@4"
      at CELL-K13 M = 16, "F2@6" at CELL-K19 M = 64 and "F2@8" at CELL-K23 M = 128. Dry call (stage3_naming_dry.py,
      synthetic rows only): family_names yields 34 distinct Koblitz arm names over the declared (cell,
      M) grid. With an identical strong, growing excess planted at the three lead keys, F2@0 classifies
      LEAD, but the declared F2 middle-offset arm reads ART-RES under each of F2@4, F2@6 and F2@8, with
      no ladder classification, so LEAD is unreachable for it. The same holds for F2 at the end offset
      and for F3 at the middle and end offsets. heur_b2_held_out reports 34 names. Its tests are undefined
      for F2@4, F2@6, F2@8 and F2@18. "F2@9" (and "F3@9") merges CELL-K13''s END-offset arm (M = 16) with
      CELL-K23''s MIDDLE-offset arm (M = 32 and 16) into one test reported as defined. On CELL-O19 each
      declared ordinary F2 or F3 arm at a nonzero offset also splits into two names (for example ORD-F2@6
      at M = 64 and ORD-F2@7 at M = 16).'
    consequence: 'A genuine excess on F2 or F3 at the middle or end offset would be recorded as unrouted
      ART-RES residuals under several names, never as LEAD. The pre-registered LEAD route of SR-4 is therefore
      closed in code for one third of the declared Koblitz arms, and HEUR-B2 is not measured as stated
      for them (C7). The NEG reading itself is unaffected: with no L3 anywhere, every name reads NEG.
      The defect is carried from version 2: its arms and stage3 functions used the same naming and the
      same all-lead-keys test, and DEC-20260929-8c3cb2 records no such finding (the earlier lane-B reports
      were not read here).'
    remedy_pointer: Name arms by role (F2@mid, F2@end and so on) or map numeric offsets to roles before
      stage3 and heur_b2_held_out; report one verdict and one L2 interval per declared arm. A code change
      requires a new version or amendment; the reviewer repairs nothing.
  - id: D-J1-1
    joint: J1
    severity: minor (disclosed limitation)
    title: CODE-CERT accepts a factorisation whose "prime" is a strong pseudoprime to all thirteen bases
    evidence: 'checked_factorisation(4 x PSI13, {2: 2, PSI13: 1}) with PSI13 = 3317044064679887385961981
      = 1287836182261 x 2575672364521 (sympy factorint) is ACCEPTED and returns 6 divisors (the true count
      is 12). Thirteen other malformed factorisations are refused before any divisor is formed: the three
      pre-registered ones, composite factors with correct products (32743; 2047; 3215031751, a strong
      pseudoprime to bases 2, 3, 5 and 7), the factor 1, a negative factor, a negative exponent, a float
      factor, a boolean exponent, a product mismatch and a repeated factor split across entries. A well-formed
      factorisation given as a list of lists is also refused, conservatively, for its container type.'
    why_not_breaking: RR-7 asks for "a primality and distinctness check", not a proof. The committed docstring
      states that a passed strong test is a proof only below 3317044064679887385961981 (a recalled bound)
      and a probable-prime check above it. The only factor above that bound that any declared input supplies
      is l, whose primality the contract rests on the primary source, and DEC-20260929-8c3cb2 records
      review proofs of it. The toy l values are proved by complete trial division in setup_cell. The acceptance
      is therefore inside the disclosed scope and unreachable from the contract's inputs. It is nevertheless
      the literal form of the plan's J1 breaking-artifact phrase, and it is recorded so that the composer
      can apply that phrase as written.
