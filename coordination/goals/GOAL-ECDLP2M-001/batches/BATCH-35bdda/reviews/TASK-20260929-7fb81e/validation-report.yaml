        nothing is read. outcome_patterns' evaluate_pattern nulls the axes when G1 fails, but stage2_outcome
        does not, so an outcome.json reader could quote an axis label from an unreadable run. Not a route
        to a declared outcome; a presentational hazard.
    - id: O-J2-2
      severity: low
      text: >-
        For the binary cells, stage2_outcome reads no certificate field of run_cell's own output (cert_rel,
        cert_log, cert_dl_all, rho certs, inconsistent_rows); IR-2 there rests on the IR2_fired flag from
        verify.py (I5, uncommitted, pinned later). This is consistent with the text: verify.py is the
        designated independent verifier, and an absent flag counts as fired. The committed in-cell certificates
        could, at no cost, serve as a second guard within the OI-5 trust boundary.
    - id: O-J2-3
      severity: information
      text: >-
        AR-ORACLE's 10-target sample has low power alone against defects of the size that would move a
        test (escape about 0.45); the post-cell IR-11 audit is the operative guard (escape below 1e-16
        for the same defects).
    - id: O-J2-4
