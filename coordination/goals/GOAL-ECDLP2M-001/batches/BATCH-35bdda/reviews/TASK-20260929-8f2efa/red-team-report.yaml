  # ===========================================================================
  # J3 -- the estimator's decision rules and labelling
  # ===========================================================================
  J3:
    verdict: breaks
    verdict_basis: >-
      Two rules of version 3, as frozen and as coded, void or reroute the
      contract's own most likely null pattern at high rates on synthetic data
      of the declared shapes, which is the plan's J3 breaking artifact ("a rule
      that voids or reroutes the contract's own control or null pattern"):
      D-1, SR-6's CD-9 clause, stops the run and routes a certificate
      refutation in about 75 percent of runs; D-2, PC-16c with IR-23, voids
      every classification in about 12 percent of runs. The RR-1 repair
      itself survives: every null and exact-content-only label tried reads
      NEG (item ii), L2 is coded as pre-registered, and HEUR-B2 is restated
      testably (item v). Both breaks are local, with one-clause remedies.

    item_i_rule_sweep:
      method: >-
        Every stopping, invalidation and admission rule (SR-1 to SR-6, IR-1 to
        IR-24, PC-8 admission, PC-10) applied, as frozen and as coded, to the
        contract's own controls (exact controls, RLFAM, XCO1 and XCO2, the
        composite cell, the Z/l ladder, the planted controls) and to the most
        likely data pattern of a correctly functioning run in which every
        declared arm is null beyond the exact components. Rates from review
        computations RT-4, RT-6, RT-8, RT-11 and RT-13 (computations.json).
      table:
        - rule: SR-6 (CD-9 image-size clause)
          applied_to: the declared arm F5xF4 at (CELL-K13, M = 8) under the null pattern
          outcome: >-
            FIRES, about 75 percent of runs. F5xF4 at M = 8 is 4 t + h4 with t
            the top bit of the least rotation, which is 1 only for the
            all-ones normal-basis vector, the field element 1; the points with
            x = 1 are exactly the two points of order 4. So the label equals
            h4 except on those two points, which take labels 5 and 7 (C-4
            itself reports "classes 6, smallest_class 1" for this row). A seed
            on which no sampled sum hits either point reads EXACT (G = M, every
            used cell a point mass) with image size 5 or 6, outside 1, 2, 4,
            and SR-6 stops the run and routes a certificate refutation to
            review-breakthrough. Rate per seed 0.129 analytically at order
            8012 (exp(-2 S / 8011), S = 8192) and 0.150 (60 of 400 seeds,
            committed estimator.gain and image_size) on Z/(4 x 2011); per run
            (10 seeds) 0.74 to 0.80; CELL-K41 at M = 16 adds about 0.04
            (exp(-S L_41 / 2^41) = 0.004 per seed). The label is not exact
            (TB-3 note).
          verdict: breaks (reroutes the null pattern) -- defect D-1
        - rule: IR-23 via PC-16c (blocking, run level)
          applied_to: the contract's own planted-decay control under correct operation
          outcome: >-
            FIRES, 35 of 300 replicates = 0.117 (Wilson 95 percent 0.085 to
            0.158) on non-declared prime triples near the ladder primes at
            M = 16, S = 2^15, the committed classify_family deciding. The
            planted decay (median Z about 33.8, 27.6, 20.0 along the ladder)
            has per-seed slope mean -1.38 per bit, SD 0.97, and is non-negative
            on 5.5 percent of seeds, so two non-negative slopes of ten (L2
            holds, LEAD) occur in about 10 to 12 percent of runs. The sheet's
            rule_sweep gives a hand estimate of -2.5 per bit and no rate. On a
            PC-16c failure IR-23 makes every arm ART-DEF and forbids NEG, and
            in code z_ladder reports passed false, so issue_clearance refuses
            every cell. The committed z_ladder itself, run on five
            non-declared prime triples, passed PC-16c 5 of 5; on its first
            triple nine of ten slopes were negative and the second largest was
            -0.217, one seed short of LEAD.
          verdict: breaks (voids the null pattern) -- defect D-2
        - rule: IR-23 via PC-16b
          applied_to: the flat key at M = 16 on three primes
          outcome: >-
            Does not fire: 0 of 300 replicates (95 percent upper bound 0.013).
            The key's standardised excess is not exactly flat (mean median Z
            33.8, 36.7, 36.9 by prime: point repetition on the smallest group,
            l' = 2011, lowers Z), so slopes lean positive (P(slope < 0) = 0.38) and the
            stated 0.011 is conservative.
          verdict: holds
        - rule: SR-1 run level, PC-CERT-1 to PC-CERT-4, PC-1, PC-5, PC-6c, PC-7, PC-7c, PC-16, PC-18
          applied_to: synthetic analogues (PTM-A, PTM-B, PTM-C, PTM-D, RT-4, RT-6)
          outcome: each passes on its synthetic analogue; PC-18's labels read NEG on all five non-declared isomorphism shapes (RT-4)
          verdict: holds
        - rule: SR-1 per cell, PC-2, PC-6b, PC-6d
          applied_to: uniform gate null; planted marginal under the stratified shuffle (PTM-D b, the PC-6d case); the unstratified PC-6b case follows by exchangeability (the label is i.i.d. per point) and is the contract's own C-5 reading on a synthetic group
          outcome: >-
            The planted marginal keeps 9.2 to 34.0 uniform widths under the
            stratified shuffle and never meets L3 against the saturated null
            (M = 8, 16, 32, 64, 128 shapes); every saturated-null V_s in RT-4
            is positive (smallest 0.144 on the committed path and 0.136 on the
            numpy path, both at the K13 shape at M = 8), so IR-2 does not fire.
          verdict: holds
        - rule: SR-1 Stage 2 validity, PC-15 (IR-17) and PC-17 (IR-22)
          applied_to: RLFAM, XCO1, XCO2 on every declared shape (RT-4) and expected estimability (RT-11)
          outcome: >-
            L3 holds nowhere, so NEG in 3 of 3 numpy replicates and on every
            committed-path shape. Rank-floor seeds: at most 2 of 10 on the
            committed path and at most 5 of 10 in the numpy replicates, with 8
            needed. Over 90 label-cells the counts 0 to 5 occur 28, 43, 13, 4,
            1 and 1 times, against 34.7, 34.7, 15.6, 4.2, 0.7 and 0.1 expected
            under exact exchangeability.
            PC-17 also fails when XCO1 or XCO2 is not estimated. Expected used
            mass is at least 0.75 for XCO2 (analytic; 1.0 at M = 8) and about
            0.97 or more for XCO1 (its marginal is F1's; RT-11) at every declared
            (cell, M), and every committed-path reading was estimated, so that
            branch does not fire.
          verdict: holds
        - rule: IR-12 and NOT-ESTIMATED at a lead key
          applied_to: every declared arm's label marginal (labels_from_parts dry-called on 2^17 random synthetic vectors per shape)
          outcome: the smallest expected used mass is 0.82 (F5xF1, n = 13, M = 16); every arm is estimable in expectation at every declared (cell, M), so no NOT-ESTIMATED is expected
          verdict: holds
        - rule: SR-3 (a ladder cell drops)
          applied_to: committed families.stage3 on hand-built synthetic rows with a ladder cell absent, or with a lead key absent as invalid
          outcome: >-
            stage3 returns NEG for every arm, RLFAM, XCO1 and XCO2 (with ladder
            false), and PC-15 and PC-17 read passed. SR-3 says "nothing is
            classified NEG or LEAD" and the ART row says a dropped cell is
            ART-DEF.
          verdict: described one way and coded another -- defect D-5
        - rule: IR-1, IR-6 (PC-1 shuffle) and IR-7
          applied_to: PC-1, PC-7, PC-7c
          outcome: >-
            As written they confine the void to one alphabet or one M. As
            coded, issue_clearance requires pc1.passed and z_ladder.passed for
            every cell, so any one failure voids the run. The failure rates
            are near zero on the synthetic analogues.
          verdict: conservative mismatch -- defect D-6 (low)
        - rule: IR-2 (W or a V_s not positive), IR-3, IR-4, IR-5, IR-8 to IR-11, IR-13 to IR-16, IR-19, IR-20, IR-21, IR-24, SR-2, SR-4, SR-5
          applied_to: controls and null pattern
          outcome: >-
            No void under correct operation on the synthetic analogues.
            Deterministic exact controls read exactly (PTM-A, PTM-B, PTM-D a).
            PC-9's median-of-ten test against 0.5 and 99.5 percent single-
            reading quantiles has a negligible false-fail rate.
          verdict: holds
      combined_effect_on_the_expected_reading: >-
        Under a correctly functioning run with every declared arm null beyond
        the exact components, D-1 and D-2 alone leave a cleanly classified
        outcome with probability about (1 - 0.75) x (1 - 0.117), about 0.22,
        treating them as independent. A clean NEG then costs about 4.6
        attempts, about 337 CPU-hours at the contract's 73.3 CPU-hours per
        attempt, against a budget that prices one attempt. That is before any
        review round D-1 triggers.

    item_ii_null_and_exact_content_only_labels:
      construction: >-
        Non-declared groups of every declared Stage 2 shape: Z/(4 x 2011),
        Z/(4 x 130927), Z/(4 x 2095867), Z/(4 x 549756390949) with strata
        i mod 4 and Z/(2 x 261847) with strata i mod 2, at the declared
        alphabets and S, ten seeds, fifty saturated-null draws per seed, ten
        stratified shuffles per label, read exactly as family arms. Labels:
        RLFAM (uniform), XCO1 (weight classes tied to the E/2E bit, F1
