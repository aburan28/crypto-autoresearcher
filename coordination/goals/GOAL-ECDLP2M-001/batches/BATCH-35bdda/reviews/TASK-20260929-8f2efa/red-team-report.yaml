        the CODE-XCO loop body (est.PairStream, cache_labels,
        null_distribution, read_arm, exact_content_x1 and x2, random_labels)
        on the K13, K19, K41 and O19 shapes. Numpy path (gain bit-exact with
        est.gain on 16 test cases): all five shapes, three replicates.
      readings_committed_path:
        - {shape: K13 at M 16, null_q50: 6.145, W: 0.823, XCO1: 'L3 false (E_Sh/W -0.063, rank floor 1/10)', XCO2: 'L1 true (E_RL/W 4.37), L3 false (E_Sh/W -0.026, 0/10)', RLFAM: 'L3 false (-0.099, 1/10)'}
        - {shape: K13 at M 8, null_q50: 4.933, W: 0.379, all_three: L3 false}
        - {shape: K19 at M 64, null_q50: 11.016, W: 1.668, XCO1: 'L1 true (E_RL/W 8.65), L3 false', XCO2: 'L1 true (14.95), L3 false', RLFAM: L3 false}
        - {shape: K19 at M 16, null_q50: 6.078, W: 0.728, all_three: L3 false}
        - {shape: K41 at M 16, null_q50: 6.057, W: 0.712, all_three: L3 false}
        - {shape: O19 at M 64, null_q50: 7.699, W: 1.292, XCO1: 'L1 true (13.35), L3 false', XCO2: 'L1 true (20.93), L3 false', RLFAM: L3 false}
        - {shape: O19 at M 16, null_q50: 3.765, W: 0.574, all_three: L3 false}
      classification: >-
        NEG for RLFAM, XCO1 and XCO2 in 3 of 3 numpy replicates, by the
