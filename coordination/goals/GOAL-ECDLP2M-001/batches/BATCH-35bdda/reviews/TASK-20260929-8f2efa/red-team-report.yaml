    item_iii_planted_filters:
      construction: >-
        Lead shapes Z/(4 l') at the declared (M, S) of K13, K19 and K23 (16,
        64, 128; 2^15, 2^19, 2^21), the curve-cell path (stratified shuffles,
        exact-saturated null), committed classify_family with L2 as coded.
        Two filter classes from a rounded log-interval key mixture (fraction
        rho keeps the key, the rest uniform): XF, exact-free (the key on the
        l'-part only, like F2, F3 and F4), and XC, exact-carrying (4 t + e
        with t the key at M/4, like the F5 composites). Rho is calibrated per
        shape so that median E_Sh equals c x 3W; 'flat' means c is equal on
        all three cells.
      calibration_E_Sh_over_3W_at_rho_1: {K13_at_16: {XF: 4.88, XC: 3.14}, K19_at_64: {XF: 9.10, XC: 8.08}, K23_at_128: {XF: 14.29, XC: 13.40}}
      results:
        replicates: 6 (ten seeds each, fresh streams per replicate)
        exact_free_XF:
          flat_1x_floor: ART-RES in 6 of 6 (L1 fails at every lead cell in every replicate; L3 holds at the K19 shape in 6 of 6)
          flat_2x_floor: ART-RES in 6 of 6 (L3 holds at all three lead cells in 6 of 6; L1 fails at the K13 shape in 6 of 6 and at the K23 shape in 4 of 6)
          flat_4x_floor: LEAD in 6 of 6
          growing_1x_1.5x_2x: ART-RES in 6 of 6
          growing_2x_3x_4x: ART-RES in 6 of 6 (L1 fails at the K13 shape, the 2x cell, in 6 of 6; L1 and L3 hold at K19 and K23)
          key_rho_1: LEAD in 6 of 6
        exact_carrying_XC:
          flat_1x_floor: ART-RES in 5 of 6, NEG in 1 of 6 (at one times the floor each cell's median clause holds about half the time)
          flat_2x_floor: LEAD in 6 of 6
          flat_4x_floor: not plantable (the rho = 1 rounded key reaches 3.14x at the K13 shape)
          growing_1x_1.5x_2x: LEAD in 3 of 6, ART-RES in 3 of 6 (the K13 cell at 1x passes L1 and L3 in 3 of 6)
          growing_2x_3x_4x: LEAD in 6 of 6
          key_rho_1: LEAD in 6 of 6
        flatness_check: >-
          Median Z per lead cell for the flat 2x plans in replicate 0: XF
          11.4, 14.1, 13.3; XC 11.7, 11.8, 12.1. Flat in W units is
          therefore close to flat in the standardised excess Z, and L2 held
          in every flat and growing plan.
        why_exact_free_fails_L1: >-
          On the curve-cell path an exact-free label's E_RL is E_Sh minus
          (q50_sat - median shuffle), which is 3.8, 3.3 and 2.5 W at the K13,
          K19 and K23 lead shapes (RT-7 per-rho rows: at the K13 shape
          rho = 0.9 gives E_Sh/W 5.85 but E_RL/W 2.04). L1 therefore needs a
          stratified excess of about 6.8, 6.3 and 5.5 W, that is 2.3, 2.1 and
          1.8 times the stated 3 W floor. For exact-carrying labels E_RL is
          about E_Sh (offset within 0.12 W).
      reading: >-
        HOLDS FOR L2, WITH A MATERIAL OBJECTION ON THE FLOOR (D-4). LEAD is
        reachable as L2 is pre-registered: a flat excess and a growing excess
        both reach LEAD once L1 and L3 hold on the curve-cell path, and the
        key at rho = 1 reaches LEAD for both filter classes. But no control of
        the contract exercises LEAD on the path the arms are read on (PC-16,
        PC-16b and PC-16c run on Z/l with a uniform null), and for exact-free
        arms (F2 at three offsets, F3 at three offsets, F4, and F1 off its
        parity-pure classes) the effective LEAD floor is about 1.8 to 2.3
        times the stated floor. An exact-free filter at twice the stated
        floor, flat or growing to four times, reads ART-RES, not LEAD.

