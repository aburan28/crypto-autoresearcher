    item_v_heur_b2_testability:
      construction: >-
        The committed CODE-FAM heur_b2_held_out, with its HELD_OUT_TESTS
        constant pointed at synthetic shape names, on Z/(4 l') shapes of K13,
        K19, K23 and K41 at their declared alphabets, ten seeds each, with
        three labels carrying F1's marginal law: (A) the marginal alone, a
        weight class of an independent Binomial(n, 1/2) weight; (B) the
        marginal tied to the E/2E bit (the XCO1 law); (C) the marginal alone
        on the fitting shapes, and on the held-out shapes a quantile transform
        of the key position carrying F1's marginal and an arithmetic excess.
      results:
        A_marginal_only: {ladder: 'defined, premise true, consequent true, not falsified', fixed16: 'defined, premise true, consequent true, not falsified', L3_anywhere: false}
        B_marginal_plus_exact_parity: {ladder: 'defined, premise true, consequent true, not falsified', fixed16: 'defined, premise true, consequent true, not falsified', L3_anywhere: false}
        C_held_out_excess: {ladder: 'defined, premise true, consequent FALSE, FALSIFIED (L3 on K23 at 128, 32 and 16; E_Sh/W 36.3, 20.3, 16.9)', fixed16: 'defined, premise false (K23 at 16 is a fitting cell of this test), not falsified'}
      reading: >-
        HOLDS. Q-held can fail at the tested N for a label with F1's marginal,
        and neither F1's marginal skew nor the exact parity bit can meet L3 or
        falsify the consequent. The tests are defined for every declared
        Koblitz arm in expectation (item i, IR-12 row). Q-131 remains
        untestable, as the hypothesis states. One structural note: CELL-K23
        at M = 16 is a held-out cell of the ladder test and a fitting cell of
        the fixed-alphabet test, so an excess first appearing at n = 23
        falsifies the ladder test and disarms the fixed-alphabet test. The
        definitions say so; it is recorded, not a defect.

    rr_items_on_this_joint:
      RR-1_rules: discharged in substance (nulls and exact-content-only labels read NEG; the restated NEG prediction is true of a null)
      RR-2_rules: discharged (PC-17 and PC-18 wired into SR-1, IR-21, IR-22; the labels read NEG)
      RR-3: >-
        L2 is pre-registered as non-decay and coded as described
        (clause_L2: second-largest of ten slopes at least 0), with per-seed
        widths. The scoped LEAD-reach sentence is not accurate as written
        (D-2, D-4, OS-3).
      RR-4: discharged (item v; no raw-G to below-rho derivation remains)
      RR-5: >-
        Grid extended and floors measured, but measured on a different
        comparison from the one NEG is read on (D-3). Version 3 moved NEG to
        the stratified comparison against the saturated null; the floor
        stayed on Z/l with a uniform null.

  # ===========================================================================
  # J4 -- R2 boundaries, exclusions and the proves-too-much controls
  # ===========================================================================
  J4:
    verdict: breaks
    verdict_basis: >-
      PTM-A to PTM-E as the plan specifies them all meet the
      failure_signature. The joint breaks on two counts. (1) PTM-E extended:
      a declared arm that is exact-content-only up to two points, F5xF4 at
      M = 8, is read by SR-6 as a refutation of the certificate in about 75
      percent of runs, which is the known-false conclusion (D-1, the same
      defect as J3's; not a second, independent defect). (2) Over-scoped
      sentences: the NEG row and the method ceiling assert absence "above the
      measured resolving floor", but that floor was measured on another
      comparison and understates the NEG floor (D-3, OS-1, OS-2). The LEAD-
      reach sentence overstates PC-16c (OS-3). No excluded object is designed
      in, and no absorbed or cited record was edited.
    proves_too_much:
      - id: PTM-A
        object: composite order of the n = 17 Koblitz cell (CODE-CORE order_lucas(17, 0) = 130972, arithmetic only); the gate reading on the abstract group Z/130972 (not the curve cell) at the declared S
        result: >-
          divisors_from_factorisation returns all twelve divisors, 548 and 956
          among them. capacity(130972, {2: 2, 137: 1, 239: 1}, 239) returns
          [1, 2, 4, 137], so the largest divisor below 239 is 137 and the
          capacity is log2(137) = 7.098 bits, not 2. An exact_gain_stream
          replica reads G = 548 at S = 2^26 (300304 cells used, none
          non-exact) and G = 956 at S = 2^27 (913917 used, 19 excluded, none
          non-exact). The PC-5 criterion holds for both.
        meets_failure_signature: true
      - id: PTM-B
        object: Z/2^16 and Z/2^18 (not the declared Z/2^17), low log2(M) bits
        result: >-
          The certificate returns 2^0 to 2^n with every alphabet between 4 and
          the order. The low bits read EXACT on every seed at M = 8 to 128 at
          the declared S, and the unstratified shuffle collapses them (median
          at or below q99). L1 and L3 hold on the unstratified path and on the
          stratified path (strata i mod 4; E_Sh/W 7.4 to 35.3), and across
          Z/2^14, Z/2^18 and Z/2^21 at 16, 64 and 128 the classification is
          LEAD. Never reported as the random-label null.
        meets_failure_signature: true
      - id: PTM-C
        object: the log-interval key i -> floor(i M / l') on non-declared Z/l' (2011, 130927, 2095867) at every declared ladder alphabet and S, ten seeds, fifty null draws per seed, under the Stage 2 rules (stratum constant, so the comparison reduces to the uniform one) and the PC-7 criterion
        result: >-
          Median G/M is 0.629 and 0.616 (l' = 2011, M = 16 and 8), 0.677 and
          0.643 (130927, M = 64 and 16), and 0.683, 0.650 and 0.632 (2095867,
          M = 128, 32 and 16). That is M/2 plus the maximum-statistic bias of
          0.12 to 0.18 M, inside PC-7's window [M/3, M), with L1 and L3 at
          every M (E_Sh/W 10.4 to 47.8). The key reads as the far-end positive
          control on every declared M. The committed z_ladder, run on five
          non-declared prime triples at M = 16, reported no PC-7 or PC-7c
          failure.
        meets_failure_signature: true
      - id: PTM-D
        object: the stratified comparison on Z/(M x 2011) and Z/(4 l') of the declared shapes
        result: >-
          (a) the exact label i mod M beyond the stratum (M = 16 and 64)
          reads EXACT on every seed. Its stratified-shuffle medians, 5.91 to
          6.22 against a saturated q99 of 6.875 at M = 16 and 10.81 to 11.31
          against 12.8 at M = 64, collapse to the saturated null on every
          seed. (b) the planted marginal keeps 9.2, 11.8, 21.5, 29.2 and 34.0
          uniform widths at M = 8, 16, 32, 64 and 128 (criterion 3), never
          meets L3 against the saturated null, and has rank-floor seeds 0 to
          2 of 10.
        meets_failure_signature: true
      - id: PTM-E
        object: (i) XCO1 and (ii) XCO2, read as family arms on every declared shape (J3 item ii)
        result: NEG for both on every shape, committed path and numpy path, 3 of 3 replicates
        meets_failure_signature: true
      - id: PTM-E-extended
        object: >-
          An object the claim finds inconvenient: the DECLARED arm F5xF4 at
          (CELL-K13, M = 8), which equals h4 except on the two points of order
          4. It carries only the exact component the certificate counts (two
          bits), up to two points.
        result: >-
          Under L3 it reads NEG (RT-8b, committed functions on Z/(4 x 2011),
          M = 8, ten seeds): G = 8 on every seed and every shuffle median 8, so
          E_Sh/W = 0 with 0 rank-floor seeds. L1 holds, because the label
          carries the free two bits. Under SR-6 the same ten seeds give one
          EXACT reading with image size 6 (seed 6), so SR-6 stops the run and
          reads it as a certificate refutation. That happens in about 75
          percent of runs (D-1).
          That is the known-false conclusion the PTM-E signature forbids ("a
          rule that reads either as LEAD, or as anything but NEG, has proved
          too much"). Where it survives: the CD-9 clause of SR-6, which counts
          the image size over the whole support while EXACT is judged only on
          used cells.
        meets_failure_signature: false
    excluded_objects_search: >-
      Each of the following appears in the three files only in an exclusion,
      refusal, citation-by-id or attestation context: k-tree run at deployed
      parameters, target-dependent families, levels above 1,
      IDEA-20260926-d3c5a5's engine, d06324's four-arm table, D1, D2 and D3,
      per-attempt oracle budgets, AUXIN, RUN-FROB, EXP-FROB-30006a,
      EXP-QSP-70b731, IDEA-20260922-1b16d7, IDEA-20261001-39014f, BATCH-04a6be,
      BATCH-ccfdc6 and EXP-BINSTD-178742. None is designed in.
    absorbed_and_cited_records: >-
      The snapshot commit adds exactly four files and modifies none.
      IDEA-20260926-d06324 (two exact rows and RC-1 only), IDEA-20260926-136bd3,
      IDEA-20260922-153a90, -faa8d2 and -845a77 are cited by id and not edited
      by it. Whether any other commit edited them was not checked (their
      paths are outside this card's read scope).
    over_scoped_sentences:
      - id: OS-1
        where: EXP-BINSTD-c9c8a2 outcomes row NEG (lines 727-742); H-BINSTD-17cf9d interpretation_limits RESOLVING FLOOR (lines 566-573) and mechanism "a NEG asserts absence only above the measured resolving floor"
        text: '"no controlled excess of the declared arms beyond the exact components above the measured resolving floor at n at most 23"'
        why: the floor quoted beside each NEG is measured on Z/l against a uniform null; NEG on a curve cell is read on L3 against the larger saturated W, so the quoted floor understates the NEG floor (D-3)
      - id: OS-2
        where: H-BINSTD-17cf9d method_ceiling.strongest_certifiable_claim (lines 274-284); audit sheet audit_4 (lines 366-374)
        text: '"the declared arms show no controlled excess beyond the exact components above the measured resolving floor"'
        why: same as OS-1
      - id: OS-3
        where: H-BINSTD-17cf9d interpretation_limits LEAD REACH, SCOPED (lines 575-581); EXP-BINSTD-c9c8a2 success_criterion (lines 682-690)
        text: '"and PC-16c that a planted excess decaying from rho = 1 to rho = 0.8 along the ladder at M = 16 is not classified LEAD"'
        why: true in about 88 percent of runs, not as stated; nothing in the sentence covers the curve-cell path, where the arms are read (D-2, D-4)

  # ===========================================================================
  defects:
    - id: D-1
      severity: high (breaking; J3 rule sweep and J4 PTM-E-extended -- one defect, two joint consequences)
      rule: SR-6 CD-9 clause ("an arm reading EXACT whose image size on the support lies outside 1, 2, 4 on a prime-l cell")
      breaking_artifact: >-
        The declared arm F5xF4 at (CELL-K13, M = 8) equals h4 except on the two
        points of order 4. It reads EXACT whenever no sampled sum hits them:
        0.129 per seed analytically, 0.150 measured on Z/(4 x 2011). Its image
        size on the support is 5 or 6. SR-6 then fires in about 74 to 80
        percent of runs, plus about 4 percent from CELL-K41 at M = 16, stopping
        the run and routing a known-false certificate refutation to
        review-breakthrough. Shown by a dry call of labels_from_parts over all
        2^13 coordinate vectors (only the all-ones vector moves the label), an
        exhaustive check on toy curves n = 7 and 9 (the moved points are
        exactly the order-4 points, and the label is not sum-compatible), the
        committed gain and image_size over 400 synthetic seeds, and the
        contract's own C-4 row ("classes 6, smallest_class 1").
      remedy: >-
        Count the CD-9 image size only over labels that occur in used
        conditioning cells, or require SR-6's own first clause (combining rule
        verified exhaustively) before stopping. Separately, record F5xF4 at
        M = 8 as degenerate (h4 plus two points) and drop or exempt it.
    - id: D-2
      severity: high (breaking; J3 rule sweep)
      rule: PC-16c with IR-23, and its run-level wiring into z_ladder.passed and issue_clearance
      breaking_artifact: >-
        The blocking planted-decay control reads LEAD in 35 of 300 correct
        replicates (0.117; 95 percent 0.085 to 0.158). Each such run makes
        every arm ART-DEF, NEG included, and in code no cell is cleared. PC-16c
        tests only L2's false-pass direction, which bears on LEAD and not on
        NEG (NEG is read on L3 alone). The design gives a hand slope of -2.5
        per bit and no rate; the measured slope is -1.38 per bit.
      remedy: >-
        Compute PC-16c's false-fail rate in code at design time (synthetic
        primes, as here). Either plant a stronger decay (for example rho 1,
        0.7, 0.4) to push the rate below 0.01, or confine IR-23's PC-16c
        branch to LEAD alone, and separate PC-16c from z_ladder.passed so a
        failure does not refuse clearance for NEG readings.
    - id: D-3
      severity: moderate (RR-5 incompletely discharged; feeds OS-1 and OS-2)
      rule: the resolving floor reported beside every NEG (z_ladder on Z/lZ, uniform null, unstratified, L1 and L3)
      breaking_artifact: >-
        On non-declared groups of the declared Z/l ladder shapes the floor
        z_ladder reports is 0.6, 0.7, 0.5, 0.6, 0.5, 0.5 and 0.6 at (l', M) =
        (2011, 16), (2011, 8), (130927, 64), (130927, 16), (2095867, 128),
        (2095867, 32), (2095867, 16). The same exact-free mixture read on the
        path NEG uses on a Koblitz cell (Z/(4 l'), stratified shuffles,
        exact-saturated null, L3) has floors 0.8, 0.8, 0.5, 0.7, 0.5, 0.6 and
        0.7, higher at 5 of 7. The exact-carrying mixture (4 t + e) has 0.9,
        NONE, 0.6, 0.8, 0.5, 0.7 and 0.8, with no floor at all at (2011, 8):
        even rho = 1 fails L3 there. At the reported floor rho the same
        mixture meets L3 on the curve path at only 2 of 7 (l', M). The
        saturated W is 1.19 to 2.00 times the uniform W. So the floor quoted
        beside each NEG understates the floor of the NEG reading, and is
        neither measured on that reading nor labelled an underestimate.
        CELL-K41 then borrows the (2095853, 16) floor by transfer, which
        compounds this.
      remedy: >-
        Measure the floor on the curve-cell path (the ISO shapes, stratified
        shuffle, exact-saturated null, L3 for NEG), for an exact-free and an
        exact-carrying planted mixture, per declared (cell, M). Quote that
        floor beside NEG, or label the Z/l floor as an underestimate with the
        measured ratio.
    - id: D-4
      severity: moderate (J3 item iii; disclosure and missing control)
      rule: the LEAD floor (L1 and L3 each at least 3 W) on the curve-cell path, and the LEAD-reach controls
      breaking_artifact: >-
        Not a break by the plan's definition: LEAD is reachable as L2 is
        pre-registered (J3 item iii). Two gaps remain. No control shows LEAD
        reach on the curve-cell path. And for exact-free arms, L1 against the
        exact-saturated null makes the effective LEAD floor 1.8 to 2.3 times
        the stated floor, so a planted exact-free filter at twice the stated
        floor reads ART-RES in 6 of 6 replicates. The LEAD-reach sentence
        (OS-3) and the stated LEAD floor do not say this.
      remedy: >-
        State the effective LEAD floor for exact-free arms (E_Sh at least
        3 W + (q50_sat - median shuffle)). Add a curve-path LEAD-reach control,
        a planted exact-free and an exact-carrying filter on the ISO lead
        shapes, beside PC-16, PC-16b and PC-16c.
    - id: D-5
      severity: moderate (described one way, coded another)
      rule: SR-3 against CODE-FAM stage3
      breaking_artifact: >-
        stage3 classifies arms NEG when a ladder cell is absent or a lead key
        is removed as invalid. SR-3 forbids any NEG in that case; RT-13 shows
        it on hand-built synthetic rows.
      remedy: In stage3, return ART-DEF, never NEG or LEAD, when any ladder cell or lead key is missing; state the same for a lead key invalidated by IR-2, IR-6 or IR-7.
    - id: D-6
      severity: low
      rule: IR-1, IR-6 (PC-1 shuffle) and IR-7 against issue_clearance
      breaking_artifact: The rules confine a failure to one alphabet or one M; the code voids the whole run because pc1.passed and z_ladder.passed gate every clearance. Conservative, and near-zero rate.
      remedy: Align the text and the code, in either direction.
    - id: D-7
      severity: low (wording)
      rule: operative_reading "exponent-relevant only in the counterfactual sense of the ceiling"
      breaking_artifact: a pre-written interpretation of a LEAD reading, where SR-4 says write no interpretation; not TB-1
      remedy: delete "exponent-relevant only in the counterfactual sense of the ceiling"
    - id: D-8
      severity: low (vacuous outcome, as written and as coded)
      rule: definitions.decision_clauses "Ordinary-cell arms are NEG when L3 holds at no estimated (cell, M)"; CODE-FAM stage3 else-branch
      breaking_artifact: >-
        An arm with no estimated (cell, M) at all, for example an ordinary
        arm, or any arm on the branch D-5 describes, is classified NEG
        vacuously. The code never checks that any reading was estimated. The
        rate is negligible in practice, since the ordinary arms are windows
        with uniform marginals (item i, IR-12 row), but the outcome is
        reachable as coded and written.
      remedy: NEG requires at least one estimated (cell, M) per arm; otherwise NOT-ESTIMATED (ART-DEF).

  objections:
    - D-1 to D-8 above.
    - >-
      Hidden assumption, checked and harmless at these sizes: the stratified
      shuffle assumes labels exchangeable within strata. The declared arms are
      deterministic, invariant under negation (all are x-only), and F1 and F4
      also under Frobenius, so their population deviations differ from their
      shuffles'. RLFAM, XCO1 and XCO2 lack that symmetry, so the contract has
      no null of the arms' own symmetry. RT-12 supplies one and it reads NEG,
      so this is recorded and not a defect.
    - >-
      Comparator and constants: L1's reference is the exact-saturated null,
      q50 about 6.1 at M = 16, 11.0 at M = 64 and 7.7 at M = 64 on the
      ordinary shape. So exact-free arms (F2, F3, F4, and F1 except on its
      parity-pure classes) need a larger raw excess for L1 than the F5
      composites. The interpretation limits disclose this; its consequence for
      the LEAD floor is D-4.

  required_controls:
    - A curve-cell-path resolving-floor control (planted exact-free and exact-carrying mixtures on the ISO shapes, stratified, saturated null) reported beside every NEG (D-3).
    - A curve-path LEAD-reach control on the ISO lead shapes (D-4).
    - A near-exact degenerate-label control for SR-6, such as h4 plus a few exceptional points, which SR-6 must not fire on (D-1).
    - PC-16c's false-fail rate computed in code before the contract is frozen (D-2).

  counterexample_or_mutation: >-
    The cheapest falsification: zero compute. The contract's own C-4 row for
    F5xF4 at (CELL-K13, M = 8) reads "classes 6, smallest_class 1": six label
    classes, two of them single points. With S = 8192 and 8011 affine points,
    P(no sampled sum lands on either point) = exp(-2.045) = 0.129 per seed, so
    an EXACT reading with image size outside 1, 2, 4, and SR-6, fires in
    about 74 percent of runs. Confirmed for about 90 CPU-seconds (RT-8) with
    the committed functions on a synthetic group of the same shape and on two
    non-declared toy curves.

  baseline_comparison: >-
    Not applicable to these joints: the contract claims no cost below matched
    rho (2^60.8090, CORR-20260922-81aeab, target-subgroup ambient), and
    neither joint prices one. The ceiling and threshold tables are
    counterfactual arithmetic, labelled so at every row (item iv).

  heuristic_challenges:
    - HEUR-B2's restated consequent is testable and immune to marginal skew and exact parity (item v). Its transfer spans the ladder's log2 l of 10.97 to 21.00 against 129 at the deployed row, about 108 bits; the hypothesis states this and calls it a heuristic, never a bound. Not a J3 defect.

  cost_model_challenges:
    - >-
      Uncharged inverse success probability. The budget prices one attempt of
      about 73.3 CPU-hours. Under the null pattern D-1 and D-2 leave a cleanly
      classified run with probability about 0.22, so a clean NEG costs about
      4.6 attempts, about 337 CPU-hours. IR-23 also forbids re-running a voided
      run ("a re-run would select"), so each void needs an amendment, which is
      not priced.
    - Uncharged review cost. Each D-1 trigger opens a review-breakthrough contradiction round, which the contract's own LEAD-route pricing puts at about 43200 s of max-tier sessions. It is incurred with probability about 0.75 per run and absent from the budget.
    - Unmeasured resolution. The curve-cell floor a NEG would need (D-3) is not in the run plan or the cost table.

  reduction_and_scope_challenges:
    - OS-1, OS-2 and OS-3 (J4).

  proof_architecture_challenges:
    - >-
      Method-ceiling attack on the instrument. L2's non-decay clause separates
      a decay only when nine of ten slopes are negative. PC-16c's planted decay
      in Z of about 40 percent (33.8 to 20.0) is accepted as non-decay about
      12 percent of the time. Any decay of that size or slower is therefore
      not reliably separated, which goes beyond the contract's disclosed
      limit ("decaying more slowly than PC-16c's").

  null_and_nearby_object_controls:
    checked: [RLFAM (uniform), XCO1, XCO2, automorphism-invariant random labels (RT-12), planted marginal (PTM-D b), exact filter beyond the stratum (PTM-D a), composite order (PTM-A), Z/2^n (PTM-B), the key on Z/l' (PTM-C), the degenerate declared arm F5xF4 at M = 8 (RT-8)]
    missing_in_the_contract: [a graded positive control on the curve-cell path (floor and LEAD reach), a near-exact degenerate-label control for SR-6, a null with the declared arms' own symmetry (supplied here; it reads NEG)]

  did_the_claim_survive: >-
    In part. The mechanism of the version-3 repair survives my best attack:
    on every declared shape, a uniform label, both exact-content-only labels
    and an automorphism-invariant label read NEG under the stratified
    comparison. An exact filter beyond the stratum and the low bits of
    Z/2^n are seen, and a planted marginal is kept. L2 is coded as
    pre-registered, and HEUR-B2's consequent can fail and cannot be moved by
    marginal skew. What breaks is two stopping and invalidation rules that
    act on the contract's own expected reading (D-1, D-2), plus a floor
    quoted on the wrong comparison (D-3). Remaining uncertainty, named: the
    rates come from synthetic groups of the declared shapes, not from the
    curve cells. D-1's rate rests on the uniformity of sampled sums over
    8011 affine points (analytic 0.129 per seed; synthetic 0.150 +- 0.018).
    D-2's rate (0.117) is for the declared M = 16 shapes and the declared
    planted mixture. Neither depends on any arm's arithmetic.

  narrowest_supported_statement: >-
    As frozen, the version-3 decision rules read every null and
    exact-content-only label I constructed as NEG on non-declared groups of
    the declared shapes. But SR-6's CD-9 clause and PC-16c with IR-23 would
    reroute or void a correctly functioning null run about 75 and 12 percent
    of the time, and the floor quoted beside NEG is not the floor of the NEG
    reading. These are local defects of J3 and J4 with stated remedies, and
