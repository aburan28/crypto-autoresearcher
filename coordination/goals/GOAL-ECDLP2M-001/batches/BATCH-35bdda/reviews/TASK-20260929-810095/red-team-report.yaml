  heuristic_challenges:
    - H1 (e), the Poisson coverage law, is listed as tested but effectively ungated outside the LOW-RETRY audit (J3-D1).
    - H1 uniform legs meets a known structure on the binary cells (coset subgraphs, coset factor); benign within the 5 percent line for f <= 1.02 (J3-D4, J3-O5).
