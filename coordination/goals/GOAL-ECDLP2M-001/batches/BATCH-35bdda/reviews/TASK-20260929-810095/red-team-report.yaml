          divided by the simultaneous rise of a_bar (ln KR moves 0.87 s_lnKR when
          rho_rel moves 3.9 of its own sd). kappa_hat, which detects the deficit at
          3.5 to 11 sigma, is read only inside the LOW-RETRY audit
          (h1_axis requires both cells LOW-RETRY).
        contradicts: >-
          EXP-BINSTD-8cb697 outcome_table.per_cell_class (the R2-J3-4 mapping);
          H-BINSTD-099d93 statement (D) ("What the cells test is therefore ... target
          coverage (kappa_hat)"), H1 formal_statement (consequence (e) listed among
          those "which the contract tests") and H1 validation_plan ("a 10 percent
          target-coverage deficit is about 7 standard errors", a power the decision
          table does not deliver: it reads YIELD in 43 percent of such runs); and
          outcome_table.certifies_only (POSITIVE certifies the validation record of
          "target coverage" while the contract's own deficit flag is raised on both
          cells).
        why_it_matters: >-
          H1 (e) is the law behind A(mu) = 1/(1 - exp(-mu)), the attempts constant
          the deployed column charges (A(1) = 1.582 in T_shared and in kappa_m). A
          toy POSITIVE that certifies it while its own statistic rejects it would
          carry a falsified constant into the proposed column note. The subspace
          base V is additively structured, so a mild repeated-sums deficit is a live
          alternative, not a contrived one.
        remedy_cheapest: >-
          Zero compute. Add two per-cell gated tests to gate_tests (and so to G1
          (a)): T_kappa, |z_kappa| at most 3.3 (low when z < 0), and T_rho,
          |ln rho_rel| at most 3.3 sqrt(exp(-mu_c) / B_c) (low when rho_rel is
          high); keep both out of COVERAGE_TESTS so a deficit classes LOW-RETRY;
          restate the R2-J3-4 mapping and H1-NEGATIVE-YIELD accordingly; add two
          generative patterns (5 percent and 10 percent low-dispersion deficits) to
          outcome_patterns. Cost under H1 (C13): per-cell non-PASS 0.77 to 0.97
          percent. Benefit: at a 10 percent loss the per-cell non-PASS rate rises
          from 65 to 100 percent (99.3 percent LOW-RETRY); at 5 percent from 6 to 64
          percent. Alternative (weaker):
          declare (e) reported-not-gated and remove target coverage and the
          relation-phase yield from statement (D), H1's tested consequences and
          certifies_only.
      - id: J3-D2
        severity: minor (dormant)
        title: IR-5 (a) consequence differs between text and code
        evidence: >-
          The text says a summed figure in place of the separate columns
          "invalidates THAT FIGURE, which is not read"; ir5_check sets
          ic_reading_valid false when a separate column is missing, so the code
          invalidates the cell's IC reading (H1-ARTIFACT). It cannot fire on the
          committed program's own output (C02), so no outcome moves.
        remedy: Align the text of IR-5 (a) and RB-IR5 with ir5_check, or split the flag.
      - id: J3-D3
        severity: minor (dormant)
        title: The null arm's extra target attempt every 4 B relations fires only when the check cadence divides 4 B
        evidence: >-
          run_ic_null adds the attempt only at rels that are multiples of both
          max(1, B // 16) and 4 B. That holds when 16 divides B and for some other B
          (for example 520), but not in general: at B_c = 509 the cadence is 31, the
          least common multiple 63116 exceeds 16 B = 8144, and the rule never fires.
          B_c on a binary cell is about 512 but not fixed. Dormant: no null target
          stayed unsolved in 32000 simulated arms (it solves at about B relations).
        remedy: State it, or test rels % (4 B) independently of the check cadence.
      - id: J3-D4
        severity: minor
        title: Coset factor uncharged in the binary predictions
        evidence: >-
          D-15 and A5: the true mean decomposition count over G is f mu_c with f =
          h sum |F_i|^2 / |F|^2 >= 1; every prediction (a_pred, K_pred, kappa_pred,
          bands) uses mu_c and f is reported, not gated, with no design expectation.
          Per-cell non-PASS (C08_C09): 1.1 percent at f = 1.02, 6.25 percent at
          1.05 (above the 5 percent line), 65 percent at 1.10, all toward HIGH; an
          excess f also raises kappa_hat (z +2.0 at f 1.05) and masks a coverage
          deficit of similar size. A balanced F gives f - 1 of order 1e-3 (D-15);
          f >= 1.05 needs about a 22 percent coset imbalance at h = 2.
        remedy: Predict at the measured f mu_c (the |F_i| are counted at setup), or admit f at most 1.02 as an AR rule.
      - id: J3-O5
        severity: observation
        title: Coset-subgraph structure of the binary relation graphs is unstated
        evidence: >-
          For R in G the two legs lie in cosets i and -i, so the relation graph is a
          disjoint union of 2 (BIN-ORD-19) or 3 (BIN-KOB-19: B/4, B/4, B/2 columns)
          subgraphs. Benign within the 5 percent line (C09b): non-PASS 0.75 and 1.33
          percent; on KOB u_hat - delta_hat^2 is biased by +0.0016 and mean delta
          by -0.003, roughly doubling KOB's false non-PASS against ORD's and so
          slightly raising P(H1-MIXED) through CTL-2.
        remedy: Disclose in A5 beside the coset factor.
      - id: J3-O6
        severity: observation
        title: '"Equal per-test false-fail rates on all three cells, by construction" is overstated'
        evidence: The per-cell bands equalise the nominal sd multiple only; simulated rates differ (non-PASS 0.59, 0.83, 0.64 percent; under the coset structure 0.75 and 1.33 percent).
      - id: J3-O7
        severity: observation
        title: Per-target generic group operations are outside every gated observable
        evidence: >-
          KR, FR and d_sigma are ratios of oracle units; a per-target pipeline that
          spent generic group operations (for example a walk on a leg) instead of
          the stored vector would be invisible to them except through T_u and T_a
          side effects. The committed reuse arm cannot do this and IR-6 pins it; the
          per-target group_ops column is reported but ungated.
        remedy: Optional cheap gate, per-target group_ops at most a fixed multiple of attempts.

