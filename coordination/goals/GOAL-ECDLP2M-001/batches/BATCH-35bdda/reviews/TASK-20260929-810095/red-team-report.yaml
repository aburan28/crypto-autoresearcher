    in which case J3-D1 is a material non-breaking defect; (2) the size of the
    undetected-deficit range depends on how dispersed the decomposition count is
    given a nonempty attempt (low dispersion up to about 15 percent, Poisson-tail
    dispersion up to about 10 percent), but the existence of POSITIVE-labelled
