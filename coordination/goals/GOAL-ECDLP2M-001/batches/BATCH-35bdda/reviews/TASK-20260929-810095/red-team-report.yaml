    - 'Observation fibre: a per-target pipeline using generic group operations would share the gated observables with genuine reuse; separated today only by IR-6 code pinning (J3-O7).'
    - 'Quantifier order: the window witnesses depend on c, disclosed; the containment threshold depends on which line is used (J4-D1).'
    - 'Nearby object for H1: no physical negative control (RC-3).'
  narrowest_supported_statement: >-
    Under the contract's abstract model and correct instruments, the version-3
    decision table reaches every declared outcome from producible patterns; no
    invalidation, stopping or admission rule fires on its own declared metrics or on
    P1; every gate's false-fail rate is at most 2.4 percent per cell at every tested
