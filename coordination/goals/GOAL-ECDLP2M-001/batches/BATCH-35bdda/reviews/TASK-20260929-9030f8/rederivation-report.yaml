    - id: Q0-6
      topic: reading of "G = M" in the threshold rule
      quoted_text: A tree whose total at G = M already lies above rho is unconstrained (g* = log2 L).
      admissible_readings:
        a: G = L, the list size (consistent with the parenthetical g* = log2 L and with Q3 asking for the main term
          at G = L) (used)
        b: G = an alphabet size M; none is declared in the threshold table ambient (N = l); the R-M alphabets at
          N = l would be 2^43 (p = 3) and 2^32 (p = 4), both tested
      reading_used: a
      dependent_quantities: Q3 unconstrained flags (and g* = log2 L on unconstrained rows)
      impact: 'none: flags identical under G = L [True, True, True, False, False, False, False, False], G = 2^32
        [True, True, True, False, False, False, False, False] and G = 2^43 [True, True, True, False, False, False,
        False, False]'
    - id: Q0-7
      topic: real against rounded arithmetic in Q3
      quoted_text:
      - k = 2^j lists of size L = N^(1/(j + 1))
      - relations B without orbit unknowns and B/262 with them
      - c_k = g*_k / 129.0000
      admissible_readings:
        a: 'exact real arithmetic throughout: log2 l exact, L and R = L/262 real, rho unrounded (60-digit mpmath)
          (used)'
        b: rho rounded to 4 decimals before solving
        c: 'integer lists and relations: L = floor(l^(1/(j+1))), R = floor(L/262)'
        d: log2 l taken as exactly 129
        e: c_k divided by log2 l instead of 129.0000
      reading_used: a
      dependent_quantities: Q3 g*_k and c_k
      impact: 'no four-decimal value and no flag changes. max |delta g*|: b 1.83e-05, d 3.94e-21; max |delta c_k|:
        b 1.42e-07, c 2.33e-07, e 3.05e-23; unconstrained flags under c [True, True, True, False, False, False,
        False, False] (same as used)'
      four_decimal_values_identical_under_c: true
    - id: Q0-8
      topic: real against rounded arithmetic in rule R-M
      quoted_text: 'Rule R-M: M = 2^r with r = floor(log2(N) / p + 1/2)'
