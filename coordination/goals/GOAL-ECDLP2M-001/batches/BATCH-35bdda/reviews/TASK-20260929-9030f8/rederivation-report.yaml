    row_count: 68
    notes:
    - 'Every F2 and F3 row is 0. Mechanism, verified on every point: P in 2E iff Tr(x) = Tr(A), and Tr(x) is the
      sum of all n normal-basis coordinates, or in the polynomial basis the parity of the bits [0, 9] (n = 13),
      [0, 17] (n = 19), [0, 1, 2, 4, 8, 16] (n = 23, f_23). No window of r < n coordinates contains all of them,
      so no label determines the trace; the computation finds every class holding points of both 2E-cosets.'
    - 'purity_4 is 0 on every F1, F2 and F3 row (computed). Part of the mechanism, verified pointwise: for P outside
      2E the two points sharing its x lie in different 4E-cosets (psi_4(-P) = -psi_4(P) has order 4), so any class
      containing such an x is 4E-impure; every remaining class (x with points in 2E only) was found to hold points
      of both 4E-cosets inside 2E.'
    - F1 purity_2 is high because Tr(x) equals the normal-basis weight mod 2 (Tr(w) = 1), so every class holding
      a single weight is 2E-pure.
    - 'The F4 class of x = 1 is a singleton class: x = 1 has the all-ones normal-basis vector (Tr(w) = 1), the only
      vector whose least rotation starts with 1. Its points (1,0) and (1,1) have order 4, lie in the same 2E-coset
      and in different 4E-cosets, so the class is 2E-pure and 4E-impure. Rows whose pure2 count is 2 (K13 M = 8;
      K19 M = 16; K23 M = 128, 32, 16) consist of this class alone.'
