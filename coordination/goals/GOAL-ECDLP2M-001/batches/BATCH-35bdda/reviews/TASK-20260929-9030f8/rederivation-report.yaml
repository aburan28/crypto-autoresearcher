        direction_iii: window = coordinates o, o+1, ..., o+r-1 (mod n) (used; no wrap at these offsets)
        direction_iv: window = coordinates o, o-1, ..., o-r+1 (mod n) (wraps)
        label_encoding: order of the r bits inside the label only renames classes; no effect on class counts or
