        a: 'exact: r decided by the integer test 2^(p(2r-1)) <= N^2 < 2^(p(2r+1)) (used; cross-checked with 50-digit
          mpmath)'
        b: log2 N rounded before applying the floor
      reading_used: a
      dependent_quantities: 'CELL-O19 at p = 4 only: log2(N)/4 + 1/2 = 4.9995580779266, 0.000441922 below the boundary
        (N = 261823 < 2^18 = 262144), so r = 4, M = 16; with log2 N = 17.9982323117064 rounded to two or fewer decimals
        (18.00) r = 5, M = 32 (log2 S = 17, S = 131072). Every other R-M value is at least 0.156 from an integer.'
      impact: 'Q1 (cell, M) row of CELL-O19 only; Q2 values unaffected: CELL-O19 at M = 32 also gives purity_2 =
        0 on every F2/F3 row and on every possible window (computed)'
