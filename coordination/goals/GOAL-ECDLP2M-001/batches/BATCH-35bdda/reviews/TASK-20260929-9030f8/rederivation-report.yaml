independent_recomputation:
  recomputed_myself:
  - 'Q1: every field polynomial (DF-8 search from scratch), every normal element, every group order, factorisation,
    N, log2 N, every R-M r and M, every log2(128 M^2), log2 S and S'
  - 'Q2: all 68 rows (class counts, pure-point counts, exact fractions, 9-decimal values) by exhaustive enumeration'
  - 'Q3: rho, all eight rows, the smallest-c_k rows, and every Q0 sensitivity value'
  reverified_with_disjoint_checker:
  - item: Q2, all 68 rows, plus orders and coset structure of CELL-K13, K19, K23, O19 and the order of CELL-RC1
    primary: 'q2_purity.py (Python/numpy): log tables, scalar multiplication (#E/4)P, Gauss-Jordan coordinates,
      F4 by rotating the bit-reversed integer, bincount aggregation'
    checker: 'q2_check.c (C, gcc 13.3.0): table-free field arithmetic with Euclidean inversion, cyclic-walk coset
      labels, trace-dual-basis coordinates, F4 by direct lexicographic comparison, per-class bitmask aggregation'
    lineage: 'disjoint: separate language and source, no shared code, tables or library calls; inputs shared: the
      card parameters, the Q1 field polynomial (irreducibility verified by three tests in Q1) and w (re-verified
      in C: normality, minimality where applicable, basis complexity)'
    result: 'identical on every row (non-empty classes, 2E-pure points, 4E-pure points); C walk closes at exactly
      #E, visits every affine point once, 0 trace-criterion mismatches'
  - item: group orders
    primary: Lucas/Weil recurrence (Koblitz) or exhaustive Python count (O19, RC1)
    checker: exhaustive counts in two further independent codes (numpy, C) where n <= 23; Hasse-interval uniqueness
      from exact orders of seeded random points on every cell (the only check at n = 41)
    lineage: disjoint methods (recurrence vs counting vs point orders)
    result: all agree
  - item: irreducibility of every candidate and selected field polynomial
    primary: Ben-Or
    checker: Berlekamp nullity (own code) and sympy is_irreducible
    lineage: three algorithms, one from a library
    result: agree on every polynomial tested
  - item: Q3 table
    primary: mpmath closed form at 60 digits
    checker: 'q3_check.py: IEEE doubles, bisection on the stated inequality, no closed form'
    lineage: disjoint method and arithmetic
    result: max |g* difference| 3.6e-15, identical unconstrained flags
  - item: primality of the deployed prime
    primary: sympy.isprime
    checker: own Miller-Rabin, 84 bases
    lineage: library vs own code
    result: prime
  - item: R-M floors
    primary: exact integer test 2^(p(2r-1)) <= N^2 < 2^(p(2r+1))
    checker: mpmath at 50 digits
    lineage: disjoint
    result: agree on every cell
  taken_on_word:
  - The card parameters themselves (definitions, named field polynomials, A and B, the deployed prime, the constants
    128, 100, 262, 131 and the k values). They are inputs, not claims, and were not checked against any producer
    record, none of which was read.
  - 'Standard mathematics used as stated facts, each also tested numerically where possible: the Hasse bound (premise
    of the order uniqueness check); the Weil/Lucas recurrence (agrees with exhaustive counts for n <= 23); the halving
    criterion P in 2E iff Tr(x) = Tr(A) (used only as a third label source; agrees on every point); the type-II
    existence criterion (agrees with the f_n test at every n).'
  - Correctness of the toolchain (CPython, numpy, sympy, mpmath, gcc), mitigated by cross-language agreement.
  - Nothing from any producer artifact.
