    breaking_artifact:
      id: B-J2-1
      location: ledger/hypotheses/H-NISTBIN-dec5e1.yaml version_4.interpretation_limits.entries[5] (file lines 2923-2926)
      text: >-
        "The BATCH-b67954 red team's range for crossings at high degree
        (BA-J4-2, attributed) is read as no earlier there, not strictly
        later. No one-way M7 direction is asserted outside that
        range-restricted form."
      why_it_breaks: >-
        BA-J4-2's range is crossings at D >= 19 at m = 12. DEC-20260925-41f6dc
        RD-6 records it so, and the specification's attributed_range quotes
        it. Reading that whole range as "no earlier" asserts clause (b) at
        X = 19. Clause (b) needs DELTA7(X - 1) <= 0, but DELTA7(18) = +0.4789
        at m = 12 (MI-1; +0.4950 ceiled). X = 19 is D_cum(12), where the
        lemma form itself says UNDETERMINED. PTM-I exhibits a strictly earlier
        M7-BIN crossing (18) at an R-B crossing of 19 at both 571 rows. The
        sentence therefore matches three of the plan's frozen breaking
        artifacts. It asserts a direction over a degree range on which the
        cumulative difference has the opposite sign. It states a range wider
        than PTM-I supports, by one degree. PTM-I reaches its known-false
        conclusion there. Its own entry says "undetermined at D_cum(m)" one
        sentence earlier, so the entry contradicts itself at X = 19. Its
        closing meta-sentence is false while the preceding sentence stands.
      related: >-
        audit m7_direction_lemma.rd6_search_corrected states that every in-force
        use beside M7 is "either in the conditional statement, the lemma form
        or the attributed range as qualified". That is false at this sentence,
        which meets the plan's "rd6_search still false" artifact on the same
        root defect. The worksheet's RV3-3 row lists this entry ("hyp
        version_4.interpretation_limits.entries (sixth entry)") as a location
        of the qualification. The index maps
        version_3.interpretation_limits.entries[0] ("a consistent binomial
        reading does the second for crossings at high degree") to this entry,
        so this is the designated remedy point, and RV3-3's third clause did
        not reach it.
      what_is_correct: >-
        The specification's attributed_range is correct: "NO EARLIER ... for
        crossings above the cumulative crossover, X >= D_cum + 1 at m = 12, and
        is undetermined at X = D_cum". The defect is a cross-file remedy gap
        of one clause, not an error in the lemma.
      remedy: >-
        Replace "is read as no earlier there, not strictly later" by "is read
        as no earlier for crossings above the cumulative crossover (X >=
        D_cum(m) + 1, from 20 at m = 12), not strictly later, and as
        undetermined at X = D_cum(m)". Then restate
        rd6_search_corrected's result. Text only; zero runs.
      severity_note: >-
        Narrow. One sentence, one degree, one m, in an interpretation limit on
