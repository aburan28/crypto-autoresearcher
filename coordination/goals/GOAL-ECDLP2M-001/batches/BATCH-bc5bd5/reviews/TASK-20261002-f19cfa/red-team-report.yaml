    PTM_I:
      definitions: >-
        As the plan states them. N5 = m k + (m - 2) 571 Boolean variables of
        system (5) at t = m. The count n(t - 2) + kt is confirmed at source in
        Semaev 2015 Section 4.5.1, inputs/SEMAEV-2015-310/paper_fulltext.md
        line 612, provenance retrieved. DELTA7(D) = [W(N5, D) - W(N5, 4)] -
        (D - 4) log2 571. D_ps is the least D in 5..64 with W(N5, D) - W(N5,
        D - 1) < log2 571. D_cum is the least D in 5..64 with DELTA7(D) < 0.
        Both are determined by exact integer comparison of binomial partial
        sums, S(N5, D) < 571 S(N5, D - 1) and S(N5, D) < S(N5, 4) 571^(D -
        4). Exact log-concavity of the partial sums on 4..64 was confirmed at
        every N5 of the table, which gives the concavity the lemma uses. The
        theorem that partial sums of a log-concave row are log-concave is
        recalled, a pointer only; the numerical check is exact.
      roundings: >-
        Under both contract k readings N5 is an exact integer (571 is prime,
        so m k is n under MI-1 and m ceil(571/m) under the ceiled reading).
        The roundings round, floor and ceil agree at every m, and a
        float-path truncation int(m (571/m) + (m - 2) 571) gives the same
        integers. Sensitivity probe outside the contract, N5 - 1 and N5 + 1:
        D_cum is unchanged at every m under both readings. D_ps moves only
        under the ceiled reading, at m = 7 (+1: 6 to 7), m = 8 (-1: 8 to 7),
        m = 9 (+1: 8 to 9), m = 21 (+1: 20 to 21) and m = 27 (+1: 26 to 27).
        The direction, being keyed to D_cum, is robust to the rounding of N5.
        Under the out-of-contract floor reading k = floor(571/m), D_cum would
        shift at m = 13 (21) and m = 25 (51). That is recorded, not a defect.
