      endpoint_comparison: >-
        Exact on every degree. All 58 (m, k reading) D_ps and D_cum values,
        every N5, and every DELTA7 maximum with its argument (0.0002 bit)
        equal CB-3 output M7_crossovers (0 mismatches). Every endpoint the
        specification prints agrees: m = 12 MI-1 D_ps 11 and D_cum 19; D_ps
        = D_cum = 5 at m <= 6 (MI-1) and m <= 5 (ceiled); D_ps 6..29 and
        D_cum 8..64 for m = 7..30 (MI-1); D_cum "none in 5..64" at m = 30
        ceiled. The knife-edge entry is m = 6 MI-1, where DELTA7(5) =
        -0.0015 is exactly negative (integer comparison) and is stable under N5 +- 1. The
        ceiled m = 6 entry has DELTA7(5) = +0.0010, so D_cum = 6 there.
      crossing_cases:
        method: >-
          For each k reading, each m in 2..30 and each R-B crossing X in 5..64
          (3480 cells), the rho levels giving R-B crossing X form the interval
          [A + S_B(X - 1), A + S_B(X)). Over that whole interval the least and
          the greatest M7-BIN crossing are the least D with S_7(D) > S_B(X -
          1) and the least D with S_7(D) >= S_B(X). A and omega cancel, so
          both are exact integer comparisons and curve-independent: the two
          571 rows differ only through rho. Concrete cuts at both rows
          (positions 0.001, 0.5 and 0.999 of the interval, m = 8 and m = 12,
          MI-1, PF-2) were also evaluated from the closed forms with 256-bit
          margins.
        results:
          lemma_violations: 0
          case_a_below_D_ps: 606 cells; no later at every cell; strictly earlier reachable at 557 of 606
          case_b_in_open_D_ps_to_D_cum: >-
            853 cells. Strictly earlier is reachable at all 853. Strictly
            later is reachable only at the 47 cells with X = D_cum. A sentence
            switching to "later" at D_ps is false on (D_ps, D_cum - 1] at
            every m with D_ps < D_cum - 1.
          below_D_cum: 1460 cells; strictly later reachable at 0 (a "later" sentence is false below D_cum)
          at_D_cum: 57 slots; both directions reachable at 48; at the 9 slots with D_cum = 5 (MI-1 m 2..6, ceiled m 2..5) no earlier, later reachable
          case_c_above_D_cum: 1963 cells; strictly earlier reachable at 0
        concrete_demonstrations:
          - >-
            m = 8 (D_ps 7, D_cum 10). At an R-B crossing of 8 (case b) with rho
            at the bottom of its interval, M7-BIN crosses at 7 at both rows. At
            an R-B crossing of 10 (= D_cum) it crosses at 9 (bottom) or 11
            (top). At 11 and 20 (case c) it crosses at 11 to 12 and 21 to 22.
            Rho offsets from each row's own rho are given in computations.json.
          - >-
            m = 12 (D_ps 11, D_cum 19). At R-B crossings of 12 to 18 (case b)
            M7-BIN crosses one degree earlier at the bottom of the interval
            and the same elsewhere. At 19 it crosses at 18 (bottom, offset
            +291.20 bits for K-571 and +286.12 for B-571) or 20 (top). At 20
            and above it crosses the same or later. This is the cut that
            refutes DS-21.
        actual_crossings: >-
          At the 58 R-B crossings of the in-force table (MI-1, PF-2): 4 at X <=
          4 (M7-BIN equal), 48 in the no-later region, 0 in the undetermined
          slot, 6 in the no-earlier region, 0 violations. M7-BIN is earlier at
          17, later at 1 and the same at 40. These equal CB-3
          M7_actual_crossings exactly. The same check under C-CEIL-T (47, 1, 6;
          13 earlier, 0 later) and C-PF1-T (as in force) also gives 0
          violations.
      failure_signature_result: >-
        NOT MET at one sentence (DS-21, B-J2-1). Met everywhere else: no
        in-force sentence switches at D_ps, and every other range-restricted
        sentence is keyed to D_cum.

    P_S:
      evaluated: >-
        D*_M - D*_B at every (curve, m), m in 2..30, in the in-force table
        (MI-1, PF-2), in C-CEIL-T and in C-PF1-T, from this reviewer's own
        threshold computation. Tokens are counted as in NF-12, and the
        precision guard is a minimum |margin| of 0.00245 bit over every
        evaluated cell.
      spreads_in_force:
        K-571: {2: 0, 3: -1, 4: 1, 5: 1, 6: 1, 7: 1, 8: 1, 9: 1, 10: 1, 11: 1, 12: 1, 13: 1, 14: 1, 15: 1, 16: 1, 17: 1, 18: 1, 19: 1, 20: 2, 21: 1, 22: 1, 23: 1, 24: 1, 25: 1, 26: 1, 27: 0, 28: 1, 29: 1, 30: 1}
        B-571: {2: 0, 3: 0, 4: 0, 5: 1, 6: 1, 7: 2, 8: 1, 9: 1, 10: 2, 11: 2, 12: 2, 13: 2, 14: 2, 15: 2, 16: 1, 17: 1, 18: 1, 19: 1, 20: 1, 21: 2, 22: 2, 23: 1, 24: 1, 25: 1, 26: 1, 27: 1, 28: 0, 29: 1, 30: 1}
      negative_entries: >-
        Exactly one in each of the three tables: (K-571, m = 3), spread -1,
        with the R-M crossing at D = 3 (below 4) and the R-B crossing at
        D = 4. At m = 3 the 256-bit margins are R-B -31.77, -4.29, +23.18 and
        R-M -20.99, +1.72, +23.18 at D = 2, 3, 4. "Non-negative per m" holds
        at every (curve, m) whose R-M crossing is at D >= 4. It is false at
        (K-571, 3), which the version-4 scope excludes (S-2 (b)). The scope
        must be the R-M crossing, as version 4 writes it: scoped by the R-B
        crossing, it would fail at (K-571, 3).
      scope_at_every_statement: >-
        Scoped at every operative statement. Hypothesis
        version_4.predictions P-S (metric and minimum_effect: "at entries
        whose R-M crossing is at D >= 4"). Specification metrics.secondary
        ("non-negative wherever the R-M crossing lies at D >= 4").
        Hypothesis version_4 proof_obligations L-SPREAD. Audit
        L-SPREAD_version_4. Audit OC-1 ("P-S, scoped to D >= 4"). Every
        earlier-layer P-S is superseded (index). The L-SPREAD proof's step
        g(D + 1) - g(D) >= log2(n (D + 1)/(n + 1)) > 0 was checked
        algebraically. Two minor wording points remain (N-J2-2 and N-J2-3);
        neither is a statement of P-S's non-negativity.
      result: holds

    minor_findings:
      - id: N-J2-1
        location: spec interpretation_limits[2]; hyp version_4.interpretation_limits.entries[5]
        finding: >-
          "undetermined at D_cum(m)" is stated without the D_cum = 5 case. At
          the 9 (m, k reading) slots with D_cum = 5 (MI-1 m 2..6, ceiled m
          2..5) the lemma gives "no earlier" at X = D_cum, as m7_bin_lemma_form
          and the audit's A5 M7 entry state. The sentence under-claims and
          asserts no wrong direction. Remedy: append "when D_cum(m) > 5".
      - id: N-J2-2
        location: audit audits.A2_observation_collision.observable
        finding: >-
          "the interval [D*_B(c, 3.0, m), D*_M(c, 3.0, m)] at m* = 12 and over
          the M-SET" presumes the reading order at every m. At (K-571, m = 3)
          the endpoints are reversed. OC-1 in the same block carries the scope.
          This is a label, not a statement of P-S. Remedy: write the pair, or
          add the R-M scope.
      - id: N-J2-3
        location: >-
          worksheet discharge_table RV3-10 change ("crossings at D >= 4");
          audit L-ASM_version_4 ("at crossings at D >= 4"); hyp
          proof_search_map.note and spec proof_search_map.location ("D >= 4
          scope")
        finding: >-
          Summary wording does not say which crossing. Read as the R-B
          crossing, it would be false at (K-571, 3). The operative statements
          use the R-M crossing, so the summaries are under-specified, not
          wrong.

  # ---------------------------------------------------------------------------
  J3:
    verdict: holds
    verdict_note: >-
      HOLDS on every frozen J3 breaking artifact, each checked below: route
      stated; route applied by rule; transfer heuristic with falsifier and
      validation pointer; per-m span equal to mine; E1 and E2 refused at any
      other k or t; E1 consistent with the one-step tolerance; E1, E2 and H1
      (and H5) worded identically; every carried PTM and PTM-H meeting its
      signature. One MATERIAL objection outside the frozen list survives
      (O-J3-1). If the composer reads the J3 claim's clause "with its
      random-model justification" as requiring a justification that does
      not refute itself, O-J3-1 is a break of that clause. I report holds
      for two reasons. No frozen artifact fires. And every E1 reading stays
      routed to its own review-breakthrough round (RT-1, RT-3), which
      contains the risk until the justification is repaired.

    route:
      named: T
      basis: >-
        hyp version_4.heuristic_assumptions H5.route_chosen ("ROUTE T of
        RV3-7, not route S"). H5 is restated word for word as the
        specification's definitions.heuristics_as_stated.H5.
      h5_checks:
        numbered_heuristic_not_a_definition: >-
          Yes. H5 asserts an empirical property (H1's upper edge holds at n =
          571 at every m of the M-SET under both k readings, and at n = 283, m
          = 9). It can fail through falsification condition (a) a trend in n,
          (b) a trend in m at fixed n or failure at m = 2, (c) a k-reading
          shape dependence, or (d) disagreement with the matched-shape random
          null. Conditions (a) to (c) can fire on a toy ladder.
        falsifier: present, (a) to (d); (d) is vacuous where the named null itself leaves H1's edge (O-J3-1) and ambiguously worded (N-J3-4)
        validation_pointer: >-
          Present and scheduled as a pointer to GOAL-SEMBIN-fcb7a2 (toy ladder
          of system (5) at growing n and over m, m = 2 included, at k =
          ceil(n/m), t = m, with the matched-shape null at each rung). Not
          designed here, as C6 and the scope require.
        every_per_m_reading_routes_through_H5: >-
          Yes, by rule. E1 and E2 ("assuming H1 and H5", definitions.e1_e2,
          identical in both files). output_templates.threshold_sentence
          ("under the same numbered readings and assumptions ... with the
          per-m extrapolation span of H5 beside every m"; RESULTS.md is
          written from the templates only, V-8). d_star_sentence ("assuming H1
          with its transfer H5"). d_star_of_m.per_m_span ("Every entry of the
          table is read through H5"). decision_mapping ("assuming H1 and H5").
          IR-2 ("for the cost side, under H5"). RT-3. Procedure stage 6 puts
          the per-m span beside the table, and V-9 refuses a threshold at a
          single m.
      per_m_span:
        result: >-
          Equal to CB-3 output per_m_span at every m. N5 under MI-1 and the
          ceiled reading matches exactly, as does N5/60 to one decimal (9.5 at
          m = 2 under both readings; 276.0 MI-1 and 276.5 ceiled at m = 30),
          m/6 to two decimals, and 571/21 = 27.2 and 571/40 = 14.3. The
          measured extent the span divides by was confirmed at source
          (inputs/SEMAEV-2015-310/tables.yaml Tables 1 and 2, all 21 rows,
          N5 = n(t - 2) + kt): at most 60 variables (n = 12, t = 6 and
          n = 15, t = 5), n <= 21 with one row at 40, t <= 6, d_F4 = 4 in
          every row.
        reading: >-
          The span is honest and beside the table. It measures the variable
          count only. The objection is to what the span is read through, not
          to the span (O-J3-1).

    E1_E2_traces:
      comparison_column: C-CEIL-T (k = ceil(571/m), PF-2), the one-k column E1 and E2 name; the in-force MI-1 entry is beside it
      exhaustive_check: >-
        Over both curves, every m in 2..30 and every true degree D_true in
        2..64 (3654 cells), E1 as written (D_true <= D*cmp_B - 2; token
        "D* <= 2" admits no E1; "no crossing" read as 65) equals the
        tolerance-derived condition (model margin at D_true bounded above by
        the R-B margin at D_true + 1, non-positive), with 0 mismatches. E2's
        clause as written (D_true >= D*cmp_R + 1 under both readings, with the
        tokens) equals the lower-edge condition (margin with S >= S_R(D_true -
        1) positive), with 0 mismatches.
      trace_at_the_edge: >-
        D_true is a hypothetical input to the rule here, never a measured
        degree. At every non-token (curve, m), E1's condition is met at D_true
        = D*cmp_B - 2 and at no D_true from D*cmp_B - 1 up. At D_true = D* and
        D* + 1 it is not met, because the upper-bound margin is positive (at
        D_true = D* - 1: +6.19 to +22.33 bits; D*: +33.66 to +49.80 bits;
        D* + 1 higher, over m in {3, 8, 12, 20, 30}). E2's clause is met at
        D_true = D* + 1 and not at D*; the lower-edge margin at D_true = D* +
        1 is +6.19 to +22.33 bits, and at D* it is -5.14 to -21.28 bits. So
        E1 and E2 route the edge with the same
        one-step accounting, mirrored: E1 needs two degrees below the entry,
        E2 one above it, and D*cmp - 1 and D*cmp read as neither as a
        conclusion. R-M does not enter E1. The worksheet's RV3-9 discharge
        holds in the text.
      tokens: >-
        The only grid-edge token in any of the four (k reading, P form)
        tables is "D* <= 2" at m = 2 (both curves, both readings). There is
        no "no crossing" token. At m = 2 E1's condition cannot be met, by
        rule, and E2's clause is met at every hypothetical true degree. Its
        stated reason, "the model margin is
        positive at every per-solve cost", holds at the actual table: A(571,
        2) - rho is +6.91 bits (K-571) and +1.84 bits (B-571) under the
        ceiled reading, +7.10 and +2.02 under MI-1. As a general rule it
        does not follow from the token (N-J3-2).
    one_k_refusal_test:
      rule: >-
        definitions.e1_e2 E1 and E2 (identical in the hypothesis):
        "MEASURED ON A SYSTEM WHOSE FACTOR BASE HAS INTEGER DIMENSION k =
        ceil(571/m) AT CHAIN LENGTH t = m" and "A degree measured at any k
        other than ceil(571/m), or at any t other than m, is not an E1 [E2]
        reading and is refused". Also hyp H2 formal_statement (RV3-8) and
        spec IR-2 (VERSION 4).
      cases:
        - {m: 12, k_measured: 48, t_measured: 12, case: 'k = ceil(571/12)', result: admissible}
        - {m: 12, k_measured: 47, t_measured: 12, case: k = floor, result: refused}
        - {m: 12, k_measured: 571/12, t_measured: 12, case: 'the MI-1 model value (no built system has it)', result: refused}
        - {m: 12, k_measured: 49, t_measured: 12, case: k = ceil + 1, result: refused}
        - {m: 12, k_measured: 48, t_measured: 11, case: t = m - 1, result: refused}
        - {m: 12, k_measured: 48, t_measured: 13, case: t = m + 1, result: refused}
        - {m: 2, k_measured: 286, t_measured: 2, case: 'k = ceil(571/2)', result: 'admissible (and E1 then refused by the token rule)'}
        - {m: 2, k_measured: 285, t_measured: 2, case: k = floor, result: refused}
        - {m: 30, k_measured: 20, t_measured: 30, case: 'k = ceil(571/30)', result: admissible}
        - {m: 30, k_measured: 19, t_measured: 30, case: k = floor, result: refused}
      note: >-
        571 is prime, so ceil(571/m) differs from 571/m at every m in 2..30.
        No m makes the two k readings coincide, and the rule never has to
        break a tie. A comparison of a ceil-k degree against the in-force
        MI-1 entry instead of C-CEIL-T is not E1 or E2 as defined. A closure
        sentence built that way still reads as E2 for routing (RT-2). E1 built
        that way would be stricter, since every MI-1 entry is no later than
        its C-CEIL-T entry (30 later and 86 equal of 116, reproduced).
      result: refused at every other k and t by rule
    wording_table:
      method: >-
        Parsed strings, whitespace normalised for folded scalars, compared
        word by word (wording_check.py). Digests are of the normalised text.
      rows:
        - {item: E1, spec: definitions.e1_e2.E1, hyp: version_4.e1_e2.E1, identical: true, words: [263, 263], sha256_normalised_both: 8424981a61ebb897b55243f2c2cc82e93fe17b6a2e9af3b2f5188f75874e67b7}
        - {item: E2, spec: definitions.e1_e2.E2, hyp: version_4.e1_e2.E2, identical: true, words: [365, 365], sha256_normalised_both: c5275c433ee7e2d6edec1e62d7d36a32c801459a296d1ac2b4e3ec5550e2223b}
        - {item: H1, spec: definitions.heuristics_as_stated.H1, hyp: 'version_4.heuristic_assumptions[H1].formal_statement', identical: true, words: [249, 249], sha256_normalised_both: 2a5a3127d88855c25d7bb98d57cce81df2f59eb8d9bc6b2e672e68c8488aa872}
        - {item: H5, spec: definitions.heuristics_as_stated.H5, hyp: 'version_4.heuristic_assumptions[H5].formal_statement', identical: true, words: [117, 117], sha256_normalised_both: b723f54beb884a8a2745f9e97f5f5119710f5a96b504280e139922906b3a4d14}
        - {item: identical_wording_rule, spec: definitions.e1_e2.identical_wording_rule, hyp: version_4.e1_e2.identical_wording_rule, identical: false, words: [49, 45], sha256_normalised_spec: 073430991a6bc18816fb816f68e62762482122f45fee3860fb1d27110c1eeaf4, sha256_normalised_hyp: bba0ca2b0376379c7fd1cc0f6890347e8e128452f49971c1e6fce0ac730b3083}
      reading: >-
        E1, E2, H1 and H5 are word for word identical. The two
        identical_wording_rule fields differ only in naming the other file's
        paths, which is their purpose. The paraphrases of E1 and E2 in spec
        RT-1, RT-2, RT-3 and quantifier_order, hyp routing.rule and
        quantifier_order, and audit A3 contradict neither text. Two minor
        paraphrase asymmetries are recorded (N-J3-3).

    objections:
      - id: O-J3-1
        severity: material
        outside_frozen_breaking_list: true
        title: H5's random-model justification is refuted by the comparator it names, and misstates the source
        text_attacked: >-
          hyp version_4.heuristic_assumptions H5.random_model_justification:
          "The transfer rests on the source's own modelling of system (5) as a
          generic system of its shape ... The comparison distribution is the
          matched-shape random null: the solving degree and per-solve cost of
          a random Boolean system with the same number of variables (N5 of
          system (5) at that (n, m, k)), equations and equation degrees."
        source_check: >-
          Semaev 2015 Section 4.5.2 (inputs/SEMAEV-2015-310/paper_fulltext.md
          lines 1067-1072, provenance retrieved, read at source by this
          reviewer) prices a standard F4 solve of system (5) at [n(m -
          1)]^(4 omega). Only as a conjecture ("We think the same approach is
          applicable ... with the block size n") does it reduce this to
          n^(4 omega), the figure H1 and H5 carry. The source's generic-system
          pricing is therefore the m-dependent one. "The source's own
          modelling of system (5) as a generic system of its shape" is the
          block conjecture H1a, which H1 already includes. It is not a
          random-model justification.
        computation: >-
          Under the contract's own dense convention (H1 rigorous_support:
          2^W(N, D) Macaulay columns, cost (dimension)^omega), the named null
          costs omega W(N5, D) at degree D. H1's transferred upper edge is
          omega (D + 1) log2 571. At the R-B crossing of the in-force table
          (MI-1, PF-2) the null exceeds that edge at every m from 10 to 30,
          and stays inside it at m <= 9. The excess in rows bits is +0.90 at
          m = 10 and +3.21 at the scored m* = 12 (crossing 8; +9.64 bits of
          time at omega 3). It is +8.90 at m = 19 and +10.50 at m = 30, which
          is 1.15 degree steps beyond the edge. Semaev's own standard-F4
          figure exceeds the edge already at D = 4 from m = 6 (+0.13 rows
          bits at m = 6, +4.68 at m = 12, +10.27 at m = 30).
        consequence_for_E1: >-
          At E1's own boundary (D_true = D*cmp_B - 2, measured at k =
          ceil(571/m), t = m, C-CEIL-T, PF-2), the margin under H1's edge is
          -27.27 to -0.38 bits over both curves and m = 3..30 (m = 2 has no
          E1 boundary, by the token rule). Under the named null it is positive
          for at least one curve at m = 16-21 and 24-30 (13 of the 28 m with a
          boundary). For example, m = 30 gives +8.51 (K-571) and +3.43
          (B-571), and m = 29 gives +22.82 (K-571). Under Semaev's standard-F4
          pricing extended in D (omega D log2 N5) it is positive at m = 5 and
          7-30 (25 of the 28), including m* = 12 at +19.21 (K-571) and +14.13
          (B-571). So an E1 reading that
          route T admits at any of those m is true only if H1a holds at n =
          571 and that m. Under the contract's anchored M7-BIN reading, which
          assumes the block cost at D = 4, E1's boundary never flips. The
          load-bearing assumption is therefore H1a at D = 4 itself, not the
          M7 multiplier.
        falsifier_d: >-
          Falsifier (d) fires only "at a rung at which the random system of
          matched shape stays within" the edge. At the read points of every m
          >= 10 at n = 571 the null itself is outside the edge, so (d) cannot
          fire exactly where H5 is load-bearing. On toy rungs it can: at
          Semaev's 21 measured rows the null stays inside the edge at D = 4 in
          20 of 21, the exception being n = 12, t = 6 at +1.07 rows bits.
          Falsifier (b), a trend in m at fixed n, remains able to detect the
          failure.
        toy_scale_and_extrapolation: >-
          The inference spans 9.5x to 276x in Boolean variable count, 27.2x in
          n and one measured degree against the grid. What breaks first in
          the extrapolation is the block structure: the generic and block
          estimates separate by more than one degree step at D = 4 already at
          toy n. At n = 21 (k = ceil(n/m), t = m) Semaev's F4 figure separates
          from m = 6 (N5 = 108) and the dense count from m = 12 (N5 = 234).
          The discriminating test is therefore cheap and toy-sized.
        why_not_breaking_here: >-
          No frozen J3 breaking artifact fires. H5 is numbered, has a
          falsifier that can fire, and has a validation pointer. RV3-7's fix
          text requires no random-model justification. E1 readings stay routed
          to review-breakthrough (RT-1). The producer also disclaims support
          ("a modelling transfer, not a distributional result, and no source
          read by this program supports it beyond the toy range").
        remedy: >-
          Text only, zero runs. Restate H5.random_model_justification as
          "none beyond H1a". Disclose that under the matched-shape N5-variable
          null and under Semaev's standard-F4 pricing the transfer fails at m
          >= 10 at the read degrees (m >= 6 at D = 4), so every E1 reading at
          those m rests on H1a alone. Restate falsifier (d) so that it can fire
          where H1a and the generic model differ, or replace it by (b) run at
          fixed small n over m = 6..12. Name that range in the validation
          pointer.
      - id: N-J3-2
        severity: minor
        location: spec definitions.e1_e2.E2 TOKENS (identical in the hypothesis)
        finding: >-
          "at an m whose comparison entry under R is 'D* <= 2', the model
          margin is positive at every per-solve cost" does not follow from
          the token. It needs A(571, m) > rho(c). For any rho in [A(571, 2),
          A(571, 2) + S_B(2)) = [286.66, 341.61) bits the C-CEIL-T entry at
          m = 2 would still read "D* <= 2" while the margin at zero per-solve
          cost is non-positive. It holds at the actual table, with a slack of
          +1.84 bits at B-571. This is a latent false PASS in a routing label,
          not triggered. Remedy: state the condition A(571, m) > rho(c)
          instead of the token.
      - id: N-J3-3
        severity: minor
        location: spec definitions.e1_e2.E1; hyp version_4.routing.rule
        finding: >-
          E2 carries an explicit near-miss routing clause (a closure sentence
          from D_true = D*cmp, at one m, under one reading or at another k or
          t "still READS AS E2"). E1 has no counterpart for a "below rho"
          sentence from D_true = D*cmp_B - 1. RT-1 ("reads as E1") and RT-3
          still route it, so this is not a gap. The hypothesis routing.rule
          paraphrase of E2 omits "at k = ceil(571/m) and t = m", which it gives
          for E1. The canonical texts are identical, and the paraphrase sits
          under the "still reads as E2" rule.
      - id: N-J3-4
        severity: minor
        location: hyp version_4.heuristic_assumptions H5.falsification_condition (d) (and the identical specification text)
        finding: >-
          "exceeding the upper edge by more than one degree step". In (a) and
          in H1, "the edge" is S_B plus one degree step. Read the same way,
          (d) fires only above S_B plus two steps, one step looser than H1-V.
          Remedy: "exceeding S_B by more than one degree step".

  # ---------------------------------------------------------------------------
  proves_too_much:
    failure_signature: as frozen in the plan (proves_too_much.failure_signature)
    declarations: >-
      PTM-B's Certicom degree, PTM-E's rule and PTM-H's rule were written and
      hashed before any PTM evaluation. sha256
      9cd1ffd4c5f921124afb36342b5a7347d81088d2c0b02ac4ad3d82a4fca70f47 at
      2026-10-02T19:08:25Z; the first evaluations ran at 19:12:06Z and
      19:17:44Z. The text is in computations.json. Informed declaration: the
      producer's CB-3 tokens and the EXP-SEMBIN-992e73 table were read
