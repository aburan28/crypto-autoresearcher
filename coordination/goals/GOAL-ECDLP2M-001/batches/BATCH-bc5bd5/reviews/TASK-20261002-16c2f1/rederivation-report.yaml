sensitivity_for_the_composer:
  S-1_Q3_near_zero_margins:
    finding: >-
      Two omega-3.0 cells have a margin within 0.01 bit of zero, so their integer threshold
      is decided by less than the stated log2 tolerance.
    cells:
      - {c: "K-571", R: "R-M", kr: "KR-B", pf: "PF-1", m: 14, which: "margin_at_Dstar", margin: 0.0024508324916128377}
      - {c: "K-571", R: "R-M", kr: "KR-B", pf: "PF-2", m: 14, which: "margin_at_Dstar", margin: 0.002450832557807989}
    consequence: >-
      At (K-571, R-M, KR-B, m = 14) under either P form, D* = 9 with a margin of +0.00245
      bit at D = 9; an implementation lower by more than that in A or higher in rho would
      report 10. None at omega 2.376.
  S-2_QX_per_step_near_ties:
    finding: >-
      Every D_ps from m = 6 on is decided by a per-step growth within 0.0024 bit of log2
      571, because N5/D passes 571 almost exactly at D near m - 1; under KR-B at m = 8 the
      margin is +1.08e-6 bit at D = 7.
    diagnostic: >-
      With W replaced by log2 of the top binomial alone, only (m = 8, KR-B) changes, D_ps 8
      to 7; every D_cum is unchanged.
    consequence: >-
      A disagreement on a single D_ps is far more likely to come from an approximation of W
      than from a different reading.
  S-3_QX_cumulative_near_zero_DELTA7:
    finding: >-
      DELTA7 at D_cum - 1 or D_cum lies within the 0.05-bit DELTA7 tolerance of zero at m =
      6 (both readings), 7 (both), 13 (both), 15 (KR-B), 21 (KR-B), 23 (both); at m = 30
      KR-B, DELTA7(64) = +0.0504, which makes the token 'none in 5..64' where KR-A gives 64.
    cells:
      - {m: 6, kr: "KR-A", D_cum: 5, DELTA7_at_D_cum_minus_1: "0.0", DELTA7_at_D_cum: "-0.00151534386862", DELTA7_at_64: "-153.086411625"}
      - {m: 6, kr: "KR-B", D_cum: 6, DELTA7_at_D_cum_minus_1: "0.00101170565646", DELTA7_at_D_cum: "-0.261515695827", DELTA7_at_64: "-152.933201929"}
      - {m: 7, kr: "KR-A", D_cum: 8, DELTA7_at_D_cum_minus_1: "0.0355893862154", DELTA7_at_D_cum: "-0.381975210017", DELTA7_at_64: "-137.138114447"}
      - {m: 7, kr: "KR-B", D_cum: 8, DELTA7_at_D_cum_minus_1: "0.039382064687", DELTA7_at_D_cum: "-0.376917567341", DELTA7_at_64: "-137.061622905"}
      - {m: 13, kr: "KR-A", D_cum: 22, DELTA7_at_D_cum_minus_1: "0.0202253237623", DELTA7_at_D_cum: "-0.85845966884", DELTA7_at_64: "-76.7241358613"}
