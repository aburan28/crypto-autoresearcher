Q1-571:
  K-571:
    field_degree: 571
    r_decimal: "1932268761508629172347675945465993672149463664853217499328617625725759571144780212268133978522706711834706712800825351461273674974066617311929682421617092503555733685276673"
    r_bits: 570
    h: 4
    k_c: 571
    k_c_how: >-
      Defined over F2: Koblitz form y^2 + xy = x^3 + a x^2 + 1 (FIPS lines 6630-6632) with a
      = 0 (line 7021). The F2 trace t is the unique t in [-2, 2] whose Lucas-sequence order
      2^571 + 1 - V_571(t) equals h r = 4 r exactly (t = -1; the hand count #E(F2) = 4
      agrees). Frobenius acts on the order-r subgroup as the root lambda of X^2 + X + 2
      modulo r with lambda^571 = 1 (verified; the other root fails) and lambda != 1, so its
      order is the prime 571.
