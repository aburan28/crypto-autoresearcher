QA:
  expressions:
    PF-1: >-
      A(n, m) = k - log2(2^(m k - n)/m!) = n - (m - 1) k + log2(m!); KR-A gives n/m +
      log2(m!); KR-B gives n - (m - 1) ceil(n/m) + log2(m!).
    PF-2: >-
      A(n, m) = k - log2(1 - exp(-2^(m k - n)/m!)); KR-A gives n/m - log2(1 - exp(-1/m!));
      KR-B gives ceil(n/m) - log2(1 - exp(-2^(m ceil(n/m) - n)/m!)).
    derivation: >-
      From eq. (15), paper lines 1073-1086, with the relation count 2^k of lines 1063-1064
      and the per-solve cost n^(4 omega) omitted; t = m; n = 571 here. Consistency with the
      paper: under KR-A and PF-1, A + 12 log2 n is log2(m! 2^(n/m) n^12), the omega = 3
      bound the paper states at lines 1088-1091.
  units: >-
    A in bits (log2 of the paper's operation count); store ST-CNT in log2 count of
    relations, ST-LIT in log2 of k
  columns: >-
    k_exact is n/m as a fraction (KR-A) or ceil(n/m) (KR-B); e_mk_minus_n = m k - n;
    A_PF2_minus_PF1_exact is the exact difference to 20 significant digits; A_PF3 and the
    two deviations are the third readings of Q0-04
