independent_recomputation:
  recomputed_myself: >-
    Everything reported. r and h parsed from the FIPS text; primality, bit length and Hasse
    placement of r; the K-571 trace and Frobenius eigenvalue order; rho; A under four pairs
    and three further readings; every Q3 threshold, real threshold and margin; every QX
    crossover, maximum and argument; every computed NF item.
  reverified_with_a_disjoint_checker:
    - >-
      Implementation II (decimal/libmpdec at 80 digits, its own FIPS parser, its own
      binomial recurrence, Machin pi, its own 1 - exp(-x) series; no mpmath or sympy) agrees
      with implementation I on 3772 compared keys -- every integer, token and two-decimal
      D*real exactly, every log2 figure to 5e-38.
    - >-
      Primality of both r by sympy.isprime (BPSW) and by an own Miller-Rabin with 80 bases.
    - >-
      The K-571 group order: 2^571 + 1 - V_571(-1) equals 4 r exactly (Lucas sequence),
      which also confirms the parsed r and h = 4.
    - >-
      Square root of -7 modulo r by own Tonelli-Shanks and by sympy.sqrt_mod (agree up to
      sign).
    - >-
      Known-answer control: PF-2 with integer k and four-decimal truncation reproduces the
      paper's Table 1 theoretical P column (lines 684-695) at 9 of 9 rows.
  disjointness_note: >-
    Both implementations were written by me in this session. They are disjoint in numeric
    library and code path, which guards against library, precision and coding faults. They
    are not disjoint in author, so they cannot guard against my misreading of a definition;
    that is what the composer's cross-implementation comparison is for.
  taken_on_the_word_of_a_permitted_source:
    - >-
      h = 2 for B-571, from the FIPS preamble rule; with BL-6 forbidding point counting,
      only consistency with the Hasse interval was checked.
    - >-
      The EP-2 degree list, the slot meanings, the 1e-9 tolerance, and the 60-variable and
      measured-chain-length parameters of NF-18, as the amendment states them; the 60 agrees
      with my N5 at the paper's Table 1 rows.
    - >-
      The definitions themselves (blind-inputs and amendment); nothing of the producer's was
      read.
  falsification_checks: >-
    A misparsed r would fail bit length, primality, Hasse placement and, for K-571, the
    exact Lucas order; a wrong P would fail the Table 1 control; a precision fault would
    split I and II; an R-M normalisation fault would fail S_M(4) = S_B(4); a threshold fault
    would fail the asserted D*_B = floor(D*real_B) + 1; DELTA7(4) = 0 and N5 integrality are
    asserted. All pass. Not checkable by me: whether my reading of an ambiguous definition
    matches the producer's.
  baseline_comparison: >-
    Not applicable. J11 asks for model quantities, not a speedup; no measured ratio is
    claimed or reported here.
charging_audit:
  note: >-
    Terms the pinned definitions leave uncharged, recorded as findings without a verdict
    (BL-5).
  items:
    - >-
      Stage 2, the sparse linear algebra of eq. (16) (paper lines 1091-1101, exponent k
      omega' with omega' = 2), is excluded by PIN-STAGE; at the in-force m* = 12 under KR-A
      it is 95.167 bits against C_I = 186.307.
    - >-
      Memory is reported beside time (relation store, Macaulay rows MR_B and MR_M, dense
      entries) and never converted into time.
    - >-
      Generating R = uP + vQ and building the Weil-descended system (5) per trial are not
      charged separately; the paper calls them polynomial (lines 389-391).
    - >-
      Units: C_R counts the paper's operations (ground-field operations in the Groebner
      step) while rho counts group operations; the definitions compare them without
      conversion.
    - >-
      Heuristics: the random-mapping model of eq. (11) (lines 400-401) and Assumption 1,
      d_F4 <= 4 (lines 602-605), are conditions of every figure; the source measured them at
      n <= 40 with at most 60 Boolean variables.
    - >-
      The inverse success probability is charged in A as -log2 P(n, m, m, k) under the
      stated heuristic, never as if success were certain.
scope: >-
  Arithmetic on Semaev 2015's published stage-1 cost model at t = m, at n = 571 (Q1-571, QA,
  Q3, QX), at the fifteen EP-2 degrees (NF-03, NF-08) and at 571, 283 and 359 (NF-06, NF-07,
  NF-19); omega 3.0, with 2.376 where labelled; m in 2..30; D in 2..64. Every figure is
  conditional on the model's random-mapping heuristic and on Assumption 1 (d_F4 <= 4), which
  the source measured only at n <= 40. These are not measurements, not an attack and not a
  security statement about K-571 or B-571, and toy-scale measurements are not presented as
  crypto-scale ones.
routing_condition_note: >-
  This card routes at review-breakthrough, which is non-degradable. Blind by construction, I
  cannot see the claim, hypothesis or contract, so I cannot check whether
  claimed_breakthrough, a closing transition or contradicts_prior_evidence holds. It is
  unassessed from my side, neither confirmed nor disputed.
dispatch_preconditions_note: >-
  These bind the dispatcher. From inside this session: the amendment exists and was read
  (sha256 above); archived_by is bound on the card; the scratch subdirectory existed. The
  commit status of my inputs cannot be checked here (the working directory is not a git
  repository and BL-2 forbids history commands), so the composer should bind the sha256
  values in computations.json to the committed snapshot.
