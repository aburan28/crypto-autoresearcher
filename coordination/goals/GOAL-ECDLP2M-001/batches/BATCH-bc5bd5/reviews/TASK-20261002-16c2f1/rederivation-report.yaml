environment:
  language: "Python, CPython 3.11.15 (/usr/local/bin/python3, GCC 13.3.0)"
  libraries:
    mpmath: "1.3.0 (implementation I, 90 digits; 600 for PF-0, PF-3, PF-C)"
    sympy: "1.14.0 (isprime BPSW, sqrt_mod, primerange; cross-checks only)"
    decimal: "1.70 with libmpdec 2.5.1 (implementation II, 80 digits)"
    PyYAML: "6.0.1 (parse check of this report only)"
    stdlib: >-
      fractions, math (comb, factorial), hashlib, json, random (seed 20261002, Miller-Rabin
      bases only), re
  platform: "Linux-6.18.44-fc-v51-x86_64-with-glibc2.39"
  cpus: 4
  algorithms: >-
    exact integer binomial sums (math.comb in I, multiplicative recurrence in II); exact
    rational k; log2 via mpmath.log and decimal ln; 1 - exp(-x) via mpmath.expm1 and an own
    Taylor series in II; pi via mpmath.pi and Machin's formula in II; Lucas sequence V_n for
    the K-571 order; own Tonelli-Shanks and sympy.sqrt_mod; own Miller-Rabin (80 bases) and
    sympy.isprime
  wall_clock_seconds: "about 2.5 (I), 7.2 (II), under 1 each for comparison and diagnostics"
  budget: "card budget 10800 s and 8 GB; well within both"
