    decision_value_assessment: >-
      Not a breaking artifact. Each value version 4 states can be delivered
      by a valid run: (a) claim (A) as a validated record, (b) custody and
      citability, (c) verification. For P-C and the threshold table the
      statement is exact; execution adds custody and citability only. The
      statement overstates (a). P-A's class rests entirely on committed
      bytes (the pinned inputs and the W-d and W-e records), so the
      information execution adds over the cheapest alternative, a zero-run
      read, is zero for both predictions. The cost side of execution is not
