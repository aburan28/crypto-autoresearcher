      instrument, and reads r, h, n and l from the pinned primary inputs
      (params.py). Its formula was checked against the instrument source by
      reading only: joint_balance.py stage_costs gives stage 1 = k + solve -
      log2 P, with eq. (11) P = 1 - exp(-2^(tk-n)/t!), unceiled k = n/m by
      default and solve = 4 omega log2 n for block_n4w.
    reachability_table:
      - branch: K1_near
        version_4: REACHABLE, the only P-C branch a valid run can reach (design figure, not a finding)
        this_review: >-
          Reachable, and the only reachable P-C branch, under every (k
          reading, P form) pair. Scored cells at m* = 12, omega 3, MI-1 and
          PF-2 give D*_B 8 and D*_M 9 for K-571, D*_B 8 and D*_M 10 for
          B-571. The ceiled reading with either P form gives (8, 10, 8, 10).
          So D*_lo = 8 and D*_hi = 10 at every pair. At the K-571 R-B
          crossing the margins are -11.024 at D = 7 and +16.448 at D = 8,
          with Macaulay rows 2^64.10 and 2^73.26 (R-B) and relation store
          2^47.58 on each.
        agrees: true
      - branch: K2_teens
        version_4: UNREACHABLE by a valid run, kept (V-4)
        this_review: >-
          Unreachable. D*_lo = 8 < 12 at every pair. Structurally, a D*_B of
          12 at m* = 12, omega 3 needs rho of at least 378.6112 bits, against
          rho_ub(571) = 284.8257, the largest rho any curve at n = 571 can
          have (a rho figure; no Macaulay matrix). No curve at 571 reaches
          K2 in this model; the gap is 93.7855 bits. The index-calculus side
          at D = 11 would have Macaulay rows 2^100.73 (R-B) and relation
          store 2^47.58.
        agrees: true
      - branch: K2x_straddle
        version_4: UNREACHABLE, kept (V-4)
        this_review: Unreachable (D*_lo = 8 at every pair).
        agrees: true
      - branch: K3_far
        version_4: UNREACHABLE, kept for a successor
        this_review: Unreachable (D*_lo = 8 at every pair).
        agrees: true
      - branch: K4_beyond
        version_4: UNREACHABLE, kept with its revisit condition for a successor; no in-force cell lacks a crossing
        this_review: >-
          Unreachable. None of the four 116-entry tables carries a "no
          crossing at D <= 64" token; the largest entry is 10, and no entry
          is 12 or more.
        agrees: true
      - branch: A_confirmed
        version_4: not fixed by the closed forms (needs the exact-n coherent imports at 359, 409 and 571)
        this_review: >-
          Not decidable from closed forms. The closed forms with the pinned
          inputs fix the twelve degrees 79, 89, 97, 109, 131, 155, 163, 185,
          191, 233, 239 and 283 as satisfying BR-1 clause (b) at omega 3: the
          time-only margin is positive for every curve at each. The degrees
          359, 409 and 571 need imports.
        agrees: true
      - branch: A_second
        version_4: not fixed by the closed forms; reachable only through 359 or 409
        this_review: >-
          Not fixed by the closed forms. The qualifier "only through 359 or
          409" does not follow from the closed forms alone. It rests on
          lemma L-MONO and on the imported records being consistent with it
          (OBJ-RT-J4-3).
        agrees: true
      - branch: A_rho571
        version_4: not fixed; reachable only through 571's exact-n coherent import (clause (a))
        this_review: >-
          Agrees. The time-only margins at 571 are negative (-93.4401 for
          K-571, -98.5188 for B-571 at D = 4, omega 3, with Macaulay rows
          2^36.63 (R-B) or 2^32.04 (R-M) and relation store 2^47.58), so
          clause (b) cannot classify 571.
        agrees: true
      - branch: A_unresolved
        version_4: not fixed; reachable if an exact-n coherent row is missing or conflicting at 359, 409 or 571
        this_review: >-
          Agrees. It is also reachable if SN-1 fails or W-e cannot be
          located, since then every import is refused. Version 4's field
          omits that route (minor, OBJ-RT-J4-3).
        agrees: true
      - branch: R-M withdrawn by an F3 failure (not a mapping branch; noted)
        version_4: falsification_criterion says an F3 failure withdraws R-M and falsifies nothing
        this_review: >-
          Unreachable for a correct implementation. L-INT at D = 4 is an
          exact algebraic identity of the stated multipliers (C_Ill + M1 + M2
          + omega M3(4) + M4 = C_I). Were it reached, the outcome-class basis
          "the FOUR scored cells" would be ill-defined, since two cells would
          remain (latent wording gap; no effect on reachability, because R-B
          alone gives 8 and 8).
        agrees: true
