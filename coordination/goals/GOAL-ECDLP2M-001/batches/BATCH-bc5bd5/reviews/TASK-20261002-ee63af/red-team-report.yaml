          degrees, from 3.4406 bits (359) to 11.1686 bits (571). At 571 C_I
          moves 186.3070 to 175.1383 (m* 12 to 15); at 283 147.6495 to
          141.5270 (9 to 10); at 359 159.5451 to 156.1046 (10 to 11). The
          Macaulay rows are unchanged (2^36.63, 2^32.58 and 2^33.95 under
          R-B), and the relation stores move 2^47.58 to 2^39, 2^31.44 to 2^29
          and 2^35.90 to 2^33. Per cell the ceiled cost is below at 433 of
          435 cells and equal at (155, 5) and (185, 5), never above. F1
          passes under MI-1 with either P form (283 slack 2.1634e-5 bit under
          PF-2, 2.3622e-5 bit under PF-1). It fails under the ceiled reading
          (175.1383 at m 15), the cofactor-absorbed model (76.4188) and omega
