  # ---------------------------------------------------------------------------
  objections:
    - id: OBJ-RT-J5-1
      joint: J5
      severity: breaking
      location: spec input_rules IR-1.rule, second sentence (unchanged since version 2, hunk-free in version 4)
      statement: >-
        IR-1 reads "NO RECORDED DEGREE ENTERS THE D AXIS OR ANY COST
        FORMULA. D is an integer grid variable 2..64 and nothing else; there
        is no command-line or configuration input for D, and no value read
        from any file, argument or record is ever assigned to D or used as an
        exponent, multiplier or term of any cost formula." Read as written,
        the second sentence forbids any file-read value as a term or
        multiplier of any cost formula, and the contract requires such
        values in three places. (1) definitions.rho with IR-3 and stages 0
        and 1 require rho(c) = 0.5 log2(pi r/(4k)), with r read at Stage 0
        from the primary input. The contract itself treats rho as priced
        work: "POSITIVE MEANS RHO IS CHEAPER"; "TOTAL-WORK figure ... on
        both sides"; "per-iteration cost ... not charged". (2) C-RHOCONV
        requires 0.5 log2(pi l/(4 x 131)) with l read from Bailey's text.
        (3) BR-1 requires the coherent margins read from the W-d records as
        terms of "margin + delta(c)". The provenance shows the gap. D-8
        FD-IR1 of DEC-20260924-124667 told version 2 to "narrow IR-1 to 'no
        recorded degree enters the D axis or any cost formula'"; version 2
        wrote that heading and then added the broader second sentence,
        carried unchanged since. The version-3 text's own SN-1 note ("enters
        no cost formula") applies the prohibition to a non-degree file-read
        figure.
      why_breaking: >-
        This is the O-RT-01 class: an input rule that, applied as written,
        forbids what other rules require. DEC-20261002-353743 S-3 ruled that
        class breaking ("a valid run breaches IR-1 or degrades SN-1"), and
        no V-rule enforced that clause either. Each route to consistency
        needs a reconstruction this card may not supply (R4B-7). Route one
        reads "cost formula" as the index-calculus cost formula only, a
        narrowing by purpose. Route two counts a transcribed constant equal
        to the value read at Stage 0 as not a "value read from any file", a
        provenance distinction the contract does not state, though CB-3 in
        effect follows it. Route three counts BR-1's shifted margin as not a
        cost formula.
      reading_dependence_disclosed: >-
        If the composer adopts route one, or routes two and three together,
        this item is a non-breaking wording defect and J5 holds on every
        other component.
      cheapest_falsification: >-
        One sentence-level check, with no compute. Apply IR-1 sentence 2 as
        written to procedure stage 1 ("Compute rho(c) for every curve")
        with definitions.rho and IR-3, and ask whether r is a value read
        from a file used as a multiplier of a cost formula.
      remedy: >-
        One clause, as D-8 FD-IR1 intended: "no recorded degree read from
        any file, argument or record is ever assigned to D or used as an
        exponent, multiplier or term of any cost formula". Before approval
        it is a version-5 text edit; after approval, an additive
        protocol_amendment.
    - id: OBJ-RT-J4-1
      joint: J4
      severity: material
      location: spec definitions.what_the_run_adds.decision_value_of_execution (item (a) and CONSEQUENCE); audit reachability.decision_value; FD-20
      statement: >-
        Version 4 calls claim (A) "the run's information value and the
        reason P-A can move" because it "turns on primary-input reads and
        exact-n coherent imports at 359, 409 and 571". The primary-input
        reads are fixed before any run by the four committed pins (this card
        read and checked them). The coherent imports are committed records
        (W-d, W-e), so P-A's class, or its UNRESOLVED status, is
        determinable by a zero-run read. H-SEMBIN-97ea23 (supported) already
        records coherent crossovers above 409 under all four storage
        readings. Execution therefore delivers no information over the
        cheapest alternative for either prediction; its value is custody
        and citability throughout. The statement also leaves the cost side
        uncharged: an execution batch, and RT-0's mandatory
        review-breakthrough evidence round at max for every valid run, plus
        RT-5 or RT-4 rounds if their triggers fire.
      not_breaking_because: Each stated value can be delivered by a valid run, relative to doing nothing; the ranking is deferred to the Coordinator, as it should be.
      cheapest_falsification: >-
        A zero-run review card reads the pinned-slice rows at 359, 409 and
        571 in experiments/EXP-SEMBIN-2c40bb/runs/RUN-SEMBIN-3ae91c/ and
        COST-SEMBIN-8d123b. It evaluates SN-1 and BR-1 at omega 3, kappa 1,
        together with the closed-form clause-(b) result for the other
        twelve degrees. If that fixes P-A's class, the "information value"
        sentence is false over the cheapest alternative.
      remedy: State that P-A is determinable by a zero-run read of committed records, and state the cost side (execution batch, RT-0 round) beside the custody value.
    - id: OBJ-RT-J5-2
      joint: J5
      severity: material
      location: spec invalidation_rules V-6 (write-order clause); stage_order_enforcement ("the order is checkable from the archived artifacts"); required_artifacts raw-result.json
      statement: >-
        The specified archive carries only per-stage start and end
        timestamps and the gates.json digest; no artifact-write events are
        recorded. The clause "a D* table written before gates.json by the
        stage_timestamps" can therefore be evaluated only by assuming each
        file was written in the stage the protocol assigns it, which is the
        assumption the clause exists to test. The runtime assertion guards
        only the D* function of the primary path. C-IND, which "imports
        neither joint_balance.py nor the primary surface module" and
        recomputes every D*, is outside it. Manifest I-2b (C-IND's D* run in
        Stage 3) reads VALID on the archived view. Detection then rests on
        code review or stdout.log content that version 4 does not require.
      not_breaking_because: >-
        RV3-12's letter is met (V-6 covers an absent gates.json; the digest
        and stage timestamps are carried), and the I-2 class reads INVALID
        whenever the order is visible. The archived code shows where C-IND
        is called.
      remedy: >-
        Print the gates.json sha256 with a UTC write time at the end of
        Stage 4, and a line at the first write of any D* table, to stdout.log
        and raw-result.json. Require C-IND to run after gates.json and to
        assert it on entry. Add an archive-level stage-order test to
        test_rules.py.
    - id: OBJ-RT-J4-2
      joint: J4
      severity: minor
      location: spec success_criterion.decision_mapping K4 REVISIT CONDITION (i); audit reachability.k4_revisit; plan PTM-G (c) wording
      statement: >-
        "the FIRST validated report committed after that decision that is
        not a GOAL-SEMBIN-fcb7a2 true-degree record ..., which reports ...
        a solving degree ... that exceeds Assumption 1's bound 4" admits a
        non-restrictive parse. On it, the referent is the first validated
        report of any goal, and an earlier non-qualifying report blocks (i)
        permanently (PTM-G c2 and c5). The condition is inert for this
        contract because K4 is unreachable. A successor that inherits the
        text inherits the ambiguity.
      remedy: >-
        Reword to "the first validated evidence record committed after that
        decision that reports ...; a later such record does not fire (i)
        again".
    - id: OBJ-RT-J4-3
      joint: J4
      severity: minor
      location: spec what_the_run_adds.reachability_per_branch (P-A sentence); outcome_classes A_second_reachable and A_unresolved_reachable; CB-3 a_branch_reachability
      statement: >-
        Three gaps. (1) "A_second (only through 359 or 409)" rests on lemma
        L-MONO and on the imported records agreeing with it, not on the
        closed forms. CB-3's a_branch_reachability hard-codes the qualifier
        rather than computing it. If a record contradicted L-MONO at a
        clause-(b) degree, BR-1's two "iff" class definitions would both
        hold there. (2) A_unresolved is also reached when SN-1 fails or W-e
        cannot be located; the field names only missing or conflicting rows
        at 359, 409 or 571. (3) RT-4's time-only sign routing is fixed (it
        does not fire) by the closed forms and pinned r, and
        what_the_run_adds does not say so.
      remedy: Name L-MONO as the basis of the qualifier, add the SN-1 route, and state that the RT-4 sign routing is fixed.
    - id: OBJ-RT-J4-4
      joint: J4
      severity: minor
      location: audit findings FD-20; spec outcome_classes K1_near_reachable
      statement: >-
        FD-20 sits in a list headed "findings" while its text disclaims
