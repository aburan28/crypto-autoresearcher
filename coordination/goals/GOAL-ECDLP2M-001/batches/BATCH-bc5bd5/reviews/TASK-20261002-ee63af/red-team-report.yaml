  PTM_G:
    object: >-
      K4 REVISIT CONDITION sub-condition (i) as version 4 restricts it
      (success_criterion.decision_mapping), transcribed as a predicate over
      synthetic event records under two readings. Under reading Q
      (restrictive), the first validated evidence record after the decision
      that reports the qualifying measurement fires (i). Under reading A
      (literal non-restrictive ", which reports"), the referent is fixed as
      the first validated report of any goal after the decision, and (i)
      holds only if that report qualifies.
    a_on_the_closed_form_tables: >-
      Every entry of all four tables was tested: (k reading, P form) in
      {MI-1, ceiled} x {PF-2, PF-1}, both 571 curves, both readings and
      every m in 2..30, 464 entries in all. Among them are the 16 grid-edge
      "D* <= 2" entries, all at m = 2, where index calculus loses at every
      degree in the model. Under both readings (i) holds at every entry
      exactly when the event qualifies and never otherwise. It is therefore
      neither fixed true nor fixed false by any table entry, and no
      grid-edge entry fires it. Separately, the K4 branch that (i) reopens
      is unreachable at all four pairs, so the revisit is inert for this
      contract.
    b_off_restriction_k_and_t: >-
      On restriction, (i) fires under both readings: k = ceil(n/m), t = m,
      including the edge case where m divides n. Off restriction it fires
      under neither reading: k = floor(n/m) (n 20, m 3, k 6), k = n/m
      non-integer (20/3, not a buildable factor base), k = ceil(n/m) + 1,
      t = m - 1, and t = m + 1.
    c_report_order: >-
      Sequence [qualifying] fires at position 0 under both readings.
      Sequence [qualifying, qualifying] fires once, at 0, under both. With a
      GOAL-SEMBIN-fcb7a2 true-degree record first and a qualifying record
      second, (i) fires at position 1 under both, the first being (iii).
      Sequence [non-qualifying EV of another goal, qualifying] fires at
      position 1 under Q and never under A. Sequence [qualifying at k =
      floor, qualifying] also fires at 1 under Q and never under A. Under
      reading A, any earlier non-qualifying validated report blocks (i)
      permanently.
    d_external_event: >-
      The named event fires: a validated EV with the shape of system (5),
      k = ceil(n/m), t = m, d_F4 degree 5 and IR-2 discharged. None of the
      near misses fires under either reading: degree exactly 4; a maximal
      step degree whose d_F4 reading is 4; a first fall degree with no H6
      route; a fake d'_F without the U-4 bookkeeping; a KN-FIND with no
      validated EV; a pre-decision primary source re-curated after the
      decision; an unvalidated EV; an EV committed before the decision; a
      GOAL-SEMBIN-fcb7a2 true-degree record (that is (iii)); and a system
      not of the shape of system (5).
    failure_signature_check:
      neither_fixed_true_nor_false_by_the_table: met under Q and A
      no_fire_from_a_grid_edge_entry: met under Q and A
      no_fire_at_another_k_t_or_report: >-
        Met under Q and A for k and t. For report order it is met under A,
        and under Q when "the first validated one" means the first
        qualifying report. Under Q, (i) fires at a qualifying report that
        need not be the first validated report of any kind; whether that
        counts as firing at "another k, t or report" turns on the same
        ambiguity, which is shared by the plan's PTM-G text and by version
        4.
      names_an_event_that_makes_Part_3_more_worth_making: >-
        Met. Evidence that the d_F4 degree exceeds 4 on the shape of H2's
        D_solve is evidence that the degree grows, which could carry the
        true degree toward a high threshold. That is the direction in which
        K4's reason for deprioritising (the threshold lies above every
        plausible degree) weakens.
    result: >-
      PTM-G MEETS ITS FAILURE SIGNATURE and does not reach its known-false
      conclusion. The reading dependence of "first" is recorded as
      OBJ-RT-J4-2: under reading A, (i) is practically unfireable, though
      not fixed by the closed-form table. The whole condition is inert for
      this contract because K4 is unreachable.

