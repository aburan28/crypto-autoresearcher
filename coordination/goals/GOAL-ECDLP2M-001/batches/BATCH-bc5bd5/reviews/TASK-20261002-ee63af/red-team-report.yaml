    literal_sweep:
      method: >-
        Each stopping, invalidation, input and gate rule of version 4 was
        read as written (S-3, R4B-7), and what it permits and forbids is
        listed. The reads and writes a valid run must make are checked
        against those rules. The rules are transcribed independently of
        CB-4 into the predicates of j5_trace.py.
      rules:
        - rule: SR-1
          permits_forbids: Forbids any D* after a failed gate; requires gates.json and the completed stages written on the stop.
        - rule: SR-2
          permits_forbids: Forbids all computation unless joint_balance.py hashes to sha256_expected (it does, at HEAD).
        - rule: SR-3
          permits_forbids: Forbids writing any table when C-IND disagrees; both values reported.
        - rule: SR-4
          permits_forbids: >-
            An infrastructure failure stops the run as failed_infrastructure,
            never a result. A raised stage-order assertion or IR-1 whitelist
            check is not infrastructure: it stops the run, which is recorded
            invalid under V-6 or V-2 (see OBJ-RT-J5-5).
        - rule: SR-5
          permits_forbids: Forbids re-running a stage with a changed tolerance, grid, reading or omega; a change needs a protocol_amendment first.
        - rule: SR-6
          permits_forbids: Forbids anything after the hash checks unless code/certicom_coverage.py hashes to CB1_REFERENCE_SHA256.
        - rule: V-1 to V-11
          permits_forbids: >-
            V-1: instrument hash, edit, copy or re-implementation. V-2: a D
            value from input; a D-axis column labelled only "degree"; a file
            opened under runs/ outside the whitelist. V-3: r, h or
            coefficients not from the primary inputs. V-4: post-evaluation
            changes. V-5: an unchecked, mis-sliced or multi-match import, or
            a time-only column making a degree MODEL-CLASS-IC. V-6: a D*
            table with gates.json absent or a gate not passed; a D* computed
            before Stage 6; a D* table written before gates.json by the
            stage_timestamps; a gates.json digest missing or mismatched; a
            raised stage-order assertion. V-7: an R-I figure as a D* or
            result. V-8: a RESULTS.md sentence about the 571 cell outside
            the templates. V-9: unscored blocks (omega and kappa) entering a
            prediction, class or table, or a single-m threshold. V-10: G1
            passed without a C-COVER PASS. V-11: a diagnostic column (C-CEIL-A,
            C-CEIL-T, C-CEIL-D, C-PF1-T) entering G4, RT-4, a class, a scored
            cell or an outcome class, or computing or replacing an in-force
            entry; standing beside an entry is not entering.
        - rule: IR-1
          permits_forbids: >-
            Sentence 1 forbids any recorded degree entering the D axis or any
            cost formula. Sentence 2 forbids any value read from any file,
            argument or record being assigned to D or used as an exponent,
            multiplier or term of any cost formula (OBJ-RT-J5-1). Under runs/
            it permits only W-a (the run's own directory, gates.json
            included), W-b and W-c (the declared raw-result.json files,
            optional reads), W-d (the coherent-baseline RECORD FILES that
            Stage 0 locates inside RUN-SEMBIN-3ae91c) and W-e
            (COST-SEMBIN-8d123b.yaml). It permits exactly two row selectors
            (RS-1, RS-2) to read a degree-labelled field, to select a row and
            never as a value, and forbids reading any field labelled as a
            first fall degree, d_F, d'_F or degree of regularity.
        - rule: IR-2
          permits_forbids: >-
            Binds only later overlays: d_F4 solving degree, U-4 recovery for
            a fake d'_F, and a one-k comparison against C-CEIL-T. A degree
            measured at another k or t is refused for E1 and E2.
        - rule: IR-3
          permits_forbids: >-
            Requires r, h and the coefficients from the primary inputs only;
            rho_ub where r is not frozen in them (the Oakley groups print the
            full order N = h r only); no recalled value.
        - rule: SN-1
          permits_forbids: >-
            Requires negation of imported margins and the 409 sign check
            against -37.781 to 0.01 bit. On failure or a missing record, no
            import is made and every row that needs one is UNRESOLVED.
        - rule: G1 to G4 with stage_order_enforcement
          permits_forbids: >-
            G1: the Stage-0 checks, C-RHOCONV, C-COVER, FIPS and Oakley
            coverage and the pins. G2: F1. G3: F2 and C-ARG (an F3 failure
            withdraws R-M only). G4: the eight omega-3 margins positive under
            MI-1 and PF-2. The D* function asserts that gates.json exists with
            G1 to G4 passed. raw-result.json carries the gates.json digest and
            stage_timestamps.
        - rule: CR-1 to CR-3, locator_rule, primary_input_pins
          permits_forbids: >-
            A Hasse failure of a read makes the row UNRESOLVED, never
            repaired. Locators are pointers, and Stage 0 reads the whole
            block. G1 fails on any pin mismatch.
        - rule: BR-1 with pinned_coherent_row, exact_n_only, multi_match_rule, unresolved_reading, unresolved_level_pin
          permits_forbids: >-
            BR-1 imports exactly one pinned slice per (degree, storage
            reading). It forbids interpolation, neighbouring n and selection
            among multiple matches; a missing, conflicting or ambiguous
            import makes the row UNRESOLVED. A degree with one IC curve is IC.
      reads_and_writes_of_a_valid_run: >-
        Reads: joint_balance.py; the primary inputs and their pins (FIPS
        186-4, SEC 2, Certicom Appendix A, RFC 2409, Bailey 2009/541); the
        audit sheet for the CB-1 extraction; W-a gates.json for the
        stage-order assertion and manifest writer; W-c or W-b optionally;
        the W-d record files (RS-1, BR-1); W-e (SN-1, RS-2, C-XDEG). Writes:
        code/certicom_coverage.py, the run directory's artifacts, and
        RESULTS.md. Every read under runs/ is admitted literally by the
        version-4 whitelist (computations j5_trace required_reads_admitted:
        all true), so the O-RT-01 class is discharged for reads (RV3-4).
        Residual: the W-d record files are a set Stage 0 locates at run
        time; this card existence-tested only the directory.
      latent_conflicts_unreachable_on_the_pinned_inputs: >-
        (1) CR-1 to CR-3 route a Hasse failure to an UNRESOLVED row, while
        stage 1 says "G1 passes iff every Stage-0 parameter check passes".
        C-PARAM's pass criterion names only FIPS curves, so on an input
        where a Certicom read failed, the rules would disagree on stop
        versus route. On the pinned text every CR check passes (h = 76, 2
        and 2, each the unique admissible cofactor in 1..199), and any other
        text fails the pin check, so the branch is unreachable. (2) BR-1's
        two "iff" class definitions are not mutually exclusive if an
        imported coherent margin were negative at a degree whose time-only
        margins are all positive. L-MONO rules that out for records
        consistent with it.
    run_traces:
      method: >-
        Synthetic manifests in j5_trace.py name declared labels only. Each
        is evaluated on its full facts and on the archived view: the fields
        version 4's artifact specification requires the archive to carry
        (stage_timestamps as per-stage start and end, the gates.json digest
        match, artifacts present, gates recorded), without per-artifact
        write events unless the run logs them. The valid manifest's gates
        come from this reviewer's closed forms and input checks. G1 holds
        (pins, C-RHOCONV, 15 curves at 9 degrees, the FIPS and SEC 2
        cross-check, Hasse). G2 holds (F1 PASS under MI-1 and PF-2, slacks
        4.5179e-4 bit at 571 and 2.1634e-5 bit at 283, with Macaulay rows
        2^36.63 and 2^32.58 under R-B and relation stores 2^47.58 and 2^31.44
        beside the two targets). G4 holds (all eight margins positive).
      traces:
        - manifest: V0 valid run from the closed forms
          fired: []
          protocol_success_version_4: VALID (full facts and archived view)
          version_3_text_for_contrast: VALID
        - manifest: I-1 gates.json absent (gates held in memory; the D* function's assertion bypassed)
          fired: [V-6 (gates.json absent; gates.json digest missing in raw-result.json)]
          protocol_success_version_4: INVALID (V-6; required artifact gates.json missing)
          version_3_text_for_contrast: INVALID (artifact missing)
        - manifest: I-1-prime gates.json absent with the assertion intact (the D* function raises; the run stops)
          fired: [V-6 (raised stage-order assertion)]
          protocol_success_version_4: INVALID
          version_3_text_for_contrast: INVALID (artifacts missing)
        - manifest: I-2a a D* table written before gates.json, the run logging its write events
          fired: [V-6 (written before gates.json)]
          protocol_success_version_4: INVALID
          version_3_text_for_contrast: VALID
        - manifest: I-2b a D* table written before gates.json by a path that does not call the asserting D* function (C-IND's D* recomputation run in Stage 3), only the specified stage_timestamps archived
          fired: >-
            Full facts: V-6 (D* computed before Stage 6; written before
            gates.json). Archived view: nothing fires.
          protocol_success_version_4: INVALID on full facts; VALID on the archived view unless code review or stdout.log shows the early call (OBJ-RT-J5-2)
          version_3_text_for_contrast: VALID
        - manifest: I-3a a ceiled figure inside a gated quantity (C-CEIL-A in G4's ECC2-238 margin); C-IND recomputes every margin and disagrees
          fired: [SR-3, V-11]
          protocol_success_version_4: INVALID
          version_3_text_for_contrast: INVALID (C-IND)
        - manifest: I-3b the same ceiled figure shared by both implementations; C-IND agrees
          fired: [V-11]
          protocol_success_version_4: INVALID
          version_3_text_for_contrast: VALID
        - manifest: I-4 V-11 fires (a C-PF1-T value replacing an in-force threshold-table entry)
          fired: [V-11]
          protocol_success_version_4: INVALID
          version_3_text_for_contrast: VALID
        - manifest: X-1 valid run that also writes gates.json (same bytes) in Stage 8, as Stage 8's step list names it
          fired: >-
            Under reading A (the write at the end of Stage 4 governs) nothing
            fires. Under reading B (the last write governs, write events
            visible) V-6 fires.
          protocol_success_version_4: VALID under A; INVALID under B, a false FAIL (OBJ-RT-J5-3)
          version_3_text_for_contrast: VALID
        - manifest: X-2 valid run whose raw-result.json is written inside Stage 8 before the manifest and digests, so it cannot carry Stage 8's end
          fired: []
          protocol_success_version_4: VALID if "every required artifact exists" means existence; INVALID if it includes the artifact's stated content, a false FAIL (OBJ-RT-J5-4)
          version_3_text_for_contrast: n/a (no stage_timestamps requirement in version 3)
        - manifest: X-3 the IR-1 guard refuses an open of a non-whitelisted runs/ file after every artifact is written (no file opened)
          fired: >-
            Nothing under V-2's text, which requires a file opened. SR-4
            instructs that the run be recorded invalid under V-2
            (OBJ-RT-J5-5).
          protocol_success_version_4: VALID by V-2's predicate; INVALID by SR-4's instruction
          version_3_text_for_contrast: VALID
        - manifest: X-4 a read of a non-record file (for example stdout.log) in the W-d directory
          fired: [V-2]
          protocol_success_version_4: INVALID (literal W-d admits record files only; CB-4's predicate would admit it, OBJ-RT-J5-6)
          version_3_text_for_contrast: VALID
      result: >-
        VALID on the valid run only among the plan's five manifests. Every
        plan-required invalid run (gates.json absent; a D* table written
        before gates.json, when the order is visible; a ceiled figure inside
        a gated quantity; V-11) reads INVALID, through a named rule where
        the version-3 text read three of them VALID. RV3-5 and RV3-12 are
        discharged literally. The X manifests are this reviewer's additions;
        they locate the residual hazards OBJ-RT-J5-2 to OBJ-RT-J5-6.
    holding_joint_walk:
      - joint: J1 (version-3 round)
        held_item: coverage gate (67 of 67), CB-1 pinned and import-safe, CO-1 changes no row, D-CARRY clean
        version_4: >-
          No regression. CB-1 reproduces 7e76be31...9574 (9282 bytes) by the
          pinned method. Stage 0 (a), C-COVER, SR-6 and V-10 are unchanged in
          operative content (stage 0 gains pins and the locator rule). No
          hunk touches row_set_rule. This reviewer's whole-Appendix scan
          finds 15 binary curves at 9 degrees with the same m and h. The rho
          column recomputes from the pinned FIPS r: 279.7470746 for K-571
          against the carried 279.7471, and 284.8257481 for B-571 against
