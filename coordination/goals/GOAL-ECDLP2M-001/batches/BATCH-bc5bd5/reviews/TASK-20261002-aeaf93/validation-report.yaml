    breaking_item:
      id: B-J8-1
      severity: material
      rv3_item: RV3-13 (re-base pricing_conventions on the three correction records)
      breaking_artifact_met: >-
        "its read-at-source statement false". The re-base states that the three
        records were "each read at source by S-P4 on 2026-10-02" and then states
        what CORR-20260925-649e25 records; at source the record says the
        opposite on the point stated.
      location: >-
        spec pricing_conventions.note item (3) (specification.yaml lines 242-249
        at the snapshot commit), with pricing_conventions.basis (lines 214-220);
        audit constants_delta CD-16 (lines 3314-3317).
      version_4_text: >-
        "CORR-20260925-649e25 records that the per-orbit unit, if adopted, would
        move each Koblitz and subfield index-calculus margin by log2 k bits"
      source_text: >-
        ledger/corrections/CORR-20260925-649e25.yaml item 1 gives that sentence
        as its prior_reading (Adopting the per-orbit unit moves every Koblitz
        and subfield index-calculus margin by log2 k bits against the attacker)
        and supersedes it with a corrected_reading that begins (a) CONDITIONAL.
        The sentence describes what the per-orbit unit WOULD change if an
        approved, reviewed lane-B contract's Part 1 and Part 2 establish it, and
        continues (b) PER ROW, NOT "EACH". A movement can apply only on a row
        where two things hold, and (d) NOT AUTHORITY FOR SCOPE (quoted from the
        record, elisions omitted).
      introduced_by_version_4: >-
        Yes. Version 3's item (3) read "CORR-20260925-649e25: no per-orbit or
        Frobenius saving is charged on the index-calculus side", which makes no
        attribution and is consistent with the record. Constants_delta CD-16
        nevertheless records pricing_conventions as "content unchanged", so the
        change is listed but misdescribed, and the specification header's claim
        (answered under RV3-14 O-RT-06) that every change to a holding item is
        in constants_delta is not exact for this entry.
      operational_effect: >-
        None on any figure, rule, gate, class or threshold: the operative
        conclusion of item (3), that the contract adopts no per-orbit saving and
        moves no index-calculus margin by log2 k, agrees with the record. The
        defect is a citation of a correction record for the reading that record
        supersedes, in the field RV3-13 asked to ground in records read at
        source; a later reader citing version 4 would carry the superseded
        lane-B framing forward (DEC-20260924-286589 R-J4 broke the lane-B v1
        contract on that framing, as CORR-20260925-649e25 records; that decision
        was not opened by this card).
      rule_broken: >-
        AGENTS.md core rule 9 (a citation must say what the record claims it
        says; agents/validator.md responsibility 9) inside the RV3-13 discharge.
      remedy: >-
        Restate item (3) from the record's corrected_reading (or restore version
        3's neutral wording) and correct CD-16's description. A text change; no
        figure moves.
      alternative_reading_disclosed: >-
        If the composer reads "read-at-source statement" as the attestation that
        a read happened rather than as its substance, this item is a material
        non-breaking citation defect instead. This card reads it as substance,
        following DEC-20261002-353743 S-3, which treats verifying C4's
        read-at-source limb as verifying its substance at source.

