    memory_recomputation:
      method: >-
        Own code (memory_recompute.py, prose_memory.py, prose_memory_points.py), exact
        integers via math.comb, Fraction for k, math.log2 on the exact integers. Forms - R-B
        rows D log2 n; R-M rows W(n, D) = log2 sum_{d<=D} binom(n, d); MR_C8 log2
        binom(nvar, D) with nvar = m ceil(n/m); macaulay4 width W(N5, D) with N5 = t k + (t -
        2) n; f4_std rows D log2(n(t - 1)) and its monomial form W(n(t - 1), D); dense
        entries twice the rows; relation store log2 = k (n/m under MI-1, ceil(n/m) ceiled).
        Compared to 0.01 bit and exactly on integer counts; time figures on the same lines
        were recomputed at their printed precision.
