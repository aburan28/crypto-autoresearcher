        run's wall-clock and CPU budgets (machine-protection limits, not cost-model
        figures), the process timings of the session computations, tolerances, ratios,
        parameters, degrees and counts.
      basis: >-
        C8's parenthetical names the Macaulay-row disclosure; the plan's J1 claim asks for
        memory "derived at the figure's own parameter point", which only a cost-model figure
        has; J1 attack (iii) lists only index-calculus memory forms; and DEC-20261002-353743
