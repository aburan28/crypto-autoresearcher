        kinds of text stood in version 3.
      sensitivity: >-
        J1 attack (ii) also lists "log2 costs, 2^x and operation counts" without
        restriction, so every rho, budget and process-timing figure in force, and the five
        code-block lines that hold a time value as a program constant, are listed under
        figure_table.literal_reading_only. J1 breaks under both readings; the ruling does
        not move the verdict.
      units_of_the_with_rule: >-
        A list item is the innermost YAML sequence element containing the figure (all its
        fields when the element is a mapping), the reading under which DEC-20261002-353743
        accepted the SN-1 memory_beside sibling (RD-9). A table row is the outermost YAML
        flow collection on its line. A printed log line is one physical line of an embedded
        verbatim log. A sentence ends at a full stop followed by white space and a capital,
        digit, parenthesis or quote, except after eq, e.g, i.e, cf, Sec, al, vs, etc, Fig,
        No, approx, resp or p, or inside a decimal. WITH-S is a memory figure in the same
        sentence, table row or log line; WITH-L is one only in the same list item; WITHOUT
        is neither.
      memory_figure_recognition: >-
        In prose and rows, a 2^x value or an "x bits of rows / of relation store" value
        whose x recomputes, at its own point, as one of the memory forms (75 distinct
        values, memory_recomputation below); on a log line, a JSON key naming rows, a store,
        a width or entries. For rho figures, Bailey's distinguished-point figure (2^35.63,
        about 850 GB) counts as memory. That each WITH-S memory value belongs to the same
        object as its time figure was checked by reading each unit against the point its
        memory value recomputes at (reviewer reading, not a script).
