      what_counts_as_a_time_figure: >-
        C8 of DEC-20260924-99ce20 reads "Keep the memory disclosure (Macaulay matrix about
        binom(nvar, D_solve) rows) beside every time figure." As sole C8 owner this review
        counts as a time figure every index-calculus cost-model time quantity in log2 bits -
