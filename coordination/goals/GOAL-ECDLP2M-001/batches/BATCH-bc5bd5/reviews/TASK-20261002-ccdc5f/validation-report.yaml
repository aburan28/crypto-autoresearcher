        J1's claim is false if one in-force time figure lacks a memory figure for the same
        object in its sentence, list item, table row or log line. This review searched for
        exactly that and found 41 (figure_table.without). The finding would itself be false
        if the c8_sweep entries were not in force (rule (1) puts the whole sheet in force),
        if numerals in index text were not figures (rule (4) says they are), or if a memory
        figure stood in those items (read by hand; none does). MUT-E and MUT-F add a memory
        figure to one breaking unit each and the verdict flips to WITH, so the result is
        driven by the missing memory and not by the classifier.
