      issue: >-
        Round 2 (C-1 recheck, C-2 parse of the four files, C-3, C-6) ran after
        this worksheet was written; every step exited 0, all four files parsed,
        and the relay is embedded in the audit sheet's
        session_computations.round_2. A final C-2 parse of the files changed
        after round 2 is reported in S-P4's hand-back.
    - id: OI-2
      issue: >-
        The round-1 relay is transcribed into the audit sheet by S-P4 in seven
        parts; the composer can check the transcription by concatenating the
        parts and comparing the sha256 with the relayed value (audit
        procedure PD-P4-2).
