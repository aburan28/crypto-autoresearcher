  # ---------------------------------------------------------------------------
  hold_f_hold_g_statement: >-
    PV4-13. The version-4 Certicom row set (spec
    inputs.curve_parameters.certicom_rows.rows) is the same fifteen binary
    curves at the same nine degrees as version 3, with the same m and h and
    the same readings CR-1 to CR-3; only the lines locators of ECC2-353 and
    ECC2K-358 changed (F-J1-1), and a locator is a pointer, not part of the
    row. The FIPS and Oakley rows are unchanged. The version-4 row set
    therefore does not change the HOLD-F and HOLD-G row-set condition of
    DEC-20261002-353743 hold_f_hold_g, which stays as carried (when designed,
    their row set is reconciled against the frozen primary inputs, never
    against EXP-SEMBIN-992e73); version 4, being unapproved, is official for
    neither hold. No lane-B hold is carried here.
  x_certbin: >-
    PV4-12. Every Certicom m, a, b, h and r is read from Appendix A of
    inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md only (spec
    certicom_rows.source, locator_rule and procedure stage 0); no CERTBIN
    value is adopted, and no CERTBIN record was read for this revision.
