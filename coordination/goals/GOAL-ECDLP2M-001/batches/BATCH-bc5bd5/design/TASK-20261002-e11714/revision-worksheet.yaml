    d_carry_statement: >-
      F-J1-3. Each Q1 and Q2 value that version 4 restates is the SAME VALUE as
      version 3's, printed at the stated precision of each place where it
      stands; two places may print the same value to a different number of
      decimals (a three-decimal fixture target beside a four-decimal model
      evaluation of the same quantity), and such prints are consistent
      roundings of one value, not two values. No Q1 or Q2 value changes.
    constants_delta_pointer: audit constants_delta CD-01 to CD-17

  # ---------------------------------------------------------------------------
  newly_frozen_values:
    definitions_are_value_free: true
    rule: >-
      Every value version 4 freezes and version 3 did not, as NF-nn, each with
      (a) its location by file and field path, never its value; (b) a
      value-free definition sufficient for an independent re-derivation,
      using the contract's names; (c) where one applies, the label of the
      blind-input quantity that defines the same quantity (bc5bd5 =
      coordination/review/nistbin-20261002-bc5bd5/blind-inputs.yaml; f435ab =
      coordination/review/nistbin-20261002-f435ab/blind-inputs.yaml), by label
      only. Common conventions for every definition below, stated once - n =
      571 unless a definition names another degree; t = m; omega = 3.0;
      stage 1 only; A(n, m) = k - log2 P(n, m, m, k) as the contract's
      definitions.A states it, with k = n/m under MI-1 and k = ceil(n/m)
      under the ceiled reading, and P under PF-2 (P = 1 - exp(-x)) or PF-1
      (P = x), x = 2^(m k - n)/m!; C_I(n, omega) = the first minimum over m in
      2..min(30, n), ascending, of A(n, m) + 4 omega log2 n; m* its argmin;
      W(n, D) = log2 of the sum over d = 0..D of binom(n, d); MR_B = D log2 n;
      MR_M = W(n, D); MR_C8 = log2 binom(nvar, D) with nvar = m* ceil(n/m*);
      dense entries twice each rows figure; relation store = log2 k at the
      stated m under the stated k reading; rho(c) as the contract's
      definitions.rho states it; D*_R, D*real_B and the tokens as
      definitions.d_star and d_star_of_m state them; log2 throughout; values
      rounded as CB-3 prints them. Each definition below is meant to stand
      alone with these conventions; none is inseparable from its answer.
    items:
      - id: NF-01
        location: audit session_computations.round_1.relay part_1 (CB-3 output rho_571); audit rho_column.version_4_recomputation
        definition: >-
          For c in {K-571, B-571}: whether the FIPS 186-4 primary text's sha256
          equals its committed pin; whether the decimal base-point order r
          transcribed in CB-3 occurs in that text; the bit length of r; the
          cofactor h; the Frobenius class order k_c as definitions.rho
          defines it; whether h r lies in the Hasse interval for n = 571;
          log2 r; rho(c) to seven decimals; and rho(c) minus the contract's
          carried four-decimal rho column entry.
        blind_input_label: Q1-571 (bc5bd5 and f435ab)
      - id: NF-02
        location: audit session_computations.round_1.relay part_1 (CB-3 output bottleneck_figures); spec proof_search_map.bottleneck; hyp version_4.mechanism, H1.lower_edge and proof_search_map.bottleneck; audit design_figures DF-BOT
        definition: >-
          At n = 571 under MI-1 and PF-2, with m* the argmin of C_I(571, 3.0):
          (a) the cost of one R-B degree step, omega log2 571, with the
          per-step growth of MR_B (log2 571) and the relation store at m*;
          (b) the change in C_I(571, omega) at D = 4 when omega moves from 3
          to 2.376, which is 4 (3 - 2.376) log2 571, with MR_B and MR_M at
          D = 4 and the relation store at m*; (c) -log2 P(571, m*, m*, 571/m*)
          under PF-2 and log2(m*!), with the same memory; (d) the R-M anchor
          omega (4 log2 571 - W(571, 4)), with MR_M and MR_B at D = 4; (e)
          C_I(571, 3.0) minus rho(c) for c in {K-571, B-571}, with MR_B, MR_M
          and the relation store at m*.
        blind_input_label: none (QNF of bc5bd5 by this definition)
      - id: NF-03
        location: audit session_computations.round_1.relay part_2 (CB-3 output ceiled_vs_MI1_cells); spec definitions.model_identification_choices MI-1.direction; audit design_figures DF-KR
        definition: >-
          Over every claim-(A) degree n of the contract's
          preregistered_prediction (P-A, fifteen degrees) and every m in
          2..min(30, n), under PF-2 at D = 4: the number of cells (n, m); the
          number at which A(n, m) + 4 omega log2 n under k = ceil(n/m) is
          below, equal to and above the same under k = n/m (MI-1); the list
          of equal cells; and the number of degrees at which C_I under the
          ceiled reading is below C_I under MI-1.
        blind_input_label: none (QNF of bc5bd5 by this definition)
      - id: NF-04
        location: audit session_computations.round_1.relay part_3 (CB-3 output A_571_by_m); spec MI-2.disclosed_consequence; audit design_figures DF-A571
        definition: >-
          For each m in 2..30: A(571, m) under each of the four (k reading,
          P form) pairs; the differences ceiled minus MI-1 under each P form;
          the differences PF-2 minus PF-1 under each k reading; the relation
          store log2 k under each k reading; and MR_B and MR_M at D = 4.
        blind_input_label: QA (bc5bd5)
      - id: NF-05
        location: audit session_computations.round_1.relay part_3 (CB-3 output A_571_summary); spec MI-1.direction and MI-2.disclosed_consequence; audit design_figures DF-A571
        definition: >-
          Over the lines of NF-04: (a) for ceiled minus MI-1 under each P form,
          the counts of negative, zero and positive differences, the most
          negative and the least negative difference, the m at which each
