        def a_summary_571():
            n = N571
            wn = widths(n, FIXTURE_DEGREE)
            rows_b = r4(FIXTURE_DEGREE * math.log2(n))
            rows_m = r4(wn[FIXTURE_DEGREE])
            out = {"n": n, "m_count": M_HI - M_LO + 1,
                   "MR_B_at_D4": rows_b, "MR_M_at_D4": rows_m}
            for pf in P_FORMS:
                diffs = [(a_value(n, m, "ceiled", pf) - a_value(n, m, "MI-1", pf), m)
                         for m in range(M_LO, M_HI + 1)]
                lo = min(diffs)
                hi = max(diffs)
                out["ceiled_minus_MI1_" + pf] = {
                    "count_negative": sum(1 for d, _ in diffs if d < 0),
                    "count_zero": sum(1 for d, _ in diffs if d == 0),
                    "count_positive": sum(1 for d, _ in diffs if d > 0),
                    "largest_drop": r4(lo[0]), "at_m": lo[1],
                    "store_MI1_there": r4(k_exact(n, lo[1], "MI-1")),
                    "store_ceiled_there": r4(k_exact(n, lo[1], "ceiled")),
                    "smallest_drop": r4(hi[0]), "smallest_at_m": hi[1],
                    "store_MI1_at_smallest": r4(k_exact(n, hi[1], "MI-1")),
                    "store_ceiled_at_smallest": r4(k_exact(n, hi[1], "ceiled"))}
            for kr in K_READINGS:
                gaps = [(pf_gap(log2_x(n, m, kr)), m) for m in range(M_LO, M_HI + 1)]
                big = max(gaps)
                small = min(gaps)
                out["PF2_minus_PF1_" + kr] = {
                    "count_positive": sum(1 for g, _ in gaps if g > 0),
                    "count_zero_or_negative": sum(1 for g, _ in gaps if g <= 0),
