            return out


        def mi2_consequence():
            out = []
            for n in MI2_DEGREES:
                for kr in K_READINGS:
                    row = {"n": n, "k_reading": kr}
                    best = {}
                    for pf in P_FORMS:
                        ordered = ordered_m(n, kr, pf)
                        (v1, m1), (v2, m2) = ordered[0], ordered[1]
                        best[pf] = (v1, m1)
                        row[pf] = {"C_I": r7(v1), "m_star": m1, "runner_up_m": m2,
                                   "runner_up_gap": r7(v2 - v1),
                                   "memory_at_m_star": memory_at(n, m1, FIXTURE_DEGREE, kr),
                                   "relation_store_at_runner_up": r4(k_exact(n, m2, kr))}
                    move = best["PF-1"][0] - best["PF-2"][0]
                    row["move_PF1_minus_PF2"] = sci(move)
                    row["argmin_changes"] = best["PF-1"][1] != best["PF-2"][1]
                    row["move_exceeds_F2_tolerance"] = abs(move) > F2_TOLERANCE
                    row["memory_note"] = "MI-2 changes no memory figure: rows and relation store do not depend on the P form"
                    out.append(row)
            return out


        def mi2_fixture():
            out = []
            for kr in K_READINGS:
                for pf in P_FORMS:
                    row = {"k_reading": kr, "P_form": pf, "in_force": (kr, pf) == IN_FORCE}
                    oks = []
                    for n, target, m_target in FIXTURE_TARGETS:
                        v, m_star = ordered_m(n, kr, pf)[0]
                        dist = abs(v - float(target))
                        ok = dist <= FIXTURE_TOLERANCE and m_star == m_target
                        oks.append(ok)
                        row["n_%d" % n] = {"C_I": r7(v), "m_star": m_star,
                                           "target": float(target), "target_m": m_target,
                                           "abs_distance": sci(dist),
