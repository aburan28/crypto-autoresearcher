        import hashlib
        import json
        import math
        import sys
        from fractions import Fraction

        GATES = ("G1", "G2", "G3", "G4")
        RUN_DIR = "experiments/EXP-NISTBIN-451dfa/runs/RUN-SYNTHETIC/"
        IR1_WHITELIST_FILES = (
            "experiments/EXP-SEMBIN-992e73/runs/RUN-SEMBIN-a7a2f3/raw-result.json",
            "experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/raw-result.json",
            "experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml",
        )
        IR1_WHITELIST_DIRS = (
            "experiments/EXP-SEMBIN-2c40bb/runs/RUN-SEMBIN-3ae91c/",
        )
