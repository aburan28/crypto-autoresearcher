                                           "passes": ok,
                                           "memory_at_m_star": memory_at(n, m_star, FIXTURE_DEGREE, kr)}
                    row["pass_rule"] = "PASS" if all(oks) else "FAIL"
                    out.append(row)
            return out


        def mi2_direction():
            lower = 0
            not_lower = 0
            for n in CLAIM_A_DEGREES:
                for m in range(M_LO, min(M_HI, n) + 1):
                    for kr in K_READINGS:
                        if pf_gap(log2_x(n, m, kr)) > 0:
                            lower += 1
                        else:
                            not_lower += 1
            return {"cells": lower + not_lower, "A_PF1_below_A_PF2": lower,
                    "A_PF1_not_below_A_PF2": not_lower,
                    "basis": "PF-1 minus PF-2 of A is -log2(x / (1 - exp(-x))) < 0 for every x > 0",
                    "memory_note": "MI-2 changes no memory figure"}


        def r_b_cost(d, omega=OMEGA):
            return d * omega * math.log2(N571)


        def r_m_cost(d, wn, omega=OMEGA):
            return omega * (wn[d] - wn[FIXTURE_DEGREE] + FIXTURE_DEGREE * math.log2(N571))


        def crossing(a, rho, reading, wn):
            """Least D in 2..64 with a + S_R(571, D, omega) - rho > 0, or None."""
            for d in range(D_LO, D_HI + 1):
                s = r_b_cost(d) if reading == "R-B" else r_m_cost(d, wn)
                if a + s - rho > 0:
                    return d
            return None


        def as_int(d):
            return D_HI + 1 if d is None else d


        def token(d):
            if d is None:
                return "no crossing at D <= 64"
            if d == D_LO:
                return "D* <= 2"
            return d


        def scored_cells(rho):
            wn = widths(N571, D_HI)
            m_star = ordered_m(N571, "MI-1", "PF-2")[0][1]
            a = a_value(N571, m_star, "MI-1", "PF-2")
            store = r4(k_exact(N571, m_star, "MI-1"))
            out = []
            values = []
            for label in CURVE_LABELS:
                for reading in READINGS:
                    d = crossing(a, rho[label], reading, wn)
                    values.append(d)
                    cell = {"curve": label, "reading": reading, "m_star": m_star,
                            "k_reading": "MI-1", "P_form": "PF-2", "omega": OMEGA,
                            "D_star": token(d)}
                    if d is not None and d > D_LO:
                        for tag, dd in (("at_D_star_minus_1", d - 1), ("at_D_star", d)):
                            s = r_b_cost(dd) if reading == "R-B" else r_m_cost(dd, wn)
                            cell[tag] = {"D": dd, "margin": r4(a + s - rho[label]),
                                         "MR_B": r4(dd * math.log2(N571)),
                                         "MR_M": r4(wn[dd]), "relation_store": store}
                    out.append(cell)
            return out, values


        def classify(values):
            ints = [as_int(v) for v in values]
            lo = min(ints)
            hi = max(ints)
            none_any = any(v is None for v in values)
            return {"D_star_lo": lo if lo <= D_HI else "above 64",
                    "D_star_hi": hi if hi <= D_HI else "above 64",
                    "K1_near": lo <= 11,
                    "K2_teens": 12 <= lo and hi <= 20,
                    "K2x_straddle": 12 <= lo <= 20 < hi,
                    "K3_far": lo >= 21 and not none_any,
                    "K4_beyond": lo >= 21 and none_any}


        def reachability_by_reading(rho):
            wn = widths(N571, D_HI)
            m_star = ordered_m(N571, "MI-1", "PF-2")[0][1]
            out = []
            for kr in K_READINGS:
                for pf in P_FORMS:
                    a = a_value(N571, m_star, kr, pf)
                    values = [crossing(a, rho[label], reading, wn)
                              for label in CURVE_LABELS for reading in READINGS]
                    row = {"k_reading": kr, "P_form": pf, "in_force": (kr, pf) == IN_FORCE,
                           "at_m": m_star,
                           "scored_cells_D_star": [token(v) for v in values]}
                    row.update(classify(values))
                    out.append(row)
            return out


        def a_branch_reachability():
            plus = sorted(n for n, s in RT4_SIGNS_OMEGA3.items() if s == "+")
            minus = sorted(n for n, s in RT4_SIGNS_OMEGA3.items() if s == "-")
            return {
                "basis": "BR-1 at omega 3 with the carried pre-registered rt4 signs; no coherent margin is evaluated here",
                "degrees_with_positive_pre_registered_time_only_sign": plus,
                "count_positive": len(plus),
                "degrees_classified_only_through_exact_n_coherent_imports": minus,
                "A_confirmed": "not fixed by the closed forms (needs the coherent imports at 359, 409 and 571)",
                "A_second": "not fixed by the closed forms; reachable only through 359 or 409",
                "A_rho571": "not fixed by the closed forms; reachable only through 571's coherent import (clause (a))",
                "A_unresolved": "not fixed by the closed forms; reachable if an exact-n coherent row is missing or conflicting at 359, 409 or 571"}


        def threshold_table(rho, kr, pf, wn):
            tab = {}
            for label in CURVE_LABELS:
                for reading in READINGS:
                    for m in range(M_LO, M_HI + 1):
                        a = a_value(N571, m, kr, pf)
                        tab[(label, reading, m)] = crossing(a, rho[label], reading, wn)
            return tab


        def table_comparisons(rho):
            wn = widths(N571, D_HI)
            tabs = {}
            for kr in K_READINGS:
                for pf in P_FORMS:
                    tabs[(kr, pf)] = threshold_table(rho, kr, pf, wn)
            base = tabs[IN_FORCE]
            names = ((("ceiled", "PF-2"), "C-CEIL-T, the one-k comparison column (k = ceil(571/m), PF-2)"),
                     (("MI-1", "PF-1"), "C-PF1-T, the MI-2 alternative (k = 571/m, PF-1)"),
                     (("ceiled", "PF-1"), "ceiled k and PF-1 together"))
            comparisons = []
            for combo, name in names:
                later = equal = earlier = 0
                max_later = 0
                later_by_two_or_more = 0
                for key, v in base.items():
                    diff = as_int(tabs[combo][key]) - as_int(v)
                    if diff > 0:
                        later += 1
                        max_later = max(max_later, diff)
                        if diff >= 2:
                            later_by_two_or_more += 1
                    elif diff == 0:
                        equal += 1
                    else:
                        earlier += 1
                comparisons.append({"column": name, "entries": len(base),
                                    "later_than_in_force_entry": later,
                                    "equal": equal, "earlier_than_in_force_entry": earlier,
                                    "largest_lateness_in_degrees": max_later,
                                    "entries_later_by_two_or_more": later_by_two_or_more})
            tokens = []
            for (kr, pf), tab in tabs.items():
                tokens.append({"k_reading": kr, "P_form": pf,
                               "in_force": (kr, pf) == IN_FORCE,
                               "entries": len(tab),
                               "tokens_D_star_le_2": sum(1 for v in tab.values() if v == D_LO),
                               "tokens_no_crossing": sum(1 for v in tab.values() if v is None),
                               "grid_edge_m": sorted(set(key[2] for key, v in tab.items() if v == D_LO)),
                               "largest_entry": max(as_int(v) for v in tab.values())})
            m_star = ordered_m(N571, "MI-1", "PF-2")[0][1]
            m8 = all(as_int(base[(lab, rd, m)]) <= as_int(base[(lab, rd, m_star)])
                     for (lab, rd, m) in base)
            negative = []
            negative_with_rm_at_4_or_more = 0
            for label in CURVE_LABELS:
                for m in range(M_LO, M_HI + 1):
                    d_b = as_int(base[(label, "R-B", m)])
                    d_m = as_int(base[(label, "R-M", m)])
                    if d_m - d_b < 0:
                        negative.append([label, m])
                        if d_m >= FIXTURE_DEGREE:
                            negative_with_rm_at_4_or_more += 1
            spread = {"in_force_table_entries_per_reading": 2 * (M_HI - M_LO + 1),
                      "negative_spread_entries": negative,
                      "negative_spread_with_R_M_crossing_at_D_ge_4": negative_with_rm_at_4_or_more,
                      "L_SPREAD_scope_holds": negative_with_rm_at_4_or_more == 0}
            return comparisons, tokens, {"M8_no_entry_later_than_m_star_entry": m8,
                                         "m_star": m_star}, spread


        def m7_rows():
            log2n = math.log2(N571)
            out = []
            for kr in K_READINGS:
                for m in range(M_LO, M_HI + 1):
                    k = k_exact(N571, m, kr)
                    n5_exact = m * k + (m - 2) * N571
                    n5_round = int(round(float(n5_exact)))
                    n5_ceil = math.ceil(n5_exact)
                    wn5 = widths(n5_round, D_HI)

                    def delta(d):
                        return (wn5[d] - wn5[FIXTURE_DEGREE]) - (d - FIXTURE_DEGREE) * log2n

                    d_ps = next((d for d in range(5, D_HI + 1)
                                 if wn5[d] - wn5[d - 1] < log2n), None)
                    d_cum = next((d for d in range(5, D_HI + 1) if delta(d) < 0), None)
                    arg = max(range(FIXTURE_DEGREE, D_HI + 1), key=lambda d: (delta(d), -d))
                    steps = [wn5[d] - wn5[d - 1] for d in range(5, D_HI + 1)]
                    concave = all(steps[i] >= steps[i + 1] for i in range(len(steps) - 1))
                    if d_cum is None:
                        no_later = [5, D_HI]
                        undetermined = None
                        no_earlier_from = None
                    elif delta(d_cum - 1) > 0:
                        no_later = [5, d_cum - 1] if d_cum - 1 >= 5 else None
                        undetermined = d_cum
                        no_earlier_from = d_cum + 1 if d_cum + 1 <= D_HI else None
                    else:
                        no_later = None
                        undetermined = None
                        no_earlier_from = d_cum
                    row = {"k_reading": kr, "m": m, "t": m,
                           "N5_exact": str(n5_exact), "N5_rounded": n5_round,
                           "N5_ceiled": n5_ceil,
                           "roundings_agree": n5_round == n5_ceil == n5_exact,
                           "D_ps": NONE_TOKEN if d_ps is None else d_ps,
                           "D_cum": NONE_TOKEN if d_cum is None else d_cum,
                           "DELTA7_max": r4(delta(arg)), "DELTA7_argmax": arg,
                           "rows_M7_at_argmax": r4(wn5[arg]),
                           "rows_R_B_at_argmax": r4(arg * log2n),
                           "concave_in_D": concave,
                           "no_later_for_crossings_in": no_later,
                           "undetermined_at_crossing": undetermined,
                           "no_earlier_for_crossings_from": no_earlier_from}
                    if d_cum is not None:
                        for tag, dd in (("at_D_cum_minus_1", d_cum - 1), ("at_D_cum", d_cum)):
                            row[tag] = {"D": dd, "DELTA7": r4(delta(dd)),
                                        "rows_M7": r4(wn5[dd]),
                                        "rows_R_B": r4(dd * log2n)}
                    out.append(row)
            return out


        def m7_actual_crossings(rho):
            wn = widths(N571, D_HI)
            log2n = math.log2(N571)
            counts = {"k_reading": "MI-1", "P_form": "PF-2", "crossings": 0,
                      "R_B_crossing_at_D_le_4": 0, "M7_earlier": 0, "M7_later": 0,
                      "M7_same": 0, "in_no_later_region": 0, "in_undetermined_slot": 0,
                      "in_no_earlier_region": 0, "lemma_violations": 0}
            for m in range(M_LO, M_HI + 1):
                k = k_exact(N571, m, "MI-1")
                n5 = int(round(float(m * k + (m - 2) * N571)))
                wn5 = widths(n5, D_HI)
                a = a_value(N571, m, "MI-1", "PF-2")

                def s7(d):
                    if d <= FIXTURE_DEGREE:
                        return r_b_cost(d)
                    return OMEGA * (wn5[d] - wn5[FIXTURE_DEGREE]) + r_b_cost(FIXTURE_DEGREE)

                def delta(d):
                    return (wn5[d] - wn5[FIXTURE_DEGREE]) - (d - FIXTURE_DEGREE) * log2n

                d_cum = next((d for d in range(5, D_HI + 1) if delta(d) < 0), None)
                for label in CURVE_LABELS:
                    xb = as_int(crossing(a, rho[label], "R-B", wn))
                    x7 = as_int(next((d for d in range(D_LO, D_HI + 1)
                                      if a + s7(d) - rho[label] > 0), None))
                    counts["crossings"] += 1
                    if x7 < xb:
                        counts["M7_earlier"] += 1
                    elif x7 > xb:
                        counts["M7_later"] += 1
                    else:
                        counts["M7_same"] += 1
                    if xb <= FIXTURE_DEGREE:
                        counts["R_B_crossing_at_D_le_4"] += 1
                        if x7 != xb:
                            counts["lemma_violations"] += 1
                        continue
                    if d_cum is None or xb <= d_cum - 1:
                        counts["in_no_later_region"] += 1
                        if x7 > xb:
                            counts["lemma_violations"] += 1
                    elif xb == d_cum and delta(d_cum - 1) > 0:
                        counts["in_undetermined_slot"] += 1
                    else:
                        counts["in_no_earlier_region"] += 1
                        if x7 < xb:
                            counts["lemma_violations"] += 1
            return counts


        def per_m_span():
            out = []
            for m in range(M_LO, M_HI + 1):
                row = {"m": m, "t": m, "n": N571}
                for kr in K_READINGS:
                    n5 = m * k_exact(N571, m, kr) + (m - 2) * N571
                    row["N5_" + kr] = str(n5)
                    row["variable_ratio_to_" + str(MEASURED_VARIABLES) + "_" + kr] = round(float(n5) / MEASURED_VARIABLES, 1)
                row["chain_length_ratio_to_" + str(MEASURED_T_MAX)] = round(m / MEASURED_T_MAX, 2)
                row["n_ratio_to_" + str(MEASURED_N_MAX)] = round(N571 / MEASURED_N_MAX, 1)
                row["n_ratio_to_" + str(MEASURED_N_SINGLE)] = round(N571 / MEASURED_N_SINGLE, 1)
                row["degree_span"] = "one measured degree (4) against the grid D = 2..64"
                out.append(row)
            return out


        def degree_steps():
            points = []
            for n, degree in DEGREE_STEP_POINTS:
                points.append({"n": n, "D": degree,
                               "MR_B": r4(degree * math.log2(n)),
                               "MR_M": r4(widths(n, degree)[degree]),
                               "MR_B_at_4": r4(FIXTURE_DEGREE * math.log2(n)),
                               "MR_M_at_4": r4(widths(n, FIXTURE_DEGREE)[FIXTURE_DEGREE])})
            return {"points": points,
                    "log2_571_rows_per_R_B_degree_step": r4(math.log2(571))}


        def illustrative():
            points = [{"nvar": nv, "D": d, "log2_binom": r4(log2_binom(nv, d))}
                      for nv, d in ILLUSTRATIVE_NVAR_POINTS]
            return {"points": points, "four_log2_576": r4(4 * math.log2(576))}


        def build(repo):
            rho_print, rho = rho_571(repo)
            scored, values = scored_cells(rho)
            comparisons, tokens, m8, spread = table_comparisons(rho)
            reach = {"in_force_readings": "MI-1 (k = n/m), MI-2 in force PF-2",
                     "label": "branches a VALID run can reach under the closed forms; a design figure, never a finding"}
            reach.update(classify(values))
            return {
                "block": "CB-3 design_figures_v4 (allowed session computation C-4)",
                "label": "DESIGN FIGURES of the contract's abstract model; never results",
                "omega": OMEGA,
                "m_grid": [M_LO, M_HI],
                "D_grid": [D_LO, D_HI],
                "rho_571": rho_print,
                "fixture_points_MI1_PF2": fixture_points(),
                "ceiled_at_fixture_m_571": ceiled_at_fixture_m(),
                "joint_points_571": joint_points_571(),
                "bottleneck_figures": bottleneck_figures(rho),
                "kreading_table": [kreading_row(n) for n in CLAIM_A_DEGREES],
                "ceiled_vs_MI1_cells": ceiled_vs_mi1_cells(),
                "A_571_by_m": a_rows_571(),
                "A_571_summary": a_summary_571(),
                "MI2_consequence": mi2_consequence(),
                "MI2_fixture": mi2_fixture(),
                "MI2_direction": mi2_direction(),
                "scored_cells": scored,
                "reachability_table": reach,
                "reachability_by_reading": reachability_by_reading(rho),
                "A_branch_reachability": a_branch_reachability(),
                "threshold_table_comparisons": comparisons,
                "threshold_table_tokens": tokens,
                "M8_check": m8,
                "L_SPREAD_scope_check": spread,
                "M7_crossovers": m7_rows(),
                "M7_actual_crossings": m7_actual_crossings(rho),
                "per_m_span": per_m_span(),
                "degree_steps": degree_steps(),
                "illustrative_memory": illustrative(),
            }


        def dump(result):
            """Valid JSON with one list item per printed line."""
            out = ["{"]
            keys = list(result)
            for i, key in enumerate(keys):
                tail = "," if i + 1 < len(keys) else ""
                value = result[key]
                if isinstance(value, list):
                    out.append(" " + json.dumps(key) + ": [")
                    for j, item in enumerate(value):
                        comma = "," if j + 1 < len(value) else ""
                        out.append("  " + json.dumps(item) + comma)
                    out.append(" ]" + tail)
                else:
                    out.append(" " + json.dumps(key) + ": " + json.dumps(value) + tail)
            out.append("}")
            return "\n".join(out)


        def main(argv):
            repo = argv[1] if len(argv) > 1 else os.getcwd()
            print(dump(build(repo)))
            return 0


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
