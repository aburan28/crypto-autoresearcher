    CB-1:
      name: certicom_coverage.py
      purpose: RD-1 of DEC-20260925-41f6dc. The Stage-0 Certicom coverage check (control C-COVER), a whole-Appendix scan gated on the frozen binary-curve count. CARRIED UNCHANGED (DEC-20261002-353743 J1 holds; CB-1 pinned and import-safe).
      reference_sha256: 7e76be311e2063e3235f527d6abccb0165ca53865810bf1c3204b102f9269574
      utf8_bytes: 9282
      reference_source: version-3 reference digest (DEC-20261002-3ba55f R-PRODUCER-COMPUTE C-1 names it); reproduced by C-1 on this sheet's bytes
      changed_after_C-1: false
      source: |
        """EXP-NISTBIN-451dfa version 3, Stage-0 Certicom coverage check (RD-1).

        A whole-Appendix scan of Appendix A ("Curve Details") of the primary input
        inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, made without reading
        the contract's certicom_rows list, compared with the Stage-5 Certicom row
        list as a set of (curve label, field degree m) pairs and gated on the
        frozen binary-curve count. Binary curves only: labels ECC2-<digits> and
        ECC2K-<digits>; prime-field labels ECCp-<digits> are skipped.

        Import-safe: the module level holds only imports, constants and function
        definitions. Nothing is read, computed or printed on import. Execution
        happens only under __main__ (the design-time self-test, allowed session
        computation C-3) or when Stage 0 calls certicom_coverage().
        """

        import json
        import os
        import re
        import sys

        APPENDIX_HEADING = "A Curve Details"
        CERTICOM_BINARY_CURVE_COUNT = 15
        CERTICOM_BINARY_DEGREE_COUNT = 9
        BINARY_FAMILIES = ("ECC2", "ECC2K")
        LABEL_RE = re.compile(r"^(ECC2K|ECC2|ECCp)-([0-9]+)$")
        DEGREE_RE = re.compile(r"^m\s*=\s*([0-9]+)$")
        FIELD_POLY_RE = re.compile(r"^f\s*=\s*x\^([0-9]+)")
        DEFAULT_APPENDIX = os.path.join("inputs", "CERTICOM-CHALLENGE-2009",
                                        "challenge-2009_text.md")
        DEFAULT_SPEC = os.path.join("experiments", "EXP-NISTBIN-451dfa",
                                    "specification.yaml")
        SELF_TEST_SPURIOUS_ROW = ("ECCp-97", 97)
        SELF_TEST_MISLABEL = ("ECC2-353", 353)


        def parse_appendix_a(text):
            """Scan every line after the LAST line equal to APPENDIX_HEADING.

            Returns a dict: start_line (1-based), labels (every curve label found,
            in order), rows (one per binary curve: curve, family, m, label_line,
            m_line, f_line) and problems (binary blocks that could not be read).
            """
            lines = text.split("\n")
            starts = [i for i, line in enumerate(lines)
                      if line.strip() == APPENDIX_HEADING]
            if not starts:
                return {"start_line": None, "labels": [], "rows": [],
                        "problems": ["Appendix A heading not found"]}
            start = starts[-1]
            labels = []
            for i in range(start + 1, len(lines)):
                hit = LABEL_RE.match(lines[i].strip())
                if hit:
                    labels.append((i, hit.group(1), hit.group(1) + "-" + hit.group(2)))
            rows = []
            problems = []
            for j, (i, family, curve) in enumerate(labels):
                if family not in BINARY_FAMILIES:
                    continue
                end = labels[j + 1][0] if j + 1 < len(labels) else len(lines)
                degree_hits = []
                poly_hits = []
                for q in range(i + 1, end):
                    s = lines[q].strip()
                    d_hit = DEGREE_RE.match(s)
                    if d_hit:
                        degree_hits.append((q + 1, int(d_hit.group(1))))
                    f_hit = FIELD_POLY_RE.match(s)
                    if f_hit:
                        poly_hits.append((q + 1, int(f_hit.group(1))))
                if len(degree_hits) != 1:
                    problems.append("%s at line %d: %d field-degree lines, expected 1"
                                    % (curve, i + 1, len(degree_hits)))
                    continue
                m_line, m = degree_hits[0]
                if not poly_hits or poly_hits[0][1] != m:
                    problems.append("%s at line %d: field polynomial degree does not equal m = %d"
                                    % (curve, i + 1, m))
                    continue
                rows.append({"curve": curve, "family": family, "m": m,
                             "label_line": i + 1, "m_line": m_line,
                             "f_line": poly_hits[0][0]})
            return {"start_line": start + 1,
                    "labels": [c for (_, _, c) in labels],
                    "rows": rows, "problems": problems}


        def certicom_coverage(appendix_text, stage5_rows):
            """G1 coverage verdict for the Certicom input (control C-COVER).

            appendix_text: the full text of the primary input, read unmodified.
            stage5_rows: the Stage-5 Certicom row list as (curve label, m) pairs.
            PASS iff the scan finds exactly CERTICOM_BINARY_CURVE_COUNT binary
            curves with distinct labels at CERTICOM_BINARY_DEGREE_COUNT distinct
            degrees, every binary block is read without a problem, and the Stage-5
            list holds exactly the same (label, m) pairs, each once.
            """
            parsed = parse_appendix_a(appendix_text)
            reasons = list(parsed["problems"])
            pairs = [(r["curve"], r["m"]) for r in parsed["rows"]]
            pair_set = set(pairs)
            binary_labels = [c for c in parsed["labels"]
                             if c.split("-")[0] in BINARY_FAMILIES]
            if len(set(binary_labels)) != len(binary_labels):
                reasons.append("a binary curve label occurs more than once in Appendix A")
            if len(pairs) != CERTICOM_BINARY_CURVE_COUNT:
                reasons.append("Appendix A binary-curve count %d differs from the frozen count %d"
                               % (len(pairs), CERTICOM_BINARY_CURVE_COUNT))
            degrees = sorted(set(m for (_, m) in pairs))
            if len(degrees) != CERTICOM_BINARY_DEGREE_COUNT:
                reasons.append("Appendix A binary-degree count %d differs from the frozen count %d"
                               % (len(degrees), CERTICOM_BINARY_DEGREE_COUNT))
            stage5 = [(str(c), int(m)) for (c, m) in stage5_rows]
            stage5_set = set(stage5)
            if len(stage5) != CERTICOM_BINARY_CURVE_COUNT:
                reasons.append("Stage-5 Certicom row count %d differs from the frozen count %d"
                               % (len(stage5), CERTICOM_BINARY_CURVE_COUNT))
            if len(stage5_set) != len(stage5):
                reasons.append("a Stage-5 Certicom row occurs more than once")
            for (c, m) in sorted(pair_set - stage5_set):
                reasons.append("binary curve of Appendix A absent from Stage 5: %s at m = %d"
                               % (c, m))
            for (c, m) in sorted(stage5_set - pair_set):
                reasons.append("Stage-5 row that is not a binary curve of Appendix A"
                               " at that degree: %s at m = %d" % (c, m))
            return {"verdict": "PASS" if not reasons else "FAIL",
                    "reasons": reasons,
                    "appendix_start_line": parsed["start_line"],
                    "appendix_binary_count": len(pairs),
                    "appendix_binary_degrees": degrees,
                    "appendix_binary_rows": parsed["rows"],
                    "stage5_count": len(stage5)}


        def omission_self_test(appendix_text, stage5_rows):
            """C-3 self-test on in-memory copies of the Stage-5 row list only.

            Fifteen single-row omissions, one spurious row and one mislabelled
            degree; each must FAIL. The input file is never modified.
            """
            base = [(str(c), int(m)) for (c, m) in stage5_rows]
            cases = []
            for idx in range(len(base)):
                mutated = base[:idx] + base[idx + 1:]
                res = certicom_coverage(appendix_text, mutated)
                cases.append({"case": "omit %s (m = %d)" % base[idx],
                              "kind": "omission", "verdict": res["verdict"],
                              "reasons": res["reasons"]})
            res = certicom_coverage(appendix_text, base + [SELF_TEST_SPURIOUS_ROW])
            cases.append({"case": "add spurious row %s (m = %d)" % SELF_TEST_SPURIOUS_ROW,
                          "kind": "spurious", "verdict": res["verdict"],
                          "reasons": res["reasons"]})
            label, wrong_m = SELF_TEST_MISLABEL
            mislabelled = [(c, wrong_m if c == label else m) for (c, m) in base]
            res = certicom_coverage(appendix_text, mislabelled)
            cases.append({"case": "mislabel %s at m = %d" % (label, wrong_m),
                          "kind": "mislabel", "verdict": res["verdict"],
                          "reasons": res["reasons"]})
            omissions = [c for c in cases if c["kind"] == "omission"]
            detected = [c for c in omissions if c["verdict"] == "FAIL"]
            spurious = [c for c in cases if c["kind"] == "spurious"]
            mislabel = [c for c in cases if c["kind"] == "mislabel"]
            summary = {
                "omissions_detected": "%d/%d" % (len(detected), len(omissions)),
                "spurious_detected": all(c["verdict"] == "FAIL" for c in spurious),
                "mislabel_detected": all(c["verdict"] == "FAIL" for c in mislabel),
                "mislabel_applied": any(c == label for (c, _) in base),
            }
            summary["all_detected"] = (
                len(detected) == len(omissions) == CERTICOM_BINARY_CURVE_COUNT
                and summary["spurious_detected"] and summary["mislabel_detected"]
                and summary["mislabel_applied"])
            return {"cases": cases, "summary": summary}


        def load_stage5_rows(spec_path):
            """Design-time stand-in for Stage 5: the contract's certicom_rows."""
            import yaml
            with open(spec_path, encoding="utf-8") as fh:
                doc = yaml.safe_load(fh)
            rows = doc["experiment"]["inputs"]["curve_parameters"]["certicom_rows"]["rows"]
            return [(r["curve"], int(r["m"])) for r in rows]


        def main(argv):
            repo = argv[1] if len(argv) > 1 else os.getcwd()
            with open(os.path.join(repo, DEFAULT_APPENDIX), encoding="utf-8") as fh:
                appendix_text = fh.read()
            stage5_rows = load_stage5_rows(os.path.join(repo, DEFAULT_SPEC))
            unmodified = certicom_coverage(appendix_text, stage5_rows)
            test = omission_self_test(appendix_text, stage5_rows)
            ok = unmodified["verdict"] == "PASS" and test["summary"]["all_detected"]
            print(json.dumps({"unmodified_inputs": unmodified, "self_test": test,
                              "c3_overall": "OK" if ok else "NOT OK"}, indent=1))
            return 0 if ok else 1


        if __name__ == "__main__":
            sys.exit(main(sys.argv))
