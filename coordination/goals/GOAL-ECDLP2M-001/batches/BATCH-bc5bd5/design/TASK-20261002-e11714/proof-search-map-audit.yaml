        """EXP-NISTBIN-451dfa version 4, rule trace over synthetic run manifests (C-5).

        Serves RV3-4, RV3-5 and RV3-12 of DEC-20261002-353743 under the literal
        reading its ruling S-3 makes governing: the stopping (SR-1 to SR-6),
