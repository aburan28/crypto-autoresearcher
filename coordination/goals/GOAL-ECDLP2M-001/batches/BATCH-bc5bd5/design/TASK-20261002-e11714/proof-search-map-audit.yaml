        def kreading_row(n):
            row = {"n": n, "P_form": "PF-2"}
            best = {}
            for reading in K_READINGS:
                ordered = ordered_m(n, reading, "PF-2")
                (v1, m1), (v2, m2) = ordered[0], ordered[1]
                best[reading] = v1
                row[reading] = {"C_I": r4(v1), "m_star": m1, "runner_up_m": m2,
                                "runner_up_gap": r4(v2 - v1),
                                "memory_at_m_star": memory_at(n, m1, FIXTURE_DEGREE, reading),
                                "relation_store_at_runner_up": r4(k_exact(n, m2, reading))}
            row["move_ceiled_minus_MI1"] = r4(best["ceiled"] - best["MI-1"])
            row["direction"] = ("ceiled lower" if best["ceiled"] < best["MI-1"]
                                else "ceiled not lower")
            return row


        def ceiled_vs_mi1_cells():
            lower = equal = higher = 0
            equal_cells = []
            minima_lower = 0
            for n in CLAIM_A_DEGREES:
                for m in range(M_LO, min(M_HI, n) + 1):
                    c = stage1(n, m, "ceiled", "PF-2")
                    u = stage1(n, m, "MI-1", "PF-2")
                    if c < u:
                        lower += 1
                    elif c == u:
                        equal += 1
                        equal_cells.append([n, m])
                    else:
                        higher += 1
                if ordered_m(n, "ceiled", "PF-2")[0][0] < ordered_m(n, "MI-1", "PF-2")[0][0]:
                    minima_lower += 1
            return {"P_form": "PF-2", "cells": lower + equal + higher,
                    "ceiled_below_MI1": lower, "equal": equal,
                    "ceiled_above_MI1": higher, "equal_cells": equal_cells,
                    "per_degree_minima_ceiled_below_MI1": minima_lower,
                    "degrees": len(CLAIM_A_DEGREES)}


        def a_rows_571():
            n = N571
            wn = widths(n, FIXTURE_DEGREE)
            rows_b = r4(FIXTURE_DEGREE * math.log2(n))
            rows_m = r4(wn[FIXTURE_DEGREE])
            out = []
            for m in range(M_LO, M_HI + 1):
                a = {}
                for kr in K_READINGS:
                    for pf in P_FORMS:
                        a[(kr, pf)] = a_value(n, m, kr, pf)
                out.append({
                    "m": m,
