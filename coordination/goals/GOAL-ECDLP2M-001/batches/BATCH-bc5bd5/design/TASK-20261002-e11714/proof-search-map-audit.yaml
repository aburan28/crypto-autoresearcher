      successor_of: CB-2
      purpose: >-
        Allowed session computation C-4. The closed-form design figures of the
        contract's abstract model at their own parameter points, every printed
        time figure with its memory figure on the same printed line (RV3-1):
        the fixture points, the joint-convention memory, the k-reading table,
        A(571, m) under both k readings and both P forms with its relation
        store on every line, MI-2's consequence at 571, 283 and 359 with the
        C2 fixture under each form (DI-MI2), the per-step and cumulative
        M7-BIN crossovers per m (RV3-3), the per-m span (RV3-7), the one-k
        and P-form comparison counts of the threshold table (RV3-8, MI-2
        bias), the L-SPREAD scope check (RV3-10), the reachability table
        (RV3-11) and the F-J3-1 cell counts.
      rv3_items: [RV3-1, RV3-3, RV3-6, RV3-7, RV3-8, RV3-10, RV3-11, RV3-14 F-J3-1]
      reference_sha256: 1a8628e8787cec9fff06fa9cba809a82aaa07c250b6d606703ef4faef086a180
      utf8_bytes: 35366
      reference_source: allowed session computation C-1 (session_computations below)
      changed_after_C-1: false
      source: |
        """EXP-NISTBIN-451dfa version 4, closed-form design figures (C-4).

        Successor of the version-3 code block CB-2 (design_figures.py). It serves
        DEC-20261002-353743 RV3-1 (a memory figure on the same printed line as every
        time figure, the A(571, m) lines included), RV3-6 and DI-MI2 (the P-form
        choice MI-2: PF-1 P = 2^(m k - n)/m! and PF-2 P = 1 - exp(-2^(m k - n)/m!),
        at n = 571, 283 and 359, with the C2 fixture evaluated under each form),
        RV3-3 (the per-step crossover D_ps and the cumulative crossover D_cum of the
        M7-BIN reading against R-B, per m and k reading), RV3-7 (the per-m span),
        RV3-8 (the one-k comparison column), RV3-10 (the L-SPREAD scope check),
        RV3-11 (the reachability table) and F-J3-1 of RV3-14. Every number printed
