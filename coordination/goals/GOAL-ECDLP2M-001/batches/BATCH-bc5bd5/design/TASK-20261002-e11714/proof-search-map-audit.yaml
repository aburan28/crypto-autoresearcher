  audits:
    A1_bottleneck_and_baseline_fixture:
      bottleneck: >-
        The degree bound 4 in Semaev's per-solve estimate n^(4 omega), checked
        in this program only at n <= 21. It does NOT carry the whole 571 margin
        (D-8 S-4). At n = 571 one R-B degree step is 27.47 bits at omega 3 and
        multiplies the Macaulay rows by 571 (+9.16 bits; relation store
        unchanged at 2^47.58); omega from 3 to 2.376 is 22.86 bits at D = 4
        with no memory change (rows 2^36.63 or 2^32.04, store 2^47.58);
        block_n4w against macaulay4 is 26.75 bits, with block_n4w's rows
        2^36.63 and store 2^47.58 at m* = 12 against macaulay4's rows 2^44.72
        (N5 = 5139) and store 2^57.10 at m = t = 10 (DF-BOT, DF-JP).
      baseline_parameter_slice: >-
        D = 4, omega = 3, n = 571, m = t = 12, unceiled k (MI-1), the eq. (11)
        form of P (MI-2, PF-2), stage 1 only, cofactor charged - 186.307 (F1
        target) with Macaulay rows 2^36.63 (R-B) or 2^32.04 (R-M) and relation
        store 2^47.58 in the same sentence.
      reproduction: symbolic (L-EXT) and by fixture (F1 at 571 and 283 with F2 at every grid omega); CB-3 reproduces the fixture under PF-2 and under PF-1 (DF-MI2)
    A2_observation_collision:
      observable: the interval [D*_B(c, 3.0, m), D*_M(c, 3.0, m)] at m* = 12 and over the M-SET, read from the sign of the time-only margin against the corrected column
      collisions_found:
        - {id: OC-1, note: 'R-B and R-M equal at D = 4, about omega (log2 D! - log2 4!) apart elsewhere; resolved by the interval (P-S, scoped to D >= 4)'}
        - {id: OC-2, note: 'fake d-prime_F <= 4 against true degree 4; IR-1 accepts no degree input, IR-2 states the discharge (with H6 for any first fall degree, the U-3 disclosure, and refusal at another k or t)'}
        - {id: OC-3, note: 'the naive column and the coherent baseline disagree at 409, so a claim-(A) count is baseline-dependent (PTM-C); BR-1 admits only the pinned coherent reading, with the multi-match refusal'}
        - id: OC-4
          what: >-
            Among the instrument's own readings at D = 4 the fixture separates
            block_n4w 186.307 (m* 12; Macaulay rows 2^36.63 or 2^32.04,
            relation store 2^47.58), macaulay4 213.0618 (m* = t* = 10; rows
            2^44.72 = W(5139, 4), dense 2^89.45, relation store 2^57.10) and
            f4_std 226.8183 (m* = t* = 10; rows 2^49.31 in power form or
            2^44.72 in monomial form, relation store 2^57.10), and the ceiled
            k reading 181.7236 at m = 12 (rows 2^36.63 or 2^32.04, relation
            store 2^48).
          separating_condition: F1 identifies the reading; no collision remains among those.
        - id: OC-5
          what: >-
            Readings outside the restricted model (a sparse S_sp, a hybrid
            S_hyb, a block-size exponent other than R-B's, a different
            optimising m) pass F1 and F2; M7's direction is conditional and,
            for M7-BIN, stated in lemma form relative to D_cum.
          separating_condition: none inside this contract; resolved by the restricted-model option, every D* sentence scoped, the threshold handed as D*(m) over m
        - id: OC-6
          what: >-
            VERSION 4 (DI-MI2). The P form - PF-1 and PF-2 - is invisible to
            F1, because the fixture passes under both at MI-1 (DF-MI2), with
            the same Macaulay rows and relation store at both targets.
          separating_condition: F2 at 1e-9 bit separates them (CB-3 MI2_consequence move_exceeds_F2_tolerance); MI-2 declared and disclosed, C-PF1-T reported beside the table
    A3_quantifier_order:
      statement: >-
        FOR EACH c in {K-571, B-571}, R in {R-B, R-M}, the scored omega = 3 and
        each m in the M-SET, D*_R(c, 3.0, m) := min { D in {2, ..., 64} :
        mu_R(c, D, 3.0; m) > 0 }, and FOR ALL D in {2, ..., 64},
        mu_R(c, D, 3.0; m) < 0 iff D < D*_R(c, 3.0, m) (L-MON), conditional
        on H1, H5, H3 and H4, inside the restricted model, under MI-1 and MI-2.
      what_is_not_quantified: >-
        Nothing ranges over the true solving degree. E1 is an EXISTS-m
        statement with a degree measured at k = ceil(571/m), t = m, at most the
        R-B comparison entry minus 2; E2 needs EVERY m, BOTH readings, a true
        degree at least the comparison entry plus 1 and a named lower edge
        that H1 does not assert. Neither is reachable from this contract.
    A4_method_ceiling_and_nearby_object_control:
      strongest_certifiable_claim: >-
        D*(m) in the reconciled model, under its numbered readings (MI-1 and
        MI-2, with C-CEIL-T and C-PF1-T beside it), assuming H1 (with H5),
        inside the dense, fixed-omega, block-size-n model.
      ceiling: >-
        The method evaluates a cost formula and cannot certify a solving
        degree, a relation, a solve or any property of a curve; its D* is no
        sharper than the R-B/R-M reading interval and no wider than the
        restricted model. M5 and M8 each move D* one way only (M5 too early at
        in-domain omega; M8 only earlier); M7's direction is conditional, and
        for M7-BIN stated relative to D_cum. It cannot validate H1 (H1-C).
      nearby_object_control:
        - >-
          PTM-A, 283 - at D = 4, omega 3, MI-1 and PF-2, against the corrected
          column, +11.3961 (K-283) and +6.8237 (B-283) (version-1 sheet W5.6,
          cited), with Macaulay rows 2^32.58 (R-B) or 2^27.98 (R-M) and
          relation store 2^31.44 beside them. Gate G4.
        - >-
          PTM-B at 163 (rows 2^29.39, store 2^23.29), 233 (rows 2^31.46, store
          2^25.89) and 239 (ECC2-238 +21.5093 and ECC2K-238 +25.4598,
          version-2 sheet WC3, cited, with rows 2^31.60 and store 2^26.56
          beside them). Gate G4, MI-1 and PF-2 only.
        - >-
          Ceiled slack (O-J5-2) - under the ceiled reading C_I(283, 3.0) is
          141.5270 at m* = 10 with rows 2^32.58 or 2^27.98 and store 2^29
          beside it, which the contract discloses and never gates.
        - PTM-C excluded by BR-1, PTM-C-SLICE by C-BR1 (b) to (e), PTM-D by IR-1, PTM-F by the UNRESOLVED-row rule, all by rule (carried).
    A5_strictness_and_interfaces:
      strictness: not_applicable; no strict improvement is claimed; the contract prices an existing method
      interfaces: >-
        I1 L-INT (illustrative R-I to block_n4w); I2 L-EXT with L-ARG and
        L-SPREAD (instrument at D = 4 to R-B and R-M); I3 the rho column with
        C-PARAM and C-RHOCONV; I4 SN-1 and the delta shift with L-MONO,
        through pinned_coherent_row and multi_match_rule; I5 L-MONO (time-only
        D* to a memory-charged crossing); I6 IR-1 (whitelist) and IR-2 (any
        later measured degree to the D axis, with H6, the U-3 disclosure, the
        one-k comparison and the refusal at another k or t).
      lemmas_restated:
        - id: L-ARG
          statement: Under R-B and R-M the argmin over m of stage 1 is independent of D and omega and equals the D = 4 argmin (12 at 571, 9 at 283), under either P form.
          proof: >-
            C_R(n, D, omega) = min over m of A(n, m) + S_R(n, D, omega), and
            S_R depends on n, D and omega only. The runner-up gaps are 0.0402
            bit at 571 (m = 13, relation store 2^43.92 against 2^47.58, rows
            m-independent) and 0.1775 bit at 283 (m = 10, store 2^28.30 against
            2^31.44), D- and omega-invariant for the same reason, and the P form
            moves no argmin (CB-3 MI2_consequence). It fails for the macaulay4
            reading, whose variable count depends on m and t; that reading is
            not used for any D*.
        - id: L-EXT
          statement: C_B(n, 4, omega) = C_M(n, 4, omega) = C_I(n, omega) for every n and omega.
          proof: S_B(n, 4, omega) = 4 omega log2 n = S_M(n, 4, omega); the A part, under MI-1 and PF-2, is shared.
        - id: L-INT_version_4
          statement: >-
            With t* = m*, l = ceil(n/t*), nvar = t* l and the illustrative
            C_Ill(D, omega) = l + omega log2 binom(nvar, D):
            C_R(n, D, omega) - C_Ill(D, omega) = M1 + M2 + omega M3_R(D) + M4,
            and the frozen model and the illustrative surface both omit M5, M6
            and kappa; M7 and M8 lie outside the restricted model.
          multipliers:
            M1: relation-count exponent, k* - l = -0.4167 at 571 (version-1 sheet W6.4), with the relation store 2^47.58 under k* against 2^48 under l in the same item (a -0.42-bit store difference); D- and omega-independent
            M2: inverse per-attempt success probability, -log2 P = 28.8355 at 571 under PF-2 (log2 12! at that precision; CB-3 bottleneck_figures), with Macaulay rows 2^36.63 or 2^32.04 and relation store 2^47.58 unchanged beside it; D-independent; the P form is MI-2
            M3: per-solve normaliser M3_B(4) = 4 log2 571 - log2 binom(576, 4) = 4.5497 at 571 (M3a -0.0503, M3b 0.0151, M3c log2 4! = 4.5850; W6.6 to W6.9), the gap between the R-B rows 2^36.63 and the illustrative rows 2^32.08; D-dependent, carried by the readings
            M4: stage convention, 0 in the stage-1-only convention; in the total-cost convention below 2^-90 at 571 because stage 2 is 2 k* = 95.17 bits of sparse linear algebra on the relation matrix, whose memory is the relation store 2^47.58
            M5: row weight and sparsity, not modelled; its omission places D* too EARLY at in-domain omega (BATCH-7d29e8 red team J3-M5, attributed)
            M6: number of blocks per attempt, not modelled; omission optimistic for index calculus
            kappa: operation-unit conversion, 1 (not charged); direction unknown in general
            M7: >-
              block-size exponent above D = 4, not modelled. DIRECTION
              CONDITIONAL (m7_direction, two-clause lemma). For the binomial
              reading M7-BIN the direction is stated relative to the CUMULATIVE
              crossover D_cum(m), never the per-step crossover D_ps(m) - no
              later for R-B crossings X <= D_cum - 1, no earlier for
              X >= D_cum + 1 (and at X = D_cum when D_cum = 5), undetermined at
              X = D_cum when DELTA7(D_cum - 1) > 0 (m7_direction_lemma; CB-3
              M7_crossovers, NF-16). At m = 12 under MI-1, D_ps = 11 and
              D_cum = 19. The version-3 example sentence, which switched
              direction at the per-step degree, is withdrawn (RV3-3).
            M8: optimising m under H2; A(571, m) >= A(571, m*) at every m under MI-1 and PF-2, so D*_R(c, 3.0, m) <= D*_R(c, 3.0, m*); one-way, earlier (CB-3 M8_check)
          restricted_model_consequence: >-
            The contract takes the restricted-model option: M5, M7 and M8 are
            named outside the model and are not priced. M5 and M8 each have one
            stated direction; M7's direction is conditional and stated as a
            lemma, never as one way outside the range-restricted M7-BIN form.
          consequence: >-
            The proposal's route, R-FIT(D) = C_Ill(D) + M1 + M2 + omega M3(4),
            differs from C_B(D) by -omega (M3_B(D) - M3_B(4)), strictly negative
            for D > 4 and about 73 bits at D = 12, omega 3 (version-1 sheet
            W10, 73.1465 bits), where the readings' Macaulay rows are 2^109.89
            (R-B) against 2^80.92 (R-M) (DF-STEP); R-FIT is never used.
        - id: L-MON
          statement: For each c, R and omega the margin mu_R(c, D, omega) is strictly increasing in D on 2..64.
          proof: S_B increases by omega log2 n > 0 per degree; S_M by omega (W(n, D + 1) - W(n, D)) > 0; rho does not depend on D.
        - id: L-SPREAD_version_4
          statement: >-
            For D >= 4, C_B >= C_M with equality only at D = 4, hence
            D*_B <= D*_M at every (c, m) whose R-M crossing is at D >= 4. Below
            D = 4 the two readings are not ordered by this lemma (RV3-10).
          proof: >-
            C_B - C_M = omega (g(D) - g(4)) with g(D) = D log2 n - W(n, D), and
            g(D + 1) - g(D) >= log2(n (D + 1)/(n + 1)) > 0. Both 571 margins at
            m* = 12 are negative at D = 4 (93.4401 and 98.5188 bits below the
            corrected figures, with rows 2^36.63 or 2^32.04 and store 2^47.58
            in this sentence), so both scored crossings are at D >= 5. Over the
            threshold table, CB-3 L_SPREAD_scope_check finds one negative
            spread, at an entry whose R-M crossing lies below D = 4, and none
            at an entry with an R-M crossing at D >= 4.
        - id: L-UB
          statement: For every ordinary binary curve y^2 + xy = x^3 + a x^2 + b, b != 0, rho(c) <= 0.5 log2(pi (2^n + 1 + 2^(n/2 + 1))/8), so a positive margin against rho_ub implies one against rho(c).
          proof: The point (0, b^(1/2)) has order 2, so h >= 2; Hasse bounds h r; k >= 1. (Rho side only; no Macaulay matrix.)
        - id: L-MONO
          statement: >-
            Under H-SEMBIN-97ea23's product-minimum metric at kappa = 1, a
            positive time-only margin implies a coherent loss for index
            calculus whenever its working set is at least 6n bits; lowering
            the rho side by delta can turn a coherent win into a loss but never
            a loss into a win.
          proof: As the version-1 sheet states it (cited); a degree-4 Macaulay row set of an n-variable block already exceeds 6n bits for n >= 7.
        - id: L-ASM_version_4
          statement: Assembly. For each c, R and omega with G1 to G4 passed, the D* statement of the hypothesis holds in the model, under MI-1 and MI-2.
          proof: >-
            Per-attempt cost times inverse success probability, explicit:
            log2 stage 1 = k* (relations needed, k* = n/m under MI-1) +
            (-log2 P) (inverse per-attempt success probability, P in the eq.
            (11) form PF-2 under MI-2) + S_R(D, omega) (per-attempt solve
            cost). L-EXT with F1 and F2 anchors the model to the recorded row
            and to the instrument's P form, L-ARG fixes m*, L-MON makes D*
            unique, L-SPREAD orders the two readings at crossings at D >= 4.
            Read as a statement about the cost of a solve rather than about the
            model, the assembly needs H1 (an upper edge on the per-solve cost
            at the d_F4 solving degree), H5 (at every m of the M-SET under both
            k readings), H3 (PF-2) and H4; because H1 has no lower edge, no
            lower bound on any true cost follows from any D* (E2).

