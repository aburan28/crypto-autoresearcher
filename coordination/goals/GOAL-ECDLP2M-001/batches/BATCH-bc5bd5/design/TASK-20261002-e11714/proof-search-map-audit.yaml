        def variant(name, **changes):
            mf = valid_manifest()
            mf["name"] = name
            mf.update(changes)
            return mf


        def manifests():
            base = valid_manifest()
            no_gates = [a for a in REQUIRED_ARTIFACTS if a != "gates.json"]
            return [
                base,
                variant("I-1 gates.json absent (gates held in memory, never written)",
                        gates_json_present=False, gates_json_sha256=None,
                        raw_result_gates_json_sha256=None,
                        gates_json_written_at=None, artifacts_present=no_gates),
                variant("I-2 a D* table written before gates.json",
                        gates_json_written_at=base["stage_timestamps"]["7"][1],
                        dstar_table_written_at=base["stage_timestamps"]["6"][0]),
                variant("I-3 a ceiled figure inside a gated quantity (C-CEIL-A in G4's margins)",
                        diagnostic_columns_entering=[["C-CEIL-A", "G4"]],
                        cind_agreed=False),
                variant("I-4 V-11 firing (ceiled signs read by RT-4)",
                        diagnostic_columns_entering=[["C-CEIL-A", "RT-4"]]),
                variant("I-5 a read outside IR-1's whitelist",
                        files_opened=base["files_opened"] + [
                            "experiments/EXP-SEMBIN-992e73/runs/RUN-SEMBIN-a7a2f3/stdout.log"]),
                variant("I-6 a raised stage-order assertion (the run stops)",
                        stage_assertion_raised=True, dstar_table_present=False,
                        dstar_table_written_at=None, dstar_computed_stage=None),
                variant("I-7 a C-PF1-T value replacing an MI-1 entry of the threshold table",
                        diagnostic_columns_entering=[["C-PF1-T", "MI-1_table_entry"]]),
            ]


        def fired_rules(mf):
            fired = []
            gates = mf["gates"]
            all_passed = all(gates.get(g, False) for g in GATES)
            if not all_passed:
                fired.append("SR-1")
            if not mf["instrument_sha_ok"]:
                fired.append("SR-2")
            if not mf["cind_agreed"]:
                fired.append("SR-3")
            if mf["infra_failure"] and not (mf["stage_assertion_raised"] or mf["ir1_assertion_raised"]):
                fired.append("SR-4")
            if mf["changed_after_evaluation"]:
                fired.append("SR-5")
            if not mf["cb1_sha_ok"]:
                fired.append("SR-6")
            if not (mf["instrument_sha_ok"] and mf["instrument_untouched"]):
                fired.append("V-1")
            outside = [p for p in mf["files_opened"] if not ir1_admits(p, mf["run_dir"])]
            if (mf["d_from_input"] or mf["d_axis_column_labelled_degree_only"]
                    or outside or mf["ir1_assertion_raised"]):
                fired.append("V-2")
            if not mf["params_from_primary"]:
                fired.append("V-3")
            if mf["changed_after_evaluation"]:
                fired.append("V-4")
            if not mf["sembin_import_ok"]:
                fired.append("V-5")
            v6 = False
            if mf["dstar_table_present"]:
                if not mf["gates_json_present"] or not all_passed:
                    v6 = True
                elif mf["gates_json_written_at"] is None or mf["dstar_table_written_at"] < mf["gates_json_written_at"]:
                    v6 = True
                if mf["raw_result_gates_json_sha256"] is None or (
                        mf["gates_json_present"] and mf["raw_result_gates_json_sha256"] != mf["gates_json_sha256"]):
                    v6 = True
            if mf["dstar_computed_stage"] is not None and mf["dstar_computed_stage"] < 6:
                v6 = True
            if mf["stage_assertion_raised"]:
                v6 = True
            if v6:
                fired.append("V-6")
            if mf["illustrative_as_result"]:
                fired.append("V-7")
            if mf["results_outside_templates"]:
                fired.append("V-8")
            if mf["unscored_in_prediction"]:
                fired.append("V-9")
            if gates.get("G1", False) and not (mf["c_cover_pass"] and mf["stage5_list_equals_cb1_list"]):
                fired.append("V-10")
            if any(col in DIAGNOSTIC_COLUMNS and target in PROTECTED_TARGETS
                   for col, target in mf["diagnostic_columns_entering"]):
                fired.append("V-11")
            return fired, outside


        def protocol_success(mf, fired, version):
            reasons = []
            for rule in ("SR-2", "SR-3", "SR-6"):
                if rule in fired:
                    reasons.append(rule + " fired")
            if not all(mf["gates"].get(g, False) for g in GATES):
                reasons.append("a gate G1 to G4 did not pass")
            if not mf["cind_agreed"]:
                reasons.append("C-IND did not agree")
            missing = [a for a in REQUIRED_ARTIFACTS if a not in mf["artifacts_present"]]
            if missing:
                reasons.append("required artifact missing: " + ", ".join(missing))
            if version == 4:
                v_rules = [r for r in fired if r.startswith("V-")]
                if v_rules:
                    reasons.append("invalidation rule fired: " + ", ".join(v_rules))
            return ("VALID" if not reasons else "INVALID"), reasons


        def trace():
            out = []
            for mf in manifests():
                fired, outside = fired_rules(mf)
                v4, v4_reasons = protocol_success(mf, fired, 4)
                v3, _ = protocol_success(mf, fired, 3)
                out.append({"manifest": mf["name"], "fired": fired,
                            "reads_outside_IR1_whitelist": outside,
                            "protocol_success_version_4": v4,
                            "version_4_reasons": v4_reasons,
                            "protocol_success_version_3_text_for_contrast": v3,
                            "stopped_as_failed_infrastructure": "SR-4" in fired})
            return out


        def ir1_audit():
            mf = valid_manifest()
            rows = []
            for rule, path in sorted(mf["reads_required_by"].items()):
                rows.append({"required_by": rule, "path": path,
                             "admitted_by_IR1_version_4": ir1_admits(path, mf["run_dir"])})
            return rows


        def main():
            result = {"block": "CB-4 rule_trace (allowed session computation C-5)",
                      "label": "RULE TRACES over synthetic manifests; no driver, no run, no result",
                      "G2_from_closed_forms_passes": g2_from_closed_forms(),
                      "ir1_audit_of_required_reads": ir1_audit(),
                      "trace": trace()}
            for key, value in result.items():
                if isinstance(value, list):
                    print(json.dumps(key) + ":")
                    for item in value:
                        print("  " + json.dumps(item))
                else:
                    print(json.dumps(key) + ": " + json.dumps(value))
            return 0


        if __name__ == "__main__":
            sys.exit(main())

