                    "A_MI1_PF1": r4(a[("MI-1", "PF-1")]),
                    "A_ceiled_PF1": r4(a[("ceiled", "PF-1")]),
                    "ceiled_minus_MI1_PF2": r4(a[("ceiled", "PF-2")] - a[("MI-1", "PF-2")]),
                    "ceiled_minus_MI1_PF1": r4(a[("ceiled", "PF-1")] - a[("MI-1", "PF-1")]),
                    "PF2_minus_PF1_MI1": sci(pf_gap(log2_x(n, m, "MI-1"))),
                    "PF2_minus_PF1_ceiled": sci(pf_gap(log2_x(n, m, "ceiled"))),
