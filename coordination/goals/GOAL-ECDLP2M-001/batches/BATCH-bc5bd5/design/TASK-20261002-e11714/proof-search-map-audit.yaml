        def r4(x):
            return round(float(x), 4)


        def r7(x):
            return round(float(x), 7)


        def sci(x):
            return float("%.4e" % float(x))


        def widths(nvars, d_max):
            """[W(nvars, 0), ..., W(nvars, d_max)] with W(N, D) = log2 sum_{d<=D} binom(N, d)."""
            out = []
            total = 0
            for d in range(d_max + 1):
                total += math.comb(nvars, d)
                out.append(math.log2(total))
            return out


        def log2_binom(nvars, degree):
            return math.log2(math.comb(nvars, degree))


        def k_exact(n, m, reading):
            """k = n/m under MI-1 (an exact rational) or k = ceil(n/m) (ceiled)."""
            if reading == "MI-1":
                return Fraction(n, m)
            if reading == "ceiled":
                return Fraction(-(-n // m))
            raise ValueError("unknown k reading %r" % (reading,))


        def log2_x(n, m, reading):
            """log2 of x = 2^(m k - n) / m!, at chain length t = m."""
            k = k_exact(n, m, reading)
            return float(m * k - n) - math.log2(math.factorial(m))


        def pf_gap(lx):
            """log2(x / (1 - exp(-x))) >= 0 for x = 2^lx: the -log2 P of PF-2 minus that of PF-1."""
            x = 2.0 ** lx
            if x < 1.0e-6:
                f = x / 2.0 + x * x / 12.0
            else:
                f = x / (-math.expm1(-x)) - 1.0
            return math.log1p(f) / math.log(2.0)


        def neg_log2_p(n, m, reading, form):
            """-log2 P(n, m, m, k) under PF-1 (first-order form) or PF-2 (eq. (11) form)."""
            lx = log2_x(n, m, reading)
            if form == "PF-1":
                return -lx
            if form == "PF-2":
                return -lx + pf_gap(lx)
            raise ValueError("unknown P form %r" % (form,))


        def a_value(n, m, reading, form):
            """A(n, m) = k - log2 P(n, m, m, k)."""
            return float(k_exact(n, m, reading)) + neg_log2_p(n, m, reading, form)


        def stage1(n, m, reading, form, omega=OMEGA, degree=FIXTURE_DEGREE):
            """Stage 1 at t = m under block_n4w: A(n, m) + degree * omega * log2 n."""
            return a_value(n, m, reading, form) + degree * omega * math.log2(n)


        def ordered_m(n, reading, form):
            """(stage-1 value, m) over m = 2..min(30, n), ascending by value, ties to
            the lower m: the first entry is the first minimum over ascending m."""
            vals = [(stage1(n, m, reading, form), m) for m in range(M_LO, min(M_HI, n) + 1)]
            return sorted(vals, key=lambda vm: (vm[0], vm[1]))


        def memory_at(n, m, degree, reading):
            """MR_B, MR_M, MR_C8 (nvar = m ceil(n/m)), dense entries and the
            relation store log2(2^k) = k at the point (n, m, t = m, D, k reading)."""
            nvar = m * (-(-n // m))
            mr_b = degree * math.log2(n)
            mr_m = widths(n, degree)[degree]
            mr_c8 = log2_binom(nvar, degree)
            return {"MR_B": r4(mr_b), "MR_M": r4(mr_m), "MR_C8": r4(mr_c8),
                    "nvar_C8": nvar, "dense_B": r4(2 * mr_b),
                    "dense_M": r4(2 * mr_m), "dense_C8": r4(2 * mr_c8),
                    "relation_store": r4(k_exact(n, m, reading))}


        def hasse(h, r, n):
            """h r in [2^n + 1 - 2^(n/2 + 1), 2^n + 1 + 2^(n/2 + 1)], exactly."""
            dev = h * r - (2 ** n + 1)
            return dev * dev <= 4 * 2 ** n


        def read_primary(repo):
            path = os.path.join(repo, *FIPS_TEXT.split("/"))
            with open(path, "rb") as fh:
                raw = fh.read()
            with open(path + ".sha256", encoding="utf-8") as fh:
                pin_tokens = [t.lower() for t in fh.read().split()]
            digest = hashlib.sha256(raw).hexdigest()
            flat = "".join(raw.decode("utf-8").split())
            return digest, digest in pin_tokens, flat


        def rho_571(repo):
            digest, pin_ok, flat = read_primary(repo)
            printable = {"fips_text_sha256": digest, "fips_pin_matches": pin_ok,
                         "note": "rho side: no Macaulay matrix; the distinguished-point store is uncharged (H4, kappa = 1)"}
            exact = {}
            for label, r_dec, k_c, h in CURVES_571:
                r = int(r_dec)
                rho = 0.5 * (math.log2(math.pi) + math.log2(r) - math.log2(4 * k_c))
                exact[label] = rho
                printable[label] = {"r_found_in_primary_text": r_dec in flat,
                                    "r_bit_length": r.bit_length(), "h": h, "k_c": k_c,
                                    "h_r_in_hasse_interval": hasse(h, r, N571),
                                    "log2_r": r7(math.log2(r)), "rho": r7(rho),
                                    "carried_rho": CARRIED_RHO[label],
                                    "rho_minus_carried": sci(rho - CARRIED_RHO[label])}
            return printable, exact


