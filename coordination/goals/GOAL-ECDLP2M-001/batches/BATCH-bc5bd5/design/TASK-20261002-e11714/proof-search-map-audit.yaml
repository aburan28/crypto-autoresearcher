    definitions: >-
      DELTA7(D; 571, m) = [W(N5, D) - W(N5, 4)] - (D - 4) log2 571 at t = m,
      N5 = m k + (m - 2) 571 under the k reading. PER-STEP CROSSOVER D_ps(m),
      the least D in 5..64 with W(N5, D) - W(N5, D - 1) < log2 571.
      CUMULATIVE CROSSOVER D_cum(m), the least D in 5..64 with DELTA7 < 0.
      The two are different quantities and are never used for each other.
    lemma: >-
      W(N5, D) is concave in D, so DELTA7 rises up to D_ps - 1, falls from
      D_ps on and, once negative, stays negative. At an R-B crossing
      X = D*_B >= 5: no later for X <= D_cum - 1 (DELTA7(X) >= 0, clause (a)
      of m7_direction); no earlier for X >= D_cum + 1 (DELTA7(X - 1) < 0,
      clause (b)), and at X = D_cum when D_cum = 5; undetermined at
      X = D_cum when DELTA7(D_cum - 1) > 0. On [D_ps, D_cum - 1] the per-step
      growth is already below R-B's while the cumulative cost is above it,
      so the direction there is no later, not later.
    computed: >-
      Every D_ps and D_cum is CB-3 M7_crossovers output (NF-16), concavity
      confirmed on every line; the 58 actual R-B crossings of the in-force
      table fall where the lemma says, with no violation (M7_actual_crossings,
      NF-17).
    rd6_search_corrected: >-
      The version-3 rd6_search and L-INT M7 example ("places D* later for
      crossings above" the degree where the count stops growing faster) used
      the per-step degree where the cumulative one is required; the
      BATCH-f435ab red team's counterexample at m = 8 (TASK-20261002-496923
      cheapest_falsification, attributed) is a crossing on [D_ps, D_cum - 1].
      Version 4 replaces every such sentence by the lemma form. S-P4 searched
      the version-4 specification, the hypothesis and this sheet (Grep) for
      "later", "earlier", "one way", "one-way", "only move" and "can only",
      and found each in-force use beside M7 either in the conditional
      statement, the lemma form or the attributed range as qualified; the
      other uses concern M5 or M8 (one-way by their own arguments), the MI-1
      and MI-2 biases, or a later measurement. The version-2 and version-3
      hypothesis sentences that stated a one-way or high-degree M7 direction
      are superseded (in_force_index). The worksheet states no M7 direction.

