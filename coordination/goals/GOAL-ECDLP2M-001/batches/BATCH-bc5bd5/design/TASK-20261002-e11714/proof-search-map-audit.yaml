            "code/surface.py", "code/independent_arith.py",
            "code/certicom_coverage.py", "code/test_rules.py",
            "gates.json", "raw-result.json", "independent-arithmetic.json",
            "manifest.yaml", "stdout.log", "stderr.log",
            "artifact-digests.json", "RESULTS.md",
        )
        DIAGNOSTIC_COLUMNS = ("C-CEIL-A", "C-CEIL-T", "C-CEIL-D", "C-PF1-T")
        PROTECTED_TARGETS = ("G4", "RT-4", "class", "scored_cell", "outcome_class",
                             "MI-1_table_entry")
        FIXTURE_TARGETS = ((571, "186.307", 12), (283, "147.649", 9))


        def stage1_closed_form(n, m):
            """Stage 1 at t = m, block_n4w, omega 3, D = 4, MI-1, PF-2 (eq. (11))."""
            k = Fraction(n, m)
            lx = float(m * k - n) - math.log2(math.factorial(m))
            neg_log2_p = -math.log2(-math.expm1(-(2.0 ** lx)))
            return float(k) + neg_log2_p + 4 * 3.0 * math.log2(n)


        def g2_from_closed_forms():
            ok = True
            for n, target, m_target in FIXTURE_TARGETS:
                vals = sorted(((stage1_closed_form(n, m), m) for m in range(2, 31)),
                              key=lambda vm: (vm[0], vm[1]))
                value, m_star = vals[0]
                ok = ok and abs(value - float(target)) <= 5.0e-4 and m_star == m_target
            return ok


        def under_runs(path):
            parts = path.split("/")
            return len(parts) >= 3 and parts[0] == "experiments" and parts[2] == "runs"


        def ir1_admits(path, run_dir):
            """IR-1 version 4, literally: a file under any experiments/*/runs/
            directory may be opened only if it is in the run's own directory or on
            the IR-1 whitelist."""
            if not under_runs(path):
                return True
            if path.startswith(run_dir):
                return True
            if path in IR1_WHITELIST_FILES:
                return True
            return any(path.startswith(d) for d in IR1_WHITELIST_DIRS)


        def gates_json_text(gates):
            return json.dumps({"gates": gates}, sort_keys=True)


        def valid_manifest():
            gates = {"G1": True, "G2": g2_from_closed_forms(), "G3": True, "G4": True}
            gtext = gates_json_text(gates)
            digest = hashlib.sha256(gtext.encode("utf-8")).hexdigest()
            stages = {str(s): [10 * s, 10 * s + 5] for s in range(9)}
            return {
                "name": "V valid run built from the closed forms",
                "run_dir": RUN_DIR,
                "instrument_sha_ok": True, "instrument_untouched": True,
                "cb1_sha_ok": True, "cind_agreed": True,
                "infra_failure": False, "stage_assertion_raised": False,
                "ir1_assertion_raised": False, "changed_after_evaluation": False,
                "d_from_input": False, "d_axis_column_labelled_degree_only": False,
                "files_opened": [
                    "experiments/EXP-SEMBIN-81dc96/code/joint_balance.py",
                    "inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md",
