  frozen_c2_fixture:
    status: >-
      CARRIED FOR VERSION 4, identical in every number to the version-3 and
      version-2 contracts' and to the canonical block of the version-3 sheet.
      The contract's frozen_c2_fixture names this block as its canonical copy.
      Identification, tolerance, pass rule and gate are unchanged. Version 4
      adds the MI-2 evaluation (F1 under PF-2, the instrument's form; the
      fixture passes under PF-1 too) and puts the memory in the same sentence
      as each target (RV3-1, RV3-2); no number, path, digest, tolerance, rule
      or gate condition changes (constants_delta CD-04, this sheet's own
      entry; O-RT-07 answered).
    stated_before_any_evaluation: true
    id: F1
    model:
      path: experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
      sha256: 95a069364e2cacea9de914694fb5cdb1c886929626144edeb8835fced8698f46
      sha256_provenance: Recorded by RUN-SEMBIN-a7a2f3 (raw-result.json, key instrument.sha256). Not hashed by any design session; Stage 0 re-hashes it and stops on a mismatch.
      call_convention: >-
        spec = importlib.util.spec_from_file_location("jb", PATH); jb =
        importlib.util.module_from_spec(spec); sys.modules["jb"] = jb;
        spec.loader.exec_module(jb). Model = jb.Model(solve="block_n4w",
        charge_cofactor=True), every other field at its frozen default
        (k_reading "unceiled", omega 3.0, omega_prime 2.0, degree 4, yield_law
        "eq11"). Value = the first minimum, over m = 2, 3, ..., 30 in ascending
        order with strict less-than, of jb.stage_costs(n, m, m, Model)[0]
        (stage 1 only, t = m), which is curve_table.py's stage1_only_min(n,
        PAPER, t_eq_m=True, m_hi=30) exactly.
      model_identification: >-
        The k-rounding reading is the numbered choice MI-1 and the P form the
        numbered choice MI-2 (PF-2, the instrument's yield_law "eq11"). F1
        identifies the frozen instrument's reading under MI-1 and PF-2, not a
        model the published text alone determines. Under the ceiled reading the
        pass rule FAILS at both targets under either P form (CB-3 MI2_fixture:
        at 571 C_I 175.1383 at m* = 15 with Macaulay rows 2^36.63 or 2^32.04
        and relation store 2^39; at 283 C_I 141.5270 at m* = 10 with rows
        2^32.58 or 2^27.98 and relation store 2^29). Under PF-1 at MI-1 it
        PASSES at both (571 slack 4.5179e-4 bit with rows 2^36.63 or 2^32.04
        and relation store 2^47.58; 283 slack 2.3622e-5 bit with rows 2^32.58
        or 2^27.98 and relation store 2^31.44), so F1 does not identify MI-2;
        F2 ties the surface's P form to the instrument's.
    target:
      row: EXP-SEMBIN-992e73, RUN-SEMBIN-a7a2f3, raw-result.json, rows entry n = 571, block paper_convention_t_eq_m_stage1_only
      values: {log2_cost: 186.307, m_star: 12, t_star: 12, memory_beside: 'Macaulay rows 2^36.63 (R-B form) or 2^32.04 (R-M form) or 2^32.08 (C8 form, nvar 576); dense entries 2^73.26, 2^64.08 or 2^64.16; relation store 2^47.58 (CB-3 fixture_points_MI1_PF2)'}
      source_record_status: >-
        DEC-20260918-4b7e21 ITEM-1: RUN-SEMBIN-a7a2f3 is a reproduction target
        and a design artifact, not evidence. RUN-SEMBIN-aa5161 (approved)
        records the same value 186.307 at m = 12, beside which the model's
        memory is Macaulay rows 2^36.63 or 2^32.04 and relation store 2^47.58.
      secondary_target:
        row: n = 283 at the same convention (RUN-SEMBIN-a7a2f3)
        values: {log2_cost: 147.649, m_star: 9, t_star: 9, memory_beside: 'Macaulay rows 2^32.58 (R-B form) or 2^27.98 (R-M form) or 2^28.06 (C8 form, nvar 288); dense entries 2^65.16, 2^55.97 or 2^56.13; relation store 2^31.44 (CB-3 fixture_points_MI1_PF2)'}
    tolerance:
      value: 5.0e-4
      unit: bit, absolute, on log2 cost, inclusive
      argmin: exact on m* and t*
      basis: >-
        The target is recorded to three decimals, so a correct evaluation must
        round to it; 5.0e-4 is that rounding half-width, and the instrument is
        deterministic closed-form arithmetic, so nothing justifies more slack.
        Not revisable after any evaluation (the contract's V-4).
      margin_note: >-
        CB-3 MI2_fixture (MI-1, PF-2) gives C_I(571, 3.0) = 186.3069518 at
        m* = 12, a distance of 4.8207e-5 bit from the target and a slack of
        4.5179e-4 bit, with Macaulay rows 2^36.63 or 2^32.04 and relation store
        2^47.58 beside it; and C_I(283, 3.0) = 147.6494784 at m* = 9, a distance
        of 4.7837e-4 bit and a slack of 2.1634e-5 bit, with rows 2^32.58 or
        2^27.98 and relation store 2^31.44 beside it. The 283 closeness is an
        artifact of the three-decimal grid.
    pass_rule: >-
      PASS iff |C_I(571, 3.0) - 186.307| <= 5.0e-4 with argmin m = t = 12 (beside
      this target, not part of the rule, Macaulay rows 2^36.63 or 2^32.04 and
      relation store 2^47.58), AND |C_I(283, 3.0) - 147.649| <= 5.0e-4 with
      argmin m = t = 9 (beside this target, not part of the rule, rows 2^32.58
      or 2^27.98 and relation store 2^31.44). Anything else is FAIL.
      (Unchanged.)
    gate: >-
      G2. On FAIL the run stops (SR-1), gates.json records the failure, and
      nothing after Stage 2 is computed: no extension identity, no claim-(A)
      count, no surface, NO D* and no threshold table. (Unchanged.)
    extension_identities: F2, unchanged (the contract's procedure stage 3); VERSION 4, F2 is what ties the surface's P form to the instrument's PF-2 (CB-3 MI2_consequence move_exceeds_F2_tolerance)
    interface_check: F3, unchanged (lemma L-INT numerical check; failure withdraws R-M and the illustrative figures, falsifies nothing)
    margins_against_both_corrected_rows:
      note: >-
        DESIGN FIGURES at the fixture point D = 4, omega = 3, under Assumption
        1's degree; the fixture point of a model, NOT a verdict on the 571
        cell (CB-3 bottleneck_figures, fixture_point_margins).
      K-571: {time_log2_cost: 186.3070, corrected_rho_log2: 279.7471, margin_bits: -93.4401, memory: 'Macaulay rows 2^36.63 (R-B) or 2^32.04 (R-M); dense entries 2^73.26 or 2^64.08; relation store 2^47.58'}
      B-571: {time_log2_cost: 186.3070, corrected_rho_log2: 284.8257, margin_bits: -98.5188, memory: 'Macaulay rows 2^36.63 (R-B) or 2^32.04 (R-M); dense entries 2^73.26 or 2^64.08; relation store 2^47.58'}
    what_the_fixture_does_see: >-
      RUN-SEMBIN-aa5161 records at n = 571, total-cost joint convention:
      186.307 for block_n4w (m* = t* = 12; Macaulay rows 2^36.63 under R-B or
      2^32.04 under R-M, relation store 2^47.58); 213.0618 for macaulay4 (m* =
      t* = 10 under MI-1; N5 = 5139 Boolean variables of system (5), Macaulay
