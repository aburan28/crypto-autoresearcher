        time figures, the bottleneck figures) carries a memory figure for the
        same object on the same line (Macaulay rows MR_B, MR_M, MR_C8 or
        MR_MAC, dense entries, relation store); lines without a time figure
        print counts, flags, degrees, variable counts or memory only (RV3-1).
        Readings, all design figures: rho_571 confirms the FIPS pin and that
        both transcribed base-point orders occur in the primary text, with h r
        in the Hasse interval, and agrees with the carried rho column to below
        1e-4 bit (a rho figure with no Macaulay matrix; the distinguished-point
        store is uncharged under H4 with kappa = 1). MI2_fixture shows the
        frozen C2 fixture passing under PF-1 and under PF-2 at MI-1 and failing
        under both at the ceiled reading, so the fixture does not identify
        MI-2 (DI-MI2). MI2_direction shows PF-1 below PF-2 in A at every one of
        the claim-(A) cells under both k readings. MI2_consequence shows no
        argmin change at 571, 283 or 359 under either k reading, and a move
        beyond the F2 tolerance at every line. scored_cells and
        reachability_table give the four scored cells at m* = 12 and the class
        flags; only K1_near is reachable, under all four readings of
        reachability_by_reading (RV3-11; a design figure, never a finding).
        threshold_table_comparisons gives the C-CEIL-T and C-PF1-T counts
        stated in the contract's MI-1 and MI-2 bias sentences.
        threshold_table_tokens shows the "D* <= 2" token only at m = 2 and no
        "no crossing" token. L_SPREAD_scope_check shows one negative spread,
        at an entry whose R-M crossing lies below D = 4 (RV3-10). M7_crossovers
        prints D_ps and D_cum per m and k reading, with concavity confirmed on
        every line, and M7_actual_crossings shows no lemma violation (RV3-3).
        per_m_span prints the span per m (RV3-7). Every value is mapped to its
        NF item in the worksheet.
      C-5: >-
        Exit 0, empty stderr. The closed forms pass G2. IR-1's version-4
        whitelist admits every read SN-1, RS-1, RS-2, C-XDEG and the
        stage-order assertion require (RV3-4). The valid synthetic run reads
        VALID; I-1 (gates.json absent) fires V-6 and reads INVALID with the
        missing artifact named (RV3-12); I-2 (a D* table written before
        gates.json by the stage timestamps) fires V-6 and reads INVALID, where
        the version-3 text read VALID; I-3 (a ceiled figure in G4's margins)
        fires SR-3 and V-11; I-4 (ceiled signs read by RT-4) fires V-11, VALID
        under version 3; I-5 (a read outside the whitelist) fires V-2, VALID
        under version 3; I-6 (a raised stage-order assertion) fires V-6 and is
        not recorded as failed_infrastructure (4cb903 OBS-3, SR-4); I-7 (a
        C-PF1-T value replacing an in-force entry) fires V-11. protocol_success
        reads INVALID whenever any V rule fired (RV3-5). A trace over synthetic
        manifests, never a run.

