  structural_duty:
    recurring_classes:
      - class: C8 memory beside time
        rounds: >-
          broke in the version-2, version-3 and version-4 rounds, each time in
          a place the previous remedy did not reach (a carried hypothesis
          field; the spec's fixture block, a version_3 field and a log; now the
          audit sheet's own c8_sweep entries and one new spec summary
          sentence)
