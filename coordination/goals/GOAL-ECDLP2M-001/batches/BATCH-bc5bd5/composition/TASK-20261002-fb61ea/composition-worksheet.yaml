          the in-force index complete. DI-INDEX worked for the hypothesis.
      - class: a remedy reaching one file but not its mirror
        rounds: >-
          version 3 (the RD-6 remedy missed the audit's L-INT example) and
          version 4 (the RV3-3 remedy reached the specification, not the
          hypothesis sentence that mirrors it)
      - class: literal-reading conflicts among operative rules
        rounds: >-
          version 3 (O-RT-01, O-RT-02) and version 4 (IR-1 sentence 2, carried
          since version 2)
    local_or_structural: >-
      STRUCTURAL. Each round fixes the instances the previous review listed,
      and the next review finds the same class elsewhere. The common cause is
      that the same content is restated in many places across four files and
      four hypothesis layers (summaries, sweeps, indices, mirrored sentences)
      and checked by hand. A same-form version 5 would repeat that pattern.
    structural_remedy: >-
      (1) The superseding record form, form (ii) of DEC-20261002-0983f2 and
      DEC-20261002-3ba55f R-FORM, using the reserved H-NISTBIN-e456ff and
      EXP-NISTBIN-8d210c (each re-checked with tools/allocate_id.py --check):
      a single-layer hypothesis that states heuristics, predictions and
      falsifiers and refers to the specification's definitions by field path
      instead of restating them, so one sentence exists once. (2) Three
      mechanical pre-review gates, each a committed import-safe code block
      run by the session as an allowed computation on all the files the
      producer writes, before the snapshot, with its output embedded and a
      clean result as a gate condition: a C8 sweep implementing the frozen
      in-force text rule (no time figure WITHOUT memory, numerals in index
      text counted); a mirrored-sentence identity check over every sentence
      that both the specification and the hypothesis state; a clause-by-clause
      literal trace of every operative rule against every file and value it
      consumes. (3) Before either, the zero-run read of the committed coherent
      rows that may already fix P-A (OBJ-RT-J4-1), because overturn condition
      (3) of the prior is now partly met.

