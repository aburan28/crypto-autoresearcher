              return total


          def is_prime(n):
              if n < 2:
                  return False
              for p in _MR_BASES:
                  if n % p == 0:
                      return n == p
              dd, s = n - 1, 0
              while dd % 2 == 0:
                  dd //= 2
                  s += 1
              for a in _MR_BASES:
                  x = pow(a, dd, n)
                  if x in (1, n - 1):
