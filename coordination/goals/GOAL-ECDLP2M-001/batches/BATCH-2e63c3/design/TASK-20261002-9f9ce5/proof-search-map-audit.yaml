  # ---------------------------------------------------------------------------
  lemma_decomposition:
    note: >-
      Proofs of the lemmas named in H-BINSTD-0dd2ce. Notation: K = F_(2^N),
      N = 16k, k odd prime; c a divisor of N, q = 2^c, n = N/c; sigma the
      2^c-power Frobenius on K; F_(2^(d_AB)) the smallest field containing A, B
      (d_AB = 16 on the five rows, computed); E in Artin-Schreier form
      y^2 + y = x + A + B/x^2 (from Y = x y in Y^2 + xY = x^3 + A x^2 + B), in
      which y -> y + 1 is the negation map. pi denotes the 2^16-power Frobenius
      endomorphism of E (E is defined over F_(2^16)).
    L1:
      responsibility: correctness
      proof: >-
        sigma^i fixes A and B iff it fixes every element of F_(2^(d_AB)) iff
        2^(c i) is a power of 2^(d_AB) on that field iff d_AB divides c i iff
        (d_AB / gcd(c, d_AB)) divides i. With d_AB = 16 and c dividing 16 the
        period is p = 16/c and n/p = (16k/c)/(16/c) = k. Census: period equals
        the formula on every cell of every row (C-3).
    L2:
      responsibility: correctness
      statement: >-
        Assume OB-1: the cover's function field F' over K(x) is generated by y_0,
        ..., y_(n-1), y_i a root of T^2 + T = R_i with R_i = sigma^i(R_0), and an
        automorphism sigma' of F' extends sigma (fixing x) with sigma'(y_i) =
        y_(i+1), indices mod n, and sigma'^n = id. If sigma^p fixes R_0 and n/p is
        odd, then sigma'^p fixes every y_i.
      proof: >-
        R_0 has coefficients in F_(2^16) (built from A, B and their square roots),
        and sigma^p is the identity on F_(2^16) by L1, so R_p = R_0. Then y_p and
        y_0 are roots in the field F' of the same polynomial T^2 + T - R_0, so
        e := y_p + y_0 satisfies e^2 + e = 0, i.e. e lies in F_2. Applying
        sigma'^i (which fixes F_2) gives y_(p+i) + y_i = e for every i, so
        y_(rp) = y_0 + r e for every r >= 0. At r = n/p = k this reads y_n =
        y_0 + k e, while y_n = sigma'^n(y_0) = y_0. Hence k e = 0 in F_2, and k
        odd gives e = 0, so y_(i+p) = y_i for all i.
      remark_where_it_breaks: >-
        If sigma' existed only with sigma'^n != id, the last step would read
        y_0 + k e = y_0 + 1 and force e = 1; the conjugate maps would then
        alternate in sign and the inner sum of L3 would be the alternating sum
        sum over r of (-lambda)^r, which is 2/(1 + lambda) times P on the l-part
        and is not zero. This is the exact point where OB-1 carries the claim.
    L3:
      responsibility: correctness
      statement: phi(P) = sum over j < p of Con_j(sigma^j(Tr P)), Tr P = sum over r < k of pi^r(P).
      proof: >-
        By definition (OB-1) phi(P) = sum over i < n of sigma'^i(Con_0(P - O)),
        where Con_0 is the conorm along K(x, y_0) = K(E) inside F'. Transport of
        structure gives sigma'^i(Con_0(D)) = Con_i(sigma^i D), with Con_i the
        conorm along K(x, y_i) = K(E^(sigma^i)). By L2, K(x, y_(i+p)) = K(x, y_i)
        with the same generator, and E^(sigma^(i+p)) = E^(sigma^i), so Con_(i+p) =
        Con_i. Writing i = j + r p with j < p and r < k, and using that each Con_j
        is a homomorphism on degree-zero classes, phi(P) = sum over j of
        Con_j(sigma^j(sum over r of sigma^(rp) P)). On points of E, sigma^p acts
        as pi, so the inner sum is Tr P.
    L4:
      responsibility: correctness
      proof: >-
        pi^k is the identity on E(K), so pi(Tr P) = Tr P and Tr P lies in
        E(F_(2^16)), a group of order h. If P has order l, Tr P has order dividing
        l and h; gcd(l, h) = 1 (computed) gives Tr P = O. Eigenvalue form: #E(K) =
        h l with l > h prime, so E(K)[l] is cyclic of order l and pi-stable; pi
        acts by some lambda in F_l with lambda^k = 1, and lambda != 1 because
        lambda = 1 would put P in E(F_(2^16)); then sum over r < k of lambda^r =
        (lambda^k - 1)/(lambda - 1) = 0.
    L5:
      responsibility: interface
      statement: >-
        The GHS map of MMT Theorem 1 is the norm-of-conorm phi of L3 on a cover
        with the index-shift structure of L2. This is OB-1 and is NOT proved here.
      status: open (IMP-3); see H-BINSTD-0dd2ce open_obligations OB-1 and OB-2
    L6:
      responsibility: scope
      proof: >-
        For c = jk with j dividing 8, gcd(c, 16) = j (k odd), so p = 16/j = n and
        n/p = 1: the grouping is trivial, Tr is the identity, and the field the
        trace lands in is F_(2^(cp)) = F_(2^(16k)) = K, whose point group is
        divisible by l. L4's hypothesis fails and nothing is concluded. This is
        the PTM-B failure signature.
    MAIN_C1:
      responsibility: assembly
      proof: L1, L2, L3 and L4 under L5 give phi(P) = sum over j of Con_j(sigma^j(O)) = 0 for P in E(K)[l].
    baseline_case_c_16: >-
      c = 16 gives p = 1, n = k: y_1 = y_0, the cover is K(E) itself (m = 1, g = 1)
      and phi is Tr; the conclusion is L4 directly. Census: m = 1 on BASELINE_C16
      of every row.
    M1:
      responsibility: correctness
      proof: >-
        Reading note CHECK-4 (derivation from MMT Theorem 5(i), retrieved): for
        n = 2^e, x^n - 1 = (x + 1)^n over F_2, Ord_b = (x + 1)^(j_0) with j_0 >= 1
        for b != 0, and m(b) = j_0; squaring commutes with sigma, so the levels of
        b and b^(1/2) agree. More generally (internal): if Ord_b is a power of
        x + 1 then no odd-size subset of the orbit sums to zero, so the vectors
        (1, sigma^i(b)^(1/2)) have the same rank as the sigma^i(b)^(1/2). C-3
        prints conv_equal True on every deployed cell.
    M2:
      responsibility: size
      proof: >-
        Reading note CHECK-5 (MMT Corollary 14 and Remark 24, retrieved): on c =
        jk, n = 16/j, if m <= n/2 = mu then (sigma + 1)^mu B = sigma^mu B + B = 0,
        so B lies in F_(q^mu) and in F_(2^16), hence in F_(2^gcd(16, jk mu)), and
        gcd(16, jk mu) divides j mu <= 8 because k is odd; B would lie in
        F_(2^8), contradicting the audited bit. Hence m >= n/2 + 1.
    M3:
      responsibility: size
      proof: The span of n vectors has dimension at most n.
    M4:
      responsibility: correctness
      proof: >-
        IDEA-20260922-0e3641 (A), re-derived: for E over F_(2^d) and c dividing
        d k', sigma_c^i fixes F_(2^d) iff d divides c i iff (d / gcd(c, d))
        divides i. This is L1 with d in place of d_AB.
    M5:
      responsibility: correctness
      proof: >-
        As i runs over 0..n-1, c i mod d runs over every multiple of g = gcd(c, d)
        modulo d, because n >= d/g and i -> c i mod d has image exactly gZ/dZ.
        Hence the set {sigma_c^i(b)} = {b^(2^(g t)) : t} depends on c only through
        g, the vector set of definition (6) is the same set, and m is the same.
        Condition (7)'s parity term (n odd) and the genus branch are not covered
        by this lemma. Census: M5_CHECK True on all five rows.
    M6:
      responsibility: scope
      proof: >-
        For coprime a, b every divisor of a b factors uniquely as a divisor of a
        times a divisor of b (unique factorisation), so tau(16 k') = tau(16)
        tau(k') = 5 tau(k') for k' odd, and tau(k') >= 2 for k' > 1 with equality
        iff k' is prime. tau(9) = 3, tau(15) = tau(21) = 4 give 15, 20, 20.
    MAIN_C2:
      responsibility: assembly
      proof: >-
        M1 to M3 and M5 with MMT Theorem 1 (retrieved) on every open cell where
        (7) holds (all twenty, computed). Branch resolved at source for m < 13.
    proposal_positive_control_examined:
      requirement: DH-7(e)
      finding: >-
        The proposal's positive control "k' even" is reasoned out and replaced.
        With k' even, L2 gives k' e = 0 for both e in F_2, so e is undetermined.
        If e = 0 the inner sum is the subfield trace and the l'-part maps to zero
        as before. If e = 1 the inner sum is sum over r of (-1)^r pi^r(P) = sum of
        (-lambda)^r P = (1 - lambda^(k'))/(1 + lambda) P, which is zero because
        lambda^(k') = 1, unless lambda = -1. So for generic lambda the k'-even cell
        predicts a ZERO image too, and a check on it is not a test with a possible
        negative. The replacement is ARM-C1-POS: the open lanes of the same toy
        cell, where L6 shows the argument cannot apply and MMT Remark 22 states
        the non-kernel expectation; the prediction there is argued in the
        experiment contract.

  # ---------------------------------------------------------------------------
  numbered_heuristics:
    H-DL-1:
      formal_statement: see H-BINSTD-0dd2ce heuristic_assumptions H-DL-1
      derivations:
        totally_split_count: >-
          Monic degree-g polynomials over F_q that split into linear factors are
          in bijection with multisets of g roots, C(q + g - 1, g) of them; the
          fraction is (1/g!) times the product over i < g of (1 + i/q), which at
          g = 8 and q = 2^10 is about 1.028 (0.04 bit).
        fixed_point_law: >-
          The number of permutations of g letters with exactly j fixed points is
          C(g, j) D_(g-j), D_m = m! sum over i <= m of (-1)^i / i!; dividing by g!
          gives P(J = j) = (1/j!) sum over i <= g - j of (-1)^i / i!
          (decision_rules.fixed_point_law).
        two_smooth: >-
          Permutations with all cycles of length at most 2 are the involutions,
          I_g with I_0 = I_1 = 1 and I_n = I_(n-1) + (n - 1) I_(n-2); I_8 = 764
          (decision_rules.involution_fraction).
        finite_q_disclosure: >-
          #J_C(F_q) differs from q^g by a factor 1 + O(g / sqrt q); for one curve
          this can move the bulk statistic by a few tenths of a bit, which is why
          the VALIDATED tolerance is 0.5 bit, the FALSIFIED threshold is 1 bit,
          and the null curve of the same (q, g) is required (IR-4).
      validation_arm: ARM-H1 (EXP-BINSTD-f442a9), DR-H1 and DR-H1-TAIL
      sample_size_and_power: >-
        S = 2^24 per curve, about 416 expected splits. C-5 run 3: under the exact
        null (r = 0) DR-H1 returns VALIDATED in 19999 of 20000 trials and never
        FALSIFIED or INVALID_NULL; at a true deviation of -1.5 bit it returns
        FALSIFIED in 4864 of 5000, at +1.5 bit in 5000 of 5000; at plus or minus
        0.75 bit it returns INCONCLUSIVE in every trial (by design: between the
        two thresholds). DR-H1-TAIL returns TAIL_PASS in 20000 of 20000 null
        trials.
      transfer: TA-1 (H-BINSTD-0dd2ce)
    H-DL-2:
      formal_statement: see H-BINSTD-0dd2ce heuristic_assumptions H-DL-2
      rigorous_support: >-
        None obtained. The form of the law is a pointer to KN-LIT-92caf4
        (abstract-level corpus entry), treated as recalled, which supports
        nothing; the heuristic is the contract's own and the validation arm is
        its only support.
      validation_arm: ARM-H2 (EXP-BINSTD-f442a9), DR-H2
      null_model: >-
        log2 trials = log2 kappa + (2 - 2/g) log2 q + noise, replicate noise
        Gaussian with standard deviation 1.4427 / sqrt(q^(1 - 1/g)) bits (the
        relative spread of a sum of about |F| independent waiting times), three
        replicates averaged, kappa at 0, 7.65 and 15.30 bits.
      sample_size_and_power: >-
        C-5 run 3: under the null DR-H2 returns VALIDATED in 20000 of 20000
        trials at each of the three kappa values, and the SR-3 cap never fires;
        at a slope error of plus or minus 0.6 it returns FALSIFIED in 5000 of
        5000; at plus or minus 0.3 it returns INCONCLUSIVE (4999 or 5000 of 5000).
      transfer: TA-2 (the least supported transfer)
    H-0e3641-1: >-
      Retired as a heuristic; proved for the magic number by M5 (above). The
      optional composite-k' arm of IDEA-20260922-0e3641 Part 2 is omitted with
      this reason: the only quantity it would measure (m at two divisors sharing
      gcd(c, d)) is fixed by M5, and its Part 3 cost comparison would measure
      a toy-scale question the contract does not need (composite-k' curves are
      outside RQ-BINSTD-b6f698's target population).

