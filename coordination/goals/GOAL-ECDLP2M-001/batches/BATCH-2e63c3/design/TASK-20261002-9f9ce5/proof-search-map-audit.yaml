          B' lies in F_(2^8) \ F_(2^4) with Tr_(F_(2^8)/F_2)(B') = 1. The only d = 8
          toy cell (TC-C) has Tr_(F_(2^8)/F_2)(B) = 0 by rule AR-1 (C-7 prints 0),
          and the trace is a Frobenius invariant, so B' is in no Frobenius orbit
          of a declared B; d = 4 and d = 2 cells have B in F_16 or F_4, which B'
          is not in.
      - name: UNIFORM-176
        what_was_computed: coefficient arithmetic on 32 seeded B' (m per lane); no point, order or cover
        separation: every draw has smallest subfield F_(2^176) (printed) and none equals a deployed B (printed)
      - name: C-5 and C-6 inputs
        what_was_computed: synthetic counts, Gaussian replicate noise and planted dictionaries only
        separation: no curve or group at all
      - name: C-7 (declared toy cells)
        what_was_computed: >-
          The C-7 admissibility arithmetic only: B in F_(2^d), the subfield point
          count h by the trace criterion over F_(2^d) (d <= 8), the Weil recursion
          to #E(K), the factorisation of L, gcd(l', h), the lane levels from
          coefficient arithmetic, and the degeneracy rules. No point of order l'
          was constructed and no trace sum, cover, divisor sample or relation was
          computed.

