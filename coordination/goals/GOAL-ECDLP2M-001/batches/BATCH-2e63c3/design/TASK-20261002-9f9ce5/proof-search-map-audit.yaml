          #!/usr/bin/env python3
          """cost_table: EXP-BINSTD-f442a9 charged cost-table generator (design figures).

          Machine model MM-1 for BOTH arms: bit operations (schoolbook squares of
          the operand width), memory in bits, wall time in bit-operation ticks on
          P processors, and full cost FC = (processors + memory_bits / RHO_AREA)
          x wall time. Every IC figure is conditional on H-DL-1 and H-DL-2 at the
          stated constant kappa; none is a verdict about any curve (TH-1, DH-11).
          Importing this module executes nothing.
          """
          import argparse
          import hashlib
          import json
          import math
          import sys

          MODEL = {
              "P_REF": 2 ** 20,
              "P_LA_MAX": 2 ** 10,
              "RHO_AREA_BITS_PER_PROC": 2 ** 16,
              "RHO_MULTS_PER_ITER": 10,
              "DP_PER_PROC": 2 ** 10,
              "DP_BITS_FACTOR": 3,
              "TRIAL_COEF": 1.0,
              "LA_WEIGHT_FACTOR": 2,
              "LA_ITER_FACTOR": 3,
              "LA_BM_FACTOR": 4,
              "RELMEM_FACTOR": 4,
              "MAP_COEF": 2.0,
              "SMALL_GENUS_MAX_RATIO": 1.0,
          }
          COST_ROLES = ("OPEN_N2", "OPEN_N4", "OPEN_N8", "OPEN_N16")
          SENS_P = (2 ** 10, 2 ** 20, 2 ** 30)
          SENS_AREA = (2 ** 10, 2 ** 16, 2 ** 22)
          HEADER = (
              "All figures are conditional design figures under MM-1 and H-DL-1/H-DL-2 at the stated kappa;"
              " none is a verdict about any curve (TH-1, DH-11). Polylog factors hidden in the reported"
              " O~(q^(2-2/g)) law are set to 1 (optimistic for the IC arm). Units: log2 of bit operations,"
              " log2 of bits, log2 of bit-operation ticks.")


          def lse2(*xs):
              top = max(xs)
              return top + math.log2(sum(2.0 ** (x - top) for x in xs))


          def log2_fact(g):
              return math.lgamma(g + 1) / math.log(2)


          def rho_arm(log2_l, k, N, P, area, M=MODEL):
              iters = 0.5 * (math.log2(math.pi) + log2_l - math.log2(4 * k))
              t_it = math.log2(M["RHO_MULTS_PER_ITER"]) + 2 * math.log2(N)
              n_dp = math.log2(P) + math.log2(M["DP_PER_PROC"])
              mem = n_dp + math.log2(M["DP_BITS_FACTOR"] * log2_l)
              wall = lse2(iters - math.log2(P), iters - n_dp) + t_it
              fc = lse2(math.log2(P), mem - math.log2(area)) + wall
              return {"iters": iters, "work": iters + t_it, "mem": mem, "wall": wall, "fc": fc}


          def ic_arm(c, n, g, log2_l, N, kappa, P, area, M=MODEL):
              mult_bits = 2 * math.log2(c)
              t_trial = math.log2(M["TRIAL_COEF"] * g * g * (1 + c))
              work_rel = kappa + (2.0 - 2.0 / g) * c + t_trial + mult_bits
              D = (1.0 - 1.0 / g) * c
              w = M["LA_WEIGHT_FACTOR"] * g
              Lb = log2_l
              work_la = 2 * D + math.log2(M["LA_ITER_FACTOR"] * w * Lb
                                          + (M["LA_ITER_FACTOR"] + M["LA_BM_FACTOR"]) * Lb * Lb)
              mem_la = D + math.log2(w * (D + 1) + 4 * Lb)
              mem_rel = math.log2(M["RELMEM_FACTOR"]) + D + math.log2((g + 2) * (c + 1))
              work_desc = log2_fact(g) + c + t_trial + mult_bits
              work_map = math.log2(M["MAP_COEF"] * n * g * g) + 2 * math.log2(N)
              lp = math.log2(P)
              lpla = math.log2(min(P, M["P_LA_MAX"]))
              la = math.log2(area)
              area_rel = lse2(lp, mem_rel - la)
              area_la = lse2(lpla, mem_la - la)
              area_map = lse2(0.0, mem_rel - la)
              return {
                  "work_rel": work_rel, "work_la": work_la, "work_desc": work_desc, "work_map": work_map,
                  "work": lse2(work_rel, work_la, work_desc, work_map),
                  "mem_rel": mem_rel, "mem_la": mem_la, "mem": max(mem_rel, mem_la),
                  "la_dim": D, "la_weight": w,
                  "wall": lse2(work_rel - lp, work_la - lpla, work_desc - lp, work_map),
                  "fc": lse2(area_rel + work_rel - lp, area_la + work_la - lpla,
                             area_rel + work_desc - lp, area_map + work_map),
              }


          def compare(ic, rho):
              return {"d_work": ic["work"] - rho["work"], "d_mem": ic["mem"] - rho["mem"],
                      "d_fc": ic["fc"] - rho["fc"]}


          def lane_genus(m):
              return 2 ** (m - 1)


          def run(args):
              raw = open(args.census, "rb").read()
              census = json.loads(raw.decode("utf-8"))
              print("COST_TABLE EXP-BINSTD-f442a9 (design figures; conditional; not a verdict)")
              print("census", args.census, "sha256", hashlib.sha256(raw).hexdigest())
              print(HEADER)
              print("MODEL", json.dumps(MODEL, sort_keys=True))
              P, area = MODEL["P_REF"], MODEL["RHO_AREA_BITS_PER_PROC"]
              for name in sorted(census["rows"]):
                  row = census["rows"][name]
                  N, k, Lb = row["N"], row["k"], row["log2_l"]
                  rho = rho_arm(Lb, k, N, P, area)
                  print("ROW %s N=%d k=%d log2_l=%.3f matched_rho_iters_log2=%.3f rho_work=%.2f rho_mem=%.2f"
                        " rho_wall=%.2f rho_fc=%.2f" % (name, N, k, Lb, rho["iters"], rho["work"], rho["mem"],
                                                       rho["wall"], rho["fc"]))
                  for role in COST_ROLES:
                      lane = row["lanes"].get(role)
                      if lane is None:
                          print("  LANE %s missing from census" % role)
                          continue
                      c, n, m = lane["c"], lane["n"], lane["m_span"]
                      g = lane_genus(m)
                      ratio = g / float(c)
                      if lane["collapsed"]:
                          print("  LANE %s c=%d: collapsed; no cost row" % (role, c))
                          continue
                      if ratio > MODEL["SMALL_GENUS_MAX_RATIO"]:
                          print("  LANE %s c=%d n=%d m=%d g=%d regime_ratio g/log2q=%.3f > %.1f:"
                                " outside the small-genus law; NO COST ROW (cell OPEN, missing quantity:"
                                " a large-genus cost law at read provenance)" % (role, c, n, m, g, ratio,
                                                                                MODEL["SMALL_GENUS_MAX_RATIO"]))
