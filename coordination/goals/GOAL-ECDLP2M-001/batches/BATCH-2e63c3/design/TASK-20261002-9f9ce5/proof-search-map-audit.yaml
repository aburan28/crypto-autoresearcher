    items:
      - name: KOBLITZ-176
        what_was_computed: coefficient arithmetic on B = 1 in F_(2^176) (m per lane); no point, order or cover
        separation: B = 1 lies in F_2; every declared toy cell's B generates F_(2^d) with d >= 2, and every deployed B generates F_(2^16)
