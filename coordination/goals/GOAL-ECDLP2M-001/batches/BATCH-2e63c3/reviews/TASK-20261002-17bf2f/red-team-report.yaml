  - O-13
  proof_architecture_challenges:
  - >-
    Not in J4's assignment (J3 owns proof architecture); none raised.
  survival_statement: >-
    J4 did not survive the attack. It breaks on PTM-D (the signature fails at the contract's own declared
    P = 2^30, and the known-false conclusion is reached for P above 2^30), on the 15 OPEN_N2 cost lines
    (no numbered heuristic, outside the retrieved source's g >= 3), and in substance on the one-accounting
    requirement (the full-cost sign is set by unsourced P_REF, P_LA_MAX and DP_PER_PROC). What survived,
    plainly: the table is an arithmetically faithful evaluation of the stated formulas (independent re-implementation
    within 0.01 bit on all 35 printed rows); linear algebra, descent and memory are charged in every line;
    matched rho is used only under CORR-20260922-81aeab; TH-1, TW-7257-1, the D-column exclusion and DC-H5
    hold; PTM-A, PTM-C as specified and PTM-D(a) hold, and PTM-D(b) holds for P up to 2^20; the scope
    statement asserts no verdict.
  remaining_uncertainty: >-
    Whether any defensible machine model fixes the sign of the IC-against-rho full-cost comparison on
    the OPEN_N4 lanes is not decided by anything in the contract. It turns on a communication charge for
    the linear algebra and the large-prime graph that MM-1 does not have, and on kappa at g = 8, the row
    weight and the relation memory at deployed q, none of which is measured yet. This report narrows the
    question to those quantities; it does not answer it in either direction.
  narrowest_supported_statement: >-
    Under MM-1 as frozen (P_REF = 2^20, P_LA_MAX = 2^10, DP_PER_PROC = 2^10) the C-4 table is an arithmetically
    faithful evaluation of the contract's stated formulas on the ten small-genus cells. Its d_fc column
    is a property of those three unsourced constants rather than of the rows, and its 15 OPEN_N2 lines
    are conditional on no numbered heuristic.
  next_concrete_action: >-
    A revision design card in a new batch (the plan's K-revise-defect route) carrying the required_controls
    above, with BA-1, BA-2 and BA-3 as its first items. This report changes no status.
