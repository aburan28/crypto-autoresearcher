  cheapest_falsification: >-
    One command, under one second, inside the extraction directory: python3 -c "import cost_table as ct;
    ct.MODEL['P_REF'] = 2**30; ct.main(['--census', 'census_r2.json'])" (or rt_census_lite.json rebuilt
    from the frozen C-3 output). The PTM-D line reads 'd_work=0.00 d_mem=0.00 d_fc=0.00' for (b) on all
    five rows, so the VOW disadvantage the plan's signature requires is absent at a value the contract
    itself declares; with 2**31 it reads d_fc = -0.84 to -0.92, an advantage. The second cheapest: the
    same block with P_REF and P_LA_MAX both set to 2**60, which moves the OPEN_N4 d_fc column by tens
    of bits.
  uncharged_cost_terms:
  - >-
    U-1. Large-prime-graph storage of the full double-large-prime algorithm that ARM-H2 runs: GTTD section
    6.3 states Theta(q) edges; the cost table charges 4 D relations. With the constant at its ceiling
    #L = q/2 (GTTD Definition 2) the excess is +2.5 (c2pnb176v1) to +8.5 (c2pnb368w1) bits of relation
    memory. IC-favouring; q-dependent; no transfer assumption; ARM-H2's measured peak memory has no route
    into ARM-COST.
  - >-
    U-2. Communication of the linear algebra and of the shared union-find graph: uncharged (flagged) and
    replaced by the unsourced cap P_LA_MAX = 2^10, which decides the full-cost sign (BA-3).
  - >-
    U-3. Growth of the recombined-relation row weight with log q (GTTD section 4.3 bound g - k + k ell
    g, ell <= 1 + log N_max: 4.8 to 7.9 bits above 2g at deployed q; Table 1 cycle length growing with
    log q). IC-favouring on the matrix-vector term; offset in C-4 by the dense term of X-2.
  - >-
    U-4. Polylogarithmic factors of the law: flagged (set to 1). GTTD shows explicit log q factors in
    formulas (4) and (5) of the simplified algorithm; its section 5.1 says the full algorithm saves one
    in phase 1, and Table 1 (g = 3) shows t / q^(4/3) falling from 0.78 to 0.58 over q = 2^15 to 2^27,
    which supports TA-2 directionally at g = 3.
  - >-
    U-5. The rho arm's per-iteration Frobenius-class canonicalisation (about 16k squarings, about one
    multiplication under linear-cost squaring; MM-1 does not define a squaring cost): uncharged, at most
    about 0.14 bit, rho-favouring and therefore conservative.
  - >-
    U-6. Inverse success probability (phi non-zero on the l-part of open lanes; B invertible in A D1 +
    B D2 = 0): uncharged; negligible per GTTD section 4.5 and the abstract-level non-kernel statement
    the contract carries.
  overcharged_or_phantom_terms:
  - >-
    X-1. A separate individual descent (g! q trials) under a walk that already contains the target (O-6):
    the largest work term on all five OPEN_N2 cells; removing it lowers OPEN_N2 work by 1.52 to 1.55 bits.
  - >-
    X-2. The dense LA term 7 D^2 (log2 l)^2: 4.6 to 5.7 bits above the matrix-vector term on OPEN_N4 lines
    and 6.6 to 7.7 bits on OPEN_N2 lines at w = 2g (O-7).
  - >-
    X-3. The rho arm's DP table at 2^10 per processor: +2.85 to +3.79 bits of rho full cost over MM-1's
    own optimum (IC-favouring) (BA-1).
  - >-
    X-4. The IC arm at fixed P_REF = 2^20 with LA capped at 2^10: the d_fc column carries log2(IC memory
    / RHO_AREA) - log2 P_REF = 13.3 to 56.4 bits that MM-1's own optimum would not pay (BA-3).
  null_and_nearby_object_controls:
    checked:
    - >-
      PTM-D(b) is the null object for the memory charge. The VOW disadvantage of a memory-only row should
      persist as P grows, because a cost-optimal rho table stays a small fraction of rho's processor cost.
      Under MM-1 it decays to zero at P = 2^30 and reverses above: the canonical artifact tell, localised
      to DP_PER_PROC (BA-1).
    - >-
      PTM-D(a) through a non-tautological path (the IC phase composition): ties (-0.0014 bit).
    - >-
      PTM-A and PTM-C as specified: the known-false conclusions are not reached.
    - >-
      PTM-C-prime (nearby object, K-isomorphic representation): the cost-table instrument emits rows on
      an object with no descent (O-8); the decision rule does not.
    missing:
    - >-
      PTM-D evaluated across the SENS grid (P = 2^10, 2^20, 2^30), and through the IC arm's composition
      rather than by comparing rho with a copy of itself.
    - >-
      A sensitivity grid over P_LA_MAX and DP_PER_PROC, the two parameters that decide d_fc.
    - >-
      A check that the charged relation memory belongs to the same algorithm as the measured time law
      (GTTD section 6.3).
    - >-
      A g >= 2 guard in the cost rule and an isomorphism-invariant collapse test (PTM-C-prime).
  extrapolation: >-
    Toy q = 2^10 to 2^13 to deployed q = 2^44 to 2^92, a 31- to 82-bit span in log2 q (TA-1 to TA-3 state
    it). What breaks first along it: the relation memory (Theta(q) against q^(7/8): the ratio grows by
    q^(1/8), 3.9 to 10.2 bits over the span); the row weight (proportional to log q: about 1.8 to 3.2
    bits); kappa's log q factors if the simplified algorithm is meant (about 1.8 to 3.2 bits per factor).
    TA-2 covers kappa only; no transfer assumption covers the memory or the row weight.
  objections:
  - id: BA-1
    severity: breaking
    summary: >-
      PTM-D(b) fails at P = 2^30 and reverses above (see j4).
  - id: BA-2
    severity: breaking
    summary: >-
      15 OPEN_N2 cost lines outside every numbered heuristic and outside the retrieved source's g >= 3
      (see j4).
  - id: BA-3
    severity: breaking_in_substance
    summary: >-
      The full-cost comparison's sign is set by unsourced P_REF, P_LA_MAX and DP_PER_PROC (see j4).
  - id: O-4
    severity: major
    summary: >-
      The relation-collection memory is modelled at GTTD's simplified-algorithm order (4 D) while ARM-H2
      measures the full algorithm, whose memory GTTD section 6.3 states as Theta(q). RELMEM_FACTOR = 4
      is unflagged; the excess is up to +2.5 to +8.5 bits and grows over the transfer; ARM-H2 records
      peak memory, but ARM-COST has no substitution route for it.
  - id: O-5
    severity: major
    summary: >-
      ARM-COST cannot be executed by the frozen cost_table. The block accepts only --census, hard-codes
      the kappa labels (0, log2 g!/2, log2 g!) and LA_WEIGHT_FACTOR, and has no path for the 'H-DL-2 UNVALIDATED'
      label or for suppressing rows on FALSIFIED. Every ARM-COST branch therefore needs edited code with
      a new digest. This bears on DH-5 (J4); the code-wiring side is J2's and was not performed here.
  - id: O-6
    severity: moderate
    summary: >-
      The individual-descent phase (g! q trials, unsourced, not flagged as pessimistic) is not needed
      under the contract's own walk D = [a] phi(P) + [b] phi(Q): GTTD section 4.5 obtains the logarithm
      from the dependency A D1 + B D2 = 0. It is the largest work term on all five OPEN_N2 cells (1.52
      to 1.55 bits).
  - id: O-7
    severity: moderate
    summary: >-
      The LA term's dominant part, 7 D^2 (log2 l)^2 (dense dot products and Berlekamp-Massey), lies outside
      the cited shape and outside GTTD section 4.3. GTTD section 5.2 points to a subquadratic block-Wiedemann
      generator computation (its reference 24). Meanwhile w = 2g ignores the log q growth of recombined-relation
      weight. The two departures roughly cancel in C-4 (within about 1 bit at c2pnb368w1 OPEN_N4) but
      each is unflagged, and ARM-COST's weight substitution would correct only the weight, measured at
      toy log q.
  - id: O-8
    severity: moderate
    summary: >-
      PTM-C-prime: for a K-isomorphic representation of the Koblitz-shaped fixture the cost rule emits
      g = 1 cost rows (printed cond_delta_work as low as -74.35 against the stand-in rho of the fixture's
      field row), where no row may exist. Fix: require g >= 2 and compute the collapse from A modulo the
      image of s -> s^2 + s.
  - id: O-9
    severity: minor
    summary: >-
      ARM-CELL declares KOBLITZ-176 lanes, but decision_rules.declared_grid lists only ARM-S0 for fixtures,
      so C-6 never routes them through cell_verdict. Run here, they reach NO_DESCENT_G1 or IDENTITY_NO_DESCENT.
      Pointer for J2's owner.
  - id: O-10
    severity: minor
    summary: >-
      The verdict vocabulary has no hopeless class: the prime-degree lane (genus 2^190 over F_2) and a
      genuinely open n = 8 lane both read OPEN_LARGE_GENUS_LAW.
  - id: O-11
    severity: minor
    summary: >-
      The rho arm takes the Frobenius-class gain sqrt(k) without charging the per-iteration canonicalisation;
      at most about 0.14 bit and conservative.
  - id: O-12
    severity: minor
    summary: >-
      The scope statement omits standardized composite-degree binary curves outside ANSI X9.62: the IETF
      IKE EC2N groups over GF(2^155) and GF(2^185) (RFC 2409 sections 6.3 and 6.4, retrieved; 155 = 5
      x 31, 185 = 5 x 37) are in neither list. No verdict is asserted.
  - id: O-13
    severity: minor
    summary: >-
      The hypothesis asymptotic_note calls the 7/16 time exponent 'the known composite-degree GHS phenomenon'
      without a citation or provenance, and gives time and memory exponents but not the full-cost exponent
      MM-1 implies at fixed P (7/16 + 7/32 = 21/32).
  - id: O-14
    severity: minor
    summary: >-
      The time-memory-parallelism tradeoff is printed for OPEN_N4 lanes only and over P and RHO_AREA only
      (see BA-3).
  required_controls:
  - >-
    Run PTM-D(a) and (b) through the IC arm's phase composition at every SENS value of P, and fix DP_PER_PROC
    at a sourced value (KN-LIT-73f7e1's w/m of about 2^3.9) or at MM-1's own full-cost optimum.
  - >-
    Either optimise each arm's free machine parameters (P, P_LA_MAX, DP density) under one stated objective
    (VOW's time at a fixed dollar budget, or full cost minimised over P) with an explicit communication
    charge for the linear algebra and the shared large-prime graph, or print the d_fc sign region over
    a joint grid of P_LA_MAX, P and DP_PER_PROC.
  - >-
    Remove the OPEN_N2 cost rows, or number a g = 2 heuristic with its own validation arm, since GTTD
    Theorem 1 is g >= 3.
  - >-
    Charge the relation memory of the algorithm ARM-H2 actually runs (Theta(q) for the full algorithm,
    GTTD section 6.3), or switch ARM-H2 to the simplified algorithm and carry its log q time factor; route
    ARM-H2's peak memory and the q-dependence of the row weight into ARM-COST with stated transfer assumptions.
  - >-
    Make ARM-COST executable from the frozen block (command-line inputs for the kappa range, LA_WEIGHT_FACTOR,
    the UNVALIDATED label and row suppression).
  - >-
    Add a g >= 2 guard to the cost rule and an isomorphism-invariant collapse test, with PTM-C-prime as
    a fixture.
  counterexample_or_mutation: >-
    Mutation of a single declared parameter: MODEL P_REF = 2^30 (in SENS_P) makes PTM-D(b) tie, and 2^31
    makes it read an advantage (BA-1). Nearby object: the PTM-C-prime re-representation makes the cost
    rule emit g = 1 rows (O-8).
  baseline_comparison: >-
    The rho arm is matched rho under CORR-20260922-81aeab, reproduced; its per-iteration cost is 10 schoolbook
    F_(2^N) multiplications (flagged). Its full cost is inflated by 2.85 to 3.79 bits over MM-1's own
    optimum by the DP rule. BSGS and generic bounds lie above rho and are not competitors here.
  heuristic_challenges:
  - >-
    H-DL-2's formal domain (g = 8, 10 <= c <= 92) excludes the 15 OPEN_N2 cost lines that (C3') places
    under it (BA-2).
  - >-
    The g = 8 form of H-DL-2 now has retrieved support (GTTD Theorem 1, g >= 3, heuristic for general
    curves), which upgrades the contract's recalled pointer for the OPEN_N4 lines. Any later record using
    it should cite the retrieval with verified_by TASK-20261002-17bf2f.
  - >-
    No numbered transfer assumption covers the row weight or the relation memory (see extrapolation).
