  proves_too_much:
    failure_signature_quoted: >-
      PTM-A reads the lattice {1, N}, one hopeless cell and no row at or below matched rho. PTM-C reads
      m = 1 in every lane, no descent and no cost row. PTM-D reads (a) a tie at 0 bits and (b) no advantage,
      with a disadvantage under VOW.
    PTM-A:
      performed: true
      meets_signature: true
      result: >-
        Lattice [1, 191] and [1, 239] (C-3). One non-identity lane per row, verdict OPEN_LARGE_GENUS_LAW
        (genus 2^190 and 2^238 over F_2) through cell_verdict with the ARM-CELL input rule; IDENTITY_NO_DESCENT
        on c = N. No cost row: the C-4 PTM-A branch prints 'NO COST ROW', and the same lane relabelled
        under every cost role and fed through the main cost loop is rejected by the regime test.
      note: >-
        The verdict vocabulary has no class separating this hopeless lane from the genuinely open n =
        8 lanes (O-10). The known-false conclusions are not reached.
    PTM-C:
      performed: true
      meets_signature: true
      result: >-
        m = 1 in all ten lanes (C-3). Through cell_verdict: NO_DESCENT_G1 on nine lanes, IDENTITY_NO_DESCENT
        on c = 176. Through the main cost loop with lanes keyed by declared role: 'collapsed; no cost
        row' on all four cost roles; the C-4 PTM-C branch prints 'no descent (g = 1); NO COST ROW' on
        all ten lanes.
      note: >-
        The C-4 PTM-C lines are a special-case print keyed on m = 1, not the cost rule. The contract's
        dry call never routes KOBLITZ-176 lanes through cell_verdict although ARM-CELL declares them (O-9).
    PTM-C-prime:
      performed: true
      added_by_red_team: true
      object: >-
        The K-isomorphic re-representation y^2 + xy = x^3 + A' x^2 + 1 of the PTM-C fixture over F_(2^176)
        (c2pnb176v1's field), A' = s^2 + s with s the first getrandbits(176) draw of random.Random(20261017);
        substituting y -> y + s x maps the fixture onto it. Coefficient arithmetic only.
      result: >-
        The committed census functions give d_A' = 176, d_AB = 176, Tr(A') = 0, collapsed = False and
        m = 1 in every lane. The committed cost loop then emits g = 1 cost rows on OPEN_N2, N4, N8 and
        N16, printing cond_delta_work = +11.06, -35.93, -60.90 and -74.35. Any cost row for this object
        is the known-false conclusion of PTM-C, since no descent exists. The rho those lines are printed
        against is computed from c2pnb176v1's published order, which the fixture borrows for printing
        only; the numbers describe the cost rule on a non-deployed object and say nothing about c2pnb176v1.
        The decision rule is robust: cell_verdict returns NO_DESCENT_G1 on every non-identity lane.
      localization: >-
        cost_table.run admits g = 1 (regime test only, no g >= 2 guard); stage0_census computes the collapse
        from the coefficients as written (smallest field of A and B), not from the K-isomorphism class
        (A modulo the image of s -> s^2 + s). Not reachable on the five deployed rows as given (A, B in
        F_(2^16); M2 gives m >= 2 on open lanes). Reported as O-8, not as a failure of PTM-C as specified.
    PTM-D:
