  j4:
    verdict: breaks
    verdict_basis: >-
      Two listed breaking artifacts are present (BA-1, PTM-D reaches the known-false conclusion; BA-2,
      a cost resting on a recalled reference and rows not conditional on any numbered heuristic), and
      a third (BA-3, the van Oorschot-Wiener comparison's sign set by unsourced, asymmetrically applied
      machine constants) breaks the one-accounting requirement in substance. The arithmetic itself is
      faithful (item cost_table_recomputed).
    breaking_artifacts:
    - id: BA-1
      plan_artifact: >-
        PTM-D on which the rules reach the known-false conclusion
      statement: >-
        The comparison rule fails PTM-D(b)'s failure signature at P = 2^30, which is one of the contract's
        own declared sensitivity values (SENS_P = 2^10, 2^20, 2^30), and reaches the known-false conclusion
        (an advantage for a row carrying 2^40 shared random-access entries at rho's own time) for every
        P above 2^30.
      evidence: >-
        The committed cost_table block, run on census-lite with only MODEL P_REF changed, prints for (b)
        d_work = d_mem = d_fc = 0.00 on all five rows at P = 2^30 (a tie, not the VOW disadvantage the
        signature requires), d_fc = -0.84 to -0.92 at 2^31, -2.53 to -3.11 at 2^34 and -2.93 to -3.80
        at 2^36. The reference accounting, rho at its own full-cost-optimal distinguished-point table
        under MM-1's prices (P sqrt(RHO_AREA / (3 log2 l)) entries, 2^2.98 to 2^3.55 per processor) or
        at VOW's own operating ratio w/m = 15.2 (KN-LIT-73f7e1), keeps (b) at a disadvantage of +2.85
        to +3.78 bits at P = 2^30, +2.01 to +2.87 at 2^31 and +0.32 to +0.68 at 2^34. The known truth
        itself is P-scoped: near P = 2^36 a cost-optimal rho table reaches 2^40 entries and (b) ties under
        the reference as well, so the failure window that contradicts the plan's known truth is P in [2^30,
        2^35].
      localization: >-
        DP_PER_PROC = 2^10 in cost_table.rho_arm. The contract fixes rho's table at 2^10 distinguished
        points per processor, so rho's charged memory grows with P and equals 2^40 entries at P = 2^30.
        The value has no source. KN-LIT-73f7e1, the entry cited in the same clause of the specification,
        reports VOW's own cost-optimal ratio as w/m = 3.8e8 / 2.5e7 = 15.2 (about 2^3.9), which is 2^6.1
        below the contract's. At P_REF the rule inflates the rho arm's full cost by 2.85 (c2pnb176v1)
        to 3.79 (c2pnb368w1) bits over MM-1's own optimum, an IC-favouring asymmetry inside the one accounting.
        The contract evaluates PTM-D at P_REF only.
      instrument_note: >-
        PTM-D(a) holds, but the contract implements it as compare(dict(rho), rho), a comparison of rho
        with a copy of itself that cannot fail. Entered through the IC arm's phase composition ((P + memory
        / RHO_AREA) x work / P, copied from cost_table.ic_arm) it ties at -0.0014 bit at every P tested,
        so (a) holds in substance.
    - id: BA-2
      plan_artifact: >-
        a cost resting on a recalled reference; every row conditional on the numbered heuristics
      statement: >-
        15 of the 30 C-4 cost lines, all five OPEN_N2 cells (g = 2; c = 88, 104, 136, 152, 184; three
        kappa labels each), apply the relation-collection law kappa q^(2 - 2/g) at g = 2, where no numbered
        heuristic and no retrieved source supports it.
      evidence: >-
        H-DL-2's formal statement is 'For g = 8 and q = 2^c with 10 <= c <= 92' (four of the five OPEN_N2
        cells also have c above 92). H-DL-1 and TA-1 to TA-3 are stated for g = 8 on OPEN_N4 lanes only.
        Statement (C3') nonetheless names 'the n = 2 and n = 4 lanes' as conditional on H-DL-1 and H-DL-2.
        The law's only origin in the contract is KN-LIT-92caf4, which the contract itself treats as recalled.
        This task retrieved the source (GTTD, IACR ePrint 2004/153, PDF sha256 a82359c1...6f4, text extracted
        locally): Theorem 1 is stated for 'g >= 3 fixed' (PDF page 1), the section 4.6 complexity table
        starts at g = 3 (PDF page 10), and the conclusion describes 'curves of small genus at least 3'
        (PDF page 14). The source therefore excludes the g = 2 lines rather than supporting them.
      consequence: >-
        ARM-COST's substitution (a kappa range measured at g = 8) does not say whether it applies to the
        g = 2 lines, so the 15 lines stay unconditioned after execution as well.
    - id: BA-3
      plan_artifact: >-
        the two arms charged under different accountings (in substance); the VOW comparison priced rather
        than quoted, but by unsourced decisive constants
      statement: >-
        MM-1 prices both arms with one formula, FC = (P + memory_bits / RHO_AREA) x wall, but at configurations
        fixed by three unsourced constants: P_REF = 2^20 for both arms, P_LA_MAX = 2^10 for the IC arm's
        linear algebra only, and DP_PER_PROC = 2^10 for the rho arm only. Rho's charged memory scales
        with P, so its full cost is invariant in P; the IC arm's memory does not scale with P, so its
        full cost falls about one bit per bit of log2 P once the LA cap is lifted. MM-1 charges no communication
        (flagged optimistic), so lifting the cap costs nothing inside MM-1. The sign of the d_fc column
        is therefore set by P_REF and P_LA_MAX, not by the rows.
      evidence: >-
        Decomposition at kappa_lo: d_fc is approximately d_work + [log2(IC memory / RHO_AREA) - log2 P_REF]
        - [rho DP-table overhead] + [LA-cap term]; c2pnb176v1 17.96 = 3.12 + 13.31 - 3.09 + 4.62, and
        c2pnb368w1 48.70 = -7.32 + 56.36 - 4.13 + 3.79. Raising P and P_LA_MAX together, every other MM-1
        input as frozen, lowers the formula's d_fc on the 15 OPEN_N4 lines about one bit per bit; at the
        configuration where the processor count matches the IC memory (2^34 to 2^77 processor-equivalents)
        the 15 values span -10.74 to +15.98 and come within about 1 bit of the d_work column minus the
        rho arm's DP-table overhead (3.1 to 4.1 bits), which is their limit as P grows. The contract's
        SENS grid varies P with the cap held at 2^10 (d_fc moves 0.11 bit between P = 2^20 and 2^30 on
        c2pnb368w1) and never varies P_LA_MAX or DP_PER_PROC, the direction in which the effect lives.
      source_check: >-
        KN-LIT-73f7e1 (kb, read at source by another session) records VOW's objective as wall time under
        a dollar budget mu + wv = B with the processor count, the distinguished-point fraction and the
        memory all optimised, and states the paper has 'No general T x Mem or AT cost metric'. MM-1's
        fixed-P full cost is the contract's own construction with VOW's price ratio, not VOW's comparison.
        GTTD section 5.2 (retrieved) supports only the qualitative statement that the linear algebra parallelises
        less than rho (their run went from 5.8 to 1.9 days on a multi-processor machine); it gives no
        cap.
      reading: >-
        DC-H3 asks for the VOW comparison priced, not quoted. It is priced in form, but its decisive inputs
        are constants without provenance, and the one with a cited neighbour (DP_PER_PROC) contradicts
        that neighbour by 2^6.1. The priced comparison reproduces the proposal's pre-registered prediction
        ('a wash or a loss on every row') through those constants. This does not map one-to-one onto a
        listed breaking artifact; the composer may weigh it as a major objection, and BA-1 and BA-2 suffice
        for 'breaks'.
      own_sentence_note: >-
        The d_fc values quoted here are outputs of the contract's own formula under stated parameter changes
        (design-figure class). The finding is that the formula's sign is not determined by MM-1's sourced
        inputs; no sentence states that any row sits below its matched rho.
