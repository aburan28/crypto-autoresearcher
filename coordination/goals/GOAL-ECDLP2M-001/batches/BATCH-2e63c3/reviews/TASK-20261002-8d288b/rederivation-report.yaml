  Q0:
    - id: 'Q0-1'
      choice: 'Reading the printed colon-separated hex as an integer'
      decision: >-
        Big-endian: the first printed byte is the most significant; leading 00
        bytes are dropped. Bit j of the resulting integer is then the
        coefficient of t^j, as the card states. The generator is split as 04 ||
        x || y with equal halves (used only by the parse self-checks).
      reported_values_independent_of_choice: true
      evidence: >-
        Under this reading the printed generator satisfies y^2 + x y = x^3 + A
        x^2 + B in all seven rows, in two arithmetic codes, and l times it is
        the point at infinity. Under bit reversal within N bits, under
        little-endian byte order and under an x/y swap the curve equation fails
        in all seven rows. Two independent parsers (line-state and regex) give
        identical integers.
    - id: 'Q0-2'
      choice: 'Inline printed values'
      decision: >-
        A bare decimal (the row c2pnb208w1 prints A as 0) is read as that
        decimal integer. A value printed as decimal with a parenthesised hex
        (every Cofactor line) is read as the decimal integer, and the
        parenthesised hex is required to agree; it agreed in all seven rows.
      reported_values_independent_of_choice: true
    - id: 'Q0-3'
      choice: 'Square-root computation in the span invariant'
      decision: >-
        x^(1/2) = x^(2^(N-1)), computed by N-1 successive squarings (impl-1) and
        by the (N-1)-th power of the squaring matrix (impl-2), and checked by
        squaring back. The value is unique because squaring is a bijection of
        F_(2^N). Omitting the square roots altogether leaves m unchanged in all
        47 (row, c) pairs, so this choice cannot move m.
      reported_values_independent_of_choice: true
    - id: 'Q0-4'
      choice: 'Dimension of the F_2-span of the pairs'
      decision: >-
        Each pair (e, x) in F_2 x F_(2^N) is encoded as an (N+1)-bit vector with
        e at bit N and x in bits 0..N-1. The dimension is the rank over F_2 by
        Gaussian elimination (impl-1 xor basis). It is cross-checked by sympy
        DomainMatrix rank over GF(2) and by m = deg lcm(x+1, Ord(b^(1/2))). Here
        Ord(v) is the least-degree divisor of x^n - 1 that annihilates v under
        sigma_c, found through the sympy factorisation of x^n - 1 over GF(2).
        The dimension does not depend on the choice of F_2-basis.
      reported_values_independent_of_choice: true
    - id: 'Q0-5'
      choice: 'Primality test applied to l'
      decision: >-
        Strong Baillie-PSW (sympy 1.14.0 sympy.isprime, which for these sizes
        runs trial division by primes up to 47 and then is_strong_bpsw_prp,
        because gmpy2 is absent) and an own Miller-Rabin with 110 bases (the 46
        primes below 200 plus 64 seeded random bases). Both report probable
        prime for all seven orders. No primality certificate or proof was
        constructed, so the reported outcome is probable prime, not proven
        prime.
      reported_values_independent_of_choice: false
    - id: 'Q0-6'
      choice: 'Rounding to four decimals (Q3 and Q4)'
      decision: >-
        Round half to even, applied to the exact value: Q4 is exactly rational
        and is computed in exact fractions, and Q3 is computed to 60 significant
        digits. Every Q3 value lies at least 0.0382 units of 1e-4 (absolute
        3.8e-06) from a rounding boundary, so its four-decimal value does not
        depend on the rule. 8 Q4 values are exact ties at the fourth decimal.
        Round-half-up differs from the reported half-even value on 5 of them,
        and round-half-down on the other 3. Every tie is listed with all three
        alternatives in Q4_rounding_ties and in its Q4 row, and the exact values
        are reported in every Q4 row.
      reported_values_independent_of_choice: false
    - id: 'Q0-7'
      choice: 'k in Q3'
      decision: >-
        No choice was exercised. d_min < N held for every composite row, so the
        k produced by Q1 (k = N / d_min) exists for every Q3 row and was used as
        is.
      reported_values_independent_of_choice: true
    - id: 'Q0-8'
      choice: 'log2(g) in R-3'
      decision: >-
        g = 2^(m-1) is a power of 2, so log2(g) was taken as exactly m - 1, and
        R-1 to R-4 were evaluated in exact rational arithmetic. They were
        cross-checked by mpmath at 60 digits, which gives the same four-decimal
        values.
      reported_values_independent_of_choice: true
    - id: 'Q0-9'
      choice: 'Search ranges for the orbit length and m_level'
      decision: >-
        i and j are searched over 1..n. Both always exist in that range, because
        sigma_c^n is the identity, and for n a power of 2, (sigma_c + 1)^n =
        sigma_c^n + 1 = 0 in characteristic 2. m_level is rendered as the string
        not defined when n is not a power of 2, as the card says.
      reported_values_independent_of_choice: true
    - id: 'Q0-10'
      choice: 'Subfield tests for d_min and for B alone'
      decision: >-
        The divisors d of N are tested in ascending order with x^(2^d) = x
        (impl-1). This is cross-checked by the squaring-matrix power (M^d - I) x
        = 0 and by the degree of A and B over F_2 taken as the rank of {1, x,
        x^2, ..., x^(N-1)}, with d_min = lcm of the two degrees (impl-2).
      reported_values_independent_of_choice: true
    - id: 'Q0-11'
      choice: 'Rendering'
      decision: >-
        Hex is lowercase with a 0x prefix and no leading zeros. f exponents are
        in descending order. Q2 and Q4 rows are in ascending c. Tr_A is the
        integer 0 or 1. 2^(m-1) and 2^(m-1) - 1 are exact decimal integers.
        Four-decimal values are strings, so that trailing zeros survive YAML
        loading.
      reported_values_independent_of_choice: true
    - id: 'Q0-12'
      choice: 'Printed fields that enter no quantity'
      decision: >-
        The EC-Parameters header bit count, the generator, and the Seed lines of
        the two control rows enter no Q value. The header bit count equals the
        bit length of l in all seven rows. The generator is used only by the
        parse self-checks.
      reported_values_independent_of_choice: true
