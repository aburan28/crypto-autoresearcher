  controls:
    summary: >-
      211 of 211 controls passed. These cover planted known-answer objects in
      each row's own field and the card's two prime-degree control rows.
    by_kind:
      NEG-lucas:
        total: 20
        passed: 20
      NULL-random:
        total: 94
        passed: 94
      PC-level:
        total: 70
        passed: 70
      PC-sub:
        total: 27
        passed: 27
    kinds:
      PC-sub: >-
        b = Tr_(K/F_(2^c))(r) lies in F_(2^c), so expected m = 1, and m_level =
        1 when n is a power of 2.
      PC-level: >-
        For n in 2, 4, 8, b = (sigma_c + 1)^(n-j) r with (sigma_c + 1)^(n-1) r
        nonzero, so expected m = m_level = j for every j in 1..n.
      NULL-random: >-
        A random b, or a random field element, of the same shape. There is no
        fixed expectation; impl-1 and impl-2 must agree.
      NEG-lucas: >-
        The Q1 boolean recomputed with h replaced by h - 2, h - 1, h + 1 and h +
        2 must be false. It was false in all 20 cases, so the check is not
        vacuous.
    seed: >-
      random.Random(0x8d288b) for the controls, and random.Random(0x8d288b xor
      bitlen(l)) for the Miller-Rabin bases. No reported Q value depends on
      randomness.
  falsification:
    claim_under_test: >-
      The card asks whether the stated definitions determine the parameters,
      subfield memberships, orbit lengths, span invariant, trace bit, the Q3
      value and the four Q4 values, for these seven rows.
    would_be_false_if:
      - >-
        The printed parameters admitted a second reading under the stated
        encoding.
      - >-
        A definition admitted two readings that give different values.
      - >-
        An arithmetic error were common to every check path.
      - >-
        Rounding to four decimals did not fix a value.
    checked:
      - >-
        Encoding. Every alternative reading tried fails the curve equation in
        all seven rows, and the two parsers agree.
      - >-
        Readings of the span. Omitting the square roots changes m in no pair.
        Taking the orbit of B alone instead of (A, B) changes the orbit length
        in no pair. Omitting the leading 1 of each pair changes m in exactly 1
        pair(s): c2tnb191v1 c=1 m=191 versus 190 without the 1. The definition
        includes the 1 explicitly, so the value is determined, but this is where
        a misreading would show.
      - >-
        Arithmetic. Two implementations that share no arithmetic code agree on
        every value, and 211 of 211 planted, null and negative controls pass.
      - >-
        Rounding. 8 of the 60 Q4 four-decimal values are exact ties, so 'to four
        decimals' alone does not fix them. Half-up differs from the reported
        half-even value on 5 of them and half-down on 3. Their exact values are
        fixed and reported.
    outcome: >-
      The stated definitions and the printed parameters determine every Q1, Q2
      and Q3 value. They determine 52 of the 60 Q4 four-decimal values. The
      remaining 8 depend only on the rounding rule for exact ties, and their
      exact values are determined. The primality outcome is determined only up
      to the probable-prime nature of the tests.
