        iteration and against the formula d_min / gcd(d_min, c). They agree in
        47 of 47 (row, c) pairs.
      - >-
        m. Impl-1 xor-basis rank was checked against impl-2 DomainMatrix rank
        and against deg lcm(x+1, Ord(b^(1/2))). They agree in 47 of 47 pairs,
        and deg Ord(b^(1/2)) = deg Ord(b) in every pair.
      - >-
