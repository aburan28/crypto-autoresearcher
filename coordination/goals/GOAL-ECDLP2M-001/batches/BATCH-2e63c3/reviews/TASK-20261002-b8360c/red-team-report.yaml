    ii_lemma_audit:
      c1_prime:
        - lemma: L1
          assumes: d_AB = 16 (census)
          proves: period p = 16/c for c dividing 16 and n/p = k
          status: correct, proved
        - lemma: L2
          assumes: >-
            OB-1 (sigma' extends sigma, sigma'(y_i) = y_(i+1), sigma'^n = id)
            and k odd
          proves: sigma'^p fixes every y_i
          status: >-
            Correct and proved, not assumed (the plan's concern (c) is not
            borne out). k odd is used exactly here.
        - lemma: L3
          assumes: L2, OB-1's phi formula, transport of structure
          proves: phi(P) = sum over j < p of Con_j(sigma^j(Tr P))
          status: >-
            Correct. One implicit step: reading phi(P) = 0 in J_C(F_q) off the
            identity in Cl^0(F') uses injectivity of the conorm along the
            constant-field extension, which is standard (recalled) but unstated
            (O-11, minor).
        - lemma: L4
          assumes: '#E(K) = h l, l prime, gcd(l, h) = 1'
          proves: Tr kills E(K)[l]; pi acts by lambda with lambda^k = 1, lambda != 1
          status: >-
            Correct. gcd(l, h) = 1 is used exactly here; k prime is used
            nowhere in (C1') (only k odd, in L2). Checked numerically on a
            non-declared group (E over F_8 attacked over F_2^15, l' = 131): the
            5-term trace is O on 64 of 64 points of order l'; lambda = 61,
            lambda^5 = 1, sum of lambda^r = 0 mod 131.
        - lemma: L5 (OB-1)
          assumes: nothing; it is the interface
          proves: nothing in the contract; carried open
          status: >-
            Dischargeable at source. Hess 2004 (LMS JCM 7, full version, read
            here) Theorem 7 states, for V the stabiliser of the class of h,
            that N^(-1) from E_h to (E_h)^V of 0 lies in ker(phi_h), proved
            through Theorem 18 (phi = phi_V composed with [#W] composed with
            N_(E/E^V)), and adds that if V != {1} and the large prime factor
            is not present in Cl^0((E_h)^V) it is mapped to zero. With
            (E_h)^V the curve over F_(2^16) and gcd(l, h) = 1 this is (C1').
            Hess 2003 Theorem 7 states the same two-sided bound under the
            conditions of its Theorem 4.
        - lemma: L6
          assumes: c = jk, p = n
          proves: L4's hypothesis fails; nothing is concluded
          status: correct (PTM-B below)
        - lemma: MAIN-C1
          assumes: L1 to L4; L5 (OB-1); the census certificate (p, d_AB, gcd(l, h) = 1) per cell
          proves: phi(E(K)[l]) = 0 on the 25 cells with c dividing 16, conditional on OB-1
          status: >-
            Pure assembly of L1 to L4 under L5. (C1') is a special case of Hess
            2004 Theorem 7; the contract claims no novelty for it.
      c2_prime:
        - lemma: M1
          assumes: n a power of 2; MMT definition (6) and Theorem 5(i) (retrieved by TASK-20260929-0be49c)
          proves: m(b) equals the Artin-Schreier level of b and of b^(1/2)
          status: >-
            Correct. Independent derivation: m = deg Ord + [(t + 1) does not
            divide Ord]; for n a power of 2, Ord = (t + 1)^(j_0), so m = j_0.
        - lemma: M2
          assumes: c = jk, n = 16/j, k odd; the audited bit that B is not in F_(2^8); M1
          proves: m >= n/2 + 1 on every open cell
          status: >-
            Correct. (sigma + 1)^(n/2) = sigma^(n/2) + 1, and sigma^(n/2) is the
            2^(8k)-power map, which fixes b iff b lies in F_(2^8).
        - lemma: M3
          assumes: nothing beyond definition (6)
          proves: m <= n
          status: correct
        - lemma: M4
          assumes: E over F_(2^d), c dividing d k'
          proves: conjugate period n(c) = d / gcd(c, d)
          status: correct (L1 with d)
        - lemma: M5
          assumes: M4; m as the rank of a span over the conjugate set
          proves: m depends on c only through gcd(c, d)
          status: >-
            Correct: c i mod d runs over all of gcd(c, d) Z / d Z because
            n >= d / gcd(c, d), and the span depends on the set only. It
            legitimately retires H-0e3641-1 for the magic number; the residue
            (condition (7)'s parity term, the genus branch) is stated, not
            assumed.
        - lemma: M6
          assumes: k' odd
          proves: tau(16 k') = 5 tau(k') >= 10, equality iff k' prime (a count, not a cost)
          status: correct
        - lemma: MAIN-C2
          assumes: M1, M2, M3, M5; MMT Theorem 1 where condition (7) holds (computed per cell by the census)
          proves: n/2 + 1 <= m <= n and the genus candidates in [2^(n/2) - 1, 2^(n-1)] on the open cells
          status: >-
            Pure assembly with MMT Theorem 1 (retrieved by TASK-20260929-0be49c)
            and the census's per-cell condition (7) (J1's). Observation, not a
            J3 defect: Hess 2003 Theorem 5 and the paragraph after it give
            genus 2^(m-1) exactly when (t + 1) divides the minimal polynomial
            of sqrt(b), which holds for every n a power of 2; that bears on OB-3
            (n = 16 branch), which carries no cost row. The census side is J1's.
      hess_obligation:
        handling_against_DC_H1: >-
          Compliant with DC-H1's second route: (C1') is the record's own
          elementary derivation, MMT Remarks 21 and 23 are cited as the
          source's conclusion, the Hess hypothesis is numbered (OB-1, with
          OB-2), and the dependent verdicts carry _COND_OB1. Not a break.
        reviewer_reading_at_source: >-
          Hess was read at source by this reviewer (provenance retrieved,
          verified_by TASK-20261002-b8360c; PDFs hashed, text extracted by a
          stdlib script, excerpts in computations.json). Hess writes the
          Artin-Schreier function as f = gamma/x + alpha + beta x (in the GHS
          case gamma = 1, alpha = A, beta = B^(1/2); symbol roles checked in
          the IACR copy). Hess 2003 Theorem 4: sigma extends to a Frobenius
          automorphism of order n iff Tr_(K/F_2)(alpha) = 0 or
          Tr_(K/k)(gamma) != 0 or Tr_(K/k)(beta) != 0, the last being
          equivalent to (t + 1)^u dividing m_beta with u = 2^(v_2(n)); and
          Hess calls condition (2) of Lemma 6 of [18]
          (Maurer, Menezes and Teske, INDOCRYPT 2001) necessary and sufficient
          for it. Hess 2003 Theorem 7 gives the two-sided kernel bound, and its
          words say a subfield curve's conorm-norm kernel contains the large
          prime factor while s(h) = n leaves only 2-power torsion. Hess 2003
          Theorem 8 gives C_0(t) as the product over orbit representatives h
          of the Frobenius polynomial of the subfield curve at t^(s(h)).
        consequences_for_the_record:
          - >-
            OB-1 is a published theorem (Hess 2004 Theorem 7 with its proof in
            section 9). It can be closed by a new record citing it at
            retrieved provenance; this report closes nothing.
          - >-
            OB-2 resolves. Hess's restatement identifies MMT's undefined e in
            (9) as v_2(n) (an inference from Hess's u = 2^(v_2(n))). On each of
            the twelve Tr(A) = 1 collapsed cells, either (9) holds and an
            order-n Frobenius exists, so Theorem 7's lower bound applies, or it
            fails and, per Hess 2003's remark after Theorem 7 (Theorem 7
            remains true with the subfield rational, so the discrete logarithm
            problem is not preserved) and, for the non-regular case
            [K_1 : K] = 2, Hess 2004's paragraph after Theorem 7 (the large
            prime factor is always mapped to zero), the l-part is lost. Either
            way the order-l subgroup maps to zero, consistent with MMT Remark
            23.
          - >-
            The contract's stated failure mode for OB-1 (L2
            remark_where_it_breaks; H open_obligations OB-1
            where_it_could_break: without an order-n sigma' the alternating sum
            is 2/(1 + lambda) and "(C1') would fail there") is contradicted at
            source: in that case Theorem 7 still holds with a rational
            subfield, and the large prime factor is mapped to zero (O-7).
          - >-
            Label hygiene (minor, O-10): OB-1 is one universal statement, so a
            single failing cell would make every _COND_OB1 verdict vacuous;
            OB-2 does not appear in the twelve affected labels; the five
            c = 16 cells carry _COND_OB1 although their cover is E itself and
            L4 alone suffices.

