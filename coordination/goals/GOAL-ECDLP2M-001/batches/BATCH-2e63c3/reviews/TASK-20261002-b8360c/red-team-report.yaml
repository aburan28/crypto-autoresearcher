      negative_arm_ARM_C1_NEG:
        can_fail: false
        reason_1_coded: >-
          SR-1 stops a lane at its first non-zero image, and c1_negative returns
          INVALID whenever n_samples < 64. By the contract's own argument (c),
          phi on a group of prime order is injective or zero, so a lane on
          which (C1') failed would show a non-zero image at sample 1 and read
          INVALID. Through the committed code, c1_negative(1, 1, PASS,
          CONTROL_PASS) = INVALID, and the alternative "(C1') false on the
          lane" gives INVALID in 20000 of 20000. REFUTED needs the first
          non-zero image to be sample 64 exactly, a mixed pattern the contract
          calls an instrument defect; under a per-sample glitch model REFUTED
          appears only as an artifact (12 of 20000 at eps 1e-3, 103 at 1e-2).
          C-6's planted REFUTED input, c1_negative(64, 3, PASS, CONTROL_PASS),
          is one SR-1 cannot generate. A genuine refutation would be filed
          INVALID, "not evidence in either direction", and would count against
          the success criterion (at least four of seven ARM-C1 cells
          non-INVALID).
        reason_2_mathematical: >-
          On eight of the ten declared negative lanes the Weil upper bound
          (sqrt q + 1)^(2g) on #J_C(F_q) is below l', for example 2^5.09
          against l' >= 2^11.63 on TC-D1 to TC-D4 COLLAPSED_C1, and 2^20.35
          against 2^24.42 on TC-B COLLAPSED_C1. So any homomorphism from a
          group of order l' into the Jacobian of any genus-g curve over F_q is
          zero by Lagrange, whatever the collapse mechanism, OB-1 or the cover.
          On the other two (TC-A COLLAPSED_C1, 2^20.35 against 2^16.42; TC-C
          COLLAPSED_C2, 2^25.36 against 2^25.25), Hess 2003 Theorem 8 makes
          every factor of #J_C(F_q) the order of a curve over a subfield of
          F_(2^d), at most (2^(d/2) + 1)^2 = 2^4.64 (d = 4) or 2^8.17 (d = 8),
          below l', so a correct cover forces the zero image there too. The
          contract's own rule DG-3 ("Weil upper bound of #J_C(F_q) exceeds
          l'"), applied to the negative lanes as it was to the positive ones,
          flags eight of ten as unable to produce the outcome they exist to
          detect.
        nearby_object: >-
          The same measurement on a random genus-2 curve over F_2 with any
          homomorphism from Z/l' (l' >= 3169) returns a zero image, the same
          number as the claimed collapse, so CONSISTENT on these lanes is an
          artifact of group size, not evidence about the mechanism.
        deployed_scale_contrast: >-
          The deployed cells where (C1') is not already settled by size, E176
          and E272 at c = 2 with g = 128 (Weil bound about 2^405.8, above l),
          are the cells the size argument of MMT page 17 (as quoted in the
          reading note) does not cover. No declared toy lane imitates them.
        breaks_joint: true

    # -------------------------------------------------------------------------
    v_degeneracy_reaudit:
      method: >-
        Declared parameters only: the specification's arms and lanes and the
        C-7 design figures (d, k', c, q, m, g, h, l'). Nothing constructed on a
        declared cell.
      per_arm:
        - arm: ARM-C1-NEG (10 lanes)
          verdict: DEGENERATE on all ten; not recorded (C-7 prints "ARM-C1-NEG:ok")
          detail: eight by DG-3 (Weil bound below l'), two by Hess Theorem 8 (see iv)
        - arm: ARM-C1-POS (10 lanes)
          verdict: >-
            Non-degenerate: DG-3 passes on all ten (log2 Weil bound 20.2 to 80.7
            against log2 l' 11.6 to 32.0), m = n on all ten.
        - arm: ARM-C1-INSTR (7 cells)
          verdict: partially degenerate as a gate (cannot detect a zero map)
        - arm: ARM-H1 (TC-C, TC-E, TC-F OPEN_N4)
          verdict: >-
            Admitted by AR-2 (TC-C on the boundary). The samples live in a
            cyclic group of order l': S/l' = 0.42, 1.13, 0.004; variance
            inflation 1 + S/l' = 1.42, 2.13, 1.004; effective 99 percent
            half-width 0.217, 0.266, 0.183 bit against the nominal 0.182. Not
            degenerate for false-fire under the strict rule, but the interval
            is anti-conservative on TC-E (O-6). Not recorded.
        - arm: ARM-H2 (joint TC-C + TC-E + TC-F)
          verdict: DEGENERATE on TC-E; no degeneracy verdict printed by C-7 for any ARM-H2 lane
          detail: >-
            Factor-base coverage rho = |F| / |X| = 0.842, 0.771, 0.648 (against
            0.001 to 0.044 at q = 2^44 to 2^92). Subgroup pools: TC-E holds
            l'/8! = 369 split elements and at most 270 (bound) or about 100
            (simulated mean, maximum 138 in 200 draws) distinct relations
            against 800 needed, so it cannot complete. TC-C holds about 791
            against 441 needed, so it completes only by drawing about 56
            percent of its pool with replacement (log2 kappa inflated from 7.01
            to 7.61 in M3). TC-F holds about 40300 against 2666.
        - arm: ARM-CELL (deployed lanes)
          verdict: >-
            Deterministic. The five BASELINE_C16 cells read
            STRUCTURALLY_EMPTY_COND_OB1 though no cover is involved (O-10).
            KOBLITZ-176 lanes, declared as ARM-CELL cells by the specification,
            are absent from decision_rules.declared_grid() (O-9).
      breaks_joint: true

    # -------------------------------------------------------------------------
    vi_reachability:
      method: >-
        Per declared outcome from generative quantities (the contract's own
        model), and per arm as coded (planted and synthetic inputs through the
        committed decision_rules.py). C-6's REACH lines show planted
        reachability only.
      per_arm:
        - arm: ARM-S0
          reachable: [PASS, INVALID]
        - arm: ARM-CELL
          reachable_from_declared_grid: [IDENTITY_NO_DESCENT, STRUCTURALLY_EMPTY_COND_OB1, OPEN_LARGE_GENUS_LAW, DEFINED_WITH_COMPUTED_COST, OPEN_COST_UNAVAILABLE]
          planted_only: [NO_DESCENT_G1, OPEN_COLLAPSE_HYPOTHESIS_FAILS, OPEN_COLLAPSE_UNCERTIFIED, OPEN_COND7_UNESTABLISHED]
          note: >-
            OPEN_COST_UNAVAILABLE is reached on ten cells iff DR-H1 or DR-H2
            is FALSIFIED, so the TC-E artifact (M3) propagates into ten
            deployed cell verdicts. NO_DESCENT_G1 would come from the
            KOBLITZ-176 lanes the coded grid omits. The other three are guards.
        - arm: ARM-C1-NEG
          reachable: [CONSISTENT, INVALID]
          unreachable: [REFUTED]
          note: as coded (SR-1) and mathematically (Lagrange, Hess Theorem 8)
        - arm: ARM-C1-POS
          reachable: [CONTROL_PASS, CONTROL_FAIL, INSTRUMENT_DEFECT, INVALID]
        - arm: ARM-C1-INSTR
          reachable: [PASS, FAIL]
        - arm: ARM-H1
          reachable: [VALIDATED, INCONCLUSIVE, FALSIFIED, INVALID_NULL]
          unreachable: [NOT_ADMITTED (guard; all declared lanes admitted)]
          note: >-
            FALSIFIED is reachable through the bulk statistic only. TAIL_FAIL
            never yields FALSIFIED (committed h1_outcome(ADMIT, VALIDATED,
            TAIL_FAIL) = INCONCLUSIVE).
        - arm: ARM-H2
          reachable_under_own_model: [INCONCLUSIVE (M2, M4), FALSIFIED (M3, artifact), INVALID_INSUFFICIENT (missing lane)]
          unreachable_under_own_model: [VALIDATED]
          note: >-
            C-6's GRID line feeding ARM-H2 a VALIDATED input uses points the
            procedure's own random model does not generate at the declared q.
      breaks_joint: true

    # -------------------------------------------------------------------------
    vii_heuristic_arms:
      H-DL-1:
        fixed_before_data: >-
          Yes: law (1/g!, permutation fixed-point law, I_8/8!), statistic,
          99 percent Wilson intervals, thresholds, S = 2^24, tail check, power
          stated, transfer TA-1 numbered.
        can_fail_at_stated_deviation: >-
          The bulk can (FALSIFIED 4858 of 5000 at -1.5 bit). The tail cannot:
          TAIL_FAIL maps to INCONCLUSIVE, so the half of H-DL-1's formal
          statement on the root-count law (total variation 0.02) and the
          2-smooth fraction (0.5 bit) has no falsifying outcome (O-5).
        null_shape: >-
          Not the same shape. By Hess 2003 Theorem 8 the OPEN_N4 cover's
          Frobenius polynomial is a product of two factors in t^4 (the eight
          odd classes of F_2[t]/((t + 1)^4) form two free orbits under t), so
          a_1 = a_2 = a_3 = 0 and #C(F_q) = q + 1 exactly. The null, a random
          genus-8 curve, carries a Frobenius-trace term of about plus or minus
          0.3 bit at q = 2^10 (Gaussian approximation, scale recalled), and
          its samples range over an effectively unbounded group while the
          cover's range over l'. IR-4 still rarely fires (7 of 20000 strict).
        finite_q_law: >-
          Accurate under the random model at the declared q (total variation
          at most 2.7e-4; 2-smooth at most 1.3e-5 bit; split-count correction
          0.039, 0.020, 0.005 bit).
      H-DL-2:
        fit_form: >-
          Ordinary least squares of mean log2 trials on log2 q over three
          points, with a per-point log2 kappa window.
        justification_transfer: >-
          The random-model justification uses (|F|/q)^(g-2); with one place
          per x-coordinate the relevant ratio is rho = |F|/|X|, |X| about q/2,
          and the q^(2-2/g) law is derived for small rho. At the declared q,
          rho is 0.65 to 0.84. Under the contract's own random model the
          procedure gives log2 kappa 7.03, 6.46, 5.80, 5.51, 5.06 at q = 2^10,
          2^11, 2^13, 2^14, 2^16, so kappa is not constant and H-DL-2 as
          formally stated is false under its own justification; DR-H2 cannot
          return VALIDATED (INCONCLUSIVE in 2000 of 2000). The VALIDATED
          unreachability depends on |X| about q/2 (sensitivity in O-4); the
          non-constancy of kappa does not.
        extrapolation_TA_2: >-
          TA-2 anticipates kappa rising with q through polylogarithmic factors;
          under the contract's own model kappa falls as rho falls, and the
          transfer to q = 2^44 to 2^92 crosses a regime change in rho. The
          transfer is unsupported in either direction (O-4).
        subgroup_exhaustion: see v (TC-E); FALSIFIED in 300 of 300 is an artifact (O-3)
        null_calibration: circular (the law itself)
      H-0e3641-1:
        status: >-
          Reasoned out: retired by M5, a correct proof for the magic number; the
          optional composite-k' arm omitted with a stated reason.
      breaks_joint: true

  # ===========================================================================
  proves_too_much:
    failure_signature_quoted: >-
      PTM-B shows the (C1) argument failing its hypothesis on the open cell
      (it cannot be applied), not concluding a zero image. PTM-E routes both
      cells STRUCTURALLY EMPTY independent of their counterfactual cost data.
    PTM-B:
      performed: true
      method: >-
        (1) The (C1) argument applied verbatim, by parameter arithmetic, to all
        twenty deployed open cells c = jk (n in 2, 4, 8, 16). (2) The committed
        cell_verdict on those cells. (3) The trace algebra on a non-declared
        group (E over F_8 attacked over F_2^15), collapsed analogue c = 1
        against open analogue c = 5. (4) Hess 2003 and 2004 Theorem 7 at
        source.
      result: >-
        (1) On all twenty, p = n, k = 1, the "trace" is the identity and lands
        in K, whose order h l is divisible by l, so L4's hypothesis fails and
        the argument concludes nothing. (2) The committed code returns
        DEFINED_WITH_COMPUTED_COST on ten and OPEN_LARGE_GENUS_LAW on ten,
        never STRUCTURALLY_EMPTY. (3) The open analogue keeps 64 of 64
        order-l' points non-zero while the 5-term trace zeroes 64 of 64. (4)
        Hess's upper bound (s(h) = n leaves only 2-power torsion in the
        kernel) gives a non-zero image on the open cells.
      meets_failure_signature: true
    PTM-E:
      performed: true
      method: >-
        E176 and E272 at c = 2, (n, m, g) = (88 or 136, 8, 128): collapsed
        (period 8 < n), gcd(l, h) = 1 (audit), condition (7) false (Tr(A) = 1,
        n even, m != n), through the committed cell_verdict with counterfactual
        cost data swept: regime ratio in {0.01, 0.5, 1, 64}, cost_available in
        {true, false}, cond7 in {false, true}.
      result: >-
        STRUCTURALLY_EMPTY_COND_OB1 in all sixteen combinations for each row.
        Mutations: l_coprime missing gives OPEN_COLLAPSE_UNCERTIFIED, false
        gives OPEN_COLLAPSE_HYPOTHESIS_FAILS, a wrong collapsed flag gives
        OPEN_COND7_UNESTABLISHED; none reaches a cost verdict. Consistent with
        the Hess reading of OB-2 above and with MMT Remark 23 as the reading
        note quotes it.
      meets_failure_signature: true

  # ===========================================================================
  objections:
    - id: O-1
      severity: critical
      j3_item: (iv), (vi)
      breaking_artifact: a declared outcome no data can reach; an arm that does not reach its outcome as coded
      statement: >-
        ARM-C1-NEG cannot return REFUTED as coded. SR-1 stops at the first
        non-zero image and c1_negative returns INVALID below 64 samples, so
        F-1, the only falsification route of (C1') at toy scale, is
        unreachable, and a genuine refutation would be filed as INVALID.
      fix: >-
        Drop SR-1 (always draw 64), or make c1_negative read a stopped lane
        with n_nonzero >= 1, instrument PASS and CONTROL_PASS as REFUTED, and
        plant a REFUTED case the procedure can generate (n_samples 1,
        n_nonzero 1).
    - id: O-2
      severity: critical
      j3_item: (iv), (v)
      breaking_artifact: a degenerate declared lane not recorded as such; a test with no possible negative
      statement: >-
        All ten ARM-C1-NEG lanes are degenerate: eight by the Weil bound (the
        contract's own DG-3, applied only to positive lanes), two by Hess
        Theorem 8. "(C1') CONSISTENT AT TOY SCALE" would then be a statement
        about group sizes, not about the collapse mechanism or OB-1.
      fix: >-
        Apply DG-3 to negative lanes. For a test with a possible negative,
        choose non-declared collapsed lanes where l' divides #J_C(F_q) under
        Hess Theorem 8 (l' divides the order of a conjugate-sum subfield curve
        while l' does not divide h and does divide #E(K)/h), so Lagrange does
        not force the zero image that (C1') predicts. Otherwise re-scope
        ARM-C1 as an instrument check, drop F-1 and the toy-scale (C1')
        reading, and close OB-1 from Hess 2004 Theorem 7.
    - id: O-3
      severity: critical
      j3_item: (i), (v), (vi)
      breaking_artifact: a rule with a null false-fire rate above 5 percent; a degenerate declared lane not recorded as such
      statement: >-
        On TC-E the ARM-H2 walk is confined to a cyclic group of order
        l' = 14868569, which holds about 369 split elements and at most about
        100 distinct relations against 800 needed. SR-3 caps every replicate,
        and DR-H2 returns FALSIFIED in 300 of 300 runs under the random model
        the contract uses to justify H-DL-2 (H-DL-1 exact) applied to the
        declared procedure; the stated null "H-DL-2 exact" cannot be realised
        on this lane. Through ARM-COST's rule this would void the cost rows
        and send ten deployed small-genus cells to OPEN_COST_UNAVAILABLE. If repeats
        are counted instead, the count completes on a rank-deficient relation
        set. No ARM-H2 degeneracy verdict exists in C-7.
      fix: >-
        Walk in the full Jacobian or in a group of order much larger than the
        trial count (for example by adding random factor-base combinations),
        deduplicate relations, and add an admission rule
        (l'/g!) P(<= 2 large primes) >= c (|F| + 10) per lane.
    - id: O-4
      severity: major
      j3_item: (i), (vii)
      breaking_artifact: >-
        a heuristic whose arm cannot reach its declared outcome; a rule whose
        null false-fire rate is computed only under a null that assumes the
        law under test
      statement: >-
        H-DL-2's constant kappa is false under the contract's own random model
        at the declared q (factor-base coverage 0.65 to 0.84); the slope is
        1.349 and DR-H2 VALIDATED is unreachable (INCONCLUSIVE in 2000 of
        2000). Sensitivity, disclosed: this uses |X| about q/2 x-coordinates
        carrying a rational point, which follows from #C(F_q) = q + 1 (Hess
        Theorem 8) and the one-place-per-x factor base; with |X| = q/2 + 8 the
        slope is 1.332. Were |X| all of F_q (not the case for a hyperelliptic
        model) the slope would be 1.616 and VALIDATED reachable, with kappa
        still drifting 0.4 bit. The C-5 null for DR-H2 and SR-3 is the law
        itself, so the stated false-fire rates and power do not describe the declared
        procedure. TA-2's anticipated drift direction is the opposite of the
        model's.
      fix: >-
        Restate H-DL-2 with the finite-size factor-base term (or fix rho
        across q), calibrate DR-H2 on the procedure's own random model (M2 in
        computations.json), and state TA-2 with the computed drift.
    - id: O-5
      severity: major
      j3_item: (vii)
      breaking_artifact: a heuristic with an arm that cannot fail
      statement: >-
        The tail half of H-DL-1's formal statement (root-count law within
        total variation 0.02; 2-smooth fraction within 0.5 bit) has no
        falsifying outcome as coded: h1_outcome maps TAIL_FAIL to
        INCONCLUSIVE.
      fix: Map TAIL_FAIL to FALSIFIED, or remove the tail clauses from H-DL-1's formal statement.
    - id: O-6
      severity: moderate
      j3_item: (i), (vii)
      statement: >-
        DR-H1's Wilson interval uses n = S although the samples range over a
        group of order l' < S on TC-E (variance inflation 2.13); and the null
        curve is not of the cover's shape (trace term; unbounded population).
        False-fire stays below 5 percent under the coded strict rule.
      fix: >-
        Use n_eff = (1/S + 1/l')^(-1), or lanes with l' much larger than S;
        compare the null on a curve with a_1 = 0 or condition on its trace.
    - id: O-7
      severity: moderate
      j3_item: (ii)
      statement: >-
        OB-1 and OB-2 are dischargeable at source (Hess 2003 Theorems 4, 7, 8;
        Hess 2004 Theorem 7 with its proof via Theorem 18), and the record's
        stated failure mode for OB-1 (the alternating-sum case "would fail") is
        contradicted at source. Not a DC-H1 defect; the record misstates where
        (C1') could break.
      fix: >-
        A new record citing Hess at retrieved provenance; supersede the
        remark_where_it_breaks and where_it_could_break text.
    - id: O-8
      severity: minor
      j3_item: (iv)
      statement: >-
        ARM-C1-INSTR passes a zero map and the positive control is not
        lane-matched, so nothing certifies the instrument on collapsed lanes.
        Moot while O-2 stands.
    - id: O-9
      severity: minor
      j3_item: (vi)
      statement: >-
        Planted REACH overstates reachability: REFUTED (ARM-C1-NEG) and
        VALIDATED (ARM-H2) are planted with inputs the procedure cannot
        generate; NO_DESCENT_G1 needs KOBLITZ-176 ARM-CELL lanes absent from
        the coded grid; three ARM-CELL outcomes and NOT_ADMITTED are guards
        unreachable from declared inputs.
    - id: O-10
      severity: minor
      j3_item: (ii)
      statement: >-
        OB-1 is universal rather than per cell; OB-2 is missing from the
        twelve affected labels; BASELINE_C16 cells carry _COND_OB1 needlessly.
    - id: O-11
      severity: minor
      j3_item: (ii)
      statement: L3 leaves the injectivity of the constant-field conorm on Cl^0 implicit.

  required_controls:
    - >-
      A power line for DR-C1 in C-5: the alternative "(C1') false on the lane"
      run through SR-1 and c1_negative, which must reach REFUTED.
    - >-
      DG-3 on every negative lane, and at least one collapsed toy lane (not a
      declared cell at any field size) where l' divides #J_C(F_q).
    - >-
      A null of the same shape for ARM-H2: the declared procedure under its
      own random model, with the walk confined exactly as specified (M2, M3).
    - An ARM-H2 admission rule on the subgroup pool against |F| + 10, per lane.
    - A falsifying outcome for the H-DL-1 tail, or its removal from the formal statement.

  counterexample_or_mutation: >-
    One line of the committed code: c1_negative(1, 1, PASS, CONTROL_PASS)
    returns INVALID. One parameter comparison: on TC-E, l'/8! = 369 split
    elements against |F| + 10 = 800 relations needed. One Weil bound: genus 2
    over F_2 gives #J at most 2^5.09 against l' >= 2^11.63.

  baseline_comparison: >-
    Not applicable to J3 (no rho, BSGS or cost comparison is in this joint;
    the cost model and VOW accounting are J4's).

  heuristic_challenges:
    - >-
      H-DL-1: the tail statement is unfalsifiable as coded (O-5); the null is
      not of the cover's shape and the bulk interval is anti-conservative on
      TC-E (O-6); the finite-q random-model law itself is accurate.
    - >-
      H-DL-2: the random-model justification uses |F|/q where the procedure
      needs |F|/|X|, and the law is derived for small coverage while the
      declared q sit at 0.65 to 0.84; under the contract's own random model
      kappa is not constant (O-4); the walk exhausts TC-E (O-3).
    - H-0e3641-1: validly retired by M5.

  cost_model_challenges:
    - >-
      J3-relevant uncharged terms only (the cost table is J4's): the order l'
      of the group the H1 and H2 samples range over, absent from the H1
      interval and the H2 relation budget; duplicate relations from sampling
      with replacement in that group; and the factor-base coverage rho folded
      silently into a "constant" kappa.

  reduction_and_scope_challenges:
    - >-
      Reduction instantiation: (C1') is a special case of Hess 2004 Theorem 7
      (V != {1}, large prime factor absent from Cl^0((E_h)^V)); its hypotheses
      transfer to all twenty-five collapsed cells given gcd(l, h) = 1 and the
      OB-2 dichotomy above.
    - >-
      Transfer: TA-2 spans 31 to 82 bits of log2 q and a regime change in
      factor-base coverage (0.65 to 0.84 at toy q, 0.001 to 0.044 at deployed
      q); TA-3 is structurally supported by Hess Theorem 8 (both toy and
      deployed OPEN_N4 covers factor as two Weil restrictions from F_(q^4)).

  proof_architecture_challenges:
    - kind: observation-fiber
      finding: >-
        On the negative lanes the observation "zero image" has preimages on
        both sides of (C1') (any genus-g curve over F_q gives it); the missing
        separator is a lane where J_C(F_q) has l'-torsion.
    - kind: quantifier-order
      finding: >-
        None found in (C1'); the toy cells were fixed by C-7 before any
        statistic, but the ARM-H2 cells were fixed without a pool check.
    - kind: method-ceiling
      finding: >-
        The toy (C1') arm's ceiling is an instrument check; it cannot reach
        evidence about the mechanism on the declared lanes.
    - kind: nearby-object
      finding: random genus-2 curve over F_2 (iv nearby_object)
    - kind: compositional-invariant
      finding: >-
        Deleting the order-n condition from OB-1 does not break the
        conclusion (Hess: the discrete logarithm problem is then not
        preserved at all); the record's stated failure mode is wrong (O-7).

  breakthrough_tier_explicit:
    cheapest_falsification: >-
      Of the joint: zero-compute. Call c1_negative(1, 1, PASS, CONTROL_PASS)
      on the committed code (INVALID), and compare l'/8! with |F| + 10 on TC-E
      (369 against 800); the M3 simulation then shows FALSIFIED in 300 of 300
      in a few minutes of synthetic compute. Of (C1') at toy scale, the cheapest experiment
      with a possible negative: on a non-declared toy curve choose a collapsed
      lane whose J_C(F_q) has l'-torsion by Hess Theorem 8, and check that the
      image of E(K)[l'] is still zero.
    uncharged_terms_found:
      - the order l' of the sample group in ARM-H1 and ARM-H2
      - duplicate relations under sampling with replacement in that group
      - factor-base coverage rho absorbed into kappa
      - the null curve's Frobenius-trace term (absent from the cover)
    null_and_nearby_object_controls:
      checked:
        - ARM-H1 null (present; not the same shape)
        - ARM-C1-POS (present; can fail)
        - ARM-C1-NEG nearby object (random genus-2 curve over F_2; same zero)
        - PTM-B (open cells; meets signature)
        - PTM-E (E176, E272 at c = 2; meets signature)
      missing:
        - a null of the same shape for ARM-H2 (C-5's is the law itself)
        - an alternative-hypothesis line for DR-C1
        - a negative lane where the zero image is not forced by group order
    survival_statement: >-
      The (C1') argument survived every attack and is a theorem at source
      (Hess 2004 Theorem 7); PTM-B and PTM-E hold. J3 did not survive: the
      decision rules and arms as frozen cannot falsify (C1') at toy scale,
      cannot validate H-DL-2 under the contract's own random model (given
      |X| about q/2), and falsify it by artifact on TC-E.
    remaining_uncertainty: >-
      O-3 is robust to the root distribution: it needs only split probability
      near 1/8! and l' as frozen; even at the H-DL-1 edge (+0.5 bit) TC-E's
      group holds about 521 split elements against 800 relations needed. O-4's
      slope (1.35) depends on the uniform-root model and on |X| about q/2 (1.33
      at q/2 + 8; 1.62, with VALIDATED then reachable, only if every
      x-coordinate carried a point, which a hyperelliptic model with
      #C(F_q) = q + 1 excludes); that kappa drifts while coverage is 0.65 to
      0.84 holds in every variant (by 1.2 bit at q/2, 0.4 bit at q). The Hess
      reading rests on author-hosted and IACR PDFs through a stdlib extractor that loses symbols; theorem wording is
      legible and the excerpts are embedded. e = v_2(n) in MMT (9) is an
      inference. The IR-4 realistic-null row is a Gaussian approximation with
      a recalled scale.

  narrowest_supported_statement: >-
    As frozen by TASK-20261002-ffb7bb, J3 breaks: ARM-C1-NEG cannot return
    REFUTED (coded stopping rule) and its ten lanes are degenerate by group
    order; ARM-H2's SR-3 fires on 100 percent of runs on TC-E under the random
    model the contract uses to justify H-DL-2 (H-DL-1 exact) applied to the
    declared procedure, and its VALIDATED outcome is unreachable under that
    model given |X| about q/2 x-coordinates with points (O-4 sensitivity);
    the H-DL-1 tail cannot fail. (C1')'s lemmas L1 to L4 and L6
    are correct, OB-1 and OB-2 are dischargeable from Hess 2003 and 2004 at
    retrieved provenance, and PTM-B and PTM-E meet their failure signatures.
    Nothing here concerns any curve's security or any cost comparison.

  next_concrete_action: >-
    A revision design card (K-revise-defect, if the composer so rules) that
    fixes O-1 to O-5 in decision_rules, null_calibration, toy_admissibility
    and the ARM-C1 and ARM-H2 designs, and a separate reading record that
    cites Hess 2003 Theorems 4, 7, 8 and Hess 2004 Theorems 7, 11, 18 at
    retrieved provenance for OB-1 and OB-2.

