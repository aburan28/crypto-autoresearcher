          {4, 8} cell, and the role-keyed C-7 lines agree (OPEN_N4 m = 4 on
          TC-A, TC-B, TC-C, TC-E and TC-F). At d = 16 it would select the
          OPEN_N8 lane. This is the pattern the rule exists to exclude.
      - id: J2-B3
