          Lemma 6"; OB-2 dependent_statements) but never computes it. OB-2 gives
          the reason "the exponent e in (9) is not defined within the read
          extent, so (9) is not evaluable here". At source, Definition 4 on
          printed page 6, inside the read extent of pages 1 to 19, defines it
