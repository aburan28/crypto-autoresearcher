        stage0_census.magic_number_span returns j (MMT Theorem 5(i) with n a
        power of 2), and on non-power-of-2 lanes it equals deg Ord + [j_0 = 0]
        on random elements. toy_admissibility.level (domain F_(2^d)) was run on
        F_(2^16) for twelve values of c, including c > 16 (the c mod d
        reduction).
