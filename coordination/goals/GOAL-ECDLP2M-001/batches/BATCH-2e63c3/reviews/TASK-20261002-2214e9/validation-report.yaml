      attack: plan J1 (iii)
      fields_used: >-
        F_(2^D) for D in {16, 48, 64, 80, 96, 112}, with moduli 0x1002b,
        0x100000000002d, 0x1000000000000001b, 0x100000000000000000215,
        0x1000000000000000000000641 and 0x10000000000000000000000000039, each
