    controls:
      method: >-
        Mutation test of the committed census (controls_mutation_test in
        computations.json). The pinned stage0_census block was loaded unedited,
        seven plausible defects were monkeypatched one at a time, C-3 was rerun
        on the same inputs, and each control's printed outcome was read back
        against its stated expectation. Defects are M-A m = n always; M-B the
        leading (1, .) coordinate dropped; M-C Frobenius off by one; M-D
        divisors() drops 1; M-E absolute trace forced to 0; M-F m - 1; M-G
        smallest_subfield always N.
