    breaking_artifacts:
      - id: J2-B1
        plan_artifact: the end-to-end dry call (C-6) covers the full declared name grid; every declared cell, arm and lane is selected in code by role or name
        finding: >-
          The specification's ARM-CELL declares its cells as "every deployed
