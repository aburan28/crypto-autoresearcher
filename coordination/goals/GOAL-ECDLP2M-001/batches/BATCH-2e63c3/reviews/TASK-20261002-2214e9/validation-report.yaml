          census keys them BASELINE_C1, COLLAPSED_C2 ... COLLAPSED_C88 and
          IDENTITY, and carries deployed declared_role names beside them. The
          other 95 triples match the specification exactly.
        measured_consequence: >-
          Fed through the dry call's role-keyed planted inputs under either
          available naming, the KOBLITZ lanes come out
          STRUCTURALLY_EMPTY_COND_OB1, OPEN_LARGE_GENUS_LAW or
          DEFINED_WITH_COMPUTED_COST. Fed their census values by the
          specification's ARM-CELL recipe, the committed cell_verdict returns
          NO_DESCENT_G1 on the nine non-identity lanes and IDENTITY_NO_DESCENT on
          c = 176. The decision function handles them; the grid, the naming and
          the wiring do not. The PTM-C judgment is J4's; this is a wiring
          finding only.
