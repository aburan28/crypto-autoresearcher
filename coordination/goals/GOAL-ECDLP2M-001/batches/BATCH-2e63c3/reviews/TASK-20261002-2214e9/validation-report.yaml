        d in {2, 4, 8}) or a deployed row field. Only field elements were built;
        no curve, point or group.
      construction: >-
        For n = D/c a power of 2, a normal theta (with (sigma + 1)^(n-1) theta
        != 0) gives b_j = (sigma + 1)^(n-j) theta + (sigma + 1)^(n-j+1) rho of
        exact level j. Exactness was checked independently before use, for
        every j from 0 to n.
      checked: >-
