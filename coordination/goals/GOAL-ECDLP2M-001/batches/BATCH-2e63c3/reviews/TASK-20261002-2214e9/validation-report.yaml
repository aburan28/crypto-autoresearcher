      design_time_groups_or_curves: >-
        C-3 uses the five deployed rows, the two prime rows, KOBLITZ-176 (B = 1),
        B8-176 (B' in F_(2^8) minus F_(2^4)) and UNIFORM-176 (32 B' each
        generating F_(2^176)), by coefficient arithmetic only. C-4, C-5 and C-6
        use no curve or group. C-7 uses the declared toy cells themselves, by
        admissibility arithmetic only (allowed). C-8 uses the seven named curves
        by parameter dump only.
      coincidence_test: >-
        A curve y^2 + xy = x^3 + b coincides with a toy cell's curve at some
        field size (up to isomorphism or Galois conjugation) only if b is a
        Frobenius conjugate of the cell's B, that is, only if they share an
        algebraic minimal polynomial over F_2. Deployed B have smallest subfield
        F_(2^16), the prime rows F_(2^191) and F_(2^239), and UNIFORM draws
        F_(2^176); none lies in F_(2^8). KOBLITZ has minimal polynomial x + 1.
        B8-176's B' has minimal polynomial x^8 + x^7 + x^6 + x + 1, while TC-C's
        B has x^8 + x^5 + x^4 + x^3 + 1. They differ, which is stronger than the
        producer's absolute-trace argument (1 against 0), and agrees with it.
      result: no design-time group or curve coincides with a declared toy cell's group at any field size
