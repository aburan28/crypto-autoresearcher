        its condition), confounders 1 and 2, predictions
        artin_schreier_level_m_per_live_lane, heuristic_note (the generic
        m = n expectation), and DEC-20260924-99ce20 HOLD-H evidence ("the genus
        values came through a summariser").

    RA-Q4:
      question: >-
        Does the body state a memory-charged comparison against parallel
        collision search (the van Oorschot-Wiener verdict), and what does it
        say?
      answer: >-
        NOT STATED. The pages read contain no memory-charged comparison of
        Enge-Gaudry against parallel rho, no VOW-style accounting of the
        index-calculus arm, and no time-memory tradeoff. HOLD-H's remaining
        uncertainty on the VOW verdict is not reduced by the source.
      what_the_source_does_state:
        - pointer: section 4.1, page 7
          quote: >-
            "Note that the algorithm can be effectively parallelized (see [27])
            so that its expected running time on a network of S processors is
            (sqrt(pi 2^{N-1}))/(2S)."
          note: >-
            [27] is van Oorschot and Wiener, "Parallel collision search with
            cryptanalytic applications", J. Cryptology 12 (1999) 1-28 (page
            24). The source cites it for rho's linear parallel speedup only.
        - pointer: Remark 9 ("EG1 versus EG2"), page 9
          quote: >-
            "The first variant, denoted by EG1, only works with a factor base
            whose size is upper bounded by 10^7 ~ 2^23, while the second
            variant, denoted by EG2, does not assume any upper bound on the
            factor base size. Note that a factor base of size 10^7 is on the
            edge of what is considered feasible today [22, 23]."
        - pointer: section 5, page 9
          quote: >-
            "Furthermore, we do not take into account the time spent on mapping
            the ECDLP instance to a HCDLP instance, and the time spent on the
            linear algebra stage of the Enge-Gaudry index-calculus algorithm."
        - pointer: Remark 18, page 13
          quote: >-
            "We emphasize that our statements about the failure of the GHS
            attack for all elliptic curves over some field F_{2^N} are under
            the assumption that the Enge-Gaudry algorithm is essentially the
            best index-calculus algorithm for the HCDLP, and, in particular,
            that the linear algebra stage is intractable if the factor base
            size is greater than 10^7."
        - pointer: section 8 (Conclusions), page 22
          quote: >-
            "Our analysis suggests that the five elliptic curves over
            F_{2^176}, F_{2^208}, F_{2^272}, F_{2^304} and F_{2^368} in ANSI
            X9.62 resist the GHS attack. We stress that any statement we have
            made regarding the failure of the GHS attack on some elliptic
            curves over some field F_{2^N} is dependent on the assumption that
            the Enge-Gaudry algorithm cannot be significantly improved, and, in
            particular, that the linear algebra stage is intractable if the
            factor base size is greater than 10^7."
      reading: >-
        The source's only resource charge on the index-calculus side is a
        feasibility cap on factor-base size (10^7, which stands in for the
        linear algebra). Its verdict on the five curves is conditional on that
        cap and on Enge-Gaudry being essentially optimal. It does not price
        memory against rho's distinguished-point table, and it does not address
        the parallel efficiency of the linear algebra. The record's predicted
        VOW verdict ("a wash or a loss on every row") is neither confirmed nor
        refuted by the source. Any extrapolation of the source's EG2 numbers to
        a VOW comparison is NOT supported by the source.
      informs: >-
        d11575 claim (C3), predictions factor_base_memory_entries_at_the_minimising_lane,
        target_complexity.tradeoff_note, dominated_by and sota_delta (whose
        memory and parallel accounting remains the record's own and unsourced),
        and HOLD-H remaining_uncertainty.

  # ---------------------------------------------------------------------------
  # Checks. Hand arithmetic only. No script was run, so no script or output
  # exists to embed (RA-6). Each check is labelled as a check and claims only
  # its arithmetic.
  checks:
    - id: CHECK-1
      what: cofactors, traces and the source's cofactor interval
      arithmetic: >-
        Source Table 2 cofactors: 65390, 65096, 65286, 65070, 65392. Record
        audit cofactors (d11575 citations): 65390, 65096, 65286, 65070, 65392.
        Equal. t = 2^16 + 1 - h = 65537 - h: 147, 441, 251, 467, 145, equal to
        the audit's t. Source interval [2^16 + 1 - 2^9, 2^16 + 1 + 2^9] =
        [65025, 66049], which contains all five.
      result: agreement
    - id: CHECK-2
      what: bit lengths of the source's prime r
      arithmetic: >-
        Hex digits of r as printed in Table 2, counted by hand: E176 41, E208
        49, E272 65, E304 73, E368 89 (the E368 value continues on a second
        printed line). Each leading digit is 1, so the bit lengths are
        4(d - 1) + 1 = 161, 193, 257, 289, 353. The record's audit gives 161,
        193, 257, 289, 353. Equal. A one-digit miscount would show as a 4-bit
        mismatch, and none appears.
      result: agreement
    - id: CHECK-3
      what: the source's rho column against CORR-20260922-81aeab, and the record's matched rho
      arithmetic: >-
        Identity: with k = N/16, sqrt(pi r / (4k)) = sqrt(4 pi r / N) =
        2 sqrt(pi r / N), which is the source's rho (page 16). log2 r was taken
        from the leading hex digits (log2 r = 4(d - 1) + log2(0x1xxxxx /
        0x100000)): 160.0032, 192.0097, 256.0055, 288.0103, 352.0032. Then
        log2 rho = 1 + (log2 pi + log2 r - log2 N) / 2, with log2 pi = 1.65150
        and log2 N = 7.45943, 7.70044, 8.08746, 8.24793, 8.52356, gives
        78.10, 93.98, 125.79, 141.71, 173.57. These round to the source's 78,
        94, 126, 142, 174. The record's formula 0.886 sqrt(l) / sqrt(2k) with
        l = 2^{s - 0.5} reproduces its printed 77.85 (printed 77.9), 93.73,
        125.53, 141.45, 173.31. That is 0.25 bit below the source-convention
        value at the source's r on every row: a -0.5 bit term from sqrt(2k)
        in place of sqrt(k), offset by +0.25 bit from taking l = 2^{s - 0.5}
        where l is about 2^{s - 1}.
      result: >-
        The source's rho convention is the CORR-20260922-81aeab convention. The
        record's printed matched rho is 0.2 to 0.3 bit below it at the
        source's r (0.25 bit before rounding). This is consistent with
        DEC-20260924-99ce20 check A4, which says the rows are 0.5 bit low at
        fixed l. Hand arithmetic to about 0.01 bit.
    - id: CHECK-4
      what: Theorem 5(i) specialised to n a power of 2
      arithmetic: >-
        For n = 2^e, x^n - 1 = (x - 1)^n over F_2, so s = 0 and Ord_b =
        (x - 1)^{j_0}. By Theorem 5(i), m(b) = j_0 + c, with c = 1 only if
        j_0 = 0, that is b = 0, which is excluded since b is in K*. So m = j_0,
        the least j with (sigma + 1)^j b = 0. sigma commutes with squaring, so
        (sigma + 1)^j b = 0 if and only if (sigma + 1)^j b^{1/2} = 0, and
        level(b) = level(b^{1/2}). m depends on b only. For b in F_q (the
        Koblitz case relative to F_2), sigma b = b, Ord_b = x - 1 and m = 1
        for every n.
      result: >-
        The record's m (level of B^{1/2}) equals the source's m in every
        class-B cell. The Koblitz m = 1 statement follows from the source's
        Theorem 5. This is a derivation, not a source sentence.
    - id: CHECK-5
      what: the record's (C2) lower bound from the source's Lemma 13 step and Remark 24
      arithmetic: >-
        In a class-B cell, c = jk with j dividing 16, q = 2^{jk} and n = 16/j,
        a power of 2. If m <= n/2 =: mu (a power of 2), then (sigma + 1)^mu b =
        sigma^mu b + b = 0 (characteristic 2), so b is in F_{q^mu} =
        F_{2^{jk mu}}. Also b is in F_{2^16}, so b is in F_{2^{gcd(16, jk mu)}},
        and gcd(16, jk mu) divides j mu <= 8 because k is odd. Hence b is in
        F_{2^8}, which contradicts Remark 24 ("b in F_{2^16} \ F_{2^8}"). So
        m >= n/2 + 1. The step b in F_{q^mu} is the step of the source's Lemma
        13 proof (page 11), specialised. Table 3's m values satisfy the bound
        in all 20 cells: n = 2 gives 2 >= 2; n = 4 gives 4 >= 3; n = 8 gives
        8, 7, 8, 8, 7 >= 5; n = 16 gives 16, 14, 16, 16, 13 >= 9.
      result: >-
        The record's (C2) is consistent with the source's statements and
        values. It is the source's Corollary 14 applied with the audited bit.

