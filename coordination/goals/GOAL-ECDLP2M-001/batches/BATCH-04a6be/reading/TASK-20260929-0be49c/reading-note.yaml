    RA-Q2:
      question: >-
        State the Hess obligation. Which hypothesis of Hess's generalisation
        does (C1) rely on, and does the MMT body address the collapsed case?
        Was Hess read at source?
      hess_read_at_source: >-
        NO. Impediment IMP-3. The body of Hess 2003 and Hess 2004 was not read.
        Only the abstract was obtained, through a summariser (S4), and it
        states no hypotheses. Every statement below about what Hess's theorem
        assumes is either a source statement of MMT or an inference marked as
        one. The Hess content stays recalled and abstract level, as in
        KN-LIT-6987.
      obligation_as_recorded: >-
        From d11575 proof_obligations[0]: "Hess's theorem (KN-LIT-6987) that
        the large cyclic factor is not in the conorm-norm kernel has hypotheses
        that exclude the collapsed case c | 16. If it does not, (C1) is false."
        The record's citation entry adds: "if Hess's theorem is unconditional
        then (C1) is FALSE and this record fails".
      hypothesis_named_by_the_source: >-
        The source names the hypothesis under which the large subgroup is
        expected to avoid the kernel. E must not be defined over a proper
        subfield of F_{q^n} containing F_q, which is the same as
        F_q(a, b) = F_{q^n}. Remark 2 (page 6) relays it from GHS [17]: "In
        [17] it is argued that it is highly unlikely that the kernel of phi
        will contain the subgroup of order r of E(F_{q^n}) unless E is defined
        over a proper subfield of F_{q^n} containing F_q." Remarks 21 and 22
        (pages 14 and 16) restate it with F_q(a, b) and attribute the
        subfield-independence fact to Hess [19] (personal communication,
        September 2001).
      does_the_body_address_the_collapsed_case: >-
        YES, directly. Remark 21 states the zero-divisor outcome for subfield
        curves. Section 6 (page 14) applies it to the ANSI curves: "In fact,
        the opposite is true." Page 17 and Remark 24 cover all l in
        {1, 2, 4, 8, 16}. Remark 23 reports a computation on E176 and E272 at
        l = 2 in which the order-r subgroup lies in the kernel of phi.
      what_follows_for_the_obligation:
        - kind: source statement
          text: >-
            The non-kernel property is stated in the source (relaying GHS [17]
            and Hess [19]) under the hypothesis F_q(a, b) = F_{q^n}. The
            collapsed case is the stated exception.
        - kind: inference from the source, not a reading of Hess
          text: >-
            Remark 23 reports a computed descent in which the order-r subgroup
            of E176 (and of E272) lies in the kernel. An unconditional
            non-kernel theorem would contradict that reported computation. So
            if Hess's later theorem is correct and the computation is correct,
            the theorem must carry a hypothesis that excludes at least these
            subfield descents. The record's falsification condition ("Hess's
            theorem turns out to be unconditional") is therefore in tension
            with a published computation. It is not discharged by a reading of
            Hess.
        - kind: what this note cannot say
          text: >-
            The exact form of Hess's hypothesis (for example F_q(a, b) =
            F_{q^n}, or a condition on the Artin-Schreier extension or on the
            minimal polynomial of b) is not known here. The second proof
            obligation of d11575 (the grouping of the Galois sum by residue
            class mod 16/c) is not addressed in that form in the pages read.
      informs: >-
        d11575 proof_search_map.proof_obligations[0] and [1], the
        falsification_conditions entry on Hess, the citations entry for
        KN-LIT-6987, and the citation_note.

    RA-Q3:
      question: >-
        Compare the genus values the record relayed through a summariser with
        the MMT body's genus formula and tables, row by row.
      formula_comparison:
        record_relayed: >-
          From d11575 citations (Smart's Weil Descent page, through a fetch
          summariser): genus 2^{m-1} or 2^{m-1} - 1, with m the "magic
          number"; and "Koblitz curves have m equal to one, making them
          resistant to the GHS attack across all fields".
        source_statement:
          pointer: Theorem 1 (Gaudry, Hess and Smart [17]), section 3, page 5
          quote: >-
            "Let the magic number for E relative to n be m = m(b) =
            dim_{F_2}(Span_{F_2}{(1, b_0^{1/2}), (1, b_1^{1/2}), ...,
            (1, b_{n-1}^{1/2})}). (6) Assume that n is odd, or m(b) = n, or
            Tr_{K/F_2}(a) = 0. (7) Then the GHS attack constructs an explicit
            group homomorphism phi : E(F_{q^n}) -> J_C(F_q), (8) where C is a
            hyperelliptic curve defined over F_q of genus g = 2^{m-1} or
            2^{m-1} - 1."
          weakened_condition:
            pointer: Lemma 6, page 6
            quote: >-
              "In Theorem 1, condition (7) can be replaced by the following,
              weaker, condition: n is odd, or 2^e = j_0, or Tr_{K/F_2}(a) = 0.
              (9)"
          m_via_type:
            pointer: Definition 4 and Theorem 5 (Menezes-Qu [26]), page 6
            quote: >-
              "For b in F_{q^n}, let Ord_b(x) be the unique polynomial f in
              F_2[x] of least degree such that f(sigma)b = 0 [...] (i) Then
              m(b) = sum_{i=0}^{s} j_i d_i + c, where c = 1 if j_0 = 0, and
              c = 0 if j_0 != 0."
        agreement: >-
          The genus formula agrees with the record's relayed formula. The
          source attaches a condition, (7) or the weaker (9), that the record
          never states. By Remark 25 the condition holds for the ANSI curves in
          Table 3's descents (quoted under RA-Q1, class B). The Koblitz
          sentence does not appear in the pages read (a search of the file for
          "Koblitz" found nothing). Its content follows from Theorem 5(i) by
          CHECK-4, a derivation and not a source statement.
        convention_confounder: >-
          The record's confounder about conventions for m (the level of B^{1/2}
          against the level of B, or a definition that involves A) is moot for
          the source's definition. CHECK-4 shows m = j_0 = level(b) =
          level(b^{1/2}) when n is a power of 2, and m does not depend on a.
          The coefficient a enters only through condition (7) or (9).
        branch_confounder: >-
          The record's confounder about 2^{m-1} against 2^{m-1} - 1 is resolved
          at source for the 15 class-B cells with m < 13: g = 2^{m-1} in every
          case (page 16). It stays open for the 5 cells of the n = 16 lane.
      row_by_row:
        note: >-
          The record's values are its (C2) ranges and its generic m = n values
          ((C3) and heuristic_note). The source's values are from Table 3. The
          "record (C2) bound holds?" column checks the source's m against the
          record's n/2 + 1 <= m <= n.
        rows:
          - curve: E176
            n2: {record_g: '2 (forced)', source_m: 2, source_g: '2', agree: true}
            n4: {record_g: 'generic 8; range 4 or 8', source_m: 4, source_g: '8', agree: true}
            n8: {record_g: 'generic 128; range 16 to 128', source_m: 8, source_g: '128', agree: true}
            n16: {record_g: 'generic 32768; range 256 to 32768', source_m: 16, source_g: '2^15 or 2^15 - 1', agree: 'yes on m; g branch undetermined in source'}
            record_C2_bound_holds: true
          - curve: E208
            n2: {record_g: '2 (forced)', source_m: 2, source_g: '2', agree: true}
            n4: {record_g: 'generic 8; range 4 or 8', source_m: 4, source_g: '8', agree: true}
            n8: {record_g: 'generic 128; range 16 to 128', source_m: 7, source_g: '64', agree: 'DISAGREES with generic value 128; inside the record range'}
            n16: {record_g: 'generic 32768; range 256 to 32768', source_m: 14, source_g: '2^13 or 2^13 - 1', agree: 'DISAGREES with generic value 32768; inside the record range'}
            record_C2_bound_holds: true
          - curve: E272
            n2: {record_g: '2 (forced)', source_m: 2, source_g: '2', agree: true}
            n4: {record_g: 'generic 8; range 4 or 8', source_m: 4, source_g: '8', agree: true}
            n8: {record_g: 'generic 128; range 16 to 128', source_m: 8, source_g: '128', agree: true}
            n16: {record_g: 'generic 32768; range 256 to 32768', source_m: 16, source_g: '2^15 or 2^15 - 1', agree: 'yes on m; g branch undetermined in source'}
            record_C2_bound_holds: true
          - curve: E304
            n2: {record_g: '2 (forced)', source_m: 2, source_g: '2', agree: true}
            n4: {record_g: 'generic 8; range 4 or 8', source_m: 4, source_g: '8', agree: true}
            n8: {record_g: 'generic 128; range 16 to 128', source_m: 8, source_g: '128', agree: true}
            n16: {record_g: 'generic 32768; range 256 to 32768', source_m: 16, source_g: '2^15 or 2^15 - 1', agree: 'yes on m; g branch undetermined in source'}
            record_C2_bound_holds: true
          - curve: E368
            n2: {record_g: '2 (forced)', source_m: 2, source_g: '2', agree: true}
            n4: {record_g: 'generic 8; range 4 or 8', source_m: 4, source_g: '8', agree: true}
