  notation_map:
    note: >-
      The source and the record use different letters. Every pointer below uses
      this map. The letter l is a trap: the source's l is the base-field degree,
      and the record's l is the prime subgroup order.
    rows:
      - source: N (extension degree)
        record: N = 16k
      - source: p, with N = 16 p and p prime (section 6)
        record: k
      - source: l, with q = 2^l (base field F_q of the descent)
        record: c
      - source: n = N / l
        record: n = N / c
      - source: r (the large prime dividing the group order of E)
        record: l (prime subgroup order)
      - source: a, b (y^2 + xy = x^3 + a x^2 + b)
        record: A, B
      - source: m (magic number relative to n, Theorem 1 formula (6))
        record: m (Artin-Schreier level of B^{1/2})
      - source: rho = 2 sqrt(pi r / N) (section 6, page 16)
        record: matched rho, corrected convention sqrt(pi l / (4k)) of CORR-20260922-81aeab
      - source: E176, E208, E272, E304, E368 (Table 2)
        record: c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1
    curve_identification: >-
      The source does not use the c2pnb names. Its Table 2 (page 15) gives, for
      each N, the curve's cofactor 65390, 65096, 65286, 65070, 65392 and a = 0
      for E208. These match the record's audit values exactly (CHECK-1), and the
      prime orders have 161, 193, 257, 289 and 353 bits (CHECK-2). The
      identification rests on that agreement.

  # ---------------------------------------------------------------------------
  answers:
    RA-Q1:
      question: >-
        Which of the record's cells (25 derived empty, 20 open), or which
        classes of them, does the body settle, by which theorem, table, remark
        or computation?
      cell_accounting: >-
        The record's table is 5 rows by 10 divisors c of N = 16k. The 25
        "derived empty" cells are c in {1, 2, 4, 8, 16} on every row. The 20
        "open" cells are c in {k, 2k, 4k, 8k} on every row, which are the
        source's descents with n in {16, 8, 4, 2}. The remaining 5 cells
        (c = 16k, n = 1) are the identity and are neither.
      summary: >-
        The body settles the CONCLUSION for all 25 derived-empty cells. Its
        class argument says the large prime-order subgroup maps to the zero
        divisor (Remark 21, section 6). It confirms this by computation on 2
        of the 25 cells (Remark 23), and it gives a second, independent size
        obstruction for the other 23 (page 17), without per-cell values. The
        body settles the CENSUS quantities (n, m and g) for all 20 open cells
        in Table 3, with g exact on 15 of them. The body does NOT settle the
        record's cost columns: the GTTD time exponent, the charged factor-base
        memory, the van Oorschot-Wiener (VOW) comparison and the ratio to
        matched rho with linear algebra included. The source uses a different
        cost model, Enge-Gaudry relation gathering only, which excludes the
        linear algebra and the descent map. The c = 16k cells are outside the
        source's tables (Algorithm 10 runs over divisors n >= 2).
      classes:
        - class: A, the 25 derived-empty cells (c divides 16; the source's l in {1, 2, 4, 8, 16}; n = 16k / c, divisible by k)
          settled: >-
            Yes as a stated conclusion, on all 25 cells. Computed on 2 cells
            (E176 and E272 at c = 2). The other 23 are not tabulated
            individually in the pages read.
          pointers:
            - pointer: section 6, page 14, paragraph after Table 2 is introduced
              quote: >-
                "Notice that in all cases the coefficients a and b lie in the
                proper subfield F_{2^16} of F_{2^N}, whence #E(F_{2^N}) = rd
                with r prime and d in [2^16 + 1 - 2^9, 2^16 + 1 + 2^9]. For a
                curve defined over a proper subfield of F_{q^n} containing F_q,
                it cannot be argued that the kernel of the map phi defined in
                (8) would not contain the large subgroup of order r of
                E(F_{q^n}). In fact, the opposite is true."
            - pointer: Remark 21 ("failure of GHS-attack for subfield curves"), page 14
              quote: >-
                "Let F_q(a, b) be the smallest extension of F_q over which E is
                defined. Then for any extension field K of F_q(a, b) the GHS
                Weil descent of E/K down to F_q is independent of K. That is,
                the GHS Weil descent of E/K down to F_q yields the same (upto
                birational equivalence) hyperelliptic curve C/F_q as the GHS
                Weil descent of E/F_q(a, b) [19]. [...] Thus, if F_q(a, b) !=
                F_{q^n}, only points in the small subgroup E(F_q(a, b)) of
                E(F_{q^n}) are likely to be mapped to non-trivial divisors in
                the Jacobian J_C(F_q), while points in the subgroup of order r
                will be mapped to the zero divisor, which is of no use for
                solving ECDLPs in E(F_{q^n})."
              note: >-
                Reference [19] is "F. Hess. Personal communication. September
                2001." (page 23). The independence-of-K fact is therefore
                attributed and not proved in the body.
            - pointer: Remark 22 and the criterion after it, pages 14 and 16
              quote: >-
                "If F_q(a, b) = F_{q^n}, the same arguments as in the
                non-subfield case apply, and the GHS Weil descent should yield
                a map phi whose kernel does not contain the subgroup of order
                r. Let n* be the smallest integer such that a, b in
                F_{2^{n*}}. Then, with q = 2^l, we have that F_q(a, b) =
                F_{q^n} if and only if lcm(n*, l) = N. For the curves given in
                Table 2, n* = 16 and p = N/n* is prime. Remarks 21 and 22 imply
                that we need to analyze exactly those descents from F_{q^n}
                down to F_q for which gcd(n, p) = 1."
              class_membership: >-
                For c dividing 16, lcm(16, c) = 16 < N, so every class-A cell
                is a subfield-curve descent in the sense of Remark 21. For
                c = jk with j dividing 16, lcm(16, jk) = 16k = N, so every
                class-B cell falls under Remark 22. The mapping is arithmetic
                on the quoted criterion.
            - pointer: page 17, first paragraph
              quote: >-
                "Regardless of the fact that phi maps points in the large
                prime-order subgroup of E(F_{q^n}) to the zero divisor (class)
                of the resulting Jacobian of the hyperelliptic curve, we
                determined the attack data also for those descents where
                gcd(n, p) > 1, i.e., where l = 2^i for i in {0, 1, 2, 3, 4}. We
                found that in all except two cases either the m-values are too
                small for the Jacobians to potentially contain the large
                prime-order subgroup (see also Remark 24), or the genera of the
                hyperelliptic curves are larger than 2^12 - 1 and thus too
                large for the resulting HCDLP to be feasible. The two
                exceptions to this are E176 with (n, m, g) = (88, 8, 128) and
                E272 with (n, m, g) = (136, 8, 128), for which we would have
                the following attack data if the GHS descent were not doomed to
                fail due to the reasons given in Remark 21."
              note: >-
                The page then tabulates the would-be data for those two
                cells. They are record cells (E176, c = 2) and (E272, c = 2).
                The source labels the numbers counterfactual ("doomed to
                fail"). They are not reproduced as figures here, because the
                source's own Remark 23 says they do not apply.
            - pointer: Remark 23 ("failure of the GHS attack for E176 and E272"), page 17
              quote: >-
                "When evaluating the mapping phi : E(F_{2^176}) -> J_C(F_{2^2})
                (where E = E176) constructed by the GHS attack we found that
                the large subgroup <P> of prime order r ~ 2^160 is contained in
                the kernel of phi, and thus is of no use for solving ECDLPs in
                E(F_{2^176}). The same situation was observed with the mapping
                phi : E(F_{2^272}) -> J_C(F_{2^2}) for E = E272."
            - pointer: Remark 24 ("m values for the cases l = 1, 2, 4, 8, 16"), page 17
              quote: >-
                "Suppose that l in {1, 2, 4, 8, 16}, and let sigma : alpha ->
                alpha^{2^l} be the Frobenius map on F_{2^N}. Then, since b in
                F_{2^16} \ F_{2^8}, we have that (sigma + 1)^{16/l} b = 0 but
                (sigma + 1)^{8/l} b != 0. Thus we expect that 8/l < m <= 16/l."
              note: >-
                This is the source's statement of the record's single audited
                bit (B is not in F_{2^8}) for all five curves. At l = 16 it
                gives m = 1, which is the record's baseline-embedding
                expectation (m = 1, g = 1 at c = 16). The source says "expect".
          relation_to_record: >-
            The record's (C1) reaches the same conclusion (a zero image of the
            order-l subgroup for every c dividing 16) by its own elementary
            argument: the Galois sum factors through the subfield trace, and
            pi_q acts on the prime subgroup with eigenvalue lambda,
            lambda^k = 1, lambda != 1. The source gives the conclusion through
            Remark 21, which rests on Hess [19], and through a computation on
            two cells. The trace-eigenvalue derivation does not appear in the
            pages read. Whether it appears in GHS 2002 or in Hess 2003/2004 was
            NOT checked (IMP-3).
        - class: B, the 20 open cells (c in {8k, 4k, 2k, k}; the source's n in {2, 4, 8, 16})
          settled: >-
            Census quantities: yes. Table 3 gives m on all 20 cells and g on
            all 20. g is exact on the 15 cells with m < 13 (reductions
            performed). On the 5 cells of the n = 16 lane the source leaves g
            as 2^{m-1} or 2^{m-1} - 1. Cost columns: settled only in the
            source's own model, and not in the record's (see not_settled).
          pointers:
            - pointer: section 6, page 16, text accompanying Table 3
              quote: >-
                "We can compute the values of m using formula (6) of Theorem 1
                for the various decompositions N = nl without actually
                performing the GHS reduction. Having computed m and using that
                g = 2^{m-1} or 2^{m-1} - 1, for each decomposition N = nl we
                can estimate the respective running times for the Enge-Gaudry
                algorithm as explained in section 4.2. Our results for the five
                ANSI X9.62 curves are listed in Table 3. For all cases where
                m < 13, we performed the GHS reductions to determine the exact
                genera of the resulting hyperelliptic curves; we found that in
                all cases, g = 2^{m-1} (and never the case that g = 2^{m-1} -
                1)."
            - pointer: Table 3 ("GHS attack data for some elliptic curves from ANSI X9.62"), page 16
              note: >-
                Transcribed below under table_3_transcription. F, T and rho are
                the source's base-2 logarithms rounded to integers. A dash means
                no entry. The source puts the n = 4 row of every curve in bold
                face ("the data corresponding to the smallest value of T").
            - pointer: Remark 25 ("applicability of the GHS reduction"), page 17
              quote: >-
                "For E176, E272 and E304 we have Tr_{K/F_2}(a) = 1, so that
                condition (7) of Theorem 1 is not satisfied for these curves
                whenever m(b) != n. However, the weaker condition (9) of Lemma
                6 does hold, and that is why the GHS reduction does produce
                hyperelliptic curves of genus 2^{m-1} or 2^{m-1} - 1 over F_q
                even when m != n."
          not_settled:
            - item: the record's time column q^{2 - 2/g} (the GTTD exponent)
              reason: >-
                Different algorithm and cost model. The source estimates
                Enge-Gaudry relation gathering only. Section 5, page 9:
                "Furthermore, we do not take into account the time spent on
                mapping the ECDLP instance to a HCDLP instance, and the time
                spent on the linear algebra stage of the Enge-Gaudry
                index-calculus algorithm." The GTTD exponent and the double
                large prime variant do not appear in the pages read.
            - item: the record's charged factor-base memory q^{1 - 1/g}
              reason: >-
                Not stated. The source's F column is the size of a full
                degree-<=t factor base (t = 1 in the n = 2 and n = 4 lanes, so
                F is about q/2). That is a different quantity from a reduced
                large-prime factor base. The source's only memory-type limit
                is the EG1 cap of 10^7 (RA-Q4).
            - item: the record's VOW memory-charged verdict and parallel accounting
              reason: Not stated (RA-Q4).
            - item: any ratio to matched rho that includes the linear algebra
              reason: >-
                Not computed by the source. Section 8 makes the source's
                verdicts conditional on the linear algebra being intractable
                above 10^7 factor-base elements (RA-Q4).
