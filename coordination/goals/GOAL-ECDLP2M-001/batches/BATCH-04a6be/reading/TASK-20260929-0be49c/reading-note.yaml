              the variant capped at 10^7, has no entry in that lane on any row
              (Algorithm 10, step 1(b): EG1 sets T to infinity when l >= 25).
              (2) T counts random-walk iterations of relation gathering only,
              with the descent map and the linear algebra excluded (section 5).
              (3) Remark 16, pages 12 and 13: "the running time of the
              Enge-Gaudry algorithm is computed under the assumption that
              #J_C(F_q) ~ q^g = 2^{gl}. [...] Thus, caution must be exercised
              when interpreting our data for those N where gl >> N.
              Nevertheless, if gl ~ N, our running time estimates are
              precise." In the n = 4 lane gl = 8l = 2N. (4) The D2 column is
              the SOURCE's number under (1) to (3). It is not a finding of this
              note and is not adopted here as a deployed-row verdict (RA-4,
              tripwire T2).
        - class: C, the 5 identity cells (c = 16k, n = 1)
          settled: not applicable
          reason: >-
            n = 1 is no descent. Algorithm 10 (page 10) loops over "all divisors
            n >= 2 of N".
      cross_class_notes:
