            then "dreg≤(2n−2)((n−1)2^(n−2)−1)+1=(2n−2)(n−1)2^(n−2)−2n+3."
          fetch_agreement: >-
            The inequality was returned by three fetches; the "standard bound
            from commutative algebra" wording by one. The source does not name
            it the Macaulay bound (one fetch, asked directly).
        - pointer: Section 4.3
