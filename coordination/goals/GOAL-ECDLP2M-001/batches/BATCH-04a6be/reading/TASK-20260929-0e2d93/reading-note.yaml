        = n - 1, 1/(k-1)! = 1/(n-1)! = 1/g! (a77711 H2 and H-8278db-1), while
        1/(g-1)! = 1/(k-2)! (reproduction_check and the assumptions bullet). At
        g = 2 these are 1/2 and 1 respectively. The source's own statement is
        1/(n-1)! (Section 4.3). This note reports the discrepancy and does not
        resolve which form the record intends.
      source_values_beside_the_terms:
