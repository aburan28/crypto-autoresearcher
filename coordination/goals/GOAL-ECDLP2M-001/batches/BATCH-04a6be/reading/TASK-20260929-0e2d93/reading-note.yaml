            logarithms in T_n in heuristic time
            Õ(((2n−2)(n−1)2^(n−2)+1 choose 2n−2)^ω(n−1)!q^(2−2/(n−1))) where n
            is constant and q tends to infinity. The constant in the Õ does not
            depend on q or n."
          fetch_agreement: >-
            Assembled from pieces returned by one fetch; the formula and the
            "n is constant and q tends to infinity" clause were returned by two
            fetches.
        - pointer: Section 4.3
          quote: no sentence found
          note: >-
            Asked directly, one fetch found no sentence saying the per-system
