            2q polynomial systems" to collect q relations (Section 5.1). Table 1
            ratio (R's tried)/|F| by check C1: 2.453, 2.065, 2.004, 1.996, 1.997,
            2.000. Read as an empirical success rate of about 1/2 for q >= 2^14
            this RESTS ON AN ASSUMPTION NOT STATED AT SOURCE, namely that "number
            of R's tried" counts the points tested to collect |F| relations.
          n_5_g_4: >-
