            "Taking into account that we have to do this q(n−1)! times, the
            total cost of the relation collection step is
            O((((2n−2)(n−1)2^(n−2)+1 choose 2n−2)^ω(n−1)!q)."
          fetch_agreement: one fetch (returned in two pieces)
        - pointer: Theorem 4.2
          quote: >-
            "Let T_n, n≥3, be the trace zero subgroup of an elliptic curve.
