    RB-Q2:
      question: >-
        Does the source state or fit any growth law of the per-trial cost with
        arity or with the descended system's degree?
      short_answer: >-
        It STATES a law, as an upper-bound-based complexity estimate, and FITS
        none. Section 4.3 bounds the cost of one decomposition system by the F5
        complexity O(binom(d_reg + 2n - 2, 2n - 2)^omega) and bounds d_reg by
        "a standard bound from commutative algebra", d_reg <= (2n-2)(n-1)2^(n-2)
        - 2n + 3, for a system of 2n - 1 equations in 2(n - 1) unknowns.
        Theorem 4.2 carries that factor, the (n-1)! trial count and
        q^(2-2/(n-1)), "where n is constant and q tends to infinity".
        Section 7 states qualitatively that the attack's complexity "depends
        exponentially on n" and "becomes infeasible for rather small values of
        n". No growth law is fitted to data: only n = 3 and n = 5 are
        implemented, and they solve systems of different shape (the n = 5
        experiment is not the n - 1 summand system the bound describes). The
        source does not say the d_reg bound is pessimistic or tight (one fetch,
        asked directly).
      pointers_and_quotations:
