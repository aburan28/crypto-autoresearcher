  answers:
    RB-Q1:
      question: >-
        Which arities, field sizes and curve families did the source implement,
        with which solver and on what hardware, and what per-trial (or
        per-relation) decomposition cost did it report?
      short_answer: >-
        Two extension degrees, n = 3 and n = 5, over PRIME fields of
        characteristic at least 5 (experiments additionally exclude
        characteristic 2 and 3, and require 3 | q-1 or 5 | q-1 for a Kummer
        basis). Magma 2.19.3 on one core of an Intel Xeon X7550 at 2.00 GHz,
        built-in Groebner (degree reverse lexicographic, then a Groebner walk
        to lex at n = 3). n = 3 (record arity g = n - 1 = 2): the n - 1 = 2
        summand decomposition is implemented; one decomposition attempt is one
        small polynomial system, with measured Groebner times of about 1 to 3
        ms and solve times of about 1 to 5 ms for q from 2^10 to 2^79; full
        discrete logarithms computed up to |T_3| of 36 bits. n = 5 (record
        arity g = 4): the n - 1 = 4 summand decomposition is NOT the
        implemented one. The source decomposes into 3 summands (a Joux-Vitse
        variant) with a hybrid step that solves O(q) systems per tested point;
        the measured time of one such system is about 1.2 to 1.3 s for q up to
        2^20, about 7 s near q = 2^25 and 2^30, and about 147 s near q = 2^35
        and 2^40. The direct 3-summand system (8 equations, 6 unknowns) did not
        finish over F_1021 after several weeks using more than 300 GB.
