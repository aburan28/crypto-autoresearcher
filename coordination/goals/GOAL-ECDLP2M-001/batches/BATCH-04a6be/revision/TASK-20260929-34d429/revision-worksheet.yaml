  # Required change -> discharging clause of IDEA-20261001-621974
  required_changes:
    - id: R3-a
      source: >-
        DEC-20260928-63addc na3_disposition ("the GTTD double-large-prime form
        adopted") with the card's text: the single-large-prime form costs about
        sqrt(N B), above rho by sqrt(B), by the ranker's check A13 (not
        re-derived by DEC-20260924-99ce20); re-derive that comparison in the
        record before relying on it.
      discharged_by:
        - field: claim (A)
          how: >-
            Re-derives the single-large-prime enumeration cost as T_1 =
            sqrt(2 U N / kappa_r) with the canonicalisation constant explicit,
            and the ratio to matched rho T_1 / R = sqrt(4192 U / (pi kappa_r)):
            2^4.69 sqrt(U) (kappa_r = 2), 2^5.19 sqrt(U) (kappa_r = 1), 2^1.17
            sqrt(U) (kappa_r = 262, conditional). A13 ("about sqrt(N B), above
            rho by sqrt(B)") is confirmed up to these constants at U = B, with
            the stored-residual memory and the tuple-supply bound added.
            Arithmetic checks AC-1 to AC-3.
        - field: claim (C) and claim (D)
          how: >-
            Adopts the GTTD form (partials with at most two large primes,
            cycles of the large-prime graph, the superseded record's
            subtraction as the length-2 cycle) and prices it in the
            product-law convention: per-attempt budgets 2^8.71 (m = 3) and
            2^22.34 (m = 4) against plain 2^-15.55 and D3 2^11.01; the
            single-large-prime row in the same convention 0.5 log2(m - 1)
            below. Arithmetic checks AC-5 to AC-13.
        - field: mechanism (object frame, Sigma = cycle combination, lossy-projection test)
          how: The GTTD graph operation replaces the superseded record's pairwise subtraction as Sigma; the lossy-projection test is re-run against it.
        - field: title, class, minimal_test, predictions
          how: The record's construction and tests are the j <= 2 form throughout; the j = 1 accumulator survives only as claim (A)'s priced line and as the length-2 cycle.
      status: discharged

    - id: R3-b
      source: >-
        DEC-20260928-63addc na3_disposition ("dominated_by filled with
        IDEA-20260926-1db0e8's closure line as input, HOLD-X12") with the
        card's text: closure about 2^124.0 against rho at the floor-optimal B,
        a zero-compute closure line, cited by id and recomputed, not relayed.
      discharged_by:
        - field: claim (B)
          how: >-
            Recomputes 1db0e8's cancellation r (1/p_2) (B^(m-2)/(m-2)!)
            C_2(B') = 2 r N C_2(B')/B'^2 from its stated ingredients, giving
            2^123.97 C_2(B')/B' at 1db0e8's r = B'/262 (per-orbit, conditional
            under CORR-20260925-649e25) and 2^132 theta C_2(B')/B' without the
            per-orbit framing; under the Artin-Schreier sub-oracle C_2 =
            (B'/2) c_AS the gaps to rho are 62.16 + log2 c_AS and 70.19 +
            log2(theta c_AS) bits. AC-4.
        - field: dominated_by
          how: >-
            Filled by branch after checking all 48 frontier rows: enumeration
            class dominated by matched rho (with the recomputed 1db0e8 line
            for j = 2 and claim (A) for j = 1); budget convention n/a (no cost
            claimed), with the Pareto note that at exactly its budget the row
            ties rho in time and loses in memory.
        - field: dominated_by_input
          how: Names IDEA-20260926-1db0e8 (DEC-20260928-63addc HOLD-X12) by id and states the recomputed value and its scope.
        - field: claim (D) and prior_art.internal_nearest[IDEA-20260926-1db0e8]
          how: >-
            States the scope of the input line (the enumeration class) and
            re-scopes two of 1db0e8's statements ((B) on algebraic solves, (C)
            on cap-locus dominance) without editing that record.
        - field: sota_delta
          how: Quantitative by branch (zero time; +24.26 and +11.33 bits of budget at m = 3, 4; memory figures).
      status: discharged
      note: >-
        The card says "closure about 2^124.0 against rho at the floor-optimal
        B". 1db0e8's line is independent of B and m (the small base cancels);
        the recomputation confirms that and the value 2^123.97. The phrase
        "against rho" is read as the gap, recomputed as 62.16 + log2 c_AS bits
        (1db0e8 writes "closed by 63 bits").

    - id: R3-c
      source: DEC-20260928-63addc na3_disposition ("KN-LIT-164 cited"); card - read through the corpus entry, provenance kb or internal as applicable.
      discharged_by:
        - field: citations[KN-LIT-164]
          how: >-
            Cited with provenance internal (the corpus file was read directly;
            the kb retrieval index was not used, so kb does not apply),
            verified_by this session, claim scoped to what the entry relays
            (abstract-level, bulk-seeded, unverified per the entry).
        - field: citations[KN-LIT-92caf4] and prior_art.nearest
          how: >-
            KN-LIT-164's front matter records superseded_by KN-LIT-92caf4; both
            are cited and both appear in prior_art.nearest with relation
            adjacent.
        - field: mechanism (why the GTTD gain exists in one class and not the other)
          how: Uses KN-LIT-164 / KN-LIT-92caf4 and KR-IC-a4dd54 for the construction and the rebalancing only; the paper body is a recalled pointer.
      status: discharged

