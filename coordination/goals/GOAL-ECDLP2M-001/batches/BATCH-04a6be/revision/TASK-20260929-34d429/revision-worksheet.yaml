  arithmetic_checks:
    label: >-
      HAND ARITHMETIC, this session, no shell or interpreter available. Values
      to six decimals where carried. Constants used: log2 pi = 1.651496,
      log2 3 = 1.584963, log2 5 = 2.321928, log2 6 = 2.584963, log2 12 =
      3.584963, log2 15 = 3.906891, log2 24 = 4.584963, log2 35 = 5.129283,
      log2 72 = 6.169925, log2 131 = 7.033423, log2 262 = 8.033423, log2 384 =
      8.584963, log2 480 = 8.906891, log2 5040 = 12.299208, log2 12! =
      28.8354. r = 680564733841876926932320129493409985129 and 2^129 =
      680564733841876926926749214863536422912 differ by a relative 8.2e-21,
      so log2 r = 129.000000 and log2 N = 131.000000 at six decimals.
    checks:
      - id: AC-1
        what: matched rho
        work: log2 R = 0.5 (1.651496 + 129 - 2 - 7.033423) = 0.5 x 121.618073
        value: 60.809037
      - id: AC-2
        what: single large prime, enumeration, ratio to rho
        work: >-
          T_1^2 / R^2 = (2 U N / kappa_r) x 16 x 131 / (pi N) = 4192 U / (pi
          kappa_r). kappa_r = 2 gives 0.5 (11.033423 - 1.651496) = 4.690964;
          kappa_r = 1 gives 5.190964; kappa_r = 262 gives 0.5 (4 - 1.651496) =
          1.174252. log2 T_1 at U = 1 and kappa_r = 262 is 0.5 (1 + 131 -
          8.033423) = 61.983289.
        value: 1.174, 4.691, 5.191 bits plus 0.5 log2 U
      - id: AC-3
        what: tuple supply B^(m-1)/(m-1)! >= T_1 at kappa_r = 262, U = B
        work: >-
          B^(m - 3/2) >= (m-1)! 2^61.983289. m = 4 gives 2.5 l >= 64.568252, l
          >= 25.827, T_1 >= 61.983 + 12.914 = 74.897. m = 8 gives 6.5 l >=
          74.282497, l >= 11.428, T_1 >= 67.697. m = 13 gives 11.5 l >= 90.819,
          l >= 7.897, T_1 >= 65.932.
        value: 74.90, 67.70, 65.93
      - id: AC-4
        what: IDEA-20260926-1db0e8 line recomputed
        work: >-
          r (1/p_2)(B^(m-2)/(m-2)!) C_2 = r N C_2 / (B'^2/2) = 2 r N C_2 / B'^2.
          r = B'/262 gives 2^132 C_2 / (262 B'), log2 coefficient 132 -
          8.033423 = 123.966577. C_2 = (B'/2) c_AS gives 122.966577 + log2
          c_AS; gap to rho 122.966577 - 60.809037 = 62.157540. r = theta B'
          gives 2^131 theta c_AS; gap 131 - 60.809037 = 70.190963.
        value: 123.97; gaps 62.16 and 70.19 bits plus the stated logs
      - id: AC-5
        what: plain D3 at m = 4 (baseline fixture)
        work: >-
          maximise (R - 4B^2) B^3 / (24 N); optimum B^2 = 3R/20, log2 B^2 =
          60.809037 - 2.736966 = 58.072071, l = 29.036036; R - 4B^2 = 0.4 R,
          log2 59.487109; attempts 24 N / B^3, log2 4.584963 + 131 - 87.108108 =
          48.476855; budget 59.487109 - 48.476855. p = 2^(116.144144 -
          4.584963 - 131) = 2^-19.440819; unknowns 116.144.
        value: 11.010254 (pinned 11.010251)
      - id: AC-6
        what: plain best budget at m = 3
        work: >-
          maximise (R - 3B^2) B^2 / (6N); B^2 = R/6, l = (60.809037 -
          2.584963)/2 = 29.112037; budget R^2 / (72 N), log2 121.618074 -
          6.169925 - 131.
        value: -15.551851 (4b65e3 states -15.6); unknowns 87.336
      - id: AC-7
        what: double large prime budget at m = 3, theta = 1, w = 3
        work: >-
          budget (R - wB^2) B^(1/2) / (theta sqrt(2N)); optimum B^2 = R/(5w) =
          R/15, l = (60.809037 - 3.906891)/2 = 28.451073; R - 3B^2 = 0.8R, log2
          60.487109; A_2 = B' = sqrt(2N/B), log2 (132 - 28.451073)/2 =
          51.774464; budget 60.487109 - 51.774464. Cap p_2 = B B'^2/(2N), log2
          28.451 + 103.549 - 132 = 0. Unknowns l + 2l' = 132.000. 0.162 B' =
          2^49.15 >= B.
        value: 8.712645
      - id: AC-8
        what: double large prime budget at m = 4, theta = 1, w = 4
        work: >-
          budget (R - wB^2) B / (theta sqrt(4N)); optimum B^2 = 2R/(6w) =
          R/12, l = (60.809037 - 3.584963)/2 = 28.612037; R - 4B^2 = (2/3)R,
          log2 60.224074; A_2 = B' = 2^66.5 / B, log2 37.887963; budget
          60.224074 - 37.887963. Cap p_2 = B^2 B'^2/(4N), log2 57.224 + 75.776
          - 133 = 0. Unknowns 2l + 2l' = 133.000. 0.162 B' = 2^35.26 >= B.
        value: 22.336111
      - id: AC-9
        what: sensitivity over theta and w
        work: >-
          theta = 1/2 adds exactly 1. m = 3, w = 96: B^2 = R/480, l =
          (60.809037 - 8.906891)/2 = 25.951073, budget 60.487109 - (132 -
          25.951073)/2 = 7.462645. m = 4, w = 128: B^2 = R/384, l = (60.809037
          - 8.584963)/2 = 26.112037, budget 60.224074 - (66.5 - 26.112037) =
          19.836111.
        value: m = 3 in [7.46, 9.71]; m = 4 in [19.84, 23.34]
      - id: AC-10
        what: single large prime in the same convention
        work: >-
          A_1 = sqrt(2 (m-1)! N / B^(m-2)) at the cap B' = (m-1)! N / B^(m-1);
          same optimum B; budget lower than the theta = 1 double row by 0.5
          log2(m - 1). m = 3 gives 8.712645 - 0.5; m = 4 gives 22.336111 -
          0.792481.
        value: 8.212645 and 21.543630
      - id: AC-11
        what: double large prime free-oracle floors (D1-type, never budgets)
        work: >-
          m = 3, theta = 1, w = 3: minimise sqrt(2N/B) + 3B^2; B^(5/2) =
          2^66/12, l = 62.415037/2.5 = 24.966015; A = 66 - 12.483007 =
          53.516993; LA = A/4; total A x 1.25, log2 53.516993 + 0.321928. m =
          4, w = 4: minimise 2^66.5/B + 4B^2; B^3 = 2^63.5, l = 21.166667; A =
          45.333333; LA = A/2; total A x 1.5, log2 45.333333 + 0.584963.
        value: 53.838921 and 45.918296
      - id: AC-12
        what: break-even marginal cost at m = 4
        work: (22.336111 - 11.010254) / (133.000 - 116.144144) = 11.325857 / 16.855856
        value: 0.6719 bit per unknown
      - id: AC-13
        what: m = 5 infeasibility
        work: >-
          B^2 = 3R/(7 x 5) = 3R/35, log2 B^2 = 60.809037 + 1.584963 - 5.129283 =
          57.264717, l = 28.632359; B' = sqrt(2 x 3! x N / B^3), log2 (3.584963 +
          131)/2 - 1.5 x 28.632359 = 67.292481 - 42.948538 = 24.343943 < l.
        value: infeasible (B' below B)
      - id: AC-14
        what: subgroup ambient N = r
        work: >-
          At fixed (R, m, theta, w) the optimum B does not depend on N; the
          double-row budget scales as N^-1/2 (+1.000 bit when N falls by 4) and
          the plain budget as N^-1 (+2.000 bits).
        value: +1.00 and +2.00 bits
      - id: AC-15
        what: sota_delta differences
        work: 8.712645 + 15.551851 = 24.264496; 22.336111 - 11.010254 = 11.325857; unknowns 132.000 - 87.336 = 44.664 and 133.000 - 116.144 = 16.856
        value: +24.26 and +11.33 bits; 44.7 and 16.9 unknowns
      - id: AC-16
        what: random-graph constant (recalled formula, numeric check only)
        work: >-
          x e^-x = 2 e^-2 = 0.2707 at x = 0.4064 (0.4064 x 0.6661 = 0.2707);
          tree components n (x/2 - x^2/4) = n (0.2032 - 0.0413) = 0.1619 n, so
          the cyclomatic number at M = n is about 0.162 n.
        value: 0.162
    reconciliations:
      - with: IDEA-20260926-1db0e8 (A), "2^59.0 sqrt(B)" for j = 1
        result: >-
          With U = B/262 and kappa_r = 262 claim (A) gives sqrt(2 (B/262)
          (2^131/262)) = 2^57.97 sqrt(B) matched pairs' attempts; 1db0e8's
          extra factor 2 comes from its per-attempt success B'/2^132 = 1/2 at
          the whole-group large base. Consistent within 1 bit; the record uses
          U = B (no per-orbit unknowns) as its unconditional headline.
      - with: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c2bbe6.yaml ("sqrt(2NB) >= 2^66.0 at B = 1")
        result: Equals claim (A) at kappa_r = 1, U = B (log2 T_1 = 66.0 + 0.5 log2 B). Agrees.
      - with: CORR-20260928-4cb669 D3 = 11.010251
        result: AC-5 gives 11.010254; difference 3e-6, rounding.
      - with: IDEA-20260926-4b65e3 m = 3 sub-cap optimum log2 C = -15.6
        result: AC-6 gives -15.55; agrees at the stated precision.

