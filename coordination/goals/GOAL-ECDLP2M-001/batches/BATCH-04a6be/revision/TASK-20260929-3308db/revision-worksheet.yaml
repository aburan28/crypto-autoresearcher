  arithmetic_checks:
    label: HAND ARITHMETIC, no shell; each is re-checkable by a reviewer in minutes.
    items:
      - id: AC-1
        what: matched rho on ECC2K-130
        working: >-
          log2(pi) = 1.651496; 524 = 4 x 131; log2(131) = 7 + log2(1.0234375)
          = 7.033423, so log2(524) = 9.033423. 2^129 =
          680564733841876926926749214863536422912 and r - 2^129 =
          5570914629873562217, so log2(r) = 129 + 1.2e-20. Then
          (129 + 1.651496 - 9.033423)/2 = 121.618073/2 = 60.809037.
        result: 2^60.8090, agreeing with CORR-20260922-81aeab's convention and KN-FIND-aa2efc.
        side_note: >-
          r exceeds 2^129, so its bit length is 130; the corpus's "129-bit"
          wording means log2 r is about 129. No figure in the new record
          depends on this.
      - id: AC-2
        what: r mod 4
        working: >-
          100 is divisible by 4 and r ends in 29; 29 mod 4 = 1.
        result: r is congruent to 1 mod 4, so the S-component of P is [r]P (record, L3).
      - id: AC-3
        what: free-oracle floor shift 4/(m+1) (and 2/(m+1) for one bit)
        working: >-
          4/3, 4/4, 4/5, 4/6, 4/7, 4/9; and 2/3, 2/4, 2/5, 2/6, 2/7, 2/9.
        result: >-
          1.3333, 1.0000, 0.8000, 0.6667, 0.5714, 0.4444 bits at m = 2, 3, 4,
          5, 6, 8 (equal to CORR-20260928-4cb669); one bit 0.6667, 0.5000,
          0.4000, 0.3333, 0.2857, 0.2222. Maximum over m >= 2 is 4/3, below
          the 1.34 quoted in the record's interpretation_limits.
      - id: AC-4
        what: E(F_2) on y^2 + xy = x^3 + 1, and on y^2 + xy = x^3 + x^2 + 1
        working: >-
          a = 0: (0,0) gives 0 against 1, not on E; (0,1) gives 1 = 1; (1,0)
          gives 0 = 0; (1,1) gives 0 = 0. So E(F_2) = {O, (0,1), (1,0), (1,1)}.
          Doubling (1,0): slope x + y/x = 1, x = 1 + 1 + 0 = 0, so 2(1,0) =
          (0,1) = T; -(1,0) = (1, 1) = 3(1,0). a = 1: (0,1) gives 1 = 1;
          x = 1 needs y^2 + y = 1, no root in F_2. So that E(F_2) has order 2.
        result: S = E(F_2) is cyclic of order 4 on ECC2K-130 (given 4 exactly divides #E); the a = 1 Koblitz curve has E(F_2) of order 2.
      - id: AC-5
        what: L3 on Z/12 = Z/4 x Z/3, and the proves-too-much object
        working: >-
          Divisors of 12 are 1, 2, 3, 4, 6, 12, so six subgroups. S = <3> =
          {0,3,6,9}, C = <4> = {0,4,8}. <2> cap S = {0,6}, <2> cap C =
          {0,4,8}, their sum set is {0,2,4,6,8,10} = <2>. <6> = {0,6} = 2S.
          Z/2 x Z/2 has three subgroups of order 2, so the lattice of a
          Z/2 x Z/2 2-part is not a chain.
        result: L3 holds on the toy; the chain statement fails where the 2-part is not cyclic, as the control requires.
      - id: AC-6
        what: I1 on Z/12 with label x mod 4 (the quotient by C)
        working: >-
          D = {1, 2, 5}, m = 2: multisets {1,1} -> 2, {1,2} -> 3, {1,5} -> 6,
          {2,2} -> 4, {2,5} -> 7, {5,5} -> 10. Sums in C: only 4, count 1.
          Labels 1, 2, 1; label sums 2, 3, 2, 0, 3, 2; M_0 = 1. Restricted
          base D' = {4, 8} inside C: {4,4} -> 8, {4,8} -> 0, {8,8} -> 4, all
          three in C, and binomial(2 + 1, 2) = 3.
        result: >-
          Sum over C of c_D = M_0(D) = 1 and mean over C = 1/3, while
          KN-FIND-007's mean over all of Z/12 is 6/12 = 1/2; the restricted
          case equals binomial(|D'| + m - 1, m). I1 holds on both toys.
      - id: AC-7
        what: fixed-V ratios at h = 4 (C1)
        working: >-
          yield 4^{1-m}; relations 1/4; attempts = (1/4) / 4^{1-m} = 4^{m-2};
          linear algebra (1/4)^2.
        result: >-
          Yield 2^-2, 2^-4, 2^-6, 2^-8, 2^-10, 2^-14 and attempts 1, 2^2, 2^4,
          2^6, 2^8, 2^12 at m = 2, 3, 4, 5, 6, 8; linear algebra 2^-4.
      - id: AC-8
        what: equal-|D| ratio per nonlinear bit (C2)
        working: c(l+1) / (2 c(l)) = 2^{g-1}.
        result: >-
          g = 0 gives 1/2; g = 1 gives 1 (the m = 2 enumeration oracle, cost
          about |V| per attempt); g = 2 gives 2. An oracle enumerating V^{m-1}
          has g = m - 1.
      - id: AC-9
        what: m = 3 subgroup floor against matched rho, as used in dominated_by
        working: 67.5850 - 60.8090 = 6.7760.
        result: +6.776 bits, equal to the value CORR-20260928-4cb669 states.

