  # ---------------------------------------------------------------------------
  required_changes:
    - id: R2-a
      text: >-
        Acknowledge the Z/4 to Z/2 quotient: gcd(4, r) = 1 does not make every
        lossy quotient trivial, since Z/4 has a Z/2 quotient (the E/2E map).
      discharged_in:
        - idea.claim, PART A, (L3) last three sentences
        - idea.mechanism, DERIVATIONS, L3
        - idea.title
      how: >-
        L3 states that the superseded record's "quotients of S are trivial or
        all of S" is false, names the proper quotient Z/4 -> Z/2 as the E/2E
        map (pi_2), and states that E/C = E/4E = Z/4 is the only other
        nontrivial cofactor quotient. L4 gives pi_2 in coordinates
        (Tr(x) + Tr(a)), re-derived from the doubling formula.
    - id: R2-b
      text: The 2-Sylow subgroup is cyclic; enumerate the chain of its quotients in the certificate rather than asserting triviality.
      discharged_in:
        - idea.claim, PART A, (L1), (L2), (L3)
        - idea.mechanism, DERIVATIONS, L1, L2, L3
        - idea.proof_search_map.method_ceiling.nearby_object_control (i)
        - idea.predictions items 1 and 2
      how: >-
        Cyclicity is PROVED, not assumed: L1 shows every ordinary binary curve
        has a unique point of order 2 (so a cyclic 2-Sylow), and L2
        identifies ECC2K-130's 2-Sylow as E(F_2), generated by (1,0) of order
        4. L3 enumerates all six subgroups of E (one per divisor of 4r) and
        the leg-side chain E -> E/C = Z/4 -> E/2E = Z/2 -> 1, with each
        quotient classified as injective or constant on targets. The
        nearby-object control Z/2 x Z/2 x Z/q shows cyclicity is
        load-bearing.
    - id: R2-c
      text: Drop the h = 1 null.
      discharged_in:
        - idea.dropped_from_predecessor item 1
        - idea.claim, PART A, (L1) ("no cofactor-1 curve exists in this family")
        - idea.minimal_test.controls (no h = 1 curve; replaced by the Z/2 x Z/2 x Z/q proves-too-much object, the Tr(a) = 1 known-emptiness reproduction, and the CORR-20260928-4cb669 reproduction)
        - idea.proof_search_map.method_ceiling.nearby_object_control (ii) (an h = 2 curve, not h = 1)
      how: >-
        No h = 1 curve appears in the record. L1 gives the reason the null is
        impossible in the family (the rational point (0, b^{1/2}) of order 2).
        The baseline slice "D inside C" in proof_search_map is the
        KN-FIND-007 identity in the group C, a symbolic reproduction, not a
        null object and not a curve.
    - id: R2-d
      text: Relabel part B as factor-base size.
      discharged_in:
        - idea.claim, PART B, (I1), (C1), (C2), (B-AUDIT)
        - idea.mechanism, WHY THE COFACTOR IS A SIZE PARAMETER, and DERIVATIONS I1, C1, C2
        - idea.title
        - idea.proof_search_map.constructive_transforms (representation_reduction)
        - idea.dropped_from_predecessor item 2
      how: >-
        Part B is restated as the exact identity I1 (mean yield over targets
        = M_0(D)/r, the label-sum-zero multiset count over r), so the
        cofactor enters only through (|D|, M_0(D), dim V, oracle cost). C1
        gives the fixed-V ratios between conventions, C2 the equal-|D| ratio
        2^{k(g-1)} with threshold g = 1 bit per V-dimension per nonlinear
        label bit and the free-oracle floor shift 2k/(m+1) bits (reproducing
        CORR-20260928-4cb669 at k = 2). The original code-read question is
        kept as Stage 0, now read as "which ambient floor is each builder's
        row read against", not as a lever.
    - id: R2-e
      text: >-
        Name IDEA-20260926-ae8f0a as its constructive successor input
        (HOLD-X11), without designing it. Any ECC2K-130 measured part is
        CERTBIN's (HOLD-O revisit note), not this record's.
      discharged_in:
        - idea.successor_inputs item 1
        - idea.minimal_test.design, NOT DESIGNED HERE
        - idea.heuristic_assumptions H1 validation_plan ("Owned by CERTBIN, not designed here")
        - idea.dropped_from_predecessor item 4
        - idea.prior_art.internal_nearest (ae8f0a, relation adjacent)
      how: >-
        ae8f0a is named with HOLD-X11. No cell, metric, sample size or
        procedure for it is written. Observations bearing on its future
        design (its cofactor-1 null and its Z/2 x Z/2 control curve are
        unrealizable by L1; the label is Frobenius-invariant by L2; its H1 is
        exact at level 1 and heuristic at level 2 by L4) are recorded as
        pointers for its designer only. Every measured part (label census,
        fixed-V yield ratio, oracle growth g) is assigned to CERTBIN.

