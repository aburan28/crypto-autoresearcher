  # ---------------------------------------------------------------------------
  # Fixed content R1-a to R1-f -> the clause of IDEA-20261001-39014f that
  # discharges it. Field paths are under the record's top-level key `idea`.
  discharge_map:
    - item: R1-a
      requirement: >-
        Restate the parity: Tr(a) = 1 rows empty at odd m, the affine half
        c_0 = 1 aligned at every m, net gain one bit at any m; derive it from the
        group law or from the halving criterion read at source, never relay it.
      discharged_in:
        - idea.claim (A), (B), (C), (D)
        - idea.derivations_from_the_group_law.D1_doubling
        - idea.derivations_from_the_group_law.D2_halving_criterion
        - idea.derivations_from_the_group_law.D3_homomorphism
        - idea.derivations_from_the_group_law.D4_trace_of_window
        - idea.predictions P-2, P-3, P-4
        - idea.sota_delta.time (the superseded emptiness and 2-8x withdrawn)
      how: >-
        D2 re-derives the halving criterion Tr(x) = Tr(a) both ways from the
        doubling formula (D1); D3 makes pi the E -> E/2E homomorphism, zero on
        G; D4 gives Tr(x) = c_0 on V_k at odd n within k <= n - s. Claim (C)
        then states (C1) the half {c_0 = Tr(a)} aligned at every m and (C2) the
        half {c_0 = 1 + Tr(a)} exactly empty at odd m, aligned at even m; on
        Tr(a) = 1 rows that is V' empty at odd m and {c_0 = 1} aligned at every
        m, the direction the disposition fixes. Claim (D) prices the gain as
        2 / (1 + (1 - 2 theta)^m), i.e. one bit at theta = 1/2 at every m, with
        the comparator (matched size, matched coordinate count) and the
        non-comparator (Semaev's full V_k at a fixed coordinate budget, where
        the aligned half yields 2^{1-m}) stated.
      status: discharged

    - item: R1-b
      requirement: >-
        Replace the sqrt(2n) rho form by CORR-20260922-81aeab's convention
        (negation and n-fold Frobenius class, negation counted once); restate
        every rho figure under it.
      discharged_in:
        - idea.rho_convention (convention, figures, not_computed)
        - idea.target_complexity.best_known
        - idea.dominated_by
        - idea.closure_section.struck_from_153a90_part_D (2^60.9 as source rounding only)
      how: >-
        sqrt(pi r / (4k)), k = n on Koblitz rows and k = 1 on B-curves. The
        superseded record computed no numeric rho figure (only the formula), so
        "every figure" is the formula plus the figures this record quotes:
        ECC2K-130 2^60.8090 (re-derived, A1), K-571 2^279.75 and B-571 2^284.83
        (DEC-20260924-99ce20, re-checked, A2), K-163 2^77.15 and B-163 2^80.83
        (this task, from FIPS r, A3). Other rows are explicitly not computed.
      status: discharged

    - item: R1-c
      requirement: Justify the inclusion of c2pnb208w1, or drop it with the reason stated.
      discharged_in:
        - idea.per_row_table.r1c_disposition
        - idea.per_row_table.count_note
        - idea.minimal_test.controls C-even
      how: >-
        DROPPED. n = 208 is even, so Tr(1) = 0 and all of V_k lies in one class
        within the Newton bound (D4); the c_0 choice has no content there and
        the superseded fix only shrinks the window. The row is the
        composite-degree population of 6cf862 / 261004. The even-n case
        survives only as an optional toy proves-too-much control (C-even).
      status: discharged

    - item: R1-d
      requirement: >-
        Carry IDEA-20260922-153a90's closure section reduced to its Sigma, with
        the E/4E class census as the cheap test; keep tripwire T5; no sentence
        states a closure as an outcome.
      discharged_in:
        - idea.closure_section (sigma, proposition_C1, proposition_C1_proof, what_C1_does_not_cover, struck_from_153a90_part_D, part_C_repriced, cheap_test, obstruction_draft, tripwire)
        - idea.derivations_from_the_group_law.D5_depth_two_bit
        - idea.derivations_from_the_group_law.D6_E4E_on_cofactor_4
        - idea.minimal_test Stage 2
        - idea.predictions P-5 to P-9
        - idea.interpretation_limits (closure-section item)
        - idea.honest_accounting.closures_enumerated
      how: >-
        Sigma reduced to <S> (one fixed nonzero translation of the prime-order
        G); C1 proved in the record; four uncovered classes listed
        (state-carrying incremental tests, factor-base translation = Class I,
        non-translation operation sets, the leg side). Part D's "compose
        multiplicatively" sentence struck with its reason. Part C repriced from
        D5 (cost) and H-39014f-2 (yield 2^{1-m} against the parent, 2 against a
        size-matched window; floor ceiling 2/(m+1) and 4/(m+1) bits via
        CORR-20260928-4cb669's scaling). The E/4E class census (histogram,
        class-sum certificate, ratios, hyperplane purity scan, relabelled
        replica, cofactor-2 sibling) is Stage 2. T5 kept in
        closure_section.tripwire; C1 is stated as a proposition and the
        obstruction block is a draft for the T5 round.
      status: discharged
      t5_wording_check: >-
        Self-check by this task, not a substitute for T5: every sentence about
        C1 says "proposition", "stated" or "draft". The words closure / closed /
        closes appear only as the section's name ("closure section"), as
        references to the T5 filing decision, as references to the floors and
        verdicts CORR-20260928-4cb669 records, or in negation ("not filed as a
        closure", "withdrawn, not closed", "is not closed and is the live
        family").

    - item: R1-e
      requirement: >-
        The halving criterion (FHLM, CACR CORR 2003-18, Section 4, Lemma
        4.1(iv)): read at source with provenance retrieved, or re-derive it from
        the group law in the record. Do not read the lane-B red team's report.
      discharged_in:
        - idea.derivations_from_the_group_law.D2_halving_criterion
        - idea.citations (FHLM entry, provenance recalled, verified_by null)
        - idea.prior_art.searched.web and .blocked
      how: >-
        RE-DERIVED from the group law (D1 -> D2), both directions, including the
        x = 0 case. Retrieval was attempted (WebFetch of
        https://cacr.uwaterloo.ca/techreports/2003/corr2003-18.pdf, 2026-10-01):
        PDF bytes (about 187.7 KB) were returned but could not be converted to
        text in this runtime (no PDF text extractor; the Read tool's PDF path
        needs pdftoppm, absent), and no shell exists to take a sha256. The
        source was therefore NOT read and is cited as `recalled`, with nothing
        resting on it. The BATCH-361e02 red-team report was not read.
      status: discharged (by re-derivation; retrieval impediment recorded)

    - item: R1-f
      requirement: Name IDEA-20260926-ae8f0a (HOLD-X11) as the constructive successor input that waits on this revision, without designing it.
      discharged_in:
        - idea.successor_inputs (first entry)
        - idea.closure_section.obstruction_draft.resource_check.spawned_ids
        - idea.priority_rationale
      how: >-
        Named, with what it consumes (the parity lever as filed, corrected here;
        its pi_4 equals D5's beta_2) and the explicit statement that it is not
        designed here.
      status: discharged

