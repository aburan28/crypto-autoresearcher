  # ---------------------------------------------------------------------------
  # Arithmetic checks: hand arithmetic by this task, no code run, labelled.
  arithmetic_checks:
    - id: A1
      what: ECC2K-130 matched rho
      work: >-
        r = 680564733841876926932320129493409985129; 2^129 =
        680564733841876926926749214863536422912; r - 2^129 =
        5570914629873562217, so log2 r = 129 + 1.2e-20. log2(pi/4) =
        -0.348504, half -0.174252. log2 131 = 7 + log2(1.0234375) = 7.033423,
        half 3.516712. log2 rho = 64.5 - 0.174252 - 3.516712 = 60.809036.
      result: 2^60.8090, agrees with CORR-20260922-81aeab and CORR-20260928-4cb669
    - id: A2
      what: K-571 and B-571 matched rho (re-check of DEC-20260924-99ce20)
      work: >-
        log2 571 = 9 + log2(1.115234) = 9.157347, half 4.578674. K-571 (log2 r
        taken as 569): 284.5 - 0.174252 - 4.578674 = 279.747. B-571 (log2 r
        taken as 570, k = 1): 285 - 0.174252 = 284.826. The log2 r values are
        approximations from the cofactors, labelled.
      result: 279.75 and 284.83, agree
    - id: A3
      what: K-163 and B-163 matched rho
      work: >-
        2^162 = 5846006549323611672814739330865132078623730171904; K-163 r =
        5846006549323611672814741753598448348329118574063 (FIPS line 6708) and
        B-163 r = 5846006549323611672814742442876390689256843201587 (line
        6726) differ from 2^162 by relative 4e-22 and 5e-22, so log2 r =
        162.0000. log2 163 = 7 + log2(1.2734375) = 7.348731, half 3.674366.
        K-163: 81 - 0.174252 - 3.674366 = 77.1514. B-163: 81 - 0.174252 =
        80.8257.
      result: 2^77.15 and 2^80.83
    - id: A4
      what: Koblitz group orders at n = 19 for the toy cells
      work: >-
        Frobenius trace recurrence V_k = t V_{k-1} - 2 V_{k-2}, V_0 = 2,
        V_1 = t, with t = -1 for a = 0 (the a = 0 curve has 4 points over F_2):
        V_2 .. V_19 = -3, 5, 1, -11, 9, 13, -31, 5, 57, -67, -47, 181, -87,
        -275, 449, 101, -999, 797. #E_0(F_{2^19}) = 2^19 + 1 - 797 = 523492 =
        4 x 130873. For a = 1 (t = 1) V_19 = -797, #E_1 = 525086 = 2 x 262543.
        130873 was trial-divided by every prime up to 359 with no factor found;
        the next prime, 367, has 367^2 = 134689 > 130873, so 130873 is prime.
        262543 was not checked.
      result: "#E_0 = 4 x 130873 (130873 prime); #E_1 = 2 x 262543 (odd part unverified); both re-verified at setup by the design"
    - id: A5
      what: Newton bounds n - s per row
      work: >-
        s read from the field polynomials: 163 -> 7, 233 -> 74, 239 -> 158,
        283 -> 12, 409 -> 87, 571 -> 10. n - s = 156, 159, 81, 271, 322, 561.
        For sect239k1, p_81 = (n - s) mod 2 = 1, so Tr(t^81) = 1.
      result: per_row_table n_minus_s column
    - id: A6
      what: floor shifts by the CORR-20260928-4cb669 scaling (floor proportional to N^{2/(m+1)})
      work: >-
        N = 2r (parity-aligned legs): shift 2/(m+1) bits; m = 3 -> 0.5,
        68.5850 - 0.5 = 68.0850, minus 60.8090 = 7.2760; m = 4 -> 0.4,
        56.4049 - 0.4 = 56.0049. N = r (depth-2 class-pure on cofactor 4):
        shift 4/(m+1), the correction's own row, m = 3 -> 67.5850 (+6.776).
      result: stated as arithmetic on the correction's values, not recomputed by l-optimisation
    - id: A7
      what: parity-admissible fraction and yield factor
      work: >-
        Fraction of m-multisets with an even number of label-1 legs: sum over
        even j of C(m, j) theta^j (1 - theta)^{m-j} = (1 + (1 - 2 theta)^m) / 2.
        theta = 1/2 gives 1/2; theta = 0 gives 1; theta = 1 gives 1 at even m
        and 0 at odd m. Factor of an aligned window over a theta-window of the
        same size: 2 / (1 + (1 - 2 theta)^m).
      result: 2 at theta = 1/2, every m
    - id: A8
      what: aligned half against Semaev's full V_k, and attempts to fill its matrix
      work: >-
        Aligned half (N/2 legs, all admissible) over V_k (N legs, half
        admissible): (N/2)^m / (N^m / 2) = 2^{1-m}. Attempts |W| / lambda(W):
        (N/2) / (2^{1-m} lambda_V) over N / lambda_V = 2^{m-2}.
      result: 2^{1-m} yield and 2^{m-2} attempts, as stated in claim (D)
    - id: A9
      what: depth-2 class-restricted yield
      work: >-
        Class-0 sub-window (about half the aligned legs, all class-admissible,
        sums uniform on 4E) over the aligned parent (class-sum admissible with
        probability 1/2): (1/2)^m x 4 / ((1/2) x 4) = 2^{1-m}; 0.5 at m = 2,
        0.25 at m = 3. Over a size-matched random half: 2.
      result: P-7 predictions
    - id: A10
      what: toy window and scan sizes
      work: >-
        n = 19, candidate f with s = 5, n - s = 14 >= l = 10. V^(0) is a
        9-dimensional F_2-space: 2^9 - 1 = 511 nonzero linear forms, 2 offsets
        each, 1022 affine hyperplanes.
      result: Stage 2 scan size 1022
    - id: A11
      what: product-space dimensions (confounder)
      work: >-
        V_k = span{1..t^{k-1}}: pairwise products in span{1..t^{2k-2}},
        dimension 2k - 1. A_k inside span{1..t^k}: products in span{1..t^{2k}},
        dimension 2k + 1.
      result: confounders entry (basis dependence)
    - id: A12
      what: frontier rows count
      work: 24 files under generic-rho/ and 24 under index-calculus/ (glob), plus README.md.
      result: 48 KR-* rows

