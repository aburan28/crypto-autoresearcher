        requires.
    - id: AC-10
      what: H1 design means in IDEA-20261001-93e740
      work: >-
        mu = (n - 1) kappa |F_V|^2 / (2 #E), with |F_V| set to 2^l for the
        design figure only and kappa = 1 at h = 2. n = 17, a = 1: 16 x 2^16 /
        262348 = 4.00 (l = 8), 16 x 2^18 / 262348 = 15.99 (l = 9). n = 23,
        a = 1: 22 x 2^22 / 16787612 = 5.50 (l = 11), 22 x 2^24 / 16787612 =
        21.99 (l = 12). n = 31, a = 1: 30 x 2^30 / 4294785884 = 7.50 (l = 15),
        30 x 2^32 / 4294785884 = 30.00 (l = 16). Multiplicity: each triple
        (x(R), t, j) is hit 4 times by the halving route (either leg as P_1,
        either sign of R), so mu = (expected hits)/4 with expected hits
        2 (n - 1) kappa |F_V|^2 / #E. At 9c5694's own n = 17 cell
        (V = {deg < 9}) the same formula gives about 16 triples (8 distinct
        coincidences); see OI-1.
    - id: AC-11
      what: admissibility screens m (l - 1) <= n with l >= 2, on stable dimensions, and search sizes
      work: >-
        m = 2: l <= n/2 + 1, so l <= 9, 12, 16, 21 at n = 17, 23, 31, 41; the
        stable dimensions 8, 9 / 11, 12 / 15, 16 (also 5, 6, 10, 11) / 20, 21
        qualify. m = 3: l <= 6, 8, 11, 14; only n = 31 qualifies (5, 6, 10,
        11). m = 4: l <= 5, 6, 8, 11; only n = 31 with 5 or 6 qualifies.
        Search sizes at m = 4: 2^20 / 24 = 43690.67 and 2^24 / 24 = 699050.67;
        multiset counts C(35, 4) = 52360 and C(67, 4) = 766480. 493606's
        figures re-evaluated: 2^32 / 24 = 178956970.67 and its Koblitz figure
        178956970.67 / 37 = 4836674.9; under claim (A) only the former survives.
        n^{-m} at n = 17, m = 2: 1/289 = 0.0035.
    - id: AC-12
      what: deployed bearing arithmetic (e740ce claim (E); b98944 (S5))
      work: >-
        log2 24 = 4.585; a CNF-XOR attempt at m = 4, l = 33 has log2 size
        132 - 4.585 = 127.415, which is 127.415 - 11.010 = 116.405 bits above
        D3 (D3 quoted from CORR-20260928-4cb669). log2 131 = 7.033; log2 37 =
        5.209. K-163 matched rho sqrt(pi r / (4 x 163)) with log2 r taken as
        162 (approximation, r not re-read): 0.5 x (1.6515 + 162 - 2 - 7.3487) =
        77.151. ECC2K-130 rho 2^60.8090 quoted from CORR-20260928-4cb669, not
        recomputed.
    - id: AC-13
      what: Lemma A2-prime sign cases at m = 2 (supporting 93e740 claim (C))
      work: >-
        Fix points with P_1 + P_2 = R. The four sign patterns for sigma^j R are
        (P_1, P_2) giving R = s lambda^j R, impossible; (-P_1, -P_2) giving
        -R = s lambda^j R, impossible since ord(lambda) is odd; and (P_1, -P_2)
        or (-P_1, P_2), each giving 2 P_i = (1 -/+ s lambda^j) R for one leg.
        Hence every m = 2 coincidence is of halving form, and conversely each
        halving solution with both abscissas in V is a coincidence.

