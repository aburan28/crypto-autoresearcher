  # ---------------------------------------------------------------------------
  # Arithmetic checks (zero compute, by hand, this session). Labelled
  # derivations, not results. "≡" is written "=" mod the stated prime.
  arithmetic_checks:
    - id: AC-1
      what: ord_17(2) and the stable lattice at n = 17
      work: >-
        2^4 = 16 = -1 mod 17, so 2^8 = 1. The proper divisors 1, 2, 4 of 8
        give 2, 4, 16, none equal to 1. ord_17(2) = 8. Phi_17 has (17 - 1)/8 = 2
        irreducible factors of degree 8 over F_2, so T^17 - 1 has 3 factors and
        2^3 = 8 stable subspaces, of dimensions 0, 1, 8, 8, 9, 9, 16, 17.
    - id: AC-2
      what: ord_23(2) and the stable lattice at n = 23
      work: >-
        23 x 89 = 2047 = 2^11 - 1, so 2^11 = 1 mod 23. 11 is prime and 2 != 1,
        so ord_23(2) = 11. Phi_23 has 2 factors of degree 11; 8 stable
        subspaces, of dimensions 0, 1, 11, 11, 12, 12, 22, 23.
    - id: AC-3
      what: ord_31(2) and the stable lattice at n = 31
      work: >-
        2^5 = 32 = 31 + 1, so 2^5 = 1 mod 31, and 5 is prime: ord_31(2) = 5.
        Phi_31 has 30/5 = 6 quintic factors; 2^7 = 128 stable subspaces, of
        dimensions 5j and 5j + 1 for j = 0..6, each with multiplicity C(6, j).
        In particular 6 subspaces of dimension 5 and 6 of dimension 6.
    - id: AC-4
      what: ord_41(2) and the stable lattice at n = 41
      work: >-
        2^10 = 1024 = 24 x 41 + 40, so 2^10 = -1 and 2^20 = 1 mod 41. ord
        divides 20 and not 10, so it is 4 or 20; 2^4 = 16 != 1, so
        ord_41(2) = 20. Phi_41 has 2 factors of degree 20; 8 stable subspaces,
        of dimensions 0, 1, 20, 20, 21, 21, 40, 41.
    - id: AC-5
      what: ord_131(2) (ECC2K-130's degree)
      work: >-
        131 = 3 mod 8, so 2 is a quadratic non-residue and 2^65 = -1 mod 131;
        hence ord is even and does not divide 65: one of 2, 10, 26, 130.
        2^7 = 128 = -3; 2^10 = -24 = 107; 2^13 = -3 x 64 = -192 = 70;
        2^26 = 70^2 = 4900 = 37 x 131 + 53, so 53. None of 4, 107, 53 is 1, so
        ord_131(2) = 130. Phi_131 is irreducible over F_2; stable dimensions
        0, 1, 130, 131 only.
    - id: AC-6
      what: ord_163(2) (K-163's degree)
      work: >-
        163 = 3 mod 8, so 2^81 = -1 mod 163 and ord is one of 2, 6, 18, 54, 162.
        2^8 = 256 = 93; 2^9 = 186 = 23; 2^18 = 23^2 = 529 = 3 x 163 + 40, so 40;
        2^27 = 40 x 23 = 920 = 5 x 163 + 105, so 105; 2^54 = 105^2 = 11025 =
        67 x 163 + 104, so 104; 2^81 = 104 x 105 = 10920 = 67 x 163 - 1, so -1,
        consistent. 2^2 = 4, 2^6 = 64, 2^18 = 40, 2^54 = 104, none 1, so
        ord_163(2) = 162. Phi_163 is irreducible over F_2; stable dimensions
        0, 1, 162, 163 only.
    - id: AC-7
      what: ord_29(2) (493606's secondary degree)
      work: >-
        2^5 = 32 = 3; 2^7 = 128 = 4 x 29 + 12, so 12; 2^10 = 9;
        2^14 = 9 x 16 = 144 = 4 x 29 + 28, so -1. Divisors of 28: 2^1 = 2,
        2^2 = 4, 2^4 = 16, 2^7 = 12, 2^14 = -1, none 1, so ord_29(2) = 28.
        Stable dimensions 0, 1, 28, 29 only: no nontrivial stable subspace.
    - id: AC-8
      what: ord_37(2) (493606's primary degree)
      work: >-
        2^9 = 512 = 13 x 37 + 31, so 31; 2^18 = 31^2 = 961 = 25 x 37 + 36, so -1.
        2^12 = 2^9 x 8 = 248 = 6 x 37 + 26, so 26. Divisors of 36 below 36:
        2^1 = 2, 2^2 = 4, 2^3 = 8, 2^4 = 16, 2^6 = 64 = 27, 2^9 = 31, 2^12 = 26,
        2^18 = -1, none 1, so ord_37(2) = 36. Stable dimensions 0, 1, 36, 37
        only: no nontrivial stable subspace.
    - id: AC-9
      what: Koblitz toy group orders (design figures; recomputed at setup; not required by RV-3)
      work: >-
        Over F_2, y^2 + xy = x^3 + x^2 + 1 has 2 points (trace t = 1) and
        y^2 + xy = x^3 + 1 has 4 (t = -1). With V_0 = 2, V_1 = 1,
        V_{k+1} = V_k - 2 V_{k-1}: V_17 = -101, V_19 = -797, V_23 = -5197,
        V_31 = 90707, and #E_{a=1}(F_{2^n}) = 2^n + 1 - V_n, with V_n negated
        for a = 0 at odd n. So n = 17, a = 1: 131174 = 2 x 65587 (agrees with
        H-BINSTD-ce4f38 fixture G1); n = 19, a = 0: 523492 = 4 x 130873
        (agrees with the figure 9c5694 cites); n = 23, a = 1: 8393806 =
        2 x 4196903; n = 23, a = 0: 8383412 = 4 x 2095853 (agrees with the
