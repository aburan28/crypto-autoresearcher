  d4_calibration:
    requirement: >-
      RD-3. Name the cells on which derivation (A) itself is cross-checked by C1
      against I_direct before Band H, show they exercise the code path Band H
      uses, and show the Stage-1 calibration exercises every route the census
      uses.
    band_h_code_path: >-
      Band H runs A-DENSE at n = 131 with r = n' - 1 (so s = 1) and q + 1 in
      {4, 3, 2} for n' in {33, 44, 66}; B at most 7^4 = 2401. The code path is
      the single function route_a_dense of WO-I-4: compose lambda q + 1 times;
      form H; test H nonzero; n = 131 squarings modulo H; gcd with Y^(2^131) -
      Y; split the gcd into irreducible factors of degree dividing 131 (1 and
      131); find one K-root per factor and expand its Frobenius orbit; closing
      test on every H-root; emit N, roots, orbits and slack. WO-I-11 forbids any
      branch of that function on the cell name or on n, n', q, r, s or d other
      than as loop bounds and arithmetic operands, and AC-8 checks it.
    c1_cells_for_derivation_A:
      - cell: stage3-bridge-n22
        rows: 244
        parameters: n = 131, q = 5, r = 21, s = 1, q + 1 = 6, B at most 7^6 = 117649
        role: >-
          The whole bridge census runs A-DENSE and I_direct on every candidate;
          C1 (M2) is a cross-check of derivation (A) at n = 131 with s = 1, the
          Band-H shape of H.
      - cell: Band-L derivation-(A) rows (route_map)
        rows: 128
        parameters: >-
          n = 131; (n', d) in {(9, 3), (10, 3), (11, 3), (11, 4), (12, 3),
          (12, 4), (13, 3), (13, 4), (14, 3), (14, 4), (14, 5)}; s in {4, 9, 1,
          1, 12, 9} for n' = 9 to 14; q + 1 in {15, 14, 12, 11, 11, 10}.
        role: >-
          C1 (M1) on these rows is a cross-check of derivation (A) at n = 131
          with s = 1 (n' = 11, 12) and s above 1 (n' = 9, 10, 13, 14).
      - cell: stage1-toy-calibration (three cells)
        rows: 756 per route
        parameters: >-
          (11, 6): q = 1, r = 5, s = 1; (13, 7): q = 1, r = 6, s = 1; (7, 3):
          q = 2, r = 1, s = 2; every F_2 lambda of exact degree 2 to 7.
        role: >-
          Not C1 by name (C1 is defined on Band L and the bridge); the
          specification's stage_1 requirement is exact agreement of I_direct and
          I_indep on every candidate. Under A1 it applies to each I_indep route
          separately. q + 1 = 2 (n' = 66's composition depth) and q + 1 = 3
          (n' = 44's) are exercised here, on toy fields.
      - cell: stage5-controls C2, C3, C4, C6
        rows: 1 + 1 + 1 + 8
        role: >-
          Forced-count fixtures (C2 to C4) through I_direct and both I_indep
          routes; the linearized arm C6 through A-DENSE (and I_direct at n' =
          11) against Proposition 2. They gate every census trial
          (d5_ordering).
    same_code_path_argument: >-
      Every A-DENSE row of every cell above calls the same route_a_dense
      callable (identity check, AC-8) with the cell's (n, n', modulus) taken
      from the route table; the n = 131 field, its modulus, the degree-131
      factor handling and the root-finding routine used by Band H are the ones
      the bridge and the Band-L derivation-(A) rows exercise; Band H differs
      only in the integers q, r, s, d.
    stage1_covers_census_routes: >-
      The census uses A-DENSE (Band L derivation-(A) rows, bridge, Band H) and
      S-BERL (2800 Band-L rows). Every Stage-1 candidate runs both routes, each
      compared exactly with I_direct (A1 calibration clause), so the Stage-1
      calibration exercises every census route. A-TWIST is not a census route
      (C5 K-arm only) and is calibrated on synthetic cells only.
    residual_exposure: >-
      Stated, not hidden. (1) No calibration row at n = 131 has q + 1 below 6;
      Band H's composition depths q + 1 in {2, 3, 4} are exercised only on toy
      fields (Stage 1, C2) and on synthetic cells, so a defect that appears
      only jointly at n = 131 and q + 1 at most 4 is not excluded by
      calibration. (2) On the 2800 S-BERL rows C1 calibrates S-BERL and
      I_direct against each other, not derivation (A). (3) The specification's
      sentence that Band-L and bridge agreement calibrates I_indep before Band
      H holds after A1 in the narrowed sense above: the derivation-(A) code path
      is cross-checked by C1 on 372 rows at n = 131 (244 bridge, 128 Band L) and
      on 756 Stage-1 rows at toy n, not on all 2928 + 244 rows. (4) A-TWIST has
      no declared calibration cell.
  d5_ordering:
    requirement: >-
      RD-4. Read stages, controls C1 to C7 and stopping_rules; state where each
      blocking fixture and control runs relative to the census stages, and
      whether the text permits that order. If not, the order goes into A2.
    text_read:
      - >-
        stages are named stage_0 to stage_5 with stage_compare between stage_4
        and stage_5; independent_variables lists 'stage (0, 1, 2, 3, 4, COMPARE,
        5)'. No clause says stage_5 runs after stage_compare or after the
        census.
      - >-
        Explicit order clauses: stage_compare.when "after Stage 4 freeze";
        stage_4.freeze_rule "Only then may Stage COMPARE open sealed producer
        artifacts"; stopping_rules[0] (Stage 0 fails, no census numbers);
        stopping_rules[2] (a Band-L or bridge disagreement stops the cell and
        Band H waits until it is resolved or Coordinator-scoped);
        stopping_rules[5] (Stage 4 freezes, then COMPARE).
      - >-
        controls C2, C3, C4 are "blocking", C6 is "blocking (independent
        decision procedure) ... Disagreement invalidates the run", C5 is
        "blocking for artifact detection; not load-bearing for replication",
        C7 is "reporting", C1 is per row inside Stages 2 and 3.
      - >-
        stopping_rules[1]: "Any proves-too-much fixture wrong: STOP; report F5;
        archive measured value." stage_1.requirement: the proves-too-much
        subset on the Stage-1 cells returns forced counts where applicable (C2's
        fixture (7, 3, X^2+X) lies inside the Stage-1 cell (7, 3)).
      - >-
        stage_5.content mixes two kinds of item: the control arms
        (proves-too-much, null object, linearized, square/degenerate) and the
        closing report (certificate-bearing accounting check, execution-report,
        gate record).
    reading: >-
      The text PERMITS the blocking fixtures and controls to run before the
      census, and its stopping rules REQUIRE it: stopping_rules[1] says STOP
      when a fixture is wrong, which has content only if something still
      remains to be stopped, and a fixture failure discovered after
      stage_compare would arrive after the sealed producer artifacts were
      opened against an instrument the fixture shows to be wrong, which the
      freeze rule exists to prevent. The stage numbers are labels; the only
      order clauses are those listed, and none places stage_5's control arms
      after the census. The closing-report items of stage_5 are inherently last
      and stay last. This is not a change of the frozen order, so no A2 clause
      is written.
    placement:
      - {position: 1, trial: stage0-hand-gate, depends_on: [], what: 'Stage 0 hand gate (stage0_mechanism); F0 stops everything'}
      - {position: 2, trial: stage1-toy-calibration, depends_on: [stage0-hand-gate], what: 'Stage 1, both I_indep routes against I_direct; includes the (7, 3, X^2+X) row'}
      - {position: 3, trial: stage5-controls, depends_on: [stage0-hand-gate, stage1-toy-calibration], what: 'control arms C2, C3, C4 (fixtures, both I_indep routes and I_direct), C5 (null object, all four sub-arms), C6 (linearized, Proposition 2); F5 or F1 stops every census trial'}
      - {position: '4 to 15', trial: 'stage2-bandL-n3 ... stage2-bandL-n14', depends_on: [stage0-hand-gate, stage1-toy-calibration, stage5-controls], what: 'Band L; C1 per row; a disagreement stops that cell (F_agree) and, through Band H dependencies, Band H'}
      - {position: 16, trial: stage3-bridge-n22, depends_on: [stage0-hand-gate, stage1-toy-calibration, stage5-controls], what: 'bridge; C1 per row'}
      - {position: '17 to 19', trial: 'stage4-bandH-n33, -n44, -n66', depends_on: '[stage0-hand-gate, stage1-toy-calibration, stage5-controls, all twelve stage2 trials, stage3-bridge-n22]', what: 'Band H, I_indep only; freeze record per trial'}
      - {position: 20, trial: stage-compare-sealed, depends_on: [stage4-bandH-n33, stage4-bandH-n44, stage4-bandH-n66], what: 'COMPARE after freeze; F_rep is a result, not a stop'}
      - {position: after 20, trial: none (execution card deliverable), depends_on: [], what: 'closing report of stage_5: execution-report.yaml, gate record C1 to C7 and F-codes, cross-stage certificate-accounting sheet, C7 square-arm listing, HEUR-1 summaries; aggregation of committed run outputs only, no new computation'}
    mechanism: >-
      Stopping rules become plan mechanics, not prose: each payload's checker
      exits non-zero on its stop condition (WO-R-9 exit codes), the runner
      records the trial as not output_validated, and every dependent trial
      stays waiting_on_dependencies (tools/experiment_execution.py coverage).
      Band-L trials depend only on the gates, so one cell's stop does not stop
      another Band-L cell; Band H depends on all of them.
    c5_placement_note: >-
      C5's n' = 33 F_2 arm draws random degree-3 and degree-7 lambda, which are
      census candidates of Band H; its I_indep values at those lambda are
      computed before Stage 4. That opens nothing sealed and is not a
      comparison; it is recorded so that no one reads it as a freeze breach.
    a2_needed: false
  stage0_mechanism:
    requirement: >-
      RD-5 and D-6. The hand re-derivation of (A) at (n, n') = (4, 3) on
      X^2+X+1 and X^3+1 is produced and checked with no census code reachable,
      the blind_from paths' existence is confirmed, and M9 records a declared,
      checkable read set per run (never a constant). No Stage-0 content is
      produced in this batch.
    who_and_when: >-
      The hand note is written in the EXECUTION batch that a later Coordinator
      decision opens for trial-plan-r1.json, never in BATCH-4708f7. Its author
      is the session that batch's opening decision names for it (its run-card
      executor, or a zero-run card of that batch), working by hand: no code is
      executed for the note's mathematical content and no r1 module is loaded
      in that session. The author is neither the I_indep author
      (TASK-20261002-e0b22e) nor the runner author (TASK-20261002-b72830). The
      note is committed at the fixed path
      experiments/EXP-QSP-70b731/stage0/hand-derivation-note-r1.yaml after that
      batch's execution approval and before stage0-hand-gate is launched.
    note_schema:
      schema: qsp70b731.stage0.hand.v1
      fields:
        - 'test_only: false (true is accepted only under the test flag of WO-R-10)'
        - 'cell: {n: 4, n_prime: 3}; field representation F_16 = F_2[z]/(z^4+z+1), whose irreducibility the author checks by hand'
        - 'author_session and computation_attestation (no code executed for the content)'
        - >-
          derivation: the identity lambda(z)^(2^k) = lambda(z^(2^k)) for lambda
          in F_2[X]; the chain x^(2^(kn')) = lambda^(ok)(x); the substitution y =
          x^(2^r); H(Y) = Y^(2^(n'-r)) + lambda^(o(q+1))(Y); the bound; the
          closing test; each as prose written by the author.
        - >-
          per_lambda (exactly the two lambda X^2+X+1 and X^3+1): q, r, s, d,
          bound; H written out by hand; whether H vanishes or loses degree (at
          (4, 3), d = 2 gives d^(q+1) = 2^(n'-r) = 4, the case
          IDEA-20260916-3f7a1c's nonvanishing clause does not cover, so the note
          must say what happens there); a 16-row table (element, x^8,
          lambda(x), is_root); roots_of_L; N_hand; H's roots in F_16; the
          closing test per H-root; passing set; slack.
        - 'verdict: pass or fail, with verdict_reason'
        - 'read_declaration: the ordered list of paths the author read'
    trial_mechanics: >-
      The stage0-hand-gate payload (r1/runner/stage0.py, WO-R-10) does
      bookkeeping only. It copies the committed note into the run directory as
      stage0-hand-note.yaml and checks that the copy equals HEAD's blob; checks
      the schema; refuses test_only notes; checks (n, n') = (4, 3) and the
      lambda set; checks, per lambda, that the table has 16 distinct elements,
      that roots_of_L equals the elements marked is_root, that N_hand equals
      len(roots_of_L) and equals the size of the passing set, and that slack
      equals the number of listed H-roots minus N_hand; and reads the verdict.
      It performs NO field arithmetic. A failed check or verdict fail is F0
      (checker exit 9, which stops every dependent trial). Its mathematical
      correctness is a matter for the execution round's validator, who
      re-checks the note by hand.
    blind_from_existence: >-
      For each of the ten specification.independence_declaration.blind_from
      paths the payload calls os.path.exists on the path itself and records the
      boolean; it never lists, opens or reads any of them. All ten must exist;
      a missing path stops the gate (exit 9) with the path named.
    m9: >-
      The payload computes M9 per run from declared, committed read sets
      (WO-R-11): the I_indep implementation report, the runner implementation
      report, the hand-note author's read_declaration, and the execution
      session's declaration named in execution-context-r1.yaml. Each file is
      hashed; its paths are matched against blind_from (exact or directory
      prefix); blind_from_respected is true only if every declaration exists,
      is non-empty and has no match. It is never a constant (AC-11).
    no_census_code: >-
      stage0.py may import only r1/runner/manifest.py, readset.py, context.py
      and errors.py and the standard library and PyYAML. AC-10 checks the
      transitive import graph statically, and stage0.py asserts at start and at
      exit that no module of r1/indep and none of r1/runner/census.py,
      controls.py, i_direct.py, kfield.py, certs.py, compare.py is present in
      sys.modules; a hit fails the trial (exit 9). PTM-R6 inserts such an
      import into a scratch copy and must see both checks fail.
    stage0_rows: >-
      Stage 0 emits no measurement rows: rows_completed 0, zero_N_rows 0,
      certificate_bearing 0, so M5 holds trivially. The hand values live in the
      note, a document, and are not M-metrics.
    produced_in_this_batch: none
  interface:
    layout:
      indep: >-
        experiments/EXP-QSP-70b731/implementation/r1/indep/ (TASK-20261002-e0b22e
        only): __init__.py, api.py (entry and invariants), routes.py (literal
        route table and lookup), gf2x.py (F_2[X] primitives), fieldk.py (K and
        K[Y] arithmetic), route_a.py (A-DENSE and A-TWIST), route_berl.py
        (S-BERL), roots.py (roots in K of irreducible factors), errors.py, and
        tests/ (synthetic cells only). The file list may differ in names below
        api.py and routes.py; the rules of WO-I bind whatever files exist.
      runner: >-
        experiments/EXP-QSP-70b731/implementation/r1/__init__.py and
        experiments/EXP-QSP-70b731/implementation/r1/runner/
        (TASK-20261002-b72830 only): __init__.py, main.py, context.py,
        manifest.py, readset.py, stage0.py, candidates.py, i_direct.py,
        kfield.py, census.py, controls.py, certs.py, accounting.py, compare.py,
        check.py, plan_check.py, audit_indep.py, errors.py, tests/.
      plan: experiments/EXP-QSP-70b731/trial-plan-r1.json (TASK-20261002-b72830)
      import_rule: >-
        The runner imports I_indep only as r1.indep.api (count_roots,
        routes_for and the exception classes). r1/indep imports nothing from
        r1/runner. All r1 imports are absolute package imports under r1; no r1
        module imports a top-level name equal to a bound module (candidates,
        check, driver, field_f2n, gf2_poly, i_direct, i_indep), and main.py and
        check.py assert after imports that none of those names is in
        sys.modules (implementation/ is on sys.path to reach r1, so a bare
        "import candidates" would load the bound file).
    entry_function:
      module: r1/indep/api.py
      signature: |
        def count_roots(cell: str, n: int, n_prime: int, lam, *, route: str | None = None,
                        rng_seed: int) -> dict:
            ...
        def routes_for(cell: str, d: int) -> tuple[str, ...]:
            ...
      arguments:
        cell: >-
          The cell name exactly as in route_table.route_map (or a synthetic name
          of synthetic_cells). Unknown name raises UnknownCell.
        n, n_prime: >-
          Must equal the table's values for the cell; a mismatch raises
          ArgumentMismatch. The field modulus is taken from the table, never
          from the caller.
        lam: >-
          An int for an F_2-coefficient lambda (bit i is the coefficient of X^i),
          or a tuple of ints for a K-coefficient lambda (entry i is the
          coefficient of X^i as a K element, bit j the coefficient of z^j). The
          table states which form a cell takes; the wrong form raises
          ArgumentMismatch. d = degree of lam (leading coefficient nonzero).
        route: >-
          None when routes_for(cell, d) has one route; otherwise one of the
          routes it returns (Stage-1 cells and C2 to C4 return two, and the
          runner calls once per route). A route not in routes_for(cell, d)
          raises RouteNotApproved.
        rng_seed: >-
          The only randomness source (WO-I-9); the runner derives it per row
          (WO-R-16).
      routes_for: >-
        A pure table lookup (no arithmetic on lam, no computation on the cell);
        AC-6 calls it for every declared key without computing anything.
      return_schema:
        schema: qsp70b731.r1.indep.v1
        fields:
          - 'cell, n, n_prime, q, r, s, d: ints and the cell name, echoed'
          - 'lambda: hex string (F_2 form) or list of hex strings (K form)'
          - 'route: A-DENSE | S-BERL | A-TWIST'
          - 'N: int, the number of distinct K-roots of L found'
          - 'roots: list of K elements as lowercase hex strings of the polynomial-basis coefficient vector over the cell modulus, sorted by integer value, pairwise distinct; len(roots) == N'
          - 'orbits: list of {rep, size}, the Frobenius orbits partitioning roots (sizes sum to N); empty with flag NO_FROBENIUS_ORBITS for K-coefficient lambda, whose root set need not be Frobenius-closed'
          - 'bound: int, max(2^s, d^(q+1))'
          - 'h_degree: int or null (null for S-BERL)'
          - 'h_roots_in_K: int or null (A routes: number of K-roots of H)'
          - 'slack: int or null (A routes: h_roots_in_K - N; null for S-BERL)'
          - 'factor_degrees: list of ints (S-BERL: degrees of the distinct irreducible factors of rad(L); A routes: of the gcd of H with Y^(2^n) - Y)'
          - 'flags: list from {SQUARE_LAMBDA, H_DEGREE_BELOW_BOUND, NO_FROBENIUS_ORBITS, LINEARIZED_LAMBDA}'
          - 'rng_seed: int, echoed'
        invariants_enforced_before_return: >-
          N == len(roots) == sum of orbit sizes (when orbits are given); roots
          pairwise distinct; each root r satisfies r^(2^n') == lambda(r) in K by
          I_indep's own arithmetic; A routes N <= h_roots_in_K <= h_degree.
          A violation raises InvariantViolation; no partial result is returned.
      exceptions: >-
        UnknownCell, ArgumentMismatch, RouteNotApproved, ModulusNotIrreducible,
        HVanishes, FactorDegreeInconsistent, RootSearchFailure,
        BerlekampSplitIncomplete, InvariantViolation, all subclasses of
        IndepError. The runner records a raised IndepError as a row with status
        instrument_error (class and message) and N null; it is never converted
        into a count.
    reuse_of_bound_closure: >-
      None. Neither package imports any of the eight bound files (CI-1 for
      I_indep; this design's choice for the runner). The runner's author may
      read them (its card's read_scope) and may follow the bound i_direct.py's
      algorithm in the new r1/runner/i_direct.py, written as new code; the
      plan's source_sha256 then binds r1 files only (plan_requirements), and
      the eight bound files stay at the digests D-C5 reports, untouched.
  work_orders:
    WO-I:
      executor_task: TASK-20261002-e0b22e
      scope: >-
        I_indep under experiments/EXP-QSP-70b731/implementation/r1/indep/ and its
        implementation-report.yaml. Stated from
        specification.inputs.instruments.I_indep, derivation (A) as H-QSP-cd0c90 (statement) and
        IDEA-20260916-3f7a1c (claim (A) and (C)) record it, and A1 of
        AMD-20261002-1303c4. It carries no code of the bound i_indep.py,
        gf2_poly.py or i_direct.py; this producer did not read i_indep.py,
        gf2_poly.py, field_f2n.py or check.py.
      items:
        - id: WO-I-1
          title: Reads, imports and custody
          text: >-
            Read only what the card's read_scope lists. Read nothing in the
            specification's blind_from, no file of implementation/*.py and
            nothing under r1/runner/ (CI-1, CC-4). Import only the standard
            library (math, random, typing, dataclasses, functools, itertools,
            collections, hashlib, json, os, sys, time) and modules of r1/indep;
            no importlib, no sys.path edits, no third-party package. Write new
            files under r1/indep/ only (CI-2). Record every path read, in order,
            in implementation-report.yaml under read_attestation.paths_read.
        - id: WO-I-2
          title: Interface
          text: >-
            Implement count_roots and routes_for exactly as interface.entry_function
            states, with its argument checks, return schema, invariants and
            exception classes. At first use of a cell, test its modulus for
            irreducibility over F_2 (Rabin's test or Ben-Or's, the author's
            choice) and raise ModulusNotIrreducible on failure; cache the result
            per modulus.
        - id: WO-I-3
          title: Route selection by name (CI-3)
          text: >-
            routes.py holds the route table as one dict literal keyed by cell
            name, each entry giving n, n_prime, modulus (as the z-polynomial
            string of route_table.route_map), coefficient form (F2 or K) and a
            dict literal from degree d to a tuple of route names; it equals
            route_table.route_map for declared cells (A1's table) and
            synthetic_cells for synthetic ones. routes_for looks up (cell, d);
            count_roots dispatches through a dict from route name to function.
            No comparison operator (<, <=, >, >=) and no arithmetic on n, n',
            q, r, s, d, B or deg L may occur in routes.py or in the dispatch
            path of api.py; an unknown (cell, d) raises.
        - id: WO-I-4
          title: A-DENSE, derivation (A) for F_2-coefficient lambda
          text: >-
            Given cell, lambda in F_2[X] of degree d, n, n' and the cell modulus
            P (K = F_2[z]/(P)): (1) q, r = divmod(n, n'); s = n' - r. (2) Lam_0 =
            Y; Lam_(j+1) = lambda(Lam_j) for j = 0 .. q, by Horner over F_2[Y];
            so Lam_(q+1) = lambda^(o(q+1)). (3) H = Y^(2^s) + Lam_(q+1); if H = 0
            raise HVanishes; record h_degree and set H_DEGREE_BELOW_BOUND when
            h_degree < max(2^s, d^(q+1)). (4) R = Y^(2^n) mod H by n successive
            squarings modulo H starting from Y mod H. (5) G = monic gcd(H, R + Y
            mod H); G's roots are the K-roots of H, each once. (6) Split G into
            irreducible factors over F_2; every factor degree must divide n,
            else raise FactorDegreeInconsistent. (7) For each factor f, find its
            deg f roots in K with roots.py (WO-I-7) and record the Frobenius
            orbit. (8) For each K-root y of H compute x = lambda^(oq)(y) in K
            and accept y iff x^(2^r) == y and x^(2^n') == lambda(x) in K. (9)
            N = number of accepted y; roots = the corresponding x; orbits = the
            images of the y-orbits (Frobenius-equivariant); h_roots_in_K = deg
            G; slack = deg G - N. Correctness: if x in K is a root of L then y =
            x^(2^r) is a K-root of H and x = lambda^(oq)(y); conversely an
            accepted y gives a root x with x^(2^r) = y, and distinct accepted y
            give distinct x (IDEA-20260916-3f7a1c claim (A) and (C)).
        - id: WO-I-5
          title: A-TWIST, derivation (A) for K-coefficient lambda (C5 K-arm at n' = 33; synthetic syn-t cells)
          text: >-
            Notation: sigma is z -> z^2 on K; mu^(sigma^j) applies sigma^j to the
            coefficients of mu in K[X]. For every z in an algebraic closure and
            mu in K[X], mu(z)^(2^j) = mu^(sigma^j)(z^(2^j)). If x^(2^n') =
            lambda(x), induction gives x^(2^(kn')) = Lam_k(x) with Lam_1 = lambda
            and Lam_(k+1) = lambda^(sigma^(kn')) o Lam_k. For x in K, x = x^(2^n)
            = Lam_q(x)^(2^r) = M(x^(2^r)) with M = Lam_q^(sigma^r) =
            lambda^(sigma^((q-1)n'+r)) o ... o lambda^(sigma^(n'+r)) o
            lambda^(sigma^r). Put y = x^(2^r); then y^(2^s) = x^(2^n') =
            lambda(x) = lambda(M(y)). So every K-root x of L gives a K-root y of
            H_tw(Y) = Y^(2^s) + lambda(M(Y)), of degree at most max(2^s,
            d^(q+1)), and x = M(y); conversely y in K with x = M(y), x^(2^r) = y
            and L(x) = 0 is such a root, distinct y giving distinct x. With
            lambda in F_2[X], sigma acts trivially and H_tw is derivation (A)'s
            H. Steps: build M innermost first in K[Y] (M_0 = Y; M_(j+1) =
            lambda^(sigma^(jn'+r))(M_j) for j = 0 .. q-1); H_tw = Y^(2^s) +
            lambda(M_q); raise HVanishes if zero; R = Y^(2^n) mod H_tw in K[Y]
            (n squarings: sigma on coefficients, then reduce); G = monic gcd(H_tw,
            R - Y) in K[Y]; all roots of G lie in K and are found by equal-degree
            splitting over K (trace map with random beta in K, seeded); closing
            test x = M(y), x^(2^r) == y, x^(2^n') == lambda(x); N, roots, flag
            NO_FROBENIUS_ORBITS, orbits empty, slack = deg G - N. This derivation
            is this design's (provenance internal, this record); JD2 checks it.
        - id: WO-I-6
          title: S-BERL, the A1 substitute (Band-L rows per A1; Stage 1; C2 to C4)
          text: >-
            (1) L = X^(2^n') + lambda(X) in F_2[X]. (2) rad(L), the product of
            the distinct irreducible factors, by the characteristic-2 squarefree
            algorithm (gcd with the derivative; where the derivative vanishes,
            take the square root by halving exponents; recurse). (3) Berlekamp:
            with m = deg rad(L), the m x m matrix over F_2 whose row i is X^(2i)
            mod rad(L) for i < m, the rows built by repeated multiplication by
            X^2 (shift by two, then reduce), never by squaring a residue;
            kernel of Q - I by Gaussian elimination on bit-packed rows; k = its
            dimension is the number of distinct irreducible factors. (4) Split:
            starting from {rad(L)}, for each kernel basis polynomial v and each
            current factor g of degree above 1, replace g by gcd(g, v mod g) and
            g divided by it when the gcd is proper; stop at k factors; fewer
            than k after all basis vectors raises BerlekampSplitIncomplete. (5)
            N = sum of deg f over the factors f whose degree divides n; roots by
            roots.py for each such f; factor_degrees reported; slack and
            h_degree null. Basis: an irreducible F_2-polynomial has a root in
            F_(2^n) iff its degree divides n, and then all its roots lie there
            and are distinct (standard finite-field theory; provenance recalled,
            supports nothing until reviewed; the synthetic tests and Stage 1 are
            the checks). Independence rules (AC-7): S-BERL never squares a
            residue modulo L or rad(L), never forms X^(2^k) mod L for k >= 2 by
            any means, and computes no gcd of X^(2^n) - X with L or rad(L).
        - id: WO-I-7
          title: Roots in K of an irreducible F_2 factor (CI-4)
          text: >-
            roots.py finds all deg f roots in K = F_2[z]/(P) of an irreducible f
            in F_2[Y] with deg f dividing n, by a method of the author's choice
            (equal-degree splitting of f over K with the trace map
            Tr(beta Y) for random beta, or an embedding of F_2[Y]/(f) into K
            found by root-finding in F_2[Y]/(f)), seeded only from rng_seed. A
            declared, finite attempt budget (a module constant stated in the
            report) bounds the random trials; exhausting it raises
            RootSearchFailure; a found root is checked by evaluating f in K
            before use; the orbit {y^(2^i)} must have exactly deg f distinct
            elements, else InvariantViolation. No code path skips a factor.
        - id: WO-I-8
          title: Failure semantics (D-3, CI-4)
          text: >-
            Every failure raises a subclass of IndepError (interface). No except
            clause in r1/indep may swallow an exception, return a count, or
            continue past a factor (no bare except, no except Exception followed
            by pass, continue or return of a number); AC-5 checks this by AST
            and by fault injection. Under-listing is impossible by construction:
            N is defined as len(roots).
        - id: WO-I-9
          title: Seeds (D-7)
          text: >-
            count_roots constructs exactly one random.Random(rng_seed) and passes
            it down. No other Random is constructed, no module-level random
            function is called, and nothing is seeded from time, os.urandom or a
            literal constant. The report lists every place randomness is drawn.
        - id: WO-I-10
          title: Independence from I_direct (CI-1, D-4)
          text: >-
            Bitwise operators (^, &, |, <<, >>, ~) and int.bit_length or
            bit_count appear only in gf2x.py and fieldk.py. Every polynomial or
            field operation elsewhere goes through those modules' public
            functions, each of which records (function, modulus degree, modulus
            digest) in a module-level trace list when tracing is switched on
            (enable_trace and disable_trace, off by default). No route computes
            Y^(2^n) or X^(2^k), k >= 2, modulo L or rad(L) of the current cell;
            A-DENSE's n squarings are modulo H. The report states these facts
            and the trace output on two synthetic cells.
        - id: WO-I-11
          title: One A-DENSE code path (D-4 calibration)
          text: >-
            A single function implements A-DENSE for every cell the table
            assigns to it; it does not branch on the cell name or on n, n', q,
            r, s or d except as loop bounds and arithmetic operands. Allowed
            branches are data-dependent only (Euclid termination, splitting
            outcomes, H = 0, the closing test).
        - id: WO-I-12
          title: Tests (CI-5, CI-6)
          text: >-
            Under r1/indep/tests/, run under /usr/local/bin/python3 (CPython
            3.11.15) on synthetic cells only (synthetic_cells). Brute force:
            test-only code that enumerates all 2^n elements x of the synthetic
            field and keeps those with x^(2^n') == lambda(x), written
            independently of the routes. For every syn-a and syn-b cell and every
            F_2 lambda of exact degree 2 to 7 the route's N and root set equal
            brute force; syn-a-17-04 and syn-b-17-04 agree row for row; for
            syn-t cells, 20 lambda per degree 2 to 4 with K coefficients from a
            declared seed agree with brute force, and A-TWIST on F_2 lambda
            equals A-DENSE; syn-a-10-05 with lambda = X returns N = 32; a forced
            root-search failure (monkeypatched roots.py) raises
            RootSearchFailure on one A-DENSE and one S-BERL row; a forced
            under-listing (a route stub returning N with a shorter list) raises
            InvariantViolation. Tests mint no RUN id and write only under their
            own temporary directories.
        - id: WO-I-13
          title: Implementation report
          text: >-
            implementation-report.yaml: read_attestation.paths_read (ordered),
            a table mapping each step of WO-I-4, WO-I-5 and WO-I-6 to the function
            that implements it, the route literal as written, the attempt budget
            of WO-I-7, test outputs, served model with fallback_used, and no run
            value of any declared cell.
    WO-R:
      executor_task: TASK-20261002-b72830
      scope: >-
        r1/__init__.py, r1/runner/, trial-plan-r1.json and its
        implementation-report.yaml. Discharges D-1, D-2, the accounting half of
        D-3, D-5, D-6, D-7, D-8, CC-1 to CC-4, CI-2, CI-5, CI-6.
      items:
        - id: WO-R-1
          title: Reads, imports and reuse
          text: >-
            The author may read the bound closure (card read_scope) and r1/indep
            (to integrate, never to edit). r1/runner imports nothing from
            implementation/*.py; from r1/indep it imports only r1.indep.api.
            Allowed third-party: PyYAML (its version recorded per run). check.py
            may import tools/validate_ledger.py and plan_check.py may import
            tools/experiment_execution.py; nothing else outside r1 and the
            standard library. The wrapper's K arithmetic (kfield.py) and I_direct
            are runner code, not I_indep's. Record the read set in
            implementation-report.yaml read_attestation.paths_read (ordered).
        - id: WO-R-2
          title: Run manifest (D-1)
          text: >-
            Every payload writes manifest.yaml with one top-level key run whose
            body carries at least: id (the run id), experiment_id, trial_id,
            status (running | completed | completed_invalid | failed; never an
            expired form), plan {path, sha256 and authority commit read from the
            runner's launch.json, task_id, approved_by}, code {commit (git
            rev-parse HEAD), dirty (whether tracked files differ from HEAD),
            dirty_paths (excluding the run directory), command (the exact argv,
            shell-quoted), entry, source_sha256 (recomputed for every r1 file and
            the amendment), specification_sha256, amendment_sha256},
            environment {python version and executable, implementation,
            platform, sys.platform, machine, hostname, RLIMIT_AS read back,
            dependencies (third-party modules found in sys.modules with
            versions; r1/indep stdlib-only asserted), runtime_lock},
            inference {requested_policy, backend, resolved_model_id,
            model_provenance, model_verified, reasoning_effort, fallback_used,
            fallback_reason, degraded_requirements, copied from the execution
            context file with its path and sha256, and payload_model_invocations
            0; field names follow harness/runner.py where it defines them},
            inputs {parameters (stage, cells, n, n', field_bits, moduli,
            candidate rule and count, route per (cell, d)), seeds (base_seed
            20260920, derivation rule, every stream used), context (path,
            sha256, committed at HEAD), read_set (M9)}, timing {started_at,
            finished_at, elapsed_seconds, peak RSS, per-route seconds}, result
            {certificate {kind none}, raw_result (path and sha256), valid,
            validity_status (valid | invalid | incomplete), validity_reason,
            invalid_reason, f_codes, stop_code, accounting (WO-R-8), metrics
            (M1 to M9 as the stage defines them), freeze (Stage 4), headline}.
            The checker validates it with check_run (AC-1).
        - id: WO-R-3
          title: Attempts are visible (D-8)
          text: >-
            Before any computation the payload writes manifest.yaml with status
            running, result.raw_result_pending true and result.certificate.kind
            none, every other required field filled
            (docs/claims-and-verification.md, nonterminal observations), and a
            write-once copy attempt-start.yaml. On completion it atomically
            replaces manifest.yaml (os.replace) with the terminal record. On an exception it writes
            status failed with validity_reason before exiting. A killed payload
            therefore leaves a check_run-valid nonterminal manifest; rows.jsonl
            keeps every finished row. Never estimate unfinished rows.
        - id: WO-R-4
          title: Interpreter and environment (CI-5)
          text: >-
            Code runs under CPython 3.11 or later and uses no 3.12-only API;
            sys.version and sys.executable are recorded per run. The plan's argv
            starts with python3 and the execution host's interpreter is recorded,
            never assumed.
        - id: WO-R-5
          title: Linux gate (CC-3)
          text: >-
            First act of main.py after the provisional manifest: if sys.platform
            is not linux, write status failed with validity_reason "platform
            requirement linux not met (RLIMIT_AS)" and exit 2.
        - id: WO-R-6
          title: Census and calibration rows
          text: >-
            candidates.py enumerates, by rule name, the census set (every
            non-linearized lambda of exact degree 3 to 7; 244) and the Stage-1
            set (every lambda of exact degree 2 to 7; 252) in ascending degree,
            then ascending integer value, with flags square, affine_linearized,
            linearized; counts must equal D-C4's. Moduli come from the route
            table; kfield.py tests each for irreducibility before use (failure:
            infrastructure stop, exit 2). Per row: I_direct (Stages 1 to 3 and
            the fixtures; none in Band H) with i_direct.py's own F_2[X] arithmetic
            (N = deg gcd(X^(2^n) - X, L) by repeated squaring modulo L, as the
            specification defines it); count_roots once per route in
            routes_for(cell, d); wrapper verification (WO-R-7); certificate if N
            > 0; the row appended to rows.jsonl with an fsync. Row fields:
            lambda (hex), degree, n, n_prime, q, r, s, I_direct_N (null in Band
            H), I_indep_N per route, route(s), bound, ratio, slack, h_degree,
            flags, agree (per route, null in Band H), certificate_path (null iff
            N = 0), root_count_listed, wrapper_verified, rng_seed, seconds per
            instrument, status (completed | instrument_error) and error. At the
            end raw-result.json holds the rows, per-cell summaries, M1 or M2 (or
            the Stage-1 agreement counts per route), the M4 histogram and
            orbit-carrying count per cell, square rows listed separately (C7),
            and for Band-L cells the HEUR-1 tail figures labelled model checks.
            Under the 8 GB ceiling the trial's memory_mb is 8192.
        - id: WO-R-7
          title: Wrapper re-verification and certificate files (D-2)
          text: >-
            For each route output with N > 0 the payload, using kfield.py (never
            r1/indep code), checks every listed root x: x^(2^n') == lambda(x) in
            K; the roots are pairwise distinct; their number equals N; each
            listed orbit is closed under squaring and has its stated size (F_2
            lambda); for dual-route cells both lists are equal as sets. It then
            writes certs/<cell slug>/<lambda hex>.json (schema
            qsp70b731.r1.cert.v1: run and trial ids, cell, n, n', modulus,
            lambda, N, per route roots and orbits, and wrapper_verification
            {verifier, roots_checked, all_satisfy_L, pairwise_distinct,
            count_equals_N, orbits_closed, sets_equal_across_routes, verified,
            failures}) and adds it to certificates-index.json (path, sha256, N,
            verified). N = 0 rows write no file. A failed verification marks the
            row's certificate not verified; the row stays in the data, never
            counted certificate-bearing (invalidation_rules[2]).
        - id: WO-R-8
          title: Accounting from files on disk, M5 before any headline (D-2, D-3)
          text: >-
            accounting.py computes, per stage and per trial, from rows.jsonl and
            the certs directory as found on disk: rows_completed (status
            completed), zero_N_rows, positive_rows, certificate_bearing (files
            whose recomputed sha256 equals the index and whose roots re-verify,
            with N > 0), files_on_disk, incomplete_rows, identity_holds
            (certificate_bearing + zero_N_rows == rows_completed) and
            files_equal_index. A row whose root_count_listed differs from its
            I_indep_N is an InvariantViolation in the payload and an F_acct
            failure in the checker; there is no deferred-list state. The
            headline field is written only after identity_holds is true;
            otherwise it is null and validity is invalid with F_acct.
        - id: WO-R-9
          title: Checker without fallback, and stop codes (D-3, D-5)
          text: >-
            check.py <run_dir> runs in a separate process and trusts no payload
            counter. In order: manifest has top-level run and check_run (imported
            from tools/validate_ledger.py, fresh context) reports no error, else
            exit 8; every certificate file is re-hashed against the index and
            every root re-verified with kfield.py, accounting is recomputed from
            disk and must equal the payload's, else exit 3 (F_acct); M9 read set
            must be declared and free of blind_from hits, else exit 7 (F_ind);
            Stage 0 bookkeeping and verdict, else exit 9 (F0); fixtures C2 to C4
            must equal (8, 32768, 64) on I_direct and every I_indep route, and C6
            must agree with Proposition 2, else exit 5 (F5); any non-square row
            with verified N above its bound, else exit 6 (F1); Stage 1, Band L
            and bridge rows must have I_direct_N equal to every route's
            I_indep_N, else exit 4 (F_agree); any instrument_error row, exit 10
            (incomplete). Otherwise exit 0. Any exception inside the checker
            exits 2, never 0. COMPARE disagreements are results (F_rep) and do
            not change the exit code. The receipt status the runner then writes
            (invalid_output for a non-zero exit) is a runner label; the manifest
            and execution report state the stop code and, for F1, that the
            observation is valid.
        - id: WO-R-10
          title: Stage 0 mechanics (D-6)
          text: >-
            stage0.py implements stage0_mechanism.trial_mechanics,
            blind_from_existence, m9 and no_census_code exactly. A
            --allow-test-fixture flag accepts a note with test_only true at a
            synthetic cell for tests only; production refuses it.
        - id: WO-R-11
          title: M9 read set per run (D-6, CC-4)
          text: >-
            readset.py loads each declared read set named in the execution
            context file (the two implementation reports, the hand-note author's
            declaration, the execution session's declaration), hashes each,
            matches each path against the ten blind_from entries (exact match,
            or prefix match for entries ending in a slash), and records per file
            the path, sha256, count and hits. blind_from_respected is true only
            if every file exists, is committed, is non-empty and has no hit.
            Nothing is hard-coded.
        - id: WO-R-12
          title: Controls trial (C2 to C6)
          text: >-
            C2 (7, 3, X^2+X), C3 (31, 15, X^128+X^8+X^2+X) and C4 (12, 6, X):
            I_direct and both I_indep routes; forced 8, 32768, 64. C5 null object:
            for each n' in {11, 33}, d in {3, 7} and coefficient field in {F_2,
            K}, 100 lambda of exact degree d drawn with replacement from the
            named stream of WO-R-16 (F_2: leading 1, lower bits uniform; K:
            lower coefficients uniform in K, leading coefficient uniform in K
            minus 0); n' = 11 arms by I_direct only (F_2[X] or K[X]; I_direct
            lists roots by factoring its gcd so N > 0 rows carry certificates),
            n' = 33 arms by I_indep (A-DENSE for F_2, A-TWIST for K); M7: N
            histogram, orbit-carrying counts, Poisson upper-tail probabilities,
            labelled model checks; any null row with N above its bound is F1. C6:
            the four linearized degree-4 shapes at n' = 11 (I_direct and
            A-DENSE) and n' = 33 (A-DENSE); for L = X^(2^n') + lambda write the
            associate f(T) = T^(n') + sum of c_i T^i over lambda's terms c_i
            X^(2^i); Proposition 2 of KN-LIT-4fe9d2 decides complete splitting
            as f dividing T^n - 1 over F_2 (division in F_2[T], runner code);
            the pipeline must report N = 2^(n') exactly when Proposition 2 says
            complete splitting, and both instruments must agree at n' = 11. The
            C5 count of 100 per (n', d, field) is this design's reading of
            "100 random F_2-coefficient and 100 random K-coefficient lambda at d
            in {3, 7}" together with "named sub-streams per (n', d,
            coefficient_field)".
        - id: WO-R-13
          title: Square and degenerate rows (C7)
          text: >-
            Rows with square lambda are listed separately per cell with the
            n'-1 reduction noted and excluded from HEUR-1 summaries; they remain
            in M1, M2 and M5.
        - id: WO-R-14
          title: COMPARE
          text: >-
            compare.py takes the three Stage-4 run ids from its argv and, before
            opening anything sealed, verifies for each that the execution receipt
            reads output_validated and that result.freeze in its manifest holds
            frozen true with sha256 values equal to the current raw-result.json
            and certificates-index.json; any failure exits non-zero without
            opening a sealed path. It then reads the compare map at the fixed path
            experiments/EXP-QSP-70b731/compare/compare-map-r1.yaml (written after
            the freeze by the execution batch, the only party that may then open
            the sealed EXP-QSP-33b442 Stage-3 files; it names files, JSON pointers
            and the lambda encoding from a closed vocabulary), reads the sealed
            files through it, and writes compare-report.json: per candidate
            lambda, n', frozen N, sealed N, agree, certificate path; M3; every
            disagreement in full. The runner author never reads the sealed files.
        - id: WO-R-15
          title: Stage-4 freeze record
          text: >-
            Each Band-H payload, after its rows and certificates are complete and
            accounting holds, writes result.freeze {frozen: true,
            raw_result_sha256, certificates_index_sha256, declared_at} in its
            terminal manifest.
        - id: WO-R-16
          title: Seeds (D-7)
          text: >-
            Base seed 20260920. A stream is random.Random(int.from_bytes(sha256(
            label).digest()[:8], 'big')) for a label string; labels are
            '20260920|indep|<trial>|<cell>|<lambda hex>|<route>' per I_indep call,
            '20260920|direct-roots|<cell>|<lambda hex>' for I_direct root listing,
            '20260920|C5|np=<n'>|d=<d>|field=<F2 or K>' for C5 sampling. The
            manifest's seeds block prints the rule and every C5 label; rows carry
            their rng_seed. No other randomness exists in r1/runner (AC-12).
        - id: WO-R-17
          title: trial-plan-r1.json
          text: Exactly as plan_requirements states.
        - id: WO-R-18
          title: Tests and acceptance tools (CI-5, CI-6)
          text: >-
            Under r1/runner/tests/ and as tools in r1/runner/: plan_check.py
            (AC-9, AC-13, AC-14, AC-15, AC-23), audit_indep.py (AC-6, AC-7, AC-8,
            AC-10, AC-12 static parts) and a synthetic driver entry (main.py
            --synthetic <cell>) that writes a complete run directory in scratch,
            including the runner-generated companions command.txt,
            environment.json, stdout.log and stderr.log that check_run expects,
            for the acceptance checks. Synthetic cells only; no RUN id minted; run
            under /usr/local/bin/python3 (CPython 3.11.15).
        - id: WO-R-19
          title: Implementation report
          text: >-
            implementation-report.yaml: read_attestation.paths_read (ordered), the
            file list, the mapping D-1 to D-8 and CI items to code, the outputs of
            every acceptance check run on synthetic cells, served model with
            fallback_used, and no run value of any declared cell.
    execution_context_file:
      path: experiments/EXP-QSP-70b731/execution-context-r1.yaml
      written_by: >-
        The execution batch (not BATCH-4708f7), committed before the first
        trial; immutable once committed; the payload refuses it unless its bytes
