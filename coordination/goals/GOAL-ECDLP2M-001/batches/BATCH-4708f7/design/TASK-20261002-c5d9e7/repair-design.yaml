  route_table:
    source: >-
      Every figure is produced by code_blocks.route_table_code, run by the
      session under D-C3 and relayed verbatim in session_computations.D-C3.
      The rows are keyed by cell name (CI-3); the route literal below is the
      table the I_indep code must carry, byte-for-byte in substance (AC-6).
    route_vocabulary:
      A-DENSE: >-
        Derivation (A) as the specification states it: build H(Y) =
        Y^(2^s) + lambda^(o(q+1))(Y) over F_2 (s = n' - r), take its K-roots
        (gcd with Y^(2^n) - Y, factor, per-orbit representatives), apply the
        closing test, emit N and the root list. Steps WO-I-4.
      S-BERL: >-
        The A1 substitute (amendment AMD-20261002-1303c4): N_K(L) = sum of deg f
        over the distinct irreducible factors f of the squarefree part of L whose
        degree divides n, found by Berlekamp's kernel method, with every root
        listed. No derivation (A) step. Steps WO-I-6.
      A-TWIST: >-
        Derivation (A) for a K-coefficient lambda (C5 K-arm at n' = 33 only):
        the same steps with the coefficient-twisted H of WO-I-5.
      HAND: Stage 0; no instrument runs (specification stages.stage_0).
      NONE-I_DIRECT-ONLY: >-
        C5 at n' = 11, which the specification runs by I_direct only
        ("n' = 11 (direct)"); I_indep is not called there.
    rule: >-
      For each (cell, d): compute q, r (n = q n' + r), s = n' - r, B =
      max(2^s, d^(q+1)) and the group size G (number of candidates of degree d
      in that cell). Derivation (A) is FEASIBLE iff (M) its memory floor 2B bits
      is at most the 8 GiB ceiling AND (T) G times the per-candidate time of the
      more favourable of models P and E is at most the horizon. Route =
      A-DENSE where feasible (both census routes, A-DENSE+S-BERL, on Stage-1
      cells and on C2, C3, C4); route = S-BERL on a Band-L (cell, d) where
      derivation (A) is not feasible; any other infeasible (cell, d) prints
      INFEASIBLE and would trigger K-new-record (none does). C5 K-arm at n' =
      33 uses A-TWIST under model K and the same horizon.
    cost_models:
      memory_floor: >-
        Any dense derivation-(A) route must hold H (B + 1 bits) and the
        current residue (fewer than B bits) at once, and the final gcd needs two
        operands of that size; floor 2B bits against 8 GiB = 2^36 bits (the
        specification's budget.maximum_memory_gb, read as GiB, the reading
        most favourable to derivation (A)). Fails only for B above 2^35.
      model_P: >-
        Premise of the frozen record: no sub-quadratic GF(2)[X] engine
        (H-QSP-cd0c90 mechanism, citing DEC-20260917-793ae2 NA-6 item iii; the
        specification's I_direct text records the same impediment at degree
        2^33). Per candidate n schoolbook reductions modulo H and one Euclidean
        gcd, each at least B^2/128 word-XORs, at an optimistic 2^31 word-XORs
        per second: (n + 1) B^2 / 2^38 seconds.
      model_E: >-
        The most favourable engine this design can identify inside CI-5 and the
        ceiling: products by CPython integer multiplication of bit-spread
        operands (Karatsuba, digits^log2(3) digit operations at an optimistic
        1 ns each, spread width bit_length(B + 1)), Barrett reduction at two
        products per squaring, n squarings, quadratic gcd as in P. Inapplicable
        (inf) when the spread operands exceed the ceiling (B above about 2^29).
      model_K: >-
        A-TWIST only: (n + 1) B^2 multiplications in K at 2 microseconds each
        (schoolbook K[Y] reductions and gcd).
      model_S: >-
        S-BERL: Gaussian elimination on an m x m F_2 matrix, m = 2^n': m^3/128
        word-XORs at 2^31 per second plus m^2/2 row operations at 0.2
        microseconds each; memory m^2 bits.
      parameters_flagged: >-
        Every rate is optimistic (biased toward finding derivation (A)
        feasible): 2^31 word-XORs per second, 1 ns per Karatsuba digit operation,
        no constant factors for Euclid's degree drops, no cost for building
        lambda^(o(q+1)), for factoring the gcd or for the closing test. These
        are design parameters, not measurements; nothing was timed.
      horizon: >-
        30 days of single-worker time per (cell, d) group. A design parameter,
        not a budget cap (CLAUDE.md research budgets): about two orders of
        magnitude above the specification's most expensive declared cost class
        (budget.note, "hours-class"). The table does not depend on its exact
        value: D-C3's summary line reports the largest derivation-(A) census
        group and the smallest substituted group, and any horizon between the
        two gives the same table.
    feasibility_reading_disclosure: >-
      The card admits a substitute only where derivation (A) is shown
      infeasible "by a stated cost argument against the specification's 8 GB
      machine-protection ceiling". This design reads that as cost under the
      ceiling (one worker, 8 GB, the engines available within it), not as
      memory overflow alone. Under the memory floor alone only rows with B
      above 2^35 would be substituted; the rows between are memory-feasible but
      project (model E, optimistic) to months or years per group. The reading
      is disclosed, not hidden: alternative_reading states what the other one
      implies, and JD2 or the composer may rule on it.
    alternative_reading:
      memory_only: >-
        If infeasible meant memory overflow alone, derivation (A) would be
        assigned to every Band-L (cell, d) with B at most 2^35, including the
        988 rows (D-C3 summary, substituted_by_horizon_only) whose projected
        group times run from 121.98 days to about 1.4e8 days (D-C3 rows with
        memory_floor_ok true and dense_group_days above 30). Stage 2 trials holding those rows would
        not complete under any claim TTL; by the runner's semantics (a run
        directory is never reused) each would end as an incomplete attempt (F6,
        never evidence) and, because Band H depends on every Band-L trial
        (d5_ordering), Band H would never run. This design does not adopt that
        reading.
    faithful_route_search:
      note: >-
        Routes examined for computing derivation (A) at Band L without the
        dense degree-B construction, before any substitute was admitted. None
        was found; JD2 is invited to exhibit one, which would remove A1 on the
        cells it covers.
      items:
        - id: F-1
          route: H reduced modulo L, then gcd with L (the Lemma-4.1-style composition).
          finding: >-
            Rejected as not independent of I_direct and not a test of (A). From
            X^(2^n') = lambda(X) mod L and Frobenius additivity, X^(2^(k n')) =
            lambda^(ok)(X) mod L as polynomials, so with (q + 1) n' = n + s,
            H(X) = X^(2^s) + X^(2^(n+s)) = (X + X^(2^n))^(2^s) mod L. Hence
            gcd(H mod L, L) has the root set of gcd(X^(2^n) - X, L): it computes
            I_direct's quantity with I_direct's modulus and final gcd (the
            known-false object of PTM-D3 under another algorithm), and its
            completeness follows from that identity, not from derivation (A).
        - id: F-2
          route: Other members of the family H_k(Y) = Y^(2^(k n' mod n)) + lambda^(ok)(Y).
          finding: >-
            Rejected. For k at most q the term 2^(k n') dominates (k = 1 is L,
            I_direct's object); k = q + 1 is derivation (A); k above q + 1 only
            raises d^k. No member avoids both I_direct's object and degree
            d^(q+1).
        - id: F-3
          route: Keep lambda^(o(q+1)) in compositional (unexpanded) form.
          finding: >-
            Not found feasible. The K-roots of H need arithmetic modulo H or a
            gcd with Y^(2^n) - Y, both of which need H's coefficients; a
            compositional form supports point evaluation only, and root finding
            by evaluation over K is enumeration of 2^131 points.
        - id: F-4
          route: Apply H to x directly (every K-root x of L is itself a root of H).
          finding: Same polynomial H; same degree; no gain.
        - id: F-5
          route: Lemma 4.1's G(X) = lambda^(oq)(X^(2^r)) + X.
          finding: Degree d^q 2^r, larger than B at every Band-L cell.
        - id: F-6
          route: Out-of-core dense arithmetic (disk-backed operands).
          finding: >-
            Not pursued. The ceiling is an address-space limit (RLIMIT_AS); disk
            removes the memory floor but not model P or E time, and adds I/O.
        - id: F-7
          route: Sparse H for linearized lambda.
          finding: >-
            Real but narrow. When lambda is linearized, lambda^(o(q+1)) is
            linearized and H is sparse, so the squarings are cheap; this applies
            to C3 and C6 (route A-DENSE there) and to no census candidate, since
            the census excludes linearized lambda.
