  code_blocks:
    extraction_method: >-
      Pinned. yaml.safe_load of this file; the block named B is the string
      value at repair_design.code_blocks.B.source (a literal block scalar);
      it is written byte-for-byte as UTF-8 to <scratch>/B.py with no
      transformation; its reference sha256 is the sha256 of exactly those
      UTF-8 bytes. The D-C1 command in session_computations performs this.
    route_table_code:
      purpose: RD-2 route table (D-C3). Import-safe; cells selected by name.
      reference_sha256: e2c00fde2d9f9f29e847e172ba38ddd71cb114368daed108f1c1acff45d5d147
      source: |
        """Route table for the EXP-QSP-70b731 r1 repair design (TASK-20261002-c5d9e7).

        DESIGN FIGURE ONLY. Integer and floating-point arithmetic on the cells the
        frozen specification declares (selected by name), the degrees each uses, the
        specification's bound B = max(2^(n'-r), d^(q+1)) with n = q*n' + r, and the
        cost models this design defines. It computes no N, no root, no gcd with
        X^(2^n) - X, no H polynomial and no decision statistic on any cell.
        Importing this module executes nothing; run it through its __main__ entry.
        """
        import json
        import math

        FIELD_N = 131
        MEMORY_CEILING_BITS = 8 * (2 ** 30) * 8  # 8 GiB (budget.maximum_memory_gb) in bits
        WORD_BITS = 64
        WORD_RATE = 2 ** 31  # optimistic 64-bit word-XORs per second (model parameter)
        DIGIT_BITS = 30  # CPython int digit width
        DIGIT_OP_SECONDS = 1.0e-9  # optimistic seconds per Karatsuba digit operation
        K_MUL_SECONDS = 2.0e-6  # seconds per multiplication in F_(2^131) (model parameter)
        ROW_OP_SECONDS = 2.0e-7  # interpreter overhead per bit-row XOR (model parameter)
        HORIZON_SECONDS = 30 * 86400  # design horizon per (cell, d) group; not a budget cap


        def census_count(d):
            """Census candidates of exact degree d: 2^d less the four linearized degree-4 shapes."""
            return 2 ** d - (4 if d == 4 else 0)


        def toy_count(d):
            """Stage-1 candidates of exact degree d: every polynomial of F_2[X] of exact degree d."""
            return 2 ** d


        def declared_cells():
            """Every declared cell, by name: (name, n, n', {d: group size}, kind)."""
            toy = {d: toy_count(d) for d in range(2, 8)}
            census = {d: census_count(d) for d in range(3, 8)}
            cells = [
                ("stage0-hand-gate", 4, 3, {2: 1, 3: 1}, "hand"),
                ("stage1-toy-calibration/n11-np6", 11, 6, dict(toy), "calibration"),
                ("stage1-toy-calibration/n13-np7", 13, 7, dict(toy), "calibration"),
                ("stage1-toy-calibration/n7-np3", 7, 3, dict(toy), "calibration"),
                ("stage5-controls/C2", 7, 3, {2: 1}, "fixture"),
                ("stage5-controls/C3", 31, 15, {128: 1}, "fixture"),
                ("stage5-controls/C4", 12, 6, {1: 1}, "fixture"),
                ("stage5-controls/C5F-np11", FIELD_N, 11, {3: 100, 7: 100}, "direct_only"),
                ("stage5-controls/C5K-np11", FIELD_N, 11, {3: 100, 7: 100}, "direct_only"),
                ("stage5-controls/C5F-np33", FIELD_N, 33, {3: 100, 7: 100}, "control"),
                ("stage5-controls/C5K-np33", FIELD_N, 33, {3: 100, 7: 100}, "control_twisted"),
                ("stage5-controls/C6-np11", FIELD_N, 11, {4: 4}, "control"),
                ("stage5-controls/C6-np33", FIELD_N, 33, {4: 4}, "control"),
            ]
            for n_prime in range(3, 15):
                cells.append(("stage2-bandL-n%d" % n_prime, FIELD_N, n_prime, dict(census), "census_bandL"))
            cells.append(("stage3-bridge-n22", FIELD_N, 22, dict(census), "census_other"))
            for n_prime in (33, 44, 66):
                cells.append(("stage4-bandH-n%d" % n_prime, FIELD_N, n_prime, dict(census), "census_other"))
            return cells


        def bound(n, n_prime, d):
            """(q, r, s, B) with n = q*n' + r, s = n' - r, B = max(2^s, d^(q+1))."""
            q, r = divmod(n, n_prime)
            s = n_prime - r
            return q, r, s, max(2 ** s, d ** (q + 1))


        def gcd_seconds(degree):
            """Quadratic Euclidean gcd at this degree: degree^2 / 128 word-XORs at WORD_RATE."""
            return degree * degree / (2 * WORD_BITS) / WORD_RATE


        def dense_premise_seconds(n, B):
            """Model P (no sub-quadratic GF(2)[X] arithmetic): n schoolbook reductions and one gcd."""
            return (n + 1) * gcd_seconds(B)


        def dense_engine_seconds(n, B):
            """Model E: bit-spread CPython-int (Karatsuba) products, Barrett reduction at two
            products per squaring, n squarings, quadratic gcd; inf when the spread operands
            exceed the memory ceiling."""
            spread = (B + 1).bit_length()
            if 4 * B * spread > MEMORY_CEILING_BITS:
                return math.inf
            digits = math.ceil(B * spread / DIGIT_BITS)
            product = DIGIT_OP_SECONDS * digits ** math.log2(3)
            return 2 * n * product + gcd_seconds(B)


        def twisted_seconds(n, B):
            """Model K: K-coefficient H of degree B; schoolbook K[Y] reductions, n squarings, a gcd."""
            return (n + 1) * B * B * K_MUL_SECONDS


        def berlekamp_seconds(n_prime):
            """Model S: Berlekamp kernel of an m x m F_2 matrix, m = 2^n', by Gaussian elimination."""
            m = 2 ** n_prime
            return m ** 3 / (2 * WORD_BITS) / WORD_RATE + (m * m / 2) * ROW_OP_SECONDS


        def direct_seconds(n_prime):
            """Planning only: I_direct's quadratic gcd at degree 2^n' (squarings modulo sparse L omitted)."""
            return gcd_seconds(2 ** n_prime)


        def route_row(name, n, n_prime, d, group, kind):
            q, r, s, B = bound(n, n_prime, d)
            memory_floor_ok = 2 * B <= MEMORY_CEILING_BITS
            premise = dense_premise_seconds(n, B)
            engine = dense_engine_seconds(n, B)
            dense_group = group * min(premise, engine)
            dense_ok = memory_floor_ok and dense_group <= HORIZON_SECONDS
            berl_group = group * berlekamp_seconds(n_prime)
            berl_ok = (2 ** n_prime) ** 2 <= MEMORY_CEILING_BITS and berl_group <= HORIZON_SECONDS
            twisted_group = group * twisted_seconds(n, B)
            if kind == "hand":
                route, reason = "HAND", "stage 0 is a hand derivation; no instrument runs"
            elif kind == "direct_only":
                route, reason = "NONE-I_DIRECT-ONLY", "specification C5 runs this arm by I_direct only"
            elif kind == "control_twisted":
                ok = memory_floor_ok and twisted_group <= HORIZON_SECONDS
                route = "A-TWIST" if ok else "INFEASIBLE"
                reason = "K-coefficient lambda; twisted derivation (A) under model K"
            elif kind in ("calibration", "fixture"):
                route = "A-DENSE+S-BERL" if dense_ok and berl_ok else "INFEASIBLE"
                reason = "calibration or fixture: every census route runs"
            elif dense_ok:
                route, reason = "A-DENSE", "derivation (A) within the memory floor and the horizon"
            elif kind == "census_bandL" and berl_ok:
                route = "S-BERL"
                if not memory_floor_ok:
                    reason = "derivation (A) memory floor exceeds the ceiling; A1 substitute"
                else:
                    reason = "derivation (A) group time exceeds the horizon under models P and E; A1 substitute"
            else:
                route, reason = "INFEASIBLE", "no admissible route (K-new-record trigger)"
            row = {
                "cell": name, "kind": kind, "n": n, "n_prime": n_prime, "q": q, "r": r, "s": s,
                "d": d, "group": group, "B": B, "log2_B": math.log2(B),
                "B_le_2^20": B <= 2 ** 20, "B_le_2^24": B <= 2 ** 24, "B_le_2^28": B <= 2 ** 28,
                "memory_floor_ok": memory_floor_ok,
                "dense_P_s_per_cand": premise, "dense_E_s_per_cand": engine,
                "dense_group_days": dense_group / 86400.0,
                "berlekamp_group_s": berl_group,
                "route": route, "reason": reason,
            }
            if kind == "control_twisted":
                row["twisted_group_s"] = twisted_group
            return row


        def group_seconds(row):
            route = row["route"]
            if route == "A-DENSE":
                return row["dense_group_days"] * 86400.0
            if route == "S-BERL":
                return row["berlekamp_group_s"]
            if route == "A-DENSE+S-BERL":
                return row["dense_group_days"] * 86400.0 + row["berlekamp_group_s"]
            if route == "A-TWIST":
                return row["twisted_group_s"]
            return 0.0


        def summarize(rows):
            band_l = [row for row in rows if row["kind"] == "census_bandL"]
            census = [row for row in rows if row["kind"] in ("census_bandL", "census_other")]
            by_route = {}
            for row in band_l:
                by_route[row["route"]] = by_route.get(row["route"], 0) + row["group"]
            dense_census = [row for row in census if row["route"] == "A-DENSE"]
            substituted = [row for row in band_l if row["route"] == "S-BERL"]
            return {
                "summary": "route-table",
                "band_l_rows_total": sum(row["group"] for row in band_l),
                "band_l_rows_by_route": by_route,
                "n131_census_rows_on_derivation_A": sum(row["group"] for row in dense_census),
                "band_l_groups_on_derivation_A": ["%s/d%d" % (row["cell"], row["d"]) for row in band_l if row["route"] == "A-DENSE"],
                "largest_dense_group_days_among_A_DENSE_census": max(row["dense_group_days"] for row in dense_census),
                "smallest_dense_group_days_among_S_BERL": min(row["dense_group_days"] for row in substituted),
                "largest_berlekamp_group_s_among_S_BERL": max(row["berlekamp_group_s"] for row in substituted),
                "substituted_by_memory_floor": sum(row["group"] for row in substituted if not row["memory_floor_ok"]),
                "substituted_by_horizon_only": sum(row["group"] for row in substituted if row["memory_floor_ok"]),
                "memory_only_reading_A_rows_with_dense_group_days_over_30": sum(row["group"] for row in band_l if row["memory_floor_ok"] and row["dense_group_days"] > 30),
                "infeasible": ["%s/d%d" % (row["cell"], row["d"]) for row in rows if row["route"] == "INFEASIBLE"],
                "horizon_days": HORIZON_SECONDS / 86400.0,
            }


        def trial_projection(rows):
            totals = {}
            for row in rows:
                trial = row["cell"].split("/")[0]
                seconds = group_seconds(row)
                if row["kind"] in ("census_bandL", "calibration", "fixture") or row["cell"] == "stage3-bridge-n22" or row["cell"].endswith("np11"):
                    seconds += row["group"] * direct_seconds(row["n_prime"])
                totals[trial] = totals.get(trial, 0.0) + seconds
            return {"summary": "trial-projection-days (model figure, optimistic, planning only)",
                    "per_trial_days": {trial: value / 86400.0 for trial, value in totals.items()}}


        def clean(value):
            if isinstance(value, float):
                return "inf" if math.isinf(value) else float("%.6g" % value)
            if isinstance(value, dict):
                return {key: clean(item) for key, item in value.items()}
            if isinstance(value, list):
                return [clean(item) for item in value]
            return value


        def main():
            rows = []
            for name, n, n_prime, degrees, kind in declared_cells():
                for d in sorted(degrees):
                    rows.append(route_row(name, n, n_prime, d, degrees[d], kind))
            for row in rows:
                print(json.dumps(clean(row), sort_keys=True))
            print(json.dumps(clean(summarize(rows)), sort_keys=True))
            print(json.dumps(clean(trial_projection(rows)), sort_keys=True))


        if __name__ == "__main__":
            main()
    candidate_count_code:
      purpose: Candidate counts under the frozen rule (D-C4). Import-safe; no field arithmetic.
      reference_sha256: 1c78b9ac12b21cc484fc3c16b8d77aa91b31dfd867493ba888160ceae07f5ab6
      source: |
        """Candidate counts for the EXP-QSP-70b731 r1 repair design (TASK-20261002-c5d9e7).

        DESIGN FIGURE ONLY. Counts polynomials of F_2[X] (bit-packed: bit i is the
        coefficient of X^i) by exact degree under the frozen specification's candidate
        rule, selected by rule name. No field arithmetic on any cell. Importing this
        module executes nothing; run it through its __main__ entry.
        """
        import json


        def is_linearized(p):
            """True iff p is a sum of monomials X^(2^i), i >= 0, with no constant term."""
            i = 0
            while p:
                if p & 1 and (i == 0 or i & (i - 1)):
                    return False
                p >>= 1
                i += 1
            return True


        def is_affine_linearized(p):
            """True iff p is a linearized polynomial plus the constant 1."""
            return bool(p & 1) and p != 1 and is_linearized(p ^ 1)


        def is_square(p):
            """True iff every monomial of p has an even exponent (p = mu^2 over F_2)."""
            i = 0
            while p:
                if p & 1 and i & 1:
                    return False
                p >>= 1
                i += 1
            return True


        def per_degree(d):
            polys = list(range(1 << d, 1 << (d + 1)))
            linearized = [p for p in polys if is_linearized(p)]
            return {
                "d": d,
                "all": len(polys),
                "linearized": len(linearized),
                "linearized_hex": [format(p, "x") for p in linearized],
