  procedure_deviations:
    - id: PD-1
      severity: material
      tripwire: TQ-3 (self-report)
      what: >-
        While checking whether derivation (A)'s H can vanish when d is a power
        of two, this producer evaluated by mental arithmetic, with no tool and
        no record, the composite lambda o lambda and hence the H polynomial for
        one Stage-0 lambda (X^2+X+1 at (4, 3)), and noted by inspection the H
        polynomial of the C4 fixture (lambda = X at (12, 6)), whose triviality
        follows from r = 0 as the specification says. TQ-3 names computing an
        H polynomial on a declared cell. No value from either appears in this
        design, in the amendment or in any message; no N, root or gcd was
        evaluated on any declared cell; the Stage-0 hand note is not seeded
        (its author is a different session, stage0_mechanism.who_and_when). The
        design states only the bound-formula fact that at (4, 3) d = 2 gives
        d^(q+1) = 2^(n'-r). Reported so the composer can apply TQ-3's stated
        effect or rule it immaterial; this producer does not rule on its own
        report.
    - id: PD-2
      severity: disclosed
      what: >-
        The card's substitute criterion ("a stated cost argument against the
        specification's 8 GB machine-protection ceiling") is read as cost under
        the ceiling, time included (route_table.feasibility_reading_disclosure).
    - id: PD-3
      severity: disclosed
      what: >-
        The design writes routes per (cell, d) rather than per cell; the key is
        still the cell's name (the degree is a property of lambda, looked up,
        not a threshold). A1 states the same granularity.
    - id: PD-4
      severity: disclosed
      what: >-
        The card asks that trial-plan-r1.json load in the read-only status view
        (TASK-20261002-b72830 completion gate, as the queue relays it) and that
        approved_by be null (RD-8). tools/experiment_execution.py load_plan
        refuses a null approved_by, so both cannot hold for the file as frozen;
        AC-23 loads it with approved_by replaced in memory only.
    - id: PD-5
      severity: disclosed
      what: >-
        The runtime forced an interim hand-back before the round-1 session
        computations were relayed; that hand-back reported the card incomplete.
        The session then ran D-C1 to D-C6 and resumed this producer, which
        embedded the outputs, filled both reference hashes and reconciled the
        hand tallies (no difference). Nothing in the design changed in
        substance between the two hand-backs except the embedded figures and the
        wording that cites them.
  limitations:
    - >-
      This producer holds no shell; every computation is the session's (D-C1 to
      D-C6) and every cost figure is a model with stated optimistic parameters,
      not a measurement. Nothing was timed.
    - >-
      The feasibility line between derivation (A) and S-BERL rests on those
      models. It lies in a gap between the largest derivation-(A) group and the
      smallest substituted group (D-C3 summary), but a faster engine than model
      E inside CI-5 would move the narrowest substitutions (route_table.exposure).
    - >-
      After A1, derivation (A) is cross-checked by C1 at n = 131 on 372 rows,
      none with the Band-H composition depths (d4_calibration.residual_exposure).
    - >-
      A-TWIST's derivation is this design's own (IDEA-20260916-5c9d6e, which the
      proposal cites for the twisted H, is outside this card's read scope).
    - >-
      AC-7's independence audit is static and trace-based; it cannot exclude
      every disguised computation, and JR2's reading of the code is the backstop.
    - >-
      One model family serves every role by runtime inheritance; session
      independence is real, model independence is not claimed.
