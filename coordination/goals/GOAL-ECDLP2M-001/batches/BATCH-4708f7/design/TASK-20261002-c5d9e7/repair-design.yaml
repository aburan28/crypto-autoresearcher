      runtime_lock: null
      scope_note: >-
        States the trial order of d5_ordering, that A1 of AMD-20261002-1303c4
        governs the I_indep routes, that TW-C1 is carried (any evidence review
        of these runs that could contradict EV-QSP-a6aa4b is
