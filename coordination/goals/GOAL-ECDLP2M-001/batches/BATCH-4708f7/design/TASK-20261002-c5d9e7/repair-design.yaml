      approved_by stays null and task_id is TASK-20261002-b72830, as the card
      requires. tools/experiment_execution.py load_plan refuses a plan whose
      approved_by is not a non-empty string and authorize binds the plan to an
      admitted executor run card, so trial-plan-r1.json can be neither executed
