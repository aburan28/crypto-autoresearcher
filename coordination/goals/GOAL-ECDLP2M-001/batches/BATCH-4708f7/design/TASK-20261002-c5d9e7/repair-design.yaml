  plan_requirements:
    path: experiments/EXP-QSP-70b731/trial-plan-r1.json
    written_by: TASK-20261002-b72830
    top_level:
      schema: crypto.autoresearch.trial_plan.v1
      frozen: true
      experiment_id: EXP-QSP-70b731
      task_id: TASK-20261002-b72830
      approved_by: null
      queue: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/dispatch_queue.json
      specification: experiments/EXP-QSP-70b731/specification.yaml
      specification_sha256: the value D-C5 reports for the specification (equal to the archived validator report's 2000b1c4...)
      amendment: experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml
