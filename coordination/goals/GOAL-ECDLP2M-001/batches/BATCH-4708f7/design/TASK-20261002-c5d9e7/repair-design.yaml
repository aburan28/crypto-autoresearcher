        fails_when: a census route missing from Stage 1, two A-DENSE callables, or a parameter branch.
        mutation: Map one Band-H cell to a copied function in a scratch routes.py; the identity check fails.
        ptm_d1: >-
          Fails. The bound Stage 1 ran path A-toy (enumeration) on all 756 rows,
          exercising neither A-L nor A-H (F-04).
      - id: AC-9
        discharges: D-5
        owners: JD2 (design reading) / JR1 (plan)
        procedure: >-
          plan_check.py verifies the depends_on graph of d5_ordering.placement
          exactly, the topological order of the trials array, and that check.py
