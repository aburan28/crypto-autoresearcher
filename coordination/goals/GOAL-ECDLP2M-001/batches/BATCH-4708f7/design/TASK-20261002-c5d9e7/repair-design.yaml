  acceptance_checks:
    common: >-
      Every check runs on synthetic cells (synthetic_cells), on copies of r1
      files in the reviewer's scratch, or statically; none runs an instrument
      on a declared cell, mints a RUN id or executes trial-plan-r1.json. Each
      names a mutation under which it must fail; a check that cannot be made
      to fail breaks its joint. Owners follow the review plans' discharge maps
      (JD1 or JD2 in round 1 for the design; JR1 or JR2 in round 2 for the
      code).
    items:
      - id: AC-1
        discharges: D-1
        owners: JD1 / JR1
        procedure: >-
          Run main.py --synthetic syn-a-15-04 into a scratch run directory
          (WO-R-18 writes the runner companions); call
          tools/validate_ledger.py check_run on its manifest.yaml with a fresh
          context; then check that the run body carries every field of WO-R-2
          (inference block, code.dirty, environment.dependencies,
          result.validity_reason, inputs.seeds, timing).
        fails_when: any check_run error line or any WO-R-2 field missing or null without a stated reason.
        mutation: >-
          PTM-R3: replace manifest.yaml by a flat mapping without run; check_run
          must report "expected top-level key 'run'" and check.py must exit 8.
        ptm_d1: >-
          Fails. The bound driver.py (lines 436-456) writes a flat manifest;
          check_run reports the missing run key (F-01).
      - id: AC-2
        discharges: D-8 (and D-1 for nonterminal records)
        owners: JD1 / JR1
        procedure: >-
          Start main.py --synthetic syn-a-17-04 and SIGKILL it after the first
          row is in rows.jsonl; then run check_run on the manifest left behind;
          separately force an exception before the first row and check the
          failed-status manifest.
        fails_when: >-
          No manifest.yaml exists after the kill, its status is not running with
          raw_result_pending true and certificate kind none, check_run reports an
          error, or the forced-exception manifest lacks status failed and a
          validity_reason.
        mutation: >-
          Disable the provisional write (scratch copy); the kill then leaves no
          manifest and the check fails.
        ptm_d1: >-
          Fails. The bound driver writes manifest.yaml only at the end (or a
          flat error stub), so a killed attempt leaves none (F-13).
      - id: AC-3
        discharges: D-2
        owners: JD1 / JR1
        procedure: >-
          On a synthetic run with N > 0 rows: each such row has its cert file,
          the index lists every file with its sha256, check.py re-verifies every
          root with kfield.py, and certificate_bearing equals the number of
          verified files with N > 0 recomputed from disk; the M5 identity
          holds and was evaluated before the headline was written.
        fails_when: any N > 0 row without a verified file, any count not recomputed from disk, or a headline present while the identity fails.
        mutation: >-
          PTM-R1: delete one certificate file (check.py exit 3, F_acct); alter one
          root in a file (exit 3); raise the reported certificate_bearing by one
          in raw-result.json (exit 3).
        ptm_d1: >-
          Fails. driver.py line 116 sets cert = None: no file exists while the
          reported certificate_bearing counts N > 0 rows (F-02).
      - id: AC-4
        discharges: D-3 (accounting half; checker)
        owners: JD1 / JR1
        procedure: >-
          PTM-R2: feed check.py a synthetic run whose one row has
          root_count_listed below I_indep_N; feed the payload a route stub (in
          scratch) returning such a row. Grep check.py's AST for any branch
          that returns 0 after a failed condition.
        fails_when: the row is counted certificate-bearing, the checker exits 0, or a fallback branch exists.
        mutation: The PTM-R2 row itself; the check passes only if check.py exits 3 and the payload raises.
        ptm_d1: >-
          Fails. check.py lines 59-60 pass such rows through a fallback and the
          driver counts them (F-03).
      - id: AC-5
        discharges: D-3 (I_indep half), CI-4
        owners: JD2 / JR2
        procedure: >-
          PTM-R4: in a scratch copy, make roots.py's search fail for one factor;
          call count_roots on a synthetic A-DENSE row and a synthetic S-BERL row;
          then run the runner on that row. AST scan of r1/indep for except
          clauses that pass, continue or return a number.
        fails_when: a count is returned, a factor is skipped, or the runner records anything but instrument_error.
        mutation: The forced failure itself.
        ptm_d1: >-
          Fails. i_indep.py lines 83-84 skip a factor whose root search returns
          None (F-11, F-03).
      - id: AC-6
        discharges: D-4, CI-3
        owners: JD2 / JR2
        procedure: >-
          Load routes.py's literal (static, without computing) and compare it
          key by key with route_table.route_map and synthetic_cells; call
          routes_for for every declared (cell, d) (a lookup; no count is
          computed on a declared cell); AST-scan routes.py and api.py's dispatch
          for comparison operators or arithmetic on n, n', q, r, s, d, B or deg L.
        fails_when: any key, route or modulus differs, any comparison or size arithmetic selects a route, or an unknown cell does not raise.
        mutation: Insert into a scratch copy a route choice "if B > 2**24" on one cell; the AST scan must fail it.
        ptm_d1: >-
          Fails. The bound measure_indep selects paths A-toy, A-L, A-H by a
          formula on the cell (i_indep.py lines 307-322; F-04 notes the recorded
          paths match the formula).
      - id: AC-7
        discharges: D-4, CI-1, PTM-D3, PTM-R5
        owners: JD2 / JR2
        procedure: >-
          Static (audit_indep.py): r1/indep imports only the allowed standard
          library modules and r1.indep modules; no bound-module name, importlib
          or sys.path edit; bitwise operators only in gf2x.py and fieldk.py.
          Trace: with tracing on, run every route on two synthetic cells and
          inspect the primitive trace; no route squares a residue modulo the
          cell's L or rad(L) (a chain of two or more such squarings fails), and
          S-BERL computes no gcd with X^(2^n) - X.
        fails_when: any import, operator or trace event outside the rules.
        mutation: >-
          PTM-D3 and PTM-R5: add to a scratch copy, under a new function name on
          a synthetic Band-L-like cell, a computation of deg gcd(X^(2^n) - X, L)
          by repeated squaring; written with gf2x primitives the trace shows
          the squaring chain modulo L; written with private bit operations the
          static rule fails it.
        ptm_d1: >-
          Fails. The bound i_indep.py imports gf2_poly, shared with i_direct,
          and its path A-L is I_direct's deg-gcd algorithm (F-04).
        limit: >-
          A static and trace audit cannot prove the absence of every disguised
          computation; JR2 also reads the code (its attack (iii)).
      - id: AC-8
        discharges: D-4 (calibration)
        owners: JD2 / JR2
        procedure: >-
          From the plan and routes.py: every route a census cell uses appears on
          every Stage-1 cell and on C2, C3 and C4; every A-DENSE key maps to the
