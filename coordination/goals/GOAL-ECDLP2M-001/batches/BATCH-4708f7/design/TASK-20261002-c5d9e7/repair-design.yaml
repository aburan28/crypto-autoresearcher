        fails_when: any census trial does not depend on stage5-controls, Band H does not depend on every stage2 trial and the bridge, or a stop condition exits 0.
        mutation: Remove stage5-controls from one stage2 trial's depends_on in a scratch copy; plan_check must fail.
        ptm_d1: >-
          Fails. All six bound plans order stage5-controls after
          stage-compare-sealed (F-05).
      - id: AC-10
        discharges: D-6
        owners: JD1 / JR1
        procedure: >-
          audit_indep.py computes stage0.py's transitive import graph within r1
          and compares it with stage0_mechanism.no_census_code; run stage0.py
          with --allow-test-fixture on a test-only note at a synthetic cell and
          check that it performs the bookkeeping checks and the blind_from
          existence checks and no field arithmetic (no kfield, r1/indep or
          census module in sys.modules at exit).
        fails_when: any census module reachable or loaded, any bookkeeping check absent, or the verdict ignored.
        mutation: >-
          PTM-R6: insert "import r1.runner.census" into a scratch copy of
          stage0.py; both the static graph and the runtime guard must fail it
          (exit 9).
        ptm_d1: >-
          Fails. The bound driver's stage0 calls i_direct.count_direct and
          i_indep.measure_indep at (4, 3) (lines 173-174; F-06).
      - id: AC-11
        discharges: D-6 (M9), CC-4
        owners: JD1 / JR1
        procedure: >-
          Run readset.py with (a) clean declarations, (b) one declaration
          listing experiments/EXP-QSP-33b442/runs/ (a blind_from entry, as a
          string; nothing is opened), (c) an empty declaration, (d) a missing
          file.
        fails_when: (b), (c) or (d) yields blind_from_respected true, or (a) yields false.
        mutation: The cases (b) to (d) are the mutations.
        ptm_d1: >-
          Fails. blind_from_respected is the constant True (driver.py line 451)
          and the read set is STATIC_READ_DECLARATION (line 44; F-06).
      - id: AC-12
        discharges: D-7
        owners: JD1 / JR1
        procedure: >-
          AST scan of r1 for random.Random(...) constructions and module-level
          random calls; every construction must take a value derived from the
          WO-R-16 labels or count_roots's rng_seed; the manifest's seeds block
          lists the rule and every C5 label.
        fails_when: a literal-seeded or time-seeded generator, a module-level random call, or an undeclared stream.
        mutation: Add random.Random(12345) in a scratch copy; the scan fails it.
        ptm_d1: >-
          Fails. i_indep.py line 102 and gf2_poly.py line 294 seed from literal
          constants (F-10).
      - id: AC-13
        discharges: CC-1
        owners: JD1 / JR1
        procedure: >-
          plan_check.py: the twenty run ids equal the twenty the session recorded
          in tasks_state_revisions, each matches RUN-QSP-[0-9a-f]{6}, they are
          pairwise distinct, and none is in the union of D-C6's run ids of the
          six earlier plans or the sixteen bound directory names (archived
          validator report, run_ids).
        fails_when: any id reused, malformed or not session-minted.
        mutation: Replace one id by RUN-QSP-cec70a in a scratch copy.
      - id: AC-14
        discharges: CC-2
        owners: JD1 / JR1
        procedure: >-
          plan_check.py: the trial ids are exactly the twenty of trial-plan.json
