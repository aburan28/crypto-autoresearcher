      supersession_reason: >-
        Names DEC-20261002-5e691c R-CONTINUATION (no trial of any plan binding
        the eight-file closure may be launched under an approval issued before
        it) and DEC-20261002-a63f13 C-EQ (all six earlier plans bind that
        closure), and DEC-20261002-e0aa2b K-INVALID with defect_return D-1 to
