        fails_when: a hit, an empty list, or no list.
        mutation: The AC-11 cases applied to the reports.
      - id: AC-17
        discharges: CI-2
        owners: JD1 / JR1
        procedure: >-
          Every new file lies under implementation/r1/ or is trial-plan-r1.json or
