  step_4_jd3_comparison:
    rule: >-
      CD-4, first among the joints. Tolerance (plan blind_rederivation):
      Q1 exact; Q2 B exact as an integer, log2 B within 0.01, the three flags
      exact; Q3 exact. Disagreement beyond tolerance would apply K-indeterminate.
    design_source: >-
      repair-design route_table.route_map and counts; session_computations D-C3
      (route_table_code rows) and D-C4 (candidate_count_code), read at the
      snapshot bytes.
    jd3_source: rederivation-report.yaml Q0 to Q3 (TASK-20261002-c81b2e)
    cell_map: >-
      S0 = stage0-hand-gate; S1a, S1b, S1c = stage1-toy-calibration/n11-np6,
      n13-np7, n7-np3; F2, F3, F4 = stage5-controls/C2, C3, C4; L3 to L14 =
      stage2-bandL-n3 to n14; L22 = stage3-bridge-n22; L33, L44, L66 =
      stage4-bandH-n33, n44, n66.
    rows:
      - {jd3_cell: S0, design_cell: stage0-hand-gate, q_r: '1, 1 both', B_per_d: 'd2 4, d3 9 both', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: S1a, design_cell: stage1-toy-calibration/n11-np6, q_r: '1, 5 both', B_per_d: 'd2..d7 4, 9, 16, 25, 36, 49 both', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: S1b, design_cell: stage1-toy-calibration/n13-np7, q_r: '1, 6 both', B_per_d: 'd2..d7 4, 9, 16, 25, 36, 49 both', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: S1c, design_cell: stage1-toy-calibration/n7-np3, q_r: '2, 1 both', B_per_d: 'd2..d7 8, 27, 64, 125, 216, 343 both', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: F2, design_cell: stage5-controls/C2, q_r: '2, 1 both', B_per_d: 'd2 8 both', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: F3, design_cell: stage5-controls/C3, q_r: '2, 1 both', B_per_d: 'd128 2097152 (128^3) both', flags: 'false, true, true both', log2: '21.0 both', result: agree}
      - {jd3_cell: F4, design_cell: stage5-controls/C4, q_r: '2, 0 both', B_per_d: 'd1 64 (2^6, two-term) both', flags: equal, log2: '6.0 both', result: agree}
      - {jd3_cell: L3, design_cell: stage2-bandL-n3, q_r: '43, 2 both', B_per_d: 'd3..d7 3^44, 4^44, 5^44, 6^44, 7^44, the five integers identical digit for digit', flags: 'all false both', log2: 'design 69.7384, 88.0, 102.165, 113.738, 123.524; JD3 69.74, 88.00, 102.16, 113.74, 123.52', result: agree}
      - {jd3_cell: L4, design_cell: stage2-bandL-n4, q_r: '32, 3 both', B_per_d: 'd3..d7 3^33 to 7^33 identical', flags: 'all false both', log2: within 0.01, result: agree}
      - {jd3_cell: L5, design_cell: stage2-bandL-n5, q_r: '26, 1 both', B_per_d: 'd3..d7 3^27 to 7^27 identical', flags: 'all false both', log2: within 0.01, result: agree}
      - {jd3_cell: L6, design_cell: stage2-bandL-n6, q_r: '21, 5 both', B_per_d: 'd3..d7 3^22 to 7^22 identical', flags: 'all false both', log2: within 0.01, result: agree}
      - {jd3_cell: L7, design_cell: stage2-bandL-n7, q_r: '18, 5 both', B_per_d: 'd3..d7 3^19 to 7^19 identical', flags: 'all false both', log2: within 0.01, result: agree}
      - {jd3_cell: L8, design_cell: stage2-bandL-n8, q_r: '16, 3 both', B_per_d: 'd3..d7 3^17 to 7^17 identical', flags: 'd3 (false, false, true), others all false, both', log2: 'within 0.01 (d7 design 47.725, JD3 47.73)', result: agree}
      - {jd3_cell: L9, design_cell: stage2-bandL-n9, q_r: '14, 5 both', B_per_d: 'd3..d7 3^15 to 7^15 identical', flags: 'd3 (false, true, true), others all false, both', log2: within 0.01, result: agree}
      - {jd3_cell: L10, design_cell: stage2-bandL-n10, q_r: '13, 1 both', B_per_d: 'd3..d7 3^14 to 7^14 identical', flags: 'd3 (false, true, true); d4 B = 2^28 (false, false, true); others all false; both', log2: within 0.01, result: agree}
      - {jd3_cell: L11, design_cell: stage2-bandL-n11, q_r: '11, 10 both', B_per_d: 'd3..d7 3^12 to 7^12 identical', flags: 'd3 all true; d4 B = 2^24 (false, true, true); d5 (false, false, true); d6, d7 all false; both', log2: within 0.01, result: agree}
      - {jd3_cell: L12, design_cell: stage2-bandL-n12, q_r: '10, 11 both', B_per_d: 'd3..d7 3^11 to 7^11 identical', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: L13, design_cell: stage2-bandL-n13, q_r: '10, 1 both', B_per_d: 'd3..d7 3^11 to 7^11 identical', flags: equal, log2: within 0.01, result: agree}
      - {jd3_cell: L14, design_cell: stage2-bandL-n14, q_r: '9, 5 both', B_per_d: 'd3..d7 3^10 to 7^10 identical', flags: 'd3 all true; d4 B = 2^20 all true; d5 (false, true, true); d6 (false, false, true); d7 all false; both', log2: within 0.01, result: agree}
      - {jd3_cell: L22, design_cell: stage3-bridge-n22, q_r: '5, 21 both', B_per_d: 'd3..d7 729, 4096, 15625, 46656, 117649 both', flags: 'all true both', log2: within 0.01, result: agree}
      - {jd3_cell: L33, design_cell: stage4-bandH-n33, q_r: '3, 32 both', B_per_d: 'd3..d7 81, 256, 625, 1296, 2401 both', flags: 'all true both', log2: within 0.01, result: agree}
      - {jd3_cell: L44, design_cell: stage4-bandH-n44, q_r: '2, 43 both', B_per_d: 'd3..d7 27, 64, 125, 216, 343 both', flags: 'all true both', log2: within 0.01, result: agree}
      - {jd3_cell: L66, design_cell: stage4-bandH-n66, q_r: '1, 65 both', B_per_d: 'd3..d7 9, 16, 25, 36, 49 both', flags: 'all true both', log2: within 0.01, result: agree}
    flags_note: >-
      Every flag is a function of the integer B, and B agrees digit for digit
      on all 103 JD3 rows. The three rows where B equals a threshold (L10 d4 =
      2^28, L11 d4 = 2^24, L14 d4 = 2^20; JD3 R4) were checked individually;
      the design prints true on each, as JD3 does under the card's non-strict
      reading.
    log2_note: >-
      The design prints log2 B to five or six significant figures, JD3 to two
      decimals rounded to nearest. The largest gap seen is 0.005 (L3 d5,
      L8 d7), inside 0.01.
    q3_counts:
      - quantity: candidates per degree, census rule (d = 3 to 7)
        design: 8, 12, 32, 64, 128 (D-C4 non_linearized and route_table group)
        jd3: 8, 16 - 4, 32, 64, 128 (a minus b)
        result: agree
      - quantity: linearized polynomials excluded per census cell
        design: 4 (degree 4; hex 10, 12, 14, 16)
        jd3: 4 (degree 4 only; b_d4 = 4)
        result: agree
      - quantity: census candidates per cell
        design: 244
        jd3: 244
        result: agree
      - quantity: Stage-1 candidates per cell (d = 2 to 7)
        design: 252 (756 rows over three cells)
        jd3: 252
        result: agree
    rows_outside_jd3: >-
      The design's C5 and C6 rows at n = 131 (n' = 11 and 33) are not JD3
      quantities. Their (n, n', d) triples coincide with L11 and L33 rows, and
      the design's B values for them equal JD3's for those triples. This is a
      comparison by identity, recorded for completeness; it is not part of the
      tolerance test.
    q0: >-
      JD3 found no undetermined definitional choice affecting Q1, B, a flag or
      Q3; the only undetermined choice (Q0-1) is the two-decimal rounding of
      log2 B, which the tolerance absorbs. The design's readings (i >= 0, no
      constant term, non-strict flags) are the card readings JD3 adopted.
    result: >-
      JD3 AGREES with the design on every quantity within tolerance.
      K-indeterminate does not apply. Agreement is evidence that the route
      quantities and candidate counts are determined by their definitions and
      that the design's implementation computes them; it says nothing about
      the feasibility judgement drawn from them (PD-D5; that judgement is
      JD2's and has no blind card).

  step_5_joint_table:
    - joint: JD1
      owner: TASK-20261002-3b6a02 (validator; VAL-20261002-3b6a02)
      reported_verdict: breaks
      breaking_artifacts:
        - >-
          BA-1 (D-1, D-8). WO-R-3 and WO-R-5 write a terminal failed record
          without raw-result.json; check_run rejects it; AC-2's exception
          branch and AC-15 run no check_run, so no check catches it.
          Constructed input A8.
        - >-
          BA-2 (D-2, accounting half of D-3). Certificate files are named per
          (cell, lambda) while C5 draws lambda with replacement; a repeated
          lambda with N > 0 yields one file for several positive rows, so the
          design's own M5 identity fails on stage5-controls by bookkeeping, or
          the census is blocked. No acceptance check exercises the case
          (constructed input B7). K-coefficient file naming is undefined.
        - >-
          BA-3 (D-6 via M9; CC-4 via AC-16). WO-R-11 matches declared read paths
          by exact string or prefix, with no canonical format; ordinary path
          forms (annotated, absolute, dot, parent, missing slash, parent
          directory) of a blind_from entry return blind_from_respected true,
          and AC-11 samples none of them (cases f to k).
      what_holds: >-
        Every JD1 item has a verified clause, work orders and a check that can
        fail; manifest target check_run-clean on completed and killed records;
        no census-code path in Stage 0; M9 not a literal constant; run-id rule
        admits no reuse; every relayed D-C output reproduces; PTM-D1 met.
      surviving_objections: SO-1 to SO-7 (moderate or minor); SO-8 checked, holds
      ptm: PTM-D1 performed; signature met (F-01 by AC-1, F-02 by AC-3 and AC-24, F-04 by AC-6 to AC-8, F-06 by AC-10 and AC-11)
      composed_disposition: >-
        BREAKS. Each break carries a constructed input that fails the joint's
        own clause as the plan states it, and the composer finds nothing in
        JD2 or JD3 that answers it (JD2 holds CC-4's work-order binding but
        did not examine string forms; JD1's R-2 pointer that AC-16 inherits
        BA-3 is adopted by the composer, so CC-4's check is also affected).
        Every break is a local, zero-run textual repair; none needs an
        amendment (JD1's statement, not contradicted by JD2).
    - joint: JD2
      owner: TASK-20261002-323713 (red team; RT-20261002-f6c6f4)
      order_attestation_read_first: >-
        CD-5. Own route table (v0) written 12:43:13Z, sha256 6a983c93...;
        design and amendment first opened after 12:43:20Z (amendment first);
        before v0 both were only hashed. Read before v0: card, red-team role
        file, AGENTS.md, the plan (with PTM-D2 parameters and the R-ROUTE-PRIOR
        summary, disclosed), the receipt, the specification, H-QSP-cd0c90 and
        IDEA-20260916-3f7a1c. v0 independently found the same 128-row
        derivation-(A) set, placed (12, 5), (13, 5), (14, 6) in a separate
        memory-feasible tier, and found and rejected the same collapsing route
        S as the design's F-1. The breaks came from measurements after v0,
        read against the design's own criterion. Order respected.
      reported_verdict: breaks
      breaking_artifacts:
        - >-
          O-1 (attack ii). S-BERL is assigned on (12, 5) and (13, 5), 64 rows,
          where a dense derivation-(A) squaring was measured inside CI-5 and
          the 8 GiB ceiling at group times within the design's own 30-day
          horizon, under two engines (numpy FFT; standard-library decimal).
          The design invited this exhibit (route_table.exposure).
        - >-
          O-2 (attack ii). Under the engine WO-I-1 permits (standard library
          without decimal), derivation (A) stays assigned on (11, 4) and
          (14, 5), 44 rows, whose measured-rate group times exceed the horizon;
          model E is optimistic by a measured factor. Trial projections and
          claim-TTL guidance are short accordingly.
        - >-
          O-3 (PTM-D3). AC-7 as specified (trace without operand provenance)
          rejects the literal PTM-D3 object but admits two I_direct-in-disguise
          variants (D3b product of a residue with itself then reduction modulo
          L; D3c powers of S-BERL's own Q then gcd with L) on 184 of 184
          synthetic rows each; the text rule "never forms X^(2^k) modulo L or
          rad(L) for k >= 2" is contradicted by S-BERL's own Q rows.
      what_holds: >-
        A1 is necessary (at least 1812 rows by memory floor under any engine,
        852 more by measured classical-gcd cost); the amendment is inside
        R-AMEND-SCOPE in kind and touches no forbidden field (TQ-2 not fired);
        POST-DATA statement honest; S1 and calibration consequences
        substantially honest (O-5, O-6 precision); S-BERL algorithmically
        independent of I_direct as defined; CI-1, CI-3, CI-4 and blind_from
        binding hold; Stage-1 covers every census route; D-5 places C2 to C6
        where the stopping rules require; PTM-D2 met; no fact for K-new-record.
      other_objections: O-4 (A-TWIST classification), O-5, O-6, O-7 (amendment precision), O-8 (C6 exact-count improvement), O-9 (I_indep read set)
      ptm: PTM-D2 performed, signature met; PTM-D3 performed, signature NOT met at the acceptance-check layer
      composed_disposition: >-
        BREAKS. O-3 alone breaks the joint and the PTM-D3 signature, and uses
        no timing. O-1 breaks attack (ii) on the design's own criterion and is
        conservative under SP-3 contention. O-2 is adopted as a defect of the
        cost model and of the engine declaration, not relied on alone for the
        break. The consequence statement, the prior's predicted first site,
        holds.
    - joint: JD3
      owner: TASK-20261002-c81b2e (validator, blind)
      reported_verdict: inconclusive by design (BD-5); quantities reported
      composed_disposition: >-
        AGREES with the design on Q1 to Q3 within tolerance (step_4). Not
        K-infra: the joint ran in full; its attestation verdict is
        inconclusive because a blind card compares with nothing, and the
        comparison is the composer's.

  step_6_tripwires:
    - id: TQ-1
      fired: false
      basis: >-
        No party reports reading experiments/EXP-QSP-70b731/runs/, a blind_from
        path, EV-QSP-a6aa4b or a DEC-20260917-* decision. Name-only exposures
        (JD1 PN-1, the entry name runs and an in-flight reviews directory name;
        JD2 incidental_exposure, untracked directory names; JD3, a parent link
        count) list no contents. Ruled not fired.
    - id: TQ-2
      fired: false
      basis: >-
        The amendment changes the I_indep route on named Band-L rows (A1),
        assigns both census routes on the Stage-1 and C2 to C4 calibration
        cells (A1, a route per calibration cell, with the per-route agreement
        requirement as its consequence) and touches none of the fields TQ-2
        forbids. Its self-description "no tightening" is inaccurate (O-7) and
        its listing of A-TWIST is a classification defect (O-4); neither
        changes a forbidden field.
    - id: TQ-3
      fired: true
      by:
        - >-
          Producer TASK-20261002-c5d9e7, PD-1 (self-report): a mental
          evaluation of the composite lambda o lambda and hence H for one
          Stage-0 lambda at (4, 3), and inspection of C4's H; no value recorded.
        - >-
          Reviewer TASK-20261002-323713, RTD-1 and RTD-2 (self-report): hand
          expansion of the second iterate and H for a Stage-0 lambda at (4, 3)
          and of lambda^(o3) and H for C2 at (7, 3); no value recorded.
      not_fired:
        - >-
          RTD-3: reasoning about whether Proposition 2's criterion holds for C6
          at n' = 33 was stopped before any quantity was computed; nothing
          recorded. No H polynomial, root, gcd, count or decision statistic was
          computed.
        - >-
          JD1 PN-2: running the design's route_table_code and
          candidate_count_code and the degree equation d^(q+1) = 2^s on
          declared cells is bound-formula arithmetic and candidate counting,
          the class of D-C3, D-C4 and JD3's Q2, which the plan directs (attack
          vi). Not in TQ-3's list.
        - >-
          JD3 Q1 to Q3 on declared cells: its assigned quantities; not in TQ-3's
          list.
        - >-
          JD2 timing measurements on random synthetic polynomials of degree B
          (no declared field degree, no declared lambda): not a computation on
          a declared cell. Whether they lie inside the card's allowed
          computations was not checked against the card text (outside this
          composer's read_scope); the queue mirror of the card lists no
          restriction they cross and grants 8 GB.
      effect_applied: >-
        TQ-3's stated effect: the composer applies K-design-revise; no
        acceptance. JD1 and JD2 each break independently, so the key is
        overdetermined. Materiality, recorded: no value from either event
        exists in any file, message or artifact, so no artifact is seeded. The
        two sessions are barred from authoring the Stage-0 hand note and from
        any card that executes or checks Stage 0, C2 or C4 values; neither
        holds such a card. The revision's cards state the rule explicitly
        (DR-13).
    - id: TQ-4
      fired: false
      basis: >-
        No record of this round states an EXP-QSP-70b731 or EXP-QSP-33b442 run
        value or a reading of H-QSP-cd0c90's standing. JD2 quotes the
        specification's success-criterion headline sentence (O-6) and JD1
        cites the specification's preregistered null prior (HEUR-1); both are
        frozen contract text, not run values.
    - id: TQ-5
      fired: false
      basis: All three review cards report service at review-adversarial xhigh (self-reported; not measurable from inside a session).

  step_7_discharge_check:
    rule: >-
      Plan composition.discharge_check. For each item, does the design's
      discharge table map it to a named clause, and does the owning joint's
      report contradict the item's discharge? An item with no clause is a
      defect for K-design-revise.
    clause_present_for_every_item: true
    rows:
      - {item: D-1, owner: JD1, clause: 'required_artifacts[0]; invalidation_rules[6]; AGENTS.md artifact policy; check_run (text verified by JD1)', discharge: 'CONTRADICTED on the failed-record branch (BA-1)'}
      - {item: D-2, owner: JD1, clause: 'certificate_semantics; M5; F_acct; required_artifacts 3, 7; tail_checks 3; S5 (verified)', discharge: 'CONTRADICTED (BA-2); SO-2, SO-3 surviving'}
      - {item: D-3 accounting half and checker, owner: JD1, clause: 'invalidation_rules[2], [3]; M5; F_acct; certificate_semantics (verified)', discharge: 'holds; SO-2 surviving'}
      - {item: D-3 I_indep half, owner: JD2, clause: 'I_indep emit N and root list; CI-4', discharge: 'holds (WO-I-7, WO-I-8, AC-5 with fault injection)'}
      - {item: D-4, owner: JD2, clause: 'I_indep; which_cells_direct_vs_derivation; C1; stage_1; AMD-20261002-1303c4 A1', discharge: 'CONTRADICTED (O-1, O-2 route line; O-3 independence check AC-7)'}
      - {item: D-5, owner: JD2, clause: 'C2 to C6 blocking; stopping_rules[1], [2]; stage_1; stage_compare.when; stage_4 freeze; S3; F5', discharge: 'holds (read, no A2 needed)'}
      - {item: D-6, owner: JD1, clause: 'stages.stage_0; M9; independence_declaration; stopping_rules[0], [3] (verified)', discharge: 'CONTRADICTED on M9 matching (BA-3); no census-code path; SO-1, SO-4 surviving'}
      - {item: D-7, owner: JD1, clause: 'replication.seeds; AGENTS.md seeds (verified)', discharge: 'holds; SO-5 surviving'}
      - {item: D-8, owner: JD1, clause: 'stopping_rules[6]; success_criterion; Nonterminal run observations; check_run (verified)', discharge: 'holds for killed attempts; CONTRADICTED for failed attempts (BA-1); SO-6 surviving'}
      - {item: CC-1 fresh run ids, owner: JD1, clause: 'e0aa2b carried_conditions[0]; a63f13 R-CARRIED, R-IDS (b)', discharge: holds}
      - {item: CC-2 re-run of the 14, owner: JD1, clause: 'e0aa2b carried_conditions[1]', discharge: holds}
      - {item: CC-3 Linux, owner: JD1, clause: 'e0aa2b carried_conditions[2]; experiment_execution.py RLIMIT_AS', discharge: 'holds as a recorded requirement; SO-6 surviving'}
      - {item: CC-4 blind_from binds implementers, owner: JD2, clause: 'independence_declaration; invalidation_rules[0]; F_ind', discharge: 'work-order binding holds (JD2); its check AC-16 inherits BA-3 (JD1 R-2, adopted by the composer)'}
      - {item: CC-5 TW-C1, owner: all parties, clause: 'DEC-20261002-86a7e0 R-OUTCOME as carried', discharge: 'holds (record-level carry)'}
      - {item: CI-1, owner: JD2, clause: 'a63f13 R-CARRIED CI-1', discharge: 'holds; O-9 minor (minimum read set unlisted)'}
      - {item: CI-2, owner: JD1, clause: 'a63f13 R-CARRIED CI-2', discharge: holds}
      - {item: CI-3, owner: JD2, clause: 'a63f13 R-CARRIED CI-3', discharge: holds}
      - {item: CI-4, owner: JD2, clause: 'a63f13 R-CARRIED CI-4', discharge: holds}
      - {item: CI-5, owner: JD1, clause: 'a63f13 R-CARRIED CI-5', discharge: holds}
      - {item: CI-6, owner: JD1, clause: 'a63f13 R-CARRIED CI-6', discharge: 'holds; SO-7 surviving'}
      - {item: R-AMEND-SCOPE, owner: JD2, clause: 'a63f13 R-AMEND-SCOPE A1', discharge: 'inside scope in kind; necessity argument defective (O-1, O-2); classification and wording defects (O-4, O-7); precision (O-5, O-6)'}
    result: >-
      Every item has a named clause, so no item fails the discharge check for
      want of a clause. Discharge is contradicted by the owning joint (or by
      composition) on D-1, D-2, D-4, D-6, D-8, CC-4 and R-AMEND-SCOPE's
      necessity argument. These are the defects K-design-revise lists.

  step_8_amendment_classification:
    amendment: experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml (AMD-20261002-1303c4), bound at a736f483...
    classification:
      - {change: 'I_indep route on 2800 named Band-L rows to S-BERL', class: A1}
      - {change: 'both census routes (A-DENSE and S-BERL) on Stage-1 cells and C2, C3, C4, each compared with I_direct or the forced count', class: 'A1 (route per calibration cell); its per-route agreement requirement is an A1-consequential tightening the amendment mislabels "no tightening" (O-7)'}
      - {change: 'M4 slack null on S-BERL rows; M6 per route', class: 'A1 consequence; no definition change'}
      - {change: 'C5K-np33 route A-TWIST listed among unchanged derivation-(A) rows', class: 'misclassified (O-4); whether it is an A1 change on a control cell or a reading of C5 must be argued in the revision and ruled by its composer (DR-9)'}
      - {change: 'every forbidden field (prediction, criteria, M1 to M9 definitions, certificate_semantics, candidate set, cells, seeds, claim_tier, field model, tolerances, stage order, Stage-0 mechanics, blind_from, stopping and invalidation rules)', class: 'untouched (specification sha256 unchanged)'}
    r_amend_scope: inside R-AMEND-SCOPE in kind (A1 only); TQ-2 not fired
    necessity: >-
      A1 is necessary on at least 2664 Band-L rows (JD2), but the line the
      amendment draws rests on unmeasured engine rates that measurement
      contradicts in both directions (O-1, O-2). JD2 does not hold on the
      amendment's necessity argument as written.
    consequence_statement: substantially honest (JD2); precision defects O-5, O-6
    ruling: >-
      REFUSED. K-design-accept does not hold (JD1 and JD2 break, PTM-D3 not
      met, TQ-3 fired), and approval is admissible only under that key. The
      amendment stays unapproved and governs nothing (its own approval note).
      AMD-20261002-1303c4 is USED (the record exists, bound by
      TASK-20261002-f0f7e0) and is REFUSED here; it is not returned. The file
      is not edited. A revised amendment carries a freshly minted AMD id and a
      new path; amendment-v2.yaml stays as the refused, immutable record.

  step_9_prior_versus_outcome:
    - joint: JD1
      prior: >-
        Holds with p about 0.6; breaks expected at (a) D-6 (census code in
        Stage 0, or a constant blind_from_respected), (b) an acceptance check
        that cannot fail, (c) a manifest target that is not check_run's schema.
      outcome: >-
        Breaks. (a) partly as predicted: no census-code path, but M9 can be
        defeated by string form, the constant-attestation property returning
        through path format (BA-3). (b) not as predicted: every check can fail,
        but AC-11 and AC-2 have blind spots on constructed inputs. (c) partly:
        check_run-clean on completed and killed records, not on terminal failed
        records (BA-1). BA-2 (certificate naming under with-replacement C5
        draws) was not anticipated by the prior.
    - joint: JD2
      prior: >-
        Holds with p about 0.45; predicted breaks first at the amendment's
        consequence statement, then at the Band-L substitute's independence
        (sharing I_direct's algorithm or primitives), then D-5 read to permit
        fixtures after the census.
      outcome: >-
        Breaks, but not at the predicted first site: the consequence statement
        is substantially honest. The second predicted site breaks in a
        different place: S-BERL itself is independent; the independence
        acceptance check admits disguised I_direct (O-3). D-5 holds. The
        unpredicted break is the cost line itself, in both directions (O-1,
        O-2).
    - joint: JD3
      prior: Agrees within tolerance with p about 0.9; risk a mis-stated cell or candidate count.
      outcome: Agrees on every quantity.
    - joint: overall
      prior: >-
        K-design-accept with amendment 0.35; without 0.15; K-design-revise 0.4
        (JD2 first, then JD1); K-new-record 0.1.
      outcome: >-
        K-design-revise, with JD1 and JD2 both breaking (and TQ-3 fired). None
        of the prior's three "what would overturn" conditions occurred: no
        derivation-(A)-faithful route on all of Band L was found (JD2's route S
        collapses to I_direct, as the design's F-1 found); the old closure
        fails the design's checks (PTM-D1 met); JD3 agrees. JD2's concurrence
        that A1 is needed is weak corroboration of R-ROUTE-PRIOR (PD-D1,
        informed prior; JD2 read its summary); JD3 is the blind check on the
        arithmetic only.

