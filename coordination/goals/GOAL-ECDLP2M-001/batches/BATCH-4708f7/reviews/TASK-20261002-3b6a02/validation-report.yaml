  # ---------------------------------------------------------------------------
  ptm_d1:
    performed: true
    object: >-
      The bound closure, the eight files of experiments/EXP-QSP-70b731/implementation/
      at the plan digests (AK-4), read statically and fed through every
      acceptance check the design states.
    known_truth: >-
      The closure is non-conformant (F-01, F-02, F-04, F-06 of the archived
      report). A design whose checks pass it on any of these has proved too
      much.
    failure_signature: PTM-D1 fails the bound closure on at least F-01, F-02, F-04 and F-06.
    method: >-
      Static reading and parsing of the bound files' text (ast.parse; nothing
      imported or executed), constructed inputs shaped like the closure's
      outputs (C4 A3 and A10), and the plans' committed JSON. Where a check
      needs r1 code (a synthetic driver or a trace), the closure lacks that
      path, and the check fails on it.
    per_check:
      - {check: AC-1, bound_closure: fails, finding: F-01, evidence: 'driver.py lines 436-456 write a flat manifest; check_run on its key shape reports the missing run key (C4 A3)'}
      - {check: AC-2, bound_closure: fails, finding: F-13, evidence: 'manifest written only at the end (line 456) or as a flat infrastructure_error stub (lines 397-406), neither running nor failed with a validity_reason (C4 A10)'}
      - {check: AC-3, bound_closure: fails, finding: F-02, evidence: 'driver.py line 116 sets cert = None; line 212 counts N > 0 rows as certificate-bearing'}
      - {check: AC-4, bound_closure: fails, finding: F-03, evidence: 'check.py lines 56-63 fallback passes under-listed rows; lines 44-48 count any root_count_listed > 0'}
      - {check: AC-5, bound_closure: fails, finding: 'F-11, F-03', evidence: 'i_indep.py lines 82-84 continue past a failed root search; lines 316-321 fall back silently from A-H to A-L on any exception'}
      - {check: AC-6, bound_closure: fails, finding: F-04, evidence: 'i_indep.py measure_indep lines 307-322 choose the path by n <= 20 and a degree formula'}
      - {check: AC-7, bound_closure: fails, finding: F-04, evidence: 'i_indep.py imports gf2_poly (line 25) as i_direct.py does (line 11); _independent_gcd_count lines 52-62 squares x modulo L; bitwise operators throughout i_indep.py'}
      - {check: AC-8, bound_closure: fails, finding: F-04, evidence: 'Stage-1 cells have n in {7, 11, 13}, at most 20, so enumeration runs (lines 313-314) and no census path is calibrated'}
      - {check: AC-9, bound_closure: fails, finding: F-05, evidence: 'every plan has stage5-controls depending on stage-compare-sealed (D-C6, C3); check.py has no agreement or F1 exit (custody commands 9; C11)'}
      - {check: AC-10, bound_closure: fails, finding: F-06, evidence: 'driver.py module-level imports lines 31-35 and census calls lines 173-174 inside stage0 (C6 static)'}
      - {check: AC-11, bound_closure: fails, finding: F-06, evidence: 'blind_from_respected is the constant True (line 451); executor_read_set is STATIC_READ_DECLARATION (line 44); no read set is loaded, so cases b, c and d come out true'}
      - {check: AC-12, bound_closure: fails, finding: F-10, evidence: 'whitelist flags i_indep.py line 102 and gf2_poly.py line 294 (C8); a constant-only scan would not (SO-5)'}
      - {check: AC-13, bound_closure: fails, finding: 'carried condition', evidence: 'the bound plans carry the earlier ids themselves (C9 F6, F7)'}
      - {check: AC-14, bound_closure: 'fails on trial-plan-v2.json and trial-plan-cont.json; passes on the four twenty-trial plans', finding: none, evidence: C9}
      - {check: AC-15, bound_closure: fails, finding: 'carried condition', evidence: 'no plan carries platform_requirement and the driver has no Linux gate (custody command 8)'}
      - {check: AC-16, bound_closure: 'not evaluable in this read scope', finding: none, evidence: 'the only declaration visible in the bound bytes is STATIC_READ_DECLARATION, which names no blind_from path; its constancy is caught by AC-11, not AC-16'}
      - {check: AC-17, bound_closure: fails, finding: 'CI-2', evidence: 'its files are not under implementation/r1/'}
      - {check: AC-18, bound_closure: 'passes its static part', finding: none, evidence: 'all eight files parse under CPython 3.11.15 with no listed 3.12-only API (C10); not a PTM target'}
      - {check: AC-19, bound_closure: 'passes vacuously', finding: none, evidence: 'no test tree among the eight files (SO-7)'}
      - {check: AC-20, bound_closure: 'would pass (reasoned, not executed)', finding: none, evidence: 'on synthetic cells (n at most 18) the bound I_indep enumerates the field (lines 313-314), which equals brute force by construction; AC-6, AC-7 and AC-8 carry F-04, as the design assigns'}
      - {check: AC-21, bound_closure: fails, finding: 'F1 stop', evidence: 'check.py makes no bound comparison'}
      - {check: AC-22, bound_closure: fails, finding: 'freeze', evidence: 'no compare.py and no freeze record; driver.py stage_compare is a stub (lines 275-288)'}
      - {check: AC-23, bound_closure: fails, finding: 'plan conformance', evidence: 'approved_by non-null, no amendment, source_sha256 binds the bound files'}
      - {check: AC-24, bound_closure: fails, finding: 'F-14, F-02', evidence: 'check.py imports i_indep (line 21) and re-runs measure_indep (line 90)'}
    signature_met: true
    signature_note: >-
      F-01 by AC-1; F-02 by AC-3 and AC-24; F-04 by AC-6, AC-7 and AC-8; F-06
      by AC-10 and AC-11. The design's own ptm_d1_statement agrees on every
      cited line. AC-12's catch of F-10 depends on the scan being the
      whitelist its procedure describes (SO-5).

  # ---------------------------------------------------------------------------
  surviving_objections:
    - id: SO-1
      items: [D-6 (M9)]
      severity: moderate
      objection: >-
        execution-context-r1.yaml is immutable once committed before the first
        trial and names the execution session's declaration. Whether that
        declaration is updated during execution is unstated. If it is frozen,
        M9 for Stages 2 to 4 reads a pre-declaration and cannot reflect reads
        made during counting, which is the scope of invalidation_rules[0]. If
        it is updated honestly, then after the Stage-4 freeze the execution
        batch opens the sealed Stage-3 files to write compare-map-r1.yaml
        (WO-R-14), its declaration then names a blind_from path, and WO-R-9
        exits 7 on stage-compare-sealed.
      repair: >-
        Make the declaration append-only and commit it before each launch, so
        it is bound to HEAD per run. Add a time-scoped exemption for the
        post-freeze sealed read, limited to stage-compare-sealed and recorded
        against the freeze record.
    - id: SO-2
      items: [D-2, D-3]
      severity: moderate
      objection: >-
        As written, WO-R-9 exits 3 for F_acct on a hash mismatch, a root
        failure or a payload-disk disagreement. It does not require
        identity_holds and does not bind files to rows. Read literally, it
        exits 0 on B5 (the cert writer skips one row while the accounting is
        honest) and on B8 (a row with no file plus a phantom file). AC-3's
        three PTM-R1 mutations are all post-hoc tampering and cannot tell the
        two readings apart. The payload still records B5 as invalid with
        F_acct, so F-02's shape is no longer silent. B8 is caught only by
        AC-3's per-row reviewer clause in round 2, never at execution.
      repair: >-
        Have the checker exit 3 unless identity_holds, recomputed from disk,
        is true and every N > 0 row is bound to a re-verified file of the same
        cell, lambda and N. Add the mutations "the payload's cert writer skips
        one row" and the swap.
    - id: SO-3
      items: [D-2 wrapper independence]
      severity: moderate
      objection: >-
        AC-24 audits the direct imports of certs.py, accounting.py and check.py
        but not kfield.py. A kfield.py that re-exports r1.indep.fieldk passes
        (C12c), and the wrapper then verifies roots with I_indep's own
        arithmetic, which is F-14's shape. WO-R-1 forbids this, but no
        acceptance check enforces it.
      repair: Audit transitive imports, kfield.py included, and add the mutation "kfield.py imports r1.indep.fieldk".
    - id: SO-4
      items: [D-6]
      severity: minor
      objection: >-
        AC-10 runs stage0.py directly, while the plan's argv enters through
        main.py. A main.py that imports census code at module level passes
        AC-10 (C6d) and trips the runtime guard only at execution. There the
        payload's exit 9 is labelled infrastructure_error by
        tools/experiment_execution.py, the label under which RUN-QSP-cec70a
        was retried with a fresh id. The behaviour is fail-safe, not unsound.
      repair: >-
        Run AC-10's runtime part through the plan's argv form, and compute the
        static graph from main.py's Stage-0 path.
    - id: SO-5
      items: [D-7]
      severity: minor
      objection: >-
        The stated mutation random.Random(12345) does not tell the whitelist
        that AC-12's procedure describes apart from a constant-only scan. A
        constant-only scan misses both F-10 lines (C8).
      repair: Use the F-10 shape random.Random(0xC0FFEE ^ d) as the mutation.
    - id: SO-6
      items: [CC-3, D-8]
      severity: minor
      objection: >-
        tools/experiment_execution.py never reads platform_requirement and
        sets RLIMIT_AS in preexec_fn. On darwin the payload therefore never
        starts. WO-R-5 cannot fire there, AC-15's patched-platform test
        exercises a branch unreachable on the platform it targets, and the
        attempt leaves no manifest (the RUN-QSP-cec70a shape of F-13). The
        guard that actually works is the execution card's choice of host.
      repair: >-
        Make Linux an execution-card dispatch precondition, and have the
        execution report record pre-payload failures, which the payload cannot
        record.
    - id: SO-7
      items: [CI-6]
      severity: minor
      objection: >-
        AC-19 passes on an empty test tree, and nothing checks that the
        WO-I-12 and WO-R-18 tests exist.
      repair: Require the test trees to define every synthetic_cells name.
    - id: SO-8
      items: [D-2, D-3 (F1 rule)]
      severity: none (checked, holds)
      objection: >-
        WO-R-9's F1 clause is conditioned on non-square rows only, while the
        bound carries H != 0. C12 shows that d^(q+1) = 2^s, the only way H can
        vanish, occurs on no instrumented (cell, d) of route_map; the single
        tie is the hand-only Stage-0 pair. The rule is well-posed.
      repair: none needed

  referred_to_composer:
    - id: R-1
      subject: PD-1 and TQ-3
      text: >-
        The producer's PD-1 is a self-reported mental evaluation of an H
        polynomial on a declared cell, outside the D-C1 to D-C6 envelope, with
        no value recorded anywhere. JD1's clause on the design's computations
        therefore fails as literally stated. TQ-3's effect is the composer's to
        apply; no ruling is made here.
    - id: R-2
      subject: AC-16 (JD2-owned) inherits BA-3
      text: >-
        AC-16 applies "the AC-11 cases" to the implementation reports, so it
        uses the same matching rule. This is a pointer only, not a judgement on
        JD2.
    - id: R-3
      subject: session independence fact
      text: >-
        The design's session_computations scratch path shows that the producer
        TASK-20261002-c5d9e7 ran under the same top-level session scratchpad
        root as this card. This reviewer is a fresh subagent context that
        authored nothing of the design, DEC-20261002-a63f13 or either plan.
        Whether that satisfies the card's independence note is a dispatch
        precondition; it is recorded here, not ruled.

  # ---------------------------------------------------------------------------
  verdict: failed
  verdict_scope: >-
    JD1 only, equal to the joint verdict "breaks" (BA-1, BA-2, BA-3).
    Admissibility of the design as JD1 states it; no whole-design verdict, no
    verdict on JD2, JD3 or the amendment. A failed JD1 says nothing about
    N_K(L), H-QSP-cd0c90, EV-QSP-a6aa4b or any curve. It supports no ECDLP
    claim and authorizes nothing.
  limitations:
    - >-
      No r1 code exists. Every acceptance check was evaluated as written, on
      models this reviewer wrote from the design's text (C4 to C12). A
      different reasonable reading of a work order could change a model's
      outcome, which is why each break quotes the text it rests on and states
      both readings where they diverge (BA-2, SO-2).
    - >-
      The check_run used is the one at 70833db4. The r1 checker would import
      tools/validate_ledger.py, which no source_sha256 covers; it is pinned
      only by the run's code.commit.
    - >-
      The bound closure was read statically. AC-20's outcome on it is
      reasoned, not executed.
    - >-
      The D-C1 to D-C6 definitions on the producer's card are outside this
      card's read_scope. The archived validator report and the dispatch queue
      were read in part (sources_read_extent).
    - >-
      One model family serves every role by runtime inheritance. Session
      independence is real; model independence is not claimed.
  procedure_notes:
    - id: PN-1
      text: >-
        Name-only exposures, for TQ-1. The first git status --short printed the
        untracked directory name
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/reviews/, an
        excluded in-flight directory. ls experiments/EXP-QSP-70b731/ printed
        the entry name "runs" without listing its contents. A later git status
        printed coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/reviews/
        as untracked; that is the parent of this card's write scope, and no
        sibling directory under it was listed or opened. Nothing under any of
        them was read. This reviewer judges that TQ-1 did not fire; the
        composer rules.
    - id: PN-2
      text: >-
        The declared-cell arithmetic this review ran is limited to running the
        design's route_table_code and candidate_count_code (C2), as attack (vi)
        directs, plus re-hashing (C3) and C12's degree equation d^(q+1) = 2^s.
        That is bound-formula arithmetic and candidate counting, the class of
        D-C3, D-C4 and JD3's Q2. It computes no N, root, gcd with X^(2^n) - X,
        H polynomial or decision statistic. All field arithmetic ran on the
        synthetic cell syn-x-05-02 (n = 5) and on synthetic moduli of degree 6,
        9, 10, 15, 17 and 18. Disclosed so the composer can rule under TQ-3.
    - id: PN-3
      text: >-
        tools/validate_ledger.py was imported only so that check_run could be
        called on scratch manifests; the import reads
        tools/duplicate_run_ids.yaml. tools/experiment_execution.py was read as
        text and never run in any mode. Nothing was written outside the private
        scratch and this card's write scope; nothing was staged or committed.
  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    reasoning_effort_note: As the card and the validator binding request; the runtime's effort setting is not observable from inside the session.
    served_by: claude-opus-5-5
    served_by_note: As reported to this agent by its runtime (Claude Code subagent); not probe-verified.
