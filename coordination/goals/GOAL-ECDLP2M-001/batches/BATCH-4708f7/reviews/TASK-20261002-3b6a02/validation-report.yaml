  # ---------------------------------------------------------------------------
  jd1:
    verdict: breaks
    verdict_summary: >-
      Most of JD1 holds. Every D-item, carried condition and CI item it owns
      has a specification or decision clause, work orders and an acceptance
      check, and every JD1 acceptance check can be made to fail. The manifest
      target meets check_run's schema on completed and killed records. Stage
      0 has no census-code path. The run-id rule admits no reuse. Every relayed
      D-C output reproduces, and PTM-D1 meets its failure signature. The joint
      still breaks, at three places, each with a constructed input. (BA-1) The
      failed-attempt record the design writes is not check_run's schema, and
      no check would catch it. (BA-2) The certificate and accounting work
      orders fail the design's own C5 sampling by construction, so they cannot
      be implemented as written. (BA-3) The M9 read-set matching rule returns
      blind_from_respected true for declarations that name a blind_from file
      in the design's own annotated format or in other ordinary path forms,
      and AC-11 never samples those forms. Each break has a local textual
      repair; none needs an amendment.
    breaking_artifacts:
      - id: BA-1
        items: [D-1, D-8]
        joint_clause: >-
          "The manifest target is the run-record schema tools/validate_ledger.py
          check_run applies" and "Failed and expired attempts leave a record
          validate_ledger can see".
        defect: >-
          WO-R-3's exception path ("On an exception it writes status failed
          with validity_reason before exiting") and WO-R-5's Linux gate ("write
          status failed with validity_reason ... and exit 2") write a TERMINAL
          record. No work order requires raw-result.json on those paths.
          check_run waives raw-result.json only for status running or
          in_progress with result.raw_result_pending true
          (tools/validate_ledger.py lines 881-895), and
          docs/claims-and-verification.md "Nonterminal run observations" says
          terminal statuses still require the raw result.
        constructed_input: >-
          C4 case A8. Status failed, validity_reason set, raw_result_pending
          carried from the provisional record, all four companions present,
          no raw-result.json.
        result: >-
          check_run reports "run directory missing artifact 'raw-result.json'".
          AC-2's forced-exception branch, as written, checks only "status
          failed and a validity_reason", so it passes A8. AC-15 expects "exit 2
          with the failed manifest of WO-R-5" and runs no check_run. At
          execution, tools/experiment_execution.py skips the checker after a
          non-zero payload exit (lines 394-399), so nothing catches it there
          either. Case A9 (the same record plus a raw-result.json) is
          check_run-clean.
        consequence: >-
          Every failed attempt that the design makes visible becomes a
          validate_ledger error line naming a run manifest once it is
          archived. That recreates the F-01 and NA-6 hygiene debt on the
          failure path that D-8 exists for.
        repair: >-
          In WO-R-3 and WO-R-5, write a raw-result.json carrying the error, the
          stop code and the count of finished rows before the terminal record.
          Add a check_run call to AC-2's forced-exception branch and to AC-15.
      - id: BA-2
        items: [D-2, D-3 accounting half]
        joint_clause: >-
          "Every item maps to (... an executor work order precise enough to
          implement without further design ...)" and "certificate_bearing
          counts re-verified files on disk; M5 is checked per stage before any
          headline".
        defect: >-
          WO-R-7 names each certificate certs/<cell slug>/<lambda hex>.json.
          WO-R-8 counts certificate_bearing as FILES and requires
          certificate_bearing + zero_N_rows == rows_completed per stage and per
          trial. WO-R-12 draws the C5 null-object lambda WITH REPLACEMENT, 100
          per (n', d, coefficient field), and C5 rows carry certificates (n' =
          11 through I_direct's root listing, n' = 33 through A-DENSE). Two
          rows of one C5 cell with the same lambda share one file path, so a
          repeated lambda with N > 0 contributes one file and two or more
          positive rows. There are only 8 exact-degree-3 F_2 polynomials, so
          each F_2 arm at d = 3 repeats lambda by pigeonhole: at least 92 of its
          100 rows repeat an earlier lambda, and some lambda occurs at least 13
          times. If any repeated lambda has N > 0, the design's own bookkeeping
          fails stage5-controls' M5 identity. The design does not assert that
          every repeated lambda has N = 0, and the specification's
          preregistered null prior (HEUR-1, mean N near 2) gives no reason to
          expect it. The file name is also undefined for K-coefficient lambda,
          which the interface encodes as a list of hex strings.
        constructed_input: >-
          C5 case B7 on the synthetic cell syn-x-05-02 (n = 5, n' = 2). 30
          draws with replacement over the 4 exact-degree-2 F_2 polynomials give
          30 rows, 24 of them positive, and 3 certificate files on disk.
        result: >-
          The payload's identity_holds is false, the headline is null and the
          validity is invalid with F_acct. Read literally, WO-R-9 exits 3 only
          on a hash mismatch, a root failure or a payload-disk disagreement;
          under that reading the checker exits 0 and the runner records
          output_validated for a trial its own manifest calls invalid. Read
          strictly, with an identity gate, it exits 3. Every census trial
          depends on stage5-controls (d5_ordering.placement), so under the
          strict reading no census trial can start. AC-3 runs only on synthetic
          cells with exhaustive lambda sets (synthetic_cells.rule), so no
          acceptance check exercises this case.
        consequence: >-
          As written, the plan yields either an invalid stage-5 record (M5
          fails on stage 5; whether that defeats S5 depends on how "each
          completed stage" is read, which the design does not settle) or a
          census that is blocked from starting. The failure comes from
          bookkeeping, never from mathematics; it would be an implementation
          defect, not evidence.
        repair: >-
          Name certificate files per row, for example certs/<cell
          slug>/<row index>-<lambda key>.json, or define certificate_bearing
          per row: rows with N > 0 whose certificate_path names a re-verified
          file bound to that row's cell, lambda and N. State the rule for
          repeated lambda and for K-coefficient lambda. Add a with-replacement
          synthetic case (B7) and a swap case (B8) to AC-3.
      - id: BA-3
        items: [D-6 (M9); CC-4 through AC-16]
        joint_clause: >-
          "M9 a declared, checkable read set per run" and no constant
          attestation (attack (iv)).
        defect: >-
          WO-R-11 matches each declared path against the ten blind_from entries
          by exact string equality, or by prefix for entries ending in a
          slash. It declares no entry format and normalises nothing. Six of the
          ten blind_from entries are files. The work orders give no format for
          read_attestation.paths_read. The only example the executors see is
          the design's own read_attestation, all 28 of whose entries are
          written "path (extent)" (C7).
        constructed_input: >-
          C7 cases f to k. A blind_from file in the design's "path (extent)"
          form (knowledge/techniques/KN-TECH-54c38e.md (full)). An absolute
          path to analysis/qsp-ecc2k130/explore/explore.json. A "./" form. A
          ".." form. experiments/EXP-QSP-33b442/runs without its trailing
          slash. The parent directory experiments/EXP-QSP-33b442/ read whole.
        result: >-
          For every one of these declarations, the literal rule returns
          blind_from_respected TRUE. AC-11's four stated cases (a) to (d) are
          all decided correctly (C7 a to d), so AC-11 passes a readset.py with
          this blind spot. On this input class M9 cannot come out false. That
          is the F-06 property (an attestation that cannot fail) coming back
          in through string form, and S4 rests on M9.
        repair: >-
          Make each declaration a list of bare canonical repo-relative POSIX
          paths, with extents in a separate field. Canonicalise before matching
          (strip the checkout prefix, normpath). Count as a hit any entry that
          equals a blind_from directory without its slash or is a parent of a
          blind_from entry. Make any non-canonical entry set
          blind_from_respected false (exit 7). Add cases f to k to AC-11. The
          repaired rule in C7 decides all twelve cases correctly.

