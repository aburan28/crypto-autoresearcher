          constructed_failing_inputs: T1 itertools.batched; T2 type statement; T3 PEP 695 generic; T4 nested same-quote f-string; T5 random.binomialvariate
          result: >-
            Under CPython 3.11.15, T1 and T5 are flagged by the API scan, and T2
            to T4 raise SyntaxError (C10).
          can_fail: true
        - id: AC-19
          constructed_failing_inputs: test cell with n = 11
          result: Fails. The design's fourteen synthetic cells pass (C10).
          can_fail: true
          gap: SO-7 (an empty test tree passes).
        - id: AC-21
          constructed_failing_inputs: non-square row with a re-verified N above a mutated bound
          result: >-
            Exit 6. A square row in the same state does not trigger F1 (C11).
            The rule is well-posed: d^(q+1) = 2^s, the only way H can vanish,
            occurs on no instrumented (cell, d) of route_map (C12).
          can_fail: true
        - id: AC-22
          constructed_failing_inputs: raw-result.json changed after its freeze record
          result: Exit 1 before the trapped sealed fixture is opened (C11).
          can_fail: true
        - id: AC-23
          constructed_failing_inputs: one source digest changed
          result: >-
            Fails the comparison, evaluated statically (not executed, VD-4).
            tools/experiment_execution.py load_plan (lines 85-183) refuses a
            null approved_by (lines 94-96), as the design says. Every other
            load_plan condition is met by plan_requirements: schema; frozen;
            safe paths; the specification hash, approval, freeze and
            execution_authorized; a non-empty source_sha256 that holds main.py
            and check.py, so each argv carries a hash-bound source (lines
            143-148); manifest.yaml and raw-result.json among the artifacts
            and no reserved name (lines 149-158); allow_empty_artifacts within
            the artifacts; memory_mb 8192; watchdog null; and depends_on
            naming earlier trials in the stated topological order (lines
            176-182).
          can_fail: true
          note: >-
            load_plan reads the plan from a path. "approved_by replaced in
            memory only" therefore needs either a patched reader or a temporary
            copy under a temporary root, and the design does not say which.
            This is an implementability detail, not a break.
        - id: AC-24
          constructed_failing_inputs: C12b (design mutation, certs.py imports r1.indep.fieldk)
          result: Fails (C6).
          can_fail: true
          gap: SO-3. A kfield.py that re-exports r1.indep.fieldk passes the audit as written (C12c).

    attack_iv_stage0_and_m9:
      census_code_path: >-
        None. The Stage-0 payload does bookkeeping only. Its imports are
        limited to manifest, readset, context and errors, the standard
        library and PyYAML. It has a static transitive-import check plus a
        sys.modules guard at start and at exit. blind_from existence is
        checked with os.path.exists only, and F0 comes from the checker's exit
        9. On reviewer stubs, the guard catches direct, transitive and dynamic
        census loads (C6 b, c, e). Holds, with SO-4 on the main.py entry path.
      constant_attestation: >-
        Not a literal constant. M9 is computed per run from four declared and
        committed files. It can, however, be defeated by string form (BA-3),
        and the scope in time of the execution-phase declaration is
        unspecified (SO-1). The hand note's "no code executed" is an attestation
        by a named author; code cannot verify it, and the execution round's
        validator re-checks the content by hand. That is inherent in "compute
        ZERO for the mathematical gate"; it is not a constant.
    attack_v_run_ids:
      rule: >-
        plan_requirements.trials.run_ids with AC-13. Twenty ids minted with
        tools/allocate_id.py --next run --area QSP and --check before
        TASK-20261002-b72830 is dispatched, recorded in tasks_state_revisions,
        and none in the union of the six earlier plans' ids or the sixteen
        bound directory names.
      checked: >-
        The six plans' union holds 23 ids. The sixteen bound directory names
        (archived report run_ids) are a subset of it, and so are the twenty ids
        of trial-plan.json. The seven ids outside the bound set are planned
        but never created (12a389, 15a2ab, 186d9d, 7faa1b, d10c74, ebcc71,
        ef2490); they are excluded too, which is stricter than R-CARRIED's
        "20 run ids". The runner never reuses a directory
        (tools/experiment_execution.py line 373). The later execution plan
        re-binds r1's own ids by design (approval_binding). That is not reuse
        of an executed id, because trial-plan-r1.json is never executed. The
        queue holds no RUN-QSP id yet, consistent with R-IDS (b), so the rule
        can be checked now and the ids cannot.
      result: holds (no reuse admitted)
    attack_vi_custody_and_relays:
      result: >-
        Producer files and inputs hash as bound (AK-1 to AK-6). Every relayed
        D-C1 to D-C6 output reproduces from the committed code blocks and
        bytes (MR-1 to MR-6).
      computations_clause: >-
        JD1's clause "The design's own computations stayed inside D-C1 to
        D-C6" holds for every tool-run computation. Taken literally, it does
        not hold for the producer's self-reported PD-1: a mental evaluation of
        the H polynomial for one Stage-0 lambda and inspection of C4's H, with
        no value recorded. That is referred to the composer under TQ-3
        (referred_to_composer R-1); this reviewer makes no ruling. The D-C1 to
        D-C6 definitions on the producer card lie outside this card's
        read_scope. The commands were therefore checked against the relayed
        text and the queue's stated envelope (notes[9]), not against the card.

