      polynomial of exact degree d needs d = 2^i, with free choice of the
      lower terms X^(2^0) to X^(2^(i-1)), giving 2^i, and none when d is not
      a power of 2. Among 3 to 7 only d = 4 qualifies. (c) is the total over
      degrees 3 to 7 minus the linearized total over the same degrees. (d)
      is the total over degrees 2 to 7. All three enumeration routes agree.
