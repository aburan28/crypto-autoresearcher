  jd2:
    i_own_route_table:
      where: computations.json v0_verbatim (its own_route_table block and its raw_outputs rt_route_table.out and rt_route_judgement.out)
      method: >-
        For every declared census and calibration cell: (q, r) = divmod(n, n'),
        s = n' - r, per degree d the derivation-(A) bound B = max(2^s, d^(q+1)),
        group sizes, and a feasibility judgement for dense derivation (A) as
        H-QSP-cd0c90 and IDEA-20260916-3f7a1c state it (build H, K-roots of H
        via gcd with Y^(2^131) - Y, factor, closing test) under the 8 GB
        ceiling. The judgement used measured constants on random synthetic
        polynomials, and a structured-route search checked on 2520 synthetic
        (cell, lambda) pairs.
      result_v0: >-
        Band L: dense (A) feasible within 8 GiB and at most 3 h per candidate on
        exactly 128 rows, (n', d) in {(9,3), (10,3), (11,3), (11,4), (12,3),
        (12,4), (13,3), (13,4), (14,3), (14,4), (14,5)}. 128 more rows,
        (12,5), (13,5) and (14,6), fit in memory but take about 14 to 20 h
        per candidate with a classical gcd. 2672 rows are infeasible in this
        environment. Bridge (B at most 117649) and Band H (B at most 2401):
        (A) on every row. Stage 1 (B at most 343), C2 (B = 8), C3 (B = 2^21,
        n = 31) and C4 (B = 64, r = 0, vacuous): (A) feasible. C5 at n' = 11:
        I_direct only per the specification. C5-F2 at n' = 33: (A). C5-K at
        n' = 33: derivation (A) as stated needs lambda in F_2[X], so it needs
        a twisted form (a route gap). C6: (A) feasible (H sparse for linearized
        lambda).
      structured_route_found: >-
        Route S, "H reduced modulo L, then rad gcd(L, H mod L)", is feasible on
        all of Band L and agrees with I_direct on 2520 of 2520 synthetic pairs.
        It is proved to collapse to I_direct: lambda^(ok)(X) = X^(2^(k n')) mod
        L, so H mod L = (X^(2^n) + X)^(2^s) mod L, which holds on all 2520
        pairs. It is therefore not an independent instrument and exercises no
        Band-H code path. The design found the same route and rejected it for
        the same reason (faithful_route_search F-1). No route was found that
        yields the K-roots of H without a dense H of degree B (a bounded
        search, not an impossibility claim).
    ii_cell_by_cell_comparison:
      band_L_A_rows: identical 128-row set (design route_map and amendment unchanged_derivation_A_rows)
      band_L_S_BERL_rows: >-
        2800 rows in both tables. The agreement is not robust: three groups
        sit within an order of magnitude of the design's horizon, and two of
        them, (12, 5) and (13, 5), break on the design's own criterion at
        measured rates (ii_cost_argument_tests).
      bridge_n22: agree, A-DENSE on all 244 (B 729 to 117649)
      band_H: agree, A-DENSE on all 732 (B at most 2401, 343, 49)
      stage1_cells: agree that (A) is feasible. The design adds S-BERL on every row (dual route), which is correct for the calibration purpose (iii, A1-consequential)
      C2_C3_C4: agree that (A) is feasible; design dual-routes them (A-DENSE+S-BERL)
      C5_np11: agree, I_direct only (NONE-I_DIRECT-ONLY)
      C5F_np33: agree, A-DENSE
      C5K_np33: >-
        Route agrees in substance: A-TWIST, the Frobenius-twisted derivation of
        WO-I-5. I checked the derivation independently against brute force on
        96 K-coefficient and 27 F_2-coefficient synthetic cases (n in {9, 10,
        15}); all root sets are equal. But A-TWIST is not derivation (A) as
        H-QSP-cd0c90 states it, and the amendment lists it among the
        "unchanged derivation A rows". Classification objection O-4.
      C6_np11_np33: agree, A-DENSE (sparse H for linearized lambda; design F-7)
      stage0: agree, HAND
    ii_cost_argument_tests:
      design_rule: >-
        Feasible iff the memory floor 2B bits fits in 8 GiB AND G times the
        per-candidate time under the more favourable of models P and E fits in
        a 30-day horizon. Models P and E carry stated optimistic rates. The
        design says the table is the same for any horizon from 8.29 to
        121.98 days, and that "a faster engine than model E inside CI-5 would
        move the narrowest substitutions".
      memory_floor_rows_1812: >-
        Agree. B above 2^35 means one dense operand alone exceeds 4 GiB, and
        any dense route needs at least two operands. Survives under every
        engine.
      time_only_rows_988: >-
        852 of the 988 exceed the 30-day horizon on the measured
        classical-gcd cost alone, before any squaring. This holds whether the
        measured 2^24 gcd (1996.6 s) is extrapolated quadratically or with the
        measured local exponent 1.907 (2^23 to 2^24); the count is 852 both
        ways. The substitution survives there under every engine measured
        here (no half-gcd exists in any of them). The remaining 136 rows are
        (8, 3), (12, 5), (13, 5) and (14, 6).
      exhibited_feasible_A_routes_on_substituted_rows:
        - cell_d: stage2-bandL-n12 d=5 and stage2-bandL-n13 d=5 (B = 5^11 = 48,828,125; 32 rows each)
          design_model_E_group_days: 121.978
          measured_NP_group_days: 10.77
          measured_DEC_group_days: 18.3
          evidence: >-
            One Barrett modular squaring modulo a random dense polynomial of
            degree exactly 48,828,125 with numpy FFT products. It took 50.44 s,
            plus 86.42 s of precompute once per modulus, with peak RSS
            4693.6 MiB under RLIMIT_AS = 8 GiB. It was verified exactly: the
            even bits reproduce the square, the stdlib-decimal recomputation of
            Q*m equals the FFT Q*m, and deg R < D, so by uniqueness of
            division R = a^2 mod m. The stdlib-decimal product at the same
            degree takes 101.55 s. The classical gcd is taken as the largest
            of the quadratic extrapolations from the measured 2^22 (165.2 s),
            2^23 (533.0 s) and 2^24 (1996.6 s) points, 6.22 h per candidate. Projection: NP
            131 x 50.44 s + 86 s + 6.22 h = 8.1 h per candidate, x 32 =
            10.8 days. DEC 131 x 2 x 101.55 s + 6.22 h = 13.6 h per candidate,
            x 32 = 18.3 days.
          verdict: >-
            Inside the 8 GiB ceiling and inside the design's own 30-day
            horizon under both measured engines, so the substitution does not
            survive. A1 must move these 64 rows to A-DENSE, or justify
            WO-I-1's engine restriction from the specification. Neither the
            specification nor IDEA-20260916-3f7a1c requires it; the IDEA
            envisages reuse of any GF(2) polynomial library present.
        - cell_d: stage2-bandL-n14 d=6 (B = 6^10; 64 rows)
          design_model_E_group_days: 343.18
          measured_NP_group_days: 31.56 (2^22-referenced gcd); about 26.7 with the 2^23-referenced gcd
          measured_DEC_group_days: 50.21
          verdict: at the horizon under NP and over it under DEC. Not exhibited as a break; to be decided by measurement.
        - cell_d: stage2-bandL-n8 d=3 (B = 3^17; 8 rows)
          design_model_E_group_days: 152.877
          measured_NP_group_days: not applicable (an unchunked FFT product needs FFT length 2^28, about 8.3 GiB, over the ceiling)
          measured_DEC_group_days: 21.11 (projected; decimal memory at this size not measured)
          verdict: plausible but not exhibited.
      a_rows_beyond_horizon_under_the_permitted_engine:
        engine: >-
          WO-I-1's enumerated standard-library modules (no decimal, no
          third-party). The product engine is bit-spread CPython-int
          multiplication, which is model E's own shape. Measured rate
          6.12 to 6.56 times slower than model E's "1 ns per Karatsuba
          digit-operation" at 2^20 to 2^26 bits (rt_karatsuba.out).
        groups:
          - {cell_d: stage2-bandL-n11 d=4, rows: 12, design_model_E_group_days: 7.84, measured_rate_group_days: 47.48, decimal_group_days: 1.54}
          - {cell_d: stage2-bandL-n14 d=5, rows: 32, design_model_E_group_days: 8.29, measured_rate_group_days: 50.28, decimal_group_days: 1.83}
          - {cell_d: stage2-bandL-n9 d=3, rows: 8, design_model_E_group_days: 3.82, measured_rate_group_days: 23.16, decimal_group_days: 0.81}
        verdict: >-
          Under the engine the work order permits, derivation (A) is assigned
          on 44 rows that the design's own rule would call infeasible at
          measured rates. The design's trial projections for
          stage2-bandL-n11 and -n14 (7.85 and 8.46 days, D-C3) are about six
          times short for the claim TTL its plan_requirements tell the
          execution batch to size. If decimal is admitted, every derivation-(A)
          group is at most 1.83 days and the inconsistency disappears.
      robustness_claim: >-
        False at measured rates. Under NP or DEC the largest derivation-(A)
        group is under 2 days and the smallest substituted group is 10.8 to
        18.3 days. Any horizon between 2 and 10.8 days reproduces the design's
        table, and the design's 30-day horizon does not.
      cheapest_fix: >-
        Fix the I_indep engine set first, admitting decimal (standard library)
        or numpy (version recorded). Then measure per-squaring and gcd rates on
        synthetic polynomials at the boundary degrees, redraw A1 from measured
        rates, and record the engine in the route table's provenance.
    iii_amendment_diff:
      method: >-
        Field by field against specification.yaml (version 1), classified A1,
        A2, A3, tightening or out of scope (TQ-2). The specification itself is
        unedited (sha256 unchanged).
      changes:
        - field: specification.inputs.instruments.I_indep (which algorithm fills the I_indep column on 2800 listed Band-L rows)
          classification: A1
          note: inside R-AMEND-SCOPE in kind. The infeasibility argument for 64 of the 2800 rows does not survive (ii); for 44 retained rows it holds only at model E's rate under the WO-I-1 engine set
        - field: which_cells_direct_vs_derivation (implicitly, Band L now derivation-dependent on 128 rows only)
          classification: A1 (consequence)
        - field: stages.stage_1.requirement and controls C2, C3, C4 ("through I_direct and I_indep"), now applied to each route (dual route A-DENSE+S-BERL)
          classification: >-
            A1-consequential, and in effect a TIGHTENING of the Stage-1
            requirement and the blocking fixtures (more agreements required).
            R-AMEND-SCOPE lists tightening only for invalidation rules,
            stopping rules and blind_from. This addition serves A1's own
            calibration requirement and the plan's "Stage-1 calibration
            exercises every route the census uses", and it touches no
            forbidden field, so it is not out of scope. But the amendment's
            self-description "No A2, no A3, no tightening" is inaccurate (O-7).
        - field: M4 slack null on S-BERL rows; M6 recorded per route
          classification: >-
            A1 (consequence). Not a definition change: M4 already says "slack (if
            I_indep exposes it)", and M6 and C2 to C4 already name I_direct and
            I_indep.
        - field: C5K-np33 route A-TWIST (listed under unchanged_derivation_A_rows)
          classification: >-
            A1 (should be listed as a change). Derivation (A) as H-QSP-cd0c90
            states it applies to lambda in F_2[X]; the twisted form is a
            different derivation (WO-I-5, provenance internal). It is
            correct on 123 synthetic cases checked here. Not out of scope,
            but misclassified (O-4).
        - field: preregistered_prediction, success_criterion, falsification_criterion, M1 to M9 definitions, certificate_semantics, candidate set, cells, seeds, claim_tier, field model, tolerances, stage order, Stage-0 mechanics, blind_from, stopping_rules, invalidation_rules
          classification: untouched (byte-identical specification; the amendment restates none of them)
      tq_2: not fired by this reading
      pre_data_assessment: >-
        Honest. It names POST-DATA as to the owner session, names the author's
        exposure to the archived validator report (paths and row counts, no N),
        and states that the route table depends only on (n, n', d) and declared
        model parameters. One addition is needed. After this review the line
        will be redrawn from rates measured on synthetic polynomials. Those are
        still not run values, but the amendment should say which engine and
        which measurements fix it.
    iv_consequence_statement:
      s1: >-
        Substantially honest. It says that M1 = 0 on the 2800 S-BERL rows is
        agreement of two algorithmically independent instruments that
        establishes the count there, that it is not a test of derivation (A),
        and that M1 and M2 on the 128 + 244 derivation-(A) rows remain such
        tests. Not overstated.
      pre_band_h_calibration: >-
        Substantially honest. It says the specification's sentence holds in a
        narrower sense: 372 rows at n = 131, none with Band-H composition
        depths q + 1 in {2, 3, 4}, and Band H's completeness still rests on
        derivation (A). Precision objection O-5: q + 1 = 4, the depth of
        n' = 33 and of the Band-H cell with the largest H, is exercised
        neither at toy n (Stage 1 has q + 1 in {2, 3}; C2, C3 and C4 have
        q + 1 = 3) nor at n = 131 against an exact reference. Only the
        synthetic cell syn-a-15-04 exercises it. The design's d4_calibration
        states this correctly; the amendment's sentence blurs it.
      r2_and_headline: >-
        Adequate, with one omission (O-6). The amendment binds "any later
        evidence record" to state that on 2800 Band-L rows the second
        instrument was S-BERL. It does not say how the frozen headline
        sentence of success_criterion is to be read: that sentence names
        H-QSP-cd0c90 and says "I_direct and I_indep agreed on Band L
        (n' = 3..14)". The A1 qualifier should be bound to that sentence
        explicitly, because it cannot be edited. This is a reading of the
        amendment's text only, not of the hypothesis's standing.
      p_bound_note: >-
        Context, not an objection. On every Band-L row B exceeds deg L =
        2^n' (by a factor of 2^1.85 to 2^120.5). P-bound and F1 can never fire
        on Band L under any route, so Band-L agreement says nothing about the
        bound itself. Only the bridge and Band H can test it. The amendment
        neither overstates nor needs to state this.
    v_ptm: see ptm_d2 and ptm_d3 below
    vi_d5_reading:
      own_reading_before_design: >-
        Written in v0 before the design was opened. C2 lies inside Stage 1 (cell
        (7, 3), lambda = X^2+X of degree 2). C3, C4, C6 and the C5 artifact
        arm must run before the Stage-4 freeze and COMPARE, and should run
        before Stage 2. A wrong fixture is STOP/F5, and after the freeze I_indep
        code paths may not be reopened. COMPARE opens the sealed integers, so a
        repair forced by a fixture failure found in Stage 5 could not be blind.
      design_reading: >-
        d5_ordering places stage5-controls (C2 to C6) third, after Stage 0 and
        Stage 1 and before every census trial. Band H depends on all twelve
        Band-L trials and the bridge, COMPARE depends on the three Band-H
        freezes, and the closing report comes last. Stop codes are mechanical
        (WO-R-9 exit codes, dependents wait).
      verdict: >-
        Holds. The order is the one the stopping rules require and agrees
        with my prior reading. Reading rather than A2 is defensible because no
        clause orders stage_5's control arms after the census. An A2 clause
        stating the same order would cost nothing and remove the reliance on
        reading, but it is not required.
      observation: >-
        The C5 F_2 "null" arm at d = 3 draws 100 lambda with replacement from
        only 8 polynomials, all of them Band-H census candidates. So at d = 3
        it is a resample of the census, not a null object distinct from it.
        This is specification-level, outside JD2's route core, and recorded
        for the composer only.
    i_indep_work_order_binding:
      ci_1: >-
        Holds in substance. WO-I-1 forbids reading implementation/*.py, any
        blind_from path and r1/runner, and imports nothing from them; AC-7 and
        AC-16 check this. Minor point: the design the I_indep author reads
        carries second-hand descriptions of the bound closure (line references
        and the A-L path), which is not a CI-1 breach. The I_indep card's
        read_scope is not fixed by the design; it should list the minimum read
        set (H-QSP-cd0c90, IDEA-20260916-3f7a1c, the specification, the
        amendment, the design's WO-I, interface, route_table and synthetic_cells).
      ci_3: holds (WO-I-3 literal table keyed by cell name and d, with no comparison operator or size arithmetic; AC-6 with a mutation)
      ci_4: holds (WO-I-7 finite attempt budget raising RootSearchFailure; WO-I-8 no swallowing except; AC-5 with fault injection)
      blind_from: holds (WO-I-1; AC-16 matches the read attestation against the ten entries)
      engine_restriction: >-
        WO-I-1's stdlib module list is the source of break (ii) in both
        directions (O-1, O-2). It binds the author more tightly than the
        specification, and the route table's feasibility rests on it without
        saying so.
    stage1_covers_census_routes: >-
      Holds. Every Stage-1 row runs A-DENSE and S-BERL, each compared exactly
      with I_direct, and C2 to C4 run both. A-TWIST is not a census route and
      is calibrated on synthetic cells only (disclosed by the design).
    s_berl_independence: >-
      Holds as an algorithm and as an authorship split. S-BERL is a Berlekamp
      Q - I kernel plus splitting gcds; it never forms X^(2^n) mod L, has a
      different author, and uses its own primitives. It is weak as an
      acceptance check (PTM-D3 below). Measured cost: F_2 Gaussian
      elimination at m = 2^13 took 4.85 s, extrapolating to about 27 to 39 s
      at m = 2^14, so S-BERL costs minutes per candidate. The substitute's own
      feasibility holds.

  ptm_d2:
    performed: true
    method: static application of the design's rule and table to the plan's objects; arithmetic only
    objects:
      - {cell: stage3-bridge-n22, d: 3, q: 5, r: 21, B: 729, design_route: A-DENSE, amendment_cites_infeasibility: false}
      - {cell: stage4-bandH-n66, d: 7, q: 1, r: 65, B: 49, design_route: A-DENSE, amendment_cites_infeasibility: false}
    result: >-
      Meets the failure signature: both cells are routed to derivation (A),
      and the amendment's changed_rows contains no bridge or Band-H cell.
      Under the rule (memory floor plus time horizon) these B values pass by
      more than ten orders of magnitude under model P and E alike.

  ptm_d3:
    performed: true
    method: >-
      The design is a design (no r1 code exists), so AC-7 was modelled from its
      text, in my own script on synthetic cells n in {17, 19} (rt_ptm_d3.py,
      rt_ptm_d3_refined.py). The modelled trace schema is WO-I-10's
      (function, modulus degree, modulus digest). The trace rule is AC-7's:
      no squaring of a residue modulo L or rad(L) (a chain of two or more
      fails), and S-BERL computes no gcd with X^(2^n) - X. Every route uses
      only the mock gf2x public functions, so the static rule passes them
      all. Routes: legitimate S-BERL; D3a, the literal PTM-D3 (squaring
      primitive modulo L); D3b, repeated squaring under generic function
      names (product of a residue with itself, then reduction modulo L); D3c,
      powers of S-BERL's own Frobenius matrix Q applied to X, then gcd with
      L. The bound closure's F-04 path A-L (i_indep.py lines 52-61, read
      statically, never executed) is the D3b shape: gp.square followed by
      gp.mod_pow2_x_plus_lam.
    result:
      D3a: rejected by literal AC-7 on 184/184 rows (returns I_direct's N on all)
      D3b: ADMITTED by literal AC-7 on 184/184 rows. It returns I_direct's N on all, and its event kinds are a subset of legitimate S-BERL's
      D3c: ADMITTED by literal AC-7 on 184/184 rows. It returns I_direct's N on all, and its event kinds are a subset of legitimate S-BERL's
      legitimate_S_BERL: passes literal AC-7 on 184/184 and returns I_direct's N on all
      text_rule: >-
        The amendment and WO-I-6 rule "S-BERL never forms X^(2^k) modulo L or
        rad(L) for k >= 2 by any means" is violated by legitimate S-BERL's own
        Q rows. Row i = X^(2i) mod rad(L) contains X^(2^k) mod rad(L) for
        k = 2 to n'. So the rule cannot be audited literally, and as written
        it does not separate S-BERL from D3c.
    failure_signature_met: >-
      NO at the acceptance-check layer. PTM-D3 in its "under a different
      function name" form (D3b) is not rejected by the design's independence
      check, and neither is D3c. The route definition intends to exclude both,
      but the only mechanical check does not, and the design names human code
      reading in round 2 as the backstop (AC-7 limit). The location of the
      survival is the trace schema: there is no operand provenance, so "squares
      a residue" is decidable only for a squaring-named primitive.
    repair_tested: >-
      With operand provenance in the trace, the audit adds three rules. R1: no
      sqrmod modulo L or rad L. R2: no product of two equal operands inside or
      followed by a reduction modulo L or rad L. R3: a reduced Q row may be an
      operand only of the add that forms the matching row of Q - I and of
      the next row's construction. No legitimate S-BERL row was flagged by R1
      or R2. The audit reports the first rule to fire: 169 of 184 legitimate
      rows passed all three rules, and 15 were first flagged by R3. R2 rejects
      D3b on 184/184 and R3 rejects D3c on 184/184. The 15 R3 flags are false
      positives from coincidental value equalities in the elimination, so R3
      must use object provenance tokens, not value digests. Separately, the
      text rule should read "k > n'", not "k >= 2".

  objections:
    - id: O-1
      severity: breaks_joint
      attack: (ii)
      statement: >-
        S-BERL is assigned on (12, 5) and (13, 5), 64 rows, where a dense
        derivation-(A) route is exhibited inside CI-5 and the 8 GiB ceiling,
        with group time within the design's own 30-day horizon: 10.8 days
        (numpy FFT) and 18.3 days (standard-library decimal), against the
        design's 121.98 days. The design invited this exhibit
        (route_table.exposure).
      evidence: computations.json rt_barrett.out, rt_decimal_mul.out, rt_bench_gcd*.out, rt_projection.out
      cheapest_fix: move both groups to A-DENSE in A1, routes.py and the plan after fixing the engine set (O-2); or record from the specification why the engine set excludes decimal and numpy
    - id: O-2
      severity: breaks_joint
      attack: (ii)
      statement: >-
        Under the engine WO-I-1's module list permits, derivation (A) is
        assigned to (11, 4) and (14, 5), 44 rows, whose measured-rate group
        times (47.5 and 50.3 days) exceed the design's horizon. Model E's
        product rate is 6.1 to 6.6 times faster than measured CPython
        multiplication. The design's trial projections for n' = 11 and 14
        understate claim-TTL needs about sixfold.
      evidence: computations.json rt_karatsuba.out, rt_projection.out
      cheapest_fix: admit decimal in WO-I-1 (every derivation-(A) group then at most 1.83 days), or move these groups to S-BERL and restate the horizon
    - id: O-3
      severity: breaks_joint
      attack: (v) PTM-D3
      statement: >-
        AC-7 as specified admits I_direct in two disguises (D3b, D3c), and the
        S-BERL independence text rule contradicts S-BERL's own Q construction.
      evidence: computations.json rt_ptm_d3.out, rt_ptm_d3_refined.out, rt_ptm_d3_diag.out
      cheapest_fix: >-
        Add operand provenance tokens to WO-I-10's trace. Add rules R1 to R3
        to AC-7, with D3b and D3c as named mutations that must fail. Restate
        the text rule as "no residue X^(2^k) modulo L or rad(L) with k > n', no
        application of any power Q^j (j >= 2) or of Q to a vector outside the
        formation of Q - I, no product of a residue with itself modulo L or
        rad(L), and no gcd of L or rad(L) with a polynomial other than a
        derivative or a kernel-basis polynomial".
    - id: O-4
      severity: revise (classification)
      statement: >-
        A-TWIST on C5K-np33 is listed among the "unchanged derivation A rows",
        but it is not derivation (A) as H-QSP-cd0c90 states it (F_2[X] lambda
        only). It is a route on a control cell where derivation (A) as stated
        does not apply, so it belongs in A1's changed rows with its source
        (WO-I-5) and its calibration (synthetic only). The derivation itself
        checks out on 123 synthetic cases.
      evidence: computations.json rt_twist.out
      cheapest_fix: move C5K-np33 into A1 changed_rows with reason "lambda not in F_2[X]"
    - id: O-5
      severity: precision
      statement: >-
        The amendment's calibration consequence says Band-H depths q + 1 in
        {2, 3, 4} are exercised at toy n (Stage 1, C2) and on synthetic cells.
        q + 1 = 4 (n' = 33) is exercised on no declared calibration cell
        against an exact reference.
      cheapest_fix: >-
        State it per depth, as the design's d4_calibration does. Consider
        making C6-np33 an exact reference (O-8), the only declared n = 131
        cell at q + 1 = 4 with an independent decision procedure.
    - id: O-6
      severity: precision
      statement: >-
        The consequence statement does not bind the A1 qualifier to the frozen
        success-criterion headline sentence, which names I_indep on Band L.
      cheapest_fix: add one sentence to consequence_for_reading_H_QSP_cd0c90_R2 naming that sentence
    - id: O-7
      severity: precision
      statement: >-
        The amendment says "no tightening", but the dual-route requirement on
        Stage 1 and C2 to C4 tightens those requirements (beneficially, within
        A1's purpose).
      cheapest_fix: describe it as an A1-consequential tightening of the calibration and fixture requirements
    - id: O-8
      severity: improvement (control power)
      statement: >-
        C6 is checked only as Proposition 2's complete-splitting dichotomy.
        For F_2-linearized L_f the exact count is N = 2^(deg gcd(f, T^n - 1)).
        That formula is recalled (standard), not retrieved, and was verified
        here on 2490 synthetic cases. It would make C6 an exact reference,
        and at n' = 33 the only exact n = 131 reference for A-DENSE at q + 1 = 4.
        Whether those four rows exercise degree-131 factors is not determined
        here (TQ-3).
      evidence: computations.json rt_linearized.out
      cheapest_fix: add the exact-count check to WO-R-12 and WO-R-9 (C6 must equal the formula), keeping Proposition 2's dichotomy
    - id: O-9
      severity: minor
      statement: The I_indep card's read_scope is not fixed by the design; its minimum read set should be listed so AC-16 has a reference.
      cheapest_fix: list it in WO-I-1

  required_controls:
    - >-
      Measured engine-rate table, before any WO-I code: per-squaring and
      classical-gcd seconds on random synthetic polynomials at B in {2^22,
      2^24, 5^10, 5^11, 6^10, 3^17} under RLIMIT_AS = 8 GiB, for the engine
      WO-I-1 will permit, with outputs verified exactly as rt_barrett.py
      does. The A1 line is redrawn from it.
    - >-
      AC-7 mutations D3b (product of a residue with itself, then reduction
      modulo L) and D3c (Frobenius-matrix powers from S-BERL's Q, then gcd with
      L) added beside PTM-D3/PTM-R5. Each must fail, and legitimate S-BERL must
      pass on the same synthetic cells.
    - C6 exact-count cross-check N = 2^(deg gcd(f, T^n - 1)) in addition to Proposition 2's dichotomy.

  counterexample_or_mutation: >-
    The cheapest discriminating mutation for the independence check is D3b:
    replace the squaring primitive in a PTM-D3 scratch copy by mul(r, r)
    followed by mod(., L). The literal AC-7 passes it on every synthetic row,
    and it returns I_direct's count exactly. For the route line, the cheapest
    discriminating measurement is one Barrett modular squaring at degree
    5^11: 50.4 s measured against model E's implied 2447.8 s (two 1223.9 s
    products).

  baseline_comparison: >-
    Not an ECDLP claim. No Pollard-rho, BSGS or index-calculus comparison
    applies to an instrument-route design, and none is asserted. The relevant
    baseline is I_direct, the assumption-free deg gcd(X^(2^131) - X, L) count.
    S-BERL is independent of it in algorithm. The (A)-derived structured
    route S is not (identity proved and checked on 2520 synthetic pairs).
    dominated_by: not applicable (no attack or cost-surface claim; checked
    that the design asserts none).

  heuristic_challenges:
    - >-
      HEUR-1 is not load-bearing for JD2. The only heuristic-adjacent point is
      that the C5 F_2 null arm at d = 3 is a resample of the 8 census
      candidates, so it cannot act as a null object distinct from the census
      there (specification-level; recorded for the composer).

  cost_model_challenges:
    - Model E's product rate is 6.1 to 6.6 times optimistic for CPython integers (measured 2^20 to 2^26 bits).
    - >-
      Models P and E omit engines inside CI-5 that are 12 to 49 times
      faster than model E at B = 5^11 (numpy FFT 50.4 s per squaring;
      stdlib decimal about 203 s per squaring; model E 2447.8 s).
    - >-
      The gcd term is modelled at 2^31 word-XORs per second (2^24: 1024 s).
      The measured classical gcd was 19.2 s at 2^20, 58.3 s at 2^21, 165.2 s
      at 2^22, 533.0 s at 2^23 and 1996.6 s at 2^24. The per-doubling ratio
      rises to 3.75, entering the quadratic regime, and the gcd is about 2 to
      5 times slower than the model at large B. It is the dominant per-candidate cost at the route boundary.
    - >-
      The model figures drive the plan's claim-TTL guidance (watchdog_seconds
      note) and are off by about six times for the derivation-(A) Band-L
      trials under the permitted engine.

  reduction_and_scope_challenges:
    - A-TWIST belongs in A1 (O-4); otherwise no scope inflation. The amendment touches no forbidden field.
    - >-
      No finding of this report supports K-new-record. Derivation (A) is
      trivially implementable on the bridge (B at most 117649) and on Band H
      (B at most 2401), and A1 is necessary on at least 2664 Band-L rows:
      1812 by the memory floor, which holds under any engine, and 852 by the
      measured classical-gcd cost, extrapolated quadratically.

  proof_architecture_challenges:
    - >-
      Observation-fiber attack on the independence certificate. Holding AC-7's
      trace kinds fixed, D3b and D3c are preimages on the wrong side of the
      independence conclusion. The missing separator is operand provenance
      (O-3).
    - >-
      Quantifier order. The route is fixed per (cell, d) by name before any
      count (CI-3), but the cost model behind it was chosen without
      measurement and then labelled optimistic. Measuring first is the fix
      (O-1, O-2).
    - >-
      Nearby-object attack on derivation (A) at Band L. Reducing H modulo L
      (route S) gives an instrument that agrees with I_direct everywhere and
      is I_direct. Agreement on Band L therefore certifies independence only
      if the instrument's path is not this collapse; the design's F-1 handles
      this correctly.

  narrowest_supported_statement: >-
    On the committed snapshot TASK-20261002-f0f7e0, the following hold. A1 is
    necessary: 1812 Band-L rows fail the design's memory floor, and 852 more
    exceed the 30-day horizon on the measured classical-gcd cost alone,
    extrapolated quadratically (see jd2.ii_cost_argument_tests). The
    amendment stays inside R-AMEND-SCOPE in kind, its POST-DATA statement is
    honest, and its S1 and calibration consequences are substantially honest
    (O-5, O-6 precision). S-BERL is algorithmically independent of I_direct
    as defined. The C1 calibration cells of derivation (A) are correctly
    named. D-5 is placed where the stopping rules require. PTM-D2 meets its
    signature. JD2 nonetheless breaks: the A1 route line rests on an
    unmeasured engine model that measurement contradicts in both directions
    (64 rows substituted where derivation (A) fits the horizon, 44 rows kept
    on derivation (A) that exceed it under the permitted engine), and the
    independence acceptance check admits I_direct in two disguises. Scope:
    measurements on random synthetic polynomials and synthetic cells on this
    host (Linux, CPython 3.11.15, numpy 2.4.6, 4 CPUs), extrapolated
    quadratically for the gcd; nothing was computed on a declared cell.

  next_concrete_action: >-
    One zero-run design revision task (fresh producer session) before any WO-I
    implementation. It fixes the I_indep product engine in WO-I-1 (admit the
    standard-library decimal module, or numpy with its version recorded),
    runs the required_controls engine-rate table on synthetic polynomials
    under RLIMIT_AS = 8 GiB, redraws A1's route line from those measured rates
    (expected (12, 5) and (13, 5) to A-DENSE; (14, 6) and (8, 3) decided by
    measurement), moves C5K-np33 into A1, and adds operand-provenance tracing
    with rules R1 to R3 and mutations D3b and D3c to AC-7.

  scope_limits:
    - JD2 only. No whole-design verdict and no composition key is proposed here.
    - >-
      Every timing is from this host with one process at a time, except where
      computations.json records concurrency (the gcd 2^20 to 2^22 run shared
      the machine with the first Barrett run; the 2^23 and 2^24 run shared
      it with lighter single-core scripts). The extrapolations are
      quadratic in B for the gcd and linear inside one FFT length for NP.
      decimal memory at B = 3^17 was not measured.
    - >-
      No statement here concerns any integer N_K(L) on a declared cell, any run
      of EXP-QSP-70b731 or EXP-QSP-33b442, H-QSP-cd0c90's standing or
      EV-QSP-a6aa4b.

