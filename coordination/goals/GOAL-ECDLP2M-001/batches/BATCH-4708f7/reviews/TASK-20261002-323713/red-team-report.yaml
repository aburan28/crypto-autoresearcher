  verdict:
    jd2: breaks
    summary: >-
      JD2 BREAKS at attack (ii) and at PTM-D3; it holds elsewhere. (1) The A1
      route line is drawn with an unmeasured engine rate (model E) under a
      self-imposed engine restriction (WO-I-1, standard library modules only,
      decimal not listed) that the specification does not require. Measured
      inside CI-5 and under RLIMIT_AS = 8 GiB, two engines put the substituted
      groups (12, 5) and (13, 5) (64 rows) at 10.8 days (numpy FFT) and
      18.3 days (standard-library decimal) per group. The design's own
      30-day horizon therefore admits derivation (A) there (design figure
      121.98 days), and the design's claim that its table is the same for
      every horizon from 8.29 to 121.98 days is false at measured rates.
      Conversely, the engine WO-I-1's module list does permit (CPython-int
      Karatsuba) runs 6.1 to 6.6 times slower than model E. It puts the
      derivation-(A) groups (11, 4) and (14, 5) (44 rows) at about 47 and 50
      days, beyond that horizon. The route line is wrong in one direction or
      the other, whichever engine set binds. (2) The design's independence
      acceptance check AC-7, as specified (trace records function, modulus
      degree and modulus digest, with no operand provenance), rejects the
      literal PTM-D3 object (a squaring primitive modulo L). It admits two
      I_direct-in-disguise variants on 184 of 184 synthetic rows each:
      repeated squaring written as a generic product of a residue with
      itself, and powers of S-BERL's own Frobenius matrix Q. Both return
      exactly I_direct's count. The textual rule meant to exclude them
      ("never forms X^(2^k) modulo L or rad(L) for k >= 2 by any means") is
      contradicted by S-BERL's own Q rows for k = 2 to n'. Everything else in
      JD2 holds. A1 is necessary (1812 Band-L rows fail even the design's
      memory floor, and 852 more exceed the horizon on the measured
      classical-gcd cost alone, extrapolated quadratically). The amendment stays inside R-AMEND-SCOPE in
      kind. Its POST-DATA statement and its S1 and calibration consequences
      are substantially honest. S-BERL is algorithmically independent of
      I_direct as defined. D-5 places C2 to C6 where the stopping rules
      require. PTM-D2 meets its failure signature. The repairs are local
      and zero-run (next_concrete_action).
    prior_comparison: >-
      The plan's prior put the most likely break at (iv), the consequence
      statement, then at the Band-L substitute's independence. The consequence
      statement is substantially honest (two precision objections, O-5 and
      O-6). The breaks found are at (ii), the cost line in both directions, which
      the prior did not predict, and at PTM-D3 through the acceptance check
      rather than through the substitute's definition.

