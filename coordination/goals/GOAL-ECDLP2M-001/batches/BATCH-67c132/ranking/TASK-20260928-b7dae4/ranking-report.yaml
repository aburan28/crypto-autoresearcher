arithmetic_checks:
  convention: |
    No program was run. Each item is either derived here step by step or is
    restated from the pre-compaction pass of this session, in which case it
    says so; a restated value is a value this session computed by hand
    earlier, not a value read from any run. Numbers in bits are log2.
  items:
    - id: A1
      what: pool count
      steps: |
        Open ids in the pasted output 38 + 13 + 9 + 1 + 1 + 2 = 64. Ranked ids
        among them 11 + 11 + 4 = 26. 64 - 26 = 38. By area 12 + 13 + 9 + 1 +
        1 + 2 = 38. Rows across the parts 8 + 8 + 8 + 5 + 3 + 3 + 3 = 38.
    - id: A2
      what: D1 column (rho over floor, bits)
      steps: |
        60.8090 - 56.4049 = 4.4041; 60.8090 - 48.44 = 12.37; 60.8090 - 42.85 =
        17.96; 60.8090 - 35.61 = 25.20 at m = 4, 5, 6, 8.
    - id: A3
      what: floors at N = 4r and the subgroup correction
      steps: |
        Floors 89.25 / 68.58 / 56.40 / 48.44 / 42.85 / 35.61 bits at m = 2, 3,
        4, 5, 6, 8 (CORR-20260928-4cb669). Subgroup base lowers each by
        4/(m + 1) bits, which is 1.33 / 1.00 / 0.80 / 0.67 / 0.57 / 0.44.
    - id: A4
      what: D2 and D3 columns and the 4b65e3 offset
      steps: |
        Validator J2 columns D2 5.726 / 13.959 / 19.766 / 27.370 and D3 11.01 /
        33.08 / 37.39 / 42.52 bits at m = 4, 5, 6, 8. log2 1.58 = 0.660. 33.08
        - 0.66 = 32.42 and 37.39 - 0.66 = 36.73, which match the 4b65e3 mu = 1
        values at m = 5 and 6 to the stated precision; at m = 8 a residual of
        0.34 bit remains after the 0.66 bit factor (restated).
    - id: A5
      what: cap locus B_cap = (m! 2^131)^(1/m) in bits
      steps: |
        log2 m! is 4.585 (24), 6.907 (120), 9.492 (720), 15.299 (40320), 44.250
        (16!). (4.585 + 131)/4 = 33.896; (6.907 + 131)/5 = 27.581; (9.492 +
        131)/6 = 23.415; (15.299 + 131)/8 = 18.287; (44.250 + 131)/16 = 10.953.
    - id: A6
      what: matched rho on ECC2K-130
      steps: |
        log2 pi = 1.6515, log2 131 = 7.0334, log2 r = 129.000 (#E = 4r with
        #E about 2^131). (1.6515 + 129.000 - 2 - 7.0334)/2 = 121.618/2 =
        60.809. The 20ba8f form sqrt(pi N_prime/2) with N_prime = r/262 gives
        (1.6515 + 129.000 - 8.0334 - 1)/2 = 60.809 as well, log2 262 = 8.0334.
    - id: A7
      what: 136bd3 k = 8 line
      steps: |
        Two internal slips, 24.22 where the record writes 24.7 and 67.5 where
        it writes 68.5 (restated; the record carries its own recompute clause).
    - id: A8
      what: 201e86 e
      steps: |
        Validator J3 gives (r - 1) mod 131 = 0, so r is 1 mod 131 and e =
        ord_131(r) = 1.
    - id: A9
      what: 201e86 f^3 crossover
      steps: |
        The f^3 ceiling sits 1.3 bit from the pinned D3 at the crossover
        (restated).
    - id: A10
      what: 3c6a19 B_LA window
      steps: |
        The m = 5 per-call figure of the record is 37.1 bits; pinned D3 at m =
        5 is 33.08; 37.1 - 33.08 = 4.0 bits above; the m = 4 window is empty
        (restated).
    - id: A11
      what: 178821 toy rho at n = 19
      steps: |
        r about 2^17 = 131072 with cofactor 4 and k = 19. pi 131072 / 76 =
        5418; sqrt 5418 = 73.6, about 74 iterations, matching the record.
    - id: A12
      what: b48c9d comparator
      steps: |
        sqrt(pi r/2) is (1.6515 + 129.000 - 1)/2 = 64.83 bits; minus (log2
        131)/2 = 3.52 gives 61.31; the convention sqrt(pi r/(4 x 131)) gives
        60.81; difference 0.50 bit. The Gamma_13 count of about 2^71 is
        restated.
    - id: A13
      what: 20ba8f Stage 0 column
      steps: |
        43.54 / 46.70 / 48.78 / 51.34 / 55.01 bits along its m column and the
        window g < 13.2 (restated from the formula of the record).
    - id: A14
      what: 136bd3 k = 16 stake
      steps: |
        47.6 and 55.6 bits at k = 16; closure 2^101 (restated).
    - id: A15
      what: 5c26f9 census ceilings
      steps: |
        6725 / 39201 on one cell and 51 / 299 on the other (restated).
    - id: A16
      what: cafcf1 vacuity
      steps: |
        The Weil bound for a Kloosterman sum over F_(2^131) is 2 x 2^(131/2) =
        2^66.5. A subspace of dimension l has 2^l points, so the bound exceeds
        the main term whenever l <= 66, and the stated support is vacuous
        there.
    - id: A17
      what: eee7e4 rho input
      steps: |
        Using 2^131 for r on a cofactor-4 curve overstates rho by (log2 4)/2 =
        1.0 bit.
    - id: A18
      what: 197ecf budget label and rebalance
      steps: |
        Its column is D2 (13.96 / 19.77 / 27.37) with D3 as the alternative;
        the symmetry rebalance adds +2.3 and +2.5 bits on its two lines
        (restated).
    - id: A19
      what: 89886c Macaulay sizes
      steps: |
        629 x 7176 and 11339 x 59536 (restated).
    - id: A20
      what: 9cc043 reference series
      steps: |
        D_reg = 10 with 31180 columns on the semi-regular reference series
        (restated).
    - id: A21
      what: 1db0e8 large-prime closure
      steps: |
        B = 2^118 gives sqrt(B) = 2^59.0; the closure total is about 2^124.0
        against rho 2^60.81, 63.2 bits above (restated).
    - id: A22
      what: dacb83 binomial
      steps: |
        C(140, 4) = 140 x 139 x 138 x 137 / 24. 140 x 139 = 19460; 19460 x 138
        = 2685480; 2685480 x 137 = 367910760; / 24 = 15329615. The record
        writes 15331915; ratio 1.00015, 0.0002 bit. M2a 2^41.2 restated.
    - id: A23
      what: 6f2601 valuation
      steps: |
        131 divides 2^130 - 1 (Fermat) and ord_131(2) = 130, so 131 divides
        Phi_130(2). 131 is not a Wieferich prime (the only ones known are 1093
        and 3511), so 131^2 does not divide 2^130 - 1. Hence
        v_131(Phi_130(2)) = 1.
    - id: A24
      what: b6cc43 ball sizes
      steps: |
        Reproduced in the pre-compaction pass; values as in the record
        (restated).
    - id: A25
      what: c98e92 RC-1 toy budget
      steps: |
        Toy rho 160 on RC-1; the per-target budget is negative there
        (restated).
    - id: A26
      what: d3c5a5 generic MITM
      steps: |
        B_cap^(m/2) at m = 4 is 2 x 33.896 = 67.79 bits; against D3 11.01 that
        is 56.8 bits over.
    - id: A27
      what: b11cb1 u-star table
      steps: |
        5, 5, 6, 7, 8, 12, 15 across its n column (restated).
    - id: A28
      what: beb5b6 toy rho
      steps: |
        The record states 2^7.7; the convention at the stated toy order gives
        2^6.20; the formula of the record itself gives 2^5.70 (restated).
    - id: A29
      what: beb5b6 zero-sum counts
      steps: |
        -64.0, -32.6, -1.6, +29.1 bits along its B column and 8.4 bits at B =
        2^35.5 (restated).
    - id: A30
      what: 3cc0b8 E2 ratios
      steps: |
        -8.06 and -6.60 bits on the two committed sizes; p_flip about 2^28
        (restated).
    - id: A31
