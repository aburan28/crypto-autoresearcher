conventions:
  rho: |
    CORR-20260922-81aeab, applied as the yardstick and never used to rewrite a
    proposal: group operations 0.886 sqrt(r)/sqrt(k) = sqrt(pi r/(4k)), k the
    order of the Frobenius class map on the prime-order subgroup (k = 1 on
    ordinary rows). On ECC2K-130 k = 131, r the 129-bit prime, rho = 2^60.8090
    (validator J3). Dividing by sqrt(2k) is 0.5 bit low; using 2^n for r on a
    cofactor-h curve is (log2 h)/2 bit high.
  budget_quantities: |
    CORR-20260928-4cb669 pin at m = 4 on ECC2K-130, N = 4r ambient unless the
    record states a subgroup-restricted base. D1 = floor-to-rho gap rho/floor =
    2^-4.41 (60.8090 - 56.4049 = 4.4041 bits), a total-cost headroom, not a
    per-attempt budget. D2 = producer per-target oracle budget at the
    floor-optimal l with LA ignored, rho/T = 2^+5.71 (validator 5.726; the
    column reads 13.959, 19.766, 27.370 bits at m = 5, 6, 8). D3 =
    re-optimised per-attempt budget with the one-attempt-per-relation cap and
    l free, 2^+11.01 at m = 4 (validator 33.08, 37.39, 42.52 at m = 5, 6, 8).
    A row pricing an m >= 4 design against D1 is flagged with the field
    quoted; the number is not corrected. Floors at N = 4r in bits: 89.25 /
    68.58 / 56.40 / 48.44 / 42.85 / 35.61 at m = 2, 3, 4, 5, 6, 8; a
    subgroup-restricted base lowers each by 4/(m+1) bits.
  result_class: judged against docs/target-result-profile.md C1
  reachability_cell_types: structurally_empty, computed_cost, open
  proof_search_map_audit_values: |
    present, not_applicable (with the reason of the proposal) or missing, for
    each of the four KN-TECH-080 audits. Every one of the 38 records carries a
    proof_search_map block with all four; none is missing.
  compute_class_values: |
    zero_compute_derivation, arithmetic_only_deployed, executable_toy_cell
    (n <= 41), out_of_scope. Missing instruments are named from the test of the
    record and from analysis/binstd-idea-review-20260926/README.md section 3
    (this container has no numpy and no SAT or Groebner binary; the
    EXP-CERTBIN-e94b27/impl modules import numpy). IDEA-20260915-3476de reports
    M2, Singular and msolve present on its own host on 2026-09-15; different
    host or date, reported not reconciled.
  R2: |
    DEC-20260924-4f8a03 R2 as extended by DEC-20260928-157d40 R-OWN. BINSTD owns
    the reachability table and structural-emptiness certificates; CERTBIN,
    NISTBIN, OAKLEY own measured decomposition cost on their families; SEMBIN,
    QSP, ICPERF, FROB, SDEG/DREG, RELN, SATIC keep their quantities. ICPERF rows
    route to GOAL-ICPERF-e6b6a4, FROB rows to GOAL-FROB-6333a9, SATIC rows to
    GOAL-SATIC-c49b77. CERTBIN and QSP rows are treated as designable under
    GOAL-ECDLP2M-001; if the Coordinator routes CERTBIN elsewhere the ranking is
    unchanged.
  knowledge_retrieval: |
    The search_knowledge / kb MCP tools were not in the tool surface of this
    session, so the derived index was not consulted; no claim below that an
