  departures:
    - id: DEP-1
      idea_ids: [IDEA-20260926-4b65e3, IDEA-20260926-136bd3]
      report_says: |
        ranked_top_three is 20ba8f, 4b65e3, 136bd3; the two selections would
        be the top two.
      official: |
        S1 is 20ba8f and S2 is 136bd3; 4b65e3 ranks third with its Stage 0
        travelling as a section of S1 and its Stages 1-2 queued as the next
        CERTBIN design unit (HOLD-X1).
      reason: |
        4b65e3's decision-changing deliverable, the column every m >= 4
        record prices against, is substantially discharged: CORR-20260928-4cb669
        pins D3 at m = 4 equal to its capped column and the validator D3
        column at m = 5, 6, 8 is on record; what remains at zero compute (the
        1.58-attempt factor and the 0.34-bit residual at m = 8, A4) fits in
        one section of the lane that consumes the column. Its Stages 1-2 are
        medium implementation with days of compute, need numpy and S_4/S_5
        builders that are missing, and may overlap two CERTBIN successor
        designs the report cites (DEC-20260926-901ea1 NA-2,
        DEC-20260926-cb4487 NA-2) that this session could not read; a design
        lane on them now would design around an unchecked overlap. 136bd3
        is disjoint from S1 (DX-07 against DX-01), needs nothing installed,
        has a first deliverable in minutes, is the round's only
        exponent-relevant lead branch per README section 4, and its expected
        outcome meets the closure standard with a measured obstruction and
        exact positive controls. Two lanes with a dependency between them
        would not be disjoint; these two are.
    - id: DEP-2
      idea_ids: [IDEA-20260926-20ba8f, IDEA-20260926-4b65e3]
      report_says: |
        Dedup map DX-01: survivor 4b65e3 as the carrier of one budget table;
        20ba8f keeps its own Stage 0 and is ranked first on its own.
      official: |
        20ba8f is the DX-01 survivor for the table column (BINSTD); 4b65e3
        is the survivor for the measured theta(m) ladder (CERTBIN). Both stay
        proposed; neither is edited.
      reason: |
        DEC-20260924-4f8a03 R2 gives the table and its columns to BINSTD and
        measured decomposition cost to CERTBIN. Splitting the survivor by
        owner puts each part of the shared object where R2 says it is filed,
        and lets the column be authored once, in the lane already selected.
    - id: DEP-3
      idea_ids: [IDEA-20260926-d3c5a5, IDEA-20260926-136bd3]
      report_says: merge_into 136bd3 as the exact-count oracle behind the control contract and the 89886c m = 3 arm.
      official: |
        d3c5a5 is not merged into S2. It is design_after with the DX-10 m = 3
        contract (HOLD-X9) as a CERTBIN instrument; its count row goes to the
        c98e92 unit (ICPERF) as the report says.
      reason: |
        R2: CERTBIN owns its instrument, and a CERTBIN m = 3 contract would
        otherwise have to cite an engine frozen inside a BINSTD contract by
        path. S2's H1 validation needs no MITM engine: the record specifies
        direct pair-sum counting at L = 2^8, which is exhaustive.
    - id: DEP-4
      idea_ids: [IDEA-20260926-20ba8f]
      report_says: design_now with Stage 2 routed to GOAL-ICPERF-e6b6a4 if designed.
      official: |
        Stage 2 on the binary n = 19 cells and the Z/NZ control is designed
        in the S1 lane as the heuristic validation of H1 and H2; the
        prime-field engine cells are excluded and pointed to
        GOAL-ICPERF-e6b6a4 (PTR-ICPERF), and an objection by bus is heard
        before the S1 contract is approved.
      reason: |
        agents/coordinator.md dispatch bias: a conditional result is
        dispatched only paired with a heuristic-validation experiment in the
        same or the following batch. The column is conditional on H1 and H2;
        their validation on binary cells is inside this goal's declared scope
        and is not a measured phase-cost row of the ICPERF boundary table. R2
        is honoured for the prime-field cells and for any phase-cost reading.
    - id: DEP-5
      idea_ids: [IDEA-20260926-20ba8f, IDEA-20260926-136bd3]
      report_says: |
        Tripwire items TW-01 and TW-02 name the field (claim.C, claim.A) and
        the tier needed before a decision cites it.
      official: |
        The S1 and S2 design rounds themselves run at review-breakthrough at
        max (validator-breakthrough, red-team-breakthrough, blind
        validator-breakthrough), and every later outcome reading named in
        the design conditions runs at that tier too.
      reason: |
        DEC-20260928-157d40 R-TIER and AGENTS.md rule 12 route the item, not
        only its outcomes, and forbid downgrading. DEC-20260924-99ce20 DEP-5
        set the precedent that a tripwire item's design round is its first
        review after the ranking batch and is therefore at that tier.
    - id: DEP-6
      idea_ids: [IDEA-20260926-201e86, IDEA-20260926-5c26f9, IDEA-20260926-6f2601, IDEA-20260926-917981, IDEA-20260926-bbf2ed, IDEA-20260926-cafcf1, IDEA-20260926-9c5694]
      report_says: |
        design_now for 201e86, 5c26f9, 6f2601, 917981, bbf2ed;
        certificate_first for cafcf1; design_after for 9c5694 with its
        propositions on the zero-compute certificate shortlist.
      official: |
        Queued for design with recorded holds HOLD-X2 to HOLD-X6, not
        designed in the NA-1 batch; 9c5694 and 917981 form one
        certificate-first note (HOLD-X5) with their arms design_after;
        cafcf1 is certificate-first under HOLD-X4.
      reason: |
        The card caps selection at two and focus discipline keeps two
        critical lanes active by default. Each hold has a revisit condition
        at or before the next selection point, so none is shelved. 9c5694 is
        moved up from design_after because its propositions are on the
        shortlist and are the stated counter-proposition to the routed
        197ecf; only the note is queued, its arms wait as the report says.
    - id: DEP-7
      idea_ids: [IDEA-20260926-1ddce2, IDEA-20260926-3cc0b8, IDEA-20260926-dacb83, IDEA-20260926-c98e92, IDEA-20260926-d1adfc, IDEA-20260915-69941f, IDEA-20260926-cafcf1, IDEA-20260926-beb5b6, IDEA-20260926-1db0e8, IDEA-20260926-bc1cab]
      report_says: |
        Report rows 25 to 30 (six ICPERF instrument rows) sit above rows 32
        to 36 (1db0e8, 80209d, beb5b6, cafcf1, bc1cab), which are this
        goal's.
      official: |
        Every row routed to another goal is ranked below every row designable
        on GOAL-ECDLP2M-001; the routed rows keep the report's relative order
        among themselves, with b11cb1 placed first among them because its
        Proposition C is on the certificate shortlist.
      reason: |
        A rank in this decision is a claim on this goal's slots; a routed
        row consumes none and is ranked for information only
        (DEC-20260928-157d40 R-OWN). The owners re-rank at their own
        selection points.
    - id: DEP-8
      idea_ids: [IDEA-20260922-29b1c5]
      report_says: |
        hold_rerank moves HOLD-E last and re-disposes nothing; the review
        disagreement is reported with the reason of the review.
      official: |
        HOLD-E is moved last and its kind is changed to return_for_revision,
        with the README section 3 finding quoted, a revisit condition, and
        an additive correction candidate named in NA-5; it joins the NA-3
        revision batch as a seventh item.
      reason: |
        TASK-20260928-cdf0a4 permits a kind change on a review that
        disagrees with a recorded hold, with the finding quoted and a revisit
        condition; a hold whose lemma the only review finds false as stated
        has no trigger that can fire, and queuing it for design would design
        around a defect the revision batch exists to repair. Not an adverse
        transition: the record stays proposed and no reading is weakened.

