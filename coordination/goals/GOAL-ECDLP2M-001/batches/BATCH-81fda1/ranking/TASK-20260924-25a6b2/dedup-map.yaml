dedup_map:
  task_id: TASK-20260924-25a6b2
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-81fda1
  produced_on: '2026-09-24'
  status: advisory
  scope_note: >-
    Advisory deduplication of the 36 open ECC proposals in the pool (BINSTD 30,
    NISTBIN 4, OAKLEY 2, CERTBIN 0) across RQ-BINSTD-b6f698, RQ-NISTBIN-06157b,
    RQ-OAKLEY-264353 and RQ-CERTBIN-836ce2. Cluster labels DC-01..DC-14 are local
    labels of this report only, not ledger identifiers; no identifier was minted.
    Every survivor or merge below is a RECOMMENDATION for DEC-20260924-99ce20. No
    proposal is closed, rejected, weakened or superseded by this file. Non-pool
    records named under linked_non_pool were read for deduplication only and are
    not ranked. Ownership follows DEC-20260924-4f8a03 R2 (BINSTD owns the
    reachability table and structural-emptiness certificates only; CERTBIN,
    NISTBIN and OAKLEY own measured decomposition cost on their own families;
    mechanism owners SEMBIN, QSP, ICPERF, FROB, SDEG/DREG, RELN).
  clusters:
    - cluster: DC-01
      name: matched-rho baseline and the rho symmetry ledger
      shared_object: >-
        The matched Pollard-rho column of the reachability table - the
        automorphism group rho may quotient by on each deployed row (negation
        times the curve's own Frobenius class of order k) and the resulting
        group-operation count under the corrected convention
        0.886 sqrt(r)/sqrt(k) of CORR-20260922-81aeab.
      members:
        - id: IDEA-20260922-1a081a
          question: RQ-BINSTD-b6f698
          role: survivor
        - id: IDEA-20260922-c07598
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-1a081a
      linked_pool_consumers: >-
        IDEA-20260922-6cf862 (H-6cf862-2), IDEA-20260922-261004 (H-261004-2),
        IDEA-20260922-d11575, IDEA-20260922-8278db, IDEA-20260922-1b16d7,
        IDEA-20260922-29b1c5, IDEA-20260922-40003d, IDEA-20260922-c48e7d,
        IDEA-20260922-7d6d43 all quote a rho baseline; the deviations are listed
        per row in ranking-report.yaml and are not corrected here.
      owner_under_R2: >-
        RQ-BINSTD-b6f698 (the baseline column is part of the reachability table).
      recommendation: >-
        Survivor IDEA-20260922-1a081a, whose 12-row baseline is consistent with
        the corrected convention. Merge IDEA-20260922-c07598's symmetry-ledger
        certificate (the "which automorphisms rho may use" argument) into it as a
        section, with c07598's sqrt(2k) formula replaced by the corrected
        convention at design time; c07598's own numbers are not carried forward.
    - cluster: DC-02
      name: reachability-table carrier, exchange rate and feasibility region
      shared_object: >-
        The reachability table as a machine-checked object with per-cell
        provenance, plus derived columns over it (gamma* exchange rate against
        rho; the (time, memory, width) feasibility surface; hybrid-portfolio
        preconditions).
      members:
        - id: IDEA-20260922-6028ed
          question: RQ-BINSTD-b6f698
          role: survivor
        - id: IDEA-20260922-818b73
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-6028ed
        - id: IDEA-20260922-2e2a58
          question: RQ-BINSTD-b6f698
          role: linked, design_after (not merged; owns the memory and width axes)
        - id: IDEA-20260922-793fd8
          question: RQ-BINSTD-b6f698
          role: linked, hold
      owner_under_R2: >-
        RQ-BINSTD-b6f698 for the table and its columns. Floor and per-attempt
        measurements feeding gamma* belong to QSP (quasi-subfield census) and
        ICPERF (phase instrument); 2e2a58's linear-algebra phase and 793fd8's
        attempt-cost tails belong to ICPERF.
      recommendation: >-
        Survivor IDEA-20260922-6028ed as the carrier. Merge IDEA-20260922-818b73's
        gamma* = 2^(60.9 - floor_bits) as a derived margin column of the carrier
        (unit caveat recorded in its row). Keep IDEA-20260922-2e2a58 separate but
        sequenced after 261004's effective-dimension fix, and hold
        IDEA-20260922-793fd8 on its own revisit condition.
    - cluster: DC-03
      name: Frobenius relation rank and linear-algebra accounting
      shared_object: >-
        The unit in which a Frobenius-stable factor base's relations are
        counted - raw rank k of the k conjugates versus rank 1 in the orbit
        quotient - and the resulting relation-yield and linear-algebra columns
        (the F_ell[Z/n]-module structure of the matrix, single eigen-block).
      members:
        - id: IDEA-20260922-261004
          question: RQ-BINSTD-b6f698
          role: survivor
        - id: IDEA-20260922-b19793
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-261004
        - id: IDEA-20260922-dacfc2
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-261004
        - id: IDEA-20260922-77bf31
          question: RQ-BINSTD-b6f698
          role: linked, design_now Stage 0 separately (descent column split)
        - id: IDEA-20260922-2e2a58
          question: RQ-BINSTD-b6f698
          role: linked (consumes the effective dimension B')
        - id: IDEA-20260922-6cf862
          question: RQ-BINSTD-b6f698
          role: linked (its part C orbit-quotient accounting)
        - id: IDEA-20260922-1a081a
          question: RQ-BINSTD-b6f698
          role: linked (its C3 granularity column)
      owner_under_R2: >-
        RQ-BINSTD-b6f698 owns the table column and the rank certificate. The
        relation-yield measurement is RELN's and the Frobenius decomposition
        mechanism is FROB's; 261004's Parts 2-3 need their concurrence before
        design.
      recommendation: >-
        Survivor IDEA-20260922-261004 after applying CORR-20260922-0d365e.
        Merge IDEA-20260922-b19793 (the eigenvalue of Frobenius on the prime-order
        subgroup satisfies lambda^n = 1 with n | ell - 1, so the multiplicative
        order e of ell mod n is 1 and the module splits into one eigen-block of
        size about |V|/n - the same n^2 linear-algebra gain 261004 derives) and
        IDEA-20260922-dacfc2 (its toy degrees n = 29, 37 host no nontrivial
        Frobenius-stable subspace; its memory-axis K/B question is the
        quotient-memory column of 261004).
    - cluster: DC-04
      name: E/2E trace-parity class map and the cofactor lever
      shared_object: >-
        The homomorphism pi(P) = Tr(x_P) + Tr(a) from E to E/2E (the only
        lossy group-homomorphism projection available on the 2-part of a
        standardized binary curve) and factor-base windows chosen by it.
      members:
        - id: IDEA-20260922-1b16d7
          question: RQ-BINSTD-b6f698
          role: survivor after revision
        - id: IDEA-20260922-153a90
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-1b16d7
        - id: IDEA-20260922-e3048d
          question: RQ-BINSTD-b6f698
          role: return_for_revision, then re-home the ECC2K-130 part to CERTBIN
        - id: IDEA-20260922-8ac1ea
          question: RQ-BINSTD-b6f698
          role: linked (its E3 trace-arm)
      linked_non_pool: >-
        IDEA-20260913-cedd2f, IDEA-20260915-3119c9, IDEA-20260806-c5d183,
        KN-FIND-ffe1df (Theorem C), IDEA-20260901-863e36 - read or cited for
        deduplication only.
      owner_under_R2: >-
        RQ-BINSTD-b6f698 for the structural-emptiness certificate (which arity
        parities are empty); per-attempt decomposition cost with the window is
        owned by the family owners (CERTBIN for ECC2K-130, NISTBIN for the FIPS
        curves).
      recommendation: >-
        Survivor IDEA-20260922-1b16d7 once its parity statement is corrected (this
        report's arithmetic check A9 finds the window empty at ODD arity, the
        record says even), its rho formula is quoted from the corrected
        convention, and c2pnb208w1's inclusion is justified. Merge
        IDEA-20260922-153a90's closure-standard sieve obstruction into it as the
        closure section. IDEA-20260922-e3048d is not mergeable as written (Z/4
        has a Z/2 quotient, which is exactly this cluster's E/2E map).
    - cluster: DC-05
      name: 2-torsion translation involution on a subspace factor base
      shared_object: >-
        The involution x(P + T) = sqrt(b)/x induced by the rational 2-torsion
        point T and whether it preserves an F_2-subspace factor base V.
      members:
        - id: IDEA-20260922-29b1c5
          question: RQ-BINSTD-b6f698
          role: survivor (the lemma)
        - id: IDEA-20260922-70a67c
          question: RQ-OAKLEY-264353
          role: cites the fact for the Oakley curves (keeps its own row in DC-13)
        - id: IDEA-20260922-af7396
          question: RQ-OAKLEY-264353
          role: cites the fact for the Oakley curves (keeps its own row in DC-13)
      linked_non_pool: IDEA-20260920-18dc28 (SATIC decision gates 29b1c5 Stages 2-4)
      owner_under_R2: >-
        RQ-BINSTD-b6f698 for the lemma as a structural-emptiness certificate;
        the Oakley instances are OAKLEY's.
      recommendation: >-
        Survivor IDEA-20260922-29b1c5 Stage 0-1 as a derivation note. The Oakley
        records keep their own rows and cite the lemma instead of re-deriving it.
    - cluster: DC-06
      name: Frobenius-stable subspace existence census at the FIPS Koblitz degrees
      shared_object: >-
        Monic divisors of T^m - 1 over F_2, equivalently the multiplicative order
        ord_m(2), at m in {163, 233, 283, 409, 571}, and the resulting
        existence or non-existence of Frobenius-stable factor-base subspaces at
        index-calculus-useful dimensions.
      members:
        - id: IDEA-20260922-c48e7d
          question: RQ-NISTBIN-06157b
          role: survivor
        - id: IDEA-20260922-40003d
          question: RQ-NISTBIN-06157b
          role: merge_into IDEA-20260922-c48e7d
        - id: IDEA-20260922-261004
          question: RQ-BINSTD-b6f698
          role: its limb (D) moves into c48e7d
        - id: IDEA-20260922-6cf862
          question: RQ-BINSTD-b6f698
          role: linked (its part C for F_{2^16}-rational bases on c2pnb rows)
      linked_non_pool: IDEA-20260918-9abf42
      owner_under_R2: >-
        Existence (structural emptiness) is a table certificate. For the FIPS
        Koblitz family the owning question of the certificate's measured
        consequences is RQ-NISTBIN-06157b; the arithmetic itself is BINSTD's
        certificate type.
      recommendation: >-
        Survivor IDEA-20260922-c48e7d (it already records supersedes
        IDEA-20260922-40003d). 40003d is still listed as open in the pool; that
        inconsistency is reported in ranking-report.yaml and not reconciled here.
    - cluster: DC-07
      name: Frobenius as a per-instance symmetry of the descended solver system
      shared_object: >-
        The claim that the absolute Frobenius x -> x^2 (or a Frobenius-stable
        subspace constraint) acts as a symmetry of ONE descended decomposition
        system, as opposed to an equivariance between conjugate targets.
      members:
        - id: IDEA-20260922-7ab503
          question: RQ-BINSTD-b6f698
          role: return_for_revision
        - id: IDEA-20260922-493606
          question: RQ-BINSTD-b6f698
          role: return_for_revision (chained on 7ab503)
        - id: IDEA-20260922-2a3771
          question: RQ-BINSTD-b6f698
          role: return_for_revision
      governing_prior_records: >-
        IDEA-20260906-a77711 (Frobenius is an equivariance R -> sigma(R) between
        conjugate targets), IDEA-20260920-b9f0c5, KN-FIND-47da4e.
      owner_under_R2: >-
        FROB (Frobenius decomposition mechanism). A pool member that re-measures
        it is flagged under R2.
      recommendation: >-
        No pool survivor. All three members are returned for revision against
        IDEA-20260906-a77711; any surviving content re-enters through FROB, not
        as new BINSTD work.
    - cluster: DC-08
      name: composite-degree c2pnb rows (k in 11, 13, 17, 19, 23 over F_{2^16})
      shared_object: >-
        The five composite-degree ANSI X9.62 curves E/F_{2^16} viewed over
        F_{2^{16k}} and every descent or decomposition cell on them (subfield
        rational base, GHS divisor lattice, trace-zero variety, null rows).
      members:
        - id: IDEA-20260922-6cf862
          question: RQ-BINSTD-b6f698
          role: survivor for the subfield-rational emptiness certificate (Part 1)
        - id: IDEA-20260922-d11575
          question: RQ-BINSTD-b6f698
          role: survivor for the GHS lattice (design_after)
        - id: IDEA-20260922-0e3641
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-d11575
        - id: IDEA-20260922-8278db
          question: RQ-BINSTD-b6f698
          role: separate OPEN cell (design_after)
        - id: IDEA-20260922-9e5383
          question: RQ-BINSTD-b6f698
          role: separate null-row ladder (design_after)
        - id: IDEA-20260922-c07598
          question: RQ-BINSTD-b6f698
          role: routed to DC-01
      owner_under_R2: >-
        RQ-BINSTD-b6f698 for the emptiness certificates and table cells; any
        measured decomposition cost at toy scale on the subfield family is
        FROB's or the family owner's.
      recommendation: >-
        Three distinct objects, not one: keep 6cf862 (subfield base, Part 1),
        d11575 (GHS lattice, absorbing 0e3641's counterfactual as a remark), and
        8278db (trace-zero variety) as separate rows; 9e5383 is the null-row
        control for all three.
    - cluster: DC-09
      name: reduction polynomial and F_2-basis as representation
      shared_object: >-
        The field representation (trinomial versus pentanomial reduction
        polynomial, Hamming weight, choice of F_2-basis) as a confound or lever
        on descended decomposition cost.
      members:
        - id: IDEA-20260922-cdca3a
          question: RQ-NISTBIN-06157b
          role: survivor
        - id: IDEA-20260922-f37254
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-cdca3a
        - id: IDEA-20260922-9d12bd
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-cdca3a
        - id: IDEA-20260922-99294c
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-cdca3a
        - id: IDEA-20260922-7ab503
          question: RQ-BINSTD-b6f698
          role: linked (its basis argument)
        - id: IDEA-20260922-2a3771
          question: RQ-BINSTD-b6f698
          role: linked (its H2)
      owner_under_R2: >-
        Measured decomposition cost on the FIPS family is NISTBIN's; the BINSTD
        members re-measure it and are flagged.
      recommendation: >-
        Survivor IDEA-20260922-cdca3a with one merged design using a
        basis-general descent generator, isomorphism transport between the two
        representations (f37254) as the fixed-order control, and prime-degree
        toy pairs only.
    - cluster: DC-10
      name: K versus B granularity at a shared field
      shared_object: >-
        Paired Koblitz and pseudorandom curves over the same field and
        reduction polynomial (K-163/B-163 and the other FIPS pairs) as a
        curve-granularity discriminator.
      members:
        - id: IDEA-20260922-1a081a
          question: RQ-BINSTD-b6f698
          role: indexing (its C1-C3 columns)
        - id: IDEA-20260922-8ac1ea
          question: RQ-BINSTD-b6f698
          role: survivor, re-homed to RQ-NISTBIN-06157b
        - id: IDEA-20260922-dacfc2
          question: RQ-BINSTD-b6f698
          role: routed to DC-03
        - id: IDEA-20260922-c48e7d
          question: RQ-NISTBIN-06157b
          role: linked (Saving A versus Saving B)
      owner_under_R2: >-
        Measured decomposition cost on the FIPS pairs is NISTBIN's.
      recommendation: >-
        Survivor IDEA-20260922-8ac1ea, re-homed to RQ-NISTBIN-06157b and sharing
        the basis-general descent generator with DC-09.
    - cluster: DC-11
      name: meet-in-the-middle decomposition of the point-decomposition step
      shared_object: >-
        Splitting the m-way factor-base subset-sum of one decomposition attempt
        into two halves joined by a collision, versus straight enumeration.
      members:
        - id: IDEA-20260922-845a77
          question: RQ-BINSTD-b6f698
          role: survivor (hold)
        - id: IDEA-20260922-faa8d2
          question: RQ-BINSTD-b6f698
          role: merge_into IDEA-20260922-845a77
      linked_non_pool: IDEA-20260904-96c4f3 (its part D frontier), IDEA-20260916-a17f43
      owner_under_R2: >-
        Per-attempt cost is the family owner's and QSP's where the cell is a
        quasi-subfield cell; the dominance derivation is a BINSTD certificate.
      recommendation: >-
        Survivor IDEA-20260922-845a77 on hold, with IDEA-20260922-faa8d2's
        dominance factor merged as its Stage 0.
    - cluster: DC-12
      name: Assumption 1 and the 571-bit index-calculus cell
      shared_object: >-
        The true solving degree of the m* = 12 descended summation system at
        n = 571 and the sensitivity of EXP-SEMBIN-992e73's 571 margin to it.
      members:
        - id: IDEA-20260922-7d6d43
          question: RQ-NISTBIN-06157b
          role: survivor
        - id: IDEA-20260922-1a081a
          question: RQ-BINSTD-b6f698
          role: consumer (its Semaev/Nagao column is conditional on the same assumptions)
      owner_under_R2: >-
        SEMBIN (chained S3 correctness; GOAL-SEMBIN-fcb7a2's Assumption-1 audit)
        and SDEG/DREG (solving degree). 7d6d43's Parts 1-2 are a zero-compute
        sensitivity surface over their numbers, not a re-measurement.
      recommendation: >-
        Survivor IDEA-20260922-7d6d43; Part 3 (any solving-degree measurement)
        is routed through GOAL-SEMBIN-fcb7a2 rather than designed as NISTBIN work.
    - cluster: DC-13
      name: Oakley n = 5 ladder
      shared_object: >-
        The tower family E/F_{2^{5p}} with subfield factor base F_{2^p} and the
        S_5-symmetrised S_6 Weil restriction, priced on the Groebner arm (K_5)
        and the SAT arm (q^4).
      members:
        - id: IDEA-20260922-70a67c
          question: RQ-OAKLEY-264353
          role: paired survivor (Groebner arm)
        - id: IDEA-20260922-af7396
          question: RQ-OAKLEY-264353
          role: paired survivor (SAT arm)
      owner_under_R2: RQ-OAKLEY-264353 (measured decomposition cost on its own family).
      recommendation: >-
        Complementary, not duplicate. Design as one paired experiment with a
        shared ladder generator and two solver arms.
    - cluster: DC-14
      name: singletons
      shared_object: none shared
      members:
        - id: IDEA-20260922-c2bbe6
          question: RQ-BINSTD-b6f698
          role: singleton, return_for_revision
          note: >-
            Nearest external prior art is the double-large-prime variation in
            KN-LIT-164 (GTTD); the relation-yield quantity is RELN's.
        - id: IDEA-20260922-6237e5
          question: RQ-BINSTD-b6f698
          role: singleton, hold
          note: >-
            Owner of any measurement is CERTBIN (ECC2K-130 family) and RELN.
      recommendation: >-
        No merge. Each carries its own disposition in ranking-report.yaml.
