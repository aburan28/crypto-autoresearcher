  conventions:
    rho: >-
      Corrected matched-rho convention of CORR-20260922-81aeab, applied as the
      yardstick and NOT used to rewrite any proposal. Group operations =
      0.886 sqrt(r)/sqrt(k) = sqrt(pi r/(4k)), where 0.886 = sqrt(pi/4) already
      contains the negation gain and k is the order of the curve's own Frobenius
      class map on the prime-order subgroup (k = 1 on pseudorandom rows).
      log2(0.886) = -0.175. Any formula that divides 0.886 sqrt(r) by sqrt(2k)
      double-counts negation by exactly 0.5 bit.
    result_class: judged against docs/target-result-profile.md C1 (exponent movement is the primary axis).
    reachability_cell_types: structurally_empty, computed_cost, open (as in RQ-BINSTD-b6f698 decision_target).
    proof_search_map_audit_values: >-
      present, not_applicable (with the proposal's reason) or missing, for each
      of the four KN-TECH-080 audits. All 36 records carry a proof_search_map
      with bottleneck, baseline_embedding, observation_collision,
      quantifier_order and method_ceiling (including a nearby_object_control),
      so no audit is missing; where an audit is present but its substance is
      defective the note says so.
    R2: >-
      DEC-20260924-4f8a03 R2. BINSTD owns the reachability table and
      structural-emptiness certificates only; CERTBIN, NISTBIN and OAKLEY own
      measured decomposition cost on their own families; mechanism owners are
      SEMBIN (chained S3 correctness), QSP (quasi-subfield census), ICPERF
      (phase instrument), FROB (Frobenius decomposition mechanism), SDEG/DREG
      (solving degree), RELN (relation yield). Re-measurement of another owner's
      quantity is flagged under r2_flag, not ranked as new work.

  arithmetic_checks:
    A1_convention: >-
      0.886 = sqrt(pi/4); plain rho without negation is sqrt(pi r/2) = 1.2533
      sqrt(r); dividing by sqrt(2) for negation gives sqrt(pi r/4) = 0.886
      sqrt(r). Dividing that again by sqrt(2k) instead of sqrt(k) subtracts a
      further 0.5 bit. log2 0.886 = log2 0.8862 = -0.1743, rounded -0.175.
    A2_K233: >-
      K-233 has cofactor 4 and a 232-bit prime subgroup, r about 2^231.
      Corrected, log2 = 231/2 - 0.175 - (1/2)log2 233 = 115.5 - 0.175 - 3.932 =
      111.39. IDEA-20260922-261004 writes r about 2^232 and divides by
      sqrt(466) = sqrt(2 x 233); 116 - 0.175 - 4.43 = 111.40. The two agree to
      0.01 bit only because the extra half-bit in r cancels the extra sqrt 2;
      CORR-20260922-0d365e records the 2^111.4 value as unchanged.
    A3_571: >-
      K-571 has cofactor 4, r about 2^569; B-571 has cofactor 2, r about 2^570.
      K-571 corrected = 284.5 - 0.175 - (1/2)log2 571 = 284.5 - 0.175 - 4.579
      = 279.75. B-571 corrected (k = 1) = 285.0 - 0.175 = 284.83.
      EXP-SEMBIN-992e73's 571 rho column as quoted by IDEA-20260922-7d6d43 and
      IDEA-20260922-c48e7d is 285.5 = 571/2, the naive 2^{n/2} with no
      constant, no negation and no Frobenius saving. With the quoted
      index-calculus cost 2^186.31, the margin is 186.31 - 279.75 = -93.44
      (K-571) and 186.31 - 284.83 = -98.52 (B-571), against the quoted -99.19.
      On 7d6d43's illustrative surface the log2 cost grows by roughly 12 bits
      per unit of solving degree near D = 16, so a 5.75-bit shift in the rho
      column moves D* by less than 0.5.
    A4_sqrt2k_rows: >-
      Rows computed with 0.886 sqrt(r)/sqrt(2k) are 0.5 bit LOW. Adding 0.5 bit
      to the published figures, d11575 and c07598 (r = 2^{s-0.5}) become
      2^78.4, 2^94.2, 2^126.0, 2^142.0, 2^173.8 and 6cf862's become 2^78.6,
      2^94.5, 2^126.3, 2^142.2, 2^174.1 on c2pnb176v1, c2pnb208w1, c2pnb272w1,
      c2pnb304w1, c2pnb368w1. The proposals' own figures are quoted, not
      corrected; these numbers only show the size of the deviation. Any
      index-calculus time advantage a record reports against its own rho row
      grows by 0.5 bit under the corrected convention (d11575's 0.9..12.3-bit
      range becomes 1.4..12.8), and 8278db's disclaimed naive margins of 27.8
      to 73.3 bits likewise move by 0.5 bit.
    A5_29b1c5: >-
      29b1c5 writes "about 0.886 sqrt(pi ell / 4)". 0.886 x sqrt(pi/4) =
      0.886 x 0.886 = 0.785, so the expression equals 0.785 sqrt(ell), 0.175 bit
      below the convention's 0.886 sqrt(ell). The constant is applied twice.
    A6_40003d: >-
      40003d's formula 2^(m/2 - (1/2)log2 m) evaluates to 81.5 - 3.67 = 77.83
      (m = 163), 116.5 - 3.93 = 112.57 (233), 141.5 - 4.07 = 137.43 (283),
      204.5 - 4.34 = 200.16 (409), 285.5 - 4.58 = 280.92 (571). The record
      writes ~2^75, 2^112, 2^137, 2^200, 2^282. So its own formula disagrees
      with its own 163 figure by 2.8 bits and with its 571 figure by 1.1 bits,
      and the formula itself omits the 0.886 constant and uses m/2 in place of
      (1/2)log2 r. Corrected K-163 (cofactor 2, r about 2^162) is
      81 - 0.175 - 3.67 = 77.16.
    A7_c48e7d: >-
      c48e7d writes K-571 ~ 2^{280.9} = 285.5 - 4.58. Corrected 279.75 (A3).
      Deviation 1.15 bit high, from using n/2 in place of (1/2)log2 r and
      omitting log2 0.886.
    A8_eigenblock: >-
      Frobenius tau acts on the prime-order subgroup G of a Koblitz curve by an
      eigenvalue lambda with lambda^n = 1 and lambda != 1, so n divides ell - 1
      and the multiplicative order e of ell modulo n is 1. The discrete-log
      vector of a Frobenius-stable factor base satisfies x_{tau P} = lambda x_P,
      so the unknowns lie in ONE lambda-eigenspace of dimension about |V|/n.
      This is the orbit-quotient basis of 261004 and gives the same n^2
      linear-algebra gain; b19793's module decomposition collapses to a single
      block and adds no second saving.
    A9_1b16d7_parity: >-
      With pi(P) = Tr(x_P) + Tr(a) the E/2E class map, a window V' chosen so
      every leg has pi = 1 gives, for an m-leg relation summing to a target in G
      (pi = 0 on G, since G has odd order), sum of m ones = m mod 2 = 0. So the
      relation set is empty exactly when m is ODD. The record's text states the
      emptiness at even arity. This is this report's derivation, to be checked
      in the revision, not a validated result.
    A10_toy_orders: >-
      ord_37(2) = 36 (37 = 5 mod 8 so 2 is a non-residue; 2^12 = 4096 = 26 mod 37,
      2^18 = -1 mod 37) and ord_29(2) = 28. Hence x^n - 1 = (x - 1) Phi_n with
      Phi_n irreducible over F_2 at n = 29 and 37, and there is no nontrivial
      Frobenius-stable F_2-subspace of F_{2^n} other than F_2 and its
      trace-zero complement.
    A11_K163: >-
      ord_163(2) = 162, so Phi_163 is irreducible over F_2 and K-163 has no
      Frobenius-stable subspace at any index-calculus-useful dimension.
    A12_toy_n_screen: >-
      ord_n(2) for toy n <= 41 prime: n = 17 gives 8, 19 gives 18, 23 gives 11,
      29 gives 28, 31 gives 5, 37 gives 36, 41 gives 20. Stable subspaces other
      than the trivial pair exist only when ord_n(2) < n - 1, i.e. at
      n in {17, 23, 31, 41}; n in {19, 29, 37} are screened out for any toy
      that needs one.
    A12b_FIPS_orders: >-
      ord_233(2) = 29 (233 divides 2^29 - 1), ord_283(2) = 94 (283 divides
      2^47 + 1), ord_409(2) = 204, ord_571(2) = 114 (571 divides 2^57 + 1), as
      the NISTBIN records state; checked by hand via the quadratic-character
      and factor arguments cited in each record.
    A13_c2bbe6: >-
      With S about N candidate partial relations and T trials, large-prime
      matches arrive at about T^2/(2S); to collect B full relations one needs
      T about sqrt(2 S B) = sqrt(N B) up to constants, which exceeds rho's
      sqrt(N) by a factor sqrt(B). The single-large-prime variant as written is
      dominated by rho; the double-large-prime form of KN-LIT-164 is the
      standard way the literature avoids this.
    A14_d11575_c4k: >-
      At GHS base field F_{2^c} with c = 4k (the order-4 subfield of F_{2^16}),
      d11575's q^{1.75} time with q = 2^{4k} is 2^{7k}; at k = 11 that is 2^77,
      against its own rho row 2^77.9 (2^78.4 corrected).
    A15_70a67c: >-
      At the 155-bit Oakley endpoint p = 31, the charged relation stage is
      2^{p + 5.9} x 2^{40} = 2^{76.9} against rho 2^{75.8}, a margin of about
      1.1 bit on the losing side, and the 2^{40} factor rests on a recalled
      sparse-FGLM Omega(D^2) floor.
    rounding_notes: >-
      70a67c and af7396 compute sqrt(pi r/4) with log2 r taken as the bit
      length (152, 183) rather than about bit length minus 0.5; the effect is
      at most 0.25 bit and is recorded, not counted as a convention deviation.

