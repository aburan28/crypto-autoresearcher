  departures:
    - id: DEP-1
      idea_ids: [IDEA-20260922-af7396, IDEA-20260922-70a67c, IDEA-20260922-1a081a, IDEA-20260922-c48e7d, IDEA-20260922-6cf862, IDEA-20260922-29b1c5, IDEA-20260922-6028ed, IDEA-20260922-77bf31]
      report_says: design_now
      official: >-
        Queued for design with a recorded hold (HOLD-A to HOLD-G); not designed in
        the NA-1 batch.
      reason: >-
        The card caps selection at one or two, and focus discipline keeps two
        critical lanes active by default. The order among the queued items follows
        dependency. 1a081a's C3 sign and c48e7d's census both depend on S2, and
        6028ed is seeded from 1a081a. Each hold has a revisit condition that fires
        at or before the next selection point, so none is shelved.
    - id: DEP-2
      idea_ids: [IDEA-20260922-af7396, IDEA-20260922-70a67c]
      report_says: both rank 3, paired
      official: af7396 rank 5 and 70a67c rank 6, still one paired design unit
      reason: >-
        Tie-break only. af7396 runs on the vendored WDSat and is not a tripwire
        item. 70a67c depends on an uninstalled Groebner engine (an impediment) and
        carries a closure claim routed to review-breakthrough (T3).
    - id: DEP-3
      idea_ids: [IDEA-20260922-261004, IDEA-20260922-c48e7d]
      report_says: >-
        Hand 261004's limb (D), the ord_n(2) census, to c48e7d as the DC-06
        survivor.
      official: >-
        The census is authored once in the S2 design as a structural certificate
        under RQ-BINSTD-b6f698. c48e7d stays the DC-06 survivor for its distinct
        content (the both-band IFF reading, the Saving-A/B separation, the
        membership degree) and cites the certificate.
      reason: >-
        DEC-20260924-4f8a03 R2 gives structural-emptiness certificates on these
        rows to BINSTD. The dedup map itself calls the arithmetic BINSTD's
        certificate type. The census numbers in the two records are identical, so
        authoring them once, in the lane already designed, avoids a duplicate
        certificate under two questions.
    - id: DEP-4
      idea_ids: [IDEA-20260922-261004]
      report_says: >-
        design_now with toys restricted to n in {17, 23, 31, 41}. Parts 2-3 are to
        be designed only with RELN and FROB concurrence, yet the first deliverable
        includes a toy check.
      official: >-
        Part 1 plus the per-conjugate-family rank readout of Part 2 (raw,
        orbit-quotient and ker-g-module ranks, orbit-length histograms, planted-rank
        and null controls) are designed. H-261004-1 (assembled-matrix rank growth)
        and Part 3 (pipeline cost) are excluded. The positive arm uses
        n in {17, 23, 31, 41}, and the forced-negative arm n in {19, 29, 37} is
        retained.
      reason: >-
        The per-family rank is the BINSTD certificate's own check. Assembled-matrix
        yield is RELN's quantity and pipeline cost is FROB's and RELN's (R2), which
        resolves the report's internal tension. The A12 screen excludes n = 19, 29
        and 37 as hosts of a stable subspace. That is exactly why the record uses
        them as the forced-negative arm, where Part 2 must find nothing. This
        session confirmed the orders (ord_n(2) = 8, 18, 11, 28, 5, 36, 20 at
        n = 17, 19, 23, 29, 31, 37, 41).
    - id: DEP-5
      idea_ids: [IDEA-20260922-7d6d43]
      report_says: Any outcome reading as E1 (or its opposite) goes to review-breakthrough.
      official: >-
        The S1 design round itself runs at review-breakthrough at max
        (validator-breakthrough, red-team-breakthrough, blind
        validator-breakthrough). Later outcome reviews also run at that tier.
      reason: >-
        DEC-20260924-4f8a03 R6 routes a tripwire item, not only its outcomes, to
        review-breakthrough in a later batch and forbids downgrading it. The design
        round is the first review of this item after BATCH-81fda1. Reviewing its
        hypothesis and frozen contract at a lower tier would be a downgrade.
    - id: DEP-6
      idea_ids: [IDEA-20260922-7d6d43]
      report_says: >-
        Correct the rho column in the design (not in the record), and route Part 3
        through GOAL-SEMBIN-fcb7a2.
      official: >-
        Concur, and add four conditions. (1) Apply the corrected column also to the
        283 proves-too-much control and to claim (A)'s count of cells below rho.
        (2) Read KN-FIND-936151, EV-SEMBIN-1ca3c8, H-SEMBIN-97ea23 and
        EXP-SEMBIN-992e73 at source, and check the GOAL-SEMBIN-fcb7a2 head for an
        existing or in-flight surface. (3) Recompute the proposal's session-computed
        margins and D* rather than cite them. (4) Freeze the D = 4 reconciliation as
        a regression fixture that must pass before approval.
      reason: >-
        The record says it did not read KN-FIND-936151 or H-SEMBIN-97ea23 directly.
        Its Part 1 figures have no archived artifact. With a lower rho row, the
        count of cells below rho can only fall, so claim (A) must be re-evaluated.
        KN-TECH-080 audit 1 requires a frozen fixture, not a planned one.
    - id: DEP-7
      idea_ids: [IDEA-20260922-8ac1ea]
      report_says: Re-home to RQ-NISTBIN-06157b under R2.
      official: >-
        The proposal record is not edited and keeps its question_id. When it is
        designed (HOLD-J), the design is filed under RQ-NISTBIN-06157b.
      reason: >-
        This decision edits no record and moves no status. R2's ownership is
        honoured where the work is filed, not by rewriting an immutable proposal.
    - id: DEP-8
      idea_ids: [IDEA-20260922-d11575, IDEA-20260922-cdca3a, IDEA-20260922-8ac1ea]
      report_says: >-
        Near misses behind the top three: cdca3a after the merged design, 8ac1ea
        after re-homing, d11575 after the MMT body is read.
      official: >-
        Ranked 16, 18 and 22, below the design-ready queued survivors (ranks 5-15).
      reason: >-
        Each near miss has an unmet prerequisite: a literature read at source,
        or a basis-general descent generator that must first be implemented. The
        queued certificates and the Oakley pair are design-ready now. Ranking by
        readiness keeps the next selection point from choosing an item that cannot
        yet be designed.
    - id: DEP-9
      idea_ids: []
      report_says: >-
        contradiction_of_validated_evidence is None found, and no pool record
        contradicts a validated evidence record the report read.
      official: >-
        Recorded as no contradiction identified, NOT as a clearance. No tripwire
        item is added.
      reason: >-
        The report did not re-read several of the validated records concerned
        (KN-FIND-936151, H-SEMBIN-97ea23, the IDEA-20260906-a77711 body), and
        neither did this session. An absence of findings on an unread source is
        not evidence of absence.

  concurrences: >-
    Every other report recommendation is adopted unchanged. That covers the DC-01
    to DC-14 cluster survivors and consolidations (with DEP-3's census note), the
    five tripwire items T1 to T5, the six return_for_revision dispositions and
    their stated defects, the three holds with their revisit conditions, and the
    design_after prerequisites. This session checked the report's findings on
    40003d's status, the absence of IDEA-20260922-684291 and -2caba8 from
    ledger/proposals, the missing correction record for 1b16d7, the A9 parity
    inconsistency, and the corrected 571 rho figures; all five were confirmed.

