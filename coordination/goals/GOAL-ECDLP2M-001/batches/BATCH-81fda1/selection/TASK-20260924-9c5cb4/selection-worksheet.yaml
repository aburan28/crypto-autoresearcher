        2^285.5 rho, reconciliation to 186.31 at D = 4 not done). The design card
        supplies it first as a frozen regression fixture (DEC S1 conditions C1-C2).
      review_tier_of_design_round: review-breakthrough at max (tripwire T1)
    - label: S2
      idea_id: IDEA-20260922-261004
      question_id: RQ-BINSTD-b6f698
      absorbs: [IDEA-20260922-b19793, IDEA-20260922-dacfc2]
      scope: >-
        Part 1 (ord_n(2) census and k | r - 1 at eleven deployed rows) plus the
        per-conjugate-family rank readout of Part 2. H-261004-1 and Part 3 are
        excluded pending RELN and FROB concurrence.
      decision_it_changes: >-
        Whether every Frobenius-row relation-yield column is recorded in the
        per-orbit unit (one relation per solve, not k). That moves Koblitz and
        subfield margins by log2 k bits against the attacker, and fixes which rows
        admit the Frobenius accounting at all.
      proof_search_map_status: >-
        All four audits present with substance. The rho-convention deviation is
        covered by CORR-20260922-0d365e and corrected in the design.
      review_tier_of_design_round: review-adversarial at xhigh

