  rationale:
    - >-
      Keys applied as frozen. J1, J2, J4 and J6 break on pre-declared
      breaking artifacts. Approval is unavailable. The parts that hold,
      including the fixture and the blind comparison on Q1 and Q2, do not
      repair a broken joint.
    - >-
      Defects, each with its joint and breaking artifact. D-1 residual (J1):
      a Stage-0 check that cannot detect an omitted row. The owner's deletion
      test reports that a list-keyed check detects none of the fifteen
      single-row deletions. The row inventory itself, D-2 and D-9 are
      reported as holding and are not this break.
    - >-
      D-3 (J2, BA-J2-1): the macaulay4 and f4_std time figures at 571, and
      the block-size comparison figure, stand without the Macaulay-matrix
      memory figure at the locations the owner names, including four places
      version 2 adds. D-3 (J2, BA-J2-2): MI-1's disclosed consequence has no
      memory figure beside it at its four places. Record form (J2, BA-J2-3):
      under the version_2 block's own carry-forward rule, v1's review plan,
      design audit, batch and producer task carry forward and disagree with
      version 2, and proof_search_map.note is restated without being named
      in superseded_fields. P-T is added without the declaration the other
      additions have. Approval fields are reported present. That clause of
      K-revise-defect does not add a further defect.
    - >-
      D-5 (J4, BA-J4-1): H1-L is not discharged. The lower-edge note says the
      lower reading bounds no solving cost, while the formal statement and
      the falsification condition still treat it as a bound. D-4 (J4,
      BA-J4-2): under the restriction branch, the one-direction sentences for
      M7 drop the audit's condition, and the owner's constructed reading
      moves the threshold the other way for crossings at or above degree 19
      while staying inside the two named readings. The other D-5 sub-items
      are reported discharged. Thresholds are reported as a table over m.
    - >-
      D-8 (J6, BA-J6-1): K4's revisit sub-condition (i) is reported as
      certain in every run, so the deprioritisation does not stay in force.
      See R-J6-READING. The other D-8 items the owner checked are reported
      discharged. Forbidden-word search did not fire TA-1.
    - >-
      What holds and is not a defect of this decision. J3, the fixture at
      both frozen targets, D-7's numbered choice, and D-10's statement. J5,
      including the omega gate and the G4 degree rule. J7, no What-holds
      regression found by its owner. J8, no breaking unowned item. Every
      proves-too-much control. J9's agreement on the printed Q1 rows and on
      Q2 under MI-1. None of these is a result about any curve.
    - >-
      Target profile. Nothing here moves an exponent, and nothing is
      promoted toward supported. The contract remains an unapproved
      zero-solver design. The breaks are about disclosure and about whether
      the stated model interface matches its own sentences.

