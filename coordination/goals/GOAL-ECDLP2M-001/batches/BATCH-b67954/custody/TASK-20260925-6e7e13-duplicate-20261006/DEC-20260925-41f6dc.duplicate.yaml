  rulings:
    - id: R-JOINTS
      subject: per-joint composition
      ruling: >-
        J1 BREAKS. J2 BREAKS. J3 HOLDS, and the fixture passes as frozen. J4
        BREAKS. J5 HOLDS. J6 BREAKS. J7 HOLDS. J8 HOLDS, with no breaking
        unowned item. Every proves-too-much object keeps its known-false
        conclusion out of reach. J9's comparison agrees on Q1 and on Q2 under
        the numbered reading. Every joint is owned and attested. None is
        unowned or shared. No reviewer vote on the whole contract is used.
        Each break is a protocol, disclosure, or model-interface defect in
        the design documents. None is a mathematical result about a cost, a
        curve, or any cell.
    - id: R-J9
      subject: CA-3, J9 against v2, value by value, before the keys
      ruling: >-
        Q1, tolerance 0.01 bit, exact on k. v2 prints K-571 279.7471, B-571
        284.8257, ECC2-79 38.8257, ECC2-89 43.8257, ECC2-353 176.2018 (k = 1)
        and ECC2K-358 174.5818 (k = 359). J9's eight-decimal values differ
        from those prints by at most 4.9e-5 bit, and k matches on each printed
        row. K-283 and B-283 are not reprinted as four-decimal figures in the
        v2 files this session searched. J9's values 136.25341894 (k 283,
        bit length 281) and 140.82574806 (k 1, bit length 282) differ from the
        carried figures in DEC-20260924-124667 R-J5 (136.2534 and 140.8257,
        same k and bit lengths) by less than 0.01 bit. J1's recomputation of
        the four added Certicom rows agrees with J9 within 0.01 bit under the
        same reading. Q2, under MI-1 (unceiled k), tolerance 5.0e-4 bit, exact
        on m. At 571, J9 gives 186.306952 at m = 12 against the frozen target
        186.307 at m = 12, difference 4.8e-5 bit. At 283, J9 gives 147.649476
        at m = 9 against 147.649 at m = 9, difference 4.76e-4 bit. Both are
        inside tolerance, and J3's same-reading recomputation agrees with J9.
        The ceiled reading differs by about 11.169 bits at 571 and moves m
        from 12 to 15. v2 declares that reading as MI-1 and discloses that
        consequence. The gap between the two declared readings does not fire
        K-indeterminate. v2 freezes no 359 stage-1 target, so J9's 359 Q2
        values are not a frozen-value comparison. Q3, v2 frozen_values is
        NONE, so there is no frozen integer or real threshold to compare.
        J9's table is a record. The lower-edge difference J9 reports between
        its degree rule and the contract's rule is the split v2's
        correspondence note already discloses. It does not fire
        K-indeterminate. K-fixture does not fire.
    - id: R-J6-READING
      subject: whether S-10 is undischarged
      ruling: >-
        J6 breaks on BA-J6-1. The owner states that if S-10 required only that
        some condition exist, the item would be discharged in form. That
        reading is not adopted. D-8 asked for a revisit condition on a
        deprioritisation, and the plan's breaking artifact is any D-8 item
        undischarged. A sub-condition the owner reports as certain in every
        run does not leave a deprioritisation in place. Adopting the softer
        reading after the report would relax that artifact without a protocol
        amendment. The break errs toward reopening, as the owner states, and
        it is still a break.
    - id: R-GATE
      subject: CA-4 composer_check of the pre-review gate
      ruling: >-
        whitelist-grep-v2.yaml, blind-inputs-amendment-01.yaml and the
        TASK-20260925-792b02 receipt are present. The receipt binds
        content_at_commit and records the two gate-file digests. J9's
        amendment digest matches the receipt. Thirteen hits are classified,
        eleven as identifier false positives and two as coincidental, with
        zero primary-datum hits, zero answer hits, and an empty disclosed-leak
        list. The Q3 m-set and omega-set are pinned, and the degree-extension
        statement is present and says v2 freezes no threshold value. No
        retained answer hit was found. K-leak does not fire. No misclassified
        hit was found by this session, and no review is re-run.
    - id: R-KEYS
      subject: composition keys applied as written
      ruling: >-
        K-revise-defect fires. K-approve does not, because J1, J2, J4 and J6
        break. K-fixture does not fire. K-indeterminate does not fire.
        K-leak does not fire. K-duplicate does not fire. K-impediment does
        not fire. K-infra does not fire. J9's attestation says inconclusive
        because that card is forbidden to compare. The joint was completed.
        That attestation is not an infrastructure failure. No tripwire fired.
    - id: R-HOLDS
      subject: CA-9, HOLD-F, HOLD-G, X-KOBLITZ, X-CERTBIN
      ruling: >-
        The HOLD-F and HOLD-G row-set condition of DEC-20260924-124667 R-NA7
        is carried unchanged. v2's own Certicom list now follows Appendix A
        for this contract, which does not retire the condition on HOLD-F's
        future row set or on HOLD-G's column split. X-KOBLITZ is not applied
        as fired. X-CERTBIN is not applied as fired. The two approved CERTBIN
        specifications were searched for the four Certicom curves D-1 adds,
        and neither specification names them. No disagreement is recorded.
        This decision carries no lane-B hold.
    - id: R-PRIOR
      subject: CA-6, prior against outcome
      ruling: >-
        The plan's prior expected revision, most likely on J4, then J6, then
        J2, with probability about 0.3 of approval. The outcome is revision,
        and J4, J6 and J2 do break. J1 also breaks, on the Stage-0 mode the
        prior named as its failure mode, which the prior had rated as a hold.
        J3, J5, J7 and J8 hold, as the prior thought more likely than not.
        J9 agrees on Q1 and Q2. Q3 was not a frozen-value test.
    - id: R-TRIPWIRES
      subject: CA-5
      ruling: >-
        TA-1, TA-2, TA-3, TA-4 and TA-5 are not fired on the reports. TA-5's
        path-outside-scope clause is taken from the snapshot receipt's
        snapshot_checks, which report no scope finding. The validator did not
        re-check that clause with git.

