  proves_too_much:
    result_convention: >-
      met means the failure_signature's correct-protocol clause for the object
      holds under the rules as written. not met means it does not.
      proved_too_much is stated separately, and is yes only if the rule set
      reaches the object's known-false conclusion. This follows
      DEC-20260924-286589, where "every PTM signature met" is the approval
      condition and "PTM-A fails on the ker-g column" is a failure. Every PTM
      entry below was written by the 2026-10-06 continuation; all six were
      pending before it. One earlier computation bears on PTM-F: the
      2026-09-26 continuation's C-PTM-F+C-J3-M3-REFUTE, a certificate-form
      check. PTM-F was redone from scratch and compared with it there.
    PTM-A:
      result: NOT MET as written; MET under either one-line repair of IR-7
      proved_too_much: 'no'
      computations: computations.json C-PTM-A (the reading), C-J4-RC4 (the build, made from scratch in this session as the PTM-A object)
      object: >-
        E_b over F_(2^17), b drawn by seed from F_(2^17) minus F_2 and admitted
        with no redraw (r = 193), first stable W = ker f1(tau), dim 8, |F_W| =
        256; 81 admitted relations (RS-1 17, RS-3 64).
      clause_readings: >-
        (1) Identical raw and quotient ranks: holds. Raw class = raw point =
        quotient = 1 = EVAL on 81 of 81, under RANK-A and RANK-B. (2) The stated
        ker-g expectation: holds. rank_kerg is not formed (IR-5 V2 extension,
        IR-19). The rule has power: a rule-deleted mutant gets deg h_g = 0 for
        all four designed divisors and reports a basis difference on 81 of 81.
        (3) No Frobenius effect: holds. d_min = 17 and k = 1, no conjugate row
        is formed, and every orbit has length 1 under tau_q. L6 holds: tau(P)
        lies on E_(b^2), not on E_b, for 256 of 256 F_W points.
      why_not_met: >-
        IR-7 ("any point orbit of a factor-base point of length other than n")
        fires on this correct build. Under the 2-power-map reading of L6 the
        class clause fires instead. The run is then invalid, and SR-6 stops it,
        so the correct readout is unreachable. IR-7's own justification, L2,
        gives point orbits of exactly k = 1 element. Nothing false is reported:
        this is over-strictness, not proving too much. It is not a D5 defect;
        D5's ker-g exclusion holds and has power. IR-7 is silent only if n is
        read as k with tau = tau_q, or if it is read as checked only at P2-1
        ("Per admitted (n, a)"), which excludes E_b. The text says neither.
        Objection RT-O-1.
    PTM-B:
      result: MET
      proved_too_much: 'no'
      computations: computations.json C-PTM-B (ptmb.py, new in this session)
      object: >-
        At n = 17 on both curves: W' a seeded random 8-dimensional F_2
        subspace, size-matched to the first stable W = ker f1(tau). Both
        accepted on the first draw, with C(W') = {0} and not tau-stable.
        |F_W'| = 248 at (17, 0) and 266 at (17, 1). Relations come from RS-1
        (32 targets, m = 2) and RS-3 (64, m = 2) over F_W': 67 admitted at
        (17, 0) and 72 at (17, 1).
      reading: >-
        CTL-NONSTABLE as written tests every tau^j(leg) for membership in F_W'.
        Every family leaves the base: 67 of 67 and 72 of 72, and no conjugate
        row lies wholly in F_W'. So zero families are admitted and no rank is
        reported for them; IR-6 is silent and SR-6 does not fire. The test has
        power and it is the only guard. Under R-piG (CERT-BIND on pi_G(R)),
        every certificate passes on every row of every family: tau is a group
        endomorphism and pi_G commutes with it, so the certificates cannot
        separate W' from a stable W. With the membership test deleted, v2's
        stable pipeline ranks every family at EVAL: raw class rank 17 = k (61
        and 72) or 16 (6, same-orbit pairs), quotient rank 1. That is the
        known-false "rank k on W'". At (17, 0) the classes of F_W' cover 78 of
        the 119 G-classes, but no class has its whole tau-orbit among them, so
        no class-basis degeneracy rescues the conjugate rows.
      side_note: >-
        If P2-2b's certificates are applied to these relations ("Per admitted
        relation"), the literal CERT-BIND fires IR-17 on every RS-3 family whose
        target lies outside G (59 of 63 at (17, 0), 35 of 64 at (17, 1)). That
        is J3's B1 reaching this control. The CTL-NONSTABLE text does not say
        whether P2-2b applies to it.
    PTM-C:
      result: MET
      proved_too_much: 'no'
      computations: computations.json C-PTM-C (ptmc.py, new in this session)
      reading: >-
        At n = 19, 29 and 37, ord_n(2) = n - 1 by both of P1-1's routes. Phi_n is
        irreducible by two independent tests, so the monic divisors of X^n - 1
        have degrees 0, 1, n - 1 and n. The usable set (2 <= deg g <= n - 2) is
