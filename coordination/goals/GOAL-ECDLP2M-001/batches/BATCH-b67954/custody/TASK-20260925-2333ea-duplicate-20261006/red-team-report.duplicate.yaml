        "For each positive n" and is not applied here. Applied anyway, E1-a to
        E1-d and [r]P0 = O hold at all six (n, a). So E1' alone does not
        separate a forced-negative degree; the empty usable set does. E1'
        admits no measurable cell there, because no usable stable W exists.
