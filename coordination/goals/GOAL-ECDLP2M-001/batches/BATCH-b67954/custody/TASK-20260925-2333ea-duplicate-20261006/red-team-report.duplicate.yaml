  heuristic_challenges:
    - id: HC-1
      subject: whether any heuristic carries J3, J4 or PTM-A to PTM-F
      challenge: >-
        None does. The certificate rules (CERT-LABEL, CERT-QUOT, CERT-BIND), the
        invalidation rules (IR-7, IR-15 to IR-18) and AR-2 are exact checks, and
        L1 to L5 are stated as proved lemmas. Both J3 breaks are binding gaps
        (which vector a rule reads, and which point it is applied to), not
        departures from a random model. Nothing in these joints is challenged as
        a heuristic; the findings are RT-O-4 and RT-O-5.
      evidence: computations.json C-J3-CELLS, C-PTM-F
    - id: HC-2
      subject: the norm argument behind PTM-E
      challenge: >-
        Exact, not heuristic. If lambda is a root mod a prime p of the Frobenius
        polynomial X^2 - tX + 2 with lambda^n = 1, then p divides #E_a(F_(2^n)):
        #E_a = N(1 - tau^n), and the kernel of the map Z[tau] -> F_p sending tau
        to lambda is a prime above p that contains 1 - tau^n. So AR-2's order
        clause implicitly checks that each prime it is evaluated at divides
        #E_a, and checks nothing about primality. Evaluated mod a composite r'
        whose prime factors all divide #E_a, the clause form admits it (E-iii).
        P2-E1's "r prime" is therefore an assumption the text does not certify
        at computed cells (RT-O-3); it is not a heuristic with a falsification
        condition.
      evidence: computations.json C-PTM-E (ptme.py and ptme_supp.py)
    - id: HC-3
      subject: transfer of the B2 rate at (17, 0)
      challenge: >-
        The statement that RS-2 reaches an m = 3 vanishing leg-triple with
        probability about 1 at (17, 0) is an exact enumeration over that cell's
        relation source, not a random-model estimate, and it is not carried to
        any other cell here. B2 does not depend on it: at (17, 1) and (23, 0)
        M3 reaches O-SUPPORT-consistent with no vanishing triple involved. Only
        the outcome label B2 reaches is cell-dependent.
      evidence: computations.json C-J3-M3-RS2, C-J3-CELLS
    - id: HC-4
      subject: an implicit, unnumbered accounting assumption in F1
      challenge: >-
        The carried predicted_gain (hypothesis lines 176-181) rests on an
        accounting whose source record is not named. It is not numbered among
        the hypothesis's heuristics and has no falsification condition. Under
        this role's heuristic inventory an implicit assumption is an objection;
        it is filed under J4 as RT-O-8 rather than here.
      evidence: computations.json C-J4 (v_quotes item 1)
  cost_model_challenges:
    - id: CM-0
      subject: scope of this section
      challenge: >-
        The contract states no cost, and this review computes none; the carried
        C2 field itself says the contract computes no index-calculus-to-rho gap
        (spec lines 869-871). The entries below are terms that a cost reading of
        F1 (hypothesis lines 176-181, RT-O-8) or of the carried C2 convention
        (spec lines 864-884, quoted in computations.json C-J4 v_quotes and not
        re-quoted here) would leave uncharged. Each can only add cost to the
        accounting it is missing from. None is evaluated here, and none is a
        finding about any curve.
    - id: CM-1
      subject: finding relations, not verifying them
      challenge: >-
        The instrument takes relations from the seeded sources RS-1 to RS-4 and
        reports yields in admitted relations. The cost of finding a relation for
        a given target (the decomposition search over F_W), and the inverse AR-1
        admission rate that multiplies it, are not charged in any unit the
        contract uses. A statement in relations or in matrix dimension says
        nothing about this term.
    - id: CM-2
      subject: per-leg class labelling
      challenge: >-
        Placing each leg in its class orbit and fixing its label (O, e,
        epsilon) needs up to k Frobenius applications per leg, plus the scalar
        multiplications CERT-LABEL spends on row 0. For an m-leg relation that
        is up to m k Frobenius applications. A storage or dimension count
        divided by k does not charge this per-relation term, which grows with k.
    - id: CM-3
      subject: quotient-row entry size
      challenge: >-
        A quotient row carries one F_r element, lambda^j f_O(lambda) mod r, per
        hit orbit, where a raw class row carries small integer coefficients.
        Counting entries without their size (about log2 r bits each, where a raw
        entry needs a few bits) leaves the per-entry constant of storage and of
        the linear algebra uncharged.
    - id: CM-4
      subject: the Frobenius class map in the carried C2 convention
      challenge: >-
        The convention counts group operations. It does not charge the per-step
        cost of choosing a canonical representative among a class's conjugates,
        or the detection of and escape from fruitless cycles, which the
        pointers below describe for walks on classes. Pointers only, provenance
        recalled, not opened by this reviewer: Wiener-Zuccherato (SAC 1998);
        Gallant-Lambert-Vanstone (Math. Comp. 69, 2000); Duursma-Gaudry-Morain
        (ASIACRYPT 1999); Bos-Kleinjung-Lenstra (ANTS-IX, 2010).
    - id: CM-5
      subject: the unnamed claimant behind F1
      challenge: >-
        F1 states its quantity relative to an accounting whose record it does
        not name (RT-O-8), so the baseline cannot be checked for the terms CM-1
        to CM-4. CORR-20260925-649e25 item 2 requires the record to be named.
    - id: CM-6
      subject: certificate cost is instrument cost
      challenge: >-
        CERT-QUOT needs one scalar multiplication per hit orbit plus pi_G(R), so
        at most m + 1 per relation. CERT-BIND needs, for each row j = 1 to k - 1,
        one scalar multiplication [lambda^j] R, an m-leg sum and m + 1 Frobenius
        applications, so k - 1 scalar multiplications per relation. These belong
        to the validation budget of any run at larger cells, not to any method
        cost. The B1 and B2 repair (R-piG-ranked) adds no scalar
        multiplication: pi_G(R) is already computed for CERT-QUOT, and reading
        the ranked row replaces recomputing it.
    - id: CM-7
      subject: memory
      challenge: >-
        No carried cost sentence states memory beside time. The storage count
        in F1 omits the per-entry size of CM-3 and the labelling tables of CM-2.
  reduction_and_scope_challenges:
    - id: SC-1
      subject: what the evidence is
      challenge: >-
        Every finding here is rule-level: which vector a rule reads, which point
        a rule is applied to, which object a rule admits. Each is shown at the
        toy cells (n, a) = (17, 1), (17, 0) and (23, 0) and at the self-test
        objects of PTM-D and RT-O-6, using this reviewer's own implementation of
        the spec text (lib.py, cell.py and instr.py, embedded in computations.json
        C-J3-G4). A rule that reads the wrong vector reads it at every size, so
        the rule-level findings need no extrapolation. The counts (593 of 774,
        90 of 389, 13 of 15, 1530) are seeded toy counts and are not carried to
        any other cell.
    - id: SC-2
      subject: what sets the B1 rate
      challenge: >-
        Under the literal CERT-BIND a relation is rejected when its target lies
        outside G, because tau acts as [lambda] on G and in general not on the
        rest of E. The share of such targets is set by the cofactor h and by how
        the relation source draws targets: at (17, 0), h = 548 and 14 of 16
        seeded RS-3 targets lie outside G. B1's rate is therefore
        cell-dependent. Its existence is not, for any h > 1 and any source that
        draws targets outside G.
    - id: SC-3
      subject: orders of magnitude between these cells and any standardized row
      challenge: >-
        The toy primes run to r = 2095853, about 2^21. No standardized row was
        computed here, and nothing in this report is inferred at that size.
        What would not carry across that span is everything rate-like: the
        seeded counts, the RS-2 probability (HC-3), the timings, and the share
        of targets outside G (SC-2). The rule-level findings (SC-1) carry
        because they are statements about the text.
    - id: SC-4
      subject: the TB-1 residual
      challenge: >-
        Left to the composer (J4 tb1_consideration, RESIDUAL). This report does
        not decide whether in-round TB-1 reads the carried C2 sentences and F1
        as ESC-B's FIRE-TB1 wording does.
    - id: SC-5
      subject: P2-2b and CTL-NONSTABLE
      challenge: >-
        CTL-NONSTABLE (spec line 1119) requires that no family is admitted over
        W' and that no rank is reported. The text does not say whether P2-2b's
        certificates run on its row-0 relations before the family test rejects
        them. If they do, B1 reaches this blocking control too, since its RS-3
        targets are not restricted to G, and IR-17 would invalidate the run.
        Not computed here; a reading the amendment should fix.
    - id: SC-6
      subject: joints this report does not cover
      challenge: >-
        J2, J5, J6, J7 and the unowned sweep were not performed (card
        constraint). This report's silence on them is not a holds.
  proof_architecture_challenges:
    - id: PA-1
      subject: observation fiber at the L4/L5 interface (B2)
      challenge: >-
        Hold every certificate observation fixed (CERT-LABEL row 0, CERT-QUOT
        recomputed from f_O, CERT-BIND) and vary only the quotient row the ranks
        consume. The true row, the planted F-i and F-ii rows and M3's rows built
        at lambda^-1 give the same observations, and only the true row satisfies
        L4's identity. The missing separator is a rule that checks L4's identity
        on the row that L5's map produced and that RANK-A and RANK-B read. With
        it (R-piG-ranked), every planted row fires IR-15.
      evidence: computations.json C-PTM-F, C-J3-CELLS
    - id: PA-2
      subject: quantifier order
      challenge: >-
        The quantifier_order field (spec line 1614) discharges the quantifier
        over labellings with CERT-LABEL and CERT-QUOT per relation. It does not
        quantify over the rows that are ranked, so the certified identity and
        the ranked row can be different objects. "For every ranked row, the
        on-curve identity holds for that row" is the statement B2 shows is not
        checked.
    - id: PA-3
      subject: the boundary of IR-7 against L2 and L6
      challenge: >-
        L2 states that orbits have exactly k elements, and L6 that the null
        object has k = 1. IR-7 and P2-1 state orbit length n. The two agree only
        when k = n, so the stated boundary object is not embedded in the rule
        set as written, and the protocol's own null object trips IR-7 (RT-O-1).
      evidence: computations.json C-PTM-A, C-J4-RC4
    - id: PA-4
      subject: definitions at k = 1
      challenge: >-
        Several texts change meaning at k = 1. The ker-g rationale says
        ord(lambda) = k with lambda != 1 cannot hold there, but ord(lambda) = k
        does hold and lambda != 1 is what fails; the ker-g space is zero, not
        undefined (RT-O-15). AR-2 is stated twice (RT-O-2), and metrics.primary
        lists rank_kerg with no k = 1 exception (RT-O-13). How a k = 1 result is
        read therefore depends on which of these texts a reader applies.
      evidence: computations.json C-J4-RC4
    - id: PA-5
      subject: compositional invariant
      challenge: >-
        Deleting one component of the repaired certificate set and finding the
        first step that fails was done for both components. Restoring the
        literal R in CERT-BIND fails first at G4 (B1). Removing the ranked-row
        binding of CERT-QUOT fails first at P2-3, where planted and M3 rows are
        ranked (B2). Neither repair alone meets PTM-F; both together do (C-PTM-F
        signature lines).
      evidence: computations.json C-PTM-F, C-J3-G4
    - id: PA-6
      subject: nearby object for P2-E1 and AR-2
      challenge: >-
        The composite r' = 137 x 239 at (17, 0) (E-iii) is the nearest object at
        which "r is prime" is false. AR-2's clause form does not separate it,
        and P2-E1's primality is asserted, not certified, at computed cells
        (RT-O-3).
      evidence: computations.json C-PTM-E
  narrowest_supported_statement: >-
    At the toy cells (n, a) = (17, 1), (17, 0) and (23, 0) of EXP-BINSTD-178742
    version 2, and at its self-test objects, with the spec text implemented by
    this reviewer (computations.json), three things hold. (1) The certificates
    as written do not do what definitions.certificates.reading says. Literal
    CERT-BIND invalidates the unmutated build at G4 (B1). CERT-QUOT as written
    does not read the row the ranks consume, so planted rows and rows built at
    lambda^-1 pass every certificate, and PTM-F proves too much (B2). At these
    cells both are repaired by applying CERT-BIND to pi_G(R) and CERT-QUOT to
    the ranked row together, and by neither alone. (2) Carried IR-7
    invalidates the protocol's own null object, and AR-2's clause form with
    P2-E1 admits a composite r'. (3) The carried predicted_gain and the "every
    Frobenius row" objective do not meet CORR-20260925-649e25 items 1 and 2
    (J4). The statement concerns the contract's text and this reviewer's
    implementation of it. It asserts nothing about GGMP Lemma 3.3, L3 or any
    rank identity, about any curve at standardized parameters, or about any
    cost.
  next_concrete_action: >-
    For the Coordinator; this report changes no status. One additive amendment
    to EXP-BINSTD-178742 version 2 that does five things. (a) It states CERT-BIND
    on pi_G(R) and binds CERT-QUOT to the exact quotient row that RANK-A and
    RANK-B consume, in the same amendment (RT-O-4, RT-O-5). (b) It replaces n by
    k in IR-7 and P2-1 (RT-O-1). (c) It requires a primality certificate for r
    at every computed cell and in P2-E1 (RT-O-3). (d) It supersedes the carried
    predicted_gain and the "every Frobenius row" objective under
    CORR-20260925-649e25 (RT-O-8, RT-O-9). (e) It adds the five
    required_controls above to the pre-registered self-tests. Then, in an
    independent session, re-run this report's C-PTM-A, C-PTM-E, C-PTM-F and
    C-J3-CELLS against the amended text. Pass test: ptmf3.py under the amended
    reading shows IR-15 on 774 of 774 planted rows with 389 of 389 unmutated
    controls passing; the null object is silent under IR-7; and r' = 137 x 239
    is rejected before any rank.
