        but still rejects the 90 controls. R5 (P2-6 re-run on the exported
        quotient row) accepts 773. Only R-piG-ranked, both repairs together,
        meets the signature: 774 of 774 planted rows fire IR-15 before any
        rank, and all 389 controls are ranked at EVAL.
      unexpected_observation: >-
        Relation 164 at (17, 0) has a single hit orbit with f_O(lambda) = -1
        mod 239, so its F-i row is the zero row, with rank 0 against EVAL 1. It
        becomes a P2-6 candidate. Under R-lit and R-piG the re-run CERT-QUOT
        recomputes from f_O and passes, and the false row is routed to the
        falsification outcome O-REFUTE-Q. R5 catches it only at the re-run,
        after the rank readout. It lies outside the plan's rank-consistent
        object and is recorded under core rule 8.
      comparison: >-
        The 2026-09-26 continuation evaluated certificate forms only, on 4
        relations at each of (17, 1) and (23, 0). This computation agrees on
        every shared quantity: the literal and raw-row forms pass every planted
        row, and the quotient-row form fails every one. Repairs: objections
        RT-O-4 (B1) and RT-O-5 (B2).
  objections_id_note: >-
