  newly_frozen_values:
    definitions_are_value_free: true
    judged_against: experiments/EXP-BINSTD-178742/specification.v1-frozen-64e8b013.yaml
    note: >-
      Each entry gives (a) its location in version 2 by file and field path,
      never its value, and (b) a value-free definition (what is computed, from
      which primary inputs, under which rule and parameters) meant to stand
      alone on a blind card. SPEC below abbreviates
      experiments/EXP-BINSTD-178742/specification.yaml. Values carried from
      version 1 (the fixture_n17 frozen_values, the census, the six
      primary-sourced rows) are NOT listed; see carried_unchanged.
    common_definitions:
      CD-ORDER: >-
        For a in {0, 1} and a prime n, #E_a(F_{2^n}) for the Koblitz curve
        y^2 + x y = x^3 + a x^2 + 1 is 2^n + 1 - s_n, where s_0 = 2, s_1 = t,
        s_{i+1} = t s_i - 2 s_{i-1}, with t = 1 for a = 1 and t = -1 for a = 0.
      CD-R: r is the largest prime factor of #E_a(F_{2^n}) in its complete prime factorisation.
      CD-LAMBDA: >-
        lambda is the root mod r of X^2 - t X + 2 (t as in CD-ORDER) that
        satisfies lambda^n = 1 mod r; the entry also records whether exactly one
        root has that property.
      CD-E1: >-
        Admission clauses of version-2 rule E1: E1-a, r^2 does not divide
        #E_a(F_{2^n}); E1-b, r does not divide #E_a(F_2), which is 4 for a = 0
        and 2 for a = 1; E1-c, (r - 1)/2 >= 4 n; E1-d, lambda (CD-LAMBDA) has
        multiplicative order exactly n mod r. admitted is true iff all four
        hold. v1_size_clause_met records whether r > 2^floor(n/2).
