      - {id: NF-09, location: 'SPEC experiment.cells.positive_arm.e1_admissibility_table.pairs[n=17,23,31,41] fields r_0, r_1, complete', definition: 'For each positive n, r_0 and r_1 are r (CD-R) for a = 0 and a = 1; complete is true iff both (n, 0) and (n, 1) are admitted under CD-E1 and r_0 != r_1.', discharges: D1}
      - {id: NF-10, location: 'SPEC experiment.procedure.steps[id=P2-E1].text clause E1-c', definition: 'The version-2 size threshold of rule E1: the inequality between (r - 1)/2 and a fixed multiple of n, where the multiple is the per-n column count of the carried |V| < 4 n disjointness exclusion (P2-4). A re-deriver states the multiple from P2-4 and checks that E1-c uses it.', discharges: D1}
