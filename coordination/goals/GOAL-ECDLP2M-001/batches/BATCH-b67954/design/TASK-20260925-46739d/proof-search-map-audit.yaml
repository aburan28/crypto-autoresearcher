        - row: ECC2K-130
          k: 131
          B: 83 (1000 - 7 x 131)
          trace: '680:25, 564:19, 733:83, 841:1, 876:42, 926:89, 932:66, 320:34, 129:69, 493:63, 409:5, 985:90, 129:1'
