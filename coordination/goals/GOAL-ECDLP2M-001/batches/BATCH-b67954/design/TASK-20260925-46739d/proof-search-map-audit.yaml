  design_corrections:
    - id: DC-B1
      against: IDEA-20260922-261004 (B) raw basis, predictions rank_of_conjugate_family_raw_basis
      finding: >-
        EXACTLY k needs the legs to lie in DISTINCT orbits, not just in size-k
        orbits. Two legs P and -tau^d(P) share one class orbit with orbit
        polynomial X^e (1 - X^d), zero at zeta = 1, so the raw class rank is k - 1.
        These relations occur whenever a target of the form P - tau^d(P) is
        decomposed. The quotient rank stays 1.
      handled_by: Lemma L3 (exact formula), the RS-4 constructed targets, and H-BINSTD-ce4f38 statement_note.
      proposal_edited: false
    - id: DC-B2
      against: IDEA-20260922-261004 raw basis (points)
      finding: >-
        Raw rank depends on whether negation (and cofactor translation) is
        identified. The point basis gives k where the class basis gives k - 1 on
        the DC-B1 relations. Both are reported, and the quotient is taken over
        classes, because that is the unknown-indexed system.
      handled_by: definitions.raw_point_basis and raw_class_basis, and lemma L5b
      proposal_edited: false
    - id: DC-B3
      against: IDEA-20260922-261004 (B), the claim that short orbits cannot occur in a relation for a target in G
      finding: >-
        This holds for relations whose legs ALL lie in E(F_q) (the
        IDEA-20260922-6cf862 (A) setting), not for mixed relations. With a
        point-defined factor base containing x = 0, the 2-torsion point (0, 1),
        which has a size-1 orbit and G-part O, can be a leg, as in R = P + (0, 1).
        IDEA-20260915-8fe0ef's confounders already advise excluding x = 0. This
        design removes the issue by definition: F_W contains only points with
        pi_G(P) != O. Every short orbit is then an instrument defect (IR-7, IR-9).
      handled_by: definitions.factor_base, lemma L2, AR-1
      proposal_edited: false
    - id: DC-B4
      against: IDEA-20260922-261004 metric rank_of_conjugate_family_in_the_ker_g_module_basis (undefined in the proposal)
      finding: >-
        The basis is now defined precisely enough to compute: the per-orbit
        blocks reduced mod h_g = gcd(g-hat mod r, X^k - 1), with g-hat the 0/1
        lift. By L3 its rank is at most deg h_g, not automatically n'. The
        fixture's recorded g-hat(lambda) != 0 for both degree-8 factors means
        lambda is not a root of h_g there.
      handled_by: definitions.ker_g_basis, lemma L3 corollary, prediction without a preferred outcome
      proposal_edited: false

