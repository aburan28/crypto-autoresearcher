  # ---------------------------------------------------------------------------
  kn_tech_080_audits:
    - id: AUD-1
      audit: Exact bottleneck and baseline embedding
      status: filled
      v2_change: D7
      bottleneck: >-
        V2 (D7). The relation-yield unit of the Frobenius rows: the basis (raw
        class, raw point, orbit quotient or ker-g) in which a row's
        relation-yield column is stated. The contract fixes the
        per-conjugate-family rank in each basis. It states no bit movement of
        any row's column, and the version-1 bit figures (which rested in part on
        an unverified c2pnb k) are dropped. IDEA-20260922-1a081a C3 and
        IDEA-20260922-c48e7d Saving-B still wait on it as a dependency
        (CORR-20260925-649e25 item 2); any consequence is conditional and per
        row, on primary-sourced rows only.
      baseline_embedding: >-
        Two exact slices. (1) The n = 17 cell of KN-OPEN-095df5, frozen as gate G1
        (fixture_n17), run before any new cell: r = 65587, lambda = 17184,
        Phi_17(lambda) = 0, and both degree-8 divisors nonzero at lambda. (2) The
        null object k = 1 (CTL-NULL), where the raw and quotient bases must
        coincide by lemma L6. It is a symbolic reduction, not a numerical
        resemblance.
      hand_checks_done_here: >-
        17 x 3858 = 65586, so 17 | r - 1 on the fixture. f1 f2 = Phi_17 over F_2
        (see hand_arithmetic.phi17_product).
      where: EXP-BINSTD-178742 cells.fixture_n17, controls CTL-FIXTURE and CTL-NULL
      v2_addendum: >-
        V2 (D1, D5, D6). Both exact slices are carried unchanged (CU-02,
        CU-08). Version 2 adds frozen integer tables that every run must
        reproduce before any rank readout: the E1 admissibility table
        (cells.positive_arm.e1_admissibility_table; SR-5b), the canonical
        factors and ker-g table (cells.positive_arm.canonical_factors and
        kerg_design_table; SR-5c), and the admission self-test object
        (cells.admission_selftest_object; IR-4). The (17, 1) row of the E1
        table must equal the carried fixture values. CTL-NULL gains a v2_reading
        of "rule E1 bounds" (E1-a and E1-c).
    - id: AUD-2
      audit: Observation-collision test
      status: filled
      observable: >-
        The rank over F_r of the k-row conjugate family of one relation, in four
        bases, each reported with the orbit-length histograms and the
        multiplicity profile.
      collisions_searched:
        - pair: raw rank below k from short orbits, versus from a genuine submodule
          separated_by: >-
            Construction (F_W excludes pi_G(P) = O, and lemma L2 gives every class
            orbit length k) plus the histogram tripwire IR-7. A short orbit
            invalidates the run before any rank is read.
        - pair: raw class rank k - 1 from same-orbit cancellation, versus from an instrument error
          separated_by: >-
            FOUND IN THIS DESIGN (design correction DC-B1). Lemma L3 predicts the
            exact rank per relation from its multiplicity profile, and
            constructed targets RS-4 exercise it. The same relation has point
            rank k, which exhibits basis dependence inside the raw basis.
        - pair: quotient rank 1 from genuine absorption, versus an instrument that never applies tau and copies row 0
          separated_by: >-
            The raw readout of the same family must equal the L3 value. CTL-NULL
            must report k = 1. CTL-NONSTABLE must refuse every family.
        - pair: ker-g rank equal to n' from the relayed lemma, versus a coincidental count of common roots
          separated_by: >-
            Per divisor, deg h_g, the roots lambda^i and g-hat(lambda) mod r are
            reported, and the rank is checked against L3 with h = h_g.
      v2_collisions_added:
        - pair: quotient rank 1 from a correct quotient equation, versus a mislabelled or orientation-flipped build whose rows still have rank 1
          separated_by: >-
            V2 (D2, D3). Every rank of L3 is invariant under X -> X^{-1} on
            mu_k, so no rank can certify a labelling. Each relation must pass
            CERT-LABEL (each leg equals its labelled tau-shift of its orbit
            representative), CERT-QUOT (sum_O [f_O(lambda) mod r] Q_O =
            pi_G(R)) and CERT-BIND (row j is tau^j of row 0); IR-15 to IR-17.
        - pair: a certificate that passes because it is correct, versus a certificate with no power
          separated_by: >-
            V2 (D4). Gate G4 (CTL-INSTRUMENT-SELFTEST) runs two deliberately
            defective builds, M1 (copy-row) and M2 (orientation flip), on the
            same relations before any rank is read; each must be invalidated
            and the correct build must not (IR-18).
        - pair: deg h_g from the executor's arithmetic, versus deg h_g from the frozen table
          separated_by: >-
            V2 (D5). Every cell's deg h_g and Phi_n factorisation is compared
            with the frozen tables; a difference halts that n before its rank
            readout (SR-5c) and is never evidence. Where deg h_g = 0 the
            informative ker-g quantity is the per-divisor vector
            g-hat(lambda^i) mod r, reported per cell.
      where: H-BINSTD-ce4f38 proof_search_map.observation_collision (and version_2.mechanism_addition); EXP-BINSTD-178742 procedure P2-2b, P2-G4, P2-3 and P2-6, proof_search_map.observation_collision
    - id: AUD-3
      audit: Quantifier-order audit
      status: filled
      statement: >-
        FOR ALL admitted cells (n, a, r), stable W, targets R with pi_G(R) != O and
        decompositions over F_W: quotient rank = 1, and raw class, raw point and
        ker-g ranks equal the lemma-L3 counts.
      witness_dependencies: >-
        lambda depends on (curve, r) only. h_g depends on (g, r, lambda) only.
        Orbit and class representatives, and the field polynomial, change each
        f_O by a unit multiple X^s or -1 and change no rank. The seeds choose
        which relations are sampled, never the predicted value.
      refutation_rule: One certified relation that violates a rank identity refutes it, and agreement on a sample is a consistency check only.
      where: H-BINSTD-ce4f38 proof_search_map.quantifier_order; EXP-BINSTD-178742 definitions.field_representation
      v2_addendum: >-
        V2 (D2, D3, m-J1-3, m-J1-4). The quantifier now ranges over CERTIFIED
        relations only (CERT-LABEL, CERT-QUOT, CERT-BIND, in a run whose gate G4
        passed). The witness dependencies are unchanged except that the
        raw-class tie-break is now fixed (definitions.raw_class_basis, m-J1-4)
        and the ker-g orbit O is stated to be a class orbit (m-J1-3). Because every rank
        is invariant under X -> X^{-1}, the quantifier cannot be discharged by
        ranks alone, which is why the certificates are inside it.
    - id: AUD-4
      audit: Method ceiling and nearby-object control
      status: filled
      ceiling: >-
        Exact per-family rank identities on the tested toy cells, exact deployed
        census and verdicts. Nothing about assembled-matrix rank (H-261004-1),
        pipeline cost, the text of eprint 2020/1315, non-stable bases beyond
        refusal, or any deployed curve's cost or security.
      nearby_objects:
        - PTM-A null object E_b, k = 1 (CTL-NULL, blocking)
        - PTM-B non-stable subspace W' with dim C(W') <= 1 (CTL-NONSTABLE, blocking)
        - PTM-C forced-negative degrees 19, 29 and 37 (CTL-FORCED-NEGATIVE, gate G2, blocking)
        - PTM-D subfield curve with G inside E(F_q), lambda = 1 (CTL-ADMISSION-SELFTEST, gate G3, blocking)
      failure_signature_mapping: >-
        Each PTM object in the review plan has a rule that keeps its known-false
        conclusion out of reach. PTM-A must report identical ranks (IR-5). PTM-B
        must admit no family (IR-6). PTM-C must measure nothing (IR-3). PTM-D
        must be rejected at admission (IR-4).
      where: EXP-BINSTD-178742 controls
      v2_addendum:
        ceiling: >-
          V2 (O-7, D5, D7). Carried, with two changes. eprint 2020/1315 was
          retrieved and read by TASK-20260924-eaf78a (IMP-GGMP cleared against
          that archived report); the contract still says nothing about the
          lemma's own basis beyond the recorded basis-dependence
          (definitions.ggmp_basis_dependence). And the contract fixes the basis
          of a relation-yield column without stating any bit movement.
        nearby_objects_changed:
          - >-
            PTM-D (D6): the frozen object is now a subfield curve over F_8 =
            F_2[z]/(z^3 + z + 1) with b not in F_2, whose d_min = 3, q = 8 and k =
            5 are computed from its coefficients; AR-2 runs in isolation from
            E1, so the size clause cannot reject it first, and a deleted-clause
            mutant must admit it (G3 power check).
          - >-
            Known-defective instruments (D4): mutants M1 and M2 at gate G4 are
            objects whose known-false output (a rank read from a mislabelled or
            copied family) must be invalidated by the certificates.
        failure_signature_mapping_added: M1 must fire IR-17; M2 must fire IR-15 or IR-16; a mutant that passes every certificate fires IR-18 and stops the run.
    - id: AUD-5
      audit: Strictness and interface preservation
      status: filled
      v2_change: D7 (the version-1 "lowers a claimed gain" sentence is withdrawn)
      strictness: >-
        V2. No strict improvement is claimed. The contract fixes the basis in
        which a relation-yield column is stated (one certified quotient row per
        relation, and the lemma-L3 rank in the raw and ker-g bases); it names
        no record whose claimed gain it corrects (CORR-20260925-649e25). Lemma
        L8 shows the eigenblock collapse of IDEA-20260922-b19793 is the same
        reduction as the orbit quotient.
      interfaces:
        - L5 raw to quotient is reduction mod (X - lambda); no information about the logarithms is lost
        - L5b points to classes merges columns, so rank_class <= rank_point, and the gap is reported
        - L8 lambda-eigenblock equals the orbit-quotient system
        - F_2 divisor g to 0/1 integer lift g-hat to h_g over F_r, a declared choice (ker-g basis)
        - primary text to transcribed r string, compared character by character (SR-SRC-4)
      where: EXP-BINSTD-178742 derivation L5, L5b and L8

