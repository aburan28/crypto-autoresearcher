  hand_arithmetic:
    label: DESIGN FIGURES. Hand arithmetic, no program run.
    ord_census: See EXP-BINSTD-178742 structural_certificate.census; every power is written out there.
    fixture:
      seventeen_divides_r_minus_1: 17 x 3858 = 38580 + 27006 = 65586, so 65587 = 1 mod 17.
      phi17_product: >-
        f1 = 1 + x^3 + x^4 + x^5 + x^8 and f2 = 1 + x + x^2 + x^4 + x^6 + x^7 + x^8.
        The rows of the product are 1 f2 at exponents {0,1,2,4,6,7,8}, x^3 f2 at
        {3,4,5,7,9,10,11}, x^4 f2 at {4,5,6,8,10,11,12}, x^5 f2 at
        {5,6,7,9,11,12,13} and x^8 f2 at {8,9,10,12,14,15,16}. Exponents 0, 1,
        2, 3, 13, 14, 15 and 16 occur once; exponents 4 to 12 each occur three
        times. Every coefficient is odd, so f1 f2 = 1 + x + ... + x^16 = Phi_17
        over F_2.
    k_divides_r_minus_1:
      method: >-
        Write r in base 1000 (3-digit chunks from the left). Set acc = first
        chunk, then acc = (acc x B + next chunk) mod k with B = 1000 mod k. The
        list gives each chunk and the accumulator after it. A final accumulator
        of 1 means r = 1 mod k.
