            index calculus and places D* too EARLY: a sparse solve of a
            low-weight Macaulay matrix, of order rows^2 times row weight (a
            standard estimate, provenance recalled, not re-read here), lies
            below the dense rows^omega whenever the row weight is below
            rows^(omega - 2). Only for the out-of-domain omega = 2.0 stand-in
