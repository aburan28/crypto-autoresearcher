            D*_R(c, 3.0, m) <= D*_R(c, 3.0, m*) for every m: an optimising m
            other than m* can only move the crossing earlier. The relevant
            comparison at each m is D_solve(n, m, k) against D*(m); hence the
            threshold is handed as D*(m) over m.
