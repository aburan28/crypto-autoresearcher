            F4 row counts growing with D, or a variable count depending on m
            or t) raises the index-calculus cost and places D* EARLIER than R-B;
            R-B's D* is then late, optimistic for index calculus off D = 4.
        M8:
          name: optimising m under H2
          value_at_571: not modelled; the model's m* = 12 at every D (L-ARG)
          depends_on_D: 'through H2: the true solving degree may depend on m'
          direction: >-
