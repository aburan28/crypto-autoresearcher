  hold_f_hold_g_row_set_statement:
    status: done
    sessions: [S-A1-T2]
    card_item: PA-12 (DEC-20260925-89573b R-ONE-BATCH)
    condition_as_ruled: >-
      DEC-20260924-124667 R-NA7, transcribed: HOLD-F "change: none in rank; one
      design condition ADDED", the condition being that "when HOLD-F is
      designed, its row set is reconciled against the frozen primary inputs
      (inputs/CERTICOM-CHALLENGE-2009/ Appendix A, FIPS 186-4, RFC 2409), not
      against EXP-SEMBIN-992e73"; HOLD-G "change: none in rank; the HOLD-F
      added condition applies to its column split."
    statement: >-
      The revised row set does NOT change the HOLD-F and HOLD-G row-set
      condition. The condition names its own reconciliation source (the three
      frozen primary inputs) and excludes EXP-SEMBIN-992e73. Version 2 settles
      lane A's claim-(A) row set against the same three primary inputs, never
      against EXP-SEMBIN-992e73's degree list (D-1, PA-5: Certicom from
      Appendix A, read; FIPS 186-4 and RFC 2409 by the contract's Stage 0
      COVERAGE CHECK). Nothing in version 2 requires the condition's text,
      sources or scope to change.
    pointers_for_a_hold_design: >-
      Stated as pointers to re-check, not as a row set for either hold. (1)
      Appendix A of inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
      prints fifteen binary curves at nine degrees {79, 89, 97, 109, 131, 163,
      191, 239, 359} (read by S-A1, lines 2545-3129). (2) The suffixes 353 and
      358 in ECC2-353 and ECC2K-358 are group-order bit lengths; both curves
      have m = 359. (3) Three printed-hex readings, CR-1 to CR-3, are
      pre-registered in specification.yaml
      inputs.curve_parameters.certicom_rows.readings. (4) With the FIPS 186-4
      degrees {163, 233, 283, 409, 571} and the two RFC 2409 EC2N groups at
      {155, 185}, lane A's union is fifteen distinct degrees. Neither the FIPS
      text nor the RFC 2409 input was read by this design session (RFC 2409 is
      outside the card's read_scope); those two degree sets are as the
      contract states them, and its Stage 0 reads both inputs.
    reading_for_the_composer: >-
      A reading, flagged as one and not a ruling: the condition's rule is
      "reconcile against the primary inputs", so read literally it applies
      whatever list seeds a HOLD-F design, lane A's version 2 list included.
      Whether a HOLD-F design may use that list as a seed is left to
      DEC-20260925-41f6dc or to that hold's own design.
    not_asserted: >-
      No HOLD-F or HOLD-G row set, rank, design or status is asserted, and no
      lane-B hold is carried (PA-12). DEC-20260925-41f6dc carries this
      statement or rules on it.
