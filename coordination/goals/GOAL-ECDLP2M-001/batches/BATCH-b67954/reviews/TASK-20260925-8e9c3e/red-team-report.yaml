          Rows counted as Boolean monomials of degree <= D in the descended
          system's own variables, nvar = n(t-2) + kt = 6286 at 571, m = t = 12
          (6281 under MI-1). This is the audit's own example (a variable count
          depending on m and t), counted as R-M counts monomials, and anchored
          at D = 4 as R-B is. Per step it grows faster than n only up to
          D = 10. Its cumulative excess over n^(D-4) is +3.55 bits at most (at
          D = 10), turns negative at D = 19, and reaches -2.10 bits at D = 21
          and -13.25 at D = 30 (times omega = 3: -6.3 and -39.7 bits). It stays
          above R-M (+52.3 bits at D = 19). computations.json C-02.
        consequence: >-
          For any crossing at D >= 19 (the top of P-C's band, and all of K3 and
