          readings", and the R-M reading's D* is the later one (L-SPREAD). A
          true degree at or above D*_M implies a rho-favourable margin only if
          the true cost is at least S_M, and under the stated one-step
          tolerance only at D*_M + 1, which E2's "at least D*_R" does not carry.
        cheapest_falsification_of_the_discharge: >-
          Zero-compute: set H1.formal_statement beside H1.lower_edge and ask
          whether a measured toy cost one degree step and a bit below S_M
          falsifies H1. By falsification_condition it does, so S_M is claimed
