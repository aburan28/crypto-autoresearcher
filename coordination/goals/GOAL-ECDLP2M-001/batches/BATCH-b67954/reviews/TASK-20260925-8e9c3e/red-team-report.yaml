        what_the_audit_actually_argues: 'L-INT M7.direction is conditional: "A row or variable count growing faster in D than n^D (for instance F4 row counts growing with D, or a variable count depending on m or t) ... places D* EARLIER than R-B". The one-direction summaries drop the condition.'
