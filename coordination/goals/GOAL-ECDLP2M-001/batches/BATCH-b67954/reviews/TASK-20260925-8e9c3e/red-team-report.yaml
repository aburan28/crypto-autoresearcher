        mechanism: >-
          The formal statement still asserts, as a heuristic, S >= S_M minus
          one degree step, and the falsification condition fires below that
          edge. The note says S_M bounds no solving cost. Both cannot hold. The
          v1 text claimed "S in the closed interval between S_M(D, omega) and
          S_B(D, omega)" and fired "outside the [S_M, S_B] bracket by more than
