  Q1_multiplicative_order_of_2:
    status: COMPLETE
    computation: C02-Q1
    method: >-
      Own: primality and factorisation of n-1 by trial division; e reduced from
      the candidate n-1 by stripping each prime p while 2^(e/p) = 1 mod n.
      Checks: own brute-force least e, PARI 2.17.2 znorder, SymPy 1.14.0
      n_order; primality also by PARI isprime and SymPy isprime. All agree.
    check_rule: 2^e = 1 mod n, and 2^(e/p) != 1 mod n for every prime p | e.
    rows:
      - {n: 131, n_prime: true, n_minus_1: '2 * 5 * 13', e: 130,
         check: '2^130=1; 2^65=130, 2^26=53, 2^10=107 (mod 131)'}
      - {n: 163, n_prime: true, n_minus_1: '2 * 3^4', e: 162,
         check: '2^162=1; 2^81=162, 2^54=104 (mod 163)'}
      - {n: 233, n_prime: true, n_minus_1: '2^3 * 29', e: 29,
         check: '2^29=1; 2^1=2 (mod 233); reduction 2^116=2^58=2^29=1'}
      - {n: 283, n_prime: true, n_minus_1: '2 * 3 * 47', e: 94,
         check: '2^94=1; 2^47=282, 2^2=4 (mod 283); reduction 2^94=1 strips 3'}
      - {n: 409, n_prime: true, n_minus_1: '2^3 * 3 * 17', e: 204,
         check: '2^204=1; 2^102=408, 2^68=53, 2^12=6 (mod 409)'}
      - {n: 571, n_prime: true, n_minus_1: '2 * 3 * 5 * 19', e: 114,
         check: '2^114=1; 2^57=570, 2^38=109, 2^6=64 (mod 571)'}
    census: 'e = n-1 at n = 131, 163; e < n-1 at n = 233, 283, 409, 571'
    s2_recheck: >-
      C11-S2-recheck-Q1, new code: least divisor d of n-1 with 2^d = 1, a
