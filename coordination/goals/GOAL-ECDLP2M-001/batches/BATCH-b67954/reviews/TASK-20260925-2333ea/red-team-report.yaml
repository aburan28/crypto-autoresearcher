  J3:
    verdict: breaks
    breaking_artifact: >-
      TWO, each matching a clause of the plan's J3 breaking_artifact.
      (B1) OVER-STRICT CERTIFICATE (C-J3-G4; C-J3-CELLS reading R-lit): under
      the literal CERT-BIND text the UNMUTATED build is invalidated at gate G4,
      so IR-18 and SR-3b stop every execution before any rank is read.
      (B2) A VARIANT ROUTED TO AN OUTCOME (C-J3-CELLS reading R-piG;
      C-PTM-F+C-J3-M3-REFUTE; C-J3-M3-RS2): under the minimal repair of B1
      (CERT-BIND on pi_G(R)), M3 (correct labels, ranked quotient rows built at
      lambda^-1) passes G4 and every certificate. It routes to
      O-SUPPORT-consistent at (17,1) and (23,0), and to O-REFUTE-Q on m = 3
      relations at (17,0), which RS-2 reaches with probability about 1.
      Cause: CERT-QUOT recomputes sum [f_O(lambda)] Q_O from the relation's
      orbit polynomials. No rule binds the vector that RANK-A and RANK-B
      consume to the certified vector. The only reading under which the
      control passes and every mutant fails is R-piG-ranked, which departs
      from the literal text twice: CERT-BIND projected to G, and CERT-QUOT
      evaluated on the ranked quotient row.
    cells_and_readings: >-
      Cells: (17,1) (the n = 17 fixture cell), (23,0), and G4's own cell
      (17,0), all E1'-admissible by the frozen table. My instrument reproduced
      r, h, lambda, AR-2 and the Phi_n factors at these three cells (printed in
      C-J3-G4 and C-J3-CELLS). Readings: R-lit is the text as written; R-piG
      applies CERT-BIND to pi_G(R); R-piG-ranked is R-piG plus CERT-QUOT on the
      ranked quotient row; R-piG-instrep is R-piG with CERT-LABEL and CERT-QUOT
      using the labeller's own Q_O.
    rule_that_fires_first_per_instrument:
      CONTROL: >-
        R-lit: G4 invalidates it. IR-17 "tau^j(R) != [lambda^j] R" at j = 1
        fires on 13 of the 15 admitted G4 relations, then IR-18 and SR-3b. At
        (17,1), IR-17 fires on 12/12 RS-3 m = 3 relations; m = 2, RS-1 and RS-4
        pass, because every x in W = ker f1(tau) has trace 0, so every
        factor-base point there lies outside G and pairs of legs sum back into
        G. R-piG: nothing fires, every rank equals EVAL, O-SUPPORT-consistent.
      M1: IR-17 (legs_j != tau^j(legs_0)) on every admitted relation under every reading. G4 fails for it and the run is invalid.
      M2: IR-16 (CERT-LABEL, row 0) on every admitted drawn relation at all three cells, under every reading. Invalid.
      M2s: >-
        M2s-leg (the eps label flipped on each leg): IR-16 on every relation,
        invalid. M2s-rep (-Q_O chosen, against the m-J1-4 tie-break): IR-16
        when CERT-LABEL uses the contract's canonical Q_O. With the labeller's
        own Q_O nothing fires and it reaches O-SUPPORT-consistent. That is a
        consistent change of basis y_O -> -y_O: the rows are TRUE equations in
        log(-Q_O) and the ranks are unchanged. It is not counted as a break, but
        v2 does not say which Q_O the certificate uses.
      M3: >-
        R-lit: invalid at G4, like the control. R-piG: G4 passes and nothing
        fires at P2-2b. At m <= 2 the ranks equal EVAL (by the L3 corollaries,
        f_O is nonzero on mu_k minus {1}), so the result is O-SUPPORT-consistent.
        At m = 3, all 1530 vanishing leg-triples at (17,0) give quotient rank 0
        under both RANK-A and RANK-B against EVAL 1, pass the certificates when
        re-run at P2-6, and route to O-REFUTE-Q (34 of them have targets in G,
        so they pass the literal CERT-BIND too). The unmutated build ranks the
        same legs at EVAL. R-piG-ranked: IR-15 on every relation, invalid.
      M4: IR-17 (legs_j != tau^j(legs_0)) on every admitted relation, with rows 1..k-1 built as tau^(j+1). Invalid.
    quotient_row_rule_quoted:
      rule: >-
        spec definitions.certificates.CERT-QUOT: "for each admitted relation
        with target R, sum over hit class orbits O of [f_O(lambda) mod r] Q_O =
        pi_G(R), computed on the curve by at most m + 1 scalar
        multiplications. It is evaluated at the lambda of AR-2, never at
        lambda^{-1} or another root of unity." Per-leg: CERT-LABEL (same block).
      position: >-
        Step P2-2b, after P2-2 (AR-1). CERT-LABEL on the legs of row 0, then
        CERT-QUOT on row 0, then CERT-BIND on rows 1..k-1. It comes before P2-5
        and P2-3 (no rank). G4 (P2-G4) runs after P2-E1 and before P2-1. At P2-6
        the certificates are re-run on each candidate.
      coverage: every admitted relation; not sampled; not only candidates.
      blocking: >-
        Blocking. A failure fires IR-15 (IR-16 for labels, IR-17 for binding).
        success_criterion_v2 (1) requires that no IR fires, and it lists
        "invalid (including any certificate or self-test failure)" as NOT
        EVIDENCE. So a failure invalidates the run and is not merely reported.
      gap: >-
        What CERT-QUOT certifies is the recomputed vector (f_O(lambda))_O, not
        the ranked quotient row. quotient_basis defines the two as equal, but
        no rule checks that equality. For raw rows, CERT-BIND does bind the
        curve-side row to the shift form. The quantifier_order text discharges
        the quantifier over LABELLINGS only, not over the evaluation point of
        the ranked row.
    d3_check: >-
      Holds as a rule. Under every reading, CERT-BIND binds row j to tau^j of
      row 0 and fires on M1 and M4 on every admitted relation. Its
      scalar-multiplication clause is the over-strict part (B1).
    d4_check: >-
      Collision (3) is restated as separated by CERT-BIND (IR-17), and the v1
      claim is withdrawn (proof_search_map.observation_collision). M1 and M2
      are pre-registered at G4 before any rank, and a G4 failure is IR-18 and
      SR-3b, never O-REFUTE or O-SUPPORT. But as written, G4 is unsatisfiable
      by a correct build at its own named cell (B1).
    d2_check: >-
      Present, per relation, before rank, and blocking. It catches M2 and a
      whole-instrument lambda^-1, but not a lambda^-1 evaluation confined to the
      ranked rows (B2).
    vii_null_nonstable: >-
      Both remain blocking: SR-6, with P2-5 moved before P2-3 (O-12). No
      certificate makes the null object vacuous. At k = 1, CERT-BIND is vacuous
      by construction (there are no conjugate rows), but CERT-LABEL and
      CERT-QUOT are real checks at lambda = 1 (see PTM-A). CTL-NONSTABLE's
      membership test is independent of the certificates (see PTM-B).
    prior_comparison: >-
      The Coordinator prior gave J3 holds at about 0.5 and placed the break at
      (iii) then (vi) M3. B2 is at (vi) M3. B1 is at a place the prior did not
      name: G4's own unmutated control.
    partial_finding_1_over_strict_CERT-BIND: >-
      computations.json C-J3-G4. CERT-BIND (spec definitions.certificates;
      worksheet D3) requires "sum of its legs = tau^j(R) = [lambda^j] R" on the
      FULL target R. tau^j(R) = [lambda^j] R is an identity only on G. G4 runs
      on RS-3 relations, whose target is R = sum of legs, not projected. At G4's
      own cell (17, 0) (h = 548), 14 of 16 seeded RS-3 m = 2 targets lie outside
      G; the UNMUTATED build fails CERT-BIND at j = 1 on 13 of the 15 admitted
      relations, so G4 invalidates the correct build, IR-18 fires and SR-3b
      stops the run before any rank is read. With R read as pi_G(R), G4 passes
      (control 15/15 ranked; M1 15/15 IR-17; M2 15/15 IR-16).
