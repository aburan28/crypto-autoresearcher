        falsifies both. "Carried unchanged" was declared, by reading_rule and
        by CU-01 to CU-09, for text the producer attests it did not read.
    - id: O-E4-9
      joint: PTM-E, RC-4, RC-5
      severity: minor
      text: >-
        Three minor points. For toy r there is no explicit primality or
        [r]P0 = O clause; the complete factorisation, SR-5b and AR-2's
        generator requirement cover this. The stated reason for ker-g NOT
        COMPUTED at k = 1 is imprecise; L6 is the operative reason. The
        carried definitions.lambda text "lambda != 1 (admission rule AR-2)"
        contradicts AR-2_v2 at k = 1, with no operative effect.
  required_controls:
    - >-
      RC-E4-1. G4 adds pre-registered mutants that must be invalidated, with
      CERT-QUOT bound to the ranked vector: M3 (labels correct, ranked quotient
      rows at lambda^-1) and a planted false quotient row (PTM-F F-i and F-ii).
    - >-
      RC-E4-2. G4's correct-build pass set must include targets outside G
      (RS-3 and RS-4 shapes at a cell with h > 1, such as (17,0)). Otherwise an
      over-strict certificate goes undetected. As written, G4 would expose B1
      only by halting every run.
    - >-
      RC-E4-3. A carried-text audit. Every v1 field that version_2.reading_rule
      carries gets a producer read attestation and a CORR-20260925-649e25 and
      O-8/O-9 test before approval.
    - RC-E4-4. CERT-LABEL recomputes the canonical Q_O by the m-J1-4 rule, independently of the orbit search.
  counterexample_or_mutation: >-
    Three cheapest refutations, each embedded and re-runnable.
    (1) B1: C-J3-B1-E4 at (17,0). The literal CERT-BIND holds on exactly the
    680 in-G sums among 46,648 admitted pair sums. The correct build passes
    literal G4 with probability about 4.2e-30.
    (2) B2: one leg-multiset at (17,0) with labels (3,0,+1), (3,3,+1),
    (3,7,+1). Then f = 1 + X^3 + X^7, f(lambda^-1) = 0 mod 239 and f(lambda)
    != 0. M3 gives quotient rank 0 under RANK-A and RANK-B against EVAL 1.
    CERT-LABEL, CERT-QUOT and CERT-BIND all pass under R-piG, so the relation
    routes to O-REFUTE-Q. The control ranks 1.
    (3) J4-B1: grep -n "correction against the attacker"
    ledger/hypotheses/H-BINSTD-ce4f38.yaml returns line 181, and
    version_2.supersedes does not list the field.
  baseline_comparison: >-
    Not applicable to J3, J4 or the PTMs. No attack cost is claimed or under
    review in the owned joints. The only baseline sentences in the files, the
    rho convention (S-17, S-18, A-04, per CORR-20260922-0d365e), were checked
    for scope only and pass. This report states no rho or index-calculus cost
    of its own.
  heuristic_challenges:
    - >-
      None owned. H-BINSTD-ce4f38 has heuristic_assumptions [] (unconditional
      finite arithmetic and linear algebra), and J3, J4 and the PTMs test
      protocol rules. The toy-size review computations do not extrapolate
      beyond showing that the rules as written route specific toy objects.
      The rules are scale-free text, so B1 and B2 hold at every cell where
      h > 1 or m >= 3, respectively. The vanishing-triple count behind B2's
      reach probability is a (17,0) fact only.
  cost_model_challenges:
    - The only cost-type sentences in the four files are the carried H-06 (storage divided by k) and H-08 (a factor-k correction against the attacker). Both fail (J4). No other cost claim exists to audit for uncharged terms.
  reduction_and_scope_challenges:
    - J4-B1, J4-B2 and H-06 above. The citation audit (iv) is clean. No DEC-20260924-99ce20 decision_it_changes framing or DEC-20260924-f0a9c7 rank 1 or target_profile_note is used as scope authority.
  proof_architecture_challenges:
    - >-
      Observation fiber (J3). Hold the certified observable fixed (the labels
      plus CERT-QUOT recomputed at lambda) and vary the ranked quotient row
      between evaluation at lambda and at lambda^-1. That puts one preimage on
      each side, a true equation of rank 1 and a false row of rank 0. The
      missing separator is a binding of the ranked row to the certified row.
    - >-
      Quantifier order (J3). proof_search_map.quantifier_order discharges the
      quantifier over LABELLINGS by CERT-LABEL and CERT-QUOT. The evaluation
      point of the ranked row, meaning the choice among the roots lambda^i
      under X -> X^-1, is chosen by the implementation after certification
      and is never quantified.
    - >-
      Boundary and strictness (J3). CERT-BIND's second clause is satisfiable
      only on the boundary (h = 1, or targets in G). On the designed cells
      (h in {2, 4, 548, ...}), with unprojected RS-3 and RS-4 targets, it is
      not.
    - >-
      Nearby object (J3 (vii)). The null object at k = 1 collapses every
      mutant M1 to M4 to the correct build, and cannot separate instrument
      defects. That is why the certificates, and not the controls, carry D2
      to D4.
    - >-
      Compositional invariant (PTM-B). Delete CTL-NONSTABLE's membership test
      and every non-stable family would be admitted. The would-be conjugate
      rows satisfy the CERT-BIND identities 70/70, so the certificates do not
      back the test up.
  narrowest_supported_statement: >-
    On the committed bytes that TASK-20260925-6e5a63 binds, custody MATCH at
    epoch 4, and at toy size:
    (1) EXP-BINSTD-178742 version 2's literal CERT-BIND cannot be passed by a
    correct build on RS-3 or RS-4 targets outside G. G4 therefore invalidates
    the correct build at its named cell, and every execution halts at SR-3b.
    (2) Under the minimal repair, no rule binds the ranked quotient row to the
    vector CERT-QUOT certifies. An instrument that ranks quotient rows
    evaluated at lambda^-1 passes G4 and every certificate, and routes to
    O-REFUTE-Q at (17,0) and to O-SUPPORT-consistent at (17,1) and (23,0).
    (3) The hypothesis's carried constructive_transforms[0].predicted_gain
    states, for version 2, a factor-k correction against the attacker relative
    to an unnamed accounting.
    (4) RC-4, RC-5, the citation audit and PTM-A to PTM-E hold.
    These are findings about protocol text. They assert nothing about the
    truth of H-BINSTD-ce4f38, any rank identity, any curve, any deployed
    system or GGMP Lemma 3.3.
  next_concrete_action: >-
    For the composer TASK-20260925-3c9c56, as a pointer only: J3 and J4 each
