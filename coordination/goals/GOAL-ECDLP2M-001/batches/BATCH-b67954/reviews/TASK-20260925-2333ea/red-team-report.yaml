      cells: [(17,1) the n = 17 fixture cell, (23,0), both admitted by the frozen E1 table and reproduced; G4 at its named cell (17,0)]
      gates_G0_to_G3_P2-E1_and_P2-5: >-
        None of these exercises the labeller, the conjugate-row builder or the
        quotient evaluator, so every mutant passes them exactly as the control
        does. G0 is planted rank matrices, G1 the fixture's order, lambda and
        factors, G2 the forced-negative enumeration, G3 AR-2 on the F_8 object,
        and P2-E1 cell admission. P2-5 cannot see the mutants either. On the
        null object k = 1, so there is no conjugate row (M1 and M4 do nothing),
        e is always 0 (M2 does nothing) and lambda^-1 = lambda = 1 (M3 does
        nothing). CTL-NONSTABLE tests only whether tau^j(leg) lies in F_W'.
        Only the certificates and G4 can separate M1 to M4. This supports the
        D4 withdrawal of the v1 separator claim for collision (3).
      CONTROL: >-
        R-lit: the first rule to fire is G4. The build fails CERT-BIND j = 1
        ("tau^j(R) != [lambda^j] R") on 16/16 G4 relations, so IR-18 fires and
        SR-3b stops the run invalid before any rank. Effect: every execution is
        invalid. If P2-2b were reached, IR-17 would fire at (17,1) on 16/51
        relations (all RS-3 m = 3) and at (23,0) on 12/51 (RS-3 m = 2 7/16,
        m = 3 5/16).
        R-piG and R-piG-ranked: G4 passes, no rule fires on 51/51 relations at
        either cell, every rank equals EVAL, and the result routes to
        O-SUPPORT-consistent at these cells.
      M1: >-
        Every reading: IR-17 fires first ("legs_j != tau^j(legs_0)" at j = 1) on
        51/51 relations at both cells and on 16/16 at G4. G4 fails (IR-18, SR-3b)
        and the run is invalid.
      M2: >-
        Every reading: IR-16 fires first (CERT-LABEL on row 0) on 51/51 relations
        at both cells and on 16/16 at G4. The run is invalid.
      M2s: >-
        M2s-leg (the eps label flipped on each leg) fires IR-16 on every relation
        under every reading, so the run is invalid. M2s-rep, checked against the
        contract's canonical Q_O, also fires IR-16 on every relation. M2s-rep
        checked against the instrument's own representative (-Q_O) fires nothing
        under R-piG or R-piG-ranked, passes G4 and routes to
        O-SUPPORT-consistent. Under R-lit it behaves like CONTROL. This is a
        consistent change of basis, y_O -> -y_O: the rows are true equations in
        log(-Q_O) and every rank is unchanged. It is recorded, not counted as a
        break. The remaining defect is that v2 does not say which Q_O CERT-LABEL
        uses, so two implementations can label columns differently.
      M3: >-
        R-lit: like CONTROL, G4 fails (B1) and the run is invalid.
        R-piG: G4 passes, and no rule fires on 51/51 relations at (17,1) or
        (23,0), where no relation vanishes, so both route to
        O-SUPPORT-consistent. At (17,0), all 1530 vanishing leg-multisets pass
        every certificate, including on re-run at P2-6, and give RANK-A =
        RANK-B = 0 against EVAL 1, so they route to O-REFUTE-Q. Example (labels
        (3,0,+1), (3,3,+1), (3,7,+1), f = 1 + X^3 + X^7): M3 quotient rank 0,
        the control's quotient rank 1, raw class rank 16 under both.
        R-piG-ranked: IR-15 fires on 51/51 relations and G4 fails, so the run is
        invalid.
      M4: >-
        Every reading: IR-17 fires first ("legs_j != tau^j(legs_0)"; rows 1..k-1
        built as tau^(j+1)) on 51/51 relations and on 16/16 at G4. The run is
        invalid.
    epoch4_quotient_row_rule:
      file: experiments/EXP-BINSTD-178742/specification.yaml
      field: experiment.definitions.certificates.CERT-QUOT (lines 347-353); per-leg certificate CERT-LABEL (lines 341-346)
      quoted: >-
        CERT-QUOT: "for each admitted relation with target R, sum over hit class
        orbits O of [f_O(lambda) mod r] Q_O = pi_G(R), computed on the curve by
        at most m + 1 scalar multiplications. It is evaluated at the lambda of
        AR-2, never at lambda^{-1} or another root of unity." CERT-LABEL: "Per
        leg P with assigned label (O, e, eps): the instrument recomputes pi_G(P)
        = [h (h^{-1} mod r)] P and eps [lambda^e] Q_O by scalar multiplication on
        the curve, independently of the tau-orbit search that assigned (e, eps),
        and checks equality."
      position: >-
        procedure.steps P2-2b (lines 1254-1261): "Per admitted relation, before
        any rank is computed: CERT-LABEL on every leg of row 0, CERT-QUOT on row
        0, then build rows 1 to k-1 curve-side and run CERT-BIND on each." The
        step order is P2-E1, P2-G4, P2-1, P2-2 (AR-1), P2-2b, P2-5, P2-3 (ranks),
        P2-4, then P2-6. At P2-6 the certificates are re-run on each candidate
        (P2-6 v2_addendum, lines 1299-1305).
      coverage: every admitted relation (not sampled, not candidates only), plus a re-run on each P2-6 candidate
      blocking: >-
        INVALIDATING, not merely reported. P2-2b: "A relation on which any
        certificate fails is not ranked". Failures fire IR-15 (CERT-QUOT, line
        1424), IR-16 (CERT-LABEL) and IR-17 (CERT-BIND). success_criterion_v2
        (1) requires that "no invalidation rule (IR-1 to IR-19) fires", and lists
        as NOT EVIDENCE "invalid (including any certificate or self-test
        failure)".
      gap: >-
        CERT-QUOT evaluates f_O, the polynomial built from the relation's LABELS
        (definitions.orbit_polynomial), at lambda. Nothing requires that the
        vector RANK-A and RANK-B rank for rank_quotient (definitions
        .quotient_basis, P2-3) is the vector CERT-QUOT certified. The producer's
        own discharge note works through the labels: revision-worksheet defect
        D2 says M2 "fails CERT-QUOT wherever the flip changes the equation".
        proof_search_map.quantifier_order discharges the quantifier over
        LABELLINGS by CERT-LABEL and CERT-QUOT. It does not discharge the
        quantifier over the evaluation point of the ranked row. So "checks that
        the quotient row is the TRUE equation" holds for the recomputed row, not
        for the ranked row. M3 and PTM-F both fall in that gap.
      absence_statement: >-
        A rule that binds the RANKED quotient row to the certified one is
        ABSENT. A per-relation, pre-rank, blocking quotient-equation certificate
        is PRESENT.
    epoch4_d3_d4_vii: >-
      D3: CERT-BIND clause 1, "the legs of row j equal tau^j of the legs of row
      0", binds conjugate row j to tau^j of row 0. It fires on M1 and M4 on every
      relation under every reading. Clause 2, "sum of its legs = tau^j(R) =
      [lambda^j] R", is the over-strict part (B1): it is an identity only on G,
      and the RS-3 and RS-4 targets are not projected. D4: collision (3) is
      restated as "SEPARATED BY CERT-BIND (IR-17)", and the v1 claim is withdrawn
      (proof_search_map.observation_collision). M1 and M2 are pre-registered at
      G4 (CTL-INSTRUMENT-SELFTEST; step P2-G4 after P2-E1 and before any rank
      readout). A G4 failure routes to IR-18 and SR-3b, which is NOT EVIDENCE and
      never O-REFUTE or O-SUPPORT. As written, however, G4 fails the correct
      build at its own named cell (B1; its size is in C-J3-B1-E4). (vii) CTL-NULL
      and CTL-NONSTABLE stay blocking (SR-6; IR-5 as extended; IR-6), and P2-5 now
      runs before P2-3 (O-12). No certificate makes the null object vacuous. At
      k = 1, CERT-BIND has no conjugate row to bind and is vacuous by
      construction, while CERT-LABEL and CERT-QUOT at lambda = 1 are real checks
      (PTM-A, C-PTM-E4). CTL-NONSTABLE's test is membership of every tau^j(leg)
      in F_{W'}, which does not depend on any certificate (PTM-B).
