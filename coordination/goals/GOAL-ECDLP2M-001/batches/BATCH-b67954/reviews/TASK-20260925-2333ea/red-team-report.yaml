    PTM-A:
      result: MET
      object: >-
        The null object E_b: y^2 + xy = x^3 + x^2 + b over F_2^17 (field
        X^17 + X^3 + 1). b = 0x2cbd was drawn by seed from F_2^17 minus F_2 and
