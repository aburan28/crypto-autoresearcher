        per CTL-NULL v2_reading. Then r = 3847 and h = 34, and W = ker f1(tau)
        with dim 8, |F_W| = 264, 128 classes.
      run: >-
        C-PTM-E4. The instrument computes d_min = 17, q = 2^17, k = 1 and
        lambda = 1. AR-2_v2 passes trivially, since ord(lambda) = 1 = k. No
        conjugate row is formed, so the CERT-BIND range 1..k-1 is empty. There
        are 83 relations (RS-1 with 32 targets, RS-3 with 64 m = 2), all
        admitted. CERT-LABEL and CERT-QUOT pass at lambda = 1 on 83/83; these are
        real checks, not vacuous ones. Raw class rank = quotient rank = 1 on
        83/83, and raw point rank = 1 on 83/83. tau(P) = (x^2, y^2) lies on E_b
        for 0 of 166 sampled legs, which is L6. rank_kerg is NOT COMPUTED, by
        definitions.ker_g_null_expectation, so the ker-g column enters no
        basis-difference reading. Forming it fires IR-5 (extended) and IR-19.
      against_signature: >-
        "PTM-A reports identical raw and quotient ranks, the stated ker-g
        expectation and no Frobenius effect." All three hold, so v1's O-10
        basis difference is no longer reachable. Power check: a naive
        formation at k = 1 would give g-hat(1) mod r = wt(f1) = 5, which is
        nonzero, so deg h_g = 0 and rank_kerg = 0 against raw = quotient = 1.
        That is exactly the forbidden difference, and v2 invalidates it (IR-19).
      note: >-
        Minor and non-breaking. The rule is sound, but its stated reason ("the
        ker-g basis presupposes ord(lambda) = k with lambda != 1, which cannot
        hold at k = 1") is imprecise. At k = 1 the formula is formally
        evaluable, with lambda = 1 of order 1 = k. The operative reason is L6:
        tau is not an endomorphism of E_b, so the identities g-hat(tau) Q = O
        that the ker-g basis imposes have no meaning there.
