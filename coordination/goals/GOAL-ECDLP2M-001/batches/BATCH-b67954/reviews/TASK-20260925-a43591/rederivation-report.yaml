  environment:
    language: Python 3.12.3 (CPython, GCC 13.3.0), standard library only (command C01)
    libraries: >-
      math (exact integer factorial and binomial sums, float cross-checks), decimal (60- to 80-digit arithmetic),
      re, json, random (Random(20260925) for 24 Miller-Rabin bases), os, hashlib, datetime
    not_used: >-
      mpmath, sympy and gmpy2 are absent from this runtime and were deliberately not installed. PyYAML 6.0.1 is present
      and is used only to check that this report parses (final command).
    tools: >-
      bash; GNU coreutils sha256sum 9.4; ripgrep 15.1.0-cursor5 (navigation of the FIPS and Certicom texts only, never the
      Semaev paper); awk; the runtime's Read and Grep tools
    host: Cursor Cloud Agent VM, Linux 6.12.94+
    algorithms: >-
      Miller-Rabin (40 fixed prime bases plus 24 seeded random bases); Tonelli-Shanks for the Frobenius eigenvalue mod r;
      its multiplicative order by dividing n by each prime factor q while lambda^(n/q) = 1 mod r (n is prime here); the
      trace of a over F_2 (squaring in F_(2^n)) for the parity check; the FIPS D.4 Lucas recurrence for #E(F_(2^d)); pi by Machin's
      formula in decimal; base-2 logarithms as ln(x) / ln(2) in decimal; exact m! and binomial sums; closed-form linear
      roots for D_real. No curve instantiated, no point arithmetic, no rho walk, no Groebner, XL, SAT or F4 solver (BL-6).
  independent_recomputation:
    recomputed_by_this_card: >-
      Every value in Q0 to Q3, from curve parameters read by line number out of the primary texts and from formulas
      written out from the paper and the amendment. No cost, rho figure, optimising m or threshold was transcribed from any
      source (BL-3), and no producer artifact was seen. Scripts S10, S13, S14, S15, S17 and S19; S16 formats, S18 and S20 cite.
    rechecked_by_a_second_path:
      - Q1 k by two methods sharing no step, the eigenvalue order mod r and the least d with r dividing the Lucas order (agree on all Koblitz rows)
      - 'Q1 log2 in float (math) and in 80-digit decimal with a Machin pi: agreement to 1e-10'
      - 'the Koblitz orders 2^n + 1 - V(n) against h r exactly, and against FIPS D.4''s printed V(283) and V(571)'
      - 'every r: Miller-Rabin; every h r: the Hasse interval and odd trace; the trace-parity rule (recalled; a consistency check only)'
      - 'Q2: float against 60-digit decimal (3e-14); three cells by hand'
      - 'Q3: decimal root against float root (at most 1.8e-15); S16 re-derives every minimum from the table lines and matches S14'
      - 'Q0-2 and Q0-8: S15 (float, typed pi) and S19 (decimal, Machin pi) give identical counts and extremes'
      - the final read-back (last command) re-parses this file and checks every Q3 line against S14's raw output, and D_int against the ceiling of the real root
    disjointness: >-
      All code was written in this session from the statements alone. It shares no code with the producer's implementation,
      which this card never saw (blind_from). The second paths above are disjoint in method but share this card's own
      parameter parsing: a misread line would propagate to both, which is why the parameter checks exist.
    taken_on_another_party_word:
      - the commit and push status of the amendment and the whitelisted inputs (the dispatcher's; no git was run)
      - that the whitelisted files hold no leaked value beyond those redacted (the Coordinator's whitelist search and forward-precondition grep); this card's own reading found none in the parts read
      - r and h of the B-curves and the random Certicom curves, which BL-6 forbids re-deriving by point counting; consistency-checked only
      - the fidelity of the three text extractions to their PDFs (the custody sidecars bind only the text files)
      - the resolved model identity (the launch prompt's; model_verified false)
    scope: >-
      Arithmetic on Semaev 2015's published stage-1 cost model under the pinned readings: Q2 at n = 571, 283 and 359; Q3,
      D*(m) for m = 2..30 at n = 571 for K-571 and B-571 at omega = 3. The claim tier is a heuristic estimate, conditional on
      Assumption 1 (d_F4 <= 4) at D = 4 and on its degree-D replacement in Q3. This is not a measurement, not an attack and
      not a statement about any curve's security. Q1 is the pinned rho expectation, not a measured rho.
    terms_the_pinned_model_does_not_charge: >-
      Recorded so no Q value is read as more than it is. Memory: none charged, although stage 2's sparse linear algebra over
      about 2^k relations and the Groebner steps need memory. O-constants: all 1. Building each Boolean system
      (summation-polynomial evaluation, Weil descent) and the decomposition trials that fail are uncharged. Stage 2 is
      reported only as a dominance check. In Q3, the field-operation count is compared with rho's group-operation count with
      no conversion. P uses its first-order form (Q0-2). Q1 carries no distinguished-point or parallel-rho overhead. Each is
      part of the pinned definitions; this card changes none of them and gives no verdict on the contract (BL-5).
    cost_bookkeeping_check: eq. (15) is 2^k relations x per-attempt solve cost n^(4 omega) x inverse success probability 1/P, as evaluated; success is never taken as certain
    falsification_tests:
      - 'a misread parameter line would break primality, the Hasse bound, the trace-parity rule or the Lucas identity: all passed (S10)'
      - 'a wrong k would split the two k methods: they agree (S10)'
      - 'an inconsistent k reading would put KR-B above KR-A at some m: the algebraic identity in Q0-1 forbids it, and the S13 curves obey it'
      - 'a Q3 formatting or threshold error would break D_int = ceil(real root) or D_int = 4 where the margin at D = 4 is positive: checked by the final read-back'
      - 'a precision artefact would split float from decimal: largest gap 1.8e-15 (Q3), 3e-14 (Q2)'
      - 'not constructible here: a test of whether the pinned model is the right model; that is outside J9 and the card forbids comparison'
