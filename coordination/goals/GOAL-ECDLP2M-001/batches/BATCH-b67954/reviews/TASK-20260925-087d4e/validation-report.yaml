        (b) An INDEPENDENT RE-IMPLEMENTATION: Python decimal at 80 digits with
        exact integer factorials and a series for 1 - exp(-x). It imports
        nothing from joint_balance.py and uses no math.lgamma, log2 or expm1, so
        its lineage is disjoint from the instrument. Over m = 2..30 the two
        paths agree to 5.5e-13 bit or better at every m, at both degrees and
        under both readings (C-J3-fixture-both-readings).
      what_holds:
        - >-
          D-7 numbered choice. definitions.model_identification_choices MI-1 states
          the k-rounding reading, its textual basis, the disclosed move and its
          carriage; frozen_c2_fixture.model_identification states that F1
          identifies the frozen instrument's reading, not a model the published
          text determines. MI-1 transcribes its textual basis from D-7 ("not
          re-read by this session"), so I read it at source in
          inputs/SEMAEV-2015-310/paper_fulltext.md. Section 4.5.2 defines
          k = ceil(n/m) (line 1064), and its eq. (15) evaluation reads "For
          omega = 3 that is at most m! 2^(n/m) n^12" (lines 1080-1091), the
          k = n/m value. Table 3 minimises that same expression (lines
          1130-1143). The basis holds.
        - >-
          Disclosed moves against my numbers. Frozen reading (unceiled):
          C_I(571, 3.0) = 186.3069518 at m* = t* = 12, with runner-up m = 13 at
          +0.040183 bit. Ceiled reading: 175.1383037 at m* = 15, a move of
