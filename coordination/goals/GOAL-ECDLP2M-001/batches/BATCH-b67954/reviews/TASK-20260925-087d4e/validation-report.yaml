        - >-
          Carriage. H1 formal_statement says "with k = n/m in the cost model
          (MI-1)", and H1.mi_1 restates the choice, its basis, the move and the
          per-m reading. d_star_of_m defines A(571, m) "under MI-1 (k = 571/m
          unceiled)" and puts the ceiled column beside every m. Stage 6 writes
          that column into the threshold table, and d_star is defined as
          D*_R(c, omega, m*) of d_star_of_m, so it inherits the choice.
        - >-
          Fixture PASSES as frozen. At 571, |186.3069518 - 186.307| = 4.82e-5 bit
          and the argmin is m = t = 12. At 283, |147.6494784 - 147.649| = 4.784e-4
          bit and the argmin is m = t = 9 (runner-up m = 10 at +0.177 bit). The
          tolerance is 5.0e-4, inclusive, so both targets pass. The 283 pass has
          2.2e-5 bit of headroom. The canonical margin_note discloses this (4.78e-4)
          and correctly calls it an artifact of the three-decimal grid. The two
          paths agree to 5.5e-13 bit, about seven orders of magnitude inside that
          headroom, so the pass is not sensitive to floating-point error.
        - >-
          Targets at source. RUN-SEMBIN-a7a2f3 raw-result.json (sha256 6d72fffd...,
          matching its artifact-digests entry), rows n = 571 and n = 283, block
