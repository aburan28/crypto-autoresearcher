    D-14_order_certificate: >-
      CARRIED. AR-ORDER, version 3. Route 1: the trace count #E = 2 + 2 #{x
      != 0 : Tr(x + A + B/x^2) = 0}, 2^19 trace evaluations (the CERTBIN
      routine's pure-Python branch). Route 2, the Hasse certificate: h q
      (BIN-ORD-19: h = 2, pointer q = 261823; BIN-KOB-19: h = 4, pointer l =
      130873) with q proved prime by deterministic Miller-Rabin, a seeded
      point P with [h]P != O and [h q]P = O, so q divides #E; since q > 4
      sqrt(2^19) (about 2896), at most one multiple of q lies in the Hasse
      interval |#E - 2^19 - 1| <= 2 sqrt(2^19), and it must equal h q. For
      BIN-KOB-19 the Lucas recurrence is a third route (TASK-20260928-d5024b
      E06). The version-2 naive count enumerates 2^38 (x, y) pairs and is
      removed (RB-S3).
    D-15_coset_factor: >-
      RESTATED (now charged). Version-3 text, carried: With F_i = F
      intersected with the i-th coset of G (index h), the mean number of
      ordered pairs of F summing to a uniform element of G is sum_i |F_i|
      |F_-i| / |G|, against |F|^2 / #E for a uniform element of E. F is
      closed under negation, so |F_-i| = |F_i| and the ratio is h sum_i
      |F_i|^2 / |F|^2, at least 1 with equality iff F is balanced over the
      cosets (Cauchy-Schwarz). It is quadratic in the imbalance (a 3 percent
      imbalance at h = 2 changes it by about 1e-3: 2 (0.515^2 + 0.485^2) =
      1.0009). VERSION 4 (R3-J3-2): the factor is no longer only reported;
      mu_eff = f mu_c enters every prediction through cell_model, the block
      composition with it (D-19), and AR-COSET bounds the admitted
      compositions (D-20). mu_c stays |F|^2 / (2 #E) and AR-MU still reads
      mu_c.
    D-16_coverage_families_and_kappa_range: >-
      NEW. (a) Matched-mean families (fixture_code coverage_values). With q =
      ratio (1 - e^-mu_eff) and E D = mu_eff kept, E[D | D >= 1] = mu_eff /
      q. Low dispersion, D | D >= 1 on {1, 2}: P(D = 2 | D >= 1) = mu_eff /
      q - 1; each decomposition usable with probability u = u_pred; p_use =
      q u (1 + (mu_eff / q - 1)(1 - u)). At mu = 1, u = 0.634910, ratio 0.95:
      q = 0.600515, P(D = 2 | D >= 1) = 0.66524, p_use = 0.600515 (0.33476 x
      0.63491 + 0.66524 x 0.86671) = 0.47387; a_ratio = (1 - e^-0.634909) /
      p_use = 0.470016 / 0.47387 = 0.99186. At ratio 0.90: q = 0.568909,
      p_use = 0.461132, a_ratio = 1.01927 (the version-3 red team's
      counterexample input 1.0193, TASK-20260929-810095 J3-D1). (b) z of
      P20 and P21 by hand: n_att = n_t a_pred a_ratio = 1365 x 2.127585 x
      a_ratio (2880.5 and 2960.1); se = sqrt(0.632121 x 0.367879 / n_att)
      (0.0089850 and 0.0088634); z = (ratio - 1) 0.632121 / se = -3.518 and
      -7.132, both below -3.3: T_kappa low, the coverage deficit flagged on
      both cells (C-6 confirms both classes and labels). (c) Admissible z
      range of T_kappa: kappa_hat >= n_t / n_att = 1/a_bar because every
      successful attempt is nonempty; at the nominal attempt count z lies
      in [(0.470017 - 0.632121) / 0.0089484, 0.367879 / 0.0089484] = [-18.1,
      +41.1] on a binary cell, and on CTRL-ZN (kappa_pred 0.0307666, a_pred
      50.903, n_att 69483, se 6.5511e-4) in [-17.0, +1480]; z_low = (1/a -
      kappa_pred) sqrt(n_t a) / sqrt(kappa_pred (1 - kappa_pred)) falls as
      a_bar grows, to about -1.5e4 at a_bar = MAX_ATTEMPTS on a binary cell.
      Both sides are reachable, so T_kappa can fail both ways.
    D-17_group_operation_bound: >-
      NEW (J3-O7). A reuse-arm target attempt computes Q_t + c P0 for one
      seeded scalar 0 < c < N. A left-to-right double-and-add uses
      bit_length(c) - 1 doublings and at most bit_length(c) - 1 additions,
      at most 2 bit_length(N) - 2 operations; with the one addition of Q_t
      an attempt costs at most 2 bit_length(N) - 1, below the bound
      gops_per_attempt(N) = 2 bit_length(N) + 2 (whose docstring counts the
      multiplication as at most 2 bit_length(N), looser still). CTRL-ZN: N =
      1048583, bit_length 21, bound 44 per attempt. Certificates are not
      charged (lin_combo restores the counter). A pipeline that spends
      generic group operations per target beyond this, for example a rho walk
      per target, exceeds the bound in proportion to its walk length and
      fires IR-12 (P23). The bound is on operations per ATTEMPT, so it is
      neither moved by the attempts law nor confined by it.
    D-18_seam_arithmetic: >-
      NEW (R3-J3-1 item (5)). With the flag at z below -3.3 the deficits
      version 3 flagged at z <= -3 but no longer flagged are those with z in
      (-3.3, -3]. The flagged edge scales close to linearly in z in each
      family at the nominal binary regime: kappa_ratio-only edge 0.046716 at
      z = -3.3 (C-5), so about 0.04247 at z = -3; low-dispersion
      matched-mean edge 0.046943, about 0.0427 at z = -3; high-dispersion
      edge 0.046117, about 0.0419 at z = -3 (linear scaling, an
      approximation; n_att moves slightly with the deficit). Hence the
      unflagged band is matched-mean deficits of about 4.2 to 4.7 percent,
      which version 3 flagged but routed to PASS and version 4 neither flags
      nor fails; certifies_only excludes them.
    D-19_coset_block_arithmetic: >-
      NEW (R3-J3-2). Pair mass of a self-paired block of n_k columns is
      proportional to n_k^2 (each column contributes two points of the same
      coset), so w_k = pi_k^2 / sum pi_j^2 and f = h sum_k P_k / |Sigma|^2;
      for BIN-ORD-19 f = 2 (pi_0^2 + pi_1^2) and d_k = 2 w_k / pi_k = 4 pi_k
      / f. At shares 0.570711 and 0.429289 (f = 1.02): d = 2.2381 and 1.6835
      (C-4 at its realised f = 1.019775: 2.2370 and 1.6854). One-step
      iteration of y = 1 - exp(-d y) gives rho about 0.851 and 0.682 (about
      0.005 precision), delta_pred = 0.5707 (0.851) + 0.4293 (0.682) = 0.7785
      (C-4 0.77946), u_pred = 0.6386 (0.851^2) + 0.3614 (0.682^2) = 0.6306
      (C-4 0.63162), against delta_pred^2 = 0.6061, an offset of +0.0245.
      Fixed-edge spread: var_m(c) = rho (1 - rho)(1 - 2 c rho (1 - rho)) /
      s^2, s = 1 - c (1 - rho); at c = 2, rho = 0.796812: rho (1 - rho) =
      0.161904, s = 0.593624, s^2 = 0.352389 and 1 - 4 (0.161904) = 0.352384,
      so var_m(2) = 0.161904 (1.0000) = 0.40237^2; scale = 0.403^2 /
      var_m(2) = 1.0031. (coset_model.fixed_edge_spread_check and
      why_the_blocks_not_only_f.)
    D-20_cycle_excess: >-
      NEW. Edges inside a giant of fraction rho on n columns at mean degree
      d: (d n / 2)(1 - (1 - rho)^2) = (d n / 2)(2 rho - rho^2); less its n
      rho vertices, the expected cycle excess is E = n rho (d (1 - rho / 2) -
      1). Each nonzero element of the cycle space is unbalanced with
      probability 1/2 under random signs, so with excess X the giant is
      undetermined with probability 2^-X, and with X about Poisson(E),
      E[2^-X] = exp(-E / 2). Balanced: n = 128, d = 2, rho = 0.796812: E =
      101.992 (2 (0.601594) - 1) = 101.992 x 0.203188 = 20.724 (C-4
      20.7235); n = 256: 41.447. BIN-KOB-19 block {2} at f = 1.02: n = 102,
      d = 1.5615, rho = 0.6203: E = 63.27 (1.5615 x 0.68985 - 1) = 63.27 x
      0.07720 = 4.88 (C-4 4.8765), exp(-2.44) = 0.087 (C-4 0.0873). The
      floor E >= 10 bounds the per-block probability by exp(-5) = 0.0067.
      The Poisson model of X is an approximation; at E near 0 the printed
      bound exp(-E/2) can exceed 1 (C-4: 1.00004 at E = -7.5e-5), which is a
      property of the formula, not a probability.

