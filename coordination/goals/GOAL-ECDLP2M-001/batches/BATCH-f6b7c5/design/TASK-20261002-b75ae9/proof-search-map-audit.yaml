      CARRIED. Carried from version 2 unchanged (the log-convexity proof that
      the continuum envelope is contiguous at every g below the closing g;
      read line by line and found valid by TASK-20260929-45204f J1 item iii
      (d)). At fixed C, with t = ln B and mu = B^4 / K, non-emptiness is 4ab
      < 1 with ab proportional to f(t) = C A^2 B + 4 A B^2; d ln A / d t = -4
      mu / (e^mu - 1) is increasing in t, so ln A is convex, both terms are
      log-convex, f is log-convex hence quasi-convex, its sublevel set is an
      interval, and the projection on L of the connected set {(B, L) :
      L_lo(B) < L < L_hi(B)} is an interval. The discrete grid flag is
      stage0_code's check.
    D-3_determined_law_m2: >-
      RESTATED (per block). Version-3 text: At m = 2 a relation is a signed
      edge between its two leg columns; R = B relations give a random
      multigraph of mean degree c = 2. A column is determined iff its
      component contains an unbalanced cycle (sign product -1) or a
      coefficient-2 loop; tree components are touched but carry one free
      variable whatever the solver. The giant component has fraction y = 1 -
      exp(-c y), y = 0.796812; it is determined with probability tending to
      1; so delta_inf = 0.796812 and u = delta_inf^2 = 0.634909. A reviewer
      Monte Carlo gives mean determined 0.7983 at B = 128 and 0.7970 at
      B = 512, with the 5th to 95th percentile of delta_hat^2 [0.5393,
      0.7252] and [0.5892, 0.6826] (TASK-20260928-d5024b E05), so the
      graph-level sd of delta_hat is 0.0356 at B = 128 and 0.0178 at B = 512,
      that is 0.403 / sqrt(B). Touched values, diagnostics only: tau =
      0.864665, touched usable 0.747645. VERSION 4: on a binary cell the
      relation graph is the disjoint union of its coset-block subgraphs
      (coset_model), so the law is applied per block at the block's mean
      degree d_k = 2 w_k / pi_k, delta_pred = sum pi_k rho(d_k) and u_pred =
      sum w_k rho(d_k)^2 (D-19); "determined with probability tending to 1"
      becomes, at finite block size, undetermined with probability about
      exp(-E_k / 2) for a giant of expected cycle excess E_k (D-20). At
      balance every block has d_k = 2 and the version-3 values hold.
