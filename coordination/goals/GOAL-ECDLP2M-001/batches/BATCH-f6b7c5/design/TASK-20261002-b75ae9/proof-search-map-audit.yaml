            ("P6", pat(ord=yld, kob=yld), ("H1-NEGATIVE-YIELD", "H2-POSITIVE", "NEGATIVE")),
            ("P7", pat(ord=yld, kob=yld, audit_discrepancies=((ORD_CELL, 2),)),
