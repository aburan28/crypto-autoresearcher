      G1_fail_count: 30 of 4000
      G1_conjunct_fail_rate: {a_ic_phi_pass: 0.0075, b_null_discriminates: 0.0, c_ctl6_delta: 0.0, g_no_abandoned_reuse_target: 0.0}
