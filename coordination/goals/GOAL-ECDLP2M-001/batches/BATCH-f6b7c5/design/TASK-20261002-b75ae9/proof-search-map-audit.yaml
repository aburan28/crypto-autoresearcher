  # ---------------------------------------------------------------------------
  admissible_ranges:
    rule: >-
      For every gated observable, the set of values it can take for
      ARBITRARY data under the contract's admission and fit rules, beside its
      pass band. None is confined inside its pass band; each can fail on both
      sides unless noted. Bands per cell from the charged model (cell_model;
      one-block values at balance shown).
    reduction_in_the_reuse_arm: >-
      In the reuse arm the per-target units are attempts x w_c and do not
      depend on L by construction. Hence FR = a_bar / a_pred EXACTLY; KR x FR =
      rho_rel EXACTLY, so KR = rho_rel a_pred / a_bar; and d_sigma =
      sigma_pred(KR K_pred) - sigma_pred(K_pred) up to per-L sampling noise,
      so AM3 is a function of KR. AM1 to AM3 reduce to the pair (rho_rel,
      a_bar), now each also gated directly (T_rho, T_a). AM3 is DOMINATED by
      AM1 in the reuse arm (it passes for KR in about [0.509, 2.083] on
      CTRL-ZN and [0.421, 3.651] on a binary cell, TASK-20260929-594e8d J3-D3
      and TASK-20260929-810095 C07, strict supersets of the KR bands). The
      L-DIMENSION of the amortisation law is NOT TESTED by the reuse arm as
      designed; AM3 is kept because the no-reuse null's L-dependence shows on
      it.
    items:
      - observable: AM1 KR = rho_rel a_pred / a_bar
        admissible: "(a_pred / (A(mu_eff) x 100000), infinity): about (1.6e-5, infinity) on CTRL-ZN and (1.3e-5, infinity) on a binary cell; rho_rel is uncapped"
        pass_band: per cell exp(+-3.5 s_lnKR); design CTRL-ZN [0.641, 1.560], binary nominal [0.851, 1.175]
        can_fail: both sides
      - observable: AM2 FR = a_bar / a_pred
        admissible: "[1 / a_pred, MAX_ATTEMPTS / a_pred]; about [0.0196, 1965] on CTRL-ZN, [0.470, 47002] on a binary cell"
        pass_band: per cell exp(+-3.5 s_lnFR); design CTRL-ZN [0.723, 1.382], binary nominal [0.877, 1.141]
        can_fail: both sides
      - observable: AM3 d_sigma
        admissible: "in the reuse arm (-1 - sigma_pred, -sigma_pred) up to per-L noise: about (-0.360, +0.640) on CTRL-ZN and (-0.168, +0.832) on a binary cell"
        pass_band: "[-0.10, +0.10]"
        can_fail: both sides (dominated by AM1 in the reuse arm)
      - observable: T_delta delta_hat
        admissible: "[0, 1]; at or above 0.95 fires IR-10"
        pass_band: "delta_pred +/- 3.3 sd_delta: [0.679, 0.914] at B = 128; [0.738, 0.856] at B = 512 balanced"
        can_fail: both sides
      - observable: T_u u_hat - u_ref, u_ref = sum w_k delta_hat_k^2
        admissible: "[-u_ref, 1 - u_ref]"
        pass_band: "+/- 3 sqrt(u_ref (1 - u_ref) / n_dec)"
        can_fail: both sides
      - observable: T_a a_bar - 1/p, p = 1 - exp(-mu_eff u_hat)
        admissible: "[1 - 1/p, MAX_ATTEMPTS - 1/p]"
        pass_band: "+/- 3 sqrt(1 - p) / p / sqrt(n_t) (conservative: z-sd 0.79 to 0.90 under the model)"
        can_fail: both sides
      - observable: T_kappa z_kappa (NEW)
        admissible: "kappa_hat in [1/a_bar, 1] (every successful attempt is nonempty, so at least n_t of n_att = n_t a_bar attempts are nonempty): z in [(1/a_bar - kappa_pred)/se, (1 - kappa_pred)/se] with se = sqrt(kappa_pred (1 - kappa_pred) / n_att); at the nominal attempt count about [-18.1, +41.1] on a binary cell and [-17.0, +1480] on CTRL-ZN; the lower end falls further as a_bar grows (to about -1.5e4 at a_bar = MAX_ATTEMPTS on a binary cell) (producer arithmetic, D-16)"
        pass_band: "|z| <= 3.3: kappa in about [0.6026, 0.6617] (binary nominal), [0.02860, 0.03293] (CTRL-ZN)"
        can_fail: both sides
      - observable: T_rho ln rho_rel (NEW)
        admissible: "rho_rel in [kappa_pred, infinity) (at least B relation attempts): ln rho_rel in [ln kappa_pred, infinity), about [-0.459, infinity) at mu = 1 and [-3.48, infinity) on CTRL-ZN"
        pass_band: "+/- 3.3 sqrt(exp(-mu_eff) / B_c): rho_rel in about [0.915, 1.092] (binary nominal), [0.750, 1.333] (CTRL-ZN)"
        can_fail: both sides
      - observable: T_cmp (u_hat_c - u_hat_ZN) - (u_pred_c - u_pred_ZN)
        admissible: "about [-1, 1]"
        pass_band: "+/- 3.3 sqrt(var_c + var_ZN), about 0.21 at nominal"
        can_fail: both sides
      - observable: null arm (CTL-8) outside the cell's AM1, AM2 and AM3 bands with KR below 0.125
        admissible: as for AM1 to AM3
        pass_band: n/a (IR-9 fires if it fails)
        can_fail: IR-9 is reachable (P9)
      - observable: pooling constant c(L)
        admissible: "(0, infinity); outside [0.5, 2] invalidates the rho reading"
        pass_band: "[0.8, 1.3] (H2)"
        can_fail: both sides inside the instrument band
      - observable: exponent_rho
        admissible: "[-0.8, -0.2] given c(L) in [0.5, 2]; [-0.605, -0.395] given the pooling band (disclosed link)"
        pass_band: "[-0.6, -0.4]"
        can_fail: both sides

