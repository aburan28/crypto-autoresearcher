    giant_undetermined_bound_of_the_lowest_block: {f1_ORD: 1.0e-9, f1_KOB: 3.2e-5, f102_ORD: 2.8e-4, f102_KOB: 0.0873, f105_ORD: 0.0355, f105_KOB: 0.600, f110_ORD: 0.583, f110_KOB: 1.00004}
    h1_axis_given_G1:
      f_1.0: {H1-POSITIVE: 0.98212, H1-MIXED: 0.01788}
      f_1.02: {H1-INCOMPLETE: 1.0}
      f_1.05: {H1-INCOMPLETE: 1.0}
      f_1.10: {H1-INCOMPLETE: 1.0}
      note: >-
        At 1.02, 1.05 and 1.10 the representative BIN-KOB-19 composition is
        halted by AR-COSET, so every replicate is H1-INCOMPLETE; the axis at
        BIN-ORD-19 f = 1.02 with BIN-KOB-19 balanced (P26's configuration) is
        not a printed row. Under independence of the two cells' draws, an
        assumption, it would be about (1 - 0.0195)(1 - 0.013) = 0.968
        H1-POSITIVE (producer arithmetic).
    other_rates: 'null_not_discriminating_rate 0.0 on BIN-ORD-19 at every f and on CTRL-ZN (G1 (b)); IR10_rate 0.0 and abandoned_rate 0.0 on every cell at every f'
    restated_most_likely_inputs: >-
      G1 pass 0.9925; H1-POSITIVE given G1 at balance 0.98212; the H2 factor
      about 0.93 carried from the version-3 statement (0.916 / (0.99425 x
      0.98843), the version-2 reviewer random-mapping Monte Carlo of
      unchanged H2 rules); product about 0.91. Producer arithmetic on the
      printed figures.
    findings_design_figures_only:
      - >-
        At balance the realised per-cell non-PASS rates differ by cell: 0.75
        percent (G1 on CTRL-ZN), 0.875 percent (BIN-ORD-19) and 1.30 percent
        (BIN-KOB-19). The bands equalise the nominal standard-deviation
        multiple, not the realised rates (R3-J3-5). BIN-KOB-19's T_u high
        rate falls from 0.375 percent (uncharged) to 0.15 percent (charged,
        the block-resolved reference), which discharges J3-O5.
      - >-
        Charging the blocks is necessary: the same H1-true draws read through
        the uncharged one-block predictions are non-PASS in 45.6 and 54.3
        percent of replicates at f = 1.02 and in 96 to 100 percent at 1.05
        and 1.10, mostly T_u high.
      - >-
        Every admitted composition has a charged non-PASS of at most 1.95
        percent (BIN-ORD-19 at f = 1.02). The two halted compositions with a
        high waived rate (BIN-KOB-19 at 1.02, 10.1 percent; BIN-ORD-19 at
        1.05, 7.7 percent) are the T_delta-low tail the cycle-excess floor
        exists for (lowest-block excess 4.9 and 6.7; giant undetermined bound
        0.087 and 0.036).
      - >-
        The halted compositions with a LOW waived rate (BIN-KOB-19 at 1.05
        and both cells at 1.10, 0.875 to 1.15 percent) are not safe compositions:
        the charged sd of delta there is 0.034 to 0.236 against 0.018 at
        balance, so T_delta's band is wide and the test has lost its power;
        the lowest block sits at degree 1.0 to 1.3, inside or near the
        critical window, where the giant-component law the charge uses is not
        the right description. AR-COSET halts them for that reason, not for a
        false-fail rate.
      - >-
        BIN-ORD-19 at f = 1.02 is admitted with a T_delta-low rate of 1.25
        percent against 0.125 percent at balance, while its lowest block's
        undetermined-giant bound is 2.8e-4. The excess floor does not explain
        that elevation; this producer's reading, not verified, is the skew of
        the giant fraction at block degree 1.69 on 220 columns, which the
        normal band does not carry. The rate inside the admitted region
        between this composition and the floor (degree 1.5 to 1.69, excess 10
        to 16) was not computed (open_issues OI-7).
    run_1_against_run_2: >-
      Same seed, same draw order. The edit between the runs touched only
      admission and the admission record (PD-P3), so every rate, composition,
      prediction and band should be unchanged. This producer compared run 1
      (lines 1 to 29 and 100 to 894 of its stdout) with run 2 line by line:
      every class rate, per-test rate, non-PASS figure, composition and
      sd_delta is equal. What differs: (i) the AR_COSET records gain
      block_cycle_excess, lowest_block_cycle_excess and
      giant_undetermined_bound, and the rule text gains the excess clause;
      (ii) BIN-KOB-19 at f = 1.02 goes from admitted (contract non-PASS
      0.101) to halted (1.0); (iii) the H1 axis at f = 1.02 goes from
      H1-POSITIVE 0.88363, H1-MIXED 0.11461, H1-NEGATIVE-DEVIANT 0.00101,
      H1-NEGATIVE-COVERAGE 0.00076 to H1-INCOMPLETE 1.0.

