          one-to-one rate, a MODEL ASSUMPTION inherited from the pinned
          product law and the D3 column. On the toy cells no unit is crossed:
          oracle work units, group operations and la_ops are separate columns
          and every gated observable is a ratio of oracle work units, a count
          ratio or a fraction.
        - "The ambient and coset interface (R3-J3-2): decomposition counts in the full group (N = 4r on ECC2K-130; #E = 2q and 4l on the binary toys; N on CTRL-ZN); targets in the prime-order subgroup; rho on N_prime at deployed parameters and on the subgroup order on the toys. Both legs of a decomposition of a point of G lie in one coset block; the coset factor f = h sum_k P_k / |Sigma|^2 and the block composition are measured at setup and charged in every prediction (coset_model below)."
        - >-
          The comparator interface: the windows use c rho_1 sqrt(L) with
