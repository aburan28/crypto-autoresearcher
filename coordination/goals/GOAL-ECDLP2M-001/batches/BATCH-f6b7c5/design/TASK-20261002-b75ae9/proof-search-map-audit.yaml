    def evaluate_pattern(p):
        zv = p["zn"]
        zc = pattern_cell(zv, None, p.get("zn_pools", KS_POOLS),
                          p.get("zn_null", gen_null(ZN_BASE, MU_ZN_DESIGN)),
                          gops_ok=p.get("zn_gops_ok", True))
        g1 = (zc["reuse"]["phi"] == "PASS" and zc["null"]["discriminates"] and zc["ctl6"]["ok"]
              and RHO_EXP_BAND[0] <= zc["rho"]["exponent_rho"] <= RHO_EXP_BAND[1]
              and zc["rho"]["instrument_ok"] and zc["ir5"]["ic_reading_valid"]
              and zc["reuse"]["gops_ok"])
        res = {"G1": g1, "zn_phi": zc["reuse"]["phi"]}
        if not g1:
            res.update({"H1": None, "H2": None, "contract": "RUN-ARTIFACT"})
            return res
        cells = {}
        for name, key in ((ORD_CELL, "ord"), (KOB_CELL, "kob")):
            null = p.get("ord_null", gen_null(BIN_B_NOMINAL, BIN_MU_NOMINAL)) if name == ORD_CELL else None
            cells[name] = pattern_cell(p[key], zv, p.get(key + "_pools", KS_POOLS), null,
                                       fit_ok=p.get(key + "_fit_ok", True),
                                       abandoned=p.get(key + "_abandoned", 0),
                                       gops_ok=p.get(key + "_gops_ok", True),
                                       certs_ok=p.get(key + "_certs_ok", True),
                                       coset_ok=p.get(key + "_coset_ok", None))
        flags = {"S0_pass": True, "G1_pass": g1, "IR1_fired": False,
                 "IR2_fired": bool(p.get("ir2", False)), "IR6_fired": False, "IR7_fired": False}
        adm = {c: {r: True for r in ADMISSION_RULES} for c in BINARY_CELLS}
        for c, r in p.get("admission_fail", ()):
            adm[c][r] = False
        aud = {c: {"relation_attempts_checked": AUDIT_REL, "targets_checked": AUDIT_TGT,
                   "discrepancies": 0} for c in BINARY_CELLS}
        for c, n in p.get("audit_discrepancies", ()):
            aud[c]["discrepancies"] = n
        for c in p.get("audit_short", ()):
            aud[c]["targets_checked"] = AUDIT_TGT - 1
        res["phi"] = {k: v["reuse"]["phi"] for k, v in cells.items()}
        res["coverage_deficit"] = {k: v["reuse"]["yield_audit"]["coverage_deficit"] for k, v in cells.items()}
        out = stage2_outcome({"rho": zc["rho"]}, cells, flags, adm, aud)
        res.update({"H1": out["H1"], "H2": out["H2"], "contract": out["contract"],
                    "reasons": out["reasons"]})
        return res


    def ir5_declared_figures_check():
        """IR-5 applied to the contract's own declared figures: arms built by
        am_core (the function behind ic_observables), with per_target_cost(L)
        and FR_by_L present beside the separate columns. Expected: not fired."""
        B, mu = BIN_B_NOMINAL, BIN_MU_NOMINAL
        cm = cell_model(B, mu)
        ap = cm["a_pred"]
        reuse = [{"t": t, "L": L, "units": ap} for L, ts in cells_of(L_IC).items() for t in ts]
        null = [{"t": t, "L": L, "units": 1.6 * B}
                for L, ts in cells_of(L_NULL, start=sum(L_IC)).items() for t in ts]
        shared = B / (-math.expm1(-mu))
        c = {"reuse": {"observables": am_core(shared, 1, cm, reuse, L_IC), "per_target": reuse},
             "null": {"observables": am_core(shared, 1, cm, null, L_NULL), "per_target": null}}
        return ir5_check(c)


    def outcome_patterns_main():
        bad = 0
        for name, p, want in outcome_patterns():
            r = evaluate_pattern(p)
            got = (r["H1"], r["H2"], r["contract"])
            ok = got[2] == want[2] and (want[0] is None or got[:2] == want[:2])
            if not ok:
                bad += 1
            r["expected"] = list(want)
            r["matches"] = ok
            print(name, json.dumps(r, sort_keys=True, default=str))
        ir5 = ir5_declared_figures_check()
        print("IR5_on_declared_figures", json.dumps(ir5, sort_keys=True))
        print("mismatches", bad)
        return 0 if bad == 0 and ir5["ic_reading_valid"] else 1


    # ----- false-pass sweep (R3-J3-1; C-5): deterministic, no group, no oracle --

    def _regime(name):
        if name == "control":
            return ZN_BASE, MU_ZN_DESIGN
        return BIN_B_NOMINAL, BIN_MU_NOMINAL


    def _families(B, mu, binary):
        """Each gated per-cell statistic with a one-parameter deviation family
        that moves it, by direction: (consequence, statistic, direction, family,
        make(x) -> values, x_max). x = 0 is the model value; a family moves the
        named statistic monotonically in x."""
        cm = cell_model(B, mu)
        d0, u0 = cm["delta_pred"], cm["u_pred"]
        exc_max = min(0.2, cm["mu_eff"] / cm["kappa_pred"] - 1.0 - 1e-9)

        def gv(**kw):
            return gen_values(B, mu, **kw)
        fams = [
            ("H1 (b) determined-column law", "T_delta", "high", "delta = delta_pred + x",
             lambda x: gv(delta=d0 + x), 0.15),
            ("H1 (b) determined-column law", "T_delta", "low", "delta = delta_pred - x",
             lambda x: gv(delta=d0 - x), 0.15),
            ("H1 (c) usable law", "T_u", "high", "u = u_pred + x", lambda x: gv(u=u0 + x), 0.15),
            ("H1 (c) usable law", "T_u", "low", "u = u_pred - x", lambda x: gv(u=u0 - x), 0.15),
            ("H1 (d) attempts law", "T_a", "low", "a_ratio = 1 + x", lambda x: gv(a_ratio=1.0 + x), 0.5),
            ("H1 (d) attempts law", "T_a", "high", "a_ratio = 1 - x", lambda x: gv(a_ratio=1.0 - x), 0.4),
            ("H1 (g) attempts law through FR (AM2)", "AM2_FR", "low", "a_ratio = 1 + x",
             lambda x: gv(a_ratio=1.0 + x), 0.5),
            ("H1 (g) attempts law through FR (AM2)", "AM2_FR", "high", "a_ratio = 1 - x",
             lambda x: gv(a_ratio=1.0 - x), 0.4),
            ("H1 (e) target coverage", "T_kappa", "low", "matched-mean deficit, low dispersion",
             lambda x: coverage_values(B, mu, 1.0 - x, "low"), 0.2),
            ("H1 (e) target coverage", "T_kappa", "low", "matched-mean deficit, high dispersion",
             lambda x: coverage_values(B, mu, 1.0 - x, "high"), 0.2),
            ("H1 (e) target coverage", "T_kappa", "high", "matched-mean excess, low dispersion",
             lambda x: coverage_values(B, mu, 1.0 + x, "low"), exc_max),
            ("H1 (e) target coverage", "T_kappa", "high", "matched-mean excess, high dispersion",
             lambda x: coverage_values(B, mu, 1.0 + x, "high"), exc_max),
            ("H1 (e) target coverage", "T_kappa", "low", "kappa_ratio = 1 - x, all else at the model",
             lambda x: gv(kappa_ratio=1.0 - x), 0.2),
            ("H1 (e) target coverage", "T_kappa", "high", "kappa_ratio = 1 + x, all else at the model",
             lambda x: gv(kappa_ratio=1.0 + x), 0.2),
            ("H1 (f) relation-phase yield", "T_rho", "low", "rho_rel = 1 + x",
             lambda x: gv(rho_rel=1.0 + x), 0.8),
            ("H1 (f) relation-phase yield", "T_rho", "high", "rho_rel = 1 - x",
             lambda x: gv(rho_rel=1.0 - x), 0.6),
            ("H1 (g) relation-phase yield through KR (AM1)", "AM1_KR", "low", "rho_rel = 1 - x",
             lambda x: gv(rho_rel=1.0 - x), 0.6),
            ("H1 (g) relation-phase yield through KR (AM1)", "AM1_KR", "high", "rho_rel = 1 + x",
             lambda x: gv(rho_rel=1.0 + x), 0.8),
            ("H1 (g) amortisation form (AM3)", "AM3_dsigma", "low", "d_sigma + x",
             lambda x: gv(dsigma_shift=x), 0.5),
            ("H1 (g) amortisation form (AM3)", "AM3_dsigma", "high", "d_sigma - x",
             lambda x: gv(dsigma_shift=-x), 0.5),
        ]
        if binary:
            fams += [
                ("CTL-2 group-generic usable law, binary against control", "T_cmp", "high",
                 "u = u_pred + x on the binary cell", lambda x: gv(u=u0 + x), 0.3),
                ("CTL-2 group-generic usable law, binary against control", "T_cmp", "low",
                 "u = u_pred - x on the binary cell", lambda x: gv(u=u0 - x), 0.3),
            ]
        return fams


    def _flag_edge(make, stat, x_max, zn):
        """Smallest x in (0, x_max] at which stat leaves its band on make(x), by
        bisection to SWEEP_ITERS halvings (the returned x is on the flagged
        side). Status 'model_value_flagged' if the model value itself flags,
        'not_flagged_in_range' if x_max does not."""
        def flagged(x):
            return gate_tests(make(x), zn)[stat] != "pass"
        if flagged(0.0):
            return None, "model_value_flagged"
        if x_max <= 0.0 or not flagged(x_max):
            return None, "not_flagged_in_range"
        lo, hi = 0.0, x_max
        for _ in range(SWEEP_ITERS):
            mid = 0.5 * (lo + hi)
            if flagged(mid):
                hi = mid
            else:
                lo = mid
        return hi, "edge"


    def _base_pattern():
        nom = gen_values(BIN_B_NOMINAL, BIN_MU_NOMINAL)
        return {"zn": gen_values(ZN_BASE, MU_ZN_DESIGN), "ord": nom, "kob": nom}


    def _labels(r):
        return [r["H1"], r["H2"], r["contract"]]


    def false_pass_sweep():
        """C-5. For every consequence the contract declares tested and every
        certifies_only item, the smallest deviation its own statistic flags at
        its own threshold (both directions where two-sided; low and high
        dispersion where a mean is matched), fed through the committed
        gate_tests, classify_cell and stage2_outcome: on both binary cells, on
        BIN-ORD-19 alone, and on the CTRL-ZN control (through G1). A gated row
        is ok iff its flagged deviation exists (or is declared unreachable on
        the control) and no placement reads POSITIVE."""
        rows = []
        base = _base_pattern()
        zn_nom = base["zn"]
        for regime in ("binary", "control"):
            B, mu = _regime(regime)
            zn = zn_nom if regime == "binary" else None
            for item, stat, direction, fam, make, x_max in _families(B, mu, regime == "binary"):
                x, status = _flag_edge(make, stat, x_max, zn)
                row = {"regime": regime, "item": item, "statistic": stat, "direction": direction,
                       "family": fam, "x_max": x_max, "status": status, "gated": True}
                if x is None:
                    row["ok"] = status == "not_flagged_in_range" and regime == "control"
                    row["note"] = ("no flagged deviation inside the family's admissible range"
                                   if status == "not_flagged_in_range" else "the model value flags")
                    rows.append(row)
                    continue
                v = make(x)
                tests = gate_tests(v, zn)
                row.update({"x_edge": x, "statistic_at_edge": list(gate_table(v, zn)[stat]),
                            "tests_at_edge": tests, "class_at_edge": classify_cell(tests)})
                if stat == "T_kappa":
                    row["kappa_ratio_at_edge"] = v["kappa_hat"] / model_of(v)["kappa_pred"]
                if regime == "binary":
                    both = evaluate_pattern(dict(base, ord=v, kob=v))
                    one = evaluate_pattern(dict(base, ord=v))
                    row["both_binary"] = _labels(both)
                    row["ord_only"] = _labels(one)
                    row["ok"] = both["contract"] != "POSITIVE" and one["contract"] != "POSITIVE"
                else:
                    ctl = evaluate_pattern(dict(base, zn=v))
                    row["control"] = [ctl["G1"], ctl["contract"]]
                    row["ok"] = ctl["contract"] != "POSITIVE"
                rows.append(row)
        rows.extend(_null_rows(base))
        rows.extend(_h2_rows(base))
        rows.extend(_reported_rows())
        return rows


    def _null_rows(base):
        """CTL-8 null separation (IR-9; G1 (b)): q_null = exp(-x) moves the null
        toward reuse; the flag is the null failing to discriminate."""
        rows = []
        for regime in ("binary", "control"):
            B, mu = _regime(regime)
            bands = am_bands(cell_model(B, mu), sum(L_IC))
            lo, hi = 0.0, 12.0
            row = {"regime": regime, "item": "CTL-8 null separation", "statistic": "null_check",
                   "direction": "toward reuse", "family": "q_null = exp(-x)", "x_max": hi,
                   "gated": True}
            if not null_check(gen_null(B, mu), bands)[1] or null_check(gen_null(B, mu, math.exp(-hi)), bands)[1]:
                row.update({"status": "no edge", "ok": False})
                rows.append(row)
                continue
            for _ in range(SWEEP_ITERS):
                mid = 0.5 * (lo + hi)
                if null_check(gen_null(B, mu, math.exp(-mid)), bands)[1]:
                    lo = mid
                else:
                    hi = mid
            nv = gen_null(B, mu, math.exp(-hi))
            row.update({"status": "edge", "x_edge": hi, "q_null_at_edge": math.exp(-hi),
                        "null_at_edge": nv, "null_fails_at_edge": null_check(nv, bands)[0]})
            if regime == "binary":
                r = evaluate_pattern(dict(base, ord_null=nv))
                row["ord_null"] = _labels(r)
            else:
                r = evaluate_pattern(dict(base, zn_null=nv))
                row["control"] = [r["G1"], r["contract"]]
            row["ok"] = r["contract"] != "POSITIVE"
            rows.append(row)
        return rows


    def _h2_rows(base):
        """H2 (i): the pooling band [0.8, 1.3] and the exponent band [-0.6, -0.4],
        each just past its edge, on both binary cells, on BIN-ORD-19 alone and on
        the control."""
        xs = [math.log2(L) for L in L_RHO]
        ks_exp = -0.5 + slope(xs, [math.log2(c) for c in KS_POOLS])
        up = list(KS_POOLS)
        up[-1] = POOL_H2_BAND[1] * (1.0 + 1e-9)
        dn = list(KS_POOLS)
        dn[0] = POOL_H2_BAND[0] * (1.0 - 1e-9)
        s_hi = RHO_EXP_BAND[1] - ks_exp + 1e-9
        s_lo = RHO_EXP_BAND[0] - ks_exp - 1e-9
        tilt_hi = [c * 2.0 ** (s_hi * x) for c, x in zip(KS_POOLS, xs)]
        tilt_lo = [c * 2.0 ** (s_lo * x) for c, x in zip(KS_POOLS, xs)]
        rows = []
        for fam, pools in (("c(256) just above 1.3", up), ("c(1) just below 0.8", dn),
                           ("power tilt to exponent just above -0.4", tilt_hi),
                           ("power tilt to exponent just below -0.6", tilt_lo)):
            both = evaluate_pattern(dict(base, ord_pools=pools, kob_pools=pools))
            one = evaluate_pattern(dict(base, ord_pools=pools))
            ctl = evaluate_pattern(dict(base, zn_pools=pools))
            rows.append({"regime": "binary and control", "item": "H2 (i) pooled law",
                         "statistic": "pooling and exponent bands", "family": fam,
                         "pools": pools, "exponent": -0.5 + slope(xs, [math.log2(c) for c in pools]),
                         "status": "edge", "gated": True,
                         "both_binary": _labels(both), "ord_only": _labels(one),
                         "control": [ctl["G1"], ctl["contract"], ctl.get("H2")],
                         "ok": (both["contract"] != "POSITIVE" and one["contract"] != "POSITIVE"
                                and ctl["contract"] != "POSITIVE")})
        return rows


    def _reported_rows():
        items = (("H1 (a) touched fraction tau_hat", "cell_values tau_hat"),
                 ("TC-1 attempts tail", "tail_check"),
                 ("TC-2 decomposition-count tail", "poisson_q999_of_max"),
                 ("TC-3 rho total tail", "run_rho p90_over_mean"),
                 ("sigma_hat bootstrap interval", "ic_observables sigma_hat_boot95"),
                 ("exponent_rho bootstrap interval", "run_rho exponent_rho_boot95"))
        return [{"item": i, "statistic": s, "gated": False, "ok": True,
                 "routing": ("reported, not gated and not in certifies_only: classify_cell reads "
                             "only gate_tests, so no deviation of it moves a class or a label")}
                for i, s in items]


    def false_pass_sweep_main():
        rows = false_pass_sweep()
        bad = 0
        for r in rows:
            if r["gated"] and not r["ok"]:
                bad += 1
            print(json.dumps(r, sort_keys=True, default=str))
        print("rows", len(rows), "gated", sum(1 for r in rows if r["gated"]), "failures", bad)
        return 0 if bad == 0 else 1


    # ----- calibration: Monte Carlo of the abstract model (C-4) ----------------

    def _geom(rng, p):
        """Bernoulli(p) trials up to and including the first success."""
        if p >= 1.0:
            return 1
        return 1 + int(math.log(1.0 - rng.random()) / math.log1p(-p))


    def _poisson(rng, lam):
        if lam <= 0.0:
            return 0
        if lam > 50.0:
            return max(0, int(round(rng.gauss(lam, math.sqrt(lam)))))
        lim = math.exp(-lam)
        k, prod = 0, rng.random()
        while prod > lim:
            k += 1
            prod *= rng.random()
        return k


    def _poisson_pos(rng, lam):
        """Poisson(lam) conditioned on at least 1, by inversion."""
        target = rng.random() * (-math.expm1(-lam))
        k, term = 1, lam * math.exp(-lam)
        acc = term
        while acc < target and k < 1000:
            k += 1
            term *= lam / k
            acc += term
        return k


    def _binom(rng, n, p):
        """Binomial(n, p) by geometric gaps between successes (cost O(count + 1))."""
        if n <= 0 or p <= 0.0:
            return 0
        if p >= 1.0:
            return n
        k = pos = 0
        while True:
            pos += _geom(rng, p)
            if pos > n:
                return k
            k += 1


    def _pick(rng, cum):
        x = rng.random()
        for i, c in enumerate(cum):
            if x < c:
                return i
        return len(cum) - 1


    class _SignedUF:
        """Union-find over B columns with a sign parity and a 'determined' flag
        per component: a component is determined iff it holds an unbalanced
        cycle or a coefficient-2 loop (H1 (b); A3 at m = 2). The relation
        s x_i + t x_k = const gives x_i = const + sigma x_k with sigma = -s t."""

        def __init__(self, B):
            self.parent = list(range(B))
            self.par = [0] * B
            self.size = [1] * B
            self.det = [False] * B

        def find(self, x):
            p = 0
            while self.parent[x] != x:
                p ^= self.par[x]
                x = self.parent[x]
            return x, p

        def add(self, i, s, k, t):
            ri, pi = self.find(i)
            if i == k:
                if s == t:
                    self.det[ri] = True
                return
            rk, pk = self.find(k)
            e = 0 if s * t == -1 else 1
            if ri == rk:
                if pi ^ pk ^ e:
                    self.det[ri] = True
                return
            if self.size[ri] < self.size[rk]:
                ri, rk, pi, pk = rk, ri, pk, pi
            self.parent[rk] = ri
            self.par[rk] = pi ^ pk ^ e
            self.size[ri] += self.size[rk]
            self.det[ri] = self.det[ri] or self.det[rk]

        def determined(self, x):
            return self.det[self.find(x)[0]]


    def _mc_legs(rng, cm):
        """The legs of one relation or decomposition under H1 on the cell model:
        a coset block drawn by w, then two uniform columns of that block and two
        uniform signs, redrawn while trivial (s x_i - s x_i, which the oracle
        never returns for a nonzero point of G)."""
        k = _pick(rng, cm["cum_w"])
        s0, n = cm["starts"][k], cm["ncols"][k]
        while True:
            i, j = s0 + rng.randrange(n), s0 + rng.randrange(n)
            s, t = rng.choice((1, -1)), rng.choice((1, -1))
            if not (i == j and s == -t):
                return i, s, j, t


    def _mc_relations(rng, cm, q, uf):
        """B relations, each after a geometric number of attempts with success
        probability q = 1 - exp(-mu_eff); returns the relation attempts."""
        att = rels = 0
        while rels < cm["B"]:
            att += _geom(rng, q)
            i, s, j, t = _mc_legs(rng, cm)
            uf.add(i, s, j, t)
            rels += 1
        return att


    def _mc_arm(rng, cm):
        """One reuse arm of the abstract model with H1 true on the cell model cm
        (coset blocks included): the relation graph by blocks; the measured
        per-block determined fractions; usable probability u = sum_k w_k
        delta_k^2; per target, geometric attempts with p = 1 - exp(-mu_eff u),
        each failed attempt nonempty with probability 1 - exp(-mu_eff (1 - u))
        (zero-truncated Poisson non-usable counts), the successful attempt
        nonempty with its usable (zero-truncated) and non-usable counts."""
        B, mu = cm["B"], cm["mu_eff"]
        q = -math.expm1(-mu)
        uf = _SignedUF(B)
        rel_att = _mc_relations(rng, cm, q, uf)
        det = [sum(1 for x in range(s0, s0 + n) if uf.determined(x))
               for s0, n in zip(cm["starts"], cm["ncols"])]
        dblocks = [det[k] / n if n else 0.0 for k, n in enumerate(cm["ncols"])]
        u = sum(wk * d * d for wk, d in zip(cm["w"], dblocks))
        lam_u, lam_n = mu * u, mu * (1.0 - u)
        p = -math.expm1(-lam_u)
        r_n = -math.expm1(-lam_n)
        per_target = []
        n_dec = n_use = n_ne = abandoned = 0
        for L, ts in cells_of(L_IC).items():
            for t in ts:
                a = _geom(rng, p) if p > 0.0 else MAX_ATTEMPTS + 1
                solved = a <= MAX_ATTEMPTS
                if not solved:
                    a = MAX_ATTEMPTS
                    abandoned += 1
                k_ne = _binom(rng, a - 1 if solved else a, r_n)
                nd = sum(_poisson_pos(rng, lam_n) for _ in range(k_ne))
                if solved:
                    use = _poisson_pos(rng, lam_u)
                    nd += use + _poisson(rng, lam_n)
                    n_use += use
                    k_ne += 1
                n_dec += nd
                n_ne += k_ne
                per_target.append({"t": t, "L": L, "units": a, "attempts": a})
        return {"rel_att": rel_att, "delta": sum(det) / B, "delta_blocks": dblocks,
                "n_dec": n_dec, "n_use": n_use, "n_ne": n_ne, "per_target": per_target,
                "abandoned": abandoned}


    def _mc_values(raw, cm):
        """The values dict of one simulated reuse arm read through the cell model
        cm: the charged model, or the one-block model at mu_c for the uncharged
        (version-3) comparison."""
        pt = raw["per_target"]
        obs = am_core(raw["rel_att"], 1, cm, pt, L_IC)
        n_att = sum(r["attempts"] for r in pt)
        return {"B": cm["B"], "mu": cm["mu"], "h": cm["h"], "sigma": cm["sigma"], "blocks": cm["blocks"],
                "delta_hat": raw["delta"], "delta_blocks": raw["delta_blocks"] if cm["blocks"] else None,
                "u_hat": (raw["n_use"] / raw["n_dec"]) if raw["n_dec"] else 0.0, "n_dec": raw["n_dec"],
                "n_t": len(pt), "n_att": n_att, "a_bar": n_att / len(pt),
                "kappa_hat": raw["n_ne"] / n_att,
                "rho_rel": raw["rel_att"] * cm["kappa_pred"] / cm["B"],
                "KR": obs["KR"], "FR": obs["FR"], "d_sigma": obs["d_sigma"]}


    def _mc_null(rng, cm, shared):
        """The CTL-8 null on fresh graphs of the cell model, with the version-4
        cadence: checked every max(1, B // 16) relations and at every multiple of
        4 B, one more target attempt after every 4 B relations without success."""
        B, mu = cm["B"], cm["mu_eff"]
        q = -math.expm1(-mu)
        check_every = max(1, B // 16)
        per_target = []
        for L, ts in cells_of(L_NULL, start=sum(L_IC)).items():
            for t in ts:
                t_att = _geom(rng, q)
                stored = [_mc_legs(rng, cm)[0::2] for _ in range(_poisson_pos(rng, mu))]
                uf = _SignedUF(B)
                r_att = rels = 0
                solved = False
                while not solved and rels < 16 * B:
                    r_att += _geom(rng, q)
                    i, s, j, sg = _mc_legs(rng, cm)
                    uf.add(i, s, j, sg)
                    rels += 1
                    extra = rels % (4 * B) == 0
                    if rels % check_every and not extra:
                        continue
                    solved = any(uf.determined(x) and uf.determined(y) for x, y in stored)
                    if not solved and extra:
                        t_att += 1
                        stored.extend(_mc_legs(rng, cm)[0::2] for _ in range(_poisson(rng, mu)))
                per_target.append({"t": t, "L": L, "units": t_att + r_att})
        return am_core(shared, 1, cm, per_target, L_NULL)


    def _tally(fails, classes, tests, phi):
        for k, s in tests.items():
            if s != "pass":
                key = k + ":" + s
                fails[key] = fails.get(key, 0) + 1
        classes[phi] = classes.get(phi, 0) + 1


    def calibration(runs=MC_RUNS, seed=MC_SEED):
        """C-4. Monte Carlo of the contract's ABSTRACT MODEL with H1 true, the
        version-4 gate set: on CTRL-ZN (one block) the reuse arm, its null and
        G1's data conjuncts (a), (b), (c), (g); on both binary cells at each coset
        factor of F_GRID with the representative composition (composition()),
        the reuse arm read through the CHARGED model (admission waived, so the
        gate rates are visible at every f), AR-COSET on that composition, the
        same draws read through the UNCHARGED one-block model at mu_c (the
        version-3 predictions; information only), the BIN-ORD-19 null, and the
        H1 axis given G1 under the contract (a non-admitted cell halts). Every
        draw is fed to the committed cell_model, am_core, am_bands, gate_tests,
        classify_cell, null_check, ar_coset and h1_axis. No group, oracle, curve
        or fixture. Not modelled: the rho conjuncts (d), (e) and the H2 band,
        the certificates (f), the I1 self-test (h), IR-5 (i), the group-operation
        bound (j), oracle return order and merged columns."""
        rng = random.Random(seed)
        zcm = cell_model(ZN_BASE, MU_ZN_DESIGN)
        comps = {}
        for f in F_GRID:
            for name in BINARY_CELLS:
                c = composition(name, f)
                cm = cell_model(BIN_B_NOMINAL, BIN_MU_NOMINAL, c["blocks"], c["h"], c["sigma"])
                comps[(f, name)] = {"cm": cm, "coset": ar_coset(cm),
                                    "uncharged": cell_model(BIN_B_NOMINAL, BIN_MU_NOMINAL)}
        acc = {key: {"fail": {}, "phi": {}, "unch_fail": {}, "unch_phi": {}, "null_fail": 0,
                     "ir10": 0, "abandoned": 0} for key in comps}
        zfail, zphi = {}, {}
        g1_conj = {"a_ic_phi_pass": 0, "b_null_discriminates": 0, "c_ctl6_delta": 0,
                   "g_no_abandoned_reuse_target": 0}
        g1_fail = 0
        h1 = {f: {} for f in F_GRID}
        for _ in range(runs):
            zraw = _mc_arm(rng, zcm)
            zv = _mc_values(zraw, zcm)
            zt = gate_tests(zv)
            zp = classify_cell(zt)
            zdisc = null_check(_mc_null(rng, zcm, zraw["rel_att"]), am_bands(zcm, zv["n_t"]))[1]
            conj = {"a_ic_phi_pass": zp == "PASS", "b_null_discriminates": zdisc,
                    "c_ctl6_delta": zv["delta_hat"] < OVERCOMPLETE_DELTA,
                    "g_no_abandoned_reuse_target": zraw["abandoned"] == 0}
            for k, ok in conj.items():
                if not ok:
                    g1_conj[k] += 1
            g1 = all(conj.values())
            if not g1:
                g1_fail += 1
            _tally(zfail, zphi, zt, zp)
            for f in F_GRID:
                phis, halted, deficit, invalid = {}, {}, {}, False
                for name in BINARY_CELLS:
                    e, a = comps[(f, name)], acc[(f, name)]
                    raw = _mc_arm(rng, e["cm"])
                    bv = _mc_values(raw, e["cm"])
                    bt = gate_tests(bv, zv)
                    bp = classify_cell(bt)
                    _tally(a["fail"], a["phi"], bt, bp)
                    ut = gate_tests(_mc_values(raw, e["uncharged"]), zv)
                    _tally(a["unch_fail"], a["unch_phi"], ut, classify_cell(ut))
                    if bv["delta_hat"] >= OVERCOMPLETE_DELTA:
                        a["ir10"] += 1
                        invalid = True
                    if raw["abandoned"]:
                        a["abandoned"] += 1
                    halted[name] = (not e["coset"]["admitted"]) or raw["abandoned"] > 0
                    phis[name] = bp
                    deficit[name] = bt["T_kappa"] == "low"
                    if name == ORD_CELL:
                        nobs = _mc_null(rng, e["cm"], raw["rel_att"])
                        if not null_check(nobs, am_bands(e["cm"], bv["n_t"]))[1]:
                            a["null_fail"] += 1
                            invalid = True
                if g1:
                    ax = h1_axis(phis, halted, invalid, deficit)
                    h1[f][ax] = h1[f].get(ax, 0) + 1
        passed = max(runs - g1_fail, 1)

        def rate(d):
            return {k: v / runs for k, v in sorted(d.items())}
        grid = {}
        for f in F_GRID:
            cells = {}
            for name in BINARY_CELLS:
                e, a = comps[(f, name)], acc[(f, name)]
                cm = e["cm"]
                non_pass = 1.0 - a["phi"].get("PASS", 0) / runs
                cells[name] = {
                    "composition": {"blocks": cm["blocks"], "h": cm["h"], "f_realised": cm["f"],
                                    "mu_eff": cm["mu_eff"], "block_mean_degrees": cm["d"],
                                    "delta_pred": cm["delta_pred"], "u_pred": cm["u_pred"],
                                    "a_pred": cm["a_pred"], "K_pred": cm["K_pred"],
                                    "kappa_pred": cm["kappa_pred"], "sd_delta": cm["sd_delta"],
                                    "s_lnu": cm["s_lnu"]},
                    "AR_COSET": e["coset"],
                    "per_cell_not_PASS_under_the_contract": 1.0 if not e["coset"]["admitted"] else non_pass,
                    "charged_admission_waived": {"non_PASS": non_pass, "class_rate": rate(a["phi"]),
                                                 "per_test_fail_rate": rate(a["fail"])},
                    "uncharged_version3_predictions_information_only": {
                        "non_PASS": 1.0 - a["unch_phi"].get("PASS", 0) / runs,
                        "class_rate": rate(a["unch_phi"]), "per_test_fail_rate": rate(a["unch_fail"])},
                    "IR10_rate": a["ir10"] / runs, "abandoned_rate": a["abandoned"] / runs}
                if name == ORD_CELL:
                    cells[name]["null_not_discriminating_rate"] = a["null_fail"] / runs
            grid[str(f)] = {"cells": cells,
                            "H1_axis_given_G1": {k: v / passed for k, v in sorted(h1[f].items())}}
        return {"program": "binstd_core.calibration", "runs": runs, "seed": seed,
                "model": ("H1 true; abstract relation graph by coset blocks, Poisson decompositions "
                          "at mu_eff, geometric attempts, nonempty attempts, CTL-8 null"),
                "bands_at_nominal_regimes": band_table(),
                "CTRL-ZN": {"G1_fail_count": g1_fail, "G1_fail_rate": g1_fail / runs,
                            "G1_conjunct_fail_rate": {k: v / runs for k, v in sorted(g1_conj.items())},
                            "per_test_fail_rate": rate(zfail), "class_rate": rate(zphi)},
                "coset_factor_grid": grid,
                "not_modelled": ["rho conjuncts (d), (e) and the H2 band", "certificates (f)",
                                 "I1 self-test (h)", "IR-5 (i)", "group-operation bound (j)",
                                 "oracle return order", "merged columns"]}


    # ----- Stage 1 and entry point --------------------------------------------

    def stage1(path):
        N = least_prime_above(1 << 20)
        selftest = i1_selftest(N)
        G = RelabelledZN(N)
        oracle = ZNOracle(G)
        z = run_cell(G, oracle, ZN_CELL, with_null=True)
        z["N"] = N
        z["base_reseeds"] = oracle.reseeds
        z["i1_selftest"] = selftest
        z["G1"] = g1_checks(z, selftest)
        z["G1_pass"] = all(z["G1"].values())
        with open(path, "w") as fh:
            json.dump(z, fh, indent=1, default=str)
        nobs = z["null"]["observables"]
        print(json.dumps({"N": N, "phi": z["reuse"]["phi"], "tests": z["reuse"]["tests"],
                          "values": z["reuse"]["values"], "bands": z["bands"],
                          "null": {"KR": nobs["KR"], "FR": nobs["FR"], "d_sigma": nobs["d_sigma"]},
                          "exponent_rho": z["rho"]["exponent_rho"],
                          "pooling": {L: v["pooling_constant"] for L, v in z["rho"]["per_L"].items()},
                          "i1_selftest": selftest["ok"], "ir5": z["ir5"],
                          "G1": z["G1"], "G1_pass": z["G1_pass"]}, indent=1))
        return 0 if z["G1_pass"] else 1


    def main(argv):
        if len(argv) > 1 and argv[1] == "--outcome-patterns":
            return outcome_patterns_main()
        if len(argv) > 1 and argv[1] == "--false-pass-sweep":
            return false_pass_sweep_main()
        if len(argv) > 1 and argv[1] == "--bands":
