    model: >-
      As printed: "H1 true; abstract relation graph by coset blocks, Poisson
      decompositions at mu_eff, geometric attempts, nonempty attempts, CTL-8
      null". 4000 replicates per (coset factor, cell), seed 20261002, every
      accumulator keyed by (f, cell name). For each coset factor the binary
      cells take the representative composition composition(cell, f)
      (coset_model.representative_compositions_for_c4); CTRL-ZN is one block.
    not_modelled: ['rho conjuncts (d), (e) and the H2 band', 'certificates (f)', 'I1 self-test (h)', 'IR-5 (i)', 'group-operation bound (j)', 'oracle return order', 'merged columns']
    reading_of_the_columns: >-
      charged_non_PASS is the contract's charged prediction (cell_model)
      applied to H1-true draws at that composition, computed whether or not
      AR-COSET admits the cell (the printed key charged_admission_waived);
      contract_non_PASS is the per-cell rate under the contract, which is 1.0
      where AR-COSET halts the cell (a halted cell is never PASS; it reads
      INCOMPLETE, not a failed test); uncharged_non_PASS reads the same draws
      through the version-3 one-block predictions at mu_c (information only,
      the reason the charge exists).
