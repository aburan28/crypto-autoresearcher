      H1-NEGATIVE-COVERAGE (P2), H1-NEGATIVE-YIELD (P6, P20, P21),
      H1-NEGATIVE-DEVIANT (P3, P5, P8), H1-ARTIFACT (P7, P9, P10, P11, P23),
      H1-INCOMPLETE (P12, P13, P14, P24, P27, P28); H2-POSITIVE (P1),
      H2-NEGATIVE (P15), H2-MIXED (P16), H2-ARTIFACT (P17), H2-INCOMPLETE
      (P12); contract POSITIVE (P1, P26), NEGATIVE (P2, P3, P5, P6, P8, P15,
      P20, P21), NOT-VALIDATED (P4, P7, P9 to P14, P16, P17, P22, P23, P24,
      P27, P28), RUN-ARTIFACT (P18, P19, P25). Every declared outcome has a
      reaching pattern of producible data.
    totality: >-
      The per-cell class is a total function of the test results. The H1
      axis is a total function of (invalidity, halts, class pair, deficit
      pair). The H2 axis is total over (invalidity, halts, three pass bits).
      run_validity is total over the named flags and the in-cell certificate
      flags (an absent flag counts as fired). The contract label is total over
      (run_valid, axis pair), and the axes are null when the run is not
      valid. Every reachable result lands in exactly one declared outcome.
    most_likely_pattern:
      pattern: P1
      assigned: POSITIVE
      model_probability: about 0.91 (calibration.restated_most_likely_inputs)
      basis: >-
        Under the contract's random model (H1 true on every cell, H2's
        Kuhn-Struik law, balanced coset blocks) every gated test is a fixed
        multiple of the model's own sampling sd at every cell regime: T_delta,
        T_cmp, T_kappa and T_rho 3.3, T_u and T_a 3 (T_a conservative), AM1
        and AM2 3.5 per cell, AM3 dominated by AM1. By C-4 run 2 G1 fails
        with probability 0.0075 when H1 holds; at f = 1 BIN-ORD-19 and
        BIN-KOB-19 are non-PASS with probability 0.00875 and 0.013, and
        H1-POSITIVE given G1 is 0.98212. The most likely non-POSITIVE result
        is NOT-VALIDATED through H2-MIXED (a c(1) excursion below 0.8, about
        1.3 to 2.35 percent per cell in the version-2 reviewer random-mapping
        Monte Carlo, H2 rules unchanged, not in C-4), then H1-MIXED (0.0177
        unconditional), then RUN-ARTIFACT through G1 (0.0075). An unbalanced
        base admitted by AR-COSET raises its cell's rate (BIN-ORD-19 0.0195 at
        f = 1.02); a base AR-COSET halts reads H1-INCOMPLETE, NOT-VALIDATED
        (P27, P28), never NEGATIVE.

