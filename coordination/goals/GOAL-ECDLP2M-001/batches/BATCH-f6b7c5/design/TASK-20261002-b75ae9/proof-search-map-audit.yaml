  tripwire_preregistration:
    id: TW-01 (DEC-20260928-63addc C3; plan TA-1)
    text: >-
      The clause of IDEA-20260926-20ba8f claim (C) that an oracle with C below
      T_gen would be the first ECDLP algorithm below the S T^2 = N_prime line
      is not an outcome, a prediction or a success criterion of
      H-BINSTD-14f77e, EXP-BINSTD-a222b4 or this sheet. CONTAINMENT, A c = 1
      STATEMENT WITH TWO c-RANGES (R2-J4-1, R3-J4-1). At the multi-target
      constant c = 1 used by the windows, every non-empty crossing window is
      a conditional whose antecedent C lies 1.34 to 1.40 bits under the
      T_gen column value at B = B_cap(m) and 1.01 bit under T_gen(4) over the
      committed m = 4 range, so at c = 1 the windows are the
      first-below-the-line clause restated in multi-target form. (i) Against
      the T_gen COLUMN VALUE the critical C rises by about log2 c, so this
      containment holds for c below about 2.01 over the committed m = 4
      range and below about 2.52 to 2.63 at B = B_cap(m) (D-12). (ii) AT
      MATCHED ADVICE, against the generic line at each window's own advice
      S = B words, it holds for c below about 1.67 on the committed m = 4
      range, about 1.54 with the online attempt constant charged, and about
      1.54 to 1.60 at B = B_cap(m) on that basis (TASK-20260929-810095 J4,
      review arithmetic). It holds at Kuhn-Struik's 1.128 under every reading
      and FAILS on the m = 4 envelope at the Bernstein-Lange constants 2.15
      and 2.36, where windows open for C up to 0.10 and 0.24 bit above
      T_gen(4), for points that are above the frontier at their own advice
      (TASK-20260929-594e8d PTM-A residual); for bases above B_cap(4) that
      failure description applies from c of about 1.67. ROUTING RULE,
      c-independent and unchanged: any reading that plugs a measured
      per-attempt cost into a window figure, at any c, is a TW-01 reading,
      pre-registered to review-breakthrough at max in its own round, never in
      this one. The producer's reading, stated so it cannot drift: an oracle
      at exactly C = T_gen is ON the frontier within the disclosed constants
      in the Bernstein-Lange convention, and no oracle is known to this
      program at any C below any budget.

