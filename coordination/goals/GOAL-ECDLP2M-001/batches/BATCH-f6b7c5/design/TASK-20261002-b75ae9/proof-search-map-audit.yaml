      out of POSITIVE on both binary cells (NEGATIVE, or NOT-VALIDATED through
      IR-9), on one binary cell (H1-MIXED or H2-MIXED, NOT-VALIDATED) and on
      the control (RUN-ARTIFACT, or H2-MIXED for a pool deviation on the
      control alone). No flagged deviation reads POSITIVE. Design figures of
      the committed code on synthetic values, never observations.

  rule_by_rule:
    rule: >-
      Every invalidation, stopping and admission rule of EXP-BINSTD-a222b4,
      applied (a) to the contract's own declared metrics (the figures the
      committed program itself computes and reports, under any data) and (b)
      to the modal pattern P1 (every cell at its model expectation;
      outcome_reachability P1), with the outcome that results. A rule that
      fires on (a) or (b) would void, confine or reroute the modal pattern and
      is a design defect. Model probabilities are design figures from C-4 run
      2 (calibration). Carried from version 3 where the rule is unchanged;
      the new and changed rows are marked.
    stopping_rules:
      - {id: RB-S0, rule: 'S0, stage0.py exits non-zero on any DESIGN disagreement or failed self-check', own_metrics: 'Does not fire: C-3 (run 1 and run 2) exit 0, S0_pass true, 140 of 140 comparisons ok, stdout byte-identical to version 3''s (sha256 7ab3345f...d66a)', modal_P1: 'n/a (data-independent)', if_fired: RUN-ARTIFACT}
      - {id: RB-S1, rule: 'S1, no binary cell is read before G1 passes', own_metrics: 'orders the stages', modal_P1: 'G1 passes with model probability 0.9925 (C-4)', if_fired: 'RUN-ARTIFACT through G1'}
      - {id: RB-S1b, rule: 'S1b, impl-provenance.json pinned before Stage 2', own_metrics: 'not a metric', modal_P1: 'satisfied by the execution batch snapshot', if_fired: 'no Stage 2; RUN-ARTIFACT through IR-6 if run regardless'}
      - {id: RB-S1c, rule: 'S1c (NEW, OI-5), a code-review receipt for the pinned I3 to I5 files before Stage 2', own_metrics: 'not a metric', modal_P1: 'satisfied if the approving decision schedules the review card', if_fired: 'no Stage 2; RUN-ARTIFACT through IR-6 if run regardless'}
      - {id: RB-S2, rule: 'S2, Stage 1 runs to completion; a failed G1 ends the run', own_metrics: 'consequence of G1 (RB-G1a to RB-G1j)', modal_P1: 'G1 passes (0.9925, C-4)', if_fired: RUN-ARTIFACT}
      - {id: RB-S3, rule: 'S3, a cell halts at a failed admission rule (AR-ORDER, AR-MU, AR-FIELD, AR-CURVE, AR-ORACLE, AR-COSET)', own_metrics: 'AR-COSET (NEW) is a function of setup counts only; at balance every block has d_k = 2 and cycle excess 20.7 (128 columns) or 41.4 (256 columns), above 1.5 and 10 (C-4 AR_COSET records at f = 1); the other rules pass for correct instruments', modal_P1: 'not fired (balanced composition)', if_fired: 'the cell reads INCOMPLETE on both axes; contract NOT-VALIDATED (never NEGATIVE)'}
      - {id: RB-S4, rule: 'S4, wall-clock ceiling 21600 s', own_metrics: 'not expected to fire (minutes to about an hour per binary cell)', modal_P1: not fired, if_fired: 'affected cells INCOMPLETE (IR-8)'}
      - {id: RB-S5, rule: 'S5, a reuse target abandoned at MAX_ATTEMPTS = 100000', own_metrics: '(1 - p)^100000, about e^-1984 at CTRL-ZN; 0 in every C-4 arm (abandoned_rate 0.0)', modal_P1: not fired, if_fired: 'binary cell INCOMPLETE; CTRL-ZN RUN-ARTIFACT'}
    invalidation_rules:
      - {id: RB-IR1, rule: IR-1, own_metrics: procedural, modal_P1: not fired, if_fired: RUN-ARTIFACT}
      - {id: RB-IR2, rule: 'IR-2 (CHANGED: verify.py flag OR the in-cell certificates)', own_metrics: 'certificates are true by construction for correct code; the in-cell guard reads the same certificates the fixture computes (certificates_ok)', modal_P1: 'not fired (P1 patterns set certificates_ok true; P25 sets it false and reads RUN-ARTIFACT)', if_fired: 'RUN-ARTIFACT, axis labels null'}
      - {id: RB-IR3, rule: 'IR-3, G1 failing on (a) to (j)', own_metrics: 'see RB-G1a to RB-G1j', modal_P1: 'G1 passes; model false-fail 0.0075 (C-4)', if_fired: RUN-ARTIFACT}
      - {id: RB-IR3b, rule: 'IR-3b, a pooling constant outside [0.5, 2] on a binary cell', own_metrics: 'never left [0.5, 2] in the version-2 and version-3 reviewer random-mapping Monte Carlos (H2 rules unchanged); not in C-4', modal_P1: not fired, if_fired: 'H2-ARTIFACT; NOT-VALIDATED'}
      - {id: RB-IR4, rule: 'IR-4, order or primality disagreement, or mu_c outside [0.5, 2]', own_metrics: 'as RB-S3', modal_P1: not fired, if_fired: 'both axes INCOMPLETE'}
      - {id: RB-IR5, rule: 'IR-5 (TEXT ALIGNED, R3-J3-3): (a) a missing separate column invalidates the cell''s IC reading and no summed figure is read in place of the columns; (b) a gated fit over other than the declared L cells invalidates the cell''s IC reading', own_metrics: 'Does not fire on the declared figures by construction: am_core reports shared_units and every per-target units beside per_target_cost(L) and FR_by_L and records fit_cells equal to the declared cells; C-6 ir5_declared_figures_check returns ic_reading_valid true', modal_P1: 'not fired; P1 POSITIVE', if_fired: '(a) or (b) H1-ARTIFACT on a binary cell, NOT-VALIDATED; on CTRL-ZN a G1 (i) failure'}
      - {id: RB-IR6, rule: 'IR-6 (CHANGED: names TASK-20261002-c21ce2''s extracted_sha256; covers a Stage 2 without the S1c receipt)', own_metrics: 'not a metric', modal_P1: not fired, if_fired: RUN-ARTIFACT}
      - {id: RB-IR7, rule: IR-7, own_metrics: 'not a metric', modal_P1: not fired, if_fired: RUN-ARTIFACT}
      - {id: RB-IR8, rule: IR-8, own_metrics: 'as RB-S4', modal_P1: not fired, if_fired: 'INCOMPLETE; NOT-VALIDATED'}
      - {id: RB-IR9, rule: 'IR-9, the BIN-ORD-19 null inside any AM band or at KR >= 0.125', own_metrics: 'Does not fire: null design values KR about 0.012 (control) and 0.0026 (binary), FR about 82 and 381, d_sigma about +0.71 and +0.76 lie outside every band; C-4: 0 of 4000 CTRL-ZN null arms and 0 of 4 x 4000 BIN-ORD-19 null arms (at every coset factor) failed to discriminate', modal_P1: not fired, if_fired: 'H1-ARTIFACT (NOT-VALIDATED); on CTRL-ZN RUN-ARTIFACT'}
      - {id: RB-IR10, rule: 'IR-10, CTL-6 failing on a binary cell', own_metrics: 'integrity by construction; the delta test fired in 0 C-4 arms (IR10_rate 0.0 at every f)', modal_P1: not fired, if_fired: 'H1-ARTIFACT; on CTRL-ZN RUN-ARTIFACT'}
      - {id: RB-IR11, rule: 'IR-11, completeness audit discrepancy (or missing or short audit)', own_metrics: 'does not fire for a complete oracle', modal_P1: not fired, if_fired: 'H1-ARTIFACT, or INCOMPLETE'}
      - {id: RB-IR12, rule: 'IR-12 (NEW, J3-O7), per-target group operations above attempts x (2 bit_length(N) + 2)', own_metrics: 'Does not fire for the committed reuse arm: one attempt charges one double-and-add mul by c < N (at most 2 bit_length(N) operations) and one add, at most 2 bit_length(N) + 1 (D-17); certificates are never charged (lin_combo restores the counter)', modal_P1: 'not fired (P23 sets it and reads H1-ARTIFACT)', if_fired: 'H1-ARTIFACT; on CTRL-ZN a G1 (j) failure'}
    admission_rules:
      - {id: RB-AR-MU, rule: 'AR-MU, mu_c in [0.5, 2]', own_metrics: 'nominal mu_c about 1.0', modal_P1: not fired, if_fired: INCOMPLETE}
      - {id: RB-AR-COSET, rule: 'AR-COSET (NEW, R3-J3-2), lowest block degree >= 1.5, lowest block cycle excess >= 10, cross-block merges <= 1 percent of B_c', own_metrics: 'a function of setup counts only; never of a measured observable, so it cannot be moved by the data it protects', modal_P1: 'not fired at balance; at the C-4 representative compositions admits f = 1 (both cells) and 1.02 (BIN-ORD-19), halts BIN-KOB-19 at 1.02 and both at 1.05 and 1.10', if_fired: 'INCOMPLETE; NOT-VALIDATED'}
      - {id: RB-AR-ORDER, rule: 'AR-ORDER (two feasible routes)', own_metrics: 'feasible', modal_P1: not fired, if_fired: INCOMPLETE}
      - {id: RB-AR-DP, rule: 'AR-DP, dp_bits by formula', own_metrics: 'an ASSIGNMENT rule, not a test (3, 1, 1)', modal_P1: 'n/a', if_fired: 'n/a'}
      - {id: RB-AR-FIELD, rule: AR-FIELD, own_metrics: 'passes for a correct field module', modal_P1: not fired, if_fired: INCOMPLETE}
      - {id: RB-AR-CURVE, rule: AR-CURVE, own_metrics: 'passes for a correct adapter', modal_P1: not fired, if_fired: INCOMPLETE}
      - {id: RB-AR-ORACLE, rule: AR-ORACLE, own_metrics: 'passes for a complete oracle', modal_P1: not fired, if_fired: INCOMPLETE}
      - {id: RB-AR-I1, rule: 'I1 self-test, G1 (h)', own_metrics: 'deterministic; traced in derivation_notes D-13 (carried)', modal_P1: not fired, if_fired: RUN-ARTIFACT}
      - {id: RB-NO-SELECTION, rule: 'no admission rule selects L cells; every fit uses all declared L cells', own_metrics: 'by construction (am_core fit_cells)', modal_P1: 'n/a', if_fired: 'n/a'}
