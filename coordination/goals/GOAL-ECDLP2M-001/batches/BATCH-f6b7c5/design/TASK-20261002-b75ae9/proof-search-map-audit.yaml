  hidden_cofactor_la_constant:
    rule: R2-J1-3, restated per R3-J1-1
    statement: >-
      LA = k m B^2 modular multiply-adds with k = 1 in model M_m and in the
      pinned D3 comparator (CORR-20260928-4cb669 uses the same model), so the
      contract is internally consistent. Iterative sparse solvers are commonly
      costed at about 2B to 3B matrix-vector products (a RECALLED pointer,
      TASK-20260929-45204f J1-D3, not retrieved, not load-bearing).
      Sensitivity, information only, comparator inputs held fixed: at k = 2
      and 3 the m = 4 SUB-CAP slice and ENVELOPE lower edges move from 0.00 to
      1.36 and 2.28 bits at g = 0 (sub-cap printed by stage0.py: 1.3561 and
      2.2750, version-3 C-3), from 4.80 to 6.00 and 6.70 at g = 6 on the
      envelope (9.4230 to 9.4883 and 9.5522 on the sub-cap slice), from 11.20
      to 12.40 and 13.10 at g = 14 (envelope; TASK-20260929-45204f J1-D3); the
      m = 4 CAP SLICE lower end, which the LA term holds (LA = 4 B_cap^2 =
      2^69.79 against B_cap A(1) C = 2^45.57 at log2 C = 11.010251), moves by
      the full 2 log2 k = 2.000 and 3.170 bits, from 17.9669 to 19.9669 and
      21.1368 at log2 C = 11.010251, similarly at 20 and by +1.96 and +3.12 at
      30 (TASK-20260929-7fb81e J1-D1, review computation; the 2 log2 k law is
      producer arithmetic: log2 L_lo is about 2 log2 b and b about LA /
      rho_1 there); the m = 5 D3 lower end from 1.22 to 1.40 and 1.57 (1.3986
      and 1.5708 printed); upper edges by at most 0.01; the m = 5 and
      sub-cap critical g by less than 1e-4 (12.25595 to 12.25594 and 12.25593;
      14.78502 to 14.78498 and 14.78495, printed); the cap-slice critical
      log2 C from 42.1383 to 42.1323 and 42.1263 and the envelope closing g
      from 31.5169 to 31.5075 and 31.4982, so the critical and closing values
      move by at most 0.02 (TASK-20260929-7fb81e J1-D1); LA stays below P_gen
      at every m (smallest margin 6.05 bits, m = 4, k = 3); the LA time
      column moves by log2 k = 1.00 and 1.58 bits. At k >= 2 the lower window
      edges exceed the 1-bit design tolerance: the constant is a hidden
      cofactor of the lower edges, not of the frontier column, the critical
      g or the closing g. stage0.py prints the sub-cap and m = 5 part (C-3);
      the cap-slice and envelope figures at k > 1 are not printed (the
      optional print of R3-J1-1 is not added, r3_discharge_table).

