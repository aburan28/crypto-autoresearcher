  coset_model:
    requirement: R3-J3-2 (and the disclosure in A5)
    structure: >-
      A point R of G decomposes as R = x + y with x, y in the signed base
      Sigma only if x lies in some coset c of G and y in -c. So both legs of
      every relation (aP0, in G) and of every target decomposition (Q_t +
      cP0, in G) lie in one COSET BLOCK {c, -c}. BIN-ORD-19 (h = 2): blocks
      {0} and {1}. BIN-KOB-19 (h = 4; the 2-part of a binary curve's group
      is cyclic, so E/G is Z/4): blocks {0}, {2} and {1, 3}; a column {Q, -Q}
      of block {1, 3} holds one point of coset 1 and one of coset 3. CTRL-ZN:
      one block. The relation graph is the disjoint union of the block
      subgraphs, apart from columns that merge points of two blocks (counted
      at setup; AR-COSET caps them at 1 percent of B_c).
    charged_predictions: >-
      With n_k columns and pair mass P_k = sum over c in block k of |Sigma_c|
      |Sigma_-c|: f = h sum_k P_k / |Sigma|^2 (Cauchy-Schwarz: f >= 1, equal
      iff balanced); mu_eff = f mu_c, the mean number of unordered
      decompositions of a uniform point of G; w_k = P_k / sum P; pi_k =
      n_k / B_c; d_k = 2 w_k / pi_k; delta_pred = sum pi_k rho(d_k); u_pred =
      sum w_k rho(d_k)^2; kappa_pred = 1 - exp(-mu_eff); a_pred = 1/(1 -
      exp(-mu_eff u_pred)); K_pred = B_c A(mu_eff) / a_pred; rho_rel =
      relation attempts kappa_pred / B_c. T_u's reference is sum w_k
      delta_hat_k^2 from the measured per-block fractions (exact under H1
      given the realised graph). Spread: delta_hat has variance (scale / B)
      [sum pi_k var_m(d_k) + 4 (sum w_k rho'_k^2 - (sum w_k rho'_k)^2)] (the
      within-block fixed-edge spread plus the multinomial split of B
      relations over blocks), and u has variance scale [sum (2 w_k rho_k)^2
      var_m(d_k) / n_k + B (sum a_k^2 w_k - (sum a_k w_k)^2)] with a_k = 4 w_k
      rho_k rho'_k / n_k, where var_m(c) = rho (1 - rho) (1 - 2 c rho (1 -
      rho)) / (1 - c (1 - rho))^2 and scale = 0.403^2 / var_m(2) = 1.0031 (so
      one block gives 0.403 / sqrt(B) and 2 x 0.403 delta / sqrt(B), the
      version-3 values). binstd_core.cell_model is the one function every
      prediction reads.
    fixed_edge_spread_check: >-
      Producer arithmetic (D-19): at c = 2, rho = 0.796812, 1 - rho =
      0.203188, s = 1 - 2 (0.203188) = 0.593624, rho (1 - rho) = 0.161904, 1 -
      2 c rho (1 - rho) = 1 - 4 (0.161904) = 0.352384 = s^2, so var_m(2) =
      rho (1 - rho) = 0.161904 = 0.40237^2, beside the contract's empirical
      0.403 and the version-3 red team's measured 0.4025 (B = 128) and 0.405
      (B = 512). The G(n, p) formula rho (1 - rho) / s^2 is a RECALLED pointer
      (not retrieved); its fixed-edge reduction is producer arithmetic,
      checked only at c = 2 against those measurements and exercised at other
      c only through the C-4 Monte Carlo.
    why_the_blocks_not_only_f: >-
      Producer hand arithmetic (D-19), the reason R3-J3-2 is charged by
      blocks: BIN-ORD-19 with column shares 0.5707 and 0.4293 (f = 2 (0.5707^2
      + 0.4293^2) = 1.02) has block degrees 4 pi_k / f = 2.238 and 1.684 and
      block fractions rho = 0.851 and 0.682 (one-step iteration of y = 1 -
      exp(-d y), about 0.005 precision), so delta = 0.5707 (0.851) + 0.4293
      (0.682) = 0.7785 against 0.7968 balanced (-0.018, one T_delta standard
      deviation), and with w_k = 2 pi_k^2 / f = 0.6386 and 0.3614 the usable
      fraction is 0.6386 (0.851^2) + 0.3614 (0.682^2) = 0.6306 against
      delta^2 = 0.6061, an offset of +0.0245, about 2.7 standard errors of T_u
      at n_dec about 2970. A balanced-model prediction at f mu_c would
      therefore misread H1-true cells; C-4 confirms it on the same draws: read
      through the uncharged one-block model, H1-true cells at f = 1.02 are
      non-PASS in 45.6 (BIN-ORD-19) and 54.3 (BIN-KOB-19) percent of
      replicates, mostly T_u high, against 1.95 percent charged
      (calibration).
    cycle_excess_and_the_admission_floor: >-
      A block's giant component is DETERMINED (has a logarithm for every
      column) only if one of its independent cycles is unbalanced (sign
      product -1) or a coefficient-2 loop; with random signs each nonzero
      element of the cycle space is unbalanced with probability 1/2, so a
      giant of cycle excess X is undetermined with probability 2^-X, and with
      X about Poisson(E) the probability is exp(-E/2). The expected excess of
      a giant with fraction rho at mean degree d on n columns is E = n rho
      (d (1 - rho/2) - 1) (edges inside the giant, (d n / 2)(2 rho - rho^2),
      less its vertices). Producer arithmetic (D-20): balanced blocks have E =
      20.7 (128 columns) and 41.4 (256 columns), so exp(-E/2) is below 4e-5;
      BIN-KOB-19's representative block {2} at f = 1.02 (102 columns, d =
      1.5615, rho = 0.6203) has E = 102 (0.6203) (1.5615 (0.68985) - 1) = 4.88
      and exp(-2.44) = 0.087, beside the 9.4 percent T_delta-low rate C-4 run 1
      found there. AR-COSET's floor E >= 10 bounds the undetermined-giant
      probability per block by exp(-5) = 0.0067. These are model arithmetic
      and a design computation, not observations.
    expected_f_for_a_pseudo_random_base: >-
      Producer arithmetic under a multinomial model of the coset of each of
      about n = 512 x-values (an assumption; the real counts are measured at
      setup): E f - 1 = 1/n = 0.002 for h = 2 (f = 2 (a^2 + b^2) with a + b =
      1) and 2/n = 0.004 for h = 4 (f = 4 (a^2 + b^2 + c^2 / 2) over the
      shares of blocks {0}, {2}, {1, 3}). A 1.02 coset factor would be a
      structured imbalance, about 3 standard deviations of the multinomial
      model at h = 2.
    representative_compositions_for_c4: >-
      composition(cell, f): BIN-ORD-19 column shares 1/2 + sqrt(f - 1)/2 and
      the rest; BIN-KOB-19 shares 1/4 + e, 1/4 - e and 1/2 with e = sqrt((f -
      1)/8). One family per cell; other compositions at the same f have other
      block degrees, which is why the admission rule is stated on the block
      degrees and cycle excess, not on f.

