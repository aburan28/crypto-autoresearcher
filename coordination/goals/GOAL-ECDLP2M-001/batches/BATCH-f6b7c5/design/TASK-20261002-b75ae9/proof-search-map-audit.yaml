      status: filled
      ceiling: >-
        H-BINSTD-14f77e proof_search_map.method_ceiling: a frontier column
        with its conventions, the pinned D3 column, the m = 5 window at B =
        B_cap(5), the m = 4 slices and envelope on one range, and a toy
        validation at m = 2, on two binary n = 19 cells and a relabelled Z/NZ
        control, of the per-cell laws the reuse arm can test (relation-phase
        yield, attempts law, determined-column law, target coverage), each
        gated against coset-charged predictions, with the no-reuse null
        separated, and of the pooled law under H2. It never certifies C at
        n = 131 for any oracle, a window at deployed L, the L-dimension of the
        amortisation law, the tails, or a point below the frontier.
      nearby_objects: >-
        The relabelled Z/NZ group with the enumeration oracle (one block;
        bands scaled to its own regime); the ordinary against the Koblitz
        n = 19 cell (CTL-2, wired as H1-MIXED and H2-MIXED; predictions
        identical at matched B, mu and block composition); the no-reuse null
        (CTL-8, PTM-D); PTM-A; PTM-B; PTM-C (the m = 5 window empty at g = 14;
        identical predictions on all three cells at matched mu, B, coset
        factor and block composition); PTM-E (matched-mean coverage deficits
        of 5, 10 and 15 percent, low and high dispersion, where H1 (e) is
        false: never POSITIVE at a size T_kappa flags; outcome patterns P20,
        P21 and the sweep's T_kappa rows). The per-cell bands equalise the
        NOMINAL standard-deviation multiple of each test, not the realised
        false-fail rates, which C-4 states per cell (R3-J3-5). A physical H1
        negative-control cell (RC-3) is not added (recommended_items).
      closed_form_cross_check: >-
        Carried from version 3. With a = kappa_m C / rho_1 and b about A(1)
        B_cap C / rho_1, 4ab = 1 gives C_crit = T_gen sqrt(pi / (8 A(1)
        kappa_m)), so g_crit = (T_gen - c0) + (1/2) log2(pi / (8 A(1)
        kappa_m)) less a small LA correction: 12.256 at m = 5 (D3 convention)
        and log2 C_crit = 42.144 at the m = 4 cap slice (exact quadratic
        42.138). stage0_code computes both routes and self-checks them within
        0.05.
    strictness_obligation:
      status: not_applicable
      not_applicable_reason: >-
        No strict improvement over any baseline is claimed. The proposal's
        clause that an oracle below T_gen would be the first ECDLP algorithm
