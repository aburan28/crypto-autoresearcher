      (1 - exp(-mu_eff)), E D = mu_eff kept; low dispersion D | D >= 1 on {1,
      2}, high dispersion D | D >= 1 = 1 + Poisson(mu_eff / q - 1); usability
      independent with probability u_pred; a_ratio = (1 - exp(-mu_eff u_pred))
      / p_use and rho_rel = 1 / ratio. These are the version-3 red team's two
      deficit families (TASK-20260929-810095 J3-D1); at ratio 0.9 low
      dispersion the committed formula gives a_ratio 1.01927, which reproduces
      that report's counterexample input 1.0193 (producer hand arithmetic,
      derivation_notes D-16).
