          calibration Monte Carlo re-run with the version-4 gate set (C-4),
          restating the per-cell false-fail rates (calibration; E
          outcome_table.most_likely). (5) THE SEAM IS CLOSED, not declared:
          version 3's separate deficit flag (yield_audit, z at or below -3) is
          withdrawn; the deficit flag is now the same predicate as T_kappa low
          (z below -3.3), computed by the same kappa_z and the same side()
          call, so no deficit is flagged that the table can pass. Why 3.3 and
          not 3.0: the preferred remedy's band verbatim; the same multiple as
          T_delta, T_cmp and T_rho; and one more tenth of a standard error of
          sensitivity would buy 0.17 percent more false-fail per cell per
          test. Cost, stated: matched-mean deficits with z in (-3.3, -3]
          (about 4.3 to 4.7 percent at the nominal binary regime), which
          version 3 flagged but routed to PASS, are now neither flagged nor
          failed; certifies_only states that a POSITIVE does not certify
