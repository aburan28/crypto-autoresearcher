        unchanged H2 rules. The binary cells' rates are at REPRESENTATIVE
        compositions (one family per cell), not at the real cells' counts,
        which are measured at setup.
    - id: OI-4
      for: the approving decision and the execution batch
      text: >-
        S1c (OI-5 of the version-3 round, adopted) binds the run but cannot
        schedule the code-review card for the pinned I3 to I5 files; the
        approving decision must open it in the execution batch, or Stage 2
        cannot start.
    - id: OI-6
      for: the Coordinator (ranking)
      text: >-
        RC-3 was not added (recommended_items). Its successor is a separately
        designed physical negative-control card (a Z/NZ cell with a structured
        repeated-sums base of KN-FIND-007's type) whose base structure and
        predicted coverage deficit, determined fraction and attempts law are
        computed first, so its expected class is a prediction and not a
        guess. Not designed here.
    - id: OI-7
      for: the reviewers (plan J3) and the composer
      text: >-
        Inside the admitted AR-COSET region the per-cell false-fail rate was
        computed at one composition per cell and coset factor; the highest
        admitted value is 1.95 percent (BIN-ORD-19, f = 1.02, lowest block
        degree 1.69, excess 16.3), with T_delta low at 1.25 percent, ten times
        its balanced rate and not explained by the cycle-excess bound
        (2.8e-4). Compositions nearer the floor (degree 1.5 to 1.69, excess 10
        to 16) were not computed and may have a higher rate. A reviewer
        computation at the admission boundary, or a tighter floor in a later
        version, would close this; under a pseudo-random coset assignment the
        expected f - 1 is about 0.002 to 0.004, far from that boundary.
    - id: OI-8
      for: the execution batch
      text: >-
        The realised coset counts of each binary cell are unknown until
        setup. AR-COSET and the charged predictions are computed from them
        then; a structured imbalance large enough to halt a cell is an
        INCOMPLETE (admission) outcome, never evidence about H1.
    - id: OI-5
      for: numbering only
      text: >-
        Not an open issue of this sheet. OI-5 names the version-3 round's
        item (DEC-20260929-54dcd8 recommended_not_required) adopted as S1c in
        recommended_items; what remains of it is carried in OI-4.

