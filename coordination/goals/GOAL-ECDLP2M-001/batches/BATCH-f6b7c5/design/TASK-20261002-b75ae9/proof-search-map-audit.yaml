      R3-J3-1 item (4) (the calibration re-run with the version-4 gate set),
      R3-J3-2 (the per-cell false-fail table at f = 1, 1.02, 1.05, 1.10 under
      the chosen remedy) and R3-J3-5 (realised per-cell rates stated, not
      asserted equal).
    program: fixture_code calibration (binstd_core.py --calibration RUNS SEED)
    command: python3 binstd_core.py --calibration 4000 20261002
    session_computation: >-
      C-4 run 2, on the bound code (fixture_code sha256 f22babf6...038e):
      exit 0, stdout 23870 bytes, sha256
      127c66548c3e2e683687bf11e168a097edd763c398f54dfc6a90a2962d55f4bb,
      stderr the time output only (real 8m57.394s); verbatim in
      session_computations C-4. Run 1 (code before the excess floor, PD-P3):
      exit 0, stdout 21561 bytes, sha256 2bce020f... (session log
