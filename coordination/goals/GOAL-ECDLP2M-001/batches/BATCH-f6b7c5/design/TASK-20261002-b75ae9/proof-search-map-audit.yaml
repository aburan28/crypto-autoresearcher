  recommended_items:
    rule: DEC-20260929-54dcd8 recommended_not_required; each adopted or answered with a reason (card DA4-6).
    items:
      - id: RC-3
        item: a physical negative-control cell for H1 (a Z/NZ cell with a structured repeated-sums base of KN-FIND-007's type, expected to read LOW-RETRY with a coverage deficit)
        disposition: NOT ADDED
        reason: >-
          (1) A negative control is only informative if its departure from H1
          is predicted quantitatively before the run; for a structured
          repeated-sums base on Z/NZ the coverage deficit, the determined
          fraction and the attempts law would all move, by amounts this
          producer cannot compute without a shell, so the control's own
          expected class would be an unvalidated guess and a mismatch would be
          uninterpretable (it could be the control's prediction, not the
          table). (2) The property RC-3 exists to show, that the instrument and
          table reach a declared NEGATIVE on deficit data, is shown here on the
          committed decision code by the false-pass sweep (C-5) and the
          generative patterns P6, P20 and P21 (C-6), and the instrument side
          (decomposition counts, nonempty attempts) is the same code path the
          completeness audit IR-11 checks against brute force. (3) Adding a
          fourth executable cell enlarges the run and the I3 to I5 surface
          that no design reviewer reads (OI-5). Successor: a separately
          designed control card whose base structure and predicted deficit are
          computed first (open_issues OI-6), rankable by the Coordinator.
      - id: O-J2-1
        item: null the axis labels in stage2_outcome when the contract label is RUN-ARTIFACT
        disposition: ADOPTED
        clause: fixture_code stage2_outcome (h1a = h2a = None when the run is not valid); E contract_label.RUN-ARTIFACT; patterns P19 and P25 return null axes (C-6).
      - id: O-J2-2
        item: read the in-cell certificates as a second guard beside verify.py IR2_fired
        disposition: ADOPTED
        clause: fixture_code run_cell certificates_ok and run_validity(in_cell_ir2); stage2_outcome; E IR-2 and CTL-3; pattern P25 (an in-cell certificate failure reads RUN-ARTIFACT, C-6).
      - id: J3-O7
        item: a cheap gate on per-target generic group operations
        disposition: ADOPTED
        clause: fixture_code gops_per_attempt, run_cell gops_ok, g1_checks (j), stage2_outcome IR-12; E definitions.group_operation_bound, CTL-10, IR-12, I4 (mul charge bound); pattern P23 (C-6).
      - id: OI-5
        item: a code-review card for the I3 to I5 code before Stage 2
        disposition: ADOPTED AS A RULE OF THE RUN
        clause: E stopping rule S1c (Stage 2 does not start without a completed code-review report of the pinned I3 to I5 files named in the execution batch's snapshot receipt) and IR-6 (a Stage 2 started without it is RUN-ARTIFACT). Scheduling the card remains the approving decision's act; this contract cannot open a batch.
      - id: OI-2
        item: vendor the three retrieved PDFs under inputs/ with their sha256
        disposition: NOT DONE HERE (scope change returned to the Coordinator)
        reason: inputs/ is outside this card's write_scope (three declared files only, DA4-1); the card itself says vendored files would be a scope change returned to the Coordinator. Carried as open_issues OI-2.

