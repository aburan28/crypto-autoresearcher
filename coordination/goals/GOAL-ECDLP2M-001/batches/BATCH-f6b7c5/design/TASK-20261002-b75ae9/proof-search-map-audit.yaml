                env[str(g)] = None
                continue
            lo = min(ws, key=lambda t: t[1][0])
            hi = max(ws, key=lambda t: t[1][1])
            srt = sorted(w for _, w in ws)
            reach, contiguous, min_overlap = srt[0][1], True, None
            for w in srt[1:]:
                gap = reach - w[0]
                min_overlap = gap if min_overlap is None else min(min_overlap, gap)
