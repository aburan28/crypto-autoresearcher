  outcome_reachability:
    rule: >-
      For each declared outcome, a per-cell pattern built from GENERATIVE
      quantities through the reuse-arm identities (fixture_code gen_values,
      coverage_values, gen_null, composition) and coded in outcome_patterns
      with its expected assignment; outcome_patterns_main exits 0 iff the
      committed classifiers reproduce every one (a design computation; no
      group, no oracle, no measurement). Nominal: CTRL-ZN B = 128, mu =
      0.0312498; binary B = 512, mu = 1, one balanced block unless a
      composition is named; n_t = 1365; pools the Kuhn-Struik values.
    session_computation: C-6 run 2 (stdout sha256 d31d1ea0c6b7055a420632caed739f42a3f98f5c137bd06997c93c420ea7a784; exit 0; 28 patterns, mismatches 0; IR5_on_declared_figures ic_reading_valid true; verbatim in session_computations). Run 1 (27 patterns, P26 with the f = 1.02 BIN-KOB-19 composition, before the excess floor) also matched every assignment.
