  kn_tech_080_audits:
    audit_1_bottleneck_and_baseline_embedding:
      status: filled
      bottleneck: >-
        Whether an arity-m oracle at the cap locus has per-attempt cost C
        below sqrt(N_prime / B_cap) up to the disclosed constants. Every other
        quantity of the preprocessing row is model arithmetic. The question
        this row is built to inform is DEC-20260928-63addc S1
        decision_it_changes (whether the reachability table carries a second
        budget row and how m >= 4 oracle records are read against it); that
        is a Coordinator decision after the run, not a claim of this record.
      parameter_slices: >-
        Carried from version 3 unchanged (the Stage 0 code is byte-identical,
        C-1; its output is byte-identical, C-3). (i) L = 1. At m = 4 on the
        sub-cap base log2 B = 29.036035 at the frozen inputs (C = 2^11.010251)
        the model terms give log2(IC(1)/rho_1) = -1.63e-7, a g = 0 lower root
        log2 L_lo = -3.25e-7 and an L = 1 tie budget 11.010251407, 4.07e-7 bit
        above D3_4; the TIE RULE (|log2 L_lo| below 1e-4 is the L = 1 tie,
        never an advantage) is LOAD-BEARING there. At m = 5 on B = B_cap(5)
        the model charges A(1) = 1.582 attempts per relation while D3 charges
        one, so the slice reproduces the 1.58-attempt law: at the frozen
        proposal input 32.414212, log2(IC(1)/rho_1) = 1.43e-5 and log2 L_lo =
        2.87e-5 (the tie); the tie budget sits 0.66174 bit below D3(5); at
        C = 2^33.075936 (D3) it reads 0.6078. (ii) C = T_gen reproduces the
        generic frontier point: B_cap T_gen = P_gen, an algebraic identity
        (PTM-A). (iii) m = 23 with B = 524 known-log points is
        IDEA-20260926-178821's zero-relation row as the L = 1, S = 524
        endpoint (cited by id; not re-derived).
      symbolic_check: >-
        log2(B_cap T_gen) - log2 P_gen = log2 B_cap + (log2 N_prime - log2
        B_cap)/2 - (log2 N_prime + log2 B_cap)/2 = 0 identically. At g = 0 in
        the m = 5 D3 convention b = 1.523888 at the frozen c0 (1.523877 at the
        unrounded D3(5); TASK-20260929-7fb81e O-J1-2) and log2 L_lo = 1.2155.
        stage0_code prints every L = 1 quantity from the model terms, so each
        can fail (S0 tolerances 1e-4, 0.01, 0.001).
      frozen_fixture: >-
        fixture_code below (binstd_core.py): the Stage 1 gate G1 on CTRL-ZN,
        standard library only, import-safe, with its pass criterion stated
        before execution in its docstring, in fixture_pass_criterion and in
        EXP-BINSTD-a222b4 stages.stage_1. The same module is the instrument
        code (I1, I2, the IC arms, the cell model, the bands, the gates, the
        classifier, the IR-5 check, the coverage statistic and stage2_outcome)
        that the Stage 2 driver imports unchanged, so the gate tests the
        instruments Stage 2 reads. Not a plan: code.
    audit_2_observation_collision:
      status: filled
      observable: >-
        The per-cell tests T_delta (determined fraction), T_u (usable
        probability per decomposition), T_a (attempts per target), T_kappa
        (target coverage; NEW, gated), T_rho (relation-phase yield; NEW,
        gated), T_cmp (binary against control) and the amortisation gates AM1
        (KR), AM2 (FR), AM3 (d_sigma), every prediction from the cell's
        coset-charged model. REDUCTION: in the reuse arm FR = a_bar / a_pred
        exactly, KR x FR = rho_rel exactly, d_sigma = sigma_pred(KR K_pred) -
        sigma_pred(K_pred) up to per-L noise; AM1 to AM3 reduce to (rho_rel,
        a_bar); the L-dimension of the amortisation law is NOT tested.
      collision_found: >-
        YES, and each preimage is separated or routed to a declared
        non-POSITIVE outcome. (O1) genuine reuse: every test passes. (O2) an
        over-complete relation set: delta_hat near 1, IR-10 (H1-ARTIFACT).
        (O3) the no-reuse null (CTL-8): outside the AM bands with KR below
        0.125, else IR-9 (H1-ARTIFACT); never inside a band in 4 x 4000
        simulated BIN-ORD-19 null arms and 4000 CTRL-ZN arms of C-4. (O4)
        coverage-limited reuse: a coverage test low, LOW-COV;
        H1-NEGATIVE-COVERAGE on both binary cells. (O5) a KN-FIND-007-direction
        coverage deficit at matched mean: T_kappa low at every deficit the
        coverage statistic flags (the SEPARATOR version 3 lacked: J3-D1),
        LOW-RETRY (or SPLIT with a high failure), H1-NEGATIVE-YIELD on both
        binary cells; the smallest flagged matched-mean deficit at the nominal
        binary regime is 4.69 percent (low dispersion) and 4.61 percent (high
        dispersion), 6.87 percent on CTRL-ZN (C-5); smaller deficits share the
        PASS fibre with H1 true and are certified as not detected at that
        size, never as absent (outcome_table.certifies_only). (O6) the
        no-reuse null fed as the reuse arm: LOW-RETRY with coverage nominal,
        H1-NEGATIVE-DEVIANT. (O7) an oracle missing decompositions: IR-11 or
        AR-ORACLE (ARTIFACT or INCOMPLETE). (O8) an unbalanced coset
        composition (NEW): absorbed by the charged predictions; near-critical
        or few-cycle blocks halted by AR-COSET (INCOMPLETE); without the
        charge it would read HIGH or SPLIT on 45 to 54 percent of H1-true
        replicates at f about 1.02 (C-4 uncharged rows, information). (O9) a
        per-target pipeline spending generic group operations (NEW): IR-12
        (H1-ARTIFACT).
      separating_conditions: >-
        Two-sided per-cell bands on every gated observable, T_kappa and T_rho
        included; the CTL-8 null arm wired into IR-9 (and G1 (b) on CTRL-ZN);
        CTL-6 into IR-10 and G1 (c); the two-sided T_cmp against the charged
        prediction difference; the completeness audit IR-11; the step 2
        self-tests and AR-COSET under S3; IR-12 and G1 (j); CERT-LOG, which
        certifies the stored vector, read by verify.py and in-cell.
    audit_3_quantifier_order:
      status: filled
      statement: >-
        FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at base
        size B, under A1 to A6 and H1: IC(L) = T_shared(B, C) + L
        per_target(B, C), and at B = B_cap the leading-order precomputation
        equals P_gen at C = T_gen. FOR ALL g below the critical value THERE
        EXISTS a non-empty window of L on which IC(L) < c rho_1 sqrt(L) holds
        under H2 with c = 1. NOT CLAIMED: that any oracle has C at or below
        any budget; that any point lies below the generic frontier.
      witness_dependence: >-
        The window endpoints depend on m, g, the base size B and the generic
        multi-target constant c (log2 L_hi by +2 log2 c, the critical log2 C
        by about +log2 c), so c = 1 is the narrowest window and the lowest
        critical C. At m = 5 the contract fixes B = B_cap(5). At m = 4 the
        envelope is over the ONE committed range log2 B in [29.036035,
        35.996035]. The toy predictions depend on the cell's measured B_c,
        mu_c, n_t, coset factor and block composition (and on the seed
        streams); never on the cell's name.
      failure_mode_checked: >-
        A witness depending on the target set (leakage between L cells) is
        excluded by disjoint fresh targets with recorded seed labels; the null
        arm's targets (t = 1365 to 1385) are disjoint from the reuse arm's
        (t = 0 to 1364). A prediction depending on the cell's identity is
        excluded by construction: every prediction is binstd_core.cell_model
        of the setup counts (PTM-C).
