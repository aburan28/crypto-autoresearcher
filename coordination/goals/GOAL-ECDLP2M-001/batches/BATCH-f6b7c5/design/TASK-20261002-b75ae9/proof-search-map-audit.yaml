        y = 0.5
        for _ in range(500):
            y = 1.0 - math.exp(-c * y)
        return y


    def a2(mu, u):
        return 1.0 / (-math.expm1(-mu * u))


    def kp(B, mu, u):
        return B * (-math.expm1(-mu * u)) / (-math.expm1(-mu))


    def sig(K, cells):
        return slope([LOG2(L) for L in cells], [LOG2(K / L + 1.0) for L in cells])


