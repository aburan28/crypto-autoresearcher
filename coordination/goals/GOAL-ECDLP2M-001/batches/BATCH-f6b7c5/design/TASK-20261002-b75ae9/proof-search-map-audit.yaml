      No rule fires on the contract's own declared metrics or on P1. Every
      rule that can fire routes to RUN-ARTIFACT, INCOMPLETE or ARTIFACT, never
      to NEGATIVE; the new rules (S1c, AR-COSET, IR-12, the in-cell IR-2) are
      instrument or admission rules of the same kind. Every declared outcome
      keeps a reaching pattern (outcome_reachability).
