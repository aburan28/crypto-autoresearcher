      - {id: RB-G1b, conjunct: '(b) null discriminates', model_false_fail: '0 of 4000 (C-4)', modal_P1: pass}
      - {id: RB-G1c, conjunct: '(c) CTL-6', model_false_fail: '0 of 4000 (C-4)', modal_P1: pass}
