      succeeds with p = 1 - exp(-mu u). At mu = 1: p = 0.4700164, a_2(1) =
      2.127585; single acceptance would give 2.492. On CTRL-ZN mu = 2 x 128^2
      / 1048583 = 0.0312498; mu u = 0.0198408, p = 0.0196452, a_2 = 50.903;
      A(mu) = 32.503. Knee: K_pred = B A(mu) / a_2 = 81.731 on CTRL-ZN and
      380.70 on a nominal binary cell. sigma_pred: -0.6398 (CTRL-ZN, L_IC),
      -0.9399 (CTRL-ZN, L_NULL), -0.8322 and -0.9861 (nominal binary).
