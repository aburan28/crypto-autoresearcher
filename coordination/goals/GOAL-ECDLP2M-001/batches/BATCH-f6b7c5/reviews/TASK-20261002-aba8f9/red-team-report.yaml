  defects:
  - id: J3-D1
    severity: breaking
    title: BIN-KOB-19's paired coset block {1, 3} is not a random signed multigraph at m = 2
    breaking_artifacts_matched:
    - a gate with a false-fail rate above 5 percent under the true model at a declared regime
    - a declared outcome no data can reach
    statement: The contract states that E/G is Z/4 on BIN-KOB-19, that the blocks are {0}, {2} and {1, 3}, that
      a point of G decomposes as x + y with x in a coset c and y in -c, and that a column {Q, -Q} of block {1, 3}
      holds one point of coset 1 and one of coset 3 (specification definitions.coset_model; audit coset_model.structure;
      fixture_code composition() docstring). It follows, with no further assumption, that every decomposition of
      a point of G inside block {1, 3} pairs the coset-1 point P_i of one column with the coset-3 point -P_j of
      another, so with the coset-1 projections as representatives every relation of the block reads L_i - L_j =
      log R (i = j is excluded, since P_i - P_i = O). Every cycle of the block's signed graph then has sign product
      +1 (any other choice of representatives is a switching and changes no cycle's sign), so no column of an ordinary
      block-{1,3} component is determined, whatever the number of relations. cell_model nevertheless predicts rho(d_13)
      = 0.797 for that block, AR-COSET's excess floor assumes each independent cycle is unbalanced with probability
      1/2, and C-4's _mc_legs draws free signs there.
    evidence:
    - 'C4 (sign_balance_check.py): synthetic rows with the coset-forced sign pattern, solved by the committed FullVectorElim
      modulo 1000003: block-{1,3} determined fraction 0.0 in 200 of 200 runs (maximum 0.0), total 0.3967; with free
      signs everywhere 0.7955; cell_model 0.796812'
    - 'C6 (mc_ff.py, coset-forced): BIN-KOB-19 non-PASS 100 percent at balance and at f = 1.0198 (LOW-COV 99.9 and
      99.8 percent); T_delta 100, AM1 100 (90.1 at f = 1.02), AM2 100 (98.25), T_cmp 96.75 (23.35)'
    - 'C9: BIN-KOB-19''s coset-forced model point is LOW-COV with delta_hat 0.398 against a T_delta band starting
      at 0.738; delta_hat <= (n_0 + n_2) / B_c = 0.5 at balance'
    - 'C11 (defect columns, below): non-PASS 69.85, 38.1, 27.95 and 11.1 percent with one identity column, one merged
      column, both, and identity plus two merged'
    defect_columns_qualification: 'The balance is broken only at ''defect'' columns whose incident rows can carry
      either sign: (a) the identity class of the order-4 points: x = 1 lies in V, and on y^2 + xy = x^3 + 1 the
      points (1, 0) and (1, 1) double to (0, 1), the 2-torsion point, so they have order 4 (reviewer derivation
      with the standard binary doubling x(2P) = lambda^2 + lambda + a, lambda = x + y / x, a RECALLED formula) and
      project to O; whether their rows carry mixed signs depends on how the uncommitted I4 code folds the sign of
      a class whose representative is O, which the contract does not state; (b) columns merging P and P + T2 inside
      block {1, 3}, which the contract counts as merges (x(P + T2) = sqrt(b) / x(P) is a RECALLED formula, so such
      merges need x and 1 / x both in V). With defect columns the block''s giant is determined only through a cycle
      that crosses one of them: a bimodal determined fraction (about 0.40 or about 0.80 overall), not the contract''s
      normal law with sd 0.018. The number and kind of defect columns on the real cell are setup counts this reviewer
      did not compute (no curve may be built here).'
    consequences:
    - BIN-KOB-19's per-cell false-fail under the cell's own algebra is 100 percent without defect columns and 11.1
      to 69.85 percent with one to three, against a breaking threshold of 5 percent
    - without defect columns H1-POSITIVE, contract POSITIVE and H1-NEGATIVE-YIELD are unreachable on the declared
      cells; the modal outcome is NOT-VALIDATED through H1-MIXED (about 0.99 given G1), not POSITIVE (the contract
      states about 0.91)
    - 'the contract''s NEGATIVE route then fires on BIN-ORD-19''s single-cell false-fail (about 1 percent: H1-NEGATIVE-COVERAGE
      0.25, H1-NEGATIVE-DEVIANT 0.75 in C6) instead of a two-cell product (the contract''s design figure is about
      0.0007 for NEGATIVE in all): a falsification of H1 manufactured by a design premise'
    - CTL-2's reading of an ordinary-against-Koblitz disagreement as H1-MIXED would attribute to H1 a difference
      fixed by the quotient's pairing structure; H1's formal premises (uniform legs within blocks, block shares
      w_k, Poisson counts) can hold exactly while consequence (b) fails
    - under the committed instrument no block-{1,3} decomposition is ever usable, so on BIN-KOB-19 the attempts
      per target would be about 3.68 against the charged 2.13 (u about 0.317 against 0.635)
    scope: A protocol-design defect of an unapproved contract at the toy validation arity m = 2 on BIN-KOB-19. BIN-ORD-19
      (quotient Z/2, both cosets self-paired) and CTRL-ZN are not affected. Nothing here is an observation of any
      curve, and nothing is stated about the deployed arities (this reviewer's balance argument does not extend
      to m >= 3, where mixed-sign rows exist; whether the deployed relation matrix has another structured rank defect
      is not examined).
  - id: J3-D2
    severity: moderate
    title: AR-COSET halts BIN-KOB-19 in about 11.5 percent of the compositions the contract's own coset model expects
    statement: 'Under the contract''s stated pseudo-random (multinomial) coset assignment, which gives the mean
      f - 1 of 0.002 and 0.004 the contract quotes (reproduced: 0.0019 and 0.0039), AR-COSET admits BIN-ORD-19 in
      100 percent of 20000 draws but BIN-KOB-19 in only 88.48 percent: the cycle-excess floor binds on the 128-column
      blocks {0}, {2} at |n_0 - n_2| of about 30 columns (f - 1 about 0.006 to 0.008). The most_likely statement
      (''where the f = 1 rates apply'') omits this INCOMPLETE risk, which is a property of the fixed cell and cannot
      be rerun away.'
    evidence:
    - C7 (mc_boundary.py) multinomial_coset_assignment and the boundary scan in the scratch log
    consequence: A stated reachability cost of every outcome but H1-INCOMPLETE; not a false-fail and not breaking
      on its own.
  - id: J3-D3
    severity: minor
    title: stage2_outcome trusts the cell's class without checking the gated test set
    statement: run_cell computes the class from gate_tests(values, zn); with zn None (the I5 driver, uncommitted,
      failing to load fixture.json) T_cmp is silently absent and classify_cell treats the cell as if the test passed.
      Neither run_cell nor stage2_outcome checks that a binary cell's gate_table holds all nine rows. A false-pass
      route through uncommitted code that S1c's review may or may not catch.
    remedy: stage2_outcome (or run_cell for binary cells) halts or invalidates a cell whose tests lack any gate_table
      row, T_cmp included.
  observations:
  - id: J3-O1
    text: 'H2 band false-fail in this reviewer''s crude random-mapping model is 4.83 (CTRL-ZN), 3.25 (BIN-ORD-19)
      and 3.60 (BIN-KOB-19) percent per cell, below 5 but not small: about 2.5 percent per cell from c(1) < 0.8
      (30-seed sampling noise of Rayleigh-like single-target walks; robust) and, on CTRL-ZN, 2.3 percent from c(256)
      > 1.3 (sensitive to the distinguished-point overshoot model; at dp_bits 3 the overshoot is designed to be
      up to one eighth of the smallest per-target walk). P(H2-POSITIVE) about 0.89 here against the contract''s
      carried 0.93. Model-dependent; the H2 rules are unchanged from version 3.'
  - id: J3-O2
    text: 'IR-12 and G1 (j) bind only on the binary cells: on CTRL-ZN the bound is 44 operations per attempt, about
      2240 per target at a_pred 50.9, above a single-target generic solve of about 1283 walk steps at N about 2^20;
      on BIN-ORD-19 38 x 2.13, about 81, against about 641 (sqrt(pi q / 2), q = 261823). Adequate for its stated
      purpose (accidental generic work on the binary cells).'
  - id: J3-O3
    text: RC-3's reason (2) offers synthetic routing in place of instrument data. J3-D1 shows the contract already
      contains a zero-compute quantitative prediction of a determined-column deficit on real instrument data (BIN-KOB-19's
      block {1, 3}); recast as a declared negative-expected control, it would be the physical control RC-3 asked
