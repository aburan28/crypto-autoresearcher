    no flagged deviation of any gated consequence reads POSITIVE (own sweep, written first), the threshold seam
    is closed, the null is separated, and under the contract''s own abstract model every admitted composition stays
    at or below 3.2 percent per-cell non-PASS. The break is in the model the gates are calibrated against: BIN-KOB-19''s
    coset block {1, 3} pairs two distinct cosets, so at m = 2 every relation between its ordinary columns is a difference
    L_i - L_j, the block''s signed relation graph is balanced, and its columns are not determined; cell_model, AR-COSET''s
    rationale and the C-4 calibration all assume free edge signs there (J3-D1). Review computations on synthetic
    rows and an abstract model only; nothing here is an observation of any curve, and no whole-contract verdict
    is given.'
