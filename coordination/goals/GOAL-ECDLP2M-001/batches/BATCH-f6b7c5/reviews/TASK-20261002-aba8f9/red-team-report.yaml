  survival_statement: 'J3 did not survive. Its routing half survived the strongest attack this reviewer found: no
    flagged deviation of any gated consequence reads POSITIVE, the seam is closed, the null is separated, PTM-D
    and PTM-E meet their signatures, and under the contract''s own model every admitted gate is at or below 3.2
    percent. It breaks on the per-cell false-fail and reachability of BIN-KOB-19 under the coset algebra the contract
    itself states (J3-D1). Remaining uncertainty, named: (a) the real BIN-KOB-19 defect-column census and the I4
    sign convention, which set the KOB false-fail anywhere from 11 to 100 percent in this reviewer''s model and
    were not computed (no curve may be built here); (b) the defect-column analysis uses two RECALLED binary-curve
    formulas (doubling; translation by the 2-torsion point), while the core balance argument uses only statements
    the contract makes; (c) the H2 figures rest on a crude random-mapping model; (d) one model family serves every
    role, so the agreement of this reviewer''s and the producer''s free-sign simulators is session-independent,
    not model-independent.'
  narrowest_supported_statement: 'In the committed version-4 decision table every deviation that a gated statistic
    flags at its own threshold routes out of POSITIVE (own sweep: 580 flagged configurations at five compositions,
    plus null, H2 and reported-only rows), the coverage-deficit seam is closed, and the no-reuse null is separated
    in every simulated arm; under the contract''s free-sign abstract model every admitted composition has per-cell
    non-PASS at or below 3.225 percent. The contract''s prediction for BIN-KOB-19 assumes free edge signs in the
    paired coset block {1, 3}, which the Z/4 coset structure it states rules out at m = 2: without defect columns
    that block is never determined, the cell is non-PASS with probability 1, and POSITIVE and H1-NEGATIVE-YIELD
    cannot be reached on the declared cells; with one to three defect columns the cell is non-PASS in 11 to 70 percent
    of runs in this reviewer''s model. Review computations on synthetic rows and an abstract model, not observations
    of any curve.'
