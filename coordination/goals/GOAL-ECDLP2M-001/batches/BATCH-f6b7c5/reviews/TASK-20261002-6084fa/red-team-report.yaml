      moves. The composer applies the key; the literal-reading risk is named, not rounded away.
    remedy: 'State the exact roots beside the rounded figures, or round down: 2.00 (range) and 2.52 to 2.62 (B_cap);
      1.66; 1.53; 1.54 to 1.59 at B_cap(m). Replace ''1.543'' with 1.540.'
