    item_ii_c_ranges:
      model: 'Written from the contract text, not from stage0_code: B_cap(m) = (m! 2^131)^(1/m); mu = B^m / (m!
        2^131); A = 1/(1 - e^-mu); retry_m = 1/(1 - m e^-m); T_shared = B A C + m B^2; per_target = A retry_m C;
        rho_1 = sqrt(pi r / 524) = 2^60.809037; N_prime = r/262. A window at constant c is non-empty iff c^2 > 4ab.
        The window at C = Cstar closes exactly at c(B; Cstar) = 2 sqrt(A retry Cstar (B A Cstar + m B^2)) / rho_1,
        so ''window non-empty implies C < Cstar'' holds iff c <= c(B; Cstar); c_max over a base range is the minimum
        over B. Readings: column value Cstar = T_gen(m); matched advice uncharged Cstar = sqrt(N_prime / B) (per-attempt
        C against the own-advice line); matched advice charged Cstar = sqrt(N_prime / B) / (A retry_m) (online kappa
        C against the own-advice line). mpmath 50 digits on the committed 697-point grid, with a continuum refinement.'
      second_route: Dry calls of committed stage0 model_ab, window and critical, with the c != 1 window obtained
        as window(log2 a - log2 c, log2 b - log2 c), plus bisection on c. Agreement with the own route to about
        1e-14 on every figure below (computations C5).
