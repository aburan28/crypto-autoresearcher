    severity: minor
    breaking: false
    kind: c-range precision
    statement: 'Five holds-below c-bounds are rounded to nearest or taken as 2^margin. Each overstates the exact
      root under the contract''s own model (LA k = 1, which gives the lowest bounds): ''about 2.01'' against 2.004641
      (m = 4 range, column value); ''about 2.63'' against 2.626512 (B_cap(4)); ''about 1.67'' against 1.667228;
      ''about 1.54'' against 1.536229; and ''1.60'' against 1.595768 at B_cap(16). H statement_note (ii) gives the
      last without ''about''. A D-12 and design_figures_v4_additions give ''1.543'' at B_cap(4), which is 2^margin,
      against the exact 1.540355. On each sliver one dry call shows a window open above the line (counterexample_or_mutation).'
    why_non_breaking: The breaking artifact 'a TW-01 or matched-advice clause stated for a range of c it does not
      hold on' would, read literally, catch these slivers (width 0.0002 to 0.0054 in c, under 0.004 bit). I do not
