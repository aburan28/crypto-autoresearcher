  objections:
  - id: J4-O1
    severity: moderate
    breaking: false
    kind: scope wording (C3); overturns plan prior condition (3)
    statement: 'The contract carries the proposal''s clause that an oracle below T_gen ''would be the first ECDLP
      algorithm below the S T^2 = N_prime line'' as TW-01''s text, and calls the matched-advice containment ''the
      first-below-the-line restatement''. It also pre-registers, in H interpretation_limits item 8 (H line 1024):
      ''A reviewer exhibiting a published ECDLP algorithm below the S T^2 = N line on any curve would withdraw the
      proposal''s first-algorithm clause from the proposal''s reading''. The contract''s own primary source meets
      that condition. SRC-CGK (retrieved by this task; sha256 equal to the contract''s) states in Section 1.3 (Related
      Work): ''In certain classes of elliptic-curve groups, there are non-generic algorithms for the discrete-log
      problem that outperform the generic algorithms [47]; some such algorithms run in sub-exponential time [67],
      or even in polynomial time [85]. In the standard elliptic-curve groups used for key exchange (e.g., NIST P-256)
      however, the generic preprocessing attacks discussed in this paper are still essentially the best known. Non-generic
      discrete-log algorithms also benefit from preprocessing.'' CGK''s reference list gives [47] Gaudry, Hess,
      Smart, J. Cryptology 15(1) 2002 (Weil descent), [67] Menezes, Okamoto, Vanstone, IEEE Trans. IT 39(5) 1993,
      and [85] Smart, J. Cryptology 12(3) 1999 (trace one); those papers were not opened by this task. For the decomposition
      mechanism this contract studies, the vendored Joux-Vitse text (inputs/JOUX-VITSE-2010-157/paper_fulltext.md,
      sha256 a2869c55... equal to its .sha256 file) states that Gaudry''s and Diem''s index calculus on E(F_{q^n})
      for fixed n runs in O~(q^(2-2/n)). These are published statements of the cited sources about curve classes
      other than ECC2K-130. This review asserts no algorithm, speedup or oracle cost on any curve.'
    consequence: '(a) By the contract''s own pre-registered rule, the UNSCOPED first-algorithm clause is withdrawn
      from the proposal''s reading. The contract does not assert it and never makes it an outcome; per its own text
      nothing in it changes, and the column stands. (b) The clause keeps its intended content only when scoped:
      ''on ECC2K-130'' (the N_prime of its line is that curve''s), or ''on curve classes where generic preprocessing
      attacks are the best known'' (SRC-CGK''s own phrasing). (c) ''First-below-the-line restatement'' names a containment
      of window antecedents in the TW-01 region. It is not a priority claim.'
    where: H header lines 27-34; H interpretation_limits items 2 and 8; E outcome_table.never_an_outcome, tw01_caution;
      A strictness_obligation, tripwire_preregistration, D-12; DEC-20260928-63addc C3 (TW-01's source text, which
      the contract cannot edit).
    why_non_breaking: 'Not on J4''s breaking list. The contract pre-registered exactly this event and its effect,
      and no rule, figure or outcome moves. It is the plan''s overturn condition (3): ''withdraws claim (C)''s first
      clause while the column stands''.'
    remedy: Zero compute. The composing decision records the withdrawal under H interpretation_limits item 8 and
      how the clause is scoped thereafter; any later restatement of the clause carries the scope.
