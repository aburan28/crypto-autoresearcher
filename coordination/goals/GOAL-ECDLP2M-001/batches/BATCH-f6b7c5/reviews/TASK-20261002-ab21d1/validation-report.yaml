  # ---------------------------------------------------------------------------
  defects:
    - id: D-J1-1
      joint: J1
      severity: minor
      breaking: false
      kind: wording and disclosure (a restatement more uniform than the model)
      where: >-
        "The upper edges move by at most 0.01 bit" in H statement (B), H
        asymptotic_claim.hidden_cofactor, E
        definitions.cap_locus_and_constants, A hidden_cofactor_la_constant and
        A r3_discharge_table R3-J1-1. Carried verbatim from version 3 (v3 E
        definitions, "the upper edges by at most 0.01").
      finding: >-
        True at every listed g and log2 C (largest |shift| 0.0099 bit, at
        envelope g = 30, k = 3). Not true uniformly. Near each k-shifted
        critical or closing value the k-window closes first and its upper
        edge falls below the k = 1 edge. On the m = 4 cap slice the fall
        exceeds 0.01 bit for log2 C above 41.814 (k = 2) or 41.398 (k = 3),
        up to 0.251 or 0.348 bit at closure. On the envelope it is 0.013 or
        0.026 bit at 0.5 bit below the k closing g, and 0.23 or 0.35 bit at
        0.001 bit below it (more at closure). On the sub-cap slice and m = 5 window it exceeds 0.01
        only within 1.3e-4 bit of closure (supremum 0.021 to 0.030 and 0.011
        to 0.015). Computed with own code, j1_upper_edge_sup.py.
      why_not_breaking: >-
        R3-J1-1's enumerated corrections (cap-slice lower edges up to 2.00
        and 3.17; critical and closing values at most 0.02) are restated
        correctly in all three named places. This clause is outside
        R3-J1-1's text. No compared figure, tolerance, critical or closing
        value or routing rule depends on it; the near-closure fall is a
        consequence of the stated 0.02 critical shift.
      remedy: >-
        Wording, zero compute. Scope the clause to "at the listed g and
        log2 C", or add "within about 0.3 to 0.7 bit of the critical log2 C
        on the cap slice and 0.5 bit of the closing g on the envelope the
        upper edge falls by up to 0.25 to 0.35 bit".
    - id: D-J1-2
      joint: J1
      severity: minor
      breaking: false
      kind: an uncharged per-attempt term not listed among the hidden cofactors (charge-everything rule of this tier)
      where: H statement preamble (C is "the per-attempt cost of an arity-m decomposition oracle"); E definitions.model_Mm; H asymptotic_claim.hidden_cofactor
      finding: >-
        At deployed parameters model M_m charges a relation or target attempt
        C plus nothing. The per-attempt input generation (a random
        combination per relation attempt; Q + c P0 per target attempt) is
        charged at toy scale as a separate group_ops column (A2, IR-12), but
        nowhere at n = 131 and not in the hidden-cofactor list. It is at
        least 1 group operation per attempt (incremental update) and at most
        262 = 2 bit_length(r) + 2 (the contract's own IR-12 bound; the toy
        pipeline's double-and-add). At the upper bracket the per-attempt cost
        rises by 0.1725 bit at C = 2^11.010251, 0.0029 at 2^17.01 and 4e-8 at
        2^33.08. At m = 4, g = 0 the upper edges move by -0.345 bit (sub-cap
        60.496 to 60.151; cap 98.055 to 97.710; envelope 99.378 to 99.033)
        and the lower edges by +0.14. The m = 4 L = 1 slice moves from
        -1.6e-7 to +0.0715 bit, a small loss rather than a tie (the
        conservative direction). Every m = 5 figure moves by less than 1e-7
        (computed). Critical and closing values sit at C of about 2^42 to 2^45,
        where s / C is below 1e-10, so they move by less than 1e-9 (bound by
        arithmetic, not computed). At the lower bracket every computed shift
        is 0.0014 bit or less. Own code, j1_input_generation.py.
      why_not_breaking: >-
        Every shift lies inside the Stage 0 window tolerances. The D3 pin
        (CORR-20260928-4cb669, a per-attempt ORACLE budget) omits the same
        term, so the model and its comparator stay consistent (a shared
        hidden cofactor, like k = 1). No figure the plan's J1 artifacts name
        is affected beyond tolerance.
      remedy: >-
        Disclosure, zero compute. List the input-generation cost with its
        bracket beside k in hidden_cofactor, or define C as the whole
        per-attempt cost including input generation.
    - id: D-J2-1
      joint: J2
      severity: minor
      breaking: false
      kind: accuracy of the audit sheet's self-description
      where: A code_binding.reference_sha256_binding ("The frozen reference that IR-6 and S1b compare against is the value TASK-20261002-c21ce2 records") and A completion_gate_self_check ("IR-6 and S1b name TASK-20261002-c21ce2's extracted_sha256")
      finding: >-
        E stopping rule S1b binds only the I3 to I5 files to the execution
        batch's snapshot receipt and names no design-snapshot digest, as in
        version 3. Only IR-6 names c21ce2's extracted_sha256. The binding of
        binstd_core.py and stage0.py is complete through IR-6 (run invalid,
        RUN-ARTIFACT), but no pre-Stage-2 stop checks those two digests by
        name. This structure is unchanged from version 3.
      why_not_breaking: >-
        The plan's artifact is "IR-6 or S1b still naming the version-3
        snapshot". Neither names it, and IR-6 names the new snapshot. The
        J2 joint text's phrasing "IR-6 and S1b name ..." matches the audit
        sheet's description, not E's S1b. Flagged so the composer can rule.
      remedy: Either make S1b also require binstd_core.py and stage0.py to equal TASK-20261002-c21ce2's extracted_sha256 before Stage 2, or correct the two audit-sheet sentences to say IR-6 only.

  observations:
    - id: O-J1-1
      text: >-
        design_figures.m4_cap_slice.closed_form_critical_log2_C 42.144, and
        stage0's closed forms generally, are the LA-free closed form
        T_gen + (log2 pi - 3 - log2 A(1) - log2 kappa_m)/2. The exact root of
        4ab = 1, a quadratic in C, is 42.138305, equal to the bisection;
        12.25596 against 12.255952 at m = 5. They are used only in
        within-0.05 self-checks. The label omits "LA-free". Information only.
    - id: O-J1-2
      text: >-
        Rounding chains, all inside tolerance. Comparator bytes at the m = 4
        sub-cap g = 0 upper end (2^68.59) and the cap slice at log2 C = 20,
        30, 35 (88.17, 68.17, 58.17) are computed from two-decimal L_hi; the
        unrounded values are 68.584, 88.163, 68.163, 58.162 (at most 0.0075
        bit). u_pred 0.634909 is the square of the rounded delta_inf
        (0.6349096 unrounded).
    - id: O-J1-3
      text: >-
        The frozen comparator inputs differ from the D3 definition by 1.4e-6
        (D3(4) 11.010251 against 11.010252423) and 1.16e-5 (D3(5) 33.075936
        against 33.075924449). This is disclosed in constants.comparator_inputs
        and passes the 1e-4 self-checks. The frozen inputs, not the
        recomputed ones, are the comparator.
    - id: O-J1-4
      text: >-
        The m = 4 envelope upper edge at g = 0 is flat to about 2e-11 bit for
        log2 B of 35.0 and above (strict argmax 35.126). "S at the maximising
        base (up to 2^40.08 bytes at log2 B = 35.996)" in E
        memory_beside_time therefore over-states the advice needed to reach
        that edge by up to 0.99 bit: 2^39.09 bytes at log2 B = 35.0 gives the
