      source_kn_lit_id: KN-LIT-87e00e
      quarantined_at: "2026-08-20"
      pre_registered_expected_answer_digest: 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002
