# Quarantine manifest for GOAL-MD5-001.
#
# Shape fixed by BCP-1 (firewall.quarantine.manifest_file): every quarantined
# file is listed with its relative path, sha256, source KN-LIT id, date
# quarantined, and pre_registered_expected_answer_digest. BCP-1 fixes this
# shape, not its content. This manifest is created by TASK-20260810-bde128
# (RANK 3 acquisition) and staged by its snapshot TASK-20260810-5c819b.
#
# pre_registered_expected_answer_digest is a DISTINCT field from the entry's
# file-level sha256: it is the sha256 of the CANONICAL SERIALIZATION of the
# payload, not of the file as stored (BCP-1, firewall.expected_answer_digest).
# A calibration run scores a rediscovered path by serializing it the same way
# and comparing digests; comparing never hands the search the answer.
#
# NO CALIBRATION RUN MAY BE DISPATCHED under BCP-1 while the corresponding
# entry's pre_registered_expected_answer_digest is absent (BCP-1 INV-7).

quarantine_manifest:
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  protocol: BCP-1
  created_by_task: TASK-20260810-bde128
  created_at: "2026-08-20"
  canonicalization: >-
    pre_registered_expected_answer_digest is the sha256 of the UTF-8 encoding
    of `yaml.safe_dump(payload["path"], sort_keys=True,
    default_flow_style=False)`, where `payload` is the quarantined file parsed
    as YAML. Only the clean, unambiguous `path` block (the differential
    characteristic, initial value, and digests) is serialized; the
    `literal_pairs_as_extracted` block is EXCLUDED because the source PDF's
    text layer drops hex digits from some message words (see that block's
    caveat), so it is not a reliable serialization target. The command used:
    `python3 -c "import yaml,hashlib,sys; d=yaml.safe_load(open(sys.argv[1]));
    print(hashlib.sha256(yaml.safe_dump(d['path'],sort_keys=True,
    default_flow_style=False).encode()).hexdigest())" <file>`.
  entries:
