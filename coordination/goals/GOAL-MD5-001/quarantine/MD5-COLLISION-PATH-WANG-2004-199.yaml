path:
  kind: md5_differential_collision_characteristic
  description: >-
    The MD5 collision differential characteristic published by Wang et al.
    (ePrint 2004/199, Section 1, "Collisions for MD5"). The message difference
    between the two colliding 512-bit message blocks is non-zero at message
    word positions 4, 11 and 14 only; all other message words are equal.
  message_difference:
    non_zero_positions: [4, 11, 14]
    values:
      pos_4: "2^31"
      pos_11: "2^15"
      pos_14: "2^31"
    all_other_positions: 0
  initial_value:
    A0: "0x67452301"
    B0: "0xefcdab89"
    C0: "0x98badcfe"
    D0: "0x10325476"
  digests:
    pair_1: "9603161f f41fc7ef 9f65ffbc a30f9dbf"
    pair_2: "8d5e7019 6324c015 715d6b58 61804e08"
literal_pairs_as_extracted:
  caveat: >-
    The literal colliding message pairs from Table 1 of the paper could NOT be
    reliably extracted: the source PDF's text layer drops hex digits from some
    32-bit message words (a font-encoding defect in the PDF itself, confirmed
    under both `pdftotext -layout` and `pdftotext -raw`), so several words are
    7 hex characters instead of 8. They are recorded AS-EXTRACTED below and are
    NOT to be treated as complete or verified. The `path` block above (the
    differential characteristic, initial value, and digests) is the clean,
    unambiguous part of the published path and is the part used for the
    canonical serialization. No missing digit has been guessed or filled in.
