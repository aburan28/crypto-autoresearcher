task_card:
  id: TASK-20260821-fad775
  title: >-
    RANK 2: Coordinator gate -- apply KN-TECH-080, approve / revise / reject,
    and freeze the bounded protocol. THIS TASK MAY STOP THE BATCH.
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  rank: 2
  role: coordinator
  policy: coordinator-orchestration-code
  reasoning_effort: null
  independent_session_required: false
  depends_on: [TASK-20260821-6b78d4]
  archived_by: TASK-20260821-e2ffe4
  handoff: ledger/handoffs/TASK-20260821-fad775.yaml
  review_required: false
  budget:
    wall_clock_seconds: 250
    memory_gb: 8
    maximum_runs: 1

  uncertainty_to_reduce: >-
    Whether the corrected proposal actually satisfies the proof-oriented
    dispatch gate BEFORE any implementation compute is spent -- and whether any
    MD5-side run in this batch is exactly the one named, scoped, identically
    bounded step the goal's next_action permits.

  job: >-
    You are a GATE, not an editor. Read TASK-20260821-6b78d4's proposal, apply
    the KN-TECH-080 dispatch gate and the roadmap-bias pairing rule, and decide
    approve / revise / reject. THIS IS THE FIRST OF THIS BATCH'S TWO INDEPENDENT
    STOP POINTS and it is the one that costs nothing to exercise. Batch 4 had
    only this gate, and a paper gate cannot catch a false algebraic assumption
    that nobody computed -- which is why the SECOND stop point (the executor's
    own two-way-dependence gate) exists and why you must encode it as a hard
    contract term rather than a recommendation.

  gate_checklist:
    - id: G-1
      what: KN-TECH-080 audit 1 -- exact bottleneck and baseline embedding.
      check: >-
        Is the named bottleneck DECISION-CHANGING, and is the baseline
        reproduced exactly as a parameter slice or a frozen regression fixture?
        A numerical resemblance is not an embedding. SPECIFICALLY: batch 4's
        audit-1 bottleneck claim (b) was false and unchecked (red-team D1). Does
        the new map state its equivalent assumption EXPLICITLY and name how it
        is discharged? An implicit assumption here is the exact defect that cost
        batch 4 -- do not wave it through twice.
    - id: G-2
      what: KN-TECH-080 audit 2 -- observation-collision / identifiability.
      check: >-
        Was a collision search actually ATTEMPTED within a stated scope, or is
        the absence of collisions merely asserted? If known collisions exist,
        does the proposal explain the additional condition that separates them?
    - id: G-3
      what: KN-TECH-080 audit 3 -- quantifier order.
      check: >-
        Is the claim written with explicit forall / exists order, including every
        dependency the witness is allowed (instance, seed, parameter)? Is it
        specific to THIS construction's declared scale rather than a generic
        restatement of the textbook method?
    - id: G-4
      what: KN-TECH-080 audit 4 -- method ceiling and nearby-object control.
      check: >-
        Is the strongest certifiable claim bounded under ideal tuning? Is the
        nearby-object prediction stated BEFORE any run
        (fixed_before_acquisition), not fitted after?
    - id: G-5
      what: THE MIRROR-IMAGE RISK.
      check: >-
        Did the proposal ADDRESS the recorded, unsettled mirror-image risk in
        the "read tuple position 0" repair (KN-TECH-bb7e9f, "Open, not
        settled") and derive the answer symbolically rather than assuming it
        away? A proposal that adopts option (b) alone without settling this is
        NOT approvable -- REVISE. A proposal that settles it either way, with an
        argument, satisfies this item whichever way it came out.
    - id: G-6
      what: THE MANDATORY TWO-DIRECTIONAL DEPENDENCE OBLIGATION.
      check: >-
        Is it stated as an implementable proof_obligation with a concrete
        pass/fail predicate, at k1=k2=4, on the SAME observable and code path
        the declared-scale run uses, in BOTH directions SEPARATELY, and does it
        say that failure is a STOP? If any of these is missing or soft, REVISE
        -- this is the batch's hard gate and a vague statement of it is worse
        than none, because it will read as compliance.
    - id: G-7
      what: THE VACUOUS-CONTROL PATTERN.
      check: >-
        If the proposal includes a brute-force-equality control (batch 4's
        proof_obligation #2), verify it is NOT VACUOUS -- i.e. that the naive
        baseline and the MITM search do not read the same potentially-degenerate
        quantity, which would guarantee agreement regardless of whether the
        construction works. Batch 4's k1=k2=6 control passed 64/64 and was
        vacuous for exactly this reason.
    - id: G-8
      what: THE ROADMAP-BIAS PAIRING RULE.
      check: >-
        A conditional result is dispatched only paired with a
        heuristic-validation experiment in the same or the following batch, and
        where feasible a proof-of-concept implementation. Both are in this batch
        (the HEUR-H1 validation run and the executor task itself). Confirm the
        proposal has not deferred either.
    - id: G-9
      what: MD5 SCOPE.
      check: >-
        Approve an MD5 arm ONLY if RANK 1 explicitly NAMED it and it is
        IDENTICALLY BOUNDED to the MD4 arm -- same scale, same k1/k2/m/k, same
        ceilings, differing only in the parameters the contract names as varying.
        NEVER LARGER. If RANK 1 declined to name one, authorize none, and say so
        explicitly in the frozen contract so the Executor performs ZERO MD5
        computation. ALSO: close DEFECT-1601d6-02 -- if the contract includes any
        MD5-mode correctness fixture (e.g. an H2 backward-inversion self-test),
        NAME IT EXPLICITLY in the md5_run_authorization text rather than leaving
        the authorization written entirely around the search arm.
    - id: G-10
      what: CLAIM CEILING.
      check: >-
        The frozen hypothesis and experiment must carry interpretation_limits
        capping the claim at `analyzed`, never `supported`, with the
        gate-by-gate basis (DEC-20260821-84a8f1 claim_ceiling). Do not license
        language that reads stronger than the bounded runs support.

  on_approve:
    - >-
      Freeze ledger/hypotheses/H-MDFIVE-0ca596.yaml -- the NEW hypothesis for the
      corrected construction. Full schema per templates/research-records.md --
      statement, mechanism, assumptions, proof_search_map (all four audits),
      heuristic_assumptions (H1 restated for the new construction, H2, H3),
      predictions, test_boundary (instances, exact parameters, seeds,
      implementation, budget), falsification_conditions, interpretation_limits,
      status. asymptotic_claim stays null -- this is a bounded
      mechanism-verification instrument, not a complexity claim.
    - Freeze experiments/EXP-MDFIVE-a8e71e/specification.yaml -- directory per
      experiment, `specification.yaml` inside it, matching every other
      EXP-MDFIVE-* record in this corpus. Declare the exact bounded scale, every
      seed, per-run ceilings, maximum_runs, controls, invalidation_rules,
      stopping_rules, success_criterion, falsification_criterion,
      required_artifacts, and the md5_run_authorization clause (or its explicit
      absence).
    - >-
      THE TWO-WAY-DEPENDENCE GATE GOES IN THE CONTRACT AS A HARD TERM -- a
      proof_obligation, a success_criterion, AND an invalidation_rule stating
      that any declared-scale run executed without a passing gate is INVALID.
      Not a recommendation, not a note.
    - Require `caveat_refs` in the manifest output of whichever instrument module
      the contract names (SC-5), from the start.
    - >-
      Mint your own gate decision id with
      `python3 tools/allocate_id.py --next decision --date 20260821 --check`.
      Write it to ledger/decisions/ as the ONLY new file you place there.

  on_revise_or_reject:
    - TASK-20260821-372d67 DOES NOT RUN. Mark it blocked in the queue.
    - >-
        Report the stop EXPLICITLY to the driving session and record it in the gate
        decision. Do NOT substitute a fix of your own: rewriting the proposal's
        design to force a pass is exactly what the gate exists to prevent, and a
        gap stays a gap.
    - A stop here is a legitimate, informative batch outcome. TASK-20260821-e2ffe4
      then freezes the smaller idea + gate-only package and the review pair
      reviews what exists.

  hard_rules:
    - Do not rewrite the proposal's proof_search_map to force a pass.
    - Do not scale the proposal upward. If the declared scale is the proposal's
      budget-safe floor, freeze it there; a larger-scale replication is an
      explicit open direction, not a gate edit.
    - Never license execution claiming full literature-scale complexity.
    - SC-1 through SC-10 as declared in batch.yaml. NEVER READ THE QUARANTINED
      PAYLOAD.
    - Record requested policy and resolved model; no Bedrock (SC-8).

  read_scope:
    - AGENTS.md
    - agents/coordinator.md
    - docs/inventor-protocol.md
    - knowledge/techniques/KN-TECH-080.md
    - knowledge/techniques/KN-TECH-bb7e9f.md
    - templates/research-records.md
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-fad775/task_card.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/batch.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-6b78d4/idea-record.yaml
    - ledger/proposals/IDEA-20260821-ea35d1.yaml
    - ledger/goals/GOAL-MD5-001.yaml
    - ledger/decisions/DEC-20260821-84a8f1.yaml
    - ledger/decisions/DEC-20260821-1215e5.yaml
    - ledger/evidence/EV-MDFIVE-ab007d.yaml
    - ledger/hypotheses/H-MDFIVE-bf7767.yaml
    - experiments/EXP-MDFIVE-88f7d1/specification.yaml
    - harness/run_md4_ceiling.py

  write_scope:
    - ledger/hypotheses/H-MDFIVE-0ca596.yaml
    - experiments/EXP-MDFIVE-a8e71e
    - ledger/decisions
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-fad775
  write_scope_exclusivity_note: >-
    ledger/decisions/ is declared as a directory only because this task's
    decision id is minted at execution time. EXACTLY ONE new DEC-*.yaml file may
    be created here by this task and NO existing file in that directory may be
    touched. TASK-20260821-6ce8a8 later creates exactly one other; the two tasks
    are strictly sequential, so there is no concurrent writer.

  artifact_paths:
    - ledger/hypotheses/H-MDFIVE-0ca596.yaml
    - experiments/EXP-MDFIVE-a8e71e/specification.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-fad775/gate-decision.yaml
    - "ledger/decisions/DEC-20260821-<minted>.yaml  # minted by this task via tools/allocate_id.py --next decision --date 20260821 --check"

  reserved_ids:
    H-MDFIVE-0ca596: PRE-ALLOCATED and `--check`ed. Use exactly this id.
    EXP-MDFIVE-a8e71e: PRE-ALLOCATED and `--check`ed. Use exactly this id.
    gate_decision: NOT pre-allocated -- mint it yourself as described above.

  completion_gate:
    - An explicit approve / revise / reject decision is recorded, with named
      rationale against EVERY item G-1 through G-10.
    - >-
        If approve: H-MDFIVE-0ca596 and EXP-MDFIVE-a8e71e exist, are schema-valid
        against templates/research-records.md, and state the exact bounded scale,
        every seed, and every ceiling.
    - >-
        If approve: the two-directional dependence gate appears in the contract as
        a proof_obligation AND a success_criterion AND an invalidation_rule.
    - >-
        If approve: the md5_run_authorization clause either names an identically
        bounded MD5 arm and any MD5-mode correctness fixture explicitly, or states
        that no MD5 computation is authorized.
    - >-
        If revise/reject: TASK-20260821-372d67 is explicitly marked blocked, not
        silently bypassed, and the stop is reported to the driving session.
    - The gate decision id was minted via tools/allocate_id.py --check, and is
      the only new file placed in ledger/decisions/ by this task.
