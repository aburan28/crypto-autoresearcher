task_card:
  id: TASK-20260821-6b78d4
  title: >-
    RANK 1: name ONE corrected split-point / matching-quantity construction and
    RE-RUN the four KN-TECH-080 audits against that NEW object
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  rank: 1
  role: idea-generator
  policy: research-deep
  reasoning_effort: null
  independent_session_required: false
  depends_on: [TASK-20260821-bc91f0]
  archived_by: TASK-20260821-e2ffe4
  handoff: ledger/handoffs/TASK-20260821-6b78d4.yaml
  review_required: true
  budget:
    wall_clock_seconds: 900
    memory_gb: 8
    maximum_runs: 1

  uncertainty_to_reduce: >-
    Whether a GENUINELY two-free-word splice-and-cut MITM construction exists in
    this Round-1 split-point family at all -- and if so, which one -- stated
    precisely enough that a Coordinator gate can approve or refuse it and an
    Executor can implement it without judgement calls.

  job: >-
    Batch 4 built a two-free-word instrument that was not one. ANOM-1 proved the
    declared matching quantity (register A immediately after step 9, read from
    backward_step's tuple position 1) is mathematically independent of free
    word9, because word9 is first consumed at step 10. Your job is the repair,
    and it is a DESIGN task, not a rescue: name ONE corrected construction, and
    subject it to the audits the previous one passed only in appearance.

  steps:
    - id: S-1
      what: READ THE OBSTRUCTION BEFORE PROPOSING ANYTHING.
      detail: >-
        knowledge/techniques/KN-TECH-bb7e9f.md is this program's own record of
        the exact defect you are repairing, including the algebra, the four
        independent reconfirmations, and the detecting control. Read it, and
        read knowledge/techniques/KN-TECH-9d21c4.md (null sufficiency), which is
        the general form of the failure: an observable whose value is forced
        independent of a declared input carries no information about that input,
        and no amount of replication repairs it. Read EV-MDFIVE-ab007d's
        `obstruction` block including its `resource_check`, which names the
        candidate repair -- and read KN-TECH-bb7e9f's "Open, not settled"
        section, which records why that candidate may not work.
    - id: S-2
      what: NAME EXACTLY ONE CORRECTED CONSTRUCTION.
      detail: >-
        One. Not a menu. The goal record names two families as examples, and you
        may propose either, a hybrid, or something else you can justify:
        (a) MOVE THE MATCHING POINT to a step where BOTH free words have
        genuinely been consumed by the word schedule -- e.g. by increasing the
        separation between the two free words so backward propagation through
        intervening fixed-word steps spreads the second word's influence into
        the register the first word updated;
        (b) READ backward_step's TUPLE POSITION 0, which the batch-4 red team's
        hand algebra shows genuinely depends on the supplied word, instead of
        the degenerate position 1;
        (c) MATCH ON BOTH COMPONENTS -- a window on position 0 AND a window on
        position 1 -- so each free word is filtered by the component it actually
        reaches.
        WARNING, AND YOU MUST ADDRESS IT EXPLICITLY IN YOUR OWN WORDS: option
        (b) has a recorded, UNSETTLED mirror-image risk. Reading the module's
        algebra, `forward_step` returns `(d, new_a, b, c)` so only tuple
        position 1 of the after-step-9 state depends on word8, and
        `backward_step` returns `(old_a, old_b, old_c, old_d)` with only
        position 0 depending on the supplied word -- which, if right, means the
        two free words influence DISJOINT components and option (b) relocates
        the degeneracy onto word8 rather than curing it. This is a Coordinator
        reading, not an established fact (KN-TECH-bb7e9f, "Open, not settled").
        DO NOT ADOPT IT AS TRUE AND DO NOT DISMISS IT. Derive the answer
        yourself, symbolically, from the RFC step table, and state which way it
        came out. If it holds, option (b) alone is not admissible.
    - id: S-3
      what: RE-RUN ALL FOUR KN-TECH-080 AUDITS AGAINST THE NEW OBJECT.
      detail: >-
        RE-RUN, not re-file. Carrying IDEA-20260821-e46061's audit text forward
        is the single most likely way to repeat batch 4, and joint R2 of the
        review plan is built to detect exactly that.
        AUDIT 1 (exact bottleneck and baseline embedding): name the step whose
        removal changes the result, and reproduce the baseline as a symbolic
        check or a frozen regression fixture. Batch 4's bottleneck claim (b) --
        "lands the matching point on a register that was just updated, so the
        comparison is meaningful" -- was FALSE and unchecked. State your
        equivalent claim EXPLICITLY as an assumption and name how it is
        discharged.
        AUDIT 2 (observation-collision test): name the observable and SEARCH for
        two distinct ground-truth objects sharing it, one satisfying and one
        violating the target conclusion. Do not assert none exist.
        AUDIT 3 (quantifier-order audit): write the claim with explicit forall /
        exists order, including every dependency the witness is allowed.
        AUDIT 4 (method ceiling and nearby-object control): bound the strongest
        result this construction could certify under ideal tuning, and state the
        nearby-object (MD5 Round 1) prediction BEFORE any run.
        An audit that genuinely does not apply records WHY; it is not silently
        omitted.
    - id: S-4
      what: STATE THE MANDATORY TWO-DIRECTIONAL DEPENDENCE OBLIGATION.
      detail: >-
        Write it as a `proof_obligations` entry in the form the Executor will be
        GATED on, precise enough to implement without interpretation: at
        k1 = k2 = 4, on the SAME declared matching observable through the SAME
        code path the declared-scale run uses, (i) hold free word B fixed and
        sweep free word A across its window -- the observable MUST take more
        than one value; (ii) hold free word A fixed and sweep free word B -- the
        observable MUST take more than one value; (iii) a SIMULTANEOUS both-word
        sweep DOES NOT DISCHARGE THIS and must not be substituted, because it
        passes on a construction degenerate in one word. Specify the pass/fail
        predicate, what counts as evidence of each direction, and state plainly
        that FAILURE IS A STOP: no declared-scale run happens. Red-team
        recommendation D1, BATCH-af29f6.
    - id: S-5
      what: NUMBERED HEURISTICS, EACH WITH A VALIDATION ROUTE EXECUTABLE THIS BATCH.
      detail: >-
        HEUR-H1 is OPEN, not falsified (DEC-20260821-1215e5 F-3): its batch-4
        test was invalidated by ANOM-1 and this batch is its FIRST GENUINE TEST.
        Restate it for the new construction with a falsification_condition that
        is precise, pre-committed, and applicable -- and note that once it is
        frozen it may not be reinterpreted after outcomes are seen (SC-9). If
        the new construction needs a different statement, that is a NEW numbered
        heuristic, declared now. Carry HEUR-H2 (exact step invertibility -- a
        proved algebraic fact, already confirmed) and HEUR-H3 (the second-order
        k1/k2 extrapolation, honestly left untested) forward with their status
        stated honestly.
    - id: S-6
      what: HONEST ACCOUNTING AND PARETO HONESTY.
      detail: >-
        Fill `dominated_by` (settable to null only after checking every row of
        the frontier across time, memory, and data/queries -- an unchecked null
        is a fabrication) and a quantitative `sota_delta`. Fill
        `novelty_status`; an idea whose only literature is `recalled` is
        `unverified`, which is the honest default and not a defect. Attempt
        `search_knowledge` before any novelty or prior-non-testing claim and
        record the query and its outcome; ABSENCE OF A HIT LICENSES NO
        INFERENCE.
    - id: S-7
      what: COST FIGURES -- MODELED ONLY, AND BOUNDED.
      detail: >-
        Any cost figure you state is MODELED and labeled so. You may state the
        expected chunk-evaluation cost of the new construction at the declared
        bounded scale against its naive all-pairs baseline over the SAME
        restricted space. YOU MAY NOT PROJECT TOWARD THE ~2^64-BLOCK
        INSTRUMENT-CLASS GAP (SC-3, DEC-20260821-1215e5 F-8) -- not from batch
        4's degenerate throughput, not from BATCH-1f30fe's block anchor, not at
        all this batch. If you cite any BATCH-af29f6 raw metric (2048, 1048576,
        512x, R = 1.0) you MUST carry the ANOM-1 caveat with it (SC-4).

  hard_rules:
    - MD4 FIRST. MD4 is the control. You may NAME a concrete MD5-specific step
      as a nearby-object control at identical bounded scale -- or explicitly
      DECLINE to. Either is acceptable; silence is not. Whichever you choose,
      say so in one sentence the gate can act on.
    - Never propose executing at full literature-scale complexity. Every
      literature figure (2^96 / 2^102 / 2^116.9 / 2^123.4) stays marked
      UNVERIFIED; provenance is not upgraded by assertion.
    - You do not assign work to the Executor and you do not approve anything.
      You propose; TASK-20260821-fad775 gates.
    - Every citation carries provenance (recalled | retrieved | kb | internal).
      A `recalled` reference supports nothing and may not discharge a
      heuristic's supporting_results.
    - Premature closure is a failure mode symmetric with overclaiming. "This
      split-point family is exhausted" is a hypothesis about your search, and if
      you reach it you owe a named obstruction, an argument, and forward
      guidance -- not a count of rejected variants, which is a fatigue report.
    - >-
      Reuse the committed RFC pins; do not re-fetch. RFC 1320 at
      coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt
      (sha256 f727b15e...2421c7); RFC 1321 at
      coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
      (sha256 284a79d1...3149dd).
    - SC-1 through SC-10 as declared in batch.yaml. NEVER READ THE QUARANTINED
      PAYLOAD; attest non-reading.

