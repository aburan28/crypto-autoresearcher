  reserved_ids:
    IDEA-20260821-ea35d1: >-
      PRE-ALLOCATED AND ALREADY `--check`ed. Use exactly this id for your
      proposal; do NOT mint another. If you need any additional record id beyond
      it, mint it yourself with
      `python3 tools/allocate_id.py --next <type> [--area X | --date YYYYMMDD]`
      and confirm with `--check` before use -- never by grepping for a maximum.
    canonical_directory: >-
      ledger/proposals/, not ledger/ideas/. Batch 4's idea-generator wrote to
      the wrong directory and the driving session had to move it; the schema
      fields status / dominated_by / sota_delta belong nested under `idea:`, not
      under a sibling top-level key.

  completion_gate:
    - ONE corrected construction is named, not a menu, and is specified precisely
      enough to implement without judgement calls.
    - The mirror-image risk in the position-0 option is addressed EXPLICITLY,
      with the answer derived symbolically from the RFC step table and stated
      either way.
    - All four KN-TECH-080 audits are RE-RUN against the NEW object; any audit
      whose text is substantively unchanged from IDEA-20260821-e46061 is flagged
      and justified, and no audit is silently omitted.
    - The mandatory k1=k2=4 TWO-DIRECTIONAL dependence obligation is stated as a
      proof_obligation with an implementable pass/fail predicate, and states that
      failure is a STOP.
    - Every heuristic carries a validation route executable within this batch's
      budget, or is explicitly and honestly marked untested.
    - >-
        The MD5-specific-step decision is explicit: named and justified, or
        explicitly declined.
    - dominated_by and sota_delta are filled; a null dominated_by is accompanied
      by the frontier check that licenses it.
    - Knowledge retrieval was attempted before any novelty claim and its query
      and outcome are recorded.
    - No cost figure projects toward the ~2^64-block gap; every BATCH-af29f6 raw
      metric cited carries the ANOM-1 caveat.
