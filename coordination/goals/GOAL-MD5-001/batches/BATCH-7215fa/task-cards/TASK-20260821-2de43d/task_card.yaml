  review_required: false
  budget:
    wall_clock_seconds: 450
    memory_gb: 8
    maximum_runs: 1

  uncertainty_to_reduce: >-
    Whether the corrected construction is genuinely two-free-word or has merely
    relocated ANOM-1; whether the four audits were re-run or re-filed; and
    whether the package's labels, costs, and claim tier are honest.

  job: >-
    Work the PRE-COMMITTED plan at
    review-plan/review-plan-2de43d.yaml. It is committed before you run and it
    names your joints, your worked attacks, and where the Coordinator thinks
    each breaks. You own R1-R5, the four proves-too-much objects, and the blind
    re-derivation. You do NOT own V1-V5 and you must not review them -- they
    belong to a sibling reviewer you cannot read. This task also serves as
    CLAUDE.md promotion-gate 4's red-team pass on the cost model and heuristics.

  joints_owned:
    - R1 construction adequacy (does the corrected observable depend on BOTH free words, or has ANOM-1 merely moved?)
    - R2 proof_search_map re-run honesty against the NEW object
    - R3 HEUR-H1 label licensing and criterion stability
    - R4 cost-model honesty, ANOM-1 caveat carry-forward, and the ~2^64 projection prohibition
    - R5 claim-tier ceiling and scope

  blind_rederivation:
    quantity: >-
      THE TWO-WAY DEPENDENCE PREDICATE -- given the frozen contract's declared
      matching-quantity specification, split point, free-word indices,
      fixed-word procedure and seed, does the observable vary with each free
      word separately? Derive it from the FROZEN CONTRACT AND THE RFC STEP TABLE
      ALONE, with YOUR OWN minimal implementation.
    why_this_quantity: >-
      It is the batch's own hard gate. Recomputing the gate from the producer's
      implementation reproduces a wrong-but-self-consistent gate faithfully --
      exactly the failure that produced ANOM-1, where every mechanical control
      passed and every one of them read the same degenerate quantity.
    ordering_requirement: >-
      COMPLETE AND WRITE DOWN the blind re-derivation BEFORE reading any
      non-excluded section of the execution report or the idea record. Say so in
      your attestation. This ordering is part of the requirement.
    blind_from: See review-plan-2de43d.yaml `blind_rederivation.blind_from` -- the whole instrument module, the gate-outcome and narrative sections of the execution report, the gate run's raw artifacts, the idea record's narrative rationale, both producer task cards, both producer handoffs, and the sibling validator's report.

  hard_rules:
    - THE PLAN IS PRE-COMMITTED. Departures go in `procedure_deviations`, never
      drift. Reassigning a joint, dropping a control, or acting before a report
      returns may be right in the moment; none is self-documenting.
    - >-
      SIBLING BLINDNESS -- do not read TASK-20260821-26ba34's report. Attest
      `read_sibling_reports: false`.
    - >-
      BLIND FROM -- respect every path and section in the plan's `blind_from`.
      Attest `blind_from_respected` with a note if false.
    - WORK FROM THE COMMITTED TREE at the TASK-20260821-e2ffe4 snapshot commit.
      RE-DERIVE AND RE-RUN; do not read and agree.
    - REPORT ON YOUR OWN JOINTS. Do not issue a whole-claim verdict -- you
      cannot see V1-V5 by construction, so a whole-claim verdict from you is an
      opinion formed from half the evidence. The Coordinator composes.
    - >-
        A BATCH-HALTING finding is reported and stops there. Do not compensate,
        repair, or soften it. Under this plan the batch-halting set is: a
        declared-scale run without a passing gate, a non-reproducible certificate,
        or an out-of-contract MD5 run -- the first is yours to notice if you see
        it, the other two are the validator's, and noticing one outside your
        joints is reported, not adjudicated.
    - THE COORDINATOR'S PRIOR P-R1 IS SPECIFIC AND FALSIFIABLE. Refuting it is
      one of the most valuable results available to this batch. Agreeing with it
      WITHOUT TESTING IT is not a result at all. Fill
      `coordinator_prior_comparison` per joint and report a divergence in
      MECHANISM even when the verdict TIER matches -- batch 4's red team did
      exactly this and it was the most informative part of the round.
    - NEVER READ THE QUARANTINED PAYLOAD (SC-6); attest non-reading.
    - Halt truthfully at the 450 s ceiling (SC-7). No Bedrock (SC-8). Record
      requested policy (review-adversarial), reasoning effort (xhigh), and the
      RESOLVED model identifier.

