task_card:
  id: TASK-20260821-e2ffe4
  title: "RANK 4: isolated content_first SNAPSHOT archive of the producer package"
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  rank: 4
  role: coordinator
  policy: coordinator-orchestration-code
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260821-bc91f0
    - TASK-20260821-6b78d4
    - TASK-20260821-fad775
    - TASK-20260821-372d67
  depends_on_note: >-
    Depends on TASK-20260821-372d67 only if TASK-20260821-fad775 APPROVED. If
    the gate revised/rejected, this task freezes the SMALLER idea + gate-only
    package and records that explicitly; the review pair then reviews what
    exists and returns `not_applicable` with a reason on joints whose subject
    did not occur.
  archived_by: TASK-20260821-6ce8a8
  handoff: ledger/handoffs/TASK-20260821-e2ffe4.yaml
  review_required: false
  budget:
    wall_clock_seconds: 160
    memory_gb: 8
    maximum_runs: 1

  uncertainty_to_reduce: >-
    None. This is the mechanical freeze of the exact bytes the two independent
    reviews will run against. Its value is entirely in being isolated and exact.

  job: >-
    RUN ALONE. Stage ONLY the declared producer artifact paths, make one
    isolated snapshot commit, and record a content_first archive receipt with
    the pre-freeze checks below. This is the ONLY archival task for the producer
    artifacts; do not fold in anything else and do not let a concurrent worker
    write during the freeze.

  archive_mechanics:
    kind: snapshot
    binding_mode: content_first
    binding_note: >-
      The receipt binds to CONTENT first: `path_sha256` over every declared path
      is the authoritative binding, and commit reachability is advisory
      (CLAUDE.md, "Archive receipts bind to CONTENT first"). A content mismatch
      is fatal. Do NOT put this commit's own sha into an artifact inside that
      same commit; the dispatcher binds the receipt to Git after the commit.
    record_ids_to_name_in_the_commit_message:
      - GOAL-MD5-001
      - RQ-MDFIVE-6870c1
      - BATCH-7215fa
      - DEC-20260821-84a8f1
      - IDEA-20260821-ea35d1
      - H-MDFIVE-0ca596
      - EXP-MDFIVE-a8e71e
      - "the gate DEC-* minted by TASK-20260821-fad775"
      - TASK-20260821-bc91f0
      - TASK-20260821-6b78d4
      - TASK-20260821-fad775
      - TASK-20260821-372d67
      - TASK-20260821-e2ffe4

  pre_freeze_checks:
    - id: PF-1
      check: >-
        THE GATE RAN FIRST. Independently confirm from the run directories'
        manifests and timings -- not from the execution report's prose -- that
        the two-directional dependence gate run PRECEDES every declared-scale
        run. If it does not, DO NOT FREEZE: report an SC-2 breach to the driving
        session, because every declared-scale observation is void under the
        frozen contract's own invalidation_rule.
    - id: PF-2
      check: >-
        Full test suite runs; record the EXACT pass/fail/skip counts against
        BATCH-af29f6's 37/1/1 baseline. Do not characterise a difference --
        record the numbers and let the validator adjudicate.
    - id: PF-3
      check: >-
        No hashlib in the solver core. Confirm from the source.
    - id: PF-4
      check: >-
        Instrument sha256 identity: record the sha256 of the written module and
        confirm exactly ONE of harness/run_md4_ceiling.py and
        harness/run_md4_ceiling_v2.py was written, matching the frozen contract.
        Confirm harness/run_md5_calib.py is unchanged.
    - id: PF-5
      check: >-
        `caveat_refs` is present in the written module's MANIFEST OUTPUT (SC-5).
        Check a produced manifest, not the source comment.
    - id: PF-6
      check: >-
        MD5-SCOPE CROSS-CHECK against the frozen EXP-MDFIVE-a8e71e contract: if
        an MD5 run exists, the contract names and identically bounds it; if the
        contract names none, ZERO MD5 computation occurred. A mismatch is
        reported, not frozen over.
    - id: PF-7
      check: >-
        Quarantined payload sha256 UNCHANGED and the quarantine directory
        untouched (SC-6). Record the sha.
    - id: PF-8
      check: >-
        Every run directory carries the full AGENTS.md Artifact Policy set, no
        run halted on its declared ceiling without saying so, and any superseded
        run is preserved and marked invalid.
    - id: PF-9
      check: >-
        Cost figures are labeled measured-vs-modeled, and NO document in the
        package projects toward the ~2^64-block gap (SC-3).
    - id: PF-10
      check: >-
        RFC pins reconfirmed by sha256: rfc1320-md4.txt f727b15e...2421c7 and
        rfc1321-md5.txt 284a79d1...3149dd. Neither was re-fetched.

  hard_rules:
    - RUNS ALONE. No concurrency during the freeze; a byte that changes mid-freeze
      makes the binding a fiction.
    - Stage ONLY the declared paths. A scope-expanding commit blocks downstream
      review; it is an evidence-integrity failure, not a research result.
    - Before the commit, fetch origin/main and MERGE it into the working branch
      (MERGE, NEVER REBASE -- rebasing rewrites the commits run records were
      archived in). Record the base commit checked and the merge outcome in the
      receipt. A sync conflict inside an immutable record is resolved by a new
      superseding record under a new id, NEVER by editing a side.
    - After the commit, push the branch and open or refresh a PR against main
      naming the record ids above. A record that exists only in a local commit is
      unpublished, not durable evidence.
    - Do not interpret, summarise-as-conclusion, or repair anything. If a
      pre-freeze check fails, report it; do not fix it.
    - SC-1 through SC-10 as declared in batch.yaml.

  read_scope:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/batch.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/dispatch_queue.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-e2ffe4/task_card.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-6b78d4/idea-record.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-fad775/gate-decision.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/execution-report.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/runs/
    - ledger/proposals/IDEA-20260821-ea35d1.yaml
    - ledger/hypotheses/H-MDFIVE-0ca596.yaml
    - experiments/EXP-MDFIVE-a8e71e/specification.yaml
    - ledger/decisions/
    - harness/run_md4_ceiling.py
    - harness/run_md4_ceiling_v2.py
    - harness/run_md5_calib.py
    - tests/test_harness.py
    - coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml

  write_scope:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-e2ffe4

  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-e2ffe4/snapshot-receipt.json

  completion_gate:
    - All ten pre-freeze checks are RECORDED in the receipt with their outcomes,
      including PF-1's independent ordering verification.
    - The content_first binding covers every declared producer path by sha256;
      anything staged but not bound is disclosed in
      `staged_not_in_binding_set`.
    - The commit changes exactly the declared paths and its message names the
      record ids.
    - The origin/main base commit checked and the merge outcome are recorded.
    - The branch is pushed and a PR against main is open or refreshed, naming the
      new records.
    - The dispatcher's post-commit verifier accepts the receipt before either
      reviewer is dispatched.
