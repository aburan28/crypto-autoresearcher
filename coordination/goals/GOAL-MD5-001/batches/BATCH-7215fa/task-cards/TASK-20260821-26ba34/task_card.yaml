      the suite and report exact counts. The SAME failure for the SAME reason is
      the accepted carry-forward. A DIFFERENT test, or the same test failing for
      a different reason, is NEW and in scope.
    DEFECT-1601d6-02: >-
      BATCH-af29f6's MD5 H2 correctness fixture was defensible but not literally
      named in md5_run_authorization's text (F-7 ruled the reading correct and
