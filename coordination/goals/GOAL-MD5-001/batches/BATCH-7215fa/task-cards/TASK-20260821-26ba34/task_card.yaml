  uncertainty_to_reduce: >-
    Whether the observed BYTES -- instrument, run records, manifests, reports --
    actually satisfy what the package claims, as a mechanical fact established
    by your own command output.

  job: >-
    Work the PRE-COMMITTED plan at
    review-plan/review-plan-2de43d.yaml. You own V1-V5 and only V1-V5. R1-R5,
    the proves-too-much objects, and the blind re-derivation belong to a sibling
    reviewer you cannot read.
    YOUR ROLE IS DELIBERATELY COMPLEMENTARY TO THE RED TEAM'S ON THE SAME
    CENTRAL QUESTION: you REPLICATE the two-way-dependence gate from the
    producer's own artifacts (you may read the instrument module and the run
    records); the red team RE-DERIVES the same predicate blind. Agreement
    between a replication and a blind re-derivation is evidence about the
    quantity; disagreement localises to one of two named implementations. That
    is why both exist, and it is destroyed if either of you reads the other.

  joints_owned:
    - V1 gate execution integrity (did the mandatory k1=k2=4 gate run FIRST, in BOTH directions separately, on the SAME observable and code path?)
    - V2 certificate re-derivation
    - V3 HEUR-H1 statistics and the variance signature
    - V4 MD5-arm scope compliance
    - V5 run-artifact, seed, suite and firewall integrity

  validity_checks_you_must_establish_before_anything_else:
    - EXPECTED RUN COUNT -- exactly the runs the frozen contract declares, no
      more; any superseded run preserved and marked invalid, never deleted.
    - SCHEMA-COMPLETE MANIFESTS -- every field of AGENTS.md's Artifact Policy
      present in every run directory.
    - SEED INTEGRITY -- regenerate the fixed words and every declared target
      from the frozen contract's stated seeds and procedures with YOUR OWN code
      and confirm byte-identity with what the runs used.
    - RAW/SUMMARY AGREEMENT -- recompute the execution report's headline numbers
      from raw-result.json yourself; a discrepancy is a defect regardless of
      which side is right.
    - CONTROL COMPARABILITY -- if an MD5 arm exists, it is parameter-identical
      to the MD4 arm in every field the contract does not name as varying.
  validity_checks_consequence: >-
    NOT A SIXTH CHECK -- THE CONSEQUENCE OF THE FIVE. An invalid or incomplete
    run set is NOT evidence; report it as such and stop treating the package as
    interpretable. The Coordinator returns it to the Executor with the concrete
    defects you listed; it is not something you or the closing task work around.
    (This field was a trailing sentence under the list above until the driving
    session's YAML repair promoted it to a list item, which read as a sixth
    check. Restored to its intended scope by the Coordinator at
    TASK-20260821-bc91f0; no wording changed.)

  hard_rules:
    - RE-RUN, DO NOT READ. Every verdict rests on your own command output.
      Batch 4's validator built independent from-scratch simulators, which is
      what made its ANOM-1 confirmation definitional rather than merely
      empirical. Do that again.
    - READ THE COMMITTED TREE at the TASK-20260821-e2ffe4 snapshot commit.
    - >-
      SIBLING BLINDNESS -- do not read TASK-20260821-2de43d's report. Attest
      `read_sibling_reports: false`.
    - REPORT ON YOUR OWN JOINTS. No whole-claim verdict -- you cannot see R1-R5
      by construction. The Coordinator composes.
    - >-
        BATCH-HALTING findings are reported and stop there, not softened: a
        declared-scale run executed BEFORE or WITHOUT a passing gate (V1, an SC-2
        breach that voids every declared-scale observation), a claimed certificate
        your independent recomputation cannot reproduce (V2), or an MD5 run absent
        from the frozen contract or wider than the MD4 arm (V4).
    - DEFECTS CONCRETE AND ACTIONABLE, none softened into a caveat. A
      pre-existing, out-of-scope failure is disclosed as such with its evidence,
      not characterised away -- and if the evidence is strong but not
      exhaustively bisected, SAY SO, as DEFECT-1601d6-01 did.
    - NEVER READ THE QUARANTINED PAYLOAD (SC-6). Re-confirm its sha256 from
      MANIFEST.yaml and attest non-reading.
    - Halt truthfully at the 450 s ceiling (SC-7). No Bedrock (SC-8). Record
      requested policy (review-adversarial), reasoning effort (xhigh), and the
      RESOLVED model identifier.

  known_carry_forward:
    DEFECT-1601d6-01: >-
      BATCH-af29f6 recorded a suite status regression from BATCH-1f30fe's 35/35
      to 37/1/1, strongly (but not exhaustively bisected) attributed to a
