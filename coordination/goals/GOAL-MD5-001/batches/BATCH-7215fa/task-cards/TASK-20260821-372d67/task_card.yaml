task_card:
  id: TASK-20260821-372d67
  title: >-
    RANK 3: corrected instrument -- MANDATORY k1=k2=4 two-directional dependence
    gate FIRST, then (only on PASS) MD4 certificate, genuine HEUR-H1 validation,
    and the conditional MD5 arm
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  rank: 3
  role: executor
  policy: executor-implementation
  reasoning_effort: null
  independent_session_required: false
  depends_on: [TASK-20260821-fad775]
  gate_condition: "TASK-20260821-fad775.decision == approve"
  archived_by: TASK-20260821-e2ffe4
  handoff: ledger/handoffs/TASK-20260821-372d67.yaml
  review_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 8
    maximum_runs: 5
    sub_budget:
      implementation_ceiling_seconds: 900
      two_way_gate_run_ceiling_seconds: 120
      md4_primary_run_ceiling_seconds: 300
      h1_validation_run_ceiling_seconds: 300
      conditional_md5_run_ceiling_seconds: 300
    unspent_budget_rule: >-
      If the gate FAILS, or if no MD5 arm is authorized, the corresponding
      ceilings are UNSPENT and are reported as unspent. They are NEVER silently
      reallocated to another run.

  uncertainty_to_reduce: >-
    First and above all: does the corrected construction's declared matching
    observable actually vary with EACH free word separately? Only if it does:
    what does the corrected, genuinely two-free-word instrument measure against
    MD4 at the declared bounded scale, what does HEUR-H1's first real test show,
    and what does the identically-bounded MD5 nearby object show if authorized?

  job: >-
    Implement and run EXACTLY the frozen EXP-MDFIVE-a8e71e contract from
    TASK-20260821-fad775 -- no more, no less. THE ORDER OF THE STEPS BELOW IS
    PART OF THE CONTRACT, NOT A SUGGESTION.

  steps:
    - id: S-1
      what: THE INSTRUMENT.
      detail: >-
        Implement the corrected construction the frozen contract declares. The
        solver core imports NO hashlib. MD4 comes from RFC 1320 and MD5 (if
        authorized) from RFC 1321, using the COMMITTED PINS -- do not re-fetch:
        coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt
        (sha256 f727b15e...2421c7) and
        coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
        (sha256 284a79d1...3149dd).
        Write EXACTLY ONE of: a modification of harness/run_md4_ceiling.py, or a
        new sibling module at harness/run_md4_ceiling_v2.py -- whichever the
        frozen contract names. Do not touch the other.
        harness/run_md5_calib.py stays FROZEN as BATCH-1f30fe's instrument of
        record and is NOT modified. Add tests to tests/test_harness.py
        additively.
        SC-5 IS BINDING: whichever module you write, its MANIFEST OUTPUT carries
        a `caveat_refs` field from the start (pointing at KN-TECH-bb7e9f and
        DEC-20260821-1215e5 F-4). Prose disclosure elsewhere does not discharge
        this; joint R4 of the review plan checks the manifest itself.
        Cost instrumentation via `run_wrapped` (wrapper-measured wall_seconds);
        deterministic; every seed from the frozen contract.
    - id: S-2
      what: >-
        THE MANDATORY TWO-DIRECTIONAL DEPENDENCE GATE. THIS RUNS FIRST, BEFORE
        ANY DECLARED-SCALE RUN, AND IT IS A HARD STOP.
      detail: >-
        At k1 = k2 = 4 (256 pairs; this costs effectively nothing), on the SAME
        declared matching observable, read through the SAME code path the
        declared-scale run uses:
        (i) HOLD FREE WORD B FIXED and sweep free word A across its window. The
            observable MUST take more than one value.
        (ii) HOLD FREE WORD A FIXED and sweep free word B across its window. The
            observable MUST take more than one value.
        (iii) A SIMULTANEOUS BOTH-WORD SWEEP DOES NOT DISCHARGE THIS and must
            not be substituted or reported as if it did. It passes on a
            construction degenerate in one word -- that is exactly how ANOM-1
            survived a full batch of passing controls.
        Run it as a WRAPPED RUN with its own run directory, manifest, raw
        result, and wrapper-measured timing, so its ORDER relative to every
        other run is a machine-checkable fact and not a claim in prose. Joint V1
        of the review plan verifies that ordering from your artifacts.
        Report BOTH directions' distinct-value counts, not just a verdict.
        ON FAIL, IN EITHER DIRECTION: STOP. Do not run anything at declared
        scale. Do not patch the contract -- a defect found in a frozen
        hypothesis is RECORDED, never repaired mid-task (agents/executor.md).
        Write the execution report with the gate result, the algebraic reason if
        you can state one, the unspent budget, and stop. THIS IS A COMPLETE,
        ADMISSIBLE, AND VALUABLE OUTCOME -- a second, sharper measurement of the
        same obstruction. It is not a failure of this task.
    - id: S-3
      what: THE MD4 PRIMARY CERTIFICATE RUN. Only on a PASSING gate.
      detail: >-
        Execute against MD4 at the frozen contract's declared bounded scale,
        seed, and 300 s ceiling, via `run_wrapped`. Report the certificate (the
        found witness plus the matched target, re-verified through a code path
        INDEPENDENT of the search) or the complete ceiling report (search space
        explored, strongest partial match, counters). Either is a complete,
        admissible observation; a halted run's cost is the ceiling (SC-7).
        Keep the independent re-verification path genuinely independent --
        batch 4's `_reference_round1_forward` is the precedent, and joint V2
        checks the source, not the docstring.
    - id: S-4
      what: THE GENUINE HEUR-H1 VALIDATION RUN. Only on a PASSING gate.
      detail: >-
        This is HEUR-H1's FIRST REAL TEST at this scale -- batch 4's was
        INVALIDATED by ANOM-1, not falsified, and H1 remains OPEN
        (DEC-20260821-1215e5 F-3). Run the same bounded search over the frozen
        contract's declared number of independently drawn targets, at the
        identical declared scale, 300 s ceiling. A halt before the declared N
        truthfully reports the achieved N and is a budget outcome, not a defect.
        REPORT COMPARISON STATISTICS ONLY. Do NOT conclude that the heuristic is
        "validated" or "refuted" -- that composition is the Coordinator's, later
        (agents/executor.md). Report the collision counts per target, the
        predicted distribution, the goodness-of-fit statistic, the tail check,
        the achieved N -- AND THE VARIANCE across target draws, explicitly. Zero
        variance was ANOM-1's empirical signature; whatever this run's variance
        is, state it as a number.
    - id: S-5
      what: THE CONDITIONAL MD5 NEARBY-OBJECT ARM.
      detail: >-
        ONLY IF the frozen EXP-MDFIVE-a8e71e contract explicitly NAMES and
        BOUNDS it: execute the IDENTICAL instrument at the IDENTICAL declared
        scale against MD5's Round-1 constants, 300 s ceiling, differing only in
        the parameters the contract names as varying. NEVER LARGER than the MD4
        arm.
        IF THE CONTRACT DOES NOT NAME IT: perform ZERO MD5 COMPUTATION --
        including in build-time self-checks and correctness fixtures -- and
        state so explicitly in the report. Do not run it "for completeness".
    - id: S-6
      what: MEASURED COST FIGURES.
      detail: >-
        Report this batch's own MEASURED throughput and counters, labeled
        `measured` throughout and kept distinct from RANK 1's `modeled` figures.
        DO NOT PROJECT TOWARD THE ~2^64-BLOCK INSTRUMENT-CLASS GAP (SC-3,
        DEC-20260821-1215e5 F-8) -- not from your numbers, not from batch 4's,
        not from BATCH-1f30fe's block anchor. If you cite any BATCH-af29f6 raw
        metric (2048, 1048576, 512x, R = 1.0), carry the ANOM-1 caveat with it
        (SC-4, KN-TECH-bb7e9f).

  hard_rules:
    - DO NOT START if TASK-20260821-fad775's gate decision is `revise` or
      `reject`. Report the block; do not proceed.
    - THE FROZEN CONTRACT IS IMMUTABLE FOR THIS TASK. A defect found is RECORDED
      and flagged for Coordinator/reviewer disposition, never patched into the
      contract and never silently worked around. Batch 4's executor did exactly
      this with ANOM-1 and it was the right call.
    - THE GATE RUNS FIRST. A declared-scale run executed without a passing gate
      is INVALID by the frozen contract's own invalidation_rule, and its results
      are void regardless of what they show.
    - harness/run_md5_calib.py is NOT modified.
    - Never claim execution at full literature-scale complexity.
    - Preserve every run immutably. A superseded run is marked invalid and KEPT,
      never deleted (the RUN-MDFIVE-primary-md4 / -v2 precedent).
    - Disclose every implementation bug caught pre-run as a protocol_deviation,
      even when it never affected a reported result.
    - SC-1 through SC-10 as declared in batch.yaml. NEVER READ THE QUARANTINED
      PAYLOAD; attest non-reading. Halt at each declared ceiling truthfully
      (SC-7). No Bedrock (SC-8). Record requested policy and resolved model.

