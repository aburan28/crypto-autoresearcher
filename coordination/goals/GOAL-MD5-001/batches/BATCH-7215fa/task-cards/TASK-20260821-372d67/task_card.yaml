  artifact_paths:
    - "harness/run_md4_ceiling.py OR harness/run_md4_ceiling_v2.py  # exactly one, per the frozen contract"
    - tests/test_harness.py
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/execution-report.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/runs/

  completion_gate:
    - The two-directional dependence gate ran FIRST, as a wrapped run with its
      own manifest and timing, in BOTH directions SEPARATELY, on the same
      observable and code path the declared-scale runs use, and both directions'
      distinct-value counts are reported as numbers.
    - >-
        If the gate FAILED: no declared-scale run directory exists, the stop is
        reported with its reason, and the unspent budget is reported as unspent.
        This satisfies the gate; the task is complete.
    - >-
        If the gate PASSED: the full suite passes; MD4 (and MD5, if authorized)
        agree with the RFC test vectors; the MD4 run report carries
        wrapper-measured timing and either a re-verifiable certificate or a
        complete ceiling report.
    - The H1 run reports comparison statistics ONLY -- including the VARIANCE
      across target draws and the achieved N -- and concludes nothing about
      validated/refuted.
    - ZERO MD5 computation unless the frozen contract names and identically
      bounds it; if authorized, parameter-identity with the MD4 arm is
      demonstrable from command.txt and manifest.yaml alone.
    - The written module's manifest output carries `caveat_refs` (SC-5).
    - No cost figure projects toward the ~2^64-block gap; every BATCH-af29f6 raw
      metric cited carries the ANOM-1 caveat.
    - Every run directory carries the full AGENTS.md Artifact Policy set; every
      superseded run is preserved and marked invalid.
    - The quarantine non-reading attestation is present.
