task_card:
  id: TASK-20260821-6ce8a8
  title: >-
    RANK 7: isolated commit-mode LEDGER archive -- compose the two blinded
    reviews, write EV-MDFIVE-24e077 and the closing decision, checkpoint the
    goal head, close BATCH-7215fa
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  rank: 7
  role: coordinator
  policy: coordinator-orchestration-code
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260821-2de43d
    - TASK-20260821-26ba34
  archived_by: TASK-20260821-6ce8a8
  handoff: ledger/handoffs/TASK-20260821-6ce8a8.yaml
  review_required: false
  budget:
    wall_clock_seconds: 300
    memory_gb: 8
    maximum_runs: 1

  uncertainty_to_reduce: >-
    None mathematical. This is the mechanical, auditable close of a reviewed
    batch -- the point at which observations become official state, and the one
    place where an unsupported word becomes durable.

  job: >-
    RUN ALONE. Compose the two blinded reviews yourself (neither reviewer voted;
    each owns joints it could see and neither could see the other's). Write the
    evidence record and the closing decision STRICTLY from the two review
    reports and the frozen package. Fill knowledge_promotion. Checkpoint the
    goal head with EXACTLY ONE next action. Commit under a content_first ledger
    binding, push, and refresh the PR.

  steps:
    - id: S-1
      what: VERIFY VALIDITY BEFORE INTERPRETING ANYTHING.
      detail: >-
        Before treating any run as evidence, confirm from the validator's V5 and
        the snapshot receipt: expected run count, schema-complete manifests,
        seed integrity, raw/summary agreement, control comparability. AN INVALID
        OR INCOMPLETE RUN SET GOES BACK TO THE EXECUTOR with concrete defects
        listed -- it is not evidence, and no amount of review composition makes
        it one.
    - id: S-2
      what: CHECK THE REVIEW ROUND'S INDEPENDENCE MECHANICALLY.
      detail: >-
        Run `python3 tools/check_review_independence.py --batch
        coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa` and RECORD ITS
        OUTPUT. Every joint owned and attested, no undeclared sibling read, no
        re-deriver whose declared sources intersect blind_from. A failure here
        is a finding about the round, not a formatting problem.
    - id: S-3
      what: COMPOSE, DO NOT AVERAGE.
      detail: >-
        The red team owns R1-R5, the proves-too-much objects and the blind
        re-derivation; the validator owns V1-V5. Their central overlap is
        DELIBERATE and is the round's most informative comparison: the red team
        re-derived the two-way dependence predicate blind, the validator
        replicated the gate from the producer's artifacts. AGREEMENT is evidence
        about the quantity; DISAGREEMENT localises to one of two named
        implementations and must be reported as such, never split the
        difference. Record how each blinded verdict was weighed.
    - id: S-4
      what: RULE ON THE COORDINATOR'S PRIOR P-R1 EXPLICITLY.
      detail: >-
        The plan recorded a specific, falsifiable prior: that at S=9 the two free
        words influence DISJOINT components of the boundary state, so a bare
        "read tuple position 0" swap would relocate ANOM-1 rather than cure it.
        Whether the review confirmed it, refuted it, or could not discriminate,
        SAY SO PLAINLY as a finding of its own. A refuted Coordinator prior is
        among the most valuable results this program can produce and is
        unrecoverable if folded into "the design was fine".
    - id: S-5
      what: CHECK THE POLICY-ESCALATION TRIGGER.
      detail: >-
        If any result CONTRADICTS EV-MDFIVE-ab007d's obstruction as that record
        scopes it, DO NOT RECORD A DECISION ON IT. Stop, record the
        contradiction, and report that a separate `review-breakthrough` round at
        max effort in an independent session is required before any status moves
        (AGENTS.md rule 12; review plan `policy_escalation_trigger`). That policy
        may never be degraded.
    - id: S-6
      what: WRITE ledger/evidence/EV-MDFIVE-24e077.yaml.
      detail: >-
        Full schema per templates/research-records.md. Set `direction` and
        `strength` honestly, with a `strength_note` that says what "replicated"
        would have meant and why this is or is not it. Set `claim_tier` (toy)
        and `proof_status` with `proof_refs`. Fill `observations`, `boundaries`,
        `unresolved_confounds`, and `promotion_gate_assessment` gate by gate.
        IF THIS RECORD'S DIRECTION IS `weakens` OR `contradicts`, OR IF IT
        CLOSES ANY LANE, the `obstruction` block is REQUIRED and must be a
        MEASUREMENT, not prose: a statement about the OBJECT, the quantity, its
        value with units and error bars, the runs it is read from, and the exact
        scope it is claimed over -- narrower than the closure, never wider. Its
        `resource_check` is never omitted: ask which theory takes this
        measurement as its HYPOTHESIS rather than its refutation, record the
        reading, and file any `spawned_ids`. `examined: true` with a reading
        that none was found is a complete answer; a null resource_check is
        incomplete work and the decision waits.
        A FAILED TWO-WAY GATE IS A REAL RESULT and is recorded as one, with its
        own obstruction block -- not as a batch failure and not as an
        infrastructure outcome.
    - id: S-7
      what: WRITE THE CLOSING coordinator_decision.
      detail: >-
        Mint its id yourself:
        `python3 tools/allocate_id.py --next decision --date 20260821 --check`.
        Numbered findings, target_ids referencing COMMITTED records only,
        evidence_refs, limitations, next_actions, attestation (requested policy,
        resolved model, fallback_used, degraded_requirements, no Bedrock), and
        `batch_state: closed`.
        CLAIM TIER: `analyzed`, NEVER `supported`. State explicitly which of
        CLAUDE.md's four promotion gates are unmet and why -- do not round up. In
        particular, "HEUR-H1 tested once at toy scale" is NOT "H1 validated".
        BEFORE ANY ADVERSE TRANSITION (weaken, reject_scoped, or a hypothesis ->
        rejected), secure the strongest checkable refutation artifact the result
        admits -- counterexample certificate, then derivation note, then a
        declared `empirical_only` basis -- and cite it in the evidence record's
        proof_status/proof_refs. `reject_scoped` on a single unreplicated
        empirical-only run is FORBIDDEN; use `weaken` plus replication.
    - id: S-8
      what: FILL knowledge_promotion.
      detail: >-
        REQUIRED, as a mapping. Promote a KN-FIND when the decision is `support`
        or `reject_scoped` on `replicated`/`strong` evidence (a proven boundary
        counts); otherwise record a CONCRETE `not_warranted` reason -- not a
        placeholder. Follow the /curate-knowledge conventions. Mint any KN id
        yourself via tools/allocate_id.py --check.
        NOTE: knowledge/INDEX.md is generated and .gitignore'd under CLAUDE.md
        "Concurrency"; do NOT commit it. The entry itself is the durable
        artifact.
        If the batch produced a durable result about the corrected construction,
        consider whether KN-TECH-bb7e9f should be EXTENDED BY A NEW ENTRY that
        supersedes or complements it -- knowledge entries are immutable, so a
        correction is a new entry with `superseded_by` set on the old one, never
        an edit.
    - id: S-9
      what: CHECKPOINT THE GOAL HEAD.
      detail: >-
        Update ledger/goals/GOAL-MD5-001.yaml: latest_verified_commit (this
        archive), current_batch_id, dispatch_queue_path, updated_at, and
        next_action -- EXACTLY ONE concrete next action for batch 6, with any
        retained context clearly marked as retained context rather than as
        further actions. Do NOT touch campaign_budget, completion_criteria,
        pause_conditions, or status.
        RE-ASSESS THE BUDGET TRIGGER recorded in DEC-20260821-84a8f1
        `budget_accounting.budget_ceiling_flag_forward`: if cumulative ACTUAL
        wall-clock through batch 5 exceeds 10800 s, or batch 5's actual spend
        exceeded 25% of its 4510 s declared ceiling, the next opening must
        request explicit USER authorization for a total_wall_clock_seconds
        amendment. Record the actual figures either way.
        A scoped rejection, an invalid run, or an exhausted batch ends THAT
        TASK, not this goal. The goal stays `active` unless a pause_condition is
        genuinely met, and it is never retired under a status that understates a
        criterion it actually met.
    - id: S-10
      what: ARCHIVE, PUSH, PR.
      detail: >-
        Isolated, commit-mode, content_first binding over exactly the declared
        paths. Before the commit, fetch origin/main and MERGE it into the branch
        (MERGE, NEVER REBASE); record the base commit checked and the merge
        outcome in the receipt. A sync conflict inside an immutable record is
        resolved by a NEW SUPERSEDING RECORD under a new id, never by editing a
        side. After the commit, push and refresh the PR against main naming
        EV-MDFIVE-24e077, the closing DEC, BATCH-7215fa and every TASK-* id.
        Do not put this commit's own sha into an artifact inside it.

  hard_rules:
    - RUNS ALONE. No concurrent writer during the archive.
    - THE RECORDS ASSERT NOTHING BEYOND THE TWO REVIEW REPORTS AND THE FROZEN
      PACKAGE. Do not re-interpret a run, repair a missing result in prose, or
      estimate anything.
    - NO SUCCESS CRITERION MOVES AFTER OUTCOMES WERE OBSERVED without a versioned
      protocol_amendment record (SC-9).
    - NEVER RECORD AN ATTESTATION YOU DID NOT OBTAIN. The three-model closure
      quorum is SUSPENDED, so no `completion_quorum` block is required; if you
      record one anyway it is validated in full and must describe a review that
      really happened. A single DISSENT blocks closure and is not outvoted.
    - If TASK-20260821-fad775 revised/rejected, or if the two-way gate FAILED,
      RECORD THAT AS THE BATCH RESULT HONESTLY. It is a real outcome, it does
      not close the goal, and it is not written up as a failure.
    - Every ANOM-1-caveated citation carries its caveat (SC-4). Nothing projects
      toward the ~2^64-block gap (SC-3).
    - No official transition may be made from uncommitted ledger or research
      artifacts, and none is official until the post-commit verifier accepts it.
    - SC-1 through SC-10 as declared in batch.yaml. NEVER READ THE QUARANTINED
      PAYLOAD.

  read_scope:
    - AGENTS.md
    - agents/coordinator.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - knowledge/README.md
    - knowledge/techniques/KN-TECH-bb7e9f.md
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-6ce8a8/task_card.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/batch.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/dispatch_queue.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/reviews/TASK-20260821-2de43d/red-team-report.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/reviews/TASK-20260821-26ba34/validation-report.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-e2ffe4/snapshot-receipt.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/
    - ledger/goals/GOAL-MD5-001.yaml
    - ledger/hypotheses/H-MDFIVE-0ca596.yaml
    - ledger/proposals/IDEA-20260821-ea35d1.yaml
    - experiments/EXP-MDFIVE-a8e71e/specification.yaml
    - ledger/decisions/DEC-20260821-84a8f1.yaml
    - ledger/decisions/DEC-20260821-1215e5.yaml
    - ledger/evidence/EV-MDFIVE-ab007d.yaml

  write_scope:
    - ledger/evidence/EV-MDFIVE-24e077.yaml
    - ledger/decisions
    - ledger/goals/GOAL-MD5-001.yaml
    - ledger/hypotheses/H-MDFIVE-0ca596.yaml
    - knowledge/findings
    - knowledge/techniques
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-6ce8a8
  write_scope_exclusivity_note: >-
    ledger/decisions/ is declared as a directory only because the closing
    decision id is minted at execution time. EXACTLY ONE new DEC-*.yaml file may
    be created here by this task and NO existing file in that directory may be
    touched -- in particular not TASK-20260821-fad775's gate decision. Likewise
    knowledge/findings and knowledge/techniques are declared for a POSSIBLE new
    entry only; existing entries are immutable and are superseded by a new file,
    never edited. knowledge/INDEX.md is generated and .gitignore'd and is not
    committed. H-MDFIVE-0ca596 is in scope ONLY for its `status` field and a
    `status_note`, so this batch does not repeat batch 4's split where the
    ruling and the field edit landed in different tasks.

  artifact_paths:
    - ledger/evidence/EV-MDFIVE-24e077.yaml
    - "ledger/decisions/DEC-20260821-<minted>.yaml  # closing decision, minted by this task"
    - ledger/goals/GOAL-MD5-001.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-6ce8a8/ledger-receipt.json

  reserved_ids:
    EV-MDFIVE-24e077: PRE-ALLOCATED and `--check`ed. Use exactly this id.
    closing_decision: NOT pre-allocated -- mint via tools/allocate_id.py --next decision --date 20260821 --check.
    any_KN_FIND: NOT pre-allocated -- mint via tools/allocate_id.py --check.

  completion_gate:
    - The five validity checks are answered BEFORE any interpretation, and an
      invalid run set is returned to the Executor rather than interpreted.
    - tools/check_review_independence.py was run and its output recorded.
    - The composition states how each blinded verdict was weighed, and reports
      any red-team/validator disagreement on the gate as a localisation rather
      than a split difference.
    - >-
        The Coordinator's prior P-R1 is ruled on explicitly: confirmed, refuted, or
        not discriminated.
    - EV-MDFIVE-24e077 and the closing decision pass tools/validate_ledger.py
      with no new errors.
    - If the direction is weakens/contradicts or any lane is closed, the
      obstruction block is a MEASUREMENT with a non-null resource_check.
    - knowledge_promotion is filled as a mapping, with a concrete not_warranted
      reason if nothing is promoted.
    - Claim tier is `analyzed`; the unmet promotion gates are named explicitly.
    - The goal head carries EXACTLY ONE next action and the re-assessed budget
      figures; campaign_budget, completion_criteria, pause_conditions and status
      are untouched.
    - The content_first ledger binding covers exactly the declared paths; the
      base commit checked and merge outcome are recorded; the branch is pushed
      and the PR refreshed naming the new records; the post-commit verifier
      accepts the receipt.
