  # =====================================================================
  # 1. THE LOAD-BEARING DERIVATION, RE-DERIVED BY THIS GATE FROM SOURCE
  # =====================================================================
  independent_rederivation:
    what_was_re_derived: >-
      The forward and backward tuple-position propagation calculus, the
      split-point-independence of d + r, the separation threshold, and the claim
      that batch 4 could not have been saved by any choice of split point S or of
      matched component. RE-DERIVED FROM harness/run_md4_ceiling.py's forward_step
      and backward_step SOURCE AND THEIR RETURN TUPLES BY THIS GATE, not taken on
      the proposer's word and not carried from any prior record's narrative.
    forward_rule_derived: >-
      forward_step((a,b,c,d), xk, s, t) returns (d, new_a, b, c) with
      new_a = rotl(a + F(b,c,d) + xk + t, s), plus b for MD5. As a map on tuple
      POSITIONS: new0 <- old3; new1 <- a function of all of old0..old3 and of xk;
      new2 <- old1; new3 <- old2. Propagating the set E_d of positions
      functionally reachable from a free word consumed d forward steps earlier:
      E_0 = {1}; E_1 = {1,2}; E_2 = {1,2,3}; E_d = {0,1,2,3} for d >= 3. AGREES
      with IDEA-20260821-ea35d1.
    backward_rule_derived: >-
      backward_step((a2,b2,c2,d2), xk, s, t) returns (old_a, c2, d2, a2) with
      old_a = rotr(rotated, s) - F(old_b, old_c, old_d) - xk - t, where
      old_b, old_c, old_d = c2, d2, a2 and rotated is b2 for MD4 or b2 - c2 for
      MD5. As a map on POSITIONS: new0 <- a function of all of old0..old3 and of
      xk; new1 <- old2; new2 <- old3; new3 <- old0. Propagating the set D_r:
      D_0 = {0}; D_1 = {0,3}; D_2 = {0,2,3}; D_r = {0,1,2,3} for r >= 3. AGREES
      with IDEA-20260821-ea35d1.
    intersection_derived: >-
      Both chains are MONOTONE INCREASING. All six cases with d + r <= 2 were
      checked individually and are EMPTY: (0,0) gives {1} against {0}; (0,1) gives
      {1} against {0,3}; (1,0) gives {1,2} against {0}; (0,2) gives {1} against
      {0,2,3}; (1,1) gives {1,2} against {0,3}; (2,0) gives {1,2,3} against {0}.
      All four cases with d + r = 3 are NON-EMPTY: (0,3) gives {1}; (3,0) gives
      {0}; (1,2) gives {2}; (2,1) gives {3}. Monotonicity carries every larger
      sum. THEREFORE E_d intersect D_r is non-empty EXACTLY WHEN d + r >= 3.
      AGREES with IDEA-20260821-ea35d1.
    split_point_independence_derived: >-
      With the forward free word consumed at step i, the backward free word at
      step j, and the boundary read after step S with i <= S < j: the forward
      depth is d = S - i, and reaching the after-step-S state from the inversion
      of step j requires inverting steps j-1 down to S+1, so r = j - 1 - S. Hence
      d + r = (S - i) + (j - 1 - S) = j - i - 1, INDEPENDENT OF S. Combined with
      the threshold above, a single boundary component can carry both dependencies
      exactly when j - i >= 4. AGREES with IDEA-20260821-ea35d1.
    batch_4_conclusion_derived: >-
      Batch 4 had i = 9 (word8 at step 9) and j = 10 (word9 at step 10), so
      j - i = 1 and d + r = 0 FOR EVERY ADMISSIBLE S (and S = 9 is in any case
      forced by i <= S < j). E_0 intersect D_0 = {1} intersect {0} = EMPTY.
      THEREFORE NO CHOICE OF SPLIT POINT AND NO CHOICE OF COMPONENT COULD HAVE
      SAVED BATCH 4. AGREES with IDEA-20260821-ea35d1.
    cross_check_against_the_batch_4_code_itself: >-
      Confirmed directly in harness/run_md4_ceiling.py's mitm_search: chunk2
      computes state9_b = backward_step(state10, word9, ...) and then reads
      a9_b = state9_b[1]. Since backward_step returns (old_a, c2, d2, a2), tuple
      position 1 is c2, i.e. state10[2] -- a pure pass-through carrying NO
      dependence on word9, which enters only old_a at position 0. That is ANOM-1,
      reproduced from source by this gate.
    verdict_on_the_central_check: >-
      MY DERIVATION AGREES WITH THE PROPOSAL'S ON EVERY LOAD-BEARING STEP. There
      is no disagreement to localise on the propagation calculus, the threshold,
      the split-point independence, or the batch-4 conclusion. THE COORDINATOR'S
      PRE-COMMITTED PRIOR P-R1 (review-plan-2de43d) IS CONFIRMED, AND
      KN-TECH-bb7e9f's "Open, not settled" mirror-image paragraph is now settled
      by TWO INDEPENDENT SYMBOLIC DERIVATIONS. KN-TECH-bb7e9f IS NOT EDITED BY
      THIS TASK; it is immutable and the update belongs to the closing task's
      knowledge_promotion, on the review round's evidence.
      THIS IS A STRONGER RESULT THAN THE FIX IT MOTIVATES, and it is recorded as
      such: it converts ANOM-1 from a measured accident at one split point into a
      derived, quantified design law over the whole one-round family. It is
      SYMBOLIC and derived by two agents in this program; the review round's BLIND
      re-derivation is the third and is deliberately not pre-empted here.

    localised_corrections_recorded_not_absorbed:
      - id: CORR-A
        what: TERMINOLOGY -- "F-layers" versus step distance.
        detail: >-
          IDEA-20260821-ea35d1 states that word2 is "separated from v6 by three
          F-layers" and word12 likewise, and speaks of an "F-depth >= 2"
          requirement. THE NUMBERS ARE STEP DISTANCES, NOT COUNTS OF F
          COMPOSITIONS. The minimum F-composition depth from word2 to v6 is 1,
          because v6 = rotl(v2 + F(v5,v4,v3) + word5, s) and v3 carries word2
          directly as the Z-argument.
        is_it_decision_changing: >-
          NO. The LOAD-BEARING property is true at these parameters and this gate
          verified it independently: word2 enters ALL THREE of v5, v4, v3, hence
          all three arguments of the F producing v6; and word12 enters ALL THREE
          of v9, v8, v7, hence all three arguments of the F producing v6 on the
          backward side. The contrast the proposal draws is also correct -- v8
          (tuple position 1) backward has only v9 word12-dependent, entering as
          the Z-argument of F(v11,v10,v9) and gated bit-by-bit by v11, which is
          exactly the step-distance-1 selection risk. The capacity ceilings
          (forward words 0-3, backward words 11-15 at S = 8 and component v6; and
          (word2, word13) for a full four-component connection) were re-derived
          and are CORRECT under the step-distance reading.
        action: >-
          H-MDFIVE-0ca596 and EXP-MDFIVE-a8e71e use "step distance" and state the
          branch-coverage property explicitly. NO PARAMETER, FREE WORD, SPLIT
          POINT, COMPONENT INDEX OR SCALE IS CHANGED.
      - id: CORR-B
        what: A PRE-REGISTERED PREDICTED VALUE, not a criterion -- distinct_fiber_sets.
        detail: >-
          IDEA-20260821-ea35d1 predicts distinct_fiber_sets "~16" at the
          k1 = k2 = 4 gate. THIS GATE DERIVES EXACTLY 2, WITH 3 ACCEPTABLE. At
          m = 12 the 16 forward and 16 backward window values fall into 4096 bins,
          so the expected number of NON-planted matching pairs is
          16 x 16 / 4096 = 0.0625; the planted pair matches EXACTLY by HEUR-H2's
          exact invertibility; therefore one fiber is non-empty and fifteen are
          empty, giving exactly 2 distinct sets, with one spurious extra match
          (probability about 6 percent) giving 3.
        is_it_decision_changing: >-
          NO, AND THE CRITERION IS NOT WEAKENED. The criterion
          distinct_fiber_sets >= 2 is UNCHANGED and this gate verified it still
          separates the cases it exists to separate: a construction degenerate in
          the backward word yields EXACTLY 1 distinct fiber set whether or not its
          constant backward value happens to match some wA, so the batch-4 slice
          fails it, as does any construction whose match condition factorizes on
          this single component. The criterion is also ACHIEVABLE on a correct
          construction only because PO-10 (feasibility) guarantees the planted pair
          lies inside the gate-scale window; that condition is now stated
          explicitly in the contract, where the proposal left it implicit.
        action: >-
          BOTH PREDICTIONS ARE RECORDED, ATTRIBUTED, BEFORE ANY RUN, in
          H-MDFIVE-0ca596 predictions and in EXP-MDFIVE-a8e71e
          mandatory_dependence_gate. Whichever value is observed, the deviation
          from the other prediction is legible as a result rather than absorbed.
          THE GATE DID NOT SILENTLY REPLACE THE PROPOSER'S NUMBER.

  # =====================================================================
  # 2. GATE CHECKLIST G-1 .. G-10, ITEM BY ITEM
  # =====================================================================
  gate_checklist_findings:
    - id: G-1
      what: KN-TECH-080 audit 1 -- exact bottleneck and baseline embedding.
      verdict: PASS
      rationale: >-
        The named bottleneck is DECISION-CHANGING and is a genuinely different
        bottleneck from batch 4's: "place the two free words at schedule distance
        j - i >= 4 AND read a boundary component into which each free word enters
        more than one argument of the F that produces it". Removing the first half
        reproduces ANOM-1 as a DERIVED PREDICTION; removing the second half yields
        a seed-dependent partial degeneracy a lucky seed could hide. Both halves
        are measured, not assumed. The baseline is embedded as an EXACT PARAMETER
        SLICE (8, 9, S = 9, p = 1) running through the SAME two observable
        functions, and the reproduction check is a FROZEN NEGATIVE REGRESSION
        FIXTURE requiring ANOM-1 to be reproduced, with its expected outcome
        derived in advance -- not a numerical resemblance.
        ON THE SPECIFIC DEFECT THAT COST BATCH 4: the equivalent assumption is now
        STATED EXPLICITLY as A-1, in the proposal and again in the frozen
        hypothesis, with its SOLE discharge named (the k1 = k2 = 4 gate) and with
        an explicit denial that the symbolic derivation, the RFC vectors, the H2
        fixture or the brute-force control discharge it. That is precisely what
        red-team D1 demanded. It is not waved through a second time.
    - id: G-2
      what: KN-TECH-080 audit 2 -- observation collision / identifiability.
      verdict: PASS
      rationale: >-
        Collisions are PREDICTED WITH COUNTS rather than denied: 2^(k1+k2-m) = 256
        matching-window collisions per target and 2^(k1+k2-k) = 1 non-Y-reproducing
        full-target collision at the declared scale. The observable is declared
        INSUFFICIENT ON ITS OWN and the separating condition is named as part of
        the construction (the independent straight-line 16-step recomputation
        against Y). At k1 = k2 = 6 the collision search is EXHAUSTIVELY RUN over
        all 4096 pairs rather than reasoned about, and the full list of
        20-bit-colliding non-Y-reproducing pairs is a required artifact. The
        structural-collision-family check is reported as "searched symbolically,
        none found", explicitly NOT as a claim that none exists. This gate checked
        the arithmetic: 2^(20-12) = 256, 2^(20-20) = 1, and 4096 / 2^20 = 0.0039
        are all correct.
    - id: G-3
      what: KN-TECH-080 audit 3 -- quantifier order.
      verdict: PASS
      rationale: >-
        Three claims are written with explicit forall/exists order and with the
        witness's permitted dependencies enumerated (target, fixed-word seed,
        primitive, (k1,k2,m,k)) and its forbidden dependency stated (the planted
        pair). CLAIM 3 is the one batch 4 got wrong by omission and the record
        names its own weakness: the universal statement is over ALL held-fixed
        values, the test covers FOUR, and the record labels the result a
        4-fold-stronger existential rather than the universal. It is specific to
        this construction's declared scale, not a generic restatement.
        COORDINATOR ADDENDUM, RECORDED: direction A's four held-fixed values are
        STRUCTURALLY INERT, since chunk1_observable does not read free word B at
        all -- the proposal SAYS SO rather than presenting four passed tests. The
        frozen contract converts that inert repetition into a narrow but real
        check (PO-3: all four must be byte-identical, else chunk1_observable reads
        free word B and that is a defect and a STOP). Direction B's four values are
        NOT inert, because each regenerates the target Y; the contract now states
        that regeneration rule, which the proposal left implicit.
    - id: G-4
      what: KN-TECH-080 audit 4 -- method ceiling and nearby-object control.
      verdict: PASS
      rationale: >-
        The strongest certifiable claim under ideal tuning is bounded and stated.
        A HARD CEILING ON THE OBJECT is derived and this gate re-checked it: two
        free 32-bit words supply 64 bits of freedom against a 128-bit Round-1
        output state, so for an arbitrary Y no solution exists with probability
        about 1 - 2^-64 and every reported success is conditioned on Y having been
        generated from an in-window pair. No choice of k1, k2, m, k, split point or
        component escapes it. The free-word capacity ceiling (at most 4 forward and
        5 backward free words at S = 8 and component v6; (word2, word13) for a full
        four-component connection) was re-derived and is correct.
        NEARBY-OBJECT PREDICTIONS ARE STATED BEFORE ANY RUN, not fitted after.
        Control 1 is the batch-4 slice with a verdict that is not merely expected
        but ALREADY PROVED, and the gate is REQUIRED to distinguish the pair
        through the same code path -- the sharpest nearby-object control available
        anywhere in this goal. Control 2 is MD5 with three pre-declared
        predictions, including the pre-commitment that R carries no information.
    - id: G-5
      what: THE MIRROR-IMAGE RISK.
      verdict: PASS -- SETTLED WITH AN ARGUMENT, NOT ASSUMED AWAY.
      rationale: >-
        The proposal ADDRESSES the recorded unsettled risk FIRST, derives it
        symbolically from the module's return-tuple algebra, concludes that the
        Coordinator's reading HOLDS, and consequently DOES NOT ADOPT the position-0
        swap. It changes the free words instead, to separation 10. This gate
        re-derived the whole calculus independently and AGREES. The card's
        non-approvable case -- "adopts option (b) alone without settling this" --
        is therefore not merely avoided but inverted: the risk is settled, and the
        design is built around the settlement rather than against it.
        THE PROPOSAL ALSO STATES THE EPISTEMIC LIMIT OF ITS OWN DERIVATION
        correctly: the calculus proves INDEPENDENCE where independence holds (a
        theorem) but only SUGGESTS dependence where a position is inside the
        reachable set, because syntactic reachability over-approximates and
        algebraic cancellation can still annihilate it. That is exactly the gap
        batch 4 fell into and it is why the empirical gate is mandatory. Recording
        that limit rather than eliding it is what makes this item a pass on the
        merits.
    - id: G-6
      what: THE MANDATORY TWO-DIRECTIONAL DEPENDENCE OBLIGATION.
      verdict: PASS at the proposal level; WRITTEN INTO THE CONTRACT AS A HARD TERM.
      rationale: >-
        The proposal states it as an implementable obligation with a concrete
        pass/fail predicate at k1 = k2 = 4, on the same observable through the same
        two named functions, in BOTH DIRECTIONS SEPARATELY, with the joint fiber as
        a third part, with a simultaneous both-word sweep explicitly forbidden as a
        substitute, with all counts reported AS INTEGERS at 32-bit and 12-bit
        resolution, and with FAILURE DECLARED A STOP. Nothing is missing and
        nothing is soft.
        WHAT THIS GATE ADDED, AS CONTRACT TERMS RATHER THAN DESIGN CHANGES: the
        gate now appears as proof obligation PO-2 in H-MDFIVE-0ca596, as
        success_criterion SC-A in EXP-MDFIVE-a8e71e, AND as invalidation rule IR-1
        ("any declared-scale run executed without a passing gate is INVALID,
        regardless of what it found"). The contract also fixes m = 12 and k = 20 at
        EVERY scale so the observable is literally identical across gate, control
        and declared scale; names the two functions (chunk1_observable,
        chunk2_observable); requires a code_path_fingerprint per phase (PO-8) so
        joint V1's observable-identity check is mechanical rather than narrative;
        requires a phase_log with the gate verdict recorded before any control
        phase so ORDER is checkable from artifacts; specifies the target
        regeneration rule for direction B; and adds PO-3 for direction A's inert
        repetitions.
    - id: G-7
      what: THE VACUOUS-CONTROL PATTERN.
      verdict: PASS -- AND THE PROPOSAL'S OWN CONCESSION IS WHAT MAKES IT SO.
      rationale: >-
        CTL-PO4 (the brute-force-equality control) is NOT vacuous in the
        completeness direction: its naive side enumerates all 4096 pairs and runs
        an INDEPENDENT straight-line 16-step forward recomputation compared against
        Y, and NEVER calls backward_step, NEVER reads component p, and NEVER reads
        the matching window. That is exactly the defect batch 4 had, where the
        naive baseline read the same word9-independent tuple position the MITM read
        (verified by this gate in harness/run_md4_ceiling.py's
        naive_all_pairs_search, which compares low_k_fwd against low_k_bwd -- two
        readers of the same degenerate quantity). It CAN fail: a wrong
        separation/branch-coverage argument makes the MITM miss the planted pair
        while the naive search still finds it.
        THE PROPOSAL CONCEDES, CORRECTLY, THAT CTL-PO4 ALONE WOULD STILL PASS
        VACUOUSLY AGAINST ANOM-1, because a one-word-degenerate construction emits
        every value of that word as a raw candidate, all but one fail the
        certificate, and the surviving sets still match. That concession is right
        and is why the package is honest rather than compliant.
        CAN CTL-PO5 ACTUALLY FAIL? DEMONSTRABLY YES, AND THE FAILING INSTANCE IS
        ALREADY ON RECORD. Batch 4's raw pre-certificate set was exactly a full row
        -- one wA paired with every wB (EV-MDFIVE-ab007d O-1, ANOM-1 CAVEAT) --
        which fails part (a) immediately, and at k1 = k2 = 6 would have produced 64
        raw candidates against a ceiling of 4, failing part (b) as well. CTL-PO5 is
        the check batch 4 did not have and it is the one that carries the
        non-degeneracy load at control scale.
        CAN G-0 (CTL-PO1) ACTUALLY FAIL, AND DOES IT RUN THE SAME CODE PATH? Yes to
        both, conditionally on a contract term this gate made hard. It fails if the
        predicate PASSES on the batch-4 slice, which happens if the implementation
        is mis-wired to read a word9-dependent position or to recompute forward --
        a real, reachable failure mode, and the review plan's proves_too_much
        OBJECT M. The SAME-CODE-PATH requirement is the part that could have been
        satisfied by a special-cased branch, so it is now enforced rather than
        assumed: A-6 and PO-8 forbid any primitive-specific or phase-specific
        branching inside the two observable functions beyond the declared parameter
        tuple, and require every phase to emit a code_path_fingerprint naming the
        function qualnames and the tuple, with the function names required to be
        identical across all phases.
    - id: G-8
      what: THE ROADMAP-BIAS PAIRING RULE.
      verdict: PASS -- NEITHER COMPONENT DEFERRED.
      rationale: >-
        The conditional result (the construction under HEUR-H1 and HEUR-H1b) is
        dispatched together with its heuristic-validation experiment IN THE SAME
        BATCH: run 4 samples N = 1000 independent targets at the declared scale,
        compares the matching-window collision counts against the predicted
        Poisson(256) with lambda FIXED a priori, and checks tail consistency via
        the largest-count Poisson survival probability -- sampling, distributional
        comparison, and tail check, all three present. HEUR-H1b carries its own
        paired two-outcome contrast (v6 against v8) in run 2. The proof-of-concept
        implementation is TASK-20260821-372d67 itself.
        STATED PLAINLY: the "target scale" for this pairing is the declared bounded
        toy scale, not cryptographic scale, because this hypothesis carries NO
        asymptotic claim and is explicitly not an exponent-moving proposal. The
        pairing rule is honoured in the only form a calibration lane can honour it.
    - id: G-9
      what: MD5 SCOPE.
      verdict: AUTHORIZED, IDENTICALLY BOUNDED, WITH FIXTURES NAMED. DEFECT-1601d6-02 CLOSED.
      rationale: >-
        RANK 1 EXPLICITLY NAMED the MD5 step
        (md5_specific_step_decision.decision: NAMED) with exact bounded parameters
        identical to the MD4 arm. This gate authorizes it and bounds it: the only
        two fields permitted to differ are the primitive selector and the target
        seed; any other difference in either direction invalidates the run under
        IR-4 and is batch-halting under joint V4.
        THE CHANGED COMPARISON QUANTITY IS RULED ADMISSIBLE, AND HERE IS THE
        RULING. R, the MD5/MD4 full-target-hit ratio, is DECLARED IN ADVANCE to be
        near-mechanically forced by the shared word schedule and to carry
        essentially no information at these parameters (EV-MDFIVE-ab007d O-4,
        ANOM-1 CAVEAT); IR-9 forbids reporting it as a finding in either direction
        while permitting it to be reported as a raw number carrying that
        declaration. The replacement quantity -- the chi-square p-value and the
        sample variance of the matching-window collision counts -- is one where the
        two primitives' differing shift tables and additive constants genuinely can
        differ, so it is a control that can come out TWO WAYS rather than one. Its
        crediting rule is fixed in advance and is deliberately demanding: a
        difference is credited only if one arm's p exceeds 0.05 and the other's
        does not AND the difference survives a null-constant replication, which is
        EXPLICITLY NOT authorized or budgeted here. This is a NEW heuristic
        statement in a NEW hypothesis declared before any run, not a
        reinterpretation of batch 4's frozen text, so SC-9 and HR-7 are satisfied.
        THIS GATE ALSO RE-DERIVED AND CONFIRMED the structural premise the MD5
        clause rests on: MD5's "+= b" term and its T[1..16] constants change the
        VALUE of new_a but not WHICH tuple positions depend on the supplied word,
        so the E and D sets are IDENTICAL for both primitives. The pre-declared
        expectation that the gate must pass identically for MD5, and that a
        divergence is an implementation defect and a STOP rather than a finding, is
        therefore correct and is written into the contract.
        DEFECT-1601d6-02 IS CLOSED BY NAMING, not by argument.
        md5_run_authorization.md5_mode_correctness_fixtures_authorized_explicitly
        names, as the ONLY MD5-mode computations permitted besides the search arm:
        (F1) the HEUR-H2 backward-inversion regression fixture in MD5 mode, seed
        8975327, at least 10,000 tuples, in run 1; (F2) the MD5 T[1..16] sine
        self-check, in run 1; (F3) the MD5 phase of the mandatory dependence gate
        at k1 = k2 = 4, target seed 8975328, in run 2. It states explicitly that
        the batch-4-slice null control is NOT run in MD5 mode, the k1 = k2 = 6
        controls are NOT run in MD5 mode, and no MD5 primary certificate run is
        authorized. The MD5 arm is therefore STRICTLY SMALLER than the MD4 arm in
        run count and identical in every per-run parameter.
    - id: G-10
      what: CLAIM CEILING.
      verdict: PASS -- CAPPED AT `analyzed` WITH THE GATE-BY-GATE BASIS.
      rationale: >-
        Both frozen records carry interpretation_limits capping every derived claim
        at `analyzed`, never `supported`, with the four promotion gates assessed
        honestly rather than rounded up: gate 1 not met and not attempted; gate 2
        not met, since a passing run moves HEUR-H1 from untested to
        tested-once-at-toy-scale, which is not validation, and HEUR-H3 remains
        untested by design; gate 3 not met, explicitly out of scope and prohibited
        from being computed from batch 4's degenerate throughput; gate 4 planned and
        budgeted and clearing nothing on its own. No language in either record reads
        stronger than the bounded runs can support: the hypothesis statement names
        its slice in its own text ("16 of 48 steps, 2 of 16 message words, a 20-bit
        target, AND ABOUT NOTHING ELSE"), the object ceiling forbids reading any run
        as a preimage, and the ANOM-1 caveat and the 2^64 projection prohibition are
        both invalidation rules rather than prose.

  # =====================================================================
  # 3. THE TWO EXPLICITLY REQUESTED RULINGS
  # =====================================================================
  ruling_on_dominated_by_row_1:
    question: >-
      IDEA-20260821-ea35d1's dominated_by row 1 records that a decoupled
      option-(c) construction at (word8, word9, S = 9) STRICTLY DOMINATES R1-SEP10
      on the pure two-word recovery task. Is that dominance disqualifying?
    ruling: NOT DISQUALIFYING.
    the_dominance_is_real_and_this_gate_confirmed_it: >-
      Re-derived here. At S = 9 the backward-recovered tuple position 0 is v6,
      and inverting steps 16 down to 11 uses only fixed words, so
      v6_bwd = C - word9 with C independent of word9 -- an affine map. Meanwhile
      forward position 0 of state9 is also v6, produced at step 6, which is
      strictly before word8 is consumed at step 9, so it is CONSTANT in word8.
      Hence word9 falls out of ONE modular subtraction with no search and no table,
      and word8 falls out of a 2^k1 sweep on position 1. About 2^k1 time and O(1)
      memory, against R1-SEP10's 2^k1 + 2^k2 time and 2^k1 memory. It is faster and
      strictly lighter, and the proposal is right to say so.
    why_it_is_nonetheless_irrelevant_to_this_batch: >-
      IT ANSWERS NEITHER QUESTION THE BATCH ASKS. Question one is whether a
      GENUINELY TWO-FREE-WORD, JOINTLY DISCRIMINATING splice-and-cut MITM is
      constructible at this split-point family; a construction whose match
      condition FACTORIZES into two independent univariate equations is by
      definition not jointly discriminating, so it cannot answer it -- it is the
      negative case, not a rival solution. Question two is HEUR-H1's first genuine
      test, which needs a matching-window COLLISION DISTRIBUTION to test against;
      a factorized match produces exactly one solution per equation and no
      collision distribution at all (DEC-20260821-1215e5 F-3). Nor could it anchor
      GOAL-MD5-001's method-ceiling question, which is about the MITM/biclique
      instrument class.
    what_this_gate_requires_as_a_consequence: >-
      The dominance is BINDING as an interpretation limit and is written into both
      frozen records: NO RECORD DOWNSTREAM OF THIS GATE MAY PRESENT R1-SEP10's
      modeled 1490x or 512x ratio as evidence that R1-SEP10 is the cheapest way to
      recover two planted words. Those ratios are against the naive all-pairs
      baseline over the same restricted space, and a cheaper non-MITM alternative
      is on record. Recording the cheaper alternative rather than burying it
      STRENGTHENS this package under docs/inventor-protocol.md's Pareto-honesty
      requirement; a proposal that hid it would have failed this item.

  ruling_on_novelty_status_unverified:
    question: >-
      The proposer's `search_knowledge` was UNAVAILABLE and both literature
      citations carry provenance `recalled`. Is `novelty_status: unverified`
      acceptable at this claim tier, or does it block approval?
    ruling: ACCEPTABLE AT THIS CLAIM TIER. IT DOES NOT BLOCK APPROVAL.
    rationale: >-
      Three reasons, in order of weight. FIRST, NOTHING IN THIS PACKAGE DEPENDS ON
      NOVELTY. The construction's entire value here is instrument-validity repair
      -- until a two-directional gate passes on SOME construction, every downstream
      measurement in this goal is uninterpretable -- and that value is unchanged
      whether the separation rule is new, folklore, or published in 2009. No
      supporting_result, no proof obligation, and no success criterion rests on
      either recalled citation. SECOND, THE RECORD MAKES NO NOVELTY CLAIM TO BE
      WRONG ABOUT: it labels the status `unverified`, states plainly that a session
      reading Aoki-Sasaki FSE 2009 or Zhong-Lai eprint 2010/583 could reasonably
      downgrade it to `known` or `adaptation` and that this would be a normal
      outcome, and logs the WebSearch summaries as the most likely prior art
      precisely so a reviewer chases them. THIRD, THE RETRIEVAL FAILURE IS REPORTED
      HONESTLY AND ITS INFERENCE IS CORRECTLY REFUSED: the kb MCP tools were absent
      from that session's tool surface, no `search_knowledge` call is claimed, Grep
      and WebSearch substitutes are labeled a recall FLOOR rather than a
      measurement, and the record states that absence of a corpus hit licenses no
      inference (AGENTS.md knowledge retrieval policy). That is exactly the
      required behaviour, not a workaround.
    conditions_attached_and_now_binding: >-
      (i) NO RECORD DOWNSTREAM OF THIS GATE MAY DESCRIBE the separation rule
      (j - i >= 4) or the branch-coverage refinement as novel, new, or first --
      written into H-MDFIVE-0ca596 and EXP-MDFIVE-a8e71e interpretation_limits.
      (ii) The primary-text reads of Aoki-Sasaki FSE 2009 and Zhong-Lai eprint
      2010/583 are carried as an EXPLICIT OPEN DIRECTION and are the cheapest
      outstanding provenance upgrade in this goal.
      (iii) If any later session in this goal has kb retrieval available, it runs
      the query before any record credits the derivation as new.
    when_this_ruling_would_have_gone_the_other_way: >-
      It would BLOCK approval if the package made a priority or novelty claim, if
      any supporting_result rested on a `recalled` citation, or if a KN-FIND
      promotion were being proposed on the basis of the derivation being new. None
      of those is the case this batch. The derivation may well be promotable later
      as a technique entry on the review round's evidence, and THAT promotion --
      not this approval -- is where the unverified novelty would have to be
      resolved or explicitly scoped.

