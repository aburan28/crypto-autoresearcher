  # =====================================================================
  # ANOMALIES -- recorded, not discarded, whether or not they fit.
  # =====================================================================
  anomalies:

    - id: ANOM-B5-1
      severity: material
      what: >-
        THE MD4 FORWARD OBSERVABLE COLLAPSES FAR BELOW ITS PRE-REGISTERED
        PREDICTED VALUE, WHILE THE MD5 ONE DOES NOT.
      frozen_prediction_being_compared_against: >-
        EXP-MDFIVE-a8e71e mandatory_dependence_gate.
        predicted_values_stated_before_any_run: "distinct_fwd_32bit = 16 and
        distinct_bwd_32bit = 16 ... the 12-bit counts are predicted 16 as well,
        with 15 acceptable". FROZEN; NOT ADJUSTED; NOT RE-SCORED.
      observed_md4_phase_B: 'distinct_fwd_32bit = 9 of 16; distinct_fwd_12bit = 4 of 16; distinct_bwd_32bit = 6, 4, 7, 11; distinct_bwd_12bit = 6, 4, 7, 11'
      observed_md5_phase_C: 'distinct_fwd_32bit = 16 of 16; distinct_fwd_12bit = 16 of 16; distinct_bwd_32bit = 16 of 16; distinct_bwd_12bit = 8, 11, 7, 7'
      collision_multiplicity_md4_forward_sweep_32bit: [2, 2, 2, 2, 2, 2, 2, 1, 1]
      collision_multiplicity_md4_forward_sweep_12bit: [5, 4, 4, 3]
      at_k1_k2_6_the_same_effect: 'forward v6 gives 33 distinct 32-bit and only 6 distinct 12-bit values over a 64-value sweep (O-8)'
      why_it_matters_procedurally: >-
        The gate's CRITERION is >= 2 and was met, so the gate passed as
        written. But the observed values are a large deviation from the
        numbers the contract recorded in advance, and the contract's stated
        reason for recording them was "so a deviation is legible as a result
        rather than absorbed". It is recorded here rather than absorbed.
      relation_to_CTL_PO5: >-
        STATED AS A CO-OCCURRENCE, NOT A CAUSAL CLAIM. The CTL-PO5 raw set is
        exactly a 4 x 2 product sharing one 20-bit observable value, and the
        forward channel independently shows 12-bit collapse at both k = 4 and
        k = 6. Whether one explains the other is for the Reviewer.
      not_an_implementation_error: >-
        Every correctness control passed independently: all seven RFC 1320
        A.5 MD4 vectors, the MD5 T[1..16] sine self-check, HEUR-H2 exact
        invertibility on 10000 tuples per primitive, CTL-PO9 component
        identity against an independent named-register reference, and CTL-PO4
        (certificate-verified MITM set == independent naive Y-reproducing set
        == the planted pair). The Executor therefore does not classify this
        as implementation_error; it classifies it as an observation about the
        construction and hands the classification question onward.

    - id: ANOM-B5-2
      severity: informational
      what: >-
        The joint fiber count came out at EXACTLY 2 in both phase B and phase
        C, matching the COORDINATOR GATE's pre-registered derivation and not
        IDEA-20260821-ea35d1's pre-registered "about 16".
      both_predictions_were_on_record_before_any_run: true
      recorded_because: >-
        the contract required that whichever value was observed, the deviation
        from the other prediction be legible rather than absorbed. The
        criterion (>= 2) was unchanged and not weakened.

    - id: ANOM-B5-3
      severity: informational
      what: >-
        harness/runner.py's effective `_inference_block()` (the second
        definition, at line 695, which shadows the adapter-aware one at line
        183) hard-codes requested_policy "executor-terra" into EVERY manifest
        it writes. This task's requested policy is executor-implementation.
      consequence: >-
        manifest.run.inference.requested_policy reads "executor-terra" in both
        of this task's run manifests and is WRONG for this task. It is not
        editable from here: harness/runner.py is outside this task's
        write_scope. The correct value is recorded in
        manifest.run.inputs.parameters.requested_policy =
        executor-implementation, written by
        harness/run_md4_ceiling_v2.py, and in this report's header.
      flagged_for: Coordinator disposition; affects every harness run in the repository, not just this batch.

    - id: ANOM-B5-4
      severity: informational
      what: >-
        The phase-A null control's single constant backward value happened to
        coincide with forward window value 9, so its sixteen fibers were all
        the non-empty set [9] rather than all empty. distinct_fiber_sets is 1
        either way, which is the number the criterion reads, and the contract
        anticipated exactly this ("A degenerate backward channel yields
        EXACTLY 1 whether or not its constant value happens to match").
        Recorded because it is the kind of coincidence that looks like a bug
        on a later reading.

  # =====================================================================
  # PROTOCOL DEVIATIONS -- every one, including those that changed nothing.
  # =====================================================================
  protocol_deviations:

    - id: DEV-1
      what: RUN ID SUFFIXES CARRY A `b5-` PREFIX not present in the contract's run_plan.
      contract_text: 'run_plan suffixes: buildcheck, gate_and_controls, primary-md4, h1-md4, md5-conditional'
      as_executed: 'RUN-MDFIVE-b5-buildcheck, RUN-MDFIVE-b5-gate_and_controls'
      reason: >-
        RUN-MDFIVE-buildcheck, RUN-MDFIVE-primary-md4, RUN-MDFIVE-h1-md4 and
        RUN-MDFIVE-md5-conditional ALREADY EXIST as immutable BATCH-af29f6
        records under
        coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/tasks/TASK-20260821-de817d/runs/.
        Emitting the bare suffixes would have minted duplicate run IDs for
        different runs, which CLAUDE.md forbids absolutely (IDs immutable,
        never reused). The contract does not contemplate the collision. The
        prefix is the minimal change that keeps every ID globally unique.
      effect_on_results: none.
      flagged_for: Coordinator; a future contract should mint run suffixes per batch.

    - id: DEV-2
      what: >-
        `caveat_refs` is emitted INSIDE manifest.run.inputs.parameters and
        manifest.run.cost_model rather than as a top-level manifest key.
      reason: >-
        harness/runner.py builds the manifest and is OUTSIDE this task's
        write_scope; a top-level key cannot be added without editing it, and
        IR-7 / the write_scope forbid that. `parameters` and `cost_model` are
        the two blocks the wrapper records VERBATIM, so the field is present,
        named exactly `caveat_refs`, and machine-readable from manifest.yaml
        alone. It names KN-TECH-bb7e9f and DEC-20260821-1215e5 F-4, plus IR-9
        and IR-10. Pinned by tests/test_harness.py::
        test_v2_manifest_output_carries_caveat_refs, which asserts against the
        written manifest rather than against prose.
      effect_on_results: none. SC-5 / IR-8 are satisfied in substance; the placement is disclosed so a reviewer checking for a top-level key is not surprised.

    - id: DEV-3
      what: >-
        MD5-MODE COMPUTATION NOT NAMED IN md5_run_authorization F1/F2/F3 WAS
        EXECUTED. Run 1's CTL-PO9 component-identity assertion was run in MD5
        mode as well as MD4 mode (both slices, 64 probe word-lists each).
      why_it_happened: >-
        The contract lists run 1's contents as "CTL-PO6 (both primitives),
        CTL-PO7, CTL-PO9" without a primitive qualifier on CTL-PO9, and
        CTL-PO9's own text names no primitive. This Executor ran it for both,
        for symmetry with CTL-PO6, before weighing it against
        md5_run_authorization's closing "NOTHING ELSE".
      what_it_actually_computed: >-
        A deterministic arithmetic identity only: that tuple position p of
        state_S equals the register produced at step component_step(S,p) in an
        independent named-register reference. No target, no search, no seeded
        target draw, no use of any of the nine frozen target seeds, no result
        that anything downstream depends on. Probe word-lists were drawn from
        random.Random(20260821), a procedure the contract does not declare
        (declared procedures cover fixed words, free-word high bits and
        targets only, none of which this touched).
      disposition: >-
        DISCLOSED, NOT REPAIRED. Run records are immutable and the run is
        preserved as written. Whether this trips IR-4 ("ANY MD5-SIDE
        COMPUTATION executed without md5_run_authorization ... is invalid
        regardless of outcome") for the CTL-PO9-md5 sub-result, or for run 1
        as a whole, is a Coordinator and Reviewer judgment and is NOT
        adjudicated here. The Executor notes only that the MD4-mode CTL-PO9
        result, which is what the contract needs, is independently present and
        passed, and that no MD5 search arm ran.

    - id: DEV-4
      what: >-
        The k1 = k2 = 6 control phase RAN, inside run 2, before CTL-PO5's
        failure was known.
      why_this_is_not_a_deviation_from_run_order: >-
        Recorded for clarity rather than as a breach. The contract's order is
        gate -> (on PASS) k1=k2=6 controls -> declared-scale runs. The gate
        PASSED, so the control phase was the correct next step, and CTL-PO5 is
        one of those controls -- its failure is discoverable only by running
        it. The phase_log shows GATE_VERDICT_RECORDED strictly before
        k1_k2_6_controls_md4. The stop took effect at the next boundary, which
        is where stopping_rules places it: "stops before any declared-scale
        run".

    - id: DEV-6
      what: >-
        `code_path_fingerprint` records the observable functions as
        `__main__.chunk1_observable` / `__main__.chunk2_observable` rather
        than `harness.run_md4_ceiling_v2.*`.
      reason: >-
        The fingerprint is built from the live `__module__` attribute, and
        both runs were launched with `python3 -m harness.run_md4_ceiling_v2`,
        which binds the module as `__main__`. The names are still fully
        qualified with respect to the executing module, the identity of the
        file is pinned by sha256 in manifest.run.code.source, and command.txt
        records the invocation, so PO-8's question -- which functions ran, with
        which tuple -- is answerable from the artifacts.
      not_repaired_by_rerunning: >-
        DELIBERATE. Run records are immutable and a rerun would mint a new run
        ID for numerically identical results purely to make an artifact read
        more nicely. That is not a reason to run anything. Disclosed instead.
      effect_on_results: none.
      note: >-
        tests/test_harness.py::test_v2_observables_are_the_single_code_path
        asserts the fully qualified names under normal import, where they read
        harness.run_md4_ceiling_v2.*.

    - id: DEV-5
      what: 'No amendment was requested and no parameter was retried.'
      recorded_because: >-
        The contract and the task card both anticipate the temptation. After
        the CTL-PO5 failure no parameter was adjusted, no seed was changed, no
        alternative free-word pair was tried, and no run was repeated. Exactly
        two runs were executed in this task, both reported, neither
        superseded.

