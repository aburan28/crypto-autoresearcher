    - id: O-2
      what: 'GATE-PO2 phase B, R1-SEP10, MD4 -- the two-directional dependence gate'
      parameters: 'i_word=2, j_word=12, S=8, p=3 (v6, the register produced at step 6), k1=k2=4, m=12, k=20, fixed_word_generation(20260821,(2,12),4), target seed 8975322'
      direction_A_held_fixed_free_word_B_lows: [0, 5, 10, 15]
      distinct_fwd_32bit: [9, 9, 9, 9]
      distinct_fwd_12bit: [4, 4, 4, 4]
      direction_A_criterion_ge_2_met: true
      CTL_PO3_byte_identical_across_the_four_repetitions: true
      direction_A_honesty_note: >-
        chunk1_observable STRUCTURALLY DOES NOT READ free word B, so the four
        held-fixed repetitions in direction A are inert by construction and buy
        no quantifier strength. Stated, per the contract, rather than presented
        as a passed test; CTL-PO3 is what converts them into a real check and
        it passed.
      direction_B_held_fixed_free_word_A_lows: [0, 5, 10, 15]
      direction_B_target_regeneration: >-
        performed as specified -- the target was regenerated per held-fixed
        index a, giving four distinct Y_a, so these four repetitions are
        genuinely different backward computations.
      distinct_bwd_32bit: [6, 4, 7, 11]
      distinct_bwd_12bit: [6, 4, 7, 11]
      direction_B_criterion_ge_2_met: true
      distinct_fiber_sets: 2
      joint_fiber_criterion_ge_2_met: true
      fiber_sets_observed: >-
        Fifteen empty fibers and one non-empty fiber [11, 12, 13, 14] at the
        free-word-B window value that carries the planted match.
      forbidden_substitution_check: >-
        No simultaneous both-word sweep was run, reported, or substituted for
        any part of this gate.

    - id: O-3
      what: 'GATE-PO2 phase C, R1-SEP10, MD5 (md5_run_authorization F3)'
      parameters: 'identical to O-2 except primitive=md5 and target seed 8975328'
      distinct_fwd_32bit: [16, 16, 16, 16]
      distinct_fwd_12bit: [16, 16, 16, 16]
      distinct_bwd_32bit: [16, 16, 16, 16]
      distinct_bwd_12bit: [8, 11, 7, 7]
      distinct_fiber_sets: 2
      predicate_returned: PASS
      same_verdict_as_phase_B: true

    - id: O-4
      what: THE FROZEN PASS PREDICATE, evaluated clause by clause
      verdict: PASS
      clauses:
        phase_A_returned_FAIL: true
        phase_A_distinct_bwd_32bit_exactly_1: true
        phase_A_distinct_bwd_12bit_exactly_1: true
        phase_A_distinct_fwd_32bit_gt_1: true
        phase_B_direction_A_criterion: true
        phase_B_CTL_PO3_byte_identity: true
        phase_B_direction_B_criterion: true
        phase_B_joint_fiber_ge_2: true
        phase_C_md5_same_verdict_as_phase_B: true
      failing_clauses: []
      what_this_licenses_and_nothing_more: >-
        Quoting the contract's own interpretation limit: a passing gate
        licenses only "the declared observable varies with each free word
        separately at k1 = k2 = 4, on this fixed-word seed, at these four
        held-fixed values". It does not license "the construction works", does
        not validate HEUR-H1, and says nothing about MD4's preimage resistance.

    - id: O-5
      what: 'CTL-PO4, COMPLETENESS CONTROL at k1 = k2 = 6, MD4, target seed 8975323'
      certificate_verified_mitm_solutions: [[331791343, 1135165152]]
      naive_Y_reproducing_solutions: [[331791343, 1135165152]]
      sets_equal: true
      planted_pair: [331791343, 1135165152]
      planted_pair_recovered: true
      naive_evaluations: 4096
      naive_baseline_independence: >-
        The naive side enumerated all 4096 pairs and, for each, ran an
        INDEPENDENT straight-line 16-step forward recomputation
        (`_reference_round1_output`) comparing the Round-1 OUTPUT STATE to Y.
        It never called backward_step, never read component p, and never read
        the matching window. This is machine-checked against the SOURCE (not a
        docstring) by tests/test_harness.py::
        test_v2_naive_baseline_is_independent_of_the_observable, which parses
        the function body's AST. BATCH-af29f6's baseline compared low_k_fwd
        against low_k_bwd and was vacuous (EV-MDFIVE-ab007d O-2; ANOM-1
        CAVEAT, KN-TECH-bb7e9f) -- that is not reproduced here.
      stated_limit_carried_from_the_contract: >-
        CTL-PO4 tests COMPLETENESS, NOT NON-DEGENERACY, and would still pass
        vacuously against an ANOM-1-style degeneracy. Its pass therefore
        carries no non-degeneracy weight.

    - id: O-6
      what: 'CTL-PO5, DEGENERACY CONTROL ON THE RAW PRE-CERTIFICATE SOLUTION SET, k1 = k2 = 6, MD4'
      result: FAIL
      failing_part: 'part (b)'
      raw_pre_certificate_candidate_count: 8
      declared_ceiling_for_part_b: 4
      modeled_expected_raw_count: 1.00390625
      distinct_wA_appearing_in_the_raw_set: 4
      distinct_wB_appearing_in_the_raw_set: 2
      window_size: 64
      part_a_both_projections_strictly_below_64: true
      part_b_raw_count_at_most_4: false
      structure_of_the_raw_set: >-
        Exactly the 4 x 2 product of 4 forward window values with 2 backward
        window values. All eight candidates carry the SAME 20-bit observable
        value 677474 decimal. Seven of the eight fail the independent 16-step
        certificate; only the planted pair reproduces Y.
      contract_language_this_triggers: >-
        EXP-MDFIVE-a8e71e stopping_rules: "If CTL-PO4 or CTL-PO5 fails, the
        executor stops before any declared-scale run and reports. A CTL-PO5
        failure in particular means a degenerate word channel survived the
        gate, which is a finding about the GATE and must be reported as such."
        It is also falsification_criterion (d), "CTL-PO5's raw projections
        cover a full window or the raw count exceeds 4". BOTH ARE QUOTED, NOT
        ADJUDICATED. Whether this is a finding about R1-SEP10, about GATE-PO2,
        or about the ceiling of 4 is a Reviewer and Coordinator judgment; the
        Executor reports the integers.
      it_is_not_the_batch_4_failure_mode: >-
        Recorded so the two are not conflated. BATCH-af29f6's raw set was a
        FULL ROW -- one wA paired with every wB, which fails CTL-PO5 part (a)
        (EV-MDFIVE-ab007d O-1; ANOM-1 CAVEAT). Here part (a) PASSES (4 and 2,
        both far below 64) and only part (b), the absolute count, fails.

    - id: O-7
      what: 'CTL-OBS, EXHAUSTIVE OBSERVATION-COLLISION ENUMERATION, k1 = k2 = 6, MD4'
      pairs_enumerated: 4096
      exhaustiveness_argument: >-
        The MITM sweeps all 2^6 forward and all 2^6 backward window values and
        its m = 12 filter is a strict superset of the k = 20 filter (same low
        bits), so the reported 20-bit-colliding set is the complete set over
        all 4096 pairs. The naive side independently enumerated all 4096.
      twenty_bit_colliding_pairs: 8
      twenty_bit_colliding_pairs_reproducing_Y: 1
      twenty_bit_colliding_NON_Y_reproducing_pairs: 7
      full_list_artifact: >-
        runs/RUN-MDFIVE-b5-gate_and_controls/raw-result.json ->
        raw.k1_k2_6_controls.CTL_OBS_observation_collisions.
        twenty_bit_colliding_non_Y_reproducing_pairs (all seven, with their
        reference component values). THE SEARCH WAS RUN, NOT REASONED ABOUT.
      modeled_expectation_for_comparison: 0.00390625 non-planted collisions
      matching_window_hits_12bit: 16

    - id: O-8
      what: 'CTL-H1B, HEUR-H1b PAIRED CONTRAST, 64-value sweeps, k1 = k2 = 6, MD4'
      forward_v6_step: 6
      forward_v6_distinct_32bit: 33
      forward_v6_distinct_12bit: 6
      backward_v6_distinct_32bit: 24
      backward_v6_distinct_12bit: 24
      backward_v8_step: 8
      backward_v8_distinct_32bit: 2
      backward_v8_distinct_12bit: 2
      sweep_size: 64
      reported_as: >-
        numbers only. The Executor composes no verdict on HEUR-H1b. For the
        Reviewer's convenience the contract's own frozen threshold is quoted
        without being applied: falsification_criterion (h) reads "v6 below 48
        distinct 32-bit values over a 64-value sweep on either side".

    - id: O-9
      what: HEUR-H1 VALIDATION
      result: NOT MEASURED. The run did not happen.
      frozen_prediction_reference: >-
        EXP-MDFIVE-a8e71e preregistered_prediction -- Poisson(lambda =
        2^(k1+k2-m) = 2^8 = 256) for the matching-window (12-bit) collision
        count across N targets at k1 = k2 = 10, from H-MDFIVE-0ca596 HEUR-H1.
        UNCHANGED, UNADJUSTED, AND UNSCORED. No chi-square statistic, no
        p-value, no sample variance, no tail check and no achieved N exist for
        this batch, because run 4 was never executed.
      missing_data_stays_missing: true

    - id: O-10
      what: MD5 COMPUTATION PERFORMED IN THIS TASK, exhaustively enumerated
      md5_search_computation: >-
        ZERO. No MD5 declared-scale run, no MD5 primary run, no MD5 H1 arm, no
        MD5 k1=k2=6 control, and no MD5 execution of the phase-A null control.
      md5_computation_that_did_occur:
        - 'F1 (authorized by name): CTL-PO6 HEUR-H2 backward-inversion regression fixture in MD5 mode, seed 8975327, 10000 tuples, 0 failures. Run 1.'
        - 'F2 (authorized by name): MD5 T[1..16] self-check against the RFC 1321 sec 3.4 sine definition, at module import and reported in run 1. All 16 entries match.'
        - 'F3 (authorized by name): GATE-PO2 phase C, k1 = k2 = 4, m = 12, k = 20, target seed 8975328. Run 2. See O-3.'
        - 'NOT NAMED IN F1/F2/F3 AND THEREFORE DISCLOSED AS DEV-3: CTL-PO9 component-identity assertion executed in MD5 mode in run 1.'
      ratio_R: >-
        NOT COMPUTED and NOT REPORTED. R is pre-declared uninformative and
        FORBIDDEN as a finding by IR-9; with no MD4 and no MD5 declared-scale
        arm there is nothing to form it from in any case.

    - id: O-11
      what: MEASURED COST TABLE for this instrument (labeled measured throughout)
      measured:
        run1_buildcheck_wrapper_wall_seconds: 0.029058
        run2_gate_and_controls_wrapper_wall_seconds: 0.028070
        total_wrapper_measured_wall_seconds_across_all_charged_runs: 0.057128
        run1_peak_rss_bytes: 62078976
        gate_phase_A_internal_wall_seconds: 0.000625
        gate_phase_B_internal_wall_seconds: 0.000580
        gate_phase_C_internal_wall_seconds: 0.000638
        k1_k2_6_controls_internal_wall_seconds: 0.025988
        k1_k2_6_mitm_chunk_evaluations: 128
        k1_k2_6_mitm_step_evaluations: 1024
        k1_k2_6_naive_pair_evaluations: 4096
      modeled_kept_separate:
        naive_all_pairs_cost_at_k1_k2_6: 4096 pair evaluations (arithmetic 2^(k1+k2), NOT a timed measurement)
        expected_raw_candidate_count: 1.00390625
        expected_non_planted_20bit_collisions: 0.00390625
      optimistic_assumptions_restated_next_to_the_numbers:
        - single-core, unoptimized CPython; no vectorization, no compiled inner loop
        - no memory-bandwidth accounting; the chunk1 table fits trivially in cache at every scale run here
        - no time-memory tradeoff exercised at this scale
        - 'the naive figure is a pair COUNT, not a timing; the two units are never mixed'
      prohibited_and_not_done: >-
        NO cost figure here or anywhere in this task projects toward the
        approximately 2^64-block instrument-class gap (IR-10, SC-3,
        DEC-20260821-1215e5 F-8). No BATCH-af29f6 or BATCH-1f30fe figure is
        extrapolated. Every BATCH-af29f6 raw metric referenced in this report
