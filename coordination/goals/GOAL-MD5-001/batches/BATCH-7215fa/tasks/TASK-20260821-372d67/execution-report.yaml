execution_report:
  # =====================================================================
  # THE GATE VERDICT, FIRST, BECAUSE IT IS THE POINT (SC-A).
  # =====================================================================
  gate_verdict_one_line: >-
    GATE-PO2 PASS (all nine pass-predicate clauses true) -- then a HARD STOP
    one phase later: CTL-PO5 part (b) FAILED with 8 raw pre-certificate
    candidates against a declared ceiling of 4, so NO declared-scale run, NO
    HEUR-H1 validation run and NO MD5 search arm were executed, and 900 s of
    run ceiling is UNSPENT.

  experiment_id: EXP-MDFIVE-a8e71e
  hypothesis_id: H-MDFIVE-0ca596
  task_id: TASK-20260821-372d67
  batch_id: BATCH-7215fa
  goal_id: GOAL-MD5-001
  approving_decision: DEC-20260821-333267
  contract_status_checked: approved, approved_by coordinator TASK-20260821-fad775
  gate_decision_checked: >-
    coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-fad775/gate-decision.yaml
    ledger_decision_to_be_filed.coordinator_decision.decision == approve.
    Execution therefore permitted.
  implementation_commit: 12b2abf661ac9061a0e5b6e8429b9895e6dbcd01
  implementation_commit_note: >-
    Both run manifests record commit 12b2abf661ac9061a0e5b6e8429b9895e6dbcd01
    with dirty: true. The dirt is exactly the two files this task wrote
    (harness/run_md4_ceiling_v2.py, tests/test_harness.py), both of which the
    wrapper pins by sha256 in manifest.run.code.source (all_pinned: true), so
    the executed source is bound by content hash and stays bound after the
    Coordinator's snapshot commit.
  claim_ceiling: analyzed
  requested_policy: executor-implementation
  resolved_model_id: claude-opus-5
  fallback_used: false
  degraded: false

  # =====================================================================
  # RUN ORDER, AS EXECUTED. Checkable from the artifacts alone.
  # =====================================================================
  run_order_as_executed:
    - '1. RUN-MDFIVE-b5-buildcheck (CTL-PO6 both primitives, CTL-PO7, CTL-PO9)'
    - >-
      2. RUN-MDFIVE-b5-gate_and_controls, whose internal phase_log records, in
      monotonic order: phase A (CTL-PO1 null control) -> phase B (MD4
      two-directional) -> phase C (MD5) -> GATE_VERDICT_RECORDED ->
      k1_k2_6_controls_md4. The gate verdict entry precedes the control phase
      entry in the log, so the ordering is mechanically checkable by joint V1
      from raw-result.json rather than from this narrative.
    - '3. NOTHING ELSE RAN. See runs.not_run below.'

  runs:
    completed:
      - run_id: RUN-MDFIVE-b5-buildcheck
        plan_item: 'run 1 (suffix buildcheck)'
        status: completed_valid
        wrapper_measured_wall_seconds: 0.029058
        timing_source: wrapper
        peak_rss_bytes: 62078976
        ceiling_seconds: 60
        certificate: {kind: none, note: 'pure correctness run; no solve claimed'}
        outcome: all correctness gates passed
        metrics:
          input_pins_ok: true
          CTL_PO7_rfc1320_all_ok: true
          CTL_PO7_md5_t16_all_ok: true
          CTL_PO6_h2_md4_all_ok: true
          CTL_PO6_h2_md5_all_ok: true
          CTL_PO9_all_ok: true
          all_gates_passed: true
        deviation_recorded_against_this_run: DEV-3 (see protocol_deviations)
      - run_id: RUN-MDFIVE-b5-gate_and_controls
        plan_item: 'run 2 (suffix gate_and_controls)'
        status: completed_valid
        wrapper_measured_wall_seconds: 0.028070
        timing_source: wrapper
        ceiling_seconds: 120
        certificate:
          kind: none
          note: >-
            No discrete-log solve and no factor-base relation is claimed. The
            instrument's own MITM candidates ARE independently re-verified
            inside the run by `verify_certificate`, which uses
            `_reference_registers` (a straight-line named-register 16-step
            forward pass) and never touches forward_step, backward_step,
            chunk1_observable, chunk2_observable or mitm_search. That
            re-verification is reported below; certificate.kind stays `none`
            because the run wrapper's certificate kinds do not cover this
            claim type, and this is stated explicitly rather than left blank.
        outcome: >-
          GATE PASS, then CTL-PO5 FAIL -- a hard stop under the contract's
          stopping_rules before any declared-scale run.
    not_run:
      - plan_item: 'run 3 (suffix primary-md4), ceiling 300 s'
        status: not_run
        reason: >-
          EXP-MDFIVE-a8e71e stopping_rules: "If CTL-PO4 or CTL-PO5 fails, the
          executor stops before any declared-scale run and reports." CTL-PO5
          part (b) failed. No run directory was created.
        ceiling_seconds_unspent: 300
      - plan_item: 'run 4 (suffix h1-md4), ceiling 300 s'
        status: not_run
        reason: same CTL-PO5 stop; HEUR-H1's first genuine test did NOT occur.
        ceiling_seconds_unspent: 300
      - plan_item: 'run 5 (suffix md5-conditional), ceiling 300 s'
        status: not_run
        reason: >-
          same CTL-PO5 stop. The MD5 search arm was authorized by
          md5_run_authorization but never became eligible, because its
          gate_condition chain runs through the declared-scale phase that did
          not happen. ZERO MD5 SEARCH COMPUTATION OCCURRED.
        ceiling_seconds_unspent: 300
    invalid: []
    failed: []
    superseded: []

  # =====================================================================
  # OBSERVATIONS -- measurements only. No interpretation, no verdict.
  # =====================================================================
  observations:

    - id: O-1
      what: 'GATE-PO2 phase A (CTL-PO1), the batch-4-slice DETECTOR NULL CONTROL, MD4'
      parameters: 'i_word=8, j_word=9, S=9, p=1, k1=k2=4, m=12, k=20, fixed_word_generation(20260821,(8,9),4), target seed 8975321'
      code_path: >-
        harness.run_md4_ceiling_v2.chunk1_observable and
        harness.run_md4_ceiling_v2.chunk2_observable -- the SAME two functions
        every other phase in this batch called; the only difference is the
        parameter tuple (A-6/PO-8).
      predicate_returned: FAIL
      required_outcome: FAIL
      distinct_fwd_32bit_at_the_four_held_fixed_values: [16, 16, 16, 16]
      distinct_fwd_12bit_at_the_four_held_fixed_values: [16, 16, 16, 16]
      distinct_bwd_32bit_at_the_four_held_fixed_values: [1, 1, 1, 1]
      distinct_bwd_12bit_at_the_four_held_fixed_values: [1, 1, 1, 1]
      distinct_fiber_sets: 1
      agreement_with_the_pre_run_derivation: >-
        The contract derived distinct_bwd = EXACTLY 1 and distinct_fwd = 16 in
        advance, twice independently (TASK-20260821-6b78d4,
        TASK-20260821-fad775). Both numbers are reproduced exactly. The
        detector can see a degeneracy that is already proved to exist; it did
