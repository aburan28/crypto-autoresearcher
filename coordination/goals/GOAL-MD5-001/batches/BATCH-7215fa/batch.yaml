hard_rules:
  - id: SC-1
    text: >-
      MD4 FIRST. No MD5 computation unless the frozen EXP-MDFIVE-a8e71e contract
      explicitly NAMES and IDENTICALLY BOUNDS an MD5 arm -- never larger than the
      MD4 arm, never "for completeness". Zero MD5 computation otherwise, stated
      explicitly in the execution report.
  - id: SC-2
    text: >-
      THE k1=k2=4 TWO-DIRECTIONAL DEPENDENCE GATE IS A HARD STOP, NOT A CHECK.
      Both directions run separately (vary free word A holding B fixed; vary B
      holding A fixed), on the SAME declared matching observable, through the
      SAME code path the declared-scale run uses, BEFORE any declared-scale run.
      A simultaneous both-words sweep does NOT discharge it -- it passes on a
      construction degenerate in one word. FAIL => STOP AND REPORT; no
      declared-scale run happens. Red-team D1; KN-TECH-bb7e9f.
  - id: SC-3
    text: >-
      DO NOT PROJECT INSTRUMENT-CLASS COST TOWARD THE ~2^64-BLOCK GAP from batch
      4's degenerate throughput figures (DEC-20260821-1215e5 F-8). Not from this
      batch's figures either without a separate dispatch.
  - id: SC-4
    text: >-
      ANOM-1 CAVEAT CARRIES FORWARD (F-4; EV-MDFIVE-ab007d O-7). Any record,
      report, or table in this batch citing RUN-MDFIVE-primary-md4-v2,
      RUN-MDFIVE-h1-md4 or RUN-MDFIVE-md5-conditional raw metrics must carry the
      ANOM-1 caveat (KN-TECH-bb7e9f) with it, or it is itself an overclaim.
  - id: SC-5
    text: >-
      IF harness/run_md4_ceiling.py IS TOUCHED, ADD A `caveat_refs` MANIFEST
      FIELD at that time (F-4; red-team required_controls D2). Equally for any
      new sibling module: its manifest output carries `caveat_refs` from the
      start. Already-committed run artifacts are NOT retrofitted -- immutable.
  - id: SC-6
    text: >-
      NO BATCH TASK READS THE QUARANTINED PAYLOAD
      (coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml,
      sha256 e44a3fed...). Hash-only gate access is the standing mechanic carried
      from BCP-1/BCP-2 through BATCH-1f30fe and BATCH-af29f6. Any CONSUMPTION
      finding is recorded invalid. Every task attests it never read it.
  - id: SC-7
    text: >-
      HALT AT EACH DECLARED CEILING TRUTHFULLY. A timeout, crash, ceiling halt,
      or implementation failure is INFRASTRUCTURE SIGNAL, never a negative
      mathematical result (AGENTS.md rule 5). A FAILED two-way-dependence gate is
      NOT in this category: it is a genuine derivable finding about the
      construction and is recorded as evidence.
  - id: SC-8
    text: >-
      NEVER AMAZON BEDROCK in any runtime, backend, endpoint, fallback, or probe
      (AGENTS.md rule 16). Record requested policy and resolved model in every
      report and manifest; never silently substitute.
  - id: SC-9
    text: >-
      NO SUCCESS CRITERION MOVES AFTER OUTCOMES ARE OBSERVED without a versioned
      protocol_amendment record. HEUR-H1's falsification_condition is inherited
      as frozen text; if the corrected instrument needs a different statement,
      that is a NEW numbered heuristic in the NEW hypothesis, declared before the
      run.
  - id: SC-10
    text: >-
      NEVER FABRICATE a command, output, timing, statistic, citation, or run.
      Missing data stays missing and is reported as such. Every citation carries
      provenance (recalled | retrieved | kb | internal); a `recalled` reference
      supports nothing.

