max_concurrent: 2
max_concurrent_basis: >-
  THE BINDING CONSTRAINT IS THE DEPENDENCY GRAPH, NOT THE HARDWARE. This machine
  has 14 cores, so hardware headroom is not what caps this number -- the producer
  chain 6b78d4 -> fad775 -> 372d67 -> e2ffe4 is STRICTLY SEQUENTIAL by
  dependency, and each stage's output is the next stage's only input: the gate
  cannot judge an idea that does not exist, the executor cannot run a contract
  that is not frozen, the snapshot cannot freeze bytes that are still being
  written. The ONLY genuinely concurrent pair is the two independent reviews
  (2de43d red team, 26ba34 validator), which must run concurrently AND
  sibling-blind so neither can read the other's report. max_concurrent 2 is
  therefore the exact width of this batch's widest stage. Setting it higher would
  buy nothing and would only create the opportunity to violate the sequencing --
  which is precisely the class of failure that CLAUDE.md's "generated artifacts /
  shared state" discipline exists to prevent, and which
  GOAL-AES-003 BATCH-002 (DEC-20260802-b226fb budget_accounting) recorded the
  cost of. The goal head's campaign max_concurrent 3 is a CEILING, not a target.

