        UNEXERCISED at this scale, which is honest; no distinguished-point or
        van-Oorschot-Wiener style interpolation is claimed, and none is needed
        because no large-scale claim is made.
      named_gap_3_an_unresolved_sweep_cell: >-
        One token hit at execution-report.yaml L351 falls inside the
        `observations` block, which is in my blind_from. I DID NOT READ IT. It is
        flagged here by line number for the Coordinator or the sibling reviewer
        to close. My sweep of that file is therefore complete except for that one
        cell, and I decline to close it rather than breach blindness. See
        procedure_deviations PD-3.

    - joint: >-
        R5 CLAIM-TIER CEILING AND SCOPE -- does anything in the package assert
        above `analyzed`, or generalise from this bounded Round-1 slice to the
        MITM method, to full MD4/MD5, or to the dependent goals?
      verdict: holds
      qualifier: holds_with_named_gaps
      worked_attack_output: |
        claim_ceiling declared and consistent: execution-report L31
        "claim_ceiling: analyzed"; IDEA L1090 "for this batch is `analyzed`,
        never `supported`"; H-MDFIVE-0ca596 L1030 same, citing
        DEC-20260821-84a8f1 and DEC-20260821-1215e5 F-5.
        Register-creep grep for "the MITM method against MD4/MD5", "breaks MD4/5",
        "attack on MD4/5", "preimage attack": every hit is a LITERATURE CITATION
        (Aoki-Sasaki FSE 2009; Zhong-Lai eprint 2010/583) or a WebSearch query
        string, never a claim in this record's own voice.
        H-MDFIVE-0ca596 L1054 states the instrument "makes no statement whatever
        about MD4's preimage resistance" -- the exact disclaimer R5 hunts for.
        Promotion gates are assessed DOWN, not up: L1040 records GATE 3 "NOT MET"
        and names the reason (degenerate throughput); L1042 records GATE 4 as
        planned, not met.
      the_creep_risk_did_not_materialise_because_the_result_did_not: >-
        P-R5 predicted the creep risk peaks when the instrument "finally does what
        it says". It did not get that far -- CTL-PO5(b) halted it -- so R5 held
        partly by circumstance. THIS IS NOT A CLEARED RISK. The moment a
        declared-scale run succeeds, R5's exposure returns undiminished.
      one_scope_item_to_tighten: >-
        The negative result now on record is a scoped, seed-specific,
        parameter-specific observation. It must not be written up as "the
        splice-and-cut Round-1 MITM is obstructed" or as a closure of the lane. My
        120-seed sweep shows 9 of 120 seeds PASS CTL-PO5(b) and 6 of 120 give a
        fully injective forward map, so a construction that clears the control
        demonstrably exists inside the current parameter family. A closure here
        would be premature in exactly the sense docs/inventor-protocol.md section 4
        names, and I flag it before anyone writes it.

