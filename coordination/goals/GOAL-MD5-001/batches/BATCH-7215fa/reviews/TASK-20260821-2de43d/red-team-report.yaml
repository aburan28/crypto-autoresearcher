  # ===================================================================
  is_CTL_PO5_b_a_finding_about_R1_SEP10_about_GATE_PO2_or_about_the_ceiling:
    answer: >-
      ABOUT ALL THREE, AND THE RECORD'S CLASSIFICATION IS TOO NARROW. Taking them
      in order of how much of the gap each explains:
    1_about_the_construction_yes_and_structurally: >-
      NOT a seed accident. 111 of 120 fixed-word seeds exceed the ceiling, and
      seed 20260821 (raw = 8) is among the MILDEST -- the median is 32 and the
      maximum 928. R1-SEP10 at (2, 12, S=8, p=3, k=6, m=12, k=20) fails
      CTL-PO5(b) for the overwhelming majority of fixed-word draws. The negative
      observation is real and it is a fact about the construction.
    2_about_the_gate_yes_and_this_is_the_sharpest_part: >-
      GATE-PO2 MEASURED THE CAUSE AND RECORDED A PASS. Its own pre-registered
      predicted values are distinct_fwd = 16 and distinct_bwd = 16 "with 15
      acceptable"; the observed values were 9 and 4 (and 33/64, 6/64 at the
      control scale). Its criterion is `>= 2`. Had the contract's PREDICTION been
      its CRITERION, the gate would have failed at phase B -- one second of
      compute, before CTL-PO4, CTL-PO5, CTL-OBS and CTL-H1B ran at all. The
      contract wrote down the right quantity as a prediction and the wrong
      quantity as a threshold, and the whole downstream cost is the difference.
    3_about_the_ceiling_yes_but_it_is_the_model_not_the_number: >-
      Four is a defensible ceiling for the quantity the model describes. The model
      is refuted: it assumes near-injective per-side maps, and measured
      injectivity is 33/64 forward and 24/64 backward. THE CEILING IS NOT THE
      WRONG QUANTITY -- the raw candidate count is exactly the right thing to
      bound -- BUT ITS CALIBRATION IS FABRICATED BY A MODEL THE OBJECT VIOLATES.
      Evidence that this is a model failure and not an MD4 failure: MD5, whose
      forward map is fully injective at all 120 seeds, STILL exceeds the ceiling
      at 59 of 120 seeds. So even removing the F-multiplexer collapse entirely,
      the ceiling of 4 is wrong roughly half the time.
    what_it_is_NOT_about: >-
      IT IS NOT AN IMPLEMENTATION ERROR, and I confirm the executor's
      classification as `negative_observation` from my own code. My independent
      implementation, written from RFC 1320 and the contract text without opening
      harness/run_md4_ceiling_v2.py, reproduces the reported figures EXACTLY: 8
      raw candidates, all sharing one 20-bit value, 1 of 8 certificate-verified,
      33/64 and 6/64 at k=6, 9/16 and 4/16 at k=4. Two independent
      implementations agreeing to the integer is evidence about the quantity, and
      it localises nothing to either implementation. THE STOP WAS CORRECT AND THE
      CLASSIFICATION WAS CORRECT.

  # ===================================================================
  cheapest_falsification_control:
    the_cheapest_way_to_have_caught_CTL_PO5_b_earlier: >-
      IT WAS ALREADY COMPUTED AND ALREADY RECORDED. GATE-PO2 phase B reports
      distinct_fwd_12bit = 4 against a pre-registered prediction of 16. Comparing
      the gate's own reported integer to the gate's own pre-registered predicted
      integer -- a single comparison over numbers already in hand, ZERO
      additional compute -- fails the construction at phase B. Everything from
      CTL-PO4 onward was spent re-discovering a number already on the page. THE
      CHEAPEST CONTROL IS TO MAKE THE PRE-REGISTERED PREDICTION A CRITERION, or
      at minimum to require an explicit adjudication whenever an observation
      departs from a pre-registered prediction by more than a declared tolerance.
    the_cheapest_way_to_discover_the_ceiling_of_4_is_the_wrong_quantity: >-
      RE-RUN THE PER-SIDE DISTINCT COUNTS OVER ~100 FIXED-WORD SEEDS. Cost: a few
      seconds; I ran 120 seeds for both primitives inside this review's budget.
      It answers, in one measurement, the question the frozen contract explicitly
      declines to answer ("the gate is not quantified over fixed-word seeds") and
      it separates the three hypotheses -- seed lottery, construction defect,
      model defect -- that CTL-PO5(b) alone cannot separate.
    the_null_object_control_the_program_requires: >-
      Replace MD4's F with a same-shape, same-arity non-multiplexer mixer and
      repeat the identical measurement. Result: 64/64 and 64/64 versus MD4's
      33/64 and 6/64. This is the control that turns "the observable collapsed"
      from an artifact report into a statement about MD4's F, and it costs one
      function substitution.
    what_the_reported_quantity_should_have_done: >-
      distinct_fwd should INCREASE toward 2^k1 as k1 increases if the observable
      is non-degenerate: the parameter that is supposed to destroy a collapse is
      the sweep width. It does not. From k1=4 to k1=6 the free-word space
      quadruples (16 -> 64) while distinct_fwd_12bit goes 4 -> 6, a factor of
      1.5. Nominal resolution 25 percent -> 9 percent. A quantity that fails to
      grow when its own sweep width grows is the artifact tell of
      docs/inventor-protocol.md section 3, and it was visible in data the batch
      already had at two scales.

  # ===================================================================
  objections:
    - id: OBJ-1
      severity: high
      joint: R2
      objection: >-
        The proof_search_map names GATE-PO2 as the discharge of the
        near-injectivity assumption underlying audit 2's expected count and
        CTL-PO5(b)'s ceiling. GATE-PO2's criterion tests non-constancy, not
        near-injectivity, and cannot discharge it. The batch's own CTL-PO5(b)
        failure is the counterexample: the gate passed and the assumption was
        false at the moment it passed.
    - id: OBJ-2
      severity: high
      joint: R1
      objection: >-
        R1-SEP10's two-way dependence is a full-word algebraic property, and the
        instrument operates on a 12-bit window of a 6-bit sweep. At that
        resolution dependence is seed-contingent: distinct_fwd_12bit reaches 1
        (full ANOM-1) at some fixed-word seeds. The construction does not cure
        ANOM-1; it avoids it at seed 20260821. Nothing in the package states this,
        and the taint calculus as written cannot detect it.
    - id: OBJ-3
      severity: medium
      joint: R2
      objection: >-
        The frozen falsification condition diagnoses a CTL-PO5(b) failure as "a
        degenerate word channel survived the gate". No channel is degenerate; both
        are lossy. Any successor experiment that acts on the frozen diagnosis will
        look for the wrong defect.
    - id: OBJ-4
      severity: medium
      joint: R2
      objection: >-
        The dominated_by row-1 ruling distinguishes R1-SEP10 from the strictly
        dominating rival by saying the rival's "match condition factorizes".
        R1-SEP10's match condition factorizes identically -- that is what makes it
        a MITM. The ruling proves too much against its own object. The correct
        discriminator is that neither of R1-SEP10's factors is constant.
    - id: OBJ-5
      severity: medium
      joint: R4
      objection: >-
        CTL-PO5(b)'s ceiling of 4 is an unlabeled modeled quantity operating as a
        hard stopping threshold, inside a package that labels every speed ratio
        "MODELED, NOT MEASURED". The measured/modeled discipline was applied to the
        claims and not to the controls. Measured distribution over 120 seeds:
        median 32, max 928, 92 percent exceedance, zero seeds at the modeled value.
    - id: OBJ-6
      severity: low
      joint: R1
      objection: >-
        `distinct_fiber_sets >= 2` is presented as "the operational signature of
        ANOM-1" and as catching what "per-side counts alone do not catch". It
        accepts both mirror-image degenerate objects I built (fibers=2 on M and
        M'); the per-side counts are what reject them. The criterion's stated role
        is inverted relative to its measured power.
    - id: OBJ-7
      severity: low
      joint: R1
      objection: >-
        No record states that at separation 10 all four boundary components are
        jointly dependent, hence that the component index p = 3 is not
        load-bearing and GATE-PO2 has no discriminating power over it. The design
        is presented as a two-part correction (separation AND component) when only
        the separation does work.

  required_controls:
    - id: RC-1
      priority: 1
      control: >-
        SEED-QUANTIFICATION SWEEP. Re-run distinct_fwd/distinct_bwd at 32-bit and
        12-bit, and the CTL-PO5 raw candidate count, over >= 100 fixed-word seeds
        for MD4 and MD5, and report the DISTRIBUTION rather than the point value.
        Cost: seconds. This is the control that separates seed lottery from
        construction defect from model defect, and the frozen contract explicitly
        declines to run it.
    - id: RC-2
      priority: 1
      control: >-
        MAKE THE PRE-REGISTERED PREDICTION ADJUDICABLE. Any future gate must
        require an explicit recorded adjudication whenever an observed integer
        departs from its own pre-registered predicted integer beyond a declared
        tolerance, even when the pass criterion is met. Zero compute cost; would
        have halted this batch at phase B.
    - id: RC-3
      priority: 2
      control: >-
        INJECTIVITY CRITERION. Replace or supplement `distinct >= 2` with
        `distinct >= (1 - eps) * 2^k` for a declared eps, at BOTH 32-bit and
        window resolution. Non-constancy is not the property the downstream
        arithmetic needs.
    - id: RC-4
      priority: 2
      control: >-
        F-MASK PRECOMPUTATION AS A DESIGN FILTER. Before running any gate, compute
        (y XOR z) at each F application on the path from the free word to the
        declared component and check that the free word's varying bits survive the
        multiplexer mask. This is a static, pre-run, sub-millisecond check that
        predicts the collapse without any search, and it generalises to any
        MD4-family construction.
    - id: RC-5
      priority: 3
      control: >-
        NULL-OBJECT CONTROL AS STANDARD. Repeat every distinct-count measurement
        with F replaced by a non-multiplexer mixer of the same shape. A measurement
        that does not move under that substitution is not measuring the
        construction.

  counterexample_or_mutation:
    cheapest_discriminating_mutation: >-
      HOLD EVERYTHING FIXED AND VARY ONLY THE FIXED-WORD SEED. Same construction,
      same separation, same component, same k1/k2/m/k, same target seeds; change
      20260821 to 20260822 and onward. distinct_fwd_12bit ranges over 1..32 and
      the CTL-PO5 raw count over 2..928 across 120 such draws. A conclusion that
      moves by two orders of magnitude under a mutation the contract treats as
      irrelevant is scoped to the seed until proven otherwise.
    the_counterexample_to_the_records_own_sufficiency_argument: >-
      The gate's CORR-A ruling verified the load-bearing property directly --
      "word2 enters all three of v5, v4, v3". THE PROPERTY IS TRUE AND THE
      OBSERVABLE STILL COLLAPSES TO 6/64. Entering all three arguments of F does
      not imply the variation survives F, because F is a multiplexer that is
      constant in its x argument wherever y and z agree. So CORR-A's substitute
      verification is not a substitute: it establishes a necessary condition and
      is invoked as if it were sufficient.

  baseline_comparison:
    against_the_records_own_naive_baseline: >-
      2^(k1+k2) x 16 = 2^24 step-evaluations all-pairs, vs a modeled ~2^10.5
      (~1490x) reduction in step-evaluations and 512x in chunk-evaluations,
      correctly labeled MODELED and correctly scoped to these parameters. I do not
      dispute the arithmetic and no declared-scale measurement exists to check it
      against, because the run did not happen.
    against_the_strictly_dominating_rival_the_record_itself_names: >-
      dominated_by row 1 concedes ~2^k1 time at O(1) memory versus R1-SEP10's
      2^k1 + 2^k2 time at 2^k1 memory on the pure two-word recovery task. THE
      CONCESSION IS CORRECT AND THE RULING'S REASON IS NOT (OBJ-4). On the
      Pareto axes: time, R1-SEP10 loses; memory, R1-SEP10 loses (2^k1 vs O(1));
      data/queries, tie. `dominated_by` is therefore correctly non-null, which is
      what AGENTS rule 5 requires, and I confirm the concession was made against
      every axis and not just the headline. The eliminated-dimension check
      (KN-LIT-7593) does not bite here: R1-SEP10 eliminates no search dimension by
      invariance or precomputation, so there is no uncharged invariant cost.
    against_pollard_rho_bsgs_and_the_closest_specialized_baseline: >-
      NOT APPLICABLE AND CORRECTLY SO. This is a hash-preimage MITM object, not a
      discrete-log object; rho and BSGS are not the relevant frontier. The closest
      specialized baselines are Aoki-Sasaki FSE 2009 and Zhong-Lai eprint 2010/583,
      and the package declares sota_delta = ZERO against them explicitly, with
      2^96 / 2^102 / 2^116.9 / 2^123.4 marked UNVERIFIED at every occurrence. No
      comparison is claimed and none is owed.

  heuristic_challenges:
    - id: HC-1
      heuristic: "HEUR-H1 (Poisson(2^(k1+k2-m)) matching-window collisions)"
      challenge: >-
        UNTESTED THIS BATCH -- the H1 run did not execute, and the package says so
        plainly. But my measurement predicts H1 WILL FAIL AT THESE PARAMETERS for a
        reason unrelated to H1's own content: with distinct_fwd_12bit = 6 of 64,
        the matching-window collision count cannot be Poisson(256), because the
        forward side supplies only 6 distinct window values. Whoever runs H1 next
        on this construction will measure instrument degeneracy and must not read
        it as an H1 falsification -- which is EXACTLY the classification the frozen
        contract pre-registered ("variance below 64 is INSTRUMENT DEGENERACY and a
        STOP, explicitly NOT an H1 falsification"). That pre-registration was
        correct and is about to earn its keep.
    - id: HC-2
      heuristic: "the uniformity premise behind audit 2 and CTL-PO5(b)"
      challenge: >-
        NOT NUMBERED, NOT NAMED AS A HEURISTIC, AND LOAD-BEARING IN TWO PLACES.
        "The 20-bit observable is uniform over the (wA, wB) grid" is stated only as
        arithmetic (2^(k1+k2-k) = 1; 1 + 4096/2^20). It is the assumption that
        fails, and because it was never numbered as a heuristic it was never
        subjected to the random-model-transfer scrutiny the program requires. A
        minimal-degree isogeny is not a uniform integer, and a 20-bit projection of
        an MD4 Round-1 register reached through three multiplexer layers is not a
        uniform 20-bit value. Number it, state it, and test it.
    - id: HC-3
      heuristic: "HEUR-H2 (exact invertibility)"
      challenge: >-
        NO OBJECTION. I re-established it independently: my own inverse step
        inverts my own forward step exactly on 500 random tuples for both md4 and
        md5, and my forward chain reproduces all five RFC 1320 Appendix A.5 test
        vectors. The contract's demand that new code inherit nothing is correct and
        I complied with it myself.

  cost_model_challenges:
    - id: CMC-1
      challenge: >-
        The ceiling of 4 is a modeled figure presented as a threshold, unlabeled.
        See OBJ-5 and RC-1. Total expected cost was not confused with per-attempt
        cost anywhere I checked, and no success probability was silently set to 1.
    - id: CMC-2
      challenge: >-
        Memory is declared (2^k1 entries) and the time-memory tradeoff is declared
        UNEXERCISED at this scale. That is honest at toy scale but it means the
        record contains NO memory-scaling model at all, so no future record may
        derive one from it. Worth stating explicitly in interpretation_limits, as
        the absence is currently implicit.
    - id: CMC-3
      challenge: >-
        The record correctly charges the depth/speed tradeoff against itself
        ("Increasing the separation to get more F-depth INCREASES per-candidate
        cost"). My threshold result quantifies the floor it did not have: separation
        must be >= 4 for ANY jointly-dependent component to exist, so the minimum
        per-candidate cost of a non-degenerate construction in this family is fixed
        by the calculus, not chosen. That is a positive, usable consequence.

  reduction_and_scope_challenges:
    - id: RSC-1
      challenge: >-
        No cited reduction carries a corollary in this package -- there is no
        OneEnd-to-EndRing-shaped chain to instantiate. The literature citations
        (Aoki-Sasaki, Zhong-Lai) are context, not load-bearing steps, and are
        marked UNVERIFIED provenance where figures are quoted. Nothing to break.
    - id: RSC-2
      challenge: >-
        SCOPE IS NOT INFLATED. The affected/safe framing does not appear at all,
        which is correct: no scheme is claimed affected. The dependent goals
        (GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001,
        GOAL-SIMSPK-001) are not licensed to cite anything beyond KN-TECH-bb7e9f
        anywhere in my read scope.
    - id: RSC-3
      challenge: >-
        THE CLOSURE RISK IS THE LIVE ONE, AND IT IS AHEAD OF US NOT BEHIND US. A
        CTL-PO5(b) failure is a negative result, and a negative result is a claim
        carrying the same burden. It has a named obstruction (raw candidate
        inflation), an argument (fiber multiplicity 4 x 2), and it must also carry
        forward guidance naming what remains open. What remains open is concrete
        and I measured it: 9 of 120 fixed-word seeds PASS CTL-PO5(b) and 6 of 120
        give a fully injective forward map. A construction clearing this control
        demonstrably exists inside the current parameter family. Writing this up as
        "the Round-1 splice-and-cut lane is obstructed" would be a fatigue report
        about one seed wearing the number 8.

  proof_architecture_challenges:
    - id: PAC-1
      attack: observation-fiber
      finding: >-
        RUN AND SUCCESSFUL. Holding the declared observable fixed at 0xa5662 and
        varying the underlying object yields EIGHT preimages, of which ONE
        reproduces Y and SEVEN do not. The observable does not separate the
        conclusion from its negation. THE MISSING SEPARATOR IS NAMED: injectivity
        of the per-side maps, which the gate does not test.
    - id: PAC-2
      attack: quantifier-order
      finding: >-
        BREAKS ON THE FIXED-WORD SEED. The claim is asserted as "for the
        construction, for all free-word values", but the fixed words are chosen by
        ONE seed before the sweep, so the true quantifier is "there exists a
        fixed-word seed such that for all free-word values". The record discloses
        this honestly (CLAIM 3) and then reasons as if the stronger form held. My
        120-seed sweep is the measurement that separates them, and the two forms
        differ by two orders of magnitude in the reported quantity.
    - id: PAC-3
      attack: boundary-and-strictness
      finding: >-
        The old method IS genuinely embedded as the stated boundary: CTL-PO1 runs
        the batch-4 slice through the same code path and correctly fails it. I
        verified this from my own implementation. Strictness holds in the
        dependence sense (batch 4: d_b32 = 1; R1-SEP10: d_b32 = 9) and FAILS in the
        cost sense against the record's own dominated_by row 1.
    - id: PAC-4
      attack: method-ceiling
      finding: >-
        The ceiling the resource measure can support is exactly what the record
        claims and no more: (2^k1 + 2^k2) chunk evaluations over a 2^(k1+k2)
        space at these parameters, with sota_delta ZERO against the full
        primitive. The headline does not exceed the ceiling. NO OBJECTION.
    - id: PAC-5
      attack: nearby-object
      finding: >-
        MD5 IS THE NEARBY OBJECT AND IT SEPARATES CLEANLY, which is a point in the
        construction's favour and a point against the gate. MD5 passes GATE-PO2
        with 16/16 and 16/11 where MD4 gives 9/4, and MD5's forward map is
        injective at all 120 seeds where MD4's is injective at 6. The gate cannot
        distinguish these two situations because both clear `>= 2`.
    - id: PAC-6
      attack: compositional-invariant
      finding: >-
        Deleting the split-point-independence component of the invariant changes
        nothing -- d + r = j - i - 1 is a consequence, not an input, and the
        conclusion survives its removal. The load-bearing component is the
        SEPARATION THRESHOLD alone. The strengthened invariant does NOT imply the
        final target: joint full-word dependence is proved, and windowed
        distinguishability is what the instrument needs. That gap is the whole of
        OBJ-2.

