  proves_too_much:
    method: >-
      The batch's own gate predicate, re-implemented by me from the contract
      text, run UNCHANGED against objects whose verdict is known false. Objects M
      and N were constructed from MY OWN taint calculus rather than copied from
      the plan, so their known-falseness is derived and not assumed.
    results:
      - object: OBJECT M (mirror-image degenerate -- observable forward-clean, backward-tainted)
        construction_i_derived: >-
          d = 0 gives E_0 = {1}, so component 0 is forward-clean; r = 9 gives
          D_9 = all, so component 0 is backward-tainted. Parameters (i=2, j=12,
          S=3, p=0), md4, k1=k2=4.
        known_false_verdict: the gate MUST FAIL it in the FORWARD direction
        observed: "d_f32=1 d_f12=1 | d_b32=16 d_b12=11 | fibers=2 -> dirA=FAIL, GATE FAIL"
        result: CORRECTLY REJECTED
      - object: OBJECT M' (the literal P-R1 repair -- batch-4 slice with p=0 instead of p=1)
        known_false_verdict: the gate MUST FAIL it in the FORWARD direction
        observed: "d_f32=1 d_f12=1 | d_b32=16 d_b12=16 | fibers=2 -> dirA=FAIL, GATE FAIL"
        result: CORRECTLY REJECTED
      - object: OBJECT N (pure pass-through of BOTH chunks)
        construction_i_derived: >-
          complement of E_0 union D_0 is {2,3}; parameters (8,9,S=9,p=2) and
          (8,9,S=9,p=3), md4, k1=k2=4.
        known_false_verdict: the gate MUST FAIL it in BOTH directions
        observed: "both p=2 and p=3: d_f32=1 d_f12=1 | d_b32=1 d_b12=1 | fibers=1 -> dirA=FAIL dirB=FAIL joint=FAIL"
        result: CORRECTLY REJECTED, and no saturated solution set was reportable as a speedup
      - object: OBJECT O (gap-closing projection)
        known_false_verdict: INVALID per DEC-20260821-1215e5 F-8 and SC-3 regardless of arithmetic
        method: exhaustive token sweep, R4 sweep ii above
        result: NO SUCH ROW EXISTS in any record in my read_scope. Every ~2^64 occurrence is a prohibition. CORRECTLY ABSENT.
      - object: OBJECT P (uncaveated raw-metric citation)
        known_false_verdict: overclaim per DEC-20260821-1215e5 F-4 and EV-MDFIVE-ab007d O-7
        method: exhaustive token sweep, R4 sweep i above
        result: NO UNCAVEATED CITATION FOUND across 19 hits in four records. CORRECTLY ABSENT.
    the_gate_can_fail_and_is_shown_to: >-
      Four distinct known-false objects, four correct rejections, plus the
      contract's own CTL-PO1 which I reproduced. "A gate that has never been shown
      able to FAIL has not been shown to work" is discharged for the
      NON-CONSTANCY failure mode.
    but_one_criterion_proves_too_much_and_this_is_a_finding: >-
      `distinct_fiber_sets >= 2` ACCEPTS OBJECT M AND OBJECT M' -- both scored
      fibers=2. The contract calls the joint-fiber count "the operational
      signature of ANOM-1" and says "Per-side counts alone do not catch it". THE
      REVERSE IS TRUE HERE: the fiber criterion alone does not catch a
      mirror-image degenerate, and it is the per-side counts that reject M and
      M'. The joint-fiber criterion detects only the fully-constant fiber map. It
      carries far less of the non-degeneracy load than the contract assigns it,
      and no record says so.

