  narrowest_supported_statement: >-
    ON MY JOINTS ONLY, and scoped to what was actually run. For MD4's Round 1 with
    fixed words from fixed_word_generation(20260821, (2,12), k), free words 2 and
    12, split point S = 8, boundary component p = 3 (the register produced at
    step 6), m = 12 and k = 20: the declared matching observable DOES depend on
    both free words at k1 = k2 = 4 and k1 = k2 = 6 -- ANOM-1 is not relocated, and
    this is confirmed by an implementation independent of the producer's. At
    k1 = k2 = 6 and target seed 8975323 the raw pre-certificate candidate set has
    EXACTLY 8 members, all sharing the single 20-bit value 0xa5662, of which
    exactly one -- (wA, wB) = (47, 32) -- is certificate-verified; the count 8 is
    the product of measured fiber multiplicities 4 (forward) and 2 (backward), not
    a coincidence of independent 2^-20 events. This exceeds CTL-PO5's declared
    ceiling of 4 and the stop is correct. THE CAUSE IS THAT MD4'S F IS A BITWISE
    MULTIPLEXER, CONSTANT IN ITS FIRST ARGUMENT WHEREVER THE OTHER TWO AGREE,
    which annihilates the free word's varying bits at the F applications on the
    path to v6; a same-shape non-multiplexer null restores full 64/64 resolution,
    and MD5 -- whose step adds the varying register outside F -- shows no collapse
    at any of 120 seeds. NOTHING HERE TRANSFERS to other fixed-word seeds without
    RC-1, to other separations or components, to full 48-step MD4 or 64-step MD5,
    or to any statement about MD4's preimage resistance. The result is
    `negative_observation`, correctly classified, and it is NOT a closure of the
    Round-1 splice-and-cut lane: 9 of 120 fixed-word seeds pass CTL-PO5(b) and 6
    of 120 give a fully injective forward map, so a passing construction
    demonstrably exists inside the current parameter family.

  next_concrete_action: >-
    RUN RC-1 -- the fixed-word-seed sweep -- as the first phase of the successor
    experiment, BEFORE any redesign of the construction. It costs seconds, it
