  # ===================================================================
  # BLIND RE-DERIVATION  (completed and written down BEFORE any read of the
  # execution report, the idea record, the gate decision, or the module)
  # ===================================================================
  blind_rederivation:
    quantity: >-
      THE TWO-WAY DEPENDENCE PREDICATE -- does the declared matching observable
      take more than one value as free word A varies with B held fixed, AND as
      free word B varies with A held fixed?
    derived_from: >-
      RFC 1320 section 3.4 Round 1 (the [abcd k s] step table and F(x,y,z) =
      XY v not(X)Z) plus EXP-MDFIVE-a8e71e's declared parameters. My own
      minimal implementation, my own variable naming, written before opening any
      producer artifact.
    ordering_attestation: >-
      TRUE. The re-derivation, its symbolic taint calculus, its empirical
      differential confirmation, and the split-point-independence table were all
      produced and written down BEFORE the task card, the handoff, the review
      plan, the frozen contract, the idea record, the gate decision, or any run
      artifact was opened. The first four tool calls of this session were: (1)
      read agents/red-team.md; (2) write and run my own RFC-1320 Round-1
      implementation; (3) derive and empirically confirm the taint sets; only
      then (4) open the task card.

    step_1_normalisation_i_derived:
      statement: >-
        MD4 Round 1's sixteen steps collapse to ONE uniform rolling-tuple rule.
        With T = (T0,T1,T2,T3): newA = rotl(T0 + F(T1,T2,T3) + X[t], s_t), then
        T' = (T3, newA, T1, T2), with s_t = (3,7,11,19)[t mod 4] and X[t]
        consumed at 0-indexed step t.
      verification: >-
        I checked this rolling rule against a LITERAL transcription of RFC
        1320's [ABCD 0 3][DABC 1 7][CDAB 2 11][BCDA 3 19] ... table on 2000
        random (IV, message) pairs. Output: "rolling-rule == RFC1320 literal
        Round 1 : True". I additionally reproduced all five RFC 1320 Appendix
        A.5 MD4 test vectors through a full three-round implementation built on
        the same step function ("PO7-analogue RFC1320 A.5 vectors: True"), and
        confirmed my inverse step inverts my forward step on 500 random tuples
        for BOTH md4 and md5 ("PO6-analogue: bwd inverts fwd for md4 and md5 :
        OK").
      consequence_i_derived: >-
        In state_{t+1}, tuple position 1 holds v_t, position 2 holds v_{t-1},
        position 3 holds v_{t-2}, position 0 holds v_{t-3}. Hence the contract's
        "boundary component p = 3 of state8" IS the register produced at
        1-indexed step 6 (0-indexed step 5). CTL-PO9's component identity is
        therefore correct as specified, derived independently.

    step_2_forward_dependence_sets:
      derived: "E_0 = {1}, E_1 = {1,2}, E_2 = {1,2,3}, E_d = {0,1,2,3} for all d >= 3"
      meaning: "E_d = tuple positions of state_{i+1+d} that depend on the word consumed at step i"
      empirical_confirmation: >-
        Differential probe, 4000 random trials, single-bit flip in X[i] at a
        random i, union of changed positions per distance: d=0 -> [1], d=1 ->
        [1,2], d=2 -> [1,2,3], d=3..6 -> [0,1,2,3]. MATCH=True at every d.
    step_3_backward_dependence_sets:
      derived: "D_0 = {0}, D_1 = {0,3}, D_2 = {0,2,3}, D_r = {0,1,2,3} for all r >= 3"
      meaning: "D_r = tuple positions of state_{j-r} that depend on the word consumed at step j"
      empirical_confirmation: >-
        Same protocol against my inverse step, 4000 trials: r=0 -> [0], r=1 ->
        [0,3], r=2 -> [0,2,3], r=3..6 -> [0,1,2,3]. MATCH=True at every r.
    step_4_split_point_independence:
      derived: >-
        With the forward free word at step i, the backward free word at step j,
        and split point S: d = S - i - 1 and r = j - S, so d + r = j - i - 1,
        INDEPENDENT OF S. Confirmed by exhaustive enumeration over every legal S
        for j-i = 1..8: "d+r constant=True" at every separation.
    step_5_the_intersection_threshold:
      derived: >-
        E_d cap D_r is nonempty for EVERY legal split S iff j - i >= 4, and
        empty for every legal split iff j - i <= 3. Exhaustively enumerated:
        "intersect-nonempty uniform over S=True" at every separation, with value
        False for j-i in {1,2,3} and True for j-i >= 4.
    agreement_with_the_records_claim: >-
      FULL AGREEMENT on all four facts (E-sets, D-sets, d+r = j-i-1 independent
      of S, and the j-i >= 4 intersection threshold). Two producers and this
      blind re-derivation now concur, and mine is the only one derived from RFC
      1320 rather than from an implementation.

    a_fact_the_stated_claim_omits_and_that_i_found_independently:
      the_second_threshold: >-
        THE UNION CROSSES ITS THRESHOLD ONE STEP EARLIER THAN THE INTERSECTION.
        E_d union D_r equals ALL FOUR positions already at j - i = 3, while the
        intersection only becomes nonempty at j - i = 4. So the design space has
        THREE regimes, not two: (i) j-i <= 2, some component is clean of BOTH
        free words; (ii) j-i = 3, every component is tainted by EXACTLY ONE free
        word -- no jointly-dependent component AND no clean component exists;
        (iii) j-i >= 4, jointly-dependent components exist. Regime (ii) is
        invisible in the claim as stated and is the sharpest possible
        counterexample to "disjointness is the only obstruction".
      why_it_matters_here: >-
        At j - i = 10 with S = 8 we have d = 5 and r = 4, so E_5 = D_4 =
        {0,1,2,3} and ALL FOUR components are jointly dependent. The choice of
        component p = 3 (v6) is therefore NOT LOAD-BEARING at this separation --
        any of the four would pass GATE-PO2 identically. The correction that did
        the work is the SEPARATION, not the component index, and no record I read
        says so. Corollary, and it is a real limit on the gate: at separation 10
        GATE-PO2 has NO discriminating power over the component choice at all;
        it can only discriminate the separation.

  # ===================================================================
  per_joint_verdicts:

    - joint: >-
        R1 CONSTRUCTION ADEQUACY -- does the NAMED corrected construction
        genuinely make the declared matching observable depend on BOTH free
        words, or does it merely relocate ANOM-1 onto the other word?
      verdict: holds
      qualifier: holds_with_named_gaps
      answer_to_the_literal_question: >-
        IT GENUINELY DEPENDS ON BOTH FREE WORDS. ANOM-1 IS NOT RELOCATED. I
        confirm this from my own implementation, not from the record.
      worked_attack_output: |
        My own re-run of GATE-PO2 at k1=k2=4, m=12, from the contract text
        (fixed_word_generation(20260821,(2,12),4); targets 8975321/8975322/8975328):
          phase A  CTL-PO1 batch-4 slice null (8,9,S=9,p=1) md4:
             d_f32=16 d_f12=16 | d_b32=1 d_b12=1 | fibers=1  -> FAIL, as required
          phase B  R1-SEP10 (2,12,S=8,p=3) md4:
             d_f32= 9 d_f12= 4 | d_b32=9 d_b12=9 | fibers=2  -> both directions >= 2
          phase C  R1-SEP10 (2,12,S=8,p=3) md5:
             d_f32=16 d_f12=16 | d_b32=16 d_b12=11 | fibers=2 -> both directions >= 2
        MIRROR-IMAGE NULL (the plan's required control), built from my own
        calculus rather than from the record:
          OBJECT M' (8,9,S=9,p=0): d_f32=1 d_f12=1 | d_b32=16 d_b12=16 -> GATE FAIL
        POSITIVE CONTROL: the apparatus discriminates in the other direction in
        every one of these rows (d_f32=16 on the batch-4 slice, d_b32=16 on M'),
        so a uniformly non-discriminating apparatus cannot be masquerading.
        FULL 32-BIT RANGE sampled as the plan requires, not just the 12-bit window.
      named_gap_1_the_dependence_is_real_but_massively_lossy: >-
        distinct_fwd_32bit = 9 of 16 and distinct_fwd_12bit = 4 of 16 at k=4;
        33 of 64 and 6 of 64 at k=6. The contract's OWN pre-registered
        prediction, recorded before any run, is 16 (and 64), "with 15
        acceptable". The observed forward observable retains 6/64 = 9 percent of
        its nominal resolution. GATE-PO2 recorded PASS because its criterion is
        `>= 2`. A pre-registered prediction violated by a factor of ten and
        recorded as a pass is a criterion/prediction mismatch, and it is the
        proximate cause of everything that follows.
      named_gap_2_the_repair_is_not_robust_and_is_not_quantified_over_the_seed: >-
        THIS IS THE CONTROL NOBODY RAN AND IT IS CHEAP. The frozen contract
        states plainly that the gate is NOT quantified over fixed-word seeds
        (H-MDFIVE-0ca596 quantifier_order, CLAIM 3). I quantified it: 120
        consecutive fixed-word seeds at k1=k2=6, R1-SEP10 parameters, MD4.
          distinct_fwd_32bit : min=5  max=64 mean=35.9   (prediction: 64)
          distinct_fwd_12bit : min=1  max=32 mean=7.0
          distinct_bwd_32bit : min=4  max=64 mean=22.2
          fully injective forward map: 6 of 120 seeds
        distinct_fwd_12bit MIN = 1. There exist fixed-word seeds at separation
        10 for which the declared 12-bit matching observable is CONSTANT in the
        forward free word -- i.e. FULL ANOM-1 RECURS ON THE CORRECTED
        CONSTRUCTION. R1-SEP10 does not cure ANOM-1; it avoids it AT ONE SEED.
        The taint calculus is true and is a FULL-WORD, ALGEBRAIC statement; the
        instrument operates on a 12-bit window of a 6-bit sweep, and at that
        resolution dependence is seed-contingent.
      mechanism_i_isolated: >-
        MD4's F(x,y,z) = (x AND y) OR (NOT x AND z) IS A BITWISE MULTIPLEXER: bit
        i of F is y_i if x_i = 1 else z_i, so F IS CONSTANT IN x AT EVERY BIT
        WHERE y_i = z_i. Tracing the forward chain at seed 20260821 with wA=0 vs
        wA=1, the varying bits of F's x-argument and the mask (y XOR z) of bits F
        can see are:
          step 3 (s=19): varying = 0x00001800 ; y^z = 0x5c0be734 ; VISIBLE = 0x00000000
          step 5 (s= 7): varying = 0x00004000 ; y^z = 0x7b7a00ae ; VISIBLE = 0x00000000
        Every bit of the free word's influence that reaches F is annihilated at
        both steps. THAT is the collapse.
      null_object_control_run: >-
        Identical measurement with MD4's F replaced by a non-multiplexer mixer of
        the same shape and arity: distinct_fwd_32bit = 64/64 and
        distinct_fwd_12bit = 64/64, against MD4's 33/64 and 6/64. The collapse is
        caused by F's multiplexer structure. It is not my implementation, not the
        window width, not the rotation schedule, and not the seed alone.
      this_also_explains_ANOM_B5_1: >-
        ANOM-B5-1 is frozen as an OPEN OBSERVATION with no explanation offered.
        IT NOW HAS ONE, and it was not assigned to me. MD5's step is
        newA = b + rotl(a + F(b,c,d) + X + T, s): the varying register enters
        OUTSIDE F through the "+= b" term, as a full 32-bit modular addition, so
        no bit of it can be annihilated. MD4 has no such term and its only path
        is through the multiplexer. Prediction that follows and that discriminates
        the explanation: MD5's forward observable can NEVER collapse at 32-bit
        resolution. Tested over the same 120 seeds: MD5 distinct_fwd_32bit min=64
        max=64 -- fully injective at every seed, against MD4's min=5. The
        explanation survives its own falsification test.
      bearing_on_my_joints: >-
        Decisive for R1's named gaps, for R2's break, and for R4's cost model.
        ANOM-B5-1 is not an anomaly of the instrument; it is a property of MD4's
        Round-1 F, and the gate that passed it was measuring the wrong quantity.

    - joint: >-
        R2 PROOF_SEARCH_MAP RE-RUN HONESTY -- are all four KN-TECH-080 audits
        genuinely RE-RUN against the NEW construction, and does audit 1's
        bottleneck claim now rest on a CHECKED assumption rather than an
