      verdict: breaks
      break_ground: >-
        NOT the ground the plan anticipated. The plan predicted a break only if
        the map left the assumption implicit. IT DOES NOT -- the assumption is
        explicit and its discharge is NAMED. The break is that THE NAMED
        DISCHARGE IS PROVABLY INSUFFICIENT, and the batch's own CTL-PO5(b)
        failure is the proof.
      carry_forward_check_passes: |
        Mechanical diff of proof_search_map, IDEA-20260821-ea35d1 vs
        IDEA-20260821-e46061 (327 lines vs 190), per-audit similarity ratio:
          method_ceiling         similarity=0.030  3700ch vs 1875ch  re-written
          observation_collision  similarity=0.061  2142ch vs 1288ch  re-written
          proof_obligations      similarity=0.054  5429ch vs 2136ch  re-written
          quantifier_order       similarity=0.028  2223ch vs  867ch  re-written
          nearby_object_control  SPLIT into control_1_known_to_fail + control_2_md5
        New structured fields absent from batch 4: audit_rerun_attestation,
        bottleneck_contrast_with_batch_4, carried_forward_prior_result,
        the_search_itself_not_an_assertion, structural_collision_family_check.
        NO AUDIT IS CARRIED FORWARD. P-R2's specific watched failure did not
        occur and I say so plainly.
      the_break_stated_precisely: >-
        The map's audit-2 arithmetic is "expected count 2^(k1+k2-k) = 2^0 = 1
        besides the planted pair", and CTL-PO5(b)'s ceiling of 4 is calibrated
        from the same premise (1 + 4096/2^20 = 1.0039). That premise requires the
        per-side observable maps to be NEAR-INJECTIVE. The named discharge for it
        is GATE-PO2. GATE-PO2's criterion is `distinct >= 2`, which tests
        NON-CONSTANCY, and non-constancy does not imply near-injectivity. The gate
        therefore cannot discharge the assumption its own audit rests on, and the
        map asserts that it can.
      worked_attack_output: |
        My independent re-run at k1=k2=6, seed 8975323, R1-SEP10 parameters:
          distinct_fwd_32bit=33/64  distinct_fwd_12bit=6/64
          distinct_bwd_32bit=24/64  distinct_bwd_12bit=24/64
          planted (wA,wB) = (47,32) ; target_low20 = 0xa5662
          CTL-PO5 RAW pre-certificate candidate count = 8   [ceiling <= 4]
            distinct wA in raw set = 4 ; distinct wB in raw set = 2  [part (a) passes]
            distinct 20-bit values across the raw set = 1 -> 0xa5662
            certificate-verified: 1 of 8 -> [(47, 32)]
            FIBER SIZES at 0xa5662: |fwd preimages|=4 x |bwd preimages|=2 = 8
          model E = 1 + 4096/2^20 = 1.003906   vs   measured E = 8
        The eight raw candidates are not eight independent 2^-20 coincidences.
        They are the exact product of two measured fiber multiplicities, 4 x 2.
        The number 8 is fully determined by quantities GATE-PO2 already measured
        and recorded as a PASS.
      the_contracts_own_diagnosis_is_wrong: >-
        H-MDFIVE-0ca596's frozen falsification condition reads: "PO-5 fails (a
        raw projection covers its full window, or the raw candidate count exceeds
        4): A DEGENERATE WORD CHANNEL SURVIVED THE GATE." NO CHANNEL IS
        DEGENERATE. Both channels are non-constant at every held-fixed value (33
        and 24 distinct of 64). They are LOSSY -- strongly many-to-one. Degenerate
        and lossy are different failure modes with different remedies, and the
        contract's pre-registered vocabulary contains only the first. The clause's
        second half, "this would mean PO-2's predicate is weaker than believed,
        which is itself a finding about the gate", IS CORRECT AND WAS
        PRE-REGISTERED BEFORE THE DATA EXISTED. I reached the same conclusion
        independently and I credit the record for having written it down first.
        My addition is the mechanism and the quantification.
      audit_2_prediction_is_now_falsified_and_the_record_must_not_stand_unamended: >-
        proof_search_map audit 2 predicts "expected count ... = 1 besides the
        planted pair". Observed: 7 non-Y-reproducing 20-bit colliders besides the
        planted pair, at the declared seed. Over 120 fixed-word seeds the median
        is 31 and the maximum 928, and NOT ONE of 120 seeds produced the
        predicted value of 1. The observation-collision audit was genuinely SEARCHED
        rather than asserted -- I credit that -- but its prediction is refuted.
      the_ruling_on_dominated_by_row_1_proves_too_much: >-
        THE GATE'S RULING FAILS ITS OWN TEST. H-MDFIVE-0ca596 concedes a rival
        construction strictly dominates R1-SEP10 on pure two-word recovery
        (~2^k1 time, O(1) memory vs 2^k1 + 2^k2 time, 2^k1 memory) and rules it
        not disqualifying because "ITS MATCH CONDITION FACTORIZES, so it exhibits
        no joint two-word MITM". R1-SEP10'S MATCH CONDITION ALSO FACTORIZES, and
        I verified this structurally: chunk1_observable is a function of wA alone
        (forward from the IV through words 0..5), chunk2_observable is a function
        of wB and Y alone (backward from Y through words 15..8), and the raw
        candidate set is exactly {(a,b) : low20(F(a)) == low20(B(b))}. That IS a
        factorized match -- factorization is what MAKES a meet-in-the-middle
        possible. Applied unchanged to R1-SEP10, the ruling's stated discriminator
        disqualifies R1-SEP10. The conclusion survives on a CORRECTED
        discriminator -- neither factor is constant, whereas the rival's backward
        factor is constant -- but the reason on the record is wrong and must be
        restated before anything cites it.

