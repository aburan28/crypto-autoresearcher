  coordinator_prior_comparison:
    P-R1:
      ruling: CONFIRMED
      tier_agreement: full
      what_i_confirmed_independently: >-
        At the batch-4 slice (free words 8 and 9, S = 9) the two free words
        influence DISJOINT components: E_0 = {1} depends on word8 only, D_0 = {0}
        depends on word9 only. My own re-run measures d_f32=16, d_b32=1 at p=1
        (ANOM-1 as recorded) and d_f32=1, d_b32=16 at p=0. A bare "read tuple
        position 0" swap therefore RELOCATES the degeneracy onto word8 rather
        than curing it, exactly as predicted. Object M' above is that prediction
        executed.
      mechanism_divergence_reported_as_required: >-
        THE TIER MATCHES AND THE MECHANISM DIFFERS IN THREE WAYS, EACH
        STRENGTHENING THE PRIOR.
        (1) PROVENANCE. The Coordinator derived disjointness by READING
        harness/run_md4_ceiling.py's forward_step and backward_step return
        tuples -- a fact about one implementation, and the record itself flags it
        as "a Coordinator reading of module source, NOT a measured or
        independently reconfirmed fact ... Open, not settled". I derived it from
        RFC 1320's step table alone, without opening that module. Disjointness is
        a property of MD4's Round-1 WORD SCHEDULE and holds for every correct
        implementation. The prior is now settled, and settled at a stronger
        level of generality than it was stated.
        (2) SCOPE. The prior is stated for the single case j - i = 1. The true
        statement is a THRESHOLD: E_d cap D_r is empty for ALL j - i <= 3 and
        nonempty for ALL j - i >= 4, uniformly over every legal split point,
        because d + r = j - i - 1 is split-independent. The prior identifies one
        point of a curve it did not have.
        (3) REMEDY RANKING. The prior offers two remedies as alternatives -- match
        on both components, or increase the separation. My calculus shows they are
        NOT alternatives of equal standing. Matching on both components CANNOT
        WORK at j - i = 1, because E_0 and D_0 are disjoint, so no single
        component and no pair of components is jointly dependent; the union
        {0,1} is a partition, not an overlap. INCREASING THE SEPARATION TO >= 4
        IS THE ONLY REMEDY IN THE FAMILY. The proposal chose the only correct
        option, and the record does not know that.
      and_a_place_the_prior_is_too_generous_to_the_chosen_design: >-
        The prior implies the component choice matters. At separation 10 it does
        not: d = 5 and r = 4 put ALL FOUR components in E_d cap D_r, so p = 3
        (v6) is not load-bearing and any component would pass GATE-PO2
        identically. The design's real content is the separation alone.
