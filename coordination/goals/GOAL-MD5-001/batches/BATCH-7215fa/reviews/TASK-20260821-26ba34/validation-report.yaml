        the same disposition, but these three were NOT disclosed by the executor
        while requested_policy was. Filing them alongside the existing
        out-of-scope item is the cheap fix.

    - id: DEFECT-26ba34-06
      severity: minor
      joint: V5
      title: Two execution-report statements not supported by the run artifacts
      items:
        - >-
          budget.enforcement: "Both runs were launched under `timeout
          --signal=KILL <ceiling>`". No artifact records it and both manifests
          record deadline_seconds: null, so no in-process deadline was armed. The
          claim is not disprovable either; it is simply unverifiable from the
          record, and the contract's stopping_rules asks for an explicit monotonic
          deadline that was not set.
        - >-
          reproduction: "Both commands are recorded verbatim in each run
          directory's command.txt". command.txt records `" ".join(sys.argv)`, which
          omits the interpreter and the `-m` flag. I confirmed by cold re-run that
          the recorded shape is what a `python3 -m` launch produces, so the account
          of how the runs were launched is correct; "verbatim" is not.
      remedy: record sys.executable alongside sys.argv; pass the per-run ceiling as --deadline so the manifest shows an armed deadline.

    - id: DEFECT-26ba34-07
      severity: minor
      joint: V5
      title: Run validity status is asserted by the caller, not derived from the result
      where: harness/run_md4_ceiling_v2.py:~1528, `runner.run_wrapped(..., status="completed_valid", ...)`
      what: >-
        The status string is a hard-coded literal at a call site inside the
        executor's own module, so manifest.run.status and result.valid would read
        `completed_valid` / `true` regardless of outcome. Both runs did complete
        validly, so no record here is wrong; the field is nonetheless not a
        measurement. AGENTS.md requires "validity status and reason" as a recorded
        fact.
      remedy: derive the status from all_gates_passed / the gate verdict at the call site.

    - id: DEFECT-26ba34-08
      severity: informational
      joint: V5
      title: Manifest inputs record parameters the run did not use, and the cost table reports memory for one run of two
      what: >-
