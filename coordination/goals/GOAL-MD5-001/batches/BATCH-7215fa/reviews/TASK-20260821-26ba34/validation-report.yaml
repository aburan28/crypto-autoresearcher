      severity: minor
      joint: V5
      title: Three AGENTS.md artifact-policy fields absent from both manifests and undisclosed
      what: inference.backend, inference.probe_verified, inference.degraded_requirements
      where: harness/runner.py:695-709 `_inference_block()`, which is outside the executor's write_scope
      note: >-
