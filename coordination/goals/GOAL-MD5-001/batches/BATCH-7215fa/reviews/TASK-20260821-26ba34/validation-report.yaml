    - id: DEFECT-26ba34-03
      severity: material
      joint: V1
      title: CTL-PO3, a clause of the frozen nine-clause gate pass predicate, cannot fail for the reason it is named for
      where: harness/run_md4_ceiling_v2.py:599-613 (gate_direction_A)
      what: >-
        The loop variable `hb` over the four pre-registered held-fixed indices is
        never applied to the word list, so the four repetitions are four
        evaluations of an identical expression. The byte-identity assertion can
        only detect nondeterminism, not "chunk1_observable reads free word B
        somewhere it must not", which is the failure the contract assigns it.
      evidence: see V1 sub_check_BOTH_DIRECTIONS_SEPARATELY grounding output -- a deliberately leaky observable passes the module-shape check and fails the contract-shape one.
      does_not_change_this_run_verdict: >-
        I verified independently that the asserted property is TRUE for the real
        observable. The clause is satisfied in fact and unestablished by the
        artifact.
      remedy: set words[j_word] = high[j_word] | hb inside the loop; then the check can fail and CTL-PO3 becomes what the contract describes.

    - id: DEFECT-26ba34-04
      severity: material
      joint: V3
      title: The declared matching window is severely non-injective on the MD4 forward side, and GATE-PO2's ">= 2 distinct" threshold does not catch it
      what: >-
        Measured: the forward observable's image inside the m = 12 window is the
        identical six-element set at k1 = 6 and k1 = 8 (low nine bits constant),
        and is 2 to 26 out of 256 across six fixed-word seeds. At seed 20260822 it
        is 2 -- which still passes the gate. The MD5 side is fully injective at
        32 bits and 90-217 in the window at the same parameters.
      why_it_is_a_defect_and_not_just_a_number: >-
        HEUR-H1's Poisson(lambda = 2^(k1+k2-m)) prediction presumes both sides are
        roughly uniform over 2^m bins. They are not, on the MD4 arm. The gate is
        the batch's hard term and its threshold does not separate "depends on the
        free word" from "depends on the free word in three bits".
      relation_to_existing_records: >-
        The executor recorded the k = 4 and k = 6 instances as ANOM-B5-1 with
        severity material and correctly declined to adjudicate. What is new here
        is the k1-trend, the saturation at six, the low-nine-bits-constant
        structure, and the six-seed check showing it is structural rather than
        seed-specific.
      remedy: >-
        A future gate should test the window IMAGE SIZE against 2^min(k1, m), not
        merely distinctness >= 2, and should test both sides separately at 32-bit
        and m-bit resolution as this one already reports.

