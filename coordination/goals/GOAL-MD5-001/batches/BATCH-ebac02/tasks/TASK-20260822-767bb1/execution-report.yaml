  routing_answer:
    question: >-
      whether the next batch should change the SEED (cheap), the
      CRITERION (cheap, RC-3), or the CONSTRUCTION (expensive).
    answer: CONSTRUCTION (primitive-dependent target).
    evidence:
      seed_refuted: >-
        MEASURED, n=100 per primitive: on MD4 the 12-bit injectivity
        threshold (12/16) is reached by 1/100 seeds, and the maximum
        across all seeds is 15 (AN-B6-3); the 12-bit window rank
        (DERIVED) is 4 on only 3/100 MD4 seeds. There is no seed-draw
        rule this distribution licenses -- the collapse is not a lottery
        with a favorable corner to find.
      criterion_not_binding: >-
        The injectivity criterion is working as designed: it separates
        the collapsed MD4-12bit channel (1% pass) from the healthier
        MD5-12bit channel (65% pass) on the same construction. But the
        batch-5-style raw-count ceiling (4) sits below the MEASURED
        healthy-channel expectation on MD5 (median 12, 52% of seeds
        >= 4): relaxing the ceiling would stop the instrument from
        stopping, without removing the structured raw-count excess,
        which the rank analysis shows is the same linear-dependence
        mechanism. CRITERION is necessary bookkeeping, not the fix.
      construction_binding: >-
        The declared matching quantity (low-k bits of the declared
        component, 12-bit window) is the object the free word's
        directions fail to carry independently: MD4 12-bit window rank
        <= 1 on 48/100 seeds; MD5 rank <= 3 on 46/100; the affine null
        object is rank 4 everywhere, so the blindness is a property of
        the multiplexer step algebra at this (split, component, window)
        choice, primitive-dependently (MD4 severe, MD5 mild). The
        cheapest construction fix is NOT a new split-point search: the
        same rank statistic pre-screens candidate (component register,
        bit-window) pairs at zero search cost before any gate-scale
        re-run -- pick a window where the four toggle directions are
        linearly independent, then re-run the gate.
        MEASURED + DERIVED, as labeled.
    scope_honesty: >-
      This routing answer is at the tested scale (k1=k2=4 gate, k1=k2=6
      control, n=100 seeds, two primitives, one construction). It does
      not transfer to other split points, larger k, or other
      constructions without re-measurement.

