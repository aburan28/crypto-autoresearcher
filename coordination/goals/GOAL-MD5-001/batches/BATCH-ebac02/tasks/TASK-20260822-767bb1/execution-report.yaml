  # THE ROUTING ANSWER, FIRST, BECAUSE IT IS THE POINT.
  # =====================================================================
  routing_answer_one_line: >-
    CONSTRUCTION (primitive-dependent), NOT SEED and NOT CRITERION: the
    binding defect is that the free word's single-bit directions are
    linearly dependent in the declared matching component -- on 48/100
    MD4 seeds the 12-bit matching window has GF(2) rank <= 1 in those
    directions (17/100 rank 0) and only 3/100 full rank 4, while on MD5
    the window carries them much better (54/100 rank 4) yet the 20-bit
    raw count still runs ~12x the healthy-channel expectation, and the
    affine null object is full rank 4 everywhere. Re-drawing seeds
    (SEED) has no exploitable rule (1/100 MD4 seeds reach the 12-bit
    injectivity threshold; the best MD4 seed reaches 15 of 16); moving
    the ceiling (CRITERION) would relax a stopping rule but not the
    dependence that drives the raw count on either primitive.

