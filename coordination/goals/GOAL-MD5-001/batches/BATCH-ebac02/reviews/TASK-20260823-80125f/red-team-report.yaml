  blind_rederivation:
    quantity: >-
      Minimum integer distinct count satisfying
      distinct >= (1 - eps) * 2^k at full 32-bit and low-window/12-bit
      resolution for eps = 0.25 and k = 4.
    derived_from:
      - >-
        ledger/decisions/DEC-20260822-40bf14.yaml,
        coordinator_decision.next_actions item 3(a): the symbolic criterion.
      - >-
        The declared constants eps = 0.25 and k_gate = 4. Because the task
        brief did not print their numeric values, they were resolved by a
        targeted read of experiments/EXP-MDFIVE-8f0fe3/specification.yaml:66,85;
        this ordering deviation is disclosed below and in blind-rederivation.yaml.
      - >-
        RFC 1320 / RFC 1321 standard Round-1 schedule as the primitive scope.
        No schedule entry changes the count arithmetic after eps and k are
        frozen, so no RFC text or producer implementation was needed to
        calculate the threshold.
    ordering_attestation: >-
      blind-rederivation.yaml was completed before reading
      harness/run_md4_seed_sweep.py; any manifest or raw-result.json under
      TASK-20260822-767bb1/runs; execution-report.yaml; or
      derived-analysis-b6.json. None of those blind_from artifacts contributed
      to the arithmetic.
    arithmetic:
      - 'eps = 0.25 = 1/4'
      - '1 - eps = 3/4'
      - '2^k = 2^4 = 16'
      - '(1 - eps) * 2^k = (3/4) * 16 = 12'
      - 'ceil(12) = 12, because distinct counts are integral'
      - 'min(2^4, 2^32) = 16 and min(2^4, 2^12) = 16, so neither codomain caps the 16-point domain'
    derived_integer_thresholds:
      full_32_bit: 12
      window_12_bit: 12
    records_claim:
      driver: 'harness/run_md4_seed_sweep.py:53-57 sets EPS = 0.25 and INJ_THRESHOLD = 12'
      manifests: 'all four production manifest.yaml files declare injectivity_threshold: 12'
    agreement_with_the_records_claim: AGREES_EXACTLY

  per_joint_verdicts:
    R1:
      verdict: OVERTURNED
      claim_step: >-
        The distribution separates a seed lottery from a construction defect
        and a model defect at the routing granularity required.
      worked_reasoning:
        - >-
          The threshold is 12/16. Recomputed directly from the per-seed arrays,
          the primary MD4 forward 12-bit arm passes on 1/100 seeds, while the
          primary MD5 arm passes on 65/100. Exact two-sided 95% Clopper-Pearson
          intervals are [0.0002531460, 0.0544593854] for MD4 and
          [0.5481506382, 0.7427062215] for MD5. The exact two-sided binomial
          p-values against p = 0.5 are 1.5935e-28 and 0.00351764,
          respectively. Thus MD4 is confidently below the Coordinator's 50%
          switch and MD5 is confidently above it.
        - >-
          The frozen prior says >= 50/100 passes on EITHER primitive flips the
          route to SEED. MD5 has 65/100. The execution report nevertheless
          answers CONSTRUCTION and its seed_refuted paragraph argues only from
          MD4's 1/100. That omits the independently decisive MD5 limb and
          contradicts the pre-registered routing rule.
        - >-
          The criterion detects the known ANOM-1 collapse: its word9 channel
          has one distinct value at full 32-bit and therefore also one in the
          12-bit projection, which is below 12. The batch-5 phase-A replay
          independently records [1,1,1,1] in both backward resolutions.
        - >-
          The RC-5 object does not pass the same whole-object criterion. Its
          forward arm is 16/16 for 100/100 seeds on both primitives, but its
          backward arm is collapsed: null-MD4 is 1/16 at both 32-bit and
          12-bit on 100/100 seeds, and null-MD5 is 1/16 at 12-bit on 100/100
          seeds. The execution report narrows RC-5 to the forward arm only
          after disclosing this degeneracy. The frozen review plan calls RC-5
          a known-good same-shape object that must pass the same criterion,
          and experiment term (h) pairs the null with every distinct-count
          measurement; neither contains a forward-only exception.
        - >-
          Therefore the proves-too-much criterion flags both the known-bad
          ANOM-1 and the purportedly known-good null when applied to the
          declared object, triggering the frozen failure signature. A
          forward-only statement remains admissible, but it cannot support
          whole-construction routing or distinguish construction defect from
          model/control defect.
      numbers:
        threshold: 12
        primary_md4_forward_12bit: {passes: 1, n: 100, range: [1, 15]}
        primary_md5_forward_12bit: {passes: 65, n: 100, range: [6, 16]}
        null_md4_forward_12bit: {passes: 100, n: 100, range: [16, 16]}
        null_md4_backward_12bit_max: {passes: 0, n: 100, range: [1, 1]}
        null_md4_backward_32bit_max: {passes: 0, n: 100, range: [1, 1]}
        null_md5_forward_12bit: {passes: 100, n: 100, range: [16, 16]}
        null_md5_backward_12bit_max: {passes: 0, n: 100, range: [1, 1]}
      claim_boundary: >-
        The snapshot supports only a primitive- and direction-specific
        distribution statement: at this construction and seed generator,
        MD4's forward 12-bit pass probability is very low and MD5's is above
        one half. It does not support the single causal route CONSTRUCTION.

    R2:
      verdict: OVERTURNED
      claim_step: >-
        The RC-4 static (y XOR z) mask-survival argument is a sound general
        predictor of collapse and reproduces ANOM-1 from the mask alone.
      worked_reasoning:
        - >-
          The driver actually contains two different objects: an exact
          two-point probe at low=0 versus low=2^r, and a MODELED carry-free
          first-order mask trace. A basis direction that is unchanged at the
          origin need not be irrelevant on multi-bit inputs in an ARX
          multiplexer; carries and higher-order terms can activate it. The
          docstring's claimed image-size bound 2^(number of surviving basis
          directions) is therefore not generally valid.
        - >-
          The raw data directly falsify that bound. On 20/100 MD4 seeds the
          measured 32-bit image exceeds rc4.implied_distinct_32bit_bound. Most
          sharply, seed 20260886 reports surviving bits [0,1,2], hence a
          claimed bound of 8, but measures 15 distinct values at both 32-bit
          and 12-bit resolution. This is a contradiction, not a tolerance
          issue. The carry-free mask model also disagrees with the two-point
          probe on 73/400 MD4 seed-bit pairs and 103/400 MD5 pairs.
        - >-
          The identical mask-alone argument does not reproduce ANOM-1. ANOM-1
          is proved because word9 is first consumed at step 10 and the
          after-step-9 tuple position 1 is a pass-through; only tuple position
          0 of backward_step depends on word9. That proof necessarily uses
          the schedule, the specific inverse step, register routing, and the
          selected component. It does not follow from a (y XOR z) mask at an
          F application. The current RC-4 implementation is forward-only from
          i_word to S and provides no mask-only backward ANOM-1 derivation.
        - >-
          CTL-PO5(b) confirms that survival is at most necessary, never
          sufficient. For the same R1-SEP10 construction and fixed-word seed
          20260821, the current RC-4 two-point record says bits [0,2,3]
          survive, yet batch 5's exhaustive k1=k2=6 control still has eight
          raw candidates against ceiling four, with a 4 x 2 projection
          product. That failure is a fiber-multiplicity/independence defect,
          not proof that a multiplexer mask killed every bit. This review does
          not attribute CTL-PO5(b) to the mask.
        - >-
          The producer's own report says survival is the wrong granularity and
          substitutes a post-hoc GF(2) rank statistic. That concession is
          correct, but it overturns rather than validates frozen joint R2; the
          rank analysis is a different predictor and remains separate from the
          pre-registered mask claim.
      numbers:
        md4_claimed_bound_violations_32bit_or_12bit: 20
        seed_20260886:
          measured_surviving_bits: [0, 1, 2]
          claimed_bound: 8
          observed_distinct_32bit: 15
          observed_distinct_12bit: 15
        modeled_vs_two_point_disagreements:
          md4: 73
          md5: 103
          denominators_each: 400
        ctl_po5b_batch5:
          raw_candidate_count: 8
          declared_ceiling: 4
          distinct_wA: 4
          distinct_wB: 2
      claim_boundary: >-
        Exact dependency analysis may prove that a channel is dead, but this
        carry-free mask linearization and origin-basis probe do not provide
        that proof in general. They are diagnostic measurements, not a sound
        image-size bound or a general collapse predictor.

    R3:
      verdict: OVERTURNED
      claim_step: >-
        The cost model is honest, the deadline is genuinely armed at useful
        granularity, and n=100 supports the seed/criterion/construction route.
      worked_reasoning:
        - >-
          The broad "seconds" statement is supported by measured artifacts:
          the four production manifest wall times are 0.135911, 0.154608,
          0.134568, and 0.124504 seconds, all far below one second and below
          the 120-second ceilings. This support comes from actual times, not
          from the ceilings.
        - >-
          The execution report's exact wrapper times are stale relative to the
          snapshot-frozen manifests. It reports 0.095516, 0.101473, 0.083694,
          and 0.089513 seconds (sum 0.370196) for the production runs, whereas
          the manifests sum to 0.549591 seconds, a 0.179395-second (48.46%
          relative-to-report) difference. Both are subsecond, but the exact
          cost record does not reconcile.
        - >-
          A 10x slowdown would take only 1.24504 to 1.54608 seconds, still
          77.6x to 96.4x below 120 seconds. Thus the declared deadline cannot
          expose the worked-attack's 10x slowdown. More seriously,
          measure_seed_null has no deadline check; it merely permits
          sweep_run to set halted_at_deadline after all work completes.
          Primary runs check elapsed time only before and after a seed, so the
          mechanism is polling, not a preemptive timer that can interrupt a
          hung seed. The manifest parameter is present, but term (f)'s
          "armed" language overstates enforcement.
        - >-
          The routing granularity is adequate to decide the actual MD5 limb,
          but the report decides it in the wrong direction. MD5's 65/100 exact
          95% interval lies wholly above 0.5, so the pre-registered rule routes
          MD5 to SEED and overturns the prior. MD4 routes away from SEED.
          Combining them into CONSTRUCTION discards the rule's explicit
          EITHER-primitive quantifier.
        - >-
          For the review plan's hypothetical 60/40 split, n=100 is
          inconclusive at two-sided exact 95% confidence: the interval is
          [0.4972091504, 0.6967052313] and the two-sided exact p-value against
          p=0.5 is 0.0568879. If the observed fraction remains exactly 0.60,
          n=110 (66/110) is the first multiple-of-ten sample size whose exact
          95% lower bound exceeds 0.5; that is the minimum scoped recommendation,
          with the stability-of-0.60 assumption stated.
      numbers:
        production_manifest_wall_seconds:
          primary_md4: 0.135911
          primary_md5: 0.154608
          null_md4: 0.134568
          null_md5: 0.124504
          sum: 0.549591
        production_execution_report_wall_seconds:
          primary_md4: 0.095516
          primary_md5: 0.101473
          null_md4: 0.083694
          null_md5: 0.089513
          sum: 0.370196
        declared_ceiling_seconds_each: 120
        ten_x_max_manifest_seconds: 1.54608
        hypothetical_60_of_100_exact_95pct_interval: [0.4972091504, 0.6967052313]
        hypothetical_60pct_minimum_n_for_lower_bound_above_half: 110
      claim_boundary: >-
        The package is demonstrably cheap at n=100, but it does not establish
        a 10x-sensitive deadline and does not support its filed routing answer.

  proves_too_much:
    method: >-
      Apply the frozen 12-of-16 criterion without changing its direction or
      object scope; separately apply the unchanged mask-only causal argument
      and ask whether it reaches each known verdict without schedule- or
      fiber-specific additions.
    per_object_results:
      ANOM_1_S9:
        known_verdict: COLLAPSED_OVER_WORD9
        criterion_result: PASS_AS_DETECTOR
        evidence: >-
          KN-TECH-bb7e9f and TASK-20260821-de817d/execution-report.yaml ANOM-1
          prove and measure one distinct full-32-bit value under word9
          variation; the batch-5 phase-A replay records four 1s at both
          resolutions. One is below threshold twelve.
        mask_argument_result: FAIL
        reason: >-
          The conclusion requires step-10 word consumption and tuple-position
          pass-through. It is not obtained from a (y XOR z) F-mask alone.
      RC5_null:
        known_verdict_in_plan: NON_COLLAPSED_SAME_SHAPE_OBJECT
        criterion_result: FAIL_AS_WHOLE_OBJECT
        evidence: >-
          Forward is 16/16 throughout, but null-MD4 backward is 1/16 at both
          resolutions and null-MD5 backward is 1/16 at 12-bit for all 100
          seeds. The report's forward-only validation is an undeclared scope
          restriction relative to the plan and term (h).
        mask_argument_result: FORWARD_ONLY_DIAGNOSTIC
        reason: >-
          All four forward basis bits survive and the forward channel passes,
          but the control does not validate the declared backward measurements.
      CTL_PO5b_batch5:
        known_verdict: COLLAPSED_FOR_NON_MASK_REASON
        criterion_or_control_result: FAIL_AT_8_AGAINST_4
        mask_argument_result: NECESSARY_NOT_SUFFICIENT_ONLY
        evidence: >-
          The raw set is exactly 4 x 2 even though multiple free-word basis
          bits survive in the corresponding construction. Fiber multiplicity,
          rank/cancellation, target structure, and mask survival are distinct
          quantities.
        attributed_to_mask_by_this_review: false
    failure_signature:
      text: >-
        If the criterion flags neither the known-collapsed ANOM-1 object nor
        the known-good null mixer, or flags both, or if the mask is used to
        attribute CTL-PO5(b), the distribution-derived routing answer is void.
      anom_flagged: true
      rc5_whole_object_flagged: true
      both_flagged_condition: true
      ctl_po5b_attributed_to_mask: false
      test_result: TRIGGERED
      consequence: ROUTING_ANSWER_VOID

  coordinator_prior_comparison:
    plan_falsifiable_prediction: >-
      If >= 50% of at least 100 seeds reach the declared 12-bit injectivity
      threshold on either primitive, routing flips to SEED and overturns the
      prior.
    threshold_count: 12
    md4:
      pass_count: 1
      n: 100
      fraction: 0.01
      exact_95pct_interval: [0.0002531460, 0.0544593854]
      assessment: >-
        Does not trigger the prior's falsifier; the tested MD4 forward channel
        is not a favorable-seed lottery under this seed generator at n=100.
    md5:
      pass_count: 65
      n: 100
      fraction: 0.65
      exact_95pct_interval: [0.5481506382, 0.7427062215]
      assessment: >-
        Triggers the falsifier on its own numbers. The MD5 limb flips to SEED
        and overturns the prior with two-sided exact 95% confidence; it cannot
        be absorbed into a global CONSTRUCTION answer.
    combined_assessment: >-
      The empirical result is primitive-specific (MD4 below the switch; MD5
      above it), but the frozen decision rule deliberately says EITHER
      primitive and therefore requires the phase-1 route to flip to SEED. A
      primitive-specific routing rule would require a prospective amendment;
      it cannot be substituted after acquisition. In either formulation, the
      filed CONSTRUCTION answer does not follow, and the stronger ruling is
      that the whole routing answer is void because RC-5 fails its frozen
      proves-too-much role and R2's causal predictor breaks.

  narrowest_supported_statement: >-
    At k_gate=4, eps=0.25, n=100 consecutive fixed-word seeds, and the exact
    R1-SEP10 construction, the primary forward 12-bit image passes threshold
    12 on 1/100 MD4 seeds and 65/100 MD5 seeds; the additive null's forward
    image passes on 100/100 in both primitives. These are valid bounded
    observations. They do not establish a mask cause, a whole-object null
    pass, or a single CONSTRUCTION routing decision.

  procedure_deviations:
    - id: RT-PD-1
      phase: blind_rederivation
      what: >-
        The brief expressly allowed declared eps and k but omitted their
        numeric values, and DEC-20260822-40bf14 item 3(a) states only the
        symbolic criterion. A targeted read of the named Phase-2 experiment
        specification at lines 61-68 and 85 was used before the blind file was
        written solely to resolve eps=0.25 and k_gate=4.
      impact: >-
        No producer implementation, manifest, raw result, execution report, or
        derived analysis was read; the arithmetic remained independent of the
        records whose claimed threshold was later compared.
    - id: RT-PD-2
      phase: blind_rederivation
      what: >-
        The initial decision-file command printed DEC-20260822-40bf14 lines
        1-260 before the next_actions locator was isolated, rather than only
        item 3(a). This exposed unrelated batch-5 rationale but no numeric eps,
        no numeric threshold, and no Phase-2 blind_from artifact.
      impact: >-
        The over-read is disclosed. It did not supply the threshold arithmetic
        or violate the explicit producer-artifact blind_from list, but it was
        broader than the Phase-1 source locator required.

