        RUN-MDFIVE-b6-null-md5-prod). The code_path_fingerprint's
        parameter_tuple carries the primitive. SATISFIED. This was the
        batch-5 defect (F-2: primitive qualified only on CTL-PO6); it is
        now FIXED.
        (h) NULL-OBJECT CONTROL ON EVERY DISTINCT-COUNT MEASUREMENT: The
        module defines _f_null (line 89: additive mixer (x+y+z)&M32, same
