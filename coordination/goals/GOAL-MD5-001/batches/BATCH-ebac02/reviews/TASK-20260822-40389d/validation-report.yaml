        all four held-fixed repetitions (verified by reading the raw data).
        SATISFIED.
        (g) PRIMITIVE QUALIFIER ON EVERY CONTROL: Every run manifest carries
        primitive (md4 or md5) and object (primary or null) in its
        parameters. The execution report's controls section carries
        primitive_qualifiers: ['md4', 'md5'] for RC-5. The null-object run
