      verdict: passed
      verdict_reason: >-
        ALL SEVEN APPLICABLE TERMS (a, b, c, d, e, g, h) ARE HONORED. Term
        (f) is checked under V2. Each is verified from the source code and
        the raw artifacts, not from the execution report's self-assessment.
        (a) INJECTIVITY CRITERION AT BOTH RESOLUTIONS WITH DECLARED EPS:
        The module declares EPS=0.25 and INJ_THRESHOLD=int((1-0.25)*16)=12
        BEFORE ACQUISITION (lines 51-52, declared as module constants). The
