        SATISFIED.
        (c) MEASURELED-OR-MODELED LABELS ON EVERY THRESHOLD INCLUDING
        CONTROLS: The execution report's controls section labels RC-4 as
        "MEASURED (two-point sensitivity) + MODELED (carry-free first-order
        linearization)", RC-5 as "MEASURED", CTL-PO3 as "MEASURED", and the
        deterministic double-run as "MEASURED". The modeled expected raw
        count is labeled "MODELED" in the adjudication notes. The derived
        rank analysis is labeled "DERIVED (not a pre-registered measurement)".
        SATISFIED.
        (d) UNIFORMITY PREMISE NUMBERED AND TESTED: HEUR-H3 is declared as a
        module constant (lines 61-69) with a justification ("seeds are
        consecutive integers and random.Random(seed).getrandbits(32) has no
        published bias at this granularity") and a TEST ("duplicate counts
        at the 4-bit low level and at the full-32-bit high-mask level"). The
        test result is in derived-analysis-b6.json: high_mask_pair_duplicates=0
        for both primitives, target_low_pair_duplicates=16 (within birthday
        expectation ~19.3 for 100 draws into 256 pairs). The 4-bit low-draw
        histograms are near-uniform (min 3, max 12 of 100 per 16-bin).
        Verdict: HEUR-H3 NOT FALSIFIED at this n. SATISFIED. DEV-3 discloses
        that the test results are in the derived file rather than in
        raw-result.json; this is a recording-location deviation, not a
        missing test.
        (e) HELD-FIXED VALUE APPLIED INSIDE gate_direction_A: The module's
        measure_seed function (lines 384-398) loops over HELD_FIXED_INDICES
        and for each hb sets wt[params.j_word] = fixed["high"][params.j_word]
        | hb BEFORE evaluating the observable. This is the term-(e) fix for
        the batch-5 CTL-PO3 vacuity defect (F-8): the held-fixed value is
        now applied inside the word template, so the byte-identity check is
