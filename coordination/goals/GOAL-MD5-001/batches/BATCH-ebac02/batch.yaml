objective: >-
  Before any redesign of the construction, produce under contract (a) the RC-1
  fixed-word-seed distribution -- distinct_fwd/distinct_bwd at 32-bit and
  12-bit resolution plus the CTL-PO5 raw candidate count, over >= 100
  fixed-word seeds, MD4 and MD5, reported as a DISTRIBUTION not a point value
  -- and (b) the RC-4 static per-F-application (y XOR z) mask pre-computation
  check on the path from the free word to the declared component. Together
  these decide whether the successor instrument should change the SEED
  (cheap), the CRITERION (cheap, RC-3), or the CONSTRUCTION (expensive). All
  eight binding contract terms (a)-(h) of DEC-20260822-40bf14 next_actions
  item 3 apply. A degenerate distribution is a RESULT, not a batch failure: it
  is a second, sharper measurement of the same obstruction, recorded under
  docs/inventor-protocol.md's closure standard. A count of screened-and-
  rejected seeds with no named obstruction is a fatigue report and is recorded
  `unverified`.

