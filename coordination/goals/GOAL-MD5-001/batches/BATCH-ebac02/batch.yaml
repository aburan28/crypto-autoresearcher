objective_note_why_no_redesign_first: >-
  The goal head's committed next_action and DEC-20260822-40bf14 next_actions
  item 1 both order PHASE 1 BEFORE ANY REDESIGN, and this batch does not
  re-litigate that order: redesigning the construction first would spend the
  expensive option on a hypothesis (seed lottery vs construction defect vs
  model defect) that a seconds-scale measurement resolves. If phase 1 says
  the construction is the binding defect, batch 7 (the final batch) spends
  its budget on a construction change with the distribution in hand; if it
  says the seed is, the successor run is a seed re-draw; if it says the
  criterion, RC-3's injectivity threshold is the object of the fix.

