validation_report:
  id: VAL-20260908-d7e312
  task_id: TASK-20260907-d7e312
  batch_id: BATCH-f1f479
  goal_id: GOAL-MD5-001
  review_kind: custody_fidelity_review
  scope_statement: >-
    This is an administrative custody/preservation-fidelity review, not a
    scientific review. It certifies (or does not) that the bytes named in
    TASK-20260907-57d38a's preservation-package.json are a faithful and
    complete copy of the cited Git objects and current-tree files, over the
    scope declared for that task. It does NOT re-adjudicate, certify, or
    promote any of the historical scientific/review verdicts the package
    merely preserves (V1-V4, the red-team/blind-rederivation reports, DEC-
    20260822-d7c2d0, EV-MDFIVE-b0def7, EXP-MDFIVE-8f0fe3, or H-MDFIVE-*
    status). A `passed` verdict here authorizes nothing about GOAL-MD5-001's
    scientific claims and does not discharge any missing report, citation
    remediation, or required scientific review for any goal (per the task
    objective's explicit reminder, which names "MCE" -- almost certainly a
    cross-batch template artifact from the six-goal simultaneous custody
    operation this task belongs to (commit 13082929d), since this batch is
    GOAL-MD5-001, not GOAL-MCE-001; flagged under limitations, not corrected).

  producer_task: TASK-20260907-57d38a
  producer_artifacts:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/tasks/TASK-20260907-57d38a/preservation-package.json
    - coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/tasks/TASK-20260907-57d38a/recovery-report.md
  snapshot_task: TASK-20260907-3a43da
  snapshot_receipt: coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/archives/TASK-20260907-3a43da/snapshot-receipt.json
  snapshot_commit: 13082929d79e8813e6f1a1780a4262f1b81f60e8
  snapshot_commit_parent: 51dbb8ed15fb0ff5b4a2b5b19c3ab1158700ba6f
  binding_commit_followup: 5f6fbd42b1a620fe294fccf74343a94a3664ef03

  # =====================================================================
  # INFERENCE PROVENANCE
  # =====================================================================
  inference:
    requested_policy: review-adversarial
    requested_reasoning_effort: xhigh
    runtime: Claude Code (this session)
    resolved_model_id: claude-sonnet-5
    model_verified: false
    model_verified_note: >-
      No `python3 -m orchestration.adapter doctor --probe` was run in this
      session; the model identifier is recorded as reported by the runtime
      environment, not independently probe-verified. Disclosed rather than
      asserted as verified.
    fallback_used: false
    degraded: false
    amazon_bedrock_selected_or_used: false
    independent_session_required: true
    independent_session: true
    independence_note: >-
      This validator session did not produce, snapshot, or otherwise author
      any artifact under TASK-20260907-57d38a or TASK-20260907-3a43da. All
      byte/hash verification below was recomputed independently by this
      session directly against Git objects (`git show <rev>:<path>`,
      `git log`, `git cat-file`, `sha256sum`), not copied from the
      producer's recovery-report.md prose.

  # =====================================================================
  # SNAPSHOT-COMMIT INTEGRITY (Coordinator archive, TASK-20260907-3a43da)
  # =====================================================================
  snapshot_archive_checks:
    - check: commit_exists_and_reachable
      commit: 13082929d79e8813e6f1a1780a4262f1b81f60e8
      independently_verified: "git cat-file -t -> commit; git merge-base --is-ancestor <sha> HEAD -> ancestor"
      status: passed
    - check: parent_matches_declared
      declared_parent: 51dbb8ed15fb0ff5b4a2b5b19c3ab1158700ba6f
      independently_verified: "git rev-parse 13082929d...^  -> 51dbb8ed15fb0ff5b4a2b5b19c3ab1158700ba6f"
      status: passed
    - check: path_sha256_all_match
      paths_checked: 3
      details: >-
        All three declared path_sha256 entries (preservation-package.json
        1dd987c2..., recovery-report.md c92c00de..., snapshot-receipt.json
        8ef0180a...) were independently recomputed via
        `git show 13082929d:...<path> | sha256sum` and matched exactly; the
        same three files' current on-disk bytes also match exactly (zero
        drift).
      status: passed
    - check: exact_changed_path_set
      note: >-
        Commit 13082929d is a combined snapshot for six goals (ENDO, ICEX,
        SIG, MCE, MD5, MLKEM-005) in one Coordinator-isolated commit; 24
        files changed total. For this goal's four files (dispatch_queue.json,
        preservation-package.json, recovery-report.md, snapshot-receipt.json)
        the diff contains exactly those and nothing else under BATCH-f1f479.
      status: passed
    - check: commit_message_names_declared_record_ids
      declared_record_ids: [GOAL-MD5-001, BATCH-f1f479, TASK-20260907-3a43da, TASK-20260907-57d38a]
      found_in_commit_message: >-
        GOAL-MD5-001 and BATCH-f1f479 appear on the "Record IDs:" line;
        TASK-20260907-3a43da and TASK-20260907-57d38a both appear on the
        "Task IDs:" line of the same commit message. All four present.
      status: passed
    - check: receipt_self_reference_resolution
      finding: >-
        snapshot-receipt.json as committed (and as currently on disk) records
        commit_sha: null, parent_sha: null -- this is CORRECT, not a defect:
        a content-first receipt cannot name its own containing commit at the
        moment it is written (chicken-and-egg). The actual commit_sha/
        parent_sha binding lives in the dispatch_queue.json archive block and
        was filled in by a separate, later, disclosed follow-up commit
        5f6fbd42b1a620fe294fccf74343a94a3664ef03 ("coord: bind commit shas
        for 6 custody-batch snapshot archives"), which touches ONLY the six
        dispatch_queue.json files (3 line-diff each: state + 2 sha fields)
        and does not alter any preserved byte. Independently verified: this
        follow-up commit is reachable from HEAD, and its diff for
        BATCH-f1f479/dispatch_queue.json is exactly the state:queued->completed
        and commit_sha/parent_sha:null->13082929d.../51dbb8ed15... edit, with
        path_sha256 unchanged.
      status: passed_no_defect

  # =====================================================================
  # PRESERVATION-PACKAGE.JSON: INDEPENDENT PER-ENTRY RE-VERIFICATION
  # =====================================================================
  method: >-
    A from-scratch Python/git script (not derived from or trusting the
    producer's recovery-report.md prose) was run against the live repository
    for every one of the 42 entries in preservation-package.json. For each
    entry it: (1) independently enumerated every commit touching the path via
    `git log --format=%H -- <path>` and compared the oldest/newest commit to
    the entry's declared source_revision/current_revision; (2) fetched the
    exact blob bytes at source_revision and current_revision via
    `git show <rev>:<path>` and recomputed sha256, comparing to the declared
    historical_sha256/current_sha256; (3) recomputed byte-equality of the two
    blobs and compared to the declared identical_historical_and_current flag;
    (4) base64-decoded current_base64 (always) and historical_base64 (when
    present) and compared the DECODED BYTES -- not just a hash -- against the
    independently fetched git blobs; (5) checked historical_base64 is present
    iff identical_historical_and_current is False, matching the producer's
    stated omission convention; (6) read the current on-disk file directly
    and compared its sha256 to current_sha256 (dirty-tree/drift check); (7)
    independently recomputed commit_count_touching_path.
  entries_checked: 42
  entries_with_any_issue: 0
  hash_mismatch_count: 0
  path_map_mismatch_count: 0
  base64_decode_mismatch_count: 0
  identical_flag_wrong_count: 0
  on_disk_drift_count: 0
  commit_count_mismatch_count: 0
  metric_recomputations:
    - quantity: entries[*].historical_sha256 vs git blob sha256 at source_revision
      recomputed_for: 42 entries
      matches_report: true
    - quantity: entries[*].current_sha256 vs git blob sha256 at current_revision
      recomputed_for: 42 entries
      matches_report: true
    - quantity: entries[*].current_base64 decode vs git blob bytes at current_revision
      recomputed_for: 42 entries (full byte comparison, not hash-only)
      matches_report: true
    - quantity: entries[*].historical_base64 decode vs git blob bytes at source_revision
      recomputed_for: 26 entries where identical_historical_and_current is False
      matches_report: true
    - quantity: entries[*].identical_historical_and_current
      recomputed_for: 42 entries
      matches_report: true
    - quantity: entries[*].commit_count_touching_path
      recomputed_for: 42 entries
      matches_report: true
    - quantity: current on-disk file bytes vs current_revision git blob
      recomputed_for: 42 entries
      matches_report: true (zero drift)

  artifact_checks:
    - check: read_scope_coverage
      description: >-
        Extracted the 40 concrete file paths from TASK-20260907-57d38a's
        declared read_scope (excluding two bare directory entries) and
        compared against the union of preservation-package.json's 42
        resolved entries plus its 1 unresolved_or_missing entry (43 total).
        All 40 read_scope files are covered; zero read_scope files were
        silently dropped.
      status: passed
    - check: objective_named_additions
      description: >-
        The package additionally captures three paths not in the literal
        read_scope list -- ledger/decisions/DEC-20260822-d7c2d0.yaml,
        ledger/evidence/EV-MDFIVE-b0def7.yaml, and
        experiments/EXP-MDFIVE-8f0fe3/specification.yaml -- which the
        handoff's own objective text explicitly names ("actual
        DEC-20260822-d7c2d0 EV-MDFIVE-b0def7 EXP-MDFIVE-8f0fe3"). This is
        read-only, non-mutating, and directly authorized by the task card's
        own objective (which is the handoff block, per this task's
        instructions); it is not scope creep. Independently re-verified: all
        three trace to the single commit fde5cad892867b4eb2ae784da7d534839b091c85,
        with sha256 matches at that commit and zero on-disk drift.
      status: passed_with_note
      note: >-
        Minor documentation-completeness gap: the Coordinator's read_scope
        list for TASK-20260907-57d38a could have named these three paths
        explicitly rather than relying on objective prose alone. Not a
        producer defect.
    - check: named_historical_revisions_verified block
      description: >-
        Independently re-derived every sub-claim in the package's
        named_historical_revisions_verified block: (a) snapshot commit
        55e316276085f9645b0bb145862e82dc4a81c9de exists and its first parent
        is exactly 9b79ac28714089ebc4b6dcf08ef5c01cf7a34468 (`git rev-parse
        <sha>^`); (b) coordination/.../TASK-20260822-767bb1/execution-report.yaml
        exists at the snapshot commit (sha256
        4967c41412b189966f4ff4160ac0843de9df4719173ec1d4bc65c9409a828e2f)
        and is absent at the parent; (c) harness/run_md4_seed_sweep.py exists
        at the snapshot commit (sha256
        4aa7b6f0c5d5c7883a463aebc9f49edf8581e64ad1bf4eeee4fa78b34a2b0fe9) and
        is absent at the parent -- both files are therefore genuinely
        introduced exactly at the snapshot commit, not merely re-touched;
        (d) the b325fe receipt commit f1f07a7e5f31054479ede7b4d45fc9f71584b25c's
        first parent is exactly the snapshot commit 55e316276...; (e) the
        intake.md-claimed queue sha256
        63c8213613428492835e99e1eb163490329f3b11e0cf9061059af2973b39ae31
        matches the committed HEAD copy of BATCH-ebac02/dispatch_queue.json,
        the current on-disk copy, and the frozen
        BATCH-f1f479/original-dispatch-queue.json copy, byte-for-byte
        (`diff` empty).
      status: passed
    - check: unresolved_or_missing (TASK-20260822-87c429 red-team-report.yaml)
      description: >-
        Independently ran `git log --format=%H -- <exact path>` and confirmed
        zero commits ever touched this path in the full (non-shallow) local
        history, and confirmed the path is absent from the current working
        tree (`os.path.exists` false). This exactly matches the producer's
        claim and the batch-ebac02 dispatch queue's own note that the
        TASK-20260822-87c429 session died on its final synthesis turn before
        writing a report. Per AGENTS.md rule 5 / this task's constraints,
        this genuine absence is an infrastructure fact, not fabricated, not
        backfilled from a successor task's report, and not treated as
        negative scientific evidence about anything.
      status: passed_confirmed_genuinely_missing

  # =====================================================================
  # CONTROL: DELIBERATE MISMATCH REJECTION (constructed in-session only,
  # never written to any file, per task instruction)
  # =====================================================================
  control_checks:
    - control: bad_hash_rejection
      description: >-
        Took a real, already-verified entry (AGENTS.md at its declared
        current_revision), computed its true sha256 from the git blob, then
        constructed a deliberately wrong sha256 (one hex digit flipped) held
        only in an ephemeral Python process (never written to disk/repo).
        Confirmed the equality-comparison logic used throughout this review
        correctly flags it as a mismatch rather than silently accepting it.
      result: REJECTED as expected
      status: passed
    - control: bad_path_map_rejection
      description: >-
        Constructed, in the same ephemeral process, a deliberate path
        mislabeling -- claiming agents/validator.md's byte content at HEAD
        was AGENTS.md's content at the same commit -- and confirmed the
        comparison logic (fetch git blob for the claimed path, compare
        sha256 to the mislabeled content's sha256) correctly flags the
        mismatch.
      result: REJECTED as expected
      status: passed
    - control: independent_git_blob_comparison
      description: >-
        Every hash/byte comparison in this review was sourced fresh from
        `git show <rev>:<path>` in this validator's own session, never from
        the producer's recovery-report.md prose or preservation-package.json's
        own restated commit history. Independent enumeration of commit
        history (git log) also matched the producer's claimed
        source_revision/current_revision for all 42 entries.
      status: passed
    - control: original_bytes_unchanged
      description: >-
        This review made zero writes under
        coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/tasks/TASK-20260907-57d38a/
        or /archives/TASK-20260907-3a43da/. `git status --short` shows no
        dirty paths anywhere under GOAL-MD5-001 at review time.
      status: passed

  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []

  # =====================================================================
  # OVERALL VERDICT
  # =====================================================================
  verdict: passed
  verdict_reason: >-
    Every preserved byte/hash in preservation-package.json (42 resolved
    entries) was independently re-derived from Git and from current on-disk
    files by this validator, with zero mismatches of any kind: source/current
    revision identity, historical/current sha256, base64-decoded byte
    content, the identical_historical_and_current flag, commit-touch counts,
    and on-disk drift all match exactly. The one unresolved_or_missing path
    (TASK-20260822-87c429's red-team-report.yaml) is independently confirmed
    genuinely absent from all of git history and the working tree, matching
    the producer's claim and the batch's own contemporaneous note that the
    run died before writing output -- correctly preserved as a missing
    object, not fabricated or backfilled. The three named historical
    revisions (snapshot commit, its parent, the b325fe receipt commit) and
    their boundary-introduction claims for execution-report.yaml and
    harness/run_md4_seed_sweep.py are independently confirmed exactly.
    Read-scope coverage is complete (all 40 concrete read_scope files
    preserved); the three additional paths captured beyond the literal
    read_scope list are explicitly authorized by the task's own objective
    text and independently verified as byte-faithful. The Coordinator's
    snapshot archive (TASK-20260907-3a43da) is verified content-first: commit
    reachable, parent correct, all three declared hashes match, and the
    receipt's own null commit_sha/parent_sha is correctly resolved by a
    disclosed, non-mutating follow-up binding commit rather than being a
    defect. The deliberate-mismatch controls (bad hash, bad path map),
    constructed only in this session's ephemeral memory and never persisted
    to any file, were both correctly rejected by the same comparison logic
    used throughout, corroborating that the "zero mismatches" finding above
    is a real absence of defects rather than a blind spot in the check
    itself. The custody package is faithful and complete over its declared
    and objective-named scope.

  limitations:
    - >-
      This is a custody-fidelity verdict only. It asserts nothing about
      GOAL-MD5-001's scientific claims (H-MDFIVE-*), does not re-adjudicate
      any preserved review verdict (V1-V4, red-team/blind-rederivation
      reports, DEC-20260822-d7c2d0, EV-MDFIVE-b0def7, EXP-MDFIVE-8f0fe3), and
      does not authorize any status change, promotion, or closure.
    - >-
      DEC-20260823-4c072b was, by the producer's own disclosure and this
      task's read_scope, out of scope and was not independently opened or
      verified by either the producer or this review, even though it is
      referenced in the batch-ebac02 queue's own note. This is a declared
      scope boundary, not a missing-object impediment.
    - >-
      The handoff objective text for this task ("For MCE, a valid custody
      package cannot discharge missing report/citation remediation or the
      required scientific review") names a different goal (GOAL-MCE-001)
      than this batch (GOAL-MD5-001). This is almost certainly a template
      artifact from the six-goal simultaneous custody operation recorded in
      commit 13082929d (ENDO/ICEX/SIG/MCE/MD5/MLKEM-005 were all processed
      together); flagged here for the Coordinator's awareness, not treated
      as a defect in this review's own scope, and not corrected by this
      task (which may only write under its own write_scope).
    - >-
      No probe-based model verification (`orchestration.adapter doctor
      --probe`) was run in this session; resolved_model_id is recorded as
      reported by the runtime rather than independently probe-verified. No
      fallback or degradation occurred and none is claimed.
    - >-
      This review did not re-examine the substantive correctness of the
      historical review verdicts the package preserves (e.g. whether V1-V4's
      own recomputations were themselves correct); that was already the
      subject of independent review at the time those verdicts were
      produced, and re-litigating it is outside this custody task's declared
      scope.

  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/reviews/TASK-20260907-d7e312/validation-report.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-f1f479/reviews/TASK-20260907-d7e312/runtime-session-receipt.json
