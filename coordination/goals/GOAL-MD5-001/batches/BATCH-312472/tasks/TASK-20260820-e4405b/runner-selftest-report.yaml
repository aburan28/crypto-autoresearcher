  # =====================================================================
  # SELF-TEST SUITE (deliverable: the evidence this task produces)
  # =====================================================================
  selftest_suite:
    suite_path: coordination/goals/GOAL-MD5-001/batches/BATCH-312472/tasks/TASK-20260820-e4405b/selftest.py
    machine_readable_results: coordination/goals/GOAL-MD5-001/batches/BATCH-312472/tasks/TASK-20260820-e4405b/selftest-results.json
    python: '3.12.8'
    all_pass: true
    exit_code: 0

    precondition:
      name: pinned pair distinct at runtime (re-check of the pin's independence claim)
      observed:
        impl1_type: HASH            # _hashlib.HASH
        impl3_type: md5             # _md5.md5
        distinct_types: true
        empty_string_vector_agree: true   # d41d8cd98f00b204e9800998ecf8427e both
      pass: true

    objects:
      - id: T1
        name: known-false real crypto — two messages with different MD5 digests, claimed digest = the real MD5(m1)
        label: real crypto, production dispatch (pinned pair)
        object:
          messages: ["68656c6c6f20776f726c64", "676f6f6462796520776f726c64"]  # "hello world" / "goodbye world"
          digest: "5eb63bbbe01eeed093cb22bb8f5acdc3"   # real MD5("hello world")
          implementations: [IMPL-1, IMPL-3]
        expected: {verified: false, checks: [digest_mismatch_impl1_m2, digest_mismatch_impl3_m2]}
        observed: {verified: false, verifier: independent-recompute,
                   checks: [digest_mismatch_impl1_m2, digest_mismatch_impl3_m2]}
        pass: true
        bcp2_pin_mechanism_recorded:
          distinct: true
          IMPL-1: {module_file: ".../lib-dynload/_hashlib.cpython-312-darwin.so", runtime_type: _hashlib.HASH}
          IMPL-3: {module_file: ".../lib-dynload/_md5.cpython-312-darwin.so", runtime_type: _md5.md5}
        bcp2_verified_by_wrapper_populated:
