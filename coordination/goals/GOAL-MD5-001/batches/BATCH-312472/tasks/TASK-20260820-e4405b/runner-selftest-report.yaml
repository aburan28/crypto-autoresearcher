      id: T8
      name: legacy write_run path — explicit caller started/finished still produce the old formula and the old manifest shape
      run_id: RUN-MD5CERT-selftest-legacy
      manifest_path: coordination/goals/GOAL-MD5-001/batches/BATCH-312472/tasks/TASK-20260820-e4405b/selftest-runs/EXP-MD5CERT-e4405b/runs/RUN-MD5CERT-selftest-legacy/manifest.yaml
      caller_supplied: {started: 1000.0, finished: 1000.001}
      observed:
        wall_seconds: 0.001           # = round(finished - started, 6), the old formula
        timing_source_present: false  # no new key on the legacy path
        started_at: '1970-01-01T00:16:40+00:00'
        finished_at: '1970-01-01T00:16:40.001000+00:00'
      checks:
        old_formula_finished_minus_started: true
        no_timing_source_key: true
        started_at_matches_caller_epoch: true
        finished_at_matches_caller_epoch: true
      pass: true

  # =====================================================================
  # COVERAGE BOUNDARY (stated, not hidden)
  # =====================================================================
  coverage_boundary:
    id: T6
    status: OPEN
    statement: >-
      The end-to-end true path — a GENUINE colliding pair (m1 != m2 with
      MD5(m1) == MD5(m2)) verified by two real independent implementations
      through the production dispatch — is UNTESTED within this budget.
      Generating a genuine MD5 collision pair is infeasible here (no
      collision search was run, and none is possible within 600 s / 2 GB /
      2 runs), and the quarantined pair is FORBIDDEN to this task. The true
      path is therefore tested at logic level only (T5, mock, explicitly
      labelled), and the end-to-end true path is named OPEN. It becomes
      testable only when a future calibration run's closed input manifest
      declares the quarantined pair (or a genuine pair is otherwise
      produced), per BCP-1/BCP-2.
    also_open:
