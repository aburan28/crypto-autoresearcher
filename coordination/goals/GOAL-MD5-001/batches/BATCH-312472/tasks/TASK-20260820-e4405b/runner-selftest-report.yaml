  # =====================================================================
  # IMPLEMENTATION (deliverable 1: the harness/runner.py change)
  # =====================================================================
  implementation:
    files_changed:
      - harness/runner.py
    change_type: additive
    diff_summary: >-
      191 insertions, 3 deletions; the 3 deleted lines are exactly the
      replaced lines (the old write_run signature line, the old
