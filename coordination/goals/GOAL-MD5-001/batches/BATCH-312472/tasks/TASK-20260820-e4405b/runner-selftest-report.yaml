      No existing code path was rewritten.
    git_state_at_work:
      branch: md5-001-927ab5-archive-20260819
      head: 15359a58c
      dirty: true   # this task's own uncommitted change (nothing is committed;
                    # TASK-20260820-513ea9 snapshots these bytes)

    # ------------------------------------------------------------------
    # EXACT NEW API
    # ------------------------------------------------------------------
    new_api:
      certificate_kind:
        kind: md5_collision_pair
        dispatch: >-
          harness/runner.py::_verify() now routes kind == "md5_collision_pair"
          to _verify_md5_collision_pair(cert) and returns
          (verified, "independent-recompute"); failing checks are attached to
          the certificate as cert["failing_checks"] and surfaced in the
          manifest's run.result.certificate.failing_checks (additive key,
          absent when no check fails).
        schema:
          kind: md5_collision_pair
          statement:
            messages: [m1_hex, m2_hex]     # hex strings, exact bytes
            digest: <hex>                  # the claimed common MD5 output
            implementations: [IMPL-1, IMPL-3]   # the pinned pair, exactly
        rule: >-
          MD5(m1) and MD5(m2) are computed with BOTH pinned implementations
          (four digests). verified: true ONLY if m1 != m2 AND all four
          digests equal the claimed digest. Otherwise verified: false with
          every failing check named, as applicable: m1_equals_m2 /
          digest_mismatch_impl1_m1 / digest_mismatch_impl1_m2 /
          digest_mismatch_impl3_m1 / digest_mismatch_impl3_m2 /
          implementations_disagree.
        structural_check_names: >-
          Malformed-field failures are named separately (documented in the
          function docstring): missing_statement / invalid_messages /
          invalid_hex:<field> / implementations_not_pinned_pair. A
          pin-mechanism distinctness failure (BCP-2, INV-13) is named
          pinned_pair_not_distinct.
        pinned_implementations:
          IMPL-1:
            code_path: "hashlib.md5(data, usedforsecurity=False)"
            runtime_type_observed: _hashlib.HASH
            module_file_observed: /Users/adamburan/.pyenv/versions/3.12.8/lib/python3.12/lib-dynload/_hashlib.cpython-312-darwin.so
            links: OpenSSL libcrypto (per implementation-pin.yaml)
          IMPL-3:
            code_path: "_md5.md5(data)  (top-level extension module in this build)"
            runtime_type_observed: _md5.md5
            module_file_observed: /Users/adamburan/.pyenv/versions/3.12.8/lib/python3.12/lib-dynload/_md5.cpython-312-darwin.so
            links: libSystem only, NOT libcrypto (per implementation-pin.yaml;
                   otool -L re-confirmed in this session)
          distinctness: >-
            The two are distinct imports producing distinct runtime types
            (re-verified at run time by the pin-mechanism check, T1/T10).
            They are not aliased: the registry maps each pinned name to its
            own code path, and the pin-mechanism check probes those same
            callables.
          import_note: >-
            The pin's `source` field says "hashlib._md5", but in this build
            `hashlib` is a flat module (not a package), so the extension is
            imported as the top-level module `_md5`. The loaded .so is the
            exact file the pin's `path` field names
            (lib-dynload/_md5.cpython-312-darwin.so); otool -L on it shows
            libSystem.B.dylib only, matching the pin's independence claim.
        wrapper_populated_fields:
          verified_by: >-
            WRAPPER-POPULATED ONLY (BCP-2 J5 fix): any solver-provided
            verified_by is cleared and replaced exclusively with the
            wrapper's own recomputation — per implementation,
            {implementation, computed_digest_m1, computed_digest_m2}
            (four digests). Lands in raw-result.json with the certificate.
          pin_mechanism: >-
            Recorded at run time (BCP-2 pin_mechanism_requirement): per
            implementation, the module __file__ the import resolved to and
            the runtime type of the produced hash object, plus the
            distinctness assertion (distinct: true/false). A failure makes
            the certificate verified: false (check pinned_pair_not_distinct,
            INV-13) and the run completed_invalid.
        failed_certificate_consequence: >-
          A failed md5_collision_pair certificate makes the run
          completed_invalid (valid: false, "certificate failed independent
          verification") — the existing runner.py rule, extended to the new
          kind per BCP-1/BCP-2 independence_rule (invalid_measurement, not a
          negative_observation).
        cairn_cross_check: >-
          md5_collision_pair is not in tools/cairn_bridge.SUPPORTED_KINDS
          ({discrete_log, decomposition}), so _cairn_cross_check returns
          None for it: no cairn dependency, nothing recorded — same as kind
          "none".
      wrapper_timing:
        new_entry_point: >-
          run_wrapped(exp_id, exp_area, fn, *, status, command,
                      out_root=None) -> str
        semantics: >-
          `fn` is the experiment's run function and must return a RunResult.
          The wrapper samples time.monotonic() immediately before and
          immediately after the call (BY THE WRAPPER, not the caller) and
          writes wall_seconds = t1 - t0 into run.timing.wall_seconds with
          run.timing.timing_source: wrapper. The wrapper's own wall-clock
          readings (time.time()) fill started_at/finished_at. Callers of
          run_wrapped have NO started/finished parameters to supply, so a
          fabricated caller bracket cannot land in the record.
        write_run_signature_change: >-
          write_run(exp_id, exp_area, result, *, status, command, started,
          finished, out_root=None, wall_seconds=None, timing_source=None)
          — two new keyword-only OPTIONAL parameters. When wall_seconds is
          None (every existing caller), the manifest timing block is
          byte-identical to the pre-change behavior (wall_seconds =
          round(finished - started, 6), no timing_source key). When
          run_wrapped calls it, wall_seconds is the monotonic delta and
          timing_source is "wrapper".
        trust_rule: >-
          Caller-supplied started/finished are no longer trusted for NEW
          runs: new runs go through run_wrapped, which measures itself.
          Existing records remain readable and immutable under the old API
          (policy, not a defect to fix retroactively — BCP-2 legacy_records).

