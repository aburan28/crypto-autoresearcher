          impl1_digest_m1: "5eb63bbbe01eeed093cb22bb8f5acdc3"   # = real MD5(m1)
          impl3_digest_m2: "0949f7eb1f66dad39d488d5d22531166"   # = real MD5(m2)

      - id: T2
        name: tampered digest — first hex digit of MD5(m1) flipped, claimed against the same non-colliding pair
        label: real crypto, production dispatch (pinned pair)
        object:
          messages: ["68656c6c6f20776f726c64", "676f6f6462796520776f726c64"]
          digest: "6eb63bbbe01eeed093cb22bb8f5acdc3"   # tampered (5 -> 6)
          implementations: [IMPL-1, IMPL-3]
        expected: {verified: false,
                   checks: [digest_mismatch_impl1_m1, digest_mismatch_impl1_m2,
                            digest_mismatch_impl3_m1, digest_mismatch_impl3_m2]}
        observed: {verified: false,
                   checks: [digest_mismatch_impl1_m1, digest_mismatch_impl1_m2,
                            digest_mismatch_impl3_m1, digest_mismatch_impl3_m2]}
        pass: true

      - id: T3
        name: m1 == m2 — identical messages, correct digest
        label: real crypto, production dispatch (pinned pair)
        object:
          messages: ["68656c6c6f20776f726c64", "68656c6c6f20776f726c64"]
          digest: "5eb63bbbe01eeed093cb22bb8f5acdc3"
          implementations: [IMPL-1, IMPL-3]
        expected: {verified: false, checks: [m1_equals_m2]}
        observed: {verified: false, checks: [m1_equals_m2]}
        pass: true

      - id: T4
        name: single-implementation agreement is insufficient — mock IMPL-1 agrees with the claimed digest on BOTH messages, mock IMPL-3 disagrees on m2 (3 of 4 digests match)
        label: >-
          MOCK implementations, logic level (documented test seam).
          UNPRODUCIBLE with the real pinned pair: both are correct MD5 and
          agree on every input, so no real object exists where one
          implementation agrees and the other does not. The structure
          (the handler unconditionally computes all four digests) makes the
          insufficiency a property of the rule, demonstrated here with a
          mock — not faked, and labelled as such.
        object:
          messages: ["68656c6c6f20776f726c64", "676f6f6462796520776f726c64"]
          digest: "5eb63bbbe01eeed093cb22bb8f5acdc3"
          implementations: [IMPL-1, IMPL-3]   # names as in the certificate;
                                               # the seam substitutes mock code paths
        expected: {verified: false, checks: [digest_mismatch_impl3_m2, implementations_disagree]}
        observed: {verified: false, checks: [digest_mismatch_impl3_m2, implementations_disagree]}
        pass: true

      - id: T5
        name: mock true path — two distinct mock implementations agree on a chosen digest for distinct m1/m2
        label: >-
          MOCK implementations, logic level ONLY. This tests the decision
          logic (m1 != m2 AND all four digests equal claimed -> verified),
          NOT real MD5 agreement. It is NOT evidence that any real pair
          collides, and asserts nothing about MD5.
        object:
          messages: ["68656c6c6f20776f726c64", "676f6f6462796520776f726c64"]
          digest: "abababababababababababababababab"   # chosen, not a real MD5 of either
          implementations: [IMPL-1, IMPL-3]
        expected: {verified: true, checks: []}
        observed: {verified: true, checks: []}
        pass: true

      - id: T9
        name: BCP-2 J5 fix — solver-provided verified_by cleared and replaced by wrapper recomputation
        label: real crypto, production dispatch (pinned pair)
        object:
          messages: ["68656c6c6f20776f726c64", "676f6f6462796520776f726c64"]
          digest: "5eb63bbbe01eeed093cb22bb8f5acdc3"
          implementations: [IMPL-1, IMPL-3]
          verified_by: "solver-provided fake (all-zero digests) — cleared by the wrapper"
        expected: {verified: false, checks: [digest_mismatch_impl1_m2, digest_mismatch_impl3_m2],
                   verified_by_is_wrapper_computed: true}
        observed: {verified: false, checks: [digest_mismatch_impl1_m2, digest_mismatch_impl3_m2],
                   verified_by_equals_fake: false,
                   verified_by_impl1_m1: "5eb63bbbe01eeed093cb22bb8f5acdc3",
                   verified_by_impl3_m2: "0949f7eb1f66dad39d488d5d22531166"}
        pass: true

      - id: T10
        name: BCP-2 pin-mechanism distinctness assertion — real registry distinct, aliased registry not distinct
        label: >-
          Logic level: _md5_pin_mechanism called directly. The dispatch-level
          failure path (verified: false, pinned_pair_not_distinct) is NOT
          exercised end-to-end: it would require aliasing the real pinned
          imports in the production registry, which this task does not do.
          The assertion function itself is tested on both the real and the
          aliased registry.
        object:
          real_registry: runner._MD5_IMPL_FUNCS
          aliased_registry: both entries = runner._md5_impl1_hash
        expected: {real_distinct: true, aliased_distinct: false}
        observed:
          real_distinct: true
          aliased_distinct: false
          real_record:
            IMPL-1: {module_file: ".../lib-dynload/_hashlib.cpython-312-darwin.so", runtime_type: _hashlib.HASH}
            IMPL-3: {module_file: ".../lib-dynload/_md5.cpython-312-darwin.so", runtime_type: _md5.md5}
          aliased_record:
            IMPL-1: {module_file: ".../lib-dynload/_hashlib.cpython-312-darwin.so", runtime_type: _hashlib.HASH}
            IMPL-3: {module_file: ".../lib-dynload/_hashlib.cpython-312-darwin.so", runtime_type: _hashlib.HASH}
        pass: true

