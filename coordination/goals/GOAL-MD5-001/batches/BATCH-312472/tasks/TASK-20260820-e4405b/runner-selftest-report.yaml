      additions_implemented:
        - >-
          verified_by WRAPPER-POPULATED ONLY (BCP-2's J5 fix): implemented
          and covered by T9 (a solver-provided verified_by is cleared and
          replaced by the wrapper's recomputation).
        - >-
          pin_mechanism_requirement (BCP-2): the wrapper records at run time
          the module __file__ and runtime type of each implementation and
          asserts distinctness (failure -> verified: false,
          pinned_pair_not_distinct, INV-13). Implemented and covered by T1
          (recording on the production path) and T10 (assertion logic,
          including the aliased-registry negative case).
      minor_discrepancy_flagged: >-
        BCP-2's pinned_implementations block documents IMPL-3's runtime_type
