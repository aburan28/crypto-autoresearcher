blind_calibration_protocol:
  id: BCP-2
  status: frozen
  frozen_statement: >-
    THIS RECORD IS FROZEN AS OF ITS COMMIT under TASK-20260820-513ea9, which
    occurs BEFORE any blind calibration run is dispatched. That ordering —
    BCP-2 committed before the search it scores — is what makes "blind"
    checkable rather than merely asserted, exactly as BCP-1's ordering made
    its own checks possible. No field under fixed_before_acquisition below may
    be edited after commit. A change to any of them is a new record (BCP-3 or
    later) that supersedes this one by reference, per AGENTS.md immutability
    and the protocol_amendment discipline in agents/coordinator.md. This file
    is BCP-2, the supersession of BCP-1: it carries BCP-1's firewall, ordering
    guarantee, and declared-not-checked list forward in substance, tightens
    the six defects the BATCH-46254b red team and validator named, and states
    section by section (supersedes.delta_table) what changes and what carries
    forward. BCP-1 is immutable and is referenced, never modified.
  id_convention_note: >-
    BCP-<n> is not one of the CLAUDE.md-conventions ID families and is not
    minted with tools/allocate_id.py. Its id is fixed literally by the handoff
    (TASK-20260820-3d26df, deliverable 1: "protocol/BCP-2.yaml"). It lives at
    a declared batch-scoped path
    (coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml)
    rather than under ledger/, in the same spirit as an EXP-* frozen
    specification.yaml, not a ledger status record.
  recorded_at: '2026-08-20'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-312472
  authored_by_task: TASK-20260820-3d26df
  snapshotted_by_task: TASK-20260820-513ea9
  attacked_by_task: TASK-20260820-affeff
  validated_by_task: TASK-20260820-047039

  # ===================================================================
  # SUPERSESSION
  # ===================================================================
  supersedes:
    record: BCP-1
    record_path: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml
    reason: >-
      BATCH-46254b closed (DEC-20260810-1163ec) with BCP-1's blindness
      guarantee ruled PARTIAL (red team TASK-20260810-b9d956) and, as the
      operative consequence F-4, no blind calibration run dispatchable under
      BCP-1: the canonical serialization of
      pre_registered_expected_answer_digest was undefined (the INV-7
      pre-dispatch gate undecidable), the md5_collision_pair certificate kind
      did not exist in harness/runner.py, the null-object "comparable cost"
      discriminator had no tolerance or baseline, a confounded success could
      be recorded as an unqualified pass, wall_seconds was caller-reported,
      and the staging-rules reference was inaccurate. BCP-2 fixes all six and
      carries the firewall forward. BCP-1 is immutable; this is a
      supersession under a new id, never an edit.
    no_loosening_rule: >-
      Every row of delta_table below is labelled tightened or held. There are
      NO loosened rows. A loosening of any BCP-1 firewall element is a
      batch-halting finding (batch.yaml contamination_firewall); if a reviewer
      finds one, the batch HALTs and reports.
    delta_table:
      # direction is one of: tightened | held | loosened. No loosened rows.
      - bcp1_section: header (id, status, frozen_statement, batch_id, task ids)
        bcp2_section: header
        direction: held
        change: >-
          Supersession metadata updated by design (new id BCP-2, new batch
          BATCH-312472, new authoring/snapshot/attack/validate task ids). No
          firewall element changes.
      - bcp1_section: claim_ceiling
        bcp2_section: claim_ceiling
        direction: held
        change: Same ceiling; BCP-2 asserts nothing about MD5.
      - bcp1_section: purpose
        bcp2_section: purpose
        direction: held
        change: >-
          Same purpose; the protocol is now dispatchable (pre-dispatch gate
          mechanically decidable, certificate kind specified).
      - bcp1_section: scope
        bcp2_section: scope
        direction: held
        change: >-
          Same applies_to / does_not_apply_to / dependent_goal_adoption. The
          blind calibration search is STILL not in this batch.
      - bcp1_section: fixed_before_acquisition
        bcp2_section: fixed_before_acquisition
        direction: held
        change: >-
          The four fields (encoding, solver identity/version, seed,
          wall-clock ceiling), the immutability rule, and the
          encoding_provenance_declaration carry forward unchanged.
      - bcp1_section: blind_scoring_rule.rediscovery
        bcp2_section: blind_scoring_rule.rediscovery
        direction: tightened
        change: >-
          BCP-1's four clauses are held; a fifth is added: the pre-dispatch
          gate (pre_dispatch_gate) must have passed for the run's quarantine
          entry before dispatch. A REDISCOVERY-eligible success additionally
          must carry the evidence_record_requirement block (confound_caveat).
      - bcp1_section: blind_scoring_rule.consumption
        bcp2_section: blind_scoring_rule.consumption
        direction: held
        change: >-
          The CONSUMPTION rule and its invalidity condition (INV-2) carry
          forward verbatim in substance: a run whose input_manifest
          intersects the quarantine sha256 list is CONSUMPTION — invalid,
          never a weaker pass.
      - bcp1_section: blind_scoring_rule.what_this_rule_cannot_reach
        bcp2_section: blind_scoring_rule.what_this_rule_cannot_reach
        direction: held
        change: >-
          The parametric channel (model prior knowledge) remains the one
          channel no file-system rule reaches.
      - bcp1_section: collision_certificate_format
        bcp2_section: collision_certificate_format
        direction: tightened
        change: >-
          The schema now fixes the exact field names (messages: [m1, m2],
          digest, implementations: [IMPL-1, IMPL-3]) matching the
          implementation card, names the failing checks, requires
          verified_by to be WRAPPER-POPULATED (cleared of any solver-provided
          value first), and adds the pin_mechanism_requirement a dispatcher
          must verify. Every BCP-1 requirement (two pinned independent
          implementations, four digests, m1 != m2, wrapper recompute) is
          preserved; the field rename is for implementation alignment, not a
          relaxation.
      - bcp1_section: charging_convention
        bcp2_section: charging_convention
        direction: tightened
        change: >-
          The clock choice (compute_only_solver_process_wall_clock) is held;
          the MEASUREMENT is tightened from caller-reported to
          wrapper-measured (monotonic clock around the wrapped call, by the
          wrapper). Caller-supplied started/finished are no longer trusted
          for new runs; existing records remain immutable under the old API.
      - bcp1_section: failed_search_rule
        bcp2_section: failed_search_rule
        direction: held
        change: Carried forward verbatim in substance.
      - bcp1_section: firewall.what_read_scope_alone_cannot_do
        bcp2_section: firewall.what_read_scope_alone_cannot_do
        direction: held
        change: Carried forward; read_scope remains a declaration, not a control.
      - bcp1_section: firewall.read_scope
        bcp2_section: firewall.read_scope
        direction: held
        change: >-
          Carried forward (may_read_once_committed, may_not_read,
          extra_margin_rule). The quarantined payload and its MANIFEST remain
          entirely excluded from the calibration encoding-authoring session's
          read_scope.
      - bcp1_section: firewall.quarantine
        bcp2_section: firewall.quarantine
        direction: held
        change: >-
          The quarantine marker and path carry forward. The payload (sha256
          e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5)
          stays where it is; BCP-2 does not move, re-pin, or re-read it.
      - bcp1_section: firewall.expected_answer_digest
        bcp2_section: firewall.expected_answer_digest / pre_dispatch_gate
        direction: tightened
        change: >-
          The canonical serialization is now PINNED byte-for-byte with its
          exact command (the serialization the committed MANIFEST already
          declares), the pre-registered value is recorded, and the
          pre-dispatch gate is mechanically decidable: the dispatcher
          recomputes the digest and compares it to the pre-registered value;
          a disagreement HALTs dispatch. The PyYAML version-dependence is
          acknowledged in the protocol.
      - bcp1_section: firewall.closed_hash_manifested_input_set
        bcp2_section: firewall.closed_hash_manifested_input_set
        direction: held
        change: >-
          Carried forward as the checkable boundary. Completeness remains
          DECLARED, NOT CHECKED (a single omitted file nullifies the firewall
          for one contaminated run while the hash-intersection check passes);
          the red team's container-isolation amendment is named as a future
          tightening, not adopted here (infrastructure outside this batch's
          ceiling).
      - bcp1_section: invalidity_conditions
        bcp2_section: invalidity_conditions
        direction: tightened
        change: >-
          INV-1..INV-9 are held verbatim in substance. Four are added:
          INV-10 (a REDISCOVERY-eligible success record missing the required
          confound_caveat / evidence-record fields is invalid), INV-11 (a run
          dispatched under BCP-2 whose wall_seconds is not wrapper-measured is
          invalid), INV-12 (a run dispatched without a passing pre-dispatch
          gate is invalid), INV-13 (a certificate whose pin-mechanism
          distinctness check fails is invalid).
      - bcp1_section: residual_risk
        bcp2_section: residual_risk
        direction: held
        change: >-
          The irreducible channel (model parametric prior knowledge), the
          evidential asymmetry, and the null-object control as the only
          available discriminator carry forward.
      - bcp1_section: null_object_control
        bcp2_section: null_object_control
        direction: tightened
        change: >-
          The variant (permuted round constants / permuted message-schedule
          word order) is held. "Comparable cost" is now a NAMED tolerance
          constant (TOL = 2, a declared ratio) with a NAMED baseline (the
          target run's wrapper-measured wall_seconds), and a DECIDABLE
          DECISION TABLE labels every outcome row with what it shows and what
          it does not show, including the control's known limit (it does not
          separate partial-structure-recall from genuine search).
      - bcp1_section: (none — BCP-1 had no such section)
        bcp2_section: evidence_record_requirement
        direction: tightened
        change: >-
          NEW. Any REDISCOVERY-eligible success must carry a required
          confound_caveat field (partial-structure-recall not excluded by the
          null-object control; the result is REDISCOVERY-eligible under that
          caveat, never an unqualified pass). A record without it is invalid
          (INV-10). BCP-1 let a confounded success be recorded as an
          unqualified pass; BCP-2 does not.
      - bcp1_section: (scattered across sections)
        bcp2_section: declared_not_checked
        direction: tightened
        change: >-
          NEW explicit section. Carries forward every channel BCP-1 declared
          not-checked (input-manifest completeness, encoding provenance,
          read_scope, the parametric channel with its named obstruction) and
          ADDS two (cross-version stability of the pinned serialization;
          staging-rules drift). The list does not shrink.
      - bcp1_section: amendment_and_supersession
        bcp2_section: amendment_and_supersession
        direction: held
        change: >-
          BCP-2 is immutable once committed; a future BCP-3 supersedes by
          reference. A calibration run already dispatched under BCP-1 keeps
          BCP-1's rules for scoring (no retroactive rescoring).
      - bcp1_section: self_report
        bcp2_section: self_report
        direction: held
        change: BCP-2 carries its own self_report (this task's execution).
  # ===================================================================
  # CLAIM CEILING
  # ===================================================================
  claim_ceiling: >-
    THIS RECORD ASSERTS NOTHING ABOUT MD5. It is a record about THIS
    PROGRAM'S OWN PROCESS: it supersedes a scoring protocol and specifies a
    certificate-verification schema for this program's own harness. It
    contains no collision, no preimage, no complexity, no method-ceiling, no
    obstruction, and no comparison against any published result in either
    direction, matching RQ-MDFIVE-6870c1 claim_tier_ceiling and BATCH-312472
    claim_ceiling (protocol_supersession_and_certificate_implementation_only).
    Every figure in RQ-MDFIVE-6870c1 provenance remains UNVERIFIED and is not
    cited here as authority in either direction.

  # ===================================================================
  # PURPOSE
  # ===================================================================
  purpose: >-
    Make the blind calibration run DISPATCHABLE. BCP-1 fixed the scoring
    protocol before the corpus could gain the published path, but its
    pre-dispatch gate was undecidable (no pinned canonical serialization),
    its certificate kind had no implementation to be verified against, its
    null-object discriminator had no tolerance or baseline, it let a
    confounded success be recorded as an unqualified pass, its charging clock
    was caller-reported, and its staging-rules reference was inaccurate. BCP-2
    fixes all six so that a later batch can dispatch the blind calibration
    run under BCP-2 without any further protocol change. The blind
    calibration search itself is NOT in this batch; it opens in batch 3 or
    later, against BCP-2, with its null-object control.

  # ===================================================================
  # SCOPE
  # ===================================================================
  scope:
    applies_to: >-
      Any run dispatched under GOAL-MD5-001 that claims to have (1)
      rediscovered a differential characteristic or message pair for an MD5
      identical-prefix or chosen-prefix collision without being handed the
      published path, or (2) driven such a search to a literal colliding
      pair. This includes the eventual blind calibration search itself and
      the null-object control specified below.
    does_not_apply_to: >-
      TASK-20260810-3e0793 (implementation pinning and RFC 1321 test-vector
      validation — no search, nothing to score blind), TASK-20260810-bde128
      (literature acquisition — not a calibration run), and the two
      BATCH-312472 producer tasks (TASK-20260820-3d26df, this protocol's
      author; TASK-20260820-e4405b, the runner certificate-kind
      implementer). Neither runs a calibration search. THE BLIND CALIBRATION
      SEARCH IS NOT IN BATCH-312472.
    dependent_goal_adoption: >-
      GOAL-SHA1-001's second completion criterion and GOAL-RSA-001's
      completion criteria name a shared charging convention. BCP-2 is
      authored in a form those goals, and GOAL-SHA2-001, GOAL-SHA3-001,
      GOAL-BLAKE-001, GOAL-ASCON-001 and GOAL-SIMSPK-001, CAN adopt — but
      adoption is each goal's own Coordinator decision, made in that goal's
      own record. This file edits no record of any of them and asserts no
      adoption on their behalf.

  # ===================================================================
  # (a) DECLARED-BEFORE-RUN FIELDS  [carried forward from BCP-1, held]
  # ===================================================================
  fixed_before_acquisition:
    note: >-
      The five fields below MUST be declared, filled, and committed in the
      calibration run's task card / specification BEFORE that run is
      dispatched, and BEFORE the run process starts. A run that alters any of
      them after starting is INVALID (see invalidity_conditions, INV-3). This
      protocol does not itself set their values — no calibration run exists
      yet — it fixes the SCHEMA and the immutability rule they must satisfy.
    required_fields:
      encoding:
        description: >-
          The exact representation the characteristic search operates over
          (e.g. which state/message bits are tracked, what a "step" of search
          is, what counts as a candidate characteristic). Recorded as a
          committed specification.yaml or equivalent frozen artifact,
          referenced by path and content hash.
        must_include: encoding_provenance_declaration (see below)
      solver_identity_and_version:
        description: >-
          Exact solver name, source, version or commit, and toolchain,
          recorded with the same independence-of-provenance discipline
          TASK-20260810-3e0793 applies to the two RFC 1321 implementations.
          Pinned by content hash (harness/runner.py source_provenance already
          pins every executed .py source file by sha256 against sys.modules;
          the calibration solver's modules are covered by that existing
          mechanism with no protocol extension needed).
      seed:
        description: >-
          Every source of randomness the search uses (RNG seed for any
          randomized search heuristic, any tie-breaking order) declared
          explicitly. harness/runner.py's RunResult.seed and manifest
          run.inputs.seed already carry this field; BCP-2 requires it be
          non-null for any run claiming rediscovery.
      wall_clock_ceiling:
        description: >-
          The declared budget.wall_clock_seconds ceiling for the search
          process itself, fixed before dispatch, using the charging
          convention defined below in charging_convention. Reaching the
          ceiling HALTs the run; see failed_search_rule.
    immutability_rule: >-
      A run whose encoding, solver identity/version, seed, or wall-clock
      ceiling differs between what was declared at dispatch and what the run
      manifest records at completion is INVALID (INV-3), independent of
      outcome. None of these four fields may be tuned mid-search in response
      to intermediate results.
    encoding_provenance_declaration:
      required: true
      fields:
        authoring_session_read_quarantined_payload: null
        authoring_session_id: null
        statement_template: >-
          "The session that authored this run's encoding [did / did not] read
          any file under coordination/goals/GOAL-MD5-001/quarantine/ or the
          collision-path-specific KN-LIT entry filed by TASK-20260810-bde128,
          before or during encoding authorship."
      how_it_is_used: >-
        A true value on authoring_session_read_quarantined_payload makes the
        run CONSUMPTION (INV-4) regardless of what the run's input manifest
        contains, because the contamination channel is authorship of the
        encoding itself, not merely the solver process's runtime inputs.
      honesty_mechanism_not_technical_control: >-
        STATED PLAINLY: this declaration is self-attested and this runtime
        does not enforce or audit read history (see
        firewall.what_read_scope_alone_cannot_do). It is recorded because a
        false attestation is a fabrication under AGENTS.md rule 5 and SC-1,
        which is a real (if not mechanically enforced) deterrent, not because
        BCP-2 can verify it. The red team's container-isolated-encoding
        amendment (rank 7) is named in declared_not_checked as a future
        tightening, not adopted here.
  # ===================================================================
  # (b) BLIND-SCORING RULE: REDISCOVERY vs CONSUMPTION
  # ===================================================================
  blind_scoring_rule:
    rediscovery:
      definition: >-
        A run is REDISCOVERY, and eligible to be scored, when ALL of the
        following hold: (1) the run's closed, hash-manifested input set
        (input_manifest, defined below) contains no file whose sha256 matches
        any entry in the quarantine MANIFEST; (2)
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded false; (3) the four fixed_before_acquisition fields were
        declared before dispatch and unchanged at completion; (4) any claimed
        collision certificate is the literal pair format below, independently
        re-verified by the run wrapper using BOTH pinned implementations from
        TASK-20260810-3e0793 (never the solver's own internal digest
        computation, and never only one of the two — see
        collision_certificate_format.independence_rule and INV-5); (5) NEW in
        BCP-2: the pre_dispatch_gate passed for this run's quarantine entry
        before dispatch (the dispatcher recomputed the canonical
        serialization digest and it equaled the pre-registered value; see
        pre_dispatch_gate and INV-12).
      outcomes_both_score: >-
        A REDISCOVERY run may still fail to find anything within its
        wall-clock ceiling. Per failed_search_rule and RQ-MDFIVE-6870c1
        constraint 4 / GOAL-MD5-001 completion criterion 1, BOTH a verified
        rediscovered pair and a truthfully reported halt are valid, scorable
        outcomes of a REDISCOVERY run. Only CONSUMPTION is excluded from
        scoring. A REDISCOVERY-eligible SUCCESS additionally must carry the
        evidence_record_requirement block (confound_caveat); see
        evidence_record_requirement and INV-10.
    consumption:
      definition: >-
        A run is CONSUMPTION, and is recorded INVALID rather than a weaker
        pass (RQ-MDFIVE-6870c1 constraint 3, verbatim), when ANY of the
        following hold: (1) the quarantined payload's sha256 (or the sha256
        of any file derived from it) appears in the run's input_manifest; (2)
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded true; (3) the run's raw output or reasoning trace
        (wherever captured) quotes or closely paraphrases the quarantined
        payload's specific values (message words, chaining-value deltas, bit
        conditions) without those values being independently derived within
        the run's own recorded search trace; (4) the encoding was authored by
        a session that had read the collision-path-specific KN-LIT entry
        (see firewall.read_scope, may_not_read).
      RQ_binding_language: >-
        "a run that consumes the published path and then reports success has
        measured nothing and is recorded as invalid, not as a weaker pass"
        (RQ-MDFIVE-6870c1 constraint 3). This protocol implements that rule
        exactly; it does not soften it.
    what_this_rule_cannot_reach: >-
      See residual_risk. This rule scores two MECHANICAL channels
      (solver-process input set; self-attested authoring read history). It
      cannot detect or score a model's PARAMETRIC prior knowledge of a
      published MD5 path, which is a third channel no file-system rule
      reaches.

  # ===================================================================
  # (c) COLLISION CERTIFICATE FORMAT  [tightened]
  # ===================================================================
  collision_certificate_format:
    kind: md5_collision_pair
    note_on_existing_certificate_kinds: >-
      harness/runner.py's certificate discipline implements kind in
      {discrete_log, decomposition, none} (docs/claims-and-verification.md).
      md5_collision_pair is a NEW kind this protocol specifies; it does not
      exist in harness/runner.py's _verify() today. BCP-2 fixes the schema,
      the independence rule, and the pin-mechanism requirement; implementing
      _verify() support for this kind is the work of TASK-20260820-e4405b
      (this batch, RANK 2), and no calibration run may be scored under BCP-2
      before that support exists and is exercised by a real run.
    schema:
      kind: md5_collision_pair
      statement:
        messages:
          - m1: <hex, exact bytes of the first message>
          - m2: <hex, exact bytes of the second message>
        digest: <hex, the claimed common MD5 output>
        implementations: [IMPL-1, IMPL-3]
      requirement: >-
        verified: true ONLY if m1 != m2 AND the MD5 of m1 and of m2, computed
        by BOTH pinned implementations, all four digests equal the claimed
        digest. Formally:
        verified = (m1 != m2)
                   AND (MD5_IMPL1(m1) == digest)
                   AND (MD5_IMPL1(m2) == digest)
                   AND (MD5_IMPL3(m1) == digest)
                   AND (MD5_IMPL3(m2) == digest).
        Otherwise verified: false with the failing check NAMED (see
        failing_checks).
      failing_checks:
        # Named, as applicable; the wrapper records which fired.
        - m1_equals_m2
        - digest_mismatch_impl1_m1
        - digest_mismatch_impl1_m2
        - digest_mismatch_impl3_m1
        - digest_mismatch_impl3_m2
        - implementations_disagree
      verified_by:
        population_rule: >-
          WRAPPER-POPULATED ONLY (the J5 fix). The wrapper's _verify() for
          md5_collision_pair MUST clear any solver-provided verified_by
          before populating it, and populate it exclusively from its own
          recomputation: for each pinned implementation, the computed digest
          of m1 and of m2 (four digests). A verified_by entry that is not
          wrapper-computed is invalid (INV-5). This closes the BCP-1 schema
          gap the red team named: runner.py's write_run() overwrites
          verified/verifier/verifier_commit but NOT verified_by, so a
          solver-provided verified_by would otherwise survive into the final
          manifest.
        entries:
          - implementation: IMPL-1
            computed_digest_m1: <hex, wrapper-computed>
            computed_digest_m2: <hex, wrapper-computed>
          - implementation: IMPL-3
            computed_digest_m1: <hex, wrapper-computed>
            computed_digest_m2: <hex, wrapper-computed>
      verified: null
      verifier: run-wrapper-independent-recompute
      verifier_commit: <git-sha, filled by the run wrapper>
    pinned_implementations:
      source: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-3e0793/implementation-pin.yaml
      IMPL-1:
        name: hashlib.md5 (Python 3.12.8 pyenv)
        source: CPython 3.12.8 hashlib._hashlib (linked against OpenSSL 3.6.3)
        import_path: hashlib  # hashlib.md5
        links: openssl 3.6.3 libcrypto via /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib
        runtime_type: _hashlib.HASH
      IMPL-3:
        name: CPython _md5 C extension
        source: CPython 3.12.8 hashlib._md5
        import_path: _md5  # _md5.md5
        links: /usr/lib/libSystem.B.dylib only — NOT libcrypto/OpenSSL
        runtime_type: _md5.MD5Type
      independence_determination: >-
        The BATCH-46254b validator (VAL-20260820-23e0ea, check 2)
        independently ESTABLISHED that IMPL-1 (hashlib.md5 via OpenSSL
        libcrypto) and IMPL-3 (_md5, CPython standalone C, libSystem only)
        are genuinely independent at the MD5-compression-function level:
        different codebases, different library dependencies (confirmed by
        otool -L). IMPL-1 and IMPL-2 (openssl CLI) are NOT independent (both
        link libcrypto) and IMPL-2 is therefore not part of the pinned pair.
    independence_rule: >-
      RQ-MDFIVE-6870c1 constraint 6 ("collision certificates must be literal
      pairs re-verified independently ... A reported collision without its
      pair is not admissible") and docs/claims-and-verification.md's
      certificate independence rule apply without relaxation: verification is
      performed by the RUN WRAPPER using BOTH pinned implementations from
      TASK-20260810-3e0793, never by the solver's own internal digest
      computation, and never by only one of the two implementations. If
      either implementation computes a mismatching digest for either message,
      verified: false with the failing check named, and the run is
      completed_invalid per the existing runner.py rule for a failed
      certificate (invalid_measurement, not a negative_observation).
    pin_mechanism_requirement:
      why_names_are_not_enough: >-
        A name-based pin ("IMPL-1", "IMPL-3") stops nothing: a future edit
        could alias the second import to the first code path and the names
        would still read IMPL-1/IMPL-3. The import path, the runtime type,
        and the library linkage are the MECHANISM; the names are labels. This
        is the joint the review plan (J2) expects to attack.
      what_a_dispatcher_must_verify_at_dispatch:
        - distinct_import_paths: >-
            The wrapper's two imports resolve to distinct module files
            (per implementation-pin.yaml: _hashlib.cpython-312-darwin.so vs
            _md5.cpython-312-darwin.so). The dispatcher records the resolved
            paths in the dispatch record.
        - distinct_runtime_types: >-
            The hash objects the two imports produce have distinct runtime
            types (_hashlib.HASH vs _md5.MD5Type, per the BATCH-46254b
            validator's check 2). The dispatcher records the runtime types.
        - library_linkage: >-
            otool -L (or the platform equivalent) on both shared objects
            shows IMPL-1 links a crypto library (libcrypto) and IMPL-3 links
            no crypto library (libSystem only), matching the BATCH-46254b
            validator's determination. A linkage change breaks the
            independence determination; dispatch HALTs and reports.
      what_the_wrapper_must_record_at_run_time:
        - the module __file__ of each implementation
        - the runtime type of each produced hash object
        - a distinctness assertion (the two __file__ values differ; the two
          runtime types differ); if the assertion fails, the certificate is
          verified: false and the run is invalid (INV-13).
      recorded_not_just_named: >-
        The dispatcher records the import paths, runtime types, and linkage
        at dispatch; the wrapper records them again at run time. A pin that
        is only a name in the manifest is not a pin.
  # ===================================================================
  # (a) PRE-DISPATCH GATE: PINNED CANONICAL SERIALIZATION  [the load-bearing fix]
  # ===================================================================
  pre_dispatch_gate:
    field: pre_registered_expected_answer_digest
    pre_registered_value: 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002
    source_of_value: >-
      The committed quarantine MANIFEST.yaml
      (coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml,
      quarantine_manifest.entries[0].pre_registered_expected_answer_digest),
      independently recomputed and MATCHED by VAL-20260820-23e0ea check 5e.
      BCP-2 records the value for convenience; the gate compares the
      recomputed digest to the MANIFEST's committed value, and if BCP-2's
      recorded value differs from the MANIFEST's, that is a drift — dispatch
      HALTs and reports.
    pinned_canonicalization:
      definition: >-
        The sha256 of the UTF-8 encoding of
        yaml.safe_dump(payload["path"], sort_keys=True,
        default_flow_style=False), where payload is the quarantined file
        parsed as YAML. Only the clean, unambiguous `path` block (the
        differential characteristic, initial value, and digests) is
        serialized; the `literal_pairs_as_extracted` block is EXCLUDED
        because the source PDF's text layer drops hex digits from some
        message words (see that block's caveat), so it is not a reliable
        serialization target.
      scope: the `path` block ONLY (per the MANIFEST's canonicalization text).
      exact_command: >-
        python3 -c "import yaml,hashlib,sys; d=yaml.safe_load(open(sys.argv[1])); print(hashlib.sha256(yaml.safe_dump(d['path'],sort_keys=True, default_flow_style=False).encode()).hexdigest())" <file>
      where_file_is: >-
        <file> is the quarantined payload
        (coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml).
        The command reads the file in text mode (locale-default encoding);
        the payload is ASCII, so the read encoding is not a byte-drift axis.
        The dump side is explicitly UTF-8 via .encode().
      pinned_verbatim_from: >-
        coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml
        (canonicalization field), byte-for-byte. BCP-2 does NOT choose a
        different serialization: changing the serialization requires a
        superseding MANIFEST record, which this batch's ceiling does not
        cover. If the author had judged the pinned serialization unworkable,
        the batch would have HALTed and reported instead of writing BCP-2.
    gate: >-
      A calibration run may be dispatched only if the dispatcher recomputes
      the canonical serialization of the committed payload's `path` block
      with the pinned command and the digest equals
      2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002 (the
      MANIFEST's value). The dispatcher records the recomputed digest, the
      interpreter version, and the PyYAML version in the dispatch record. If
      the recomputation disagrees, dispatch HALTs and the disagreement is
      reported: the pin or the environment drifted; neither is silently
      "fixed" by re-pinning. A run dispatched without a passing gate is
      invalid (INV-12).
    pyyaml_version_dependence: >-
      ACKNOWLEDGED IN THE PROTOCOL: yaml.safe_dump's output formatting is
      PyYAML-version-dependent. The pin is stable only under a declared
      interpreter + PyYAML version. Cross-version stability is on the
      declared_not_checked list. The gate's digest comparison IS the check:
      if a future PyYAML version bytes the same `path` block differently, the
      recomputed digest will not match the pre-registered value, the gate
      HALTs, and the disagreement is reported. That is the designed behavior,
      not a failure of the gate — a version that changes the bytes has
      changed the pin, and the pin must not be silently re-pinned.
    verification_under:
      - event: VAL-20260820-23e0ea check 5e (BATCH-46254b validator)
        outcome: >-
          Recomputed the pre_registered_expected_answer_digest under the
          MANIFEST's stated canonicalization; result
          2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002,
          MATCH.
        pyyaml_version_recorded: null
        pyyaml_version_note: >-
          That report does not record its session's PyYAML version, so the
          version the digest was verified under is UNRECORDED and is named as
          such (SC-1). The pre-dispatch gate records the interpreter +
          PyYAML version at each recomputation, so the version is captured
          going forward even though it was not captured at verification time.
      - event: this authoring session (TASK-20260820-3d26df)
        outcome: >-
          NOT recomputed — this session has no command execution (no shell /
          no run_commands tool surface), so the digest was not recomputed
          here. The pin is specified from the MANIFEST's committed text and
          the validator's recorded recomputation. Named as such (SC-1).
      - pin_environment_interpreter: >-
          Python 3.12.8 (pyenv), per implementation-pin.yaml — the
          environment the implementation pin was made in. This is the pin
          environment, not necessarily the verification environment; it is
          recorded for provenance, not as a claim that the digest was
          verified under it.

  # ===================================================================
  # (d) CHARGING CONVENTION  [tightened: wrapper-measured wall_seconds]
  # ===================================================================
  charging_convention:
    status: fixed_by_this_record
    clock_chosen: compute_only_solver_process_wall_clock
    clock_held_from_BCP_1: >-
      The clock choice is HELD from BCP-1: compute-only solver-process wall
      clock, EXCLUDING any authoring, review, task-dispatch, coordination, or
      session overhead. This is the unit GOAL-MD5-001 completion criterion 2
      calls a "measured cost anchor," and the unit the dependent goals'
      shared convention must use so the same solver cost reads the same
      across goals that may run under different backends/runtimes.
    measurement: wrapper_measured
    measurement_tightened_from_BCP_1: >-
      BCP-1's charging convention was honest about what it measures
      (compute-only) but the MEASUREMENT was caller-reported: harness/runner.py
      write_run() takes caller-provided started/finished and trusts them
      (the red team's CHARGING surface: a caller can game the clock by
      starting the timer after preprocessing, stopping it before
      postprocessing, or reporting any value). BCP-2 tightens the
      measurement: the wrapper measures wall time itself.
    mechanism: >-
      The run wrapper measures wall time itself: a monotonic clock
      (time.monotonic()) sampled immediately before and immediately after the
      wrapped solver call, BY THE WRAPPER, not the caller. The wrapper writes
      wall_seconds = finished_mono - started_mono into
      run.timing.wall_seconds. The exact API TASK-20260820-e4405b must
      implement: the wrapper takes the solver as a callable (or the run is
      driven through a wrapper entry point that invokes the solver), samples
      time.monotonic() around the call, and writes the difference.
      Caller-supplied started/finished are NO LONGER ACCEPTED for new runs:
      the write_run() path for new runs must not take caller timing, or must
      ignore/override it with the wrapper's own measurement. A run
      dispatched under BCP-2 whose wall_seconds is not wrapper-measured is
      invalid (INV-11).
    legacy_records: >-
      Existing run records remain immutable under the old API
      (caller-reported started/finished). They are not re-measured, not
      re-scored, and not "fixed" retroactively; that is policy, not a defect
      to fix retroactively (review plan J6). The old fields stay readable for
      existing records.
    memory: >-
      peak_rss_bytes, as harness/runner.py already records via
      resource.getrusage(RUSAGE_SELF) in run.resources.peak_rss_bytes. No new
      field required.
    near_collision_block_count: >-
      A required key in a calibration/collision run's run.result.metrics:
      near_collision_blocks (integer, the count of near-collision message
      blocks the search/generation used). This does not exist in any current
      run today; it is specified here as a requirement on the future
      calibration/collision run wrapper, per GOAL-MD5-001 completion
      criterion 2 and RQ-MDFIVE-6870c1's "measured cost anchor" target.

  # ===================================================================
  # (e) FAILED SEARCH RULE  [carried forward, held]
  # ===================================================================
  failed_search_rule: >-
    A search that reaches wall_clock_ceiling, crashes, or is otherwise halted
    before rediscovering a characteristic or driving one to a certified pair
    is a BUDGET OUTCOME about the solver at the declared encoding, seed, and
    ceiling — and is NEVER evidence that no such characteristic or pair
    exists (AGENTS.md rules 3/5/8; RQ-MDFIVE-6870c1 constraint 4; batch.yaml
    SC-4). It is reported as a valid negative_observation (not
    invalid_measurement — the certificate kind is none, there is nothing to
    fail verification) and the dropped search space is named as SCOPE, never
    as an answer. This is a REPORTABLE result about the instrument
    (GOAL-MD5-001 pause_conditions), and per completion criterion 1 of
    GOAL-MD5-001, this outcome is the MORE important of the two possible
    outcomes precisely because of the evidential asymmetry stated in
    residual_risk below.
  # ===================================================================
  # THE FIREWALL  [carried forward; staging reference corrected]
  # ===================================================================
  firewall:
    what_read_scope_alone_cannot_do: >-
      STATED PLAINLY BECAUSE THE HONEST ANSWER IS THAT IT IS NOT SUFFICIENT.
      A task card's read_scope is a Coordinator declaration. AGENTS.md records
      that the api_direct runtime enforces write_scope (refuses a write
      outside it) and restricts commands, and says nothing equivalent about
      reads; this Claude Code runtime enforces neither reads nor writes by
      declaration alone. A reader auditing a finished run cannot tell from a
      task card's read_scope line whether a file was actually opened during
      that session. THE FIREWALL'S REAL LOAD-BEARING ELEMENT IS THEREFORE THE
      SOLVER'S CLOSED, HASH-MANIFESTED INPUT SET (below), which is checkable
      post-hoc from committed bytes, NOT the read_scope declaration, which is
      not. read_scope below is retained because it is still the honest
      statement of INTENT and because a false encoding_provenance_declaration
      against a narrow, explicit read_scope is a clearer fabrication than one
      against no declared boundary at all — but it is a declaration, not a
      control, and this file does not claim otherwise.
    read_scope:
      may_read_once_committed:
        - AGENTS.md, docs/claims-and-verification.md, docs/evidence-and-reproducibility.md
        - BCP-1 (coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml)
          and this file (coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml)
        - the RFC 1321 specification text (primary source, however it is filed)
        - TASK-20260810-3e0793's implementation-pin.yaml and test-vector-report.json,
          and the two pinned implementation source trees they describe
        - the published RFC 1321 test-vector suite (inputs, not attack paths)
      may_not_read:
        - coordination/goals/GOAL-MD5-001/quarantine/** (the quarantined payload
          and its MANIFEST.yaml, entirely)
        - the collision-path-specific KN-LIT entry(ies) TASK-20260810-bde128
          files (identified once minted; excluded even though that entry is
          corpus-safe of literal path data, per the extra-margin rule below)
        - any other running or completed task's raw output that might discuss
          or embed the quarantined digest
      extra_margin_rule: >-
        The collision-path KN-LIT entry is deliberately designed
        (contamination_firewall.resolution_required_of_BCP_1 in batch.yaml) to
        carry bibliography, provenance level, and what the source CLAIMS, with
        NO path data. It is nonetheless excluded from the calibration
        encoding-authoring session's read_scope, because prose describing the
        method (e.g. "uses meet-in-the-middle with differential paths") could
        still bias search direction even without carrying a literal value.
        This margin is a declaration like the rest of read_scope, not a
        control.
    quarantine:
      path: coordination/goals/GOAL-MD5-001/quarantine/
      applies_to: >-
        The published MD5 collision-path PAYLOAD only — a literal differential
        characteristic, message-block values, IHV deltas, or a colliding pair
        obtained from a published source. Bibliography, provenance level, and
        prose description of what a source claims belong in the KN-LIT entry
        under knowledge/literature/, not here.
      marker:
        file_level: >-
          Every file placed under quarantine/ MUST carry, as its first
          top-level key (YAML) or a sibling `<filename>.BCP-1-QUARANTINE.yaml`
          sidecar (for non-YAML payloads), the literal key
          `bcp1_quarantine: true` and a `bcp1_marker` string equal to
          "BCP-1-QUARANTINED-PAYLOAD". (The marker key names are held from
          BCP-1 verbatim; the payload already carries them, verified by
          VAL-20260820-23e0ea check 5d.)
        manifest_file: >-
          coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml, listing
          every quarantined file's relative path, sha256, source KN-LIT id,
          and date quarantined. BCP-2 fixes only its required shape (path,
          sha256, source_kn_lit_id, quarantined_at, and
          pre_registered_expected_answer_digest — the gate field defined in
          pre_dispatch_gate, carried per entry), not its content.
          pre_registered_expected_answer_digest is a DISTINCT field from the
          entry's file-level sha256: it is the sha256 of the canonical
          serialization of the payload's `path` block, not of the file as
          stored.
      payload_sha256: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
      bcp2_does_not_touch_payload: >-
        BCP-2 does not move, re-pin, or re-read the payload. It is specified
        against the MANIFEST's sha256 and canonicalization text, the two
        independent BATCH-46254b reports, BCP-1, and the runner source. The
        author of BCP-2 attests in self_report that the payload was not read.
      corpus_exclusion_is_structural_not_only_declared: >-
        CHECKED, NOT MERELY DECLARED: kb/src/crypto_kb/ingest/repo_corpus.py's
        staging rules (the RULES tuple, line 261; the knowledge/ rules span
        lines 262-269) are explicit globs — 21 in total, covering only
        knowledge/literature/, knowledge/techniques/, knowledge/findings/,
        knowledge/open-problems/, ledger/, experiments/, docs/, and inputs/.
        No rule matches coordination/goals/GOAL-MD5-001/quarantine/**, so
        `crypto-kb stage-repo` structurally cannot stage anything under
        quarantine/ into the retrieval corpus; this is a fact about the
        committed source, verified by reading it (VAL-20260820-23e0ea check
        5f: ENFORCEABLE), not an assumption. CORRECTION OF BCP-1 (DEFECT-4):
        BCP-1 referred to this object as "STAGING_RULES" at lines 262-268;
        the actual variable is RULES (line 261) and the knowledge/ rules span
        lines 262-269. The substance of BCP-1's claim is correct; only the
        reference was inaccurate. What remains DECLARED rather than checked:
        whether a future change to RULES adds a quarantine-matching glob
        (nothing in this repository prevents that; this file is not a
        technical control on future edits to repo_corpus.py — see
        staging_rules_reference.drift_check) and whether any agent manually
        copies quarantined content into knowledge/literature/ (guarded only
        by the invalidity rule INV-6 below and by the snapshot task's
        halt-and-report duty, not by any file-system mechanism).
      quarantine_staging_prohibition: >-
        No snapshot or ledger archive commits any content read from
        quarantine/ into knowledge/literature/ or any other corpus-staged
        path. BCP-2 restates it as an invalidity condition (INV-6) for
        calibration runs specifically: a calibration run whose input_manifest
        or knowledge-retrieval trace pulls from a knowledge/literature/ entry
        that itself (contrary to design) carries quarantined path data is
        CONSUMPTION regardless of that entry's nominal corpus status.
    staging_rules_reference:
      object: >-
        RULES, a tuple of 21 StagingRule globs, in
        kb/src/crypto_kb/ingest/repo_corpus.py (tuple spans lines 261-310;
        the four knowledge/ rules span lines 262-269).
      globs_cover: >-
        knowledge/literature/KN-LIT-*.md, knowledge/techniques/KN-TECH-*.md,
        knowledge/findings/KN-FIND-*.md, knowledge/open-problems/KN-OPEN-*.md,
        ledger/ (evidence, hypotheses, questions, proposals, goals,
        goal-checkpoints, subgoals, decisions), experiments/
        (specification.yaml, analysis.md), docs/*.md, and
        inputs/*/paper_fulltext.md. No glob matches coordination/**.
      sha256_at_freeze: null
      sha256_at_freeze_note: >-
        NOT COMPUTED in this session: this session has no command execution
        (no shell / no run_commands tool surface), so the file's sha256 at
        freeze time could not be computed here and is named as such (SC-1).
        The pre-dispatch gate / snapshot task MUST recompute it (see
        drift_check).
      sha256_last_recorded:
        value: 290dc6f4bf042b7b7e307734bd54ecafdd1a91162dc9955dd3ea0f6516e79bf9
        provenance: >-
          coordination/reconciliation/BATCH-bac554/tasks/TASK-20260812-580e5e/
          implementation-report.yaml (2026-08-12) — the last recorded sha256
          of this file in the repository. NOT recomputed in this session; it
          is a drift detector, not a claim that the file is byte-identical to
          its 2026-08-12 state.
      drift_check: >-
        The pre-dispatch gate (or the snapshot task) MUST recompute the
        sha256 of kb/src/crypto_kb/ingest/repo_corpus.py and verify the RULES
        property: 21 globs, none matching coordination/**. If the recomputed
        sha256 differs from sha256_last_recorded, the dispatcher must
        re-read RULES from source and re-verify the property before dispatch;
        if the property fails (any glob matches coordination/**), dispatch
        HALTs and reports. The property is the check; the hash is the drift
        detector.
    expected_answer_digest:
      field: pre_registered_expected_answer_digest
      definition: >-
        The sha256 of the canonical serialization of the quarantined
        payload's `path` block, computed and recorded BEFORE any calibration
        search runs. A digest scores a result without carrying one: comparing
        a search's output digest to this value never hands the search the
        answer. The canonicalization is PINNED in pre_dispatch_gate
        (pinned_canonicalization); the value is
        2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
      value: 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002
      population: >-
        Populated in the committed quarantine MANIFEST.yaml by
        TASK-20260810-bde128 / its snapshot TASK-20260810-5c819b, and
        independently recomputed and MATCHED by VAL-20260820-23e0ea check 5e.
        NO CALIBRATION RUN MAY BE DISPATCHED under BCP-2 while the
        pre_dispatch_gate has not passed for the corresponding MANIFEST entry
        (INV-12).
    closed_hash_manifested_input_set:
      field: run.inputs.input_manifest
      definition: >-
        The calibration run wrapper MUST construct the solver's ENTIRE input
        directory explicitly — every file the solver process's working
        directory or environment exposes it to read, not merely the .py
        source modules harness/runner.py's existing source_provenance()
        already pins by sha256 (that mechanism covers EXECUTED CODE; this one
        must additionally cover DATA the solver reads: the RFC 1321
        specification text, pinned-implementation constants, any seed file)
        — and record the sha256 of every file in it under
        run.inputs.input_manifest in manifest.yaml, alongside the existing
        run.code.source block.
      this_is_new: >-
        input_manifest as specified does not exist in harness/runner.py today
        (verified in BATCH-46254b by reading write_run(): run.inputs
        currently carries only curve_id, seed, parameters). BCP-2 fixes the
        requirement; implementing it is work for the calibration run wrapper.
        No calibration run may be scored under BCP-2 until a run manifest
        actually carries a complete input_manifest.
      what_is_checked_vs_declared: >-
        CHECKED: whether the recorded input_manifest sha256 set contains any
        hash matching quarantine/MANIFEST.yaml (a reviewer recomputes both
        independently from committed bytes and compares — this is the one
        firewall element this protocol treats as an auditable fact rather
        than a claim). DECLARED, NOT CHECKED: whether input_manifest is
        actually COMPLETE, i.e. whether it truly covers every file the solver
        process could have read (an omitted file is invisible to this check
        by construction) — completeness rests on the run wrapper's own
        implementation being audited. The red team's counterexamples (env-var
        delivery, deleted-after-read, /proc, symlink, git history) stand;
        the red team's container-isolation amendment (rank 4) is the named
        future tightening and is recorded in declared_not_checked, not
        adopted here.
  # ===================================================================
  # INVALIDITY CONDITIONS  [INV-1..INV-9 held; INV-10..INV-13 added]
  # ===================================================================
  invalidity_conditions:
    note: >-
      Consuming the published path (INV-2) is recorded as INVALID, exactly as
      RQ-MDFIVE-6870c1 constraint 3 requires — never as a weaker pass, a
      partial credit, or a "contaminated but informative" result. INV-1..INV-9
      are carried forward from BCP-1 verbatim in substance; INV-10..INV-13
      are new in BCP-2 and implement the six amendments.
    items:
    - id: INV-1
      condition: >-
        The run manifest carries no input_manifest, or an input_manifest that
        does not (on its face) cover every file the solver could read.
    - id: INV-2
      condition: >-
        The quarantined payload's digest (or a digest of any file derived from
        it) appears in input_manifest. This is CONSUMPTION and is recorded
        invalid, never a weaker pass (RQ-MDFIVE-6870c1 constraint 3, exact
        wording carried in blind_scoring_rule.consumption above).
    - id: INV-3
      condition: >-
        Any of the four fixed_before_acquisition fields (encoding, solver
        identity/version, seed, wall-clock ceiling) is absent at dispatch, or
        differs between dispatch-time declaration and completion-time
        manifest.
    - id: INV-4
      condition: >-
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded true, or the declaration itself is absent.
    - id: INV-5
      condition: >-
        A claimed md5_collision_pair certificate was verified by only one
        pinned implementation, by the solver's own internal digest routine,
        by any code path that is not the run wrapper's independent recompute
        using BOTH implementations from TASK-20260810-3e0793, or whose
        verified_by block was not wrapper-populated (a solver-provided
        verified_by that the wrapper did not clear and recompute).
    - id: INV-6
      condition: >-
        The run's input_manifest or knowledge-retrieval trace draws from a
        knowledge/literature/ entry that (contrary to design) itself carries
        quarantined path data, per firewall.quarantine.quarantine_staging_prohibition.
    - id: INV-7
      condition: >-
        The run is dispatched before pre_registered_expected_answer_digest
        is populated in the corresponding quarantine MANIFEST.yaml entry.
        (Held from BCP-1; under BCP-2 the populated value is
        2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002 and
        the gate that checks it is pre_dispatch_gate.)
    - id: INV-8
      condition: >-
        The run reports a rediscovered characteristic or pair without a
        certificate, or reports success with certificate.verified absent or
        false — i.e. any state other than "verified pair" or "truthful halt"
        is invalid. "Truthful halt" here is failed_search_rule's full sense:
        reaching the wall-clock ceiling, crashing, or otherwise halting
        without a certified pair, truthfully reported as a budget outcome, is
        a valid negative_observation and is NOT INV-8. Matching
        failed_search_rule and docs/claims-and-verification.md's rule that a
        failed certificate makes the run invalid_measurement, not a result.
    - id: INV-9
      condition: >-
        The run's raw output or reasoning trace (wherever captured) quotes or
        closely paraphrases the quarantined payload's specific values (message
        words, chaining-value deltas, bit conditions) without those values
        being independently derived within the run's own recorded search
        trace. This is CONSUMPTION (blind_scoring_rule.consumption clause 3)
        and is recorded invalid, never a weaker pass.
    - id: INV-10
      condition: >-
        NEW in BCP-2. A REDISCOVERY-eligible success record is missing any
        required field of evidence_record_requirement — in particular the
        confound_caveat field, or the pre_registered_digest_match,
        clean_input_manifest, or certificate fields. A success record without
        the confound_caveat is invalid, never an unqualified pass.
    - id: INV-11
      condition: >-
        NEW in BCP-2. A run dispatched under BCP-2 whose
        run.timing.wall_seconds is not wrapper-measured (monotonic clock
        around the wrapped solver call, by the wrapper) — i.e. the value is
        caller-reported. Existing records written under the old API are
        immutable and are not retroactively invalid.
    - id: INV-12
      condition: >-
        NEW in BCP-2. A run dispatched under BCP-2 without a passing
        pre_dispatch_gate: the dispatcher did not recompute the canonical
        serialization digest with the pinned command, the recomputed digest
        did not equal the pre-registered value
        (2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002),
        or the dispatch record does not carry the recomputed digest, the
        interpreter version, and the PyYAML version.
    - id: INV-13
      condition: >-
        NEW in BCP-2. A certificate whose pin-mechanism distinctness check
        fails: the two pinned implementations are not distinct at run time
        (aliased import paths or identical runtime types), or the
        dispatcher's dispatch-time pin verification (distinct import paths,
        distinct runtime types, library linkage per the BATCH-46254b
        validator's determination) was not recorded.

  # ===================================================================
  # RESIDUAL RISK  [carried forward, held]
  # ===================================================================
  residual_risk:
    the_irreducible_channel: >-
      MODEL PRIOR KNOWLEDGE. Published MD5 collision paths have been public
      for two decades and are therefore in the training data of any model
      this harness can resolve (orchestration/model-bindings.yaml). The
      contaminated channel is the model's PARAMETERS, not the repository's
      file system. No read_scope line, input_manifest, quarantine marker, or
      staging-rule glob reaches a model's weights. This is stated as a fact
      about the residual risk, not engineered around, because it cannot be
      engineered around within this program's reach.
    consequence_1_evidential_asymmetry: >-
      The calibration is EVIDENTIALLY ASYMMETRIC. A FAILURE (a truthful halt
      under failed_search_rule) is a clean statement about the instrument,
      because recall of the published path could only have helped a solver
      that has access to it via its authoring model — so a clean failure
      rules out both "the solver found it by search" and "the solver found it
      by recall" equally. A SUCCESS is confounded by prior exposure and can
      never be fully de-confounded by any mechanism this file specifies. This
      is an independent reason GOAL-MD5-001 completion criterion 1 is right
      to name the failure outcome as the more important of the two —
      restated here so BCP-2 carries the reasoning, not just the goal head.
      BCP-2 carries the confound FORWARD into the evidence record
      (evidence_record_requirement.confound_caveat), which BCP-1 did not do.
    consequence_2_null_object_control: >-
      THE ONLY AVAILABLE DISCRIMINATOR is a null-object control in the sense
      of docs/inventor-protocol.md section 3 ("run the identical measurement
      against a null object"). Specified below with a named tolerance, a
      named baseline, and a decidable decision table. This batch does not run
      it and claims nothing from it; it is specified now, before any
      calibration run, because the same monotonicity argument that motivates
      freezing the protocol first applies to the control's design.
  # ===================================================================
  # NULL-OBJECT CONTROL (recall-vs-search discriminator)  [tightened]
  # ===================================================================
  null_object_control:
    object: >-
      A shape-matched MD5 variant with permuted round constants (the 64
      T[i] additive constants of RFC 1321 section 3.4) or a permuted
      message-schedule word order per round, keeping the number of steps,
      the per-step rotation amounts, and the overall Merkle-Damgard/ARX
      structure identical to standard MD5. (Held from BCP-1.)
    why_recall_is_worthless: >-
      No published MD5 collision path applies verbatim to a variant whose
      round constants or word order differ from standard MD5 — a
      memorized path's specific bit conditions and message-word values are
      keyed to the exact constants the variant does not use. (Held from
      BCP-1.)
    why_structure_is_nearly_preserved: >-
      The step function, rotation schedule shape, number of rounds, and
      Merkle-Damgard chaining are unchanged, so a genuine differential-search
      instrument that reasons from the specification (rather than recalling a
      specific path) should transfer to the variant at comparable cost,
      absent some MD5-specific structural coincidence the search happens to
      depend on. (Held from BCP-1.)
    protocol: >-
      Run the IDENTICAL instrument, IDENTICAL encoding (adapted only for the
      variant's constants), and IDENTICAL wall-clock ceiling against the
      variant that the blind calibration search uses against standard MD5,
      under the same fixed_before_acquisition and invalidity_conditions
      rules (a variant run has no quarantined payload to consume, so INV-2,
      INV-4, INV-6, and INV-9 are vacuously satisfied for it, but INV-1,
      INV-3, INV-5, INV-8, INV-11, and INV-13 apply unchanged).
    named_tolerance:
      constant: TOL = 2
      definition: >-
        "Comparable cost" means the ratio
        R = variant_wall_seconds / target_wall_seconds lies within
        [1/TOL, TOL] = [0.5, 2.0]. A ratio inside that interval is
        COMPARABLE; a ratio outside it is BEYOND TOLERANCE (R > 2.0: variant
        markedly more expensive; R < 0.5: variant markedly cheaper).
      basis: >-
        HONESTLY A DECLARATION, NOT A MEASUREMENT. There is no cost data yet
        — the calibration is exactly what will produce it — so TOL cannot be
        empirically grounded in this batch. It is chosen wide enough to
        absorb run-to-run variance and machine-load effects while still
        excluding an order-of-magnitude difference. The review plan (J3)
        expects the finding "the tolerance constant is an unjustified
        declaration"; this protocol says so, and that is an acceptable state.
        TOL is a fixed_before_acquisition-style constant: it is declared
        before the runs and may not be tuned after observing outcomes.
    named_baseline:
      baseline: >-
        The TARGET run's own wrapper-measured wall_seconds (the blind
        calibration search against standard MD5, measured under
        charging_convention), at the same declared wall_clock_ceiling, the
        same solver, and the same seed policy. The variant run is compared
        to it. If the target run halts at the ceiling, its cost is the
        ceiling.
      why_this_baseline: >-
        The red team's intrinsic-difficulty confound (the variant may be
        easier or harder than standard MD5) makes an absolute cost
        comparison non-directional; the target run's own measured cost is
        the only baseline available without a separate difficulty
        measurement, which is out of scope for this batch. The baseline is
        NAMED so the comparison is decidable; it does not remove the
        intrinsic-difficulty confound, which the decision table labels.
    cost_definition: >-
      For each run, cost = run.timing.wall_seconds (wrapper-measured per
      charging_convention). If the run halts at the wall-clock ceiling,
      cost = the ceiling.
    decision_table:
      # Every outcome row: target outcome x variant outcome x cost relation,
      # labelled with what it shows and what it does not show.
      - row: R1
        outcome: target SUCCESS, variant SUCCESS, R within [0.5, 2.0] (comparable)
        shows: >-
          The instrument finds a verified collision on the shape-matched
          variant at comparable cost to the target. A memorized full-value
          path would not transfer to the variant (its specific message-word
          values are keyed to the exact constants the variant does not use),
          so this is evidence of genuine search capability.
        does_not_show: >-
          That the target success was not aided by PARTIAL-STRUCTURE-RECALL.
          The differential-path structure (not keyed to the exact constants)
          may transfer to the variant at less than full search cost, so a
          solver that partially recalls the structure and adapts it is
          consistent with this row. THE CONTROL'S KNOWN LIMIT: it does not
          separate partial-structure-recall from genuine search. The target
          success is recorded with the confound_caveat.
      - row: R2
        outcome: target SUCCESS, variant SUCCESS, R > 2.0 (variant markedly more expensive)
        shows: >-
          The instrument succeeds on both, but the variant is markedly harder
          for this instrument.
        does_not_show: >-
          Genuine search. A solver that partially recalls the structure and
          adapts it to the variant at higher cost is consistent with this
          row. Also consistent with the variant being intrinsically harder
          (the intrinsic-difficulty confound — no difficulty baseline exists
          in this batch). Does not exclude recall. THE CONTROL'S KNOWN LIMIT
          applies: partial-structure-recall is not separated from genuine
          search. The target success is recorded with the confound_caveat.
      - row: R3
        outcome: target SUCCESS, variant SUCCESS, R < 0.5 (variant markedly cheaper)
        shows: >-
          The instrument finds the variant collision much more cheaply than
          the target.
        does_not_show: >-
          Genuine search. This is the false-positive-for-recall row the red
          team named: if the variant is intrinsically easier, a genuine
          search would also be cheaper. Without a difficulty baseline, the
          direction is non-informative. Does not exclude recall. THE
          CONTROL'S KNOWN LIMIT applies: partial-structure-recall is not
          separated from genuine search. The target success is recorded with
          the confound_caveat.
      - row: R4
        outcome: target SUCCESS, variant FAIL
        shows: >-
          The instrument succeeds only on real MD5, failing on the
          shape-matched variant at matched budget. This is CONSISTENT WITH
          recall of the real memorized path (full-value recall would fail on
          the variant) rather than search.
        does_not_show: >-
          That recall actually happened. A genuine search that depends on an
          MD5-specific structural coincidence the variant lacks is also
          consistent (why_structure_is_nearly_preserved caveat). Does not
          certify recall; it only fails to rule it out. The target success is
          recorded with the confound_caveat, flagged as the recall-consistent
          row.
      - row: R5
        outcome: target FAIL, variant SUCCESS
        shows: >-
          The instrument fails on real MD5 but succeeds on the variant.
        does_not_show: >-
          Anything about recall of the real path (the target failed, so there
          is no target success to confound). This row is a statement about
          the instrument (the variant is easier for it, or the target search
          was underpowered at this budget). A BUDGET OUTCOME about the solver
          (SC-4), never evidence about MD5.
      - row: R6
        outcome: target FAIL, variant FAIL
        shows: >-
          The instrument found nothing on either object within budget.
        does_not_show: >-
          That no collision path exists for either (SC-4). A clean statement
          about the instrument at the declared encoding, seed, and ceiling.
          Per the evidential asymmetry, this is the cleanest row: a clean
          failure rules out both "found by search" and "found by recall"
          equally.
    known_limit: >-
      THE CONTROL'S KNOWN LIMIT, named: the null-object control discriminates
      full-value-recall from genuine search, but NOT partial-structure-recall
      from genuine search. This limit affects R1, R2, and R3 (the
      variant-success rows): in all three, partial-structure-recall is not
      excluded. This residual is unfixable within the variant approach (red
      team, surface v).
    scope_note: >-
      This control is SPECIFIED, not run, by this batch. It belongs to
      whichever future batch dispatches the blind calibration search itself;
      BCP-2 requires that search be paired with this control in the same or
      the following batch, consistent with CLAUDE.md's requirement that a
      conditional/instrument result be paired with a heuristic-validation-
      style experiment.

  # ===================================================================
  # EVIDENCE-RECORD REQUIREMENT  [new; tightened]
  # ===================================================================
  evidence_record_requirement:
    applies_to: >-
      Any REDISCOVERY-eligible success (a run with a verified
      md5_collision_pair certificate). BCP-1 let such a success be recorded
      as an unqualified pass; BCP-2 requires the confound to be carried
      forward into the record.
    required_fields:
      - pre_registered_digest_match: >-
          The run's output, serialized under the pinned canonical
          serialization (pre_dispatch_gate.pinned_canonicalization), and its
          sha256, compared to the MANIFEST's
          pre_registered_expected_answer_digest; the match status (match /
          no_match) recorded.
      - clean_input_manifest: >-
          The input_manifest sha256 set, the quarantine MANIFEST sha256 list,
          and the intersection (must be empty for REDISCOVERY eligibility).
      - certificate: >-
          The full md5_collision_pair certificate block with verified: true
          and wrapper-populated verified_by.
      - confound_caveat: >-
          REQUIRED. A record without it is INVALID (INV-10). Statement:
          "This success is REDISCOVERY-eligible under the following caveat:
          partial-structure-recall is not excluded by the null-object control
          (the control discriminates full-value-recall from genuine search,
          but not partial-structure-recall from genuine search), and the
          model's parametric prior knowledge of the published path is an
          irreducible channel no file-system mechanism reaches. This result
          is REDISCOVERY-eligible under that caveat, never an unqualified
          pass."
      - null_object_control_result: >-
          The decision-table row (R1-R6) the paired variant run landed on.
          REQUIRED when the control has been run; if the control has not yet
          been run, the record must name it OPEN AND UNATTEMPTED with the
          pairing obligation (same or following batch). The confound_caveat
          is required regardless.
    invalidity: >-
      A REDISCOVERY-eligible success record missing confound_caveat (or any
      other required field) is invalid (INV-10), never an unqualified pass.
  # ===================================================================
  # DECLARED-NOT-CHECKED LIST  [new explicit section; carried forward + extended]
  # ===================================================================
  declared_not_checked:
    note: >-
      Every channel below is DECLARED, NOT CHECKED: no mechanism in this
      program converts it to a check. The list does not shrink relative to
      BCP-1 — every channel BCP-1 declared not-checked appears here, and two
      are added. A false attestation against any of these is a fabrication
      under AGENTS.md rule 5 and SC-1, which is a real (if not mechanically
      enforced) deterrent.
    items:
      - channel: input-manifest completeness
        carried_from: BCP-1 (firewall.closed_hash_manifested_input_set.what_is_checked_vs_declared)
        statement: >-
          Whether input_manifest truly covers every file the solver process
          could have read. A single omitted file (env-var delivery,
          deleted-after-read, /proc, symlink, git history) nullifies the
          firewall for one contaminated run while the hash-intersection check
          passes. Completeness is a process-behavior assertion that no
          post-hoc manifest check can establish.
        named_future_tightening: >-
          The red team's container-isolation amendment (rank 4): the solver
          runs in a container/chroot with no host filesystem or git access;
          the wrapper constructs the entire environment from scratch; the
          manifest is built by enumerating the working directory after solver
          completion. Not adopted in BCP-2 (infrastructure outside this
          batch's ceiling); named so the gap is not lost.
      - channel: encoding provenance
        carried_from: BCP-1 (fixed_before_acquisition.encoding_provenance_declaration)
        statement: >-
          The authoring_session_read_quarantined_payload declaration is
          self-attested; no runtime enforces or audits read history, and no
          session-level read trace is persisted in the repository. The
          deterrent is the fabrication rule, not a control.
        named_future_tightening: >-
          The red team's container-isolated-encoding amendment (rank 7):
          encoding authorship in a container-isolated session with no access
          to quarantine/ or knowledge/literature/, verified by the wrapper.
          Not adopted in BCP-2; named so the gap is not lost.
      - channel: read_scope
        carried_from: BCP-1 (firewall.read_scope)
        statement: >-
          read_scope is a Coordinator declaration that no runtime enforces
          for reads. It is the honest statement of intent, not a control.
      - channel: the parametric channel (model prior knowledge)
        carried_from: BCP-1 (residual_risk.the_irreducible_channel)
        named_obstruction: >-
          MODEL PARAMETRIC PRIOR KNOWLEDGE. Published MD5 collision paths
          have been in the public record for two decades and are in the
          training data of any model this harness can resolve. The
          contaminated channel is the model's PARAMETERS, not the repository's
          file system. No read_scope line, input_manifest, quarantine marker,
          or staging-rule glob reaches a model's weights. Carried forward
          verbatim in substance from BCP-1 and the red team's named
          obstruction.
        statement: >-
          No file-system mechanism reaches a model's weights. The null-object
          control is the only available discriminator, and it is only
          partially discriminating (it does not separate
          partial-structure-recall from genuine search).
      - channel: cross-version stability of the pinned serialization
        carried_from: NEW in BCP-2 (pre_dispatch_gate.pyyaml_version_dependence)
        statement: >-
          Whether yaml.safe_dump bytes the same `path` block identically
          across PyYAML versions is NOT checked in this batch. The pin is
          stable only under a declared interpreter + PyYAML version. The
          pre-dispatch gate's digest comparison is the check: a version that
          changes the bytes fails the gate and HALTs dispatch, which is the
          designed behavior. The version the pre-registered digest was
          verified under is UNRECORDED (VAL-20260820-23e0ea does not record
          its PyYAML version); the gate records the interpreter + PyYAML
          version at each recomputation going forward.
      - channel: staging-rules drift
        carried_from: BCP-1 (firewall.quarantine.corpus_exclusion_is_structural_not_only_declared)
        statement: >-
          Whether a future change to RULES in
          kb/src/crypto_kb/ingest/repo_corpus.py adds a quarantine-matching
          glob is not prevented by any mechanism in this repository. The
          structural exclusion is a fact about the committed source at the
          recorded sha256, not a control on future edits. The
          staging_rules_reference.drift_check requires the dispatcher to
          re-verify the RULES property (21 globs, none matching
          coordination/**) at dispatch.

  # ===================================================================
  # AMENDMENT AND SUPERSESSION
  # ===================================================================
  amendment_and_supersession: >-
    This file is immutable once committed (AGENTS.md rule 2). Any correction —
    including any change to a fixed_before_acquisition field, an invalidity
    condition, the charging convention, the pinned serialization, or the
    null-object tolerance — happens in a new superseding record BCP-3 with its
    own id, never by editing this file's bytes. A superseding record must
    state which BCP-2 fields it changes and why, and any calibration run
    already dispatched under BCP-1 or BCP-2 keeps that protocol's rules for
    scoring purposes (no retroactive rescoring). Re-pinning the quarantined
    payload's pre-registered digest requires a superseding MANIFEST record,
    which is outside this batch's ceiling.

