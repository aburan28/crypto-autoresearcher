  CARRIED FORWARD FROM BCP-1 AND STRENGTHENED. The quarantined payload
  (coordination/goals/GOAL-MD5-001/quarantine/, sha256 e44a3fed…, pre-
  registered digest 2ea0083b… under the serialization BCP-2 pins) remains
  quarantined and remains EXCLUDED from corpus staging by the structural
  property the BATCH-46254b validator verified (the 21 staging globs match
  only knowledge/, ledger/, experiments/, docs/, inputs/). NO TASK IN THIS
  BATCH READS THE QUARANTINED PAYLOAD: BCP-2's author specifies the protocol
  from BCP-1, the two independent reports, and the runner source; the runner
  implementer's self-tests use known-false objects and mock implementations
  only; the reviewers construct their own synthetic objects. The CONSUMPTION
  rule, the closed hash-manifested input set, the pre-registered-answer-
  digest workflow, and the declared-not-checked list (parametric channel,
  named obstruction: model parametric prior knowledge) all carry into BCP-2
  verbatim in substance; BCP-2 may tighten, never loosen, any of them. A
  loosening is a finding that HALTS the batch.

