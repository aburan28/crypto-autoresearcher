claim_ceiling: >-
  protocol_supersession_and_certificate_implementation_only. THIS BATCH
  ASSERTS NOTHING ABOUT MD5. It supersedes a protocol (process, not
  cryptanalysis) and implements certificate-verification code in this
  program's own harness. No collision, no preimage, no complexity, no method
  ceiling, no obstruction, and no comparison against any published result in
  either direction. The blind calibration search is NOT in this batch.

objective: >-
  THE SUPERSESSION BATCH. Make the blind calibration run DISPATCHABLE. RANK 1
  authors BCP-2, a complete superseding protocol record under a new id (BCP-1
  is immutable; a fix is a supersession, never an edit), carrying the ranked
  amendments of DEC-20260810-1163ec F-4 so that BCP-2's pre-dispatch gate is
  mechanically decidable against the committed quarantine state. RANK 2
  implements, in harness/runner.py, the md5_collision_pair certificate kind
  and wrapper-measured wall_seconds that BCP-2's certificate rule and charging
  convention require, with a logic-level self-test suite. RANK 1 and RANK 2
  run concurrently (disjoint write scopes: protocol/ vs harness/). Then one
  isolated snapshot of both, an independent red team on the frozen BCP-2 plus
  runner kind under a pre-committed review plan, an independent validator
  verifying dispatchability, and one isolated ledger archive. THE BLIND
  CALIBRATION SEARCH IS NOT IN THIS BATCH; it opens in batch 3 or later, with
  its null-object control, and only against BCP-2.

