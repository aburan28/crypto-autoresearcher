      guarantee_recovered: >-
        Catches a future single-line aliasing edit before run time,
        rather than only when a certificate is verified. Recovers the
        pin mechanism's preventive guarantee (currently reactive only).
      joint: J2
    - rank: 2
      amendment: >-
        Add a code-level check in write_run that requires
        timing_source="wrapper" for any run with a certificate kind
        other than "none" (calibration runs only), enforcing INV-11 at
        the code level rather than leaving it as a protocol-level rule.
      guarantee_recovered: >-
        Prevents a caller from bypassing run_wrapped and calling
        write_run directly with fabricated timing for calibration runs.
        Recovers the charging independence guarantee for new calibration
        runs at the code level.
      joint: J6
    - rank: 3
      amendment: >-
        Implement the evidence_record_requirement check in the future
        calibration run wrapper: refuse to write a REDISCOVERY-eligible
        success record without the confound_caveat field (and the other
        required fields).
      guarantee_recovered: >-
        Makes confound_caveat machine-checkable at the code level, not
        just the protocol level. Prevents a future wrapper from omitting
        the caveat and recording a confounded success as an unqualified
        pass.
      joint: J5
    - rank: 4
      amendment: >-
        Record the PyYAML version the pre-registered digest was verified
        under (or declare the current version as the pin version), and
        have the pre-dispatch gate refuse dispatch if the recorded
        version differs from the verification version.
      guarantee_recovered: >-
        Closes the cross-version stability gap: the gate would not only
        check the digest but also check that the version matches the one
        the digest was pinned under.
      joint: J1
    - rank: 5
      amendment: >-
        When cost data exists, re-evaluate TOL against measured run-to-run
        variance. If variance is much less than 2x, tighten TOL in a
        superseding BCP-3 record.
      guarantee_recovered: >-
        Makes the tolerance empirically grounded rather than a declaration.
        Does not recover any guarantee in this batch (TOL is a
        fixed_before_acquisition constant), but improves the next batch's
        discriminator.
      joint: J3

  # ===================================================================
  # RESIDUAL-RISK JUDGEMENT (both directions)
  # ===================================================================
  residual_risk_judgement:
    too_pessimistic:
      verdict: no
      basis: >-
        BCP-2's residual risk statements are not too pessimistic. The
        parametric channel (model prior knowledge) is genuinely
        irreducible by any file-system mechanism. The evidential
        asymmetry (success confounded, failure clean) is sound. The
        null-object control's known limit (cannot separate partial-
        structure-recall from genuine search) is a real limit, not an
        overstatement. BCP-2 carries the confound forward into the
        evidence record, which BCP-1 did not do — this is an improvement,
        not a concession.
    too_optimistic:
      verdict: no
      basis: >-
        BCP-2 does not let a confounded success be recorded as an
        unqualified pass (the BCP-1 defect the prior red team named).
        The confound_caveat is a required field (INV-10). The
        evidence_record_requirement applies to all REDISCOVERY-eligible
        successes. The null-object control result must be recorded
        alongside the success (or named OPEN AND UNATTEMPTED). The
        charging convention is wrapper-measured on the new path. The
        pre-dispatch gate is mechanically decidable. The certificate
        kind is implemented. The firewall is at least as strong as
        BCP-1's. The named gaps (cross-version stability, no committed
        test for pin mechanism, TOL unjustified, confound_caveat not
        code-enforced, legacy write_run path) are all acknowledged or
        are natural consequences of the protocol being a specification.
        None is an overclaim.

  # ===================================================================
  # NAMED OBSTRUCTION (if claiming blind calibration is unachievable)
  # ===================================================================
  named_obstruction:
    claim: >-
      Blind calibration is PARTIALLY achievable under BCP-2, not fully
      unachievable. The mechanical channels (input_manifest hash check,
      certificate verification, pre-dispatch gate, wrapper-measured
      timing) are checkable and enforced. The parametric channel is
      irreducible. BCP-2 is dispatchable.
    obstruction: >-
      MODEL PARAMETRIC PRIOR KNOWLEDGE. Published MD5 collision paths
      have been in the public record for two decades and are in the
      training data of any model this harness can resolve. The
      contaminated channel is the model's PARAMETERS, not the repository's
      file system. No read_scope line, input_manifest, quarantine marker,
      staging-rule glob, pre-dispatch gate, or certificate kind reaches
      a model's weights. Carried forward verbatim from BCP-1 and the
      prior red team's named obstruction.
    argument: >-
      BCP-2 closes the five BCP-1 weaknesses (undecidable pre-dispatch
      gate, absent certificate kind, undefined tolerance/baseline,
      confounded success as unqualified pass, caller-reported timing)
      without opening new ones. The parametric channel remains the one
      channel no file-system mechanism reaches, and the null-object
      control is the only available discriminator, with its known limit
      (cannot separate partial-structure-recall from genuine search).
      This is not a tally of holes — it is a single named obstruction
      with an argument: the parametric channel is unreachable by any
      file-system mechanism, and the only available discriminator is
      partially discriminating.
    what_remains_open: >-
      (1) The null-object control, when run, may partially discriminate.
      (2) The named gaps (cross-version stability, committed test for
      pin mechanism, TOL grounding, confound_caveat code enforcement,
      legacy write_run path) are matters for the future calibration run
      wrapper and a future hardening round. (3) The mechanical channels
      (input_manifest, certificate, pre-dispatch gate, wrapper timing)
      are real and checkable. (4) A calibration failure is a clean
      statement about the instrument regardless of the parametric
      channel.

