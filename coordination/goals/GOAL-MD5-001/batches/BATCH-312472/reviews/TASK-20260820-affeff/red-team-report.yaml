  joint_verdicts:

    # ---------------------------------------------------------------
    # J1: Canonical serialization — uniqueness, decidability,
    #     cross-session stability
    # ---------------------------------------------------------------
    - joint: J1_canonical_serialization
      verdict: holds
      basis: >-
        RAN the pinned command under the installed interpreter (Python
        3.12.8, PyYAML 6.0.3) on the quarantined payload (hash-only access,
        never read the payload contents). Recomputed digest:
        2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
        Pre-registered value (MANIFEST.yaml):
        2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
        MATCH. The pre-dispatch gate is mechanically decidable under this
        interpreter + PyYAML version.

        Constructed two logically-identical synthetic path blocks with
        different key insertion order and dumped each with the pinned
        canonicalization (yaml.safe_dump, sort_keys=True,
        default_flow_style=False). Both produce IDENTICAL bytes and
        IDENTICAL sha256 hashes. sort_keys=True normalizes key ordering,
        so the pin is stable across key-insertion-order differences within
        the same PyYAML version.

        Inspected the pinned block for version-sensitive dump formatting:
        (a) multi-line strings use PyYAML-specific block scalar quoting
        (repr: "description: 'line one\\n\\n  line two\\n\\n  line three'\\n");
        (b) quoted scalars (values that look numeric) are quoted or not
        depending on PyYAML's heuristic (repr: "value_that_looks_numeric:
        0123456789abcdef" — unquoted here, but a value like '123' would
        be quoted); (c) non-ASCII uses \\xE9 escaping (repr:
        "unicode_field: \\"caf\\\\xE9\\""). All three are PyYAML-version-
        dependent formatting choices. A future PyYAML version that changes
        any of these would produce different bytes for the same input,
        changing the digest, and the gate would HALT — which is the
        designed behavior, not a failure.

        The protocol ACKNOWLEDGES this in pyyaml_version_dependence:
        "yaml.safe_dump's output formatting is PyYAML-version-dependent.
        The pin is stable only under a declared interpreter + PyYAML
        version. Cross-version stability is on the declared_not_checked
        list." The gate's digest comparison IS the check: a version that
        changes the bytes fails the gate and HALTs dispatch.

        NAMED GAP: cross-version stability is declared, not checked. The
        pre-registered digest was verified under an UNRECORDED PyYAML
        version (VAL-20260820-23e0ea does not record its PyYAML version).
        The gate records the interpreter + PyYAML version going forward,
        but the version the digest was originally verified under is unknown.
        If the original verification was under a different PyYAML version
        than 6.0.3, the digest could differ — but it MATCHED under 6.0.3,
        so either the original was also 6.0.3 or the path block contains
        no version-sensitive values. This is a named gap, not a break:
        the gate is decidable under the declared version, and the protocol
        is honest about the cross-version gap.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected J1 to be the joint most likely to BREAK on
        PyYAML version-dependence. The version-dependence IS real
        (multi-line strings, quoted scalars, non-ASCII all have
        version-sensitive formatting), but the gate's digest comparison
        IS the check — a version that changes the bytes fails the gate
        and HALTs, which is designed behavior. The pin is stable under
        the declared interpreter + PyYAML version. The finding is
        "cross-version stability is a named gap, not a break" rather
        than the expected "the pin needs a version-pinned interpreter."
        The pin DOES need a version-pinned interpreter, and the protocol
        says so — but the gate is decidable under the current version,
        and the pre-registered digest MATCHED. Prior CONFIRMED with the
        nuance that the break the Coordinator expected is a declared gap
        rather than a live failure.

    # ---------------------------------------------------------------
    # J2: Certificate independence enforceability — comparison logic
    #     AND pin mechanism
    # ---------------------------------------------------------------
    - joint: J2_certificate_independence
      verdict: holds
      basis: >-
        RAN the implemented kind in harness/runner.py at the snapshot
        commit. Traced the digest computation: _verify() routes
        kind == "md5_collision_pair" to _verify_md5_collision_pair(cert),
        which uses _MD5_IMPL_FUNCS (two distinct callables: _md5_impl1_hash
        via hashlib.md5, _md5_impl3_hash via _md5.md5). Four digest
        comparisons are computed (impl1_m1, impl1_m2, impl3_m1, impl3_m2).
        verified is True only if m1 != m2 AND all four digests equal the
        claimed digest. Otherwise verified is False with every failing
        check named.

        Built a known-false object (two messages "hello"/"world" with
        different MD5 digests, tampered claimed digest
        ffffffff...ffffffff) and ran it through the production dispatch
        (_verify with no impls argument, so pinned=True). Result:
        verified=False, failures=[digest_mismatch_impl1_m1,
        digest_mismatch_impl1_m2, digest_mismatch_impl3_m1,
        digest_mismatch_impl3_m2]. Pin mechanism recorded with
        distinct=True (IMPL-1: _hashlib.HASH, IMPL-3: _md5.md5).
        verified_by wrapper-populated with 2 entries. CORRECT.

        ATTACKED THE PIN MECHANISM as the plan directs. The pin mechanism
        (_md5_pin_mechanism) probes the SAME callables in _MD5_IMPL_FUNCS,
        recording each implementation's module __file__ and runtime type,
        and asserting distinctness (two module files differ AND two runtime
        types differ). Tested with an aliased registry (both entries =
        _md5_impl1_hash): distinct=False, both resolve to
        _hashlib.cpython-312-darwin.so and _hashlib.HASH. The pin
        mechanism WOULD detect a future single-line aliasing edit at
        RUN TIME (when a certificate is verified), because aliased
        functions produce the same runtime type.

        BUT: searched for tests that catch aliasing BEFORE run time.
        rg for "md5_collision_pair|_md5_impl|pin_mechanism|_MD5_IMPL_FUNCS|
        pinned_pair|run_wrapped|timing_source" across all .py files: the
        ONLY files referencing these are harness/runner.py itself and the
        producer's selftest.py (under the task directory, not in the
        committed test suite). The committed test suite
        (tests/test_harness.py, 28 tests) has ZERO md5_collision_pair
        coverage. Re-ran tests/test_harness.py independently: 28 passed,
        no md5 tests. Re-ran the self-test objects (T1-T10, T7, T8)
        independently in temp directories: ALL PASS, confirming the
        producer's accounts.

        The `pinned` flag logic: `pinned = impls is None or impls is
        _MD5_IMPL_FUNCS` — an IDENTITY check (is), not equality (==). A
        copy of _MD5_IMPL_FUNCS would have pinned=False, skipping the pin
        check. But in production, _verify calls
        _verify_md5_collision_pair(cert) without impls, so pinned=True.
        This is correct for the production path.

        NAMED GAP: the pin mechanism is a RUN-TIME check, not a committed
        test. A future single-line aliasing edit (changing _md5_impl3_hash
        to call hashlib.md5) would be detected when a certificate is
        verified, but NOT by any committed test before that. If no
        certificate is ever verified (e.g., if the calibration search
        never runs or never finds a collision), the aliasing would go
        undetected. The self-test (selftest.py) covers this (T10), but
        selftest.py is under the task directory, not in the committed
        test suite (tests/). A committed test that exercises the pin
        mechanism would close this gap.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected J2 to HOLD if the spec was implemented (two
        distinct imports, four digest comparisons, m1 != m2), with the
        attack landing on the PIN MECHANISM: "nothing in a name-based pin
        stops a future edit from aliasing the second implementation to the
        first code path." CONFIRMED: the comparison logic holds, and the
        pin mechanism is a run-time check that detects aliasing — but no
        committed test catches it before run time. The finding demands
        a committed test, matching the Coordinator's expectation of "a
        finding demanding a hash-pinned import or a library-level check."
        The pin mechanism IS a library-level check (runtime type + module
        file), but it is not backed by a committed test.

    # ---------------------------------------------------------------
    # J3: Null-object decision table — every outcome row labelled,
    #     tolerance not vacuous
    # ---------------------------------------------------------------
    - joint: J3_null_object_decidability
      verdict: holds
      basis: >-
        Enumerated the full outcome space: {target SUCCESS, target FAIL}
        x {variant SUCCESS, variant FAIL} x {R < 0.5, R in [0.5, 2.0],
        R > 2.0}. When both succeed, three cost sub-cases apply (R1, R2,
        R3). When one or both fail, the cost ratio is not primary (R4,
        R5, R6). Total: 6 outcome rows. The decision table has exactly
        6 rows (R1-R6). Every outcome row is labelled with what it
        shows and what it does not show, including the control's known
        limit (partial-structure-recall not separated from genuine
        search). No row has a "comparable cost" label with no tolerance
        applied. Every target-SUCCESS row (R1-R4) carries the
        confound_caveat requirement.

        TESTED TOL = 2 FOR VACUITY: TOL=2 means R in [0.5, 2.0] is
        "comparable." Tested cost ratios:
        - R=1.1 (10% variance): COMPARABLE
        - R=1.5 (50% machine load): COMPARABLE
        - R=2.0 (2x difference): COMPARABLE (boundary)
        - R=2.01: BEYOND TOLERANCE
        - R=3.0, 5.0, 10.0: BEYOND TOLERANCE
        - R=0.5 (variant 2x cheaper): COMPARABLE (boundary)
        - R=0.499, 0.1: BEYOND TOLERANCE

        TOL=2 is NOT vacuous: it excludes >2x and <0.5x differences,
        which covers order-of-magnitude and 3x+ differences. But it IS
        wide enough that a meaningful 2x cost difference is absorbed
        (a variant that is genuinely 2x harder would be labelled
        "comparable"). Whether this is too wide depends on the expected
        cost differences, which are unknown until the calibration runs.

        The protocol ACKNOWLEDGES this: "HONESTLY A DECLARATION, NOT A
        MEASUREMENT. There is no cost data yet — the calibration is
        exactly what will produce it — so TOL cannot be empirically
        grounded in this batch." TOL is a fixed_before_acquisition-style
        constant: declared before the runs and may not be tuned after
        observing outcomes. This is an acceptable state.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected "decidable, but the tolerance constant is an
        unjustified declaration." CONFIRMED: the table is decidable (every
        row labelled), and TOL=2 is an unjustified declaration (no
        measured cost data yet). The protocol says so explicitly. The
        finding checks whether the protocol says so — it does.

    # ---------------------------------------------------------------
    # J4: Firewall carry-over / regression vs BCP-1
    # ---------------------------------------------------------------
    - joint: J4_firewall_regression
      verdict: holds
      basis: >-
        Performed an element-by-element diff of BCP-1's firewall against
        BCP-2's, reading both files in full. Every row of BCP-2's
        delta_table is labelled tightened or held. There are NO loosened
        rows.

        Element-by-element:
        - header: HELD (metadata updated by design)
        - claim_ceiling: HELD
        - purpose: HELD (now dispatchable)
        - scope: HELD
        - fixed_before_acquisition: HELD (four fields, immutability rule,
          encoding_provenance_declaration)
        - blind_scoring_rule.rediscovery: TIGHTENED (added clause 5:
          pre_dispatch_gate, evidence_record_requirement)
        - blind_scoring_rule.consumption: HELD (verbatim in substance)
        - blind_scoring_rule.what_this_rule_cannot_reach: HELD
        - collision_certificate_format: TIGHTENED (field names fixed,
          verified_by wrapper-populated, pin_mechanism_requirement added)
        - charging_convention: TIGHTENED (wrapper-measured wall_seconds)
        - failed_search_rule: HELD
        - firewall.what_read_scope_alone_cannot_do: HELD
        - firewall.read_scope: HELD
        - firewall.quarantine: HELD (marker, path, payload_sha256)
        - firewall.expected_answer_digest / pre_dispatch_gate:
          TIGHTENED (pinned byte-for-byte, mechanically decidable)
        - firewall.closed_hash_manifested_input_set: HELD
        - invalidity_conditions: TIGHTENED (INV-1..INV-9 held,
          INV-10..INV-13 added)
        - residual_risk: HELD
        - null_object_control: TIGHTENED (named tolerance TOL=2, named
          baseline, decidable decision table)
        - evidence_record_requirement: NEW (tightened)
        - declared_not_checked: NEW (tightened, carries forward + extends)
        - amendment_and_supersession: HELD
        - self_report: HELD

        CHECKED THE DECLARED-NOT-CHECKED LIST DID NOT SHRINK: BCP-1's
        declared-not-checked channels (scattered across sections) were:
        (1) input-manifest completeness, (2) encoding provenance,
        (3) read_scope, (4) the parametric channel (model prior knowledge)
        with its named obstruction, (5) staging-rules drift. BCP-2's
        explicit declared_not_checked section carries all five forward
        and ADDS two: (6) cross-version stability of the pinned
        serialization, (7) staging-rules drift (explicitly separated).
        The list GREW from 5 to 6 channels (staging-rules drift was
        implicit in BCP-1, explicit in BCP-2; cross-version stability is
