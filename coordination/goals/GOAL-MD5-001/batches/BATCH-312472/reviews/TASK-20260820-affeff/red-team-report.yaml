  # ===================================================================
  # BLIND RE-DERIVATION (required by review plan)
  # ===================================================================
  blind_rederivation:
    quantity: >-
      The CONSUMPTION predicate as a function of its two declared inputs:
      input_manifest (closed hash-manifested set) and quarantine MANIFEST
      per-file sha256 list, plus the invalidity condition it triggers.
    derivation: >-
      Derived from BCP-2's blind_scoring_rule section ONLY (section (b),
      lines 371-423 of BCP-2.yaml). The self_report section, producer
      task cards, and producer handoffs were NOT used for the derivation
      (see blind_from attestation below for a procedural note).

      From blind_scoring_rule.consumption.definition clause (1):
      "the quarantined payload's sha256 (or the sha256 of any file derived
      from it) appears in the run's input_manifest"

      From blind_scoring_rule.rediscovery.definition clause (1):
      "the run's closed, hash-manifested input set (input_manifest,
      defined below) contains no file whose sha256 matches any entry in
      the quarantine MANIFEST"

      DERIVED PREDICATE:
        CONSUMPTION_input_1(input_manifest, quarantine_sha256_list) =
          (input_manifest ∩ quarantine_sha256_list != ∅)

      If True: triggers INV-2 ("The quarantined payload's digest (or a
      digest of any file derived from it) appears in input_manifest.
      This is CONSUMPTION and is recorded invalid, never a weaker pass.")

      The full CONSUMPTION predicate has four clauses (input_manifest
      intersection, encoding_provenance true, output quotes payload
      values, encoding authored by session that read KN-LIT entry), but
      the plan asks for the predicate as a function of its TWO DECLARED
      INPUTS (input_manifest and quarantine sha256 list), which is
      clause (1) only. The other clauses are functions of different
      inputs (encoding_provenance, output trace, authoring session
      history) and are not derivable from the two declared inputs alone.
    test_inputs:
      object_B:
        input_manifest: >-
          {abc123, e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5}
        quarantine_sha256_list:
          - e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
        expected: CONSUMPTION (True)
        observed: CONSUMPTION (True)
        agreement: agree
      object_C:
        input_manifest: >-
          {09d7c5f8610d3a5c236d9b31db04d500a54ddd5adcc5a19444eb430ff1b9a77b}
          (the sha256 of the synthetic path block's canonical
