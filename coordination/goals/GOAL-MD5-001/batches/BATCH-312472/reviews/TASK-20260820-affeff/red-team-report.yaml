  # ===================================================================
  # OVERALL ROUND VERDICT
  # ===================================================================
  overall_round_verdict: holds-with-named-gaps
  overall_reasoning: >-
    BCP-2 makes the blind calibration run DISPATCHABLE. The pre-dispatch
    gate is mechanically decidable (J1: pinned command recomputes the
    pre-registered digest, MATCH under Python 3.12.8 / PyYAML 6.0.3).
    The certificate rule is enforceable (J2: four digest comparisons,
    pin mechanism detects aliasing at run time). The firewall is at
    least as strong as BCP-1's (J4: no loosened rows, declared-not-
    checked list grew). The success record carries the confound caveat
    (J5: required field, INV-10). The null-object control is decidable
    (J3: every outcome row labelled, TOL=2 not vacuous). Charging is
    wrapper-measured on the new path (J6: run_wrapped measures itself).

    No batch-halting findings. No proves-too-much failures (A, B, C
    all pass the failure signature check). No firewall regression.

    FIVE NAMED GAPS (none batch-halting):
    1. (J1) Cross-version stability of the pinned serialization is
       declared, not checked. The pre-registered digest was verified
       under an UNRECORDED PyYAML version. The gate is decidable under
       the current version, and the protocol acknowledges the gap.
    2. (J2) The pin mechanism is a run-time check, not a committed
       test. No test in tests/test_harness.py covers
       md5_collision_pair. A future aliasing edit would be detected
       at run time but not before. The self-test (selftest.py) covers
       it but is not in the committed test suite.
    3. (J3) TOL=2 is an unjustified declaration. The protocol
       acknowledges this ("HONESTLY A DECLARATION, NOT A MEASUREMENT").
       Not vacuous, but wide enough that a 2x difference is absorbed.
    4. (J5) confound_caveat is machine-checkable at the protocol level
       (INV-10, required field) but advisory at the code level (not
       implemented in runner.py). A future calibration run wrapper
       could omit it and the runner would not catch it.
    5. (J6) The legacy write_run() path still accepts caller-supplied
       timing for new runs. INV-11 is a protocol-level rule, not
       code-level enforcement. A caller can bypass run_wrapped and
       call write_run directly with fabricated timing.

    All five gaps are acknowledged in the protocol or are natural
    consequences of the protocol being a specification (not all
    obligations are implemented in code yet). None prevents dispatch:
    the pre-dispatch gate is decidable, the certificate kind is
    implemented, the firewall is intact, and the confound caveat is
    required. The gaps are matters for the future calibration run
    wrapper and for a future hardening round.

  batch_halting_findings: none

  # ===================================================================
  # DEFECT LIST
  # ===================================================================
  defects:
    count: 5
    items:
      - id: DEFECT-RT-1
        severity: minor
        joint: J1
        description: >-
          Cross-version stability of the pinned serialization is
          declared, not checked. The pre-registered digest was verified
          under an UNRECORDED PyYAML version (VAL-20260820-23e0ea does
          not record its PyYAML version). The gate records the
          interpreter + PyYAML version going forward, but the version
          the digest was originally verified under is unknown.
        action: >-
          The pre-dispatch gate should refuse dispatch if the recorded
          PyYAML version differs from the version the pre-registered
          digest was verified under. Since the original version is
          unrecorded, the gate should treat the current version (6.0.3)
          as the pin version and record it as such. A future PyYAML
          upgrade that changes the bytes would HALT dispatch (designed
          behavior).
      - id: DEFECT-RT-2
        severity: moderate
        joint: J2
        description: >-
          No committed test in tests/test_harness.py covers the
          md5_collision_pair certificate kind or the pin mechanism. The
          self-test (selftest.py) covers it but is under the task
          directory, not in the committed test suite. A future aliasing
          edit would be detected at run time but not by any committed
          test before that.
        action: >-
          Add a committed test to tests/test_harness.py that exercises
          the md5_collision_pair kind (known-false object through the
          production dispatch, pin mechanism distinctness assertion
          with both real and aliased registries). This would catch a
          future aliasing edit before run time.
      - id: DEFECT-RT-3
        severity: minor
        joint: J3
        description: >-
          TOL=2 is an unjustified declaration. The protocol acknowledges
          this, but the tolerance is wide enough that a meaningful 2x
          cost difference is absorbed as "comparable."
        action: >-
          When cost data exists (after the calibration runs), re-evaluate
          TOL against the measured run-to-run variance. If the variance
          is much less than 2x, tighten TOL. This is a future-batch
          obligation, not a current defect — TOL is a
          fixed_before_acquisition constant that may not be tuned after
          observing outcomes.
      - id: DEFECT-RT-4
        severity: moderate
        joint: J5
        description: >-
          confound_caveat is machine-checkable at the protocol level
          (INV-10, required field) but advisory at the code level (not
          implemented in runner.py). A future calibration run wrapper
          could omit it and the runner would not catch it.
        action: >-
          The future calibration run wrapper must implement the
          evidence_record_requirement check: refuse to write a
          REDISCOVERY-eligible success record without the
          confound_caveat field. This is a code-level obligation on the
          future wrapper, not a defect in the current implementation
          (which does not write calibration run records).
      - id: DEFECT-RT-5
        severity: moderate
        joint: J6
        description: >-
          The legacy write_run() path still accepts caller-supplied
          timing for new runs. INV-11 is a protocol-level rule, not
          code-level enforcement. A caller can bypass run_wrapped and
          call write_run directly with fabricated timing, producing a
          record that violates INV-11 but is not caught by code.
        action: >-
          Either (a) make write_run refuse caller-supplied timing when
          timing_source is not "wrapper" for new runs (breaking change
          to the legacy API), or (b) add a check in write_run that
          requires timing_source="wrapper" for any run with a
          certificate kind other than "none" (calibration runs only).
          Option (b) is less disruptive and targets the runs INV-11
          applies to.

  # ===================================================================
  # COORDINATOR-PRIOR COMPARISON
  # ===================================================================
  coordinator_prior_comparison:
    summary: all_confirmed
    per_joint:
      J1:
        expectation: >-
          Expected to BREAK on PyYAML version-dependence; finding
          "the pin needs a version-pinned interpreter or a version-
          independent serialization" rather than a clean pass.
        result: confirmed_with_nuance
        note: >-
          The version-dependence IS real (multi-line strings, quoted
          scalars, non-ASCII all have version-sensitive formatting),
          but the gate's digest comparison IS the check — a version
          that changes the bytes fails the gate and HALTs, which is
          designed behavior. The pin is stable under the declared
          version, and the pre-registered digest MATCHED. The finding
          is "cross-version stability is a named gap" rather than a
          live break. The pin DOES need a version-pinned interpreter,
          and the protocol says so.
      J2:
        expectation: >-
          Expected to HOLD if spec implemented, with attack landing on
          the PIN MECHANISM: a future single-line aliasing edit would
          not be caught.
        result: confirmed
        note: >-
          Comparison logic holds. Pin mechanism detects aliasing at
          run time. No committed test catches aliasing before run time.
          Finding demands a committed test, matching expectation.
      J3:
        expectation: >-
          Expected "decidable, but the tolerance constant is an
          unjustified declaration."
        result: confirmed
        note: >-
          Table is decidable (every row labelled). TOL=2 is an
          unjustified declaration. Protocol says so explicitly.
      J4:
        expectation: >-
          Expected to PASS: carry-forward is verbatim, regression is
          batch-halting.
        result: confirmed
        note: >-
          No loosening found. Declared-not-checked list grew. Parametric
          channel with named obstruction present.
      J5:
        expectation: >-
          Expected to hold at wording level, with live question whether
          confound_caveat is MACHINE-CHECKABLE or advisory.
        result: confirmed_with_nuance
        note: >-
          confound_caveat is machine-checkable at protocol level (INV-10)
          but advisory at code level (not implemented). Truthful-halt
          direction intact.
      J6:
        expectation: >-
          Expected to hold for new wrapper path, with finding on legacy
          code path that still accepts caller-supplied timing for NEW
          runs only.
        result: confirmed
        note: >-
          New wrapper path holds. Legacy write_run() path still trusts
          caller timing. INV-11 is protocol-level, not code-level.

