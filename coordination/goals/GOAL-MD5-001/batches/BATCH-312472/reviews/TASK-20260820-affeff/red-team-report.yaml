        PARAMETRIC PRIOR KNOWLEDGE) is present and carries the full
        obstruction text. The list did NOT shrink.

        No loosening found. No batch-halting finding.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected J4 to PASS: "the carry-forward is verbatim
        by task-card instruction, and a regression is a batch-halting
        finding, not a negotiation." CONFIRMED: no loosening found, the
        declared-not-checked list grew, the parametric channel with its
        named obstruction is present.

    # ---------------------------------------------------------------
    # J5: Evidential asymmetry — confound caveat required-field or
    #     advisory; failure direction intact
    # ---------------------------------------------------------------
    - joint: J5_evidential_asymmetry
      verdict: holds
      basis: >-
        Quoted the exact required evidence-record fields from BCP-2's
        evidence_record_requirement.required_fields:

        1. pre_registered_digest_match: "The run's output, serialized
           under the pinned canonical serialization, and its sha256,
           compared to the MANIFEST's
           pre_registered_expected_answer_digest; the match status
           (match / no_match) recorded."
        2. clean_input_manifest: "The input_manifest sha256 set, the
           quarantine MANIFEST sha256 list, and the intersection (must
           be empty for REDISCOVERY eligibility)."
        3. certificate: "The full md5_collision_pair certificate block
           with verified: true and wrapper-populated verified_by."
        4. confound_caveat: "REQUIRED. A record without it is INVALID
           (INV-10). Statement: 'This success is REDISCOVERY-eligible
           under the following caveat: partial-structure-recall is not
           excluded by the null-object control...'"
        5. null_object_control_result: "The decision-table row (R1-R6)
           the paired variant run landed on. REQUIRED when the control
           has been run; if the control has not yet been run, the record
           must name it OPEN AND UNATTEMPTED."

        IS confound_caveat MACHINE-CHECKABLE OR ADVISORY?
        - At the PROTOCOL level: MACHINE-CHECKABLE. INV-10 states "A
          REDISCOVERY-eligible success record is missing any required
          field of evidence_record_requirement — in particular the
          confound_caveat field — is invalid." A reviewer or validator
          can check field presence in the YAML/JSON record. The field's
          value is a fixed statement (the protocol specifies the exact
          text), so the value can also be checked.
        - At the CODE level: ADVISORY. harness/runner.py does NOT
          implement evidence_record_requirement checks. The runner
          writes run manifests but does not check for confound_caveat
          presence. The evidence_record_requirement is a protocol-level
          obligation on the future calibration run wrapper, not
          implemented in this batch. The self-test report (TASK-20260820-
          e4405b) explicitly states: "BCP-2's... evidence_record_requirement
          (confound_caveat)... are protocol/dispatcher obligations for
          the future calibration run wrapper, not part of this task's
          two implementation requirements; they are not implemented
          here and are named as such (SC-5)."

        NAMED GAP: confound_caveat is machine-checkable in principle
        but not enforced by code. A future calibration run wrapper
        could omit it and the runner would not catch it. The check
        rests on a reviewer or validator reading the record, not on
        code enforcement. This is a named gap, not a break: the
        protocol declares it as a required field with an invalidity
        condition, and the gap is that the code doesn't enforce it yet.

        TRUTHFUL-HALT DIRECTION: checked whether a truthful halt is
        recorded identically whether it came from search or from the
        solver recognizing the answer. The failed_search_rule states:
        "A search that reaches wall_clock_ceiling, crashes, or is
        otherwise halted before rediscovering a characteristic or
        driving one to a certified pair is a BUDGET OUTCOME about the
        solver... reported as a valid negative_observation." The record
        does not distinguish between "searched and found nothing" and
        "recognized the answer but halted without reporting it." Both
        are recorded as negative_observation. The evidential asymmetry
        is INTACT: a clean failure rules out both "found by search" and
        "found by recall" equally, because recall could only have
        helped a solver that has access to the published path — so a
        clean failure means neither search nor recall was effective.

        The evidence_record_requirement applies ONLY to successes (a run
        with a verified md5_collision_pair certificate), NOT to failures.
        A failure (truthful halt) is recorded as negative_observation
        without the confound_caveat. This is correct — the confound is
        about success being confounded by prior exposure, which does not
        apply to failures.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected J5 to "hold at the wording level, with the
        live question whether the confound caveat block is MACHINE-
        CHECKABLE in the evidence record or merely advisory prose.
        Advisory is a partial pass at best." CONFIRMED with nuance:
        confound_caveat is machine-checkable at the PROTOCOL level
        (INV-10, required field) but advisory at the CODE level (not
        implemented in runner.py). This is a named gap, not a break —
        the protocol declares it as required, and the gap is that the
        code doesn't enforce it yet. The truthful-halt direction is
        intact.

    # ---------------------------------------------------------------
    # J6: Charging independence — wrapper-measured wall_seconds on
    #     every new-run code path
    # ---------------------------------------------------------------
    - joint: J6_charging_independence
      verdict: holds
      basis: >-
        Read the new wrapper API in harness/runner.py at the snapshot
        commit. Enumerated every entry point that produces a run record:

        1. run_wrapped(exp_id, exp_area, fn, *, status, command,
           out_root=None) -> str: the NEW entry point. Samples
           time.monotonic() immediately before and after the wrapped
           call (BY THE WRAPPER), writes wall_seconds = t1 - t0 into
           run.timing.wall_seconds with timing_source="wrapper". Callers
           have NO started/finished parameters to supply. VERIFIED
           independently: a wrapped call sleeping 0.05s produces
           wall_seconds=0.052541, timing_source="wrapper". CORRECT.

        2. write_run(exp_id, exp_area, result, *, status, command,
           started, finished, out_root=None, wall_seconds=None,
           timing_source=None) -> str: the LEGACY entry point. Still
           accepts caller-supplied started/finished. When wall_seconds
           is None and timing_source is None, falls through to
           wall_seconds = round(finished - started, 6) — the OLD formula.
           VERIFIED independently: caller supplies started=1000.0,
           finished=1000.001 → wall_seconds=0.001, no timing_source key.
           This is the tamper object: a caller that supplies brackets
           around nothing (0.001s) gets that value recorded.

        BUILT THE TAMPER OBJECT: a caller that supplies started/finished
        brackets around nothing (0.001s window) and calls write_run()
        directly (bypassing run_wrapped). Result: wall_seconds=0.001
        recorded, no timing_source field. The caller's fabricated timing
        lands in the record. This is the legacy path — it still trusts
        caller timing.

        The protocol says: "Caller-supplied started/finished are NO
        LONGER ACCEPTED for new runs: the write_run() path for new runs
        must not take caller timing, or must ignore/override it with
        the wrapper's own measurement." But the CODE does not enforce
        this: write_run() still accepts caller-supplied started/finished
        and uses them when wall_seconds=None. The only protection is
        that run_wrapped() is the new entry point, but write_run() is
        still callable directly.

        INV-11 states: "A run dispatched under BCP-2 whose
        run.timing.wall_seconds is not wrapper-measured is invalid."
        This is a PROTOCOL-LEVEL rule, not a CODE-LEVEL enforcement.
        The code does not check whether timing_source is "wrapper" for
        new runs. A caller that bypasses run_wrapped and calls
        write_run directly with fabricated timing would produce a
        record that violates INV-11, but the code would not catch it.

        NAMED GAP: the legacy write_run() path is still available for
        new runs and still trusts caller-supplied timing. The protocol
        says it "must not take caller timing" but the code doesn't
        enforce this. INV-11 is a protocol-level rule that a reviewer
        or validator would need to check (absence of timing_source=
        "wrapper" in the manifest), not a code-level enforcement. This
        is a named gap, not a break: the new path (run_wrapped) is
        correct, and the gap is that the old path is not blocked.
      coordinator_prior: confirmed
      coordinator_prior_note: >-
        Coordinator expected J6 to "hold for the new wrapper path, with
        a finding on any legacy code path that still accepts caller-
        supplied timing — for NEW runs only (existing records are
        immutable and were written under the old API; that is policy,
        not a defect)." CONFIRMED: the new wrapper path holds, and the
        legacy write_run() path still accepts caller-supplied timing
        for new runs. The finding is that INV-11 is a protocol-level
        rule, not code-level enforcement — a caller can bypass
        run_wrapped and call write_run directly with fabricated timing.

  # ===================================================================
  # PROVES-TOO-MUCH OBJECTS
  # ===================================================================
  proves_too_much:
    failure_signature: >-
      An argument (or gate) that verifies A, accepts B as scorable, or
      accepts more than one of C's four serializations as canonical has
      proved too much and is wrong somewhere it has not been read
      closely enough.

    object_A:
      name: known non-collision certificate
      object: >-
        md5_collision_pair certificate whose m1 and m2 do not actually
        collide (different MD5 digests) with a claimed digest that is
        neither real digest.
      known_verdict: verified must be false, with the failing check named
      observed_verdict: >-
        verified=False, failures=[digest_mismatch_impl1_m1,
        digest_mismatch_impl1_m2, digest_mismatch_impl3_m1,
        digest_mismatch_impl3_m2]. Pin mechanism recorded with
        distinct=True. verified_by wrapper-populated with 2 entries
        (real digests of m1 and m2 from both implementations).
      failure_signature_check: pass
      basis: >-
        RAN through the production dispatch (_verify with no impls
        argument, pinned=True). The rule correctly rejects A as
        verified:false with all four digest mismatches named. The
        argument does not prove too much.

    object_B:
      name: known CONSUMPTION manifest
      object: >-
        Synthetic run manifest whose input_manifest contains the sha256
        of the quarantined payload (e44a3fed..., taken from the committed
        MANIFEST, not from the payload).
      known_verdict: CONSUMPTION under BCP-2's carried-forward rule —
        recorded invalid, never a weaker pass
      observed_verdict: >-
        CONSUMPTION predicate returns True (input_manifest intersects
        quarantine sha256 list). The intersection is
        {e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5}.
        The run would be recorded as CONSUMPTION (INV-2), invalid, never
        a weaker pass.
      failure_signature_check: pass
      basis: >-
        Tested the CONSUMPTION predicate (derived in the blind
        re-derivation below) against Object B's input_manifest. The
        predicate correctly returns True, triggering INV-2. The rule
        does not accept B as scorable.

    object_C:
      name: known serialization mismatch
      object: >-
        One logical path block, serialized four ways: (1) the pinned
