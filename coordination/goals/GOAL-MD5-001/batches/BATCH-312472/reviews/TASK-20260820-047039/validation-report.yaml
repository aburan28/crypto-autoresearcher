  # ===================================================================
  # DISPATCHABILITY DETERMINATION (one line)
  # ===================================================================
  dispatchability_determination: dispatchable-with-named-gaps
  determination_basis: >-
    The pre-dispatch gate is mechanically decidable and PASSES for the
    committed payload (recomputed digest == pre-registered value, hash-only
    access; the payload content was never read). The certificate logic
    correctly rejects all three known-false objects with the failing check
