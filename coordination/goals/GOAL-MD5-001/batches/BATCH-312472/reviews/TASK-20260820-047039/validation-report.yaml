        - step: 1b-B perturbation sort_keys=False (NOT the pinned command)
          observed_digest: acd4fc835039723acdec6b21a3a2002945491f02ec9199d7821008d23e5f07ca
        - step: 1b-C perturbation default_flow_style=True (NOT the pinned command)
          observed_digest: 5fc57923b6d5c01c616cfe2213b6de8e2fb51ba7f21f558b1010d8198f359b29
        - step: 1b-D perturbation serialize literal_pairs_as_extracted (NOT path)
