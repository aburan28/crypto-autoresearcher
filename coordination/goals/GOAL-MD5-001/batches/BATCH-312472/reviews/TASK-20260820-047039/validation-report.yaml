        - step: 1b-E pre-registered value (real payload, for reference)
          value: 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002
      gate_decision_logic_step_through:
        - case: digest MATCHES (recomputed == pre-registered)
          demonstration: >-
            On the real payload (1a), recomputed 2ea0083... == pre-registered
            2ea0083... -> MATCH -> gate PASSES -> dispatch ALLOWED.
          also: >-
            Equivalently, if the pre-registered value were set to the synthetic
            digest 48eaf6d1..., then recomputed 48eaf6d1... == pre-registered
            48eaf6d1... -> MATCH -> gate PASSES. The gate is symmetric: it
            compares two digests and decides equality.
        - case: digest does NOT match (recomputed != pre-registered)
          demonstration: >-
            On the synthetic (1b-A), recomputed 48eaf6d1... != pre-registered
            2ea0083... -> MISMATCH -> gate HALTs -> dispatch BLOCKED. Correct:
            the synthetic content is not the real payload, so a mismatch is the
            designed behavior, not a failure of the gate.
        - case: serialization PERTURBED
          demonstration: >-
            Each perturbation (1b-B sort_keys=False -> acd4fc83...; 1b-C
            default_flow_style=True -> 5fc57923...; 1b-D wrong block ->
            15710c31...) produces a DIFFERENT digest. Against any fixed
            pre-registered value, each would MISMATCH -> gate HALTs. This shows
            the serialization is PINNED (byte-for-byte), not free: changing
            sort_keys, flow style, or the serialized block changes the digest,
            and the gate's digest comparison is the check that detects it. A
            version or edit that re-bytes the `path` block differently fails
            the gate and HALTs dispatch, which is the designed behavior
            (BCP-2 pre_dispatch_gate.pyyaml_version_dependence).
      conclusion: >-
        The gate is mechanically decidable: it recomputes a digest with a
        pinned command and compares it to a pre-registered value. The decision
        is a string equality with two outcomes (MATCH -> pass; MISMATCH ->
        HALT). The serialization is pinned, so perturbations are detected. The
        gate PASSES for the committed payload.

