  # CHECK 4: DEFECTS
  # ===================================================================
  defects:
    count: 1
    items:
      - id: DEFECT-1
        severity: minor
        location: >-
          coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml
          (collision_certificate_format.pinned_implementations.IMPL-3.runtime_type)
        description: >-
          BCP-2 documents IMPL-3's runtime_type as `_md5.MD5Type`. The actual
          runtime type, as recorded by the runner's own _md5_pin_mechanism probe
          AND by this validator's independent runtime inspection, is
          `_md5.md5` (the type object's __name__ attribute is `md5`,
          lowercase). `_md5.MD5Type` IS the same underlying type object
          (`_md5.MD5Type is type(_md5.md5(b'x'))` is True — MD5Type is an
          attribute alias), so BCP-2 is not naming a non-existent type. But the
          STRING the runner records is `_md5.md5` (via
          `f"{t.__module__}.{t.__name__}"`), which does NOT string-match BCP-2's
          documented `_md5.MD5Type`. The runner's distinctness check is
          UNAFFECTED: it compares the two impls' type strings to EACH OTHER
          ({_hashlib.HASH, _md5.md5} -> 2 distinct -> True), never against BCP-2's
          documented expected value, so INV-13 does not fire falsely and dispatch
          is not blocked. The risk is that a dispatcher or reviewer doing a
          LITERAL cross-check of the runner's recorded `_md5.md5` against BCP-2's
          documented `_md5.MD5Type` would see a string mismatch and could
          falsely HALT dispatch. IMPL-1's documented runtime_type
          (`_hashlib.HASH`) IS correct and matches the runner's recording.
        does_not_block_dispatch: true
        action: >-
          Fix owner: Coordinator (a superseding BCP-3 record, since BCP-2 is
          frozen) OR the next-batch dispatch record. Either (a) correct BCP-2's
          documented IMPL-3 runtime_type to `_md5.md5` (the __name__ form the
          runner records) in a superseding record, or (b) record in the dispatch
          record that the runner's probe output is AUTHORITATIVE for the
          pin-mechanism check and that BCP-2's `_md5.MD5Type` is an attribute
          alias for the same type, not a string to match against. The
          pin_mechanism_requirement.what_the_wrapper_must_record_at_run_time
          already says the wrapper records "the runtime type of each produced
          hash object" and checks the two are distinct from each other (not
          against a documented string), so the protocol's operative rule is
          already correct; only the documented expected-value field is stale.

