    beyond `analyzed`, but none of them is a fabrication, a scope violation, or a non-reproducible certificate.
  joint_verdicts:
  - joint: K1
    title: proof_search_map completeness and honesty
    verdict: holds-with-named-gaps
    worked_attack_output: 'Read the idea''s proof_search_map field by field per the plan''s attack. Audit
      1 (baseline reproduction): literature figures (2^96/2^102/2^116.9/2^123.4) are consistently labeled
      UNVERIFIED and never treated as reproduced or established -- clean on the specific risk the Coordinator
      prior flagged. Audit 2 (observation-collision): genuinely computed the expected collision rate in
      advance (~256 matching-window hits, ~1 expected full-target hit) rather than assuming none exist
      -- clean. Audit 3 (quantifier order): explicit EXISTS-per-fixed-target statement, contrasted with
      a forbidden universal reading -- clean. Audit 4 (nearby-object control): predicted result (R in
      [0.5,2.0]) stated before any run, in a 0-run design-and-gate record -- clean, fixed_before_acquisition
      genuinely satisfied since the gate decision predates de817d''s runs.'
    new_finding_beyond_the_attack_plan: 'Audit 1''s own bottleneck statement asserts a SPECIFIC unstated
      assumption that turned out false: "(b) lands the matching point on a register that was just updated
      (so the comparison is meaningful, not comparing a stale value)". This assumption was verified only
      at the level of RFC word-usage-per-step (which word appears in which step''s text), never at the
      level of "does the returned state-tuple position after a chained BACKWARD composition actually carry
      the free word''s dependency." I independently traced backward_step''s algebra (see K3 below) and
      confirmed this assumption is FALSE for chunk2''s construction: tuple position 1 of the returned
      state after the free-word-dependent backward_step call is a pass-through of an already-fixed component
      of state10 (computed before word9 is ever consulted), while the value that genuinely depends on
      word9 (tuple position 0, "old_a") is never read by mitm_search or naive_all_pairs_search. Audit
      1''s own H2-regression-fixture control (a proved single-step inverse identity) cannot catch this,
      because the bug is not in backward_step''s correctness as an inverse -- it is in which output POSITION
      the caller reads after backward composition, a level audit 1''s reproduction_check never probed
      computationally (it verified word-usage disjointness and F-function textual identity only). This
      is a materially different, and I judge more structurally significant, gap than the literature-figure
      conflation risk the Coordinator prior named -- see coordinator_prior_comparison below.'
    second_finding: 'proof_obligation #2 ("The MITM hash-table search''s result set is IDENTICAL to the
      naive all-pairs search''s result set on a shared small control subset, k1=k2=6") is satisfied in
      the record (result_sets_equal=true, independently reconfirmed by me, see K3), but is a VACUOUS pass
      for the specific defect that occurred: naive_all_pairs_search contains the identical `state9_b[1]`
      position-read as mitm_search, so both implementations test the same word9-independent quantity and
      are guaranteed to agree regardless of whether the intended two-free-word joint search works. The
      frozen contract''s success_criterion (1) text does not anticipate this failure mode for its own
      stated control. This is disclosed honestly by the Executor in RUN-MDFIVE-buildcheck''s own `result`
      field ("this equality is itself a consequence of the word9-independence finding... not by itself
      evidence the underlying two-free-word MITM construction works as intended") -- I independently derived
      the same conclusion by tracing the code myself before reading that sentence closely, so this is
      convergent corroboration, not a discrepancy.'
    defect_severity: named-gap, not batch-halting -- all four audits were genuinely performed with real
      content, not placeholders; the gap is a depth-of-verification limitation in audit 1's own reasoning,
      not a fabricated or skipped audit.
  - joint: K2
    title: gate fidelity and MD5-scope compliance
    verdict: holds
    worked_attack_output: 'Compared EXP-MDFIVE-88f7d1.md5_run_authorization. exact_parameters_identical_to_md4_run
      (S=9,k1=10,k2=10,m=12,k=20, byte-identical 14 fixed words, seed 8975315, 300s ceiling, "never larger
      than the MD4 arm in any field") against the idea''s md5_specific_step_decision (same parameters,
      decision: NAMED). Match exactly. Then, rather than trust the execution report''s own "authorization_check"
      prose, I directly read runs/RUN-MDFIVE-md5-conditional/command.txt and manifest.yaml and runs/RUN-MDFIVE-h1-md4/command.txt:
      the two commands are byte-for- byte identical except `--target md5 --target-seed 8975315` versus
      `--target md4 --target-seed 8975314`. No larger scale, no additional parameter change, no unnamed
      MD5 run. Also grepped every command.txt under this task''s runs/ directory for "md5" -- exactly
      one match (RUN-MDFIVE-md5-conditional). Also independently read ledger/goals/GOAL-MD5-001.yaml''s
      next_action: "No further MD5 runs in batch 4 unless the ceiling audit names an MD5-specific step,
      gated by TASK-20260821-a288f8''s approval at identical bounded scale to the MD4 run" -- the actual
      run satisfies this exactly.'
    defect_severity: none found. This is the joint the Coordinator prior explicitly flagged as most likely
      to break ("the joint I would bet money on breaking if anything does"); I find it clean, verified
      from primary run artifacts rather than the execution report's narrative.
  - joint: K3
    title: MD4 (and conditional MD5) certificate re-derivation
    verdict: holds
    worked_attack_output: 'Independently invoked the frozen harness/run_md4_ceiling.py module''s functions
      directly (fixed_word_generation(20260821, free_bits=10), generate_target(8975313, fixed, "md4",
      free_bits=10), mitm_search(...), verify_match_certificate(...)) at the exact frozen seeds/parameters,
      WITHOUT reading the executor''s stated output first. Result: exact agreement on every reported field
      -- raw_solution_count=1024, matching_window_hits=2048, full_target_hits=1024, total_chunk_evaluations=2048,
      naive_baseline_cost=1048576, speedup_vs_naive=512.0, genuinely_verified_count=1, genuinely_verified_pair=
      (1932151644, 2414755370) matching true_word8/true_word9 I derived independently. Additionally re-ran
      the k1=k2=6 brute-force control (mitm6 vs naive6): 64/64 solutions, sets equal -- reproduced. Additionally
      re-ran the H2 regression fixture at n=2000 for both MD4 and MD5: all_ok=True both, matching the
      record''s n=10000 claim at reduced sample size. Additionally re-ran RFC 1320 vector check: all_ok=True
      (7/7). Independently re-ran the full test suite (`python3 -m pytest tests/test_harness.py -q`) and
      got the exact same "37 passed, 1 failed, 1 skipped" the snapshot receipt and execution report both
      claim, with the same single pre-existing failure (test_md5_pin_mechanism_real_registry_is_distinct,
      module_file None on this build''s built-in _md5).'
    anom_1_independent_reverification: 'Went beyond the plan''s stated attack to independently re-derive
      ANOM-1 itself (not merely trust its disclosure), per the task instruction to weigh it under K1/K3/K6.
      Sampled 50 uniformly random FULL 32-BIT word9 candidates (not just the declared 10-bit window, a
      stronger check than the executor''s own 20-sample, declared-window check) against the same fixed
      target: all 50 produced the IDENTICAL backward-derived "register A after step 9" value (2560406708).
      As a positive control, the same test on word8 (which SHOULD vary) gave 50 distinct values out of
      50 draws, confirming the search apparatus itself is not broadly non-discriminating -- only word9''s
      channel is degenerate. I additionally traced the algebra of backward_step by hand from the source:
      the returned tuple is (old_a, old_b, old_c, old_d) = (rotr(...)-F(...)-xk-t, c2, d2, a2) where xk=word9
      only appears in old_a (position 0); mitm_search and naive_all_pairs_search both read position 1
      (state9_b[1] = old_b = c2, a component of state10 fixed before word9 is consulted). This independently
      confirms ANOM-1''s stated root cause exactly, via a different check (broader sample, hand algebra)
      than the Executor''s own.'
    certificate_kind: 'No claims-and-verification.md-schema certificate is issued (certificate: {kind:
      none} throughout, disclosed by the Executor as a tooling-integration gap because harness.runner._verify
      has no registered kind for this instrument). Re-verification is via a separate code path (_reference_round1_forward),
      independently confirmed by me to be genuinely word9-discriminating (it checks state16 == target["Y"],
      and state16''s computation DOES depend on word9 via step 10 onward) -- unlike the degenerate matching-window
      filter, this check is not compromised by ANOM-1, which is why genuinely_verified_count correctly
      isolates exactly 1 of 1024 raw candidates.'
    defect_severity: none -- fully reproducible, and the reproduction exceeds rather than merely matches
      the executor's own diligence.
  - joint: K4
    title: heuristic-validation statistical honesty
    verdict: holds-with-named-gaps
    worked_attack_output: 'Independently recomputed the comparison statistic from raw counters. Re-ran
      h1_sampling at a reduced N=50 (budget-conscious) for both MD4 (seed 8975314) and MD5 (seed 8975315)
      arms directly from the frozen module: MD4 matching-window set = {2048} (constant), full-target set
      = {1024} (constant); MD5 matching-window set = {32768} (constant), full-target set = {1024} (constant)
      -- matching the reported N=1000 constants exactly at this reduced sample. Independently recomputed
      chi_square_goodness_of_fit on a synthetic all-2048/n=1000 sample and got chi2=127577.50865857219
      exactly, matching the reported statistic bit-for-bit -- confirms the number is a correct computation,
      not a fabricated or buggy one. (2048-256)/sqrt(256) = 112 standard deviations from the predicted
      mean.'
    artifact_tell: 'This is the canonical artifact tell named in docs/inventor-protocol.md section 3:
      the parameter meant to introduce randomness in HEUR-H1''s model (an independent target draw) produces
      ZERO variance in the observed statistic across all 1000 draws, rather than the Poisson-distributed
      variation H1 predicts. What the measurement SHOULD have done as the target varied is show Poisson(256)-distributed
      spread; instead it is flat. The record catches and reports this (satisfying AGENTS.md rule 8, "unexpected
      observations must be recorded, not silently discarded"), which is correct discipline.'
    named_gap: 'HEUR-H1''s own frozen falsification_condition is written without an exception for root-cause
      attribution: "a reproducible (>=3 independent target draws), non-shrinking heavier-than-Poisson
      tail." Read literally against the frozen contract text alone, this condition IS met (1000/1000 identical
      draws is trivially "reproducible... non-shrinking" and is a maximally heavier-than- Poisson deviation,
      not merely a heavy tail). The execution report''s "not_a_falsification_of_h1_per_se" framing is
      a carefully reasoned and, on the merits, PROBABLY CORRECT distinction (the deviation''s cause --
      word9 independence, a data-flow property of the chosen split point -- is different from what HEUR-H1
      is actually a claim about, F''s iterated mixing) -- but the frozen contract''s own falsification
      text does not carve out that exception, so the report sits closer to softening a literally-triggered
      falsifier than its own wording fully owns. I flag this for explicit Coordinator disposition rather
      than resolving it myself (per this task''s instruction not to draw the H1 conclusion): the contract''s
      falsification_condition, taken at face value, has fired at this scale for this instrument; whether
      that should be read as "H1 falsified" or "this run''s test of H1 is invalidated by a design defect
      and must be re-run against a differently-chosen matching point before H1 can be tested at all" is
      a live disambiguation the Coordinator must make, not a settled matter this report can leave implicit.'
    defect_severity: named-gap, not batch-halting -- statistics are computed correctly and reported in
      full and honestly (no numbers hidden, achieved N and halt status stated); the gap is in how close
      the prose gets to resolving an ambiguity the frozen contract's own text leaves open, in the more
      cautious direction (declining to call it falsified) rather than the inflationary direction the task
      asked me to check for.
  - joint: K5
    title: cost-model honesty
    verdict: holds
    worked_attack_output: 'Walked the cost-scaling material row by row. IDEA-20260821-e46061. cost_scaling_sketch
      is labeled "MODELED, NOT MEASURED -- RANK 3 (executor) produces the measured entries" and flags
      linear multi-core scaling, unoptimized-Python throughput, and the cross-method unit-translation
      caveat as explicitly optimistic/ unverified, satisfying CLAUDE.md promotion-gate #3''s flagging
      requirement. de817d''s cost_scaling_table_measured is labeled "MEASURED -- RANK 3 (this task)" with
      an explicit cross_method_note distinguishing its cost unit (chunk evaluations) from BATCH-1f30fe''s
      (full-message blocks) and declining to compute any gap-closing estimate from it. No modeled and
      measured number appear in the same formatted table anywhere in the package; no measured-as-modeled
      or modeled-as-measured mislabeling found.'
    new_finding_beyond_the_attack_plan: 'The MACHINE-READABLE artifacts for RUN-MDFIVE-primary-md4-v2
      -- raw-result.json and manifest.yaml, the files AGENTS.md''s Artifact Policy designates as holding
      "raw machine-readable results" -- carry the bare headline numbers (total_chunk_evaluations: 2048,
      naive_baseline_cost: 1048576, from which 512x is one division away) with ZERO reference to ANOM-1
      anywhere in either file. I confirmed this directly: `grep -ric anom` on both files returns 0. The
      ANOM-1 caveat exists ONLY in the human-authored prose of execution-report.yaml (the `result` field,
      not the bare `metrics` dict even there) and snapshot-receipt.json''s summary. Every CURRENT prose
      document in this package does carry the caveat at the point the number is stated, so no document
      in the frozen package today asserts an uncaveated claim from these numbers -- but the artifact design
      itself has no field (e.g. a `caveat_refs` list on the run record) that would prevent a future automated
      knowledge-promotion step, ledger synthesis, or agent that reads only artifact_paths'' raw-result.json
      from picking up "512x" as an unqualified headline figure.'
    defect_severity: named-gap, not batch-halting -- no current document overclaims; this is a forward-looking
      hygiene gap in how the caveat propagates to machine-readable artifacts, worth fixing before this
      run's numbers are cited by anything that does not also read execution-report.yaml's prose.
  - joint: K6
    title: claim-tier ceiling
    verdict: holds
    worked_attack_output: 'Scanned every claim-bearing sentence in the idea, the gate decision, and the
      execution report for `supported`-tier language (unconditional statements about MD4/MD5 preimage
      resistance beyond the declared bounded scale). Found none. Every document restates the toy-scale
      boundary explicitly and repeatedly: idea''s interpretation_limits, H-MDFIVE-bf7767''s own interpretation_limits
      ("this hypothesis and its experiment cannot exceed `analyzed`... must never be recorded `supported`"),
      the gate decision''s "Claim-ceiling honesty" rationale bullet, and the snapshot receipt''s instrument_verdict
      ("a scoped, honestly-reported limiting result about the chosen construction, not a claim about MD4/MD5
      collision or preimage resistance at any scale beyond this toy instrument"). The "512x speedup" and
      "R=1.0" numbers are, in every prose location I found them, immediately qualified with the ANOM-1
      caveat at the point of statement -- they do not read as stronger than ANOM-1 allows in any document
      this package commits as a claim-bearing record.'
    dependency_on_k5: This HOLDS verdict is about the FROZEN PACKAGE's own text, which is clean. It is
      conditioned on the Coordinator's disposition (not yet made, TASK-20260821-fb3f3c) correctly treating
      the K5 finding above -- a future closing decision or knowledge-promotion step must not cite raw-result.json's
      bare metrics without also carrying the caveat forward, or K6 would no longer hold for that later
      record.
    defect_severity: none in the reviewed package as committed.
  proves_too_much:
    failure_signature_checked: A package (or gate) that accepts J as a real certificate, accepts K as
      in-scope, or accepts L's label as correct has proved too much.
    object_J_unbounded_certificate:
      result: correctly_rejected
      reasoning: 'No document in this package claims execution at literature-scale complexity anywhere
        (explicitly disclaimed: EXP-MDFIVE-88f7d1''s objective, "Never claims execution at literature-scale
        complexity (2^96/2^102/2^116.9/2^123.4)"; scale_relevance.tier: toy). Testing whether the package''s
        OWN mechanisms would catch a synthetic Object-J-style insertion: the frozen parameters (k1=k2=10)
        bound the search space to 2^20 by contract (invalidation_rules), and the package''s own measured
        throughput table (cost_scaling_table_measured: ~10^5-3x10^5 chunk evals/sec) makes a claimed 2^102-operation
        result in 4 seconds implausible by roughly 25 orders of magnitude -- a cheap, checkable cross-reference
        against the package''s own honest cost data would reject Object J outright.'
    object_K_scope_creep_md5:
      result: correctly_rejected
      reasoning: Directly verified (K2 above, from primary artifacts, not narrative) that the sole MD5
        run present is parameter-identical to the MD4 arm and matches its EXP authorization exactly. A
        synthetic Object-K insertion (larger scale, or unnamed in the EXP contract) would be caught immediately
        by the same command.txt/ manifest.yaml parameter-identity check I performed, and is explicitly
        named invalid-regardless-of-outcome by EXP-MDFIVE-88f7d1's own invalidation_rules.
    object_L_mislabeled_cost_figure:
      result: correctly_rejected
      reasoning: No modeled number is captioned measured or vice versa anywhere in the package (K5 above).
        The one adjacent-labeling risk I checked (idea's modeled BATCH-1f30fe throughput anchor mentioned
        in the same prose paragraph as de817d's measured throughput, in cost_scaling_table_measured.cross_method_note)
        is prose-distinguished ("NOT directly comparable") rather than merged into one table row, so it
        does not meet the failure signature.
    overall: 'No proves-too-much object survives against this package. This is a genuine, positive finding:
      the package''s own honest cost-scaling table, its exact-parameter authorization discipline, and
      its consistent modeled/measured labeling are independently sufficient to reject all three known-false
      objects, not merely asserted to be.'
  blind_rederivation:
    quantity: bounded-certificate-eligibility predicate
    sources_used_for_derivation:
    - 'EXP-MDFIVE-88f7d1.yaml: success_criterion (verbatim)'
    - 'EXP-MDFIVE-88f7d1.yaml: falsification_criterion (verbatim)'
    - 'EXP-MDFIVE-88f7d1.yaml: invalidation_rules (verbatim)'
    sources_excluded_per_blind_from: 'IDEA-20260821-e46061''s honest_accounting/interpretation_limits/
      priority_note narrative fields; TASK-20260821-de817d''s execution_report.executor_assessment block
      (data_quality, requires_amendment_reason, etc. -- its self-assessment section); task-cards/TASK-20260821-420070.md
      and -de817d.md and their handoffs (not read at all, in or out of this exercise). Note: I did read
