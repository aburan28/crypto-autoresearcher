      for the arm in question, OR if one has fired the statistics are still reported (never suppressed)
      but are NOT eligible as validating evidence for the corresponding heuristic.'
    check_against_actual_records: 'RUN-MDFIVE-primary-md4-v2: E1 trivial (md4). E2 satisfied -- independently
      regenerated fixed words/target from the frozen seeds and matched the record''s true_word8/word9
      exactly. E3 satisfied -- 2048 < 262144 (independently recomputed). E4 satisfied -- genuinely_verified_
      count=1, pair matches, independently recomputed via verify_match_certificate. E5 satisfied IN THE
      LETTER -- but I independently derived (by tracing the code, before weighing any narrative) that
      E5 is a VACUOUS check for this instrument, since naive_all_pairs_search shares the identical position-1
      read bug as mitm_search. E6 satisfied -- independently reran H2 fixture (n=2000) for both primitives,
      all_ok=True. E7: HEUR-H1''s falsification condition (b) has, read literally, fired (see K4) -- so
      per my predicate, the H1 statistics are correctly REPORTED (satisfying success_criterion 3/4) but
      are NOT eligible as validating evidence, which matches what the record itself does (no "H1 validated"
      conclusion is drawn anywhere in the package).'
    verdict: 'AGREEMENT with the record''s own bottom-line eligibility conclusion (RUN-MDFIVE-primary-md4-v2:
      valid=true; H1 statistics reported, not claimed as validating). This is not mere replication of
      the executor''s implementation: the predicate was derived from the frozen contract''s stated criterion
      text alone, and the E5 weakness was located by independently tracing mitm_search''s and naive_all_pairs_search''s
      source code, arriving at the identical conclusion the Executor''s own `result` field for RUN-MDFIVE-buildcheck
      states -- i.e. two independently-derived readings of the same defect converge, which is corroborating
      evidence the ANOM-1 disclosure is accurate and not overstated, rather than a newly discovered discrepancy.'
    objects_J_K_tested_against_predicate: Object J fails E2 (scale mismatch) and is additionally implausible
      against the measured-throughput cross-check. Object K fails E1 (authorization/parameter-identity
      mismatch). Both correctly classified NOT ELIGIBLE by the blind-derived predicate, matching the required
      proves-too-much failure signature (i.e., the predicate does NOT accept either known-false object).
  defect_list:
  - id: D1
    joint: K1
    severity: named-gap
    description: 'proof_search_map audit 1''s bottleneck claim (b) ("lands the matching point on a register
      that was just updated, so the comparison is meaningful") and proof_obligation #2 (k1=k2=6 brute-force-equality
      control) both silently assumed the returned state-tuple position after backward composition tracks
