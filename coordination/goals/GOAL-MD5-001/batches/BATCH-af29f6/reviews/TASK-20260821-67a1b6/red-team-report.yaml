    severity: named-gap, flagged for explicit Coordinator disposition
    description: HEUR-H1's frozen falsification_condition, read literally against its own text, has fired
      at this scale (1000/1000 non-shrinking, maximally heavier-than-Poisson deviation). The execution
      report declines to call this a falsification, on grounds (root-cause attribution to ANOM-1 rather
