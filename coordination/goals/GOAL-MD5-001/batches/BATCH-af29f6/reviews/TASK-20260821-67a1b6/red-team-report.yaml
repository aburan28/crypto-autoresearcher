  claim_under_review: The frozen package (IDEA-20260821-e46061, DEC-20260821-b1a7b4, H-MDFIVE-bf7767,
    EXP-MDFIVE-88f7d1, TASK-20260821-de817d's execution-report.yaml) honestly executes a bounded, scoped
    method-ceiling audit of a Round-1-restricted, two-free-word splice-and-cut MITM partial-preimage instrument
