      I additionally independently reverified ANOM-1 myself from the frozen module before using it (see
      K3), so the check does not rest on trusting anyone''s narrative characterization of it.'
    derived_predicate: 'eligible(primitive, scale, seeds, claimed_pair, claimed_digest) holds iff: E1
      primitive=md4, OR primitive=md5 AND md5_run_authorization.authorized AND scale/seeds byte-identical
      to the md4 arm; E2 scale = frozen (S=9,k1=10,k2=10,m=12,k=20) and fixed words generated by the exact
      frozen seed-20260821 procedure; E3 total_chunk_evaluations < 2^18; E4 the claimed pair, re-verified
      via a code path SEPARATE from the search, reproduces both the k-bit target and the full Round-1
      output state Y exactly; E5 the k1=k2=6 brute-force-equality control passes; E6 the H2 regression
