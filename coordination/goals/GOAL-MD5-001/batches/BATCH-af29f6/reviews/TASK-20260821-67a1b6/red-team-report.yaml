    recommendation: For any future split-point/matching-quantity design in this instrument family, add
      an explicit proof_obligation requiring a small-scale (e.g. k1=k2=4) computational spot-check, BEFORE
      the declared-scale run, that the matching quantity actually varies with BOTH free words independently
