      text itself.
    recommendation: 'The Coordinator''s closing decision should explicitly rule on this disambiguation
      rather than let it default to neither "H1 falsified" nor "H1 supported" by omission: either (a)
      record H1 as falsified at this scale FOR THIS INSTRUMENT, with the root-cause note carried alongside
