review_plan_record:
  task_id: TASK-20260821-67a1b6
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-af29f6
  target: >-
    The frozen method-ceiling package at the f2093f snapshot commit: the
    idea record (420070, proof_search_map + heuristic_assumptions +
    target_complexity + modeled cost-scaling sketch), the gate decision and
    frozen H/EXP contract (a288f8), and — if approved — the MD4/MD5
    instrument, execution report, and measured cost-scaling table (de817d).
    The claim under review: the package honestly executes a bounded,
    scoped method-ceiling audit against MD4 (and, if named, MD5), and the
    claim tier it lands on does not exceed `analyzed`.
  written_before_reviewer_ran: 2026-08-21 (committed in the batch opening; before TASK-20260821-67a1b6 may run)

  coordinator_prior:
    recorded_before_any_report_returns: True
    expectations:
      - >-
        K1 (proof_search_map completeness) is expected to come out
        HOLDS-WITH-NAMED-GAPS: the baseline-reproduction audit will likely
        reproduce only the STRUCTURE of the published MITM split (which
        words are neutral for which chunk), not the literature's exact
        complexity figures, because both source papers are filed at
        metadata-only / unverified-relay provenance. I expect the finding
        "audit 1 honestly disclosed as structural-only, not numeric" rather
        than a clean pass or a silent overclaim — the failure mode I am
        watching for is the idea quietly treating 2^96/2^102/2^123.4 as
        established facts it reproduces.
      - >-
        K2 (gate fidelity) is the joint most likely to carry a real defect:
        did a288f8 actually enforce the MD5-scope restriction (a named,
        identically-bounded step only), or did it wave through a larger or
        unnamed MD5 run "for completeness"? I expect this to HOLD, but it is
        the joint I would bet money on breaking if anything does — the
        general failure pattern in this program (BATCH-1f30fe's own defects
        were softened labeling, never a hard rule breach) makes a quiet
        scope-widening the highest-probability single defect.
      - >-
        K3 (MD4 certificate re-derivation) I expect to HOLD if a certificate
        was claimed at all: the declared bounded scale is, by design, small
        enough that an honest implementation should find or fail to find a
        match deterministically and reproducibly. A certificate that the
        reviewer's own independent recomputation cannot reproduce is a
        batch-halting finding, not a soft gap.
      - >-
        K4 (heuristic-validation statistics) I expect a named gap: a single
        batch's declared budget (300 s) likely yields a modest sample size
        for the empirical distribution comparison, and I expect the finding
        "the tail check is qualitatively consistent but the sample is too
        small to be a strong statistical claim" — this is an honest
        limitation, not a defect, PROVIDED the report says so; the defect
        would be claiming statistical confidence the sample size does not
        support.
      - >-
        K5 (cost-model honesty) I expect to find at least one instance where
        a modeled number and a measured number are placed in the same table
        without a clear visual/textual distinction, even if both are
        individually correctly labeled in prose — this is the "labeling gap,
        not a lie" pattern seen in BATCH-1f30fe's K4. I do not expect a
        measured-as-modeled or modeled-as-measured mislabeling itself.
      - >-
        K6 (claim-tier ceiling) I expect to HOLD: the closing decision
        should not claim `supported`, given none of CLAUDE.md's four
        promotion gates can be fully satisfied by one bounded-scale batch
        (in particular gate 1, archived proof decomposition, and gate 3, a
        full concrete-cost table at standardized parameters). The break I am
        watching for is a closing decision that reaches for `analyzed` language
        that reads as stronger than the bounded scope actually supports.
    if_the_review_overturns_the_prior: >-
      An overturn here (e.g. K2's scope restriction quietly widened, or K3's
      certificate not independently reproducible) is a batch-halting finding
      and is recorded as the batch's most important result, not absorbed
      into a softer disposition.

  joints:
    - joint: >-
        K1 proof_search_map completeness and honesty: are all four KN-TECH-080
        audits genuinely performed (not placeholders), and does the baseline-
        reproduction audit correctly distinguish "structure reproduced" from
        "literature complexity figure established"?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        Read the idea's proof_search_map field by field. For audit 1, check
        whether any literature complexity figure (2^96, 2^102, 2^116.9,
        2^123.4) is asserted as reproduced/established rather than cited as
        an unverified reference point. For audit 2, check whether the
        observation-collision search was actually attempted (not "assumed
        none exist"). For audit 3, check the quantifier-order statement is
        specific to THIS instrument's declared scale, not a generic
        restatement of the method's textbook description. For audit 4,
        check the nearby-object control's predicted distinguishing result is
        stated BEFORE any run (fixed_before_acquisition), not fitted after.
    - joint: >-
        K2 Gate fidelity and MD5-scope compliance: did the coordinator gate
        (a288f8) enforce the four-audit checklist and the MD5-scope
        restriction, and is any MD5 run in the package exactly the one
        named and bounded step (or none)?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        Compare the frozen EXP contract's MD5-run clause (if any) against
        the idea's named MD5-specific-step decision — do they match exactly
        in scale, seed, and ceiling? If the execution report contains an MD5
        run but the EXP contract does not name one, that is a batch-halting
        finding. If the EXP contract names one but at a LARGER scale than
        the MD4 run, that is also batch-halting (violates "never larger").
    - joint: >-
        K3 MD4 (and conditional MD5) certificate re-derivation: is any
        claimed certificate independently reproducible from the frozen
        instrument and the declared scale alone?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        If a certificate is claimed, recompute it using the frozen
        `harness/run_md4_ceiling.py` at the snapshot commit with your own
        invocation (not reading the executor's stated output) and confirm
        the reported match. If no certificate is claimed (ceiling report
        only), verify the ceiling report's counters are internally
        consistent (search space explored <= declared scale; cost = ceiling
        iff halted).
    - joint: >-
        K4 Heuristic-validation statistical honesty: is the empirical-vs-
        predicted comparison computed correctly, and is the sample-size /
        statistical-power limitation disclosed rather than overclaimed?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        Recompute the comparison statistic from the raw counters reported
        by de817d. Check whether the report states a sample size and
        whether any language claims more statistical confidence than that
        sample size supports (e.g. "confirms" vs "is consistent with, at
        limited sample size").
    - joint: >-
        K5 Cost-model honesty: is every cost-scaling number labeled modeled
        or measured, correctly, and are optimistic assumptions flagged?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        Walk the cost-scaling table row by row. Cross-check each number's
        label against which task (420070 = modeled, de817d = measured)
        produced it. Check that at least the linear-throughput-scaling
        assumption (and any memory-bandwidth-wall omission) is explicitly
        flagged as optimistic, per CLAUDE.md promotion-gate #3.
    - joint: >-
        K6 Claim-tier ceiling: does the closing package (or, if not yet
        closed, does nothing in this reviewed package pre-empt it) stay at
        or below `analyzed`, never `supported`?
      assigned_to: TASK-20260821-67a1b6
      attack_plan: >-
        Check every claim-bearing sentence in the idea, gate decision, and
        execution report for language that reads as `supported` (e.g.
        unconditional statements about MD4's or MD5's preimage resistance
        beyond the declared bounded scale). None of this batch's own
        documents issue the closing decision (that is TASK-20260821-fb3f3c,
        not yet run at snapshot time) — this joint checks that nothing in
        the FROZEN package already asserts more than the bounded runs
        support, which would make an inflated closing decision look
        supported by the record when it should not be.

  proves_too_much:
    objects:
      - object: >-
          OBJECT J (unbounded certificate). A synthetic run record claiming
          a certificate at the literature's full-scale complexity (e.g.
          "found in 2^102 operations, 4 s wall-clock"). The rule's verdict
          is known: physically impossible at this environment's throughput
          and INVALID regardless of how the certificate itself verifies —
          the batch's own declared-bounded-scale rule (fixed before any run)
          makes such a record a fabrication finding, not a strong result.
      - object: >-
          OBJECT K (scope-creep MD5 run). A synthetic execution report
          containing an MD5 run at a LARGER scale than the MD4 run, or with
          no corresponding named step in the EXP contract. The rule's
          verdict is known: INVALID, batch-halting (next_action scope
          violation), regardless of what the run found.
      - object: >-
          OBJECT L (mislabeled cost figure). A synthetic cost-scaling table
          entry with a modeled number captioned "measured" (or vice versa).
          The rule's verdict is known: violates executor.md rule 14 and
          CLAUDE.md promotion-gate #3 — INVALID as a cost anchor regardless
          of whether the underlying number happens to be numerically
          plausible.
    failure_signature: >-
      A package (or gate) that accepts J as a real certificate, accepts K as
      in-scope, or accepts L's label as correct has proved too much and is
      wrong somewhere it has not been read closely enough.
    assigned_to: TASK-20260821-67a1b6

  blind_rederivation:
    required: True
    quantity: >-
      The BOUNDED-CERTIFICATE-ELIGIBILITY predicate as a function of its
      declared inputs: (target primitive, declared bounded scale, seed,
      claimed message(s), claimed digest match) -> eligible / not eligible,
      derived from the frozen EXP contract's stated acceptance criterion
      ALONE, not from the executor's or idea-generator's narrative framing
      of what counts as success.
    parameters: >-
      The frozen `EXP-MDFIVE-<tok>.yaml` contract's acceptance-criterion
      section as the sole source of the quantity's statement; objects J and
      K above as test inputs.
    blind_from:
      - the idea record's (420070) own narrative "what this shows" section
      - the execution report's (de817d) own narrative/self-assessment section
      - task-cards/TASK-20260821-420070.md and TASK-20260821-de817d.md
      - ledger/handoffs/TASK-20260821-420070.yaml and ledger/handoffs/TASK-20260821-de817d.yaml
    assigned_to: TASK-20260821-67a1b6

  blindness:
    within_round: >-
      Two-reviewer round. The validator (TASK-20260821-1601d6) is a SIBLING
      reviewer running concurrently in the same round; its report must not
      be read by this reviewer, and the attestation says so. Lifting
      blindness in a later hardening round requires review-plan record
      amendment with rationale, never drift.
    no_quarantine_reads: >-
      No reviewer in this round reads the quarantined payload; it is
      structurally irrelevant to this batch's method (MITM/preimage, not the
      differential collision path) and no task references it beyond the
      standing hash-only gate carried forward from BCP-2.
    attestation_required: >-
      The report carries review_attestation: task_id, joints_owned,
      sources_read, read_sibling_reports (must be false),
      blind_from_respected (with a note if false), per-joint verdicts, and
      the resolved model with requested policy review-adversarial at xhigh.
