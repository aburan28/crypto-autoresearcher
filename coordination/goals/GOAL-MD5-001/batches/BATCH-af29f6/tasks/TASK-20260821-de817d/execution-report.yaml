  # =========================================================================
  # PROTOCOL DEVIATIONS -- all recorded, none silently patched into the
  # frozen contract (executor.md rule 12 / AGENTS.md rule 5)
  # =========================================================================
  protocol_deviations:
    - id: DEV-1-rfc1320-pinning
      description: >-
        The frozen contract's structural_ingredients names RFC 1320's
        WebFetch-mediated transcript as NOT sha256-pinnable and instructs the
        Executor to fetch and pin the raw text before citing it as a frozen
        input. This session fetched
        https://www.rfc-editor.org/rfc/rfc1320.txt directly with `curl`
        (http_code 200) and pinned it at
        coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt,
        sha256 f727b15e19ab8ac5036ab7921476e8d8644512190ade32a2e0a2fb9d8a2421c7.
        The Round-1 operation list (RFC 1320 sec 3.4, `[ABCD 0 3] [DABC 1 7]
        [CDAB 2 11] [BCDA 3 19]` ... `[ABCD 12 3] [DABC 13 7] [CDAB 14 11]
        [BCDA 15 19]`) and the F-function text (`F(X,Y,Z) = XY v not(X) Z`)
        are BYTE-IDENTICAL to the already-filed WebFetch excerpt
        (rfc1320-md4-round-schedule-excerpt.md) -- diff-checked by this
        session, no discrepancy found. This closes the open acquisition item
        the frozen contract flagged; not a defect, a completed prerequisite.
      severity: none (resolves an explicitly disclosed open item)
    - id: DEV-2-implementation-error-md4-add-b
      description: >-
        First implementation draft used MD5's RFC 1321 FF/GG/HH/II macro
        convention (`a = rotl(a+F(b,c,d)+x+T, s); a += b`) for MD4's Round-1
        step too. RFC 1320 sec 3.4's own operation notation is explicit and
        different: "Let [abcd k s] denote the operation a = (a + F(b,c,d) +
        X[k]) <<< s" -- NO trailing `+= b` term anywhere in MD4's definition
        (Rounds 1, 2, and 3 alike). This is a genuine structural difference
        between the two primitives' step functions, not merely a
        shift/constant difference. Caught immediately: the first draft
        failed ALL SEVEN RFC 1320 A.5 test vectors. Fixed by adding an
        explicit `add_b` parameter (MD4_ADD_B=False, MD5_ADD_B=True) threaded
        through forward_step/backward_step/apply_forward/apply_backward and
        the independent certificate-reverification path
        (_reference_round1_forward). Classification: implementation_error,
        caught by the vector self-test BEFORE any search run (as the frozen
        contract's own audit-1 discipline requires), never affected a
        reported result.
      severity: caught pre-run, no reported result affected
    - id: DEV-3-apply-forward-local-shift-index-bug
      description: >-
        A second implementation bug: the generic `apply_forward` helper
        indexed the 4-cycling shift table by the LOCAL loop index rather than
        the GLOBAL Round-1 step index, which is only correct when the
        supplied word slice starts at global step 0. The call computing
        state16 from state9 (words[9:16], global steps 9..15) used the wrong
        shift values as a result. Caught by comparing the forward
        computation of the Round-1 output state Y against
        `apply_backward`'s independent inversion of the SAME Y (they must
        agree exactly, per HEUR-H2) -- they did not, until `apply_forward`
        was given an explicit `start_index` parameter. Classification:
        implementation_error, caught pre-run by cross-checking two
        independent code paths against each other, never affected a
        reported result.
      severity: caught pre-run, no reported result affected
    - id: DEV-4-apply-backward-word-order-bug
      description: >-
        A third bug in the same debugging pass: `apply_backward`'s own
        documented contract requires its `words` argument in REVERSE order
        (words[0] = the word used at the HIGHEST step being inverted,
        descending to words[-1] at the lowest). Both call sites originally
        passed the fixed words 10-15 in FORWARD order. Fixed by building the
        list with `range(15, 9, -1)`. Caught by the same cross-check as
        DEV-3 (forward-computed Y vs backward-inverted state9 must agree
        exactly under HEUR-H2 for the TRUE word pair). Classification:
        implementation_error, caught pre-run, never affected a reported
        result.
      severity: caught pre-run, no reported result affected
    - id: DEV-5-primary-run-superseded
      description: >-
        RUN-MDFIVE-primary-md4 (the first primary-run attempt) verified only
        the FIRST raw MITM solution found rather than every raw solution,
        understating the informativeness of the run (it reported
        independently_verified: false with no further breakdown, which reads
        as an ambiguous/negative result). Corrected by re-verifying EVERY raw
        solution (cheap at this bounded scale, at most 2^k2 candidates) in a
        NEW run, RUN-MDFIVE-primary-md4-v2, per the immutable-run-records
        rule (a corrected run is a new run ID; the defective one stays in the
        ledger, marked invalid, not deleted). RUN-MDFIVE-primary-md4-v2 is
        the run of record for this task's primary-run reporting below;
        RUN-MDFIVE-primary-md4 is recorded as `invalid` (superseded) in the
        runs.invalid list.
      severity: superseded, corrected run's numbers are authoritative

  # =========================================================================
  # ANOMALY (the load-bearing finding of this task) -- recorded per
  # executor.md rule 12: preserved, not discarded, and NOT silently patched
  # into the frozen contract (executor.md prohibition list / AGENTS.md rule
  # "never modify the hypothesis... request an amendment instead").
  # =========================================================================
  anomalies:
    - id: ANOM-1-word9-independence
      title: >-
        Register A immediately after step 9 is mathematically INDEPENDENT of
        free word9, contradicting H-MDFIVE-bf7767's mechanism/
        observation_collision text, which states chunk2's backward-computed
        value of this same quantity "is a function of free word9."
      finding: >-
        Word 9 is first used at step 10 (RFC 1320/1321 sec 3.4's own
        sequential word schedule, word k used at step k+1): by construction,
        NOTHING computed at or before step 9 -- including register A
        immediately after step 9, the frozen contract's declared matching
        quantity -- can depend on word 9. This was verified two ways: (a)
        algebraically, by deriving backward_step as the exact inverse of
        forward_step and tracing which output-tuple position is genuinely
        recovered from the fixed Round-1-output state Y versus which
        position is trivially copied through unchanged (position 1, "the
        value most recently updated," is copied straight from Y's
        components and is PROVABLY independent of the word supplied to
        backward_step; only position 0 depends on that word, and position 0
        is a DIFFERENT physical register -- the one step 10 is about to
        update, not register A); (b) empirically, by evaluating the
        backward-derived "register A after step 9" for 20 uniformly random
        32-bit word9 candidates (not just the declared 10-bit window) at a
        fixed target -- all 20 gave the IDENTICAL value.
      consequence_for_this_run: >-
        The MITM search's raw solution set at the declared scale (k1=k2=10)
        is NOT a genuine two-free-word joint search result: once word8
        matches the target (which happens for exactly one word8 among the
        1024 tried, as it must -- the TRUE word8), EVERY one of the 1024
        word9 candidates is reported as a "full 20-bit target match," because
        chunk2's own computed value does not vary with word9 at all. This was
        confirmed directly: the primary run's raw solution set contains
        exactly 1024 pairs, all sharing one word8; independently
        re-verifying all 1024 against the FULL 16-step forward computation
        (a check genuinely independent of word9) finds exactly ONE
        genuinely-verified pair -- the true (word8, word9) -- confirming the
        search DID locate the true word8 but supplies zero discriminating
        power over word9. The H1-validation run's per-target counts (both
        matching-window and full-target hit counts) are IDENTICAL across all
        1000 independently-drawn targets (matching_window_hits=2048,
        full_target_hits=1024 for every single MD4 target; 32768/1024 for
        every single MD5 target) -- a zero-variance signature that is itself
        strong corroborating evidence of a deterministic (not birthday-
        random) mechanism, not sampling noise.
      secondary_observation: >-
        A related, likely-compounding structural property: because word8 is
        used at chunk1's OWN LAST step (step 9, immediately AT the declared
        matching point, with no further Round-1 mixing applied to it before
        the comparison), the "matching-window" value is close to a simple
        rotate-and-add function of word8 rather than an output that has
        passed through several rounds of the F-function's mixing --
        inspecting several targets' low-12-bit values as word8 varies showed
        a clearly structured (near-affine-in-the-rotation) relationship, not
        the kind of value HEUR-H1 models as "uniformly random,
        pairwise-independent." This is offered as a candidate EXPLANATION
        for why the observed collision counts are deterministic rather than
        Poisson-distributed; it is not independently re-verified to the same
        standard as the word9-independence finding above and should be read
        as a secondary observation, not a second confirmed defect.
      classification: >-
        This is recorded as a defect/limitation DISCOVERED IN THE FROZEN
        HYPOTHESIS'S MECHANISM (H-MDFIVE-bf7767.mechanism /
        observation_collision), not an implementation_error in this module
        (the module's forward_step/backward_step pass the independent H2
        regression fixture exactly, and the independent
        _reference_round1_forward cross-check correctly identifies the one
        genuine solution among the 1024 raw candidates -- the instrument is
        doing exactly what its formulas say). Per executor.md rule 12 and
        the standing prohibition on modifying the hypothesis, this is
        reported, not patched: the split point S=9 with the matching
        quantity fixed at "register A after step 9" does not, as specified,
        achieve the claimed two-free-word joint dependency. An amendment
        (e.g., moving the matching point later, or comparing a different
        register/window that genuinely depends on both free words) is a
        Coordinator decision, not an Executor one.
      not_a_falsification_of_h1_per_se: >-
        H1's own falsification_condition is "a reproducible ... non-shrinking
        heavier-than-Poisson tail" in the matching-window-collision
        distribution. The observed distribution (zero variance, not merely
        heavy-tailed) is consistent with that falsification condition on its
        face, but its ROOT CAUSE (word9-independence, a data-flow fact about
        the chosen split point) is different from what HEUR-H1 is actually
        about (whether F's single-step balance property extrapolates to
        9-step mixing). Reporting this as "H1 refuted" would overstate what
        was tested; reporting it as "H1 supported" would be worse. Per
        executor.md rule 13, this run reports the frozen prediction
        reference and the comparison statistics only -- see `observations`
        below -- and explicitly does not conclude H1 is validated or
        refuted; that composition (including whether ANOM-1 should be read
        as invalidating this run's H1 test rather than bearing on H1 itself)
        is the Coordinator's and Reviewer's, per the task card's own
        instruction not to draw that conclusion here.

