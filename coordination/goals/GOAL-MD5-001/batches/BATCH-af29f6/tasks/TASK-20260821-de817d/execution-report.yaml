  md5_run_outcome:
    ran: true
    authorization: EXP-MDFIVE-88f7d1.md5_run_authorization.authorized=true (confirmed above)
    framing_per_contract: >-
      "PRE-DECLARED NULL-HYPOTHESIS CONTROL... expected, unsurprising outcome
      ... R in [0.5, 2.0]" (md5_run_authorization.framing).
    R_definition: >-
      Ratio of MD5-Round-1 to MD4-Round-1 cost/success rate to find a
      full-20-bit-target match, at the identical declared scale
      (EXP-MDFIVE-88f7d1 metrics.secondary). Computed here as the ratio of
      mean full_target_hits per target (a direct success-count measure,
      since achieved_n=1000/1000 with zero failures in both arms, so
      "cost/success" reduces to comparing hit rates at fixed cost per
      target: total_chunk_evaluations=2048 identically in both arms).
    R_value: >-
      1024 / 1024 = 1.0 -- MD5 and MD4 arms produced numerically IDENTICAL
      full_target_hits (constant 1024) and total_chunk_evaluations
      (constant 2048) across all 1000 targets in both arms.
    R_in_declared_range: true (1.0 is within [0.5, 2.0])
    honest_caveat: >-
      Per ANOM-1, this R=1.0 agreement is NOT informative evidence for the
      stated null hypothesis ("Round 1 alone carries none of MD5's added
      multi-round security margin"). Both primitives share the IDENTICAL
      word schedule and F-function in Round 1, and the word9-independence
      finding (ANOM-1) is a property of that shared word SCHEDULE, not of
      either primitive's shift table or additive constants (the only two
      things this instrument's --target flag actually varies). R=1.0 is
      close to mechanically guaranteed by that shared structural degeneracy,
      not a genuine measurement of MD4-vs-MD5 divergence at this scale. This
      is reported as the measured, honestly-labeled value the frozen
      contract requires ("computed and reported honestly, whatever its
      value" -- success_criterion (4)); its INTERPRETATION (whether it
      counts as the controlled null the contract anticipated, or is
      uninformative due to ANOM-1) is left to the Coordinator/Reviewer, per
      this task's own instruction not to draw that conclusion here.
    matching_window_hits_differ: >-
      Noted for completeness though not part of R's definition: MD5's mean
      matching_window_hits (32768) is 16x MD4's (2048) -- a real, measured
      difference in bucket-collision structure between the two primitives'
      shift/constant tables, even though it does not translate into any
      full_target_hits difference in this instrument.

