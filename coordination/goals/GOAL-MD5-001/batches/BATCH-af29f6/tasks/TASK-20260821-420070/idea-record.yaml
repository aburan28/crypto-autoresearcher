    - ref: "RFC 1321 (MD5), https://www.rfc-editor.org/rfc/rfc1321"
      provenance: retrieved
      claim: >-
        Exact MD5 Round 1 (FF) operation list, word order X[0..15]
        sequential, shift constants S11=7,S12=12,S13=17,S14=22, per-step
