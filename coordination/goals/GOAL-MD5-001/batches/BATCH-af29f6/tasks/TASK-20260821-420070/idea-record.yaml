  status: proposed
  dominated_by: >-
    For the GENERAL splice-and-cut/MITM preimage method applied to FULL
    MD4/MD5 (the object this program's actual research question,
    RQ-MDFIVE-6870c1, is about), the best-known dominating results in this
    program's corpus are KN-LIT-4878 (MD4, 2^96/2^102) and KN-LIT-582d77
    (MD5, 2^116.9/2^123.4) — both explicitly UNVERIFIED at the
    exact-figure level (bulk-seed relay / metadata-only respectively), so
    "dominated_by" is asserted here only as "the corpus's best cited
    reference points, themselves unverified," not as a checked fact. For
    THIS proposal's actual object (the Round-1-restricted, 20-bit,
    two-free-word toy slice), no other result in this program's corpus
    attempts the same object, so no dominating result was found on that
    object specifically — checked against every KN-LIT/ledger record this
    session's Grep and WebSearch surfaced (see knowledge_retrieval above).
  sota_delta: >-
    Not comparable in a single number: this proposal targets a
    deliberately tiny, self-contained model problem (a ~2^9-fold modeled
    speedup over a ~2^20 baseline restricted to 2 free words), not an
    attack on full MD4/MD5. For RQ-MDFIVE-6870c1's actual method-ceiling
    question, sota_delta is "unmeasured — this record is a
    mechanism-verification instrument design, not a ceiling measurement";
    no attack, ceiling, or ratio versus the full-primitive literature
    figures is claimed.
  honest_accounting:
    object_studied: >-
      The tracked object is the Round-1-restricted, 2-free-word MITM
      matching-point construction over MD4/MD5's Round 1 schedule: a genuine
      LOSSY projection (per docs/inventor-protocol.md section 2) of the full
      16-step Round-1 state — it discards 14 of 16 message words (fixed to a
      declared constant) and discards everything past step 16, retaining only
      the (word8, word9, register-A-after-step-9) triple, which propagates
      deterministically through the retained chunk1/chunk2 arithmetic exactly
      because the discarded words are held fixed and the retained words'
      influence on the retained state is a well-defined function (verified
      symbolically above, not merely a coordinate change: the discarded 14
      words genuinely change what is computable from the retained triple
      alone, since without fixing them the retained state is under-determined
      — this is not lossless, and is not a mere renaming of the full state).
    depth_of_verified_structure: >-
      Symbolic/deterministic verification only, done by direct reading of
      both RFC texts this session (word-usage-per-step tables, F-function
      text comparison, the negative full-round-has-no-free-word check). No
      code has been run and no run record exists yet (this is a 0-run,
      design-only task per its budget); the empirical/statistical claims
      (H1, H2, predictions) are UNTESTED as of this record and are proposals
      for TASK-20260821-de817d, not results.
    enumerated_closures: []
    closures_note: >-
      No closure is claimed or attempted by this record. It proposes an
      instrument and a control; it does not conclude that any avenue is
      exhausted.
    open_directions_for_next_session: >-
      (1) TASK-20260821-a288f8 must decide whether to approve, revise
      (e.g. scale k1/k2 up for a more statistically powerful H1 check within
      the same 300 s ceiling — see the recommendation in `assumptions`), or
      reject this design before any run. (2) RFC 1320's raw text remains
      un-pinned (no sha256) in this program's corpus — a session with
      Bash/network tools should acquire and pin it before it is cited as a
      frozen input to any run. (3) H3 (uniformity extrapolation to larger
      k1,k2) is explicitly unvalidated and is the natural next
      validation-ladder rung if this bounded slice's H1 check passes. (4) A
      genuine multi-round (round-crossing) instrument is a substantially
      harder design problem than this proposal solves — the negative fact
      established in baseline_embedding (no neutral word survives a
      full-round chunk) means any future multi-round extension needs a
      different chunking strategy than "split within one round," which this
      record does not attempt to design.
