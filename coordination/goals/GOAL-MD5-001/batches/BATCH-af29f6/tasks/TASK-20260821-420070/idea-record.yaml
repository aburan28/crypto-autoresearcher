    - ref: "Aoki, Sasaki, 'Preimage Attacks on One-Block MD4, 63-Step MD5 and More', FSE 2009"
      provenance: recalled
      claim: >-
        General splice-and-cut / initial-structure / partial-matching MITM
        preimage technique family for MD4/MD5-style compression functions.
      verified_by: null
      note: >-
        Surfaced via WebSearch this session (title, venue, and a
        search-engine-generated summary only — no primary text read). Named
