idea:
  id: IDEA-20260821-e46061
  title: >-
    Round-1-restricted, symbolically-verified splice-and-cut MITM
    partial-preimage instrument, applied identically to MD4 (control) and
    MD5 (nearby object) at a declared 2-free-word bounded scale
  class: control
  recorded_at: '2026-08-21'
  task_id: TASK-20260821-420070
  batch_id: BATCH-af29f6
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  role: idea-generator

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-sonnet-5
    fallback_used: false
    degraded: false
    bedrock: >-
      Amazon Bedrock was not selected, configured, probed, or contacted in
      this session (SC-8).

  claim: >-
    A meet-in-the-middle ("splice-and-cut") chunk-separation instrument,
    restricted to Round 1 (the first 16 steps) of MD4/MD5 and searching over
    exactly two message words fixed to a declared small bit-window each,
    finds a match on a declared k-bit partial target using
    O(2^{k1}+2^{k2}+2^{k1+k2-m}) chunk evaluations against a naive
    all-pairs baseline of O(2^{k1+k2}) evaluations over the SAME restricted
    2-word search space, where (S=9, k1=k2=10, m=12, k=20) is the declared
    bounded parameter slice for this batch. This claim is about a tiny,
    self-contained, RFC-schedule-derived model problem, NOT about full
    48-step MD4 or full 64-step MD5, and is falsifiable at every one of the
    numbered predictions below. It further claims that applying the
    IDENTICAL instrument (same S, k1, k2, m, k) to MD5's own Round-1
    step/constant set constitutes a legitimate nearby-object control per
    KN-TECH-080 audit 4, because MD5's Round-1 shares MD4's Round-1 word
    schedule and F-function exactly but differs in shift amounts and
    additive constants (RFC 1321 section 5, points 2 and 6) — the precise
    two structural changes RFC 1321 itself names as MD5's hardening over
    MD4.

  mechanism: >-
    RFC 1320 (MD4) and RFC 1321 (MD5) both specify Round 1 as 16 steps that
    use message words X[0..15] in strict sequential order (step k+1 uses
    word k), cycling register updates (A,D,C,B) every 4 steps, with the
    IDENTICAL auxiliary function F(X,Y,Z) = (X AND Y) OR (NOT-X AND Z) in
    both primitives' Round 1 (verified directly against both RFC texts in
    this session, see baseline_embedding below). Because Round 1's word
    schedule uses each of the 16 words exactly once and in index order,
    splitting the 16 steps at any interior step S=9 produces two
    STRUCTURALLY DISJOINT word sets by construction: chunk1 (steps 1-9)
    uses only words {0..8}; chunk2 (steps 10-16) uses only words {9..15}.
    Word 8 (last used at step 9, the chunk1/chunk2 boundary) is therefore
    usable as chunk1's free/neutral word (varying it recomputes only
    chunk1's forward pass; chunk2's backward pass never touches it), and
    word 9 (first used at step 10) is chunk2's symmetric free word. Fixing
    the other 14 words to a declared pre-registered constant lets chunk1 be
    enumerated forward over word8's declared k1-bit window and chunk2
    enumerated backward over word9's declared k2-bit window independently,
    then joined via a hash table keyed on an m-bit window of register A
    (which step 9 just updated, since 9 = 1 mod 4). This IS the
    "chunk-separation via neutral message words plus a matching-point hash
    table" mechanism both KN-LIT-4878 and KN-LIT-582d77 report using at full
    scale (splice-and-cut / meet-in-the-middle preimage cryptanalysis, a
    documented technique family — see citations); this proposal reproduces
    the MECHANISM exactly and symbolically from the RFC schedules
    themselves, at a scale and location (one round, two free words) far
    smaller and structurally simpler than the multi-round, "initial
    structure" / partial-matching constructions those papers report, whose
    exact word choices are NOT independently verified here (KN-LIT-4878:
    unverified bulk-seed relay; KN-LIT-582d77: metadata-only provenance).

  novelty_status: unverified
  novelty_note: >-
    The splice-and-cut / meet-in-the-middle preimage technique itself is a
    KNOWN, published technique family (Aoki & Sasaki, "Preimage Attacks on
    One-Block MD4, 63-Step MD5 and More", FSE 2009 — found via WebSearch
    this session, not read in primary text; related to KN-LIT-582d77's
    "related work" per RQ-MDFIVE-6870c1's provenance block). This proposal's
    SPECIFIC construction — restricting to Round 1 only, splice point S=9,
    the exact free-word choice (word8/word9), and the declared bounded
    scale (k1=k2=10, m=12, k=20) — was not found in this program's corpus
    or in the WebSearch excerpts retrieved this session; it is treated as
    this program's own bounded instantiation of a known method family, not
    independently checked against any specific published toy-model paper.
    Classified `unverified`, not `adaptation`, per AGENTS.md rule 9 /
    idea-generator.md's citation-provenance rule: the only citation backing
    the general mechanism (Aoki & Sasaki, FSE 2009) is provenance `recalled`
    (a WebSearch title/venue/summary, no primary text read this session), and
    a `recalled` reference may not back `novelty_status: adaptation` -- it is a
    pointer for a future reader, not a checked source. A session that reads
    the primary FSE 2009 text could upgrade this citation to `retrieved` and
    this record's classification to `adaptation` in a new record; this one
    does not claim that verification.

  citations:
