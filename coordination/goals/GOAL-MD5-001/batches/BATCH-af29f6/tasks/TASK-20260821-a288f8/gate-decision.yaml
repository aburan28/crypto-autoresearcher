gate_decision:
  task_id: TASK-20260821-a288f8
  batch_id: BATCH-af29f6
  goal_id: GOAL-MD5-001
  gates: IDEA-20260821-e46061
  decision: approve
  decision_record: ledger/decisions/DEC-20260821-b1a7b4.yaml
  frozen_records:
    hypothesis: ledger/hypotheses/H-MDFIVE-bf7767.yaml
    experiment: experiments/EXP-MDFIVE-88f7d1/specification.yaml
  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    resolved_model_id: claude-sonnet-5
    fallback_used: false
    degraded: false
    bedrock: "Amazon Bedrock was not selected, configured, probed, or contacted in this session (SC-8)."

  audit_1_bottleneck_and_baseline_embedding:
    verdict: HOLDS, not a placeholder
    reasoning: >-
      The bottleneck (which interior Round-1 split keeps a free word
      available) is decision-changing. The baseline reproduction is done
      symbolically by direct line-by-line reading of both RFC texts this
      session (RFC 1321 local full text sha256-pinned; RFC 1320 via WebFetch,
      honestly flagged as not yet sha256-pinnable). Both primitives' exact
      word-usage-per-step and F-function text were compared directly, not
      merely numerically resembled. A negative control was executed by hand
      (a full-round chunk leaves NO free word), which is exactly the kind of
      check a paper-thin baseline claim would skip. The one gap (RFC 1320
      pinning) is disclosed, not hidden, and is carried forward as an
      Executor open item in the frozen EXP contract's structural_ingredients
      / invalidation discipline.

  audit_2_observation_collision:
    verdict: HOLDS
    reasoning: >-
      The matching-window observable (12-bit register-A window) is named,
      and the idea actively searches for and characterizes the expected
      collision case (two distinct word8/word9 pairs agreeing on the
      12-bit window but not the full 20-bit target) rather than assuming it
      away -- it computes the expected rate under the birthday heuristic in
      advance (~256 matching-window hits, ~1 expected full match) and
      commits the paired validation run to reporting both counts
      independently. This satisfies the audit's requirement to search for,
      not merely assert, identifiability.

  audit_3_quantifier_order:
    verdict: HOLDS
    reasoning: >-
      Explicit EXISTS-per-fixed-target statement, explicitly NOT a
      forall-targets claim, with the witness explicitly allowed to depend on
      the target instance. Clean and unambiguous.

  audit_4_method_ceiling_and_nearby_object:
    verdict: HOLDS
    reasoning: >-
      strongest_certifiable_claim is tightly scoped to the 20-bit slice,
      explicitly disclaiming full-primitive and literature-scale figures.
      The MD5 nearby-object control names the identical instrument and the
      exact two RFC-1321-named hardening changes (shifts, per-step
      constants) as the sole substitution, states the null-hypothesis
      prediction (R in [0.5,2.0]) BEFORE any run, and requires a
      null-constant-control replication (explicitly out of this contract's
      scope/budget) before crediting a surprising result. This is a real
      pre-registered comparison, not a post-hoc framing.

  md5_scope_compliance_check:
    verdict: COMPLIANT
    reasoning: >-
      GOAL-MD5-001.yaml next_action permits "No further MD5 runs in batch 4
      unless the ceiling audit names an MD5-specific step, gated by
      TASK-20260821-a288f8's approval at identical bounded scale to the MD4
      run." IDEA-20260821-e46061.md5_specific_step_decision.decision is
      NAMED, and its stated parameters (S=9, k1=k2=10, m=12, k=20, same
      14-fixed-word seed convention, only shift/constant substitution) are
      IDENTICAL to the MD4 arm in every respect but the target primitive's
      constants -- never larger. This gate's frozen EXP contract
      (md5_run_authorization block) enforces "never_larger_than_md4_arm"
      explicitly and frames the run as a pre-declared null-hypothesis
      control, not an attack attempt. Authorized.

  claim_ceiling_check:
    verdict: COMPLIANT
    reasoning: >-
      Both the idea and this gate's frozen records state, consistently with
      batch.yaml's claim_ceiling, that this work cannot exceed `analyzed`.
      CLAUDE.md's four `supported`-promotion gates cannot jointly be
      satisfied by one bounded-scale batch, and this is stated explicitly
      rather than rounded up anywhere in the chain.

  roadmap_bias_pairing_check:
    verdict: COMPLIANT
    reasoning: >-
      HEUR-H1 (the conditional dependence load-bearing the matching-window
      argument) is paired with a heuristic-validation experiment in the SAME
      batch (this contract's H1 sampling run: N targets, chi-square +
      tail check against the predicted Poisson distribution) and with a
      proof-of-concept implementation task (TASK-20260821-de817d) in the
      same batch, not deferred. HEUR-H3 is honestly left unvalidated and
      named as future work.

  non_duplication_and_completion_criteria_fit:
    verdict: COMPLIANT
    reasoning: >-
      No prior H-MDFIVE/EXP-MDFIVE record exists in this program's ledger
      (checked: ledger/hypotheses/H-MDFIVE-*.yaml and
      ledger/experiments/EXP-MDFIVE-*.yaml both empty before this task).
      This work targets GOAL-MD5-001's third completion criterion (a METHOD
      CEILING STATEMENT for MITM/biclique preimages against MD5, with MD4 as
      the control) and does not duplicate BATCH-1f30fe's blind-calibration
      birthday-search work (a structurally different method and object).

  gate_authoring_discipline: >-
    This gate does not rewrite IDEA-20260821-e46061's proof_search_map or
    md5_specific_step_decision to force a pass -- both are frozen into
    H-MDFIVE-bf7767 essentially as proposed. The only additions this gate
    makes are (1) a concrete, deterministic, pre-registered seed/generation
    procedure for the 14 fixed words and all target draws (needed to make
    "fixed before any run" checkable, following this goal's own BCP-2
    fixed_before_acquisition precedent) and (2) an explicit decision to
    freeze the bounded scale at the idea's proposed floor (k1=k2=10) rather
    than scale it up, since scaling the design is a science decision this
    gate declines to make unilaterally.

  outcome: >-
    APPROVE. H-MDFIVE-bf7767.yaml and EXP-MDFIVE-88f7d1.yaml are frozen and
    consumed. DEC-20260821-b1a7b4.yaml records the formal decision.
    TASK-20260821-de817d is authorized to run against the frozen contract,
    including its conditional MD5-side arm under
    EXP-MDFIVE-88f7d1.md5_run_authorization.
