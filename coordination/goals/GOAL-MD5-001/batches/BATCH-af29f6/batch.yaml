claim_ceiling: >-
  method_ceiling_audit_bounded_scale_md4_control_plus_instrument_class_cost_model_only.
  This batch (a) formalizes a KN-TECH-080 proof_search_map for the
  MITM/splice-and-cut preimage technique against MD4, the lower control where
  the method is reported (unverified provenance, KN-LIT-4878) to break
  through; (b) gates that proposal through the Coordinator's dispatch-gate
  checklist and freezes a bounded experiment protocol — the protocol NEVER
  claims execution at full published complexity (2^102 MD4 per KN-LIT-4878,
  relayed/unverified; 2^123.4 / 2^116.9 MD5 per KN-LIT-582d77, metadata-only)
  — it claims only a DECLARED, SMALL, BOUNDED target scale, run to a literal,
  independently-reverifiable certificate; (c) executes exactly one MD4
  bounded run plus its paired heuristic-validation sampling experiment
  (roadmap-bias pairing rule), and — ONLY IF the proof_search_map names a
  concrete MD5-specific step and the gate approves it — exactly one
  identically-bounded MD5 nearby-object run, never larger, never claiming
  anything about full MD5's preimage resistance; (d) produces a modeled (not
  measured) cost-scaling table for the instrument class, anchored to actual
  measurements from this batch and BATCH-1f30fe's 54-55 s / 2^21-block
  anchor, honestly labeled per role rule (executor.md #14); (e) two
  independent reviews under a pre-committed plan; (f) an isolated ledger
  archive. The resulting claim tier is expected to land at `analyzed` at
  best, never `supported` — CLAUDE.md's four promotion gates (proof
  decomposition, validated numbered heuristics, concrete-cost table,
  independent review-xhigh + red-team cost/heuristic pass) cannot all be
  satisfied by one bounded-scale batch, and the closing task must say so
  explicitly rather than round up.

objective: >-
  Name the strongest CERTIFIABLE claim the MITM/splice-and-cut preimage
  method can make against MD4 at a declared bounded scale (with a literal,
  reverifiable certificate), state whether the SAME bounded instrument shows
  a distinguishable ceiling when pointed at MD5 (only if that comparison is
  explicitly named and approved as in-scope), and produce an honestly-labeled
  cost-scaling model for what closing the ~2^64-block gap would cost this
  instrument class. A count of screened-and-rejected variants with no named
  obstruction is a fatigue report (goal completion_criteria, verbatim) and
  is recorded as `unverified`, not as a ceiling.

