claim_ceiling: >-
  frontier_ledger_and_md4_control_scoping_only. This batch (a) builds a
  frontier ledger of the published MD4/MD5 collision and preimage results
  from primary text (provenance: retrieved, per entry), (b) scopes the
  instrument class through a falsifiable idea record, and (c) executes the
  MD4 CONTROL RUN of the calibrated instrument class with its null-object
  control (cost-anchor transfer, partial-hit signature, BCP-2 decision-
  table row). All three are statements about the method/instrument at the
  declared scope and about published results (cited). NONE is evidence
  about MD5 (SC-2/SC-4), none is a security claim about MD4 (published
  results are cited, not re-claimed), and none is the method-ceiling
  STATEMENT itself (completion criterion 3: named obstruction + argument +
  forward guidance, decided at the close from what the evidence carries -
  unverified status if it does not).

objective: >-
  THE METHOD-CEILING AUDIT OPENS WITH MD4. RANK 1 acquires RFC 1320 (the
  MD4 specification) and the published MD4/MD5 collision and preimage
  frontier results in primary text under the BATCH-46254b source-
  preference order, and writes the frontier ledger (one entry per result,
  provenance per entry; the F-7 "first practical preimage attack" apparent
  error checked: settled with primary citation or still UNSETTLED with the
  reason). RANK 2 (idea-generator) reads the ledger and produces the
  instrument-class audit scope: 1-3 ranked falsifiable candidates for the
  class that could close the ~2^64-block gap (mechanism, asymptotic cost,
  campaign-scale feasibility, predictions, falsification, Pareto checks),
  the concrete MD4 control-run specification, and the named-obstruction
  candidate for the MD5 preimage frontier or the explicit statement that
  it cannot yet be named. The Coordinator rules the MD4 run specification
  (recorded before dispatch). RANK 3 builds harness/run_md4_calib.py
  (standalone MD4 from the RFC 1320 text, same search structure as the
  frozen MD5 instrument) and runs the MD4 TARGET and the MD4 NULL OBJECT
  (constants cyclically shifted by 16, everything else identical)
  SEQUENTIALLY: seed 0, 900 s ceiling each, 4 GB, sealed hash-manifested
  input sets, CONSUMPTION N/A (the MD5 payload sha checked, intersection
  empty), charged via run_wrapped, interpreted through BCP-2's decision
  table R1-R6 with TOL = 2 and the MD5 calibration pair
  (54.179836 / 55.156728 s) as the named cross-primitive cost-transfer
  baseline. Then one isolated content_first snapshot, two concurrent
  independent reviews under the pre-committed plan (red team on the frozen
  package; validator on run integrity), and one isolated commit-mode
  ledger archive.

