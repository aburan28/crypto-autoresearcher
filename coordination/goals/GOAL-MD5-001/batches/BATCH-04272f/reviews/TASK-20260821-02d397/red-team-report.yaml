        "candidate." However: (1) this is in the Coordinator's adjudication,
        not the frozen package; (2) the Coordinator says "data only - the
        ceiling statement is the close's, not this task's"; (3) "confirmed as
        an instrument-class property" means the obstruction is real (the
        MSB-prefix doesn't grow), not that the method-ceiling question is
        closed. This is a concern for the Coordinator to address at the close —
        the inventor protocol says an obstruction should be "labeled a candidate
        with its argument and its forward guidance, not a statement." The
        Coordinator's "confirmed" language could be read as a statement. This
        is NOT a break in the frozen package; it is a scope-inflation concern
        in the Coordinator's adjudication.

