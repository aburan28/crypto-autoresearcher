        - file: BCP-2.yaml null_object_control.decision_table R6 (lines 1189-1198)
          finding: >-
            BCP-2 R6 does_not_show: "That no collision path exists for either
            (SC-4). A clean statement about the instrument at the declared
            encoding, seed, and ceiling. Per the evidential asymmetry, this is
