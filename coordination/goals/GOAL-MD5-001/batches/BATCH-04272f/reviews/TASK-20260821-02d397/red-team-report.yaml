  # ==================================================================
  # BLIND RE-DERIVATION (BCP-2 decision-table row predicate)
  # ==================================================================
  blind_rederivation:
    quantity: >-
      The BCP-2 decision-table ROW PREDICATE as a function of its declared
      inputs: (target outcome, variant outcome, R = variant_wall /
      target_wall, TOL = 2) -> row R1-R6, plus the row's does_not_show text
      and the known-limit statement applicability (R1-R3).
    source: >-
      BCP-2.yaml null_object_control section ONLY (lines 1054-1212 of
      coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml):
      named_tolerance (TOL = 2, R = variant_wall / target_wall, [0.5, 2.0] =
      COMPARABLE), named_baseline (target run's own wrapper-measured
      wall_seconds), cost_definition (cost = wall_seconds, or ceiling if
      halted), decision_table (R1-R6 with outcomes, shows, does_not_show),
      known_limit (affects R1, R2, R3 only — the variant-success rows).
    predicate: |
      row(target_outcome, variant_outcome, R, TOL=2):
        if target == SUCCESS and variant == SUCCESS:
          if 0.5 <= R <= 2.0: R1  (comparable)
          elif R > 2.0:         R2  (variant markedly more expensive)
          elif R < 0.5:          R3  (variant markedly cheaper)
        elif target == SUCCESS and variant == FAIL: R4
        elif target == FAIL and variant == SUCCESS:  R5
        elif target == FAIL and variant == FAIL:     R6
      # R is only used to distinguish R1/R2/R3 (all target SUCCESS + variant
      # SUCCESS). For R4/R5/R6, the outcomes alone determine the row; R is
      # reported as a cost comparison but does not change the row.
      # known_limit applies to R1, R2, R3 only (partial-structure-recall not
      # excluded). R4/R5/R6 are not affected by the known_limit.
    test_inputs:
      - name: MD4 pair (primary test)
        source: run records (not reports)
        target_outcome: FAIL
        variant_outcome: FAIL
        R: 0.9935513427
        expected_row: R6
        does_not_show: >-
          That no collision path exists for either (SC-4). A clean statement
          about the instrument at the declared encoding, seed, and ceiling. Per
          the evidential asymmetry, this is the cleanest row: a clean failure
          rules out both "found by search" and "found by recall" equally.
        known_limit_applies: false
        result: R6 — matches the report's named row. does_not_show text matches
          BCP-2 R6 exactly (verified by string comparison). known_limit does not
          apply (R6 is not R1/R2/R3).
      - name: synthetic beyond-tolerance pair (edge test)
        source: synthetic
        target_outcome: FAIL
        variant_outcome: FAIL
        R: 3.0
        expected_row: R6
        does_not_show: (same as above — R6 regardless of R)
        known_limit_applies: false
        result: >-
          R6 — the row is determined by the outcomes (both FAIL), not by R.
          R = 3.0 is outside [0.5, 2.0] but this does not change the row because
          TOL only distinguishes R1/R2/R3 (both SUCCESS). For R6, R is a cost
          comparison reported alongside the row, not a row determinant. This
          confirms the predicate's structure: outcomes determine the row first,
          R only sub-classifies the both-SUCCESS case.
    blind_from_respected: true
    blind_from_list:
      - "BCP-2.yaml self_report section (lines 1358+) — NOT read"
      - "TASK-20260821-cbb510.md — NOT read"
      - "ledger/handoffs/TASK-20260821-cbb510.yaml — NOT read"
      - "TASK-20260821-229643.md — NOT read"
      - "ledger/handoffs/TASK-20260821-229643.yaml — NOT read"
      - "TASK-20260821-c4a158.md — NOT read"
      - "ledger/handoffs/TASK-20260821-c4a158.yaml — NOT read"
    sources_actually_read:
      - "BCP-2.yaml null_object_control section (lines 1054-1255) — the sole source for the predicate"
      - "runs/RUN-MDFIVE-md4-v0-s0/raw-result.json + manifest.yaml — primary test input"
      - "runs/RUN-MDFIVE-md4-v16-s0/raw-result.json + manifest.yaml — primary test input"
      - "EV-MDFIVE-f3e1ca.yaml — MD5 anchor (R_md5 = 1.018031, row R6)"
      - "review-plan/review-plan-02d397.yaml — the plan"
      - "task-cards/TASK-20260821-02d397.md + ledger/handoffs/TASK-20260821-02d397.yaml — my own card + envelope"
      - "DEC-20260821-ddaa33.yaml — opening decision"
      - "dispatch_queue.json — rank3_ruling"
