            The BUILD cost cannot be mis-read as RUN cost or vice versa.
        - file: md4-control-run-report.yaml certificate sections (lines 422-434, 586-594)
          finding: >-
            No SUCCESS occurred (both FAIL), so no certificate was produced.
            The weaker-acceptance-path limitation is named: "Had a full-128
