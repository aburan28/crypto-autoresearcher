red_team_report:
  id: RT-20260821-02d397
  task_id: TASK-20260821-02d397
  claim_under_review: >-
    The frozen batch-4 package (frontier ledger + instrument-class scope + MD4
    control runs): that it honestly records the published frontier in primary
    text with retrieved provenance, scopes the instrument class as a falsifiable
    record, executes the MD4 control per the ruled scope, and that the verdicts
    it lands on (cost-transfer, partial-hit signature, decision-table row, scope
    statements) are the ones the bytes support.

  # ==================================================================
  # PER-JOINT VERDICTS (L1-L5)
  # ==================================================================
  per_joint_verdicts:

    L1_frontier_ledger_provenance:
      verdict: holds
      grounding:
        - file: coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/tasks/TASK-20260821-cbb510/frontier-ledger.yaml
          finding: >-
            8 entries total: 6 retrieved (entries 1-4,7,8), 2 recalled (entries
            5,6). Every retrieved entry carries a URL, retrieved_date
            2026-08-21, and a verification_note quoting the primary text.
            Filed text exists for entries 1-4 (eprint-*.txt files verified by
            sha256: eprint-2004-199-wang-collisions.txt = 0a0b7c88..., 
            eprint-2010-016.txt = 7917b5b8..., eprint-2010-583.txt =
            498e95d3... — all match acquisition-report.yaml S2/S9/S10).
        - file: frontier-ledger.yaml entries 5,6
          finding: >-
            Both recalled entries honestly mark url: null (entry 5) or url
            present but retrieved_date: null (entry 6), filed_text: null, and
            record the source-preference order exhaustion (entry 6: S14-S19
            in acquisition-report.yaml; entry 5: not on ePrint, LNCS behind
            Springer bot-block). The 2^123.4 MD5 preimage exponent and the 2^107
            Aoki-Sasaki baseline are marked RECALLED (pointer, never support).
            The F-7 "first practical preimage attack" flag remains UNSETTLED
            with reason (Sasaki-Aoki 2009 primary text unobtainable).
        - file: frontier-ledger.yaml entries 7,8
          finding: >-
            NAMED GAP: entries 7 (Aumasson-Meier-Mendel 2008/183) and 8 (Zaikin
            arXiv 2212.02405) are marked retrieved but have filed_text: null
            (abstract only, not filed as a text file). The verification_note
            and limitations are honest ("Abstract only; full text not read").
            The provenance discipline header (lines 4-11) says retrieved entries
            should carry filed_text; entries 7-8 do not. This is a named gap,
            not a fabrication — the agent fetched and read the abstract (primary
            text from the publisher) and recorded what it grounded the entry on.
        - file: acquisition-report.yaml lines 72-84
          finding: >-
            NAMED GAP (wording): the acquisition report uses "64-entry
            operation-order constant sequence" and "T[32..63] = 6ED9EBA1" for
            MD4, which has 48 steps (not 64). The "64" is a carry-over from MD5
            language. The actual implementation correctly uses 48 entries
            (verified: instrument _T48 = (0,)*16 + (_C2,)*16 + (_C3,)*16, line
            155 of harness/run_md4_calib.py). Already flagged as OBS-2 in the
            run report and in the dispatch queue's completed_note for cbb510.
      prior_overturn: false
      prior_note: >-
        The coordinator prior expected L1 to HOLD with named gaps (an honest
        paywalled-recalled gap, not a mislabel). This matches: the recalled
        entries are honestly marked, the retrieved entries carry the required
        fields (with the named gap on entries 7-8), and no mislabeled retrieved
        entry was found.

    L2_scope_pareto_honesty:
      verdict: holds
      grounding:
        - file: coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/tasks/TASK-20260821-229643/instrument-class-scope.yaml
          finding: >-
            3 ranked candidates (CAND-1 differential-guided collision
            enumeration, CAND-2 state-level MITM, CAND-3 step-reduced inversion).
            Each carries: mechanism (stated), asymptotic_time (with provenance:
            retrieved or recalled), asymptotic_memory (with provenance),
            feasibility_at_declared_hardware (executable/measurable/argument-only),
            quantitative_prediction, minimal_discriminating_test,
            falsification_condition. All falsification conditions are concrete
            (R within TOL = 2 of the null baseline, or success-probability decay).
        - file: instrument-class-scope.yaml section_2_pareto_honesty (lines 187-261)
          finding: >-
            All three dominated_by: null verdicts carry rows_checked listing
            all 8 frontier-ledger entries + the instrument row (9 rows each).
            The null justification is "same method family, delta ~0" — the
            candidates are the same method class as the frontier entries, so
            they neither dominate nor are dominated by them. sota_delta is
            quantitative (~0 for same-class, with the candidate's own cost
            marked recalled where not traceable to a ledger 2^N). where_it_is_weak
            is present for each candidate.
      prior_overturn: false
      prior_note: >-
        The coordinator prior expected L2 to come out as: candidates falsifiable,
        dominated_by nulls rest on a recorded frontier check, sota_delta
        quantitative. This matches.

    L3_md4_run_identity_and_cost_transfer:
      verdict: holds
      grounding:
        - file: runs/RUN-MDFIVE-md4-v0-s0/manifest.yaml, runs/RUN-MDFIVE-md4-v16-s0/manifest.yaml
          finding: >-
            Run-identity diff: instrument sha256 a8ebb8e80ef1eaf8e61b82195ff4e06dd231092ae98d85e31fce28682dce3b17
            IDENTICAL across both runs. Seed 0 both. Ceiling 900.0 both. Memory
            4 GB both. k_bits 40 both. n_max 2097152 both. variant_shift 0
            (target) vs 16 (null) — the ONLY difference. b1_hex identical
            (cd072cd8...dc1f7). commit bf50c506b both. runner.py sha256
            4c07abfd... both. __init__.py sha256 7ac4edf8... both.
        - command: "python3 -c 'T=[0]*16+[0x5A827999]*16+[0x6ED9EBA1]*16; Tp=[T[(i+16)%48] for i in range(48)]; ...'"
          output: >-
            T-prime table recomputed from RFC 1320 section 3.4 constants + shift
            16: T'[0..15]=0x5a827999, T'[16..31]=0x6ed9eba1, T'[32..47]=0x0.
            0 mismatches against variant-definition.yaml (48/48 entries match).
            RFC 1320 constants verified: floor(2^30*sqrt(2))=0x5a827999,
            floor(2^30*sqrt(3))=0x6ed9eba1.
        - file: harness/run_md4_calib.py line 255
          finding: >-
            The shift is applied as T[(i + shift) % 48] in the solver core
            (_compress). The MD4 step form is a = (a + f + x[k] + T[(i+shift)%48])
            <<< s — NO b+ term (unlike MD5's a = b + (...)). The independent
            checker (MD4Checker, line 351-352) applies the same shift. The
            _check_table() import-time self-check (lines 192-218) verifies the
            48-entry constant sequence, the constant definitions, and the
            48-step schedule against independently transcribed RFC 1320 tables.
            NO second unannounced difference found: step_count 48 (same),
            per_step_rotation_amounts _SCHEDULE48 (same), schedule_word_order
            (same), round_functions F/G/H (same), initial_values _IV (same),
            merkle_damgard_chaining (same), arx_structure (same, no b+ term).
        - command: "python3 -c 'R_md4 = 38.604348/38.85491; R_md5 = 55.156728/54.179836; ...'"
          output: >-
            MD4 pair R = t_null/t_target = 38.604348/38.85491 = 0.993551342674581
            (within [0.5, 2.0] COMPARABLE). MD5 anchor R = 55.156728/54.179836
            = 1.0180305455335819 (from EV-MDFIVE-f3e1ca O-1, not the reports).
            MD4/MD5 target ratio = 38.85491/54.179836 = 0.7171470581786182.
            MD4/MD5 null ratio = 38.604348/55.156728 = 0.6999027933636672.
            Step ratio 48/64 = 0.75. All match the run report's values exactly.
            The cost-transfer comparison was recomputed from the run records
            and EV-MDFIVE-f3e1ca, not copied from the report.
      prior_overturn: false
      prior_note: >-
        The coordinator prior expected L3 to HOLD on the mechanics (standalone
        MD4 from RFC 1320, identical search structure, seed 0, 900 s ceiling,
        run_wrapped charging) with the variant EXACTLY the declared shift and
        the cost-transfer within TOL = 2. This matches: the variant is exactly
        T[(i+16) mod 48], the R ratio is 0.9936 (COMPARABLE), and the MD4/MD5
        cost ratios (0.717/0.700) are directionally consistent with the 48/64
        step ratio (0.75). R < 1 is the informative direction (MD4 cheaper),
        as expected; R > 2 would have been the measurement artifact worth
        finding, and it did not occur.

    L4_decision_table_and_cost_honesty:
      verdict: holds
      grounding:
        - file: runs/RUN-MDFIVE-md4-v0-s0/raw-result.json, runs/RUN-MDFIVE-md4-v16-s0/raw-result.json
          finding: >-
            From the run records (not the reports): target outcome = FAIL,
            variant outcome = FAIL, R = 0.9935513427 (within [0.5, 2.0]).
            The pair produces row R6 (target FAIL, variant FAIL) per BCP-2's
