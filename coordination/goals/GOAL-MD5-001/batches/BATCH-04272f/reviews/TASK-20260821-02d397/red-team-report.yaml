        labeled a candidate, and the partial-hit comparison is stated as first
        discrimination data. No premature closure found.
      concern_for_the_close: >-
        The dispatch queue's completed_note for c4a158 (the Coordinator's
        adjudication, NOT the frozen package under review) uses "confirmed as
        an instrument-class property" for the named obstruction, while the
        producer's instrument-class-scope.yaml labels it "status: named" (a
