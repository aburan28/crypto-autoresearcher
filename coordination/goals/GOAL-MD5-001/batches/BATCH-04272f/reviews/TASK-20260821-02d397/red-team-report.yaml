      - "instrument-class-scope.yaml — RANK 2 artifact"
      - "md4-control-run-report.yaml, variant-definition.yaml, input manifests — RANK 3 artifacts"
      - "harness/run_md4_calib.py — instrument source (shift implementation, _T48, _SCHEDULE48, _IV)"
