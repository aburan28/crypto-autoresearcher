        - file: md4-control-run-report.yaml build_record (lines 135-304) vs cost_per_bcp2 (lines 435-446, 595-606)
          finding: >-
            BUILD cost (instrument development, smoke gate, test vectors,
            independent checker) is in the build_record section. RUN cost
            (wrapper-measured wall_seconds) is in the cost_per_bcp2 sections.
            The two are clearly separated and labeled. The budget_account
