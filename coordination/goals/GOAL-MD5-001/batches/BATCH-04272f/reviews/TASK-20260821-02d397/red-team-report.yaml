        - file: runs/RUN-MDFIVE-md4-v0-s0/manifest.yaml line 63, runs/RUN-MDFIVE-md4-v16-s0/manifest.yaml line 63
          finding: >-
            Both run records: timing_source: wrapper. wall_seconds 38.85491 /
            38.604348, both <= 900. Neither halted at the ceiling (both stopped
