  defects:
    - id: DEF-RT1
      severity: informational (wording defect, already disclosed, implementation correct)
      location: >-
        DEC-20260821-ddaa33.yaml line 192 ("T'[i] = T[(i+16) mod 64] over RFC
        1320 section 3's 64 round constants"); acquisition-report.yaml lines
        72-84 ("64-entry operation-order constant sequence", "T[32..63] =
        6ED9EBA1"); dispatch_queue.json completed_note for cbb510 ("T'[i] =
        T[(i+16) mod 64]")
      description: >-
        The "mod 64" / "64 round constants" / "64-entry" language for MD4 is a
        carry-over from MD5 (which has 64 steps). MD4 has 48 steps (3 rounds x
        16 ops). The actual implementation correctly uses 48 entries (mod 48):
        instrument-class-scope.yaml line 368, variant-definition.yaml line 22,
        run report line 101, and harness/run_md4_calib.py line 255
        (T[(i+shift)%48]). The rank3_ruling corrected the wording to mod 48.
        Already flagged as OBS-2 in the run report and in the dispatch queue's
        completed_note for cbb510. Not batch-halting: the implementation is
        correct; the wording defect is in the DEC and acquisition report, not
        in the instrument or run records.
    - id: DEF-RT2
      severity: informational (honestly disclosed gap, not a fabrication)
      location: >-
        frontier-ledger.yaml entries 7 (Aumasson-Meier-Mendel 2008/183, line
        281) and 8 (Zaikin arXiv 2212.02405, line 313): filed_text: null
      description: >-
        Entries 7 and 8 are marked provenance: retrieved but have filed_text:
        null (abstract only, not filed as a text file). The provenance
        discipline header (frontier-ledger.yaml lines 4-11) says retrieved
        entries should carry filed_text. The verification_note and limitations
        are honest about this ("Abstract only; full text not read"). The agent
        fetched and read the abstract (primary text from the publisher) and
        recorded what it grounded the entry on. This is a named gap, not a
        fabrication — the content was read, just not filed as a text file.
        Not batch-halting: the exponents (2^96 for 47-step MD5, no 2^N for
        step-reduced MD4/MD5) are correctly attributed to the abstracts, and
        the entries are marked as reduced-round context (not the full-digest
        frontier).
    - id: DEF-RT3
      severity: informational (concern for the close, not a break in the frozen package)
      location: >-
        dispatch_queue.json completed_note for TASK-20260821-c4a158: "the named
        obstruction (random-collision floor of the bounded meet-table
        enumeration) is confirmed as an instrument-class property at the
        declared budget"
      description: >-
        The Coordinator's adjudication uses "confirmed as an instrument-class
        property" for the named obstruction, while the producer's
        instrument-class-scope.yaml labels it "status: named" (a candidate). The
        inventor protocol says an obstruction should be "labeled a candidate
        with its argument and its forward guidance, not a statement." The
        Coordinator's "confirmed" language is stronger than "candidate." This
        is NOT in the frozen package under review (it is the Coordinator's
        adjudication in the dispatch queue). The Coordinator also says "data
        only - the ceiling statement is the close's, not this task's," so it
        is not claiming the ceiling is closed. This is a concern for the
        Coordinator to address at the close: the obstruction is measured (the
        MSB-prefix doesn't grow on either MD4 or MD5), but the method-ceiling
        STATEMENT (which requires named obstruction + argument + forward
        guidance) remains open. The "confirmed" language should be qualified
        as "confirmed as a measured instrument-class property at the declared
        budget, not a closure of the method-ceiling question."

