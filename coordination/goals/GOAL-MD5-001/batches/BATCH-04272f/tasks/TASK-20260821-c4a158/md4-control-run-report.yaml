      severity: informational
      description: >-
        The task card's null-object definition says "T-prime[i] =
        T[(i+16) mod 64] over RFC 1320 section 3's 64 round constants" --
        the MD5 card's wording carried over (MD4 has 48 constants, not
        64). The rank3_ruling (the gate) rules the shift over the 48-entry
        sequence: T'[i] = T[(i+16) mod 48] (round 1 -> 0x5A827999, round 2
        -> 0x6ED9EBA1, round 3 -> 0). The ruling was executed. The RANK 1
        adjudication had already flagged the T-constant wording as a
        task-card instruction error.
    - id: OBS-3
      type: test_vector_transcription
      severity: build-time (caught by the gate, fixed before freeze)
      description: >-
        The seventh RFC 1320 A.5 vector's message is the 80-character
        string "1234567890" x 8 (the filed text's A.4 C driver and A.5
        listing agree once the line wrap is accounted for). The initial
        draft had mis-transcribed it as 130 characters from model memory;
        the smoke gate caught the mismatch and the transcription was
        corrected from the filed text before the freeze. The gate working
        as designed is itself the observation.
    - id: OBS-4
      type: md4_vs_md5_step_form
      severity: informational
      description: >-
        The MD4 step has NO b+ term: a = (a + f(b,c,d) + X[k] + const) <<<
        s, in all three rounds (filed RFC 1320 section 3.4 operation
        definitions and appendix A.3 FF/GG/HH macros). The MD5 step carries
        a = b + ((a + f(b,c,d) + X[k] + T[i]) <<< s) in all four rounds
        (filed RFC 1321 section 3.4 and appendix macros). The draft solver
        core initially carried the MD5 form copied from the MD5 instrument;
        it was corrected before the smoke pass (DEF-B1). The distinction is
        documented in the instrument's _compress docstring.
    - id: OBS-5
      type: report_filename_collision
      severity: cosmetic (post-freeze, recorded not patched)
      description: >-
        The instrument's default search-report filename does not carry the
        run suffix (same quirk as the MD5 instrument's OBS-1 in
        BATCH-1f30fe): both runs wrote search-report-md4.json, and the null
        run's write overwrote the target's. The per-run reports were
        regenerated byte-for-byte from the immutable run records
        (search-report-md4-v0-s0.json, search-report-md4-v16-s0.json, via
        the instrument's own write_report on the run records' raw results);
        the current search-report-md4.json is the null run's report. The
        run records (the authoritative artifacts) were never affected.
    - id: OBS-6
      type: system_library_oracle_unavailable
      severity: informational
      description: >-
        hashlib.md4 is NOT available in this build (Python 3.12.8:
        AttributeError at authoring time). The ruling's optional additional
        system-library verification oracle is recorded as unavailable; it
        was never in the solver core. The independent second implementation
        (MD4Checker) is present and used, so the ruling's fallback was not
        needed.
    - id: OBS-7
      type: parallel_session_head_move
      severity: informational
      description: >-
        HEAD moved during this session (4d68a7113 -> bf50c506b) due to a
        parallel session's snapshot commit (GOAL-ECDLP-001 BATCH-fb7af9,
        TASK-20260820-362012 -- unrelated to this task). The dirty
