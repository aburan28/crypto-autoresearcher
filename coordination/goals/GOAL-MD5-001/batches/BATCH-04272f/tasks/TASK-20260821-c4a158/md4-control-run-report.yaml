    location: >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/dispatch_queue.json,
      top-level key `rank3_ruling` (recorded_by: coordinator, recorded_at:
      2026-08-21, rules_for: TASK-20260821-c4a158). PRESENT in the committed
      queue at dispatch; the REFUSE gate was satisfied and the task was
