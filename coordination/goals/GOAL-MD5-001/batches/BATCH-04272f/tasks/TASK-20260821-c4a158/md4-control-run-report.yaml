# MD4 control run report -- RANK 3, the MD4 control (target + null object).
#
# GOAL-MD5-001 / BATCH-04272f / RQ-MDFIVE-6870c1 / TASK-20260821-c4a158.
# Protocol: BCP-2 (frozen at snapshot commit 8677f11af). Opening decision:
# DEC-20260821-ddaa33. Scope ruling: the rank3_ruling key of the committed
# dispatch queue (recorded BEFORE dispatch, per the opening decision).
#
# This is the MD4 lower control: what the calibrated instrument class does
# against MD4 at the declared encoding, seed, and ceiling. It asserts NOTHING
# about MD4 security (SC-2); a FAIL is a statement about the solver at the
# declared encoding, seed, and ceiling -- never about the existence of
# collision paths (SC-4).

