    basis: >-
      section_4_md4_run_spec of
      tasks/TASK-20260821-229643/instrument-class-scope.yaml, as amended
      below; the ruling is recorded BEFORE dispatch per the opening decision.
    amendments_executed:
      - id: A1
        text: >-
          VERIFICATION ORACLE (new design point): the MD4 solver core is
          written from the filed RFC 1320 text (NOT hashlib, NOT the MD5
          module path). Certificate verification uses (i) the RFC 1320
          official test vectors (a gate that must pass before any search,
          recorded in the manifest) and (ii) a second, independent MD4
          implementation as the certificate checker, written as a distinct
          code path from the solver core (mirror of the IMPL pin pattern);
          if a genuinely independent second implementation is infeasible
          within budget, the fallback is test vectors + structural
          self-check, which MUST be recorded in the manifest and flagged
          for the reviewers. hashlib.md4 (if available) may serve ONLY as
          an additional verification oracle, recorded as provenance:
          system-library, verification-only, never in the solver core.
        execution: >-
          Executed as ruled. (i) The 7-vector RFC 1320 A.5 gate runs inside
          search() before any block is evaluated and its result is recorded
          in every raw result and run manifest (gate: PASS on both runs).
          (ii) The second independent implementation (the MD4Checker class
          in harness/run_md4_calib.py) is a genuinely distinct code path
          (class-based streaming structure mirroring the RFC 1320 appendix A
          C reference, versus the solver core's functional one-pass
          schedule-table structure; explicit per-round loops with FF/GG/HH
          helpers versus the flat 48-entry schedule loop; list-index
          register rotation versus tuple reassignment) and is used for the
          gate cross-check and as the success/partial-hit checker. The
          fallback was NOT needed and was NOT used. hashlib.md4 is NOT
          available in this build (Python 3.12.8: AttributeError at
          authoring time), so the optional system-library oracle is recorded
          as unavailable (OBS-6); it was never in the solver core.
      - id: A2
        text: >-
          EXPECTED ROW: R6 (target FAIL, variant FAIL) is the expected row.
          R5 only on the inverted outcome (null-object SUCCESS, target
          FAIL). Any full-128 SUCCESS is above R5, is the informative
          result, is NOT an error, but is a scope change flagged to the
          Coordinator at the close.
        execution: >-
          The pair landed on R6 (target FAIL, variant FAIL) -- the expected
          row. No full-128 SUCCESS occurred, so no scope-change flag is
          raised.
      - id: A3
        text: >-
          DISCRIMINATION CRITERION: the MSB-prefix quantity is read
          qualitatively - non-zero growth of the prefix-length distribution
          on the MD4 target vs no growth on the null object. TOL = 2
          applies to the cost ratio R = t_null / t_target (interval
          [0.5, 2.0] COMPARABLE), not to the 0-baseline bit count.
        execution: >-
          Executed as ruled. The MSB-prefix comparison is reported
          qualitatively (section msprefix_comparison below); TOL = 2 was
          applied to R = t_null / t_target only.
    run_scope_executed: >-
      Two runs, SEQUENTIAL (target first, then null object), deterministic
      seed 0, N = 2^21 blocks, k = 40, 900 s wrapper deadline each (checked
      per block - hard stop), run_wrapped (the only acceptance path), 4 GB
      batch memory, hex 512-bit block encoding, identical-prefix 2-block
