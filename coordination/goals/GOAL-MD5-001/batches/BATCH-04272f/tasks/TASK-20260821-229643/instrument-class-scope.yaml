section_3_obstruction:
  status: named
  statement: >-
    The partial-hit MSB-prefix length (the number of matching high bits in the
    128-bit digest beyond the 40-bit meet-table key) is bounded by the
    random-collision floor (0 bits) at the current scale (2^21 blocks, 40-bit meet
    table, seed 0). This bounds the bounded differential/collision-path enumeration
    because if the MSB-prefix length does not grow with the constrained-bit count,
    the enumeration cannot close the gap to a full 128-bit collision — it is hitting
    the random-collision floor, not the MD5/MD4 differential structure. The MD4
    control run will measure this quantity on MD4 (where the differential structure
    is known to help, per the frontier-ledger MD4/collision entry 'hand
    calculation').
  quantity: >-
    partial-hit MSB-prefix length (bits), measured as the distribution of matching
    high-bit prefix lengths over all 40-bit-key partial hits per 2^21 blocks.
  predicted_behavior: >-
    If the obstruction is real, the MSB-prefix length on the MD4 target should grow
    (exceed the random 0-bit baseline by a factor >= 2, TOL) because the MD4
    differential structure helps, while on the null object (random function) the
    MSB-prefix length stays at 0 bits (random). The artifact tell is the current
    MD5 run, where the MSB-prefix length was 0 bits (did not decay/grow) — the
    quantity meant to be destroyed by the MD5 structure did not change.
  argument: >-
    The bounded enumeration with a 40-bit meet table produces partial hits that
    match on the low 40 bits. If the method is measuring MD5/MD4 differential
    structure, the high bits should also match (the MSB-prefix length should grow),
    indicating a real collision path. If the method is measuring random-collision
    structure, the high bits should not match (the MSB-prefix length stays at 0),
    indicating a random partial hit. The current MD5 run produced one random
    40-bit-key partial hit with a 0-bit MSB prefix, which is the random-collision
    signature. This bounds the method because if the MSB-prefix length doesn't
    grow, the enumeration can't close the gap to a full 128-bit collision.
  forward_guidance: >-
    If the run confirms the obstruction (MSB-prefix length grows on MD4 but not on
    the null object), the method is bounded by the random-collision floor, and the
    instrument class that would evade it is CAND-1 (differential-guided collision
    enumeration), which uses the published differential characteristic to constrain
    the message-pair space and should produce a non-random MSB-prefix signature.
    Alternatively, CAND-2 (state-level MITM) could evade it by navigating the state
    space directly, but it does not beat the birthday bound for collisions.
  scope_claimed: >-
    Claimed over MD4 and MD5 Merkle-Damgard compression at the current scale (2^21
    blocks, 40-bit meet table, seed 0); not claimed over other block budgets,
    meet-table widths, or hash functions.

section_4_md4_run_spec:
  instrument:
    module: harness/run_md4_calib.py
    mirror_notes: >-
      Single module, runnable as script, importable; mirrors the frozen
      harness/run_md5_calib.py structure. Runs driven through
      harness.runner.run_wrapped (charged wall_seconds is wrapper-measured per
      BCP-2 charging_convention: compute-only solver-process wall clock, excluding
      authoring/review/coordination overhead). The solver core uses NO
      standard-library hash binding; the pinned independent pair in
      harness/runner.py is used ONLY for certificate verification by the wrapper,
      never for the search.
    search_strategy: >-
      Identical-prefix 2-block messages M1 = B1||B2, M2 = B1||B2' (B1 fixed 512-bit
      seed-derived block; B2, B2' distinct seeded random 512-bit blocks; messages
      hex-encoded, 128 hex chars). Bounded BIRTHDAY search (NOT meet-in-the-middle,
      NOT differential) over the 128-bit digest space: enumerate up to N = 2^21
      distinct seeded random second blocks, compute each FULL 2-block digest,
      insert (digest, block) into a hash table keyed by the digest's low k = 40
      bits; a table hit (two distinct blocks, same 40-bit key) is a 40-bit
      PARTIAL; track longest matching prefix of the full 128-bit digests and the
      cost (blocks evaluated) at which achieved; full 128-bit match = SUCCESS.
      Memory: table holds at most N = 2^21 entries. Stopping rule: (a) --deadline
      monotonic clock reached (checked each block), or (b) table full, or (c) full
      match — (a)/(b) are budgeted FAILs with the declared reason.
  md4_core:
    source: >-
      Standalone MD4 written FROM the filed RFC 1320 text at
      coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/inputs/rfc1320-md4.txt
      (sha256 f727b15e19ab8ac5036ab7921476e8d8644512190ade32a2e0a2fb9d8a2421c7) —
      NOT hashlib, NOT the MD5 module's code path.
    structure: >-
      3 rounds x 16 ops = 48 steps (vs MD5's 64). Round functions
      F(X,Y,Z)=(X&Y)|(~X&Z), G(X,Y,Z)=(X&Y)|(X&Z)|(Y&Z), H(X,Y,Z)=X^Y^Z. Round 1
      has NO additive constant; round 2 constant 0x5A827999 (floor(2^30*sqrt(2)));
      round 3 constant 0x6ED9EBA1 (floor(2^30*sqrt(3))). The 48-entry MD4 constant
      sequence is 16x0, 16x0x5A827999, 16x0x6ED9EBA1. The MD5 instrument's
      64-entry sine table does NOT apply to MD4 (task-card instruction defect,
      ruled).
    test_vector_gate: >-
      The instrument's MD4 self-test must include the RFC 1320 test vectors (filed
      text, section on the test suite) passing BEFORE the search runs (a gate,
      recorded in the manifest).
  runs:
    target:
      seed: 0
      N: 2^21
      k: 40
      deadline_seconds: 900
      encoding: "hex 512-bit blocks, full 128-bit digest equality (128 hex chars per message)"
      constants: "standard MD4 constants (shift 0): 16x0, 16x0x5A827999, 16x0x6ED9EBA1"
    null_object:
      seed: 0
      N: 2^21
      k: 40
      deadline_seconds: 900
      encoding: "hex 512-bit blocks, full 128-bit digest equality (128 hex chars per message)"
      constants: >-
        BCP-2 null structure: round-constant sequence cyclically shifted by 16,
        T'[i] = T[(i+16) mod 48] over the 48-entry sequence (clean round-boundary
        shift: round 1 gets 0x5A827999, round 2 gets 0x6ED9EBA1, round 3 gets 0).
        Everything else identical (same 48-step structure, same rotations, same
        F/G/H, same search, same seed, same N = 2^21, same k = 40, same encoding).
    execution: >-
      Two runs, SEQUENTIAL, deterministic seed 0, 900 s deadline each, run_wrapped,
      batch memory 4 GB.
  metrics:
    charged:
      - "wrapper wall_seconds"
    observed:
      - "blocks evaluated"
      - "table_full vs deadline stop reason"
      - "partial hits (count, the 40-bit key, the longest full-digest-prefix match length in bits — the MSB-prefix quantity from section 3)"
      - "certificate kind (none / 40-bit-partial / full-128)"
  expected_row: >-
    The pair is EXPECTED on R5/R6 (FAIL/FAIL at the declared space) with the
    null/target cost ratio R = t_null / t_target COMPARABLE. A full-128 SUCCESS on
    either run would be a row above R5 and must be treated per the protocol's
    weaker-acceptance-path disclosure (a success at this declared space is the
    informative result, not an error — but it would change the audit's scope and is
    flagged for the Coordinator).
  comparison_protocol:
    R_ratio: "R = t_null / t_target"
    TOL: 2
    comparable_interval: "[0.5, 2.0]"
    anchor: >-
      MD5 calibration anchor for cost transfer: 54.179836 s (target) / 55.156728 s
      (null), R = 1.018031, row R6.
  consumption_check: >-
    The MD4 runs consume NO MD5 payload; the completeness check is that the MD4
    manifests' input hashes intersect the MD5 quarantined payload sha256 set in
    EMPTY (hash-only; the payload is never read).
  cost_model_exposure: >-
    RANK 1 ran ~5.4x its declared 900 s ceiling (accepted as a disclosed budget
    outcome). The two MD4 runs share ONE 1800 s declared envelope (900 s each); a
    repeat overrun is expected-possible. The wrapper deadline is the HARD stop
    inside each run (the deadline is checked every block, so a run cannot overrun
    its own 900 s — the exposure is in authoring/verification overhead around the
    runs, which the charging convention excludes from the charged cost).

