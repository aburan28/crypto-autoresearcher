section_1_candidates:
  - rank: 1
    id: CAND-1
    mechanism: >-
      Differential-guided collision enumeration. Concretely: fix the published
      Wang et al. 2004/199 MD5 differential characteristic (message difference
      non-zero at word positions 4, 11, 14; works for any given initial value —
      frontier-ledger MD5/collision entry), sample message pairs (M, M')
      constrained to follow that characteristic, and enumerate the free
      second-block message words to close the full 128-bit digest equality
      MD5(M) = MD5(M'). This is the same method family as the frontier-ledger
      collision entries (MD4/collision and MD5/collision, both differential,
      Wang et al. 2004/199) and is the class the published literature uses to
      achieve full MD5 collisions. Unlike the current bounded meet-table
      enumeration (which shows a random-collision signature — one 40-bit partial
      hit with a 0-bit MSB prefix — and fails to discriminate target from null at
      R = 1.018031), the differential constraint is a structural property of MD5
      that should produce a non-random partial-hit signature. The executor
      implements it by fixing the message-word differences and running a bounded
      nested enumeration over the free words, reusing the frozen MD5/MD4
      Merkle-Damgard harness.
    asymptotic_time: >-
      No asymptotic 2^N stated in the primary text (frontier-ledger MD5/collision
      entry, Wang et al. 2004/199: measured ~1 hour on IBM P690 for the first
      pair, then 15 s–5 min for subsequent pairs). From general knowledge
      (provenance: recalled, pointer only): O(2^p * c) MD5 compression
      evaluations, where p is the bit-cost of the differential characteristic
      (trials needed for it to hold) and c is the per-pair second-block
      completion cost; the published MD5 characteristic is recalled to have p in
      the 39–64 range (i.e., 2^39–2^64).
    asymptotic_memory: >-
      O(1) working memory beyond the current message pair and digest (the
      differential characteristic is fixed and the completion enumeration is a
      small nested loop over a few free words; no large meet table is required).
      (provenance: recalled — the primary text states no memory figure.)
    feasibility_at_declared_hardware: >-
      Not executable at campaign scale (recalled 2^39–2^64 >> the 2^21-block
      budget that runs in ~54 s); measurable at bounded scale only by measuring
      the per-attempt success probability and MSB-prefix distribution at 2^21
      blocks, with the transfer caveat stated.
    quantitative_prediction: >-
      If the differential-guided enumeration is the right instrument, the MD4
      control run at 2^21 blocks should find >= 1 full 128-bit MD4 collision (the
      Wang et al. MD4 collision is findable "with hand calculation", i.e., at a
      block count << 2^21 — frontier-ledger MD4/collision entry), whereas the
      current meet-table instrument found 0 full collisions and only 1 random
      40-bit partial hit with a 0-bit MSB prefix.
    minimal_discriminating_test: >-
      Run the differential-guided enumeration on MD4 at 2^21 blocks using the
      Wang et al. 2004/199 MD4 message difference (C, C' = (0, 2^31,
      2^28-2^31, 0, 0, 0, 0, 0, 0, 0, 0, 0, 2^16, 0, 0, 0) — frontier-ledger
      MD4/collision entry), and measure whether the full-collision count or
      partial-hit MSB-prefix length exceeds the null-object baseline by a factor
      >= 2 (TOL = 2).
    falsification_condition: >-
      The candidate is killed if the differential-guided enumeration on MD4 at
      2^21 blocks yields a partial-hit rate and MSB-prefix distribution
      statistically indistinguishable from the null object (R within TOL = 2 of
      the random baseline), i.e., the differential constraint produces no
      non-random signature.
  - rank: 2
    id: CAND-2
    mechanism: >-
      State-level meet-in-the-middle (MITM) on the Merkle-Damgard compression
      path. Concretely: split the message (or the compression-function step
      sequence) into two halves, enumerate forward from the initial state IV over
      the first half and backward from a target state over the second half, and
      meet on a mid-state (a partial 128-bit state) to reconstruct a full
      collision path or preimage. This is the Aoki-Sasaki / Guo et al. MITM
      framework — the method family of the frontier-ledger preimage entries
      (MD4/preimage multi-block 2^78.4, MD4/preimage one-block 2^94.98,
      MD5/preimage full 2^123.4). Unlike CAND-1's differential-guided
      message-pair enumeration, the MITM instrument navigates the state space
      directly and does not require a published differential characteristic. The
      executor implements it by fixing the split point, building the forward and
      backward meet tables on a partial state, and joining them, reusing the
      frozen MD5/MD4 Merkle-Damgard harness.
    asymptotic_time: >-
      From the frontier ledger (retrieved): MD4/preimage multi-block 2^78.4 MD4
      computations with 2^128 precomputation (2^99.7 without); MD4/preimage
      one-block 2^94.98 (Zhong-Lai 2010/583); MD5/preimage full 2^123.4
      (Sasaki-Aoki 2009, provenance: recalled). In big-O: O(2^w) time for a meet
      on a w-bit mid-state, where the MD4/MD5 step structure reduces w below the
      generic 128/2 = 64; the meet-table join is O(2^w).
    asymptotic_memory: >-
      O(2^w) where w is the mid-state meet width (the meet table stores 2^w
      partial states); the frontier ledger cites 2^81 storage for the MD4
      multi-block 2^78.4 result (with 2^128 precomputation) and 2^72 memory for
      the MD4 second-preimage 2^69.4 result (retrieved, Guo et al. 2010/016).
      (provenance: retrieved for the MD4 figures; the MD5 full-preimage memory is
      not stated in the recalled entry.)
    feasibility_at_declared_hardware: >-
      Not executable at campaign scale (2^64–2^123.4 >> the 2^21-block budget
      that runs in ~54 s); the meet-table memory O(2^w) exceeds the 4 GB declared
      budget for any mid-state width w that would close the 128-bit gap (4 GB
      holds only ~2^27 16-byte states); measurable at bounded scale only by
      measuring the per-meet success probability at a reduced w, with the
      transfer caveat stated.
    quantitative_prediction: >-
      If the MITM instrument is the right class, the MD4 control run at 2^21
      blocks with a mid-state width w = 20 should produce a mid-state meet-count
      exceeding the null-object random-state baseline by a factor >= 2 (TOL) due
      to the MD4 step structure (frontier-ledger MD4/preimage entries 3, 4).
    minimal_discriminating_test: >-
      Run the state-level MITM on MD4 at 2^21 blocks with a mid-state width
      w = 20 (feasible in the 4 GB budget), building the forward meet table and
      joining against the backward enumeration, and measure whether the
      mid-state meet-count exceeds the null-object (random-state) baseline by a
      factor >= 2 (TOL = 2).
    falsification_condition: >-
      The candidate is killed if the state-level MITM on MD4 at 2^21 blocks with
      w = 20 yields a mid-state meet-count statistically indistinguishable from
      the null-object random-state baseline (R within TOL = 2), i.e., the MD4
      step structure produces no meet-count advantage over a random function.
  - rank: 3
    id: CAND-3
    mechanism: >-
      Step-reduced / reduced-round preimage demonstration. Concretely: invert a
      step-reduced version of the MD4/MD5 compression function (e.g., 47 of 64
      steps for MD5 per Aumasson-Meier-Mendel 2008/183, or 40–43 steps for MD4
      per Zaikin 2022 cube-and-conquer) to measure the per-attempt structure and
      success probability of the preimage/collision-path at bounded scale. This
      is the method family of the frontier-ledger step-reduced entries
      (MD5/preimage step-reduced 47-of-64 2^96; MD4/MD5/preimage step-reduced,
      cube-and-conquer, no 2^N stated). Unlike CAND-1 (full differential
      enumeration) and CAND-2 (full MITM), the step-reduced instrument does not
      claim to close the full 128-bit gap; it measures the structure that the
      full attack would exploit, at a scale the campaign can actually run. The
      executor implements it by truncating the compression function to the stated
      step count and running the cited inversion (SAT/cube-and-conquer or the
      Aumasson-Meier-Mendel step-inversion) on the truncated function, reusing
      the frozen MD5/MD4 harness.
    asymptotic_time: >-
      From the frontier ledger (retrieved): MD5/preimage step-reduced (47 of 64
      steps) 2^96 trials (Aumasson-Meier-Mendel 2008/183); MD4/MD5/preimage
      step-reduced (40–43 step MD4, 28-step MD5) no 2^N stated in the abstract
      (Zaikin 2022, cube-and-conquer). In big-O: O(2^s) where s is the number of
      steps inverted (s < 64 for MD5, s < 48 for MD4); the step-reduced cost is
      a lower bound on the full cost, with the transfer from step-reduced to full
      being the open question.
    asymptotic_memory: >-
      O(2^s) working memory for the step-inversion search tree / SAT assignment
      space, where s is the number of steps inverted; the frontier ledger states
      no explicit memory figure for the step-reduced entries (provenance:
      retrieved for the exponents, memory not stated). For the cube-and-conquer
      (SAT) variant, memory is the SAT solver's clause/assignment space, O(2^s)
      in the worst case (provenance: recalled — the abstract states no memory
      figure).
    feasibility_at_declared_hardware: >-
      Partially executable at campaign scale: the cube-and-conquer (SAT) variant
      actually inverted 40–43-step MD4 and 28-step MD5 (frontier-ledger
      MD4/MD5/preimage step-reduced entry, retrieved), so it is runnable at
      bounded scale for those reduced targets; the 47-step MD5 (2^96,
      MD5/preimage step-reduced entry) is NOT runnable (>> the 2^21-block
      budget). Measurable at bounded scale by measuring the per-step inversion
      success probability, with the transfer caveat (step-reduced -> full)
      stated explicitly.
    quantitative_prediction: >-
      If the step-reduced instrument is the right class, the MD4 control run
      should invert 40 steps of MD4 (the frontier-ledger MD4/MD5/preimage
      step-reduced entry's demonstrated capability) at a bounded block count,
      with the per-step inversion success probability dropping by a factor >= 2
      (TOL) from 40 to 43 steps — i.e., the success probability at 43 steps
      should be <= half that at 40 steps, confirming the step count is the
      controlling parameter (unlike the current meet-table instrument, where the
      0-bit MSB prefix did not decay).
    minimal_discriminating_test: >-
      Run the cube-and-conquer (SAT) inversion on MD4 at 40 steps and 43 steps
      (the frontier-ledger MD4/MD5/preimage step-reduced entry's demonstrated
      range), and measure whether the inversion success probability drops by a
      factor >= 2 (TOL = 2) from 40 to 43 steps, confirming the step count is
      the controlling parameter.
    falsification_condition: >-
      The candidate is killed if the step-reduced inversion on MD4 shows no
      decay in success probability from 40 to 43 steps (R within TOL = 2 of
      flat), i.e., the step count is not the controlling parameter and the
      step-reduced structure does not measure a real bottleneck.

