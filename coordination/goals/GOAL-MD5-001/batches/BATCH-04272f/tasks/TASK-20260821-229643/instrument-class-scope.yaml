    frontier_ledger_and_md4_control_scoping_only — this record makes no MD5
    evidence claim, no MD4 security claim, and no method-ceiling STATEMENT; the
    statement needs the run's data and must meet the closure standard (named
    obstruction + argument + forward guidance).
  will_show:
    - "The partial-hit MSB-prefix length distribution (the section 3 obstruction quantity) on the MD4 target vs the null object, per 2^21 blocks."
    - "The section 4 metrics per run: wrapper wall_seconds, blocks evaluated, table_full vs deadline stop reason, partial hits (count, 40-bit key, longest full-digest-prefix match length in bits), certificate kind (none / 40-bit-partial / full-128)."
    - "The null/target cost ratio R = t_null / t_target, compared against the MD5 calibration anchor R = 1.018031 (row R6) at TOL = 2."
    - "Whether the MD4 differential structure produces a non-random MSB-prefix signature (the section 3 obstruction test)."
