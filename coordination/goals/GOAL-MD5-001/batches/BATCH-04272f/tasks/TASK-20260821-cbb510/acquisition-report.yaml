      "Finding Preimages in Full MD5 Faster Than Exhaustive Search" (EUROCRYPT 2009,
      LNCS 5479, pp. 134-152), from a non-bot-blocked source (an institutional
      repository, the authors' pages, or a library mirror), and reading the authors'
      own "practical" vs "cryptographic" wording. If the authors do NOT call it
      "practical", the web-search excerpt's "first PRACTICAL preimage attack" is
      confirmed as an error (the correct attribution being the first preimage attack
      on full MD5 faster than exhaustive search, at 2^123.4). If they DO use
      "practical" in a qualified sense, the flag is resolved in the other direction.
      Either way, the settlement requires the primary text, which was not obtained.

