  # ------------------------------------------------------------------
  # RFC 1320 (the MD4 specification)
  # ------------------------------------------------------------------
  rfc1320:
    url: "https://www.rfc-editor.org/rfc/rfc1320.txt"
    source_order: 1  # primary publisher (RFC Editor / IETF) first, per the bde128 precedent
    outcome: SUCCESS
    filed_path: "coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/inputs/rfc1320-md4.txt"
    bytes: 32407
    sha256: f727b15e19ab8ac5036ab7921476e8d8644512190ade32a2e0a2fb9d8a2421c7
    retrieved_date: "2026-08-21"
    header_verified: >-
      The filed text is RFC 1320, "The MD4 Message-Digest Algorithm", R. Rivest,
      MIT Laboratory for Computer Science and RSA Data Security, Inc., April 1992,
      Obsoletes RFC 1186. Header and table of contents read and confirmed.

    t_constant_verification:
      task_card_instruction: >-
        "VERIFY the text carries the 64 round constants T[0..63] of section 3
        (record where they are, and that they match the sine definition in the text:
        T[i] = floor(2^32 * abs(sin((i+1)))). If the constants cannot be verified in
        the filed text, that is a defect to record — do not fill them from memory."
      result: DEFECT RECORDED — the 64-constant sine table is NOT in the filed text
      finding: >-
        The filed RFC 1320 text does NOT carry a table of 64 round constants
        T[0..63], and it does NOT contain the sine definition
        T[i] = floor(2^32 * abs(sin(i+1))). That sine definition is the MD5
        formulation (RFC 1321), not MD4's. The task card's verification instruction
        appears to conflate the MD4 specification (RFC 1320) with the MD5
        specification (RFC 1321). Per the task card, this is recorded as a defect;
        nothing was filled in from memory.
      what_the_text_actually_carries: >-
        RFC 1320 Section 3.4 (Step 4), lines 211-262 of the filed text, and the C
        reference implementation in the appendix (macros FF/GG/HH, lines 511-522),
        define MD4's three rounds with only TWO distinct additive constants:
        (1) Round 1 (16 operations, macro FF): NO additive constant.
        (2) Round 2 (16 operations, macro GG): additive constant 5A827999 (hex),
           which the text describes as "the square root of 2" and gives in octal as
           013240474631 (verified: 013240474631(oct) = 1518500249 = 0x5A827999; this
           equals floor(2^30 * sqrt(2))).
        (3) Round 3 (16 operations, macro HH): additive constant 6ED9EBA1 (hex),
           which the text describes as "the square root of 3" and gives in octal as
           015666365641 (verified: 015666365641(oct) = 1859775393 = 0x6ED9EBA1; this
           equals floor(2^30 * sqrt(3))).
      sine_definition_check: >-
        The 64-entry operation-order constant sequence derived from the text is
        T[0..15] = 0, T[16..31] = 5A827999, T[32..63] = 6ED9EBA1. This sequence does
        NOT match the sine definition T[i] = floor(2^32 * abs(sin(i+1))): sine T[0]
        = 0xD76AA478 (not 0), sine T[16] = 0xF61E2562 (not 0x5A827999), sine T[32]
        = 0xFFFA3942 (not 0x6ED9EBA1). (Computed in this session with Python's math
        module.) The sine definition is the MD5 (RFC 1321) constant table, which
        RFC 1320 does not contain.
      consequence_for_rank3: >-
        RANK 3's MD4 null object (T'[i] = T[(i+16) mod 64], per DEC-20260821-ddaa33)
        is still WELL-DEFINED over the 64-entry operation-order constant sequence
        (16x0, 16x5A827999, 16x6ED9EBA1): the cyclic shift by 16 yields
        T'[0..15] = 5A827999, T'[16..31] = 6ED9EBA1, T'[32..63] = 0 (round 1 uses
        5A827999, round 2 uses 6ED9EBA1, round 3 uses 0; all other structure
        identical). The "sine definition" check as stated in the task card cannot
        pass because the sine definition is not in the text and does not apply to
        MD4. This is reported to the Coordinator; it is a defect in the task card's
        verification instruction, not a defect in the acquired text.

