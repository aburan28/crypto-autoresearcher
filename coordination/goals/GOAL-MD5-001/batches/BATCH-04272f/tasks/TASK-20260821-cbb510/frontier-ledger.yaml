        blocks) / 2^99.7 (without precomputation, 2^64 memory).
      method_family: meet-in-the-middle (MITM)
      citation:
        authors: [Jian Guo, San Ling, Christian Rechberger, Huaxiong Wang]
        title: "Advanced Meet-in-the-Middle Preimage Attacks: First Results on Full Tiger, and Improved Results on MD4 and SHA-2"
        venue: "IACR ePrint 2010/016; ASIACRYPT 2010, LNCS 6477, pp. 56-75"
        year: 2010
        url: "https://eprint.iacr.org/2010/016"
      provenance: retrieved
      retrieved_date: "2026-08-21"
      filed_text: "tasks/TASK-20260821-cbb510/eprint-2010-016.txt (PDF: eprint-2010-016.pdf)"
      verification_note: >-
        Read the abstract and Sections 3.3/3.4 of the primary text (fetched and read
        in this session). Abstract: "Using pre-computation techniques, the time
        complexity for finding a new preimage or second-preimage for MD4 can now be
        as low as 2^78.4 and 2^69.4 MD4 computations, respectively. The
        second-preimage attack works for all messages longer than 2 blocks." Section
        3.3: pseudo-preimage in 2^69.4+9 = 2^78.4 with memory 2^55, "further
        converted into a preimage in 2^99.7 using the traditional conversion"; with
        2^128 precomputation (storage of order 2^81) "the pseudo-preimage can also be
        converted to preimage in 2^78.4" (online computation 2^78.4 only). "The
        resulting message of this attack has at least 250 blocks." Section 3.4:
        second-preimage "in 2^69.4 with 2^72 memory when k >= 2" (with 2^128
        precomputation), "in time 2^99.7 and 2^64 memory without precomputation".
      limitations: >-
        The 2^78.4 preimage figure REQUIRES 2^128 precomputation and 2^81 storage;
        the no-precomputation preimage is 2^99.7. The attack produces MULTI-BLOCK
        messages (at least 250 blocks), not one-block messages. The abstract states
