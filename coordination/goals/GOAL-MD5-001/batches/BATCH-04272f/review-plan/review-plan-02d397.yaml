review_plan_record:
  task_id: TASK-20260821-02d397
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-04272f
  target: >-
    The frozen batch-4 package at the 86c2ba snapshot commit: the frontier
    ledger (frontier-ledger.yaml, primary-text acquisition of the published
    MD4/MD5 collision and preimage results) and its acquisition report, the
    instrument-class audit scope (instrument-class-scope.yaml, the
    falsifiable idea record), the MD4 instrument (harness/run_md4_calib.py),
    the MD4 TARGET run + run record (c4a158, standard MD4, 900 s, seed 0),
    the MD4 NULL-OBJECT run + run record (constants cyclically shifted by
    16, identical in all other respects), and the snapshot receipt. The
    claim under review: the package honestly (a) records the published
    frontier in primary text with retrieved provenance, (b) scopes the
    instrument class as a falsifiable record with Pareto-honesty checks,
    and (c) executes the MD4 control per the ruled scope, and the verdicts
    it lands on (the cost-transfer comparison, the partial-hit signature,
    the decision-table row, the scope statements) are the ones the bytes
    support.
  written_before_reviewer_ran: 2026-08-21 (committed in the batch opening commit, before TASK-20260821-02d397 may run)

  coordinator_prior:
    recorded_before_any_report_returns: True
    expectations:
      - >-
        L1 (frontier-ledger provenance) is expected to HOLD with named
        gaps: every entry the ledger marks retrieved should carry a URL, a
        retrieval date, and a verification note, and the fetched text
        should exist under the batch inputs. The attack I expect to land is
        a provenance mislabel: an entry whose "retrieved" content is
        actually model memory (the tell: a citation whose text the agent
        could not re-fetch, or whose stated content does not match the
        filed text), or a result whose primary text is paywalled and is
        therefore honestly recalled-but-marked. I expect the finding
        "the ledger is honest about which entries are pointers and which
        are read" rather than a fabrication.
      - >-
        L2 (scope Pareto honesty) is expected to come out as: the
        instrument-class candidates are falsifiable (mechanism, cost,
        prediction, test boundary, falsification all present), and the
        dominated_by nulls (if any) rest on a recorded frontier check
        across time, memory, and data/queries. The expected finding:
        verify that a candidate marked not-dominated was actually compared
        against the frontier rows the ledger now carries, and that
        sota_delta is quantitative, not prose.
      - >-
        L3 (MD4 run identity + cost transfer) is expected to HOLD on the
        mechanics (standalone MD4 from the RFC 1320 text, identical search
        structure to the frozen MD5 instrument, seed 0, 900 s ceiling,
        run_wrapped charging) with the live question on the VARIANT: the
        T-prime table must be EXACTLY the declared cyclic shift by 16 over
        RFC 1320 section 3's 64 constants and nothing else - a silently
        adapted schedule would void the control. And the cost-transfer
        comparison must be recomputed from the run records (MD4 pair R
        ratio; MD5 anchor from EV-MDFIVE-f3e1ca), not copied from the
        report. I expect the MD4 pair to land on R5 or R6 (FAIL/FAIL at
        the declared space is the prior: the bounded enumeration cannot
        close 128 bits on either digest at 2^21 blocks) with the cost
        transferring within TOL = 2 (MD4's 48-round schedule is cheaper
        per block than MD5's 64, so R < 1 is the informative direction;
        R > 2 would be a measurement artifact worth finding).
      - >-
        L4 (decision-table + cost honesty) I expect to PASS with a named
        gap: the row the reports name must be the row the outcomes + R
        ratio produce (the row's does_not_show carried, not trimmed); both
        run records timing_source: wrapper; the two cost categories
        (instrument BUILD cost vs RUN cost) labeled so neither can be read
        as the other; and the WEAKER-acceptance-path disclosure (no
        md4_collision_pair certificate kind in this batch) present if any
        success occurred (none expected).
      - >-
        L5 (scope honesty / no premature closure) is the joint most likely
        to BREAK, and the break I expect is the honest one: the closing
        statement will want to read as a method-ceiling claim, but the
        inventor protocol's closure standard (named obstruction + argument
        + forward guidance) is probably NOT met by this batch's evidence
        alone - the expected finding is "the package correctly keeps the
        ceiling statement OPEN AND UNATTEMPTED (or names the obstruction
        candidate as a candidate, not a statement), and the partial-hit
        signature comparison (MD4 vs the MD5 calibration pair) is the
        first real discrimination data the campaign has." If the scope
        record already claims the ceiling, that is the break and it is
        batch-halting.
    if_the_review_overturns_the_prior: >-
      A prior overturned by the review is a result, recorded as such. The
      informative overturns here: (i) a frontier-ledger entry that fails
      provenance re-verification (the ledger's authority is the whole
      point of RANK 1); (ii) a cost-transfer R beyond tolerance (the
      measurement, not the instrument, is suspect); (iii) a success on
      either MD4 run (unexpected at this budget; verified through the
      weaker acceptance path with the limitation recorded, and the
      instrument-class question answered in one stroke - the enumeration
      closes MD4, which re-scopes the whole audit).

  joints:
    - joint: >-
        L1 Frontier-ledger provenance: is every "retrieved" entry actually fetched and filed (URL, date, verification note, text present), and are recalled entries honestly marked?
      assigned_to: TASK-20260821-02d397
      attack_plan: >-
        Take frontier-ledger.yaml. For each entry marked retrieved: is the
        URL present, is the retrieval date present, is the verification
        note present, and does the fetched primary text exist under the
        batch inputs (or is its sha256 recorded where it is filed)? Try to
        re-derive one entry's stated exponent/cost from the filed text
        (the verification the entry claims to have passed). Then attack the
        boundary: are there entries marked retrieved whose content is
        model memory (the tell: no filed text, or stated content the filed
        text does not carry), and are the unobtainable results marked
        recalled with the source-preference order exhausted and recorded?
        Where the Coordinator expects it: an honest gap (paywalled primary
        text -> recalled, marked), not a mislabel.
    - joint: >-
        L2 Scope Pareto honesty: are the instrument-class candidates falsifiable, and do the dominated_by/sota_delta fields rest on the recorded frontier check?
      assigned_to: TASK-20260821-02d397
      attack_plan: >-
        Take instrument-class-scope.yaml. For each candidate: mechanism
        stated, asymptotic cost with provenance, campaign-scale
        feasibility classed (executable / measurable / argument-only),
        prediction, test boundary, falsification condition present? For
        each dominated_by: null - is the frontier check across time,
        memory, and data/queries recorded (an unchecked null is a
        fabrication under SC-1)? Is sota_delta quantitative against the
        MD5 calibration cost anchor and the frontier ledger's rows?
        Where the Coordinator expects it to break: a candidate ranked
        first on plausibility prose with no falsification condition.
    - joint: >-
        L3 MD4 run identity + cost transfer: identical search structure across the pair, the variant EXACTLY the declared null object, and the cost-transfer comparison computed from the run records, not the reports?
      assigned_to: TASK-20260821-02d397
      attack_plan: >-
        Diff the two run records: instrument file sha256, seed, ceiling,
        memory, encoding, search parameters (per the ruling). Recompute
        the T-prime table from RFC 1320 section 3's 64 constants + shift
        16 (verify the T constants against the filed RFC text first) and
        diff against the null run's declared table. Hunt for a second,
        unannounced difference (schedule word order, rotations, IV, block
        size, step count) - any of them voids the control. Then compute
        the two comparisons yourself from the run records: the MD4 pair R
        ratio (baseline = the MD4 target's own wall_seconds; TOL = 2) and
        the cost-transfer ratio against the MD5 calibration pair
        (54.179836 / 55.156728 s, EV-MDFIVE-f3e1ca O-2 - NOT the reports).
        Where the Coordinator expects it to break: the variant table
        drifting from the declared shift, or the cost-transfer ratio
        copied from the report with the baseline quietly changed.
    - joint: >-
        L4 Decision-table + cost honesty: is the row the pair lands on the row the outcomes + R ratio produce, with does_not_show carried; wrapper timing; the two cost categories labeled; the weaker-acceptance-path disclosure present if any success?
      assigned_to: TASK-20260821-02d397
      attack_plan: >-
        Take the two outcomes and the two wrapper-measured costs FROM THE
        RUN RECORDS. Walk BCP-2's decision table and name the row the MD4
        pair actually produces; compare to the row the reports name. Quote
        the row's does_not_show text and check the records carry it
        untrimmed. Both run records: timing_source: wrapper,
        wall_seconds <= 900, cost = ceiling iff halted. Read the build
        report and the run reports side by side: can the instrument BUILD
        cost be mis-read as search cost or vice versa? If any SUCCESS
        occurred: the weaker-acceptance-path limitation (no
        md4_collision_pair certificate kind this batch) recorded, and the
        independent-recomputation verification present. Where the
        Coordinator expects it: the labeling gap, not a timing lie.
    - joint: >-
        L5 Scope honesty / no premature closure: does the package keep the method-ceiling STATEMENT open (or name the obstruction as a candidate) per the inventor protocol's closure standard, and is the partial-hit signature comparison (MD4 vs the MD5 calibration pair) the first real discrimination data - stated as such?
      assigned_to: TASK-20260821-02d397
      attack_plan: >-
        Read instrument-class-scope.yaml and the run report as claims:
        does anything in the frozen package assert a method ceiling, a
        named obstruction as established, or a closure of the instrument-
        class question? The closure standard (docs/inventor-protocol.md
        section 2) requires a named obstruction, an argument, and forward
        guidance naming what remains open - a screened-and-rejected count
        is a fatigue report, status unverified. Check the named-
        obstruction candidate (if any) is labeled a candidate with its
        argument and its forward guidance, not a statement. Check the
        partial-hit signature comparison (MD4 run's partial hits vs the
        MD5 calibration pair's 40-bit-key/0-bit-MSB signature) is stated
        as first discrimination data, with the scope (one encoding, one
        seed, one ceiling) explicit. Where the Coordinator expects it to
        break: the scope record or the run report reading as a closure
        when the evidence is a scoping.
  proves_too_much:
    objects:
      - object: >-
          OBJECT G (provenance mislabel). A synthetic frontier-ledger
          entry marked provenance: retrieved with a plausible citation
          but no filed primary text and no URL, whose stated exponent is
          the model's recalled value. The rule's verdict is known: it is
          NOT retrieved (the conversion to retrieved happens only in a
          record naming the verifying agent that fetched and read the
          source - AGENTS.md knowledge-retrieval policy); it is a
          recalled pointer, and a ledger that carries it as retrieved has
          proved too much.
      - object: >-
          OBJECT H (cost tampering on the MD4 runs). A synthetic run
          record with wall_seconds: 1.0 and timing_source: caller (a
          fabricated bracket around a 900 s run), or a halted run whose
          cost is recorded below the ceiling. The rule's verdict is
          known: violates the charging convention (INV-11) and the
          cost_definition - the cost anchor and the cost-transfer
          comparison built on it are invalid.
      - object: >-
          OBJECT I (closure without obstruction). A synthetic closing
          statement asserting the method-ceiling question is closed
          ("the bounded search cannot close MD5; the frontier is
          explained") with no named obstruction, no argument, and no
          forward guidance. The rule's verdict is known (inventor
          protocol section 2): NOT a closure - a fatigue report, status
          unverified. A gate or record that accepts I as a closure has
          proved too much.
    failure_signature: >-
      A package (or gate) that carries G as retrieved, accepts H's cost as
      the anchor, or accepts I as a closure has proved too much and is
      wrong somewhere it has not been read closely enough.
    assigned_to: TASK-20260821-02d397

  blind_rederivation:
    required: True
    quantity: >-
      The BCP-2 decision-table ROW PREDICATE as a function of its declared
      inputs: (target outcome, variant outcome, R = variant_wall /
      target_wall, TOL = 2) -> row R1-R6, plus the row's does_not_show
      text and the known-limit statement applicability (R1-R3) - derived
      from BCP-2's null_object_control section ONLY (decision table,
      tolerance, baseline definitions).
    parameters: >-
      BCP-2 section null_object_control (~lines 1054+) as the sole source
      of the quantity's statement; the MD4 run pair's outcomes and R ratio
      (from the run records) as the primary test input; a synthetic
      beyond-tolerance pair (R = 3.0, both FAIL) as the edge test input.
    blind_from:
      - the self_report section of coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml
      - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/task-cards/TASK-20260821-cbb510.md
      - ledger/handoffs/TASK-20260821-cbb510.yaml
      - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/task-cards/TASK-20260821-229643.md
      - ledger/handoffs/TASK-20260821-229643.yaml
      - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/task-cards/TASK-20260821-c4a158.md
      - ledger/handoffs/TASK-20260821-c4a158.yaml
    assigned_to: TASK-20260821-02d397

  blindness:
    within_round: >-
      Two-reviewer round. The validator (TASK-20260821-6a36a4) is a
      SIBLING reviewer running concurrently in the same round; its report
      must not be read by this reviewer, and the attestation says so.
      Lifting blindness in a later hardening round requires review-plan
      record amendment with rationale, never drift.
    no_quarantine_reads: >-
      No reviewer in this round reads the MD5 quarantined payload. Object
      G uses synthetic structures; objects H and I use synthetic
      run/closure structures; the quarantine MANIFEST's sha256 list is
      metadata only (the validator's completeness check uses it; the red
      team needs no part of it for G/H/I).
    attestation_required: >-
      The report carries review_attestation: task_id, joints_owned,
      sources_read, read_sibling_reports (must be false),
      blind_from_respected (with a note if false), per-joint verdicts, and
      the resolved model with requested policy review-adversarial at xhigh.
