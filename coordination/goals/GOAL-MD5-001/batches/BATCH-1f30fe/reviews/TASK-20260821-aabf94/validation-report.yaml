  check_5_variant_constant:
    verdict: PASS
    method: >-
      Recomputed the T-prime table from the RFC 1321 section 3.4 constants +
      shift 16, INDEPENDENTLY of the instrument. RFC 1321 section 3.4 defines
      T[i] = int(2^32 * abs(sin(i))), i = 1..64 (radians). The instrument uses
      0-based indexing: _T[j] = T[j+1]. The variant shift is T-prime[i] =
      T[(i+16) mod 64] = _T[(i+16) mod 64]. Diffed the recomputed T-prime
      table against the null run's declared T-prime table
      (variant-definition.yaml + null-object-run-report.yaml).
    rfc_source: >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
      (sha256 284a79d1...), section 3.4: "T[i] denote the i-th element of the
      table, which is equal to the integer part of 4294967296 times abs(sin(i)),
      where i is in radians."
    recomputed_table_matches_declared: true
    mismatch_count: 0
    permutation_check: >-
      64 distinct values in T-prime (the shift is a permutation of the 64
      round constants). Round-trip verified: T-prime[(i+48) mod 64] = T[i]
      for all i.
    command_output: |
      T-PRIME TABLE: MATCH (all 64 entries agree)
      Derived independently from RFC 1321 section 3.4 sine definition + shift 16
      Distinct values in T-prime: 64/64 (permutation: True)
      Round-trip T-prime[(i+48)%64] == T[i]: True

