  # ==================================================================
  # BLIND RE-DERIVATION
  # ==================================================================
  blind_rederivation:
    quantity: >-
      The REDISCOVERY-ELIGIBILITY predicate as a function of its declared
      inputs: (output serialized under the pinned canonicalization,
      pre-registered digest, input_manifest sha256 set, quarantine MANIFEST
      sha256 list, certificate block) -> eligible / not eligible, plus the
      invalidity conditions it triggers.
    source: >-
      BCP-2 evidence_record_requirement section (lines 1217-1254) ONLY.
      The blind_from list was not read for this derivation.
    derived_predicate:
      statement: >-
        eligible(output, pre_registered_digest, input_manifest_sha256_set,
        quarantine_manifest_sha256_list, certificate_block) = ALL of:
        (1) pre_registered_digest_match: sha256(canonical_serialization(
        output)) == pre_registered_digest, with match status recorded;
        (2) clean_input_manifest: intersection(input_manifest_sha256_set,
        quarantine_manifest_sha256_list) is empty (must be empty for
        REDISCOVERY eligibility);
        (3) certificate: certificate_block has verified: true AND
        wrapper-populated verified_by (verified_by populated exclusively
        from the wrapper's own recomputation using BOTH pinned
        implementations, never the solver's own internal digest routine);
        (4) confound_caveat: present (the specific statement text: "This
        success is REDISCOVERY-eligible under the following caveat:
        partial-structure-recall is not excluded by the null-object
        control... and the model's parametric prior knowledge of the
        published path is an irreducible channel no file-system mechanism
        reaches. This result is REDISCOVERY-eligible under that caveat,
        never an unqualified pass.");
        (5) null_object_control_result: the decision-table row (R1-R6)
        the paired variant run landed on, or named OPEN AND UNATTEMPTED
        with the pairing obligation.
      invalidity_conditions:
        - condition: >-
            Missing confound_caveat (or any other required field of
            evidence_record_requirement) -> INV-10: "A REDISCOVERY-eligible
            success record is missing any required field... is invalid,
            never an unqualified pass."
        - condition: >-
            Non-empty CONSUMPTION intersection (input_manifest sha256 set
            contains a hash matching the quarantine MANIFEST sha256 list)
            -> not eligible (clean_input_manifest requirement fails). Per
            BCP-2 evidence_record_requirement.required_fields.clean_input_
            manifest: "the intersection (must be empty for REDISCOVERY
            eligibility)."
        - condition: >-
            Non-verified certificate (certificate.verified absent or
            false, or verified_by not wrapper-populated, or verified by
            only one pinned implementation or by the solver's own digest
            routine) -> not eligible (certificate requirement fails).
    test_on_D:
      input: >-
        Synthetic manifest with sha256 set containing e44a3fed... (the
        quarantined payload's sha256 from the committed MANIFEST).
      evaluation: >-
        clean_input_manifest: intersection({..., e44a3fed...},
        {e44a3fed...}) = {e44a3fed...} -> non-empty -> requirement (2)
