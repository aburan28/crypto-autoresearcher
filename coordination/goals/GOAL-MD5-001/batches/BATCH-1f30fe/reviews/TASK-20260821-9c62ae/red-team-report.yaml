      TASK-20260821-93cc38.md); or their handoffs
      (ledger/handoffs/TASK-20260821-f5f96a.yaml,
      TASK-20260821-c91be2.yaml, TASK-20260821-93cc38.yaml). The predicate
      was derived from BCP-2's evidence_record_requirement section (lines
