      result: not_eligible
      invalidity_triggered: >-
        Non-empty CONSUMPTION intersection -> not eligible (also INV-2 per
        blind_scoring_rule.consumption, but derived here from
        evidence_record_requirement.clean_input_manifest: "must be empty
