      matches_known_verdict: true
    test_on_F:
      input: >-
        Synthetic REDISCOVERY-eligible success record: verified
        certificate, clean manifest, digest match, but NO
        confound_caveat field.
      evaluation: >-
        (1) pre_registered_digest_match: assume match (PASS). (2)
        clean_input_manifest: assume empty intersection (PASS). (3)
        certificate: assume verified: true, wrapper-populated verified_by
        (PASS). (4) confound_caveat: MISSING -> requirement (4) FAILS.
      result: not_eligible
      invalidity_triggered: >-
        Missing confound_caveat -> INV-10: "A REDISCOVERY-eligible
        success record is missing any required field... is invalid, never
        an unqualified pass."
      matches_known_verdict: true
    blind_from_respected: true
    blind_from_note: >-
      This reviewer did NOT read any of the blind_from sources: the
      self_report section of BCP-2.yaml (stopped reading at line 1357,
      one line before self_report begins at line 1358); the producer task
