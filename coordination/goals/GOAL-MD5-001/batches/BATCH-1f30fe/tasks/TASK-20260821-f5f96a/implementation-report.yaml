      (RQ-MDFIVE-6870c1, GOAL-MD5-001); paper:KN-LIT-6577 (Short Chosen-
      Prefix Collisions for MD5); paper:KN-LIT-2894 (Chosen-prefix
      Collisions for MD5 and Colliding X.509 Certificates); and
      technique:KN-TECH-079 (Structural meet-in-the-middle cryptanalysis).
      No prior internal record of a bounded MD5 collision-search instrument
      was returned.
    inference_drawn: >-
      NONE. Per the retrieval policy, no absence, novelty, or prior-non-
      testing inference was drawn from the index. The returned literature
      abstracts (KN-LIT-6577, KN-LIT-2894) describe chosen-prefix collision
