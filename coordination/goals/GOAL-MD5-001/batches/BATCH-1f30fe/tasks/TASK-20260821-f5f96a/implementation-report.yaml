  # ------------------------------------------------------------------
  # DELIVERABLE 3: the search instrument
  # ------------------------------------------------------------------
  instrument:
    file: harness/run_md5_calib.py
    sha256: 50f75444c7c9a80e2fc15c5f06649b7af9c51201ab0ac49fed4eb9e6aa26aed1
    strategy_name_correction: >-
      DISCLOSED: the module's docstring originally named the technique "a
      windowed meet-in-the-middle fragment search". On review before
      reporting, that name was found to be a misnomer: the mechanics
      (enumerate seeded random second blocks, compute each FULL 2-block
      digest, hash-table on the low 40 digest bits, detect collisions in the
      digest space) are a BIRTHDAY (collision-by-enumeration) search, not a
      meet-in-the-middle (which would split the 64-step schedule into
      independent halves meeting on an intermediate state) and not a
      differential-path search. The docstring was corrected to name it a
      bounded birthday search and to state the technique note explicitly.
      The strategy's MECHANICS (what it searches, the memory ceiling, the
      stopping rule) were fixed before any run and are UNCHANGED by this
      correction; only the label was made accurate. Because the run records
      pin the module by sha256, the two smoke runs were re-executed with the
      corrected module so the run records match the current module (the
      pre-correction run records, which pinned the old hash
      e5dcf29d5f9a1ab3eaad150b385afd37cbde96fbd41b4429dd20df67040280c0, were
      removed and replaced). The seven-vector agreement was re-verified after
      the correction (all seven still PASS).
    technique_deviation_from_task_card: >-
      DISCLOSED: the task card suggested "a BOUNDED differential/MTM
      collision-path search (e.g. a windowed biclique / meet-in-the-middle
      fragment search over the 64-step schedule)". The "e.g." gives
      flexibility on the specific technique. This session deliberately
      implemented a simpler BOUNDED BIRTHDAY search (collision-by-
      enumeration over the 128-bit digest space via a low-40-bit hash table)
      rather than a differential or meet-in-the-middle search. Rationale:
      (1) the instrument is a CALIBRATION instrument, not a cryptanalytic
      campaign -- its job is to measure the raw bounded-search capability at
      a declared scale and to be honest about its ceiling, not to recall or
      reconstruct a published differential path; (2) a differential/MTM
      search would require a differential characteristic and neutral words,
      which would couple the instrument to the published collision path the
      task forbids reading (the quarantined payload); (3) a plain birthday
      search is the cleanest null-object baseline for the BCP-2
      target-vs-null comparison. The Coordinator should assess whether a
      true differential/MTM search is required for the RANK 2/3 runs or
      whether the bounded birthday search is an acceptable calibration
      instrument. This is a technique choice, not a status change; no
      conclusion about MD5 is drawn from it.
    standalone_md5: >-
      Written from the RFC 1321 text (section 3.3 step function, 3.4 round
      constants, Merkle-Damgard padding/chaining). The solver core imports no
      standard-library MD5 binding: the only imports are argparse, json,
      math, os, random, sys, time. The string "hashlib" does not appear
      anywhere in the file. The pinned pair in harness/runner.py is used ONLY
      for certificate verification by the run wrapper (a lazy import inside
      the script entry point), never for the search.
    declared_search_strategy: >-
      A bounded BIRTHDAY (collision-by-enumeration) search over the 128-bit
      digest space, fixed before any run. It searches identical-prefix
      2-block messages M1 = B1||B2, M2 = B1||B2' (B1 a fixed 512-bit block
      derived from the seed; B2, B2' distinct random 512-bit blocks,
      hex-encoded) for FULL 128-bit digest equality with M1 != M2. The search
      enumerates up to N = 2^21 distinct seeded random second blocks, computes
      each full 2-block digest (all 64 steps, one compression pass per block),
      and inserts (digest, block) into a hash table keyed by the digest's low
      k = 40 bits (the table holds up to N entries, the memory ceiling, a few
      hundred MB in CPython under the batch's 4 GB). A table hit (two distinct
      blocks, same 40-bit key) is a 40-bit digest-prefix collision, a partial
      result; a full 128-bit match is SUCCESS. The stopping rule is: stop at
      the monotonic-clock deadline (checked each block), or when the table is
      full, or on a full 128-bit match (SUCCESS). It is deliberately NOT a
      meet-in-the-middle and NOT a differential-path search: no differential
      characteristic, no neutral words, no bit conditions, and no splitting of
      the schedule into halves meeting on an intermediate state.
    determinism: >-
      A single --seed (the runs use seed 0) drives every stochastic element
      (B1 derivation and the B2 enumeration order); no other source of
      randomness exists.
    variant: >-
      --variant-shift N (default 0): the round constants used are
      T[(i+N) mod 64]. N=0 is standard MD5; N=16 is the BCP-2 null variant.
      The variant is the ONLY difference between the target and null runs:
      the schedule word order, rotations, IV, Merkle-Damgard chaining, and
      step count are identical.
    cost_instrumentation: >-
      The run is charged via harness.runner.run_wrapped (wrapper-measured
      wall_seconds, timing_source: wrapper, per BCP-2 charging_convention).
      The module reports internal counters in its raw result:
      blocks_evaluated, fragments_tried (4 per block), table_size,
      partial_hits, best_prefix_bits, best_prefix_cost_blocks. The manifest
      metrics carry near_collision_blocks (the BCP-2 required key) =
      partial_hits.
    deadline: >-
      A --deadline (monotonic-clock seconds) is checked each block; the
      search stops cleanly and reports stop_reason (deadline / table_full /
      full_match) and where it stopped (blocks_evaluated).
    report_writer: >-
      write_report() emits machine-readable JSON: outcome (SUCCESS with the
      two hex messages + claimed digest, ready for the md5_collision_pair
      certificate kind / FAIL), the search space explored, the strongest
      partial result (longest matching digest-prefix and the cost in blocks
      at which it was achieved), and the counters.

