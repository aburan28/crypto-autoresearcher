  # ------------------------------------------------------------------
  # COVERAGE BOUNDARY
  # ------------------------------------------------------------------
  coverage_boundary: >-
    The instrument's search depth is BOUNDED by design: it is a calibration
    instrument, not a cryptanalytic campaign. It is a bounded birthday search
    that probes the 128-bit digest space via a hash table on the low 40
    digest bits for up to 2^21 second blocks. What it cannot reach -- a full
    128-bit digest match, which requires ~2^64 second blocks (birthday bound)
    at this encoding, i.e. full 64-step state matching at 2^64 scale -- is
    named OPEN, not silently omitted. A budgeted FAIL of the search runs is an
    admissible, complete observation (SC-4): a statement about the solver at
    the declared encoding, seed, and ceiling, never evidence about the
    existence or non-existence of MD5 collision paths. The instrument's job
    is to be honest about its ceiling.

