claim_ceiling: >-
  blind_calibration_execution_and_instrument_verdict_only. This batch
  EXECUTES the blind calibration search and its null-object control and
  records an instrument verdict (capability at the declared encoding, seed,
  and ceiling; cost anchor; ceiling report). BOTH OUTCOMES ARE ADMISSIBLE
  per the goal's completion criterion: a verified rediscovery (recorded
  with the BCP-2 confound caveat, never unqualified) or a budgeted failure
  (a statement about the solver, never evidence about MD5, SC-4). The batch
  asserts NOTHING about MD5 beyond what the executed runs and their two
  independent reviews support — no existence claim, no complexity claim, no
  method ceiling, no comparison against any published result in either
  direction (the method-ceiling audit and the MD4 lower control belong to a
  later batch and are OPEN AND UNATTEMPTED here).

objective: >-
  THE CALIBRATION BATCH. Run the instrument. RANK 1 lands the F-6(a)
  precondition (the committed md5_collision_pair pin-mechanism test in
  tests/test_harness.py), acquires the RFC 1321 primary text under the
  network policy (filed with its sha256 as the runs' only specification
  input), and implements the search instrument harness/run_md5_calib.py —
  a standalone MD5 written from the RFC text plus a bounded, declared,
  deterministic collision-path search with cost instrumentation. RANK 2 is
  the BLIND TARGET RUN against standard MD5 (900 s ceiling, 4 GB, seed 0,
  pre-dispatch gate re-verified at dispatch, closed hash-manifested input
  set, charged via run_wrapped). RANK 3 is the NULL-OBJECT RUN against the
  BCP-2 null variant (round constants cyclically shifted by 16) with
  IDENTICAL instrument, encoding (adapted only for the variant constants),
  ceiling, and seed, run SEQUENTIALLY after the target. Then one isolated
  snapshot of both runs and the instrument, two concurrent independent
  reviews under the pre-committed plan (red team on the frozen run package;
  validator on run integrity and certificate/firewall), and one isolated
  ledger archive. Interpretation is strictly through BCP-2's decision table
  R1-R6 with TOL = 2 and the named baseline; a REDISCOVERY-eligible success
  is recorded with the confound_caveat (INV-10) or not at all.

