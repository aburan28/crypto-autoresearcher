contamination_firewall: >-
  CARRIED FORWARD FROM BCP-2 (frozen at 8677f11af), which carried it from
  BCP-1. The quarantined payload (coordination/goals/GOAL-MD5-001/quarantine/,
  sha256 e44a3fed..., pre-registered digest 2ea0083b... under the pinned
  canonicalization) remains quarantined and EXCLUDED from corpus staging by
  the structural property verified in BATCH-46254b (the 21 staging globs in
  kb/src/crypto_kb/ingest/repo_corpus.py match only knowledge/, ledger/,
  experiments/, docs/, inputs/). THIS IS THE FIRST BATCH WHERE THE FIREWALL
  DOES ITS JOB IN PRODUCTION: the target run's input manifest is checked for
  the payload's sha256, and any CONSUMPTION finding is recorded invalid,
  never a weaker pass. No task in this batch reads the payload (hash-only
  gate access is the declared mechanic); the null-object run has no payload
  to consume (INV-2 vacuous per BCP-2). The parametric channel remains
  declared-not-checked with its named obstruction (model parametric prior
  knowledge); the confound_caveat (INV-10) is the standing control for any
  REDISCOVERY-eligible success. A loosening is a finding that HALTS the
  batch.

