budget:
  wall_clock_seconds: 4720
  memory_gb: 4
  maximum_runs: 3
  split_across_tasks:
    TASK-20260821-e651fd: 160
    TASK-20260821-f5f96a: 1500
    TASK-20260821-c91be2: 900
    TASK-20260821-93cc38: 900
    TASK-20260821-711350: 160
    TASK-20260821-9c62ae: 450
    TASK-20260821-aabf94: 450
    TASK-20260821-7b0330: 300
  arithmetic: '160 + 1500 + 900 + 900 + 160 + 450 + 450 + 300 = 4720 exactly.'
  basis: >-
    Declarations, not measurements (carried forward). The two search runs
    each declare the 900 s wall ceiling that is also their cost anchor: a
    halted run's cost IS the ceiling (BCP-2 cost_definition), so the run
    budget and the measurement budget are the same number, declared before
    either run. The RANK 1 line (1500 s) is sized for test + acquisition +
    instrument on batch 1's acquisition-overrun evidence. maximum_runs 3 =
    one run per search task (the pin test and the reviewers' re-runs are
    checks, not campaign runs, and are recorded as such). A task that
    reaches its declared wall_clock_seconds HALTS; the halt is
    infrastructure signal, never a negative mathematical result (rule 5),
    and dropped work is SCOPE, never an answer (rule 8).

