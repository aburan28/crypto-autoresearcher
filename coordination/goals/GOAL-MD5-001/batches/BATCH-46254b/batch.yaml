  arithmetic: >-
    400 + 120 + 600 + 120 + 450 + 450 + 160 + 350 + 350 + 300 = 3300 exactly.
    The largest single line is the RANK 1 protocol act at 600 s, which is
    correct for a batch whose entire product is that protocol.
  basis: >-
    EVERY FIGURE IS A DECLARATION AND NONE IS A MEASUREMENT. GOAL-MD5-001 has
    never run a task, so this campaign has no measured duration of its own for
    any role, and no figure here is transcribed from another campaign's actuals
