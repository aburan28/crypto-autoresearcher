  not merely written. Then run the two producers concurrently at max_concurrent 2,
  snapshot both under TASK-20260810-5c819b, and take the two independent reviews
  before the single ledger archive.

max_concurrent: 2
max_concurrent_basis: >-
  DELIBERATELY 2 AND NOT THE CAMPAIGN'S 3. The intended concurrent pair is
  TASK-20260810-3e0793 and TASK-20260810-bde128; every other task is serialized
  by a dependency or by being an isolated archive that must run alone. Stated
  precisely rather than loosely: TASK-20260810-b9d956 depends only on
  TASK-20260810-26d0d5 and TASK-20260810-927ab5, so it becomes ELIGIBLE once
  BCP-1 is committed and could in principle be scheduled alongside the two
  producers - the cap of 2 is what prevents that, and the intended schedule runs
  it after them. Declaring 3 would advertise headroom this batch does not want to
  use. The campaign's max_concurrent of 3 is not changed by this.

