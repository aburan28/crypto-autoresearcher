claim_ceiling: >-
  protocol_freeze_implementation_pin_and_literature_acquisition_only. THIS BATCH
  ASSERTS NOTHING ABOUT MD5. It states no collision, no preimage, no complexity,
  no method ceiling, no obstruction, and no comparison against any published
  result in either direction. It freezes a scoring protocol, pins and
  test-vector-validates two implementations, and files literature. Per
  RQ-MDFIVE-6870c1 claim_tier_ceiling, instrument-calibration results carry no
  cryptanalytic content at all; this batch does not even reach a calibration
  result, because the calibration search is expressly out of scope here.

objective: >-
  THE GATE BATCH. RQ-MDFIVE-6870c1 imposes two hard preconditions before any
  experiment may be designed - literature filed as KN-LIT at stated provenance
  levels, and an RFC 1321 implementation pinned and validated against the
  published test vectors - and a third requirement, that the calibration be
  scored BLIND, which is only enforceable if its protocol is frozen before the
  corpus changes. This batch discharges all three in that order: (RANK 1) freeze
  the blind-calibration scoring protocol BCP-1; (RANK 2) pin and test-vector-
  validate two independent RFC 1321 implementations, the second existing so that
  collision certificates can be re-verified independently; (RANK 3) acquire and
  file the preimage literature and one published MD5 collision path as KN-LIT.
  Then the standard chain: three isolated snapshots, an independent validation
  pass, an independent red-team pass whose target is BCP-1 itself, and one
  isolated ledger archive. THE BLIND CALIBRATION SEARCH IS NOT IN THIS BATCH.

ranked_shape:
  rank_1_protocol_freeze:
    task: TASK-20260810-26d0d5
    artifact: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml
    why_first: >-
      NOT CEREMONY - AN ORDERING THAT CANNOT BE RECOVERED LATER. Blindness is a
      property of the information state at run time, and information states are
      monotone: a corpus can gain the published collision path but can never
      un-learn it. RANK 3 deliberately imports that path. Once it is filed and
      reachable, no protocol written afterwards can restore the pre-acquisition
      state - it can only ASSERT blindness, unfalsifiably. BCP-1 must therefore
      exist, and be committed, before the corpus changes, because it is BCP-1
      that defines the quarantine marker and the input-manifest discipline that
      RANK 3 then has to apply. Run in the other order, the entry is filed
      unmarked and the marker has nothing to attach to.
  rank_2_implementation_pin:
    task: TASK-20260810-3e0793
    why_two: >-
      RQ-MDFIVE-6870c1 requires collision certificates to be literal pairs
      RE-VERIFIED INDEPENDENTLY. One implementation cannot re-verify itself, and
      two builds of the same source are not independent. This task pins two
      implementations of separate provenance and validates BOTH against the
      RFC 1321 published test vectors before either is trusted for anything.
  rank_3_acquisition:
    task: TASK-20260810-bde128
    what_it_settles: >-
      The RQ's provenance block is web-search excerpt, unread in primary text,
      and every figure in it is UNVERIFIED - including the ~2^123.4 preimage
      complexity, the paper titles, and one excerpt's description of the 2009
      result as "the first practical preimage attack", which the RQ flags as an
      apparent error and preserves rather than smooths over. Settling that flag
      against primary text is this task's job, not this Coordinator's.

# =====================================================================
# THE CONTAMINATION FIREWALL. This is the substantive design act of the
# batch and the reason RANK 1 outranks RANK 3.
# =====================================================================
contamination_firewall:
  the_conflict_stated_plainly: >-
    RQ-MDFIVE-6870c1 contains two constraints that pull against each other, and
    naming the tension is better than discovering it mid-campaign. Constraint 1
    requires a published MD5 collision path to be FILED AS A KN-LIT ENTRY before
    any experiment is designed. Constraint 3 requires the calibration to be
    scored BLIND, and rules that "a run that consumes the published path and
    then reports success has measured nothing and is recorded as invalid". A
    KN-LIT entry is corpus material reachable by search_knowledge. Discharging
    constraint 1 in the obvious way therefore makes constraint 3 unfalsifiable
    after the fact, because no later evidence can distinguish rediscovery from
    retrieval.
  resolution_required_of_BCP_1:
    - >-
      SPLIT THE ENTRY FROM ITS PAYLOAD. The KN-LIT entry proper carries
      bibliography, provenance level, and what the source claims - and NO path
      data: no differential characteristic, no message-block values, no
      colliding pair. It is corpus-safe and stays retrievable, which is what the
      acquisition gate actually needs.
    - >-
      QUARANTINE THE PAYLOAD AT A DECLARED PATH. The published path data itself
      goes to coordination/goals/GOAL-MD5-001/quarantine/ with its sha256
      recorded in the KN-LIT entry's quarantine block BY HASH ONLY, and BCP-1
      declares that path excluded from corpus staging.
    - >-
      PRE-REGISTER THE ANSWER AS A DIGEST, NEVER AS THE ANSWER. BCP-1 records
      the canonical digest of the quarantined payload before any search runs. A
      digest scores a result without carrying one, so the scoring artifact is
      not itself a leak.
    - >-
      GIVE THE SOLVER A CLOSED, HASH-MANIFESTED INPUT SET. The calibration run
      wrapper constructs the solver's entire input directory explicitly and
      records the sha256 of every file in it in the run manifest. This is the
      one part of the firewall that is CHECKED RATHER THAN ASSERTED: read_scope
      is a declaration a reader cannot verify, but a complete input manifest
      either contains the quarantined digest or it does not.
  what_makes_a_calibration_run_invalid:
    - >-
      The run manifest carries no input manifest, or an input manifest that does
      not cover every file the solver could read.
    - >-
      The quarantined payload's digest appears in the input manifest. This is
      consumption, and it is `invalid` rather than a weaker pass.
    - >-
      Any declared-before-run field - encoding, solver identity and version,
      seed, wall-clock ceiling - is absent, or was altered after the run began.
    - >-
      The encoding was authored in a session that had read the quarantined
      payload, per the required encoding-provenance declaration.
  what_read_scope_alone_cannot_do: >-
    STATED BECAUSE THE HONEST ANSWER IS THAT IT IS NOT SUFFICIENT. A task card's
    read_scope is a declaration by the Coordinator that no runtime here
    enforces: AGENTS.md records that api_direct refuses WRITES outside scope and
    restricts commands, and says nothing equivalent about reads, and this
    runtime enforces neither. A reader auditing a finished run cannot tell from
    read_scope whether a file was opened. That is precisely why the firewall's
    load-bearing element is the closed input manifest and not the read_scope
    line, and why the quarantine marker is a declaration plus a digest rather
    than an access control.
  residual_risk_that_cannot_be_eliminated: >-
    MODEL PRIOR KNOWLEDGE, AND IT IS IRREDUCIBLE IN THIS PROGRAM. Published MD5
    collision paths have been in the public record for two decades and are
    therefore in the training data of any model this harness can resolve. The
    contaminated channel is the model's parameters, and no read scope, input
    manifest, quarantine marker or file-system arrangement reaches it. Two
    consequences, both of which BCP-1 must carry rather than this batch
    pretending they are solved. FIRST, THE CALIBRATION IS EVIDENTIALLY
    ASYMMETRIC: a FAILURE is a clean statement about the instrument, because
    recall could only have helped; a SUCCESS is confounded by prior exposure and
    can never be fully de-confounded. This is an independent reason the goal's
    own completion criterion is right to call the failure outcome the more
    important one. SECOND, THE ONLY DISCRIMINATOR AVAILABLE IS A NULL-OBJECT
    CONTROL in the sense of docs/inventor-protocol.md: run the identical
    instrument, at the identical budget, against a shape-matched MD5 variant
    whose round constants or message schedule are permuted, so that structure is
    nearly preserved and recall is worthless. Success there is evidence of
    search; success only on genuine MD5 is consistent with recall. BCP-1
    specifies that control; this batch does not run it and claims nothing from
    it.

scope:
  admitted:
    - the frozen blind-calibration scoring protocol BCP-1
    - two independent RFC 1321 implementations pinned and validated against the published test vectors
    - a measured hash-throughput datum from the pinned implementations, as a budget input and expressly not a cryptanalytic result
    - KN-LIT entries for the preimage literature and one published MD5 collision path, at stated provenance levels
    - the quarantined collision-path payload with its digest, outside the retrieval corpus
    - one independent validation pass and one independent red-team pass targeting BCP-1
    - three isolated snapshot archives and exactly one isolated ledger archive
  excluded:
    - >-
      THE BLIND CALIBRATION SEARCH ITSELF. It is the next batch's work and it
      may not be started here under any budget, because its protocol is not
      committed until this batch commits it.
    - any collision generation, identical-prefix or chosen-prefix
    - any preimage work, any MITM or biclique analysis, any method-ceiling or obstruction statement
    - the MD4 control, which belongs to the ceiling audit and not to this gate
    - any hypothesis, experiment, question or goal status transition
    - any edit to campaign_budget, which is a separate decision on its own merits
    - any attestation or completion_quorum block

