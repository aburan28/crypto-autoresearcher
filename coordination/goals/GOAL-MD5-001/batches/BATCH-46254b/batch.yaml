    (AGENTS.md rule 5), and the dropped work is SCOPE, never an answer (rule 8).

# =====================================================================
# BUDGET OBSERVATION. Recorded, not acted on. campaign_budget is UNCHANGED.
# =====================================================================
campaign_budget_observation:
  status: recorded_as_an_observation_only
  campaign_budget_as_committed: >-
    maximum_batches 6, total_wall_clock_seconds 10800, max_concurrent 3, exactly
    as written in ledger/goals/GOAL-MD5-001.yaml. THIS BATCH CHANGES NONE OF IT.
  judgement: >-
    INADEQUATE FOR THE COMPLETION CRITERIA AS WRITTEN, and the shortfall is not
    marginal. This batch contains zero cryptanalysis and still draws 3300 s, or
    30.6% of the entire campaign, and it is structurally the cheapest kind of
    batch this goal will run. That leaves 7500 s for five batches which must
    together carry a blind characteristic search, an identical-prefix collision,
    a CHOSEN-PREFIX collision, the MITM ceiling audit, the MD4 control, and each
    of those with its own reviews and archives. Split evenly that is 1500 s per
    batch to cover coordination, one producer, two reviews and an archive - and
    in this batch those non-producer lines alone are 2400 of 3300 s. The compute
    residual per later batch is therefore a few hundred seconds.
  the_structural_argument_behind_that: >-
    STATED WITHOUT QUOTING ANY LITERATURE FIGURE, because no cost figure for any
    of these attacks has been read in primary text by this program and quoting a
    recalled one as authority would be fabrication in either direction. Three
    orderings hold by construction and need no citation. (i) Generating a
    collision by EXECUTING a published path is strictly cheaper than
    REDISCOVERING that path by automated search, since the second must find what
    the first is handed. (ii) A chosen-prefix collision is strictly more
    expensive than an identical-prefix one, since it must additionally reconcile
    two arbitrary prefixes through a birthday phase and multiple near-collision
    blocks. (iii) The goal's first completion criterion asks for the EXPENSIVE
    member of ordering (i), and its second asks for both members of ordering
    (ii). The budget was plausibly sized against the cheap readings of both.
  the_deeper_problem_this_batch_can_fix: >-
    ADEQUACY IS CURRENTLY UNDEFINED, NOT MERELY DISPUTED, because the charging
    convention is not fixed. Under authoring-inclusive session-elapsed charging,
    which this program's AES lane uses, 10800 s is roughly three coordinator
    sessions and cannot cover six batches with reviews at all. Under compute-only
    charging it is more plausible, but then coordination is uncharged and 10800 s
    is not a real ceiling. BCP-1 fixes that convention in this batch, which is
    the one thing that turns this observation into something a later decision can
    actually adjudicate.
  what_would_have_to_change_named_but_not_enacted:
    - >-
      Raise total_wall_clock_seconds against a sizing basis measured rather than
      declared. TASK-20260810-3e0793 produces the first such datum - hash
      throughput on the pinned implementations - which is the unit every later
      collision budget needs and which no record in this campaign currently has.
    - >-
      Or split completion criterion 1 into its two genuinely different asks -
      "execute a published path to a literal pair" and "rediscover a path blind"
      - and decide explicitly which the campaign buys. They differ by orders of
      magnitude and are currently one bullet.
    - >-
      Or accept at campaign close that the chosen-prefix criterion is OPEN AND
      UNATTEMPTED and record it as such. Under AGENTS.md rules 5 and 8 that is a
      perfectly honest outcome; recording it as tested or as negative would not
      be.
  why_it_is_not_acted_on_here: >-
    A budget change is a decision on its own merits and needs the throughput
    datum this batch has not yet produced. Amending it now, before any
    measurement, would replace one declared number with another declared number
    and call the second one evidence.

dependent_goals:
  what_the_goal_head_says: >-
    GOAL-MD5-001 next_action states that this goal RUNS FIRST IN THE 2026-08-09
    SYMMETRIC SET AND THE OTHERS WAIT ON ITS FIRST BATCH, and its non_duplication
    block makes this goal the owner of instrument calibration for the whole
    symmetric lane.
  what_the_dependency_concretely_is: >-
    NARROWER THAN "WAIT FOR MD5", AND WORTH STATING EXACTLY SO THAT FIVE
    CAMPAIGNS ARE NOT BLOCKED LONGER THAN THE EVIDENCE REQUIRES. What the
    dependent goals need from this batch is BCP-1 - the scoring protocol, the
    charging convention, the certificate format, and the invalidity conditions -
    because those are what make any of their calibration claims checkable. What
    they need from a LATER batch is the calibration verdict itself. The two are
    separable: GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001 and
    GOAL-SIMSPK-001 are unblocked for protocol and setup work once
    TASK-20260810-927ab5 commits BCP-1, and remain blocked from asserting
    anything ABOUT THEIR INSTRUMENT until the calibration verdict exists.
  what_this_batch_does_not_do_to_them: >-
    It changes no status, budget, scope, priority or next_action of any of those
    five goals, or of GOAL-SHA1-001 or GOAL-RSA-001. BCP-1's charging convention
    is authored in a form those goals CAN adopt, and binds none of them: adoption
    is each goal's own Coordinator decision. GOAL-MD5-001's second completion
    criterion names GOAL-SHA1-001 and GOAL-RSA-001 as sharing that convention;
    this batch treats that as a design requirement on BCP-1, not as an assertion
    that either goal has adopted anything.

next_action: >-
  Dispatch TASK-20260810-26d0d5, the RANK 1 protocol act, as the first work of
  this batch - after TASK-20260810-fc23ce has committed and pushed this opening
  control plane - and snapshot it under TASK-20260810-927ab5 BEFORE either
  producer runs. The dependency of TASK-20260810-3e0793 and TASK-20260810-bde128
  on TASK-20260810-927ab5 rather than on TASK-20260810-26d0d5 is the firewall
