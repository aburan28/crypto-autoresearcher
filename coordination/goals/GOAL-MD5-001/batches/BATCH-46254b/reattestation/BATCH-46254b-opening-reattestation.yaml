  why_this_reattestation_exists: >-
    The control plane of BATCH-46254b was produced by TASK-20260810-cbd708 and
    committed in one commit 230038427 that changed 24 paths (3 declared control
    files plus 21 orphan paths). The opening snapshot task TASK-20260810-fc23ce
    was scoped to just the 3 declared files; its commit-mode archive would have
    to change exactly those 3 in a single fresh commit, which is impossible
    because they are already durable at 230038427. Per DEC-20260819-8e16cc, the
    binding is re-scoped via content_first: this reattestation re-binds the 3
    declared control files by citation to 230038427, and TASK-20260819-f98fc0
    archives it by content_first. This reattestation is a new stable file at a
    path that is not in any existing task's artifact_paths, so content_first can
    bind its hash without a self-reference circularity.

