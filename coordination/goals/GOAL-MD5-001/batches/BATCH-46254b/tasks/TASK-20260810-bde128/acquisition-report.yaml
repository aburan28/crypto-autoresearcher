    disposition: UNSETTLED
    reason: >-
      The flag could not be settled against primary text because the primary
      text of the 2009 Sasaki-Aoki paper (its abstract, which would state the
      authors' own "practical" vs. "cryptographic" wording and the exact
      complexity) was not obtainable from an accessible source under the
      network policy: the Springer chapter page and PDF, ACM DL, scispace, and
      scienceopen all returned bot-block or empty responses on 2026-08-20. The
      bulk-seeded KN-LIT-3888 relays "the first cryptographic preimage attack"
      but is explicitly unverified and cannot settle the flag. The flag is
      therefore recorded as UNSETTLED with this reason; it is NOT smoothed over
      and NOT settled by recollection or assertion.
    related_data_point: >-
      A different paper on the same frontier, KN-LIT-d3ec68 (Aumasson-Meier-
      Mendel, ePrint 2008/183), states in its abstract that its step-reduced
      MD5 preimage attacks are "not practical." This is a data point about a
      different paper and does not settle the 2009 paper's own wording.

