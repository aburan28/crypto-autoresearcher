  # ------------------------------------------------------------------
  # SOURCES
  # ------------------------------------------------------------------
  sources:
    - kn_lit_id: KN-LIT-87e00e
      title: "Collisions for Hash Functions MD4, MD5, HAVAL-128 and RIPEMD"
      authors: [Xiaoyun Wang, Dengguo Feng, Xuejia Lai, Hongbo Yu]
      identifier: "IACR ePrint 2004/199 (revised 2004-08-17)"
      url: "https://eprint.iacr.org/2004/199"
      provenance_level: "primary text obtained and read"
      obtained: "2026-08-20"
      what_it_claims: >-
        (attributed to the source) The first published collision attack on full
        MD5 (and MD4, HAVAL-128, RIPEMD), a differential attack that measures
        difference by modular integer subtraction rather than XOR. It reports
        two pairs of 1024-bit messages colliding under MD5 with the original
        initial value; the message difference is non-zero at message-word
        positions 4, 11 and 14. On the authors' hardware the first pair took
        about an hour, the second block pair 15 s to 5 min; the attack works for
        any given initial value.
      path_data: >-
        The differential characteristic, message-block values, and colliding
        pairs were read from the PDF and are QUARANTINED (not restated in the
        KN-LIT entry). See quarantine block below.
      extraction_caveat: >-
        The source PDF's text layer drops hex digits from some 32-bit message
        words (confirmed under both `pdftotext -layout` and `pdftotext -raw`),
        so the literal colliding pairs are recorded as-extracted and flagged as
        potentially incomplete in the quarantined payload. The differential
        characteristic, initial value, and digests extract cleanly.

    - kn_lit_id: KN-LIT-582d77
      title: "Finding Preimages in Full MD5 Faster Than Exhaustive Search"
      authors: [Yu Sasaki, Kazumaro Aoki]
      identifier: "DOI 10.1007/978-3-642-01001-9_8; IACR cryptodb pubkey 23796"
      url: "https://link.springer.com/chapter/10.1007/978-3-642-01001-9_8"
      provenance_level: "metadata only"
      obtained: "2026-08-20"
      what_is_verified: >-
        (from IACR cryptodb, read 2026-08-20) Title, authors (Yu Sasaki,
        Kazumaro Aoki), year (2009), DOI, and venue as listed by IACR cryptodb
        (EUROCRYPT 2009, LNCS 5479, pp. 134-152). The DOI prefix is an
        FSE-2009-era LNCS identifier; the venue discrepancy is preserved, not
        smoothed over.
      what_is_not_verified: >-
        The abstract and full text were NOT obtained from an accessible primary
        source (Springer chapter page + PDF, ACM DL, scispace, scienceopen all
        returned bot-block or empty responses on 2026-08-20). Therefore the
        complexity figures (the RQ's ~2^123.4 preimage / ~2^116.9
        pseudo-preimage / 2^45 x 11 words memory), the method description, and
        the authors' own "practical" vs. "cryptographic" characterization are
        UNVERIFIED and are not asserted here.
      supersedes: KN-LIT-3888
      supersession_note: >-
        This entry supersedes the bulk-seeded KN-LIT-3888 (2026-07-24) by
        reference, adding verified identifiers and an explicit provenance
        level. KN-LIT-3888's `superseded_by` field is a committed record and is
        left for the Coordinator to set. KN-LIT-3888's relayed abstract ("the
        first cryptographic preimage attack ... 2^116.9 ... 2^123.4") is
        explicitly unverified and is NOT used as authority here.

    - kn_lit_id: KN-LIT-328239
      title: "Inverting Cryptographic Hash Functions via Cube-and-Conquer"
      authors: [Oleg Zaikin]
      identifier: "arXiv 2212.02405; DOI 10.1613/jair.1.15244"
      url: "https://arxiv.org/abs/2212.02405"
      provenance_level: "abstract obtained and read"
      obtained: "2026-08-20"
      what_it_claims: >-
        (attributed to the source, from the arXiv abstract) A cube-and-conquer
        (CDCL + lookahead) SAT approach to inverting step-reduced MD4 and MD5.
        Reports 40-, 41-, 42-, 43-step MD4 inverted for the first time, and
        28-step MD5 inverted for four hashes (three of them for the first time).
        Full text not read; step counts and "first time" claims are relayed from
        the abstract.

    - kn_lit_id: KN-LIT-d3ec68
      title: "Preimage Attacks on 3-Pass HAVAL and Step-Reduced MD5"
      authors: [Jean-Philippe Aumasson, Willi Meier, Florian Mendel]
      identifier: "IACR ePrint 2008/183"
      url: "https://eprint.iacr.org/2008/183"
      provenance_level: "abstract obtained and read"
      obtained: "2026-08-20"
      what_it_claims: >-
        (attributed to the source, from the ePrint abstract) Preimage attacks on
        the 3-pass HAVAL compression function (~2^224 instead of 2^256) and on
        the MD5 compression function inverting up to 47 of 64 steps within 2^96
        trials instead of 2^128. The authors state the attacks are "not
        practical." Full text not read; figures relayed from the abstract.
      title_correction: >-
        The RQ's provenance title "Preimage Attacks on Step-Reduced MD5" is a
        truncated form of this paper's full title; the attribution is corrected
        here against the ePrint record.

    - kn_lit_id: null
      title: "Preimage Attacks on One-Block MD4, 63-Step MD5 and More"
      authors: [Aoki, Sasaki (per RQ provenance; unverified)]
      identifier: null
      url: null
      provenance_level: "unobtainable"
      obtained: null
      outcome: >-
        NOT OBTAINED. An ePrint title search for "Preimage Attacks on One-Block
        MD4 63-Step MD5" returned "No results" on 2026-08-20, and no accessible
        primary source was identified under the network policy. No KN-LIT entry
        was filed because no verified content was obtained; filing from
        recollection would be a fabricated citation. This is an acquisition
        outcome, never evidence about the underlying cryptanalysis (SC-4).
      pause_condition_engaged: >-
        GOAL-MD5-001 pause condition: "The preimage papers or a published
        collision path cannot be obtained in primary text under the network
        policy after the declared source-preference order is exhausted." This
        source engages that condition (not obtainable in primary text). The
        condition is only PARTIALLY engaged overall: the collision path
        (KN-LIT-87e00e) WAS obtained in primary text, and the main preimage
        paper (KN-LIT-582d77) was obtained in metadata only.

