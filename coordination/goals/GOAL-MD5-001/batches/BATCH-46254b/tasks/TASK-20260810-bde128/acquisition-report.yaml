  flagged_error:
    description: >-
      RQ-MDFIVE-6870c1's provenance block records that one web-search excerpt
      described the 2009 Sasaki-Aoki result as "the first PRACTICAL preimage
      attack," and flags that as an apparent error because 2^123.4 is not
