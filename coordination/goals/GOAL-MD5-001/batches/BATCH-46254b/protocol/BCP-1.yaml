blind_calibration_protocol:
  id: BCP-1
  status: frozen
  frozen_statement: >-
    THIS RECORD IS FROZEN AS OF ITS COMMIT under TASK-20260810-927ab5, which
    occurs BEFORE TASK-20260810-bde128 (RANK 3 acquisition) writes anything
    under knowledge/literature/ or coordination/goals/GOAL-MD5-001/quarantine/.
    That ordering, not any statement in this file, is what makes "blind"
    checkable rather than merely asserted; this file exists to define the
    checks that ordering makes possible. No field under
    fixed_before_acquisition below may be edited after commit. A change to any
    of them is a new record (BCP-2 or later) that supersedes this one by
    reference, per AGENTS.md immutability and the protocol_amendment
    discipline in agents/coordinator.md and CLAUDE.md ("Never change success
    criteria after observing outcomes without a versioned protocol_amendment
    record"). This file itself is not an amendment of anything: it is BCP-1,
    the first record of its kind for GOAL-MD5-001.
  id_convention_note: >-
    BCP-<n> is not one of the CLAUDE.md-conventions ID families
    (RQ-/IDEA-/H-/EXP-/RUN-/EV-/DEC-/TASK-/BATCH-/KN-) and is not minted with
    tools/allocate_id.py. Its id is fixed literally by the handoff
    (TASK-20260810-26d0d5, deliverable 1: "BCP-1.yaml ... carrying id BCP-1").
    It lives at a declared batch-scoped path
    (coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml)
    rather than under ledger/, because it is a protocol contract that later
    task cards reference by path, in the same spirit as an EXP-* frozen
    specification.yaml, not a ledger status record.
  recorded_at: '2026-08-13'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  authored_by_task: TASK-20260810-26d0d5
  snapshotted_by_task: TASK-20260810-927ab5
  attacked_by_task: TASK-20260810-b9d956

  claim_ceiling: >-
    THIS RECORD ASSERTS NOTHING ABOUT MD5. It fixes a scoring protocol before
    any calibration search runs. It contains no collision, no preimage, no
    complexity, no method-ceiling, no obstruction, and no comparison against
    any published result in either direction, matching RQ-MDFIVE-6870c1
    claim_tier_ceiling ("instrument calibration results carry no cryptanalytic
    content at all") and BATCH-46254b claim_ceiling
    (protocol_freeze_implementation_pin_and_literature_acquisition_only). Every
    figure in RQ-MDFIVE-6870c1 provenance (the ~2^123.4 preimage complexity,
    every paper title, the "first practical preimage attack" excerpt the RQ
    flags as an apparent error) remains UNVERIFIED and is not cited here as
    authority in either direction; this file does not settle that flag, which
    is TASK-20260810-bde128's job.

  purpose: >-
    Fix, before the corpus can gain a published MD5 collision path, exactly
    how a future blind-calibration run (out of scope for this batch; a later
    batch's work) will be scored, what a calibration agent's read boundary is,
    what the run wrapper must checkably record, and what makes a run invalid.
    Blindness is a property of the information state at run time and is
    monotone: a corpus can gain the path but never un-learn it. Written after
    acquisition, this document could only assert blindness; written before,
    the ordering itself is the (partial) enforcement mechanism, and this file
    says exactly how partial.

  scope:
    applies_to: >-
      Any run dispatched under GOAL-MD5-001 that claims to have (1)
      rediscovered a differential characteristic or message pair for an MD5
      identical-prefix or chosen-prefix collision without being handed the
      published path, or (2) driven such a search to a literal colliding
      pair. This includes the eventual blind calibration search itself and
      the null-object control specified below.
    does_not_apply_to: >-
      TASK-20260810-3e0793 (implementation pinning and RFC 1321 test-vector
      validation — no search, nothing to score blind) and TASK-20260810-bde128
      (literature acquisition — this file defines the quarantine marker RANK 3
      must apply, but RANK 3 itself is not a calibration run and is not scored
      by BCP-1). Neither producer task in this batch runs a calibration search;
      THE BLIND CALIBRATION SEARCH IS NOT IN BATCH-46254b.
    dependent_goal_adoption: >-
      GOAL-SHA1-001's second completion criterion and GOAL-RSA-001's
      completion criteria name a shared charging convention. BCP-1 is authored
      in a form those goals, and GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001,
      GOAL-ASCON-001 and GOAL-SIMSPK-001, CAN adopt — but adoption is each
      goal's own Coordinator decision, made in that goal's own record. This
      file edits no record of any of them and asserts no adoption on their
      behalf.

  # ===================================================================
  # (a) DECLARED-BEFORE-RUN FIELDS
  # ===================================================================
  fixed_before_acquisition:
    note: >-
      The five fields below MUST be declared, filled, and committed in the
      calibration run's task card / specification BEFORE that run is
      dispatched, and BEFORE the run process starts. A run that alters any of
      them after starting is INVALID (see invalidity_conditions, INV-3). This
      protocol does not itself set their values — no calibration run exists
      yet, GOAL-MD5-001 next_action is explicit that the search is a later
      batch's work — it fixes the SCHEMA and the immutability rule they must
      satisfy.
    required_fields:
      encoding:
        description: >-
          The exact representation the characteristic search operates over
          (e.g. which state/message bits are tracked, what a "step" of search
          is, what counts as a candidate characteristic). Recorded as a
          committed specification.yaml or equivalent frozen artifact, referenced
          by path and content hash.
        must_include: encoding_provenance_declaration (see below)
      solver_identity_and_version:
        description: >-
          Exact solver name, source, version or commit, and toolchain,
          recorded with the same independence-of-provenance discipline
          TASK-20260810-3e0793 applies to the two RFC 1321 implementations.
          Pinned by content hash (harness/runner.py source_provenance already
          pins every executed .py source file by sha256 against sys.modules;
          the calibration solver's modules are covered by that existing
          mechanism with no protocol extension needed).
      seed:
        description: >-
          Every source of randomness the search uses (RNG seed for any
          randomized search heuristic, any tie-breaking order) declared
          explicitly. harness/runner.py's RunResult.seed and manifest
          run.inputs.seed already carry this field; BCP-1 requires it be
          non-null for any run claiming rediscovery.
      wall_clock_ceiling:
        description: >-
          The declared budget.wall_clock_seconds ceiling for the search
          process itself, fixed before dispatch, using the charging
          convention defined below in charging_convention. Reaching the
          ceiling HALTS the run; see failed_search_rule (e).
    immutability_rule: >-
      A run whose encoding, solver identity/version, seed, or wall-clock
      ceiling differs between what was declared at dispatch and what the run
      manifest records at completion is INVALID (INV-3), independent of
      outcome. This mirrors AGENTS.md's prohibition on changing success
      criteria after observing outcomes: none of these four fields may be
      tuned mid-search in response to intermediate results.
    encoding_provenance_declaration:
      required: true
      fields:
        authoring_session_read_quarantined_payload: null
        authoring_session_id: null
        statement_template: >-
          "The session that authored this run's encoding [did / did not] read
          any file under coordination/goals/GOAL-MD5-001/quarantine/ or the
          collision-path-specific KN-LIT entry filed by TASK-20260810-bde128,
          before or during encoding authorship."
      how_it_is_used: >-
        A true value on authoring_session_read_quarantined_payload makes the
        run CONSUMPTION (INV-2) regardless of what the run's input manifest
        contains, because the contamination channel is authorship of the
        encoding itself, not merely the solver process's runtime inputs.
      honesty_mechanism_not_technical_control: >-
        STATED PLAINLY: this declaration is self-attested and this runtime
        does not enforce or audit read history (see
        what_read_scope_alone_cannot_do below). It is recorded because a
        false attestation is a fabrication under AGENTS.md rule 5 and SC-1,
        which is a real (if not mechanically enforced) deterrent, not because
        BCP-1 can verify it.

  # ===================================================================
  # (b) BLIND-SCORING RULE: REDISCOVERY vs CONSUMPTION
  # ===================================================================
  blind_scoring_rule:
    rediscovery:
      definition: >-
        A run is REDISCOVERY, and eligible to be scored, when ALL of the
        following hold: (1) the run's closed, hash-manifested input set
        (input_manifest, defined below) contains no file whose sha256 matches
        any entry in the quarantine MANIFEST; (2)
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded false; (3) the four fixed_before_acquisition fields were
        declared before dispatch and unchanged at completion; (4) any claimed
        collision certificate is the literal pair format below, independently
        re-verified by the run wrapper using the SECOND pinned implementation
        (not the one, if any, the solver used internally).
      outcomes_both_score: >-
        A REDISCOVERY run may still fail to find anything within its
        wall-clock ceiling. Per failed_search_rule (e) and
        RQ-MDFIVE-6870c1 constraint 4 / GOAL-MD5-001 completion criterion 1,
        BOTH a verified rediscovered pair and a truthfully reported halt are
        valid, scorable outcomes of a REDISCOVERY run. Only CONSUMPTION is
        excluded from scoring.
    consumption:
      definition: >-
        A run is CONSUMPTION, and is recorded INVALID rather than a weaker
        pass (RQ-MDFIVE-6870c1 constraint 3, verbatim), when ANY of the
        following hold: (1) the quarantined payload's sha256 (or the sha256
        of any file derived from it) appears in the run's input_manifest; (2)
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded true; (3) the run's raw output or reasoning trace
        (wherever captured) quotes or closely paraphrases the quarantined
        payload's specific values (message words, chaining-value deltas, bit
        conditions) without those values being independently derived within
        the run's own recorded search trace; (4) the encoding was authored by
        a session that had read the collision-path-specific KN-LIT entry
        (see firewall.read_scope, may_not_read).
      RQ_binding_language: >-
        "a run that consumes the published path and then reports success has
        measured nothing and is recorded as invalid, not as a weaker pass"
        (RQ-MDFIVE-6870c1 constraint 3). This protocol implements that rule
        exactly; it does not soften it.
    what_this_rule_cannot_reach: >-
      See residual_risk below. This rule scores two MECHANICAL channels
      (solver-process input set; self-attested authoring read history). It
      cannot detect or score a model's PARAMETRIC prior knowledge of a
      published MD5 path, which is a third channel no file-system rule
      reaches.

  # ===================================================================
  # (c) COLLISION CERTIFICATE FORMAT
  # ===================================================================
  collision_certificate_format:
    kind: md5_collision_pair
    note_on_existing_certificate_kinds: >-
      harness/runner.py's certificate discipline currently implements
      kind in {discrete_log, decomposition, none} (docs/claims-and-verification.md).
      md5_collision_pair is a NEW kind this protocol specifies; it does not
      exist in harness/runner.py's _verify() today. BCP-1 fixes the schema and
      the independence rule; implementing _verify() support for this kind is
      work for whichever future task builds the calibration/collision run
      wrapper, and no calibration run may be scored under BCP-1 before that
      support exists and is exercised by a real run.
    schema:
      kind: md5_collision_pair
      statement:
        message_1: <hex, exact bytes>
        message_2: <hex, exact bytes>
        digest: <hex, the common MD5 output>
      requirement: message_1 != message_2 and MD5(message_1) == MD5(message_2) == digest
      verified_by:
        - implementation: <id of implementation A, from TASK-20260810-3e0793 implementation-pin.yaml>
          computed_digest_message_1: <hex>
          computed_digest_message_2: <hex>
        - implementation: <id of implementation B, from TASK-20260810-3e0793 implementation-pin.yaml>
          computed_digest_message_1: <hex>
          computed_digest_message_2: <hex>
      verified: null
      verifier: run-wrapper-independent-recompute
      verifier_commit: <git-sha, filled by the run wrapper>
    independence_rule: >-
      RQ-MDFIVE-6870c1 constraint 6 ("collision certificates must be literal
      pairs re-verified independently ... A reported collision without its
      pair is not admissible") and docs/claims-and-verification.md's
      certificate independence rule apply without relaxation: verification is
      performed by the RUN WRAPPER using BOTH pinned implementations from
      TASK-20260810-3e0793, never by the solver's own internal digest
      computation, and never by only one of the two implementations (that
      would fail the "re-verified by code that did not produce it" purpose
      the second implementation exists for). If either implementation
      computes a mismatching digest for either message, verified: false and
      the run is completed_invalid per the existing runner.py rule for a
      failed certificate (invalid_measurement, not a negative_observation).

  # ===================================================================
  # (d) CHARGING CONVENTION
  # ===================================================================
  charging_convention:
    status: fixed_by_this_record
    why_this_was_undefined_until_now: >-
      BATCH-46254b's campaign_budget_observation names this ambiguity as the
      reason the campaign budget's adequacy could not be adjudicated:
      authoring-inclusive session-elapsed charging (which this program's AES
      lane uses for coordination-level task budgets) makes a solver-cost
      figure depend on which runtime/model authored or coordinated the run,
      while compute-only charging leaves coordination overhead unaccounted.
      Those are legitimately different clocks for different purposes; BCP-1
      fixes the one this protocol's charging convention governs and names the
      other explicitly so the two are never conflated.
    clock_chosen: compute_only_solver_process_wall_clock
    definition: >-
      wall_seconds, as harness/runner.py's write_run() already records it:
      finished - started measured around the solver/attack process's own
      execution window (RunResult timing), EXCLUDING any authoring, review,
      task-dispatch, coordination, or session overhead. This is an EXISTING
      field (run.timing.wall_seconds in the minimum run manifest,
      docs/evidence-and-reproducibility.md), not a new one.
    rationale:
      - >-
        It is the unit GOAL-MD5-001 completion criterion 2 calls a "measured
        cost anchor," and the unit TASK-20260810-3e0793's hash-throughput
        datum will be reported in — a property of the machine and the solver,
        not of which model or runtime coordinated the dispatch.
      - >-
        A shared convention across GOAL-SHA1-001 and GOAL-RSA-001 (per
        GOAL-MD5-001's second completion criterion) must be comparable across
        goals that may run under different backends/runtimes
        (orchestration/model-bindings.yaml); an authoring-inclusive clock
        would make the same solver cost read differently depending on
        coordination overhead unrelated to the primitive being attacked.
      - >-
        harness/runner.py already measures this quantity for every run with
        no protocol extension required, unlike the md5_collision_pair
        certificate kind or the input_manifest field, both of which ARE new.
    what_this_does_not_change: >-
      This is NOT the same clock as a task handoff's
      budget.wall_clock_seconds (e.g. this task's own 600 s), which governs
      dispatch-level session budgets across the whole harness and is outside
      this record's scope. campaign_budget (ledger/goals/GOAL-MD5-001.yaml:
      6 batches, 10800 s, max_concurrent 3) is UNCHANGED by this record;
      changing it remains a separate Coordinator decision on its own merits
      per BATCH-46254b (campaign_budget_change_authorized: false).
    memory: >-
      peak_rss_bytes, as harness/runner.py already records via
      resource.getrusage(RUSAGE_SELF) in run.resources.peak_rss_bytes. No new
      field required.
    near_collision_block_count: >-
      A NEW required key in a calibration/collision run's
      run.result.metrics: near_collision_blocks (integer, the count of
      near-collision message blocks the search/generation used). This does
      not exist in any current run today; it is specified here as a
      requirement on the future calibration/collision run wrapper, per
      GOAL-MD5-001 completion criterion 2 and RQ-MDFIVE-6870c1's "measured
      cost anchor" target.

  # ===================================================================
  # (e) FAILED SEARCH RULE
  # ===================================================================
  failed_search_rule: >-
    A search that reaches wall_clock_ceiling, crashes, or is otherwise halted
    before rediscovering a characteristic or driving one to a certified pair
    is a BUDGET OUTCOME about the solver at the declared encoding, seed, and
    ceiling — and is NEVER evidence that no such characteristic or pair
    exists (AGENTS.md rules 3/5/8; RQ-MDFIVE-6870c1 constraint 4; batch.yaml
    SC-4). It is reported as a valid negative_observation (not
    invalid_measurement — the certificate kind is none, there is nothing to
    fail verification) and the dropped search space is named as SCOPE, never
    as an answer. This is a REPORTABLE result about the instrument
    (GOAL-MD5-001 pause_conditions: "IS a reportable result about the
    instrument, and the dependent goals must be told"), and per completion
    criterion 1 of GOAL-MD5-001, this outcome is the MORE important of the
    two possible outcomes precisely because of the evidential asymmetry
    stated in residual_risk below.

  # ===================================================================
  # THE FIREWALL
  # ===================================================================
  firewall:
    what_read_scope_alone_cannot_do: >-
      STATED PLAINLY BECAUSE THE HONEST ANSWER IS THAT IT IS NOT SUFFICIENT.
      A task card's read_scope is a Coordinator declaration. AGENTS.md records
      that the api_direct runtime enforces write_scope (refuses a write
      outside it) and restricts commands, and says nothing equivalent about
      reads; this Claude Code runtime enforces neither reads nor writes by
      declaration alone. A reader auditing a finished run cannot tell from a
      task card's read_scope line whether a file was actually opened during
      that session. THE FIREWALL'S REAL LOAD-BEARING ELEMENT IS THEREFORE THE
      SOLVER'S CLOSED, HASH-MANIFESTED INPUT SET (below), which is checkable
      post-hoc from committed bytes, NOT the read_scope declaration, which is
      not. read_scope below is retained because it is still the honest
      statement of INTENT and because a false encoding_provenance_declaration
      against a narrow, explicit read_scope is a clearer fabrication than one
      against no declared boundary at all — but it is a declaration, not a
      control, and this file does not claim otherwise.
    read_scope:
      may_read_once_committed:
        - AGENTS.md, docs/claims-and-verification.md, docs/evidence-and-reproducibility.md
        - this file (coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml)
        - the RFC 1321 specification text (primary source, however it is filed)
        - TASK-20260810-3e0793's implementation-pin.yaml and test-vector-report.json,
          and the two pinned implementation source trees they describe
        - the published RFC 1321 test-vector suite (inputs, not attack paths)
      may_not_read:
        - coordination/goals/GOAL-MD5-001/quarantine/** (the quarantined payload
          and its MANIFEST.yaml, entirely)
        - the collision-path-specific KN-LIT entry(ies) TASK-20260810-bde128
          files (identified once minted; excluded even though that entry is
          corpus-safe of literal path data, per the extra-margin rule below)
        - any other running or completed task's raw output that might discuss
          or embed the quarantined digest
      extra_margin_rule: >-
        The collision-path KN-LIT entry is deliberately designed
        (contamination_firewall.resolution_required_of_BCP_1 in batch.yaml) to
        carry bibliography, provenance level, and what the source CLAIMS, with
        NO path data. It is nonetheless excluded from the calibration
        encoding-authoring session's read_scope, because prose describing the
        method (e.g. "uses meet-in-the-middle with differential paths") could
        still bias search direction even without carrying a literal value.
        This margin is a declaration like the rest of read_scope, not a
        control.
    quarantine:
      path: coordination/goals/GOAL-MD5-001/quarantine/
      applies_to: >-
        The published MD5 collision-path PAYLOAD only — a literal differential
        characteristic, message-block values, IHV deltas, or a colliding pair
        obtained from a published source. Bibliography, provenance level, and
        prose description of what a source claims belong in the KN-LIT entry
        under knowledge/literature/, not here.
      marker:
        file_level: >-
          Every file placed under quarantine/ MUST carry, as its first
          top-level key (YAML) or a sibling `<filename>.BCP-1-QUARANTINE.yaml`
          sidecar (for non-YAML payloads), the literal key
          `bcp1_quarantine: true` and a `bcp1_marker` string equal to
          "BCP-1-QUARANTINED-PAYLOAD".
        manifest_file: >-
          coordination/goals/GOAL-MD5-001/quarantine/MANIFEST.yaml, listing
          every quarantined file's relative path, sha256, source KN-LIT id,
          and date quarantined. TASK-20260810-bde128 and its snapshot
          TASK-20260810-5c819b are responsible for creating and staging this
          manifest; BCP-1 fixes only its required shape (path, sha256,
          source_kn_lit_id, quarantined_at) here, not its content.
      corpus_exclusion_is_structural_not_only_declared: >-
        CHECKED, NOT MERELY DECLARED: kb/src/crypto_kb/ingest/repo_corpus.py's
        staging rules (STAGING_RULES, read at
        kb/src/crypto_kb/ingest/repo_corpus.py:262-268) are explicit globs —
        knowledge/literature/KN-LIT-*.md, knowledge/techniques/KN-TECH-*.md,
        knowledge/findings/KN-FIND-*.md, knowledge/open-problems/KN-OPEN-*.md
        — over knowledge/ only. No rule matches
        coordination/goals/GOAL-MD5-001/quarantine/**, so `crypto-kb stage-repo`
        structurally cannot stage anything under quarantine/ into the
        retrieval corpus; this is a fact about the committed source, verified
        by reading it in this task, not an assumption. What remains DECLARED
        rather than checked: whether a future change to STAGING_RULES adds a
        quarantine-matching glob (nothing in this repository prevents that;
        this file is not a technical control on future edits to
        repo_corpus.py) and whether any agent manually copies quarantined
        content into knowledge/literature/ (guarded only by the invalidity
        rule INV-6 below and by the snapshot task's halt-and-report duty, not
        by any file-system mechanism).
      quarantine_staging_prohibition: >-
        No snapshot or ledger archive commits any content read from
        quarantine/ into knowledge/literature/ or any other corpus-staged
        path. TASK-20260810-5c819b's own handoff already carries this as a
        hard gate ("Verify before staging that the collision-path KN-LIT entry
        ... contains no path data and that the payload sits under
        quarantine/. If it does not, HALT AND REPORT rather than committing").
        BCP-1 restates it as an invalidity condition (INV-6) for calibration
        runs specifically: a calibration run whose input_manifest or
        knowledge-retrieval trace pulls from a knowledge/literature/ entry
        that itself (contrary to design) carries quarantined path data is
        CONSUMPTION regardless of that entry's nominal corpus status.
    expected_answer_digest:
      field: pre_registered_expected_answer_digest
      definition: >-
        The sha256 of the canonical serialization of the quarantined
        payload (the published collision path / colliding pair), computed and
        recorded BEFORE any calibration search runs. A digest scores a result
        without carrying one: comparing a search's output digest to this
        value never hands the search the answer.
      value: null
      why_null_here: >-
        TASK-20260810-bde128 (RANK 3), which quarantines the payload this
        digest is computed over, has not run yet — it depends on
        TASK-20260810-927ab5 committing this very file first. This field
        cannot be filled honestly before that. Per SC-1 (fabricate nothing), it
        stays null and is named as such.
      population_rule: >-
        TASK-20260810-bde128 or its snapshot TASK-20260810-5c819b MUST
        populate this field's value in the quarantine MANIFEST.yaml (not by
        editing this frozen BCP-1.yaml — see amendment_and_supersession) once
        the payload is quarantined. NO CALIBRATION RUN MAY BE DISPATCHED under
        BCP-1 while the corresponding MANIFEST.yaml entry's digest is absent;
        this is a pre-dispatch gate, restated from the task handoff's own
        framing of BCP-1 as such a gate.
    closed_hash_manifested_input_set:
      field: run.inputs.input_manifest
      definition: >-
        The calibration run wrapper MUST construct the solver's ENTIRE input
        directory explicitly — every file the solver process's working
        directory or environment exposes it to read, not merely the .py
        source modules harness/runner.py's existing source_provenance()
        already pins by sha256 (that mechanism covers EXECUTED CODE; this one
        must additionally cover DATA the solver reads: the RFC 1321
        specification text, pinned-implementation constants, any seed file)
        — and record the sha256 of every file in it under
        run.inputs.input_manifest in manifest.yaml, alongside the existing
        run.code.source block.
      this_is_new: >-
        input_manifest as specified does not exist in harness/runner.py today
        (verified in this task by reading write_run(): run.inputs currently
        carries only curve_id, seed, parameters). BCP-1 fixes the requirement;
        implementing it is work for whichever future task builds the
        calibration run wrapper. No calibration run may be scored under BCP-1
        until a run manifest actually carries a complete input_manifest.
      what_is_checked_vs_declared: >-
        CHECKED: whether the recorded input_manifest sha256 set contains any
        hash matching quarantine/MANIFEST.yaml (a reviewer recomputes both
        independently from committed bytes and compares — this is the one
        firewall element this protocol treats as an auditable fact rather than
        a claim). DECLARED, NOT CHECKED: whether input_manifest is actually
        COMPLETE, i.e. whether it truly covers every file the solver process
        could have read (an omitted file is invisible to this check by
        construction) — completeness rests on the run wrapper's own
        implementation being audited, which is exactly the kind of claim
        TASK-20260810-b9d956's red-team pass against BCP-1 should attack.

  # ===================================================================
  # INVALIDITY CONDITIONS
  # ===================================================================
  invalidity_conditions:
    note: >-
      Consuming the published path (INV-2) is recorded as INVALID, exactly as
      RQ-MDFIVE-6870c1 constraint 3 requires — never as a weaker pass, a
      partial credit, or a "contaminated but informative" result.
    items:
    - id: INV-1
      condition: >-
        The run manifest carries no input_manifest, or an input_manifest that
        does not (on its face) cover every file the solver could read.
    - id: INV-2
      condition: >-
        The quarantined payload's digest (or a digest of any file derived from
        it) appears in input_manifest. This is CONSUMPTION and is recorded
        invalid, never a weaker pass (RQ-MDFIVE-6870c1 constraint 3, exact
        wording carried in blind_scoring_rule.consumption above).
    - id: INV-3
      condition: >-
        Any of the four fixed_before_acquisition fields (encoding, solver
        identity/version, seed, wall-clock ceiling) is absent at dispatch, or
        differs between dispatch-time declaration and completion-time
        manifest.
    - id: INV-4
      condition: >-
        encoding_provenance_declaration.authoring_session_read_quarantined_payload
        is recorded true, or the declaration itself is absent.
    - id: INV-5
      condition: >-
        A claimed md5_collision_pair certificate was verified by only one
        pinned implementation, by the solver's own internal digest routine, or
        by any code path that is not the run wrapper's independent recompute
        using BOTH implementations from TASK-20260810-3e0793.
    - id: INV-6
      condition: >-
        The run's input_manifest or knowledge-retrieval trace draws from a
        knowledge/literature/ entry that (contrary to design) itself carries
        quarantined path data, per firewall.quarantine.quarantine_staging_prohibition.
    - id: INV-7
      condition: >-
        The run is dispatched before pre_registered_expected_answer_digest.value
        is populated in the corresponding quarantine MANIFEST.yaml entry.
    - id: INV-8
      condition: >-
        The run reports a rediscovered characteristic or pair without a
        wall-clock ceiling halt AND without a certificate, or reports success
        with certificate.verified absent or false — i.e. any state other than
        "verified pair" or "truthful halt" is invalid, matching
        failed_search_rule and docs/claims-and-verification.md's rule that a
        failed certificate makes the run invalid_measurement, not a result.

  # ===================================================================
  # RESIDUAL RISK
  # ===================================================================
  residual_risk:
    the_irreducible_channel: >-
      MODEL PRIOR KNOWLEDGE. Published MD5 collision paths have been public
      for two decades and are therefore in the training data of any model
      this harness can resolve (orchestration/model-bindings.yaml). The
      contaminated channel is the model's PARAMETERS, not the repository's
      file system. No read_scope line, input_manifest, quarantine marker, or
      staging-rule glob reaches a model's weights. This is stated as a fact
      about the residual risk, not engineered around, because it cannot be
      engineered around within this program's reach.
    consequence_1_evidential_asymmetry: >-
      The calibration is EVIDENTIALLY ASYMMETRIC. A FAILURE (a truthful halt
      under failed_search_rule) is a clean statement about the instrument,
      because recall of the published path could only have helped a solver
      that has access to it via its authoring model — so a clean failure rules
      out both "the solver found it by search" and "the solver found it by
      recall" equally. A SUCCESS is confounded by prior exposure and can never
      be fully de-confounded by any mechanism this file specifies. This is an
      independent reason GOAL-MD5-001 completion criterion 1 is right to name
      the failure outcome as the more important of the two — restated here so
      BCP-1 carries the reasoning, not just the goal head.
    consequence_2_null_object_control: >-
      THE ONLY AVAILABLE DISCRIMINATOR is a null-object control in the sense
      of docs/inventor-protocol.md section 3 ("run the identical measurement
      against a null object"). Specified below. This batch does not run it and
      claims nothing from it; it is specified now, before acquisition, because
      the same monotonicity argument that motivates freezing BCP-1 first
      applies to the control's design.

  # ===================================================================
  # NULL-OBJECT CONTROL (recall-vs-search discriminator)
  # ===================================================================
  null_object_control:
    object: >-
      A shape-matched MD5 variant with permuted round constants (the 64
      T[i] additive constants of RFC 1321 section 3.4) or a permuted
      message-schedule word order per round, keeping the number of steps,
      the per-step rotation amounts, and the overall Merkle-Damgard/ARX
      structure identical to standard MD5.
    why_recall_is_worthless: >-
      No published MD5 collision path applies verbatim to a variant whose
      round constants or word order differ from standard MD5 — a
      memorized path's specific bit conditions and message-word values are
      keyed to the exact constants the variant does not use.
    why_structure_is_nearly_preserved: >-
      The step function, rotation schedule shape, number of rounds, and
      Merkle-Damgard chaining are unchanged, so a genuine differential-search
      instrument that reasons from the specification (rather than recalling a
      specific path) should transfer to the variant at comparable cost, absent
      some MD5-specific structural coincidence the search happens to depend
      on.
    protocol: >-
      Run the IDENTICAL instrument, IDENTICAL encoding (adapted only for the
      variant's constants), and IDENTICAL wall-clock ceiling against the
      variant that BCP-1's blind calibration search uses against standard
      MD5, under the same fixed_before_acquisition and invalidity_conditions
      rules (a variant run has no quarantined payload to consume, so INV-2,
      INV-4, and INV-6 are vacuously satisfied for it, but INV-1, INV-3, INV-5,
      and INV-8 apply unchanged).
    discriminator_logic: >-
      Success (a verified rediscovered pair) against the variant, at
      comparable cost to any success against genuine MD5, is evidence of
      genuine search capability. Success only against genuine MD5, with
      failure or markedly higher cost against the shape-matched variant at
      matched budget, is CONSISTENT WITH recall of the real, memorized path
      rather than search — though per consequence_1_evidential_asymmetry this
      still does not certify recall; it only fails to rule it out.
    scope_note: >-
      This control is SPECIFIED, not run, by this batch. It belongs to
      whichever future batch dispatches the blind calibration search itself;
      BCP-1 requires that search be paired with this control in the same or
      the following batch, consistent with CLAUDE.md's requirement that a
      conditional/instrument result be paired with a heuristic-validation-style
      experiment.

  # ===================================================================
  # AMENDMENT AND SUPERSESSION
  # ===================================================================
  amendment_and_supersession: >-
    This file is immutable once committed (AGENTS.md rule 2). Any correction —
    including populating expected_answer_digest.value, which this file
    deliberately does NOT do — happens in the quarantine MANIFEST.yaml (a
    separate, later-committed artifact this file references but does not
    contain) or, for any change to a fixed_before_acquisition field, an
    invalidity condition, or the charging convention itself, in a new
    superseding record BCP-2 with its own id, never by editing this file's
    bytes. A superseding record must state which BCP-1 fields it changes and
    why, and any calibration run already dispatched under BCP-1 keeps BCP-1's
    rules for scoring purposes (no retroactive rescoring).

  # ===================================================================
  # SELF-REPORT (this task's own execution)
  # ===================================================================
  self_report:
    budget_declared_seconds: 600
    actual_wall_clock_seconds: null
    actual_wall_clock_note: >-
      This coordinator session has no shell/timer instrumentation available to
