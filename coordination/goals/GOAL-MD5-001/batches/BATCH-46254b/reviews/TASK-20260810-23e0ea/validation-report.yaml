          (throughput_measurements[0], total_bytes field)
        description: >-
          input_bytes/total_bytes is recorded as 1073741824 (which equals
          1024^3 = 1 GiB) for IMPL-1's throughput measurement. The actual
          total input is 1000 x 1024 x 1024 = 1048576000 bytes (1000 MiB,
          not 1024 MiB). The throughput_gbps of 0.853 is correctly
          calculated from the actual total (1048576000 / 1.230 / 1e9 =
          0.853), but the recorded input size field is wrong by 25165824
