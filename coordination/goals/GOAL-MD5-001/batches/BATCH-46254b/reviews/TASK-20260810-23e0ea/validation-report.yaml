  defects:
    count: 4
    items:
      - id: DEFECT-1
        severity: minor
        location: >-
          coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-3e0793/implementation-pin.yaml
          (IMPL-1 throughput block, input_bytes field) AND
