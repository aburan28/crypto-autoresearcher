  # ===================================================================
  # CHECK 1: RFC 1321 test vectors — INDEPENDENT RE-RUN
  # ===================================================================
  check_1_rfc1321_vectors:
    verdict: PASS
    basis: >-
      Re-ran all 7 RFC 1321 Appendix A.5 test vectors against BOTH pinned
      implementations (IMPL-1 hashlib.md5 via OpenSSL _hashlib, IMPL-3 _md5
      via CPython standalone C extension). Cross-implementation agreement
      is PERFECT: all 7 vectors produce identical output between the two
      independent implementations. A third path (openssl dgst -md5 CLI,
      IMPL-2) was also cross-checked on the vectors where my recollection
      disagreed, and it agreed with both IMPL-1 and IMPL-3, confirming my
      recalled expected values for vectors 5-7 were wrong, not the
      implementations.
    rfc1321_primary_text_available_locally: false
    rfc1321_primary_text_provenance: >-
      NOT FOUND in local corpus (confirmed by filesystem search). The
      expected digest values used for conformance checking are marked
      provenance: recalled. Per SC-3, recalled figures are not authority.
      The cross-implementation agreement (two independent codebases
      producing identical output) is the stronger check and does not
      depend on the expected values being verified against primary text.
    producer_report_baseline: >-
      The producer's test-vector-report.json tested only 1 of 7 RFC 1321
      vectors (the empty string, RFC 1321 A.5.1). The producer honestly
      disclosed this as a partial verification. This re-run extends
      coverage to all 7 vectors.
    vector_by_vector:
      - vector: RFC1321_A5_1_empty_string
        input: '""'
        impl_1_hashlib_md5: d41d8cd98f00b204e9800998ecf8427e
        impl_3_cpython_md5: d41d8cd98f00b204e9800998ecf8427e
        expected_recalled: d41d8cd98f00b204e9800998ecf8427e
        cross_impl_agreement: AGREE
        expected_match: MATCH
      - vector: RFC1321_A5_2_a
        input: '"a"'
        impl_1_hashlib_md5: 0cc175b9c0f1b6a831c399e269772661
        impl_3_cpython_md5: 0cc175b9c0f1b6a831c399e269772661
        expected_recalled: 0cc175b9c0f1b6a831c399e269772661
        cross_impl_agreement: AGREE
        expected_match: MATCH
      - vector: RFC1321_A5_3_abc
        input: '"abc"'
        impl_1_hashlib_md5: 900150983cd24fb0d6963f7d28e17f72
        impl_3_cpython_md5: 900150983cd24fb0d6963f7d28e17f72
        expected_recalled: 900150983cd24fb0d6963f7d28e17f72
        cross_impl_agreement: AGREE
        expected_match: MATCH
      - vector: RFC1321_A5_4_message_digest
        input: '"message digest"'
        impl_1_hashlib_md5: f96b697d7cb7938d525a2f31aaf161d0
        impl_3_cpython_md5: f96b697d7cb7938d525a2f31aaf161d0
        expected_recalled: f96b697d7cb7938d525a2f31aaf161d0
        cross_impl_agreement: AGREE
        expected_match: MATCH
      - vector: RFC1321_A5_5_abcdefghijklmnopqrstuvwxyz
        input: '"abcdefghijklmnopqrstuvwxyz"'
        impl_1_hashlib_md5: c3fcd3d76192e4007dfb496cca67e13b
        impl_3_cpython_md5: c3fcd3d76192e4007dfb496cca67e13b
        expected_recalled: c3fcd3d76192e4007dfb496eca67e13b
        cross_impl_agreement: AGREE
        expected_match: >-
          MISMATCH (recalled expected was wrong; three independent paths —
          hashlib/OpenSSL, _md5/CPython, openssl CLI — all produce
          ...b496cca67e13b, not ...b496eca67e13b. My recollection was
          faulty, not the implementations. RFC 1321 primary text not
          available locally to settle definitively, but cross-impl
          agreement is strong.)
      - vector: RFC1321_A5_6_ABCabc0123456789
        input: >-
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
        impl_1_hashlib_md5: d174ab98d277d9f5a5611c2c9f419d9f
        impl_3_cpython_md5: d174ab98d277d9f5a5611c2c9f419d9f
        expected_recalled: d174ab98d277d9f5a5611c2c9f419d5f
        cross_impl_agreement: AGREE
        expected_match: >-
          MISMATCH (recalled expected was wrong; same three-path agreement
          as vector 5. My recollection faulty.)
      - vector: RFC1321_A5_7_1234567890x8
        input: '"1234567890" repeated 8 times (80 bytes)'
        impl_1_hashlib_md5: 57edf4a22be3c955ac49da2e2107b67a
        impl_3_cpython_md5: 57edf4a22be3c955ac49da2e2107b67a
        expected_recalled: 57edf4a22be3c955ac49da2e2107c8f0156f9c0a
        cross_impl_agreement: AGREE
        expected_match: >-
          MISMATCH (recalled expected was wrong AND wrong length — 40 hex
          chars instead of 32; my recollection was confused. Both
          independent implementations produce a valid 32-hex-char MD5
          digest that agrees with the openssl CLI.)
    summary: >-
      7/7 vectors: cross-implementation agreement between IMPL-1 (hashlib
      via OpenSSL) and IMPL-3 (_md5 via CPython standalone C). 4/7 match
      recalled expected values; 3/7 do not, but the mismatch is in my
      recollection, not the implementations (confirmed by a third
      independent path). RFC 1321 primary text not available locally;
      expected values stay marked recalled and are not authority (SC-3).

  # ===================================================================
  # CHECK 2: INDEPENDENCE DETERMINATION
  # ===================================================================
  check_2_independence:
    determination: ESTABLISHED
    basis: >-
      Challenged the pair concretely using otool -L (shared library
      dependency analysis) and runtime type inspection. The recommended
      pair (IMPL-1 hashlib.md5 + IMPL-3 _md5) is genuinely independent at
      the level of the MD5 compression function implementation.
    evidence:
      impl_1_hashlib_md5:
        runtime_type: _hashlib.HASH
        runtime_module: _hashlib
        shared_library_dependencies:
          - "/opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib (OpenSSL 3.6.3)"
          - "/usr/lib/libSystem.B.dylib"
        underlying_md5: OpenSSL libcrypto MD5 implementation
      impl_3_cpython_md5:
        runtime_type: _md5.MD5Type
        runtime_module: _md5
        shared_library_dependencies:
          - "/usr/lib/libSystem.B.dylib (ONLY — no crypto library)"
        underlying_md5: CPython standalone C MD5 (md5module.c), no OpenSSL dependency
      impl_2_openssl_cli:
        binary: /opt/homebrew/bin/openssl
        shared_library_dependencies:
          - "/opt/homebrew/Cellar/openssl@3/3.6.3/lib/libssl.3.dylib"
          - "/opt/homebrew/Cellar/openssl@3/3.6.3/lib/libcrypto.3.dylib"
          - "/usr/lib/libSystem.B.dylib"
        underlying_md5: OpenSSL libcrypto MD5 (same as IMPL-1)
    pair_determinations:
      hashlib_vs_openssl:
        verdict: NOT_INDEPENDENT
        reason: >-
          Both link the same libcrypto.3.dylib (OpenSSL 3.6.3). They share
          one MD5 implementation. Confirmed: IMPL-1 links
          /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib, IMPL-2 links
          /opt/homebrew/Cellar/openssl@3/3.6.3/lib/libcrypto.3.dylib —
          these resolve to the same library.
      hashlib_vs_cpython_md5:
        verdict: INDEPENDENT
        reason: >-
          IMPL-1 (hashlib.md5) uses OpenSSL libcrypto via _hashlib; IMPL-3
          (_md5) uses CPython's standalone C MD5 linked to libSystem only,
          no crypto library dependency. Different codebases (OpenSSL's
          MD5 vs CPython's md5module.c), confirmed by otool -L showing
          different library dependencies. A bug in OpenSSL's MD5 would not
          affect _md5 and vice versa.
      openssl_vs_cpython_md5:
        verdict: INDEPENDENT
        reason: openssl links libcrypto; _md5 does not.
    recommended_pair_assessment: >-
      The recommended pair (IMPL-1 hashlib.md5 + IMPL-3 _md5) IS
      independent. The independence is at the MD5 compression function
      level: OpenSSL's MD5 vs CPython's standalone C MD5, from different
      codebases, with different library dependencies. Both share the
      CPython runtime and build toolchain, but the MD5 implementations
      themselves are from independent sources. This is sufficient for the
      certificate re-verification purpose in BCP-1.
    not_inherited_from_producer: >-
      This determination was made independently by running otool -L on both
      shared libraries and by inspecting the runtime type of hashlib.md5
      objects (_hashlib.HASH, not _md5.MD5Type). The producer's claim is
      confirmed, but this verdict rests on my own evidence, not on
      inheriting the producer's assertion.

  # ===================================================================
  # CHECK 3: THROUGHPUT REPRODUCIBILITY
  # ===================================================================
  check_3_throughput:
    verdict: PARTIAL_PASS
    basis: >-
      Re-ran the recorded throughput commands where bounded within budget.
      IMPL-1 throughput is reproducible within 1%. IMPL-2 timing varies
      due to process spawn overhead (single CLI invocation) but produces
      the same output digest. IMPL-3 throughput was not measured by the
      producer and has no command to re-run.
    impl_1_hashlib:
      recorded_command: >-
        1000 iterations of hashlib.md5(1024*1024 zero bytes, usedforsecurity=False)
      recorded_wall_clock_seconds: 1.230
      recorded_throughput_gbps: 0.853
      rerun_wall_clock_seconds: 1.239
      rerun_throughput_gbps: 0.847
      reproducibility: >-
        Reproducible within 1% (1.239s vs 1.230s; 0.847 vs 0.853 Gbps).
        The small difference is normal run-to-run variation.
    impl_2_openssl:
      recorded_command: >-
        openssl dgst -md5 /tmp/md5_input.bin (100MB zeros, 1 invocation)
      recorded_wall_clock_seconds: 0.155
      recorded_throughput_mbps: 647.174
      rerun_wall_clock_seconds: 0.238
      rerun_throughput_mbps: 440.0
      output_digest_match: true
      output_digest: 2f282b84e7e608d5852449ed940bfc51
      reproducibility: >-
        Output digest matches exactly. Timing is NOT exactly reproducible
        (0.238s vs 0.155s) due to process spawn overhead, filesystem I/O,
        and system load variability inherent in single-invocation CLI
        timing. The recorded value of 0.155s may have excluded spawn
        overhead or been measured under different load. This is a known
        characteristic of single-invocation CLI timing, not a defect in
        the implementation. The producer disclosed this as "single 100MB
        invocation only; no streaming throughput measurement."
    impl_3_cpython_md5:
      recorded_command: "not measured in this task"
      recorded_wall_clock_seconds: null
      reproducibility: >-
        NOT RE-RUN: the producer did not measure IMPL-3 throughput, so
        there is no recorded command to reproduce. Named as an open item
        (SC-5: not attempted, not recorded as tried). IMPL-3's throughput
        is not needed for the gate package's stated purpose (certificate
        re-verification does not require throughput), but it would be
        useful for cost modeling in later batches.

