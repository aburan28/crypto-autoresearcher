        action: >-
          In a superseding record, add the observed openssl empty-string
          digest (d41d8cd98f00b204e9800998ecf8427e) to the test vector
          entry, and move the 100MB-zeros digest to the throughput
          measurements section where it belongs.
      - id: DEFECT-3
        severity: moderate
        location: >-
          coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-bde128/acquisition-report.yaml
          (budget block, halt_statement)
        description: >-
          TASK-20260810-bde128 exceeded its declared 450s wall-clock budget
          by approximately 6x (measurable elapsed ~2855s, plus an unmeasured
          orientation/reading phase) and did NOT halt at the ceiling as
          SC-7 requires. The producer self-disclosed this as an SC-7
