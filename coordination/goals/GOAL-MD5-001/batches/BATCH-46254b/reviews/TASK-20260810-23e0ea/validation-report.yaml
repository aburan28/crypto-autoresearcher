      b_quarantine_payload_sha256:
        verdict: PASS
        basis: >-
          Recomputed sha256 of
          coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
          from committed bytes. Computed: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5.
          Recorded in MANIFEST.yaml and kn-lit-manifest.json: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5.
