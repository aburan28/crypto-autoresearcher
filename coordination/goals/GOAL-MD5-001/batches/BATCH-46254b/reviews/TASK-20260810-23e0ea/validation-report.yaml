          appears to be a confusion between 1000 iterations of 1 MiB and
          1 GiB total.
        action: >-
          Correct input_bytes/total_bytes to 1048576000 in a superseding
          record. The throughput figure is already correct and needs no
          change.
      - id: DEFECT-2
        severity: minor
        location: >-
          coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-3e0793/test-vector-report.json
          (vectors[0], observed_openssl_dgst_100mb_zeros field) AND
