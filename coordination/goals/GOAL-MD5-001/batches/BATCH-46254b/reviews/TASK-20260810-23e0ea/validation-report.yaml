      c_manifest_paths_exist_with_sha256:
        verdict: PASS
        basis: >-
          All 6 paths enumerated in kn-lit-manifest.json exist at 0c1192f21
          with matching sha256 (6/6 recomputed and matched):
          KN-LIT-87e00e.md (7c3cac86...), KN-LIT-582d77.md (f0a66d06...),
          KN-LIT-328239.md (f1aee4d8...), KN-LIT-d3ec68.md (e52638c9...),
          MD5-COLLISION-PATH-WANG-2004-199.yaml (e44a3fed...),
          MANIFEST.yaml (6ae0a58c...). All MATCH.
      d_bcp1_marker_on_payload:
        verdict: PASS
        basis: >-
          The quarantined payload file's first top-level key is
          `bcp1_quarantine: true` and its second key is
          `bcp1_marker: "BCP-1-QUARANTINED-PAYLOAD"`. This matches BCP-1's
          exact marker specification (firewall.quarantine.marker.file_level).
      e_pre_registered_expected_answer_digest:
        verdict: PASS
        basis: >-
          Recomputed pre_registered_expected_answer_digest under MANIFEST's
          stated canonicalization: sha256 of UTF-8 encoding of
          yaml.safe_dump(payload["path"], sort_keys=True,
          default_flow_style=False). Recomputed:
          2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
          Recorded: 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002.
          MATCH. The canonicalization excludes the literal_pairs_as_extracted
          block (which has extraction caveats) and serializes only the clean
          path block (differential characteristic, initial value, digests).
      f_corpus_staging_exclusion:
        determination: ENFORCEABLE
        basis: >-
          Read kb/src/crypto_kb/ingest/repo_corpus.py in full. The RULES
          tuple (line 261) defines 21 explicit glob patterns. The staging
          function iter_staged() iterates over repo_root.glob(rule.glob)
          for each rule — it can only stage files matching a declared glob.
          NONE of the 21 globs match any path under coordination/ (the
          globs cover knowledge/literature/, knowledge/techniques/,
          knowledge/findings/, knowledge/open-problems/, ledger/,
          experiments/, docs/, and inputs/ only). The include parameter
          can only RESTRICT (filter out files not in the allowed set), not
          ADD files outside the rules. Therefore crypto-kb stage-repo
          structurally cannot stage anything under
          coordination/goals/GOAL-MD5-001/quarantine/ into the retrieval
          corpus. This is a structural property of the committed source
          code, verified by reading it, not an assumption or a declaration.
        residual_risks_not_about_current_code_path:
          - >-
            A future change to RULES could add a quarantine-matching glob.
            Nothing in the code prevents this; BCP-1 is not a technical
            control on future edits to repo_corpus.py.
          - >-
            An agent could manually copy quarantined content into
            knowledge/literature/. This is guarded by BCP-1 INV-6 and the
            snapshot task's halt-and-report duty, not by any file-system
            mechanism.
        bcp1_variable_name_inaccuracy: >-
          BCP-1 (firewall.quarantine.corpus_exclusion_is_structural_not_only_declared)
          refers to the staging rules variable as "STAGING_RULES" and cites
          line range "262-268". The actual variable name in repo_corpus.py
          is `RULES` (line 261); the knowledge/ rules span lines 262-269.
          The substance of BCP-1's claim is correct, but the variable name
          is inaccurate. See DEFECT-4.
    firewall_ordering:
      verdict: PASS
      basis: >-
        Verified from git history: BCP-1 was first committed at f5087686e
        (TASK-20260810-26d0d5, "author BCP-1 blind-calibration protocol").
