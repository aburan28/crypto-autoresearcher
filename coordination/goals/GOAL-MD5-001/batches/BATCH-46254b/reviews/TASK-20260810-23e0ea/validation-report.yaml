  # ===================================================================
  # CHECK 5: FIREWALL INTEGRITY IN COMMITTED TREE AT 0c1192f21
  # ===================================================================
  check_5_firewall_integrity:
    verdict: PASS
    sub_checks:
      a_no_path_data_in_kn_lit:
        verdict: PASS
        basis: >-
          Read all four KN-LIT entries in full. None contains differential
          characteristic, message-block values, or colliding pair data.
          KN-LIT-87e00e (the collision-path entry) explicitly states "This
          entry carries NO path data" and references the quarantined
