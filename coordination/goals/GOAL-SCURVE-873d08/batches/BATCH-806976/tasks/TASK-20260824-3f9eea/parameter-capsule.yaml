  # ---------------------------------------------------------------------------
  # 3. INDEPENDENCE ANALYSIS - THE LOAD-BEARING CAVEAT
  # ---------------------------------------------------------------------------
  independence_analysis:
    statement: >-
      M-221 IS A CURVE THAT THE SAFECURVES WORK ITSELF INTRODUCED AND NAMED
      (index.txt lists it with details "2013 Aranha-Barreto-Pereira-Ricardini
      (formerly named Curve2213)"; rigid.txt states its generation rule). The
      staged mirror IS the SafeCurves web site. The goal's intake table is a
      transcription of that same web site. THEREFORE THE MIRROR AND THE INTAKE
      ARE NOT INDEPENDENT SOURCES, and the fact that they agree on all eleven
      cells and on the tuple is NOT CORROBORATION. It is one source seen twice.
      Any later record that cites mirror/intake agreement as confirmation is
      making a circular claim.
    what_independence_is_actually_available:
      - route: RECOMPUTATION FROM (p, A, B) ALONE
        why_independent: >-
          Mathematics, not testimony. Every dependent quantity - the base point's
          order, the cofactor, the trace, the CM discriminant, the embedding
          degree, the twist order, the 2-torsion count, Elligator-2
          applicability - is a FUNCTION of (p, A, B) and can be recomputed
          without consulting any document. Recomputation that agrees with the
          mirror IS genuine corroboration of the mirror's derived cells, because
          the two productions share no source. THIS IS THE PRIMARY INDEPENDENCE
          MECHANISM OF THE ENTIRE AUDIT PLAN and it is why every lane below is
          specified as a recomputation rather than a comparison.
        residual_dependence: >-
          The three seed values p, A, B themselves remain single-sourced to
          SafeCurves. Recomputation cannot corroborate THEM. It can only show
          that the rest of the table follows from them. A transcription error in
          p, A or B would produce a self-consistent but wrong audit of a
          different curve - which is exactly what the digit-perturbation null
          control (N3) exists to detect the instrument's blindness to.
      - route: ABPR eprint 2013/647
        why_independent: >-
          A separate document by the curve's originators, not the SafeCurves
          site. Would corroborate p, A, B themselves.
        status: unretrieved (see unretrieved_sources)
      - route: A THIRD-PARTY CURVE DATABASE
        why_independent: Different publisher, different transcription chain.
        status: >-
          NOT ATTEMPTED in this session and NOT NAMED here, because naming a
          database I did not retrieve would invite a later reader to treat the
          name as a checked source. A successor task should identify one by
          retrieval, not from memory.
    internal_cross_checks_within_the_mirror:
      caveat: >-
        These are CONSISTENCY checks inside a single source. They can detect a
        typo on one SafeCurves page against another SafeCurves page. They cannot
        detect a systematic error common to the site. They are recorded because
        a failed internal cross-check would be decisive, not because passing one
        is corroboration.
      checks_available:
        - transfer.txt states the embedding degree as (l-1)/2 AND prints its
          value; primeproofs.txt independently lists l itself. The two must be
          consistent.
        - disc.txt prints the factorization of D whose three large prime factors
          (565665984379; 504842927415879955942747;
          255061103803346185973548526989) all appear in the primeproofs.txt
          prime list for M-221. Consistent by construction of verify.sage, which
          verify.txt says emits "all prime divisors of ... t^2-4p".
        - equation.txt prints B(A^2-4) = 13700702496 while equation.txt also
          prints A = 117050.
        - rho.txt (2^108.8), twist.txt (twist rho 2^109.3, combined 2^107.3) and
          the sizes of l and l' must be mutually consistent.

