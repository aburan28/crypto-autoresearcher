      note: >-
        SafeCurves does not print its own numeric embedding-degree threshold on
        this page; it says it takes the Brainpool "overkill approach". The audit
        plan therefore evaluates the transfer cell against the EXPLICIT Brainpool
        bound k >= (l-1)/100 and reports the SEC1/X9.62 k >= 20 bound alongside,
        rather than inventing a SafeCurves number.
    twist_combined:
      verbatim: 'Cost for combined attack above 2^100?'
      source: pages/twist.txt
    ladder:
      verbatim_requirement: >-
        SafeCurves requires curves to support simple, fast, constant-time
        single-coordinate single-scalar multiplication, avoiding conflicts
        between simplicity, efficiency, and security.
      verbatim_nonquantification: >-
        At this time there are no examples close enough to the edge to warrant
        quantification of "much".
      source: pages/ladder.txt
      note: >-
        THE LADDER CRITERION IS EXPLICITLY UNQUANTIFIED BY ITS OWN SOURCE. The
        audit plan does not pretend otherwise; L-LADDER supplies a measurable
        proxy and labels it a proxy.
    complete:
      verbatim: >-
        SafeCurves requires curves to support simple, fast, complete,
        constant-time single-coordinate single-scalar multiplication. This
        includes the SafeCurves ladder requirement but goes further by requiring
        completeness. SafeCurves also requires curves to support simple, fast,
        complete, constant-time multi-scalar multiplication.
      key_condition_verbatim: >-
        2006 Bernstein had shown a more limited form of completeness for the
        Montgomery ladder on Montgomery curves y^2=x^3+Ax^2+x with a unique point
        of order 2, i.e., with A^2-4 not a square.
      source: pages/complete.txt
    ind:
      verbatim: >-
        "Elligator 2" works for any odd prime and any curve of the form
        y^2=x^3+Ax^2+Bx with nonzero AB(A^2-4B). ... More generally, it includes
        all curves with points of order 2, except for j-invariant 1728.
      source: pages/ind.txt
    field:
      verbatim: 'However, SafeCurves requires prime fields.'
      source: pages/field.txt
    verification_method:
      verbatim: >-
        Third parties are encouraged to independently verify the SafeCurves
        criteria, preferably using a wide variety of verification tools to
        protect against the possibility of bugs (or malicious behavior!) in those
        tools.
      source: pages/verify.txt
      note: >-
        verify.txt documents verify.sage and states the primes file contains "all
        prime divisors of p, the curve order p+1-t, the twist order p+1+t, and
        t^2-4p; and, recursively, all prime divisors of q-1 for each q in the
        list", with Pocklington proofs emitted per prime. This defines the
        certificate architecture the audit plan reuses.

  # ---------------------------------------------------------------------------
  # 5. PREREGISTERED COMPARISON TARGET (INTAKE) - NOT EVIDENCE
  # ---------------------------------------------------------------------------
  preregistered_intake_cells:
    provenance: user_supplied_unverified
    comparison_target_only: true
    is_evidence: false
    cells:
      field: true
      equation: true
      base: true
      rho: true
      transfer: true
      disc: true
      rigid: true
      ladder: true
      twist: true
      complete: true
      ind: true
    expected_safe: true
  mirror_cells_for_the_same_eleven:
    source: pages/index.txt (criterion table)
    values_read: >-
      Safe? True; field True; equation True; base True; rho True; transfer True;
      disc True; rigid True; ladder True; twist True; complete True; ind True.
    relationship_to_intake: >-
      IDENTICAL, AND THAT IS EXPECTED AND UNINFORMATIVE. The intake was
      transcribed from this table. See independence_analysis. This capsule
      records the match as a TRANSCRIPTION CHECK ON THE INTAKE (it shows the user
      copied the row correctly), which is a real if minor result, and as NOTHING
      ELSE.

  # ---------------------------------------------------------------------------
  # 6. CONFLICTS AND GAPS
  # ---------------------------------------------------------------------------
  unresolved_conflicts:
    - id: C1
      severity: none_detected
      statement: >-
        NO NUMERIC OR BOOLEAN CONFLICT was found between the intake tuple and the
        staged mirror, on any of: curve name, equation, modulus closed form,
        origin attribution, or the eleven cells.
      why_this_is_weak: >-
        Because the two are not independent. A conflict would have been
        informative (it would have proved a transcription error); the absence of
        one proves only that no transcription error of that kind occurred.
      goal_pause_condition_check: >-
        The goal's pause condition "Primary or authoritative sources leave an
        unresolved conflict in the named curve's parameter tuple" is NOT
        triggered by C1.
  open_gaps:
    - id: G1
      severity: material
      statement: >-
        THE RIGIDITY TRANSCRIPT IS UNDER-SPECIFIED BY ITS OWN SOURCE. rigid.txt
        says "A > 2 is as small as possible" but does NOT state the admissibility
        predicate that "possible" ranges over. Without that predicate the claim
        is not reproducible as written: minimality is only defined relative to a
        constraint set.
      consequence: >-
        The rigid cell cannot be fully reproduced from the staged mirror alone.
        L-RIGID splits into a reproducible Tier 1 and a deferred Tier 2.
      successor_condition: >-
        Retrieve raw bytes of eprint 2013/647 (see unretrieved_sources), which is
        the likely home of the constraint set; OR run L-RIGID Tier 2 against
        explicitly declared candidate constraint sets S1..S3 and report which, if
        any, has 117050 as its minimum.
    - id: G2
      severity: minor
      statement: >-
        THE TWO THRESHOLDS ON THE RHO PAGE ARE NOT EQUIVALENT. The prose requires
        l >= 2^200; the table column asks whether the rho cost 0.886*sqrt(l) is
        above 2^100. Since 0.886*sqrt(2^200) is about 2^99.83, l >= 2^200 does not
        strictly imply rho cost >= 2^100.
      consequence: >-
        A "rho: True" verdict is threshold-dependent at the boundary. Irrelevant
        at M-221's size (l near 2^218, far from the boundary) but it must be
        stated, because a later record that cites "rho: True" as if a single
        threshold existed would be citing an ambiguity as a fact.
      successor_condition: >-
        L-RHO reports BOTH quantities and both verdicts separately and never
        collapses them.
    - id: G3
      severity: minor
      statement: >-
        SAFECURVES PRINTS NO NUMERIC EMBEDDING-DEGREE THRESHOLD OF ITS OWN on
        transfer.txt; it adopts "the overkill approach" of Brainpool by reference.
      consequence: >-
        The transfer verdict must be stated against a NAMED external bound.
      successor_condition: >-
        L-TRANSFER evaluates against Brainpool k >= (l-1)/100 and SEC1/X9.62
        k >= 20, both quoted from transfer.txt, and reports each separately.
    - id: G4
      severity: minor
      statement: >-
        THE LADDER AND COMPLETE CRITERIA ARE QUALITATIVE IN THEIR SOURCE.
        ladder.txt explicitly declines to quantify "much faster"/"much more
        concise".
      consequence: >-
        Neither cell can be reproduced as a certified inequality. Only a declared
        proxy can be measured.
      successor_condition: >-
        L-LADDER measures field-multiplications-per-scalar-bit against the ONE
        number ladder.txt does print (the Brier-Joye ladder "requires 19 field
        operations per bit") and labels the result a proxy comparison.
    - id: G5
      severity: material
      statement: >-
        THE M-221 TUPLE IS SINGLE-SOURCED. p, A, B, x1, y1 rest entirely on
        SafeCurves. Recomputation can validate everything derived FROM them but
        cannot validate THEM.
      consequence: >-
        Every downstream verdict in this campaign is conditional on the seed
        triple being transcribed correctly from a source that has no independent
        confirmation in this repository.
      successor_condition: Same as G1 - retrieve eprint 2013/647 raw bytes.

  transcription_integrity:
    method_used: >-
      Every digit string above was read with the Read tool from raw staged text
      files. No digit string passed through WebFetch, WebSearch, or recollection.
    residual_risk: >-
      MODEL TRANSCRIPTION ERROR when copying a 66-digit string from a read buffer
      into this file. This risk is real and is NOT eliminated by the raw-byte
      sourcing.
    how_the_plan_controls_it: >-
      Control N3 (digit-perturbation null) in audit-plan.yaml. The executor
      re-reads each value from the mirror file itself, hashes it, and compares
      against this capsule byte-for-byte BEFORE any lane runs; and separately
      confirms that perturbing a single digit of l or y1 makes the on-curve and
      order checks FAIL. A capsule value that does not re-read identically is a
      transcription defect in THIS FILE and must be superseded by a new capsule,
      never silently corrected.
