audit_plan:
  task_id: TASK-20260824-3f9eea
  goal_id: GOAL-SCURVE-873d08
  question_id: RQ-SCURVE-7af163
  batch_id: BATCH-806976
  produced_by: idea-generator
  produced_at: '2026-08-25'
  curve: M-221
  capsule: coordination/goals/GOAL-SCURVE-873d08/batches/BATCH-806976/tasks/TASK-20260824-3f9eea/parameter-capsule.yaml

  claim_status: >-
    A PLAN. Nothing here has been run. No curve attack was executed in producing
    it. It authorizes no conclusion and makes no statement about whether M-221 is
    safe, unsafe, vulnerable, or free of vulnerabilities. Predictions below are
    PREREGISTERED EXPECTATIONS stated so that confirming them is a controlled
    result rather than a retrospective rationalization; they are not findings.

  # ===========================================================================
  # 0. DESIGN SPINE
  # ===========================================================================
  design_spine:
    principle: >-
      RECOMPUTE, DO NOT COMPARE. Because the staged mirror and the user intake
      are the same source seen twice (capsule.independence_analysis), comparing
      them corroborates nothing. The only independence available is to recompute
      every derived quantity from the seed triple (p, A, B) alone and then check
      the recomputation against the tabulated value. Every lane is therefore
      written as "derive X from (p,A,B); THEN compare to the tabulated X", never
      as "check that the table is self-consistent".
    tracked_object:
      name: THE CURVE INVARIANT VECTOR
      definition: >-
        V = (p, A, B, P, l, h, t, D, f, l', h', k, k', #E[2], #E[4], j).
      lossy_projection_test: >-
        GENUINELY LOSSY, and lossy in the right way. V discards the entire point
        set of E(F_p) - roughly 2^221 points - retaining a few dozen integers.
        What is discarded is discarded COMPATIBLY with the operations that matter
        to this audit: every entry except (A, B, P) is invariant under
        F_p-isomorphism and under model conversion (Montgomery <-> short
        Weierstrass <-> Edwards), so V propagates deterministically when the
        model changes, without reference to the point set. (A, B, P) are the
        model-dependent coordinates and are retained precisely so the conversion
        maps of diagnostic D6 can be checked. V is therefore NOT a change of
        coordinates.
      where_it_dissolves: >-
        V stops determining anything once the base field or the prime subgroup
        changes: k, D and h are defined relative to (p, l) and must be recomputed
        after base change. That boundary is exactly the scope statement of this
        audit.
      taxonomy_caveat: >-
        This program has NO written object enumeration for the ECDLP
        (KN-OPEN-019). V is used here as an audit bookkeeping object, not as a
        claim about the space of attack objects. Any family-to-object mapping
        implied below is a sketch, not a taxonomy.
    certificate_architecture:
      source: >-
        Reused from inputs/SAFECURVES-20260825/pages/verify.txt
        (sha256 9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79),
        which states verify.sage's primes file holds "all prime divisors of p,
        the curve order p+1-t, the twist order p+1+t, and t^2-4p; and,
        recursively, all prime divisors of q-1 for each q in the list", with
        Pocklington proofs emitted per prime.
      what_this_buys: >-
        The M-221 block of pages/primeproofs.txt already lists that closed prime
        set. The executor does not have to FACTOR anything large: it can VERIFY a
        supplied factorization (multiply the factors, compare) and then verify
        each factor's primality by a Pocklington chain that bottoms out in the
        same list. Verification cost is polynomial and small; production cost was
        paid upstream. Where the supplied list does not close a factorization,
        the lane says so and falls back to a declared BOUND, never to a guess.
      honesty_note: >-
        Verifying SafeCurves' own factor list is verification of an artifact
        SafeCurves produced. It detects arithmetic error and transcription error.
        It does NOT detect a shared conceptual error. Stated per lane.
    claim_tier_discipline: >-
      Per docs/claims-and-verification.md, every lane emits either (a) a
      CERTIFICATE independently re-verifiable by a third party, or (b) an
      EXPLICIT BOUND with its true verification cost stated. A lane that can
      produce neither is DEFERRED with a reason and a successor condition. No
      lane emits a bare assertion.
    prohibitions_restated:
      - No curve attack is run. Rho/kangaroo COSTS are computed as formulas, never
        executed against M-221.
      - No live private key is used, requested, stored, or derived. All scalars
        are locally generated randomness in generated controls only.
      - Infrastructure error, timeout, or budget stop is an OPERATIONAL
        observation and is recorded as such; it is never negative mathematical
        evidence and never converts a lane's verdict to False.
      - No lane's output is a safety or vulnerability conclusion about M-221.

  # ===========================================================================
  # 1. CONTROLS - DEFINED BEFORE ANY INTERPRETATION, RUN BEFORE ANY BELIEF
  # ===========================================================================
  controls:
    blocking_rule: >-
      THE CONTROL BLOCK IS A HARD GATE. Controls P1-P3, M1-M2 and N1-N3 run
      BEFORE any M-221 lane is interpreted, through the IDENTICAL code path. If
      any positive control fails to fire, or any null control fires, the
      instrument has no resolving power and EVERY M-221 output from that lane is
      VOID and must be reported as void rather than as a result.
    positive_controls:
      - id: P1
        object: Anomalous (the SafeCurves illustration curve)
        parameters_source: >-
          pages/field.txt (p), pages/equation.txt (short Weierstrass a, b),
          pages/base.txt (x1,y1), pages/disc.txt (t = 1, D = -11), all
          'retrieved (staged mirror SAFECURVES-20260825)'. Parameters still
          require the same on-curve/order self-verification as M-221 before use;
          an unverified control is not a control.
        must_fire_on: [L-TRANSFER (additive), L-DISC, L-RIGID-negative-sense]
        required_behaviour: >-
          The additive-transfer test must return TRIGGERED (l equals p) and the
          disc test must return |D| = 11, far below 2^100. The mirror tabulates
          this curve's transfer cell as False and its disc cell as False.
        status_note: >-
          A POSITIVE CONTROL CANDIDATE, per the goal's claim boundary: this is a
          reproduction of long-published behaviour (Semaev 1998, Satoh-Araki
          1998, Smart 1999, as cited on pages/transfer.txt), NOT a newly
          discovered attack.
        if_it_does_not_fire: L-TRANSFER and L-DISC outputs for M-221 are void.
      - id: P2
        object: BN(2,254)
        parameters_source: >-
          pages/field.txt, pages/equation.txt (y^2 = x^3+0x+2),
          pages/transfer.txt (embedding degree 12), pages/disc.txt (D = -3), all
          'retrieved (staged mirror SAFECURVES-20260825)'; same self-verification
          requirement as P1.
        must_fire_on: [L-TRANSFER (multiplicative), L-DISC, D3, D4]
        required_behaviour: >-
          The embedding-degree routine must return EXACTLY 12 and flag the
          multiplicative transfer; the disc routine must return D = -3.
        status_note: Same claim boundary as P1 - reproduction, not discovery.
        if_it_does_not_fire: L-TRANSFER, L-DISC, D3, D4 outputs for M-221 are void.
      - id: P3
        object: NIST P-224 (as tabulated by SafeCurves)
        parameters_source: pages/field.txt, pages/equation.txt, pages/base.txt
        must_fire_on: [L-LADDER, L-COMPLETE, L-IND]
        required_behaviour: >-
          Cofactor 1 and zero points of order 2 (pages/ladder.txt, pages/complete.txt)
          must make the Montgomery-conversion test return NOT AVAILABLE, the
          2-torsion count return 0, and the Elligator-2 applicability test return
          NO. The mirror tabulates ladder/complete/ind as False for this curve.
        note: >-
          These three cells are ECC-beyond-ECDLP properties. A False here is NOT
          an ECDLP break and must never be reported as one (goal claim boundary).
        if_it_does_not_fire: L-LADDER, L-COMPLETE, L-IND outputs for M-221 are void.
    parameter_matched_negative_controls:
      - id: M1
        name: SAME PRIME, DIFFERENT A - THE SHARPEST NEGATIVE
        construction: >-
          Hold p = 2^221 - 3 and B = 1 fixed. Search A ascending for the smallest
          A > 2 such that A^2 - 4 IS a square mod p (Legendre symbol +1).
          Everything about the field is identical to M-221; only the trace and
          the 2-torsion structure differ.
        matching_assumptions_stated: >-
          Identical field, identical field arithmetic, identical code path,
          identical Montgomery shape, identical B. NOT matched on: curve order,
          cofactor, trace, D, embedding degree, twist order - these cannot be
          matched while changing A, and the control does not pretend to.
        expected_behaviour: >-
          L-FIELD and L-EQ must still PASS (the field and the nonzero
          discriminant condition do not depend on the Legendre symbol);
          L-COMPLETE must report 3 points of order 2 and return NOT COMPLETE; the
          Edwards d = (A-2)/(A+2) must be a square, i.e. the Edwards model is not
          complete.
        what_it_discriminates: >-
          It proves the instrument measures A, not p. An instrument that returns
          the same verdicts for M1 as for M-221 is reading the prime and nothing
          else, and every ECC-beyond-ECDLP verdict it produced is worthless.
        cost: one Legendre symbol per candidate A; expected under 10 s total.
      - id: M2
        name: SAME PRIME, SMALL-COFACTOR-VIOLATING A
        construction: >-
          Hold p fixed; find (by SEA if available, else by a declared bounded
          search) an A whose curve order has a cofactor larger than 8, or whose
          twist order has a large smooth part.
        expected_behaviour: >-
          L-TWIST and D2 must report a materially cheaper combined attack than
          for M-221, and the twist cell must return False.
        deferral_clause: >-
          IF NO SEA IS AVAILABLE IN THE EXECUTION ENVIRONMENT, M2 IS DEFERRED,
          NOT SKIPPED. Reason: constructing this control requires point counting
          at 221 bits. Successor condition: an executor session with Sage/PARI.
          Until then L-TWIST's resolving power is demonstrated by P1/P2 only and
          the lane must say so.
    null_controls:
      - id: N1
        name: SAME-SHAPE SYNTHETIC NULL
        construction: >-
          Generate a random 221-bit prime p_null (deterministic seed recorded)
          and a random A_null in (2, p_null) with A_null congruent to 2 mod 4.
          Run the ENTIRE pipeline on (p_null, A_null, 1) with a base point
          generated locally.
        structure_deliberately_removed: >-
          The designed structure - the special prime shape 2^221-3, the minimal
          A, the cofactor-8/twist-cofactor-4 order pair - is gone. What remains is
          a generic Montgomery curve.
        expected_behaviour_preregistered: >-
          rho, transfer and disc lanes are expected to PASS generically (a random
          curve almost always has huge k and huge |D|); rigid is expected to FAIL
          (no transcript exists); the order factorization is expected NOT to have
          the form 8*prime with twist 4*prime.
        what_it_establishes: >-
          THE BASE RATE OF PASSING BY ACCIDENT. It tells the campaign which cells
          carry information about M-221's DESIGN and which are satisfied by
          essentially any curve. A cell that a random curve passes is a weak
          cell, and any later synthesis that treats all eleven cells as equally
          informative is wrong.
        if_the_null_fires: >-
          If N1 reproduces M-221's cofactor structure or its rigidity transcript,
          the instrument is not reading the curve; all structural verdicts void.
      - id: N2
        name: SHUFFLED-DIGIT SAME-SHAPE NULL
        construction: >-
          Take M-221's own digit strings and permute the digits of A (keeping
          length), then re-derive. Field unchanged.
        expected_behaviour: >-
          Every derived quantity changes; no derived quantity should coincide
          with M-221's tabulated value. A coincidence indicates the derivation is
          not actually consuming A.
      - id: N3
        name: DIGIT-PERTURBATION NULL - THE TRANSCRIPTION INSTRUMENT'S OWN CONTROL
        construction: >-
          (a) Re-read every digit string in parameter-capsule.yaml directly from
          its named mirror file and compare byte-for-byte; record any mismatch as
          a capsule defect requiring supersession. (b) Then deliberately flip one
          decimal digit of l, and separately of y1, and re-run the on-curve test
          and the order test.
        expected_behaviour: >-
          (a) all values re-read identically; (b) EVERY perturbation causes the
          on-curve or the order check to FAIL.
        why_this_control_exists: >-
          The coordinator's mid-task warning documents a real numeric-corruption
          channel in this environment (a summarizer collapsing three distinct
          constants into one, and reporting a cofactor of 2 where raw bytes say
          4). This audit's entire foundation is a hand-copied 66-digit string. N3
          is the check that the pipeline would NOTICE a corrupted digit. If a
          perturbed l still passes the order test, the order test is not running.
        cost: seconds.

  # ===========================================================================
  # 2. THE ELEVEN CRITERION LANES
  # ===========================================================================
  criterion_lanes:

    # ---------------- CATEGORY: basic parameter requirements ----------------
    - id: L-FIELD
      criterion: field
      category: basic_parameter_requirements
      priority: 2
      mechanism: >-
        Parse p from three independent representations printed on pages/field.txt
        - the decimal string, the hex string, and the closed form 2^221-3 - and
        assert three-way integer equality. Then establish primality: verify the
        Pocklington chain for p using the M-221 prime list from
        pages/primeproofs.txt (which verify.txt states contains all prime
        divisors of p-1 recursively), i.e. verify p-1 = product of listed primes
        with multiplicity, verify each listed prime by the same chain down to
        trial-division-sized primes, and exhibit a Pocklington witness a with
        a^(p-1) = 1 mod p and gcd(a^((p-1)/q) - 1, p) = 1 for each prime q | p-1.
        Finally assert that the field is PRIME, not an extension.
      quantitative_prediction:
        - metric: three-way equality of the p representations
          direction: exact match
          predicted: all three equal
        - metric: bit length of p
          direction: exact
          predicted: 221
        - metric: p mod 4
          direction: exact
          predicted: 1
          why_it_matters: >-
            pages/ind.txt notes Elligator 1 requires p = 3 mod 4; a p = 1 mod 4
            curve must rely on Elligator 2, which is exactly what pages/ind.txt
            tabulates for M-221. This links L-FIELD to L-IND and gives L-IND a
            non-trivial precondition to check rather than a rubber stamp.
        - metric: Pocklington certificate verifies
          direction: boolean
          predicted: true
      certificate_or_bound:
        primary: >-
          POCKLINGTON CERTIFICATE for p. Succinct. Third-party verification cost
          is omega(p-1) modular exponentiations plus the recursive chain - tens of
          exponentiations, milliseconds.
        fallback: >-
          IF THE SUPPLIED PRIME LIST DOES NOT CLOSE THE FACTORIZATION OF p-1, the
          lane emits BPSW plus 64 independent Miller-Rabin bases and records the
          result as PROBABLE PRIME WITH FAILURE PROBABILITY BELOW 4^-64, labelled
          a bound and not a certificate. It does NOT claim primality.
      controls: [N3, N1, M1]
      budget: {cpu_seconds: 120, memory_gb: 0.2}
      stopping_rule: >-
        Stop on certificate success. Stop and fall back at 120 s. Stop
        immediately and mark the lane BLOCKED on any representation mismatch -
        a mismatch invalidates every downstream lane and nothing else may run.
      falsifier: >-
        Any of the three p representations disagreeing; bit length not 221; any
        Pocklington witness failing; a composite witness for p.
      honest_limitation: >-
        Primality of p is a statement about the FIELD. It says nothing whatever
        about the ECDLP on any curve over that field. pages/field.txt itself
        notes "Special primes help index calculus" while arguing ECC avoids index
        calculus - so the special shape 2^221-3 is an efficiency and
        implementation property here, not a security verdict.

    - id: L-EQ
      criterion: equation
      category: basic_parameter_requirements
      priority: 1
      mechanism: >-
        With A = 117050 and B = 1 read off the printed Montgomery equation,
        compute B(A^2-4) mod p and assert it is nonzero - the exact condition
        pages/equation.txt states for a Montgomery curve to be elliptic. Compare
        the integer against the tabulated 13700702496. THEN compute the Legendre
        symbol of A^2-4 mod p by Euler's criterion,
        (A^2-4)^((p-1)/2) mod p. Also compute the j-invariant
        j = 256(A^2-3)^3/(A^2-4) mod p.
      quantitative_prediction:
        - metric: B(A^2-4) as an exact integer
          direction: exact
          predicted: 13700702496
        - metric: Legendre symbol of A^2-4 mod p
          direction: exact
          predicted: -1 (non-residue)
          basis: >-
            PREDICTED, NOT KNOWN. It is the condition pages/complete.txt states
            for the Montgomery ladder to be complete, and pages/complete.txt
            tabulates exactly ONE point of order 2 for M-221, which is equivalent
            to A^2-4 being a non-residue. If the tabulation is right the symbol
            is -1. Computing it tests the tabulation.
        - metric: j-invariant
          direction: exact value, then two inequality checks
          predicted: j is neither 0 nor 1728 mod p
          why_it_matters: >-
            j = 0 or 1728 would mean extra automorphisms and a small-|D| CM
            structure, which feeds D3 (automorphism-adjusted rho) and the
            j-invariant-1728 exception in the Elligator-2 statement on
            pages/ind.txt.
      certificate_or_bound: >-
        FULLY SUCCINCT CERTIFICATE. The integer B(A^2-4), the exponentiation
        result, and j are each re-verifiable in microseconds to milliseconds by a
        third party holding only (p, A, B).
      controls: [M1, N1, N2, N3, P3]
      budget: {cpu_seconds: 5, memory_gb: 0.05}
      stopping_rule: Single deterministic pass; no iteration; no early stop needed.
      falsifier: >-
        B(A^2-4) = 0 mod p (the equation would not define an elliptic curve);
        B(A^2-4) not equal to 13700702496 (conflict with pages/equation.txt,
        adjudicate as a source conflict, do NOT silently prefer either);
        Legendre symbol +1 (DIRECT CONFLICT with pages/complete.txt's tabulated
        count of one point of order 2 - a material, adjudicable conflict);
        j equal to 0 or 1728.
      honest_limitation: >-
        This lane certifies that the printed equation defines an elliptic curve
        and computes three invariants of it. It certifies nothing about hardness.

    - id: L-BASE
      criterion: base
      category: basic_parameter_requirements
      priority: 2
      mechanism: >-
        (1) Verify (x1,y1) = (4, y1) satisfies y1^2 = x1^3 + A*x1^2 + x1 mod p
        exactly. (2) Verify the printed hex and decimal forms of y1 agree. (3)
        Verify P is not the identity and [l]P = O with l taken from
        pages/primeproofs.txt. Because l is claimed prime, these two together
        certify ord(P) = l exactly, with no need to test divisors. (4)
        Independently certify l prime by the Pocklington chain of L-FIELD's
        method. (5) DERIVE THE CURVE ORDER WITHOUT POINT COUNTING using the
        argument printed verbatim on pages/disc.txt: any multiple of l lying in
        the Hasse interval [p+1-2 sqrt p, p+1+2 sqrt p] is unique when
        l > 4 sqrt p; verify by exact integer comparison that l > 4 sqrt p (l is
        near 2^218, 4 sqrt p near 2^112.5) and that 8*l lies in the interval;
        conclude #E = 8*l and t = p + 1 - 8*l. (6) Generate a point of order 8*l
        locally to stand in for the (x0,y0) generator that verify.sage requires
        and that the staged pages do not supply; record it as a GENERATED control
        input, never as a sourced parameter.
      quantitative_prediction:
        - metric: on-curve residue y1^2 - (x1^3+A x1^2+x1) mod p
          direction: exact
          predicted: 0
        - metric: '[l]P'
          direction: exact
          predicted: the identity
        - metric: cofactor h = #E / l
          direction: exact
          predicted: 8
        - metric: derived trace t
          direction: exact
          predicted: '-3509210517603025598879416729141978'
          note: >-
            THIS IS THE SINGLE MOST INFORMATIVE PREDICTION IN THE PLAN. t is
            derived here from (p, A, B, x1, y1, l) with no reference to
            pages/disc.txt, and pages/disc.txt printed t from an entirely
            different computation (Sage point counting). Agreement is real
            corroboration of the derived half of the tuple; disagreement is a
            hard conflict that halts the campaign at the goal's pause condition.
      certificate_or_bound: >-
        CERTIFICATE, in two parts. (a) On-curve: one modular evaluation,
        microseconds to verify. (b) Order: the verifier recomputes [l]P, about
        218 doublings and additions - milliseconds, NOT succinct in the strict
        sense but trivially cheap; the true verification cost is stated rather
        than hidden. (c) The Hasse-uniqueness step is a two-integer-comparison
        proof and is fully succinct.
      controls: [N3, N1, N2, P1]
      budget: {cpu_seconds: 60, memory_gb: 0.2}
      stopping_rule: >-
        Deterministic; stop on completion. If [l]P is not the identity, STOP THE
        WHOLE PLAN and report a blocking conflict; do not continue to other lanes
        on a tuple that failed its own self-check.
      falsifier: >-
        Point not on curve; [l]P not the identity; l not prime; 8*l outside the
        Hasse interval; derived t not equal to the tabulated t.
      honest_limitation: >-
        Establishes that P has order l on the stated curve. Says nothing about
        the difficulty of computing discrete logarithms to base P.

    # ---------------- CATEGORY: ECDLP security requirements ----------------
    - id: L-RHO
      criterion: rho
      category: ecdlp_security_requirements
      priority: 4
      mechanism: >-
        Using l as certified in L-BASE, evaluate BOTH of the two distinct
        thresholds the source states, separately and without collapsing them:
        (a) the prose requirement, quoted verbatim from pages/rho.txt,
        "SafeCurves requires l to be at least 2^200" - an EXACT integer
        comparison l >= 2^200; and (b) the table column, "Cost for rho above
        2^100?" - evaluate 0.886*sqrt(l) with interval arithmetic and a stated
        precision, and compare its log2 against the tabulated 2^108.8.
        NO RHO COMPUTATION IS RUN. This is a cost formula evaluation.
      quantitative_prediction:
        - metric: l >= 2^200
          direction: boolean, exact
          predicted: true
        - metric: log2(0.886*sqrt(l))
          direction: interval
          predicted: 108.8 plus or minus 0.1, matching the tabulated 2^108.8
        - metric: gap to threshold
          direction: exact
          predicted: about 18 bits of l above the 2^200 requirement
      certificate_or_bound: >-
        EXACT INTEGER COMPARISON for (a) - fully succinct, verifiable by
        inspection. INTERVAL BOUND for (b) with the rounding mode and precision
        recorded, since 0.886 = sqrt(pi/4) is irrational; the lane emits rational
        lower and upper bounds, not a float.
      controls: [N1, P1]
      budget: {cpu_seconds: 5, memory_gb: 0.05}
      stopping_rule: Single pass.
      falsifier: >-
        l < 2^200; or the computed rho cost outside 2^108.8 plus or minus 0.1;
        or the two thresholds giving OPPOSITE verdicts (which at M-221's size
        would indicate an arithmetic error, since l is 18 bits clear of the
        boundary).
      honest_limitation: >-
        THIS LANE REPRODUCES SAFECURVES' COST MODEL; IT IS NOT AN INDEPENDENT
        LOWER BOUND ON ECDLP. 0.886*sqrt(l) is the expected cost of a specific
        known algorithm. It presumes no better algorithm exists, which is not
        proved by anything here or anywhere. See G2 in the capsule for the
        non-equivalence of the two thresholds.

    - id: L-TRANSFER
      criterion: transfer
      category: ecdlp_security_requirements
      priority: 3
      reuse_declaration: >-
        THIS LANE REUSES AND SPECIALIZES IDEA-20260807-98a970 (Scope Record B:
        certified embedding-degree audit) AS THE GOAL AND RQ REQUIRE. It does NOT
        mint a new mechanism. Specialization: one curve instead of a standardized
        list; the exact-k route is expected to succeed here because the prime
        factorization of l-1 is already published in the M-221 block of
        pages/primeproofs.txt, whereas IDEA-98a970 anticipated a mixed
        exact-and-bounded table because factoring N-1 was its bottleneck.
      mechanism: >-
        ADDITIVE: compare l with p as exact integers (additive transfer applies
        exactly when l = p, per pages/transfer.txt). MULTIPLICATIVE: compute
        k = ord_l(p) exactly by IDEA-98a970's EXACT-k CERTIFICATE - take the
        factorization l-1 = product r_i^e_i from the published prime list, verify
        the product, then run the standard order algorithm dividing out prime
        powers and emit the witness chain. Cross-check the resulting k against
        the tabulated (l-1)/2. Also apply IDEA-98a970's THREE DEGENERATE FLAGS:
        p = 1 mod l; l = p; l | h (equivalently l^2 | #E).
      quantitative_prediction:
        - metric: l - p
          direction: nonzero
          predicted: nonzero and of a different bit length (l near 2^218, p near
            2^221), so the additive transfer does not apply
        - metric: k = ord_l(p)
          direction: exact
          predicted: 210624583337114373395836055367341083963447540990198152472167526445, i.e. (l-1)/2
        - metric: k versus the Brainpool bound (l-1)/100 quoted on pages/transfer.txt
          direction: higher
          predicted: k = (l-1)/2 exceeds (l-1)/100 by a factor of 50
        - metric: k versus the SEC1 and X9.62 bound of 20 quoted on pages/transfer.txt
          direction: higher
          predicted: exceeded by about 216 bits
        - metric: count of degenerate flags raised
          direction: lower
          predicted: 0 of 3
        - metric: representability wall k*ceil(log2 p) in bits
          direction: report
          predicted: about 2^218 * 221 bits - a single element of F_{p^k} cannot
            be written down, which is the NFS-independent obstruction
            IDEA-98a970 insists on stating
      certificate_or_bound: >-
        EXACT-k CERTIFICATE per IDEA-98a970 clause (C): the verified
        factorization of l-1 with a primality proof per factor, plus the witness
        chain. Third-party verification cost is omega(l-1) modular
        exponentiations - a few dozen, milliseconds. FALLBACK if the published
        prime list does not close l-1: the LOWER-BOUND CERTIFICATE k > K with
        K = 10^6, which IDEA-98a970 explicitly requires to be reported as NOT
        succinct - verifying it genuinely costs K multiplications.
      controls: [P1, P2, N1]
      control_note: >-
        P1 and P2 are the load-bearing controls here: an embedding-degree routine
        that has never returned a small k has not been shown to be able to. P2
        must return EXACTLY 12 for BN(2,254) and P1 must flag l = p for Anomalous
        before any M-221 output is believed.
      budget: {cpu_seconds: 300, memory_gb: 0.5}
      stopping_rule: >-
        Stop on exact certificate. Fall back to the K = 10^6 bound at 300 s and
        record the fallback and its true verification cost.
      falsifier: >-
        Any witness in the chain equal to 1 where the certificate requires it not
        to be (k is then smaller than claimed); computed k not equal to (l-1)/2
        (a conflict with pages/transfer.txt to be adjudicated); any of the three
        degenerate flags raised. A raised flag would be a material finding and
        would require independent review before any statement leaves the
        repository.
      honest_limitation: >-
        A large k closes the KNOWN pairing transfers only. It says nothing about
        rho, nothing about index calculus on the curve itself, and nothing about
        transfers not yet invented. Per IDEA-98a970's observation-collision note,
        the verdict is a coarse quantization of a threshold comparison and
        carries no information beyond "k versus the threshold".

    - id: L-DISC
      criterion: disc
      category: ecdlp_security_requirements
      priority: 3
      mechanism: >-
        Using t derived in L-BASE (not read from the page), compute t^2-4p.
        Extract the largest square divisor s^2 by verifying the published
        factorization from pages/disc.txt rather than factoring from scratch:
        multiply the printed factors
        (-1 * 2^2 * 565665984379 * 504842927415879955942747 *
        255061103803346185973548526989) and assert the product equals the printed
        D; then, per the definition printed on pages/disc.txt, set
        D = (t^2-4p)/s^2 when that is 1 mod 4, else 4(t^2-4p)/s^2, and check
        squarefreeness of the odd part against the factor list. Prove each large
        factor prime by a Pocklington chain (all three appear in the M-221 prime
        list of pages/primeproofs.txt). Compare |D| against the threshold quoted
        verbatim from pages/disc.txt, "larger than 2^100", by exact integer
        comparison.
      quantitative_prediction:
        - metric: recomputed t^2-4p versus s^2 * (D or D/4)
          direction: exact
          predicted: equal
        - metric: |D|
          direction: higher than threshold
          predicted: about 2^217.5, exceeding 2^100 by about 117 bits
        - metric: number of listed factors failing primality
          direction: lower
          predicted: 0
        - metric: conductor f = s
          direction: report exactly
          predicted: >-
            UNKNOWN AND DELIBERATELY NOT GUESSED. The printed factorization of D
            shows a factor 2^2, which under the printed definition indicates the
            "otherwise" branch (D = 4*(t^2-4p)/s^2), but s itself is not printed
            on any page read. D5 computes and reports it.
      certificate_or_bound: >-
        CERTIFICATE - verified factorization plus Pocklington proofs plus one
        exact integer comparison. Verification is a handful of multiplications
        and a few dozen exponentiations.
      controls: [P1, P2, N1]
      control_note: >-
        P1 must return |D| = 11 and P2 must return D = -3. A discriminant routine
        that cannot see D = -3 on a BN curve cannot certify D near 2^217 on
        M-221.
      budget: {cpu_seconds: 180, memory_gb: 0.5}
      stopping_rule: >-
        Stop on certificate. If the published factorization does not multiply to
        the printed D, STOP and report a source conflict rather than attempting a
        from-scratch factorization of a 218-bit integer inside this budget.
      falsifier: >-
        Product mismatch; any listed factor composite; |D| at or below 2^100;
        recomputed t^2-4p inconsistent with the derived t.
      honest_limitation: >-
        pages/disc.txt states plainly that small |D| is "not a complete break" and
        that "there is no evidence of serious problems with either small |D| or
        large |D|". The disc criterion is therefore a CONSERVATISM MARGIN, not an
        ECDLP statement, and a large |D| must never be reported as a hardness
        result.

    - id: L-RIGID
      criterion: rigid
      category: ecdlp_security_requirements
      priority: 6
      note_on_category: >-
        The goal record places rigid in ecdlp_security_requirements and this plan
        follows the goal. Substantively, a rigidity failure is a
        PROVENANCE/TRUST property, and the goal's own claim boundary states that
        a failure of rigidity is not by itself an ECDLP break. Both are recorded
        so no later reader has to infer which was meant.
      mechanism_tier_1_reproducible:
        - >-
          Verify "p is largest prime smaller than 2^221" with a SUCCINCT
          certificate: 2^221-1 is composite because 221 = 13*17 implies
          2^13-1 = 8191 divides 2^221-1 - exhibit the quotient, which a third
          party checks with one division; 2^221-2 is even, exhibited by
          inspection; and p = 2^221-3 is prime by L-FIELD's certificate.
          Together these three facts prove the claim exactly.
        - Verify B = 1 as printed.
        - >-
          Verify that A = 117050 is ADMISSIBLE under a declared constraint set -
          A > 2, A congruent to 2 mod 4, #E = 8*prime, #E_twist = 4*prime, both
          primes certified - using the quantities certified in L-BASE and L-TWIST.
      mechanism_tier_2_deferred:
        claim_to_test: >-
          "A > 2 is as small as possible", i.e. NO admissible A in the open
          interval (2, 117050).
        why_deferred: >-
          Admissibility requires the curve order and twist order for each
          candidate A, i.e. SEA point counting at 221 bits. There are about
          29000 candidates congruent to 2 mod 4 below 117050. Pure-Python SEA at
          this size is not feasible inside this campaign's budget, and no cheap
          filter is known that decides "order is 8*prime" without counting. THIS
          IS A CAPABILITY DEFERRAL, NOT A NEGATIVE RESULT.
        second_reason_deferred: >-
          Gap G1 in the capsule - pages/rigid.txt does NOT state the
          admissibility predicate that "possible" quantifies over, so minimality
          is not even well posed from the staged sources alone.
        successor_condition: >-
          (i) Raw bytes of eprint 2013/647 staged under inputs/ with a sha256, to
          fix the constraint set S; AND (ii) an executor session with Sage or
          PARI SEA. Then run a BOUNDED ascending enumeration to a declared A0 and
          report the PARTIAL result honestly: "no admissible A in (2, A0)", which
          is a genuine certified bound even when A0 < 117050, together with the
          wall-clock cost per candidate so the campaign can price completion.
        discriminating_outcomes_predefined:
          - >-
            An admissible A' < 117050 is found - the mirror's rigidity comment as
            written is NOT reproducible under constraint set S. This is a
            PROVENANCE finding about the published transcript, explicitly NOT a
            security claim about M-221, and it would most likely mean S is
            incomplete rather than that anything is wrong with the curve.
          - >-
            The enumeration reaches 117050 with no admissible A' - the transcript
            is reproduced under S, and the rigid cell is corroborated by
            recomputation rather than by testimony.
          - >-
            The enumeration exhausts budget at A0 < 117050 - a partial bound, to
            be reported as a partial bound with A0 stated.
      quantitative_prediction:
        - metric: Tier 1 certificate items passing
          direction: exact
          predicted: 3 of 3
        - metric: A mod 4
          direction: exact
          predicted: 2
        - metric: Tier 2 admissible A below 117050
          direction: lower
          predicted: 0, CONDITIONAL on a constraint set that is not yet sourced
      certificate_or_bound: >-
        Tier 1 - fully succinct certificate (one divisor exhibit, one parity
        observation, one primality certificate). Tier 2 - an explicit ENUMERATION
        BOUND whose verification cost equals its production cost and is therefore
        not succinct; the lane must say so.
      controls: [N1, P1]
      control_note: >-
        N1 is the essential control: a randomly generated curve has NO generation
        transcript, so a rigidity checker that returns "fully rigid" for N1 is
        measuring nothing. P1 (Anomalous) is tabulated "fully rigid" with a
        DIFFERENT stated rule, so it also tests that the checker reads the rule
        rather than the curve name.
      budget: {cpu_seconds: 60 for Tier 1, memory_gb: 0.2, Tier 2: deferred}
      stopping_rule: >-
        Tier 1 single pass. Tier 2 does not start in this campaign until both
        successor conditions are met; if started later, stop at the declared A0
        or at the declared wall clock, whichever comes first, and report the
        partial bound.
      falsifier: >-
        2^221-1 not divisible by 8191; A not congruent to 2 mod 4; A = 117050 not
        admissible under the declared constraint set (which would contradict
        L-BASE/L-TWIST); or, in Tier 2, an admissible smaller A.
      honest_limitation: >-
        Rigidity is a claim about the GENERATION PROCESS, verifiable only against
        a stated rule. Reproducing a rule proves the published curve matches the
        published rule; it cannot prove the rule was chosen before the curve. And
        per the goal's claim boundary, a rigidity failure is not an ECDLP break.

    # ---------------- CATEGORY: ECC security beyond ECDLP ----------------
    - id: L-LADDER
      criterion: ladder
      category: ecc_security_beyond_ecdlp
      priority: 5
      mechanism: >-
        Structural half: confirm the curve is in Montgomery form with
        B(A^2-4) nonzero (from L-EQ) and cofactor 8 (from L-BASE), which is what
        pages/ladder.txt tabulates ("Montgomery ladder? True; Cofactor 2^3"), and
        confirm the ladder constant a24 = (A+2)/4 is an exact integer in F_p
        (A+2 = 117052 and 117052/4 = 29263, an integer, so a24 is small and the
        per-bit constant multiplication is cheap - a concrete efficiency-relevant
        fact rather than an assertion). MEASURED half, which converts an
        unquantified criterion into a falsifiable number: implement the
        Montgomery ladder and INSTRUMENT it, counting field multiplications,
        squarings and additions per scalar bit; implement the Brier-Joye ladder
        as the comparison baseline; report both counts.
      quantitative_prediction:
        - metric: a24 = (A+2)/4
          direction: exact
          predicted: 29263, an integer, so no inversion or large constant is needed
        - metric: instrumented field operations per scalar bit, Montgomery ladder
          direction: lower
          predicted: strictly below 19
          baseline_provenance: >-
            19 is quoted verbatim from pages/ladder.txt, which says the
            Brier-Joye ladder "requires 19 field operations per bit". THIS IS THE
            ONLY NUMBER THE LADDER PAGE PRINTS and it is therefore the only
            defensible baseline. No operation count for the Montgomery ladder is
            asserted here from memory; the executor must MEASURE it.
        - metric: number of input-dependent branches and of secret-dependent
            memory indices in the implemented ladder
          direction: lower
          predicted: 0 (the constant-time half of the criterion)
      certificate_or_bound: >-
        EXPLICIT MEASURED BOUND, not a certificate. The artifact is the
        instrumented operation counter's output plus the source of the two
        implementations, so a third party re-runs the counter rather than
        trusting the number. Constant-timeness is certified only in the weak
        sense of a static count of branches and indices - NOT by a timing
        experiment, which this budget does not support.
      controls: [P3, M1, N1]
      control_note: >-
        P3 (NIST P-224, cofactor 1, tabulated ladder False) must make the
        Montgomery-conversion test return NOT AVAILABLE - pages/ladder.txt states
        the reason exactly: "curves of prime order or 2*prime order can never be
        converted to Montgomery curves over F_p: Montgomery curves always have
        order divisible by 4."
      budget: {cpu_seconds: 300, memory_gb: 0.5}
      stopping_rule: >-
        Stop when both implementations produce matching scalar-multiplication
        outputs on 1000 random inputs AND the counters are recorded. If the two
        implementations disagree on any input, stop - the measurement is void
        until the disagreement is explained.
      falsifier: >-
        Montgomery ladder operation count at or above 19 per bit; a24 not an
        integer; any secret-dependent branch; the two implementations disagreeing.
      honest_limitation: >-
        THE SOURCE ITSELF DECLINES TO QUANTIFY THIS CRITERION - pages/ladder.txt
        says "At this time there are no examples close enough to the edge to
        warrant quantification". The measured count is a DECLARED PROXY chosen by
        this plan, not a reproduction of SafeCurves' verdict, and must be labelled
        so wherever it is cited. Ladder availability is an implementation-safety
        property; it is not an ECDLP property.

    - id: L-TWIST
      criterion: twist
      category: ecc_security_beyond_ecdlp
      priority: 4
      mechanism: >-
        (1) Derive the twist order as 2(p+1) - #E = 2p + 2 - 8l using #E from
        L-BASE, and assert it equals 4*l' for the l' printed on pages/twist.txt.
        (2) Certify l' prime by Pocklington using the M-221 prime list. (3)
        Verify the printed closed form l' = 2^219 - 877302629400756399719854182285495
        and the printed hex agree with the decimal, three-way. (4) Evaluate twist
        rho cost 0.886*sqrt(l') against the tabulated 2^109.3. (5) Reimplement
        the COMBINED ATTACK cost model exactly as pages/twist.txt states it -
        brute force n mod h, brute force n mod h', CRT, then kangaroo on the
        remaining l/(h h') possibilities - with h = 8 and h' = 4, and compare the
        result against the tabulated 2^107.3. (6) Compute the twist embedding
        degree by the L-TRANSFER method and compare with the tabulated (l'-1)/1.
        NO ATTACK IS RUN; step 5 evaluates a cost formula.
      quantitative_prediction:
        - metric: 2p + 2 - 8l - 4l'
          direction: exact
          predicted: 0
          note: >-
            A strong closure check: it ties p, l, and l' together through the
            twist identity, so a transcription error in ANY of the three
            66-digit strings shows up here.
        - metric: log2(0.886*sqrt(l'))
          direction: interval
          predicted: 109.3 plus or minus 0.1
        - metric: reimplemented combined-attack cost
          direction: interval
          predicted: 107.3 plus or minus 1.0
          note: >-
            The tolerance is deliberately wider than for rho because the combined
            model has discretionary steps (which subgroup to brute force, how the
            kangaroo constant is set). A discrepancy inside 1 bit is a MODEL
            DEFINITION difference to be documented, not a finding. A discrepancy
            outside it is an adjudicable conflict.
        - metric: twist embedding degree
          direction: exact
          predicted: l'-1
      certificate_or_bound: >-
        CERTIFICATE for the order identity and for l' primality. EXPLICIT COST
        MODEL with its parameters printed for the combined attack - a model
        evaluation, not a bound on any attacker.
      controls: [P1, M2, N1]
      control_note: >-
        M2 is the parameter-matched negative for this lane and is currently
        DEFERRED for lack of SEA (see controls.M2). Until M2 exists, this lane's
        demonstrated resolving power rests on P1 alone, and the lane must state
        that limitation in its own record.
      budget: {cpu_seconds: 240, memory_gb: 0.5}
      stopping_rule: Deterministic; stop on completion or on the order-identity mismatch.
      falsifier: >-
        2p+2-8l not equal to 4l'; l' composite; hex/decimal/closed-form
        disagreement; reimplemented combined cost outside 107.3 plus or minus 1.0;
        computed twist embedding degree not equal to l'-1.
      honest_limitation: >-
        Twist security is about INVALID-INPUT HANDLING in single-coordinate
        protocols. It is not an ECDLP property of the main subgroup, and the
        combined-attack figure reproduces SafeCurves' own model rather than
        bounding any real attacker.

    - id: L-COMPLETE
      criterion: complete
      category: ecc_security_beyond_ecdlp
      priority: 1
      mechanism: >-
        THE PIVOT LANE. The points of order 2 on y^2 = x^3+Ax^2+x are x = 0 and
        the roots of x^2+Ax+1 = 0, which are rational exactly when A^2-4 is a
        square mod p. So ONE LEGENDRE SYMBOL (already computed in L-EQ) decides
        the 2-torsion count. Then: cofactor 8 with a unique point of order 2
        forces the 2-Sylow subgroup to be cyclic of order 8, hence exactly 2
        points of order 4 - derive this and check it against the tabulated counts
        (1 and 2) on pages/complete.txt, and independently EXHIBIT a point of
        order 4 by halving, so the count is witnessed and not merely argued.
        Finally check the Edwards image: d = (A-2)/(A+2) mod p, and note that
        d = (A-2)(A+2)/(A+2)^2, so d is a square exactly when A^2-4 is - the SAME
        symbol governs Montgomery-ladder completeness and Edwards completeness.
      quantitative_prediction:
        - metric: number of points of order 2
          direction: exact
          predicted: 1
        - metric: number of points of order 4
          direction: exact
          predicted: 2
        - metric: Legendre symbol of d = (A-2)/(A+2)
          direction: exact
          predicted: -1, i.e. the Edwards model is complete
        - metric: exhibited point of order 4
          direction: existence
          predicted: found, and [2]Q equals the unique point of order 2
      certificate_or_bound: >-
        FULLY SUCCINCT CERTIFICATE - one modular exponentiation for the symbol,
        one exhibited point of order 4 that a verifier doubles twice. Verification
        in milliseconds.
      controls: [M1, P3, N1, N2]
      control_note: >-
        M1 IS THE DECISIVE CONTROL HERE and is cheap: same p, an A with A^2-4 a
        square, which must return 3 points of order 2 and NOT COMPLETE. Without
        M1 a routine that always answers "1" is indistinguishable from a correct
        one.
      budget: {cpu_seconds: 30, memory_gb: 0.1}
      stopping_rule: Single pass.
      falsifier: >-
        A^2-4 a square mod p (which would contradict the tabulated count of 1 and
        would be a real source conflict); the 2-Sylow not cyclic; no point of
        order 4 found; d a square while A^2-4 is not (which would indicate an
        arithmetic error, since the two are algebraically equivalent).
      honest_limitation: >-
        Completeness of an addition law is an IMPLEMENTATION-SAFETY property.
        pages/complete.txt itself notes that completeness of a curve does not
        guarantee completeness of every addition law on it. Nothing here bears on
        ECDLP, and the goal's claim boundary says so explicitly.

    - id: L-IND
      criterion: ind
      category: ecc_security_beyond_ecdlp
      priority: 5
      mechanism: >-
        Check the Elligator-2 preconditions exactly as stated on pages/ind.txt -
        "any odd prime and any curve of the form y^2=x^3+Ax^2+Bx with nonzero
        AB(A^2-4B)", and the exception "all curves with points of order 2, except
        for j-invariant 1728": verify p odd; verify A nonzero, B nonzero,
        A^2-4B nonzero mod p, hence AB(A^2-4B) nonzero; verify at least one point
        of order 2 exists (from L-COMPLETE); verify j is not 1728 (from L-EQ).
        Separately record that p = 1 mod 4 (L-FIELD), which per the same page
        rules out Elligator 1, so the "ind" cell here rests on Elligator 2 alone -
        matching the note pages/ind.txt prints for M-221, "Elligator 2: Yes."
        Then IMPLEMENT the Elligator-2 map and its inverse and test round-tripping
        on a sample of at least 10^5 random field elements, counting failures.
      quantitative_prediction:
        - metric: AB(A^2-4B) mod p
          direction: nonzero
          predicted: nonzero, equal to 117050 * 13700702496 mod p
        - metric: j versus 1728
          direction: not equal
          predicted: not equal
        - metric: round-trip failures over 10^5 samples
          direction: lower
          predicted: 0
        - metric: fraction of field elements in the image of the map
          direction: interval
          predicted: about 1/2, consistent with pages/ind.txt's description of a
            bijection onto "about half of all points"
      certificate_or_bound: >-
        CERTIFICATE for the algebraic preconditions (three nonzero checks and one
        inequality, verifiable in microseconds). STATISTICAL BOUND for the
        round-trip test, with the sample size and the seed recorded; 0 failures
        in 10^5 bounds the failure rate below about 3*10^-5 at 95 percent, and the
        lane must state that number rather than claim "no failures".
      controls: [P3, M1, N1]
      control_note: >-
        P3 (NIST P-224) has zero points of order 2 and is tabulated
        "Elligator 2: No.", so the applicability test must REFUSE it.
      budget: {cpu_seconds: 300, memory_gb: 0.5}
      stopping_rule: Stop at 10^5 samples or 300 s, whichever first; report the
        sample size actually reached.
      falsifier: >-
        Any of A, B, A^2-4B zero mod p; j equal to 1728; any round-trip failure;
        image fraction outside 0.45 to 0.55.
      honest_limitation: >-
        Applicability of an encoding map is NOT a proof that any concrete
        protocol is indistinguishable from random. It is a necessary ingredient.
        And per the goal's claim boundary, an ind failure is not an ECDLP break.

  # ===========================================================================
  # 3. THE EIGHT DECLARED ADDITIONAL DIAGNOSTICS
  # ===========================================================================
  additional_diagnostics:
    - id: D1
      declared_as: complete curve and twist order factorization with checkable certificates
      status: planned
      mechanism: >-
        Emit #E = 2^3 * l and #E_twist = 2^2 * l' as fully factored integers with
        a Pocklington certificate for l and for l', cross-checked against the
        M-221 prime list in pages/primeproofs.txt and against the twist identity
        #E + #E_twist = 2(p+1).
      prediction: >-
        Both factorizations complete with no residual composite cofactor; the
        twist identity holds exactly.
      certificate: Pocklington chains plus one exact integer identity. Succinct.
      controls: [P1, P2, N1, N3]
      budget: {cpu_seconds: 120}
      stopping_rule: Stop on certificate; report any residual cofactor rather than factoring it.
      falsifier: A residual cofactor; the twist identity failing.
      limitation: Factorization of the ORDER, not of the difficulty.
    - id: D2
      declared_as: subgroup, cofactor, and invalid-curve confinement costs
      status: planned
      mechanism: >-
        Quantify what h = 8 and h' = 4 leak. Small-subgroup attack on the main
        curve reveals n mod 8 (3 bits) at cost about 2^3; on the twist, n mod 4
        (2 bits). Model invalid-curve confinement for a single-coordinate ladder
        that ignores y: any x in F_p lies on E or on its twist, so an attacker is
        CONFINED to the pair {E, E'} - there is no family of weak curves to walk
        to, which is the structural point of twist security. Compute the residual
        kangaroo cost on l/(h h') = l/32 and compare with L-TWIST step 5.
      prediction: >-
        Bits leaked without cofactor clearing or clamping: 3 from E, 2 from E',
        5 total. Residual kangaroo cost about 2^108.8 - 2.5 = 2^106.3, to be
        reconciled with the tabulated combined figure 2^107.3; a gap of about 1
        bit is expected and is a MODEL DEFINITION difference, not a finding.
      certificate: Explicit cost formulas with every parameter printed.
      controls: [M2 (deferred), N1, P1]
      budget: {cpu_seconds: 60}
      stopping_rule: Single analytic pass.
      falsifier: Residual cost differing from the L-TWIST reimplementation by more
        than 1 bit without an identified model difference.
      limitation: >-
        A model of a protocol misuse, not a property of the curve. Cofactor
        clearing or scalar clamping changes the answer entirely, and the lane must
        state which protocol convention it assumed.
    - id: D3
      declared_as: automorphism- and endomorphism-adjusted rho cost
      status: planned
      mechanism: >-
        Compute j (from L-EQ) and check j is neither 0 nor 1728, which bounds
        Aut(E) to {plus/minus 1}; the only available rho speedup is then the
        negation map already folded into the 0.886 constant, per pages/rho.txt
        ("The largest change was a sqrt(2) negation speedup, replacing
        sqrt(pi/2) with sqrt(pi/4)"). Then check for a GLV-style efficient
        endomorphism by testing whether D (from L-DISC) has a small square divisor
        or a small-norm element, scanning norms up to 10^6.
      prediction: >-
        Aut order 2; no endomorphism of norm below 10^6; adjusted rho cost equals
        0.886*sqrt(l) with NO further discount. |D| near 2^217.5 is exactly the
        regime where pages/disc.txt says the small-|D| speedups do not apply.
      certificate: >-
        j-invariant value plus an explicit scan bound - "no endomorphism of norm
        at most 10^6", whose verification cost equals its production cost and
        which is therefore NOT succinct; stated plainly.
      controls: [P2 (BN(2,254), D = -3, must show the small-|D| regime), N1]
      budget: {cpu_seconds: 120}
      stopping_rule: Stop at norm 10^6 or 120 s; report the bound reached.
      falsifier: j equal to 0 or 1728; any small-norm endomorphism found.
      limitation: Bounds KNOWN speedups only. A scan to 10^6 is a bound, not a proof
        of absence.
    - id: D4
      declared_as: embedding-degree certificate or explicit search bound
      status: planned_by_reuse
      reuse_declaration: >-
        FULLY COVERED BY L-TRANSFER, WHICH REUSES IDEA-20260807-98a970. Recorded
        here as a pointer so the diagnostic is visibly covered, NOT as a
        duplicate mechanism. Extension beyond L-TRANSFER: apply the identical
        certificate to the TWIST subgroup order l' as well as to l, and emit
        IDEA-98a970's representability wall k*ceil(log2 p) for both.
      falsifier: As L-TRANSFER.
      limitation: As L-TRANSFER.
    - id: D5
      declared_as: CM discriminant and conductor structure
      status: planned_with_declared_partial_deferral
      mechanism: >-
        From t^2-4p = f^2 * D_0 (D_0 the fundamental discriminant), compute and
        report the conductor f explicitly with its factorization - a value NOT
        printed on any staged page and therefore a genuine addition to the
        record. Report whether Z[pi] is maximal (f = 1) or not. Report the GRH
        heuristic class-number estimate.
      prediction: >-
        f small (1 or 2 expected, because the printed factorization of D shows
        only 2^2 as a repeated small factor and three distinct large primes);
        D_0 near 2^217.5; class number near sqrt(|D|), about 2^108, per the GRH
        statement printed on pages/disc.txt ("The generalized Riemann hypothesis
        ... implies that the class number is not far from the square root of
        |D|").
      certificate: >-
        Exact integer identity t^2-4p = f^2 * D_0 with each factor certified
        prime. The class number is NOT computed - a 218-bit discriminant class
        number is far outside this budget.
      deferred_part: exact class number h(D)
      deferral_reason: Infeasible at 2^217.5 in this environment.
      successor_condition: >-
        An executor session with PARI/GP class-group machinery and a declared
        multi-hour budget; OR accept the GRH heuristic estimate, clearly labelled
        as heuristic and cited to pages/disc.txt, which is what SafeCurves itself
        does ("this has not been incorporated into SafeCurves").
      controls: [P1 (D = -11, f trivially computable), P2 (D = -3), N1]
      budget: {cpu_seconds: 120}
      stopping_rule: Stop after f and D_0 are certified; do not start a class-group
        computation.
      falsifier: f^2 * D_0 not equal to t^2-4p; D_0 not squarefree or not a
        fundamental discriminant.
      limitation: >-
        Brainpool's class-number criterion is reported as a heuristic estimate
        only. pages/disc.txt states the Brainpool requirement (class number above
        10^6) is "much weaker than the SafeCurves requirement", so the heuristic
        suffices for comparison but certifies nothing.
    - id: D6
      declared_as: model-conversion exceptional sets
      status: planned
      mechanism: >-
        Enumerate, with proof, the exceptional set of each conversion map used
        anywhere in this audit: Montgomery to short Weierstrass via the
        substitution x = Bu - A/3, y = Bv printed on pages/equation.txt (requires
        3 invertible mod p - true since p is a large prime); Montgomery to
        Edwards via the correspondence printed on pages/equation.txt
        (A = 2(1+d)/(1-d), B = 4/(1-d)), whose birational map is undefined
        exactly at the points with y = 0 or x = -1; and the x-only ladder's
        handling of the identity. For each map, PREDICT the exceptional set as an
        explicit finite list of points, then SEARCH for exceptions by evaluating
        the map at every point of order dividing 8 and at 10^5 random points.
      prediction: >-
        The observed exceptional set equals the predicted list exactly - no
        exceptional point outside it, and every predicted point genuinely
        exceptional. Cardinality expected to be small (a handful of points of
        order 1, 2 and 4).
      certificate: The explicit list plus the search transcript; a verifier
        re-evaluates the map at each listed point.
      controls: [M1 (three points of order 2 changes the exceptional set - the
        prediction must CHANGE, proving the prediction is derived and not fixed),
        N1, P3]
      budget: {cpu_seconds: 300}
      stopping_rule: Stop at 10^5 random points or 300 s.
      falsifier: An exceptional point found outside the predicted list; a
        predicted exceptional point that is not exceptional.
      limitation: >-
        Covers the maps actually used in this audit. Absence of an exceptional
        case in an unlisted map is not asserted.
    - id: D7
      declared_as: scalar and multiscalar formula exceptional-case search
      status: planned
      mechanism: >-
        Implement (a) the Montgomery ladder, (b) the complete Edwards addition
        law on the Edwards model of M-221, and (c) as a NEGATIVE control the
        standard incomplete short-Weierstrass affine addition, and drive all
        three over: every input pair drawn from the subgroup of order 8; the
        identity and the point of order 2; P and -P; and 10^5 random pairs.
        Count exceptional outputs per formula. Repeat for a two-scalar
        multiscalar routine.
      prediction: >-
        (a) and (b) produce ZERO exceptional cases, which is the content of the
        Bernstein 2006 and Bernstein-Lange 2007 completeness statements quoted on
        pages/complete.txt, given that A^2-4 is a non-residue (L-COMPLETE).
        (c) produces NONZERO exceptions on the Q = P and Q = -P inputs, exactly
        as pages/complete.txt describes ("the standard Weierstrass addition
        formulas fail if Q happens to match -P. This will not be caught by random
        tests.").
      certificate: >-
        The exceptional-case counter's output plus the enumerated input set. A
        BOUND, not a proof of completeness - 10^5 random pairs bound the failure
        rate below about 3*10^-5 at 95 percent for the random part, while the
        small-order part is EXHAUSTIVE and is a genuine finite proof over that
        set.
      controls: [formula (c) is the built-in positive control and MUST fire; M1;
        N1]
      control_note: >-
        IF (c) PRODUCES ZERO EXCEPTIONS THE HARNESS IS NOT EXERCISING THE
        EXCEPTIONAL INPUTS AND THE ZEROS FROM (a) AND (b) ARE MEANINGLESS. This
        is the null-object discipline applied to a completeness claim.
      budget: {cpu_seconds: 600}
      stopping_rule: Stop at 10^5 random pairs or 600 s; report what was reached.
      falsifier: Any exception in (a) or (b); zero exceptions in (c).
      limitation: >-
        Tests THESE implementations of these formulas. A bug-free run does not
        certify any other implementation, and pages/complete.txt notes the dual
        Edwards addition law is NOT complete even on complete Edwards curves.
    - id: D8
      declared_as: deterministic parameter-generation transcript audit
      status: partially_planned_partially_deferred
      mechanism: L-RIGID Tier 1 (reproducible now) and Tier 2 (deferred).
      deferral_reason: Capsule gap G1 plus the SEA capability gap - see L-RIGID.
      successor_condition: As L-RIGID Tier 2.
      falsifier: As L-RIGID.
      limitation: As L-RIGID.
  diagnostics_coverage_statement: >-
    All eight declared diagnostics are addressed. D4 by explicit reuse of
    L-TRANSFER/IDEA-20260807-98a970 rather than duplication. D5 is planned with
    ONE named part deferred (exact class number) with a reason and a successor
    condition. D8 is half planned and half deferred with a reason and a successor
    condition. No diagnostic is silently dropped.

  # ===========================================================================
  # 4. PRIORITY AND SEQUENCING
  # ===========================================================================
  sequencing:
    gate_0_controls: >-
      Run N3 (a), then P1, P2, P3, M1, N1, N2, N3 (b). NO M-221 LANE OUTPUT IS
      INTERPRETED UNTIL THIS GATE PASSES. Estimated total under 5 minutes.
    order:
      - 1: [L-EQ, L-COMPLETE]
      - 2: [L-FIELD, L-BASE]
      - 3: [L-TRANSFER, L-DISC]
      - 4: [L-RHO, L-TWIST]
      - 5: [L-LADDER, L-IND]
      - 6: [L-RIGID Tier 1]
      - 7: [D1, D2, D3, D4, D5, D6, D7]
      - 8: 'DEFERRED: L-RIGID Tier 2 / D8 Tier 2, M2, D5 class number'
    test_first: L-EQ/L-COMPLETE Legendre pivot
    why_first: >-
      ONE MODULAR EXPONENTIATION - the Legendre symbol of A^2-4 = 13700702496
      modulo p = 2^221-3 - is the cheapest valid discriminator in the entire
      plan, and it decides FOUR tabulated quantities at once, all of which are
      algebraically equivalent to it: the number of points of order 2 (1 versus
      3), the number of points of order 4, whether the Montgomery ladder is
      complete in the sense pages/complete.txt attributes to Bernstein 2006, and
      whether the Edwards image d = (A-2)/(A+2) is a non-square. BOTH OUTCOMES
      ARE DEFINED IN ADVANCE: a non-residue means the mirror's complete/ladder/
      2-torsion cells are internally consistent with the equation and the audit
      proceeds; a residue is a DIRECT CONFLICT with the count of 1 printed on
      pages/complete.txt and must be adjudicated as a source conflict before any
      other lane is trusted, because it would mean either the equation or the
      completeness table is wrong. It costs seconds, needs no factorization, no
      point counting and no external source, and its control M1 (same p, an A
      with the opposite symbol) is constructed by the same routine.
    total_estimated_budget:
      cpu_seconds: 3000 for all non-deferred lanes, diagnostics and controls
      memory_gb: 1.0 peak
      note: >-
        Comfortably inside a single executor task budget. The expensive items are
        the ones already declared DEFERRED, which is why they are declared rather
        than attempted and abandoned.

  # ===========================================================================
  # 5. HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ===========================================================================
  honest_accounting:
    objects_considered:
      - object: THE CURVE INVARIANT VECTOR V (adopted)
        verdict: >-
          Adopted as the audit's tracked object. Passes the lossy-projection test
          (see design_spine.tracked_object).
      - object: THE MULTIPLICATIVE ORDER ord_l(p) (adopted by reuse)
        verdict: >-
          Adopted via IDEA-20260807-98a970, whose own record already establishes
          its lossiness and its propagation under F_p-isogeny, base change and
          change of subgroup. Not re-derived here; reused as required.
      - object: THE LEGENDRE SYMBOL OF A^2-4 (adopted as the session pivot)
        lossiness: >-
          Maximally lossy - the whole curve collapses to one bit. Not a change of
          coordinates: nothing about the curve is recoverable from the bit. What
          it discards is discarded compatibly with the operations that matter,
          because the bit is invariant under the model conversions of D6 (it is
          equivalent to the squareness of the Edwards d) and it determines the
          2-torsion structure, which is what the ECC-beyond-ECDLP category
          actually depends on.
        propagation: >-
          Deterministic: it fixes #E[2] and, with the cofactor, #E[4]; it fixes
          Edwards completeness; it survives isomorphism.
        survival: >-
          Dissolves as soon as the question moves to the main prime subgroup,
          where 2-torsion is irrelevant. That boundary is why this bit is a
          pivot for five cells and is worth nothing for rho, transfer or disc.
      - object: THE GENERATION TRANSCRIPT (p rule, B rule, A minimality)
        verdict: >-
          Genuinely testable but only HALF reachable from the staged sources
          (capsule gap G1). Adopted as L-RIGID with an explicit Tier 1 / Tier 2
          split rather than pretended to be fully checkable.
    dominated_by: 'n/a (no result claimed)'
    dominated_by_justification: >-
      This deliverable claims no algorithmic result, mounts no attack, and moves
      no exponent, so there is no frontier row for it to sit on. It is a
      measurement plan. If any lane later produced an attack claim, THAT record
      would owe a Pareto check against the rho baseline 0.886*sqrt(l) at O(1)
      memory and against the transfer baselines, and this plan pre-commits it to
      doing so.
    sota_delta: >-
      ZERO speedup against any attack baseline on every axis - time, memory,
      data. Quantitatively, the delta is in PROVENANCE AND DATA, not cost: this
      repository currently holds ZERO recomputed or certified values for M-221;
      the plan would produce roughly 16 certified or explicitly bounded
      quantities (p primality, l primality, l' primality, on-curve, ord(P), h,
      #E, t, D, f, k, k', #E[2], #E[4], j, Elligator-2 applicability) plus 8
      diagnostic outputs, each with a stated third-party verification cost. It
      also converts two criteria that their own source leaves UNQUANTIFIED
      (ladder, complete) into declared measurable proxies, and it documents four
      threshold and specification gaps (capsule G1-G4) that the intake row hides
      behind a single "True".
    closures_enumerated:
      - closure: >-
          THE MIRROR CANNOT CORROBORATE THE INTAKE FOR THIS CURVE.
        obstruction: >-
          Common source. SafeCurves introduced M-221; the mirror IS SafeCurves;
          the intake is a transcription of SafeCurves. Agreement is one source
          seen twice.
        argument: >-
          Corroboration requires causal independence of two productions. There is
          none here, so agreement carries no evidential weight beyond confirming
          the user's transcription.
        forward_guidance: >-
          Two classes remain open: (i) RECOMPUTATION from (p,A,B), which is
          causally independent because it is mathematics rather than testimony -
          this is what the whole plan does; (ii) an independent DOCUMENT, of
          which exactly one is identified (eprint 2013/647) and it is
          unretrieved.
      - closure: >-
          TIER-2 RIGIDITY MINIMALITY IS NOT REACHABLE IN THIS ENVIRONMENT.
        obstruction: >-
          Deciding admissibility of a candidate A requires point counting at 221
          bits; about 29000 candidates; no cheap filter is known that decides
          "order is 8*prime" without counting.
        argument: >-
          Pure-Python SEA at 221 bits costs far more than the campaign's whole
          wall clock per candidate, let alone 29000 times.
        forward_guidance: >-
          Open classes: a Sage/PARI executor session; a PARTIAL ascending
          enumeration to a declared A0, which yields a genuine certified bound
          "no admissible A in (2, A0)"; and retrieval of the constraint set from
          eprint 2013/647, without which minimality is not even well posed.
        premature_closure_check: >-
          This is a CAPABILITY closure with a named obstruction and named
          remaining classes, not a claim that the question is settled or
          uninteresting.
      - closure: >-
          THE LADDER AND COMPLETE CELLS CANNOT BE REPRODUCED AS CERTIFIED
          INEQUALITIES.
        obstruction: Their source declines to quantify them (capsule G4).
        argument: >-
          A verdict with no threshold has no falsifier. Reproducing it would mean
          reproducing a judgement, not a computation.
        forward_guidance: >-
          Open classes: measured proxies (this plan's instrumented operation
          count against the one number the page prints, 19 field operations per
          bit for Brier-Joye), and exhaustive small-order exceptional-case
          searches (D7), which ARE finite proofs over their input sets.
    open_directions_next_session:
      - >-
        Stage raw bytes of eprint 2013/647 under inputs/ with a sha256. It is the
        single highest-value retrieval for this goal: it is the only identified
        source independent of SafeCurves for (p, A, B), and the likely home of
        the rigidity constraint set. Both material capsule gaps (G1, G5) close on
        it.
      - >-
        Identify, BY RETRIEVAL rather than from memory, one third-party curve
        database carrying M-221, as a second independent transcription chain.
      - >-
        Decide whether the campaign wants the exact class number h(D) (D5) or
        will accept the GRH heuristic that SafeCurves itself uses. This is a
        budget decision, not a research one, and it should be made explicitly.
      - >-
        A cross-goal method-reuse check against the sibling SafeCurves campaign
        GOAL-SCURVE-51437e, whose BATCH-a41eb7 contains an audit plan mentioning
        M-221. NOT read in this session because it lies outside this task's
        read_scope. The COORDINATOR should decide whether the two plans should
        share a certificate harness rather than build two.
      - >-
        A general question this task raised and did not answer: for a curve
        introduced by the same body that publishes the safety criteria, WHAT IS
        THE MINIMUM EVIDENCE THAT BREAKS THE CIRCLE? This plan's answer is
        "recomputation from the seed triple", which leaves the seed triple
        itself single-sourced. Whether that residue is acceptable is a question
        for the validator, and it applies to every SafeCurves-introduced curve in
        the portfolio, not only M-221.

  novelty:
    status: adaptation
    screen_method: >-
      Grep over the repository for "M-221" and "Curve2213" across *.yaml, *.md,
      *.json on 2026-08-25. Reads of ledger/goals/GOAL-SCURVE-873d08/goal.yaml,
      ledger/questions/RQ-SCURVE-7af163.yaml,
      ledger/proposals/IDEA-20260807-98a970.yaml, and the fifteen staged mirror
      pages listed in the capsule. One WebSearch for the origin paper's
      identifier.
    screen_results: >-
      Nine repository files mention M-221: this goal's records and queue, this
      task's card and handoff, the bootstrap manifest, and ONE artifact belonging
      to a DIFFERENT goal
      (coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-eaf0af/audit-plan.yaml),
      which was NOT OPENED because it lies outside this task's read_scope. No
      knowledge/ entry, no ledger evidence record, and no hypothesis mentions
      M-221. No prior recomputed value for this curve exists in the corpus.
    verdict: >-
      ADAPTATION. The audit METHOD is KNOWN mathematics and known practice -
      pages/verify.txt documents SafeCurves' own verify.sage doing essentially
      this, and standards-mandated parameter validation has done it for decades.
      What is new HERE is (i) the certificate-per-lane and control-per-lane
      discipline applied to one curve inside this program's ledger, (ii) the
      explicit non-independence adjudication for a curve its own criteria author
      introduced, and (iii) the conversion of two unquantified criteria into
      declared measurable proxies. NOT claimed as novel mathematics. Because the
      corpus web check was limited to one identifier search, no claim of
      external novelty is made at all.
