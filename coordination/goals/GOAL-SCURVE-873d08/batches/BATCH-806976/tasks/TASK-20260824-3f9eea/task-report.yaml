  state: complete
  produced_at: '2026-08-25'
  curve: M-221

  # ---------------------------------------------------------------------------
  # MANDATORY CLAIM STATEMENT
  # ---------------------------------------------------------------------------
  claim_statement:
    no_attack_ran: >-
      NO CURVE ATTACK WAS RUN. No rho, kangaroo, transfer, small-subgroup,
      invalid-curve, or any other attack was executed or attempted against M-221
      or against any control object. No scalar multiplication, no point counting,
      no factorization and no modular exponentiation was executed at all: this
      task had no execution environment and produced no computation.
    no_experiment_result_created: >-
      No experiment result, run record, or evidence record was created. Nothing
      in the two artifacts is an observation about a computation.
    no_safety_conclusion: >-
      THIS TASK MAKES NO STATEMENT THAT M-221 IS SAFE, UNSAFE, VULNERABLE, OR
      FREE OF VULNERABILITIES, and none of its outputs may be cited as such. All
      eleven criterion cells remain UNREPRODUCED. The predictions in
      audit-plan.yaml are preregistered expectations written so that later
      confirmation is a controlled result rather than a retrospective
      rationalization; they are not findings.
    live_keys: >-
      No live private key was tested, requested, stored, or derived. Only public
      named-curve parameters read from a staged mirror were handled. All controls
      described in the plan are generated objects.

  artifacts_written:
    - path: coordination/goals/GOAL-SCURVE-873d08/batches/BATCH-806976/tasks/TASK-20260824-3f9eea/parameter-capsule.yaml
      description: >-
        Primary-source parameter capsule for M-221 with per-value provenance,
        evidence-class separation, the independence analysis, the authoritative
        threshold quotations, and the conflict/gap register.
    - path: coordination/goals/GOAL-SCURVE-873d08/batches/BATCH-806976/tasks/TASK-20260824-3f9eea/audit-plan.yaml
      description: >-
        Falsifiable prioritized audit plan - eleven criterion lanes in their
        declared categories, eight declared diagnostics, the blocking control
        block, sequencing, and the honest-accounting section.
    - path: coordination/goals/GOAL-SCURVE-873d08/batches/BATCH-806976/tasks/TASK-20260824-3f9eea/task-report.yaml
      description: This report.
  write_scope_respected: true
  write_scope: coordination/goals/GOAL-SCURVE-873d08/batches/BATCH-806976/tasks/TASK-20260824-3f9eea
  files_written_outside_write_scope: none
  git_operations_performed: none (no add, no commit, no push - the Coordinator archives)

  # ---------------------------------------------------------------------------
  # INFERENCE ACCOUNTING
  # ---------------------------------------------------------------------------
  inference:
    requested_policy: research-deep
    policy_honoured: true
    fallback_used: false
    degraded: false
    model_that_answered: claude-opus-5
    model_identifier_provenance: >-
      Read from this session's own runtime context, which names the model
      "Opus 5" with exact model ID "claude-opus-5". This agent cannot inspect
      orchestration/model-bindings.yaml resolution from inside the session, so
      the binding of research-deep to this model is asserted on the runtime's
      self-report and not independently verified.
    reasoning_effort: >-
      high, per the .claude/agents/idea-generator.md frontmatter derived from
      roles.yaml -> research-deep -> reasoning_effort. The handoff carries
      reasoning_effort: null, meaning the agent-file value governs.
    bedrock_prohibition: >-
      HONOURED. No provider, backend, endpoint, or model identifier containing
      "Bedrock" (case-insensitive) was selected, requested, or used.

  budget_accounting:
    allocated: {wall_clock_seconds: 1800, memory_gb: 4, maximum_runs: 1}
    runs_used: 0
    runs_note: >-
      maximum_runs 1 was not consumed. This task is a planning deliverable; it
      executed nothing.
    wall_clock_note: >-
      Completed within the allocated window. No timeout, no budget stop, and no
      infrastructure failure occurred during production of these artifacts.
    memory_note: Negligible; file reads only.

  # ---------------------------------------------------------------------------
  # COMPLETION GATE
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: >-
        The parameter capsule distinguishes user intake from retrieved primary or
        authoritative sources and records provenance and unresolved conflicts.
      met: true
      how: >-
        parameter-capsule.yaml defines four explicit evidence classes (intake /
        retrieved_staged_mirror / hand_arithmetic_this_session / unretrieved),
        tags every value with its class, lists all fifteen staged files with
        their sha256 and upstream HTTP status, keeps the intake cells in a
        separate `preregistered_intake_cells` block marked `is_evidence: false`,
        and carries a conflict register (C1) plus five open gaps (G1-G5). It also
        records the two sources that were NOT retrieved with their exact failure
        modes, and paraphrases neither.
    - item: >-
        The audit plan covers every one of the eleven criteria in the declared
        category, with a certificate or explicit bound, controls, falsifier,
        budget, and stopping rule.
      met: true
      how: >-
        Eleven lanes, each carrying category, mechanism, quantitative
        prediction(s) with metric and direction, certificate_or_bound, controls,
        budget, stopping_rule, falsifier, honest_limitation. Categories match the
        goal record exactly - basic_parameter_requirements {L-FIELD, L-EQ,
        L-BASE}; ecdlp_security_requirements {L-RHO, L-TRANSFER, L-DISC,
        L-RIGID}; ecc_security_beyond_ecdlp {L-LADDER, L-TWIST, L-COMPLETE,
        L-IND}. Where a criterion admits no certificate because its own source
        leaves it unquantified (ladder, complete), the lane says so and supplies
        a declared measurable proxy plus an explicit bound with its true
        verification cost.
    - item: >-
        The plan covers every declared additional diagnostic, or records a
        concrete reason and successor condition for a deferred diagnostic.
      met: true
      how: >-
        All eight are addressed as D1-D8. D4 is covered by explicit REUSE of
        IDEA-20260807-98a970 through lane L-TRANSFER, per the non-duplication
        rule, rather than by a duplicate mechanism. D5 defers exactly one named
        part (the exact class number of a 2^217.5 discriminant) with the reason
        and a successor condition. D8 defers its Tier 2 (A-minimality) with two
        stated reasons - the SEA capability gap and capsule gap G1 - and a
        two-part successor condition. Nothing is silently dropped;
        `diagnostics_coverage_statement` records this explicitly.
    - item: >-
        Positive, parameter-matched negative, and same-shape null controls are
        explicit and run before belief in any later task.
      met: true
      how: >-
        audit_plan.controls declares P1 (Anomalous), P2 (BN(2,254)), P3 (NIST
        P-224) as positive controls with their required firing behaviour and the
        void-on-failure rule; M1 (same p = 2^221-3, an A with the opposite
        Legendre symbol) and M2 (same p, cofactor-violating A) as
        parameter-matched negatives with their matching assumptions stated and
        their non-matched attributes named; and N1 (same-shape synthetic), N2
        (shuffled digits), N3 (digit perturbation) as same-shape nulls.
        `controls.blocking_rule` makes the block a HARD GATE and
        `sequencing.gate_0_controls` places it before any lane is interpreted.
        M2 is declared DEFERRED with a reason and successor condition rather than
        quietly omitted, and lane L-TWIST is required to state the resulting
        limitation in its own record.
    - item: >-
        The report states that no curve attack ran and makes no safety or
        vulnerability conclusion.
      met: true
      how: See `claim_statement` above.

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ---------------------------------------------------------------------------
  intake_versus_retrieved:
    conflicts_found: 0
    headline: >-
      NO CONFLICT WAS FOUND, AND THAT IS A WEAK RESULT, NOT A STRONG ONE.
    detail: >-
      The staged mirror agrees with the intake on the curve name, the equation
      y^2 = x^3+117050x^2+x, the modulus 2^221 - 3, the attribution string
      "2013 Aranha-Barreto-Pereira-Ricardini (formerly named Curve2213)", the
      Safe? cell, and all eleven criterion cells (all True on
      pages/index.txt).
    why_this_is_not_corroboration: >-
      M-221 IS A CURVE THE SAFECURVES WORK ITSELF INTRODUCED AND NAMED. The
      staged mirror IS the SafeCurves web site and the intake table is a
      transcription of that same web site. THE TWO ARE NOT INDEPENDENT SOURCES.
      Their agreement establishes only that the user transcribed the row
      correctly - a genuine if minor transcription check on the intake - and
      establishes NOTHING about the curve. Any downstream record that cites this
      agreement as confirmation would be making a circular claim, and this report
      states so in advance precisely so that no one does.
    goal_pause_condition: >-
      The goal's pause condition "Primary or authoritative sources leave an
      unresolved conflict in the named curve's parameter tuple" is NOT triggered.
    material_gaps_that_remain_open:
      - id: G1
        summary: >-
          The rigidity transcript is under-specified by its own source.
          pages/rigid.txt says "A > 2 is as small as possible" without stating the
          admissibility predicate that "possible" quantifies over, so minimality
          is not well posed from the staged sources alone.
      - id: G5
        summary: >-
          The seed triple (p, A, B) and the base point are SINGLE-SOURCED to
          SafeCurves. Recomputation - the plan's independence mechanism - can
          validate everything derived from them but cannot validate them.
      - id: G2
        summary: >-
          pages/rho.txt carries two non-equivalent thresholds: the prose
          "SafeCurves requires l to be at least 2^200" and the column header
          "Cost for rho above 2^100?". Since 0.886*sqrt(2^200) is about 2^99.83
          the first does not strictly imply the second. Immaterial at M-221's
          size (l is about 18 bits clear) but it means "rho: True" is
          threshold-dependent and must never be cited as if one threshold
          existed.
      - id: G3
        summary: >-
          SafeCurves prints no numeric embedding-degree threshold of its own;
          pages/transfer.txt adopts Brainpool's k >= (l-1)/100 by reference
          ("SafeCurves takes the overkill approach"). The transfer verdict must
          therefore be stated against a named external bound.
      - id: G4
        summary: >-
          The ladder and complete criteria are qualitative in their source;
          pages/ladder.txt explicitly declines to quantify "much". Neither cell
          can be reproduced as a certified inequality, only measured by a
          declared proxy.

  # ---------------------------------------------------------------------------
  # RETRIEVAL AND THE COORDINATOR'S INTEGRITY WARNING
  # ---------------------------------------------------------------------------
  retrieval_report:
    coordinator_warning_received: >-
      Mid-task message from the coordinator: WebFetch in this environment returns
      a small-model SUMMARY of a page, and that summary demonstrably corrupts
      numeric data (three RFC 7748 constants collapsed into one wrong value, a
      cofactor reported as 2 where raw bytes say 4 on three lines, a subgroup
      order with a 64-hex tail where the raw text has 56, and two fetches of the
      same URL disagreeing with each other in value and length).
    how_it_was_addressed: >-
      FULLY, AND WITHOUT REWORK, because the warning arrived while every digit in
      the capsule had already been read with the Read tool over raw staged bytes.
      WebFetch was never invoked in this session, for any URL. There is therefore
      NOT ONE quarantined digit string in parameter-capsule.yaml, and the capsule
      says so explicitly in `retrieval_record`. The warning did change one thing:
      it is now recorded as the motivating rationale for control N3
      (digit-perturbation null), which requires the executor to re-read every
      capsule value from its named mirror file byte-for-byte before any lane
      runs, and to confirm that flipping a single digit of l or y1 makes the
      on-curve and order checks FAIL. The capsule's `transcription_integrity`
      block names model transcription error as the residual risk that raw-byte
      sourcing does NOT eliminate, and points at N3 as its control.
    websearch_used_for: >-
      One search, for the existence and stable identifier of the origin paper
      only. It returned titles and URLs. NO numeric parameter was taken from it.
    safecurves_direct_retrieval: >-
      Not attempted. Per the task briefing the WebFetch tool path returns HTTP
      502 for every URL on safecurves.cr.yp.to in this environment while curl to
      the same URL in the same container returns 200, and the idea-generator role
      has no Bash. This is an OPERATIONAL observation about a tool path and is
      NEVER mathematical evidence; five earlier producers in this campaign
      already spent budget establishing it, and this task deliberately spent
      none.
    sources_read: >-
      Fifteen files under inputs/SAFECURVES-20260825/pages/, each cited in the
      capsule with its sha256 from source_record.yaml: index, field, equation,
      base, primeproofs, rho, transfer, disc, rigid, ladder, twist, complete,
      ind, verify, refs.
    fidelity_rules_observed: >-
      Only pages/*.txt were quoted, which source_record.yaml's
      extraction_fidelity block marks FAITHFUL. The LOSSY specs/sec2-v*.txt
      files, whose prose the same block forbids quoting, were neither read nor
      cited - M-221 is not a SEC 2 curve, so they were not needed.
    unretrieved_recorded:
      - source: 'Aranha-Barreto-Pereira-Ricardini, eprint 2013/647'
        status: unretrieved
        failure_mode: >-
          Not attempted by WebFetch. Under the coordinator's warning a WebFetch
          would return summarizer output whose digits cannot be transcribed, so
          the fetch could not have produced a usable parameter and would have
          consumed budget. Its citation metadata (authors, title, year, URL) IS
          retrieved, from pages/refs.txt; its BODY was not read and is not
          paraphrased anywhere.
      - source: 'the (x0,y0) full-order generator required by verify.sage'
        status: not present on any staged page
        failure_mode: not published on the pages read
        impact: >-
          NOT BLOCKING. The plan generates a point of order 8*l locally and marks
          it a generated control input rather than a sourced parameter.

  # ---------------------------------------------------------------------------
  # LIMITATIONS OF THIS DELIVERABLE
  # ---------------------------------------------------------------------------
  limitations:
    - >-
      NOTHING WAS COMPUTED. Every number in the capsule is transcribed. The two
      arithmetic observations recorded (117050^2 - 4 = 13700702496, and doubling
      the tabulated embedding degree reproduces l - 1) are HAND ARITHMETIC,
      flagged as such in place, and are scheduled for machine recomputation. They
      are not results.
    - >-
      THE PLAN'S PREDICTIONS COULD ALL BE WRONG. They are derived from the
      mirror's own tabulations plus algebra, and the point of running the lanes
      is that the tabulations might not survive recomputation. A reader who
      treats the prediction column as an answer has misread the document.
    - >-
      THE INDEPENDENCE MECHANISM HAS A RESIDUE. Recomputation from (p, A, B) is
      causally independent of SafeCurves' testimony, but the seed triple itself
      is not. A transcription error in p, A or B would produce a perfectly
      self-consistent audit OF A DIFFERENT CURVE. Control N3 tests whether the
      pipeline would notice a perturbed digit; it cannot test whether the mirror
      itself is right.
    - >-
      TWO CRITERIA CANNOT BE REPRODUCED AS CERTIFIED INEQUALITIES (ladder,
      complete) because their source declines to quantify them. The plan
      substitutes declared proxies and labels them proxies. A proxy result must
      never be reported as a reproduction of the SafeCurves cell.
    - >-
      COST FIGURES REPRODUCE SAFECURVES' MODEL. The rho, twist-rho and
      combined-attack numbers evaluate a specific published cost model for
      specific known algorithms. Reproducing them is not an independent lower
      bound on ECDLP and presumes no better algorithm exists - which nothing here
      or anywhere proves.
    - >-
      NO CROSS-GOAL CHECK WAS PERFORMED. The novelty grep found an audit plan
      mentioning M-221 under a DIFFERENT goal
      (GOAL-SCURVE-51437e/BATCH-a41eb7/TASK-20260824-eaf0af). It was NOT opened,
      because it is outside this task's read_scope and the briefing forbade
      reading another goal's RQ. Whether the two campaigns should share a
      certificate harness is a Coordinator decision, flagged not taken.
    - >-
      EXTERNAL NOVELTY IS UNCLAIMED. The web check was one identifier search.
      The audit method is known mathematics and known practice - pages/verify.txt
      documents SafeCurves' own verify.sage doing essentially this - so the plan
      is classified `adaptation`, novel within this program as data only.

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (proposals only - the Coordinator assigns)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - proposed_role: executor
      objective: >-
        Run audit-plan gate 0 (controls N3a, P1, P2, P3, M1, N1, N2, N3b) and
        then priority-1 and priority-2 lanes L-EQ, L-COMPLETE, L-FIELD, L-BASE,
        emitting certificates per lane.
      why_first: >-
        The Legendre pivot plus the tuple self-verification is the cheapest work
        in the campaign and everything downstream is conditional on it. L-BASE's
        derived trace t is the single most informative comparison in the plan:
        it is computed from (p, A, B, x1, y1, l) with no reference to
        pages/disc.txt, while pages/disc.txt printed t from an independent point
        count, so agreement is REAL corroboration of the derived half of the
        tuple and disagreement is a blocking conflict.
      estimated_budget: {cpu_seconds: 400, memory_gb: 0.5}
      blocking_rule: >-
        If [l]P is not the identity, or if the three p representations disagree,
        the executor must STOP and report a blocking conflict rather than
        continue.
    - proposed_role: executor
      objective: >-
        Priority 3-5 lanes (L-TRANSFER, L-DISC, L-RHO, L-TWIST, L-LADDER, L-IND)
        plus L-RIGID Tier 1 and diagnostics D1-D7, contingent on gate 0 passing.
      estimated_budget: {cpu_seconds: 2600, memory_gb: 1.0}
    - proposed_role: orchestration (infrastructure, not research)
      objective: >-
        Stage raw bytes of https://eprint.iacr.org/2013/647 under
        inputs/ with a sha256 and a source_record, under the same discipline as
        SAFECURVES-20260825.
      why: >-
        HIGHEST-VALUE RETRIEVAL FOR THIS GOAL. It is the only identified source
        independent of SafeCurves for the seed triple, and the likely home of the
        rigidity constraint set. Both material gaps (G1, G5) close on it and
        neither closes without it.
    - proposed_role: coordinator
      objective: >-
        Decide (a) whether GOAL-SCURVE-873d08 and GOAL-SCURVE-51437e should share
        one certificate harness; (b) whether the campaign wants the exact class
        number of D (D5) or accepts the GRH heuristic SafeCurves itself uses;
        (c) whether an executor session with Sage/PARI SEA can be provisioned,
        which is the sole unlock for control M2 and for L-RIGID Tier 2.
    - proposed_role: validator
      objective: >-
        Adjudicate the question this task raised and could not answer: FOR A
        CURVE INTRODUCED BY THE SAME BODY THAT PUBLISHES THE SAFETY CRITERIA,
        WHAT IS THE MINIMUM EVIDENCE THAT BREAKS THE CIRCLE? This plan's answer
        is "recomputation from the seed triple", which leaves the seed triple
        single-sourced. The answer applies to every SafeCurves-introduced curve
        in the portfolio, not only M-221.

  honest_accounting_pointer: >-
    The full honest-accounting block required by docs/inventor-protocol.md
    section 5 - objects considered with their lossy-projection analysis,
    dominated_by, sota_delta, the three enumerated closures with their
    obstructions and forward guidance, and the open directions - is in
    audit-plan.yaml under `honest_accounting`. Summary: dominated_by is
    'n/a (no result claimed)' because no algorithmic result is claimed and no
    attack is mounted; sota_delta is ZERO speedup on every axis, with the delta
    residing entirely in provenance and data (roughly 16 certified or explicitly
    bounded quantities plus 8 diagnostic outputs where the corpus currently holds
    zero for this curve, plus four documented specification gaps that the intake
    row hides behind a single "True").
