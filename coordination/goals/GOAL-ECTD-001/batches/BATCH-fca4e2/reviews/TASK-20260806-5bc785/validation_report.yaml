      result: >-
        ALL FIVE PASS in my own execution: group-law closure and
        order-finder (brute-force vs BSGS agreement on 4 curves over F_97),
        division-polynomial roots vs brute-force torsion points (ell=2,3,5,7),
        S3/S4/xDBL/xADD vs real curve arithmetic (200+199+200+200 checks),
        isogeny neighbor order-preservation (25 source curves, ell in
        {2,3,5,7}, every neighbor brute-force re-verified), and Buchberger GB
        ideal-membership on 30 random systems + 1 hand-checkable case. This
        independently confirms the core mathematical building blocks are
