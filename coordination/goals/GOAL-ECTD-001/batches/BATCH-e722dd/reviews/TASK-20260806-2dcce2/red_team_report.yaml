red_team_report:
  task_id: TASK-20260806-2dcce2
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-e722dd
  role: red-team
  reviewed: [H-ECTD-19017a, EXP-ECTD-9e4248]
  reviewed_snapshot_commit: d4d5e8df1341a9be677bdd671300a8af3e8ccbad
  independent_session: true
  requested_policy: review-adversarial
  resolved_model_id: claude-sonnet-5
  fallback_used: true
  fallback_reason: this harness cannot resolve policy aliases
  produced_at: '2026-08-06'

  five_condition_check:
    conditions_source: >-
      coordination/goals/GOAL-ECTD-001/batches/BATCH-002/reviews/TASK-20260731-049/review_report.yaml,
      per_idea_verdicts.IDEA-20260731-017
    result: all_five_present_in_substance
    detail: >-
      (1) frozen decision table before design -- present; (2) KS-distance
      primary statistic -- present; (3) mutually exclusive preregistered
      continuity/discontinuity branches -- present by construction (though
      see D1: not jointly EXHAUSTIVE, a separate defect from mutual
      exclusivity); (4) forbiddance of equating continuity with
      isogeny-evaluation/path-finding hardness -- present, repeated in
      claim_ceiling, what_this_experiment_is_NOT, and both branch
      interpretations; (5) GLV instrument confined to the endomorphism-cost
      channel -- present (CTRL-GLV-CHANNEL, invalidation_rules).

  claim_ceiling_honesty_check:
    result: pass
    detail: >-
      Checked objective, claim_ceiling, both decision_table branch
      interpretations, success_criteria, falsification_criteria: none
      smuggles a Galbraith path-finding, isogeny-evaluation-hardness, or
      trapdoor claim. No scope leak relative to H-ECTD-001's status_scope
      (this lane is orthogonal and untouched by that weakening).

  ctrl_rho_fabrication_reoccurrence_check:
    result: pass
    detail: >-
      CTRL-RHO reuses pollard_rho_plain unchanged and explicitly disclaims
      any negation-map-specific figure, citing CORR-20260806-2f98f4 by ID
      and following its required_action verbatim. No fabricated statistic
      repeated.

  verdict: revise
  overall_rationale: >-
    The core object is well-chosen and appropriately scoped, and the
    claim-ceiling discipline is genuinely honest. The experiment contract
    has concrete, load-bearing defects that must be fixed before approval --
    most seriously, D3 is a direct, named requirement from the very
    Coordinator decision (DEC-20260806-4a9604) that authorized opening this
    lane, and it was not addressed in the frozen contract at all.

  defects:
    - id: D1
      severity: blocking
      title: >-
        decision_table is not exhaustive despite explicitly claiming to be.
      detail: >-
        specification.yaml states the two branches are "mutually exclusive
        and exhaustive given the completion gate." False: a valid run with
        >=8 completed edges where KS does not reject exchangeability but not
        every edge's ratio lies in [0.1,10] (e.g. one edge at ratio 30, below
        the 100x discontinuity threshold but above the continuity band)
        satisfies neither continuity_scoped nor discontinuity_nominates_
        endpoint, nor instrument_void, nor resource_incomplete. No branch
        fires. This gap is inherited from EXP-ECTD-001's own decision_table
        (heavy_tail_hit/scoped_homogeneity have the identical [0.1,10] vs
        [100,inf) gap), which never actually hit it in practice because the
        real observed data landed cleanly inside [0.1,10] on every meter --
        but the new spec makes a stronger, false "exhaustive" claim the
        parent spec never made.
      required_fix: >-
        Add an explicit fifth branch (moderate_effect_unresolved: KS does
        not reject AND not all ratios in [0.1,10] AND no edge >=100x -->
        report as inconclusive at the pre-registered thresholds, not as
        continuity or discontinuity) and drop the false "exhaustive" claim
        or make it true.
    - id: D2
      severity: blocking
      title: >-
        CTRL-HORIZONTAL-BASELINE has no certificate that the comparison
        sample is actually horizontal.
      detail: >-
        The control claims horizontal pairs are "already characterized" as
        ratio ~1 by H-ECTD-001/H-ISO-001, but experiments/EXP-ECTD-001/driver/isogeny.py's
        neighbors()/build_class() verify only group-order preservation
        (verify_order_preserved), never conductor/discriminant/trace/volcano
        level. For ell in {2,3,5,7}, an isogeny is horizontal only when ell
        does not divide the curve's conductor -- unchecked by the existing
        driver. The horizontal control sample could silently include
        contaminating vertical edges, biasing the primary KS statistic in an
        uncontrolled direction. CTRL-END-RING-CERTIFICATE is explicitly
        scoped only to constructed vertical isogenies, not to the horizontal
        comparison pairs.
      required_fix: >-
        Extend the new conductor-computation code to certify each
        horizontal-baseline pair's conductor is unchanged across the edge,
        and add an explicit pass_condition for that to
        CTRL-HORIZONTAL-BASELINE (or add a dedicated
        CTRL-HORIZONTAL-LEVEL-CERTIFICATE).
    - id: D3
      severity: blocking
      title: >-
        The DEC-20260806-4a9604 F-3 sampler-bug fix requirement is not
        addressed anywhere in this spec.
      detail: >-
        DEC-20260806-4a9604.minor_findings_disposed_of_in_this_record.finding_F3
        documents that driver/fp.py's random_prime(bits, rng) returns an
        EXACT-width prime, so Hasse's theorem confines the achieved N to a
        single bit-width regardless of any declared [lo,hi] band -- exactly
        what happened to EXP-ECTD-001 (declared [40,44]/[40,56], achieved
        only exactly-40-bit N throughout). DEC-20260806-4a9604's next_actions
        states in so many words: "Freeze must also require its own driver to
        correctly sample the full declared N-bit range rather than repeating
        F-3's exact-width-prime gap." H-ECTD-19017a.yaml cites
        DEC-20260806-4a9604 only for the symptom (H-ECTD-001 weakened to
        40-bit N), not the root cause or fix mandate. Neither file mentions
        fp.py, random_prime, or any fix anywhere. The new spec declares
        n_bit_range [40,60], a WIDER declared range than EXP-ECTD-001's, and
        will almost certainly repeat the identical collapse-to-one-bit-width
        failure unless explicitly required to fix it.
      required_fix: >-
        Add an explicit inputs field committing to either (a) fixing fp.py's
        sampler to genuinely vary bit-width per seed, or (b) drawing a
        distinct target bit-length per seed from [40,60] and reporting the
        achieved distribution rather than asserting the declared range, per
        DEC-20260806-4a9604's own requirement.
    - id: D4
      severity: non-blocking
      title: >-
        Budget does not account for or quantify the cost of finding
        conductor-q curves.
      detail: >-
        The experiment needs far fewer curves than EXP-ECTD-001 (roughly 34
        vs 320) yet has a LARGER budget (60 vs 40 CPU-hours), justified only
        by "new conductor/volcano code" -- the dominant hidden cost (finding
        a random ordinary curve whose conductor happens to be divisible by a
        target prime q, a rare event) is never estimated or charged.
        seed_policy discloses the risk ("additional seeds may be drawn... if
        no q-divisible conductor found") but never quantifies it; the
        experiment could plausibly burn its entire budget on seed search
        alone and land in resource_incomplete with zero completed edges.
      required_fix: >-
        Add a stated expected-attempts-per-edge estimate and either raise
        the budget accordingly or state that CM/Hilbert-class-polynomial
        construction (choosing the discriminant with the desired conductor
        factor up front) is the intended method rather than random
        search-and-filter.
    - id: D5
      severity: non-blocking
      title: instrument_void's GLV-failure clause is a compound AND that lets a genuine instrument malfunction escape voiding.
      detail: >-
        "the GLV/CM instrument fails its expected move ... WHILE Semaev
        meters are simultaneously mis-attributed" -- if the GLV instrument
        fails its expected move but nobody mis-attributes a Semaev movement
        to it, this branch does not fire even though the instrument is
        plainly broken. The mis-attribution failure mode is independently
        covered by invalidation_rules already, making the AND partly
        redundant while leaving a plain instrument failure uncovered.
      required_fix: >-
        Split into two independent OR'd conditions: (a) end-ring/conductor
        computation disagrees with actual degree on >1 edge, OR (b) GLV/CM
        instrument fails its expected move on the known pair -- matching
        EXP-ECTD-001's clean single-condition pattern.

  recommendation: >-
    Do not approve as frozen (version 1). Require a version 2 addressing D1
    (exhaustive decision table), D2 (horizontal-level certificate), D3
    (F-3 sampler-fix requirement -- highest priority, an unmet condition
    from the record that commissioned this experiment), and D4 (budget
    quantification), with D5 riding along. Re-review of version 2 before
    approval.
