review:
  id: RT-20260731-002
  task_id: TASK-20260731-049
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-002
  role: red-team
  independent_session: true
  non_originating: >-
    This session did not write the literature filings, ideation report, or the
    three IDEA records. It read only the committed BATCH-001 snapshots named in
    EV-ECTD-001 and DEC-20260731-011.
  requested_policy: review-adversarial
  reasoning_effort: xhigh
  resolved_model_id: composer-2.5-fast
  fallback_used: false
  model_verified: false
  produced_at: '2026-07-31'

  reviewed_snapshots:
    literature: TASK-20260731-028
    ideation: TASK-20260731-030
    prior_review: TASK-20260731-031
    snapshot_receipts:
      - coordination/goals/GOAL-ECTD-001/batches/BATCH-001/archives/TASK-20260731-028/snapshot-receipt.json
      - coordination/goals/GOAL-ECTD-001/batches/BATCH-001/archives/TASK-20260731-030/snapshot-receipt.json

  stance_vs_031: REVISE
  stance_rationale: >-
    Per-IDEA directions match TASK-20260731-031 (016 admit; 017/018 revise).
    Independence debt is now paid. This review does not rubber-stamp: it adds
    material objections on random-model transfer (HEUR-ECTD-TAIL-1), missing
    within-class permutation nulls for 016, promotion of the planted-outlier
    check from falsification-only to a design requirement, and over-strong
    barrier language risk on 018's three-candidate screen. Overall recommendation
    shifts from "block until independent session" to revise_before_freeze with
    explicit admit conditions on 016.

  citation_honesty_check:
    verdict: pass_with_notes
    detail: >-
      sources_note fetch log is honest and matches KN-LIT flags. citation_verified:true
      is warranted only where a local PDF or equivalent primary text exists per
      sources_note: KN-LIT-7261 (Wayback eprint mirror + live abstract),
      KN-LIT-7630 (author PDF), KN-LIT-7632 (arXiv), KN-LIT-7634 (SAC mirror),
      KN-LIT-7635 (Wayback), KN-LIT-7636 (arXiv). KN-LIT-7633 correctly remains
      citation_verified:false with documented fetch obstructions; IDEA-018 must not
      cite Dent–Galbraith theorem numbers. KN-LIT-7631 is a redirect to KN-LIT-237
      with citation_verified:read — honest, not a duplicate verified entry.
      inputs/ECTD-TESKE-20260731/briefing.md is correctly treated as UNVERIFIED
      secondary synthesis and was not used as primary evidence. Direct eprint PDF
      403 is an environment constraint; mirror use is disclosed. No title-only stub
      was upgraded to verified without a obtainable source.

  class_invariant_check:
    verdict: pass
    detail: >-
      All three IDEAs and the ideation report explicitly deprioritize hiding
      anomalous trace, MOV/low embedding degree, smooth order, and supersingular
      endpoints behind F_p-isogenies. IDEA-018 includes a class-invariant MOV
      detector and forbids pairing-on-public-embedding routes. IDEA-20260731-008's
      special-family transfer gate is correctly cited as the dual attacker-side
      question, not a designer trapdoor. Residual smuggling risk is implementation
      drift: any EXP design must keep class-invariant curves in negative-control
      arms only, not as secret endpoints.

  conflation_check:
    verdict: pass_with_notes
    detail: >-
      Distinction from H-ISO-001 (rejected_scoped on short ell-neighbors for
      m=3 d_reg and decomposition yield only) is explicit and valid: 016/017
      target full-class enumeration and conductor-stratified vertical pairs with
      heavy-tail thresholds — a strictly wider scope, not a contradiction of
      H-ISO-001. Distinction from IDEA-20260731-008 (public charged transfer to
      special families) is explicit. Notes: (1) 016 must not read H-ISO-001 as
      closing equation-dependent weakness globally; (2) 017 must not read meter
      continuity as Galbraith conductor-gap path-finding hardness; (3) 018 must
      not read supersingular KN-LIT-7634 success as ordinary-F_p transfer.

  null_control_check:
    verdict: revise_required
    detail: >-
      016 lists same-p random curves outside the class and a degree-profile null;
      017 lists horizontal pairs, coordinate-isomorphism null, and a separate
      GLV channel; 018 lists public solver, MOV detector, and supersingular harness
      control. Gaps for BATCH-002 design: (1) 016 lacks a within-class label-
      permutation null (identical meter multiset, shuffled curve IDs) to catch
      post-hoc outlier picking; (2) planted ≥100× outlier positive control appears
      only under falsification_conditions, not minimal_test.design — must be
      mandatory before any homogeneity reading; (3) degree-profile null must be
      Semaev/Weil-shaped multi-homogeneous, not an underdetermined planted system;
      (4) 017 needs preregistered horizontal-vs-vertical KS comparison as primary
      statistic, not post-hoc ratio storytelling; (5) 018 candidate (A) Cheon/auxiliary-
      input distinguishers are not trapdoor-DDH unless the trapdoor alone supplies
      the auxiliary channel — freeze or drop from the three-candidate list.

  glv_overclaim_check:
    verdict: pass
    detail: >-
      Campaign goal, RQ-ECTD-001 constraints, and all three IDEAs explicitly
      record that secret GLV/CM endomorphism alone yields at best constant-factor
      rho improvement, not a Teske-class trapdoor. IDEA-017 separates an
      endomorphism-evaluation-cost channel that must not be reported as Semaev
      sub-rho. Residual risk: 017's "known GLV/CM curve pair" instrument check
      must run only on the endomorphism-cost channel; any Semaev meter movement
      on that pair must not be promoted as vertical discontinuity evidence.

  premature_closure_check:
    verdict: revise_required
    detail: >-
      Ideation and IDEA records generally avoid global impossibility language.
      Inventor-protocol §4 risks remain in falsification wording: 016's "proceed to
      barrier wording for family (1)" after factor-10 homogeneity is only a scoped
      null on frozen meters at toy N — it must name the obstruction (e.g., absence
      of ≥100× Semaev/Macaulay outliers under stated FB/solver conventions) and
      forward guidance (path-hiding, detection, private factor-base precomputation
      remain open). 017 continuity branch must not close "vertical Teske analogues"
      without naming what Galbraith hardness vs meter continuity each establishes.
      018 correctly states three failed candidates are not a proof of impossibility;
      HEUR-ECTD-DDH-1 must not be read as a closure heuristic from a screen.

  heavy_tail_vs_trapdoor:
    verdict: separated_correctly_in_ideation
    detail: >-
      All three IDEAs state that heavy-tail or DDH-advantage meters alone do not
      constitute a trapdoor: path-hiding, public path recovery, and public
      detection are separate stages (GOAL completion criterion). Coordinator must
      preserve this separation in any EXP freeze — an outlier meter licenses only
      a follow-on path-hiding/detection experiment, not trapdoor existence.

  per_idea_verdicts:
    IDEA-20260731-016:
      verdict: admit
      rationale: >-
        Object-first endpoint-existence measurement with explicit heavy-tail
        criterion, toy claim tier, matched rho baseline, and honest distance from
        H-ISO-001 short-neighbor scope. This is the binding uncertainty for
        RQ-ECTD-001 family (1). Admit conditions for EXP design: promote planted
        outlier positive control to a required design arm; add within-class
        permutation null; tighten degree-profile null to Semaev-shaped systems;
        preregister that a null at ≥100× is "no outlier under frozen meters at
        toy N," not "no trapdoor exists"; do not credit HEUR-ECTD-TAIL-1 until
        KS/exceedance against an exchangeability null is reported — JMV expander
        mixing does not justify Semaev meter exchangeability (different object).

    IDEA-20260731-017:
      verdict: revise
      rationale: >-
        Conductor-stratified vertical meter is the right Galbraith boundary object
        and can share instrumentation with 016, but the two-sided prediction
        (continuity vs ≥100× discontinuity) requires a frozen decision table before
        design: primary statistic = KS distance between horizontal and vertical ratio
        samples; continuity barrier vs endpoint nomination branches must be mutually
        exclusive and preregistered. Forbid equating meter continuity with
        isogeny-evaluation or path-finding hardness. GLV instrument check confined
        to endomorphism-cost channel. Without these revisions, either outcome can
        be laundered as progress.

    IDEA-20260731-018:
      verdict: revise
      rationale: >-
        Needed certificate gate against silent KN-LIT-7634 → ordinary-F_p analogy
        and a legitimate intermediate objective (trapdoor DDH weaker than full
        ECDLP trapdoor). Not ready for batch design as written: three Π candidates
        are still narrative; design C depends on unverified KN-LIT-7633; candidate
        (A) risks Cheon/auxiliary-input conflation; HEUR-ECTD-DDH-1 is too strong
        for a three-candidate screen. Revise to freeze exact Π oracles (inputs,
        outputs, budgets), drop or quarantine design C until Dent–Galbraith PDF is
        filed, and require auxiliary-input-free DDH formulations. Do not admit as
        an ECDLP trapdoor lane; barrier output remains scoped to the named candidates
        only.

  overall_recommendation: revise_before_freeze
  overall_rationale: >-
    Independence debt is satisfied. IDEA-016 may proceed to hypothesis/experiment
    design after admit conditions above are embedded in the frozen contract.
    IDEA-017 and IDEA-018 require the revise items before sharing meters or
    certificate gates in EXP-ECTD-001. Do not approve or run any EXP until
    TASK-20260731-050 applies revise notes and snapshots the amended contracts.
    No trapdoor construction, exponent claim, or goal closure is supported by
    this literature/ideation package.

red_team_report:
  id: RT-20260731-002
  task_id: TASK-20260731-049
  claim_under_review: >-
    GOAL-ECTD-001 BATCH-001 ideation package: three IDEA proposals for a
    prime-field Teske analogue via secret isogeny to rare endpoint-specific
    weakness, with literature gate declared satisfied.
  objections:
    - id: O1
      title: HEUR-ECTD-TAIL-1 mis-transfers JMV expander mixing to Semaev meters
      severity: non_blocking_for_admit
      detail: >-
        JMV (KN-LIT-237) addresses near-uniformity of ECDLP difficulty across
        an endomorphism-ring level in the isogeny graph. Semaev/Macaulay meters
        are equation-dependent polynomial ideals — not exchangeable draws. The
        cheapest exposure is the within-class permutation null: if shuffling curve
        labels within a class changes which curve is called an outlier, the tail
        statistic is an artifact.
    - id: O2
      title: Planted outlier control relegated to falsification-only on 016
      severity: blocking_for_exp_freeze
      detail: >-
        Without a mandatory planted ≥100× (or d_reg −2) positive control in the
        design, a null homogeneity result cannot distinguish "no signal" from
        "instrument dead."
    - id: O3
      title: IDEA-017 two-sided prediction needs frozen decision table
      severity: blocking_for_017_design
      detail: >-
        As in TASK-20260731-031; still unresolved in the committed proposal text.
    - id: O4
      title: IDEA-018 Π list and Dent–Galbraith gap
      severity: blocking_for_018_design
      detail: >-
        Candidate objects, oracles, and budgets are not frozen; design C must not
        cite unverified KN-LIT-7633 theorems; Cheon-style (A) is not pure DDH.
    - id: O5
      title: Premature barrier wording risk on scoped nulls
      severity: non_blocking
      detail: >-
        Factor-10 homogeneity or three failed Π candidates are fatigue-adjacent
        unless restated with named obstructions and forward guidance per
        docs/inventor-protocol.md §4.
  required_controls:
    - Within-class curve-label permutation null on 016 meter ranks
    - Mandatory planted Semaev outlier positive control on 016
    - Semaev-shaped multi-homogeneous degree-profile null (not underdetermined planted system)
    - Preregistered horizontal-vs-vertical KS primary statistic on 017
    - Endomorphism-cost channel isolated from Semaev meters on 017 GLV check
    - Frozen Π oracles with auxiliary-input-free DDH formulations on 018
    - Supersingular KN-LIT-7634 harness positive control only (not ordinary transfer)
  counterexample_or_mutation: >-
    Cheapest mutation for 016: within one enumerated class, permute Weierstrass
    models by F_p-isomorphism only (already a 017 control) AND permute curve
    labels while holding the meter multiset fixed; if outlier identity changes,
    heavy-tail claims are labeling artifacts. Cheapest mutation for 018: run
    candidate (A) with and without the Cheon auxiliary channel; if advantage
    vanishes without auxiliary input, it is not trapdoor-DDH.
  baseline_comparison: >-
    Generic Pollard rho at exponent 1/2 remains the matched baseline for any
    claimed private ECDLP advantage. BSGS at similar exponent with higher memory
    is the deterministic comparator at toy N. IDEA-20260731-008 charges public
    path + special-family solve for attacker-side transfer. Secret GLV caps at
    ~2–4× rho, not Teske-class. KN-LIT-7634 supersingular trapdoor DDH is the
    closest specialized baseline for 018's DDH gate but does not transfer to
    ordinary F_p. Hidden SNFS (KN-LIT-7635) is the parameter-trapdoor gold
    standard analog, not an EC baseline. No proposal claims to beat these at
    crypto scale; toy tier only.
  heuristic_challenges:
    - HEUR-ECTD-TAIL-1 lacks rigorous support linking expander mixing to Semaev ideal statistics; treat as test hypothesis only
    - HEUR-ECTD-VERT-1 is honestly scoped as no-theorem motivation; continuity does not imply path hardness
    - HEUR-ECTD-DDH-1 must not become a closure claim from three candidate failures
  cost_model_challenges:
    - Per-curve GB/Macaulay cost must be charged in 016/017 enumeration budgets; eliminated search dimensions are not speedups until invariant cost is in the total (KN-LIT-7593 discipline)
    - Total trapdoor cost = private endpoint advantage × path-hiding success × detection evasion — none of the three IDEAs measure the product yet, correctly
    - MITM path recovery ~ ell^{1/2} noted in 018 but not integrated with 016/017 outlier findings
  reduction_and_scope_challenges:
    - No published reduction from DDH advantage to ECDLP trapdoor is claimed; keep 018 separate from completion criterion (i)
    - Galbraith (KN-LIT-7630) conductor-gap algorithmic hardness is cited but not measured by 017 meters — do not merge claims
    - affected-vs-safe scheme scope correctly absent at ideation tier
  narrowest_supported_statement: >-
    Literature gate is sufficiently honest for ideation and design opening on
    Teske-shaped prime-field trapdoor search, with one documented PDF gap
    (KN-LIT-7633). Three measurement/gate proposals are structurally aligned
    with RQ-ECTD-001 and avoid class-invariant endpoint smuggling. No empirical
    trapdoor signal, no exponent improvement, and no barrier meeting inventor-
    protocol closure standard is established. IDEA-016 is admissible as a toy
    endpoint-existence screen subject to strengthened null controls; 017/018 need
    contract revisions before EXP freeze.
  next_concrete_action: >-
    TASK-20260731-050: apply revise notes; embed 016 admit conditions; freeze
    EXP-ECTD-001 at review_required with preregistered decision tables; snapshot
    before any approval.
  artifact_paths:
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-002/reviews/TASK-20260731-049/review_report.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-002/reviews/TASK-20260731-049/objections.md
