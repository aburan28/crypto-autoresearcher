      mandatory construction rows are arithmetically impossible, and the PRNG,
      serialization, retained-rejection, discriminant, decision, and terminal
      classification contracts remain non-unique or contradictory. V4 is not
      an approvable future protocol and supplies only neutral protocol and
      custody facts, never evidence for or against H-ECTD-19017a.
    rationale:
      - >-
        The exact independent report is REVISE and carries six unresolved
        blocking objections. The frozen approval rule does not permit the
        Coordinator to overrule those objections or approve without an
        unqualified independent PASS.
      - >-
        Custody passed completely. Preserving that PASS avoids conflating a
        sound fresh snapshot with the protocol defects and avoids rewriting the
        immutable v3 false-parent history.
      - >-
        The mod-8 argument closes the recorded three-row affected set under its
        own invariant and finds two additional impossible -8 rows. Approval
        would silently redefine the required eight-slot success gate.
      - >-
        The remaining exactness defects allow implementation choices after
        freeze or contradict the bound source and frozen classifications. They
        must be repaired additively before any later approval question.
      - >-
        This is a neutral protocol-governance determination. It is not an
        implementation approval, run, target reading, feasibility result,
        scientific interpretation, research-status transition, H-ECTD or ECDLP
        claim, closure, or breakthrough.

