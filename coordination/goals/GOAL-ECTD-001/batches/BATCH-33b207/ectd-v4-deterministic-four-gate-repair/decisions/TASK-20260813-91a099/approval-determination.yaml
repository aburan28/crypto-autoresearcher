  protocol_review_synthesis:
    custody_result: PASS
    protocol_design_result: REVISE
    narrowest_supported_statement: >-
      The exact v4 and self-neutral receipt have truthful, reachable two-path
      custody, and all named read-scope, lineage, source-block, and fixture
      hashes match the independent report. The paired identity design repairs
      v3's observation collision at a local design level; Gates 3 and 4 are
