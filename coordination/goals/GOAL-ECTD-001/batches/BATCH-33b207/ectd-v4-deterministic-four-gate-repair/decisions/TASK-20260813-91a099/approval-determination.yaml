    gate_1_paired_planted_specificity:
      result: REVISE
      preserved_local_passes:
        - The same curve, subseed, factor base, sample counts, and solver caps are frozen across all three arms.
        - Ordinary and disabled-negative share effective_planting false; planted alone has effective_planting true.
        - Complete expected vectors are frozen and direct assignment is prohibited.
        - The design ceiling remains gross planted specificity only, never conductor sensitivity.
      blocking_findings:
        - id: RT-ECTD-V4-O4-PRNG
          finding: >-
            The literal source requires an identical deterministic PRNG state
            from meter_subseed but does not freeze the PRNG algorithm,
            seed-to-state conversion, version, or transitive source hash.
            Different implementations can draw different targets while
            claiming the same subseed and pipeline.
        - id: RT-ECTD-V4-O3-G1-SERIALIZATION
          finding: >-
            Gate 1 simultaneously requires RFC-8785 canonical JSON and a
            prescribed property order that is not RFC 8785 order. Both byte
            rules cannot be satisfied, so the arm serialization is not unique.

    gate_2_deterministic_cm_kernel_and_conductor:
      result: REVISE
      preserved_local_passes:
        - The exact ordered width schedule and counter domain are frozen with no seed or width substitution.
        - Both normative source-block hashes and all sixteen integer-map and first-rejection-code fixtures replay exactly.
        - Kernel representation, normalization, equivalence, multiplicity, deduplication, q-then-ell order, and endpoint-local whole-conductor checks are substantially frozen.
      blocking_findings:
        - id: RT-ECTD-V4-O1-FIVE-IMPOSSIBLE-ROWS
          affected_slot_count: 5
          affected_slots:
            - {seed: 301, target_N_bits: 40, D_K: -7, q: 29, horizontal_ell: 2}
            - {seed: 302, target_N_bits: 43, D_K: -8, q: 17, horizontal_ell: 3}
            - {seed: 304, target_N_bits: 49, D_K: -8, q: 19, horizontal_ell: 3}
            - {seed: 305, target_N_bits: 52, D_K: -7, q: 23, horizontal_ell: 2}
            - {seed: 308, target_N_bits: 60, D_K: -7, q: 29, horizontal_ell: 2}
          finding: >-
            For odd prime p and odd prime full group order N, t=p+1-N is
            odd and Delta_pi=t^2-4p is congruent to 5 modulo 8. Every scheduled
            q is odd, so q^2 is congruent to 1 modulo 8. The three D_K=-7 rows
            give 1 modulo 8 and both D_K=-8 rows give 0 modulo 8; none can
            satisfy Delta_pi=q^2*D_K. V4 records only the three -7 rows and
            materially omits seeds 302 and 304. The full eight-slot conjunction
            therefore cannot pass under the frozen semantics.
        - id: RT-ECTD-V4-O2-POINT-AND-FIELD-SERIALIZATION
          finding: >-
            The normative construction does not freeze canonical
            field-element encoding, affine and projective point encoding, or
            the point-at-infinity encoding required by subgroup, Frobenius,
            Velu, and receipt checks.
        - id: RT-ECTD-V4-O2-REJECTION-FIXTURES
          finding: >-
            The sixteen rows freeze only the integer map and first rejection
            code. They omit the canonical rejection object, slot and stage
            shapes, per-code details schema, exact serialized bytes, and
            rejection SHA-256, so they are not complete retained-rejection
            serialization fixtures.
        - id: RT-ECTD-V4-O3-RFC8785-AND-BIG-INTEGERS
          finding: >-
            Gate 2 prescribes a property order inconsistent with RFC 8785 and
            emits exact p, N, coefficients, and field elements as JSON numbers
            even though upper-anchor values can exceed 2^53. No canonical
            decimal-string or other exact big-integer encoding is frozen, so
            cross-runtime bytes are underdetermined.
        - id: RT-ECTD-V4-O2-DISCRIMINANT-ENUMERATION
          finding: >-
            The instruction "For D in [D_K,C]" does not distinguish an ordered
            two-element list, a closed interval, or a descending discriminant
            family, and does not define admissible intermediate order
            discriminants. The later H_D_K wording does not cure the ambiguity.
      approval_disposition: >-
        A deterministic rejection map is not a success-producing total
        construction. The valid obstruction is neutral protocol-governance
        information, not a reason to waive the exact eight-slot gate or approve
        a rejection-only protocol.

    gate_3_full_band_width_coverage:
      result: PASS_AS_PRESERVED_DESIGN_BLOCKED_IN_CURRENT_PROTOCOL
      exact_anchor_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
      endpoints_included: true
      maximum_adjacent_gap: 3
      exact_N_bit_length_required: true
