    decision_semantics:
      result: REVISE
      objection_id: RT-ECTD-V4-O5
      bound_source_path: experiments/EXP-ECTD-9e4248/driver/decision.py
      bound_source_sha256: 3b2f7359a72f3bd391d64ec1ab8d08922ac8d0c5b21dad6b82fb901bc90fd992
      finding: >-
        V4 says undefined KS may not be coerced to zero or nonrejection and may
        not enter a data-bearing branch. The exact bound decision.py instead
        sets ks_rejects to false when rejects is null and continues through the
        data-bearing branch calculation. Binding this source while asserting
        the opposite behavior does not define one executable decision rule.
      required_repair: >-
        Bind repaired decision source or a frozen, hash-bound pre-decision
        adapter that terminates undefined KS as a non-data-bearing condition
        and never converts it to nonrejection.

    stopping_and_classification:
      result: REVISE
      objection_id: RT-ECTD-V4-O6
      frozen_queue_semantics:
        missing_fixture_or_ambiguous_algorithm: resource_incomplete
        candidate_cap_or_budget_exhaustion: resource_incomplete
        false_or_incomplete_receipt: invalid
        post_target_gate_failure: invalid_and_target_uninterpretable
        timeout_or_crash: failed_infrastructure
      contradictory_v4_semantics:
        ambiguous_algorithm_or_missing_fixture: invalid_before_target
        gate_1_timeout: invalid_before_target
      finding: >-
        V4 changes missing or ambiguous inputs from resource_incomplete to
        invalid_before_target and locally classifies Gate-1 timeout as invalid
        while globally classifying timeout or crash as failed_infrastructure.
        These boundaries drift from the frozen task and are internally
        inconsistent. None has a scientific-hypothesis effect.

    feasibility_and_rebudget_firewall:
      result: PASS_WITH_MANDATORY_SUCCESSOR_GATES
      inherited_budget_feasible_as_written: false
      static_construction_feasible_as_written: false
      sixty_bit_matched_bsgs_memory_fit_established: false
      sixty_bit_matched_rho_cpu_fit_established: false
      all_controls_fit_established: false
      width_or_control_shrink_allowed: false
      implementation_or_execution_authorized: false
      preserved_sequence: >-
        Only after an additive v5 resolves every protocol defect and receives a
        fresh truthful snapshot plus an independent unqualified PASS may a
        separate source-bound feasibility worksheet be considered. That
        worksheet must cover the 60-bit anchor, all four gates, every unchanged
