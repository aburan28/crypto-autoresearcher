    implementation_or_execution_authorized: false
    required_sequence:
      - >-
        First approve an additive protocol successor that resolves all five
        impossible rows and the deterministic serialization/decision defects.
      - >-
        Then obtain separate independent review of a source-bound feasibility
        worksheet covering the 60-bit anchor, all four gates, every unchanged
        v2 control, and matched rho and BSGS.
      - >-
        Then obtain a separate Coordinator rebudget decision demonstrating fit
        or approving an explicit new ceiling before implementation or execution.
    cost_model_challenges:
      - >-
        A generic 60-bit BSGS witness is on the order of 2^30 stored group
        elements before table overhead, so fit within the inherited 16 GiB and
        60 CPU-hour ceiling is not established. The firewall correctly keeps
        that uncertainty open.
      - >-
        Gate-2 root, curve-isomorphism, point-count, division-polynomial,
        kernel, and complete-factorization procedures need a source-bound
        end-to-end operation and memory account. Deterministic prose does not
        establish practical fit.

  objections:
    - id: RT-ECTD-V4-O1
      severity: blocking
      category: static_construction_feasibility
      finding: >-
        The valid mod-8 obstruction affects five slots, not the recorded three;
        seeds 302 and 304 with D_K=-8 are also impossible under the frozen odd
        prime p, odd prime full-order N, odd q, exact Delta_pi=q^2 D_K semantics.
    - id: RT-ECTD-V4-O2
      severity: blocking
      category: deterministic_construction_and_rejection_replay
      finding: >-
        Gate 2 omits canonical point encoding and complete rejection-object
        fixtures, leaves the D in [D_K,C] enumeration ambiguous, and therefore
        does not yet define one implementation-independent total construction
        and retained-rejection map.
    - id: RT-ECTD-V4-O3
      severity: blocking
      category: canonical_serialization
      finding: >-
        Gate-1 and Gate-2 blocks prescribe property orders inconsistent with
        RFC-8785, and Gate 2 provides no exact big-integer rule for values above
        2^53. The claimed canonical bytes are not uniquely reproducible.
    - id: RT-ECTD-V4-O4
      severity: blocking
      category: paired_calibration_replay
      finding: >-
        Gate 1 does not identify the deterministic PRNG algorithm or
