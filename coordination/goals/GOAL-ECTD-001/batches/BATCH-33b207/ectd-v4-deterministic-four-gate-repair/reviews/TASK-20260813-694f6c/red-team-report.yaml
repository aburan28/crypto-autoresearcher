  four_gate_review:
    gate_1_paired_planted_specificity:
      local_passes:
        same_curve_a_b_p_N: true
        same_meter_subseed: true
        same_factor_base_and_sample_counts: true
        same_solver_caps_and_declared_call_order: true
        ordinary_and_disabled_effective_planting_false: true
        planted_effective_planting_true: true
        direct_assignment_explicitly_prohibited: true
        historical_ordinary_row_identity_and_vector_match_archive: true
        historical_planted_row_identity_and_vector_match_archive: true
        complete_expected_vectors_frozen_for_all_three_arms: true
        gross_planting_specificity_only_claim_ceiling: true
      result: REVISE
      blocking_exactness_defects:
        - >-
          The literal block says to initialize an identical deterministic PRNG
          state from meter_subseed but never identifies the PRNG algorithm,
          seed-to-state conversion, version, or source hash. The bound
          meters.py accepts an injected rng and imports the ordinary
          random-point constructor; it does not supply that missing PRNG
          definition. Different conforming implementations can therefore draw
          different targets while claiming the same subseed and pipeline.
        - >-
          The arm serialization simultaneously requires RFC-8785 canonical
          JSON and a non-canonical prescribed property order. RFC-8785 orders
          object properties by UTF-16 code units, whereas the listed order
          places effective_planting after planted and planting_disabled and
          places sample_counts before primary_vector and raw_sample_counts.
          An implementation cannot obey both byte rules. The exact serialized
          fixture is therefore not implementation-independent.
      observation_boundary: >-
        No Gate-1 measurement was executed in this review. The three vectors
        remain preregistered future expectations. The two retained historical
        rows and exact source/hash facts were checked statically; their presence
        is not evidence that the new paired adapter has run or will match.
      preserved_narrow_pass: >-
        The paired identity matrix and disabled-plant mutation repair v3's
        curve/subseed observation collision at the design level, subject to an
        additive exact PRNG and serialization repair. Even a future pass would
        show gross planted specificity only, never conductor sensitivity.

    gate_2_deterministic_cm_kernel_and_conductor:
      local_passes:
        exact_ordered_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
        exact_counter_domain: [0, 4999]
        seed_and_width_substitution_prohibited: true
        construction_source_hash_matches: true
        integer_map_fixture_count: 16
        counter_zero_present_for_all_slots: true
        counter_one_present_for_all_slots: true
        independently_replayed_fixture_mismatches: 0
        all_fixture_input_hashes_match: true
        all_fixture_shake_outputs_match: true
        all_fixture_u_t_p_N_and_bit_lengths_match: true
        all_fixture_first_rejection_codes_match: true
        kernel_representation_and_polynomial_order_frozen: true
        q_then_ell_role_order_frozen: true
        kernel_equivalence_multiplicity_and_deduplication_frozen: true
        endpoint_local_whole_conductor_required_for_all_sixteen_endpoints: true
        copied_declarations_and_q_part_only_certificates_rejected: true
      static_feasibility_obstruction:
        recorded_id: ECTD-V4-STATIC-OBS-DK7-MOD8
        recorded_derivation_for_D_K_minus_7: correct
        recorded_affected_slot_count: 3
        independent_affected_slot_count: 5
        undercounted_slots:
          - {seed: 302, target_N_bits: 43, D_K: -8, q: 17, horizontal_ell: 3}
          - {seed: 304, target_N_bits: 49, D_K: -8, q: 19, horizontal_ell: 3}
        exact_derivation: >-
          For odd prime p and odd prime full group order N,
          t=p+1-N is odd. Hence t^2-4p is congruent to 1-4=5 modulo
          8. For every scheduled odd q, q^2 is congruent to 1 modulo 8.
          Thus q^2*D_K can equal Delta_pi only if D_K is congruent to 5
          modulo 8. The -7 rows give 1 modulo 8 and the -8 rows give 0
          modulo 8, so seeds 301, 302, 304, 305, and 308 are all impossible
          under the exact frozen prime/full-order semantics. Only the -11 and
          -19 rows pass this necessary congruence check.
        recorded_three_slot_claim_is_complete: false
        complete_eight_slot_conjunction_can_pass: false
        implementation_execution_or_target_access_admissible: false
        hypothesis_effect: none
      result: REVISE
      blocking_exactness_defects:
        - >-
          The obstruction is a valid fail-closed discovery, but it is
          materially incomplete: both D_K=-8 rows are impossible for the same
          mod-8 reason. The amendment repeatedly says three affected rows and
          freezes an affected-slot set that omits seeds 302 and 304.
        - >-
          The normative source does not define the canonical serialization of
          affine/projective points, the point at infinity, or field elements
          used by subgroup, Frobenius, Velu, and receipt checks, despite the
          frozen task requiring integer, coefficient, field-element, point,
          polynomial, and rejection serialization.
        - >-
          The 16 fixture rows verify only the integer map and first rejection
          code. They do not contain the declared canonical rejection object,
          stage value, slot object shape, per-code details mapping, serialized
          bytes, or rejection SHA-256. Consequently they are not complete
          rejection-serialization fixtures and cannot distinguish two
          implementations that emit different retained rejection records.
        - >-
          Rejection serialization requires RFC-8785 canonical JSON while also
          prescribing keys in the order schema, slot, counter, stage, code,
          input_sha256, details. That is not RFC-8785's property order. Exact
          p, N, coefficients, and field elements can also exceed 2^53 at the
          upper anchors, yet the rule emits them as JSON numbers rather than
          canonical decimal strings or another explicit big-integer encoding.
          Exact cross-runtime bytes are therefore underdetermined.
        - >-
          `For D in [D_K,C]` does not say whether the brackets are the ordered
          two-element list [D_K,C], the ordinary closed interval (empty because
          C=q^2*D_K is more negative), or a descending discriminant family. It
          also does not define which intermediate integers are admissible order
          discriminants. The later H_D_K source rule suggests a two-element
          intent, but suggestion is insufficient for the claimed total map.
      approval_attack: >-
        V4 cannot receive PASS because it noticed an obstruction. Detecting and
        preserving the obstruction is good protocol-governance evidence, but
        the approval question is whether this exact snapshot defines an
        admissible future eight-slot protocol. It does not: five mandatory
        slots have no possible successful candidate, the atomic conjunction is
        false, and v4 itself requires an additive successor before Gate 1.
        V4 also cannot receive PASS despite the obstruction merely because the
        rejection map is deterministic. A total failure/rejection map is not a
        total success-producing construction, and approval would silently
        replace the frozen eight-slot success gate with a rejection-only
        protocol. REVISE is proportional because the defects admit an additive
        successor; FAIL would overstate them as evidence against ECTD.

    gate_3_full_band_width_coverage:
      result: PASS_AS_PRESERVED_DESIGN_BLOCKED_IN_CURRENT_PROTOCOL
      declared_integer_domain_minimum: 40
      declared_integer_domain_maximum: 60
      exact_anchor_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
      endpoints_included: true
      maximum_adjacent_gap: 3
      exact_width_object: prime_full_group_order_N
      exact_N_bit_length_required: true
      failed_slot_seed_and_width_substitutions_prohibited: true
      scope: >-
        This is an eight-anchor maximum-spread design, not an exhaustive sweep
        of every integer width 40 through 60. Because five construction slots
        are statically impossible, the gate cannot currently pass; that is a
        protocol resource/admissibility failure with no hypothesis effect.

    gate_4_glv_base_point_witness:
      result: PASS
      exact_static_arithmetic_replayed: true
      independently_selected_first_x: 5
      independently_selected_Q_affine: [5, 441745542581]
      independently_selected_P_affine: [709722602244, 157661366587]
      P_on_curve: true
      subgroup_order_check: true
      full_order_factorization_check: true
      eigenvalue_polynomial_check: true
      independently_replayed_phi_P_affine: [681317832440, 157661366587]
      independently_replayed_lambda_P_affine: [681317832440, 157661366587]
      phi_P_on_curve: true
      phi_P_equals_lambda_P: true
      channel_isolated_from_semaev_and_ks: true
      interpretation_limit: >-
        This is exact static witness replay only. It is not an endomorphism-cost
        measurement, a curve experiment, target evidence, or evidence that a
        future implementation will serialize every required field.

  decision_semantics_review:
    local_passes:
      alpha: 0.05
      c_alpha: 1.36
      critical_value_formula: 1.36*sqrt((n+m)/(n*m))
      rejection_comparison: strict_D_greater_than_d_crit
      equality_rejects: false
      homogeneity_band: [0.1, 10]
      homogeneity_endpoints_inclusive: true
      extreme_ratio_threshold_and_comparison: greater_than_or_equal_100
      delta_d_reg_threshold_and_comparison: greater_than_or_equal_2
      zero_median_zero_maximum_has_no_finite_ratio_or_signal: true
      zero_median_positive_maximum_is_unbounded_and_extreme: true
      ks_infinite_censor_counts_retained: true
      ks_all_censored_returns_undefined: true
      ks_and_decision_source_hashes_match: true
      integer_and_rational_components_required: true
    result: REVISE
    blocking_source_contradiction: >-
      V4 says undefined KS may not be coerced to zero or nonrejection and may
      not enter a data-bearing branch. The exact bound decision.py instead sets
      `ks_rejects = ... else False` when ks_result["rejects"] is None. It then
      continues through the three data-bearing branch calculation. Binding
      this source hash while asserting the opposite behavior does not define
      one executable decision rule. An additive successor must either bind a
      repaired source or define and hash a pre-decision adapter that terminates
      undefined KS as non-data-bearing resource/instrument invalidity.

  stopping_and_classification_review:
    result: REVISE
    preserved_passes:
      candidate_cap_or_budget_exhaustion: resource_incomplete
      timeout_or_crash_global: failed_infrastructure
      false_or_incomplete_receipt: invalid
      post_target_gate_failure: invalid_and_target_uninterpretable
      nonvalid_terminal_hypothesis_effect: none
    blocking_contract_drift:
      frozen_queue_required: >-
        Missing fixtures, ambiguous algorithms, candidate-cap exhaustion, or
        budget exhaustion are resource_incomplete; false or incomplete receipts
        and post-target gate failure are invalid; timeout or crash is
        failed_infrastructure.
      v4_ambiguous_algorithm_or_missing_fixture: invalid_before_target
      v4_gate_1_timeout: invalid_before_target
      contradiction: >-
        V4 changes missing/ambiguous from resource_incomplete to invalid and
        locally classifies Gate-1 timeout as invalid while globally classifying
        timeout/crash as failed_infrastructure. These are mutually inconsistent
        terminal semantics and violate the frozen producer card. They must be
        reconciled additively before approval; none supplies hypothesis evidence.

