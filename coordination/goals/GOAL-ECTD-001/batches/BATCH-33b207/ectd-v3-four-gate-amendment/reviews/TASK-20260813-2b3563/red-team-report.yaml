  four_gate_review:
    gate_1_positive_sensitivity:
      identity_and_arithmetic_checks:
        meter_source_sha256: 8a90c94b5a2b7101b4266224c441f34552cb786ed51120c4396df87c22fe312f
        meter_source_hash_matches_v3: true
        fixture_source_sha256: 7b7de179f1371b89ed82c3d3613a0f41db52efd999e2ffcf3aa7ac3345404a2a
        fixture_source_hash_matches_v3: true
        ordinary_row_identity_matches: true
        ordinary_curve_nonsingular: true
        ordinary_exact_vector:
          - {numerator: 0, denominator: 1}
          - {numerator: 0, denominator: 1}
          - {numerator: 0, denominator: 1}
          - 14
          - 2
        planted_row_identity_matches: true
        planted_curve_nonsingular: true
        planted_exact_vector:
          - {numerator: 1, denominator: 32}
          - {numerator: 3, denominator: 256}
          - {numerator: 1, denominator: 1}
          - 14
          - 2
        exact_vector_cardinality: 2
      result: REVISE
      challenge: >-
        The frozen pair establishes reproducibility and gross nonconstancy, but
        it does not isolate planted sensitivity. It changes the curve, the meter
        subseed, and the planted flag simultaneously. In addition,
        compute_curve_meters assigns the planted fb_decomposition_probability
        directly to 1.0 instead of measuring it with the ordinary random-target
        sampling path. Consequently the pass can be explained by the explicit
        planted branch itself and cannot estimate false-positive specificity or
        attribute the difference uniquely to the intervention. This is not a
        conductor-sensitivity objection; v3 correctly disclaims that stronger
        conclusion. It is a protocol-identifiability defect in the claimed
        planted calibration.
      cheapest_discriminating_control: >-
        Add one paired identity matrix under the exact meter hash: run the same
        canonical curve and same subseed once with planted=false and once with
        planted=true, and add at least one negative mutation that preserves the
        same curve, seed, sample counts, and serialization but disables the
        forced-decomposable target. Require the negative mutation to recover the
        ordinary vector and the planted arm to recover the planted vector. Keep
        the existing two archived fixture rows as byte-identity controls.

    gate_2_whole_conductor_equality:
      static_mathematical_checks:
        fundamental_discriminants_verified: [-7, -8, -11, -19]
        all_eight_Kronecker_DK_q_equal_one: true
        all_eight_Kronecker_DK_ell_equal_one: true
        all_eight_gcd_q_ell_equal_one: true
        conductor_logic_boundary: >-
          If endpoint-local computation verifies Delta_pi=q^2*D_K with
          fundamental D_K, then f_pi=q and the only possible whole conductor
          integers are 1 and q. Under the stated q-stable-kernel count theorem,
          q+1 maps to 1 and 1 maps to q; every other count correctly fails
          closed. Equality of both independently obtained whole integers is
          strictly stronger than the historical gcd/q-part substitute.
      result: REVISE
      challenges:
        - >-
          The deterministic construction is not an algorithm. "counter order
          ascending 0 through 4999 from the frozen seed" never defines how
          (seed, counter, target_N_bits, D_K, q) maps to trace, p, prime subgroup
          order N, a CM curve, or a vertical pair. Different implementations can
          search different candidate spaces while all claiming compliance,
          creating an outcome-dependent witness choice after the protocol is
          frozen.
        - >-
          "Enumerate and verify all Frobenius-stable cyclic q-kernels" is not
          operationally frozen: the representation field, kernel equivalence,
          multiplicity/deduplication rule, enumeration order, verification
          theorem, and source path/hash are absent. A receipt field named
          algorithm_source_sha256 cannot repair an algorithm selected only
          after results are available.
        - >-
          The horizontal ell-kernel rule is canonical only after candidates
          exist; it likewise lacks the exact polynomial normalization,
          isomorphism canonicalization, and rejection serialization needed to
          make "first" implementation-independent.
      cheapest_discriminating_control: >-
        Add a source-bound v4 construction specification or pseudocode that
        gives the exact integer map from every scheduled seed/counter to
        t,p,N and the CM curve, canonical coefficient and polynomial
        serialization, the complete q-kernel count algorithm including
        equivalence/deduplication, and the horizontal ell candidate order.
        Freeze its SHA-256 before any implementation or candidate search, then
        statically replay counters 0 and 1 plus one rejection fixture for every
        slot. Do not freeze only the eventual successful candidates.

    gate_3_full_band_width_coverage:
      result: PASS
      exact_anchor_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
      endpoints_included: true
      maximum_adjacent_gap: 3
      exact_N_bit_length_required: true
      substitutions_prohibited: true
      semantics_honest: >-
        The amendment explicitly calls this eight prespecified strata over the
        40-through-60 band and expressly disclaims an exhaustive 21-width sweep.
        The pass condition requires exact ordered anchors and therefore repairs
        the undeclared 40-through-44 candidate restriction without inflating
        the tested scope to every integer width.

    gate_4_glv_witness_replay:
      result: PASS
      static_fixture_checks:
        p_is_prime: true
        N_prime_subgroup_is_prime: true
        N_full_factorization: '463 * 2323111831'
        cofactor_product_matches: true
        curve_nonsingular: true
        zeta3_nonidentity_cube_root: true
        zeta3_polynomial_zero_mod_p: true
        lambda_polynomial_zero_mod_subgroup_order: true
        independently_selected_first_x: 5
        independently_selected_Q_affine: [5, 441745542581]
        independently_selected_P_affine: [709722602244, 157661366587]
        independently_replayed_phi_P_affine: [681317832440, 157661366587]
        independently_replayed_lambda_P_affine: [681317832440, 157661366587]
        phi_equals_lambda_P: true
        N_prime_subgroup_times_P_is_identity: true
        all_prior_x_candidates_rejected_by_frozen_rule: true
      scope_note: >-
        This static arithmetic replay demonstrates that the frozen witness rule
        is complete enough to regenerate the canonical base point and equality.
        It is not an experiment, an endomorphism-cost measurement, or evidence
        that the future implementation will serialize the required fields.

  budget_and_stopping_review:
    result: PASS_WITH_MANDATORY_FUTURE_GATE
    inherited_budget_feasible_as_written: false
    rationale: >-
      A 60-bit generic BSGS can require about 2^30 stored group elements, which
      is plausibly above 16 GiB after real per-entry overhead; matched rho can
      require about 2^30 group operations. V3 does not pretend those costs fit.
      It authorizes zero experiment runs and requires a separate source-bound
      feasibility worksheet and Coordinator rebudget decision without shrinking
      or substituting the width schedule. That fail-closed boundary is the
      correct protocol-design disposition.
    maximum_runs_authorized_by_v3: 0
    implementation_authorized_by_v3: false
    execution_authorized_by_v3: false
    candidate_cap_per_slot: 5000
    candidate_cap_exhaustion: resource_incomplete
    budget_exhaustion: resource_incomplete
    timeout_or_crash: failed_infrastructure
    false_or_incomplete_receipt: invalid
    gate_failure_after_target_bytes_exist: invalid_and_target_uninterpretable
    target_access_ordering: all_four_gates_and_v2_controls_before_target_reading

  threshold_and_serialization_review:
    result: REVISE
    strengths:
      - Exact rational numerator/denominator serialization is required.
      - Integer counts must be retained beside rendered floats.
      - The ratio band, 100x threshold, d_reg delta two, and decision branches are declared unchanged.
      - Post-data threshold retuning is expressly prohibited.
    challenge: >-
      The v2 prose calls the KS alpha pre-registered but does not state its
      numeric value; the exact 0.05 alpha, 1.36 critical constant, and strict
      comparison live in driver/ks.py. V3 says the alpha is unchanged but does
      not bind that source path or hash. The current source SHA-256 is
      37d449f6d4878808839312f5a5c7051ccdefd8e874c70b65a7b76927d7754930,
      while decision.py is
      3b2f7359a72f3bd391d64ec1ab8d08922ac8d0c5b21dad6b82fb901bc90fd992.
      An exact future protocol should not require a reader to infer the numeric
      threshold from historical invalid-run code.
    cheapest_repair: >-
      Freeze alpha=0.05, c_alpha=1.36, the strict D>d_crit comparison, ratio
      zero handling, band inclusivity, and both source hashes directly in the
      additive amendment. This changes no threshold and reads none from target
      output; it only removes ambiguity.

