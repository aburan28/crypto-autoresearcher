  claim_ceiling_review:
    result: PASS
    maximum_supported_claim_if_repaired_and_later_executed_validly: >-
      Instrument and control admissibility for one frozen toy-scale eight-anchor
      measurement, followed only by the unchanged v2 data-bearing decision
      table. Gate 1 proves gross pipeline variation at most and never conductor
      sensitivity by itself.
    forbidden_inferences_preserved:
      - trapdoor existence
      - private path hiding
      - public detection or Galbraith path-finding hardness
      - isogeny-evaluation hardness
      - cryptographic-scale transfer
      - an ECDLP exponent or concrete attack improvement
      - hypothesis, goal, closure, or breakthrough status

  objections:
    - id: RT-ECTD-V3-O1
      severity: blocking
      category: snapshot_receipt_integrity
      finding: The immutable receipt asserts the wrong snapshot parent.
    - id: RT-ECTD-V3-O2
      severity: blocking
      category: planted_control_identifiability
      finding: Gate 1 does not isolate planted mode from curve and subseed changes.
    - id: RT-ECTD-V3-O3
      severity: blocking
      category: deterministic_construction
      finding: Gate 2 does not define the seed/counter-to-CM-candidate function.
    - id: RT-ECTD-V3-O4
      severity: blocking
      category: conductor_enumeration_replay
      finding: Gate 2 does not freeze an implementation-independent q-kernel counting algorithm.
    - id: RT-ECTD-V3-O5
      severity: non_blocking_but_required_for_exactness
      category: threshold_binding
      finding: The numeric KS rule is not frozen in v3 or bound by source hash.

  required_controls:
    - Same-curve, same-subseed planted/ordinary paired calibration plus a planting-disabled negative mutation.
    - Static seed/counter construction fixtures and rejection fixtures frozen before candidate search.
    - Canonical q-kernel enumeration and horizontal-kernel normalization replay fixtures.
    - Exact numeric KS/ratio semantics and source hashes frozen without threshold changes.
    - Source-bound 60-bit rho/BSGS and all-control feasibility worksheet before any execution authorization.

  counterexample_or_mutation: >-
    For Gate 1, retain curve index 63 and meter_subseed 20103063 but toggle only
    planted=false. The current contract has no expected vector or pass condition
    for that identity-preserving mutation, so a curve/subseed artifact cannot be
    distinguished from the intended planted response. For Gate 2, two
    implementations may map the same seed/counter to different traces or
    normalize duplicate q-kernels differently and still satisfy the prose;
    selecting whichever implementation finds a candidate is an unregistered
    post-freeze existential choice.

  baseline_comparison: >-
    Relative to frozen v2 and the INVALID historical run, v3 correctly makes
    four-gate admission conjunctive, replaces q-part-only horizontal evidence
    with endpoint-local whole-conductor equality, freezes honest eight-anchor
    40-through-60 coverage, makes the GLV point witness replayable, authorizes
    zero runs, and preserves the toy claim ceiling. It remains below an
    executable frozen protocol because the sensitivity contrast and CM/kernel
    construction are not identified precisely enough, and its snapshot receipt
    contains a false parent assertion.

  heuristic_challenges: []
  cost_model_challenges:
    - >-
      The inherited 16 GiB/60 CPU-hour ceiling is not demonstrated feasible at
      the 60-bit anchor. V3 correctly blocks rather than assumes fit; no future
      dispatch may omit the required source-bound feasibility/rebudget decision.
  reduction_and_scope_challenges: []
  proof_architecture_challenges:
    - >-
      Observation-fiber attack on Gate 1: a curve/subseed effect and the planted
      intervention inhabit the same observed two-vector contrast; the missing
      separator is a paired identity-preserving toggle.
    - >-
      Quantifier-order attack on Gate 2: absent the candidate map and kernel
      normalization, the implementation can be selected after learning which
      witnesses exist. Freeze the construction before candidate search.
    - >-
      Method-ceiling attack passes after repair: the gates can support only
      instrument/control admissibility, exactly as v3's authority boundary says.

  narrowest_supported_statement: >-
    The exact v3 and receipt bytes are durably identifiable by the completed
    queue's content-first hashes, and static arithmetic confirms the frozen
    fixture vectors, discriminant/splitting schedule, eight width anchors, and
    complete GLV replay constants. V3 honestly authorizes zero runs and no
    scientific or status effect. The snapshot receipt itself is internally
    false about its parent, Gate 1 does not identify planted specificity, and
    Gate 2 is not yet a deterministic executable construction. Therefore the
    exact v3 snapshot is not approvable without additive revision.

  cheapest_repair: >-
    Preserve all committed bytes. First, the Coordinator should add an immutable
    correction or superseding custody record that cites the receipt hash,
    records actual parent f275ae78c24fc6fccda0a362cf26d86813e33b89, and keeps
    the two externally verified content hashes. Second, author additive v4 that
    adds the paired Gate-1 identity/mutation control, an exact source-bound
    seed/counter CM construction and q/ell-kernel enumeration, and explicit
    numeric KS/ratio semantics. Snapshot v4 content-first and obtain a fresh
    independent adversarial review. Do not edit v3, the receipt, the historical
    runs, EV-ECTD-4c8a3b, DEC-20260812-06bf94, the hypothesis, or the goal.

  next_concrete_action: >-
    Coordinator records the additive receipt-parent correction and freezes v4
    with the three protocol repairs above; no implementation, curve run, target
    access, feasibility claim, or scientific interpretation is authorized.

  zero_authority_boundary:
