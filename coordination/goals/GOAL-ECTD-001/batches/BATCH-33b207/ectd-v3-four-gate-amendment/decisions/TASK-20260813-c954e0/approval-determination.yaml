  review_findings:
    snapshot_receipt_integrity:
      result: REVISE
      objection_id: RT-ECTD-V3-O1
      severity: blocking
      finding: >-
        The immutable receipt asserts parent
        f275ae78c01366b05038cb737287954186279f85, while snapshot commit
        23799884e889f033e75fefd42e09ee92fcb83c8f has actual first parent
        f275ae78c24fc6fccda0a362cf26d86813e33b89.
      disposition: preserved_not_overruled

    gate_1_positive_sensitivity:
      result: REVISE
      objection_id: RT-ECTD-V3-O2
      severity: blocking
      passed_local_facts:
        meter_source_hash_matches: true
        fixture_source_hash_matches: true
        ordinary_fixture_matches: true
        planted_fixture_matches: true
        exact_vector_cardinality: 2
      finding: >-
        The two frozen rows establish byte-reproducible gross nonconstancy only.
        They change curve, meter subseed, and planted flag simultaneously, and
        the planted branch directly assigns the factor-base decomposition value
        rather than measuring it through the ordinary random-target path. The
        contrast therefore neither identifies planted specificity nor estimates
        false-positive behavior; it correctly does not establish conductor
        sensitivity.
      required_control: >-
        Use one canonical curve and one identical meter subseed for planted
        false and true arms, plus a same-curve, same-subseed, same-sample-count,
        same-serialization negative arm that disables the forced-decomposable
        planting mechanism. Retain the two existing archived rows as exact
        byte-identity controls.
      disposition: preserved_not_overruled

    gate_2_whole_conductor_equality:
      result: REVISE
      objection_ids:
        - RT-ECTD-V3-O3
        - RT-ECTD-V3-O4
      severity: blocking
      passed_local_facts:
        verified_fundamental_discriminants: [-7, -8, -11, -19]
        all_eight_Kronecker_DK_q_equal_one: true
        all_eight_Kronecker_DK_ell_equal_one: true
        all_eight_gcd_q_ell_equal_one: true
        endpoint_local_whole_integer_equality_stronger_than_q_part_only: true
      findings:
        - >-
          The phrase ascending counters from a frozen seed does not define the
          exact map from seed, counter, width, D_K, and q to t, p, N, the CM
          curve, or the vertical pair. Implementations can search different
          candidate spaces after freeze and still claim compliance.
        - >-
          The q-kernel count omits the representation field, kernel equivalence,
          multiplicity and deduplication rules, enumeration order, verification
          theorem, source path, and frozen source hash. A receipt hash chosen
          after results cannot freeze the algorithm prospectively.
        - >-
          The ell-kernel choice omits exact polynomial normalization,
          isomorphism canonicalization, candidate order, and rejection
          serialization, so first remains implementation-dependent.
      required_control: >-
        Freeze before any search one source-bound exact seed/counter map,
        canonical coefficient and polynomial serialization, complete q-kernel
        enumeration with equivalence and deduplication, and horizontal
        ell-kernel order. Bind source hashes and replay counters zero and one
        plus at least one rejection fixture for every slot; do not freeze only
        eventual successful candidates.
      disposition: preserved_not_overruled

    gate_3_full_band_width_coverage:
      result: PASS
      exact_anchor_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
      endpoints_included: true
      maximum_adjacent_gap: 3
      exact_N_bit_length_required: true
      substitutions_prohibited: true
      scope: >-
        Eight prespecified maximum-spread strata over the 40-through-60 band,
        not an exhaustive twenty-one-width sweep.
      preservation_requirement: preserve_exactly_in_successor

    gate_4_glv_witness_replay:
      result: PASS
      curve_and_subgroup_constants_replayed: true
      independently_selected_first_x: 5
      independently_selected_P_affine: [709722602244, 157661366587]
      independently_replayed_phi_P_affine: [681317832440, 157661366587]
      independently_replayed_lambda_P_affine: [681317832440, 157661366587]
      phi_equals_lambda_P: true
      subgroup_check_passed: true
      scope: >-
        The static replay confirms the completeness of the frozen witness rule;
        it is not an experiment, an endomorphism-cost measurement, or evidence
        that a future implementation will serialize the required fields.
      preservation_requirement: preserve_exactly_in_successor

    threshold_and_serialization:
      result: REVISE
      objection_id: RT-ECTD-V3-O5
      severity: non_blocking_but_required_for_exactness
      passed_local_facts:
        exact_rational_serialization_required: true
        integer_counts_retained: true
        post_data_threshold_retuning_prohibited: true
      finding: >-
        V3 inherits the KS rule by prose without stating alpha 0.05, critical
        constant 1.36, or strict D greater-than d_crit, and without binding the
        KS and decision sources. Ratio zero handling and band inclusivity must
        also be explicit.
      required_constants_and_sources:
        alpha: 0.05
        c_alpha: 1.36
        comparison: strict_D_greater_than_d_crit
        ks_source_path: experiments/EXP-ECTD-9e4248/driver/ks.py
        ks_source_sha256: 37d449f6d4878808839312f5a5c7051ccdefd8e874c70b65a7b76927d7754930
        decision_source_path: experiments/EXP-ECTD-9e4248/driver/decision.py
        decision_source_sha256: 3b2f7359a72f3bd391d64ec1ab8d08922ac8d0c5b21dad6b82fb901bc90fd992
        ratio_zero_handling_and_band_inclusivity: freeze_explicitly_without_threshold_change
      disposition: preserved_not_overruled

    budget_and_stopping:
      result: PASS_WITH_MANDATORY_FUTURE_GATE
      inherited_budget_feasible_as_written: false
      sixty_bit_bsgs_memory_fit_established: false
