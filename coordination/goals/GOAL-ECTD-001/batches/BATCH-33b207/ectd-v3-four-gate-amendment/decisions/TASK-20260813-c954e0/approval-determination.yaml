    ell-kernel algorithms; and the exact KS constants and source hashes remain
    implicit. Under the frozen rule, only an unqualified PASS without dissent
    can approve the protocol definition. V3 therefore remains unapproved and
    immutable. Gates 3 and 4, the mandatory feasibility firewall, historical
    immutability, and the claim ceiling remain valid protocol findings, but do
    not cure the blocking defects.

