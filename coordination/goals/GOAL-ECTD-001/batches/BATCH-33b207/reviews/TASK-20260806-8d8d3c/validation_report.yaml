        baseline explicitly disclaims any negation-map figure.

  # ==========================================================================
  # PROOF-ARCHITECTURE CHECKS
  # ==========================================================================
  proof_architecture_checks:
    - id: PA-1
      result: NOT APPLICABLE
      reason: >-
        EXP-ECTD-9e4248 is an empirical measurement contract, not a
        proof-oriented proposal: it carries no proof_search_map, no theorem, no
        asymptotic bound and no reduction, and H-ECTD-19017a's asymptotic_claim
        block explicitly states "No asymptotic claim ... measurement-only at
        claim_tier toy". docs/inventor-protocol.md section 8 and KN-TECH-080
        therefore do not bind this package. Recorded as not-applicable with the
        reason rather than silently omitted.
    - id: PA-2
      check: >-
        Scaled-down-instance ladder (inventor-protocol section 6) -- does a
        speedup or improvement claim require the ladder here?
      result: >-
        NOT APPLICABLE. No speedup, ratio-against-baseline or improvement is
        claimed anywhere in the package; the rho/BSGS figures are declared
        baselines, not comparisons. The ladder's step-2 obligation (the whole
        pipeline on a scaled-down instance with the improvement appearing as a
        measured ratio) has nothing to attach to. Recorded so a later reader does
        not mistake its absence for an omission.

  # ==========================================================================
  # WHAT THIS PACKAGE DOES SUPPORT
  # ==========================================================================
  what_the_package_does_support: >-
    Recorded so the Coordinator does not over-discount work that is sound. (1)
    The vertical-edge construction is correct and independently corroborated: I
    recovered f=q and the declared D_K on all 8 edges from D_pi = t^2-4p, a check
    the run did not perform, and it agrees with the certificates' own kernel
    counts and j-invariant cross-check. CTRL-END-RING-CERTIFICATE passes 8/8 on a
    stronger basis than the run itself established. (2) All 18 discrete-log
    certificates verify under independently written arithmetic. (3) The runs are
    genuinely deterministic and reproducible across OS and interpreter version --
    I rebuilt two edges from scratch and every mathematical field matched. (4) The
    exact-width-prime sampling gap that DEC-20260806-4a9604 required be fixed did
    not recur. (5) The prior invalid run is preserved intact and its bug is really
    fixed in code, not merely asserted. (6) Reuse byte-identity holds for all 14
    shared modules. (7) claim_tier toy is respected in every artifact. (8) The
    Executor disclosed both defeating problems rather than burying them, which is
    why this review could reach a determinate answer at all -- nothing here is a
    fabrication or an integrity violation under core rule 9.

  # ==========================================================================
  # LIMITATIONS OF THIS REVIEW
  # ==========================================================================
  limitations:
