      metric: ks_distance_vertical_vs_horizontal
      method: >-
        Rebuilt both samples from raw-result.json completed_edges_detail (5
        primary meters x 8 vertical edges = 40; same for the 8 horizontal pairs
        = 40) and computed D = sup|F1-F2| with my own implementation.
      reported: {D: 0.0, n: 40, m: 40, d_crit: 0.30410524493997143, alpha: 0.05, rejects: false}
      recomputed: {D: 0.0, n: 40, m: 40, d_crit: 0.30410524493997143, rejects: false}
      result: MATCH
      material_caveat: >-
        Both samples consist of the single value 1.0, forty times. D=0.0 is
        arithmetic, not empirical: it is the KS distance between two identical
        degenerate point masses. See F-1.
    - id: MR-2
      metric: vertical_ratio_per_meter / horizontal_ratio_per_meter / delta_d_reg_per_edge
      method: Recomputed every ratio from the underlying meter values on all 32 measured curves.
      result: >-
