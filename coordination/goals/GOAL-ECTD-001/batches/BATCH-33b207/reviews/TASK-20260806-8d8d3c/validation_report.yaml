    - id: CM-2
      check: Memory reported alongside time
      result: >-
        FAIL (minor). peak_rss_bytes and cpu_seconds are null in both manifests
        (VD-9). Wall time is reported; memory is not measured. Honest null, but
        the artifact policy asks for resource measurements and the Macaulay
        matrices (75x91) are the one place memory could have been recorded
