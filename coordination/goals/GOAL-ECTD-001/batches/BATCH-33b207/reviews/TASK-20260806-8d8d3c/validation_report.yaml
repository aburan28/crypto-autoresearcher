    The artifacts are honest, complete, internally consistent and reproducible,
    but the receipt does not support the decision_branch it records: the primary
    meter has zero dynamic range at this configuration (so continuity_scoped is
    arithmetically forced, not measured), and CTRL-HORIZONTAL-BASELINE was not
    executed as frozen -- executing it myself shows the horizontal sample
    contains a genuine vertical edge, which under the contract's own exclusion
    rule leaves 7 admissible pairs and routes the frozen table to
    resource_incomplete.

  policy_and_model_metadata:
    requested_policy: review-adversarial
    requested_reasoning_effort: xhigh
    honoured: true
    resolved_model_id: claude-opus-5
    handoff_recorded_resolved_model_id: claude-sonnet-5
    fallback_used: true
    fallback_reason: >-
      This harness resolves no policy aliases; the session model answered
      instead of the policy's bound model. The dispatch_queue handoff for this
      task records claude-sonnet-5; the model that actually answered is
      claude-opus-5, recorded here rather than silently inheriting the handoff's
      value. review-adversarial's substantive requirements (xhigh effort,
      independent session, reviewer that did not originate the claim) are met.
    model_verified: false
    independence:
      session_independent: true
      model_independent: false
      note: >-
        I did not originate, execute, or edit any reviewed artifact. I read the
        Coordinator-committed snapshot at 7cc3c4b5 and confirmed the worktree is
        byte-identical to it for every reviewed path (git diff --stat HEAD --
        experiments/EXP-ECTD-9e4248 is empty). The producing/verifying executor
        session also resolved to claude-opus-5 (see the screen run.yaml
        schema_completion.executor_session_inference block), so this review is
        session-independent but NOT model-independent. That is a real limitation
        of this harness, recorded rather than glossed.

  claim_ceiling_restated: >-
    TOY ONLY. Nothing in this review or in the package it reviews supports an
    ECDLP claim, a speedup, a trapdoor, path-hiding, Galbraith path-finding
    hardness, or promotion of any kind. A failed verdict here is an
    evidence-integrity finding about a receipt; per AGENTS.md rule 5 and the
    frozen contract's own falsification_criteria it is NOT negative mathematical
    evidence against H-ECTD-19017a. I do not rule on whether the hypothesis is
    supported or refuted and I assign no research decision -- both are the
    Coordinator's.

  # ==========================================================================
  # RECOMPUTED DECISION BRANCH  (the completion gate's central question)
  # ==========================================================================
  recomputed_decision_branch:
    as_delivered: continuity_scoped
    as_delivered_note: >-
      CONFIRMED. I rebuilt both ratio samples from raw-result.json's
      completed_edges_detail (not from any summary), reimplemented the two-sample
      KS statistic independently, and applied the five frozen branches in frozen
      order. n=m=40, D=0.0, d_crit(0.05)=0.30410524493997143, rejects=False;
      end_ring_fail_count=0; glv passes its expected move; 8 completed edges and
      8 horizontal pairs; any_edge>=100_or_delta2=False; all_edges_in_band=True
      -> continuity_scoped. The producer's reported branch is exactly what the
      frozen table yields from the delivered artifact set. No post-hoc threshold
      change: RATIO_THRESHOLD=100, BAND=[0.1,10], DELTA_D_THRESHOLD=2 and
      alpha=0.05 are the values the spec text names.
    after_applying_the_frozen_controls_own_exclusion_rule: resource_incomplete
    after_applying_note: >-
      CTRL-HORIZONTAL-BASELINE's pass_condition states: "A pair whose conductor
      differs between endpoints is a misclassified vertical edge, not a
      horizontal control, and is excluded from this sample (and logged, not
      silently dropped)." I executed the omitted certification (see CC-1 and
      F-2). Seed 304's horizontal pair is a crater->floor VERTICAL 3-isogeny.
      Excluding it leaves 7 admissible horizontal pairs. decision.py's own second
      gate is `len(horizontal_pairs) < min_vertical_edges -> resource_incomplete`
      (driver/decision.py lines 89-97). So the frozen table, applied to this
      artifact set with the frozen control actually enforced, does not reach a
      data-bearing branch at all.
    evidential_weight_of_either_branch: none_with_respect_to_the_hypothesis
    evidential_weight_note: >-
      Independently of which branch label is correct, neither carries information
      about the vertical/horizontal contrast, because the instrument has no
      dynamic range at this configuration (F-1). Both KS samples are the constant
      vector 1.0 for ANY pair of ordinary curves at fb_size=8 and N in [40,45].
    branch_i_may_not_assign:
      instrument_void: >-
        NOT FIRED, and I do not claim it. The frozen instrument_void condition is
        narrow -- (a) end-ring/conductor computation disagreeing with the
        constructed isogeny's degree on >1 edge, OR (b) the GLV instrument
        failing its expected move -- and neither holds (0/8 certificate failures;
        phi_is_on_curve and phi_equals_scalar_mul_lambda both true). The frozen
        decision table is exhaustive over (ks_rejects, any_edge>=100,
        all_in_band) but NOT over instrument states: it has no branch for "the
        meter cannot register a difference of the size being excluded". That is a
        contract-level gap I report to the Coordinator; I may not invent a branch
        to fill it.

