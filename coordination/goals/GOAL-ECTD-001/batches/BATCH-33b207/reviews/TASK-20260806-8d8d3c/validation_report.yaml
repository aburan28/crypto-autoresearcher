        semaev_m4_relation_density = 0.0 (32/32);
        fb_decomposition_probability = 0.0 (32/32);
        groebner_solving_degree_d_reg = 14 (32/32);
        macaulay_rank_defect_at_first_fall = 2 (32/32).
