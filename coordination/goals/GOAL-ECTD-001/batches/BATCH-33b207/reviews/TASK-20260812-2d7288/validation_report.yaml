  seed_and_scale_checks:
    - id: SS-1
      check: Screen seed integrity
      result: passed
      evidence: >-
        master_seeds are exactly [301,302,303,304,305,306,307,308], unique and
        complete. attempts_log has one successful record for every seed and no
        undocumented substitution. Reuse of seed 301 by the one-edge smoke run
        is the planned smoke/full overlap, not a duplicate inside the eight-edge
        screen.
    - id: SS-2
      check: Achieved bit-length distribution disclosure
      result: passed_for_disclosure_failed_for_frozen_sampling_scope
      evidence: >-
        Independently read per-edge (target_bits, achieved_bits) as
        [(43,44),(44,45),(40,40),(41,42),(41,41),(43,43),(44,45),(41,42)]
        for seeds 301 through 308. The raw achieved list
        [44,45,40,42,41,43,45,42] is accurate and has six distinct widths,
        so the earlier single-exact-width failure did not recur. However, the
        run changed bit_candidates from the frozen [40,60] requirement to the
        undeclared sub-range [40,44]. The producer discloses this deviation,
        but no pre-run versioned amendment authorizes it; the admissible tested
        width scope is 40 to 45 bits, not a sweep of the frozen 40 to 60 band.

  metric_recomputations:
    - id: MR-1
      what: Primary meter dynamic range over all vertical and horizontal objects
      result: failed_non_discriminating
      evidence: >-
        The screen contains 32 measured curves: eight floor/crater pairs and
        eight horizontal endpoint pairs. Every one has the exact primary vector
        (semaev_m3_relation_density=0.0,
        semaev_m4_relation_density=0.0,
        fb_decomposition_probability=0.0,
        groebner_solving_degree_d_reg=14,
        macaulay_rank_defect_at_first_fall=2). Thus all five primary meters
        have zero empirical dynamic range; three are identically zero on all
        32 objects.
    - id: MR-2
      what: Ratio convention and vertical/horizontal ratio samples
      result: arithmetically_reproduced_but_non_discriminating
      evidence: >-
        driver.vertical.ratio_with_zero_handling maps 0/0 to 1.0. Independently
        applying that convention yields all forty vertical ratios equal to 1.0
        and all forty horizontal ratios equal to 1.0. Each edge has max_ratio
        1.0 and delta_d_reg 0. This is a convention-generated equality for the
        three zero meters and a constant-over-constant equality for the other
        two, not demonstrated sensitivity to a conductor discontinuity.
    - id: MR-3
      what: Primary two-sample KS statistic
      result: reproduced
      evidence: >-
        From the two independently assembled 40-element all-one samples,
        D=0.0, n=m=40, d_crit=1.36*sqrt(80/1600)=0.30410524493997143 at
        alpha=0.05, and rejects=false. These values exactly match raw-result.
        Since both samples are degenerate point masses created by the frozen
        instrument/convention, D=0 does not demonstrate that the instrument
        could have separated continuity from discontinuity.
    - id: MR-4
      what: Permutation-edge identity statistic
      result: reproduced_as_degenerate_ties
      evidence: >-
        For every one of the five meters, true_winners is all eight indices and
        every one of five shuffles recovers all eight indices. The reported
        stable=true flags are arithmetically correct but encode an eight-way tie,
        not stable recovery of a distinguished discontinuous edge. The tail
        check therefore has no positive identity-discrimination content here.
    - id: MR-5
      what: Frozen five-branch decision table
      result: mechanical_branch_reproduced_but_not_admissible
      evidence: >-
        Mechanical inputs are end_ring_cert_fail_count=0, GLV expected move=true,
        completed vertical edges=8, driver-labelled horizontal pairs=8,
        ks_rejects=false, any_edge_ge_100_or_delta2=false, and
        all_edges_in_band=true. Therefore instrument_void=false under the two
        narrow coded predicates, resource_incomplete=false,
        discontinuity_nominates_endpoint=false, continuity_scoped=true, and
        moderate_effect_unresolved=false. The raw mechanical branch is exactly
        continuity_scoped. It is not an admissible scientific branch because the
        required horizontal control is uncertified and the primary instrument
        has zero demonstrated discrimination.

  decision_branch_recomputation:
    producer_reported: continuity_scoped
    independently_recomputed_mechanical_branch: continuity_scoped
    mechanical_match: true
    admissible_data_bearing_branch: null
    validator_integrity_disposition: instrument_void
    disposition_note: >-
      `instrument_void` here is the receipt/instrument disposition, not a claim
      that the narrow implementation of decision.py's two instrument_void
      predicates fired. The frozen table lacks a branch predicate for the
      observed missing mandatory horizontal certificate and non-discriminating
      constant meter. A Validator cannot promote a mechanically selected
      data-bearing branch through failed validity gates. Accordingly the
      package is invalid evidence and supplies neither continuity nor
      discontinuity evidence about H-ECTD-19017a.
    all_five_branches:
      discontinuity_nominates_endpoint:
        fires: false
        reason: KS does not reject and no ratio reaches 100 and no d_reg delta reaches 2.
      continuity_scoped:
        fires_mechanically: true
        admissible: false
        reason: >-
          All convention-produced ratios lie in-band and KS does not reject,
          but the comparison is non-discriminating and its same-level control
          certificate is missing.
      moderate_effect_unresolved:
        fires: false
        reason: It is the complement of the two data branches and the mechanical continuity predicate is true.
      instrument_void:
        fires_under_narrow_coded_predicates: false
        validator_integrity_disposition: true
        reason: >-
          Vertical failure count is zero and GLV expected move is recorded, but
          broader frozen validity/control obligations fail.
      resource_incomplete:
        fires: false
        reason: Eight vertical records and eight driver-labelled horizontal pairs are present.

  control_checks:
    - id: CTRL-HORIZONTAL-BASELINE
      result: failed
      evidence: >-
        All eight horizontal certificates record ell=3 and only the arithmetic
        gcd(3,q)=1 for q in {17,19,23,29,31}. None records a conductor for either
        endpoint and no endpoint conductor recomputation was performed. The
        argument proves at most that a 3-isogeny cannot alter those q-adic
        conductor parts; it does not prove the 3-adic valuation is unchanged.
        A 3-isogeny can be ascending or descending in the 3-volcano while all
        listed q-parts remain fixed. This does not satisfy the frozen requirement
        to recompute both endpoint conductors and verify the whole conductor is
        unchanged, so the horizontal sample is not certified same-level.
    - id: CTRL-GLV-CHANNEL
      result: passed_with_receipt_limit
      evidence: >-
        Independently checked p and subgroup-order primality,
        N_full=cofactor*N_prime_subgroup, j=0/D_K=-3, zeta3 as a nontrivial cube
        root mod p, and lambda^2+lambda+1=0 mod subgroup order. The receipt records
        phi_is_on_curve=true and phi_equals_scalar_mul_lambda=true, and the
        endomorphism-cost mapping is isolated from all decision ratio samples.
        The serialized receipt omits the actual base-point witness, so those last
        two booleans cannot be reconstructed from the receipt alone; this is a
        bounded receipt limitation, not the primary invalidity.
    - id: CTRL-COORDINATE-NULL
      result: passed_arithmetically_non_dispositive
      evidence: >-
        Three receipts (seeds 301, 302, 303) have correctly recomputed
        F_p-isomorphic coefficients and exact equality on all five primary meters.
        This confirms invariance under those transformations, but a constant
        instrument necessarily passes this null and the check supplies no
        sensitivity demonstration.
    - id: CTRL-PERMUTATION
      result: passed_as_tie_arithmetic_failed_as_discrimination
      evidence: >-
        All stable booleans recompute, but all eight edges tie as winners for every
        meter in every trial. No claimed edge identity is selected or recoverable.
    - id: CTRL-END-RING-CERTIFICATE
      result: passed_for_eight_vertical_edges
      evidence: >-
        Independently checked for each seed that p and N are prime, N=p+1-t,
        t^2-4p=q^2*D_K, gcd(q,N)=1, both endpoint models are nonsingular, and the
        crater j recomputation matches the known CM value. Independently reran
        deterministic kernel enumeration on the archived curves: crater counts
        were [30,18,32,18,24,24,24,24]=q+1, every floor count was 1, and every
        archived floor appeared among the corresponding crater's q-Velu
        codomains. Recorded kernel representative counts equal (q-1)/2 and
        order-preservation booleans are true. No vertical certificate failure was
        found.
    - id: CTRL-RHO
      result: passed
      evidence: >-
        Eight plain-rho receipts are present, all untimed-out, on each vertical
        floor curve/order. Independent curve arithmetic confirmed G and Q are on
        curve, N*G is the identity, and k_found*G=Q for all eight witnesses.
    - id: CTRL-BSGS
      result: passed
      evidence: >-
        Eight BSGS receipts are present. Independent curve arithmetic confirmed
        k_found*G=Q for all eight witnesses; every BSGS k equals its matched rho k
        and bookkeeping k.
    - id: CTRL-NO-CLASS-INVARIANT-ENDPOINT
      result: structural_not_applicable
      evidence: >-
        No endpoint was nominated because discontinuity_nominates_endpoint did
        not fire mechanically. The producer records this N/A explicitly. With
        the overall invalid verdict, no endpoint nomination is licensed anyway.
    - id: TAIL-ECTD-VERT-EXCEEDANCE
      result: no_exceedance
      evidence: Every vertical and horizontal ratio is 1.0; the largest vertical ratio is not extreme under the identical horizontal point mass.
    - id: TAIL-ECTD-VERT-PERM-STABLE
      result: non_discriminating_tie
      evidence: All eight identities tie; no unique discontinuous identity exists to test.

  zero_dynamic_range_adjudication:
    finding: blocking_instrument_failure
    can_discriminate_continuity_from_discontinuity: false
    rationale: >-
      The observed measurement map collapses every one of 32 distinct curve
      equations into one vector. Three meters are censored at an empirical floor
      of zero and converted to ratio 1 by convention; the remaining two are also
      constant. The horizontal null, coordinate null, KS statistic, and
      permutation procedure all necessarily agree under such collapse. No
      frozen positive sensitivity control demonstrates that a known conductor-
      dependent meter change would be detected. Therefore the package observes
      instrument saturation/constancy, not continuity of the underlying target.
      Treating this as continuity would violate the inventor protocol's
      controls-before-belief rule.

  d2_horizontal_conductor_adjudication:
    finding: blocking_control_failure
    required: >-
      Recompute the endomorphism-ring conductor independently from each
      horizontal endpoint and admit the pair only if the whole conductor is
      unchanged.
    performed: >-
      No endpoint conductor was computed. Every record substitutes
      gcd(ell,q)=1 for five q candidates.
    why_substitution_is_insufficient: >-
      Coprimality protects only the q-adic parts for q different from ell. It
      leaves the ell-adic conductor valuation exactly unconstrained, which is the
      valuation an ell-isogeny can change. Hence the control may contain vertical
      ell-edges and cannot establish same-volcano-level comparability.
    consequence: >-
      The primary KS horizontal comparator fails its frozen admission condition;
      its values cannot validate either continuity or discontinuity.

  certificate_checks:
    - id: CC-1
      check: Run-level positive-certificate requirement
      result: passed
      evidence: >-
        Both run-level certificates correctly use kind none because these are
        pure measurement/construction runs and claim no run-level ECDLP solve.
    - id: CC-2
      check: Nested rho and BSGS discrete-log certificates
      result: passed
      evidence: >-
        All sixteen nested certificates identify P, Q, k and
        independent-recompute verification. An independent elliptic-curve
        implementation recomputed k*P=Q for every certificate.

  heuristic_validation_checks:
    - id: HV-1
      check: Pre-registered prediction and thresholds
      result: passed
      evidence: Frozen v2 specifies alpha 0.05, factor band [0.1,10], extreme ratio 100, d_reg delta 2, eight edges, and all five branches before the runs.
    - id: HV-2
      check: Sample integrity and primary statistic
      result: failed_for_support
      evidence: Seeds and arithmetic are intact, but the primary sample has zero dynamic range and the horizontal sample lacks its mandatory level certificate.
    - id: HV-3
      check: Scale binding
      result: limited
      evidence: The honest achieved scope is toy N widths 40 through 45, with no transfer or correspondence to crypto scale.
    - id: HV-4
      check: Controls before belief
      result: failed
      evidence: The null arms pass only because the meter is constant; no positive sensitivity control establishes discriminatory power.

  cost_model_checks:
    - id: CM-1
      check: Concrete or asymptotic ECDLP cost claim
      result: not_applicable
      evidence: No such claim is made in the bound package; rho and BSGS are baseline receipts only.

  proof_architecture_checks:
    - id: PA-1
      check: Proof-oriented claim
      result: not_applicable
      evidence: This is an empirical toy measurement, not a proof, reduction, asymptotic theorem, or closure argument.

  claim_ceiling_check:
    result: passed
    evidence: >-
      A case-insensitive search of the 17 producer paths found no trapdoor,
      path-finding-hardness, isogeny-evaluation-hardness, crypto-scale,
      ECDLP-exponent, closure, goal-completion, or breakthrough claim. The only
      asymptotic text is the explicitly disclosed KS critical-value
      approximation. GLV Semaev meters are serialized separately and are not
      included in vertical/horizontal ratio samples.

  verdict: invalid
  verdict_reason: >-
    The bytes, schemas, seeds, arithmetic summaries, vertical certificates,
    nested DLP certificates, and mechanical five-branch computation are
    internally consistent. Nevertheless the package is not an admissible
    research receipt for the stated uncertainty. Its primary meter has zero
    demonstrated dynamic range and cannot distinguish continuity from a
    discontinuity collapsed by the measurement convention; its mandatory
    same-level horizontal control did not recompute either endpoint's conductor
    and substitutes a q-part-only gcd argument that leaves the ell-adic level
    uncontrolled. The frozen [40,60] target-width sampler was also narrowed to
    [40,44] without a pre-run amendment. These are instrument/control/protocol
    integrity failures. The mechanically reproduced `continuity_scoped` token
    is therefore inadmissible and must not be used as negative evidence.

  scientific_effect:
    evidence_for_H_ECTD_19017a: none
    evidence_against_H_ECTD_19017a: none
    hypothesis_status_change_authorized: false
    experiment_status_change_authorized: false
    goal_status_change_authorized: false
    note: >-
      Invalid means that this instrument/control package cannot answer the
      frozen question. It is not evidence of continuity, discontinuity, ECDLP
      hardness, or failure of the mathematical mechanism.

  limitations:
    - >-
      I did not rerun either experiment. I performed deterministic receipt
      verification, arithmetic recomputation, all sixteen DLP witness checks,
      and kernel/codomain reconstruction on the archived curves. This respects
      the task prohibition on experiment execution.
    - >-
      The GLV receipt omits its tested base point, so the two point-dependent GLV
      booleans cannot be independently reconstructed from serialized evidence;
      the surrounding algebraic identities and channel isolation do recompute.
    - >-
      No canonical task-scoped adapter probe exists, so model_verified remains
      false. No fallback, degradation, or Bedrock use occurred.
    - >-
      This verdict does not prescribe or authorize a repair, rerun, ledger edit,
      or scientific status transition; those remain Coordinator decisions.

  exact_commands_recorded_in: >-
