implementation_note:
  task_id: TASK-20260811-a3eb96
  objective: >-
    Implement the explicitly declared content-first archive-binding mode and
    faithfully test the BATCH-33b207 split/superset topology.
  status: completed_observations_only
  changes:
    - >-
      Added archive.binding_mode with legacy default commit and explicit
      content_first opt-in. The mode is never inferred from a commit-scope
      failure.
    - >-
      Content-first requires archive.commit_sha to resolve and be an ancestor
      of HEAD; its declared parent must match first-parent/root semantics and
      its commit message must retain the task and record IDs. It requires hashes
      for every expected archive and source path, and verifies every such
      committed HEAD blob without generated-path skipping. The only relaxed
      check is exact changed-path equality for one commit.
    - >-
      Declared content-first verification is appended to content_only_archives
      before the canonical plan hash is computed; this preserves visible,
      digest-bound reporting.
    - >-
      Added an actual temporary-Git regression fixture with 17 source paths,
      15 paths plus 40 unrelated paths in a 55-path ancestor commit, two
      remaining source paths in a second ancestor commit, and a later archive
      receipt commit. The fixture verifies all 18 expected path hashes.
  invariants_reverified:
    review_chain: >-
      Unchanged. test_claim_relevant_task_requires_snapshot_then_ledger_review_chain
      and test_claim_relevant_task_accepts_snapshot_review_and_ledger_chain passed.
    exactly_once_assignment: >-
      Unchanged. test_rejects_unarchived_and_multiply_archived_workers passed.
    coordinator_archive_ownership: >-
      Unchanged. test_archive_must_be_coordinator_direct_and_cover_source_artifacts passed.
    undeclared_archive_commit_scope: >-
      Unchanged. test_undeclared_content_first_shape_still_requires_exact_commit_scope
      passed; absence of binding_mode retains the exact changed-path verifier.
  negative_checks:
