    static-witness report have truthful, reachable, separately archived
    two-path content-first custody. Fresh independent Red Team
    TASK-20260813-b3fe96 nevertheless returned REVISE for the composite
    protocol-design and custody-integrity question. Custody and report
    reproducibility are positive findings and are not blockers: independent
    replay reproduced all eight frozen row intervals, 30,381 candidate
    evaluations, every recorded census and manifest, and first accepted
    arithmetic witnesses in slot 4 at counter 29 and slot 6 at counter 350.
    The other six rows honestly terminate resource_incomplete under the frozen
    5,000-counter-per-row cap. The frozen approval gate requires an
    unqualified independent PASS and eight of eight accepted rows; two of
    eight cannot satisfy or partially waive that conjunction. Approval is
    additionally blocked by a q-sensitive parity defect that makes slots 0
    and 7 impossible under the exact trace class, incomplete accepted-output
    and rejection prebinding, an underbound planted-control PRNG, deferred
    curve/kernel/whole-conductor source totality, and the absence of a
    source-bound null-safe KS decision rule. Amendment v5 therefore remains
    review_required, unapproved, future-runs-only, and non-operative. Version
    2 remains the only operative approved protocol. None of the static
    protocol facts is evidence for or against H-ECTD-19017a.

