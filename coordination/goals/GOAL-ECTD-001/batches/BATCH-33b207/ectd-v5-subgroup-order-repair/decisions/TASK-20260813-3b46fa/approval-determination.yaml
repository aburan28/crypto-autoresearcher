    subgroup_and_full_order_repair:
      result: REVISE
      preserved_local_passes:
        - N is explicitly the prime subgroup order and M is explicitly h times N.
        - Trace and Frobenius-discriminant identities use the full order M.
        - The D_K-specific h and f_pi mappings are frozen without row substitution.
        - Both accepted rows satisfy every declared equality, bit-length, and primality check.
      blocking_finding: >-
        The D_K=-7 rule freezes t congruent to zero modulo 32 for every q. For
        q=29, f_pi=58, and h=8, the derived formula is
        N=((t-2)^2+28*q^2)/32. Its numerator is zero modulo 64 for every such
        t, so N is even in slots 0 and 7 for every possible counter. The
        nearby q=23 slot 4 has numerator 32 modulo 64 and can produce odd N.
        The residue class therefore omits a load-bearing q dependence. This is
        a scoped protocol-map obstruction, never evidence against H-ECTD.

    complete_static_witness_gate:
      result: REVISE
      required: eight_of_eight_reproducible_first_accepted_witnesses
      observed: two_of_eight
      partial_pass_sufficient: false
      finding: >-
        Six exact rows terminate resource_incomplete, and the frozen queue
        expressly requires any no-hit to produce REVISE rather than approval.
        Integrity and deterministic replay pass, but the complete conjunction
        does not.

    canonical_serialization_and_rejection_replay:
      result: REVISE
      preserved_local_passes:
        - Candidate input bytes use one noncontradictory JCS rule with safe integers.
        - Prospective encodings exist for unsafe integers, field elements, points, infinity, rationals, and polynomials.
        - Both report-local accepted-output byte strings and SHA-256 values reproduce exactly.
      blocking_findings:
        - >-
          The semantic snapshot does not prebind an accepted-witness output
          schema. The Executor transparently selected the report-local label
          and fields before its loop, but that post-snapshot choice is not an
          approved protocol schema.
        - >-
          The rejection contract gives complete details for only a subset of
          codes and omits N_NOT_ODD even though that code occupies all 5,000
          counters in two rows. Exact canonical rejection records, bytes, and
          per-record hashes for counter zero, counter one, and a rejection in
          every row are absent.

    same_identity_planted_sensitivity:
      result: REVISE_DESIGN_ONLY_NOT_EXECUTED
      preserved_local_passes:
        - The same curve, subseed, planting booleans, and three expected vectors are restated.
        - Direct assignment is prohibited and the claim ceiling is gross planted sensitivity only.
      blocking_finding: >-
        The design does not freeze the PRNG algorithm, seed-to-state rule,
        version, exact sample counts, call order, adapter bytes, or transitive
        source bindings needed to make meter_subseed 20103063
        implementation-independent. No planted arm or control was executed,
        and no control pass is inferred.

    prospective_curve_kernel_and_conductor_contract:
      result: REVISE_DESIGN_ONLY_NOT_EXECUTED
      preserved_local_passes:
        - Arithmetic witnesses are explicitly not curve witnesses.
        - Endpoint-local whole conductors cannot be copied or inferred from a pair.
        - D_K=-7 requires independent auxiliary 2-adic and q-adic endpoint checks.
        - Vertical conductors 1 and q and horizontal conductors q and q remain distinct.
      blocking_finding: >-
        V5 expressly labels the curve-and-kernel section frozen design not
        implemented and defers the total arithmetic-witness-to-canonical-CM-
        curve map to later source. Minimal extension degrees, field
        construction, curve enumeration, endomorphism-ring certificates,
        kernel algorithms, and rejection fixtures are not source-bound. The
        snapshot is therefore not a total replayable curve/control protocol.

    full_width_coverage:
      result: PASS_AS_PRESERVED_DESIGN_BLOCKED_IN_CURRENT_PROTOCOL
      exact_anchor_schedule: [40, 43, 46, 49, 52, 55, 58, 60]
      endpoints_included: true
      maximum_adjacent_gap: 3
      exact_N_bit_length_required: true
