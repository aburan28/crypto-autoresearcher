      already frozen row parameter, yet the same residue rule permits odd N in
      one and forces even N in the other. The map omits a load-bearing q
      dependence.
    - >-
      Observation-fiber attack: an accepted arithmetic tuple is compatible
      with multiple or no yet-canonicalized curve/kernel/control transcripts.
      Arithmetic acceptance cannot identify whole-conductor correctness or
      target sensitivity without the deferred separator.
    - >-
      Method-ceiling attack: even an eventual 8/8 static arithmetic PASS could
      support only bounded protocol-map feasibility. It could not establish a
      curve witness, conductor sensitivity, hidden path, trapdoor, public
      detection or path-finding hardness, cryptographic transfer, ECDLP
