        The D_K=-7 trace class is frozen only as t congruent to 0 modulo 32.
        For q=29, f_pi=58 and h=8, N equals
        ((t-2)^2+28*q^2)/32. At t congruent to 0 modulo 32 the numerator is
        0 modulo 64, so N is even for every possible counter. Slots 0 and 7
        therefore cannot produce the required odd prime N under this exact map,
        not merely within the observed 5000-counter prefix. The adjacent
        D_K=-7, q=23 slot 4 has numerator 32 modulo 64 and does admit odd N;
        this nearby row shows the trace residue must account for q, not only
        D_K. This is a protocol-map obstruction only, never H-ECTD evidence.
