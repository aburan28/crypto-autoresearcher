    null-KS source conflict explicit, and preserves both feasibility and claim
    firewalls. Both snapshots have exact custody, and the witness report is
    internally reproducible. Those are real protocol-governance improvements.
    They do not meet the frozen approval boundary: only 2/8 arithmetic rows
    accept, two q=29 rows are structurally parity-impossible, and PRNG,
    output/rejection, curve/kernel, and executable decision bindings remain
    incomplete.

