  counterexample_or_mutation: >-
    Hold D_K=-7 and the v5 trace rule t congruent to zero modulo 32 fixed, then
    change only the already frozen q from 23 in slot 4 to 29 in slot 0 or 7.
    With h=8 and f_pi=2q, N=((t-2)^2+28q^2)/32. For q=23 the numerator is 32
    modulo 64 and odd N is possible; for q=29 it is 0 modulo 64 and N is always
    even. This nearby-row mutation falsifies the claim that one D_K-only trace
    residue class repairs all three D_K=-7 rows. It is a static protocol
    counterexample, not an experiment or evidence against H-ECTD-19017a.

  baseline_comparison: >-
