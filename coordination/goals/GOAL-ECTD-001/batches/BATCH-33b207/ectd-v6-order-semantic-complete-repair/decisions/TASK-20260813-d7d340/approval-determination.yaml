    - id: RT-ECTD-V6-O3
      sustained: true
      overruled: false
      finding: The planted-control adapter is missing and the meter is assigned directly to 1.0 rather than derived through the specified adapter path.
      required_repair: Add the planted-control adapter and derive the meter through that adapter with a static conformance witness; prohibit direct assignment.

