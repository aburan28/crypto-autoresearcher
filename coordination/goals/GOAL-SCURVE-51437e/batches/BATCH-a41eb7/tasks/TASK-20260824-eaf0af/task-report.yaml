        of a conflict between two IETF specifications - the far likelier
        explanation is transport corruption in this session. THE LANE MUST
        THEREFORE RE-READ RFC 8032 FROM RAW BYTES BEFORE IT INTERPRETS ANY
        MISMATCH, and the plan's stated consequence ("a genuine conflict between
        two IETF specifications; triggers the goal pause condition") must be read
        with that precedence.
    effect_on_the_corpus_grep: >-
      The sota_delta figure in the audit plan and below cites a grep for two
      literal order values returning ZERO occurrences corpus-wide. That grep ran
      and returned zero; the statement about the corpus is accurate as executed.
      But one of the two search strings - the decimal literal - came from the
      quarantined channel, so the grep may have tested a corrupted string. The
      hexadecimal string is byte-confirmed and its zero-hit result stands
      unqualified. The conclusion (the corpus holds no order value for this
      curve) is unaffected in substance, since a corrupted search string can only
      cause a FALSE zero, and the byte-confirmed string independently returned
      zero.
    process_lesson_for_the_program: >-
      This is a general defect in this runtime's retrieval path, not a
      Curve25519 issue. Any record in this repository whose numeric values came
      through WebFetch is suspect on the same grounds, and this affects the other
      SafeCurves goals identically. Recommended as a program-level item, not a
      goal-level one - see successor S7.

