limitations:
  - id: L-ENV-1
    statement: >-
      This session had NO shell and NO interpreter. Consequently the deliverables
      contain no computed quantity of any kind. Every number in them is either a
      quotation from a named source or a PREDICTION recorded in advance with its
      derivation shown. Even trivially checkable identities such as (A-2)/4 were
      left to the executor rather than hand-computed and presented as
      measurements.
    classification: 'Operational observation, never mathematical evidence.'
  - id: L-ENV-2
    statement: 'No PDF text extractor was available, which cost two sources
      (U9, U10) whose bytes had already transferred successfully.'
    classification: 'Operational observation. Remedied for successors by the
      staged mirror.'
  - id: L-ENV-3
    statement: >-
      Six fetch attempts across two hosts under cr.yp.to returned HTTP 502. Per
      the Coordinator this was a WebFetch tool-path defect, not an outage; this
      role has no Bash and could not have worked around it by any available
      route.
    classification: 'Operational observation, never mathematical evidence.'
  - id: L-ENV-4
    statement: >-
      WebFetch is summarizer-mediated and corrupts digit strings (ERRATUM-2). All
      RFC 7748 values used here were subsequently byte-confirmed; all RFC 8032
      values remain quarantined. This is the most consequential limitation in the
      report and it is a property of the runtime, not of the sources.
    classification: 'Operational observation, and a program-level defect.'
  - id: L-PLAN-1
    statement: >-
      The plan's controls for small embedding degree, smooth twists and CM
      construction run at TOY sizes (30-60 bit p), because building a same-p
      parameter-matched positive at 2^255-19 requires point counting that is not
      assumed available. This imports heuristic H4 - correctness transfers from
      toy sizes, cost behaviour does not - which the plan labels its weakest
      assumption. Three lanes (L2, L8b, L10) do have genuine same-p controls and
      are the stronger part of the suite.
  - id: L-PLAN-2
    statement: >-
      Two of the eleven criteria cannot be settled by the methods proposed, and
      the plan says so with an argument rather than deferring: `rigid`, because
      rigidity is a property of a design PROCESS and no computation can exclude a
      rule chosen after its output was seen; and `ind`, because certifying a
      2^-100 statistical distance would need ~2^200 samples. Both are recorded
      with a named obstruction, an argument, and forward guidance.
  - id: L-PLAN-3
    statement: >-
      Priorities and predicted values are the producer's judgement and bind
      nothing. Only a Coordinator-approved frozen protocol authorises any lane to
      run; this record neither assigns work nor changes any hypothesis status.
  - id: L-NOV-1
    statement: >-
      novelty_status for the capsule is `known` - transcribing a standardised
      parameter set from its published specification is not a discovery, and the
      value is provenance and certifiability inside this ledger. The corpus
      screen supporting the data-delta claim was actually run (grep over
      knowledge/ and ledger/proposals/, 2026-08-25), with the caveat recorded in
      ERRATUM-2.effect_on_the_corpus_grep.

# ---------------------------------------------------------------------------
# HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
# ---------------------------------------------------------------------------
honest_accounting:
  objects_considered:
    - 'O1 the Frobenius trace t'
    - 'O2 the pair (l, ord_l(p))'
    - 'O3 the squarefree part D of t^2-4p with its conductor v'
    - 'O4 the exceptional set of an addition/ladder/model-conversion formula'
    - 'O5 the 2-Sylow structure of E(F_p) and E^t(F_p)'
  objects_rejected_on_the_lossy_projection_test:
    - 'The full point set E(F_p) - not a projection at all but the state itself;
      tracking it is a change of representation, not a new object.'
    - 'The base point G considered apart from its order - fails propagation,
      since isogeny, twisting and model change all move it.'
  object_enumeration_caveat: >-
    This program has no written object-enumeration for the ECDLP (KN-OPEN-019),
    so the family-to-object mapping used here is a sketch, not a taxonomy, and
    must not be cited as one.
  dominated_by:
    as_an_attack: 'n/a (no result claimed) - no attack is proposed.'
    as_a_measurement_instrument: >-
      DOMINATED by three incumbents. (1) SafeCurves itself already publishes the
      eleven-cell table for this curve and dominates on coverage, authority and
      longevity. (2) The parameter-validation procedures mandated in the
      standards (ANSI X9.62-style, SEC-style) dominate on authority and decades
      of use. (3) RFC 7748 Appendix A already states the generation rules and
      thresholds that lanes L8 and L6 re-derive - now byte-confirmed at lines
      1036-1046. The plan dominates all three on exactly one axis: re-verifiable
      certificates inside this program's ledger with recorded provenance and
      declared controls.
    frontier_rows_checked: >-
      Every attack frontier row in the corpus was checked before writing "no
      attack": rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted rho (KN-TECH-018); BSGS (KN-TECH-031) and its
      n^{2/3+o(1)} full cost (KN-TECH-035); MOV/Frey-Ruck at small k
      (KN-TECH-032); the anomalous/trace-one transfer (KN-TECH-033). `null` is
      asserted nowhere.
  sota_delta:
    against_attack_baselines: 'ZERO on every axis - time, memory, data, queries.
      No exponent is moved and none is claimed.'
    as_data: >-
      Measurable and nonzero. A repository-wide grep on 2026-08-25 for the
      byte-confirmed hexadecimal order tail "14def9dea2f79cd65812631a5cf5d3ed"
      and for the (quarantined) decimal literal returned ZERO occurrences of
      either, so the corpus holds no subgroup order, no twist order, no trace, no
      CM discriminant and no embedding-degree bound for Curve25519. The plan
      would produce seventeen lanes' worth of certified or explicitly-bounded
      rows where there are now none. See ERRATUM-2.effect_on_the_corpus_grep for
      why the quarantine does not weaken this conclusion.
    as_scope: >-
      Converts intake cells from unverified user-supplied assertions into either
      certified measurements plus an explicitly separated adjudication step, or
      recorded blockers with successor conditions. Small, and stated at its true
      size.
  closures_enumerated:
    - closure: '`rigid` cannot be fully audited by computation alone, at any
        budget.'
      mechanism: >-
        Rigidity is a property of the design process. For any deterministic rule
        R with R(inputs) = P there are infinitely many rules R' with
        R'(inputs) = P; an audit observes the pair (R, P), can test membership in
        the preimage, and has no access to the order in which R and P were fixed.
        The counterfactual is not a computable object.
      forward_guidance: >-
        What remains auditable and IS in the plan: the arithmetic half of the
        rule, and base-point minimality (cheap, decisive, nine Legendre symbols).
        What remains infeasible-but-not-impossible: A-minimality, deferred with a
        point-counting-backend successor condition. Only the counterfactual is
        genuinely closed, and that closure is epistemological, not about this
        curve.
    - closure: '`ind` cannot be certified by the methods proposed, only bounded.'
      mechanism: >-
        Certifying a 2^-lambda statistical distance over a space of size ~2^255
        from n samples is infeasible: the empirical distance concentrates with
        error Theta(sqrt(bins/n)), so a 2^-100 distance would need n ~ 2^200.
      forward_guidance: >-
        What remains: the ALGEBRAIC Elligator-2 precondition, certifiable exactly
        and what L11 actually certifies; a power-calibrated refutation test
        reported as a failure-to-refute; and a PROOF of the encoding's
        distribution from the literature - a retrieval task rather than a
        measurement task. That third route is open and is not attempted here.
    non_closure_statement: >-
      No direction is declared impossible. Every deferred item carries a
      successor condition, and the two closures bound a method's reach, not a
      question.
  premature_closure_check: >-
    No lane was declined on saturation grounds. Curve25519 is a heavily studied
    target and the honest label for this work is `known` as mathematics; that is
    recorded as a novelty status, not used as a reason to generate less.

