limitations:
  - id: L-ENV-1
    statement: >-
      This session had NO shell and NO interpreter. Consequently the deliverables
      contain no computed quantity of any kind. Every number in them is either a
      verbatim quotation from a named source, or a PREDICTION recorded in advance
      with its derivation shown so a reader can check it. Even trivially
      checkable integer identities such as (A-2)/4 were left to the executor
