  - id: ERRATUM-2
    subject: 'WebFetch is summarizer-mediated and corrupts digit strings.'
    severity: 'HIGH - affects the evidentiary status of the capsule''s
      retrieved_layer.'
    raised_by: 'Coordinator integrity warning, received after all three artifacts
      were drafted.'
    what_the_coordinator_established: >-
      WebFetch in this environment does not return the page; it returns a
      small-model SUMMARY of the page, and that summary demonstrably corrupts
      numeric data. Demonstrated against raw curl bytes of RFC 7748: a WebFetch
      of the curve448 block returned A = 39081, collapsing three distinct
      constants (A = 156326, edwards448 d = -39081, and a24 = 39081) into one; it
      returned cofactor 2 where the bytes say 4; and it returned an order tail of
      64 hex digits where the bytes have 56. Two fetches of the SAME url
      disagreed with each other in both value and length.
    consequence_stated_plainly: >-
      TWO WEBFETCH RESULTS AGREEING IS NOT CORROBORATION. It is sampling the same
      summarizer twice. Any digit string this session obtained through WebFetch
      is unverified until checked against raw bytes.
    action_taken_in_this_session: >-
      Rather than merely quarantine, the affected values were CHECKED against the
      staged raw-byte mirror using the Read and Grep tools, which do not pass
      through the summarizer. Results below. The capsule and plan were NOT
      rewritten, per the Coordinator's instruction; this erratum is the record.
