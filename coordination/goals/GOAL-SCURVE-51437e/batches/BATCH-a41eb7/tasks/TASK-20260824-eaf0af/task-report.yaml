# ---------------------------------------------------------------------------
# UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
# ---------------------------------------------------------------------------
intake_vs_sources:
  direct_contradictions: 0
  detail: >-
    On every field the intake tuple actually states - curve name, equation,
    modulus - the retrieved primary sources AGREE, up to one disclosed
    notational difference (intake writes (x, y) where RFC 7748 writes (u, v),
    and intake omits the Montgomery coefficient B which the specification's form
    fixes to 1). The goal's pause condition "primary or authoritative sources
    leave an unresolved conflict in the named curve's parameter tuple" is
    therefore NOT triggered by a contradiction.
  but_not_thereby_satisfied: >-
    Five items remain unresolved for reasons other than contradiction, and the
    distinction matters: absence of conflict is not confirmation. They are
    OR-1..OR-5 in the capsule. The one a reviewer should look at first is OR-1.
  or_1_highlighted:
    item: >-
      RFC 7748 Section 4.1 states the base-point order as
      "2^252 + 0x14def9dea2f79cd65812631a5cf5d3ed"; RFC 8032 Section 5.1 states
      L as "2^252+27742317777372353535851937790883648493". Two authoritative
      IETF documents, two number bases, and NEITHER document asserts their
      equality.
    why_unresolved_here: >-
      This session had no shell and no interpreter. Converting a 125-bit
      hexadecimal literal by hand and reporting the result as agreement would be
      a fabricated statistic under AGENTS.md rule 5. The prediction that they are
      EQUAL is recorded in the plan at lane L4 BEFORE any computation, so
      confirming it will be a controlled result rather than a retrofit.
    cost_to_resolve: 'Microseconds, for any session with an interpreter.'
    consequence_if_unequal: 'A genuine conflict between two IETF specifications;
      triggers the goal pause condition; blocks every lane that consumes l.'

