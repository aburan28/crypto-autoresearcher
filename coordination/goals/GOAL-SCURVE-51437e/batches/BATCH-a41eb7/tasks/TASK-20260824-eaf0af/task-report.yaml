completion_gate:
  - item: 'The parameter capsule distinguishes user intake from retrieved primary
      or authoritative sources and records provenance and unresolved conflicts.'
    met: true
    evidence: >-
      parameter-capsule.yaml carries four disjoint layers: intake_layer (marked
      provenance user_supplied_unverified, evidentiary_weight none, with a
      binding rule forbidding its use as evidence), retrieved_layer (two sources,
      each with the exact URLs fetched, read depth, authority class, and
      individually identified quoted facts R1-F1..R1-F13 and R2-F1..R2-F6),
      unretrieved_layer (ten entries U1-U10 with the observed failure per entry),
      and internal_layer (four program records at internal provenance). Conflicts
      are recorded in unresolved_conflicts and in five numbered
      open_reconciliations OR-1..OR-5. Because each quoted fact carries its own
      id and source, ERRATUM-2 below can quarantine a SUBSET of them precisely
      rather than voiding the layer - which is what that structure was for.
  - item: 'The audit plan covers every one of the eleven criteria in the declared
      category, with a certificate or explicit bound, controls, falsifier, budget,
      and stopping rule.'
    met: true
    evidence: >-
      All eleven criteria are present and each carries its declared category:
      field (L1-FIELD, basic_parameter_requirements), equation (L2-EQUATION,
      basic), base (L3-BASE, basic), rho (L5-RHO, ecdlp_security_requirements),
      transfer (L6-TRANSFER, ecdlp), disc (L7-DISC, ecdlp), rigid (L8-RIGID,
      ecc_security_beyond_ecdlp), ladder (L8b-LADDER, beyond), twist (L9-TWIST,
      beyond), complete (L10-COMPLETE, beyond), ind (L11-IND, beyond). Every one
      of the twelve lanes (the eleven plus the prerequisite L4-ORDER-RECONCILE)
      carries mechanism, quantitative_prediction, certificate, controls
      (positive/negative/null), budget, stopping_rule, falsifier, and
      honest_limitation. Where a certificate is impossible the lane says so
      rather than pretending: L11-IND states it can produce only a
      power-calibrated statistical non-refutation, and L6-TRANSFER states its
      lower-bound certificate is NOT succinct and costs K = 10^6 modular
      multiplications to verify.
  - item: 'The plan covers every declared additional diagnostic, or records a
      concrete reason and successor condition for a deferred diagnostic.'
    met: true
    evidence: >-
      All eight are addressed as D1-D8 in the goal's declared order. D1 (order
      factorisations) and D4 (embedding degree) are covered by existing lanes
      without duplication; D5 is an increment on L7; D8 is covered by L8. D2, D3,
      D6 and D7 are new sub-lanes each with full mechanism, predictions,
      certificate, controls, budget, stopping rule, falsifier and limitation.
      Two components are DEFERRED, each with a concrete reason and a successor
      condition, both listed in deferred_items_summary: the A-minimality half of
      rigid/D8 (reason: ~121663 SEA point counts at 255 bits, no backend assumed;
      successor: a scoped handoff declaring PARI/GP or Sage), and L10-COMPLETE
      (reason: the numeral d of edwards25519 was not captured verbatim -
      NOW RESOLVED by ERRATUM-2).
  - item: 'Positive, parameter-matched negative, and same-shape null controls are
      explicit and run before belief in any later task.'
    met: true
    evidence: >-
      control_suite declares five positive controls P1-P5, four parameter-matched
      negative controls N1-N4 with their matching assumptions stated plus one
      deferred N5, and seven same-shape null controls Z1-Z7 each with a
      quantitative prediction. The suite opens with a BLOCKING gating_rule: no
      Curve25519 measurement may be interpreted or cited before its lane's
      controls have run and behaved as specified, and a lane whose controls fail
      produces an instrument-failure record under AGENTS.md rule 3 rather than a
      negative result. Two lanes whose null is genuinely degenerate (L2, D3) are
      disclosed as such in degenerate_null_disclosure rather than being given a
      cosmetic null.
  - item: 'The report states that no curve attack ran and makes no safety or
      vulnerability conclusion.'
    met: true
    evidence: 'claim_status above, stated explicitly and unconditionally.'

