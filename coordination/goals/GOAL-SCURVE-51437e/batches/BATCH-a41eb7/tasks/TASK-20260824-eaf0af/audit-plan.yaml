# ---------------------------------------------------------------------------
# PRIORITIZATION
# ---------------------------------------------------------------------------
prioritization:
  ordering: [L4-ORDER-RECONCILE, L3-BASE, L6-TRANSFER, L9-TWIST, L8b-LADDER,
             L5-RHO, L1-FIELD, L2-EQUATION, L7-DISC, D2, D3, D6, D7, L8-RIGID,
             L10-COMPLETE, D5, L11-IND]
  first_test: L4-ORDER-RECONCILE
  first_test_rationale: >-
    Steps (i) and (iii) of L4 cost under one second of compute, need no controls
    beyond Z3 and the toy positives, and are the cheapest valid discriminator in
    the plan. They (a) resolve OR-1, a live open reconciliation between two IETF
    specifications that this session could not close for lack of an interpreter;
    (b) either produce or withhold #E, which is a strict prerequisite for L5,
    L6, L7, L9, D1, D2, D3 and D5 - eight of the seventeen lanes; and (c) via
    null control Z3 immediately expose whether the pipeline understands that its
    certificate rests on the order-of-G premise rather than on arithmetic. No
    other lane unblocks as much per second, and no other lane's failure would
    invalidate as much downstream work if discovered late.
  information_gain_vs_cost:
    highest_gain_per_second: [L4-ORDER-RECONCILE, L8b-LADDER, L3-BASE]
    reason: 'Each is a handful of modular operations that decides between two
      structurally different theories of the curve (order literals equal or not;
      cyclic or full 2-torsion; base point valid or transcribed wrong), and each
      gates several downstream lanes.'
    lowest_gain_per_second: [L11-IND, 'L8-RIGID (A-minimality half)', L7-DISC]
    reason: >-
      L11 cannot produce a certificate at all, only a bounded statistical
      non-refutation whose power limit is stated. L8's A-minimality half is
      deferred as infeasible. L7 is expensive and, per null Z4, may well turn out
      to be measuring bit length. All three are still IN the plan because the
      goal declares them and because a deferred lane with a stated reason is a
      result; none is silently dropped.

# ---------------------------------------------------------------------------
# TARGET COMPLEXITY
# ---------------------------------------------------------------------------
target_complexity:
  attack_exponent_claimed: none
  statement: >-
    THIS PLAN PROPOSES NO ATTACK AND MOVES NO EXPONENT. It is a measurement
    programme, and under docs/target-result-profile.md it would rank low as
    research direction. It is dispatched work under a declared goal, not a bid
    for the exponent-moving profile, and it is labelled that way rather than
    dressed up.
  audit_time_cost: >-
    Dominated by three items: 10^6 modular multiplications per embedding-degree
    bound (seconds at 255 bits); one attempted factorisation of l-1 (252 bits,
    capped, expected to FAIL under E4); one attempted partial factorisation of
    Delta (~257 bits, capped, expected to reach a useful odd-multiplicity prime).
    Everything else is milliseconds.
  audit_memory_cost: 'O(log p) working memory; certificates are O(1) to O(log p)
    except the lower-bound embedding certificate, which is O(1) to STATE and
    O(K) to VERIFY.'
  verification_cost_of_emitted_certificates:
    - 'L4 Hasse-uniqueness: 2 integer divisions + 1 isqrt. Microseconds.'
    - 'L1 primality at tier T1: 64 modular exponentiations.'
    - 'L6 exact-k: omega(l-1) modular exponentiations - a few dozen, IF the
      factorisation succeeds.'
    - 'L6 lower bound k > K: K = 10^6 modular multiplications. NOT SUCCINCT.
      Presenting it as a short proof would be dishonest.'
    - 'L7 |D| lower bound: one division per claimed odd-multiplicity prime.'
    - 'L2, L8b, L10, D6 Legendre symbols: one modular exponentiation each.'
  hidden_overhead: >-
    The K-multiplication verification cost of the embedding-degree bound is the
    one place where a cheap-looking certificate hides real work, and it is
    disclosed in the certificate itself per IDEA-20260807-98a970.
  tradeoff_note: >-
    One genuine tradeoff inside the audit: exact k requires factoring l-1
    (expensive to produce, succinct to verify) versus a bound requiring K
    multiplications (cheap to produce, expensive to verify). Each lane records
    which route it took. The plan predicts the bound route for l.

# ---------------------------------------------------------------------------
# HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
# ---------------------------------------------------------------------------
honest_accounting:
  objects_considered: [O1, O2, O3, O4, O5]
  objects_rejected:
    - object: 'The full point set E(F_p) as a tracked object.'
      reason: 'FAILS THE LOSSY-PROJECTION TEST - it is not a projection at all,
        it is the state itself. Tracking it is a change of representation, not a
        new object.'
    - object: 'The base point G as a tracked object independent of its order.'
      reason: 'Fails propagation: G is not preserved by any operation the audit
        performs (isogeny, twisting, model change all move it), so it does not
        propagate deterministically. It appears in L3 as a MEASURED quantity, not
        as a tracked object.'
  dominated_by:
    as_an_attack: >-
      n/a - no attack is proposed, so no attack frontier row is claimed against.
    as_a_measurement_instrument: >-
      DOMINATED, and by more than one incumbent. (1) SafeCurves itself already
      publishes the eleven-cell table for this curve; it dominates this plan on
      coverage, authority, and having existed since 2013. (2) The parameter-
      validation procedures mandated in the standards (ANSI X9.62-style and
      SEC-style, per IDEA-20260807-98a970's own dominated_by) dominate it on
      authority and on decades of use. (3) RFC 7748 Appendix A already states
      the generation rules and their thresholds, which is most of what L8 and L6
      re-derive. This plan dominates all three on exactly one axis: its outputs
      would be re-verifiable certificates inside this program's ledger with
      recorded provenance and declared controls, which none of the incumbents
      provides in that form.
    frontier_rows_checked: >-
      Attack frontier rows checked before writing "no attack": rho at
      0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted rho (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031)
      and its n^{2/3+o(1)} full cost (KN-TECH-035); MOV/Frey-Ruck at small k
      (KN-TECH-032); the anomalous/trace-one transfer (KN-TECH-033). Every lane
      here is dominated by all of them in the Pareto sense on time, memory and
      data, because none of them is an attack at all. `dominated_by: null` is NOT
      asserted anywhere.
  sota_delta:
    quantitative: >-
      ZERO speedup against any attack baseline, on every axis - time, memory,
      data, queries. As DATA the delta is measurable and nonzero: a grep of the
      corpus on 2026-08-25 for the two literal order values
      "27742317777372353535851937790883648493" and
      "14def9dea2f79cd65812631a5cf5d3ed" returns ZERO occurrences anywhere in the
      repository, so this program currently holds no subgroup order, no twist
      order, no trace, no CM discriminant and no embedding-degree bound for
      Curve25519. The plan would produce 17 lanes' worth of certified or
      explicitly-bounded rows where there are currently none.
    as_scope: >-
      Converts an intake table cell from an unverified user-supplied assertion
      into either a certified measurement plus an explicitly deferred
      adjudication, or a recorded blocker. That is the whole delta and it is
      small; it is stated at its true size.
  closures_enumerated:
    - closure: 'The `rigid` criterion cannot be fully audited by computation
        alone, at any budget.'
      obstruction: >-
        Rigidity is a property of the DESIGN PROCESS, not of the parameters.
        Re-executing a published generation rule and matching its output
        establishes consistency; it cannot exclude the rule having been chosen
        after its output was seen. No amount of compute changes this, because the
        counterfactual is not a computable object.
      argument: >-
        Formally: for any deterministic rule R and parameter set P with
        R(inputs) = P, there exist infinitely many rules R' with R'(inputs) = P.
        The audit observes the pair (R, P) and can only test membership in the
        preimage; it has no access to the order in which R and P were fixed.
      forward_guidance: >-
        What REMAINS auditable, and what L8 therefore does: the arithmetic half
        of the rule (checkable now) and the base-point minimality half (checkable
        now, cheaply). What remains INFEASIBLE-BUT-NOT-IMPOSSIBLE: A-minimality,
        which needs a point-counting backend and is deferred with a successor
        condition, not closed. The genuinely closed part is only the
        counterfactual, and that closure is about epistemology, not about
        Curve25519.
    - closure: 'The `ind` criterion cannot be certified by this plan, only
        bounded statistically.'
      obstruction: >-
        Indistinguishability is a statement about a statistical distance
        (typically 2^-lambda) between distributions over a space of size ~2^255.
        A finite sample of size n can only bound biases of order n^{-1/2}. At
        n = 10^6 that is ~10^-3, which is astronomically too coarse.
      argument: 'Standard sampling bound: the empirical distance concentrates
        around the true distance with error Theta(sqrt(bins/n)), so certifying a
        2^-100 distance would need n ~ 2^200 samples.'
      forward_guidance: >-
        What remains: (i) the ALGEBRAIC precondition for Elligator 2, which IS
        certifiable exactly and is what L11 actually certifies; (ii) a
        power-calibrated refutation test, which can find gross bias and is
        reported as a failure-to-refute; (iii) a PROOF of the encoding's
        distribution from the literature, which would be a retrieval task, not a
        measurement task, and is the honest route to this criterion. That route
        is open and is NOT attempted here.
    non_closures_explicitly_stated: >-
      No lane concludes that any direction is impossible. Every deferred item
      above carries a successor condition, and the two closures above are
      closures of a METHOD's reach, not of a question.
  open_directions_for_next_session:
    - 'Retrieve U1-U8 (SafeCurves criterion texts) from a session with cr.yp.to
      egress; this alone unblocks the goal''s completion criterion 4.'
    - 'Retrieve U9/U10 with a working PDF text extractor; U10 is the only located
      source expected to state the published twist order, which would let L9''s
      COMPUTED value be corroborated rather than merely computed.'
    - 'Re-fetch RFC 7748 Section 4.1 to capture d verbatim and unblock
      L10-COMPLETE.'
    - 'Scope the point-counting-backend handoff that unblocks L8''s A-minimality
      half and the same-p negative control N5.'
    - 'A cross-curve question this plan raises but does not answer: the twist rho
      cost is PREDICTED to exceed the curve''s own by ~0.5 bits. Whether that
      ordering is systematic across the manifest''s twist-secure curves, or an
      accident of this one, is a cheap comparative measurement across the twenty
      SafeCurves goals and would be a genuine new internal datum. It needs no new
      technique, only the same lanes run twenty times.'
