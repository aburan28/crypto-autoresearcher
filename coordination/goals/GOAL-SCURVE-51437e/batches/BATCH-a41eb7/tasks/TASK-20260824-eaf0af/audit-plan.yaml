# ---------------------------------------------------------------------------
# LANE NAMING
# ---------------------------------------------------------------------------
lane_naming_note: >-
  Lane identifiers are labels, not an ordering, and they are deliberately offset
  from the goal's criterion_order because L4-ORDER-RECONCILE is an inserted
  PREREQUISITE lane that carries no criterion of its own. The eleven criteria
  map as: field->L1, equation->L2, base->L3, rho->L5, transfer->L6, disc->L7,
  rigid->L8, ladder->L8b, twist->L9, complete->L10, ind->L11. All eleven are
  present. D1-D8 are the goal's eight declared additional diagnostics.

# ---------------------------------------------------------------------------
# THRESHOLD POLICY - THE PLAN'S SHARPEST LIMITATION, STATED FIRST
# ---------------------------------------------------------------------------
threshold_policy:
  problem: >-
    The SafeCurves criterion definitions and numeric thresholds could not be
    retrieved in this session (parameter-capsule unretrieved_layer U1-U8, HTTP
    502 on every attempt). Adjudicating an intake True/False cell requires the
    threshold that cell was computed against. We do not have it.
  rule_adopted:
    - >-
      MEASUREMENT AND ADJUDICATION ARE SEPARATED. Every lane measures its
      quantity and emits its certificate WITHOUT reference to a SafeCurves
      threshold. Adjudication of the intake cell is a distinct, later step,
      blocked on OR-2.
    - >-
      Where a threshold is genuinely needed to make a lane's prediction
      quantitative, the plan uses a RETRIEVED threshold from RFC 7748 Appendix A
      (capsule facts R1-F8, R1-F9, R1-F10) and labels it as RFC 7748's rule.
      RFC 7748's generation rules are NOT the SafeCurves criteria, may differ
      from them, and must never be reported as them.
    - >-
      No SafeCurves threshold is reconstructed from memory anywhere in this
      plan. Where a lane's criterion definition is unknown to us, the lane says
      so and defines its own measurable core explicitly, marked
      `definition_source: this_plan`.
  consequence_for_the_goal: >-
    Goal completion criterion 4 ("adjudicate every disagreement with the
    preregistered SafeCurves row") CANNOT be met until OR-2 is resolved. Goal
    completion criteria 1, 2, 3 and 5 are unaffected by this gap.

