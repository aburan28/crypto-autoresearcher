# ---------------------------------------------------------------------------
# OBJECT-FIRST FRAMING (docs/inventor-protocol.md sections 1-2)
# ---------------------------------------------------------------------------
object_enumeration_caveat: >-
  This program has no written object-enumeration for the ECDLP; that is
  KN-OPEN-019. The mapping below from audit families to tracked objects is a
  SKETCH, not a taxonomy, and must not be cited as one.

tracked_objects:
  - id: O1
    object: 'The Frobenius trace t = p + 1 - #E, a single integer with |t| <= 2*sqrt(p).'
    used_by: [L5-RHO, L6-TRANSFER, L7-DISC, L9-TWIST, D3, D5]
    lossy_projection_test:
      what_is_discarded: 'The coefficient A, the base point, the j-invariant,
        the model, the coordinate system, the entire group structure beyond its
        order.'
      discarded_compatibly_with: >-
        F_p-isogeny (t is an isogeny class invariant, so the retained integer
        propagates deterministically), quadratic twisting (t -> -t, a
        deterministic one-step propagation), and base change to F_{p^m} (via the
        Frobenius recursion t_{m+1} = t*t_m - p*t_{m-1}).
      verdict: >-
        GENUINELY LOSSY, not a change of coordinates. A 255-bit curve collapses
        to a ~129-bit integer and nothing about the curve is recoverable from t
        alone (whole isogeny classes share it). The retained part still
        propagates deterministically under all three operations the audit uses.
        PASSES.
  - id: O2
    object: 'The pair (l, ord_l(p)) - prime subgroup order and the multiplicative
      order of the characteristic in it.'
    used_by: [L6-TRANSFER, D4-EMBED, L9-TWIST]
    lossy_projection_test:
      what_is_discarded: 'Everything except two integers.'
      discarded_compatibly_with: 'F_p-isogeny (constant, since p and l are class
        invariants); base change to F_{p^m} (k -> k/gcd(k,m) with F_{p^k}
        unchanged).'
      verdict: 'PASSES. Argument taken verbatim from IDEA-20260807-98a970
        object_first_candidate; reused, not re-derived.'
  - id: O3
    object: 'The squarefree part D of Delta = t^2 - 4p, with conductor v, i.e.
      the CM field and the order.'
    used_by: [L7-DISC, D3, D5]
    lossy_projection_test:
      what_is_discarded: 'The conductor is separated from the field; the curve
        and its order are gone.'
      discarded_compatibly_with: >-
        F_p-isogeny (the CM FIELD Q(sqrt(D)) is constant across the isogeny
        class; the CONDUCTOR v can change under l-isogenies that move between
        orders, so the pair (D, v) propagates but only D is invariant). This
        asymmetry is the reason the lane certifies D and reports v separately
        rather than folding them together.
      verdict: >-
        PASSES for D. For v the projection is lossy but NOT invariant under
        isogeny, so v is reported as a measurement of the specific curve, never
        as a class statement. Disclosed rather than glossed.
  - id: O4
    object: 'The exceptional set of an addition/ladder/model-conversion formula:
      the subvariety where a denominator vanishes, restricted to F_p-points.'
    used_by: [L8b-LADDER, L10-COMPLETE, D6, D7]
    lossy_projection_test:
      what_is_discarded: 'The formula''s arithmetic cost, its representation,
        and every non-exceptional input.'
      discarded_compatibly_with: >-
        Composition of maps (the exceptional set of a composite is contained in
        the union of preimages of the components'' exceptional sets - a
        deterministic one-step propagation rule), and model change (transported
        through the birational map, up to that map''s own exceptional set).
      verdict: >-
        PASSES, and this is the object the `complete`, `ladder`, D6 and D7 lanes
        actually share. Naming it once is what lets D6 and D7 be one propagation
        rule applied twice rather than two unrelated searches.
  - id: O5
    object: 'The 2-Sylow subgroup structure of E(F_p) and of E^t(F_p).'
    used_by: [L8b-LADDER, L9-TWIST, D2, D6]
    lossy_projection_test:
      what_is_discarded: 'The odd part - which is the entire cryptographic group.'
      discarded_compatibly_with: 'The small-subgroup confinement operation, which
        acts only on the 2-part; and the model-conversion maps, whose exceptional
        sets are supported on the 2-torsion.'
      verdict: >-
        PASSES, and the discard is the point: the object deliberately throws
        away the hard part of the problem and keeps the part that leaks in the
        oracle model. Per KN-TECH-034 this is an ADJACENT-MODEL object and no
        result about it is an ECDLP result.

# ---------------------------------------------------------------------------
# GLOBAL CONTROL SUITE - RUNS BEFORE ANY INTERPRETATION
# ---------------------------------------------------------------------------
control_suite:
  gating_rule: >-
    BLOCKING. No measurement on Curve25519 may be interpreted, reported as a
    property, or cited by any downstream record until the controls its lane
    names have been run and have behaved as specified. A measurement instrument
    that has never been shown to FIRE cannot certify that a property is absent.
    A lane whose controls fail produces an instrument-failure record under
    AGENTS.md rule 3, not a negative result.
  positive_controls:
    - id: P1
      object: 'The manifest''s Anomalous row (GOAL-SCURVE-48e06c parameters).'
      must_trigger: 'L6-TRANSFER additive sub-lane: t = 1, #E = p. L7-DISC:
        a small certified |D|.'
      precondition: >-
        Its parameters must first be independently re-sourced. The goal's claim
        boundaries state it is a positive-control CANDIDATE, not a verified one.
        Until sourced, P1 is unavailable and lanes fall back to P3.
    - id: P2
      object: 'The manifest''s BN(2,254) row (GOAL-SCURVE-e33f7d parameters).'
      must_trigger: 'D4-EMBED: k = 12 exactly. L7-DISC: |D| = 3.'
      precondition: 'Same re-sourcing precondition as P1.'
    - id: P3
      object: 'Synthetic toy curves generated in-session at 30-60 bit p, where
        every quantity is checkable by brute force.'
      must_trigger: >-
        A toy supersingular curve (t = 0) must return k = 2. A toy curve with
        p = 1 mod l must return k = 1. A toy curve built by the CM method with a
        chosen small D must return that D exactly. A toy curve with a smooth
        twist must be flagged by L9. A toy Montgomery curve with A^2-4 a square
        must be flagged by L8b as having full 2-torsion.
      note: 'These are IDEA-20260807-98a970''s planted positives, specialised.'
    - id: P4
      object: 'The affine short-Weierstrass addition law (known incomplete).'
      must_trigger: 'D7 must FIND its exceptions (P + P and P + (-P)). If the
        exception searcher cannot find a known exception, every "zero
        exceptions" result in D7 and L10 is void.'
    - id: P5
      object: 'Known composites: 2047 (strong pseudoprime base 2), 561
        (Carmichael), and a fresh 255-bit semiprime with two ~128-bit factors.'
      must_trigger: 'L1 and every primality certificate must declare all three
        composite.'
  negative_controls_parameter_matched:
    - id: N1
      object: 'A second Montgomery coefficient A'' over the SAME p = 2^255-19,
        with A'' = 486666 (also > 2 and = 2 mod 4).'
      must_not_trigger: 'L2 singularity; L8b full-2-torsion (subject to its own
        Legendre symbol, which is measured not assumed).'
      matching_assumptions_stated: 'Matches on field, model, and coefficient
        residue class. Does NOT match on group order, which is unknown without
        point counting.'
    - id: N2
      object: 'A freshly generated 255-bit prime with a Pocklington certificate.'
      must_not_trigger: 'L1 compositeness.'
    - id: N3
      object: 'A sourced twist-secure named curve from the manifest (M-221 or
        E-222), after its own parameters are independently sourced.'
      must_not_trigger: 'L9 smooth-twist flag.'
      limitation: 'Cross-curve, so it matches on design intent only, not on p.'
    - id: N4
      object: 'A twisted Edwards curve at the same p with d a NON-square other
        than edwards25519''s d.'
      must_not_trigger: 'L10 incompleteness.'
    deferred_negative_control:
      id: N5
      object: 'A same-p, same-bit-length curve with a deliberately small
        embedding degree or a deliberately smooth twist.'
      why_deferred: >-
        Constructing one at p = 2^255-19 requires point counting per candidate
        (E2). DEFERRED with successor condition: a session with an SEA backend.
        Until then the corresponding positive controls run at toy p only, which
        imports transfer assumption H4.
  null_controls_same_shape:
    - id: Z1
      applies_to: [L1-FIELD]
      construction: '1000 uniformly random 255-bit odd integers, identical code
        path.'
      quantitative_prediction: >-
        By the prime number theorem the density of primes near 2^255 is
        1/ln(2^255) ~ 1/176.75; restricting to odd integers doubles it to
        ~1/88.4. Expected primes among 1000 odd draws ~11.3, Poisson sd ~3.4.
        An instrument returning 0, or returning more than ~25, is broken.
    - id: Z2
      applies_to: [L3-BASE, L8b-LADDER, L10-COMPLETE]
      construction: 'Uniformly random field elements fed to the on-curve test,
        the A^2-4 square test, and the d-square test respectively, 10^4 draws
        each.'
      quantitative_prediction: 'Fraction 0.5 +/- 0.005 (3 sigma at n = 10^4) in
        each of the three. A result at 0 or 1 indicates a Legendre-symbol bug.'
    - id: Z3
      applies_to: [L4-ORDER-RECONCILE]
      construction: 'Replace l by a random 252-bit prime, keep p, and run the
        Hasse-interval uniqueness step unchanged.'
      quantitative_prediction: >-
        The step will STILL return a unique multiplier m, because it is pure
        arithmetic on (p, l) and knows nothing about any curve. This is the
        point of the control: it demonstrates that the certificate's force comes
        entirely from the separately certified premise "G in E(F_p) has order l",
        and that the arithmetic step alone certifies nothing. Any report of
        #E = 8l that does not also carry the order-of-G certificate is void.
    - id: Z4
      applies_to: [L7-DISC, D5]
      construction: 'Replace Delta by 10^3 uniformly random integers of the same
        bit length (~257 bits) and run the identical odd-multiplicity search.'
      quantitative_prediction: >-
        A uniformly random integer is squarefree with probability 6/pi^2 ~
        0.6079, so ~608 of 1000 nulls should yield a maximal certified bound.
        THE DISCRIMINATOR: if Curve25519's Delta produces a certified |D| bound
        statistically indistinguishable from this null, the lane has measured
        BIT LENGTH, not curve structure, and must report it that way. If instead
        Delta is markedly MORE structured than the null (small square factors,
        many tiny primes), that is a real signal about the curve.
    - id: Z5
      applies_to: [L6-TRANSFER, D4-EMBED]
      construction: 'Random pairs (p'', l'') with no curve relation, at 40, 60
        and 80 bits, 10^3 draws each; measure ord_{l''}(p'').'
      quantitative_prediction: >-
        The number of elements of (Z/l''Z)^* of order at most K is at most
        sum_{d<=K} phi(d) <= K^2/2, so P(ord <= K) <= K^2/(2 l''). At 40 bits
        (l'' ~ 1.1 x 10^12) with K = 10^3 this predicts a hit rate below
        5 x 10^-7, and the empirical CDF over the 10^3 draws must be consistent
        with that ceiling at all three sizes (see H2). THE DISCRIMINATOR: at
        l ~ 2^252 the same ceiling for K = 10^6 is 10^12/(2 x 2^252) ~ 2^-213,
        so "k > 10^6" is what a RANDOM integer pair would also give with
        probability 1 - 2^-213. That bound is therefore almost no evidence about
        Curve25519 specifically, and D4 must say so rather than presenting it as
        a curve property.
    - id: Z6
      applies_to: [L5-RHO]
      construction: 'Run the identical walk instrumentation on (Z/lZ, +), where
        the DLP is solvable by one modular inversion.'
      quantitative_prediction: >-
        The instrument must NOT report a sqrt(l) cost. If it does, the counter is
        measuring iterations of a walk rather than hardness, and no rho figure
        may be reported.
    - id: Z7
      applies_to: [L11-IND]
      construction: 'Shuffle the encoder''s outputs; and separately run the test
        on a uniform byte source.'
      quantitative_prediction: 'Chi-square p-values uniform on [0,1]; rejection
        rate at alpha = 0.001 must be ~0.001, not higher.'
    degenerate_null_disclosure:
      applies_to: [L2-EQUATION, D3]
      statement: >-
        For singularity (A^2 = 4) and for extra automorphisms (j in {0,1728})
        the null is DEGENERATE: a random A triggers them with probability ~2/p,
        so the null predicts zero events and has no discriminating power. This is
        disclosed rather than dressed up. These two lanes rest on their POSITIVE
        controls (a constructed A = 2, and constructed j = 0 and j = 1728 curves
        at the same p) and on nothing else.

# ---------------------------------------------------------------------------
# HEURISTIC ASSUMPTIONS
# ---------------------------------------------------------------------------
heuristic_assumptions:
  - id: H1
    statement: >-
      Delta = t^2 - 4p, for a curve not constructed by the CM method, behaves in
      its divisibility by squares like a uniformly random integer of the same
      size; in particular P(Delta squarefree) ~ 6/pi^2.
    rigorous_support: >-
      The density of squarefree integers is exactly 6/pi^2 (Gegenbauer). The
      rigorous side is that any prime q with q^1 || Delta divides the squarefree
      part exactly, so every certified odd-multiplicity prime is an
      UNCONDITIONAL lower-bound factor of |D|. H1 is used only to predict how
      LARGE that bound should be, never to assert it.
    validation_plan: >-
      Sample 10^3 random 257-bit integers (control Z4), run the identical
      odd-multiplicity search, compare the empirical distribution of certified
      bounds against Curve25519's single observation by an exact rank test.
      Tail check: the smallest certified bound in the null sample versus the
      predicted 6/pi^2 squarefree fraction.
    sampled_parameters: '257-bit integers; n = 1000; trial division to 10^7 then
      ECM to a declared curve/bound budget.'
    transfer_assumption: 'None - the null is at the same bit length as the real
      Delta. This is the one lane with no size transfer.'
  - id: H2
    statement: >-
      For a curve not constructed to be pairing-friendly, ord_l(p) behaves like
      the multiplicative order of a uniformly random element of (Z/lZ)^*; in
      particular P(ord_l(p) <= K) <= (sum_{d<=K} phi(d))/(l-1) ~ K^2/(2l).
    rigorous_support: >-
      The bound sum_{d<=K} phi(d) <= K^2/2 on the number of elements of order at
      most K is unconditional. The heuristic is only that p is TYPICAL in this
      respect for the curves audited; it imitates the Balasubramanian-Koblitz
      genericity statement relayed in KN-LIT-086/KN-TECH-032, which is a
      probability over random curves and not a statement about this curve.
    validation_plan: >-
      Control Z5. Sample 10^3 random (p'', l'') pairs at 40, 60 and 80 bits;
      compute exact orders by factoring l''-1 (feasible at those sizes);
      compare the empirical CDF of ord/l'' against the predicted K^2/(2l) tail.
      Tail check: the smallest observed order versus the prediction.
    sampled_parameters: '40, 60, 80 bits; n = 1000 each.'
    transfer_assumption: >-
      EXPLICIT AND LOAD-BEARING: the empirical validation happens at 40-80 bits
      where exact orders are computable; the claim is applied at 252 bits where
      only a bound is computable. The transfer assumed is that the order
      DISTRIBUTION is scale-free in the stated normalised form. This is
      untested above 80 bits by this plan and must be stated in any record that
      cites the k-bound.
  - id: H3
    statement: >-
      The implemented Pollard-rho walk attains the ideal expected cost
      sqrt(pi*l/4) ~ 0.886*sqrt(l) group operations, and the negation map
      contributes a speedup of exactly sqrt(2) net of fruitless-cycle handling.
    rigorous_support: >-
      The birthday bound gives the sqrt(pi/4) constant for a uniformly random
      walk; the sqrt(|Aut|) speedup is the standard equivalence-class argument
      (KN-TECH-001, KN-TECH-006, KN-TECH-018 internal). What is heuristic is
      that the specific partition/distinguished-point implementation is close
      enough to uniform, and that cycle handling does not eat the sqrt(2).
    validation_plan: >-
      Run rho to completion on a 40-bit prime-order subgroup, 100 independent
      trials, with and without the negation map. Rho's runtime is Rayleigh-
      distributed with sd/mean = sqrt(4/pi - 1) ~ 0.523, so the sample mean over
      100 trials has relative sd ~0.052. Predicted ratio measured/0.886*sqrt(l)
      = 1.00 +/- 0.16 at 3 sigma. Predicted negation-map speedup 1.41 +/- 0.23.
      Tail check: the empirical CDF of the 100 runtimes against the Rayleigh CDF
      by Kolmogorov-Smirnov.
    sampled_parameters: '40-bit subgroup order; n = 100 per configuration.'
    transfer_assumption: >-
      The CONSTANT is validated at 40 bits and applied at 252 bits. The
      functional form sqrt(l) is not in doubt; the constant and the negation-map
      net gain are what transfer, and a systematic implementation overhead at 40
      bits may not scale identically. Stated, not hidden.
  - id: H4
    statement: >-
      An instrument validated on toy curves at 30-60 bit p is CORRECT at 255
      bits, even though its COST behaviour is not transferable.
    rigorous_support: >-
      None. This is a pure engineering assumption and the plan labels it as the
      weakest item in the suite. It is unavoidable because E2 forbids
      constructing same-p parameter-matched positives.
    validation_plan: >-
      Partial only. Every lane that relies on H4 must additionally run its
      instrument on at least one 255-bit object whose answer is independently
      known from a retrieved source, so that a size-dependent bug (word-size,
      overflow, modular-reduction) has one chance to surface. Where no such
      object exists, the lane records that it has NO 255-bit instrument check
      and its result carries that caveat.
    sampled_parameters: 'Toy p at 30, 40, 50, 60 bits.'
    transfer_assumption: 'Correctness transfers; cost does not. Stated in every
      lane that uses a toy control.'

# ---------------------------------------------------------------------------
# LANES
# ---------------------------------------------------------------------------
lanes:

# --------------------------- PREREQUISITE ----------------------------------
  - id: L4-ORDER-RECONCILE
    criterion: 'none (prerequisite for L5, L6, L7, L9, D1-D5)'
    category: prerequisite
    priority: 1
    tracked_object: O1
    definition_source: this_plan
    mechanism: >-
      Three steps. (i) BASE RECONCILIATION: decide whether the hexadecimal
      literal in RFC 7748 Section 4.1 (capsule R1-F4) and the decimal literal in
      RFC 8032 Section 5.1 (capsule R2-F3) denote the same integer l, resolving
      open item OR-1. (ii) PRIMALITY OF l. (iii) GROUP ORDER WITHOUT POINT
      COUNTING: given that l is prime, that the base point G lies on E and
      satisfies [l]G = O with G != O (lane L3), and that l > 4*sqrt(p), the
      Hasse interval [p+1-2sqrt(p), p+1+2sqrt(p)] has width 4sqrt(p) < l and so
      contains AT MOST ONE multiple of l; #E is a multiple of l by Lagrange;
      therefore #E is that unique multiple. Compute m_lo = ceil((p+1-2sqrt(p))/l)
      and m_hi = floor((p+1+2sqrt(p))/l).
    quantitative_prediction:
      - metric: 'equality of the two order literals'
        direction: different
        value: 'PREDICTED EQUAL. Recorded before computation so that confirming
          it is a controlled result and not a retrofit.'
      - metric: 'primality tier reached for l'
        direction: higher
        value: 'At least BPSW + 64 Miller-Rabin bases; Pocklington or ECPP if
          l-1 factors within budget.'
      - metric: 'm_lo and m_hi'
        direction: different
        value: 'PREDICTED m_lo = m_hi = 8, hence #E = 8*l, consistent with the
          cofactor 8 of R1-F5 and R2-F4.'
      - metric: 'l vs 4*sqrt(p)'
        direction: higher
        value: 'l ~ 2^252 and 4*sqrt(p) ~ 2^129.5, so the uniqueness premise
          holds with ~122 bits of margin. Predicted ratio l/(4 sqrt p) > 2^122.'
    certificate: >-
      SUCCINCT AND THIRD-PARTY VERIFIABLE IN MICROSECONDS: the integers p, l,
      isqrt(p), m_lo, m_hi, and the two divisions. Verification is two integer
      divisions and one integer square root. Plus, separately, the primality
      certificate for l at whatever tier was reached, and lane L3's
      order-of-G certificate, WITHOUT WHICH THE ARITHMETIC CERTIFIES NOTHING
      (see null control Z3).
    controls:
      positive: 'P3 toy curves at 30-40 bits where #E is known by brute-force
        point counting; the pipeline must reproduce #E exactly. Plus a toy curve
        with l < 4 sqrt(p): the pipeline MUST return INCONCLUSIVE rather than a
        number. This second control tests the ARGUMENT, not merely the code, and
        is the one that matters.'
      negative: 'A toy curve of cofactor 4; the pipeline must return 4, not 8.'
      'null': Z3
    budget:
      wall_clock_seconds: 1000
      breakdown: 'Steps (i) and (iii): under 1 second. Step (ii) primality
        certificate: up to 900 s attempting the factorisation of l-1.'
      memory_gb: 1
    stopping_rule: >-
      Stop step (ii) at 900 s and record the highest tier reached. Steps (i) and
      (iii) have no stopping rule; they either complete or the environment
      failed.
    falsifier:
      - 'The two literals denote different integers -> a genuine conflict between
        two IETF specifications; triggers the goal pause condition; every
        downstream lane is blocked.'
      - 'm_lo != m_hi -> the uniqueness premise fails and the certificate is
        withdrawn; fall back to point counting (deferred under E2).'
      - 'm_lo = m_hi but != 8 -> arithmetic contradicts the specified cofactor;
        halt and re-fetch RFC 7748 Section 4.1.'
      - 'l composite -> RFC 7748 states a composite subgroup order; halt and
        escalate. This would be a material finding and must not leave the
        repository before independent review.'
    honest_limitation: >-
      The whole lane is CONDITIONAL on l being prime at whatever tier is
      reached. If only the BPSW tier is reached, every downstream lane inherits
      a probable-prime premise and must say so in its own record. "Probable
      prime" may never be written as "prime".

# --------------------------- BASIC PARAMETER REQUIREMENTS -------------------
  - id: L1-FIELD
    criterion: field
    category: basic_parameter_requirements
    priority: 3
    tracked_object: 'the integer p itself'
    definition_source: 'this_plan (SafeCurves `field` definition UNRETRIEVED,
      OR-2)'
    measurable_core: 'p = 2^255 - 19 exactly as an integer; p prime; bit length
      exactly 255; the field is a prime field, not an extension or binary field.'
    mechanism: >-
      Reconstruct p from the closed form and compare bit-for-bit against R1-F1.
      Then establish primality at the highest tier the budget reaches:
      T1 = BPSW plus 64 independent Miller-Rabin bases (PROBABLE PRIME);
      T2 = Pocklington, requiring a sufficiently factored part of p-1 = 2^2 *
      (2^253 - 5); T3 = an ECPP certificate. Report the tier, never a tier above
      the one reached.
    quantitative_prediction:
      - metric: 'Miller-Rabin bases witnessing compositeness of p'
        direction: lower
        value: 'PREDICTED 0 of 64.'
      - metric: 'bit length of p'
        direction: different
        value: 'PREDICTED exactly 255.'
      - metric: 'primality tier reached'
        direction: higher
        value: 'T1 near-certain; T2 conditional on factoring 2^253 - 5, which is
          NOT predicted to succeed; T3 not expected in pure Python. An honest
          mixed outcome is pre-registered.'
    certificate: 'The 64 MR witnesses (verifiable in 64 modular exponentiations);
      or the Pocklington/ECPP certificate if reached.'
    controls:
      positive: P5
      negative: N2
      'null': Z1
    budget: {wall_clock_seconds: 700, memory_gb: 1}
    stopping_rule: 'T1 immediately; cap the T2 factoring attempt at 600 s; do not
      attempt T3.'
    falsifier: 'Any MR base witnesses compositeness -> transcription error or a
      material finding; halt, re-fetch R1, and do not report.'
    honest_limitation: >-
      This lane measures primality and size. It does NOT evaluate SafeCurves'
      `field` criterion, whose text we do not have. The intake cell field:true
      is therefore NOT adjudicated by this lane.

  - id: L2-EQUATION
    criterion: equation
    category: basic_parameter_requirements
    priority: 3
    tracked_object: 'the pair (discriminant-nonvanishing witness, j-invariant)'
    definition_source: 'this_plan (SafeCurves `equation` definition UNRETRIEVED)'
    measurable_core: >-
      The stated equation defines a nonsingular curve over F_p. For the
      Montgomery form B v^2 = u^3 + A u^2 + u with B = 1, nonsingularity holds
      iff A^2 - 4 != 0 in F_p. Also compute the j-invariant
      j = 256 (A^2 - 3)^3 / (A^2 - 4).
    mechanism: 'Exact modular arithmetic. Emit the modular inverse w of A^2-4 as
      a one-multiplication witness that A^2-4 != 0.'
    quantitative_prediction:
      - metric: 'A^2 - 4 mod p'
        direction: different
        value: 'PREDICTED nonzero.'
      - metric: 'j mod p compared with 0 and with 1728'
        direction: different
        value: >-
          PREDICTED j not in {0, 1728}. THE TWO OUTCOMES MEAN DIFFERENT THINGS:
          j not in {0,1728} implies Aut(E) = {+/-1}, so D3's rho adjustment is
          exactly sqrt(2); j = 0 would give |Aut| = 6 and a sqrt(3) further
          speedup plus CM by Q(sqrt(-3)); j = 1728 would give |Aut| = 4 and CM
          by Q(i). The lane therefore discriminates between three distinct
          automorphism regimes, not merely "pass/fail".
    certificate: 'The exact residues A^2-4 mod p, w with w(A^2-4) = 1 mod p, and
      j mod p. Verification: two modular multiplications.'
    controls:
      positive: 'A = 2 over the same p (singular, A^2-4 = 0) must be flagged.
        Plus a constructed A with A^2 = 3 mod p (j = 0) and one with A^2 = 4 + s
        chosen so j = 1728, both at the SAME p; both must be flagged.'
      negative: N1
      'null': 'DEGENERATE - see degenerate_null_disclosure. Reported as such.'
    budget: {wall_clock_seconds: 10, memory_gb: 1}
    stopping_rule: 'Single pass; no iteration.'
    falsifier: 'A^2 = 4 mod p -> the stated equation is singular and defines no
      elliptic curve; halt immediately, every other lane is void.'
    honest_limitation: >-
      Nonsingularity is necessary, not sufficient, for whatever SafeCurves means
      by `equation`. The lane's null is degenerate and it leans entirely on
      constructed positives; that is disclosed, not concealed.

  - id: L3-BASE
    criterion: base
    category: basic_parameter_requirements
    priority: 2
    tracked_object: 'the base point G and its order'
    definition_source: 'this_plan (SafeCurves `base` definition UNRETRIEVED)'
    measurable_core: 'G = (U, V) = (9, V(P)) satisfies the curve equation; G is
      not the identity; [l]G = O; hence ord(G) = l since l is prime.'
    mechanism: >-
      (a) Evaluate V^2 - (U^3 + A U^2 + U) mod p exactly. (b) Compute [l]G USING
      FULL-COORDINATE ARITHMETIC or the Edwards model, NOT the x-only ladder.
      This is not pedantry: the x-only ladder cannot distinguish a curve point
      from its twist partner, so an x-only [l]G = O is consistent with G lying
      on the twist, and using it here would make the certificate circular with
      lane L9. (c) Check G != O.
    quantitative_prediction:
      - metric: 'V^2 - (U^3+AU^2+U) mod p'
        direction: different
        value: 'PREDICTED exactly 0.'
      - metric: '[l]G'
        direction: different
        value: 'PREDICTED the identity, with G != identity, hence ord(G) = l.'
    certificate: 'The exact residue (must be 0); the final projective coordinates
      of [l]G with the Z = 0 witness; and the scalar-multiplication ladder
      transcript hash for reproducibility. Verification cost: one exponentiation-
      length scalar multiplication, ~252 doublings.'
    controls:
      positive: 'A u-value on the TWIST (u^3+Au^2+u a non-residue) must be
        REJECTED by (a). A point of order 8 must be REJECTED by (b)/(c).'
      negative: 'A random [k]G for random k must PASS both.'
      'null': Z2
    budget: {wall_clock_seconds: 60, memory_gb: 1}
    stopping_rule: 'Single pass.'
    falsifier:
      - 'Nonzero residue -> V(P) transcription error; halt and re-fetch R1-F7.'
      - '[l]G != O -> either l or G is wrong; blocks L4 step (iii) entirely.'
    honest_limitation: >-
      Establishes that G generates a subgroup of order l. Says nothing about
      whether l is the LARGEST prime order, which is L4's job, nor about how G
      was chosen, which is L8's.

# --------------------------- ECDLP SECURITY REQUIREMENTS --------------------
  - id: L5-RHO
    criterion: rho
    category: ecdlp_security_requirements
    priority: 4
    tracked_object: 'the pair (l, |Aut(E)|)'
    definition_source: 'this_plan (SafeCurves `rho` threshold UNRETRIEVED)'
    depends_on: [L4-ORDER-RECONCILE, L2-EQUATION, L7-DISC]
    mechanism: >-
      Pollard rho on a cyclic group of prime order l costs sqrt(pi l / 4) ~
      0.886 sqrt(l) group operations (KN-TECH-001, KN-TECH-006 internal),
      reduced by sqrt(|Aut(E)|) when the automorphism classes are usable
      (KN-TECH-018). Compute the exact integer floor(0.886 * isqrt(l)) and its
      bit length; take |Aut| from L2's j-invariant.
    quantitative_prediction:
      - metric: 'log2 of the unadjusted rho cost in group operations'
        direction: different
        value: >-
          PREDICTED 125.83. Derivation stated so it is checkable: l = 2^252 + c
          with c ~ 2.774e37 ~ 2^124.4, so c/2^252 ~ 4e-39 and sqrt(l) = 2^126 to
          38 significant figures; log2(0.886) = -0.1746. Tolerance +/- 0.05.
      - metric: 'log2 of the negation-map-adjusted rho cost'
        direction: lower
        value: 'PREDICTED 125.33, i.e. exactly 0.5 lower. Tolerance +/- 0.10 to
          absorb fruitless-cycle overhead.'
      - metric: 'measured/predicted cost ratio on the 40-bit positive control'
        direction: different
        value: 'PREDICTED 1.00, 3-sigma interval [0.84, 1.16] over 100 trials
          (Rayleigh sd/mean 0.523, n = 100).'
    certificate: >-
      The exact big integers isqrt(l) and floor(886 * isqrt(l) / 1000), their
      bit lengths, and l itself. Verification: one integer square root and one
      multiplication. NOTE HONESTLY: this certifies an ARITHMETIC EVALUATION of
      a cost formula, not a lower bound on the cost of solving the ECDLP. No
      lower bound on ECDLP hardness is claimed or claimable here.
    controls:
      positive: >-
        Run rho to COMPLETION on a 40-bit prime-order subgroup, 100 trials,
        counting actual group operations. This validates the 0.886 constant
        empirically rather than asserting it (H3). Then repeat with the negation
        map for the sqrt(2).
      negative: 'A constructed j = 0 curve at matched subgroup size: predicted
        measured speedup sqrt(3) beyond the negation map. This discriminates the
        automorphism adjustment from the group size, which a single curve cannot.'
      'null': Z6
    budget: {wall_clock_seconds: 900, memory_gb: 2}
    stopping_rule: 'Stop the 40-bit control after 100 completed trials or 600 s,
      whichever first; report n actually completed.'
    falsifier:
      - 'Positive-control ratio outside [0.7, 1.4] -> the cost model as
        implemented is wrong and NO Curve25519 rho figure may be reported.'
      - 'Negation-map speedup outside [1.15, 1.65] -> the sqrt(2) claim is not
        supported by this implementation; report the measured value instead.'
      - 'Z6 returns a sqrt(l) cost on (Z/lZ,+) -> the counter measures iterations
        rather than hardness; the lane is void.'
    honest_limitation: >-
      A generic-algorithm cost model evaluated at l. It is not an attack, not a
      hardness proof, and says nothing about non-generic attacks. SafeCurves' own
      rho threshold is unretrieved, so the intake cell rho:true is NOT
      adjudicated.

  - id: L6-TRANSFER
    criterion: transfer
    category: ecdlp_security_requirements
    priority: 2
    tracked_object: 'O1 (t) and O2 (ord_l(p))'
    definition_source: 'this_plan for the measurable core; RFC 7748 Appendix A
      R1-F8 and R1-F9 supply RETRIEVED thresholds that are NOT SafeCurves''.'
    depends_on: [L4-ORDER-RECONCILE]
    reuses: 'IDEA-20260807-98a970 certificate formats and degenerate checks,
      specialised to (p, l).'
    mechanism: >-
      TWO SUB-LANES. (a) ADDITIVE: t = p + 1 - #E; flag t = 1 (anomalous, giving
      the linear-time Smart/Satoh-Araki/Semaev transfer to (F_p,+), KN-TECH-033
      internal) and flag t = 0 (supersingular). (b) MULTIPLICATIVE: k = ord_l(p),
      the MOV/Frey-Ruck embedding degree, plus IDEA-20260807-98a970's three
      degenerate checks p = 1 mod l, l = p, and l^2 | #E (equivalently l | h for
      cofactor h).
    quantitative_prediction:
      - metric: 't'
        direction: different
        value: 'PREDICTED t not in {0, 1}, per RFC 7748''s own generation rule
          R1-F8. Predicted |t| < 2 sqrt(p) ~ 2^128.5 by Hasse.'
      - metric: 'the three degenerate flags'
        direction: lower
        value: 'PREDICTED all three FALSE. Any TRUE is a material finding.'
      - metric: 'smallest j <= 10^6 with p^j = 1 mod l'
        direction: lower
        value: 'PREDICTED none exists, certifying k > 10^6.'
      - metric: 'whether k > (l-1)/100 can be certified'
        direction: different
        value: >-
          PREDICTED NO. RFC 7748's MOV-degree rule R1-F9 requires k > (l-1)/100,
          which needs the EXACT k, which needs the factorisation of l-1, which
          E4 says will probably fail. THE GAP IS PRE-REGISTERED: this lane
          expects to certify k > 10^6 and to be UNABLE to certify the RFC's own
          rule. Reporting the weaker bound as if it established the RFC's rule
          would be the error this prediction exists to prevent.
    certificate: >-
      EXACT-k: the factorisation l-1 = prod r_i^{e_i} with a primality
      certificate per r_i and the witnesses p^{(l-1)/r_i} mod l; verification is
      omega(l-1) modular exponentiations. LOWER-BOUND: the assertion that
      p^j != 1 mod l for all j <= K, verified by K = 10^6 modular
      multiplications. THE LOWER-BOUND CERTIFICATE IS NOT SUCCINCT - it costs K
      work to verify as well as to produce, and the record must say so.
      Additionally the representability wall: one element of F_{p^k} occupies
      k*ceil(log2 p) bits, so at k > 10^6 a single field element exceeds 2.5*10^8
      bits ~ 32 MB, and at k ~ l it is astronomically infeasible independently of
      any index-calculus cost.
    controls:
      positive: 'P1 (Anomalous: must return t = 1), P2 (BN(2,254): must return
        k = 12), P3 (toy supersingular: must return k = 2; toy p = 1 mod l: must
        return k = 1).'
      negative: 'A toy random prime-order curve: must return k > K and t not in
        {0,1}. The same-p version is N5, DEFERRED under E2.'
      'null': Z5
    budget: {wall_clock_seconds: 1800, memory_gb: 2}
    stopping_rule: 'The K = 10^6 pass runs to completion (seconds). The l-1
      factorisation attempt is capped at 1500 s; on expiry the row keeps its
      bound and records WHY, which is an environment measurement and not a
      finding.'
    falsifier:
      - 't in {0,1}, or p = 1 mod l, or l = p, or l | 8, or any j <= 10^6 with
        p^j = 1 mod l -> MATERIAL FINDING. Pre-committed route: halt, do not
        publish, escalate to independent review-breakthrough scrutiny before any
        statement leaves the repository. This mirrors IDEA-20260807-98a970''s
        own pre-commitment and is not a new policy.'
      - 'Any planted positive not returned correctly -> instrument failure under
        AGENTS.md rule 3; the lane''s output is void and nothing is reported.'
    honest_limitation: >-
      k > 10^6 is a BOUND, not a value; writing it as "k is about l" overstates
      the certificate. And per null control Z5, a random integer pair would also
      pass this bound with probability 1 - 2^-213, so the bound is very nearly
      uninformative about this curve SPECIFICALLY. Its value is that it rules
      out the small-k regime, which is a real and consequential regime.

  - id: L7-DISC
    criterion: disc
    category: ecdlp_security_requirements
    priority: 5
    tracked_object: O3
    definition_source: 'this_plan for the measurable core; RFC 7748 R1-F10
      supplies a RETRIEVED threshold D > 2^100 that is NOT SafeCurves''.'
    depends_on: [L4-ORDER-RECONCILE, L6-TRANSFER]
    mechanism: >-
      Compute t exactly, then Delta = t^2 - 4p (negative, magnitude up to 4p ~
      2^257). Write Delta = v^2 D with D the fundamental discriminant. Certify a
      LOWER BOUND on |D| by exhibiting primes dividing Delta to ODD multiplicity:
      each such prime divides the squarefree part, so their product divides D and
      bounds |D| below. Trial-divide to 10^7, then Pollard rho and ECM to a
      declared bound; primality-certify any large cofactor claimed prime.
    quantitative_prediction:
      - metric: 'certified lower bound on |D|'
        direction: higher
        value: >-
          PREDICTED > 2^100, matching RFC 7748's own generation rule R1-F10.
          STRONGER PREDICTION: if Delta is squarefree with a large prime cofactor
          the certified bound exceeds 2^200. Minimum useful effect: certify
          |D| > 2^100 or report explicitly that the budget did not reach it.
      - metric: 'conductor v'
        direction: lower
        value: 'PREDICTED small (1 or 2). A large v would mean the curve sits
          deep in an isogeny volcano, which changes D3''s GLV conclusion.'
    certificate: >-
      The exact integers t and Delta; the full trial-division/ECM transcript with
      its declared bound; the list of primes with their exact multiplicities; and
      a primality certificate for any cofactor asserted prime. Verification of
      the LOWER BOUND is cheap: one division per claimed odd-multiplicity prime.
    controls:
      positive: 'P2 (BN(2,254) must return |D| = 3), P1 (Anomalous must return a
        small |D| - value measured, not assumed from intake), and a toy CM-method
        curve built with a chosen small D which must return exactly that D.'
      negative: 'A toy random curve at 40-60 bits; must return a large |D|.'
      'null': Z4
    budget: {wall_clock_seconds: 1500, memory_gb: 2}
    stopping_rule: 'Stop as soon as |D| > 2^100 is certified, or at 1200 s of
      factoring effort, whichever comes first; record which.'
    falsifier:
      - 'Certified |D| <= 2^100 -> contradicts R1-F10, meaning either the
        generation rule was not followed or our t is wrong. Halt and re-derive t
        from L4 before reporting anything.'
      - 'Delta not = 0 or 1 mod 4 -> arithmetic error; t is wrong.'
    honest_limitation: >-
      This method produces a LOWER bound on |D| and cannot produce an upper bound
      or the exact D without fully factoring Delta. And per null control Z4, if
      the bound is indistinguishable from that of a random 257-bit integer, the
      lane has measured bit length rather than curve structure and MUST report
      it that way. That is the outcome the plan expects and pre-registers.

# --------------------------- BEYOND-ECDLP REQUIREMENTS ----------------------
  - id: L8-RIGID
    criterion: rigid
    category: ecc_security_beyond_ecdlp
    priority: 6
    tracked_object: 'the generation transcript: the deterministic map from
      (p, target cofactors) to (A, base point)'
    definition_source: 'this_plan; the RULES re-executed are RETRIEVED from
      RFC 7748 Appendix A (R1-F11, R1-F12). SafeCurves `rigid` UNRETRIEVED.'
    also_satisfies_diagnostic: D8
    mechanism: >-
      Re-execute RFC 7748 Appendix A's stated generation rules and check the
      published parameters are their output. Two sub-checks of wildly different
      cost, kept separate.
      (a) CHEAP AND DECISIVE - BASE-POINT MINIMALITY. R1-F12: "the point with
      minimal, positive u value that is in the correct subgroup". For u = 1..8,
      decide by Legendre symbol whether u^3 + A u^2 + u is a square in F_p (i.e.
      u is on E), and if so whether the resulting point lies in the order-l
      subgroup (test [8]P != O). Then confirm u = 9 does.
      (b) EXPENSIVE - A-MINIMALITY. R1-F11: "the minimal, positive A value such
      that A > 2 and (A-2) is divisible by four and where the cofactors are as
      desired". The arithmetic half is checkable now: A > 2 and 4 | (A-2). The
      cofactor half requires a point count for each of the ~121663 candidates
      A in (2, 486662) with A = 2 mod 4.
    quantitative_prediction:
      - metric: 'number of u in {1,...,8} lying on E and in the correct subgroup'
        direction: lower
        value: >-
          PREDICTED 0. THE TWO OUTCOMES MEAN DIFFERENT THINGS: 0 confirms the
          published base point is the minimal one the rule specifies; any hit
          contradicts R1-F12 and means either the RFC's rule was not followed or
          our subgroup test is wrong - and the lane must then distinguish those
          two by re-running the subgroup test on a known-good point.
      - metric: '(A - 2) / 4'
        direction: different
        value: 'PREDICTED an exact integer. Its value is NOT asserted here - this
          planning session had no interpreter and a hand-computed integer
          reported as a measurement is exactly what AGENTS.md rule 5 forbids.
          The executor emits it.'
      - metric: 'number of candidate A values actually cofactor-tested'
        direction: different
        value: 'PREDICTED 0 under E2. Reported as a coverage number, not as a
          result.'
    certificate: '(a) the 9 Legendre symbols with Euler witnesses and the 9
      scalar-multiplication outcomes; (b) the integer (A-2)/4 and the
      divisibility witness.'
    controls:
      positive: 'A toy curve at small p where a u SMALLER than the published base
        point IS in the correct subgroup: the instrument must report the
        minimality claim FAILS. Without this control a lane that always returns
        "minimal" has no resolving power.'
      negative: 'M-221 or E-222 base points after independent sourcing, whose
        minimality claim should also hold.'
      'null': 'Replace the base point by a random correct-subgroup point; the
        minimality claim must FAIL with overwhelming probability. Over 100 random
        points, predicted failures 100/100.'
    budget: {wall_clock_seconds: 120, memory_gb: 1}
    stopping_rule: 'Sub-check (a) completes in milliseconds. Sub-check (b)
      cofactor half is NOT attempted.'
    falsifier: 'Some u < 9 lies on E in the correct subgroup -> contradicts
      R1-F12; halt.'
    honest_limitation: >-
      RIGIDITY IS A CLAIM ABOUT A PROCESS, NOT ABOUT A NUMBER. Reproducing the
      transcript shows the published parameters are CONSISTENT with the published
      rule. It cannot show the rule was not chosen after seeing its output, and
      no computation can. Say so plainly in any record citing this lane.
    deferred_component:
      what: 'A-minimality over the ~121663 smaller candidates.'
      concrete_reason: >-
        Requires curve-and-twist cofactors per candidate, i.e. ~121663
        point counts at 255 bits. No SEA backend is assumed (E2), and even with
        one this is a campaign in its own right, not a sub-check.
      successor_condition: >-
        A separately scoped handoff that (i) declares a point-counting backend
        (PARI/GP or Sage) in its inputs, and (ii) budgets the 121663 SEA runs or
        justifies a random subsample with a stated confidence statement. Until
        that record exists, the `rigid` criterion is covered ONLY by the
        base-point half and every citation must say which half it rests on.

  - id: L8b-LADDER
    criterion: ladder
    category: ecc_security_beyond_ecdlp
    priority: 4
    tracked_object: 'O4 and O5'
    definition_source: 'this_plan (SafeCurves `ladder` definition UNRETRIEVED)'
    depends_on: [L2-EQUATION]
    mechanism: >-
      Measurable core: (i) the curve is presentable in Montgomery form with B = 1
      and A^2 - 4 != 0, so the x-only differential ladder applies; (ii) the
      ladder constant a24 = (A - 2)/4 is an exact field element; (iii) enumerate
      the ladder's exceptional inputs, which are governed by the 2-torsion: the
      x-only differential addition degenerates when the difference point is the
      identity or has order 2. The number of F_p-points of order 2 is determined
      by how many roots u^3 + A u^2 + u has in F_p: u = 0 always, plus the roots
      of u^2 + A u + 1, which exist iff A^2 - 4 is a square mod p.
    quantitative_prediction:
      - metric: 'Legendre symbol of A^2 - 4 mod p'
        direction: different
        value: >-
          PREDICTED -1 (non-square). THE TWO OUTCOMES ARE DIFFERENT THEORIES OF
          THE CURVE: a non-square gives E(F_p)[2] = Z/2, exactly one point of
          order 2, a cyclic 2-Sylow consistent with cofactor 8, exactly one
          ladder-degenerate difference point besides the identity, and a
          3-bit small-subgroup confinement in D2. A square would give full
          2-torsion, E(F_p)[2] = Z/2 x Z/2, a non-cyclic 2-Sylow, three
          degenerate difference points, and a different D2 leakage count. One
          Legendre symbol decides between them.
      - metric: 'number of F_p-points of order exactly 2'
        direction: different
        value: 'PREDICTED exactly 1.'
      - metric: 'a24 = (A-2)/4 as a field element'
        direction: different
        value: 'PREDICTED an exact small integer. Value emitted by the executor,
          not asserted here.'
    certificate: 'The Legendre symbol with its Euler witness; the explicit list
      of order-2 u-coordinates; the exact a24; and the enumerated exceptional
      difference-point set.'
    controls:
      positive: >-
        A Montgomery curve at the SAME p with A^2 - 4 a square, constructed as
        A = w + w^{-1} mod p for random w (which makes A^2 - 4 = (w - w^{-1})^2 a
        square by construction). The instrument must report full 2-torsion and
        the enlarged exceptional set. This is a genuine SAME-p parameter-matched
        positive control and it does not need point counting.
      negative: N1
      'null': Z2
    budget: {wall_clock_seconds: 60, memory_gb: 1}
    stopping_rule: 'Single pass.'
    falsifier: 'A^2 - 4 is a square -> the cyclic-2-Sylow prediction is refuted
      and D2, D6, D7 must all be recomputed under full 2-torsion.'
    honest_limitation: >-
      "A ladder exists and its exceptional set is X" is not "the deployed
      implementation is constant-time and correct". Implementation behaviour is
      out of scope for this goal.

  - id: L9-TWIST
    criterion: twist
    category: ecc_security_beyond_ecdlp
    priority: 3
    tracked_object: 'O1 (via #E^t = 2p + 2 - #E) and the factorisation of #E^t'
    definition_source: 'this_plan (SafeCurves `twist` definition UNRETRIEVED)'
    depends_on: [L4-ORDER-RECONCILE]
    also_satisfies_diagnostic: 'D1 (twist half)'
    mechanism: >-
      For a quadratic twist over F_p, #E + #E^t = 2p + 2 exactly. Compute
      #E^t = 2p + 2 - 8l from L4's certified #E - COMPUTING the twist order
      rather than reading it, which removes the dependency on the unreadable
      source U10. Then factor #E^t, certify the primality of its large factor,
      and evaluate the twist's rho cost and embedding-degree bound by re-running
      L5 and L6 on (p, p_2).
    quantitative_prediction:
      - metric: '#E^t mod 4'
        direction: different
        value: 'PREDICTED 0, i.e. twist cofactor divisible by 4. Internal record
          KN-LIT-093 reports twist order 4*p_2 with p_2 prime; that is INTERNAL
          and is used here only as the prediction, never as the value.'
      - metric: 'primality of #E^t / 4'
        direction: different
        value: 'PREDICTED prime.'
      - metric: 'log2 of the twist rho cost'
        direction: higher
        value: >-
          PREDICTED ~126.33, and specifically HIGHER than the curve's own 125.83.
          Derivation: 2p + 2 = 2^256 - 36 and 8l = 2^255 + 8c with 8c ~ 2^127.4,
          so #E^t ~ 2^255 and p_2 ~ 2^253; sqrt(p_2) ~ 2^126.5 and
          log2(0.886) = -0.1746. Tolerance +/- 0.1. THIS IS A NON-OBVIOUS,
          FALSIFIABLE PREDICTION: the twist is predicted to be the HARDER of the
          two groups, not merely "also strong".
      - metric: 'smallest j <= 10^6 with p^j = 1 mod p_2'
        direction: lower
        value: 'PREDICTED none, certifying twist k > 10^6.'
    certificate: 'The exact integer #E^t; the identity check
      #E + #E^t = 2p + 2 (one addition to verify); the division-by-4 witness;
      the primality certificate for p_2 at its stated tier; and L5/L6
      certificates re-emitted for p_2.'
    controls:
      positive: 'A toy curve at 40 bits with a deliberately smooth twist, found
        by search; the lane must report the smooth factorisation and the reduced
        twist rho cost.'
      negative: N3
      'null': >-
        Replace #E^t by 10^3 random integers of the same bit length and ask how
        often n/4 is prime. For a random ~255-bit n divisible by 4, P(n/4 prime)
        ~ 1/ln(2^253) ~ 1/175. So observing "4 x prime" is a ~175:1 structural
        signal against the null - a quantified statement of how surprising the
        predicted factorisation is, which is what makes confirming it
        informative rather than decorative.
    budget: {wall_clock_seconds: 1200, memory_gb: 2}
    stopping_rule: 'Primality certification of p_2 capped at 900 s; report the
      tier reached.'
    falsifier:
      - '#E^t not divisible by 4 -> contradicts the internal expectation; report
        the measured cofactor.'
      - '#E^t / 4 composite with a factor below 2^200 -> the twist rho cost drops
        and must be recomputed against the smaller prime; a measured result, and
        one that would matter for x-only implementations.'
    honest_limitation: >-
      Twist security bears on x-only and implicit-validation implementations
      (KN-TECH-034 internal). Per that record's scope boundary, a twist result is
      an ADJACENT-MODEL result and is NOT an ECDLP result. The goal's own claim
      boundary says the same.

  - id: L10-COMPLETE
    criterion: complete
    category: ecc_security_beyond_ecdlp
    priority: 5
    tracked_object: O4
    definition_source: 'this_plan (SafeCurves `complete` definition UNRETRIEVED);
      the completeness statement quoted at R2-F6 is RETRIEVED but conditional.'
    blocked_on: 'OR-5 / the un-captured numeral d of edwards25519. The lane
      CANNOT run until d is re-fetched verbatim from RFC 7748 Section 4.1.'
    mechanism: >-
      The twisted Edwards addition law on a x^2 + y^2 = 1 + d x^2 y^2 is complete
      exactly when a is a square and d is a non-square in F_p. RFC 8032 gives
      a = -1 (R2-F2). So the criterion reduces to two Legendre symbols: is -1 a
      square mod p (equivalently p = 1 mod 4), and is d a non-square mod p.
      Combined with R2-F5's birational equivalence, this is what carries the
      `complete` criterion from edwards25519 back to Curve25519.
    quantitative_prediction:
      - metric: 'p mod 4'
        direction: different
        value: 'PREDICTED 1, hence -1 is a square mod p and a = -1 is a square.'
      - metric: 'Legendre symbol of d mod p'
        direction: different
        value: >-
          PREDICTED -1. THE TWO OUTCOMES: -1 means the Edwards law is complete on
          edwards25519 and D7 should find ZERO exceptional pairs; +1 would mean
          the law is NOT complete, that R2-F6's hypothesis fails for this d, and
          that D7 must EXHIBIT an actual exceptional pair. The lane pre-commits
          to exhibiting one in that case rather than merely reporting a symbol.
    certificate: 'Three Euler witnesses (for -1, for d, and for the composite
      statement), each verifiable by one modular exponentiation; plus, if d is a
      square, an explicit exceptional point pair (x1,y1),(x2,y2) with
      d x1 x2 y1 y2 = +/-1.'
    controls:
      positive: 'A twisted Edwards curve at the same p with d = w^2 for random w;
        the instrument must report NOT complete AND must produce a concrete
        exceptional pair. Producing the pair, not just the symbol, is what makes
        this control test the searcher rather than the arithmetic.'
      negative: N4
      'null': Z2
    budget: {wall_clock_seconds: 120, memory_gb: 1}
    stopping_rule: 'Single pass after d is obtained.'
    falsifier: 'd is a square mod p -> the completeness claim fails at
      edwards25519''s own parameter; halt and re-verify d against RFC 7748
      before reporting, since a transcription error is far likelier than the
      finding.'
    honest_limitation: >-
      Completeness of a FORMULA is not completeness of an IMPLEMENTATION, and the
      lane is currently BLOCKED on retrieving d. A blocked lane is recorded as
      blocked, not as passed.

  - id: L11-IND
    criterion: ind
    category: ecc_security_beyond_ecdlp
    priority: 7
    tracked_object: 'the image of the point-encoding map and its distance from
      uniform'
    definition_source: >-
      this_plan ENTIRELY. SafeCurves' `ind` criterion text is UNRETRIEVED and, as
      far as this session can establish from what it DID retrieve, is not defined
      in RFC 7748 or RFC 8032 either. Everything in this lane is our definition
      and is labelled as such. This is the weakest-defined lane in the plan.
    mechanism: >-
      (i) ALGEBRAIC PRECONDITION: the Elligator 2 map applies to Montgomery
      curves y^2 = x^3 + A x^2 + B x over F_p with A B (A^2 - 4B) != 0 and p odd.
      Check exactly, using L2's residues. (ii) STATISTICAL MEASUREMENT: sample
      10^6 uniform field elements, map to points, and test the encoded strings
      for bias by a 256-bin chi-square on the leading byte.
    quantitative_prediction:
      - metric: 'A B (A^2 - 4B) mod p'
        direction: different
        value: 'PREDICTED nonzero (A = 486662 != 0, B = 1, A^2 - 4 != 0 from L2),
          so the precondition holds.'
      - metric: 'chi-square p-value on 10^6 encoded samples, 255 d.f.'
        direction: different
        value: >-
          PREDICTED uniform on [0,1]; no rejection at alpha = 0.001. STATED
          POWER LIMIT: at n = 10^6 across 256 bins the per-bin expected count is
          ~3906, whose Poisson sd is ~62.5, so the test resolves per-bin
          relative deviations of about 3 x 62.5/3906 ~ 4.8 x 10^-2, i.e.
          absolute probability biases of order 10^-4 to 10^-3. IT CANNOT CERTIFY
          INDISTINGUISHABILITY and it cannot see a 2^-100 bias. A non-rejection
          is a FAILURE TO REFUTE, and the record must use that phrase.
    certificate: 'The exact residue A B (A^2-4B) mod p with its inverse witness;
      the chi-square bin counts, statistic, degrees of freedom, and p-value; the
      RNG seed and the full sampling parameters for exact reproduction.'
    controls:
      positive: 'An encoder with a deliberately injected bias (e.g. resample
        whenever the top bit is 1). The chi-square MUST reject it at 10^6
        samples. This calibrates the test''s power; without it, "did not reject"
        is uninterpretable.'
      negative: 'A uniform byte source; must not reject.'
      'null': Z7
    budget: {wall_clock_seconds: 600, memory_gb: 2}
    stopping_rule: '10^6 samples or 480 s, whichever first; report n actually
      drawn.'
    falsifier: 'Chi-square rejects at alpha = 0.001 on the real encoder while the
      negative control does not reject -> a measurable bias; report the effect
      size, and do not describe it as a break of anything.'
    honest_limitation: >-
      A statistical non-rejection never certifies indistinguishability. The
      criterion definition is ours, not SafeCurves'. Priority is deliberately
      lowest of the eleven because the lane cannot produce a certificate in the
      sense of docs/claims-and-verification.md - only a bounded statistical
      observation.

# ---------------------------------------------------------------------------
# ADDITIONAL DIAGNOSTICS (all eight declared by the goal)
# ---------------------------------------------------------------------------
additional_diagnostics:
  - id: D1
    declared_as: 'complete curve and twist order factorization with checkable
      certificates'
    coverage: 'FULLY COVERED by L4-ORDER-RECONCILE (curve side: #E = 8l via the
      Hasse-uniqueness certificate plus the primality certificate for l) and
      L9-TWIST (twist side: #E^t = 2p+2-#E, division by 4, primality certificate
      for p_2). No separate lane needed.'
    residual_risk: 'The word "complete" in the diagnostic means the FULL
      factorisation. #E = 8l is complete only if l is certified prime; #E^t = 4
      p_2 only if p_2 is. If either primality certificate stops at the BPSW
      tier, the factorisation is complete only up to that tier and must say so.'

  - id: D2
    declared_as: 'subgroup, cofactor, and invalid-curve confinement costs'
    coverage: 'NEW SUB-LANE.'
    tracked_object: O5
    depends_on: [L8b-LADDER, L4-ORDER-RECONCILE, L9-TWIST]
    mechanism: >-
      Enumerate explicitly the u-coordinates of E(F_p) points of order dividing 8
      and of E^t(F_p) points of order dividing 4. Determine the 2-Sylow structure
      from L8b's Legendre symbol. Then state, in the chosen-input oracle model of
      KN-TECH-034, the information leaked per query: log2 of the largest
      small-order subgroup an attacker can confine into.
    quantitative_prediction:
      - metric: 'group structure of E(F_p)'
        direction: different
        value: 'PREDICTED Z/8 x Z/l (cyclic 2-Sylow), conditional on L8b
          returning A^2-4 a non-square. Falsifier: more than one point of order
          2.'
      - metric: 'bits leaked per small-subgroup query on the curve'
        direction: different
        value: 'PREDICTED exactly 3 (cofactor 8). On the twist, PREDICTED exactly
          2 (cofactor 4, conditional on L9).'
      - metric: 'number of distinct u-coordinates of order dividing 8'
        direction: different
        value: 'PREDICTED exactly 4 distinct u-values covering the 8 points
          (since u determines a point up to sign), conditional on cyclic 2-Sylow.'
    certificate: 'The explicit table of small-order u-coordinates with their
      orders, each verified by a scalar multiplication.'
    controls:
      positive: 'A toy curve with 2-Sylow of order 32; must report 5 bits.'
      negative: 'A toy prime-order curve (cofactor 1); must report 0 bits.'
      'null': 'The same enumeration on a random curve''s twist at toy size.'
    budget: {wall_clock_seconds: 300, memory_gb: 1}
    stopping_rule: 'Exhaustive over a set of size <= 12; no stopping rule needed.'
    falsifier: 'The enumerated small-order points do not number what the cofactor
      predicts -> the group-structure model is wrong.'
    honest_limitation: >-
      BINDING SCOPE STATEMENT, from KN-TECH-034: small-subgroup and
      invalid-curve confinement require an oracle, chosen inputs, and a static
      reused secret. They are ADJACENT-MODEL results. Nothing in D2 is an ECDLP
      result and no record may cite it as one. Also: only public parameters and
      generated points are used; no live key is involved at any point.

  - id: D3
    declared_as: 'automorphism- and endomorphism-adjusted rho cost'
    coverage: 'NEW SUB-LANE, consuming L2 (j) and L7 (|D| bound).'
    tracked_object: 'O1 and O3 jointly'
    mechanism: >-
      |Aut(E)| = 2 unless j = 0 (|Aut| = 6) or j = 1728 (|Aut| = 4), giving a rho
      speedup of sqrt(|Aut|). Separately, a GLV-style efficiently computable
      endomorphism of small norm exists only when the CM discriminant is small;
      L7's certified lower bound on |D| bounds that route out quantitatively.
    quantitative_prediction:
      - metric: 'rho speedup factor from automorphisms'
        direction: different
        value: >-
          PREDICTED exactly sqrt(2) = 1.414 (negation map only). THREE
          DISTINGUISHABLE OUTCOMES: sqrt(2) if j not in {0,1728}; 2 if j = 1728;
          sqrt(6) = 2.449 if j = 0. The lane discriminates among them by one
          j-invariant computation, and the outcome changes the reported rho
          exponent by up to log2(sqrt(6)/sqrt(2)) = 0.79 bits.
      - metric: 'smallest norm of a nontrivial endomorphism usable for GLV'
        direction: higher
        value: 'PREDICTED > 2^50, as a consequence of L7 certifying |D| > 2^100.
          If L7 fails to certify that bound, D3 must report NO endomorphism
          conclusion rather than assuming one.'
      - metric: 'net measured negation-map speedup at 40 bits'
        direction: different
        value: 'PREDICTED 1.41 +/- 0.23 (H3). A measured value near 1.0 would
          mean fruitless-cycle handling consumes the gain, which is a real and
          reportable cost-model result.'
    certificate: 'j mod p exactly; the |D| lower bound from L7; the measured
      speedup with its confidence interval.'
    controls:
      positive: 'Constructed j = 0 and j = 1728 curves at the same p; the
        detector must return |Aut| = 6 and 4.'
      negative: 'The 40-bit generic control curve from L5.'
      'null': 'DEGENERATE for j-detection (see degenerate_null_disclosure);
        the lane rests on its constructed positives.'
    budget: {wall_clock_seconds: 300, memory_gb: 1}
    stopping_rule: 'Reuses L5''s completed trials; no new sampling.'
    falsifier: 'j in {0, 1728} -> the sqrt(2) adjustment is wrong and L5''s
      figure must be restated.'
    honest_limitation: 'The sqrt(2) is not free: fruitless cycles cost real work,
      which is why the prediction is validated empirically rather than asserted.'

  - id: D4
    declared_as: 'embedding-degree certificate or explicit search bound'
    coverage: >-
      FULLY COVERED by the multiplicative half of L6-TRANSFER, which REUSES
      IDEA-20260807-98a970 rather than duplicating it, applied to (p, l) and -
      via L9 - to (p, p_2). The three degenerate checks, the two certificate
      formats, the representability wall, and the planted small-k positives are
      that proposal's, specialised to this curve.
    residual_risk: 'IDEA-20260807-98a970 notes its verdict column depends on the
      crossover k* from IDEA-20260807-5f24d7. This plan emits NO verdict, only
      k or its bound, so that dependency is not inherited. Any later record that
      converts the bound into a verdict inherits it and must say so.'

  - id: D5
    declared_as: 'CM discriminant and conductor structure'
    coverage: 'COVERED by L7-DISC for D, plus this increment for the conductor.'
    increment: >-
      Report v alongside D. Since Delta = v^2 D, every square factor found in
      L7's transcript contributes to v; emit the certified square part and the
      resulting bound on v. Note the asymmetry recorded in tracked object O3: D
      is an isogeny-class invariant, v is not, so v is reported as a property of
      THIS curve and never of its class.
    quantitative_prediction:
      - metric: 'certified square part of Delta'
        direction: lower
        value: 'PREDICTED 1 or 4, i.e. v in {1, 2}. A large v would place the
          curve deep in an isogeny volcano and would change D3''s endomorphism
          conclusion.'
    controls: 'Shares L7''s positive, negative and Z4 null.'
    budget: 'Shares L7''s budget; no additional compute.'
    falsifier: 'A large certified square factor -> v is large; D3 must be redone.'
    honest_limitation: 'A lower bound on |D| gives an UPPER bound on v only if
      Delta is fully factored, which is not predicted to happen. So v is reported
      as a bound, not a value.'

  - id: D6
    declared_as: 'model-conversion exceptional sets'
    coverage: 'NEW SUB-LANE.'
    tracked_object: O4
    depends_on: [L8b-LADDER, L10-COMPLETE]
    mechanism: >-
      Enumerate the exceptional points of each birational map in the deployed
      chain: Montgomery <-> twisted Edwards <-> short Weierstrass. The
      Montgomery-to-Edwards map has the shape x = c*u/v, y = (u-1)/(u+1) for a
      constant c, so it is undefined exactly where v = 0 (the 2-torsion) or
      u = -1. Decide whether u = -1 is on the curve by one Legendre symbol on
      (-1)^3 + A(-1)^2 + (-1) = A - 2. Apply the propagation rule from O4: the
      exceptional set of a composite is contained in the union of preimages of
      the components' exceptional sets.
    quantitative_prediction:
      - metric: 'size of the exceptional set of the Montgomery-to-Edwards map
          over F_p'
        direction: different
        value: >-
          PREDICTED (number of order-2 points, predicted 1 by L8b) + (2 if A - 2
          is a square mod p, else 0). The Legendre symbol of A - 2 = 486660
          therefore decides between a set of size 1 and a set of size 3, and the
          executor emits which. Both outcomes are meaningful: size 3 means two
          additional inputs on which a naive model conversion silently fails.
      - metric: 'number of points where the inverse map is undefined'
        direction: different
        value: 'PREDICTED equal to the number of Edwards points with y = -1
          plus those with x = 0, enumerated exactly.'
    certificate: 'The explicit point list with the Legendre symbols and the map
      denominators evaluated at each.'
    controls:
      positive: 'A model conversion with a known larger exceptional set (e.g. a
        Montgomery curve with full 2-torsion, the L8b positive control); the
        enumerator must find all of them.'
      negative: 'A conversion between two Edwards models, whose exceptional set
        is predicted empty.'
      'null': '10^4 random curve points fed to the converter; predicted fraction
        landing in the exceptional set ~ 3/#E ~ 2^-253, i.e. zero observed. A
        nonzero count indicates a bug, not a discovery.'
    budget: {wall_clock_seconds: 200, memory_gb: 1}
    stopping_rule: 'Exhaustive over a set of size <= 6.'
    falsifier: 'The enumerated set does not match the count predicted from the
      2-torsion structure -> the propagation rule for O4 is misapplied.'
    honest_limitation: 'An exceptional set is an implementation-correctness
      hazard, not an ECDLP weakness.'

  - id: D7
    declared_as: 'scalar and multiscalar formula exceptional-case search'
    coverage: 'NEW SUB-LANE.'
    tracked_object: O4
    depends_on: [L10-COMPLETE, D6]
    mechanism: >-
      For each formula in the deployed set - the Montgomery ladder's differential
      double-and-add, the twisted Edwards unified addition, Edwards doubling, and
      a two-dimensional Straus-Shamir multiscalar combination - write the
      denominators symbolically, factor them, and solve for vanishing over F_p.
      Then (i) search EXHAUSTIVELY over the small-order set from D2 and its
      pairwise combinations (at most ~144 pairs) and (ii) sample 10^6 random
      pairs.
    quantitative_prediction:
      - metric: 'exceptional pairs found for the twisted Edwards unified addition'
        direction: lower
        value: >-
          PREDICTED EXACTLY 0, CONDITIONAL on L10 certifying a square and d
          non-square. If L10 instead finds d a square, this prediction inverts to
          "at least one, and the searcher must exhibit it". The two outcomes are
          the two theories and the lane is built to tell them apart.
      - metric: 'exceptional inputs found for the Montgomery ladder'
        direction: different
        value: 'PREDICTED NONZERO and equal to the count from D6 (difference
          point = identity or order 2). A ladder lane reporting zero exceptions
          would contradict D6 and indicate the searcher is blind.'
      - metric: 'exceptional pairs found on the P4 incomplete-Weierstrass control'
        direction: higher
        value: 'PREDICTED > 0, specifically P + P and P + (-P). MUST be found.'
    certificate: 'The symbolic denominators with their factorisations; the exact
      solution sets; the exhaustive small-order table; and the RNG seed for the
      10^6 random pairs.'
    controls:
      positive: 'P4 - BLOCKING. If the searcher cannot find the known exceptions
        of the affine Weierstrass law, every "zero exceptions" result in D7 and
        L10 is void and nothing is reported.'
      negative: 'The Edwards law on a curve with d a non-square other than
        edwards25519''s.'
      'null': '10^6 random pairs on a complete-law curve; predicted zero hits.'
    budget: {wall_clock_seconds: 900, memory_gb: 2}
    stopping_rule: '10^6 random pairs or 600 s, whichever first, after the
      exhaustive small-order pass completes.'
    falsifier: 'Any exceptional pair found for the Edwards unified addition when
      L10 predicted completeness -> either L10''s Legendre symbol or the formula
      transcription is wrong; halt and reconcile before reporting.'
    honest_limitation: >-
      Symbolic exception analysis covers the formulas AS WRITTEN, not as compiled
      or as deployed. And a random sample of 10^6 pairs out of ~2^253 sees a
      vanishing fraction of the space: it can only find exceptions that occupy a
      positive-density subvariety, which is precisely why the EXHAUSTIVE
      small-order pass carries the weight and the random pass is secondary.

  - id: D8
    declared_as: 'deterministic parameter-generation transcript audit'
    coverage: 'COVERED by L8-RIGID sub-check (a) - fully, cheaply and decisively
      for the base point. PARTIALLY DEFERRED for A-minimality.'
    deferred_component: 'See L8-RIGID.deferred_component for the concrete reason
      (~121663 point counts, no SEA backend under E2) and the successor
