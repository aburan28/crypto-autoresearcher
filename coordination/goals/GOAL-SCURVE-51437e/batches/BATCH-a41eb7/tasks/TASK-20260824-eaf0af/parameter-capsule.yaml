# ---------------------------------------------------------------------------
# LAYER 1 - USER-SUPPLIED INTAKE. NOT EVIDENCE.
# ---------------------------------------------------------------------------
intake_layer:
  provenance: user_supplied_unverified
  verification_status: unverified
  comparison_target_only: true
  evidentiary_weight: none
  binding_rule: >-
    Every field in this layer, including every True/False criterion cell, is a
    preregistered comparison target supplied by the user. It may be compared
    against, agreed with, or contradicted by later certified measurement. It may
    never be cited as evidence, and its agreement with a measurement is not
    corroboration of the measurement.
  source_records:
    - ledger/goals/GOAL-SCURVE-51437e/goal.yaml (intake block)
    - ledger/questions/RQ-SCURVE-d9b7d2.yaml (intake block)
    - coordination/bootstrap/safecurves/TASK-20260824-41038d/manifest.yaml
      (rows[curve=Curve25519].expected_safecurves)
  values:
    curve: Curve25519
    equation: y^2 = x^3+486662x^2+x
    modulus: 2^255 - 19
    details: 2006 Bernstein
    expected_safe: true
  expected_criteria:
    field: true
    equation: true
    base: true
    rho: true
    transfer: true
    disc: true
    rigid: true
    ladder: true
    twist: true
    complete: true
    ind: true
  coverage_gap_note: >-
    The intake tuple names only (curve, equation, modulus, details). It supplies
    NO base point, NO subgroup order, NO cofactor, NO twist order and NO
    numeric thresholds for any of the eleven criteria. Those quantities enter
    this capsule only from Layer 2, or remain open. Absence of a field from
    intake is not agreement and is not disagreement.

# ---------------------------------------------------------------------------
# LAYER 2 - SOURCES RETRIEVED AND READ IN THIS SESSION.
# ---------------------------------------------------------------------------
retrieved_layer:
  retrieval_method: WebFetch through the session egress proxy; text extracted by
    the fetch tool. No local PDF renderer and no shell were available to this
    session, which bounds what could be read (see unretrieved_layer).
  sources:
    - ref: R1
      citation: 'RFC 7748, "Elliptic Curves for Security", Langley, Hamburg,
        Turner, IRTF CFRG, January 2016'
      url_retrieved:
        - https://www.rfc-editor.org/rfc/rfc7748.txt
        - https://www.rfc-editor.org/rfc/rfc7748.html
      provenance: retrieved
      retrieval_status: success
      read_depth: 'Section 4.1 parameter listing; Appendix A (Deterministic
        Generation); Section 7 (Security Considerations). Other sections not
        read.'
      authority_class: >-
        Primary specification of the Curve25519/X25519 parameter set as
        standardised by the IETF/IRTF CFRG. Authoritative for the tuple; NOT the
        SafeCurves criteria document and NOT the curve's originating paper.
      quoted_facts:
        - id: R1-F1
          field: prime_modulus
          quotation: 'p  2^255 - 19'
          location: Section 4.1
        - id: R1-F2
          field: montgomery_coefficient_A
          quotation: 'A  486662'
          location: Section 4.1
        - id: R1-F3
          field: curve_form
          quotation: 'Montgomery curve of the form v^2 = u^3 + A*u^2 + u'
          location: Section 4.1 (form statement)
          note: >-
            Stated by the fetch extraction as a description of the curve form
            rather than as a single quoted line. Treated as a paraphrase-grade
            reading of R1 and re-quotation verbatim is an open item (see
            open_reconciliations OR-5).
        - id: R1-F4
          field: base_point_order
          quotation: 'order  2^252 + 0x14def9dea2f79cd65812631a5cf5d3ed'
          location: Section 4.1
        - id: R1-F5
          field: cofactor
          quotation: 'cofactor  8'
          location: Section 4.1
        - id: R1-F6
          field: base_point_u
          quotation: 'U(P)  9'
          location: Section 4.1
        - id: R1-F7
          field: base_point_v
          quotation: 'V(P)  14781619447589544791020593568409986887264606134616475288964881837755586237401'
          location: Section 4.1
        - id: R1-F8
          field: generation_rule_trace
          quotation: 'The trace of Frobenius MUST NOT be in {0, 1}'
          location: Appendix A
        - id: R1-F9
          field: generation_rule_mov_degree
          quotation: 'MOV Degree: the embedding degree MUST be greater than
            (order - 1) / 100'
          location: Appendix A
        - id: R1-F10
          field: generation_rule_cm_discriminant
          quotation: 'CM Discriminant: discriminant D MUST be greater than 2^100'
          location: Appendix A
        - id: R1-F11
          field: generation_rule_A_selection_p_1_mod_4
          quotation: 'To generate the Montgomery curve, we find the minimal,
            positive A value such that A > 2 and (A-2) is divisible by four and
            where the cofactors are as desired.'
          location: Appendix A (p = 1 mod 4 branch)
        - id: R1-F12
          field: generation_rule_base_point
          quotation: 'The base point for a curve is the point with minimal,
            positive u value that is in the correct subgroup.'
          location: Appendix A
        - id: R1-F13
          field: cofactor_security_note
          quotation: 'Since curve25519 and curve448 have cofactors of 8 and 4
            (respectively), an input point of small order will eliminate any
            contribution from the other party''s private key. This situation can
            be detected by checking for the all-zero output.'
          location: Section 7
          misreading_warning: >-
            "8 and 4 (respectively)" pairs curve25519 with 8 and curve448 with
            4. It is NOT a statement that the Curve25519 TWIST has cofactor 4.
            Any later record that reads it that way is in error.
      explicitly_absent_from_source:
        - 'Twist group order and twist cofactor for Curve25519: the fetched text
          contains no such statement.'
        - 'The edwards25519 parameter d: present in RFC 7748 Section 4.1 but not
          captured verbatim by this session''s extraction. Recorded as
          not-captured, not as absent.'
        - 'Any factorisation of the subgroup order or of the twist order.'
        - 'Any SafeCurves criterion name, threshold, or True/False cell.'

    - ref: R2
      citation: 'RFC 8032, "Edwards-Curve Digital Signature Algorithm (EdDSA)",
        Josefsson, Liusvaara, IRTF CFRG, January 2017'
      url_retrieved:
        - https://www.rfc-editor.org/rfc/rfc8032.txt
      provenance: retrieved
      retrieval_status: success
      read_depth: 'Section 5.1 parameter listing and the surrounding statements
        on birational equivalence and addition-law completeness. Other sections
        not read.'
      authority_class: >-
        Primary specification of edwards25519. Relevant here only because the
        `complete`, `ladder` and model-conversion lanes turn on the relation
        between the Montgomery model and the twisted-Edwards model.
      quoted_facts:
        - id: R2-F1
          field: prime_modulus
          quotation: 'p of edwards25519 in [RFC7748] (i.e., 2^255 - 19)'
          location: Section 5.1
        - id: R2-F2
          field: edwards_coefficients
          quotation: 'a = -1'
          location: Section 5.1
          note: 'The companion value is given only as "d of edwards25519 in
            [RFC7748]"; the numeral was not captured (see R1
            explicitly_absent_from_source).'
        - id: R2-F3
          field: group_order_L
          quotation: 'L = 2^252+27742317777372353535851937790883648493'
          location: Section 5.1
        - id: R2-F4
          field: log2_cofactor
          quotation: 'c = 3'
          location: Section 5.1
          note: 'c is the base-2 logarithm of the cofactor, so this states
            cofactor 8 for edwards25519.'
        - id: R2-F5
          field: birational_equivalence
          quotation: 'The curve used is equivalent to Curve25519 [CURVE25519],
            under a change of coordinates, which means that the difficulty of
            the discrete logarithm problem is the same as for Curve25519.'
          location: Section 5.1
        - id: R2-F6
          field: addition_law_completeness
          quotation: 'they are "complete"; they are valid for all points on the
            curve, with no exceptions.'
          location: Section 5.1 (general Edwards addition formulas)
          scope_warning: >-
            This is the source's statement about the Edwards addition law under
            its stated hypotheses. It is not, by itself, a certificate that the
            hypothesis (d a non-square mod p) holds for edwards25519's specific
            d. That check is lane L10-COMPLETE and is currently OPEN.

