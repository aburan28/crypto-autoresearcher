internal_layer:
  binding_rule: >-
    Internal records are this program's own prior work. They may be relied on as
    prior art and as design input. They are NOT a substitute for a primary
    source, and a value appearing only here is carried as internal-only.
  entries:
    - ref: KN-LIT-093
      path: knowledge/literature/KN-LIT-093.md
      provenance: internal
      relied_on_for: >-
        Prior session's reading of the Curve25519 paper, recording that the
        curve group order is 8 * p_1 and the twist group order is 4 * p_2 with
        both prime and p_1 near 2^252, and that the paper's security level is
        the author's conjecture rather than a proven bound.
      status_here: >-
        Used to SHAPE the twist and factorisation lanes' predictions. NOT used
        as a source for the twist order value, which remains uncertified.
    - ref: KN-TECH-034
      path: knowledge/techniques/KN-TECH-034.md
      provenance: internal
      relied_on_for: >-
        The four validation checks (on-curve, correct subgroup, twist strength,
        cofactor recorded) and the scope boundary that invalid-curve and
        small-subgroup attacks live in a chosen-input/fault model and are not
        plain-ECDLP results.
    - ref: IDEA-20260807-98a970
      path: ledger/proposals/IDEA-20260807-98a970.yaml
      provenance: internal
      relied_on_for: >-
        The embedding-degree lane, its two certificate formats (exact-k via the
        factorisation of N-1 with per-prime witnesses; lower bound k > K via K
        modular multiplications), the three degenerate checks (p = 1 mod N,
        N = p, N^2 | #E), the representability wall k*ceil(log2 p) bits, and its
        mandatory planted positives. REUSED AND SPECIALISED. Not duplicated.
    - ref: KN-OPEN-019
      path: knowledge/open-problems/KN-OPEN-019.md
      provenance: internal
      relied_on_for: >-
        The standing fact that this program has no written object-enumeration
        for the ECDLP, so the tracked-object framing used in the audit plan is a
        sketch and not a taxonomy.
  corpus_novelty_screen:
    method: >-
      grep over knowledge/ and ledger/proposals/ for "Curve25519", "SafeCurves",
      "twist-secur", "Elligator", "Montgomery ladder", and for the two literal
      order values "27742317777372353535851937790883648493" and
      "14def9dea2f79cd65812631a5cf5d3ed", run 2026-08-25.
    result: >-
      Sixteen knowledge files and five proposals mention Curve25519 or adjacent
      terms. NEITHER order literal occurs anywhere in the repository. The corpus
      therefore holds no subgroup order, no twist order and no factorisation for
      this curve, which is consistent with IDEA-20260807-98a970's own screen and
      confirms that the reconciled tuple below is new data for this program.
    novelty_status: known
    novelty_rationale: >-
      As mathematics this capsule is KNOWN: it transcribes a standardised
      parameter set from its published specification. Its value is provenance
      and certifiability inside this ledger, not discovery. Recorded as `known`
      rather than `unverified` because the corpus screen and the two primary
      specifications were both actually run/read in this session; the SafeCurves
      criterion definitions, which were not, are carried as open dependencies
      and no novelty claim rests on them.

# ---------------------------------------------------------------------------
# RECONCILED TUPLE
# ---------------------------------------------------------------------------
reconciled_tuple:
  reconciliation_rule: >-
    A row is `agreement` only when intake and a retrieved primary source state
    the same value up to a disclosed notational difference. A row whose value
    exists in only one layer is `single_source`, never `agreement`. A row whose
    value is derived by arithmetic is `open` until a later approved task emits
    the certificate named in `certifying_lane`.
  rows:
    - field: field_type
      intake: 'prime field, modulus 2^255 - 19'
      retrieved: 'p = 2^255 - 19 (R1-F1; corroborated by R2-F1)'
      status: agreement
      residual: 'Primality of p is asserted by neither layer as a certificate.'
      certifying_lane: L1-FIELD
    - field: curve_model_and_coefficient
      intake: 'y^2 = x^3 + 486662x^2 + x'
      retrieved: 'Montgomery form v^2 = u^3 + A*u^2 + u with A = 486662
        (R1-F2, R1-F3)'
      status: agreement
      residual: >-
        Notational only: intake writes (x, y), the specification writes (u, v).
        Intake omits the coefficient B, which the Montgomery form fixes to 1 in
        both readings; that B = 1 is intended rather than merely omitted is
        asserted here as a READING of R1-F3 and is re-derived in lane L2.
      certifying_lane: L2-EQUATION
    - field: base_point
      intake: 'absent'
      retrieved: 'U(P) = 9, V(P) = 147816194475895447910205935684099868872646061
        34616475288964881837755586237401 (R1-F6, R1-F7)'
      status: single_source
      residual: 'Neither on-curve membership nor order of the base point is
        certified by the source text.'
      certifying_lane: L3-BASE
    - field: subgroup_order
      intake: 'absent'
      retrieved: 'R1-F4 states 2^252 + 0x14def9dea2f79cd65812631a5cf5d3ed;
        R2-F3 states L = 2^252 + 27742317777372353535851937790883648493'
      status: open
      residual: >-
        TWO AUTHORITATIVE SOURCES STATE THE ORDER IN DIFFERENT BASES AND NEITHER
        ASSERTS THEIR EQUALITY. This session had no arithmetic tool and does not
        assert it either. Their equality is a hypothesis, listed as OR-1 below.
        Note also that R2's L is edwards25519's order and R1's is curve25519's;
        equality of the two integers would be a consequence of the birational
        equivalence R2-F5, not an independent restatement.
      certifying_lane: L4-ORDER-RECONCILE
    - field: cofactor
      intake: 'absent'
      retrieved: 'cofactor 8 (R1-F5); c = 3 i.e. cofactor 8 for edwards25519
        (R2-F4); "cofactors of 8 and 4 (respectively)" for curve25519 and
        curve448 (R1-F13)'
      status: single_source
      residual: 'Consistent across the two specifications. Not certified against
        the curve: no source computes #E.'
      certifying_lane: L4-ORDER-RECONCILE
    - field: curve_group_order
      intake: 'absent'
      retrieved: 'absent - no retrieved source states #E'
      status: open
      residual: >-
        #E = 8 * l is the obvious consequence of R1-F4 and R1-F5, but it is a
        derivation, not a quotation, and it is not performed here.
      certifying_lane: L4-ORDER-RECONCILE
    - field: twist_group_order
      intake: 'absent'
      retrieved: 'absent - explicitly absent from R1 and R2'
      status: open
      residual: >-
        The only located source expected to state it is U10, whose content was
        not read. KN-LIT-093 (internal) records 4 * p_2 with p_2 prime; that is
        internal, unconfirmed here, and is used only as the lane's prediction.
      certifying_lane: L9-TWIST
    - field: edwards_model_coefficient_d
      intake: 'absent'
      retrieved: 'named but not captured verbatim (R2-F2 refers to "d of
        edwards25519 in [RFC7748]")'
      status: open
      residual: 'The numeral must be re-fetched verbatim from RFC 7748 Section
        4.1 before any lane that depends on d is run.'
      certifying_lane: L10-COMPLETE
    - field: trace_of_frobenius
      intake: 'absent'
      retrieved: 'absent as a value; R1-F8 supplies only the generation RULE
        that it must not lie in {0, 1}'
      status: open
      certifying_lane: L5-RHO / L6-TRANSFER / D5-CM
    - field: cm_discriminant
      intake: 'absent'
      retrieved: 'absent as a value; R1-F10 supplies only the generation RULE
        D > 2^100'
      status: open
      certifying_lane: L7-DISC / D5-CM
    - field: embedding_degree
      intake: 'absent'
      retrieved: 'absent as a value; R1-F9 supplies only the generation RULE
        that it exceed (order - 1)/100'
      status: open
      certifying_lane: L6-TRANSFER / D4-EMBED

# ---------------------------------------------------------------------------
# UNRESOLVED ITEMS
# ---------------------------------------------------------------------------
unresolved_conflicts:
  direct_contradictions_found: 0
  statement: >-
    No retrieved source contradicts the intake tuple on any field the intake
    tuple actually states. The goal's pause condition "primary or authoritative
    sources leave an unresolved conflict in the named curve's parameter tuple"
    is NOT triggered by a contradiction. It is not thereby satisfied either: the
    items below are unresolved for lack of retrieval and lack of computation,
    which is a different failure and is recorded as such.

open_reconciliations:
  - id: OR-1
    item: 'Base-mismatch between R1-F4 and R2-F3 for the subgroup order.'
    why_open: >-
      One source gives a hexadecimal tail, the other a decimal integer. This
      session had no arithmetic capability - no shell, no interpreter - and
      converting a 125-bit literal by hand and reporting the result as agreement
      would be exactly the fabricated-statistic failure AGENTS.md rule 5
      forbids. The conversion is trivial for any successor with an interpreter.
    resolution_route: 'Lane L4-ORDER-RECONCILE, exact integer comparison, cost
      microseconds.'
    consequence_if_unequal: >-
      A genuine conflict between two IETF specifications, which would trigger
      the goal's pause condition and would block every downstream lane that uses
      l. Predicted equal; the prediction is recorded so that confirming it is a
      controlled result rather than a retrofit.
  - id: OR-2
    item: 'SafeCurves criterion definitions and numeric thresholds for all
      eleven criteria.'
    why_open: 'U1-U8: host unreachable from this session (HTTP 502), archive
      refused by the tool.'
    resolution_route: 'Successor retrieval task with cr.yp.to egress or a
      declared offline copy.'
    consequence: >-
      BLOCKING for adjudication only. Every lane can still measure its quantity
      and emit its certificate; what cannot be done is compare the measured
      quantity against SafeCurves' own threshold and thereby adjudicate an
      intake cell. The audit plan is written so that measurement and
      adjudication are separable and the second is explicitly deferred.
  - id: OR-3
    item: 'Twist group order and its factorisation.'
    why_open: 'Absent from both retrieved specifications; the source expected to
      carry it (U10) was fetched but unreadable.'
    resolution_route: 'Lane L9-TWIST computes it from #E via #E + #E^t = 2p + 2
      rather than reading it, which removes the dependency on U10 for the value
      while leaving U10 needed to corroborate the published one.'
  - id: OR-4
    item: 'NIST SP 800-186 as an independent second authoritative statement of
      the tuple.'
    why_open: 'U9: bytes received, no text extractor available.'
    resolution_route: 'Successor session with poppler/pdftotext, or the HTML
      rendering if one exists.'
    consequence: >-
      The tuple currently rests on the IETF documents alone. That is one
      standards body, not two. Cross-body corroboration is a stated gap.
  - id: OR-5
    item: 'The Montgomery-form statement R1-F3 was returned as a description
      rather than as a verbatim line.'
    why_open: 'Extraction-shape artefact of the fetch tool.'
    resolution_route: 'Re-fetch RFC 7748 Section 4.1 and quote the form line
      verbatim before the capsule is cited by an evidence record.'

prohibited_uses:
  - This capsule may not be cited as evidence that any criterion holds or fails.
  - No row marked `open` may be used as an input to a claim until its certifying
