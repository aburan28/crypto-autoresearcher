design_report:
  task_id: TASK-20261001-768475
  goal_id: GOAL-ICEX-001
  batch_id: BATCH-454f85
  role: coordinator (design session)
  recorded_at: '2026-10-01'
  worktree: /Volumes/SSD990/wt-amend-ic
  base_commit_checked: b23a0a570f (contains dbc15277c9; verified before writing)
  records_drafted:
    hypothesis: H-ICEX-6ca21f (status specified, approved_by null, parent H-ICEX-d8e858)
    experiment: EXP-ICEX-153c34 (status review_required, approved_by null)
  scope_statement: >-
    Design only. No scientific run, no frozen-label draw, no protocol-labelled
    randomness and no enumerative B0 run was performed. All computation in
    this task is NON-PROTOCOL: a synthetic power simulation, arithmetic on
    committed RUN-ICEX-0ad4d8 output, and a feasibility probe on a public toy
    curve (p = 10007, a = 3, c = 7) that is not a protocol fixture.

  backend_choice:
    chosen: >-
      G1 = EXP-ICEX-fa2b37's lex Buchberger membership design (reused by
      citation, that file not edited), specialised to the interval factor
      base of the EXP-ICEX-aaccfc v4 fixtures, with recorded deviations D-1..D-6
      (spec backend.deviations_from_fa2b37). Key ones: D-2 builds the
      target-specialised f6 directly in the grid-reduced monomial basis from
      precomputed pair products of the f5 z-coefficients (the symbolic
      build-then-substitute order of fa2b37 exceeded 8 GiB, IMP-2); D-3
      forbids the CRT / evaluation representation, because that
      representation is enumeration under another name; D-4 checks
      certificates on a 10% audit sample; D-5 returns B0's decomposition
      choice so relation rows stay byte-identical.
    rationale:
      - The card requires a non-enumerative (Groebner or summation-polynomial) backend with everything else held fixed; fa2b37 is the program's frozen design of exactly that object, so reuse keeps the comparison honest and avoids a new unreviewed backend.
      - 'Observation collision recorded before compute: for an interval factor base V the quotient F_p[x1..x5]/<g_V(x_i)> is isomorphic to F_p^(V^5) by CRT, so any exact algorithm on the indicator ideal decides the same predicate as grid enumeration. Its unsymmetrised cost floor is A * L^5 (A = attempts per success), its symmetrised floor A * C(L+4,5).'
      - Attempts per success A is backend-independent (every exact backend decides the same predicate), so the experiment isolates per-attempt membership cost, which is the only quantity a non-enumerative backend can change.
      - 'Ceiling audit (ceiling_audit_output.json): on the six v4 fixtures the unsymmetrised grid floor alone is 1,041x to 8,438x the threshold T, and even the symmetrised floor is 55x to 229x T. The coordinator prior is therefore that the EV-ICEX-16e3ec obstruction persists under G1 (recorded in H-ICEX-6ca21f coordinator_prior before any result). The experiment is still designed in full, as the card requires: a measured G1 cost, the G1/B0 ratio and an exponent panel are the evidence that would close or reopen the lane, and the prior may be wrong if Groebner exploits structure the floor argument misses (that is what arm X measures).'
    alternatives_considered:
      - {backend: symmetrised summation-polynomial variant (Faugere-Perret-Petit-Renault style, recalled), decision: not built in v1, reason: "Floor is still >= 55x T on every v4 fixture; recorded as the successor if G1's measured exponent is below its floor."}
      - {backend: F4/F5 via an external CAS, decision: declined, reason: "Changes the charged-unit model (C-3 counters cannot be instrumented exactly inside a closed engine); fa2b37 already fixes Buchberger with counted operations."}
      - {backend: CRT / evaluation representation, decision: forbidden (D-3), reason: "It is enumeration in disguise and would only re-measure B0."}

  threshold:
    primary: T = 13 * 0.886 * sqrt(q) / (L + 27) C-3 units per required success, where L + 27 = (L + 11 relations) + 16 descents and 13 * 0.886 * sqrt(q) is one frozen rho reference in C-3 units (EV-ICEX-16e3ec derivation).
    secondary: The literal EV wording sqrt(q) / (L + 27) is reported beside it.
    obstruction_comparison: EV-ICEX-16e3ec's 50-306 rho solves per success for B0; G1 is reported on the same scale.

  power_check:
    script: power_check.py
    output: power_check_output.json
    label: NON-PROTOCOL synthetic cost tables (seed 768475_2026_1001; no protocol label)
    design_sd: 0.20 (log-cost residual SD expected once L variance is removed and yield is exact; HEUR-ICEX-6ca21f-3 falsifies it above 0.40)
    decision_rule: Favourable only if the stratified bootstrap AND the t(15) interval upper bounds on the between-size slope are both below 0.5, every component holding >= 1% of cost has slope < 0.5, and M_s < T on every 24-bit fixture.
    frozen_design_5_sizes_x_4_seeds:
      sd_0.095: {power_vs_planted_0.40: 1.000, false_favourable_at_0.50: 0.0115, false_favourable_at_0.60: 0.000}
      sd_0.20_design: {power_vs_planted_0.40: 0.9555, false_favourable_at_0.50: 0.0215, false_favourable_at_0.60: 0.000}
      sd_0.40: {power_vs_planted_0.40: 0.4655, false_favourable_at_0.50: 0.0195, false_favourable_at_0.60: 0.000}
      sd_0.78: {power_vs_planted_0.40: 0.1665, false_favourable_at_0.50: 0.0230, false_favourable_at_0.60: 0.0020}
    calibration_v4_style_at_sd_0.78: {power_vs_0.40: 0.117, false_favourable_at_0.50: 0.0545, false_favourable_at_0.60: 0.028, note: "Validator TASK-20261001-bd25c1 reported about 0.09 power for the v4 analysis; same order."}
    interval_choice: Bootstrap-only false-favourable at 0.50 is 5.7-6.9% (anti-conservative at 4 seeds per size); the t interval alone is near nominal (1.2-2.4%). Requiring both keeps the rate below 2.5%.
    reduced_panels: {sd_0.20: {sizes_16_22: 0.683, sizes_16_20: 0.269}, sd_0.78: {sizes_16_22: 0.099, sizes_16_20: 0.066}}
    more_fixtures_at_sd_0.78: {k_8: 0.319, k_16: 0.586}
    pooled_ols_check: Pooled OLS is unbiased in this simulator (0.401, 0.601), but the between-size estimator is kept because it is robust to within-size L variance.
    proves_too_much:
      PT-1_fixed_setup_x10: {complete_cost_slope_mean: 0.577, false_favourable_complete_cost_fit: 0.0, false_favourable_frozen_variable_cost_rule: 0.0}
      PT-1_fixed_setup_x1000: {complete_cost_slope_mean: 0.036, false_favourable_complete_cost_fit: 1.0, false_favourable_frozen_variable_cost_rule: 0.0, reading: "A q-independent setup flattens a complete-cost slope completely; fitting variable cost only is required, and is what the spec freezes."}
      PT-2_constant_per_query_term: {naive_slope_mean: 0.380, grid_component_slope_mean: 1.136, false_favourable_naive: 0.996, with_component_guard: 0.0, with_absolute_guard: 0.0, frozen_rule_all_guards: 0.0, reading: "A large constant per-query term hides an exponent > 1 from a total-cost slope; either guard alone defeats it."}
    power_check_rerun: "Rerun at 12:35-12:36 after adding the PT-1 x1000 object (39.8 s, single thread, nice 10; 15-minute load was 26.8 from other sessions, 1-minute 13.3). All earlier sections reproduced exactly (same non-protocol seed); only the PT-2 Monte Carlo figures moved (0.993 to 0.996) because the added object consumes random draws before it."
    interpretation: The frozen panel is powered (0.96) at the design SD and underpowered (0.17) at the v4 residual SD 0.78; arm X is therefore informative only if HEUR-ICEX-6ca21f-3 holds, and the spec states that a residual SD above 0.40 makes the arm-X verdict incomplete, not unfavourable.

  open_choices:
    - {choice: Threshold constant, made: "13 * 0.886 * sqrt(q) / (L + 27) primary, literal sqrt(q)/(L+27) secondary", why: "Matches the C-3 rho reference that EV-ICEX-16e3ec actually measured against; the literal form is kept so no reader has to trust the conversion."}
    - {choice: Arm M attempt stream, made: replay the v4 attempt stream exactly from RUN-ICEX-0ad4d8 logs, why: "Pairs G1 with B0 attempt by attempt, so the G1/B0 ratio has no sampling noise from A, and no new frozen-label draw is needed."}
    - {choice: Arm-M threshold metric, made: "M_s = U_M / (L + 27) with U_M total G1 units incl. setup and failures; CI by sequential resampling until L + 27 members", why: "This is exactly the quantity whose being below T means the pipeline beats rho; it also makes the SR-2 lower bound valid."}
    - {choice: Ground truth for arm X, made: "Oracle O5 (exact enumeration over the 5-multisets) as an uncharged verifier", why: "Gives exact yield so A carries no sampling variance into the slope; O5 cost is never charged to G1."}
    - {choice: Panel L rule, made: "L* frozen per size (5, 6, 8, 10, 13 for 16-24 bits, B* = 9, 12, 15, 20, 26)", why: "Removes L variance from the slope, as the card requires."}
    - {choice: Exponent estimator, made: between-size slope of size means with dual (bootstrap within bit size and t(15)) intervals, why: "Robust to within-size heterogeneity; dual intervals fix the bootstrap's anti-conservatism at 4 seeds."}
    - {choice: Design SD, made: '0.20', why: "With L frozen and exact yield the dominant v4 noise sources are gone; HEUR-3 falsifies the assumption if residual SD > 0.40."}
    - {choice: Arm X gating, made: unconditional (runs regardless of arm M), why: "Gating on arm M was considered and declined: arm M's verdict at v4 sizes cannot speak to the exponent, and gating would let the strongest prior suppress the only test that could overturn it (premature-closure rule)."}
    - {choice: Symmetrised variant, made: not built in v1, why: "Its floor is still >= 55x T on all v4 fixtures; named as successor."}
    - {choice: Certificates, made: 10% audit sample plus every arm-M success, why: "Full certification would roughly double cost without changing the decided predicate; SR-1 stops on any failure."}
    - {choice: Arm X attempts, made: '256 per fixture with exact yield', why: "Cost variance per attempt is small; yield comes from O5, so 256 bounds c_var's standard error well below the slope noise."}
    - {choice: Budget stop, made: SR-2 (100 rho references AND B0's whole spend), why: "Makes a verdict reachable for infeasible fixtures while giving a valid lower bound."}
    - {choice: Fixed costs, made: "Exponent fit on variable cost only (setup excluded), setup charged in M_s and reported separately", why: "A q-independent setup flattens a complete-cost slope; the PT-1 proves-too-much object checks this."}

  runtime_estimates:
    note: Advisory, not budgets. Derived from operation counts and the toy probe; Buchberger cost is genuinely unknown and is the main impediment (IMP-1).
    probe_measurements_non_protocol: {f4_terms: 439, f4_seconds: 0.015, f5_terms: 54777, f5_degree_per_variable: 8, f5_total_degree: 32, f5_seconds: 5.4, f5_peak_rss_mb: 518, symbolic_f6_by_resultant: "did not finish; OS kill (exit 137) after about 715 s; see procedure_notes"}
    per_cell:
      setup_P: {cost: about 45 * L^8 field multiplications (pair-product table for D-2), seconds: "< 1 s at L = 5; minutes at L = 13", memory_gb: "< 1"}
      per_query_specialisation_S: {cost: about 250 * L^5 multiplications, seconds: "ms at L = 5; about 1 s at L = 13", memory_gb: "< 0.5"}
      per_query_buchberger_G: {cost: unknown; plausibly L^10 to L^15 operations, seconds: "L <= 5 likely seconds to minutes; L >= 7 likely beyond the 3600 s watchdog", memory_gb: "<= 8 (protection limit; cell censored if reached)"}
      arm_M_fixture: {expectation: "L <= 5 fixtures (b16-s21, b16-s22, b20-s23) may complete; b16-s23 (L 6) borderline; b20-s21, b20-s22 (L 7, 11) expected to end by SR-2 or watchdog censoring", memory_gb: 8}
      arm_N_fixture: {attempts: 32, expectation: same feasibility pattern as arm M}
      arm_X_cell: {attempts: 256, expectation: "16-18 bit (L* 5-6) feasible; 20-24 bit (L* 8-13) likely incomplete (IMP-1)"}
      arm_R: {seconds: "about 1 hour total", memory_gb: 1}

  impediments:
    - {id: IMP-1, what_is_blocked: "Completion of arm-M fixtures with L >= 7 and arm-X sizes 20-24", clears_when: "Gate G0-4 smoke timing shows median G1 query < 60 s at L = 8, or the run completes those cells", asserts_nothing_about: the science}
    - {id: IMP-2, what_is_blocked: "fa2b37's symbolic build-then-substitute f6 order (exceeded 8 GiB)", clears_when: "Not required; D-2 replaces it, gate G0-3 checks it", asserts_nothing_about: the science}

  procedure_notes:
    - The first feasibility-probe attempt grew to 8.56 GB RSS (macOS ignores RLIMIT_AS) and was killed by this session; the 8 GiB protection limit was exceeded briefly. The second attempt added flushed JSON-lines output and a 4 GiB watchdog thread, but Singular holds the GIL so the watchdog could not fire; the OS killed the process (exit 137) about 715 s into the symbolic f6 step. It was not rerun; the outcome is recorded as IMP-2 and is infrastructure, not evidence.
    - 'The machine 15-minute load rose to about 34 (limit 14) during the probe window, with other sessions'' processes (a RELN power check, rustc, browser) contributing. Heavy computation was paused; only the 40 s single-thread power-check rerun was done afterwards, while the 15-minute average (driven by other sessions) was still about 27 and so above the limit; its own contribution to that average is about 0.04 (see power_check_rerun).'
    - 'An arm-M metric correction was made inside the draft before submission: the threshold metric is total units over the L + 27 required successes, which keeps the SR-2 lower bound valid even when a success adds no rank.'

  validation:
    yaml_safe_load: both records parse (top-level keys hypothesis and experiment; ids, status and approved_by null confirmed)
    validate_ledger: "python3 tools/validate_ledger.py exits 1 on pre-existing errors elsewhere (sparse-checkout references); filtering for H-ICEX-6ca21f|EXP-ICEX-153c34 returns no lines"

