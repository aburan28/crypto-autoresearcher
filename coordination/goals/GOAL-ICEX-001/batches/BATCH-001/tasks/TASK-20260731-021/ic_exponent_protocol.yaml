ic_exponent_protocol:
  schema: crypto.autoresearch.icex_exponent_protocol.v1
  task_id: TASK-20260731-021
  goal_id: GOAL-ICEX-001
  batch_id: BATCH-001
  research_question_ids: [RQ-ICEX-001, RQ-ECDLP-002]
  open_problem_refs: [KN-OPEN-001]
  literature_refs: [KN-LIT-006, KN-LIT-009, KN-LIT-025, KN-LIT-094]
  technique_refs: [KN-TECH-003, KN-TECH-008, KN-TECH-035]
  parent_goal_id: GOAL-PATH-001
  tier: 2
  status: review_only_design
  terminal_verdict: PROTOCOL_COMPLETE_REVIEW_REQUIRED
  protocol_version: ICEX-e2e-exponent-1.0.0-review

  authorization: >-
    Review-only freeze. No implementation, solver campaign, relation campaign,
    Groebner run, Pollard-rho/BSGS control run, linear-algebra campaign,
    descent campaign, or experiment is authorized by this artifact.
    Independent red-team PASS on this package is not auto-execution license:
    a separate Coordinator ledger authorization is required before any ICEX
    measurement or aggregation task may be admitted. Present-tense
    non-authorization is hard-gated. ICEX remains non-executing until later
    activation after charged SDEG/MONO/RELN feed *measurements* exist —
    protocol PASSes alone do not unlock measurement.

  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; authorized
      fallback under AMEND-PATH-001-001. Fallback is infrastructure/policy
      metadata, not mathematical evidence. Equivalence to research-sol-max is
      not claimed.

  # ---------------------------------------------------------------------------
  # Feed pins (charged only; named to decisions + artifact paths)
  # ---------------------------------------------------------------------------
  feed_pins:
    status: protocol_pins_awaiting_measurement_packages
    rule: >-
      Consume only charged feeds named below. Optimistic p_exist, KN-LIT-009
      HEUR-SEMAEV-2015-4.3, and any uncharged oracle supply are forbidden as
      ICEX inputs. Protocol PASS decisions unlock design consumption of the
      feed *schemas*; they do not mint measured numbers.

    sdeg:
      role: G4_C_decomp_numerator_and_matched_baselines
      goal_id: GOAL-SDEG-001
      protocol_pass_decision: DEC-20260725-015
      evidence_ref: EV-SDEG-001
      protocol_task: TASK-20260725-641
      red_team_task: TASK-20260725-643
      red_team_report_id: RT-20260725-643
      protocol_artifact: >-
        coordination/goals/GOAL-SDEG-001/batches/BATCH-001/tasks/TASK-20260725-641/scaling_protocol.yaml
      design_note: >-
        coordination/goals/GOAL-SDEG-001/batches/BATCH-001/tasks/TASK-20260725-641/protocol_design_note.md
      red_team_report: >-
        coordination/goals/GOAL-SDEG-001/batches/BATCH-001/tasks/TASK-20260725-643/red_team_report.yaml
      snapshot_archive: >-
        coordination/goals/GOAL-SDEG-001/batches/BATCH-001/archives/TASK-20260725-642/snapshot-receipt.json
      charged_symbols_required:
        - C_decomp   # multi-coordinate rank-failure-resource-v1 per sealed cell (p,m)
        - C_rho      # matched Pollard-rho control vector, same schema
        - C_bsgs     # matched BSGS control vector, same schema
      package_after_future_measurement: >-
        Per-cell C_decomp resource vectors, solving-degree proxy profiles
        (proxy≠d_reg), matched C_rho/C_bsgs, certificate/conservation
        manifests, R_gain and undefined-per-rank flags, claim_boundary_echo_toy.
      forbidden_from_sdeg_feed:
        - scalarized_single_cost
        - undeclared_alpha_less_than_half
        - crypto_extrapolation
        - equating_gb_max_total_degree_with_theoretical_d_reg
      measurement_status_at_protocol_design: absent
      note: >-
        DEC-20260725-015 is protocol-design PASS only; no empirical C_decomp
        vectors exist yet. ICEX measurement may not invent them.

    mono:
      role: G5_chebotarev_toy_census_envelope_structure_context
      goal_id: GOAL-MONO-001
      protocol_pass_decision: DEC-20260725-027
      evidence_ref: EV-MONO-002
      protocol_task: TASK-20260725-705
      red_team_task: TASK-20260725-707
      red_team_report_id: RT-20260725-707
      protocol_artifact: >-
        coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-705/monodromy_protocol.yaml
      design_note: >-
        coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-705/protocol_design_note.md
      red_team_report: >-
        coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-707/red_team_report.yaml
      snapshot_archive: >-
        coordination/goals/GOAL-MONO-001/batches/BATCH-002/archives/TASK-20260725-706/snapshot-receipt.json
      charged_symbols_required:
        - outcome_id  # FULL_MONODROMY_BARRIER_TOY | RANDOM_PANEL_CALIBRATION_TOY | EXCEPTIONAL_LOCUS_TOY | SCOPED_PROTOCOL_NO_GO
        - chebotarev_prediction_plus_toy_census_envelope  # when FULL
        - joint_relation_proxy_rate_or_family_rates       # when EXCEPTIONAL
      package_after_future_measurement: >-
        MONO icex_feed outcome package with panel logs, CM-gate completion
        block, and labeled envelope. Envelope is structure/rate *context*,
        never a substitute for RELN declared_p_lower_solve.
      admissible_outcome_ids_for_icex_structure_pin:
        - FULL_MONODROMY_BARRIER_TOY
        - EXCEPTIONAL_LOCUS_TOY
        - RANDOM_PANEL_CALIBRATION_TOY  # planning only; CM exceptional-rate content not closed
      blocks_icex_structure_pin:
        - SCOPED_PROTOCOL_NO_GO
      cm_closure_rule: >-
        Exceptional-rate sieve closure for CM families requires
        FULL_MONODROMY_BARRIER_TOY under CTRL-CM-GATE-FULL (≥8 scored CM).
        RANDOM_PANEL_CALIBRATION_TOY must be labeled random_panel_only_cm_unscored
        and must not close CM exceptional-rate ICEX content.
      measurement_status_at_protocol_design: absent
      note: >-
        DEC-20260725-027 is repaired-protocol PASS only; no census data.
        Chebotarev 1/2 is theorem-backed (KN-LIT-039); 3·(2/√p) is a
        protocol pin, not an effective monodromy theorem.

    reln:
      role: G6_relation_supply_p_L_only
      goal_id: GOAL-RELN-001
      protocol_pass_decision: DEC-20260725-017
      evidence_ref: EV-RELN-001
      protocol_task: TASK-20260725-661
      red_team_task: TASK-20260725-663
      red_team_report_id: RT-20260725-663
      protocol_artifact: >-
        coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/decomp_probability_protocol.yaml
      design_note: >-
        coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/protocol_design_note.md
      red_team_report: >-
        coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-663/red_team_report.yaml
      snapshot_archive: >-
        coordination/goals/GOAL-RELN-001/batches/BATCH-001/archives/TASK-20260725-662/snapshot-receipt.json
      charged_symbols_required:
        - declared_p_lower_solve  # sole ICEX relation-supply pin (Clopper-Pearson on p_solve)
        - hat_p_solve             # with CIs; audit companion
        - C_rel_trial             # per-trial charged relation_collection vectors
      audit_only_symbols:
        - hat_p_exist             # never feeds ICEX as charged supply
        - residual_vs_HEUR-SEMAEV-2015-4.3  # confidence: reported unless cell upgrade
      p_L_source_for_ICEX: declared_p_lower_solve
      package_after_future_measurement: >-
        Per-stratum declared_p_lower_solve, hat_p_solve+CIs, audit-only
        hat_p_exist, heuristic residuals with reported label, C_rel_trial
        vectors, probability-gate manifests, claim_boundary_echo_toy.
      forbidden_from_reln_feed:
        - p_exist_presented_as_charged_relation_probability
        - kn_lit_009_exponents_as_established
        - HEUR-SEMAEV-2015-4.3_as_p_L_substitute
        - ceil_r_over_p_L
        - scalarized_single_cost
        - crypto_extrapolation
      measurement_status_at_protocol_design: absent
      note: >-
        DEC-20260725-017 is protocol-design PASS only; no relation-rate data.
        KN-LIT-009 heuristics remain reported-only.

    ecdlp_cost_honesty_pattern:
      role: conservation_schema_and_claim_boundary_inheritance
      goal_id: GOAL-ECDLP-001
      toy_validation_protocol: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/toy_validation_protocol.yaml
      toy_validation_decision: DEC-20260725-025
      certificate_contract: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
      contract_schema: crypto.autoresearch.rank_failure_conservation_certificate
      contract_version: "1.0.0-review"
      inherited_patterns:
        - no_scalarization
        - five_named_stages
        - forbid_ceil_r_over_p_L
        - nine_planted_conservation_controls
        - independent_decomposition_certificates
        - rank-failure-resource-v1
        - rank-failure-terminal-v1
        - PRECOMMIT_VERIFIER_HASH_MISSING_hard_gate

  # ---------------------------------------------------------------------------
  # Certificate-contract pin
  # ---------------------------------------------------------------------------
  certificate_contract_pin:
    path: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
    schema: crypto.autoresearch.rank_failure_conservation_certificate
    version: "1.0.0-review"
    claim_tier_maximum: toy
    ecdlp_alignment:
      toy_validation_protocol_path: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/toy_validation_protocol.yaml
      toy_validation_decision: DEC-20260725-025
      rule: >-
        This ICEX protocol may not authorize execution. Measurement admission
        requires (i) this protocol's independent review PASS, (ii) separate
        Coordinator ledger authorization, (iii) charged SDEG/MONO/RELN
        measurement packages (not protocol PASSes alone), and (iv)
        GOAL-ECDLP-001 activation residuals closed or an explicit Coordinator
        amendment naming a substitute activation gate with equal hardness.
    obligations_inherited:
      - id: OBL-CLAIM-BOUNDARY
        requirement: >-
          maximum_tier toy; no attack improvement, ECDLP lower bound,
          crypto-scale conclusion, breakthrough, solution, universal
          impossibility, IC-beats-rho at crypto scale, or fallback-equivalence
          claim.
      - id: OBL-NO-SCALARIZATION
        requirement: >-
          Resource vectors remain multi-coordinate. No cross-unit sum. No
          illicit scalar cost. Comparisons only under predeclared coordinatewise
          dominance with identical counter conventions. Single-coordinate
          alpha reports are descriptive under a predeclared primary coordinate
          and never substitute for the full vector.
      - id: OBL-FULL-COST-STAGES
        requirement: >-
          Charge setup, relation_collection, linear_algebra, descent, and
          verification as named stages; audit overhead included. Memory,
          I/O, and communication coordinates remain first-class (KN-TECH-035).
      - id: OBL-DECOMPOSITION-CERTIFICATE
        requirement: >-
          Every claimed decomposition / relation row carries an independently
          re-verified decomposition certificate before RELATION_VALID / rank
          credit.
      - id: OBL-TERMINAL-VOCABULARY
        requirement: >-
          Use exhaustive rank-failure-terminal-v1 codes; timeouts/infra/
          implementation failures are costs, not negative mathematical evidence.
      - id: OBL-PROBABILITY-GATE
        requirement: >-
          Forbid ceil(r/p_L). Finite-tail / relation-supply claims require
          declared stratified fixed-IID assumptions and Clopper-Pearson
          declared_p_lower_solve; drop finite-tail claim if IID indefensible.
      - id: OBL-VERIFIER-HASH-ACTIVATION
        requirement: >-
          independent_verifier_artifact_sha256 must be non-null at seal time
          or activation fails closed. This design leaves the hash null —
          activation blocked by construction.
      - id: OBL-ZERO-RANK-COST
        requirement: >-
          When R_gain=0, resource-per-rank is componentwise undefined/infinity;
          do not fabricate a finite scalar numerator or finite alpha for ICEX.
      - id: OBL-CHARGED-FEEDS-ONLY
        requirement: >-
          ICEX may ingest only C_decomp / C_rho / C_bsgs (SDEG), MONO labeled
          envelopes, and RELN declared_p_lower_solve (+ charged C_rel_trial).
          p_exist and KN-LIT-009 heuristics are audit-only.

  # ---------------------------------------------------------------------------
  # Claim boundary
  # ---------------------------------------------------------------------------
  claim_boundary:
    maximum_tier: toy
    field_bit_size_max: 32
    passing_claim: >-
      After authorized sealed end-to-end campaigns under this protocol and
      contract 1.0.0-review, a later independent verifier may conclude only
      that the charged multi-coordinate toy-scale index-calculus cost vector
      C_IC and the derived per-coordinate toy exponents alpha_coord, compared
      to matched Pollard-rho / BSGS baseline vectors on the named fixtures,
      behave as recorded — including whether a predeclared primary-coordinate
      CI for alpha excludes 1/2 within declared toy scope — without asserting
      crypto-scale IC-beats-rho, asymptotic advantage, or promotion of
      KN-LIT-009 heuristics to established status.
    protocol_pass_is_not:
      - measurement
      - empirical_alpha
      - crypto_scale_validation
      - feed_measurement_existence
    prohibited_claims:
      - asymptotic_advantage_alpha_less_than_1_2_at_crypto_scale
      - ic_beats_rho_crypto_scale
      - crypto_scale_relevance
      - ecdlp_attack_improvement
      - ecdlp_lower_bound
      - breakthrough_or_solution
      - universal_impossibility
      - kn_lit_009_heuristic_established_or_asymptotically_validated
      - treating_oracle_p_exist_as_free_relation_supply
      - ceil_r_over_p_L_as_budget
      - illicit_scalarization_of_cost_vectors
      - fallback_equivalence_to_research_sol_max
      - medium_or_crypto_ladder_from_toy_alone
    exclusions:
      - no_live_keys_or_private_targets
      - timeouts_infra_failures_are_costs_not_negative_math
      - P1553_R4_out_of_scope
      - kn_lit_009_complexity_exponents_remain_reported_until_reproduced

  # ---------------------------------------------------------------------------
  # Novelty
  # ---------------------------------------------------------------------------
  protocol_class: measurement
  novelty_status: adaptation
  novelty_screen:
    corpus_checked:
      - knowledge/open-problems/KN-OPEN-001.md
      - knowledge/techniques/KN-TECH-003.md
      - knowledge/techniques/KN-TECH-008.md
      - knowledge/techniques/KN-TECH-035.md
      - knowledge/literature/KN-LIT-006.md
      - knowledge/literature/KN-LIT-009.md
      - knowledge/literature/KN-LIT-025.md
      - ledger/questions/RQ-ICEX-001.yaml
      - ledger/goals/GOAL-ICEX-001.yaml
      - ledger/hypotheses
      - coordination/goals/GOAL-SDEG-001/batches/BATCH-001/tasks/TASK-20260725-641/scaling_protocol.yaml
      - coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-705/monodromy_protocol.yaml
      - coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/decomp_probability_protocol.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/toy_validation_protocol.yaml
    web_literature_check: not_performed_this_session
    classification: >-
      Known end-to-end index-calculus accounting vs Pollard rho (KN-OPEN-001,
      KN-TECH-003/035, KN-LIT-006/094) adapted to Tier-path charged feeds from
      SDEG/MONO/RELN under certificate contract 1.0.0-review. Composition of
      G4–G6 pins into one exponent protocol is program orchestration, not a
      new cryptanalytic mechanism.
    honesty_note: >-
      Whether charged toy IC can achieve alpha with CI excluding 1/2 remains
      open (KN-OPEN-001 / RQ-ICEX-001). This card freezes the accounting and
      activation gates; it does not answer the open problem.

  # ---------------------------------------------------------------------------
  # Exact claim frozen by this protocol
  # ---------------------------------------------------------------------------
  frozen_claim:
    statement: >-
      On sealed toy prime-field fixtures (≤32-bit), the end-to-end charged
      multi-coordinate index-calculus cost vector C_IC assembled from SDEG
      C_decomp, RELN declared_p_lower_solve (+ C_rel_trial), and MONO labeled
      Chebotarev/toy envelopes, compared coordinatewise to matched Pollard-rho
      and BSGS baselines under identical counter conventions, yields per-
      coordinate toy exponents alpha_coord = log(C_IC[coord]) / log(ell)
      (where defined) whose predeclared primary-coordinate confidence interval
      either excludes 1/2, includes 1/2, or is undefined — without scalarizing
      vectors, without ceil(r/p_L), and without crypto-scale claims.
    discriminates:
      - id: H-ALPHA-EXCLUDES-HALF
        meaning: >-
          Predeclared primary-coordinate CI for alpha_coord lies entirely
          below 1/2 AND C_IC is not coordinatewise dominated by C_rho on
          memory/communication/I/O coordinates under the sealed comparison
          rule. Meaning at toy scope only: authorize consideration of a later
          medium-scale trend gate — never crypto-scale IC-beats-rho.
      - id: H-ALPHA-INCLUDES-HALF
        meaning: >-
          Primary-coordinate CI includes 1/2, or C_rho coordinatewise
          dominates C_IC on a predeclared critical coordinate. Meaning:
          current charged IC pipeline does not beat rho at tested toy scope;
          closes this pipeline's toy advantage claim without refuting all
          future IC variants.
      - id: H-COST-DOMINATED-BY-RELN-OR-LA
        meaning: >-
          Stage attribution shows relation_collection or linear_algebra
          dominates the charged vector. Meaning: refine that stage before
          claiming end-to-end exponent wins.
      - id: H-UNDEFINED-EXPONENT
        meaning: >-
          R_gain=0 or required feed packages missing/invalid → alpha
          undefined. Meaning: no exponent claim; propagate NO_GO.
    falsification_of_protocol_honesty:
      - illicit_scalarization_of_resource_vector
      - feeding_ICEX_with_p_exist_as_charged_p_L
      - substituting_HEUR-SEMAEV-2015-4.3_for_declared_p_lower_solve
      - using_ceil_r_over_p_L_as_budget_guarantee
      - asserting_crypto_scale_IC_beats_rho_from_toy
      - treating_TIMEOUT_or_INFRASTRUCTURE_FAILURE_as_negative_math_evidence
      - minting_alpha_when_R_gain_is_zero
      - treating_SDEG_MONO_RELN_protocol_PASS_as_measurement_packages
      - closing_CM_exceptional_rate_content_without_FULL_MONODROMY_BARRIER_TOY

  # ---------------------------------------------------------------------------
  # End-to-end accounting equation (full-cost vector)
  # ---------------------------------------------------------------------------
  accounting:
    schema: rank-failure-resource-v1
    no_scalarization: true
    symbol: C_IC
    definition: >-
      Campaign-aggregated end-to-end charged resource vector for one sealed
      toy index-calculus discrete-log attempt (or sealed multi-replica
      campaign aggregate under identical conventions), including all required
      stages and verification overhead.

    equation_vector: >-
      C_IC = C_setup ⊕ C_relation_collection ⊕ C_linear_algebra ⊕ C_descent
      ⊕ C_verification
      where ⊕ denotes coordinatewise aggregation under rank-failure-resource-v1
      ownership rules (additive coords sum; nonadditive coords take declared
      campaign aggregates / peaks — never wall+cpu cross-unit sums).

    stage_definitions:
      setup: >-
        Fixture load, factor-base construction/registry, summation-polynomial
        / solver initialization, and shared-work registry entries. Amortization
        only via explicit shared_work_id weights summing to 1.
      relation_collection: >-
        All charged algebraic decomposition / relation-search attempts that
        contribute to the sealed cohort, including failed and censored
        attempts. Built from SDEG C_decomp trial costs and/or RELN C_rel_trial
        vectors. Never from uncharged enumeration oracles.
      linear_algebra: >-
        Sparse / structured LA over the relation matrix (KN-TECH-008),
        including memory and I/O coordinates (KN-TECH-035). Zero or
        not_applicable only if named and justified (pure feed-calibration
        campaigns that do not assemble a matrix must not claim end-to-end
        ECDLP solve exponents).
      descent: >-
        Individual-logarithm / descent work after kernel extraction, charged
        fully. Zero only if the sealed campaign does not claim a discrete-log
        solution.
      verification: >-
        Independent certificate re-verification, rank checks, and audit
        overhead — always charged when certificates are claimed.

    feed_composition_rules:
      numerator_cost: >-
        Per successful certified relation, charge at least the corresponding
        SDEG C_decomp (or RELN C_rel_trial) vector observed for that attempt
        class; do not replace measured vectors with heuristic constants.
      relation_supply: >-
        Sole probability pin p_L := declared_p_lower_solve from RELN
        MEASURED_P_SOLVE_LADDER_TOY (or HEURISTIC_REJECTED_AT_TOY_SCOPE with
        the same measured p_L package). hat_p_exist and HEUR-SEMAEV-2015-4.3
        are audit metadata only.
      structure_context: >-
        MONO envelope labels the structure prior
        (chebotarev_prediction_plus_toy_census_envelope or family-specific
        rates). It must not replace p_L and must not silently upgrade
        quasirandom proxies into charged solve probabilities.
      baseline: >-
        Matched C_rho and C_bsgs from SDEG (same fixture subgroup, same
        resource schema/vocabulary, discrete_log certificates for claimed
        solves). ICEX may also seal its own matched rho/BSGS controls under
        identical conventions; mismatched schemas are incomparable.

    forbidden_transforms:
      - id: FORBID-CEIL-RP
        statement: "Forbid ceil(r / p_L) as a budget guarantee or success certificate."
        stop_rule: STOP-NO-CEIL-RP
      - id: FORBID-SCALARIZATION
        statement: >-
          Forbid single-scalar C_IC, wall+cpu sums, and undeclared
          ops-weighted scalars presented as proof of advantage.
        stop_rule: STOP-NO-SCALAR-RESCUE
      - id: FORBID-P-EXIST-IMPORT
        statement: >-
          Forbid importing optimistic p_exist or oracle enumeration success
          as charged relation supply.
        stop_rule: STOP-ORACLE-LEAK
      - id: FORBID-KN-LIT-009-IMPORT
        statement: >-
          Forbid feeding HEUR-SEMAEV-2015-4.3 or KN-LIT-009 complexity
          exponents as established p_L or alpha inputs.
        stop_rule: STOP-HEURISTIC-OVERCLAIM
      - id: FORBID-PROTOCOL-PASS-AS-DATA
        statement: >-
          Forbid treating DEC-20260725-015/027/017 protocol PASSes as if they
          contained measured C_decomp, census rates, or p_L.
        stop_rule: STOP-FEED-MEASUREMENT-MISSING

    finite_tail_and_relation_budget:
      forbid: ceil(r/p_L)
      allowed_models:
        - id: OBSERVED_CHARGED_COHORT
          description: >-
            Prefer: seal a finite attempt schedule; charge every attempt;
            report observed R_gain and C_IC. No imputed successes.
        - id: DECLARED_IID_NEGATIVE_BINOMIAL
          description: >-
            If and only if stratified fixed-IID is sealed and defensible,
            report negative-binomial / binomial tail probabilities at
            declared alpha using p_L = declared_p_lower_solve. Drop the
            finite-tail claim if IID is indefensible.
      when_p_L_zero: >-
        If declared_p_lower_solve = 0 (including x_solve=0), relation-supply
        finite-tail claims are inactive; do not invent a positive p_L.

    additive_coordinates:
      - cpu_time_ns
      - group_operations_by_declared_type
      - io_read_bytes
      - io_write_bytes
      - communication_sent_bytes
      - communication_received_bytes
    nonadditive_coordinates:
      - campaign_elapsed_wall_ns
      - active_wall_union_ns
      - peak_memory_bytes_by_domain
      - campaign_peak_observed_bytes
      - retained_unique_bytes
    stage_attribution_required:
      - setup
      - relation_collection
      - linear_algebra
      - descent
      - verification

  # ---------------------------------------------------------------------------
  # Exponent definition (toy; multi-coordinate)
  # ---------------------------------------------------------------------------
  exponent_definition:
    group_order_symbol: ell
    per_coordinate_formula: >-
      For each additive cost coordinate c with C_IC[c] > 0 and ell > 1:
        alpha_coord[c] := log(C_IC[c]) / log(ell)
      using natural or common log consistently within a sealed campaign.
      Nonadditive coordinates may report companion exponents under the same
      formula when the sealed schedule predeclares which peak/aggregate value
      enters the log; otherwise they remain vector companions only.
    baseline_exponents:
      rho_reference: >-
        Pollard rho classical step-count heuristic ~ O(ell^{1/2}); under this
        protocol the operative baseline is the measured matched C_rho vector,
        not an imputed scalar sqrt(ell).
      bsgs_reference: >-
        BSGS matched C_bsgs vector; full-cost memory coordinates must remain
        visible (KN-TECH-035 / KN-LIT-094).
    primary_coordinate_rule: >-
      Before observing outcomes, the sealed schedule must name exactly one
      primary_coordinate for the alpha CI test (default design pin:
      total group_operations under frozen types add+dbl+mixed_add, or
      cpu_time_ns if group-op instrumentation incomplete — choose one and
      freeze). Other coordinates remain mandatory for honesty and dominance
      checks.
    confidence_interval_rule: >-
      Across sealed replicas (minimum 3), compute a predeclared CI for
      alpha_primary (e.g. percentile bootstrap or Student-t on replica
      alphas). Replica definition and CI method must be sealed before
      execution.
    advantage_predicate_toy:
      id: PRED-ALPHA-EXCLUDES-HALF-TOY
      requires_all_of:
        - primary_CI_entirely_below_1_2
        - R_gain_positive_with_independent_certificates
        - C_IC_not_coordinatewise_dominated_by_C_rho_on_predeclared_critical_set
        - feeds_valid_charged_packages
        - claim_boundary_echo_toy
      does_not_authorize:
        - crypto_scale_IC_beats_rho
        - medium_tier_without_separate_gate
        - KN-LIT-009_established
    comparison_rule: >-
      Coordinatewise dominance under identical counter conventions and
      coverage only; otherwise incomparable. Toy ratios must not be narrated
      as asymptotic exponents beyond the sealed bit sizes.

  # ---------------------------------------------------------------------------
  # Fixture / cell design pins (bytes not sealed here)
  # ---------------------------------------------------------------------------
  fixture_ladder:
    status: design_pin_not_executable
    model: short_weierstrass
    field_kind: prime_field
    curve_family: generic_ordinary
    encoding: uncompressed_sec1_xy_hex_width_by_field
    bit_sizes_toy_ordered: [8, 10, 12, 16]
    hard_cap_bits: 32
    alignment: >-
      Prefer cells that intersect SDEG ladder cells (bits in
      {8,10,12,16,...}) and RELN probability strata (bits in {8,10,12,16})
      so C_decomp and declared_p_lower_solve bind to the same (p,m,B) class.
      MONO census primes (211,431,809,1601) are structure-context only and
      are not required to equal ICEX ECDLP fixture primes.
    cells_design:
      - cell_id: CELL-ICEX-TOY-008-M2
        field_bits: 8
        m: 2
        summation_polynomial: S_3
        requires_feed_bindings: [SDEG C_decomp, RELN declared_p_lower_solve, MONO outcome]
      - cell_id: CELL-ICEX-TOY-010-M2
        field_bits: 10
        m: 2
        summation_polynomial: S_3
        requires_feed_bindings: [SDEG C_decomp, RELN declared_p_lower_solve, MONO outcome]
      - cell_id: CELL-ICEX-TOY-012-M2
        field_bits: 12
        m: 2
        summation_polynomial: S_3
        requires_feed_bindings: [SDEG C_decomp, RELN declared_p_lower_solve, MONO outcome]
      - cell_id: CELL-ICEX-TOY-012-M3
        field_bits: 12
        m: 3
        summation_polynomial: S_4
        note: secondary; admit only after m=2 primary cells seal
      - cell_id: CELL-ICEX-TOY-016-M2
        field_bits: 16
        m: 2
        summation_polynomial: S_3
        requires_feed_bindings: [SDEG C_decomp, RELN declared_p_lower_solve, MONO outcome]
    fixture_materialization_rule: >-
      Before any executable ICEX campaign, Coordinator must freeze public
      fixture JSON per cell with curve_or_group_parameters, subgroup_order ell,
      factor_base_points, encodings, and fixture_sha256 under RFC 8785 JCS
      digest rules from contract 1.0.0-review, and must hash-bind the exact
      SDEG/RELN/MONO measurement package digests consumed. This BATCH-001
      design does not materialize fixture bytes and does not seal schedules.
    ecdlp_reference_fixture_for_schema_alignment:
      fixture_id: FIXTURE-ECDLP-TOY-RANKFAIL-001
      fixture_sha256: 4c82f5e43efce185a2ecbf2cbcc24b6da7a1bddadd1176007427be350494c4a8
      use: >-
        Schema/encoding alignment reference only. Not a substitute for ICEX
        ladder fixtures.

  # ---------------------------------------------------------------------------
  # Certificates, controls, falsification
  # ---------------------------------------------------------------------------
  certificates:
    required_kinds:
      - decomposition   # every RELATION_VALID row
      - discrete_log    # any claimed end-to-end ECDLP solve (IC or baseline)
    independent_reverification: mandatory
    zero_gain_rule: >-
      R_gain=0 ⇒ resource-per-rank and end-to-end solve-exponent claims
      undefined; preserve costs; do not mint alpha.

  controls:
    conservation_planted:
      source: certificate_contract.planted_controls
      required:
        - CTRL-OMISSION
        - CTRL-DUPLICATE-ID
        - CTRL-RETRY-CYCLE
        - CTRL-FIELD-SCHEMA
        - CTRL-SHARED-DOUBLE
        - CTRL-SHARED-OMITTED
        - CTRL-CERTIFICATE-ROW
        - CTRL-WRONG-FIELD
        - CTRL-CLEAN
    measurement_and_baseline:
      - id: CTRL-MATCHED-RHO
        purpose: baseline_fairness
        design: >-
          Sealed Pollard-rho control campaign on the same public fixture
          subgroup, same resource schema/vocabulary; discrete_log certificates
          for claimed solves.
      - id: CTRL-MATCHED-BSGS
        purpose: baseline_fairness
        design: >-
          Sealed BSGS control campaign matched as above; memory coordinates
          retained.
      - id: CTRL-FEED-PIN-INTEGRITY
        purpose: charged_feed_hygiene
        design: >-
          Machine check that ingested packages cite DEC-20260725-015/027/017
          artifact digests, export only charged symbols, and do not present
          p_exist or HEUR-SEMAEV-2015-4.3 as p_L.
      - id: CTRL-NO-CEIL-RP
        purpose: probability_gate
        design: >-
          Reject any ICEX package emitting ceil(r/p_L) as a budget guarantee.
      - id: CTRL-NO-SCALAR-RESCUE
        purpose: cost_honesty
        design: >-
          Reject single-scalar C_IC or alpha packaged as the sole comparison
          without the full multi-coordinate vector and dominance audit.
      - id: CTRL-MONO-CM-GATE
        purpose: structure_context_honesty
        design: >-
          If ICEX closes exceptional-rate sieve content for CM families,
          require MONO outcome_id FULL_MONODROMY_BARRIER_TOY with completed
          CM screen; otherwise label non-closure.
      - id: CTRL-PLANTED-END-TO-END
        purpose: positive_control
        design: >-
          On at least one sealed positive-control cell, plant a discrete log
          instance solvable within toy budget by both IC path (with certified
          relations) and rho/BSGS; require independent discrete_log
          certificates for claimed solves.
      - id: CTRL-PRIMARY-COORDINATE-PREDECLARED
        purpose: statistical_hygiene
        design: >-
          primary_coordinate and CI method appear in the sealed schedule
          before any ICEX attempt activation.

  confounders:
    - treating_protocol_PASS_as_measured_feeds
    - p_exist_vs_p_solve_oracle_leak
    - KN-LIT-009_heuristic_smuggling
    - ceil_r_over_p_L_optimistic_budgets
    - illicit_scalarization_hiding_memory_dominance
    - mismatched_fixture_bindings_across_SDEG_RELN_ICEX
    - MONO_envelope_used_as_p_L
    - CM_exceptional_rate_closure_without_CM_screen
    - R_gain_zero_with_fabricated_alpha
    - wall_clock_noise_vs_exact_group_op_counters
    - shared_work_double_counting
    - sympy_buchberger_not_optimized_F4_as_asymptotic_evidence

  falsification_conditions:
    - >-
      If a claimed toy alpha CI excluding 1/2 depends on p_exist, KN-LIT-009
      heuristics, ceil(r/p_L), or scalarized costs, the ICEX instance is
      invalid (honesty falsified), not a mathematical IC win.
    - >-
      If matched C_rho coordinatewise dominates C_IC on the predeclared
      critical coordinate set, H-ALPHA-EXCLUDES-HALF is falsified at that
      cell even if a single coordinate looks favorable.
    - >-
      If required feed measurement packages are absent, SCOPED_PROTOCOL_NO_GO
      — neither advantage nor refutation of IC mechanisms.
    - >-
      If conservation planted controls or certificate gates fail, campaign
      certificate invalid; costs preserved; not negative math evidence.
    - >-
      Timeouts/infra/implementation failures never falsify the mathematical
      possibility of decompositions or of future IC variants.

  # ---------------------------------------------------------------------------
  # Seeds, budgets, stopping (design pins; not executable)
  # ---------------------------------------------------------------------------
  seeds:
    scheme: seed_256_hex
    replications_per_cell_minimum: 3
    master_seed_derivation: >-
      Future sealed schedules derive attempt seeds as
      SHA-256("icex-e2e-v1" || cell_id || replica_index_u32be || campaign_id)
      truncated/encoded to 64 hex chars — listed exhaustively before seal.

  budgets:
    per_attempt_defaults:
      wall_clock_seconds: 300
      memory_gb: 4
      maximum_cpu_time_ns: "300000000000"
    per_campaign_defaults:
      wall_clock_seconds: 7200
      memory_gb: 8
      maximum_attempts: 128
    control_campaigns:
      rho_wall_clock_seconds: 1200
      bsgs_wall_clock_seconds: 1200
    exhaustion_mapping:
      wall_cap: TIMEOUT_CENSORED
      memory_cap: RESOURCE_EXHAUSTION
      coordinator_cancel: BUDGET_CANCELLATION
      env_fail: INFRASTRUCTURE_FAILURE
      impl_fail: IMPLEMENTATION_FAILURE

  stopping_rules:
    - id: STOP-LADDER-COMPLETE
      condition: >-
        All sealed cells have terminal receipts for every schedule attempt
        (including NOT_ACTIVATED) and conservation/probability/exponent gates
        evaluated.
    - id: STOP-HARD-CAP
      condition: field_bits would exceed 32
      action: do_not_admit_cell
    - id: STOP-ACTIVATION-BLOCKED
      condition: >-
        independent_verifier_artifact_sha256 is null OR precommit
        verified_before_execution is false OR feed measurement packages missing
      action: fail_closed_no_activation
    - id: STOP-FEED-MEASUREMENT-MISSING
      condition: >-
        SDEG C_decomp package, MONO outcome package, or RELN
        declared_p_lower_solve package absent/invalid
      action: SCOPED_PROTOCOL_NO_GO_no_alpha
    - id: STOP-NO-CEIL-RP
      condition: emission of ceil(r/p_L) as budget guarantee
      action: mark_invalid_interpretation
    - id: STOP-NO-SCALAR-RESCUE
      condition: temptation to publish single-number C_IC or alpha as sole proof
      action: reject_publication_path
    - id: STOP-ORACLE-LEAK
      condition: ICEX package uses p_exist without charged declared_p_lower_solve
      action: reject_icex_package
    - id: STOP-HEURISTIC-OVERCLAIM
      condition: temptation to label KN-LIT-009 exponents established
      action: reject_publication_path
    - id: STOP-CRYPTO-UPGRADE
      condition: narration upgrades toy alpha to crypto-scale IC-beats-rho
      action: mark_invalid_interpretation

  terminal_vocabulary: rank-failure-terminal-v1
  probability_gate:
    forbid: ceil(r/p_L)
    model: prespecified_stratified_fixed_iid
    p_L_source_for_ICEX: declared_p_lower_solve
    require_when_finite_tail_claimed: binomial_or_negative_binomial_tail_at_declared_alpha

  # ---------------------------------------------------------------------------
  # Activation gates (what must exist before any ICEX measurement task)
  # ---------------------------------------------------------------------------
  activation_gates:
    present_tense: blocked
    independent_verifier:
      artifact_sha256: null
      activation_gate: PRECOMMIT_VERIFIER_HASH_MISSING
    activation_blocked_until:
      - PRECOMMIT_VERIFIER_HASH_MISSING
      - PRECOMMIT_SNAPSHOT_UNVERIFIED
      - PRECOMMIT_SCHEDULE_UNSEALED
      - ICEX_PROTOCOL_REVIEW_NOT_PASSED
      - SEPARATE_COORDINATOR_LEDGER_AUTHORIZATION_MISSING
      - ECDLP_ACTIVATION_RESIDUALS_OPEN
      - SDEG_MEASUREMENT_PACKAGE_MISSING   # C_decomp (+ matched C_rho/C_bsgs)
      - MONO_MEASUREMENT_PACKAGE_MISSING  # admissible outcome_id package
      - RELN_MEASUREMENT_PACKAGE_MISSING  # declared_p_lower_solve package
      - FEED_DIGEST_BINDINGS_UNSEALED
    requires_all_of_before_measurement_task:
      - id: GATE-ICEX-RT-PASS
        requirement: independent red-team PASS on this TASK-20260731-021 snapshot
      - id: GATE-COORD-AUTH
        requirement: separate Coordinator ledger authorization decision_id
      - id: GATE-SDEG-DATA
        requirement: >-
          Committed SDEG measurement package with per-cell C_decomp,
          matched C_rho/C_bsgs, certificates — not merely DEC-20260725-015
      - id: GATE-MONO-DATA
        requirement: >-
          Committed MONO census outcome package with admissible outcome_id
          — not merely DEC-20260725-027
      - id: GATE-RELN-DATA
        requirement: >-
          Committed RELN package exporting declared_p_lower_solve per stratum
          — not merely DEC-20260725-017
      - id: GATE-FIXTURES
        requirement: concrete public fixtures hash-bound per ICEX cell
      - id: GATE-SCHEDULE-SEAL
        requirement: sealed schedules with embedded resource schema and primary_coordinate
      - id: GATE-VERIFIER-HASH
        requirement: independent_verifier_artifact_sha256 non-null
      - id: GATE-PRECOMMIT
        requirement: precommit verified_before_execution true
      - id: GATE-ECDLP-RESIDUALS
        requirement: >-
          ECDLP activation residuals closed or named Coordinator amendment
          with equal hardness
    explicit_non_authorization: >-
      This design card authorizes zero runs. Protocol PASS ≠ measurement ≠
      crypto-scale. G4–G6 protocol PASSes unblocked only this design task;
      they do not activate ICEX execution.

  # ---------------------------------------------------------------------------
  # Schedule obligations
  # ---------------------------------------------------------------------------
  schedule_obligations:
    mode: future_executable_requires_seal
    seal_before_activation: true
    precommit_fields_currently_null_by_design:
      - coordinator_snapshot_receipt_path
      - snapshot_commit_sha
      - snapshot_parent_sha
      - independent_verifier_artifact_sha256
    empty_or_pilot_note: >-
      This task does not freeze a sealable empty/pilot schedule JSON.
      End-to-end measurement schedules are deferred to a post-PASS executor
      batch after feed measurements exist. Non-authorization is present-tense
      and hard-gated.

  # ---------------------------------------------------------------------------
  # Outcome packages (after future measurement — none exist now)
  # ---------------------------------------------------------------------------
  outcome_packages:
    - outcome_id: TOY_ALPHA_CI_EXCLUDES_HALF
      meaning: >-
        PRED-ALPHA-EXCLUDES-HALF-TOY holds at sealed cells. Toy-scope only;
        may motivate a separate medium-scale trend gate — never crypto claim.
      attack_content: none_at_crypto_scale
    - outcome_id: TOY_ALPHA_CI_INCLUDES_HALF
      meaning: >-
        Primary CI includes 1/2 or baseline dominance blocks advantage.
        Closes current charged pipeline's toy advantage claim within scope.
      attack_content: none_claimed
    - outcome_id: TOY_ALPHA_UNDEFINED
      meaning: R_gain=0 or incomplete end-to-end solve path; no alpha claim.
      attack_content: undecided
    - outcome_id: SCOPED_PROTOCOL_NO_GO
      meaning: >-
        Missing feeds, failed controls, or activation gates. Propagate named
        obligation; do not mint alpha.
      attack_content: undecided

  # ---------------------------------------------------------------------------
  # Post-PASS executor gate
  # ---------------------------------------------------------------------------
  post_pass_executor_gate:
    after_protocol_review_pass_allows: schedule_later_design_or_wait_for_feeds_only
    does_not_allow:
      - immediate_execution
      - hypothesis_status_change
      - medium_tier_upgrade
      - crypto_scale_IC_beats_rho
      - promotion_of_KN-LIT-009_to_established
      - ICEX_measurement_without_feed_data
    executor_admission_requires_all_of:
      - independent_red_team_PASS_on_this_snapshot
      - coordinator_ledger_authorization_decision_id
      - sdeg_measurement_package_with_C_decomp_and_matched_baselines
      - mono_measurement_package_with_admissible_outcome
      - reln_measurement_package_with_declared_p_lower_solve
      - concrete_public_fixtures_hash_bound_per_cell
      - sealed_schedules_with_resource_schema_and_primary_coordinate
      - independent_verifier_artifact_sha256_non_null
      - precommit_verified_before_execution_true
      - ecdlp_activation_residuals_closed_or_named_amendment

  exactly_one_recommended_next_action: >-
    Archive these two TASK-20260731-021 artifacts through TASK-20260731-022
    and submit only that immutable snapshot to independent red-team review;
    authorize no implementation, measurement, or solver campaign. Keep ICEX
    non-executing until charged SDEG/MONO/RELN measurement packages exist.
