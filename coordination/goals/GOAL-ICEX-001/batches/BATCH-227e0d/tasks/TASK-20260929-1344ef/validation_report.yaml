  findings:
    - id: G-1
      severity: must_fix_before_run
      check: 11
      summary: >-
        An orphaned cell child survives a driver SIGKILL and writes into an
        abandoned run.
      detail: >-
        run_cell_process uses subprocess.run without any parent-death binding
        (driver.py:427-440). After SIGKILL of the driver, the cellrun child
        (reparented) finished and wrote result.json, while manifest.yaml stays
        'running' indefinitely. In a real run this is an unrecorded
        frozen-namespace computation that continues after the run record died,
        and the stale 'running' manifest keeps satisfying the cellrun guard
        (G-2).
      remedy: >-
        In cellrun, record os.getppid() at start and run a daemon watchdog
        thread (or a check inside the existing per-level mem_guard hook) that
        calls os._exit(8) without writing result.json once the parent pid
        changes or dies.
        Launch children with start_new_session=True, and on every driver exit
        path os.killpg the child's group and wait.
        Have the driver record its pid in the manifest; cellrun then refuses
        unless os.getppid() equals that pid.
        Add a test that SIGKILLs a driver running a synthetic long cell and
        asserts the child is gone and wrote nothing.
    - id: G-2
      severity: must_fix_before_run
      check: 6
      summary: >-
        The cellrun guard accepts a hand-written 'running' manifest, so FX-4 is
        not fully closed.
      detail: >-
        admission_guard (cellrun.py:47-69) checks the decision and the manifest
        status, decision and namespace fields only. Anyone holding an admitted
        decision can write that YAML anywhere and run frozen cells outside the
        driver. This was shown with the guard function and a valid committed
        decision in a temporary repo.
      remedy: >-
        Require:
          - RUN_DIR under experiments/EXP-ICEX-aaccfc/runs/ with a RUN-* name;
          - a manifest driver pid equal to os.getppid() that is alive;
          - a manifest code.commit equal to HEAD;
          - a per-run nonce the driver writes into the manifest and passes in
            the child environment, which must match.
        Add a test with a hand-written manifest that is refused.
    - id: G-3
      severity: must_fix_before_run
      check: 8
      summary: >-
        The snapshot receipt need not be committed, archived or genuine.
      detail: >-
        verify_snapshot (driver.py:288-337) accepts a receipt outside the repo
        and a hand-written receipt listing the current hashes. The clean-tree
        and pin checks guarantee the code is committed, but not that it is the
        Coordinator-archived snapshot.
      remedy: >-
        Require the receipt path to be inside the repo under
        coordination/goals/*/batches/*/archives/TASK-*/snapshot-receipt.json,
        tracked, and clean at HEAD. Require its task_id to equal the snapshot
        task named in the admission decision (TASK-20260929-8428ad or a
        successor), or require its content-binding commit (located by
        message) to be an ancestor of HEAD. Record the check in
        inputs.snapshot_verification and add tests.
    - id: G-4
      severity: must_fix_before_run
      check: 11
      summary: >-
        An exception before the first manifest leaves an unclassified run
        directory.
      detail: >-
        In execute(), run_dir is created and command.txt written before
        RunRecord exists (driver.py:554-572). If environment_info(), git_state()
        or RunRecord construction raises, the finally block writes nothing
        (rec is None). The result is a runs/<RUN-ID>/ with no manifest or
        raw-result, and the run id can never be reused.
      remedy: >-
        Write a minimal manifest immediately after mkdir, before anything
        fallible: run.id, experiment_id, status running, started_at and command.
        In the except path, when rec is None, write a minimal manifest with
        status failed_infrastructure, the traceback and an empty raw-result.json.
        Add a test that injects a failure into environment_info.
    - id: G-5
      severity: advisory
      check: 7
      summary: >-
        cellrun accepts a smoke-namespace task naming a frozen fixture by bits
        and seed.
      detail: >-
        task_fixture refuses inline frozen fixtures but not {bits: 16, seed: 21}
        with namespace 'smoke|...'. This is what the accepted OQ-18 tests do, but
        an ad-hoc smoke cell could re-create the F-5 preview and persist it.
      remedy: >-
        Refuse frozen bits and seed in cellrun unless the namespace starts with
        'smoke|EXP-ICEX-aaccfc/v2|tests' and no result is persisted, or document
        this as accepted under OQ-18.
    - id: G-6
      severity: advisory
      check: 3
      summary: >-
        ADMIT_DECISIONS includes the generic 'approve'.
      detail: >-
        Permitted by the FX-1 wording. OQ-16 fixes the admission decision as
        'admit_execution'. Other checks (an execution_admission block with
        currently_admitted true) still bind.
      remedy: >-
        Optionally narrow ADMIT_DECISIONS to ('admit_execution',) now that OQ-16
        is ruled.
    - id: G-7
      severity: advisory
      check: 2
      summary: >-
        A failing frozen-fixture unit test would display values.
      detail: >-
        pytest assertion rewriting prints operand values on failure (for example
        s1['units'] comparisons in test_charging).
      remedy: >-
        Wrap frozen-fixture assertions in a helper that re-raises without
        operand values, or run those tests with --tb=no -q in CI.

