      most_literal_reading:
        reading: >-
          S_i = h_i * G with h_i = SHA256("EXP-ICEX-aaccfc/v2|heldout|16|21|<i>")
          read as a big-endian integer, then h_i mod N, for i = 0..255. The
          v2 prefix and the <bits>|<seed>|<index> argument order are taken
