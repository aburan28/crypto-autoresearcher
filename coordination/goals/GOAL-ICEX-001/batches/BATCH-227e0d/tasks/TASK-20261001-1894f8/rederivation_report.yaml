    stage_2_population_exact:
      description: >-
        Independent of how the held-out points are sampled. This is exact over
        every S != O in E(F_p), computed by enumerating F + F (36 ordered
        pairs). A "pair hit" is an ordered (S, P1) with P1 in F,
        S - P1 != O and x(S - P1) < B, which means S - P1 lies in F.
      distinct_S_in_F_plus_F_excluding_O: 18
      fraction_of_S_with_any_hit: 2.95955e-4      # 18 / 60820
      ordered_pair_hits_over_all_S: 30            # 36 ordered sums minus 6 that equal O (P1 = -P2)
      expected_pair_hits_per_S: 4.93259e-4        # 30 / 60820
      expected_per_test_hit_rate: 8.22098e-5      # 30 / (60820 * 6)
      implied_for_256_points:
        expected_points_with_any_hit: 0.0758
        P_zero_points_hit: 0.927
        P_one_point_hit: 0.070
        P_two_or_more_points_hit: 0.0027
      tests_per_S_full_scan: 6                    # one x(S - P1) < B test per P1 in F (both signs)
      mean_tests_per_S_early_stop: "about 6 (5.98-6.00 across every reading below)"

    stage_2_held_out_256:
      headline: >-
        The exact count cannot be re-derived uniquely, because the held-out
        hash rule is underdetermined (finding U-2). Across all 28 readings
