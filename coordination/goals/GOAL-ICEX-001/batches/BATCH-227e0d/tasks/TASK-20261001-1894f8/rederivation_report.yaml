  comparison_rule_for_the_run:
    agrees_if:
      - The run's fixture 0 has B = 10, L = 3 (x-classes {1, 4, 9}) and |F| = 6 points.
      - The run's stage-2 charged tests are 6 per held-out point (1536 over 256) under a full scan.
      - >-
        The run reports 0 or 1 held-out points with a hit (0 to 2 pair hits).
        This is the 99.7% range under the exact population rate of 18/60820
        per point.
    breaks_if:
      - B, L, |F| or the factor-base x-classes differ from the values above.
      - >-
        The run reports 2 or more hitting points out of 256 (P about 0.0027
        under the exact population rate), or a pair hit that is not in the
        30 ordered representations enumerated here.
      - >-
        The run's exact count differs from the count under its own declared
        hash rule. Check this once the run's rule is disclosed, by re-running
        rederive_j3.py with that rule added as a reading.

  underdetermination_findings:
    - id: U-1
      topic: which fixture is "index 0"
      quoted: "fixture index 0 of ic_leads_fixtures_v2.json (review plan / card)"
      issue: >-
        The file's top level is a JSON object keyed by experiment, not a list.
        Its first entry in file order is EXP-ECDLP-c74a83 seed 51. C-1 freezes
        "the 'EXP-ICEX-aaccfc' entries", so this report uses
        EXP-ICEX-aaccfc[0] (bits 16, seed 21).
      alternatives:
        - "EXP-ICEX-aaccfc[0] (used)"
        - "first entry of the first key: EXP-ECDLP-c74a83 seed 51 (not computed; outside C-1)"
      severity: low
    - id: U-2
      topic: held-out point labels and hash rule
      quoted: >-
        "over 256 held-out points S per fixture (drawn '.../heldout|...')"
        (AMD-20260926-ced670 C-4 stage_2_alpha2); and specification
        seed_rule: "SHA256 of UTF8 EXP-ICEX-aaccfc/v1|label|args; rejection
        sampling for uniform draws".
      issue: >-
        The label is elided at both ends. The protocol text does not fix:
        (a) the prefix version, since the spec says /v1 while C-4's attempt
        label uses /v2; (b) the argument list and its order, and whether the
        index starts at 0 or 1; (c) how a digest becomes a uniform draw. The
        spec says "rejection sampling" but not the bit width, the top-bit vs
        low-bit choice, the retry-counter format, or whether 0 is excluded;
        (d) what is drawn: a scalar h with S = h*G, or a random x lifted with
        a sign rule; (e) whether S = O or S in F is excluded or redrawn.
        A third party therefore cannot reproduce the exact 256-point count
        from the protocol text alone. 28 readings were computed (above).
      alternatives: see all_readings
      severity: >-
        Medium for reproducibility. Low for the science: every reading gives
        0 or 1 hits, consistent with the exact population rate 2.96e-4.
    - id: U-3
      topic: the unit charged per test
      quoted: >-
        Review plan: "1 unit per x(S - P1) < B test". AMD-20260926-ced670 C-3:
        "affine point addition = 13 units; hash probe = 1 unit".
      issue: >-
        Each test needs the point subtraction S - P1, an affine addition that
        C-3 charges at 13 units, plus a comparison that C-3 does not price.
        Under the plan's unit, the charged work is 6 units per held-out point.
        Under C-3 it is 78 units per point plus any comparison charge. The
        stage-2 "charged work" entering alpha2 differs by a constant factor
        depending on which applies. A constant factor does not change the
        alpha2 slope, but it does change the absolute charged figure.
      severity: low
    - id: U-4
      topic: what "hit fraction" and "mean" denote
      quoted: >-
        "the stage-2 test outcome ... mean over the 256 held-out points"
        (review plan); C-4 defines alpha2 as a slope of log(charged work) vs
        log L, not as a hit rate.
      issue: >-
        The protocol defines no stage-2 "hit fraction". Possible readings:
        (i) the fraction of held-out S with at least one P1 hit, i.e. S in
        F+F; (ii) the fraction of the 6*256 tests that hit; (iii) the mean
        charged tests per S (6 under a full scan; about 6 under early stop,
        because hits are rare). All three are reported above.
      severity: low
    - id: U-5
      topic: the meaning of S, P1 and e1, e2
      quoted: '"is S = e1*P1 + e2*P2 with P1, P2 in F" ... "P1 over F, test x(S - P1) < B"'
      issue: >-
        The text does not define e1 and e2. Read as signs in {+1, -1}, they are
        absorbed because F is closed under negation (F = {P : x(P) < B}
        contains both P and -P). That is the reading used: P1 ranges over all
        6 points, and P1 = P2 is allowed, so doublings count. If e1 and e2 were
        meant as arbitrary small scalars, the test is different and
        x(S - P1) < B would not decide it. Also undefined: whether S - P1 = O
        (S in F) counts as a hit. It was counted as a miss; no held-out S in
        any reading equalled a factor-base point in a way that changed a count.
      severity: low
    - id: U-6
      topic: "B rule: p versus q, and strict versus non-strict"
      quoted: "C-2 'B = ceil(p^{1/5})'; review plan 'B ~ q^{1/5}'; 'x(P) < B'"
      issue: >-
        The two wordings differ, but both give B = 10 for this fixture, and
        "<= B" adds nothing because x = 10 does not lift. No effect here; it
        could matter on other fixtures.
      severity: none for fixture 0

