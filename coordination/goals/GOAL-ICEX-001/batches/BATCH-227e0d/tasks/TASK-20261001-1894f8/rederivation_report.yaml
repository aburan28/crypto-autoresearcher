        points_with_any_hit: 0
        fraction_points_with_any_hit: 0.0
        pair_hits: 0
        tests: 1536
        per_test_hit_fraction: 0.0
        mean_tests_per_point: 6.0
      all_readings:   # points_with_any_hit / pair_hits / tests
        "S=h*G|v2|i from 0|h mod N": [0, 0, 1536]
        "S=h*G|v2|i from 0|1 + h mod (N-1)": [0, 0, 1536]
        "S=h*G|v2|i from 0|rejection top-16-bits, label|c for c>=0": [0, 0, 1536]
        "S=h*G|v2|i from 0|rejection low-16-bits, label|c for c>=0": [0, 0, 1536]
        "S=h*G|v2|i from 0|rejection top-16-bits, bare label at c=0": [1, 1, 1536]
        "S=h*G|v2|i from 0|rejection low-16-bits, bare label at c=0": [0, 0, 1536]
        "S=random x lift|v2|i from 0": [0, 0, 1536]
        "S=h*G|v2|i from 1|h mod N": [0, 0, 1536]
        "S=h*G|v2|i from 1|1 + h mod (N-1)": [0, 0, 1536]
        "S=h*G|v2|i from 1|rejection top, label|c": [0, 0, 1536]
        "S=h*G|v2|i from 1|rejection low, label|c": [0, 0, 1536]
        "S=h*G|v2|i from 1|rejection top, bare c=0": [1, 1, 1536]
        "S=h*G|v2|i from 1|rejection low, bare c=0": [0, 0, 1536]
        "S=random x lift|v2|i from 1": [0, 0, 1536]
        "S=h*G|v1|i from 0|h mod N": [0, 0, 1536]
        "S=h*G|v1|i from 0|1 + h mod (N-1)": [0, 0, 1536]
        "S=h*G|v1|i from 0|rejection top, label|c": [0, 0, 1536]
        "S=h*G|v1|i from 0|rejection low, label|c": [0, 0, 1536]
        "S=h*G|v1|i from 0|rejection top, bare c=0": [1, 1, 1536]
        "S=h*G|v1|i from 0|rejection low, bare c=0": [1, 2, 1536]
        "S=random x lift|v1|i from 0": [0, 0, 1536]
        "S=h*G|v1|i from 1|h mod N": [0, 0, 1536]
        "S=h*G|v1|i from 1|1 + h mod (N-1)": [0, 0, 1536]
        "S=h*G|v1|i from 1|rejection top, label|c": [0, 0, 1536]
        "S=h*G|v1|i from 1|rejection low, label|c": [0, 0, 1536]
