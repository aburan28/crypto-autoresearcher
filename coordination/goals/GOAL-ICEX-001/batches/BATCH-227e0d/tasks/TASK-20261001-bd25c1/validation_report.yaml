  proves_too_much:
    verdict: breaks_at_run_noise
    verdict_detail: >-
      The frozen exponent/CI/verdict code is correct as a computation: it recovers
      planted laws exactly without noise and behaves well at low noise. At the
      scatter this run actually shows, it has almost no power. A planted 0.40 is
      detected (CI upper < 0.5) in about 9% of replicates, and a planted 0.60 gets a
      favourable exclusion in 1.5-4.4%. By the plan's failure signature, a negative
      or inconclusive verdict from this pipeline at this noise level is
      uninformative about 0.40 vs 0.60. It also manufactures favourable exclusions
      on 0.60 at a low but nonzero rate. This is a property of the frozen design
      (two sizes, six points, percentile bootstrap over fixtures). It is not an
      implementation defect, and it does not change J1.
    method: >-
      proves_too_much.py imports the frozen analysis.py read-only (sys.dont_write_bytecode;
      PYTHONDONTWRITEBYTECODE=1; `git status --short experiments/` was empty before and
      after). It builds synthetic primary tables cost_f = C * q_f^beta * exp(eps_f) on the
      six frozen fixtures' q and bit groups and passes them end-to-end through
      analysis.analyse (frozen OLS, frozen-seed 2000-resample percentile bootstrap,
      frozen C-5 rule). C puts the ratio below 1 at 20 bits, so the ratio clause never
      masks the CI clause. Noise: lognormal at sigma 0.05/0.10/0.20/0.779 (0.779 is the
      run's residual SD), 400 replicates each, seed
      'TASK-20261001-bd25c1|proves-too-much'; plus all 720 permutations of the run's
      own six log-residuals. Command: `TMPDIR=/Volumes/SSD990/.tmp-agent
      PYTHONDONTWRITEBYTECODE=1 nice -n 10 python3 <task>/proves_too_much.py
      <task>/proves_too_much_out.json` (exit 0, 121 s).
    object_planted_exponent:
      noiseless:
        beta_0.40: {exponent: 0.40001, ci95: [0.39989, 0.40010], verdict: sub_rho_signal}
        beta_0.50: {exponent: 0.50005, ci95: [0.49989, 0.50013], verdict: inconclusive}
        beta_0.60: {exponent: 0.60006, ci95: [0.59991, 0.60015], verdict: scoped_negative}
        beta_0.40_at_run_cost_level: {verdict: inconclusive, reason: "ratio clause (ratio >> 1), CI excludes 0.5"}
      ci_upper_below_0.5_rate_on_beta_0.40: {sigma_0.05: 0.925, sigma_0.10: 0.755, sigma_0.20: 0.3375, sigma_0.779_run: 0.095, run_residual_permutations: 0.0889}
      favourable_exclusion_rate_on_beta_0.60: {sigma_0.05: 0.0, sigma_0.10: 0.0, sigma_0.20: 0.0025, sigma_0.779_run: 0.015, run_residual_permutations: 0.0444}
      false_favourable_rate_on_beta_0.50_nominal_0.025: {sigma_0.05: 0.0475, sigma_0.10: 0.0625, sigma_0.20: 0.06, sigma_0.779_run: 0.0475, run_residual_permutations: 0.0861}
      false_negative_rate_on_beta_0.50_nominal_0.025: {sigma_0.05: 0.0625, sigma_0.10: 0.0525, sigma_0.20: 0.07, sigma_0.779_run: 0.0475, run_residual_permutations: 0.0875}
      structural_cause: >-
        Exact enumeration: 1,452 of 46,656 fixture resamples (3.11%) draw only from one
        bit group, without being all one index. They estimate the slope over a log-q
        range of 0.303 (16-bit) or 0.481 (20-bit) instead of the 2.487 gap between
        groups. Their share exceeds each 2.5% percentile tail, so with any noise both
        CI endpoints are set by within-group slopes. This explains the run's
        [0.106, 2.317] width, and why one-sided error is about 5-9% rather than the
        nominal 2.5%.
    object_matched_rho:
      walk_units: {exponent: 0.50990, ci95_frozen_bootstrap_code: [0.45294, 0.57540], ci95_exact: [0.43826, 0.57277], holds: true}
      total_measured_units_incl_precompute: {exponent: 0.18764, ci95_frozen_bootstrap_code: [0.16872, 0.20485], ci95_exact: [0.16884, 0.20434]}
      precompute_share_of_measured_rho_units: {b16-s21: 0.857, b16-s22: 0.845, b16-s23: 0.858, b20-s21: 0.660, b20-s22: 0.704, b20-s23: 0.647}
      reading: >-
        Matched rho's walk cost returns about 1/2, as it should, so object 2 holds on
        the walk. On the full charged rho cost, the frozen exponent code returns 0.19
        with a CI excluding 1/2 favourably. The cause is the per-target 32-point
        jump-table precompute (65-86% of measured units), a fixed overhead that
        flattens the 16-20-bit slope. The fit therefore reports a sub-1/2 exponent
        for a method known to be Theta(sqrt q). This does not enter the C-5 verdict,
        which divides by the frozen 13*0.886*sqrt(q), not measured rho. It does show
        that the 16-20-bit exponent statistic can be confounded by fixed overheads.
        This is a pointer for J2; I adjudicate no scope.

  findings:
    - id: F-1
      severity: major (design; non-blocking for J1)
      detail: >-
        Proves-too-much. At the run's own residual scatter (SD 0.779 in log cost), the
        frozen C-5 pipeline detects a planted exponent of 0.40 in about 9% of
        replicates, and gives favourable exclusions on planted 0.60 (1.5-4.4%) and
        planted 0.50 (4.75-8.6%, nominal 2.5%). The run's inconclusive verdict
        therefore carries little information about the exponent, and a hypothetical
        sub_rho_signal from this design would have been weak too. Cause: the
        accepted OQ-8 fixture-level percentile bootstrap over six points at two
        sizes, where 3.11% of resamples are single-bit-group slopes. Remedy, for a
        future amendment only (never retroactive): more field sizes or a resampling
        unit stratified by bit group.
    - id: F-2
      severity: minor (interpretive pointer, not a run defect)
      detail: >-
        The frozen exponent code applied to matched rho's full charged cost returns
        0.188 [0.169, 0.205]. The fixed jump-table precompute dominates at 16-20 bits,
        so the exponent statistic can manufacture a sub-1/2 slope from fixed overheads
        at toy scale. On walk units, rho returns 0.510 [0.453, 0.575]. The C-5 verdict
        does not use measured rho, so the run's result is unaffected.
    - id: F-3
      severity: info
      detail: >-
        The 2000-draw Monte Carlo CI [0.106, 2.317] differs from the exact ideal
        bootstrap CI [0.102, 2.410] by Monte Carlo error. The verdict is the same
        under both.
    - id: F-4
      severity: minor
      detail: >-
        G-2 (HEAD == code.commit at every cell launch) is enforced fail-closed in
        cellrun.admission_guard, but HEAD per cell launch is not logged. Compliance
        is inferred from 30/30 ok statuses plus the pinned guard code, not read from
        a per-cell record. Recording HEAD per cell would make G-2 directly auditable.
    - id: F-5
      severity: info
      detail: >-
        The run snapshot receipt has commit_sha null (binding_mode content_at_commit).
        I identified the snapshot commit b19c73228d by message and parent and verified
        it by content. The run worktree also held the untracked RUN-RELN-a695fe
        package (manifest status_porcelain). That does not affect HEAD, the
        implementation hashes, or the deterministic unit counts, but wall-clock
        seconds may reflect shared load.
    - id: F-6
      severity: info
      detail: >-
        The manifest inference block is null/unverified, as disclosed in advance in
        DEC-20260929-47a574 procedure_deviations.
  blocking_findings: none
  must_fix_findings: none for J1. F-1 is a design limitation that the claim's interpretation must carry; it is not a repair of this run.

  limitations:
    - Certificates were sampled (30 relations of the primary+null pool, 24 of 96 descents); rho solutions were not re-verified by me beyond the recorded k_true_matches.
    - FX-A figures, the stage-2 membership rate (J3) and the scope or interpretation of the verdict (J2) are outside this joint and were not adjudicated.
    - The synthetic noise model (iid lognormal, or a permutation of the six observed residuals) is an assumption; the per-fixture variance structure of the real pipeline may differ.
    - A passed J1 makes the receipt admissible evidence. It does not support any claim about H-ICEX-d8e858 beyond what the frozen C-5 rule returns.

