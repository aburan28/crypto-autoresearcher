        - >-
          Bare configs: (d) leaks in all 6 runs, so the probe is sensitive.
          (c) is clean in all 6, because the repr is truncated before
          complete_units. (b) is clean on 3.12.8/9.1.1 (truncated) but leaks
          on 3.9.10/8.4.2 (hash and regex). See I-1.
          This confirms the executor's remark that pytest's truncation is
          version-dependent.
