  findings:
    - id: I-1
      severity: advisory
      check: 3
      summary: >-
        Under a bare pytest config, a plain copy of smoke_primary passed to a
        helper can print complete_units (version-dependent).
      detail: >-
        HiddenResult protects the fixture object, but json.loads(json.dumps(...))
        copies are plain dicts:
          - test_charging._receipt, whose result goes to audit.audit_run;
          - test_fxa, via r = json.loads(json.dumps(smoke_primary)).
        When an exception is raised inside a function that receives such a
        copy, the default long traceback prints its arguments. Only saferepr
        truncation then stands between the reader and complete_units: it held
        on Python 3.12.8 / pytest 9.1.1 but not on Python 3.9.10 / pytest 8.4.2
        (probe (b)).
        The committed pytest.ini closes this for the documented invocation
        (repo root or implementation dir). It reappears only when someone
        overrides the ini (-o addopts=, -c).
      remedy: >-
        Make the traceback style non-bypassable, for example a conftest
        pytest_configure hook that sets config.option.tbstyle = 'short' when
        it is 'auto' or 'long'. Or re-wrap roundtrip copies in HiddenResult
        (json.loads(..., object_hook=HiddenResult)).
        Extend test_fixture_repr with a helper-frame probe over a plain copy.

