  findings:
    - id: H-1
      severity: must_fix_before_run
      check: 7
      summary: >-
        A-3 is not closed: a failing frozen-fixture test prints frozen cost
        fields through pytest's funcarg display.
      detail: >-
        With the default --tb=auto (long for the test frame), pytest shows the
        test function's arguments. Twelve tests take the smoke_primary
        fixture, which holds frozen b16-s21 results:
          - test_charging.py lines 138-227 (8 tests);
          - test_controls.py lines 17, 27, 34;
          - test_fxa.py line 64.
        Any failure in these (assert or exception) prints the fixture's dict,
        including complete_units, which is the F-5 preview of a verdict input.
        PYTEST_DONT_REWRITE only removes assertion introspection; it does not
        cover this channel.
        The executor's probe (test_frozen_fixture_test_modules_disable_assertion_rewriting)
        only tests a local variable, so it cannot see this. The repair report's
        closure claim for A-3 is therefore not supported.
      remedy: >-
        Make a non-long traceback the default for this suite, for example
        implementation/pytest.ini with addopts = --tb=short -p no:cacheprovider
        (verified: short, native and line all hide the value). Or, more
        robustly, have smoke_primary return an object with a non-revealing
        __repr__.
        Extend the A-3 probe to use a failing test that takes a fixture
        argument, and assert that the value is absent.
        Note that -l/--showlocals would still print values; document that.
    - id: H-2
      severity: advisory
      check: 4
      summary: >-
        parent_is_driver accepts any parent whose argv mentions this
        implementation's driver.py.
      detail: >-
        cellrun.parent_is_driver checks `any(...)` over the whole cmdline.
        Demonstrated in the temp repo with the committed stand-in decision and
        a guard-only child, with no computation: a plain Python parent that
        wrote a self-consistent hand-written manifest (its own pid, the hash of
        a token it chose, commit = HEAD) and passed <impl>/driver.py as an
        extra argv element was admitted by admission_guard. Without that argv
        element it was refused.
        This is deliberate forgery. No accidental or careless path passes, and
        an in-repo guard cannot stop a determined local actor anyway.
      remedy: >-
        Require the driver script at the interpreter's script position (for
        example cmdline[1] resolves to driver.py and cmdline[0] is a Python
        executable), and state in implementation.md that the guard prevents
        mistakes, not forgery.
    - id: H-3
      severity: advisory
      check: 5
      summary: >-
        A committed hand-written receipt under any archives/TASK-*/ directory
        is accepted.
      detail: >-
        check_receipt_file verifies location, task_id-to-directory match,
        tracking, cleanliness and HEAD identity. Nothing ties the receipt to
        the Coordinator's snapshot task. A receipt listing the current hashes,
        committed at archives/TASK-20260929-abcdef/, passed in the temp repo.
        Committing is a durable, auditable act, and the pin and clean-tree
        checks already guarantee the code equals the committed tree. The
        residual is provenance only.
        This is narrower than the remedy option offered in VAL-20260929-1344ef
        G-3 (task_id equal to the snapshot task named in the admission
        decision).
      remedy: >-
        When DEC-20260929-47a574 restates the admission snapshot, have the
        driver require the receipt's task_id to equal the snapshot task named
        there (or its execution_admission block), and record it in
        inputs.snapshot_verification.

