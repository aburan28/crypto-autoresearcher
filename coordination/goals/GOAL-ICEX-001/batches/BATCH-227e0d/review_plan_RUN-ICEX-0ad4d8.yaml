# Review plan for RUN-ICEX-0ad4d8 (EXP-ICEX-aaccfc, protocol v4).
# Written by the coordinator 2026-10-01, BEFORE any reviewer of this round runs
# and BEFORE the coordinator opened metrics.json, audit.json, fxa_nonverdict.json
# or any per-cell value. The coordinator has seen only: driver exit 0,
# raw-result status completed_valid, 30/30 cells status ok, zero
# procedure_defects, and fixture_reproduction byte_identical true.
review_plan:
  claim_under_review: >-
    Whatever EXP-ICEX-aaccfc v4's frozen analysis returns on RUN-ICEX-0ad4d8
    (metrics.json / audit.json as written by the driver pinned by snapshot
    receipt TASK-20260929-a7f89b): either a toy complete-cost exponent whose
    CI excludes 1/2 under matched rho, or a scoped negative naming the
    dominant stage. Scope: six frozen fixtures (ic_leads_fixtures_v2.json),
    30 cells, m in {5,6,8}, B ~ q^{1/5}, the Mac, one worker. Claim tier: toy.
  coordinator_prior: >-
    Recorded before any result value was seen. I expect J1 to PASS. On the
    science, I expect a scoped negative with the CI not excluding 1/2
    favourably. My guess is that the dominant stage is stage-1 relation
    collection or the descents rather than linear algebra. My rough split is
    CI excludes 1/2 below 0.10, scoped negative 0.70, inconclusive/undecidable
    0.20. I expect the red team to attack the matched-rho baseline
    (13*0.886*sqrt(q) frozen, versus a measured rho), the 13-unit
    flat point-addition charge (OQ-1), and the exponent fit over a narrow
    16-20-bit range.
  joints:
    - joint: >-
        J1 run integrity and statistic reproduction: admission, trial-plan,
        amendment, fixture and snapshot hashes; C-7 at launch; code.commit ==
        HEAD at every cell (G-2); 30/30 cells ok with certificates for every
        relation and descent; held-out alpha2 gate; the complete-cost exponent,
        its bootstrap CI and the dominant-stage call reproduced from per-cell
        raw results by an independent re-computation of the frozen statistic.
      assigned_to: TASK-20261001-bd25c1
      attack_plan: >-
        From the specification + AMD-20260926-ced670 + AMD-20260929-143d11 +
        AMD-20260929-5a84eb definitions (C-3 unit charging, C-5 bootstrap,
        OQ-8 resampling), write your own script. Recompute complete_units per
        fixture, the OLS exponent, the percentile CI and the dominant stage
        from the per-cell result files, then diff against metrics.json.
        Re-verify a random sample of at least 20 relation and descent
        certificates by direct group arithmetic. If it breaks anywhere, I
        expect it to be in the bootstrap resampling unit (fixture vs attempt)
        or in charging of failed attempts.
      breaking_artifact: a statistic or certificate where recomputation disagrees with metrics.json/audit.json beyond bootstrap noise
    - joint: >-
        J2 interpretation and scope: does the verdict follow for
        H-ICEX-d8e858, and what does it close?
      assigned_to: TASK-20261001-d367dd
      attack_plan: >-
        (a) Using the run's own per-stage costs, show whether the dominant
        stage is intrinsic to the method or an artifact of a frozen choice
        (B rule, m set, 13-unit flat charge, fresh double-and-add R_j per
        OQ-13; compare the non-verdict FX-A incremental figure). (b) Check
        whether matched rho (frozen 13*0.886*sqrt(q)) versus the measured
        rho cells changes the comparison. (c) Check whether the 16-20-bit
        range is long enough to separate exponent 1/2 from a nearby value.
        (d) Name the obstruction quantity with units and run the
        resource_check reversal question. (e) Give forward guidance: the
        smallest change the data does not rule out.
      breaking_artifact: a computation from the run's data showing the verdict flips under a defensible alternative charge or baseline
    - joint: >-
        J3 blind re-derivation of the stage-2 factor-base pair-output
        membership rate for fixture index 0 (see blind_rederivation).
      assigned_to: TASK-20261001-1894f8
      attack_plan: see blind_rederivation
      breaking_artifact: a stage-2 hit rate or alpha2 input for fixture 0 that disagrees with the run
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - >-
        Synthetic per-fixture complete-cost tables with a planted exponent of
        0.40 (and, separately, 0.60) on q, same fixtures and replicate
        structure, fed through the frozen exponent/CI code. Its CI must
        exclude 1/2 on the 0.40 object and must not report a favourable
        exclusion on the 0.60 object.
      - >-
        Matched rho itself, as a method: the frozen rho cells must return an
        exponent near 1/2.
    failure_signature: >-
      If the frozen pipeline cannot detect a planted 0.40, its negative
      verdict is uninformative. If it reports a favourable exclusion on 0.60,
      it manufactures positives.
    assigned_to: TASK-20261001-bd25c1
  blind_rederivation:
    required: true
    quantity: >-
      For fixture index 0 of ic_leads_fixtures_v2.json: the factor base at
      B = the frozen B rule (~q^{1/5}), and the stage-2 test outcome defined in
      the protocol (1 unit per x(S - P1) < B test, mean over the 256 held-out
      points labelled by the protocol hash rule). Report the factor-base size
      and the stage-2 hit fraction with its exact count.
    parameters: >-
      specification.yaml, the three amendments, IDEA-20260909-fe3e07 and
      experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json. If the
      protocol text underdetermines the held-out points or B, that is a
      finding. Report exactly where, and do not guess.
    blind_from:
      - experiments/EXP-ICEX-aaccfc/implementation/
      - experiments/EXP-ICEX-aaccfc/runs/
      - coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/archives/
      - coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/tasks/TASK-20261001-bd25c1/
      - coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/tasks/TASK-20261001-d367dd/
    assigned_to: TASK-20261001-1894f8
  procedure_deviations:
