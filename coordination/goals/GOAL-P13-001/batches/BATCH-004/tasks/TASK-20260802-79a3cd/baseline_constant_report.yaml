  baseline_currently_used_by_the_campaign: "log_2 k = 0 (T_base = p^{1/2} exactly, no constant)"
  how_to_read: "margin_corrected = margin_as_published + log_2 k. Positive log_2 k favours the attack."

  row_A_plain_delfs_galbraith:
    label: DERIVED (from the STATED law V1)
    definition: "T_base = c * p^{1/2} * log_2 p / 3 F_{p^2}-mults, c in [0.75, 1.05]"
