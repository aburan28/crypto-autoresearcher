# ===========================================================================
# 9. INTERFACE CONDITIONS - HOW ADOPTING k COULD GO WRONG
# ===========================================================================
adoption_hazards:
  - id: HZ-1
    name: double-counting against RT2-C7 / RT3-C9
    severity: high
    statement: >-
      RT2-C7's "asymmetric realism" term (plausibly 5-7 bits, pro-attack) and k
      are largely THE SAME QUANTITY seen from two sides: both say the baseline's
      per-unit work is more than one F_{p^2}-operation. Adding both to a margin
      row would count the same correction twice, and would produce a NIST-I
      margin inflated by up to 13 bits with no new evidence behind it.
    mitigation: >-
      Adopt exactly one. k is the better instrument because it is cited and
      measured rather than estimated; RT2-C7 should then be recorded as
      SUBSUMED by k rather than as an independent open term.
  - id: HZ-2
    name: unit asymmetry with the attack side
    severity: high
    statement: >-
      k is only legitimate if the ATTACK side is also charged its measured
      per-entry cost. The paper's Sec 4.1 convention charges the attack one
      F_{p^2}-operation per table entry. Adding k to the baseline while leaving
      the attack at that nominal convention makes the comparison
      measured-versus-nominal in the attack's favour - the mirror image of the
      error RT3-C9 forbade in the other direction.
    mitigation: >-
      k may be applied only to margin rows that already carry the BATCH-002/003
      corrected overhead bracket, and never to the paper's raw Sec 4.1 pairs.
  - id: HZ-3
    name: the mu convention is a choice, not a measurement
    severity: medium
    statement: >-
      Karatsuba (mu = 3) versus schoolbook (mu = 4) moves every row by 0.415
      bits. The blog does not state which convention the F_p multiplication
      counts assume, and Solver.sage was fetched and contains no counters.
    mitigation: "state mu explicitly in any record that quotes k; 0.415 bits is inside the stated bracket widths but should not be silent."
  - id: HZ-4
    name: squarings
    severity: medium
    statement: >-
      Whether the c-law's "F_p multiplications" includes squarings was not
      established. The blog elsewhere refers to counting "multiplications,
      squarings and additions" separately, which suggests it does not, in which
      case c understates the true cost and k is a LOWER bound - making the
      pro-attack shift larger, not smaller.
    mitigation: "resolve from the paper or from ExperimentAlgo0.sage / Runner.sage in the repository."

# ===========================================================================
# 10. HEURISTIC AND EXTRAPOLATION ASSUMPTIONS, NUMBERED
# ===========================================================================
extrapolation_assumptions:
  - id: E-1
    statement: >-
      The fitted form T_solver = c * p^{1/2} * log_2 p, with c confined to
      [0.75, 1.05], continues to hold at log_2 p = 256 through 768.
    measured_range: "log_2 p in [21, 40]"
    extrapolation_factor: "2^216 to 2^728 in p; a factor of 6.4 to 19.2 in log_2 p"
    rigorous_support: >-
      The log_2 p factor is the expected signature of one F_p exponentiation (a
      subfield/root test) per visited node, which is a structural feature of the
      algorithm rather than a fitting artefact, so the FORM is principled. The
      confinement of c to a 1.4x band across 20 bitlengths is empirical.
    what_would_falsify_it: >-
      Any published cost model for Delfs-Galbraith at cryptographic p whose
      implied c falls outside [0.75, 1.05] by more than the mu ambiguity. [40]'s
      cost model is the obvious place to look.
    validation_route: >-
      Run the authors' own Solver.sage at bitlengths 41-60 and refit c. This is
      their published code, the experiment is theirs, and it costs laptop time.
      It cannot reach 256 bits, and a pass at 60 bits is TOY-SCALE and must never
      be presented as validating the law at cryptographic size.
    label_on_every_derived_figure: "conditional on E-1"
  - id: E-2
    statement: >-
      s(p) is monotone increasing in p over [2^50, 2^800].
    rigorous_support: "STATED by the author: 'we see how the advantage of SuperSolver grows as p grows'. Two data points are consistent with it, plus a third single-instance point at 24 bits."
    used_for: "row B only. Row A does not use it."
    what_would_falsify_it: "a non-monotone s in any published table between 50 and 800 bits."
  - id: E-3
    statement: >-
      s(256) can be obtained by interpolating between two stated points under a
      power law or a linear-in-log_2 p law.
    rigorous_support: NONE. This is my modelling choice; the author states no functional form.
    used_for: "row C only."
    label: ESTIMATED
  - id: A-NODES
    statement: >-
      Node-coverage ratio at equal multiplication budget equals time speedup.
    rigorous_support: "the design intent of [15]; not verified, because the paper could not be read."
    used_for: "rows B and C. Row A does not use it."

