        an existing one. No lossy-projection test applies because nothing is
        being projected: k is a scalar attached to an existing cost model.
      concretely_testable: >-
        Yes, by two independent routes already named: refitting c with the
        authors' published Solver.sage, and the NC2f cross-check in section 6.
      how_far_it_survives: >-
        As far as E-1 does. The law was fitted over 20 bitlengths and is used 6
        to 19 times beyond that range in log_2 p. It survives as a functional
        form on structural grounds and as a constant band only on faith.
