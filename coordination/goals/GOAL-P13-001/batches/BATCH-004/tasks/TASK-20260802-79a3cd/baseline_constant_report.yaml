    values:
      - {log2p: 256, k_lo: 64.000, k_hi: 89.600, log2k_lo: 6.0000, log2k_hi: 6.4854}
      - {log2p: 384, k_lo: 96.000, k_hi: 134.400, log2k_lo: 6.5850, log2k_hi: 7.0704}
      - {log2p: 512, k_lo: 128.000, k_hi: 179.200, log2k_lo: 7.0000, log2k_hi: 7.4854}
      - {log2p: 640, k_lo: 160.000, k_hi: 224.000, log2k_lo: 7.3219, log2k_hi: 7.8074}
      - {log2p: 768, k_lo: 192.000, k_hi: 268.800, log2k_lo: 7.5850, log2k_hi: 8.0704}
    note: >-
      This row is the MOST DEFENSIBLE of the three: it uses only the author's
      stated law and no interpolation. It is also the WRONG baseline if the
      campaign wants the best classical attack, since [15] itself supersedes it.

  row_B_delfs_galbraith_with_supersolver_monotone_bracket:
    label: DERIVED (row A divided by the DERIVED monotone bracket on s)
    definition: "T_base = row_A / s, s in [3, 19]"
    values_at_256: {log2k_lo: 1.7521, log2k_hi: 4.9005}
    computation: "[log2(64/19), log2(89.6/3)] = [log2(3.3684), log2(29.8667)] = [1.7521, 4.9005]"
    values_at_768: {log2k_lo: 3.3371, log2k_hi: 6.4854}
    note: >-
      Honest but wide: 3.15 bits at 256 bits, 3.15 bits at 768. The width is the
      price of refusing to model s.

  row_C_delfs_galbraith_with_supersolver_interpolated:
    label: ESTIMATED (row A divided by an interpolated s; the functional form is mine)
    values:
      - {log2p: 256, s_lo: 7.62, s_hi: 9.33, log2k_lo: 2.778, log2k_hi: 3.556}
      - {log2p: 384, s_lo: 10.18, s_hi: 11.91, log2k_lo: 3.011, log2k_hi: 3.723}
      - {log2p: 512, s_lo: 12.74, s_hi: 14.15, log2k_lo: 3.177, log2k_hi: 3.814}
      - {log2p: 640, s_lo: 15.30, s_hi: 16.19, log2k_lo: 3.305, log2k_hi: 3.871}
      - {log2p: 768, s_lo: 17.86, s_hi: 18.06, log2k_lo: 3.410, log2k_hi: 3.912}
    observation:
      label: DERIVED
      text: >-
        Under row C, log_2 k is nearly FLAT across the field sizes (2.78 to 3.91
        bits, a spread of 1.13 bits over a factor of 3 in log_2 p), because the
        growth of s roughly cancels the growth of log_2 p. This is the only row
        for which the campaign's phrase "shifts EVERY margin row by the same
        amount" is approximately true, and it is the least defensible row.
    prohibition_recommended: >-
      Row C should never be a headline. If the Coordinator adopts anything, row
      A or row B, with the label attached.

  what_none_of_the_rows_include:
    - "The Õ(p^{1/4}) second phase of Delfs-Galbraith (asymptotically negligible; the author states the first step dominates - V4)."
    - "Parallelisation and interconnect, which RT-C2 and the end_to_end_baseline statement put at equal hardware budget. k is a per-unit-work constant and is orthogonal to that."
    - "Any further acceleration from [40] WayFinder or ePrint 2025/226. See section 7."

# ===========================================================================
# 5. DIRECTION - STATED PLAINLY, INCLUDING THAT IT FAVOURS THE ATTACK
# ===========================================================================
direction:
  answer: >-
    An instantiated k INCREASES the baseline's cost, therefore INCREASES every
    margin over the baseline, therefore FAVOURS THE ATTACK. Every row of the
    table is a positive number of bits added to the published margins.
  magnitude_by_row:
    row_A: "+6.00 to +6.49 bits at log_2 p = 256; +7.59 to +8.07 bits at log_2 p = 768"
    row_B: "+1.75 to +4.90 bits at log_2 p = 256"
    row_C: "+2.78 to +3.56 bits at log_2 p = 256"
  why_this_is_the_opposite_of_what_RT_S2_expected:
    rt_s2_expectation: >-
      RT-S2 framed [15] as work that "shave[s] constants ... off the p^{1/2}
      exponent's leading constant", i.e. k < 1, moving margins against the
      attack.
    what_the_retrieval_shows: >-
      k decomposes into two factors pulling in opposite directions:
      (i) the per-unit-work factor c * log_2 p / mu, which is large (64 to 89.6
      at 256 bits) because a Delfs-Galbraith step is many field multiplications,
      not one operation; and (ii) the SuperSolver acceleration s in [3, 19],
      which divides it. Factor (i) dominates by an order of magnitude, so k >> 1
      even after the acceleration.
    rt_s2_predicted_this_itself: >-
      RT-S2's own body says: "the baseline's per-step cost (an isogeny walk step)
      is itself several F_{p^2}-ops, so the comparison in 'F_{p^2}-operations'
      silently assumes DG steps cost 1 op too - an error in DG's favor". That is
      exactly right, and the retrieval quantifies it: the error is worth 6.00 to
      6.49 bits at NIST-I, and it is larger than the SuperSolver correction it
      was expected to be cancelled by. RT-S2's conclusion that "the net sign ...
      is UNKNOWN from the record" is now resolved: the net sign is positive,
      pro-attack.
  a_partial_offset_that_must_not_be_forgotten: >-
    This is only the BASELINE side. RT3-C9's symmetric point (a competent
    Delfs-Galbraith implementation walks by Velu, far cheaper than the
    instrument's Phi_2 pipeline) lives INSIDE k, not beside it: the retrieved
    law measures the authors' Solver, whose walk is Phi_2 root-finding per the
    repository README. If a Velu-based Delfs-Galbraith is cheaper still, k
    shrinks and the pro-attack shift shrinks with it. See the cross-check in
    section 6.

# ===========================================================================
# 6. A CHEAP CROSS-CHECK THIS RETRIEVAL MAKES POSSIBLE
# ===========================================================================
cross_check_against_NC2f:
  why: >-
    NC2f (BATCH-003 next-controls) pre-registers "2^5..2^7 F_{p^2}-multiplications
    per DG step at p ~ 2^40" for a Velu 2-isogeny step under the campaign's own
    instrument. The retrieved law gives a completely independent route to the
    same quantity, from a different implementation measured by different people.
    Comparing them is free and discriminating.
  the_conversion:
    label: DERIVED
    statement: >-
      Let N_steps = p^{1/2} / lambda be the expected number of Delfs-Galbraith
      walk steps to hit a subfield curve. Then
      cost_per_step = T_base / N_steps = k * lambda F_{p^2}-multiplications.
    lambda_status: NOT_RETRIEVED
    lambda_honesty_note: >-
      lambda depends on the density of subfield curves among supersingular
      curves. I did not retrieve a value for it and will not supply one from
      memory. The comparison is therefore stated as a function of lambda.
  the_comparison:
    - "lambda = 1  ->  cost_per_step = 64.0 to 89.6 = 2^6.00 to 2^6.49 F_{p^2}-mults"
    - "lambda = 6  ->  cost_per_step = 384 to 538 = 2^8.58 to 2^9.07"
    - "lambda = 12 ->  cost_per_step = 768 to 1075 = 2^9.58 to 2^10.07"
  what_each_outcome_would_mean:
    - >-
      If lambda ~ 1, the retrieved law implies 2^6.00-2^6.49 per step, which lands
      INSIDE NC2f's pre-registered 2^5..2^7 band. That would be a genuine
      independent corroboration of RT3-C9's pre-registration by a published
      implementation, obtained at zero compute cost.
    - >-
      If lambda >> 1, the implied per-step cost rises above the band, and the gap
      localises to one of three places: lambda itself, the Phi_2-versus-Velu
      difference RT3-C9 named, or an error in the mu conversion. Each is
      separately checkable.
    - >-
      Either way this does NOT reconcile with the committed C-NULL's 2^12.26 to
      2^12.32 per-step figure, which RT3-C9 already forbade citing as a
      Delfs-Galbraith per-step cost. The retrieval supports that prohibition
      independently: 2^12.3 is 3.8 to 6.3 bits above every value in the range
      above.
  cost_to_run: "retrieving lambda is one further bibliographic fetch; the arithmetic is already done here."

# ===========================================================================
# 7. RT3-C8 DISPOSITION (the Sutherland target)
# ===========================================================================
rt3_c8_disposition:
  what_RT3_C8_flagged: >-
    "UNVERIFIED RECOLLECTION, FLAGGED AND NOT RELIED ON: I believe Sutherland's
    evaluation of modular polynomials is O~(l^2) per specialisation ... I did not
    retrieve the source this session - the second batch in a row in which this
    programme has not fetched it."
  now_retrieved: true
  what_the_source_actually_says:
    - "Theorem 4: Algorithm 1 runs in expected time O(l^2 B log^2 B llog B) with B = O(l log l + log q), space O(l log q + l^2 log B), under GRH."
    - "Theorem 5: Algorithm 2 runs in expected time O(l^3 (log q + log l) log^{1+o(1)} l), space O(l log q + l log l), under GRH."
  disposition:
    verdict: PARTIALLY_CORROBORATED_AND_PARTIALLY_CORRECTED
    detail: >-
      The recollected "O~(l^2) per specialisation" is NOT what Theorem 4 states.
      Theorem 4 is O(l^2 B ...) BIT operations with B = O(l log l + log q); in the
      campaign's regime (l ~ 2^14.2, log q ~ 512) the term l log l dominates B, so
      Theorem 4 reads O~(l^3) bit operations per specialisation, and Theorem 5 is
      O~(l^3 log q) bit operations. These are larger than the recollection by
      roughly a factor of l.
    the_crucial_scope_point: >-
      SUTHERLAND'S ALGORITHMS SOLVE A DIFFERENT PROBLEM FROM THE ONE RT3-C8'S
      BATCHING ARGUMENT ADDRESSES, so the correction does NOT overturn RT3-C8.
      Sutherland's abstract states "We do not assume that the modular polynomial
      Phi_l(X,Y) is given" - his algorithms compute Phi_l(j(E),Y) WITHOUT Phi_l.
      RT3-C8's argument is about multipoint evaluation of an ALREADY-KNOWN
      Phi_l's l+2 coefficient polynomials at N >> l arguments. Those are distinct
      objects with distinct costs, and citing Theorem 4 against RT3-C8 would be a
      category error. RT3-C8's O~(1)-per-entry-after-batching conclusion is
      untouched by this retrieval; what IS now retrieved is that Sutherland's
      paper does not supply the batching statement, which RT3-C8 hoped it might.
    the_absence_is_itself_the_finding: >-
      Both retrieval passes report NO statement in Sutherland (ANTS X 2013) about
      amortizing evaluation over many j-invariants. The batched-evaluation
      literature RT3-C8 needs is therefore NOT this paper. Lemma 3.3's footnote
      in the frozen text credits the idea to Damien Robert, and the corpus
      already holds two nearer candidates that this session did not retrieve:
      KN-LIT-5447 ("On the computation and evaluation of modular polynomials")
      and KN-LIT-7642 ("Efficient quaternion algorithms for the Deuring
      correspondence, and application to the evaluation of modular polynomials").
      Naming them is the forward guidance; retrieving them is a successor task.
  a_separate_recollection_this_retrieval_CONFIRMS:
    which: >-
      RT-C1 (BATCH-001) asserted from memory: "Phi_l(X,Y) has ~l^2 coefficients
      of ~6*l*log(l) bits; a single Phi_l for l ~ B_opt ~ 2^14 is terabyte-scale
      to store".
    retrieved_support: >-
      Sutherland states h(Phi_l) <= 6 l log l + 18 l, and that the size of Phi_l
      is O(l^3 log l) bits, "several gigabytes for l ~ 10^3, and many terabytes
      for l ~ 10^4".
    verdict: >-
      CONFIRMED. Both the 6*l*log(l) height constant and the terabyte-scale
      storage claim at l ~ 10^4 are now cited rather than recollected. This is a
      real, if small, integrity gain for the BATCH-001 record.

