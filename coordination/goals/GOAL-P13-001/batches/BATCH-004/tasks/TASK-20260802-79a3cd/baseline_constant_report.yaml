# ===========================================================================
# 0. HEADLINE
# ===========================================================================
verdict:
  can_k_be_instantiated: PARTIALLY_YES
  one_sentence: >-
    A directly author-stated cost law for the standard Delfs-Galbraith subfield
    search was retrieved - #(F_p muls.) = c * sqrt(p) * log_2 p with
    0.75 <= c <= 1.05 - which instantiates k, but it was retrieved from the
    first author's blog post rather than from the paper, whose PDF is behind
    bot protection, and it was fitted at bitlengths 21-40 so its use at
    log_2 p = 256 is an extrapolation by a factor of 2^216 in p.
  direction_it_moves_the_margin: >-
    UP, IN THE ATTACK'S FAVOUR, on every row. This is the opposite of what
    RT-S2 anticipated and is stated first for exactly that reason.
  magnitude: >-
    +6.00 to +6.49 bits at log_2 p = 256 against plain Delfs-Galbraith, or
    +1.75 to +4.90 bits against Delfs-Galbraith accelerated by SuperSolver.
  what_is_still_missing: >-
    The paper itself ([15]); the concrete vOW constants of [3]; and the constant
    lambda relating the expected number of Delfs-Galbraith walk steps to
    p^{1/2}, which is needed to convert k into a per-step cost comparable with
    NC2f.

# ===========================================================================
# 1. WHAT k IS, AND A STRUCTURAL CORRECTION TO ITS DEFINITION
# ===========================================================================
definition:
  as_posed_by_RT_S2: >-
    "re-baseline the model as T_base = k * p^{1/2} with k an explicit, cited
    constant" (coordination/tasks/TASK-20260724-P13-RT/red_team_report.yaml,
    RT-S2.cheapest_control), restated unchanged in the BATCH-003 red-team
    report's end_to_end_baseline block.
  unit: >-
    The campaign's margin rows compare in F_{p^2}-operations, and RT-S2's own
    body text identifies the defect precisely: the comparison "silently assumes
    DG steps cost 1 op too". So k is the number of F_{p^2}-multiplications the
    baseline actually spends per unit of p^{1/2}.
  structural_correction:
    finding: >-
      k IS NOT A CONSTANT. The retrieved law is T_base = c * p^{1/2} * log_2 p,
      not c * p^{1/2}. The correct object is k(p) = c * log_2 p / mu, where mu
      is the F_p-multiplications per F_{p^2}-multiplication.
    why_it_matters: >-
      A constant k shifts all five field sizes by the same number of bits, which
      is how RT-S2 and the BATCH-003 report both describe it ("shifts EVERY
      margin row by the same amount"). A k growing like log_2 p does not: it
      shifts log_2 p = 768 by 1.585 bits more than log_2 p = 256. The
      description "the same amount" is therefore wrong for the plain-DG
      baseline, and roughly right only for the SuperSolver-accelerated baseline,
      where the growth of the acceleration factor nearly cancels the growth of
      log_2 p (see section 4, row C: 2.78 bits at 256 vs 3.41 bits at 768).
    status: >-
      This correction is DERIVED from the retrieved law and is offered as a
      correction to the campaign's own formulation, not to the paper's.

# ===========================================================================
# 2. SOURCES ACTUALLY RETRIEVED
# ===========================================================================
