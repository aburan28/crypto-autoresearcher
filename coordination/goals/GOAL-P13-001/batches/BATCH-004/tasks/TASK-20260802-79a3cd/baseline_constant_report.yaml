proposal:
  note: >-
    This is written as a proposal inside the task directory rather than as a
    ledger record, because this task's write scope is the task directory only.
    If the Coordinator wants it as a ledger proposal, an IDEA-* identifier must
    be minted via tools/allocate_id.py; I did not mint one.
  class: measurement
  claim: >-
    Replacing T_base = p^{1/2} with T_base = c * p^{1/2} * log_2 p / mu,
    c in [0.75, 1.05], mu = 3, optionally divided by the SuperSolver factor
    s in [3, 19], shifts every margin row in GOAL-P13-001 upward by a cited,
    interval-valued amount of between 1.75 and 6.49 bits at log_2 p = 256.
  novelty_status: adaptation
  novelty_basis: >-
    Corpus and ledger were checked. knowledge/literature/KN-LIT-2303 already
    holds [15] at title-and-abstract level with an explicit "Not verified here"
    caveat, KN-LIT-124 holds [3] with an explicit instruction that numbers must
    be obtained from the paper itself, and KN-LIT-366 holds the Sutherland paper
    at abstract level. None of the three carries the c-law, the s factors, or
    the theorem-level complexity statements retrieved here. No hypothesis in
    ledger/hypotheses/ carries an instantiated k. So this is a known result
    applied to a setting where the program had not retrieved it - an adaptation,
    not a discovery, and certainly not an exponent-moving result.
  target_complexity:
    time_exponent: "unchanged: p^{1/2} for the baseline, p^{1/3+o(1)} for the attack"
    memory_exponent: unchanged
    best_known: "unchanged"
    honest_statement: >-
      THIS IS A CONSTANT-FACTOR RESULT AND MOVES NO EXPONENT. Under
      docs/target-result-profile.md's exponent-first bias it is low-value as
      science. Its priority is as a REQUIRED BUILDING BLOCK: it is an input to a
      concrete-cost table whose honesty rules (AGENTS.md "Cost and scope
      honesty") require the baseline to be the best known one, and no
      parameter-setting conclusion can be drawn while the baseline carries an
      uncited constant. That is the whole of its claim to priority, and it should
      be ranked accordingly - below the Heuristic 1 work this batch's primary
      task addresses.
  minimal_discriminating_next_step:
    design: >-
      One fetch with a shell: retrieve https://eprint.iacr.org/2021/1488.pdf with
      a tool that clears eprint's bot check, or render the CRYPTO 2022 slide deck
      that exceeded WebFetch's 10 MiB limit, and read the paper's own comparison
      table.
    what_each_outcome_means:
      - "Paper confirms c in [0.75, 1.05] for Solver -> row A is adopted with its interval and the blog citation is replaced by the paper."
      - "Paper gives a different band or a different attribution -> this report is superseded and every bit figure moves; the direction may or may not survive."
      - "Paper gives an explicit crypto-size cost estimate -> E-1 is discharged and the extrapolation caveat is removed."
    cost: "minutes, with a shell. Zero compute."
  what_this_proposal_must_not_be_used_for: >-
    Re-rating any parameter set, moving concrete_threat_nist1 off INCONCLUSIVE,
