# ===========================================================================
# 3. HOW k IS COMPUTED FROM THE RETRIEVED LAW
# ===========================================================================
derivation:
  step_1_the_stated_law:
    label: STATED
    source: S15_blog.V1
    content: "T_solver(p) = c * sqrt(p) * log_2 p   F_p-multiplications,  0.75 <= c <= 1.05"
    measured_at: "bitlengths 21 to 40; 10,000 instances of the subfield search per bitlength; 100 random primes x 100 pseudo-random j-invariants each"

  step_2_solve_for_k_in_F_p_units:
    label: DERIVED
    computation: "k_{F_p}(p) = T_solver(p) / p^{1/2} = c * log_2 p"
    note: "Trivial algebra; no assumption beyond the stated law."

  step_3_convert_to_F_p2_multiplications:
    label: DERIVED
    assumption_made_explicit: >-
      mu = F_p-multiplications per F_{p^2}-multiplication. Karatsuba gives
      mu = 3; schoolbook gives mu = 4. Both are reported. The campaign's
      instrument counts F_{p^2}-multiplications, so the conversion is required
      and its choice is a stated convention, not a measurement.
    computation: "k_{F_{p^2}}(p) = c * log_2 p / mu"
    values_at_log2p_256:
      mu_3_karatsuba: "[0.75*256/3, 1.05*256/3] = [64.000, 89.600]  ->  log2 k = [6.0000, 6.4854]"
      mu_4_schoolbook: "[0.75*256/4, 1.05*256/4] = [48.000, 67.200]  ->  log2 k = [5.5850, 6.0704]"
    primary_convention_used_below: mu = 3

  step_4_the_supersolver_acceleration_factor_s:
    definition: "s(p) = the factor by which SuperSolver reduces the cost of the same subfield search."
    stated_data:
      label: STATED
      source: S15_blog.V3
      points:
        - "log_2 p = 50  (p = 2^50-27):   s in [3, 4]"
        - "log_2 p = 800 (p = 2^800-105): s in [18, 19]"
      normalisation: "equal budget: both algorithms run until F_p multiplications exceed 10^8; the metric is total nodes covered, walked and inspected"
      monotonicity: "stated by the author: 'we see how the advantage of SuperSolver grows as p grows'"
    single_instance_cross_check:
      label: DERIVED
      source: S15_blog.V2
      computation: "112878 / 53900 = 2.0942 at log_2 p = 24"
      caveat: >-
        A SINGLE INSTANCE with different node counts (318 vs 1897), so it
        conflates instance variance with efficiency. Recorded only because it is
        consistent with monotone growth (2.09 at 24 bits < 3 at 50 bits), which
        is a genuine, if weak, corroboration of the stated trend.
    bracket_at_256_bits:
      label: DERIVED
      reasoning: "50 < 256 < 800 and s is stated to be increasing, so s(256) in [s(50), s(800)] subset [3, 19]."
      value: "s(256) in [3, 19]"
    interpolated_at_256_bits:
      label: ESTIMATED
      why_estimated: >-
        The functional form is MINE, not the author's. The author states only
        that s grows. Two forms are fitted to the two stated points and both are
        reported so the spread is visible.
      model_A_power_law:
        fit: "s = 3.5 * (log_2 p / 50)^theta, theta = ln(18.5/3.5)/ln(800/50) = 1.66523/2.77259 = 0.600605"
        at_256: "3.5 * 5.12^0.600605 = 3.5 * 2.66665 = 9.333"
      model_B_linear_in_log2p:
        fit: "s = 2.5 + 0.02 * log_2 p  (through (50, 3.5) and (800, 18.5))"
        at_256: "2.5 + 5.12 = 7.620"
      third_point_consistency_check:
        computation: >-
          Refitting the power law through the 24-bit single-instance point
          (24, 2.0942) and (800, 18.5) gives theta = ln(8.8339)/ln(33.3333) =
          2.17868/3.50656 = 0.62131 and s(256) = 2.0942 * 10.66667^0.62131 =
          2.0942 * 4.35333 = 9.117.
        reading: >-
          9.117 from an independent pair versus 9.333 from the fitted pair. The
          estimate s(256) ~ 7.6-9.3 is stable under which points are used. This
          does not make it a measurement.
      value: "s(256) ~ [7.62, 9.33]"
    interface_assumption_that_is_NOT_verified:
      id: A-NODES
      severity: medium
      statement: >-
        Converting "covers s times as many nodes per unit cost" into "is s times
        faster" requires that an INSPECTED node carries the same probability of
        being a subfield curve as a WALKED node, and that inspected nodes are not
        substantially re-inspected across steps. This is the design intent of
        [15] and is presumably argued in the paper; I could not read the paper,
        so it is recorded as an unverified assumption, and every s-dependent
        figure inherits it.

