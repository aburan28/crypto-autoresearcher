  - claim: "Solver cost law #(F_p muls.) = c*sqrt(p)*log_2 p, 0.75 <= c <= 1.05"
    url: https://www.mariascrs.com/2021/11/16/supersolver.html
    passes: 3
    pass_1_prompt: "verbatim quotes of speedup factors and timing tables"
    pass_2_prompt: "reproduce verbatim every sentence containing a number"
    pass_3_prompt: >-
      reproduce the contiguous block from "10,000 instances" through the formula
      and say which algorithm it refers to
    agreement: >-
      All three passes returned the same numeric values. Pass 3 additionally
      established, from the block's own opening sentence, that the law is
      Solver's (standard Delfs-Galbraith) and NOT SuperSolver's. This
      attribution is load-bearing for the sign of k and was the reason for the
      third pass.
  - claim: "node-coverage ratios 3-4x at 2^50-27 and 18-19x at 2^800-105"
    url: https://www.mariascrs.com/2021/11/16/supersolver.html
    passes: 3
    discrepancy_found_and_resolved: >-
      Pass 1 appended a parenthetical "(when operations remain under 10^8
      multiplications)" that pass 2's number-bearing-sentence extraction did not
      reproduce. This was treated as a possible converter interpolation and
      re-checked on pass 3, which returned the underlying sentence verbatim:
      "running SuperSolver and Solver until the number of F_p multiplications
      used exceeded 10^8". The normalisation is therefore CONFIRMED, not
      assumed. Recorded because an unconfirmed converter interpolation is
      precisely the failure mode this task warns about.
  - claim: "Sutherland Theorem 4 / Theorem 5 complexity bounds"
    url: https://ar5iv.labs.arxiv.org/html/1202.3985
    passes: 2
    agreement: >-
      Both passes returned identical expressions. Pass 2 additionally supplied
      the theorem NUMBERS (4 and 5), which pass 1 gave only for Theorem 4, and
      the second height bound h(Phi_ell) <= 6*ell*log ell + 16*ell +
      14*sqrt(ell)*log ell.

