# ---------------------------------------------------------------------------
# INTEGRITY OBSTRUCTIONS THAT APPLY TO EVERY ROW BELOW.
# These are stated up front because the task card required a SHA-256 per source
# and this session cannot produce one. A fabricated hash would be worse than a
# declared gap, so every `sha256` field below is null with a reason.
# ---------------------------------------------------------------------------
session_integrity_obstructions:

  - id: OBS-HASH
    severity: high
    what_is_missing: SHA-256 of every retrieved artefact.
    reason: >-
      This session's tool surface is Read, Grep, Glob, Write, WebSearch,
      WebFetch. There is no shell, no `sha256sum`, no Python interpreter, and no
      hashing tool of any kind. A SHA-256 cannot be computed here.
    what_was_NOT_done: >-
      No hash was guessed, recollected, copied from another record, or otherwise
      synthesised. Every `sha256` field in this log is null.
    substitute_binding: >-
      Each retrieved row instead carries a `verbatim_anchor`: an exact quoted
      string that the Validator can re-fetch from the same URL and compare
      character-for-character. This is a weaker binding than a hash - it does not
      cover the whole document and it does not detect changes outside the quoted
      span - and it is offered as a partial substitute, not an equivalent.
    consequence_for_the_validator: >-
      The BATCH-004 validation card (TASK-20260802-cd08cd) instructs the
      Validator to "verify each recorded hash against the recorded source". There
      are no hashes to verify. The check that IS available is re-fetching each
      URL and confirming the `verbatim_anchor` strings. Please record the
      substitution as a finding rather than treating the check as performed.

  - id: OBS-BYTES
    severity: medium
    what_is_missing: raw bytes of any retrieved document.
    reason: >-
      WebFetch does not return the fetched bytes. It converts the response to
      markdown and then answers a prompt against that conversion using a small
      fast model. What reaches this session is therefore a MODEL-MEDIATED
      RENDERING of the source, never the source.
    consequence: >-
      Even with a hasher available, a hash computed here would bind the
      rendering, not the document. Every quotation in the companion report is a
      quotation as relayed by that converter. Where a figure is load-bearing I
      re-fetched the same URL with a differently-worded verbatim-only prompt and
      recorded whether the two passes agreed; see `corroboration_passes` below.

  - id: OBS-PDFLOCAL
    severity: medium
    what_is_missing: local PDF reading.
    reason: >-
      The Read tool's PDF path requires poppler. Attempting to read a locally
      cached PDF returned "pdftoppm is not installed. Install poppler-utils ...
      to enable PDF page rendering."
    consequence: >-
      The one PDF whose bytes did arrive in this session (arXiv 1202.3985v5,
      cached by WebFetch at
      /root/.claude/projects/-home-user-crypto-autoresearcher/abb9db2b-0522-54c3-81db-d48b05f90c33/tool-results/webfetch-1785712320376-ef4xp5.pdf)
      could not be opened. Its content was obtained from the ar5iv HTML
      rendering of the same arXiv identifier instead.

  - id: OBS-CLOCK
    severity: low
    what_is_missing: wall-clock time of each fetch.
    reason: >-
      No shell and no clock tool. The only time signal available to this session
      is the harness-declared current date, 2026-08-02.
    consequence: >-
      Every row records `fetched_date: "2026-08-02"` with
      `timestamp_precision: date_only`. `fetched_at` is null everywhere. No
      hour-minute-second value was invented.

