        The run executed exactly that as its NC-3 naive arm and it fires:
        pooled W-CURVE P(even) = 9370/23239 = 0.40320151, Clopper-Pearson 99%
        [0.39491191, 0.41153088], 1/2 outside the interval, and outside it in
        all four p mod 8 strata separately. Under my own stated rule that is a
        "constant-factor model rejection". IT IS NOT ONE. delta_E is a small
        integer whose size distribution is not uniform, and 1/2 is not the
        random-integer model's prediction at all; my control confounded parity
        with size. The frozen contract was right to demote it to descriptive and
        right about the reason. Run as I specified it, my own control would have
        manufactured a false falsification of Heuristic 1's parity prediction.
      what_survives: >
        RT-H3's BODY survives untouched: ell = 2 is the one small prime B2's
        nondegeneracy argument does not cover, no-forced-parity is necessary and
        not sufficient, and a parity constant factor is invisible to B1-B9. The
        target was right; the instrument I named was wrong. So was the one the
        contract replaced it with -- see RT4-H1.
    - id: RT4-R2
      severity: medium
      what_i_concede: >
        RT-S2's formulation "it changes every margin number by the same shift"
        is REFUTED by TASK-20260802-79a3cd and I concede it. The retrieved law
        is T_base = c * p^{1/2} * log_2 p, so k(p) = c * log_2 p / mu grows with
        log p: row A shifts log_2 p = 768 by 1.5850 bits more than log_2 p = 256
        (7.5850-8.0704 against 6.0000-6.4854). The BATCH-003 red-team report
        repeated my wording verbatim and inherits the correction. The producer
        found this against my text and stated it plainly; that is the correction
        working as intended.
    - id: RT4-R3
      severity: medium
      what_i_partially_concede: >
        RT-S2's "the net sign of the constant-factor comparison between the two
        algorithms is UNKNOWN from the record" is now HALF resolved, and the
        half that resolved goes against my expectation. The BASELINE-side term's
        sign is positive and pro-attack: a Delfs-Galbraith step is many field
        multiplications and charging it one F_{p^2}-operation was an error in
        the baseline's favour worth log_2 k in [6.0000, 6.4854] bits at
        log_2 p = 256 against plain DG. I said in the same sentence that this
        error existed and would partially cancel RT-C1's anti-attack asymmetry;
        it does not partially cancel it, it exceeds the SuperSolver correction
        it was expected to be cancelled by. I concede the direction.
        I do NOT concede that the MARGIN's net sign is resolved -- see RT4-C1.

  # ==================================================================
  # 1. OBJECTIONS, BY SEVERITY
  # ==================================================================
  objections:

    - id: RT4-H1
      severity: critical
      target: "S2's rejection statistic, and therefore the batch's headline void"
      claim_challenged: >
        "S2's three-part rejection condition was MET on the arithmetic object at
        z_2 = +8.65 ... exactly the constant-factor falsification RT-H3
        predicted might be hiding at ell = 2", voided only because NULL-A
        reproduced it.
      finding: >
        THE STATISTIC IS NOT CENTRED UNDER THE MODEL IT CLAIMS TO TEST, AND THE
        RUN CONTAINS THE MEASUREMENT THAT PROVES IT. The reported +8.645 is
        BELOW the artifact floor, not above a null.
      the_defect: >
        S2 computes q_i = floor(n_i/2)/n_i with n_i = the sample's OWN realised
        delta_E (implementation s2_core: `n = s["delta"]`), and the frozen
        contract asserts this "removes the size effect exactly". It does not.
        The event {delta even} and the conditioning quantity n_i are the SAME
        random variable, so the estimator is self-conditioned and its
        expectation under the model is not zero. Exactly:
          E[1{n even} - floor(n/2)/n] = (1/2)(P(even) - P(odd)) + E[1{odd}/(2n)]
        and the second term is strictly positive for any distribution with mass
        on small odd values.
      the_run_measures_the_offset_itself: >
        NULL-B READING_NEW_SIZE is a bona fide uniform random integer pushed
        through the identical estimator: 200 of 200 replications give
        z_2 in [+16.818983, +19.520138], mean +18.431490, zero replications
        below +16.8. That IS the estimator's zero point for a single-realisation
        object. The arithmetic +8.645 is roughly half of it.
        READING_KEEP_SIZE (z_2 in [-1.888674, +1.643494], mean -0.000638) is
        calibrated only because it evaluates q_i at a size that is NOT the
        sample's own value -- a reading unavailable for the arithmetic object,
        which has exactly one number per class.
      my_recomputations_from_the_committed_raw_result:
        label: "RT-RECOMP, red-team recomputation from experiments/EXP-HEUR-d640d9/runs/RUN-HEUR-d640d9-a/raw-result.json at commit 11b086d9. Not a run record; carries no run id."
        reproduction_of_the_run: "s2_core recomputed from per_prime_records alone reproduces p_obs = 0.40320151469512455, p_null = 0.3516886296093663, z_2 = 8.645103378616307 exactly. The run's arithmetic is correct."
        expected_offset_under_a_genuine_random_integer_on_the_same_size_scaffold: "+0.10008922 in (p_obs - p_null), against the arithmetic object's +0.05151289. Computed exactly in Fractions as sum_i w_i (q_{n_i} - ebar_{n_i}) / W with ebar_n = (1/n) sum_{m<=n} floor(m/2)/m."
        exact_decomposition_of_the_arithmetic_excess:
          parity_term_half_P_even_minus_P_odd: -0.09679849
          self_conditioning_offset_term: +0.14831138
          sum: +0.05151289
          agreement_with_the_run: "matches the run's p_obs - p_null to 8 decimals"
          where_the_offset_lives: "64.2% from delta_E = 1 (weight share 0.1906), 23.2% from delta_E = 3, 10.2% from delta_E = 5. The whole 'signal' is the delta_E = 1 / Galois-stable spike."
        exogenous_size_control_M2: "Against the contract's own M2 (delta ~ U[1, X_p], X_p = floor((p/2)^{1/3}), a size scale NOT read off the sample): p_obs = 0.403202 against p_M2 = 0.459973, z = -9.2100, log2 ratio = -0.1900 bits."
      consequences:
        - "The reported constant factor log2(p_obs/p_null) = +0.1972024 bits HAS THE WRONG SIGN. The only exogenous reading available in this data gives -0.1900 bits."
        - "Falsification criterion (a) could not have fired correctly at any value: any single-realisation object, arithmetic or null, carries the same offset. PH2's 'NOT MET' is uninformative rather than negative evidence."
        - "The batch's flagship sentence -- 'without that null object a |z| = 8.6 result would have been reported as a finding' -- credits the wrong control. NULL-B's second reading already voids it, and would have done so even if NULL-A had come back clean. The escape from a false finding was luck, not design."
        - "The delta_E = 1 spike that carries 64% of the offset has W-CURVE weighted mass ~ 4.111 * p^(-0.4587) (my log-log fit over all 299 completed primes), i.e. Theta(p^{-1/2+o(1)}) as theory expects. At p = 5*2^248-1 that is ~1.1e-34. THE ENTIRE S2 EFFECT IS A TOY-SCALE ARTIFACT WITH NO CRYPTOGRAPHIC-SCALE ANALOGUE."
      cheapest_discriminating_control: >
        ZERO COMPUTE, NUMBERS ALREADY COMMITTED: compare the arithmetic z_2
        (+8.645) against the NULL-B READING_NEW_SIZE empirical z_2 distribution
        ([+16.819, +19.520], 200/200) instead of against the analytic zero. The
        verdict changes from "VOID (null reproduces the signal)" to "rejected
        against the empirical null, with the OPPOSITE sign to the one reported".
        The second control, also near-free, is a centred statistic: a
        pair-collapse P(delta = 2k | delta in {2k-1, 2k}, X_p >= 2k), which is
        1/2 under any model locally flat within the pair and has no size
        parameter to estimate.
      what_this_does_NOT_show: >
        It does not show that delta_E's parity is anomalous in the other
        direction. The M2 comparison confounds parity with size (delta_E is far
        from uniform on [1, X_p]) and the pair-collapse is confounded by the
        density decay within a pair. THE HONEST STATE IS THAT NO CLEAN
        MEASUREMENT OF delta_E's PARITY AT FIXED SIZE EXISTS AFTER THIS BATCH.
        RT-H3's ell = 2 lane is not closed; it has not yet been measured.

    - id: RT4-H2
      severity: critical
      target: "S1 SAMPLER-REJECTED, and the reading that it 'substantiates RT-H2'"
      claim_challenged: >
        "The walk-based sampler at toy primes does not reach conjugacy classes
        uniformly at the tested lengths", flat in L across 1x/3x/10x.
      finding: >
        THIS IS A REFERENCE-MEASURE ERROR, NOT A MIXING FAILURE. The walk has
        mixed. It has mixed to the WRONG REFERENCE: S1a compares it against the
        W-TYPE (uniform-over-conjugacy-class) exact CDF, while a non-backtracking
        walk in the ell-ideal graph equilibrates to uniform over IDEAL CLASSES,
        i.e. over supersingular j-invariants, whose pushforward to types is
        W-CURVE (weight 1 for a Galois-stable class, 2 otherwise). The contract
        asserts W-TYPE is "the sampler's target measure"; that assertion is
        false for the walk the contract itself constructs.
      my_recomputations_from_the_committed_raw_result:
        label: "RT-RECOMP from raw-result.json at 11b086d9; walk_delta_counts against exact per-prime class data. Not a run record."
        mean_total_variation_to_W_TYPE_by_walk_length: {L_1x: 0.13044, L_3x: 0.12782, L_10x: 0.12752}
        mean_total_variation_to_W_CURVE_by_walk_length: {L_1x: 0.03485, L_3x: 0.01102, L_10x: 0.01055}
        sampling_noise_scale_for_N_walk_20000_over_9_atoms: 0.00846
        reading: >
          TV to W-TYPE converges to a NONZERO limit (0.1304 -> 0.1278 -> 0.1275);
          TV to W-CURVE DECAYS to the sampling-noise floor (0.0349 -> 0.0110 ->
          0.0106). That is the textbook signature of a chain that has mixed to a
          stationary measure different from the reference, and the exact
          opposite of an under-mixing signature.
        w_curve_is_the_closer_reference_at: "288 of 299 primes at L = 10x -- the same 288 as the Holm rejection count."
        worked_example_p_1999_L_110:
          walk_fractions: [0.1567, 0.1087, 0.1752, 0.1056, 0.2674, 0.0831, 0.0458, 0.0466, 0.0110]
          W_CURVE_exact:  [0.1617, 0.1078, 0.1677, 0.1078, 0.2635, 0.0838, 0.0479, 0.0479, 0.0120]
          W_TYPE_exact:   [0.2784, 0.0928, 0.1443, 0.0928, 0.2268, 0.0722, 0.0412, 0.0412, 0.0103]
        the_gap_is_a_vanishing_toy_scale_quantity: "mean TV(W-TYPE, W-CURVE) * sqrt(p) = 4.185 over the 135 primes with p > 1000 (1.152 over p < 200). Extrapolated to p = 5*2^248-1 the measure gap is ~8.8e-38. The rejected quantity provably vanishes at cryptographic scale."
      the_reported_flatness_in_L_is_a_censored_measurement: >
        S1a's Fisher statistic is IDENTICAL to the last printed digit at all
        three lengths (5305.213651378483) and IDENTICAL to S1b's at all three
        lengths. I checked why: 2 * 288 * ln(10001) = 5305.2136513784735, i.e.
        every one of the 288 rejecting primes is pinned at the Monte-Carlo
        resolution floor 1/10001 and the other 11 contribute zero. The Fisher
        statistic is a re-encoding of the count 288 and has NO resolution. So
        "the rejection does not weaken as the walk lengthens" is not measured by
        the quantity quoted for it. The UNSATURATED quantity is the raw KS D,
        and it moves the other way: at p = 1999, S1a_D = 0.10653 -> 0.11935 ->
        0.12170 as L goes 11 -> 33 -> 110, converging upward to the measure gap.
        AN-5 records the float underflow but not the saturation, and the
        saturation is the part that matters.
      consequences:
        - "S1c (class-visit chi-square against uniform over n_types) and S1d (fraction with delta_E = 1) are confounded identically, and S1d is the single statistic where the two measures differ most -- it is the delta_E = 1 spike again, the same object that carries 64% of RT4-H1's offset."
        - "The correct scoped statement is stronger and more useful than the one recorded: this walk's stationary distribution is not uniform over conjugacy classes, and no walk length repairs that. 'At the tested lengths' wrongly suggests a longer walk might pass."
        - "The run already holds half of this finding and did not connect it: PH5 records that the W-CURVE and W-TYPE Clopper-Pearson intervals for the even-fraction are DISJOINT. That is the same measure gap, measured a second way, in the same run."
        - "RT-H2's named failure mode was a tilt 'toward orders with short ideals -- exactly the regime that makes delta_E small'. The observed tilt goes the OTHER WAY: the walk under-weights delta_E = 1 relative to types (0.1567 against 0.2784 at p = 1999). My hypothesised mechanism is not what the data show."
      cheapest_discriminating_control: >
        Recompute S1a against the W-CURVE enumerated CDF instead of W-TYPE.
        Zero new compute at the delta level -- I have already done it above and
        it passes at the noise floor. S1c needs per-class visit counts, which
        raw-result.json does NOT store (only walk_delta_counts by delta atom);
        REQUIRE that artifact in any successor contract. If S1c also passes
        against W-CURVE, S1's verdict is retired and replaced by "the walk
        samples the curve measure; the contract compared it to the type
        measure".

    - id: RT4-H3
      severity: high
      target: "NULL-A as the object that voided S2, and criterion (a)'s design"
      claim_challenged: >
        "NULL-A, random integral ternary forms of the SAME determinant run
        through the IDENTICAL code path, gives z_2 = +8.74, the same sign and
        essentially the same magnitude ... the S2 signal is VOID."
      the_dispatchers_question_answered_in_both_directions:
        is_NULL_A_too_much_like_the_real_thing: >
          NOT in the sense feared. Once the size confound is removed, ARITHMETIC
          and NULL-A are demonstrably DIFFERENT objects. My pair-conditioned
          two-sample test (P(even | delta in {2k-1,2k}), restricted to primes
          with X_p >= 2k so neither member is truncated) gives, arithmetic minus
          NULL-A: k=1 +0.0862 (z = +9.758), k=2 +0.0254 (+2.206), k=3 -0.0097
          (-0.691), k=4 -0.1419 (-6.640). Sign-unstable, up to ten sigma per
          bin. Their delta histograms differ materially (delta=1: 4429 against
          5885; delta=8: 107 against 261). "NULL-A reproduces the signal" is an
          agreement between two aggregate scalars, each dominated by the SAME
          estimator offset of RT4-H1, over components that disagree by up to
          10 sigma with unstable sign.
        is_it_too_much_like_the_real_thing_in_the_way_that_mattered: >
          YES, and unavoidably. Both are single-realisation objects, so both
          carry the self-conditioning offset by construction. A null of that
          shape CANNOT fail to reproduce it. Criterion (a) is therefore
          structurally unable to fire against the leading candidate failure
          mode, whatever the arithmetic does.
      the_design_objection_independent_of_the_centring_bug: >
        Criterion (a) requires the deviation to be SPECIFIC TO MAXIMAL ORDERS.
        Heuristic 1 asserts nothing about maximal orders; it asserts that
        delta_E behaves like a random integer for smoothness purposes. A
        deviation shared by every minimum of an integral ternary form of
        determinant p/4 STILL APPLIES TO delta_E, because delta_E is such a
        minimum. NULL-A belongs in the mechanism-attribution column, never as a
        veto on falsification. A successor contract should keep NULL-A and move
        it out of the falsification criterion.
      verdict_on_the_S2_void: >
        RIGHT OUTCOME, WRONG MECHANISM. The +8.645 is correctly not reported as
        a finding. It is not "a property of forms of this shape"; it is a
        property of the estimator, shared with a plain uniform random integer at
        twice the magnitude. RT-H3's ell = 2 lane -- the most promising lane in
        my BATCH-001 report -- IS NOT CLOSED at these primes. It was probed with
        a miscentred instrument and the measurement has to be redone. That is
        the single judgement in this batch I believe is wrong, and it is wrong
        in the direction of crediting a control that did not do the work.
      cheapest_discriminating_control: "as RT4-H1: the empirical NULL-B NEW_SIZE reference, plus a centred pair-collapse statistic. Both free."

    - id: RT4-C1
      severity: high
      target: "The instantiated baseline constant k and the claim that it resolves RT-S2"
      what_i_verified_and_accept:
        - "The arithmetic is correct. I recomputed rows A, B and C: 0.75*256/3 = 64.000 and 1.05*256/3 = 89.600 (log2 6.0000, 6.4854); row B [log2(64/19), log2(89.6/3)] = [1.7521, 4.9005]; theta = ln(18.5/3.5)/ln(16) = 0.600605 and s(256) = 9.333; the linear-in-log2p fit gives 7.620; the third-point refit gives 9.116; every row-C log2 k reproduces. No error found."
        - "The structural correction to my own RT-S2 wording is right and I concede it (RT4-R2)."
        - "The provenance labelling is exemplary: STATED / DERIVED / ESTIMATED on every line, every sha256 recorded as null WITH ITS REASON, zero fabricated hashes, the load-bearing 'Using Solver' attribution confirmed on a dedicated third retrieval pass, and the [3] mischaracterisation in the task card corrected against the task card."
      objections:
        - id: RT4-C1a
          severity: high
          statement: >
            THE MARGIN'S NET SIGN IS NOT RESOLVED; THE BASELINE TERM'S IS. The
            dispatch framing ("k moves margins UP by 1.75-6.49 bits, resolving
            RT-S2's net sign unknown as positive") drops the report's own HZ-2:
            margin_corrected = margin_published + log2 k is legitimate ONLY on
            rows already carrying the measured attack-side overhead, never on
            the paper's raw Section 4.1 pairs. And it is not the largest term:
            RT3-C8 / L4 stands at 11.50-13.25 bits and the unpriced charging
            point at 0.60-1.00 bits pessimistic, both unresolved and both larger
            or comparable. RT-S2's sentence was about the comparison BETWEEN THE
            TWO ALGORITHMS; one side of it is now cited, the other is not.
          cheapest_control: "state the corrected margin only as a pair (baseline term, attack term) with both charged at measured cost, and refuse any single-number margin until both are."
        - id: RT4-C1b
          severity: high
          statement: >
            HZ-1's SUBSUMPTION OF RT2-C7 IS NOT YET JUSTIFIED, AND THE MISSING
            FACTOR IS IN THE REPORT'S OWN DATA. k is per unit of p^{1/2};
            RT2-C7's 5-7 bits is per STEP. They are the same quantity only
            through lambda = p^{1/2}/N_steps, which the report declares
            NOT_RETRIEVED and leaves free over {1, 6, 12}. IT IS RETRIEVED: the
            report's own verbatim extract V2 gives, for p = 2^24-3, "Solver used
            112878 F_p multiplications and walked on 1897 nodes". Hence
            lambda = sqrt(p)/N_steps = 4096/1897 = 2.1592, and the per-node cost
            is 112878/1897 = 59.503 F_p multiplications = 19.834 F_{p^2}-mults
            at mu = 3 = 2^4.310. Converting RT2-C7 at that lambda gives
            (5..7) - log2(2.1592) = 3.89..5.89 bits, BELOW row A's 6.00-6.49.
            They overlap but are not equal, so "adopt k, record RT2-C7 as
            SUBSUMED" is premature by 0.6-2.1 bits.
          cheapest_control: "the arithmetic above; it costs nothing and is already done here. It should be checked against a second lambda from the paper when [15] is finally fetched."
        - id: RT4-C1c
          severity: medium
          statement: >
            THE FREE NC2f CROSS-CHECK THE REPORT OFFERS CAN BE CLOSED NOW, AND
            IT LANDS FAVOURABLY. With lambda = 2.1592, the implied
            Delfs-Galbraith per-step cost at p ~ 2^40 is k(2^40)*lambda =
            2^4.432 to 2^4.918 F_{p^2}-multiplications from the c-law, or
            2^5.047 by scaling V2's directly measured per-node cost by
            log_2 p (40/24). NC2f pre-registers 2^5..2^7 at that size. The
            c-law route lands 0.08-0.57 bits BELOW the band's floor and the
            direct route lands just inside it. That is an independent
            order-of-magnitude corroboration of RT3-C9's pre-registration by a
            published implementation at zero compute, and it says NC2f's band
            is if anything slightly high rather than slightly low. At
            log_2 p = 256 the same conversion gives 2^7.110 to 2^7.596 per step.
          caveat: "Solver's walk is Phi_2 root-finding, not Velu; RT3-C9 named that gap and it is exactly the size of the residual here. This is indicative, not an identity."
        - id: RT4-C1d
          severity: medium
          statement: >
            THE E-1 CONSISTENCY CHECK THE REPORT DID NOT RUN. V2's single
            instance implies c = 112878/(4096*24) = 1.1483, which is 9.4% ABOVE
            the top of the stated band [0.75, 1.05]. One instance with
            geometric-scale variance in node count is NOT a refutation and I do
            not present it as one. But it is the free internal consistency check
            on the report's central law, it was available, and it points to c
            sitting at or above the band's top -- which makes k larger and the
            pro-attack shift larger, in the same direction as HZ-4 (squarings).
          cheapest_control: "refit c from the authors' published Solver.sage at bitlengths 41-60 (the report already names this as E-1's validation route). Toy-scale; never crypto-scale validation."
        - id: RT4-C1e
          severity: medium
          statement: >
            THE WAYFINDER dominated_by ROW BOUNDS THE MAGNITUDE FROM BELOW BY
            NOTHING. "k is an OVERESTIMATE and the pro-attack shift is an UPPER
            bound" is right in direction and leaves the lower end unbounded, so
            the reported 1.75-bit floor is not a floor. The missing bound, which
            I supply: the SIGN of log2 k survives as long as the best-known
            baseline is less than c * log_2 p / mu = 64 to 89.6 times faster
            than plain Delfs-Galbraith at 256 bits. SuperSolver reaches 7.62 to
            9.33 there. A sign flip therefore requires roughly a further order
            of magnitude from WayFinder on top of SuperSolver, which is not what
            a constant-factor generalisation of DG/SuperSolver plausibly
            delivers. That bound is what makes the sign claim defensible and it
            is not in the report.
          cheapest_control: "retrieve [40]'s cost model and read off its implied constant; the report already names this as the correct long-term source for k."
        - id: RT4-C1f
          severity: medium
          statement: >
            PROVENANCE. A non-peer-reviewed blog post is the sole source of a
            load-bearing constant for a paper published at CRYPTO 2022. The
            report flags this at every point of use and that is the right
            handling for a PROPOSAL; it is not sufficient for ADOPTION into a
            margin row. HZ-3 (mu = 3 against 4, 0.415 bits) and HZ-4 (squarings,
            0.14-0.38 bits) are inside the bracket width but must be stated, not
            silent.
          cheapest_control: "the report's own minimal_discriminating_next_step -- one fetch with a shell that clears eprint's bot check, or rendering the CRYPTO 2022 slide deck that exceeded WebFetch's 10 MiB limit."

    - id: RT4-C2
      severity: medium_high
      target: "FC-4 STANDS, and the role RG-CONTROL plays in it"
      the_disposition_is_right: >
        FC-4 STANDS is correct. I do not challenge the verdict. Clauses (b) and
        (d) fail on their own merits: PRIMARY-A's per-ell range reaches 1.150320
        outside the [0.85, 1.15] band, and alpha_hat(ell) carries a residual
        trend whose 95% interval excludes zero on both primary arms
        (+0.011974 to +0.041467 on A, +0.019978 to +0.024567 on B, r^2 0.968 and
        0.999). Avoiding the failing ell would not have retired it and the
        contract's requirement to re-measure the old grid did its job.
      the_reason_cited_for_it_is_not:
        - "RG-CONTROL is a bit-identical RE-EXECUTION of a deterministic pipeline with the same seeds and the same code: all twelve values reproduce at abs_difference 0.000000e+00. That is a provenance and code-drift check with ZERO statistical power. It cannot corroborate a mechanism, and 'RG-CONTROL reproduced the committed firing bit-identically' should not be offered as a reason FC-4 stands. Under KN-LIT-7593's shape -- an eliminated dimension is not a gain until its own cost is charged -- a re-run is not a control until it perturbs something."
        - "Per-ell decomposition, my arithmetic on the run's own RG-CONTROL rows: gap = primary - null at ell = 3 is +0.4023, ell = 5 +0.3752, ell = 7 +0.0504, ell = 11 +0.0125, ell = 13 -0.0095; on the new grid +0.0612 (A) and +0.0532 (B) at ell in {47,101,151,211}. This CORROBORATES my own RT3-C3 ('FC-4 fires on ell in {3,5} only') with a second grid and seven ell values, and it cuts both ways: pooled, the inconsistency reads 0.166 against a 0.15 threshold (1.1x); per-ell it reads 0.40 (2.7x) and is localised. POOLING UNDERSTATES IT. The record should carry the per-ell form, which is the stronger statement about the fitted law's ell-uniformity."
      anomaly_A_4_quantified:
        statement: >
          NULL-A and NULL-B are bit-identical, so alpha_null is ONE measurement
          and clause (a) is ONE comparison, not two. How much this weakens "does
          not fire on either arm": the margins to threshold are 0.15 - 0.0612 =
          0.0888 and 0.15 - 0.0532 = 0.0968. The null term's OWN demonstrated
          range across ell on the old grid is 0.8590 to 1.1056, a span of 0.2466
          -- roughly 2.6 times the margin. A single shared null whose ell-to-ell
          variability exceeds the distance to the threshold is a weak basis for
          "does not fire", and a common shift of -0.09 in alpha_null would fire
          BOTH arms simultaneously because they share the term exactly.
        also: >
          71% of the old-to-new grid change in the gap comes from the NULL arm
          (alpha_null 0.9935 -> 1.0681, -0.0746) and only 29% from the primary
          (1.1597 -> 1.1293, -0.0304). The non-firing on the new grid is mostly
          a null-arm movement.
        cheapest_discriminating_control: >
          Break the shared Cantor-Zassenhaus seed FOR THE NULL ARM ONLY and
          measure alpha_null twice independently on the same grid, so clause (a)
          has two null terms instead of one; and report alpha_null per ell on
          BOTH grids side by side, which turns A-4 from a footnote into a
          measured stability statement. Neither requires new mathematics.

    - id: RT4-D1
      severity: medium
      target: "Deviation D-1: TIER-2/TIER-3 excluded on a 170 MB against 100 MB artifact limit"
      the_stop_is_contract_legal: >
        The SUFFICIENCY rule makes stopping at a complete tier terminal on
        naming the tier, TIER-0 and TIER-1 are complete, the record floor is
        cleared, no prime was partially enumerated, and the 50 TIER-2 primes are
        named and demonstrably unused. Nothing here is hidden.
      the_reason_given_is_not_a_scientific_one: >
        A per-FILE hosting limit is not a property of the mathematics and the
        remedy is layout, not science: one raw file per tier, or dropping the
        per-class debug fields (O_0 construction blocks, R_canonical_key, basis
        dumps) at higher tiers, or compression. Recording a packaging limit as
        the reason a tier was dropped reintroduces, in a different currency,
        exactly the budget mechanism AGENTS.md retired -- and unlike a budget it
        was never declared in advance. Call it what it is: a reporting-format
        decision presented in the slot where a scope decision belongs.
      what_TIER_2_3_would_actually_have_bought_measured_not_assumed:
        u_range: "3.1699 -> about 4.46. Against an operating point of u ~ 13.1 that closes 13% of the remaining gap and gives ZERO tail resolution: rho(4.46) is order 2^-9 while rho(13) is order 2^-60, against 13,834 samples."
        X_p_reach: "9 -> 15 (TIER-2) -> 22 (TIER-3). This is the real gain: it is the parameter that shrinks the small-support artifacts driving S2 and S3."
        it_would_NOT_have_repaired_S4: >
          I measured this rather than assuming it. Fitting lambda_hat(B=2) per
          prime over all 299 completed primes gives
          lambda_hat = 3.7603 * p^(-0.1604) (log-log least squares; TIER-0 mean
          2.0743 at mean p = 100, TIER-1 mean 1.3074 at mean p = 1062).
          Extrapolating: 0.8898 at p = 8000 (TIER-2 ceiling) and 0.7566 at
          p = 22000 (TIER-3 ceiling), against S4 targets 0.30 / 0.10 / 0.03 and
          the Executor's factor-of-two reachability rule, which needs
          lambda_hat <= 0.60 for the LEAST rare target. S4'S RARITY REGIMES ARE
          UNREACHABLE ANYWHERE IN THE CONTRACT'S ENTIRE DECLARED PRIME RANGE,
          TIER-3 INCLUDED. AN-4 is a CONTRACT DESIGN DEFECT, not an execution
          shortfall, and no tier extension repairs it.
      consequence_for_the_closure_language: >
        The honest record is: TIER-2/3 remains open scope, worth having for X_p
        reach and for nothing else measured here; it is NOT the repair for S4;
        it was not declined on scientific grounds; and a successor contract must
        fix both the raw layout AND S4's rarity lever, because p cannot reach
        the regimes S4 needs. Extrapolation caveat stated: this is an 11x
        extrapolation of a law fitted over a 180x range in p, which is far safer
        than most extrapolations in this campaign but is still an extrapolation.

    - id: RT4-S1
      severity: high
      target: "Whether any official position moves"
      position: >
        NOTHING MOVES. Stated plainly, with the specific numbers, and with the
        four-batch pattern named rather than glossed.
      concrete_threat_nist1: >
        STAYS INCONCLUSIVE. Even taking k at face value and applying it only
        where HZ-2 permits -- to rows already carrying the corrected overhead
        bracket -- the defensible span [8.3498, 22.2927] bits becomes
        [14.3498, 28.7781] under row A (width 14.4283) or [10.1019, 27.1932]
        under row B (width 17.0913). The completion criterion is "decides the
        NIST-I margin with error below the irreproducibility band", i.e. 2.2309
        bits (NIST-I time) or 3.5133 (max across fields). The span is missed by
        a factor of 6.5 to 7.7. ADOPTING k WIDENS THE INTERVAL BY 0.49 TO 3.15
        BITS WHILE SHIFTING IT UP. What genuinely improves is the SIGN: the low
        end rises from 8.35 to 10.10 or 14.35 bits. The verdict turns on width,
        not sign, so it does not move. SP-6 binds and the run asserts it itself.
      H_P13_001_positions: >
        NO POSITION CHANGES. heuristic_1_status stays UNPROVEN, NOT FALSIFIED
        and this batch adds nothing to it in EITHER direction: SP-H binds both
        ways and I endorse it without reservation -- nothing here supports
        Heuristic 1, P0, any margin row or the attack, and nothing here refutes
        Theorem 1.1 or the p^{1/3+o(1)} exponent.
        WHAT IS RECORDABLY NEW is about the CONTROLS, not the heuristic: the
        addenda in H-P13-001 say "NC-3 and NC-6 remain unrun ... now for the
        third consecutive batch". That sentence is now false and should be
        superseded. They ran. They returned one statistic voided by a
        miscentred estimator (RT4-H1), one whose verdict is a reference-measure
        error (RT4-H2), one reading-dependent with both models rejected and the
        rejection not surviving its null, and one inconclusive by a design
        defect that no prime in the contract could have repaired (RT4-D1). The
        correct addendum is that the controls were executed in full and that
        THREE OF FOUR MEASURED THE INSTRUMENT RATHER THAN THE OBJECT.
      RT_S1: >
        SURVIVES, with reason (iv) HALF discharged. Its retired half stays
        retired. Of the three standing reasons in the BATCH-003 report:
        (i) MAGNITUDE stands unchanged and is now slightly worse, since k adds
        width; (iv) "the baseline constant k is still unquantified and [15] and
        [3] are still unfetched" is HALF discharged -- k is now quantified from
        a stated law with a labelled interval and a named dominating row, while
        [15] and [3] full texts remain unfetched after four batches; (v)
        Heuristic 1's tail stands entirely unchanged, and RT4-H1/RT4-H2 mean the
        BODY evidence is weaker than the batch reads it as, not stronger. The
        paper's own hedge -- "impact on concrete parameter sets remains to be
        clarified" -- remains the correct framing.
      four_batches_without_movement_named_as_such: >
        This is the fourth consecutive batch in which no official position
        moves, and that deserves to be said in the terms the inventor protocol
        requires rather than absorbed. It is NOT a fatigue report and it is NOT
        evidence that the questions are unanswerable. The pattern is specific
        and diagnosable: three separate surfaces -- the c-programme, the
        baseline constant, and now the Heuristic 1 controls -- each ran to its
        method ceiling and each ENDED BY FINDING A DEFECT IN ITS OWN INSTRUMENT
        rather than a fact about the object. c hit gamma <= 1 (RT3-P3); k hit a
        walled PDF and a blog; S1 and S2 hit a wrong reference measure and an
        uncentred estimator. Instruments failing before objects do is a
        statement about this programme's measurement design, and the actionable
        conclusion is that the next contract's scarce resource is
        ESTIMATOR CENTRING AND REFERENCE-MEASURE CHOICE, not primes, not
        compute, and not batches. Under docs/inventor-protocol.md section 4 that
        is forward guidance naming what remains open, not a closure.

  # ==================================================================
  # 2. THE TAIL QUESTION -- THE TASK CARD'S COMPLETION GATE
  # ==================================================================
  does_anything_here_bear_on_the_tail:
    answer: "NO. Not one measurement in BATCH-004 bears on the tail, and no amount of compute inside this contract could have made one."
    numbers: >
      Enumerated u reached [0.23540891, 3.16992500] under log(X_p)/log(B), or
      [0.19299071, 3.32168759] under the paper's definition. Heuristic 1's
      operating point at p = 5*2^248-1 is u ~ sqrt(ln(p/2)) ~ 13.1, where
      rho(13) ~ 2^-60. With 13,834 samples the tail has ZERO experimental
      resolution, by construction. The optional sampled arm would have reached
      u <~ 9 and did not run (D-2, an UNDERSPECIFICATION stop the Executor was
      right to take).
    and_the_body_is_weaker_than_reported: >
      The body measurement itself is degraded by RT4-H1 and RT4-H2: of the four
      statistics, S2's "signal" is an estimator offset, S1's verdict is a
      reference-measure error, S4's regimes are unreachable by design, and S3
      rejects both models but the rejection does not survive its own null. What
      the run establishes about the body is: the enumeration is sound (IF-1
      through IF-5 all pass, with the supersingular count brute-forced, every
      minimum computed by two independent routes plus exhaustive box search at
      TIER-0, and explicit conjugating quaternions verified), and the
      first-moment machinery is CALIBRATED at every prime and every n <= X_p.
      That is a real and non-trivial instrument result. It is not a result about
      Heuristic 1.
    binding_statement: >
      A passing or failing body statistic at p <= 2000 is not support for the
      heuristic, not support for the attack, and not a refutation of Theorem 1.1
      or of the p^{1/3+o(1)} exponent. AGENTS.md rule 7 and the contract's own
      SP-H bind, both ways, and I endorse them without qualification.

  # ==================================================================
  # 3. REQUIRED CONTROLS
  # ==================================================================
  required_controls:
    - id: NC4-1
      priority: 1
      cost: "zero compute; the numbers are already committed"
      control: >
        Re-express S2's decision against the EMPIRICAL null: compare the
        arithmetic z_2 = +8.645 to NULL-B READING_NEW_SIZE's measured
        distribution [+16.819, +19.520] over 200 replications, rather than to
        the analytic zero. Report the resulting sign.
      what_each_outcome_means: "There is only one outcome and it is already determined: the arithmetic object sits ~10 z BELOW the estimator's zero point for a genuine random integer. The S2 record must be superseded to say so."
    - id: NC4-2
      priority: 1
      cost: "zero compute for S1a/S1d; one re-run for S1c"
      control: >
        Recompute S1a and S1d against the W-CURVE enumerated CDF (uniform over
        supersingular j-invariants) instead of W-TYPE, and S1c against the
        W-CURVE pushforward on classes instead of uniform-over-types. S1c
        requires per-class walk-visit counts, which the current raw-result.json
        does not retain -- make that a required artifact.
      what_each_outcome_means: >
        If S1 passes against W-CURVE, the SAMPLER-REJECTED verdict is retired
        and replaced by "the walk samples the curve measure; the contract
        compared it to the type measure", and the measured gap is a
        Theta(p^{-1/2}) toy-scale quantity with no cryptographic analogue. If
        S1 STILL rejects against W-CURVE, then and only then is there a sampler
        finding, and it is a much stronger one.
    - id: NC4-3
      priority: 2
      cost: "reruns the same enumeration; no new mathematics"
      control: >
        A CENTRED ell = 2 statistic. Two candidates, both size-free by
        construction: (a) pair-collapse P(delta = 2k | delta in {2k-1,2k},
        X_p >= 2k), which is exactly 1/2 under any model flat within the pair
        and has no size parameter; (b) the same statistic run on arithmetic and
        on NULL-A as a two-sample comparison, which cancels the density trend to
        first order. Pre-register the null as the EMPIRICAL distribution of the
        statistic on a genuine random integer, never as an analytic zero.
      what_each_outcome_means: "This is the measurement RT-H3 has been asking for since BATCH-001 and it has still not been made. A rejection here would be the first real constant-factor result of the campaign; a pass would narrow RT-H3 for the first time."
    - id: NC4-4
      priority: 2
      cost: "one arithmetic line, already done in this report"
      control: "Adopt lambda = 2.1592 from V2 and close the NC2f cross-check; then re-derive whether RT2-C7 is genuinely subsumed by k or sits 0.6-2.1 bits below it."
    - id: NC4-5
      priority: 3
      cost: "one fetch with a shell"
      control: "Retrieve [15] full text and [40] WayFinder's cost model; replace the blog citation and bound k's lower end. Both are named by the producer as the highest-value open channels and I concur."
    - id: NC4-6
      priority: 3
      cost: "contract design, no compute"
      control: >
        Redesign S4's rarity lever. My measured lambda_hat(B=2) =
        3.7603 * p^(-0.1604) shows the targets 0.30/0.10/0.03 are unreachable at
        every prime the contract declares. Either the targets move to reachable
        values with the discriminating DIRECTION check retained, or the lever
        changes from p to something that actually drives lambda down.

  counterexample_or_mutation: >
    THE SINGLE STRONGEST ONE, AND IT COSTS NOTHING. Mutate S2's null from the
    analytic p_null = sum_i w_i floor(n_i/2)/n_i to the EMPIRICAL distribution
    of the same statistic on a uniform random integer of the same size scaffold
    -- which the run already computed as NULL-B READING_NEW_SIZE. Under the
    analytic null the arithmetic object reads +8.645 sigma and is "voided" by
    NULL-A at +8.735. Under the empirical null the arithmetic object reads
    ~10 sigma BELOW a genuine random integer, NULL-A reads there too, and the
    reported constant factor of +0.1972 bits reverses to -0.1900 bits against
    the only exogenous size model in the contract. One substitution, no new
    data, and both the sign and the mechanism of the batch's headline change.
    The counterexample that proves the estimator rather than the object is at
    fault is the run's own NULL-B second reading: 200 of 200 replications of a
    bona fide random integer land in [+16.819, +19.520].

  # ==================================================================
  # 4. BASELINE COMPARISON
  # ==================================================================
  baseline_comparison:
    the_problem: "Supersingular isogeny / EndRing, not a discrete logarithm. Pollard-rho and BSGS are not the frontier here and quoting them would be a category error; they are recorded so the comparison is complete."
    rows:
      - method: "Pollard rho / BSGS on a group of order N"
        cost: "N^{1/2} time; BSGS N^{1/2} memory, rho negligible memory"
        relevance: "NOT APPLICABLE. There is no group whose order controls the isogeny search. Recorded to close the axis, not to compare."
      - method: "Delfs-Galbraith 2016 [21], plain"
        cost: "p^{1/2} walk steps, negligible memory. WITH the constant this batch retrieved: c * p^{1/2} * log_2 p F_p-multiplications, c in [0.75, 1.05], i.e. k = 64.0 to 89.6 F_{p^2}-mults per unit p^{1/2} at 256 bits (mu = 3)."
        status: "the campaign's baseline of record; its constant was uncited until this batch and is now cited from a blog, not the paper."
      - method: "Delfs-Galbraith + SuperSolver [15], CRYPTO 2022"
        cost: "same p^{1/2} exponent, faster by s in [3, 19] over 50 to 800 bits; s(256) estimated 7.62 to 9.33 by interpolation whose functional form is the producer's, not the authors'."
        status: "the correct best-known classical baseline on the evidence retrieved. Full text NOT obtained (eprint 403)."
      - method: "WayFinder [40], ePrint 2026/1219"
        cost: "generalises DG and SuperSolver; claims improvement on the state of the art plus a more accurate cost model. Constants NOT retrieved."
        status: "DOMINATES the baseline row. Makes k an upper bound with no established lower bound (RT4-C1e)."
      - method: "van Oorschot-Wiener interpolation on the attack side"
        cost: "p^{1/2+o(1)}/w^{1/2} time at memory w, interpolating back to the p^{1/2} baseline as w falls"
        status: "carried correctly throughout this campaign. Memory is quoted beside time at every margin row (2^93.28 entries at NIST-I) and the memory axis is explicitly a trade, never a domination. No objection."
      - method: "Wesolowski 2026, the object under review"
        cost: "p^{1/3+o(1)} time AND memory, conditional on Heuristic 1"
        status: "exponent unchallenged by anything in this batch, in either direction."
    total_cost_bookkeeping_recheck: "VERIFIED AGAIN, no objection. log2 T = log2 M - log2 P0 is per-attempt cost times inverse success probability with a full table rebuild per attempt; P0 is never silently set to 1; the vOW regime divides that same total by sqrt(w). Nothing in BATCH-004 disturbs it."

  # ==================================================================
  # 5. HEURISTIC AND COST-MODEL CHALLENGES
  # ==================================================================
  heuristic_challenges:
    - "HEURISTIC INVENTORY: still NOT MET at the programme's own level. There is STILL no numbered HEUR-NNN record for Heuristic 1 and no hypothesis-level proof_search_map, first surfaced when the contract was frozen and repeated by the Executor as a Coordinator action. A campaign four batches deep whose binding uncertainty is an unnumbered heuristic has an inventory defect, not a research defect, and it is cheap to fix."
    - "RANDOM-MODEL TRANSFER: the deviation that matters is 'the minimum of a structured integral ternary form is not a uniformly random integer', and this batch did NOT test it. Criterion (a) explicitly demands the deviation be SPECIFIC to maximal orders, which is not what Heuristic 1 claims (RT4-H3). The cheapest experiment that would expose a systematic deviation remains the centred ell = 2 statistic of NC4-3, plus the same construction at ell in {3,5,7,11} with an exogenous null."
    - "SCALE HONESTY: the exemplar validates at p = 5*2^248-1 (100,000 samples) and p = 27*2^500-1 (10,000 samples) via the Deuring correspondence. This batch validates at p <= 2000 with 13,834 samples and X_p <= 9. The gap is not a criticism of the run, which says so itself in OBS-CEILING and in its executor_assessment; it IS a reason no promotion gate is anywhere near met."
    - "MULTIPLICITY AND MINIMALITY EFFECTS (exemplar Remark 1): untouched. delta_E is the degree of the SMALLEST isogeny E -> E^(p); conditioning on minimality can correlate with divisibility even when representation is class-uniform, which is RT-H3's original body and remains unmeasured."
    - "FALSIFICATION CONDITION PRESENT AND HONOURED: the contract states its falsification criterion in advance, evaluates it exactly as frozen, and records four of five pre-registered predictions as NOT MET without dressing any of them up. That discipline is real and I do not want it lost in the objections above."

  cost_model_challenges:
    - "RT4-C1a: the margin's net sign is not resolved by k; only the baseline term's is. HZ-2 is binding, not advisory."
    - "RT4-C1b: HZ-1's subsumption of RT2-C7 needs lambda, and lambda = 2.1592 is derivable from the report's own V2 extract. Converted, RT2-C7 gives 3.89-5.89 bits against row A's 6.00-6.49 -- overlapping, not identical."
    - "RT4-C1c: with that lambda the NC2f cross-check closes at 2^4.43-2^4.92 (c-law) or 2^5.05 (direct) per DG step at p ~ 2^40, against a pre-registered 2^5..2^7 band. Free corroboration, and it says the band is if anything high."
    - "RT4-C1d: V2 implies c = 1.1483, 9.4% above the stated band top. One instance; not a refutation; the free E-1 consistency check nobody ran."
    - "RT4-C1e: WayFinder makes k an upper bound with no lower bound. The sign survives only while the best-known baseline is under 64-90x faster than plain DG at 256 bits; SuperSolver reaches 7.6-9.3x."
    - "RT3-C8 / L4 at 11.50-13.25 bits REMAINS THE DOMINANT RESIDUAL and k does not displace it. The producer says this itself and is right."
    - "MEMORY: carried beside time at every row, unchanged. The o(1) overhead disclosure is unchanged. No new objection."
    - "The comparison remains asymmetric in the attack's DISFAVOUR on the attack side (measured overhead charged) and, until k is adopted, in the attack's FAVOUR on the baseline side (nominal one-op-per-step). Adopting k on rows that already carry the corrected bracket is the symmetrising move, not a new pro-attack thumb on the scale -- provided HZ-1 is resolved first so RT2-C7 is not added twice."

  reduction_and_scope_challenges:
    - "SCOPE INFLATION, none found in the run packages. Both execution reports scope their own claims correctly and repeatedly; the S1 report even carries a MANDATORY_SCOPE clause forbidding conversion of its verdict into a statement about the paper's unstated sampler, and it is honoured."
    - "SCOPE INFLATION, one instance in the DISPATCH FRAMING rather than in any committed artifact: 'k moves margins UP by 1.75-6.49 bits, in the attack's favour' drops HZ-2's restriction to rows already carrying the corrected overhead bracket. On the paper's raw Section 4.1 pairs that is the exact mirror of the error RT3-C9 forbade in the other direction."
    - "AFFECTED-vs-SAFE: unchanged and correct. Nothing in this batch bears on CSIDH, (qt-)Pegasis, or torsion-based constructions, and both runs say so."
    - "REDUCTION INSTANTIATION: no new corollary is claimed in this batch, so nothing new to check. The standing defect in Corollary 1.2 (cites a nonexistent Proposition 8.5 of [35] and silently imports GRH for the isogeny direction) is unaffected and remains recorded."

  proof_architecture_challenges:
    - id: RT4-P1
      attack: "nearby-object"
      finding: >
        The contract names NULL-A as its nearby object: "NULL-A is the closest
        object where the arithmetic origin is removed". That is the right SHAPE
        of control and the wrong PLACEMENT: it sits inside the falsification
        criterion, where it can only ever subtract power. Its correct place is
        the mechanism-attribution column, reported beside a finding rather than
        able to veto one. Cheapest fix: keep NULL-A verbatim, delete "surviving
        NULL-A" from criteria (a) and (b), and add an explicit empirical null
        for the estimator.
    - id: RT4-P2
      attack: "quantifier-order"
      finding: >
        S2's model is NOT IDENTIFIABLE as stated. "delta_E factors/behaves like a
        uniform random integer of ITS OWN size n_i" quantifies the size AFTER
        seeing the outcome; the size parameter is the outcome. Every coherent
        test must fix an exogenous size first (M2 does; M1 does not). This is the
        quantifier-order audit failing on a frozen contract, and it is exactly
        the class of defect section 8's pre-compute audits exist to catch. It was
        not caught because no proof_search_map exists for this hypothesis.
    - id: RT4-P3
      attack: "method-ceiling"
      finding: >
        Derive the largest claim this contract's resource measure can support:
        with X_p <= 9 the entire delta_E distribution lives on nine atoms, so
        every statistic here is a statement about a nine-point distribution.
        Under ideal tuning that ceiling supports "the nine-point body at p <=
        2000 is or is not consistent with model M" and nothing else. It does not
        reach a tail statement, a constant factor at the operating point, or a
        margin row. The ceiling was correctly declared by the run (OBS-CEILING)
        and I confirm it independently.
    - id: RT4-P4
      attack: "compositional-invariant"
      finding: >
        Delete the delta_E = 1 spike from the data and both headline effects
        collapse: it carries 64.2% of S2's offset and it is the entire
        W-CURVE/W-TYPE gap that drives S1. Its mass is Theta(p^{-1/2+o(1)})
        (measured exponent -0.4587 over 299 primes). ONE OBJECT EXPLAINS BOTH
        HEADLINES OF THIS BATCH, and it is the object that provably vanishes at
        cryptographic scale. That is the compositional-invariant attack
        succeeding, and it is the most compact statement of what BATCH-004
        measured.

  # ==================================================================
