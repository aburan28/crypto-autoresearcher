  # =====================================================================
  # THE CENTRAL CHECK: S2's VOID
  # =====================================================================
  central_check_S2_void:
    question_as_posed: >-
      Is the VOID of S2's parity signal correct, in both directions -- was a
      large plausible finding correctly killed, or was a genuine falsification
      of the random-integer model thrown away?
    answer: >-
      THE VOID IS CORRECT. It follows from the frozen contract's own rule as
      written, and it is also substantively right: the Validator's own
      diagnostics show the S2 rejection statistic is INTRINSICALLY POSITIVELY
      BIASED on data of this shape, so the +8.645 excess is not evidence about
      maximal orders at all. If anything the arithmetic value sits BELOW what
      genuinely random-integer data give under the same estimator, so the
      direction is the opposite of a parity excess. Nothing was thrown away.

    step_1_recomputation_of_the_arithmetic_arm:
      method: >-
        Validator code, ~40 lines, exact rational arithmetic (fractions.Fraction),
        reading only per_prime_records[*].classes[*].{delta_E, galois_stable,
        aut_half_order_w} from the committed raw-result.json. Implements the
        contract's S2 formula verbatim: q_i = floor(n_i/2)/n_i, p_null =
        sum w_i q_i / sum w_i, Var_null = sum w_i^2 q_i(1-q_i)/(sum w_i)^2,
        p_obs = weighted even fraction, Var_obs = p_obs(1-p_obs) sum w_i^2 /
        (sum w_i)^2, z_2 = (p_obs - p_null)/sqrt(Var_obs + Var_null).
      n_records_used: 13834
      results:
        W-CURVE:
          validator_z2: 8.645103378616307
          reported_z2:  8.645103378616307
          agreement: BIT-IDENTICAL
          validator_p_obs_exact: 9370/23239
          validator_p_null_exact: 2574461/7320285
          exact_rational_decision_(p_obs-p_null)^2_gt_9(Var_obs+Var_null): true
        W-TYPE:
          validator_z2: 8.173740018469834
          reported_z2:  8.173740018469834
          agreement: BIT-IDENTICAL
        W-MASS:
          validator_z2: 8.202003983752695
          reported_z2:  8.202003983752695
          agreement: BIT-IDENTICAL
      C1_recomputed: "MET (|z_2| = 8.645 > 3, confirmed in exact rational arithmetic)"
      C2_recomputed:
        by_p_mod_8_W_CURVE:
          "1": {n: 3036, z2: 5.104314, sign: +1, abs_gt_3: true}
          "3": {n: 3490, z2: 4.098912, sign: +1, abs_gt_3: true}
          "5": {n: 3474, z2: 2.149065, sign: +1, abs_gt_3: false}
          "7": {n: 3834, z2: 6.086876, sign: +1, abs_gt_3: true}
        verdict: "MET (3 strata with |z|>3, all sign +1; contract requires >= 2 of the same sign)"
      C3_recomputed:
        TIER-0_alone: {n: 287, z2: 2.453126, sign: +1}
        TIER-1_alone: {n: 13547, z2: 8.441217, sign: +1}
        basis: "TIER-0 alone vs TIER-1 alone -- the contract's own verbatim fallback when no tier beyond TIER-1 completes"
        verdict: MET
      conclusion: "The three-part rejection condition genuinely fired, exactly as reported."

    step_2_recomputation_of_NULL_A:
      validator_z2_W_CURVE: 8.735230131717895
      reported_z2:          8.735230131717895
      agreement: BIT-IDENTICAL
      sign: +1
      note_on_the_null_weighting: >-
        The reported NULL-A z_2 is obtained under the run's DECLARED
        transported W-CURVE rule (w = 1 if the form's minimum is 1, else 2),
        which the Validator reconstructed and confirmed. The per-sample `w`
        field stored in null_A_samples is the W-TYPE weight (identically 1);
        using it instead gives 8.108186622870564, which is the W-TYPE figure.
        No inconsistency: the transported rule is documented in
        NULL_A.weighting_rule_for_the_null and is applied at aggregation.

    step_3_is_NULL_A_a_null_object_of_the_same_shape:
      contract_definition: >-
        "positive-definite integral ternary quadratic forms of the same
        determinant as the arithmetic family ... Compute delta_null = the
        form's minimum by the identical exhaustive short-vector code path used
        for delta_E."
      checks_performed_by_the_validator:
        same_determinant: >-
          YES. null_a_forms() constructs (N1,N2,N3,x,y,z) and rejects any form
          with 4*det(G) != p, so every accepted form has determinant p/4,
          exactly as the arithmetic trace-zero form (rank3_gram_det = p/4 in
          the per-class records).
        same_cardinality_and_stratification: >-
          YES. 13834 forms, generated per prime with n_forms = n_types(p), so
          the null carries the same prime stratification and the same total
          sample size as the arithmetic arm. requested = generated = 13834;
          228195 draws consumed (rejection sampling), no prime short.
        same_support: >-
          YES. Both arms have delta support exactly {1,...,9} (X_p <= 9 over
          the completed range). Distributions differ, as a null object should:
          arithmetic (4429,1984,2404,1803,1753,791,555,107,8) against NULL-A
          (5885,1853,1931,1303,1324,617,622,261,38).
        same_code_path:
          shortest_vector: >-
            YES, verified in source: heuristic_tail.py line 1199 (arithmetic
            delta_E) and line 1397 (NULL-A) both call the SAME function
            short_vectors_at_least_one(G, X_p).
          statistic: >-
            YES, verified in source: line 2784 computes the arithmetic S2 via
            s2_core(samples, wt) and line 2798 computes the NULL-A S2 via
            s2_core(null_a_samples, wt) -- the identical function, with the
            identical weight_of() helper.
        verdict: >-
          NULL-A IS a null object of the same shape under the contract's
          definition, and the same code path demonstrably produced both arms.
      one_recorded_reservation: >-
        The construction draws N1 ~ U[1, X_p] and the minimum is then read off
        the reduced form, so the null's delta distribution is close to (though
        not identical with) uniform on [1, X_p]. That is a legitimate reading
        of "random integral ternary forms of the same determinant", but it
        means NULL-A is also, incidentally, close to an M2-truth object. This
        makes its reproduction of z_2 = +8.74 unsurprising in hindsight -- see
        V-B4-01, where the Validator shows an EXPLICITLY M2-truth synthetic
        arm gives z_2 ~ +12.5 to +13.5.

    step_4_NULL_B_calibration_claim:
      claim_under_test: "z_2 in [-1.89, +1.64] over 200 replications, 0 of 200 exceeding 3"
      validator_independent_replication:
        method: "Validator code, own RNG (seed 999333), 200 replications, exact rational z_2"
        KEEP_SIZE_reading: {min: -1.8887, max: 1.6872, mean: 0.0284, count_abs_gt_3: 0}
        reported:          {min: -1.888674481144594, max: 1.643493810649473, mean: -0.00063824875535484, count_abs_gt_3: 0}
        agreement: "Reproduced within Monte-Carlo noise. The calibration claim is TRUE as stated."
      but_what_it_actually_establishes: >-
        LESS THAN THE REPORT'S FRAMING IMPLIES, and this is a finding
        (V-B4-01). Under the KEEP_SIZE reading the null probabilities q_i are
        held at the ORIGINAL observed sizes while only the parities are
        re-drawn, so the arm is exactly calibrated BY CONSTRUCTION (it is a
        weighted sum of independent Bernoulli(q_i) with the q_i known). It
        therefore verifies the arithmetic of the z formula and its variance --
        and CANNOT detect the estimator's self-referential bias, because that
        bias arises precisely from evaluating q_i at the observed value
        itself.
      the_reading_that_matches_how_the_arithmetic_arm_computes_q:
        NEW_SIZE_reported: {min: 16.818982749412662, max: 19.52013770787415, count_abs_gt_3: 200}
        NEW_SIZE_validator: {min: 18.0001, max: 20.9450, count_abs_gt_3: 200}
        reading: >-
          On data generated to be M1-TRUE, the identical procedure the
          arithmetic arm applies returns z_2 ~ +18 in every one of 200
          replications. The instrument does NOT report ~0 on null data of this
          kind; it reports a large positive number. The run discloses both
          readings in its own numbers block (deviation D-3), which is why this
          is a finding about framing rather than about honesty.

    step_5_does_the_void_follow_from_the_contract_as_written:
      contract_rule_verbatim: >-
        controls.void_criterion_binding.per_statistic_form:
        "S2: if |z_2| > 3 with the same sign on NULL-A, the S2 signal is VOID."
      evaluation: >-
        |z_2(NULL-A)| = 8.735 > 3, sign +1, identical to the arithmetic sign
        +1. The rule fires. The general form of the criterion ("appears at the
        same MAGNITUDE and sign") also fires: 8.735 against 8.645 is the same
        magnitude to within 1%.
      implementation_check: >-
        heuristic_tail.py lines 2899-2903 implement exactly this and nothing
        else: nullA_same = (|z|>3 on NULL-A W-CURVE) AND (sign == pooled sign);
        verdict = "VOID (NULL-A reproduces the signal)" when C1 AND C2 AND C3
        hold and nullA_same is true. No threshold was adjusted, no range
        restricted, no instrument repaired.
      falsification_criterion_check: >-
        Criterion (a) requires the S2 rejection to SURVIVE NULL-A. It does
        not. (a) correctly does not fire.
      verdict: "THE VOID FOLLOWS FROM THE CONTRACT'S OWN RULE AS WRITTEN."

    step_6_the_validators_own_decisive_diagnostic:
      why_it_was_run: >-
        A void is only as good as the null. The Validator therefore tested
        whether the S2 statistic can distinguish ANYTHING, by running it on
        data with no arithmetic content at all.
      construction: >-
        For each of the 13834 classes, draw delta ~ Uniform[1, X_p] with the
        actual per-prime X_p -- i.e. data generated EXACTLY from the
        random-integer model M2, with the arithmetic removed entirely -- and
        compute z_2 by the Validator's own S2 implementation.
      results_three_independent_draws:
        - {W-CURVE_z2: 13.5494, W-TYPE_z2: 13.1895}
        - {W-CURVE_z2: 12.4753, W-TYPE_z2: 12.1616}
        - {W-CURVE_z2: 13.1528, W-TYPE_z2: 12.8156}
      analytic_explanation:
        statement: >-
          For a distribution supported on small integers, E[1{n even}] -
          E[floor(n/2)/n] is strictly positive. q(n) = floor(n/2)/n is the
          probability that a DIFFERENT uniform integer in [1,n] is even; it is
          not the probability that n itself is even. The statistic therefore
          measures a construction artifact, not an arithmetic property.
        exact_bias_for_uniform_on_1_to_X:
          X=2: {P_even: 0.5000, E_q: 0.2500, bias: +0.2500}
          X=3: {P_even: 0.3333, E_q: 0.2778, bias: +0.0556}
          X=5: {P_even: 0.4000, E_q: 0.3467, bias: +0.0533}
          X=7: {P_even: 0.4286, E_q: 0.3803, bias: +0.0483}
          X=9: {P_even: 0.4444, E_q: 0.4007, bias: +0.0437}
      consequence_stated_plainly: >-
        The arithmetic z_2 = +8.645 is SMALLER than what data generated
        exactly from the random-integer model give under the same estimator
        (+12.5 to +13.5), and smaller than NULL-A (+8.735), and far smaller
        than NULL-B under the reading the arithmetic arm actually uses
        (+16.8 to +19.5). The pre-registered three-part condition C1 AND C2
        AND C3 therefore had NO POWER against the hypothesis it was written to
        test. Voiding it was not merely permitted, it was compelled.
      what_this_does_NOT_license: >-
        It does not license reading the shortfall as evidence of a parity
        DEFICIT in maximal orders either. The estimator's bias depends on the
        size distribution, and the arithmetic and synthetic arms have
        different size distributions, so the comparison is not controlled in
        that direction. The correct statement is that S2 as frozen measures
        nothing about ell = 2 arithmetic. RT-H3's refutation channel is
        NEITHER narrowed NOR opened by this run.

