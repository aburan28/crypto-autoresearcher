    - id: V-B4-17
      severity: LOW
      package: PKG-HEUR
      title: "The sampled arm's missing sample size is a genuine contract defect (D-2 confirmed)"
      statement: "See deviation_adjudications D-2. Recorded here so it reaches the ledger as a contract-repair item rather than only as a run deviation."
    - id: V-B4-18
      severity: LOW
      package: PKG-BIB
      title: "dominated_by and sota_delta are properly filled, with one row honestly left UNCHECKED"
      statement: >-
        Inventor-protocol Pareto honesty is satisfied: dominated_by names a row
        actually retrieved ([40] WayFinder, ePrint 2026/1219), is not null,
        eight frontier rows are enumerated with per-row "checked_how", one row
        (ePrint 2026/1516) is explicitly declared UNCHECKED rather than
        dismissed, and the completeness statement declines to claim
        exhaustiveness. sota_delta is quantitative (before log2 k = 0; after
        +1.75 to +6.49 bits, with 0.49-3.15 bits of new interval width). This
        is a positive finding, recorded because an unchecked null would have
        been a rule-9 fabrication and it is not one here.
    - id: V-B4-19
      severity: LOW
      package: PKG-PEC
      title: "Clause (b) fails by 0.032% of the band edge"
      statement: >-
        PRIMARY-A's per-ell reading reaches 1.1503204217789973 against a band
        ceiling of 1.15. Recorded so no reader mistakes clause (b) for a
        decisive failure. The disposition does not depend on it: clause (d)
