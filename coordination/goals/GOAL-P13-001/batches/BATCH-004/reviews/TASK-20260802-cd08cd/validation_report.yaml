  # =====================================================================
  # FINDINGS, RANKED BY SEVERITY
  # =====================================================================
  findings:
    - id: V-B4-01
      severity: HIGH
      package: PKG-HEUR
      target: "the FROZEN CONTRACT's S2 rejection statistic -- not the run"
      title: "S2's size-matched null is self-referential, so the statistic is intrinsically positively biased and had no power"
      statement: >-
        The contract defines q_i = floor(n_i/2)/n_i evaluated at the OBSERVED
        delta_E, i.e. the probability that a DIFFERENT uniform integer in
        [1, n_i] is even, and compares it with the fraction of observed
        delta_E that are even. For any distribution supported on small
        integers these differ by a strictly positive amount. The Validator
        measured this three ways: (i) analytically, the bias for uniform on
        [1, X] is +0.044 at X = 9 and +0.25 at X = 2; (ii) on data generated
        EXACTLY from the random-integer model M2 (delta ~ U[1, X_p]), z_2
        comes out at +12.5 to +13.5, LARGER than the arithmetic +8.645; (iii)
        the run's own NULL-B NEW_SIZE arm -- the reading that matches how the
        arithmetic arm computes q -- gives +16.8 to +19.5 on M1-true data in
        200 of 200 replications.
      consequence: >-
        The pre-registered condition C1 AND C2 AND C3 could not have
        discriminated a parity bias from no parity bias. The VOID is right and
        the null object did exactly the job the inventor protocol assigns it.
        But no record may describe the run as having "narrowed RT-H3's
        refutation channel": a test with no power narrows nothing.
      not_the_producer_s_fault: >-
        The Executor implemented the frozen formula verbatim (s2_core, lines
        1725-1764), ran the pre-registered null, reported the void, attempted
        no repair, and disclosed the NEW_SIZE numbers that make the defect
        visible. This is a contract-design defect.
      what_the_report_should_have_said: >-
        The execution report's block `the_estimator_is_not_at_fault` cites
        only the KEEP_SIZE range and concludes "the S2 statistic is exactly
        calibrated by construction". That is true only in the trivial sense
        (the KEEP_SIZE arm holds q_i fixed and re-draws parities, so it is
        calibrated by construction and cannot detect this bias). The NEW_SIZE
        numbers appear in the same document, so nothing is hidden -- but the
        framing selects the arm that exonerates the instrument.
      recommended_action_for_the_coordinator: >-
        A superseding contract under a NEW EXP id must replace the S2
        rejection statistic. A defensible replacement compares the observed
        parity against the parity of a size-matched surrogate drawn from the
        SAME size distribution, or conditions on the size distribution
        explicitly. Until then, z_2 = +8.645, the C1/C2/C3 firing, and
        log2(p_obs/p_null) = 0.1972 bits must never be quoted as properties of
        maximal orders.
    - id: V-B4-02
      severity: HIGH
      package: PKG-BIB
      title: "A STATED_ABSENCE is falsified by the Validator's own retrieval, and a CLOSED lane rests on it"
      statement: >-
        baseline_constant_report.yaml sources.SUTH extract BATCH records:
        "Absent. Both retrieval passes report no statement in this paper about
        amortizing or batching the evaluation over many j-invariants. label:
        STATED_ABSENCE", and rt3_c8_disposition builds on it:
        "the_absence_is_itself_the_finding ... The batched-evaluation
        literature RT3-C8 needs is therefore NOT this paper", closing the lane
        under honest_accounting.closures_enumerated.
        THE SOURCE CONTAINS SUCH A STATEMENT. Re-fetched by the Validator from
        https://ar5iv.labs.arxiv.org/html/1202.3985 : "since we expect to
        count points on many curves (~ log q), we can take advantage of
        BATCHING, whereby we extend Algorithm 1 to take multiple inputs
        j(E_1) in F_{q_1}, ..., j(E_k) in F_{q_k} and produce corresponding
        outputs for each (the F_{q_i} may coincide, but they need not).
        Provided k = O(log l), this does not change the time complexity
        (relative to the largest F_{q_i}), since the most time-consuming steps
        depend only on l, not j(E), and the space complexity is increased by
        at most a factor of k." with a footnote "These remarks also apply to
        Algorithm 2."
      why_it_matters: >-
        (i) A stated absence is a positive claim about a source, and this one
        is false. (ii) The clause "the F_{q_i} may coincide" places it in
        RT3-C8's own setting (many j in one field), and "the most time-consuming
        steps depend only on l, not j(E)" is precisely the amortization
        statement RT3-C8 hoped to find. (iii) It bears on the campaign's
        DOMINANT residual, RT3-C8/RT2-C4 at 11.50-13.25 bits.
      the_honest_corrected_reading: >-
        Sutherland DOES supply a batching statement, but with a batch-size
        ceiling of k = O(log l), far below the N >> l arguments RT3-C8's
        argument needs, and for algorithms that do not take Phi_l as input.
        The lane's substantive conclusion may well survive re-argument -- but
        it must be re-argued on the text, not on an absence.
      recommended_action: >-
        The ledger archive must not carry the closure as written. Under the
        inventor protocol's closure standard (a named obstruction plus an
        argument), the named obstruction is factually wrong and the lane
        reverts to OPEN pending a corrected reading. This finding does not
        change the direction of RT3-C8's estimate; it removes a false ground
        for closing it.
    - id: V-B4-03
      severity: HIGH
      package: PKG-PEC
      title: "Clause (a) is one comparison, not two, and on the new grid the null is not a same-code-path nearby object"
      statement: >-
        A-4 is CONFIRMED by independent recount: NULL-A and NULL-B are
        bit-identical (cost, per_entry, entries, roots hash, inversions) at all
        108 (ell, p, j) null cells, including at ell in {47,101,151,211}. So
        alpha_null = 1.068080386686897 is ONE measurement and both FC-4-NEW
        comparisons share their null term exactly.
      the_deeper_point_the_run_records_but_does_not_draw_out: >-
        The reason they are identical is that the null performs only degree-2
        isogeny steps, so no polynomial it multiplies exceeds 4 coefficients
        and poly_mul_kara always delegates to schoolbook. The entire purpose of
        the new grid was to escape the regime where the two implementations
        execute the identical code path (C-KARA's converse). The PRIMARY object
        escapes it; the NULL OBJECT DOES NOT. On the new grid the null is
        therefore not exercising the multiplication routine whose p-scaling the
        comparison is about.
      a_second_symptom: >-
        alpha_null moves from 0.9935080487 on the old grid to 1.0680803867 on
        the new grid, a +0.0746 shift on an object whose per-entry cost is
        O(1) in ell by construction. Under the mechanism claim FC-4 tests --
        that the p-scaling is a property of the shared poly_powmod loop and
        therefore common to both objects -- the null's alpha should not depend
        on which ell grid it is measured over. Most of the shrinkage of the
        FC-4 gap between grids (0.1662 -> 0.0612) comes from the NULL moving,
        not from the primary moving.
      consequence: >-
        Clause (a)'s "does not fire on either arm" is WEAK evidence: it is one
        comparison against a null that does not track the primary's code path
        on this grid, between arms that are additionally non-independent
        through the paired CZ seeds. This does NOT change the disposition
        (STANDS fires on clauses (b) and (d) regardless), but it means clause
        (a) must never be cited on its own as showing the mechanism holds where
        the p-scaling is applied.
      recommended_action: >-
        Any successor contract that wants an interpretable FC-4-NEW needs a
        null object that exercises the same multiplication path at the same
        ell -- e.g. a null whose polynomial degrees track ell rather than being
        pinned at 2.
    - id: V-B4-04
      severity: MEDIUM
      package: PKG-INFRA
      title: "The quarantine marker misstates what RUN-PEC-d7979c-a contains"
      statement: >-
        INCOMPLETE_INFRASTRUCTURE_FAILURE.md says "raw-result.json parses and
        carries the contract binding and preamble" and "no statistic reached a
        recorded verdict against its pre-registered threshold". The second
        clause is FALSE. The Validator opened the file: it carries
        finished_utc 2026-08-03T00:45:42Z, total_wall_clock_seconds 2809.624,
        216 primary and 216 null samples, all eight control verdicts pass,
        validity.status "completed_valid", SL1-SL4 all MET, all five FC-4
        conjunction clauses, and fc4_disposition.verdict_word = "STANDS".
        The COMPUTATION COMPLETED; only the receipt bundle (manifest,
        execution report, stdout/stderr .txt) was never written. The BATCH-004
        queue's infrastructure_incident block repeats the mischaracterisation
        by calling the directory "PARTIAL".
      direction: >-
        The error UNDERSTATES the producer's position, so it is not
        self-serving. But a committed record asserting a false fact about its
        own contents is a correction the ledger archive must make.
      the_favourable_fact_this_uncovers: >-
        RUN-PEC-d7979c-a and RUN-PEC-d7979c-b are BIT-IDENTICAL at all 216
        primary and all 216 null sample cells and at every headline verdict
        (same alphas, same clauses, same STANDS, same SL verdicts, same L2
        anchors). That is a genuine second execution of the whole pipeline in
        a separate process and session, and it is a determinism demonstration
        the batch does not currently claim.
      the_unfavourable_fact_it_also_uncovers: >-
        The re-run was therefore NOT blind: a completed computation of the same
        quantities existed on disk before RUN-PEC-d7979c-b's receipt was
        written. The Validator finds no evidence of contamination -- the frozen
        contract is byte-identical to dfe285d4, the execution report states no
        number is carried forward, and every -b number was independently
        reproduced by the Validator from -b's own samples -- but the fact
        should be recorded rather than left implicit in a directory the
        marker describes as partial.
    - id: V-B4-05
      severity: MEDIUM
      package: PKG-HEUR
      title: "S3's void criterion is vacuous under one of its two readings, and the verdict matrix presents both as co-equal"
      statement: >-
        NULL-B2 (M2-truth) yields LLR = -infinity in every replication --
        confirmed by the Validator in 40 of 40 own draws -- because a
        replacement value drawn from [1, X_p] can carry a prime factor
        impossible for an integer <= n_i, sending ln f1 to -infinity. The span
        of the union of the two null distributions is therefore
        [-inf, ~16164], and ANY finite observed LLR lies inside it. Under the
        UNION_SPAN reading the S3 discrimination is VOID by construction,
        whatever the data.
      consequence: >-
        The reported VERDICT_matrix gives equal billing to a reading that
        cannot fail to fire and a reading (OR-of-ranges) that carries actual
        information. The honest statement is that the void criterion as frozen
        is unusable under one reading, not that the verdict is genuinely
        50/50.
      recommended_action: "A superseding contract must define 'not separated from both' unambiguously and must handle a degenerate null arm explicitly."
    - id: V-B4-06
      severity: MEDIUM
      package: PKG-HEUR
      title: "PH3 'MET -- S3 prefers M1' is the weakest of the run's results and must not be read as support for M1"
      statement: >-
        Three of the run's own numbers point the other way and the Validator
        confirmed all three: (i) AN-3, the observed LLR 14508.91 lies BELOW
        the M1-truth null range (reported [15682.01, 16164.30]; Validator's own
        40 draws [15718.16, 16086.27]) -- the data prefer M1 by LESS than data
        generated from M1 do; (ii) by absolute fit M2 is about five times
        better (KS D 0.0610 against 0.3165) and BOTH models are rejected at
        MC p = 1/10001; (iii) NULL-A's LLR is 16512.48 and selects the same
        model, so the preference is reproduced on an object with no arithmetic
        content.
      consequence: >-
        S3 discriminates nothing. Falsification criterion (b) correctly does
        not fire. No record may present PH3 = MET as evidence that the
        actual-size model describes delta_E.
    - id: V-B4-07
      severity: MEDIUM
      package: PKG-HEUR
      title: "The two INVALID secondary signals would have been VOIDED, and must never be revived"
      statement: >-
        See secondary_signals_adjudication. The Validator built the missing
        nulls from the run's own NULL-A samples: the prime-minimum-rate excess
        is +0.118623 on the arithmetic object and +0.115590 on the null; the
        mod-ell chi-squares are 2208/8519/17172/18713 on the arithmetic object
        and 1752/5529/10866/14558 on the null.
      consequence: >-
        The INVALID label was the contract's rule correctly applied, and it is
        also substantively right. A successor experiment that re-runs these
        statistics WITH a pre-registered null is worth designing; quoting the
        current numbers is not.
      label_binding: "The null figures above are the Validator's own supplementary measurements and are NOT run evidence."
    - id: V-B4-08
      severity: MEDIUM
      package: PKG-BIB
      title: "Blog extract V2 is characterised as 'A SINGLE INSTANCE'; the source says it is an average over 5000 j-invariants"
      statement: >-
        The report's cross-check labels V2 "A SINGLE INSTANCE with different
        node counts (318 vs 1897), so it conflates instance variance with
        efficiency". The sentence immediately preceding the quoted text in the
        source reads: "For example, AVERAGING OVER 5000 pseudo-random
        supersingular j-invariants in F_{p^2}, for p = 2^24-3, SuperSolver
        ... used 53900 F_p multiplications and walked on 318 nodes."
      direction: >-
        Conservative -- the datum is stronger than the report allows, so the
        third-point consistency check (s(256) ~ 9.117 from an independent
        pair) is better supported than claimed. But the verbatim extract was
        truncated in a way that drops a qualifier which changes its meaning,
        and the surrounding characterisation is wrong.
      recommended_action: "Correct the label; the numbers do not move."
    - id: V-B4-09
      severity: MEDIUM
      package: PKG-PEC
      title: "R-1's repair is demonstrated only where V-1's concern was smallest"
      statement: >-
        All ten NC2b-G1-VAR points sit on the W-ALL (n = 25) and W-MID
        (n = 21) null windows, where T lands in [0.250, 0.337]. V-1's largest
        figure (+/-1.3626 bits) is for the 8-point W-TOP confirmatory window,
        which the contract's own "ten, not fifteen" scoping excludes. So the
        variance-aware repair was evaluated on the points where the fixed
        0.75-bit tolerance was already generous, and not on the arm whose
        verdict V-1 said was uninterpretable.
      consequence: >-
        SL4 being met 10/10 is a true statement about the ten points and NOT
        evidence that the gate of record had resolving power where it was
        questioned. Any downstream citation of NC2b-G1-VAR must say which
        windows it covers.
    - id: V-B4-10
      severity: LOW
      package: PKG-PEC
      title: "SP-1 numerical collision: no breach, but the unit must travel with the number"
      statement: "See sp1_adjudication. Verdict: NO PROHIBITION BREACHED."
      recommended_action: >-
        Any downstream record quoting the L2-WEIGHT Dickman column at NIST-I
        (0.8676515815362557) should carry the unit ("bits of charging
        correction") beside it, because the value collides numerically with a
