    - id: V-B4-11
      severity: LOW
      package: PKG-PEC
      title: "Clause (d)'s interval type and level are an undeclared Executor choice"
      statement: >-
        The contract says only "a four-point interval containing 0". The run
        used a two-sided t_{0.975}, df = 2 interval, which is not listed among
        declared readings RD-1..RD-9, although slope_se and the t quantile are
        both reported so the choice is transparent.
      robustness: >-
        The Validator checked: PRIMARY-B's slope is 41.8 standard errors from
        zero, so clause (d) fails at 95%, 99% and 99.9%. The verdict is not an
        artifact of the undeclared level.
    - id: V-B4-12
      severity: LOW
      package: PKG-HEUR
      title: "PH5's Clopper-Pearson intervals treat total weight as sample size"
      statement: >-
        s2_naive passes the weighted totals (effective n = 23239 for W-CURVE)
        into an exact binomial interval, but there are only 13834 independent
        classes. The design-corrected effective n is (sum w)^2/(sum w^2) =
        23239^2/42049 = 12843, so each half-width should be about 1.345x
        wider. Separately, W-CURVE and W-TYPE are computed on the SAME data
        and are perfectly dependent, so comparing two intervals is not a test.
      does_it_change_PH5: >-
        NO. The intervals are [0.39491, 0.41153] and [0.32832, 0.34911], a gap
        of 0.046 against a corrected half-width of about 0.011. They remain
        disjoint. The Executor labels the comparison basis as its own reading
        because the contract names no interval, which is correct.
    - id: V-B4-13
      severity: LOW
      package: PKG-PEC
      title: "The exact-enumeration feasibility predictor understates by ~2x"
      statement: >-
        At the ladder point (X, B) = (859865, 50) the Dickman-predicted smooth
        count is 14179.99 while the exact count is 30438 -- a 2.15x
        understatement. D-3's feasibility rule thresholds on the predicted
        count.
      direction: >-
        Conservative for the EXCLUSIONS (the pairs declared not exactly
        enumerable are larger than the declared predictions suggest), but it
        means a pair just under the 1e9 predicted threshold could in fact be a
        ~2e9-node enumeration. Nothing in this run was affected: all 20
        attempted pairs completed.
    - id: V-B4-14
      severity: LOW
      package: PKG-PEC
      title: "The Dickman comparator carries a small known bias against the exact rho"
      statement: >-
        rho(2) = 1 - ln 2 = 0.3068528194400547 exactly. The committed
        implementation and the port both give 0.30631868259406, low by
        2.51e-3 bits. The contract itself states this cross-validation
        tolerance, so the arm is behaving as documented, and the bias is two
        orders of magnitude below the A-3 effect it might otherwise have
        explained.
    - id: V-B4-15
      severity: LOW
      package: PKG-BIB
      title: "Two immaterial arithmetic slips in the k derivation"
      statement: >-
        (i) Row B at log2 p = 768 reports log2k_lo = 3.3371; log2(192/19) =
        3.33702, which rounds to 3.3370. (ii) The power-law exponent is quoted
        as theta = ln(18.5/3.5)/ln(16) = 1.66523/2.77259 = 0.600605; the
        numerator is 1.665008, giving theta = 0.600525 and s(256) = 9.3326
        rather than 9.333.
      effect: "None. No interval, verdict or bit figure moves."
    - id: V-B4-16
      severity: LOW
      package: PKG-PEC
      title: "A stray __pycache__ directory exists under the closeout implementation"
      statement: >-
        experiments/EXP-PEC-d7979c/implementation/__pycache__/ exists in the
        working tree and is gitignored, so it is neither committed nor part of
        any receipt. C-IMMUT explicitly sets sys.dont_write_bytecode before
        importing the instrument, and the two committed trees' own .pyc files
