  overall_verdict: >
    THE REPAIR IS SOUND AND IT DID NOT MOVE THE ERROR. I tried to break it on
    six fronts and broke it on none. The intercept restoration is correct, the
    null gate does what it claims (narrowly), the seam is genuinely gone, the
