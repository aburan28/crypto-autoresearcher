      name: "C-PSCALE re-run at ell in {47, 101, 151, 211}"
      discriminates: RT3-C3 (FC-4, MECHANISM-INCONSISTENT)
      cost: "minutes; Phi_ell already acquired, fields are 20 and 30 bits, p3 arm free"
      pre_registered_prediction: "alpha_primary in [0.85,1.15]; |alpha_primary - alpha_null| <= 0.15; no residual trend of alpha_hat in ell"
      why_first: >
        It is the cheapest item outstanding, it is the only one that can retire a
        pre-registered falsifier by measurement rather than by argument, and until
        it runs every citation of c at alpha = 1 must carry the
        MECHANISM-INCONSISTENT label.
    - id: NC2b-SLOPE
      name: "Synthetic slope null: null series x ell^s, s in {0.4, 0.8}"
      discriminates: RT3-C6 (the flat null has no power against L1)
