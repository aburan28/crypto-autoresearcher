  counterexample_or_mutation: >
    THE CHEAPEST DISCRIMINATING MUTATION IS A REGRESSOR, NOT A RUN. Add the
    integer `depth(ell) = number of Karatsuba recursion levels for operand length
    ell+1 at threshold 16` to the OLS design matrix and refit both series. On
    IMPL-B it takes -0.0749 bits per level and cuts the residual variance by 72%
    (R^2 0.999158 -> 0.999758, max |residual| 0.0537 -> 0.0293 bits); on IMPL-A,
    with the identical regressor, it takes +0.0066 and does nothing. That is a
    null-object control on the EXPLANATION rather than on the signal, it costs
    nothing, it is fully internal to the committed artifact, and it converts A-3
    from an unexplained anomaly into a named implementation artifact.
    THE SECOND MUTATION, ALSO FREE: restrict C-PSCALE's pooled estimator to the
    ell that lie inside the primary fit window. FC-4's 0.1662 gap collapses to
    0.0015 and both arms move inside the pre-registered band. It does not lift the
    falsifier - nothing post-hoc can - but it tells the Coordinator exactly which
    two data points fired it and what NC2d-PROPER has to do.

  baseline_comparison:
    end_to_end_baseline: >
      Unchanged in structure and STILL NOT INSTANTIATED by this programme after
      three batches. The end-to-end baseline for any concrete NIST-I claim is
      Delfs-Galbraith with the Santos-Costello-Shi subfield acceleration ([15]) and
      the concrete constants of Adj et al. ([3]), run as n-way parallel
      subset-hitting with negligible memory: T_base = k * 2^{log2 p / 2}
      walk-steps on hardware whose total budget matches the attack's. k is
      unquantified here; no task in BATCH-001, 002 or 003 fetched [15] or [3]. Every
      margin row therefore carries an unquantified constant-factor uncertainty in
      addition to the overhead uncertainty, in the attack's disfavour if k > 1.
      RT3-C9 adds the symmetric point in the other direction (5-7 bits).
    pollard_rho_and_bsgs: >
      NOT APPLICABLE, RECORDED RATHER THAN OMITTED. The problem is the
      supersingular isogeny / endomorphism-ring problem, not a discrete logarithm
      in a cyclic group; rho and BSGS have no instantiation against it. The
      correct specialised baselines are Delfs-Galbraith (p^{1/2}) and its
      refinements, and the vOW parallel-collision family that RUN-WESOVOW-001
      models. Both are compared above.
    closest_specialized_baseline_for_the_measured_quantity: >
      For F_{p^2}-multiplications per table entry when populating ell-isogeny
      neighbours via Phi_ell, the closest specialised baselines are (i) the run's
      own IMPL-B, which beats IMPL-A at every ell >= 17 by up to 0.4905 bits and
      ties it below the Karatsuba threshold, and (ii) batched Sutherland-type
      evaluation, named in Lemma 3.3's footnote and credited to Damien Robert,
      which is unimplemented here and whose literature this programme has still
      not retrieved. Axis (ii) remains UNCHECKED and is recorded as such.

  pareto_honesty:
    dominated_by:
      - axis: "time (per-entry F_{p^2}-multiplications, measured)"
        dominator: >
          The run's own IMPL-B over IMPL-A, by log2 ratio rising 0.1118 (ell 17)
          to 0.4905 (ell 211), with equality at ell <= 13 where poly_mul_kara
          delegates to poly_mul_school.
        status: "CHECKED, recomputed by me from the 752 committed samples"
      - axis: "time (asymptotic per-entry exponent)"
        dominator: >
          Any batched Sutherland-type modular-polynomial evaluation with batched
          root-finding, which drives the per-entry cost toward O~(log p) and
          removes 11.50-13.25 of the 21.23-25.22 modelled NIST-I overhead bits.
        status: >
          STRUCTURALLY ESTABLISHED from the committed pipeline and from Algorithm
          1's own batch availability (N ~ M/ell >> ell arguments per ell), NOT
          MEASURED. The Sutherland literature was again NOT retrieved this
          session; this axis remains UNCHECKED.
      - axis: "time (this implementation's own asymptote)"
        dominator: >
          IMPL-A dominates IMPL-B asymptotically, against the measured ordering:
          poly_rem_monic is schoolbook in both, so the Karatsuba gain saturates
          and gamma_B -> gamma_A. Committed evidence: per-band increments of
          log2(A/B) 0.1118, 0.1178, 0.1163, 0.0921.
        status: "CHECKED as a trend on four increments; SUGGESTIVE, not established"
      - axis: "memory / data"
        dominator: >
          Delfs-Galbraith dominates the attack on memory at every w: the attack
          needs 2^93.28 table entries at NIST-I against DG's negligible memory.
          The model's +0.5 bits of margin per bit of memory is approximately
          cancelled by real access latency beyond DRAM (RT2-C6 as narrowed), which
          is why all rows above are quoted at w = 2^30. The comparison is a genuine
          trade, not a Pareto improvement.
        status: "CHECKED against RUN-WESOVOW-001 per_field memory rows"
      - axis: "queries / oracle access"
        dominator: "not applicable; neither the attack nor the baseline is query-bounded"
        status: "CHECKED and recorded rather than omitted"
      - axis: "the estimator itself"
        dominator: >
          The corrected law dominates the superseded law on the only axis either
          was ever tested on: 0.271670 bits of null-gate error against 12.6051,
          against a 0.75-bit tolerance.
        status: "CHECKED, and its narrowness is objection RT3-C6"
    dominated_by_is_not_null: true
    dominated_by_note: >
      Setting dominated_by to null here would be a fabrication under AGENTS.md
      rule 9 / inventor-protocol section 4. Every row names what dominates, on
      which axis, and whether I checked it or am flagging it unchecked.
    kn_lit_7593_check: >
      ONE INSTANCE FOUND, AND IT IS RT3-C1. The corrected law eliminates the
      "which ell do we charge at" dimension by fixing ell = B_opt. That
      elimination has a cost - the entry-weighted mean of ell^gamma over
      Algorithm 1's actual batch distribution is 0.60 to 1.00 bits below B_opt^gamma
      - and the cost was DECLARED (L2) but never charged into the total. An
      eliminated dimension is not free until its own cost is in the number.
      Two candidate instances checked and CLEARED: (a) the paired j-design removes
      j-to-j variation from the ell slope, and its cost (pool generation by
      120-step 2-isogeny walks) is correctly excluded because Algorithm 1 does not
      regenerate the pool per entry; (b) the pairing_rule removes a modelling
      degree of freedom at genuinely zero cost.
    sota_delta:
      quantity: "the defensible NIST-I modelled margin interval at w = 2^30"
      before_this_batch: >
        [5.40, 22.67] bits, width 17.27, with the low end produced by a quadratic
        on a compositionally inhomogeneous series (RT2-C2 / adjudication B) and
        the high end by the unimplemented batched-evaluation scenario.
      after_this_batch: >
        Measured-gamma readings only, 6 fits x 3 alphas: [8.3498, 13.1544], width
        4.805. Adding the L4 batched scenario at alpha = 1 throughout:
        [8.3498, 22.2927], width 13.94. Allowing alpha in {0, 1, alpha_hat}:
        [8.3498, 24.9708], width 16.62.
      delta: >
        On the like-for-like alpha = 1 convention, the width falls from 17.27 to
        13.94 bits, a narrowing of 3.33 bits (19.3%), and THE LOW END RISES BY
        2.95 BITS (5.40 -> 8.35). The qualitative gain is larger than the
        numerical one: the old low end came from a quadratic on a mixed response
        and no longer exists, and the new low end comes from a homogeneous,
        fully-null-controlled, complete-grid fit. What did NOT change: the
        residual width is still dominated by a subroutine nobody has written,
        and it is still four to seven times the irreproducibility band.
      honest_negative_component: >
        Two of the corrections in this report move the number AGAINST the
        programme's convenience and I state them as such: RT3-C1 shifts the whole
        table 0.6-1.0 bits toward the attack (making my own BATCH-002 objection
        smaller), and RT3-C2's saturation reading moves the bracket's low end
        1.75 bits away from the attack. Neither was requested and neither is
        favourable to the position I argued in BATCH-002.

  heuristic_challenges:
    - id: RT3-H0
      statement: >
        NOTHING IN THIS BATCH BEARS ON HEURISTIC 1, and the run says so. My July
        objections RT-H1..RT-H4 remain untouched and open: the paper's Figures 1-2
        test the body of the smoothness distribution while Heuristic 1 is a tail
        statement at u ~ sqrt(log p); the walk-based quaternion sampler is
        unvalidated; the ell = 2 parity channel is untested; and the disjointness
        content has no supporting data anywhere in the record. NC-3 and NC-6
        remain unrun since BATCH-001.
      severity: high
      why_it_is_now_urgent_rather_than_merely_open: >
        P0 sits inside every margin row in this report. A constant-factor error in
        P0 at the operating point moves log2 T_full and therefore moves ALL
        THIRTEEN margin rows by the same amount. This batch has resolved the
        measured-gamma contribution to a 4.8-bit span, which means the c-programme
        has now delivered most of what it can deliver; three of four campaign
        batches are spent, and P0 - the term that multiplies everything - has
        never been tested. Continuing to refine c while P0 carries an unbounded
        constant-factor uncertainty is optimising the wrong term, and the window
        to correct that closes with BATCH-004. This is a prioritisation objection
        against the campaign plan, not against the run.
    - id: RT3-H1
      statement: >
        The run's own heuristics L1-L6 are now NUMBERED, each carries a status and
        a direction, and L5 and L6 carry falsifiers that actually fired or were
        actually evaluated. Against the target-result profile's requirement (every
        heuristic explicit, numbered, given a random-model justification and a
        falsification condition) this package is a MATERIAL IMPROVEMENT on its
        predecessor and I record that rather than manufacturing an objection.
        WHAT IS STILL MISSING: L1, the load-bearing one, has a status (UNTESTED),
        a magnitude (6.48 to 18 octaves) and NO falsification condition and NO
        random-model justification. It is the only assumption in the list that can
        move the answer by more than a few bits and it is the only one with
        neither.
      severity: medium
      transfer_challenge: >
        The exemplar's transfer question - does the random-model justification
        apply to the structured object at hand - has an unfavourable answer here
        and the answer is now sharper than in BATCH-002. per_entry is not an
        unstructured empirical curve; it is 4*log2(p)*M(ell)/(ell+1) for a KNOWN
        M, and RT3-C2 shows the measured curve carries the recursion structure of
        that specific M as a phase-locked sawtooth. So the object being
        extrapolated 6.48 octaves is a property of poly_mul_kara and
        poly_rem_monic, not of Algorithm 1. The run gets the benefit of that
        structure (it is what licenses extrapolation at all) and now also carries
        its cost visibly in the data.
      cheapest_discriminating_control: "NC2b-SLOPE plus NC2a-BAND, both above."

  cost_model_challenges:
    - "RT3-C1: the charging point at ell = B_opt overstates the entry-weighted table-build cost by 0.60-1.00 bits at every field size; c at NIST-I is overstated by 0.038-0.063. Exact-enumeration ground truth at matched w, plus a Dickman asymptotic."
    - "RT3-C2: A-3 is the Karatsuba recursion staircase (delta = -0.0749/level on IMPL-B, +0.0066 on IMPL-A); correctly paired it is worth 1.01 bits at NIST-I. Counter-direction: gamma_B = 0.810 is a transient of the unimproved schoolbook reduction, worth up to -1.75 bits on the bracket's low end."
    - "RT3-C3: FC-4 fires on ell in {3,5} only; the alpha question is worth 0.43 bits at NIST-I and 0.68 at log2 p = 768; FC-2 missed by 1.35% of the point estimate."
    - "RT3-C4: the per-row bootstrap interval (0.005 wide in c) understates the real uncertainty by ~2 orders of magnitude and must never be cited as uncertainty."
    - "RT3-C8: RT2-C4 recomputed at 11.50-13.25 bits, 48-59% of the corrected overhead. STILL DOMINANT. My candidate Theta(ell) instantiation floor was checked and does not survive batching; recorded as a failed objection."
    - "RT3-C9: RT2-C7 stands unmeasured at 5-7 bits in the attack's favour; the committed C-NULL does NOT measure it."
    - "TOTAL-COST BOOKKEEPING: VERIFIED CORRECT AGAIN, no objection. log2 T = log2 M - log2 P0 in RUN-WESOVOW-001 is per-attempt cost times inverse success probability with a full table rebuild per attempt, and the vOW regime divides that same total by sqrt(w). Per-attempt cost is not confused with total expected cost anywhere in this chain."
    - "MEMORY IS CARRIED BESIDE TIME at every row (2^93.28 entries at NIST-I) and the memory axis is explicitly a trade, not a domination."

  reduction_and_scope_challenges:
    - id: RT3-S1
      target: "My own RT-S1, as the brief requires."
      severity: high
      position: >
        RT-S1 IS FURTHER WEAKENED AND STILL NOT WITHDRAWN. Its retired half stays
        retired: the "NIST-I margin might be within a few bits of zero" scenario
        is dead, and this batch kills it more thoroughly than BATCH-002 did -
        every one of eighteen measured-gamma readings lands in [8.35, 13.15] bits
        and the c = 2 corner is now excluded by a method ceiling (gamma <= 1
        exactly for this pipeline) rather than only by a flat measurement.
        Its standing half rested on five reasons in BATCH-002. TWO ARE NOW
        DISCHARGED BY THIS BATCH: (ii) "the headline gamma is a composition
        artifact and the homogeneous number has not been reported as primary" -
        DISCHARGED, the seam is gone, 47/47 ell admitted, and the exponent of
        record is the homogeneous pair; (iii) "the window supplying the interval's
        upper end has no null-object control" - DISCHARGED, C-NULL coverage is
        1.0000 in every fitted window including W-TOP, which is precisely the
        repair my RT2-C5 asked for.
        THREE STAND: (i) MAGNITUDE - the span is still 13.9-16.6 bits wide against
        a 2.23-bit band, still set by an unwritten subroutine; (iv) the baseline
        constant k is still unquantified and [15] and [3] are still unfetched
        after three batches; (v) Heuristic 1's tail, which sets P0 and moves every
        row identically, is still untested. The paper's own hedge - "impact on
        concrete parameter sets remains to be clarified" - remains the correct
        framing, now for reasons of MAGNITUDE and of the BASELINE side, not of
        SIGN and not of the attack side.
    - id: RT3-S2
      target: "Whether concrete_threat_nist1 moves off INCONCLUSIVE. The specific question DEC-20260802-48c72c must answer."
      severity: high
      position: >
        NO. IT SHOULD REMAIN INCONCLUSIVE, AND THE REASONS ARE NARROWER AND MORE
        CONCRETE THAN IN BATCH-002.
        (1) The completion criterion is "decides the NIST-I margin with error
            below the irreproducibility band". The band is 2.2309 bits (NIST-I
            time) or 3.5133 (max across fields). The defensible span is 13.94
            bits at alpha = 1 throughout and 16.62 allowing alpha in
            {0, 1, alpha_hat}. That is four to seven times the band. Not met, on
            the numbers, with no adjustment to the criterion after seeing them.
        (2) The width is dominated by L4, an unimplemented subroutine which the
            frozen paper itself names as the expected implementation route. A
            programme cannot decide a concrete threat when the largest term is
            "what a competent implementer would do instead".
        (3) AGENTS.md rule 7 is unchanged: an 80-bit-field measurement over
            ell <= 211 is not NIST-I validation, and the run says so itself.
        (4) A pre-registered falsifier of a declared assumption FIRED (FC-4). Even
            localised as in RT3-C3, a fired falsifier is not a state in which a
            concrete-threat verdict moves.
        WHAT HAS CHANGED, AND IT SHOULD BE RECORDED AS A RESULT RATHER THAN LOST
        AMONG THE CAVEATS: the surviving question is no longer "5 bits or 23 bits"
        but "8 bits or 22 bits", on a homogeneous, complete-grid,
        fully-null-controlled measurement whose estimator passed a real
        self-validation gate against a real defect. Two independent scenario
        families are now dead (near-zero margin; c = 0), and the residual span has
        narrowed by 19% with its low end up 2.95 bits.
        WHAT WOULD MOVE IT, AND AT WHAT COST: only NC2c can, because only NC2c
        addresses L4. If a third implementation at a different M-exponent lands
        gamma_C near 0.3-0.5, the honest headline becomes "the per-entry exponent
        is an implementation parameter in [0, 1], not a constant of Algorithm 1",
        the c-programme is re-scoped, and the concrete question changes shape
        rather than being answered. If instead a batched implementation is built
        and measured end-to-end - which is a research project, not a control - the
        span could close to a few bits. Neither fits inside the one remaining
        campaign batch alongside NC-3/NC-6, and the Coordinator must choose. My
        recommendation is in next_concrete_action.
    - id: RT3-S3
      target: "Scope inflation audit of the affected/safe scheme lists."
      severity: low
      position: >
        NO INFLATION FOUND. The contract's non_claims disclaim CSIDH,
        (qt-)Pegasis and torsion-based constructions, disclaim any bearing on
        Heuristic 1, disclaim any status change, cap the measurement at `medium`
        tier and give the extrapolation NO tier at all. The extrapolation block's
        own status field says "EXTRAPOLATION, NOT A MEASUREMENT ... carries NO
        claim tier, at any field size, under any reading". This is the most
        scrupulous scope discipline in the programme and I record it rather than
        manufacturing an objection. The binding risk is entirely downstream and is
        addressed in citable_form below.
    - id: RT3-S4
      target: "Whether this batch closes anything."
      severity: medium
      position: >
        IT CLOSES NOTHING AND SHOULD NOT BE WRITTEN AS IF IT DID. "All five
        pre-registered predictions MET" is not a closure of adjudications B or C:
        B's arithmetic core was never in doubt and its magnitude claim is now
        confirmed; C's factual half is confirmed and its operative half is
        confirmed; and C's explicitly recorded residual uncertainty - whether the
        homogeneous curvature is a small-ell startup effect or a slow genuine rise
        - is ANSWERED for IMPL-B (banding, RT3-C2) and for IMPL-A (bounded
        approach to the gamma = 1 ceiling), which is forward guidance, not a
        closure. Per docs/inventor-protocol.md section 4, any statement that this
        lane is finished would need a named obstruction, an argument and forward
        guidance; the honest statement is the opposite - the lane has three named
        live controls (NC2c, NC2d-PROPER, NC2f) each costing hours.

  proof_architecture_challenges:
    - id: RT3-P1
      attack: "Observation-fiber"
      finding: >
        STILL SUCCEEDS, AND THE FIBER IS NOW MEASURED. Hold the observable fixed -
        per_entry over ell <= 211 at p ~ 2^40 - and vary M: schoolbook and
        Karatsuba differ by 0.4905 bits at ell = 211 and by 11.50 vs 13.25 bits at
        ell = 2^14.2, while a quasi-linear M would sit in the same fiber at the
        low end and diverge by a further 11.5 bits at the top. The separator is
        still a third implementation at a different M-exponent (NC2c) and it is
        still unbuilt. RT3-C2 adds a NEW fiber element that the run did find: two
        different (gamma_within, delta) decompositions of the same series fit the
        same 43 points, one of them 72% better, and only the better one
        extrapolates correctly.
    - id: RT3-P2
      attack: "Quantifier-order"
      finding: >
        IMPROVED BUT NOT CLOSED. The contract states the supported form and the
        pairing_rule now forbids the specific witness-mixing that produced the
        BATCH-002 defect. The residual violation is one level up and is objection
        RT3-C3(c): alpha is a witness chosen after seeing an ell-range disjoint
        from the one it is applied to. The extrapolation block also still uses the
        uniform form "there exists gamma for all ell up to 2^14.2 and all p up to
        2^768" while the measurement supports only "for THIS implementation pair,
        there exists gamma such that for all ell in [11, 211] at p = 2^40".
    - id: RT3-P3
      attack: "Method-ceiling"
      finding: >
        SHARPENED, AND IT NOW CUTS BOTH WAYS. Because gamma = exponent(M) - 1 and
        M is at most schoolbook, THIS METHOD CANNOT PRODUCE gamma > 1 AT ANY ell,
        so it can never generate the c ~ 2 scenario - which retires my own July
        headline by construction rather than by measurement. Symmetrically it can
        never establish a LOWER bound on an optimal implementation's cost, so it
        can never show the attack is more expensive than the paper claims. The
        method's ceiling is: narrow the overhead from above, within [0, 1] in the
        exponent. It has now done that to a 4.8-bit span on the measured-gamma
        axis, and it is at its ceiling.
    - id: RT3-P4
      attack: "Nearby-object / null control"
      finding: >
        THE NULL IS NOW PROPERLY DEPLOYED AND ITS OWN LIMITS ARE VISIBLE. C-NULL
        covers 47/47 ell and 100% of every fitted window, repairing Validator F-3
        and my RT2-C5(a); the flatness ratio is 0.960073 over the whole grid; and
        the gate has real power against the defect it targets (12.6051 vs 0.75).
        Its LIMITS are objection RT3-C6 (no power against L1, L2 or the pairing
        rule) and A-1 (the same estimator on an 8-point window drifts 0.33 bits at
        NIST-I and 0.92 at 768 on an object that is flat by construction). A-1 is
        the most useful anomaly in the run and the run does not connect it to A-3,
        which is where it bears.
    - id: RT3-P5
      attack: "Boundary and strictness"
      finding: >
        PASSES. C-BASE.6 embeds the paper's convention as gamma_paper = 0;
        entries(ell) = ell + 1 matches Lemma 3.3's "each batch of (<=)ell + 1 new
        entries" and holds at every committed sample; and the superseded law is
        genuinely embedded as the alpha = 0, log2 A = 0 corner of the corrected
        one, so the improvement is strict rather than merely different. The
        counting-unit objection fails again and I record it as a failed attack.
    - id: RT3-P6
      attack: "Compositional-invariant"
      finding: >
        THE PAIRING RULE IS THE STRENGTHENED INVARIANT AND IT SURVIVES DELETION
        TESTING. Delete it and A-3 becomes consequential: pairing gamma_B(W-TOP) =
        0.9585 with log2 A from W-MID (9.7308) gives overhead 26.29 bits and
        margin 7.98 - 2.4 bits worse than any correctly-paired reading and outside
        the published bracket. With the rule, the same anomaly costs 1.01 bits.
        The rule is load-bearing, it is stated before the data, and it is the part
        of this repair most worth promoting to the knowledge corpus.

