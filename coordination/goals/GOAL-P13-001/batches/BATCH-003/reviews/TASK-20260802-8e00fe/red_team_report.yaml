    entry-weighted table-build cost by 0.60 to 1.00 bits at every field size,
    which the contract declared (L2) and nobody priced. I price it here.
    A-3 IS AN ARTIFACT AND I CAN NAME IT: IMPL-B's steepening at the top of the
