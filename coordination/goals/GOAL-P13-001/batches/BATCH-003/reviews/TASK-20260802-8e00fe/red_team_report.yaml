    monotonically 0.887 -> 0.942 -> 0.945 -> 0.965. The correct statement is a
    slow, BOUNDED approach to the schoolbook ceiling gamma = 1, and that ceiling
    is what kills the c = 2 scenario for good.
    FC-4 FIRED ON THE TWO SMALLEST ELL AND ON NOTHING ELSE. Restricted to the
    only C-PSCALE ell inside the primary fit window, the two arms agree to
    0.0015 and both sit inside the pre-registered band. The designation stands -
    a post-hoc restriction cannot lift a pre-registered falsifier - but it is
    localised, and the whole alpha controversy is worth 0.43 bits at NIST-I.
    CITABLE: YES, as a bracket with six attachments, never as a number.
    NIST-I: STAYS INCONCLUSIVE, on a 13.5-to-16.6-bit span against a 2.23-bit
    band, now narrower and with its low end raised by ~3.4 bits.

  # ==================================================================
  # OBJECTIONS, RANKED BY SEVERITY
  # ==================================================================
  objections:

    - id: RT3-C1
      rank: 1
      severity: high
      direction: ANTI-ATTACK-OBJECTION (it cuts against my own RT2-C1 correction)
      target: >
        Declared assumption L2 - "the table build's per-entry cost is charged at
        ell = B_opt" - and therefore every overhead_bits and c value in
        extrapolation.rows.
      claim_challenged: >
        That log2(A) + gamma*log2(B_opt) is the correct accounting for Algorithm
        1's actual table build.
      body: >
        IT IS NOT, AND THE CONTRACT SAYS SO WITHOUT PRICING IT. Algorithm 1's
        outer loop is `for ell <= B do` (frozen paper, line 143). With ell taken
        in increasing order, an entry of degree d receives its final extension in
        the loop iteration ell = P(d), the LARGEST PRIME FACTOR of d. Lemma 3.3
        charges each batch of (<=)ell+1 new entries at the cost of computing the
        ell-neighbours, so the correct multiplier is the ENTRY-WEIGHTED MEAN of
        ell^gamma over the distribution of P(d), not B_opt^gamma. Entries are
        weighted by I(d), and Section 4.1's own lower bound uses I(d) >= d.
        The law charges every entry at ell = B_opt. That is the worst case, and
        L2 gets its direction right: "attack-unfavourable within the law ... the
        entry-weighted mean of ell^gamma is at most B^gamma". Nobody quantified
        it. Quantified (RT3 recomputation):
          EXACT ENUMERATION, at w = log X / log B matched to NIST-I's w = 3.493 -
          I enumerated every B-smooth d <= X with its largest prime factor and
          weighted by d and by the cyclic-kernel count psi(d):
            X = 10^7,  B = 100 (w = 3.500, 269,882 smooth d):
              Delta = 0.598 bits (gamma 0.810), 0.676 bits (gamma 0.933);
              weighting by psi(d) instead of d changes it by < 0.001.
              mass fraction with P(d) <= B/2 = 0.335.
            X = 10^8,  B = 215 (w = 3.430, 2,792,530 smooth d):
              Delta = 0.625 bits (gamma 0.810), 0.704 bits (gamma 0.933);
              mass fraction with P(d) <= B/2 = 0.384.
          DICKMAN ASYMPTOTIC, using Psi(t,y) ~ t*rho(ln t/ln y) with my own
          marching rho (validated: rho(2) = 0.3068528, rho(4) = 0.00491093,
          rho(8) = 3.2321e-8):
            NIST-I  Delta = 0.868 (gamma 0.810) / 0.969 (gamma 0.933)
            768     Delta = 0.899 (gamma 0.810) / 1.001 (gamma 0.933)
        The exact values trend upward with B (0.598 -> 0.625), consistent with
        the asymptotic being the limit. THE HONEST RANGE IS Delta = 0.60 to 1.00
        BITS AT EVERY FIELD SIZE, i.e. c at NIST-I is overstated by 0.038 to
        0.063 and the NIST-I margin at w = 2^30 is understated by 0.6 to 1.0 bits.
        WHY THIS IS A KN-LIT-7593 INSTANCE. Fixing the charging point eliminates a
        modelling dimension ("which ell do we charge at"). The elimination has a
        cost - the entry-weighted mean is not B^gamma - and that cost was declared
        but never entered into the total. An eliminated dimension is not free
        until its own cost is charged.
      what_the_quantity_should_have_done: >
        The parameter that should destroy this bias is u = w = log X / log B. As
        w grows the smooth-number mass concentrates ever nearer B (fewer octaves
        of room below it), so Delta should DECREASE toward zero as w -> 1 and
        SATURATE as w grows. It does neither dramatically over the tested range
        because w only moves from 3.49 (NIST-I) to 5.40 (768); Delta correctly
        stays nearly flat at 0.87-0.90 across the five field sizes. A Delta that
        varied strongly across those five rows would have been the artifact tell.
      cheapest_discriminating_control: >
        ZERO NEW COMPUTE AND ZERO NEW CODE. RUN-WESOVOW-001 already carries a
        cross-validated Dickman implementation (Laplace inversion, agreeing with
        a du = 1e-5 marching solution to 2.5e-3 bits at u = 2 and 6e-6 at u = 7).
        In a superseding analysis record, evaluate
          E[ell^gamma] = integral y^gamma dS(y) / S(B),  S(y) = sum_{d<=X, P(d)<=y} d,
        on the same B_opt/X constants already stored per field, and report the
        c table both at the charging point and entry-weighted. Discriminating
        check that the machinery is right: reproduce my exact-enumeration values
        0.598 and 0.625 at (X, B) = (10^7, 100) and (10^8, 215).
      magnitude_relative_to_the_headline: >
        0.60-1.00 bits against a modelling-choice bracket 3.99 bits wide and an
        L4 term 11.50-13.25 bits wide. Real, worth reporting, changes no sign.

    - id: RT3-C2
      rank: 2
      severity: high
      target: >
        Anomaly A-3: gamma_B = 0.810034 on W-MID against 0.958496 on W-TOP, and
        the S-B/S-MIN nested quadratic over ell >= 101 of 0.167076 with bootstrap
        CI [0.141153, 0.192587] excluding zero.
      claim_challenged: >
        That A-3 is evidence of a genuine steepening of the per-entry exponent at
        the top of the range, and therefore that "the seam explained the
        curvature" fails.
      body: >
        A-3 IS THE KARATSUBA RECURSION STAIRCASE AND I CAN SHOW IT FROM THE
        COMMITTED DATA AT ZERO COMPUTE. per_entry_cost.py sets
        KARATSUBA_THRESHOLD = 16 (line 214) and poly_mul_kara delegates to
        poly_mul_school whenever an operand length is <= 16, splitting at
        m = max(lf,lg)//2 otherwise. Operand length is deg f = ell+1, so the
        recursion depth is constant on the bands ell+1 in [16,31], [32,63],
        [64,127], [128,255], i.e. ell in [15,30], [31,62], [63,126], [127,254].
        RT3 recomputation, residuals of log2(per_entry) about each series' own
        W-MID linear fit, in bits:
          IMPL-B  depth 1 (17..31):  -0.0196 rising to +0.0261
          IMPL-B  depth 2 (37..61):  -0.0465 rising to +0.0132   [DROP at 37]
          IMPL-B  depth 3 (67..127): -0.0437 rising to +0.0266   [DROP at 67]
          IMPL-B  depth 4 (131..211):-0.0057 rising to +0.0452   [DROP at 131]
        A sawtooth of period exactly one octave, phase-locked to the recursion
        threshold. IMPL-A shows no such structure (monotone smooth residuals).
        THE NULL-OBJECT CONTROL FOR THE BAND MODEL IS FREE AND IT PASSES. Fit
        log2 per_entry = a + gamma_within*log2(ell) + delta*depth(ell), with
        `depth` defined identically for both series:
          IMPL-B, ell >= 17: gamma_within = 0.8919, delta = -0.0749/level,
                             R^2 0.999758 (plain-linear 0.999158),
                             max |residual| 0.0293 (plain-linear 0.0537)
          IMPL-A, ell >= 17: gamma_within = 0.9329, delta = +0.0066/level
        The regressor does 72% of the residual variance on the Karatsuba series
        and nothing at all on the schoolbook series. That is the discriminating
        control, and it was already lying in the run.
        WHY W-TOP IS THE WRONG WINDOW. W-TOP = ell 173..211 lies wholly inside
        band 4 AND in the rising tail of its tooth. Per-band OLS local slopes:
          IMPL-A: 0.8871 (17..31), 0.9420 (37..61), 0.9452 (67..127), 0.9647 (131..211)
          IMPL-B: 0.8709 (17..31), 0.9005 (37..61), 0.9020 (67..127), 0.9129 (131..211)
        gamma_B(W-TOP) = 0.9585 exceeds even IMPL-B's own band-4 local slope
        0.9129, because W-TOP is a sub-band window. Within-band slope minus the
        per-band drop is 0.8919 - 0.0749 = 0.8170, which is the measured W-MID
        slope 0.8100 to 0.007. The decomposition closes.
        THE NESTED QUADRATIC IS THE SAME OBJECT. S-B over ell >= 101 spans 1.06
        octaves crossing exactly ONE band boundary (127 -> 131); its fitted
        b = -1.5713 is the signature of an ill-posed quadratic on a short lever
        arm. On the IDENTICAL window IMPL-A gives c = 0.016042 with CI
        [-0.0007, 0.0391] INCLUDING ZERO. A curvature that is significant for the
        recursive routine and absent for the non-recursive one on the same 22
        points is a property of the routine, not of Algorithm 1.
        THE RUN'S OWN NULL BOUNDS THE W-TOP ESTIMATOR. NC2b-G1-prime evaluates
        the corrected estimator on the NEW full-range null at W-TOP and finds
        0.3292 bits of spurious extrapolated level at NIST-I, rising to 0.9205 at
        log2 p = 768 (the A-1 failure). So an 8-point top window carries ~0.33
        bits of drift at NIST-I on an object that is flat by construction.
        MAGNITUDE, WHICH IS THE POINT. Correctly paired (the contract's own
        pairing_rule), W-TOP's higher slope comes with a LOWER intercept
        (8.6296 against 9.7308), and the two nearly cancel:
          S-B W-MID alpha=1: overhead 23.9113, c 1.494456, margin@2^30 10.3578
          S-B W-TOP alpha=1: overhead 24.9183, c 1.557395, margin@2^30  9.3508
        A-3 is worth 1.007 bits of NIST-I margin, and 2.774 bits at log2 p = 768.
        It is not "the most consequential number in the run"; it is well inside
        the modelling-choice bracket the run already published. THE PAIRING RULE
        IS WHAT MAKES IT HARMLESS, and that rule is this repair's real structural
        contribution - larger than the intercept fix it was written to generalise.
      the_counter_consideration_i_am_obliged_to_record: >
        THE SAME BAND STRUCTURE IMPLIES gamma_B = 0.810 IS NOT AN ASYMPTOTIC
        EXPONENT, AND THAT CUTS AGAINST THE ATTACK. IMPL-B substitutes ONLY
        poly_mul; poly_rem_monic stays schoolbook in both implementations
        (per_entry_cost.py line 236-240, explicitly). Each squaring in
        poly_powmod is one poly_mul plus one poly_rem_monic, so as depth grows
        the Karatsuba-improved half shrinks as (3/4)^d while the reduction half
        stays Theta(n^2): the per-octave gain must saturate and gamma_B must
        return to gamma_A. The committed data already show the onset. log2(A/B)
        at the first ell of each band: 0.1118 (d1), 0.2297 (d2), 0.3460 (d3),
        0.4381 (d4) - increments +0.1118, +0.1178, +0.1163, +0.0921, a 21% fall
        at the last step, and the within-band positioning bias on that comparison
        is < 0.003 bits. On four increments this is SUGGESTIVE, NOT ESTABLISHED.
        CONSEQUENCE: the bracket's LOW end (S-B, c = 1.327) assumes an
        undiminished 0.075-bit-per-octave Karatsuba gain across 6.48 unmeasured
        octaves. If the gain saturates and gamma_B -> gamma_A = 0.9329, the low
        end rises to c = 1.4361 and the margin falls from 13.036 to 11.286, i.e.
        -1.75 bits. THE HIGH END OF THE BRACKET IS THE DEFENSIBLE ONE FOR THIS
        IMPLEMENTATION FAMILY, and a downstream record that quotes only 1.327
        would be quoting the reading this analysis specifically undermines.
      cheapest_discriminating_control: >
        NC2a-BAND, zero new mathematics and a few hours: re-run IMPL-B on a grid
        DESIGNED to straddle band boundaries - ell just below and just above
        255/257 and 511/521 - by extending the acquired grid to ell ~ 521 at 4 j.
        PRE-REGISTER: (i) the residual sawtooth must persist with a drop at
        ell = 255 -> 257 and at 511 -> 521; (ii) the per-band increment of
        log2(A/B) must continue to decline (saturation) rather than hold at
        0.116; (iii) the multi-octave gamma_B over ell >= 11 must move toward
        gamma_A rather than away from it. Cheaper first, at zero compute: report
        the band model (gamma_within, delta) beside the plain linear fit for both
        series, and report gamma_B(asymptotic) as UNBOUNDED ABOVE BY 0.810.
        A useful auxiliary at near-zero cost: raise KARATSUBA_THRESHOLD to 8 and
        re-measure four ell. The band boundaries must MOVE to ell+1 = 16, 32, 64;
        if the residual sawtooth moves with them, the mechanism is proved.

    - id: RT3-C3
      rank: 3
      severity: high
      target: >
        C-PSCALE's FC-4 firing (|alpha_primary - alpha_null| = 0.166190 > 0.15),
        the MECHANISM-INCONSISTENT designation, and the band verdict OVERLAPPING.
      claim_challenged: >
        That the measurement contradicts the derivation's claim that the
        p-scaling is a property of the shared poly_powmod loop, and that a
        MECHANISM-INCONSISTENT designation should bar citing c at alpha = 1.
      body: >
        FC-4 FIRES ON ell = 3 AND ell = 5 AND ON NOTHING ELSE. RT3 recomputation,
        same within-ell fixed-effects estimator, same committed medians, only the
        ell set restricted (my all-ell values reproduce the committed pooled
        figures exactly, so the estimator is the run's):
          ell set            alpha_primary  alpha_null  |gap|   FC-4    band[0.85,1.15]
          {3,5,7,11,13}         1.1597        0.9935    0.1662  FIRES   OUT
          {7,11,13}             1.0998        1.0820    0.0178  no      IN
          {11,13}               1.1027        1.1012    0.0015  no      IN
        The per-ell primary values fall monotonically with ell (1.2614, 1.2377,
        1.0940, 1.1181, 1.0873) and the per-ell null values RISE (0.8590, 0.8625,
        1.0436, 1.1056, 1.0968). The two arms converge to within 0.0015 exactly
        where the primary fit lives.
        THREE INDEPENDENT REASONS WHY THE SMALL-ell END IS THE WRONG PLACE TO
        MEASURE alpha, all read off committed artifacts:
        (a) ell in {3,5,7,11,13} are ALL below KARATSUBA_THRESHOLD = 16, so
            IMPL-A and IMPL-B execute the identical code path there. I verified
            it: the IMPL-A and IMPL-B cost multisets are BIT-IDENTICAL at
            ell in {2,3,5,7,11,13}. C-PSCALE's "primary arm" is therefore a
            schoolbook-only measurement and says nothing about the series
            (S-B/S-MIN) that supplies the bracket's low end.
        (b) Anomaly A-4 records that the two largest W-MID residuals are at
            ell = 11 and 13 for all three series. alpha is estimated where the
            primary fit is at its worst.
        (c) Only ell = 11 and 13 lie inside the pre-registered primary window
            W-MID at all. The contract introduced a pairing_rule forbidding a
            W-TOP slope with a W-MID intercept; applying an exponent estimated at
            ell <= 13 to an intercept fitted over ell >= 11..211 is the same
            family of mismatch one level up, and the contract does not forbid it.
        GOVERNANCE POSITION, STATED PLAINLY AND AGAINST MY OWN ANALYSIS: A
        POST-HOC RESTRICTION OF THE ell-GRID CANNOT LIFT A PRE-REGISTERED
        FALSIFIER. FC-4 fired as written, the designation MECHANISM-INCONSISTENT
        stands, and the Executor was right not to touch it. What the analysis
        above buys is not a lifting; it is a diagnosis and a successor design.
        PROPORTION, WHICH IS WHAT THE COORDINATOR NEEDS. The whole alpha question
        is worth log2(256/40)*(1.1597-1) = 0.4277 bits at NIST-I and 0.6809 bits
        at log2 p = 768. FC-4 fired on the smallest term in the corrected law.
        A NEAR-MISS THAT MUST BE ON THE RECORD: FC-2 (falsification of alpha = 1)
        requires the interval DISJOINT from [0.85, 1.15]. The jackknife low end
        is 1.134284; FC-2 needs it above 1.15. The point estimate would have had
        to be 1.1754 instead of 1.1597 - a 1.35% move. The pre-registered
        falsifier of L5 missed by 1.35%, so alpha = 1 is not comfortably alive; it
        is alive by a hair. Any record citing c at alpha = 1 alone is quoting a
        value whose own falsifier nearly fired.
        The task brief states the jackknife interval is "entirely above 1.15".
        It is not: 1.134284 < 1.15, so the interval OVERLAPS, exactly as the run
        classified it under both readings. The run's classification is correct and
        the brief's characterisation is not; I record this because a designation
        that is repeated one step harder each time it is restated is how a
        measurement becomes a claim.
      cheapest_discriminating_control: >
        NC2d-PROPER. Re-run C-PSCALE at the SAME three primes but at
        ell in {47, 101, 151, 211}, the range where the p-scaling is actually
        applied, at 4 j. Phi_ell is already acquired for all four, the fields are
        20 and 30 bits, and the p3 arm is free (it is the primary measurement).
        This is minutes of compute. PRE-REGISTER: (i) alpha_primary in
        [0.85, 1.15]; (ii) |alpha_primary - alpha_null| <= 0.15, i.e. FC-4 does
        not fire; (iii) alpha_hat(ell) shows no residual trend in ell. If FC-4
        fires again on ell >= 47, the derivation really is contradicted and L5
        must be replaced by the measured exponent; if it does not, the
        MECHANISM-INCONSISTENT label is retired by measurement rather than by
        argument, which is the only legitimate way to retire it.

    - id: RT3-C4
      rank: 4
      severity: high
      target: >
        The per-row c_low / c_high fields in extrapolation.rows (225 rows), the
        joint bootstrap interval of log2 A + gamma*log2(B_opt).
      claim_challenged: >
        That those endpoints are an uncertainty statement about c.
      body: >
        THEY ARE THE SINGLE MOST DANGEROUS NUMBERS IN THE PACKAGE FOR DOWNSTREAM
        MISUSE. At NIST-I, S-B W-MID alpha = 1:
          overhead 23.911303 bits, interval [23.857936, 23.940535] - width 0.083
          c = 1.494456, interval [1.491121, 1.496283] - width 0.005
        Against: a modelling-choice bracket of 3.99 bits (0.249 in c), an L2 bias
        of 0.60-1.00 bits (RT3-C1), an L4 term of 11.50-13.25 bits, and an L3
        inherited band of up to 3.51 bits. The sampling interval understates the
        real uncertainty by roughly two orders of magnitude, for exactly the
        reason my BATCH-002 RT2-C5(c) gave and the superseded contract itself
        anticipated: this is a DETERMINISTIC INSTRUCTION COUNTER, its only
        stochastic input is the j-pool and the Cantor-Zassenhaus stream, and
        bootstrapping over 8 j-indices measures the j-to-j variation of a counter
        rather than the uncertainty of an extrapolation over 6.48 unmeasured
        octaves. The run is honest at the bracket level ("NOT a confidence
        interval: a span across two declared modelling choices") and silent at the
        row level, where the endpoints look exactly like a confidence interval.
      cheapest_discriminating_control: >
        Zero compute, editorial, and binding: any record quoting a row must quote
        c_point ONLY, with the words "the archived c_low/c_high are a j-resampling
        interval on a deterministic counter and are NOT the uncertainty on c".
        Better: report, beside each row, the SPREAD ACROSS THE SIX (series,
        window) FITS at that alpha, which is 0.084 in c at NIST-I alpha = 1 -
        seventeen times the bootstrap width and a far better proxy for what is
        actually unknown.

    - id: RT3-C5
      rank: 5
      severity: medium-high
      target: >
        "All five pre-registered predictions MET" (P1a, P1b, P2, P3, P4), as a
        summary statement.
      claim_challenged: >
        That the five MET verdicts license the readings a downstream record will
        want to take from them.
      body: >
        THE VERDICTS ARE WINDOW-CONDITIONAL AND TWO OF THEM INVERT ON W-TOP.
        (a) P1b: gamma(S-MIN, W-MID) <= 0.9382. MET at 0.810034. But the SAME
            threshold is EXCEEDED on W-TOP by both series: gamma_B(W-TOP) =
            0.958496 and gamma_A(W-TOP) = 0.971187. The contract's own
            if_it_fails text for P1b says a value above 0.9382 would mean "a real
            steepening between ell = 101 and ell = 211 that survives
            homogenisation". On the top eighth of the range, homogeneously, that
            is what the numbers say. RT3-C2 explains it as banding, but the
            SUMMARY "P1b MET" must not be read as "no steepening at the top of
            the range".
        (b) P3: gamma_A - gamma_B >= 0.10 on the common window. MET at 0.122831.
            On W-TOP the same difference is 0.971187 - 0.958496 = 0.012691. The
            Karatsuba advantage in the LOCAL exponent all but vanishes at
            ell ~ 200. The contract's if_it_fails text for P3 says failure means
            "RT2-C4's up-to-13.25-bit term must be re-scoped, and the priority of
            NC2c RISES". That consequence is triggered in the top window and is
            not recorded anywhere in the package.
        (c) P1a is labelled by the contract itself as a forced consistency check.
            It is additionally weaker than it looks here: S-MIN == S-B at every
            ell (A-7), and at ell in {2,3,5,7,11,13} the minimum is a TIE, not a
            dominance - the two implementations are bit-identical there. The
            execution report's "IMPL-B is cheaper than IMPL-A at EVERY admitted
            ell" is inexact at six of the 47 ell.
        (d) P1b had limited power by construction. Its threshold 0.9382 was set
            from the superseded IMPL-A value, while the seam-free S-MIN was
            always going to be S-B, whose superseded W-MID value over 11..101 was
            already 0.7929. The prediction could only fail if gamma_B rose by
            +0.145 on the wider range; it rose by +0.017. A prediction whose
            failure region is five standard modelling choices away is a weak test,
            and its success should be reported as such.
      cheapest_discriminating_control: >
        Zero compute. Re-report every prediction verdict with its value on ALL
        THREE windows, not only the pre-registered one, and record the two
        inversions explicitly as findings. The contract's verdict_recording clause
        already says success is a property of the protocol being executed, never
        of a prediction taking a particular value; applying that clause to the
        window dimension costs nothing and prevents the summary from being read
        as a closure.

    - id: RT3-C6
      rank: 6
      severity: medium-high
      target: >
        The NC2b-G1 null gate PASS, "worst 0.271670 of a 0.75-bit tolerance,
        leaving 0.478330 bits of margin", and its use as validation of the
        corrected law.
      claim_challenged: >
        That a passed null gate validates the corrected estimator.
      body: >
        THE GATE IS CORRECTLY DESIGNED AND STRUCTURALLY NARROW, AND THE CONTRACT
        SAYS SO ONCE ("a necessary condition for citing it, not a sufficient
        one"). The null object is FLAT IN ell BY CONSTRUCTION. For a flat series
        the fitted intercept IS the level, so the gate tests exactly one property
        - that the estimator retains the level - and has power against exactly the
        one defect it was built to catch (the superseded law misses by up to
        12.6051 bits and fails all 10 points). It has NO power against:
          L1 (the 6.48-to-18-octave extrapolation): a flat series extrapolates
              trivially, so the gate cannot detect a wrong gamma;
          L2 (the charging point): the gate is EVALUATED at ell = B_opt on an
              object whose cost does not depend on ell, so it is blind by
              construction to precisely the assumption RT3-C1 shows is worth
              0.60-1.00 bits;
          L5 (alpha): evaluated at alpha = 0 by design, correctly and by its own
              statement;
          the pairing rule: for a flat series any intercept passes.
        So "0.478330 bits of margin remaining" is a statement about LEVEL
        RETENTION and about nothing else, and it must not be restated as
        "the corrected law passed its self-validation".
        A RECORD-INTEGRITY DEFECT IN THE COUNT, THE VALUE BEING CORRECT.
        NC2b-G1 has TEN evaluation points, which I counted in
        raw-result.json (2 null windows x 5 field sizes = 10). The execution
        report, the manifest and the snapshot commit message all say "the 15
        evaluation points (2 null windows x 5 field sizes)", which is internally
        contradictory; 15 is NC2b-G1-PRIME's count (3 windows x 5 fields). The
        worst value 0.271670 is correct and occurs at W-MID / log2 p = 768. The
        task brief that dispatched me repeats the wrong count. Correction by
        superseding note, never by editing the archived files.
      cheapest_discriminating_control: >
        Add ONE gate with power against L1, at zero new compute: a SLOPE null.
        Take the committed null series, multiply it pointwise by ell^s for a
        declared s in {0.4, 0.8}, and require the corrected estimator to recover
        s*log2(B_opt) + REF_null to within the same 0.75 bits at every field size.
        That is a synthetic object with a KNOWN non-zero exponent, and it tests
        the part of the estimator the flat null cannot reach. It is arithmetic on
        47 committed numbers.

    - id: RT3-C7
      rank: 7
      severity: medium
      target: My own RT2-C1, as the task requires.
      claim_challenged: >
        That "the run measured A directly", as RT2-C1 asserted.
      body: >
        THAT SENTENCE IS WRONG AND I WITHDRAW IT. log2 A is the fit's
        EXTRAPOLATION to ell = 1. There is no ell = 1 datum and there cannot be:
        Phi_1 is not in the design, the smallest measured ell is 2, and W-MID's
        smallest is 11, so the intercept sits 3.46 octaves below the nearest
        observation on the primary window. RT2-C1 called 2^8.9241 a measured
        prefactor and DEC-20260802-8227b9 adjudication A repeated "the run
        measured A = 2^8.924 directly". Neither is right; A is a fitted parameter
        at an unobserved abscissa.
        WHY THE SUBSTANCE SURVIVES INTACT, WHICH IS WHY THIS IS A CORRECTION AND
        NOT A RETRACTION: the corrected law never uses A alone. It uses
        log2 A + gamma*log2(B_opt), which is the fit's PREDICTED LEVEL AT
        ell = B_opt, and the repair prices it with a JOINT bootstrap of that
        combination rather than of the intercept - visible in the row fields
        overhead_bits_low/high. The right statement is: "the fitted per-entry
        cost curve, evaluated at ell = B_opt, is 21.2 to 25.2 bits above Section
        4.1's convention", never "the measured prefactor is 2^9.73". The
        ell-INDEPENDENT floor is separately evidenced, and better, by the null
        object's own measured level 2^12.26-2^12.32, which IS a measurement.
        Adjudication A's binding prohibition and its magnitude are unaffected.
      cheapest_discriminating_control: >
        Editorial and free: every record replaces "measured intercept" with
        "fitted level at ell = B_opt (joint interval)", and cites REF_null =
        12.2595 bits as the measured statement about the ell-independent floor.

    - id: RT3-C8
      rank: 8
      severity: medium
      target: RT2-C4 (batched Sutherland-type evaluation), recomputed against the corrected law as the brief requires.
      claim_challenged: >
        Whether the corrected law makes the RT2-C4 term larger or smaller, and
        whether it is still the dominant uncertainty.
      body: >
        SMALLER IN ABSOLUTE BITS AT THE LOW READING, UNCHANGED AS A SHARE, AND
        STILL DOMINANT. The removable ell-dependent part is gamma*log2(B_opt):
          S-B/S-MIN W-MID: 0.810034 * 14.2 = 11.502 bits, of a 21.233 (alpha 0)
                           to 23.911 (alpha 1) bit total -> 48% to 54%
          S-A W-MID:       0.932864 * 14.2 = 13.247 bits, of a 22.545 to 25.223
                           bit total -> 53% to 59%
        In BATCH-002 I quoted 13.25 bits of a 25.43-bit total (52%). The seam
        removal replaced the mixed 0.9739 with 0.810 at the low reading, so the
        absolute term falls to 11.50 while the share holds at roughly half. IT
        REMAINS THE SINGLE LARGEST RESIDUAL TERM IN THE WHOLE COST MODEL - larger
        than the entire measured-gamma span (4.81 bits of margin), larger than the
        alpha question (0.43 bits), larger than L2 (0.60-1.00 bits), larger than
        A-3 (1.01 bits), and larger than the 2.2309/3.5133-bit irreproducibility
        bands by a factor of three to six.
        AN OBJECTION OF MY OWN THAT I CHECKED AND DISCARDED, RECORDED RATHER THAN
        PRESSED. I suspected the corrected law hides a Theta(ell) floor immune to
        a faster multiplication: mults_instantiate is EXACTLY (ell+1)(ell+2) -
        verified against all 752 committed samples, zero exceptions - which is
        exactly ell+2 F_{p^2}-multiplications PER ENTRY, i.e. a gamma = 1 term.
        At ell = 2^14.2 that is 14.2 bits, and under the RT2-C4 scenario (root
        finding made quasi-linear) it would become the dominant term and reinstate
        gamma = 1. IT DOES NOT SURVIVE. Algorithm 1 specialises Phi_ell at every
        j currently in L with ell*deg <= X, i.e. at N ~ M/ell >> ell arguments per
        ell, and multipoint evaluation of the ell+2 coefficient polynomials at N
        arguments costs O~(ell^2 + N*ell), i.e. O~(ell) per specialisation and
        O~(1) per entry once N >> ell. Batching is exactly what Lemma 3.3's
        footnote proposes ("the fastest way to populate the list might be through
        batched evaluations of these modular polynomials", credited to Damien
        Robert), and Algorithm 1 supplies the batch abundantly. The same argument
        batches the root-finding: one x^{p^2} modulo a product of N polynomials
        plus a remainder tree gives O~(log p) per entry. So the post-batching
        floor is O~(log p) per entry, not Theta(ell), and RT2-C4 stands.
        THE GUARD IS ALSO FINE UNDER EXTRAPOLATION, WHICH I CHECKED RATHER THAN
        ASSUMED. f_indep rises with ell in the committed data (0.002116 at
        ell = 11 to 0.002265 at ell = 211) because instantiate ~ ell^2 grows
        faster than rootfind ~ log p * ell^{1+gamma}. Extrapolated to
        ell = 2^14.2 at p = 2^40 it reaches ~0.008 (gamma 0.81) and at p = 2^256
        ~0.0012. The 0.05 threshold holds a fortiori, so FC-3 correctly does not
        fire and the whole-intercept scaling is legitimate.
        UNVERIFIED RECOLLECTION, FLAGGED AND NOT RELIED ON: I believe
        Sutherland's evaluation of modular polynomials is O~(ell^2) per
        specialisation, which is consistent with the batching argument above and
        would make the per-entry contribution O~(1) after amortisation. I did not
        retrieve the source this session - the second batch in a row in which this
        programme has not fetched it - and no number above depends on it.
      cheapest_discriminating_control: >
        UNCHANGED AND STILL FIRST IN LINE: NC2c, a Kronecker-substitution third
        implementation (pack F_{p^2}[x] products into big-integer multiplications
        and count the equivalent F_{p^2}-multiplications by the declared
        conversion). One-routine change to MULFN. PRE-REGISTER gamma_C < gamma_B <
        gamma_A. NEW AND STRICTLY CHEAPER SUB-CONTROL FROM RT3-C2: also replace
        poly_rem_monic with a Karatsuba/Newton reduction in a variant IMPL-B'',
        pre-registering that the per-band saturation of log2(A/B) disappears. If
        it does, gamma_B = 0.810 is confirmed as a transient of the unimproved
        reduction and both ends of the bracket move. SECOND, AND FREE: the
        bibliographic subtask - retrieve Sutherland (ANTS X, 2013) and the frozen
        bibliography's [15] and [3] - which has now been named as necessary in
        three consecutive red-team reports and executed in none.

    - id: RT3-C9
      rank: 9
      severity: medium
      target: >
        RT2-C7 (asymmetric realism), and the temptation to read the committed
        C-NULL as a Delfs-Galbraith per-step measurement.
      claim_challenged: >
        That this batch has anything to say about the baseline side of the
        comparison.
      body: >
        IT DOES NOT, AND I AM RECORDING THE NEAR-MISS SO THAT NOBODY ELSE MAKES
        THE INFERENCE I ALMOST MADE. The C-NULL object builds ell+1 entries by
        ell+1 successive non-backtracking 2-ISOGENY STEPS, and it measures
        4914.45 to 5118.83 counted F_{p^2}-multiplications per entry, i.e. per
        step, at p = 2^40 - that is 2^12.26 to 2^12.32. It is tempting to read
        that as the measured cost of a Delfs-Galbraith walk step, which would
        return ~12.3 bits (scaled by alpha = 1 to log2 p = 256: ~14.9 bits) to
        the attack's margin and roughly halve the entire corrected overhead. THAT
        READING IS WRONG AND MUST BE FORBIDDEN. The null's 2-isogeny step is
        computed through Phi_2 root-finding on the same pipeline - it inherits the
        whole 2*log2(p^2) exponentiation - whereas a competent DG implementation
        walks by Velu on a 2-torsion point at a cost of tens of F_{p^2}
        operations plus one subfield test. The asymmetry is not merely a
        convention either: the attack genuinely needs Phi_ell at ell ~ 2^14.2
        because Velu there would need ell-torsion over a degree-O(ell) extension,
        while DG genuinely only ever needs 2-isogenies.
        SO RT2-C7 STANDS EXACTLY AS I SCOPED IT IN BATCH-002 - a one-sided
        anti-attack bias of known sign and unmeasured magnitude, plausibly 5-7
        bits - and this batch did not measure it. It is now the largest UNMEASURED
        term in the comparison after L4, and it is cheaper to measure than
        anything else outstanding.
      cheapest_discriminating_control: >
        NC2f, sharpened by what this run built. The C-NULL harness already walks
        non-backtracking 2-isogeny chains under the instrument. Swap the Phi_2
        root-finding step for a Velu 2-isogeny step (2-torsion point, one square
        root, codomain by Velu) plus one subfield test j in F_p, in the same
        instrumented harness at the same p, and report the per-step count.
        PRE-REGISTER 2^5..2^7 F_{p^2}-multiplications. Then report the NIST-I
        margin as a difference of two MEASURED per-step costs, never as
        measured-minus-nominal. This is a ~50-line change reusing every control.

    - id: RT3-C10
      rank: 10
      severity: low
      target: Record integrity of the machine-readable artifact.
      claim_challenged: "Housekeeping that changes no headline and must not be lost."
      body: >
        (a) raw-result.json carries `anomalies: []` and TWO protocol_deviations
            (D-1, D-2). The execution report carries SEVEN anomalies (A-1..A-7)
            and THREE deviations (D-3 added). A downstream consumer parsing the
            MACHINE-READABLE result alone would conclude the run reported no
            anomalies, including A-1 (the confirmatory gate failure) and A-3.
            AGENTS.md rule 8 requires unexpected observations to be recorded;
            they are - in the YAML that D-3 discloses was generated by a
            session-scratch helper rather than by the run program. The producer's
            own machine-readable receipt is the weaker of the two records here,
            which inverts the intended hierarchy. Repair by superseding note; the
            raw file is immutable and must not be edited.
        (b) The "15 evaluation points" miscount in RT3-C6.
        (c) D-2 declined the optional tail 223..251 for a stated and good reason
            (a 4-j tail would demote the {0..7} primary fit). It is correctly
            recorded as a decision, not a result. No objection - recorded so that
            no later record describes the tail as attempted and empty.
      cheapest_discriminating_control: >
        In the superseding analysis record, publish a machine-readable
        anomalies/deviations block with the seven and three entries and a pointer
        to this gap. Free.

  # ==================================================================
  # THE BATCH-002 ADJUDICATION, ENGAGED DIRECTLY (task constraint)
  # ==================================================================
  position_on_adjudication_C_and_on_A3:
    disposition: ACCEPTED IN FULL, WITH ONE FURTHER SELF-RETRACTION
    the_validator_was_right_and_the_new_data_says_so: >
      DEC-20260802-8227b9 adjudication C upheld the Validator on the factual
      question: a residual curvature exists on a homogeneous series, 0.0225 with
      bootstrap CI [0.0194, 0.0366]. The seam-free run measures the homogeneous
      IMPL-A W-ALL curvature at 0.022425 with CI [0.019176, 0.036395]. Agreement
      to 8e-5 in the point estimate and to ~2e-3 in both CI endpoints. I record
      this as the Validator's number confirmed and my "fired on a composition
      artifact" framing correctly bounded by the Coordinator to a claim about
      MAGNITUDE only.
      HONEST QUALIFICATION SO THIS IS NOT OVERSOLD AS A REPLICATION: C-REPRO shows
      484 of this run's 752 primary samples are BIT-IDENTICAL to the superseded
      run's. The agreement is 36% new data plus a re-derivation, so it confirms
      the Validator's arithmetic robustly and the phenomenon partially.
    the_coordinators_operative_ruling_is_also_confirmed: >
      Adjudication C ruled the residual curvature REAL, SMALL-ell-CONCENTRATED and
      NOT EXTRAPOLABLE, and named a homogeneous nested-window curvature with
      bootstrap CIs as the discriminating control. That control now exists, on a
      seam-free series, and it rules the same way. S-A nested quadratic
      coefficient: 0.022425 (W-ALL) -> 0.011169 (ell>=11) -> 0.006708 (ell>=23)
      -> 0.007982 (ell>=43) -> 0.016042 (ell>=101, CI [-0.0007, 0.0391]
      INCLUDING ZERO). Dropping the four smallest ell halves it; at the top of the
      range it is no longer distinguishable from zero. The ruling holds.
    what_i_retract_from_my_own_batch_002_report: >
      RT2-C2 stated that "on the homogeneous IMPL-A series the local slope is flat
      at 0.93-0.97 from ell = 17 through ell = 197 and shows no acceleration at
      all." THAT IS WRONG AND I WITHDRAW IT, in the same terms as I withdrew
      RT-C1's gamma = 2. The seam-free per-band local slopes for IMPL-A are
      0.8871 (17..31), 0.9420 (37..61), 0.9452 (67..127) and 0.9647 (131..211): a
      monotone rise of 0.078 across four bands, entirely consistent with the
      Validator's 0.0225 curvature and inconsistent with "no acceleration at all".
      My rolling-window table in BATCH-002 was too coarse to see it and I stated
      the conclusion more strongly than the estimator supported.
    what_survives_and_is_now_stronger: >
      MY OPERATIVE CONCLUSION STANDS AND NOW HAS A CEILING ARGUMENT INSTEAD OF AN
      EMPIRICAL ONE. Structurally, per_entry(ell) ~ 4*log2(p) * M(ell)/(ell+1),
      so gamma = exponent(M) - 1, and M in this pipeline is at most schoolbook
      Theta((ell+1)^2). THEREFORE gamma <= 1 EXACTLY, FOR EVERY SERIES, AT EVERY
      ell, FOR THIS PIPELINE. The measured approach 0.887 -> 0.965 is an approach
      to that ceiling from below, not an unbounded rise. The c = 2 scenario
      requires per-entry ~ ell^2 and per-batch ~ ell^3, which no
      polynomial-multiplication-based pipeline produces. This experiment CANNOT
      generate the scenario my own July report headlined, and adjudication D's
      retirement of it is confirmed by a method-ceiling argument rather than only
      by a flat measurement.
    does_A3_show_my_operative_conclusion_was_wrong: >
      NO, AND HERE IS THE ARITHMETIC. A-3's gap is 0.958496 - 0.810034 = 0.148462
      in the exponent. RT3-C2 accounts for it as the Karatsuba band structure
      (delta = -0.0749 per recursion level on IMPL-B, +0.0066 on IMPL-A, with
      W-TOP wholly inside band 4 and in the rising tail of its tooth), and the
      run's own null contributes 0.3292 bits of W-TOP drift at NIST-I on an object
      that is flat by construction. Correctly paired with its own intercept,
      W-TOP moves the NIST-I margin from 10.3578 to 9.3508 bits at alpha = 1 -
      1.007 bits - and log2 p = 768 from 62.9289 to 60.1552 - 2.774 bits. Both are
      inside the modelling-choice bracket already published. A-3 is a real,
      correctly-archived observation about the estimator's window, not evidence
      that the exponent is rising toward 2.
      WHERE A-3 DOES BITE, AND I SAY IT AGAINST MY OWN SIDE: it exposes that
      gamma_B = 0.810 is a transient, because IMPL-B leaves poly_rem_monic
      schoolbook, so the bracket's LOW end is the optimistic one (RT3-C2
      counter-consideration, worth up to -1.75 bits of margin).

  # ==================================================================
  # THE MARGIN ARITHMETIC THE BRIEF ASKED FOR
  # ==================================================================
  nist1_margin_arithmetic:
    method: >
      RT3 recomputation. Inputs are committed constants: log2 T_full =
      108.73088958800618, T_DG = 2^128, log2 B_opt = 14.2 from
      RUN-WESOVOW-001 per_field."log2p=256"; (log2 A, gamma) from
      RUN-PEC-49c773-a fit.series. margin(w) = 128 - (108.73089 - 0.5*log2 w +
      overhead_bits), the committed model's own vOW interpolation. All rows at
      w = 2^30 per the standing DEC-20260802-8227b9 prohibition (larger-w rows are
      not read as improvements).
    base_margin_with_zero_overhead: 34.2691
    rows_at_w_2e30:
      - {scenario: "paper Section 4.1 convention (per_entry = 1)", overhead_bits: 0.0000, c: 0.000000, margin_bits: 34.2691}
      - {scenario: "BRACKET LOW: S-B/S-MIN W-MID, alpha 0", overhead_bits: 21.2332, c: 1.327077, margin_bits: 13.0359}
      - {scenario: "S-A W-MID, alpha 0", overhead_bits: 22.5450, c: 1.409064, margin_bits: 11.7241}
      - {scenario: "S-B/S-MIN W-MID, alpha 1", overhead_bits: 23.9113, c: 1.494456, margin_bits: 10.3578}
      - {scenario: "BRACKET HIGH: S-A W-MID, alpha 1", overhead_bits: 25.2231, c: 1.576444, margin_bits: 9.0460}
      - {scenario: "S-B/S-MIN W-MID, alpha = alpha_hat 1.1597", overhead_bits: 24.3390, c: 1.521187, margin_bits: 9.9301}
      - {scenario: "S-A W-MID, alpha = alpha_hat 1.1597", overhead_bits: 25.6508, c: 1.603174, margin_bits: 8.6183}
      - {scenario: "A-3 reading: S-B W-TOP, alpha 1", overhead_bits: 24.9183, c: 1.557395, margin_bits: 9.3508}
      - {scenario: "most adverse of 18 measured-gamma readings (S-A W-TOP, alpha_hat)", overhead_bits: 25.9193, c: 1.619957, margin_bits: 8.3498}
      - {scenario: "least adverse of 18 measured-gamma readings (S-B W-ALL, alpha 0)", overhead_bits: 21.1147, c: 1.319669, margin_bits: 13.1544}
      - {scenario: "L4 batched/quasi-linear (gamma -> 0), S-A W-MID intercept, alpha 1", overhead_bits: 11.9764, c: 0.748525, margin_bits: 22.2927}
      - {scenario: "L4 batched, S-A W-MID intercept, alpha 0 (loosest constructible)", overhead_bits: 9.2984, c: 0.581147, margin_bits: 24.9708}
      - {scenario: "RT3-C2 saturation reading (S-B intercept with gamma -> gamma_A), alpha 0", overhead_bits: 22.9781, c: 1.436129, margin_bits: 11.2910}
    corrections_not_applied_to_the_rows_above_and_why:
      - "RT3-C1 entry-weighting: every row above is 0.60 to 1.00 bits PESSIMISTIC. Not applied because it is my derivation, not the run's; it shifts the whole table uniformly upward and changes no ordering."
      - "RT2-C7 symmetric realism: plausibly 5-7 bits back to the attack, unmeasured, of known sign, deliberately applied to no row (RT3-C9)."
      - "The baseline constant k from the frozen bibliography's [15] and [3] remains unquantified in this repository after three batches; every row carries that in addition, in the attack's disfavour if k > 1."
    irreproducibility_band:
      nist1_time_deviation_bits: 2.2309
      max_abs_deviation_all_five_fields_time_and_memory_bits: 3.5133
    verdict: >
      THE SIGN IS ROBUST AND THE MAGNITUDE IS NOT. Every one of the eighteen
      measured-gamma readings (6 fits x 3 alphas) lands the NIST-I margin in
      [8.3498, 13.1544] at w = 2^30 - a 4.805-bit span whose worst member clears
      the 2.2309-bit band by 6.1 bits and the 3.5133-bit band by 4.8 bits.
      Adding L4 (batched evaluation, unimplemented) opens the span to
      [8.3498, 22.2927] at alpha = 1 throughout (width 13.94) or
      [8.3498, 24.9708] allowing alpha in {0, 1, alpha_hat} (width 16.62).
      That width is still set almost entirely by a subroutine nobody has written,
      exactly as in BATCH-002, and it is four to seven times the irreproducibility
      band. A 14-to-17-bit interval is not a concrete threat assessment.

  # ==================================================================
  required_controls:
