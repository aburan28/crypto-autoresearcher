  # ==================================================================
  # 6. DEVIATIONS AND DOUBLE READINGS
  # ==================================================================
  deviation_assessments:

    - id: D-1
      what: "C-PSCALE's p1/p2 measurement arms executed after acquisition (step 3b) rather than at execution_order step 11."
      my_assessment: DEVIATION FROM THE FROZEN ORDER, MATERIALLY HARMLESS, INDEPENDENTLY VERIFIED AS SUCH
      reasoning: >
        The phase record confirms the reordering (c_pscale_measurement_seconds
        sits between acquisition_and_cbase2_seconds and pool_and_cbase1_seconds).
        The Executor's argument that it cannot change a measured number is not
        merely asserted: each p-arm runs in a forked child so the instrument's
        process-global prime cannot leak, and C-REPRO -- which I reconstructed
        independently -- shows the parent's 884 overlapping samples are
        bit-for-bit identical to the superseded run.  That is an empirical
        refutation of the contamination route, not a promise.  The >= 900 s
        budget gate was moot: the whole run finished in 791.751 s of 5400.
      but_note: >
        The stated authority is a Coordinator HANDOFF MESSAGE, not a superseding
        contract.  The frozen contract says editing it after the snapshot is a
        violation and that an underspecification is reported rather than resolved
        by the Executor.  A dispatch message cannot amend a frozen protocol.  The
        Executor handled this correctly by recording the deviation openly with
        its authority named rather than silently complying; the process point is
        for the Coordinator, not a defect in the data.

    - id: D-2
      what: "The optional tail ell 223..251 was not attempted (--skip-tail)."
      my_assessment: DEFENSIBLE ON THE EVIDENCE, BUT ONE OF ITS TWO STATED REASONS DOES NOT SURVIVE THE FROZEN j_set_rule, AND IT COSTS THE ONE MEASUREMENT THAT WOULD HAVE BEARED ON A-3
      reason_a_j_set_conflict: WEAKER THAN PRESENTED
      reason_a_analysis: >
        The Executor argues that admitting a tail ell measured at j 0..3 would
        force the primary fit's common j-set down to {0..3} and demote the {0..7}
        fit.  But the frozen j_set_rule anticipates exactly this and tie-breaks
        it: "If both a common {0..7} and a common {0..3} fit are available, the
        {0..7} fit is primary and the {0..3} fit is reported as the j-subset
        sensitivity."  With a tail ell admitted, both fits remain computable, so
        the contract already says which is primary.  Reason (a) alone would not
        have justified the omission.
      reason_b_cap_obstruction: SOUND AND EVIDENCE-BACKED
      reason_b_analysis: >
        I verified it directly against the committed superseded record: all seven
        tail ell (223, 227, 229, 233, 239, 241, 251) returned curl exit 63,
        "Maximum file size exceeded", against the frozen 67108864-byte per-ell
        cap, at HTTP 200.  Under this contract's own carried on_cap_or_failure
        rule the tail therefore cannot be acquired, and attempting it would have
        produced seven obstruction records and zero admitted ell.  The expected
        yield really is zero.
      was_it_a_convenient_omission: >
        On balance, NO -- the cap evidence is decisive and the tail binds no
        completion gate.  But the receipt would have been strictly stronger had
        the tail been attempted and the obstruction recorded FIRST-HAND, at a
        cost of about 3 seconds of a 4600-second surplus; as archived, this run
        relies on the superseded run's obstruction records for a fact about its
        own execution.  And the omission is not free of scientific cost: 223..251
        is where the top-of-range steepening of A-3 lives, and seven more points
        would have sharpened the W-TOP window that A-3 and V-8 turn on.  Recorded
        as an observation, not as a finding against validity.

    - id: D-3
      what: "manifest.yaml and execution_report.yaml generated from raw-result.json by a session-scratch helper rather than by the run program."
      my_assessment: ACCEPTABLE, WITH ONE CONSEQUENCE THAT MATERIALISED
      reasoning: >
        The claim that every number in both YAML files is copied from
        raw-result.json by code is consistent with everything I sampled: I
        checked the fits, the gate numbers, the c table, the control verdicts and
        the coverage fractions in both files against raw-result.json and found no
        transcription error in any NUMBER.  The helper is not a declared artifact,
        so its own code is not archived -- which is why the PROSE around those
        numbers is unverified by construction, and that is exactly where the
        defects V-3, V-4, V-5 and V-6 sit.  Numbers survived the pipeline; labels
        did not.

