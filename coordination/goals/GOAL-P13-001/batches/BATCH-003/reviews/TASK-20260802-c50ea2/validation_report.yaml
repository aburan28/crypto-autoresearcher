      what: "The NC2b-G1 null gate, recomputed independently."
      how_i_did_it: >
        From RUN-PEC-6be870-a's controls.C-NULL.per_ell_per_entry (25 ell,
        2..101) I refitted log2(per_entry_null) on log2(ell) on W-ALL (all 25)
        and W-MID (ell >= 11); took REF_null as the MEDIAN over that window's own
        fitted ell of log2(per_entry_null(ell)); evaluated N_null = log2 A_null +
        gamma_null * log2(B_opt) at alpha = 0 at all five field sizes of the
        frozen constants table; and compared |N_null - REF_null| against 0.75.
      contract_conformance_check:
        tolerance_used: "0.75 bits -- the value the frozen contract pre-registers in nc2b.gate.criterion.  Not relaxed."
        alpha_used: "0 -- as nc2b.gate.estimator_output and evaluated_at_alpha_0_because require.  The alpha = 1 null values are reported separately as an ungated diagnostic, as the contract directs."
        reference_statistic: "median over the null's fitted ell of log2(per_entry_null(ell)) -- as pre-registered."
        windows: "W-ALL and W-MID, the committed null's only two fitted windows, exactly as the criterion names them."
      my_numbers:
        null_fits:
          W-ALL: "n=25, gamma_null = +0.003186000806543 (committed +0.003186000806543, deviation 0.0), log2 A_null = 12.2399196768, REF_null = 12.2594689277"
