  # ==================================================================
  # 2. RESOLUTION OF BATCH-002 FINDINGS F-1, F-3, F-4
  # ==================================================================
  batch002_finding_dispositions:

    - id: F-1
      original_title: "The primary response variable changes definition inside the fitted range."
      disposition: RESOLVED
      how_i_checked_it: >
        I did not read the producer's membership code.  I rebuilt the response
        from samples_primary myself: indexed all 752 per-sample records by
        (impl, ell, j_index), required the frozen membership conditions C-1..C-4
        directly, aggregated by median over the common j-set, and refitted.
      evidence:
        membership_rule_applied_as_frozen: >
          47 acquired ell, 47 admitted, 0 excluded.  I verified independently
          that at EVERY one of the 47 ell both IMPL-A and IMPL-B carry data at
          the IDENTICAL j-index set {0,1,2,3,4,5,6,7} (C-1 and C-2), that the
          null covers every admitted ell (C-3), and that the recorded C-BASE.2
          and C-BASE.3 per-ell verdicts are pass at every ell (C-4).  The
          membership_audit's 47 rows carry no False flag, and my reconstruction
          agrees row for row.
        no_ell_silently_changed_series: >
          Because both implementations exist at every admitted ell, the pointwise
          minimum is evaluable at every admitted ell.  The response therefore
          cannot switch constituent: the frozen rule EXCLUDES a point rather than
          substituting a different definition, and there was nothing to exclude.
          I confirmed the S-MIN series equals the S-B series at all 47 ell.
        gamma_S_MIN_W_MID_recomputed_by_me: 0.8100336227
        note_on_the_handoff_figure: >
          The dispatching message for this task quotes gamma(S-MIN, W-MID) as
          0.8100343886.  That value appears NOWHERE in the run package.  The
          archived value is 0.8100336226739335 and my independent refit from the
          raw samples gives 0.8100336226739335 exactly.  The discrepancy is in
          the handoff message, not in the receipt; recorded so it is not
          propagated.
        S_MIN_identity_with_S_B: >
          CONFIRMED but stated more precisely than the receipt does.  IMPL-B is
          STRICTLY cheaper at 41 of 47 ell and EXACTLY EQUAL at 6 (ell = 2, 3, 5,
          7, 11, 13), where all 8 j give byte-identical per_entry for the two
          implementations.  The instrument explains it: KARATSUBA_THRESHOLD = 16
          in per_entry_cost.py makes poly_mul_kara delegate to poly_mul_school
          for operand length <= 16.  min(a, a) = a, so S-MIN still coincides with
          S-B pointwise and every S-MIN fit equals the S-B fit; the conclusion is
          unaffected.  See finding V-6.
        seam_removed_and_its_magnitude_confirmed: >
          The superseded-comparison table has exactly 25 of 46 overlapping ell at
          zero difference -- precisely the core grid where the superseded
          response already used IMPL-B -- and 21 nonzero, ALL on the extension
          103..211 and ALL negative, i.e. this run's S-MIN is cheaper there
          because IMPL-B now exists.  At ell = 103 the difference is -0.378627
          bits, which reproduces the +0.3731-bit definitional step BATCH-002
          measured at the seam.  The step across 101 -> 103 falls from 0.395971
          bits in the superseded mixed response to 0.017345 bits in this run's
          S-MIN, against 0.027440 bits expected from a smooth exponent of ~0.97.
          The seam is gone and its size is confirmed by direct measurement.
        preregistered_verdicts_follow_from_the_data: >
          I recomputed each: P1a MET (0.8100336227 <= max(0.9328644281,
          0.8100336227), forced for a pointwise minimum, correctly labelled as a
          consistency check); P1b MET (0.8100336227 <= 0.9382, margin 0.1282);
          P2 MET (W-ALL quadratic coefficient of S-MIN = 0.0105853942 < 0.0453,
          bootstrap CI [0.0073207362, 0.0242839411] excluding zero, so the
          misspecification declaration STANDS at roughly a quarter of the
          superseded magnitude); P3 MET (gamma_A - gamma_B = 0.1228308054 >=
          0.10 on the common window, all 43 ell, both series fitted on the
          identical window as C-ALT.common_window_rule requires); P4 MET (max
          |move| of a W-MID slope between the {0..7} and {0..3} j-sets =
          0.0018889624 < 0.010; my own refit gives S-A 0.0013694742, S-B and
          S-MIN 0.0018889624).
      residual_caveat_carried_forward: >
        F-1 is resolved as a DEFINITIONAL matter.  It is not resolved as a
        modelling matter: see V-7 and V-8.  The seam-free primary is now the
        CHEAPER implementation across the whole range, so the headline
        attack-favourable exponent 0.810 is lower than either homogeneous
        reading available in BATCH-002 -- correct under the contract, but it
        makes the choice of window (V-8) the dominant remaining lever on c.

    - id: F-3
      original_title: "Half of the fitted range is not null-controlled by the receipt."
      disposition: RESOLVED
      c_null_coverage_as_an_explicit_fraction:
        W-ALL: "47 of 47 = 1.0000"
        W-MID: "43 of 43 = 1.0000"
        W-TOP: "8 of 8 = 1.0000"
      how_i_checked_it: >
        Not by reading the coverage field.  I indexed all 752 samples_null
        records and confirmed the null ell set is EXACTLY the admitted ell set,
        with all 16 (implementation, j_index) combinations present at each of the
        47 ell.  I then recomputed the per-ell null aggregate as the median over
        the j-pool: maximum deviation from the run's per_ell_per_entry series was
        0.0 at every ell.
      gamma_null_recomputed_by_me:
        W-ALL: "n=47, gamma_null = +0.003268842163, log2 A_null = 12.239434399836, run's bootstrap CI [-0.00732944, +0.01332816] contains 0, |gamma_null| <= 0.15 -> pass"
        W-MID: "n=43, gamma_null = -0.003547422350, log2 A_null = 12.284968689029, CI [-0.00983974, +0.00627353] contains 0 -> pass"
        W-TOP: "n=8,  gamma_null = +0.049694860976, log2 A_null = 11.888609386139, CI [-0.05775327, +0.15975997] contains 0 -> pass"
      inventor_protocol_section_3_check: >
        The null object is of the same shape as the primary (same harness, same
        counting unit, same denominator convention, ell+1 entries by ell+1
        successive non-backtracking 2-isogeny steps) and its per-entry cost is
        O(1) in ell BY CONSTRUCTION.  The measured quantity does what it should:
        the null's exponent is ~0.003 against a primary exponent of 0.79-0.97,
        and full-grid flatness is 4914.45 / 5118.83 = 0.9601 over ell 2..211,
        inside the required 2^{+/-0.5}.  The reported ell-dependence is therefore
        controlled against a null of the same shape over 100 per cent of every
        fitted window, which is exactly what F-3 asked for and what the
        superseded run could not supply.
      structural_repair_verified: >
        Coverage is now a PRECONDITION of membership (condition C-3), not a
        verdict recorded afterwards, and the null runs at execution_order step 5,
        before the primary.  I confirmed the ordering from the archived phase
        timings (c_null_seconds precedes primary_pass1_seconds) and from the
        stdout transcript.  Under this construction F-3 cannot recur under any
        truncation, which is the right kind of fix.

    - id: F-4
      original_title: "C-ALT.2 is a weak independence control: shared pipeline plus shared Cantor-Zassenhaus stream."
      disposition: PARTIALLY RESOLVED -- correctness limb bought back and verified; independence limb NOT restored, by explicit design; binding consequence carried in two of three receipt files (see V-4)
      what_the_contract_chose: >
        The contract RETAINED the paired CZ stream (seeded on (ell, j_index) and
        not on implementation) and bought back the correctness half through the
        new control C-SEED.  It stated the trade in both directions and made the
        loss binding: "gamma_A and gamma_B remain NON-INDEPENDENT estimates.  No
        record produced under this contract may present their agreement, or their
        difference, as agreement between two independent implementations."
      is_that_adequate: >
        For the CORRECTNESS question, yes, and the improvement is real and
        checkable.  I verified independently that the C-SEED probe genuinely
        changes the random stream: cz_attempts differ between IMPL-B and IMPL-B'
        at 23 of the 24 pairs (e.g. 12 vs 21 at ell = 11, j = 0), and the seed
        strings differ ("EXP-PEC-6be870|cz|11|0" vs
        "EXP-PEC-49c773|cseed|IMPL-B-prime|11|0").  Root-set identity
        nevertheless holds at all 24 pairs on my own comparison of roots_sha256.
        A shared-pipeline defect that survives a change of split structure is
        therefore now excluded on those 24 samples, which C-ALT.2 alone could
        never have shown.
        For the INDEPENDENCE question, no, and the contract does not claim
        otherwise.  gamma_A and gamma_B are still computed on the same algebraic
        paths; their difference measures the multiplication routine under a fixed
        split structure and nothing more.
      what_C_SEED_does_not_bound: >
        C-SEED covers 6 of 47 ell (12.8 per cent), 4 of 8 j, and one
        implementation.  It bounds the PER-SAMPLE split-structure cost ratio
        (cost_B'/cost_B in [0.977665, 1.100636], median 0.999217 -- I reproduced
        the extremes) but it does not bound the effect on the FITTED EXPONENT,
        which is the quantity F-4 was about.  The receipt does not compute a
        gamma_B' at all.
      validator_side_supplementary_bound:
        status: "VALIDATOR-SIDE, NOT PART OF THE RECEIPT and not citable as run evidence (the SP-5 rule applied to my own work)."
        measurement: >
          Over the 6 C-SEED ell at j 0..3 I fitted both streams: gamma(IMPL-B) =
          0.809115 and gamma(IMPL-B') = 0.801153, a difference of 0.007962
          against a reported implementation gap of 0.122831.
        reading: >
          On this bounded probe the split-structure contribution to the fitted
          exponent is about 6.5 per cent of the measured A-vs-B gap, i.e. the
          paired design does not manufacture the gap.  This SUPPORTS the
          contract's choice.  It is 6 ell, so it bounds rather than settles, and
          it is my measurement, not the producer's.
      binding_consequence_carried: >
        PARTIALLY.  manifest.yaml carries it (inputs.parameters.cz_seed_policy)
        and raw-result.json carries it twice (controls.C-ALT.2.seed_policy and
        preregistered_predictions.P3.non_independence_note).
        execution_report.yaml does NOT: it reports gamma_A beside gamma_B and
        their difference at P3 with no non-independence label anywhere in the
        file.  That is a breach of a binding clause of the frozen contract and is
        recorded as finding V-4.

