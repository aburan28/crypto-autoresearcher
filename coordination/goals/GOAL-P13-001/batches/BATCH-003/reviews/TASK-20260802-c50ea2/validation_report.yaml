    experiments/EXP-PEC-49c773/specification.yaml, on
    implementation/corrected_extrapolation.py, or on any file of
    RUN-PEC-49c773-a.  Every number reported below as "mine" was recomputed in
    this session by code written here from the FROZEN CONTRACT TEXT, reading
    only the archived raw per-sample data -- never by executing the producer's
    implementation and never by copying its summary fields.
  reviewed_snapshot_commit: 84356221fbb448127245539e944c896a6e97cee5
  frozen_contract_commit: e9a850f2c5e102d501b3ff846a939fa1c05f7050
