  # ==================================================================
  # 1. TERMINAL VERDICT
  # ==================================================================
  verdict: VALID-WITH-OBSERVATIONS
  verdict_in_validator_schema_terms: passed
  verdict_rationale: >
    Every one of the ten declared artifacts is present and its SHA-256 matches
    both the archive receipt and the blob committed at 84356221.  The superseded
    tree experiments/EXP-PEC-6be870/ is byte-identical to 49166fa5 by git tree
