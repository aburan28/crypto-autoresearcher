    reproduces from the archived raw data under my own independent
    implementation of the frozen protocol: the NC2b null gate to the last
    reported digit (worst |N_null - REF_null| = 0.271670 bits, margin 0.478330),
    the corrected c at all five field sizes and both alpha (max |dc| = 4.4e-16
    over 30 NC2b rows and 90 NC2a rows), all nine linear fits to 0.0 deviation,
