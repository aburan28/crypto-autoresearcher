      what: "NC2b carried inputs: do the committed superseded window fits reproduce by refit?"
      method: "OLS of log2(per-ell primary median) on log2(ell) over each window, from RUN-PEC-6be870-a's per_ell.primary_min_over_implementations (46 ell, 2..211, no 97)."
