# that report is a REVIEW artifact, not a producer artifact, so independence
# from the thing being validated is preserved.
#
# This report verifies integrity, arithmetic and controls.  It changes no
# research status, promotes nothing, lifts no standing prohibition, and asserts
# nothing about H-WESO-001, about the frozen paper's Section 4.1 assumption, or
# about any ECDLP or isogeny claim.  A passed validation means the receipt is
# ADMISSIBLE EVIDENCE.  It does not mean the corrected estimator is correct,
# does not demonstrate a speedup, and does not authorise promotion.
