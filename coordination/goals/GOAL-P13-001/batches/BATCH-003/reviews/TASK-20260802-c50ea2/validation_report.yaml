        passage: "C-BASE.3's >= 0.90 criterion read per ell for membership condition C-4 vs globally."
        verified_by_me: YES
        my_result: "Vacuous in this run in the best possible way: the fraction is exactly 1.0000 both globally (752/752) and at every one of the 47 ell (16/16 each), so no ell's membership can turn on the reading.  I confirmed this from the raw samples rather than from the per_ell_fraction field."

  # ==================================================================
  # 7. THE TWO ANOMALIES THE TASK SINGLED OUT
  # ==================================================================
  anomaly_assessments:

    - id: A-1
      subject: "NC2b-G1-prime FAILS at 1 of 15 points (W-TOP, log2 p = 768, 0.920520 bits)."
      does_the_primary_gate_survive: YES
      why: >
        NC2b-G1 and NC2b-G1-prime are different tests on different objects and the
        contract designates the former as the gate OF RECORD, precisely because it
        is the zero-compute item on the committed null.  Its criterion names "EACH
        of the null's fitted windows (W-ALL and W-MID)"; the committed null has no
        W-TOP, so evaluating G1 at ten points is contract-faithful, not a
        narrowing.  G1-prime is declared "confirmatory" and a disagreement is
        declared in advance to be "a finding and is reported".  It was reported,
        with the failing point named and nothing adjusted.  I reproduced all 15
        G1-prime points independently and got the same single failure at the same
        magnitude, 0.920520 bits.  No contract deviation.
      is_the_executor_explanation_adequate: ARITHMETICALLY YES, DIAGNOSTICALLY INCOMPLETE
      my_analysis: >
        The Executor's account -- an 8-point null window whose gamma_null =
        0.049695 satisfies C-NULL's own |gamma_null| <= 0.15 criterion but whose
        slope times log2 B_opt = 26.1 exceeds 0.75 bits -- is exactly right as
        arithmetic (0.049695 x 26.1 = 1.297, and REF sits 0.9205 below N).  What
        it does not say is WHICH WAY the calibration is wrong, and the answer
        matters.
      the_tolerance_is_not_too_loose_it_is_uncalibrated: >
        The contract derived the 0.75-bit tolerance from the committed null's
        REALISED properties -- 0.202 bits of flatness span plus |gamma_null| x
        log2 B_opt = 0.346 bits, summed to ~0.55 and rounded up.  That derivation
        contains no term for the SAMPLING ERROR of the null slope, which is the
        dominant term once the slope is multiplied by a lever arm of up to 26.1.
        VALIDATOR-SIDE supplementary computation, analytic OLS 95 per cent
        interval for the extrapolated level N = a + b*x0 (mine, not the
        producer's, not run evidence):
          - committed null W-MID at log2 B_opt = 14.2: N = 12.1454 +/- 0.1506
          - committed null W-MID at log2 B_opt = 26.1: N = 11.9878 +/- 0.3523
          - NEW null W-TOP at log2 B_opt = 14.2:       N = 12.5943 +/- 0.4875
          - NEW null W-TOP at log2 B_opt = 26.1:       N = 13.1856 +/- 1.3626
        Read those against the fixed 0.75-bit tolerance.  On the 8-point W-TOP
        window at 768 bits the tolerance is roughly HALF the 95 per cent
        half-width of the very quantity it constrains, so that arm of G1-prime has
        essentially no resolving power: its failure is not evidence that the
        corrected estimator is biased at the top field size, and a pass there
        would not have been evidence that it is unbiased.  Conversely, on the
        gate of record the observed worst miss (0.2717) is comfortably inside its
        own +/- 0.3523 noise band, and the remaining margin (0.4783) is only about
        1.4 noise half-widths.  So the PASS is a genuine pass at the frozen
        tolerance, but it is a ONE-NOISE-UNIT pass, not a large-margin one.
      what_this_does_and_does_not_license: >
        It licenses: reporting NC2b-G1 as PASSED at the pre-registered tolerance,
        which is what the contract asks and what I confirm.
        It does not license: describing the corrected estimator as accurate to
        0.75 bits at log2 B_opt = 26.1.  The run's own confirmatory arm
        demonstrates inside this very package that it is not, on a null object
        whose true exponent is zero by construction.  Any downstream record
        quoting the gate PASS must carry A-1 with it.
      attribution: "This is a defect in the FROZEN CONTRACT's tolerance derivation (a missing variance term), not an Executor deviation.  The Executor applied the frozen number and reported the disagreement, which is the correct handling."

    - id: A-3
      subject: "IMPL-B steepens at the top: gamma_B 0.810034 (W-MID) vs 0.958496 (W-TOP); nested quadratic over ell >= 101 = 0.167076, CI [0.141153, 0.192587], excluding zero."
      my_verification: "All figures reproduce exactly from my own refits (M-4).  The contrast with S-A is sharp and also reproduces: over ell >= 101, S-A's quadratic coefficient is 0.016042 with CI [-0.000697, +0.039126], which does NOT exclude zero, while S-B's is 0.167076 with a CI ten standard-widths clear of zero."
      is_it_real_or_an_artifact_of_a_narrow_window: REAL
      why_not_noise: >
        The counter is near-deterministic: the W-TOP fits have R^2 0.99940
        (S-B) and 0.99970 (S-A) with max |residual| of 0.004315 and 0.002597
        bits.  The consecutive-point local slopes over the last five admitted ell
        average about 1.0 for IMPL-B.  And the trend is monotone in a rolling
        8-ell window: gamma_B moves 0.740 -> 0.778 -> 0.790 -> 0.805 -> ... ->
        0.909 -> 0.935 while gamma_A moves 0.769 -> 0.887 -> 0.933 -> ... ->
        0.961.  Both series' quadratic gamma_local_top at x_max converge to
        0.9744 (S-A) and 1.0087 (S-B).
      mechanism_i_identified_by_reading_the_committed_instrument: >
        per_entry_cost.py substitutes ONLY the multiplication routine between the
        two implementations (poly_mul_school vs poly_mul_kara, with
        KARATSUBA_THRESHOLD = 16).  poly_rem_monic -- the modular reduction that
        every poly_powmod iteration performs after every multiplication -- is
        SCHOOLBOOK and is used UNCHANGED by both implementations; its cost is
        Theta(ell^2) in the counted unit.  As ell grows, Karatsuba drives IMPL-B's
        multiplication term below the shared quadratic reduction term, so IMPL-B's
        TOTAL becomes reduction-dominated and its measured exponent must rise
        toward IMPL-A's.  Three independent signatures in the run's own data
        confirm this: (i) the A/B cost ratio saturates -- 1.000 at ell 13, 1.295
        at 101, 1.396 at 151, 1.4055 at 199, 1.4049 at 211; (ii) the exponent gap
        collapses on W-TOP, where the receipt's own P3.all_windows records gamma_A
        - gamma_B = 0.012692 against 0.122831 on W-MID; (iii) both series'
        local top-of-range exponents converge to ~0.97-1.01.
      what_it_does_to_the_extrapolation: >
        Three things, all of which a downstream record must carry.
        (1) It sharpens the misspecification finding rather than softening it.
        P2 is MET (the W-ALL curvature is a quarter of the superseded value) and
        the seam explanation of adjudication B is confirmed -- but "the curvature
        was mostly the seam" and "the local exponent is still rising at ell = 211"
        are both true, and only the first is in the headline.  Assumption L1 is
        not merely UNTESTED over the 7.5 unmeasured octaves at NIST-I; it is
        CONTRADICTED WITHIN the ~7 measured octaves for S-B, which is the series
        the headline bracket's low end uses.
        (2) It makes the WINDOW, not the sampling error, the dominant intra-run
        lever on c.  VALIDATOR-SIDE: the analytic 95 per cent interval on the
        extrapolated overhead for the primary series is +/- 0.0022 in c at NIST-I
        and +/- 0.0053 at 768 bits -- essentially nil, because the counter is
        deterministic.  The window choice moves c far more: for S-B at alpha = 0
        the three windows give 1.3197 / 1.3271 / 1.3900 at NIST-I (span 0.0703)
        and 1.1031 / 1.1140 / 1.2141 at 768 bits (span 0.1110), i.e. 13 to 21
        times the sampling band.  Any record quoting a bootstrap CI on c beside
        the point estimate will understate the real spread by more than an order
        of magnitude; the contract's reported_interval note anticipates this and
        the run's gamma_reported_interval [0.7694, 0.9716] for S-B is the honest
        object.  The HEADLINE BRACKET, however, is W-MID only.
        (3) It puts a directional caution on the bracket's LOW end.  The
        bracket's low end c(S-B, W-MID, alpha = 0) rests on gamma_B = 0.810, an
        average over a range in which the same series' local exponent has already
        risen to ~0.96-1.01 by ell = 211.  Under the contract's pairing rule the
        W-TOP row is the like-for-like alternative and it is higher: 1.3900 vs
        1.3271 at NIST-I and 1.2141 vs 1.1140 at 768 bits.  So the low end of the
        bracket is not a conservative floor on THIS implementation's overhead; it
        is the reading least supported by the top of the measured range.
      what_it_does_NOT_do: >
        It does not make the exponent at ell ~ 2^14.2 knowable.  The mechanism I
        identify predicts a ceiling near the schoolbook exponent rather than
        unbounded growth, but that is an argument about committed code, not a
        measurement, and I make no claim beyond the measured range.  It also does
        not touch L4: a batched Sutherland-type evaluation is still unimplemented
        and could move the exponent by more than everything discussed here
        (RT2-C4).  A-3 is a fact about an unoptimised pure-Python pipeline over
        ell <= 211 and nothing more.
      relation_to_the_earlier_dispute: >
        In BATCH-002 I attributed the elevated 0.9739 to the seam and computed
        IMPL-A alone at 0.9179 over 11..101 versus 0.9588 over 103..211 -- which,
        read now, was already a top-of-range steepening inside a single
        implementation.  The seam-free data settle the dispute in a way that is
        partly against my own earlier emphasis: the composition explanation
        stands (P1b MET by a wide margin, the 101/103 step falls from 0.396 to
        0.017 bits), AND a real steepening exists at the top of the range that is
        not a composition artifact.  Both are true.  The red team's contention
        that the exponent is rising at the top of the measured range is SUPPORTED
        by this run's own data for IMPL-B, on a genuinely seam-free response.

    - id: A-2-and-others
      note: >
        A-2 (FC-4 fires) is verified in M-5 and is a real weakening of assumption
        L5's justification, not a formality.  A-4 (the seam probe: residuals at
        101 and 103 are not the two largest; the two largest are at ell = 11 and
        13) I reproduced from the residual tables and is the expected signature of
        a removed seam.  A-5 is fully explained in the F-1 entry: 21 of 46
        differences, all on the extension, all negative, magnitude 0.3786 to
        0.4961 bits -- it IS the seam, measured.  A-6 (no infrastructure failure;
        47/47 fetches HTTP 200) I verified.  A-7 (S-MIN carries no information
        beyond S-B) I verified and refine in V-6.  All seven anomalies are
        recorded rather than smoothed, which is the correct handling under
        AGENTS.md rule 8.

  # ==================================================================
  # 8. FINDINGS, RANKED BY SEVERITY
  # ==================================================================
  findings:

    - id: V-1
      severity: MEDIUM
      title: "The NC2b-G1 tolerance has no variance term, so the gate's power depends on the null window's size in a way the contract never states -- and the run's own confirmatory arm demonstrates it."
      detail: "See the A-1 assessment.  The 0.75-bit tolerance was derived from the committed null's realised flatness and realised slope only.  The extrapolated level N inherits the slope's sampling error multiplied by a lever arm of up to 26.1, giving +/- 0.35 bits on a 21-point window and +/- 1.36 bits on an 8-point window at log2 B_opt = 26.1.  A fixed 0.75-bit tolerance is therefore roughly one noise unit on the gate of record and about half a noise unit on the confirmatory arm."
      consequence: "The PASS is real at the pre-registered tolerance and I confirm it.  But it must not be read as certifying the corrected estimator to 0.75 bits at large B_opt.  A successor contract should either state the tolerance as a multiple of the fitted level's own prediction interval or restrict the gate to windows with enough points to resolve it."
      attribution: "Frozen contract, not the Executor.  The Executor applied the frozen number and reported the disagreement as required."
      changes_a_gating_number: false

    - id: V-2
      severity: MEDIUM
      title: "raw-result.json describes the superseded response as 'the MINIMUM over implementations at ell' -- which is precisely the description that F-1 showed to be false."
      detail: >
        nc2b.carried_inputs.superseded_response_definition reads "y_ell =
        log2(median over the j-pool of per_entry(ell,j)), per_entry taken as the
        MINIMUM over implementations at ell".  That restates the superseded
        contract's RULE, not the superseded run's actual response.  On ell
        103..211 the superseded run had no IMPL-B data at all, so the response
        there was IMPL-A alone; that heterogeneity is the entire defect being
        repaired and adjudication B is built on it.  Elsewhere the same file
        labels the carried series "S-SUPERSEDED-MIN (carried; mixed-definition
        response, see the seam statement)" -- but no seam statement exists
        anywhere in the file, so that pointer is dangling.
      consequence: "A reader of raw-result.json alone could conclude the superseded response was homogeneous, which would erase the reason this experiment exists.  Should be corrected in a superseding record, never by editing this one."
      changes_a_gating_number: false

    - id: V-3
      severity: LOW-MEDIUM
      title: "SP-2 is breached: gamma = 0.9739199260 is quoted without the seam statement and without the homogeneous readings."
      detail: >
        The frozen contract restates SP-2 as binding on "every record produced
        under this contract, including the run receipt, the execution report":
        no record may quote gamma = 0.9739, the quadratic coefficient 0.0488, or
        gamma_local_top = 1.1706 without the seam statement AND the homogeneous
        readings (IMPL-A 0.9332, IMPL-B 0.7929, homogeneous curvature 0.0225 with
        CI [0.0194, 0.0366], homogeneous gamma_local_top 1.0187).
        execution_report.yaml line 58 quotes "gamma = 0.9739199260" with the
        label "corrected c from the CARRIED superseded W-MID fit ... an estimator
        change, NOT a new measurement" -- an accurate provenance label, but not
        the seam statement, and none of the four companion figures appears
        anywhere in the file.  I searched: 0.9331912935, 0.9332, 0.7929150528 and
        1.0187 occur zero times in raw-result.json as well.
      mitigation_that_partly_covers_it: "The run's own seam-free readings (0.9329 / 0.8100) and its full superseded-comparison table are present, so the substance is recoverable from the package.  The literal requirement is nevertheless not met."
      changes_a_gating_number: false

    - id: V-4
      severity: LOW-MEDIUM
      title: "The binding non-independence consequence of the retained paired CZ seeding is absent from execution_report.yaml."
      detail: >
        C-ALT.seed_policy_decision.binding_consequence forbids any record produced
        under this contract from presenting gamma_A and gamma_B's agreement or
        difference as agreement between two independent implementations, and
        requires their difference to be labelled as a measurement of the
        multiplication-routine effect under a fixed split structure.
        manifest.yaml carries the label; raw-result.json carries it twice;
        execution_report.yaml carries it nowhere, while reporting gamma_A beside
        gamma_B (line 80) and their difference under P3 (line 88).
      why_it_matters: "The execution report is the human-readable summary most likely to be quoted into a decision record, and it is the one file that omits the caveat.  This is the F-4 limitation leaking past the guard the contract built for it."
      changes_a_gating_number: false

    - id: V-5
      severity: LOW
      title: "The NC2b-G1 evaluation count is mis-stated as fifteen in three files; it is ten."
      detail: >
        NC2b-G1 is evaluated on 2 null windows x 5 field sizes = 10 points, and
        raw-result.json's nc2b.gate.evaluations list contains exactly 10 entries
        (its power_check list likewise).  manifest.yaml states 'evaluations: "15
        = 2 null windows x 5 field sizes"' -- internally contradictory, since 2 x
        5 = 10 -- and adds that the superseded law "would FAIL at every one of the
        15 evaluation points"; execution_report.yaml repeats "over the 15
        evaluation points (2 null windows x 5 field sizes)"; the snapshot receipt
        carries the same 15 into run_state_at_archive.  Fifteen is the count for
        NC2b-G1-prime (3 windows x 5 fields), which does have 15 entries.  The
        number was copied across gates.
      consequence: "No number changes; the verdict, the worst case and the margin are all correct.  But a reviewer reconciling counts against the raw file will find a discrepancy in three of the four summary documents, and the same figure appears in the archive receipt."
      changes_a_gating_number: false

    - id: V-6
      severity: LOW
      title: "'IMPL-B is cheaper at EVERY admitted ell' is imprecise: at 6 of 47 ell the two implementations are exactly equal."
      detail: "At ell = 2, 3, 5, 7, 11 and 13 all 8 j give byte-identical per_entry for IMPL-A and IMPL-B, because KARATSUBA_THRESHOLD = 16 makes poly_mul_kara delegate to poly_mul_school below that operand length.  IMPL-B is strictly cheaper at the remaining 41 ell.  The correct statement is 'nowhere more expensive'."
      consequence: "S-MIN still coincides with S-B pointwise and every S-MIN fit is unchanged, so no number moves.  But the imprecision matters for how the co-primary pair is read: on the lowest six admitted ell the two 'implementations' are literally the same computation, so the S-A / S-B contrast is degenerate there -- which is part of why the W-ALL implementation gap (0.0967) is smaller than the W-MID gap (0.1228)."
      changes_a_gating_number: false

    - id: V-7
      severity: OBSERVATION (no defect; carry-forward obligation)
      title: "Assumption L5's justification is now contradicted in mechanism, and the run says so."
      detail: "FC-4 fired: the primary object's measured alpha (1.159698) and the null object's (0.993508) differ by 0.166190.  The contract's derivation argued the p-scaling is a property of the SHARED poly_powmod loop and must therefore be common to both objects.  It is not.  alpha = 1 is not falsified (FC-2 correctly did not fire), but its DERIVATION is contradicted by the run's own control, and the receipt labels the designation MECHANISM-INCONSISTENT."
      carry_forward: "No downstream record may describe alpha = 1 as 'measured-consistent'.  The correct words are DERIVED, MECHANISM-INCONSISTENT, with a toy-scale three-point basis.  Every alpha = 1 row of the c table -- including the bracket's high end -- inherits that label."

    - id: V-8
      severity: OBSERVATION (no defect; carry-forward obligation)
      title: "The dominant intra-run uncertainty in c is the window choice, not sampling; and the headline bracket is W-MID only."
      detail: "See the A-3 assessment, item (2).  Sampling contributes about +/- 0.002 to +/- 0.005 in c; the window choice contributes 0.070 to 0.111 for S-B, and the alpha choice contributes about 0.25.  The bracket is explicitly labelled a modelling-choice span rather than a confidence interval, which is correct, but it spans only two of the three declared choices and omits the one the run's own top-of-range data most implicate."
      carry_forward: "Any record quoting the headline bracket should quote it beside the full S-A/S-B x window x alpha range that the same 225-row table supplies: [1.3197, 1.5932] at NIST-I and [1.1031, 1.3941] at log2 p = 768.  Both remain EXTRAPOLATIONS carrying no claim tier."

  # ==================================================================
  # 9. HEURISTIC-VALIDATION, COST-MODEL AND PROOF-ARCHITECTURE CHECKS
  # ==================================================================
  heuristic_validation_checks:
    - id: HV-1
      requirement: "Pre-registered prediction, recorded before or independently of sampling."
      verdict: SATISFIED, WITH THE CONTRACT'S OWN HONEST QUALIFICATION
      detail: >
        The contract was committed at e9a850f2 before any datum of
        RUN-PEC-49c773-a existed and is byte-unchanged since; I verified this by
        git rather than by assertion.  P1a..P4, the C-PSCALE band [0.85, 1.15],
        the NC2b-G1 tolerance and the FC-1..FC-4 consequences are all fixed in
        that text.  The contract does NOT pretend the null gate is a blind
        prediction: nc2b.preregistration_honesty states plainly that the null
        series was already committed and that the Coordinator had read
        gamma_null while writing the gate, so what is pre-registered is the
        FORMULA, the REFERENCE STATISTIC, the TOLERANCE, the EVALUATION LEVEL and
        above all the FAILURE CONSEQUENCE.  That is the correct disclosure and I
        credit it.  Its limit: a tolerance chosen with the null's realised
        properties in view is a weaker instrument than a blind one, which is
        the substance of finding V-1.
    - id: HV-2
      requirement: "Sample integrity: size, seeds and procedure in the manifest; statistics recomputed from raw samples."
      verdict: SATISFIED
      detail: "47 ell x 8 j x 2 implementations = 752 primary, 752 null, 24 C-SEED, every sample archived individually with its CZ seed string; 8 walk seeds, n_walk = 120, bootstrap seed 20260802 all recorded.  Every statistic in sections 4 and 5 above was recomputed by me from those raw records, not copied."
    - id: HV-3
      requirement: "Correspondence validity, where a substitute sampler stands in for direct sampling."
      verdict: NOT APPLICABLE, CORRECTLY
      detail: "No correspondence is used: scale_relevance.correspondence is null and the measurement is direct on the sampled j-invariants.  Nothing here uses a Deuring-style substitution, so the exemplar's correspondence obligation does not bite."
    - id: HV-4
      requirement: "Scale binding: parameter sizes match the claim's scale; toy scale recorded as a limitation."
      verdict: SATISFIED
      detail: "p ~ 2^40 gives an 80-bit field, `medium` under the mechanical rule (32 < 80 <= 96); C-PSCALE's two extra primes give 40- and 60-bit fields, `toy`, and the receipt records the toy ceiling for them.  Every NIST-level statement is labelled an EXTRAPOLATION with no claim tier.  The receipt states in four places that ~7.5 unmeasured octaves at NIST-I (~18 at 768 bits) are not reduced by a single octave.  AGENTS.md rule 7 is respected."
    - id: HV-5
      requirement: "The claimed improvement is verified against the inventor-protocol section 6 ladder rather than accepted as an extrapolation."
      verdict: NOT APPLICABLE AS A SPEEDUP CLAIM, AND CORRECTLY SO
      detail: >
        This run claims no improvement and no speedup.  It is a corrected
        ESTIMATOR plus a re-measurement of an implementation cost profile, and
        the direction of its effect is ANTI-attack (the corrected c is higher
        than the superseded one, because the discarded intercept is restored).
        The section 6 ladder's step 2 -- "run the whole pipeline on a
        scaled-down instance and show the claimed improvement as a MEASURED
        RATIO against the baseline" -- has no speedup to measure here, so its
        absence is not a `failed`.  What the ladder's spirit does demand and
        this package supplies: the assumptions the extrapolation rests on are
        isolated and measured separately (L5 by C-PSCALE, the ell-dependence by
        C-NULL, the instrument by C-REPRO and C-INSTR, the baseline by
        C-BASE.4), each with its failure mode named (FC-1..FC-4), and the
        reproducibility pointer was exercised rather than asserted -- I rebuilt
        every headline number from the raw artifacts in this session.
  cost_model_checks:
    - id: CM-1
      requirement: "Declared unit."
      verdict: SATISFIED
      detail: "One F_{p^2} multiplication, carried unchanged from the superseded contract with all four counting conventions, and C-BASE.6 states the alignment with Section 4.1's one-operation-per-entry convention (gamma_paper = 0).  Counts come from instrumentation; wall-clock is recorded beside them and never substituted."
    - id: CM-2
      requirement: "Optimistic assumptions flagged."
      verdict: SATISFIED
      detail: "L1..L6 are attached to every c table with their status and DIRECTION, and both directions are reported without netting: excluded costs (Phi_ell storage and I/O, coefficient reduction, hashing, table access) are excluded in the attack's favour, so the result is a lower bound with respect to them, while L4 makes gamma an upper bound on the achievable per-entry exponent.  The asymmetry against the attack (measured overhead charged to the attack while Delfs-Galbraith keeps the nominal convention) is stated as an open item for NC2f."
    - id: CM-3
      requirement: "Memory reported alongside time."
      verdict: SATISFIED FOR THE RUN; NOT APPLICABLE TO THE MODELLED TABLE
      detail: "The run records peak RSS 0.1371 GiB against an 8 GB budget and CPU-seconds beside wall-clock.  The c table models a TIME overhead multiplier only; the memory side of the attack lives in EXP-WESOVOW-001's scenario grid, which this run only substitutes into, at w = 2^30 only, per SP-3.  No memory claim is made or implied here."
    - id: CM-4
      requirement: "Total expected cost as per-attempt cost x inverse success probability."
      verdict: NOT APPLICABLE
      detail: "No success probability is involved.  The measured object is a deterministic per-entry instruction count, and the extrapolation is a level-and-slope substitution, not an expected-cost bookkeeping.  Recorded as inapplicable rather than silently omitted."
  proof_architecture_checks:
    - id: PA-1
      requirement: "Baseline fixture reproduces exactly, not approximately."
      verdict: SATISFIED AND INDEPENDENTLY DEMONSTRATED
      detail: "I reimplemented the frozen PoC's count() and reproduced all five (B, X) values exactly (C-BASE.4 entry).  Separately, C-REPRO reproduces this programme's OWN prior run bit-for-bit on 884 samples, and the NC2b refit reproduces the committed superseded window fits at deviation 0.0 against a 1e-9 tolerance.  Three distinct baselines, all exact."
    - id: PA-2
      requirement: "Strictness witness for an improvement claim."
      verdict: NOT APPLICABLE
      detail: "No improvement over any prior art is claimed."
    - id: PA-3
      requirement: "Observation collisions bound to enumerated scope."
      verdict: SATISFIED
      detail: "The contract names the collision and does not close it: distinct per-entry cost laws agree over ell <= 251 and diverge at ell ~ 2^14, and the run states in non_claims that it does not narrow this at all.  A second collision -- 'the intercept is constant' vs 'the intercept is linear in log2 p', observationally identical at a single p -- is named and PARTIALLY closed by C-PSCALE, which is exactly the right handling, and the partial closure came back MECHANISM-INCONSISTENT (V-7)."
    - id: PA-4
      requirement: "Interface preservation across representation changes."
      verdict: SATISFIED
      detail: "The only representation change is the instrument reuse, and it is checked rather than assumed: the instrument is imported by path with its SHA-256 recorded and matched against 49166fa5, no modification was required, and C-REPRO converts the comparability assumption into a measured fact."
    - id: PA-5
      requirement: "Method ceiling derived from the method's own resource measure, with a nearby-object control."
      verdict: SATISFIED
      detail: "C-NULL is the nearby object where the ell-growth must NOT appear, and it does not (gamma_null ~ 0.003 against a primary 0.79-0.97).  C-PSCALE's null arm is the nearby object for L5, and FC-4 fired -- the control did its job by contradicting the derivation.  The ceiling is stated honestly: this method can bound the per-entry exponent of an unoptimised implementation from above and can never lower-bound the cost of an optimal one."
    - id: PA-6
