        All match recorded values in receipt.json exactly.
        Snapshot b7b3240b4 commits all 21 declared artifacts (confirmed via git show --name-only).

    - id: CHK-2
      name: NC2d arithmetic — pooled alpha, gap, FC-4, jackknife, regressor, trend
      result: PASS
      detail: >-
        pooled alpha_primary: mean([1.1055,1.1318,1.1407,1.1504]) = 1.1321 (raw: 1.1320907) ✓
        pooled alpha_null: mean([1.0784,1.0938,1.0512,1.0626]) = 1.0715 (raw: 1.0715207) ✓
        gap = 0.0606 (raw: 0.0605699) < threshold 0.15 → FC-4 DID NOT FIRE ✓
        jackknife leave-one-out bounds: [1.1259982, 1.1409560] (reported [1.1260, 1.1410]) ✓
        contained_in_band [0.85, 1.15]: 1.1409560 ≤ 1.15 → True ✓ (see qualification Q-1)
        FC-2 disjoint test: CI overlaps [0.85,1.15] → FC-2 DID NOT FIRE ✓
        Regressor: frozen spec § estimator states "OLS of log2(median per_entry) on
        log2(log2 p)"; run log line 2 confirms "Regressor is log2(log2 p)"; conflict
        with handoff (which said log2(p)) is explicitly recorded in receipt.json and
        raw-result.json; frozen spec governs per DEC-20260802-48c72c ✓
        no-trend b = 0.0206 (raw: 0.020580) via OLS of alpha_hat(ell) vs log2(ell);
        |b| = 0.0206 ≤ 0.10 → PASS ✓

    - id: CHK-3
      name: NC2b arithmetic — worst recovery error, 10-check gate, gamma_null anomaly
      result: PASS_WITH_NOTE
      detail: >-
        All 10 W-MID checks (5 field sizes × 2 s values) independently verified from
        nc2b_results.json: worst error = 0.0926 bits at log2p_768 (both s=0.4 and s=0.8).
        0.0926 ≤ 0.75 bits tolerance → gate PASS ✓
        gamma_null_refit = −0.003547 vs decision-record nominal −0.013241:
        difference = 0.009694; anomaly is explained — NC2b spec uses EXP-PEC-49c773
        C-NULL (47-ell series, n=43 in W-MID), while the DEC-20260802-48c72c
        expected value was fitted on the 21-ell nc2b series (ell 11..101).
        Gate uses the refit value from the correct 47-ell input, so the gate result
        is valid. Anomaly is properly annotated in raw-result.json and nc2b_results.json ✓
        non_claim preserved: "PASS validates the INSTRUMENT only; cannot be cited as
        validation of L1" ✓

    - id: CHK-4
      name: Bibliographic — 3 sources found, constant k scope
      result: PASS
      detail: >-
        All 3 sources confirmed found: Sutherland 2013 (arXiv:1202.3985),
        Santos-Costello-Shi 2022 (DOI 10.1007/978-3-031-15982-4_10),
        Adj et al. 2018/319 (IACR ePrint 2018/313).
        Constant k not stated in any abstract: expected outcome. Sutherland 2013 addresses
        evaluation algorithms for Φ_ell(j(E),Y); Santos-Costello-Shi addresses
        Delfs-Galbraith acceleration; Adj et al. address cost of isogenies in SIDH context.
        None of these is the primary locus for the ~1/2 Elkies-prime counting fraction,
        which derives from SEA theory (Elkies 1990, Atkin, Schoof). Absence in abstracts
        is the expected outcome for this bibliographic scope ✓

