        The jackknife interval [1.1260, 1.1410] is labelled "95% CI" in the handoff
        summary. It is actually the [min, max] of the four leave-one-out estimates,
        as defined explicitly in the frozen spec (§ jackknife: "report the min and
        max of the four leave-one-out estimates"). The frozen spec does not use the
        label "95% CI"; only the handoff summary does. The interval bounds are
        arithmetically correct (raw: [1.1259982, 1.1409560]), contained_in_band is
        correct, and the FC-2 evaluation is correct. No correction to the run record
        is required; future handoffs should use "leave-one-out range" rather than
        "95% CI" to avoid ambiguity.
    - id: Q-2
