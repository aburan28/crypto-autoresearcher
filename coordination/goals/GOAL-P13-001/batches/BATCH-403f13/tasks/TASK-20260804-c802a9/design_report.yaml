coordinator_design:
  id: TASK-20260804-c802a9
  goal_id: GOAL-P13-001
  batch_id: BATCH-403f13
  batch_number: 4
  role: coordinator
  date: "2026-08-04"

  # ==========================================================================
  # BATCH OBJECTIVE
  # ==========================================================================
  batch_objective: >-
    Retire the MECHANISM-INCONSISTENT label on assumption L5 by measuring the
    p-scaling exponent alpha at ell in {47,101,151,211} (the correct operating
    range), test assumption L1 via a synthetic slope null at zero compute,
    retrieve the bibliographic baseline constant k, and execute Heuristic 1 tail
    validation (NC-3/NC-6) to pair the conditional Wesolowski theorem with its
    one untested load-bearing probabilistic term.

  # ==========================================================================
  # WHAT THIS BATCH IS NOT
  # ==========================================================================
  what_this_batch_is_not: >-
    BATCH-403f13 is NOT an attempt to meet completion criterion 1 (decided the
    NIST-I margin with error below the irreproducibility band), which
    DEC-20260802-48c72c has assessed as UNREACHABLE BY THIS METHOD within the
    remaining budget. The terminal status after this batch is `paused` or
    `closed_at_budget` with the narrowest supported result recorded, pre-committed
    here rather than left as a later judgement call (GOAL-P13-001.yaml
    next_action, para 7 of the PRE-COMMITMENT).

  # ==========================================================================
  # TASK ORDERING RATIONALE
  # ==========================================================================
  task_ordering_rationale:
    principle: >-
      Cheap falsifier-closing items first, so that a truncation degrades
      gracefully. Each task is ordered by cost and conditionality: items that
      cost minutes and zero compute run before items that cost hours, and the
      load-bearing substantive item (NC-3/NC-6) runs last and only if the
      earlier items do not redirect the batch.

    item_1_nc2d_proper:
      task: TASK-20260804-241b87 (first subtask)
      cost: "Minutes of compute. Phi_ell already acquired for all four ell."
      why_first: >-
        FC-4 from EXP-PEC-49c773 is the only remaining qualification that
        attaches to every citation of alpha in the corrected law. It fired on
        ell in {3,5,7,11,13} (all below the Karatsuba threshold); the diagnosis
        in DEC-20260802-48c72c adjudication E is that those ell are the WRONG
        range to measure alpha. If FC-4 fires AGAIN at ell in {47,101,151,211},
        the MECHANISM-INCONSISTENT label is genuinely appropriate and the batch
        must redirect. If FC-4 does not fire, the label is retired by
        measurement and the subsequent items proceed unqualified. This item costs
        the least and decides the batch's trajectory.
      rerank_trigger_if_fc4_fires: >-
        If FC-4 fires on ell >= 47: NC-3/NC-6 is DEFERRED. The batch's
        remaining capacity goes to L5 characterisation (fitting the measured
        alpha at {47,101,151,211}, quantifying the impact on the c table at all
        five field sizes, assessing whether the mechanism argument survives). This
        rerank is RECORDED BEFORE THE MEASUREMENT so it cannot be a
        post-hoc adjustment.

    item_2_nc2b_slope:
      task: TASK-20260804-241b87 (second subtask)
      cost: "Zero new compute. Arithmetic on 47 committed null per-ell values."
      why_second: >-
        NC2b-SLOPE is the only proposed gate with power against assumption L1,
        which the original flat-null NC2b gate cannot reach
        (DEC-20260802-48c72c adjudication B). L1 is UNTESTED in the current
        record; its magnitude is 6.48 to 18 unmeasured octaves. NC2b-SLOPE
        supplies the test: if the corrected estimator cannot recover a known
        non-zero slope (s=0.4, s=0.8) from a synthetic series built on committed
        data, the estimator has a bias that would affect any slope-dependent
        c value. This item costs nothing and runs in the same executor task as
        NC2d-PROPER.

    item_3_bibliographic:
      task: TASK-20260804-241b87 (third subtask)
      cost: "Zero compute. Document retrieval only."
      why_third: >-
        The baseline constant k (appearing under every margin row) remains
        unquantified after three batches. It has been named as necessary in
        THREE CONSECUTIVE red-team reports (RT-20260724-P13, RT-20260802-96d908,
        RT-20260802-8e00fe) and executed in none. Sutherland (ANTS-X-2013),
        Santos-Costello-Shi [15], and Adj et al. [3] are the primary sources.
        Retrieving them costs nothing and is no longer optional
        (GOAL-P13-001.yaml next_action para 3). The subtask runs alongside
        NC2b-SLOPE in the same executor task.

    item_4_nc3_nc6:
      task: TASK-20260804-6519fa
      cost: "Up to 5400 seconds, gated by feasibility check."
      why_last: >-
        This is the substantive item. P0 (via Heuristic 1's tail) multiplies
        every one of the eighteen margin rows identically. The programme has run
        three batches of cost-calibration work downstream of a
        Heuristic-1-conditional theorem without testing this term. The pairing
        obligation from agents/coordinator.md and docs/target-result-profile.md
        requires a conditional result to be paired with a heuristic-validation
        experiment; that pairing has been deferred for three batches.
        NC-3/NC-6 is placed last because: (a) it requires NC2d not to redirect
        the batch; (b) it is the costliest item and should only run after the
        cheap falsifier-closing items confirm the batch's trajectory; (c) its
        feasibility gate may terminate it early without affecting the other items.
        Rationale for choosing NC-3/NC-6 over NC2c is recorded in
        DEC-20260802-48c72c next_actions.why_this_and_not_NC2c_weighed_rather_than_rubber_stamped:
        NC2c addresses L4 (largest residual term) but its best outcome
        RE-SCOPES the c-programme rather than answering the concrete question,
        and L4 cannot be closed without building the batched implementation. The
        decisive reason is the Coordinator's own pairing obligation.

    item_5_ledger_archive:
      task: TASK-20260804-bf4dce
      why_last: >-
        The ledger archive waits for independent Validator and Red Team review,
        which are dispatched after snapshot commits of TASK-20260804-241b87 and
        TASK-20260804-6519fa (IDs TBD, minted at dispatch time). This sequencing
        is identical to BATCH-002 and BATCH-003.

  # ==========================================================================
  # RERANK TRIGGER
  # ==========================================================================
  rerank_trigger:
    condition: "FC-4 fires on ell in {47,101,151,211} in EXP-P13-NC2d"
    recorded_before_measurement: true
    consequence: >-
      L5 is contradicted at the ell range where the corrected law is actually
      applied. Alpha ceases to be the smallest term in the corrected law (at
      NIST-I its contribution is about 0.43 bits at alpha=1 versus 7.5+ bits for
      L1 and 11.5+ bits for L4, so a falsified alpha at the operating range
      materially changes the c table). TASK-20260804-6519fa is SKIPPED. The
      batch's remaining capacity redirects to L5 characterisation:
      (a) fit alpha_measured at ell in {47,101,151,211};
      (b) recompute the c table at alpha_measured for all five field sizes;
      (c) assess whether the gap |alpha_primary - alpha_null| persists across
          the full ell range and quantify it;
      (d) record as a FINDING without changing any hypothesis status.
    authority: "DEC-20260802-48c72c next_actions NA-1"

  # ==========================================================================
  # KN-FIND OBLIGATION
  # ==========================================================================
  kn_find_obligation:
    source_decision: "DEC-20260802-48c72c.knowledge_promotion.scheduled_promotion_for_the_batch_004_ledger_archive"
    status: "BINDING DELIVERABLE — second consecutive deferral for the same structural reason (task-card write_scope omission in BATCH-003). The BATCH-004 ledger archive task MUST carry knowledge/findings/ and knowledge/INDEX.md in its write_scope."
    what_to_promote:
      kind: "KN-FIND"
      durable_claim: >-
        "An intercept is only meaningful paired with the slope of the same fit
        of the same series over the same window; a slope-only calibration law
        reports ZERO overhead for an object carrying a large constant one."
        The promotable object is the ESTIMATOR LEMMA AND PAIRING RULE, not any
        c value.
      proof_status: "derivation"
      two_instances:
        - >-
          (i) The C-NULL counterexample: an object whose per-entry cost is O(1)
          in ell by construction, measured at 2^12.26-2^12.32, for which the
          slope-only law returns c ~ 0 and misses by up to 12.605090 bits.
        - >-
          (ii) The A-3 absorption: the pairing rule converts a 2.4-bit unpaired
          excursion outside the published bracket into a 1.007-bit correctly-
          paired one inside it (DEC-20260802-48c72c adjudication C).
      proof_refs: "EV-PEC-857664 proof_refs (same references)"
      why_not_any_c_value: >-
        The c bracket is an EXTRAPOLATION with NO CLAIM TIER and under EIGHT
        MANDATORY ATTACHMENTS (MA-1 through MA-8 of DEC-20260802-48c72c).
        Promoting any c value would place a caveated figure in the knowledge
        corpus where it will be quoted without its caveats — precisely the
        failure mode the mandatory attachments exist to prevent. The promotable
        content is the STRUCTURAL RESULT about the estimator, which is
        independent of any specific c value and is reusable beyond this
        programme.
      candidate_second_entry:
        kind: "KN-TECH candidate (to be judged in this ledger archive, not pre-approved here)"
        technique: >-
          NULL-OBJECT CONTROL ON AN EXPLANATION RATHER THAN ON A SIGNAL. Given
          a proposed mechanism for a residual, build the regressor the mechanism
          implies and fit it to BOTH the object the mechanism should explain and
          a nearby object it should not. From DEC-20260802-48c72c adjudication C
          and DEC-20260802-48c72c knowledge_promotion.candidate_second_entry.

  # ==========================================================================
  # STANDING CONSTRAINTS ACKNOWLEDGMENT
  # ==========================================================================
  standing_constraints_acknowledgment:
    acknowledged_at: "2026-08-04"
    acknowledged_by: "coordinator (TASK-20260804-c802a9)"
    items:
      no_handoff_amendment:
        status: "PERMANENTLY BINDING"
        text: >-
          No handoff in BATCH-403f13 may direct execution order, tolerance,
          window, estimator, or prediction differing from the frozen contract it
          dispatches. The instrument for any needed change is a versioned
          protocol_amendment recorded before execution, or a superseding
          contract (DEC-20260802-48c72c adjudication H, INCIDENT-20260802-P13-03
          remedy).
      no_review_breakthrough_tier:
        status: "Permanently non-degradable; unavailable here"
        text: >-
          No task in BATCH-403f13 may claim a review-breakthrough tier.
          INFAMEND-20260802-P13-002 records that this harness cannot resolve
          the policy aliases or set or verify a reasoning-effort tier.
      no_completion_criterion_1:
        status: "BINDING PRE-COMMITMENT from DEC-20260802-48c72c"
        text: >-
          BATCH-403f13 is NOT an attempt to meet completion criterion 1.
          The terminal status after this batch is `paused` or `closed_at_budget`,
          never `completed`.
      four_prohibitions_permanent:
        sp_1: "PERMANENT: c = 0.864 and variants non-citable as estimates"
        sp_2: "PERMANENT (companion set extended): gamma = 0.9739 and variants require seam statement and homogeneous readings"
        sp_5: "PERMANENT (extended to this batch): review-side supplementary work is not run evidence"
        sp_6: "PERMANENT (with one fact added): RUN-PEC-6be870-a completion gate UNMET; ell=97 obstruction is never mathematical evidence"
      sp_7_through_sp_12:
        status: "All bind; see DEC-20260802-48c72c.standing_prohibitions.new_prohibitions_from_this_batch"
      infamend_20260802_p13_002:
        status: "Carried from BATCH-003"
        text: >-
          Every handoff sets fallback_allowed and degraded_allowed true and
          records requested_policy, resolved model identifier, fallback_used,
          and degraded_requirements. No task may claim a review-breakthrough tier.

  # ==========================================================================
  # FROZEN CONTRACTS PRODUCED BY THIS TASK
  # ==========================================================================
  frozen_contracts:
    - id: EXP-P13-NC2d
      path: "experiments/EXP-P13-NC2d/specification.yaml"
      purpose: "NC2d-PROPER: C-PSCALE re-run at ell in {47,101,151,211}"
      executing_task: TASK-20260804-241b87
    - id: EXP-P13-NC2b
      path: "experiments/EXP-P13-NC2b/specification.yaml"
      purpose: "NC2b-SLOPE: synthetic slope null test of L1 at zero compute"
      executing_task: TASK-20260804-241b87
    - id: EXP-P13-NC36
      path: "experiments/EXP-P13-NC36/specification.yaml"
      purpose: "NC-3/NC-6: Heuristic 1 tail validation at the operating point"
      executing_task: TASK-20260804-6519fa

  # ==========================================================================
  # PRE-REGISTERED NC2d-PROPER FALSIFICATION CRITERION
  # ==========================================================================
  nc2d_proper_preregistered_falsification_criterion:
    alpha_primary_band: [0.85, 1.15]
    alpha_null_gap_bound: 0.15
    no_trend_slope_bound: 0.10
    fc4_fires_if: "|alpha_primary - alpha_null| > 0.15 on the pooled estimate at ell in {47,101,151,211}"
    fc4_fires_consequence: "MECHANISM-INCONSISTENT designation CONFIRMED at operating range; RERANK TRIGGER fires"
    fc4_does_not_fire_consequence: "MECHANISM-INCONSISTENT label RETIRED BY MEASUREMENT at the operating range; alpha=1 becomes MEASURED-CONSISTENT-AT-OPERATING-RANGE"
    fc2_fires_if: "jackknife interval [min_jk, max_jk] DISJOINT from [0.85, 1.15]"
    fc2_fires_consequence: "alpha=1 FALSIFIED at operating range"
    recorded_before_any_datum: true

  # ==========================================================================
  # SECTION 8 (INVENTOR PROTOCOL) APPLICABILITY
  # ==========================================================================
  section_8_applicability:
    applies_to_this_design_report: false
    reason: >-
      This design report is a batch coordination record (task ordering, rerank
      logic, KN-FIND scheduling), not a theorem, asymptotic bound, certificate
      family, reduction, or closure argument. Section 8 does not require a
      proof_search_map for coordination records. The individual experiment
      specifications each record their own Section 8 determination (all three
      are empirical protocols for which Section 8 is inapplicable).

  decided_by: coordinator
  decided_at: "2026-08-04"
  decided_under:
    task_id: TASK-20260804-c802a9
    goal_id: GOAL-P13-001
    batch_id: BATCH-403f13
    inference_amendment: INFAMEND-20260802-P13-002
    requested_policy: coordinator-orchestration-code
    fallback_allowed: true
    degraded_allowed: true
