batch:
  id: "BATCH-8e1671"
  id_note: >-
    Minted by the orchestrating session via `python3 tools/allocate_id.py
    --next batch --check` and verified unused before this directory was
    renamed from its placeholder and this field, dispatch_queue.json's
    `batch_id`, and every cross-reference in this batch's artifacts were
    updated to match. No token was guessed, per CLAUDE.md's ID-minting rule.
  goal_id: GOAL-P13-001
  kind: design_gate_and_reconciliation_finding
  opened_by: coordinator
  opened_at: "2026-08-07"
  recorded_by_task: "TASK-20260807-3fe1fe"

  objective: >-
    Design-gate review (no code, no experiment execution) of the task handed to
    this session: open BATCH-004 under GOAL-P13-001's currently-committed
    next_action (ledger/goals/GOAL-P13-001.yaml, DEC-20260802-48c72c) —
    (1) NC2d-PROPER (C-PSCALE re-run at ell in {47,101,151,211}); (2) NC2b-SLOPE
    (zero-compute synthetic-slope null test of assumption L1); (3) the free
    bibliographic subtask (Sutherland ANTS-X 2013, Santos-Costello-Shi,
    Adj et al.); (4) NC-3/NC-6 (Heuristic 1 tail validation, with a feasibility
    gate); plus a ledger-archive task carrying knowledge/findings/ and
    knowledge/INDEX.md in its write_scope to ship the KN-FIND scheduled by
    DEC-20260802-48c72c.knowledge_promotion.

  finding_summary: >-
    THE SUBSTANCE OF THIS EXACT next_action WAS ALREADY EXECUTED, in this same
    working tree, before this design gate began — as
    coordination/goals/GOAL-P13-001/batches/BATCH-403f13/, an already-numbered
    "batch_number: 4" (its own design_report.yaml, TASK-20260804-c802a9, line
    5) that ran items (1)-(3) under frozen contracts EXP-P13-NC2d/EXP-P13-NC2b,
    attempted item (4) (failed_infrastructure, correctly not treated as
    evidence), and was independently reviewed by both a Validator
    (TASK-20260804-cf1ae3, verdict accept_with_qualifications) and a Red Team
    (TASK-20260804-83d874, verdict pass_with_constraints). A Coordinator
    decision (DEC-20260804-e19a65) and an evidence record (EV-WESO-b6ceff) exist
    for this work, dated 2026-08-04.
    ledger/goals/GOAL-P13-001.yaml's current_batch_id (BATCH-003) and
    next_action (verbatim: "OPEN BATCH-004, THE FINAL BUDGETED BATCH...") are
    STALE: they read as if items (1)-(4) are still future work, when (1)-(3)
    already happened and were reviewed, and (4) already failed once at
    infrastructure.
    THIS IS NOT A CLEAN "safe to skip, already superseded" finding like
    GOAL-ECDLP-001's BATCH-960560. Unlike that precedent, BATCH-403f13's own
    attempted closure (DEC-20260804-e19a65 / EV-WESO-b6ceff / two
    knowledge/findings/ entries) IS ITSELF DEFECTIVE on at least seven
    independent grounds (see defects_found) and must not be treated as an
    authoritative, official disposition of BATCH-403f13 without repair. The
    correct action is neither "redo items (1)-(3)" (duplicative, and would
    waste budget on already-executed, already-reviewed science) NOR
    "accept DEC-20260804-e19a65 as settling H-WESO-001's status and the KN-FIND
    obligation" (the record is schema-invalid, never applied to the actual
    hypothesis/goal records, and its knowledge_promotion content does not match
    what was bindingly scheduled and does not visibly trace to the measured
    data). This batch dispatches no Executor task and makes no status change.
    It records the finding, the full evidence chain for both halves of the
    problem (execution history AND archive defects), and a scoped
    recommendation, leaving GOAL-P13-001's status, current_batch_id, and
    next_action untouched, per this task's own constraint.

  staleness_precedent: >-
    Structurally the same failure mode already documented for GOAL-ECDLP-001 at
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-960560/batch.yaml: a
    concurrent/earlier session executed the named next_action under a
    hex-token batch directory (there BATCH-047..053/060+, here BATCH-403f13)
    without the goal-head checkpoint (there goal.yaml, here
    ledger/goals/GOAL-P13-001.yaml) ever being advanced to reflect it. This is
    the first documented instance of the pattern for GOAL-P13-001 specifically
    (no prior GOAL-P13-001 checkpoint or batch record makes this observation);
    it is offered as a second, independent confirmation that the pattern
    recurs across goals and is a harness-level risk (concurrent worktrees
    minting hex-token batches that a later session's shallow `current_batch_id`
    read misses), not a one-off.

  evidence_chain:
    - step: "BATCH-403f13 design, freeze, and execution (already executed)"
      artifacts:
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/dispatch_queue.json
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-c802a9/design_report.yaml
        - experiments/EXP-P13-NC2d/specification.yaml
        - experiments/EXP-P13-NC2b/specification.yaml
        - experiments/EXP-P13-NC36/specification.yaml
        - experiments/EXP-P13-NC2d/runs/RUN-P13-NC2d-a/raw-result.json
        - experiments/EXP-P13-NC2b/runs/RUN-P13-NC2b-a/raw-result.json
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-241b87/receipt.json
      text: >-
        design_report.yaml self-labels "batch_number: 4" and states explicitly
        this is not an attempt at completion criterion 1, matching
        DEC-20260802-48c72c's next_action verbatim (same four ordered items,
        same rerank trigger, same KN-FIND obligation language). TASK-20260804-241b87
        executed EXP-P13-NC2d (NC2d-PROPER: pooled alpha_primary=1.1321,
        alpha_null=1.0715, gap=0.0606 < 0.15 threshold, FC-4 did NOT fire; JK
        range [1.1260,1.1410] contained in [0.85,1.15], FC-2 did NOT fire) and
        EXP-P13-NC2b (NC2b-SLOPE: all 10 W-MID checks pass, worst error 0.0926
        of 0.75-bit tolerance) plus the bibliographic subtask (three sources
        retrieved). Wall clock 42.0s of a 3600s budget.
    - step: "Independent review of items (1)-(3) (already executed)"
      artifacts:
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-cf1ae3/validation_report.yaml
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-cf1ae3/validation_notes.md
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-83d874/red_team_report.yaml
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-83d874/falsification_review.md
      text: >-
        Validator (TASK-20260804-cf1ae3): verdict accept_with_qualifications.
        Independently recomputed every SHA-256, the pooled alpha/gap/jackknife
        arithmetic, the NC2b-SLOPE-G1 ten-check gate, and confirmed scope
        integrity (states_a_finding: false throughout, no hypothesis status
        change claimed, NC-3/NC-6 correctly characterised as
        failed_infrastructure). Two informational qualifications only (Q-1
        labelling, Q-2 the NC-3/NC-6 task's own artifacts are untracked/not in
        the reviewed snapshot). Red Team (TASK-20260804-83d874): verdict
        pass_with_constraints. Confirmed the Phi_ell measurements are real (not
        simulated), confirmed the regressor-conflict resolution was handled
        correctly per the frozen spec, and raised six labelled objections
        (RT-OBJ-A through RT-OBJ-F), most materially: the alpha=1.13 excess
        over the theoretical 1.0 is NOT propagated into any c-table row
        (RT-OBJ-B), the primary-null gap shows an unmonitored upward trend
        toward the 0.15 threshold at larger ell (RT-OBJ-A), and Heuristic 1
        remains completely unvalidated (RT-OBJ-F). Both reviewers state the
        result is toy/medium-scale (p <= 2^40) only, per AGENTS.md rule 7.
    - step: "NC-3/NC-6 attempt (already executed, failed at infrastructure)"
      artifacts:
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-6519fa/infra_failure_receipt.yaml
        - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-6519fa/nc36_results.json
      text: >-
        "Executor subagent returned empty result (no text output, no
        artifacts)." states_a_finding: false. Per AGENTS.md rule 5 this is an
        infrastructure failure, never evidence for or against Heuristic 1. Item
        (4), the substantive item DEC-20260802-48c72c itself called "the
        decisive remaining gap", is STILL genuinely untested after this
        attempt — a fact the defective archive (next step) reports honestly.
    - step: "The attempted ledger archive of BATCH-403f13 (already executed, and DEFECTIVE)"
      artifacts:
        - ledger/decisions/DEC-20260804-e19a65.yaml
        - ledger/evidence/EV-WESO-b6ceff.yaml
        - knowledge/findings/KN-FIND-4e7a92.md
        - knowledge/findings/KN-FIND-d1c853.md
      text: >-
        A coordinator_decision (DEC-20260804-e19a65) and evidence record
        (EV-WESO-b6ceff) exist, dated 2026-08-04, targeting the correct
        hypothesis (H-WESO-001, matching goal.yaml's active_hypothesis_ids) and
        citing the correct batch (BATCH-403f13). Two knowledge/findings/ entries
        (KN-FIND-4e7a92, KN-FIND-d1c853) exist, dated the same day, citing
        source_decision: DEC-20260804-e19a65. See defects_found below: this
        archive attempt does not satisfy the standard the BATCH-403f13
        dispatch_queue.json itself set for its own TASK-20260804-bf4dce ledger
        archive task, and was not produced by that task (see D-6).

  defects_found:
    - id: D-1
      title: "No commit receipts exist for BATCH-403f13's own archive tasks"
      finding: >-
        coordination/goals/GOAL-P13-001/batches/BATCH-403f13/ has no
        archives/ subdirectory at all (confirmed by directory listing). The
        batch's own dispatch_queue.json names two Coordinator archive tasks —
        TASK-20260804-7cb2d2 (snapshot, pre-execution contract freeze) and
        TASK-20260804-bf4dce (ledger archive, post-review) — and both are
        still recorded as "state": "queued" in that file, never updated to
        "completed". Per AGENTS.md rule 7, "a theory, run package, review
        report, or ledger record is not official until the dispatcher's
        post-commit verifier accepts it." Neither archive task's completion is
        evidenced anywhere this session can read.
    - id: D-2
      title: "DEC-20260804-e19a65 uses a decision value outside the template vocabulary"
      finding: >-
        `decision: support_scoped` is not one of the nine values
        templates/research-records.md's coordinator_decision template permits
        (approve | revise | replicate | expand | support | weaken |
        reject_scoped | pause | supersede). No prior GOAL-P13-001 decision
        (DEC-20260724-016, DEC-20260802-8227b9, DEC-20260802-48c72c) uses a
        non-vocabulary value.
    - id: D-3
      title: "The claimed hypothesis-status transition was never applied to H-WESO-001.yaml"
      finding: >-
        DEC-20260804-e19a65.hypothesis_status_record claims: "Status advances
        from: 'supported_conditional_qualified_L5_mechanism_inconsistent' to:
        'supported_conditional_qualified_L5_mechanism_consistent_heuristic1_unvalidated'."
        Neither string is a value H-WESO-001.yaml's own `status`/`status_history`
        fields have ever used (its vocabulary through DEC-20260802-48c72c is
        proposed / specified / analyzed, with `transition: none` at every step
        since BATCH-001). ledger/hypotheses/H-WESO-001.yaml's status_history
        was read in full for this batch: it has no entry citing
        DEC-20260804-e19a65 or BATCH-403f13 at all. The record ends at
        DEC-20260802-48c72c ("analyzed", transition: none). The hypothesis
        record's live `status:` field still reads `analyzed`. A decision that
        narrates a status transition without the target record ever carrying
        it is not a completed status change under this programme's own rules
        (AGENTS.md: hypothesis status lives in ledger/hypotheses/).
    - id: D-4
      title: "ledger/goals/GOAL-P13-001.yaml was never advanced"
      finding: >-
        No batch_checkpoints entry for BATCH-403f13 exists. current_batch_id
        is still BATCH-003; campaign_budget.batches_consumed is still 3;
        dispatch_queue_path still points at BATCH-003's queue; next_action
        still reads, verbatim, as an instruction to open a future BATCH-004.
        BATCH-403f13's own dispatch_queue.json states a
        terminal_status_obligation on its ledger-archive task: "After this
        archive, GOAL-P13-001 moves to paused or closed_at_budget... Never
        completed" — matching DEC-20260802-48c72c's own PRE-COMMITMENT in
        goal.yaml.pause_condition_watch. This obligation was never carried
        out: goal.yaml's status field is still `active` with no closure
        recorded anywhere this session can read.
    - id: D-5
      title: "The promoted KN-FIND content does not match DEC-20260802-48c72c's binding schedule and does not visibly trace to the measured data"
      finding: >-
        DEC-20260802-48c72c.knowledge_promotion (and its own restatement in
        H-P13-001.yaml/H-WESO-001.yaml/the BATCH-403f13 design_report.yaml's
        own kn_find_obligation section) bindingly fixed the promotable content
        IN ADVANCE: the estimator lemma "an intercept is only meaningful
        paired with the slope of the same fit of the same series over the
        same window; a slope-only calibration law reports ZERO overhead for
        an object carrying a large constant one", with two named instances
        (the NC2b C-NULL counterexample and the A-3 pairing-rule absorption),
        proof_status `derivation`, and explicitly "NOT any c value."
        KN-FIND-4e7a92.md and KN-FIND-d1c853.md instead promote two different
        technical claims: a "corrected estimator formula"
        `C_corrected = phi(ell) * C_Phi_ell + C_walk` and a "Heuristic 1
        pairing rule" `N_pairs ~ exp(H_1 * n_walk)`. Neither formula, nor the
        terms phi(ell), C_walk, or N_pairs, appears anywhere in
        experiments/EXP-P13-NC2d/runs/RUN-P13-NC2d-a/raw-result.json,
        experiments/EXP-P13-NC2b/runs/RUN-P13-NC2b-a/raw-result.json, the
        Validator's validation_report.yaml/validation_notes.md, or the Red
        Team's red_team_report.yaml/falsification_review.md read for this
        batch — all of which describe an alpha-exponent p-scaling regression
        and an NC2b slope-recovery check, nothing resembling these formulas.
        This is a content-provenance concern under AGENTS.md rule 5 ("never
        fabricate ... results") independent of whether shipping *some*
        KN-FIND in this slot technically satisfied a checkbox: the specific
        content that shipped is neither the scheduled content nor visibly
        derived from the run this batch's own evidence record cites as its
        basis.
    - id: D-6
      title: "No handoff records exist for any BATCH-403f13 task, including the one that produced the archive"
      finding: >-
        ledger/handoffs/ contains no TASK-20260804-c802a9, -7cb2d2, -241b87,
        -6519fa, -bf4dce, -83d874, or -cf1ae3 record (grepped directly;
        zero matches), contrary to AGENTS.md's "every task you assign must be
        persisted as a handoff record." EV-WESO-b6ceff.yaml's own
        `recorded_by_task: TASK-20260804-eacb99` names an EIGHTH task ID that
        appears in NO OTHER artifact read for this batch — not in
        dispatch_queue.json's task list (which names TASK-20260804-bf4dce as
        the ledger-archive task), not in any receipt, and with no handoff
        record of its own. The archive attempt in evidence_chain step 4 was
        therefore not produced by BATCH-403f13's own planned, reviewed
        archive task (TASK-20260804-bf4dce); it was produced by an
        out-of-band task this session cannot trace an authorization for.
    - id: D-7
      title: "Item (4), the substantive item, remains genuinely open"
      finding: >-
        Independent of every defect above: NC-3/NC-6 (Heuristic 1 tail
        validation) has still never successfully executed once across this
        goal's entire budgeted history (unrun in BATCH-001, unrun in
        BATCH-002/003, failed_infrastructure in BATCH-403f13). This is not a
        mathematical result against Heuristic 1 (AGENTS.md rule 5) and is not
        resolved by anything else this batch found. It is the one item where
        "already attempted" does not mean "already answered."

  scope_decision: >-
    No Executor task is dispatched by this batch. Redispatching NC2d-PROPER,
    NC2b-SLOPE, or the bibliographic subtask would (a) duplicate work already
    genuinely executed at BATCH-403f13 with materially informative, admissible
    independent review (Validator accept_with_qualifications, Red Team
    pass_with_constraints — neither review found an execution defect in items
    (1)-(3)), and (b) spend the goal's remaining budget on already-decided
    measurement questions, exactly the duplicated-result failure mode
    agents/coordinator.md's Prohibitions and Decision checklist (Q1: "what
    exact uncertainty will this reduce?") forbid. AT THE SAME TIME, this batch
    does NOT treat DEC-20260804-e19a65, EV-WESO-b6ceff, KN-FIND-4e7a92, or
    KN-FIND-d1c853 as an official, standing disposition of BATCH-403f13:
    defects D-1 through D-6 mean none of the normal guarantees this
    programme's own rules require (verified post-commit archive, template-
    conformant decision vocabulary, an actually-updated hypothesis record, a
    KN-FIND matching its own binding pre-registration and traceable to the
    cited run) currently hold for that archive attempt. This batch authors no
    coordinator_decision of its own and changes no hypothesis, evidence, or
    goal status — the finding here is procedural (a stale goal-head pointer
    compounded by a defective, unverified prior archive attempt), not a new
    research result, and repairing it is a distinct action from re-deciding
    already-reviewed science or from rubber-stamping an unverified record.

  ranked_task_list_against_next_actions_four_items:
    - item: "(1) NC2d-PROPER"
      status: already_executed_and_reviewed
      evidence: "RUN-P13-NC2d-a; TASK-20260804-cf1ae3 accept_with_qualifications; TASK-20260804-83d874 pass_with_constraints"
    - item: "(2) NC2b-SLOPE"
      status: already_executed_and_reviewed
      evidence: "RUN-P13-NC2b-a; same two reviews"
    - item: "(3) bibliographic subtask"
      status: already_executed_and_reviewed
      evidence: "bib_results.json; three sources retrieved and reviewed"
    - item: "(4) NC-3/NC-6"
      status: attempted_and_failed_infrastructure_still_genuinely_open
      evidence: "TASK-20260804-6519fa infra_failure_receipt.yaml (D-7)"
    - item: "(5) BATCH-004 ledger archive carrying knowledge/findings/ and knowledge/INDEX.md, shipping the scheduled KN-FIND"
      status: attempted_but_defective_not_officially_settled
      evidence: "DEC-20260804-e19a65, EV-WESO-b6ceff, KN-FIND-4e7a92, KN-FIND-d1c853 (D-1 through D-6)"
    - item: "goal-head reconciliation (not one of the five named items, but the true prerequisite this design gate identifies)"
      status: recommended_not_dispatched_here
      task_id: "not yet minted -- a future dispatcher mints via tools/allocate_id.py --next handoff --date <YYYYMMDD> --check; not TASK-20260807-3fe1fe, which is this design-gate task itself"
      reason: >-
        Reconciling ledger/goals/GOAL-P13-001.yaml against BATCH-403f13's
        history AND repairing the defective archive attempt (a template-
        conformant decision, an actual H-WESO-001.yaml status_history entry, a
        real goal.yaml checkpoint/terminal-status update, and a resolved
        disposition for the two mismatched KN-FIND entries — either
        re-derive/replace them with the scheduled content or formally
        supersede/withdraw them) is outside this design gate's read/write
        scope and this task's own constraint against changing
        current_batch_id/next_action/status. It also risks the "resolve a
        sync conflict by editing a record" violation AGENTS.md forbids if
        done hastily. This batch hands the finding back to the orchestrating
        session with a precise recommendation (see SCOPE-DECISION.md) to
        dispatch a dedicated reconciliation-and-repair task, which should
        also make the honest, still-open call on item (4) rather than leave
        the goal head pointing indefinitely at an already-attempted action.

  not_dispatched_note: >-
    This batch's dispatch_queue.json intentionally contains no Executor task
    card and no Coordinator ledger-archive task card, a deliberate and
    reasoned deviation from the literal instruction to include one, flagged
    here explicitly rather than silently omitted.

  h_weso_001_status_this_batch: "analyzed (unchanged; live status_history entries end at DEC-20260802-48c72c; DEC-20260804-e19a65's claimed transition was never applied to the record — see D-3)"
  goal_status_this_batch: active (unchanged; not authorized to change here)
  current_batch_id_and_next_action_this_batch: unchanged (not authorized to change here; see finding_summary)
  campaign_budget_note: >-
    ledger/goals/GOAL-P13-001.yaml's campaign_budget.maximum_batches is null
    (uncapped, per the 2026-08-02 user amendment recorded in that file) with
    batches_consumed: 3 / batches_remaining: 1 carried over from the
    superseded cap of 4 — a figure this batch does not correct, since doing so
    is exactly the kind of goal.yaml edit this task is constrained against and
    belongs in the recommended reconciliation task (which will also need to
    account for BATCH-403f13 as an actually-consumed batch). This design-gate
    batch does not consume Executor budget and claims no
    experiment_runs_authorized value against it.
  official_research_state_changed: false
  claim_ceiling: not_applicable
