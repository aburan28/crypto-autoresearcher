  counterexample_or_mutation: >
    THE CHEAPEST DISCRIMINATING OBJECT IS ALREADY IN THE RUN AND WAS NOT USED
    THIS WAY. Apply the pre-registered extrapolation law to the run's own
    C-NULL series. gamma_null = -0.0132 gives c_null = -0.0118 ~ 0, i.e. the
    law reports ZERO overhead. The same control measures per_entry_null =
    2^12.32 at ell = 2 and 2^12.26 at ell = 101 against Section 4.1's assumed
    2^0. An estimator that returns "no overhead" for an object it has just
    measured at 4900-5100 operations per entry is measuring the slope of the
    overhead, not the overhead. This is a mutation of the ANALYSIS, costs
    nothing, and is fully internal to the committed artifact - no new run, no
    new assumption, no external citation.
    The second mutation, also free: recompute the headline slope on IMPL-A
    alone. It falls from 0.9739 to 0.9332 and the "misspecification" signal
    disappears from the local-slope profile. Any headline that changes when you
    remove an implementation-switching discontinuity from the middle of the
    window was never a property of the object.

  baseline_comparison:
    end_to_end_baseline: >
      Unchanged in structure from my July report and still not instantiated by
      this programme. The end-to-end baseline for every concrete NIST-I claim
      is Delfs-Galbraith with the Santos-Costello-Shi subfield acceleration
      ([15] in the frozen bibliography) and the concrete constants of Adj et al.
      ([3]), run as n-way parallel subset-hitting with negligible memory and no
      shared state, i.e. T_base = k * 2^{log2p/2} / n walk-steps on hardware
      whose total budget matches the attack's (memory-w table + n processors +
      interconnect). The constant k is STILL unquantified in this repository -
      no task in BATCH-001 or BATCH-002 fetched [15] or [3] - so every margin
      number in this report carries an unquantified constant-factor uncertainty
      in ADDITION to the overhead uncertainty, in the attack's disfavour if k >
      1. RT2-C7 adds the symmetric point that the baseline's per-step cost is
      also charged at 1 F_{p^2}-op when it is plausibly 2^5-2^7, which cuts the
      other way by 5-7 bits.
    pollard_rho_and_bsgs: >
      NOT APPLICABLE AND RECORDED AS SUCH RATHER THAN OMITTED. The problem
      under review is the supersingular isogeny / endomorphism-ring problem,
      not a discrete logarithm in a cyclic group. Pollard rho and BSGS have no
      instantiation against it; the correct specialised baselines are
      Delfs-Galbraith (p^{1/2}) and its refinements, and the meet-in-the-middle
      / vOW parallel collision search family that RUN-WESOVOW-001 already models.
      Both are compared above.
    closest_specialized_baseline_for_the_measured_quantity: >
      For the measured quantity itself - F_{p^2}-multiplications per table
      entry when populating ell-isogeny neighbours via Phi_ell - the closest
      specialised baselines are (i) the run's own IMPL-B, and (ii) the
      Sutherland-style batched modular polynomial evaluation named in the
      frozen paper's Lemma 3.3 footnote. (i) beats the headline. (ii) is
      unimplemented here and I did not retrieve its literature this session, so
      it is recorded as an UNCHECKED frontier axis, not as absent.

  pareto_honesty:
    dominated_by:
      - axis: time (per-entry F_{p^2}-multiplications)
        dominator: >
          The run's OWN IMPL-B. Over ell 11..101 IMPL-B is cheaper at every
          ell >= 17, by a factor rising to 1.2954, with homogeneous exponent
          0.7929 against IMPL-A's 0.9179 on the same range. The headline
          measurement is dominated by a routine inside the same file.
        status: CHECKED, from committed per_ell.cost_ratio_A_over_B
      - axis: time (asymptotic per-entry exponent)
        dominator: >
          Any quasi-linear polynomial multiplication (Kronecker substitution,
          FFT) or batched Sutherland-type modular polynomial evaluation, which
          drives gamma toward 0 up to polylog and removes up to 13.25 of the
          25.43 modelled NIST-I overhead bits.
        status: >
          STRUCTURALLY ESTABLISHED from the committed pipeline (gamma =
          exponent(M) - 1, corroborated by the run's own two-implementation
          pair), NOT MEASURED. The external Sutherland literature was not
          retrieved this session; that axis is UNCHECKED.
      - axis: memory / data
        dominator: >
          Not applicable to the measured quantity: this run stores nothing and
          queries nothing. For the DOWNSTREAM claim, the attack's memory is
          2^93.28 entries at NIST-I against Delfs-Galbraith's negligible
          memory, and the model's +0.5-bit-per-bit memory credit is
          approximately cancelled by real access latency (RT2-C6). The attack
          does NOT dominate DG on the memory axis at any tested w and the
          comparison is a genuine trade, not a Pareto improvement.
        status: CHECKED against RUN-WESOVOW-001 per_field memory rows
    dominated_by_is_not_null: true
    dominated_by_note: >
      Setting dominated_by to null here would have been a fabrication under
      AGENTS.md rule 9. Every row above names what dominates, on which axis,
      and whether I actually checked it or am flagging it unchecked.
    sota_delta:
      quantity: "width of the defensible NIST-I margin interval at w = 2^30"
      before_this_run: >
        Scenario family c in {0, 0.5, 1, 2} with no measurement anywhere:
        margin in [2.27, 34.27] bits, width 32.00 bits, lower end INSIDE the
        +-3.51-bit irreproducibility band.
      after_this_run_under_rt2_corrected_reading: >
        margin in [5.40, 22.67] bits, width 17.27 bits, lower end OUTSIDE both
        the 3.51-bit and the 2.23-bit band.
      delta: >
        Narrowing of 14.73 bits, i.e. 46% of the prior uncertainty width, plus
        the qualitative gain that the lower end now clears the irreproducibility
        band. This is a real and non-trivial contribution and I state it as such
        despite everything above. What it is NOT: a determination of c. The
        residual 17.27-bit width is dominated by the unimplemented
        multiplication routine and the unmeasured p-scaling, and the run's
        headline c = 0.864 is not inside my corrected interval at all.
      dominated_by_field_of_the_run_itself: >
        The run package does not carry a dominated_by field; the contract did
        not require one for a pure measurement. Recorded as a gap, not a
        violation, since docs/inventor-protocol.md binds ideation and closure
        deliverables. The DOWNSTREAM evidence and decision records must carry
        it, populated from the rows above.
      kn_lit_7593_check: >
        The eliminated-dimension rule applies here in a mild form. The paired
        design removes j-to-j variation from the ell slope, and its cost - pool
        generation by 120-step 2-isogeny walks - is explicitly excluded from the
        measurement as sample preparation. That exclusion is correct for a
        per-entry cost measurement because Algorithm 1 does not regenerate the
        pool per entry. No search dimension is claimed eliminated as a speedup,
        so no uncharged invariant cost is being smuggled into a headline. No
        objection on this axis.

  heuristic_challenges:
    - id: RT2-H0
      statement: >
        NOTHING IN THIS RUN BEARS ON HEURISTIC 1, and the run says so
        (non_claims). My July objections RT-H1 through RT-H4 are therefore
        UNTOUCHED and remain open: the paper's Figures 1-2 test the body of the
        smoothness distribution under an unidentified size model while
        Heuristic 1 is a tail statement at u ~ sqrt(log p); the walk-based
        quaternion sampler is unvalidated; the ell = 2 parity channel is
        untested; and the disjointness content of the heuristic has no
        supporting data anywhere in the record. Controls NC-3 and NC-6 from my
        July report remain unrun.
      severity: high
      why_it_matters_here: >
        P0 sits inside every margin number in this report. A constant-factor
        error in P0 at the operating point moves log2T_full directly and
        therefore moves all eight margin rows by the same amount. A programme
        that resolves c to +-2 bits while P0 carries an unbounded
        constant-factor uncertainty has optimised the wrong term. This is a
        prioritisation objection against the batch plan, not against the run.
    - id: RT2-H1
      statement: >
        The run's OWN heuristic is L1 and it is not numbered, justified, or
        given a random-model transfer argument in the exemplar's sense. L1
        asserts that a power law measured over ell <= 211 extends to ell ~
        2^14.2. The contract labels it UNTESTED, which is honest, but the
        target-result profile requires a heuristic to come with a rigorous
        bound plus a distribution theorem or an explicit falsification
        condition. L1 has neither. The run's own non_claims concede the
        identifiability limit: "This experiment cannot discriminate between
        per-entry cost laws that agree over ell <= 251 and diverge at ell ~
        2^14."
      severity: medium
      transfer_challenge: >
        The random-model transfer question in the exemplar's sense - does the
        justification apply to the structured object at hand - has a clean
        answer here and it is unfavourable to extrapolation: per_entry is NOT
        an unstructured empirical curve. It is log2(p)*M(ell)/(ell+1) for a
        known M. That structure is what licenses extrapolation AT ALL, and it
        is also what makes the extrapolated value a property of M rather than
        of Algorithm 1 (RT2-C4). The run gets the benefit and the cost of the
        same fact and reports only the benefit.

  cost_model_challenges:
    - "RT2-C1: the law drops the measured intercept; falsified by the run's own null object; worth +11.6 bits of NIST-I overhead."
    - "RT2-C3: c(p) extrapolated along an axis with n = 1; the law's p-dependence has the wrong sign of structure; worth +2.7 bits at NIST-I."
    - "RT2-C4: gamma = exponent(M) - 1; a competent optimisation removes up to 13.25 bits, about 54% of the corrected overhead."
    - "RT2-C6: the vOW +0.5-bit-per-memory-bit credit is approximately cancelled by real latency beyond DRAM; quote margins at w = 2^30 only."
    - "RT2-C7: measured overhead is charged to the attack while the baseline keeps its nominal one-op-per-step convention; worth 5-7 bits back to the attack, unmeasured."
    - >
      Total-cost bookkeeping: VERIFIED CORRECT, no objection. log2T =
      log2M - log2P0 in RUN-WESOVOW-001 is per-attempt cost times inverse
      success probability with a full table rebuild per attempt, and the vOW
      regime divides that same total by sqrt(w). Per-attempt cost is not being
      confused with total expected cost anywhere in this chain.

  reduction_and_scope_challenges:
    - id: RT2-S1
      target: "My own prior RT-S1 position, as the brief requires me to address explicitly."
      severity: high
      position: >
        RT-S1 IS PARTIALLY WEAKENED AND NOT WITHDRAWN, and I separate the two
        halves because they now have different fates.
        RETIRED: the sub-claim that "the NIST-I margin is within a few bits of
        zero under defensible constant-factor calibrations". This rested on
        RT-C1's gamma = 2, which contained an arithmetic error (see
        self_correction above), and on quoting the c = 2.0 row rather than the
        c = 1.78 its own derivation supported. Under every reading constructible
        from RUN-PEC-6be870-a the NIST-I margin at w = 2^30 is between 5.40 and
        22.67 bits and clears both the 2.23-bit and 3.51-bit irreproducibility
        bands. The "margin might be zero at NIST-I" scenario should be retired
        from the programme's active hypothesis set and I am the one who put it
        there.
        STANDING: that no scope statement stronger than the paper's own abstract
        hedge is supported. The reasons are now narrower and I list them so the
        Coordinator can attack them in turn: (i) the magnitude is uncertain over
        a 17.3-bit span, set by an unimplemented multiplication routine
        (RT2-C4) and an unmeasured p-scaling (RT2-C3), which is far wider than
        any parameter-setting decision tolerates; (ii) the headline gamma is a
        composition artifact and the clean homogeneous number has not yet been
        reported as primary (RT2-C2); (iii) the window supplying the interval's
        upper end has no null-object control (RT2-C5); (iv) the baseline
        constant k is still unquantified and no task has fetched [15] or [3]
        (RT-S2, unchanged since July); (v) Heuristic 1's tail behaviour, which
        sets P0 and therefore every margin row, remains untested (RT2-H0). The
        paper's own hedge - "impact on concrete parameter sets remains to be
        clarified" - remains the correct framing, and it is now correct for
        reasons of MAGNITUDE rather than of SIGN.
    - id: RT2-S2
      target: "Whether the NIST-I question moves off INCONCLUSIVE."
      severity: high
      position: >
        NO - BUT THE UNCERTAINTY IS MATERIALLY NARROWER AND THE NARROWING IS
        ASYMMETRIC IN THE ATTACK'S FAVOUR.
        H-WESO-001.adjudicated_positions.concrete_threat_nist1 should remain
        INCONCLUSIVE. What has changed is which scenarios are live: the
        "overhead swallows the NIST-I advantage" branch is no longer supported
        by any evidence in the record, and the surviving question is whether the
        advantage is roughly 5 bits or roughly 23 bits. That is a real research
        result and the Coordinator should record it as one. It is not a move off
        INCONCLUSIVE, because a 17.3-bit interval whose width is dominated by an
        unwritten subroutine is not a concrete threat assessment, and because
        AGENTS.md rule 7 forbids presenting an 80-bit-field measurement over
        ell <= 211 as validation at NIST-I.
    - id: RT2-S3
      target: "Scope inflation audit of the affected/safe scheme lists."
      severity: low
      position: >
        NO INFLATION FOUND IN THIS RUN. The contract's non_claims explicitly
        disclaim CSIDH, (qt-)Pegasis and torsion-based constructions, disclaim
        any bearing on Heuristic 1, disclaim any hypothesis-status change, and
        cap the claim tier at medium with the extrapolated c carrying no tier at
        all. This is the most scrupulous non_claims block in the programme and I
        record that rather than manufacturing an objection. The binding risk is
        entirely downstream: the c values are quotable numbers sitting in a
        manifest result block, and nothing in the manifest prevents a later
        record from citing c = 0.864 without the L1-L4 attachments. RT2-C1 makes
        that number wrong, not merely conditional.

  proof_architecture_challenges:
    - id: RT2-P1
      attack: "Observation-fiber"
      finding: >
        SUCCEEDS, and the contract concedes it. Hold the observable fixed -
        per_entry over ell <= 211 at p ~ 2^40 - and vary the underlying object:
        M(ell) schoolbook, M(ell) Karatsuba, and M(ell) quasi-linear all sit in
        the same fiber to within the measured resolution over the low end of
        the range while diverging by up to 13.25 bits at ell = 2^14.2. The run's
        own audit_dispositions records observation_collision as "APPLICABLE and
        NOT closed" and names batched evaluation as the collision candidate. The
        missing separator is a third implementation at a different M-exponent,
        which is control NC2c.
    - id: RT2-P2
      attack: "Quantifier-order"
      finding: >
        The contract states the supported form correctly: "for THIS
        implementation pair, there exists gamma such that for all ell in the
        measured range". The extrapolation then silently uses the uniform form
        "there exists gamma for all ell up to 2^14.2 and for all p up to 2^768",
        with the witness chosen after seeing one implementation at one prime.
        The contract's own L1/L4 flag this; the manifest's
        extrapolated_c_per_level block does not carry the quantifier with it.
    - id: RT2-P3
      attack: "Method-ceiling"
      finding: >
        The ceiling of this method is an UPPER bound on the per-entry exponent
        of an unoptimised implementation. It can never establish a lower bound
        on the cost of an optimal one, so it can never establish that the attack
        is more expensive than the paper claims. The contract states this
        verbatim. The consequence is under-drawn in the run's framing: the
        method as designed cannot answer the question the batch posed, and can
        only ever narrow it from above.
    - id: RT2-P4
      attack: "Nearby-object"
      finding: >
        C-NULL is the correct nearby object and it PASSES as a flatness control
        - gamma_null = -0.0132, CI containing 0, ratio 0.958 within the
        2^{+-0.5} band. I record that the null control is well designed and did
        its job. It also, unintentionally, falsifies the extrapolation law
        (RT2-C1). A control that passes its own criterion while refuting the
        estimator built on top of it is the most informative object in the run
        and the run does not notice.
    - id: RT2-P5
      attack: "Boundary and strictness"
      finding: >
        C-BASE.6 correctly embeds the paper's convention as gamma_paper = 0, and
        the denominator entries(ell) = ell + 1 matches Lemma 3.3's "each batch
        of (<=) ell + 1 new entries" exactly, confirmed against committed
        samples. The counting-unit and amortisation objection raised in my task
        brief therefore FAILS: the denominator is the paper's own and does not
        flatter the attack. I record this as a failed attack rather than
        pressing it.

  narrowest_supported_statement: >
    For the specific pure-Python implementation pair committed at 49166fa5, at
    the single prime p = 1099511627563 (80-bit F_{p^2}), over 45 measured prime
    degrees 2 <= ell <= 211 (ell = 97 lost to a fetch obstruction), the number
    of F_{p^2} multiplications required to instantiate Phi_ell(j, x) and extract
    its distinct roots, divided by the ell + 1 entries that Lemma 3.3 amortises
    that batch over, is well described by a power law in ell whose exponent is
    0.9332 for schoolbook multiplication and 0.7929 for Karatsuba multiplication
    over the range where both were run, with an ell-independent prefactor of
    2^8.92 multiplications per entry. Controls C-INSTR, C-BASE.1-6, C-ALT.1-2
    and C-NULL all pass as specified, C-NULL over ell 2..101 only. Nothing about
    behaviour at ell ~ 2^14, at any other prime, or for any other multiplication
    routine follows, and the reported headline gamma_reported = [0.8691, 0.9783]
    is not a homogeneous measurement of either implementation.
    Downstream, and as a MODEL SUBSTITUTION carrying no claim tier: restoring the
    measured intercept and its log p scaling to the pre-registered law gives
    c ~ 1.59 at NIST-I rather than the reported 0.864, and a modelled advantage
    over Delfs-Galbraith of 8.84 bits at w = 2^30 entries, inside a defensible
    span of 5.40 to 22.67 bits whose width is set by unmeasured quantities.

