  claim_under_review: >
    That RUN-PEC-6be870-a's measured per-entry exponent gamma_reported =
    [0.8691, 0.9783] (W-MID point 0.9739), extrapolated under the
    pre-registered law c = gamma * log2(B_opt) / sqrt(log2 p), yields
    c = 0.771 / 0.864 / 0.868 at NIST-I and therefore moves the concrete
    NIST-I question by roughly halving the overhead exponent that RT-C1
    calibrated at c ~ 1.78-1.88.

  overall_verdict: >
    The RUN IS A HIGH-QUALITY MEASUREMENT AND ITS HEADLINE IS THE WRONG
    QUANTITY. The controls, the instrumentation, the provenance battery, and
    the executor's honesty are all better than the interpretation resting on
    them. Two defects are decisive and both are in the inference layer, not the
    data layer: (1) the pre-registered law measures only the ell-SCALING of the
    per-entry overhead and discards the intercept, and the run's own null
    object proves the law returns c ~ 0 for an object measured at 2^12.3
    F_{p^2}-multiplications per entry; (2) the primary series is
    compositionally inhomogeneous across ell = 101/103, and the headline
    gamma = 0.9739 EXCEEDS BOTH of its homogeneous constituents (IMPL-A alone
    0.9332, IMPL-B alone 0.7929), which no genuine exponent can do. Correcting
    (1) alone moves c at NIST-I from 0.864 to ~1.59 and the modelled NIST-I
    margin from 20.4 to 8.8 bits at w = 2^30. My own prior RT-C1 fares no
    better and I retract part of it below: its gamma = 2 rested on an
    arithmetic error, and the run's own homogeneous local slope is flat at
    ~0.94 from ell = 17 to ell = 197 with no acceleration whatever.

  # ==================================================================
  # OBJECTIONS, RANKED BY SEVERITY
  # ==================================================================
  objections:

    - id: RT2-C1
      rank: 1
      severity: critical
      target: >
        The pre-registered extrapolation law c = gamma * log2(B_opt) /
        sqrt(log2 p), and every c value in raw-result.json extrapolation.rows.
      claim_challenged: >
        That c = 0.864 at NIST-I is the overhead the run measured.
      body: >
        THE LAW MEASURES THE SLOPE AND DISCARDS THE LEVEL. Paper Section 4.1
        (frozen text, line 230) assumes "constructing a table costs a single
        F_{p^2}-operation per entry". The overhead multiplier over that
        assumption is therefore the FULL measured per_entry at ell = B_opt,
        i.e. A * B_opt^gamma, and in bits it is log2(A) + gamma*log2(B_opt).
        The contract's derivation (specification.yaml,
        derivation_of_the_law) sets the table-cost multiplier equal to
        B_opt^gamma = 2^{gamma*log2 B_opt}, which silently sets A = 1. The run
        measured A directly: the W-MID intercept is 8.9241 bits, i.e.
        A = 2^8.92 = 486 F_{p^2}-multiplications per entry at ell = 1,
        p ~ 2^40. Nine bits of measured, ell-independent overhead are dropped
        by the law before c is computed.
        THE RUN'S OWN NULL OBJECT FALSIFIES THE LAW AS A MEASURE OF OVERHEAD.
        C-NULL builds tables whose per-entry cost is O(1) in ell BY
        CONSTRUCTION and measures per_entry_null = 5118.83 at ell = 2 and
        4903.13 at ell = 101, i.e. 2^12.32 and 2^12.26 F_{p^2}-multiplications
        per entry (raw-result.json, controls.C-NULL.flatness_*). gamma_null =
        -0.0132, so the pre-registered law returns c_null =
        -0.0132*14.2/16 = -0.0118 ~ 0. The law therefore reports "no overhead"
        for an object the same run measured at 2^12.3 operations per entry
        against the paper's assumed 2^0. That is not a marginal calibration
        issue; it is a demonstration, internal to the run, that c as defined
        cannot represent the quantity the NIST-I margin needs.
        MAGNITUDE (RT2 recomputation, from the committed W-MID fit and the
        committed vOW model): at NIST-I, log2 B_opt = 14.2, sqrt(log2 p) = 16,
        log2T_full = 108.7309, T_DG = 2^128.
          law as reported          : overhead 13.83 bits, c = 0.864, margin@w=2^30 = 20.44 bits
          + measured intercept     : overhead 22.75 bits, c = 1.422, margin@w=2^30 = 11.52 bits
          + intercept scaled to p  : overhead 25.43 bits, c = 1.589, margin@w=2^30 =  8.84 bits
        The intercept scaling is not a guess: per_entry_cost.py computes roots
        as gcd(x^{p^2} - x, f) via poly_powmod with exponent Q = p*p, whose
        binary loop runs log2(p^2) = 2*log2(p) iterations, plus
        Cantor-Zassenhaus splittings at exponent (Q-1)/2. The cost is therefore
        LINEAR IN log2 p at fixed ell, so A(2^256)/A(2^40) = 256/40 = 6.4,
        i.e. +2.678 bits. This is read off the committed implementation, not
        recalled.
        DIRECTION: this objection is anti-attack. It roughly doubles the
        modelled overhead exponent relative to the reported c and cuts the
        modelled NIST-I margin by 11.6 bits.
      cheapest_discriminating_control: >
        Zero new compute. Recompute the extrapolation under the corrected law
        c = [log2(A) + gamma*log2(B_opt)] / sqrt(log2 p) using the intercepts
        ALREADY IN raw-result.json (fit.windows.*.intercept), and report both
        the law-as-frozen value and the corrected value side by side. The
        frozen contract must not be edited; this belongs in a superseding
        analysis record. Discriminating check that the correction is the right
        one: apply the corrected law to C-NULL and confirm it returns
        c_null = 12.3/16 = 0.77 rather than 0.
      what_the_quantity_should_have_done: >
        The parameter meant to destroy a genuine ell-driven overhead is ell
        itself going to 1. Under the reported law the overhead vanishes there.
        Under measurement it does not: it converges to 2^8.9. A quantity that
        fails to decay when the parameter meant to destroy it is removed is the
        artifact tell of docs/inventor-protocol.md section 3, applied here to
        the ESTIMATOR rather than to the signal.

    - id: RT2-C2
      rank: 2
      severity: high
      target: >
        gamma_reported = [0.8691, 0.9783], the W-MID point estimate 0.9739, the
        W-TOP slope 0.9735, and the curvature declaration
        single_exponent_model_misspecified = true with
        gamma_local_top = 1.1706.
      claim_challenged: >
        That 0.9739 is a measured per-entry exponent of anything, and that the
        positive curvature is evidence about the top of the range.
      body: >
        THE PRIMARY SERIES IS NOT ONE SERIES. The contract's carry_forward_rule
        sets primary per_entry(ell) = min over implementations. The committed
        cost_ratio_A_over_B shows IMPL-B (Karatsuba) is the minimum at EVERY
        ell >= 17, with the ratio rising monotonically 1.081 (ell = 17) ->
        1.2954 (ell = 101). IMPL-B was run over the core grid only, so the
        primary series is min(A,B) for 11 <= ell <= 101 and IMPL-A ALONE for
        103 <= ell <= 211. Losing IMPL-B at ell = 103 imposes a pure upward
        level shift of log2(1.2954) = 0.373 bits that has nothing to do with
        ell-scaling, sitting one third of the way along a 4.26-octave window.
        THE TELL: the headline exceeds both constituents. RT2 recomputation on
        the committed medians, same estimator, same W-MID window:
          IMPL-A alone, ell >= 11 (full range 11..211) : gamma = 0.9332
          IMPL-B alone, ell 11..101                    : gamma = 0.7929
          IMPL-A alone, ell 11..101                    : gamma = 0.9179
          PRIMARY min(A,B), ell >= 11  (REPORTED)      : gamma = 0.9739
        A minimum of two power laws cannot have a larger exponent than either
        one. 0.9739 > 0.9332 and 0.9739 > 0.7929 is only possible because the
        composition changes inside the window. The headline is a Simpson-type
        composition artifact, not an exponent.
        THE CURVATURE IS THE SAME ARTIFACT. RT2 recomputation of rolling
        8-point local slopes:
          ell   2.. 19  primary +0.7403   IMPL-A +0.7692   [min(A,B)]
          ell  29.. 59  primary +0.7989   IMPL-A +0.9411   [min(A,B)]
          ell  53.. 83  primary +0.7129   IMPL-A +0.9331   [min(A,B)]
          ell  67..103  primary +1.2263   IMPL-A +0.9386   [MIXED]
          ell  79..113  primary +1.7817   IMPL-A +0.9424   [MIXED]
          ell 101..137  primary +1.3259   IMPL-A +0.9642   [MIXED]
          ell 109..151  primary +0.9503   IMPL-A +0.9503   [A only]
          ell 163..197  primary +0.9718   IMPL-A +0.9718   [A only]
        The apparent acceleration is confined EXACTLY to the three MIXED
        windows that straddle ell = 101. On the homogeneous IMPL-A series the
        local slope is flat at 0.93-0.97 from ell = 17 through ell = 197 and
        shows no acceleration at all. The contract's misspecification rule
        therefore fired on a composition artifact, and gamma_local_top = 1.1706
        is not evidence that the exponent is rising.
        THE QUADRATIC IS NOT STABLE ENOUGH TO EXTRAPOLATE EITHER WAY. RT2
        recomputation of the same quadratic diagnostic on nested windows:
          W-ALL (ell>=2)   c = +0.04881  local slope at top 1.171
          W-MID (ell>=11)  c = +0.08410  local slope at top 1.290
          ell >= 23        c = +0.10161  local slope at top 1.335
          ell >= 43        c = +0.04427  local slope at top 1.228
          ell >= 101       c = -0.29506  local slope at top 0.724
        The sign of c flips on the top half of the data. A diagnostic whose
        extrapolated local slope ranges over [0.72, 1.34] with the window
        cannot support a 6.5-octave extrapolation in either direction. This is
        the honest answer to the question posed in my task brief: the curvature
        is NOT evidence that the exponent is still rising toward 2 at ell ~
        2^14, and I decline to make that argument.
      cheapest_discriminating_control: >
        Run IMPL-B over the extension grid 103..211 (4 samples each) under the
        identical harness and seeds. The core grid at 8 samples took a
        measurable fraction of a 3600 s window and the extension at 4 samples
        already completed once, so this is a single-digit-hour successor run.
        Pre-register the test: if the composition explanation is right, the
        min(A,B) slope over ell >= 11 must FALL to at or below gamma_A = 0.9332
        once IMPL-B covers the whole range, and the W-ALL quadratic c must move
        toward zero. Cheaper still and worth doing first at zero compute:
        report gamma_A and gamma_B as the primary homogeneous pair and demote
        min(A,B) to a diagnostic.

    - id: RT2-C3
      rank: 3
      severity: high
      target: >
        The transfer of a p ~ 2^40 measurement to log2 p in {256, 384, 512,
        576, 768} under a law whose only p-dependence is the divisor
        sqrt(log2 p).
      claim_challenged: >
        That the experiment constrains c(p) at cryptographic p.
      body: >
        c IS A FUNCTION OF p AND p WAS NOT VARIED. The design varied ell over
        46 values and j over 8, and held p at a single value: the largest prime
        below 2^40 congruent to 3 mod 4. The p-axis has n = 1. Every NIST-level
        row in extrapolation.rows is therefore an extrapolation along an axis
        on which the experiment has no leverage whatsoever, and no bootstrap,
        jackknife, or window-union interval in the run quantifies that.
        THE LAW'S p-DEPENDENCE HAS THE WRONG SHAPE. The law makes c decrease in
        p at fixed gamma*log2 B_opt because it divides by sqrt(log2 p), while
        the measured object's per-entry cost is LINEAR in log2 p (poly_powmod
        at exponent Q = p*p; see RT2-C1). The overhead in bits is
        log2(A_0) + log2(log2 p) + gamma*log2(B_opt), and the middle term is
        exactly the term the law omits. This is not a small correction at
        cryptographic scale: it is +2.678 bits going from p = 2^40 to p = 2^256
        and +4.26 bits at p = 2^768.
        This objection is independent of RT2-C1: even a reviewer who accepts
        that the intercept should be dropped must still confront the fact that
        the retained ell-scaling was measured at one prime and that its own
        prefactor demonstrably moves with p.
      cheapest_discriminating_control: >
        Three-point p sweep with a deliberately tiny ell grid. Re-run the
        identical harness at p just below 2^20, 2^30 and 2^40 with
        ell in {11, 23, 47, 101} and 4 samples each, and fit
        log2 per_entry = alpha*log2(log2 p) + gamma*log2(ell) + const. The
        predicted alpha is 1 (cost linear in log2 p). Cost: far below the
        original run, because the dominant term is 2*log2(p) squarings and both
        the field and the grid shrink. Any alpha significantly different from 1
        is a finding about the implementation; alpha = 1 confirmed is what
        licenses the +2.678-bit correction in RT2-C1 scenario (3).

    - id: RT2-C4
      rank: 4
      severity: high
      target: >
        Declared assumption L4, and non_claims bullet 4: gamma is a property of
        this pure-Python implementation pair; batched Sutherland-type modular
        polynomial evaluation is not implemented.
      claim_challenged: >
        That L4 is a caveat. It is the dominant term, and the task brief is
        right that this is the strongest anti-result attack available.
      body: >
        THE MEASURED EXPONENT IS THE POLYNOMIAL-MULTIPLICATION EXPONENT MINUS
        ONE, AND NOTHING ELSE. Structurally, from the committed pipeline:
        cost(ell) ~ [2*log2(p^2) exponentiation steps + O(log ell) CZ
        splittings] * M(ell), where M is the polynomial multiplication routine;
        per_entry = cost/(ell+1) ~ log2(p) * M(ell)/ell. So
        gamma = exponent(M) - 1. The run confirms this internally and it is the
        only prediction in the whole report that both implementations test:
          M schoolbook, exponent 2      -> predicted gamma 1.000, measured 0.9332
          M Karatsuba,  exponent 1.585  -> predicted gamma 0.585, measured 0.7929
        Karatsuba has realised only about 30% of its asymptotic advantage by
        ell = 101, which is exactly what a crossover-limited Karatsuba does at
        degree ~100; the measured gamma_A - gamma_B = 0.125 over the common
        range 11..101 against an asymptotic 0.415 is the quantitative form of
        that. With quasi-linear multiplication (FFT or Kronecker substitution),
        exponent(M) -> 1 + o(1) and gamma -> 0 up to polylog, which is exactly
        the (B + log p)^{O(1)} that Lemma 3.3 declines to pin down and
        approximately what Section 4.1's one-operation-per-entry convention
        assumes up to the constant that RT2-C1 restores.
        QUANTIFIED, AS THE BRIEF REQUIRES. The ell-dependent part of the
        modelled NIST-I overhead is gamma*14.2 bits:
          schoolbook  gamma 0.9332  -> 13.25 bits
          Karatsuba   gamma 0.7929  -> 11.26 bits (asymptotic 0.585 -> 8.31)
          quasi-linear/batched      ->  ~0 bits + polylog
        A competent optimisation can therefore remove UP TO 13.25 of the 25.43
        bits of intercept-corrected NIST-I overhead, i.e. about 54% of it, and
        would raise the modelled NIST-I margin at w = 2^30 from 8.84 bits to
        22.67 bits. That single unimplemented routine is worth more bits than
        the entire measured gamma, more than the entire c-scenario family the
        run was built to collapse, and roughly four times the +-3.51-bit
        irreproducibility band. The frozen paper's own Lemma 3.3 footnote names
        this route and credits the suggestion to Damien Robert, so it is not a
        speculative escape hatch invented by the red team; it is the paper's
        stated expectation about how the list would actually be populated.
        DIRECTION: pro-attack, and it dominates. Stated plainly as the brief
        requires: a measured gamma from an unoptimised implementation is an
        UPPER bound on the achievable per-entry exponent, so the run's headline
        is anti-attack by construction and cannot be used to argue that the
        attack is more expensive than the paper claims.
        UNVERIFIED RECOLLECTION, FLAGGED AND NOT RELIED ON: I recall a
        sqrt-elu style isogeny evaluation with cost about O~(sqrt(ell)) per
        ell-isogeny, which if applicable would give gamma ~ 0.5 by a different
        route than batched modular polynomials; I did not retrieve a source
        this session, and its applicability here is doubtful because it needs
        ell-torsion over a small extension. It is recorded as a recollection
        and no number above depends on it.
      cheapest_discriminating_control: >
        Do not implement FFT. Implement Kronecker substitution only: pack
        F_{p^2}[x] products into big-integer multiplications and let CPython's
        int multiplication (Karatsuba above ~70 limbs) do the work, counting
        the equivalent F_{p^2}-multiplications by the declared conversion. This
        is a one-routine change to MULFN in per_entry_cost.py, reuses the whole
        harness and every control, and measures a third point on the
        exponent(M) -> gamma curve. Pre-register the prediction gamma_C <
        gamma_B < gamma_A. If gamma_C comes in near 0.3-0.5, the honest
        headline of this whole line of work becomes "the per-entry exponent is
        an implementation parameter in [0, 0.93], not a constant of Algorithm
        1", and the c-calibration programme should be re-scoped accordingly.

    - id: RT2-C5
      rank: 5
      severity: medium-high
      target: >
        W-TOP (ell 173..211, n = 8, R^2 = 0.9995, max |residual| 0.0032 bits,
        bootstrap CI [0.9646, 0.9783]) and its role as the upper end of
        gamma_reported.
      claim_challenged: >
        That the cleanest-looking window is the most trustworthy one.
      body: >
        THE STRONGEST-LOOKING FIT SITS ENTIRELY IN THE UNCONTROLLED REGION, AT
        HALF THE SAMPLE DENSITY, ON A NEGLIGIBLE LEVER ARM. Three facts, all
        from the committed record:
        (a) NULL COVERAGE. controls.C-NULL.per_ell_per_entry covers exactly
        ell in {2,...,101}, 25 values. Every W-TOP ell (173, 179, 181, 191,
        193, 197, 199, 211) lies OUTSIDE it. The contract's own void clause
        says a primary measurement that C-NULL cannot cover "may not be cited
        as a measured exponent by any downstream record". The executor
        disclosed the coverage gap honestly (execution_report line 311) but the
        gap is load-bearing: the window that supplies the HIGH end of
        gamma_reported is the window with no null-object control.
        (b) SAMPLE DENSITY. W-TOP ell carry 4 IMPL-A samples each; core ell
        carry 8 IMPL-A plus 8 IMPL-B. The cluster bootstrap is defined over 8
        j-indices; at extension ell only the first 4 pool members exist. The
        W-TOP bootstrap completed 1991 of 2000 replicates rather than 2000
        (fit.windows.W-TOP.bootstrap_replicates), a 9-replicate shortfall the
        record does not explain. Small, but it is an unexplained deviation in
        the estimator that produced the reported upper bound.
        (c) LEVER ARM. W-TOP spans log2(211) - log2(173) = 0.286 octaves. It is
        used to characterise behaviour 6.48 octaves further out at
        log2 B_opt = 14.2, a ratio of 22.6 lever arms. Its R^2 = 0.9995 and
        0.0032-bit residuals are not precision about the world; they are the
        signature of a deterministic instruction counter fitted over a range
        too narrow to bend. The contract anticipated exactly this when it wrote
        that "with a near-deterministic counter the sampling CI understates the
        real uncertainty", and then still let W-TOP set the interval's high end.
      cheapest_discriminating_control: >
        Extend C-NULL over the identical extension grid 103..211 at 4 samples
        each. The null is 2-isogeny steps only, so its per-sample cost is
        independent of ell and this is the cheapest measurement in the whole
        design - materially cheaper than the primary samples at those ell.
        Pre-register the pass criterion already in the contract
        (|gamma_null| <= 0.15 and CI containing 0) applied to the extension
        range alone. Until that exists, W-TOP should be reported as
        UNCONTROLLED and should not set the high end of gamma_reported.

    - id: RT2-C6
      rank: 6
      severity: medium
      target: >
        My own prior RT-C2, and the vOW interpolation
        T(w) = T_full / sqrt(min(w, M)) that gives +0.5 bits of margin per bit
        of memory at zero access cost. This experiment excludes hashing, table
        insertion and table lookup entirely (specification.yaml,
        excluded_costs_and_their_direction, declared attack-favourable).
      claim_challenged: >
        My prior claim that table access is "the binding constraint" and that
        the model's memory scaling is void.
      body: >
        I AM CORRECTING MY OWN PRIOR OBJECTION IN THE ATTACK'S FAVOUR AT SMALL
        w AND SHARPENING IT AT LARGE w. At NIST-I an F_{p^2} multiplication is
        a handful of 256-bit modular multiplications; a random access into a
        2^30-entry table is a DRAM miss. On any commodity machine those are the
        same order of magnitude. So at w = 2^30 the excluded table access is
        worth roughly 0 to 1 bit per entry, NOT the large beta I implied in
        RT-C2, and its exclusion does NOT materially bias the 8.84-bit margin
        computed under RT2-C1 scenario (3). RT-C2 as written overstated this
        at the memory sizes where the margin is actually evaluated.
        WHERE RT-C2 SURVIVES, AND SHARPER THAN BEFORE: the model credits
        +0.5*log2(w) bits of margin for memory, uniformly, with no access cost.
        Real access latency is a staircase - cache, DRAM, local flash, network
        - and going from a 2^30-entry DRAM table to a 2^50-entry distributed
        table is roughly three to four orders of magnitude of latency, i.e.
        about 10-13 bits, against the 10 bits of margin the model hands back
        over that same range. To first order the memory axis is FLAT, not
        +0.5 bits per bit. The operational consequence is narrow and testable:
        every margin statement should be quoted at w = 2^30 and the larger-w
        rows should not be read as improvements. That is a smaller claim than
        RT-C2 made and I am replacing RT-C2's version with it.
        These latency figures are engineering common knowledge and I did not
        retrieve a citation this session; they are used only to argue that two
        effects roughly cancel, and no numeric margin above depends on them.
      cheapest_discriminating_control: >
        Unchanged from NC-4 and still unrun: add a per-table-access cost of
        2^beta F_{p^2}-ops with beta in {0, 5, 10} to the existing
        cost_model.py of EXP-WESOVOW-001 and recompute the w grid, with beta
        tied to w by a declared staircase rather than held constant. Hours of
        work, no new mathematics. Calibrate beta from the measured scaling in
        the paper's own references [3] and [16] (bibliographic subtask, still
        not done in this programme).

    - id: RT2-C7
      rank: 7
      severity: medium
      target: >
        The comparison itself: attack overhead is charged in measured
        F_{p^2}-multiplications while T_DG = 2^{log2p/2} is charged at one
        F_{p^2}-operation per step with no constant.
      claim_challenged: >
        That subtracting a measured per-entry overhead from a nominal baseline
        yields a margin.
      body: >
        THIS OBJECTION FAVOURS THE ATTACK AND I RAISE IT BECAUSE MY MANDATE
        REQUIRES BOTH DIRECTIONS. The whole NC-2 programme replaces the
        attack's idealised one-operation-per-entry convention with a measured
        cost, while leaving the Delfs-Galbraith baseline at the identical
        idealised convention it was always quoted under. A DG step is an
        isogeny walk step plus a subfield test, which is many F_{p^2}
        operations, not one. Charging realism to one side of a comparison and
        not the other is a biased protocol regardless of which side benefits,
        and here it is systematically anti-attack: it inflates every overhead
        bit in the tables above.
        BOUNDING IT HONESTLY: a DG step is plausibly 2^5 to 2^7 F_{p^2}-ops, so
        symmetric realism would return 5-7 bits to the attack's margin, against
        the 25.4 bits the corrected law charges it. The asymmetry is real and
        it is NOT large enough to overturn any sign conclusion here - but it is
        the same order as the entire irreproducibility band, so it must be
        carried explicitly rather than left as an unstated convention. I
        deliberately do NOT apply this correction to any margin number in this
        report, because I have no measurement of it; it is recorded as a
        one-sided bias of known sign and unmeasured magnitude.
      cheapest_discriminating_control: >
        Symmetric instrumentation. Point the SAME counting harness at a
        Delfs-Galbraith step: one 2-isogeny walk step plus one subfield test at
        the same p ~ 2^40, counting F_{p^2}-multiplications by the identical
        instrument. The walk machinery already exists in per_entry_cost.py
        (walk_pool) and its counters are already reset and discarded - the
        measurement is nearly free and was thrown away by this run. Report the
        margin as a difference of two MEASURED per-step costs, never as
        measured-minus-nominal.

    - id: RT2-C8
      rank: 8
      severity: low
      target: >
        Completion-gate status; assumption L2 and the secondary kappa.
      claim_challenged: >
        Housekeeping items that do not change a headline but must not be lost.
      body: >
        (a) THE CORE GRID WAS NOT DELIVERED. ell = 97 was dropped by a fetch
        obstruction on phi_j_97.txt (curl 35, connection reset), so 25 of 26
        required core ell were measured and core_grid_complete = false. The
        contract's success_criterion requires the full 26 at 8 samples. 1/26 =
        3.8% is far below the 25% INCOMPLETE threshold, and the executor
        recorded the gate as NOT MET explicitly and substituted no value, which
        is the correct handling. Per AGENTS.md rule 5 this is an infrastructure
        outcome and not mathematical evidence. It is recorded here only so that
        no downstream record describes this run as having met its completion
        gate, because it did not.
        (b) kappa RESTS ON TWO PRIMES. secondary_L2_kappa is computed from
        exhaustive builds at B = 2 and B = 3 only; at B = 2 kappa = 1 is forced
        by there being a single prime, and the entire non-trivial content is
        two rows at B = 3 (kappa 0.9235, 0.9215). Transferring that 12 octaves
        to B_opt ~ 2^14.2 is a scale transfer with n = 1 informative point. The
        run labels it SECONDARY and declares the transfer untested, which is
        adequate. My own analytic estimate under an equal-entries-per-prime
        model puts the correction at about -1 bit (entry-weighted mean of
        ell^gamma ~ B^gamma/(gamma+1)), i.e. small and attack-favourable; I
        flag it as my derivation under a stated model, not a measurement.
        c_kappa should not be cited as a measured refinement.
      cheapest_discriminating_control: >
        (a) Retry the Phi_97 fetch in a scoped successor; the same URL
        succeeded earlier in the same session, so this is transient. (b) Push
        the exhaustive C-BASE.4-style build to B = 7 and B = 13, which brings
        the number of informative primes from 1 to 5 and costs seconds.

  # ==================================================================
  # WHAT I RETRACT AND WHAT I KEEP FROM MY OWN PRIOR REPORT
  # ==================================================================
  self_correction_of_prior_red_team_positions:
    - prior_id: RT-C1
      disposition: PARTIALLY RETRACTED - arithmetic error identified
      body: >
        RT-C1 step (b) reasoned that "per-entry cost ~ (degree-ell evaluation +
        root-finding)/(ell+1) ... with O(1) >= 2 realistically", and step (c)
        then calibrated 2^{c*sqrt(log2 p)} >= B_opt^2, i.e. gamma = 2. Those
        two steps are inconsistent with each other: step (b) correctly divides
        by ell+1 and step (c) then charges ell^2 PER ENTRY anyway. Lemma 3.3 of
        the frozen paper amortises explicitly over "each batch of (<=) ell + 1
        new entries", and the run's committed samples confirm entries(ell) =
        ell + 1 for ell >= 3 (and ell for ell = 2, the non-backtracking
        convention). Under schoolbook arithmetic the per-BATCH cost is ~ell^2
        and the per-ENTRY cost is ~ell, so the correct naive calibration is
        gamma = 1, which is precisely what the contract pre-registered and what
        the homogeneous IMPL-A series measured (0.9332). RT-C1's gamma = 2 was
        off by exactly one factor of ell.
        RT-C1 additionally quoted the c = 2.0 margin row (2.27 bits) as its
        headline while its own derivation supported only c >= 1.78, whose row
        is 5.87 bits. That overstated the objection by 3.6 bits.
        WHAT SURVIVES, AND IT IS THE LOAD-BEARING HALF: RT-C1's core assertion
        was that c = 0 is not a neutral default and that the omitted per-entry
        work is UNMEASURED rather than small. That is now confirmed and
        strengthened, but through the INTERCEPT (RT2-C1) rather than through
        the exponent. Intercept-corrected, c at NIST-I is 1.42 to 1.59 under
        the linear model and 1.80 under the quadratic - numerically almost
        exactly RT-C1's 1.78-1.88, arrived at for an entirely different and
        better-supported reason. I flag that coincidence explicitly so that
        nobody reads it as confirmation of the original argument. It is not.
    - prior_id: RT-C2
      disposition: NARROWED
      body: >
        See RT2-C6. Table access is not the binding constraint at w = 2^30 with
        256-bit field arithmetic; my prior framing overstated it there. What
        survives is narrower and sharper: the model's free +0.5 bits of margin
        per bit of memory is approximately cancelled by real latency growth
        beyond DRAM, so margins should be quoted at w = 2^30 and the larger-w
        rows should not be read as improvements.
    - prior_id: RT-S1
      disposition: PARTIALLY WEAKENED, NOT WITHDRAWN
      body: >
        See adjudication below. The specific sub-claim that "the NIST-I margin
        is within a few bits of zero under defensible constant-factor
        calibrations" is no longer supported and should be retired. The general
        position - that no scope statement stronger than the paper's own
        abstract hedge is supported - stands, for reasons that are now
        different and narrower than in July.

  # ==================================================================
  # THE ARITHMETIC THE BRIEF ASKED FOR
  # ==================================================================
  nist1_margin_arithmetic:
    method: >
      RT2 recomputation. All inputs are committed constants: log2T_full =
      108.7309 and T_DG = 2^128 and log2 B_opt = 14.2 from
      RUN-WESOVOW-001/raw-result.json per_field."log2p=256"; the fit intercepts
      and slopes from RUN-PEC-6be870-a/raw-result.json fit.windows and
      fit.curvature. margin(w) = 128 - (108.7309 - 0.5*log2(w) + overhead_bits),
      i.e. the committed model's own vOW interpolation with the overhead
      applied as the model applies it.
    rows:
      - scenario: "paper Section 4.1 convention, per_entry = 1"
        overhead_bits: 0.00
        c_equivalent: 0.000
        margin_w2e30_bits: 34.27
        margin_w2e40_bits: 39.27
      - scenario: "PRE-REGISTERED LAW as reported (gamma_W-MID = 0.9739)"
        overhead_bits: 13.83
        c_equivalent: 0.864
        margin_w2e30_bits: 20.44
        margin_w2e40_bits: 25.44
      - scenario: "law + measured intercept (full per_entry at p = 2^40)"
        overhead_bits: 22.75
        c_equivalent: 1.422
        margin_w2e30_bits: 11.52
        margin_w2e40_bits: 16.52
      - scenario: "law + intercept scaled to p = 2^256  [RT2 PREFERRED LINEAR READING]"
        overhead_bits: 25.43
        c_equivalent: 1.589
        margin_w2e30_bits: 8.84
        margin_w2e40_bits: 13.84
      - scenario: "quadratic W-ALL + p-scaled intercept (most pessimistic construction from this data)"
        overhead_bits: 28.87
        c_equivalent: 1.804
        margin_w2e30_bits: 5.40
        margin_w2e40_bits: 10.40
      - scenario: "RT-C1 prior calibration c = 1.78, law-only"
        overhead_bits: 28.40
        c_equivalent: 1.775
        margin_w2e30_bits: 5.87
        margin_w2e40_bits: 10.87
      - scenario: "quasi-linear / batched evaluation, gamma -> 0, p-scaled intercept only"
        overhead_bits: 11.60
        c_equivalent: 0.725
        margin_w2e30_bits: 22.67
        margin_w2e40_bits: 27.67
      - scenario: "old c = 2.0 scenario row (RT-C1 headline, NOT supported by this data)"
        overhead_bits: 32.00
        c_equivalent: 2.000
        margin_w2e30_bits: 2.27
        margin_w2e40_bits: 7.27
    irreproducibility_band:
      nist1_time_deviation_bits: 2.2309
      max_abs_deviation_all_five_fields_time_and_memory_bits: 3.5133
      note: >
        The 3.51-bit figure my prior report used is the MEMORY deviation at
        log2 p = 768, the largest absolute deviation anywhere in the C1 control.
        The tightest correct band for a NIST-I TIME statement is 2.2309 bits.
        Both are quoted; the conclusion below is unchanged under either.
    verdict: >
      DOES THE NIST-I MARGIN CLEAR THE BAND AT THE MEASURED GAMMA? YES, under
      every reading I can construct from the run's own data. The tightest
      reading I am willing to defend - linear fit, intercept restored, p-scaled
      - gives 8.84 bits at w = 2^30, which clears the 3.51-bit band by 5.3 bits
      and the 2.23-bit band by 6.6 bits. The single most pessimistic
      construction available in the data (quadratic on W-ALL, whose curvature I
      have argued in RT2-C2 is itself a composition artifact and which
      therefore OVERSTATES the case against the attack) still gives 5.40 bits
      and still clears both bands. The only scenario that fails to clear is
      c = 2.0, which is the row my own prior report quoted and which the
      homogeneous measurement now excludes: the IMPL-A local slope is flat at
      0.93-0.97 from ell = 17 to ell = 197.
      THE MARGIN'S SIGN IS NOW ROBUST AT NIST-I. ITS MAGNITUDE IS NOT: the
      defensible span is 5.40 to 22.67 bits at w = 2^30, a width of 17.3 bits,
      and that width is set almost entirely by quantities this experiment did
      not measure - the polynomial multiplication routine (RT2-C4, worth up to
      13.25 bits) and the p-scaling (RT2-C3, worth 2.7 bits) - not by anything
      it did measure.

