      observation: >
        Check (ii) "symmetry Phi_ell(X,Y) = Phi_ell(Y,X) coefficientwise" is
        discharged BY CONSTRUCTION (the source lists only m>=n with no
        duplicates, so the symmetric extension is unique), not by an independent
        coefficientwise comparison of two separately-read halves. The run states
        this explicitly rather than reporting a vacuous check. That is the
        honest reading of the source format and I accept it; the Kronecker
        congruence is the check that actually carries the corruption-detection
        weight, and it is real.

