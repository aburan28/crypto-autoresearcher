      I re-executed 11 primary samples of my own choosing and re-verified 1480
      algebraic relations (960 walk-chain edges plus 520 roots) with an
      evaluator I wrote. I did NOT re-execute all 484 primary and 400 null
      samples, and I did NOT re-verify the producer's full 23672-edge C-BASE.4
      relation set with my own evaluator. Those claims are consistent with
      everything I did check and with the archived invariants, but they rest on
      the producer's own recording.
    - >
      I re-ran the fit, both bootstraps and the curvature by reimplementing the
      procedure the raw file documents. That establishes that the recorded
      numbers follow from the recorded data under the recorded procedure. It is
      not an independent statistical model.
    - >
      My supplementary measurements (the null over ell 103..211, and ell = 97)
      were produced by ME in this validation session. They are NOT part of the
      producer receipt, were not archived by the Coordinator, and repair
      neither the completion gate nor C-NULL's coverage. They are reported so
      the Coordinator can weigh the consequence of the two gaps; they must not
      be cited as run evidence.
    - >
      I verified the C-BASE.2 battery with my own code on 7 of 46 ell (chosen to
      span the range) and verified all 46 file hashes; the remaining 39
      batteries rest on the producer's recorded per-ell results, which my seven
      spot-checks corroborate.
    - >
      One live fetch each for ell = 11 and ell = 97 corroborates the provenance
      chain and the transient obstruction; I did not re-fetch the other 44 files.
    - >
      The producer's scratch directory is still present and I used it. Had it
      been cleared, the retrieved-file hash verification would have rested on the
      recorded hashes alone. The contract's storage rule (files outside the
      repository, not committed) means this verification is not durably
      repeatable; only the committed ell <= 13 fixture and the recorded hashes
      are. A future contract may wish to commit reduced-array hashes for every
      ell, which this one already does.
    - >
      reasoning_effort could not be set or verified per task under this harness
      (INFAMEND-20260802-P13-002). The review-adversarial xhigh requirement is
      recorded as UNVERIFIED, not as met.
    - >
      This report validates integrity and arithmetic only. It takes no position
      on what the measured gamma means for H-WESO-001, for the paper's Section
      4.1 assumption, or for RT-C1, and it does not anticipate the Red Team
      (TASK-20260802-96d908) or the adjudication (DEC-20260802-8227b9).

