    - id: C-BASE.4
      producer_verdict: pass (40 of 40 enumerations exact)
      validator_verdict: PASS-VERIFIED
      validator_recomputation: >
        (a) I read the frozen PoC (inputs/P13-PANNY-POC/p-one-third.py, count()
