  # ==================================================================
  # 2. PER-CONTROL VERDICTS (required by the completion gate)
  # ==================================================================
  control_checks:
    - id: C-INSTR
      producer_verdict: pass
      validator_verdict: PASS-VERIFIED
      evidence_actually_present: >
        Per-case evidence recorded for all four sub-checks, not just a label.
        C-INSTR.1 lists expected/counted per d in {0,1,2,5,10,50}
        (1/4/9/36/121/2601, exact). C-INSTR.2 expected 1000, counted 1000.
        C-INSTR.3 records 20 regions, sum_of_region_mults 16281 =
        global_mult_delta 16281 and 272 = 272 for inversions, counter zero at
        every region start. C-INSTR.4 records 100 trials.
      validator_recomputation: >
        Independent of the recorded numbers I verified the instrument's own
        invariant across the whole run: mults_instantiate equals the analytic
        (ell+1)(ell+2) at all 484 primary samples (0 violations); cost equals
        mults_instantiate + mults_rootfind at all 484; counter_isolation_ok is
        true at all 484 primary and all 400 null samples; and the per-worker
