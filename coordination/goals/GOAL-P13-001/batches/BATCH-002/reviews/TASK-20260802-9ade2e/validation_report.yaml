    - id: C-ALT.1
      producer_verdict: pass (30616 roots, 0 failures)
      validator_verdict: PASS-VERIFIED
      validator_recomputation: >
        roots_failing_independent_horner sums to 0 over all 484 samples and
        roots_equal_deg_gcd is true at all 484. Independently, my own bivariate
        evaluator confirmed 520 roots at six ell (see C-BASE.5). The producer's
        independent check uses an uninstrumented Horner path on the
        INSTANTIATED univariate polynomial; mine goes back to the integer
        bivariate coefficients, which is the stronger path.

    - id: C-ALT.2
      producer_verdict: pass (200/200 root-set hashes agree, control COMPLETE)
      validator_verdict: PASS-AS-SPECIFIED, but WEAK as an independence control
      validator_recomputation: >
        Recomputed the comparison from samples_primary: 200 (ell, j) pairs have
        both implementations, and roots_sha256 agrees at all 200 (0 mismatches),
        matching the recorded compared_samples = 200. I additionally re-executed
        four A/B pairs of my own choosing (ell = 3, 19, 53, 101) and obtained
        identical root-set hashes with different multiplication counts, which is
        exactly what the control predicts.
      judgement_on_the_U_3_shared_seed_question: >
        The handoff asks whether seeding Cantor-Zassenhaus on (ell, j_index) but
        not on implementation biases the A/B comparison C-ALT.2 rests on. My
        finding, in two parts.
        (1) It does NOT bias the cost comparison directionally. Both
        implementations draw from the same random stream and, since the number
        and outcome of CZ attempts depends only on the algebra and the drawn
        element, they traverse identical split structures. That is a paired
        design: it removes split-structure variance and makes cost_A/cost_B a
        clean estimate of the multiplication-routine effect alone. Nothing
        pushes the ratio up or down.
        (2) It DOES weaken C-ALT.2 as a correctness cross-check, and this is the
        more important half. IMPL-A and IMPL-B share every line of the pipeline
        except the polynomial-multiplication routine (reading R-2: the contract
        names exactly one substitution), AND they share the random stream. A
        defect in instantiate(), poly_rem_monic, poly_gcd, poly_powmod, the
        exponent Q, or the CZ recursion would produce IDENTICAL WRONG root sets
        in both implementations and C-ALT.2 would still report 200/200. The
        control's stated purpose - "so that gamma is a property of the problem
        within the tested range and not of one implementation" - is therefore
        only weakly served: what is actually cross-checked is the multiplication
        routine. The correctness burden falls on C-ALT.1 and C-BASE.5, both of
        which I re-verified against an evaluator built from the integer
        bivariate coefficients, so the burden is discharged - but by those
        controls, not by C-ALT.2.
        (3) A corollary the downstream reader should carry: gamma_A and gamma_B
        are not independent estimates of the exponent. Their difference
        (0.14028) is a clean measurement of the schoolbook-vs-Karatsuba effect
        under a fixed split structure; it is not evidence that two independent
        implementations agree on gamma.
      contract_compliance: >
        Compliant. The contract itself specifies IMPL-B as "the same pipeline
        with KARATSUBA polynomial multiplication" and fixes no CZ seed; the
        Executor recorded the gap as U-3 rather than resolving it silently.

