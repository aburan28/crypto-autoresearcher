    - id: C-BASE.6
      producer_verdict: pass
      validator_verdict: PASS
      validator_check: >
        The required statement is present and arithmetically correct: Section
        4.1 of the frozen paper (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
        line 230) assumes one F_{p^2}-operation per table entry, i.e.
        per_entry = 1 in exactly the unit reported here, which under
        log2 per_entry = gamma*log2(ell) + const is the constant function, so
