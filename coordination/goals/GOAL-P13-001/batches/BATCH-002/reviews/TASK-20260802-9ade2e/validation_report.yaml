        correct classification under stopping_rules.

    - id: F-3
      severity: MEDIUM
      title: "Half of the fitted range is not null-controlled by the receipt (inventor-protocol section 3)."
      detail: >
        See the C-NULL entry above for the numbers. 21 of 46 W-ALL points, 21 of
        42 W-MID points and 8 of 8 W-TOP points lie outside C-NULL's ell 2..101
        coverage, and the reported interval's upper endpoint comes from the
        window that is 100% outside it. Under "controls before belief" the
        portion of the signal over ell 103..211 is, on the receipt alone,
        uncontrolled.
      mitigating_measurements: >
        (a) My own supplementary null over 103..211 gives gamma_null = +0.0039
        (and +0.0383 on the top-8), with the full-range null spanning only 0.202
        bits from ell = 2 to ell = 211 - no manufactured ell-dependence is
        detectable there. (b) W-TOP is not load-bearing: dropping it entirely
        moves the union interval only from [0.86914, 0.97831] to
        [0.86914, 0.97781].
      residual_concern: >
        (a) is my measurement, not the producer's, and cannot be folded into the
        receipt. The receipt's own C-NULL still covers 2..101 only, and half of
        the PRIMARY window W-MID sits outside it. A superseding contract should
        either place the null after the extension or re-run it over the achieved
        grid.
      attribution: "The frozen execution_order caused this; the Executor recorded it as AN-5 rather than improvising a post-hoc null."

    - id: F-4
      severity: LOW-MEDIUM
      title: "C-ALT.2 is a weak independence control: shared pipeline plus shared Cantor-Zassenhaus stream."
      detail: "Full analysis in the C-ALT.2 control entry above (the U-3 judgement)."
      summary: >
        No directional bias to the A/B cost ratio - the shared seed is a
        variance-reducing paired design and is arguably the cleanest way to
        isolate the multiplication routine. But the root-set identity check
        exercises only the multiplication routine, since every other line of
        code and the entire random stream are shared, so a defect in the shared
        pipeline would pass C-ALT.2 unnoticed. gamma_A and gamma_B are not
        independent estimates. The correctness burden is carried by C-ALT.1 and
        C-BASE.5, which I independently re-verified.

    - id: F-5
      severity: LOW
      title: "Summary-field defect: correction is arithmetically right and the raw file was genuinely not edited."
      detail: >
        Confirmed the raw file still carries the defective
        acquisition_phase_total_bytes = 28564879 and acquisition_phase_seconds =
        20.41 (so no in-place repair occurred - correct under AGENTS.md rule 4).
        The manifest's correction checks out: summing byte_length over the 46
        status:ok fetch records gives EXACTLY 646284683, and summing
        fetch_seconds over ALL 54 fetch attempts - the 46 successes (37.837 s)
        plus the 8 obstructions (13.998 s) - gives EXACTLY 51.835 s. Caps
        conclusions hold: 646284683 < 2147483648 bytes; 51.835 < 900 s; largest
        single file 66663416 < 67108864; largest per-ell fetch 9.512 < 120 s.
      minor_imprecision: >
        The manifest phrases 51.835 s as fetch time "over 46 retrieved files"
        when it is in fact the total over all 54 attempts; the figure is the
        conservative one and the conclusion is unchanged.
      secondary_inconsistency: >
        execution_report.yaml's `artifacts_not_committed` block still states
        "28564879 bytes over 46 ell", contradicting AN-6 in the same file, which
        carries the correction. Worth superseding for tidiness; changes nothing.

    - id: F-6
      severity: LOW
      title: "Provenance record duplication can mislead a naive cap audit."
      detail: >
        modular_polynomial_provenance.per_ell already holds all 54 fetch records
        (26 core attempts + 28 extension attempts), and extension.fetch_records
        repeats 28 of them byte-identically. Summing both lists double-counts to
        1264004487 bytes. Not an error, but an auditor must use per_ell alone.

    - id: F-7
      severity: LOW
      title: "W-TOP's bootstrap used 1991 of the contracted 2000 replicates, and the cluster bootstrap is non-standard on the extension ell."
      detail: >
        Mechanically explained and honestly recorded in the field itself. The
        extension ell hold only j-indices 0..3, so a replicate whose 8 joint
        draws all land in {4..7} - probability (1/2)^8 = 1/256, expectation 7.8
        of 2000 - leaves every extension ell with no data and W-TOP (which is
        entirely extension) with fewer than 3 points, so it is skipped. 1991 is
        consistent with that. More generally, for extension ell the "cluster
        bootstrap over the j-pool" degenerates into resampling a Binomial(8, 1/2)
        number of draws from 4 clusters, which is not the paired 8-cluster
        design the contract describes. The effect on the CIs is small (my
        four-seed re-runs move the endpoints by at most 0.0013) but the
        procedure is not exactly what the contract specifies for those ell.

    - id: F-8
      severity: LOW
      title: "The manifest's inference block does not name a concrete resolved model identifier."
      detail: >
        The contract's required_artifacts.manifest_schema.inference_block_must_record
        lists "resolved model identifier". The manifest records a prose
        description with resolved_model_identifier_exposed_to_this_agent: false
        and model_verified: false. That is the honest course under
        INFAMEND-20260802-P13-002 (an unexposed identifier must not be invented,
        AGENTS.md rule 9) but leaves the literal requirement unmet. The
        Coordinator's own snapshot receipt does name "claude-opus-5", so the
        identifier is nameable at the dispatching layer; a future contract
        should place that obligation there rather than on the Executor.

    - id: F-9
      severity: INFORMATIONAL
      title: "Post-run verification claim is substantively true but imprecisely worded."
      detail: >
        The execution report states "tools/validate_ledger.py check_run on this
        manifest returns 0 errors". There is no `check_run` CLI subcommand; it
        is an internal function. I ran the full validator: no error whose path
        mentions EXP-PEC-6be870 or RUN-PEC-6be870-a. Claim holds in substance.

  # ==================================================================
  # 6. ADJUDICATION OF THE EXECUTOR'S SELF-REPORTED ITEMS
  # ==================================================================
  executor_self_reports_adjudicated:
    - item: "Completion gate UNMET, 25 of 26 ell, ell=97 lost to curl 35; earlier copy NOT used to patch."
      validator_finding: >
        CONFIRMED AND INDEPENDENTLY CORROBORATED. ell = 97 is absent from every
        data structure and from the producer's scratch directory. I re-fetched
        the URL and obtained precisely the byte length and SHA-256 the Executor
        recorded for the earlier copy, which both authenticates that record and
        confirms the obstruction was transient. My own supplementary measurement
        of ell = 97 shows its omission moves W-MID by 0.0013, so the gap is
        immaterial to the numbers while the gate correctly remains UNMET.
      weight: "Correctly characterised by the Executor. No overstatement, no understatement."
    - item: "Curvature CI [0.0453, 0.0625] excludes zero, so the single-exponent model is MISSPECIFIED; gamma_local_top = 1.1706."
      validator_finding: >
        CONFIRMED, WITH A MATERIAL QUALIFICATION. The curvature and its CI
        reproduce exactly and the misspecification verdict survives on a
        homogeneous IMPL-A response (CI [0.0194, 0.0366]), so misspecification
        is REAL. But roughly half the curvature magnitude, and the whole gap
        between gamma_local_top = 1.0187 (homogeneous) and 1.1706 (as reported),
        is produced by the F-1 definitional step rather than by the cost law.
      is_the_reported_interval_still_admissible: >
        YES, formally, and the run is contract-compliant here. The contract's
        admissibility_of_the_fit conditions do not include "not misspecified",
        all four are met, and curvature_diagnostic.rule prescribes exactly what
        the run did - declare MISSPECIFIED, report the local slope at the top,
        and carry gamma_local_top through the extrapolation as a declared
        sensitivity - which appears in every extrapolation row as
        c_at_gamma_local_top_sensitivity.
      but_the_device_failed_its_stated_purpose: >
        The contract adopted the across-window union interval expressly because
        "with a near-deterministic counter the sampling CI understates the real
        uncertainty, which is model misspecification, and reporting the narrow
        interval alone would be fake precision". The union it produced,
        [0.8691, 0.9783] with half-width 0.0546, does NOT contain the
        misspecification the same contract detected: gamma_local_top = 1.1706
        sits 3.5 reported half-widths above the interval's top. The mechanism
        installed to absorb misspecification demonstrably did not absorb it.
        The interval is admissible; quoting it ALONE would be exactly the fake
        precision the contract set out to avoid. Any downstream use must carry
        gamma_local_top beside it - and must note that gamma_local_top is itself
        inflated by F-1.
    - item: "C-NULL covers ell 2..101, so ell 103..211 enter the fits un-null-controlled."
      validator_finding: >
        CONFIRMED, and quantified further than the Executor did: not just the
        extension but HALF OF THE PRIMARY WINDOW (21 of 42 W-MID points) and ALL
        of W-TOP lie outside null coverage. See F-3.
      does_w_top_sit_entirely_in_the_uncontrolled_region: >
        YES - W-TOP is ell 173..211, every point of it extension, IMPL-A only,
        4 j-samples each, none null-controlled. And it formally sets the upper
        endpoint of gamma_reported.
      does_that_matter_numerically: >
        Barely. W-TOP's bootstrap high (0.97831) exceeds W-MID's (0.97781) by
        0.0005; dropping W-TOP entirely would leave [0.86914, 0.97781]. So the
        interval is not hostage to the uncontrolled window. What DOES matter is
        that half of W-MID - the pre-registered primary window - is also
        uncontrolled on the receipt, and that W-TOP's spectacular R^2 of 0.99947
        with max residual 0.0032 bits is a property of a homogeneous IMPL-A
        sub-series, not evidence that the mixed-response model fits well.
      my_supplementary_null: "gamma_null = +0.0039 over 103..211; see F-3. Validator-side, does not repair the receipt."
    - item: "Summary-field defect in raw-result.json corrected in the manifest, not by editing the immutable raw result."
      validator_finding: >
        CONFIRMED ON BOTH COUNTS. The correction is arithmetically exact
        (646284683 = sum of ok byte_lengths; 51.835 = sum of all 54 fetch
        durations) and the defective values are still present in the raw file,
        proving no in-place edit. Two cosmetic residues noted in F-5.
    - item: "U-1..U-4; U-3 seeds Cantor-Zassenhaus on (ell, j_index) but not on implementation."
      validator_finding: >
        The four declared underspecifications are correctly identified and
        correctly resolved (superset for U-1, invariance for U-2, deterministic
        recorded seeding for U-3, contract text for U-4). On the specific U-3
        question: the choice does NOT bias the A/B cost comparison directionally
        - it is a paired design that isolates the multiplication routine - but
        it DOES reduce C-ALT.2 to a test of that routine alone, because the
        pipeline and the random stream are otherwise shared, and it makes
        gamma_A and gamma_B non-independent. See F-4.
      but: >
        The underspecification audit MISSED the one that actually moved a
        number: the interaction of fit_protocol.response,
        C-ALT.carry_forward_rule and execution_order step 8 (F-1). That is a
        gap in the Executor's own audit, not merely in the contract.

  # ==================================================================
  # 7. CONTRACT-COMPLIANCE CHECKS (deviations in either direction)
  # ==================================================================
  contract_compliance:
    conforming:
      - "Instance: p = largest prime < 2^40 with p = 3 mod 4, independently re-derived; F_{p^2} = F_p[T]/(T^2+1); field_bits 80; seed curve y^2 = x^3 + x, j = 1728."
      - "Sampling: n_walk = 120 = 3*ceil(log2 p); pool size 8; the eight contract walk_seeds verbatim; a single shared pool used at every ell (paired design); 8 distinct pool members, none in {0, 1728}, no degenerate exclusions needed."
      - "Counting conventions: squaring counts 1; additions not counted; inversions in a separate register with the ×3 sensitivity reported; instantiation routed through the instrumented path with no zero-skipping, so the count is the honest upper bound (ell+1)(ell+2)."
      - "entries convention (roots minus 1 iff ell = 2) applied at all 484 samples."
      - "ell grid: core 25 of 26 (97 obstructed), extension executed ascending to 211 at 4 samples, 7 further extension ell dropped by the per-ell byte cap."
      - "Modular-polynomial provenance rule: primary-source route, per ell URL / UTC timestamp / byte length / SHA-256 / coefficient count / reduced-array SHA-256 all recorded; files stored outside the repository and not committed; ell <= 13 reduced arrays committed as the offline fixture (6 ell present); no coefficient hardcoded."
      - "Execution order steps 1-9 followed, with C-BASE.3 and C-ALT.1 correctly evaluated twice (PD-4) because the contract places them before IMPL-B and the extension exist."
      - "Fit protocol: OLS unweighted, log2-log2, the three contract windows, W-MID primary, cluster bootstrap 2000 replicates seed 20260802, jackknife leave-one-ell-out, union interval, curvature diagnostic and its consequence, all four admissibility conditions evaluated."
      - "Extrapolation: the frozen law applied mechanically at the low / point / high ends plus the gamma_local_top sensitivity, with log2(B_opt) quoted as a labelled input constant and sqrt(log2 p) recomputed; L1-L4 restated beside the numbers; the whole block labelled EXTRAPOLATION, NOT A MEASUREMENT with no claim tier."
      - "Non-claims: all eleven contract non-claims restated in the receipt; claim tier medium derived mechanically from field_bits = 80."
      - "Budgets and stopping rules respected; maximum_runs 1 honoured; PD-1 correctly classified as a failed command invocation and not a run."
    deviations_or_gaps_found:
      - id: D-1
        what: "Heterogeneous primary response across ell = 101/103 (F-1)."
        direction: "Inflates gamma and c, i.e. AGAINST the paper's assumption and TOWARD RT-C1."
        origin: "Contract-internal inconsistency, executed literally. Not an Executor deviation."
      - id: D-2
        what: "C-NULL covers only 25 of the 46 fitted ell (F-3)."
        direction: "Leaves half the primary window uncontrolled on the receipt; my supplementary null finds no artifact there."
        origin: "The contract's own execution_order."
      - id: D-3
        what: "W-TOP bootstrap ran 1991 of the contracted 2000 replicates, and the cluster bootstrap degenerates on extension ell (F-7)."
        direction: "Negligible; effect on CI endpoints under 0.0013 in my seed sweep."
        origin: "Interaction of the 8-cluster resample with 4-sample extension ell."
      - id: D-4
        what: "Resolved model identifier not named in the manifest's inference block (F-8)."
        direction: "None on any measured quantity."
        origin: "Harness limitation recorded under INFAMEND-20260802-P13-002."
    no_deviation_found_on:
      - "Any seed, any counting convention, any window definition, any threshold, any estimator, or any extrapolation constant."
      - "Any evidence of tuning: nothing in the archive suggests a parameter was chosen after seeing a result, and the contract is provably unchanged since it was frozen at 0e773e9a."

  # ==================================================================
  # 8. INVENTOR-PROTOCOL AND COST-MODEL CHECKS
  # ==================================================================
  inventor_protocol_checks:
    section_3_controls_before_belief:
      null_object_present: true
      null_object_same_shape: >
        Yes: a table of ell+1 entries over the same j-pool, built with the same
        instantiate/root-find primitives and counted by the same instrument,
        whose per-entry cost is O(1) in ell by construction.
      does_the_report_state_what_the_quantity_should_do: >
        Yes. The contract pre-registers the decay statement explicitly - the
        null's per_entry ratio between the smallest and largest ell "must be
        within 2^{+/-0.5} under a genuinely O(1) null" - and the run reports it
        (0.9579). This is the "what should this quantity do as the parameter
        meant to destroy it increases" requirement, satisfied.
      coverage_gap: "See F-3. Half the primary window is outside the null's range on the receipt."
      verdict: "Satisfied over ell 2..101; partially satisfied over 103..211 on the receipt alone."
    section_6_validation_ladder:
      applicability: >
        This run claims NO improvement and NO speedup. It is a control
        measurement of a cost profile plus a declared arithmetic substitution
        into an existing scenario model. The ladder's "step 2 absent while a
        speedup is claimed is a failed, not an incomplete" rule therefore does
        NOT fire here: there is no speedup claim to convert.
      step_1_isolate_and_measure_each_assumption: >
        PARTIAL AND CORRECTLY LABELLED. The extrapolation rests on L1-L4; the
        run measures none of them and says so: L1 UNTESTED (about 6.5 octaves in
        log2 ell beyond the top of the measured range at NIST-I, and the range
        never reaches ell >> log2(p^2) = 80 at all), L2 DECLARED NOT MEASURED
        (with the optional kappa secondary computed only at B in {2,3}), L3
        INHERITED UNCERTAINTY (+/-3.51 bits from RUN-WESOVOW-001), L4 NOT
        IMPLEMENTED (batched Sutherland-type evaluation). Each names its
        direction. This is the honest form of the step, not a discharge of it.
      step_2_scaled_down_pipeline_with_a_measured_ratio: >
        NOT APPLICABLE in the speedup sense, and NOT SKIPPED in the measurement
        sense: the quantity of interest is measured directly rather than
        projected, over 46 ell at 8 or 4 samples each, with the extrapolation
        to ell ~ B_opt labelled an extrapolation throughout. The identifiability
        limit - distinct cost laws agreeing over ell <= 211 and diverging at
        ell ~ 2^14 - is recorded as a standing non-claim.
      step_3_real_object_with_named_cheats: >
        SATISFIED IN THE ANALOGUE. Every excluded cost is named individually
        with its direction: Phi_ell storage and I/O (attack-favourable, and
        RT-C1 notes it is terabyte-scale at ell ~ 2^14), coefficient reduction
        (attack-favourable), hashing and table access (attack-favourable),
        j-pool generation (neutral), controls' own cost (neutral). The two
        directions (unoptimised implementation => upper bound; excluded costs
        => lower bound) are reported separately and explicitly NOT netted.
      step_4_reproducibility_pointer_exercised: >
        SATISFIED, and I exercised it rather than accepting it: artifacts
        rebuilt from scratch (re-fetch, re-parse, re-hash, re-measure, re-fit,
        re-bootstrap) and listed above, not asserted.
    section_8_proof_architecture:
      applicable: false
      reason: >
        The contract's section_8_determination sets proof_search_map_required:
        false because the experiment proposes no theorem, bound, certificate
        family, reduction or closure argument, and addresses the four audits
        inline instead of omitting them. I concur: this is a bounded empirical
        measurement plus an arithmetic substitution. The inline dispositions are
        accurate - in particular the observation_collision audit is correctly
        recorded as APPLICABLE AND NOT CLOSED, with the batched-evaluation route
        named as the concrete collision candidate.

  heuristic_validation_checks:
    - check: "Pre-registered prediction"
      result: PASS
      detail: >
        gamma = 1 with acceptance band [0.75, 1.25] and the confirmed/refuted/
        indiscriminate verdict rules were committed at 0e773e9a, which I proved
        is an ancestor of the snapshot and whose specification.yaml is byte-
        unchanged since. W-MID was declared primary before any datum, with the
        reason stated in advance. This is genuine pre-registration, not a fit
        after the fact.
    - check: "Sample integrity"
      result: PASS
      detail: >
        Sample size (8 core / 4 extension), all nine seeds, and the sampling
        procedure are in the manifest; the derived random streams are named
        string-by-string. Every per-ell statistic and every fit was recomputed
        by me from the raw per-sample records rather than copied.
    - check: "Correspondence validity"
      result: NOT APPLICABLE
      detail: >
        No substitute-sampling correspondence is used; scale_relevance.
        correspondence is null. The j-pool is sampled directly by 2-isogeny
        walks from a supersingular seed curve whose supersingularity is
        separately controlled (C-BASE.1), and the resulting chains are verified
        relation-by-relation (C-BASE.5, which I re-verified for all 960 edges).
    - check: "Scale binding"
      result: PASS
      detail: >
        p ~ 2^40, an 80-bit F_{p^2}, tier medium by the mechanical rule. Toy
        scale is recorded as a limitation in the contract's non_claims, the
        manifest's scope_and_non_claims and the execution report's
        non_claims_restated, never as scale-matched evidence. AGENTS.md rule 7
        is respected throughout.

  cost_model_checks:
    - check: "Cost-unit honesty"
      result: PASS-WITH-AN-OBSERVATION
      detail: >
        The unit is declared and is the paper's own unit (one F_{p^2}
        multiplication), which is what makes the comparison to Section 4.1
        meaningful at all. Optimistic and attack-favourable conventions are each
        flagged with direction. The inversion register is separate with a
        declared ×3 sensitivity.
      memory_observation: >
        Memory IS reported for the measurement harness (peak RSS 0.1544 GiB of
        an 8 GB budget), but there is NO memory column for the attack itself:
        Phi_ell storage and I/O are excluded by the contract, and RT-C1 point (a)
        observes that component is terabyte-scale at ell ~ 2^14. The exclusion
        and its direction are declared, and the run states plainly that gamma is
        therefore simultaneously a LOWER bound with respect to those components.
        Downstream cost tables must not present these figures as a
        time-and-memory cost model; they are a time-analogue only.
    - check: "Cost bookkeeping (per-attempt cost x inverse success probability)"
      result: NOT APPLICABLE
      detail: >
        No success probability enters this measurement: per_entry is a
        deterministic per-entry cost, and c is a multiplier substituted into
        EXP-WESOVOW-001's already-published scenario grid. The run labels the
        substitution as a model substitution carrying no tier, which is the
        correct bookkeeping for what it is.
    - check: "Extrapolation labelled and bounded"
      result: PASS
      detail: >
        Every c value is presented as an interval across the gamma endpoints
        plus the gamma_local_top sensitivity, with L1-L4 restated adjacent to
        the table, and with the L3 +/-3.51-bit inherited irreproducibility band
        attached. No margin is asserted.

  # ==================================================================
  # 9. LIMITATIONS OF THIS VALIDATION
  # ==================================================================
  limitations:
