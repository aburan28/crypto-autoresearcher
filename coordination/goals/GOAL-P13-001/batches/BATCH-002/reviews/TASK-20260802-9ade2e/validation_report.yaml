        costs over the 884 primary+null samples exactly.
      observation: >
        C-INSTR.4 passes with multiplication_register_delta_per_inversion = 0,
        because fp2_inv deliberately performs zero calls to the instrumented
        primitive (reading R-1). That is the only way the contract's "separate
        register, not in the primary unit" clause and C-INSTR.4's "exactly the
        number of multiplications it performs through the instrumented
        primitive" clause can both hold exactly. The consequence is that
        C-INSTR.4 verifies the inversion is NOT routed through the primitive,
        rather than verifying that its internal multiplications are counted.
        The direction is declared attack-favourable and the contract's ×3
        sensitivity is reported: gamma moves from 0.9331912935 to 0.9329491309
        (IMPL-A, W-MID), i.e. -0.00024. Disclosed, immaterial.

    - id: C-NULL
      producer_verdict: pass
      validator_verdict: PASS-WITHIN-ITS-EXECUTED-SCOPE (ell 2..101); PARTIAL COVERAGE of the fitted range
      is_the_null_object_genuinely_O1_per_entry: true
      how_established: >
        Read from source, not taken on trust: measure_null builds a table of
        ell+1 entries by ell+1 successive non-backtracking 2-isogeny steps, each
        step instantiating Phi_2 and root-finding a fixed degree-3 polynomial,
        with the SAME instantiate() and distinct_roots() and the SAME
        region_begin/region_end counters as the primary. Empirically the mean
        cost per 2-isogeny step is 4543-5192 counted multiplications across ell
        2..101 with no trend, and distinct_roots_per_step is exactly 3 at every
        one of the 400 null samples. Per-entry cost is therefore O(1) in ell by
        construction AND observably flat.
      identical_harness_and_denominator: >
        Harness identical. Denominator: null uses entries = ell+1 (the
        contract's own construction wording); primary uses
        n_distinct_roots - (1 if ell==2 else 0), which equals ell+1 for every
        ell>2 and equals 2 at ell=2. So the two conventions coincide everywhere
        except ell=2, where the primary denominator is 2 and the null's is 3.
        The run records both null denominators (entries_alt_denominator per
        sample) and reading R-3/U-2 states the verdict is invariant. I confirm
        the mismatch is confined to ell=2 and changes no exponent.
      validator_recomputation: >
        Recomputed from samples_null with my own median and OLS code:
        per-ell null values reproduce at all 25 ell (0 mismatches);
        gamma_null(W-MID) = -0.0132415223 and gamma_null(W-ALL) = +0.0031860008,
        both identical to the recorded values. Re-ran the recorded bootstrap
        procedure (seed "null|20260802", 2000 replicates, cluster over the
        j-pool) in my own implementation: CI = [-0.0334910411, +0.0080341372],
        matching the recorded [-0.03349104106813048, 0.00803413720034009] to
        1e-17. Re-ran under three other seeds: [-0.0341,+0.0073],
        [-0.0343,+0.0071], [-0.0334,+0.0076] - stable, all containing 0.
        Pass criterion |gamma_null| <= 0.15 and CI contains 0: both hold.
        Flatness: recorded endpoint ratio 0.95786 is inside 2^{+/-0.5}; across
        the whole executed null grid max/min is 1.1506, i.e. 0.202 bits.
      coverage_limitation_measured_by_the_validator: >
        C-NULL covers ell 2..101. Of the fitted windows: 21 of 46 W-ALL points
        (46%), 21 of 42 W-MID points (50%), and 8 of 8 W-TOP points (100%) lie
        OUTSIDE that coverage. On the receipt alone, the signal over
        ell 103..211 - which is where the reported interval's upper endpoint
        comes from - is uncontrolled in the sense of
        docs/inventor-protocol.md section 3.
      validator_supplementary_measurement:
        status: >
          VALIDATOR-SIDE SUPPLEMENTARY, NOT PART OF THE PRODUCER RECEIPT. It
          does not repair the receipt and does not convert C-NULL into
          full-range coverage.
        what: >
          I ran measure_null myself over the 21 extension ell 103..211, 4 j each
          (matching the extension's own sampling), same pool, same harness.
        result: >
          gamma_null over 103..211 = +0.0039; over the top-8 (173..211) =
          +0.0383; combined full-range null W-ALL = +0.0032, W-MID = -0.0037;
          null per_entry spans 4505.5 to 5184.0 over the whole 2..211 range
          (0.202 bits), with 4913.0 at ell=211 against 5118.8 at ell=2.
        reading: >
          No manufactured ell-dependence is detectable in the un-null-controlled
          region. This weakens the practical force of the coverage gap
          substantially. It remains a gap in the receipt.
      numerical_consequence_for_the_reported_interval: >
        Small. The union interval is [0.86914, 0.97831]; the W-TOP high end
        (0.97831) and the W-MID high end (0.97781) differ by 0.0005, so dropping
        the entirely-un-null-controlled W-TOP window would give
        [0.86914, 0.97781]. W-TOP is therefore NOT load-bearing for the interval,
        even though it formally sets its upper endpoint. Half of W-MID is
        un-null-controlled too, which is the sharper statement.
      attribution: >
        Caused by the frozen contract's own execution_order (C-NULL at step 5,
        optional extension at step 8), not by an Executor choice. I confirm the
        stdout timeline: extension acquisition and measurement run at
        t=+353s..+391s, after C-NULL completed. The contract's C-NULL void
        clause covers "cannot be run at all" and is silent on a null that covers
        only part of the eventual grid; that is a contract gap.

    - id: C-BASE.1
      producer_verdict: pass
      validator_verdict: PASS-VERIFIED
      validator_recomputation: >
        Recomputed independently: p = 1099511627563 is prime under my own
        Miller-Rabin on the first 20 prime bases; p mod 4 = 3; p < 2^40; and my
        own descending search confirms it is the LARGEST prime below 2^40
        congruent to 3 mod 4. My own search also confirms previous_prime(2^40) =
        1099511627689, so the recorded non-coincidence with the frozen PoC's
        prime is correct. j(E_0) = 1728 by definition of y^2 = x^3 + x. I
        re-implemented affine EC arithmetic over F_p and verified that all three
        recorded random points lie on E_0 and satisfy (p+1)*P = O.

    - id: C-BASE.2
      producer_verdict: pass (46/46)
      validator_verdict: PASS-VERIFIED
      validator_recomputation: >
        (a) All 46 retrieved files still exist in the producer scratch; I
        recomputed SHA-256 and byte length for every one and all 46 match the
        recorded values exactly (0 mismatches, 0 missing). (b) I re-ran the
        whole battery with MY OWN parser and MY OWN canonical-hash construction
        on ell in {2,3,5,11,13,101,211}: bidegree ell+1 holds; the source lists
        no term with m<n and no duplicate (m,n); the Kronecker congruence
        Phi_ell(X,Y) = (X^ell - Y)(X - Y^ell) mod ell has 0 coefficientwise
        violations at every one; coefficient counts match; and my independently
        constructed reduced_array_sha256 matches the recorded value at all seven.
        (c) LIVE PROVENANCE CHECK: I re-fetched
        https://math.mit.edu/~drew/modpolys/jfiles/phi_j_11.txt myself. HTTP 200,
        6188 bytes, SHA-256 985c6a76ca7cc2802ba3f9fd48112fe0d82ffe11dbaa5f49c57526658338b352
        - byte-for-byte the recorded byte_length and sha256 for ell=11. The
        URL -> bytes -> hash -> local file -> reduced array chain is verified
