    - id: C-BASE.5
      producer_verdict: pass (23772 relations, 0 nonvanishing)
      validator_verdict: PASS-VERIFIED (on the portion I re-derived)
      validator_recomputation: >
        I wrote my own bivariate evaluator - a dense symmetric coefficient
