  # ==================================================================
  # 5. FINDINGS, RANKED BY SEVERITY
  # ==================================================================
  findings:
    - id: F-1
      severity: HIGH
      title: >
        The primary response variable changes definition inside the fitted
        range, inflating the headline gamma above BOTH implementations'
        exponents and roughly doubling the curvature.
      what_i_found: >
        The contract's C-ALT carry_forward_rule makes the primary per_entry(ell)
        the MINIMUM over implementations "where both implementations have data".
        IMPL-B has data only on the surviving core grid (ell <= 101); the
        optional extension is IMPL-A only by the contract's own execution_order
        step 8. IMPL-B is cheaper everywhere it exists (cost_A/cost_B = 1.2954 at
        ell = 101). The fitted response is therefore log2(median IMPL-B) for
        ell in 11..101 and log2(median IMPL-A) for ell in 103..211, with a
        DEFINITIONAL STEP of +0.3731 bits between ell = 101 and ell = 103 -
        located at log2(ell) = 6.686 in a regressor range of 1.000 to 7.721,
        i.e. near the right end, where a positive step maximally inflates a
        fitted slope.
      quantitative_consequences_measured_by_me:
        - "W-MID gamma as reported (mixed response): 0.9739"
        - "IMPL-A alone over the same 42 ell (11..211): 0.9332, R^2 0.99976, max|resid| 0.0597"
        - "IMPL-A alone over 11..101: 0.9179 ; IMPL-A alone over 103..211: 0.9588"
        - "IMPL-B alone over 11..101: 0.7929, R^2 0.99873"
        - >
          The reported exponent EXCEEDS the exponent of either implementation on
          any comparable homogeneous window. A pointwise minimum of two power
          laws cannot have a larger exponent than both; the excess (+0.041 over
          IMPL-A) is the definitional step, not a cost law.
        - >
          Fit quality is materially WORSE for the mixed response than for the
          homogeneous one on the same window: R^2 0.9837 vs 0.99976 and
          max|residual| 0.2915 bits vs 0.0597 bits. The largest W-MID residuals
          sit exactly at the seam (-0.278 at ell=101, +0.091 at ell=103).
        - >
          Curvature: c = 0.0488 with CI [0.0453, 0.0625] on the mixed response
          vs c = 0.0225 with CI [0.0194, 0.0366] on an IMPL-A-only response
          (my own bootstrap, same procedure and seed). gamma_local_top 1.1706
          vs 1.0187.
        - >
          Direction: the artifact INFLATES gamma and therefore inflates c. At
          NIST-I, c_point = 0.8644 as reported vs 0.8283 on the IMPL-A-only
          W-MID exponent. The bias runs toward RT-C1's position, i.e. AGAINST
          the paper's Section 4.1 assumption - it is not a favourable-rounding
          artifact and must not be read as one.
        - >
          The j-subset change at the same seam (8 j on the core, the first 4 on
          the extension) is a separate heterogeneity but is nearly harmless:
          refitting IMPL-A with j 0..3 everywhere moves W-MID by only -0.0016.
          The min-over-implementations step is the dominant term.
      what_survives: >
        The MISSPECIFICATION verdict itself is real, not an artifact: on a fully
        homogeneous IMPL-A response the curvature CI still excludes zero
        ([0.0194, 0.0366]). So the contract correctly detected that a single
        exponent does not describe the range. What is inflated is the MAGNITUDE
        of the curvature and the value of gamma_local_top, and the level of the
        headline gamma. The prediction verdict ("confirmed") and the band
        reading ("linear regime") are robust: every homogeneous exponent I
        computed, 0.7929 through 0.9735, lies inside [0.75, 1.25].
      attribution: >
        This is a defect in the FROZEN CONTRACT, not an Executor deviation.
        fit_protocol.response, C-ALT.carry_forward_rule and execution_order
        step 8 are jointly inconsistent once the optional extension is executed,
        and the contract never resolved the interaction. The Executor followed
        all three literally, recorded the rule verbatim in raw-result.json's
        `response` field, and reported gamma_A and gamma_B separately, so the
        defect is fully visible and fully recomputable from the archive. It is
        NOT one of the four underspecifications the Executor declared (U-1..U-4)
        - the Executor did not surface it - so it also stands as a gap in the
        Executor's own underspecification audit.
      what_must_not_happen: >
        No downstream record may quote gamma = 0.9739, gamma_local_top = 1.1706,
        or c = 0.8644 (NIST-I) without stating that the response is
        heterogeneous across ell = 101/103 and that the homogeneous IMPL-A
        reading is 0.9332 / 1.0187 / 0.8283.
      remedy_not_applied_by_me: >
        A superseding contract should define the response on a single
        implementation (or extend IMPL-B across the whole grid). I did not edit
        any producer artifact and computed the alternatives only in my own
        scratch. Every input needed for the alternative fits is in the archived
        per-sample data.

    - id: F-2
      severity: MEDIUM
      title: "Core-grid completion gate UNMET; ell = 97 verified genuinely absent; consequence measured and found immaterial."
      verification_that_97_is_absent: >
        Checked five independent ways, all negative: no ell = 97 record in
        samples_primary (484 records, ells 2..211 without 97); none in
        samples_null; no per_ell entry under IMPL-A, IMPL-B or the primary map;
        no C-BASE.2 row (that control reports 46 verified files and 97 carries
        status fetch_obstruction with no byte_length, sha256 or local_path); and
        the producer's scratch directory holds exactly 46 phi_j_*.txt files with
        NO phi_j_97.txt among them. The Executor's statement that it did not
        patch the grid with the earlier copy is corroborated, not merely
        asserted.
      independent_corroboration_of_the_transient_obstruction: >
        I fetched https://math.mit.edu/~drew/modpolys/jfiles/phi_j_97.txt myself
        during this validation: HTTP 200, 5651385 bytes, SHA-256
        093fead98fcde6966e652ac2651552f8be050c4433f6d7f341baaf71dc3d16ab -
        EXACTLY the byte length and hash the Executor recorded for the earlier
        session copy. That record is real and not fabricated, the obstruction
        (curl 35, connection reset) was transient, and ell = 97 is recoverable
        by a successor run.
      validator_supplementary_measurement:
        status: "VALIDATOR-SIDE, NOT PART OF THE RECEIPT. It does not close the completion gate."
        what: >
          I ran the frozen protocol at ell = 97 myself (same pool, same seeds,
          same harness, 8 j x 2 implementations), after re-running C-BASE.2 on
          my own copy: bidegree ok, no m<n term, no duplicate, 0 Kronecker
          violations over 4850 terms; all 8 samples returned exactly 98 distinct
          roots.
        result: >
          per_entry(97) medians: IMPL-A 44674.03, IMPL-B 34497.67, primary
          34497.67 - sitting neatly between its neighbours (89 -> 31968.87,
          101 -> 35883.51). Refitting with it included moves W-ALL from 0.894900
          to 0.893510 and W-MID from 0.973920 to 0.972576; W-TOP is unchanged.
