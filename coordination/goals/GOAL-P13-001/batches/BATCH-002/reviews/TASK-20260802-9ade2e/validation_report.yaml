        reading: >
          The missing ell is IMMATERIAL to every reported number. The completion
          gate nevertheless remains UNMET as a matter of record and only a
          Coordinator-authorised successor run can close it. Per AGENTS.md rule
          5 the obstruction is an infrastructure outcome and is not mathematical
          evidence about the attack, which is how the run classifies it.
      contract_thresholds_correctly_applied: >
        1 of 26 core ell dropped = 3.85%, below the contract's 25% invalidation
        threshold; 46 surviving ell far exceeds the 12-ell minimum viable grid,
        which also requires at least one ell <= 3 (2, 3 present) and one
        ell >= 43 (many) at >= 4 samples each (8 core, 4 extension). No
