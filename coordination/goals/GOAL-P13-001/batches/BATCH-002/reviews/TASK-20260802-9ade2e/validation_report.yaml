  # ==================================================================
  # 1. TERMINAL VERDICT
  # ==================================================================
  verdict: VALID-WITH-OBSERVATIONS
  verdict_in_validator_schema_terms: passed
  verdict_rationale: >
    Every declared hash binding re-verifies; the snapshot commit is reachable
    from HEAD with the recorded parent and changes exactly the declared paths;
    the frozen contract is provably older than the first datum and is unchanged
    since its freeze commit; every reported statistic I attempted to recompute
