          seeds_end: IDENTICAL LIST, ELEMENT BY ELEMENT
          start_j_start: ["789041*i + 998959", "772068*i + 47196", "689946*i + 4006", "162195*i + 1006933", "481239*i + 411708"]  # verified literal-by-literal
          start_j_end: IDENTICAL LIST, ELEMENT BY ELEMENT
          jset_sha256_start: fe454ff6da0c5375ae59fea194856e98a438fdc0537a60717971b4ae5aeea3ab
          jset_sha256_end: fe454ff6da0c5375ae59fea194856e98a438fdc0537a60717971b4ae5aeea3ab
