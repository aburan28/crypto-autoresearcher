          prime, all eight within the first ~45 s of a 178.7 s session, while
          the B-FIX-8, B-FIX-32 and V-2 passes run from t ~ 44 s to t ~ 172 s
          with NO interleaved calibration. The normalisation divisor for those
          cells is not contemporaneous with them.
      repetition_counts: "t_mul, t_inv, t_noop each 100000 repetitions per prime in 100 batches of 1000; recorded per prime; well inside the 300 s cap (0.476 s used)."

    - id: CC-9
      control: CTRL-NULL / CTRL-NULL-GATE -- THE NULL-OBJECT CONTROL
      null_objects_are_genuinely_p_independent_by_construction: >-
        VERIFIED BY CONSTRUCTION AND BY MEASUREMENT. NULL-1 is SHA-256 of a
        FIXED 4 KiB buffer, byte-identical at every p; NULL-2 is insertion and
        lookup of 1000 FIXED integer keys in a dict. Neither touches F_{p^2},
        neither reads p. These are the correct null objects for a timing
        measurement: the quantity that MUST NOT scale with the parameter, run
        through the same harness in the same windows.
      validator_fits:
        NULL-1: {slope: 0.00020211928307092231, interval: [-0.003088946540853591, 0.0034931851069954357], excludes_zero: false, overlaps_primary: false}
        NULL-2: {slope: 0.003522503935327432, interval: [-0.04105090175355662, 0.04809590962421148], excludes_zero: false, overlaps_primary: true}
      fires: false
      producer: not fired
      agreement: CONFIRMED
      does_the_quantity_do_what_it_should: >-
        YES, AND THIS IS THE POINT (docs/inventor-protocol.md section 3). Both
        null slopes are indistinguishable from zero: NULL-1's is 0.0002 with an
        interval of half-width 0.0032, i.e. 690x smaller than the primary slope;
        NULL-2's is 0.0035 with half-width 0.045. A quantity that cannot depend
        on p was measured not to depend on p. The harness is not manufacturing a
        p-dependence out of nothing.
      a_third_null_the_run_measured_and_the_contract_did_not_gate: >-
        t_noop (a fixed-length empty interpreter loop, p-independent by
        construction) fits slope -0.00501 with interval [-0.0787, 0.0687] --
        also indistinguishable from zero. Three independent null objects, three
        null results. The negative controls are sound.

    - id: CC-10
      control: CTRL-DRIFT / CTRL-DRIFT-GATE
      validator_ratios:
        - {log2p: 20, start_median_s: 0.00029427083333333334, end_median_s: 0.00029870833333333333, end_over_start: 1.0150796460176992, in_band_0.85_1.18: true}
        - {log2p: 40, start_median_s: 0.00035711116666666665, end_median_s: 0.00036406966666666665, end_over_start: 1.0194855290159415, in_band_0.85_1.18: true}
      fires: false
      producer: not fired, widening applied 0.0 bits
      agreement: CONFIRMED
      ordering: "cell_execution_order is CONFIG-MAJOR / PRIME-MINOR (round-robin across primes), verified from raw-timings.json.schedule_order; wall and CPU time recorded separately for every cell. A monotone host drift cannot masquerade as a monotone p-dependence in this schedule."

    - id: CC-11
      control: CTRL-COUNT / CTRL-COUNT-GATE
      validator_check:
