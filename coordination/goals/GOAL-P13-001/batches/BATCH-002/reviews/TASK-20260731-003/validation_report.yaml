      budgets: "every cap respected: wall 178.7/5400, per-prime max 31.1/600, per-cell max 21.6/120, cal 0.476/300, null 28.4/180, drift+det 3.3/360, fit 3.8/300, RSS 0.427/4 GB. One cap WAS breached: artifact_size_per_file_bytes, first write 10597988 vs 8388608 -- classified INFRASTRUCTURE SIGNAL and fed to no reading, correctly."
