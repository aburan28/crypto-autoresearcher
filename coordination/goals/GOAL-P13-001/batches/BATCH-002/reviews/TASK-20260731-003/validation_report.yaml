  verdict_basis: >-
    Every one of the thirteen receipt digests recomputes from git object content
    at 7c2bd6f7. The contract at 35701d8f is an ancestor of the run commit and
    specification.yaml and derivation_note.md are byte-identical at 35701d8f,
    7c2bd6f7 and HEAD. The entire fit was recomputed from raw-timings.json by
    the Validator's own code, without importing, copying or calling
    fit_analysis.py: 656 compared quantities, ZERO disagreements, largest
    absolute difference 3.33e-16. fit_report.json, summary.json and
    controls.json were reproduced BYTE-IDENTICALLY from raw-timings.json alone
    in a fresh directory in this session. Both gates the run reports as firing
    (GOF-3, CTRL-CAL-GATE) were independently confirmed to fire, and every gate
    the run reports as not firing was independently confirmed not to fire. The
    Phi/Velu resolution and the cost-model reproduction were independently
    re-derived. Seven defects are recorded; all are labelling, accounting or
    completeness defects, none of them touches the fired reading or any number
    the run carries forward, and DEF-1/DEF-2 concern figures the run itself
    declares are not results. This is a single terminal verdict; the run
    package is admissible evidence subject to the listed defects and
    limitations.

  what_this_verdict_does_not_assert:
    - It does not endorse a value of c. READING-NOT-IDENTIFIED fired and no c is carried.
    - It does not decide the NIST-I margin. DEC-20260724-016's INCONCLUSIVE position is untouched.
    - It does not move H-P13-001, which is the Coordinator's alone.
    - It does not assert Heuristic 1 is validated, or that GAP-1 or GAP-2 is repaired.
    - Admissibility of a receipt is not evidence strength and is not authorization to promote.

  # =====================================================================
  independence:
    session_independent: true
    implementation_independent: true
    model_independent: false
    statement: >-
      MODEL-LEVEL INDEPENDENCE FROM THE PRODUCER IS UNAVAILABLE UNDER THIS
      HARNESS. Claude Code cannot resolve the GPT-5.6-family policy aliases in
      orchestration/model-policies.yaml, so producer and validator both resolve
      to claude-opus-5. This validation's independence is SESSION-LEVEL AND
      IMPLEMENTATION-LEVEL AT BEST. The recomputation code
      (repro/independent_fit.py) was written in this session and derives OLS by
      explicit second-moment sums, the t quantile through scipy.stats.t, and
      the bootstrap through its own resampler; fit_analysis.py was not
      imported, copied or called by it.
    inference:
      requested_policy: review-xhigh
      resolved_model_id: claude-opus-5
      model_verified: false
      model_verified_reason: policy alias unresolvable under this harness; recorded, never silently substituted
      fallback_used: true
      fallback_allowed_by_handoff: false
    producer_policy_conflict_noted_not_adjudicated: >-
      The producer's handoff sets fallback_allowed false while manifest.yaml
      records fallback_used true. The Executor disclosed it; it is not resolved.
      TASK-20260731-005 adjudicates. The same conflict applies to this
      validation task and is recorded here for the same adjudication.

