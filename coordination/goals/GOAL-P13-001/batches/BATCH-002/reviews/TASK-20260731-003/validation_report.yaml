        in that file: EA-1 0, EA-2 0, EA-3 4, EA-4 0, EA-5 0, EA-6 0.
        fit_analysis.py defines the full EA dict at module level but emits only
        EA["EA-3"] (lines 938 and 1047). execution_report.yaml line 374 asserts
        "LABELLED EXTRAPOLATION with EA-1..EA-6 attached", which the artifact
        does not bear out.
      contract_clause_violated: honesty_constraints bullet 3, "No margin figure without the word EXTRAPOLATION attached and EA-1..EA-6 carried."
      mitigation: >-
        The run's RESULT carries no margin: fit_report.extrapolation is null,
        READING-NOT-IDENTIFIED fired, and each block is explicitly marked
        "arithmetic on a fit that was declared not adequate, NOT as a margin
        claim". EA-1..EA-6 are present in full in specification.yaml at the
        frozen commit. The defect is one of labelling completeness on figures
        the run declares are not results.
      required_of_any_superseding_artifact: attach EA-1..EA-6 in the same structure as every emitted margin, or emit no margin at all; and correct the execution report's statement.
      repaired_by_this_validation: NO -- the Validator repairs nothing.

    - id: DEF-2
      severity: moderate
      title: the fired reading says no margin figure is produced, and 60 are
      evidence: >-
        READING-NOT-IDENTIFIED's frozen text, quoted verbatim in
        fit_report.pre_registered_reading, reads "NO c IS CARRIED INTO THE
        EXTRAPOLATION AND NO MARGIN FIGURE IS PRODUCED." The same file's
        extrapolation_for_all_series emits margins computed from c_fit and from
        both endpoints of the carried interval for four series at five security
        levels. The snapshot receipt propagates the stronger claim: "NO NIST-I
        margin figure produced."
      assessment: >-
        The producer's framing is defensible on its own terms -- the primary
        `extrapolation` key IS null, the block is labelled as non-claim
        arithmetic, and the stated purpose (showing the unspecified primary-B
        choice is not load-bearing) is legitimate and the Validator independently
        confirmed it. But the artifact does not match the sentence it says
        fired, and the receipt's absolute phrasing is not accurate about the
        file's contents. A reader taking the receipt at face value would not
        expect to find 60 margin numbers in fit_report.json.
      required: the ledger record and any review should say "no margin figure is CARRIED as a result; non-claim arithmetic for all series is retained in fit_report.extrapolation_for_all_series", rather than "no margin figure produced".
      repaired_by_this_validation: NO.

    - id: DEF-3
      severity: moderate (latent, does not bind this run)
      title: c_star is not contract-determined because the contract names no memory budget
      evidence: >-
        c_star = (margin(c=0, w) - 3.51)/sqrt(log2 p). Across the committed
        model's own MEMORY_BUDGETS: c_star = 1.922 (w=2^30), 2.235 (2^40), 2.485
        (2^50), 2.735 (2^60), 2.985 (2^70), 3.235 (2^80); at w = 2^20 it is
        1.610 and at w = M = 2^93 it is 3.891. Three of the five pre-registered
        readings are conditioned on c_star. The contract names no w. The
        executor's w = 2^30 is declared as deviation D-6.
      the_producers_justification_is_half_vacuous: >-
        margin(c=0) - margin(c=2) = 2*sqrt(log2 p) = 32 bits for EVERY w, so
        NC-2's c=2 figure carries no information about w. Only margin(c=0) ~ 34
        constrains it, and only to log2 w = 30 +/- 2 given d(margin)/d(log2 w) =
        0.5. "reproduces BOTH figures" overstates the constraint.
      does_not_bind_here: >-
        READING-NOT-IDENTIFIED took precedence, no c was carried, and no
        c_star-conditioned reading fired. The numbers reported for c_star are
        arithmetically correct.
      required_before_any_future_c_star_reading: a versioned protocol_amendment naming w (and stating whether w is a budget or an optimum), recorded BEFORE the run that would fire such a reading.
      repaired_by_this_validation: NO.

    - id: DEF-4
      severity: minor
      title: the per-file cap was resolved by thinning every cell, including 36 of 36 cells that never met the rule's own trigger, and the archived record can no longer re-derive the cell medians
      evidence: >-
        budgets.raw_timing_downsampling_rule triggers at "2000 entries per
        cell"; the largest per-cell step count in the run is 1545 and every cell
        had k1 = 1 from the per-cell rule. A uniform global multiplier m = 2 was
        then applied to ALL 36 cells to bring the whole FILE under the 8 MiB
        per-file cap. Verified: kept_step_count = ceil(pre_count/2) for all 36
        cells and len(steps_downsampled) equals the declared kept count in all 36.
      the_claim_kept_m_equals_all_k1_m: >-
        VERIFIED, BUT ONLY BY CODE INSPECTION PLUS ARITHMETIC, NOT AGAINST THE
        FULL LISTS. Because k1 = 1 for every cell, kept = all_steps[::1] =
        all_steps, so kept[::2] IS all_steps[::2] identically -- the claim is
        trivially true here. It CANNOT be checked against the original step
        lists, which no longer exist in any archived artifact.
      consequence: >-
        An independent party cannot re-derive the cell medians that ARE the
        fitted y-values. The Validator computed the retained-step medians and
        found them to differ from the reported full-step medians by a median of
        ~0.3% and a maximum of 11.78%. The fit was therefore recomputed from the
        recorded cell medians down.
      compensating_evidence: stdout.txt's three textually identical fit-stage blocks, the first preceding the cap-enforcement line, show the fitted quantities are unchanged by the thinning.
      no_summary_statistic_changed: CONFIRMED to the extent stated above.
      repaired_by_this_validation: NO.

    - id: DEF-5
      severity: minor
      title: CTRL-CAL is interleaved only through the first configuration pass
      evidence: >-
        schedule_order shows [cal k] and [null k] interleaved with the B-ASY
        cells for all eight primes within the first ~45 s, then 26 further cells
        (B-FIX-8, B-FIX-32, V-2, SEED-B, DRIFT-END) run from t ~ 44 s to t ~ 172 s
        with no further calibration. The contract requires CTRL-CAL "INTERLEAVED
        with the primary cells and not blocked after them".
      consequence: >-
        T_entry_ops for the B-FIX-8, B-FIX-32 and V-2 cells is normalised by a
        t_mul(p) measured up to ~2 minutes earlier in the session. CTRL-DRIFT's
        start/end ratios (1.015 and 1.019) bound the drift as small, so the
        effect is contained, but the normalisation is not contemporaneous and
        the report does not say so.
      repaired_by_this_validation: NO.

    - id: DEF-6
      severity: minor
      title: three fit-stage executions are visible in stdout.txt but the manifest records one
      evidence: >-
        stdout.txt contains three "wrote summary.json / wrote fit_report.json /
        wrote controls.json / PRIMARY SERIES ..." blocks; command.txt shows a
        single appending invocation; manifest records fit_stage_elapsed_seconds
        3.797 and runs_executed 1.
      assessment: >-
        NOT a breach of maximum_runs, which governs the MEASUREMENT run -- the
        cell log appears exactly once and no measurement was repeated (the
        producer states this and the Validator confirms it from the single
        occurrence of every CELL line). The three fit-stage blocks are
        TEXTUALLY IDENTICAL, so no selection among outcomes was possible, and
        the Validator's own fresh reproduction is byte-identical to the
        archived files. The defect is that the manifest does not name the
        repetitions.
      repaired_by_this_validation: NO.

    - id: DEF-7
      severity: minor
      title: anomaly A-9's characterisation of the j = 1728 degeneracy is incomplete
      evidence: >-
        A-9 states the phenomenon as "Phi_2(1728, Y) has roots {1728, 287496}
        with MULTIPLICITIES {1, 2} summing to 3 = ell + 1". The Validator
        independently found that Phi_3(1728, Y) also degenerates, with two
        distinct roots {1030144, 469077} of multiplicities {2, 2} summing to
        4 = ell + 1, matching E.isogenies_prime_degree(3)'s codomain multiset.
      assessment: >-
        The CONCLUSION is unaffected and independently confirmed: counting with
        multiplicity equals ell + 1 equals the Velu count in both cases, and no
        off-by-one entered c. Only the description of the scope of the
        degeneracy is incomplete.
      repaired_by_this_validation: NO.

  observations:
    - id: OBS-1
      text: >-
        raw-timings.json.artifact_cap_enforcement.size_bytes_after records
        5398386 bytes while the archived file is 5399018 bytes (a 632-byte
        difference, consistent with the record being written before the
        enclosing document's final serialisation). manifest.yaml's
        artifact_size_per_file_max_bytes 5399018 is the correct figure. Cosmetic.

    - id: OBS-2
      text: >-
        environment.json discloses that the Kohel classical modular polynomial
        database is NOT INSTALLED, so V-1 uses PARI's polmodular, which COMPUTES
        Phi_ell from scratch rather than retrieving it. This materially changes
        what precomputation_policy is measuring: phi_load_seconds (~1e-6 s) is a
        process-cache hit, not a database retrieval, and the "fully charged"
        accounting uses a separately measured one-time build cost (D-8). The
        producer disclosed both, and both accountings are fitted and reported,
        with no series showing a disjoint amortised/fully-charged pair. Handled
        correctly, but the contract's stated premise ("Phi_ell come from a
        precomputed database") did not hold on this host.

    - id: OBS-3
      text: >-
        The 8 OPTIONAL-IF-BUDGET cells (B-FIX-32 x V-2) were skipped by a
        scheduling decision with 3.3% of the wall budget consumed. This is
        contract-compliant and named by cell, but it is a discretionary
        reduction of the only evidence base ST-V has, and ST-V's non-firing rests
        on a V-2 interval 4.4x wider than V-1's with GOF-1 fired on every V-2
        series. A future batch that wants ST-V to mean something should run them.

    - id: OBS-4
      text: >-
        manifest.parameters records a per-starting-curve entry ceiling of 6000
        (deviation D-3). Fourteen cells sit at 6000-6009 entries, i.e. saturated.
        Entry counts are therefore not comparable across primes at the top of the
        sweep. Because the fitted y is a per-step median rather than a per-cell
        total, this does not enter the fit, but it does mean cell sample sizes
        are set by a ceiling and not by the contract's 1500-entry target at the
        larger primes.

  # =====================================================================
  the_question_that_matters:
    question: is READING-NOT-IDENTIFIED the right conclusion, or an artifact of the experimental design?
    short_answer: >-
      IT IS THE RIGHT CONCLUSION, AND IT IS NOT A POWER FAILURE WITH RESPECT TO
      THE VALUE THAT MATTERS. Had c been of order 1.9, BOTH firing gates would
      have failed to fire and the exponent would have been identified
      comfortably. The design was over-powered for c ~ 1.9 by roughly an order
      of magnitude in c. What the run cannot see is not p; it is B.

    quantitative_basis:
      design_constants:
        n: 8
        regressor: sqrt(log2 p), log2 p in {20,23,26,29,32,35,38,40}
        Sxx: 3.041071360013817
        delta_x_across_the_sweep: 1.8524193653371794
        residual_sd_about_M-A_primary_bits: 0.07342302697779185
        residual_sd_of_t_mul_bits: 0.05868
      GOF-3_restated_as_an_R2_threshold: >-
        RSE(M-0)/RSE(M-A) >= 2 with df n-1 and n-2 is exactly
        R^2 >= 1 - (n-2)/(4(n-1)) = 0.785714 at n = 8. Observed R^2 = 0.644299,
        giving 1.5523. The gate is a MODEL-SELECTION standard, not a bound on c.
      what_a_true_c_would_have_produced_at_the_observed_noise:
        - {c: 0.1388, rise_across_the_sweep_bits: 0.257, factor: 1.2, R2: 0.6443, GOF3: 1.552, fires: true}
        - {c: 0.3000, rise_across_the_sweep_bits: 0.556, factor: 1.5, R2: 0.8943, GOF3: 2.848, fires: false}
        - {c: 0.5000, rise_across_the_sweep_bits: 0.926, factor: 1.9, R2: 0.9592, GOF3: 4.583, fires: false}
        - {c: 1.0000, rise_across_the_sweep_bits: 1.852, factor: 3.6, R2: 0.9895, GOF3: 9.025, fires: false}
        - {c: 1.9224, rise_across_the_sweep_bits: 3.561, factor: 11.8, R2: 0.9971, GOF3: 17.283, fires: false}
      minimum_detectable_c_at_this_design_and_noise: 0.1975
      observed_c: 0.1388
      reading: >-
        The GOF-3 sensitivity floor of this design is c ~ 0.20. The true value
        sits just under it. c = 1.9224 is 9.7x above the floor: it would have
        produced a 3.56-bit (11.8x) rise in per-entry cost across the sweep
        against a per-point noise of 0.073 bits, a GOF-3 reduction factor of
        17.3 against a threshold of 2, and R^2 = 0.997.
      and_CTRL_CAL_would_not_have_fired_either: >-
        At c = 1.9224 the primary CI-T would be approximately [1.82, 2.02] while
        the t_mul interval tops out at 0.1548. THE TWO WOULD BE DISJOINT BY A
        FACTOR OF TWELVE and CTRL-CAL-GATE would not fire. Both contributing
        gates are therefore specific to a genuinely near-flat per-entry cost,
        not artifacts that would have suppressed a large exponent.
      conclusion: >-
        READING-NOT-IDENTIFIED is not a null produced by a blunt instrument. In
        the parameterisation and regime measured, c ~ 1.9 IS EXCLUDED: the
        carried interval [0.0358, 0.2418] lies a factor ~8 below c_star =
        1.9224. The run correctly declines to report that as a finding, because
        the gates it pre-registered are identification gates and not exclusion
        bounds -- but a reviewer should know that the exclusion is what the data
        show.

    what_range_of_p_or_what_precision_would_identify_c_of_order_1.9:
      answer_1_for_c_1.9_itself: >-
        NONE ADDITIONAL IS NEEDED. The existing design -- 8 primes over
        log2 p in [20,40] at a per-point residual SD of 0.073 bits -- already
        identifies c = 1.9224 with a GOF-3 reduction factor of 17.3 (8.6x the
        threshold) and R^2 = 0.9971, and separates it from CTRL-CAL by a factor
        of twelve. The MINIMUM design that would identify c = 1.9224 at this
        noise is far smaller than what was run: Sxx >= 0.0405 suffices, i.e.
        four primes spanning log2 p in [20, 22] would do it. THE SWEEP IS NOT
        TOO NARROW FOR c ~ 1.9; IT IS TOO NARROW FOR c ~ 0.14.
      answer_2_what_would_identify_the_c_that_is_actually_there_0.1388:
        widen_the_range_at_the_current_noise:
          - {range: "[20,40]", n: 8, Sxx: 2.93, GOF3: 1.53, clears: false}
          - {range: "[20,64]", n: 8, Sxx: 10.53, GOF3: 2.50, clears: true}
          - {range: "[20,96]", n: 8, Sxx: 23.78, GOF3: 3.61, clears: true}
          - {range: "[20,128]", n: 8, Sxx: 38.94, GOF3: 4.55, clears: true}
        adding_primes_at_the_same_range_does_not_help:
          rows:
            - {range: "[20,40]", n: 16, GOF3: 1.47, clears: false}
            - {range: "[20,40]", n: 32, GOF3: 1.44, clears: false}
          note: >-
            THIS IS A STRUCTURAL PROPERTY OF GOF-3 THAT THE NEXT BATCH MUST KNOW.
            The gate compares residual standard errors, so it is scale-free in n
            and the (n-2)/(4(n-1)) factor tightens as n grows. Adding primes
            inside [20,40] makes the gate very slightly HARDER to clear. Only
            widening the range or reducing the noise helps.
        or_reduce_the_noise_at_the_current_range: >-
          sigma <= 0.0516 bits clears GOF-3 at c = 0.1388 over [20,40] --
          a 1.42x improvement in per-cell timing reproducibility.
        and_to_clear_CTRL_CAL_as_well_which_is_the_harder_of_the_two:
          requirement: "q*(se_primary + se_t_mul) < |c_primary - c_t_mul| = 0.06788 bits"
          by_range_alone_at_the_current_noise:
            - {range: "[20,64]", n: 8, required_gap: 0.0996, actual: 0.0679, disjoint: false}
            - {range: "[20,64]", n: 12, required_gap: 0.0774, actual: 0.0679, disjoint: false}
            - {range: "[20,80]", n: 8, required_gap: 0.0788, actual: 0.0679, disjoint: false}
            - {range: "[20,96]", n: 8, required_gap: 0.0663, actual: 0.0679, disjoint: TRUE}
            - {range: "[20,128]", n: 8, required_gap: 0.0518, actual: 0.0679, disjoint: TRUE}
          by_noise_alone_over_the_current_range:
            - {sigma_scale: 0.70, required_gap: 0.1323, disjoint: false}
            - {sigma_scale: 0.50, required_gap: 0.0945, disjoint: false}
            - {sigma_scale: 0.35, required_gap: 0.0661, disjoint: TRUE}
          summary: >-
            To identify the c that is actually present, a follow-up needs EITHER
            log2 p out to ~96 at the current timing reproducibility, OR a ~2.9x
            reduction in per-cell timing noise over the present range, OR a
            combination -- e.g. log2 p in [20,64] with ~1.6x better
            reproducibility clears both gates. log2 p = 64 at B = 8 is
            comfortably reachable in Sage; log2 p = 96 is reachable but the
            per-cell budget must rise, since per-prime cost already grew from
            11.2 s at k=20 to 31.1 s at k=40.

    but_this_is_the_wrong_axis_to_widen:
      finding: >-
        THE MOST USEFUL NUMBER FOR THE NEXT BATCH IS NOT A p-RANGE. Widening p
        buys identification of a c ~ 0.14 that is already known to be far below
        c_star, and it does nothing about EA-3, which is the limitation that
        actually decides whether any of this transfers.
      the_arithmetic: >-
        At log2 p = 256 the committed model selects log2 B* = 14.200, i.e.
        B* ~ 18820 with ell up to ~18820. This sweep measured B <= 32, ell <= 31:
        a factor 588 in B, 9.2 bits, entirely outside the measured range, against
        a per-entry cost that Lemma 3.3 gives only as (B + log p)^{O(1)}. The
        overhead the margin question turns on is c_star*sqrt(256) = 30.76 bits at
        NIST-I. A c of 0.1388 supplies 2.22 bits of that. The remaining ~28.5
        bits, if they exist at all, are a B-dependence this experiment cannot
        see, not a p-dependence it measured too coarsely.
      recommended_axis_for_the_next_measurement: >-
        A B-SWEEP AT FIXED MODEST p, fitting the per-entry cost against log2 B
        over B ~ 2^3 to 2^10 or beyond (ell up to ~1000), with the same gate
        structure, the same null objects and the same t_mul normalisation. That
        directly measures the exponent in the B^{O(1)} factor, which is the term
        that could plausibly move a 2-bit margin, and it does so at parameter
        sizes that are actually runnable. A p-sweep to log2 p = 96 measures the
        term already bounded at ~0.24. THIS IS AN OBSERVATION FOR THE
        COORDINATOR, NOT A RECOMMENDATION THIS REPORT IS AUTHORISED TO MAKE; it
        is recorded because the card asked for the most useful number and the
        honest answer is that the useful axis is B.

  # =====================================================================
  limitations:
    - Model-level independence from the producer is UNAVAILABLE under this harness; this validation is session-level and implementation-level only.
    - The cell medians that are the fitted y-values CANNOT be re-derived from the archived raw record, because every cell was thinned by a factor of 2. The fit was recomputed from those medians down. See DEF-4 / MR-3.
    - The j-invariant SET identity in CTRL-DET rests on a SHA-256 digest of the sorted member list, since the sets themselves are not archived; starting j-invariants were compared as literals and match.
    - The 1800 CTRL-COUNT spot checks were verified as recorded counts with verified Psi provenance; the individual witnesses are not archived and were not re-executed. The Phi/Velu correspondence itself WAS independently re-derived.
    - The root-count scan supporting "no cell expands j = 1728" covers the 16582 RETAINED per-step records, approximately half the steps executed.
    - p <= 2^40 is not cryptographic size, and B <= 32 is 9.2 bits below the operating B. Nothing here validates Heuristic 1; GAP-1 and GAP-2 remain open; Section 4.1 remains UNVERIFIABLE-AS-WRITTEN.
    - This validation did not re-execute the measurement stage (calibration_probe.py). It verified the fit stage byte-identically and recomputed every derived quantity independently, but it did not independently re-measure a single timing. A producer-side error in the MEASUREMENT harness would not be caught by this validation.
    - Everything not listed as checked was not checked. In particular: the Lemma 3.2 upper-bound values were not recomputed cell by cell (only the gate's zero-violation count and the Psi provenance were verified), and per-ell MIX-1 medians were not recomputed.

