  # =====================================================================
  metric_recomputations:

    - id: MR-1
      check: THE FIT, RECOMPUTED INDEPENDENTLY FROM raw-timings.json ALONE
      method: >-
        repro/independent_fit.py. OLS by explicit Sxx/Sxy second-moment sums;
        RSE from its own sum of squares; t quantile from scipy.stats.t;
        bootstrap by its own index resampler seeded 20260731001; every gate
        re-evaluated from the Validator's own numbers. fit_analysis.py was NOT
        imported, copied or called by this file.
      series_reconstructed: 16 producer series + 5 control series
      quantities_compared: 656
      agreements: 656
      disagreements: 0
      largest_absolute_difference: 3.3306690738754696e-16
      headline_confirmations:
        primary_series: "B-ASY|V-1|SEED-A|T_entry_ops_amortised"
        c_validator: 0.13880213854255802
        c_producer: 0.13880213854255802
        c_difference: 0.0
        CI_T_validator: [0.03577840042398937, 0.24182587666112665]
        CI_T_producer: [0.03577840042398943, 0.24182587666112660]
        CI_T_difference: "<= 6e-17 on each endpoint"
        CI_BOOT_validator: [0.06505707666218076, 0.20613431221153980]
        CI_BOOT_producer: [0.06505707666218077, 0.20613431221153980]
        CI_BOOT_note: >-
          The Validator's independently written resampler reproduced the
          producer's bootstrap endpoints to 1e-17, which additionally confirms
          the resampling convention (2000 draws, index resampling with
          replacement, linear-interpolated 2.5/97.5 percentiles, discard rule
          for <3 distinct primes) is the one the contract implies.
        carried_interval: "CI-T, width 0.20605, WIDER than CI-BOOT's 0.14108. The WIDER interval WAS carried, as fitting_protocol.intervals_reporting_rule requires. Verified in all 22 series: carried_from == the wider of the two in every case."
        r2_validator: 0.6442993875652165
        r2_producer: 0.6442993875652165
        rse_MA_validator_bits: 0.07342302697779185
        rse_MA_producer_bits: 0.07342302697779185
        residuals: "all 8 signed residuals per series reproduce to <= 3.3e-16; sign pattern -++-+++- reproduced"
        collinearity_pearson: 0.998795182224937 (reproduced exactly)
      validator_own_error_disclosed: >-
        The Validator's first run reported 48 disagreements in the M-B family.
        The cause was the VALIDATOR'S bug: the M-B regressor log2(log2 p) was
        coded as log2(log2(k)) where k is already log2 p. Solving for the
        producer's implied regressor from its own (y, a, gamma, residuals)
        recovered x = log2(k) exactly, i.e. THE PRODUCER WAS RIGHT. The bug was
        fixed and the run repeated; the erroneous first pass is disclosed here
        rather than hidden.
      result: PASS

    - id: MR-2
      check: BYTE-IDENTICAL REPRODUCTION of the derived artifacts from raw-timings.json alone
      command: >-
        cp raw-timings.json <scratch>/run2/ &&
        /usr/local/bin/sage -python <abs>/experiments/EXP-SSI-002/fit_analysis.py
        --run-dir <scratch>/run2
        --cost-model <abs>/experiments/EXP-P13VOW-001/cost_model.py
      results:
        fit_report.json: BYTE-IDENTICAL (a31674085fdffa75eecafdabe32cade2c009786a6486816eba67b480dde708b8)
        summary.json: BYTE-IDENTICAL (092d76a840a2160a14881288e9ad4f85e0b6b5c31b89f8772e21505305ed62ea)
        controls.json: BYTE-IDENTICAL (cce4e7016a1fcfd6993463ae3c5f9e0e7a959ec3ebe11690b5002eea570a052a)
        raw-timings.json: unchanged by the fit stage (digest identical before and after)
      note: >-
        A first reproduction attempt with a RELATIVE --cost-model path produced
        exactly one semantic difference in each of fit_report.json
        (cost_model_provenance.path) and controls.json
        (CTRL-COUNT.psi_provenance.source_path): the recorded path string. With
        the absolute path, as command.txt's working-directory header implies,
        all three files are byte-identical. Recorded so the sensitivity is not
        mistaken for nondeterminism.
      result: PASS

    - id: MR-3
      check: raw / summary agreement, recomputed from the raw records
      per_cell_checks_over_all_36_cells:
        T_entry_s_total_over_entries: "recomputed as timed_window_total_s / entries_charged for all 36 cells; maximum absolute difference 0.0"
        component_split_sums_to_timed_total: "max relative error 6.71e-4 (c1+c2+c3+c4 vs the window total; the residue is the untimed loop overhead inside the window, as expected)"
        table_size_L_total_equals_sum_per_curve: "true for all 36 cells"
        admissibility: "producer `admissible` flag equals the Validator's own entries >= 300 test for all 36 cells; smallest cell 1533 entries; zero under-sampled cells"
        cap_fired: "false for all 36 cells; terminal_status 'completed' for all 36"
      limitation_stated: >-
        THE CELL MEDIANS THEMSELVES CANNOT BE RE-DERIVED FROM THE ARCHIVED FILE.
        Every cell was thinned to every 2nd per-step record, so the median over
        the RETAINED steps is not the median over the FULL steps the producer
        reports. The Validator computed both: the retained-step median differs
        from the reported full-step median by a median of ~0.3% and a maximum of
        11.78% across the 36 cells. The fit was therefore recomputed FROM THE
        RECORDED CELL MEDIANS DOWN, not from the per-step records up. See DEF-4.
      compensating_evidence: >-
        stdout.txt contains THREE fit-stage output blocks that are TEXTUALLY
        IDENTICAL, and the first of them precedes the `artifact cap enforcement:
        m=2` line in the same appended log. Taken with the manifest's statement
        that the pre-thinning file was 10,597,988 bytes, this is direct evidence
        that the fitted quantities are the same before and after thinning, i.e.
        the downsampling changed no reported statistic.
      result: PASS-WITH-LIMITATION

    - id: MR-4
      check: c_star and the cost-model extrapolation, recomputed against the committed model
      method: >-
        The Validator imported experiments/EXP-P13VOW-001/cost_model.py directly
        (sha256 a82b9d5b1fe3a2c74208d8474d9ff8791c1859d925863bb48c0a58d766f5cb6f,
        unchanged since f397c011, main() not executed), called
        dickman_log2_grid and optimize_B unmodified, and evaluated the vOW
        margin expression at log2 p = 256.
      findings:
        optimizer_at_log2p_256: {log2B_star: 14.200, log2X: 49.600, log2M: 93.278, log2T_full: 108.731, u: 5.986, w_ratio: 3.493}
        margin_c0_w2_30_validator: 34.26911041199382
        margin_c0_w2_30_producer: 34.26911041199382
        margin_c2_w2_30_validator: 2.2691104119938217
        margin_c2_w2_30_producer: 2.2691104119938217
        c_star_validator_closed_form: 1.922444400749614
        c_star_producer_bisection: 1.9224444007704733
        c_star_difference: 2.08e-11 (inside the declared 1e-9 solve tolerance)
        extrapolated_margin_check: "margin(c_fit=0.13880) at log2 p = 256 = 34.26911 - 16*0.13880 = 32.048276195312894, matching fit_report exactly"
        model_used_unmodified: CONFIRMED (digest match; no local modification; main() not run)
      result: PASS

    - id: MR-5
      check: the w = 2^30 identification, scrutinised rather than accepted
      the_producers_justification: >-
        "It is the memory budget at which the committed model reproduces BOTH
        figures NC-2 names: margin(c=0) and margin(c=2) at log2 p = 256."
      validator_finding: >-
        HALF OF THAT JUSTIFICATION IS VACUOUS. In the committed model
        margin(c) = log2TDG - log2T_full + 0.5*min(log2w, log2M) - c*sqrt(log2p),
        so margin(c=0) - margin(c=2) = 2*sqrt(256) = 32 bits EXACTLY, FOR EVERY
        VALUE OF w. The c=2 figure therefore carries ZERO independent
        information about the memory budget; it follows arithmetically from the
        c=0 figure. Only ONE of NC-2's two numbers constrains w.
      how_weakly_it_constrains: >-
        d(margin)/d(log2 w) = 0.5, so matching NC-2's "~34" to within +/-1 bit
        pins log2 w only to 30 +/- 2. Computed across the model's own tabulated
        MEMORY_BUDGETS [30, 40, 50, 60, 70, 80]: margin(c=0) = 34.27, 39.27,
        44.27, 49.27, 54.27, 59.27 and c_star = 1.922, 2.235, 2.485, 2.735,
        2.985, 3.235. At w = 2^20 c_star = 1.610; at w = 2^93 = M, c_star = 3.891.
      what_is_nonetheless_defensible: >-
        w = 2^30 is the SMALLEST entry in the committed model's own
        MEMORY_BUDGETS list, and it is the only tabulated budget consistent with
        NC-2's ~34/~2 framing and with DEC-20260724-016's 2.3-bit NIST-I figure
        (the model returns 2.269 there). The identification is the right one
        among the tabulated options and the run declares it as an executor
        identification (deviation D-6), not as a contract term.
      consequence_recorded: >-
        c_star IS NOT CONTRACT-DETERMINED. The frozen contract names no memory
        budget, yet three of the five pre-registered readings (READING-SMALL-C,
        READING-LARGE-C, READING-STRADDLE) are conditioned on c_star. In THIS
        run the gap does not bind, because READING-NOT-IDENTIFIED took
        precedence and no c was carried. IT WILL BIND IN ANY FUTURE RUN THAT
        CLEARS THE GATES, and it should be closed by a versioned
        protocol_amendment naming w BEFORE that run, not after. See DEF-3.
      result: PASS-WITH-DEFECT (the arithmetic is exact; the justification's framing is overstated)

  # =====================================================================
  control_checks:

    - id: CC-1
      control: GOF-1
      validator_evaluation: "max |residual| on the primary series = 0.10748541792448663 bits < 0.5 => DOES NOT FIRE"
      producer: fired false
      agreement: CONFIRMED
      additional_finding: >-
        GOF-1 DOES fire on all four B-FIX-8|V-2 series (max |residual| 0.5963
        and 0.5173 bits). The producer records this correctly and marks those
        series exponent_identified false. V-2 is not the primary series, so this
        adds no contributing gate to the reading, but it is the correct reading
        of a badly-fitting V-2 series and the run does not conceal it.

    - id: CC-2
      control: GOF-2
      validator_evaluation: "sign pattern -++-+++- ; longest same-sign run = 3 < 6 => DOES NOT FIRE"
      producer: fired false
      agreement: CONFIRMED
      note: "Verified in both directions: no series in the package has a run >= 6; the longest anywhere is 4."

    - id: CC-3
      control: GOF-3 -- ONE OF THE TWO FIRING GATES
      validator_evaluation:
        rse_M0_bits: 0.11397683257079888
        rse_MA_bits: 0.07342302697779185
        reduction_factor: 1.5523308866750112
        threshold: 2.0
        fires: true
      producer: {reduction_factor: 1.5523308866750112, fired: true}
      agreement: CONFIRMED TO 16 SIGNIFICANT FIGURES
      robustness_probe_by_the_validator: >-
        The contract does not state the degrees of freedom for the null model's
        RSE. The Validator recomputed GOF-3 under all three defensible
        normalisations of RSE(M-0): sqrt(SSE0/(n-1)) = 1.5523 (the producer's),
        sqrt(SSE0/(n-2)) = 1.6767, sqrt(SSE0/n) = 1.4521. ALL THREE ARE BELOW 2.
        THE GATE FIRES UNDER EVERY NORMALISATION, so the verdict does not turn
        on an unstated convention.
      robustness_across_the_unspecified_primary_B_setting: >-
        The contract names V-1, SEED-A, T_entry_ops and the AMORTISED accounting
        as primary but names NO primary B setting (the producer's declared
        ambiguity D-5). The Validator therefore evaluated GOF-3 on ALL SIX
        contract-eligible ops series: B-ASY amortised 1.552, B-ASY fully charged
        1.530, B-FIX-8 amortised 1.246, B-FIX-8 fully charged 1.163, B-FIX-32
        amortised 1.113, B-FIX-32 fully charged 1.005. GOF-3 FIRES ON ALL SIX.
        THE B-SETTING CHOICE IS NOT LOAD-BEARING FOR THE READING.
      the_direction_that_matters_the_other_way: >-
        GOF-3 does NOT fire on the RAW-SECONDS series (B-ASY 4.244, B-FIX-8
        3.938, B-FIX-32 4.625). Had raw seconds been primary, an exponent
        c ~ 0.18-0.21 would have been "identified". The contract is explicit
        that "THE PRIMARY FIT IS PERFORMED ON T_entry_ops" with seconds
        secondary, so the executor had no discretion here and took none. This is
        recorded because it is the single place where a different (and
        contract-violating) choice would have flipped the reading.

    - id: CC-4
      control: ST-B
      validator_intervals: {B-ASY: [0.03578, 0.24183], B-FIX-8: [-0.01177, 0.22646], B-FIX-32: [-0.03315, 0.16648]}
      pairwise_disjoint: {B-ASY_vs_B-FIX-8: false, B-ASY_vs_B-FIX-32: false, B-FIX-8_vs_B-FIX-32: false}
      fires: false
      producer: not pairwise disjoint
      agreement: CONFIRMED

    - id: CC-5
