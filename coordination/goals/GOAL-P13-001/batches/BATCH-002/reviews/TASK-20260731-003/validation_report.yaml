    - id: CC-8
      control: CTRL-CAL / CTRL-CAL-GATE -- THE SECOND FIRING GATE
      validator_evaluation:
        t_mul_slope_c: 0.07091970132387992
        t_mul_carried_interval: [-0.012997264171796266, 0.1548366668195561]
        primary_carried_interval: [0.03577840042398937, 0.24182587666112665]
        overlaps: true
        fires: true
      producer: {overlaps: true, fired: true}
      agreement: CONFIRMED
      why_it_is_a_real_confound_not_a_technicality: >-
        The overlap is substantial, not marginal. The t_mul interval contains
        0.0358-0.1548 of the primary interval, i.e. 58% of the primary
        interval's width lies inside it, and the point estimates differ by only
        0.0679 bits against interval half-widths of 0.1030 and 0.0839. An
        F_{p^2} multiplication's measured cost rises across 20-40 bits for
        word-size and interpreter-dispatch reasons that have nothing to do with
        Algorithm 1, and the primary quantity's fitted slope is not separated
        from it. The gate is correctly fired.
      comparability_check:
        same_host: true
        same_session: true
        same_timing_harness: true
        interleaved_not_blocked: PARTIAL -- see DEF-5
        evidence: >-
          raw-timings.json.schedule_order shows the first config pass as
          [cell k20 B-FIX-8], [cell k40 B-FIX-8], [cal 20], [null 20],
          [cell k20 B-ASY], [cal 23], [null 23], [cell k23 B-ASY], ... i.e.
          CTRL-CAL and CTRL-NULL are genuinely interleaved with the B-ASY cells
