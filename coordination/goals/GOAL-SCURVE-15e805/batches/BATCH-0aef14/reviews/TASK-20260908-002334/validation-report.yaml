    - id: positive-control-M1-order4-point-DEFECT-FOUND
      description: >-
        Independently checked the producer's EXPLICITLY STATED order-4 candidate for M1:
        coordinates {u: 1, v: 528950257000142451010969798134146496096806208096258258133290419984524923934728256972792120570883515182233459997657945594599653183173011},
        with the producer's claim "v^2 = 1 + A + 1 = A+2 = 156328 mod p; a square root exists (confirmed a QR)".
      independent_verification: >-
        Recomputed v_claimed^2 mod p = 156324, NOT 156328 as the producer's own stated target requires
        (rhs of the curve equation at u=1 is (1+A+1) mod p = 156328). Independently confirmed 156328 is
        NOT a quadratic residue mod p (pow(156328,(p-1)//2,p) != 1) -- there is NO valid v for u=1 on
        curve448 at all; u=1 lies on curve448's quadratic TWIST, not on curve448 itself. The producer's
        "confirmed a QR" claim is independently confirmed FALSE, and the stated point (u=1, v=...) fails
        the on-curve check (lhs=156324, rhs=156328, mismatch).
      root_cause_independently_identified: >-
        v_claimed is exactly pow(156324, (p+1)//4, p) -- i.e. v_claimed is a genuine square root of
        156324 (= A-2), not of 156328 (= A+2). 156324 is the RFC7748 birational-map constant that
        appears in the (unrelated) formula "(x,y) = (sqrt(156324)*u/v, (1+u)/(1-u))" a few lines below
        the base-point block. This is consistent with a coordinate/sign transcription slip: the
        CORRECT pairing for this exact v-value is u = p-1 (i.e. u = -1 mod p), not u = 1. Independently
        verified: (u=p-1, v=v_claimed) IS on curve448 (lhs=rhs=156324); via my own ladder, 1*Q!=O,
        2*Q=(the order-2 point, x=0)!=O, 3*Q!=O, 4*Q=O (identity) -- genuinely order 4 -- and
        l*Q!=O, matching exactly the behavior the positive control requires. The producer's arithmetic
        for the v-coordinate was not fabricated from nothing; it was computed correctly but attached to
        the wrong u-coordinate (u=+1 instead of u=-1).
      impact_assessment: >-
        This defect is isolated to this one auxiliary control-construction claim in
        base-point-audit.yaml (positive_control.montgomery_M1_curve.order4_point). It does NOT change
        any on-curve/l*B=O/Hasse-uniqueness result for M1, M2, or M3 (independently re-verified correct
        above, using the actual transcribed base points, not this fabricated auxiliary point). It does
        NOT touch the M2 diagnosis (independently confirmed correct above via a fully separate code
        path). Global precondition P4 ("the instrument's controls must run and behave as required
        before any result is believed") remains substantively satisfied for lane L3, because three
        OTHER positive-control demonstrations (M1 order-2l; M3 order-4; M3 order-2l) are independently
        confirmed valid and correctly behaving, alongside the fully-valid parameter-matched-negative and
        same-shape-null controls below. However, the specific claims
        "doubles_to_(0,0)_confirmed: true" and "control_behaved_as_required: true" for this one
        sub-case are literally false as written (the claimed point never lies on curve448 to begin
        with, so nothing about it "on curve448" was confirmed), and base-point-audit.yaml's blanket
        statement "controls_ran_before_findings_believed: True" is not accurate for this specific
        sub-case as stated, even though the overall P4 requirement is still met via the other three
        valid demonstrations.
      status: FAIL (this specific sub-case) -- see verdict_rationale for how this composes into the overall verdict.
    - id: parameter-matched-negative-curve25519
      description: "Own from-scratch Montgomery on-curve check, ladder, and Hasse check on Curve25519 u=9, independent of any p25519 sqrt claim (see additional_findings)."
      results: {on_curve: true, lhs: 39420360, rhs: 39420360, l_times_B_eq_O: true, hasse_in_interval: true, hasse_count: 1}
