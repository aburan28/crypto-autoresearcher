    STATED order-4 positive-control point for M1 (u=1, v=528950...173011) does NOT lie on curve448 --
    its own claim "a square root exists (confirmed a QR)" is independently confirmed FALSE (156328 is
    not a quadratic residue mod p; u=1 lies on the quadratic twist, not the curve). I traced the exact
    root cause: the given v-value is a genuine square root of 156324 (=A-2), which is the RFC's own
    unrelated birational-map constant, and is in fact the CORRECT v-coordinate for u = p-1 (= -1 mod
    p), not u = 1 -- a sign/coordinate transcription slip, fully diagnosed and independently confirmed
    correctable. This is reported honestly as a FAIL at the level of that one specific control
    sub-case (see control_checks.positive-control-M1-order4-point-DEFECT-FOUND). It does not change my
    verdict to failed overall, because: it does not touch any of the on-curve/l*B=O/Hasse-uniqueness
    results for M1, M2, or M3 (all independently re-verified against the actual transcribed base
    points, not this fabricated auxiliary point); it does not touch the M2 diagnosis (verified via a
    fully independent code path); and global precondition P4 ("controls must run and behave as
    required before any finding is believed") remains substantively satisfied for lane L3 because
    three OTHER positive-control demonstrations (M1's order-2l point B+(0,0); M3's order-4 point
    (1,0); M3's order-2l point G+(0,p-1)) are independently confirmed valid and correctly behaving, in
    addition to the fully valid parameter-matched-negative and same-shape-null controls. This is a
