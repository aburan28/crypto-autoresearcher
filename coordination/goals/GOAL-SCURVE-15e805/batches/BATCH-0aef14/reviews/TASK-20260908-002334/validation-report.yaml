    - id: full-l3-certificate-own-implementation
      method: >-
        Wrote my own on-curve check, x-only Montgomery ladder (from the RFC7748 section-5 algorithm
        description, own implementation, never read producer's code -- producer's report contains no
        separate script, only prose descriptions of method), complete twisted-Edwards a=1 addition law
        and double-and-add scalar multiplication, and an exact-integer (no floating point) Hasse-interval
        membership/uniqueness test. Ran the full L3 certificate on M1, M2, M3.
      results:
        - candidate: M1_curve448_montgomery
          on_curve: {mine: true, producer: PASS, lhs_recomputed: 3908280, producer_lhs: 3908280, match: true}
          l_times_B_eq_O: {mine: true, producer: PASS, match: true}
          hasse_h_times_l: {mine: "726838...438599116", producer: "726838...438599116", match: true}
          hasse_interval_bounds: {mine_lo_hi: "[726838...867010, 726838...863870]", producer: "[726838...867010, 726838...863870]", match: true}
          hasse_count_of_multiples_of_l: {mine: 1, producer: 1, match: true, extra_check: "verified 3*l and 5*l fall outside the interval, confirming h=4 is not a boundary artifact"}
        - candidate: M2_large_d_edwards_birational
          on_curve: {mine: true, producer: PASS, lhs_recomputed: "191763...215135", producer_lhs: "191763...215135", match: true}
          l_times_B_eq_O: {mine: false, producer: FAIL (falsifier triggered), l_times_B_value_mine: "(0, p-1)", producer_detail: "(0, p-1)", match: true}
          hasse: {mine_count: 1, producer_count: 1, match: true, note: "same p,h,l as M1 row"}
        - candidate: M3_edwards448_goldilocks
          on_curve: {mine: true, producer: PASS, lhs_recomputed: "105207...593782", producer_lhs: "105207...593782", match: true}
          l_times_B_eq_O: {mine: true, producer: PASS, l_times_B_value_mine: "(0,1)", match: true}
          hasse: {mine_count: 1, producer_count: 1, match: true}
      status: PASS -- every PASS/FAIL the producer reports for M1, M2, M3 is independently confirmed, including the M2 falsifier trigger and its exact returned point (0, p-1).
    - id: m2-diagnosis-four-subclaims-independent-reproduction
      note: "This is the check the task explicitly names as most important. All four sub-claims independently reproduced from scratch."
      subclaims:
        - id: a_d_is_genuine_qnr
          producer_claim: "d for M2 is a genuine quadratic non-residue mod p"
          my_method: "computed pow(d_M2, (p-1)//2, p) via own code"
          my_result: "p-1 (non-residue)"
          verdict: CONFIRMED
        - id: b_negation_consistent_under_doubling
          producer_claim: "(x,y) and its negation (-x mod p, y) are true negatives of each other under independent doubling"
          my_method: "computed 2*(x,y) and 2*(-x,y) via my own twisted-Edwards addition law, checked 2*(-x,y) == (-[2*(x,y)].x mod p, [2*(x,y)].y)"
          my_result: "(-x,y) independently confirmed on-curve; doubled coordinates are exact negatives of each other"
          verdict: CONFIRMED
        - id: c_birational_map_recovers_u5
          producer_claim: "RFC 7748's own stated birational map (u,v) = ((y-1)/(y+1), sqrt(156324)*u/x) applied to the M2 point recovers u=5 exactly"
          my_method: "computed u = (y_M2 - 1) * inverse(y_M2 + 1) mod p directly from the M2 point, using the exact map as it appears at RFC7748 line 303 (independently re-located and re-read: '(u, v) = ((y-1)/(y+1), sqrt(156324)*u/x)'), confirmed this map is the M1<->M2 birational map (appears immediately after M2's own X(P)/Y(P) block, distinct from the 4-isogeny maps given later for M1<->M3)"
          my_result: "u = 5 exactly"
          verdict: CONFIRMED
        - id: d_double_l_times_point_is_identity
          producer_claim: "2*l*(x,y) equals the Edwards identity (0,1), confirming the point's true order is 2*l not l"
          my_method: "computed l*(x,y) and 2*l*(x,y) via my own double-and-add scalar multiplication"
          my_result: "l*(x,y) = (0, p-1); 2*l*(x,y) = (0, 1)"
          verdict: CONFIRMED
      overall: "All four supporting sub-claims of the producer's M2 diagnosis are independently reproduced and CONFIRMED exactly, using my own from-scratch implementation and my own freshly re-fetched raw text. The diagnosis (a non-normalized birational chart maps the Montgomery identity to the Edwards order-2 point rather than to the curve's own (0,1)) is independently corroborated by all four legs, not merely observed as consistent with the raw arithmetic."
      status: PASS

