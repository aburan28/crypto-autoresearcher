    from the raw bytes; (2) that the L3 base-point certificate (on-curve, l*B=O, Hasse-interval
    uniqueness) is arithmetically correct for M1, M2, and M3, including the exact M2 falsifier trigger
    and its returned order-2 point (0, p-1); and (3) that the producer's DIAGNOSIS of the M2 finding
    (not merely its raw arithmetic) is independently reproducible on all four supporting sub-claims --
    is independently confirmed TRUE, using my own from-scratch Python implementation (own on-curve
    checks, own Montgomery ladder, own twisted-Edwards addition law, own exact-integer Hasse test) and
    values extracted programmatically from my own fresh curl fetch of both RFCs, never by reading the
    producer's transcription or any script of the producer's (the producer's task in fact contains no
    separate implementation file to read; only prose method descriptions, which I independently
    reimplemented rather than executed). The M2 diagnosis -- the check this task's instructions name
    as most important -- checks out completely and precisely on independent re-derivation: d_M2 is a
    genuine non-residue; the point and its negation are true negatives under independent doubling;
    RFC 7748's own stated M1<->M2 birational map recovers u=5 exactly from the M2 point; and 2*l*(x,y)
    independently computes to the Edwards identity, confirming the true order is 2l. Both of the
    controls categories beyond the positive control (the parameter-matched Curve25519 negative and
    the same-shape null on both models, including the bit-decay sweep) are independently confirmed
    correct, with the decay checks showing the required monotone collapse to zero and no non-zero
    floor at any tested bit count -- ruling out the canonical artifact tell. One adversarial negative
    control of my own (a tampered candidate point and a tampered order l, both exercised in ephemeral
    process memory only and never written to any file) was correctly rejected by my independent
    implementation. Snapshot binding (hashes, commit reachability, declared parent, unchanged-since-
    snapshot content) verifies cleanly. No value from parameter-capsule.yaml's quarantined section 5
    leaked into the certificate, and no SafeCurves True/False comparison cell was emitted anywhere
    (P2 remains open), both independently confirmed.

