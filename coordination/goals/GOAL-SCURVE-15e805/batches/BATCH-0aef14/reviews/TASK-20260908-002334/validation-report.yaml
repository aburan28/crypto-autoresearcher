  additional_findings:
    - id: p25519-congruence-class-error
      observation: >-
        base-point-audit.yaml's `environment` field states: "Square roots via pow(a, (p+1)//4, p),
        valid because p == 3 (mod 4) for both p=2^448-2^224-1 and p25519=2^255-19 (both explicitly
        stated as congruent to 3 mod 4 in RFC 7748, or well known for p25519)."
      independent_verification: >-
        p25519 mod 4 = 1, NOT 3. RFC 7748 itself, at line 183 (independently re-fetched and
        re-located: "prime is congruent to 1 mod 4, and the derivation procedure in..."),
        EXPLICITLY states curve25519's prime is congruent to 1 mod 4 -- the opposite of what the
        producer's environment note claims RFC 7748 says. Only curve448's prime (line 244: "prime is
        congruent to 3 mod 4") is actually congruent to 3 mod 4. This is a confirmed factual error,
        directly falsifiable from the identical hash-pinned raw document the producer themselves
        fetched.
      impact_assessment: >-
