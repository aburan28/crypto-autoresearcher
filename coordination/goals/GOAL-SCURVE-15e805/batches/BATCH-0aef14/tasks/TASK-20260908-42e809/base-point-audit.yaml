    which_condition: 'l*B != O (l*B = the order-2 point (0,p-1), not the identity)'
    all_other_falsifier_conditions_across_all_rows: not triggered (on-curve checks all PASS, Hasse uniqueness all PASS, twist-null and random-null all correctly fail/pass as required)

  honest_limitation: >-
    Per L3's own honest_limitation: this audit certifies each base point
    RELATIVE TO the declared l transcribed from the RFCs; it does NOT prove l
    is prime (that is lane D1, not executed in this task) or that #E = h*l in
    general beyond the stated Hasse-uniqueness argument (which itself
    presupposes l is prime and l > 4*sqrt(p) -- both structural facts about
    the transcribed l were not independently re-verified for primality in
    this task). L3 and D1 are jointly load-bearing; L3 alone, as executed
    here, does not establish #E. Additionally, the M2 finding above is a
    genuine measured base-point-order fact about ONE SPECIFIC (non-normalized)
    literal reading of RFC 7748's stated coordinates under the standard a=1
    unified Edwards addition law with identity (0,1) -- it says nothing about
    M1's or M3's own certificates (both independently verified clean), and it
    is not evidence about curve448's or edwards448's suitability, safety, or
    the correctness of any deployed implementation (which would use a
    correctly normalized group law, not this task's naive reading).
