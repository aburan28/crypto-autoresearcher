    - id: M2_large_d_edwards_birational
      model_pinning: 'M2 (large-d Edwards, x^2+y^2=1+d*x^2*y^2, a=1, birationally equivalent to M1), per audit-plan.yaml model_pinning.objects.M2'
      source: SRC-RFC7748 (see raw-transcription.yaml)
      coordinates: {x: '345397493039729516374008604150537410266655260075183290216406970281645695073672344430481787759340633221708391583424041788924124567700732', y: '363419362147803445274661903944002267176820680343659030140745099590306164083365386343198191849338272965044442230921818680526749009182718'}
      d: '611975850744529176160423220965553317543219696871016626328968936415087860042636474891785599283666020414768678979989378147065462815545017'
      declared_l: same as M1 (RFC7748 states identical hex order for M2 as for M1; see raw-transcription.yaml)
      declared_h: 4
      on_curve_check:
        lhs_x2_plus_y2_mod_p: '191763439104396085503629283988751603136947766343638191608086674721643482540289104578004621757708338912486452207912644383745047287215135'
        rhs_1_plus_dx2y2_mod_p: same value
        result: PASS (equal)
      non_identity: PASS (not (0,1))
      l_times_B_equals_O:
        result: FAIL
        detail: >-
          l * (x,y) = (0, p-1), i.e. the order-2 point (0,-1), NOT the
          identity (0,1). This is the falsifier condition stated in L3
          ("l*B != O").
      diagnostic_follow_up_measured_not_a_transcription_defect: >-
        Independent checks (all computed in this session, not assumed): (1)
        d is a quadratic non-residue mod p (checked directly), ruling out the
        obvious "curve degenerate because d is a square" explanation for a
        broken addition law. (2) The given (x,y) and its algebraic negation
        (-x mod p, y) were both confirmed on-curve and confirmed to be true
        negatives of each other via independent doubling (2*(x,y) and
        2*(-x,y) produced coordinates that are themselves negatives of one
        another). (3) Applying RFC 7748's own stated birational map
        (u,v)=((y-1)/(y+1), sqrt(156324)*u/x) to the given (x,y) recovers
        u=5 exactly, i.e. the given Edwards point does correspond (up to sign,
        which does not affect order) to the same underlying curve448
        Montgomery point (5, V(P)) that M1 already certified as order l. (4)
        2*l*(x,y) was computed directly and equals the Edwards identity
        (0,1), confirming the point's TRUE order is exactly 2*l, not l.
      root_cause_identified_as_measurement_not_capsule_corruption: >-
        RFC 7748's stated forward birational map, as u -> infinity (the
        Montgomery point at infinity / group identity), sends y = (1+u)/(1-u)
        -> -1, i.e. this specific map sends the MONTGOMERY IDENTITY to the
        EDWARDS POINT (0,-1) -- the order-2 point -- rather than to the
        Edwards curve's own chosen identity (0,1). This is a known property
        of this particular (non-normalized) birational correspondence: it is
        an isomorphism of the underlying curves as varieties, but the
        specific affine coordinate chart given identifies the group identity
        with a 2-torsion translate, so scalar multiples computed with (0,1)
        as the Edwards zero differ from the corresponding Montgomery scalar
        multiples by that translation. This explains, with an independently
        verified mechanism, why M1's l*B=O holds while M2's naively-computed
        l*B=O does not, without invoking or needing to invoke retrieval
        corruption (capsule conflict C1) as the explanation.
      hasse_interval_uniqueness:
        h_times_l: same as M1 row (identical p, h, l)
        result: PASS (unique) -- this check does not depend on the base point and is unaffected by the finding above.
      falsifier_triggered: true
      outcome_interpretation_applied: >-
        None of L3's three named outcome_interpretations (all_candidates_agree
        / candidates_differ_but_all_verify / some_candidate_fails ->
        Explanation A/B/C) cleanly fits this row: Explanation C anticipates
        "transcription defect... or documentary inconsistency", but the
        diagnostic work above affirmatively rules out transcription defect
        (the digits check out against RFC7748's own birational-map identity,
        computed independently) and there is no documentary inconsistency
        between RFC7748 and itself. This is reported as a FOURTH, measured
        outcome outside the plan's anticipated taxonomy: a group-law
        identity-point mismatch intrinsic to this specific (non-normalized)
        birational chart, not a transcription or documentary defect. This
        observation is preserved as-is per AGENTS.md's requirement to record
        unexpected observations, including ones outside a plan's anticipated
        categories, rather than force-fitting or discarding it.

