base_point_audit:
  task_id: TASK-20260908-42e809
  lane: L3 (audit-plan.yaml, TASK-20260824-233cd4)
  criterion: base
  claim_status: >-
    MEASUREMENT ONLY. No curve attack was run, no experiment record was
    created, and no statement is made or implied about whether
    Ed448-Goldilocks (or curve448, or the birational large-d Edwards model)
    is safe, unsafe, vulnerable, or free of vulnerabilities. This is a
    base-point certificate per L3's own certificate_or_bound schema, checked
    against L3's own falsifier and outcome_interpretations only. No
    SafeCurves True/False comparison cell is emitted anywhere below
    (global precondition P2 stays open).
  values_used: >-
    Every numeric value below is taken exclusively from
    raw-transcription.yaml (this task), which cites an exact line number in a
    sha256-hashed raw fetch of RFC 7748 or RFC 8032. No value from
    parameter-capsule.yaml section 5 (USE_PROHIBITED) was used anywhere in
    this certificate.
  environment: >-
    Pure Python 3 (arbitrary-precision int), no external libraries. Modular
    inverse via pow(x, p-2, p) (Fermat, valid since p is prime). Square roots
    via pow(a, (p+1)//4, p), valid because p == 3 (mod 4) for both p=2^448-2^224-1
    and p25519=2^255-19 (both explicitly stated as congruent to 3 mod 4 in
    RFC 7748, or well known for p25519).
  arithmetic_wall_clock_seconds_measured: 2.39
  budget_stated_in_lane: 'production_seconds: 300, verification_seconds: 10 (order-of-magnitude estimate, per audit-plan.yaml)'
  budget_compliance: 'Measured 2.39s is well within the 300s order-of-magnitude budget; no stopping-rule invocation was needed.'
  random_seed: 20260908
  scalar_multiplication_methods:
    montgomery_model: >-
      X-only Montgomery ladder, taken from RFC 7748 section 5's own
      pseudocode (x_2,z_2,x_3,z_3,cswap loop with a24=(A-2)/4), with one
      declared deviation: instead of performing the RFC's final step
      "Return x_2 * (z_2^(p-2))" (which collapses the point at infinity O and
      the finite affine point (0,0) to the same output value 0, because
      0^(p-2) mod p = 0), this implementation reports the raw projective pair
      (x_2, z_2) and defines "scalar*P == O" as "z_2 mod p == 0". This
      removes the ambiguity between O and (0,0) that the RFC's own division
      step introduces, and is necessary for a correct l*B=O test (used for
      curve448/M1 and the Curve25519 parameter-matched negative control).
    edwards_model: >-
      Standard complete twisted-Edwards unified addition law for a=1 curves
      (x^2+y^2=1+d*x^2*y^2): x3=(x1*y2+y1*x2)/(1+d*x1*x2*y1*y2),
      y3=(y1*y2-x1*x2)/(1-d*x1*x2*y1*y2), identity=(0,1), used inside a
      standard binary (double-and-add) scalar multiplication written for
      this task. Used for M2 (large-d Edwards) and M3 (edwards448).

  candidates:
