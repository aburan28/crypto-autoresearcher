    same_shape_null_control:
      requirement: >-
        "A point sampled on the QUADRATIC TWIST... must fail the on-curve
        check. Additionally: 1000 random (x,y) pairs..., expected number
        passing ~0... DECAY CHECK: pass rate as a function of randomised
        coordinate bits must fall to zero immediately." (audit-plan.yaml
        L3.controls.same_shape_null)
      M1_montgomery:
        quadratic_twist_point:
          construction: >-
            u=6 chosen because u^3+A*u^2+u mod p is a quadratic non-residue
            (checked directly), i.e. u=6 has no valid v on curve448 itself --
            it is genuinely a point on the quadratic twist. Presented with an
            arbitrary v=1 against curve448's own on-curve test.
          on_curve_check_result: FAIL (as required)
          expected: false
          control_behaved_as_required: true
        random_pairs:
          n: 1000
          pass_count: 0
          expected_approx: 2.75e-132
          control_behaved_as_required: true
        decay_check_pass_rate_by_low_bits_randomized:
          '0': 1.0
          '1': 0.47
          '2': 0.2
          '4': 0.07
          '8': 0.005
          '16': 0.0
          '32': 0.0
          '64': 0.0
          '128': 0.0
          '224': 0.0
          '448': 0.0
        decay_requirement_met: >-
          true -- pass rate falls from 1.0 at 0 bits randomized to 0.0 by 16
          bits randomized, with no non-zero floor at higher bit counts
          (checked up to full 448-bit randomization). This rules out the
          "artifact tell" the plan warns about (a non-decaying floor would
          mean the on-curve check is not evaluating the equation).
      M3_edwards:
        quadratic_twist_point:
          construction: >-
            x=2 chosen because (1-x^2)/(1-d*x^2) mod p (the y^2 value implied
            by the curve equation at that x) is a quadratic non-residue, i.e.
            no valid y exists on edwards448 for x=2 -- point genuinely lies
            off-curve / on the twist side. Presented with arbitrary y=1
            against edwards448's own on-curve test.
          on_curve_check_result: FAIL (as required)
          expected: false
          control_behaved_as_required: true
        random_pairs:
          n: 1000
          pass_count: 0
          expected_approx: 2.75e-132
          control_behaved_as_required: true
        decay_check_pass_rate_by_low_bits_randomized:
          '0': 1.0
          '1': 0.535
          '2': 0.245
          '4': 0.06
          '8': 0.0
          '16': 0.0
          '32': 0.0
          '64': 0.0
          '128': 0.0
          '224': 0.0
          '448': 0.0
        decay_requirement_met: true
      overall_result: PASS on both models -- quadratic-twist points correctly fail, random pairs correctly pass at ~0 rate, and pass rate correctly decays to (and stays at) 0.

  controls_ran_before_findings_believed: >-
    True. Per global precondition P4, all three controls above were executed
    in the same session as, and are reported alongside (not after) the
    per-candidate certificates, and this file states their PASS outcomes
    explicitly so that the M1 and M3 PASS results, and the M2 FAIL result,
    are read as findings only in light of a demonstrated-working instrument.

  falsifier_summary:
    L3_falsifier_text: >-
      "Any sourced candidate failing the on-curve check (transcription alarm)
      or l*B != O; or more than one multiple of l in the Hasse interval...;
      or a twist point passing the on-curve null." (audit-plan.yaml)
    triggered: true
