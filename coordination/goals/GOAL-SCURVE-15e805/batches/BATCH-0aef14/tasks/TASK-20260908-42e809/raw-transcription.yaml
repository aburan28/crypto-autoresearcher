  cross_check_M3_RFC7748_vs_RFC8032:
    method: >-
      Both documents' digit strings were parsed independently in Python
      (concatenating the exact line-wrapped fragments transcribed above, with
      no manual retyping of the concatenated result) and compared as integers.
    result:
      X_match: true
      Y_match: true
      order_match: >-
        true (RFC8032's L, computed as 2^446 minus the decimal subtrahend
        given in Table 2, equals RFC7748's l derived from the hex subtrahend:
        both equal 181709681073901722637330951972001133588410340171829515070372549795146003961539585716195755291692375963310293709091662304773755859649779)
    conclusion: >-
      For the M3 (edwards448/Ed448-Goldilocks) model, RFC 7748 and RFC 8032
      cite the IDENTICAL base point and order -- RFC 8032 explicitly defers to
      RFC 7748 for these values ("... of edwards448 in [RFC7748]") rather than
      independently sourcing them, so this is confirmation of internal
      consistency within one documentary lineage, not two independent
      documentary families. This is a genuine measured agreement, not a
      resolution of capsule conflict C5 (see below).

  capsule_conflict_C5_status: >-
    C5 anticipated that curve448's Montgomery base point (M1) and
    edwards448's Edwards base point (M3) might be the SAME published point or
    DIFFERENT ones, since ePrint 2015/625 records a "pre-rotation" base point
    for an earlier version of Goldilocks. Both RFC 7748 and RFC 8032 give only
    the POST-rotation values (there is exactly one X(P),Y(P) pair for
    edwards448 in both documents, and one U(P),V(P) pair for curve448). No
    alternate/pre-rotation coordinates for either model appear anywhere in the
    raw text of either RFC. M1 and M3 are DIFFERENT MODELS (Montgomery vs.
    Edwards, related by a 4-isogeny per RFC7748 line 300 "Both of those
    curves are also 4-isogenous to the following Edwards curve"), so per
    model_pinning.NOT_invariant_across_M1_M3 in audit-plan.yaml their base
    points are reported as separate rows and never asserted to be "the same
    point" -- they are not even points on the same curve. Within its own
    model, M3's base point is internally self-consistent across both RFCs (see
    cross-check above).

