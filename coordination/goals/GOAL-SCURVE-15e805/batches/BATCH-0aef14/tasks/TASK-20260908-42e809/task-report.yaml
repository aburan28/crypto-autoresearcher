  role: executor
  what_ran: >-
    (1) Raw-fetched RFC 7748 and RFC 8032 via `curl -s -o <file> <url>`
    (never a summarizing fetch tool), confirmed HTTP 200 on both, computed
    sha256 of each raw file, and transcribed every L3-relevant value (field
    prime, curve448 Montgomery A/base point/order/cofactor, the large-d
    birational Edwards d/base point, and edwards448's d/base point/order/
    cofactor) with exact line citations into raw-transcription.yaml. This
    discharges capsule successor requirement SR1 (audit-plan.yaml global
    precondition P1) for lane L3 specifically. (2) Executed lane L3 exactly
    as specified in audit-plan.yaml: certified all three sourceable base-
    point candidates (M1 curve448 Montgomery, M2 large-d birational Edwards,
    M3 edwards448/Goldilocks) for on-curve validity, non-identity, l*B=O via
    a from-scratch scalar multiplication (x-only Montgomery ladder for M1,
    complete twisted-Edwards addition for M2/M3), and Hasse-interval
    uniqueness of h*l; ran all three of L3's declared controls (positive:
    order-4 and order-2l constructed points; parameter-matched negative:
    Curve25519 base point through the identical Montgomery code path;
    same-shape null: quadratic-twist points and 1000 random (x,y) pairs plus
    a bit-randomization decay check) on both the M1 and M3 models before
    treating any candidate result as a finding, per global precondition P4.
    Total arithmetic wall-clock time measured: 2.39 seconds, well inside the
    lane's stated 300-second order-of-magnitude budget; no stopping-rule
    invocation was needed anywhere in this task.

  key_finding_summary: >-
    M1 (curve448 Montgomery, RFC 7748) and M3 (edwards448/Ed448-Goldilocks,
    RFC 7748 and RFC 8032 cross-checked identical) both certify cleanly:
    on-curve, non-identity, l*B=O, Hasse-interval-unique -- no falsifier
    condition triggered for either. M2 (the large-d birational Edwards model,
    also given in RFC 7748) triggers L3's falsifier: its literally-transcribed
    base point has l*B = the order-2 point (0,p-1), not the identity, so its
    TRUE order is 2*l, not l. This was diagnosed, not merely observed: three
    independent cross-checks (d is a non-residue so the curve genuinely has a
    complete addition law; the point's negation is self-consistent under
    doubling; and RFC 7748's own stated birational map recovers curve448's
    u=5 exactly from this point) all confirm the transcription is correct and
    the point really does correspond to the same underlying curve448 point up
    to sign -- the mismatch is explained by this specific birational chart
    mapping the Montgomery identity to the Edwards point (0,-1) rather than
    to (0,1). This is reported as a measured, mechanism-identified finding
    outside L3's three anticipated outcome_interpretations (it is not a
    transcription defect and not a cross-document inconsistency), per
    AGENTS.md's instruction to preserve unexpected observations rather than
    force-fit or discard them. Full detail: base-point-audit.yaml.

