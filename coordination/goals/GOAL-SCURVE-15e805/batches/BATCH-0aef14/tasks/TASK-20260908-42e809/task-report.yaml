  no_safety_or_vulnerability_claim: >-
    This task makes no statement, and implies none, about whether curve448,
    the large-d birational Edwards curve, or edwards448/Ed448-Goldilocks is
    safe, unsafe, vulnerable, or free of vulnerabilities. The M2 finding
    above is a base-point group-law bookkeeping fact about one specific,
    non-normalized literal reading of RFC 7748's coordinates; it is not a
    weakness of any curve, is not an attack, and is not a criterion pass/fail
    against any named security requirement. No curve attack was run, no
    private key was tested, requested, stored, or derived, and no experiment
    record was created.

  deviations_from_protocol: >-
    One declared deviation from RFC 7748's own pseudocode: the Montgomery
    ladder's final step was changed from "return x2 * z2^(p-2)" (RFC 7748
    section 5) to "report (x2, z2) and treat z2==0 as O", because the RFC's
    own division step collapses O and the finite point (0,0) to the same
    output. This is documented in base-point-audit.yaml
    (scalar_multiplication_methods.montgomery_model) and does not change
    which candidates pass or fail any check -- it is required to make the
    l*B=O test well-defined at all. No other deviation from audit-plan.yaml's
    lane L3 specification occurred. M2 (the large-d Edwards row) was
    certified in addition to the two candidates named as a minimum in the
    task handoff (M3 edwards448, M1 curve448), because its parameters were
    fully retrievable from the same raw-fetched document; this is an
    enumeration of an additional sourceable candidate as instructed by L3's
    mechanism ("enumerate the candidate base points"), not a deviation.

