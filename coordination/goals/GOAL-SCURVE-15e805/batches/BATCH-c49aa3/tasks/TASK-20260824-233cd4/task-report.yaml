  declarations:
    curve_attack_run: false
    curve_attack_statement: >-
      NO CURVE ATTACK OF ANY KIND WAS RUN, ATTEMPTED, OR IMPLEMENTED during this
      task. No discrete logarithm was computed, no scalar multiplication was
