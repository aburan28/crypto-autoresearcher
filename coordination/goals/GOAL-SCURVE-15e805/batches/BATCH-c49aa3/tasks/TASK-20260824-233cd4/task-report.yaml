  # ------------------------------------------------------------------
  # COMPLETION GATE
  # ------------------------------------------------------------------
  completion_gate:
    - item: The parameter capsule distinguishes user intake from retrieved primary or authoritative sources and records provenance and unresolved conflicts.
      met: true
      how: >-
        The capsule separates section 1 (intake, flagged `is_evidence: false`)
        from section 3 (retrieved structural facts F1-F8, each with its source
        ids and cross-source agreement count) and section 5 (quarantined digit
        strings). Section 2 records every source attempted with an explicit
        `provenance` of retrieved or unretrieved, including the SafeCurves pages
        that returned HTTP 502 and the ePrint PDF body that could not be
        rendered. Six conflicts C1-C6 are recorded, all as unresolved, with
        resolution routes. A `citation_provenance_ledger` marks every reference
        `retrieved`, `internal`, `recalled`, or `unretrieved`; no recalled
        reference was promoted.
    - item: The audit plan covers every one of the eleven criteria in the declared category, with a certificate or explicit bound, controls, falsifier, budget, and stopping rule.
      met: true
      how: >-
        Eleven lanes L1-L11, each carrying `category` matching the goal's
        `criterion_categories` (field/equation/base under
        basic_parameter_requirements; rho/transfer/disc under
        ecdlp_security_requirements; rigid/ladder/twist/complete/ind under
        ecc_security_beyond_ecdlp), and each carrying mechanism,
        quantitative_prediction, certificate_or_bound, controls, budget,
        stopping_rule, falsifier, honest_limitation and outcome_interpretations.
        Nine lanes emit a succinct third-party-verifiable certificate; L5 and L6
        emit explicit bounds whose non-succinct verification cost is stated
        rather than concealed.
    - item: The plan covers every declared additional diagnostic, or records a concrete reason and successor condition for a deferred diagnostic.
      met: true
      how: >-
        All eight declared diagnostics appear as D1-D8. Six are fully planned
        (D4 is discharged by L5 and L9 as a declared SPECIALIZATION of
        IDEA-20260807-98a970, not a duplicate). Two carry a named partial
        deferral: D5's class number and full conductor structure (reason:
        450-bit factorisation plus an absent class-group engine; successor
        condition: L6's factorisation completing and an executor probe
        confirming an engine) and D8's base-point derivation rule (reason:
        capsule conflict C5, the ePrint body was not renderable; successor
        condition: SR3). L7's full 448-bit enumeration is likewise deferred with
        a named obstruction, an order-of-magnitude cost estimate labelled as an
        estimate, and three sub-lanes L7a/L7b/L7c that run without it.
    - item: Positive, parameter-matched negative, and same-shape null controls are explicit and run before belief in any later task.
      met: true
      how: >-
        Every one of the nineteen lanes carries all three control types under
        `controls`, with matching assumptions stated for each
        parameter_matched_negative. Global precondition P4 makes running them
        BEFORE belief a blocking rule for every lane without exception, and the
        ranking places the control battery at Tier 0, ahead of all measurement.
        Ten lanes additionally carry an explicit DECAY CHECK - the signal
        reported as a function of the parameter meant to destroy it - and three
        controls are marked as VOIDING their lane if they fail (D7's
        known-incomplete-formula control, L11's biased-encoder control, L7's
        rule-shuffle null). The handoff's constraint that the Anomalous and
        BN(2,254) rows are positive-control CANDIDATES requiring their own
        sourced reproduction is honoured: lanes L5, L6 and D3 declare the
        dependency and fall back to locally generated synthetic planted
        positives, reporting themselves CONTROLLED-BY-SYNTHETIC rather than
        claiming the named rows.
    - item: The report states that no curve attack ran and makes no safety or vulnerability conclusion.
      met: true
      how: See `declarations.curve_attack_statement` and `declarations.safety_conclusion_statement` above.

  # ------------------------------------------------------------------
  # UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ------------------------------------------------------------------
  unresolved_conflicts:
    summary_count: 6
    intake_vs_retrieved:
      - id: C3
        statement: >-
          The intake tuple (name, equation, modulus, attribution) is
          UNDER-DETERMINED relative to what the eleven criteria require. It
          supplies no base point, order, cofactor, twist order or curve model,
          while the `base`, `rho`, `twist` and `ladder` criteria are statements
          about exactly those. This is an incompleteness of the intake, not a
          disagreement with any source.
        adjudication: none attempted; recorded and routed to lanes L3, L4, L9 which must each declare the tuple they audited.
      - id: C4
        statement: >-
          The intake name "Ed448-Goldilocks" plus the equation
          x^2+y^2 = 1-39081x^2y^2 matches what RFC 7748 and RFC 8032 call
          `edwards448`. RFC 7748 (retrieved) additionally distinguishes two
          other objects: `curve448` (Montgomery, A = 156326), to which
          edwards448 is 4-ISOGENOUS, and a third Edwards curve with a 135-digit
          d to which curve448 is BIRATIONALLY EQUIVALENT. Three related but
          non-identical objects share the informal name, and four of the eleven
          criteria are model-dependent.
        adjudication: none attempted; the plan pins a model per lane and adds diagnostic D6 to MEASURE the exceptional sets of the maps rather than assume interchangeability.
      - id: C5
        statement: >-
          IACR ePrint 2015/625's version note (retrieved) records that the base
          point was rotated to ensure prime order, so at least two base points
          have been published for this equation. The intake supplies none, so
          the `base` criterion has more than one candidate subject.
        adjudication: none attempted; L3 is specified to run per candidate as separate rows, with unretrieved candidates recorded as unretrieved.
      - id: C6a
        statement: >-
          The eleven intake True/False cells could NOT be reconciled against
          their nominal source, because safecurves.cr.yp.to returned HTTP 502
          Bad Gateway on five attempts across four URLs.
        adjudication: >-
          None attempted and none needed for this task. The intake was never
          evidence, so the audit proceeds by independently establishing each
          criterion and comparing to the preregistered target afterwards. What
          the 502 DOES block is C6b.
        classification: operational observation under AGENTS.md rule 5, never mathematical evidence.
    between_retrieved_sources_or_within_the_retrieval_channel:
      - id: C1
        statement: >-
          The only retrieval tool available returns a small-model SUMMARY rather
          than raw bytes, and that intermediary was observed within this session
          to return two mutually inconsistent values for the same field of the
          same URL (the curve448 base-point order, with hex tails differing in
          both value and length), to substitute the Edwards coefficient 39081
          for the Montgomery coefficient 156326, and to emit a "twist order" of
          2^448-2^226-1 that lies outside the Hasse interval and contradicts the
          cofactor stated in the same response.
        consequence: >-
          EVERY digit string obtained in this session is marked
          `digit_exactness: unverified` and quarantined in capsule section 5
          with `USE_PROHIBITED: true`. No lane may consume one until successor
          requirement SR1 (raw re-transcription with document hashes) is
          discharged.
        classification: operational observation about the retrieval channel. It is NOT evidence against RFC 7748, RFC 8032, or any source; the documents are not in question, the channel is.
      - id: C2
        statement: >-
          One fetch of RFC 8032 returned cofactor 2 for edwards448, while RFC
          7748 returned cofactor 4 for the 4-isogenous curve448 and the
          designer's project page states that the order and twist order are each
          4 times a prime.
        adjudication: >-
          DELIBERATELY NOT ADJUDICATED. Two of the three readings come from a
          channel already shown to corrupt numbers (C1), so a 2-to-1 vote would
          be a vote about the summarizer rather than about the documents.
        note_for_the_coordinator: >-
          GOAL-SCURVE-15e805 lists "Primary or authoritative sources leave an
          unresolved conflict in the named curve's parameter tuple" as a PAUSE
          CONDITION. In this reporter's judgement C2 does NOT yet meet it: the
          sources have not been shown to disagree, an intermediary has. The
          honest classification is RETRIEVAL DEBT, not source conflict, and it
          converts to a source conflict only if raw transcription under SR1
          reproduces it. The pause decision is the Coordinator's alone; this
          note records the distinction, not a recommendation to ignore it.
    what_was_NOT_in_conflict:
      - The field p = 2^448 - 2^224 - 1 as a symbolic expression: agreed by all three retrieved primary/authoritative sources and by the intake.
      - The Edwards coefficient d = -39081 as a short decimal: agreed by all three retrieved sources and by the intake, since 1 + (-39081)x^2y^2 is literally the intake's 1 - 39081x^2y^2.
      - The attribution to Hamburg: agreed by the ePrint record (2015) and the intake ("2014 Hamburg"). The two-digit year difference between the intake's "2014" and the ePrint's 2015 submission date is noted but is not a parameter conflict and was not pursued.

  # ------------------------------------------------------------------
  # LIMITATIONS OF THIS TASK
  # ------------------------------------------------------------------
  limitations:
    - id: LIM1
      statement: >-
        No shell tool was available in this session. Consequences: no raw
        `curl`/`wget` fetch, no sha256 of any retrieved document, no
        `tools/allocate_id.py`, no `orchestration.adapter doctor --probe`, and
        no verification of the inherited pure-Python environment assumption.
      classification: operational, not mathematical.
    - id: LIM2
      statement: >-
        No PDF renderer (`pdftoppm` absent), so the body of IACR ePrint 2015/625
        could not be read even though the file downloaded. It is recorded as
        UNRETRIEVED rather than paraphrased from memory.
      classification: operational, not mathematical.
    - id: LIM3
      statement: >-
        safecurves.cr.yp.to was unreachable (HTTP 502 on 5 attempts across 4
        URLs), so no SafeCurves criterion DEFINITION and no numeric THRESHOLD is
        sourced by this task. Every threshold appearing anywhere in the audit
        plan is marked `threshold_provenance: recalled` and may not be used to
        emit a pass/fail. This is the plan's global precondition P2.
      classification: operational, not mathematical.
    - id: LIM4
      statement: >-
        Every budget figure in the audit plan is an order-of-magnitude ESTIMATE
        explicitly labelled as such, including the "single-digit core-days"
        figure for L7's full enumeration. None is a measurement, and none may be
        cited as one. The plan names the single cheap measurement (time one SEA
        count at 448 bits) that would replace the largest of them.
    - id: LIM5
      statement: >-
        Novelty and duplication screening was performed by grep over
        `ledger/proposals/`, `ledger/`, `knowledge/` and `experiments/` for
        Ed448/Curve448/Goldilocks/39081/2^448. Three IDEA records mention
        Curve448 or Ed448 in curve LISTS with no values
        (IDEA-20260807-98a970, IDEA-20260807-e41559, IDEA-20260815-e0a428);
        only IDEA-20260807-98a970 was read in full, as the handoff's read_scope
        permits. The other two were NOT opened, because they lie outside the
        authoritative read_scope, and they are named here as pointers for the
        Coordinator rather than as screened records. The MCP knowledge-retrieval
        server (`search_knowledge`) was not available to this session, so corpus
        recall was grep-based and is a FLOOR, not an estimate.
      novelty_status_of_this_deliverable: >-
        adaptation. The audit methodology is a specialisation of
        IDEA-20260807-98a970's certificate discipline plus standard,
        long-established parameter-validation practice; nothing in these
        artifacts is claimed as a new mechanism. The one component this reporter
        would defend as non-obvious within this program is the L6/D5 rigorous
        partial-factorisation bound |D| >= F / v_F^2, which is elementary
        mathematics but is the difference between an honest monotone bound and
        an unfinishable computation, and it was not found in the corpus by the
        grep above. It is labelled `adaptation`, not novel.
    - id: LIM6
      statement: >-
        This reporter used the internal proposal IDEA-20260807-98a970 for
        embedding-degree, anomalous and full-torsion coverage as instructed, and
        did not duplicate it. The reuse is declared inline in lanes L5 and D4
        with an explicit statement of what is reused verbatim (the two
        certificate forms, the three degenerate checks, the planted small-k
        positives) and what is new (specialisation to this curve's l and l', and
        the 448-bit representability-wall figure).

  # ------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS
  # ------------------------------------------------------------------
  proposed_successor_handoffs:
    note: >-
      PROPOSALS ONLY. This role does not assign work, does not allocate task
      identifiers, and does not change any status. The Coordinator decides
      whether any of these is created.
    - proposed_role: executor
      proposed_objective: >-
        Discharge capsule successor requirements SR1 and SR2: fetch RFC 7748,
        RFC 8032, IACR ePrint 2015/625 and safecurves.cr.yp.to/verify.html as
        RAW BYTES with a shell, record sha256 per document, transcribe every
        parameter with its byte offset, and freeze the eleven SafeCurves
        criterion definitions and thresholds as a hashed artifact.
      why_first: >-
        It is the single binding item on this goal's critical path. Nineteen of
        nineteen lanes are gated on SR1 or SR2 or both, it costs minutes, and it
        is the only thing that can convert conflict C2 from retrieval debt into
        either a resolved value or a genuine source conflict (which would then
        engage the goal's pause condition).
      deliverable_shape: a raw-source transcription record with document hashes, plus a diff against capsule section 5's quarantined strings.
    - proposed_role: executor
      proposed_objective: >-
        Environment capability probe: report presence/absence and version of a
        point-counting engine (SEA), a factoring engine (ECM/NFS), a
        primality-certificate engine (ECPP), and a class-group engine; and time
        ONE SEA point count over a 448-bit prime field.
      why: >-
        Four deferrals and three engine-dependent lanes in the audit plan are
        conditioned on exactly these facts, and all of them are checkable in
        minutes. It also verifies or refutes the pure-Python environment
        assumption this plan INHERITED from IDEA-20260807-98a970 without
        verifying.
    - proposed_role: executor
      proposed_objective: Run the audit plan's Tier 0 control battery and Tier 1 lanes (L2, L3) once SR1 is discharged.
      why: >-
        Cheapest valid discriminator in the whole plan. L3 separates three
        preregistered explanations of the base-point ambiguity for seconds of
        compute, and the Tier 0 battery is what licenses believing anything
        downstream.
    - proposed_role: coordinator
      proposed_objective: >-
        Decide, ONCE for all twenty SafeCurves goals rather than per goal,
        whether an archived snapshot of safecurves.cr.yp.to is acceptable as a
        threshold source when the live site is unreachable, and if so how it
        must be labelled.
      why: >-
        The 502 is likely to affect every sibling goal identically. Deciding it
        twenty times risks twenty different answers, and the labelling rule
        (archived snapshot, never the live site) is a provenance question the
        Coordinator owns.
    - proposed_role: validator
      proposed_objective: Independently check that the three-way control specification in the audit plan is genuinely three-way, and in particular that each `parameter_matched_negative` states matching assumptions strong enough for the match to mean something.
      why: >-
        The controls are the plan's load-bearing element and were written by the
        same agent that wrote the lanes they control. A blind check of the
        control design, before any compute is spent, is cheap and is where this
        plan is most likely to be wrong.

