parameter_capsule:
  schema_version: '1.0'
  task_id: TASK-20260824-233cd4
  goal_id: GOAL-SCURVE-15e805
  question_id: RQ-SCURVE-4c75e3
  batch_id: BATCH-c49aa3
  role: idea-generator
  produced_at: '2026-08-25'
  curve_label_as_given: Ed448-Goldilocks
  claim_status: >-
    PLANNING RECORD. No curve attack was run, no experiment result was created,
    and no safety or vulnerability conclusion is asserted or implied by this
    capsule. Nothing here is evidence in the sense of AGENTS.md rules 4, 6 or 10.

  # ------------------------------------------------------------------
  # 1. INTAKE - user-supplied, UNVERIFIED, comparison target only
  # ------------------------------------------------------------------
  intake:
    provenance: user_supplied_unverified
    verification_status: unverified
    comparison_target_only: true
    is_evidence: false
    binding_note: >-
      Every True/False cell below is a PREREGISTERED COMPARISON TARGET supplied
      by the user. It is not evidence, may not be cited as evidence, and may not
      be used to adjudicate any retrieved source. It exists so that a later
      audit result can be compared against a target that was fixed in advance.
    curve: Ed448-Goldilocks
    equation: x^2+y^2 = 1-39081x^2y^2
    modulus: 2^448 - 2^224 - 1
    details: 2014 Hamburg
    expected_safe: true
    expected_criteria:
      field: true
      equation: true
      base: true
      rho: true
      transfer: true
      disc: true
      rigid: true
      ladder: true
      twist: true
      complete: true
      ind: true
    completeness_of_intake_tuple:
      supplied: [name, edwards_d_via_equation, field_modulus_expression, attribution]
      absent: [base_point, group_order, cofactor, twist_order, curve_model_pinned,
               trace_of_frobenius, cm_discriminant]
      consequence: >-
        The intake tuple is UNDER-DETERMINED for the `base`, `rho`, `twist` and
        `ladder` lanes. An equation plus a modulus does not fix a base point, and
        the SafeCurves `base` criterion is a statement about a base point. Any
        audit of those lanes must first pin the missing fields from a retrieved
        source and record which pinning it used (see conflict C3 and C4).

  # ------------------------------------------------------------------
  # 2. RETRIEVAL SESSION - what was actually fetched, and how
  # ------------------------------------------------------------------
  retrieval_session:
    performed_by: idea-generator subagent, TASK-20260824-233cd4
    date: '2026-08-25'
    tool: WebFetch / WebSearch through the session's configured agent proxy
    channel_integrity_warning: >-
      BLOCKING METHODOLOGICAL LIMITATION. The only retrieval tool available in
      this session returns a SMALL-MODEL SUMMARY of the fetched document, not the
      raw bytes. That intermediary was observed, within this session, to (a)
      return two mutually inconsistent values for the same field of the same URL
      on two fetches, (b) substitute the Edwards coefficient for the Montgomery
      coefficient, and (c) emit an arithmetically impossible twist order. See
      conflict C1. Consequently EVERY digit string in this capsule carries
      `digit_exactness: unverified` and is quarantined in section 5. No lane of
      the audit plan may consume a digit string from this capsule until it has
      been re-transcribed from a hash-pinned raw document by a successor task.
      This is an operational observation about the retrieval channel; under
      AGENTS.md rule 5 and the handoff constraints it is NOT mathematical
      evidence of anything about the curve.
    no_bash_available: >-
      This session held no shell tool, so no `curl`/`wget` raw fetch, no
      document hashing, and no `orchestration.adapter doctor --probe` was
      possible. Recorded as a limitation, not as a finding.

    sources_attempted:
      - id: SRC-RFC7748
        url: https://www.rfc-editor.org/rfc/rfc7748.txt
        title: 'RFC 7748: Elliptic Curves for Security (Langley, Hamburg, Turner)'
        provenance: retrieved
        retrieval_status: retrieved_via_summarizing_intermediary
        fetches: 3
        verified_by: idea-generator/TASK-20260824-233cd4
        digit_exactness: unverified
        role_in_audit: >-
          Authoritative for curve448 (Montgomery model, A, base point, order,
          cofactor) and for the stated relationship between curve448, the
          large-d Edwards curve, and edwards448/Goldilocks.

      - id: SRC-RFC8032
        url: https://www.rfc-editor.org/rfc/rfc8032.txt
        title: 'RFC 8032: Edwards-Curve Digital Signature Algorithm (EdDSA)'
        provenance: retrieved
        retrieval_status: retrieved_via_summarizing_intermediary_with_corruption
        fetches: 1
        verified_by: idea-generator/TASK-20260824-233cd4
        digit_exactness: unverified
        corruption_observed: >-
          The returned base-point coordinates were truncated and mixed decimal
          with hexadecimal characters; the returned cofactor contradicts
          SRC-RFC7748 and SRC-GOLDILOCKS-SF. See conflicts C1 and C2.
        role_in_audit: >-
          Authoritative for edwards448 (the untwisted Edwards model with
          d = -39081), its base point, and its base-point order L.

      - id: SRC-GOLDILOCKS-SF
        url: https://ed448goldilocks.sourceforge.net/
        title: Ed448-Goldilocks project page (Mike Hamburg)
        provenance: retrieved
        retrieval_status: retrieved_via_summarizing_intermediary
        fetches: 1
        verified_by: idea-generator/TASK-20260824-233cd4
        digit_exactness: not_applicable_no_long_digit_strings_returned
        role_in_audit: >-
          PRIMARY SOURCE FOR THE RIGIDITY / GENERATION-TRANSCRIPT LANE. This is
          the only retrieved source in this session that states a deterministic
          selection RULE for both p and d, which is what lane L7 and diagnostic
          D8 must re-execute.

      - id: SRC-EPRINT-2015-625
        url: https://eprint.iacr.org/2015/625
        title: 'Hamburg, "Ed448-Goldilocks, a new elliptic curve", IACR ePrint 2015/625'
        provenance: retrieved
        retrieval_status: metadata_and_abstract_page_only
        fetches: 2
        verified_by: idea-generator/TASK-20260824-233cd4
        full_text_status: unretrieved
        full_text_reason: >-
          The PDF was downloaded but this session has no PDF renderer
          (`pdftoppm` absent), so the body could not be read. Recorded as
          UNRETRIEVED rather than paraphrased.
        role_in_audit: >-
          Canonical citation for the curve. Carries a version note stating the
          base point was rotated to ensure prime order, which is the origin of
          conflict C5.

      - id: SRC-WIKIPEDIA-CURVE448
        url: https://en.wikipedia.org/wiki/Curve448
        title: Wikipedia, "Curve448"
        provenance: retrieved
        source_tier: tertiary_not_authoritative
        retrieval_status: retrieved_via_summarizing_intermediary
        verified_by: idea-generator/TASK-20260824-233cd4
        role_in_audit: >-
          POINTER ONLY. Used solely to locate further primary sources
          (NIST SP 800-186, FIPS 186-5). No value in this capsule rests on it.

    sources_attempted_and_not_retrieved:
      - id: SRC-SAFECURVES
        urls:
          - https://safecurves.cr.yp.to/
          - https://safecurves.cr.yp.to/index.html
          - https://safecurves.cr.yp.to/verify.html
          - https://safecurves.cr.yp.to/rigid.html
        also_listed_in_handoff_but_not_attempted_after_repeated_502:
          - https://safecurves.cr.yp.to/transfer.html
          - https://safecurves.cr.yp.to/disc.html
          - https://safecurves.cr.yp.to/ladder.html
          - https://safecurves.cr.yp.to/twist.html
          - https://safecurves.cr.yp.to/complete.html
          - https://safecurves.cr.yp.to/ind.html
        provenance: unretrieved
        observed: HTTP 502 Bad Gateway from the agent proxy on 5 attempts across 4 URLs
        classification: >-
          OPERATIONAL OBSERVATION under AGENTS.md rule 5 and the handoff's
          constraint on infrastructure errors. It is not evidence about
          SafeCurves, about the curve, or about the intake cells.
        consequences:
          - >-
            C6a. The eleven intake True/False cells remain UNRECONCILED against
            their nominal source. This is expected and not blocking: the intake
            is a comparison target, never evidence, so the audit proceeds by
            independently establishing each criterion and comparing afterwards.
          - >-
            C6b. The NUMERIC THRESHOLDS that define the SafeCurves criteria
            (verify.html) were not obtained. Every threshold used anywhere in
            the audit plan is therefore marked `threshold_provenance: recalled`
            and is NOT sourced by this task. A successor task must retrieve
            verify.html (or an archived snapshot, recorded as such) and freeze
            the thresholds before any lane emits a pass/fail against them.

  # ------------------------------------------------------------------
  # 3. WHAT THE RETRIEVED SOURCES SAY - structural claims only
  #    (no digit strings; those are quarantined in section 5)
  # ------------------------------------------------------------------
  retrieved_structural_facts:
    - id: F1
      statement: >-
        The prime field is p = 2^448 - 2^224 - 1.
      sources: [SRC-RFC7748, SRC-RFC8032, SRC-GOLDILOCKS-SF]
      cross_source_agreement: 3 of 3
      agrees_with_intake: true
      confidence_note: >-
        Agreement is on a short symbolic EXPRESSION, not on a 135-digit string,
        so the summarizing intermediary had little room to corrupt it. This is
        the single strongest item in the capsule and is still marked
        `digit_exactness: unverified` for the expanded decimal value.

    - id: F2
      statement: >-
        There is an untwisted Edwards curve x^2 + y^2 = 1 + d*x^2*y^2 over that
        field with d = -39081, named `edwards448` in RFC 7748 / RFC 8032 and
        `Ed448-Goldilocks` by its designer.
      sources: [SRC-RFC7748, SRC-RFC8032, SRC-GOLDILOCKS-SF]
      cross_source_agreement: 3 of 3
      agrees_with_intake: true
      note: >-
        1 + (-39081)*x^2*y^2 is literally the intake's 1 - 39081*x^2*y^2. The
        intake EQUATION is therefore corroborated by three retrieved sources at
        the level of the coefficient's short decimal form.

    - id: F3
      statement: >-
        RFC 7748 specifies a Montgomery curve `curve448`, v^2 = u^3 + A*u^2 + u,
        with A = 156326, cofactor 4, and base point u-coordinate 5.
      sources: [SRC-RFC7748]
      cross_source_agreement: >-
        2 of 3 fetches of SRC-RFC7748 returned A = 156326; the dissenting fetch
        returned 39081, which is explainable as the summarizer substituting the
        Edwards coefficient d for the Montgomery coefficient A (it also emitted
        an impossible twist order in the same response). Recorded as a
        retrieval-channel artifact, not as a source disagreement.
      digit_exactness: unverified

    - id: F4
      statement: >-
        RFC 7748 relates curve448 to TWO DISTINCT Edwards curves with two
        DIFFERENT relationship phrases: it is "birationally equivalent" to an
        Edwards curve with a large d (a 135-digit value), and "4-isogenous" to
        edwards448 / Goldilocks with d = -39081.
      sources: [SRC-RFC7748]
      cross_source_agreement: 1 of 1 targeted fetch
      why_this_matters: >-
        Birational equivalence and 4-isogeny are different relations. The three
        objects - curve448, the large-d Edwards curve, and edwards448 - are
        related but not identical, and the SafeCurves criteria `base`, `ladder`,
        `complete` and `ind` are MODEL-DEPENDENT. This is the root of conflict
        C4 and is the single item that most changes what the audit is auditing.

    - id: F5
      statement: >-
        The designer's stated selection rule for d is: the least coefficient in
        absolute value which gives a curve whose order and whose twist order are
        each 4 times a prime.
      sources: [SRC-GOLDILOCKS-SF]
      cross_source_agreement: 1 of 1
      why_this_matters: >-
        This is a DETERMINISTIC, RE-EXECUTABLE rule, which is exactly what the
        `rigid` criterion is about. It converts lane L7 from an opinion into a
        computation with a definite falsifier (any |d| < 39081 satisfying the
        rule). It also directly implies cofactor 4 on both the curve and its
        twist, which is the ground for conflict C2.

    - id: F6
      statement: >-
        The designer's stated selection rule for p is: a golden-ratio Solinas
        prime of the form 2^n - 2^(n/2) - 1, with n constrained to the 384-512
        bit range for security, n = 448 chosen for 32-bit-machine compatibility,
        and a preference that the curve order be less than p.
      sources: [SRC-GOLDILOCKS-SF]
      cross_source_agreement: 1 of 1
      why_this_matters: >-
        Combined with F5 this is a complete generation transcript with a small,
        countable number of free choices - the auditable object for L7 / D8.

    - id: F7
      statement: >-
        IACR ePrint 2015/625 carries a version note that the base point was
        rotated to ensure prime order.
      sources: [SRC-EPRINT-2015-625]
      cross_source_agreement: 1 of 1 (abstract/metadata page only)
      why_this_matters: >-
        It establishes that AT LEAST TWO base points have been published for
        this equation over its history. Since the intake supplies no base point,
        the `base` lane has more than one candidate subject. Origin of C5.

    - id: F8
      statement: >-
        RFC 8032 specifies Ed448 over the curve it names `edwards448`, with the
        equation of F2 and the field of F1.
      sources: [SRC-RFC8032]
      cross_source_agreement: 1 of 1
      digit_exactness: unverified
      caveat: >-
        The same fetch returned a cofactor value contradicting F3 and F5 and
        returned corrupted base-point coordinates. Only the structural statement
        above is carried forward; every numeric field from this fetch is
        quarantined.

  # ------------------------------------------------------------------
  # 4. CONFLICTS AND UNRESOLVED ITEMS
  # ------------------------------------------------------------------
  conflicts:
    - id: C1
      title: Retrieval-channel corruption (intake-independent)
      type: source_channel_integrity
      status: unresolved_in_this_task
      description: >-
        Three fetches of https://www.rfc-editor.org/rfc/rfc7748.txt returned
        mutually inconsistent content: two different strings for the order of
        the base point, two different values for the Montgomery coefficient
        (156326 vs 39081), and in one response a "twist order" of 2^448-2^226-1
        alongside "cofactor 4", which cannot both hold. A fourth fetch of the
        same URL refused verbatim quotation entirely on a length policy.
      classification: >-
        Operational observation, never mathematical evidence, and never evidence
        against RFC 7748. The RFC is not in question; the channel is.
      resolution_route: >-
        A successor task with a shell fetches the raw documents, records
        sha256 of each, and transcribes values from the raw bytes. Until then
        no digit string from this capsule enters any computation.
      blocks: [L1, L3, L4, L5, L6, L9, D1, D2, D3, D5]

    - id: C2
      title: Cofactor of edwards448 - 4 (RFC 7748 + designer) vs 2 (one RFC 8032 fetch)
      type: numeric_conflict_between_retrieved_sources
      status: unresolved_in_this_task
      description: >-
        SRC-RFC7748 states cofactor 4 for curve448; SRC-GOLDILOCKS-SF states the
        order and twist order are each 4 times a prime; one fetch of SRC-RFC8032
        returned cofactor 2 for edwards448.
      adjudication_in_this_task: NONE. Deliberately not adjudicated.
      why_not_adjudicated: >-
        Two of the three readings come from a channel already demonstrated to
        corrupt numbers (C1), so a 2-to-1 vote here would be a vote about the
        summarizer, not about the documents. Recording an adjudication on that
        basis would be exactly the kind of unearned resolution AGENTS.md rule 5
        forbids. The honest state is "unresolved pending raw transcription."
      note_on_goal_pause_condition: >-
        GOAL-SCURVE-15e805 lists "Primary or authoritative sources leave an
        unresolved conflict in the named curve's parameter tuple" as a pause
        condition. This conflict does NOT yet meet it: the sources have not been
        shown to disagree - a summarizing intermediary has. The distinction is
        the whole point of C1, and the Coordinator should treat C2 as a
        RETRIEVAL debt, not a source conflict, unless raw transcription
        reproduces it.
      resolution_route: same as C1, plus an independent recomputation of 4*L vs p+1-t.

    - id: C3
      title: Intake tuple is under-determined
      type: intake_incompleteness
      status: unresolved_in_this_task
      description: >-
        The intake supplies name, equation, modulus and attribution only. It
        supplies no base point, order, cofactor or twist order. The SafeCurves
        `base` criterion, the `rho` cost, and the `twist` criterion are all
        statements about objects the intake does not name.
      consequence_for_the_audit: >-
        Each of L3, L4, L9 must declare, in its own record, WHICH pinned tuple
        it audited and from which source, and must report its result as scoped
        to that pinning. A result reported against "Ed448-Goldilocks" without a
        pinned base point would be unscoped in the sense of AGENTS.md rule 4.

    - id: C4
      title: Three related but non-identical objects share the name
      type: object_identity_ambiguity
      status: unresolved_in_this_task
      description: >-
        Per F4, RFC 7748 distinguishes (i) curve448, Montgomery, A = 156326;
        (ii) an Edwards curve with a large d, birationally equivalent to (i);
        (iii) edwards448 / Goldilocks, d = -39081, 4-isogenous to (i). The
        intake equation matches (iii). The `ladder` criterion is naturally about
        (i); `complete` and `ind` are model-dependent; `rho`, `transfer`, `disc`
        and `twist` are isogeny-invariant or nearly so and transfer between
        them, but the cofactor structure and the small-subgroup picture do not
        transfer for free across a 4-isogeny.
      consequence_for_the_audit: >-
        The audit plan carries an explicit MODEL PINNING declaration per lane
        (see audit-plan.yaml `model_pinning`), and D6 exists precisely to
        measure the exceptional sets of the maps between (i), (ii) and (iii)
        rather than to assume they are interchangeable.

    - id: C5
      title: More than one published base point for the same equation
      type: source_provenance_gap
      status: unresolved_in_this_task
      description: >-
        SRC-EPRINT-2015-625 records that the base point was rotated to ensure
        prime order. The original Goldilocks base point could not be read
        because the PDF body was not renderable in this session.
      consequence_for_the_audit: >-
        L3 must be run against every candidate base point that can be sourced,
        as separate rows, and must report which candidates were sourced and
        which remain unretrieved. Reporting a single `base: pass` row would
        conceal the ambiguity.

    - id: C6
      title: SafeCurves unreachable - intake cells and criterion thresholds unsourced
      type: source_unavailable
      status: unresolved_in_this_task
      description: See `sources_attempted_and_not_retrieved.SRC-SAFECURVES`.
      consequence_for_the_audit: >-
        (a) The eleven intake cells stay unreconciled with their nominal source;
        this does not block the audit because the intake was never evidence.
        (b) Every numeric criterion threshold in the audit plan is marked
        `threshold_provenance: recalled` and may not be used to emit a pass/fail
        until frozen from a retrieved source.

  unresolved_conflict_summary:
    count: 6
    blocking_for_this_task: false
    blocking_for_certificate_emission: true
    rationale: >-
      This task's deliverable is a sourced capsule and a falsifiable plan, and
      both are complete with the conflicts recorded. What the conflicts block is
      the NEXT step: no lane may emit a certificate against a digit string or a
      threshold that is still quarantined here.

  # ------------------------------------------------------------------
  # 5. QUARANTINE - retrieved digit strings, NOT usable
  # ------------------------------------------------------------------
  unverified_retrieval_transcript:
    USE_PROHIBITED: true
    why_recorded_anyway: >-
      A successor task that re-transcribes from raw bytes should be able to DIFF
      against what the summarizing channel returned. A silent discrepancy at
      that point is direct evidence about the channel and is worth catching.
      These strings are recorded for that diff and for no other purpose.
    guard: >-
      Any downstream record that consumes a value from this section without
      first re-transcribing it from a hash-pinned raw document is in violation
      of AGENTS.md rule 5, and this capsule names that violation in advance.
    entries:
      - field: curve448_base_point_order
        source: SRC-RFC7748
        fetch_1_returned: '2^446 - 0x8335dc163bb124b65129c96fde933d8d723a70aadc873d6d54a7bb0d'
        fetch_2_returned: '2^446 - 0x8335dc163bb124b65129c96fde933d8d723a70dddf86c08ff8d2d1ff8d5c4e20'
        internal_inconsistency: >-
          The two hex tails differ in both value and LENGTH (56 vs 64 hex
          digits). A 64-hex-digit tail is ~256 bits, which is inconsistent with
          a ~446-bit order minus a ~224-bit correction. Neither is usable.
        digit_exactness: unverified
      - field: curve448_montgomery_A
        source: SRC-RFC7748
        fetch_1_returned: 156326
        fetch_2_returned: 39081
        fetch_3_returned: 156326
        digit_exactness: unverified
      - field: curve448_base_point_V
        source: SRC-RFC7748
        returned: '355293926785568175264127502063783334808976399387714271831880898435169088786967410002932673765864550910142774147268105838985595290606362'
        digit_exactness: unverified
      - field: large_d_edwards_coefficient
        source: SRC-RFC7748
        returned: '611975850744529176160423220965553317543219696871016626328968936415087860042636474891785599283666020414768678979989378147065462815545017'
        digit_exactness: unverified
      - field: large_d_edwards_base_point_X
        source: SRC-RFC7748
        returned: '345397493039729516374008604150537410266655260075183290216406970281645695073672344430481787759340633221708391583424041788924124567700732'
        digit_exactness: unverified
      - field: large_d_edwards_base_point_Y
        source: SRC-RFC7748
        returned: '363419362147803445274661903944002267176820680343659030140745099590306164083365386343198191849338272965044442230921818680526749009182718'
        digit_exactness: unverified
      - field: ed448_base_point_order_L
        source: SRC-RFC8032
        returned: '2^446 - 13818066809895115352002738674851542688033669247488217860989894547503885'
        digit_exactness: unverified
        note: >-
          Returned by a fetch that in the same response emitted a contradictory
          cofactor and corrupted base-point coordinates. Treat as untrusted.
      - field: ed448_cofactor
        source: SRC-RFC8032
        returned: 2
        conflicts_with: [F3, F5]
        digit_exactness: unverified
      - field: ed448_base_point_coordinates
        source: SRC-RFC8032
        returned: truncated_and_charset_corrupted
        digit_exactness: unretrieved
      - field: curve448_twist_order
        source: SRC-RFC7748
        returned: '2^448 - 2^226 - 1'
        classification: >-
          REJECTED AS SUMMARIZER FABRICATION, not carried forward even as a
          quarantined candidate value. It exceeds the Hasse interval for a curve
          over p = 2^448-2^224-1 and is incompatible with the cofactor 4 stated
          in the same response. Recorded here only as evidence about the channel.

  # ------------------------------------------------------------------
  # 6. VALUES THE AUDIT MAY PROCEED ON, AND THE ONES IT MAY NOT
  # ------------------------------------------------------------------
  proceed_on:
    - item: p = 2^448 - 2^224 - 1 as a SYMBOLIC EXPRESSION
      basis: F1, three-source agreement on a short expression
      caveat: expand to decimal locally; do not import an expanded digit string
    - item: Edwards coefficient d = -39081 as a SHORT DECIMAL
      basis: F2, three-source agreement
    - item: Montgomery coefficient A = 156326 as a SHORT DECIMAL
      basis: F3, 2-of-3 with the dissent explained
      caveat: still re-transcribe before certificate emission
    - item: the designer's generation rules for p and d
      basis: F5, F6
      caveat: >-
        These are RULES, not parameters. Their audit value is that they can be
        re-executed; re-executing them is lane L7 / D8 and its outcome is not
        prejudged here.
  do_not_proceed_on:
    - every entry in section 5
    - every SafeCurves numeric threshold (unsourced, see C6b)
    - every intake True/False cell (comparison target, never evidence)

  successor_requirements:
    - id: SR1
      requirement: >-
        Re-transcribe p, A, d, the base points, the order L, the cofactor, and
        the twist order from RAW document bytes; record sha256 of each document
        and the byte offsets of each value.
      unblocks: [L1, L3, L4, L5, L6, L9, D1, D2, D3, D5]
    - id: SR2
      requirement: >-
        Retrieve SafeCurves verify.html (or a clearly-labelled archived
        snapshot) and freeze the eleven criterion definitions and their numeric
        thresholds as a versioned, hashed artifact.
      unblocks: every pass/fail statement in the entire audit
    - id: SR3
      requirement: >-
        Obtain the readable body of IACR ePrint 2015/625 (PDF renderer or text
        extraction) to source the original Goldilocks base point and the
        designer's own security argument.
      unblocks: [L3, L7, D8, resolution of C5]
    - id: SR4
      requirement: >-
        Retrieve NIST SP 800-186 / FIPS 186-5 as an INDEPENDENT authoritative
        transcription of the same tuple, so the parameter values have two
        mutually independent document sources rather than one family.
      unblocks: independent corroboration of SR1

  citation_provenance_ledger:
    - ref: RFC 7748
      provenance: retrieved
      claim: curve448 Montgomery model, A, cofactor, base point, and the birational/4-isogeny relations of F4
      verified_by: idea-generator/TASK-20260824-233cd4
      qualifier: retrieved_via_summarizing_intermediary; digits unverified
