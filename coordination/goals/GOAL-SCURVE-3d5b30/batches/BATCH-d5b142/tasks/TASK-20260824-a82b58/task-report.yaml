  # ---------------------------------------------------------------------------
  # HEADLINE
  # ---------------------------------------------------------------------------
  headline: >-
    NO CURVE ATTACK WAS RUN. No experiment was created, no run record exists, and
    this task makes NO statement about whether secp256k1 is safe, unsafe,
    vulnerable, or free of vulnerabilities. The deliverables are a sourced
    parameter capsule and a falsifiable, control-gated audit plan covering all
    eleven SafeCurves criteria in their declared categories plus all eight
    declared additional diagnostics.

  artifacts_written:
    - path: coordination/goals/GOAL-SCURVE-3d5b30/batches/BATCH-d5b142/tasks/TASK-20260824-a82b58/parameter-capsule.yaml
      description: 'Retrieval log, intake/source separation, reconciled tuple with per-field provenance, recalled pointers marked as non-support, hand derivations flagged pending mechanical verification, conflict register.'
    - path: coordination/goals/GOAL-SCURVE-3d5b30/batches/BATCH-d5b142/tasks/TASK-20260824-a82b58/audit-plan.yaml
      description: 'Lanes L0-L11 and D1-D8 with tracked object, lossy-projection test, mechanism, quantitative prediction, certificate or explicit bound, positive/negative/null controls, budget, stopping rule, falsifier, honest limitation.'
    - path: coordination/goals/GOAL-SCURVE-3d5b30/batches/BATCH-d5b142/tasks/TASK-20260824-a82b58/task-report.yaml
      description: 'This record.'
  write_scope_respected: true
  files_written_outside_write_scope: none
  git_operations_performed: none

  # ---------------------------------------------------------------------------
  # COMPLETION GATE
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: 'The parameter capsule distinguishes user intake from retrieved primary or authoritative sources and records provenance and unresolved conflicts.'
      met: true
      where: 'parameter_capsule sections 1 (intake, evidentiary_weight: none), 2 (retrieval_log with retrieved / unretrieved / snippets-only split), 3 (recalled pointers marked non-support), 4 (per-field provenance), 5 (conflicts C1-C4).'
      qualification: >-
        MET WITH A DISCLOSED SHORTFALL. The declared primary source (SEC 2) was
        NOT retrieved and no SafeCurves page was retrieved. The capsule records
        each as `unretrieved` with its exact failure mode and paraphrases none of
        them. The tuple therefore rests on two retrieved sources (BIP-340, which
        corroborates p, n and the equation shape, and a secondary curve database
        for the remaining fields), and the capsule says so in those terms.
    - item: 'The audit plan covers every one of the eleven criteria in the declared category, with a certificate or explicit bound, controls, falsifier, budget, and stopping rule.'
      met: true
      where: 'audit_plan.lanes L1-L11; audit_plan.coverage.eleven_criteria confirms each lane''s category against the goal''s criterion_categories.'
      qualification: >-
        Each lane is split into a computational half (executable now, certificate
        or explicit bound defined) and an adjudication half (comparison against
        the published threshold), and every adjudication half carries
        `blocked_on: L0` because the criterion definitions are unretrieved. That
        block is stated per lane rather than papered over.
    - item: 'The plan covers every declared additional diagnostic, or records a concrete reason and successor condition for a deferred diagnostic.'
      met: true
      where: 'audit_plan.lanes D1-D8; audit_plan.coverage.additional_diagnostics.'
      detail: 'deferred_diagnostics: none. D4 is declared identical to L5 (one lane, two roles) and is explicitly not budgeted or executed twice.'
    - item: 'Positive, parameter-matched negative, and same-shape null controls are explicit and run before belief in any later task.'
      met: true
      where: 'audit_plan.control_battery (7 positive, 2 negative, 4 null), referenced per lane; execution_order step 2 makes the battery a HARD GATE ahead of every lane except L0.'
      detail: >-
        Negative controls disclose their matching assumptions (NEG-P256 matches
        field size, model, cofactor and prime order; it differs in prime,
        coefficient a, and generation history, so it isolates the j = 0 / D = -3
        structure and controls for nothing else). Null controls remove the tested
        structure while preserving shape and code path, including
        NULL-FAKE-ENDOMORPHISM for D3 and NULL-SHUFFLED-TRANSCRIPT, which
        establishes the base rate for the rigidity argument.
    - item: 'The report states that no curve attack ran and makes no safety or vulnerability conclusion.'
      met: true
      where: 'task_report.headline; parameter_capsule.claim_status; audit_plan.claim_status and audit_plan.prohibited_outputs.'

  additional_binding_constraints:
    - constraint: 'Sources retrieved and read during this task; provenance recorded; recalled not promoted.'
      status: partially_satisfied_and_disclosed
      detail: >-
        Two sources were fetched and read (BIP-340, std.neuromancer.sk). Ten
        source URLs are recorded as unretrieved with their exact failure modes.
        Four references are recorded as `recalled` with `verified_by: null` and an
        explicit statement that none may back a criterion cell or a novelty
        verdict. Nothing was promoted from recalled to retrieved.
    - constraint: 'Endomorphism/automorphism-adjusted rho treated as first-class with an explicit speedup factor and its derivation, stated as a planned falsifiable measurement, not a result.'
      status: satisfied
      detail: >-
        Lane D3 carries a five-step derivation of sqrt(|Aut|), the values
        |Aut| = 6, sqrt(6) = 2.4495 (1.29 bits) total and sqrt(3) = 1.7321
        (0.79 bits) incremental over the program''s negation-inclusive 0.886
        convention, a three-multiplication-plus-one-scalar-multiplication
        certificate (beta, lambda, [lambda]G), five named falsifiers, and the
        explicit label "PLANNED, FALSIFIABLE MEASUREMENT. Not a result." Its
        honest limitation states that a constant factor does not move the
        exponent 1/2 and must not be reported as an ECDLP advance.
    - constraint: 'No curve attack; no experiment result; no safety verdict.'
      status: satisfied
      detail: >-
        Nothing was executed. The plan forbids any rho/DLP/key-recovery
        computation against secp256k1 at any scale; D3 stage 2 runs only on
        generated toy curves and requires a separate Coordinator-approved
        contract.
    - constraint: 'Reuse IDEA-20260807-98a970 rather than duplicating it.'
      status: satisfied
      detail: >-
        L5/D4 is declared a specialization of that record to one curve, adopting
        its certificate formats, its three degenerate checks, its K = 10^6
        lower-bound pass, and its planted-positive and decay controls. No new
        mechanism proposal was minted, and no IDEA-* record was written by this
        task.
    - constraint: 'Only public parameters and generated controls; no live private key.'
      status: satisfied
      detail: 'Every oracle in D2 is simulated with a locally generated secret on a locally generated curve. No live key is tested, requested, stored, or derived.'
    - constraint: 'Infra errors, timeouts and budget stops are operational observations, never mathematical evidence.'
      status: satisfied
      detail: 'All 502s, PDF-extraction failures, and the absent Bash tool are recorded as operational, in both the capsule and this report.'
    - constraint: 'No Bedrock provider, backend, endpoint, or model identifier.'
      status: satisfied

  # ---------------------------------------------------------------------------
  # CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ---------------------------------------------------------------------------
  intake_vs_retrieved_conflicts:
    conflicts_found: none
    scope_of_that_answer: >-
      NARROW, and the narrowness is the point. Only the modulus and the equation
      shape were cross-checkable against a retrieved source. The intake modulus
      "2^256 - 2^32 - 977" is consistent with the retrieved hex p by an ANALYST
      HAND DERIVATION (capsule HD1), which is pending mechanical verification and
      is not evidence. The intake equation "y^2 = x^3+0x+7" matches BIP-340's
      "y^2 = x^3 + 7". The intake pointer "details: SEC2" is UNCONFIRMED because
      SEC 2 could not be read. ALL ELEVEN intake criterion cells were compared
      against NOTHING, because no SafeCurves page was retrieved. "No conflict
      found" here means "no conflict was reachable".
    unresolved_items:
      - id: C1
        summary: 'SEC 2 section 2.4.1 unread; the intake `details: SEC2` pointer is unconfirmed and G_x, G_y, a, b, h rest on one secondary source.'
        is_goal_pause_condition_now: false
        reason: >-
          GOAL pause condition 3 fires on an unresolved CONFLICT in the parameter
          tuple. What exists is an unretrieved source, which is an operational
          gap. It becomes a pause condition only if SEC 2, once read, disagrees.
      - id: C2
        summary: 'All eleven SafeCurves criterion definitions and the published secp256k1 row are unretrieved; the whole cr.yp.to host returned 502.'
        is_goal_pause_condition_now: false
        consequence: 'The adjudication half of every criterion lane is blocked. The certificate-producing computations are not.'
      - id: C4
        summary: 'Dispatch prompt named the wrong research question.'
        status: resolved
        see: procedure_deviations

  procedure_deviations:
    - id: PD1
      what: 'The launch prompt named ledger/questions/RQ-SCURVE-960dbd.yaml as this task''s research question.'
      why_it_matters: 'RQ-SCURVE-960dbd belongs to GOAL-SCURVE-137bd9 (NIST P-224) and is outside this task''s declared read_scope; the task card and handoff both name RQ-SCURVE-1c58ec.'
      what_was_done: >-
        RQ-SCURVE-1c58ec was read from the task card / handoff read_scope and is
        the record the artifacts are built on. RQ-SCURVE-960dbd was opened once,
        identified as the wrong curve, and NOTHING was taken from it: no P-224
        parameter, intake cell, control definition, or scope statement appears in
        any artifact of this task. The Coordinator sent the same correction
        mid-task; it agrees with the resolution already applied, and the
        correction was received and acted on before the artifacts were finalized.
      residual_risk: 'None identified. The two RQ records are structurally identical bootstrap templates differing only in curve-specific fields, all of which were taken from RQ-SCURVE-1c58ec and the goal record.'
    - id: PD2
      what: 'A SendMessage acknowledgement to the Coordinator could not be delivered ("No agent named ''coordinator'' is reachable").'
      what_was_done: 'The acknowledgement content was written into this record instead, which is the durable channel and the one that binds. No consequence for the deliverables.'
    - id: PD3
      what: 'Primary-source retrieval fell short of the handoff''s intent.'
      what_was_done: >-
        Recorded as unretrieved with exact failure modes rather than substituted
        from memory, and converted into blocking Lane L0 plus successor handoff
        SUCC-1. This is a disclosed shortfall in the deliverable, not a silent
        one.

  # ---------------------------------------------------------------------------
  # OPERATIONAL OBSERVATIONS (NEVER MATHEMATICAL EVIDENCE)
  # ---------------------------------------------------------------------------
  operational_observations:
    - 'Every WebFetch to safecurves.cr.yp.to returned HTTP 502 Bad Gateway (index, rho, disc, transfer, rigid; http and https; /index.html and /). A host-level probe of https://cr.yp.to/ecdh.html also returned 502, establishing that the whole host, not the SafeCurves path, is unreachable from this session.'
    - 'web.archive.org is refused by this runtime ("Claude Code is unable to fetch from web.archive.org"), removing the obvious mirror route.'
    - 'https://eprint.iacr.org/2015/1060 redirects to https://iacr.org/you_have_been_blocked.txt.'
    - 'SEC 2 v2 and v1 PDFs downloaded but their FlateDecode content streams could not be text-extracted by the fetch-side extractor; one attempt additionally declined verbatim transcription. The local Read tool cannot render PDFs here (pdftoppm / poppler-utils absent). The same failure blocked arXiv 2208.01635.'
    - 'This session holds no Bash tool, so the proxy diagnostic named in the environment notes (curl "$HTTPS_PROXY/__agentproxy/status") could not be run and the proxy state is unknown.'
    - 'Wall-clock and memory budgets (1800 s, 4 GB) were not exceeded; maximum_runs was 1 and zero runs were executed, since this is a planning task.'
    - 'NONE OF THE ABOVE IS EVIDENCE ABOUT SECP256K1, about the SafeCurves site''s contents, or about any criterion.'

  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - object: 'ord_n(p), the multiplicative order of the characteristic modulo the subgroup order'
        lane: L5/D4
        verdict: 'not new here - adopted wholesale from IDEA-20260807-98a970, whose lossiness and propagation analysis was re-checked and is reproduced by reference rather than reinvented'
      - object: 'the squarefree kernel D of t^2 - 4p (CM field discriminant), with the conductor f'
        lane: L6/D5
        verdict: 'classical isogeny-class invariant; lossy and compatibly so; not new'
      - object: 'the pair (beta, lambda) witnessing mu_6 as the F_p-rational automorphism group, with the induced class-size reduction'
        lane: D3
        verdict: >-
          Lossy and NOT a change of coordinates - the curve is not recoverable
          from (beta, lambda) - but the object is the standard GLV/Wiener-Zuccherato
          one and is `known` mathematics. What is new IN THIS PROGRAM is the
          per-curve certificate format and the preregistered numeric prediction.
      - object: 'the rational torsion subgroup E(F_p)_tors as the gate on birational model existence'
        lane: L8/L10/D6
        verdict: >-
          Lossy, compatible with model conversion, and it does real work: it turns
          three separate "does model X exist" questions into one certified
          statement ("n is prime and n > 4") already produced free by L3. Known
          mathematics, efficient packaging.
      - object: 'the rank of the parameters in a declared deterministic enumeration order'
        lane: L7/D8
        verdict: >-
          The most interesting projection in the plan and the most contestable:
          its compatibility is CONDITIONAL on a fixed predicate language, which is
          exactly why the base-rate null control is mandatory. Recorded honestly
          as conditional rather than sold as a clean invariant.
      - object: 'the denominator ideal of a named formula set'
        lane: D7
        verdict: 'lossy, formula-relative; the formula-relativity is the finding, not a defect'
    dominated_by: 'n/a (no result claimed)'
    dominated_by_justification: >-
      This task produced a plan and a sourced capsule. It claims no algorithm, no
      bound, and no attack, so there is no point to place on any time/memory/data
      frontier. The ONE quantity the plan will later produce that touches a
      frontier is D3's constant factor, and its position is stated in advance and
      without flattery: the incumbent is the fully-charged parallel rho baseline
      of KN-TECH-006 at 0.886*sqrt(n) with O(1) memory, ALREADY
      negation-discounted; D3 would move that constant to 0.5116*sqrt(n) on this
      curve, which KN-TECH-018 records as a known constant-factor calibration and
      not a new frontier point. It is dominated on the exponent by every entry on
      the frontier, because it does not touch the exponent.
    sota_delta:
      as_an_attack: 'zero, on every axis. Nothing here reduces any attack cost against any curve.'
      as_a_cost_calibration: >-
        If D3 confirms, the program''s charged rho cost for secp256k1 moves from
        2^127.83 to 2^127.03 group operations, a factor sqrt(3) = 1.732, i.e.
        0.79 bits out of 128 (0.62 percent of the exponent). Memory unchanged at
        O(1). Parallelization unchanged (van Oorschot-Wiener). Time-memory
        tradeoff unchanged. This is a calibration of a baseline the program
        charges against, not a speedup of anything.
      as_data: >-
        The corpus currently holds ZERO certified parameter values, zero
        certificates, and zero criterion reproductions for secp256k1. The plan
        would produce 19 lanes of certificate-bearing or explicitly-bounded rows,
        each third-party verifiable, with 13 named controls gating them.
      as_provenance: >-
        Delta this task actually banked: p and n now rest on two independently
        retrieved agreeing sources instead of on one user-supplied table. That is
        the entire verified gain, and it is small.
    closures_declared: none
    closure_note: >-
      This session closes no lane, declares no direction impossible, and asserts
      no saturation. Where retrieval failed the honest label is UNRETRIEVED, not
      closed; where a criterion cannot yet be adjudicated the label is BLOCKED ON
      L0, not resolved. Nothing here meets - or attempts to meet - the closure
      standard of docs/inventor-protocol.md section 4, because nothing is being
      closed.
    novelty_status: unverified
    novelty_status_justification: >-
      The corpus was grepped (knowledge/ for "SafeCurves", "secp256k1", "GLV",
      "endomorphism"; KN-TECH-006, KN-TECH-018, KN-LIT-6351 and
      IDEA-20260807-98a970 were read in full), but the external literature check
      failed on the network: SafeCurves, SEC 2, IACR eprint and the candidate
      arXiv restatement were all unretrievable. Per AGENTS rule 9 and the role
      contract, that makes the honest label `unverified` regardless of how
      standard the underlying mathematics is. Nothing in these artifacts is
      claimed as novel.
    open_directions_for_the_next_session:
      - 'Retrieve the eleven SafeCurves criterion pages and quote each threshold verbatim; the corpus-local PDF downloads/safecurves-20240809.pdf (KN-LIT-6351) is the most promising offline route and needs only a session with PDF text extraction.'
      - 'Read SEC 2 section 2.4.1 and close conflict C1, or fire the goal pause condition if it disagrees.'
      - 'Execute the cheap exact-certificate cluster (L1, L2, L3, L6, D5, D3, L8, D6): under an hour of compute for eight lanes, all with short third-party-verifiable certificates.'
      - 'Ask whether the embedding degree is exactly (n-1)/6. The retrieved secondary value has magnitude n/6 and the mu_6 automorphism structure forces 6 | n - 1. If the exact-k computation confirms equality, that is a structural observation about (Z/n)* and the Eisenstein CM structure, NOT a weakness, and it should be recorded as such before anyone reads it as one.'
      - 'Measure the D8 base rate before anyone argues about rigidity. If the smallest prime-order b is 7 for a large fraction of random 256-bit primes, the standard rigidity story for secp256k1 carries less information than it appears to, and that is a finding about the ARGUMENT.'
      - 'Resolve whether the program''s charged rho baseline for CM curves should be the negation-only or full-automorphism constant. The campaign currently has both in play (KN-TECH-006 convention vs KN-TECH-018 discount) and D3''s outcome A/B/C structure is designed to settle which one a published column is using.'

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (Coordinator decides; this task assigns nothing)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - id: SUCC-1
      proposed_role: executor
      objective: 'Retrieve and quote the eleven SafeCurves criterion definitions and the published secp256k1 row, and read SEC 2 section 2.4.1, from a session with working egress and PDF text extraction.'
      why_first: >-
        It is the only blocking dependency in the plan; it can fire a goal pause
        condition; and it needs no compute. Every criterion cell is unadjudicable
        until it lands.
      note: 'The container needs poppler-utils (pdftoppm) or an equivalent PDF text extractor, and a working path to cr.yp.to. Both are provisioning items, not research items.'
    - id: SUCC-2
      proposed_role: executor
      objective: 'Run the control battery (audit_plan.control_battery) as a standalone gate and report pass/fail per control before any criterion lane runs.'
      why: 'A lane whose positive control has never fired cannot certify a negative. Running the battery first makes that failure visible cheaply instead of after 17 CPU-hours.'
    - id: SUCC-3
      proposed_role: executor
      objective: 'Execute the cheap exact-certificate cluster L1, L2, L3, L6, D5, D3 (stage 1 only), L8, D6, emitting one certificate per lane.'
      precondition: 'SUCC-2 passed.'
      budget_estimate: '1 CPU-hour, 1 GB'
    - id: SUCC-4
      proposed_role: idea-generator
      objective: 'Separate experiment contract for D3 stage 2 (empirical class-walk rho at 2^30..2^45 on generated toy j = 0 curves) if the Coordinator wants the constant measured rather than only certified.'
      note: 'Optional. Stage 1 already certifies |Aut| = 6; stage 2 only confirms the walk constant empirically and carries the disclosed scale-transfer assumption.'
    - id: SUCC-5
      proposed_role: validator
      objective: 'Independently re-derive the analyst hand derivations HD1-HD4 in the capsule, blind from this task''s artifacts, per the blind-re-derivation obligation in AGENTS "Review architecture".'
      why: >-
        HD1-HD4 are load-bearing for L4, D3 and the intake-modulus consistency
        claim, and they were done by hand by the producing agent. Recomputing them
        from this agent''s own notes would reproduce a wrong-but-self-consistent
        derivation faithfully, which is the failure mode validation cannot see.

  limitations_of_this_task:
    - 'A plan is not evidence. Nothing here has been executed and no prediction in it has been tested.'
    - 'Every criterion adjudication is blocked on a retrieval that failed in this session for operational reasons.'
    - 'Five of the seven tuple fields rest on a single secondary source; the declared primary source is unread.'
    - 'The lane list is enumerated, not exhaustive. The goal record itself states the diagnostic list is deliberately non-exhaustive, and absence of a diagnostic from the plan is not a statement that it is unnecessary.'
    - 'The four `recalled` references (RCB16, GLV, Wiener-Zuccherato, Elligator-squared) are pointers, not support. Two of the plan''s three-outcome adjudications (L10, L11) depend on retrieving them, and the plan explicitly refuses to settle those cells from recollection.'
    - 'The analyst hand derivations HD1-HD4 are unverified arithmetic by the producing agent and are flagged as such wherever they are used.'
