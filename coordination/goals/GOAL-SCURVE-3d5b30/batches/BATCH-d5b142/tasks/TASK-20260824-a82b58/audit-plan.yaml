    categories_match_goal_declaration: true
    additional_diagnostics:
      'complete curve and twist order factorization with checkable certificates': {lane: D1, status: planned}
      'subgroup, cofactor, and invalid-curve confinement costs': {lane: D2, status: planned}
      'automorphism- and endomorphism-adjusted rho cost': {lane: D3, status: planned, first_class: true}
      'embedding-degree certificate or explicit search bound': {lane: D4, status: planned_as_one_lane_with_L5, reuses: IDEA-20260807-98a970}
      'CM discriminant and conductor structure': {lane: D5, status: planned}
