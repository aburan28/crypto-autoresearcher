    deferral_note: >-
      No declared diagnostic is deferred. Every one has a lane, a budget, a
      stopping rule and a falsifier. What IS deferred, uniformly and by design, is
      the ADJUDICATION half of all eleven criterion lanes, deferred to L0 with the
      concrete successor condition "the SafeCurves criterion page for that
      criterion has been retrieved and its threshold quoted verbatim". No
      diagnostic is deferred for lack of interest or budget.

  # ===========================================================================
  # E. EXECUTION ORDER AND BUDGET
  # ===========================================================================
  execution_order:
    - {step: 1, lanes: [L0], rationale: 'unblocks every adjudication; also the only lane that can fire a goal pause condition'}
    - {step: 2, lanes: [control_battery], rationale: 'HARD GATE. No lane output is interpretable before its positive control fires and its null control stays silent.'}
    - {step: 3, lanes: [L1, L2, L3], rationale: 'the certified tuple that every later lane consumes'}
    - {step: 4, lanes: [L6, D5, D3, L4, L8, D6], rationale: 'the cheap exact-certificate cluster; total well under an hour and it settles disc, ladder, model conversion and the endomorphism-adjusted rho constant'}
    - {step: 5, lanes: [L5, D4], rationale: 'embedding degree, specializing IDEA-20260807-98a970'}
    - {step: 6, lanes: [L9, D1, D2], rationale: 'the factoring-bound cluster, the only genuinely expensive block'}
    - {step: 7, lanes: [L7, D8, L10, D7, L11], rationale: 'the definition-sensitive lanes, last because they are the ones L0 most changes'}
  aggregate_budget:
    cpu_hours_upper_bound: 17
    memory_gb: 4
    note: 'Exceeds a single 1800 s task budget by design: this is a plan for several successor experiment contracts, not for one run.'

  # ===========================================================================
  # F. PROHIBITED OUTPUTS
  # ===========================================================================
  prohibited_outputs:
    - 'Any statement that secp256k1 is safe, unsafe, vulnerable, or free of vulnerabilities.'
    - 'Any citation of an intake cell as evidence.'
    - 'Any rho, DLP, or key-recovery computation against secp256k1 at any scale. D3 stage 2 runs only on generated toy curves with generated secrets.'
    - 'Any use of a live private key, or any request, storage, or derivation of one.'
    - 'Any promotion of a recalled reference to retrieved without a new record naming the verifying agent.'
    - 'Any treatment of a timeout, 502, budget stop, or missing tool as mathematical evidence.'
    - 'Any claim that a failed rigid/ladder/complete/ind cell is an ECDLP break.'
    - 'Any provider, backend, endpoint, or model identifier containing "bedrock" (case-insensitive).'
