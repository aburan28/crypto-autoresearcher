# ---------------------------------------------------------------------------
# HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
# ---------------------------------------------------------------------------
honest_accounting:
  objects_considered:
    - id: O1
      object: the parity bit of #E(F_p), equivalently E(F_p)[2]
      lossy_projection_test: PASS - massively lossy, and propagates
        deterministically under isomorphism, model change and quadratic twist
        (via #E + #E' = 2p + 2)
      role: primary tracked object; source of finding F1
    - id: O2
      object: the generation-transcript residue r*b^2 + 27 mod p
      lossy_projection_test: FAIL on the propagation half - lossy, but the
        retained bit is a random function of the seed and carries no information
        along the seed-perturbation orbit
      role: verifier only; the failure is finding F3 and is reported, not hidden
    - id: O3
      object: the seed-induced distribution of curve invariants
      lossy_projection_test: PASS - lossy, samplable, and propagates by
        construction under seed perturbation
      role: the substitution for O2; tracked by diagnostic D8
    - id: O4
      object: the exceptional locus of a named addition formula
      lossy_projection_test: PASS - stable under the group law's symmetries and
        under formula reparameterisation
      role: tracked by L-COMPLETE, D6, D7
  depth_of_verified_structure: >-
    ZERO verified structure. Nothing was executed. The only things established
    are three digit-level readings of retrieved hexadecimal strings (capsule
    items I1-I3), each labelled provisional and each scheduled for computational
    re-certification. Findings F1-F4 are analysis of the plan conditional on
    those readings, not results about the curve.
  dominated_by: >-
    n/a (no result claimed). Checked rather than asserted - this task proposes no
    algorithm and claims no improvement on any cost axis, so there is no frontier
    row to be dominated on time, memory or data/queries. As an audit instrument
    the incumbents are (i) the parameter-validation procedures already mandated
    by the standards, which dominate on authority and on decades of execution,
    and (ii) the SafeCurves project itself, which dominates the verdict half of
    every lane. This plan dominates neither and does not attempt to; its only
    delta is ledger-internal certificates with stated base rates.
  sota_delta: >-
    Zero speedup against any attack baseline on every axis; no attack is
    proposed or implied. As data - the goal held zero certificates for NIST P-256
    before this task and still holds zero, since nothing ran; what now exists is
    a schedule of 19 lanes of which 16 emit a short independently re-verifiable
    certificate and 3 emit an explicit bound with its verification cost stated.
    As analysis, at zero compute cost - the count of genuinely information-bearing
    measurements in this goal is reduced from 11 to approximately 3, with base
    rates quantified per lane (approximately 1 for four lanes, 1 - O(2^-100) for
    transfer, 1 - O(2^-78) for disc, approximately 0.245 for twist, approximately
    2^-256 for the rigidity transcript).
  enumerated_closures:
    - closure: The rigidity question cannot be settled by any computation on the
        published parameters.
      mechanism: O2 fails the propagation half of the lossy-projection test; the
        transcript bit carries no information along the seed-perturbation orbit,
        so no amount of verification bounds how the seed was chosen.
      scope: closes only "settle rigidity by computing on the published tuple";
        does NOT close manipulability, which is measurable as a cost via O3.
      forward_guidance: remaining classes are D8's degrees-of-freedom
        measurement, NC1's cross-procedure comparison, and documentary evidence
        about the seed, which is outside this program's methods and is named as
        such rather than omitted.
      novelty_status_of_this_closure: unverified - the nearest prior art is the
        recalled BADA55 white paper, which was not retrieved.
    - closure: The ladder, complete and ind cells cannot be three independent
        confirmations.
      mechanism: shared preimage E(F_p)[2] = {O}; joint information content is
        one bit, not three.
      scope: closes only the independence claim, not either lane.
      forward_guidance: the open question is what encoding and formula families
        the criteria range over, which needs the criterion text and is blocked by
        OP1.
  open_directions_for_next_session:
    - Retrieve the SafeCurves criterion definitions by any working route and
      supersede every recalled definition marker (blocked by OP1).
    - Read SP 800-186 / FIPS 186-4 in primary form and supersede the capsule
      (blocked by OP2); this unblocks the two highest-information lanes.
    - Settle conflicts C1 and C2 by exact integer comparison - the cheapest open
      items in the goal, and they gate everything else.
    - Probe the environment for SEA point counting and ECM, which determines
      whether H1 is validated at 256 bits or at 60-80 bits with a stated
      size-transfer assumption.

# ---------------------------------------------------------------------------
# LIMITATIONS
# ---------------------------------------------------------------------------
limitations:
  - Nothing was executed; every number in the audit plan is a preregistration.
  - No primary source text was read; the primary tier of the capsule is empty.
  - All eleven criterion definitions are recalled and unretrieved.
  - The SEED has a single third-party source, and the generation algorithm's
    parameters (s = 1, v = 95, the concatenation order) are recalled and written
    out in the plan explicitly so a successor can correct them.
  - Findings F1-F4 are conditional on provisional digit-level readings and on
    named heuristics H1-H5; H1-H4 are heuristics, not theorems, and each carries
    its own validation route and transfer assumptions in the plan.
  - Base rates quoted in F2 are model-derived under H1-H5 and are not measured;
    NU1-NU4 are what would measure them.
  - No safety or vulnerability conclusion is made or implied about NIST P-256 or
    about any control curve named in these artifacts.
