# ---------------------------------------------------------------------------
# SUBSTANTIVE FINDINGS OF THE PLANNING WORK
# ---------------------------------------------------------------------------
# These are findings ABOUT THE AUDIT, produced at zero compute cost. None is a
# finding about the curve's security.
planning_findings:
  - id: F1
    finding: >-
      Three of the eleven criteria - ladder, complete, ind - share a single
      algebraic preimage, the parity of #E(F_p). A dossier reporting them as
      three independent confirmations would overstate its evidence roughly
      threefold.
    status: conditional on capsule item I1, itself a provisional digit-level
      reading awaiting L-BASE.
    consequence: >-
      The dossier must report one certificate and three criterion consequences.
      This is written into L-LADDER, L-COMPLETE, L-IND and D6.
  - id: F2
    finding: >-
      Six of the eleven lanes pass for essentially any curve of this size - base
      rates approximately 1 (field, equation, base, rho), 1 - O(2^-100)
      (transfer, under H4) and 1 - O(2^-78) (disc, under H3). Only twist is
      non-generic, at approximately 0.245 under H1 (Dickman), and only the
      rigidity transcript is astronomically non-generic, at approximately 2^-256
      per unrelated seed under H2.
    consequence: >-
      The number of genuinely information-bearing measurements in this goal is
      approximately three, not eleven. Budget and reviewer attention are
      re-pointed accordingly in the plan's execution_plan, and every lane is
      required to print its base rate next to its verdict.
  - id: F3
    finding: >-
      The transcript object (SEED -> the residue r*b^2 + 27 mod p) is lossy but
      does NOT propagate deterministically under seed perturbation, so it fails
      the second half of the lossy-projection test.
    consequence: >-
      Transcript verification can never bound manipulation, because bounding
      manipulation is a statement along the seed-perturbation orbit and the
      transcript bit carries no information along it. The plan therefore splits
      rigidity into L-RIGID (verification, object O2) and D8 (measurement, object
      O3 = the seed-induced distribution of curve invariants). This substitution
      is the one piece of genuinely new design work in the task, and it is the
      reason D8 is priority 1 alongside L-RIGID.
  - id: F4
    finding: >-
      The intake tuple is not a complete curve specification - it carries no base
      point, order, cofactor or seed. Four quantities the goal's lanes depend on
      therefore enter only from retrieved sources, and the SEED enters from a
      single third-party aggregator.
    consequence: >-
      L-RIGID is blocked on primary sourcing of SEED. Running it on a
      single-sourced seed would make a transcript failure indistinguishable from
      a wrong seed; PC3 mitigates this but does not substitute for sourcing.

