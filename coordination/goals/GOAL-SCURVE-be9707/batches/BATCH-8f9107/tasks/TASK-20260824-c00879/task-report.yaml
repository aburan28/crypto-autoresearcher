      or authoritative sources and records provenance and unresolved conflicts.
    met: true
    where: >-
      parameter-capsule.yaml sections 1 (intake, marked
      user_supplied_unverified / is_evidence: false), 2 (retrieval_log with six
      sources at four distinct authority tiers plus an explicit unretrieved list
      with failure modes), 4 (conflicts C1-C7), 5 (citations with per-entry
      provenance).
    caveat: >-
      NO PRIMARY SOURCE TEXT WAS READ. The distinction the gate asks for is
      recorded, but the primary tier is EMPTY - the tuple rests on an IETF
      restatement (RFC 5903) and a third-party aggregator (Standard Curve
      Database) which agree digit for digit but are not provenance-independent
      (conflict C4). The gate is met as written; the underlying sourcing goal is
      not, and that is stated rather than smoothed over.
  - item: The audit plan covers every one of the eleven criteria in the declared
      category, with a certificate or explicit bound, controls, falsifier, budget,
      and stopping rule.
    met: true
    where: audit-plan.yaml `criterion_lanes`.
    coverage_check:
      basic_parameter_requirements: [field (L-FIELD), equation (L-EQUATION),
        base (L-BASE)]
      ecdlp_security_requirements: [rho (L-RHO), transfer (L-TRANSFER),
        disc (L-DISC)]
      ecc_security_beyond_ecdlp: [rigid (L-RIGID), ladder (L-LADDER),
        twist (L-TWIST), complete (L-COMPLETE), ind (L-IND)]
      count: 11 of 11, each in the category declared by the goal.
      per_lane_fields_present: [mechanism, quantitative_prediction, certificate
        (with fallback_bound where the certificate may be unreachable), controls,
        budget_seconds, stopping_rule, falsifier, honest_limitation,
        two_explanation_discrimination]
    caveat: >-
      All eleven carry `definition_provenance: recalled` because every
      safecurves.cr.yp.to URL returned HTTP 502. Each lane may PRODUCE its
      certificate under the recalled definition, since the certificates are
      defined by explicit arithmetic in the plan; none may ADJUDICATE against the
      preregistered intake cell until the criterion text is retrieved. That split
      is stated as a universal precondition in the plan.
  - item: The plan covers every declared additional diagnostic, or records a
      concrete reason and successor condition for a deferred diagnostic.
    met: true
    where: audit-plan.yaml `additional_diagnostics` D1-D8 and
      `deferred_diagnostics`.
    coverage_check:
      - declared: complete curve and twist order factorization with checkable
          certificates
        lane: D1
      - declared: subgroup, cofactor, and invalid-curve confinement costs
        lane: D2
      - declared: automorphism- and endomorphism-adjusted rho cost
        lane: D3
      - declared: embedding-degree certificate or explicit search bound
        lane: D4 (planned_by_reuse of IDEA-20260807-98a970, not duplicated)
      - declared: CM discriminant and conductor structure
        lane: D5
      - declared: model-conversion exceptional sets
        lane: D6
      - declared: scalar and multiscalar formula exceptional-case search
        lane: D7
      - declared: deterministic parameter-generation transcript audit
        lane: D8 (priority 1, paired with L-RIGID)
      count: 8 of 8. None deferred at the planning level.
    conditional_deferral_recorded: >-
      L-RIGID and D8 carry a conditional execution-deferral trigger - failure to
      source SEED and the generation algorithm from a primary NIST document -
      with the successor condition stated in
      L-RIGID.successor_condition_if_blocked.
  - item: Positive, parameter-matched negative, and same-shape null controls are
      explicit and run before belief in any later task.
    met: true
    where: audit-plan.yaml `global_controls`, with a binding hard-gate rule.
    controls_defined:
      positive: [PC1 Anomalous (additive transfer), PC2 BN(2,254) (small k, small
        |D|), PC3 P-384/P-521 (transcript reproduction), PC4 Curve25519 (2-torsion
