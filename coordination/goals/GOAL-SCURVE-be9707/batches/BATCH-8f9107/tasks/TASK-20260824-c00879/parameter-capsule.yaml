# ---------------------------------------------------------------------------
# 6. WHAT THIS CAPSULE DOES NOT ESTABLISH
# ---------------------------------------------------------------------------
limitations:
  - No arithmetic was executed. Every equality, primality, order and
    on-curve statement is scheduled in audit-plan.yaml and unverified here.
  - No primary NIST text was read. The tuple is sourced to an IETF restatement
    and a third-party aggregator that agree textually but not independently (C4).
  - The eleven criterion definitions are unsourced (C6); the intake cells remain
    preregistered targets with recalled meanings.
  - The SEED, on which the whole rigidity lane rests, has exactly one source (C5).
  - The three `derived_by_inspection` items are digit-level readings of retrieved
    strings. They are the cheapest checks in the plan and the first to be redone
    computationally; they are not certificates.
  - Nothing here states or implies that NIST P-256 is safe, unsafe, vulnerable,
    or free of vulnerabilities.
