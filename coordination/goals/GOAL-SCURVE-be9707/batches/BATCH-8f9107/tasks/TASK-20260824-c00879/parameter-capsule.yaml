# ---------------------------------------------------------------------------
# 3. RECONCILED TUPLE
# ---------------------------------------------------------------------------
reconciled_tuple:
  status: provisional_pending_primary_source_and_computation
  representation: hexadecimal, big-endian, as printed by the cited sources
  fields:
    p:
      value: '0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff'
      sources: [S1, S2]
      agreement: exact_digit_for_digit
      checks_performed_here:
        - kind: string_comparison
          result: S1 (whitespace-grouped hex) and S2 (0x-prefixed hex) agree in
            every hex digit after removing S1's grouping spaces.
        - kind: by_inspection_residue
          result: the final hex digit is `f`, so p is odd and p = 3 (mod 4).
          caveat: valid only conditional on the transcription above being correct;
            to be re-certified computationally in lane L-FIELD.
      not_checked_here: primality of p; equality with the intake expression
        2^256 - 2^224 + 2^192 + 2^96 - 1 (see conflict C2).
    a:
      value: '0xffffffff00000001000000000000000000000000fffffffffffffffffffffffc'
      sources: [S2]
      corroboration: >-
        S1 does not print `a`; it states the equation as y^2 = x^3 - 3x + b.
      checks_performed_here:
        - kind: string_comparison
          result: the S2 hex string for `a` is identical to the S2 hex string for
            `p` in every position except the final digit, which is `c` (12) where
            p has `f` (15). Since no borrow can propagate, a = p - 3 exactly,
            i.e. a = -3 (mod p), consistent with S1's stated equation and with
            the intake equation's `-3x` term.
          caveat: a digit-level derivation, not an executed arithmetic
            certificate. Re-certify in lane L-EQUATION.
    b:
      value: '0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604b'
      sources: [S1, S2]
      agreement: exact_digit_for_digit
      not_checked_here: >-
        Equality with the intake decimal
        41058363725152142129326129780047268409114441015993725554835256314039467401291.
        NOT verified. See conflict C1.
    gx:
      value: '0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296'
      sources: [S1, S2]
      agreement: exact_digit_for_digit
    gy:
      value: '0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5'
      sources: [S1, S2]
      agreement: exact_digit_for_digit
    n:
      value: '0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551'
      sources: [S1, S2]
      agreement: exact_digit_for_digit
      source_wording_note: >-
        S1 labels this "group order"; S2 labels it "order (n)". The two labels
        are being treated as the same quantity, the order of the base point.
        That identification is an assumption of this capsule, not a quoted
        statement, and lane L-BASE is what discharges it.
      checks_performed_here:
        - kind: by_inspection_parity
          result: the final hex digit is `1`, so n is odd.
      not_checked_here: primality of n; that [n]G = O.
    h:
      value: '0x1'
      sources: [S2]
      corroboration: absent from S1.
      not_checked_here: that #E(F_p) = h * n.
    seed:
      value: 'C49D360886E704936A6678E1139D26B7819F7E90'
      bit_length_as_printed: 160
      sources: [S2]
      corroboration: >-
        NONE. This value rests on a single third-party aggregator. It was NOT
        obtained from any NIST document in this task. It is the single weakest
        link in the capsule and the rigidity/transcript lane depends on it
        entirely.
      escalation: >-
        Lane L-RIGID must not be executed to a verdict until this SEED is
        confirmed against a primary NIST source (SP 800-186 or FIPS 186-4
        Appendix D), because a transcript-reproduction failure caused by a wrong
        seed is indistinguishable, from inside the lane, from a genuine
        non-reproduction. The P-384/P-521 positive controls in audit-plan.yaml
        exist precisely to break that ambiguity, but they do not substitute for
        sourcing the seed.

  derived_by_inspection:
    - id: I1
      statement: '#E(F_p) = h * n is odd, hence E(F_p)[2] = {O}.'
      derivation: >-
        h = 0x1 and n ends in hex digit 1, so h*n is odd. Conditional on the
        retrieved h and n.
      status: provisional_by_inspection
      why_it_matters: >-
        This single bit is the shared precondition behind three separate intake
        cells (ladder, complete, ind). See audit-plan.yaml
        `observation_collision`. It must be re-certified computationally before
        any of those three lanes reports.
    - id: I2
      statement: 'p = 3 (mod 4).'
      derivation: final hex digit of p is `f`.
      status: provisional_by_inspection
    - id: I3
      statement: 'a = p - 3, i.e. a = -3 (mod p).'
      derivation: see `fields.a.checks_performed_here`.
      status: provisional_by_inspection

