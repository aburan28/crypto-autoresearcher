conflicts:
  - id: C1
    kind: unverified_cross_representation_equality
    statement: >-
      The intake gives b in decimal; S1 and S2 give b in hex. Their equality was
      NOT checked in this task because no arithmetic execution was available.
    status: open
    resolution_owner: lane L-EQUATION step 1
    resolution_test: decimal-to-integer parse of the intake constant, hex parse
      of the S1/S2 constant, exact integer comparison.
    what_each_outcome_would_mean:
      equal: the intake `equation` string is a faithful decimal rendering of the
        sourced curve; the intake tuple and the retrieved tuple describe one curve.
      unequal: either the intake string is corrupt, or the retrieved sources
        describe a different curve. Discriminated by re-parsing both against a
        primary NIST source; until then the capsule is superseded, not patched.
    misreading_to_avoid: >-
      Do not record "the intake matches" on the strength of both constants
      "looking like P-256". That is exactly the recall-as-verification failure
      this program forbids.

  - id: C2
    kind: unverified_cross_representation_equality
    statement: >-
      The intake gives p as the expression 2^256 - 2^224 + 2^192 + 2^96 - 1; S1
      and S2 give p in hex. Equality was NOT computed here.
    status: open
    resolution_owner: lane L-FIELD step 1
    resolution_test: evaluate the power expression as an exact integer, compare
      to the hex parse.

  - id: C3
    kind: coverage_gap_not_conflict
    statement: >-
      No primary NIST document text was read. The tuple currently rests on one
      IETF restatement (S1) and one third-party aggregator (S2). SP 800-186 was
      fetched but is unreadable here (S6).
    status: open
    goal_pause_condition_assessment: >-
      The goal's pause condition "Primary or authoritative sources leave an
      unresolved conflict in the named curve's parameter tuple" is NOT triggered.
      No conflict exists between the sources that were read; they agree digit for
      digit. What exists is a gap in coverage of primary text. Recorded
      explicitly so the Coordinator does not read C3 as a pause trigger, and does
      not read the absence of a pause as primary sourcing having occurred.

  - id: C4
    kind: correlated_provenance
    statement: >-
      S1 and S2 agree exactly, but that agreement is weak corroboration, not
      independence. Both plausibly derive from the same upstream NIST/SECG text,
      so a single upstream transcription error would appear in both identically.
    status: open
    resolution_owner: successor primary-source task
    quantitative_consequence: >-
      The capsule claims two-source textual agreement, NOT two-source independent
      confirmation. Downstream records must use the former wording.

  - id: C5
    kind: single_source_dependency
    statement: >-
      SEED and h rest on S2 alone.
    status: open
    resolution_owner: successor primary-source task; blocking for lane L-RIGID.

  - id: C6
    kind: definition_gap
    statement: >-
      All eleven SafeCurves criterion definitions are unsourced in this task
      (502 on every safecurves.cr.yp.to URL). The intake True/False cells are
      therefore preregistered targets whose *meaning* is currently recalled.
    status: open
    resolution_owner: successor retrieval task with a working route to
      safecurves.cr.yp.to or to the SafeCurves paper text.
    blocking_scope: >-
      Blocks the *verdict* half of every lane. Does not block the
      certificate-production half, which is defined by explicit arithmetic in
      audit-plan.yaml and is criterion-definition-independent.

  - id: C7
    kind: dispatch_prompt_error_corrected
    statement: >-
      The dispatching prompt named ledger/questions/RQ-SCURVE-960dbd.yaml as this
      goal's research question. That file is the NIST P-224 question belonging to
      GOAL-SCURVE-137bd9. The task card, the handoff envelope and
      coordination/bootstrap/safecurves/TASK-20260824-41038d/manifest.yaml all
      bind GOAL-SCURVE-be9707 to RQ-SCURVE-03aa7e.
    status: resolved
    resolution: >-
      RQ-SCURVE-03aa7e was used throughout. RQ-SCURVE-960dbd was opened once
      during disambiguation and nothing from it, in particular no P-224 intake
      value, enters this capsule or the audit plan. The Coordinator issued the
