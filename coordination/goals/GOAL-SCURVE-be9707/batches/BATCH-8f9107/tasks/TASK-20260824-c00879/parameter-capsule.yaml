intake:
  provenance: user_supplied_unverified
  verification_status: unverified
  comparison_target_only: true
  is_evidence: false
  evidentiary_note: >-
    Reproduced verbatim from ledger/goals/GOAL-SCURVE-be9707/goal.yaml and
    ledger/questions/RQ-SCURVE-03aa7e.yaml so that later tasks compare against a
    frozen string rather than against a remembered one. Reproduction here does
    not upgrade its status. No True/False cell below may be cited as evidence by
    any downstream record.
  curve: NIST P-256
  equation: y^2 = x^3-3x+41058363725152142129326129780047268409114441015993725554835256314039467401291
  modulus: 2^256 - 2^224 + 2^192 + 2^96 - 1
  details: 2000 NIST; also in SEC 2 and NSA Suite B
  expected_safe: false
  expected_criteria:
    field: true
    equation: true
    base: true
    rho: true
    transfer: true
    disc: true
    rigid: false
    ladder: false
    twist: true
    complete: false
    ind: false
  intake_completeness_gap: >-
    The intake tuple specifies only (a implicitly as -3, b in decimal, p as a
    power expression). It supplies NO base point, NO group order, NO cofactor
    and NO generation seed. It is therefore not a complete curve specification
    and cannot by itself support the `base`, `rho`, `transfer`, `disc`, `twist`
    or `rigid` lanes. Those four missing quantities are taken from retrieved
    sources below and are flagged as such.

