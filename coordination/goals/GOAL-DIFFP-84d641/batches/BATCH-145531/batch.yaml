review_architecture:
  shape: >-
    SIX TASKS. ONE PRODUCER, TWO SIBLING-BLIND INDEPENDENT REVIEW SESSIONS ON DISJOINT
    JOINT SETS, TWO ISOLATED ARCHIVES THAT EACH RUN ALONE, AND THIS OPENING CONTROL PLANE.
    TASK-20260824-f094e8 (coordinator, opening) -> TASK-20260824-68ba87 (executor) ->
    TASK-20260824-aed5ca (coordinator, SNAPSHOT archive, runs ALONE, writes the review plan
    and the sealed addendum) -> TASK-20260824-e1062f (validator) and TASK-20260824-7d9f92
    (red team), CONCURRENT AND MUTUALLY BLIND -> TASK-20260824-5eafa3 (coordinator, LEDGER
    archive, runs ALONE).
  why_six_and_not_fewer_argued_on_the_merits_because_the_constraint_is_gone: >-
    THE ASSIGNMENT REMOVED THE IDENTIFIER CONSTRAINT AND ASKED FOR THE SHAPE TO BE CHOSEN
    AND ARGUED. IT IS SIX, AND HERE IS WHY, IN FOUR REASONS OF WHICH THE FIRST TWO ARE
    SUFFICIENT ALONE.
    (1) COMPLETION CRITERION 4 IS UNREACHABLE WITH ONE REVIEWER. It requires that
    INDEPENDENT VALIDATOR AND RED TEAM SESSIONS ADMIT each claim-relevant run package.
    BATCH-efcae7 moved it from UNREACHABLE to REACHABLE-AND-REFUSED, which
    DEC-20260824-c5bb72 correctly called more informative than reachable-and-untested.
    DROPPING TO ONE REVIEWER WOULD MOVE IT BACK TO UNREACHABLE, IMMEDIATELY AFTER IT WAS
    REFUSED, and a criterion that becomes unreachable right after refusing a package is
    indistinguishable from a criterion quietly retired. This program treats that as a quiet
    drop.
    (2) THE GOAL HEAD'S RESTRICTION (4) REQUIRES ANSWERING J8, J11 AND J13 RATHER THAN
    DECLINING TO ASSIGN THEM: "a later round that simply omits them would not meet it and
    any close reading it that way would be manufacturing an admission." J8 and J13 are
    adversarial joints about whether a conclusion survives objects for which it is known
    false. ONLY AN ADVERSARY CAN ANSWER THEM, and R-b below assigns exactly that.
    (3) THIS GOAL HOLDS A MEASURED COUNTEREXAMPLE TO THE ONE-REVIEWER ARGUMENT, TWICE
    OVER. O5, the finding that DEFINED BATCH-f8bf86, was added by a reviewer and was not on
    the plan's list. And BATCH-efcae7's own best finding -- DEC-20260824-c5bb72 calls it
    "the one finding neither reviewer could have made alone" -- was the COMPOSITION of two
    mutually blind readings of the SAME ONE LINE OF CODE in opposite directions, both
    correct. That is this program's strongest recorded argument for paying for two.
    (4) THIS BATCH'S PRODUCT IS THE FIRST IN THIS GOAL THAT CLAIMS SOMETHING THEOREM-LIKE.
    "Provably undetectable by any family" is a different kind of claim from "2600 of 2600",
    and it needs two different attacks: does the derivation say what the code does
    (Validator), and is the word "provably" scoped to this census (Red Team). Those are not
    the same question and one session asked to hold both would be composing its own answer.
  what_it_costs_and_where_the_cost_is_paid: >-
    THE COST IS PAID IN JOINTS, NOT IN REVIEWERS, AND IT IS DECLARED AT OPENING RATHER THAN
    DISCOVERED IN THE REPORTS. See `joint_budget` immediately below.
  boundary_so_no_joint_is_unowned_and_none_is_double_owned: >-
    THE VALIDATOR OWNS WHETHER THE OUTPUT IS WHAT THE COMMITTED CODE PRODUCES AND WHETHER
    IT IS SCOPED HONESTLY: reproduction, the graph's derivations against the committed
    serialiser, the order in which the partition was derived and compared, and whether the
    differing-cell count carries its exclusions and its capacity to fail. THE RED TEAM OWNS
    WHETHER THE CONCLUSIONS DRAWN SURVIVE OBJECTS FOR WHICH THEY ARE KNOWN FALSE: whether
    "provably undetectable" is a theorem or a fact about this census, whether batch 3's
    output actually answers J8/J11/J13, whether any lane is being quietly closed, and what
    would make the differing-cell count meaningless.
    WHERE THEY COME CLOSEST -- THE PARTITION -- THE SPLIT IS EXPLICIT: the Validator checks
    each row's assigned class FOLLOWS from the stated rule; the Red Team checks whether the
    CLASS SYSTEM ITSELF was chosen to fit an answer already known. Both are needed and
    neither is the other's.
  completion_criterion_4_status: >-
    REACHABLE BY THIS BATCH'S SHAPE AND NOT MET BY IT. Whether both sessions ADMIT the
    package is the CLOSE's determination on the reports it actually receives, never read
    off the presence of two task ids in a queue, and a `breaks` on a joint a reviewer owns
    is NOT an admission on that joint. The close must say so either way.

joint_budget:
  count: 8
  cut_from: >-
    13 (BATCH-efcae7: seven validator joints and six red-team joints)
  why_the_cut_is_declared_at_opening_rather_than_discovered: >-
    DEC-20260824-c5bb72 PD-6 IS THE THIRD CONSECUTIVE ROUND IN WHICH REVIEWER BUDGETS WERE
    OVERRUN, AND IT ATTACHED A CONCRETE CONSEQUENCE INSTEAD OF A THIRD NOTE: "batch 3's
    reviewer allocations must be set from the MEASURED agent time of rounds 1 and 2 rather
    than from compute, and a batch that cannot afford them must cut joints explicitly at
    opening rather than discover the shortfall in the reports."
    THE MEASUREMENT, QUOTED FROM THE REPORTS AND NOT FROM THIS SESSION: the Red Team's own
    attestation records a first tool call at approximately 20:15Z and its report written
    after 20:41Z against a 600 s allocation -- roughly a factor of three -- for SIX joints,
    with 0 of 3 charged runs consumed and the overrun dominated by AGENT time; the
    Validator likewise records an overrun with `wall_clock_seconds_bound: true` and names
    its cause. AT ROUGHLY 260 s OF MEASURED AGENT TIME PER ADVERSARIAL JOINT, AN
    EIGHT-JOINT ROUND WOULD NEED ABOUT 2080 s OF REVIEWER TIME ALONE.
    THE CAMPAIGN CANNOT FUND THAT AND KEEP BATCHES 4-6 FUNDABLE. So the cut is taken here,
    in the open: THIRTEEN JOINTS TO EIGHT, four per reviewer, each one load-bearing.
  what_the_cut_costs_named_rather_than_hidden: >-
    FIVE JOINTS' WORTH OF ATTACK SURFACE IS NOT BOUGHT. Concretely: no reviewer separately
    audits the generator action profile, the two-sided decoy set, or CTL-GEN-ACT's units
    this round, because this batch does not re-measure them; and the Red Team gets ONE
    proves-too-much joint rather than the round-2 combination of a proves-too-much joint
    PLUS a compositional-invariant/nearby-object joint PLUS a cheapest-distinguishing-control
    joint. THE NEAREST-OBJECT MUTATION WORK IS FOLDED INTO R-a AS A FLOOR RATHER THAN
    DELETED, and R-d retains the cheapest-distinguishing-control question. WHAT IS
    GENUINELY LOST IS BREADTH, and round 2's own evidence is that breadth is where the
    unanticipated objects came from -- O-RT2, O-RT2-prime and O-RT3 were none of them on the
    plan's list.
  the_honest_residual: >-
    EVEN AT EIGHT JOINTS THE DECLARED 300 s PER REVIEWER IS BELOW THE MEASURED PER-JOINT
    RATE, AND THIS SAYS SO AT OPENING INSTEAD OF RECORDING A FOURTH CALIBRATION NOTE AT THE
    CLOSE. An overrun in AGENT time is EXPECTED, is to be DISCLOSED in the attestation, is
    NOT to be met by reallocating a ceiling, and is NOT a defect in the review. What a
    reviewer may NOT do is silently drop an assigned joint: if the budget binds, the joint
    is reported as NOT REACHED with what was tried, which is the form round 1 used and which
    the close can compose.

