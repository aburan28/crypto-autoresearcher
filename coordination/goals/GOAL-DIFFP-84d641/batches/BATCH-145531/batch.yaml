objective: >-
  MAKE BATCH-efcae7's OWN OUTPUT READABLE, THEN MEASURE THE ONE THING IT COULD NOT --
  EXECUTING THE GOAL HEAD'S SINGLE RECORDED next_action AND NOT RE-LITIGATING IT.
  ONE EXECUTOR TASK, THREE GATED STAGES, UNDER THE FROZEN CONTRACT EXP-DIFFP-04082e.
  (1) A per-primitive analysis of the committed `adjudicator.serialize()` that decides,
  for each of the 60 ordered pairs of strict key components, whether one is a
  deterministic function of the other -- every claimed edge carrying BOTH a written
  derivation from committed source AND an empirical witness, with a NULL-OBJECT CONTROL
  proving the edge detector can return NO EDGE.
  (2) A re-partition of every depth-1 verdict of BATCH-efcae7 into PROVABLY UNDETECTABLE
  BY ANY FAMILY / NOT PROBED BY A DECLARED FAMILY / PROBED AND GENUINELY NOT DETECTED,
  and for the DETECTED rows ENTAILED BY THE PERTURBING FAMILY'S OWN DECLARATION versus
  CONTINGENT ON THE INSTRUMENT -- DERIVED FROM THE GRAPH ALONE, WRITTEN BEFORE THE
  COMPARISON, and only then compared against the pre-registered 1 / 3 / 0 / 1 / 1.
  Reproducing or refuting that partition is this task's first deliverable AND ITS OWN
  FALSIFICATION TEST. Then the depth-2 subsets that BREAK a dependency are named from the
  graph, so the fifteen-subset lattice is bought by argument rather than by compute.
  (3) GATED ON THAT OUTPUT AND INSIDE THE SAME TASK: only the OFF-DIAGONAL cells the
  graph marks as capable of carrying information are adjudicated, twice -- once against
  the honest instrument and once against O-E, the per-primitive-blind KNOWN-FALSE
  instrument ALREADY BUILT AND MEASURED BY TASK-20260824-e9d21a AND REUSED RATHER THAN
  REBUILT -- and the COUNT OF DIFFERING CELLS is reported with its excluded-cell list and
  every exclusion's reason. Two degenerate instruments run through the identical counting
  rule so the count has a demonstrated capacity to be large.
  Finally RC-1 is discharged by RE-SCORING in the new module, never by editing the
  committed one, and its outcome on O-E is reported as the confirmation of a known
  outcome that it is.
  AT CENSUS SIZE ZERO. NO ACQUISITION. NO SEARCH. NO NEW SEED. CLAIM CEILING `analyzed`.

