    rationale:
      - >-
        IT IS THE GOAL HEAD'S SINGLE RECORDED next_action AND IT IS EXECUTED, NOT RE-LITIGATED.
        DEC-20260824-c5bb72 ranked it FIRST against SEVEN real alternatives and the ranking is
        adopted rather than re-derived. Its winning argument stands: it is the only candidate that
        makes BATCH-efcae7's own output readable, and its first stage costs zero charged compute.
        Right now this program cannot honestly report a per-component profile at all, because a NOT
        DETECTED verdict is a provable impossibility, a coverage gap or a genuine negative and the
        current single column cannot tell a reader which.
      - >-
        IT CAN FAIL INFORMATIVELY IN BOTH DIRECTIONS AND THE CONTRACT SAYS SO IN ADVANCE. If the
        graph has one edge and no more, the partition collapses to what is already known and the
        reversal buys little -- a cheap fast negative that would PROMOTE the full six-by-six matrix
        in the next ranking. If the derived partition refutes the pre-registered 1/3/0/1/1, then
        either the graph or BATCH-efcae7's reading is wrong, and the derivation decides which. If
        the off-diagonal matrices are identical, the profile carries no information about the
        instrument at all. EVERY ONE OF THOSE IS A RESULT AND NONE IS A DISAPPOINTMENT.
      - >-
        THE CONTRACT ADDS THREE THINGS THE next_action DID NOT NAME, EACH BECAUSE A COMMITTED RECORD
        DEMANDS IT AND NOT BECAUSE THIS COORDINATOR PREFERRED IT. (a) A NULL-OBJECT CONTROL FOR THE
        EDGE DETECTOR, because a procedure that reports "Y is constant within every X-group" will
        report an edge for any pair whenever the population has few enough distinct X values, and
        docs/inventor-protocol.md requires a null-object control before belief. (b) NULL-OBJECT
        CONTROLS FOR THE COUNTING RULE, two degenerate instruments through the identical counter, so
        the differing-cell count has a demonstrated capacity to be large -- a count with no such
        capacity is the 96/96-and-0/3000 failure one layer up. (c) A REQUIREMENT THAT EVERY EDGE
        CARRY A DERIVATION AND NOT ONLY A WITNESS, because "provably undetectable" is a claim of a
        kind this goal has not made before and 960 objects with zero exceptions is a witness rather
        than a proof.
      - >-
        THE REVIEW SHAPE IS TWO SIBLING-BLIND SESSIONS AND THE ARGUMENT IS IN
        `review_architecture`. Completion criterion 4 is unreachable with one reviewer; the goal
        head's restriction (4) requires ANSWERING J8, J11 and J13 rather than declining to assign
        them; and this goal's own record holds two measured counterexamples to the one-reviewer
        argument, the second of which -- two mutually blind readings of one line of code composing
        into a finding neither could have made alone -- was BATCH-efcae7's best output.
      - >-
        THE COST IS PAID IN JOINTS AND DECLARED AT OPENING, WHICH IS WHAT PD-6 DEMANDED. Thirteen
        joints to eight, four per reviewer, with what the cut loses named: breadth, which is exactly
        where round 2's unanticipated objects came from.
      - >-
        BIAS TOWARD EXPONENT-MOVING MECHANISMS IS NOT SATISFIED BY THIS BATCH AND SAYING SO IS PART
        OF THE DECISION. docs/target-result-profile.md asks for exponent-moving results on central
        hard problems. THIS BATCH MOVES NO EXPONENT AND CLAIMS NONE. It is instrument work, and this
        goal's own opening argued that a claim a path is NEW is unfalsifiable until the adjudication
        machinery exists and its controls can answer NO. What round 2 measured is that the machinery
        cannot yet report on itself, and an instrument that cannot distinguish itself from five
        known-false variants must not be the first thing a newly acquired published path meets. THAT
        IS A SEQUENCING ARGUMENT AND NOT A CLOSURE: acquisition does not get cheaper by waiting, the
        MD5 lane is BLOCKED and NOT CLOSED, and the revisit condition is concrete -- this batch
        completing, or a GOAL-MD5-001 decision unblocking Tier B, whichever comes first.
