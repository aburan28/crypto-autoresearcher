    WHY THE FRONT-LOAD IS JUSTIFIED. Batch 3 absorbs work that batches 4-6 would otherwise
    each have to fund separately: RC-1's fold (DEC-20260824-c5bb72 rank 2, explicitly
    sequenced into this batch), the off-diagonal half of CTL-DIAGONAL (rank 3, which loses
