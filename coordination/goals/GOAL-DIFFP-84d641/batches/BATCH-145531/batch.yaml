binding_rules:
  note: >-
    BR-1..BR-7 ARE CARRIED FORWARD FROM BATCH-efcae7 UNCHANGED AND ARE RESTATED IN ONE LINE
    EACH RATHER THAN RE-ARGUED; their bases are in that batch's record and in
    DEC-20260824-af6d5c. BR-8..BR-13 ARE NEW AND EACH ONE IS A DEFECT DEC-20260824-c5bb72
    MEASURED AGAINST THIS COORDINATOR ROLE, cited to where it was found. NONE IS A STYLE
    PREFERENCE.
  BR-1:
    rule: >-
      WHILE A ROUND IS OPEN, NO REVIEW FINDING APPEARS IN ANYTHING A CONCURRENT AGENT
      READS. Reviewer and archive artifacts are committed with a SUBJECT LINE ONLY and no
      findings, verdicts, mechanisms or integers in the message body; the same restriction
      covers PR titles and descriptions, tools/agent_bus.py messages, branch names and any
      coordination/events/main/** digest text. Reviewers use `git log --format=%H` until the
      round closes.
    status: CARRIED FORWARD. MEASURED TO HAVE WORKED IN ROUND 2 -- DEC-20260824-c5bb72 records that mutual blindness HELD, a change of state from round 1.
  BR-2:
    rule: >-
      EVERY JOINT CARRIES A SHORT `id: J1..Jn` ALONGSIDE ITS `joint:` STATEMENT, and every
      reviewer lists those short ids in `joints_owned`.
    status: CARRIED FORWARD. MEASURED TO HAVE WORKED -- with BR-3 it is what made tools/check_review_independence.py functional for the first time in this goal.
  BR-3:
    rule: EVERY `blind_from` ENTRY IS A LITERAL PATH PREFIX. No glob characters, no `**`, no English prose describing a document section.
    status: >-
      CARRIED FORWARD AND NOW LOAD-BEARING FOR THE SEALED PRIOR. The checker's leak test
      matches literally (`r == b or r.startswith(b.rstrip("/") + "/")`), so
      `coordination/goals/GOAL-DIFFP-84d641/sealed-priors` is written with no wildcard.
  BR-4:
    rule: '`proves_too_much` CARRIES A TOP-LEVEL `failure_signature` ROLL-UP in addition to any per-object signatures.'
    status: CARRIED FORWARD.
  BR-5:
