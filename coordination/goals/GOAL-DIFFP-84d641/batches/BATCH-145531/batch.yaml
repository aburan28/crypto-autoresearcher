  BR-6:
    rule: A COORDINATOR EITHER RECOMPUTES A SCALAR IT INTENDS TO BIND, OR QUOTES IT WITH ITS PROVENANCE AND MARKS IT UNVERIFIED.
    status: >-
      CARRIED FORWARD AND BINDING ON THIS FILE. This session has no shell, so every integer
      here and in EXP-DIFFP-04082e is quoted from a named committed artifact and attributed to
      the session that measured it.
  BR-7:
    rule: >-
      THE PRODUCER'S CODE PATHS ARE DECLARED IN THE PRODUCER'S OWN QUEUE `artifact_paths` AT
      BATCH OPENING, where the archive subset rule permits the snapshot to bind them.
      Retrofitting at the ledger archive is structurally impossible.
    status: >-
      CARRIED FORWARD AND EXTENDED BY BR-8. harness/diffpath/depgraph.py and
      tests/test_diffpath_depgraph.py are declared in TASK-20260824-68ba87's artifact_paths.
      RUN DIRECTORIES ARE STILL NOT DECLARED, on purpose: a completed archive's path_sha256
      must cover EVERY declared source artifact, so declaring the files of a GATED run would
      make the snapshot unable to complete whenever that run correctly does not execute.
      run-index.json IS declared and must carry a sha256 for every file of every executed run.
  BR-8:
    rule: >-
      EVERY REVIEWER'S SUB-ARTIFACTS ARE BINDABLE AT OPENING, BY A MANDATORY INDEX RATHER
      THAN BY GUESSING FILENAMES. Each reviewer's `artifact_paths` declares TWO paths: its
      report, AND a `constructions-index.json` that the reviewer MUST write and that carries
      a sha256 for EVERY file it produced under its own `constructions/` directory. The index
      may list zero files; it may never be absent. The construction files themselves are then
      CONTENT-BOUND BY A BOUND ARTIFACT and are additionally disclosed in the ledger receipt's
      `staged_not_in_binding_set`.
    basis: >-
      DEC-20260824-c5bb72 PD-2, AND IT IS WORSE THAN A RECURRENCE: BATCH-f8bf86's ledger
      receipt named this exact fix -- "DECLARE EVERY REVIEWER SUB-ARTIFACT IN THE REVIEWER'S
      OWN artifact_paths AT PLAN TIME" -- and routed it to batch 2, and batch 2 declared one
      path per reviewer. The Red Team's six construction files carrying the round's
      load-bearing counterexample were therefore unbindable, for the SECOND consecutive batch.
    why_an_index_rather_than_the_files: >-
      BECAUSE THE FILENAMES ARE NOT KNOWN AT OPENING AND THAT IS EXACTLY WHY THE FIX KEPT
      FAILING. Declaring a directory would make the archive fragile: a completed archive must
      hash every declared artifact, so a reviewer that builds nothing would block the close.
      An index is known at opening, is always writable, and carries the digests. THIS IS THE
      SAME MECHANISM BR-7 ALREADY USES FOR RUN FILES THROUGH run-index.json, and it is applied
      to reviewers because it is the mechanism that works.
  BR-9:
    rule: >-
      THE SEALED PRIOR LIVES OUTSIDE EVERY REVIEWER READ SCOPE, AND THE REVIEW PLAN'S
      MANDATORY `coordinator_prior` FIELD CARRIES A POINTER AND A SEALED MARKER, NEVER THE
      SENTENCE. The plan's `blind_from` names the sealed-prior path prefix literally.
    basis: >-
      DEC-20260824-c5bb72 PD-3 and E-3: round 2's residual was WIDER than the round disclosed,
      because the one-sentence prior naming the in_linearized_code mechanism sat inside
      review-plan.yaml, which the independence checker REQUIRES to be non-empty and which BOTH
      reviewers list in sources_read. The discount applied to both reviewers rather than one,
      and the finding was against the plan, which was this Coordinator role's.
  BR-10:
    rule: >-
      THE BLINDNESS BLOCK COVERS COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY, NOT ONLY
      GIT COMMANDS. While a round is open, a producer NAMES COMMITS BY ROLE ("the snapshot
      commit", "the opening commit") AND NOT BY SHA, and describes no commit's contents in a
      committed artifact inside a reviewer's read scope.
    basis: >-
      DEC-20260824-c5bb72 PD-4, disclosed by the Red Team as a NEAR MISS the plan did not
      cover: the producer's own committed execution report QUOTES THREE COMMIT SHAS AND
      DESCRIBES WHAT TWO OF THEM CONTAIN, inside both reviewers' read scope. Forbidding
      `git show` does not forbid a committed artifact from quoting history, and round 1's leak
      arrived through exactly this channel in its git form. No finding travelled through it in
      round 2 and nothing was discounted; the channel is closed here.
  BR-11:
    rule: >-
      TASK CARDS AND HANDOFFS DEFER TO THE ROLE CONTRACT ON COMMITTING. NO REVIEWER COMMITS
      ITS OWN REPORT. A reviewer leaves its output untracked at its declared write scope and
      the LEDGER ARCHIVE task commits it. No card or handoff of this batch instructs otherwise.
    basis: >-
      DEC-20260824-c5bb72 PD-1: both round-2 reviewers faced a CONFLICT BETWEEN TWO BINDING
      DOCUMENTS -- their role contract ("do not commit in a shared worktree") and their task
      cards ("commit your report with a subject line") -- and both chose the role contract. The
      Coordinator's ruling was that THE ROLE CONTRACT IS RIGHT AND THE TASK CARD WAS WRONG, and
      that batch 3 must reconcile them AT OPENING BY AMENDING THE CARDS, NOT THE ROLE CONTRACT,
      so the next reviewer does not have to choose. THAT IS DONE IN THIS BATCH'S CARDS.
    the_consequence_that_is_carried_rather_than_hidden: >-
      Because reviewer reports are untracked until the ledger archive, the refutation artifacts
      are archived by the SAME commit that files the decision relying on them rather than by an
      earlier one. Content binding still holds -- both reports AND now their construction
      indexes are in the archive's path_sha256 (BR-8) -- so the ordering requirement of
      docs/claims-and-verification.md is met IN SUBSTANCE and not in the stricter form of a
      prior commit. THIS BATCH SAYS SO RATHER THAN CLAIMING THE STRICTER FORM.
  BR-12:
    rule: >-
      RUN LOCATION IS A CONTRACT TERM AND EVERY FUTURE EXPERIMENT CONTRACT OF THIS GOAL NAMES
      IT: `experiments/<EXP-ID>/runs/<RUN-ID>/`. THE PRODUCER MEASURES tools/validate_ledger.py
      ACCEPTANCE OF ITS OWN NEW RUN DIRECTORIES AFTER THEY EXIST AND BEFORE THE SNAPSHOT
      ARCHIVE, AND RECORDS THE OUTPUT VERBATIM WHETHER IT PASSES OR FAILS.
    basis: >-
      DEC-20260824-c5bb72 `run_registration_defect` and PD-11. tools/validate_ledger.py
      registers runs from exactly one glob, `experiments/*/runs/*/manifest.yaml`; this campaign
      wrote its eleven run directories under the batch task path; so no evidence record of this
      goal has ever been able to cite a run by id. The CONTRACT OMISSION WAS THIS COORDINATOR
      ROLE'S and the harness gap is the repository's. EXP-DIFFP-04082e H-10 and `run_location`
      discharge it for new runs.
    what_the_producer_does_if_the_check_fails: >-
      NOT EDIT harness/runner.py AND NOT HAND-EDIT A MANIFEST. Write a manifest-supplement.yaml
      beside each manifest with the full AGENTS.md Artifact Policy field set, report the
      rejection VERBATIM as an infrastructure finding, and continue. The ledger close decides
      whether `run_ids` may be cited; the producer decides nothing about it.
  BR-13:
    rule: >-
      EVERY PROSE VALUE IS WRITTEN AS A BLOCK SCALAR OR QUOTED THE FIRST TIME, NOT REPAIRED
      AFTER A PARSER REJECTS IT. Concretely, a value goes in a `>-` block or in quotes if it
      contains a colon-space, or if it begins with a backtick, `@`, `%`, `*`, `&`, `!`, `?`,
      `|`, `>` or `-`. Two SILENT classes are covered by the same rule and matter more than
      the loud ones, because they parse: a prose value that DEDENTS to a mapping indent
      silently ends its own block, and a list item written as `- some prose: more prose`
      silently becomes a single-key MAPPING rather than a string, which is how a required
      deliverable can be removed from a `must_contain` list without any tool complaining.
      A LIST OF SENTENCES IS A LIST OF BLOCK SCALARS.
    basis: >-
      FIVE PARSE FAILURES OF THIS FAMILY ACROSS THREE COORDINATOR SESSIONS OF THIS CAMPAIGN,
      plus two silent single-key-mapping instances caught only by a hand sweep -- measured and
      reported by the DRIVING SESSION, not by this subagent. In order: an embedded colon-space
      inside a backticked fragment in acquisition-targets.yaml; a key holding both a scalar and
      list items in retrieval-log.yaml; a leading backtick in review-plan.yaml and
      assignment-e9d21a.yaml; a dedent landing at mapping indent in EV-DIFFP-b16b01.yaml; and
      an unquoted `13 (BATCH-efcae7: seven validator joints...)` in THIS FILE at authoring
      time, fixed in the same pass it was reported.
      IT IS NOT CARELESSNESS AND NAMING THE CAUSE IS WHY THE RULE IS CHEAP: this program's
      records are unusually PROSE-DENSE, and prose naturally contains colons, backticks and
      parenthetical identifiers. Quoting at authoring time costs nothing; five round-trips is
      what not quoting has cost.
    why_this_is_a_binding_rule_and_not_a_gate: >-
      BECAUSE THERE IS NO GATE AND THAT IS ITSELF THE INHERITED SUCCESSOR ITEM.
      tools/check_merge_hygiene.py parse-gates `ledger/**.yaml` and
      `experiments/*/specification.yaml`, but under `coordination/` it checks `.json` ONLY.
      EVERY BATCH RECORD, REVIEW PLAN, ASSIGNMENT, EXECUTION REPORT AND REVIEWER REPORT IN THIS
      PROGRAM IS THEREFORE UNPARSE-GATED. DEC-20260824-c5bb72 `successor_gates` already carries
      the coordination YAML parse gate as an owed item that is out of scope for a research
      close; this instance is MORE EVIDENCE FOR IT AND NOT A NEW FINDING, and BR-13 is the
      authoring-side discipline that reduces the damage while the gate does not exist.

