      NO PRODUCER-REPORTED VALUE FOR A BLINDED QUANTITY APPEARS IN THE ASSIGNMENT DOCUMENT.
      The assignment a reviewer is ordered to read is SPLIT from the sealed prior, which the
      reviewer never receives.
    status: >-
