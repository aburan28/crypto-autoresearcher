what_this_batch_deliberately_does_not_do:
  it_does_not_repair_the_instrument_and_the_one_exception_is_argued_not_slipped_in: >-
    VD-3, VD-4, THE {E4}/{E5} ZERO-IMAGE RESULT, OBJ-3 AND OBJ-4 STAND OPEN AND ARE NOT
    REPAIRED BY THIS BATCH. The reason is DEC-20260824-af6d5c's, strengthened by
    DEC-20260824-c5bb72 rank 4: fixing an instrument whose controls cannot see the fix
    leaves a repair that is ATTESTED rather than MEASURED, and round 2 measured that the
    apparatus which would have to detect a regression is weaker than it looked -- only 1
    of 6 depth-1 verdicts is contingent on the instrument at all. That ranking moves the
    repairs FURTHER behind measurement, not closer, and this batch honours it.
    TWO ITEMS ARE IN SCOPE AND EACH IS ARGUED RATHER THAN ABSORBED, BECAUSE THE
    ASSIGNMENT ASKS FOR THE READING TO BE STATED EXPLICITLY.
    (A) RC-1's FOLD IS IN SCOPE BECAUSE DEC-20260824-c5bb72 PUT IT THERE. Its rank-2 entry
    ends "The fold is sequenced INTO batch 3 behind rank 1, not deferred out of it." It is
    implemented as a RE-SCORING in the new module (CTL-RC1) and NEVER as an edit to the
    now-committed harness/diffpath/controlpower.py, whose outputs are reported unchanged
    beside the re-scored ones. Its result on O-E is KNOWN IN ADVANCE and is reported as a
    confirmation; its genuinely open content is whether it touches the other four
    survivors, and the pre-registered answer is that it touches none.
    (B) THE WELL-FORMEDNESS GATE (CTL-WF) IS IN SCOPE BECAUSE IT IS A PRECONDITION, NOT A
    REPAIR. DEC-20260824-c5bb72 `successor_gates` item 2 makes it the precondition of
    executing any family that perturbs a field other fields determine, and stage 3
    requires six such families. Without it, a family that constructs objects whose
    redundant fields contradict each other would produce detections that mean nothing --
    round 1's malformed-object failure recurring at the family level. It is built in the
    NEW module and touches nothing committed. It is OBJ-10's precondition half and NOT
    OBJ-10's repair half; null family (e) still is not executed.
    THE TWO LABELLING DEFECTS DEC-20260824-c5bb72 ROUTED HERE ARE FIXED FORWARD, NOT
    BACKWARD: hard terms H-8 and H-9 make this contract's own artifacts emit `null` for an
    unmeasured cell and name aggregate keys as aggregates. THE IMMUTABLE BATCH-efcae7
    ARTIFACTS ARE NOT EDITED and their labels stand, superseded by reference.
  it_acquires_nothing: >-
    NO TASK OF THIS BATCH HOLDS web_search AND NO ACQUISITION OF ANY TIER IS AUTHORISED.
    AMD-20260824-DIFFP-ACQ-1 stands unchanged and in force. THE MD5 LANE IS BLOCKED, NOT
    CLOSED, with its named unblocking route -- a GOAL-MD5-001 decision -- intact. NO
    RECORD OF THIS BATCH MAY STATE OR IMPLY OTHERWISE, and letting "blocked" drift into
    "closed" would be the premature closure docs/inventor-protocol.md names as symmetric
    with overclaiming.
  it_searches_nothing: No search over either difference space, no collision attempt, no cost projection, no attack-complexity figure.
  it_mints_no_IDEA_id: >-
    TASK-20260824-873dc9's PROPOSAL SET REMAINS GATED pending a review of its Pareto
    `dominated_by` and `sota_delta` honesty and its novelty-status discipline. Unchanged,
    not forgotten, and no task of this batch is authorised to mint from it.
  it_does_not_relocate_the_eleven_existing_run_directories: >-
    RUN LOCATION BECOMES A CONTRACT TERM FOR NEW RUNS (EXP-DIFFP-04082e H-10) AND THE
    ELEVEN EXISTING DIRECTORIES ARE NOT TOUCHED. Their registration is a declared successor
    task whose gate DEC-20260824-c5bb72 already wrote: copy never move, declare both paths
