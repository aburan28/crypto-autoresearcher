contamination_firewall: >-
  GOAL-MD5-001's BCP-1 QUARANTINE (coordination/goals/GOAL-MD5-001/quarantine/**, payload
  sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) IS NOT READ BY ANY
  TASK OF THIS BATCH, AND THE FIREWALL COVERS CONTENT BY EVERY ROUTE -- the network, a package
  index, a model's own memory reproduced into a file, and any retrieval index
  (AMD-20260824-DIFFP-ACQ-1 OB-1). EVERY TASK ATTESTS NON-READING AND NAMES ITS MECHANISM,
  because DEC-20260824-c5bb72 recorded that round 2's reviewers attested BY MECHANISM rather
  than by intent -- one by constructing planted entries directly rather than calling the
  census builder that byte-hashes the payload, the other by replacing that function with a
  stub in its own process -- and that is the standard this batch inherits, not attestation by
  good faith.
  THIS BATCH DOES NOT RE-HASH THE PAYLOAD. CTL-QUAR discharged that in batch 1, the Validator
  independently confirmed the digest from the bytes, and TASK-20260824-3bd362's OBJ-9 raised
  for precedent that even a BYTE COUNT of a quarantined payload is a derived quantity beyond
  the authorised whole-file sha256.
  A BREACH INVALIDATES THE RUN SET UNDER EXP-DIFFP-04082e IR-1 and is reported to
  GOAL-MD5-001 as a cross-goal contamination finding.
  THE MD5 LANE IS BLOCKED, NOT CLOSED. No record of this batch may state or imply that the MD5
  arm is exhausted, deprioritised on the merits, or screened out. The Tier B unblocking route
  through a GOAL-MD5-001 decision is intact and acquisition does not get cheaper by waiting.

knowledge_retrieval: >-
  EVERY TASK ATTEMPTS `search_knowledge` BEFORE ANY ASSERTION ABOUT WHAT HAS OR HAS NOT BEEN
  TRIED, AND RECORDS ITS QUERIES AND OUTCOMES VERBATIM. The index is DERIVED and may be empty;
  an empty answer is a fact about the index and licenses no inference in either direction
  (AGENTS.md "Knowledge retrieval policy"). NO TASK OF THIS BATCH WRITES TO THE INDEX.

runtime_policy: >-
