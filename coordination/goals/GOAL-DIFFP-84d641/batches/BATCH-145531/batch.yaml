  in their review rounds and that reviewer model identifiers were SELF-REPORTED rather than
  measured; that limitation is expected to recur and must be stated plainly rather than upgraded.
  NEVER AMAZON BEDROCK in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).

