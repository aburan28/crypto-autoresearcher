  # ===================================================================
  defects:
    - id: D-1
      joint: R3-J3
      severity: major
      batch_halting: false
      title: >-
        The per-primitive partition branches rest on a primitive-blind probing profile, and one
        branch's entire evidence is drawn from the other primitive.
      measurement: >-
        The sha1 branch of the `step_delta` row is CONTINGENT_ON_THE_INSTRUMENT with five
        examples, all of them md5 draws matched against md5 census entries, byte-identical to the
        md5 branch's list. Restricted to sha1 draws against sha1 entries, isolating_draw_count is
        0 and own_source_differing_count is 0, so the honest sha1 class is R5 NOT_PROBED.
      consequence: >-
        The emitted primitive_scope for that row is wrong on one half; the row class, the class
        counts and the 5-of-6 agreement are unchanged. H-4 and H-7 violation.
      remedy_named_without_an_identifier: >-
        Compute probing_profile per primitive and pass probing[prim][comp]; or, if the global
        quantifier is intended, rename the fields so they say so and stop emitting a per-primitive
        class from a primitive-blind statistic. A correction record is owed against the emitted
        primitive_scope of the step_delta row.
    - id: D-2
      joint: R3-J3
      severity: major
      batch_halting: false
      title: >-
        The implemented R2 carries an undeclared restriction to one family by name, and the
        restriction is load-bearing in the direction of the pre-registered target.
      measurement: >-
        derive_partition filters R2 candidates by `and n == "d_message_difference"`. The emitted
        ASSIGNING_RULE says only "a declared family's own declaration". Applying the text as
        written, d_step_delta (368/368 accepted per primitive) and d_block_index (368/368) give
        step_delta and block_index the ENTAILED class, changing the counts from 2/2/0/1/1 to
        2/1/0/3/0 and the agreement from 5 of 6 to 3 of 6.
      consequence: >-
        A reader cannot reproduce two of six rows from the artifact's own account of its rule.
        H-7 violation of the shape CORR-20260824-c1c8b1 already recorded once against this goal.
        I judge the code's behaviour substantively correct and the rule text false of it.
      remedy_named_without_an_identifier: >-
        One clause of text: R2 must read "a family DECLARED BY EXP-DIFFP-4b165f". A correction
        record is owed against the emitted assigning_rule string.
    - id: D-3
