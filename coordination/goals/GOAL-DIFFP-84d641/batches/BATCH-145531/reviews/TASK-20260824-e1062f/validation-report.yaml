          constructions file.
        independent_re_derivation_of_the_committed_integers: >-
          30 OF 30 AGREE, 0 DISAGREEMENTS, AND THE STOP DID NOT FIRE. Six quantities -- plant,
          null_fp_total, d_md5_k_ge_1_member, d_sha1_k_ge_1_member, k0 and subarm_incode_member
          -- recomputed for each of the five survivors and compared against the committed
          j8_results.json. O-E reproduces plant 96/96, null_fp 0, d-arm members 0 and 0, k0
          16/16 and subarm 520/520; the other four reproduce subarm 0/520. IR_11_disagreements
          is empty.
        THE_MIRRORED_DRAW_LOOP_WHICH_IS_WHERE_A_DRIFT_OF_ONE_DRAW_WOULD_HIDE:
          the_mirror_exists_and_is_declared: >-
            DEV-3. family_d_draws() MIRRORS controlpower.family_d_primary rather than calling
            it, because the committed function returns counters and not objects.
          i_checked_the_mirror_against_the_committed_loop_LINE_BY_LINE_and_then_measured_it: >-
            THE LOOPS ARE STRUCTURALLY IDENTICAL: one random.Random at
            SEEDS["null_draw_message_difference_perturbed"], census order, then k ascending over
            the same K_VALUES, then the deterministic draw followed by R_SEEDED = 64 seeded
            draws built by the same rng.sample call, and the same
            perturb_message_difference(src, pos, f"k{k}-{draw_type}-...") call with the same tag
            format. THE SHARED RNG IS CONSUMED IN THE SAME ORDER, which is the part that matters:
            a mirror with the same counts but a different consumption order would produce
            different objects.
          measured_per_cell_draw_counts: >-
            8 DRAWS AT k = 0 AND 520 AT EACH OF k IN (1,2,4,8,16), PER PRIMITIVE, 5216 IN TOTAL
            AND 5200 PERTURBED. Exactly the committed shape (8 entries by 65 draws = 520). The
            k0 check "16/16" in the RC-1 table is the same fact measured a second way.
          conclusion: >-
            THE MIRROR DOES NOT DRIFT AND ITS SELF-CHECK IS REAL RATHER THAN ASSERTED. Had it
            drifted by one draw, all thirty RC-1 member integers would have had to disagree with
            the committed file, and none does.

      nothing_is_reported_as_a_fraction_a_pass_a_score_or_a_margin:
        ruling: >-
          H-5 AND IR-10 ARE SATISFIED. I scanned every result JSON for `percent`, `% of`,
          `pass rate`, `passed the`, `score`, `margin` and a fraction-named key. Every hit is
          either a DISCLAIMER -- "IT IS NEVER A FRACTION, A PASS, A SCORE OR A MARGIN (IR-10,
          H-5)" -- or the word "re-scored"/"RE-SCORED" in the RC-1 rescoring note. There is no
          affirmative fraction, percentage, pass, score or margin anywhere.
