          YES. differing_cells_aggregate 0 is emitted beside cells_adjudicated_aggregate 9, the
          full 27-cell excluded list with every reason, and the per-cell table; every cell record
          carries its per-primitive breakdown and census_completeness; permissive cells are
          emitted as null and never as 0 (H-8, IR-5).
        a_contract_text_tension_i_report_as_a_tension_and_not_as_a_producer_defect: >-
          IR-10 forbids the literal form "N of M cells" while H-5 requires the integer "beside
          the number of cells adjudicated". The execution report writes "9 differing cells of 9"
          and "0 differing cells of 9". THE PRODUCER DID NOT REPORT A PASS -- the per-cell table
          and the exclusion list are both present, which is what IR-10's prohibition exists to
          protect -- and it wrote the H-5 form with "of" where "beside" would have avoided the
          collision. The two clauses cannot both be honoured literally and the successor
          contract should reconcile them.

      THE_SCOPE_OF_THE_COUNT_WHICH_IS_WHAT_THIS_JOINT_OWNS:
        the_count_is_scoped_to_exactly_the_cells_it_adjudicated: >-
          YES, AND I VERIFIED THE DENOMINATOR BEFORE THE NUMERATOR AS INSTRUCTED. 0 differing
          cells over 9 adjudicated cells, out of a 36-cell matrix, with 27 cells excluded under
