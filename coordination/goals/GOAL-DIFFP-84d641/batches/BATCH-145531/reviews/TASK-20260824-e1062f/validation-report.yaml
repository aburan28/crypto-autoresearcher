        the_scope_fact_the_close_MUST_carry_beside_the_integer_0: >-
          ALL NINE ADJUDICATED CELLS ARE `NOT DETECTED` FOR BOTH INSTRUMENTS, AND THE UNDERLYING
          TABLE IS UNIFORMLY ZERO: across the 9 cells the honest instrument finds 0 strict
          members in 19,920 perturbed draws at k >= 1 (5200 draws in each of three
          d_message_difference cells and 720 in each of six others), and O-E finds 0 in the same
          19,920. The differing-cell count of 0 is therefore a difference between two identically
          empty columns, not between two populated ones. THE CONTRACT'S OWN TAIL CHECK APPLIES:
          a quantity exactly flat in every parameter meant to modulate it -- k, family, row and
          instrument -- is an artifact tell under docs/inventor-protocol.md section 3 and must
          not be cited as robustness. Neither the producer's artifacts nor mine cite it that way,
          and I record the obligation that no downstream record may either.
        what_this_count_licenses_and_what_it_does_not_in_my_scope: >-
          IT LICENSES ONLY THIS: over these nine cells, at these seeds, on this census, in strict
          mode, the honest instrument and O-E are indistinguishable. WHETHER THE COUNT MEANS
          ANYTHING -- whether a count with this scope can separate a known-false instrument from
          an honest one at all -- IS R3-J8's AND IS THE RED TEAM'S, and I do not answer it. I
          record the scope so that whoever does answer it has the denominator right.

      defects_found_under_this_joint: [D-9, D-10]
      batch_halting: false
      what_i_could_not_determine_under_this_joint: >-
        (a) I DID NOT INDEPENDENTLY RE-VERIFY TASK-20260824-e9d21a's j8_results.json against ITS
        OWN construction -- I verified that this batch REPRODUCES those committed integers, which
        is what IR-11 asks. If the committed file were itself wrong, this check would agree with
        it and I would not see it.
        (b) I did not adjudicate the four unreplicated survivors beyond confirming their RC-1
        integers reproduce; they were built once by one session and this round re-executes them
