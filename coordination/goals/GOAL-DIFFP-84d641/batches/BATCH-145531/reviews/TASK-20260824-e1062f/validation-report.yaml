            whole md5 population. See the labelling finding below.
        edge_2:
          edge: (step_delta -> length) on sha1
          label_as_reported: derived_and_witnessed
          ruling: >-
            SAME DERIVATION, SAME RULING, SOUND. Measured on 3208 sha1 objects with zero
            exceptions.
          witness_capacity: >-
            THE WITNESS CANNOT FAIL. distinct_Y is 1: `length` is the constant 80 on the whole
            sha1 population.
        edge_3:
          edge: (message_difference -> length) on sha1
          label_as_reported: derived_and_witnessed
          ruling: >-
            THE DERIVATION SAYS WHAT THE CODE DOES. plant_from_pair sets dv = full_dv[a:b+1]
            over the closed range; act_E1_shift sets dv = full[a+s : b+s+1] and step_range =
            (a+s, b+s), preserving both sides; act_E3_negate leaves dv untouched;
            perturb_message_difference XORs in place and perturb_by_codeword XORs an 80-word
            codeword element-wise, neither changing the word count. I measured
            len(dv) == length on all 3208 sha1 objects with zero exceptions. The derivation
            also states in terms that it DOES NOT HOLD ON MD5, where delta_m is always 16
            words whatever the length, and the graph is consistent with that: no such md5 edge
            is labelled derived.
          witness_capacity: THE WITNESS CANNOT FAIL. distinct_Y is 1.
        edge_4:
          edge: (message_difference -> in_linearized_code) on sha1
          label_as_reported: derived_and_witnessed
          ruling: >-
            THE DERIVATION SAYS WHAT THE CODE DOES AND IT IS THE ONLY EDGE OF THE GRAPH WHOSE
            WITNESS COULD HAVE FAILED. primitives.sha1_in_linearized_code(words) returns
            sha1_expand(words[:16], len(words)) == list(words), a pure function of the word
            list. I verified from source that perturb_message_difference and
            perturb_by_codeword RECOMPUTE the flag after modifying the dv, and that
            act_E1_shift does NOT -- it carries the flag over. I measured
            obj.in_linearized_code == P.sha1_in_linearized_code(list(obj.dv)) on all 3208
            sha1 objects with ZERO exceptions, including all 64 E1-shift images.
          the_two_scope_limits_the_derivation_declares_against_itself_are_both_real: >-
            (a) The flag is computed by plant_from_pair from the FULL 80-word expansion while
            the serialised value is the step-range slice, and the two coincide only at FULL
            step range, which is where every planted entry of this census sits. TRUE and I
            confirm it; the sha1 population has exactly one length, 80. (b) act_E1_shift and
            act_E2_rotate carry the flag rather than recomputing it, so the derivation covers
            their images only because W3 is MEASURED on them. TRUE for E1, whose 64 images are
            in the population. E2 is NOT in the STRICT generator set, so its images are not in
            this population at all, and naming it is over-cautious rather than wrong. FOR
            THOSE 64 OBJECTS THE CLAIM IS MEASURED, NOT DERIVED, AND THE PRODUCER SAYS SO.
          witness_capacity: >-
            THE WITNESS COULD HAVE FAILED AND DID NOT. distinct_Y is 2 -- 608 flag-true and
            2600 flag-false objects -- over 3177 distinct X-groups, all constant. This is the
            one genuinely load-bearing empirical witness in the graph and it reproduces P-A.
        no_object_in_the_declared_population_violates_a_claimed_derivation: >-
          MEASURED. 0 of 5832 objects of the declared population violate ANY CTL-WF check, so
          the population the witnesses were taken on and the "CTL-WF-accepted population" the
          derivations scope themselves to are the SAME SET here. I flag as a latent fragility
          rather than a defect that declared_population() applies no gate of its own: the two
          coincide by measurement, not by construction.
        contradictions_derivation_with_a_failing_witness: >-
          NONE. The module's own CONTRADICTION field is empty on all 60 ordered pairs of both
          primitives and I confirmed that independently. No stopping rule fired.

      confirmation_or_challenge_of_every_empirical_only_label:
        count: 22 -- 14 on md5 and 8 on sha1.
        the_labels_are_correctly_applied: >-
          CONFIRMED. All 22 are EDGE verdicts with no derivation in DERIVATIONS, and all 22
          carry the label `empirical_only`.
        H_1_forbidden_words: >-
          CONFIRMED CLEAN. I scanned every empirical_only edge record for `theorem`,
          `provable`, `provably` and `impossible`. All 22 records contain those strings in
          EXACTLY ONE PLACE and it is a NEGATION -- the label_note that reads "The words
          theorem, provable, provably and impossible are NOT used for it anywhere in this
          batch". There is no affirmative use anywhere.
        no_partition_class_rests_on_an_empirical_only_edge: >-
          CONFIRMED BY ENUMERATION. I extracted every forcing edge every partition class
          cites and looked each one up in the graph. There are exactly four and all four are
          `derived_and_witnessed`: md5 (step_delta->length); sha1 (message_difference->length),
          (step_delta->length) and (message_difference->in_linearized_code). NOT ONE is
          empirical_only.
        the_challenge_i_do_make_to_the_labels: >-
          ALL 22 EMPIRICAL_ONLY EDGES ARE CONSTANT-COLUMN ARTIFACTS. I measured
          Y_CONSTANT_ON_POPULATION on every one: it is TRUE for 22 of 22, with ZERO
          exceptions. Every one of them has Y in {length, block_index, in_linearized_code},
          each of which takes a single value on its whole sub-population. NOT ONE of the 22 is
          a dependency. Nine md5 and six sha1 of them additionally carry LOW_DISTINCT_X.

      THE_QUESTION_THE_PLAN_PUTS_WITHOUT_A_PREFERRED_ANSWER_MY_ANSWER:
        the_two_degenerate_ways_measured: >-
          SINGLETON_GROUPS_ONLY is FALSE on every pair of both primitives, so the
          all-singletons degeneracy does not occur here at all. Y_CONSTANT_ON_POPULATION is
          the one that bites, and it bites hard: it is TRUE on 22 of 22 empirical_only edges
          AND on THREE OF THE FOUR derived_and_witnessed edges.
        A_THIRD_LABEL_IS_OWED_AND_I_NAME_IT: >-
          I CONCLUDE TWO LABELS PLUS DIAGNOSTICS DO NOT SUFFICE, AND I NAME THE LABEL:
          `edge_on_a_constant_column`, applied whenever distinct_Y == 1 on the declared
          population, ranked BELOW `empirical_only` rather than beside it. The plan is right
          that an edge reported on a constant column is a true statement of the constancy rule
          and is not a dependency, and that a reader who counts edges will count it. The
          arithmetic makes the case: the graph reports 20 EDGE verdicts on md5 and 16 on sha1;
          of those 36, exactly ONE is an edge whose witness had the capacity to fail. A
          summary sentence of the form "the graph contains N edges" is off by a factor of
          more than thirty in what it suggests. The diagnostics do NOT carry that weight,
          because they are per-record booleans while the LABEL is what every aggregate list in
          the artifact is keyed on -- `edges_labelled_empirical_only` groups all 22 without
          separating them.
        WHY_THE_SAME_FINDING_DOES_NOT_DAMAGE_THE_FOUR_DERIVED_EDGES: >-
          BECAUSE H-1 REQUIRES A DERIVATION *AND* A WITNESS, AND FOR THE THREE VACUOUS ONES
          THE DERIVATION IS DOING ALL THE WORK AND IS SOUND. `length = len(step_delta)` is a
          definitional identity of the committed PathObject and does not need a witness to be
          true. The honest statement is that H-1's conjunction is satisfied in NAME for three
          of the four derived edges -- the witness cannot fail, so it is not evidence -- and
          in SUBSTANCE for one, sha1 (message_difference -> in_linearized_code). THAT
          DISTINCTION SHOULD APPEAR BESIDE THE EDGES AND CURRENTLY DOES NOT. Recorded as D-4.
          It does not change any edge verdict and it does not change any partition class.

      the_null_object_control_for_the_detector:
        i_exercised_it_myself: >-
          YES. The cold re-run rebuilt the synthetic independent-coordinate population from
          the declared seed and ran the identical edge detector over it, and I then analysed
          the result pair by pair rather than reading the summary.
        does_the_detector_return_NO_EDGE_where_the_dependency_is_absent: >-
          YES, AND NOT FOR A REASON THAT WOULD HOLD WHATEVER THE DETECTOR DID. On null
          population B the detector returns NO EDGE on 19 of 30 md5 pairs and 22 of 30 sha1
          pairs -- 41 of 60 -- while on the declared population it returns NO EDGE on only 10
          of 30 and 14 of 30. The detector discriminates between the two populations, which is
          exactly what the control has to demonstrate.
        null_population_A_reported_separately_and_correctly: >-
          The md5 sub-population for (message_difference, in_linearized_code) returns EDGE,
          not NO EDGE. The contract ANTICIPATED that and required the reason be named; the
          module names a TRUER reason than the contract's own -- the contract says "8 entries,
          one constant flag value", and the module says the flag is None on every md5 object
          because pathobj.plant_from_pair never sets it and the committed serialiser never
          reads it on md5, so it is one constant value on all 2624 md5 objects. Population A
          therefore does not demonstrate a capacity to return NO EDGE and is not relied on
          for it; population B does.

      RULING_ON_DEV_1:
        classification_i_rule: >-
          DEV-1 IS CORRECTLY CLASSIFIED AS A specification_error. IT IS NOT AN IR-6 IN-RUN
          REPAIR AND IT IS ALSO A GENUINE DEFECT IN THE CONTRACT, so the two are not
          alternatives here -- the specification error IS the contract defect.
        why_it_is_not_IR_6: >-
          IR-6 forbids changing a criterion AFTER OBSERVING AN OUTCOME. The forced set lives
          in the module as the constant NULL_FORCED_PAIRS with its declaration text, the
          module's sha256 is pinned identically in ALL FIVE run manifests, and run 1 -- the
          run that produced the null data in the first place -- already pinned the final
          module. So the exemption demonstrably predates the datum it applies to, within the
          charged run set.
        why_the_contract_is_defective: >-
          THE CONTRACT'S LITERAL KNOWN ANSWER IS SELF-CONTRADICTORY AND NO IMPLEMENTATION
          COULD REACH IT. CTL-GRAPH-NULL demands NO EDGE for EVERY pair on a population drawn
          with independent coordinates "subject to CTL-WF", while CTL-WF's own W2, W3 and W4
          FORCE three of those pairs. I verified each forcing from the gate's source. A
          population satisfying the gate cannot have those coordinates independent. There is
          a SECOND unreachability the producer does not name and I do: the contract also
          mandates per-primitive analysis at H-4, which makes `primitive` a constant column on
          every sub-population by construction, and in_linearized_code is not an md5 key
          component at all. Those account for the rest.
        was_the_forced_set_enumerated_before_the_run_ruled_explicitly: >-
          F2 WAS ENUMERATED; F1 IS A PREDICATE, NOT AN ENUMERATION, AND IT WAS DECLARED
          BEFORE THE RUN BUT NOT QUANTIFIED. NOTHING WAS WIDENED AFTER THE DATA WAS SEEN so
          far as any artifact can show. F2 is four literal pairs in module source -- md5
          (step_delta,length) and sha1 (step_delta,length), (message_difference,length),
          (message_difference,in_linearized_code) -- and each is exactly the pair one named
          CTL-WF check forces, with no slack. F1 is the rule "any ordered pair whose Y takes
          ONE distinct value on the null population", stated in the same declaration text and
          in the execution report's DEV-1 as one of "two families".
        THE_MATERIAL_FACT_I_MEASURED_THAT_THE_PACKAGE_DOES_NOT_REPORT: >-
          F1 DOES 15 OF THE 19 EXCUSALS AND F2 DOES 4, AND IF F1 WERE REMOVED THE STOP WOULD
          FIRE. Exactly: on md5, 11 edges are returned, 1 excused by F2 and 10 by F1; on
          sha1, 8 edges, 3 by F2 and 5 by F1. The producer's DEV-1 reports the literal
          quantity (md5 11, sha1 8) and the STOP quantity (0, 0) and describes both families,
          but never states which family carries the weight. THE DISCLOSURE IS COMPLETE IN KIND
          AND INCOMPLETE IN WEIGHT. Recorded as D-5.
        why_that_does_not_make_the_control_a_sham_and_i_checked: >-
          I ENUMERATED THE 15 F1 EXCUSALS INDIVIDUALLY. On md5 they are the five (X ->
          primitive) pairs and the five (X -> in_linearized_code) pairs; on sha1 they are the
          five (X -> primitive) pairs. Every one is a column that is constant BY THE ANALYSIS'S
          OWN SCOPING -- `primitive` because the graph is computed per primitive, and the md5
          flag because the committed serialiser never emits it on md5. NOT ONE F1 excusal
          conceals a pair that could have been a real dependency, and the STOP quantity is 0
          on both primitives with 41 of 60 pairs returning NO EDGE. The control fires.
        the_amendment_obligation_i_name_without_minting_an_identifier: >-
          DEV-1 warrants a versioned protocol_amendment restating CTL-GRAPH-NULL's known
          answer as "NO EDGE on every pair outside a pre-declared forced set, with the forced
          set's composition and its per-family excusal counts reported". It is the close's to
          file under an identifier I do not hold.

      the_well_formedness_gate_both_sides_confirmed_independently: >-
        BOTH SIDES FIRE. ACCEPT: all 16 census entries and all 80 strict orbit images
        accepted, 0 failures, which I recomputed. REJECT: 8 of 8 deliberately malformed
        objects rejected -- a SHA-1 entry with the flag flipped and the dv held fixed, which
        is null family (e) as DEC-20260824-af6d5c P-4 specified it -- with the violated check
        named (W3). A gate that accepted everything would not be a gate and this one does not.
      a_family_the_gate_rejects_on_every_draw_is_reported_as_NOT_CONSTRUCTIBLE_and_never_as_zero: >-
        CONFIRMED, AND THIS IS THE DISTINCTION THE PLAN SAYS THIS GOAL HAS ALREADY BEEN
        BURNED BY. Three families are rejected on every draw of both primitives --
        d_length (40 constructed / 40 rejected per primitive, on W4 and W2), d_primitive
        (40/40, on W2 and W3) and d_in_linearized_code (40/40, on W3). Their 18 matrix cells
        carry exclusion `not_constructible` with `value: null`, never integer 0, in the JSON
        itself, so a machine consumer reading the JSON alone cannot misread a coverage gap as
        a measured negative (H-8). The family declarations say in terms that they are
        "EXPECTED TO BE REJECTED ... RATHER THAN ASSERTED TO BE IMPOSSIBLE" and are
        constructed and gated so the outcome is MEASURED, which is the right discipline.

      defects_found_under_this_joint: [D-4, D-5]
      batch_halting: false
      what_i_could_not_determine_under_this_joint: >-
        (a) I DID NOT CONSTRUCT AN OBJECT OUTSIDE THE DECLARED POPULATION to attack the
        derivations -- a well-formed SHA-1 object at a step range other than the full one, or
        one outside the linearized code. That is R3-J5's work and it is the Red Team's, and I
        did not trespass on it. My rulings are therefore scoped to THE DECLARED POPULATION
        AND THIS CENSUS and license nothing about SHA-1 or MD5.
        (b) I could not determine whether an earlier, narrower NULL_FORCED_PAIRS was ever run
        and widened, because an uncharged predecessor leaves no artifact. What I CAN say is
        that the F2 set has no slack in it -- it is exactly the gate's own forcings and not
        one pair more -- which is weak but real evidence against a widening.

    # ---------------------------------------------------------------
    - joint: R3-J3
      alias: V-c
      verdict: breaks
      verdict_scope_stated_immediately_so_it_is_not_over_read: >-
        IT BREAKS ON THE FIRST CONJUNCT AND ON THE PER-PRIMITIVE EVIDENCE CHECK, AND IT HOLDS
        ON THE OTHER TWO. THE NARROWEST VALID CONCLUSION, WHICH I STATE BEFORE THE DETAIL SO
        NO READER TAKES MORE FROM THIS THAN IT EARNS: THE SIX ROW CLASSES, THE CLASS COUNTS
        2/2/0/1/1, THE AGREEMENT OF 5 OF 6 ROWS AND THE IDENTITY OF THE DISAGREEING ROW ARE
        UNCHANGED BY EVERY DEFECT I FOUND. I derived all of them independently by hand before
        reading the producer's file and got the same answers. What breaks is the
        correspondence between the rule AS WRITTEN and the rule AS IMPLEMENTED, and the
        per-primitive scope H-4 requires every class to carry. THIS IS NOT A STOP, and it is
        not evidence about MD5, SHA-1, or any difference space in either direction.

      D_1_the_per_primitive_evidence_check_which_the_plan_named_so_it_would_not_be_SKIPPED_FOR_COST:
        reported_either_way_as_required: >-
          REPORTED, AND IT DOES NOT PASS. The plan asked me to run it whether it passes or
          fails; it fails, and here is the measurement.
        the_finding: >-
          THE sha1 BRANCH OF THE `step_delta` ROW IS ASSIGNED CONTINGENT_ON_THE_INSTRUMENT BY
          THE ISOLATION TEST, AND EVERY ONE OF THE FIVE EXAMPLES IT CARRIES IS AN MD5 DRAW
          MATCHED AGAINST AN MD5 CENSUS ENTRY. The five are NULL-MD5-9983c910 against
          PLANT-MD5-05, NULL-MD5-1dc9644d against PLANT-MD5-06, NULL-MD5-8ee15c5c against
          PLANT-MD5-05, NULL-MD5-12dbedf2 against PLANT-MD5-06 and NULL-MD5-12c43f2e against
          PLANT-MD5-02. There is not one SHA-1 object in the SHA-1 branch's evidence, and the
          two branches' example lists are BYTE-IDENTICAL to each other.
        the_mechanism_read_off_the_source: >-
          probing_profile() is computed ONCE over the draws of BOTH primitives against the
          entries of BOTH primitives, and derive_partition() then indexes it as
          probing[comp] INSIDE the per-primitive loop, so both branches receive the identical
          primitive-blind profile. It is a structural defect, not a data accident.
        my_own_recomputation_which_settles_what_the_honest_answer_would_be: >-
          I RE-COMPUTED THE PROFILE RESTRICTED TO EACH PRIMITIVE'S OWN DRAWS AGAINST ITS OWN
          ENTRIES, using the same committed CP.attribution. RESULT: restricted to sha1,
          `step_delta` has isolating_draw_count 0 AND own_source_differing_count 0.
          Restricted to md5, it has isolating 6 and own_source 32. SO THE HONEST sha1 BRANCH
          FIRES R5 NOT_PROBED_BY_A_DECLARED_FAMILY, NOT R3 CONTINGENT_ON_THE_INSTRUMENT.
        what_it_changes_and_what_it_does_not: >-
          IT CHANGES THE `primitive_scope` FIELD AND NOTHING ELSE. partition-derived.json and
          partition-compared.json both emit primitive_scope {md5: CONTINGENT, sha1:
          CONTINGENT} for the step_delta row; the correct emission is {md5: CONTINGENT, sha1:
          NOT_PROBED}. The ROW class is unchanged because the combination rule takes the
          strongest per-primitive class and md5's R3 is the strongest either way. This is
          therefore an H-4 violation -- a class stated with a primitive scope it does not have
          -- and an H-7 violation -- an emitted string quantifying over more than the function
          computes -- and it is the precise shape of defect CORR-20260824-c1c8b1 already
          recorded once against this goal.
        i_also_checked_the_rows_where_it_could_have_mattered_more_and_it_does_not: >-
          For `message_difference` the restricted profile is isolating 2568 on md5 and 520 on
          sha1, both nonzero, so R2 would fire on both anyway. For `primitive`, `length`,
          `block_index` and `in_linearized_code` the restricted isolating counts are 0 on both
          primitives, matching the unrestricted profile. THE DEFECT BITES ON EXACTLY ONE
          BRANCH OF ONE ROW.

      D_3_the_example_list_against_its_own_count:
        the_finding: >-
          THE step_delta ROW PRINTS isolating_draw_count 6 BESIDE AN isolating_examples LIST
          OF 5, ON BOTH PRIMITIVE BRANCHES, AND NOTHING IN partition-derived.json DECLARES
          THE TRUNCATION. I grepped the file for `truncat`, `first 5`, `at most 5` and
          `capped`: zero occurrences of any of them. The cap is real -- it is
          `if len(...) < 5` in probing_profile -- but it exists only in source, not in the
          artifact a reader reads.
        severity_and_why_i_report_it_anyway: >-
          MINOR AND MECHANICAL, AND THE JOINT NAMES IT AS A BREAKING ARTIFACT LITERALLY ("an
          example list inconsistent with its own count"), so I do not round it away. One
          declared field -- `isolating_examples_truncated_at: 5` -- closes it.

      D_2_the_assigning_rule_as_written_against_the_assigning_rule_as_implemented:
        the_finding: >-
          R2 AS THE MODULE'S OWN ASSIGNING_RULE STRING STATES IT READS: "a declared family's
          own declaration names the deleted component as EXACTLY what it moves while holding
          the rest fixed". THE IMPLEMENTATION ADDS AN UNDECLARED CLAUSE: the candidate list is
          filtered by `and n == "d_message_difference"`, so R2 can fire for one component and
          one only, by name.
        i_measured_the_counterfactual_rather_than_asserting_it_mattered: >-
          UNDER THE RULE AS WRITTEN, TWO MORE ROWS WOULD BE ENTAILED. d_step_delta declares it
          moves EXACTLY step_delta and holds every other key component fixed, and it is
          CONSTRUCTIBLE -- 368 draws constructed and 368 accepted by the gate on each
          primitive. d_block_index declares the same for block_index and is likewise 368/368
          accepted. So the literal text gives step_delta and block_index the class
          ENTAILED_BY_THE_PERTURBING_FAMILYS_OWN_DECLARATION.
        THE_CONSEQUENCE_AND_ITS_DIRECTION_WHICH_IS_WHY_THIS_IS_A_MAJOR_FINDING: >-
          THE UNDECLARED CLAUSE IS LOAD-BEARING AND IT MOVES THE RESULT TOWARD THE
          PRE-REGISTERED TARGET. With it, the class counts are 2/2/0/1/1 and 5 of 6 rows agree
          with the contract's 1/3/0/1/1. Without it -- applying the rule exactly as the
          artifact states it -- the counts become provably 2 / not_probed 1 / probed 0 /
          entailed 3 / contingent 0, and the agreement falls from 5 OF 6 TO 3 OF 6, with
          step_delta and block_index joining `length` as disagreements.
        THE_STRONGEST_DEFENCE_OF_THE_CODE_AND_I_THINK_IT_IS_CORRECT: >-
          I STATE IT AS FORCEFULLY AS I CAN BECAUSE I BELIEVE THE CODE'S BEHAVIOUR IS THE
          SUBSTANTIVELY RIGHT ONE. CTL-PART scopes the partition to "the DECLARED PERTURBATION
          of each declared null family, read from the committed contract EXP-DIFFP-4b165f and
          the committed module". d_step_delta and d_block_index are NEW families of THIS
          contract, built for stage 3, which did not exist when BATCH-efcae7 produced the
          verdicts being re-partitioned. Classifying step_delta as ENTAILED by a family
          invented in the very contract that is re-reading the earlier verdicts would be
          anachronistic and would make the partition partly self-fulfilling. So I do NOT find
          that the row classes are wrong.
        WHAT_THEN_IS_THE_BREAK_STATED_EXACTLY: >-
          THE ROW CLASSES ARE DEFENSIBLE AND THE RULE TEXT IS FALSE OF THE FUNCTION THAT EMITS
          IT. A reader given only partition-derived.json's `assigning_rule` -- which is the
          artifact's own account of how each row was assigned, carried on every row -- cannot
          reproduce two of the six rows. The joint's first conjunct is that each row's class
          FOLLOWS FROM THE STATED RULE; for step_delta and block_index it does not follow from
          the stated rule, it follows from an unstated one. That is a break, it is an H-7
          violation, and the fix is one clause of text: R2 must say "a family DECLARED BY
          EXP-DIFFP-4b165f", not "a declared family".

      is_partition_derived_json_free_of_the_compared_verdict_column_EXPLICIT_RULING:
        ruling: >-
          YES. I FIND NO CONTAMINATION AND THE STOP DOES NOT FIRE.
        static_evidence: >-
          derive_partition() takes (components, edges_by_prim, families, probing,
          key_components_by_prim) and references neither PRE_REGISTERED_PARTITION nor
          read_batch_efcae7_column(); probing_profile() likewise. In run_partition() the
          write `p_derived = _write_json("partition-derived.json", ...)` textually and
          causally precedes `column = read_batch_efcae7_column()`. There is no path by which
          the compared column can reach the derived file.
        artifact_evidence: >-
          I scanned partition-derived.json for the compared column's fingerprints. It contains
          NO occurrence of `c5bb72`, NO occurrence of `b16b01`, NO occurrence of the target
          string `1 / 3 / 0 / 1 / 1`, and NO pre-registered class value. The 15 occurrences of
          `efcae7` and 11 of `DETECTED` are all accounted for: the latter are the class name
          PROBED_AND_GENUINELY_NOT_DETECTED and the former are prose in the order declaration
          and the interpretation limit naming which column was NOT opened.
        one_binding_i_verified_rather_than_took_on_trust: >-
          partition-compared.json records partition_derived_sha256_at_comparison_time and I
          recomputed it: it equals the sha256 of the derived file as archived. That binds the
          comparison to exactly the derived content and rules out a derived file rewritten
          after the comparison. It is NOT proof of read order and I do not present it as such.

      is_the_order_claim_stated_with_its_own_epistemic_limit_EXPLICIT_RULING:
        ruling: >-
          YES, IN THE REQUIRED WORDS AND WITH A DISCLOSURE THAT WEAKENS IT. ORDER_DECLARATION
          states "NO TOOL HERE CAN CHECK READ ORDER, SO THIS IS CORROBORATION AND NOT PROOF",
          which is H-2's required form verbatim, and then volunteers that the FROZEN CONTRACT
          ITSELF prints the pre-registered target with its per-row assignment, so the producer
          could not have been blind to the TARGET, only to the VERDICT COLUMN.
        IS_THAT_DISTINCTION_REAL_OR_COSMETIC_MY_ANSWER: >-
          IT IS REAL BUT IT IS THINNER THAN IT SOUNDS, AND ON THIS RECORD THE THIN VERSION IS
          STILL ENOUGH. It is thin because the module hard-codes PRE_REGISTERED_PARTITION as a
          literal dict of the six target classes, so the producer had the ANSWER KEY in its
          own source; blindness to the verdict column buys only blindness to whatever
          BATCH-efcae7's raw DETECTED/NOT DETECTED entries would have added beyond the target,
          which for a partition comparison is close to nothing. It is real because the target
          is a CLASS ASSIGNMENT and not a derivation: knowing that `length` should come out
          NOT_PROBED tells you nothing about which edges the graph will contain.
        COULD_A_PRODUCER_KNOWING_THE_TARGET_HAVE_REVERSE_ENGINEERED_THIS_PARTITION: >-
          IT COULD HAVE ENGINEERED A BETTER ONE THAN THIS, AND THAT IS THE STRONGEST THING I
          CAN SAY FOR THE PRODUCER. A reverse-engineering producer aiming at 1/3/0/1/1 would
          have produced SIX agreements. This partition disagrees on `length` for a reason
          derivable from committed source, and I derived that same disagreement independently
          by hand before opening the file. Two further points cut the same way: the derived
          file emits its own class counts 2/2/0/1/1 without softening, and the disagreement is
          reported on both sides in full.
        THE_UNUSED_OBSERVATIONS_WHICH_ONE_DID_I_FIND_AND_I_QUOTE_THEM: >-
          THE FILE CARRIES A FIELD LITERALLY NAMED observations_not_used_by_the_assigning_rule
          WITH TWO ENTRIES, AND THEY POINT IN OPPOSITE DIRECTIONS.
        observation_1_verbatim: >-
          "THE COMMITTED SERIALISER APPENDS ('in_linearized_code', flag) IF AND ONLY IF
          obj.primitive == 'sha1', so on any key that RETAINS the flag component the primitive
          is recoverable from the key's COMPONENT-NAME SET alone. That argument would move the
          `primitive` row to PROVABLY_UNDETECTABLE, but it is a statement about the key's SHAPE
          and not an ordered-pair dependency between component VALUES, which is the only object
          CTL-DEP's formalism decides. IT IS RECORDED HERE AND DELIBERATELY NOT USED BY THE RULE."
        my_reading_of_observation_1: >-
          USING IT WOULD HAVE MOVED `primitive` AWAY FROM THE TARGET, which assigns it
          NOT_PROBED. So DECLINING it preserves an agreement. The ground given for declining is
          nevertheless principled and I judge it correct: R1 as written requires a component the
          row RETAINS to determine the deleted one BY AN EDGE, and "the key's component-name set
          reveals the primitive" is not an ordered-pair dependency between component values and
          is not expressible in CTL-DEP's formalism at all. WHAT MATTERS FOR GOOD FAITH IS THAT
          THE PRODUCER WROTE IT DOWN. It had no obligation to surface an argument that exposes
          a choice preserving its own agreement count, and it did.
        observation_2_verbatim: >-
          "`length` is determined by `step_delta` on BOTH primitives and additionally by
          `message_difference` on sha1. Both edges carry derivations from committed source. THE
          CONSEQUENCE FOR THE PARTITION IS WHATEVER IT IS AND IS NOT ADJUSTED TOWARDS THE
          PRE-REGISTERED TARGET."
        my_reading_of_observation_2: >-
          THIS ONE IS USED, IT IS THE SOLE CAUSE OF THE ONE DISAGREEMENT, AND IT CUTS AGAINST
          THE TARGET. That is the assignment's own test of good faith and this observation
          passes it squarely.
        MY_ANSWER_TO_THE_QUESTION_AS_PUT: >-
          I FIND ONE UNUSED OBSERVATION WHOSE USE WOULD HAVE CUT AGAINST THE TARGET, RECORDED
          AND DECLINED ON A STATED AND CORRECT GROUND, AND ONE USED OBSERVATION THAT CUTS
          AGAINST THE TARGET AND WAS TAKEN. I FIND NO OBSERVATION THAT WAS USED TO MOVE THE
          RESULT TOWARD THE TARGET. What I DO find moving the result toward the target is not
          an observation at all but the two UNDECLARED mechanisms at D-2 and D-8, and those are
          reported as such rather than as evidence of intent, which I do not assert and cannot
          measure.

      the_disagreeing_row_verified_on_both_primitives:
        row: length
        derived: PROVABLY_UNDETECTABLE_BY_ANY_FAMILY, rule R1 on BOTH primitives.
        pre_registered: NOT_PROBED_BY_A_DECLARED_FAMILY.
        derivation_on_md5: >-
          SOUND. The forcing edge is (step_delta -> length), derived_and_witnessed. Deleting
          `length` from the key leaves `step_delta`, whose serialised tuple has length equal to
          `length` by the PathObject property. The ablated key separates exactly what the
          unablated key separates, so no family can detect the deletion.
        derivation_on_sha1: >-
          SOUND, AND OVERDETERMINED. Two forcing edges, (message_difference -> length) and
          (step_delta -> length), both derived_and_witnessed. Either alone suffices.
        both_sides_reported: >-
          YES, IN FULL. partition-compared.json carries the row's disagreement with this
          contract's class, the rule fired per primitive, the `because` text per primitive and
          the forcing edges per primitive on one side, and the pre-registered class with its
          provenance on the other, plus an explicit statement that the producer does not decide
          which side is wrong. That is IR-8 and H-11 honoured.
        ARE_THE_TWO_CLASSES_EVEN_THE_SAME_KIND_OF_STATEMENT_MY_RULING: >-
          NO, AND THE CONSEQUENCE MATTERS FOR HOW THE CLOSE MAY READ THE WORD "DISAGREEMENT".
          NOT_PROBED_BY_A_DECLARED_FAMILY is a COVERAGE statement about a finite declared
          family set. PROVABLY_UNDETECTABLE_BY_ANY_FAMILY quantifies over EVERY POSSIBLE
          FAMILY and is strictly stronger. THEY ARE NOT CONTRADICTORY: if `length` is
          undetectable by any family then a fortiori no declared family detected it, so the
          derived class ENTAILS the observed behaviour that produced the weaker one. THE
          DERIVED CLASS REFINES THE PRE-REGISTERED CLASS ON THIS ROW; it does not contradict
          it. A close that reads "1 of 6 rows disagree" as "either the graph or BATCH-efcae7's
          reading is wrong" would be over-reading its own artifact, and I say so here precisely
          because the contract's `both_outcomes_are_results` invites exactly that framing. I do
          NOT decide which side is wrong and I am not asked to; I decide that on this row the
          question does not arise.
        the_scope_the_word_PROVABLY_actually_carries_here_which_is_not_mine_to_settle: >-
          The class name quantifies over every possible family while its warrant is an edge
          measured and derived on THIS DECLARED POPULATION AT THIS CENSUS, at one step range,
          under one gate. Whether that gap is fatal to the word is R3-J5's and it is the Red
          Team's; I flag only that I verified the derivation and NOT the quantifier's reach.

      defects_found_under_this_joint: [D-1, D-2, D-3]
      batch_halting: false
      what_i_could_not_determine_under_this_joint: >-
        (a) READ ORDER. No tool here can check it and I did not invent one. My finding rests on
        static code order, the sha256 binding of the derived file at comparison time, and my own
        independent re-derivation agreeing -- which is corroboration and not proof, in those words.
        (b) Whether the R2 restriction was written before or after the target was considered. It
        is in the module at run 1's pinned digest, which puts it before any charged run; it does
        not put it before the contract, which prints the target, was read first by necessity.

    # ---------------------------------------------------------------
    - joint: R3-J4
      alias: V-d
      verdict: holds
      verdict_note: >-
        HOLDS ON ALL FIVE CONJUNCTS. Two limits of the demonstrated capacity are recorded below
        as findings rather than as breaks, because the joint asks whether the controls CAN FAIL
        and one of them demonstrably can while the other demonstrably cannot -- and the producer
        says so itself, in terms, before I did.

      the_denominator_first_as_instructed:
        the_full_matrix: 6 families by 6 rows = 36 cells. 9 adjudicated + 27 excluded = 36. Reconciled.
        exclusions_by_reason: diagonal 3, forced_by_the_graph 6, not_constructible 18.
        i_reconstructed_the_cell_selection_independently: >-
          I RAN select_cells MYSELF from my own edge records and my own forced_rows and got
          adjudicated 9, excluded 27, with the identical per-reason split. The 9 adjudicated
          cells are the three constructible families d_message_difference, d_step_delta and
          d_block_index crossed with the three rows each that are neither its own diagonal nor
          graph-forced.

      each_exclusions_reason_checked_for_truth_and_for_being_the_right_KIND_of_reason:
        not_constructible_18_cells_the_largest_class_and_the_one_carrying_the_most_weight:
          verified_true: >-
            YES, ON EVERY DRAW OF EVERY PRIMITIVE. d_length: 40 constructed, 40 rejected, 0
            accepted, on md5 and on sha1. d_primitive: 40/40/0 on both. d_in_linearized_code:
            40/40/0 on both. I recomputed all of these from the committed gate.
          is_any_of_them_in_fact_constructible_which_is_the_breaking_artifact: >-
            NO, AND THE REASON IS A THEOREM AND NOT A SAMPLING ACCIDENT, WHICH IS WHY I CHECKED
            IT RATHER THAN COUNTING REJECTIONS. d_length shortens step_range to (a, b-1) while
            holding step_delta and the message difference fixed, so len(step_delta) != length
            and W4 must fail, and on sha1 len(dv) != length so W2 must fail too -- and those are
            precisely the two derived edges (step_delta -> length) and (message_difference ->
            length). d_primitive relabels md5 as sha1 and back, so the object has delta_m where
            dv is required, failing W2, and a flag inconsistent with a dv, failing W3.
            d_in_linearized_code flips the flag with the dv held fixed, which is W3's negation
            by construction. THE FAMILIES ARE NOT UNLUCKY; THEIR DECLARATIONS ARE UNSATISFIABLE
            GIVEN THE GRAPH. No cell returns to the adjudicated set and the denominator does not
            move.
          the_gap_i_do_record: >-
            THE EXCLUDED CELL CARRIES THE MEASURED GATE COUNTS AND A GENERIC REASON STRING BUT
            NOT THE PER-FAMILY DERIVATION. CTL-OFFDIAG asks for NOT CONSTRUCTIBLE to be reported
            "with the derivation that makes it so"; the derivation exists in the package -- in
            the family's declaration_text and in wellformedness-gate-result.json's per-check
            rejection counts -- but not ON THE CELL. A reader of offdiagonal-matrix-result.json
            alone gets 40/40 and a generic sentence. Recorded as part of D-9.
        forced_by_the_graph_6_cells:
          verified_true: >-
            YES. The forced rows are exactly `length` and `in_linearized_code`, crossed with the
            three constructible families, and none of those six is a diagonal. Each cell carries
            its forcing edges PER PRIMITIVE with the derivation text attached, and I checked each
            against the graph: md5 length is forced by (step_delta -> length); sha1 length by
            (message_difference -> length) and (step_delta -> length); sha1 in_linearized_code by
            (message_difference -> in_linearized_code). ALL FOUR ARE derived_and_witnessed. No
            forced cell rests on an empirical_only edge.
          the_one_entry_a_reader_could_miscount_and_it_is_correct_on_the_merits: >-
            The md5 half of every (family, in_linearized_code) forced cell carries a forcing
            "edge" with X null: [{"X": null, "Y": "in_linearized_code", ...}]. IT IS NOT AN EDGE.
            It is the separate ground that in_linearized_code IS NOT A COMPONENT OF THE md5 KEY
            AT ALL, so deleting it is the identity on every md5 key -- which I verified against
            the committed serialiser, whose flag clause is gated on obj.primitive == "sha1". The
            exclusion is therefore correct on BOTH primitives. But a reader tallying "forcing
            edges" from the JSON will count a null-X entry among them. Recorded as part of D-9.
        diagonal_3_cells:
          verified_true: >-
            YES, AND THE RULE IS THE ONE THE CONTRACT DECLARES. Cell (d_X, row deleting X) is
            excluded on the general rule TASK-20260824-e9d21a extracted at J13, with the value
            stated as the theorem DETECTED. The three are (d_message_difference,
            message_difference), (d_step_delta, step_delta) and (d_block_index, block_index) --
            exactly the diagonals of the three constructible families and no others.
          the_boundary_i_respect: >-
            WHETHER EXCLUDING THE DIAGONAL ANSWERS OR RELOCATES THE ROUND-2 RESTATEMENT QUESTION
            IS R3-J6's AND IS THE RED TEAM'S. I check only that the rule applied is the declared
            one, and it is.
        H_3_compliance: >-
          EVERY EXCLUDED CELL CARRIES ITS REASON AND `value: null`, NEVER INTEGER 0, AND NO
          EXCLUDED CELL ENTERS THE COUNT'S DENOMINATOR. I checked all 27.

      the_capacity_to_fail_H_6:
        i_exercised_both_degenerate_instruments_myself_not_through_the_producers_driver: >-
          YES, AND THIS IS THE DELIVERABLE, SO I NAME THE MECHANISM. Beyond the cold re-run of
          run_null_object, I wrote my own loop that builds the cell selection from my own edge
          records, then calls depgraph.cell_verdict DIRECTLY with three membership functions --
          the honest index lookup, `lambda k,p: True` and `lambda k,p: False` -- bypassing
          run_null_object entirely. MY INDEPENDENT RESULT: honest NOT DETECTED on 9 of 9;
          always_member differs on 9; always_non_member differs on 0. Identical to the package.
        is_the_code_path_identical_confirmed_FROM_THE_CODE_and_not_from_the_report: >-
          YES, AND THE STRUCTURAL PROOF IS BETTER THAN AN INSPECTION. cell_verdict's full
          argument list is (draw_keys, idx, prim_filter). IT TAKES NO INSTRUMENT ARGUMENT AT
          ALL, so it is not merely that it does not special-case a degenerate instrument -- it
          CANNOT, because it cannot tell which instrument it is serving. run_offdiagonal and
          run_null_object both call this one function with the same keys_cache and vary only
          the membership callable. There is no branch anywhere on instrument identity.
        the_measured_extremes:
          honest_versus_honest: 0 differing cells. Determinism at the declared seeds confirmed.
          always_member: >-
            9 differing cells, equal to the honest NOT DETECTED count of 9, which is the MAXIMUM
            over the adjudicated set. The predicted extreme is met and it is met non-trivially.
          always_non_member: >-
            0 differing cells, equal to the honest DETECTED count of 0. The predicted extreme is
            met arithmetically.
        RULING_ON_THE_ARM_THE_PRODUCER_ITSELF_CALLS_VACUOUS:
          my_ruling: >-
            REPORTING THAT ARM'S PREDICTED EXTREME AS MET IS HONEST BOOKKEEPING, NOT A KNOWN
            ANSWER SMUGGLED IN AS A CONTROL -- BUT ONLY BECAUSE THE VACUITY IS STATED BESIDE IT,
            AND IT IS. The producer's execution report carries a field named
            `the_always_non_member_arm_is_vacuous_here_and_that_is_said_plainly`, which states
            that its predicted extreme is zero ONLY because the honest instrument reports NOT
            DETECTED on all nine cells, that this is a property of the adjudicated cell set and
            not of the counting rule's capacity, that the capacity is demonstrated instead by
            always_member at 9 of 9, and that this arm's own degeneracy is shown by its
            CTL-PLANT of 0 hits in 96 attempts against the honest instrument's 96 of 96. I
            reached that reading independently and then found the producer had already written
            it. THAT IS THE DIFFERENCE BETWEEN HONEST BOOKKEEPING AND A CONTROL THAT CANNOT
            FAIL: the boolean alone would be the second; the boolean beside the disclosure and
            beside honest_cells_reporting_DETECTED_aggregate 0 is the first.
          what_that_arm_would_have_to_be_REPLACED_BY_TO_CARRY_WEIGHT: >-
            AN ADJUDICATED CELL SET CONTAINING AT LEAST ONE CELL THE HONEST INSTRUMENT REPORTS
            AS DETECTED. Until such a cell exists, no instrument can be shown to flip a verdict
            in the DETECTED-to-NOT-DETECTED direction and the arm is arithmetically pinned at 0.
            Concretely and budgetably: admit the three DIAGONAL cells, whose honest value is
            DETECTED by the very theorem used to exclude them, into a SEPARATE capacity-only arm
            -- not into the differing-cell count, which would corrupt the denominator -- and run
            always_non_member against them. It would cost three cells of compute and would turn
            a pinned 0 into a falsifiable 3.
          the_honest_statement_of_what_H_6_BOUGHT: >-
            H-6's TWO-SIDED CAPACITY IS DEMONSTRATED IN ONE DIRECTION ONLY. The counting rule is
            shown able to emit the maximum over the adjudicated set; it is NOT shown able to
            emit a difference in the other direction, because the adjudicated set offers it no
            opportunity. The run did not need to stop -- H-6's literal condition, that the two
            degenerate instruments produce their predicted extremes, is met -- but the close
            should carry the one-directional scope and not the phrase "capacity to be large".
            Recorded as D-10.

      the_reuse_IR_11:
        import_is_from_the_committed_file: >-
          CONFIRMED FROM SOURCE. load_reused_O_E() resolves
          coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py
          by importlib.util.spec_from_file_location and executes it, then O-E is obtained as
