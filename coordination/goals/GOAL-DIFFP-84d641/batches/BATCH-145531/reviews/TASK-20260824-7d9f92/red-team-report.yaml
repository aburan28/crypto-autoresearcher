      the_structural_claim:
        my_independent_determination: CONFIRMED IN ITS LONG FORM, REFUTED IN ITS SHORT FORM,
          AND NOT NEW IN EITHER
        confirmation_from_the_committed_source: >-
          primitives.sha1_in_linearized_code(words) returns sha1_expand(words[:16],
          len(words)) == list(words). So on an object whose flag is True AND whose flag was
          computed on the words it serialises, the whole message-difference value is the
          expansion of its own first sixteen words, and the message_difference component
          carries at most 512 bits. I CONFIRM THAT FROM THE COMMITTED SOURCE MYSELF. It is
          the statement that the SHA-1 message expansion is a GF(2)-linear code whose
          codewords are determined by their first sixteen words -- a textbook property of
          the expansion, restated about this key. IT IS NOT NEW AND CARRIES NO
          CRYPTANALYTIC CONTENT, AND I CLAIM NONE.
        the_refutation_of_the_short_form: >-
          THE SHORT FORM DROPS THE THREE WORDS THAT MAKE IT TRUE. The producer's O_RT2
          block says "carries at most 512 bits OF MESSAGE DIFFERENCE plus one flag bit
          rather than the 2560 bits its serialised width suggests" -- correct. The
          restatement in the same file's `what_is_NOT_concluded`, and the identical
          sentence in the FROZEN CONTRACT's `scale_relevance`, both read "a SHA-1 membership
          key's apparent 2560 bits are at most 512 plus one flag bit", WITHOUT "of message
          difference". 2560 IS THE WIDTH OF ONE COMPONENT, NOT OF THE KEY. The strict sha1
          key also carries step_delta -- a tuple of `length` 32-bit words, up to 2560 bits
          more, and NOT determined by dv[:16] because it depends on cv, m and mp -- plus
          primitive, length and block_index. THE SHORT SENTENCE ATTRIBUTES ONE COMPONENT'S
          WIDTH TO THE WHOLE KEY AND IS FALSE AS WRITTEN.
        does_it_carry_its_scope_everywhere_it_appears: >-
          NO. The CENSUS scope travels with both forms. The COMPONENT scope travels only
          with the long form, and the short form is the one that appears in the frozen
          contract and in the sentence explicitly addressed to GOAL-SHA1-001. THIS IS THE
          MOST CONSEQUENTIAL THING IN THE PACKAGE FOR A DOWNSTREAM CONSUMER, exactly as the
          plan predicted, and the defect is one dropped prepositional phrase.
        a_second_scope_the_package_does_not_state: >-
          The claim's antecedent is "an object whose flag is TRUE", but the flag is only a
          predicate of the SERIALISED message difference on objects where the two coincide.
          MEASURED COUNTEREXAMPLE, constructions/rt3_objects.py block O-P1: the committed
          plant_from_pair at step range (0,10) yields stored flag True with
          sha1_in_linearized_code(obj.dv) False. On that object the flag being true implies
          nothing at all about the dv. The claim is sound for gate-accepted objects at full
          step range and is false for objects the committed constructor produces at extent
          below 16.
        required_repair: >-
          Every appearance, including the frozen contract's `scale_relevance`, reads: "the
          MESSAGE-DIFFERENCE COMPONENT of a SHA-1 membership key carries at most 512 bits
          on objects that are in the linearized code AND whose flag is the predicate of the
          serialised difference; the rest of the key is unaffected". Offered to
          GOAL-SHA1-001 in that form or not at all.

