        INSTRUMENT THAT RETURNS NON-MEMBER FOR EVERY OBJECT -- both give 0 of 9 -- AND IT
        GIVES THE SAME 0 FOR O-E, SO IT IS A DIAGNOSTIC AND NEVER A DECISION VARIABLE.
      the_two_counts_side_by_side: >-
        From the producer's own null-object-control-result.json, over the same 9
        adjudicated cells: honest versus honest 0; honest versus O-E 0; honest versus
        always_non_member 0; honest versus always_member 9. From my own independent
        re-implementation over my 24 adjudicated per-primitive cells: 0, 0, 0 and 24. TWO
        IMPLEMENTATIONS, THE SAME ORDERING.
      objections:

        - id: RT-J8-1
          severity: major
          batch_halting: false
          title: >-
            THE EXCLUSION RULE IS COMPUTED UNDER THE HONEST INSTRUMENT AND APPLIED TO A
            KNOWN-FALSE ONE, AND IT REMOVES EXACTLY THE ONE CELL WHERE THE KNOWN-FALSE
            INSTRUMENT IS VISIBLE. THIS IS THIS ROUND'S O-P7.
          the_construction: >-
            constructions/rt3_rederive.py and constructions/rt3_objects.py. Run the
            contract's counting rule over the SIX cells currently excluded as
            forced_by_the_graph, with the forcing predicate evaluated PER INSTRUMENT.
            Mechanism: a run-time projection wrapper over the committed variant list; no
            committed file touched.
          the_measurement: >-
            Cell (d_message_difference, row deleting in_linearized_code, sha1): HONEST NOT
            DETECTED, O-E DETECTED. Every other forced cell agrees between the two
            instruments. Adding the six forced cells back moves my count from 0 of 24 to 1
            of 30 per-primitive cells. It is the ONLY differing cell anywhere in the
            72-cell per-primitive matrix, diagonal and forced and adjudicated together.
          why_the_forcing_fails_for_that_instrument: >-
            The producer's own exclusion reason reads "a component RETAINED by the row
            determines Y, so the row's projection is injective wherever the unablated key
            is". The retained determiner is message_difference and the determined component
            is the flag. O-E IS THE PROJECTION THAT DROPS message_difference ON SHA-1. Under
            O-E the row does not retain the determiner, the injectivity argument has no
            antecedent, and the cell is not forced. THE EXCLUSION IS A PROPERTY OF THE
            HONEST KEY AND IS APPLIED AS THOUGH IT WERE A PROPERTY OF THE CELL.
          what_this_does_and_does_not_mean: >-
            IT DOES NOT MEAN THE REPORTED 0 IS WRONG. Under the exclusion rule as declared,
            0 is the correct integer and I reproduce it independently. IT MEANS THE
            ADJUDICATED SET WAS CHOSEN BY A RULE THAT CANNOT SEE THE INSTRUMENT UNDER TEST,
            and that on this family set the rule happens to delete the single cell that
            would have separated them. Whether that is coincidence or structure is not
            something one measurement can decide, AND I DO NOT CLAIM IT IS DELIBERATE.
            THE STRUCTURAL POINT IS INDEPENDENT OF INTENT: an exclusion rule that is
            instrument-independent cannot be used to bound an instrument-dependent
            quantity.
          it_also_explains_the_round_2_break: >-
            The same fact explains why O-E survived the strengthened suite at all. Committed
            j8_results.json records O-E at d_sha1_k_ge_1_member 0, even though O-E is blind
            to the sha1 message difference -- because the family-(d) sha1 draw ALSO flips
            the recomputed flag, which the retained flag component then separates. The only
            deletion that exposes O-E is the pair {message_difference, in_linearized_code},
            which is the unique dependency-breaking depth-2 subset. THE INSTRUMENT'S
            BLIND SPOT AND THE GRAPH'S ONE INTERESTING EDGE ARE THE SAME OBJECT.

        - id: RT-J8-2
          severity: major
          batch_halting: false
          title: >-
            WHICH CAPACITY WAS DEMONSTRATED. THE COUNTING RULE's, NOT THE FAMILY SET's.
          the_measurement: >-
            Over the 9 adjudicated cells the honest instrument reports NOT DETECTED 9 of 9
            and DETECTED 0 of 9 (producer's null-object-control-result.json
            honest_cells_reporting_DETECTED_aggregate 0). Over my 24, 24 of 24 NOT
            DETECTED. THE ADJUDICATED SET IS A CONSTANT.
          the_objection: >-
            always_member attains 9 of 9 BY CONSTRUCTION: it returns MEMBER for every
            object, so it flips every NOT DETECTED cell whatever the families are. That
            demonstrates the counting CODE can emit a large number. It demonstrates nothing
            about whether any real instrument could be told apart by THESE cells built from
            THESE families. The batch opening's licence -- "so the count has a demonstrated
            capacity to be large" -- is true of the code and false of the experiment, and
            the difference is the whole of R3-J8.
          the_credit_that_belongs_beside_it: >-
            THE PRODUCER SAYS THIS ABOUT THE OTHER ARM ITSELF, UNPROMPTED, in
            `the_always_non_member_arm_is_vacuous_here_and_that_is_said_plainly`: its
            predicted extreme is zero only because the honest instrument reports NOT
            DETECTED on all nine cells, "that is a property of the adjudicated cell set,
            not a demonstration of the counting rule's capacity in that direction". THAT IS
            EXACTLY RIGHT AND IT IS VOLUNTEERED. My objection is that the SAME sentence is
            owed to the always_member arm in the other direction, and there it is not made:
            the arm's 9 of 9 is presented as the capacity demonstration.
          H_6_is_satisfied_and_i_do_not_dispute_it: >-
            The contract's predicted extremes are met as the contract states them, so H-6
            does not fire and the run correctly did not stop. THE CONTRACT'S PREDICTION FOR
            always_non_member IS "differs on every cell the honest instrument reports as
            DETECTED", which is zero cells, so THAT ARM'S KNOWN ANSWER CANNOT FAIL ON THIS
            CELL SET. A control that cannot fail is not a control. That is a defect in the
            contract's H-6, not in the producer's execution of it.

        - id: RT-J8-3
          severity: moderate
          batch_halting: false
          title: >-
            IS IT BEING USED AS A DECISION VARIABLE. NOT BY THE PRODUCER. THE RISK IS
            ENTIRELY AT THE CLOSE, AND THE OPENING ALREADY FRAMES IT AS A DISCRIMINATOR.
          evidence: >-
            The producer composes no verdict (H-11, IR-8) and writes
            `how_that_integer_must_be_read`: "Zero does not mean the instrument is good and
            nonzero would not mean it is bad". THAT IS CORRECT AND IS A CREDIT. But
            EXP-DIFFP-04082e `the_two_pre_distinguishable_outcomes` sets up two readings --
            "ZERO DIFFERING CELLS means the power profile over the adjudicated cells is a
            function of the families' construction and of the dependency graph and carries
            NO information about the instrument" -- and THAT is a decision the integer is
            not entitled to make.
          what_the_quantity_actually_is: >-
            IT IS AN INDICATOR, NOT A COUNT. On this cell set it takes the value 0 for
            every instrument that does not flip a cell to DETECTED, and the only way to
            flip one is to drop a component the row retains AND have the family move only
            that component -- which on this family set happens at exactly one cell, and
