          four with the exclusion of O-RT2 argued in the same sentence.

      J11:
        round_2_id: J11
        round_2_statement_as_i_read_it: >-
          The isolating sub-arm binds nothing the verdicts depend on.
        verdict: HOLDS -- ROUND 2's FINDING IS UNCHANGED BY THIS PACKAGE
        answer: >-
          NOTHING IN THIS PACKAGE CHANGES IT, AND THE NEW QUANTIFIER DISTINCTION DOES NOT
          MAKE IT WORSE EITHER, BECAUSE THE DISTINCTION IS DISCLOSED IN THE EMITTED STRING.
        the_measurement_it_rests_on: >-
          partition-derived.json `probing_profile_per_component` reports, per component,
          BOTH `isolating_draw_exists` -- there exists a draw D and there exists a census
          entry C, ANY entry, whose committed attribution against D is exactly [X] -- AND
          `own_source_differing`, the strictly different statement about D's OWN source
          entry, with a verbatim quantifier_note naming CORR-20260824-c1c8b1 and H-7. The
          step_delta row's CONTINGENT_ON_THE_INSTRUMENT class fires on the FIRST, at
          isolating_draw_count 6 on md5.
        the_determination: >-
          THE SUB-ARM BINDS A PARTITION CLASS AND STILL BINDS NO CELL VERDICT AND NO
          DIFFERING-CELL COUNT. Not one of the nine adjudicated cells, and not one of my
          twelve, turns on an isolation result: the cell rule is membership of a perturbed
          draw under a projection, and isolation never enters it. So the round-2 finding
          stands exactly as recorded. WHAT IS NEW AND IS A CREDIT: the class now rests on
          the weaker SOME-ENTRY quantifier and SAYS SO IN THE STRING THAT CARRIES IT, which
          is the H-7 repair CORR-20260824-c1c8b1 demanded.
        what_i_could_not_check_and_route_onward: >-
          Whether the new module's isolation computation is the committed
          controlpower.attribution applied over all entries, or a re-implementation, cannot
          be checked without reading harness/diffpath/depgraph.py, which is a blind_from
