  joints:

    - id: R3-J5
      alias: R-a
      verdict: breaks
      verdict_qualifier: >-
        BREAKS AS A NARROWING AND NOT AS AN INVALIDATION. Every integer in the package
        that I checked is right, the derivations exist and are readable, and the word
        `provably` is not used against an `empirical_only` edge. WHAT BREAKS IS WHAT THE
        WORD BUYS. THIS IS NOT AN IMPOSSIBILITY RESULT AND IT DOES NOT MAKE THE
        MEASUREMENTS WRONG.
      narrowest_valid_conclusion_that_survives: >-
        WHAT IS PROVED, AND IT IS WORTH HAVING: the committed strict serialisation under
        the verified generator set {E1, E3, E4, E5} EMITS COMPONENTS THAT ARE REDUNDANT
        GIVEN OTHER EMITTED COMPONENTS, so deleting them is the identity map on the key
        over the population this batch's own well-formedness gate admits. Specifically:
        `length` is len(step_delta) on both primitives; `in_linearized_code` is
        sha1_in_linearized_code(message_difference) on sha1 objects the gate admits; and
        on md5 `in_linearized_code` is not emitted at all. THAT IS A THEOREM ABOUT THE
        SERIALISATION FORMAT AND THIS BATCH'S GATE. IT IS NOT A THEOREM ABOUT MD5, ABOUT
        SHA-1, OR ABOUT THE INSTRUMENT'S DETECTION POWER AGAINST FAMILIES IN GENERAL, and
        the quantifier BY ANY FAMILY ranges only over families every draw of which passes
        CTL-WF -- a restriction that DID NOT EXIST when BATCH-efcae7 measured those rows.
      objections:

        - id: RT-J5-1
          severity: major
          batch_halting: false
          title: >-
            THE GATE THAT MAKES THE EDGE TRUE IS THE EDGE. CTL-WF W3 asserts the very
            predicate the PROVABLY_UNDETECTABLE class for in_linearized_code rests on, so
            the class quantifies over a population defined by its own conclusion.
          what_the_package_says: >-
            wellformedness-gate-result.json check W3, verbatim: "sha1:
            obj.in_linearized_code == primitives.sha1_in_linearized_code(list(obj.dv))".
            partition-derived.json gives the sha1 branch of the in_linearized_code row
            class PROVABLY_UNDETECTABLE_BY_ANY_FAMILY under rule R1 on the forcing edge
            message_difference -> in_linearized_code.
          the_objection: >-
            The edge says the flag is a function of the serialised message difference. W3
            says an object is admissible only if its flag equals that function of its
            serialised message difference. Those are the same sentence. Every family whose
            draws the gate admits therefore satisfies the edge BY ADMISSION, so
            "undetectable by any family" is "undetectable by any family whose draws
            already satisfy the edge". THE STEP AT WHICH THE ARGUMENT SURVIVES IS THE GATE,
            AND THE GATE IS A NEW ARTIFACT OF THIS BATCH.
          measurement: >-
            constructions/rt3_objects.py, block O-P1. The COMMITTED pathobj.plant_from_pair
            applied to the SAME seeded pair that produces census entry PLANT-SHA1-00, at
            step range (0, 10): stored in_linearized_code True, and
            primitives.sha1_in_linearized_code(list(obj.dv)) False, dv_words 11. W3
            REJECTS an object the committed constructor produced. At (0,79), (0,15), (8,40)
            and (16,79) the two agree.
          why_it_matters_rather_than_being_pedantry: >-
            BATCH-efcae7's depth-1 rows were measured WITHOUT this gate, over families that
            were never required to pass it. A class derived under the gate is being
            attached to a verdict measured without it. That is a population substitution
            and it must be stated in the class, not in a limitations block.
          required_repair: >-
            Every appearance of PROVABLY_UNDETECTABLE_BY_ANY_FAMILY for in_linearized_code
            reads "provably undetectable by any family EVERY DRAW OF WHICH PASSES CTL-WF,
            AT FULL STEP RANGE". Not in a caveat: in the class name's own sentence.

        - id: RT-J5-2
          severity: moderate
          batch_halting: false
          title: >-
            THE EMPIRICAL WITNESS FOR THE FLAG EDGE IS TAKEN WHERE Y IS CONSTANT, AND IT
            IS PROVABLY IMPOSSIBLE FOR IT TO BE OTHERWISE ON A PLANTED CENSUS.
          measurement: >-
            constructions/rt3_objects.py, block O-P3: the eight SHA-1 census entries take
            EXACTLY ONE distinct value of in_linearized_code, namely True; distinct flag
            values in census = 1.
          the_derivation_i_add: >-
            THIS IS NOT AN ACCIDENT OF THE SEEDS AND NO SEED CHOICE CAN FIX IT.
            primitives.sha1_expand is GF(2)-linear, and pathobj.plant_from_pair sets
            full_dv[i] = w[i] XOR wp[i] where w = sha1_expand(m) and wp = sha1_expand(mp).
            Therefore full_dv = sha1_expand(m XOR mp) is ALWAYS a codeword and the flag is
            ALWAYS True. NO PLANTED SHA-1 OBJECT CAN EVER HAVE FLAG FALSE.
          the_objection: >-
            A constancy detector that asks "is Y constant within every X-group" returns
            EDGE for EVERY X when Y is constant on the whole population. The witness column
            for this edge therefore carries zero bits. The contract anticipated this (H-1
            requires a derivation, and the tail check flags LOW_DISTINCT_X), and the
            derivation is what carries the class -- so this NARROWS rather than breaks. But
            no artifact may cite the witness as corroboration of the edge, and any reader
            who counts edges is counting a constant column.
          what_i_could_not_check: >-
            Whether the producer's own diagnostics flag this pair as constant-Y is R3-J2's
            and is the Validator's; I did not read the producer's module.

        - id: RT-J5-3
          severity: moderate
          batch_halting: false
          title: >-
            FIVE COMMITTED GENERATOR ACTIONS CARRY THE FLAG RATHER THAN RECOMPUTING IT, NOT
            TWO, AND act_E1_shift PRODUCES A FLAG-INCONSISTENT IMAGE OFF THIS CENSUS.
          measurement: >-
            constructions/rt3_objects.py, block O-P2. Source object: census entry
            PLANT-SHA1-00 with one bit of dv[40] flipped, flag honestly recomputed to
            False. Images: act_E1_shift(+1) carried flag False, recomputed from image dv
            True -- DISAGREE. align_E1(act_E1_shift(+1)) carried False, recomputed True --
            DISAGREE, AND THE IMAGE'S dv DIFFERS FROM THE SOURCE'S. act_E2_rotate(7),
            act_E3_negate and act_E6_reindex(3) agree. All five of
            equivalence.act_E1_shift, equivalence.align_E1, equivalence.act_E2_rotate,
            equivalence.act_E3_negate and equivalence.act_E6_reindex pass
            in_linearized_code through by assignment; none recomputes it.
          the_objection: >-
            The producer's `things_seen_and_deliberately_not_repaired` names TWO carriers,
            act_E1_shift and act_E2_rotate. I measure FIVE, and the two that can actually
            go wrong are act_E1_shift and align_E1 -- and align_E1 IS CALLED INSIDE THE
            COMMITTED adjudicator.canonical() and controlpower.variant_keys() for every
            sha1 object with step_start > 0. On a flag-false object canonicalisation
            REPLACES the dv with the expansion of the seed window, which is always a
            codeword, while carrying the false flag. The derivation's coverage of generator
            images is therefore true of THIS CENSUS -- where every dv is a codeword and the
            code is closed under all five actions -- and is not true of the class.
          what_survives: >-
            On this census the edge holds under every generator image and I measured it. The
            honest sentence is "verified on these objects", not "provably", for the
            generator-image part of the population.

        - id: RT-J5-4
          severity: major
          batch_halting: false
          title: >-
            ONE CLASS NAME, TWO DIFFERENT ARGUMENTS. The PROVABLY_UNDETECTABLE class fires
            on md5 with an EMPTY forcing-edge list, on the ground that the component is not
            in the md5 key at all.
          quoted_from_the_committed_artifact: >-
            partition-derived.json, row in_linearized_code, per_primitive.md5: "class":
            "PROVABLY_UNDETECTABLE_BY_ANY_FAMILY", "rule_fired": "R1", "because":
            "in_linearized_code IS NOT A COMPONENT OF THE md5 MEMBERSHIP KEY AT ALL: the
            committed serialiser never emits it on this primitive, so deleting it is the
            identity on every md5 key.", "forcing_edges": [].
          the_objection: >-
            Rule R1 as the producer declares it is "some component the row RETAINS
            determines the deleted one by an edge that carries a DERIVATION from committed
            source". On md5 there is no such component, no such edge, and the artifact says
            so by emitting forcing_edges: []. R1 fires with a null antecedent on a DIFFERENT
            argument: the ablation is the identity map because the field is absent. Both
            arguments do yield undetectability; THEY ARE NOT THE SAME CLAIM. "This component
            is recoverable from what the key retains" is a redundancy statement about the
            key. "This component was never in the key" is a statement that the row is empty.
            The combination rule then requires PROVABLY_UNDETECTABLE to hold ON EVERY
            PRIMITIVE, so the row's class is carried half by a vacuous branch.
            THIS IS PLAN CANDIDATE (v), AND IT IS CONFIRMED FROM THE PRODUCER'S OWN
            COMMITTED ARTIFACT RATHER THAN FROM A CONSTRUCTION OF MINE.
          required_repair: >-
            Either a sixth class name for the empty-deletion case, or the row's class
            reported per primitive with its two grounds named separately. A close that
            quotes "1 provably undetectable" without the split is quoting one number over
            two different theorems.

        - id: RT-J5-5
          severity: moderate
          batch_halting: false
          title: >-
            THE SECOND PROVABLY_UNDETECTABLE ROW IS A PROPERTY OF A PYTHON TUPLE.
          what_the_package_says: >-
            partition-derived.json, row `length`: PROVABLY_UNDETECTABLE_BY_ANY_FAMILY, rule
            R1, forcing edge step_delta -> length with the derivation "length IS NOT A
            STORED FIELD: pathobj.PathObject.length is the PROPERTY step_range[1] -
            step_range[0] + 1". I CONFIRM THE EDGE FROM THE COMMITTED SOURCE: the key's
            step_delta entry is a tuple of exactly `length` modular differences, so the
            projected key determines length.
          the_objection: >-
            THE EDGE IS SOUND AND THE ROW'S CLASS IS EARNED. What it proves is that the
            serialiser emits a field that is already implied by the arity of another field.
            THIS IS A BOOKKEEPING REDUNDANCY IN THE KEY FORMAT AND CARRIES NO STATEMENT
            ABOUT EITHER PRIMITIVE. Two of the six rows of this partition are now
            PROVABLY_UNDETECTABLE, and the grounds are: a tuple carries its own length; a
            field is absent on md5; and a redundant recomputed predicate is a function of
            its own argument. A close that reports "the graph proved two of six depth-1
            rows undetectable by any family" without those three grounds beside it is
            reporting a stronger sentence than the derivations support.
          it_also_refutes_a_pre_registration_and_that_is_a_result: >-
            The pre-registered target P-B is 1 / 3 / 0 / 1 / 1. The derived partition is
            2 / 2 / 0 / 1 / 1: `length` moved from NOT_PROBED_BY_A_DECLARED_FAMILY to
            PROVABLY_UNDETECTABLE_BY_ANY_FAMILY. THE PRODUCER REPORTS THE DISAGREEMENT
            RATHER THAN SOFTENING IT AND THAT IS A CREDIT. Whether the derivation is sound
            on both primitives is R3-J3's and is the Validator's; I confirm the md5 and
            sha1 edges from the committed source and record that I do.

        - id: RT-J5-6
          severity: minor
          batch_halting: false
          title: >-
            THE FLAG PREDICATE IS A CONSTANT FUNCTION AT SHORT STEP RANGES, SO THE EDGE IS
            NOT MERELY UNSCOPED BUT VACUOUS THERE.
          measurement: >-
            constructions/rt3_objects.py, block O-P1b, over 100 uniformly random word lists
            per length: sha1_in_linearized_code returns True 0 times of 100 at length 15,
            100 times of 100 at length 16, and 0 times of 100 at length 17. len < 16 returns
            False unconditionally; len == 16 returns True unconditionally.
          the_objection: >-
            On any step range of extent 16 the predicate is the constant True and carries
            zero bits about the message difference; on extent below 16 it is the constant
            False and CONTRADICTS the stored flag of any genuine in-code object, which is
            what O-P1 measures at (0,10). The "at full step range" scope limit the producer
            states is necessary but is not the whole limit: the interesting failure is at
            SHORT ranges, not merely at ranges other than full.

    - id: R3-J6
      alias: R-b
      verdict: breaks
      verdict_qualifier: >-
        The scalar is `breaks` because J13 breaks on a measured counterexample. J8 is
        NARROWED and J11 HOLDS. THE THREE ARE ANSWERED SEPARATELY BELOW UNDER THEIR
        ROUND-2 IDS, AS GOAL RESTRICTION (4) REQUIRES. NONE OF THE THREE IS SILENT AND
