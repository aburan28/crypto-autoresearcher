      J13:
        round_2_id: J13
        round_2_statement_as_i_read_it: >-
          Does a control that detects exactly the component it perturbs measure anything
          beyond its own construction?
        verdict: BREAKS -- THE EXCLUSION RELOCATES THE QUESTION, AND THE THEOREM IT
          RELOCATES ONTO IS FALSE ON SHA-1 FOR THE ONE FAMILY THE CONTRACT REUSES
        answer_part_1_relocation: >-
          EXCLUDING THE DIAGONAL DOES NOT ANSWER J13; IT MOVES IT INTO THE
          not_constructible COLUMN. Of the 36 family-by-row cells, 18 -- exactly half --
          are excluded because three of the six declared families cannot be honoured at all
          under CTL-WF (d_primitive, d_length, d_in_linearized_code), and a further 3 are
          excluded as diagonal and 6 as forced. NINE CELLS REMAIN. The off-diagonal
          remainder is therefore, in the plan's own words, measuring WHICH OFF-DIAGONAL
          FAMILIES COULD BE CONSTRUCTED AT ALL far more than it is measuring the
          instrument: the constructibility test decides half the matrix before any
          adjudication runs.
        answer_part_2_the_theorem_is_false_on_sha1: >-
          THE DIAGONAL CELL IS EXCLUDED WITH ITS VALUE STATED AS A THEOREM -- "a family
          perturbing exactly the set S while holding every other key component fixed makes
          the row deleting S DETECTED BY CONSTRUCTION". I MEASURED THAT CELL. For
          d_message_difference against the row deleting message_difference: on md5 DETECTED,
          on sha1 NOT DETECTED. constructions/rt3_objects.py, `counting_rule.diagonal_cells`.
        why_the_theorem_fails_there: >-
          ITS HYPOTHESIS IS FALSE FOR THE ONE FAMILY THE CONTRACT REUSES RATHER THAN
          REBUILDS. controlpower.perturb_message_difference HONESTLY RECOMPUTES
          in_linearized_code from the perturbed dv, and the committed
          PERTURBATION_DECLARATION says so in the field
          `recomputed_because_derived_from_the_perturbed_component`. A random bit flip takes
          the dv out of the linearized code, so on sha1 the draw moves TWO key components,
          message_difference AND in_linearized_code. It does not perturb "exactly the set
          {message_difference}". The row deleting message_difference retains the flag, the
          flag differs, the draw is a NON-MEMBER, and the cell is NOT DETECTED.
        the_narrowest_repair_that_saves_the_theorem: >-
          THE THEOREM IS SOUND WHEN CORRECTLY INSTANTIATED AND I SAY SO. For this family on
          sha1, S = {message_difference, in_linearized_code}, so the theorem applies to the
          DEPTH-2 row deleting that pair -- which is BATCH-efcae7's declared multi-deletion
          row 5 and the unique dependency-breaking depth-2 subset the graph names. The
          repair is to instantiate S from the family's ACTUAL moved-component set per
          primitive rather than from its name, and to report the sha1 diagonal cell as
          MEASURED NOT DETECTED rather than as an excluded theorem.
        the_per_primitive_split_which_the_plan_asked_for_and_which_exists: >-
          YES, THE ANSWER DIFFERS ON THE TWO PRIMITIVES AND THE SPLIT IS THE FINDING. On
          md5 the diagonal theorem holds for all three constructible families (measured
          DETECTED in all three). On sha1 it holds for d_step_delta and d_block_index and
          FAILS for d_message_difference. The close must state it as that mixed thing and
          may not round it to either end.
        what_it_does_not_take_with_it: >-
          THIS DOES NOT INVALIDATE THE DIFFERING-CELL COUNT AND DOES NOT CHANGE IT. The
          diagonal cells are outside the adjudicated set for both instruments, and O-E
          agrees with the honest instrument on that cell too (both NOT DETECTED). It
          invalidates the WORD THEOREM against that one excluded cell, and it shows the
          exclusion rule reads a family's name where it should read the family's behaviour.

