        the_object_list_that_remains: >-
          O-D (block_index-blind), O-C (block_index + length blind), O-C-prime (block_index
          + in_linearized_code blind) and O-C-double-prime (depth-3, block_index + length +
          in_linearized_code blind). All four remain UNREPLICATED -- built once by one
          session -- and permissive mode is unmeasured for all four in both directions.
        an_addition_the_round_2_framing_does_not_carry: >-
          A SIXTH INSTRUMENT ALSO PASSES AND IS IN NEITHER THE FIVE-SURVIVOR LIST NOR THE
          REFOLD'S PER-INSTRUMENT LIST. Committed j8_results.json records O-RT2 (sha1
