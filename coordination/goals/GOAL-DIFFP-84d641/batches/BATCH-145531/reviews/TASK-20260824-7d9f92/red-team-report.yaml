          what_should_replace_it: >-
            REPORT THE PER-CELL TABLE AND THE PER-INSTRUMENT VERDICT VECTOR, WHICH THE
            PRODUCER ALREADY DOES, AND DROP THE AGGREGATE AS A HEADLINE. If an aggregate is
            wanted, the honest one is the number of adjudicated cells on which ANY of the
            declared instruments differs from ANY other -- which is 0 of 9 here and would
            have told the reader immediately that the cell set has no variance.

        - id: RT-J8-4
          severity: major
          batch_halting: false
          title: >-
            THE CHEAPEST CONTROL THAT SEPARATES THE TWO CAPACITIES, STATED CONCRETELY
            ENOUGH TO BE BUDGETED -- AND ALREADY RUN.
          name: THE PER-INSTRUMENT FORCED-CELL RE-ADMISSION CONTROL
          what_it_constructs: >-
            Nothing new. It reuses the six cells this batch excludes as
            forced_by_the_graph and the draw sets already built for the three constructible
            families.
          what_it_adjudicates: >-
            Each of those six cells under each instrument, with the forcing predicate
            recomputed PER INSTRUMENT: a cell is forced for instrument I if and only if,
            under I's projection composed with the row's deletion, the projected key still
            retains a component that determines the deleted one by a derivation-backed
            edge. Cells forced for I are excluded for I; cells not forced for I are
            adjudicated for I.
          budget: >-
            Six cells over already-constructed draw sets. The measured whole-substrate
            proxy for a fourteen-instrument sweep including key construction is 33 s on one
            core (TASK-20260824-e9d21a J12, THAT SESSION'S MEASUREMENT). This is a small
            fraction of one such sweep and needs no new seed, no new family and no
            acquisition.
          outcome_that_would_mean_ARTIFACT: >-
            The count stays 0. Then the family set genuinely cannot separate O-E from the
            honest instrument, the previous 0 was not an exclusion artifact, and the count
            is a diagnostic with no power on this design.
          outcome_that_would_mean_POWER: >-
            The count becomes nonzero. Then the previous 0 was produced by an
            instrument-independent exclusion rule and not by the instruments agreeing.
          i_ran_it_and_it_fires: >-
            THE COUNT BECOMES 1. constructions/rt3_objects.py,
            `counting_rule.if_the_forced_by_the_graph_exclusion_is_NOT_applied`: 30
            per-primitive cells, 1 differing, the cell being (d_message_difference, row
            deleting in_linearized_code, sha1) at honest NOT DETECTED and O-E DETECTED.
            THIS IS NOT AN INSTRUCTION TO RE-RUN THE BATCH AND IT CHANGES NO COMMITTED
            NUMBER. It is the control the plan asked me to name, named, budgeted, and
            reported with its outcome.

        - id: RT-J8-5
          severity: minor
          batch_halting: false
          title: >-
            WHAT EACH DEGENERATE INSTRUMENT'S COUNT TELLS YOU THAT ITS PLANT CONTROL DOES
            NOT, AND CONVERSELY.
          determination: >-
