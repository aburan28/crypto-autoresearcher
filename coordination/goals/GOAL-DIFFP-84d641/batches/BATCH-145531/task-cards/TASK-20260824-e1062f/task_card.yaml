  budget_note: >-
    300 s AND IT IS BELOW THE MEASURED PER-JOINT AGENT-TIME RATE OF ROUND 2, WHICH IS SAID
    HERE RATHER THAN DISCOVERED IN YOUR REPORT. DEC-20260824-c5bb72 PD-6 is the third
