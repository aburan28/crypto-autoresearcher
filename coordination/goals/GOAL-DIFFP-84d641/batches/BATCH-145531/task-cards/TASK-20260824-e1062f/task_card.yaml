      DO NOT READ coordination/goals/GOAL-DIFFP-84d641/sealed-priors/**. The Coordinator's
      prior is sealed OUTSIDE this batch's directory on purpose; reading it would spend the
      independence the seal buys. Round 2's seal leaked to BOTH reviewers through the review
      plan's own mandatory prior field, and that field now carries a pointer only.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST, coordination/events/main/** AND
      COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY. Use `git log --format=%H`. If you
      encounter a finding anywhere, DISCLOSE IT UNPROMPTED.
    - >-
      DO NOT COMMIT YOUR REPORT (BR-11). Leave it untracked at your declared write scope;
      the ledger archive commits it. This resolves the round-2 conflict between your role
      contract and your task card IN YOUR ROLE CONTRACT'S FAVOUR, so you do not have to
      choose. Both round-2 reviewers faced that conflict and both chose correctly.
    - >-
      WRITE constructions-index.json EVEN IF YOU BUILD NOTHING (BR-8). It carries a sha256
      for every file you produce under your own constructions/ directory; it may list zero
      files and it may never be absent. It is what makes anything you build BINDABLE, which
      round 2's construction files were not.
    - >-
      REPORT ON THE FOUR JOINTS THE PLAN ASSIGNS YOU AND DO NOT COMPOSE A WHOLE-CLAIM
      VERDICT. Your sibling owns whether the CONCLUSIONS survive known-false objects; you
      own whether the output IS what the code produces and is scoped honestly. ON THE
      PARTITION, where you come closest: you check each row's class FOLLOWS from the stated
      rule, and the Red Team checks whether the CLASS SYSTEM was chosen to fit a known answer.
    - RE-RUNS WRITE INTO THIS TASK'S OWN DIRECTORY ONLY. The archived run directories are immutable.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading BY
      MECHANISM rather than by intent, which is the standard round 2 set.
    - AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not a finding against the producer.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade; if the probe verifies nothing, say so and mark the identifier
      self-reported.
    - >-
      WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13).
      coordination/**.yaml is unparse-gated in CI and this campaign has shipped five files
      unparseable.
    - Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).
