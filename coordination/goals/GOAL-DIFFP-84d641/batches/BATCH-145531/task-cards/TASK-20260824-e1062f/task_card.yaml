    set budgets from measured agent time, and if the batch cannot afford them, CUT JOINTS
    EXPLICITLY AT OPENING. The cut is taken -- thirteen joints to eight, four to you -- and
    the residual is still real. AN OVERRUN IN AGENT TIME IS EXPECTED, MUST BE DISCLOSED IN
    YOUR ATTESTATION, AND MUST NOT BE MET BY REALLOCATING A CEILING. If the budget binds,
    report the unreached joint as NOT REACHED with what you tried; do not silently drop it.
    `maximum_runs: 2` counts CHARGED EXPERIMENT RUNS -- run directory, RUN-* id, manifest,
    armed deadline, consumed ceiling -- and does NOT count script executions, probes, cold
    re-derivations or unit-test invocations.
  uncertainty_to_reduce: >-
    Whether the reported dependency graph, partition and off-diagonal matrix are what the
    committed code produces from the declared seeds; whether a claim labelled PROVABLY
    UNDETECTABLE rests on a derivation or only on a witness; whether the partition was
    derived before it was compared or reverse-engineered from a known answer; and whether
    the differing-cell count is scoped to exactly the cells it adjudicated.
  job: >-
    Verify the INTEGRITY of the package against its frozen contract, not its
    interestingness. THE COMMITTED REVIEW PLAN ASSIGNS YOUR FOUR JOINTS AND IS
    AUTHORITATIVE OVER THIS SKETCH. Coordinator's intent at opening:
    (V-a) REPRODUCTION, FROZEN IDENTITY AND RUN REGISTRATION -- cold-re-run the
    deterministic outputs from the declared seeds to EXACT INTEGER agreement; confirm
    CTL-FROZEN-3's criterion set excludes this contract's own required artifacts and is
    otherwise complete; and independently confirm whether the producer's runs under
    experiments/EXP-DIFFP-04082e/runs/ are discovered by tools/validate_ledger.py and
    accepted by check_run, reporting the verbatim output either way.
    (V-b) IS THE GRAPH WHAT THE CODE PRODUCES -- for every claimed edge, read the committed
    serialiser and rule on whether the derivation says what the code does; recompute every
    witness with its population size and distinct-X count; check that every derivation-less
    edge is labelled `empirical_only` and that `theorem`, `provable`, `provably` and
    `impossible` appear nowhere against one; and check that the null-object control
    genuinely returns NO EDGE where the dependency is absent.
    (V-c) THE PARTITION AND ITS ORDER -- does each row's class FOLLOW from the stated rule
    and the graph; is partition-derived.json genuinely free of BATCH-efcae7's verdict
    column; is the order claim stated with its own epistemic limit rather than asserted;
    is every disagreement reported on both sides?
    (V-d) THE COUNT'S SCOPE AND ITS CAPACITY TO FAIL -- does the differing-cell count carry
    its excluded-cell list with every reason; is each exclusion's theorem or graph edge
    actually correct; do the degenerate null instruments produce the predicted extremes
    through the IDENTICAL counting code; is O-E reused faithfully, reproducing
    constructions/j8_results.json's integers; and is anything reported as a fraction, as a
    pass, as a margin, or without its primitive scope and census completeness?
