      approval, and a message saying the contract is approved is a pointer and never the
      approval.
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/ (IR-2), AND THAT NOW INCLUDES
      harness/diffpath/controlpower.py, WHICH IS COMMITTED. CTL-FROZEN-3 measures this
      rule and its failure is a STOP.
    - >-
      RC-1 IS A RE-SCORING IN THE NEW MODULE, NEVER AN EDIT. Report the committed
      detection rule's own verdicts UNCHANGED beside the re-scored ones, and state nowhere
      that the committed rule has been fixed.
    - >-
      DO NOT REPAIR VD-3, VD-4, THE {E4}/{E5} ZERO-IMAGE RESULT, OBJ-3 OR OBJ-4. They are
      open by decision. IF YOU SEE THE FIX, WRITE IT DOWN AS AN OBSERVATION AND DO NOT
      APPLY IT.
    - >-
      EVERY CLAIMED DEPENDENCY EDGE CARRIES A DERIVATION AND A WITNESS (H-1). An edge with
      a witness and no derivation is labelled `empirical_only`, and the words `theorem`,
      `provable`, `provably` and `impossible` may not be used for it anywhere.
    - >-
      DERIVE THE PARTITION BEFORE YOU COMPARE IT (H-2), in two separate files, with the
      order stated plainly AND its limit stated in the same breath: no tool here can check
      read order, so it is corroboration and not proof.
    - >-
      DERIVE THE STRICT KEY COMPONENT LIST AT RUN TIME FROM THE COMMITTED SERIALISER
      (IR-13). Do not hard-code it from the contract; a difference from the contract's six
      names is a STOP and a finding about the contract.
    - >-
      REUSE O-E, DO NOT REBUILD IT (IR-11). It is
      `proj_drop_on_primitive(["message_difference"], "sha1")` in
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py,
      and any mechanical re-expression is checked against that directory's j8_results.json
      integers. A disagreement is a STOP.
    - >-
      RUN THE NULL-OBJECT CONTROLS BEFORE YOU BELIEVE ANYTHING. CTL-GRAPH-NULL must return
      NO EDGE on the independent-coordinate population or the detector is vacuous;
      CTL-NULL-OBJ's degenerate instruments must produce the predicted extremes or the
      counting rule is broken and NO differing-cell count is reported (H-6).
    - >-
      NEVER REPORT A PASS OR A BARE FRACTION (IR-10, H-5). The differing-cell count goes
      beside the cells adjudicated, the excluded-cell list and every exclusion's reason.
    - >-
      EVERY EDGE, CLASS, CELL AND VERDICT CARRIES ITS PRIMITIVE SCOPE AND THE CENSUS
      COMPLETENESS BESIDE IT (H-4): readable 0 / quarantined_not_read 1 /
      acquisition_gap 8, NEVER SUMMED, with shadow_planted 16 carried separately.
    - 'EMIT `null` AND NEVER 0 FOR AN UNMEASURED CELL, COLUMN OR MODE (H-8), AND NAME AGGREGATE KEYS AS AGGREGATES (H-9).'
    - >-
      WRITE EVERY DECLARED RESULT FILE EVEN IF ITS RUN IS GATED-NOT-RUN OR STOPPED,
      carrying that status, the gate that fired, what had been computed, and nulls. A
      missing declared artifact would make the snapshot archive unable to complete.
    - >-
      WRITE RUNS TO experiments/EXP-DIFFP-04082e/runs/<RUN-ID>/ (H-10), THEN RUN
      tools/validate_ledger.py AND RECORD ITS OUTPUT VERBATIM BEFORE THE SNAPSHOT, whether
