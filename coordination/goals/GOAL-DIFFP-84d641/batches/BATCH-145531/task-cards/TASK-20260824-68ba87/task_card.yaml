  budget_note: >-
    420 s against BATCH-efcae7's 1200 s, argued rather than assumed. Batch 2's producer
    built four control families, a projection mechanism, an attribution function, a
    generator profiler and two-sided decoy constructors, and ran five charged runs. This
    producer writes ONE new module against a substrate that is now fully committed and
    that it may not edit, and its heaviest stage is a deterministic sweep whose measured
    proxy is 33 s on one core (TASK-20260824-e9d21a J12 -- THAT session's measurement, not
    this Coordinator's). Declared per-run ceilings sum to 330 s: 60 + 45 + 105 + 60 + 60.
    THE STAGE GATES ARE IN THE CONTRACT so a partial result is a DECLARED OUTCOME rather
    than a shortfall: if run 2 stops, run 3 is GATED-NOT-RUN.
  uncertainty_to_reduce: >-
    Whether this program's per-component power profile is COMPUTABLE FROM THE MEMBERSHIP
    KEY'S STRUCTURE AND THE DECLARED FAMILIES' DECLARATIONS, with no charged adjudication
    at all -- and, if it is, whether ANY off-diagonal cell of the family-by-row matrix
    carries information about the instrument rather than about the families' construction.
    BATCH-efcae7 read a partition off measurements; this task asks whether it can be
    derived, and both answers are results.
  job: >-
    Implement and run EXP-DIFFP-04082e exactly, in its declared gated order, writing ONE
    new module (harness/diffpath/depgraph.py) and ONE new test file
    (tests/test_diffpath_depgraph.py) and MODIFYING NOTHING under harness/.
    RUN 1 -- CTL-FROZEN-3 pre-run digests; CTL-WF, the two-sided well-formedness gate;
    CTL-DEP, the 60-ordered-pair dependency graph per primitive with a DERIVATION and a
    WITNESS for every claimed edge; CTL-GRAPH-NULL, proving the edge detector can return
    NO EDGE on a population where the dependency is absent by construction.
    RUN 2 -- CTL-PART, the five-class re-partition of all six depth-1 rows DERIVED FROM
    THE GRAPH ALONE into partition-derived.json, which is COMPLETE before
    partition-compared.json is begun; and CTL-DEPTH2's fifteen-subset classification.
    RUN 3, GATED ON RUN 2 -- CTL-OFFDIAG, the off-diagonal cells adjudicated against the
    honest instrument and against the REUSED O-E, with every excluded cell carrying its
    reason.
    RUN 4 -- CTL-NULL-OBJ, the counting rule against honest-vs-honest and against two
    degenerate instruments.
    RUN 5 -- CTL-RC1, the D-SHA1-INCODE refold BY RE-SCORING, and CTL-FROZEN-3 post-run.
