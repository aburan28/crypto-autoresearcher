  budget:
    wall_clock_seconds: 150
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    maximum_runs is 1 because the dispatch schema rejects 0; this task performs no
    experiment runs. 150 s against BATCH-efcae7's 240 s, because the binding set is
    smaller and the pre-freeze check list is the same list plus one addition (the
    run-registration check).
  uncertainty_to_reduce: >-
    Whether the artifacts the two reviewers will attack are the exact bytes the producer
    wrote, fixed and reachable, rather than a working tree that can still move under them;
    whether the frozen instrument the producer measured is byte-identical to the one
    BATCH-efcae7 measured; and whether the producer's runs, now written where
    tools/validate_ledger.py actually looks, are in fact DISCOVERED and ACCEPTED -- which
    is the measurement DEC-20260824-c5bb72 explicitly refused to guess at.
  job: >-
    Snapshot-archive the exact BATCH-145531 package -- the opening control plane and the
    producer's dependency-graph and off-diagonal package -- under a content_first binding
    with pre-freeze checks, BEFORE the independent review runs. THEN write the round-3
    review plan, the two sibling assignment documents and the sealed prior part-2
    addendum, ALL FOUR OF WHICH ARE DECLARED ARTIFACTS OF THIS TASK so the ledger archive
    can bind them -- which is the durable fix for DEC-20260824-c5bb72 PD-2, where all four
    equivalents were unbindable. ORDER WITHIN THE TASK: addendum, then plan and
    assignments, then path_sha256 over the whole declared set, then the receipt, then ONE
    commit. Finally push and refresh DRAFT PR #561 with no findings in any body.
  hard_rules:
    - >-
      RUNS ALONE. No other task may be running concurrently, and NEITHER REVIEW MAY START
      before this commit exists and is verified.
    - STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE, and record the base commit and the merge outcome.
      RUN tools/merge_digest.py: PR #530 has merged and this branch's base has moved. A
      sync conflict inside an immutable record is a NEW SUPERSEDING RECORD under a new id,
      never an edit and never picking a side.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE ROUND CLOSES (BR-1),
      extended by BR-10 to committed artifacts that restate commit history.
    - >-
      THE PLAN CARRIES A POINTER TO THE SEALED PRIOR AND NOT THE PRIOR (BR-9). Its
      mandatory `coordinator_prior` field says the document is sealed and gives its path.
      NO PREDICTION AND NO MECHANISM APPEARS IN THE PLAN OR IN EITHER ASSIGNMENT. This is
      the exact channel through which round 2's seal leaked to BOTH reviewers.
    - >-
      `blind_from` NAMES coordination/goals/GOAL-DIFFP-84d641/sealed-priors AS A LITERAL
      PATH PREFIX WITH NO WILDCARD (BR-3), so the independence checker's leak test can
      actually match it.
    - >-
      THE ASSIGNMENT DOCUMENTS QUOTE NO PRODUCER-REPORTED VALUE FOR THE BLINDED QUANTITY
      (BR-5). This round's blinded quantity is THE DIFFERING-CELL COUNT, which no committed
      record predicts and which the contract deliberately declines to pre-register.
    - >-
      EVERY JOINT CARRIES A SHORT `id` AND EVERY REVIEWER LISTS THOSE IDS IN joints_owned
      (BR-2); proves_too_much carries a TOP-LEVEL failure_signature roll-up as well as any
      per-object ones (BR-4).
    - >-
      EIGHT JOINTS, FOUR PER REVIEWER, AND NO MORE. The cut is declared at opening and the
      plan may not quietly restore joints the batch did not fund.
    - >-
      NEITHER ASSIGNMENT INSTRUCTS A REVIEWER TO COMMIT ITS OWN REPORT (BR-11). Reviewers
      leave output untracked at their write scope; this batch's ledger archive commits it.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This task
      archives and plans; it does not review.
    - RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      Any scalar this receipt binds is either MEASURED by this session or quoted WITH ITS
      PROVENANCE AND MARKED UNVERIFIED (BR-6).
    - >-
      IF THE OPENING coordinator_decision WAS STILL NOT MINTED AND FILED WHEN THE PRODUCER
      RAN, SAY SO IN THE RECEIPT and do not proceed to dispatch the review.
    - >-
      WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13). The
      review plan and an assignment document are two of the five files this campaign has
      already shipped unparseable, and coordination/**.yaml is unparse-gated in CI.
  required_pre_freeze_checks:
    - origin/main fetched and MERGED into the working branch, base commit recorded
    - tools/merge_digest.py run over the new base, output recorded, because PR #530 has merged
    - tools/validate_ledger.py run on the merged tree, output recorded VERBATIM
    - tools/research_dispatch.py run against this batch's queue, output recorded VERBATIM
    - >-
      RUN-REGISTRATION CHECK, NEW THIS BATCH AND THE POINT OF BR-12: does the validator's
      glob `experiments/*/runs/*/manifest.yaml` discover the producer's run directories
      under experiments/EXP-DIFFP-04082e/runs/, and does check_run ACCEPT them? Record the
      answer and the verbatim output EITHER WAY. A rejection is an INFRASTRUCTURE FINDING
      and is never archived over, and it is never a mathematical result in either direction.
    - >-
      CTL-FROZEN CROSS-CHECK: recompute the sha256 of every file under harness/diffpath/
      plus harness/__init__.py and harness/runner.py from the tree and compare against the
      producer's pre-run and post-run digest sets in frozen-recheck-result.json. A
      difference is a STOP and an infrastructure finding.
    - >-
      RUN-INDEX BINDING CHECK: confirm run-index.json carries a sha256 for EVERY FILE OF
      EVERY EXECUTED RUN and that each matches the tree.
    - >-
      DECLARED-ARTIFACT PRESENCE CHECK: confirm that EVERY result file the producer
      declared exists, including those whose runs were GATED-NOT-RUN, and that each such
      file carries its status and its gate rather than being empty.
    - no dirty-tree drift outside the declared paths
  required_disclosures_in_staged_not_in_binding_set:
    - >-
      ledger/goals/GOAL-DIFFP-84d641.yaml -- written at this batch's opening by
      TASK-20260824-f094e8 but OWNED as an artifact by TASK-20260824-5eafa3.
    - >-
      Every run directory under experiments/EXP-DIFFP-04082e/runs/, with the note that they
      are content-bound through run-index.json, which IS in the binding set.
    - >-
      Any sibling module the producer wrote under harness/diffpath/ beyond the bound
      harness/diffpath/depgraph.py. The contract declares one new module; if more exist,
      they are disclosed by name and the deviation is recorded.
    - >-
      THE ABSENCE OF A SEPARATE REVIEW-ROUND DECISION RECORD, if the driving session did
      not grant a second coordinator_decision id. In that case this receipt plus the
      committed review plan carry the binding, and the absence is DISCLOSED HERE rather
      than left for a reader to notice.
  note: >-
    MEASURE AND RECORD THE COMMIT SHA AND THE MERGE BASE. This task is the first of this
    batch that can measure a sha from git rather than restate one it was told; the ledger
    close (TASK-20260824-5eafa3) writes it into the goal head. CORR-20260824-ad7f2c records
    what the alternative costs: at the BATCH-efcae7 close a transmitted HEAD was written
    into latest_verified_commit ALONG WITH AN ASSERTION THAT IT WAS THE ARCHIVE COMMIT'S
    PARENT, and both the value and the assertion were wrong because two commits landed in
    between. RECORD A SHA AS A MEASUREMENT OR NOT AT ALL, AND NEVER ATTACH A CLAIM ABOUT
    ITS POSITION IN HISTORY THAT WAS NOT MEASURED.
    After the commit, push the branch and refresh DRAFT PR #561, NAMING BATCH-145531,
    EXP-DIFFP-04082e, GOAL-DIFFP-84d641, the minted opening decision id and every
    TASK-20260824-* record of this batch -- WITH NO FINDINGS IN THE PR BODY WHILE THE
    ROUND IS OPEN. PR #530 is MERGED and #561 is a FRESH PR, so a record named on #530 is
    not thereby named on #561.
