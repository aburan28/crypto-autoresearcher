  uncertainty_to_reduce: >-
    Whether the conclusions this batch wants to draw -- that a NOT DETECTED verdict is
    PROVABLY UNDETECTABLE, that the depth-2 lattice is bought by argument, and that a
    differing-cell count measures the instrument -- survive objects for which they are
    KNOWN FALSE. THIS IS THE FIRST BATCH OF THIS GOAL TO CLAIM SOMETHING THEOREM-LIKE, and
    by construction its counterexample cannot be in the contract, because the contract's
    author is the one who would have had to imagine it.
  job: >-
    Attack the INTERPRETATION of the package before the Coordinator composes it. THE
    COMMITTED REVIEW PLAN ASSIGNS YOUR FOUR JOINTS AND IS AUTHORITATIVE OVER THIS SKETCH.
    Coordinator's intent at opening:
    (R-a) ATTACK THE WORD PROVABLY -- this round's load-bearing joint. Construct an object
    or a population for which a claimed dependency edge, or the PROVABLY_UNDETECTABLE class
    that rests on it, is KNOWN FALSE, and say WHERE IN THE ARGUMENT the survival happens.
    Candidates are a FLOOR, NOT A CEILING: a well-formed SHA-1 object OUTSIDE the linearized
    code, which this census contains none of; an object at a step range other than (0,79);
    an object whose flag is set at CONSTRUCTION rather than derived at SERIALISATION, so the
    edge is a fact about how this program builds objects rather than about the key; and a
    population size at which the witness is vacuous.
    (R-b) ANSWER J8, J11 AND J13 rather than restating them, because GOAL-DIFFP-84d641
    completion criterion 4 requires it and a close may not read silence as an admission.
    Concretely: does the RC-1 refold actually close J8 for O-E, and does it leave O-D, O-C,
    O-C-prime and O-C-double-prime open as predicted? Does the off-diagonal result answer
    J13's restatement-versus-power question or reproduce it one level up? Does J11's
    finding -- that the isolating sub-arm binds nothing the verdicts depend on -- change?
    (R-c) THE CLOSURE ATTACK AND THE O-RT2 STRUCTURAL FINDING, symmetric with overclaiming.
    Confirm or refute FROM THE GRAPH that a SHA-1 membership key's apparent 2560 bits are at
    most 512 plus one flag bit on IN-CODE objects. Then check whether any lane is being
    quietly closed: the MD5 lane; depth >= 2, where "bought by argument" must not become
    "covered" and where three non-breaking subsets are ALREADY MEASURED to hide a
    known-false instrument; permissive mode; the second seed set; null family (e); and the
    four unreplicated survivors.
    (R-d) WHAT WOULD MAKE THE DIFFERING-CELL COUNT MEANINGLESS. Is it a diagnostic or is it
    being used as a decision variable? Does the null-object control show the COUNTING RULE
    can be large, or that the FAMILY SET can produce a large one -- which are different
    things? Name the cheapest control that separates them, and exhibit at least one object
    this contract's author did not imagine.
  hard_rules:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-e1062f,
