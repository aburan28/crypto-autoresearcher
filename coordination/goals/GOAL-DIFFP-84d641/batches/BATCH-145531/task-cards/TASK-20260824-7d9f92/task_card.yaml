      declined the Coordinator's prior deliberately so its rulings could not be a
      confirmation of it; this round the prior is placed where declining costs you nothing.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST, coordination/events/main/** AND
      COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY. Use `git log --format=%H`. If you
      encounter a finding anywhere, DISCLOSE IT UNPROMPTED AND IN FULL.
    - DO NOT COMMIT YOUR REPORT (BR-11). Leave it untracked at your declared write scope; the ledger archive commits it.
    - >-
      WRITE constructions-index.json EVEN IF YOU BUILD NOTHING (BR-8). In round 2 the six
      construction files carrying the round's load-bearing counterexample were unbindable
      FOR THE SECOND CONSECUTIVE BATCH. This index is the fix and it is a declared artifact.
    - >-
      REPORT ON THE FOUR JOINTS YOU OWN AND DO NOT COMPOSE A WHOLE-CLAIM VERDICT. You cannot
      see the Validator's joints by construction; composing is the Coordinator's job.
    - >-
      TAKE THE PLAN'S ATTACK AS A FLOOR, NOT A CEILING. Round 2 measured that the plan's
      candidate list did NOT bound the pass -- O-RT2, O-RT2-prime and O-RT3 were none of them
      on it, and one lay outside the class the contract's lattice could express.
    - DO NOT ALTER THE EXECUTOR'S RAW RECEIPTS OR THE VALIDATOR'S OUTPUT. Your constructions write into THIS TASK'S OWN DIRECTORY ONLY.
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/. Build adversarial instruments as a
      run-time projection or wrapper and say which mechanism you used. CTL-FROZEN-3 would
      detect a modification and it would invalidate the producer's package as well as your
      own finding.
    - DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading BY MECHANISM rather than by intent.
    - >-
      DO NOT CALL A BOUNDED FAILURE AN IMPOSSIBILITY RESULT, do not reject a result merely
      because it is surprising, and PRESERVE THE NARROWEST VALID CONCLUSION when an object
      of yours breaks something.
    - >-
      DO NOT MANUFACTURE A CRYPTANALYTIC BASELINE. Pollard-rho, BSGS and the specialized
      ECDLP baselines are not the comparison class: the package makes no cryptanalytic claim
      and runs no search. The comparison is what the graph and the families' declarations
      PREDICT against what the adjudications MEASURE.
    - AN INFRASTRUCTURE FAILURE IN YOUR OWN CONSTRUCTION IS INFRASTRUCTURE SIGNAL, not a finding against the producer.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade; if the probe verifies nothing, say so and mark the identifier self-reported.
    - WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13). coordination/**.yaml is unparse-gated in CI.
    - Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).
