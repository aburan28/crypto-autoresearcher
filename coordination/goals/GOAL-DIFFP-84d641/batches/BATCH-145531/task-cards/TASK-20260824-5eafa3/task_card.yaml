  job: >-
    Close BATCH-145531: compose the two sibling-blind independent reviews into one ruling
    AT THE EXACT TESTED SCOPE, file EV-DIFFP-afd96c and DEC-20260824-257f35, discharge the
    bounded knowledge-entry obligation one way or the other, checkpoint the goal head with
