  hard_rules:
    - RUNS ALONE, and stages only the declared paths.
    - >-
      ledger/evidence IS LIMITED TO EXACTLY ONE NEW FILE, EV-DIFFP-afd96c.yaml, AND
      ledger/decisions TO EXACTLY ONE NEW FILE, DEC-20260824-257f35.yaml. The OPENING
      decision is a separately minted id filed by the driving session at the opening commit
      and is not this task's to write.
    - Merge origin/main before the archive (MERGE, NEVER REBASE), record the base and outcome, and push and refresh PR #561 after.
    - >-
      VERIFY VALIDITY BEFORE INTERPRETING ANYTHING: expected run count, schema-complete
      manifests carrying the literal id EXP-DIFFP-04082e, seed integrity over the eight
      declared seeds with NO NINTH, raw-versus-summary agreement, CTL-FROZEN-3 before/after
      identity, and control comparability. AN INVALID OR INCOMPLETE RUN SET GOES BACK TO THE
      EXECUTOR WITH CONCRETE DEFECTS LISTED AND IS NOT EVIDENCE. A timeout, crash or
      check_run rejection is INFRASTRUCTURE SIGNAL and never a mathematical result.
    - >-
      COMPOSE, DO NOT COUNT. A blinded reviewer's scalar verdict is a lossy rollup the
      checker's schema requires; the PER-JOINT MAPS GOVERN. Where the two reports agree,
      treat the agreement as ONE observation unless mutual blindness demonstrably held, and
      STATE THE RULE YOU APPLIED so it can be checked.
    - >-
      ADJUDICATE COMPLETION CRITERION 4 EXPLICITLY, from the reports actually received and
      never from the batch shape. It requires that BOTH sessions ADMIT, and the goal head
      additionally requires that J8, J11 AND J13 WERE ANSWERED. A `breaks` on an owned joint
      is not an admission on that joint, and SILENCE ON AN ASSIGNED JOINT IS NOT AN
      ADMISSION EITHER -- reading it as one would be manufacturing an admission.
    - >-
      RULE ON THE ROUND'S INDEPENDENCE EXPLICITLY, from the attestations rather than from
      the plan's intent, and compose every disclosed exposure rather than absorbing it.
      STATE WHETHER BR-9's STRUCTURAL FIX ACTUALLY HELD: round 2's residual was wider than
      the round disclosed and the finding was against the plan, which was this role's.
    - >-
      SCORE THE SEALED PRIOR P-1..P-8 ITEM BY ITEM. An overturned item is a FIRST-CLASS
      FINDING, not something to absorb. The prior is NEVER evidence: discount any
      concurrence a reviewer could have read and state the discount.
    - >-
      REPORT THE GRAPH, THE PARTITION AND THE MATRIX AS TABLES, NEVER AS A PASS AND NEVER AS
      A BARE FRACTION. Every verdict carries its basis and its primitive scope, and the
      differing-cell count carries its exclusions.
    - >-
      DO NOT CLAIM ANY PATH IS NEW, and do not let any NON-MEMBER verdict be written or
      implied as novelty. State the census's completeness beside every verdict cited.
    - Claim ceiling is `analyzed`. Do not round up and do not record `supported` on any record of this batch.
    - THE MD5 LANE IS BLOCKED, NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged and the Tier B unblocking route is intact.
    - >-
      IF ANY ADVERSE TRANSITION IS PROPOSED, SECURE THE STRONGEST CHECKABLE REFUTATION
      ARTIFACT THE RESULT ADMITS FIRST -- counterexample certificate, then derivation note,
      then a declared empirical_only basis -- archive it before the decision, and record
      proof_status and proof_refs. `reject_scoped` on a single unreplicated empirical-only
      run is FORBIDDEN.
    - >-
      A FAILING CONTROL, A REFUTED PARTITION, A GATED-NOT-RUN STAGE OR AN EXHAUSTED TASK
      BUDGET ENDS A TASK, NOT THIS GOAL. Preserve exactly one concrete next action.
    - >-
      FILL knowledge_promotion AND DISCHARGE THE BOUNDED OBLIGATION. DEC-20260824-c5bb72
      bound the twice-deferred KN-TECH entry ON THIS CLOSE: either it is written with the
      amended content that decision specified, or an explicit Coordinator decision retires
      the requirement ON THE MERITS and says what replaces it. IF NO KN-TECH ID WAS GRANTED,
      TAKE THE SECOND BRANCH AND SAY THAT THE REASON IS THE MISSING IDENTIFIER AND NOT THE
      MERITS -- a completion criterion retired for a bookkeeping reason is a worse outcome
      than one retired on argument, and it is recorded as one rather than dressed up.
    - If the round surfaced solver-validation work rather than instrument measurement, record the handoff to GOAL-MD5-001 explicitly rather than absorbing it.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output. NEVER INVENT
      A COMMIT SHA, and never attach a claim about a sha's position in history that was not
      measured: CORR-20260824-ad7f2c records that at the BATCH-efcae7 close both the value
      AND the assertion attached to it were wrong.
    - knowledge/INDEX.md is GENERATED AND GITIGNORED and is never committed by any task.
    - >-
      WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13).
      EV-DIFFP-b16b01 is one of the five files this campaign has already shipped
      unparseable, by a dedent that landed at mapping indent.
  mandatory_content_of_the_closing_decision:
    - The validity check, recorded BEFORE any interpretation, with its ordering stated and its capacity to end the close stated.
    - The dependency table per primitive, with every edge's derivation status and every `empirical_only` label.
    - The partition with EVERY ROW'S BASIS, derived beside compared, and every disagreement named on both sides.
    - The depth-2 classification, with the explicit statement that a non-breaking subset is NOT thereby safe.
    - >-
      The off-diagonal matrix with its differing-cell count beside the cells adjudicated,
      its full excluded-cell list with reasons, and the null-object control outcomes that
      give the count its capacity to be large.
    - The sealed prior scored item by item, with overturned items as first-class findings.
    - >-
      An explicit completion-criterion-4 adjudication INCLUDING whether J8, J11 and J13 were
      each answered.
    - An independence ruling, with a statement of whether BR-9's structural fix held.
    - knowledge_promotion filled, and the bounded knowledge-entry obligation discharged with its reason.
    - The claim ceiling stated as `analyzed` explicitly.
    - A next_action_ranking against real alternatives, each with the reason it loses.
    - >-
      If anything is weakened or closed, a complete `obstruction` block with a quantity, its
      value with units and honest error bars naming which variability is unmeasured, the
      runs it is read from, its scope and its resource_check. PROSE DOES NOT DISCHARGE THE
      CLOSURE GATE.
