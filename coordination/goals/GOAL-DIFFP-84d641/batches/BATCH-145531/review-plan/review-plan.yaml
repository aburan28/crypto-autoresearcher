        boolean.
      cost_stated: >-
        THE ROUND DOES NOT ACHIEVE VALUE-BLINDNESS AND DOES NOT CLAIM IT. It achieves
        seal-blindness, sibling-blindness and implementation-blindness for one reviewer,
        mechanically. The close must describe it in exactly those words and must not upgrade it.
