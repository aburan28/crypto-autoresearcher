      - coordination/goals/GOAL-MD5-001/quarantine
    blind_from_note: >-
      EVERY ENTRY IS A LITERAL PATH PREFIX (BR-3). No glob character, no double-star, no
      English prose describing a document section. The reason is mechanical:
      tools/check_review_independence.py matches with `r == b or r.startswith(b.rstrip("/") +
      "/")`, so an entry like a directory followed by a double-star produces a tested prefix
      that NO REAL PATH CAN MATCH, which is why BATCH-f8bf86's leak detector could not have
      fired even if a leak had occurred.
      THE FIRST ENTRY IS THE ONE THAT MATTERS THIS ROUND. The sealed-prior prefix is written
      with no wildcard so that the leak test can actually match it, and it is ALSO carried in
      `blind_rederivation.blind_from` below, because THAT is the only list the checker
      mechanically tests. Putting it in this list alone would be a declaration; putting it in
      both makes it a check, for the re-deriver.
      NOTE ON THE TWO TASK-CARD AND TWO ASSIGNMENT PREFIXES: each reviewer READS ITS OWN card
      and ITS OWN assignment, both of which sit under one of those prefixes. They are listed
      here as the round's blindness BOUNDARY -- neither reviewer may read the OTHER's -- and
      each reviewer's own two documents are expected in its own sources_read.
