  proves_too_much:
    assigned_to: TASK-20260824-7d9f92
    joint: R3-J5
    also_bears_on: R3-J8, which owns the counting rule's version of the same question and may answer it from the same objects.
    failure_signature: >-
      TOP-LEVEL ROLL-UP (BR-4), IN ADDITION TO THE PER-OBJECT SIGNATURES BELOW.
      THERE ARE TWO ARGUMENTS IN THIS PACKAGE AND EVERY OBJECT BELOW MUST BE RUN AGAINST THE
      ONE IT IS PAIRED WITH, UNCHANGED.
      ARGUMENT A, THE THEOREM-LIKE ONE: that a component determined by a retained component
      via an edge carrying a derivation from committed source is PROVABLY UNDETECTABLE BY ANY
      FAMILY, so its NOT DETECTED verdict is not a coverage gap.
      ARGUMENT B, THE COUNTING ONE: that a differing-cell count between the honest instrument
      and a known-false one, over the off-diagonal cells the graph admits, carries information
      about the instrument.
      THE ARGUMENT MUST FAIL ON EVERY OBJECT BELOW, because every object below is one for
      which the paired conclusion is KNOWN FALSE. IF AN ARGUMENT SUCCEEDS ON ANY OF THEM IT
      HAS PROVED TOO MUCH and it is wrong somewhere that has not been read closely enough:
      name the object, name the STEP at which the survival happens, and give that step's
      measurement. IF AN ARGUMENT REFUSES AN OBJECT, say WHICH part of the package did the
      refusing and with what measurement -- that is the control firing and it is a genuine,
      reportable strength. A REPORT THAT NEITHER SURVIVES NOR REFUSES HAS NOT RUN THE
      CONTROL. "The argument looks fine" is not an outcome. "No object was found within
      budget, and here is what was tried" IS an outcome, and it is a bounded negative and
      never an impossibility result.
    objects:
      - id: O-P1
        pairs_with: ARGUMENT A
        object: >-
          A WELL-FORMED SHA-1 OBJECT AT A STEP RANGE OTHER THAN THE FULL ONE, on which the
          stored flag was computed from the full expansion while the serialised message
          difference is the step-range slice.
        why_its_conclusion_is_known_false: >-
          If such an object exists and passes the well-formedness gate, then the serialised
          message difference does NOT determine the flag on the class of well-formed objects,
          so a class name quantifying over ANY FAMILY is quantifying over a population this
          census does not contain. The producer names this coincidence-only-at-full-range
          limit in its own derivation, which is why it is the first object here.
        failure_signature: >-
          The argument must decline to give the class to a component whose determining edge
          holds only at one step range, OR the report must state the class as scoped to full
          step range everywhere it appears and not only in a limitations block.
      - id: O-P2
        pairs_with: ARGUMENT A
        object: >-
          AN OBJECT PRODUCED BY AN EQUIVALENCE GENERATOR THAT CARRIES THE FLAG OVER RATHER
          THAN RECOMPUTING IT FROM THE TRANSFORMED DIFFERENCE.
        why_its_conclusion_is_known_false: >-
          For such an object the flag is a fact about HOW THIS PROGRAM BUILT IT and not a
          function of its own serialised difference. If the derivation covers these images
          only because the gate was measured on this census, then the theorem is a theorem
          about a measured population, and "provably" is doing work that "verified on these
          objects" would do more honestly.
        failure_signature: >-
          The argument must either exhibit the recomputation in committed source for these
          generators, or concede that the class rests on a measured check rather than on a
          derivation. If it does neither and keeps the word provably, it has proved too much.
      - id: O-P3
        pairs_with: ARGUMENT A
        object: >-
          A WELL-FORMED SHA-1 OBJECT OUTSIDE THE LINEARIZED CODE. THIS CENSUS CONTAINS NONE,
          which is stated in the committed scope of the predecessor batch's evidence record.
        why_its_conclusion_is_known_false: >-
          Every planted SHA-1 entry of this census is in the code, so every measurement of the
          flag edge is taken on a population where one side of the predicate is constant. A
          class quantifying over any family must survive the object the census excludes.
        failure_signature: >-
          The argument must survive the object's presence, or the class must be scoped to
          in-code censuses explicitly, in the headline sentence and not only in a caveat.
      - id: O-P4
        pairs_with: ARGUMENT B
        object: >-
          THE DEGENERATE INSTRUMENT THAT RETURNS NON-MEMBER FOR EVERY OBJECT. It is already
          built and already run through the identical counting rule as one of the round's own
          null-object controls.
        why_its_conclusion_is_known_false: >-
          It identifies nothing whatsoever and fails the planted-positive control outright. Any
          argument that reads a differing-cell count as evidence about an instrument must
          refuse this object, because whatever this object's count is, the count is not
          evidence that this object is a usable adjudicator.
        failure_signature: >-
          DETERMINE WHETHER THE DIFFERING-CELL COUNT SEPARATES THIS OBJECT FROM THE HONEST
          INSTRUMENT. If it does, say so and say by how much and the count is a stronger
          discriminator than this plan assumed. IF IT DOES NOT, THEN A DIFFERING-CELL COUNT
          CANNOT DISTINGUISH THE HONEST INSTRUMENT FROM AN INSTRUMENT THAT IDENTIFIES NOTHING,
          the count is a DIAGNOSTIC AND NEVER A DECISION VARIABLE, and every artifact of this
          batch that leans on it must be re-read in that light. Both branches are live and
          this plan asserts neither.
      - id: O-P5
        pairs_with: ARGUMENT B
        object: >-
          THE DEGENERATE INSTRUMENT THAT RETURNS MEMBER FOR EVERY OBJECT, considered not as a
          control that passed but as an object in its own right.
        why_its_conclusion_is_known_false: >-
          It accepts everything and therefore identifies nothing, while passing the
          planted-positive control trivially. Its differing-cell behaviour is a property of the
          counting code rather than of any family set.
        failure_signature: >-
          The argument must not treat this object's differing-cell behaviour as showing that
          THE FAMILY SET can produce a large count. If the package's capacity argument rests
          on this object alone, the capacity demonstrated is the counting rule's and not the
          experiment's, and the report must say which one was demonstrated.
      - id: O-P6
        pairs_with: ARGUMENTS A AND B TOGETHER
        object: >-
          THE FOUR KNOWN-FALSE INSTRUMENTS THAT SURVIVED ROUND 2 AND THAT THIS BATCH DOES NOT
          RE-BUILD -- the block-index-blind instrument, the two depth-2 blind instruments and
          the depth-3 one -- all committed in TASK-20260824-e9d21a's constructions directory.
        why_its_conclusion_is_known_false: >-
          Each is blind to a component or a component subset and cannot identify a
          characteristic by the key it reads; three of them are the very depth-2 and depth-3
          subsets that the depth-2 classification reports as NOT dependency-breaking.
        failure_signature: >-
          The argument must not license "the depth-2 lattice is bought by argument" in any
          form that would also license "the depth-2 lattice is covered", because these objects
          are measured counterexamples to the second. If the refold or the graph catches any
          of them, say which and how; if it catches none, that is the honest scope of what
          this batch bought and the close must carry it into the headline sentence.
      - id: O-P7
        pairs_with: WHICHEVER ARGUMENT IT BEARS ON, AND IT IS YOURS TO NAME
        object: >-
          RESERVED, DELIBERATELY, FOR THE OBJECT THIS PLAN'S AUTHOR DID NOT IMAGINE. It is
          listed as an object rather than as an invitation because round 2 measured that the
          plan's candidate list did NOT bound the pass -- three of that round's objects were
          none of them on the list, and one lay outside the class the contract's lattice could
          express.
        why_its_conclusion_is_known_false: >-
          Unknown by construction. That is the point: the author of the argument is the reader
          least able to find the object that breaks it.
        failure_signature: >-
          If you exhibit one, the close must present it as THIS PLAN'S LIMIT and not as this
          plan's success, and must record which of the two arguments it bears on.

