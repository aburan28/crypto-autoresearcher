      NAMES, AND COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY -- not only reports.
    commit_metadata_rule: >-
      USE `git log --format=%H` UNTIL THE ROUND CLOSES. Do not read commit bodies, PR
      descriptions, bus messages or merge digests. IF YOU ENCOUNTER A FINDING ANYWHERE -- a
