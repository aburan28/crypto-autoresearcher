      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-e1062f
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-7d9f92
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/task-cards/TASK-20260824-e1062f
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/task-cards/TASK-20260824-7d9f92
