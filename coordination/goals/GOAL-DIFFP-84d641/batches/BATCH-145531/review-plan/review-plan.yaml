      deletion applied as a projection INSIDE the minimisation; strict mode only, permissive
      out of scope; the cell verdict rule as the contract states it, namely that a cell is
      DETECTED for an instrument if and only if at least one perturbed draw at k greater than
      or equal to 1 is a strict member under that instrument's projection composed with the
      row's deletion; and O-E imported from TASK-20260824-e9d21a's committed constructions
      file rather than rebuilt (IR-11).
    blind_from:
      - coordination/goals/GOAL-DIFFP-84d641/sealed-priors
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-e1062f
      - harness/diffpath/depgraph.py
      - tests/test_diffpath_depgraph.py
    what_this_blind_from_BUYS_stated_precisely_because_it_is_less_than_the_field_name_suggests: >-
      THREE MECHANICALLY CHECKED PROPERTIES, EACH REAL AND EACH NARROWER THAN "BLIND".
      (1) THE RE-DERIVER DID NOT READ THE COORDINATOR'S SEALED PRIOR. This is the first round
      of this goal in which the seal is machine-testable for any reviewer, and it is the direct
      structural answer to DEC-20260824-c5bb72 PD-3, where the prior leaked to BOTH reviewers
      through this plan's own mandatory prior field.
      (2) THE RE-DERIVER DID NOT READ ITS SIBLING'S REPORT. Sibling blindness becomes a checked
      property rather than an attested one, for one of the two reviewers.
      (3) THE RE-DERIVER DID NOT READ THE PRODUCER'S IMPLEMENTATION OF THE COUNTING RULE OR
      ITS TEST FILE. So a re-derived count comes from an INDEPENDENT RE-IMPLEMENTATION OF THE
      CONTRACT rather than from running the producer's module, and re-implementing the declared
      rule checks that the code implements the contract, which is a different check from
      checking that the reported number is what that code produces. THE SECOND CHECK IS THE
      VALIDATOR'S UNDER R3-J1 AND R3-J2, and the close will receive both.
    what_this_blind_from_DOES_NOT_BUY_and_why_the_producers_REPORT_is_deliberately_absent_from_it: >-
      IT DOES NOT BUY BLINDNESS TO THE VALUE, AND CALLING IT THAT WOULD BE A FAKE SEAL OF
      EXACTLY THE KIND PD-3 MEASURED. The producer's committed execution report states the
      quantity in prose, as H-5 and IR-10 require it to, and EVERY REVIEWER MUST READ THAT
      REPORT TO DISCHARGE ANY JOINT AT ALL. Naming the producer's task directory in blind_from
      would therefore guarantee one of two bad outcomes: a checker FAIL at the close against a
      reviewer who did nothing wrong, or an incomplete `sources_read`, which is a dishonest
      attestation and far worse than a weaker blind_from. The checker's leak test is
      ORDER-BLIND -- it compares the declared sources_read against blind_from and reports a
      leak whenever a prefix appears, regardless of when it was read -- so no sequencing
      instruction can rescue it.
      THE VALUE-BLINDNESS SUBSTANCE IS THEREFORE CARRIED SEPARATELY, BY
      `independent_derivation_before_reading` BELOW, AND IT RESTS ON THE RE-DERIVER'S HONEST
      BOOLEAN, WHICH NO TOOL IN THIS REPOSITORY CAN CHECK. That is stated here at opening
      rather than discovered at the close, and the close must weight it accordingly: a matching
      independent derivation with `derived_before_reading: true` is CORROBORATION AND NOT PROOF
      OF INDEPENDENCE.
      THIS IS A DELIBERATE CHANGE FROM ROUND 2, WHICH SET `required: false` AND LOST ALL THREE
      MECHANICAL PROPERTIES ABOVE RATHER THAN OVERSTATE THE FOURTH. Round 3 keeps the three it
      can check and names the one it cannot.
    why_the_RED_TEAM_and_not_the_validator: >-
      TWO REASONS, AND THE FIRST IS DECISIVE ON FEASIBILITY. (1) THE VALIDATOR MUST READ THE
      PRODUCER'S NEW MODULE AND ITS TEST FILE TO DISCHARGE R3-J1 AND R3-J2 -- both are in its
      committed read_scope precisely so that it can -- so assigning the re-derivation to the
      Validator would guarantee a leak against the third blind_from entry. The Red Team's four
      joints require the committed substrate, the frozen contract, the producer's RESULTS and
      BATCH-efcae7's committed constructions, and none of them requires the producer's module.
      (2) THE RED TEAM IS THE REVIEWER WHOSE INDEPENDENCE FROM THE COORDINATOR'S PRIOR IS WORTH
      THE MOST, because it owns the joints where a prior would most bias a reading -- the word
      PROVABLY, and the three round-2 joints that broke. Round 2's Red Team declined the prior
      deliberately so its rulings could not be a confirmation of it; this round makes the same
      decision checkable rather than voluntary.
    the_read_scope_narrowing_this_implies_and_the_escape_hatch: >-
      harness/diffpath and tests/test_diffpath_depgraph.py ARE in the Red Team's committed
      read_scope. A read_scope is a PERMISSION AND NOT AN OBLIGATION, and this plan narrows it
      for two named files; the plan is authoritative over the card where they differ, and the
      difference is recorded at PDV-2. ESCAPE HATCH, AND IT IS NOT A LOOPHOLE: if discharging
      an assigned joint genuinely requires reading a blind_from path, DO NOT READ IT SILENTLY
      AND DO NOT DROP THE JOINT. Say what you needed and why. If you judge reading it
      unavoidable, READ IT AND DECLARE IT in sources_read with `blind_from_respected: false`
      and the reason. AN HONEST FALSE IS WORTH MORE THAN A MATCHING TRUE THAT IS NOT TRUE: it
      makes the close's checker run a disclosed, adjudicable event instead of a hidden one, and
      the close records it as a bounded gap rather than as a defect in the review.
    granularity_requirement_without_which_the_leak_test_cannot_fire: >-
      LIST `sources_read` AT FILE GRANULARITY FOR ANYTHING UNDER harness/ AND UNDER THE
      PRODUCER'S DIRECTORY. The checker matches a declared source against a blind_from prefix
      with `r == b or r.startswith(b.rstrip("/") + "/")`, so a coarse entry naming a DIRECTORY
      cannot match a blind_from entry naming a FILE INSIDE it, and the leak test would pass
      while the file had been read. THIS IS A KNOWN LIMIT OF THE TEST, NOT A WAY AROUND IT, and
      it is written here so that the attestation is what makes the check work rather than what
      defeats it.

  independent_derivation_before_reading:
    applies_to: [TASK-20260824-e1062f, TASK-20260824-7d9f92]
    the_instruction: >-
      BEFORE OPENING ANY FILE UNDER
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/tasks/TASK-20260824-68ba87,
      derive your own answer to the quantity your assignment names, from the frozen contract,
      the committed instrument and the declared seeds, and WRITE IT DOWN IN YOUR REPORT before
      you read anything under that prefix. Then read, and report your value BESIDE the
      package's, whether they agree or not.
    for_the_validator: >-
      Your own application of the partition's assigning rule to each row on each primitive
      (R3-J3), formed from the graph and the declared family declarations before you read the
      producer's row classes.
    for_the_red_team: >-
      The quantity in `blind_rederivation.quantity` above -- the adjudicated-versus-excluded
      cell partition first, then the differing-cell count over the adjudicable cells -- plus
      your own answer to whether the diagonal exclusion answers or relocates the round-2
      restatement question (R3-J6), formed from the committed code before you read the
      producer's framing of it.
    what_to_record: >-
      A block in your report carrying `derived_before_reading` (true or false, honestly), the
      value or construction you derived, the MECHANISM you used -- your own re-implementation
      of the declared rule, or the producer's committed module -- and, if you could not
      complete it within budget, `derived: false` WITH THE REASON. AN HONEST FALSE IS WORTH
      MORE THAN A MATCHING TRUE THAT IS NOT TRUE, and an incomplete derivation is a bounded gap
      the close records rather than a defect.
    why_the_mechanism_matters: >-
      Re-deriving THROUGH the producer's module checks that the reported number is what that
      code produces. Re-implementing the declared rule yourself checks that the code implements
      the contract. THOSE ARE DIFFERENT CHECKS AND THE CLOSE NEEDS TO KNOW WHICH ONE IT
      RECEIVED. Say which. For the Red Team the mechanism is constrained by blind_from to the
      second.

