        and J13 specifically. A bare J8 meaning one thing in a closed batch and another in this
        one would make the mapping ambiguous in the exact record that must demonstrate the
        restriction was met.
      cost_stated: >-
        Reviewers must copy a slightly longer literal string into joints_owned, and the checker
        matches on exact equality, so a reviewer that writes J1 instead of R3-J1 produces a
        spurious FAIL. The assignment documents therefore carry the literal list to copy, and
        this is called out in both.
    - id: PDV-2
      what: >-
        `blind_rederivation.required` IS TRUE, assigned to the Red Team, with a blind_from that
        names the sealed prior, the sibling's review directory, and the producer's new module
        and test file -- AND DELIBERATELY DOES NOT NAME THE PRODUCER'S TASK DIRECTORY OR ITS
        EXECUTION REPORT. This narrows the Red Team's committed read_scope for two named files.
