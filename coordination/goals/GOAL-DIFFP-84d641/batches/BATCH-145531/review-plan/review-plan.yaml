      statement: >-
        ATTACK THE WORD PROVABLY. THE LOAD-BEARING JOINT OF THIS ROUND. This is the first
        batch of this goal to claim something theorem-like: that a NOT DETECTED verdict for
        a component is PROVABLY UNDETECTABLE BY ANY FAMILY. Construct an object or a
        population for which a claimed dependency edge, or the class that rests on it, is
        KNOWN FALSE -- and say WHERE IN THE ARGUMENT the survival happens.
      attack_plan: >-
        THE CANDIDATE LIST IS A FLOOR AND NOT A CEILING, AND A BREAK IT DID NOT ANTICIPATE
        IS WORTH MORE THAN ONE IT DID, precisely because the list's author is the one who
        could not see past it. Round 2 measured that the plan's list did NOT bound the pass:
        three of that round's objects were none of them on it and one lay outside the class
        the contract's lattice could express.
        FLOOR, EACH ITEM A CONCRETE THING TO BUILD OR TO ARGUE FROM THE COMMITTED SOURCE.
        (i) A WELL-FORMED SHA-1 OBJECT AT A STEP RANGE OTHER THAN THE FULL ONE. The
        producer's own derivation carries the scope limit that the flag is computed from the
        full expansion while the serialised value is the step-range slice, and that the two
        coincide only at full step range -- which is where every planted entry of this
        census sits. If the two can be made to disagree on a well-formed object, the edge is
        a fact about this census and not about the key.
        (ii) AN OBJECT WHOSE FLAG WAS CARRIED OVER RATHER THAN RECOMPUTED. The producer
        names two equivalence generators that carry the flag rather than recomputing it from
        the transformed difference, and states that the derivation covers their images only
        because the well-formedness check was MEASURED on them. Attack the gap between
        measured-on-this-census and true-of-the-class.
        (iii) A WELL-FORMED SHA-1 OBJECT OUTSIDE THE LINEARIZED CODE, which this census
        contains none of. Determine whether the edge and the class survive its presence.
        (iv) A POPULATION AT WHICH THE WITNESS IS VACUOUS -- too few distinct values on the
        determining side for the constancy test to have been able to fail.
        (v) THE CONVERSE DIRECTION, WHICH IS CHEAPER THAN ALL OF THE ABOVE AND MAY BE THE
        FASTEST BREAK: the class is assigned when a component the row RETAINS determines the
        deleted one. Check whether it is ALSO assigned anywhere on the ground that the
        deleted component is not in that primitive's key at all -- and if it is, decide
        whether "deleting a component that was never there" is the same claim as "provably
        undetectable by any family" or a different claim wearing the same class name.
        FOR WHATEVER YOU BUILD: run the batch's argument UNCHANGED against it, report the
        exact construction, the measured outcome, and the STEP of the argument at which the
        survival happens. "The argument looks fine" is not an answer to this joint. "No
        object was found within budget, and here is what was tried" IS an answer, and it is a
        BOUNDED NEGATIVE and never a proof that none exists.
        PRESERVE THE NARROWEST VALID CONCLUSION. If your object narrows the class rather than
        destroying it, say exactly what survives -- a theorem about which population, at
        which step range, under which gate -- rather than reporting a break that takes more
        with it than it earned.
      breaking_artifact: >-
        A constructed object or population, its exact construction, its measured behaviour
        under the committed serialiser and the committed gate, and the step of the argument
        at which the survival happens; or an explicit bounded negative with what was tried.
        BUILD ADVERSARIAL INSTRUMENTS AS A RUN-TIME PROJECTION OR WRAPPER AND NEVER AS AN
        EDIT TO A COMMITTED FILE UNDER harness/ -- a modification would invalidate the
        producer's package as well as your own finding.

    - id: R3-J6
      joint: R3-J6
      alias: R-b
      assigned_to: TASK-20260824-7d9f92
      statement: >-
        ANSWER J8, J11 AND J13 FROM BATCH-efcae7's NUMBERING RATHER THAN RESTATING THEM.
        All three BROKE in round 2. GOAL-DIFFP-84d641's goal head, restriction (4), requires
        that they be ANSWERED and states that a later round which simply omits them would not
        meet completion criterion 4 and that any close reading it that way would be
        manufacturing an admission. THIS JOINT IS WHERE THIS ROUND MEETS THAT REQUIREMENT OR
        FAILS TO.
      attack_plan: >-
        J8 -- THE PROVES-TOO-MUCH BREAK. Round 2 established that instruments whose
        conclusion is known false pass the strengthened suite. This batch discharges RC-1 by
        RE-SCORING the detection rule in a new module, never by editing the committed one.
        DETERMINE, FROM THE RE-SCORED RESULT AND FROM THE COMMITTED CONSTRUCTIONS, WHETHER
        THE REFOLD ACTUALLY CLOSES J8 FOR THE ONE INSTRUMENT IT WAS BUILT AGAINST, AND
        WHETHER IT LEAVES THE OTHERS EXACTLY AS THEY WERE. Then answer the question that
        outranks both: DOES CATCHING ONE KNOWN-FALSE INSTRUMENT WITH A RULE WRITTEN AFTER
        THAT INSTRUMENT WAS EXHIBITED CLOSE J8, OR NARROW IT? The committed rule is not
        changed by this batch and the package says so; decide what the re-scoring is evidence
        OF, and state J8's answer as HOLDS, BREAKS or NARROWED with the object list that
        remains.
        J13 -- POWER RESULT OR RESTATEMENT OF THE CONSTRUCTION. Round 2's J13 asked whether a
        control that detects exactly the component it perturbs measures anything beyond its
        own construction. THIS BATCH'S DESIGN ANSWER IS TO EXCLUDE THE DIAGONAL CELLS
        ALTOGETHER, ON A RULE NAMED AFTER J13. DECIDE WHETHER EXCLUDING THE CELLS ANSWERS THE
        QUESTION OR RELOCATES IT. Concretely: if the diagonal is excluded because it is
        detected by construction, is the off-diagonal remainder measuring the instrument, or
        is it measuring which off-diagonal families could be constructed at all? And is the
        answer different on the two primitives -- a split IS the finding if it exists, and the
        close needs it stated as the mixed thing it is rather than rounded to either end.
        J11 -- THE ISOLATING SUB-ARM. Round 2's finding was that the isolating sub-arm binds
        nothing the verdicts depend on. DETERMINE WHETHER ANYTHING IN THIS PACKAGE CHANGES
        IT. The probing profile now distinguishes two quantifiers that CORR-20260824-c1c8b1
        separated -- a draw that isolates a component against SOME census entry, and a draw
        that differs from ITS OWN SOURCE entry -- and one row's class turns on the first.
        Decide whether that distinction rehabilitates the sub-arm, leaves it exactly where
        round 2 left it, or makes it worse by resting a class on a quantifier the committed
        attribution function was never documented to compute.
        REPORT ALL THREE SEPARATELY, EACH WITH ITS OWN VERDICT AND ITS OWN MEASUREMENT.
        Silence on any one of the three does not satisfy this joint and may not be read as an
        admission by the close. IF THE BUDGET BINDS BEFORE YOU REACH ONE, REPORT IT AS NOT
        REACHED WITH WHAT YOU TRIED -- that is an honest bounded gap and the close records it
        as one; a dropped joint is not.
      breaking_artifact: >-
        For each of the three, an explicit answer with the artifact it rests on: the
        instruments the refold does and does not catch and what that licenses; a
        determination of whether the diagonal exclusion answers or relocates the restatement
        question, with the per-primitive split if there is one; and a determination of
        whether the isolating sub-arm now binds anything a verdict depends on.

    - id: R3-J7
      joint: R3-J7
      alias: R-c
      assigned_to: TASK-20260824-7d9f92
      statement: >-
        THE CLOSURE ATTACK AND THE STRUCTURAL CLAIM. Premature closure is a failure mode
        SYMMETRIC WITH OVERCLAIMING (docs/inventor-protocol.md), so attack the closure as
        hard as the claim. Is any lane being quietly closed by a fatigue report wearing a
        number? And, from the graph alone, does the structural claim about how much a SHA-1
        membership key actually carries on in-code objects hold, and with what scope?
      attack_plan: >-
        FIRST THE STRUCTURAL CLAIM, BECAUSE IT IS THE ONE PIECE OF THIS BATCH WITH A
        DOWNSTREAM CONSUMER. The package argues from the committed source that on an object
        whose flag is true the whole message-difference value is the expansion of its own
        first sixteen words, and therefore that the SHA-1 membership key restricted to
        in-code objects carries far less than its serialised width suggests. CONFIRM OR
        REFUTE THAT FROM THE COMMITTED SOURCE YOURSELF, and state the scope it survives at.
        Then push on the boundary the package itself draws: on a flag-false object the first
        sixteen words determine nothing about the rest, so the restriction is not injective
        on arbitrary keys. DECIDE WHETHER THE CLAIM AS OFFERED TO GOAL-SHA1-001 CARRIES THAT
        SCOPE EVERYWHERE IT APPEARS OR ONLY IN THE BLOCK THAT QUALIFIES IT.
        THEN GO AFTER EACH CLOSURE CANDIDATE BY NAME.
        THE MD5 LANE, which AMD-20260824-DIFFP-ACQ-1 holds BLOCKED and explicitly NOT CLOSED
        with a named unblocking route through a GOAL-MD5-001 decision -- does any record of
        this batch state or imply it is exhausted, deprioritised on the merits, or screened
        out? Quote the sentence if there is one.
        DEPTH GREATER THAN OR EQUAL TO 2, where the batch's own framing is that the lattice
        is BOUGHT BY ARGUMENT rather than by compute. The non-breaking subsets are not
        measured, and some of them are ALREADY MEASURED to hide a known-false instrument.
        DETERMINE WHETHER "BOUGHT BY ARGUMENT" IS BEING ALLOWED TO DRIFT INTO "COVERED"
        anywhere in the package, and say what the honest sentence is. THIS CANDIDATE IS NAMED
        FIRST AMONG THE CLOSURE CANDIDATES BECAUSE THE DISTANCE BETWEEN THOSE TWO PHRASINGS IS
        ONE CARELESS SENTENCE IN A CLOSE THAT HAS NOT BEEN WRITTEN YET, and for no other
        reason; the ordering is not a prediction about what you will find.
        PERMISSIVE MODE, declared out of scope and emitted as null rather than as zero. THE
        SECOND SEED SET. NULL FAMILY (e), whose precondition this batch builds and which it
        deliberately does not execute -- is it preserved as an open direction with a concrete
        revisit condition, or quietly retired by having its gate built? THE UNREPLICATED
        SURVIVORS, built once by one session and re-executed here from the SAME committed
        construction file, which is a re-execution and not an independent construction.
        AND THE ONE CLOSURE CANDIDATE THAT IS THIS COORDINATOR'S RATHER THAN THE PRODUCER'S:
        THE JOINT CUT ITSELF. This round cut thirteen joints to eight and declared what the
        cut loses. Decide whether the cut removed the attack surface on which round 2's most
        valuable objects were actually found, and if so say so plainly -- a finding against
        this plan is in scope for this joint and is not a courtesy.
      breaking_artifact: >-
        A quoted sentence from a committed batch artifact that closes more than its
        measurement supports, with the measurement that bounds it; or a refutation of the
        structural claim from the committed source; or a demonstration that a named open
        direction has been retired in substance while being described as open.

    - id: R3-J8
      joint: R3-J8
      alias: R-d
      assigned_to: TASK-20260824-7d9f92
      statement: >-
        WHAT WOULD MAKE THE DIFFERING-CELL COUNT MEANINGLESS? Is it a diagnostic or is it
        being used as a decision variable? Does the null-object control show that THE
        COUNTING RULE can be large, or that THE FAMILY SET can produce a large one -- which
        are different things? Name the cheapest control that separates them, and exhibit at
        least one object this contract's author did not imagine.
      attack_plan: >-
        THE COUNT IS THIS ROUND'S BLINDED QUANTITY AND IT IS ALSO THE QUANTITY YOU ARE ASKED
        TO RE-DERIVE INDEPENDENTLY -- see `blind_rederivation` below, which is assigned to
        you and whose blind_from list you must respect and attest to.
        START WITH THE DEGENERATE INSTRUMENTS AS OBJECTS RATHER THAN AS CONTROLS. Two were
        run through the identical counting rule. ASK OF EACH: what does its differing-cell
        count tell you about it that its plant control does not already tell you, and what
        does the plant control tell you that the differing-cell count cannot? IF THERE IS AN
        INSTRUMENT WHOSE CONCLUSION IS PLAINLY KNOWN FALSE AND WHOSE DIFFERING-CELL COUNT IS
        INDISTINGUISHABLE FROM THE HONEST INSTRUMENT'S, THAT IS THE WHOLE ANSWER TO THIS
        JOINT AND YOU SHOULD SAY SO IN ONE SENTENCE AND THEN SPEND YOUR BUDGET ELSEWHERE.
        Both directions are live and neither is assumed here.
        THEN SEPARATE THE TWO CAPACITIES. A control that makes every cell flip by
        construction demonstrates that the counting code can emit a large number. It does
        not demonstrate that any REAL instrument, honest or known-false, could be told apart
        by these particular cells built from these particular families. NAME THE CHEAPEST
        CONTROL THAT SEPARATES THOSE TWO -- state it concretely enough to be budgeted: what
        it constructs, what it adjudicates, what outcome would mean artifact and what would
        mean power.
        THEN CHECK WHETHER THE COUNT IS BEING USED AS A DECISION VARIABLE ANYWHERE. Not in
        the producer's report, which composes no verdict by rule, but in what the count is
        SET UP to license: the batch's opening argues that this count is an integer-valued
        two-outcome discriminator. IF IT IS NOT ONE, SAY WHAT IT IS AND WHAT SHOULD REPLACE
        IT.
        FINALLY, THE PART THE PLAN CANNOT SUPPLY. EXHIBIT AT LEAST ONE OBJECT OUTSIDE
        EVERYTHING NAMED IN THIS PLAN. Round 2 measured that the plan's candidate list did
        not bound the pass, and the object you exhibit matters more than the control you
        name, because the object is the part no contract author could have written down.
      breaking_artifact: >-
        A named, budgetable control with its two distinguishable outcomes; a demonstration
        that the count either can or cannot separate a known-false instrument from the honest
        one, with the objects that show it; and at least one object outside this plan's
        declared sets.

