  # =====================================================================
  how_this_round_will_be_composed:
    by: TASK-20260824-5eafa3
    rule: >-
      COMPLETION CRITERION 4 IS REACHABLE BY THIS SHAPE AND IS NOT MET BY IT. It requires that
      BOTH independent sessions ADMIT the package. That is the close's determination on the
      reports it ACTUALLY RECEIVES; it is never read off the presence of two task ids in a
      queue, and A `breaks` ON A JOINT A REVIEWER OWNS IS NOT AN ADMISSION ON THAT JOINT.
      IT ADDITIONALLY REQUIRES, BY GOAL RESTRICTION (4), THAT J8, J11 AND J13 BE ANSWERED.
      R3-J6 is where that happens. Silence on any of the three does not satisfy it and a close
      that reads silence as an admission would be manufacturing one.
    claim_ceiling: >-
      `analyzed`, NEVER `supported`, REGARDLESS OF WHAT THE REPORTS SAY. Three of the four
      supported-promotion gates are structurally unmet by a batch of this kind -- there is no
      asymptotic claim, no proof decomposition, no numbered heuristics with validation evidence
      and no concrete-cost table -- and the fourth is not attempted. TWO INDEPENDENT REVIEWERS
      DO NOT RAISE A CEILING SET BY THAT, and neither does an evidence strength of
      `replicated`, which describes how many implementations produced a number and never what
      the number means.
    what_a_break_on_R3_J5_or_R3_J6_would_mean: >-
      A break on either does NOT make the package invalid and does NOT make the measurements
      wrong. It narrows what the measurements license. The close would then state the narrowest
      statement the runs support -- scoped to the tested primitives, seeds, families, matrix
      cells, census and budget -- and record the unsupported reading as explicitly not
      supported, with the object that broke it. THAT IS THE SHAPE OF THIS GOAL'S LAST TWO
      ROUNDS AND IT IS A RESULT EACH TIME.
    infrastructure_versus_evidence: >-
      A TIMEOUT, A CRASH, AN ENVIRONMENT FAILURE OR AN IMPLEMENTATION FAILURE IN A REVIEWER'S
      OWN RE-RUN OR CONSTRUCTION IS INFRASTRUCTURE SIGNAL ABOUT THAT SESSION, never a negative
      finding against the producer and never a mathematical result. Report it as such and say
      what remained unverified or unattacked.

