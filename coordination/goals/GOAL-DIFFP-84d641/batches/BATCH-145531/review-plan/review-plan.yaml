      dispatch_queue.json narrows each reviewer's read_scope so that it does NOT contain the
      BATCH-145531 root, because that directory contains the sibling's reviews subdirectory,
      and so that it does not contain the goal directory, because THAT is where the sealed
      prior lives. Blindness here is a DECLARED BOUNDARY and not only an instruction.
      BATCH-efcae7 IS IN SCOPE WHOLE FOR BOTH, ON PURPOSE AND NECESSARILY: it is a CLOSED
      batch whose reviews are already composed into EV-DIFFP-b16b01 and DEC-20260824-c5bb72,
      so reading them is expected and is not a blindness violation for this round. For the Red
      Team it is required -- R3-J5 and R3-J6 cannot be discharged without it.
    the_residual_stated_rather_than_claimed_away: >-
      THE SEALED PRIOR IS COMMITTED IN THE SAME REPOSITORY THE REVIEWERS WORK IN, so a
      reviewer who went looking outside its declared read scope could find it. That is a
      boundary and not a cage, and it is the same boundary every read_scope in this program
      is. FURTHER, THE CHECKER'S LEAK TEST COVERS THE RE-DERIVER ONLY -- it is not run against
      the other reviewer's sources_read at all -- so the Validator's compliance with the seal
      rests on its own declared `read_sealed_prior: false` and on its sources_read being
