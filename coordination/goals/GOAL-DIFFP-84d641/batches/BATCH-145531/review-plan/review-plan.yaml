        The full text of the reasoning is in `blind_rederivation` above and is not repeated. In
        one line: the producer's report states the quantity as the contract requires it to, and
        every reviewer must read that report, so naming it in blind_from would guarantee either
        a spurious checker FAIL or a dishonest sources_read. Round 2 responded to the same
        structural fact by setting `required: false` and losing every mechanical property;
