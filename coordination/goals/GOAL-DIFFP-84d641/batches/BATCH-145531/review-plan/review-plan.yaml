    commit_discipline_binding_on_the_reviewers_themselves: >-
      YOU DO NOT COMMIT YOUR OWN REPORT (BR-11). Leave it untracked at your declared write
      scope; the ledger archive TASK-20260824-5eafa3 commits it. This resolves, IN YOUR ROLE
      CONTRACT'S FAVOUR AND AT OPENING, the conflict both round-2 reviewers faced between their
      role contract and their task card, so that you do not have to choose. The task cards of
      this batch were amended to match; no card or handoff of this batch instructs otherwise.
    blind_from:
