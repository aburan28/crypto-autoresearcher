  joints_owned_note: >-
    COPY THOSE FOUR STRINGS EXACTLY, INCLUDING THE R3- PREFIX. tools/check_review_independence.py
    matches the plan's `joint` value against your `joints_owned` by EXACT STRING EQUALITY, so
    writing J1 instead of R3-J1 produces a spurious failure against a review that did nothing
    wrong. The prefix exists because round 2's joints J1..J13 are committed and immutable and
    this goal is required to demonstrate that three of THOSE joints were answered this round.

  joints:

    - id: R3-J1
      alias: V-a
      statement: >-
        REPRODUCTION, FROZEN IDENTITY AND RUN REGISTRATION. Every deterministic quantity the
        package reports is what the committed code produces from the declared seeds in a
        fresh process, to EXACT INTEGER agreement; the frozen-identity criterion set is
        complete and excludes only this contract's own required new artifacts; and the
        producer's run directories under experiments/EXP-DIFFP-04082e/runs/ are in fact
        DISCOVERED by tools/validate_ledger.py and ACCEPTED by check_run -- the measurement
        DEC-20260824-c5bb72 explicitly refused to guess at, taken here on NEW runs where
        nothing immutable is at stake.
      attack_plan: >-
        COLD-RE-RUN THE DETERMINISTIC OUTPUTS IN A FRESH PROCESS from the seeds declared in
        EXP-DIFFP-04082e `inputs.seeds`, and report the exact-agreement count AS AN INTEGER
        FRACTION with every disagreement listed by name and BOTH values side by side. Verify
        that the seeds used in every run manifest are exactly the declared eight and no
        other, that no ninth seed exists anywhere, and that no undeclared run directory
        exists beyond those the run index carries. Confirm the run index carries a sha256 for
        every file of every executed run and that each matches the tree.
        THEN THE FROZEN IDENTITY. Recompute the digest of every file in the criterion set from
        the tree and compare against the producer's pre-run and post-run sets. RULE EXPLICITLY
        on whether excluding this contract's own new module and new test file from the
        criterion set is the only workable reading of the hard term or an undeclared scoping.
        DEC-20260824-c5bb72 PD-5 records the round-2 instance where a producer had to declare
        exactly this as a deviation, and this contract wrote the exclusion into the criterion
        itself -- decide whether that is the contract fixing a defect or the contract
        legislating around a check.
        THEN THE PART THAT MAY BE THE REAL CONTENT OF THIS JOINT AND IS NOT REPRODUCTION. Run
        tools/validate_ledger.py yourself and RECORD ITS OUTPUT VERBATIM EITHER WAY. Then look
        at what the manifests SAY about the inference that produced them. The producer
        discloses that the shared wrapper defines its inference block twice at module level so
        the later definition wins, that every manifest this repository writes therefore
        carries a requested_policy that is not this task's, and that it wrote a
        manifest-supplement.yaml beside every manifest rather than editing the wrapper, which
        the contract's IR-2 forbids. DECIDE WHETHER A SUPPLEMENT BESIDE AN INCORRECT MANIFEST
        IS SCHEMA-COMPLETENESS OR A SECOND SOURCE OF TRUTH, and say which the close should
        treat as binding.
        FINALLY DEV-5, where the repository HEAD advanced during the producer's task. Verify
        from the manifests that all five runs pin the same revision and the same content
        hashes, and that the module now archived IS the one the manifests pin. That is an
        integrity question and not a research one.
      breaking_artifact: >-
        A named quantity where your cold re-run and the package disagree, with both integers;
        or a manifest seed outside the declared eight; or an undeclared run directory; or a
        criterion file whose digest differs from the producer's; or a validator run reporting
        a new violation; or an archived module whose digest differs from the pinned executed
        source. EVERY ONE OF THOSE IS INFRASTRUCTURE SIGNAL AND A STOP FOR THIS BATCH'S
        COMPARISONS, and none is a mathematical result in either direction.

    - id: R3-J2
      alias: V-b
      statement: >-
        IS THE GRAPH WHAT THE COMMITTED CODE PRODUCES, AND IS EVERY EDGE LABELLED AT THE
        STRENGTH IT ACTUALLY HAS? For every claimed edge the written derivation says what the
        committed serialiser and its callers do; every derivation-less edge is labelled
        `empirical_only` and the words theorem, provable, provably and impossible appear
        nowhere against one (hard term H-1); no partition class rests on an `empirical_only`
        edge; and the null-object control genuinely returns NO EDGE where the dependency is
        absent rather than for a reason that would hold whatever the detector did.
      attack_plan: >-
        FOR EACH EDGE THE PACKAGE REPORTS AS CARRYING BOTH A DERIVATION AND A WITNESS, READ
        THE COMMITTED SOURCE THE DERIVATION CITES AND RULE, EDGE BY EDGE, WHETHER THE
        DERIVATION SAYS WHAT THE CODE DOES. DO NOT RULE ON THE PROSE. Follow each cited
        function -- the serialiser, the planting constructor, the equivalence generator
        actions, the perturbation constructors -- and check that EVERY constructor which can
        reach the declared population preserves the claimed relation, not merely the ones the
        derivation names. AN OMITTED CONSTRUCTOR IS THE CHEAPEST WAY FOR A DERIVATION TO BE
        TRUE OF ITS OWN EXAMPLES AND FALSE OF THE POPULATION.
        RECOMPUTE EVERY WITNESS with its population size, its distinct-X count and its
        groups-constant count, and check the two degenerate ways this detector can report an
        edge for nothing: a pair whose groups are ALL SINGLETONS, and a pair whose Y takes a
        SINGLE VALUE on the whole declared population. The package emits diagnostics for both
        and states that neither changes a verdict. DECIDE WHETHER THAT IS THE RIGHT CHOICE.
        THE QUESTION IS NAMED EXPLICITLY SO IT IS NOT SKIPPED FOR COST, AND IT IS PUT WITHOUT
        A PREFERRED ANSWER: an EDGE reported on a constant
        column is a true statement of the constancy rule and is not a dependency, and a reader
        who counts edges will count it. If you conclude a third label is owed, say so and name
        it; if you conclude two labels plus diagnostics suffice, say why the diagnostics carry
        the weight.
        THEN THE NULL-OBJECT CONTROL FOR THE DETECTOR. Exercise it yourself on a population
        where the dependency is absent and confirm it returns NO EDGE for pairs it should.
        Then attack the control's own escape hatch: the producer declares a deviation (DEV-1)
        that the control's literal known answer is UNREACHABLE by any implementation, because
        the well-formedness gate the same control mandates FORCES some of those very pairs,
        and it reports a second quantity restricted to a pre-declared forced set. VERIFY FROM
        THE MODULE SOURCE THAT THE FORCED SET WAS GENUINELY ENUMERATED IN ADVANCE AND WAS NOT
        WIDENED AFTER THE DATA WAS SEEN, and rule on whether DEV-1 is the specification error
        it is classified as, an in-run repair forbidden by IR-6, or a defect in the contract.
        A FORCED-SET EXEMPTION CHOSEN AFTER THE NUMBERS ARE IN WOULD BE THE WHOLE CONTROL.
        FINALLY THE WELL-FORMEDNESS GATE ITSELF, which is a precondition for the whole third
        stage and whose reject side is what makes its accept side mean anything. Confirm both
        sides independently. Confirm that a family the gate rejects on every draw is reported
        as NOT CONSTRUCTIBLE with a derivation and NEVER as a family that produced zero
        detections -- that distinction is the difference between a measured negative and a
        coverage gap, and this goal has already been burned once by conflating them.
      breaking_artifact: >-
        An object in the declared population that violates a claimed derivation; or a
        derivation that omits a constructor which can reach the population; or an edge
        carrying a word H-1 forbids; or a partition class resting on an `empirical_only` edge;
        or a null population on which the detector cannot return NO EDGE at all; or a
        forced-set entry that was not enumerated before the run.

    - id: R3-J3
      alias: V-c
      statement: >-
        THE PARTITION, ITS ORDER AND ITS PER-PRIMITIVE EVIDENCE. Each row's class FOLLOWS from
        the stated assigning rule applied to the graph and the declared families' own
        declarations; the derived file is genuinely free of the pre-registered verdict column
        it is later compared against; the order claim is stated with its own epistemic limit
        rather than asserted; and every disagreement is reported on BOTH sides with the
        derivation that produced each.
      attack_plan: >-
        TAKE THE ASSIGNING RULE AS WRITTEN AND APPLY IT YOURSELF TO EACH ROW ON EACH PRIMITIVE,
        INDEPENDENTLY, AND WRITE YOUR ANSWER DOWN IN YOUR REPORT BEFORE YOU READ THE
        PRODUCER'S ROW CLASSES -- this is your `independent_derivation_before_reading`
        obligation and it is a declared deliverable. Then compare. Check the rule's PRECEDENCE
        fires in the order declared, and check the row-combination rule that turns two
        per-primitive classes into one row class: it takes the strongest per-primitive class
        in a declared order EXCEPT for one class that requires unanimity, and a combination
        rule is exactly the kind of thing that is stated once and implemented differently.
        CHECK THAT PER-PRIMITIVE EVIDENCE IS EVIDENCE OF THAT PRIMITIVE. For any row assigned
        a class by the isolation test, look at the examples carried under EACH primitive's
        branch and confirm they are draws and census entries OF THAT PRIMITIVE. Confirm every
        example list is consistent with the count printed beside it, and if a list is
        truncated confirm the truncation is DECLARED rather than left to be inferred. This is
        a cheap and mechanical check, named explicitly so it is not skipped for cost; REPORT
        ITS OUTCOME EITHER WAY, INCLUDING WHEN IT PASSES.
        RULE ON THE ORDER CLAIM AND ON ITS DISCLOSED WEAKNESS. The producer states the derived
        file was written and closed before any byte of the compared column was opened, states
        that NO TOOL HERE CAN CHECK READ ORDER, and volunteers that the frozen contract itself
        prints the pre-registered target with its per-row assignment -- so it could not have
        been blind to the TARGET, only to the VERDICT COLUMN. DECIDE WHETHER THAT DISTINCTION
        IS REAL OR COSMETIC. Concretely: could a producer knowing the target but not the
        column have produced this partition by reverse engineering, and does the derived file
        contain anything -- a class, a rule, a precedence, an unused observation -- that a
        reverse-engineering producer would not have written? AN UNUSED OBSERVATION THAT CUTS
        AGAINST THE TARGET IS EVIDENCE OF GOOD FAITH; ONE THAT WOULD HAVE MOVED THE RESULT
        TOWARD THE TARGET IS THE OPPOSITE. Say which you find, and quote it.
        FINALLY, THE DISAGREEING ROW. Where the derived class differs from the pre-registered
        one, verify the derivation on BOTH primitives, and rule on whether the two classes are
        even the same KIND of statement -- one is a coverage statement about declared families
        and the other quantifies over every possible family, and the second is strictly
        stronger. THE PRODUCER DELIBERATELY DOES NOT DECIDE WHICH SIDE IS WRONG and you are
        not asked to decide it as a verdict on the batch either; what you own is whether the
        derivation is sound and whether the disagreement is reported honestly on both sides.
      breaking_artifact: >-
        A row whose class does not follow from the stated rule; or a per-primitive branch
        resting on the other primitive's objects; or an example list inconsistent with its own
        count; or evidence that the derived file is contaminated by the compared column, which
        is a STOP; or an order claim asserted without its limit.

    - id: R3-J4
      alias: V-d
      statement: >-
        THE COUNT'S SCOPE AND ITS DEMONSTRATED CAPACITY TO FAIL. The differing-cell count
        carries its excluded-cell list with every exclusion's reason; each exclusion's forcing
        edge, derivation or construction argument is actually correct; the two degenerate
        instruments were run through the IDENTICAL counting code as the honest one; the reused
        known-false instrument is REUSED faithfully rather than re-expressed; and nothing is
        reported as a fraction, as a pass, as a score or as a margin, or without its primitive
        scope and the census completeness beside it.
      attack_plan: >-
        START WITH THE DENOMINATOR AND NOT WITH THE COUNT. The full matrix is six families by
        six rows; only a subset was adjudicated and every other cell is excluded under one of
        three declared reasons. FOR EACH EXCLUDED CELL, CHECK THAT ITS REASON IS TRUE AND IS
        THE RIGHT KIND OF REASON. For cells excluded because the graph forces them, verify the
        forcing edge exists, carries a derivation, and actually forces THAT cell. For cells
        excluded as NOT CONSTRUCTIBLE, verify against the well-formedness gate that every draw
        of that family really is rejected and that the derivation for why the family's
        declaration cannot be honoured is correct -- THESE ARE THE CELLS A CARELESS INSTRUMENT
        WOULD HAVE EMITTED AS ZEROS AND THEY ARE THE LARGEST EXCLUSION CLASS, so they carry
        the most weight in this joint. For cells excluded as diagonal, verify the exclusion
        rule is the one the contract declares; note that whether that rule ANSWERS the round-2
        restatement question belongs to your sibling and not to you.
        THEN THE CAPACITY TO FAIL. Hard term H-6 says that if the two degenerate instruments
        do not produce their predicted extremes, the counting rule is broken and NO
        differing-cell count may be reported at all. EXERCISE BOTH DEGENERATE INSTRUMENTS
        YOURSELF THROUGH THE COUNTING RULE, and confirm FROM THE CODE and not from the report
        that the honest arm and the degenerate arms go through THE IDENTICAL CODE PATH with
        only the verdict function changed. A counting rule that special-cases a degenerate
        instrument anywhere would be manufacturing its own known answer.
        THEN THE ARM THE PRODUCER ITSELF CALLS VACUOUS. One degenerate instrument's predicted
        extreme is attained for a reason that has nothing to do with the counting rule's
        capacity in that direction, and the producer says so plainly and points at the
        planted-positive control instead. DECIDE WHETHER REPORTING THAT ARM'S PREDICTED
        EXTREME AS MET IS HONEST BOOKKEEPING OR A KNOWN ANSWER THAT CANNOT FAIL, and say what
        that arm would have to be replaced by to carry weight.
        FINALLY THE REUSE. IR-11 requires the known-false instrument to be imported from
        TASK-20260824-e9d21a's committed constructions file and not rebuilt. Confirm the
        import is from the committed file, confirm no re-expression of it exists in the new
        module, and confirm the independent re-derivation of the committed integers agrees. If
        the module MIRRORS any committed draw loop rather than calling it, confirm the
        mirror's self-check reproduces the committed per-cell draw counts exactly -- a mirror
        that drifts by one draw would move every count downstream of it.
      breaking_artifact: >-
        An exclusion whose reason is wrong, above all a NOT CONSTRUCTIBLE cell that is in fact
        constructible, which puts a cell back into the adjudicated set and changes the
        denominator the count is read against; or a degenerate instrument that does not go
        through the identical counting code; or a re-expression of the reused instrument; or a
        mirrored draw loop whose counts differ from the committed ones; or any figure reported
        as a fraction, a pass, a margin, or without its primitive scope and census
        completeness.

