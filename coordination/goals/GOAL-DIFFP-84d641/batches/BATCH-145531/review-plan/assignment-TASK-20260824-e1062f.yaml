    WHERE YOU COME CLOSEST -- THE PARTITION -- THE SPLIT IS EXPLICIT AND IS NOT NEGOTIABLE:
    YOU check whether each row's assigned class FOLLOWS from the stated rule and the graph;
    your sibling checks whether the CLASS SYSTEM ITSELF was chosen to fit an answer already
    known. Both are needed and neither is the other's.
    ON THE COUNT: YOU own whether it is scoped to exactly the cells it adjudicated and
