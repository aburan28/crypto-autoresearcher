  joints_owned_note: >-
    COPY THOSE FOUR STRINGS EXACTLY, INCLUDING THE R3- PREFIX.
    tools/check_review_independence.py matches the plan's `joint` value against your
    `joints_owned` by EXACT STRING EQUALITY, so writing J5 instead of R3-J5 produces a
    spurious failure against a review that did nothing wrong. THE PREFIX EXISTS BECAUSE OF
    YOUR OWN R3-J6: round 2's joints J1..J13 are committed and immutable, and this goal is
    required to demonstrate that J8, J11 and J13 -- in THAT numbering -- were answered this
    round. Bare ids meaning two different things would make that mapping ambiguous in the very
    record that has to carry it.

  joints:

    - id: R3-J5
      alias: R-a
      statement: >-
        ATTACK THE WORD PROVABLY. THE LOAD-BEARING JOINT OF THIS ROUND. This is the first
        batch of this goal to claim something theorem-like: that a NOT DETECTED verdict for a
        key component is PROVABLY UNDETECTABLE BY ANY FAMILY, on the ground that a component
        the row RETAINS determines the deleted one by an edge carrying a derivation from
        committed source. CONSTRUCT AN OBJECT OR A POPULATION FOR WHICH THAT CLAIM, OR AN EDGE
        IT RESTS ON, IS KNOWN FALSE -- and say WHERE IN THE ARGUMENT the survival happens.
      attack_plan: >-
        THE CANDIDATE LIST IS A FLOOR AND NOT A CEILING. Each item below is a concrete thing
        to build or to argue from the committed source.
        (i) A WELL-FORMED SHA-1 OBJECT AT A STEP RANGE OTHER THAN THE FULL ONE. The producer's
        own derivation carries the scope limit that the flag is computed from the FULL
        expansion while the serialised message difference is the STEP-RANGE SLICE, and that the
        two coincide only at full step range -- which is where every planted entry of this
        census sits. If the two can be made to disagree on an object the well-formedness gate
        accepts, the edge is a fact about this census and not about the key.
        (ii) AN OBJECT WHOSE FLAG WAS CARRIED OVER RATHER THAN RECOMPUTED. The producer names
        two equivalence generators that CARRY the flag rather than recomputing it from the
        transformed difference, and states that the derivation covers their images only because
        the gate check was MEASURED on them rather than assumed. ATTACK THE GAP BETWEEN
        MEASURED-ON-THIS-CENSUS AND TRUE-OF-THE-CLASS. If the flag is a fact about how this
        program BUILDS objects rather than a function of the object's own serialised
        difference, then the word provably is doing work that "verified on these objects"
        would do more honestly.
        (iii) A WELL-FORMED SHA-1 OBJECT OUTSIDE THE LINEARIZED CODE. THIS CENSUS CONTAINS
        NONE, which is stated in the committed scope of the predecessor batch's evidence
        record, so every measurement of that edge is taken where one side of the predicate is
        constant. Determine whether the edge and the class survive such an object's presence.
        (iv) A POPULATION AT WHICH THE WITNESS IS VACUOUS -- too few distinct values on the
        determining side for the constancy test to have been able to fail at all.
        (v) THE CONVERSE DIRECTION, WHICH IS CHEAPER THAN ALL OF THE ABOVE AND MAY BE THE
        FASTEST BREAK. The class is assigned when a RETAINED component determines the deleted
        one. Check whether it is ALSO assigned anywhere on the different ground that the
        deleted component is not in that primitive's key at all -- and if it is, decide whether
        "deleting a component that was never there" is the same claim as "provably undetectable
        by any family", or a different and much weaker claim wearing the same class name. A
        class name covering two different arguments is exactly the kind of conflation that
        leaves every integer correct and the headline empty.
        FOR WHATEVER YOU BUILD: RUN THE BATCH'S ARGUMENT UNCHANGED AGAINST IT, and report the
        exact construction, the measured outcome, and the STEP of the argument at which the
        survival happens. "The argument looks fine" is NOT an answer to this joint. "No object
        was found within budget, and here is what was tried" IS an answer, and it is a BOUNDED
        NEGATIVE and never a proof that none exists.
        PRESERVE THE NARROWEST VALID CONCLUSION. If your object NARROWS the class rather than
        destroying it, say exactly what survives -- a theorem about which population, at which
        step range, under which gate -- rather than reporting a break that takes more with it
        than it earned. DO NOT CALL A BOUNDED FAILURE AN IMPOSSIBILITY RESULT and do not reject
        a result merely because it is surprising.
      breaking_artifact: >-
        A constructed object or population, its exact construction, its measured behaviour
        under the committed serialiser and the committed gate, and the step of the argument at
        which the survival happens; or an explicit bounded negative with what was tried.
      how_to_build_it: >-
        AS A RUN-TIME PROJECTION OR WRAPPER, AND NEVER AS AN EDIT TO A COMMITTED FILE UNDER
        harness/. Say which mechanism you used. The frozen-identity control would detect a
        modification and it would invalidate the producer's package as well as your own
        finding.

    - id: R3-J6
      alias: R-b
      statement: >-
        ANSWER J8, J11 AND J13 FROM BATCH-efcae7's NUMBERING RATHER THAN RESTATING THEM. All
        three BROKE in round 2. GOAL-DIFFP-84d641's goal head, restriction (4), requires that
        they be ANSWERED, and states in terms that a later round which simply omits them would
        not meet completion criterion 4 and that any close reading it that way would be
        MANUFACTURING AN ADMISSION. THIS JOINT IS WHERE THIS ROUND MEETS THAT REQUIREMENT OR
        FAILS TO, and only an adversary can answer J8 and J13, which is why they are yours.
      attack_plan: >-
        J8 -- THE PROVES-TOO-MUCH BREAK. Round 2 established that instruments whose conclusion
        is known false pass the strengthened suite. This batch discharges RC-1 by RE-SCORING
        the detection rule in a NEW module and never by editing the committed one, and reports
        the committed rule's own verdicts unchanged beside the re-scored ones. DETERMINE, FROM
        THE RE-SCORED RESULT AND FROM THE COMMITTED CONSTRUCTIONS OF TASK-20260824-e9d21a,
        WHETHER THE REFOLD ACTUALLY CLOSES J8 FOR THE ONE INSTRUMENT IT WAS BUILT AGAINST AND
        WHETHER IT LEAVES THE OTHERS EXACTLY AS THEY WERE. Then answer the question that
        outranks both: DOES CATCHING ONE KNOWN-FALSE INSTRUMENT WITH A RULE WRITTEN AFTER THAT
        INSTRUMENT WAS EXHIBITED CLOSE J8, OR NARROW IT? The committed rule is NOT changed by
        this batch and the package says so. Decide what the re-scoring is evidence OF, and
        state J8's answer as HOLDS, BREAKS or NARROWED with the object list that remains.
        J13 -- POWER RESULT OR RESTATEMENT OF THE CONSTRUCTION. Round 2's J13 asked whether a
        control that detects exactly the component it perturbs measures anything beyond its own
        construction, and it BROKE. THIS BATCH'S DESIGN ANSWER IS TO EXCLUDE THE DIAGONAL CELLS
        ALTOGETHER, UNDER AN EXCLUSION RULE NAMED AFTER J13. DECIDE WHETHER EXCLUDING THE CELLS
        ANSWERS THE QUESTION OR RELOCATES IT. Concretely: if the diagonal is excluded because
        it is detected by construction, is the off-diagonal remainder measuring the INSTRUMENT,
        or is it measuring WHICH OFF-DIAGONAL FAMILIES COULD BE CONSTRUCTED AT ALL? And is the
        answer different on the two primitives -- A SPLIT IS THE FINDING IF IT EXISTS, and the
        close needs it stated as the mixed thing it is rather than rounded to either end.
        J11 -- THE ISOLATING SUB-ARM. Round 2's finding was that the isolating sub-arm binds
        nothing the verdicts depend on. DETERMINE WHETHER ANYTHING IN THIS PACKAGE CHANGES IT.
        The probing profile now distinguishes two quantifiers that CORR-20260824-c1c8b1
        separated -- a draw that isolates a component against SOME census entry, and a draw
        that differs from ITS OWN SOURCE entry, possibly among others -- and at least one row's
        class turns on the first. DECIDE WHETHER THAT DISTINCTION REHABILITATES THE SUB-ARM,
        LEAVES IT WHERE ROUND 2 LEFT IT, OR MAKES IT WORSE by resting a class on a quantifier
        the committed attribution function was never documented to compute.
        REPORT ALL THREE SEPARATELY, EACH WITH ITS OWN VERDICT AND ITS OWN MEASUREMENT, AND
        UNDER THEIR ROUND-2 IDS SO THE CLOSE CAN MAP THEM. SILENCE ON ANY ONE OF THE THREE DOES
        NOT SATISFY THIS JOINT AND MAY NOT BE READ AS AN ADMISSION BY THE CLOSE. If the budget
        binds before you reach one, REPORT IT AS NOT REACHED WITH WHAT YOU TRIED -- that is an
        honest bounded gap and the close records it as one; a silently dropped joint is not.
      breaking_artifact: >-
        For each of the three, an explicit answer with the artifact it rests on: which
        instruments the refold does and does not catch and what that licenses; a determination
        of whether the diagonal exclusion answers or relocates the restatement question, with
        the per-primitive split if there is one; and a determination of whether the isolating
        sub-arm now binds anything a verdict depends on.

    - id: R3-J7
      alias: R-c
      statement: >-
        THE CLOSURE ATTACK AND THE STRUCTURAL CLAIM. Premature closure is a failure mode
        SYMMETRIC WITH OVERCLAIMING (docs/inventor-protocol.md), so attack the closure as hard
        as the claim. Is any lane being quietly closed by a fatigue report wearing a number?
        And, from the graph and the committed source alone, does the structural claim about how
        much a SHA-1 membership key actually carries on in-code objects hold, and with what
        scope?
      attack_plan: >-
        FIRST THE STRUCTURAL CLAIM, BECAUSE IT IS THE ONE PIECE OF THIS BATCH WITH A DOWNSTREAM
        CONSUMER AND THEREFORE THE ONE WHOSE SCOPE MATTERS MOST. The package argues from the
        committed source that on an object whose flag is true the whole message-difference
        value is the expansion of its own first sixteen words, and therefore that the SHA-1
        membership key RESTRICTED TO IN-CODE OBJECTS carries far less than its serialised width
        suggests. CONFIRM OR REFUTE THAT YOURSELF FROM THE COMMITTED SOURCE and state the scope
        at which it survives. Then push on the boundary the package itself draws: on a
        flag-false object the first sixteen words determine nothing about the rest, so the
        restriction is not injective on arbitrary SHA-1 keys. DECIDE WHETHER THE CLAIM AS
        OFFERED TO GOAL-SHA1-001 CARRIES THAT SCOPE EVERYWHERE IT APPEARS, OR ONLY IN THE BLOCK
        THAT QUALIFIES IT. An unscoped version of this sentence travelling to another goal is
        the most consequential thing this batch could get wrong.
        THEN GO AFTER EACH CLOSURE CANDIDATE BY NAME.
        THE MD5 LANE, which AMD-20260824-DIFFP-ACQ-1 holds BLOCKED and explicitly NOT CLOSED,
        with a named unblocking route through a GOAL-MD5-001 decision. Does any record of this
        batch state or imply it is exhausted, deprioritised on the merits, or screened out?
        QUOTE THE SENTENCE IF THERE IS ONE.
        DEPTH GREATER THAN OR EQUAL TO 2, where this batch's framing is that the lattice is
        BOUGHT BY ARGUMENT rather than by compute. The non-breaking subsets are not measured,
        and some of them are ALREADY MEASURED to hide a known-false instrument. DETERMINE
        WHETHER "BOUGHT BY ARGUMENT" IS BEING ALLOWED TO DRIFT INTO "COVERED" anywhere in the
        package, and say what the honest sentence is. THIS CANDIDATE IS NAMED FIRST AMONG THE
        CLOSURE CANDIDATES BECAUSE THE DISTANCE BETWEEN THOSE TWO PHRASINGS IS ONE CARELESS
        SENTENCE IN A CLOSE THAT HAS NOT BEEN WRITTEN YET, and for no other reason; the
        ordering is not a prediction about what you will find.
        PERMISSIVE MODE, declared out of scope and emitted as null rather than as zero -- check
        that it is null everywhere in the JSON and not merely in the prose. THE SECOND SEED
        SET. NULL FAMILY (e), whose precondition this batch builds and which it deliberately
        does not execute -- is it preserved as an open direction with a concrete revisit
        condition, or quietly retired by having its gate built? THE UNREPLICATED SURVIVORS,
        built once by one session and RE-EXECUTED here from the SAME committed construction
        file, which is a re-execution and not an independent construction -- does any record
        treat the re-execution as replication?
        AND THE ONE CLOSURE CANDIDATE THAT IS THE COORDINATOR'S RATHER THAN THE PRODUCER'S, IN
        SCOPE ON PURPOSE: THE JOINT CUT ITSELF. This round cut thirteen joints to eight and
        declared at opening what the cut loses. DECIDE WHETHER THE CUT REMOVED THE ATTACK
        SURFACE ON WHICH ROUND 2's MOST VALUABLE OBJECTS WERE ACTUALLY FOUND, and if so SAY SO
        PLAINLY. A finding against this plan and against the Coordinator who wrote it is a
        legitimate output of this joint and is not a courtesy.
      breaking_artifact: >-
        A quoted sentence from a committed batch artifact that closes more than its measurement
        supports, with the measurement that bounds it; or a refutation of the structural claim
        from the committed source; or a demonstration that a named open direction has been
        retired in substance while being described as open.

    - id: R3-J8
      alias: R-d
      statement: >-
        WHAT WOULD MAKE THE DIFFERING-CELL COUNT MEANINGLESS? Is it a diagnostic, or is it
        being used as a decision variable? Does the null-object control show that THE COUNTING
        RULE can be large, or that THE FAMILY SET can produce a large one -- which are
        different things? Name the cheapest control that separates them, and exhibit at least
        one object this contract's author did not imagine.
      attack_plan: >-
        THIS JOINT AND THE BLIND RE-DERIVATION BELOW ARE THE SAME QUANTITY APPROACHED FROM TWO
        SIDES. Do the re-derivation first, write its answer down, and then attack the meaning.
        START WITH THE DEGENERATE INSTRUMENTS AS OBJECTS RATHER THAN AS CONTROLS. Two were run
        through the identical counting rule. ASK OF EACH: what does its differing-cell count
        tell you about it that its planted-positive control does not already tell you, and what
        does the planted-positive control tell you that the differing-cell count cannot? IF
        THERE IS AN INSTRUMENT WHOSE CONCLUSION IS PLAINLY KNOWN FALSE AND WHOSE DIFFERING-CELL
        COUNT IS INDISTINGUISHABLE FROM THE HONEST INSTRUMENT'S, THAT IS THE WHOLE ANSWER TO
        THIS JOINT: say it in one sentence, show the two counts side by side, and spend the
        rest of your budget elsewhere. Both directions are live and this assignment asserts
        neither.
        THEN SEPARATE THE TWO CAPACITIES, WHICH IS THE PART THE PACKAGE CANNOT DO FOR ITSELF. A
        control that makes every cell flip BY CONSTRUCTION demonstrates that the counting CODE
        can emit a large number. It does not demonstrate that any REAL instrument, honest or
        known-false, could be told apart by these particular cells built from these particular
        families. NAME THE CHEAPEST CONTROL THAT SEPARATES THOSE TWO, stated concretely enough
        to be budgeted: what it constructs, what it adjudicates, what outcome would mean
        ARTIFACT and what would mean POWER.
        THEN CHECK WHETHER THE COUNT IS BEING USED AS A DECISION VARIABLE ANYWHERE. Not in the
        producer's report, which composes no verdict by rule, but in what the count is SET UP
        to license: this batch's opening argues that the count is an integer-valued two-outcome
        discriminator. IF IT IS NOT ONE, SAY WHAT IT IS AND WHAT SHOULD REPLACE IT.
        FINALLY, THE PART THIS PLAN CANNOT SUPPLY. EXHIBIT AT LEAST ONE OBJECT OUTSIDE
        EVERYTHING NAMED IN THIS ASSIGNMENT AND IN THE PLAN. The object you exhibit matters more
        than the control you name, because the object is the part no contract author could have
        written down.
      breaking_artifact: >-
        A named, budgetable control with its two distinguishable outcomes; a demonstration that
        the count either can or cannot separate a known-false instrument from the honest one,
        with the objects that show it; and at least one object outside this plan's declared
        sets.

  # =====================================================================
  proves_too_much_control_you_run:
    where_it_lives: >-
      THE FULL CONTROL IS IN THE COMMITTED PLAN AT `proves_too_much`, WITH ITS TOP-LEVEL
      failure_signature ROLL-UP (BR-4) AND SEVEN OBJECTS O-P1..O-P7, EACH PAIRED WITH THE
      ARGUMENT IT MUST BE RUN AGAINST AND EACH CARRYING ITS OWN failure_signature. It is not
      duplicated here so that there is exactly one authoritative text of it.
    what_you_must_return_for_it: >-
      FOR EVERY OBJECT: either the argument SURVIVED it, with the object named, the STEP at
      which the survival happens, and that step's measurement; or the argument REFUSED it, with
      the part of the package that did the refusing and the measurement that refused it. A
      REPORT THAT NEITHER SURVIVES NOR REFUSES HAS NOT RUN THE CONTROL. An explicit "not
      reached within budget, and here is what was tried" is an acceptable outcome for an
      individual object and is a bounded negative, never an impossibility result.
    O_P7_is_reserved_for_you: >-
      The seventh object is RESERVED, deliberately and by name, for the object this plan's
      author did not imagine. If you exhibit one, say which of the two arguments it bears on,
      and the close is instructed to present it as THIS PLAN'S LIMIT rather than as this plan's
      success.

  # =====================================================================
  blind_rederivation_you_are_the_re_deriver:
    required: true
    quantity: >-
      THE DIFFERING-CELL COUNT, TOGETHER WITH THE PARTITION OF THE FULL FAMILY-BY-ROW MATRIX
      INTO ADJUDICATED AND EXCLUDED CELLS THAT THE COUNT IS READ AGAINST. Stated as you must
      start from it, with no value attached: for the complete matrix of the declared perturbing
      families against the depth-1 single-deletion rows of the strict membership key, determine
      which cells are adjudicable at all and which are excluded and under which declared
      exclusion reason; then, over the adjudicable cells, determine the NUMBER OF CELLS on
      which the honest instrument and the reused per-primitive-blind known-false instrument
      give DIFFERENT cell verdicts under the contract's counting rule.
    parameters: >-
      The eight seeds frozen in EXP-DIFFP-04082e `inputs.seeds`; the census built by the
      committed builder at the two declared planted-path seeds; the committed adjudicator, the
      committed strict generator set and the committed orbit minimisation, with the row's
      deletion applied as a projection INSIDE the minimisation; strict mode only, permissive
      out of scope; and the cell verdict rule as the contract states it -- a cell is DETECTED
      for an instrument if and only if at least one perturbed draw at k greater than or equal
      to 1 is a strict member under that instrument's projection composed with the row's
      deletion. The known-false instrument is IMPORTED from TASK-20260824-e9d21a's committed
      constructions file and is not rebuilt (IR-11).
    report_it_how: >-
      AS AN INTEGER BESIDE THE NUMBER OF CELLS YOU ADJUDICATED AND YOUR OWN EXCLUDED-CELL LIST.
      NEVER AS A FRACTION, A PASS, A SCORE OR A MARGIN (H-5). Then place it beside the
      package's, whether they agree or not.
    blind_from_you_may_not_read_any_of_these:
      - coordination/goals/GOAL-DIFFP-84d641/sealed-priors
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-e1062f
      - harness/diffpath/depgraph.py
      - tests/test_diffpath_depgraph.py
    what_this_buys_and_what_it_does_not_stated_plainly_so_you_can_hold_the_line: >-
      THREE PROPERTIES BECOME MECHANICALLY CHECKED BY tools/check_review_independence.py, AND
      A FOURTH DOES NOT.
      CHECKED: that you did not read the Coordinator's sealed prior -- the first time in this
      goal the seal is machine-testable for any reviewer, and the direct structural answer to
      DEC-20260824-c5bb72 PD-3, where the prior leaked to BOTH reviewers through the plan's own
      mandatory prior field. CHECKED: that you did not read your sibling's report. CHECKED:
      that you did not read the producer's implementation of the counting rule or its test
      file, so your count comes from YOUR OWN RE-IMPLEMENTATION OF THE CONTRACT rather than
      from running the producer's module.
      NOT CHECKED, AND NOT CLAIMED: blindness to the VALUE. The producer's committed execution
      report states the quantity in prose, as the contract's reporting rules require it to, and
      you must read that report to discharge any joint at all. Naming the producer's directory
      in blind_from would guarantee either a spurious checker failure against a review that did
      nothing wrong, or an incomplete sources_read, which is a dishonest attestation and far
      worse. THE VALUE-BLINDNESS SUBSTANCE IS CARRIED BY `derived_before_reading` BELOW AND
      RESTS ON YOUR HONEST BOOLEAN, WHICH NO TOOL HERE CAN CHECK. The close has been told this
      in the plan and will weight your derivation as CORROBORATION AND NOT AS PROOF OF
      INDEPENDENCE.
    why_you_and_not_your_sibling: >-
      TWO REASONS AND THE FIRST IS DECISIVE. Your sibling MUST read the producer's new module
      and its test file to discharge its own joints, so assigning the re-derivation there would
      guarantee a leak against the third blind_from entry. And you are the reviewer whose
      independence from a Coordinator prior is worth the most, because you own the word
      PROVABLY and the three round-2 joints that broke. Round 2's Red Team declined the prior
      deliberately so its rulings could not be a confirmation of it; this round makes the same
      decision CHECKABLE rather than voluntary.
    a_narrowing_of_your_committed_read_scope_and_the_escape_hatch: >-
      harness/diffpath AND tests/test_diffpath_depgraph.py ARE in your committed read_scope. A
      read_scope is a PERMISSION AND NOT AN OBLIGATION, and this plan narrows it for two named
      files; the plan is authoritative over the card and the difference is recorded at PDV-2.
      ESCAPE HATCH, AND IT IS NOT A LOOPHOLE: if discharging an assigned joint genuinely
      requires reading a blind_from path, DO NOT READ IT SILENTLY AND DO NOT DROP THE JOINT.
      Say what you needed and why. If you judge reading it unavoidable, READ IT AND DECLARE IT
      in sources_read with `blind_from_respected: false` and the reason. AN HONEST FALSE IS
      WORTH MORE THAN A MATCHING TRUE THAT IS NOT TRUE: it turns the close's checker run into a
      disclosed, adjudicable event instead of a hidden one, and the close records it as a
      bounded gap rather than as a defect in your review.
    granularity_requirement_without_which_the_check_cannot_fire: >-
      LIST `sources_read` AT FILE GRANULARITY FOR ANYTHING UNDER harness/ AND UNDER THE
      PRODUCER'S TASK DIRECTORY. The checker matches a declared source against a blind_from
      prefix with `r == b or r.startswith(b.rstrip("/") + "/")`, so a coarse entry naming the
      DIRECTORY harness/diffpath cannot match a blind_from entry naming the FILE
      harness/diffpath/depgraph.py, and the leak test would pass while the file had been read.
      THAT IS A KNOWN LIMIT OF THE TEST AND NOT A WAY AROUND IT. Your attestation is what makes
      the check work.
    blind_from_respected_must_be_explicitly_true: >-
      THE CHECKER REQUIRES `blind_from_respected` TO BE EXPLICITLY true FOR A RE-DERIVATION
      TASK when no leak is detected. Set it true only if it is true. If it is false, set it
      false and say why -- see the escape hatch above.

  independent_derivation_before_reading:
    the_instruction: >-
      BEFORE OPENING ANY FILE UNDER
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/tasks/TASK-20260824-68ba87,
      derive the quantity above from the frozen contract, the committed instrument and the
      declared seeds, and WRITE IT DOWN IN YOUR REPORT before you read anything under that
      prefix. Also form your own answer to whether the diagonal exclusion answers or relocates
      the round-2 restatement question (R3-J6), from the committed code, before you read the
      producer's framing of it. THEN READ, AND REPORT YOUR VALUES BESIDE THE PACKAGE'S, WHETHER
      THEY AGREE OR NOT.
