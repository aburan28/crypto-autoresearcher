      judgement belongs to the Reviewer and the Coordinator. The statement that a SHA-1
      membership key's apparent 2560 bits are at most 512 plus one flag bit is SCOPED TO
      THIS CENSUS, where every planted SHA-1 entry is in the linearized code, and is
      offered to GOAL-SHA1-001 WITH THAT SCOPE ATTACHED rather than asserted.

