      make the derived partition 3 / 1 / 0 / 1 / 1. IT IS A STATEMENT ABOUT THE KEY'S
      SHAPE AND NOT AN ORDERED-PAIR DEPENDENCY BETWEEN COMPONENT VALUES, which is the
      only object CTL-DEP's formalism decides, so the assigning rule does not use it. IT
      IS WRITTEN DOWN HERE RATHER THAN APPLIED.

