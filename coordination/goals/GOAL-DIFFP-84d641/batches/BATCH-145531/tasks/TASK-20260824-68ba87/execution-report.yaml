  IR_13_derived_key_component_list:
    method: >-
      The list was DERIVED AT RUN TIME from the committed serialiser -- the component
      names of harness.diffpath.adjudicator.serialize(obj, STRICT) evaluated on one
      census entry of each primitive under the committed STRICT generator set
      frozenset(('E1','E3','E4','E5')) -- and NOTHING was hard-coded from the contract.
    derived_md5: '[primitive, length, message_difference, step_delta, block_index]'
    derived_sha1: '[primitive, length, message_difference, step_delta, block_index, in_linearized_code]'
    union_in_first_appearance_order: '[primitive, length, message_difference, step_delta, block_index, in_linearized_code]'
    agrees_with_the_contracts_six_names_in_order: true
    the_per_primitive_difference_reported_rather_than_worked_around: >-
      IN_LINEARIZED_CODE IS A KEY COMPONENT ON SHA-1 ONLY. The committed serialiser
      appends it if and only if obj.primitive == 'sha1', so THE MD5 KEY HAS FIVE
      COMPONENTS AND THE SHA-1 KEY HAS SIX. The contract's six names are the UNION and
      that is exactly what the derivation returns, so IR-13's stop condition did not
      fire. Every md5 verdict involving in_linearized_code is reported with
      `X_is_a_key_component_on_this_primitive` or `Y_is_a_key_component_on_this_primitive`
      false beside it rather than as though the component were in the key.

  # ==================================================================
  CTL_FROZEN_3:
