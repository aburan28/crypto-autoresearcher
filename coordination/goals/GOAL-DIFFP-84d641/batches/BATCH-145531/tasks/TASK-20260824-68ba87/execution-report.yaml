  O_RT2_the_live_structural_claim:
    what_was_settled_and_by_what: >-
      SETTLED BY THE DEPENDENCY GRAPH'S OWN DERIVATION, FROM COMMITTED SOURCE.
      primitives.sha1_in_linearized_code(words) RETURNS sha1_expand(words[:16],
      len(words)) == list(words). THEREFORE ON ANY OBJECT WHOSE FLAG IS TRUE THE WHOLE
      MESSAGE-DIFFERENCE VALUE IS THE EXPANSION OF ITS OWN FIRST 16 WORDS, so the SHA-1
      membership key RESTRICTED TO IN-CODE OBJECTS carries at most 512 bits of message
      difference plus one flag bit rather than the 2560 bits its serialised width
      suggests. O-RT2's restriction of the sha1 message difference to dv[:16] is
      therefore LOSSLESS ON IN-CODE OBJECTS.
    the_scope_limit_that_makes_it_not_a_general_statement: >-
