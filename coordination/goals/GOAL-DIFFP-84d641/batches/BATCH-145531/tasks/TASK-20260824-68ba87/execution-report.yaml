    reported_separately_and_never_inside_the_criterion_set:
      - 'harness/diffpath/depgraph.py -- this contract''s only new module'
      - 'tests/test_diffpath_depgraph.py -- this contract''s only new test file'
    the_quoted_digest_was_recomputed_rather_than_trusted: >-
      EV-DIFFP-b16b01 records the source digest
      953398c4bc92fc1075817987976e9c9582c2756f13eff3f68a357d87355646b7 for
      harness/diffpath/controlpower.py and the Coordinator marked it QUOTED AND NOT
      MEASURED BY IT (BR-6). THIS RUN RECOMPUTED IT AND IT AGREES.
    IR_2_outcome: >-
      NO COMMITTED FILE UNDER harness/ WAS MODIFIED. Two new files were written --
      harness/diffpath/depgraph.py and tests/test_diffpath_depgraph.py -- and nothing
      else under harness/ or tests/ was touched. tests/test_harness.py,
      tests/test_diffpath_adjudicator.py and tests/test_diffpath_controlpower.py were
