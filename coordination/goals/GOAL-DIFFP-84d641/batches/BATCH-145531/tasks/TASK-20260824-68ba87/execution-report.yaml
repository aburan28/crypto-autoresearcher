      determine nothing about the rest, so O-RT2's projection is NOT injective on
      arbitrary SHA-1 keys. It survives every declared arm because every planted census
      entry of this census is in the linearized code and because a family-(d)
      perturbation that leaves dv[:16] untouched necessarily flips the flag to False,
      which the retained flag component then separates -- which is exactly why the
