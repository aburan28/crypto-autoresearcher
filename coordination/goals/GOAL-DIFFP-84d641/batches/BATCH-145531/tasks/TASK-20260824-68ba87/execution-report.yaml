  # ==================================================================
  CTL_WF:
    two_sided_known_answer_outcome: >-
      THE GATE BOTH ACCEPTS AND REJECTS ON THIS POPULATION. Accept side, per primitive:
      md5 16 of 16 checked accepted, sha1 80 of 80 checked accepted -- that is the 16
      census entries plus every orbit image under the STRICT generator set, 96 objects,
      the same 96 CTL-PLANT attempts the committed suite makes. Reject side: 8 of 8
      deliberately malformed objects rejected, 0 wrongly accepted.
    the_malformed_object: >-
      A SHA-1 entry with in_linearized_code FLIPPED and the dv held fixed, which is
      exactly null family (e) as DEC-20260824-af6d5c P-4 specified it. IT IS BUILT ONLY
      TO BE REJECTED. THIS CONTRACT BUILDS THE GATE AND DOES NOT EXECUTE FAMILY (e);
      family (e) remains an open direction with its revisit condition unchanged.
    the_five_checks: >-
      W1 the primitive is declared; W2 the message-difference word count is consistent
      with the primitive and, on sha1, with the length; W3 in_linearized_code equals the
      committed primitives.sha1_in_linearized_code of the object's own dv, and is None
      on md5; W4 the step range is well formed with respect to the per-step arrays, so
      0 <= a <= b and len(step_delta) == len(step_delta_signed) == length; W5
      block_index is a non-negative integer.
    a_limit_of_W5_stated_rather_than_glossed: >-
      NO COMMITTED MODULE DECLARES AN UPPER BOUND ON block_index --
      equivalence.act_E6_reindex accepts any integer -- so W5 checks integrality and
      non-negativity ONLY, and that is the whole of the declared range this gate can
      enforce. A reader should not take W5 for a range check it is not.
    per_family_per_primitive_rejection_counts:
      - 'd_message_difference: md5 2608 constructed / 0 rejected / 2608 accepted; sha1 2608 / 0 / 2608'
      - 'd_step_delta: md5 368 constructed / 0 rejected / 368 accepted; sha1 368 / 0 / 368'
      - 'd_block_index: md5 368 constructed / 0 rejected / 368 accepted; sha1 368 / 0 / 368'
      - 'd_length: md5 40 constructed / 40 rejected / 0 accepted -- NOT CONSTRUCTIBLE; sha1 40 / 40 / 0 -- NOT CONSTRUCTIBLE'
      - 'd_primitive: md5 40 constructed / 40 rejected / 0 accepted -- NOT CONSTRUCTIBLE; sha1 40 / 40 / 0 -- NOT CONSTRUCTIBLE'
      - 'd_in_linearized_code: md5 40 constructed / 40 rejected / 0 accepted -- NOT CONSTRUCTIBLE; sha1 40 / 40 / 0 -- NOT CONSTRUCTIBLE'
    three_families_are_NOT_CONSTRUCTIBLE_and_that_is_a_first_class_result: >-
      A FAMILY WHOSE DECLARATION CANNOT BE HONOURED IS REPORTED AS NOT CONSTRUCTIBLE
      WITH THE DERIVATION THAT MAKES IT SO, AND NEVER AS PRODUCING ZERO DETECTIONS. The
      derivations, each read off committed source and each MEASURED by gating every
      draw rather than asserted. d_length cannot move the length while holding the rest
      fixed because length is not a stored field: it is the property step_range[1] -
      step_range[0] + 1, and step_delta carries exactly one entry per step, so moving it
      necessarily moves step_delta as well, and on sha1 also the dv. d_primitive cannot
      move the primitive because the md5 and sha1 variants carry different fields
      entirely. d_in_linearized_code cannot move the flag with the dv held fixed because
      the flag IS a function of the dv and W3 rejects any object where it is not; on md5
      there is no flag to move at all and the attempted move is offered to the gate
      rather than quietly turned into a no-op.

  # ==================================================================
  CTL_DEP_the_dependency_table:
    ordered_pairs_decided: '30 per primitive, 60 in total; every pair has a verdict and no reason is merged into a count'
    declared_population_sizes:
      md5: 2624
      sha1: 3208
      composition_md5: 'census entries 8, strict orbit images 8, family-(d) draws 2608'
      composition_sha1: 'census entries 8, strict orbit images 72, family-(d) draws 2608, D-SHA1-INCODE draws 520'
    the_edge_rule_as_implemented: >-
      THE CONTRACT'S OWN RULE, IMPLEMENTED LITERALLY AND NOT EXTENDED. For the ordered
      pair (X, Y), group the population by X's value and decide EDGE if and only if Y is
      constant within every group. Eight diagnostics are emitted beside every verdict --
      distinct_X, groups_total, groups_constant_in_Y, groups_of_size_ge_2,
      max_group_size, distinct_Y, LOW_DISTINCT_X and Y_CONSTANT_ON_POPULATION -- and
      NONE OF THEM CHANGES THE VERDICT. They exist because the same constancy test
      reports an edge for any pair whose groups are all singletons, and for any pair
      whose Y takes one value on the population.
    edges_carrying_BOTH_a_derivation_and_a_witness:
      - >-
        'md5 (step_delta -> length)': length is the PROPERTY step_range[1] -
        step_range[0] + 1 and pathobj.plant_from_pair builds step_delta with exactly one
        modular difference per step of the closed range, so len(step_delta) == length on
        every object; act_E1_shift shifts both ends, act_E3_negate is element-wise at
        constant range, and the perturbation constructors copy __dict__ and touch
        neither. Witness on 2624 objects.
      - >-
        'sha1 (step_delta -> length)': the same derivation, witnessed on 3208 objects.
      - >-
        'sha1 (message_difference -> length)': on sha1 the serialised message difference
        is tuple(obj.dv) and plant_from_pair sets dv = full_dv[a:b+1] over the closed
        step range, so len(dv) == length, and every constructor in the population
        preserves the word count. IT DOES NOT HOLD ON MD5, where delta_m is always 16
        words whatever the length. Witness on 3208 objects.
      - >-
        'sha1 (message_difference -> in_linearized_code)': primitives.sha1_in_linearized_code(words)
        RETURNS sha1_expand(words[:16], len(words)) == list(words), a pure function of
        the word list; plant_from_pair, perturb_message_difference and perturb_by_codeword
        all compute the flag by that function from the object's own dv, and CTL-WF check
        W3 rejects any object where the flag is not that predicate of its own dv.
        Witness on 3208 objects. THIS IS THE PRE-REGISTERED EDGE P-A AND ITS REPRODUCTION
        WAS EXPECTED; THE DERIVATION IS WHAT WAS NOT YET DONE.
    two_scope_limits_carried_on_the_flag_edge: >-
      STATED IN THE SAME BREATH AS THE EDGE. First, plant_from_pair computes the flag
      from the FULL 80-word expansion while the serialised value is the step-range
      slice, and these coincide only AT FULL STEP RANGE, which is where every planted
      entry of this census sits. Second, equivalence.act_E1_shift and act_E2_rotate CARRY
      THE FLAG OVER rather than recomputing it, so the derivation covers their images
      only because W3 is MEASURED on them rather than assumed -- and it was measured, 80
      of 80 sha1 accept-side objects.
    edges_labelled_empirical_only: >-
      14 on md5 and 8 on sha1. AN EDGE WITH A WITNESS AND NO DERIVATION IS LABELLED
      `empirical_only`, THE WORDS THEOREM, PROVABLE, PROVABLY AND IMPOSSIBLE ARE NOT USED
      FOR IT ANYWHERE IN THIS BATCH, AND NO PARTITION CLASS OF THIS CONTRACT RESTS ON
      ONE. Most of them are population facts wearing an edge: block_index takes the
      single value 0 on the whole declared population, because E6 is not in the STRICT
      generator set and no declared family moves it, so every pair whose Y is
      block_index is flagged Y_CONSTANT_ON_POPULATION.
    edges_labelled_scope_artifact: >-
      5 per primitive, all of the form (X -> primitive). The graph is computed PER
      PRIMITIVE as H-4 requires, so `primitive` takes exactly one value on each
      sub-population and is trivially constant within every group. It is labelled a
      scope artifact so no reader takes it for a dependency, and no partition class
      rests on one.
    counterexample_certificates: >-
      Every pair the population REFUTES carries a full certificate -- the two objects,
      their shared X value, their differing Y values and their provenance -- and they are
      archived in dependency-graph-result.json whether or not they change a verdict.
      There are 10 refuted pairs on md5 and 17 on sha1.
    derivation_with_a_failing_witness: >-
      NONE. The stopping rule for a derivation contradicted by its witness did not fire
      on any pair, on either primitive.
    small_population_tail_check: >-
      APPLIED TO EVERY EDGE. Every verdict reports its distinct-X count and is flagged
      LOW_DISTINCT_X where X takes fewer than three distinct values. The four
      derivation-carrying edges are NOT low-distinct-X on their Y side and their
      derivations do not rest on the witness.

  # ==================================================================
  CTL_GRAPH_NULL:
    null_population_A_md5: >-
      The md5 sub-population for the pair (message_difference, in_linearized_code)
      returns EDGE, and THE REASON IS NAMED RATHER THAN LEFT TO A READER: on md5 the
      flag has no defining function of the message difference in the committed source
      and is not a key component at all, so pathobj.plant_from_pair leaves it None on
      every md5 object and it takes ONE CONSTANT VALUE across all 2624 objects. The
      verdict carries Y_CONSTANT_ON_POPULATION true and distinct_Y 1. AN EDGE REPORTED
      HERE IS A PROPERTY OF A CONSTANT COLUMN AND NOT A DEPENDENCY.
    null_population_B_synthetic_independent_coordinates: >-
      400 objects per primitive, every one CTL-WF-accepted, 0 rejected. Coordinates
      drawn independently from small declared pools ON PURPOSE, so the groups are large
      rather than singletons: a null whose every group is a singleton would report an
      edge for every pair and would demonstrate nothing about the detector.
    edges_returned_the_contracts_literal_quantity: 'md5 11 of 30; sha1 8 of 30'
    edges_returned_outside_the_declared_forced_set: 'md5 0; sha1 0'
    the_detector_demonstrably_returns_NO_EDGE: >-
      19 of 30 pairs on md5 and 22 of 30 on sha1 came back NO EDGE on the null
      population. THE DETECTOR HAS A DEMONSTRATED CAPACITY TO RETURN NO EDGE, which is
      the whole point of running it before believing anything.
    DEV_1_the_literal_known_answer_is_unreachable: >-
      SEE deviations.DEV-1. The contract's literal known answer -- NO EDGE for EVERY
      pair -- cannot be produced by any implementation, because CTL-WF, which the SAME
      control mandates, forces some of those pairs. Both quantities are reported and the
      STOP condition was applied to the one outside the pre-declared forced set, which
      is 0 on both primitives.

  # ==================================================================
  CTL_PART_the_partition:
    order_declaration: >-
      partition-derived.json WAS WRITTEN AND CLOSED BEFORE ANY BYTE OF BATCH-efcae7's
      VERDICT COLUMN WAS OPENED. The derivation function reads only the CTL-DEP graph
      and the declared families' own perturbation declarations; the comparison function
      opens the committed records afterwards, in the same process, in that order, and
      records the derived file's sha256 as it found it. NO TOOL HERE CAN CHECK READ
      ORDER, SO THIS IS CORROBORATION AND NOT PROOF.
    the_disclosure_that_weakens_the_order_claim: >-
      STATED RATHER THAN OMITTED, AND IT IS THE HONEST SCOPE OF THE CLAIM. The FROZEN
      CONTRACT ITSELF, which this executor must read before running anything, PRINTS THE
      PRE-REGISTERED TARGET WITH ITS PER-ROW ASSIGNMENT at CTL-PART
      `the_pre_registered_target` and at preregistered_prediction P-B. The producer
      therefore could not be blind to the target. What it was blind to, and did not open
      until partition-derived.json was closed, is BATCH-efcae7's own DETECTED / NOT
      DETECTED verdict column in EV-DIFFP-b16b01 and DEC-20260824-c5bb72.
    derived_classes_row_by_row:
      - 'primitive -> NOT_PROBED_BY_A_DECLARED_FAMILY (rule R5 on both primitives)'
      - 'length -> PROVABLY_UNDETECTABLE_BY_ANY_FAMILY (rule R1 on both primitives)'
      - 'message_difference -> ENTAILED_BY_THE_PERTURBING_FAMILYS_OWN_DECLARATION (rule R2 on both primitives)'
      - 'step_delta -> CONTINGENT_ON_THE_INSTRUMENT (rule R3 on both primitives)'
      - 'block_index -> NOT_PROBED_BY_A_DECLARED_FAMILY (rule R5 on both primitives)'
      - 'in_linearized_code -> PROVABLY_UNDETECTABLE_BY_ANY_FAMILY (rule R1 on sha1 by the derived edge; on md5 because it is not a key component at all)'
    derived_class_counts_aggregate: >-
      PROVABLY_UNDETECTABLE_BY_ANY_FAMILY 2, NOT_PROBED_BY_A_DECLARED_FAMILY 2,
      PROBED_AND_GENUINELY_NOT_DETECTED 0,
      ENTAILED_BY_THE_PERTURBING_FAMILYS_OWN_DECLARATION 1,
      CONTINGENT_ON_THE_INSTRUMENT 1. Sums to six.
    pre_registered_class_counts_aggregate: >-
      1 / 3 / 0 / 1 / 1, quoted from EXP-DIFFP-04082e CTL-PART and P-B, which the
      contract attributes to DEC-20260824-c5bb72 and EV-DIFFP-b16b01 AND MARKS AS
      MEASURED BY THAT SESSION AND NOT BY THE COORDINATOR (BR-6).
    rows_agreeing: '5 of 6'
    the_one_disagreement_stated_on_both_sides: >-
      THE ROW IS `length`. THIS CONTRACT'S SIDE: PROVABLY_UNDETECTABLE_BY_ANY_FAMILY,
      rule R1, because step_delta -- which the row RETAINS -- determines length by an
      edge carrying a derivation from committed source, len(step_delta) == length, so
      the ablated key separates exactly the objects the unablated key separates and no
      family of any kind can make the deletion visible. BATCH-efcae7's SIDE:
      NOT_PROBED_BY_A_DECLARED_FAMILY, on the reading that no declared family produces a
      draw differing in length. THE TWO ARE NOT THE SAME STATEMENT: `not probed` is a
      coverage statement about the declared families, `provably undetectable` is a
      statement about every possible family, and the second is strictly stronger. THIS
      PRODUCER DOES NOT DECIDE WHICH SIDE IS WRONG and composes no verdict on it
      (IR-8, H-11); it records that the derivation exists and that the two records
      disagree.
    the_probing_profile_quantified_exactly: >-
      H-7 AND CORR-20260824-c1c8b1. `isolating_draw_exists(X)` means there EXISTS a
      declared draw and there EXISTS a census entry -- ANY entry, not necessarily the
      draw's own source -- whose committed attribution is exactly [X].
      `own_source_differing(X)` is the strictly different statement that a draw differs
      from ITS OWN SOURCE entry in X, possibly among others. MEASURED: isolating draws,
      message_difference 3088, step_delta 6, and 0 for primitive, length, block_index
      and in_linearized_code; own-source differing draws, message_difference 8720,
      in_linearized_code 4600, step_delta 32, and 0 for primitive, length and
      block_index. THE SIX ISOLATING DRAWS FOR step_delta ARE THE SIX
      CORR-20260824-c1c8b1 RECORDS, and they are why that row is contingent rather than
      unprobed.
    an_observation_recorded_and_deliberately_not_used_by_the_rule: >-
      THE COMMITTED SERIALISER APPENDS ('in_linearized_code', flag) IF AND ONLY IF
      obj.primitive == 'sha1', so on any key that RETAINS the flag component the
