  # ===================================================================
  # SPECIFICATION GAPS -- REPORTED AND NOT RESOLVED
  # ===================================================================
  specification_gaps_reported_and_not_resolved:
    gap_1:
      id: 'the row whose component is absent from a primitive''s key'
      severity: 'LOAD-BEARING: it decides whether CTL-FORCE-PI''s side-A known answer is met.'
      what_the_contract_says: >-
        'the cell (F, r) IS FORCED FOR I if and only if, in the key pi_I(K)
        with c(r) additionally deleted, THERE REMAINS a component d such that
        the graph carries a DERIVATION-BACKED edge d -> c(r) on the primitive
        under consideration', with r defined as 'the deletion of exactly one
        component c(r) from K'.
      what_it_does_not_say: >-
        WHICH SIDE A ROW FALLS ON WHEN c(r) IS NOT A COMPONENT OF K ON THAT
        PRIMITIVE. On MD5 the run-time-derived key has FIVE components and
        in_linearized_code is not one of them, so the row deleting it is not a
        depth-1 row of the MD5 key and its deletion is the IDENTITY on every
        MD5 key. The committed graph carries NO derived_and_witnessed edge into
        that column on MD5: all 5 MD5 edges into it are `empirical_only` on a
        constant column, which the contract's own clause (2) forbids as a
        forcing edge.
      the_two_readings_measured:
        edge_only: >-
          The `if and only if` read literally: a component d must REMAIN. The
          cell is NOT FORCED on MD5 and is ADJUDICATED.
        edge_or_vacuous: >-
          A row whose component is absent from the primitive's key is FORCED
          VACUOUSLY, its value unchangeable because the deletion is the
          identity. THIS IS THE READING THE COMMITTED BATCH-145531 RULE TOOK:
          its own excluded-cell record carries, for MD5, a forcing edge with
          X = null and the derivation 'in_linearized_code IS NOT A COMPONENT OF
          THE md5 KEY, so deleting it is the identity on every md5 key'. THAT
          RECORD HAS A DERIVATION BUT NO SOURCE COMPONENT d, WHICH IS EXACTLY
          WHY THE TWO READINGS COME APART.
      how_it_was_handled: >-
        THE PRODUCER REFUSED TO RESOLVE IT AND MEASURED BOTH. The two readings
        were DECLARED IN harness/diffpath/readmit.py AS CONSTANTS BEFORE ANY
        RUN EXECUTED, so the choice was not made after seeing which gives the
        more interesting number (IR-6). Every table, every count, every forced
        set and every control in this batch is reported under BOTH.
      consequence_for_the_contracts_stopping_rule: >-
        DECLARED AS A PROTOCOL DEVIATION AND NOT PRESENTED AS COMPLIANCE. The
        contract's stopping rule fires when the identity known-answer differs
        from the committed six IN EITHER DIRECTION, and H-6 then forbids
        reporting any re-admitted count. UNDER `edge_or_vacuous` THE KNOWN
        ANSWER IS MET AND NO STOP FIRES; UNDER `edge_only` IT IS NOT MET AND
        THE STOP FIRES. THE PRODUCER DID NOT PICK. It continued the
        measurement and reported both, because suppressing the arithmetic
        under one reading would destroy a measurement BOTH readings share --
        the differing cell, its identity, and the counts, which are identical
        under both -- and because asserting the known answer met under the
        reading that meets it would resolve the gap by fiat. THE READING
        QUESTION IS ROUTED TO THE COORDINATOR AS A SPECIFICATION FINDING, AND
        IF THE COORDINATOR RULES FOR `edge_only` THEN THE STOP STANDS AND THE
        RE-ADMITTED COUNTS IN THIS REPORT ARE TO BE READ AS REPORTED UNDER A
        FIRED STOP.
      the_measurement_is_the_same_under_both: >-
        STATED PLAINLY BECAUSE IT BOUNDS HOW MUCH THE GAP COSTS. The differing
        cell is the SAME cell, the differing COUNT is the SAME integer (0 for
        the honest cell set, 1 for the O-E cell set), and the honest DETECTED
        count is 0, under BOTH readings and BOTH composition orders. The
        readings differ ONLY in whether three MD5 cells sit in the denominator:
        21 vs 18 for the honest cell set, 24 vs 21 for the O-E cell set.
    gap_2:
      id: 'what `all 30 committed comparisons` of CTL-O-E-REUSE enumerates'
      severity: 'MODERATE: it changes what the control checks, not any measured integer.'
      the_two_arithmetics_that_both_reach_30:
        taken_and_measured: >-
          O-E's OWN committed row: 12 per_cell entries x (draws, member) = 24,
          plus 6 summary integers = 30. CTL-O-E-REUSE is a control ABOUT O-E,
          and this reading is what was measured: 30 of 30 agree.
        not_taken_and_reported_as_UNMEASURED_never_as_agreement: >-
          BATCH-145531's CTL-RC1 checked 5 instruments x the same 6 summary
          integers = 30. ONE run_suite COSTS ~52 s AND RUN 2's DECLARED CEILING
          IS 75 s, so five of them CANNOT be executed inside the declared
          budget. The other four instruments (O-D, O-C, O-C-prime,
          O-C-double-prime) are emitted as null and NEVER as 0 or as agreement
          (H-8). Their independent reconstruction remains rank 2 of
          DEC-20260824-257f35 and is untouched by this batch.
      how_it_was_handled: 'Declared in the module BEFORE the run, measured under the taken reading, and the other reading reported as unmeasured.'
    gap_3:
      id: 'the forcing predicate for a non-projective instrument'
      severity: 'LOW: it is bookkeeping and is declared as such.'
      what: >-
        The contract defines an instrument as a PROJECTION pi_I, and lists
        always_member and always_non_member among the instruments. Those two
        are VERDICT FUNCTIONS, not projections, and the committed module says
        so in terms. This producer gave them the IDENTITY projection for the
        cell-selection half and the constant verdict for the counting half, and
        DECLARED IT in the module and in every emitted artifact. CONSEQUENCE
        STATED SO NO READER MISTAKES IT FOR A MEASUREMENT: their forced set
        equals the identity instrument's BY DECLARATION, not by observation,
        and they are therefore EXCLUDED from CTL-FORCE-PI's `does the forced
        set move` side.
    nothing_else_was_refused: >-
      NO OTHER TERM OF THE CONTRACT WAS FOUND UNDERSPECIFIED. Inputs, controls,
      metrics, budgets, stopping rules and the artifact list are all present and
      were followed. NO required field was missing and no `specification_error`
      refusal of the whole task was warranted.

