    - 'DO NOT EDIT ledger/goals/GOAL-DIFFP-84d641.yaml. A lane edits the goal head only inside its own ledger archive and only additively.'
    - 'DO NOT WRITE THE REVIEW PLAN OR EITHER ASSIGNMENT. They are TASK-20260826-30e97f''s, written after the producer runs.'
    - 'PUT THE PRIOR OUTSIDE EVERY REVIEWER READ SCOPE (BR-9) AND KEEP ITS FILENAMES OUT OF EVERY BINDING MAP (BR-16).'
    - 'NAME THE FORBIDDEN IMPLEMENTATION PATH LITERALLY IN THE CONTRACT, THE EXECUTOR''S CARD AND ITS HANDOFF, and state the forcing predicate formally enough to be implemented from it.'
    - 'PRE-REGISTER BOTH OUTCOMES OF BOTH ARMS BEFORE ANY RUN so neither can be written as a surprise afterwards.'
    - 'RECOMPUTE OR ATTRIBUTE (BR-6). Every integer is read from a named committed artifact and attributed to the session that measured it.'
    - 'STATE THE CUMULATIVE DECLARED SPEND AND MAKE THE PROCEED-OR-PAUSE DECISION VISIBLE. SELF-GRANT NO CEILING RAISE AND DO NOT REDEFINE THE ACCOUNTING BASIS TO MAKE A NUMBER FIT.'
    - 'SIZE THE REVIEW BUDGETS FROM MEASURED AGENT TIME, NOT BY REPEATING A FIGURE TWICE MEASURED WRONG.'
    - 'Do not read coordination/goals/GOAL-MD5-001/quarantine/** and do not authorise any task to.'
    - 'Do not claim any path is new, authorise no search or acquisition, and do not let `blocked` drift into `closed` for the MD5 lane.'
    - 'Mint or authorise no IDEA-* id from TASK-20260824-873dc9''s unreviewed proposal set.'
    - 'WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13). coordination/**.yaml is unparse-gated in CI.'
