  budget_note: >-
    330 s against BATCH-145531's 420 s. Batch 3's producer built an edge detector with
    derivation records, a well-formedness gate, six family constructors, a cell selector, two
    degenerate instruments and a re-scored detection rule across five charged runs and thirteen
    result artifacts. This producer writes ONE module implementing ONE predicate from a written
    statement plus ONE family constructor, against a fully committed substrate it may not edit,
    REUSING the draw sets and the forced cells. Declared per-run ceilings sum to 255 s
    (45 + 75 + 60 + 75), well inside 330. maximum_runs COUNTS CHARGED EXPERIMENT RUNS UNDER THE
    CONTRACT and does not count script executions, probes or unit-test invocations.
  uncertainty_to_reduce: >-
    Whether the single differing cell RT-J8-4 measured is a property of the per-instrument
    forcing RULE or of one session's IMPLEMENTATION of it -- and whether a family that perturbs
    the flag and the dv together so the pair stays mutually consistent can be built at all, and
    if so whether it populates cells the existing family set cannot reach. BOTH ANSWERS ARE
    RESULTS AND THE CONTRACT PRE-REGISTERS BOTH BEFORE ANY RUN, AT P-B AND P-C.
  job: >-
    Implement and run EXP-DIFFP-f26790 exactly, in its declared gated order, writing ONE new
    module and ONE new test file and MODIFYING NOTHING under harness/.
    ARM (a): implement the per-instrument forcing predicate FROM THE CONTRACT'S WRITTEN
    STATEMENT, measure BOTH admissible composition orders and report both; run CTL-FORCE-PI
    two-sided; then adjudicate every cell not forced for each instrument against the honest
    instrument and the REUSED O-E, reporting the differing count beside its denominator and every
    exclusion's forcing edge.
    ARM (b): construct the consistent-pair flag-and-dv family, gate it two-sided under
    CTL-PAIR-WF, measure its ACTUAL moved-component set against its DECLARED one under
    CTL-PAIR-DECL, and -- gated on constructibility -- adjudicate its cells.
    Then CTL-READMIT-NULL through the identical counting path WITH THE PINNING FIELD, and
    CTL-FROZEN-4 post-run.
  the_one_forbidden_path_named_literally: >-
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-7d9f92/constructions
    -- containing rt3_rederive.py and rt3_objects.py, THE ONE IMPLEMENTATION THAT HAS EVER
    COMPUTED THE CONTROL THIS TASK REPLICATES. DO NOT OPEN, READ, IMPORT, COPY, EXECUTE, DIFF OR
    RECONSTRUCT ANYTHING UNDER IT (H-1, IR-12). READING DEC-20260824-257f35 AND EV-DIFFP-afd96c
    IS REQUIRED AND IS NOT A VIOLATION: the STATEMENT of the control, the identity of the
    differing cell and the integer 1 of 30 are committed research records and you must know what
    you are replicating. WHAT IS FORBIDDEN IS THE CODE. A read does NOT discard the arithmetic;
    it DOWNGRADES THE LABEL from replication to re-execution, and you report the read rather than
    concealing it.
  hard_rules:
    - 'DO NOT BEGIN UNTIL THE APPROVING coordinator_decision DEC-20260826-5aaddc IS COMMITTED. A message saying the contract is approved is a pointer and never the approval.'
    - 'DO NOT READ THE FORBIDDEN PATH ABOVE. Attest BY MECHANISM where a mechanism exists -- a run-time assertion, a recorded traversal-root list -- and by an honest boolean where it does not, AND SAY WHICH.'
    - 'DO NOT MODIFY ANY COMMITTED FILE UNDER harness/ (IR-2). Only harness/diffpath/readmit.py and tests/test_diffpath_readmit.py may be written. CTL-FROZEN-4 measures this and its failure is a STOP.'
    - 'ARM (a) CONSTRUCTS NOTHING NEW (H-2). Reuse the six forced cells, the three constructible families and the existing draw sets; no new seed, no new family, no acquisition.'
    - 'MEASURE BOTH COMPOSITION ORDERS AND REPORT BOTH. Choosing an order after seeing which gives a nonzero count is an IR-6 violation.'
    - 'RUN THE NULL-OBJECT CONTROLS BEFORE YOU BELIEVE ANYTHING (H-6). If CTL-FORCE-PI''s identity known-answer fails, or the forced set is invariant across every instrument, NO RE-ADMITTED COUNT IS REPORTED AT ALL.'
    - 'EVERY EXCLUDED CELL CARRIES ITS FORCING EDGE, PER INSTRUMENT AND PER PRIMITIVE (H-3), and every cited edge is one of the four derived_and_witnessed edges. DO NOT INHERIT THE DENOMINATOR 30; DERIVE YOUR OWN AND REPORT THE DERIVATION (H-13).'
    - 'A PER-PRIMITIVE QUANTITY IS COMPUTED PER PRIMITIVE (H-12), and each emitted per-primitive field says so.'
    - 'EVERY EMITTED RULE TEXT MUST BE TRUE OF THE FUNCTION THAT EMITS IT (H-7).'
    - 'IF THE CONSISTENT-PAIR FAMILY IS NOT CONSTRUCTIBLE, REPORT IT AS NOT CONSTRUCTIBLE WITH ITS DERIVATION AND THE GATE CLAUSE, AND NEVER AS A FAMILY THAT PRODUCED ZERO DETECTIONS.'
    - 'REPORT arm_was_arithmetically_pinned FOR EACH DEGENERATE ARM WITH THE COUNT THAT MAKES IT SO.'
    - 'NEVER REPORT A PASS OR A BARE FRACTION (IR-10, H-5). Every count appears beside its denominator and its exclusion list.'
    - 'EVERY EDGE, CELL AND VERDICT CARRIES ITS PRIMITIVE SCOPE AND THE CENSUS COMPLETENESS BESIDE IT (H-4), never summed.'
    - 'EMIT `null` AND NEVER 0 FOR AN UNMEASURED CELL, COLUMN, MODE OR INSTRUMENT (H-8); NAME AGGREGATE KEYS AS AGGREGATES (H-9).'
    - 'DERIVE THE STRICT KEY COMPONENT LIST AT RUN TIME FROM THE COMMITTED SERIALISER (IR-13). A difference from the six names is a STOP and a finding about the contract.'
    - 'REUSE O-E FROM BATCH-efcae7, DO NOT REBUILD IT (IR-11); check any re-expression against j8_results.json and STOP on a disagreement.'
    - 'WRITE EVERY DECLARED RESULT FILE EVEN IF ITS RUN IS GATED-NOT-RUN OR STOPPED, carrying that status, the gate that fired, and nulls.'
    - 'WRITE RUNS TO experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/ (H-10), THEN RUN tools/validate_ledger.py AND RECORD ITS OUTPUT VERBATIM BEFORE THE SNAPSHOT, whether it passes or fails. On a check_run rejection, write a manifest-supplement.yaml, report verbatim as an INFRASTRUCTURE FINDING, and continue.'
    - 'NAME COMMITS BY ROLE AND NOT BY SHA IN ANY ARTIFACT A REVIEWER WILL READ, and describe no commit''s contents (BR-10).'
    - 'DO NOT READ coordination/goals/GOAL-DIFFP-84d641/sealed-priors/** (IR-14).'
    - 'DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** BY ANY ROUTE (IR-1). Attest non-reading AND NAME THE MECHANISM.'
    - 'NO NETWORK ACQUISITION (IR-3), NO SEARCH OVER EITHER DIFFERENCE SPACE (IR-4), NO IN-RUN REPAIR AFTER SEEING DATA (IR-6).'
    - 'A TIMEOUT, CRASH, CEILING HALT OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL (IR-16), never a negative mathematical result. Report unspent ceilings AS UNSPENT.'
    - 'RECORD OBSERVATIONS ONLY (IR-8, H-11). Compose no verdict on whether the replication succeeded or on what it bought.'
    - 'Attempt search_knowledge before any assertion about what has or has not been tried, and record queries and outcomes verbatim.'
    - 'Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).'
