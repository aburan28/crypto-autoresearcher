  hard_rules:
    - 'RUNS ALONE. No other task may be running concurrently, and NEITHER REVIEW MAY START before this commit exists and is verified.'
    - 'STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity failure, not a convenience. Do not stage dispatch_queue.json and do not stage claims/.'
    - 'MERGE origin/main, NEVER REBASE. Record the base commit and the merge outcome and run tools/merge_digest.py. A sync conflict inside an immutable record is resolved by a NEW SUPERSEDING RECORD under a new id, never by editing the record and never by picking a side.'
    - >-
      RECORD THE CONCURRENT-WRITER CHECK (BR-15): the branch HEAD before and after the merge, and
      confirmation that no path in the binding set was touched by a commit this lane did not
      make. IF ONE WAS, DO NOT REBIND SILENTLY -- report it and stop, because a rebind is a
      superseding correction record and is not this task's to make.
    - 'SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE ROUND CLOSES (BR-1), extended by BR-10 to committed artifacts that restate commit history.'
    - 'THE PLAN CARRIES A POINTER TO THE SEALED PRIOR AND NOT THE PRIOR (BR-9). No prediction, mechanism or predicted integer appears in the plan or in either assignment. `blind_from` names the sealed-priors prefix LITERALLY with no wildcard (BR-3).'
    - >-
      THE BLINDNESS BOUNDARY LISTS ONLY THE SIBLING'S CARD, ASSIGNMENT, REVIEW DIRECTORY AND
      CONSTRUCTIONS, AND NEVER A REVIEWER'S OWN TWO DOCUMENTS (BR-14). A plan may not
      simultaneously order a reviewer to read a document and declare that document a blind_from
      prefix.
    - 'THE ASSIGNMENTS QUOTE NO PRODUCER-REPORTED VALUE FOR THE BLINDED QUANTITY (BR-5), which this round is THE RE-ADMITTED DIFFERING-CELL COUNT AND ITS DENOMINATOR.'
    - 'EVERY JOINT CARRIES A SHORT `id` AND EVERY REVIEWER LISTS THOSE IDS IN joints_owned (BR-2); proves_too_much carries a TOP-LEVEL failure_signature roll-up (BR-4).'
    - 'SIX JOINTS, THREE PER REVIEWER, AND NO MORE. The plan may not quietly restore joints the batch did not fund.'
    - >-
      THE PLAN REQUIRES AN `admissibility_ruling` BLOCK FROM EACH REVIEWER, SEPARATE FROM ITS
      JOINT FINDINGS, answering completion criterion 4's five conjuncts one by one as ADMIT / DO
      NOT ADMIT / NOT IN MY SCOPE WITH THE REASON -- and the plan must state that this is NOT a
      lowering of the bar, that the criterion's text is unchanged, that a `breaks` on an owned
      joint remains a break, and that a reviewer may refuse admission on all five.
    - 'NEITHER ASSIGNMENT INSTRUCTS A REVIEWER TO COMMIT ITS OWN REPORT (BR-11).'
    - 'NEITHER SEALED-PRIOR FILE IS DECLARED AS AN artifact_path AND NEITHER FILENAME APPEARS IN path_sha256 (BR-16). Their digests go in digests.json, which IS declared, and they are disclosed in staged_not_in_binding_set BY PREFIX AND COUNT.'
    - 'DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This task archives and plans; it does not review.'
    - 'RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output. Any scalar bound is either MEASURED here or quoted WITH ITS PROVENANCE AND MARKED UNVERIFIED (BR-6).'
    - 'Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.'
    - 'WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13); the review plan and an assignment document are two of the five files this campaign has already shipped unparseable.'
  required_disclosures_in_staged_not_in_binding_set:
