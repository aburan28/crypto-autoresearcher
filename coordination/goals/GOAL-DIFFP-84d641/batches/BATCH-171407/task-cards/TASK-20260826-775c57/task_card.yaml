      states in advance which items are scored individually in every case, which become VOID
      rather than WRONG if the trigger fires, and which is CONFIRMED IN ITS STRONGEST FORM.
      HONOUR THAT RULE OR RECORD EXPLICITLY WHY NOT -- round 3's trigger fired and its addendum
      departed from it, and the close had to rule on the departure.
    - >-
      AN EXPLICIT ADJUDICATION OF COMPLETION CRITERION 4 FROM THE TWO admissibility_ruling BLOCKS
      ACTUALLY RECEIVED, CONJUNCT BY CONJUNCT, never from the joint scalars and never from the
      batch shape. IT REQUIRES THAT BOTH SESSIONS ADMIT. Silence on a conjunct is not an admission
      and reading it as one would be manufacturing one. IF IT IS REFUSED A THIRD TIME, THAT IS A
      RESULT AND IS RECORDED AS ONE.
    - 'A RULING ON THE ROUND''S INDEPENDENCE FROM THE ATTESTATIONS RATHER THAN THE PLAN''S INTENT, stating whether BR-14''s and BR-16''s fixes actually held, either way.'
    - 'knowledge_promotion FILLED, with a concrete not_warranted reason if nothing is promoted.'
    - 'THE CLAIM CEILING STATED AS `analyzed` EXPLICITLY.'
    - >-
      IF ANYTHING IS WEAKENED OR CLOSED, A COMPLETE `obstruction` BLOCK with a quantity, units,
      honest error bars NAMING WHICH VARIABILITY IS UNMEASURED, the runs it is read from, its
      scope and its resource_check. PROSE DOES NOT DISCHARGE THE CLOSURE GATE.
    - >-
      THE PROCEED-OR-PAUSE ADJUDICATION, WHICH THIS BATCH'S OPENING DECLARED IN ADVANCE. On the
      declared-allocation accounting this batch consumes the entire remaining 2550 s, so the close
      must choose explicitly among (i) PAUSE under pause_condition 1 with the machinery, the
      measurement and the gap recorded and the goal left `active` with one next action preserved;
      (ii) AN EXPLICITLY USER-AUTHORISED CEILING RAISE; or (iii) A REDUCED-SHAPE BATCH 5 funded by
      a user-authorised reallocation. IT MAY TAKE NONE OF THEM UNILATERALLY, and it may NOT retire
      the goal under `closed_at_budget` to understate a criterion that was met.
    - >-
      A RANKED next_action_ranking AGAINST REAL ALTERNATIVES, each loser carrying its evidence,
      its budget, its test boundary, its remaining uncertainty and a CONCRETE revisit condition.
      Nothing is closed, deprioritised on the merits or screened out by silence.
  hard_rules:
    - 'RUNS ALONE, and stages only the declared paths. Do not stage dispatch_queue.json, claims/ or knowledge/INDEX.md, which is GENERATED AND GITIGNORED.'
    - 'ledger/evidence is limited to EXACTLY ONE new file and ledger/decisions to EXACTLY ONE new file. The OPENING decision DEC-20260826-5aaddc is already filed and is not this task''s to write.'
    - 'EDIT THE GOAL HEAD ADDITIVELY ONLY, as a lane: append this batch''s checkpoint, this lane''s entry and its own next_action line, and never rewrite another lane''s entries.'
    - 'Merge origin/main before the archive (MERGE, NEVER REBASE), record the base and outcome, and push and refresh THIS LANE''S PR after -- see batch.yaml PD-1, because PR #561 is merged and #562 carries batch 3.'
    - 'VERIFY VALIDITY BEFORE INTERPRETING ANYTHING. A timeout, crash or check_run rejection is INFRASTRUCTURE SIGNAL and never a mathematical result in either direction.'
    - >-
      COMPOSE, DO NOT COUNT. A blinded reviewer's scalar verdict is a lossy roll-up the checker's
      schema requires; the per-joint maps govern. Where the two reports agree, the agreement is
      TWO observations only when mutual blindness demonstrably held for that object AND the two
      reached it BY DIFFERENT MECHANISMS; otherwise it is ONE observation reached twice, and the
      discount is stated AT THE POINT OF USE.
    - >-
      ADJUDICATE A GREEN TOOL AS CAREFULLY AS A FAILURE. tools/check_review_independence.py's leak
      test covers the RE-DERIVER ONLY and is not run against the other reviewer's sources_read at
      all; it cannot check read order and cannot see a prior embedded in a document it validates.
      A PASS IS NOT MECHANICAL VERIFICATION FOR BOTH REVIEWERS AND MAY NOT BE DESCRIBED AS ONE.
    - >-
      IF ANY ADVERSE TRANSITION IS PROPOSED, SECURE THE STRONGEST CHECKABLE REFUTATION ARTIFACT
      THE RESULT ADMITS FIRST -- counterexample certificate, then derivation note, then a declared
      empirical_only basis -- archive it before the decision, and record proof_status and
      proof_refs. `reject_scoped` ON A SINGLE UNREPLICATED EMPIRICAL-ONLY RUN IS FORBIDDEN.
    - 'DO NOT CLAIM ANY PATH IS NEW and do not let any NON-MEMBER verdict be written or implied as novelty. State the census''s completeness beside every verdict cited, never summed.'
    - 'THE MD5 LANE IS BLOCKED, NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged and the Tier B unblocking route is intact.'
    - 'A FAILING CONTROL, A REFUTED PRE-REGISTRATION, A GATED-NOT-RUN STAGE OR AN EXHAUSTED TASK BUDGET ENDS A TASK, NOT THIS GOAL. Preserve exactly one concrete next action for this lane.'
    - >-
