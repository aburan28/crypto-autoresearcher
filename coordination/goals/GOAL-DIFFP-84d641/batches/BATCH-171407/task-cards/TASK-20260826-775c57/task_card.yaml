  mandatory_content_of_the_closing_decision:
    - >-
      A VALIDITY CHECK RECORDED BEFORE ANY INTERPRETATION: expected run count; schema-complete
      manifests carrying the literal id EXP-DIFFP-f26790; seed integrity over the eight declared
      seeds with NO NINTH; raw-versus-summary agreement; CTL-FROZEN-4 before/after identity; and
