      specified in full in DEC-20260824-257f35, the CTL-GRAPH-NULL versioned protocol_amendment,
      and the goal-head garbled-sentence correction specified in DEC-20260826-5aaddc. A CORRECTION
      IS OWED, NOT CHOSEN, and an obligation that vanishes from the record is the failure.
    - >-
      IF A KNOWLEDGE PROMOTION IS WARRANTED YOU WILL NEED AN IDENTIFIER AND A DECLARED PATH THIS
      BATCH DID NOT PRE-ALLOCATE. That constraint is NAMED IN DEC-20260826-5aaddc rather than
      discovered here, and if it binds, SAY THAT THE REASON IS THE MISSING IDENTIFIER AND NOT THE
      MERITS.
