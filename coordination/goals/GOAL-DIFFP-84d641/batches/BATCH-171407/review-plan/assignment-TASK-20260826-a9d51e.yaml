  proves_too_much_is_yours:
    assigned_joint: R4-J4
    also_bears_on: 'R4-J5 and R4-J6, which own the independence argument and the arm-(b) argument and may be answered from the same objects.'
    where_it_lives: 'review-plan.yaml `proves_too_much`, with a top-level `failure_signature` roll-up (BR-4), three named arguments and seven objects O-Q1..O-Q7.'
