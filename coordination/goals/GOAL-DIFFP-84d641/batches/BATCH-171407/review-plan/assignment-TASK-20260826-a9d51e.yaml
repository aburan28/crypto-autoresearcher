      ARGUMENT REFUSES AN OBJECT, say WHICH part of the package did the refusing and with what
      measurement -- that is the control firing and it is a genuine, reportable strength. A REPORT
      THAT NEITHER SURVIVES NOR REFUSES HAS NOT RUN THE CONTROL. "The argument looks fine" is not an
      outcome. "No object was found within budget, and here is what was tried" IS an outcome, and it
      is a bounded negative and never an impossibility result.
