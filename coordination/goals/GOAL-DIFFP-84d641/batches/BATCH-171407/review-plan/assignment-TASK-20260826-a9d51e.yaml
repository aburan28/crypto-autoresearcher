      'Independent Validator and Red Team sessions admit each claim-relevant run package, verifying
      controls, certificates, the census provenance, the equivalence generators'' verification status,
      and the absence of uncharged preprocessing, memory, oracle or randomness assumptions.'
    the_five_conjuncts:
      - 'CONJUNCT 1 -- CONTROLS: present, two-sided where declared two-sided, run through the paths they claim, and CAPABLE OF FAILING.'
      - >-
        CONJUNCT 2 -- CERTIFICATES: does every claimed solve, relation or membership carry the
        certificate its claim tier requires, independently re-verified? The package declares these as
        pure measurement runs with certificate kind `none`; whether that is the correct discharge of
        this conjunct, or whether the conjunct does not apply, is part of your answer and NOT IN MY
        SCOPE WITH THE REASON is an available answer.
      - >-
        CONJUNCT 3 -- CENSUS PROVENANCE: completeness stated beside every verdict it bears on, never
        summed, quarantined entry unread by a named mechanism, shadow population carried separately.
      - >-
        CONJUNCT 4 -- THE EQUIVALENCE GENERATORS' VERIFICATION STATUS: stated at the strength it
        actually has, wherever a verdict depends on the orbit minimisation those generators define.
      - >-
        CONJUNCT 5 -- THE ABSENCE OF UNCHARGED PREPROCESSING, MEMORY, ORACLE OR RANDOMNESS
        ASSUMPTIONS: does anything reported depend on work that was not charged, memory that was not
        declared, an oracle that was not named, or randomness that was not seeded and declared? The
        package declares uncharged probe executions and unit-test invocations; decide whether the
        contract's own definition of a charged run covers them honestly.
    what_this_is_not: >-
      IT IS NOT A CHANGE TO THE CRITERION AND IT IS NOT A LOWERING OF THE BAR. THE CRITERION'S TEXT IS
      UNCHANGED AND NO protocol_amendment IS REQUIRED. **A `breaks` ON AN OWNED JOINT REMAINS A
      BREAK** and is not converted into an admission by anything in this block. What changes is only
      that the round asks the criterion's own question directly instead of inferring the answer from
      verdicts about something else, because "this joint breaks" and "I do not admit this run package"
      are different statements. CUTTING JOINTS UNTIL NOTHING BREAKS WOULD SATISFY THE CRITERION'S
      LETTER AND DESTROY IT, AND IF YOU JUDGE THAT THIS ROUND'S SIX-JOINT SHAPE DOES THAT, SAY SO --
      IT IS AN AUTHORISED FINDING AGAINST THE PLAN.
    you_may_refuse_on_all_five: >-
      EXPLICITLY AND WITHOUT PENALTY. YOU MAY ANSWER DO NOT ADMIT ON ALL FIVE CONJUNCTS AND THAT WOULD
      BE A RESULT AND WOULD BE RECORDED AS ONE. The criterion has been refused twice and may well be
      refused a third time. NOTHING IN THIS ROUND'S SHAPE IS INTENDED TO MAKE ADMISSION MORE LIKELY.
    silence_is_not_an_admission: >-
      IF YOU DO NOT REACH A CONJUNCT, SAY SO AND SAY WHAT YOU TRIED. The close records an unanswered
      conjunct as UNANSWERED and never as admitted.

