      verdicts under the contract's counting rule. REPORT THE COUNT AS AN INTEGER BESIDE THE NUMBER OF
      CELLS YOU ADJUDICATED AND YOUR OWN EXCLUDED-CELL LIST, per instrument and per primitive, never
      as a fraction, a pass, a score or a margin. WHERE YOUR DERIVATION REQUIRES YOU TO CHOOSE A
      READING OF AN UNDER-DETERMINED CLAUSE, RECORD THE CHOICE AND WHY YOU MADE IT BEFORE YOU COMPARE
