    - id: R4-J5
      joint: R4-J5
      alias: R-b
      assigned_to: TASK-20260826-a9d51e
      statement: >-
        IS THE INDEPENDENCE REAL, AND IS `REPLICATION` THE RIGHT LABEL? The producer attests
        non-reading of a named forbidden implementation path and backs part of that attestation
        with an in-process mechanism: an audit hook installed before any substrate import that
        raises on any open under three declared prefixes, plus a run-time assertion over loaded
        modules. It states, unprompted, that the SESSION-level boolean -- whether the producing
        agent read those files with a tool outside the Python process -- is honest and that NO
        TOOL IN THIS REPOSITORY CAN VERIFY IT. ESTABLISH WHAT THE ATTESTATION IS WORTH, WHERE THE
        MECHANICAL PART STOPS AND THE ATTESTED PART BEGINS, AND WHETHER THE WORD `REPLICATION`
        SURVIVES THE GAP. This joint also carries the blind re-derivation.
      attack_plan: >-
        FIRST, DO THE BLIND RE-DERIVATION, BEFORE ANYTHING ELSE AND BEFORE READING ANYTHING UNDER
        THE PRODUCER'S TASK DIRECTORY. See `blind_rederivation` below: it is assigned to you, its
        blind_from list is the ONE independence property this round can test mechanically, and
        round 3 records that assigning it was THE SINGLE PROCEDURAL DECISION THAT PRODUCED NEW
        FINDINGS, both of that reviewer's strongest objects having come out of it. Honour the
        blind_from BY MECHANISM as your card requires -- assert at run time that the producer's
        module is absent from sys.modules -- and state the executed sequence honestly.
        THEN ATTACK THE MECHANISM ITSELF RATHER THAN THE PROMISE. An audit hook is a real
        instrument and it has a real boundary. Determine what it does and does not cover:
        whether it is installed before every import that matters; whether the events it hooks are
        the events a read would raise; whether any in-process route reaches a file without one of
        those events; whether a path comparison could be defeated by a symlink, a relative path,
        a case difference or a normalisation; and what happens to the run if it fires. THEN STATE
        THE BOUNDARY IN ONE SENTENCE A CLOSE CAN COPY: exactly which population of possible reads
        the hook rules out.
        THEN THE PART NO MECHANISM COVERS, AND IT IS THE POINT OF THE JOINT. The producing SESSION
        is an agent with file-reading tools that are not the Python process. Its non-reading is a
        boolean in a file. ASK WHAT WOULD HAVE TO BE TRUE FOR THAT BOOLEAN TO BE CHECKABLE AT ALL,
        AND WHETHER ANY MECHANISM AVAILABLE TO THIS REPOSITORY WOULD DO IT. If you find one, that
        is worth more to this program than the arm it would validate, and it should be stated as a
        concrete, budgetable proposal. If you find none, say that plainly, because a program that
        knows which of its guarantees are unverifiable is in better shape than one that does not.
        THEN THE LABEL. The contract's own invalidation rule says a read of the forbidden path
        DOWNGRADES the label from REPLICATION to RE-EXECUTION and does not discard the arithmetic.
        BUT THERE IS A THIRD POSSIBILITY THE CONTRACT DOES NOT NAME AND YOU SHOULD RULE ON IT: the
        producer was REQUIRED by hard term H-1 to read two committed research records that STATE
        the control, the identity of the differing cell and the predecessor's integer in prose. AN
        IMPLEMENTATION THAT WAS TOLD THE ANSWER IN PROSE IS INDEPENDENT OF THE CODE AND NOT BLIND
        TO THE VALUE. DECIDE WHETHER `REPLICATION` NAMES INDEPENDENCE OF THE IMPLEMENTATION,
        BLINDNESS TO THE RESULT, OR BOTH, AND SAY WHICH ONE THIS ROUND ACTUALLY ACHIEVED. Propose
        the exact label the close should use.
        FINALLY THE WEIGHTING, WHICH THE CLOSE WILL OTHERWISE GET WRONG. CONTAMINATION PUSHES
        TOWARD AGREEMENT AND NOT AWAY FROM IT. Say how a close should weight a MATCHING outcome
        against a DIFFERING one under the independence you have just characterised, and say what
        it should do with the MIXED case -- agreement on one reported quantity and disagreement on
        another -- because that case is available here and neither the contract nor the
        predecessor decision names it.
      breaking_artifact: >-
        A demonstrated route by which the in-process mechanism could be evaded or could fail
        silently; or a concrete mechanism that would make the session-level boolean checkable; or
        a ruling, with the committed text it rests on, that `replication` overstates what this
        round achieved, together with the label that does not. A bounded negative -- what you
        tried against the hook and why it held -- is a result and is reported as one.

    - id: R4-J6
      joint: R4-J6
      alias: R-c
      assigned_to: TASK-20260826-a9d51e
      statement: >-
        ARM (b) AND THE CLOSURE ATTACK. Does the new family DECLARE WHAT IT ACTUALLY MOVES, on
        each primitive separately? Is its per-primitive constructibility result a DERIVED FACT
        about the key format and the gate, reported with its derivation, or a family that
        produced nothing wearing a derivation? And -- premature closure being a failure mode
        SYMMETRIC WITH OVERCLAIMING -- is any lane, direction or open item being quietly closed
        anywhere in this batch by a report wearing a number?
      attack_plan: >-
        FIRST THE DECLARATION AGAINST THE MEASUREMENT, BECAUSE THIS IS THE EXACT DEFECT ROUND 3
        MEASURED. The predecessor's diagonal theorem had a FALSE hypothesis on one primitive
        because a committed perturbation constructor honestly recomputes a second component, so a
        family declared to move one component moved two. This batch's answer is a control that
        measures the moved set through the committed serialiser rather than trusting the
        declaration. VERIFY IT YOURSELF ON BOTH PRIMITIVES: build draws, serialise the source and
        the draw with the committed serialiser, diff component by component, and compare against
        what the family declares it moves and what it declares it holds fixed. Then ask the
        harder question the control cannot ask itself: IS THE DECLARED MOVED SET THE RIGHT
        DESCRIPTION OF THE PERTURBATION, OR MERELY A TRUE ONE? A family that moves two components
        in a way that is forced by consistency is a different object from one that moves two
        independently, and the cells it can populate differ accordingly.
        THEN THE PER-PRIMITIVE SPLIT. The family is offered to the committed gate on both
        primitives and the outcome is not the same on both. WHERE THE GATE REFUSES IT, VERIFY
        THAT THE REFUSAL IS DERIVED AND NOT MEASURED-AND-NARRATED: check the named gate clause,
        check the derivation against the committed serialiser, and check that the alternative
        construction the producer names as a no-op really would be an existing family under a new
        name. THEN RULE ON THE CONSEQUENCE, WHICH IS NOT YOURS TO DECIDE BUT IS YOURS TO FRAME:
        the contract pre-registers at P-C what a refutation means and forbids reporting a
        non-constructible family as one that produced zero detections. DOES A PER-PRIMITIVE SPLIT
        TRIGGER THAT CLAUSE, PARTIALLY TRIGGER IT, OR FALL OUTSIDE IT? Say which, and say what the
        honest per-primitive sentence is.
        THEN NULL FAMILY (e), WHOSE ONLY NAMED REPAIR THIS FAMILY IS. DEC-20260824-257f35 retired
        the original family substantively and this batch's arm (b) is the single named
        replacement. DETERMINE WHETHER THAT DIRECTION IS PRESERVED AS OPEN WITH A CONCRETE
        REVISIT CONDITION, PER PRIMITIVE, OR QUIETLY RETIRED BY HAVING ITS REPLACEMENT MEASURED
        ONCE. If a primitive is left with no named repair, say so explicitly and say what the
        close owes -- a new named repair, or an argued retirement with an obstruction block of its
        own. A DIRECTION THAT DIES BECAUSE NOBODY WROTE DOWN THAT IT NEEDED SOMETHING IS THE
        FAILURE MODE HERE.
        THEN GO AFTER EACH CLOSURE CANDIDATE BY NAME.
        THE MD5 LANE, which AMD-20260824-DIFFP-ACQ-1 holds BLOCKED and explicitly NOT CLOSED with
        a named unblocking route through a GOAL-MD5-001 decision, and which the frozen contract
        forbids any record of this batch from stating or implying is closed. DOES ANY RECORD OF
        THIS BATCH -- the batch record, the contract, this plan, either assignment, the producer's
        artifacts -- state or imply it is exhausted, deprioritised on the merits, or screened out?
        QUOTE THE SENTENCE IF THERE IS ONE. Round 2's and round 3's adversaries were both tasked
        with this search and both reported finding none; a third null is a real measurement and is
        reported as one.
        THE FIVE UNREPAIRED INSTRUMENT ITEMS AND THE FOUR UNREPLICATED SURVIVORS, open for a
        fourth consecutive batch. Are they open on their merits with concrete revisit conditions,
        or open in the way a thing is open when nobody intends to return to it? The batch record
        claims the first; check the claim.
        AND THE CLOSURE CANDIDATE THAT IS THIS COORDINATOR'S RATHER THAN THE PRODUCER'S: THE
        SIX-JOINT CUT AND THIS PLAN ITSELF. This round cut round 3's eight joints to six and
        declared what the cut loses, including that the generator-action region goes unaudited for
        a SECOND consecutive round. DECIDE WHETHER THE CUT REMOVED THE ATTACK SURFACE ON WHICH THE
        PREVIOUS ROUNDS' MOST VALUABLE OBJECTS WERE ACTUALLY FOUND, and if so say so plainly. A
        FINDING AGAINST THIS PLAN, THIS BATCH'S OPENING OR THIS COORDINATOR ROLE IS IN SCOPE FOR
        THIS JOINT, IS NOT A COURTESY, AND IS NOT DISCOUNTED FOR BEING UNCOMFORTABLE.
      breaking_artifact: >-
        A draw whose measured moved set differs from what the family declares; or a
