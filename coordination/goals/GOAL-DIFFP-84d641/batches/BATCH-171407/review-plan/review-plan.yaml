    failure_signature: >-
      TOP-LEVEL ROLL-UP (BR-4), IN ADDITION TO THE PER-OBJECT SIGNATURES BELOW.
      THERE ARE THREE ARGUMENTS IN THIS PACKAGE AND EVERY OBJECT BELOW MUST BE RUN AGAINST THE
      ONE IT IS PAIRED WITH, UNCHANGED.
      ARGUMENT A, THE COUNTING ONE: that a differing-cell count computed over the cells NOT FORCED
      FOR AN INSTRUMENT carries information about the instruments compared.
      ARGUMENT B, THE INDEPENDENCE ONE: that arm (a) is a REPLICATION -- a second implementation
      derived from a written statement -- so that agreement between it and the predecessor's
      single-session result corroborates that result.
      ARGUMENT C, THE ARM-(b) ONE: that a family declared to move the flag and the message
      difference together, offered to the committed gate per primitive, probes whether the
      instrument separates in-code from out-of-code objects.
      THE ARGUMENT MUST FAIL ON EVERY OBJECT BELOW, because every object below is one for which
      the paired conclusion is KNOWN FALSE. IF AN ARGUMENT SUCCEEDS ON ANY OF THEM IT HAS PROVED
      TOO MUCH and it is wrong somewhere that has not been read closely enough: name the object,
      name the STEP at which the survival happens, and give that step's measurement. IF AN
      ARGUMENT REFUSES AN OBJECT, say WHICH part of the package did the refusing and with what
      measurement -- that is the control firing and it is a genuine, reportable strength. A REPORT
      THAT NEITHER SURVIVES NOR REFUSES HAS NOT RUN THE CONTROL. "The argument looks fine" is not
      an outcome. "No object was found within budget, and here is what was tried" IS an outcome,
      and it is a bounded negative and never an impossibility result.
      BUILD EVERY ADVERSARIAL INSTRUMENT AS A RUN-TIME PROJECTION OR WRAPPER AND NEVER AS AN EDIT
      TO A COMMITTED FILE UNDER harness/ -- a modification would trip the frozen-identity control
      and would invalidate the producer's package as well as your own finding.
    objects:
      - id: O-Q1
        pairs_with: ARGUMENT A
        object: >-
          THE DEGENERATE INSTRUMENT THAT RETURNS NON-MEMBER FOR EVERY OBJECT, already built and
          already run through the identical counting path as one of this round's own null-object
          controls, considered as an object rather than as a control that passed.
        why_its_conclusion_is_known_false: >-
          It identifies nothing whatsoever. Any argument that reads a differing-cell count as
          evidence ABOUT AN INSTRUMENT must refuse this object, because whatever its count is, the
          count is not evidence that this object is a usable adjudicator.
        failure_signature: >-
          DETERMINE WHETHER THE COUNT SEPARATES THIS OBJECT FROM THE HONEST INSTRUMENT AND WHETHER
          ITS ARM COULD HAVE FAILED AT ALL. If the arm's required extreme is zero, the arm cannot
          fail and its met extreme is bookkeeping; say so, and say what would have to replace it.
          If the count cannot separate an instrument that identifies nothing from the honest one,
          the count is a DIAGNOSTIC AND NEVER A DECISION VARIABLE and every artifact leaning on it
          must be re-read in that light.
      - id: O-Q2
        pairs_with: ARGUMENT A
        object: >-
          THE DEGENERATE INSTRUMENT THAT RETURNS MEMBER FOR EVERY OBJECT, likewise already run.
        why_its_conclusion_is_known_false: >-
          It accepts everything and therefore identifies nothing, while passing a planted-positive
          check trivially. Its differing-cell behaviour is a property of the counting code rather
          than of any family set.
        failure_signature: >-
          The argument must not treat this object's behaviour as showing that THE FAMILY SET can
          produce a large count. If the capacity argument rests on this object alone, the capacity
          demonstrated is the counting rule's and not the experiment's, and the report must say
          which one was demonstrated. NOTE ALSO THAT BOTH DEGENERATE INSTRUMENTS ARE GIVEN THE
          IDENTITY PROJECTION FOR CELL SELECTION BY DECLARATION, so their forced sets equal the
          identity's BY CONSTRUCTION -- decide whether that makes their arms weaker than they look.
      - id: O-Q3
        pairs_with: ARGUMENT A
        object: >-
          A THIRD READING OF THE FORCING PREDICATE, BUILT AND RUN. See R4-J4's attack plan for
          four candidates; the list is a floor.
        why_its_conclusion_is_known_false: >-
          Not known false as an object but known false as a premise: the package's framing presumes
          the contract's statement admits exactly the two readings the producer declared. If a
          third admissible reading exists and gives a third cell set, then the quantity is a
          property of a reading and the presumption is false.
        failure_signature: >-
          If a third reading gives a different cell set, ARGUMENT A must not continue to describe
          its quantity as a property of the instruments. If no third reading exists, say what
          bounds the space of readings and how you established the bound -- an exhaustive-looking
          argument that is not exhaustive is worse than an honest bounded negative.
      - id: O-Q4
        pairs_with: ARGUMENT A
        object: >-
          AN INSTRUMENT BLIND TO THE FLAG COLUMN ON SHA-1 -- a run-time projection dropping
          in_linearized_code on that primitive only, built the same way the reused known-false
          instrument is built.
        why_its_conclusion_is_known_false: >-
          It cannot adjudicate the very column the round's comparison turns on, so it identifies
          strictly less than the honest instrument by construction. Yet the per-instrument forcing
          rule, applied to it, re-admits cells for it -- possibly more than for the honest
          instrument, since removing a component can only remove determiners.
        failure_signature: >-
          IF THIS OBJECT IS RE-ADMITTED MORE CELLS THAN THE HONEST INSTRUMENT, THE RULE REWARDS
          BLINDNESS WITH ADJUDICATION SURFACE, AND ARGUMENT A MUST EXPLAIN WHY THAT IS NOT WHAT ITS
          QUANTITY MEASURES. This object is cheap and is named because it is the most direct test of
          question (3) in R4-J4.
      - id: O-Q5
        pairs_with: ARGUMENT B
        object: >-
          THE PRODUCER'S OWN REQUIRED READING LIST. Hard term H-1 REQUIRES the producer to read two
          committed research records that state the control, the identity of the differing cell and
          the predecessor's integer in prose, while the audit hook blocks only the implementation.
        why_its_conclusion_is_known_false: >-
          An implementation that was told the answer in prose is not blind to the answer, whatever
          a hook proves about a module. So the conclusion "the second implementation independently
          arrived at the same result" is known false as stated, however sound the arithmetic is.
        failure_signature: >-
          ARGUMENT B MUST EITHER REFUSE THE WORD `INDEPENDENT` FOR THE VALUE AND KEEP IT ONLY FOR
          THE IMPLEMENTATION, OR IT HAS PROVED TOO MUCH. If it refuses correctly, say so and name
          the label the close should use; that refusal is the control firing and is a strength.
      - id: O-Q6
        pairs_with: ARGUMENT C
        object: >-
          THE NO-OP DRAW THE PRODUCER ITSELF NAMES: on the primitive where the flag is not a key
          component, a draw that perturbs the message difference and leaves the flag alone, which
          the gate would accept.
        why_its_conclusion_is_known_false: >-
          Such a draw would report the family CONSTRUCTIBLE on that primitive while being an
          existing single-component family under a new name, so the conclusion "this family probes
          whether the instrument separates in-code from out-of-code objects" would be false of it.
        failure_signature: >-
          ARGUMENT C MUST REFUSE THIS DRAW, AND THE REFUSAL MUST COME FROM THE FAMILY'S DECLARATION
          RATHER THAN FROM THE GATE ALONE. If the refusal comes only from the gate, then the
          family's declaration is doing no work and the per-primitive result is a fact about the
          gate. Say which.
      - id: O-Q7
        pairs_with: 'WHICHEVER ARGUMENT IT BEARS ON, AND IT IS YOURS TO NAME'
        object: >-
          RESERVED, DELIBERATELY, FOR THE OBJECT THIS PLAN'S AUTHOR DID NOT IMAGINE. It is listed
          as an object rather than as an invitation because round 2 measured that the plan's
          candidate list did NOT bound the pass -- three of that round's objects were none of them
          on it and one lay outside the class the contract's lattice could express -- and round 3
          measured that its single most valuable finding was found incidentally in a region no joint
          owned.
        why_its_conclusion_is_known_false: >-
          Unknown by construction. That is the point: the author of the argument is the reader least
          able to find the object that breaks it.
        failure_signature: >-
          If you exhibit one, the close must present it as THIS PLAN'S LIMIT and not as this plan's
          success, and must record which of the three arguments it bears on.

  # =====================================================================
  blind_rederivation:
    required: true
    assigned_to: TASK-20260826-a9d51e
    quantity: >-
      THE LOAD-BEARING QUANTITY OF THIS ROUND: THE PER-INSTRUMENT PARTITION OF THE CANDIDATE CELL
      UNIVERSE INTO ADJUDICATED AND EXCLUDED, AND THEN THE DIFFERING-CELL COUNT OVER THE ADJUDICATED
      PART. Stated as the re-deriver must start from it, with no value attached and no denominator
      supplied: for the complete matrix of the gate-constructible perturbing families against the
      depth-1 single-deletion rows of the strict membership key, on each primitive, and FOR EACH
      INSTRUMENT IN SCOPE SEPARATELY, determine which cells that instrument's forcing predicate
      excludes and under which reason, with the forcing edge named for each; then, over the cells it
      leaves adjudicated, determine the number of cells on which the honest instrument and the
      reused per-primitive-blind known-false instrument give DIFFERENT cell verdicts under the
      contract's counting rule. Report the count as an INTEGER beside the number of cells YOU
      adjudicated and YOUR OWN excluded-cell list, per instrument and per primitive, never as a
      fraction, a pass, a score or a margin (H-5, IR-10). WHERE YOUR DERIVATION REQUIRES YOU TO
      CHOOSE A READING OF AN UNDER-DETERMINED CLAUSE, RECORD THE CHOICE AND WHY YOU MADE IT BEFORE
      YOU COMPARE ANYTHING.
    parameters: >-
      The eight seeds frozen in EXP-DIFFP-f26790 `inputs.seeds`; the census built by the committed
      builder at the two declared planted-path seeds, with the quarantine attestation stubbed or
      bypassed so that no byte of the quarantined payload is read by any route; the committed
      adjudicator, the committed strict generator set and the committed orbit minimisation, with
      the row's deletion applied as a projection INSIDE the minimisation exactly as the closed
      predecessor contract specifies; strict mode only, permissive out of scope; the cell verdict
      rule as the contract states it; the forcing predicate as the contract states it, which is the
      statement whose under-determination is R4-J4's subject; and the known-false instrument
      IMPORTED from the closed batch's committed constructions file rather than rebuilt (IR-11).
    blind_from:
      - coordination/goals/GOAL-DIFFP-84d641/sealed-priors
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/reviews/TASK-20260826-422106
      - harness/diffpath/readmit.py
      - tests/test_diffpath_readmit.py
    why_the_producers_own_module_is_named_and_what_it_costs: >-
      THE PRODUCER'S IMPLEMENTATION OF EVERYTHING THIS ROUND MEASURES IS harness/diffpath/readmit.py,
      AND ITS TEST FILE IS tests/test_diffpath_readmit.py. A RE-DERIVATION THAT READ EITHER WOULD BE
      A RE-EXECUTION OF THE PRODUCER'S CODE AND NOT AN INDEPENDENT APPLICATION OF THE CONTRACT, AND
      THE TWO CHECK DIFFERENT THINGS: re-running the module checks that the reported number is what
      that code produces, and re-implementing the declared rule checks that the code implements the
      contract. THE FIRST CHECK IS THE VALIDATOR'S UNDER R4-J1 AND R4-J2 AND THE CLOSE WILL RECEIVE
      BOTH. The checker's leak test is ORDER-BLIND -- it compares declared sources_read against
      blind_from and reports a leak whenever a prefix appears, regardless of when it was read -- so
      "read it after writing my derivation down" is not available and is not offered.
      THE COST, DECLARED AT OPENING RATHER THAN DISCOVERED: ONE SUB-CHECK OF R4-J4 IS NOT AVAILABLE
      TO THE RED TEAM BECAUSE OF THIS. Whether the two readings were declared as module constants
      BEFORE any run is a fact about the module's source, and the Red Team cannot read the module.
      THAT SUB-CHECK IS ASSIGNED EXPLICITLY TO THE VALIDATOR UNDER R4-J2 so it is not dropped by
      both, and the boundary is stated in both assignment documents. The Red Team rules on WHICH
      READING THE CONTRACT ADMITS and on WHAT FOLLOWS, which is answerable from committed text.
    what_this_blind_from_BUYS_stated_precisely_because_it_is_less_than_the_field_name_suggests: >-
      THREE MECHANICALLY CHECKED PROPERTIES, EACH REAL AND EACH NARROWER THAN "BLIND".
      (1) THE RE-DERIVER DID NOT READ THE COORDINATOR'S SEALED PRIOR -- for the second consecutive
      round the seal is machine-testable for one reviewer.
      (2) THE RE-DERIVER DID NOT READ ITS SIBLING'S REPORT, so sibling blindness is a checked
      property rather than an attested one for that reviewer.
      (3) THE RE-DERIVER DID NOT READ THE PRODUCER'S IMPLEMENTATION OR ITS TEST FILE.
    what_this_blind_from_DOES_NOT_BUY: >-
      IT DOES NOT BUY BLINDNESS TO THE VALUE, AND CALLING IT THAT WOULD BE A FAKE SEAL. The
      producer's committed execution report states its quantities in prose, as the contract's H-5
      and IR-10 require it to, and EVERY REVIEWER MUST READ THAT REPORT TO DISCHARGE ANY JOINT AT
      ALL. Naming the producer's task directory in blind_from would guarantee one of two bad
      outcomes: a checker FAIL at the close against a reviewer that did nothing wrong, or an
      incomplete `sources_read`, which is a dishonest attestation and far worse than a weaker
      blind_from. THE VALUE-BLINDNESS SUBSTANCE IS THEREFORE CARRIED SEPARATELY, BY
      `independent_derivation_before_reading` BELOW, AND IT RESTS ON THE RE-DERIVER'S HONEST
      BOOLEAN, WHICH NO TOOL IN THIS REPOSITORY CAN CHECK. A matching independent derivation with
      `derived_before_reading: true` is CORROBORATION AND NOT PROOF OF INDEPENDENCE, and the close
      must use exactly those words.
    why_the_RED_TEAM_and_not_the_validator: >-
      TWO REASONS AND THE FIRST IS DECISIVE ON FEASIBILITY. (1) THE VALIDATOR MUST READ THE
      PRODUCER'S NEW MODULE AND ITS TEST FILE TO DISCHARGE R4-J1 AND R4-J2 -- both are in its
      committed read_scope precisely so that it can -- so assigning the re-derivation to the
      Validator would guarantee a leak against the third and fourth blind_from entries. (2) THE
      RED TEAM IS THE REVIEWER WHOSE INDEPENDENCE FROM THE COORDINATOR'S PRIOR IS WORTH THE MOST,
      because it owns the joints where a prior would most bias a reading.
    the_escape_hatch_and_it_is_not_a_loophole: >-
      IF DISCHARGING AN ASSIGNED JOINT GENUINELY REQUIRES READING A blind_from PATH, DO NOT READ IT
      SILENTLY AND DO NOT DROP THE JOINT. Say what you needed and why. If you judge reading it
      unavoidable, READ IT AND DECLARE IT in sources_read with `blind_from_respected: false` and the
      reason. AN HONEST FALSE IS WORTH MORE THAN A MATCHING TRUE THAT IS NOT TRUE: it makes the
      close's checker run a disclosed, adjudicable event instead of a hidden one, and the close
      records it as a bounded gap rather than as a defect in the review.
    granularity_requirement_without_which_the_leak_test_cannot_fire: >-
      LIST `sources_read` AT FILE GRANULARITY FOR ANYTHING UNDER harness/ AND UNDER THE PRODUCER'S
      TASK DIRECTORY. The checker matches a declared source against a blind_from prefix with
      `r == b or r.startswith(b.rstrip("/") + "/")`, so a coarse entry naming a DIRECTORY cannot
      match a blind_from entry naming a FILE INSIDE it, and the leak test would pass while the file
      had been read. THIS IS A KNOWN LIMIT OF THE TEST, NOT A WAY AROUND IT, and it is written here
      so that the attestation is what makes the check work rather than what defeats it.

  independent_derivation_before_reading:
    applies_to: [TASK-20260826-422106, TASK-20260826-a9d51e]
    the_instruction: >-
      BEFORE OPENING ANY FILE UNDER
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660, derive
