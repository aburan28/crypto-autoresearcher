  admissibility_ruling_requirement:
    what_each_reviewer_must_write: >-
      AN `admissibility_ruling` BLOCK IN YOUR REPORT, SEPARATE FROM AND IN ADDITION TO YOUR JOINT
      FINDINGS, ANSWERING COMPLETION CRITERION 4'S FIVE CONJUNCTS ONE BY ONE. Each conjunct gets
      exactly one of three answers -- ADMIT, DO NOT ADMIT, or NOT IN MY SCOPE WITH THE REASON -- and
      each answer names the artifact or measurement it rests on.
    the_criterion_quoted_verbatim_and_unchanged: >-
      'Independent Validator and Red Team sessions admit each claim-relevant run package, verifying
      controls, certificates, the census provenance, the equivalence generators'' verification
      status, and the absence of uncharged preprocessing, memory, oracle or randomness assumptions.'
    the_five_conjuncts_enumerated_so_none_is_skipped:
      - >-
        CONJUNCT 1 -- CONTROLS. Are the package's controls present, two-sided where the contract
        declares them two-sided, run through the paths they claim, and capable of failing? An arm
        whose required extreme is zero cannot fail and that bears on this conjunct.
      - >-
        CONJUNCT 2 -- CERTIFICATES. Does every claimed solve, relation or membership carry the
        certificate its claim tier requires, independently re-verified? Note that the package
        declares these as pure measurement runs with certificate kind `none`; deciding whether that
        is the correct discharge of this conjunct, or whether the conjunct simply does not apply,
        is part of your answer and NOT IN MY SCOPE WITH THE REASON is an available answer.
      - >-
        CONJUNCT 3 -- CENSUS PROVENANCE. Is the census completeness stated beside every verdict it
        bears on, never summed, with the quarantined entry unread by a named mechanism and the
        shadow population carried separately?
      - >-
        CONJUNCT 4 -- THE EQUIVALENCE GENERATORS' VERIFICATION STATUS. Is the status of the strict
        generator set stated at the strength it actually has, wherever a verdict depends on the
        orbit minimisation those generators define?
      - >-
        CONJUNCT 5 -- THE ABSENCE OF UNCHARGED PREPROCESSING, MEMORY, ORACLE OR RANDOMNESS
        ASSUMPTIONS. Does anything the package reports depend on work that was not charged, memory
        that was not declared, an oracle that was not named, or randomness that was not seeded and
        declared? The package declares uncharged probe executions and unit-test invocations; decide
        whether the contract's own definition of a charged run covers them honestly.
    what_this_is_NOT_and_the_distinction_is_the_whole_point: >-
      IT IS NOT A CHANGE TO THE CRITERION AND IT IS NOT A LOWERING OF THE BAR. THE CRITERION'S TEXT
      IS UNCHANGED AND NO protocol_amendment IS REQUIRED, because nothing about WHAT MUST BE TRUE has
      changed. The joints are unchanged in kind. **A `breaks` ON AN OWNED JOINT REMAINS A BREAK**,
      and a joint that breaks is not converted into an admission by anything in this block. WHAT
      CHANGES IS ONLY THAT THE ROUND ASKS THE CRITERION'S OWN QUESTION DIRECTLY INSTEAD OF INFERRING
      THE ANSWER FROM VERDICTS ABOUT SOMETHING ELSE -- because "this joint breaks" and "I do not
      admit this run package" are different statements, and both previous rounds determined admission
      by reading it off the joint verdicts.
    a_reviewer_may_refuse_on_all_five: >-
      EXPLICITLY AND WITHOUT PENALTY. YOU MAY ANSWER DO NOT ADMIT ON ALL FIVE CONJUNCTS, AND THAT
      WOULD BE A RESULT AND WOULD BE RECORDED AS ONE. THE CRITERION MAY WELL BE REFUSED A THIRD
      TIME. Nothing in this plan, this round's shape, or the joint count is intended to make
      admission more likely, and CUTTING JOINTS UNTIL NOTHING BREAKS WOULD SATISFY THE CRITERION'S
      LETTER AND DESTROY IT.
    silence_is_not_an_admission: >-
      IF YOU DO NOT REACH A CONJUNCT, SAY SO AND SAY WHAT YOU TRIED. THE CLOSE RECORDS AN UNANSWERED
      CONJUNCT AS UNANSWERED AND NEVER AS ADMITTED, AND READING SILENCE AS AN ADMISSION WOULD BE
      MANUFACTURING ONE.
    how_the_close_uses_it: >-
      THE OVERALL ADMISSION IS COMPOSED BY TASK-20260826-775c57 FROM THE FIVE ANSWERS OF BOTH
      REVIEWERS AND NEVER FROM THE JOINT SCALARS, NEVER FROM THE SHAPE OF THE ROUND, AND NEVER FROM
      THE PRESENCE OF TWO TASK IDS IN A QUEUE.

