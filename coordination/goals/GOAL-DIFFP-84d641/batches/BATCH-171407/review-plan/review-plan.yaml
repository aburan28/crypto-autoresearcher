    blind_from_note: >-
      EVERY ENTRY IS A LITERAL PATH PREFIX (BR-3). No glob character, no double-star, no English
      prose describing a document section. The reason is mechanical:
      tools/check_review_independence.py matches with `r == b or r.startswith(b.rstrip("/") +
