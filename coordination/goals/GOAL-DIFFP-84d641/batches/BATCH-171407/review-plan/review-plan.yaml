        THE TWO -- concretely enough to be budgeted: what it constructs, what it adjudicates, what
        outcome means artifact and what means power.
        FINALLY, RUN THE proves_too_much CONTROL BELOW. It is assigned to this joint and its
        objects are a FLOOR AND NOT A CEILING.
      breaking_artifact: >-
        A ruling on the reading with the committed text it rests on; a ruling on whether the
        stopping rule fired and what it forbids; and either a constructed third reading with the
        cell set and count it produces, or an explicit bounded negative naming the readings you
        tried and why each fails. "The argument looks fine" is not an answer to this joint. "No
        third reading was found within budget, and here is what was tried" IS an answer, and it is
