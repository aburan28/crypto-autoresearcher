      independent sessions ADMIT the package, and this round asks that question directly through the
      `admissibility_ruling` blocks. The close composes the overall admission FROM THE FIVE CONJUNCT
      ANSWERS OF BOTH REVIEWERS. It is never read off the presence of two task ids in a queue, never
      read off the joint scalars, and never inferred from silence.
    claim_ceiling: >-
      `analyzed`, NEVER `supported`, REGARDLESS OF WHAT THE REPORTS SAY. Three of the four
      supported-promotion gates of agents/coordinator.md are structurally unmet by a batch of this
      kind -- there is no asymptotic claim, no proof decomposition, no numbered heuristics with
      validation evidence and no concrete-cost table -- and the fourth is not attempted. TWO
      INDEPENDENT REVIEWERS DO NOT RAISE A CEILING SET BY THAT, and neither does an evidence strength
      of `replicated`, which describes how many implementations produced a number and never what the
      number means.
      NO DIFFERENTIAL PATH IS CLAIMED NEW FOR MD5 OR SHA-1 AT ANY TIER. THE CENSUS COMPLETENESS IS
      STATED BESIDE EVERY VERDICT AND IS NEVER SUMMED: readable 0 / quarantined_not_read 1 /
      acquisition_gap 8, with shadow_planted 16 CARRIED SEPARATELY. WITH A READABLE CENSUS OF ZERO A
      NON-MEMBER VERDICT CARRIES NO INFORMATION ABOUT THE LITERATURE AT ALL. THE MD5 LANE IS BLOCKED,
      NOT CLOSED.
    what_a_break_on_any_joint_would_mean: >-
      A break does NOT make the package invalid and does NOT make the measurements wrong. It narrows
      what the measurements license. The close would then state the narrowest statement the runs
      support -- scoped to the tested primitives, seeds, families, matrix cells, instruments, census
      and budget -- and record the unsupported reading as explicitly not supported, with the object
      that broke it. THAT IS THE SHAPE OF THIS GOAL'S LAST THREE ROUNDS AND IT IS A RESULT EACH TIME.
