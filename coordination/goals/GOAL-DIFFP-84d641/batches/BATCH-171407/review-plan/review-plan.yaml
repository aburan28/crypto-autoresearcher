  procedure_deviations:
    - id: PDV-1
      what: >-
        THIS ROUND'S JOINT IDS ARE ROUND-PREFIXED R4-J1..R4-J6, continuing round 3's R3- convention
        rather than restarting a bare Jn sequence.
      why: >-
        Round 2's J1..J13 and round 3's R3-J1..R3-J8 are committed and immutable, and goal restriction
        (4) names J8, J11 and J13 specifically. A bare J-number meaning different things in three
        rounds would make the cross-round mapping ambiguous in the exact records that must demonstrate
        it.
      cost_stated: >-
        Reviewers must copy a longer literal string into joints_owned, and the checker matches on exact
        equality, so a reviewer that writes J1 instead of R4-J1 produces a spurious FAIL. Both
        assignment documents therefore carry the literal list to copy.
    - id: PDV-2
      what: >-
        THIS PLAN NARROWS EACH REVIEWER'S COMMITTED READ SCOPE BY EXACTLY ONE FILE -- THE SIBLING'S
        ASSIGNMENT DOCUMENT -- AND ADDITIONALLY NARROWS THE RED TEAM'S BY TWO FILES, the producer's
        module and its test file, under `blind_rederivation.blind_from`.
      why: >-
        The dispatch queue scopes the review-plan DIRECTORY to both reviewers, and that directory holds
        BOTH assignment documents, so the queue could not express sibling blindness at file granularity.
        A read_scope is a PERMISSION AND NOT AN OBLIGATION, and the plan is authoritative over the card
        and the queue where they differ.
      cost_stated: >-
        A reviewer reading the whole review-plan directory without attention would read its sibling's
        assignment and would have to disclose it. That is why it is stated in the plan, in both
        assignment documents, and as an explicit instruction rather than left to inference.
    - id: PDV-3
      what: >-
        `blindness.blind_from` IS THE INTERSECTION OF THE TWO REVIEWERS' BLINDNESS LISTS AND NOT THE
        UNION, WITH THE SIBLING BOUNDARY CARRIED PER REVIEWER IN A SEPARATE FIELD AND IN EACH
        ASSIGNMENT DOCUMENT.
      why: >-
        BR-14, and it is a semantic fix rather than a syntactic one. Round 3's plan listed each
        reviewer's own task card and own assignment as blind_from prefixes while ordering it to read
        them, and DEC-20260824-257f35 F-1 upheld that finding in full against this role. A single flat
        list cannot be simultaneously satisfiable by two reviewers with different own-documents.
      cost_stated: >-
        A future checker that tested `blindness.blind_from` mechanically would no longer catch a
        reviewer reading its sibling's card, because that prefix is not in this list. The plan states
        that cost in `blind_from_note` rather than leaving it to be discovered, and it is the price of
        the list being CORRECT for both reviewers rather than producing a false positive against a
        reviewer that did nothing wrong.
    - id: PDV-4
      what: >-
        THE ROUND RUNS AT SIX JOINTS, CUT FROM ROUND 3's EIGHT, AND THE CUT WAS DECLARED AT THE BATCH
        OPENING AND ARGUED ON THE OBJECT RATHER THAN ON THE BUDGET. THIS PLAN RESTORES NONE OF THEM AND
        ADDS NONE.
      why: >-
        batch.yaml `joint_count_note` argues it: round 3's object was a 60-ordered-pair dependency
        graph, a five-class re-partition, a fifteen-subset lattice and a 36-cell matrix from five runs
        and thirteen artifacts; this round's object is one predicate re-implemented from a statement,
        one family constructor and two cell tables from four runs.
      cost_stated_again_here_because_a_plan_is_where_a_cut_gets_quietly_undone: >-
        BREADTH. NO DEDICATED GENERATOR-ACTION JOINT IS FUNDED, FOR A SECOND CONSECUTIVE ROUND. Round
        3's RT-J5-3 -- that five committed generator actions carry the flag rather than recomputing it
        while the producer's own disclosure named two -- was found INCIDENTALLY, and nothing else in
        that region has ever been audited by anyone. THAT IS RECORDED AS A SECOND CONSECUTIVE UNAUDITED
        REGION AND NOT AS A RESOLVED ITEM, and R4-J6 is explicitly authorised to report the cut itself
        as a finding.
    - id: PDV-5
      what: >-
        THIS PLAN AND THE TWO ASSIGNMENT DOCUMENTS ARE DECLARED `artifact_paths` OF TASK-20260826-30e97f
        AND ARE BINDABLE BY path_sha256. THE SEALED PRIOR'S TWO PARTS ARE NOT, AND NEITHER FILENAME
        APPEARS IN ANY BINDING MAP.
      why_it_is_recorded_as_a_deviation_from_the_predecessor_round: >-
        BECAUSE IT REVERSES ONE HALF OF ROUND 3's PDV-5 DELIBERATELY. Round 3 declared the sealed prior
        as an artifact_path to make it bindable, and its own Validator then disclosed, unprompted, that
        verifying the archive printed both sealed-prior filenames. BR-16 keeps the binding and moves it
        into a sidecar under a prefix the `coordinator_prior` field already publishes.
      what_it_costs: >-
        The sealed prior is now bound by a document no independent reviewer verifies, so its binding is
        checked only by the ledger close and by whoever re-runs the dispatcher. That is a real reduction
        in who can check it, and it is the price of the reviewer not being handed the filenames. BOTH
        HALVES ARE ON THE RECORD SO A LATER READER CAN DISAGREE WITH THE TRADE.
    - id: PDV-6
      what: >-
        NO REVIEWER COMMITS ITS OWN REPORT (BR-11), AND THE TASK CARDS SAY SO AT OPENING.
      the_consequence_carried_rather_than_hidden: >-
        Because reviewer reports are untracked until the ledger archive, the refutation artifacts are
        archived by the SAME commit that files the decision relying on them rather than by an earlier
        one. Content binding still holds through BR-8, so docs/claims-and-verification.md's ordering
        requirement is met IN SUBSTANCE and NOT in the stricter form of a prior commit. THIS ROUND SAYS
        SO RATHER THAN CLAIMING THE STRICTER FORM.
    - id: PDV-7
      what: >-
        THE REVIEWER BUDGETS ARE DECLARED BELOW THE MEASURED RATE AND THE SHORTFALL IS CARRIED INTO THE
        PLAN WITH A NAMED DROP ORDER, RATHER THAN BEING DISCOVERED IN THE REPORTS.
      how_it_is_handled_here: >-
        See `budget_constraint_carried_into_the_plan_rather_than_discovered_mid_round`. No ceiling is
        raised, no ceiling is reallocated, no batch total is changed and no Coordinator self-grants a
        raise. The accounting basis that makes the shortfall necessary is named in the opening and is
        routed as owed to an explicitly user-authorised decision, deliberately not changed mid-campaign.

