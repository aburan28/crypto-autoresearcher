      statement: >-
        DEV-1, THE READING, AND WHETHER THE STOPPING RULE FIRED. THE LOAD-BEARING JOINT OF THIS
        ROUND, AND IT IS A SPECIFICATION QUESTION BEFORE IT IS AN EMPIRICAL ONE. The producer
        found that the contract's forcing statement -- an `if and only if` over components that
        REMAIN -- does not say which side a row falls on when the deleted component is not a
        component of that primitive's key at all. It declared BOTH readings as module constants
        BEFORE any run, measured everything under both, RESOLVED NEITHER, and continued past a
        stopping rule that fires under one of them, declaring the continuation as DEV-1.
        THREE THINGS ARE YOURS. (1) WHICH READING, IF EITHER, THE CONTRACT'S TEXT ADMITS -- and
        whether a THIRD reading exists. (2) WHETHER THE STOPPING RULE FIRED, AND IF IT DID, WHAT
        THE CONTRACT'S HARD TERM H-6 THEN FORBIDS REPORTING. (3) WHETHER THE QUANTITY THIS ROUND
        MEASURES IS A PROPERTY OF THE INSTRUMENTS OR OF THE RULE THAT SELECTS THE CELLS.
      attack_plan: >-
        THE COORDINATOR HAS NOT RESOLVED THE READING AND WILL NOT RESOLVE IT BEFORE YOU RULE.
        THAT IS DELIBERATE. Resolving it in this plan would settle by fiat exactly the question
        the round exists to answer, and ruling it met under whichever reading meets it would be
        the same move wearing a different hat. YOUR RULING IS AN INPUT TO THE CLOSE AND THE CLOSE
        COMPOSES; IT IS NOT DELEGATED AUTHORITY TO AMEND THE CONTRACT, AND YOU MINT NOTHING.
        START FROM THE CONTRACT'S TEXT ALONE, BEFORE READING THE PRODUCER'S FRAMING OF IT.
        EXP-DIFFP-f26790 states the predicate formally. Read it, read the committed dependency
        graph's edge records for the column in question on both primitives, and decide what the
        sentence says about a row whose deletion is the identity on that primitive's key. Then
        read the committed predecessor rule's own excluded-cell record, which carries for that
        case a derivation with NO SOURCE COMPONENT. STATE WHETHER A DERIVATION WITHOUT A SOURCE
        COMPONENT IS AN INSTANCE OF THE CONTRACT'S RULE OR A DIFFERENT RULE WEARING THE SAME
        NAME. That question is answerable from committed text and needs no re-run.
        THEN LOOK FOR A THIRD READING, BECAUSE TWO IS A SUSPICIOUSLY ROUND NUMBER FOR AN
        AMBIGUITY NOBODY NOTICED FOR THREE ROUNDS. Candidates to consider and reject or adopt
        explicitly: requiring the determining component to remain in the UNPROJECTED key rather
        than the projected one; allowing a PATH of derivation-backed edges rather than a single
        edge; quantifying per instrument AND per family rather than per instrument alone;
        treating the absent component as forced on the primitive where it is absent and
        adjudicated on the other, rather than uniformly. IF A THIRD READING EXISTS, BUILD IT AS A
        RUN-TIME PROJECTION OR WRAPPER, RUN IT, AND REPORT WHAT CELL SET AND WHAT COUNT IT GIVES.
        A third reading that gives a third answer settles question (3) outright.
        THEN THE STOPPING RULE, AND BE PRECISE ABOUT WHAT FOLLOWS. The contract's stopping rules
        and H-6 are committed text. If the identity known-answer differs from the committed six
        in either direction, H-6 forbids reporting ANY re-admitted count. DECIDE WHETHER THE
        PRODUCER'S CHOICE -- continue, measure both, resolve neither, declare the continuation --
        IS (a) the correct handling of an under-determined contract, (b) a protocol deviation
        that is defensible but owes a versioned amendment, or (c) a violation that invalidates
        the reporting of the counts. ALL THREE ARE LIVE AND THIS PLAN ASSERTS NONE OF THEM. Say
        which, and say what a close may and may not state under your ruling. NOTE THE ASYMMETRY
        THE PRODUCER ITSELF NAMES: suppressing arithmetic that BOTH readings share would destroy
        a measurement, and asserting the known answer met under the reading that meets it would
        resolve the gap by fiat. Attack both halves of that argument.
        THEN QUESTION (3), WHICH IS THE ONE THAT OUTLIVES THIS BATCH. The rule selects a cell set
        PER INSTRUMENT, and the reported comparison is then made over the selected set. ASK
        WHETHER THE REPORTED QUANTITY IS A PROPERTY OF THE PAIR OF INSTRUMENTS BEING COMPARED OR
        OF THE INSTRUMENT WHOSE PREDICATE CHOSE THE CELLS. Determine it from the package's own
        tables -- the cell sets are all reported -- and from your own construction if you need
        one. IF THE ANSWER IS THAT THE QUANTITY MOVES WITH THE SELECTOR, SAY SO PLAINLY, SAY WHAT
