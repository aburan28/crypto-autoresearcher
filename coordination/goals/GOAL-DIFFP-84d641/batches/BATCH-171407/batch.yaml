concurrency_finding_this_batch_responds_to: >-
  RECORDED HERE BECAUSE THE ASSIGNMENT REQUIRES IT AND BECAUSE IT IS THE REASON FOR BR-15.
  THE BATCH-145531 SNAPSHOT ARCHIVE SUFFERED A CONTENT BINDING DRIFT FROM A CONCURRENT WRITER ON
  A SHARED BRANCH. CORR-20260826-f170d2 records it in full: TASK-20260824-aed5ca bound 34 paths
  by sha256 at commit 8b602698a before either reviewer ran; while the review round was in flight
  A DIFFERENT SESSION pushed 16 commits to the SAME branch, one of which -- b1caef72e -- APPENDED
  a regression test to tests/test_diffpath_depgraph.py, one of the 34 bound paths; on merging,
  tools/research_dispatch.py CORRECTLY REFUSED the archive with a content hash mismatch. The
  merge itself was clean and there was nothing to resolve by picking a side. The binding was
  superseded by a correction record with the prior value PRESERVED, the instrument
  independently re-verified as byte-identical, and the change measured to be purely additive.
  THE PROCESS FINDING, QUOTED FROM THAT RECORD RATHER THAN RESTATED: content_first binding is
  specified to verify DECLARED DIGESTS AT HEAD, WHICH SILENTLY ASSUMES NO THIRD PARTY EDITS AN
  ARCHIVED ARTIFACT BETWEEN ARCHIVE AND VERIFICATION -- an assumption that is written nowhere and
  does not hold on a shared branch.
  THIS BATCH'S STRUCTURAL RESPONSE IS BR-15: IT RUNS AS A LANE ON ITS OWN FRESH BRANCH, WITH A
  PUBLISHED CLAIM BEFORE EVERY SUBAGENT LAUNCH AND A PUBLISHED RELEASE AFTER EVERY RETURN. That
  does not make the assumption true in general and this batch does not claim it does; it removes
  the one configuration in which it was measured to fail. THE COST IS DECLARED IN BR-15.

