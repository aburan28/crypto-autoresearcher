  BR-10:
    rule: 'THE BLINDNESS BLOCK COVERS COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY, NOT ONLY GIT COMMANDS. A producer NAMES COMMITS BY ROLE AND NOT BY SHA in any artifact inside a reviewer''s read scope.'
    status: 'CARRIED FORWARD. MEASURED CLOSED IN ROUND 3 -- neither reviewer reports encountering a finding through that channel.'
  BR-11:
    rule: 'NO REVIEWER COMMITS ITS OWN REPORT. It leaves output untracked at its declared write scope and the LEDGER ARCHIVE task commits it. No card or handoff of this batch instructs otherwise.'
    status: >-
      CARRIED FORWARD, WITH ITS COST CARRIED TOO RATHER THAN HIDDEN: because reviewer reports are
      untracked until the ledger archive, the refutation artifacts are archived by the SAME commit
      that files the decision relying on them rather than by an earlier one. Content binding still
      holds through BR-8, so docs/claims-and-verification.md's ordering requirement is met IN
      SUBSTANCE and NOT in the stricter form of a prior commit, AND THIS BATCH SAYS SO RATHER THAN
      CLAIMING THE STRICTER FORM.
  BR-12:
    rule: 'RUN LOCATION IS A CONTRACT TERM AND EVERY EXPERIMENT CONTRACT OF THIS GOAL NAMES IT: experiments/<EXP-ID>/runs/<RUN-ID>/. The producer MEASURES tools/validate_ledger.py acceptance of its own new run directories after they exist and before the snapshot, and records the output VERBATIM whether it passes or fails.'
    status: 'CARRIED FORWARD. EXP-DIFFP-f26790 H-10 and `run_location` discharge it. Round 3 measured the acceptance at 0 errors and 0 warnings; this batch re-measures for its own runs, because the previous measurement is a fact about other runs.'
  BR-13:
    rule: >-
      EVERY PROSE VALUE IS WRITTEN AS A BLOCK SCALAR OR QUOTED THE FIRST TIME, NOT REPAIRED AFTER
      A PARSER REJECTS IT. A value goes in a `>-` block or in quotes if it contains a colon-space,
      or if it begins with a backtick, `@`, `%`, `*`, `&`, `!`, `?`, `|`, `>` or `-`. TWO SILENT
      CLASSES MATTER MORE THAN THE LOUD ONES BECAUSE THEY PARSE: a prose value that DEDENTS to a
      mapping indent silently ends its own block, and a list item written as `- some prose: more
      prose` silently becomes a single-key MAPPING rather than a string. A LIST OF SENTENCES IS A
      LIST OF BLOCK SCALARS.
    status: >-
      CARRIED FORWARD. FIVE FILES OF THIS CAMPAIGN SHIPPED UNPARSEABLE FROM THIS FAMILY ACROSS
      THREE COORDINATOR SESSIONS, and coordination/**.yaml IS STILL UNPARSE-GATED IN CI --
      tools/check_merge_hygiene.py parse-gates ledger/**.yaml and
      experiments/*/specification.yaml but under coordination/ it checks .json only. The
      coordination YAML parse gate remains an owed program-level item and is not this batch's to
      build; BR-13 is the authoring-side discipline that reduces the damage while the gate does
      not exist.
  BR-14:
    rule: >-
      A REVIEWER'S OWN TASK CARD AND ITS OWN ASSIGNMENT DOCUMENT MUST NOT APPEAR IN
      `blindness.blind_from`. THE BLINDNESS BOUNDARY LISTS ONLY THE SIBLING'S CARD, ASSIGNMENT,
      REVIEW DIRECTORY AND CONSTRUCTIONS. A reviewer's own two documents belong in its
      `sources_read` and in no blind_from list, and the plan may not simultaneously order a
      reviewer to read a document and declare that document a blind_from prefix.
    basis: >-
      DEC-20260824-257f35 `findings_against_this_coordinator_role` F-1, UPHELD IN FULL AGAINST
      THIS ROLE. Round 3's plan listed each reviewer's own assignment document and its own
      task-card directory in `blindness.blind_from` while the plan's own `blind_from_note` said
      each reviewer's own two documents are "expected in its own sources_read" -- TWO STATEMENTS A
      MECHANICAL PREFIX MATCH CANNOT BOTH SATISFY. The reviewer was ORDERED to read both files and
      to list them honestly, and both were declared blind_from prefixes of the round it was
      reviewing under.
    why_the_benign_consequence_is_itself_the_finding: >-
      HAD tools/check_review_independence.py RUN ITS LEAK TEST AGAINST `blindness.blind_from`
      RATHER THAN AGAINST `blind_rederivation.blind_from`, IT WOULD HAVE REPORTED A LEAK AGAINST A
      REVIEW THAT DID NOTHING WRONG, and the close would have had to adjudicate a false positive
      as though it were an event. THE ROUND'S GREEN PASS IS THEREFORE PARTLY AN ACCIDENT OF WHICH
      LIST THE TOOL TESTS, AND SAYING SO IS THE ONLY HONEST WAY TO REPORT A PASS.
    the_class_it_belongs_to: >-
      THE SAME CLASS AS BATCH-f8bf86's DOUBLE-STAR-SUFFIXED PREFIXES THAT NO REAL PATH COULD
      MATCH: A BLINDNESS LIST WRITTEN SO THAT THE CHECKER CANNOT USE IT CORRECTLY. BR-3 fixed the
      SYNTAX; BR-14 fixes the SEMANTICS.
  BR-15:
    rule: >-
      THIS BATCH RUNS AS A LANE ON ITS OWN BRANCH, AND EVERY SUBAGENT LAUNCH IS PRECEDED BY A
      PUBLISHED CLAIM AND FOLLOWED BY A PUBLISHED RELEASE. Concretely, by the driving session:
      `tools/goal_lanes.py open-lane` once for BATCH-171407; `tools/goal_lanes.py claim <queue>
      <TASK> --as <addr> --ttl-minutes N --publish` before each launch, with the TTL sized to the
      task's declared budget plus review slack and never to "forever"; and `tools/goal_lanes.py
      release <queue> <TASK> --as <addr> --outcome completed|failed|abandoned --publish` on
      return. THE CLAIM EPOCH IS RECORDED IN EACH TASK RECEIPT. Start only Ready Tasks whose
      `claim` is null. On a same-task double claim THE LOWER EPOCH WINS and the other releases as
      `abandoned`. Archive commits exclude `dispatch_queue.json` and exclude `claims/`; a claim
      commit is its own commit.
    basis: >-
      CORR-20260826-f170d2, whose `process_finding_for_the_program` is quoted above under
      `concurrency_finding_this_batch_responds_to`, together with docs/concurrent-goal-lanes.md,
      which is binding for every runtime from its merge. THE DOCUMENTED HAZARD IN CLAUDE.md IS TWO
      WRITERS MINTING THE SAME IDENTIFIER; WHAT ACTUALLY HAPPENED WAS TWO WRITERS ON ONE BRANCH,
      where a second session pushed an unrelated campaign plus a CI fix through the same ref an
      open review round was archived against.
    what_it_does_not_claim: >-
      A FRESH BRANCH DOES NOT MAKE content_first BINDING SOUND IN GENERAL. The unstated assumption
      -- that no third party edits an archived artifact between archive and verification -- is
      still unstated and still a program-level gap, and CORR-20260826-f170d2 routes its repair to
      the dispatcher or to branch policy and NOT to this campaign's ledger. THIS BATCH REMOVES THE
      ONE CONFIGURATION IN WHICH THE ASSUMPTION WAS MEASURED TO FAIL AND CLAIMS NOTHING BEYOND
      THAT.
    the_cost_stated_plainly: >-
      One extra small commit per claim, release and lane record, so this branch carries
      control-plane commits alongside research commits; and a feed window of seconds in which two
      sessions can both claim one task and discover it on the next fetch. A lane's ledger archive
      still edits goal.yaml, so two lanes archiving in the same minute can still conflict there --
      additively and mechanically, but still a merge somebody performs.
  BR-16:
    rule: >-
      NEITHER SEALED-PRIOR FILE IS A DECLARED artifact_path OF ANY TASK, SO NEITHER FILENAME
      APPEARS IN ANY ARCHIVE'S path_sha256. Their digests are carried in ONE SIDECAR,
      coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-171407/digests.json, which IS a
      declared artifact_path of TASK-20260826-30e97f and IS therefore content-bound by the
      snapshot receipt. THE FILES REMAIN CONTENT-BOUND; WHAT CHANGES IS WHICH DOCUMENT CARRIES THE
      BINDING AND WHAT A REVIEWER ENUMERATING THE RECEIPT LEARNS. A reviewer verifying the archive
      now sees ONE path under a prefix the review plan's `coordinator_prior` field ALREADY
      PUBLISHES TO IT BY DESIGN, and learns neither how many parts the prior has nor what they are
      called. Part 1 is written by TASK-20260826-fc9e5e and the part-2 addendum by
      TASK-20260826-30e97f; both are in their authors' write_scope and NEITHER is in
      artifact_paths. THEY ARE DISCLOSED IN THE SNAPSHOT RECEIPT'S `staged_not_in_binding_set` BY
      PREFIX AND COUNT AND NOT BY FILENAME -- "two write-once files under
      coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-171407/, content-bound through
      digests.json" -- because disclosing them by name in the receipt would hand the reviewer
      exactly what this rule removes from the binding map.
    the_residual_that_remains_and_it_is_reduced_rather_than_eliminated: >-
      A PREFIX AND A COUNT ARE STILL INFORMATION, AND THE REPOSITORY IS READABLE. This rule stops a
      reviewer from being HANDED the filenames while discharging a verification it was ordered to
      perform; it does not and cannot stop a reviewer that goes looking outside its declared read
      scope. That is a boundary, not a cage, and it is the same boundary every read_scope in this
      program is.
    basis: >-
      DEC-20260824-257f35 `independence_ruling`
      `the_residual_recorded_for_the_successor_rather_than_dismissed`, routed explicitly TO THE
      SUCCESSOR OPENING "where it is fixable and where retrofitting is structurally impossible".
      Round 3's Validator disclosed, unprompted, that while verifying the archive's 34-path
      binding it printed the receipt's path list and THE OUTPUT INCLUDED THE TWO SEALED-PRIOR FILE
      PATHS, because BR-8 and PDV-5 together REQUIRED the prior to be a declared artifact_path
      bound by a receipt that a reviewer must read. THE ROUND'S OWN DURABILITY FIX CREATED THE
      HALF-LEAK: BR-8 and BR-9 were in tension and the tension was a defect in the round's design,
      which was this Coordinator role's.
    what_it_costs: >-
      The sealed prior is bound by a document that no independent reviewer verifies, so its
      binding is checked only by the ledger close and by whoever re-runs the dispatcher. That is a
      real reduction in who can check it, and it is the price of the reviewer not being handed the
      filenames. BOTH HALVES ARE ON THE RECORD SO A LATER READER CAN DISAGREE WITH THE TRADE.
    the_alternative_that_was_refused: >-
      NOT BINDING THE PRIOR AT ALL. That was refused because it recreates exactly the unbindable
      documents BR-8 was invented to fix, and an unbound sealed prior is one a later session could
      quietly rewrite after the round.

