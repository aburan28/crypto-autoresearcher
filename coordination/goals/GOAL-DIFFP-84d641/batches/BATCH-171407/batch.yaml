    status: 'CARRIED FORWARD. MEASURED TO HAVE WORKED IN ROUND 3 -- both reviewers'' construction sets were content-bound for the first time in this goal, and DEC-20260824-257f35 records one of round 2''s two proof_status blockers as CLOSED by it.'
  BR-9:
    rule: 'THE SEALED PRIOR LIVES OUTSIDE EVERY REVIEWER READ SCOPE, AND THE REVIEW PLAN''S MANDATORY `coordinator_prior` FIELD CARRIES A POINTER AND A SEALED MARKER, NEVER THE SENTENCE.'
    status: >-
      CARRIED FORWARD. MEASURED TO HAVE HELD IN ROUND 3 WITH ONE NAMED RESIDUAL, and the residual
      is fixed by BR-16 rather than repeated. Its measured payoff is on the record: the one item
      of round 3's prior that the round confirmed was confirmed by the reviewer whose non-reading
      was MECHANICALLY tested, and was therefore UNDISCOUNTED, which round 2 could not achieve for
