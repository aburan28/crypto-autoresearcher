    for a fourteen-instrument sweep including key construction is 33 s on one core
    (TASK-20260824-e9d21a J12, THAT session's measurement), and this is a small fraction of one
    such sweep. Declared per-run ceilings sum to 255 s, well inside 330.
    PD-4 OF DEC-20260824-af6d5c IS RECORDED AGAINST THIS ROLE FOR UNDER-BUDGETING A STAGE AND THEN
    ASKING IT FOR MORE THAN THE BUDGET BOUGHT, SO THE STAGE GATES ARE IN THE CONTRACT: if stage 1
    stops, stage 2 is GATED-NOT-RUN and that is a declared outcome, not a shortfall; if the family
    is not constructible, stage 4's pair-cell half is GATED-NOT-RUN with its gate named.
  archive_budget_basis: >-
    150 s for the SNAPSHOT and 300 s for the LEDGER CLOSE. The snapshot matches batch 3's 150 and
