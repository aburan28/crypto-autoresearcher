contamination_firewall: >-
  GOAL-MD5-001's BCP-1 QUARANTINE (coordination/goals/GOAL-MD5-001/quarantine/**, payload sha256
  e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) IS NOT READ BY ANY TASK OF
  THIS BATCH, AND THE FIREWALL COVERS CONTENT BY EVERY ROUTE -- the network, a package index, a
  model's own memory reproduced into a file, and any retrieval index (AMD-20260824-DIFFP-ACQ-1
  OB-1). EVERY TASK ATTESTS NON-READING AND NAMES ITS MECHANISM, because attestation by good
  faith is not the standard this campaign has reached: round 3's Validator replaced
  census.quarantine_attestation in its own process with a stub that opens nothing, and the Red
  Team removed the call site entirely by never importing harness.diffpath.census at all,
  rebuilding the sixteen shadow entries from the two declared planted-path seeds with committed
  functions that read nothing from disk. THAT IS THE STANDARD THIS BATCH INHERITS.
  THIS BATCH DOES NOT RE-HASH THE PAYLOAD. CTL-QUAR discharged that in batch 1 and
  TASK-20260824-3bd362's OBJ-9 raised for precedent that even a BYTE COUNT of a quarantined
  payload is a derived quantity beyond the authorised whole-file sha256.
  A BREACH INVALIDATES THE RUN SET UNDER EXP-DIFFP-f26790 IR-1 and is reported to GOAL-MD5-001 as
  a cross-goal contamination finding.
  THE MD5 LANE IS BLOCKED, NOT CLOSED.

knowledge_retrieval: >-
  EVERY TASK ATTEMPTS `search_knowledge` BEFORE ANY ASSERTION ABOUT WHAT HAS OR HAS NOT BEEN
  TRIED, AND RECORDS ITS QUERIES AND OUTCOMES VERBATIM. The index is DERIVED and may be empty; an
  empty or unavailable answer is a fact about the index and licenses no inference in either
  direction (AGENTS.md "Knowledge retrieval policy"). NO TASK OF THIS BATCH WRITES TO THE INDEX.
  DEC-20260824-257f35 records that `search_knowledge` was NOT EXPOSED AS A TOOL to the round-3
  close and that the absence was recorded rather than routed around; the same disclosure is
  required of every task here if it recurs.

runtime_policy: >-
  Per-role policies resolve through orchestration/roles.yaml and
  orchestration/model-policies.yaml. THE THREE COORDINATOR TASKS REQUEST
  coordinator-orchestration-code; THE EXECUTOR REQUESTS executor-implementation; BOTH REVIEWERS
  REQUEST review-adversarial AT reasoning_effort xhigh WITH independent_session_required TRUE.
  `degraded_allowed` AND `fallback_allowed` ARE FALSE EVERYWHERE IN THIS BATCH: a tier the backend
