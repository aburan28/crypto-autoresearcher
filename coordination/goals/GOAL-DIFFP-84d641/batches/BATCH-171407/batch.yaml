objective: >-
  REPLICATE THE ONE MEASUREMENT IN THIS GOAL THAT TURNED A 0 INTO A 1, WITH AN INDEPENDENT
  IMPLEMENTATION, AND BUILD THE ONE FAMILY THAT COULD POPULATE CELLS THE CURRENT SET CANNOT
  REACH. One executor task, two arms, four gated runs, under the frozen contract
  EXP-DIFFP-f26790, at census size zero.
  ARM (a) RECOMPUTES THE FORCING PREDICATE PER INSTRUMENT: a cell is forced for instrument I if
  and only if, under I's projection composed with the row's deletion, the projected key STILL
  retains a component that determines the deleted one BY A DERIVATION-BACKED EDGE; cells forced
  for I are excluded FOR I and cells not forced for I are adjudicated FOR I. It REUSES the six
  cells BATCH-145531 excluded as forced_by_the_graph and the draw sets already built for the
  three constructible families, AND IT CONSTRUCTS NOTHING NEW.
  ARM (b) BUILDS THE CONSISTENT-PAIR FLAG-AND-dv FAMILY -- perturbing the flag and the dv
  TOGETHER so the pair stays mutually consistent -- which probes whether the instrument
  separates in-code from out-of-code objects at all and is THE ONLY NAMED REPAIR of null family
  (e)'s substantive retirement.
  THIS IS A REPLICATION WITH AN INDEPENDENT IMPLEMENTATION. RT-J8-4 ran this control ONCE, in one
  session, with one implementation, and got 1 of 30. The executor MAY NOT READ OR REUSE THAT
  IMPLEMENTATION and re-implements from the STATEMENT, which is written formally into the
  contract. The forbidden path is named literally in the contract, in the task card and in the
  handoff.
  BOTH OUTCOMES ARE PRE-REGISTERED IN THE CONTRACT BEFORE ANY RUN, AT P-B, AND NEITHER MAY BE
  WRITTEN AS A SURPRISE AFTERWARDS.

objective_one_line: >-
  REPLICATE THE PER-INSTRUMENT FORCED-CELL RE-ADMISSION CONTROL WITH AN INDEPENDENT
  IMPLEMENTATION AND BUILD THE CONSISTENT-PAIR FLAG-AND-dv FAMILY, UNDER EXP-DIFFP-f26790, AT
  CENSUS SIZE ZERO.

