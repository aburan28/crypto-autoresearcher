review_architecture:
  shape: >-
    SIX TASKS AND TWO SIBLING-BLIND INDEPENDENT REVIEWERS ON DISJOINT JOINT SETS, in independent
    sessions, under review-adversarial at reasoning_effort xhigh with
    independent_session_required true. The widest stage is exactly 2 and both archives run ALONE
    by rule.
  why_two_reviewers_and_not_one: >-
    UNCHANGED FROM ROUND 3 AND THE REASONS HAVE STRENGTHENED, NOT WEAKENED. (1) COMPLETION
    CRITERION 4 IS UNREACHABLE WITH ONE REVIEWER, and it has now been REACHABLE-AND-REFUSED for
    two consecutive rounds; dropping to one now would be indistinguishable from quietly retiring
    a criterion that has twice said no. (2) THIS GOAL HOLDS THREE MEASURED COUNTEREXAMPLES TO THE
    ONE-REVIEWER ARGUMENT: O5, which defined BATCH-f8bf86 and was added by a reviewer and was not
    on the plan's list; BATCH-efcae7's composition of two mutually blind readings of one line of
    code; and round 3's exclusion-machinery finding, which DEC-20260824-257f35 records as worth
    TWO observations because the two reviewers reached it BY DIFFERENT MECHANISMS and neither
    could have stated the conjunction alone. (3) This batch's product is a REPLICATION, and
    "did the second implementation compute the same thing" and "was the second implementation
    actually independent" are different attacks.
  joint_count: 6
  joint_count_note: >-
    SIX JOINTS, THREE PER REVIEWER, DISJOINT, CUT FROM ROUND 3's EIGHT AND DECLARED AT OPENING.
    THE CUT IS ARGUED ON THE OBJECT AND NOT ON THE BUDGET, BECAUSE ARGUING IT ON THE BUDGET WOULD
    BE THE MOVE DEC-20260824-257f35 F-2 CONVICTED. Round 3's object was a 60-ordered-pair
    dependency graph, a five-class re-partition of six rows, a fifteen-subset depth-2 lattice and
    a 36-cell matrix, produced by five runs and thirteen result artifacts. THIS BATCH'S OBJECT IS
    ONE PREDICATE RE-IMPLEMENTED FROM A WRITTEN STATEMENT, ONE FAMILY CONSTRUCTOR, AND TWO CELL
    TABLES, produced by four runs. SIX JOINTS ON THAT OBJECT IS NOT THE SAME CUT AS SIX WOULD
    HAVE BEEN ON ROUND 3's.
    WHAT THE CUT STILL COSTS, NAMED RATHER THAN HIDDEN: BREADTH. DEC-20260824-257f35 F-2 measured
    exactly what round 3's cut cost -- RT-J5-3, the finding that FIVE committed generator actions
    carry in_linearized_code rather than recomputing it while the producer's own disclosure names
    TWO, and that align_E1 runs inside the committed adjudicator.canonical() for every sha1 object
    with step_start > 0, was found only incidentally, and NOTHING ELSE IN THAT REGION WAS AUDITED
    BY ANYONE. THIS BATCH DOES NOT FUND A DEDICATED GENERATOR-ACTION JOINT EITHER, AND THAT IS
    RECORDED AS A SECOND CONSECUTIVE UNAUDITED REGION rather than as a resolved item.
    DEC-20260824-257f35 EXPLICITLY DID NOT RECOMMEND TWO JOINTS PER REVIEWER AND THIS BATCH DOES
    NOT TAKE THAT OPTION.
  boundary_so_no_joint_is_unowned_and_none_is_double_owned: >-
    THE VALIDATOR (TASK-20260826-422106) OWNS WHETHER THE OUTPUT IS WHAT THE COMMITTED CODE
    PRODUCES AND WHETHER IT IS SCOPED HONESTLY -- reproduction from the declared seeds, the
    forced-set derivation per instrument and per primitive against the committed graph, and the
    denominators and exclusions. THE RED TEAM (TASK-20260826-a9d51e) OWNS WHETHER THE
    CONCLUSIONS SURVIVE OBJECTS FOR WHICH THEY ARE KNOWN FALSE -- whether the per-instrument
    quantifier is the only admissible reading, whether the independence of the implementation is
    demonstrated or merely attested, and whether the consistent-pair family's declaration is true
    of what it moves. WHERE THEY COME CLOSEST -- THE RE-ADMITTED COUNT -- the Validator checks
    that the count follows from the stated rule and the derivation, and the Red Team checks
    whether the rule was chosen to produce a count.
  the_joints_themselves_are_not_written_here: >-
    THE REVIEW PLAN IS TASK-20260826-30e97f's ARTIFACT AND IS WRITTEN AFTER THE PRODUCER RUNS,
    exactly as BATCH-145531 did it. This file states the SHAPE, the COUNT, the BOUNDARY and the
    RULES the plan must satisfy, so the plan is checkable against a committed record written
    before the object existed. Assigning the joints here would be assigning them before knowing
    what the package contains.
  completion_criterion_4_and_what_this_batch_does_about_it: >-
    THE CRITERION HAS NOW BEEN REFUSED TWICE AND THIS BATCH SAYS WHAT IT DOES ABOUT IT RATHER
    THAN LEAVING IT TO A THIRD SILENCE.
    WHAT THE CRITERION ACTUALLY ASKS, QUOTED: "Independent Validator and Red Team sessions admit
    each claim-relevant run package, verifying controls, certificates, the census provenance, the
    equivalence generators' verification status, and the absence of uncharged preprocessing,
    memory, oracle or randomness assumptions."
    WHAT HAS BEEN HAPPENING: BOTH ROUNDS DETERMINED ADMISSION BY READING IT OFF THE JOINT
    VERDICTS. Round 2's Validator ADMITTED on the joints it owned while the Red Team DID NOT, with
    three of six owned joints breaking and an explicit statement that the criterion was not its to
    declare. Round 3's close records neither session admitting, validator 3 of 4 and red team 0 of
    4. BUT "THIS JOINT BREAKS" AND "I DO NOT ADMIT THE RUN PACKAGE" ARE DIFFERENT STATEMENTS. A
    joint can break on the SCOPE OF A CONCLUSION while the run package's controls, provenance and
    absence of uncharged assumptions are all in order -- which is exactly what round 3 measured,
    since every integer reproduced and every derivation was ruled sound while five joints broke on
    what the integers LICENSE.
    WHAT THIS BATCH DOES, AND IT IS ONE CONCRETE CHANGE: THE REVIEW PLAN REQUIRES EACH REVIEWER TO
    WRITE AN `admissibility_ruling` BLOCK THAT IS SEPARATE FROM ITS JOINT FINDINGS AND THAT
    ANSWERS THE CRITERION'S OWN FIVE CONJUNCTS ONE BY ONE -- controls; certificates; census
    provenance; equivalence-generator verification status; and the absence of uncharged
    preprocessing, memory, oracle or randomness assumptions -- each as ADMIT, DO NOT ADMIT, or NOT
    IN MY SCOPE WITH THE REASON. The overall admission is then composed by the close FROM THOSE
    FIVE ANSWERS and never from the joint scalars.
    WHAT THIS IS NOT, STATED EXPLICITLY BECAUSE THE DISTINCTION IS THE WHOLE POINT: IT IS NOT A
    CHANGE TO THE CRITERION AND IT IS NOT A LOWERING OF THE BAR. The criterion's text is untouched
    and no protocol_amendment is required, because nothing about what must be true has changed --
    only that the round ASKS THE CRITERION'S OWN QUESTION DIRECTLY instead of inferring the answer
    from verdicts about something else. CUTTING JOINTS UNTIL NOTHING BREAKS WOULD SATISFY THE
    CRITERION'S LETTER AND DESTROY IT, AND THIS IS NOT THAT: the joints are unchanged in kind, a
    `breaks` on an owned joint remains a break, and A REVIEWER MAY STILL REFUSE ADMISSION ON ALL
    FIVE CONJUNCTS. THE CRITERION MAY WELL BE REFUSED A THIRD TIME AND THAT WOULD BE A RESULT.
    SILENCE ON ANY CONJUNCT IS NOT AN ADMISSION AND READING IT AS ONE WOULD BE MANUFACTURING ONE.

