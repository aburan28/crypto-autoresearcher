      does_a_per_primitive_split_trigger_P_C:
        my_framing_and_it_is_framing_and_not_a_decision: >-
          IT PARTIALLY TRIGGERS IT, AND THE HONEST PER-PRIMITIVE SENTENCE IS AVAILABLE. P-C's
          `status_if_refuted` requires a NOT-CONSTRUCTIBLE result to be reported with its
