          derivation-backed edge message_difference -> in_linearized_code, and CTL-WF check W3
          REJECTS any object whose flag differs from the committed predicate of its own dv.
          THEREFORE THE FLAG IS A FUNCTION OF THE MESSAGE DIFFERENCE ON EVERY GATE-ACCEPTED
          OBJECT, and the family moves ONE free parameter and ONE dependent one. A family that
          moves two components BECAUSE CONSISTENCY FORCES THE SECOND is a different object from
          one that moves two independently, and it reaches strictly fewer cells.
