        AND_A_REPORTING_DEFECT_IN_THE_CLAUSE_NAME: >-
          `W3` NAMES TWO DIFFERENT PREDICATES. On md5, depgraph.wf_violations tests
          `obj.in_linearized_code is not None`; on sha1 it tests
          `flag == sha1_in_linearized_code(dv)`. The package names the rejecting clause by the
          shared id `W3_in_linearized_code_equals_the_committed_predicate_of_the_dv` on BOTH
          sides. ON MD5 THAT CLAUSE NAME IS LITERALLY FALSE OF THE CHECK THAT FIRED -- there is no
          dv on md5 and no predicate of one -- and H-7 requires that every emitted rule text be
