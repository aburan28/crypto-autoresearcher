  proves_too_much:
    assigned_joint: R4-J4
    top_level_failure_signature: >-
      THREE ARGUMENTS, SEVEN OBJECTS, RUN AGAINST THE ARGUMENT EACH IS PAIRED WITH AND
      UNCHANGED. ARGUMENT A SURVIVES TWO OBJECTS IT SHOULD HAVE REFUSED AND IS THEREFORE WRONG
      SOMEWHERE THAT HAS NOT BEEN READ CLOSELY ENOUGH; THE SURVIVAL HAPPENS AT ONE STEP AND THE
      STEP IS NAMED. ARGUMENT B REFUSES ITS OBJECT CORRECTLY AND THE REFUSAL IS A GENUINE
      STRENGTH. ARGUMENT C REFUSES ITS NAMED OBJECT ON MD5 AND SURVIVES THE SAME OBJECT ON
      SHA-1, WHICH IS THE SIDE THE PLAN DID NOT THINK TO POINT IT AT.
    objects:
      - id: O-Q1
        pairs_with: ARGUMENT A
        outcome: SURVIVED_PARTIALLY
        step_at_which_the_survival_happens: >-
          THE PINNING TEST'S OWN DEFINITION. The package defines an arm as pinned when its
          required extreme is ZERO, and reports always_non_member pinned true (extreme 0, met)
          and always_member pinned FALSE (extreme 21, met 21). BOTH EXTREMES ARE DETERMINED BY
          THE SAME SINGLE NUMBER, honest_detected_cell_count = 0: it forces
          always_non_member's extreme to 0 AND always_member's extreme to the FULL denominator.
        measurement: >-
          honest_detected_cell_count = 0 on every cell set, mine and the package's. Therefore
          always_member differs on 21 of 21 (edge_only) or 18 of 18 (edge_or_vacuous) BY
          ARITHMETIC, not by observation, and it could no more have failed than the other arm.
        what_it_means: >-
          THE PINNING FIELD IS REAL AND IS AN IMPROVEMENT ON BATCH-145531, AND IT CATCHES ONE OF
          THE TWO ARMS. The honest statement is that WITH honest_detected = 0 BOTH DEGENERATE
          ARMS ARE ARITHMETICALLY DETERMINED and neither demonstrates capacity. WHAT WOULD HAVE
          TO REPLACE THEM: an arm whose extreme is strictly between 0 and the denominator, which
          requires a cell set with at least one honest-DETECTED cell -- exactly what P-D asked
          for and did not get.
      - id: O-Q2
        pairs_with: ARGUMENT A
        outcome: REFUSED
        what_did_the_refusing_and_with_what_measurement: >-
          THE PACKAGE ITSELF, IN TERMS, AND I CREDIT IT. `degenerate_projection_note` declares
          that always_member and always_non_member are VERDICT FUNCTIONS and not projections,
          that they were given the IDENTITY projection for the cell-selection half BY
          DECLARATION rather than by observation, and that they are therefore EXCLUDED from
          CTL-FORCE-PI's does-the-forced-set-move side. That is the control firing. NO ARTIFACT
          OF THIS PACKAGE READS always_member's 21 of 21 AS EVIDENCE THAT THE FAMILY SET CAN
          PRODUCE A LARGE COUNT.
      - id: O-Q3
        pairs_with: ARGUMENT A
        outcome: 'BUILT, RUN, AND IT REFUTES THE PREMISE'
        measurement: >-
          A THIRD ADMISSIBLE READING EXISTS (`out_of_domain`, above). It gives a THIRD
          exclusion partition -- three md5 cells as `null`, neither forced nor adjudicated -- and
          it gives an adjudicated CELL SET identical to edge_or_vacuous's while giving an
          adjudicated-cell LABELLING identical to neither. So the package's framing that the
          contract admits exactly two readings IS FALSE, and ARGUMENT A may not describe its
          quantity as a property of the instruments.
        what_bounds_the_space_of_readings_and_how_i_established_the_bound: >-
          I DO NOT CLAIM THE SPACE IS BOUNDED AND AN EXHAUSTIVE-LOOKING ARGUMENT THAT IS NOT
          EXHAUSTIVE WOULD BE WORSE THAN THIS. What I DID establish: of the four candidates the
          plan named, (a) `determiner must remain in the UNPROJECTED key` is INADMISSIBLE because
          it makes the forced set instrument-invariant and trips the contract's own falsification
          criterion outright; (b) `a PATH of derivation-backed edges` is EXTENSIONALLY IDENTICAL
          to the single-edge reading here, MEASURED -- I computed the transitive closure of the
          derivation-backed edge set and every target has depth-1 in-edges only; (c) `quantify
          per instrument AND per family` I did NOT run, and it is the one candidate I leave
          UNATTACKED, with the reason in `what_i_could_not_attack`; (d) `forced where absent,
          adjudicated where present` I reject as incoherent -- it makes the presence of a
          derivation-backed edge irrelevant, which contradicts the contract's own clause (2). I
          add a FIFTH, and it is the one that matters: the GRANULARITY of CTL-FORCE-PI's cell-by-
          cell comparison, which is a second under-determination and is documented at F-2.
      - id: O-Q4
        pairs_with: ARGUMENT A
        outcome: 'REFUSED AS BUILT, SURVIVED IN THE STRONGER FORM I BUILT NEXT'
        measurement_of_the_refusal: >-
          O-Q4 AS THE PLAN SPECIFIES IT -- drop in_linearized_code on sha1 only -- gets FOUR
          adjudicated rows on sha1, the SAME as the honest instrument, not more. The reason is
          that the contract's predicate never asks whether the instrument can SEE c(r); it asks
          only whether a determiner REMAINS, and message_difference remains. So this object is
          refused, and it is refused by accident rather than by design.
        measurement_of_the_survival: >-
          I BUILT TWO STRONGER OBJECTS AND BOTH SURVIVE. `O-Q7b_stepdelta_blind` drops step_delta
          everywhere; on md5 that removes the only determiner of `length`, its forced set becomes
          EMPTY, and it receives SIX adjudicated rows against the honest instrument's FIVE -- an
          instrument strictly blinder than the honest one is re-admitted MORE cells.
          `O-Q7a_totally_blind` projects away everything but `primitive`, identifies literally
          nothing, and receives SIX adjudicated rows on BOTH primitives, the maximum available.
        the_step_at_which_argument_A_survives: >-
          THE STEP IS THE SENTENCE `cells NOT forced for I are ADJUDICATED for I`, taken together
          with the fact that removing a component from pi_I CAN ONLY REMOVE DETERMINERS. THE RULE
          IS MONOTONE IN BLINDNESS. ARGUMENT A must explain why adjudication surface growing
          monotonically with an instrument's blindness is not what its quantity measures, and it
          cannot, because that is exactly what produced the 1 rather than the 0.
      - id: O-Q5
        pairs_with: ARGUMENT B
        outcome: REFUSED
        what_did_the_refusing_and_with_what_measurement: >-
          THE PRODUCER'S OWN ATTESTATION, PRE-EMPTIVELY AND IN THE RIGHT WORDS. It refuses the
          word INDEPENDENT for the value and keeps it only for the implementation-within-a-
          process, and it says NO TOOL IN THIS REPOSITORY CAN VERIFY THE BOOLEAN. That refusal is
          the control firing and it is a genuine, reportable strength. WHAT SURVIVES THE REFUSAL
          IS THE WORD `REPLICATION` ITSELF, WHICH THE CONTRACT AND THE BATCH RECORD USE AND WHICH
          IS HEARD AS BOTH PROPERTIES AT ONCE. The label I propose is in R4-J5.
      - id: O-Q6
        pairs_with: ARGUMENT C
        outcome: 'REFUSED ON MD5; SURVIVED ON SHA-1'
        the_refusal_on_md5_and_what_did_it: >-
          THE FAMILY'S DECLARATION, NOT THE GATE ALONE, AND I CREDIT IT EXPLICITLY BECAUSE THE
          PLAN'S FAILURE SIGNATURE TURNS ON THIS. The producer names the no-op draw itself -- `A
          draw that left the flag None would move ONE component and would be the committed family
          d_message_difference under a new name, which is the no-op the committed _perturb_flag
          comment names` -- and refuses it on that ground rather than accepting the gate's verdict
          as the whole story. My independent probe confirms the gate's half: an md5 entry with the
          flag merely set to False, message difference untouched, already fails W3.
        the_survival_on_sha1_which_the_plan_did_not_point_this_object_at: >-
          THE IDENTICAL ARGUMENT APPLIES TO THE SIDE WHERE THE FAMILY *IS* CONSTRUCTIBLE, AND IT
          IS NOT MADE THERE. On sha1 the declaration's flag clause is
          `SET THE FLAG TO ... P.sha1_in_linearized_code(list(dv))`, which is what the committed
          perturb_message_difference already does; 320 of 320 gate-accepted draws serialise
          identically to it; and W3 makes the containment a derivation rather than a sample. SO
          ON SHA-1 THE FAMILY IS ALSO AN EXISTING FAMILY UNDER A NEW NAME, AND ARGUMENT C --
          `this family probes whether the instrument separates in-code from out-of-code objects`
          -- IS FALSE OF IT, because 0 of 360 perturbed draws are in-code.
      - id: O-Q7
        pairs_with: 'ARGUMENT A and ARGUMENT C'
        outcome: EXHIBITED
        the_object_the_plans_author_did_not_imagine: >-
          O-E IS THE IDENTITY FUNCTION ON MD5. `proj_drop_on_primitive(['message_difference'],
          'sha1')` returns the key UNCHANGED whenever prim != 'sha1'. THE HONEST INSTRUMENT AND
          THE KNOWN-FALSE INSTRUMENT ARE THE SAME FUNCTION ON MD5. THEREFORE EVERY MD5
          DIFFERING-CELL COUNT IS ZERO BY CONSTRUCTION, ON EVERY CELL, UNDER EVERY READING, FOR
          EVERY FAMILY, FOREVER. THE MD5 HALF OF ARM (a) IS ARITHMETICALLY PINNED AT ZERO AND
          CANNOT FAIL.
        which_argument_it_bears_on_and_where: >-
          ARGUMENT A. The package reports the differing count ONLY AS AN AGGREGATE OVER BOTH
          PRIMITIVES -- `differing_cell_count: 1` against a denominator of 24 or 21 that sums md5
          and sha1 cells -- and emits NO per-primitive differing count anywhere in
          readmitted-cells-result.json. The primitive scope survives on the ONE differing cell,
          which carries `primitive_scope: sha1`, and that is why this is a reporting gap rather
          than an error. BUT H-4 REQUIRES EVERY COUNT TO CARRY ITS PRIMITIVE SCOPE AND H-9
          REQUIRES AN AGGREGATE TO BE NAMED AS ONE, AND A READER OF THE HEADLINE ROW SEES
          `1 of 24` WITHOUT SEEING THAT 12 OF THOSE 24 CELLS BELONG TO A PRIMITIVE ON WHICH THE
          TWO INSTRUMENTS ARE THE SAME FUNCTION.
        why_it_matters_beyond_bookkeeping: >-
          THIS IS THE EXACT SHAPE THE STANDING SENTENCE EXISTS TO PREVENT. A row reading
          `md5: 0 differing` is a fact about a projection returning its argument, and it is
          NOT a fact about MD5 -- but it is one substitution away from being read as one, in a
          campaign whose MD5 lane is BLOCKED and whose readable census is ZERO. The fix is one
          field: emit differing_cell_count PER PRIMITIVE and carry, beside the md5 entry, the
          sentence `O-E is the identity on md5, so this count is 0 by construction`.
        the_null_object_control_it_names: >-
          THE PARAMETER THAT SHOULD DESTROY THIS SIGNAL IS THE DIFFERENCE BETWEEN THE TWO
          INSTRUMENTS. On md5 that difference is exactly zero, and the measurement returns
          exactly zero -- a MATCHING RESULT AGAINST A NULL OBJECT, hence a CONTROLLED NULL and
          never a finding. That is the correct reading of the md5 row and no record of this batch
          currently states it.

