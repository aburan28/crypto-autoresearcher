  # ===================================================================
  joint_findings:

    - joint: R4-J4
      alias: R-a
      verdict: breaks
      one_line_verdict: >-
        THE PRODUCER'S CONDUCT WAS CORRECT AND ITS ARITHMETIC REPLICATES EXACTLY, BUT THE JOINT
        BREAKS ON QUESTION (3): the reported quantity is a property of the SELECTOR and not of
        the pair of instruments, and I exhibit the two integers from one instrument pair that
        show it.
      what_breaks_and_what_survives: >-
        WHAT SURVIVES, STATED FIRST AND NARROWLY: every integer the package reports for arm (a)
        is exactly what I derive independently; the exclusion partition, the forcing edges, the
        composition-order agreement, and the honest-DETECTED count all replicate. WHAT BREAKS:
        the reading `differing-cell count carries information about the instruments compared`.
        It does not, unqualified; it carries information about which instrument's forcing
        predicate chose the domain.

      the_ruling_on_the_reading:
        summary: >-
          THE CONTRACT'S TEXT ADMITS A READING THE PRODUCER DID NOT ENUMERATE, AND UNDER IT THE
          STOPPING RULE DOES NOT FIRE AND NEITHER OF THE PRODUCER'S TWO READINGS IS NEEDED.
        the_committed_text_it_rests_on: >-
          THREE SENTENCES OF THE FROZEN CONTRACT, READ TOGETHER RATHER THAN SEPARATELY.
          (i) `LET K BE THE STRICT MEMBERSHIP KEY, DERIVED AT RUN TIME FROM THE COMMITTED
          SERIALISER AND NOT HARD-CODED.`
          (ii) `Let r be a depth-1 row, i.e. the deletion of EXACTLY ONE component c(r) FROM K.`
          (iii) H-3: `EVERY EXCLUDED CELL CARRIES THE FORCING EDGE THAT EXCLUDES IT ... and every
          forcing edge cited IS ONE OF THE FOUR derived_and_witnessed EDGES. A cell excluded
          without a named edge IS NOT EXCLUDED; IT IS UNREPORTED.`
        reading_A_edge_only: >-
          ADMISSIBLE ONLY IF SENTENCE (iii-of-the-predicate) IS READ IN ISOLATION FROM SENTENCE
          (ii). It treats the md5 in_linearized_code row as a row, finds no determiner, and
          ADJUDICATES it. Cost, measured: it puts THREE md5 cells into the denominator whose
          `deletion` is the identity on every md5 key, so their verdict is NOT DETECTED by
          construction and they cannot move for any instrument. Denominator padding of exactly
          three per instrument -- 21 vs 18 for honest, 24 vs 21 for O-E, which is the whole of
          the difference between the two readings.
        reading_B_edge_or_vacuous: >-
          NOT ADMISSIBLE AS AN INSTANCE OF THIS CONTRACT'S RULE, AND THIS IS THE PART THE PLAN
          ASKED FOR IN TERMS. The committed predecessor rule
          (harness/diffpath/depgraph.py `forced_rows`) emits, for this case,
          `{"X": None, "Y": comp, "derivation": "<comp> IS NOT A COMPONENT OF THE <prim> KEY, so
          deleting it is the identity on every <prim> key"}`. THAT IS A DERIVATION WITH NO
          SOURCE COMPONENT, hence NOT ONE OF THE FOUR derived_and_witnessed EDGES, AND H-3 SAYS
          IN TERMS THAT A CELL EXCLUDED WITHOUT A NAMED EDGE IS NOT EXCLUDED BUT UNREPORTED. SO:
          A DERIVATION WITHOUT A SOURCE COMPONENT IS A DIFFERENT RULE WEARING THE SAME NAME. It
          is a sound exclusion -- the deletion really is the identity -- but it is not FORCING,
          and calling it forcing is what makes the two readings look like the only two options.
        reading_C_out_of_domain_MINE_AND_BUILT_AND_RUN: >-
          THE THIRD READING, AND IT IS THE ONE THE CONTRACT'S OWN WORDS GIVE. By sentence (ii)
          there is NO depth-1 row of the md5 key deleting in_linearized_code, because the
          run-time-derived md5 key has FIVE components and that is not one of them. The
          predicate has NO INSTANCE there. The cell is neither forced nor adjudicated: it is OUT
          OF DOMAIN and is emitted as `null` under H-8, which forbids emitting 0 for an
          unmeasured cell. I BUILT IT AS A RUN-TIME PROJECTION IN constructions/rt4_rederive.py
          AND RAN IT.
        the_cell_set_and_the_count_reading_C_produces: >-
          IDENTITY INSTRUMENT: md5 forced {length}, md5 out-of-domain {in_linearized_code}, sha1
          forced {length, in_linearized_code}. ADJUDICATED CELLS: md5 9, sha1 9, aggregate 18,
          with THREE md5 cells emitted as null. DIFFERING COUNT 0. O-E: md5 9 adjudicated + 3
          null, sha1 12 adjudicated, aggregate 21, DIFFERING COUNT 1, the same sha1 cell.
        THE_CONSEQUENCE_THAT_DISSOLVES_THE_STOPPING_RULE_QUESTION: >-
          UNDER READING C THE ADJUDICATED CELL SET IS *IDENTICAL* TO THE ONE READING B PRODUCES
          -- md5 9, sha1 9, aggregate 18 for the identity instrument, cell for cell. The two
          readings differ ONLY in the LABEL on the three md5 cells: B calls them `forced by an
          edge with no source component`, C calls them `null, no such row`. THEREFORE, UNDER
          READING C, CTL-FORCE-PI'S SIDE-A KNOWN ANSWER IS MET IN SUBSTANCE -- the same cells are
          adjudicated and the same cells are withheld as under the committed rule -- WITHOUT
          CITING AN EDGE THAT H-3 FORBIDS AND WITHOUT PADDING THE DENOMINATOR. THE STOP DOES NOT
          FIRE UNDER READING C.
      did_the_stopping_rule_fire:
        answer: >-
          UNDER THE READING I RULE ADMISSIBLE, NO. Under reading A, YES. Under reading B, no,
          but only by citing an exclusion H-3 does not permit. THE PRODUCER'S STATEMENT THAT THE
          STOP FIRES UNDER edge_only IS CORRECT AND I CONFIRM IT INDEPENDENTLY; what I add is a
          third disposition under which the question does not arise.
        what_H_6_would_forbid_if_it_had_fired: >-
          H-6 forbids reporting ANY re-admitted count. I record what that would have cost so the
          close can weigh it: it would suppress four integers that are IDENTICAL under all three
          readings -- 0 differing on the honest cell set, 1 differing on the O-E cell set, the
          identity of that cell, and honest_detected = 0 -- none of which depends on the reading.
        a_second_under_determination_the_two_reading_frame_does_not_cover: >-
          CTL-FORCE-PI ORDERS THE FORCED SET COMPARED `CELL BY CELL` AGAINST BATCH-145531's SIX,
          AND THE TWO OBJECTS ARE AT DIFFERENT GRANULARITIES. The committed six are
          `(family, row_deletes)` pairs with NO primitive index (depgraph.select_cells), and a
          row enters depgraph.forced_rows only when forced on EVERY primitive. The new rule is
          per-primitive by its own words. The mapping between them is a CHOICE the contract does
          not make. I measured both: at UNION granularity (a row is forced if forced on some
          primitive) the identity forced set EQUALS the committed six UNDER ALL THREE READINGS
          AND BOTH ORDERS, and no stop fires at all; at per-primitive granularity the producer's
          statement holds. The producer took the per-primitive mapping -- correctly, in my view,
          and it says so at `reproduces_BATCH_145531` -- but it took it WITHOUT DECLARING IT AS A
          CHOICE, and its execution report asserts `nothing_else_was_refused: NO OTHER TERM OF
          THE CONTRACT WAS FOUND UNDERSPECIFIED`. THAT SENTENCE IS FALSE AS WRITTEN. See F-2.
      does_the_quantity_measure_THE_INSTRUMENTS_OR_THE_SELECTOR:
        answer: 'THE SELECTOR. Demonstrated, not argued.'
        the_object: >-
          ONE PAIR OF INSTRUMENTS (honest, O-E), ONE SET OF CELL VERDICTS, TWO DIFFERENT
          INTEGERS. With the cell set chosen by the HONEST instrument's forcing predicate the
          differing count is 0; with the cell set chosen by O-E's it is 1. Nothing about the
          instruments changed between those two numbers -- only which predicate selected the
          domain. Both numbers are in the package and both are in my derivation.
        the_mechanism_stated_as_a_monotonicity: >-
          DELETING A COMPONENT FROM pi_I CAN ONLY REMOVE DETERMINERS, SO IT CAN ONLY SHRINK THE
          FORCED SET AND CAN ONLY GROW THE ADJUDICATED SET. THE RULE THEREFORE REWARDS BLINDNESS
          WITH ADJUDICATION SURFACE, AND IT DOES SO MONOTONICALLY. The single differing cell is
          adjudicated for O-E and FORCED for honest under EVERY reading, so the count is 1 only
          when the blind instrument selects.
        what_the_quantity_should_be_called_instead: >-
          NOT `the differing-cell count between honest and O-E`. Call it
          `differing cells over the set O-E's own blindness re-admits`, or more plainly
          `the number of cells whose verdict O-E changes among the cells O-E can no longer see
          forced`. Naming the selector in the field name is the whole fix and it is free.
        the_cheapest_control_that_would_separate_the_two_budgeted_concretely: >-
          THE SELECTOR-SWAP CONTROL, AND IT COSTS NOTHING THIS BATCH HAS NOT ALREADY BUILT.
          CONSTRUCTS: nothing new. ADJUDICATES: the SAME pair (honest, O-E) over FOUR domains --
          the honest instrument's adjudicated set, O-E's, their intersection, and their union --
          and reports FOUR integers side by side per primitive, each labelled with the selector.
          MEANING OF THE OUTCOMES: if the four integers are EQUAL, the quantity is a property of
          the pair and the selector is inert, which is POWER; if they DIFFER, the quantity is a
          property of the selector, which is ARTIFACT. I RAN IT. The four integers on sha1 under
          edge_or_vacuous are 0, 1, 0, 1. THEY DIFFER. THE OUTCOME IS ARTIFACT.
        the_null_object_control_this_implies_and_the_parameter_that_should_have_destroyed_the_signal: >-
          THE PARAMETER THAT SHOULD DESTROY A REAL SIGNAL IS THE INSTRUMENT'S INFORMATIVENESS: an
          instrument that identifies LESS should be able to adjudicate NO MORE. I built the null
          object. O-Q7a projects away every component but `primitive`, so it identifies literally
          nothing; its forced set is EMPTY on both primitives and it receives SIX adjudicated
          rows per primitive, MORE THAN THE HONEST INSTRUMENT'S FOUR ON SHA-1 AND FIVE ON MD5.
          The quantity does not decay as informativeness falls; it GROWS. That is the artifact
          tell of docs/inventor-protocol.md section 3, measured rather than asserted.

    - joint: R4-J5
      alias: R-b
      verdict: breaks
      one_line_verdict: >-
        THE IN-PROCESS MECHANISM IS REAL, WELL-BUILT AND CORRECTLY BOUNDED BY THE PRODUCER
        ITSELF. `REPLICATION` NEVERTHELESS OVERSTATES WHAT THIS ROUND ACHIEVED, and the reason
        is not the hook: it is that hard term H-1 REQUIRED the producer to be told the answer in
        prose, and the frozen contract told it again.
      what_the_mechanism_buys_in_one_sentence_a_close_can_copy: >-
        THE AUDIT HOOK RULES OUT EVERY READ OF THE FORBIDDEN IMPLEMENTATION THAT WOULD HAVE
        PASSED THROUGH A PYTHON `open` OR `os.open` EVENT INSIDE THE ONE PROCESS THAT PRODUCED
        THE MEASUREMENTS, AND IT RULES OUT NOTHING ELSE.
      what_the_hook_does_NOT_cover_enumerated:
        - >-
          IT DOES NOT COVER THE PRODUCING SESSION. The session is an agent holding file-reading
          tools that are not this Python process. The producer states this itself, unprompted
          and in the correct terms, at `is_the_non_reading_MECHANICALLY_DEMONSTRATED_or_ATTESTED`.
          That disclosure is a genuine strength and I record it as one.
        - >-
          IT DOES NOT COVER DIRECTORY LISTING. `events_hooked` is exactly ["open", "os.open"].
          `os.listdir` and `os.scandir` raise their own audit events and are not hooked, so an
          enumeration of the forbidden directory would not have been blocked. The producer's
          answer to that is an ATTESTATION -- `THIS PRODUCER DID NOT LIST THE DIRECTORY TO FIND
          OUT` -- not a mechanism. Cheap fix, named: add `os.listdir`, `os.scandir`, `os.stat`
          and `subprocess.Popen` to the hooked events; the cost is one tuple.
        - >-
          IT DOES NOT COVER A COPY. The prefix is a path, and the forbidden CONTENT existing at
          any other path in the tree is outside it. The same limitation the campaign already
          records for BCP-1 quarantine content applies here.
        - >-
          IT DOES NOT COVER A READ THAT NEVER RAISES AN AUDITED EVENT -- an fd obtained before
          the hook, an mmap of such an fd, or a read performed by a C extension that bypasses the
          audit machinery. I did not exhibit such a route and I do not claim one exists here;
          this is a bounded negative on the population the hook can see.
        - >-
          PATH COMPARISON AND NORMALISATION I COULD NOT CHECK, BECAUSE THE COMPARISON LIVES IN
          harness/diffpath/readmit.py, WHICH IS A blind_from PATH FOR ME. Whether it realpaths,
          casefolds, or matches a raw prefix is the Validator's under R4-J1 and I did not attempt
          it. WHAT I CAN OFFER IS A MEASURED FACT FROM MY OWN HOOK: substring matching on audit
          arguments has a real false-positive mode -- mine fired on a docstring containing the
          quarantine path as prose -- so the comparison's exact form is worth reading rather than
          assuming in either direction.
      a_mechanism_that_WOULD_make_the_session_level_boolean_checkable:
        found: 'PARTIALLY, AND I STATE THE PART THAT WORKS AND THE PART THAT DOES NOT.'
        proposal: >-
          A READ-SIDE LEDGER RATHER THAN A WRITE-SIDE PROMISE. The producing session's file reads
          are performed by a runtime whose tool invocations are already enumerable to that
          runtime. A harness that (a) records every tool-level file read into an append-only
          session log written to a declared path, and (b) has the run wrapper hash that log into
          the manifest, would make `did the session read path P` a checkable property of a
          committed artifact rather than a boolean in a file. IT IS BUDGETABLE: it needs a
          runtime hook, a write-once log path, and one manifest field.
        what_it_would_still_not_buy_stated_plainly: >-
          IT MOVES THE TRUST FROM THE AGENT TO THE RUNTIME AND DOES NOT ELIMINATE IT. A session
          that can write its own log can write a false one unless the log is written by the
          harness rather than by the agent. AND IT CANNOT COVER A MODEL'S OWN MEMORY, which is
          the same residual BCP-1 already records. A PROGRAM THAT KNOWS WHICH OF ITS GUARANTEES
          ARE UNVERIFIABLE IS IN BETTER SHAPE THAN ONE THAT DOES NOT, and this one does.
      THE_LABEL_RULING:
        the_third_possibility_the_contract_does_not_name_and_i_rule_on_it: >-
          THE CONTRACT'S IR-12 OFFERS EXACTLY TWO LABELS -- REPLICATION, and RE-EXECUTION if the
          forbidden path is read. NEITHER FITS. Hard term H-1 REQUIRED the producer to read
          DEC-20260824-257f35 and EV-DIFFP-afd96c, which state the control, the identity of the
          differing cell and the predecessor's integer IN PROSE, and H-1 says in terms that this
          is `REQUIRED AND IS NOT A VIOLATION`. On top of that the FROZEN CONTRACT'S OWN
          `objective` field states `returning 1 of 30 (RT-J8-4)`. AN IMPLEMENTATION THAT WAS TOLD
          THE ANSWER IN PROSE IS INDEPENDENT OF THE CODE AND NOT BLIND TO THE VALUE.
        does_REPLICATION_name_independence_of_the_implementation_blindness_to_the_result_or_both: >-
          IN ORDINARY USAGE IT IS HEARD AS BOTH, WHICH IS WHY IT IS THE WRONG WORD HERE. THIS
          ROUND ACHIEVED THE FIRST AND NOT THE SECOND.
        the_label_i_propose_the_close_should_use: >-
          `INDEPENDENT RE-IMPLEMENTATION, VALUE-INFORMED` -- or, if one word is needed,
          `RE-IMPLEMENTATION`. It is accurate, it is not a downgrade of the arithmetic, and it
          does not smuggle blindness to the result. THE COMPOUND FORM THE PLAN ASKS FOR:
          `implementation-independent by mechanism within one process; value-informed by
          contract; session-level non-reading attested and unverifiable`.
        and_it_applies_to_me_too_which_is_why_i_am_confident_of_it: >-
          MY OWN DERIVATION IS VALUE-INFORMED FOR EXACTLY THE SAME REASON. I read the frozen
          contract, and the frozen contract states the predecessor's integer. My agreement with
          the producer at 1 is therefore corroboration between two value-informed
          re-implementations, and the close must not describe it as two blind ones. SEE F-5.
      how_a_close_should_weight_matching_versus_differing_versus_MIXED:
        matching: >-
          WEAK, AND WEAKER THIS ROUND THAN THE CONTRACT'S OWN interpretation_limits ALREADY SAY.
          Contamination pushes toward agreement, and BOTH implementations were told the target
          integer by a required reading. An exact match on eight integers is good evidence that
          the stated rule produces those integers and is NOT evidence of independent arrival.
        differing: >-
          STRONG, AND ASYMMETRICALLY SO. A disagreement between two value-informed
          implementations cannot be manufactured by contamination, because contamination pulls
          the other way. Any disagreement found this round should be weighted heavily.
        the_MIXED_case_which_is_the_one_that_actually_occurred: >-
          THIS ROUND IS MIXED AND NEITHER THE CONTRACT NOR DEC-20260824-257f35 NAMES THE CASE.
          Arm (a): exact agreement on every integer. Arm (b): my independent construction of the
          family AS THE CONTRACT'S OWN EXAMPLE STATES IT gives 360/368 accepted on sha1 where the
          package reports 368/368. THE RULE THE CLOSE SHOULD APPLY: A MIXED OUTCOME IS WEIGHTED
          BY WHERE THE DISAGREEMENT SITS, NOT BY ITS SIZE. Here the agreement sits on the
          quantity both parties were told in advance, and the disagreement sits on the quantity
          neither was -- which is the reverse of the reassuring pattern, and which is why F-6
          matters more than the four matching rows.

