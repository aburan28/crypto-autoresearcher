          record may present them as such.
      the_per_primitive_split_and_whether_the_refusal_is_DERIVED:
        md5: >-
          THE REFUSAL IS GENUINELY DERIVED AND I CONFIRM THE DERIVATION INDEPENDENTLY. 0 of 368
          accepted, every rejection at W3. My own probe: an UNMODIFIED md5 census entry passes the
