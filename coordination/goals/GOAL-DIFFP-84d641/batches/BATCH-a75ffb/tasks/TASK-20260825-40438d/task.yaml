  the_gate_that_defines_this_task: >-
    DO NOT ARCHIVE UNTIL THE PRODUCER HAS RETURNED A TERMINAL RESULT. FILE PRESENCE IS NOT
    PRODUCER COMPLETION: a producer that has written all its declared paths may still be revising
    them. CORR-20260825-3105b9 records exactly this on GOAL-SCURVE-51437e -- snapshot commit
    e9ebf43b9d6e bound an INTERMEDIATE state of TASK-20260824-eaf0af's task report because only
    the "all declared artifacts exist on disk" half of the gate was evaluated; the producer then
    added post-authorship errata, a superseding snapshot was required, and the correction
    attributes the cause to ORCHESTRATION AND EXPLICITLY NOT TO THE PRODUCER, whose conduct it
    records as correct throughout. That correction also states that a coordinator subagent cannot
    self-enforce this gate, because it has no shell and cannot archive at all: THE GATE IS HELD BY
    WHICHEVER SESSION PERFORMS THE STAGING. IF TERMINALITY CANNOT BE ESTABLISHED, THIS TASK STOPS
    AND REPORTS. It does not archive and hope.
  binding_set:
