  what_is_deliberately_NOT_bound: >-
    dispatch_queue.json (BR-12). A dispatch queue is the one file in a batch that MUST change
    after the snapshot, because every task-state advance rewrites it. BATCH-efcae7's snapshot bound
    its own queue by content and the binding became permanently un-reconcilable: the receipt
    asserts a hash the queue can only match while every task is still in its opening state, and
    the driving session verified on 2026-08-25 that HEAD's queue still hashes exactly to that
    value -- which is what an un-advanced queue looks like. THE QUEUE IS STAGED AND COMMITTED AND
    IS DISCLOSED IN `staged_not_in_binding_set`, never bound. The same holds for the rest of the
    opening control plane, which no task in this queue owns.
  hard_rules:
    - >-
      RUNS ALONE. No other task may be running concurrently, and NO INDEPENDENT REVIEW MAY START
      before this commit exists and is verified.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity failure,
      not a convenience. Anything else that must be committed is DISCLOSED BY NAME in
      `staged_not_in_binding_set`, never folded in silently.
    - >-
      MERGE origin/main, NEVER REBASE. Rebasing rewrites the commits research artifacts were
      archived in. Record the base commit and the merge outcome. A SYNC CONFLICT INSIDE AN
      IMMUTABLE RECORD IS NEVER RESOLVED BY PICKING A SIDE OR BY EDITING THE RECORD: it is a new
      superseding record under a new id.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE REVIEW ROUND CLOSES (BR-11). No
      findings, verdicts, mechanisms or integers in any commit body, PR description, bus message
      or branch name while a round is open -- the adopted mitigation for PD-1, where validator
      findings leaked to the red team through a commit message body in a shared worktree. The
      round-3 blindness block additionally extends to COMMITTED ARTIFACTS THAT RESTATE COMMIT
      HISTORY, which was round 2's near-miss E-2.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. THIS TASK ARCHIVES; IT
      DOES NOT REVIEW. It does not adjudicate whether the graph reproduces the pre-registered
      partition and it does not say what the off-diagonal count means.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, WITH THEIR VERBATIM OUTPUT, and never record a
      command that was not executed. Any scalar this receipt binds is either MEASURED here or
      quoted WITH ITS PROVENANCE AND MARKED UNVERIFIED (PD-3, CORR-20260824-cc2d27: a defective
      producer integer once propagated two hops into Coordinator artifacts and reached a
      reviewer's instructions).
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading with the
      mechanism named.
    - >-
      DO NOT FLIP ANY TASK STATE, DO NOT WRITE ledger/goals/GOAL-DIFFP-84d641.yaml, AND DO NOT
      OPEN THE REVIEW ROUND. The goal head still names BATCH-efcae7 while this batch runs; that is
      declared and temporary and is corrected by this batch's ledger close, not here.
    - >-
      IF THE PRODUCER SPENT A CHARGED RUN, SAY SO. BR-1 sets this batch's charged-run count to
      zero; any run directory, RUN-* identifier or manifest under the producer's path is a DECLARED
      DEVIATION, reported as such and disclosed in `staged_not_in_binding_set` rather than quietly
      bound.
  required_pre_freeze_checks:
    - >-
      PRODUCER TERMINALITY established from the producer's returned completion report and NOT from
      a directory listing, with the method recorded. See `the_gate_that_defines_this_task`.
    - origin/main fetched and MERGED into the working branch, base commit and merge outcome recorded
    - tools/validate_ledger.py run on the merged tree, output recorded VERBATIM
    - >-
      tools/research_dispatch.py run against this batch's dispatch_queue.json, output recorded
      VERBATIM, including any warning about the archive path_sha256 subset rule
    - >-
      FROZEN-INSTRUMENT CROSS-CHECK: recompute the sha256 of every file under harness/diffpath/
      plus harness/__init__.py and harness/runner.py from the tree and compare against
      BATCH-efcae7's repro-and-frozen-result.json digest set AND against the producer's own
      recomputation. A DIFFERENCE ON ANY PRE-EXISTING FILE IS A STOP and an infrastructure finding,
      not something to archive over. keydeps.py is NEW and its absence from the earlier set is
      stated rather than treated as drift.
    - >-
      ARTIFACT-INDEX BINDING CHECK: artifact-index.json carries a sha256 for every file the
      producer wrote and every committed input it names, and each matches the tree. THIS IS HOW
      ANYTHING BEYOND THE EIGHT DECLARED PATHS IS CONTENT-BOUND, since this batch has no run
      directories.
    - >-
      ZERO-CHARGED-RUN CHECK: no run directory, RUN-* identifier, run manifest or armed deadline
      exists under the producer's path. Report the result either way.
    - no dirty-tree drift outside the declared paths
