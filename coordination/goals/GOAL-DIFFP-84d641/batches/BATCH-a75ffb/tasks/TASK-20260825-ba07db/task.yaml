    UNSPENT BUDGET IS REPORTED AS UNSPENT AND IS NEVER REALLOCATED.
  uncertainty_to_reduce: >-
    Whether this program's own per-component power profile can be READ at all, and how much of
    it is about the instrument. A NOT DETECTED verdict from BATCH-efcae7 is a provable
    impossibility, a coverage gap, or a genuine negative, and the single column it is reported
    in cannot tell a reader which.
  job: >-
    THREE NUMBERED DELIVERABLES, IN THIS ORDER, ALL STATIC.
    (1) From the committed `adjudicator.serialize()`, derive the membership key's component
    list PER PRIMITIVE under the generator set BATCH-efcae7 used, and for each ORDERED PAIR of
    components decide whether one is a deterministic function of the other, with a DERIVATION or
    an EXHIBITED WITNESS SET for every pair and an explicit `undetermined` where you have
    neither. Then RE-PARTITION every depth-1 verdict of BATCH-efcae7 into PROVABLY UNDETECTABLE
    BY ANY FAMILY / NOT PROBED BY A DECLARED FAMILY / PROBED AND GENUINELY NOT DETECTED / and,
    for the DETECTED rows, ENTAILED BY THE PERTURBING FAMILY'S OWN DECLARATION versus CONTINGENT
    ON THE INSTRUMENT.
    (2) Name the depth-2 subsets that BREAK a dependency, with the argument for each and for
    every subset that does not, so the fifteen-subset lattice is bought by argument not compute.
    (3) GATED ON (1): on the off-diagonal cells the MEASURED graph marks as capable of carrying
    information, adjudicate the family-by-row matrix twice -- honest instrument and O-E -- and
    report THE COUNT OF DIFFERING CELLS.
  the_falsification_test_this_task_carries: >-
    THE PARTITION IS PRE-REGISTERED IN batch.yaml `pre_registered_partition` AND REPRODUCING OR
    REFUTING IT FROM THE GRAPH ALONE IS DELIVERABLE (1)'s OWN FALSIFICATION TEST. The
    pre-registered classes over the six depth-1 rows are: provably undetectable 1
    (in_linearized_code), not probed 3 (primitive, length, block_index), probed and genuinely not
    detected 0, entailed by construction 1 (message_difference), contingent on the instrument 1
    (step_delta) -- 1 + 3 + 0 + 1 + 1 = 6. THAT PARTITION WAS COMPOSED AT THE BATCH-efcae7 CLOSE
    FROM THREE SEPARATE SOURCES and has never been derived from one. A REFUTATION IS A
    FIRST-CLASS RESULT: report the row, both classes and the derivation that separates them. DO
    NOT ADJUST A CLASS TO MAKE THE ARITHMETIC COME OUT.
  the_two_pre_distinguished_outcomes_of_deliverable_3: >-
    BOTH ARE RESULTS AND NEITHER IS A FAILURE. IDENTICAL MATRICES mean the power profile is a
    function of the perturbing families' construction and of the dependency graph and carries NO
    information about the instrument at all. ANY DIFFERING CELL is a place where a verdict IS
    contingent on the instrument, and the count is the measurement this program has never had.
  hard_rules:
    - >-
      BR-1 ZERO CHARGED RUNS. No run directory, no RUN-* id, no manifest, no armed deadline, no
      consumed ceiling; do not invoke harness/runner.py `run_wrapped`. See batch.yaml
      `zero_charged_runs_and_its_cost` for what this buys and what it costs -- in particular that
      deliverable (3) is therefore NOT produced under run discipline, and must be re-run under a
      charged contract before any evidence record leans on its count.
    - >-
      BR-2 NO COMMITTED FILE UNDER harness/ MAY BE MODIFIED. Exactly two new files:
      harness/diffpath/keydeps.py and tests/test_diffpath_keydeps.py. No existing test file is
      edited. IF YOU SEE THE FIX, WRITE IT DOWN AS AN OBSERVATION AND DO NOT APPLY IT.
    - >-
      DO NOT WRITE OR EDIT THIS CARD. task.yaml sits inside your write-scope directory and it is
      the Coordinator's, not yours (batch.yaml `artifact_ownership_note`). If you believe it must
      change, report a blocker and stop.
    - >-
      BR-3 / BR-4 THE PARTITION IS REPRODUCE-OR-REFUTE AND STAGE (3) IS GATED ON THE MEASURED
      GRAPH. Do not run stage (3) first, do not run the DIAGONAL -- it is known in advance by
      round 2's own general rule, a family perturbing exactly the set a row deletes is DETECTED BY
      CONSTRUCTION -- and if the measured graph disagrees with the pre-registration, FOLLOW THE
      MEASURED GRAPH and record the divergence as a declared deviation.
    - >-
      BR-5 ANY FAMILY PERTURBING `in_linearized_code` PASSES A WELL-FORMEDNESS GATE FIRST. Null
      family (e) as specified would build an object whose redundant fields contradict each other
      and whose detection would mean nothing. IF THE GATE CANNOT BE SATISFIED, REPORT NOT
      CONSTRUCTIBLE WITH THE REASON -- never a zero, never an empty cell, and NEVER as evidence
      that the direction is closed. IT IS NOT CLOSED.
    - >-
      ONE GRAPH PER PRIMITIVE. The committed serialize() emits `in_linearized_code` only for
      sha1 and takes `message_difference` from `delta_m` on md5 and `dv` on sha1, so the two keys
      do not have the same component set. A MERGED SINGLE GRAPH IS A DECLARED DEFECT, and the
      six-row partition is a UNION whose composition must be stated with any single-primitive row
      named as such.
    - >-
      REBUILD O-E FROM ITS COMMITTED DEFINITION -- rt_instruments.py
      `proj_drop_on_primitive(["message_difference"], "sha1")` -- AND DO NOT INVENT A SECOND
      BLIND INSTRUMENT. State BOTH that the rebuild is a second implementation of a construction
      round 2 left unreplicated AND that it is NOT full replication, because it reads the same
      committed serialiser.
    - >-
      BR-6..BR-10 REPORTING DISCIPLINE. Every DETECTED / NOT DETECTED verdict quoted from
      BATCH-efcae7 carries its BASIS and its PRIMITIVE SCOPE. Never quote the 5200-draw figure as
      robustness to perturbation size. Never state power over the SHA-1 message difference more
      widely than power over the sixteen-word seed window plus one flag bit on this census. State
      the attribution table's implementation dependence beside any citation of it.
      `closest_distance` is a diagnostic and never a margin. Strict and permissive are separate
      fields and are never merged. An unmeasured cell serialises as NULL, never as integer zero.
    - >-
      DO NOT REPAIR THE INSTRUMENT. VD-3, VD-4, the {E4}/{E5} zero-image result, OBJ-3, OBJ-4,
      OBJ-10, RC-1's sub-arm fold and the two routed labelling defects are DESCRIBED here and
      FIXED later by a ranked decision.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** BY ANY ROUTE -- network, package
      index, retrieval index, or a model's own memory written into a file -- and do not re-hash
      the payload. ATTEST NON-READING AND NAME THE MECHANISM.
    - >-
      NO ACQUISITION, NO SEARCH, NO IDEA-* MINT, NO IDENTIFIER OF ANY KIND.
      AMD-20260824-DIFFP-ACQ-1 is in force: Tier A refused by every route, TIER B BLOCKED PENDING
      A GOAL-MD5-001 DECISION -- BLOCKED, NOT CLOSED -- Tier C permitted but NOT AUTHORISED HERE.
      THE MD5 LANE IS NOT CLOSED AND NOTHING YOU WRITE MAY IMPLY THAT IT IS.
    - >-
      MAKE NO COMMIT AND STAGE NOTHING. A timeout, crash, import failure or implementation
      failure is INFRASTRUCTURE SIGNAL, never a negative mathematical result and never a finding
      about the graph or either primitive. NEVER FABRICATE A COMMAND, OUTPUT, TIMING, STATISTIC,
      CITATION OR RUN, and never quote a commit sha you did not measure. NEVER any provider,
      backend, endpoint or model identifier containing "Bedrock".
    - >-
      RECORD OBSERVATIONS ONLY. Compose no verdict on whether the instrument is validated, on
      novelty, or on either primitive's difference space. CLAIM CEILING `analyzed`, NEVER
      `supported`. A PASSING CONTROL IS NOT AN IMPROVEMENT, and a dependency graph is a fact
      about this program's own instrument and not a result about MD5 or SHA-1.
