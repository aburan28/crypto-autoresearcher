  state: queued
  budget:
    wall_clock_seconds: 1200
    memory_gb: 4
    maximum_runs: 1
  budget_note: >-
    THIS TASK SPENDS ZERO CHARGED RUNS (BR-1). `maximum_runs: 1` IS A SCHEMA FLOOR AND NOT AN
    AUTHORISATION -- tools/research_dispatch.py rejects 0 -- and it is the same device
