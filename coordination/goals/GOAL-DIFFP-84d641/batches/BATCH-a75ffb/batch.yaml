pre_registered_partition:
  what_it_is: >-
    THE OBJECT TASK-20260825-ba07db MUST REPRODUCE OR REFUTE FROM THE DEPENDENCY GRAPH
    ALONE. It is quoted from DEC-20260824-c5bb72 `next_actions` and
    `per_component_power_table.the_column_that_is_new_this_round_and_is_the_point`, and
    from the goal head's `next_action`, and is NOT this session's measurement.
  over: THE SIX DEPTH-1 ABLATION ROWS OF BATCH-efcae7
  classes:
    provably_undetectable_by_any_family: 1
    provably_undetectable_which: [in_linearized_code]
    not_probed_by_a_declared_family: 3
    not_probed_which: [primitive, length, block_index]
    probed_and_genuinely_not_detected: 0
    entailed_by_the_perturbing_familys_own_declaration: 1
    entailed_which: [message_difference]
    contingent_on_the_instrument: 1
    contingent_which: [step_delta]
  arithmetic: 1 + 3 + 0 + 1 + 1 = 6, THE SIX ROWS. IT IS A PARTITION AND NEVER A FRACTION.
  a_trap_that_is_named_at_opening: >-
    THE SIX ROWS ARE A UNION ACROSS TWO PRIMITIVES AND THE KEYS ARE NOT THE SAME.
    `in_linearized_code` exists only on SHA-1 (P-4). A per-primitive analysis therefore
    cannot produce a six-row partition on either primitive alone, and a producer that
    silently merges the two to make the arithmetic come out has committed the defect this
    task exists to find. THE REQUIRED FORM IS ONE PARTITION PER PRIMITIVE PLUS AN EXPLICIT
    STATEMENT OF HOW THEY COMPOSE INTO THE SIX-ROW UNION, with any row that exists on only
    one primitive named as such.

