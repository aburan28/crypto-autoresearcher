    as `proj_drop_on_primitive(["message_difference"], "sha1")` wrapped in the `Instr`
    class, used at run_j8b.py ("O-E md-blind on SHA1 ONLY") and run_j12.py.
  it_must_be_REBUILT_FROM_THAT_DEFINITION_and_not_reinvented: >-
    A second, differently-invented blind instrument would measure a different object and
    would silently break comparability with the round-2 numbers this batch reads.
  what_the_rebuild_buys_and_what_it_does_not: >-
    IT IS THE SECOND IMPLEMENTATION OF AN ADVERSARIAL CONSTRUCTION DEC-20260824-c5bb72
    RECORDED AS UNREPLICATED (EV-DIFFP-b16b01 UC-2), and that unreplication is one of the
