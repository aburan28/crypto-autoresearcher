queue_binding_note: >-
  dispatch_queue.json IS NOT IN ANY TASK'S `artifact_paths` AND IS THEREFORE NOT IN THIS
  BATCH'S SNAPSHOT BINDING SET. THIS IS DELIBERATE AND IT IS A CORRECTION OF BATCH-efcae7.
  WHAT WENT WRONG THERE. BATCH-efcae7's opening task owned its own dispatch_queue.json as
  an artifact path, and that task was a `source_task_ids` entry of the snapshot archive, so
  the snapshot receipt bound the queue BY CONTENT. A dispatch queue is the one file in a
  batch that MUST change after the snapshot -- every task-state advance rewrites it -- so
  the binding became permanently un-reconcilable: the committed receipt asserts a hash that
  the queue can only match while every task is still in its opening state. The driving
  session verified on 2026-08-25 that HEAD's queue still hashes exactly to the value that
  receipt binds, which is what an un-advanced queue looks like.
  WHAT THIS BATCH DOES INSTEAD. The snapshot binds THE PRODUCER'S ARTIFACTS AND ITS OWN
  RECEIPT, and nothing else. The queue, this batch record, the two task cards and the two
  ledger handoffs are STAGED, COMMITTED AND PUBLISHED but are declared in the receipt's
  `staged_not_in_binding_set` with the reason. THE COST IS STATED PLAINLY: the opening
  control plane is committed and reachable but is not content-bound by this batch's
  archive, so a later reader verifies it from git history rather than from a receipt hash.
  That is strictly better than a binding that must be broken to make progress.

artifact_ownership_note: >-
  THE TWO TASK CARDS LIVE AT
  coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-a75ffb/tasks/<TASK-ID>/task.yaml,
  which places the PRODUCER's card inside the PRODUCER's own write_scope directory. That
  path layout is the one this batch was opened with and it is not changed mid-batch; the
  guard is explicit instead. THE CARD IS WRITTEN BY THE COORDINATOR AT OPENING AND IS NOT
  THE PRODUCER'S TO CREATE, MODIFY, EXTEND OR DELETE. TASK-20260825-ba07db must not write
  or edit task.yaml inside its own directory, and must report any need to as a blocker
  rather than acting on it. The card is in no task's `artifact_paths`, is owned by no queue
  task, and is disclosed in the snapshot receipt's `staged_not_in_binding_set`.
  ledger/goals/GOAL-DIFFP-84d641.yaml IS NOT WRITTEN BY THIS OPENING. Advancing
  `current_batch_id` and `dispatch_queue_path` is the LEDGER-ARCHIVE step at this batch's
  close, not its opening; the goal head therefore still names BATCH-efcae7 while this batch
  runs, and that is a known, declared, temporary inconsistency rather than a defect. It is
