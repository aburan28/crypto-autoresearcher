claim_ceiling: >-
  `analyzed`, NEVER `supported`, FOR EVERY RECORD THIS BATCH PRODUCES, AND IT IS STATED
  HERE RATHER THAN LEFT TO INFERENCE. NO PATH IS CLAIMED NEW FOR EITHER PRIMITIVE AT ANY
  TIER. NO CRYPTANALYTIC IMPROVEMENT OF ANY KIND IS CLAIMED. A PASSING CONTROL IS NOT AN
  IMPROVEMENT, and a control suite that detects more ablations than the last one is a
  better instrument and still not a result about MD5 or SHA-1. An evidence strength of
  `replicated` describes how many implementations produced a number, NEVER what the
  number means. With a readable census of 0 entries a NON-MEMBER verdict carries no
  information about the literature at all, and every record citing one states the
  census's completeness (readable 0 / quarantined_not_read 1 / acquisition_gap 8, NEVER
  SUMMED; shadow_planted 16 carried separately) in the same sentence.
  Three of CLAUDE.md's four supported-promotion gates are structurally unmet by a batch of
  this kind and the fourth is not attempted. This goal carries no asymptotic-complexity
  claim; if a later batch proposes one, all four promotion gates in agents/coordinator.md
  apply before it may move toward `supported`.
  AN ADDITIONAL CEILING SPECIFIC TO THIS BATCH'S SHAPE. SUPERSEDED IN PLACE ON 2026-08-25,
  BEFORE ANY COMMIT, AND THE ORIGINAL TEXT IS PRESERVED HERE RATHER THAN ERASED. IT READ:
  "THE QUEUE THIS OPENING WRITES CARRIES `review_required: false` ON THE PRODUCER. THAT IS A
