contamination_firewall: >-
  GOAL-MD5-001's BCP-1 quarantine (coordination/goals/GOAL-MD5-001/quarantine/**, payload
  sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) IS NOT READ BY
  ANY TASK OF THIS BATCH, and the firewall covers CONTENT BY EVERY ROUTE including the
  network, a package index, a model's own memory reproduced into a file, and any retrieval
  index (AMD-20260824-DIFFP-ACQ-1 OB-1). Every task attests non-reading AND NAMES THE
  MECHANISM rather than the intent. This batch does not even re-hash the payload: CTL-QUAR
  discharged that in round 1, the round-1 Validator independently confirmed the digest from
  the bytes, and TASK-20260824-3bd362's OBJ-9 raised for precedent that a byte count of a
  quarantined payload is a derived quantity beyond the authorised whole-file sha256.
  THE SURFACE IS SMALLER THAN EVER THIS BATCH AND THAT IS SAID PRECISELY: the producer
  touches no census content at all. It reads committed source, committed JSON results and
  committed records, and constructs objects only from the already-declared census
  construction seeds. A breach is reported to GOAL-MD5-001 as a cross-goal contamination
  finding and invalidates the analysis.
  THE MD5 LANE IS BLOCKED, NOT CLOSED. Letting "blocked" drift into "closed" would be
  premature closure under docs/inventor-protocol.md, which that protocol treats as a
  failure mode SYMMETRIC WITH OVERCLAIMING. No record of this batch may state or imply that
  the MD5 arm is exhausted, deprioritised on the merits, or screened out.

knowledge_retrieval: >-
  Every task attempts `search_knowledge` before any assertion about what has or has not
  been tried, and records its queries and outcomes VERBATIM. The index is derived and may
  be empty; an empty answer is a fact about the index and licenses no inference in either
  direction (AGENTS.md "Knowledge retrieval policy"). No task of this batch writes to the
  index.

runtime_policy: >-
  Per-role policies are resolved through orchestration/roles.yaml and
  orchestration/model-policies.yaml. The producer requests `executor-implementation`; the
  snapshot archive requests `coordinator-orchestration-code`; the review pair, when added,
