review_architecture_pending: >-
  READ THIS BEFORE READING THE QUEUE. This opening is DELIBERATELY PARTIAL and the reason
  is an identifier fact, not a judgement about whether the package needs review.
  WHAT EXISTS. The driving session pre-allocated and verified free exactly three
  identifiers for BATCH-a75ffb: the batch id, TASK-20260825-ba07db (executor) and
  TASK-20260825-40438d (coordinator, snapshot archive). This Coordinator subagent HAS NO
  SHELL, cannot run tools/allocate_id.py, and MINTS NOTHING. There is therefore no id for
  a Validator, no id for a Red Team, no id for the review-plan handoff and no id for the
  ledger close.
  WHY THE PRODUCER CARRIES `review_required: false`. tools/research_dispatch.py
  `_validate_review_chains` requires that a producer with `review_required: true` have, IN
  THE SAME QUEUE, at least one successor whose role is in {reviewer, validator, red-team},
  a snapshot archive between them, and exactly one ledger archive depending on every such
  review. A two-task queue cannot satisfy that, so a queue declaring `review_required:
  true` HERE WOULD NOT RENDER AT ALL. The flag is set false so the queue renders; IT
  ASSERTS NOTHING ABOUT WHETHER THE PACKAGE NEEDS REVIEW, AND THIS PARAGRAPH IS WHY THE
  FLAG MUST NEVER BE CITED AS THOUGH IT DID.
  THE BINDING CONSEQUENCE. TASK-20260825-ba07db IS CLAIM-RELEVANT AND ITS PACKAGE IS NOT
  ADMISSIBLE EVIDENCE UNTIL IT HAS BEEN INDEPENDENTLY REVIEWED. The second Coordinator
  pass -- exactly the shape BATCH-efcae7's own pass 2 took when the driving session minted
  TASK-20260824-e9d21a and the Red Team was added on the merits -- MUST, once the ids
  exist: add a SIBLING-BLIND VALIDATOR AND RED TEAM PAIR on disjoint joint sets, both
  depending on TASK-20260825-40438d; add a ledger archive depending on both; flip the
  producer's `review_required` to true; and write the review plan AFTER the snapshot
  archive lands and BEFORE either reviewer runs. Until that pass has run and been
  committed, the only durable output of this batch is a snapshot binding of an unreviewed
  producer package, and it is to be described that way and no other way.
  WHY THIS IS NOT A DEFERRED RED-TEAM PASS OF THE KIND DEC-20260824-ad098e REFUSED. That
  refusal was about deferring the adversary to a LATER BATCH, where it could not have been
  blind because the evidence record and the closing decision would already be committed.
  Nothing of the sort happens here: no evidence record and no decision about this
  producer's output exists or may exist before the pair runs, and the pair runs inside
  BATCH-a75ffb against the snapshot, blind, exactly as round 2 did.

