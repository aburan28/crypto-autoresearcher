  what_it_is: >-
    THE PER-PRIMITIVE-BLIND ADJUDICATOR: blind to `message_difference` ON SHA-1 ONLY, and
    honest on MD5. It is the STRONGEST SURVIVING OBJECT of the round-2 proves-too-much
    pass (DEC-20260824-c5bb72 `composed_ruling` J8, prior scoring A-2(ii)).
