zero_charged_runs_and_its_cost: >-
  STATED AT OPENING, IN FULL, BECAUSE IT IS THE ONE PLACE THIS BATCH'S SHAPE COULD BE
  OVER-READ LATER.
  WHAT THE RULE MEANS. `maximum_runs` in this program COUNTS CHARGED EXPERIMENT RUNS
  UNDER A CONTRACT -- a run directory, a RUN-* identifier, a manifest, an armed deadline
  and a consumed ceiling. It does NOT count script executions, read-only probes, cold
  re-derivations or unit-test invocations. That definition is DEC-20260824-af6d5c
  `budget_adjudication.red_team_run_count`, restated in BATCH-efcae7's queue because two
  reviewers read the field two different ways. BR-1 sets this batch's charged-run count to
  ZERO under that definition: the producer executes Python, imports the committed
  adjudicator, and computes; it charges nothing, because there is no contract under which
  a run of this batch could be charged.
  WHERE THE GOAL HEAD IS AMBIGUOUS AND HOW THIS OPENING RESOLVES IT, RECORDED RATHER THAN
  SMOOTHED. The goal head's next_action attaches "STATIC, ZERO-CHARGED-RUN" to clause (1)
  ONLY, and DEC-20260824-c5bb72 rank 1 says "its FIRST STAGE costs zero charged runs" and
  "its first stage consumes no charged run at all" -- both of which leave open that stage
  (3), which adjudicates real objects against two instruments, might be charged. THIS
  OPENING RESOLVES IT TO ZERO FOR THE WHOLE TASK. The resolution is coherent rather than
  convenient: this batch approves no experiment contract, and a charged run requires one.
  IT IS RECORDED HERE AS A RESOLUTION OF AN AMBIGUITY, NOT AS A READING THE GOAL HEAD
  COMPELLED.
  THE COST, WHICH IS REAL. Stage (3)'s differing-cell count is produced WITHOUT a
  manifest, WITHOUT an armed deadline, WITHOUT a declared seed envelope and WITHOUT
  wrapper-measured wall clock -- which is precisely the deficiency that made
  EV-DIFFP-b878aa O-7's ablation battery "review-side computation with no run record" and
  that BATCH-efcae7 was opened to remove. This batch reintroduces that deficiency for
  stage (3) DELIBERATELY AND WITH ITS EYES OPEN, because stage (3) is deterministic (no
  seeds beyond the census construction seeds already declared and committed), because its
  inputs are committed bytes, and because artifact-index.json content-binds every file it
  writes.
  THE BINDING CONSEQUENCE, WHICH IS THE POINT OF SAYING ALL OF THIS AT OPENING: IF STAGE
  (3)'s DIFFERING-CELL COUNT BECOMES CLAIM-RELEVANT -- if any evidence record, obstruction
  quantity, `resource_check` or decision of this goal leans on it -- IT MUST FIRST BE
  RE-RUN UNDER A CHARGED CONTRACT WITH A MANIFEST AND AN ARMED DEADLINE. Until then it is
  a DERIVATION, reportable as such, and its strength may not be recorded above what a
  derivation without run discipline supports. A close that quoted it as a measured
  quantity under run discipline would be repeating, one layer up, the exact over-read this
  whole goal has now recorded twice.

