    the rebuild and the original read THE SAME COMMITTED SERIALISER, so agreement is
    evidence about the PROJECTION and is NOT an independent check that the serialiser
    implements the contract. That qualification is the round-2 Red Team's own, stated
    against its own finding, and is adopted here unchanged.

