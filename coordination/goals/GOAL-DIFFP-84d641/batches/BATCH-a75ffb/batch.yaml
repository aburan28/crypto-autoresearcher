binding_rules:
  BR-1: >-
    ZERO CHARGED RUNS. No run directory, no RUN-* identifier, no manifest, no armed
    deadline, no consumed ceiling, under any contract. `maximum_runs: 1` on both handoffs
    is a SCHEMA FLOOR -- tools/research_dispatch.py rejects 0 -- and is not an
    authorisation, following the `budget_note` precedent of BATCH-efcae7's archive tasks.
    See `zero_charged_runs_and_its_cost` for what this buys and what it costs.
  BR-2: >-
    NO COMMITTED FILE UNDER harness/ MAY BE MODIFIED. The BATCH-f8bf86 adjudicator is an
    INPUT that is READ AND ANALYSED, never repaired. Exactly two new files may be written:
    harness/diffpath/keydeps.py and tests/test_diffpath_keydeps.py. IF YOU SEE THE FIX,
    WRITE IT DOWN AS AN OBSERVATION AND DO NOT APPLY IT. Both paths are declared in the
    producer's `artifact_paths` AT OPENING so the snapshot can bind them by path_sha256 --
    the durable fix for the G7 gap adjudicated in DEC-20260824-af6d5c, which cannot be
    retrofitted at a later archive because of the subset rule.
  BR-3: >-
    THE PARTITION IS PRE-REGISTERED AND IS REPRODUCE-OR-REFUTE. The six-row partition in
    `pre_registered_partition` below is fixed before the analysis runs. Reproducing it FROM
    THE GRAPH ALONE and refuting it are BOTH first-class results; a refutation is reported
    with the row, both classes and the derivation that separates them, and is never
    smoothed into agreement.
  BR-4: >-
    STAGE (3) IS GATED ON STAGE (1)'s OUTPUT. The off-diagonal cells adjudicated are the
    ones the MEASURED graph marks as capable of carrying information, not the ones the
    pre-registered partition implies. If the measured graph differs from the
    pre-registration, stage (3) follows the MEASURED graph and the divergence is recorded
    as a declared deviation, never absorbed.
  BR-5: >-
    ANY FAMILY THAT PERTURBS `in_linearized_code` PASSES A WELL-FORMEDNESS GATE FIRST. This
    is goal-head restriction (3) and DEC-20260824-c5bb72 `successor_gates` item 2: null
    family (e) as specified would construct an object whose redundant fields contradict
    each other, and its detection of the flag row WOULD MEAN NOTHING. THE DIRECTION IS NOT
    CLOSED AND THE CONDITION IS AMENDED, NOT RELAXED. If the gate cannot be satisfied, that
    family is reported as NOT CONSTRUCTIBLE with the reason, NEVER as a zero and never as
    an empty cell.
  BR-6: >-
    EVERY DETECTED OR NOT DETECTED VERDICT QUOTED FROM BATCH-efcae7 CARRIES ITS BASIS --
    contingent, entailed by construction, theorem of the dependency graph, or not probed --
    AND ITS PRIMITIVE SCOPE. A bare verdict from that table is the "96/96 and 0/3000"
    failure one layer up (DEC-20260824-c5bb72 `successor_gates` item 3).
  BR-7: >-
    THE 5200-DRAW FIGURE MAY NEVER BE QUOTED AS EVIDENCE THAT REJECTION IS ROBUST TO
    PERTURBATION SIZE. The outcome is exactly flat in k because membership is exact equality
    on a tuple (`successor_gates` item 4).
  BR-8: >-
    ANY STATEMENT OF POWER OVER THE SHA-1 MESSAGE DIFFERENCE IS BOUNDED ABOVE BY POWER OVER
    THE SIXTEEN-WORD SEED WINDOW PLUS ONE FLAG BIT ON THIS CENSUS, because every planted
    SHA-1 entry is in the linearized code (`successor_gates` item 5).
  BR-9: >-
    ANY CITATION OF THE ROUND-2 ATTRIBUTION TABLE STATES ITS IMPLEMENTATION DEPENDENCE
    BESIDE IT: holding the flag fixed instead of recomputing it moves the SHA-1 attribution
    from a two-component conjunction on 2600 of 2600 to the message difference alone on
    2600 of 2600, with the verdict unchanged at zero members either way. The recompute
    choice is CORRECT and is not to be reversed (`successor_gates` item 6).
  BR-10: >-
    `closest_distance` REMAINS A REPORTED DIAGNOSTIC, NOT A DECISION VARIABLE AND NOT A
    MARGIN, in every artifact of this batch.
  BR-11: >-
    SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THE SNAPSHOT ARCHIVE UNTIL THE REVIEW ROUND
    CLOSES. No findings, verdicts, mechanisms or integers in any commit body, PR
    description, bus message or branch name while a round is open, AND the blindness block
    of the round-3 plan EXTENDS TO COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY --
    round 2's near-miss E-2, where the producer's own execution report quoted three commit
    shas and described what two of them contained, inside both reviewers' read scope.
  BR-12: >-
    NO ARCHIVE OF THIS BATCH BINDS coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-a75ffb/dispatch_queue.json
    BY CONTENT. See `queue_binding_note`; this rule exists because BATCH-efcae7 did.
  BR-13: >-
    THE ROLE CONTRACT GOVERNS WHERE A TASK CARD DIFFERS FROM IT. DEC-20260824-c5bb72
    `open_items_carried_to_the_next_batch` records a reviewer commit conflict between the
    role contracts and the task cards, to be reconciled at batch 3's opening by amending
    the cards. Discharged for the two cards this opening writes: NEITHER TASK COMMITS.
    The producer writes files and returns; the archive task AUTHORS a receipt and the
    DRIVING SESSION performs every git operation under Coordinator authority. Where a card
    of this batch and the role contract in agents/*.md differ on commit behaviour, tool
    surface or authority, THE ROLE CONTRACT GOVERNS. The reviewer cards are reconciled the
    same way by the pass that mints them.
  BR-14: >-
    NEVER AMAZON BEDROCK in any runtime, backend, endpoint, fallback or probe, and never
    any provider, backend, endpoint or model identifier containing "Bedrock" (AGENTS.md
    rule 16). `degraded_allowed` and `fallback_allowed` are FALSE on every handoff of this
    batch: a tier the backend cannot reach is a PAUSE and an `inference_amendment`, never a
    silent downgrade.
  BR-15: >-
    NEVER FABRICATE A COMMAND, AN OUTPUT, A TIMING, A STATISTIC, A CITATION OR A RUN.
    Missing data stays missing and is reported as missing. Never invent, quote or restate a
    commit sha this session did not measure.

