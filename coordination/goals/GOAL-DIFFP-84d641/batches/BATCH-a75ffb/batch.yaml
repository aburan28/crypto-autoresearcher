prior_handling_rule: >-
  THIS BLOCK IS SEALED FROM THE ROUND-3 REVIEWERS BY READ SCOPE, AND THE ROUND-3 REVIEW
  PLAN CARRIES IT BY POINTER ONLY. DEC-20260824-c5bb72 `successor_gates` requires batch 3
  to "carry the prior by POINTER rather than by embedding it, including in the plan's
  mandatory `coordinator_prior` field", and independence exposure E-3 measured why: in
  round 2 NEITHER reviewer read batch.yaml -- one declined it deliberately -- but the
  plan's own one-sentence prior, inside review-plan.yaml, which the independence checker
  REQUIRES to be non-empty and which both reviewers list in sources_read, named the
  in_linearized_code mechanism and leaked its direction to both.
  THE PARTIAL DISCHARGE IS DECLARED RATHER THAN CLAIMED (deviation PD-A). This session may
  write only six files and none of them is a sealed-prior path, so the prior is recorded
  HERE, in the only file available to it, and the pointer discipline is imposed as a rule
  on the pass that opens the round: (i) this file is EXCLUDED BY LITERAL PATH PREFIX from
  every round-3 reviewer's `read_scope` and appears in every reviewer's `blind_from`;
  (ii) the review plan's `coordinator_prior` field is A POINTER TO A SEALED PATH OUTSIDE
  BOTH REVIEWERS' READ SCOPES and contains NO mechanism, NO direction and NO quantity;
  (iii) the sealed prior file is a VERBATIM COPY of this block, made by that pass, and any
  divergence is a `procedure_deviations` entry.
prior:
  P-1:
    strength: STRONG
    prediction: >-
      The per-primitive dependency graph confirms that `in_linearized_code` is a
      deterministic function of `message_difference` on SHA-1, so the ordered pair
      (message_difference -> in_linearized_code) is an edge and the reverse is not.
    why_held_strongly: >-
      It is already measured on 960 objects with zero exceptions (EV-DIFFP-b16b01,
      DEC-20260824-c5bb72 `per_component_power_table`) AND independently derived from
      GF(2)-linearity by the round-2 Red Team, which committed its derivation with a
      timestamp sixteen minutes before its first read of the producer's directory. A
      failure here would most likely be INFRASTRUCTURE SIGNAL about the static analysis
      rather than a finding about the key.
    falsifier: >-
      A WELL-FORMED SHA-1 object with the same `message_difference` and a different
      `in_linearized_code` value, exhibited rather than argued.
  P-2:
    strength: MODERATE -- DELIBERATELY NOT STRONG, AND THE REASON IS THE POINT
    prediction: >-
      The pre-registered partition of the six depth-1 rows -- provably undetectable 1
      (in_linearized_code), not probed 3 (primitive, length, block_index), probed and
      genuinely not detected 0, entailed by construction 1 (message_difference), contingent
      on the instrument 1 (step_delta) -- REPRODUCES EXACTLY FROM THE GRAPH ALONE.
    why_held_only_moderately: >-
      BECAUSE THAT PARTITION WAS NEVER DERIVED FROM THE GRAPH. It was COMPOSED at the
      BATCH-efcae7 close from three separate sources -- the perturbing families' own
      declarations, a dependency argument, and the battery's measured verdicts -- and this
      task is the first attempt to obtain it from ONE source. A refutation is a genuine
      result and is expected to land, if anywhere, on `block_index` or `length`, which the
      close classified as NOT PROBED on the FAMILIES' declarations rather than on any graph
      property, so their classification is the one carrying the least graph content.
    falsifier: >-
      Any row whose class under the graph differs from its class in the pre-registered
      partition, reported with the row, both classes and the derivation that separates them.
  P-3:
    strength: WEAK, AND RECORDED AS THE PREDICTION THIS COORDINATOR TRUSTS LEAST
    prediction: >-
      The graph is SPARSE -- at most one or two edges beyond P-1's, and the depth-2 subsets
      that BREAK a dependency number exactly one, which is already the declared
      multi-deletion row.
    why_held_weakly_and_what_a_refutation_would_buy: >-
      If the graph is this sparse, RANK 1's OWN DECLARED FAILURE MODE FIRES: "if the
      dependency graph turns out to have one edge and no more, the partition collapses to
      what is already known, the reversal buys little, and that is a cheap, fast negative
      rather than an expensive one" (DEC-20260824-c5bb72 rank 1
      `it_can_fail_informatively`). A DENSER graph than predicted would be the more
      valuable outcome, would promote the depth-2 argument from bookkeeping to a real
      result, and would change what the off-diagonal cells can carry. THIS COORDINATOR
      WOULD RATHER BE WRONG HERE AND SAYS SO AT OPENING.
    falsifier: A third or later edge, or a second depth-2 subset that breaks a dependency.
  P-4:
    strength: STRONG, AND ITS VALUE IS SHAPE RATHER THAN INFORMATION
    prediction: >-
      THE KEY'S SHAPE ITSELF DEPENDS ON `primitive`, so a single merged six-node graph is
      ill-defined and the analysis MUST report one graph per primitive. Concretely: the
      committed `serialize()` emits `in_linearized_code` only when the primitive is sha1,
      and emits `message_difference` from `delta_m` on md5 and from `dv` on sha1, so the
      MD5 key and the SHA-1 key do not have the same component set at all.
    provenance_of_this_prediction: >-
      READ FROM THE COMMITTED SOURCE by this session -- harness/diffpath/adjudicator.py,
      the `serialize()` body -- and NOT measured by any run. It is therefore a LOW-
      INFORMATION prediction whose worth is that it forces the per-primitive shape on the
      deliverable and makes a merged-graph deliverable a declared defect rather than a
      surprise.
    falsifier: The committed serialize() emitting the same component list on both primitives.
  P-5:
    strength: MODERATE
    prediction: >-
      Stage (3)'s two matrices DIFFER in at least one cell, and EVERY differing cell lies
      in the SHA-1 half, because O-E is blind to `message_difference` ON SHA-1 ONLY.
    why: >-
      The round-2 Red Team measured that this instrument returns MEMBER on 520 of 520
      in-code objects where the honest one returns 0 of 520 (DEC-20260824-c5bb72 rank 2).
      What is NOT known in advance is whether any DECLARED family's off-diagonal cell
      exercises that difference, which is the whole question.
    falsifier_and_why_it_is_also_a_result: >-
      IDENTICAL MATRICES. That is the goal head's first pre-distinguished outcome and it
      means the power profile is a function of the families' construction and of the
      dependency graph and carries no information about the instrument at all. It would
      refute P-5 and be MORE informative than confirming it.
  P-6_one_sentence_review_round_prior:
    text: >-
      Expect the round to CONFIRM the graph and the depth-2 argument (P-1, P-3) and to
      BREAK the reading that the differing-cell count measures "what the strengthening
      bought", because that count is a property of the ONE known-false instrument chosen as
      much as of the suite -- composing to `analyzed`, with the depth-1 partition either
      reproduced from one source or refuted.
    note: >-
      THIS SENTENCE IS SEALED WITH THE REST OF THE BLOCK AND MAY NOT BE COPIED INTO THE
      REVIEW PLAN. Round 2's residual E-3 was created by exactly that copy.

