objective: >-
  MAKE THIS PROGRAM'S OWN CONTROL-POWER OUTPUT READABLE, BY ARGUMENT AND NOT BY COMPUTE.
  BATCH-efcae7 measured a per-component power profile whose every integer reproduces
  three ways and whose READING does not survive: of the six depth-1 ablation rows,
  exactly one has a verdict contingent on the instrument (step_delta) and the OLD suite
  already had it; one is entailed by the perturbing family's own declaration
  (message_difference); one is a theorem of the membership key's functional-dependency
  graph (in_linearized_code, provably undetectable while message_difference is retained);
  and three record that no declared family looked (primitive, length, block_index). Right
  now a NOT DETECTED verdict from this goal is a provable impossibility, a coverage gap
  or a genuine negative, AND THE CURRENT SINGLE COLUMN CANNOT TELL A READER WHICH.
  BATCH-a75ffb computes the object that makes the column readable, in ONE executor task,
  with ZERO CHARGED RUNS, acquiring nothing, searching nothing, repairing nothing:
  (1) A STATIC ANALYSIS OF THE COMMITTED `adjudicator.serialize()`, PER PRIMITIVE, that
  outputs for each ORDERED PAIR of membership-key components whether one is a
  deterministic function of the other, and re-partitions every depth-1 verdict of
  BATCH-efcae7 into PROVABLY UNDETECTABLE BY ANY FAMILY / NOT PROBED BY A DECLARED FAMILY
  / PROBED AND GENUINELY NOT DETECTED / -- for the DETECTED rows -- ENTAILED BY THE
  PERTURBING FAMILY'S OWN DECLARATION versus CONTINGENT ON THE INSTRUMENT. The partition
  BATCH-efcae7 composed is PRE-REGISTERED below and REPRODUCING OR REFUTING IT FROM THE
  GRAPH ALONE is the task's first deliverable and its own falsification test.
  (2) THE DEPTH-2 ARGUMENT: name the depth-2 subsets that BREAK a dependency -- measured
  in BATCH-efcae7 to be exactly one, which is already the declared multi-deletion row --
  so the fifteen-subset depth-2 lattice is BOUGHT BY ARGUMENT RATHER THAN BY COMPUTE.
  (3) GATED ON (1) AND ONLY ON THE OFF-DIAGONAL CELLS THE GRAPH MARKS AS CAPABLE OF
  CARRYING INFORMATION: adjudicate the family-by-row matrix twice, once against the
  HONEST instrument and once against the PER-PRIMITIVE-BLIND known-false instrument O-E,
  and report the COUNT OF DIFFERING CELLS as the honest scalar version of what the
  strengthening bought. TWO OUTCOMES ARE PRE-DISTINGUISHED AND BOTH ARE RESULTS:
  identical matrices mean the power profile is a function of the families' construction
  and of the dependency graph and carries NO information about the instrument at all;
  any differing cell is a place where a verdict IS contingent on the instrument, and the
  count is the measurement this program has never had.
  NOTHING HERE CLAIMS ANY PATH IS NEW, claims any cryptanalytic improvement, acquires any
  source, or runs any search. A PASSING CONTROL IS NOT AN IMPROVEMENT.

