        defect is program-wide rather than specific to this goal.
      f_shim_and_stub_behaviour: >-
        CONFIRMED BY EXECUTION. `harness.diffpath.compat.ensure()` installs the
        shim; `sympy.__version__` then reads "ABSENT (sympy not installed;
