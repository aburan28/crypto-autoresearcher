        total_unspent_seconds. No ceiling is reallocated to another run
        anywhere. deadline mechanism recorded as signal.setitimer(ITIMER_REAL)
        inside the run function.
      d_attempt_01_contributed_no_observation: >-
        CONFIRMED, WITH ONE PRECISION. attempt-01-aborted-raw-observations.json
        is literally `{}` -- an empty object -- so ATTEMPT-01 cannot have
        contributed a discarded observation. No run directory was created for
        it: the six directories that exist are all completed_valid from the
        second attempt. attempt-01-aborted-run-index.json records buildcheck
        `implementation_error` and the five downstream runs `not_run` with
        "UNSPENT -- not reallocated to any other run". THE PRECISION: the
        aborted buildcheck does record wall_seconds 0.134, so 0.134 s of wall
        clock WAS consumed by ATTEMPT-01, and that 0.134 s is not included in
