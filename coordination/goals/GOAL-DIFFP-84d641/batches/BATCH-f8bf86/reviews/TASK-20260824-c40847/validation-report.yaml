  # =====================================================================
  # J3 -- IS CTL-PLANT A CONTROL, OR A TAUTOLOGY OF SHARED CODE?
  # =====================================================================
  joint_J3:
    statement_owned: >-
      96/96 recall means the adjudicator recalls planted paths and their
      verified-generator images because the canonicalisation is correct, not
      because the images and the canonical form are computed by the same
      functions.
    verdict: breaks
    verdict_scope: >-
      THE TAUTOLOGY CHARGE DOES NOT STICK; THE "CAN THIS CONTROL FAIL" CHARGE
      DOES. Part (1) of the plan's attack HOLDS: images I wrote myself from the
      declaration statements, never calling EQ.act_*, all adjudicate MEMBER, so
      96/96 is not a function agreeing with itself. Part (2) BREAKS: I exhibit
      one-bit mutations that still adjudicate MEMBER, which is precisely the
      plan's declared breaking artifact. Part (3) confirms the plan's own
      prediction: two of the four verified generators emit no orbit image at
      all, and one of them can emit nothing that could ever matter.

    part_1_positive_control_independence:
      method: >-
        Regenerated the census at seed 84064101/84064102 and took PLANT-MD5-00
        and PLANT-SHA1-00. Constructed the E3 image and E1 shift images FROM THE
        STATEMENTS in equivalence-declaration.yaml, in my own code:
        E3 = negate every signed difference (step_delta, delta_m and their
        signed forms), swap the pair members and swap each condition's
        (value, value_p); E1 = re-expand the seed window under the SHA-1
        recursion W_t = rotl(W_{t-3}^W_{t-8}^W_{t-14}^W_{t-16}, 1) -- WRITTEN
        HERE, not imported -- and read the window at offset +s at constant
        length, shifting the condition steps by s. EQ.act_E1_shift,
        EQ.act_E3_negate and EQ.act_E2_rotate were NEVER CALLED in this probe.
      results:
        - {object: 'md5 PLANT-MD5-00 (baseline)', strict: MEMBER, permissive: MEMBER, closest_distance: 0}
        - {object: 'md5 FROM-STATEMENT E3 image', strict: MEMBER, permissive: MEMBER, closest_distance: 998}
        - {object: 'sha1 PLANT-SHA1-00 (baseline)', strict: MEMBER, permissive: MEMBER, closest_distance: 0}
        - {object: 'sha1 FROM-STATEMENT E3 image', strict: MEMBER, permissive: MEMBER, closest_distance: 1320}
        - {object: 'sha1 FROM-STATEMENT E1 image, s=1', strict: MEMBER, permissive: MEMBER, closest_distance: 286}
        - {object: 'sha1 FROM-STATEMENT E1 image, s=3', strict: MEMBER, permissive: MEMBER, closest_distance: 302}
        - {object: 'sha1 FROM-STATEMENT E1 image, s=8', strict: MEMBER, permissive: MEMBER, closest_distance: 243}
        - {object: 'sha1 FROM-STATEMENT E1 s=5 composed with FROM-STATEMENT E3', strict: MEMBER, permissive: MEMBER, closest_distance: 1358}
      finding: >-
        from-statement images adjudicating NON-MEMBER: 0 of 8. THE SHARED-CODE
        DEFECT IS NOT ACTIVE. The Coordinator's sharpest new prediction for this
        joint -- "a from-statement re-implementation of one E3 image and one E1
        image still adjudicates MEMBER (so the defect is latent, not active)" --
        is CONFIRMED, and confirmed on eight objects rather than two.
      honest_limit: >-
        This shows the canonicaliser agrees with a SECOND independent reading of
        two generator statements. It does not show the statements are the right
        statements, and it says nothing about E4 or E5, which emit no image to
        test (see part 3).

    part_2_the_control_must_be_able_to_fail:
      method: >-
        Single-bit flips in one word of a key component, adjudicated in both
        modes. Every mutant differs from a genuine object in exactly one bit.
      results:
        - {object: 'md5 planted + 1 bit in step_delta[0]', strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 1, expected: NON-MEMBER, ok: true}
        - {object: 'md5 planted + 1 bit in delta_m[0]', strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 1, expected: NON-MEMBER, ok: true}
        - {object: 'md5 E3-image + 1 bit in step_delta (w0b0, w7b17, w63b31)', strict: NON-MEMBER, permissive: NON-MEMBER, expected: NON-MEMBER, ok: true}
        - {object: 'md5 E3-image + 1 bit in delta_m (w0b0, w5b3)', strict: NON-MEMBER, permissive: NON-MEMBER, expected: NON-MEMBER, ok: true}
        - {object: 'sha1 planted (step_start 0) + 1 bit in dv[0]', strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 1, expected: NON-MEMBER, ok: true}
        - {object: 'sha1 E1-image s=3 (step_start 3) + 1 bit in dv[0]', strict: MEMBER, permissive: MEMBER, closest_distance: 303, expected: NON-MEMBER, ok: false}
        - {object: 'sha1 E1-image s=3 + 1 bit in dv[40]', strict: MEMBER, permissive: MEMBER, closest_distance: 301, expected: NON-MEMBER, ok: false}
        - {object: 'sha1 E1-image s=3 + 1 bit in dv_seed_window[0]', strict: NON-MEMBER, permissive: NON-MEMBER, expected: NON-MEMBER, ok: true}
        - {object: 'sha1 planted + 1 bit in step_delta[0] (signed form untouched)', strict: NON-MEMBER, permissive: MEMBER, expected: NON-MEMBER in both, ok: false}
        - {object: 'sha1 E1-image s=3 + 1 bit in step_delta[0] (signed form untouched)', strict: NON-MEMBER, permissive: MEMBER, expected: NON-MEMBER in both, ok: false}
        - {object: 'sha1 planted + 1 bit in step_delta[0] AND signed form re-encoded', strict: NON-MEMBER, permissive: NON-MEMBER, expected: NON-MEMBER, ok: true}
      breaking_artifact_VD_3:
        title: >-
          STRICT MODE: for any SHA-1 object whose step_range does not start at
          0, the declared `dv` -- the field the report calls the message
          difference -- IS NOT READ BY THE MEMBERSHIP KEY AT ALL.
        mechanism: >-
          adjudicator.canonical() calls EQ.align_E1 whenever E1 is in the
          generator set and the primitive is sha1. align_E1 RETURNS THE OBJECT
          UNCHANGED when step_range[0] == 0, but when step_start = s > 0 it
          DISCARDS the declared dv and recomputes it as
          sha1_expand(sha1_expand_back(dv_seed_window, s)[:16])[0:length].
          The mutated dv is therefore overwritten before serialize() ever sees
          it.
        evidence: >-
          canonical(E1-image, strict) == canonical(planted, strict) is True.
          canonical(E1-image with one dv bit flipped, strict) ==
          canonical(planted, strict) is ALSO True. The same one-bit flip applied
          to the planted object (step_start 0) DOES flip the verdict to
          NON-MEMBER, and flipping the E1-image's dv_seed_window instead DOES
          flip it to NON-MEMBER -- so the key is carried by the seed window, not
          by the DV the candidate declares.
        scale: >-
          64 of CTL-PLANT's 96 attempts are sha1 E1 images with step_start in
          1..8. For all 64, the message-difference component of the strict key
          is a re-derivation from the seed window rather than the candidate's
          own declared DV.
        honest_limit_stated_rather_than_glossed: >-
          THE MUTANT IS MALFORMED. A well-formed SHA-1 path object has dv equal
          to the expansion of its own seed window, so I have NOT exhibited two
          WELL-FORMED distinct objects that this identifies. What I have
          exhibited is that the instrument silently normalises away a
          contradiction between two fields of the candidate instead of rejecting
          it or flagging it. For an adjudicator whose whole job is to decide
          whether a candidate is already known, silently rewriting part of the
          candidate before deciding is a property a reader must be told about,
          and no artifact of this batch tells them.
      breaking_artifact_VD_4:
        title: >-
          PERMISSIVE MODE: for SHA-1 objects, the declared `step_delta` is not
          read either -- it is recomputed from `step_delta_signed`.
        mechanism: >-
          Permissive includes E2, so canonical() builds variants via
          EQ.act_E2_rotate(v, b) for b in 0..31. act_E2_rotate sets
          step_delta = tuple(bsdr_decode(sd) for sd in rot_signed), i.e. it
          derives step_delta from step_delta_signed. At b = 0 that reconstructs
          the ORIGINAL step_delta from the untouched signed form, erasing the
          mutation.
        evidence: >-
          canonical(planted with one step_delta bit flipped, permissive) ==
          canonical(planted, permissive) is True, and the object adjudicates
          permissive MEMBER. Re-encoding step_delta_signed consistently with the
          flip makes permissive return NON-MEMBER, which isolates the mechanism
          to the redundant-field recomputation and nothing else.
        scope: >-
          STRICT MODE IS NOT AFFECTED by VD-4 (E2 is not in the strict group),
          and MD5 objects are not affected (act_E2_rotate is sha1-only). So this
          is a permissive-mode, SHA-1-only defect. It does not touch any strict
          count reported in this batch. It does mean that the permissive verdict
          -- which exists precisely to bound the strict verdict's error in a
          direction a reader can see -- is measured on an object whose
          step_delta the reader supplied and the canonicaliser ignored.
      summary_of_part_2: >-
        one-bit mutants tested: 15. Mutants that SHOULD have adjudicated
        NON-MEMBER and did: 11. Mutants that adjudicated MEMBER anyway: 4 (two
        strict, under VD-3; two permissive-only, under VD-4). CTL-PLANT can be
        made to fail by a one-bit change to most key components; it CANNOT be
        made to fail by a one-bit change to a SHA-1 image's declared DV, nor by
        a one-bit change to a SHA-1 object's declared step_delta in permissive
        mode.

    part_3_coverage:
      accounting_of_the_96: >-
        CONFIRMED AND RECOMPUTED. 16 planted entries, each adjudicated once,
        plus their orbit images: orbit_image_count_per_entry is 1 for each of
        the 8 MD5 entries and 9 for each of the 8 SHA-1 entries, so
        16 + 8x1 + 8x9 = 96 exactly. Recomputed independently from the census
        and the code: 96. The per-class table (md5:planted 8/8, md5:E3_image
        8/8, sha1:planted 8/8, sha1:E3_image 8/8, sha1:E1_image 64/64) sums to
        96 with nothing double-counted, and 64 = 8 entries x 8 shifts
        (EQ.E1_SHIFTS = (1,2,3,4,5,6,7,8)).
      do_E4_and_E5_contribute_any_orbit_image: >-
        NO. STATED PLAINLY, AS THE PLAN ASKED. Measured by calling
        adjudicator.orbit_images with each generator alone: {E3} emits 1 image
        per object; {E1} emits 8 per sha1 object and 0 per md5 object; {E4}
        emits 0; {E5} emits 0; {E4,E5} together emit 0. CTL-PLANT therefore
        exercises exactly TWO of the four VERIFIED generators. The reported
        orbit sizes 2 (md5: identity + E3) and 10 (sha1: identity + E3 + 8 E1
        shifts) are the honest arithmetic consequence of that, and the
        Coordinator's prediction for this sub-part is confirmed.
      a_sharper_consequence_the_report_does_not_state: >-
        E5 CANNOT AFFECT ANY MEMBERSHIP VERDICT IN THIS PACKAGE AT ALL. The
        condition set is not in the membership key (PD-5), and `"E5" in gens` is
        read in exactly one place in adjudicator.py -- line 210, where it
        selects the REPORTED condition signature -- and in no place that
        serialize() or canonical() can reach. So E5 is a VERIFIED generator that
        emits no orbit image AND has no effect on any key. E4's only effect on
        the key is REMOVAL (serialize appends signed_representation only when E4
        is absent), so it can only loosen membership, never test it. The strict
        group is nominally {E1,E3,E4,E5}; the group that does observable work on
        a membership decision is {E1,E3} plus one key-component deletion. Every
        covering number this goal computes inherits that, and no artifact of
        this batch says it.

  # =====================================================================
  # J4 -- IS THE MEASURED ZERO A MEASUREMENT?
  # =====================================================================
  joint_J4:
    statement_owned: >-
      The empty readable census (readable = 0, and P-1's exact agreement with
      the frozen prediction) is the outcome of a scan that would have found data
      had data been there -- not the outcome of a scan that failed silently. And
      the batch's declared criteria are complied with rather than merely
      mentioned.
    verdict: holds
    verdict_scope: >-
      HOLDS, WITH ITS SCOPE STATED. The scanner fires on a seeded positive; the
      corpus arithmetic reproduces exactly from an independent enumeration; the
      quarantine exclusion is structural rather than attested; and the payload
      digest re-hashes correctly. The zero is a fact about the corpus, not about
      the instrument. What the zero is a fact ABOUT is narrower than "the corpus
      contains no path data", and that narrowing is recorded below rather than
      left for a later reader to discover.

    part_1_the_scanner_positive_control:
      why_it_was_needed: >-
        A prediction of zero confirmed by a measurement of zero is the weakest
        shape of evidence there is, because a broken instrument produces it too.
        Nobody had run a positive control on this scanner. This is that control.
      method: >-
        (a) PER-PREDICATE. Each of the five PATH_DATA_RE patterns was given a
        minimal synthetic instance and the scanner's own CANDIDATE_RE and
        PATH_DATA_RE were applied verbatim from harness.diffpath.census.
        (b) END-TO-END. census.REPO was pointed at a temporary root of my own
        construction under this session's scratch space -- NOT under knowledge/
        or inputs/, which are shared state I may not write to -- containing
        three synthetic files that carry machine-readable path data in three
        different declared schemas, one DECOY that mentions the subject matter
        in prose with no table, one wholly unrelated file, and one file under
        the quarantine prefix. scan_corpus() was then run unmodified.
      synthetic_content_disclosure: >-
        Every value in the seeded files is a fabricated pattern
        (0x11111111, 0x22222222, 0x33333333, 0x55555555, 0xaaaaaaaa, small
        powers of two). NOTHING in them is derived from, or a reconstruction of,
        any published characteristic of any tier. They exist only to be
        detected. They live in this session's scratch space and are not
        committed to the repository.
      result_per_predicate: >-
        ALL FIVE FIRE. delta_m table -> 1 pattern matched; disturbance_vector
        table -> 1; `dv = [0x...]` -> 1; per-step signed-difference line -> 1;
        sufficient_conditions -> 1. In each case CANDIDATE_RE also fired.
      result_end_to_end:
        files_seen: 5
        files_read: 5
        candidate_files: 4
        candidates_carrying_path_data: 3
        detail:
          - {file: knowledge/literature/SYNTH-POSITIVE-1.md, carries_path_data: true, patterns_matched: 2}
          - {file: knowledge/literature/SYNTH-POSITIVE-2.md, carries_path_data: true, patterns_matched: 3}
          - {file: inputs/SYNTH-POSITIVE-3.yaml, carries_path_data: true, patterns_matched: 1}
          - {file: knowledge/literature/SYNTH-DECOY-mentions-only.md, carries_path_data: false, patterns_matched: 0}
          - {file: knowledge/literature/SYNTH-UNRELATED.md, not_a_candidate: true}
          - {file: 'coordination/goals/GOAL-MD5-001/quarantine/... (decoy)', scanned: false}
      conclusion: >-
        THE SCANNER FIRES ON A POSITIVE IT SHOULD FIND, AND ONLY ON THOSE. It
        detects all three planted positives across three schemas and two file
        suffixes, correctly classifies a mentions-only decoy as a candidate
        carrying NO path data (which is exactly the shape of all six real
        candidates), and correctly ignores an unrelated file. `readable = 0` is
        therefore a CORPUS fact and not a SCANNER fact, and P-1's exact
        agreement is not void. The plan's suspicion at J4(1) does not hold.
      the_scope_limit_that_does_survive: >-
        RECORDED BECAUSE NOBODY ELSE OWNS IT. The positive control shows the
        scanner detects path data ENCODED IN THE FIVE TEXTUAL SCHEMAS IT LOOKS
        FOR, in files with suffix .md/.yaml/.yml/.json/.txt, under knowledge/
        and inputs/. It does NOT show the scanner would detect a characteristic
        tabulated as a LaTeX table, as a PDF, as a binary or CSV blob, under
        another suffix, or under any other root. So the honest statement of the
        measurement is: "zero files under knowledge/ and inputs/ with those five
        suffixes carry path data in these five machine-readable forms" -- not
        "the corpus contains no path data". P-1's frozen formula is
        readable_md5 = 0 and readable_sha1 = 0, which this satisfies; but a
        later record that reads the zero more widely than this would be reading
        it wider than it was measured.

    part_2_the_scan_s_own_arithmetic:
      method: >-
        Independent enumeration written in this session -- my own os.walk over
        knowledge/ and inputs/ with the five declared suffixes, and the
        candidate/path-data predicates RE-TYPED from the declaration rather than
        imported -- run over the real corpus.
      results:
        - {quantity: files under knowledge/ + inputs/ with the five suffixes, producer: 9337, rederived: 9337, agree: true}
        - {quantity: files unreadable, producer: 0, rederived: 0, agree: true}
        - {quantity: candidate files mentioning the subject matter, producer: 6, rederived: 6, agree: true}
        - {quantity: candidates carrying machine-readable path data, producer: 0, rederived: 0, agree: true}
      candidate_identity: >-
        The six candidates my independent enumeration returns are EXACTLY the
        six the report names: knowledge/literature/KN-LIT-3892.md,
        KN-LIT-3975.md, KN-LIT-4387.md, KN-LIT-5841.md, KN-LIT-87e00e.md, and
        knowledge/techniques/KN-TECH-066.md. Each matched zero of the five
        path-data patterns.
      quarantine_exclusion_from_the_code_not_the_attestation: >-
        CONFIRMED FROM THE SOURCE, AND IT IS STRONGER THAN THE ATTESTATION
        CLAIMS. census.scan_corpus() checks `rel_dir.startswith(QUARANTINE_DIR)`
        and prunes dirnames BEFORE the file loop, and re-checks
        `rel.startswith(QUARANTINE_DIR)` before `open()`; `files_seen` is only
        incremented after that check, so an excluded file is never opened and
        never counted. INDEPENDENTLY OF ALL THAT: SCAN_ROOTS is
        ("knowledge", "inputs") and QUARANTINE_DIR is
        "coordination/goals/GOAL-MD5-001/quarantine", which is not under either
        root, so the walk cannot reach the quarantine at all. The prefix check
        is belt-and-braces on a directory the scan structurally cannot visit.
        My end-to-end positive control confirms it empirically: a decoy file
        placed under the quarantine prefix in my temporary root was not scanned.

    part_3_quarantine_payload_re_hash:
      why_not_redundant: >-
        The snapshot receipt records this as OPEN GATE G5 -- not independently
        re-confirmed in the archive pass -- so the only re-confirmation on file
        was the producer's own, about the producer's own compliance. This
        session closes it.
      method: >-
        The file was opened 'rb', read in 64 KiB chunks, streamed into a sha256
        context and discarded. IT WAS NEVER DECODED, NEVER PARSED, NEVER
        PRINTED, AND NO FIELD OF IT WAS EXTRACTED. Only the digest and the byte
        count left the operation.
      path: coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
      sha256_expected: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
      sha256_recomputed_by_this_session: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
      sha256_match: true
      bytes_measured_by_this_session: 3103
      bytes_claimed_by_execution_report: 5583
      bytes_recorded_in_every_raw_artifact: 3103
      finding: >-
        THE DIGEST MATCHES; THE BYTE COUNT IN THE SUMMARY DOES NOT. See defect
        VD-2 under J1. The payload is unchanged and the contract's CTL-QUAR
        criterion is met. The plan's stated comparison target "at 5583 bytes" is
        itself inherited from the defective summary and should be corrected to
        3103 in the composition.
      payload_unchanged: true
      payload_parsed_by_this_session: false

    part_4_criterion_compliance:
      strict_group_is_exactly_the_verified_subset: >-
        CONFIRMED THREE WAYS. equivalence-declaration.yaml and
        raw-observations.json both give verified_generator_set [E1,E3,E4,E5] and
        excluded [E2,E6]; the manifests' generator_set_in_force is [E1,E3,E4,E5]
        on every run that has one; and my cold re-run's Adjudicator reports
        strict = ['E1','E3','E4','E5'], permissive = ['E1'..'E6']. No unverified
        generator is admitted to strict. IR-5 complied with as measured.
      strict_and_permissive_never_merged: >-
        CONFIRMED. In null-control-result.json, raw-observations.json and
        execution-report.yaml, strict and permissive false-positive counts
        appear as separate named fields at every level (per family, and as two
        separate totals). There is no averaged, summed or blended number
        anywhere. Adjudication.to_record() likewise emits strict_verdict and
        permissive_verdict as distinct fields.
        ONE FACTUAL QUALIFICATION THE PHRASE "every adjudication record" INVITES:
        no PER-DRAW adjudication records were persisted in this batch at all --
        only aggregate counts and one closest-draw record per family. So the
        separation is verified on every count that exists; there is no
        per-candidate record in which it could have been violated.
      three_census_counts_never_summed: >-
        CONFIRMED. readable 0 / quarantined_not_read 1 / acquisition_gap 8
        appear as three separate keys in census.yaml, raw-observations.json,
        run-index.json and execution-report.yaml, each carrying an explicit
        NEVER_SUMMED note. A repository-wide grep for a combined figure
        (census_size, total_census, entries_total, "census size") returns only
        the prose that FORBIDS it. shadow_planted 16 is carried as a fourth,
        separate population and is never added to the others.
      claim_ceiling_analyzed: >-
        RESPECTED. `claim_ceiling: analyzed` is declared at the head of
        execution-report.yaml with the note "never `supported`, for every record
        derived from this contract". I found no sentence in the package's
        artifacts asserting support, proof, or a security consequence.
      no_non_member_verdict_written_or_implied_as_novelty: >-
        CONFIRMED, AND THIS IS THE CHECK I EXPECTED TO BE HARDEST. Every
        occurrence of "novel*" in execution-report.yaml, census.yaml,
        equivalence-declaration.yaml and null-control-result.json is either the
        adjudicator module's own prohibition ("It is never novelty"), the
        closing statement ("Novelty is unverified and nothing here licenses a
        novelty claim"), a directional statement about the equivalence
        over/under-declaring, or a literal grep command string. The
        adjudicator's module docstring and Adjudication.scope_note both carry
        the "not in an empty census ... is NOT novelty" text into every record a
        verdict would appear in. I found NO sentence in any batch artifact
        treating a NON-MEMBER verdict as novelty, so the plan's third breaking
        artifact for J4 is not produced.
      no_cost_projection: >-
        CONFIRMED. No complexity figure, attack cost, speedup ratio or
        extrapolation appears anywhere in the package.

  # =====================================================================
  # CONTROL NON-VACUITY -- EXPLICIT, FROM THE ARTIFACTS (handoff V-d)
  # =====================================================================
  control_non_vacuity:
    CTL-PLANT:
      non_vacuous: CONFIRMED, WITH A NAMED LIMIT
      from_the_artifacts: >-
        The control adjudicated 96 objects against a census containing the 16
        entries they were drawn from, and it CAN return NON-MEMBER: 11 of the 15
        one-bit mutants I constructed do exactly that, including mutants of the
        very objects the control passes on. So the 96/96 is not the output of a
        function that says MEMBER to everything.
      the_limit: >-
        It covered every planted path (16/16) but NOT every verified-generator
        image, because two of the four verified generators produce no image:
        E4 and E5 contribute 0 orbit images. The handoff's V-d asks whether
        CTL-PLANT covered "every planted path AND every verified-generator
        image"; the honest answer is that it covered every image the
        implementation emits, and the implementation emits images for E1 and E3
        only. And for 64 of the 96 attempts the strict key does not read the
        candidate's declared DV (VD-3).
    CTL-NULL:
      non_vacuous_in_the_contract_s_sense: CONFIRMED
      from_the_artifacts: >-
        IR-4's requirement is that the null run against a census containing
        entries a draw could have matched. null-control-result.json records
        plantable_entries 16 with all sixteen ids listed and vacuous: false;
        census.plantable_entries() returns readable + shadow, which is 0 + 16;
        my cold re-run reproduces 16. A null against an empty census would have
        been refused by the driver. So the control is NOT vacuous in the sense
        the contract defines.
      what_i_do_not_and_cannot_say: >-
        WHETHER THE NULL WAS HARD IS J5, WHICH I DO NOT OWN AND HAVE NOT SEEN.
        Non-vacuity in the contract's sense is a much weaker property than
        having a nonzero achievable false-positive probability, and this report
        asserts only the weaker one. The producer itself says "NOTHING HERE
        ESTABLISHES THAT THE NULL WAS HARD", and nothing in my joints
        contradicts or supports that.
    CTL-OBS:
      non_vacuous: PARTIALLY
      from_the_artifacts: >-
        Direction (ii) is a genuine two-sided check (80 checks, 0 discrepancies,
        required_to_be_zero true) and reproduces exactly. Direction (i) is
        marked required_to_be_zero FALSE by the producer, i.e. it is declared as
        an observation rather than a pass, which is the correct handling of a
        1024-object slice.
    CTL-NEARBY:
      non_vacuous: CONFIRMED as a two-sided measurement
      from_the_artifacts: >-
        0/1000 SHA-0 codewords test as SHA-1 AND 1000/1000 SHA-1 codewords do.
        The second fraction is what makes the first non-vacuous: the predicate
        is not simply returning False. Both reproduce exactly. Its scope limit
        (the SHA-0 expansion is implemented from the stated one-rotation
        difference, not gated on a published source) is stated by the producer
        and I confirm no artifact overstates it.
    CTL-BASE:
      non_vacuous: CONFIRMED
      from_the_artifacts: >-
        7/7 RFC1321 vectors PARSED OUT OF the committed pin (pin sha256 matches),
        64/64 MD5 and 64/64 SHA-1 against hashlib, 2/2 contract-declared SHA-1
        digests, and a degenerate-baseline verifier check at 64/64 and 80/80
        steps. All reproduce from the raw artifacts.
    CTL-QUAR:
      non_vacuous: CONFIRMED and independently re-measured (see J4 part 3)

