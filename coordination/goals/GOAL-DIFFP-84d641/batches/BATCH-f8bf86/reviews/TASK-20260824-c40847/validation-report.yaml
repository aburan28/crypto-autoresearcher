            sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5;
            os.path.getsize agrees at 3103.
          occurrences_in_execution_report: [line 367]
          raw_sources_that_are_correct:
