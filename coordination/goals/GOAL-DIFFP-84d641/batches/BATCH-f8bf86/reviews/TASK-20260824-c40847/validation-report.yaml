    checklist:
      a_six_run_directories: >-
        CONFIRMED. `git ls-tree -r` at the snapshot commit lists exactly six
        directories under runs/ and exactly 42 files (6 x 7). run-index.json
        lists exactly those six run_ids and no other. No undeclared run
        directory exists anywhere in the task tree.
      b_seven_files_and_the_literal_id: >-
        CONFIRMED. Each of the six directories contains exactly
        {manifest.yaml, manifest-supplement.yaml, command.txt, environment.json,
        stdout.log, stderr.log, raw-result.json} -- no missing file, no extra
        file. Each manifest carries the LITERAL string EXP-DIFFP-fe894e at both
        run.experiment_id and run.inputs.parameters.experiment_id, and each
        carries code_path_fingerprint at run.inputs.parameters.
      c_armed_deadlines_and_unspent_ceilings: >-
        CONFIRMED. armed_deadline_seconds present in every manifest and every
        supplement: 120/180/180/240/120/120 = 960 s of ceilings. Wall seconds
        summed from the six manifests = 80.748309 s, matching run-index.json
