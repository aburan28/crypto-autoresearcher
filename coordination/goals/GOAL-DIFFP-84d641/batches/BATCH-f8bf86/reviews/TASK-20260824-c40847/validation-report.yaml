        35c2159ee:<path>` and matched EXACTLY. Re-checked against the receipt's
        own declared commit 4b85c67aa697bf40caf09bc652c68ee1cf1b2144: 34/34.
        Re-checked against the working tree: 34/34. The receipt's open gate G1
        is therefore closed as measured by this session, independently of the
        driving session that filled it.
      sibling_module_and_run_file_check: >-
        THE GAP IS CLOSED FROM THE ARTIFACTS, WHICH IS WHAT THE PLAN ASKED FOR.
        For every one of the six manifests I recomputed the sha256 of every file
        named in `run.code.source.files` AND every module named in
        `run.inputs.parameters.code_path_fingerprint.module_sha256` from the
        tree at the snapshot commit: 148 comparisons, 148 matches, 0 mismatches.
        This covers all ten harness/diffpath sibling modules plus
        harness/__init__.py and harness/runner.py.
      an5_confirmed: >-
        The producer's AN-5 claim -- that the branch HEAD moved during execution
        so reproducibility rests on per-file content hashes rather than on the
        commit -- is CORRECT AND SUFFICIENT. harness/diffpath/compat.py is
        recorded `status: modified` in every manifest (it was dirty at run
