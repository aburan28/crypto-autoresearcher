        separately and openly under runs.failed -- but the plan's phrasing "NO
        ceiling was spent" is very slightly stronger than the artifact supports,
        and I record the artifact rather than the phrasing.
      e_an1_independently_confirmed: >-
        CONFIRMED BY ast.parse, NOT BY READING. Parsing harness/runner.py and
        listing module-level FunctionDef nodes yields exactly one duplicated
        name: `_inference_block`, defined at line 183 and at line 695. Python
        binds the last definition, so line 695 wins and the line-183 definition
        (the one that calls orchestration.adapter.manifest.block_from_env()) is
