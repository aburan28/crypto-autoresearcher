  verdict: incomplete
  verdict_rationale: >-
    `incomplete`, not `passed` and not `failed`, and the reason is precise.
    THE RECEIPT IS ARTIFACT-SOUND: the code that produced the numbers is the
    code under review (34/34 receipt hashes, 148/148 manifest hashes), the
    numbers reproduce exactly in cold re-runs (48/48), the runs are complete and
    declared, the seeds are the declared seeds, the controls are non-vacuous in
    the contract's sense, and the measured zero survives a positive control on
    its own scanner. THAT IS NOT ENOUGH FOR `passed`, for two independent
    reasons: (1) execution-report.yaml states two integers its own raw artifacts
    and my re-measurement contradict (VD-1, VD-2), meeting the review plan's own
    declared breaking threshold for J1, and one of them has already propagated
    into two Coordinator artifacts; (2) the positive control CTL-PLANT cannot be
    made to fail by a one-bit change to a SHA-1 image's declared DV in strict
    mode or to a SHA-1 object's declared step_delta in permissive mode (VD-3,
    VD-4), so its 96/96 is a weaker statement than it reads as. Neither reason
    is a `failed`: no verdict, count or control outcome in the package is wrong,
    nothing is fabricated, and no measurement basis is in doubt. It is
    `incomplete` because two named defects must be corrected by superseding
    records and two named instrument gaps must be measured before this receipt
    can carry the weight a `passed` would give it.
    THIS VERDICT COVERS J1-J4 ONLY. It is not a verdict on the claim, it does
    not support any statement about MD5 or SHA-1, it demonstrates no speedup, it
    licenses no novelty claim for any path at any tier, and it authorises no
    promotion. The claim ceiling `analyzed` is inherited unconditionally.

