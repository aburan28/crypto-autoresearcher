  INDEPENDENCE_FAILURE_DECLARED_UP_FRONT:
    blind_from_respected: false
    what_happened: >-
      I read the review plan in full before starting, because my dispatch
      instruction and my task card both order me to read it FIRST and the plan
      itself says "Everything else in this plan you must read". One item of that
      plan -- coordinator_prior.prior_for_this_review_round, item "BLIND
      RE-DERIVATION" -- is ITSELF listed in blind_from. I read it. I was
      therefore anchored before I derived anything.
    what_I_was_anchored_by_stated_exactly_so_a_reader_can_discount_it:
      - >-
        From the plan's coordinator_prior (a blind_from item): the Coordinator's
        own expected SHA-1 planted orbit size of 1 + 1 + 11 = 13, its statement
        that the producer reports 10 decomposed as identity + E3 + 8 E1 shifts,
        and its hypothesis that the disagreement localises to the orbit-image
        shift set differing from the verification shift set.
      - >-
        From the plan's joint J3 attack plan (NOT in blind_from, and mandatory
        reading): "the reported orbit sizes 2 and 10", and the Coordinator's
        prediction that E4 and E5 emit no orbit image.
      - >-
        From the plan's joint J5 attack plan (NOT in blind_from, mandatory):
        decoy D4's construction, which discloses that signed_representation is a
        key component dropped under E4.
    THE_FINDING_THIS_IS_NOT_AN_EXCUSE: >-
      THE BLINDNESS PROTOCOL AS WRITTEN IS UNSATISFIABLE, AND THAT IS A REVIEW-
      ARCHITECTURE DEFECT, NOT A REVIEWER CHOICE. The producer's reported values
      for the exact quantity under blind re-derivation (2 for MD5, 10 for SHA-1,
      with its decomposition) appear in THREE places inside a document the
      reviewer is REQUIRED to read before starting, two of which are outside
      blind_from and therefore not even flagged. A blind_from list cannot protect
      a quantity whose answer is printed in the mandatory-read assignment. No
      ordering of reads fixes this: the plan carries the joint assignments, so it
      cannot be read second.
    consequence_for_this_artifact: >-
      THIS IS NOT A BLIND RE-DERIVATION AND MUST NOT BE COMPOSED AS ONE.
      Agreement between my number and the producer's is worth nothing here,
      because I knew the producer's number. What survives the contamination is
      only the part an anchor cannot produce: the DERIVATION ITSELF, its
      enumerated interpretation forks, and the specific undeclared design choice
      the forks localise. I report those and I report the number, and I mark the
      number as non-independent.
    what_would_fix_it_next_round: >-
      Split the plan into (i) a per-reviewer assignment document containing no
      producer-reported value for any blinded quantity, and (ii) a sealed prior
      the reviewer never receives. The Coordinator's prior belongs in the second.
      Alternatively, choose a blinded quantity the plan never has occasion to
      quote. Cost of the current arrangement, stated plainly: this batch bought a
      blind re-derivation in its budget and did not get one.

  quantity_as_stated_to_me: >-
    For a planted entry P, ORBIT(P) = {P} union { image of P under g : g in the
    VERIFIED set {E1, E3, E4, E5} }, generators as STATED in
    equivalence-declaration.yaml. ORBIT SIZE = number of DISTINCT objects in that
    set under the FINEST identity (full serialisation, no generator in force).
    Required: the size for an MD5 planted entry (step_range (0,63), 16-word
    message difference, 64-word step_delta), the size for a SHA-1 planted entry
    (step_range (0,79), 80-word DV, 80-word step_delta), and the distribution
    over 8 MD5 and 8 SHA-1 entries.

  inputs_actually_used:
    - >-
      equivalence-declaration.yaml, fields `statement`, `verification_check`,
      `scope_limit` for E1, E3, E4, E5 ONLY, extracted programmatically by a
      script that printed those five field names and no others, so that
      `passed`, `failed`, `extra`, `verdict` and `failing_case` were never
      rendered to me.
    - >-
      equivalence-declaration.yaml top-level KEY NAMES only (not values):
      quantifier_order, verified_generator_set_STRICT, excluded_generator_set,
      declared_non_generators, strict_group_is_exactly_the_verified_subset,
      two_verdicts_reported_separately, declared_interpretations.
    - >-
      census.yaml: the 16 ids and their `primitive` fields only (8 md5, 8 sha1),
      extracted programmatically. The `orbit` field of each entry EXISTS and was
      deliberately NOT read before sealing.
    - The plan's `parameters` block, including the genericity assumption.

  derivation:
    step_0_applicability_by_primitive: >-
      TWO OF THE FOUR VERIFIED GENERATORS ARE PRIMITIVE-SPECIFIC ON THEIR OWN
      STATEMENTS, and this is the first thing the quantity turns on. E1 is
      `step_shift_sha1` and its statement opens "A SHA-1 DV is a codeword of the
      linearized expansion" -- it has no action on an MD5 object. E4 is
      `signed_digit_representation_md5` and concerns modular differences in
      Z/2^32 under MD5's addition -- as named it has no action on a SHA-1 DV.
      So the acting set is {E3, E4, E5} for MD5 and {E1, E3, E5} for SHA-1. NO
      SINGLE ORBIT SIZE IS SHARED BY THE TWO PRIMITIVES, and any statement of
      "the" orbit size of the planted set is already two statements.
    step_1_E3_global_sign_flip: >-
      Acts on both primitives. Negates every signed difference and swaps the
      pair. Under the genericity assumption (P not self-negating), the image is
      DISTINCT from P. CONTRIBUTES EXACTLY 1 NEW OBJECT for both primitives, and
      it is an involution so it contributes no more.
    step_2_E1_step_shift_sha1: >-
      Acts on SHA-1 only. THIS IS WHERE THE QUANTITY IS UNDERDETERMINED BY THE
      STATEMENT, AND THE UNDERDETERMINATION IS THE RESULT.
      The STATEMENT bounds the shift by nothing: "two DVs related by a whole-step
      shift of the expansion window are the same codeword read at a different
      offset". The linearized SHA-1 expansion is a recurrence over a free 16-word
      seed and extends forward and backward without bound, so the shift parameter
      ranges over Z and the statement alone gives an INFINITE image set. The
      scope_limit does not bound it either: it only forbids changing the LENGTH.
      The only bounded shift set anywhere in the three fields I am permitted to
      read is the VERIFICATION_CHECK's: forward shifts (1,2,3,4,5,6,7,8) and
      backward shifts (1,4,8) -- ELEVEN distinct nonzero shifts, tested on 64
      seeded random codewords.
      Under the declaration's own discipline that the strict group is exactly
      what was VERIFIED (a top-level key of the same file), the defensible
      reading is that E1 is in force only for the shifts that were verified.
      Each distinct shift generically yields a distinct 80-word vector, because a
      shift refills the non-overlapping steps from the recurrence. So E1
      CONTRIBUTES 11 NEW OBJECTS under the verified-shift reading, and
      UNBOUNDEDLY MANY under the literal statement.
    step_3_E4_signed_digit_representation_md5: >-
      Acts on MD5 only. Its statement is unusual among the four: it does not map
      a path to a different path, it declares that a modular difference has MANY
      binary signed-digit representations and that THE CANONICAL FORM IS THE
      MODULAR DIFFERENCE ITSELF. So E4's image of P is "P with an alternative
      signed-digit representation of the same modular difference".
      WHETHER THAT IMAGE IS A DISTINCT OBJECT UNDER THE FINEST IDENTITY DEPENDS
      ENTIRELY ON WHETHER THE SIGNED REPRESENTATION IS A SERIALISATION COMPONENT.
      If serialisation carries only the modular difference -- which is what the
      statement's "the canonical form is the modular difference itself" suggests
      the representation collapses to -- then E4's image IS P and contributes 0.
      If serialisation carries a `signed_representation` component alongside the
      modular difference, the image is distinct and contributes 1 (or more, since
      a nonzero modular difference has many alternative representations and the
      "image" is then again a family, not a point).
      I CANNOT RESOLVE THIS FROM THE THREE PERMITTED FIELDS. I record both
      branches rather than pick one, and I name below which one the batch's own
      decoy design implies.
    step_4_E5_condition_set_normalisation: >-
      Acts on both primitives. Its image of P is "P with a different
      condition-set string having the same solution set". Same structural
      question as E4: distinct under the finest identity IFF the condition set is
      a serialisation component. E5 also carries the sharpest scope_limit of the
      four -- decided ONLY on a bounded alphabet of 8 boolean variables with
      atoms lit/eq/neq under full 2^8 enumeration, explicitly NOT a claim about
      the real per-step 32-bit condition sets -- so even where E5 acts, its
      warrant does not reach the objects in this census, whose conditions are
      per-step 32-bit. CONTRIBUTES 1 IF CONDITIONS ARE SERIALISED, ELSE 0, AND ITS
      VERIFICATION DOES NOT COVER THE OBJECTS IT WOULD BE APPLIED TO.
    step_5_genericity: >-
      ASSUMPTION USED, AS INSTRUCTED: each planted object is generic -- not
      self-negating (so E3's image differs from P), not fixed by any nontrivial
      shift in the shift set (so the 11 E1 images are pairwise distinct and
      differ from P), and no two planted objects coincide (so the distribution is
      8 identical values per primitive rather than a collapsed multiset).
      IF GENERICITY FAILED: a self-negating P loses 1; a P fixed by a shift
      subgroup of index d loses (11 - #distinct shift classes); both make the
      orbit SMALLER, never larger. So every number below is an UPPER bound under
      its own branch, and the distribution would develop a left tail rather than
      shift.

  my_numbers:
    md5_planted_orbit_size:
      branch_A_signed_representation_and_conditions_both_serialised: 4
      branch_B_signed_representation_serialised_conditions_not: 3
      branch_C_neither_serialised: 2
      composition: identity(1) + E3(1) + E4(0 or 1) + E5(0 or 1); E1 does not act
    sha1_planted_orbit_size:
      branch_A_conditions_serialised: 14
      branch_B_conditions_not_serialised: 13
      composition: identity(1) + E1(11 verified shifts) + E3(1) + E5(0 or 1); E4 does not act
      if_E1_is_read_literally_from_its_statement: unbounded (shift parameter ranges over Z)
      if_E1_is_read_as_forward_shifts_only: 10 or 11
    distribution_over_the_16_planted_entries:
      branch_B_stated_as_my_primary: >-
        8 entries at orbit size 3 (MD5) and 8 entries at orbit size 13 (SHA-1);
        mean 8, no dispersion within a primitive under genericity.
      why_branch_B_is_my_primary: >-
        The batch's OWN decoy design decides the E4 half of the fork for me and I
        am using it rather than pretending I did not read it: review-plan joint
        J5 decoy D4 is specified as "an object equal to a planted entry in every
        key component EXCEPT signed_representation", which is only constructible
        if signed_representation is a serialisation component. That forces
        E4 -> +1 for MD5. Nothing in the permitted fields decides the E5 half, and
        the plan's PD-5 summary in J6 (conditions are reported BESIDE every
        adjudication and are NOT in the membership key) points toward conditions
        living outside the key; I take the weaker branch and set E5 -> 0.
    confidence: >-
      LOW ON THE INTEGERS, HIGH ON THE FORKS. The integers depend on two
      structural facts about the serialisation that the generator STATEMENTS do
      not contain, which is itself the substantive result: the quantity the plan
      called "cheaply derivable from the generator statements alone" is NOT
      derivable from them alone.

  disagreement_with_the_producer_and_where_it_localises:
    producer_values_as_disclosed_to_me_by_the_plan: MD5 2, SHA-1 10 (identity + E3 + 8 E1 shifts)
    honesty_note: >-
      I KNEW THESE BEFORE I DERIVED. Treat what follows as a localisation of a
      known difference, not as an independent confirmation of one.
    localisation_1_the_E1_shift_set: >-
      13 vs 10 is 11 verified shifts vs 8 applied shifts. The three missing ones
      are exactly the BACKWARD shifts (1, 4, 8). The declaration VERIFIES
      backward shifts and the orbit construction apparently does not USE them.
      THIS IS NOT AUTOMATICALLY AN ERROR -- an orbit-image generator set need not
      equal a verification test set -- BUT IT IS AN UNDECLARED DESIGN CHOICE IN A
      LOAD-BEARING QUANTITY, and it is asymmetric in a way that matters: applying
      only forward shifts makes the tested orbit a one-sided sample of a
      two-sided group. If backward shifts are excluded because the backward
      refill is not well-defined at the window's start, that is a scope_limit
      that belongs in the declaration and is not there.
    localisation_2_the_MD5_orbit_and_the_more_serious_one: >-
      2 vs 3 (or 4) is E4, AND E5 ON BOTH PRIMITIVES. On the producer's
      decomposition the MD5 orbit is {identity, E3}: E4 and E5 -- BOTH IN THE
      VERIFIED SET, BOTH IN THE STRICT GROUP -- emit no orbit image at all. So
      HALF THE STRICT GROUP DOES NO WORK IN ANY ORBIT THIS BATCH CONSTRUCTS, and
      an MD5 planted entry's orbit is generated by a single involution.
      THE CONSEQUENCE IS THE POINT: orbit size 2 means the equivalence, as
      exercised, identifies an MD5 object with exactly one other object. Any
      covering number this goal computes on the MD5 side is therefore divided by
      at most 2 by the whole declared equivalence -- a factor-2 quotient, not a
      structural reduction. That is a small return for four verified generators
      and it should be stated in those terms wherever a covering number appears.
    which_implementation_the_difference_lives_in: >-
      I CAN NAME IT ONLY PARTLY, AND I SAY WHICH PART. Localisation 1 lives in
      the producer's orbit-image construction (a shift-set choice), not in my
      reading: the declaration names 11 shifts and I applied 11. Localisation 2 I
      CANNOT ASSIGN without reading blind_from -- it is either the producer's
      construction omitting E4/E5 images or my assumption that E4 and E5 have a
      constructible image at all. E4's own statement ("the canonical form is the
      modular difference itself") is a genuine reading under which E4's image is
      P and the producer is right and I am wrong.

  what_this_quantity_bears_on_downstream: >-
    Orbit size is the divisor on every covering number this goal will report. At
    the producer's values the divisor is 2 for MD5 and 10 for SHA-1, and at mine
    it is 3-4 and 13-14. THE RANGE IS THE FINDING: a covering number quoted
    without naming which shift set and which serialisation components were in
    force is not reproducible, because the same declaration supports values
    differing by a factor of 2 on MD5 and 40 percent on SHA-1.

