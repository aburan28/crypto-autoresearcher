    suite detects rather than reporting that the null passed. Both are exercisable at
    census size zero, need no new seeds, no acquisition and no search, and together
    they replace 0/3000 with a measurement of the null's power. Do this BEFORE batch 2
    acquires anything: an instrument whose control suite cannot see the message
    difference should not be the first thing a newly acquired published path meets.

