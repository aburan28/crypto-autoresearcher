  narrowest_supported_statement: >-
    WHAT SURVIVES MY JOINTS, AND NOTHING WIDER. (1) At these parameters, against this
    16-entry shadow census, the adjudicator's strict group is exactly the verified
    subset and its permissive group implements its declared generators: an E2-rotation
    image and an E6-reindexed image are NON-MEMBER under strict and MEMBER under
    permissive, and an object differing only in signed representation is MEMBER under
    strict and NON-MEMBER with E4 removed. THREE TWO-SIDED KNOWN ANSWERS ARE MET, and
    a degenerate adjudicator cannot meet them. (2) CTL-NULL's 0/3000 supports ONLY
    "the step_delta component of the canonical key separates the three declared draw
    distributions from the planted entries"; it supports nothing about the message
    difference or the in_linearized_code components, because it has no power against
    their deletion. (3) The declared equivalence is too coarse on the condition set,
    the witness pair, the signed representation, and -- unlicensed -- the MD5 step
    extent; and too fine by exactly 32k on the rotation and block axes. The net
    direction is not determinable from this batch. (4) No Tier-A content, and no
    reconstruction of it, is present in or derivable from any of the 73 committed batch
    files, the eleven harness modules, or the two logged network calls. (5) Nothing
    here is a statement about any published characteristic, about MD5's or SHA-1's
    difference space, or about novelty. My J5 `breaks` is a finding about a CONTROL'S
    POWER and is NOT a finding that the adjudicator is wrong -- on every object where I
    could construct a known answer, it gave that answer.

  next_concrete_action: >-
