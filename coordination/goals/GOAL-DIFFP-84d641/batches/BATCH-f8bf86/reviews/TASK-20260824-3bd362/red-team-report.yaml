  review_plan: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/review-plan/review-plan-f8bf86.yaml
  joints_owned: [J5, J6, J7, proves_too_much(O1-O4), blind_rederivation]
  composes_no_whole_claim_verdict: >-
    CORRECT AND DELIBERATE. J1-J4 are owned by TASK-20260824-c40847, whose report
    I have not read and may not read. Nothing below is a verdict on the batch.

  claim_under_review: >-
    As the producer states it, quoted through the review plan: "the adjudicator
    recalls planted paths and their verified-generator images, and rejects the
    declared null draws, at these parameters, against this census." My joints
    attack whether the SECOND half of that sentence is informative (J5), which
    direction the equivalence errs in (J6), and whether the firewall held as
    content (J7).

  # =====================================================================
  headline: >-
    THE CONTROL SUITE PROVES TOO MUCH. An adjudicator whose canonical key CANNOT
    SEE THE MESSAGE DIFFERENCE AT ALL scores CTL-PLANT 96/96 and CTL-NULL 0/3000 --
    the same two integers the honest adjudicator scores, to the digit. So the
    inference "the controls passed, therefore the adjudicator discriminates" goes
    through unchanged on an object where its conclusion is known false, and the
    batch's control suite cannot distinguish the delivered instrument from one
    that is blind to the primary object of a differential characteristic. This is
    a fifth proves-too-much object, not on the plan's list, and it is the single
    most consequential thing I found.

  # =====================================================================
  joint_findings:

    - joint: J5
      statement_from_the_plan: >-
        CTL-NULL measured the adjudicator and not the decoys. 0/1000 strict and
        0/1000 permissive across three families is evidence that the adjudicator
        discriminates, rather than evidence that the declared null families had no
        achievable false-positive probability to begin with.
      verdict: breaks
      verdict_in_one_sentence: >-
        0/3000 IS EVIDENCE THAT THE DECOYS WERE NEVER NEAR THE BOUNDARY, not
        evidence that the adjudicator discriminates -- and I can say that as a
        measurement rather than an impression, because I built the decoys the
        contract did not and ran the identical control against adjudicators that
        are known to be wrong.

      part_A_what_the_null_could_have_done:
        the_mechanism_that_decides_everything: >-
          Membership is EXACT CANONICAL-KEY EQUALITY -- a dict lookup of
          canonical(obj, gens) in Adjudicator._index (harness/diffpath/adjudicator.py,
          class Adjudicator). It is not a threshold. `closest_distance` is computed
          and reported beside the verdict and never enters it. So the acceptance
          region is not a ball: it is a SINGLE POINT in every retained key
          component and UNBOUNDED in every dropped one. A null drawn uniformly in
          the retained directions can only measure the volume of a point.
        measured_achievability_per_family:
          md5_delta_m:
            draws: 1000
            draws_matching_a_planted_MESSAGE_DIFFERENCE_exactly: 6
            of_those_that_also_matched_step_delta: 0
            best_case_reached_by_the_declared_null: >-
              Draw #81 matched PLANT-MD5-05's message difference exactly and agreed
              with it on 16 of 64 step_delta words, at bit distance 733 of 2560.
              That is the closest the entire declared null ever came to the
              boundary, and it is 733 bits away.
            why_the_delta_m_component_is_reachable_at_all: >-
              All 8 planted MD5 entries carry a WEIGHT-1 message difference
              (measured: weights [1,1,1,1,1,1,1,1], 8 distinct), because
              pathobj.seeded_pair sets one bit of one word when delta_m is None.
              adjudicator._null_draw_md5 then draws a weight-1 pattern uniformly
              over 512 bit positions, so P(delta_m hit) = 8/512 = 1/64 per draw.
              THE NULL DID HAVE A REACHABLE COMPONENT AND REACHED IT 6 TIMES. What
              it could never reach is the 64-word step_delta.
          sha1_dv_in_code:
            draws: 1000
            draws_in_linearized_code: 1000
            draws_matching_a_planted_DV_exactly: 0
            achievable_probability_per_draw: <= 8 / 2**512
            note: >-
              The seed window is 16 uniform words, so the draw is uniform over 2^512
              codewords against 8 targets. This family has the LOWEST achievable
              probability of the three, not the highest.
          sha1_dv_unconstrained:
            draws: 1000
            draws_in_linearized_code: 0
            planted_sha1_entries_in_linearized_code: true (all 8)
            malformedness_finding: >-
              CONFIRMED AND WORSE THAN THE PLAN SUSPECTED. In
              adjudicator._null_draw_sha1(in_code=False) the DV is overwritten with
              80 uniform words AFTER step_delta was derived from the seeded pair.
              Measured on 20 draws: 20/20 have a DV that is not the expansion of
              their own seed window. NO MESSAGE PAIR INDUCES THESE OBJECTS. A third
              of the declared null is not a hard negative, it is a malformed input
              that no candidate path could ever resemble.
        the_integer_the_plan_asked_for: >-
          HOW MANY OF THE 3000 DRAWS HAD AN ACHIEVABLE FALSE-POSITIVE PROBABILITY?
          Stated three ways because one number would hide the structure.
          (i) By exact-key hit: NONE at any probability distinguishable from zero at
          1000 draws. The largest is family (a)'s, bounded by 1/64 x P(64-word
          step_delta coincidence).
          (ii) By partial reach: 6 of 3000 reached the boundary in one key component
          and 0 reached it in two. All 6 are in family (a); families (b) and (c)
          contributed 0.
          (iii) By what the control can DETECT -- the only version that answers the
          joint. See part D.

      part_B_the_decoys_I_built_and_their_verdicts_as_data:
        method: >-
          Constructed against the committed source at the snapshot commit, using the
          declared seeds (planted 84064101/84064102). No search over the difference
          space; no collision attempted (IR-8 respected).
        D1_E2_rotation_images_of_PLANT-SHA1-00:
          verdicts:
            - {rotation_b: 1,  strict: NON-MEMBER, permissive: MEMBER, closest_distance: 1277}
            - {rotation_b: 7,  strict: NON-MEMBER, permissive: MEMBER, closest_distance: 1291}
            - {rotation_b: 16, strict: NON-MEMBER, permissive: MEMBER, closest_distance: 1297}
            - {rotation_b: 31, strict: NON-MEMBER, permissive: MEMBER, closest_distance: 1321}
          reading: >-
            THE DECLARED TWO-SIDED ANSWER IS MET ON ALL FOUR. No IR-5 breach: the
            strict group did not admit the excluded generator, and the permissive
            canonicaliser does implement its own declared generator. THIS IS A
            GENUINE POSITIVE FINDING ABOUT THE INSTRUMENT that the contract's own
            null was too weak to produce, and I report it as such.
        D2_E6_reindexed_images_block_index_3:
          verdicts:
            - {primitive: md5,  strict: NON-MEMBER, permissive: MEMBER, closest_distance: 0}
            - {primitive: sha1, strict: NON-MEMBER, permissive: MEMBER, closest_distance: 0}
          reading: Two-sided answer met. Also the first case of MEMBER-vs-NON-MEMBER at distance 0.
        D3_near_neighbours_in_step_delta_of_PLANT-MD5-00:
          - {bits_flipped: 1,  strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 1}
          - {bits_flipped: 2,  strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 2}
          - {bits_flipped: 4,  strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 4}
          - {bits_flipped: 8,  strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 8}
          - {bits_flipped: 16, strict: NON-MEMBER, permissive: NON-MEMBER, closest_distance: 16}
        D3b_near_neighbours_in_the_MESSAGE_DIFFERENCE:
          verdicts:
            - {bits_flipped: 1, strict: NON-MEMBER, closest_distance: 1}
            - {bits_flipped: 2, strict: NON-MEMBER, closest_distance: 2}
            - {bits_flipped: 4, strict: NON-MEMBER, closest_distance: 4}
          reading_of_D3_and_D3b: >-
            THIS IS WHAT A NULL WITH A TAIL LOOKS LIKE, and it is what the contract's
            families never produced. The declared null's closest approach was 711
            bits (MD5) and 2402/2413 bits (SHA-1); mine are at 1, 2, 4, 8, 16. The
            distance at which the adjudicator starts accepting is NOT SMALL AND NOT
            LARGE -- IT IS ZERO. It never accepts at any nonzero perturbation of a
            retained key component, and it always accepts at any perturbation,
            however large, of a dropped one. That is the answer to "where is the
            boundary", and it is a statement about the key's support, not about a
            margin.
        D4_E4_boundary_object_differing_ONLY_in_signed_representation:
          with_E4_in_the_strict_group:    {strict: MEMBER, permissive: MEMBER, closest_distance: 0}
          with_E4_removed_from_the_strict_group: {strict: NON-MEMBER}
          reading: >-
            Known answer met on both sides. ONE OBJECTION ATTACHED, narrow: I set the
            signed representation to a value that DECODES TO A DIFFERENT MODULAR
            DIFFERENCE and it was still MEMBER. E4's statement licenses identifying
            two representations OF THE SAME modular difference; serialize() is
            implemented as "delete the field when E4 is in force", which is strictly
            coarser. Not active on this census -- every object here is built from a
            real pair, so the field is always consistent -- so this is a schema
            laxity, not a live defect, and I scope it there.
        decoys_the_plan_did_not_ask_for_and_where_two_of_them_land:
          N1_md5_step_range_offset_changed_0_63_to_8_71:
            verdict: {strict: MEMBER, permissive: MEMBER, closest_distance: 0}
            THIS_IS_A_DECOY_ADJUDICATING_MEMBER_UNDER_STRICT: true
            mechanism: >-
              adjudicator.serialize() drops ("step_start", obj.step_range[0]) whenever
              "E1" in gens, WITH NO PRIMITIVE GUARD. E1 is declared
              `step_shift_sha1`, its statement begins "A SHA-1 DV is a codeword of the
              linearized expansion", and its scope_limit says a different step_range
              extent "is a declared_non_generator and is never absorbed". For MD5 the
              generator does not act at all, yet its presence in the strict set
              deletes the extent from the MD5 key. THE ADJUDICATOR ABSORBS A DECLARED
              NON-GENERATOR ON THE PRIMITIVE WHERE THE GENERATOR IS NOT DECLARED.
            severity_and_honest_scope: >-
              This is a real unlicensed identification and it is LATENT rather than
              active on this census: every MD5 entry here is at (0,63), so no two
              census objects differ only in extent, and PathObject has no
              well-formedness predicate that would have rejected my (8,71) object. It
              becomes active the moment a real sub-range MD5 characteristic enters the
              census, which is exactly what batch 2's acquisition is for.
          N2_condition_set_replaced_by_one_unrelated_condition: {strict: MEMBER, closest_distance: 0}
          N2b_condition_set_emptied_3531_conditions_to_0: {strict: MEMBER, closest_distance: 0}
          N3_witness_pair_cv_m_mp_replaced_by_an_unrelated_pair: {strict: MEMBER, closest_distance: 0}
          N4_sha1_step_range_relabelled_0_79_to_5_84_dv_untouched: {strict: NON-MEMBER, closest_distance: 0}
          the_N4_result_is_the_sharpest_single_line_in_this_report: >-
            AN OBJECT AT BIT DISTANCE 0 FROM A CENSUS ENTRY ADJUDICATES NON-MEMBER,
            while an object at bit distance 1277 adjudicates MEMBER under permissive
            (D1). `closest_distance` neither bounds nor tracks the verdict IN EITHER
            DIRECTION. Every sentence in this batch that reads a reported distance as
            a margin -- including "the null's closest miss sits at essentially random
            distance", which is true and is not about the boundary -- is reading a
            decision-irrelevant quantity.

      part_C_the_conclusion_as_a_direction:
        answer: >-
          (ii) WITH A MEASURED EXCEPTION. 0/3000 is overwhelmingly evidence that the
          decoys were never near the boundary. It is NOT zero evidence: the null
          retains exactly one unit of discriminating power, quantified in part D,
          and it is not the unit anyone would have guessed.
        what_would_settle_it_and_it_is_cheap: >-
          The ablation battery in part D, run as a standing control. It converts
          "the null passed" from an outcome into a measurement of the null's power,
          costs six re-runs of an 80-second suite, and needs no new objects.

      part_D_the_ablation_battery_the_measurement_that_replaces_0_of_3000:
        what_it_is: >-
          Run the IDENTICAL control suite against adjudicators whose canonical key
          has one component deleted. A control that cannot tell the honest
          adjudicator from a broken one has no power against that failure.
        results_measured_at_the_declared_seeds:
          - key_ablation: "HONEST (unmodified)"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 0
            control_suite_detects_the_ablation: n/a
          - key_ablation: "message_difference DELETED"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 0
            control_suite_detects_the_ablation: NO
          - key_ablation: "step_delta DELETED"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 6
            control_suite_detects_the_ablation: YES
          - key_ablation: "in_linearized_code DELETED"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 0
            control_suite_detects_the_ablation: NO
          - key_ablation: "message_difference AND in_linearized_code DELETED"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 0
            control_suite_detects_the_ablation: NO
          - key_ablation: "EVERYTHING but primitive+length DELETED"
            CTL_PLANT: 96/96
            CTL_NULL_strict_of_3000: 3000
            control_suite_detects_the_ablation: YES
        the_number_that_should_replace_0_of_3000: >-
          THE DECLARED CONTROL SUITE DETECTS 2 OF THE 5 KEY-COMPONENT ABLATIONS
          TESTED. It cannot detect the deletion of the message difference; it cannot
          detect the deletion of in_linearized_code; it cannot detect both deleted at
          once. It detects the deletion of step_delta (with 6 false positives, all in
          family (a)) and total collapse (3000). That is the null's power, stated as
          a power rather than as an outcome.
        the_cheapest_control_that_would_close_the_gap: >-
          A FOURTH NULL FAMILY, `md5_delta_m_perturbed`: take a planted entry, flip
          k bits of its MESSAGE DIFFERENCE, hold step_delta and everything else
          fixed, adjudicate. Known answer NON-MEMBER at every k >= 1. My D3b at k=1
          is exactly this decoy and the delta_m-blind adjudicator calls it MEMBER
          (measured), so the family detects the ablation on its first draw. Cost:
          one function, no new seeds, no search. The symmetric family for SHA-1
          perturbs the DV at fixed step_delta.

    - joint: J6
      statement_from_the_plan: >-
        The declared equivalence errs in a KNOWN direction; every covering number
        this goal ever computes inherits whether the canonical form is too coarse or
        too fine.
      verdict: breaks
      verdict_in_one_sentence: >-
        BOTH ERRORS ARE PRESENT ON DIFFERENT AXES, THEY DO NOT CANCEL, AND THERE IS A
        THIRD ERROR THE PLAN DID NOT ANTICIPATE -- so the net direction is NOT
        determinable from this batch's numbers, and any covering number quoted
        without naming which components were in force is not reproducible.
      item_1_coarseness_made_concrete:
        objects_the_canonicaliser_IDENTIFIES_with_the_differing_component_named:
          - {object: PLANT-MD5-00 vs N2b, differing_component: "conditions, 3531 -> 0", verdict: MEMBER, distance: 0}
          - {object: PLANT-MD5-00 vs N3,  differing_component: "witness pair cv/m/mp, replaced wholesale", verdict: MEMBER, distance: 0}
          - {object: PLANT-MD5-00 vs D4,  differing_component: "signed_representation, replaced by an inconsistent one", verdict: MEMBER, distance: 0}
        does_coarseness_threaten_the_NON-MEMBER_verdict:
          answer: >-
            NO, AND I AGREE WITH THE COORDINATOR'S REASONING AS STATED. Coarsening
            the key merges index buckets, so it can only turn NON-MEMBER into MEMBER,
            never the reverse. PD-5 therefore threatens the MEMBER verdict's PRECISION
            and not the NON-MEMBER verdict's SOUNDNESS.
          the_part_that_still_matters_and_is_not_in_PD-5: >-
            THE DIRECTION OF THE HARM IS THE OPPOSITE OF THE ONE PD-5 IMPLIES A READER
            SHOULD WORRY ABOUT. Coarseness makes MEMBER over-inclusive, and MEMBER is
            the verdict a covering number counts. So coarseness UNDER-DECLARES
            NOVELTY: it makes the census look like it covers more of the difference
            space than it does. With 0 readable entries a NON-MEMBER verdict carries
            no information anyway, so the only verdict whose soundness is at stake in
            this goal's eventual deliverable is the one coarseness damages.
      item_2_the_fine_direction_measured:
        E2_excluded_so_the_rotation_index_stays_in_the_strict_key:
          distinct_strict_canonical_forms_among_the_32_E2_rotations_of_PLANT-SHA1-00: 32
          distinct_permissive_canonical_forms_among_the_same_32: 1
        E6_excluded_so_block_index_stays_in_the_strict_key:
          distinct_strict_canonical_forms_among_4_block_indices: 4
          distinct_permissive_canonical_forms_among_the_same_4: 1
        combined:
          distinct_strict_forms_over_32_rotations_x_4_block_indices: 128
          distinct_permissive_forms_over_the_same_128_objects: 1
        the_inflation_factor_the_plan_asked_for: >-
          EXACTLY 32k, MEASURED AND NOT ESTIMATED, where k is the number of block
          indices a DV family spans: the strict object count is inflated by a factor
          of 32 x k relative to the permissive one, with no rotational or block
          degeneracy observed on a generic planted entry. For a two-block SHA-1
          collision (k = 2) that is a factor of 64. THE PRODUCER CALLS THIS "THE SAFE
          DIRECTION"; IT IS SAFE IN THE SENSE THAT IT OVER-DECLARES NOVELTY RATHER
          THAN UNDER-DECLARING IT, AND IT IS A FACTOR OF 64, WHICH IS NOT SMALL.
      item_3_the_E1_interpretation_and_the_distance_function:
        E1_is_load_bearing_in_a_hidden_way_on_the_WRONG_PRIMITIVE: >-
          SEE J5 DECOY N1. This is the third error and it is neither of the two the
          plan anticipated: E1's presence in the strict set removes `step_start` from
          the MD5 key even though E1 is declared for SHA-1 only. Direction: TOO
          COARSE, on an axis the declaration explicitly says is never absorbed.
          Conversely N4 shows the SHA-1 side is genuine -- relabelling a step range
          without re-deriving the DV correctly yields NON-MEMBER -- so E1 is honest
          where it is declared and unlicensed where it is not.
        hamming_distance_returns_None_across_lengths_could_any_reported_distance_be_affected:
          in_this_batch: >-
            NO. Every object in this batch is a full-range path -- MD5 (0,63) giving
            a diff_vector of 80 words, SHA-1 (0,79) giving 160 -- so no reported
            distance crossed a length boundary and none is affected.
          the_latent_defect_I_found_while_checking_it: >-
            Adjudicator.adjudicate()'s closest-entry loop has NO PRIMITIVE GUARD:
            it compares diff_vector(candidate) against diff_vector(entry) for every
            plantable entry and filters only on vector length. diff_vector length is
            16 + L for MD5 and 2L' for SHA-1, so a 40-step SHA-1 object (length 80)
            is COMPARABLE to a full 64-step MD5 object (length 80) -- verified: the
            distance is computed, not skipped. `closest_entry` can therefore name an
            entry of the wrong primitive the moment sub-range paths enter the census.
            Not active now; active as soon as batch 2 acquires a real near-collision
            path over a step sub-range, which is the normal shape of one.
      item_4_the_direction_as_a_direction_not_a_hedge:
        answer: >-
          THIS BATCH'S NUMBERS ARE EXPOSED TO BOTH ERRORS AND THE NET IS NOT
          DETERMINABLE, and I say that as a positive finding rather than as a refusal
          to commit. The two errors act on DISJOINT AXES and therefore cannot cancel
          even in principle -- they are not opposite signs of one quantity, they are
          two different quantities:
          TOO COARSE on the condition set, the witness pair, the signed
          representation, and (unlicensed) the MD5 step extent -- magnitude UNKNOWN
          and unmeasured, because it depends on how often real distinct paths share
          (delta_m, step_delta), which nobody has measured;
          TOO FINE on the rotation index and the block index -- magnitude EXACTLY 32k,
          measured above.
          A net direction would require the coarse magnitude, and the only number
          bearing on it in this batch is PD-5's 9904/19999, which measures how often
          condition sets differ at fixed (delta_m, step_delta) among WITNESSES OF THE
          SAME PATH -- the opposite question. THE COORDINATOR ASKED FOR THE EVIDENCE
          IF I FOUND A CLEAN DIRECTION; I DID NOT, AND THE REASON IS THAT ONE OF THE
          TWO MAGNITUDES HAS NEVER BEEN MEASURED.
        what_would_settle_it: >-
          CTL-OBS direction (i) enlarged and re-aimed. It already searches for
          distinct ground-truth objects with equal canonical form and found 0 in 1024
          -- but over a slice of INDEPENDENT random pairs, where a collision is
          hopeless. Re-aim it at pairs that SHARE a message difference (the 8 planted
          delta_m values, many witnesses each): that is the population where a coarse
          collision can occur, and its collision rate is the missing magnitude.

    - joint: J7
      statement_from_the_plan: >-
        The firewall held as CONTENT, not as a path. No Tier-A content, and no
        reconstruction of it, entered ANY artifact of BATCH-f8bf86 by ANY route, and
        no work has drifted into territory GOAL-MD5-001 or GOAL-SHA1-001 owns.
      verdict: holds
      established_by_search_not_by_attestation: true
      what_I_actually_searched:
        - >-
          (1) STRUCTURAL SEARCH FOR PATH DATA over all 73 batch files (excluding the
          sibling reviewer's directory, unread). Zero files contain any 8-hex-digit
          word token. Zero contain a delta_m table, a DV table, a
          sufficient-conditions table, a step/difference row table, or any decimal
          integer array of length >= 6 with entries >= 6 digits. THE BATCH CONTAINS
          NO WORD TABLE OF ANY KIND. The only regex hit anywhere is the string
          `md5_delta_m:` naming a null FAMILY in execution-report.yaml line 304,
          whose payload is {closest_entry, distance_bits: 711, vector_length_bits:
          2560} -- three integers about synthetic objects.
        - >-
          (2) THE QUARANTINED ENTRY, EVERY APPEARANCE. CEN-QUAR-KN-LIT-87e00e appears
          with path_data: null, orbit: UNDETERMINED, tier A, and the single whole-file
          sha256. I traced every other occurrence of the token 87e00e across the batch
          and the harness: all are the KN-LIT id, the citation string, or the file
          path. NOTHING ELSE ABOUT IT APPEARS ANYWHERE.
        - >-
          (3) THE ONE FILE THAT WORRIED ME, CHECKED WITHOUT READING IT.
          knowledge/literature/KN-LIT-87e00e.md is the corpus entry for the Wang paper
          and it is NOT under the quarantine prefix, so census.scan_corpus() opened it
          and read its full text. I did not read it. I ran a STRUCTURAL-ONLY probe
          that prints counts and booleans: 3565 bytes, ONE 8-hex-digit token in the
          whole file, no delta_m table, no DV table, no condition table, no step-row
          table, no long numeric array. It carries no path data, so the scanner's read
          of it obtained no Tier-A content. I record the method because "I checked
          whether the firewall leaked by reading the file" would itself be the leak.
        - >-
          (4) THE NON-READING WAS NON-READING, FROM THE CODE. census.quarantine_
          attestation() opens 'rb', streams 64 KiB chunks into a sha256 context,
          never calls decode, never parses, and returns only the digest and the byte
          count. census.scan_corpus() tests `rel_dir.startswith(QUARANTINE_DIR)`,
          prunes dirnames, and re-tests the file path -- ALL BEFORE THE open() CALL.
          The exclusion is structurally before the read, not merely asserted.
        - >-
          (5) THE NETWORK BOUNDARY, PER CALL, FROM THE LOG AND NOT THE SUMMARY.
          TASK-20260824-873dc9's retrieval-log.yaml records exactly 2 WebSearch calls
          and 0 WebFetch. R2 (Manuel DV classification, Tier C): 8 URLs returned, all
          eprint/springer/researchgate SHA-1 items, NONE is eprint 2004/199 or any MD5
          item; urls_followed NONE; retained = 3 ePrint numbers and 1 DOI. R3
          (Chabaud-Joux SHA-0, Tier C): 10 URLs returned, all SHA-0/SHA-1, NONE is
          2004/199; urls_followed NONE, including two direct PDF links that were Tier
          C and permitted; retained = one full citation, one DOI, one title. I checked
          every returned URL myself against the Tier-A list. NOTHING RETAINED EXCEEDS
          TITLE, AUTHORS, VENUE, YEAR, PAGES, DOI OR EPRINT NUMBER.
        - >-
          (6) AN AFFIRMATIVE MARK FOR THE PRODUCER, since a red team that only
          subtracts is miscalibrated: R3's log records that the search tool's summary
          asserted a complexity figure for Chabaud-Joux and that the figure was
          DELIBERATELY NOT RETAINED, because it came from a summary rather than the
          paper. That is AGENTS.md rule 5 applied to the exact surface the plan
          predicted would break (a result listing whose contents the agent does not
          control), and it is applied against the agent's own interest.
        - >-
          (7) CROSS-GOAL DRIFT AND CLOSURE LANGUAGE. Every occurrence of "blind
          rediscovery", "solver validation", "chosen-prefix cost" and "detector
          coverage" in the batch is a boundary DISCLAIMER, not work. The acquisition
