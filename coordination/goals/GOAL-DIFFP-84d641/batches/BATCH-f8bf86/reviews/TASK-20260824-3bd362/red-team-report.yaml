    THE_PROCESS_FINDING_AND_IT_IS_THE_REASON_I_AM_RECORDING_THIS: >-
      A GIT COMMIT MESSAGE IS AN UNCLOSED BLINDNESS CHANNEL. The plan's `blindness`
      block forbids reading the sibling's REPORT and its TASK DIRECTORY. It says
      nothing about commit messages, and the Coordinator committed one reviewer's
      report with its findings in the message body while the other reviewer was still
      running in the same worktree -- where `git log`, `git status` and `git show` are
      ordinary hygiene commands that CLAUDE.md and AGENTS.md actively require. Mutual
      blindness is not enforceable under those conditions.
      FIX FOR ROUND 2, EITHER OF: (a) while a round is open, commit reviewer reports
      with a subject line and NO findings in the body, deferring the summary to the
      composition commit; or (b) `blindness` explicitly covers commit messages, the
      merge digest and `coordination/events/main/**`, and reviewers are told to use
      `git log --format=%H` only until the round closes. (a) is cheaper and does not
      ask a reviewer to un-see anything.
