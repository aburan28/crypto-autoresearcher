    - prior_item: "P-5 (STRONG): the binding constraint on this whole goal will turn out to be ACQUISITION."
      departure: >-
        NOT MY JOINT, BUT J7 CORROBORATES IT AND I RECORD THAT RATHER THAN STAY SILENT.
        8 tier-labelled gaps, 1 hard refusal, 0 readable, and the single highest-value
        gap (SHA-1 DV classification) is Tier C and unblocked. Nothing in my joints
