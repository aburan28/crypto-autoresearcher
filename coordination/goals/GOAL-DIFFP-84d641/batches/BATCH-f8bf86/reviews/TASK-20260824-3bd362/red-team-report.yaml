        as declared had essentially no achievable false-positive probability and that
        CTL-PLANT recall is close to a tautology of shared code."
      departure: >-
        THE FIRST HALF IS CONFIRMED AND UNDERSTATED. The problem is not that the null's
        probability was low; it is that the control has no power against three of five
        key ablations, which is a statement about the CONTROL rather than about the
