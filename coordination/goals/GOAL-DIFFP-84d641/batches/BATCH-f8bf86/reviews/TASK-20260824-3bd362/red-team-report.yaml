        rather than assumed, which is what the plan asked for.
    - prior_item: "BLIND RE-DERIVATION: I expect DISAGREEMENT and I want it; I predict it localises to the shift set."
      departure: >-
        THE PREDICTION IS RIGHT ABOUT SHA-1 AND INCOMPLETE ABOUT MD5, AND THE
        PREDICTION ITSELF IS WHY THE RE-DERIVATION IS NOT BLIND. SHA-1: localised
