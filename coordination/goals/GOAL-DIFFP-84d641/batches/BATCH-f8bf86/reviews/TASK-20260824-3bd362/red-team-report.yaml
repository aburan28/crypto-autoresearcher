  baseline_comparison:
    why_the_role_contract_s_named_baselines_do_not_apply: >-
      Pollard-rho, BSGS and the specialized ECDLP baselines are not the comparison
      class for this artifact and I will not manufacture one. The package makes NO
      cryptanalytic claim, runs no search (IR-8), and its claim ceiling is `analyzed`.
      I confirmed there is no `dominated_by` or `sota_delta` field anywhere in the
      producer's package -- correctly, because no Pareto claim is made.
    the_comparison_that_IS_appropriate:
      baseline_0_no_equivalence_at_all: >-
        sha256 of the full serialisation, i.e. exact object identity. Against that
        baseline the declared equivalence buys a factor of 2 on MD5 and 10 on SHA-1 in
        orbit size, at the cost of the coarseness in J6 item 1 and the unlicensed
        absorption in OBJ-3. THIS IS THE HONEST HEADLINE NUMBER FOR THE EQUIVALENCE
        AND IT SHOULD APPEAR WHEREVER A COVERING NUMBER DOES.
      baseline_1_the_permissive_group: >-
        Permissive collapses 32 rotations x k block indices to 1 where strict keeps
        32k. The two verdicts genuinely bracket the answer -- verified two-sidedly by
        D1 and D2 -- which is the strongest structural property this instrument has.
      the_eliminated_dimension_check_KN-LIT-7593: >-
        APPLIED, AND IT PASSES. The equivalence eliminates search dimensions
        (rotation, sign, shift), and the cost of computing the invariant IS charged:
        canonical() enumerates up to 64 variants under permissive (2 sign x 32
        rotations) and that enumeration runs inside the measured 80.748 s. No
        dimension is eliminated for free anywhere in this package.

  heuristic_challenges:
    - >-
      THE PACKAGE'S ONE LOAD-BEARING HEURISTIC IS THE TRANSFER ASSUMPTION, AND THE
      PRODUCER ALREADY DECLINES TO MAKE IT: "an adjudicator correct on planted paths
      and null draws is also correct on published paths -- IS NOT ASSUMED AND IS NOT
      CLAIMED". I checked that no artifact quietly relies on it and found none. That
      is the correct handling and I record it as such.
    - >-
      AN UNDECLARED HEURISTIC I DID FIND: the planted set is treated as a stand-in for
      the space of candidate paths, but all 8 MD5 planted entries carry a WEIGHT-1
      message difference, whereas a real MD5 collision characteristic's message
      difference is not weight 1. The null's matched-weight design therefore matches a
      weight that no real candidate has, and every reported distance inherits that.
      Not a defect in a shadow census whose job is to make a false positive possible;
      it IS a limit on how far any figure here transfers, and it is not stated.
    - >-
      E5's scope_limit is exemplary and I want it noted: it says outright that
      decidability was established on 8 boolean variables with full 2^8 enumeration
      and is NOT a claim about real per-step 32-bit condition sets. Since E5 emits no
      orbit image and conditions are outside the key, E5 currently does no work in
      either direction, so the limit costs nothing today and will cost everything the
      day conditions enter the key.

  cost_model_challenges:
    - >-
      NO COST MODEL IS ASSERTED AND NONE IS PROJECTED. I checked for any figure
      projecting toward an attack complexity and found none; the producer states
      explicitly that no figure projects toward any attack complexity. Nothing to
      challenge, and I say so rather than inventing an objection.
    - >-
      ONE FORWARD COST NOTE FOR BATCH 2, NOT A CHALLENGE TO THIS BATCH: permissive
      canonical() enumerates 2 x 32 = 64 serialisations per SHA-1 object. At census
      size 16 that is free. At a census of N entries the index build is O(64N) and
      each adjudication is O(64 + N) because the closest-entry loop is linear in N and
      is NOT indexed. The linear scan, not the group enumeration, is what will bind
      first.

  reduction_and_scope_challenges:
    - >-
      SCOPE INFLATION: NONE FOUND. Every verdict in the package is stated against "this
      census"; the scope_note is attached to every Adjudication record programmatically
      rather than editorially; and I found no sentence anywhere in the batch treating a
      NON-MEMBER verdict as novelty.
    - >-
      THE ACQUISITION GAP IS NOT ABSORBED. 8 tier-labelled pointers, all path_data
      null, reported as `pointer_entries_excluded: 9` beside an orbit count of 0 with a
      note that 0 orbits carries no information. Never summed with the readable count.
    - >-
      TIER B IS ROUTED, NOT CLOSED, IN EVERY ARTIFACT THAT MENTIONS IT. I searched for
      closure language against Tier B and the MD5 lane and found the opposite: an
      affirmative statement that the lane is not exhausted with two named live routes.
      Under docs/inventor-protocol.md section 4 this is the correct handling of an
      obstruction, and premature closure is the failure mode I was looking for.
    - >-
      ONE SCOPE ASYMMETRY WORTH THE COORDINATOR'S ATTENTION: the batch's own claim that
      "all four batch-1 controls are fully exercisable at census size zero" (amendment,
      batch_1_not_re_scoped reason 2) is true of the controls as WRITTEN and false of
      the property they are meant to establish. CTL-NULL at census size zero measures
      the shadow census, and the shadow census's weight-1 message differences are not
      the population any real candidate is drawn from.

  proof_architecture_challenges:
    observation_fiber_attack:
      applied_to: canonical(obj, gens), the claimed invariant.
      result: >-
        SUCCESSFUL, AND IT IS THE J6 RESULT. I held the invariant fixed and varied the
        object: N2b (3531 conditions -> 0), N3 (witness pair replaced), D4 (signed
        representation replaced), N1 (MD5 extent shifted) all share one canonical form
        with PLANT-MD5-00. The missing separator for N1 is a primitive guard on the
        step_start drop (OBJ-3); for N2b/N3 the omission is deliberate and measured
        (PD-5); for D4 it is the consistency of the representation with the modular
        difference (OBJ-8).
    quantifier_order_attack:
      result: >-
        NO DEFECT FOUND, AND THE IMPLEMENTATION MATCHES THE DECLARATION. The declared
        order is "for every P there exists C and there exists g with g(P) = C, g may
        depend on both". canonical() realises it by minimising serialize over the
        orbit and taking a dict hit, which is exactly that existential and nothing
        stronger. No witness is chosen after seeing an outcome.
    nearby_object_attack:
      result: >-
        RUN AS O1 (SHA-0) and O3 (E2 rotation). Both separate correctly, and O1
        separates on the path content and not only on the in_linearized_code flag,
        which is the stronger outcome.
    method_ceiling_attack:
      result: >-
        THE CEILING IS BELOW THE HEADLINE, AND THAT IS THE J5 VERDICT. The largest
        claim CTL-NULL as declared can support under ideal tuning is "the key's
        step_delta component separates uniform draws from planted entries". It cannot
        reach "the adjudicator discriminates", because it has no power against the
        deletion of any other component (measured, J5 part D).
    compositional_invariant_attack:
      result: >-
        RUN AS THE ABLATION BATTERY. Deleting message_difference breaks nothing the
        controls can see; deleting step_delta is caught with 6 false positives;
        deleting everything is caught with 3000. The first recursion step that fails
        is the null's, not the canonicaliser's.

  departures_from_the_coordinator_recorded_prior:
    - prior_item: "J5 (b): family (c)'s 1000 draws are excluded by ONE BOOLEAN before any path content is compared."
      departure: >-
        HALF RIGHT, AND THE WRONG HALF IS LOAD-BEARING. Descriptively confirmed:
        in_linearized_code is False on 1000/1000 family-(c) draws and True on 8/8
        planted SHA-1 entries. Mechanically REFUTED: forcing the flag True leaves the
        verdict unchanged, and DELETING the flag from the key entirely leaves
        CTL-NULL at 0/3000. The boolean is redundant, not decisive, so "a third of
        CTL-NULL was a boolean check" understates the problem -- a third of CTL-NULL
        was decided by a component the control cannot even detect the absence of.
    - prior_item: "J5 (c): family (b) is the only family with any structure at all."
      departure: >-
        REVERSED. Measured, family (b) is the WEAKEST: uniform over 2^512 codewords
        against 8 targets, 0/1000 partial matches. Family (a) is the only family with
        measurable structure -- 6/1000 exact message-difference matches, because the
        planted entries all carry weight-1 differences and the draw space is 512
        positions.
    - prior_item: "J5 (a): family (a)'s a priori strict false-positive probability is indistinguishable from zero at 1000 draws."
      departure: >-
        CONFIRMED IN OUTCOME, REFINED IN STRUCTURE. The joint probability is
        indistinguishable from zero, but it FACTORS, and one factor is 1/64 and was
        reached 6 times. That factorisation is what makes the ablation battery
        possible and is the only reason the null has any power at all.
    - prior_item: "J5: I think D1 comes out correct, which would be a genuine positive finding."
      departure: >-
        CONFIRMED AND EXTENDED. D1 correct on all four rotations; D2 correct on both
        primitives; D4 correct on both sides. Three two-sided known answers met. I
        agree this is a genuine positive finding and I would not want the composition
        to lose it under J5's `breaks`.
    - prior_item: "J6: you will find BOTH errors present, on different axes, and that they do not cancel."
      departure: >-
