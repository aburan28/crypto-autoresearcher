  proves_too_much:
    required: true
    assigned_to: TASK-20260824-3bd362
    rationale: >-
      A null object detects an artifactual signal; a known-false object detects
      an artifactual argument. The argument under test is "the adjudicator's
      controls passed, therefore the adjudicator discriminates". Run that
      argument against objects for which its conclusion is KNOWN FALSE. An
      argument that still goes through there is wrong somewhere nobody has read
      closely enough.
    objects:
      - object: >-
          O1. A SHA-0 CODEWORD PRESENTED AS A SHA-1 DISTURBANCE VECTOR.
          Pre-fixed at batch opening (batch.yaml review_architecture item 4).
          MEMBER is KNOWN FALSE: SHA-0's expansion lacks the one-bit rotation, so
          a SHA-0 codeword is not in general a SHA-1 codeword.
        failure_signature: >-
          The adjudicator must return NON-MEMBER in BOTH strict and permissive,
          AND primitives.sha1_in_linearized_code() must return False for the
          codeword. If it returns MEMBER, or if in_linearized_code returns True,
          the instrument does not separate the two expansions and CTL-NEARBY's
          0/1000 versus 1000/1000 was measuring something else. SHARPENING,
          BECAUSE THE PLAIN VERSION IS TOO EASY: also report WHICH key component
          decided the NON-MEMBER. If the verdict rests solely on the
          in_linearized_code boolean, say so -- a separation carried entirely by
          one flag is a weaker result than a separation carried by the path.
          NOTE THE STANDING LIMIT: the producer states SHA-0's expansion is
          implemented from the stated one-rotation difference and is NOT gated on
          a published SHA-0 digest, because IR-10 forbids acquiring one. So O1
          tests separation of the two expansions AS THIS PACKAGE DEFINES THEM and
          certifies nothing about SHA-0 itself. Do not overstate it.
      - object: >-
          O2. A NULL DRAW FROM INSIDE THE LINEARIZED CODE (CTL-NULL family (b)).
          Pre-fixed at batch opening. MEMBER is KNOWN FALSE: it is a genuine
          SHA-1 codeword and therefore a legitimate disturbance vector, but it is
          not any planted entry nor an image of one.
        failure_signature: >-
          NON-MEMBER in both modes. AND -- this is the part that makes the object
          worth running -- exhibit a MODIFIED version of the same object for
          which the adjudicator DOES return MEMBER (for instance by replacing its
          difference vector with a planted entry's). If no perturbation of a
          family-(b) object can be made to adjudicate MEMBER, then family (b) had
          no achievable false-positive probability and the known-false object has
          no discriminating power. That result feeds directly back into J5.
      - object: >-
          O3. AN E2-ROTATION IMAGE OF A PLANTED SHA-1 ENTRY. ADDED BY THIS PLAN;
          see procedure_deviations PD-A. Known answer on BOTH sides: under
          STRICT, MEMBER is KNOWN FALSE (E2 is EXCLUDED and is not in the strict
          group); under PERMISSIVE, MEMBER is KNOWN TRUE (E2 is a declared
          generator and permissive uses all six).
        failure_signature: >-
          strict = NON-MEMBER and permissive = MEMBER. Strict returning MEMBER
          means the strict group is not exactly the verified subset, which is an
          IR-5 breach and voids every strict verdict in the batch. Permissive
          returning NON-MEMBER means the permissive canonicaliser does not
          implement its own declared generator, which voids the claim that the
          two verdicts bound the error in a direction a reader can see. THIS IS
          THE ONLY OBJECT IN THIS PLAN WITH A KNOWN ANSWER ON BOTH SIDES OF THE
          SAME COMPARISON, which is why it was added.
      - object: >-
          O4. A NULL DRAW FROM FAMILY (c), sha1_dv_unconstrained, whose
          recomputed in_linearized_code is False. MEMBER is KNOWN FALSE.
        failure_signature: >-
          NON-MEMBER in both modes -- expected and nearly content-free. THE
          REQUIRED OUTPUT IS NOT THE VERDICT, IT IS THE REASON: name the key
          component that decided it. If in_linearized_code alone decided all
          1000 family-(c) draws, then a third of CTL-NULL was a boolean check and
          the argument "the controls passed, therefore the adjudicator
          discriminates" proves too much on this object -- it would go through
          for an adjudicator that compared nothing but that flag.

  blind_rederivation:
    required: true
    assigned_to: TASK-20260824-3bd362
    quantity: >-
      THE ORBIT-SIZE DISTRIBUTION OVER THE 16 PLANTED CENSUS ENTRIES. For a
      planted entry P, its ORBIT is the set {P} together with the image of P
      under each generator in the VERIFIED set {E1, E3, E4, E5}, as those
      generators are STATED in equivalence-declaration.yaml; its ORBIT SIZE is
      the number of DISTINCT OBJECTS in that set under the FINEST identity, i.e.
      full serialisation with no generator in force. Required output: the orbit
      size for an MD5 planted entry (step_range (0,63), 16-word message
      difference, 64-word step_delta), the orbit size for a SHA-1 planted entry
      (step_range (0,79), 80-word DV, 80-word step_delta), and the resulting
      distribution over 8 MD5 entries and 8 SHA-1 entries.
    stated_as_a_quantity_not_a_method: >-
      DELIBERATE. You are given the definition of the quantity and the
      parameters. You are NOT given, and must not read, how the producer
      computed it. Recomputing from the producer's implementation is
      REPLICATION, and replication reproduces an implementation that is wrong
      and self-consistent with perfect fidelity -- which is exactly the failure
      validation cannot see.
    parameters:
      verified_generator_set: "{E1, E3, E4, E5}"
      generator_statements_source: >-
        coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/equivalence-declaration.yaml,
        fields `statement`, `verification_check` and `scope_limit` for each of
        E1, E3, E4, E5. READ THOSE FIELDS ONLY. Do not read the `passed`,
        `failed`, `extra` or `verdict` fields of that file before your
        re-derivation is sealed, and attest which fields you read.
      planted_set: >-
        8 MD5 entries and 8 SHA-1 entries, ids PLANT-MD5-00..07 and
        PLANT-SHA1-00..07, as listed in census.yaml
        `shadow_census_planted_entries`. Each is a synthetic conforming path
        induced by a seeded random message pair (seed 84064101, index 0..7).
        You may take from census.yaml the ids, the primitive, and the fact that
        each is a generic conforming path; you do not need and should not seek
        their word-level contents for this quantity.
      genericity_assumption_you_may_use: >-
        Each planted object is generic: not self-negating, not fixed by a
        nontrivial shift, and not equal to any other planted object. State this
        as an assumption you used, and state what the answer would be if it
        failed.
      seed_for_the_equivalence_checks: 20260824
    blind_from:
      - harness/diffpath/**
      - tests/test_diffpath_adjudicator.py
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/execution-report.yaml
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/null-control-result.json
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/raw-observations.json
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/run-index.json
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/runs/**
      - "the `passed`, `failed`, `extra` and `verdict` fields of equivalence-declaration.yaml"
      - "this plan's coordinator_prior.prior_for_this_review_round, item BLIND RE-DERIVATION"
    blind_from_includes_my_own_prior: >-
      YES, AND ON PURPOSE. My expected answer for this quantity is written in
      this plan and would anchor you if you read it first. Seal your
      re-derivation before reading that item. Everything else in this plan you
      must read.
    sequencing_rule: >-
      THE RE-DERIVATION IS DONE FIRST AND SEALED BEFORE ANY OTHER JOINT.
      Joints J5, J6, J7 and every proves-too-much object require reading and
      running harness/diffpath/**, which is in blind_from. Write the
      re-derivation to its own file --
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/blind-rederivation.yaml
      -- with its own attestation listing every path read UP TO THAT POINT, and
      do not amend it afterwards. Then proceed.
    independence_checker_note: >-
      DECLARED IN ADVANCE SO IT IS NOT DISCOVERED AS A DEFECT AT COMPOSITION.
      tools/check_review_independence.py flags a re-deriver whose declared
      sources intersect its blind_from. TASK-20260824-3bd362's TASK-LEVEL
      sources_read WILL intersect blind_from, because its other joints require
      exactly those paths. The independence that matters is the SEALED
      SUB-ARTIFACT's read set, not the task's total. Set
      review_attestation.blind_from_respected: true if and only if no blind_from
      path was read before blind-rederivation.yaml was written, and say so in
      those words. TASK-20260824-b03556 must record this at the close rather
      than let the checker's flag read as a violation.
    why_this_quantity: >-
      It is the smallest number in the batch that bears on everything downstream.
      Orbit size is how much work the equivalence does; if it is 1 the
      equivalence identifies nothing, and every covering number this goal ever
      computes is scaled by it. It is also cheaply derivable from the generator
      statements alone, which is what makes a blind re-derivation possible here
      at all.
    what_agreement_and_disagreement_mean: >-
      Agreement is evidence ABOUT THE QUANTITY. Disagreement is NOT
      automatically a producer error: it localises to one of two named
      implementations -- the producer's code, or your reading of the statements
      -- and you must say which, or say you cannot tell. State your number
      before you look at the producer's, and then state the difference and where
      you think it comes from.

  reviewer_priority_order:
    rationale: >-
      BOTH REVIEWERS ARE BUDGETED AT 360 s AGAINST MORE JOINTS THAN THAT
