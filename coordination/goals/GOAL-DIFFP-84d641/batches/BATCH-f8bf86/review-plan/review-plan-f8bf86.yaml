        (4) ANSWER THE DIRECTION QUESTION AS A DIRECTION, NOT A HEDGE. Which
        error is this batch's numbers exposed to?
        WHERE I THINK IT BREAKS: you will find BOTH errors present, on different
        axes, and that they do not cancel. If you find a single clean direction I
        want the evidence, because I do not see how it exists.
      breaking_artifact: >-
        A concrete pair of objects, with their key components printed, that the
        canonicaliser identifies and that a correct reading of the declaration
        says are distinct (too coarse); or a concrete pair the declaration says
        are equivalent and the canonicaliser separates (too fine); plus the
        stated inflation factor for the strict count.

    - joint: >-
        J7. THE FIREWALL HELD AS CONTENT, NOT AS A PATH. No Tier-A content, and
        no reconstruction of it, entered ANY artifact of BATCH-f8bf86 by ANY
        route -- and no work has drifted into territory GOAL-MD5-001 or
