  claim_under_review:
    stated_by: TASK-20260824-c6625a (the producer), quoted from its own artifacts
    quotation_discipline: >-
      REPRODUCED AS THE PRODUCER STATED IT, NOT AS THE COORDINATOR WOULD RESTATE
      IT. The producer deliberately composed no verdict, so its claim is
      narrower than a reader expecting a result would assume, and narrowing it
      further or widening it here would both be misrepresentations.
    what_a_passing_control_set_licenses_verbatim: >-
      'ONLY: "the adjudicator recalls planted paths and their verified-generator
      images, and rejects the declared null draws, at these parameters, against
      this census."'
    the_load_bearing_limit_verbatim: >-
      'ADJUDICATOR CORRECTNESS AGAINST PUBLISHED PATHS IS UNTESTED THIS BATCH,
      AND THAT IS A SCOPE LIMIT, NOT A PASS. The instrument was validated
      entirely on the SHADOW census of synthetic planted entries, because the
      real census has zero readable entries and cannot validate it. Every
      control here says something about planted paths and declared null draws;
      none says anything about a published characteristic. The transfer
      assumption -- that an adjudicator correct on planted paths and null draws
      is also correct on published paths -- IS NOT ASSUMED AND IS NOT CLAIMED.'
    closing_statement_verbatim: >-
      'NO PATH IS CLAIMED NEW BY THIS TASK, FOR EITHER PRIMITIVE, AT ANY TIER.
      NO SEARCH OVER THE DIFFERENCE SPACE WAS RUN, no collision was attempted,
      and no figure in this report projects toward any attack complexity.
      Novelty is unverified and nothing here licenses a novelty claim. Every
      number above is MEASURED by a charged run; no number is MODELED, and none
      is an estimate presented as an observation. The Executor records
      observations and composes no verdict on whether the instrument is
      validated, on whether the corpus finding supports anything, or on the
      difference space -- those judgements belong to the Reviewer and the
      Coordinator.'
    self_assessment_verbatim: >-
      'data_quality: limited ... `limited`, deliberately, and not `good`. Every
      control passed and every figure is an integer from a charged run, but the
      instrument was validated ONLY against a shadow census of synthetic
      entries, the readable census is empty, the null''s closest miss sits at
      essentially random distance so the null was easy rather than demonstrably
      hard, and two of six declared generators are excluded. The data is sound
      for what it covers and covers much less than the instrument is ultimately
      for.'
    the_null_in_the_producer_s_own_words_verbatim: >-
      'NOTHING HERE ESTABLISHES THAT THE NULL WAS HARD. On this evidence the
      null was easy, and a control that is easy to pass measures less than a
      control that is hard to pass. The Executor records the integers; whether
      the null was demanding enough is the Red Team''s question.'
    coordinator_note_on_the_shape_of_this_claim: >-
      THE PRODUCER HAS ALREADY CONCEDED, IN ADVANCE AND UNPROMPTED, MOST OF WHAT
      A LAZY REVIEW WOULD FIND. That changes what this round is for. Confirming
      the producer's own stated limits is not a review result; it is agreement
      with a text. The useful findings are the ones the producer did NOT state:
      whether the controls could have failed at all, whether the reported
      integers are what the code produces, whether the equivalence errs coarse
      or fine, and whether anything reconstructible crossed the firewall.

  coordinator_prior:
    recorded_before_any_report_returns: true

    carried_forward_verbatim_from_batch_opening:
      source: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml, key `coordinator_prior_recorded_at_opening`
      reproduced_word_for_word: true
      revision: >-
        NONE. Not one word of the opening prior is edited, softened, or
        re-scoped in light of the results, which are now known to this session
        and were not known to the session that wrote it.
      text: >-
        RECORDED BEFORE ANY PRODUCER RUNS, AND BEFORE THE REVIEW PLAN EXISTS, so
        that a review overturning it is legible as a result rather than absorbed
        (AGENTS.md, "Review architecture"; agents/coordinator.md, "Record your
        prior"). THE LATER REVIEW-PLAN HANDOFF MUST CARRY THIS BLOCK FORWARD
        VERBATIM; any revision of it is a `procedure_deviations` entry, never an
        edit.
        P-1 (STRONG, AND THE ONE I MOST EXPECT TO BE RIGHT). The readable census
        will be EMPTY for both primitives: readable_md5 = 0 and readable_sha1 =
        0. Basis: the corpus survey recorded in EXP-DIFFP-fe894e
        preregistered_prediction. FALSIFICATION TRIGGER: any readable path or
        disturbance-vector datum found under knowledge/ or inputs/. If that
        trigger fires, my opening survey was incomplete and that is the finding.
        P-2 (MODERATE). E1 (SHA-1 step shift), E3 (global sign flip) and E4 (MD5
        signed-digit representation) will VERIFY. E2 (SHA-1 bit rotation) is the
        one I am genuinely unsure of and the one whose verdict most changes the
        covering number; I predict it verifies for the EXPANSION but I do NOT
        predict it verifies for the full step function, because the step
        function's additive constants and its non-linear functions need not
        commute with a rotation. E6 (block-index reuse) verifies. E5
        (condition-set normalisation) is EXCLUDED for budget, not for falsity.
        P-3 (STRONG). CTL-PLANT reaches 100% recall and CTL-NULL returns zero
        strict-mode false positives, because the planted paths and the null
        draws are far apart by construction. THIS IS THE PREDICTION I TRUST
        LEAST AS EVIDENCE, and I say so in advance: a null that passes easily
        may be measuring that the null was easy rather than that the adjudicator
        is sharp. The reviewer that attacks the null's difficulty rather than
        its outcome is doing the more useful work, and CTL-NULL family (b) --
        uniform draws from INSIDE the linearized code -- is where I expect a
        false positive if there is one anywhere.
        P-4 (WEAK). CTL-OBS direction (i) finds ZERO collisions within the
        declared bounded slice. I hold this weakly: the slice is small and
        absence there is close to uninformative, and I would rather the report
        said so than reported a zero as a pass.
        P-5 (STRONG, AND IT IS A PREDICTION ABOUT THIS PROGRAM RATHER THAN ABOUT
        THE MATHEMATICS). The binding constraint on this whole goal will turn
        out to be ACQUISITION, not search and not solver quality. If that is
        right, batch 2's object is primary-source acquisition under a firewall
        discipline compatible with GOAL-MD5-001's BCP-1, and every later batch's
        budget argument depends on it.

    opening_prior_scored_against_the_producer_artifacts:
      status_note: >-
        SCORING, NOT REVISION. The opening prior stands unedited above. This
        block records how it fared against the producer's reported integers,
        which is itself a pre-commitment: it fixes what I believed BEFORE the
        reviewers can tell me whether those integers are real. If a reviewer
        shows an integer is wrong, this scoring is wrong with it, and that is
        the point.
      P-1: >-
        APPARENTLY CORRECT (readable_md5 = 0, readable_sha1 = 0). I hold this
        far more weakly than the exact agreement suggests, and I say so before
        the review: an exact hit on a prediction of ZERO is also what a scanner
        that silently found nothing would produce. See joint J4.
      P-2: >-
        MIXED, AND THE MISSES ARE THE INTERESTING PART. E1, E3, E4 verified as
        predicted. E2's two-part split landed exactly where I said (expansion
        commutes, step function does not), which is the one place my prior was
        specific and right. TWO PREDICTIONS FAILED: I predicted E6 verifies and
        it is EXCLUDED; I predicted E5 would be excluded for budget and it
        VERIFIED. I was wrong about both, in opposite directions, and neither
        error was in the direction I was watching.
      P-3: >-
        OUTCOME AS PREDICTED (96/96 recall, 0/3000 strict false positives) AND
        THE PREDICTION I SAID I TRUSTED LEAST. Nothing about the outcome updates
        me. My expectation of a family-(b) false positive did not fire, which I
        now read as evidence about the null's power rather than about the
        adjudicator's sharpness. See joint J5.
      P-4: >-
        AS PREDICTED (0 collisions in 1024 objects) and still weak. The producer
        marked direction (i) `required_to_be_zero: false`, which is the honesty
        I asked for.
      P-5: >-
        UNCHANGED AND, IF ANYTHING, STRENGTHENED: 8 acquisition-gap entries, 1
        quarantined pointer, 0 readable. Not a review question.

    prior_for_this_review_round:
      one_sentence: >-
        I EXPECT BOTH REVIEWS TO CONFIRM THE ARITHMETIC AND TO BREAK THE
        CONTROLS' MEANING: the Validator will find the reported integers
        reproduce except for at least one summary-versus-raw transcription
        defect, and the Red Team will find that CTL-NULL as declared had
        essentially no achievable false-positive probability and that CTL-PLANT
        recall is close to a tautology of shared code -- so the honest composed
        verdict is `analyzed` with the instrument UNVALIDATED as an instrument,
        not merely unvalidated against published paths.
      expanded:
        - >-
          J1: I expect exact agreement on the large majority of integers and at
          least one disagreement. I have already observed one from reading:
          execution-report.yaml states the E6 (0,0) condition-satisfying count
          as 2094 in three places while equivalence-declaration.yaml,
          raw-observations.json and the equivalence-verification raw-result.json
          all state 2089. I predict the Validator finds 2089 is what the code
          produces and 2094 is a summary transcription error that does not
          change the E6 verdict (both are non-vacuous), and I predict it finds
          no OTHER integer disagreement. If it finds a second, my confidence in
          every unchecked integer in the report drops sharply.
        - >-
          J2: I expect manifests to be complete and seeds to be exactly the
          seven declared, and I expect AN-1 (the duplicate `_inference_block` at
          harness/runner.py lines 183 and 695) to be confirmed by an independent
          ast parse. I expect NO undeclared run.
        - >-
          J3: I EXPECT THIS JOINT TO BREAK, and this is my sharpest new
          prediction. CTL-PLANT builds its test images with
          adjudicator.orbit_images(), which calls EQ.act_E3_negate and
          EQ.act_E1_shift; adjudicator.canonical() minimises the serialisation
          over calls to the SAME functions. Recall of a generator image is then
          close to guaranteed by shared code rather than by correctness, and
          96/96 measures agreement of a function with itself. I predict a
          from-statement re-implementation of one E3 image and one E1 image
          still adjudicates MEMBER (so the defect is latent, not active), and I
          predict a single-bit mutation of an image correctly adjudicates
          NON-MEMBER. If EITHER prediction fails the instrument is in worse
          shape than `limited`.
        - >-
          J5: I EXPECT THIS JOINT TO BREAK. Membership is EXACT canonical-key
          equality -- a dict lookup in Adjudicator._index -- not a
          distance-thresholded match, so a uniform draw is a false positive only
          if it hits the exact key. Three specific things I expect the Red Team
          to establish: (a) the a priori strict false-positive probability of
          family (a) is on the order of the reciprocal of the number of weight-w
          patterns in 512 bits, times an exact 64-word step_delta match, i.e.
          indistinguishable from zero at 1000 draws; (b) family (c)
          (sha1_dv_unconstrained) carries in_linearized_code False on all 1000
          draws while the planted SHA-1 entries carry True, and
          `in_linearized_code` is a component of serialize() for sha1, so 1000
          of the 3000 draws are discriminated by ONE BOOLEAN before any path
          content is compared; (c) family (b) is therefore the only family with
          any structure at all, exactly as the producer said. If all three hold,
          0/3000 is not evidence the adjudicator discriminates -- it is
          consistent with any adjudicator that does exact-key matching, INCLUDING
          A BROKEN ONE.
        - >-
          J6: I expect the Red Team to find the equivalence errs toward
          UNDER-declaring novelty on the condition-set axis (PD-5 removes
          conditions from the key, so two paths differing only in conditions are
          identified and reported as one) and toward OVER-declaring novelty on
          the block-index and rotation axes (E6 and E2 excluded, so the same
          characteristic at two block indices, or under a rotation, counts as
          two objects). I expect it to report that these two errors do NOT
          cancel and that the net direction is not determinable from this
          batch's numbers. If it reports a clean single direction I want the
          evidence, because I do not currently see how it could.
        - >-
          J7 and the firewall: I expect NO reconstructible Tier-A content
          anywhere in the batch, and I hold this prediction with the least
          comfort of any in this plan, because it is the one whose failure
          damages a goal that is not mine. Zero is the only acceptable finding
          and I am asking for it to be searched for rather than attested.
        - >-
          BLIND RE-DERIVATION: I expect DISAGREEMENT, and I want it. A
          re-deriver working from equivalence-declaration.yaml's E1 statement
          (forward shifts 1..8 and backward shifts 1, 4, 8 -- eleven distinct
          shifts) should predict a SHA-1 planted orbit of 1 + 1 + 11 = 13
          distinct objects. The producer reports 10, decomposed as identity + E3
          + 8 E1 shifts. I predict the re-derivation returns 13 (or some value
          other than 10) and that the disagreement localises to the orbit-image
          shift set being a different, smaller set than the verification shift
          set. THAT IS NOT NECESSARILY AN ERROR -- the two sets need not be the
          same -- but if it is not an error it is an undeclared design choice in
          a load-bearing quantity, and either way the re-derivation earns its
          budget.
      what_would_overturn_this_prior_wholesale: >-
        A Validator finding that the reported integers do NOT reproduce from the
        declared seeds, or that a run directory is undeclared or a seed is not
        the declared one. That would put the entire measurement basis in doubt,
        no ordinary composition could run over it, and the batch would close on
        an infrastructure finding rather than a research one. See
        escalation_triggers.

  reviewer_independence:
    sessions:
      - task: TASK-20260824-c40847
        role: validator
        policy: review-adversarial
