    - joint: >-
        J5. CTL-NULL MEASURED THE ADJUDICATOR AND NOT THE DECOYS. 0/1000 strict
        and 0/1000 permissive across three families, against 16 plantable
        entries, is evidence that the adjudicator discriminates -- rather than
        evidence that the declared null families had no achievable
        false-positive probability to begin with.
      assigned_to: TASK-20260824-3bd362
      attack_plan: >-
        ATTACK THE NULL'S POWER, NOT ITS OUTCOME. The outcome is not in dispute.
        PART A -- SHOW WHAT THE NULL COULD HAVE DONE. Membership in
        adjudicator.Adjudicator.adjudicate() is EXACT CANONICAL-KEY EQUALITY: a
        dict lookup of canonical(obj, gens) in an index built over the plantable
        entries. It is NOT a distance threshold; closest_distance is REPORTED
        beside the verdict and never decides it. So compute, for each declared
        family, the a priori probability that one draw hits an exact key:
        (a) md5_delta_m draws a uniform weight-w pattern over 512 bit positions
        (adjudicator._null_draw_md5 uses rng.sample(range(16*32), weight)) and
        must ALSO match a 64-word step_delta derived from the pair; state the
        order of magnitude;
        (b) sha1_dv_in_code draws a 16-word seed window and expands, so the key
        must match over 80 words;
