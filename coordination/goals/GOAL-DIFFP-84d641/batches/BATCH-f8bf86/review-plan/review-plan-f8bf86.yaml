      The dispatching session runs `python3 -m orchestration.adapter doctor
      --probe` immediately before each review and each report records the
      requested policy, the resolved model identifier, the backend and the probe
      status. No probe was run by this plan-writing session and none is claimed.

  blindness:
    mutual: true
    statement: >-
      TASK-20260824-c40847 and TASK-20260824-3bd362 MAY NOT READ EACH OTHER'S
      REPORTS in this round, and neither may read the other's task directory
      under the batch's reviews/ path. Each attests in its report exactly what
      it read, honestly and completely, and sets read_sibling_reports: false.
    lifted_for: []
    rationale: null
    both_may_read: >-
      The snapshot-bound artifacts, the frozen contract
      experiments/EXP-DIFFP-fe894e/specification.yaml, the amendment
      AMD-20260824-DIFFP-ACQ-1, the opening decision DEC-20260824-4f74cd, the
      batch record, this plan, and the snapshot receipt. Reading this plan is
      required, not merely permitted: it carries their joint assignments and the
