        (2) CHECK THE SCAN'S OWN ARITHMETIC. Confirm 9337 files exist under
        knowledge/ and inputs/ and that the six named candidates
        (KN-LIT-3892, KN-LIT-3975, KN-LIT-4387, KN-LIT-5841, KN-LIT-87e00e,
        KN-TECH-066) are what a direct grep returns. Confirm the quarantine
        prefix exclusion happens BEFORE any file is opened, from the code, not
        from the attestation.
        (3) RE-CONFIRM THE QUARANTINE PAYLOAD SHA256 FROM ITS BYTES WITHOUT
        PARSING, and compare against
        e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5 at 5583
        bytes. THIS IS NOT REDUNDANT: the snapshot receipt records that this
        check was NOT performed independently in the archive pass (open gate
        G5), so the only re-confirmation on file is the producer's own, about
