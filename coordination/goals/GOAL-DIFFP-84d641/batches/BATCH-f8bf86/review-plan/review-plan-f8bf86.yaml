  reporting_rules:
    - >-
      REPORT ON THE JOINTS YOU OWN. Do not compose a whole-claim verdict: you
      cannot see the other reviewer's joints by construction, so a whole-claim
      verdict from you would be an opinion formed from a fraction of the
      evidence. The Coordinator composes.
    - >-
      Every joint gets holds | breaks | inconclusive, plus PARTIAL where the
      budget bound before the joint was finished, with what remained unchecked.
    - >-
      An objection must name what would settle it. "This is unconvincing" is not
      a finding; "this decoy at these parameters adjudicates MEMBER, and here it
      is" is.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not
      a negative finding against the producer. Report it as such and say what
      remained unverified. Note in advance that sympy and pytest are absent from
      this environment and are not acquirable under IR-10; the producer's
      disclosed shim and fallback runner are the declared workarounds.
    - >-
      READ coordinator_prior ABOVE AND SAY WHERE YOUR FINDINGS DEPART FROM IT.
      A prior the review overturns is among the most valuable results this
      program can produce and it is only legible if you name the departure.
      Naming a departure is not a criticism of the plan; it is the deliverable.
    - >-
      Write only into your own task directory under the batch's reviews/ path.
      The archived artifacts are immutable.
    - >-
      Carry review_attestation with task_id, joints_owned, sources_read
      (honestly and completely), read_sibling_reports: false,
      blind_from_respected (red team), and verdict.
    - >-
      Record requested policy, resolved model identifier, backend, probe status
      and reasoning effort. A tier the backend cannot reach is a PAUSE, never a
      silent downgrade. Never Amazon Bedrock.
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs.

  escalation_triggers:
    - >-
      Any finding under J1 or J2 that the reported integers were produced by
      code other than the snapshot-bound modules (a code_path_fingerprint that
      does not match the tree), or that a seed is not one of the seven declared,
      or that an undeclared run exists. The batch's entire measurement basis
      would be in doubt and no ordinary composition can run over it: STOP, report
      immediately, and the Coordinator closes the batch on an infrastructure
      finding rather than a research one.
    - >-
      Any finding under J7 that Tier-A content or a reconstruction of it entered
      any artifact. This is reported to GOAL-MD5-001 as a cross-goal
      contamination finding in addition to invalidating the run under
      EXP-DIFFP-fe894e IR-1, and it is escalated immediately rather than at the
      end of the round.
    - >-
      Any finding under proves_too_much O3 that STRICT returns MEMBER for an
      E2-rotation image. That is an IR-5 breach and voids every strict verdict in
      the batch.

  composition_rule: >-
    The Coordinator composes the two reports into one evidence-review decision at
    TASK-20260824-b03556. The composition may not exceed either reviewer's own
    verdict on the joints it owns, may not treat an unowned or PARTIAL joint as
    holding, and inherits the claim ceiling `analyzed` unconditionally. A
    `support` or `reject_scoped` decision on this batch is not available: no
    replication exists, the instrument was validated only on a synthetic shadow
    census, and three of CLAUDE.md's four supported-promotion gates are
    structurally unmet by a batch of this kind. `weaken` and `inconclusive`
    remain available and so does an infrastructure finding.

  procedure_deviations:
    - id: PD-A
      what: >-
        The proves_too_much object list is EXTENDED beyond the two objects
        pre-fixed at batch opening (batch.yaml review_architecture item 4: the
        SHA-0 expansion, and a null draw from inside the linearized code). Added:
        O3, an E2-rotation image of a planted SHA-1 entry; and O4, a family-(c)
        null draw with in_linearized_code False.
      direction: ADDITION ONLY. Neither pre-fixed object is removed, weakened or substituted.
      why: >-
        Both pre-fixed objects have a known answer on ONE side only (MEMBER is
        false), so a NON-MEMBER verdict on them is consistent with an
        adjudicator that says NON-MEMBER to everything -- which is precisely the
        failure mode J5 suspects. O3 has a known answer on BOTH sides of the same
        comparison (strict must say NON-MEMBER, permissive must say MEMBER), so
        it cannot be passed by a degenerate adjudicator in either direction. O4
        converts a one-sided known-false object into a measurement of WHICH key
        component carried the verdict. This became visible only after reading the
        committed source, which did not exist when the opening list was fixed.
    - id: PD-B
      what: >-
        The blind re-derivation quantity is stated as the ORBIT-SIZE
        DISTRIBUTION over the planted set, derived from the generator STATEMENTS
        and a genericity assumption, rather than from the planted objects'
        word-level contents.
      direction: >-
        A NARROWING of the batch opening's intent ("the orbit count of the
        planted set under the verified generators, re-derived from the generator
        STATEMENTS and the planted seeds alone"), not a substitution.
      why: >-
        The opening assumed the planted seeds would suffice to reconstruct the
        planted objects independently. They do not: census.yaml records only
        (seed 84064101, index) per entry, and reconstructing the objects requires
        harness/diffpath/census.py and primitives.py -- both in blind_from. A
        re-derivation that had to read blind_from to obtain its inputs would not
        be blind. The quantity as narrowed is derivable from the statements alone
        and still bears on everything downstream. THE COST IS STATED: the
        re-derivation now tests the generator statements against the
        implementation, not the planted objects against their seeds.
    - id: PD-C
      what: >-
        TASK-20260824-873dc9's proposal set is archived but is NOT under review
        this round, except for the firewall property in J7.
      why: See scope_of_this_round. A named successor is recorded there.
    - id: PD-D
      what: >-
        This plan was written by a session with no shell, which could not run
        tools/check_review_independence.py, tools/validate_ledger.py or
        tools/research_dispatch.py against it, and did not claim to.
      consequence: >-
        The plan must be validated by the driving session before the reviewers
        are dispatched, together with the snapshot receipt's open gates G1-G6.
    - id: PD-E
      what: >-
        The reviewer budgets were NOT raised despite the plan exceeding what
        360 s each comfortably buys. A binding priority order and a PARTIAL
        reporting rule were written instead.
      why: See reviewer_priority_order.rationale.

