      round at bounded scale: no claimed breakthrough, no proposed goal closure,
      no contradiction between validated evidence records. Both reviewers'
      handoffs set degraded_allowed: false; a backend that cannot reach xhigh is
      a PAUSE, never a silent downgrade. Amazon Bedrock is prohibited in any
      runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).
