  joints:

    - joint: >-
        J1. THE REPORTED INTEGERS ARE WHAT THE COMMITTED CODE PRODUCES FROM THE
        DECLARED SEEDS. Every VERIFIED/EXCLUDED verdict, every control count and
        every census count in execution-report.yaml traces to a charged run's
        raw output, and the summary agrees with the raw.
      assigned_to: TASK-20260824-c40847
      attack_plan: >-
        COLD RE-RUN IN FRESH PROCESSES, then a full raw-versus-summary diff.
        (1) Re-run harness.diffpath.equivalence.run_all_checks(20260824) in a
        fresh process and require EXACT integer agreement with
        equivalence-declaration.yaml on E1 704/0, E2 2048/248 with the
        expansion/step-function split 2048-0 and 0-248, E3 128/0, E4 4368/0 with
        its three sub-counts, E5 256/0, E6 17/1. Report agreement as an integer
        fraction over the counts compared, not as a word.
        (2) START HERE, BECAUSE I HAVE ALREADY FOUND ONE DISAGREEMENT AND YOU
        SHOULD NOT HAVE TO SPEND BUDGET FINDING IT: execution-report.yaml gives
        the E6 step_range (0,0) condition-satisfying count as 2094 at lines 177,
        184 and 623; equivalence-declaration.yaml line 116,
        raw-observations.json line 873, and
        runs/RUN-DIFFP-fe894e-equivalence-verification/raw-result.json line 124
        all give 2089. Determine which value the code produces at seed 20260824,
        state whether the E6 EXCLUDED verdict changes (it should not -- both are
        non-vacuous and the exclusion rests on the (0,3) range being vacuous),
        and then answer the question that actually matters: IS THIS THE ONLY
        ONE? Recompute every integer in execution-report.yaml from
        raw-observations.json and the six raw-result.json files, mechanically,
        and report the count of agreements and the full list of disagreements.
        A single transcription slip is a defect; a pattern of them means the
        report is a retelling rather than a summary, and every unchecked number
        in it inherits that.
        (3) Re-run the controls at their declared seeds (84064101 for the
        planted set, 84064103/84064104/84064105 for the three null families,
        84064106 for CTL-OBS and CTL-NEARBY, 20260824 for the equivalence
        checks) and require exact agreement on 96/96, 0/1000 x3, 1024 distinct
        canonical forms over 1024 objects, 80 checks with 0 discrepancies,
        0/1000 and 1000/1000 for CTL-NEARBY.
        WHERE I THINK IT BREAKS: nowhere in the re-run, and in exactly one more
        place in the transcription. If the re-run itself disagrees, stop and
        escalate -- see escalation_triggers.
      breaking_artifact: >-
        A table of producer-integer versus re-derived-integer with at least one
        row differing in the RE-RUN (not merely in the report text), naming the
        seed and the function; or a list of two or more summary-versus-raw
        disagreements in execution-report.yaml.

    - joint: >-
        J2. THE RUN ARTIFACTS ARE COMPLETE, DECLARED, AND BIND THE SOURCE THAT
        ACTUALLY EXECUTED. Six runs, no undeclared run, every manifest
        schema-complete with code_path_fingerprint, an armed deadline and the
        LITERAL id EXP-DIFFP-fe894e; the seven declared seeds and no other
        source of randomness; and the module hashes recorded in the manifests
        match the modules in the tree.
      assigned_to: TASK-20260824-c40847
      attack_plan: >-
        THIS JOINT ALSO CLOSES A GAP THE SNAPSHOT RECEIPT LEFT OPEN, and that is
        why it is worth its budget rather than being a checklist. The receipt
        binds adjudicator.py but NOT the ten sibling modules and NOT the 42
        run-directory files; the producer's AN-5 records that the branch HEAD
        moved during execution (89520cb68 -> a64a74005 -> d63c90e04) and that
        reproducibility therefore rests on per-file content hashes rather than
        on the commit. VERIFY THAT CLAIM DIRECTLY: for every module named in
        each manifest's code_path_fingerprint, recompute the sha256 from the
        tree at the snapshot commit and compare. A fingerprint that does not
        match the tree means the reported integers were produced by code that is
        not the code under review, and nothing else in this round survives it.
        Then: (a) confirm exactly six run directories and that run-index.json
        lists exactly those six; (b) confirm each contains all seven declared
        files and that manifest.yaml carries the literal string
        EXP-DIFFP-fe894e; (c) confirm the armed-deadline record and that
        unspent ceilings are reported as unspent, not reallocated (total spent
        80.748 s against 960 s of ceilings); (d) confirm the two
        attempt-01-aborted files describe an attempt in which NO run directory
        was created and NO ceiling was spent, so ATTEMPT-01 cannot have
        contributed a discarded observation; (e) independently confirm AN-1 by
        ast.parse of harness/runner.py -- two module-level FunctionDefs named
        `_inference_block` at lines 183 and 695, the second binding -- and state
        whether the manifests' inference blocks are therefore stale for THIS
        package as the producer says; (f) confirm the disclosed sympy shim
        reports its version as ABSENT rather than a plausible number, and that
        the stub harness.semaev's verify_decomposition_certificate RAISES rather
        than returning a passing verification; (g) confirm the 34/0 test result
        reproduces and state whether it ran under pytest or under the disclosed
        in-file fallback runner, and whether that runner expands parametrised
        cases rather than silently skipping them.
        WHERE I THINK IT BREAKS: (g). A fallback test runner that miscounts is
        invisible in a "34 passed" line and would be the cheapest possible way
        for this package to look tested and not be.
      breaking_artifact: >-
        A module whose tree sha256 differs from its manifest code_path_fingerprint;
        an undeclared run directory or a seed not among the seven declared; a
        manifest missing a required field; or a demonstration that the fallback
        runner's 34 does not equal the number of test cases actually executed.

    - joint: >-
        J3. CTL-PLANT IS A CONTROL AND NOT A TAUTOLOGY. 96/96 recall means the
        adjudicator recalls planted paths and their verified-generator images
        because the canonicalisation is correct, not because the images and the
        canonical form are computed by the same functions.
      assigned_to: TASK-20260824-c40847
      attack_plan: >-
        THE WORKED ATTACK, AND MY PREDICTION OF WHERE IT LANDS.
        adjudicator.ctl_plant() builds its test cases with
        adjudicator.orbit_images(), which calls EQ.act_E3_negate,
        EQ.act_E6_reindex, EQ.act_E1_shift and EQ.act_E2_rotate.
        adjudicator.canonical() minimises serialize() over EQ.align_E1,
        EQ.act_E3_negate and EQ.act_E2_rotate -- THE SAME FUNCTIONS. So "the
        image of P under g canonicalises to the same key as P" may be an
        identity of the implementation rather than a property of the
        equivalence, and 96/96 would then be a function agreeing with itself.
        Do three things.
        (1) POSITIVE-CONTROL INDEPENDENCE. Take one MD5 planted entry and one
        SHA-1 planted entry (regenerate them from census.yaml's recorded
        path_data seed 84064101 and index). Construct the E3 image and one E1
        shift image FROM THE STATEMENTS in equivalence-declaration.yaml -- E3:
        negate every signed difference and swap the pair; E1: shift the
        expansion window by s steps at constant length -- WRITTEN BY YOU, not by
        calling EQ.act_*. Adjudicate those. If they come out MEMBER, the shared
        code is not currently hiding a defect. If they come out NON-MEMBER,
        96/96 was measuring code identity and the positive control is void.
        (2) THE CONTROL MUST BE ABLE TO FAIL. Mutate a single bit in one word of
        an image's step_delta and adjudicate. It MUST return NON-MEMBER. Then
        mutate a single bit of the message difference and repeat. A positive
        control that cannot be made to fail by a one-bit change is not measuring
        anything.
        (3) COVERAGE. Confirm from the artifacts that the 96 attempts are 16
        planted entries plus their images and that the per-class table (md5
        planted 8/8, md5 E3 image 8/8, sha1 planted 8/8, sha1 E3 image 8/8, sha1
        E1 image 64/64) accounts for all 96 with nothing double-counted. Note
        that 64 = 8 entries x 8 shifts and state explicitly whether E4 and E5 --
        both VERIFIED generators -- contribute ANY orbit image at all. If they
        contribute none, say so plainly: two of the four verified generators
        then do no work in the positive control, and the control tests a smaller
        group than the strict group it is nominally validating.
        WHERE I THINK IT BREAKS: (3). I predict E4 and E5 emit no orbit image,
        so CTL-PLANT exercises only E1 and E3, and the reported orbit sizes 2
        and 10 are the honest consequence of that.
      breaking_artifact: >-
        A from-statement generator image that adjudicates NON-MEMBER; or a
        one-bit mutation of an image that still adjudicates MEMBER; or a
        demonstration that the 96 attempts exercise a strict subset of the
        strict generator set, stated with which generators are unexercised.

    - joint: >-
        J4. THE MEASURED ZERO IS A MEASUREMENT. The empty readable census
        (readable = 0, and P-1's exact agreement with the frozen prediction) is
        the outcome of a scan that would have found data had data been there --
        not the outcome of a scan that failed silently. And the batch's declared
        criteria are complied with rather than merely mentioned: strict group
        exactly the verified subset, strict and permissive never merged, the
        three census counts never summed, claim ceiling `analyzed`, and the
        quarantine payload unchanged and unparsed.
      assigned_to: TASK-20260824-c40847
      attack_plan: >-
        A PREDICTION OF ZERO CONFIRMED BY A MEASUREMENT OF ZERO IS THE WEAKEST
        SHAPE OF EVIDENCE THERE IS, because a broken instrument produces it too.
        Break the symmetry with a POSITIVE CONTROL ON THE SCANNER, which is the
        one thing the producer did not run.
        (1) SEED THE SCANNER AND SEE IT FIRE. Write a synthetic file containing
        machine-readable path/condition data in the schema
        harness.diffpath.census.scan_corpus() looks for, place it under a
        directory inside the scanned roots BUT INSIDE YOUR OWN TASK DIRECTORY if
