        RECOMPUTES in_linearized_code, which the producer reports as 0/1000 --
        AND `in_linearized_code` IS A COMPONENT OF serialize() FOR sha1. If the
        planted SHA-1 entries carry in_linearized_code True, then all 1000
        family-(c) draws are excluded by ONE BOOLEAN before a single word of
        path content is compared. CHECK THAT AND SAY IT AS AN INTEGER: how many
        of the 3000 draws had any achievable probability of a false positive?
        Also state whether family (c)'s objects are even well-formed: the DV is
        overwritten AFTER step_delta was derived from the seeded pair, so the DV
        and the step_delta no longer correspond.
        PART B -- BUILD THE NULL THE CONTRACT DID NOT. Four decoy classes,
        cheap, each with a known answer:
        D1. E2-ROTATION IMAGES of planted SHA-1 entries (b = 1, 7, 16, 31).
        E2 is EXCLUDED, so STRICT must say NON-MEMBER; E2 is a DECLARED
        generator, so PERMISSIVE must say MEMBER. A two-sided known answer, and
        the sharpest single test in this batch: strict saying MEMBER breaks
        IR-5, permissive saying NON-MEMBER means the permissive canonicaliser
        does not implement its own declared generator.
        D2. E6-REINDEXED images of planted entries. Same two-sided structure.
        D3. NEAR NEIGHBOURS AT CONTROLLED DISTANCE. Take a planted entry's
        canonical key and flip 1, 2, 4, 8, 16 bits of the difference vector.
        All must be NON-MEMBER under exact-key matching -- and the point is not
        the verdict, it is that the reported closest_distance should now be 1,
        2, 4, 8, 16 rather than 711 or 2402. That is what a null with a tail
        looks like, and it lets you state how far from the boundary the
        contract's declared families actually sat.
        D4. E4 BOUNDARY. An object equal to a planted entry in every key
        component except signed_representation. Under strict (E4 verified,
        so signed_representation is dropped from the key) this must be MEMBER;
        with E4 removed it must be NON-MEMBER. Known answer both ways.
        PART C -- STATE THE CONCLUSION AS A DIRECTION. Given A and B, say
        whether 0/3000 is (i) evidence the adjudicator discriminates, (ii)
        evidence the decoys were never near the boundary, or (iii) both to
        stated degrees. Name what would settle it if you cannot.
        WHERE I THINK IT BREAKS: PART A, decisively, on family (c) and probably
        on family (a) too. And I think D1 comes out correct, which would be a
        genuine positive finding about the instrument that the contract's own
        null was too weak to produce.
        IR-8 BOUND: constructing decoys is in scope; SEARCHING the difference
        space for a new path is not, and no collision may be attempted.
      breaking_artifact: >-
        An integer count of how many of the 3000 declared draws had a nonzero
        achievable false-positive probability; plus the D1-D4 decoys with their
        strict and permissive verdicts as data, whichever way they came out --
        specifically, any decoy adjudicating MEMBER under strict, or any decoy
        that should be MEMBER under permissive and is not.

    - joint: >-
        J6. THE DECLARED EQUIVALENCE ERRS IN A KNOWN DIRECTION. Every covering
        number this goal ever computes inherits whether the canonical form is
        too COARSE (identifying genuinely distinct objects, so "new" is
        over-declared as "old") or too FINE (failing to identify equivalent
        objects, so "old" is over-declared as "new").
      assigned_to: TASK-20260824-3bd362
      attack_plan: >-
        THE PRODUCER HAS ALREADY HANDED YOU THE COARSE DIRECTION AND MEASURED
        IT; DO NOT SPEND BUDGET RE-ESTABLISHING IT. PD-5: the E5-normalised
        condition signature is reported beside every adjudication and is NOT in
        the membership key, because conditions are derived from the witness pair
        and are sufficient rather than necessary -- 9904 of 19999 seeded
        single-step MD5 pairs with identical (delta_m, step_delta) carried
        DIFFERENT condition sets at seed 999. The consequence the producer
        states: the canonical form is coarser than "path plus conditions".
        DO THIS INSTEAD.
        (1) MAKE THE COARSENESS CONCRETE AND BOUND IT. Exhibit two objects with
        identical (primitive, length, message_difference, step_delta) and
        materially different sufficient-condition sets, adjudicate them, and
        show they are identified. Then answer the question PD-5 leaves open:
        does that identification make the NON-MEMBER verdict weaker than "this
        path is new"? Reason it out. A NON-MEMBER verdict says the candidate's
        key is absent from the index; coarsening the key can only make MEMBER
        MORE likely, so coarseness cannot manufacture a false NON-MEMBER --
        state whether you agree, and if you do, say plainly that PD-5 threatens
        the MEMBER verdict's precision and not the NON-MEMBER verdict's
        soundness. If you disagree, that is a finding and I want the
        construction.
        (2) THE FINE DIRECTION, WHICH IS UNMEASURED. E2 and E6 are EXCLUDED, so
        block_index and the rotation index remain in the strict key: the same
        per-block characteristic at two block indices is TWO objects, and a
        rotated DV is a different object. The producer calls this "the safe
        direction". Test whether it is: exhibit a pair the group SHOULD identify
