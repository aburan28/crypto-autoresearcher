        (3) CHECK THE E1 INTERPRETATION IS NOT LOAD-BEARING IN A HIDDEN WAY.
        The producer records a DECLARED INTERPRETATION: E1 shifts the window
        offset at CONSTANT LENGTH, and a different step_range length is a
        declared_non_generator. Note that adjudicator.hamming_distance() returns
        None for vectors of different lengths, so closest_distance NEVER crosses
        lengths and objects of different extents are not "far apart", they are
        incomparable. Say whether any reported distance in this batch could have
