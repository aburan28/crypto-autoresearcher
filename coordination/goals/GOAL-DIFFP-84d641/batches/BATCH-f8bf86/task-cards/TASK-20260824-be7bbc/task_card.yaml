  uncertainty_to_reduce: >-
    Whether the artifacts the two reviewers will attack are the exact bytes the
    producers wrote, fixed and reachable, rather than a working tree that can
    still move under them.
  job: >-
    Snapshot-archive the exact batch-1 producer package -- the opening control
    plane (goal, question, contract, batch record, queue, cards, handoffs), the
    idea-generator proposal set, and the adjudicator implementation with its
    runs, census, equivalence declaration and control results -- under a
    content_first binding, with pre-freeze checks, before either independent
    review runs. Then push the branch and open or refresh the PR against main.
  hard_rules:
    - >-
      RUNS ALONE. No other task may be running concurrently, and NO REVIEW MAY
      START before this commit exists and is verified.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an
      evidence-integrity failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE. Rebasing rewrites the commits run records
      were archived in. Record the base commit checked and the merge outcome in
      the receipt. A SYNC CONFLICT INSIDE AN IMMUTABLE RECORD IS NEVER RESOLVED
      BY PICKING A SIDE: it is a new superseding record under a new id.
    - >-
      Re-confirm the GOAL-MD5-001 quarantine payload's sha256
      (e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) FROM ITS
      BYTES without parsing it, and record the comparison.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This
      task archives; it does not review.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output.
      Never record a command that was not executed.
  required_pre_freeze_checks:
    - origin/main fetched and merged into the working branch, base commit recorded
    - tools/validate_ledger.py run on the merged tree, output recorded verbatim
    - tools/research_dispatch.py run against this batch's queue, output recorded verbatim
    - GOAL-MD5-001 quarantine payload sha256 re-confirmed from bytes, comparison recorded
    - no dirty-tree drift outside the declared paths
  required_disclosures_in_staged_not_in_binding_set:
    - >-
