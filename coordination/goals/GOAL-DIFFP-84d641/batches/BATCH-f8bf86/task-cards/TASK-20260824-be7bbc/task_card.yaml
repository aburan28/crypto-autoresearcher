  note: >-
    After the commit, push the branch and refresh PR #530 (branch
    claude/differential-cryptanalysis-harness-5b5fdq, opened by the driving
    session on 2026-08-24), NAMING GOAL-DIFFP-84d641, RQ-DIFFP-a5c483,
    EXP-DIFFP-fe894e, DEC-20260824-4f74cd, AMD-20260824-DIFFP-ACQ-1,
    BATCH-f8bf86 and every TASK-20260824-* record. A record that exists only in a
    local commit is UNPUBLISHED and downstream review must not treat it as
    durable evidence (agents/coordinator.md, "Branch and PR discipline").
    THE OPENING DECISION IS FILED (DEC-20260824-4f74cd), so the earlier "refuse to
    dispatch reviews against an unapproved contract" condition is discharged.
    MEASURE AND RECORD THE COMMIT SHA: the goal head's latest_verified_commit is
