      harness/diffpath/adjudicator.py.
    - >-
      Every run directory under the producer task paths.
  note: >-
    After the commit, push the branch and open or refresh the PR against main
    NAMING GOAL-DIFFP-84d641, RQ-DIFFP-a5c483, EXP-DIFFP-fe894e, BATCH-f8bf86,
    the minted opening DEC id and every TASK-20260824-* record. A record that
    exists only in a local commit is UNPUBLISHED and downstream review must not
    treat it as durable evidence (agents/coordinator.md, "Branch and PR
    discipline").
    If the opening coordinator_decision has still not been minted and filed by
    the time this task runs, SAY SO IN THE RECEIPT and do not proceed to
    dispatch the reviews: an unapproved contract cannot carry a claim-changing
    review round.
