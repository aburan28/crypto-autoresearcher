  dispatch_gate: >-
    THIS TASK MAY NOT BE DISPATCHED UNTIL THE REVIEW PLAN FOR
    TASK-20260824-c6625a IS COMMITTED. That plan is written by a SEPARATE
    coordinator handoff after the snapshot archive TASK-20260824-be7bbc lands and
    BEFORE any reviewer runs (AGENTS.md, "Review architecture"). The plan assigns
    this task's joints and is AUTHORITATIVE over the scope sketch below; a
    difference between the two is recorded in the plan's procedure_deviations.
  uncertainty_to_reduce: >-
    Whether the reported integers are what the committed code actually produces
    from the declared seeds, and whether the two controls are CAPABLE OF FAILING
    at all -- which is the only thing that makes their passing mean anything.
  job: >-
    Verify the integrity of the adjudicator package against its frozen contract,
    not its interestingness. Coordinator's intent at opening, superseded by the
    committed plan if they differ:
    V-a COLD RE-RUN of the deterministic checks from the seven declared seeds, in
    FRESH PROCESSES, to EXACT INTEGER agreement with the producer's reported
    counts; report the agreement as an integer fraction.
    V-b RUN-ARTIFACT, SEED AND MANIFEST INTEGRITY: code_path_fingerprint present,
    armed deadline present, the LITERAL experiment id `EXP-DIFFP-fe894e` in every
    manifest, seeds exactly the seven declared, no undeclared run, module sha256s
    matching the snapshot receipt.
    V-c CRITERION COMPLIANCE: every generator's VERIFIED/EXCLUDED verdict
    traceable to its own check's integer counts; the strict group EXACTLY the
    verified subset; strict and permissive verdicts reported separately and never
    merged; the three census counts separated and never summed.
    V-d THE CONTROLS ARE NON-VACUOUS: confirm FROM THE ARTIFACTS that CTL-NULL
    ran against a census containing entries a draw could have matched, and that
    CTL-PLANT covered every planted path AND every verified-generator image. This
    is the joint that matters most: a vacuous control reported as a pass is worse
    than no control.
    V-e SCOPE: no search over the difference space was run; no quarantined read
    occurred and the payload sha256 is unchanged; no cost projection appears; the
    claim ceiling `analyzed` is respected throughout; and no NON-MEMBER verdict is
    written or implied as novelty anywhere in the package.
  hard_rules:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362,
      and declare in your attestation EXACTLY what you read.
    - >-
      Re-runs write into THIS TASK'S OWN DIRECTORY ONLY. The archived run
      directories are immutable.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest
      non-reading.
    - >-
      REPORT ON THE JOINTS YOU OWN. Do not compose a whole-claim verdict: you
      cannot see the other joints by construction, so a whole-claim verdict from
      you would be an opinion formed from a fraction of the evidence. The
      Coordinator composes.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not
      a finding against the producer. Report it as such and say what remained
      unverified.
    - >-
      Record requested policy, resolved model identifier, backend, probe status
      and reasoning effort in your report. A tier the backend cannot reach is a
      PAUSE, never a silent downgrade. Never Amazon Bedrock (AGENTS.md rule 16).
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs.
  required_report_blocks:
    - joint-by-joint findings with verdict holds | breaks | inconclusive
    - every re-derived integer shown beside the producer's, with the exact-agreement fraction
    - an explicit confirmation or denial of each control's non-vacuity, from the artifacts
    - >-
      review_attestation with task_id, joints_owned, sources_read (honestly and
      completely), read_sibling_reports false, and verdict
    - the quarantine non-reading attestation and the payload sha256 comparison
    - requested policy, resolved model identifier, backend and probe status
  note: >-
    The Coordinator's PRIOR is recorded at opening in
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml under
