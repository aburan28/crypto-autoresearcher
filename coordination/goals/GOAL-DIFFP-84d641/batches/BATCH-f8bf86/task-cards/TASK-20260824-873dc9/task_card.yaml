task_card:
  id: TASK-20260824-873dc9
  title: >-
    RANK 2: Idea Generator -- object-first proposal set for where NEW
    differential paths could live (MD5 delta-m families beyond the published
    lineage, SHA-1 disturbance-vector classes outside the published families,
    reachable step-reduced targets), each with a minimal discriminating test, a
    falsification criterion, and Pareto dominated_by / sota_delta
  batch_id: BATCH-f8bf86
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  rank: 2
  role: idea-generator
  policy: research-deep
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260824-531f8a
  archived_by: TASK-20260824-be7bbc
  handoff: ledger/handoffs/TASK-20260824-873dc9.yaml
  review_required: false
  state: queued
  budget:
    wall_clock_seconds: 480
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    maximum_runs is 1 because the queue schema rejects 0. THIS TASK PERFORMS NO
    EXPERIMENT RUNS; the 1 is a ceiling, not a plan. This role has no
    run_commands capability under orchestration/roles.yaml.
  uncertainty_to_reduce: >-
    Whether a defensible, budget-feasible search target exists at all once the
    published families are declared off-limits as the primary lens -- and, if it
    does, which single proposal has the cheapest discriminating test, so a later
    batch can be specified by measurement rather than by taste.
  job: >-
    Generate an object-first proposal set for where NEW MD5 and SHA-1
    differential paths could live. Three axes: (1) candidate delta-m families for
    MD5 outside the published lineage, screened on condition count and surviving
    degrees of freedom rather than on plausibility; (2) disturbance-vector
    classes for SHA-1 outside the published families, exploiting that the DV
    lives in a LINEAR code and therefore admits enumeration and covering
    arguments the MD5 side does not; (3) step-reduced targets for either
    primitive that are genuinely reachable inside this campaign's remaining
    budget, meaning a claimed path could be driven to a literal conforming pair
    and certified rather than argued. Separately produce the acquisition-target
    list naming the primary sources a batch-2 acquisition task must obtain for
    the census to become populatable at all -- which, on this repository's
    contents, is the binding constraint on the whole goal.
  hard_rules:
    - >-
      OBJECT-FIRST, AND THE PUBLISHED FAMILIES ARE OFF-LIMITS AS THE PRIMARY
      LENS. Name them, declare them off-limits, and score every candidate on
      whether it is genuinely new rather than a repackaging arriving in new
      notation (docs/inventor-protocol.md section 1).
    - >-
      APPLY THE LOSSY-PROJECTION TEST to every proposed tracked object BEFORE
      proposing an experiment for it. A projection that loses nothing is a change
      of coordinates, not a new object. It costs no compute and it is the
      cheapest available answer to "is this actually new".
    - >-
      EVERY PROPOSAL CARRIES: a minimal discriminating test runnable inside
      300 s; an explicit falsification criterion; `dominated_by`, settable to
      null ONLY after checking every row of the frontier across time, memory and
      data (an unchecked null is a fabrication under AGENTS.md rule 5); and a
      QUANTITATIVE `sota_delta` -- "faster" is not a value.
    - >-
      EVERY PROPOSAL CARRIES a proof_search_map or an explicit
      not_applicable_reason (KN-TECH-080). Nulling the whole map without a reason
      is incomplete work.
    - >-
      NOVELTY IS `unverified` BY DEFAULT AND THAT IS THE HONEST ANSWER. A
      `recalled` reference may never support novelty_status `known` or
      `adaptation`. Mark what you actually opened `retrieved` and what you did
      not `recalled`.
    - >-
      NOTHING YOU PRODUCE ENTERS THE CENSUS. The census is
      TASK-20260824-c6625a's and is built only from committed repository
      sources. Your web reads feed the ACQUISITION-TARGET LIST, not the census.
    - >-
      BCP-1 QUARANTINES CONTENT, NOT A FILE PATH, AND THEREFORE COVERS THE
      NETWORK. READ THIS BEFORE YOU FETCH ANYTHING. You are the ONLY batch-1 task
      holding web_search; network acquisition IS reachable here (the driving
      session measured HTTP 200 for eprint.iacr.org/2004/199, shattered.io and
      raw.githubusercontent.com/cr-marcstevens/hashclash); and fetching eprint
      2004/199 would hand you the Wang MD5 characteristic exactly as completely
      as opening the quarantined file, contaminating GOAL-MD5-001's
      blind-rediscovery criterion identically while your receipt read as ordinary
      acquisition. TIER A (Wang characteristic, eprint 2004/199, any mirror or
      derivative of its path data): DO NOT FETCH, any route, no exception. TIER B
      (any other published MD5 characteristic with real path or condition data --
      Stevens single-block and chosen-prefix tables, tunnels, hashclash published
      paths): DO NOT FETCH; BLOCKED PENDING A GOAL-MD5-001 DECISION, which is a
      routing decision and NOT a closure. TIER C (SHA-1 and SHA-0
      disturbance-vector and specification sources, covered by no firewall in
      this program): FETCHING PERMITTED for target-list purposes; bibliographic
      metadata for Tier A and Tier B is permitted with NO path data retained.
      Full text: AMD-20260824-DIFFP-ACQ-1, authorised by DEC-20260824-4f74cd.
    - >-
      ATTEST PER FETCH, NOT PER SESSION, which side of the firewall it landed on:
      URL, tier, what was retained, and an explicit no-Tier-A-content statement.
      A fetch without its tier attestation is an invalid acquisition record.
    - >-
      EVERY ENTRY IN acquisition-targets.yaml CARRIES A TIER LABEL (A / B / C).
      Tier-B entries also carry status `blocked_pending_cross_goal_decision` and
      the named unblocking route. An untiered entry is an incomplete entry.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest
      non-reading.
    - >-
      DO NOT PROPOSE ANOTHER GOAL'S WORK: no chosen-prefix cost model and no
      detector-evasion object (GOAL-SHA1-001); no blind-rediscovery calibration
      and no MITM preimage ceiling work (GOAL-MD5-001); no full-primitive
      collision attempt.
    - >-
      DO NOT DECLINE TO GENERATE ON SATURATION GROUNDS. "This space is mined" is
      a hypothesis about the search, and premature closure is a failure mode
      symmetric with overclaiming. A lane you conclude is dead needs a named
      obstruction, an argument and forward guidance; a count of
      screened-and-rejected candidates is a fatigue report whose honest status is
      `unverified`.
    - >-
      Attempt search_knowledge before any assertion about what has or has not
      been tried, and record the queries and outcomes verbatim. THE INDEX IS
      DERIVED AND MAY BE EMPTY: if it answers nothing that is a fact about the
      index and licenses no inference.
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs;
      every citation carries provenance (AGENTS.md rules 9-10). Never Amazon
      Bedrock in any runtime, backend, endpoint, fallback or probe (rule 16).
  amended_by:
    - id: AMD-20260824-DIFFP-ACQ-1
      version: 1
      obligation: OB-3
      authorised_by: DEC-20260824-4f74cd
      recorded_at: '2026-08-24'
      direction: >-
        RESTRICTION-ONLY, recorded BEFORE dispatch and BEFORE any observation.
        Adds the three firewall-tier constraints, the per-fetch attestation
        obligation and the mandatory tier label. Budget, deliverables set,
        objective, uncertainty_to_reduce and claim ceiling UNCHANGED.
  note: >-
    review_required is FALSE because a proposal changes no claim and moves no
    status; the Coordinator ranks it and nothing downstream may cite it as
    evidence.
    NO LEDGER IDEA-* RECORD IS FILED BY THIS TASK. No IDEA identifier was
    pre-allocated, this role cannot run tools/allocate_id.py (no run_commands
    capability), and inventing an id would collide by construction. The proposal
    set is a task-directory deliverable; minting IDEA-* ids for the proposals the
    Coordinator ranks is deferred to a later coordinator task with real ids.
    CONTEXT YOU SHOULD HAVE BEFORE STARTING, from the Coordinator's opening
    survey and recorded as a survey result rather than as a literature fact: this
    repository holds exactly ONE MD5 collision-path source (KN-LIT-87e00e) whose
    entry deliberately carries no path data and points at a quarantined payload
    this goal may not open, and NO SHA-1 entry carrying disturbance-vector data.
    A proposal whose discriminating test silently assumes the census is populated
    is not yet feasible, and saying so is more useful than working around it.
