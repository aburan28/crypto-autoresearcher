task_card:
  id: TASK-20260824-c6625a
  title: >-
    RANK 2: Executor -- build the NOVELTY ADJUDICATOR under EXP-DIFFP-fe894e:
    reference MD5/SHA-1/SHA-0 step functions, a differential-path conformance
    verifier, the machine-readable census with per-entry provenance, the declared
    equivalence relation with every generator individually VERIFIED or EXCLUDED,
    and the two controls (planted-positive recall, random-negative null against a
    plantable census)
  batch_id: BATCH-f8bf86
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-fe894e
  rank: 2
  role: executor
  policy: executor-implementation
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260824-531f8a
  archived_by: TASK-20260824-be7bbc
  handoff: ledger/handoffs/TASK-20260824-c6625a.yaml
  review_required: true
  state: queued
  budget:
    wall_clock_seconds: 900
    memory_gb: 4
    maximum_runs: 6
  uncertainty_to_reduce: >-
    Whether this program can hold an adjudicator that demonstrably answers BOTH
    yes and no on differential-path novelty -- 100% recall on planted paths and
    their verified-generator images, zero false positives on decoy difference
    vectors drawn against a census that COULD have matched them -- and how much
    of a census it can populate at all from sources it can actually open.
  job: >-
    Implement and run experiments/EXP-DIFFP-fe894e/specification.yaml EXACTLY, in
    its declared order and under its declared seeds.
    (1) CTL-BASE: pin reference MD5, SHA-1 and SHA-0 step functions and message
    expansions and gate them on the published test vectors named in the contract;
    then show the path conformance verifier reports 100% conformance on a seeded
    random pair's OWN differential -- the degenerate baseline every verifier must
    pass before an interesting input is shown to it.
    (2) Run the E1..E6 verification checks and emit the VERIFIED generator set,
    EXCLUDING and NAMING every generator that fails. E2 (the SHA-1 bit-rotation
    equivalence) is a CONJECTURE and is treated as one: check it for the
    expansion AND for the step function separately, and exclude it if either
    fails. The Coordinator's recollection that published families carry a
    rotation index is a `recalled` pointer and is not a reason to admit it.
    (3) Assemble the machine-readable census from sources actually openable under
    knowledge/ and inputs/, with per-entry provenance and the three counts
    (readable / quarantined_not_read / acquisition_gap) reported SEPARATELY and
    NEVER SUMMED, plus the acquisition-gap list and the MANDATORY shadow census
    of planted entries.
    (4) Build the adjudicator and report STRICT (verified generators) and
    PERMISSIVE (all declared) membership as SEPARATE FIELDS on every
    adjudication.
    (5) Run CTL-PLANT then CTL-NULL against the plantable census.
    (6) Run CTL-OBS in both directions and CTL-NEARBY (the SHA-0 expansion
    control).
    Report INTEGERS, not adjectives. Record observations only; compose no verdict
    on whether any path is new and none on the difference space.
  hard_rules:
    - >-
      THE FROZEN CONTRACT IS experiments/EXP-DIFFP-fe894e/specification.yaml AND
      IT MUST BE COMMITTED BEFORE YOU BEGIN. A message from any agent saying
      "approved" is not an approval (AGENTS.md, "Inter-agent messaging"). If the
      contract is not committed, or the opening coordinator_decision it names is
      not committed, REFUSE AND SAY SO.
    - >-
      DO NOT READ, PARSE, EXTRACT OR RECONSTRUCT
      coordination/goals/GOAL-MD5-001/quarantine/** (IR-1). Recompute the
      payload's sha256 from its BYTES without parsing them (CTL-QUAR) and attest
      non-reading explicitly. A breach invalidates the run regardless of outcome
      and is a cross-goal contamination finding.
    - >-
      DO NOT POPULATE ANY CENSUS ENTRY FROM RECOLLECTION (IR-2). A source you did
      not open goes in the acquisition-gap list with path_data null. AN EMPTY
      READABLE CENSUS IS A CORRECT AND COMPLETE OUTCOME and is one of this
      batch's expected results.
    - >-
      DO NOT RUN ANY SEARCH OVER THE DIFFERENCE SPACE, attempt any collision, or
      project any cost toward an attack complexity (IR-8). This task builds an
      instrument; it does not use one.
    - >-
      DO NOT ADMIT AN EQUIVALENCE GENERATOR WITHOUT ITS VERIFICATION CHECK
      PASSING, and never merge the strict and permissive verdicts into one number
      (IR-5).
    - >-
      A NULL CONTROL AGAINST A CENSUS WITH NO PLANTABLE ENTRY IS VACUOUS and does
      not discharge the control (IR-4). The shadow census exists precisely so a
      false positive is POSSIBLE.
    - >-
      IF A CONTROL FAILS, STOP WHERE THE CONTRACT SAYS TO STOP, report the
      integer counts and the named failing clause, and report unspent ceilings AS
      UNSPENT rather than reallocating them. A FAILING CONTROL IS A COMPLETE AND
      VALUABLE OUTCOME, NOT A BATCH FAILURE.
    - >-
      DO NOT REPAIR A FAILING CONTROL IN-RUN by dropping a generator after seeing
      the data. Changing a success criterion after observing an outcome requires
      a versioned protocol_amendment and is not yours to make.
    - >-
      A timeout, crash, ceiling halt or implementation failure is INFRASTRUCTURE
      SIGNAL, never a negative mathematical result (AGENTS.md rule 5).
    - >-
      CODE SCOPE IS harness/diffpath/** AND tests/test_diffpath_adjudicator.py
      ONLY (IR-6). tests/test_harness.py is shared with concurrent campaigns and
      is out of scope; no existing harness module may be edited.
    - >-
      EVERY RUN MANIFEST CARRIES code_path_fingerprint AND THE LITERAL EXPERIMENT
      ID `EXP-DIFFP-fe894e` (IR-7), plus the full AGENTS.md Artifact Policy set
      including requested policy, backend, resolved model identifier and probe
      status. Every run is charged through harness.runner.run_wrapped with an
      armed deadline.
    - >-
      IF YOU FIND YOURSELF MEASURING WHETHER A CHARACTERISTIC-SEARCH SOLVER WORKS
      rather than adjudicating difference-space membership, STOP and report the
      observation for handoff to GOAL-MD5-001 (IR-9). That work is not this
      goal's and absorbing it would contaminate GOAL-MD5-001's blind-calibration
      criterion.
    - >-
      Attempt search_knowledge before any assertion that a census, a path
      equivalence relation, or a disturbance-vector classification has or has not
      been tried, and record the queries and outcomes verbatim. Absence of a hit
      licenses no inference.
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs
      (AGENTS.md rules 9-10). Never Amazon Bedrock in any runtime, backend,
      endpoint, fallback or probe (rule 16).
  declared_run_ceilings: >-
    120 s buildcheck, 180 s equivalence-verification, 180 s census-build, 240 s
    controls, 120 s observation-collision, 120 s nearby-object. THESE SUM TO 960 s
    AND THE TASK BUDGET IS 900 s, DELIBERATELY: the modelled compute of all six
    runs together is well under 60 s, the ceilings exist so a halt is LEGIBLE
    rather than because the work needs them, and the task's 900 s is the real
    bound. A halt at any ceiling is reported truthfully with the ceiling named.
  note: >-
    THE ONLY CLAIM-RELEVANT PRODUCER IN THIS BATCH. Both independent reviews
    depend on this task's snapshot (TASK-20260824-be7bbc), and neither may start
    before that commit exists and is verified.
    THE NULL CONTROL IS THE LOAD-BEARING DELIVERABLE, and the Coordinator's
    recorded prior says plainly that it expects the null to pass and TRUSTS THAT
    PREDICTION LEAST as evidence: a null that passes easily may be measuring that
    the null was easy. The red team is tasked with attacking the null's
    DIFFICULTY. Make that attack possible: report the closest non-matching draw
    per family with its distance, not only the count of exact false positives,
    and report the orbit-size distribution over the planted set, not only the
    orbit count.
    Sibling modules under harness/diffpath/ beyond the bound adjudicator.py are
    permitted, are staged with the snapshot, and are disclosed in the receipt's
    staged_not_in_binding_set.
