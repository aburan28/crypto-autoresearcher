  dispatch_gate: >-
    THIS TASK MAY NOT BE DISPATCHED UNTIL THE REVIEW PLAN FOR
    TASK-20260824-c6625a IS COMMITTED. That plan assigns this task's joints, its
    proves-too-much objects, and any blind re-derivation with its blind_from
    list, and is AUTHORITATIVE over the scope sketch below.
  uncertainty_to_reduce: >-
    Whether a passing control set means the adjudicator is SHARP or only that it
    was never asked a hard question -- and whether the declared equivalence errs
    toward OVER-declaring novelty or UNDER-declaring it, which is the direction
    every later covering number in this goal will inherit.
  job: >-
    Try to falsify the interpretation and the scope of the adjudicator package,
    not its arithmetic (the Validator owns the arithmetic). Coordinator's intent
    at opening, superseded by the committed plan if they differ:
    R-a ATTACK THE NULL'S DIFFICULTY, NOT ITS OUTCOME. Construct decoy difference
    vectors STRICTLY HARDER than the contract's declared families -- near
    neighbours of census entries under the declared distance, and objects exactly
    one generator-step OUTSIDE the verified group -- and show whether the
    adjudicator still says NO. The Coordinator has recorded in advance that it
    expects the null to pass and trusts that prediction least as evidence; the
    useful work here is on the null's difficulty.
    R-b ATTACK THE DECLARED EQUIVALENCE. Find two genuinely distinct objects the
    canonicaliser identifies (TOO COARSE, so "new" is over-declared as "old"), or
    a pair the group should identify and does not (TOO FINE, so "old" is
    over-declared as "new"). State which of the two errors the batch's numbers are
    exposed to, and say so as a direction, not as a hedge.
    R-c PROVES-TOO-MUCH. Run the identical membership argument against objects
    for which MEMBER is KNOWN FALSE and show it fails there. The Coordinator's
    intended objects, named at opening: the SHA-0 message expansion (a DV space
    the adjudicator must NOT accept as SHA-1), and a null draw from INSIDE the
    linearized code.
    R-d SCOPE AND INTERPRETATION. Check that every reported verdict is scoped to
    the census that produced it; that no NON-MEMBER verdict is written or implied
    as novelty anywhere in the package; that the acquisition gap is not quietly
    absorbed into a covering claim; and that nothing has drifted into work owned
    by GOAL-MD5-001 (solver validation, blind rediscovery) or GOAL-SHA1-001 (cost
    model, detector coverage).
  hard_rules:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847,
      and declare in your attestation EXACTLY what you read.
    - >-
      IF THE PLAN ASSIGNS YOU A BLIND RE-DERIVATION, do not read any path in its
      blind_from before your re-derivation is written, and set
      blind_from_respected explicitly. The Coordinator's intended quantity is the
      ORBIT COUNT OF THE PLANTED SET under the verified generators, re-derived
      from the generator STATEMENTS and the planted seeds alone, with
      harness/diffpath/** and the producer's execution report in blind_from.
      Recomputing from the producer's implementation is replication, not
      re-derivation, and cannot catch an implementation that is wrong and
      self-consistent.
    - >-
      WRITE ONLY INTO THIS TASK'S OWN DIRECTORY. The archived artifacts are
      immutable.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest
      non-reading.
    - >-
      DO NOT RUN A SEARCH FOR A NEW DIFFERENTIAL PATH and do not attempt a
      collision. Constructing hard decoys for the null is in scope; searching the
      difference space is not (EXP-DIFFP-fe894e IR-8).
    - >-
      REPORT ON THE JOINTS YOU OWN. Do not compose a whole-claim verdict; the
      Coordinator composes.
    - >-
      AN OBJECTION MUST NAME WHAT WOULD SETTLE IT. "This is unconvincing" is not
      a finding; "this decoy at these parameters adjudicates MEMBER, and here it
      is" is.
    - >-
      Record requested policy, resolved model identifier, backend, probe status
      and reasoning effort. A tier the backend cannot reach is a PAUSE, never a
      silent downgrade. Never Amazon Bedrock (AGENTS.md rule 16).
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs;
      every citation carries provenance.
  required_report_blocks:
    - joint-by-joint findings with verdict holds | breaks | inconclusive
    - the constructed hard decoys and their adjudication outcomes, as data, whichever way they came out
    - the proves-too-much outcomes against the plan's named known-false objects
    - the blind re-derivation and its blind_from_respected flag, if assigned
    - >-
      an explicit statement of whether the declared equivalence errs toward over-
      or under-declaring novelty, with its evidence
    - >-
      review_attestation with task_id, joints_owned, sources_read,
      read_sibling_reports false, blind_from_respected, and verdict
    - the quarantine non-reading attestation
    - requested policy, resolved model identifier, backend and probe status
  note: >-
    The Coordinator's PRIOR is recorded at opening in
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml under
    `coordinator_prior_recorded_at_opening`, including P-3's explicit statement
    that the Coordinator expects both controls to pass and trusts that prediction
    least as evidence, and P-2's uncertainty about generator E2. READ IT AND SAY
    WHERE YOUR FINDINGS DEPART FROM IT. A prior the review overturns is among the
    most valuable results this program can produce, and it is only legible if you
    name the departure.
