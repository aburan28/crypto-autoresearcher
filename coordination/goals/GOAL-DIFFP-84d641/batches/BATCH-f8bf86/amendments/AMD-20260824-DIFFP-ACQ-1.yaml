protocol_amendment:
  id: AMD-20260824-DIFFP-ACQ-1
  version: 1
  title: >-
    Acquisition scope for GOAL-DIFFP-84d641 under GOAL-MD5-001's BCP-1 firewall:
    the firewall covers CONTENT, not a file path, and therefore covers the
    network
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  authorised_by: DEC-20260824-4f74cd (amendment_at_filing)
  recorded_at: '2026-08-24'
  owner: coordinator
  status: in_force

  prospective:
    is_prospective: true
    checkable_because: >-
      No producer task of BATCH-f8bf86 has been dispatched, no run manifest
      exists under EXP-DIFFP-fe894e, and no observation has been made. Written
      BEFORE acquisition, which is the only condition under which a scope
      restriction is not criterion-tuning.
    direction: >-
      RESTRICTION-ONLY. Every clause below forbids more than the committed
      records did; none relaxes anything, none changes a success criterion,
      control, seed, metric, budget or stopping rule, and none raises a claim
      ceiling. A restriction added before any observation cannot be an outcome-
      driven amendment.

  trigger:
    reported_by: >-
      Driving session, 2026-08-24, in-session message to the Coordinator
      subagent.
    measurement: >-
      NETWORK ACQUISITION IS REACHABLE FROM THIS ENVIRONMENT: HTTP 200 measured
      for eprint.iacr.org/2004/199, shattered.io, and
      raw.githubusercontent.com/cr-marcstevens/hashclash.
    attribution_note: >-
      THIS COORDINATOR DID NOT RUN THOSE PROBES AND DOES NOT CLAIM TO HAVE. The
      measurement is the driving session's and is cited as such. Any record
      relying on reachability cites this attribution rather than restating the
      result as this goal's own observation (AGENTS.md rule 9 discipline applied
      to an environment measurement, not only to a citation).
    defect_found: >-
      The committed opening records state the firewall constraint as a PATH
      restriction ("do not read
      coordination/goals/GOAL-MD5-001/quarantine/**"). On its face that does not
      stop an agent from fetching the identical content by URL. The gap was found
      by the driving session, not by the Coordinator that wrote it, and is
      recorded as a Coordinator process finding rather than absorbed.

  principle:
    name: content_not_path
    statement: >-
      BCP-1 QUARANTINES CONTENT, NOT A FILE PATH. The Wang et al. MD5 differential
      characteristic is quarantined so that GOAL-MD5-001's blind-rediscovery
      criterion stays falsifiable. Obtaining that characteristic by fetching
      eprint 2004/199, by reading a mirror, by pulling a repository that embeds
      the path table, by reading a paper that reproduces it, or by any other
      route, contaminates that criterion EXACTLY as completely as opening the
      quarantined file -- and does so while looking like ordinary acquisition in
      a receipt, which is what makes it dangerous rather than merely wrong.
    consequence: >-
      Every constraint in this goal's records that names the quarantine PATH is
      to be read as naming the quarantine CONTENT, by every route, including the
      network, a package index, a model's own memory reproduced into a file, and
      any future retrieval index. Where an existing committed record states only
      the path, THIS AMENDMENT IS THE BINDING READING; the committed record is
      not edited to say otherwise, it is superseded on this point by reference.

  tiers:
    - tier: A
      label: HARD REFUSAL -- no route, no exception, no batch may authorise it
      covers: >-
        The Wang-Feng-Lai-Yu MD5 differential characteristic (KN-LIT-87e00e,
        IACR ePrint 2004/199) and ANY mirror, republication, restatement,
        translation, derivative table, or third-party reproduction of that path,
        its message-difference vector, its per-step differences, its sufficient
        conditions, or its colliding message blocks. Named explicitly:
        eprint.iacr.org/2004/199 and any URL, archive, repository, dataset or
        document that reproduces its path data.
      rule: >-
        NOT ACQUIRED, NOT FETCHED, NOT PARSED, NOT RECONSTRUCTED, NOT PARAPHRASED
        INTO A RECORD, by any task of GOAL-DIFFP-84d641, by any route. Permitted
        and required: hashing the quarantined file's BYTES without parsing them
        (EXP-DIFFP-fe894e CTL-QUAR), and carrying the entry in the census as a
        pointer with `path_data: null`, its sha256, its KN-LIT id, and an
        UNDETERMINED orbit.
      basis: >-
        This is BCP-1's content. Acquiring it from this goal would launder
        another goal's firewall while leaving the firewall's text intact, which
        is worse than the firewall not existing.
      escalation: >-
        NONE AVAILABLE TO THIS GOAL. A change here is GOAL-MD5-001's decision to
        make, in its own committed record, not this goal's.

    - tier: B
      label: BLOCKED PENDING A CROSS-GOAL DECISION -- not refused on the merits, not acquired here
      covers: >-
        Any OTHER published MD5 differential characteristic carrying actual path
        or condition data: Stevens' single-block and chosen-prefix path tables,
        the tunnels line, the hashclash repository's published paths and
        condition sets, and anything else that hands a reader a working MD5
        characteristic.
      rule: >-
        NOT ACQUIRED BY THIS GOAL IN BATCH 2 OR ANY LATER BATCH until
        GOAL-MD5-001 rules, in a committed decision of its own, whether such
        material bears on its blind-rediscovery criterion. Such sources ARE filed
        in acquisition-targets.yaml and in the census's acquisition-gap list with
        status `blocked_pending_cross_goal_decision` and a pointer to this
        amendment.
      basis_and_its_honest_limit: >-
        These are not literally BCP-1's content, so refusing them is not
        automatic. But GOAL-MD5-001's criterion is that an automated search
        REDISCOVER a published MD5 collision path "from the primitive's
        specification, without being handed the published path", and being handed
        a DIFFERENT working characteristic plainly teaches the encoding, the
        delta-m shape and the condition style. HOW MUCH IT TEACHES IS A QUESTION
        I CANNOT ANSWER AND DO NOT OWN. Deciding it here, in the goal that
        benefits from the permissive answer, would be exactly the wrong place to
        decide it. So it is routed, not ruled.
      this_is_not_a_closure_of_the_md5_lane: >-
        STATED EXPLICITLY BECAUSE THE SHAPE INVITES THE MISREADING. The MD5 arm
        of this goal is BLOCKED ON A DECISION ANOTHER GOAL OWNS, with a named
        route to unblock it and a named alternative that needs no unblocking at
        all (see digest_mediated_census below). It is not screened out, not
        deprioritised on the merits, and not concluded to be exhausted. Recording
        it as a closure, or letting it quietly become one by never asking, would
        be premature closure under docs/inventor-protocol.md section 4.
      unblocking_route: >-
        A committed GOAL-MD5-001 coordinator decision that either (a) rules
        Tier-B material acquirable because its calibration criterion is already
        discharged or is scoped narrowly to the Wang path, or (b) extends BCP-1
        to cover all published MD5 characteristics under a quarantine discipline
        this goal can then use. The request is made by an ordinary cross-goal
        record and a `tools/agent_bus.py` message addressed to that goal's
        coordinator role; A MESSAGE IS A POINTER AND NEVER THE PERMISSION -- only
        the committed decision unblocks anything.

    - tier: C
      label: PERMITTED -- acquire under ordinary provenance discipline
      covers: >-
        SHA-1 and SHA-0 disturbance-vector and differential-path primary sources,
        and the SHA-1 specification itself. NO FIREWALL IN THIS PROGRAM COVERS
        THEM: BCP-1 is an MD5 quarantine, GOAL-SHA1-001 declares no quarantine,
        and its own next_action asks for primary sources to be filed as KN-LIT.
        Also permitted: bibliographic metadata for Tier-A and Tier-B sources
        (title, authors, venue, identifiers, abstract) with NO path data.
      rule: >-
        Acquirable by a task holding web capability, filed as KN-LIT at stated
        provenance, with the fetched artifact hashed and committed. Provenance
        moves from `recalled` to `retrieved` only in a NEW record naming the
        agent that actually read the source in `verified_by` (AGENTS.md rule 9);
        it is never upgraded by editing an existing entry.
      boundary_with_goal_sha1_001: >-
        GOAL-SHA1-001 owns the chosen-prefix COST MODEL and the DETECTOR AUDIT.
        This goal acquiring DV path data for its census does not encroach on
        either, and the acquired KN-LIT entries are shared corpus available to
        both. If a source serves both, it is filed once and cited twice; it is
        not duplicated under two ids.

  binding_obligations:
    - id: OB-1
      applies_to: every task of GOAL-DIFFP-84d641, present and future
      text: >-
        THE FIREWALL IS READ AS COVERING CONTENT BY EVERY ROUTE. A task told not
        to read the quarantine PATH is equally told not to fetch, mirror, clone,
        paraphrase, or reconstruct the same CONTENT.
    - id: OB-2
      applies_to: every acquisition receipt produced by this goal
      text: >-
        EVERY FETCH ATTESTS WHICH SIDE OF THE FIREWALL IT LANDED ON, per fetch and
        not per session: the URL, the tier (A / B / C), what was retained, and an
        explicit statement that no Tier-A content was obtained. A receipt without
        the per-fetch tier attestation is an invalid acquisition record, and the
        material it obtained may not populate a census entry.
    - id: OB-3
      applies_to: TASK-20260824-873dc9 (idea-generator), immediately, before dispatch
      text: >-
        Three restriction-only additions, and this task is amended because it is
        the ONLY batch-1 task holding web_search and is therefore the exact agent
        that would otherwise have walked into the trap in good faith. (a) It may
        not fetch Tier-A content by any route, and may not fetch Tier-B content
        at all. (b) Every entry in acquisition-targets.yaml carries a TIER LABEL
        (A / B / C) and, for Tier B, the `blocked_pending_cross_goal_decision`
        status and the unblocking route. (c) OB-2 applies to every fetch it
        makes. ITS BUDGET, DELIVERABLES, COMPLETION GATE AND CLAIM CEILING ARE
        UNCHANGED.
    - id: OB-4
      applies_to: TASK-20260824-c6625a (executor) and EXP-DIFFP-fe894e
      text: >-
        NEW INVALIDATION RULE IR-10, restriction-only: ANY NETWORK ACQUISITION BY
        THIS TASK, BY ANY ROUTE, INVALIDATES THE RUN. The Executor role holds
        run_commands but deliberately NOT web_search
        (orchestration/roles.yaml), and using the shell to fetch would route
        around a declared role boundary. The census is built from committed
        repository sources only, exactly as IR-2 already requires. No success
        criterion, control, seed, metric, budget or stopping rule of
        EXP-DIFFP-fe894e is changed by this amendment.
    - id: OB-5
      applies_to: any future acquisition task of this goal
      text: >-
        AN ACQUISITION TASK RUNS UNDER A ROLE THAT ACTUALLY HOLDS web_search in
        orchestration/roles.yaml. It is not simulated with run_commands from a
        role whose contract excludes the open web. A role that needs the open web
        runs under a runtime that has it, or the work does not happen (AGENTS.md,
        capability vocabulary).

  batch_1_not_re_scoped:
    ruling: >-
      BATCH-f8bf86's executor task is NOT re-scoped to include acquisition, and
      no acquisition of any tier is authorised in batch 1.
    reasons:
      - >-
        (1) CAPABILITY. The Executor has no web_search under
        orchestration/roles.yaml; authorising it to fetch via run_commands is
        capability laundering around a deliberate role boundary.
      - >-
        (2) METHODOLOGY, and this reason would stand alone. An adjudicator must
        be shown to work on objects whose ground truth the producer CONTROLS
        before being fed objects whose ground truth it does not. Published paths
        entering an unvalidated adjudicator confound "the adjudicator is wrong"
        with "the census entry was transcribed wrong", and the artifact cannot
        separate them. All four batch-1 controls are fully exercisable at census
        size zero.
      - >-
        (3) SCALE OF CHANGE. An acquisition producer needs a new TASK id (none
        available, and this Coordinator cannot mint), a new archive assignment,
        and a new serial stage ahead of the executor. That is a different batch
        shape and it would push batch 1 past its declared 3000 s of a 10800 s
        campaign.
      - >-
        (4) SUFFICIENCY. TASK-20260824-873dc9 already holds web_search and is
        already tasked with the acquisition-TARGET list. Naming and reach-checking
        sources while acquiring none is the right amount of web use for a batch
        whose object is the instrument.
    what_batch_2_gains: >-
      A viable object it did not have at opening. Batch 2's acquisition task is
      now specified by measurement rather than by hope: Tier C is reachable and
      unblocked, Tier B has a named unblocking route, Tier A is closed, and the
      target list arrives tier-labelled from batch 1.

  digest_mediated_census:
    status: DESIGN PROPOSAL -- not a result, not validated, NOT AUTHORISED HERE
    origin: >-
      The `resource_check` on the firewall, asked at the moment its cost was
      being recorded (docs/inventor-protocol.md section 4: the obstruction is
      read twice, and the second reading asks which theory takes this measurement
      as its hypothesis rather than its refutation).
    idea: >-
      BCP-1 ALREADY DEFINES THE OBJECT A CONTAMINATION-FREE CENSUS NEEDS. Its
      `pre_registered_expected_answer_digest` is the sha256 of a canonical
      serialisation of the quarantined path block, and its MANIFEST.yaml records
      the exact serialisation command. A candidate path can be canonicalised and
      hashed the same way and compared to that digest WITHOUT ANY AGENT EVER
      READING THE PATH. That yields exact-match census membership for MD5 at zero
      contamination cost, turning the firewall from a pure cost into the
      mechanism.
    the_hard_part_stated_rather_than_glossed: >-
      Exact-match membership is NOT orbit-level membership, and orbit-level is
      what this goal's equivalence relation exists to provide. Getting it would
      require the digest to be taken over the canonical form under THIS goal's
      generators, which means the canonicalisation must run INSIDE the quarantine
      boundary as a tool rather than as an agent read -- a boundary-crossing
      design that needs GOAL-MD5-001's agreement, its own controls, and a check
      that the tool's output leaks nothing about the path beyond one digest. None
      of that is established and none of it is claimed here.
    routing: >-
      Enters the batch-2 ranking as an ordinary proposal, on its merits, changing
      no status by existing. Recording it is what stops the firewall being read
      only as a cost.

  unchanged:
    - Batch-1 claim ceiling remains `analyzed`, never `supported`.
    - No path is claimed new; no cryptanalytic improvement is claimed.
    - >-
      No search over the difference space is authorised (EXP-DIFFP-fe894e IR-8),
      and no acquisition of any tier is authorised in BATCH-f8bf86.
    - >-
      Every success criterion, control, seed, metric, budget and stopping rule of
      EXP-DIFFP-fe894e stands exactly as frozen; only the restriction IR-10 is
      added.
    - >-
      The Coordinator's prior P-1..P-5 stands exactly as recorded at opening and
      is NOT revised by the driving session's independent corroboration of the
      census finding. P-1 remains a prediction the batch-1 census build will test.
    - >-
      Campaign budget ceilings stand: maximum_batches 6,
      total_wall_clock_seconds 10800, max_concurrent 2. No raise is self-granted
      or requested.
