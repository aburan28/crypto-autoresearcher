  c6625a_sub_budget: >-
    900 s covers implementation of harness/diffpath/ (the dominant cost) plus six
    wrapper-charged runs whose declared ceilings sum to 960 s. THE CEILING SUM
    EXCEEDS THE TASK BUDGET DELIBERATELY AND THIS IS NOT AN ARITHMETIC ERROR:
