contamination_firewall: >-
  GOAL-MD5-001's BCP-1 QUARANTINE IS HONOURED BY EVERY TASK IN THIS BATCH. The
  payload
  coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
  (sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) is
  NOT READ, NOT PARSED, NOT EXTRACTED and NOT RECONSTRUCTED by any task here.
  The executor recomputes its sha256 from the bytes WITHOUT parsing them
  (CTL-QUAR) and every task attests non-reading. A breach invalidates the run
  under EXP-DIFFP-fe894e IR-1 and is additionally reported to GOAL-MD5-001 as a
  cross-goal contamination finding.
  WHY THIS BATCH ACCEPTS THE COST RATHER THAN ARGUING FOR AN EXEMPTION: the
  quarantine exists so that GOAL-MD5-001's blind-rediscovery criterion stays
  falsifiable. Opening it from a different goal would launder that goal's
  firewall while leaving the firewall's text intact, which is worse than the
  firewall not existing. The honest cost -- an MD5 census with no readable path
  data -- is recorded as a measured acquisition gap and is one of this batch's
  main results.

knowledge_retrieval: >-
  Both producers MUST attempt `search_knowledge` before any assertion that a
  census, an equivalence relation over differential paths, or a
  disturbance-vector classification has or has not been tried in this program or
  the literature, and MUST record the query strings and their outcomes verbatim
  in their reports. ABSENCE OF A HIT LICENSES NO INFERENCE (AGENTS.md,
  "Knowledge retrieval policy"). NOTE FOR BOTH: the retrieval index in this
  repository is DERIVED AND MAY BE EMPTY -- if it answers nothing, that is a
  fact about the index, is recorded as such, and is not evidence that nothing
  was tried. Both must also read knowledge/techniques/KN-TECH-066.md and
  knowledge/literature/KN-LIT-87e00e.md and carry their stated provenance limits
  forward rather than upgrading them by assertion.

review_architecture: >-
  DELIBERATELY NOT WRITTEN YET, AND THAT IS A DECISION RATHER THAN AN OMISSION.
  Per AGENTS.md "Review architecture" and agents/coordinator.md, the review plan
  for TASK-20260824-c6625a is opened by a SEPARATE coordinator handoff AFTER the
  snapshot archive TASK-20260824-be7bbc lands and BEFORE either reviewer runs.
  `review_plan: null` on all seven handoffs in this batch is therefore correct
  and intentional; a plan written now would be written against an imagined
  artifact rather than the committed one.
  WHAT IS ALREADY FIXED, so that writing the plan later cannot become writing it
  conveniently: (1) the Coordinator's PRIOR is recorded above at opening and must
  be carried into the plan VERBATIM; (2) blindness is MUTUAL within the round --
  TASK-20260824-c40847 and TASK-20260824-3bd362 may not read each other's
  reports and each attests what it read; (3) every joint gets EXACTLY ONE owner;
  (4) the proves-too-much control is REQUIRED and its known-false objects are
  named in advance here: the SHA-0 expansion (a DV space the adjudicator must
  NOT accept as SHA-1) and a null draw from inside the linearized code (an object
  for which MEMBER is known false); (5) a BLIND RE-DERIVATION is required of at
  least one load-bearing quantity, and the natural one is the orbit count of the
  planted set under the verified generators, re-derived from the generator
  STATEMENTS and the planted seeds alone with harness/diffpath/** and the
  execution report in `blind_from`. Any departure from these five at plan-writing
  time is a `procedure_deviations` entry.

runtime_policy: >-
  Per orchestration/roles.yaml defaults: coordinator ->
  coordinator-orchestration-code; idea-generator -> research-deep; executor ->
  executor-implementation; validator and red-team -> review-adversarial at
  xhigh, EACH IN ITS OWN INDEPENDENT SESSION. NO ESCALATION TO
  review-breakthrough: this is an ordinary claim-changing round at bounded scale
  -- no claimed breakthrough, no proposed goal closure, no contradiction between
  validated evidence records. Every dispatch receipt must record the requested
  policy, the resolved model identifier, the backend, and the probe status; a
  tier the serving backend cannot reach is a PAUSE, never a silent downgrade
  (AGENTS.md, "Model policy"). Amazon Bedrock is prohibited in any runtime,
  backend, endpoint, fallback or probe (AGENTS.md rule 16).
  NO SERVEABILITY PROBE WAS RUN BY THIS OPENING SESSION and none is claimed: this
  Coordinator subagent has no shell. The driving session runs
  `python3 -m orchestration.adapter doctor --probe` before dispatching the
