      - >-
        After TASK-20260824-be7bbc lands and BEFORE either reviewer runs, a
        SEPARATE coordinator handoff writes the review plan for
        TASK-20260824-c6625a, carrying this batch's
        `coordinator_prior_recorded_at_opening` forward VERBATIM.
    knowledge_promotion:
      promoted: []
      not_warranted: >-
        No evidence exists yet under this goal. This is an opening decision, not
        an evidence review: there is no result, no strength, and nothing durable
        to promote. The knowledge-promotion question is answered at the close
        (DEC-20260824-af6d5c), where a working adjudicator would warrant a
        KN-TECH entry recording the census schema, the per-generator verification
        status and the two controls -- because the adjudication problem recurs for
        every primitive this program will ever ask "is this new" about.
    decided_by: coordinator
    decided_at: '2026-08-24'

objective: >-
  BUILD THE CHEAP GATE THAT CAN FAIL, BEFORE ANY SEARCH. Produce, under
  contract EXP-DIFFP-fe894e and at no large compute cost: (a) a MACHINE-READABLE
  CENSUS of published MD5 differential paths and SHA-1 disturbance vectors,
  assembled ONLY from primary sources an agent in this program actually opened,
  with per-entry citation provenance and an explicit acquisition-gap list for
  everything it could not open; (b) a DECLARED EQUIVALENCE RELATION given as an
  explicit generator list E1..E6, each generator individually VERIFIED against
  the primitive's own step function or EXCLUDED and said so; (c) a VERIFIER and
  ADJUDICATOR deciding candidate-vs-census membership, reporting the strict
  (verified generators) and permissive (all declared) verdicts as separate
  fields; and (d) THE NULL CONTROL, run against a census containing plantable
  entries so that a false positive is possible, paired with a planted-positive
  recall control so the instrument is shown able to answer both YES and NO.
  Alongside, an object-first proposal set naming where new paths could live --
  MD5 delta-m families beyond the published lineage, SHA-1 disturbance-vector
  classes outside the published families, and step-reduced targets reachable in
  a campaign budget -- each proposal carrying a minimal discriminating test, a
  falsification criterion, and Pareto dominated_by / sota_delta against the
  published frontier.
  A FAILING CONTROL IS A COMPLETE AND VALUABLE OUTCOME, not a batch failure. AN
  EMPTY READABLE CENSUS IS A MEASURED ACQUISITION GAP, not a batch failure. A
  count of screened-and-rejected difference vectors with no named, measured
  obstruction would be a fatigue report and is recorded `unverified`
  (docs/inventor-protocol.md section 4).

claim_ceiling: >-
  `analyzed` AT BEST, NEVER `supported`, for every record this batch produces.
  NO PATH IS CLAIMED NEW ON BATCH-1 ARTIFACTS AND NO CRYPTANALYTIC IMPROVEMENT
  OF ANY KIND IS CLAIMED. An adjudicator verdict is a claim about a CENSUS and a
  DECLARED EQUIVALENCE, scoped to both: a NON-MEMBER verdict against an empty or
  incomplete census means "not in this census", never "not in the literature" and
  never "new"; a MEMBER verdict means "equivalent to a census entry under the
  verified generators", never "identical to a published path". Three of
  CLAUDE.md's four supported-promotion gates are structurally unmet by a batch of
  this kind and the fourth is not attempted. The closing task must say this
  explicitly rather than round up.

coordinator_prior_recorded_at_opening: >-
  RECORDED BEFORE ANY PRODUCER RUNS, AND BEFORE THE REVIEW PLAN EXISTS, so that
  a review overturning it is legible as a result rather than absorbed (AGENTS.md,
  "Review architecture"; agents/coordinator.md, "Record your prior"). THE LATER
  REVIEW-PLAN HANDOFF MUST CARRY THIS BLOCK FORWARD VERBATIM; any revision of it
  is a `procedure_deviations` entry, never an edit.
  P-1 (STRONG, AND THE ONE I MOST EXPECT TO BE RIGHT). The readable census will
  be EMPTY for both primitives: readable_md5 = 0 and readable_sha1 = 0. Basis:
  the corpus survey recorded in EXP-DIFFP-fe894e preregistered_prediction.
  FALSIFICATION TRIGGER: any readable path or disturbance-vector datum found
  under knowledge/ or inputs/. If that trigger fires, my opening survey was
  incomplete and that is the finding.
  P-2 (MODERATE). E1 (SHA-1 step shift), E3 (global sign flip) and E4 (MD5
  signed-digit representation) will VERIFY. E2 (SHA-1 bit rotation) is the one I
  am genuinely unsure of and the one whose verdict most changes the covering
  number; I predict it verifies for the EXPANSION but I do NOT predict it
  verifies for the full step function, because the step function's additive
  constants and its non-linear functions need not commute with a rotation. E6
  (block-index reuse) verifies. E5 (condition-set normalisation) is EXCLUDED for
  budget, not for falsity.
  P-3 (STRONG). CTL-PLANT reaches 100% recall and CTL-NULL returns zero
  strict-mode false positives, because the planted paths and the null draws are
  far apart by construction. THIS IS THE PREDICTION I TRUST LEAST AS EVIDENCE,
  and I say so in advance: a null that passes easily may be measuring that the
  null was easy rather than that the adjudicator is sharp. The reviewer that
  attacks the null's difficulty rather than its outcome is doing the more useful
  work, and CTL-NULL family (b) -- uniform draws from INSIDE the linearized code
  -- is where I expect a false positive if there is one anywhere.
  P-4 (WEAK). CTL-OBS direction (i) finds ZERO collisions within the declared
  bounded slice. I hold this weakly: the slice is small and absence there is
  close to uninformative, and I would rather the report said so than reported a
  zero as a pass.
  P-5 (STRONG, AND IT IS A PREDICTION ABOUT THIS PROGRAM RATHER THAN ABOUT THE
  MATHEMATICS). The binding constraint on this whole goal will turn out to be
  ACQUISITION, not search and not solver quality. If that is right, batch 2's
  object is primary-source acquisition under a firewall discipline compatible
  with GOAL-MD5-001's BCP-1, and every later batch's budget argument depends on
  it.

