    TASK-20260824-3bd362: 360
    TASK-20260824-b03556: 300
  arithmetic: '420 + 480 + 900 + 180 + 360 + 360 + 300 = 3000 exactly.'
  share_of_campaign: >-
    3000 of 10800 s, 27.8%. BATCH 1 IS THE MOST EXPENSIVE BATCH BY DESIGN and
