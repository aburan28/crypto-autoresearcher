  recorded_at: '2026-08-24'
  continues: >-
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-873dc9/proposal-set.yaml
  split_reason: >-
    MECHANICAL, NOT EDITORIAL, AND DISCLOSED RATHER THAN LEFT TO BE INFERRED.
    This role's tool surface in this session has no in-place edit capability, so
    a single file could only have been extended by rewriting it in full. The
    proposal set is ONE deliverable in two write-once parts: part 1 carries the
    header, the firewall attestation, the off-limits declaration and proposals
    P1-P2; part 2 carries P3-P6, the ranking, and the honest-accounting block.
    Neither part supersedes the other and both must be read together. No content
    of part 1 is revised here.

  proposals:

    - handle: P3
      title: >-
        The window-restriction obstruction: any restriction of a SHA-1
        disturbance vector to 16 or more consecutive steps is INJECTIVE, so the
        entire "restrict the DV to a step window" family of candidate objects is a
        change of coordinates and not a new object -- a closure at the
        inventor-protocol section 4 standard, with forward guidance
      class: mechanism
      primitive: sha1
      claim: >-
        The SHA-1 message expansion is invertible: W_i = ROL1(W_{i-3} + W_{i-8} +
        W_{i-14} + W_{i-16}) can be solved for W_{i-16} given W_{i-15}..W_i, so ANY
        16 consecutive expanded words determine the whole 80-word codeword.
        THEREFORE the restriction map R_J : C -> GF(2)^{32|J|} for any step set J
        containing 16 consecutive steps is INJECTIVE, its fibres are singletons,
        and it discards nothing. By docs/inventor-protocol.md section 2 such a map
        is a change of coordinates, NOT a tracked object: no covering argument,
        no screen and no equivalence can be built on it that is not already
        available on the full DV. THE CLOSURE IS SCOPED PRECISELY: it closes the
        class of window restrictions containing 16 consecutive steps, and it does
        NOT close (i) restrictions to step sets with no 16 consecutive members,
        (ii) the quotient maps of P1, or (iii) any nonlinear or statistical
        abstraction.
      mechanism: >-
        The obstruction is dimensional and exact rather than heuristic: dim C = 512
        over GF(2), and 16 consecutive words carry exactly 512 bits, so a window of
        16 consecutive steps is a BASIS, not a summary. Every bit "discarded" by
        looking only outside the window is recoverable in polynomial time by
        running the recurrence, which is the precise sense in which nothing was
        discarded. This matters because the window restriction is the FIRST
        abstraction anyone reaches for when told the DV is too big to enumerate
        ("just look at the last 60 steps, that is where the cost lives"), and it is
        exactly the move the lossy-projection test exists to kill before compute is
        spent on it.
      tracked_object_being_ruled_out: >-
        The DV restricted to a declared step window -- e.g. steps [20,79], the
        "tail profile" whose weight is the quantity every cost heuristic cares
        about. Ruled out AS AN OBJECT; the tail WEIGHT remains a perfectly good
        statistic, and P1's class bound is exactly a sound lower bound on it.
      lossy_projection_test:
        verdict: >-
          FAILS, DEMONSTRABLY, AND THE FAILURE IS THE DELIVERABLE. Lossy: NO --
          fibres are singletons for any 16-consecutive-step window. Compatible:
          irrelevant once lossiness fails. This is the worked negative that gives
          the positive verdicts in P1 their meaning: in the same lane, on the same
          object, one candidate projection passes the test and another provably
          fails it, so the test is discriminating and not a formality.
      object_scoring:
        genuinely_new_or_repackaging: >-
          The invertibility of the SHA-1 expansion is elementary and certainly
          known (it is how backward expansion is done at all). What is claimed here
          is not the fact but its USE as a closure: this program had no written
          statement of which candidate DV abstractions are ruled out, and now has
          one for a named class. Internal novelty only; `unverified` externally.
        concretely_testable: >-
          YES, and by exact rank computation rather than by argument.
        survival_depth: >-
          The statement is exact and unconditional over the linearised expansion.
          It says nothing about the state or the step function and does not pretend
          to.
      minimal_discriminating_test:
        budget_seconds: 30
        design: >-
          Build the 512 x 2560 generator matrix of the expansion code over GF(2)
          (rows: the 512 basis seed vectors; columns: all 80 words x 32 bits).
          For each of the 65 windows of 16 consecutive steps, extract the 512 x 512
          submatrix and compute its GF(2) rank. Then, for a declared family of
          NON-consecutive step sets of size 16 (drawn from a declared seed, 100
          sets), compute the ranks of the corresponding submatrices and report the
          distribution.
        controls:
          - >-
            NULL OBJECT: repeat both rank computations for a RANDOM linear code of
            the same dimensions (512 x 2560, declared seed). A random code also has
            full-rank restrictions with overwhelming probability, so THE NULL IS
            EXPECTED TO MATCH on the consecutive-window part -- and that is a real
            and reportable finding: it says full-rank-ness there is generic and not
            SHA-1-specific. Where SHA-1 should DIFFER from random is on structured
            non-consecutive sets, and the measured gap is the actual content.
          - >-
            SHA-0 NEARBY OBJECT: the same computation for the SHA-0 expansion,
            which is also invertible; the consecutive-window result must be
            identical, confirming the closure is about invertibility and not about
            the rotation.
          - >-
            DEGENERATE BASELINE: a window of 15 consecutive steps must have rank
            exactly 480 < 512, i.e. must FAIL to be injective. If a 15-step window
            comes back rank 512 the implementation is wrong.
        required_metrics:
          - the 65 consecutive-window ranks, as integers (predicted: all exactly 512)
          - the 15-step-window rank (predicted: exactly 480)
          - the rank histogram over the 100 declared non-consecutive 16-step sets
          - the same three quantities for the random-code null and for SHA-0
      falsification_criterion: >-
        FALSIFIED IF any 16-consecutive-step window has rank < 512 (the expansion
        is then not invertible as claimed and the closure evaporates), or if a
        15-step window has rank 512 (the dimension count is wrong). EITHER OUTCOME
        WOULD BE MORE INTERESTING THAN THE PREDICTED ONE, which is the property a
        cheap test should have.
      forward_guidance_required_by_section_4: >-
        A closure must name what remains open. RULED OUT: window restrictions
        containing 16 consecutive steps. STILL OPEN, in decreasing order of this
        session's confidence that they are worth a batch: (1) the ideal quotients
        A_d of P1, which are lossy by construction and are the only wordwise linear
        abstractions that can be (P1 claim A); (2) restrictions to step sets with
        NO 16 consecutive members -- these ARE lossy, their kernels are computable
        by the same rank machinery, and the minimal test above measures exactly how
        lossy; (3) nonlinear abstractions (bit-weight profiles, run-length
        statistics of the DV) which are lossy but whose one-step propagation is NOT
        deterministic and which therefore fail the compatibility half of the test
        -- they can serve as screening statistics but never as tracked objects, and
        saying so pre-empts a predictable later confusion; (4) abstractions of the
        near-collision PATH rather than of the DV, which is a different object
        entirely and is untouched by this closure.
      dominated_by:
        status: >-
          n/a for the mathematical content (elementary and certainly known); NOT
          n/a for the closure's role, which is internal to this program.
        why_not_null: >-
          `null` is not claimed. The frontier rows were checked in the only sense
          available: every SHA-1 DV source that would state the invertibility
          explicitly is Tier C and UNACQUIRED by this program, so the honest
          position is that the fact is presumed known and the closure record is
          internal. No dominance check on an unacquired source is asserted.
        frontier_rows_checked:
          - Chabaud-Joux (recalled) -- the linearised-code framing presumes invertibility.
          - Manuel (recalled) -- a classification presumes a canonical seed window.
          - Any FIPS 180-4 implementation -- backward expansion is standard practice.
      sota_delta:
        quantitative: >-
          NO RESULT IS CLAIMED AGAINST ANY EXTERNAL FRONTIER, so the honest value
          is "no attack; conceptual/measurement contribution only"
          (inventor-protocol section 5). The internal delta is countable: this
          program held ZERO written statements about which DV abstractions are
          admissible and would hold ONE closed class plus four named open classes,
          at a compute cost of 65 rank computations on 512x512 GF(2) matrices
          (~2^27 bit operations, under a second).
      target_complexity:
        time_exponent: "65 x O(512^3 / 64) word operations ~ 2^27; negligible"
        memory_exponent: "512 x 2560 bits = 160 KB"
        best_known: not applicable -- no algorithmic claim is made
        hidden_overhead: none; the computation is exact linear algebra over GF(2) with no heuristic step
        tradeoff_note: not applicable
      heuristic_assumptions:
        - id: H5
          statement: >-
            NONE REQUIRED FOR THE CLOSURE ITSELF. Recorded explicitly rather than
            omitted: the claim is exact linear algebra and is unconditional given
            the expansion recurrence. The ONLY assumption is that the implemented
            recurrence is FIPS 180-4's, which is an implementation fact gated by
            CTL-BASE in EXP-DIFFP-fe894e, not a heuristic.
          rigorous_support: The rank computation is a decision procedure, not an estimate.
          validation_plan: >-
            Gate on the two SHA-1 digests already declared in EXP-DIFFP-fe894e
            inputs.specifications.sha1 before trusting any expansion code.
      proof_search_map:
        bottleneck: >-
          The step this removes is not computational but methodological: the
          batch-2 temptation to define the search object as "the DV tail", which
          would consume a batch producing a re-coordinatisation.
        baseline_embedding:
          parameter_slice: >-
            |J| = 16 consecutive is the exact boundary: at 16 the restriction is
            bijective onto its image, at 15 it has a 32-dimensional kernel. The
            closure is stated AT the boundary and the boundary is checked.
          reproduction_check: the 15-versus-16 rank pair, as a frozen fixture (480 versus 512)
        observation_collision:
          observable: the restricted vector R_J(V)
          distinct_preimage_search: >-
            The audit is to SEARCH for two distinct codewords with the same
            restriction, for |J| = 16 consecutive. The prediction is that none
            exists (injectivity); finding one falsifies the closure directly. For
            non-consecutive J the search should SUCCEED and the number of colliding
            pairs measures the loss, which is what makes open class (2) worth
            pursuing.
        constructive_transforms:
          - transform: observable_fiber
            proposed_object: >-
              Hold R_J fixed and vary the rest of the codeword; the fibre size is
              2^{512 - rank(J)}, computed exactly, and a fibre of size 1 is the
              definition of "not an object".
            predicted_gain: >-
              Converts "is this a real abstraction" into an integer, for every
              candidate step set, at negligible cost.
        quantifier_order: >-
          FOR ALL step sets J containing 16 consecutive steps, FOR ALL pairs of
          codewords V != V', R_J(V) != R_J(V'). No witness depends on the codeword;
          the statement is uniform, which is why it is a closure and not an
          observation.
        method_ceiling:
          strongest_certifiable_claim: >-
            Exactly the injectivity statement and the fibre sizes. It certifies
            nothing about cost, nothing about which DVs are usable, and nothing
            about the state.
          nearby_object_control: >-
            SHA-0, which must give the identical answer. If it did not, the closure
            would be about the rotation rather than about invertibility and would be
            mis-stated.
        proof_obligations:
          - claim: "the expansion recurrence is invertible for W_{i-16}"
            responsibility: correctness
          - claim: "rank of any 16-consecutive-step restriction is exactly 512"
            responsibility: size
          - claim: "the closure's scope excludes non-consecutive sets and nonlinear maps"
            responsibility: scope
      novelty_status: unverified
      novelty_screen:
        corpus_outcome: >-
          No record in knowledge/ or ledger/ states the invertibility, the rank, or
          any consequence for object choice. IDEA-20260816-3edd14 (GOAL-SHA1-001)
          enumerates the DV class for detector coverage and presumes a generating
          recurrence but records no injectivity statement and no object-admissibility
          criterion.
        verdict: >-
          `unverified` externally and almost certainly `known` as mathematics; the
          honest label is unverified because no source was opened. The value is
          internal and procedural.
      citations:
        - ref: docs/inventor-protocol.md section 2
          provenance: internal
          claim: "A projection that loses nothing is a change of coordinates, not a new object."
          verified_by: TASK-20260824-873dc9 (read in full this session)
        - ref: docs/inventor-protocol.md section 4
          provenance: internal
          claim: >-
            A closure requires a named obstruction, an argument, and forward
            guidance; a count of rejected mechanisms is a fatigue report.
          verified_by: TASK-20260824-873dc9 (read in full this session)
      assumptions:
        - The expansion implemented is FIPS 180-4's, gated on CTL-BASE.
      confounders:
        - >-
          A rank computed over the wrong field or with a bit-order bug would give
          512 spuriously. The 15-step control (must be 480) is the guard.
      interpretation_limits:
        - >-
          This closes ONE class of candidate objects. It is not a statement that
          the SHA-1 difference space is exhausted, and reading it that way would be
          exactly the premature closure the protocol forbids.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: medium

    - handle: P4
      title: >-
        The certifiable step-reduced frontier for SHA-1: measure the largest step
        count N at which a screened DV can be driven to a LITERAL conforming
        message pair inside a declared 300 s budget by a declared naive method,
        and compare it against the condition-count model's prediction
      class: measurement
      primitive: sha1 (with sha0 as the nearby-object control)
      claim: >-
        There exists a well-defined integer N* = the largest step count at which
        the declared procedure -- pick a DV from a P1-screened class, place local
        collisions at its set bits, derive the condition set with the
        EXP-DIFFP-fe894e conformance verifier, and satisfy the conditions by
        seeded random message search WITHOUT message modification -- produces a
        certified conforming pair within 300 s of single-core compute. N* is a
        MEASURED property of (procedure, budget, seed), not of SHA-1. The
        discriminating content is the comparison N*_observed versus N*_predicted,
        where N*_predicted is derived from the condition count c(N) and 512 bits of
        freedom by the model "random search succeeds when c(N) <= ~30 conditions
        remain after the freely-satisfiable ones".
      mechanism: >-
        Why this is worth a measurement rather than an assumption: every other
        proposal in this set produces SCREENS, and a screen that never touches a
        certified object can drift arbitrarily far from reality without anyone
        noticing. A conforming pair is the one artifact in this whole goal that is
        checkable by an independent reference implementation
        (docs/claims-and-verification.md), so N* is the anchor that keeps the
        abstract ladder honest. It also answers the third axis of the handoff
        directly: which step-reduced targets are ACTUALLY reachable inside the
        campaign budget, measured rather than guessed.
      tracked_object: >-
        The (DV class, step count N, condition count, certified pair) tuple. The
        certificate is the literal message pair.
      lossy_projection_test:
        verdict: >-
          NOT APPLICABLE AS A NEW-OBJECT TEST, AND THAT IS STATED RATHER THAN
          FUDGED. P4 introduces no new tracked object; it measures the frontier at
          which the objects introduced by P1 can be cashed into certificates. The
          test applies to P1's object and is answered there. Recording
          "not applicable, and here is why" is required by the protocol; silently
          omitting it would not be.
      object_scoring:
        genuinely_new_or_repackaging: >-
          The measurement is new TO THIS PROGRAM; step-reduced SHA-1 collisions are
          unquestionably published (recalled: reduced-step SHA-1 and SHA-0
          collisions are a long line). NO CLAIM OF A NEW COLLISION IS MADE OR
          POSSIBLE HERE -- a step-reduced conforming pair at a small N restates
          what the literature has; its value is calibration of THIS harness.
        concretely_testable: YES -- the output is an integer N* and a certificate file.
        survival_depth: >-
          Survives exactly as far as the budget does. The honest expectation is
          that N* is small (tens of steps), and a small N* is a useful number, not
          a failure.
      minimal_discriminating_test:
        budget_seconds: 300
        design: >-
          Sweep N over {20, 24, 28, 32, 36, 40}, ascending, stopping at the first
          failure. At each N: take the 3 lowest-tail-weight DV classes from P1's
          d=1 enumeration restricted to steps < N, pick one representative codeword
          per class from a declared seed, derive conditions with the conformance
          verifier, run seeded random search for a conforming pair with a per-N
          ceiling of 40 s, and on success emit the pair plus an INDEPENDENT
          re-verification (recompute the N-step SHA-1 state for both messages with
          a separately written reference routine and check the differential).
          Report N* and the full (N, conditions, attempts, seconds, outcome) table.
        controls:
          - >-
            NULL OBJECT: run the identical procedure with DVs drawn UNIFORMLY from
            the code (ignoring the P1 screen). If N* is the same, the screen bought
            nothing at this scale -- a controlled null, and the single most likely
            outcome at small N where almost everything works.
          - >-
            SHA-0 NEARBY OBJECT: the identical sweep on SHA-0's expansion. SHA-0 is
            expected to reach a HIGHER N* (its expansion lacks the rotation and its
            local collisions are cheaper, recalled). If SHA-0 does NOT come out
            easier, the harness is not capturing the structural difference and every
            SHA-1 number from it is weaker than it looks.
          - >-
            DEGENERATE BASELINE: the all-zero DV must trivially "succeed" at every N
            with the identical message pair, and the harness must REJECT it as
            degenerate rather than reporting it as a conforming pair. A frontier
            measurement that scores the zero object as a success is measuring
            nothing.
        required_metrics:
          - N* as an integer, with the procedure, seed, solver and ceiling named beside it
          - per N: condition count, attempts, wall-clock seconds, outcome
          - the certificate (literal message pair) for every success, independently re-verified
          - N* for the uniform-DV null and for SHA-0, as separate integers
      falsification_criterion: >-
        FALSIFIED IF N*_observed differs from N*_predicted by more than 8 steps in
        EITHER direction. Lower means the freedom accounting over-counts what naive
        search can use (and the named successor is message modification, which is
        a different and larger contract). Higher means the condition-count model
        over-counts conditions, i.e. the conditions are not independent -- which
        would be a genuine finding about the model and would feed straight back
        into H1 and H3. THE TEST IS TWO-SIDED AND BOTH SIDES ARE INFORMATIVE.
      boundary_discipline:
        goal_md5_001: >-
          THIS PROPOSAL DELIBERATELY DOES NOT USE MD5. The identical measurement on
          MD5 would be indistinguishable from measuring whether a characteristic
          search solver works, which GOAL-DIFFP-84d641 non_duplication and
          EXP-DIFFP-fe894e IR-9 assign to GOAL-MD5-001. If a SHA-1 run here starts
          measuring the solver rather than the difference space, IR-9's handoff
          applies and the task ends rather than absorbing the work.
        goal_sha1_001: >-
          No chosen-prefix cost is derived, no detector coverage is stated, and no
          object is constructed to evade any detector. N* is a harness capability
          figure at a step-reduced parameter set and is never extrapolated toward
          full SHA-1 or toward any attack cost.
      dominated_by:
        status: dominated, and unambiguously so, on the attack axis
        frontier_rows_checked:
          - >-
            Stevens et al., first collision for full SHA-1 (recalled; identifier
            ePrint 2017/190 seen in a search listing, NOT opened). Dominates any
            step-reduced SHA-1 collision completely: full 80 steps versus N* <= 40.
          - >-
            Stevens, freestart collision for full SHA-1 (recalled; ePrint 2015/967
            seen in a search listing, NOT opened). Dominates likewise.
          - >-
            Wang-Yin-Yu, full SHA-1 (recalled). Dominates on cost.
          - >-
            Biham-Chen et al., collisions of SHA-0 and reduced SHA-1 (recalled;
            title seen in a search listing, NOT opened). Dominates the reduced-step
            frontier specifically, which is exactly this proposal's axis.
          - >-
            Memory and data axes: this procedure uses O(1) memory and no queries, so
            it is not dominated on those axes -- but being cheapest on axes nobody
            is constrained by is not a Pareto point worth claiming, and it is not
            claimed.
        conclusion: >-
          DOMINATED ON EVERY AXIS THAT MATTERS. This is stated plainly because the
          proposal's value is calibration of this harness, not competition with the
          literature, and pretending otherwise would be the inflation the handoff
          forbids.
      sota_delta:
        quantitative: >-
          Published SHA-1 collision work reaches 80 of 80 steps; this reaches
          N* <= 40 by construction of its budget, so the delta is at best -40 steps
          and the ratio of claimed capability to published capability is at most
          0.5. NO IMPROVEMENT OF ANY KIND IS CLAIMED. The delta that is positive is
          internal: this program currently holds ZERO certified conforming pairs
          for any step-reduced SHA-1 parameter set, so N* would move an internal
          count from 0 to 1.
      target_complexity:
        time_exponent: >-
          Random search succeeds in ~2^{c_res} attempts where c_res is the residual
          condition count after freely-satisfiable conditions; the 40 s per-N
          ceiling caps c_res at roughly 22-26 in unoptimised Python. That cap, not
          SHA-1, is what determines N*.
        memory_exponent: O(1) -- a few dozen 32-bit words
        best_known: >-
          Full 80-step SHA-1 collisions exist at published cost (recalled, not
          opened). This is not comparable and is not compared.
        hidden_overhead: >-
          The declared procedure EXCLUDES message modification, which is the single
          technique that would move N* most. That exclusion is deliberate (it keeps
          the run cheap and keeps it out of solver-validation territory) and it is
          the dominant term hidden in "naive method".
        tradeoff_note: >-
          Adding message modification trades implementation cost for step count and
          is a separate, larger contract; the ceiling it would move is named so the
          successor is specified rather than implied.
      heuristic_assumptions:
        - id: H6
          statement: >-
            ASSUME the sufficient conditions derived for a step-reduced local-collision
            path behave, for the purpose of random search, like independent events
            each of probability 1/2, so that expected attempts ~ 2^{c_res}.
          rigorous_support: >-
            The rigorous anchor is that each condition is a constraint on a distinct
            state bit and that the message space is 512 bits with a uniform seeded
            draw. Independence is the classical simplifying distribution assumption
            this imitates (the same one behind the standard "path probability"
            accounting in KN-TECH-066); it is known to be optimistic where
            conditions share a carry chain.
          validation_plan: >-
            SAMPLE: at each N in the sweep, record observed attempts and compare to
            2^{c_res}. COMPARE: the ratio observed/predicted per N, reported as a
            number, not a verdict. TAIL CHECK: report the worst (largest) ratio
            observed; a ratio above 2^4 at any N is evidence of dependence and must
            be reported as such rather than averaged away. TRANSFER: the fitted
            behaviour at N <= 40 is NOT extrapolated to N = 80 and no such
            extrapolation appears in any output.
      proof_search_map:
        bottleneck: >-
          Converting a screened DV into a CERTIFIED object. Everything upstream is
          an abstraction; this is where the abstraction either cashes out or does
          not.
        baseline_embedding:
          parameter_slice: >-
            N = 20 (or the smallest N at which a nontrivial local collision fits) is
            the trivial slice where success is near-certain; the sweep must
            reproduce success there before any larger N is believed.
          reproduction_check: certificate at the smallest N, re-verified independently
        observation_collision:
          observable: the certified conforming pair
          distinct_preimage_search: >-
            Look for two DVs from DIFFERENT P1 classes that yield the same
            conforming pair. That would mean the certificate does not identify the
            path and the whole certification chain is weaker than assumed. Predicted
            not to occur; checked anyway.
        constructive_transforms:
          - transform: baseline_lift
            proposed_object: enlarge the certificate family from "a pair" to "a pair plus its full per-step differential trace"
            predicted_gain: >-
              Makes the certificate check strict rather than merely feasible: the
              verifier can then confirm the pair follows THE CLAIMED path and not
              merely some path.
        quantifier_order: >-
          THERE EXISTS N* such that FOR ALL N <= N* THERE EXISTS a DV and a message
          pair conforming within budget. The witness pair depends on N and on the
          seed, and that dependence is exactly why N* is a property of the procedure
          and not of SHA-1. Any record restating N* must restate that.
        method_ceiling:
          strongest_certifiable_claim: >-
            "This harness, with this procedure, seed and budget, produced a certified
            conforming pair at N steps." Nothing about full SHA-1, nothing about any
            attack cost, nothing about novelty.
          nearby_object_control: >-
            SHA-0, expected easier. If the harness cannot see that difference, its
            SHA-1 numbers are not measuring SHA-1-specific structure.
        proof_obligations:
          - claim: "the emitted pair conforms to the claimed path"
            responsibility: correctness
          - claim: "independent re-verification agrees"
            responsibility: interface
          - claim: "attempts scale as 2^{c_res}"
            responsibility: success_probability
            note: THIS IS H6.
          - claim: "N* is scoped to procedure, seed, solver and budget"
            responsibility: scope
      novelty_status: unverified
      novelty_screen:
        corpus_outcome: >-
          No experiment in this repository has produced a conforming pair for any
          step-reduced SHA-1 parameter set; no run record under experiments/ names
          SHA-1 at all beyond the EXP-DIFFP-fe894e contract frozen this batch.
        verdict: unverified externally; the reduced-step SHA-1 line is certainly published and is named as dominating.
      citations:
        - ref: docs/claims-and-verification.md
          provenance: internal
          claim: any claimed solve carries a certificate the run wrapper re-verifies independently
          verified_by: null
          note: cited from CLAUDE.md rule 4's restatement, which this session read; the document itself was not opened.
        - ref: "Biham, Chen et al. -- Collisions of SHA-0 and reduced SHA-1 (EUROCRYPT 2005)"
          provenance: recalled
          claim: RECALLED POINTER, NOT SUPPORT. Named as the dominating row on the reduced-step axis.
          verified_by: null
          identifier_check: title appeared in a WebSearch result listing this session (retrieval-log R3); not opened.
      assumptions:
        - EXP-DIFFP-fe894e's conformance verifier exists and passed CTL-BASE. If it did not, P4 cannot run and says so rather than substituting an unchecked verifier.
      confounders:
        - >-
          Python constant factors dominate at this scale, so N* mostly measures the
          implementation. The uniform-DV null is what separates "the screen helped"
          from "the interpreter was slow".
        - >-
          A DV whose local collisions fall outside the reduced step range is
          trivially satisfiable; such degenerate cases must be detected and excluded
          or N* is inflated.
      interpretation_limits:
        - N* is a property of the procedure, seed, solver and budget. It is never reported as a property of SHA-1.
        - No result here is extrapolated toward full SHA-1 or toward any attack cost.
        - No path is claimed new; a step-reduced conforming pair restates published capability.
      estimated_cost:
        implementation: medium
        compute: low
      recommended_priority: medium

    - handle: P5
      title: >-
        Leakage budget for an orbit-level digest oracle across the BCP-1 boundary:
        measure, on planted paths only, how many adaptive queries reconstruct a
        path from canonical-form digests, and thereby decide whether the
        Coordinator's digest-mediated census can be orbit-level without
        contaminating GOAL-MD5-001
      class: control
      primitive: both (measured on planted objects; touches no quarantined content)
      claim: >-
        AMD-20260824-DIFFP-ACQ-1 records `digest_mediated_census` as a design
        proposal and states the hard part honestly: exact-match digest membership
        is not orbit-level membership, and getting orbit-level would require the
        canonicalisation to run INSIDE the quarantine boundary as a tool, which
        needs a check "that the tool's output leaks nothing about the path beyond
        one digest". THAT CHECK IS A MEASUREMENT AND IT CAN BE PERFORMED ENTIRELY
        ON PLANTED PATHS, with no quarantined content anywhere near it. CLAIM: let
        Q(L) be the number of adaptive queries to an oracle that returns the digest
        of the canonical form of a submitted path, needed to reconstruct a hidden
        planted path of L steps by a declared greedy strategy. Then either
        Q(L) grows exponentially in L -- in which case a rate-limited digest tool
        is defensible and the MD5 lane has a contamination-free route to
        orbit-level membership -- or Q(L) is polynomial, in which case the tool is
        a reconstruction oracle in disguise and MUST NOT be built. The experiment
        decides which.
      mechanism: >-
        A digest oracle is a membership oracle for the fibre of the canonicalisation
        map. Its leakage is governed by how much an attacker learns from a NO
        answer, which depends entirely on whether near-misses are detectable. With a
        plain sha256 of a canonical serialisation, a single-bit change randomises
        the digest, so a greedy hill-climb has no gradient and Q(L) should be
        exponential. THE FAILURE MODE IS SPECIFIC AND WORTH HUNTING: if the
        canonicalisation is applied COMPONENT-WISE and digests are emitted per
        component (per step, per word), the oracle becomes divide-and-conquer and
        Q(L) collapses to linear. Which regime a given implementation is in is not
        obvious from reading it, which is exactly why it should be measured before
        anyone proposes crossing a firewall with it.
      tracked_object: >-
        The query transcript: the sequence of (submitted path, returned digest,
        match/no-match) triples, and the reconstruction state derived from it. This
        is an object about the INSTRUMENT, not about the difference space.
      lossy_projection_test:
        verdict: >-
          PASSES for the digest map, and the pass is the whole design intent. The
          canonical-form digest is a maximally lossy projection (an 80-step path,
          thousands of bits, to 256 bits) and it is compatible with the ONE
          operation the census performs on a path, namely equality-under-the-declared-
          equivalence. What it discards is everything except orbit identity, and
          that is precisely what a contamination-free membership test is allowed to
          retain. THE MEASUREMENT ASKS WHETHER THE LOSS IS REAL UNDER ADAPTIVE
          QUERYING, which is the part a purely algebraic verdict cannot settle.
      object_scoring:
        genuinely_new_or_repackaging: >-
          The oracle-reconstruction framing is standard; applying it to a research
          program's own contamination firewall is, as far as this program's records
          show, not something it has done before. Credit for the digest-mediated
          census idea belongs to AMD-20260824-DIFFP-ACQ-1; what is added here is the
          falsifiable safety measurement it explicitly says is missing.
        concretely_testable: YES -- Q(L) is an integer count per trial.
        survival_depth: >-
          Survives as far as the declared adversary strategy does. The honest limit
          is stated up front: measuring Q(L) for ONE greedy strategy bounds leakage
          from BELOW, never from above, so a large Q(L) is weak evidence of safety
          and a small Q(L) is STRONG evidence of danger. The test is deliberately
          asymmetric in the safe direction.
      minimal_discriminating_test:
        budget_seconds: 180
        design: >-
          Using ONLY planted paths from EXP-DIFFP-fe894e's declared seeds: (1) build
          the digest oracle exactly as the design proposal describes -- canonicalise
          under the verified generators, serialise canonically, sha256; (2) hide a
          planted path of L steps for L in {8, 16, 32, 64, 80}; (3) run the declared
          greedy adversary (submit a candidate, flip one signed difference at a
          time, keep changes that produce a match, else continue) with a hard cap of
          10^5 queries per L; (4) report Q(L) or CAP-REACHED per L, over 10 seeded
          trials each; (5) repeat with a deliberately WEAKENED oracle that emits one
          digest PER STEP instead of one per path -- the divide-and-conquer variant
          -- and report Q(L) for it.
        controls:
          - >-
            NULL OBJECT: run the identical adversary against a RANDOM ORACLE (return
            a fresh random 256-bit string for every query, matching only on exact
            repeat). Q(L) against it is the no-information baseline; if the real
            oracle's Q(L) matches it, the oracle leaks nothing the adversary can use.
          - >-
            POSITIVE CONTROL, WHICH IS THE PART THAT MAKES THE NULL NON-VACUOUS: the
            per-step weakened oracle is EXPECTED to collapse to Q(L) ~ O(L). If it
            does not, the adversary implementation is too weak to detect leakage at
            all and NO conclusion may be drawn from the main run. A leakage test
            whose adversary cannot find planted leakage has measured nothing.
        required_metrics:
          - Q(L) per L per trial, as integers, with CAP-REACHED counted separately and never imputed
          - Q(L) for the random-oracle null and for the per-step positive control
          - the ratio Q_real(L)/Q_null(L) per L
      falsification_criterion: >-
        THE SAFETY CLAIM IS FALSIFIED IF Q(L) for the whole-path oracle is within a
        factor 2^4 of the per-step positive control at any L >= 32, or if Q(L) grows
        sub-exponentially in L over the tested range. Either says the digest tool is
        a reconstruction oracle and the boundary-crossing design must not be built.
        THE TEST IS VOID (not passed) IF the positive control fails to collapse --
        recorded as VOID, not as a pass.
      dominated_by:
        status: "n/a (no cryptanalytic result claimed)"
        why_this_is_a_checked_answer: >-
          The Pareto frontier for this proposal is not a cryptanalytic frontier at
          all: no time, memory or data cost of any attack is claimed or improved,
          so there is no row to be dominated by. The relevant INTERNAL frontier is
          AMD-20260824-DIFFP-ACQ-1's `digest_mediated_census`, which dominates on
          the idea and is explicitly credited; this proposal is strictly downstream
          of it and adds only the missing safety measurement. Recording "n/a" here
          is the section-5-sanctioned complete answer, not an unchecked null.
      sota_delta:
        quantitative: >-
          "No attack; conceptual/measurement contribution only." The internal delta
          is a decision that currently cannot be made at all: the amendment states
          the leak check is required and unestablished, so this moves the number of
          measured leakage bounds from 0 to 1, with an integer Q(L) attached.
      target_complexity:
        time_exponent: "10^5 queries x 5 values of L x 10 trials x 2 oracles = 10^7 sha256 evaluations of small inputs; seconds to low minutes"
        memory_exponent: O(L) per trial
        best_known: not applicable
        hidden_overhead: >-
          The greedy adversary is ONE strategy. A stronger adversary (algebraic,
          or exploiting canonicalisation structure) could do better, so Q(L) is a
          LOWER bound on leakage resistance and every report must say so in the same
          sentence as the number.
        tradeoff_note: not applicable
      heuristic_assumptions:
        - id: H7
          statement: >-
            ASSUME sha256 over the canonical serialisation behaves as a random
            oracle for this purpose, so that a non-matching query returns no partial
            information.
          rigorous_support: >-
            Standard modelling assumption; no rigorous support is available and none
            is claimed. It is named because the whole safety argument rests on it
            and because if it fails the failure is total rather than gradual.
          validation_plan: >-
            Not independently validated here -- the random-oracle NULL control is
            the operational stand-in, and the honest statement is that the
            experiment measures the gap between the real oracle and an idealised
            one rather than validating the idealisation.
      proof_search_map:
        bottleneck: >-
          The MD5 arm of this goal is blocked on another goal's decision. The
          digest route is the only identified way to make orbit-level census
          membership possible WITHOUT that decision, and its single unestablished
          prerequisite is the leakage bound. That prerequisite is this proposal.
        baseline_embedding:
          parameter_slice: >-
            The exact-match digest (the amendment's own proposal) is the L = whole
            path, no-canonicalisation slice; this generalises it to canonical forms
            and must reproduce the exact-match behaviour when the generator set is
            empty.
          reproduction_check: with zero verified generators, canonical form = identity, and membership must coincide exactly with raw digest equality
        observation_collision:
          observable: the digest
          distinct_preimage_search: >-
            REQUIRED: search for two planted paths in DIFFERENT orbits with the same
            digest. Predicted zero (256-bit digest); a hit is a canonicalisation bug
            or a serialisation ambiguity, both of which are STOPs.
        constructive_transforms:
          - transform: representation_reduction
            proposed_object: recast "does the tool leak" as "what is Q(L) for a declared adversary", an integer
            predicted_gain: turns an unanswerable safety question into a measured bound with a stated direction of validity
        quantifier_order: >-
          THE SAFE DIRECTION IS THE HARD ONE AND THE ASYMMETRY IS DECLARED. What is
          measured: THERE EXISTS an adversary A (the declared greedy one) such that
          FOR ALL tested L, Q_A(L) >= the observed value. What would be needed for
          safety: FOR ALL adversaries A, Q_A(L) is large -- which is NOT tested and
          NOT claimed. Any record citing this must carry that quantifier gap.
        method_ceiling:
          strongest_certifiable_claim: >-
            "This declared adversary needed at least N queries at these L, against
            this oracle construction." Never "the tool is safe".
          nearby_object_control: >-
            The per-step oracle, which is the closest object where the hoped-for
            conclusion (no leakage) is FALSE by construction. An adversary that
            cannot break it has not earned the right to be believed on the main run.
        proof_obligations:
          - claim: "the per-step oracle collapses to O(L)"
            responsibility: baseline
          - claim: "Q(L) against the whole-path oracle matches the random-oracle null"
            responsibility: correctness
          - claim: "the bound is one-sided (lower bound on resistance only)"
            responsibility: scope
      novelty_status: unverified
      novelty_screen:
        corpus_outcome: >-
          The only record in this repository proposing digest-mediated census
          membership is AMD-20260824-DIFFP-ACQ-1 itself, which states the leakage
          check as unestablished. No record measures oracle leakage of any
          canonicalisation.
        verdict: unverified; the technique is standard, the application is internal and its dominator is the amendment.
      citations:
        - ref: AMD-20260824-DIFFP-ACQ-1, `digest_mediated_census`
          provenance: internal
          claim: >-
            BCP-1's pre-registered digest already defines a contamination-free
            comparison object; orbit-level membership would need canonicalisation
            inside the quarantine boundary plus a check that the tool leaks nothing
            beyond one digest. THAT SENTENCE IS THIS PROPOSAL'S ENTIRE PREMISE and
            the credit is the Coordinator's.
          verified_by: TASK-20260824-873dc9 (read in full this session)
      assumptions:
        - Planted paths and a canonicaliser exist from EXP-DIFFP-fe894e. Without them P5 cannot run and reports NOT PERFORMED.
        - No quarantined content is used, referenced, hashed or approached at any point.
      confounders:
        - >-
          A weak adversary reads as a safe oracle. The per-step positive control is
          the entire defence against that reading and its failure VOIDS the run.
        - >-
          Serialisation ambiguity (two encodings of one canonical form) would show
          up as spurious non-membership and could be misread as low leakage.
      interpretation_limits:
        - >-
          A large Q(L) is NOT a safety proof and must never be cited as one. Only the
          negative direction (small Q(L) implies unsafe) is strong.
        - >-
          NOTHING HERE AUTHORISES BUILDING THE BOUNDARY-CROSSING TOOL. That needs a
          committed GOAL-MD5-001 decision; this measurement only supplies an input
          that decision currently lacks. A message is a pointer and never the
          permission.
      estimated_cost:
        implementation: medium
        compute: low
      recommended_priority: medium-high

    - handle: P6
      title: >-
        Climb the filtration to d >= 2 by meet-in-the-middle minimum-weight
        computation: exact tail-weight minima for the [160,32] and [240,48]
        screening codes at 2^{8d} time and 2^{8d} memory instead of 2^{16d}
        enumeration, which is also the cheapest rung that can be SHA-1-specific
        rather than SHA-0-shared
      class: algorithm
      primitive: sha1
      claim: >-
        The level-d screening code of P1 is a binary [80d, 16d] code. Its minimum
        weight restricted to a declared step window -- the quantity that makes the
        screen non-vacuous -- can be computed exactly by full enumeration at
        2^{16d} time and O(1) memory, or by splitting the 16d-bit information set
        into two halves and joining on a collision at roughly 2^{8d} time and
        2^{8d} memory. At d = 2 that is 2^16 time and 2^16 memory instead of 2^32;
        at d = 3, 2^24 instead of 2^48. AND THE STRUCTURAL POINT IS SEPARATE FROM
        THE COST POINT: d = 2 is the SMALLEST rung that distinguishes SHA-1 from
        SHA-0, because the action of ROL1 on R/m^2 in the basis {1, t} is
        (a0,a1) -> (a0, a0+a1) while SHA-0's is the identity. So d = 2 is not an
        optional refinement -- it is the first rung at which any statement is about
        SHA-1 at all.
      mechanism: >-
        Why unexamined structure could live here: the d = 1 rung is cheap and
        provably blind; the raw DV space is 2^512 and unenumerable. The rungs in
        between are exactly where an exact covering statement is both meaningful and
        affordable, and nothing in a per-instance attack paper needs to compute
        them. A published census would miss the STATEMENT for the same reason as in
        P1: instance search does not produce covering numbers.
      tracked_object: >-
        The level-d abstract codeword, as in P1, plus the split of its information
        set into two halves and the partial tail weights of each half.
      lossy_projection_test:
        verdict: >-
          PASSES, inherited from P1 and not re-derived: A_d is lossy with fibre
          2^{512-16d} and compatible with the expansion because m^d is an ideal. The
          MITM split is an algorithmic device applied to an already-admitted object,
          not a new projection, and it is labelled as such rather than presented as
          a second novelty.
      object_scoring:
        genuinely_new_or_repackaging: >-
          THE MITM/ISD MACHINERY IS ENTIRELY STANDARD CODING THEORY AND IS NOT
          CLAIMED AS NEW. What is proposed is its application to the specific
          filtration codes of P1, and the honest scoring is: low novelty, high
          leverage, and a strong repackaging risk against the recalled
          Pramstaller-Rechberger-Rijmen line, which is named as the likely
          dominator.
        concretely_testable: YES -- the output is an exact integer minimum weight per window.
        survival_depth: >-
          Exact at every d that is affordable; dissolves at d where 2^{8d} exceeds
          budget (d ~ 5-6 on this harness), and the raw DV at d = 32 is never
          reachable. The ladder therefore has a computable last rung, which is
          itself a reportable number.
      minimal_discriminating_test:
        budget_seconds: 240
        design: >-
          (1) At d = 2, compute the exact minimum tail weight over the declared
          window BOTH ways: by full 2^32 enumeration in compiled form IF it fits the
          ceiling, and by the 2^16/2^16 MITM. REQUIRE EXACT INTEGER AGREEMENT. That
          cross-check is the whole point of doing d = 2 first: it is the largest rung
          where both methods are affordable, so it is the only rung where the fast
          method can be validated against the slow one.
          (2) Report the d = 2 eliminated-class fraction under the same T_max sweep as
          P1's d = 1, so the two rungs are directly comparable.
          (3) Run the SHA-0 separation check at d = 2: the abstract recurrences must
          DIFFER, in contrast to d = 1 where they must coincide.
        controls:
          - >-
            AGREEMENT CONTROL: MITM versus enumeration at d = 2, exact integer
            equality. Disagreement is an implementation defect and a STOP; it is not
            a mathematical finding.
          - >-
            NULL OBJECT: the same minimum-weight computation on a random [160,32]
            code (declared seed). If the SHA-1 filtration code's minimum tail weight
            matches the random code's within sampling error, the structure is
            generic and the screen is measuring code length, not SHA-1.
          - >-
            MONOTONICITY CONTROL: the level-d bound must be >= the level-(d-1) bound
            for every class, since A_{d-1} factors through A_d. A violation is an
            implementation defect.
        required_metrics:
          - exact minimum tail weight at d = 1 and d = 2, as integers, per declared window
          - MITM versus enumeration agreement (exact equality, boolean, plus the two integers)
          - eliminated-class fraction at d = 2 versus d = 1, as exact rational counts
          - measured wall-clock and peak memory for both methods, so the 2^{8d}/2^{16d} claim is checked rather than asserted
      falsification_criterion: >-
        FALSIFIED IF: MITM and enumeration disagree at d = 2 (implementation, STOP);
        or the measured MITM time/memory does not track 2^{8d} within a factor 4
        (the complexity claim is wrong as implemented); or the d = 2
        eliminated-class fraction is no larger than d = 1's (the ladder buys
        nothing and the extra rung is not worth its cost -- a real and useful
        negative); or the d = 2 SHA-0 and SHA-1 recurrences coincide (the structural
        claim in P1(D) is wrong).
      dominated_by:
        status: unresolved_pending_tier_c_acquisition
        why_not_null: >-
          Same reason as P1 and it is not weakened by repetition: the likely
          dominators are unopened. `null` would assert a check nobody performed.
        frontier_rows_checked:
          - >-
            Pramstaller-Rechberger-Rijmen (recalled) -- coding theory applied to
            SHA-1 DV search. If minimum-weight computation over DV codes is already
            there, this is dominated outright.
          - >-
            Manuel (recalled, ePrint 2008/469 identifier seen, not opened) --
            classification and GENERATION of DVs; generation implies a search over
            the code and may already include weight minimisation.
          - >-
            Stevens JLCA (recalled) -- exact optimal joint local-collision cost,
            which dominates a weight proxy on the COST axis if it covers the same
            space.
          - >-
            General coding theory (Brouwer-Zimmermann minimum weight, information-set
            decoding, recalled): dominates the ALGORITHM completely. The algorithm is
            not claimed as new.
          - >-
            Memory axis: full enumeration at O(1) memory dominates MITM on memory
            and is the better choice at d = 2 if compiled; MITM only wins at d >= 3.
            Stated because a Pareto check that ignores the axis where the proposal
            LOSES is not a check.
      sota_delta:
        quantitative: >-
          Screening cost only. Time exponent 2^{16d} -> 2^{8d} for the exact
          minimum-weight computation (d = 3: 2^48 -> 2^24, a factor 2^24), at memory
          O(1) -> 2^{8d} (d = 3: 2^24 words ~ 128 MB). NO ATTACK COST IS AFFECTED.
          Against the alternative of not computing it at all -- this program's actual
          status quo -- the delta is an exact integer where there is currently none.
      target_complexity:
        time_exponent: "2^{8d} joins with O(80d) work per candidate; d = 2: 2^16, d = 3: 2^24"
        memory_exponent: "2^{8d} entries; d = 2: 2^16 (negligible), d = 3: 2^24 (~10^2 MB)"
        best_known: >-
          For general codes, information-set decoding beats naive MITM asymptotically
          (recalled). NOT CLAIMED TO BE OPTIMAL; MITM is chosen because it is exactly
          checkable against enumeration at d = 2, which ISD is not as easily.
        hidden_overhead: >-
          The join cost hides a factor for collision handling, and the "declared
          window" choice can change the answer by more than the algorithmic saving.
          The window is therefore declared before the run and any change is a new run.
        tradeoff_note: >-
          Explicit and it is the reason this is an `algorithm` proposal: full
          enumeration is 2^{16d} time / O(1) memory, MITM is 2^{8d} time / 2^{8d}
          memory. On a 4-core / 15 GB machine the crossover is near d = 3, and the
          parallelisation position is trivially embarrassing (independent halves).
      heuristic_assumptions:
        - id: H8
          statement: >-
            ASSUME the level-d filtration codes have no exploitable structure that
            makes their minimum weight anomalously small or large relative to a
            random [80d, 16d] code, so that MITM behaves at its generic cost.
          rigorous_support: >-
            Rigorous part: MITM's worst-case cost is 2^{8d} regardless of structure,
            so the COST claim needs no assumption. H8 is only about whether the
            resulting minimum weight is INFORMATIVE (i.e. differs from the random
            baseline), which is exactly what the null-object control measures.
          validation_plan: >-
            SAMPLE: 100 seeded random [160,32] codes, minimum tail weight each.
            COMPARE: the SHA-1 filtration code's value against that empirical
            distribution, reported as a z-score AND as a raw pair of integers, never
            as a verdict. TAIL CHECK: report the extreme random values observed, so a
            claimed anomaly is judged against the observed range and not against an
            assumed one.
      proof_search_map:
        bottleneck: >-
          d = 1 is provably blind to SHA-0/SHA-1; the raw code is unenumerable. The
          bottleneck is the cost of exactness at the first rung that can be
          SHA-1-specific, and MITM is the standard device for it.
        baseline_embedding:
          parameter_slice: >-
            d = 2 computed by full enumeration IS the baseline, and the MITM must
            reproduce it exactly. That is a genuine embedding: same object, same
            window, same integer.
          reproduction_check: exact integer equality between the two methods at d = 2, frozen as a fixture
        observation_collision:
          observable: the level-d minimum tail weight
          distinct_preimage_search: >-
            Search for two DISTINCT declared windows with the same minimum weight but
            materially different eliminated-class fractions. That would show the
            minimum weight alone is the wrong summary and the fraction is the
            quantity to report -- a cheap check that the headline number is the right
            headline.
        constructive_transforms:
          - transform: specialization_pack
            proposed_object: split the information set into two provably disjoint halves and charge tail weight additively across the split
            predicted_gain: exact minimum at 2^{8d} rather than 2^{16d}, with the disjointness making the additive charge sound
        quantifier_order: >-
          FOR ALL declared windows T and levels d, THERE EXISTS a codeword achieving
          the reported minimum, AND FOR ALL codewords the reported minimum is a lower
          bound. The MITM must certify both directions -- exhibiting the achieving
          codeword is part of the output, not an afterthought, because a minimum
          without a witness is an unfalsifiable number.
        method_ceiling:
          strongest_certifiable_claim: >-
            An exact minimum tail weight and an exact eliminated-class fraction at
            level d, for a declared window. Never a cost, never a path, never a
            novelty claim.
          nearby_object_control: >-
            SHA-0 at d = 2, where the recurrences must now DIFFER. This is the
            control that d = 1 fails by construction, and passing it here is the
            evidence that the ladder buys SHA-1-specificity rather than only
            resolution.
        proof_obligations:
          - claim: "the level-d code has parameters [80d, 16d]"
            responsibility: size
          - claim: "MITM returns the exact minimum with a witness"
            responsibility: correctness
          - claim: "MITM cost is 2^{8d} time and memory"
            responsibility: runtime
          - claim: "level-d bound >= level-(d-1) bound classwise"
            responsibility: correctness
          - claim: "informativeness versus a random code of the same parameters"
            responsibility: feasibility
            note: THIS IS H8.
      novelty_status: unverified
      novelty_screen:
        corpus_outcome: >-
          No record in this repository computes a minimum weight of any code, DV or
          otherwise. IDEA-20260816-3edd14 enumerates a DV class for detector coverage
          but computes no weight minima and is a different goal's object.
        verdict: >-
          unverified, with declared LOW novelty on the algorithm and the dominator
          named. Its priority rests on being the necessary second rung of P1, not on
          being new -- which the search heuristics explicitly allow provided it is
          said out loud, and it is.
      citations:
        - ref: "Pramstaller, Rechberger, Rijmen -- Exploiting coding theory for collision attacks on SHA-1"
          provenance: recalled
          claim: RECALLED POINTER, NOT SUPPORT. Named as the most likely dominator.
          verified_by: null
        - ref: "Brouwer-Zimmermann minimum-weight computation; information-set decoding"
          provenance: recalled
          claim: >-
            RECALLED POINTER, NOT SUPPORT. Standard coding-theoretic minimum-weight
            machinery, named so that no reader mistakes the algorithm for a
            contribution of this program.
          verified_by: null
      assumptions:
        - P1's minimal test passed. If the commutation check failed, P6 has no object and must not run.
      confounders:
        - >-
          A compiled 2^32 enumeration may beat an unoptimised Python MITM at d = 2,
          making the measured timings say nothing about the exponent. Both must be
          implemented at the same optimisation level or the comparison is void.
      interpretation_limits:
        - Screening cost only; no attack cost is affected and no path is claimed new.
        - An eliminated-class fraction is scoped to the declared window and to H1's weight-to-cost step.
      estimated_cost:
        implementation: medium
        compute: medium
      recommended_priority: low-medium

  # ===================================================================
  ranking:
    method: >-
      Ranked by expected information gain per unit cost, where information gain is
      counted as: (a) can the test come back negative in a way that changes what a
      later batch does, (b) does it depend on the census being populated -- which it
      currently cannot be -- and (c) is the claim it supports inside this batch's
      `analyzed` ceiling.
    order:
      - rank: 1
        handle: P1
        rationale: >-
          The only proposal whose core structural claim is PROVED IN PLACE rather
          than hoped for, whose object provably passes the lossy-projection test,
          which needs no census, no acquisition and no literature to run, and whose
          most likely disappointing outcome (a vacuous d=1 screen) is itself the
          measured obstruction that decides P6. It also predicts its own control
          failure at d=1 in advance, which is the strongest available evidence that
          the design was not tuned to pass.
      - rank: 2
        handle: P2
        rationale: >-
          Equal in cost to P1 and the only proposal that turns the firewall into an
          instrument: a ranking frozen and hashed while genuinely blind is an
          out-of-sample test that becomes impossible the moment anyone reads a
          published support. Ranked below P1 only because its abstraction's
          soundness rests on H3/H4 where P1's rests on an ideal-theoretic identity,
          and because its novelty is currently UNCHECKABLE rather than merely
          unchecked.
      - rank: 3
        handle: P5
        rationale: >-
          Highest strategic value per second: the MD5 arm of this goal is blocked on
          another goal's decision, and this supplies the one input that decision
          provably lacks, using planted objects only. Ranked third rather than first
          because it depends on EXP-DIFFP-fe894e producing a canonicaliser, and
          because its positive result is weak by construction (one adversary).
      - rank: 4
        handle: P3
        rationale: >-
          Cheapest test in the set and a genuine closure at the section-4 standard,
          but its expected outcome is the predicted one and it changes a batch plan
          rather than a measurement. Its real value is pre-emptive: it stops a later
          batch spending itself on a re-coordinatisation.
      - rank: 5
        handle: P4
        rationale: >-
          The only proposal producing a CERTIFIED artifact, which is why it is in the
          set at all, but it is the most expensive to implement, is dominated on
          every axis that matters, and sits closest to the IR-9 solver-validation
          boundary. Worth doing once the screens exist and have something to cash.
      - rank: 6
        handle: P6
        rationale: >-
          Necessary second rung of P1 and the first rung that can be SHA-1-specific,
          but it is gated on P1 passing, its algorithm is standard and declared
          non-novel, and at d=2 a compiled enumeration may make the MITM moot. Do
          not start it before P1's histogram says whether d=1 is vacuous.
    cheapest_valid_discriminator:
      named: >-
        P1 step (1) plus step (3): the A_d commutation check at d = 1 and d = 2
        against the full 32-bit SHA-1 expansion on 1000 seeded draws, together with
        the identical check on the SHA-0 expansion.
      why_it_is_the_cheapest_valid_one: >-
        It is roughly twenty lines of code and a few seconds of compute, needs no
        census, no acquisition, no solver, no literature and no quarantined content,
        and it is VALID rather than merely cheap because it can fail in two distinct
        and consequential directions. If the commutation fails, the entire ideal
        structure of P1 claim (A) is wrong and P1, P6 and half of P3's forward
        guidance collapse together -- for the price of one test. If the SHA-0 and
        SHA-1 d=1 recurrences come out DIFFERENT, then claim (D) is wrong in the
        direction that would make the cheap rung more useful than advertised, which
        is equally a falsification of what was written and equally worth knowing.
        Every other test in the set is either downstream of this one or depends on an
        artifact that does not yet exist.
    what_this_ranking_is_not: >-
      It assigns no work, changes no hypothesis status, and approves nothing. The
      Coordinator ranks; this is an input to that ranking and nothing downstream may
      cite it as evidence.

  # ===================================================================
  honest_accounting:
    protocol_ref: docs/inventor-protocol.md section 5
    objects_considered:
      admitted:
        - "SHA-1 DV under the ideal quotients A_d (P1, P6) -- lossy, compatible, admitted"
        - "MD5 delta_m support with cancellation set (P2) -- lossy, soundly abstract, admitted"
        - "the digest of a canonical form, as a leakage object (P5) -- lossy, admitted"
        - "the (DV, N, certificate) tuple (P4) -- not an abstraction; a certification target"
      rejected_with_reason:
        - object: DV restricted to a window of >= 16 consecutive steps
          reason: >-
            NOT LOSSY. The expansion is invertible, so any 16 consecutive words form
            a basis and the restriction is injective. A change of coordinates, not an
            object (P3, proved).
        - object: per-word Hamming-weight profile / run-length statistics of a DV
          reason: >-
            LOSSY BUT NOT COMPATIBLE. Weight does not propagate through XOR, so the
            one-step propagation is not deterministic. Admissible as a screening
            STATISTIC, never as a tracked object; recorded so a later session does not
            re-derive the confusion.
        - object: MD5 state difference truncated to its low k bits (the 2-adic filtration)
          reason: >-
            LOSSY BUT NOT COMPATIBLE, AND THE REASON IS STRUCTURAL AND WORTH KEEPING.
            Reduction mod 2^k commutes with modular addition and with the bitwise round
            functions, so it propagates deterministically through everything EXCEPT the
            per-step rotation, which moves low bits to high ones. Because MD5's rotation
            amounts VARY step to step, no single truncation window is preserved, and
            tracking all windows is tracking everything. THIS IS EXACTLY WHY THE MD5 SIDE
            ADMITS NO ANALOGUE OF P1's LINEAR-CODE COVERING ARGUMENT while the SHA-1 side
            does: SHA-1's expansion uses ONE fixed rotation and is GF(2)-linear, so
            rotation is multiplication by a unit in a chain ring; MD5's step function is
            neither. The asymmetry the handoff asserted is here given its mechanism.
        - object: "a delta_m family generalising the published MD5 lineage"
          reason: >-
            REFUSED ON FIREWALL GROUNDS, NOT ON MERIT, AND THE DISTINCTION MATTERS. Any
            such object would require the published characteristic as its seed, which is
            Tier A. Recorded as refused-not-screened so that no later reader mistakes an
            absence for a judgement.
    depth_of_verified_structure: >-
      NOTHING IN THIS SET IS VERIFIED. No experiment was run, no measurement was
      taken, and this role holds no run_commands capability. The tiers actually
      reached are: (i) ALGEBRAIC DERIVATION SHOWN IN PLACE, checkable by a reader
      without compute -- P1 claims (A) and (D), P3's injectivity, the MD5 rotation
      asymmetry above; (ii) DESIGN ONLY -- every minimal test, every predicted
      distribution, every cost figure; (iii) RECALLED POINTERS -- every external
      citation. Nothing has been re-derived against a primary source, because no
      primary source was opened.
    dominated_by_summary:
      P1: unresolved_pending_tier_c_acquisition (Pramstaller-Rechberger-Rijmen named as most likely dominator)
      P2: unresolved_and_currently_uncheckable (dominators are Tier-B and blocked)
      P3: "n/a for the mathematics (elementary, presumed known); the closure is internal"
      P4: dominated on every axis that matters (full 80-step SHA-1 collisions are published)
      P5: "n/a (no cryptanalytic result claimed); internally downstream of AMD-20260824-DIFFP-ACQ-1"
      P6: unresolved_pending_tier_c_acquisition; algorithm declared standard and non-novel
      no_unchecked_nulls: >-
        NO FIELD IN THIS SET IS SET TO A BARE `null`. Where the frontier could not be
        checked, the reason is named and the specific unopened rows are listed, which
        is the only honest form the answer can take under AGENTS.md rule 5.
    sota_delta_summary: >-
      NO ATTACK EXPONENT IS MOVED BY ANY PROPOSAL IN THIS SET, and the set says so
      six times rather than once. The exponents that move are SCREENING exponents:
      2^512 -> 2^16 exactly-enumerable classes for the SHA-1 DV space (P1), 2^512 ->
      2^16 supports for the MD5 delta_m space (P2), and 2^{16d} -> 2^{8d} for exact
      level-d minimum weight (P6). Against the internal baseline the delta is
      countable and small: this program currently holds zero enumerations, zero
      covering numbers, zero certified conforming pairs and zero leakage bounds for
      either primitive, and each proposal would move exactly one of those from zero.
    enumerated_closures:
      - id: C1
        scope: "candidate tracked objects for SHA-1 DVs of the form 'restrict to a step window'"
        obstruction: >-
          The expansion is invertible, so restriction to any window containing 16
          consecutive steps has singleton fibres and discards nothing.
        argument: >-
          dim C = 512 and 16 words carry exactly 512 bits; solving the recurrence for
          W_{i-16} runs the window backward and forward, so the restriction determines
          the codeword uniquely.
        measurement_status: >-
          NOT YET MEASURED. The obstruction is stated as an argument with an exact
          predicted quantity (rank 512 for 16 consecutive steps, 480 for 15), and P3's
          minimal test is what would turn it into an `obstruction` block with integer
          values. Recorded as argued-not-measured, per section 4's requirement that a
          prose-only obstruction is not yet at standard.
        forward_guidance: see P3 forward_guidance_required_by_section_4 -- four named open classes
        resource_check: >-
          THE SECOND READING, ASKED RATHER THAN SKIPPED: which theory takes invertibility
          as its HYPOTHESIS rather than its refutation? Answer: the equivalence relation
          itself. Invertibility is exactly what makes E1 (step_shift_sha1) well defined --
          a shifted seed window regenerates the same codeword BECAUSE the expansion is
          invertible in both directions. The property that kills the window object is the
          property that licenses the shift generator. That is a real reversal and it is
          recorded for EXP-DIFFP-fe894e's E1 verification rather than kept here.
      - id: C2
        scope: "wordwise GF(2)-linear abstractions of a SHA-1 DV compatible with the expansion"
        obstruction: >-
          There are exactly 33 of them (the ideals m^d of the chain ring
          GF(2)[x]/(x+1)^32), they form a chain, and the cheapest nontrivial one is
          provably blind to the SHA-0/SHA-1 distinction.
        argument: P1 claim (A) and (D), derived in place.
        measurement_status: ARGUED, NOT MEASURED. P1's commutation check is what would measure it.
        forward_guidance: >-
          The class is CLOSED as an enumeration and OPEN as a resource: d = 2 and d = 3
          are unexplored and affordable, and non-wordwise or nonlinear abstractions lie
          entirely outside this closure and are untouched by it.
        resource_check: >-
          Which theory wants "there are only 33"? The census equivalence: a complete list
          of admissible linear abstractions is also a complete list of the linear
          canonical forms a census could be indexed by, which bounds how finely the
          declared equivalence of EXP-DIFFP-fe894e could ever be refined by linear means.
          The closure of the search space is the completeness of the indexing scheme.
      - id: C3
        scope: "the MD5 analogue of the P1 covering argument"
        obstruction: >-
          MD5's varying per-step rotations mean no truncation window of the state
          difference is preserved, so the 2-adic filtration -- the natural analogue of
          the (x+1)-adic one -- is compatible with the arithmetic but NOT with the step
          function.
        argument: see honest_accounting.objects_considered.rejected_with_reason, third entry
        measurement_status: >-
          ARGUED, NOT MEASURED, and it is the one closure here that a reader could
          plausibly overturn with a cleverer choice of filtration. Recorded at that
          strength deliberately.
        forward_guidance: >-
          The MD5 side must therefore use SOUND OVER-APPROXIMATION (P2's abstract
          interpretation) rather than exact quotients. Open: whether a rotation-aware
          abstraction over the 32 cyclic offsets simultaneously admits a compact
          representation -- untried, and not obviously hopeless.
      - id: C4
        scope: NOT A CLOSURE, RECORDED SO IT IS NOT MISTAKEN FOR ONE
        text: >-
          The MD5 lane of this goal is BLOCKED PENDING A GOAL-MD5-001 DECISION. It is not
          screened out, not deprioritised on the merits, and not concluded to be
          exhausted. Two live routes exist: the Tier-B unblocking decision, and P2/P5
          which need no unblocking at all. Recording it as a closure -- or letting it
          become one by never asking -- would be premature closure under
          inventor-protocol section 4.
    premature_closure_check: >-
      THIS SESSION DID NOT DECLINE TO GENERATE ON SATURATION GROUNDS AND DID NOT
      CONCLUDE THAT MD5 OR SHA-1 IS MINED OUT. Six proposals were produced against a
      target the field regards as finished, and the two structural results that came
      out of the session (the 33-element abstraction list, the window-injectivity
      obstruction) were both found by taking the object question seriously rather than
      by consulting the literature -- which this session could not do. Where a lane is
      closed above, it is closed with a named obstruction, an argument, a stated
      measurement status and forward guidance naming what remains. Where a lane is
      merely blocked, it says BLOCKED and names the route.
    open_directions:
      - >-
        THE BINDING CONSTRAINT REMAINS ACQUISITION, AND THIS SESSION CONFIRMS IT FROM A
        SECOND ANGLE: four of six proposals have `dominated_by` values that cannot be
        resolved without opening a Tier-C source. Batch 2's acquisition task is
        specified by acquisition-targets.yaml.
      - >-
        A DECLARED DISTANCE on canonical forms (EXP-DIFFP-fe894e's own open direction)
        would let P1's class bound and the census interact as a graded measurement
        rather than as a predicate. Untouched here.
      - >-
        The rotation-aware MD5 abstraction named in C3's forward guidance.
      - >-
        Whether the P1 filtration interacts with the declared equivalence generators:
        E2 (bit rotation) acts on the word space and therefore acts on each R/m^d;
        computing that action would say whether the equivalence and the abstraction
        commute, which determines whether a covering number can be quoted per orbit
        rather than per class. Cheap, and not proposed above only because it presumes
        E2 verifies.
      - >-
        Nothing in this set touches the near-collision PATH as an object, only the DV
        and the delta_m. That is a whole half of the tracked object of RQ-DIFFP-a5c483
        and it is left open, deliberately and visibly.
