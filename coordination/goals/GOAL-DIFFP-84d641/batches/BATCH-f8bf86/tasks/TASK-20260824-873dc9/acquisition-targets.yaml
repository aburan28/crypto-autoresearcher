  acquisition_sequencing_recommendation:
    caveat: >-
      A RECOMMENDATION, NOT AN ASSIGNMENT. This role assigns no work and allocates
      no identifiers; sequencing is the Coordinator's to decide.
    order:
      - "TGT-C-09 (FIPS 180-4 / FIPS 180) FIRST -- lowest risk, discharges a stated gap in the frozen contract, and every other SHA-1 artifact depends on a pinned expansion."
      - "TGT-C-01 (Manuel) SECOND -- the classification is the census-plus-equivalence object this goal was built to need, and it is the highest-value single document in the list."
      - "TGT-C-02 (Pramstaller-Rechberger-Rijmen) THIRD -- resolves the dominated_by fields of P1 and P6, which is the difference between two `unresolved` proposals and two checked ones."
      - "TGT-C-03 (Chabaud-Joux) FOURTH -- the SHA-0 control's primary source."
      - "TGT-C-04..C-08 as budget allows."
      - "NO TIER-B ENTRY IS SEQUENCED AT ALL until a committed GOAL-MD5-001 decision exists. TGT-A-01 is never sequenced."
    what_acquisition_would_change: >-
      Stated as a prediction so the acquisition batch is falsifiable rather than
      open-ended: acquiring TGT-C-01 and TGT-C-02 would move the readable SHA-1
      census from 0 entries to a nonzero number and would resolve P1's and P6's
      `dominated_by` in one direction or the other. IF BOTH ARE ACQUIRED AND THE
      SHA-1 CENSUS IS STILL UNPOPULATABLE -- because the sources turn out to carry
      classifications without DV tables, say -- that is a measured and reportable
      outcome about the literature's machine-readability, and it is exactly the
      pause_condition GOAL-DIFFP-84d641 names.
