        blind rediscovery from the specification. How much it teaches is a question
        this goal does not own and would be the wrong place to decide, since it is
        the goal that benefits from the permissive answer.
      unblocking_route: >-
        A committed GOAL-MD5-001 coordinator decision that either (a) rules Tier-B
        material acquirable because its calibration criterion is discharged or is
        scoped narrowly to the Wang path, or (b) extends BCP-1 over all published
