        OBTAIN ANY OF IT FROM THIS GOAL.
      acquisition_status: REFUSED_BY_EVERY_ROUTE
      rule: >-
        NOT ACQUIRED, NOT FETCHED, NOT PARSED, NOT RECONSTRUCTED, NOT PARAPHRASED
