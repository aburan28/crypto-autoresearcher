      basis: >-
        This is BCP-1's content. Acquiring it here would launder GOAL-MD5-001's
        firewall while leaving its text intact, contaminating that goal's
        blind-rediscovery criterion exactly as completely as opening the
        quarantined file.
      escalation_route: >-
        NONE AVAILABLE TO THIS GOAL. Any change is GOAL-MD5-001's decision to make
