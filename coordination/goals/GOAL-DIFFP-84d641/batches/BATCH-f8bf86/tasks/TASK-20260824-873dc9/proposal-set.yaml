  # ===================================================================
  proposals:

    - handle: P1
      title: >-
        The (x+1)-adic filtration of the SHA-1 disturbance-vector word space: an
        exactly-enumerable ladder of lossy DV abstractions, with the d=1 rung a
        [80,16] binary code enumerable in full at 2^16
      class: representation
      primitive: sha1
      claim: >-
        (A) STRUCTURAL, PROVED IN PLACE, NOT CONDITIONAL: identify a 32-bit word
        with an element of R = GF(2)[x]/(x^32+1). Since 32 = 2^5, x^32+1 =
        (x+1)^32 over GF(2), so R is a local chain ring with maximal ideal
        m = (x+1) and m^32 = 0, and its ONLY ideals are m^d for d = 0..32. SHA-1's
        one-bit rotation ROL1 is multiplication by x = 1 + (x+1), a unit of R.
        A GF(2)-subspace of R is invariant under ROL1 iff it is closed under
        multiplication by x, hence under all of GF(2)[x], hence is an ideal.
        THEREFORE the wordwise GF(2)-linear projections of the word space that
        commute with the SHA-1 message expansion are EXACTLY the 33 quotient maps
        A_d : R -> R/m^d, d = 0..32, and they form a chain.
        (B) COMPUTABLE CONSEQUENCE: applying A_d wordwise to a DV carries the
        expansion recurrence W_i = ROL1(W_{i-3} + W_{i-8} + W_{i-14} + W_{i-16})
        to a recurrence over R/m^d, so the image of the DV code is a binary linear
        code of length 80d and dimension 16d -- [80,16] at d=1, [160,32] at d=2,
        [240,48] at d=3 -- which is EXACTLY enumerable at cost 2^{16d}.
        (C) SCREENING CONSEQUENCE: if a DV word's image under A_d is nonzero then
        the word is nonzero, so for any declared step window T, (bit-weight of the
        DV on T) >= (number of words of T active in the DV) >= (number of steps of
        T where the A_d image is nonzero). The last quantity is constant on each
        A_d class. So A_d partitions the entire 2^512 DV space into 2^{16d} classes
        of EQUAL size 2^{512-16d}, each carrying an exactly-computed lower bound on
        tail weight, and the fraction of the DV space eliminated by a declared
        tail-weight budget T_max EQUALS the fraction of classes eliminated.
        (D) THE d=1 RUNG IS PROVABLY BLIND TO THE SHA-0/SHA-1 DISTINCTION, and
        this is a prediction, not a caveat: A_1 is the word-parity map, parity is
        invariant under ROL1, so the d=1 recurrence p_i = p_{i-3} + p_{i-8} +
        p_{i-14} + p_{i-16} is IDENTICAL for SHA-0 (no rotation) and SHA-1 (one
        rotation). At d=2 the action of x on R/m^2 in the basis {1, t=(x+1)} is
        (a0,a1) -> (a0, a0+a1), which is NOT the identity, so d=2 separates them.
        d >= 2 IS THEREFORE NECESSARY for any statement that is SHA-1-specific
        rather than shared with SHA-0.
      mechanism: >-
        The published census (whatever it contains -- this program has not read
        it) is a list of DVs selected for low cost. Selection happened at the level
        of the DV itself. The mechanism by which unexamined DVs could survive there
        is that a per-instance selection procedure produces instances, not a
        COVERING of the space: it says these are good, never that nothing else is.
        A_d converts the covering question from an unbounded search over 2^512
        codewords into an exact enumeration over 2^{16d} classes, so "which regions
        of the DV space are excluded by a tail-weight budget" becomes a computation
        rather than a rhetorical claim. The reason a published census would miss
        the STATEMENT (not necessarily the instances) is that a covering statement
        is not what an attack paper is for.
      tracked_object: >-
        The image A_d(DV) in (R/m^d)^80 -- a length-80d binary vector -- together
        with its per-step nonzero indicator and the induced tail-weight lower
        bound. Concretely at d=2 the object per word is the ordered pair
        (parity of all 32 bits, parity of the 16 odd-indexed bits), evolving under
        (a0,a1) -> (a0, a0+a1) at each expansion rotation.
      lossy_projection_test:
        verdict: PASSES, and the pass is proved rather than argued.
        lossiness: >-
          A_d has fibres of size 2^{32-d} per word, so at d=1 the projection
          discards 31 of every 32 bits and at d=2 it discards 30 of 32. Over an
          80-word DV the fibre of a class has size 2^{512-16d}, i.e. 2^496 at d=1.
          It is not remotely a change of coordinates.
        compatibility: >-
          What is discarded is discarded COMPATIBLY with the target's operation:
          m^d is an ideal, hence closed under multiplication by x (= ROL1) and
          under addition (= XOR), which are the only two operations the message
          expansion performs. So A_d(expand(DV)) is computable from A_d(DV) alone
          and the retained part propagates DETERMINISTICALLY, step by step, with no
          branching and no probability.
        contrast_with_a_failing_candidate: >-
          The complementary candidate -- restrict the DV to a window of steps --
          FAILS this test and P3 proves it fails. That contrast is what makes the
          test load-bearing here rather than decorative.
      object_scoring:
        genuinely_new_or_repackaging: >-
          UNRESOLVED AND HONESTLY SO. The ingredients (DV lives in a linear code;
          coding theory applies to DV search) are old; a recalled pointer to
          Pramstaller-Rechberger-Rijmen, "Exploiting coding theory for collision
          attacks on SHA-1", is named as the single most likely dominator and as a
          Tier-C acquisition target. What is claimed as this session's own content
          is narrower and is internal: (i) the COMPLETENESS statement in claim (A)
          -- that the 33 ideals are the entire list of admissible wordwise linear
          abstractions -- and (ii) the d=1 SHA-0-blindness in claim (D). Whether
          either appears in that paper is UNKNOWN to this program and is decided by
          acquisition, not by argument.
        concretely_testable: >-
          YES, and at the lowest possible cost. One-step propagation is a
          two-line map on 2d bits and its correctness is checkable by exhaustive
          agreement against the full 32-bit expansion on seeded random words.
        survival_depth: >-
          SURVIVES THE ENTIRE MESSAGE EXPANSION EXACTLY (all 80 steps, zero loss of
          determinism, because the abstraction is exact on the linear part).
          DISSOLVES at the step function: the DV abstraction says nothing about
          whether the local collisions placed at the set bits can be corrected,
          because the additions and the round functions are not GF(2)-linear. So
          the honest depth is: exact over the expansion, silent over the state.
      minimal_discriminating_test:
        budget_seconds: 60
        budget_note: >-
          Modelled at well under 60 s in unoptimised Python; declared inside the
          300 s ceiling with a large margin. NOT RUN BY THIS TASK -- this role has
          no run_commands capability and no run occurred.
        design: >-
          (1) COMMUTATION CHECK. For d = 1 and d = 2, draw 1000 seeded random
          16-word seed windows, expand to 80 words under the full SHA-1 expansion,
          apply A_d wordwise, and compare against expanding the A_d image directly
          under the abstract recurrence. Require EXACT agreement on all 80 words of
          all 1000 draws. (2) EXACT ENUMERATION AT d=1. Enumerate all 2^16 = 65536
          codewords of the parity code, and for a declared step window T = [20,79]
          (declared BEFORE the run, and any other window is a separate declared
          run) tabulate the exact distribution of tail weight. Report the full
          histogram, the minimum, and the fraction of classes with tail weight
          above each threshold T_max in 0..60. (3) SHA-0 BLINDNESS CHECK. Run step
          (1) with the SHA-0 expansion (identical recurrence without the rotation)
          and confirm the d=1 abstract recurrences are IDENTICAL and the d=2 ones
          are NOT.
        controls:
          - >-
            NULL OBJECT: run step (2) against 65536 uniformly random length-80
            binary vectors (NOT codewords) drawn from a declared seed. If the
            codeword tail-weight histogram is statistically indistinguishable from
            the random one, the code structure is contributing nothing and the
            screen is a coincidence of length, not of algebra. This is the control
            that stops an artifact being read as structure (inventor-protocol s3).
          - >-
            DEGENERATE BASELINE: A_0 (d=0) must map everything to zero and produce
            a vacuous bound of 0 on every class. A_32 must be the identity and
            reproduce the full DV exactly. Both are checkable and both must hold.
          - >-
            SHA-0 NEARBY-OBJECT CONTROL as step (3), which is a PREDICTED FAILURE
            at d=1 -- the control is designed so that passing it at d=1 would
            falsify claim (D).
        required_metrics:
          - exact integer commutation agreement counts, per d, per draw (hits/attempts)
          - the full 65536-entry tail-weight histogram at d=1 over the declared window
          - minimum, median and maximum tail weight over the d=1 classes, as integers
          - >-
            eliminated-class fraction as an exact rational count (classes above
            T_max)/65536, tabulated over T_max, never as a percentage alone
          - >-
            the null-object histogram and a declared distance between the two
            histograms (total variation), as a number
      falsification_criterion: >-
        THE PROPOSAL IS FALSIFIED, NOT AMENDED, IF ANY OF: (a) the commutation
        check disagrees on even one word of one draw at d=1 or d=2 -- then A_d is
        not compatible with the expansion, the lossy-projection test fails
        retroactively, and claim (A) is wrong; (b) the d=1 image code has dimension
        other than 16 or the d=2 code dimension other than 32 -- then the
        dimension-counting in claim (B) is wrong; (c) the tail-weight histogram at
        d=1 is statistically indistinguishable from the null-object histogram --
        then the screen has no content at d=1 and the ladder must be justified at
        d>=2 or abandoned; (d) the SHA-0 d=1 recurrence differs from the SHA-1 one
        -- then claim (D) is wrong in the direction that would make d=1 MORE useful
        than stated, which is still a falsification of what was written.
      predicted_negative_that_would_still_be_informative: >-
        THE MOST LIKELY DISAPPOINTING OUTCOME IS SPECIFIC AND IS STATED IN ADVANCE:
        the all-zero parity class is one of the 65536 and contains 2^496 DVs with a
        bound of 0, so d=1 can never eliminate more than 1 - 2^-16 of the space,
        and if the tail-weight histogram concentrates at low weight the eliminated
        fraction may be near zero. That would say the d=1 rung is a vacuous screen
        -- which is a measured obstruction with a number attached, and it is
        precisely the measurement that justifies or refuses the d=2 rung (P6).
      dominated_by:
        status: unresolved_pending_tier_c_acquisition
        why_not_null: >-
          `null` IS NOT AVAILABLE HERE AND SETTING IT WOULD BE A FABRICATION UNDER
          AGENTS.md RULE 5. The frontier rows that could dominate this are papers
          this program has never opened. They are named so a reviewer can check
          them, and they are filed as Tier-C acquisition targets so the check
          becomes possible.
        frontier_rows_checked:
          - >-
            Pramstaller-Rechberger-Rijmen, "Exploiting coding theory for collision
            attacks on SHA-1" (recalled, IMA Cryptography and Coding, circa 2005).
            MOST LIKELY DOMINATOR. If it already states the ideal-lattice
            completeness result, claim (A) is `known` and this proposal's residual
            content is only the d=1 SHA-0-blindness and the exact histogram.
          - >-
            Manuel, "Classification and generation of disturbance vectors for
            collision attacks against SHA-1" (recalled; identifier confirmed as
            ePrint 2008/469 / DOI 10.1007/s10623-010-9458-9 in a search listing,
            document NOT opened). If its classification already partitions the DV
            space in a way that refines A_d, the covering content is dominated.
          - >-
            Stevens, joint local-collision analysis line (recalled, EUROCRYPT
            2013). If JLCA already computes exact optimal costs over DV classes,
            the tail-weight lower bound is dominated as a COST statement, though
            not necessarily as a COVERING statement.
          - >-
            Chabaud-Joux (recalled; DOI 10.1007/BFb0055720 confirmed in a search
            listing, document NOT opened) -- the origin of the linearised-code
            framing. Dominates the framing, not the filtration.
          - >-
            Wang-Yin-Yu, full SHA-1 (recalled). Dominates on ATTACK COST
            unconditionally; this proposal makes no attack-cost claim and so is
            not comparable on that axis rather than being non-dominated on it.
        axes_checked: time, memory, data/queries -- see target_complexity
      sota_delta:
        quantitative: >-
          SCREENING COST ONLY, STATED AS AN EXPONENT AND NOT AS AN ATTACK GAIN.
          Exhaustive characterisation of the DV space is 2^512 objects. A_1 reduces
          the exactly-enumerable screening object to 2^16 = 65536 classes, A_2 to
          2^32, A_3 to 2^48; the reduction at d=1 is a factor 2^496 in the size of
          the object enumerated. The price is one-sidedness: the bound is a LOWER
          bound on tail weight, so classes are eliminated soundly and retained
          classes are NOT certified good. Maximum achievable elimination at d=1 is
          1 - 2^-16 of the space, and the actually-achieved figure is the measured
          output of the minimal test, not a prediction made here.
        explicitly_not_claimed: >-
          NO ATTACK EXPONENT IS MOVED. This does not reduce the cost of any SHA-1
          collision attack by any factor, and any reading of the 2^496 figure as an
          attack speedup is a misreading. Per docs/target-result-profile.md the
          honest label is: this is exponent-moving for the SCREEN and
          constant-factor-irrelevant for the ATTACK.
      target_complexity:
        time_exponent: >-
          2^{16d} exact enumeration of the level-d screening code (2^16 at d=1,
          2^32 at d=2, 2^48 at d=3); per-class tail-weight evaluation is O(80d)
          bit operations.
        memory_exponent: >-
          O(80d) words if the histogram is streamed; O(2^{16d}) only if every class
          is retained, which is unnecessary at d=1 and is the reason P6 exists at
          d>=2.
        best_known: >-
          NOT ESTABLISHED IN THIS PROGRAM. The best known screening or covering
          cost for the SHA-1 DV space is exactly what acquisition would tell us and
          this program does not hold it. Recording "unknown" is the honest value;
          any number here would be invented.
        hidden_overhead: >-
          The o(1)-equivalent hiding place is the CONVERSION from a tail-weight
          lower bound to a cost lower bound, which is not free and is isolated as
          heuristic H1 rather than absorbed. The enumeration itself hides nothing:
          it is a literal loop over 2^{16d} codewords.
        tradeoff_note: >-
          At d>=2 the minimum-weight computation is the standard
          time-memory-tradeoff object of coding theory (full enumeration 2^{16d}
          time / O(1) memory, versus meet-in-the-middle or information-set decoding
          at roughly 2^{8d} time / 2^{8d} memory). That tradeoff is P6's content,
          not this proposal's; here it is named so the frontier position is
          visible.
      heuristic_assumptions:
        - id: H1
          statement: >-
            FORMALLY: let c(DV, T) be the true cost, in the sense of the
            probability-weighted condition count over the declared step window T, of
            the near-collision path induced by placing local collisions at the set
            bits of DV. ASSUME there exist constants alpha > 0 and beta such that
            c(DV, T) >= alpha * w_T(DV) - beta, where w_T(DV) is the bit-weight of
            DV restricted to T. That is: cost is bounded below by a linear function
            of tail weight.
          rigorous_support: >-
            The rigorous half is the exact combinatorial inequality proved in claim
            (C): w_T(DV) >= (number of steps of T where A_d(DV) is nonzero), which
            requires no assumption at all. H1 is ONLY the step from weight to cost,
            and it imitates the standard local-collision accounting recorded in
            this corpus at knowledge/techniques/KN-TECH-066.md (each local collision
            spends degrees of freedom; freedom degrees are finite and the count
            belongs in the claim). It is NOT a theorem and is not presented as one.
          validation_plan: >-
            SAMPLE: for a step-reduced SHA-1 at N in {24, 32, 40} steps, draw 200
            seeded DVs per level-d class stratum, place local collisions at the set
            bits, and count the induced conditions with the conformance verifier
            EXP-DIFFP-fe894e builds. COMPARE: regress counted conditions on w_T and
            report alpha-hat, beta-hat with residuals, against the null model
            "condition count independent of w_T". TAIL CHECK: report the
            single lowest-cost DV observed at each weight, and check that no
            observed cost falls below the fitted lower envelope; a single violation
            at small N falsifies the linear form and the correct response is to
            report the violating DV, not to refit. TRANSFER ASSUMPTION, STATED:
            that alpha, beta fitted at N in {24,32,40} carry to N = 80 is NOT
            assumed and NOT claimed; the screen is reported at the N where it was
            measured.
        - id: H2
          statement: >-
            ASSUME the DV space relevant to any future search is the FULL codeword
            space of the linearised expansion, so that class-uniform elimination
            over A_d classes is elimination over the search space of interest.
          rigorous_support: >-
            Rigorous part: A_d is a surjective linear map, so its 2^{16d} classes
            partition the 2^512 codewords into blocks of exactly equal size
            2^{512-16d}; the eliminated FRACTION of codewords therefore equals the
            eliminated fraction of classes exactly. The assumption is only that no
            further declared restriction (a fixed number of near-collision blocks, a
            fixed step window, a fixed bit-position preference) shrinks the space
            non-uniformly across classes.
          validation_plan: >-
            SAMPLE: draw 10^5 seeded codewords uniformly and confirm empirically
            that the class-occupancy histogram is flat to within binomial error --
            a direct check of the equal-block-size claim in the implementation
            rather than on paper. If a declared search restriction is later
            imposed, re-measure occupancy UNDER that restriction and report the
            new, possibly non-uniform, occupancy rather than reusing this figure.
      proof_search_map:
        bottleneck: >-
          The exact step whose removal changes the statement: deciding, for an
          arbitrary declared tail-weight budget, WHICH DVs are excluded -- currently
          a search over 2^512 objects, which is why the covering question in
          RQ-DIFFP-a5c483 has never been answered here. A_d replaces it with an
          enumeration of 2^{16d} classes.
        baseline_embedding:
          parameter_slice: >-
            d = 32 is the exact old boundary: A_32 is the identity, the level-32
            "abstraction" is the DV itself, and the level-32 screen is the
            unabstracted search. The ladder therefore CONTAINS the baseline as its
            top rung rather than merely resembling it.
          reproduction_check: >-
            Symbolic and frozen: assert A_32 = identity on 10^4 seeded random words,
            and assert that the level-32 image code equals the DV code by comparing
            expansions word-for-word. Both are exact equality checks, not curve
            similarity.
        observation_collision:
          observable: >-
            The A_d class index of a DV, and the tail-weight lower bound it carries.
          distinct_preimage_search: >-
            BY CONSTRUCTION the observable collides massively -- 2^{512-16d} DVs per
            class -- and that is the POINT, not a defect, because the bound is
            one-sided. THE AUDIT THAT MATTERS IS THE OTHER DIRECTION and it is
            required: search for two DVs in the SAME class whose true costs differ
            by more than a declared factor (say 2^10 in path probability at a
            step-reduced N). Finding such a pair does not falsify soundness of the
            bound; it MEASURES how far the abstraction is from being a cost
            invariant, and that number is what tells a later batch whether A_d can
            ever be used for ranking rather than only for exclusion. Reporting it is
            mandatory; a large value is a real limitation and must be published as
            one.
        constructive_transforms:
          - transform: representation_reduction
            proposed_object: >-
              Move the DV from the 32-bit word space to the chain ring R and read
              rotation as multiplication by a unit; the hypothesis "invariant under
              the expansion" becomes the exact algebraic condition "is an ideal",
              which has a complete and finite answer.
            predicted_gain: >-
              Turns "which abstractions are admissible" from an open-ended design
              question into a list of length 33, with encoding, completeness and
              soundness obligations each isolated as a separate proof obligation
              below.
          - transform: stronger_invariant
            proposed_object: >-
              Retain d bits per word instead of the 1 bit that suffices for the
              final tail-weight statement, because the extra bits are what survive
              the SHA-0/SHA-1 separation and what the recursion up the ladder needs.
            predicted_gain: >-
              d = 2 recovers SHA-1-specificity that d = 1 provably cannot have.
        quantifier_order: >-
          EXPLICIT. FOR ALL d in 0..32, FOR ALL DVs V in the code, THERE EXISTS NO
          dependence of A_d on V: the abstraction map is fixed BEFORE any V is seen,
          which is what makes the class bound uniform. The elimination claim is:
          FOR ALL declared windows T and budgets T_max, FOR ALL classes K with
          bound(K) > T_max, FOR ALL V in K, cost(V) exceeds the budget -- the
          witness order runs class-first, and it is NOT claimed that for every V
          outside those classes there EXISTS a good path. The one-sidedness is a
          quantifier fact, not a hedge.
        method_ceiling:
          strongest_certifiable_claim: >-
            The most this method can ever certify is a SOUND LOWER BOUND on tail
            weight that is constant on classes, hence an EXCLUSION statement over at
            most 1 - 2^{-16d} of the DV space. It can never certify that a retained
            DV admits a usable path, can never produce a path, and can never bound
            cost from above.
          nearby_object_control: >-
            SHA-0. The control is run and, at d=1, IT IS PREDICTED TO FAIL -- the
            method provably cannot distinguish SHA-0 from SHA-1 at that rung. A
            method that cannot separate the closest object where the structure
            differs has not identified the load-bearing structure, so every d=1
            number must be reported as a statement about the SHARED expansion
            parity structure and never as a SHA-1 result. This is stated before the
            run, in advance of any temptation to soften it afterwards.
        proof_obligations:
          - claim: "x^32+1 = (x+1)^32 over GF(2) and R is a local chain ring with ideals exactly m^d"
            responsibility: correctness
          - claim: "ROL1-invariant GF(2)-subspaces of R are exactly the ideals"
            responsibility: correctness
          - claim: "the level-d image code has length 80d and dimension exactly 16d"
            responsibility: size
          - claim: "A_d(expand(V)) is computable from A_d(V) alone, exactly"
            responsibility: interface
          - claim: "nonzero abstract image implies nonzero word, hence the weight inequality"
            responsibility: correctness
          - claim: "enumeration cost is 2^{16d} with O(80d) per class"
            responsibility: runtime
          - claim: "weight lower bound implies cost lower bound"
            responsibility: feasibility
            note: THIS IS H1 AND IS THE ONLY CONDITIONAL LINK IN THE CHAIN.
          - claim: "results at d=1 are shared with SHA-0 and are not SHA-1-specific"
            responsibility: scope
      novelty_status: unverified
      novelty_screen:
        corpus_queries_run: see retrieval-log.yaml R1a..R1e
        corpus_outcome: >-
          knowledge/ contains exactly one technique entry describing disturbance
