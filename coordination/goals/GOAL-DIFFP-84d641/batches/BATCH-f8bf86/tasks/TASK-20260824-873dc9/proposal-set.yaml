      assumptions:
        - The SHA-1 expansion recurrence is as implemented from FIPS 180-4 and gated on the two published digests in EXP-DIFFP-fe894e inputs.specifications.sha1.
        - The declared step window T is fixed BEFORE the enumeration and any change of window is a new declared run, not a re-read of the same one.
      confounders:
        - >-
          IMPLEMENTATION BIT-ORDER. The identification of a word with an element of
          R depends on a chosen bit-order convention; getting it backwards turns
          ROL1 into ROR1, which is multiplication by x^{-1} -- still a unit, so the
          ideal structure survives, but the d=2 action matrix transposes. The
          commutation check catches this, which is why it is step (1) and not an
