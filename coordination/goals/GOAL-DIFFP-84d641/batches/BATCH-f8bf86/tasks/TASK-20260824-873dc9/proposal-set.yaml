    - handle: P2
      title: >-
        The MD5 message-schedule activity support as the tracked object: an exact
        2^16 enumeration of delta_m supports scored by a declared abstract
        condition lower bound, with the ranking PRE-REGISTERED BLIND so the
        firewall becomes the calibration mechanism instead of only a cost
      class: representation
      primitive: md5
      claim: >-
        (A) Let sigma(delta_m) = { i : delta_m_i != 0 } be the SUPPORT of an MD5
        message-difference vector -- 16 bits of information, discarding all 512
        bits of magnitude and sign. MD5's message schedule is a fixed permutation
        of the 16 words in each of the four rounds, so sigma determines EXACTLY
        which of the 64 steps inject a message difference, with no dependence on
        the values. (B) On the abstract lattice {inactive, active} per working
        variable, the step function propagates an active input to an active output
        UNLESS a cancellation occurs, and a cancellation is a value-level event.
        Therefore the abstract activity pattern propagates deterministically as an
        OVER-APPROXIMATION, and every concrete path over support S is an
        instantiation of one abstract path over S with a declared cancellation set
        C. (C) Define the abstract cost of (S, C) as |C| plus the number of active
        steps in the final round. Then min over C of that cost is computable per
        support by a dynamic program over 64 steps with state = the activity of the
        last four working variables (16 states), so ALL 65536 supports can be
        scored exactly in seconds. (D) THE PREDICTION IS PRE-REGISTERED BLIND: the
        full ranking of the 65536 supports is computed and its canonical
        serialisation is HASHED NOW, before this program has ever seen a published
        MD5 support. If GOAL-MD5-001 ever rules that the published support may be
        disclosed to this goal, whether it lands in the top 5% of that frozen
        ranking is a falsifiable prediction made in advance and checkable against
        the frozen hash.
      mechanism: >-
        Why paths could live outside the published lineage in a way a census would
        miss: the published attacks needed ONE good delta_m each, and the search
        that found them was a search for an instance. Nothing in an instance search
        produces a statement about the other 65535 supports. The abstract score
        makes the whole support space commensurable at once. And the mechanism by
        which the score could be WRONG is equally concrete -- if the abstract cost
        ignores the thing that actually determines path quality (bit positions,
        rotation amounts, the round-3 XOR transparency), the published support will
        rank badly, and the pre-registered hash makes that outcome unfakeable.
      tracked_object: >-
        The pair (S, C): a 16-bit support and a cancellation set over the 64 steps,
        with the induced abstract activity vector. NOT a delta_m, NOT a signed-bit
        path, NOT a condition table. The object literally cannot express a
        published characteristic, which is precisely why it can be worked on under
        the firewall.
      lossy_projection_test:
        verdict: PASSES, with the loss being one-sided and that one-sidedness stated as the object's defining property.
        lossiness: >-
          sigma discards 512 bits of magnitude and sign and retains 16. The fibre
          over a support of size k has (2^32 - 1)^k elements. It is not a change of
          coordinates by any margin.
        compatibility: >-
          The retained part propagates deterministically ON THE ABSTRACT LATTICE:
          the schedule permutation maps supports to step-activity exactly, and the
          abstract step rule (active in -> active out, unless a declared
          cancellation) is a total function once C is fixed. This is abstract
          interpretation, and the honest statement is that the abstraction is SOUND
          (every concrete path refines some abstract path) and INCOMPLETE (an
          abstract path may have no concrete refinement). Soundness is what a lower
          bound needs; incompleteness is why a retained support is never certified.
        why_not_merely_a_truncated_differential_renamed: >-
          It IS the hash-function analogue of a truncated differential, and saying
          so is the point of the repackaging axis rather than a concession. The
          content is not the idea of truncating; it is that the truncation makes
          the delta_m space EXACTLY enumerable at 2^16 and that MD5's schedule
          permutations make the abstract propagation value-free.
      object_scoring:
        genuinely_new_or_repackaging: >-
          MODERATE REPACKAGING RISK, DECLARED. Support/activity reasoning
          unquestionably informs how published delta_m were chosen, but this
          program cannot check whether an exhaustive support-level enumeration and
          ranking exists, BECAUSE THE SOURCES THAT WOULD SAY SO ARE TIER B AND ARE
          BLOCKED. That is a real and reportable consequence of the firewall: THE
          MD5 AXIS CANNOT CURRENTLY BE NOVELTY-CHECKED AT ALL by this goal. Filed
          as such rather than resolved by assertion.
        concretely_testable: >-
          YES. One-step propagation is a 16-state transition; the DP is exact and
          its output is an integer per support.
        survival_depth: >-
          SURVIVES ALL 64 STEPS on the abstract lattice. DISSOLVES the moment a
          question requires bit positions -- rotation amounts, carry behaviour,
          round-function transparency -- because the object has forgotten them. The
          dissolution point is exactly at the boundary where a real path would be
          constructed, and P2 makes no attempt to cross it.
      minimal_discriminating_test:
        budget_seconds: 120
        design: >-
          (1) SCHEDULE PIN. Read the four MD5 round schedules from the RFC 1321 copy
          ALREADY COMMITTED in this repository (the GOAL-MD5-001 pin, sha256 recorded
          in EXP-DIFFP-fe894e inputs.specifications.md5) -- a specification, not path
          data, and no acquisition. Assert the recalled forms (round 2 index
          (1+5i) mod 16, round 3 (5+3i) mod 16, round 4 (7i) mod 16) against the pin
          and STOP on any mismatch rather than adjusting either to fit.
          (2) DP SCORE. Run the 16-state dynamic program over all 65536 supports;
          emit the exact integer minimal abstract cost per support.
          (3) FREEZE. Canonically serialise the full ranking, hash it, and record
          the digest in the run manifest. This is the pre-registration and it must
          happen in the same run as (2).
          (4) SOUNDNESS CHECK AGAINST PLANTED PATHS. Take the planted MD5 paths
          EXP-DIFFP-fe894e generates from its declared seeds (a planted path is the
          actual differential a seeded random message pair induces, so it needs no
          literature), extract each one's support and its ACTUAL condition count,
          and require the DP's abstract lower bound to be <= the actual count on
          every one. A single violation falsifies soundness.
        controls:
          - >-
            NULL OBJECT: score 65536 supports under a RANDOMISED schedule (four
            random permutations of the 16 words, declared seed) instead of MD5's.
            If the score histogram is indistinguishable from MD5's, the ranking is
            measuring the shape of the DP and not the shape of MD5's schedule --
            a controlled null, not a finding.
          - >-
            DEGENERATE BASELINE: the empty support must score 0 and the full support
            must be scored without error; both are checkable by hand.
          - >-
            SOUNDNESS CONTROL as step (4), which is the only step that can catch a
            wrong abstract cost model.
        required_metrics:
          - the sha256 of the frozen canonical ranking, recorded in the run manifest
          - the exact integer score histogram over all 65536 supports
          - >-
            per planted path: (abstract lower bound, actual condition count) as an
            integer pair, and the count of violations, which must be 0
          - total variation distance between the MD5-schedule and random-schedule score histograms
      falsification_criterion: >-
        FALSIFIED IF: (a) any planted path's actual condition count is BELOW its
        support's abstract lower bound -- the cost model is unsound and the whole
        screen is void; (b) the score histogram under MD5's real schedule is
        statistically indistinguishable from the randomised-schedule null -- the
        ranking carries no MD5-specific information; (c) the recalled schedule
        constants disagree with the committed RFC pin -- then the recollection was
        wrong and everything built on it stops; (d) LATER AND MOST INFORMATIVELY,
        if the published support is ever disclosed and ranks OUTSIDE the top 5% of
        the frozen ranking, the abstract cost model does not capture what makes a
        delta_m usable.
      why_the_blind_pre_registration_is_the_point: >-
        The Coordinator asked for proposals that work WITH the acquisition gap
        rather than assume it away. This one converts the firewall from a pure cost
        into the calibration mechanism: because this program has never seen a
        published MD5 support, a ranking frozen NOW is genuinely blind, and its
        later check is a real out-of-sample test of the kind that is normally
        impossible to arrange. The same logic the Coordinator applied to
        `digest_mediated_census` in AMD-20260824-DIFFP-ACQ-1, applied to a ranking
        instead of to a path. IT REQUIRES NO TIER-A OR TIER-B ACCESS NOW and it
        creates no pressure to obtain any.
      dominated_by:
        status: unresolved_and_currently_uncheckable
        why_not_null: >-
          Not null, and the reason is itself the finding: the frontier rows that
          would dominate an MD5 delta_m screening claim are Tier-B sources
          (Stevens' automated path construction and the tunnels line) that this
          goal is forbidden to fetch pending a GOAL-MD5-001 decision. `null` would
          assert a check that CANNOT currently be performed.
        frontier_rows_checked:
          - >-
            Stevens' automated MD5 differential-path construction (recalled, Tier B,
            BLOCKED). Most likely dominator: if delta_m selection there is already
            exhaustive at support level, claim (C) is dominated.
          - >-
            Klima's tunnels (recalled, Tier B, BLOCKED). Dominates on freedom-degree
            exploitation, an axis this proposal does not touch.
          - >-
            The Wang-Feng-Lai-Yu lineage (Tier A, REFUSED BY EVERY ROUTE). Not
            checked and NEVER TO BE CHECKED BY THIS GOAL. Recorded as a permanent
            hole in this proposal's frontier check, not as an oversight.
        axes_checked: >-
          time, memory, data/queries -- but the check is INCOMPLETE by construction
          and the incompleteness is declared rather than papered over.
      sota_delta:
        quantitative: >-
          SCREENING COST ONLY. Exhaustive characterisation of the delta_m space is
          (2^32)^16 = 2^512 vectors; the support abstraction reduces the
          exactly-enumerable object to 2^16 = 65536, a factor 2^496, with a 16-state
          DP of 64 steps per support (~10^8 elementary operations total). NO ATTACK
          COST IS REDUCED BY ANY FACTOR and no collision is made cheaper. Against
          the relevant internal baseline the delta is sharper and worth stating
          plainly: this repository currently holds ZERO enumerations of the MD5
          support space, so the delta is 65536 scored supports versus 0.
        explicitly_not_claimed: >-
          Not an exponent improvement for any attack. Per the handoff's instruction
          not to inflate: the exponent that moves is the screen's, and the screen is
          a measurement instrument.
      target_complexity:
        time_exponent: "2^16 supports x 64 steps x 16 DP states = 2^16 * 2^10 ~ 2^26 elementary operations"
        memory_exponent: "2^16 integers for the ranking (~0.5 MB); O(16) for the DP state"
        best_known: >-
          UNKNOWN TO THIS PROGRAM AND CURRENTLY UNKNOWABLE BY IT (Tier-B block).
          Stated as unknown rather than guessed.
        hidden_overhead: >-
          The abstraction's incompleteness is the hidden cost and it is not in an
          o(1): a retained support may have NO concrete realisation at all, so the
          survivor count over-counts the genuinely reachable set by an unmeasured
          factor. Measuring that factor requires realising paths, which is a later
          batch's contract.
        tradeoff_note: not applicable at this scale; the enumeration is small and serial.
      heuristic_assumptions:
        - id: H3
          statement: >-
            FORMALLY: each cancellation event in the abstract path costs at least
            one sufficient condition on the working state, and each active step in
            the final round costs at least one. Hence cost(concrete path) >=
            |C| + (active final-round steps) for every concrete refinement.
          rigorous_support: >-
            The rigorous half: a cancellation is the event that two nonzero
            contributions to a modular addition sum to zero, which is a nontrivial
            constraint on the state and therefore not free. The assumption is only
            the specific accounting "at least one condition each", imitating the
            freedom-degree accounting recorded at KN-TECH-066 (message modification
            spends freedom against a CHOSEN path; the count belongs in the claim).
          validation_plan: >-
            SAMPLE: every planted MD5 path EXP-DIFFP-fe894e produces from its
            declared seeds (>= 8), plus 200 further seeded planted paths at
            step-reduced MD5 (32 and 48 steps). COMPARE: the integer pair (abstract
            bound, actual condition count) per path; the predicted relation is
            bound <= actual with no exception. TAIL CHECK: report the path with the
            SMALLEST slack (actual minus bound); a slack of zero is fine, a negative
            slack falsifies H3 outright and the violating path is reported rather
            than the model refitted. TRANSFER: results at 32/48 steps are NOT
            assumed to carry to 64 and the scope is reported at the step count
            measured.
        - id: H4
          statement: >-
            ASSUME the abstract score is MONOTONE with respect to true path quality
            in the weak sense that a support whose abstract score exceeds the total
            available degrees of freedom admits no concrete path within the freedom
            budget.
          rigorous_support: >-
            Rigorous anchor: the total freedom in one MD5 block is 512 message bits
            (plus chaining freedom for multi-block), a finite and exactly known
            quantity (KN-TECH-066: freedom degrees are finite and the count belongs
            in the claim). The assumption is that the abstract score is a valid
            charge against that budget, which follows from H3 only for the
            conditions H3 counts.
          validation_plan: >-
            SAMPLE: the survivor set under increasing thresholds; report the
            survivor-count curve as an integer function of the threshold. CHECK: no
            planted path may have a support whose score exceeds 512. A planted path
            violating that bound falsifies H4 immediately and cheaply.
      proof_search_map:
        bottleneck: >-
          Choosing delta_m. Every published MD5 attack begins from a chosen
          message-difference vector, and the choice is the step whose automation
          changes what a search can do; this program has no procedure for it and no
          measurement of the choice space.
        baseline_embedding:
          parameter_slice: >-
            The full-information limit is the identity abstraction (retain all 512
            bits), at which the "screen" is the original 2^512 search. The support
            abstraction is the 16-bit rung of that same ladder, so the baseline is
            the slice "retain everything".
          reproduction_check: >-
            Frozen fixture: for the planted paths, check that abstracting to the
            support and back to the abstract activity vector reproduces exactly the
            activity vector computed directly from the concrete path (equality of
            two 64-bit vectors, per path). Not a similarity check.
        observation_collision:
          observable: the (support, minimal abstract cost) pair.
          distinct_preimage_search: >-
            REQUIRED AND EXPECTED TO SUCCEED: find two planted paths with equal
            support and materially different actual condition counts, and report the
            spread. That is the direct measurement of how much the abstraction
            forgets. A large spread does not falsify the lower bound but DOES
            falsify any use of the score as a RANKING, and the proposal's own
            pre-registered top-5% prediction is exactly what that spread would
            attack. Reporting it is mandatory even when inconvenient.
        constructive_transforms:
          - transform: specialization_pack
            proposed_object: >-
              Build a problem-specific resource measure (the abstract cost) that
              charges only over provably disjoint events (distinct cancellation
              steps), so the charges add without double counting.
            predicted_gain: >-
              A sound additive lower bound computable by DP, which is what makes the
              2^16 enumeration meaningful rather than decorative.
          - transform: observable_fiber
            proposed_object: >-
              Hold the support fixed and vary the forgotten magnitudes, looking for
              an intrinsic invariant (rotation-amount alignment, round-3 XOR
              transparency) that separates the resulting paths.
            predicted_gain: >-
              Names the next rung of the ladder if the spread measured above is
              large -- i.e., turns a disappointing result into the specification of
              the successor object rather than into a dead end.
        quantifier_order: >-
          EXPLICIT. FOR ALL supports S, FOR ALL concrete delta_m with sigma = S, FOR
          ALL conforming paths P for that delta_m, THERE EXISTS an abstract path
          (S,C) refined by P, and cost(P) >= score(S,C) >= min_C score(S,C). The
          witness (S,C) DEPENDS ON P and that dependence is allowed, because the
          claim quantifies over the minimum. It is NOT claimed that for each S there
          EXISTS a concrete path achieving min_C -- the abstraction is incomplete
          and the missing direction is named.
        method_ceiling:
          strongest_certifiable_claim: >-
            A sound lower bound on condition count per support, hence an EXCLUSION
            of supports whose bound exceeds the freedom budget. It can never
            certify that a surviving support is usable, can never produce delta_m
            magnitudes, and can never produce a path or a colliding pair.
          nearby_object_control: >-
            MD5 WITH RANDOMISED SCHEDULES (the null object above), and additionally
            MD4-like reduced schedules if a later batch wants a second control. A
            method whose score histogram is identical under a randomised schedule
            has not identified the load-bearing structure, which is MD5's specific
            permutations.
        proof_obligations:
          - claim: "MD5 round schedules are the four declared permutations"
            responsibility: baseline
          - claim: "the abstract step rule is sound: every concrete path refines an abstract path"
            responsibility: correctness
          - claim: "the DP computes min_C exactly over 16 states and 64 steps"
            responsibility: correctness
          - claim: "cancellations and final-round activity each cost >= 1 condition"
            responsibility: feasibility
            note: THIS IS H3.
          - claim: "score above 512 excludes the support within one-block freedom"
            responsibility: feasibility
            note: THIS IS H4.
          - claim: "enumeration is 2^16 supports at 2^10 operations each"
            responsibility: runtime
          - claim: "a surviving support is NOT certified realisable"
            responsibility: scope
      novelty_status: unverified
      novelty_screen:
        corpus_queries_run: see retrieval-log.yaml R1a..R1e
        corpus_outcome: >-
          No record under knowledge/ or ledger/ contains an enumeration or ranking
          of MD5 message-difference supports. KN-TECH-066 is the only technique
          entry touching message modification and contains no delta_m selection
          procedure. No MD5 path data is readable anywhere in this repository (the
          single source is quarantined).
        verdict: >-
          `unverified`, AND ADDITIONALLY UNCHECKABLE: the sources that would settle
          it are Tier B and blocked. Recording that as a distinct state matters,
          because "unverified because nobody looked" and "unverified because looking
          is forbidden" call for different remedies -- the second is unblocked only
          by a committed GOAL-MD5-001 decision.
      citations:
        - ref: RFC 1321 (MD5), committed pin at coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
          provenance: internal
          claim: >-
            The MD5 specification, including the four round schedules. IT CARRIES NO
            PATH DATA and is not covered by any tier of AMD-20260824-DIFFP-ACQ-1;
            it is already committed, so no acquisition is required. THIS TASK DID
