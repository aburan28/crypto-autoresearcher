          KN-LIT-2958 / KN-LIT-4387 / KN-LIT-4909 at title level, and contains no
          enumeration, no code-theoretic structure and no covering notion. No
          KN-LIT entry in this corpus carries disturbance-vector data. The nearest
          internal record is IDEA-20260816-3edd14 (GOAL-SHA1-001), which proposes
          enumerating the DV class to measure DETECTOR coverage; the object there
          is the detector criterion and the boundary is drawn in
          GOAL-DIFFP-84d641 non_duplication. This proposal's object is an
