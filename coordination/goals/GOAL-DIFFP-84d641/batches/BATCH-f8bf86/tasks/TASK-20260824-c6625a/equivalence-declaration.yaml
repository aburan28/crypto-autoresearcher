equivalence_declaration:
  experiment_id: EXP-DIFFP-fe894e
  task_id: TASK-20260824-c6625a
  seed: 20260824
  quantifier_order: FOR EVERY candidate path P, THERE EXISTS a census entry C and THERE EXISTS g in <verified
    generators> with g(P) = C; g may depend on BOTH P and C. It is NOT claimed that a single g works for
    all P, and NOT claimed that the group is the full symmetry group of the difference space.
  generators:
    E1:
      id: E1
      name: step_shift_sha1
      statement: A SHA-1 DV is a codeword of the linearized expansion; two DVs related by a whole-step
        shift of the expansion window are the same codeword read at a different offset.
      verification_check: expand from the shifted seed window and require exact equality over the overlapping
        steps, forward shifts (1, 2, 3, 4, 5, 6, 7, 8) and backward shifts (1,4,8), on 64 seeded random
        codewords
      passed: 704
      failed: 0
      verdict: VERIFIED
      failing_case: null
      scope_limit: Shift at CONSTANT LENGTH only; a different step_range length or extent is a declared_non_generator
        and is never absorbed.
      extra: {}
    E2:
      id: E2
      name: bit_rotation_sha1
      statement: 'CONJECTURE: SHA-1''s expansion and step function commute with a simultaneous left-rotation
        of every message word.'
      verification_check: 'part 1, expansion: rot(expand(DV),b) == expand(rot(DV,b)) for all b in 0..31
        on 64 seeded codewords; part 2, step function: a conforming pair is carried to a conforming pair
        for the rotated path. EITHER failing excludes E2.'
      passed: 2048
      failed: 248
      verdict: EXCLUDED
      failing_case: 'rotation b=1: the rotated pair conforms to the rotated path at only 18/80 steps (first
        mismatch at step 18); SHA-1''s step function adds modularly and adds a FIXED constant K_t, neither
        of which commutes with a bit rotation'
      scope_limit: null
      extra:
        expansion_pass: 2048
        expansion_fail: 0
        step_function_pass: 0
        step_function_fail: 248
        recalled_pointer_note: The Coordinator's recollection that published DV families carry a rotation
          index is a `recalled` pointer and was NOT treated as a reason to admit E2.
    E3:
      id: E3
      name: global_sign_flip
      statement: Swapping the two members of the message pair negates every signed difference; a path
        and its negation are the same object.
      verification_check: negate every signed difference and require the negated path to be conforming
        for the swapped pair, exactly, on 64 seeded planted paths per primitive
      passed: 128
      failed: 0
      verdict: VERIFIED
      failing_case: null
      scope_limit: null
      extra: {}
    E4:
      id: E4
      name: signed_digit_representation_md5
      statement: A modular difference in Z/2^32 has many binary signed-digit representations; the canonical
        form is the modular difference itself.
      verification_check: round-trip 4096 seeded random modular differences through the signed-digit encoder/decoder;
        then require two DISTINCT signed representations of one modular difference to canonicalise identically
        and to admit the same conforming pairs on a planted path
      passed: 4368
      failed: 0
      verdict: VERIFIED
      failing_case: null
      scope_limit: null
      extra:
        roundtrip_pass: 4096
        roundtrip_fail: 0
        distinct_representation_pass: 256
        distinct_representation_fail: 0
        conforming_pair_pass: 16
        conforming_pair_fail: 0
    E5:
      id: E5
      name: condition_set_normalisation
      statement: Two paths whose sufficient-condition sets have the same solution set are the same object;
        the canonical form is a declared normal form of the condition set.
      verification_check: on a bounded condition alphabet (8 boolean variables; atoms lit/eq/neq), enumerate
        the solution set of the condition string and of its normal form over all 2^8 assignments and require
        exact set equality, on 256 seeded random condition strings
      passed: 256
      failed: 0
      verdict: VERIFIED
      failing_case: null
      scope_limit: 'DECIDED ON THE BOUNDED ALPHABET ONLY: 8 variables, atoms lit/eq/neq, full 2^8 enumeration.
        This is NOT a claim that the normal form is decidable on the full per-step 32-bit condition sets
        of a real characteristic; that is untested here and is a stated limit.'
      extra: {}
    E6:
      id: E6
      name: block_index_reuse
      statement: The same per-block characteristic used at a different block index or from a different
        chaining value is the same object AS A PER-BLOCK CHARACTERISTIC.
      verification_check: 'part (a) the conformance predicate does not read the block index (structural:
        conforms() has no such parameter) and re-indexing leaves every verdict identical; part (b) at
        a second seeded chaining value, 4096 seeded draws per step_range in ((0, 0), (0, 3)), require
        condition-satisfying draws > 0 (non-vacuity) and zero condition-satisfying non-conforming draws.
        GATED ON THE CONJUNCTION OF BOTH RANGES, fixed before the run.'
      passed: 17
      failed: 1
      verdict: EXCLUDED
      failing_case: 'step_range (0, 3): 0 of 4096 seeded draws at the second chaining value satisfied
        the conditions, 0 of those did not conform (VACUOUS: no draw satisfied the conditions, so the
        implication is empty and is NOT reported as a pass)'
      scope_limit: null
      extra:
        per_step_range:
          (0, 0):
            draws: 4096
            conditions_satisfied: 2089
            condition_satisfying_nonconforming: 0
          (0, 3):
            draws: 4096
            conditions_satisfied: 0
            condition_satisfying_nonconforming: 0
  verified_generator_set_STRICT:
  - E1
  - E3
  - E4
  - E5
  excluded_generator_set:
  - E2
  - E6
  declared_non_generators:
  - a different set of active message words
  - a different Hamming weight of delta_m or of the DV
  - a different number of near-collision blocks
  - a DV outside the linearized code
  - a different step_range (length/extent)
  strict_group_is_exactly_the_verified_subset: true
  two_verdicts_reported_separately: The adjudicator reports STRICT (verified generators only) and PERMISSIVE
    (all six declared, including the excluded ones) as two separate fields. They are never merged, averaged
    or reported as one number (IR-5). Excluding a real equivalence over-declares novelty; admitting a
    false one under-declares it; both bounds are reported so the direction of any error is visible.
  declared_interpretations:
    E1_vs_declared_non_generators: E1 shifts the window OFFSET at CONSTANT LENGTH. A different step_range
      LENGTH or extent is a declared_non_generator and is never absorbed. This is the only reading under
      which both frozen clauses hold, and it is recorded as a stated choice.
    E6_gate: E6's chaining-value clause was gated on the CONJUNCTION of step ranges (0,0) and (0,3), fixed
      before the run, so that the range could not be selected after seeing which passes. A range in which
      no draw satisfies the conditions makes the implication vacuous and is NOT reported as a pass.
    condition_set_not_in_membership_key: 'The E5-normalised condition signature is REPORTED beside every
      adjudication and is NOT part of the membership key, because conditions here are derived from the
      witness pair and are sufficient rather than necessary. Consequence, stated: the canonical form is
      COARSER than ''path plus conditions''.'
