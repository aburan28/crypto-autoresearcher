  # =====================================================================
  # SCOPE LIMITS -- stated plainly, not buried
  # =====================================================================
  scope_limits:
    tested_scale: >-
      toy, as the contract declares. 64-4096-sample generator checks, 8 planted
      paths per primitive, 1000 null draws per family, 1024-object CTL-OBS
      slice, canonicalisation over 64- and 80-step 32-bit-word vectors.
    the_load_bearing_limit: >-
      ADJUDICATOR CORRECTNESS AGAINST PUBLISHED PATHS IS UNTESTED THIS BATCH,
      AND THAT IS A SCOPE LIMIT, NOT A PASS. The instrument was validated
      entirely on the SHADOW census of synthetic planted entries, because the
      real census has zero readable entries and cannot validate it. Every
      control here says something about planted paths and declared null draws;
      none says anything about a published characteristic. The transfer
      assumption -- that an adjudicator correct on planted paths and null draws
      is also correct on published paths -- IS NOT ASSUMED AND IS NOT CLAIMED.
    what_a_passing_control_set_licenses: >-
      ONLY: "the adjudicator recalls planted paths and their verified-generator
      images, and rejects the declared null draws, at these parameters, against
      this census."
    what_a_non_member_verdict_means_here: >-
      Against a census with 0 readable entries, NON-MEMBER means "not in an
      empty census". THAT IS NO INFORMATION AT ALL, and every record citing such
      a verdict must say so in the same sentence. It is never novelty.
    what_a_member_verdict_means: >-
      "equivalent to a census entry under the verified generators". Never
      "identical to a published path" and never "already known".
    e5_scope: normal form verified by full enumeration on an 8-variable bounded alphabet only.
    e1_scope: shift at constant length only.
    ctl_nearby_scope: separates the two expansions as this package defines them; the SHA-0 definition is not itself certified against a primary source.
    condition_set_scope: not part of the membership key; see PD-5.
    nothing_here_bears_on: >-
      GOAL-MD5-001's blind calibration criterion, GOAL-SHA1-001's
      detector-coverage question, or the security of any deployed system,
      repository, certificate or archive.

