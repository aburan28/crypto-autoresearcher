  # ---- 8. knowledge retrieval
  knowledge_retrieval:
    search_knowledge_available: false
    verbatim_outcome: >-
      THE `search_knowledge` TOOL IS NOT PRESENT IN THIS SESSION'S TOOL SURFACE.
      The crypto-kb MCP server is configured in .mcp.json and kb/.env exists,
