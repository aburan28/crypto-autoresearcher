  # =====================================================================
  # RESULTS, IN THE CONTRACT'S DECLARED ORDER. INTEGERS, NOT ADJECTIVES.
  # =====================================================================

  # ---- 1. CTL-BASE
  ctl_base:
    verdict: PASSED
    md5_rfc1321_appendix_a5:
      source: coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt
