  # ---- 4. CTL-PLANT and CTL-NULL
  ctl_plant:
    verdict: PASSED
    recall_fraction: 96/96
    recall_hits: 96
    recall_attempts: 96
    per_class:
      md5_planted: 8/8
      md5_E3_image: 8/8
      sha1_planted: 8/8
      sha1_E3_image: 8/8
      sha1_E1_image: 64/64
    orbit_size_distribution: {'2': 8, '10': 8}
    orbit_size_definition: >-
      The number of DISTINCT OBJECTS, under the FINEST identity (serialisation
      with no generator in force), among {planted path} u {its images under
      every verified generator}. It measures how much work the equivalence
      actually does. The 8 MD5 entries have orbit size 2 (identity + E3); the 8
      SHA-1 entries have orbit size 10 (identity + E3 + 8 E1 shifts). NO ORBIT
      HAS SIZE 1, so the equivalence is not doing nothing -- but the sizes are
      small and are stated as integers so nobody has to take that on trust.
    distinct_canonical_forms_per_orbit: 1
    distinct_canonical_forms_note: >-
      A correctness check, not a measure of work: every one of the 16 orbits
      collapses to exactly 1 canonical form.
  ctl_null:
    status: RUN
    vacuous: false
    plantable_census_attestation:
      plantable_entries: 16
      composition: 8 md5, 8 sha1
      statement: >-
        This null was adjudicated against a census containing 16 entries a draw
        could POSSIBLY have matched, so a false positive was possible. A null
        against an empty census would return NON-MEMBER trivially, would have
        measured nothing, and is recorded as VACUOUS under IR-4. That is not
        what was run.
    strict_mode_false_positives_by_family:
      md5_delta_m: 0
      sha1_dv_in_code: 0
      sha1_dv_unconstrained: 0
    permissive_mode_false_positives_by_family:
      md5_delta_m: 0
      sha1_dv_in_code: 0
      sha1_dv_unconstrained: 0
    draws_per_family: 1000
    strict_and_permissive_never_merged: true
    family_b_is_genuinely_the_sharp_one:
      draws_confirmed_in_the_linearized_code: 1000/1000
      note: >-
        in_linearized_code was RECOMPUTED for every draw, never assumed. All
        1000 family-(b) draws are genuine SHA-1 codewords, so each is a
        legitimate disturbance vector and a false positive there was possible in
        the strong sense.
    tail_check_closest_non_matching_draw:
      md5_delta_m: {closest_entry: PLANT-MD5-04, distance_bits: 711, vector_length_bits: 2560}
      sha1_dv_in_code: {closest_entry: PLANT-SHA1-06, distance_bits: 2402, vector_length_bits: 5120}
      sha1_dv_unconstrained: {closest_entry: PLANT-SHA1-03, distance_bits: 2413, vector_length_bits: 5120}
      distance_definition: >-
        Bit distance between the concatenated message-difference and per-step
        modular-difference vectors, minimised over every plantable census entry.
      honest_reading_of_these_numbers: >-
        REPORTED SO THE NULL'S DIFFICULTY CAN BE ATTACKED RATHER THAN ASSUMED,
        which is what the batch note asks for. The two SHA-1 families' closest
        draws sit at 2402 and 2413 bits out of 5120 -- essentially the
        half-length a uniform random vector gives, i.e. the nearest miss was not
        near at all. The MD5 family's 711 of 2560 is below half only because
        delta_m is sparse by construction (Hamming weight matched to the planted
        entries), so the message-difference half of the vector contributes
        little. NOTHING HERE ESTABLISHES THAT THE NULL WAS HARD. On this
        evidence the null was easy, and a control that is easy to pass measures
        less than a control that is hard to pass. The Executor records the
        integers; whether the null was demanding enough is the Red Team's
        question.
    run: RUN-DIFFP-fe894e-controls

  # ---- 5. CTL-OBS, both directions
  ctl_obs:
    direction_i:
      what: two DISTINCT ground-truth objects with EQUAL canonical form
      slice: 1024 seeded planted objects (512 per primitive), full step ranges, seed 84064106
      distinct_objects_examined: 1024
      distinct_canonical_forms: 1024
      collisions_found: 0
      colliding_objects: []
      required_to_be_zero: false
    direction_ii:
      what: known-equivalent images with DIFFERENT canonical forms
      checks: 80
      discrepancies_found: 0
      discrepancies: []
      required_to_be_zero: true
      passed: true
    run: RUN-DIFFP-fe894e-observation-collision

  # ---- 6. CTL-NEARBY
  ctl_nearby:
    n: 1000
    seed: 84064106
    sha0_codewords_testing_as_sha1: 0
    sha0_rate_fraction: 0/1000
    sha1_codewords_testing_as_sha1: 1000
    sha1_rate_fraction: 1000/1000
    separated: true
    limit: >-
      SHA-0's expansion is implemented from the stated one-rotation difference
      and is NOT gated on a published SHA-0 digest, because no SHA-0 source is
      held and IR-10 forbids acquiring one. CTL-NEARBY therefore tests that the
      adjudicator separates the two EXPANSIONS as this package defines them; it
      does not certify the SHA-0 definition itself against a primary source.
    run: RUN-DIFFP-fe894e-nearby-object

  # ---- 7. the quarantine attestation
  ctl_quar:
    path: coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
    sha256_recomputed: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
    sha256_expected: e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5
    match: true
    bytes_hashed: 5583
    parsed: false
    non_reading_attestation: >-
      NO TASK OF TASK-20260824-c6625a READ, PARSED, EXTRACTED, RECONSTRUCTED OR
      PARAPHRASED THE QUARANTINED PAYLOAD. Its bytes were opened 'rb', streamed
      into a sha256 context in 64 KiB chunks, and discarded without ever being
      decoded to text. No field, table, message word, condition or difference
