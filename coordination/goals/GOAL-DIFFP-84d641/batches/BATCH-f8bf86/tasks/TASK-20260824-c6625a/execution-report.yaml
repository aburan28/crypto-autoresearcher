        - 'SHA-1("") = da39a3ee5e6b4b0d3255bfef95601890afd80709'
      provenance_of_the_expected_values: >-
        RECALLED BY THE COORDINATOR and declared in the frozen contract at
        inputs.specifications.sha1. Neither the implementation nor the recalled
        digest was adjusted to fit; both reproduced on the first attempt.
    sha1_vs_independent_implementation:
      pass: 64
      fail: 0
      note: >-
        64 seeded random messages, this implementation versus hashlib.sha1. THIS
        IS WHAT MAKES THE SHA-1 IMPLEMENTATION CHECKABLE WITHOUT FIPS 180-4,
        which this repository does not hold and which IR-10 forbids acquiring.
    sha0_expansion:
      differs_from_sha1: true
      claim_made_about_sha0_digests_or_security: none
    verifier_degenerate_baseline:
      md5: {steps_matching: 64, steps_total: 64, conforming: true, conditions_satisfied: true}
      sha1: {steps_matching: 80, steps_total: 80, conforming: true, conditions_satisfied: true}
    run: RUN-DIFFP-fe894e-buildcheck

  # ---- 2. the per-generator VERIFIED/EXCLUDED table
  equivalence_generators:
    seed: 20260824
    verified_generator_set_STRICT: [E1, E3, E4, E5]
    excluded_generator_set: [E2, E6]
    strict_group_is_exactly_the_verified_subset: true
    table:
      - id: E1
        name: step_shift_sha1
        verdict: VERIFIED
        pass: 704
        fail: 0
        scope_limit: >-
          Shift at CONSTANT LENGTH only. A different step_range length or
          extent is a declared_non_generator and is never absorbed. This
          reading is a DECLARED INTERPRETATION recorded because the frozen
          contract's E1 clause and its declared_non_generators clause would
          otherwise read as contradictory.
      - id: E2
        name: bit_rotation_sha1
        verdict: EXCLUDED
        pass: 2048
        fail: 248
        expansion_pass: 2048
        expansion_fail: 0
        step_function_pass: 0
        step_function_fail: 248
        failing_case: >-
          rotation b=1: the rotated pair conforms to the rotated path at only
          18/80 steps (first mismatch at step 18). SHA-1's step function adds
          modularly and adds a FIXED constant K_t, and neither commutes with a
          bit rotation.
        note: >-
          THE CONJECTURE SPLIT CLEANLY IN TWO AND THE CONTRACT REQUIRED BOTH.
          The expansion part holds exactly -- rot(expand(DV),b) = expand(rot(DV,b))
          for all b in 0..31 on 64 seeded codewords, 2048/2048 -- because the
          expansion is XOR-linear. The step-function part fails on every one of
          248 checks. The Coordinator's recollection that published DV families
          carry a rotation index was treated as a `recalled` pointer and was NOT
          a reason to admit E2.
      - id: E3
        name: global_sign_flip
        verdict: VERIFIED
        pass: 128
        fail: 0
      - id: E4
        name: signed_digit_representation_md5
        verdict: VERIFIED
        pass: 4368
        fail: 0
        roundtrip_pass: 4096
        distinct_representation_pass: 256
        conforming_pair_pass: 16
      - id: E5
        name: condition_set_normalisation
        verdict: VERIFIED
        pass: 256
        fail: 0
        scope_limit: >-
          DECIDED ON THE BOUNDED ALPHABET ONLY: 8 boolean variables, atoms
          lit/eq/neq, full 2^8 enumeration of both the condition string and its
          normal form. This is NOT a claim that the normal form is decidable, or
          solution-set exact, on the full per-step 32-bit condition sets of a
          real characteristic. That is untested here and is a stated limit.
      - id: E6
        name: block_index_reuse
        verdict: EXCLUDED
        pass: 17
        fail: 1
        failing_case: >-
          step_range (0,3): 0 of 4096 seeded draws at the second chaining value
          satisfied the path's conditions, so the implication "conditions
          satisfied => conforming" is VACUOUS at the declared budget and is NOT
          reported as a pass.
        per_step_range:
          '(0, 0)': {draws: 4096, conditions_satisfied: 2094, condition_satisfying_nonconforming: 0}
          '(0, 3)': {draws: 4096, conditions_satisfied: 0, condition_satisfying_nonconforming: 0}
        note: >-
          E6 part (a), block-index independence, PASSED 16/16 and is structural:
          verifier.conforms() has no block-index parameter at all. E6 part (b)
          was gated on the CONJUNCTION of step ranges (0,0) and (0,3), FIXED IN
          CODE BEFORE THE RUN precisely so that the range could not be chosen
          after seeing which one passes. (0,0) passed non-vacuously with 2094
          condition-satisfying draws and zero violations; (0,3) was vacuous. The
          conjunction gate is the stricter choice, so E6 is EXCLUDED. Choosing
          the passing range afterwards would have been an in-run criterion
          change and is exactly what the contract forbids.
    quantifier_order: >-
      FOR EVERY candidate path P, THERE EXISTS a census entry C and THERE EXISTS
      a group element g in <verified generators> with g(P) = C, where g may
      depend on BOTH P and C. It is NOT claimed that a single g works for all P,
      and NOT claimed that the group is the full symmetry group of the
      difference space.
    run: RUN-DIFFP-fe894e-equivalence-verification

