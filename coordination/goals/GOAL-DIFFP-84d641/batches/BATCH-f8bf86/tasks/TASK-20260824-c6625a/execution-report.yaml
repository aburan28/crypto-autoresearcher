      sha256_expected: 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd
      pin_match: true
      vectors_parsed_from_the_pin: 7
      vectors_matching: 7
      vectors_failing: 0
      note: >-
        The seven test vectors were PARSED OUT OF THE COMMITTED PIN, not typed
        from recollection, and the pin was reused rather than re-fetched. The K
        constant table is computed from floor(abs(sin(i+1))*2^32) rather than
