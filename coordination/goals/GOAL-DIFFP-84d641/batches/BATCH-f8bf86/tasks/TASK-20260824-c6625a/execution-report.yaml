      quarantine directory BY PREFIX before any file is opened. The entry
      appears in the census as a pointer with path_data: null, its sha256, its
      KN-LIT id, and an UNDETERMINED orbit, exactly as the contract requires.
    firewall_read_as_content_not_path: >-
      AMD-20260824-DIFFP-ACQ-1 OB-1 obeyed. Tier A was refused by EVERY route,
      not merely at the quarantine path.
    network_attestation:
      network_requests_made: 0
      tier_a_content_obtained: false
      tier_b_content_obtained: false
      tier_c_content_obtained: false
      statement: >-
        ZERO network requests left this task and ZERO bytes of any source, of
        any tier, were acquired. No curl, wget, git fetch or MCP fetch was
        issued at any point. ONE package-manager invocation is disclosed rather
