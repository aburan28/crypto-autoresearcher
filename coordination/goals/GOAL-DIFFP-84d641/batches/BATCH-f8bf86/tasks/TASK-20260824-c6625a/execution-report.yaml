  # =====================================================================
  # RUNS
  # =====================================================================
  runs:
    completed:
      - {run_id: RUN-DIFFP-fe894e-buildcheck, state: completed_valid, wall_seconds: 0.052744, ceiling_seconds: 120, peak_rss_mb: 19.7}
      - {run_id: RUN-DIFFP-fe894e-equivalence-verification, state: completed_valid, wall_seconds: 3.32602, ceiling_seconds: 180, peak_rss_mb: 22.7}
      - {run_id: RUN-DIFFP-fe894e-census-build, state: completed_valid, wall_seconds: 4.11128, ceiling_seconds: 180, peak_rss_mb: 44.0}
      - {run_id: RUN-DIFFP-fe894e-controls, state: completed_valid, wall_seconds: 65.412689, ceiling_seconds: 240, peak_rss_mb: 49.7}
      - {run_id: RUN-DIFFP-fe894e-observation-collision, state: completed_valid, wall_seconds: 7.776846, ceiling_seconds: 120, peak_rss_mb: 60.1}
      - {run_id: RUN-DIFFP-fe894e-nearby-object, state: completed_valid, wall_seconds: 0.06873, ceiling_seconds: 120, peak_rss_mb: 60.1}
    invalid: []
    failed:
      - attempt: 'ATTEMPT-01 (no RUN id was minted; write_run raised before creating any run directory)'
        state: infrastructure_error
        classification: infrastructure_error
        what_happened: >-
          The first execution of `python3 -m harness.diffpath.main` aborted in
          run 1 with AttributeError: module 'sympy' has no attribute 'symbols'.
          harness/runner.py::_verify imports harness.semaev UNCONDITIONALLY,
          before dispatching on the certificate kind, and harness/semaev.py calls
          sympy.symbols at module scope. sympy is not installed in this
          environment. All five downstream runs were correctly recorded NOT RUN
          with their ceilings UNSPENT.
        preserved_at:
          - attempt-01-aborted-run-index.json
          - attempt-01-aborted-raw-observations.json
        why_it_is_preserved: >-
          RECORDED, NOT DISCARDED. Re-running after a failure without recording
          the failed attempt is exactly the practice AGENTS.md forbids, and the
          fact that no run directory was written does not make the attempt
          disappear.
        resolution: See protocol_deviations PD-2 and PD-3.
    maximum_runs_declared: 6
    runs_charged: 6
    all_runs_terminal: true
    missing_runs: none

  # =====================================================================
  # PROTOCOL DEVIATIONS -- recorded, none discarded
  # =====================================================================
  protocol_deviations:
    - id: PD-1
      severity: budget
      what: >-
        THE TASK'S 900 s WALL-CLOCK BUDGET WAS EXCEEDED, and the excess is
        engineering/agent time, not compute. The six charged runs consumed
        80.748 s of wrapper-measured wall clock in total, comfortably inside
        every per-run ceiling. But the Executor session itself ran at least
        1698 s measured from its first timestamped tool call (2026-08-24
        15:08:59Z) to the completion of the runs, and the contract's stopping
        rule says total task wall-clock may not exceed 900 s.
      why_it_was_not_caught_by_a_timer: >-
        The contract's armed deadlines are PER RUN and all six were armed and
        honoured (signal.setitimer on ITIMER_REAL inside the run function). No
        armed deadline exists on the agent session as a whole, so the task
        budget was a declaration rather than an enforcement. That is a real gap
        and it is reported rather than rounded away.
      measurement_caveat: >-
        1698 s is a LOWER BOUND. Contract validation and the reading of
        AGENTS.md, the amendment and the role contract happened BEFORE the first
        timestamped call and are not included; the true figure is larger by an
        unmeasured amount, which is stated rather than estimated.
      not_repaired_in_run: true
    - id: PD-2
      severity: infrastructure
      what: >-
        sympy is not installed in this environment and harness/runner.py imports
        it at module scope. IR-6 forbids editing harness/runner.py. `uv pip
        install --offline --system sympy` was attempted and refused (wheel not
        in the local cache) and IR-10 forbids going to the network.
      resolution: >-
        A DISCLOSED shim at harness/diffpath/_compat/sympy.py, inside this
        task's write scope, placed on sys.path by harness/diffpath/compat.py. It
        reports __version__ = "ABSENT (sympy not installed; harness.diffpath
        disclosed shim)", so every environment.json in this package records the
        TRUTH rather than a plausible-looking version number, which would have
        been a fabrication.
      effect_on_results: >-
        None mathematically. Every certificate in this experiment is kind:
        none. The only observable effect is the environment.json dependency
        string.
    - id: PD-3
      severity: infrastructure
      what: >-
        harness/runner.py::_verify imports harness.semaev unconditionally,
        before dispatching on certificate kind, and semaev calls sympy.symbols
        at import. This aborted ATTEMPT-01 entirely.
      resolution: >-
        harness/diffpath/compat.py installs a stub harness.semaev into
        sys.modules FOR THIS PROCESS ONLY. Its verify_decomposition_certificate
        RAISES if it is ever called, so it cannot silently return a passing
        verification. Every certificate here is kind: none, so it is never
        called. A stub that refuses is the only safe shape for this workaround;
        one that returned True would have been a certificate-discipline breach.
    - id: PD-4
      severity: infrastructure
      what: >-
        pytest is not installed and IR-10 forbids acquiring it (`uv pip install
        --offline --system pytest` refused: wheel not in the local cache).
      resolution: >-
        tests/test_diffpath_adjudicator.py imports pytest with a try/except and
        falls back to a minimal in-file shim providing only mark.parametrize,
        plus a __main__ runner that executes every test function, expands
        parametrised cases, and exits non-zero on any failure. Under a host with
        pytest the file runs unchanged. RESULT: 34 passed, 0 failed, via the
        disclosed fallback runner, NOT via pytest.
    - id: PD-5
      severity: design
      what: >-
        THE E5-NORMALISED CONDITION SIGNATURE IS REPORTED BESIDE EVERY
        ADJUDICATION AND IS NOT PART OF THE MEMBERSHIP KEY. The contract does not
        specify whether the condition set enters the canonical form; this
        Executor chose that it does not.
      when: >-
        Decided and implemented BEFORE any run was charged. It is not an in-run
        repair of a failing control -- no control had been run.
      measured_reason: >-
        This package derives a path's sufficient conditions FROM ITS WITNESS
        PAIR, and the conditions are sufficient rather than necessary, so two
        different pairs realising the SAME differential path routinely yield
        DIFFERENT condition sets. Measured: 9904 of 19999 seeded single-step MD5
        pairs with identical (delta_m, step_delta) carried different condition
        sets (seed 999). A witness-derived set in the membership key would make
        membership depend on which pair happened to exhibit the path, so the
        same path presented with a second witness would fail to match itself.
      the_other_half_of_the_honest_answer: >-
        THE QUESTION WAS RAISED BY COST PROFILING, not by principle: including
        the conditions made the null control roughly 30x slower. Both the
        trigger and the reason are stated so a reviewer can weigh either.
      consequence_stated: >-
        The canonical form is COARSER than "path plus conditions". Two paths
        differing ONLY in their sufficient-condition sets are identified by this
        adjudicator, and CTL-OBS direction (i) would not flag it because the
        ground-truth signature does not include conditions either. This is a
        real limitation of the instrument as built.
    - id: PD-6
      severity: none
      what: >-
        Sibling modules beyond the bound entry point were written under
        harness/diffpath/ as the contract permits: primitives.py, pathobj.py,
        verifier.py, equivalence.py, census.py, runs.py, main.py, compat.py,
        _compat/sympy.py. Disclosed here for the receipt's
        staged_not_in_binding_set.

  # =====================================================================
  # ANOMALIES -- unexpected observations, recorded, none discarded
  # =====================================================================
  anomalies:
    - id: AN-1
      class: infrastructure/provenance defect, program-wide
      severity: high for provenance, zero for mathematics
      finding: >-
        harness/runner.py DEFINES `_inference_block()` TWICE at module level, at
        line 183 and at line 695. Python binds the LAST definition, so line 695
        wins: a hardcoded block with requested_policy "executor-terra" and
        resolved_model_id "none (deterministic harness execution)". The
        definition at line 183 -- the one that imports
        orchestration.adapter.manifest.block_from_env() and records the
        genuinely resolved model -- IS DEAD CODE AND NEVER EXECUTES.
      verified_how: >-
        Independently confirmed in this session by ast.parse of harness/runner.py
        listing module-level FunctionDefs, not by reading and not by taking the
        driving session's report on trust. Both definitions were then read.
      consequence: >-
        CLAUDE.md states that AUTORESEARCH_POLICY / AUTORESEARCH_BACKEND are
        "how harness/runner.py records the exact resolved model in each run
        manifest's inference block". In the current code that mechanism does not
        run FOR ANY GOAL, and every harness-written manifest carries the same
        stale legacy alias regardless of what actually answered. The shadowing
        is what makes this a silent failure rather than a visibly stale
        constant, and a later reader needs that detail to find it.
      handling: >-
        NOT REPAIRED HERE. IR-6 forbids this task from editing harness/runner.py
        and it is outside this task's write_scope; patching shared
        infrastructure while actively writing manifests would be worse than the
        defect. The true values are written instead to
        manifest-supplement.yaml in every run directory. Recorded as an anomaly
        under AGENTS.md rule 8.
      explicitly_not: >-
        This is an infrastructure/provenance defect. IT IS NOT EVIDENCE ABOUT
        MD5, SHA-1, OR ANYTHING MATHEMATICAL.
    - id: AN-2
      class: unexpected observation
      finding: >-
        E2's conjecture failed in a clean and informative two-part split: the
        SHA-1 message expansion commutes with a simultaneous word rotation
        EXACTLY (2048/2048, because the expansion is XOR-linear), while the step
        function does not commute with it in a single one of 248 checks. The
        contract flagged E2 as "the single cheapest thing in this contract that
        could surprise its author in either direction"; the surprise, if there
        is one, is how sharply the two halves separate.
      not_a_conclusion: >-
        Recorded as an observation. No inference is drawn here about whether
        published DV families do or do not carry a rotation index.
    - id: AN-3
      class: unexpected observation
      finding: >-
        E6's chaining-value clause is VACUOUS at 4-step range and NON-VACUOUS at
        1-step range under this package's condition set: 2094 of 4096 draws
        satisfy a 1-step path's conditions, and 0 of 4096 satisfy a 4-step
        path's. The measured content is that the carry-window condition set this
        package derives becomes unsatisfiable-by-random-draw very quickly as the
        path lengthens, which is unsurprising in hindsight and was not predicted
        in advance.
      consequence_for_the_instrument: >-
        E6 is EXCLUDED, so block_index remains part of the strict canonical
        form: the same per-block characteristic at two block indices is treated
        as TWO objects. That over-declares novelty rather than under-declaring
        it, which is the safe direction, and the permissive verdict bounds the
        error on the other side.
    - id: AN-4
      class: environment
      finding: >-
        Neither sympy nor pytest is installed and neither is in the local uv
        cache. Two program conventions -- the harness's module-scope sympy
        import and a pytest-run test suite -- are therefore not satisfiable in
        this environment without network access that IR-10 forbids.
      not_a_result: >-
        Environment fact. Never mathematical evidence.
    - id: AN-5
      class: concurrency observation
      finding: >-
        The branch HEAD moved during execution (89520cb68 -> a64a74005 ->
        d63c90e04) because the Coordinator archived concurrently. Run manifests
        record commit a64a74005 with dirty: true and bind the executed source by
        per-file sha256, so reproducibility rests on the content hashes rather
        than on the commit.

