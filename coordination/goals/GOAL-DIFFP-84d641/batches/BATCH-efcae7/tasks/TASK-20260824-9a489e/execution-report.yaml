  # =====================================================================
  # HEADLINE -- A PER-COMPONENT POWER TABLE, NEVER A PASS (IR-10, H-6)
  # =====================================================================
  headline_per_component_power_table:
    what_this_is: >-
      THE DELIVERABLE. It is a table, not a fraction and not a pass. "The null
      passed" is not stated anywhere in this report, and every k >= 1 rejection
      below carries the canonical-key component names that could have decided it.
      DETECTED means only that the SUITE'S OUTCOME CHANGES when the component is
      deleted from the serialised key. It is not a claim that the instrument is
      correct, and a suite that detects more ablations is a better instrument and
      NOT a result about MD5 or SHA-1.
    detection_rule_declared_before_the_runs: >-
      DETECTED BY THE OLD SUITE iff CTL-PLANT recall is short of its attempt count
      OR any strict-mode false positive occurs in CTL-NULL families (a),(b),(c).
      DETECTED BY THE STRENGTHENED SUITE iff that holds OR CTL-NULL-D's primary arm
      yields a strict MEMBER at some k >= 1 OR its k = 0 arm is not fully MEMBER.
      Read off the contract's own pre-registered group-1 values (row 3 is
      pre-registered DETECTED at 6 strict false positives; row 1, honest, at 0).

    group_1_the_six_declared_rows_REPORTED_FIRST_AND_SEPARATELY:
      scope_warning: >-
        GROUP 1 IS THE REPLICATION OF EV-DIFFP-b878aa O-7 AND ITS "2 OF 5" IS A
        POINT ESTIMATE OVER A HAND-CHOSEN FIVE-ELEMENT SAMPLE. Group 2 is NEVER
        merged into it.
      rows:
        - row: 1
          drop_set: []
          label: HONEST (unmodified)
          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 0      # pre-registered 0 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 0
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 0
          OLD_suite: NOT DETECTED
          STRENGTHENED_suite: NOT DETECTED
          pre_registered_detected: n/a
        - row: 2
          drop_set: [message_difference]
          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 0      # pre-registered 0 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 0
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 2600
          OLD_suite: NOT DETECTED   # pre-registered NO -- AGREES
          STRENGTHENED_suite: DETECTED
          the_row_the_whole_batch_was_designed_around: >-
            THE BATCH'S DESIGNED EFFECT OCCURRED, AND ONLY ON THE MD5 HALF. All
            2600 MD5 family-(d) draws became strict MEMBER on the
            message_difference-blind adjudicator; ALL 2600 SHA-1 DRAWS REMAINED
            NON-MEMBER, attributed 520/520 per cell to `in_linearized_code` alone.
            The strengthened suite detects this deletion THROUGH THE MD5 ARM ONLY,
