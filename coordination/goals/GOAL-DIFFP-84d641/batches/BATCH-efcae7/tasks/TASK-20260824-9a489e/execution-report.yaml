        OBJECT. Mechanism, stated as an observation: the canonical form minimises
        over the orbit {obj, E3(obj)} and E3 negates delta_m and step_delta
        together, so perturbing the message difference can change which variant
        attains the minimum. Frequency rises with k (3, 3, 4, 8, 14 at k = 1, 2, 4,
        8, 16). Unexpected, recorded, not repaired.
