          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 6      # pre-registered 6 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 6
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 0
          OLD_suite: DETECTED       # pre-registered YES -- AGREES
          STRENGTHENED_suite: DETECTED
        - row: 4
          drop_set: [in_linearized_code]
          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 0      # pre-registered 0 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 0
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 0
          OLD_suite: NOT DETECTED   # pre-registered NO -- AGREES
          STRENGTHENED_suite: NOT DETECTED
        - row: 5
          drop_set: [message_difference, in_linearized_code]
          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 0      # pre-registered 0 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 0
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 5200
          OLD_suite: NOT DETECTED   # pre-registered NO -- AGREES
          STRENGTHENED_suite: DETECTED
        - row: 6
          drop_set: [message_difference, step_delta, block_index, in_linearized_code]
          label: everything except primitive and length
          CTL_PLANT: 96/96          # pre-registered 96/96 -- AGREES
          CTL_NULL_strict_false_positives_of_3000: 3000   # pre-registered 3000 -- AGREES
          CTL_NULL_permissive_false_positives_of_3000: 3000
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_MEMBER: 5200
          OLD_suite: DETECTED       # pre-registered YES -- AGREES
          STRENGTHENED_suite: DETECTED
      replication_outcome_stated_as_integers: >-
        6 of 6 rows reproduce their pre-registered CTL-PLANT value exactly; 6 of 6
