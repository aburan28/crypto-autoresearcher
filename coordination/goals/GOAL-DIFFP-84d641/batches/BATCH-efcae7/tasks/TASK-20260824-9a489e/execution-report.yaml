    - control: CTL-TWOSIDED
      run: 2
      results:
        T1:
          object: E2-rotation images of PLANT-SHA1-00 at b in {1,7,16,31}
          pre_registered: strict NON-MEMBER on all four AND permissive MEMBER on all four
          measured: strict NON-MEMBER 4/4, permissive MEMBER 4/4
          met: true
        T2:
          object: E6-reindexed images at block index 3, both primitives
          pre_registered: strict NON-MEMBER and permissive MEMBER on both primitives
          measured: strict NON-MEMBER 2/2, permissive MEMBER 2/2
          met: true
        T3:
          object: PLANT-MD5-00 re-encoded into an alternative signed representation
          pre_registered: MEMBER with E4 in the strict group, NON-MEMBER with E4 removed
          measured: {with_E4: MEMBER, without_E4: NON-MEMBER}
          step_delta_unchanged_by_construction: true
          met: true
        T4:
          object: a SHA-0 codeword presented as a SHA-1 DV (sha0_expand of PLANT-SHA1-00's own dv_seed_window)
          pre_registered: NON-MEMBER in both modes and STILL NON-MEMBER at the same distance with the flag forced True
          measured:
            strict: NON-MEMBER
            permissive: NON-MEMBER
            flag_forced_true: {strict: NON-MEMBER, permissive: NON-MEMBER}
            closest_distance: 202 (identical with the flag forced True)
          met: true
          distance_label: >-
            202 IS A REPORTED DIAGNOSTIC, NOT A DECISION VARIABLE AND NOT A
            MARGIN. EV-DIFFP-b878aa O-9 measured that this distance neither bounds
            nor tracks the verdict in either direction.
        T5:
          object: the 16 unperturbed planted entries, strict mode
          pre_registered: MEMBER, all 16
          measured: 16/16 MEMBER
          met: true
      capacity_to_fail: >-
        5 of 5 pre-registered two-sided answers met. A degenerate always-reject
        adjudicator fails T5 on its first object and the permissive side of T1 and
        T2; a degenerate always-accept adjudicator fails the strict side of T1, T2
        and T4 and every k >= 1 draw of CTL-NULL-D. Neither could have produced
        this table.

    - control: CTL-NULL-D
      run: 3
      primary_arm:
        draws: 5216 (16 entries x {k=0 once} + 16 x 5 x (1 deterministic + 64 seeded))
        k0_arm_KNOWN_ANSWER_MEMBER: 16/16 strict MEMBER
        k_ge_1_strict: 5200/5200 NON-MEMBER
        k_ge_1_permissive: 5200/5200 NON-MEMBER
        k_ge_1_MEMBER_verdicts_on_the_honest_adjudicator: 0
        component_attribution_distribution_H_3:
          md5:
            k=1: {message_difference: 517, message_difference+step_delta: 3}
            k=2: {message_difference: 517, message_difference+step_delta: 3}
            k=4: {message_difference: 516, message_difference+step_delta: 4}
            k=8: {message_difference: 512, message_difference+step_delta: 8}
            k=16: {message_difference: 506, message_difference+step_delta: 14}
            per_cell_draws: 520
          sha1:
            k=1: {in_linearized_code+message_difference: 520}
            k=2: {in_linearized_code+message_difference: 520}
            k=4: {in_linearized_code+message_difference: 520}
            k=8: {in_linearized_code+message_difference: 520}
            k=16: {in_linearized_code+message_difference: 520}
            per_cell_draws: 520
        what_the_attribution_says_as_an_observation: >-
          MD5: 2568 of 2600 k >= 1 rejections are attributed to
          `message_difference` ALONE, so the MD5 arm of family (d) does separate
          draws on the component it perturbs. The remaining 32 are attributed to
          `message_difference` AND `step_delta` jointly EVEN THOUGH step_delta WAS
          HELD FIXED ON THE OBJECT: the canonical form is a minimum over the orbit
          {obj, E3(obj)} and E3 negates delta_m and step_delta together, so
          perturbing the message difference can change WHICH variant attains the
          minimum and therefore which step_delta value the canonical form carries.
          The attribution is on CANONICAL FORMS, exactly as the contract defines
          it. Recorded as an unexpected observation.
          SHA-1: 2600 of 2600 rejections are attributed to
          `in_linearized_code` AND `message_difference` JOINTLY, and NONE to the
          message difference alone -- at every k, including k = 1. The flag
          honestly recomputes to False whenever the DV leaves the linearized code,
          which every bit flip in these draws did. THE PRIMARY SHA-1 ARM THEREFORE
          NEVER ISOLATES THE MESSAGE DIFFERENCE. That is the outcome the contract
          pre-registered as "the prediction this contract trusts least", recorded
          before the run, and it is confirmed at 100% of cells rather than only at
          large k.
        closest_non_matching_draw_per_cell:
          md5: 'k=1: 1, k=2: 2, k=4: 4, k=8: 8, k=16: 16 (deterministic and seeded alike)'
          sha1: 'k=1: 1, k=2: 2, k=4: 4, k=8: 8, k=16: 16 (deterministic and seeded alike)'
          label: >-
            A REPORTED DIAGNOSTIC, NOT A DECISION VARIABLE AND NOT A MARGIN, and
            never evidence about a null's difficulty (DEC-20260824-af6d5c
            successor_gates). It equals k here only because the perturbation is
            defined as k bit flips of a vector the distance is computed over.
      sub_arm_D_SHA1_INCODE:
        draws: 520 (8 sha1 entries x (1 deterministic + 64 seeded codeword additions))
        construction: dv XOR sha1_expand(w16, 80); the expansion is GF(2)-linear so the perturbed DV is again a codeword
        in_linearized_code_recomputed_True: 520/520
        codeword_hamming_weight: {min: 109, max: 1352, mean: 1261.74}
        strict: 520/520 NON-MEMBER
        component_attribution: {message_difference: 520}
        observation: >-
          THE SUB-ARM ISOLATES WHAT THE PRIMARY SHA-1 ARM COULD NOT. With the flag
          honestly recomputing to True in all 520 draws, every rejection is
          attributed to `message_difference` ALONE. The primary arm's SHA-1 power
          belongs to the flag; this sub-arm's belongs to the message difference.
      sub_arm_D_VD3_PROFILE:
        binding_status: >-
          REPORTED SEPARATELY AND NEVER COUNTED INTO FAMILY (d)'s PASS/FAIL, as the
          contract requires. It is a MEASUREMENT OF A KNOWN DEFECT (VD-3), not a
          repair and not a known-correct answer.
        draws: 20864 (8 sha1 entries x 8 E1 shifts x (k=0 once + 5 k x 65 draws)), strict mode only
        k0_arm: 64/64 strict MEMBER
        k_ge_1: 20800/20800 strict NON-MEMBER
        component_attribution: {in_linearized_code: 20800}
        pre_registered_expectation: MEMBER, i.e. the perturbation is ERASED
        measured_outcome_stated_precisely: >-
          THE PRE-REGISTERED VERDICT WAS NOT MET AND ITS MECHANISM WAS CONFIRMED,
          and the two must be stated separately. Every k >= 1 draw returned
          NON-MEMBER, so the verdict differs from the pre-registered MEMBER. But
          the attribution shows `message_difference` NEVER differs from the source
          entry in any of the 20800 rejections: the perturbation of the declared DV
          IS erased from the key, exactly as VD-3 says, because EQ.align_E1
          recomputes the DV from the untouched dv_seed_window whenever step_start >
          0. What separates the draw is `in_linearized_code`, which act_E1_shift
          carries over from the object and which this task's perturbation honestly
          recomputes to False. The contract's expectation was stated as a verdict;
          the run measured the verdict AND the mechanism, and they point in
          different directions for a reason that is visible in the attribution. NOT
          RECONCILED, NOT REPAIRED, and no perturbation rule was changed after
          seeing it.

    - control: CTL-ABL
      runs: 4 (group 1) and 5 (group 2)
      see: headline_per_component_power_table above, and ablation-battery-result.json
      ablation_mechanism_used: >-
        THE DECLARED PROJECTION, NOT AN EDIT TO serialize(). The same committed
        Adjudicator serialisation over the same committed census, with named (name,
        value) pairs dropped, the projection applied INSIDE the orbit
        minimisation: min(project(serialize(v, gens))) over the identical variant
        list. No committed module was edited (CTL-FROZEN measures that).
      inside_versus_outside_minimisation_comparison:
        result: >-
          IDENTICAL ON ALL SIX DECLARED ROWS: 32 of 32 comparisons per row (16
          planted entries x 2 modes) agree, 0 differ. The inside-minimisation form
          is the contract's value and was used for every count; the outside form is
          reported because a silent choice between them would have been an
          undeclared design decision in a load-bearing quantity.
      variant_list_mirror_check:
        checked: 22880
        mismatches: 0
        what_it_checks: >-
          The committed `canonical()` returns a minimum and does not expose the
          variant list an inside-minimisation projection must see, so its variant
          construction is mirrored in controlpower.variant_keys. Every one of the
          22880 calls self-checked that min(variant_keys(o, g)) equals
          ADJ.canonical(o, g). 0 mismatches.
