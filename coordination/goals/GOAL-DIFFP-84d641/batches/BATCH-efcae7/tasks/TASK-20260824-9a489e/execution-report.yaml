  protocol_deviations:
    - id: PD-1
      what: >-
        THE CONTRACT SAYS THIS BATCH "DOES NOT RE-HASH THE QUARANTINED PAYLOAD: IT
        DOES NOT TOUCH IT AT ALL". The committed census builder
        (harness/diffpath/census.py build_census) calls quarantine_attestation()
        UNCONDITIONALLY, which opens the payload 'rb', hashes the bytes and
        discards them without decoding or parsing. IR-2 forbids editing that
        committed module and the census is a required input, so that whole-file
        byte hash was re-entered once per census build (the census is built ONCE,
        in run 1, and shared by every later run).
      classification: protocol deviation, disclosed; NOT a repair and NOT a breach of IR-1
      why_it_is_not_a_breach: >-
        It is the same authorised whole-file sha256 CTL-QUAR performed in
        BATCH-f8bf86 and the Validator confirmed independently. Nothing was read,
        parsed, extracted, reconstructed or fetched; NO DERIVED QUANTITY OF THE
        PAYLOAD -- not its byte count, not any field -- was computed or reported by
        this task, which is the conservative reading OBJ-9 asked for.
      not_repaired_because: repairing it would require editing a committed module (IR-2)
    - id: PD-2
      what: >-
        THE BATTERY'S CTL-NULL-D COLUMN IS STRICT-MODE ONLY. The contract's row
        record asks for "CTL-NULL-D per cell"; the battery adjudicates family (d)
        in strict mode only, because the DETECTED verdict is read from strict-mode
        outcomes and the permissive family-(d) counts are measured in full in run
        3. The permissive column of those cells is recorded as NOT MEASURED, never
        as zero, and strict and permissive remain separate fields (IR-4).
      cost_stated: >-
        a permissive SHA-1 canonical form costs about 21 ms because E2 puts 64
        variants in the orbit; measuring it a second time in each battery run would
        have added roughly 55 s per run for a number run 3 already carries.
    - id: PD-3
      what: >-
        THE HIGH-COUNT ARMS USE A FAST MEMBERSHIP PATH rather than
        Adjudicator.adjudicate(): ADJ.canonical(obj, gens) looked up in the
        committed Adjudicator's own index dict. It is the same committed canonical
        form against the same committed index, with the other mode's canonical form
        and the closest-entry loop skipped where they are not required.
      control_for_it: >-
        NOT ASSERTED, CHECKED. fidelity_check compares the fast path with
        adjudicate() on declared samples: 12/12 agreement in run 2 and 16/16 in run
        3, zero disagreements.
    - id: PD-4
      what: >-
        TWO DERIVED FIELDS ARE RECOMPUTED RATHER THAN HELD FIXED IN THE FAMILY-(d)
        PERTURBATION, and the choice is declared rather than made silently: for MD5,
        delta_m_signed (the signed-digit representation OF delta_m, not in the
        membership key); for SHA-1, in_linearized_code (a PREDICATE OF THE DV,
        recomputed by P.sha1_in_linearized_code). dv_seed_window IS HELD FIXED
        because it is a separate field of the path object and not the message
        difference. Leaving either derived field stale would make the object
        internally inconsistent, and the contract's own pre-registered prediction
        turns on the flag being honestly recomputed.
      consequence_recorded: >-
        The SHA-1 attribution result (100% joint attribution to the flag) FOLLOWS
        FROM this recomputation. A reviewer wishing to attack it should attack the
        choice, which is why it is stated here as a declared decision.

