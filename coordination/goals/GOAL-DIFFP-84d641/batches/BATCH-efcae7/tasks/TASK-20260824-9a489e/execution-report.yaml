      profile_reported_separately_per_generator:
        - generator: E1
          orbit_images_per_object: {md5: 0, sha1: 8}
          orbit_images_total: {md5: 0, sha1: 64}
          key_component_names_that_change: [step_start]
          verdict_changes: {strict: 64 of 165, permissive: 64 of 165}
        - generator: E2
          orbit_images_per_object: {md5: 0, sha1: 4}
          orbit_images_total: {md5: 0, sha1: 32}
          key_component_names_that_change: []
          verdict_changes: {strict: 4 of 165, permissive: 4 of 165}
        - generator: E3
          orbit_images_per_object: {md5: 1, sha1: 1}
          orbit_images_total: {md5: 8, sha1: 8}
          key_component_names_that_change: []
          verdict_changes: {strict: 16 of 165, permissive: 16 of 165}
        - generator: E4
          orbit_images_per_object: {md5: 0, sha1: 0}
          orbit_images_total: {md5: 0, sha1: 0}
          key_component_names_that_change: [signed_representation]
          verdict_changes: {strict: 1 of 165, permissive: 1 of 165}
          observation: >-
            E4 EMITS NO ORBIT IMAGE ON EITHER PRIMITIVE, and its only key effect is
