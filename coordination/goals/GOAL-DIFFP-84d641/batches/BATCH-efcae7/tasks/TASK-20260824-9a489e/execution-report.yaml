        - {component: message_difference, OLD_suite: NOT DETECTED, STRENGTHENED_suite: DETECTED,
           CTL_PLANT: 96/96, CTL_NULL_strict_fp_of_3000: 0, CTL_NULL_D_k_ge_1_MEMBER: 2600}
        - {component: step_delta, OLD_suite: DETECTED, STRENGTHENED_suite: DETECTED,
           CTL_PLANT: 96/96, CTL_NULL_strict_fp_of_3000: 6, CTL_NULL_D_k_ge_1_MEMBER: 0}
        - {component: block_index, OLD_suite: NOT DETECTED, STRENGTHENED_suite: NOT DETECTED,
           CTL_PLANT: 96/96, CTL_NULL_strict_fp_of_3000: 0, CTL_NULL_D_k_ge_1_MEMBER: 0}
        - {component: in_linearized_code, OLD_suite: NOT DETECTED, STRENGTHENED_suite: NOT DETECTED,
           CTL_PLANT: 96/96, CTL_NULL_strict_fp_of_3000: 0, CTL_NULL_D_k_ge_1_MEMBER: 0}
      components_NOT_PROBED_BY_ANY_DECLARED_FAMILY_NAMED_RATHER_THAN_REPORTED_AS_NOT_DETECTED: >-
        MEASURED, NOT ASSUMED. A component is ISOLATED by a declared family iff
        some declared draw's canonical form differs from that of its own source
        census entry IN THAT COMPONENT ALONE. Measured over every family-(d) draw:
        `message_difference` IS isolated (MD5 primary arm and the SHA-1 in-code
        sub-arm). `primitive`, `length`, `step_delta`, `block_index` and
        `in_linearized_code` are NOT ISOLATED BY ANY DECLARED FAMILY -- families
        (a), (b) and (c) construct their draws freshly rather than from a census
        entry, so they have no source entry to differ from in one component, and
        family (d) perturbs the message difference only. For those five
        components, NOT DETECTED means THE SUITE DID NOT LOOK IN THAT WAY, and
        `step_delta`'s DETECTED verdict comes from a DIFFERENT mechanism (family
        (a) draws colliding with a census entry once step_delta leaves the key),
        not from an isolating draw.

