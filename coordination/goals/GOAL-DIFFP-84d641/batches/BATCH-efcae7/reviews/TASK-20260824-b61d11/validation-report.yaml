    - joint: J2
      alias: V-b
      statement_short: Are the ablations genuine, is the projection inside the minimisation, and is PD-3's fast membership path safe where the headline lives?
      verdict: holds
      same_class_same_census_same_draws: >-
        VERIFIED FROM SOURCE, NOT FROM THE REPORT. controlpower.Row builds its index
        and looks up through `ablated_canonical_inside(variant_keys(o, gens), drop_set)`.
        `variant_keys` reconstructs the variant list of the committed
        `adjudicator.canonical` line for line (align_E1 for sha1 under E1, then the E3
        image, then the 32 E2 rotations under E2) and serialises each with the
        COMMITTED `adjudicator.serialize`. The census is the committed builder's, the
        generator sets are STRICT {E1,E3,E4,E5} and PERMISSIVE {E1..E6} unchanged, the
        null draws are regenerated by the committed `_null_draw_md5`/`_null_draw_sha1`
        from the committed seeds, and the family-(d) draws are one shared plan across
        every row. THE ONLY THING THAT VARIES BETWEEN ROWS IS `drop_set`. No
        re-implementation of the adjudicator exists anywhere in the module.
      projection_is_a_pure_name_drop: >-
        `project(key, drop)` returns `tuple(p for p in key if p[0] not in drop)` --
        a name filter that preserves order and touches no value. That is exactly what
        deleting the corresponding `parts.append(...)` from `serialize()` would produce,
        which is the round-1 mechanism.
      inside_the_minimisation: >-
        YES. `ablated_canonical_inside(keys, drop) = min(project(k, drop) for k in keys)`
        is what every index build and every lookup calls, in group 1, in group 2 and in
        the battery's family-(d) column. `ablated_canonical_outside` is computed only
        for the declared comparison and decides nothing.
      variant_mirror_self_check: >-
        22880 calls, 0 mismatches, from run-index.json's variant_mirror_check. The
        self-check asserts min(variant_keys(o,g)) == ADJ.canonical(o,g) on every call,
        which is the one way the mirror could have drifted from the committed source.
        I re-derived the same variant list independently and reproduced every group-1
        count from it, which is a second, external confirmation of the same property.
      inside_versus_outside_as_the_producer_ran_it:
        producer_result: all six rows report identical = 32, different = 0
        what_the_32_actually_is: >-
          16 planted census entries x 2 modes. I read this off the source
          (controlpower.py run_battery_group1: the loop is `for e in census.shadow`),
          and the execution report states the same object set in words.
        my_own_reproduction: >-
          I recomputed inside vs outside on the same 16 entries for all six drop-sets:
          0 differences. AGREES.
        THE FINDING, MEASURED: >-
          THE COMPARISON WAS RUN ONLY ON AN OBJECT SET WHERE IT CANNOT FIRE, AND THE
          PACKAGE CONTAINS OBJECTS ON WHICH IT DOES. On the 5200 family-(d) k >= 1
          draws -- the objects the headline row-2 count is read FROM -- I measured
          inside != outside on 32 of 5200 for drop_set [message_difference] and on 32
          of 5200 for [message_difference, in_linearized_code]; 0 of 5200 for the other
          four rows. Under the outside order the row-2 CTL-NULL-D k >= 1 strict MEMBER
          count would be 2568 instead of 2600, and row 5's would be 5168 instead of
          5200.
        why_this_is_a_limitation_and_not_a_break: >-
          THE INSIDE ORDER IS THE CONTRACT'S DECLARED VALUE (`ablation_mechanism`,
          IR-8) AND IT IS THE ORDER THE PRODUCER USED FOR EVERY REPORTED COUNT. So no
          reported integer is wrong. What is incomplete is the CHECK: the contract asks
          the Executor to "report both forms for the six declared rows and state whether
          they differ", and the executed comparison covers only the census entries,
          where the two orders provably coincide, so a reader is told "0 differ" about a
          set on which a difference was impossible. The honest statement is: the two
          projection orders coincide on the census entries and differ on 32 of 5200
          family-(d) draws, and the contract's value was used throughout.
        mechanism_localised: >-
          The 32 divergent draws are EXACTLY the 32 draws AN-4 attributes to step_delta
          (I computed both sets and they are identical, |A| = |B| = |A n B| = 32, all
          md5). Same cause: E3 negates delta_m and step_delta together, so dropping
          message_difference moves which orbit variant attains the minimum.
      PD_3_the_fast_membership_path: >-
        NO DIVERGENCE IS POSSIBLE, AND THAT IS A STRONGER RESULT THAN THE PRODUCER'S
        SAMPLE. `FastAdj.verdict(obj, mode)` is
        `key = ADJ.canonical(obj, gens); hit = self.adj._index[mode].get(key);
        return ("MEMBER" if hit else "NON-MEMBER", hit[0] if hit else None, key)`.
        `Adjudicator.adjudicate` computes its verdict with the SAME committed
        `canonical`, the SAME `_index[mode]` dict object, and the SAME truthiness test
        and the SAME `hit[0] if hit else None`. The only work `adjudicate` does that the
        fast path skips is the closest-entry loop, `normalise_conditions`, and building
        the Adjudication record -- none of which is read by, or can influence, the
        verdict. THERE IS THEREFORE NO OBJECT CLASS ON WHICH THEY CAN DIVERGE, including
        the classes the samples do not cover; the concern the plan raises (skipping the
        closest-entry loop, or the other mode's canonical form) is real as a matter of
        what is COMPUTED and cannot change what is REPORTED, because the skipped
        quantities are not inputs to membership.
      PD_3_sample_adequacy_stated_plainly: >-
        AS A SAMPLE, 12/12 AND 16/16 ARE THIN FOR ARMS OF 5216, 520 AND 20864 DRAWS,
        AND A REVIEWER SHOULD SAY SO. The reason it does not matter here is structural
        and not statistical: the property being sampled is an identity between two call
        sites, not a rate. Were the fast path a re-implementation of `canonical`, 16
