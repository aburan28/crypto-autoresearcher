      script and recorded the value. Only afterwards did I open controlpower.py and
      the producer's artifacts. THE PLAN ITSELF STATES THIS IS NOT MECHANICALLY
      CHECKABLE; it rests on this paragraph being true, and it is.
    mechanism_used: >-
      MY OWN RE-IMPLEMENTATION OF THE DECLARED PROJECTION, NOT THE PRODUCER'S
      MODULE -- which is the check that the code implements the contract, not the
      check that the number is what the code produces. I re-implemented from the
      contract's `ablation_mechanism`: project the tuple returned by the committed
      `adjudicator.serialize()`, dropping every pair whose name is in the drop-set
      and preserving order; take the minimum of the projected serialisations over
      the SAME variant list the committed `adjudicator.canonical()` minimises over
      (align_E1 for sha1 when E1 is in force, then the E3 image, then E2 rotations
      when E2 is in force). The 16 planted shadow entries were rebuilt with the
      committed `plant_from_pair`/`seeded_pair` at seeds 84064101 and 84064102 in
      the committed builder's exact loop order. Family (d): flip k bits of delta_m
      (md5) or dv (sha1) at bit index p -> (word p//32, bit p%32); deterministic
      draw = the k lowest bit indices; R = 64 seeded draws per (entry, k) from
      random.Random(84064107); step_delta and every other field held fixed; the
      sha1 predicate `in_linearized_code` honestly recomputed by
      P.sha1_in_linearized_code from the perturbed dv.
    value_i_derived:
