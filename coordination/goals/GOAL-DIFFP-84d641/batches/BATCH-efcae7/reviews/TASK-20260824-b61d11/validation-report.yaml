          FALSE AS LITERALLY WORDED. I recomputed the 6 family-(a) strict false positives
          on the step_delta-dropped adjudicator and, for each, took the difference set
          between the draw's HONEST canonical form and the MATCHED census entry's. All six
          give exactly {step_delta}: NULL-MD5-9983c910 vs PLANT-MD5-05, NULL-MD5-1dc9644d
          vs PLANT-MD5-06, NULL-MD5-8ee15c5c vs PLANT-MD5-05, NULL-MD5-12dbedf2 vs
          PLANT-MD5-06, NULL-MD5-12c43f2e vs PLANT-MD5-02, NULL-MD5-c0053ca8 vs
          PLANT-MD5-01. Six isolating draws for step_delta exist in declared family (a).
        why_it_says_NO: >-
          `isolating_components` in controlpower.py computes the field ONLY from the
          family-(d) and D-SHA1-INCODE attribution distributions, and its docstring
          declares the narrower notion it means: a draw differing from ITS OWN SOURCE
          census entry, which only family (d) has because families (a),(b),(c) draws are
          freshly generated. The reasoning is coherent; THE EMITTED SENTENCE DROPS THE
          WORD "OWN" AND QUANTIFIES OVER "A CENSUS ENTRY" AND "NO DECLARED FAMILY", which
          is a strictly stronger claim than what was computed.
        severity: >-
          IT CHANGES NO DETECTED / NOT DETECTED VERDICT and no integer: row 3 and row 104
          are already DETECTED by the old suite from those very six draws. The damage is
          that a reader of row 104 is shown "DETECTED" beside "isolating_draw_exists: NO",
          which is internally incoherent and, on the contract's own definition of
          detection ("a draw that agrees with a census entry on every retained component
          and differs on X"), states the opposite of what happened. This is a wording and
          scope defect in a reported field, of exactly the class J7 exists to catch, and
          it is the one place in this package where a figure is claimed wider than its
          computation covers. It is a defect in a DESCRIPTION, not in a measurement.
        recommended_disposition: >-
          Supersede the string with the narrower one the docstring means ("no declared
          family produces a draw differing from ITS OWN SOURCE census entry in this
          component alone; family (a) does produce draws differing from SOME census entry
          in step_delta alone, and that is what row 3's 6 false positives are"). NOT A
          REPAIR FOR THIS BATCH -- the artifacts are immutable and I have edited nothing.
      breaking_artifact_found: >-
        None that meets the joint's breaking bar. The overstated field above is recorded
        as a first-class finding and a correction target, not as a break: no figure, count
        or verdict in the package depends on it.

