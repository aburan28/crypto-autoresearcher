          outputs, for each ordered pair of key components (X, Y), whether Y is a
          function of X. It then re-partitions every NOT DETECTED verdict in the
          depth-1 table into three kinds the current single column conflates:
          (a) PROVABLY UNDETECTABLE BY ANY FAMILY, because the deleted component is
          functionally recoverable from a retained one (measured here: row 4);
          (b) NOT PROBED BY A DECLARED FAMILY (measured here: primitive, length,
          block_index); (c) PROBED AND GENUINELY NOT DETECTED (measured here: none).
        cost: one read-only script, minutes, no charged run, no new seed set, no acquisition.
        why_it_is_a_hypothesis_rather_than_a_refutation: >-
