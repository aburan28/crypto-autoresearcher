        currently in the batch's framing.
        (1) ROW 4 (in_linearized_code deleted) CANNOT POSSIBLY BE DETECTED while
        message_difference is in the key, because a function of a retained component
        carries no independent information. Its NOT DETECTED verdict is a THEOREM, not
        a measurement, and it agrees with its pre-registration for that reason.
        (2) ROW 2 (message_difference deleted) IS NOT A DELETION ON SHA-1: it leaves a
        one-bit lossy IMAGE of the deleted component behind in the key. That is
        exactly why the SHA-1 arm gives 0 members, and it is a defect of the ABLATION
        LATTICE rather than of family (d): the depth-1 lattice treats the six
        components as independent coordinates when one is a function of another.
      what_a_per_component_profile_enables_that_a_pass_fail_suite_does_not: >-
        It makes the QUOTIENT computable. Ablating a key whose components are
        functionally dependent measures the dependency graph first and the suite
        second; ablating the QUOTIENT of the key by that graph measures the suite
        alone. It also collapses the depth-2 problem: you do not need all 15 depth-2
        subsets, you need the subsets that BREAK A DEPENDENCY -- here exactly one,
        {message_difference, in_linearized_code}, which is already row 5. That turns
        the package's named obstruction ("the depth-2 lattice is unmeasured") from a
        combinatorial cost into a two-row question.
