          in_code(dv XOR e) <=> e IS ITSELF A CODEWORD, because the expansion is
          GF(2)-linear. A k-bit perturbation with k <= 16 is never a codeword.
        does_it_bite: 'YES, AND IT BITES TOTALLY RATHER THAN PARTIALLY.'
        how_hard_MEASURED: >-
          2600 of 2600 SHA-1 primary-arm k >= 1 draws move `in_linearized_code`, at
          EVERY k INCLUDING k = 1, and with certainty on the deterministic draw. Not
          one draw in the entire primary arm perturbs the SHA-1 message difference
          without also moving the flag. On the honest strict key the component
          attribution is `in_linearized_code+message_difference` on 2600/2600 draws and
          `message_difference` ALONE on 0/2600.
        what_that_means_for_the_family: >-
          FAMILY (d)'s PRIMARY ARM DOES NOT PROBE THE SHA-1 MESSAGE DIFFERENCE. It
          probes a two-component conjunction, and by the ordinary reading of the
          contract's own attribution rule ("a control whose rejections are decided by a
          component other than the one it perturbs has NO POWER over the component it
          was built for") the SHA-1 half of the primary arm has no measured power over
          the component it names.
        does_the_contracts_dedicated_sub_arm_isolate_the_two: >-
          YES, D-SHA1-INCODE DOES ISOLATE THEM, AND THE ISOLATION IS REAL: dv XOR a
          nonzero codeword keeps the honestly recomputed flag True (I verified True on
          all 520 objects I built) while moving the dv by a measured mean of 1262 bits.
          MY OBJECTION IS NOT THAT THE SUB-ARM FAILS. IT IS THAT THE ISOLATION EXISTS
          ONLY IN A SUB-ARM AND IS NEVER CARRIED THROUGH TO THE ABLATION BATTERY.
          `Row.record()` reads `self.nulld`, populated only by the PRIMARY arm; the
          battery never adjudicates a single in-code perturbed object. So the isolation
          the sub-arm establishes bounds NOTHING that the battery's DETECTED /
          NOT DETECTED verdicts depend on -- which is precisely the question the plan
          told me to answer, and the answer is that it isolates nothing the verdicts
          depend on. THIS IS THE SAME ONE LINE OF CODE AT WHICH O-E SURVIVES IN J8.
      the_PD_4_counterfactual:
        what_i_ran: >-
          The identical primary arm with ONE declared implementation choice reversed:
          `in_linearized_code` HELD FIXED at the source's value instead of being
          recomputed. Everything else -- seeds, draw order, positions, census,
          serialisation -- byte-identical.
        measured:
          recomputed_as_committed: 'sha1 k >= 1: 2600 draws, 0 strict MEMBER, attribution `in_linearized_code+message_difference` on 2600/2600'
          held_fixed_counterfactual: 'sha1 k >= 1: 2600 draws, 0 strict MEMBER, attribution `message_difference` on 2600/2600'
        ruling: >-
          THE VERDICT IS INVARIANT UNDER THE CHOICE. THE ATTRIBUTION IS COMPLETELY
          DETERMINED BY IT. Both halves matter and neither should be rounded away.
          The producer's declared choice to RECOMPUTE is the CORRECT one -- holding a
          derived predicate stale would make the object internally inconsistent, which
          is O-5's malformed-object failure -- and I am NOT asking for it to be
          reversed. But H-3 attribution is the package's own evidence that a control
          has power over the component it perturbs, and `isolating_components()` READS
          THE ATTRIBUTION DISTRIBUTION to decide whether a component is isolated. So a
          declared implementation choice, correctly made, is nonetheless what decides
          whether the SHA-1 primary arm reads as isolating `message_difference` or not.
          THE ATTRIBUTION IS MEASURING THE CHOICE AT LEAST AS MUCH AS THE INSTRUMENT,
          and the close needs that stated beside the attribution table.
      nearby_object_mutations_one_thing_at_a_time:
        - varied: how the flipped positions are chosen
          finding: >-
            THE DETERMINISTIC DRAW USES positions = range(k) FOR k IN {1,2,4,8,16}, SO
            IT ONLY EVER TOUCHES WORD 0 -- of 16 words on MD5 and of 80 on SHA-1.
            MEASURED CONSEQUENCE: O-RT2' (SHA-1 keyed on dv[:16] only, flag dropped) is
            refused 1032 times by the SEEDED draws and would have been refused ZERO
            times by the deterministic arm alone. An instrument blind to any word other
            than word 0 is INVISIBLE to the deterministic arm by construction. The
            deterministic arm is a reproducibility anchor, not a probe of the
            component's extent, and nothing in the package says so.
        - varied: which field is perturbed
          finding: >-
            The family perturbs exactly one KEY component and holds every other key
            component fixed. That is what makes the matching ablation row's DETECTED
            verdict automatic (J13). The general rule I extract and offer for reuse:
            FOR ANY FAMILY THAT MOVES EXACTLY ONE KEY COMPONENT X AND HOLDS THE REST
            FIXED, THE ROW THAT DELETES X IS DETECTED BY CONSTRUCTION. The verdict has
            content only where the perturbation ALSO moves something else -- which on
            SHA-1 is exactly where the flag confound lives.
        - varied: which entry is the source
          finding: >-
            All 8 planted MD5 entries carry a WEIGHT-1 message difference (measured:
            weights all 1, in words 3,4,1,10,15,15,2,7). The MD5 arm's discriminating
            power is therefore measured on the least generic message differences
            available, and O-A/O-A' are refused 29 and 2 times in 2600 BECAUSE of that
            weight-1 structure. The package already carries this limit as a standing
            constraint; I am recording that it is load-bearing for family (d)'s margins
            specifically, which is not currently said.
        - varied: which mode adjudicates
          finding: >-
            The battery's family-(d) column is STRICT ONLY, disclosed as PD-2 and
            recorded as NOT MEASURED rather than zero. I did not attack this; it is
            J7's, and I confirm only that I found no place where the unmeasured column
            is read as measured.

    # -------------------------------------------------------------
    - joint: J12
      alias: R-e
      statement_short: THE CHEAPEST DISTINGUISHING CONTROL, AND AN OBJECT NOBODY IMAGINED
      verdict: holds
      the_cheapest_distinguishing_control:
        name: CTL-DIAGONAL -- the family-by-row matrix run against a KNOWN-BAD instrument
        what_it_constructs: >-
          For each strict key component X, a family (d_X) that perturbs X alone and
          holds every other key component fixed -- six families, the existing family
          (d) being d_message_difference. Six of them are already trivial to build:
          block_index by re-indexing, length/step_start by E1 shifting, step_delta by
          perturbing the stored vector, primitive by relabelling.
        what_it_adjudicates: >-
          The 6 x 6 matrix of (family d_X, depth-1 row deleting Y), run TWICE: once
          against the HONEST adjudicator and once against a KNOWN-BAD one -- O-E is the
          cheapest, since it is one conditional line.
        outcome_that_means_ARTIFACT: >-
          THE TWO MATRICES ARE IDENTICAL. Then the matrix is a function of the six
          families' construction and of the key's dependency graph, and carries no
          information about the instrument at all.
        outcome_that_means_POWER: >-
          THE MATRICES DIFFER IN AT LEAST ONE CELL. Every differing cell is a place
          where the suite's verdict is contingent on the instrument rather than on the
          construction, and the count of differing cells is the honest scalar version
          of "how much power the strengthening bought".
        cost: >-
          Deterministic, same census, same seeds, no acquisition, no search. Roughly
          twice run 4's compute (measured proxy: my whole 14-instrument sweep,
          including key construction, ran in 33 s on one core).
        partial_answer_i_can_already_give: >-
          ON THE ARMS THE BATTERY'S DETECTION RULE ACTUALLY READS, THE HONEST
          INSTRUMENT AND O-E ARE INDISTINGUISHABLE: CTL-PLANT 96/96 both, CTL-NULL
          0/3000 both, CTL-NULL-D k>=1 members 0 both, k0 16/16 both. They differ ONLY
          on the D-SHA1-INCODE sub-arm (0/520 vs 520/520), which the detection rule
          never reads. That is a measured artifact tell today, on one cell, and
          CTL-DIAGONAL is what would turn one cell into a matrix.
      the_null_object_control_the_protocol_demands_and_what_it_should_have_done:
        the_parameter_that_should_destroy_the_signal: >-
          k. A larger perturbation should be EASIER to reject and the member count
          should fall monotonically toward zero as k rises from 1 to 16.
        what_was_measured: >-
          PERFECTLY FLAT IN k. Row 2's MD5 member count is 520/520 at k = 1, 2, 4, 8
          AND 16, and its SHA-1 count is 0/520 at every one of them. My own O-E, O-D,
          O-C, O-C', O-C'' sweeps are flat in k as well.
        ruling: >-
          A QUANTITY THAT IS EXACTLY FLAT IN THE PARAMETER THAT IS SUPPOSED TO MODULATE
          IT IS THE ARTIFACT TELL OF docs/inventor-protocol.md SECTION 3. It is flat
          because the outcome is decided by WHICH key components moved and never by HOW
          MUCH they moved -- the membership test is exact equality on a tuple, so a
          1-bit and a 16-bit perturbation are the same event. THE k SWEEP IS THEREFORE
          NOT A DIFFICULTY SWEEP AND MUST NOT BE READ AS ONE; K_VALUES = (0,1,2,4,8,16)
          buys 5200 draws that are, for the purpose of the DETECTED verdict, 16 draws
          repeated. I am NOT saying the k sweep is worthless -- it is a genuine
          robustness check on the attribution and on the seeded position sampling --
          but it cannot be cited as evidence that rejection is robust to perturbation
          size, and nothing in the package cites it that way, which is to the
          package's credit.
        the_matching_null_object: >-
          The controlled null already in the package is CTL-NULL families (a),(b),(c) --
          freshly generated random objects of the same shape -- and it returns 0/3000
          strict false positives against EVERY instrument I built including the ones
          blind to three components. THAT IS A CONTROLLED NULL RATHER THAN A FINDING:
          it shows only that `step_delta` alone separates a random 64/80-word draw from
          the census, which round 1 already measured as O-8.
      the_object_nobody_imagined:
        id: O-RT2
        construction: >-
          An adjudicator that, on SHA-1 only, replaces the 80-word `message_difference`
          by its restriction to the 16-word SEED WINDOW dv[:16], keeping every other
          component including the flag. It is not a deletion and not a component
          re-keying of the kind the contract's lattice can express: it is a RESTRICTION
          that LOOKS lossy.
        measured_outcome: 'CTL_PLANT 96/96; CTL-NULL a/b/c 0/3000; CTL-NULL-D k>=1 members 0 on both primitives; k0 16/16; D-SHA1-INCODE 0/520. IT PASSES EVERY ARM, AND IT PASSES THE SUB-ARM TOO.'
        why_it_is_the_interesting_one: >-
          IT IS NOT KNOWN-FALSE, AND THAT IS THE POINT. It passes because it is
          EXACTLY AS POWERFUL AS THE HONEST INSTRUMENT ON THIS CENSUS: every census
          entry has in_linearized_code True, and a True flag means the 16 seed words
          DETERMINE the remaining 64. So the honest SHA-1 key's apparent 2560 bits of
          message-difference information are at most 512 bits plus one flag bit on
          every object that can match. THE SHA-1 MEMBERSHIP KEY IS FIVE TIMES SMALLER
          THAN IT LOOKS. No arm of the suite can see the difference, because no arm
          presents a non-codeword that agrees with a census entry on its seed window.
          Round 1's O5 was found by reading the committed source; this one is the same
          move applied to the CODE STRUCTURE rather than to the key list, and the
          contract's author could not have put it on a list of DELETIONS because it is
          not a deletion.
        what_it_bounds: >-
          Any statement of the form "the strengthened suite has power over the SHA-1
          message difference" is bounded above by power over dv[:16] plus one bit, on
          this census. Stating power over an 80-word object would be stating it wider
          than the census can support.

    # -------------------------------------------------------------
    - joint: J13
      alias: R-f
      statement_short: IS THE HEADLINE A POWER RESULT OR A RESTATEMENT OF THE CONSTRUCTION?
      verdict: breaks
      the_ruling_stated_as_the_mixed_thing_and_not_rounded_to_either_end: >-
        IT IS NEITHER A CLEAN POWER RESULT NOR A CLEAN TAUTOLOGY, AND IT IS NOT THE
        SYMMETRIC MIXTURE EITHER. IT IS A RESTATEMENT ON MD5 AND A SILENCE ON SHA-1,
        AND THE TWO HALVES FAIL TO BE A POWER RESULT FOR TWO DIFFERENT REASONS. The
        DETECTED verdict for `message_difference` is carried 2600/2600 by MD5 and
        0/2600 by SHA-1, and neither half licenses "the null now has power over the
        primary datum of a differential characteristic".
      md5_half:
        answer_to_the_plans_question: >-
          COULD AN ADJUDICATOR THAT DROPS message_difference STILL REJECT A FAMILY-(d)
          DRAW ON MD5? NO -- and not as a matter of measurement but as a matter of the
          key's structure. After the projection the surviving MD5 key components are
          exactly primitive, length, step_delta and block_index, and
          PERTURBATION_DECLARATION holds ALL FOUR fixed by construction. Orbit
          minimisation cannot separate them because it minimises over the same variant
          list for draw and source, and the projected key no longer contains the only
          component that differs. The two ablated canonical forms are IDENTICAL.
        measured: '2600 of 2600 MD5 k >= 1 draws are strict MEMBER against the message_difference-blind adjudicator; 520/520 in every one of the five k cells.'
        ruling: 'THE VERDICT WAS GUARANTEED IN ADVANCE BY THE CONSTRUCTION. It is a restatement of family (d)''s definition, dressed as a measurement.'
        how_much_content_it_does_have: >-
          NOT ZERO, AND I WILL NOT ROUND IT TO ZERO. The verdict would have failed if
          the perturbation had moved a second key component or if the projection had
          been applied OUTSIDE the minimisation -- and the package MEASURES that the
          inside/outside comparison is identical 32/32 per row, so that failure mode
          was checked rather than assumed. What is guaranteed is the DIRECTION of the
          verdict given a clean one-component perturbation; what is not guaranteed, and
          what the batch genuinely measured, is that the perturbation IS clean on MD5.
          That is a real measurement about family (d), and it is a measurement about
          the FAMILY, not about the SUITE'S POWER.
      sha1_half:
        answer_to_the_plans_question: >-
          COULD AN ADJUDICATOR THAT DROPS message_difference STILL REJECT A FAMILY-(d)
          DRAW ON SHA-1? YES, AND IT DOES SO ON EVERY SINGLE DRAW -- through a
          CORRELATED KEY COMPONENT, `in_linearized_code`, which is a DETERMINISTIC
          FUNCTION of the deleted component and which the projection leaves behind.
        measured: '0 of 2600 SHA-1 k >= 1 draws are MEMBER against the message_difference-blind adjudicator; the flag moves on 2600/2600.'
        ruling: >-
          THE SHA-1 ARM CONTRIBUTES NOTHING TO THE HEADLINE VERDICT, AND WHAT IT DOES
          SHOW IS A NEGATIVE ABOUT THE FAMILY RATHER THAN A POSITIVE ABOUT THE SUITE:
          family (d)'s primary arm does not isolate the SHA-1 message difference at
          all. And the row that deletes `message_difference` is not a deletion on
          SHA-1, because a one-bit lossy image of the deleted component survives the
          projection.
        the_only_sha1_route_to_a_detected_verdict_and_why_it_is_also_a_restatement: >-
          Row 5, which deletes message_difference AND in_linearized_code together, is
          the only row on which any SHA-1 object becomes a MEMBER (measured by me:
          2600/2600 SHA-1; the producer reports row 5 at 5200 total = 2600 MD5 + 2600
          SHA-1). But row 5 is a restatement by the SAME argument: once BOTH components
          that the perturbation moves are deleted, every surviving component is held
          fixed and membership is automatic. So SHA-1 has no row at all on which the
          DETECTED verdict is contingent on the instrument.
      the_general_statement_i_extract: >-
        A CONTROL FAMILY THAT PERTURBS EXACTLY THE SET S OF KEY COMPONENTS AND HOLDS
        EVERY OTHER KEY COMPONENT FIXED MAKES THE ROW DELETING S DETECTED BY
        CONSTRUCTION, AND MAKES EVERY ROW DELETING A PROPER SUBSET OF S DETECTED ONLY
        IF THE REMAINDER OF S IS NOT ALSO IN THE KEY. That single sentence predicts,
        from the construction alone and with no run, every DETECTED verdict this batch
        reports for rows 2 and 5 and every NOT DETECTED verdict for rows 1 and 4 and
        for the primitive/length/block_index rows of group 2. The only verdict it does
        NOT predict is row 3's (step_delta), which comes from a different mechanism
        entirely -- family (a) draws colliding once step_delta leaves the key -- and
        which the OLD suite already had.
      what_this_does_NOT_break: >-
        NOT ONE INTEGER. Every value I could compare reproduced exactly under a second
        implementation of the projection: rows 1, 2, 3-equivalents, 5-equivalent and
        the whole group-2 lattice. THE MEASUREMENTS ARE CORRECT AND THE PACKAGE'S OWN
        row-2 PROSE ALREADY STATES THE MD5-ONLY SPLIT IN CAPITALS. What breaks is the
        inference from those integers to a power claim, and the batch's own report is
        careful never to make that inference -- it explicitly composes no verdict. THE
        BREAK IS THEREFORE AGAINST A READING THE CLOSE COULD ADOPT, NOT AGAINST THE
        PACKAGE'S OWN STATEMENTS.

