    mechanism_used: >-
      MY OWN RE-IMPLEMENTATION of the declared projection and the membership verdict,
      over the COMMITTED serialisation and the COMMITTED perturbation. So it checks
      BOTH directions partially: that the reported numbers are what a second
      implementation of the contract's projection produces from the committed
      serialiser, and NOT that the committed serialiser implements the contract.
    quantity_1_the_sha1_flag_confound:
      derived_from: harness/diffpath/{primitives,pathobj,adjudicator}.py and controlpower.py, before any producer file
      my_derivation: >-
        The SHA-1 expansion is GF(2)-linear. For a source with in_linearized_code
        True, write dv' = dv XOR e where e is the indicator of the k flipped bit
        positions. Then expand(dv'[:16]) = dv XOR expand(e[:16]), so
        in_code(dv') <=> expand(e[:16]) == e, i.e. IFF THE PERTURBATION VECTOR IS
        ITSELF A CODEWORD. e has weight <= 16 for k in {1,2,4,8,16}. The map
        seed -> tail has trivial kernel (run the recursion backwards from t=31 and
        every seed word is forced to zero), so no nonzero codeword is supported
        inside the 16 seed words, and the code's minimum weight over 80 words is far
        above 16. PREDICTION: THE FLAG MOVES AT EVERY k >= 1 INCLUDING k = 1, and
        with certainty on the deterministic draw (positions = range(k), all inside
        word 0, so e[:16] != 0 with an all-zero tail).
      my_predicted_value: flag moves on essentially 100 percent of SHA-1 k >= 1 draws, at every k
      measured_by_me_afterwards: >-
        2600 of 2600 SHA-1 primary-arm k >= 1 draws move the flag. Per k and draw
        type: k=1 det 8/8, k=1 seeded 512/512, k=2 8/8 and 512/512, k=4 8/8 and
        512/512, k=8 8/8 and 512/512, k=16 8/8 and 512/512. Source flag True on
        8/8 SHA-1 entries. Of 2000 independently sampled perturbation vectors, 0 were
        codewords. k=0: 0/8 move, as required.
      producers_value_read_afterwards: >-
        The producer reports the SHA-1 arm of row 2 as 0 members at k >= 1,
        "attributed 520/520 per cell to `in_linearized_code` alone" (against the
        ablated key). AGREES WITH MINE EXACTLY. On the HONEST key the attribution I
        measure is `in_linearized_code+message_difference` on 2600/2600.
      agreement: EXACT
    quantity_2_was_the_detection_verdict_guaranteed_in_advance:
      my_derivation: >-
        MD5: after dropping `message_difference` every remaining strict key component
        (primitive, length, step_delta, block_index) is held fixed by the
        perturbation, and orbit minimisation runs over the same variant list for draw
        and source, so the two ablated canonical forms are IDENTICAL and every draw is
        a MEMBER at every k. GUARANTEED IN ADVANCE.
        SHA-1: `in_linearized_code` SURVIVES the projection and moves at every k, so
        the ablated adjudicator STILL REJECTS every SHA-1 draw and the SHA-1 arm
        contributes ZERO. PREDICTION: the row's DETECTED verdict is carried entirely
        by MD5, where it is a tautology; the SHA-1 arm shows the opposite thing.
      my_predicted_values: 'md5 k >= 1 members 2600/2600; sha1 k >= 1 members 0/2600'
      measured_by_me_afterwards: 'md5 2600/2600 (520/520 in every one of the five k cells); sha1 0/2600'
      producers_value_read_afterwards: 'row 2: CTL_NULL_D_k_ge_1_strict_MEMBER 2600, with the MD5-only split stated in the row block'
      agreement: EXACT

