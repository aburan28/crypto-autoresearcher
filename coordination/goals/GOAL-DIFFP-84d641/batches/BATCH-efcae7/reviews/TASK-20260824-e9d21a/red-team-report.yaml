      the_reversal: >-
        THE PROFILE IS NOT A REPORT CARD ON THE SUITE. IT IS A MAP OF THE MEMBERSHIP
        KEY'S FUNCTIONAL-DEPENDENCY STRUCTURE, AND THAT IS A STATICALLY COMPUTABLE
        OBJECT. I measured, on 960 constructed objects, that
