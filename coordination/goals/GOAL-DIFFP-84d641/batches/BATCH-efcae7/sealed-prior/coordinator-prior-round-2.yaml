  # =====================================================================
  why_this_file_exists_and_why_it_is_HERE:
    rule: >-
      BATCH-efcae7 BR-5. The assignment document a reviewer is ORDERED to read
      is SPLIT from the Coordinator's prior, and the prior is not part of any
      reviewer's mandatory-read set.
    the_defect_that_produced_the_rule: >-
      DEC-20260824-af6d5c PD-2. BATCH-f8bf86's blind re-derivation was
      STRUCTURALLY UNSATISFIABLE: `blind_from` named an item INSIDE the document
      the same plan ordered the reviewer to read first, and the blinded
      quantity's producer-reported value appeared TWICE MORE in that same
      mandatory-read document outside `blind_from`. No read order satisfied both
      instructions, and the round did not get the measurement it budgeted for.
    why_this_PATH_and_not_the_review_plan_directory: >-
      DELIBERATE AND MECHANICAL. Both reviewers' declared `read_scope` in
      dispatch_queue.json names
      `coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/review-plan`
      but NOT the BATCH-efcae7 root. A prior placed under `review-plan/` would
      therefore be INSIDE the mandatory-read scope, which is exactly the PD-2
      shape. This path -- `BATCH-efcae7/sealed-prior/` -- is outside both
      declared read scopes, so the seal is a DECLARED BOUNDARY and not an
      instruction. It is also named in the plan's `blindness.blind_from` as a
      literal path prefix.

  the_residual_leak_disclosed_rather_than_papered_over:
    what: >-
      THIS PRIOR IS NOT FULLY SEALABLE THIS ROUND AND SAYING OTHERWISE WOULD BE
      FALSE. The identical text of P-1..P-5 is already COMMITTED inside
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml, under
      `coordinator_prior_recorded_at_opening` and `prior`, and batch.yaml IS in
      both reviewers' declared read_scope. It was committed at the batch opening,
      before this session existed, and this program supersedes rather than
      overwrites, so it cannot be removed.
    what_is_therefore_actually_achieved_by_sealing: >-
      Two things, both real and neither total. (1) The ROUND-2 ADDENDUM below --
      written AFTER the producer's package existed and BEFORE any reviewer report
      returns, and containing this Coordinator's post-package expectations -- is
      genuinely unavailable to both reviewers. That is the part whose leakage
      would most directly steer a review. (2) NO PRODUCER-REPORTED VALUE FOR ANY
      BATCH-2 MEASUREMENT appears in the review plan, in either assignment
      document, or in the snapshot receipt, all three of which are inside the
      reviewers' read scope.
    what_is_NOT_achieved: >-
      The pre-run prior P-1..P-5 remains visible to both reviewers through
      batch.yaml, including its pre-registered comparison integers -- which are
      in any case ALSO in the frozen contract EXP-DIFFP-4b165f, itself mandatory
      reading. Those integers are BATCH-f8bf86 values, not batch-2 producer
      values, so BR-5's actual prohibition is not breached; but the Coordinator's
      DIRECTION OF EXPECTATION on P-2 is visible, and a reviewer who agrees with
      it agrees with a Coordinator it has read. THE CLOSE MUST DISCOUNT
      CONCURRENCE ON P-2's MECHANISM ACCORDINGLY and say so in the evidence
      record's uncertainty block.
    the_cheap_structural_fix_for_batch_3_named_now: >-
      Record the prior at batch opening in a file under a `sealed-prior/` prefix
      and REFERENCE it from batch.yaml by path only, rather than embedding it.
      Batch 3's opening should do that. It costs nothing and it makes the seal
      real instead of partial.

  # =====================================================================
  part_1_the_pre_run_prior_CARRIED_FORWARD_VERBATIM:
    provenance: >-
      REPRODUCED WITHOUT ALTERATION from
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml
      `prior`, as BR-5 and the queue's review_plan_note require ("the later plan
      must carry it forward VERBATIM; any revision is a `procedure_deviations`
      entry, never an edit"). NOT ONE WORD IS CHANGED. Where this Coordinator now
      thinks differently, that appears in part 2 as an addendum and never as an
      edit here.
    P-1:
      strength: STRONG
      prediction: >-
        CTL-REPRO reproduces every committed BATCH-f8bf86 integer EXACTLY at the
        seven declared seeds: CTL-PLANT 96/96; CTL-NULL 0/1000 per family in strict
        AND permissive; the 24 equivalence integers (E1 704/0, E2 2048/248 with the
        2048-0 / 0-248 split, E3 128/0, E4 4368/0 with its 4096/256/16 sub-counts,
        E5 256/0, E6 17/1); and E6's step_range (0,0) conditions_satisfied at
        2089 -- THE CORRECTED VALUE OF CORR-20260824-e0088c, NOT the 2094 that
        execution-report.yaml states in three places.
      why_held_strongly: >-
        TASK-20260824-c40847 already cold-re-ran these in a fresh process at 48/48
        exact agreement. A failure here is INFRASTRUCTURE SIGNAL about this
        environment or about a module having moved, never a mathematical finding
        and never a finding about the difference space (AGENTS.md rule 5).
      what_it_would_mean_if_it_failed: >-
        That the frozen instrument this batch measures is not the instrument
        BATCH-f8bf86 measured, which voids every comparison in this batch and is a
        STOP.
    P-2:
      strength: STRONG ON THE HEADLINE, AND THIS IS THE PREDICTION I TRUST LEAST AS EVIDENCE
      prediction: >-
        CTL-NULL family (d) returns MEMBER on every k = 0 arm and NON-MEMBER on
        every k >= 1 draw against the honest adjudicator, for both primitives.
      why_held_strongly: >-
        The red team's D3b at k = 1 is exactly this draw and it was measured:
        honest NON-MEMBER, delta_m-blind MEMBER.
      THE_SHARPEST_NEW_PREDICTION_IN_THIS_PLAN_AND_THE_ONE_I_EXPECT_TO_BREAK: >-
        ON SHA-1 AT LARGE k, I PREDICT THE REJECTION IS DECIDED BY THE WRONG
        COMPONENT. Flipping 8 or 16 bits of a DV almost certainly takes it out of
        the linearized code, so `in_linearized_code` -- which IS in the strict key
        for sha1 -- flips to False, and the draw is separated by the FLAG rather
        than by the message difference it was built to perturb. If that happens,
        family (d)'s SHA-1 arm has exactly the defect 0/3000 had: an outcome read as
        power over a component the control never actually probed. THIS IS WHY THE
        CONTRACT REQUIRES PER-DRAW COMPONENT ATTRIBUTION (CTL-NULL-D hard term H-3)
        AND A SEPARATE IN-CODE SUB-ARM (D-SHA1-INCODE). If I am right, the honest
        headline is that family (d) probes the message difference on MD5 at every k
        and on SHA-1 only in the in-code sub-arm, and the report must say so.
    P-3:
      strength: MODERATE, DELIBERATELY NOT STRONG
      prediction: >-
        The six declared battery rows reproduce the round-1 values exactly:
        HONEST (96/96, 0); message_difference deleted (96/96, 0) NOT DETECTED;
        step_delta deleted (96/96, 6) DETECTED; in_linearized_code deleted
        (96/96, 0) NOT DETECTED; message_difference AND in_linearized_code deleted
        (96/96, 0) NOT DETECTED; everything but primitive+length deleted
        (96/96, 3000) DETECTED. Suite detects 2 of 5.
      why_only_moderate: >-
        The round-1 battery was review-side code that WAS NEVER ARCHIVED AS AN
        ARTIFACT, and this batch re-implements the ablation by a DIFFERENT
        MECHANISM: a declared projection that drops named pairs from the serialised
        key tuple, applied without editing any committed module, rather than an
        edit to serialize(). A disagreement therefore localises to the mechanism
        rather than to the instrument, and is a FIRST-CLASS FINDING to be reported
        and localised, never a defect to be tuned away until it matches.
    P-4:
      strength: STRONG ON DIRECTION, WEAK ON THE INTEGER
      prediction: >-
        The strengthened suite (CTL-PLANT + CTL-NULL families a,b,c + family d)
        DETECTS the message_difference deletion, and STILL DOES NOT DETECT the
        in_linearized_code deletion, because no declared family perturbs the flag on
        an otherwise-matching object.
      why_weak_on_the_integer: >-
        "3 of 5" would be the wrong shape to report. The complete depth-1
        enumeration has six components under the strict key (primitive, length,
        message_difference, step_delta, block_index, in_linearized_code on sha1), so
        the denominator moves. THE HONEST REPORT IS PER-COMPONENT, NOT A FRACTION,
        and the contract requires it that way (CTL-ABL hard term H-6).
      the_successor_this_names_for_free: >-
        Null family (e) `in_code_flag_perturbed` -- a planted SHA-1 entry with
        `in_linearized_code` flipped and everything else held fixed -- would detect
        that ablation on its first draw. IT IS NAMED AND DELIBERATELY NOT BUILT
        HERE: the goal head's next_action authorises family (d) and the battery, and
        adding families until the suite detects everything is strengthening the
        instrument rather than measuring it. It is an open direction for batch 3.
    P-5:
      strength: STRONG
      prediction: >-
        CTL-GEN-ACT reproduces {E3} 1 image per object, {E1} 8 per sha1 object and
        0 per md5 object, {E4} 0, {E5} 0, {E4,E5} 0; and confirms that E5 changes no
        serialised key and no verdict on any declared object, and that E4's only
        key effect is the REMOVAL of signed_representation.
      what_I_do_NOT_predict_and_want_measured: >-
        Whether E4's presence or absence ever changes a VERDICT on the declared
        object set beyond the single D4 boundary object -- that is, whether the one
        key-component deletion the strict group performs is ever load-bearing in
        practice, or whether {E1,E3} is the whole of it. Nobody has measured that
        and I do not know the answer.
    review_round_prior_in_one_sentence: >-
      I EXPECT THE REVIEW TO CONFIRM THE REPRODUCTION (P-1, P-3, P-5) AND TO BREAK
      THE READING THAT FAMILY (d) MEASURES THE MESSAGE DIFFERENCE ON SHA-1 (P-2),
      on the in_linearized_code mechanism named above; so the honest composed
      verdict is `analyzed` with the null's power MEASURED PER COMPONENT rather than
      stated as a fraction, and with the SHA-1 arm's power attributed to whichever
      component the attribution vectors actually show decided it.
    what_would_overturn_this_wholesale: >-
      A code_path_fingerprint that does not match the tree; a seed outside the eight
      declared; an undeclared run directory; any modification to a committed file
      under harness/ (CTL-FROZEN); or a CTL-REPRO disagreement. Any of those makes
      the batch an infrastructure finding rather than a research finding, and it
      would be reported as exactly that.

  # =====================================================================
  part_2_the_ROUND_2_ADDENDUM:
    binding_status: >-
      RECORDED BEFORE ANY REVIEWER REPORT RETURNS AND BEFORE EITHER REVIEWER IS
      DISPATCHED. It is an ADDENDUM, not an edit: part 1 stands byte-identical to
      batch.yaml and every difference of expectation is stated here. It is scored
      ITEM BY ITEM at the close alongside part 1, and the close must record which
      items were met, which were overturned, and in which direction.
    why_a_second_prior_at_all: >-
      Part 1 was written before the producer's package existed. This Coordinator has
      now READ that package in order to write the review plan, and a plan's author
      who has read the results and records no updated expectation is one who can
      claim afterwards to have expected whatever the reviewers find. Batch 1's prior
      was overturned in BOTH directions, which was the most informative shape it
      could have had; this addendum is written to be falsifiable in the same way.
    A_1_what_I_now_think_P_2_got_right_and_how_far:
      expectation: >-
        P-2's SHARPEST prediction -- that the SHA-1 rejections are decided by
        `in_linearized_code` rather than by the perturbed message difference -- I now
        expect the Validator to CONFIRM as a matter of arithmetic, and I expect it to
        hold MORE WIDELY than P-2 predicted: P-2 scoped the confound to k in {8,16};
        I now expect it at every k INCLUDING k = 1.
      why_that_matters_more_than_it_looks: >-
        A confound that appears only at large k is a statement about how far a
        perturbation travels. A confound present at k = 1 is a statement about the
        CONSTRUCTION: the family cannot perturb a SHA-1 message difference by any
        amount without also moving the flag, so the SHA-1 primary arm never had an
        isolating draw to begin with. THOSE ARE DIFFERENT FINDINGS AND THE CLOSE MUST
        NOT COMPOSE THEM AS ONE. Getting the direction right while getting the
        breadth wrong is a partial hit, and it is scored as a partial hit.
      what_would_falsify_this_addendum_item: >-
        Any SHA-1 primary-arm rejection at any k attributed to the message
        difference alone.
    A_2_the_expectation_I_hold_LEAST_confidently_and_most_want_attacked:
      expectation: >-
        I expect the Red Team's R-a to SUCCEED -- to construct an instrument that
        passes the strengthened suite and is still known-false -- and I expect the
        cheapest such instrument to be one that reads a LOSSY FUNCTION of the message
        difference rather than its value, or one that reads the message difference on
        one primitive only.
      why_I_hold_it_weakly: >-
        I am the author of the candidate list, which is the exact position from which
        O5 was invisible in round 1. THE VALUE OF R-a IS IN THE OBJECT I DID NOT
        NAME, and a success on a candidate I supplied is worth materially less than a
        success on one I did not. If the Red Team returns only objects from my floor
        list, the close records that the adversarial pass was BOUNDED BY THE PLAN'S
        IMAGINATION and does not treat the list's exhaustion as coverage.
      what_would_falsify_it: >-
        A worked demonstration, within the Red Team's budget, that every candidate
        instrument fails at least one arm of the strengthened suite -- which would be
        a genuinely strong result for the instrument and one I do not expect.
    A_3_the_shape_of_the_headline_I_expect_to_have_to_write:
      expectation: >-
        I expect the honest composed statement to be NARROWER than "the strengthened
        suite detects the message_difference deletion", and specifically to require a
        PRIMITIVE SCOPE and an ISOLATION CAVEAT in the same sentence. I expect the
        close to have to say that the detection is carried by one primitive's arm,
        and that of the six depth-1 components only one is ISOLATED by any declared
        family, so that five NOT DETECTED verdicts mean THE SUITE DID NOT LOOK rather
        than THE SUITE LOOKED AND SAW NOTHING.
      the_thing_I_am_most_afraid_of_writing_by_accident: >-
        A sentence of the form "the suite now detects N of M components", which would
        repeat BATCH-f8bf86's own error one layer up: a true fraction that does not
        mean what a reader takes it to mean. IR-10 forbids it and I am recording here,
        before the reports arrive, that I expect the temptation to be strong.
    A_4_the_tautology_risk_I_am_asking_the_RED_TEAM_to_decide:
      expectation: >-
        I SUSPECT, AND CANNOT DECIDE FOR MYSELF, that "a control that detects exactly
        the component it perturbs" may measure nothing beyond its own construction --
        that family (d) perturbs the message difference, so an adjudicator blind to
        the message difference must accept its draws, and the DETECTED verdict is
        then a restatement of the construction rather than a measurement of power.
        I EXPECT THIS TO BITE AT LEAST PARTIALLY.
      why_I_may_not_decide_it: >-
        I designed family (d) and I approved the contract. The author of a
        construction is the reader least able to judge whether its output is a
        consequence of the construction. This is joint R-f and it is the Red Team's.
      what_a_partial_bite_would_look_like: >-
        The verdict is non-trivial only to the extent that the detection was NOT
        guaranteed in advance -- and there is a real sense in which it was not, since
        an adjudicator can drop a component from its key and still reject a draw
        through orbit minimisation or through a correlated component, which is
        precisely what the SHA-1 half is reported to do. If the Red Team finds that,
        the honest statement is that the row measures something on one primitive and
        restates the construction on the other.
    A_5_what_I_expect_to_be_WRONG_about:
      candid_item: >-
        I expect at least one of my part-1 predictions to be overturned in a
        direction I have not anticipated here, because that is what happened in batch
        1 in both directions. THE MOST LIKELY CANDIDATES, NAMED SO THE CLAIM IS NOT
        RETROFITTED: P-5's generator action profile, where I predicted per-object
        image counts and the producer reports aggregates, so a normalisation
        disagreement is live; and P-4's claim that no declared family perturbs the
        flag, which the producer's own D-SHA1-INCODE sub-arm may complicate.
      standing_instruction_to_myself_at_the_close: >-
        Score part 1 and part 2 ITEM BY ITEM. Do not report the prior as "broadly
        confirmed". An item met is met, an item overturned is overturned, and an item
        that turned out not to be checkable is recorded as not checkable.
    A_6_what_this_prior_may_NOT_be_used_for: >-
      IT IS NOT EVIDENCE. It changes no hypothesis status, admits no package, and
      settles no joint. If a reviewer's finding agrees with it, that agreement is
      DISCOUNTED to the extent the reviewer could have read part 1 in batch.yaml, and
      the close says so. If a finding contradicts it, the finding wins and the prior
      is recorded as overturned, in the direction it was overturned.
