        `review_architecture_as_filed`.
      why_the_pass_1_argument_failed_on_its_own_terms: >-
        IT HAD THE SHAPE OF THE FAILURE THIS BATCH EXISTS TO MEASURE. "The
        adversarial objects are declared, therefore the adversary has nothing to add"
        is "the controls passed, therefore the adjudicator discriminates", one level
        up, applied to a review architecture instead of to an instrument -- and this
        goal holds a MEASURED counterexample to it. O5, the delta_m-blind adjudicator
        that defined BATCH-f8bf86, was added by the reviewer, was not on the plan's
        list, and became constructible only after reading the committed source; every
        CTL-ABL row in EXP-DIFFP-4b165f is derived from it. Decisively, this contract
        creates a NEW claim that no object inside it attacks: the pre-registered rows
        measure the OLD suite, while the STRENGTHENED suite's proves-too-much object
        is by construction absent, because the contract's author is the one who would
        have had to imagine it. AND THE DEFERRAL WAS WORSE THAN IT LOOKED: a batch-3
        pass could not have been blind, since EV-DIFFP-b16b01 and DEC-20260824-c5bb72
        would already be committed and the adversary would attack a claim after
        reading the Coordinator's own composition of it.
      standing_consequence: >-
        Completion criterion 4 is now REACHABLE and is still NOT MET BY SHAPE. It
        requires that both sessions ADMIT the package, which the close determines
        from the reports it actually receives.
    - id: PD-B
      what: >-
        ONE NEW SEED (84064107) BEYOND EXP-DIFFP-fe894e's SEVEN, against
        DEC-20260824-af6d5c's phrasing that family (d) "needs no new seeds".
      why: >-
        A single deterministic perturbation per k measures one point, not a family,
        and a control with one draw per cell cannot report a rate. The contract
        carries BOTH a seedless deterministic draw and 64 seeded draws per cell,
        reported separately. Declared before any run.
    - id: PD-C
      what: >-
        THE ABLATION BATTERY IS EXTENDED beyond the six declared rows to the
        complete depth-1 single-deletion lattice.
      why: >-
        EV-DIFFP-b878aa's own obstruction states that "2 of 5" is a point estimate
        over a hand-chosen five-element sample. The six declared rows are reported
        FIRST and SEPARATELY as the replication that was asked for; the extension is
        reported separately and never merged into that fraction.
    - id: PD-D
      what: >-
        THE ABLATION MECHANISM IS DIFFERENT FROM ROUND 1's -- a declared projection
        on the serialised key tuple rather than an edit to serialize().
      why: >-
        IR-2 forbids editing a committed module, and the measured instrument must
        stay byte-identical to the reviewed one. The cost is that a disagreement
        with round 1 localises to the mechanism, and the prior records P-3 as
        MODERATE rather than STRONG for exactly that reason.
    - id: PD-E
      what: >-
        TWO SUB-ARMS ADDED TO FAMILY (d) beyond the goal head's wording:
        D-SHA1-INCODE and D-VD3-PROFILE.
      why: >-
        D-SHA1-INCODE isolates the message difference from `in_linearized_code` on
        SHA-1, where a large-k bit flip almost certainly leaves the linearized code
        and the flag decides the rejection instead -- the same over-reading that
        produced 0/3000. D-VD3-PROFILE measures VD-3's read path as a pre-repair
        regression baseline and is reported separately, never counted into family
        (d)'s pass/fail.
