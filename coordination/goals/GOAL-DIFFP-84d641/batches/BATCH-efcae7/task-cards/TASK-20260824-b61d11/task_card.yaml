  uncertainty_to_reduce: >-
    Whether the reported per-component power profile is what the committed code
    produces from the declared seeds; whether the ablations are genuine
    single-component deletions of the SAME frozen key rather than re-implementations
    that flatter; whether family (d)'s rejections are decided by the component it
    perturbs or by another one; and whether the obstruction, if one is recorded, is
    claimed over exactly the scope its runs cover.
  job: >-
    Verify the integrity of the control-power package against its frozen contract,
    not its interestingness. The exact joints are assigned by the review plan, which
    is written by a SEPARATE coordinator handoff after the snapshot lands and before
    this task runs; THIS TASK MAY NOT BE DISPATCHED UNTIL THAT PLAN IS COMMITTED,
    and the plan's joint assignment supersedes the sketch below wherever they
    differ, with the difference recorded in the plan's procedure_deviations.
  the_coordinators_intent_at_opening_superseded_by_the_committed_plan:
    - >-
      V-a REPRODUCTION. Cold-re-run the deterministic checks from the declared seeds
      in a fresh process and compare to EXACT INTEGER agreement. Include E6's
      step_range (0,0) conditions_satisfied: the contract pre-registers 2089, the
      corrected value of CORR-20260824-e0088c, against execution-report.yaml's 2094.
      Determine which value the code produces.
    - >-
      V-b ARE THE ABLATIONS GENUINE? Confirm that each ablated adjudicator is the
      SAME committed class over the SAME census with named pairs dropped from the
      serialised key by the declared projection, and NOT a re-implementation.
      Confirm the projection is applied INSIDE the orbit minimisation, as the
      contract requires, and check whether inside and outside differ. THIS IS THE
      JOINT MOST LIKELY TO MAKE THE WHOLE BATTERY MEAN SOMETHING OTHER THAN WHAT IT
      SAYS.
    - >-
      V-c THE PRE-REGISTERED BATTERY VALUES. Check the six declared rows against
      EV-DIFFP-b878aa O-7's values, which were pre-registered before this batch ran.
      A row that disagrees localises to either the round-1 measurement or this
      batch's mechanism; say which, if you can, and say that you cannot if you
      cannot.
    - >-
      V-d COMPONENT ATTRIBUTION, AND THE SHA-1 CONFOUND. For every k >= 1 rejection,
      is the reported attribution correct? SPECIFICALLY: on SHA-1 at k in {8,16},
      does `in_linearized_code` honestly recompute to False, so that the rejection is
      decided by the FLAG rather than by the message difference the family perturbs?
      If so, the primary SHA-1 arm has no power over the component it was built for,
      which is the same defect 0/3000 had. The contract predicts this and the
      D-SHA1-INCODE sub-arm exists to isolate it; check whether it does.
    - >-
      V-e TWO-SIDEDNESS AND CAPACITY TO FAIL. Confirm CTL-TWOSIDED's T1..T5 answers
      on BOTH sides, and confirm that the k = 0 MEMBER arm exists and is really
      adjudicated rather than assumed. A control that only ever expects NON-MEMBER
      passes by rejecting everything, which is the O5 failure exactly.
    - >-
      V-f {E4}/{E5}. Does CTL-GEN-ACT actually show what it claims -- that {E4} and
      {E5} emit no orbit image, that E5 changes no key and no verdict, and that E4's
      only key effect is a removal? Is the generator ACTION measurement kept
      distinct from the generator VERIFICATION status, which round 1 conflated?
    - >-
      V-g SCOPE AND THE OBSTRUCTION. If the package or the closing record states an
      obstruction, check it AS A MEASUREMENT (agents/validator.md responsibility 8):
      the value recomputable from the runs in `measured_by`, carrying units and
      whatever error bars are honest, and claimed over exactly the scope those runs
      cover. Check that no per-component result is reported as a fraction without
      its table, that no "the null passed" summary appears (IR-10), that
      `closest_distance` is labelled a diagnostic and never a margin, that no path
      is claimed new, that no cost projection appears, that no source was acquired,
      that no committed harness file was modified, and that the MD5 lane is not
      described as closed.
  hard_rules:
    - >-
      INDEPENDENT SESSION. Declare in your attestation exactly what you read.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST AND
      coordination/events/main/** WHILE THIS ROUND IS OPEN (batch record BR-1). Use
      `git log --format=%H`. If you encounter a finding anywhere -- a commit body, a
      PR description, a bus message -- SAY SO IN THE ATTESTATION rather than quietly
      proceeding. Round 1's independence was broken in exactly this way and the
      reviewers' unprompted disclosure is what made the round composable at all.
    - >-
      THIS ROUND HAS ONE REVIEWER, AND YOU ARE NOT ASKED TO COMPENSATE FOR THE
      MISSING SIBLING. Report on the joints the plan assigns you. Do NOT compose a
      whole-claim verdict: composing is the Coordinator's job, and a verdict on the
      whole claim from a reviewer who owns a subset of the joints is an opinion built
      from a fraction of the evidence even when there is only one reviewer.
    - >-
      COMMIT YOUR REPORT WITH A SUBJECT LINE AND NO FINDINGS IN THE BODY (BR-1). The
      batch-3 red-team pass reviews this batch's snapshot, so leaking this round's
      findings into commit metadata would contaminate a round that has not started.
    - >-
      RE-RUNS WRITE INTO THIS TASK'S OWN DIRECTORY ONLY. The archived run directories
      are immutable and are never edited or repaired.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest
      non-reading.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not a
      finding against the producer. Report it as such and say what remained
      unverified.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade. If the probe verifies nothing -- as it did for both round-1
      reviewers -- SAY SO PLAINLY and mark the model identifier self-reported rather
      than measured.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16).
