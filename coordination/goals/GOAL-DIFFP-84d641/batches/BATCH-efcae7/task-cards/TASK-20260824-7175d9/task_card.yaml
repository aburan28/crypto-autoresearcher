task_card:
  id: TASK-20260824-7175d9
  title: >-
    RANK 3: Isolated content_first SNAPSHOT archive of the BATCH-efcae7 opening
    control plane and the control-power measurement package -- runs ALONE, before
    the independent review
  batch_id: BATCH-efcae7
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  rank: 3
  role: coordinator
  policy: coordinator-orchestration-code
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260824-b7efbf
    - TASK-20260824-9a489e
  archived_by: >-
    TASK-20260824-7175d9 (self-archive; the receipt is content_first and binds
    path_sha256 over the snapshot set, with its own commit named in the post-commit
    field)
  handoff: ledger/handoffs/TASK-20260824-7175d9.yaml
  review_required: false
  state: queued
  archive:
    kind: snapshot
    binding_mode: content_first
    source_task_ids:
      - TASK-20260824-b7efbf
      - TASK-20260824-9a489e
  budget:
    wall_clock_seconds: 240
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    maximum_runs is 1 because the dispatch schema rejects 0; this task performs no
    experiment runs. 240 s rather than BATCH-f8bf86's 180 s because PD-4 records
    against this role that batch-1 stage budgets were cut without a basis and the
    work was then asked for anyway.
  uncertainty_to_reduce: >-
    Whether the artifacts the reviewer will attack are the exact bytes the producer
    wrote, fixed and reachable, rather than a working tree that can still move under
    them -- and whether the frozen instrument the producer measured is byte-identical
    to the one BATCH-f8bf86's review attacked.
  job: >-
    Snapshot-archive the exact BATCH-efcae7 package -- the opening control plane
    (batch record, dispatch queue, five task cards, five handoffs, the frozen
    contract EXP-DIFFP-4b165f) and the producer's control-power measurement package
    (the new module, the new test file, the four result artifacts, run-index.json
    and the execution report) -- under a content_first binding, with pre-freeze
    checks, BEFORE the independent review runs. Then push the branch and refresh the
    PR against main.
  hard_rules:
    - >-
      RUNS ALONE. No other task may be running concurrently, and THE REVIEW MAY NOT
      START before this commit exists and is verified.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an
      evidence-integrity failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE. Rebasing rewrites the commits run records
      were archived in. Record the base commit checked and the merge outcome in the
      receipt. A SYNC CONFLICT INSIDE AN IMMUTABLE RECORD IS NEVER RESOLVED BY
      PICKING A SIDE: it is a new superseding record under a new id.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE ROUND CLOSES
      (batch record BR-1). No findings, verdicts, mechanisms or integers in any
      commit body, PR description, bus message or branch name while the review round
      is open. This is the adopted mitigation for PD-1, where the driving session
      leaked validator findings to the red team through a commit message body in a
      shared worktree.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This task
      archives; it does not review. In particular it does not adjudicate whether the
      per-component power table means the instrument discriminates.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output.
      Never record a command that was not executed.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** and attest
      non-reading.
    - >-
      DO NOT RECOMPUTE-BY-QUOTING. Any scalar this receipt binds is either measured
      by this session or quoted WITH ITS PROVENANCE AND MARKED UNVERIFIED (BR-6).
      PD-3 and CORR-20260824-cc2d27 record the concrete cost of the alternative: a
      defective producer integer propagated two hops into Coordinator artifacts and
      reached a reviewer's instructions.
  required_pre_freeze_checks:
    - origin/main fetched and merged into the working branch, base commit recorded
    - tools/validate_ledger.py run on the merged tree, output recorded verbatim
    - >-
      tools/research_dispatch.py run against this batch's queue, output recorded
      verbatim, including any warning about the archive.path_sha256 subset rule
    - >-
      CTL-FROZEN CROSS-CHECK: recompute the sha256 of every file under
      harness/diffpath/ plus harness/__init__.py and harness/runner.py from the tree
      and compare against the producer's pre-run and post-run digest sets in
      repro-and-frozen-result.json. A difference is a STOP and is reported as an
      infrastructure finding, not archived over.
    - >-
      RUN-INDEX BINDING CHECK: confirm that run-index.json carries a sha256 for
      EVERY FILE OF EVERY EXECUTED RUN and that each matches the tree. This is how
      the run directories are content-bound without being declared artifact_paths.
    - no dirty-tree drift outside the declared paths
  required_disclosures_in_staged_not_in_binding_set:
    - >-
      ledger/goals/GOAL-DIFFP-84d641.yaml -- written at this batch's opening by
      TASK-20260824-b7efbf but OWNED as an artifact by TASK-20260824-b3e02b
      (batch artifact_ownership_note).
    - >-
      Every run directory under
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/tasks/TASK-20260824-9a489e/runs/,
      with the note that they are content-bound through run-index.json, which IS in
      the binding set.
    - >-
      Any sibling module the producer wrote under harness/diffpath/ beyond the bound
      harness/diffpath/controlpower.py. The contract declares one new module; if
      more exist, they are disclosed by name and the deviation is recorded.
  note: >-
    After the commit, push the branch and refresh PR #530 (branch
    claude/differential-cryptanalysis-harness-5b5fdq), NAMING BATCH-efcae7,
    EXP-DIFFP-4b165f, GOAL-DIFFP-84d641, the minted opening decision id, and every
    TASK-20260824-* record of this batch -- WITH NO FINDINGS IN THE PR BODY WHILE
    THE ROUND IS OPEN (BR-1). A record that exists only in a local commit is
    UNPUBLISHED and downstream review must not treat it as durable evidence.
    MEASURE AND RECORD THE COMMIT SHA and the merge base. The goal head's
    latest_verified_commit currently carries 2dc4d1328e7804ab2494fec8d45f9c16aba53ff3,
    the value the driving session measured at the BATCH-f8bf86 close; the driving
    session separately reported HEAD 3ccc31958726a99dabc18d6aff218c3d269bb5b0 with a
    clean tree at this batch's opening. THIS TASK IS THE FIRST OF THIS BATCH THAT CAN
    MEASURE A SHA FROM GIT RATHER THAN RESTATE ONE IT WAS TOLD; the ledger close
    (TASK-20260824-b3e02b) writes it into the goal head.
    THE REVIEW PLAN IS WRITTEN AFTER THIS ARCHIVE AND BEFORE THE REVIEWER RUNS, by a
    separate coordinator handoff, and must satisfy BR-1..BR-7 of the batch record:
    short joint ids, literal-path-prefix blind_from, a top-level
    proves_too_much.failure_signature roll-up, an assignment document carrying no
    producer-reported value for any blinded quantity, and the Coordinator's prior
    carried forward VERBATIM from batch.yaml.
