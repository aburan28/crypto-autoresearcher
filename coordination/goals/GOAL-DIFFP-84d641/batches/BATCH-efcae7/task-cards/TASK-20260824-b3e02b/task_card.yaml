  uncertainty_to_reduce: >-
    Whether this program's adjudicator control suite now has MEASURED power against
    the deletion of the primary datum of a differential characteristic, per
    component and under run discipline -- and, given what the measurement shows,
    what the single most valuable next action is: the deferred red-team pass, the
    five instrument repairs, Tier C acquisition, or the re-aimed CTL-OBS direction.
  job: >-
    Close BATCH-efcae7: compose the single independent review into one ruling AT THE
    EXACT TESTED SCOPE, file the evidence record EV-DIFFP-b16b01 and the closing
    decision DEC-20260824-c5bb72, checkpoint the goal head with EXACTLY ONE
    next_action, and commit under a content_first ledger binding with the
    tools/validate_ledger.py and tools/check_review_independence.py outputs recorded
    verbatim.
  hard_rules:
    - >-
      RUNS ALONE, and stages only the declared paths.
    - >-
      ledger/evidence IS LIMITED TO EXACTLY ONE NEW FILE, EV-DIFFP-b16b01.yaml, and
      ledger/decisions TO EXACTLY ONE NEW FILE, DEC-20260824-c5bb72.yaml. The
      OPENING decision is a separately minted id filed by the driving session at the
      opening commit and is not this task's to write.
    - >-
      MERGE origin/main BEFORE THE ARCHIVE (MERGE, NEVER REBASE), record the base
      and outcome, and push and refresh the PR after.
    - >-
      COMPOSE, DO NOT COUNT, AND DO NOT INFLATE A SINGLE REVIEWER INTO A CONSENSUS.
      A blinded reviewer's verdict covers only the joints it owns; the scalar
      `verdict` in its attestation is a lossy rollup required by
      tools/check_review_independence.py's schema and is never composed in place of
      the per-joint map. WITH ONE REVIEWER THERE IS NO AGREEMENT TO REPORT AND NONE
      MAY BE IMPLIED.
    - >-
      RECORD EXPLICITLY THAT GOAL-DIFFP-84d641 COMPLETION CRITERION 4 IS NOT
      SATISFIED BY THIS BATCH, because it requires both an independent Validator and
      an independent Red Team and this round had one reviewer. Do not record it as
      met, do not round it up, and carry the deferred red-team pass forward with its
      named object.
    - >-
      SCORE THE RECORDED PRIOR EXPLICITLY, ITEM BY ITEM (P-1..P-5 and the
      review-round prior), from batch.yaml `prior`, WHICH IS NOT EDITED. A prior the
      review overturns is among the most valuable results available and is recorded
      as a first-class finding, not absorbed. Round 1's prior was overturned in both
      directions and that was the most informative shape it could have had.
    - >-
      REPORT THE POWER PROFILE AS A TABLE, NEVER AS A PASS AND NEVER AS A BARE
      FRACTION. If the strengthened suite detects more ablations than the old one,
      SAY WHICH COMPONENTS AND WHICH REMAIN UNPROBED BY NAME. A better control is
      not a cryptanalytic improvement and must not read as one.
    - >-
      DO NOT CLAIM ANY PATH IS NEW, and do not let any NON-MEMBER verdict be written
      or implied as novelty. State the census's completeness (readable 0 /
      quarantined_not_read 1 / acquisition_gap 8, NEVER SUMMED; shadow_planted 16
      separate) beside every verdict cited.
    - >-
      CLAIM CEILING IS `analyzed`. Do not round up, do not record `supported` on any
      record of this batch, and state the ceiling explicitly rather than leaving it
      to inference.
    - >-
      THE MD5 LANE IS BLOCKED, NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged
      and the Tier B unblocking route is intact. Letting "blocked" drift into
      "closed" is premature closure under docs/inventor-protocol.md.
    - >-
      IF ANY ADVERSE TRANSITION IS PROPOSED, secure the strongest checkable
      refutation artifact the result admits FIRST -- counterexample certificate, then
      derivation note, then a declared empirical_only basis -- archive it before the
      decision that relies on it, and record proof_status and proof_refs on the
      evidence record. `reject_scoped` on a single unreplicated empirical-only run is
      FORBIDDEN; the route is `weaken` plus replication.
    - >-
      A FAILING CONTROL, A FAMILY WITH NO POWER OVER ITS OWN COMPONENT, OR AN
      EXHAUSTED TASK BUDGET ENDS A TASK, NOT THIS GOAL. Preserve exactly one concrete
      next action on the goal head.
    - >-
      FILL knowledge_promotion. THE DEFERRED KN-TECH ENTRY IS OWED AND ITS CONTENT IS
      ALREADY SPECIFIED in DEC-20260824-af6d5c
      `what_the_entry_must_contain_when_it_is_written`: the census schema with its
      three never-summed counts and the separate shadow population; the per-generator
      verification status TOGETHER WITH each generator's ORBIT ACTION; the two
      controls AND the ablation battery that measures what they can detect; the
      two-sided known-answer decoy design; and the standing warning that in an
      exact-key adjudicator a reported distance is not a margin. Promote it ONLY if
      this decision is `support` or `reject_scoped` on `replicated` or `strong`
      evidence; otherwise record a concrete not_warranted reason and say whether the
      deferral is now a second deferral, which would itself be worth noting.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output. If
      the session has no shell, attribute every measured value by name to the session
      that measured it and leave null what was not transmitted.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES REMAIN IN FORCE UNTIL THIS COMPOSITION
      COMMIT (BR-1). This commit is where the findings may finally appear in a body,
      and even then the batch-3 red-team pass reviews this batch's snapshot, so the
      safer default is to keep the body a pointer to the records.
  mandatory_content_of_the_closing_decision:
    - >-
      A VALIDITY CHECK BEFORE ANY INTERPRETATION: expected run count against runs
      that exist, schema-complete manifests carrying the literal id
      EXP-DIFFP-4b165f, seed integrity over the eight declared seeds with no ninth,
      raw-versus-summary agreement, CTL-FROZEN's before/after digest identity, and
      control comparability. AN INVALID OR INCOMPLETE RUN SET GOES BACK TO THE
      EXECUTOR WITH CONCRETE DEFECTS LISTED; IT IS NOT EVIDENCE.
    - >-
      An `obstruction` block with a QUANTITY, its value with units and honest error
      bars (including the explicit statement of which variability is unmeasured --
      depth >= 2 subsets and a second seed set), the runs it is read from, its
      scope, and its `resource_check` -- if and only if the decision weakens or
      closes anything. Prose does not discharge the closure gate.
    - >-
      The per-component power table, reported for the OLD and the STRENGTHENED suite
      separately, with group 1 (the six declared replication rows) never conflated
      with group 2 (the depth-1 lattice extension).
    - >-
      An explicit statement of what this batch did NOT do: it repaired nothing,
      acquired nothing, searched nothing, minted no IDEA-* id from the unreviewed
      proposal set, and did not satisfy completion criterion 4.
