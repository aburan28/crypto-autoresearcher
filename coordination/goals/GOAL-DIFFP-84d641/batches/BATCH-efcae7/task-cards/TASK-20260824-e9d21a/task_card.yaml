task_card:
  id: TASK-20260824-e9d21a
  title: >-
    RANK 4: Red Team (INDEPENDENT SESSION, review-adversarial at xhigh) -- attack
    the STRENGTHENED suite, not the old one: build an instrument that PASSES
    CTL-PLANT + CTL-NULL(a,b,c) + CTL-NULL-D and is still known-false; run the
    obstruction reversal; attack the closure as hard as the claim; sibling-blind
    against TASK-20260824-b61d11
  batch_id: BATCH-efcae7
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  rank: 4
  role: red-team
  policy: review-adversarial
  reasoning_effort: xhigh
  independent_session_required: true
  depends_on:
    - TASK-20260824-9a489e
    - TASK-20260824-7175d9
  archived_by: TASK-20260824-b3e02b
  handoff: ledger/handoffs/TASK-20260824-e9d21a.yaml
  review_required: false
  state: queued
  budget:
    wall_clock_seconds: 600
    memory_gb: 4
    maximum_runs: 3
  budget_note: >-
    600 s, against batch 1's 360 s per reviewer, and the basis is stated rather than
    assumed. DEC-20260824-af6d5c PD-4 is recorded against the Coordinator role for
    cutting review budgets without a basis and then asking for more than they bought;
    the round-1 Red Team paid that difference in unmeasured wall clock. 600 rather
    than the 720 a single reviewer carrying BOTH joint sets was given, because the
    joints now split across two sessions and this task owns five adversarial joints
    rather than seven mixed ones.
    `maximum_runs` IS 3 AND IS DEFINED: it counts CHARGED EXPERIMENT RUNS UNDER A
    CONTRACT -- a run directory, a RUN-* id, a manifest, an armed deadline and a
    consumed ceiling. IT DOES NOT COUNT SCRIPT EXECUTIONS, read-only probes,
    adversarial constructions, or unit-test invocations, however many you run. Round
    1's Red Team asked which reading governed and charged itself conservatively for
    work this field never covered; the ambiguity is closed here rather than left for
    the next reviewer to guess (DEC-20260824-af6d5c budget_adjudication).
  uncertainty_to_reduce: >-
    Whether the conclusion this batch wants to draw -- "the strengthened suite
    detects the deletion of the message difference, therefore the null now has power
    over the primary datum of a differential characteristic" -- survives objects for
    which it is KNOWN FALSE. The old suite's proves-too-much object exists and is
    measured (O5, the delta_m-blind adjudicator). THE STRENGTHENED SUITE'S DOES NOT,
    and by construction it cannot be in the contract, because the contract's author
    is the one who would have had to imagine it.
  job: >-
    Attack the interpretation of the control-power package before the Coordinator
    composes it. The exact joints are assigned by the review plan, which is written
    by a SEPARATE coordinator handoff after the snapshot lands and before this task
    runs; THIS TASK MAY NOT BE DISPATCHED UNTIL THAT PLAN IS COMMITTED, and the
    plan's joint assignment supersedes the sketch below wherever they differ, with
    the difference recorded in the plan's procedure_deviations.
  what_this_task_owns_that_the_validator_does_not:
    boundary: >-
      THE VALIDATOR OWNS WHETHER THE REPORTED NUMBERS ARE WHAT THE CODE PRODUCES AND
      WHETHER THEY ARE SCOPED HONESTLY. THIS TASK OWNS WHETHER THE CONCLUSION DRAWN
      FROM THEM SURVIVES OBJECTS FOR WHICH IT IS KNOWN FALSE. On the one joint where
      the two come closest -- component attribution -- the split is explicit: the
      Validator checks that the producer's attribution is CORRECT; this task checks
      whether correct attribution is SUFFICIENT for the power claim.
    R_a_proves_too_much_on_the_strengthened_suite: >-
      THE LOAD-BEARING JOINT OF THIS ROUND. Construct an instrument that PASSES the
      strengthened suite (CTL-PLANT + CTL-NULL families a, b, c + CTL-NULL-D) and
      whose conclusion is KNOWN FALSE, then run the batch's argument unchanged
      against it and report where the survival happens. THE CANDIDATE LIST BELOW IS
      A FLOOR, NOT A CEILING -- a break the plan did not anticipate is worth more
      than one it did, precisely because the plan's author did not see it coming:
      (i) an adjudicator blind to a DEPTH-2 component subset the depth-1 lattice
      does not reach; (ii) one that reads only `dv_seed_window`, i.e. VD-3's
      mechanism promoted from defect to design, which would pass every SHA-1 E1-image
      arm; (iii) one blind to `block_index`; (iv) ONE KEYED ON A LOSSY FUNCTION OF
      THE MESSAGE DIFFERENCE -- the SET of differing word indices, or its Hamming
      weight -- rather than on its value, which can pass many family-(d) draws while
      still identifying paths whose message differences differ.
    R_b_the_obstruction_reversal: >-
      agents/red-team.md responsibility 8. Which theory takes this batch's
      measurement as its HYPOTHESIS rather than its refutation? The author is the
      reader least able to do this, having spent the task establishing what the
      quantity costs. Round 1's reversal produced family (d) itself; the analogous
      reading here is what a PER-COMPONENT POWER PROFILE enables that a pass/fail
      suite does not. File any spawned successor as a candidate for the ranking,
      never as evidence; it changes no status on its own.
    R_c_the_closure_attack: >-
      Attack the closure as hard as the claim; premature closure is a failure mode
      symmetric with overclaiming. Is any lane being quietly closed by a fatigue
      report wearing a number -- the MD5 lane, the `in_linearized_code` component
      declared "unprobed", depth >= 2, the second seed set, null family (e)? Is
      "the strengthened suite detects X" stated more widely than it was measured? If
      an `obstruction` block appears anywhere, does its measurement support the
      breadth it closes?
    R_d_compositional_invariant_and_nearby_object_attack_on_family_d: >-
      Mutate ONE component of family (d)'s perturbation construction and find where
      it stops probing what it claims. INDEPENDENTLY CONSTRUCT THE SHA-1 FLAG
      CONFOUND rather than accepting the producer's D-SHA1-INCODE framing of it: the
      Coordinator PREDICTED that confound in the sealed prior, which is exactly why
      an adversary rather than the prediction's author should decide whether it
      bites, and how hard.
    R_e_the_cheapest_distinguishing_control: >-
      Name the cheapest control that would separate an implementation artifact from
      a real gain in power, and exhibit at least one object this contract's author
      did not imagine. Round 1's equivalent sentence is what produced this batch.
  hard_rules:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. You must NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11,
      and you must attest exactly what you did read. YOUR DECLARED read_scope IN THE
      DISPATCH QUEUE EXCLUDES THE SIBLING'S DIRECTORY BY CONSTRUCTION, symmetrically
      with the Validator's: it names batch.yaml, the queue, the review plan, YOUR OWN
      task card, the producer's task directory and the snapshot archive, and
      deliberately NOT the BATCH-efcae7 root, which would have contained
      reviews/TASK-20260824-b61d11. Blindness is therefore a declared boundary here
      and not only an instruction. BATCH-f8bf86 IS in scope whole, and for you it is
      necessary: joint R-a must BEAT round 1's O5 rather than restate it.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST AND
      coordination/events/main/** WHILE THIS ROUND IS OPEN (batch rule BR-1). Use
      `git log --format=%H`. THIS IS THE CHANNEL THAT BROKE ROUND 1: a commit message
      body carried the Validator's findings and their mechanisms while the Red Team
      was still running in the same worktree, where `git log` and `git show` are
      commands the contract actively requires. If you encounter a finding anywhere --
      a commit body, a PR description, a bus message, a digest -- SAY SO IN THE
      ATTESTATION, unprompted and in full, rather than quietly proceeding. Round 1's
      Red Team did exactly that and it is recorded as a credit, not an incident.
    - >-
      COMMIT YOUR REPORT WITH A SUBJECT LINE AND NO FINDINGS IN THE BODY (BR-1). The
      summary defers to the composition commit.
    - >-
      REPORT ON THE JOINTS YOU OWN. Do NOT compose a whole-claim verdict: you cannot
      see the Validator's joints by construction, and composing is the Coordinator's
      job. The scalar `verdict` in your attestation is a lossy rollup required by
      tools/check_review_independence.py's schema and is never a verdict on the batch.
    - >-
      TAKE THE PLAN'S ATTACK AS A FLOOR, NOT A CEILING. It is the Coordinator's
      cheapest known route to a break, offered so your budget goes to attacking
      rather than orienting.
    - >-
      DO NOT ALTER THE EXECUTOR'S RAW RECEIPTS OR THE VALIDATOR'S REPORT. Your
      constructions and probes write into THIS TASK'S OWN DIRECTORY ONLY; the
      archived run directories are immutable.
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/. Build adversarial instruments
      the way the contract builds ablations -- by a projection or wrapper applied at
      run time -- and say which mechanism you used. CTL-FROZEN will detect a
      modification and it would invalidate the producer's package as well as your own
      finding.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** or the same content
      by any other route, and attest non-reading. BCP-1 quarantines CONTENT, not a
      path.
    - >-
      DO NOT CALL A BOUNDED FAILURE AN IMPOSSIBILITY RESULT, and preserve the
      narrowest valid conclusion when an object of yours breaks something.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN CONSTRUCTION IS INFRASTRUCTURE SIGNAL,
      not a finding against the producer. Report it as such and say what remained
      unattacked.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade. If the probe verifies nothing -- as it did for both round-1
      reviewers -- say so plainly and mark the identifier self-reported.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16).
  the_baseline_comparison_that_does_and_does_not_apply: >-
    STATED AT OPENING SO NO BUDGET IS SPENT MANUFACTURING ONE. Pollard-rho, BSGS and
    the specialized ECDLP baselines in agents/red-team.md ARE NOT THE COMPARISON
    CLASS for this artifact and must not be manufactured: the package makes no
    cryptanalytic claim, runs no search, and its claim ceiling is `analyzed`. The
    comparison that IS appropriate is the one round 1 supplied -- the OLD suite's
    power against the STRENGTHENED suite's, per component, and the honest headline
    that a control detecting more ablations is a better instrument and not an
    improvement against any cryptanalytic baseline.
  note: >-
    THIS TASK EXISTS BECAUSE THE COORDINATOR'S FIRST SHAPE FOR THIS BATCH WAS WRONG,
    AND THE REASONING IS RECORDED IN DEC-20260824-ad098e RATHER THAN LEFT IMPLICIT.
    That shape had one reviewer, on the argument that this batch's adversarial
    objects are pre-registered inside the contract. That argument has the shape of
    the very failure the batch exists to measure -- "the adversarial objects are
    declared, therefore the adversary has nothing to add" is "the controls passed,
    therefore the adjudicator discriminates" one level up. And this goal holds a
    measured counterexample: O5, the finding that defined BATCH-f8bf86, was ADDED BY
    THE REVIEWER, was not on the plan's list, and became constructible only after
    reading the committed source. Every CTL-ABL row in EXP-DIFFP-4b165f is derived
    from that object.
    THE ROUND IS BLIND AND CONCURRENT RATHER THAN DEFERRED, ON PURPOSE. A red-team
    pass in a later batch could not have been blind: EV-DIFFP-b16b01 and
    DEC-20260824-c5bb72 would already be committed, so the adversary would attack a
    claim after reading the Coordinator's own composition of it. That degradation
    cannot be bought back later at any price.
    GOAL-DIFFP-84d641 COMPLETION CRITERION 4 REQUIRES THAT INDEPENDENT VALIDATOR AND
    RED TEAM SESSIONS ADMIT THE PACKAGE. This batch's shape makes that REACHABLE; it
    does not make it MET. Whether the package is admitted is the close's
    determination on the reports it actually receives, and a `breaks` on a joint you
    own is not an admission on that joint.
