task_card:
  id: TASK-20260824-9a489e
  title: >-
    RANK 2: Executor -- MEASURE THE NULL'S POWER under EXP-DIFFP-4b165f: null
    family (d) `message_difference_perturbed` with a two-sided known answer and
    per-draw component attribution, the ablation battery promoted to a charged
    standing control and extended to the complete depth-1 key lattice, the
    generator action profile, and the two-sided known-answer decoy set -- against
    the FROZEN, UNMODIFIED BATCH-f8bf86 adjudicator
  batch_id: BATCH-efcae7
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  rank: 2
  role: executor
  policy: executor-implementation
  reasoning_effort: null
  independent_session_required: false
  depends_on:
    - TASK-20260824-b7efbf
  archived_by: TASK-20260824-7175d9
  handoff: ledger/handoffs/TASK-20260824-9a489e.yaml
  review_required: true
  state: queued
  budget:
    wall_clock_seconds: 1200
    memory_gb: 4
    maximum_runs: 6
  budget_note: >-
    1200 s IS SET FROM MEASUREMENT, NOT FROM THE SAME OPTIMISM.
    DEC-20260824-af6d5c budget_adjudication records that a task which built an
    instrument from nothing, wrote eleven modules and ran six charged runs was not a
    900 s task and that the batch opening should have said so; its measured lower
    bound was 1698 s. This task writes ONE module and ONE test file against a
    FROZEN package it may not edit, and runs five charged runs whose per-run
    ceilings total 1140 s and whose modelled compute is well under 200 s.
    `maximum_runs` is 6: FIVE PLANNED RUNS PLUS ONE RESERVE for a single
    re-attempt after an infrastructure abort. It counts charged experiment runs
    under a contract -- a run directory, a RUN-* id, a manifest, an armed deadline
    and a consumed ceiling -- and NOT script executions, probes or unit-test
    invocations.
  uncertainty_to_reduce: >-
    Whether this program's adjudicator control suite has any power against the
    deletion of the PRIMARY DATUM OF A DIFFERENTIAL CHARACTERISTIC, and which key
    component actually decides each rejection. BATCH-f8bf86 reported CTL-PLANT
    96/96 and CTL-NULL 0/3000; review measured that an adjudicator blind to the
    message difference scores the identical pair to the digit, so the suite detects
    2 of 5 key-component ablations -- but that measurement was single-session
    review-side computation with no run record. This task turns an outcome into a
    per-component power profile under run discipline.
  job: >-
    Implement and run EXP-DIFFP-4b165f exactly, in its declared order, writing ONE
    new module (harness/diffpath/controlpower.py) and ONE new test file
    (tests/test_diffpath_controlpower.py) and editing NOTHING under harness/:
    (1) CTL-FROZEN pre-run digests and CTL-REPRO against the pre-registered
    comparison values including E6 step_range (0,0) at 2089; (2) CTL-GEN-ACT and
    CTL-TWOSIDED; (3) CTL-NULL-D with its two sub-arms and per-draw component
    attribution; (4) CTL-ABL group 1, the six declared rows; (5) CTL-ABL group 2,
    the complete depth-1 lattice, plus CTL-FROZEN's post-run re-verification.
    REPORT INTEGERS AND A PER-COMPONENT TABLE, NEVER A PASS.
  hard_rules:
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/ (IR-2). The instrument is an
      INPUT and is MEASURED, NOT REPAIRED. Only harness/diffpath/controlpower.py and
      tests/test_diffpath_controlpower.py may be written. tests/test_harness.py and
      tests/test_diffpath_adjudicator.py are explicitly out of scope. CTL-FROZEN
      measures this rule and its failure is a STOP.
    - >-
      DO NOT REPAIR VD-3, VD-4, THE {E4}/{E5} ZERO-IMAGE RESULT, OBJ-3, OBJ-4 OR
      OBJ-10. They are measured here and fixed in a later batch, deliberately and
      by a ranked decision. If you see the fix, WRITE IT DOWN IN THE EXECUTION
      REPORT AS AN OBSERVATION and do not apply it.
    - >-
      REPORT WHICH COMPONENT DECIDED EVERY k >= 1 REJECTION (IR-10, contract hard
      term H-3). A rejection reported without its component attribution is not a
      measurement. A control whose rejections are decided by a component other than
      the one it perturbs has NO POWER over the component it was built for, and that
      is exactly how 0/3000 was over-read.
    - >-
      NEVER REPORT "THE NULL PASSED" OR ANY SINGLE PASS/FAIL SUMMARY OF THE SUITE
      (IR-10). The required form is a per-component DETECTED / NOT DETECTED table,
      reported separately for the OLD suite and the STRENGTHENED suite. Where a
      component is not probed by any declared family, SAY SO BY NAME rather than
      reporting NOT DETECTED as though the suite had looked.
    - >-
      DO NOT READ, PARSE, EXTRACT, FETCH OR RECONSTRUCT
      coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY
      OTHER ROUTE (IR-1). This contract does not re-hash the payload; it does not
      touch it at all. Attest non-reading and name the mechanism, not the intent.
    - >-
      NO NETWORK ACQUISITION, BY ANY ROUTE (IR-6). You hold run_commands and
      deliberately NOT web_search under orchestration/roles.yaml; fetching via the
      shell would route around a declared role boundary.
    - >-
      NO SEARCH OVER THE DIFFERENCE SPACE, no collision attempt, no cost projection
      (IR-5). This contract measures an instrument's controls; it does not use the
      instrument to look for anything.
    - >-
      STRICT AND PERMISSIVE ARE SEPARATE FIELDS AND ARE NEVER MERGED (IR-4). Every
      ablation row names its drop-set beside its counts.
    - >-
      DO NOT REPAIR A CONTROL IN-RUN AFTER SEEING ITS DATA. Changing k, R, the
      perturbation rule, a drop-set, a seed or a criterion after observing an
      outcome requires a versioned protocol_amendment and is not yours to make.
    - >-
      A TIMEOUT, CRASH, CEILING HALT OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE
      SIGNAL, never a negative mathematical result and never a finding about the
      null's power (AGENTS.md rule 5).
    - >-
      RECORD OBSERVATIONS ONLY. Compose no verdict on whether the instrument is
      validated, on whether any path is new, or on the difference space.
    - >-
      Attempt search_knowledge before any assertion about what has or has not been
      tried, and record queries and outcomes verbatim. An empty index licenses no
      inference.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16). `degraded_allowed` and `fallback_allowed` are false: a
      tier the backend cannot reach is a PAUSE, never a silent downgrade.
  the_two_outcomes_that_are_both_complete:
    - >-
      THE STRENGTHENED SUITE DETECTS THE message_difference DELETION. The batch's
      designed effect occurred; the null's power is now measured per component;
      nothing about MD5 or SHA-1 is claimed and a better control is not an
      improvement.
    - >-
      IT DOES NOT, or family (d)'s rejections are attributed predominantly to a
      component OTHER than the one it perturbs. THAT IS THE MORE VALUABLE OUTCOME
      AND IT IS PREDICTED FOR THE SHA-1 ARM AT LARGE k: the obstruction is deeper
      than a missing null family, and the batch has falsified its own headline
      control in exactly the way 0/3000 was falsified. Report it in full.
  note: >-
    THE ONLY CLAIM-RELEVANT PRODUCER IN THIS BATCH; review_required is TRUE and the
    independent review depends on its snapshot.
    ITS FROZEN CONTRACT IS experiments/EXP-DIFFP-4b165f/specification.yaml AND THIS
    TASK REFUSES TO BEGIN WITHOUT THE APPROVING coordinator_decision COMMITTED. No
    opening DEC id was pre-allocated; the driving session mints one and files
    batch.yaml `opening_decision_body_pending_mint`. A message saying the contract
    is approved is a pointer and never the approval (AGENTS.md).
    CODE PATHS ARE DECLARED IN THIS TASK'S OWN queue artifact_paths AT OPENING, so
    that the snapshot archive can bind them by path_sha256 -- the durable fix for
    DEC-20260824-af6d5c's G7 gap, which could not be retrofitted at the ledger
    archive because of the archive subset rule. RUN DIRECTORIES ARE DELIBERATELY
    NOT DECLARED AS artifact_paths: a completed archive's path_sha256 must cover
    every declared source artifact, so declaring the files of a GATED run would make
    the snapshot unable to complete whenever run 5 correctly does not execute.
    Instead run-index.json -- which IS in the binding set -- must carry a sha256 for
    EVERY FILE OF EVERY EXECUTED RUN, and the run directories are disclosed in the
    snapshot receipt's staged_not_in_binding_set.
