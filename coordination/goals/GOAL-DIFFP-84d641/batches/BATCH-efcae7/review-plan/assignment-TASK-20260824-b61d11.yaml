    the_red_team_owns: >-
      WHETHER THE CONCLUSION DRAWN FROM THEM SURVIVES OBJECTS FOR WHICH IT IS KNOWN
      FALSE. It builds the proves-too-much object, runs the obstruction reversal,
      attacks the closure, mutates family (d), and decides whether the headline is a
      power result or a restatement of its own construction.
    where_you_come_closest: >-
      COMPONENT ATTRIBUTION. YOU CHECK THAT THE ATTRIBUTION IS CORRECT. THE RED TEAM
      CHECKS WHETHER CORRECT ATTRIBUTION IS SUFFICIENT FOR THE POWER CLAIM. Do not
      stray across that line: A JOINT ATTACKED TWICE MEANS ANOTHER JOINT IS ATTACKED
      NEVER.
    the_proves_too_much_object_is_not_yours: >-
      You are NOT asked to build one. If you happen to see one while doing your own
      joints, RECORD IT AS AN OBSERVATION and do not substitute it for the joints you
      own.
    do_not_compose: >-
      DO NOT COMPOSE A WHOLE-CLAIM VERDICT. You cannot see your sibling's joints by
      construction, so a verdict on the whole claim from you would be an opinion built
      from a fraction of the evidence. Composing is the Coordinator's job at
      TASK-20260824-b3e02b. The scalar `verdict` in your attestation is a lossy roll-up
      the checker's schema requires and is never a verdict on the batch.

  # =====================================================================
  read_order_and_it_is_ORDERED_on_purpose:
    step_0_do_this_before_reading_anything_under_the_producer_directory: >-
      DERIVE THE QUANTITY BELOW YOURSELF AND WRITE IT DOWN. The plan's
      `independent_derivation_before_reading` is a first-class deliverable, not a
      formality, and it is the only part of this round's independence that is
      genuinely available -- see `why_there_is_no_mechanical_blind_rederivation`.
      THE QUANTITY: the number of CTL-NULL-D primary-arm draws at k >= 1 that
      adjudicate strict MEMBER against the ablated adjudicator whose serialised key
      DROPS THE MESSAGE-DIFFERENCE COMPONENT, reported SEPARATELY PER PRIMITIVE.
      THE PARAMETERS: the eight seeds frozen in EXP-DIFFP-4b165f `inputs.seeds`; the
      census rebuilt by the committed builder at the two planted-path seeds; the
      declared projection applied INSIDE the orbit minimisation; strict mode; k in
      {1,2,4,8,16} with the deterministic canonical draw plus the declared seeded
      draws per (entry, k).
      NO VALUE FOR THIS QUANTITY APPEARS IN THIS DOCUMENT, IN THE PLAN, IN THE
      SNAPSHOT RECEIPT, OR IN batch.yaml. It exists only under the producer's task
      directory, which is why the order matters.
    step_1: AGENTS.md, agents/validator.md, docs/claims-and-verification.md.
    step_2: >-
      experiments/EXP-DIFFP-4b165f/specification.yaml -- the FROZEN CONTRACT. Its hard
      terms H-3 and H-6, its `ablation_mechanism`, its invalidation rules IR-1..IR-11,
      its eight declared seeds, its pre-registered comparison values, its success and
      falsification criteria and its interpretation_limits. This is the standard you
      measure the package against, not the package's own checklist.
    step_3: >-
      experiments/EXP-DIFFP-fe894e/specification.yaml, ledger/evidence/EV-DIFFP-b878aa.yaml,
      ledger/decisions/DEC-20260824-af6d5c.yaml, ledger/decisions/DEC-20260824-ad098e.yaml,
      ledger/corrections/, and coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86
      (in scope WHOLE; it is a CLOSED batch whose reviews are already composed, so
      reading them is expected and is not a blindness violation).
    step_4: >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml,
      dispatch_queue.json, this review-plan directory, YOUR OWN task card, and
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/archives/TASK-20260824-7175d9.
    step_5: >-
      THE SNAPSHOT RECEIPT FIRST, THEN THE PACKAGE. The receipt names the exact 25
      paths this round binds by content, discloses what is staged and not bound, and
      records which of its own pre-freeze checks were PERFORMED and which are OWED --
      including the digest recomputations. IF THE RECEIPT'S OWED ITEMS ARE STILL OWED
      WHEN YOU RUN, SAY SO IN YOUR REPORT: you are reviewing a package whose byte
      identity has not been fully verified, and that bounds what your own re-runs can
      establish.
    step_6: >-
      harness/diffpath/ (READ-ONLY), harness/runner.py, harness/diffpath/controlpower.py,
      tests/test_diffpath_controlpower.py.
    step_7: >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/tasks/TASK-20260824-9a489e
      -- the execution report, the four result artifacts, run-index.json and the five
      run directories. ONLY AFTER STEP 0 IS WRITTEN DOWN.

  why_there_is_no_mechanical_blind_rederivation: >-
    `blind_rederivation.required` IS FALSE THIS ROUND AND THE REASON IS STATED SO YOU
    CAN JUDGE IT. tools/check_review_independence.py's leak test is ORDER-BLIND: it
    flags any `blind_from` prefix appearing in your `sources_read`, whenever you read
    it. Every path that could carry the producer's value for the quantity above is a
    path you MUST read to discharge J1..J7. A declared re-derivation would therefore
    produce either a guaranteed FAIL on a reviewer who did nothing wrong, or an
    incomplete `sources_read` -- which is a dishonest attestation and far worse than
    no re-derivation at all. BR-5's own consequence clause licenses setting it false.
    WHAT REPLACES IT RESTS ON YOUR HONESTY ABOUT READ ORDER AND NOTHING ELSE, and this
    document says so rather than pretending otherwise. In round 1 the mechanical
    detector could not fire at all -- every blind_from entry it carried was a glob or
    a prose phrase that could not match a path -- and THE ONLY THING THAT CAUGHT
    CONTAMINATION WAS THE RE-DERIVER'S OWN HONEST BOOLEAN. So this round asks for that
    boolean directly. AN HONEST `false` IS WORTH MORE THAN A MATCHING `true` THAT IS
    NOT TRUE.

  # =====================================================================
  blindness_rules_binding_on_you:
    sibling: >-
      YOU MUST NOT READ
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a
