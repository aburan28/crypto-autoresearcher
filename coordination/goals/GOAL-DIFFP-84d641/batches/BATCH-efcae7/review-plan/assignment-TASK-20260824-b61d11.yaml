      Read them in the plan. They are not duplicated here, so that there is exactly
      one authoritative statement of each joint and no chance of the two drifting.

  the_boundary_with_your_sibling:
    you_own: >-
      WHETHER THE REPORTED NUMBERS ARE WHAT THE CODE PRODUCES, AND WHETHER THEY ARE
      SCOPED HONESTLY. Reproduction, ablation genuineness, the pre-registered battery
