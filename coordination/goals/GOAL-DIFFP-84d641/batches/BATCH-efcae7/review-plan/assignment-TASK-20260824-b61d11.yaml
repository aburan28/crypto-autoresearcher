  what_you_own:
    joints_owned: [J1, J2, J3, J4, J5, J6, J7]
    put_exactly_these_short_ids_in_joints_owned: >-
      ["J1","J2","J3","J4","J5","J6","J7"] -- the short ids and nothing else. Not the
      statements, not the V-a..V-g aliases. tools/check_review_independence.py matches
