    path: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11/validation-report.yaml
    must_contain:
      - Every one of J1..J7 reported as holds | breaks | inconclusive UNDER ITS SHORT ID, with the measurement it rests on. An unreported joint is a coverage gap, not a pass.
      - The cold re-run's exact-agreement count AS AN INTEGER FRACTION, with every disagreement listed by name and BOTH values side by side.
      - The ablation-genuineness finding - same class, same census, named pairs dropped, projection inside the minimisation, and the inside-versus-outside comparison.
      - The component-attribution audit, with an EXPLICIT per-k answer on whether the SHA-1 arm's rejections are decided by the flag rather than by the perturbed message difference.
      - >-
        The `independent_derivation_before_reading` block - `derived_before_reading` (honestly), the value you derived, the mechanism you used (your own re-implementation of the declared projection, or the producer's committed module - SAY WHICH, because they check different things), and if incomplete, `derived: false` WITH THE REASON.
      - Your ruling on each of the producer's four declared protocol deviations, and on the CTL-FROZEN criterion-set scoping the snapshot archive found and deliberately did not adjudicate.
      - Anything you could not check, WITH THE REASON, and what therefore remains unverified.
      - A `review_attestation` block.
    review_attestation_schema:
      task_id: TASK-20260824-b61d11
      joints_owned: '["J1","J2","J3","J4","J5","J6","J7"]'
      sources_read: 'every path you actually read, honestly and COMPLETELY'
      read_sibling_reports: 'false -- true would be a violation, since blindness.lifted_for is empty'
      blind_from_respected: 'not required this round (blind_rederivation.required is false); set it true only if it is true'
      verdict: 'holds | breaks | inconclusive, FOR THE JOINTS YOU OWN ONLY'
      plus: 'requested policy, backend, resolved model identifier, whether PROBE-VERIFIED, reasoning effort, fallback_used, degraded_allowed, amazon_bedrock_used'

  # =====================================================================
  hard_rules:
    - AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL about your session, NOT a finding against the producer and never a negative mathematical result. Report it as such and say what remained unverified.
    - A TIMEOUT, CRASH OR CEILING HALT IS NEVER A NEGATIVE MATHEMATICAL RESULT and never a finding about the null's power.
    - DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER ROUTE. BCP-1 quarantines CONTENT, not a path - the network, a package index, a retrieval index and a model's own memory reproduced into a file are all covered. Attest non-reading and NAME THE MECHANISM rather than asserting good intent.
    - DO NOT CLAIM ANY PATH IS NEW, do not claim or accept any cryptanalytic improvement, do not project any cost, and do not describe the MD5 lane as closed. It is BLOCKED, NOT CLOSED, with its named unblocking route intact.
    - A PASSING CONTROL IS NOT AN IMPROVEMENT. A suite that detects more ablations is a better instrument and is not a result about MD5 or SHA-1.
    - CLAIM CEILING `analyzed`, NEVER `supported`, for everything this round produces.
    - DO NOT STATE THAT COMPLETION CRITERION 4 IS MET. It is REACHABLE by this batch's shape and not met by it; whether both sessions ADMIT the package is the close's determination on the reports it actually receives, and a `breaks` on a joint you own is not an admission on that joint.
    - RECORD REQUESTED POLICY, BACKEND, RESOLVED MODEL IDENTIFIER, PROBE STATUS AND REASONING EFFORT. A tier the backend cannot reach is a PAUSE and an `inference_amendment`, never a silent downgrade. IF THE PROBE VERIFIES NOTHING - as it did for both round-1 reviewers - SAY SO PLAINLY and mark the identifier SELF-REPORTED rather than measured. That limitation is expected to recur and must be stated rather than upgraded.
    - NEVER AMAZON BEDROCK in any runtime, backend, endpoint, fallback or probe.
    - ATTEMPT `search_knowledge` before any assertion about what has or has not been tried, and record queries and outcomes VERBATIM. An empty or unavailable index is a fact about the session and licenses NO inference in either direction.
    - NEVER FABRICATE a command, an output, a timing, a statistic, a citation or a run. Missing data stays missing and is reported as missing.
