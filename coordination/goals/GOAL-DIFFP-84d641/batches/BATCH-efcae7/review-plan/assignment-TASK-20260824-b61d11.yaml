      600 s is a 67% increase over the budget the round-1 reviewers overran, with a
      smaller joint load than the single-reviewer design assumed. IF IT BINDS, SAY SO
      AND SAY WHAT REMAINED UNVERIFIED. An honest "not reached within budget, and
      here is what was tried" is a complete answer for a joint; a thin answer
      presented as a full one is not.

