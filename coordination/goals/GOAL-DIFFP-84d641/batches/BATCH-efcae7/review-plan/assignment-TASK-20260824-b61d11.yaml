      the round was composable only because of it.
    your_own_commit: >-
      COMMIT YOUR REPORT WITH A SUBJECT LINE ONLY AND NO FINDINGS IN THE BODY. No
      verdict, mechanism, component name or integer. The summary defers to the
      composition commit. The batch-3 red-team pass reviews this batch's snapshot, so a
      leak into commit metadata would contaminate a round that has not started yet.
    write_scope: >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11
      AND NOTHING ELSE. Re-runs and probes write into your own task directory only. The
      archived run directories are IMMUTABLE and are never edited or repaired. Do not
      modify any committed file under harness/.

  # =====================================================================
