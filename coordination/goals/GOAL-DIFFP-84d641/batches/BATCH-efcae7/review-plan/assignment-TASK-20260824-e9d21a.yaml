    - RECORD REQUESTED POLICY, BACKEND, RESOLVED MODEL IDENTIFIER, PROBE STATUS AND REASONING EFFORT. A tier the backend cannot reach is a PAUSE, never a silent downgrade. IF THE PROBE VERIFIES NOTHING - as it did for both round-1 reviewers - SAY SO PLAINLY and mark the identifier SELF-REPORTED rather than measured.
    - NEVER AMAZON BEDROCK in any runtime, backend, endpoint, fallback or probe.
    - ATTEMPT `search_knowledge` before any assertion about what has or has not been tried, and record queries and outcomes VERBATIM. An empty or unavailable index is a fact about the session and licenses NO inference in either direction.
    - NEVER FABRICATE a command, an output, a timing, a statistic, a citation or a run. Missing data stays missing and is reported as missing.
