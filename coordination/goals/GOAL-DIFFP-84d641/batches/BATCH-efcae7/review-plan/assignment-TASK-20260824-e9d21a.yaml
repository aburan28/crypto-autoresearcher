    - DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER ROUTE. BCP-1 quarantines CONTENT, not a path - the network, a package index, a retrieval index and a model's own memory reproduced into a file are all covered. Attest non-reading and NAME THE MECHANISM.
