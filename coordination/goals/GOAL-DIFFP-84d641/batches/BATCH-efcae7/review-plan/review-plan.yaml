    infrastructure_versus_evidence: >-
      A timeout, a crash, an environment failure or an implementation failure IN A
      REVIEWER'S OWN RE-RUN is INFRASTRUCTURE SIGNAL about that session, never a
      negative finding against the producer and never a mathematical result. Report it
