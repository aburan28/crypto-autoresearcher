  blind_rederivation:
    required: false
    quantity: >-
      DECLARED FOR THE RECORD EVEN THOUGH `required` IS FALSE, so that the close and
      any later reader can see exactly what was considered and rejected: the number
      of CTL-NULL-D primary-arm draws at k >= 1 that adjudicate strict MEMBER against
      the ablated adjudicator whose serialised key drops the message-difference
      component, reported SEPARATELY per primitive.
    parameters: >-
      The eight seeds frozen in EXP-DIFFP-4b165f `inputs.seeds`; the census rebuilt
      by the committed builder at the two planted-path seeds; the declared projection
      applied inside the orbit minimisation; strict mode; k in {1,2,4,8,16} with the
      deterministic canonical draw plus the declared seeded draws per (entry, k).
    blind_from:
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/tasks/TASK-20260824-9a489e
      - harness/diffpath/controlpower.py
      - tests/test_diffpath_controlpower.py
    assigned_to: null
    why_required_is_FALSE_and_this_is_a_decision_rather_than_a_default: >-
      BECAUSE A MECHANICALLY CHECKABLE BLIND RE-DERIVATION IS UNSATISFIABLE FOR THIS
      PACKAGE, AND DECLARING ONE ANYWAY WOULD REPEAT PD-2 IN A NEW FORM.
      The checker's leak test is ORDER-BLIND: it compares the re-deriver's declared
      `sources_read` against `blind_from` and reports a leak if any blind_from prefix
      appears, whenever it was read. Every path that could carry the producer's value
      for the quantity above -- the producer's task directory, the new module, its
      test file -- is a path the Validator MUST READ to discharge J1, J2, J3, J4, J5,
      J6 and J7. So a declared re-derivation would produce either (a) a guaranteed
      FAIL from the checker on a reviewer who did nothing wrong, or (b) an incomplete
      `sources_read`, which is a dishonest attestation and far worse than no
      re-derivation at all. BR-5's own `consequence_for_this_round` anticipates this
      and licenses it explicitly: "Round 2 may set blind_rederivation.required: false
      and lose nothing, since the batch's quantities are reproductions of committed
      values rather than novel derivations."
    what_replaces_it_so_the_substance_is_not_lost: >-
      `independent_derivation_before_reading` below. It keeps the whole substance of a
      blind re-derivation -- derive first, then read, then compare -- and drops only
      the mechanical checkability, WHICH IS THE PART THAT DID NOT WORK IN ROUND 1
      ANYWAY. Round 1's leak detector never fired, because every blind_from entry it
      carried was a glob or a prose phrase that could not match a path; the only thing
      that caught contamination that round was THE RE-DERIVER'S OWN HONEST BOOLEAN.
      This plan therefore asks for that boolean directly and says plainly what it
      rests on.
    honest_limit: >-
      `independent_derivation_before_reading` IS NOT MECHANICALLY VERIFIABLE. It
      rests on the reviewer's honesty about read order, which no tool in this
      repository can check. That is stated here rather than discovered at the close,
      and the close must weight the derivation accordingly: a matching independent
      derivation with `derived_before_reading: true` is corroboration, not proof of
      independence.

  independent_derivation_before_reading:
    applies_to: [TASK-20260824-b61d11, TASK-20260824-e9d21a]
    the_instruction: >-
      BEFORE OPENING ANY FILE UNDER
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/tasks/TASK-20260824-9a489e,
      derive your own answer to the quantity your assignment names, from the frozen
      contract, the committed instrument and the eight declared seeds, and WRITE IT
      DOWN in your report before you read anything under that prefix. Then read, and
      report your value BESIDE the package's, whether they agree or not.
    for_the_validator: >-
      The quantity in `blind_rederivation.quantity` above, per primitive.
    for_the_red_team: >-
      Your own independent construction of the SHA-1 flag confound (J11) and your own
      answer to whether the detection verdict was guaranteed in advance by the
      construction (J13), formed from the committed code before you read the
      producer's framing of either.
    what_to_record: >-
      A block in your report with: `derived_before_reading` (true or false, honestly),
      the value or construction you derived, the mechanism you used -- your own
      re-implementation of the declared projection, or the producer's committed module
      -- and, if you could not complete it within budget, `derived: false` WITH THE
      REASON. AN HONEST FALSE IS WORTH MORE THAN A MATCHING TRUE THAT IS NOT TRUE, and
      an incomplete derivation is a bounded gap the close records rather than a defect.
    why_the_mechanism_matters: >-
      Re-deriving THROUGH the producer's own module checks that the reported number is
      what that code produces. Re-implementing the declared projection yourself checks
      that the code implements the contract. THOSE ARE DIFFERENT CHECKS AND THE CLOSE
      NEEDS TO KNOW WHICH ONE IT RECEIVED. Say which.

