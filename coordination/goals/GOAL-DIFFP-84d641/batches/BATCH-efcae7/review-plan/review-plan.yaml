        unmeasured -- is exhaustiveness claimed at depth 1 and nowhere else, in every
        place the numbers appear, or only in the limitations block? NULL FAMILY (e),
        named and deliberately not built -- is it preserved as an open direction with
        a concrete revisit condition, or quietly retired?
        THEN THE SCOPE OF THE HEADLINE ITSELF: is the strengthened suite's detection
        verdict for the component the batch was designed around stated with the
        PRIMITIVE SCOPE and the ISOLATION CAVEAT that the package's own measurements
        require, everywhere it appears -- or is the qualified version in one block and
        the unqualified version in the headline? If an `obstruction` block appears
        anywhere, does its measurement support the breadth it closes?
      breaking_artifact: >-
        A quoted sentence from a batch artifact that closes more than its measurement
        supports, with the measurement that bounds it.

    - id: J11
      joint: J11
      alias: R-d
      assigned_to: TASK-20260824-e9d21a
      statement: >-
        THE COMPOSITIONAL-INVARIANT AND NEARBY-OBJECT ATTACK ON FAMILY (d) ITSELF.
        Mutate ONE component of family (d)'s perturbation construction and find where
        it stops probing what it claims; and construct the SHA-1 flag confound
        INDEPENDENTLY rather than accepting the producer's sub-arm framing of it.
      attack_plan: >-
        Vary one thing at a time in the construction -- which field is perturbed, how
        the flipped positions are chosen, whether the perturbation is deterministic or
        seeded, which entry is the source, which mode adjudicates -- and find the
        nearest object at which the family stops probing the component it names.
        THE SHA-1 CONFOUND IS YOURS TO BUILD, NOT TO ACCEPT. The Coordinator PREDICTED
        that confound in the sealed prior before the run, which is exactly why an
        adversary rather than the prediction's author should decide whether it bites
        and how hard. Build it from the committed code and your own objects; then
        decide independently whether the contract's dedicated sub-arm actually
        isolates the two, and whether an isolation that exists in a sub-arm but is
        never carried through to the ablation battery isolates anything the battery's
        verdicts depend on.
        THEN ATTACK THE DECLARED CHOICE THE VALIDATOR MAY NOT: the producer declares
        that two derived fields are RECOMPUTED rather than held fixed, and states that
        the SHA-1 attribution result FOLLOWS FROM that choice. Run the counterfactual.
        A family whose headline attribution flips when one declared implementation
        choice is reversed is measuring the choice at least as much as the instrument,
        and either answer is a result.
      breaking_artifact: >-
        A nearby object at which family (d) stops probing the message difference; or
        your own construction of the flag confound with its measured bite; or a
        demonstration that the attribution result is a function of the recompute
        choice rather than of the key.

    - id: J12
      joint: J12
      alias: R-e
      assigned_to: TASK-20260824-e9d21a
      statement: >-
        THE CHEAPEST DISTINGUISHING CONTROL. Name the cheapest control that would
        separate an IMPLEMENTATION ARTIFACT from a REAL GAIN IN POWER, and exhibit at
        least one object this contract's author did not imagine.
      attack_plan: >-
        Round 1's equivalent sentence is what produced this entire batch, so this
        joint pays for itself if it produces one sentence of that quality. State the
        control concretely enough to be budgeted: what it constructs, what it
        adjudicates, what outcome would mean artifact and what would mean power. The
        object you exhibit matters more than the control you name, because the object
        is the part the plan could not have supplied.
      breaking_artifact: >-
        A named, budgetable control with its two distinguishable outcomes, and at
        least one object outside the contract's declared sets.

    - id: J13
      joint: J13
      alias: R-f
      assigned_to: TASK-20260824-e9d21a
      statement: >-
        IS THE HEADLINE A POWER RESULT OR A RESTATEMENT OF THE CONSTRUCTION? Family
        (d) perturbs one named key component. The ablation row the whole batch was
        designed around deletes that same component. A control that detects exactly
        the component it perturbs may be measuring nothing beyond its own
        construction. THIS IS THIS BATCH'S O5-SHAPED RISK AND IT IS THE ONE JOINT
        THAT COULD MAKE THE HEADLINE EMPTY WITHOUT ANY INTEGER IN IT BEING WRONG.
      attack_plan: >-
        Decide whether the detection verdict for that component was GUARANTEED IN
        ADVANCE by the construction, or whether it was contingent on something the
        instrument could have done differently. Concretely: could an adjudicator drop
        that component from its serialised key and STILL reject a family-(d) draw --
        through orbit minimisation, through a correlated component, through a derived
        field, through the other primitive's key shape? If YES, the verdict has
        content and you can say exactly how much. If NO, the verdict is a restatement
        and the batch's designed effect is a tautology dressed as a measurement.
        THE ANSWER MAY BE DIFFERENT ON THE TWO PRIMITIVES, and if it is, that split IS
        the finding: a row that measures something on one primitive and restates the
        construction on the other is neither a clean power result nor a clean
        tautology, and the close needs it stated as the mixed thing it is rather than
        rounded to either end.
        This joint SHARES ITS EVIDENTIARY BASE WITH J8 and may be answered from the
        same constructions; it is separated so that it cannot be absorbed into a
        proves-too-much verdict and disappear.
      breaking_artifact: >-
        A demonstration that the detection verdict follows from the construction
        alone -- ideally an adjudicator that drops the component and still rejects the
        draws, or a proof from the key's structure that none can. Either direction is
        a result.

