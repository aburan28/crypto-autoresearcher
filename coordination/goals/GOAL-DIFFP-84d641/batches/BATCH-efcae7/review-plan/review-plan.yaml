  proves_too_much:
    assigned_to: TASK-20260824-e9d21a
    joint: J8
    failure_signature: >-
      TOP-LEVEL ROLL-UP (BR-4), IN ADDITION TO THE PER-OBJECT SIGNATURES BELOW.
      For EVERY object listed: run the batch's argument UNCHANGED -- the argument
      that a strengthened control suite whose outcome CHANGES when a key component is
      deleted has POWER over that component, and therefore that the null now has
      power over the primary datum of a differential characteristic. THE ARGUMENT
      MUST FAIL ON EVERY OBJECT BELOW, because every object below is an instrument
      that CANNOT identify a differential characteristic by its message difference.
      IF THE ARGUMENT SUCCEEDS ON ANY OF THEM, IT HAS PROVED TOO MUCH and it is wrong
      somewhere that has not been read closely enough: name the object, name the STEP
      at which the survival happens, and give the step's measurement. IF THE ARGUMENT
      REFUSES EVERY OBJECT, say which arm of the strengthened suite did the refusing
      for each, with the outcome that refused it -- that is the control firing, and it
      is a genuine and reportable strength of the instrument. A REPORT THAT NEITHER
      SURVIVES NOR REFUSES HAS NOT RUN THE CONTROL. "The argument looks fine" is not
      an outcome; "no object was found within budget, and here is what was tried" is,
      and it is a bounded negative and never an impossibility result.
    objects:
      - id: O-A
        object: >-
          An adjudicator keyed on a LOSSY FUNCTION of the message difference -- the
          SET of differing word indices, or its Hamming weight -- rather than on its
          value.
        why_its_conclusion_is_known_false: >-
          Two distinct characteristics with the same differing-word-index set are
          indistinguishable to it, so it cannot identify a path by its message
          difference; yet its key does contain a message-difference-derived component
          and it may pass many family-(d) draws.
        failure_signature: >-
          It must fail some declared arm. If it passes every arm, the batch's
          detection verdict is compatible with an instrument that reads only a lossy
          shadow of the component it claims power over.
      - id: O-B
        object: >-
          An adjudicator that reads only `dv_seed_window` -- the VD-3 mechanism
          promoted from defect to design.
        why_its_conclusion_is_known_false: >-
          It never reads a candidate's declared message difference at all on the
          object class where the realignment applies.
        failure_signature: >-
          It must fail an arm that presents an object whose declared message
          difference and whose seed window disagree. If no declared arm presents one,
          say so: that is a coverage gap in the suite, not a pass.
      - id: O-C
        object: >-
          An adjudicator blind to a DEPTH-2 component subset that the depth-1 lattice
          does not reach.
        why_its_conclusion_is_known_false: >-
          Depth-1 exhaustiveness says nothing about interactions, and the package
          names depth >= 2 as unmeasured.
        failure_signature: >-
          It must fail an arm. If it passes, "exhaustive at depth 1" is exactly as
          narrow as the package says and the close must carry that narrowness into
          the headline sentence, not only into the limitations block.
      - id: O-D
        object: An adjudicator blind to `block_index`.
        why_its_conclusion_is_known_false: >-
          It cannot distinguish the same difference pattern presented at different
          block positions.
        failure_signature: >-
          It must fail an arm; if no declared family perturbs that component on an
          otherwise-matching object, the NOT DETECTED verdict for it means the suite
          did not look, and the report must say that in those words.
      - id: O-E
        object: >-
          ADDED BY THIS PLAN AND NOT PRESENT IN THE OPENING'S LIST. An adjudicator
          that reads the message difference on ONE primitive and is blind to it on the
          OTHER.
        why_its_conclusion_is_known_false: >-
          It is blind to the primary datum of a differential characteristic on half
          the census while remaining fully sighted on the other half.
        failure_signature: >-
          Determine first whether the strengthened suite's power over that component
          is carried asymmetrically across the two primitives. If it is, this
          instrument may pass every declared arm, and the batch's detection verdict
          would then be scoped to one primitive rather than to the component -- a
          scope the headline sentence must carry.
      - id: O-F
        object: >-
          THE DEGENERATE RESTATEMENT INSTRUMENT. Any adjudicator whose only
          discriminating power over family (d) is the perturbed component itself.
        why_its_conclusion_is_known_false: >-
          Its suite outcome changing when that component is deleted is a consequence
          of the family's construction rather than a property of the instrument, so
          "the suite has power over the component" is true of it by construction and
          says nothing about whether it can identify a characteristic.
        failure_signature: >-
          This is J13's object as well as J8's. If the batch's argument cannot
          distinguish this instrument from the honest one, the headline is a
          restatement of the construction and the close must say so.

