  how_this_round_will_be_composed:
    by: TASK-20260824-b3e02b
    rule: >-
      COMPLETION CRITERION 4 IS REACHABLE BY THIS SHAPE AND IS NOT MET BY IT. It
      requires that BOTH independent sessions ADMIT the package. That is the close's
      determination on the reports it ACTUALLY RECEIVES; it is never read off the
