    blind_from:
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a
