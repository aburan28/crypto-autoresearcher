    claim_ceiling: >-
      `analyzed`, never `supported`, regardless of what the reports say. Two reviewers
      do not raise a ceiling set by three structurally unmet promotion gates and by
      the nature of the object.
    what_a_break_on_J8_or_J13_would_mean: >-
      A break on either does NOT make the package invalid and does NOT make the
