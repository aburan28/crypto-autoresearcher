        `independent_derivation_before_reading`.
      why: >-
        A mechanically checkable blind re-derivation is unsatisfiable for this
        package because the checker's leak test is order-blind and every candidate
        blind_from path is one the reviewer must read to discharge its assigned
        joints. Declaring one anyway would force either a spurious checker FAIL or a
        dishonest `sources_read`. BR-5's own consequence clause licenses this
