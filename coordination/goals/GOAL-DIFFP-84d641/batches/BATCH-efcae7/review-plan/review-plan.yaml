      detector would not have fired had a leak occurred through every path it named,
      and two further entries in that plan were prose that could never match a path
      by construction. That is an infrastructure finding about a checker, not
      evidence about anything mathematical, and it is fixed here by construction.
      NOTE ON THE TWO TASK-CARD PREFIXES: each reviewer READS ITS OWN card, which is
