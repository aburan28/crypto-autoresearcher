review_architecture_status: >-
  THE `review_architecture` BLOCK IMMEDIATELY BELOW IS SUPERSEDED, AS OF 2026-08-24,
  BY `review_architecture_as_filed` FURTHER DOWN AND BY DEC-20260824-ad098e. It was
  written in pass 1, is committed at 976a3a972, and is RETAINED UNEDITED because this
  program supersedes rather than overwrites -- and because a shape that was argued and
  then reversed is worth more to a later reader than a shape that only ever appeared
  correct. ITS OPERATIVE CLAIM ("one reviewer; completion criterion 4 not satisfied")
  IS NO LONGER TRUE. Read it as a record of reasoning, not as this batch's shape.
review_architecture: >-
  ONE INDEPENDENT REVIEWER THIS ROUND, NOT TWO, AND THE REASON IS A HARD
  IDENTIFIER CONSTRAINT THAT IS RECORDED RATHER THAN DISGUISED AS A DESIGN
  CHOICE. Five TASK ids were pre-allocated for this batch and this session has no
  shell and may mint none. The minimum admissible chain for one claim-relevant
  producer under tools/research_dispatch.py is: opening control plane, producer,
  SNAPSHOT archive (alone, before review), at least one independent reviewer, and
  a LEDGER archive (alone, after review) that depends on every review. That is
  exactly five tasks. A second reviewer would require a sixth id.
  THE REVIEWER IS A VALIDATOR (TASK-20260824-b61d11), and the choice is argued
  rather than defaulted. This batch's whole product is a control-power
  measurement whose ADVERSARIAL OBJECTS ARE PRE-REGISTERED INSIDE THE CONTRACT --
  the ablation battery IS the known-false-instrument control, the delta_m-blind
  adjudicator is one of its declared rows with a pre-registered expected outcome,
  family (d) is two-sided by construction, and the depth-1 lattice is EXHAUSTIVE
  so "an adversary would have picked a different ablation" cannot apply at that
  depth. What is NOT covered by pre-registration is whether the reported integers
  are what the code produces, whether the ablations are genuine single-component
  deletions of the SAME frozen key rather than re-implementations that flatter,
  whether family (d)'s rejections are decided by the component it perturbs, and
  whether the obstruction is claimed over exactly the scope its runs cover --
  every one of which is squarely agents/validator.md work, and batch 1 found TWO
  defective producer integers by exactly that mechanical route and by no other.
  WHAT IS LOST, STATED PLAINLY: no adversary attacks the strengthened suite's own
  proves-too-much this round. The object is named now, while it is loaded, so the
  deferral costs as little as possible -- IS THERE AN INSTRUMENT THAT PASSES THE
  STRENGTHENED SUITE AND IS STILL KNOWN-FALSE? Candidates: an adjudicator blind
  to a depth-2 subset the lattice does not reach; one that reads only the DV seed
  window (the VD-3 mechanism promoted from defect to design); one blind to
  block_index. That pass runs in batch 3 AGAINST THIS BATCH'S COMMITTED,
  IMMUTABLE SNAPSHOT, which is possible precisely because the snapshot is
  content-bound, and it is carried as a successor gate on the goal head.
  GOAL-DIFFP-84d641 completion criterion 4 is NOT satisfied by this batch and the
  closing decision must say so.
  THE REVIEW PLAN IS NOT WRITTEN HERE. Per AGENTS.md "Review architecture" it is
  opened by a SEPARATE coordinator handoff AFTER the snapshot archive
  TASK-20260824-7175d9 lands and BEFORE the reviewer runs. The prior above is
  already recorded and must be carried forward verbatim into it.

review_architecture_as_filed: >-
  TWO INDEPENDENT SESSIONS, MUTUALLY BLIND, ON DISJOINT JOINT SETS:
  TASK-20260824-b61d11 (Validator) and TASK-20260824-e9d21a (Red Team), both under
  review-adversarial at reasoning_effort xhigh with independent_session_required
  true, both depending on the snapshot archive, both sources of the single ledger
  archive. THIS IS THE BATCH'S SHAPE; the block above records the shape that was
  argued in pass 1 and reversed. Full reasoning: DEC-20260824-ad098e `rationale` and
  `review_architecture`.
  WHY THE FIRST SHAPE WAS WRONG, IN ONE PARAGRAPH, BECAUSE IT IS THE MOST USEFUL
  THING THIS REVERSAL PRODUCED. It rested on "this batch's adversarial objects are
  PRE-REGISTERED INSIDE THE CONTRACT, so the marginal value of an adversary is low".
  THAT ARGUMENT HAS THE SHAPE OF THE VERY FAILURE THIS BATCH EXISTS TO MEASURE:
  "the adversarial objects are declared, therefore the adversary has nothing to add"
  is "the controls passed, therefore the adjudicator discriminates", one level up,
  applied to a review architecture instead of to an instrument. And this goal holds a
  measured counterexample -- O5, the delta_m-blind adjudicator that DEFINED
  BATCH-f8bf86, was ADDED BY THE REVIEWER, was not on the plan's list, and became
  constructible only after reading the committed source. Every CTL-ABL row in
  EXP-DIFFP-4b165f is derived from that object. Decisively: this contract creates a
  NEW claim that no object in it attacks -- the pre-registered rows measure the OLD
  suite's power, while the STRENGTHENED suite is a new instrument whose
  proves-too-much object is by construction absent from the contract, because the
  contract's author is the one who would have had to imagine it.
  AND THE DEFERRAL WAS WORSE THAN IT LOOKED. A batch-3 pass could not have been
  blind: EV-DIFFP-b16b01 and DEC-20260824-c5bb72 would already be committed, so the
  adversary would attack a claim after reading the Coordinator's own composition of
  it. Mutual blindness cannot be bought back later at any price.
  THE BOUNDARY, SO NO JOINT IS UNOWNED AND NONE IS DOUBLE-OWNED. THE VALIDATOR OWNS
  WHETHER THE REPORTED NUMBERS ARE WHAT THE CODE PRODUCES AND WHETHER THEY ARE SCOPED
  HONESTLY: reproduction, ablation genuineness, the six pre-registered rows, whether
  the producer's component attribution is correct, two-sidedness and capacity to
  fail, the {E4}/{E5} action profile, and the obstruction's scope. THE RED TEAM OWNS
  WHETHER THE CONCLUSION DRAWN FROM THEM SURVIVES OBJECTS FOR WHICH IT IS KNOWN
  FALSE: R-a proves-too-much on the strengthened suite (the load-bearing joint), R-b
  the obstruction reversal, R-c the closure attack, R-d the compositional-invariant
  and nearby-object attack on family (d) including an INDEPENDENT construction of the
  SHA-1 `in_linearized_code` confound, and R-e the cheapest distinguishing control.
  On component attribution, where the two come closest, the split is explicit: the
  Validator checks the attribution is CORRECT, the Red Team checks whether correct
  attribution is SUFFICIENT for the power claim.
  BR-1 IS NOW LOAD-BEARING RATHER THAN PEDANTIC. Two concurrent reviewers in one
  shared worktree is the exact configuration in which round 1's blindness broke,
  through a commit message body carrying the Validator's findings while the Red Team
  was still running. Subject-line-only commit messages while the round is open, with
  `blindness` covering commit messages, the merge digest and
  coordination/events/main/**, and `git log --format=%H` until the round closes.
  COMPLETION CRITERION 4 IS REACHABLE, NOT MET. It requires that both sessions ADMIT
  the package; that is the CLOSE's determination on the reports it actually receives,
  never read off the presence of two task ids in a queue, and a `breaks` on a joint a
  reviewer owns is not an admission on that joint.
  COST, PAID NOW RATHER THAN ADDED: per-reviewer budgets are 600 s each rather than
  the 720 s a single reviewer carrying both joint sets was given, because the joints
  split; the batch declares 3480 s instead of 3000 s; and batch 3 no longer carries
  the deferred pass it would have had to fund anyway. The net campaign cost is near
  zero and the round gains mutual blindness.

review_plan_schema_requirements_binding_on_round_2:
  note: >-
    THESE ARE RECORDED AT OPENING SO THE NEXT PLAN IS CHECKABLE BEFORE IT IS
    WRITTEN. Each one is a defect BATCH-f8bf86 measured against this Coordinator
    role, cited to where it was found, not a style preference.
  BR-1:
    rule: >-
      WHILE A ROUND IS OPEN, NO REVIEW FINDING APPEARS IN ANYTHING A CONCURRENT
      AGENT READS. Reviewer artifacts are committed with a SUBJECT LINE ONLY and
      NO findings, verdicts, mechanisms or integers in the message body; the
      summary defers to the composition commit. The same restriction covers PR
      titles and descriptions, `tools/agent_bus.py` messages, branch names and any
      coordination/events/main/** digest text a concurrent session might read.
      Reviewers are told to use `git log --format=%H` until the round closes, and
      the plan's `blindness` block explicitly names commit messages, the merge
      digest and coordination/events/main/**.
    basis: >-
      DEC-20260824-af6d5c `independence_ruling` and PD-1: the driving session
      committed the Validator's report at bd9d62886 with its findings and their
      mechanisms in the message body while the Red Team was still running in the
      same worktree, where `git log` and `git show` are commands the contract
      actively requires. The round is composed as ASYMMETRIC rather than as
      blindness held. The fault was the driving session's; the fix is the cheaper
      of the two available and it asks no reviewer to un-see anything.
    applies_even_with_one_reviewer: >-
      YES, AND THAT IS NOT PEDANTRY. The batch-3 red-team pass reviews THIS
      batch's snapshot, so leaking this round's findings into commit metadata
      would contaminate a round that has not started yet.
  BR-2:
    rule: >-
      EVERY JOINT CARRIES A SHORT `id: J1..Jn` ALONGSIDE ITS `joint:` STATEMENT,
      and every reviewer lists those short ids in `joints_owned`.
    basis: >-
      tools/check_review_independence.py derives each joint's name from
      `entry.get("joint")` (line 136) and demands that whole value appear verbatim
      in `joints_owned` (line 154). BATCH-f8bf86's plan put a multi-sentence
      paragraph there, so the checker reported 7 spurious "does not claim joint"
      problems and exited nonzero although every joint WAS owned by exactly one
      reviewer. Adjudicated in DEC-20260824-af6d5c `independence_checker_adjudication`.
  BR-3:
    rule: >-
      EVERY `blind_from` ENTRY IS A LITERAL PATH PREFIX. No glob characters, no
      `**`, no English prose describing a document section. If a whole directory
      must be blinded, write the directory path with no wildcard.
    basis: >-
      The checker's leak test (lines 216-217) matches literally:
      `r == b or r.startswith(b.rstrip("/") + "/")`. Against
      `blind_from: harness/diffpath/**` the tested prefix becomes the literal
      string `harness/diffpath/**/`, which no real path can match, so THE LEAK
      DETECTOR WOULD NOT HAVE FIRED HAD A LEAK OCCURRED THROUGH EVERY PATH IT
      NAMED. Two further entries in that plan were prose and could never match a
      path by construction. This is an infrastructure finding and is not evidence
      about anything mathematical.
  BR-4:
    rule: >-
      `proves_too_much` CARRIES A TOP-LEVEL `failure_signature` ROLL-UP in
      addition to any per-object signatures.
    basis: >-
      The checker reads a single top-level `proves_too_much.failure_signature`
      (line 189); BATCH-f8bf86's plan placed one inside each of four objects,
      which is the better placement and is retained, so round 2 carries BOTH.
  BR-5:
    rule: >-
      NO PRODUCER-REPORTED VALUE FOR A BLINDED QUANTITY APPEARS IN THE ASSIGNMENT
      DOCUMENT. The assignment document a reviewer is ordered to read is SPLIT
      from the sealed coordinator prior, which the reviewer never receives; and
      the blinded quantity is chosen to be one the assignment has no occasion to
      quote.
    basis: >-
      PD-2. BATCH-f8bf86's blind re-derivation was STRUCTURALLY UNSATISFIABLE:
      `blind_from` named an item INSIDE the document the same plan ordered the
      reviewer to read first, and the blinded quantity's producer-reported value
      appeared TWICE MORE in that same mandatory-read document outside
      `blind_from`. No read order satisfied both instructions. The re-derivation
      is void as an independence instrument and the batch did not get the
      measurement it budgeted for.
    consequence_for_this_round: >-
      Round 2 may set `blind_rederivation.required: false` and lose nothing, since
      the batch's quantities are reproductions of committed values rather than
      novel derivations. IF IT IS SET TRUE, BR-5 IS THE GATE: the plan is checked
      against it before either document is written, not after.
  BR-6:
    rule: >-
      A COORDINATOR EITHER RECOMPUTES A SCALAR IT INTENDS TO BIND, OR QUOTES IT
      WITH ITS PROVENANCE AND MARKS IT UNVERIFIED. This session has no shell, so
      every integer in every artifact it writes for this batch is quoted from a
      named committed artifact and attributed to the session that measured it.
    basis: >-
      PD-3 and CORR-20260824-cc2d27: the defective 5583 propagated two hops into
      Coordinator artifacts -- the snapshot receipt's gate G5 and the review
      plan's own J4 attack step, from where it was handed to a reviewer as an
      instruction. The reviewer measured it rather than accepting it, which is the
      only reason it was caught.
  BR-7:
    rule: >-
      THE PRODUCER'S CODE PATHS ARE DECLARED IN THE PRODUCER'S OWN QUEUE
      `artifact_paths` AT BATCH OPENING, where the archive subset rule permits the
      snapshot to bind them. Retrofitting at the ledger archive is structurally
      impossible.
    basis: >-
      DEC-20260824-af6d5c `snapshot_receipt_gate_status.G7` and PD-8:
      tools/research_dispatch.py requires an archive's `path_sha256` to be a
      SUBSET of that task's own artifact_paths UNION its source tasks'
      artifact_paths, so BATCH-f8bf86's ledger archive could not bind the ten
      sibling modules or the 42 run files.
    how_this_batch_applies_it_without_making_the_archive_fragile: >-
      RUN DIRECTORIES ARE NOT DECLARED AS artifact_paths, ON PURPOSE. A completed
      archive's path_sha256 must cover EVERY declared source artifact, so
      declaring the files of a GATED run would make the snapshot unable to
      complete whenever that run correctly does not execute. Instead: the two code
      paths (harness/diffpath/controlpower.py and
      tests/test_diffpath_controlpower.py) and every terminal task artifact ARE
      declared, and `run-index.json` -- which IS in the binding set -- is required
      to carry a sha256 for EVERY FILE OF EVERY EXECUTED RUN. The runs are then
      content-bound by a bound artifact, and the run directories are disclosed in
      the snapshot receipt's `staged_not_in_binding_set` as before.

