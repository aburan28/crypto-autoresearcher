claim_ceiling: >-
  `analyzed`, NEVER `supported`, FOR EVERY RECORD THIS BATCH PRODUCES, AND IT IS
  STATED HERE RATHER THAN LEFT TO INFERENCE. NO PATH IS CLAIMED NEW FOR EITHER
  PRIMITIVE AT ANY TIER. NO CRYPTANALYTIC IMPROVEMENT OF ANY KIND IS CLAIMED. A
  PASSING CONTROL IS NOT AN IMPROVEMENT, and a control that detects more
  ablations than the last one is a better instrument and still not a result about
  MD5 or SHA-1. With a readable census of 0 entries a NON-MEMBER verdict carries
  no information about the literature at all, and every record citing one states
  the census's completeness (readable 0 / quarantined_not_read 1 /
  acquisition_gap 8, NEVER SUMMED; shadow_planted 16 carried separately) in the
  same sentence.
  Three of CLAUDE.md's four supported-promotion gates are structurally unmet by a
  batch of this kind and the fourth is not attempted. This goal carries no
  asymptotic-complexity claim; if a later batch proposes one, all four promotion
  gates in agents/coordinator.md apply before it may move toward `supported`.
  AN ADDITIONAL CEILING SPECIFIC TO THIS BATCH'S SHAPE. SUPERSEDED IN PLACE ON
  2026-08-24; THE ORIGINAL TEXT READ: "this round runs ONE independent reviewer, not
  two (see `review_architecture`). GOAL-DIFFP-84d641 completion criterion 4 requires
  that BOTH an independent Validator AND an independent Red Team admit each
  claim-relevant run package. THAT CRITERION IS THEREFORE NOT SATISFIED BY THIS BATCH
  AND MUST NOT BE RECORDED AS SATISFIED. The closing decision may reach `analyzed`
  and no further on this package, and may not compose `support` on a one-reviewer
  round."
  AS FILED: the round runs TWO sibling-blind independent reviewers (see
  `review_architecture_as_filed` and DEC-20260824-ad098e), so completion criterion 4
  is REACHABLE. IT IS STILL NOT MET BY THE SHAPE. It requires that both sessions
  ADMIT the package, which the CLOSE determines from the reports it actually
  receives; a `breaks` on a joint a reviewer owns is not an admission on that joint,
  and the criterion is never read off the presence of two task ids in a queue. THE
  CLAIM CEILING IS UNCHANGED AT `analyzed` REGARDLESS: two reviewers do not raise a
  ceiling that is set by three structurally unmet promotion gates and by the nature
  of the object.

