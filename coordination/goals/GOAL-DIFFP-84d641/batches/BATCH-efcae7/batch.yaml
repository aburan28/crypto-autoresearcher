objective: >-
  MEASURE THE NULL'S POWER, BEFORE ANY ACQUISITION AND BEFORE ANY SEARCH.
  BATCH-f8bf86 delivered an adjudicator that is artifact-sound, whose arithmetic
  reproduces exactly, and that gives the correct answer on every object for which
  a known answer could be constructed -- AND whose declared control suite is
  measured to detect 2 of 5 single-component canonical-key ablations, so that an
  adjudicator blind to the message difference (the primary datum of a
  differential characteristic) scores CTL-PLANT 96/96 and CTL-NULL 0/3000,
  identical to the honest one to the digit (EV-DIFFP-b878aa O-7; red-team-report
  J5 part D and proves_too_much O5). Those two integers are true and do not mean
  what a reader would take them to mean.
  BATCH-efcae7 converts that review-side observation into a CHARGED, REPLICABLE
  STANDING CONTROL under EXP-DIFFP-4b165f, in one executor task, at census size
  zero, with no acquisition, no search and no repair:
  (1) CTL-NULL FAMILY (d) `message_difference_perturbed` -- take a planted entry,
  flip k bits of its MESSAGE DIFFERENCE (delta_m for MD5, the DV for SHA-1) at
  k in {1,2,4,8,16}, hold step_delta and every other field fixed, adjudicate.
  Known answer NON-MEMBER at every k >= 1, and MEMBER at the declared k = 0 arm,
  so the family is TWO-SIDED and a degenerate always-reject adjudicator fails it.
  (2) THE ABLATION BATTERY AS A STANDING CONTROL -- the six declared rows of
  EV-DIFFP-b878aa O-7 reproduced verbatim under a manifest, declared seeds and an
  armed deadline, reporting WHICH ABLATIONS THE SUITE DETECTS rather than that
  the null passed; extended, separately reported, to the COMPLETE depth-1
  single-component deletion lattice over the strict key, which is what turns
  "2 of 5 over a hand-chosen five-element sample" into an exhaustive statement at
  that depth.
  (3) THE GENERATOR ACTION PROFILE -- per generator, the orbit images it emits,
  whether its presence changes the serialised key, and whether it changes any
  verdict; the control that can SHOW that {E4} and {E5} emit no orbit image, that
  E5 can affect no membership verdict at all, and that the group doing observable
  work is {E1,E3} plus one key-component deletion.
  (4) THE TWO-SIDED KNOWN-ANSWER SET -- the E2-rotation images, the E6-reindexed
  images and the E4 boundary object, each with a pre-registered answer on BOTH
  sides, so that neither a degenerate always-reject nor a degenerate always-
  accept adjudicator can pass this batch's controls.
  NOTHING HERE CLAIMS ANY PATH IS NEW, claims any cryptanalytic improvement,
  acquires any source, or runs any search. A PASSING CONTROL IS NOT AN
  IMPROVEMENT.

what_this_batch_deliberately_does_not_do:
  - >-
    IT DOES NOT FIX THE INSTRUMENT. VD-3 (for 64 of CTL-PLANT's 96 attempts the
    strict key does not read the candidate's declared DV, because align_E1
    recomputes it from the seed window), VD-4 (permissive act_E2_rotate at b=0
    rebuilds step_delta from the untouched signed form), the {E4}/{E5} zero-image
    result, OBJ-3's unguarded step_start drop, OBJ-4's cross-primitive
    closest-entry loop and OBJ-10's missing well-formedness gate ARE ALL STILL
    OPEN AND ARE NOT REPAIRED HERE. That is deliberate and it is
    DEC-20260824-af6d5c's ranked reason: fixing an instrument whose controls
    cannot see the fix recreates this exact epistemic position one layer up, with
    the repair ATTESTED rather than MEASURED. THE COORDINATOR OPENING THIS BATCH
    AGREES WITH THAT RANKING AND STATES SO EXPLICITLY RATHER THAN INHERITING IT
    SILENTLY. What this batch does instead is MEASURE those defects under run
    discipline (CTL-GEN-ACT for {E4}/{E5}; the VD-3 profile arm of CTL-NULL-D),
    so that batch 3's repair has a control that can detect whether it worked.
  - >-
    IT ACQUIRES NOTHING. Rank 3 of DEC-20260824-af6d5c (Tier C SHA-1
    disturbance-vector acquisition under AMD-20260824-DIFFP-ACQ-1) is sequenced
    BEHIND this batch and is not started here. No task of this batch holds
    web_search; the Executor holds run_commands and deliberately not web_search
    under orchestration/roles.yaml, and using the shell to fetch would route
    around a declared role boundary (IR-6 below).
  - >-
    IT SEARCHES NOTHING. No search over the difference space, no collision
    attempt, no cost projection, no complexity figure (IR-5).
  - >-
    IT MINTS NO IDEA-* IDENTIFIER. TASK-20260824-873dc9's proposal set remains
    ARCHIVED BUT UNREVIEWED except for the J7 firewall property, and
    DEC-20260824-af6d5c's successor gate stands: no IDEA-* id may be minted from
    it until a review of its Pareto `dominated_by` / `sota_delta` honesty and its
    novelty-status discipline has run. Nothing in this batch reads it as a
    premise.
  - >-
    IT FILES NO CORRECTION RECORD. CORR-20260824-cc2d27 (5583 -> 3103) and
    CORR-20260824-e0088c (2094 -> 2089) are ALREADY FILED at
    ledger/corrections/ by the driving session and are not re-filed, re-opened or
    edited here. This batch's CTL-REPRO pre-registers 2089 -- the CORRECTED value
    -- as the number the code must produce, which gives that correction its first
    confirmation under a charged run.

