contamination_firewall: >-
  GOAL-MD5-001's BCP-1 quarantine
  (coordination/goals/GOAL-MD5-001/quarantine/**, payload sha256
  e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5) IS NOT READ BY
  ANY TASK OF THIS BATCH, and the firewall covers CONTENT BY EVERY ROUTE including
  the network, a package index, a model's own memory reproduced into a file, and
  any retrieval index (AMD-20260824-DIFFP-ACQ-1 OB-1). Every task attests
  non-reading. A breach invalidates the run under EXP-DIFFP-4b165f IR-1 and is
  reported to GOAL-MD5-001 as a cross-goal contamination finding.
  BATCH-f8bf86's J7 established that the firewall HELD AS CONTENT rather than by
  attestation -- zero 8-hex-digit word tokens across all 73 committed batch files,
  no table of any kind, the quarantined entry present only as an id, a citation
  string, a path and one whole-file sha256, non-reading verified from the code, and
  the network boundary verified per call from the retrieval log. THAT PROPERTY IS
  NOT INHERITED BY THIS BATCH AND IS RE-ESTABLISHED, not assumed: the batch-2
  producer touches no census content at all (it perturbs SYNTHETIC planted entries
  generated from declared seeds), so the surface is smaller, and the reviewer
  checks it rather than accepting it.
  THE MD5 LANE IS BLOCKED, NOT CLOSED. Letting "blocked" drift into "closed" would
  be premature closure under docs/inventor-protocol.md, which that protocol treats
  as a failure mode symmetric with overclaiming. No record of this batch may state
  or imply that the MD5 arm is exhausted, deprioritised on the merits, or screened
  out.

knowledge_retrieval: >-
  Every task attempts `search_knowledge` before any assertion about what has or
  has not been tried, and records its queries and outcomes VERBATIM. The index is
  derived and may be empty; an empty answer is a fact about the index and licenses
  no inference in either direction (AGENTS.md "Knowledge retrieval policy"). No
  task of this batch writes to the index.

runtime_policy: >-
  Per-role policies are resolved through orchestration/roles.yaml and
  orchestration/model-policies.yaml; the coordinator tasks request
  coordinator-orchestration-code, the executor requests executor-implementation,
  and the reviewer requests review-adversarial at reasoning_effort xhigh with
  independent_session_required true. `degraded_allowed` and `fallback_allowed` are
  FALSE everywhere in this batch: a tier the backend cannot reach is a PAUSE and
  an `inference_amendment`, never a silent downgrade. Every run manifest and every
  report records requested policy, backend, resolved model identifier and whether
  it was PROBE-VERIFIED. BATCH-f8bf86 recorded that no backend was probe-verified
  in its review round and that both reviewers' model identifiers were
  self-reported rather than measured; that limitation is expected to recur and
  must be stated plainly rather than upgraded. NEVER AMAZON BEDROCK in any
  runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).

