# THE OPENING DECISION BODY -- verbatim, for the driving session to file under a
# minted id.  DEC-20260824-c5bb72 IS RESERVED FOR THE CLOSE AND IS NOT THIS.
# ======================================================================
opening_decision_body_pending_mint:
  coordinator_decision:
    id: null
    id_note: >-
      TO BE FILLED BY THE DRIVING SESSION with the id it mints and verifies free
      with tools/allocate_id.py --check. This body is filed unchanged apart from
      that one field. NOT DEC-20260824-c5bb72, which is reserved for the batch
      close (TASK-20260824-b3e02b).
    title: >-
      Open BATCH-efcae7 of GOAL-DIFFP-84d641 and approve EXP-DIFFP-4b165f:
      measure the null's power as a charged standing control -- CTL-NULL family
      (d) `message_difference_perturbed` with a two-sided known answer, plus the
      ablation battery extended to the complete depth-1 key lattice -- before any
      acquisition, any search and any instrument repair
    goal_id: GOAL-DIFFP-84d641
    question_id: RQ-DIFFP-a5c483
    batch_id: BATCH-efcae7
    experiment_id: EXP-DIFFP-4b165f
    round: 2
    context: >-
      BATCH-f8bf86 closed `weaken` on a measured control-power obstruction: the
      declared control suite detects 2 of 5 single-component canonical-key
      ablations, and an adjudicator blind to the message difference scores
      CTL-PLANT 96/96 and CTL-NULL 0/3000, identical to the honest one to the
      digit. The load-bearing measurements were single-session review-side
      computation with no run record (EV-DIFFP-b878aa UC-2), so the closing
      decision was `weaken` rather than `reject_scoped` and named replication as
      its one next action. This decision opens the batch that performs it.
    decision: approve
    decision_label_reasoning: >-
      `approve` IS THE CORRECT LABEL AND THE ALTERNATIVES ARE NAMED. This decision
      approves an experiment contract and a batch shape; it changes no hypothesis
      status, promotes nothing, and asserts nothing about MD5 or SHA-1.
      `expand` was considered and rejected: this batch does not widen the goal's
      object, it re-measures an instrument the goal already holds.
      `replicate` is descriptively accurate for the ablation battery and was
      rejected as the label because the batch does strictly more than replicate --
      family (d) is a NEW control with a two-sided known answer, and the depth-1
      lattice is an EXHAUSTIVE extension of a hand-chosen sample. Labelling it
      `replicate` would understate what is being approved.
      `pause` is not taken: no pause_condition of GOAL-DIFFP-84d641 is met. The
      campaign budget is not exhausted (1 of 6 batches spent, 3000 of 10800 s
      declared); no primary source has been shown unobtainable; the equivalence
      does have a verified generating set; no batch has turned out to be solver
      validation; and no infrastructure blocker exists.
    target_ids:
      - GOAL-DIFFP-84d641
      - RQ-DIFFP-a5c483
      - BATCH-efcae7
      - EXP-DIFFP-4b165f
      - TASK-20260824-b7efbf
      - TASK-20260824-9a489e
      - TASK-20260824-7175d9
      - TASK-20260824-b61d11
      - TASK-20260824-b3e02b
    evidence_refs:
      - EV-DIFFP-b878aa
      - DEC-20260824-af6d5c
      - CORR-20260824-cc2d27
      - CORR-20260824-e0088c
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/red-team-report.yaml
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml
      - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/amendments/AMD-20260824-DIFFP-ACQ-1.yaml
      - experiments/EXP-DIFFP-fe894e/specification.yaml
    rationale:
      - >-
        THE GOAL HEAD'S next_action IS THE CONTRACT AND IT IS EXECUTED, NOT
        RE-LITIGATED. It names family (d) and the ablation battery as a standing
        control under a charged run with a manifest, declared seeds and an armed
        deadline, reporting WHICH ABLATIONS THE SUITE DETECTS rather than that the
        null passed. This batch is exactly that and adds nothing that is not
        instrumental to it.
      - >-
        A CONTROL WITH ONLY ONE ANSWER IS THE O5 FAILURE EXACTLY, so family (d)
        is specified TWO-SIDED: k = 0 is a declared arm whose known answer is
        MEMBER, and k >= 1 is NON-MEMBER. A degenerate always-reject adjudicator
        fails the k = 0 arm, CTL-PLANT, and the permissive side of every two-sided
        decoy; a degenerate always-accept adjudicator fails every k >= 1 draw and
        the whole of CTL-NULL. Neither degenerate can pass this batch.
      - >-
        THE ABLATION MECHANISM IS CHANGED ON PURPOSE AND THE CHANGE IS DECLARED IN
        ADVANCE. The round-1 battery edited serialize(); this contract forbids any
        edit to a committed module and instead applies a declared PROJECTION that
        drops named pairs from the serialised key tuple. That keeps the measured
        instrument byte-identical to the reviewed one (CTL-FROZEN re-verifies every
        harness/diffpath module's sha256 after the last run), at the cost that a
        disagreement with round 1 localises to the mechanism. The prior records
        that cost as a MODERATE rather than STRONG prediction, in advance.
      - >-
        THE BATTERY IS EXTENDED TO THE COMPLETE DEPTH-1 LATTICE BECAUSE THE
        OBSTRUCTION SAID SO ABOUT ITSELF. EV-DIFFP-b878aa records that "2 of 5" is
        a point estimate over a hand-chosen five-element sample, not a rate with a
        confidence interval, and that the sampling variability that would matter is
        across seeds and across ablation choices. Exhausting depth 1 removes the
        ablation-choice variability at that depth entirely. The six declared rows
        are reported FIRST and SEPARATELY, so the replication the closing decision
        asked for is never conflated with the extension.
      - >-
        MEASURING PRECEDES REPAIRING, AND THE RANKING IS ADOPTED ON ITS ARGUMENT
        RATHER THAN INHERITED. Fixing VD-3, VD-4, OBJ-3, OBJ-4 and OBJ-10 first
        would produce a repaired adjudicator whose repair is ATTESTED rather than
        MEASURED, because the suite that would have to detect a regression is
        measured to detect 2 of 5 ablations. This batch produces the artifact that
        makes those repairs checkable, and it also measures the {E4}/{E5}
        zero-image result (CTL-GEN-ACT) and the VD-3 read-path (the D-VD3-PROFILE
        arm) so that batch 3's repair has a baseline to regress against.
      - >-
        ACQUISITION IS STILL THE CAMPAIGN'S BINDING CONSTRAINT (prior P-5 of round
        1, corroborated by J7) AND IS STILL NOT THE NEXT ACTION. An instrument
        whose control suite cannot see the primary datum of a differential
        characteristic must not be the first thing a newly acquired published path
        meets; that verdict would be the first artifact in this goal with a
        downstream consumer and would be unfalsifiable in exactly the way P-1's
        zero would have been without a scanner positive control. Acquisition does
        not become cheaper by waiting one batch; the verdict it produces becomes
        trustworthy.
      - >-
        NO PATH IS CLAIMED NEW, NO CRYPTANALYTIC IMPROVEMENT IS CLAIMED, NO SEARCH
        IS AUTHORISED, NO ACQUISITION IS AUTHORISED, AND THE MD5 LANE IS BLOCKED
        RATHER THAN CLOSED. A passing control is not an improvement.
    limitations:
      - >-
        ONE INDEPENDENT REVIEWER, NOT TWO, forced by the five pre-allocated task
