  campaign_budget_as_committed: >-
    maximum_batches 6, total_wall_clock_seconds 10800, max_concurrent 2. THESE ARE
    CEILINGS AND THIS COORDINATOR SELF-GRANTS NO RAISE. A ceiling raise is a
    separate, explicitly user-authorised decision recorded as such, by the
    precedent of DEC-20260812-f30c6e and DEC-20260822-85784e on GOAL-MD5-001.
  split_across_tasks_superseded_2026_08_24: >-
    THE FIRST SPLIT WAS 420 / 1200 / 240 / 720 (one reviewer) / 420 = 3000 exactly,
    committed at 976a3a972 and retained here rather than deleted. It is superseded by
    `split_across_tasks` below, which adds TASK-20260824-e9d21a and rebalances the
    reviewer budgets.
  split_across_tasks:
    TASK-20260824-b7efbf: 420
    TASK-20260824-9a489e: 1200
    TASK-20260824-7175d9: 240
    TASK-20260824-b61d11: 600
    TASK-20260824-e9d21a: 600
    TASK-20260824-b3e02b: 420
  arithmetic: '420 + 1200 + 240 + 600 + 600 + 420 = 3480 exactly.'
  campaign_arithmetic: >-
    BATCH-f8bf86 declared 3000 s and MEASURED 80.748 s of wrapper-charged compute
    across six runs inside 960 s of per-run ceilings, with 879.252 s of ceiling
    unspent and NOT reallocated; its agent-time overrun (a measured lower bound of
    1698 s against a 900 s task budget) was disclosed and accepted without
    reallocation. BATCH-efcae7 declares a further 3480 s. Declared so far:
    3000 + 3480 = 6480 of 10800. REMAINING FOR BATCHES 3-6: 4320 s, i.e. an average
    of about 1080 s per remaining batch.
    THE NET CAMPAIGN COST OF THE SECOND REVIEWER IS NEAR ZERO RATHER THAN 600 s, and
    that is arithmetic rather than optimism: batch 3 no longer carries the deferred
    red-team pass it would otherwise have had to fund, so the cost is paid NOW, while
    the object is loaded and the round can still be blind, instead of LATER when it
    could not be.
    THIS REMAINS TIGHT AND IS STATED AT OPENING RATHER THAN DISCOVERED AT BATCH 5:
    batch 3 carries Tier C acquisition AND the five instrument repairs with their two
    regression fixtures, and it will have to choose. If it cannot, the honest move is
    a pause_condition or a user-authorised ceiling raise, never a self-grant.
  producer_budget_basis: >-
    1200 s FOR THE EXECUTOR, SET FROM MEASUREMENT RATHER THAN FROM THE SAME
    OPTIMISM. DEC-20260824-af6d5c `budget_adjudication` records the lesson
    explicitly: a task that built an instrument from nothing, wrote eleven modules
    and ran six charged runs was not a 900 s task, and the batch opening should
    have said so. Batch 2's producer writes ONE new module and ONE new test file
    against a FROZEN, already-committed package it may not edit, and runs five
    charged runs whose modelled compute is well under 200 s. 1200 s is generous
    for that and deliberately so: PD-4 records that under-budgeting a stage and
    then asking it for more than the budget buys is this Coordinator's error, not
    the agent's.
  review_budget_basis: >-
    600 s EACH FOR TWO REVIEWERS, AGAINST BATCH 1'S 360 s EACH AND AGAINST THE 720 s
    THIS BATCH'S FIRST SHAPE GAVE A SINGLE REVIEWER CARRYING BOTH JOINT SETS. This is
    not a cut made to preserve a round number: the joints now split across two
    sessions, so each reviewer carries fewer of them, while PD-4 is recorded against
    this role for cutting review budgets without a basis and then asking for more
    than they bought -- the batch-1 review plan itself stated it exceeded what 360 s
    comfortably bought, the budgets were not raised, a priority order was written
    instead, and the Red Team paid the difference in unmeasured wall clock. 600 s is a
    67% increase over the budget the round-1 reviewers overran, with a smaller joint
    load than the 720 s single-reviewer design carried.
  unspent_ceilings: >-
    ARE REPORTED AS UNSPENT AND ARE NEVER REALLOCATED WITHOUT A VERSIONED
    protocol_amendment. `maximum_runs` IS DEFINED EXPLICITLY IN EVERY HANDOFF OF
    THIS BATCH, closing the round-1 ambiguity the Red Team asked about and
    DEC-20260824-af6d5c `budget_adjudication.red_team_run_count` ruled on: it
    counts CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- a run directory, a RUN-*
    identifier, a manifest, an armed deadline and a consumed ceiling -- and does
    NOT count script executions, read-only probes or re-derivations that create no
