sealed_coordinator_prior:
  part: 1
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-145531
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-04082e
  written_by: TASK-20260824-f094e8 (BATCH-145531 opening control plane)
  written_at: '2026-08-24'
  written_before: >-
    THE PRODUCER RAN. This file is authored at the batch opening, before
    TASK-20260824-68ba87 is dispatched and before any run of EXP-DIFFP-04082e exists.

  # ==================================================================
  why_this_file_is_here_and_not_in_batch_yaml: >-
    BECAUSE DEC-20260824-c5bb72 PD-3 MEASURED THAT ROUND 2's SEAL LEAKED, AND MEASURED
    THE LEAK TO BE WIDER THAN THE ROUND DISCLOSED. Round 2 put P-1..P-5 in
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/batch.yaml, which both
    reviewers were entitled to read, and disclosed a residual scoped to that file. What
    actually happened is better in one direction and worse in another: NEITHER reviewer
    read batch.yaml -- one declined it deliberately so its rulings could not be a
    confirmation of the prior -- BUT the one-sentence version of the prior sat inside
    review-plan.yaml's mandatory `coordinator_prior` field, which the independence
    checker requires to be non-empty and which BOTH reviewers list in sources_read. The
    discount therefore applied to both reviewers rather than to one, and the finding was
    against the plan, which was this Coordinator role's.
    THE STRUCTURAL FIX, APPLIED HERE AND NOT PROMISED:
    (1) THE PRIOR LIVES OUTSIDE THE BATCH DIRECTORY ENTIRELY, under
    coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-145531/, which NO REVIEWER
    READ SCOPE IN BATCH-145531 REACHES -- the reviewers' read scopes name specific
    subpaths under batches/BATCH-145531/ and never the goal directory.
    (2) THE REVIEW PLAN'S MANDATORY `coordinator_prior` FIELD CARRIES A POINTER AND A
    STATEMENT THAT THE DOCUMENT IS SEALED, NEVER THE SENTENCE (batch rule BR-9).
    (3) THIS PATH PREFIX IS LISTED IN THE PLAN'S `blind_from` AS A LITERAL PATH PREFIX
    (BR-3), so the independence checker's leak test can actually match it.
    THE RESIDUAL THAT REMAINS, STATED RATHER THAN CLAIMED AWAY: this file is COMMITTED
    in the same repository the reviewers work in, so a reviewer who went looking outside
    its declared read scope could find it. That is a boundary, not a cage, and it is the
    same boundary every read_scope in this program is. The close discounts any
    concurrence a reviewer's attestation shows it could have read.

  the_use_rule: >-
    THIS PRIOR IS NEVER EVIDENCE. Where a reviewer's or the producer's finding agrees
    with it, the agreement is discounted to the extent that party could have read it,
    and the discount is stated. Where a finding contradicts it, THE FINDING WINS and the
    prior is recorded as overturned in the direction it was overturned. An overturned
    item is a first-class finding of the close, never something absorbed. The close
    scores every item below explicitly.

  # ==================================================================
  items:

    P-1:
      confidence: STRONG
      claim: >-
        THE DEPENDENCY GRAPH WILL CONFIRM THE ONE EDGE ALREADY MEASURED --
        in_linearized_code = f(message_difference) on SHA-1 objects at full step range --
        AND WILL PRODUCE A DERIVATION FOR IT RATHER THAN ONLY A WITNESS. The derivation
        exists in the committed source: the flag is computed by a named function of the
        disturbance vector, so the edge is a fact about the serialiser and not about the
        census.
      falsifier: >-
        Any SHA-1 object in the declared population whose flag differs from
        sha1_in_linearized_code(dv); or a producer that reports the edge with a witness
        and cannot write the derivation, in which case the class must be
        `empirical_only` and the word "theorem" disappears from this batch.
      what_would_make_me_wrong_in_an_interesting_way: >-
        If the flag is computed at CONSTRUCTION time and stored rather than derived at
        SERIALISATION time, then the edge holds over the constructed population and NOT
        over the class of well-formed objects, and "provably undetectable" would be a
        statement about how this program builds objects rather than about the key. I
        think this is the single most likely way the derivation half fails.

    P-2:
      confidence: MODERATE, AND DELIBERATELY NOT STRONG
      claim: >-
        THE GRAPH WILL BE SPARSE. I predict EXACTLY ONE value-level edge among the 60
        ordered pairs, the one in P-1, plus a SCHEMA-LEVEL relation that is not a
        value-level edge and should not be reported as one: `primitive` determines
        WHICH components appear in the key at all (in_linearized_code exists on SHA-1
        objects and not on MD5 ones). A detector that reports primitive ->
        in_linearized_code as a value-level edge is reporting the schema, and the report
        must distinguish the two.
      why_only_moderate: >-
        I have not read the serialiser closely enough to rule out a second edge, and
        `length` and `step_delta` are the pair I would look at: if `length` is derived
        from the step range and the step range is derived from step_delta's shape, there
        is an edge there that nobody has looked for. IF A SECOND EDGE APPEARS, THE
        PARTITION MOVES AND THIS BATCH BECOMES MORE INTERESTING THAN I EXPECT, NOT LESS.
      falsifier: two or more value-level edges; or zero, which would refute P-1 as well.

    P-3:
      confidence: STRONG ON DIRECTION, WEAK ON THE INTEGERS
      claim: >-
        THE PARTITION DERIVED FROM THE GRAPH ALONE WILL REPRODUCE 1 / 3 / 0 / 1 / 1.
      why_i_hold_the_direction_strongly_and_the_integers_weakly: >-
        The direction is strong because every one of the six rows already has a stated
        mechanism in DEC-20260824-c5bb72 and each mechanism is derivable: row 4 from the
        edge, rows 1/2/6-equivalents from the families' declarations, and the three
        not-probed rows from the absence of any family that moves them. THE INTEGERS ARE
        WEAK BECAUSE THE CLASS BOUNDARIES ARE MINE AND I WROTE THEM AFTER SEEING THE
        ANSWERS. A partition whose classes were chosen to fit a known assignment will fit
        it, and the close must NOT read agreement here as strong confirmation. THE
        INFORMATIVE OUTCOME IS DISAGREEMENT.
      falsifier: any row whose graph-derived class differs from DEC-20260824-c5bb72's.
      the_thing_i_would_most_like_to_be_wrong_about: >-
        `step_delta`, the one row DEC-20260824-c5bb72 calls CONTINGENT. Its DETECTED
        verdict comes from six family-(a) draws colliding with a MATCHED census entry
        once step_delta leaves the key -- and CORR-20260824-c1c8b1 records that those six
        draws differ from a matched entry in step_delta ALONE. If the graph shows that
        collision is forced by the census's weight-1 MD5 structure rather than by the
        instrument, THE CONTINGENT COUNT GOES TO ZERO and this program's per-component
        profile carries no information about the instrument at any depth-1 row. I think
        that is unlikely and I want it checked.

    P-4:
      confidence: MODERATE
      claim: >-
        EXACTLY ONE DEPTH-2 SUBSET BREAKS A DEPENDENCY, {message_difference,
        in_linearized_code}, which is already row 5. The other fourteen are classified
        as not-breaking.
      the_caveat_i_want_on_the_record_now: >-
        "DOES NOT BREAK A DEPENDENCY" IS NOT "SAFE", AND I EXPECT THIS TO BE THE
        SENTENCE A LATER READER MISUSES. Three non-breaking subsets are ALREADY MEASURED
        to hide a known-false instrument (O-C, O-C-prime and the depth-3
        O-C-double-prime). If the report or the close lets "the depth-2 lattice is bought
        by argument" become "the depth-2 lattice is covered", that is exactly the
        premature closure docs/inventor-protocol.md names as symmetric with overclaiming.
      falsifier: a second breaking subset, or zero.

    P-5:
      confidence: WEAK, AND THIS IS THE ITEM I TRUST LEAST AND MOST WANT MEASURED
      claim: >-
        THE TWO MATRICES WILL BE IDENTICAL ON EVERY OFF-DIAGONAL CELL THE GRAPH ADMITS.
        DIFFERING-CELL COUNT ZERO. My reasoning: O-E differs from the honest instrument
        ONLY on objects whose SHA-1 message difference moves while the object stays in
        the linearized code, and NO d_X family in the off-diagonal set constructs such an
        object -- d_message_difference's primary arm moves the dv out of the code (which
        is why the flag moves with it), and the other five families do not touch the dv
        at all. If that is right, THE HONEST HEADLINE IS THAT THE OFF-DIAGONAL PROFILE
        CARRIES NO INFORMATION ABOUT THE INSTRUMENT EITHER, and the ONLY thing in this
        batch that produces a differing cell is the RC-1 refold -- whose outcome is
        already known.
      why_that_would_be_a_real_result_and_not_a_null: >-
        It would say the family-by-row matrix, the object DEC-20260824-c5bb72 ranked
        third and folded into rank 1, is a function of the families' construction and the
        dependency graph END TO END -- diagonal by J13's rule, forced cells by the graph,
        and the remainder by the families' failure to construct the discriminating
        object. That is a stronger and cheaper statement than "the matrix showed little",
        and it names the next object precisely: A FAMILY THAT MOVES THE SHA-1 MESSAGE
        DIFFERENCE WITHIN THE CODE, which is exactly the D-SHA1-INCODE construction the
        committed detection rule never reads.
      falsifier: any differing cell.
      what_i_would_conclude_if_i_am_wrong: >-
        That there is a cell where a verdict is contingent on the instrument that neither
        I nor the round-2 Red Team anticipated, and the FIRST thing the close should do
        is name that cell and ask what family built it -- not celebrate a nonzero count.

    P-6:
      confidence: META, AND HELD AS A PREDICTION ABOUT MY OWN ERROR MODE
      claim: >-
        THE ROUND WILL BREAK MY READING ONE LEVEL UP AGAIN, AND THE SHAPE WILL BE THAT
        THE DIFFERING-CELL COUNT MEASURES WHICH FAMILIES WERE BUILT RATHER THAN THE
        INSTRUMENT. Round 1 replaced a pass with a fraction. Round 2 measured the fraction
        was largely a property of the ablation lattice and the perturbing families. THE
        SAME MOVE IS AVAILABLE AGAINST THIS BATCH: an off-diagonal count over six families
        I chose is a property of my choice of families. I NAME IT NOW SO THAT IF IT
        HAPPENS THE CLOSE CANNOT PRESENT IT AS A SURPRISE, AND SO THAT IF IT DOES NOT
        HAPPEN THAT IS ALSO INFORMATIVE.
      the_defence_i_have_built_and_its_limit: >-
        CTL-NULL-OBJ is the defence: two degenerate instruments through the identical
        counting rule give the count a demonstrated capacity to be large. ITS LIMIT: it
        shows the COUNTING RULE can be large, not that the FAMILY SET can produce a large
        one. Those are different and the close must not conflate them.

    P-7:
      confidence: EXPLICIT UNCERTAINTY, RECORDED AS UNCERTAINTY
      claim: >-
        I DO NOT KNOW WHETHER THE `PROVABLY UNDETECTABLE` LABEL SURVIVES AN ADVERSARIAL
        PASS. My honest split is about 60/40 that the derivation is sound as a statement
        about the serialiser, and 40 that the adversary shows the label is scoped to this
        census -- because every planted SHA-1 entry is in the linearized code, and a
        census with an out-of-code entry might break the edge. I HAVE WRITTEN H-1 SO THAT
        THE 40 CASE COSTS THIS BATCH A LABEL AND NOT A RETRACTION.

    P-8:
      confidence: MODERATE, AND IT IS ABOUT INFRASTRUCTURE RATHER THAN MATHEMATICS
      claim: >-
        WRITING RUNS AT experiments/EXP-DIFFP-04082e/runs/ WILL SURFACE AT LEAST ONE NEW
        tools/validate_ledger.py COMPLAINT, because those manifests will be schema-checked
        by `check_run` for the first time in this campaign and harness/runner.py is known
        to define its inference block twice. I EXPECT THE PRODUCER TO NEED A
        manifest-supplement.yaml AND I HAVE WRITTEN THE CONTRACT SO THAT NEEDING ONE IS A
        DECLARED PATH RATHER THAN A CRISIS.
      why_it_matters_that_this_is_predicted: >-
        DEC-20260824-c5bb72 refused to make the copy at the close precisely because
        trading one validator error for five different ones, on an assumption, is not a
        repair. THIS IS THE MEASUREMENT THAT TURNS THE ASSUMPTION INTO A FACT, and it is
        being taken on NEW runs, where nothing immutable is at stake.

  # ==================================================================
  what_would_overturn_this_whole_prior_wholesale: >-
    A SECOND VALUE-LEVEL DEPENDENCY EDGE. Every item above except P-8 assumes the graph
    is essentially the single known edge. A second edge would move the partition, change
    which depth-2 subsets break a dependency, change which off-diagonal cells are forced,
    and make P-5's zero much less likely. IF THE PRODUCER FINDS ONE, THE CLOSE SHOULD
    TREAT EVERY ITEM ABOVE AS SUSPECT RATHER THAN SCORING THEM ONE BY ONE AGAINST A
    STRUCTURE THAT NO LONGER HOLDS.

  what_this_prior_deliberately_does_not_predict: >-
    NOTHING ABOUT MD5, SHA-1, ANY PUBLISHED CHARACTERISTIC, ANY DIFFERENCE SPACE, ANY
    NOVELTY STATUS OR ANY COST. There is nothing here to predict about them, because this
    batch measures this program's own instrument. If a later reader finds a sentence in
    this file that reads as a prediction about a primitive, that sentence is a defect.
