  written_before: >-
    THE PRODUCER RAN. This file is authored at the batch opening, before
    TASK-20260826-82c660 is dispatched and before any run of EXP-DIFFP-f26790 exists. It is
    written in the same pass as the frozen contract and before the dispatch queue, so that
    no number in it can have been chosen after seeing a result.

  # ==================================================================
  why_this_file_is_here_and_not_in_batch_yaml: >-
    BR-9, CARRIED FORWARD, AND IT IS THE ONE PROCEDURAL FIX OF ROUND 3 THAT THE CLOSE
    MEASURED AS HAVING HELD. DEC-20260824-257f35 `independence_ruling` records that BR-9's
    structural fix HELD with one named residual: neither reviewer read the prior, both
    attested `read_sealed_prior: false`, and for the Red Team the seal was inside the
    MECHANICALLY CHECKED leak set, which was the first time in this goal that any reviewer's
    non-reading of the prior was machine-testable. The prior therefore lives here again,
    outside the batch directory, under
    coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-171407/, which NO reviewer
    read_scope in BATCH-171407 reaches.
    THE ONE RESIDUAL ROUND 3 NAMED IS REAL AND IS ADDRESSED IN THE OPENING RATHER THAN
    REPEATED: BR-8 and PDV-5 required the sealed prior to be a declared artifact_path bound
    by a receipt, and a receipt binding it must be readable by a reviewer verifying the
    archive -- so the round's own durability fix published the two filenames to a reviewer
    that had to enumerate the receipt. The Validator disclosed exactly that, unprompted, and
    the close ruled BR-9 held WITH A NAMED RESIDUAL. THE SUCCESSOR FIX THE CLOSE NAMED IS
    APPLIED IN THIS BATCH AS BR-16, AND ITS EFFECT IS STATED PRECISELY RATHER THAN GENEROUSLY:
    NEITHER SEALED-PRIOR FILENAME APPEARS IN ANY ARCHIVE'S path_sha256. Their digests are
    carried in one sidecar, digests.json at this same prefix, and THAT SIDECAR IS ITSELF A
    DECLARED, BOUND PATH -- so a reviewer verifying the archive still sees ONE path, under a
    prefix the review plan's `coordinator_prior` field publishes to it BY DESIGN, and learns
    neither how many parts the prior has nor what they are called. THE RESIDUAL IS REDUCED AND
    NOT ELIMINATED, and a prefix plus the existence of a digest file is still information.
    THE RESIDUAL THAT REMAINS, STATED RATHER THAN CLAIMED AWAY: this file is COMMITTED in the
    same repository the reviewers work in, so a reviewer who went looking outside its declared
    read scope could find it. That is a boundary, not a cage, and it is the same boundary
    every read_scope in this program is.

  the_use_rule: >-
    THIS PRIOR IS NEVER EVIDENCE. Where a reviewer's or the producer's finding agrees with it,
    the agreement is DISCOUNTED to the extent that party could have read it, and the discount
    is stated at the point of use. Where a finding CONTRADICTS it, THE FINDING WINS and the
    item is recorded as OVERTURNED in the direction it was overturned. An overturned item is a
    FIRST-CLASS FINDING of the close, never something absorbed into a summary. The close scores
    every item below explicitly, and an item that cannot be scored is recorded as UNSCOREABLE
    with its reason rather than quietly dropped.

  what_this_prior_predicts_in_one_sentence_so_the_close_can_check_the_headline_first: >-
    I PREDICT THE RE-ADMITTED DIFFERING-CELL COUNT IS NONZERO AND IS EXACTLY 1, AT THE CELL
    (d_message_difference, row deleting in_linearized_code, sha1), OVER A DENOMINATOR THAT IS
    NOT 30.

  # ==================================================================
  items:

    Q-1:
      confidence: STRONG
      claim: >-
        THE INDEPENDENT IMPLEMENTATION WILL REPRODUCE A NONZERO RE-ADMITTED COUNT, AND THE
        DIFFERING CELL WILL BE THE SAME ONE RT-J8-4 FOUND -- (d_message_difference, row
        deleting in_linearized_code, sha1), honest NOT DETECTED against O-E DETECTED.
      why_strong: >-
        BECAUSE THE MECHANISM IS DERIVED FROM COMMITTED SOURCE RATHER THAN OBSERVED. Two
        committed facts, both independently ruled sound by the round-3 Validator against the
        committed serialiser, entail it jointly: E4, that the sha1 flag is a pure function of
        the word list and is RECOMPUTED by perturb_message_difference; and that O-E is
        per-primitive-blind, so under O-E's projection composed with the deletion of the flag
        the projected key no longer retains a component that determines the deleted one by a
        derivation-backed edge. A predicate that is derivable from two committed derivations is
        not the kind of thing one session's implementation invents.
      falsifier: >-
        A re-admitted count of 0 under an implementation that passes CTL-FORCE-PI's identity
        known-answer; or a nonzero count whose differing cell is NOT that cell.
      what_would_make_me_wrong_in_an_interesting_way: >-
        If the per-instrument forcing predicate, implemented honestly FROM THE STATEMENT rather
        than from RT-J8-4's code, turns out to have a second admissible reading -- for example
        whether "I's projection composed with the row's deletion" composes in that order or the
        other -- and the two readings give different forced sets. THAT WOULD BE THE MOST
        VALUABLE OUTCOME IN THIS BATCH, because it would say the quantity is a property of a
        quantifier choice and not of the instrument, which is Q-6's shape arriving one level
        further along.

    Q-2:
      confidence: MODERATE, AND DELIBERATELY NOT STRONG
      claim: >-
        THE COUNT WILL BE EXACTLY 1 AND NOT MORE. Only one edge in the whole committed graph
        has a witness with a demonstrated capacity to fail -- E4 -- and the other three derived
        edges are definitional identities of the committed PathObject that no projection
        available to O-E can break.
      why_only_moderate: >-
        I have not enumerated, per instrument, every row whose forced status could move under a
        projection. The three degenerate and known-false instruments in scope are blind to
        different components, and a rule recomputed per instrument is evaluated once per
        instrument rather than once. IF THE COUNT COMES BACK GREATER THAN 1 THIS BATCH IS MORE
        INTERESTING THAN I EXPECT, NOT LESS, and the close must name every additional cell and
        ask which instrument's blindness produced it.
      falsifier: 'a re-admitted count of 2 or more, or of 0.'

    Q-3:
      confidence: MODERATE, AND IT IS THE ITEM I MOST WANT THE CLOSE TO CHECK MECHANICALLY
      claim: >-
        THE DENOMINATOR WILL NOT BE 30. RT-J8-4 reported 1 of 30, and DEC-20260824-257f35
        `application_3` records that the re-deriver's forced set was UNDER-DERIVED -- it used
        only the flag edge, while the producer additionally forces the `length` row on the
        step_delta edge, which the re-deriver itself confirmed from committed source and said
        so plainly against its own interest. AN IMPLEMENTATION THAT DERIVES THE FORCED SET
        CORRECTLY PER INSTRUMENT AND PER PRIMITIVE SHOULD THEREFORE ARRIVE AT A DIFFERENT
        DENOMINATOR, AND REPRODUCING 30 EXACTLY WOULD BE REPRODUCING AN UNDER-DERIVATION.
      why_this_matters_more_than_it_looks: >-
        THIS IS THE ITEM THAT DISTINGUISHES A REPLICATION FROM A RE-EXECUTION. If the count and
        the denominator both come back identical to RT-J8-4's, the honest reading is NOT "the
        finding replicated" but "either the second implementation made the same derivation
        choice, or it was not independent". The close must ask which, and the answer is in the
        forced-set derivation the contract requires per instrument and per primitive (H-13),
        not in the headline integer.
      falsifier: 'a denominator of exactly 30 accompanied by a correctly derived per-instrument forced set.'

    Q-4:
      confidence: WEAK, AND THIS IS THE ITEM I TRUST LEAST AND MOST WANT MEASURED
      claim: >-
        THE CONSISTENT-PAIR FLAG-AND-dv FAMILY IS CONSTRUCTIBLE UNDER CTL-WF, and it will
        produce at least one cell at which the HONEST instrument reports DETECTED.
      why_weak: >-
        Round 3 measured that THREE OF SIX declared families cannot be constructed at all under
        the well-formedness gate, and null family (e) as originally specified is proved not
        constructible under CTL-WF because the gate's own W3 asserts the very predicate the
        family perturbs. The consistent-pair construction is designed precisely to survive that
        gate by moving the flag and the dv TOGETHER -- but I am predicting that a gate written
        by this program admits an object built to satisfy it, which is the kind of prediction
        that is either trivially true or reveals that the gate asserts more than consistency.
      falsifier: >-
        The family is NOT CONSTRUCTIBLE, reported with its derivation; or it is constructible
        and the honest instrument reports DETECTED on zero of its cells.
      what_i_will_conclude_if_it_is_not_constructible: >-
        NOT that null family (e)'s direction is closed. It would be a DERIVED FACT ABOUT THE
        KEY FORMAT AND THE GATE, and it must be reported with its derivation and never as a
        family that produced zero detections. It would also mean this campaign has no named
        repair left for family (e), and the close would owe a new one or an explicit, argued
        retirement with an obstruction block of its own.

    Q-5:
      confidence: MODERATE
      claim: >-
        IF THE CONSISTENT-PAIR FAMILY IS CONSTRUCTIBLE, THE HONEST INSTRUMENT AND O-E WILL
        DIFFER ON AT LEAST ONE OF ITS CELLS. It is the only family in this campaign built to
        move the sha1 message difference and the flag together, and O-E's blindness is exactly
        per-primitive.
      why_it_matters_that_this_is_separate_from_Q_4: >-
        Q-4 is about CONSTRUCTIBILITY and Q-5 is about POWER, and conflating them is how "the
        control ran" becomes "the control discriminates". A family that builds and detects
        nothing is a measured coverage fact; a family that builds and separates two instruments
        is the first family in this goal that populates a cell the existing set cannot reach.
      falsifier: 'zero differing cells over the consistent-pair family, given that it is constructible.'

    Q-6:
      confidence: META, AND HELD AS A PREDICTION ABOUT MY OWN ERROR MODE
      claim: >-
        THE ROUND WILL BREAK MY READING ONE LEVEL UP AGAIN, AND THE SHAPE WILL BE THAT THE
        RE-ADMITTED COUNT MEASURES THE QUANTIFIER IN THE FORCING RULE RATHER THAN THE
        INSTRUMENT. Round 1 replaced a pass with a fraction. Round 2 measured that the fraction
        was largely a property of the ablation lattice and the perturbing families. Round 3
        measured that the exclusion rule deciding what is adjudicable cannot see the instrument
        under test. THE SAME MOVE IS AVAILABLE HERE: a count over cells re-admitted by a rule I
        specified is a property of my specification of that rule, and "per instrument" is one
        quantifier ordering among several. I NAME IT NOW SO THAT IF IT HAPPENS THE CLOSE CANNOT
        PRESENT IT AS A SURPRISE, AND SO THAT IF IT DOES NOT HAPPEN THAT IS ALSO INFORMATIVE.
      the_defence_i_have_built_and_its_limit: >-
        CTL-FORCE-PI is the defence: under the IDENTITY instrument the per-instrument forced set
        must EQUAL the six cells batch 3 excluded, which pins the new rule to the old one on the
        one case where the old rule is right. ITS LIMIT, STATED NOW: agreeing with the old rule
        on the honest instrument says nothing about whether the per-instrument reading is the
        RIGHT generalisation, only that it is A generalisation. The close must not read
        CTL-FORCE-PI passing as evidence that the quantifier is correct.

    Q-7:
      confidence: EXPLICIT UNCERTAINTY, RECORDED AS UNCERTAINTY
      claim: >-
        I DO NOT KNOW WHETHER "AN INDEPENDENT IMPLEMENTATION" IS ACHIEVABLE IN PRACTICE HERE,
        AND I WILL NOT BE ABLE TO PROVE IT EITHER WAY. My honest split is about 70/30 that the
        executor's non-reading of
        coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-7d9f92/constructions
        holds and is attestable BY MECHANISM -- a recorded traversal-root list and an absent
        path -- and 30 that the only thing available is an honest boolean no tool in this
        repository can check. THE CONTRACT IS WRITTEN SO THAT THE 30 CASE COSTS THIS BATCH A
        LABEL AND NOT A RESULT: the close records the replication as ATTESTED-INDEPENDENT rather
        than MECHANICALLY-INDEPENDENT and weights it accordingly.
      the_asymmetry_i_want_on_the_record: >-
        A MATCHING COUNT UNDER A MERELY ATTESTED INDEPENDENCE IS WEAK CORROBORATION; A
        DIFFERING COUNT UNDER THE SAME ATTESTATION IS STRONG, because contamination pushes
        toward agreement and not away from it. The close should weight the two outcomes
        differently and say so.

    Q-8:
      confidence: MODERATE, AND IT IS ABOUT INFRASTRUCTURE RATHER THAN MATHEMATICS
      claim: >-
        RUNNING THIS BATCH AS A LANE ON ITS OWN FRESH BRANCH WILL PREVENT THE CONTENT-BINDING
        DRIFT THAT CORR-20260826-f170d2 RECORDS, AND NO path_sha256 SUPERSESSION WILL BE NEEDED
        IN THIS BATCH.
      falsifier: >-
        Any bound path whose digest differs between the snapshot archive and the ledger archive,
        from any cause; or a claim collision resolved by epoch under tools/goal_lanes.py.
      why_it_matters_that_this_is_predicted: >-
        CORR-20260826-f170d2's `process_finding_for_the_program` states that content_first
        binding verifies declared digests AT HEAD and silently assumes no third party edits an
        archived artifact between archive and verification, and that the assumption does not
        hold on a shared branch. THIS BATCH IS THE MEASUREMENT THAT TURNS THAT ASSUMPTION INTO A
        FACT IN THE OTHER DIRECTION, and it costs nothing to take.

  # ==================================================================
  what_would_overturn_this_whole_prior_wholesale:
    the_trigger: >-
      BOTH ARMS RETURNING NULL: the re-admitted count comes back 0 under an implementation that
      passes CTL-FORCE-PI, AND the consistent-pair family is not constructible. That
      conjunction would mean this prior's whole structure -- one interesting edge, one
      re-admissible cell, one repairable family -- is not the structure of the object.
    what_i_will_do_if_it_fires_and_this_is_stated_in_advance_because_batch_3_taught_it: >-
      I AM NOT ASKING THE CLOSE TO SUSPEND SCORING, AND THE REASON IS THAT BATCH 3 TRIED THAT
      AND IT DID NOT WORK. Part 1 of the BATCH-145531 prior named exactly one wholesale trigger
      -- a second value-level dependency edge -- THE TRIGGER FIRED, three times over, and the
      part-2 addendum scored the items one by one anyway and declared the departure. A trigger
      that instructs a later session to abandon a structure it can still check is a trigger
      that will be disobeyed, and being disobeyed is worse than being narrow.
      SO THE INSTRUCTION IS CONCRETE AND SPLIT, AND IT IS WRITTEN TO BE HONOURED.
      (1) Q-1, Q-2, Q-3, Q-7 and Q-8 ARE SCORED INDIVIDUALLY IN EVERY CASE. They are about arm
      (a) and about process, each has its own falsifier, and each remains individually checkable
      whatever the other arm does.
      (2) IF THE TRIGGER FIRES, Q-4 AND Q-5 ARE RECORDED AS **REFUTED AND VOID RESPECTIVELY**:
      Q-4 refuted on its own falsifier, and Q-5 VOID rather than wrong, because its antecedent
      failed and an item whose antecedent failed has not been tested. VOID IS A DISTINCT VERDICT
      FROM WRONG AND FROM CONFIRMED and the close must use it rather than rounding to either.
      (3) IF THE TRIGGER FIRES, Q-6 IS RECORDED AS **CONFIRMED IN ITS STRONGEST FORM**, because
      both arms returning null on a design I specified is precisely the error mode Q-6 names,
      and the close should say so rather than treating a double null as an absence of findings.
      (4) AND THE HEADLINE IS NOT "THE PRIOR WAS WRONG". A double null RETIRES THE
      DIFFERING-CELL DESIGN HONESTLY AND CHEAPLY, which the goal head pre-registers as a RESULT
      in advance, and the close owes an obstruction block with a quantity rather than a
      confession.

  what_this_prior_deliberately_does_not_predict: >-
    NOTHING ABOUT MD5, SHA-1, ANY PUBLISHED CHARACTERISTIC, ANY DIFFERENCE SPACE, ANY NOVELTY
    STATUS, ANY COST OR ANY ATTACK COMPLEXITY. There is nothing here to predict about them,
    because this batch measures this program's own instrument. If a later reader finds a
    sentence in this file that reads as a prediction about a primitive, THAT SENTENCE IS A
    DEFECT and should be reported as one.

  provenance_of_every_integer_in_this_file: >-
