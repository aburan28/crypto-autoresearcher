  # =========================================================================
  # 3. UNRESOLVED CONFLICTS AND OPEN ITEMS FOR THE COORDINATOR
  # =========================================================================
  unresolved_conflicts:
    - id: C1
      severity: low
      kind: 'dispatch briefing prose vs retrieved primary text'
      detail: >-
        The dispatch briefing states "M-511 is a Montgomery curve introduced in the
        SafeCurves work itself". The retrieved SafeCurves index page attributes M-511 to
        "2013 Aranha-Barreto-Pereira-Ricardini (formerly named Curve511187)" -- i.e. to
