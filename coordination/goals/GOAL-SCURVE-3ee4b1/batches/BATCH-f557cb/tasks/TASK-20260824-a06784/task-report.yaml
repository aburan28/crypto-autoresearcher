      does_it_change_anything: >-
        No. The briefing's operational conclusion still holds for a different reason:
        SafeCurves is the sole retrieved source for the EVALUATION (all eleven cells and
        every derived integer), and the intake row is a verbatim transcription of that
        same table, so intake-vs-mirror agreement remains a transcription check only.
      blocks: nothing
    - id: C2
      severity: medium
      kind: 'source independence not established (single effective source)'
      detail: >-
        Every parameter and every derived integer in the capsule traces to one
        publisher. The designers' own document (ePrint 2013/647) is unretrieved: its
        pointer was confirmed by WebSearch, but WebFetch is unusable for digits in this
        environment (confirmed defect verified against raw RFC 7748 bytes) and this role
        has no Bash for curl.
      does_it_trigger_a_pause_condition: >-
        NO. The goal's pause_conditions trigger on "an unresolved CONFLICT in the named
        curve's parameter tuple". There is no conflict; there is a single source. This
        is recorded as a disclosed limitation, not a pause, and it CAPS what the goal's
        completion criterion 1 ("reconcile the exact parameter tuple to retrieved primary
        or authoritative sources") can honestly claim: it is met in the single-source
        sense only.
      blocks: 'any future claim that two independent sources agree on the M-511 tuple'
      successor: S1
    - id: C3
      severity: low
      kind: 'derived-text fidelity'
      detail: >-
        All digit strings in the capsule were read from pages/*.txt, which
        source_record.yaml records as FAITHFUL but also as DERIVED; the .html files are
        the binding authority. Every digit string in the capsule is therefore marked for
        Executor re-derivation from the corresponding .html.
      blocks: nothing
      successor: 'built into audit-plan.yaml lanes L1/L2/L3 as an explicit string-identity check'

  # =========================================================================
  # 4. HONEST-ACCOUNTING BLOCK (docs/inventor-protocol.md section 5)
  # =========================================================================
  honest_accounting:
    objects_considered:
      - object: 'the eleven-cell SafeCurves verdict vector v(E) plus its ~15 published intermediate integers'
        chosen: true
        genuinely_new_or_repackaging: >-
          Repackaging. This is the publisher's own object and the goal mandates it. Its
          value here is not novelty; it is that the program currently holds zero
          certified rows for it.
        concretely_testable: >-
          Yes for the integers -- one-step propagation is defined (class invariance of
          (p, ell, D, k) under F_p-isogeny, isomorphism invariance of
          (numorder2, numorder4)) and each is measurable with a short certificate.
        how_far_it_survives: >-
          The integers survive every model change and every F_p-isogeny; the verdict
          vector dissolves immediately under a change of published curve shape.
        lossy_projection_test: >-
          PASSES for the integers (an entire curve collapses to a handful of class
          invariants; nothing is recoverable). FAILS for three of the eleven cells --
          rigid is a function of the publisher's text, and ladder and ind are
          shape-determined (capsule PTA-6 shows the ladder predicate is identically True
          on every Montgomery curve). Those three are changes of coordinates on the
          input format, not lossy projections of the curve. This is stated in the plan
          BEFORE the measurement and NULL-B is designed to demonstrate it.
      - object: 'the deterministic generation transcript (p-selection rule, A-minimality rule, constraint set)'
        chosen: true
        genuinely_new_or_repackaging: >-
          New WITHIN THIS PROGRAM as an audited object, and not audited by the publisher
          either: pages/verify.txt shows saferigid is read from a literal file and
          string-compared. Known as an idea in the wider literature (the bada55 line of
          work interrogates exactly this), so no mathematical novelty is claimed.
        concretely_testable: >-
          Yes, and asymmetrically: the p-clause is COMPLETELY certifiable in ~120 s
          (186 compositeness witnesses), while the A-minimality clause is only boundable
          (~66,000 SEA runs at 511 bits).
        how_far_it_survives: >-
          Survives only as long as the recipe text is fixed. It says nothing about what
          the designers actually ran, which is the ceiling of the whole rigidity notion.
        lossy_projection_test: >-
          Passes. The transcript projects a 511-bit curve onto a small constraint tuple
          and a rank; almost everything is discarded, and what remains propagates
          deterministically under the search order the recipe defines.
      - object: 'the publisher''s relevant-proven-primes list as a checkable object rather than an input'
        chosen: true
        genuinely_new_or_repackaging: >-
          New within this program, and it is the plan's best single idea: because
          pages/verify.txt documents the list as recursively closed under q-1, it
          contains the factorizations of ell-1 and ell'-1, converting a 508-bit
          factorization that IDEA-20260807-98a970 predicted would be out of reach into a
          self-certifying reconstruction.
        concretely_testable: 'Yes -- a wrong list cannot satisfy the exact integer identity product == target, which is what makes it self-certifying rather than trusted.'
        how_far_it_survives: 'Survives exactly as far as H2 holds, and H2 is tested rather than assumed.'
        lossy_projection_test: 'Passes -- 251 integers standing in for six large-integer factorizations, with the discarded structure irrelevant to the identity check.'
      - object: 'a rho-cost / kangaroo-cost model over the group orders'
        chosen: false
        why_not: >-
          Considered and NOT elevated to its own lane beyond L4/L9/D2, because under H3
          and H4 it is arithmetic in a model, not a measurement. Elevating it would
          invite the dossier to phrase a formula evaluation as a security statement,
          which is precisely the failure mode the goal's claim_boundaries forbid.
      - object: 'an isogeny-class-level object (the F_p-isogeny class of E, tracked through horizontal/vertical isogenies)'
        chosen: false
        why_not: >-
          Genuinely interesting and NOT closed -- but out of this task's scope, which is
          a parameter audit. Recorded as an open direction (O3) rather than silently
          dropped. It is the object most likely to carry exponent-moving content in this
          neighbourhood, per the target result profile, and it deserves its own goal.

    dominated_by:
      as_an_attack: 'n/a (no result claimed) -- this task proposes no attack and moves no exponent, so no Pareto row applies.'
      as_an_audit_instrument: >-
        DOMINATED BY SafeCurves' own verify.sage (retrieved: staged mirror
        SAFECURVES-20260825, pages/verify.txt, sha256
        9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79), which produced
        every cell this plan reproduces, in 2013, with more compute than this program
        has, and with authority this program does not have. Checked against every
        alternative I could name on time, memory and data: the SafeCurves script
        dominates on all three for the eleven cells. This plan is NOT dominated on
        exactly three points, and only three: (1) PRE-1 checks the published prime list
        instead of consuming it; (2) D8a/D8b audit the rigidity recipe, which
        verify.sage explicitly does not (it string-compares a file); (3) NULL-B/NULL-C
        measure how much of the verdict vector is shape-determined rather than
        curve-determined, which no retrieved source reports.
      unchecked_rows: >-
        Sibling GOAL-SCURVE-* dossiers for other curves were NOT checked -- they are
        outside this task's authoritative read_scope. If any of them already built this
        harness, this plan is dominated by that too. Stated as unchecked rather than
        recorded as null.

    sota_delta:
      against_attack_baselines: 'ZERO on every axis -- time, memory, data/queries. No speedup is claimed against rho (0.886*sqrt(ell)), BSGS, or any transfer.'
      as_data_in_this_program: >-
        The corpus holds ZERO certified parameter values for M-511 today (grep of
        knowledge/literature/ for "SafeCurves|M-511" returned no content match). The plan
        would produce approximately: 15 certified integers, 251 Pocklington certificates,
        2 exact multiplicative-order certificates at 508 and 509 bits, 186 compositeness
        witnesses closing the p-selection clause completely, 1 exact surviving-candidate
        count over a 132,609-wide constraint search, and 4 null-control datasets. Every
        item re-verifiable by a third party in seconds.
      against_IDEA_20260807_98a970: >-
        That record predicts a mixed exact-and-bounded embedding-degree table and states
        that "a 521-bit factorisation is very likely out of reach here". PRE-1 proposes a
        concrete route to an EXACT k at 508 bits by retrieving rather than computing the
        factorization of ell-1. If PRE-1 closes, that is a measured improvement on a
        pre-registered shortfall in an existing program record, and it should be reported
        back against it.

    closures_enumerated:
      - closure: 'The SafeCurves rigidity CELL cannot be reproduced from curve parameters by any method.'
        mechanism: >-
          Not fatigue, not saturation: a named obstruction read off the source. In
          pages/verify.txt the variable saferigid is assigned by reading a literal file
          named "rigid" and testing string equality against "fully rigid" / "somewhat
          rigid". No curve datum enters. The cell is an editorial classification, so
          "reproducing" it is a string comparison and carries no information.
        forward_guidance: >-
          What remains open and IS testable is the recipe the classification rests on --
          moved to D8, where the p-clause is completely certifiable and the
          A-minimality clause is boundable. The class of remaining approaches is
          "transcript replay under a stated constraint set", and it is not closed.
      - closure: 'The SafeCurves ladder PREDICATE carries no M-511-specific information.'
        mechanism: >-
          Algebraic, and it costs no compute. For any Montgomery curve with B = 1 and
          p > 3, the short-Weierstrass image has a = (3 - A^2)/3 and r = A/3 is a root of
          z^3 + az + b with 3r^2 + a = A^2/3 + (3 - A^2)/3 = 1, a square. The predicate is
          therefore identically True on the whole input class. This is the lossy-projection
          test returning "not lossy", applied before any experiment, which is where it
          belongs.
        forward_guidance: >-
          The non-tautological content adjacent to this cell is the COFACTOR value and
          the untested prose requirements ("simple, fast, constant-time"), which
          verify.sage does not test at all. A constant-time / operation-count audit of an
          actual ladder implementation is an open, unclosed class. NULL-B is included
          specifically so this closure is DEMONSTRATED rather than asserted, and its
          falsifier (any Montgomery draw returning False) is live.
      - closure: 'The class number h(D) at |D| ~ 2^510.5 is not computable in this program.'
        mechanism: 'no algorithm in reach; stated as a resource obstruction, not a mathematical one.'
        forward_guidance: >-
          Replaced by named heuristic H1 with an explicit validation route (sample
          |D| in [2^40, 2^80], 10^3 draws, check concentration and the LOWER tail against
          the Brauer-Siegel/GRH prediction) and an explicit transfer assumption. The class
          of remaining approaches -- analytic class-number bounds, and Brainpool-style
          weaker class-number conditions that ARE checkable -- is open.
      - closure: 'Full replay of the A-minimality clause is out of budget in this environment.'
        mechanism: >-
          ~66,000 SEA point counts at 511 bits after the Jacobi filter, against a campaign
          total of 18,000 s and no CAS. A resource obstruction, disclosed in advance so a
          shortfall is not later reported as a finding.
        forward_guidance: >-
          Partial closure only. The cheap half (132,609 Jacobi symbols, seconds) IS run and
          yields an exact surviving-candidate count that bounds the remaining work
          precisely. Successor S2 escalates the expensive half with a staged K and a
          blocking M-221 positive control.
      premature_closure_check: >-
        No lane was declined on saturation grounds. The four closures above each name an
        obstruction, give the argument, and name what class remains. The count of
        mechanisms NOT pursued is deliberately small and each carries a reason.

    open_directions_for_next_session:
      - id: O1
        direction: >-
          Report PRE-1's outcome back against IDEA-20260807-98a970. If the
          recursively-closed-prime-list trick works, it generalises immediately to every
          SafeCurves curve and converts that record's predicted "mixed exact-and-bounded"
          table into a mostly-exact one at essentially zero cost. That is the highest
          leverage item in this whole plan and it is not curve-specific.
      - id: O2
        direction: >-
          Quantify how much of the eleven-cell vector is shape-determined, using NULL-B
          across all 20 published curves rather than just M-511. The deliverable is a
          measured statement of the form "k of 11 cells are constant across the input
          class", which would be a genuine, cheap, program-level finding about what a
          SafeCurves row can and cannot certify -- and no retrieved source reports it.
      - id: O3
        direction: >-
          The F_p-isogeny class of E as a tracked object. Out of scope for a parameter
          audit, explicitly NOT closed, and the object in this neighbourhood most likely
          to carry exponent-moving content under docs/target-result-profile.md. Note that
          (p, ell, D, k) are class invariants, so an isogeny walk cannot change any
          ECDLP-relevant cell -- which is exactly why the interesting question is what a
          walk CAN change, and that has not been asked here.
      - id: O4
        direction: >-
          KN-OPEN-019 (no written object-enumeration for the ECDLP) remains open and is
          untouched by this task. Any family-to-object mapping used above is a sketch, not
          a taxonomy, and this report does not pretend otherwise.
      - id: O5
        direction: >-
          A literature note for knowledge/literature/ on the staged SafeCurves corpus --
          specifically the verify.sage semantics (which cells are computed, which are
          read from files, which are tautological on their input class). This task did not
          write one, because knowledge/ is outside its write_scope. Recommended as a
          curate-knowledge item once an Executor has confirmed the semantics empirically.

  # =========================================================================
  # 5. PROPOSED SUCCESSOR HANDOFFS (Coordinator decides; this proposes only)
  # =========================================================================
  successor_handoffs:
    - id: S1
      title: 'Stage the designers'' primary source for M-511'
      role: 'a role or session with Bash/curl (this role has neither)'
      objective: >-
        Retrieve https://eprint.iacr.org/2013/647 with curl, stage it under inputs/ with
        a sha256 and a source record in the same form as SAFECURVES-20260825, and
        reconcile the M-511 tuple against it.
      why: 'the only route to resolving C2 and converting the single-source condition into a genuine two-source reconciliation'
      priority: high
      cost: 'minutes'
    - id: S2
      title: 'CAS-backed escalation of the A-minimality replay (D8b clause ii)'
      role: executor
      objective: >-
        With Sage or PARI/GP available, replay the M-221 positive control to exhaustion
        (must reproduce A = 117050) and then extend the M-511 search to a declared K,
        staging at K = 1000. Deliverable is the BOUND with its K, never a minimality claim.
      blocking_precondition: 'the M-221 control must reproduce 117050, or nothing else in this successor means anything'
      priority: medium
      cost: 'hours to days depending on K'
    - id: S3
      title: 'Deduplicate the audit harness across sibling GOAL-SCURVE-* goals'
      role: coordinator
      objective: >-
        At least 21 RQ-SCURVE-* records exist. This task could not read them (read_scope).
        Before dispatching the plan, check whether an equivalent harness already exists for
        another curve and reuse it rather than rebuilding, and correct this report's
        novelty label if so.
      priority: high
      cost: 'minutes'

  # =========================================================================
  # 6. LIMITATIONS OF THIS TASK ITSELF
  # =========================================================================
  limitations:
    - 'This is a planning artifact. Nothing in it was executed and nothing in it is evidence.'
    - >-
      The six PTA hand-arithmetic checks in the capsule are producer arithmetic, not run
      records. They are recorded because they are cheap to redo and because they tell the
      Coordinator which lanes are likely to pass; if a recomputation disagrees, the
      recomputation is authoritative and the PTA item is a producer error.
    - >-
      The staged mirror was read, not fetched, by this role. The label "retrieved (staged
      mirror SAFECURVES-20260825)" is used everywhere and is not upgraded to "retrieved".
    - >-
      Digit strings were read from derived .txt files; the .html files are the binding
      authority and Executor re-derivation is built into lanes L1/L2/L3.
    - >-
      Sibling curve goals were not read (read_scope), so methodological duplication across
      the campaign is likely and is labelled `unverified` on that axis rather than
      claimed absent.
    - >-
      Every heuristic in the plan is named (H1 GRH class number, H2 prime-list
      completeness, H3 rho cost model, H4 combined-attack cost model) with a validation
      route, a sampled scale, and an explicit transfer assumption. H3 and H4 in particular
      mean that the rho and combined-attack figures are MODEL OUTPUTS; reproducing them
      reproduces arithmetic and not an attack, and no attack at cryptographic scale is
      run or proposed anywhere.
    - >-
      Infrastructure errors, timeouts and budget stops encountered by any successor are
      operational observations and are never negative mathematical evidence and never a
      False cell.
