audit_plan:
  task_id: TASK-20260824-a06784
  goal_id: GOAL-SCURVE-3ee4b1
  question_id: RQ-SCURVE-5a64f4
  batch_id: BATCH-f557cb
  role: idea-generator
  produced_at: '2026-08-25'
  curve: M-511
  companion_artifact: ./parameter-capsule.yaml
  status: proposed
  authority_note: >-
    This is a PLAN. It approves nothing, assigns nothing, and moves no hypothesis.
    Only the Coordinator may approve any lane below or dispatch it to the Executor.

  inference:
    requested_policy: research-deep
    answered_by_model: claude-opus-5
    fallback_used: false
    degraded: false

  # =========================================================================
  # 0. FRAMING: WHAT OBJECT IS BEING TRACKED, AND IS THE PROJECTION LOSSY
  # =========================================================================
  object_first_framing:
    tracked_object: >-
      THE ELEVEN-CELL SAFECURVES VERDICT VECTOR v(E) in {True, False, Unverified}^11,
      together with the ~15 published intermediate integers (p, A, B, x1, y1, ell, h,
      t, D, k, ell', h', k', numorder2, numorder4) from which pages/verify.txt derives
      it.
    lossy_projection_test:
      is_it_lossy: >-
        YES, and destructively so. An entire 511-bit curve, its base point and its
        generation history collapse to eleven booleans. Nothing about the curve is
        recoverable from v(E): pages/index.txt already exhibits five distinct curves
        (M-221, E-222, Curve1174, Curve25519, M-383, ...) with the identical all-True
        vector over completely different fields and shapes. The verdict vector is a
        coarse quantisation of threshold comparisons, exactly as
        IDEA-20260807-98a970's observation-collision analysis records for its own
        AFFECTED/SAFE column.
      is_what_is_discarded_discarded_compatibly: >-
        PARTIALLY, AND THE PARTS DIFFER -- this is the finding that shapes the whole
        plan. The intermediate integers propagate deterministically and compatibly:
        (p, ell) are invariant under F_p-isogeny, D and k are class invariants, and
        the pair (numorder2, numorder4) is an isomorphism invariant. But three of the
        eleven cells do not propagate from the curve at all:
          * rigid  -- pages/verify.txt reads it from a literal file and string-compares
            it. It is a function of the PUBLISHER'S TEXT, not of E.
          * ladder -- by PTA-6 in the capsule, the predicate is identically True on
            every Montgomery curve. It is a function of the SHAPE THE CURVE WAS HANDED
            IN, not of E's isomorphism class.
          * ind    -- the predicate is "#E even and b != 0", which is implied by the
            Montgomery shape plus the elliptic condition. Also near-shape-determined.
        CONSEQUENCE, PRE-REGISTERED: three of the eleven cells are NOT lossy
        projections of the curve; they are changes of coordinates on the input format
        or on the publisher's prose. Reproducing them is a consistency check on the
        published table, not a measurement of M-511. Lanes L7, L8 and L11 say so in
        their own honest_limitation fields, and the null control NULL-B is designed to
        DEMONSTRATE this rather than assert it.
    survival: >-
      The intermediate integers survive every model change and every F_p-isogeny and
      dissolve only when the base field or the subgroup changes. The verdict vector
      dissolves immediately: it does not survive a change of published curve shape
      (ladder/ind/complete flip on the identical isomorphism class presented in short
      Weierstrass form). That asymmetry is measurable and NULL-B measures it.

  # =========================================================================
  # 1. CONTROLS. DEFINED BEFORE ANY INTERPRETATION. BLOCKING.
  # =========================================================================
  controls:
    blocking_rule: >-
      NO LANE RESULT MAY BE INTERPRETED, AND NO EVIDENCE RECORD MAY CITE ONE, UNTIL
      THE CONTROLS ATTACHED TO THAT LANE HAVE RUN AND PASSED IN THE SAME SESSION,
      THROUGH THE SAME CODE PATH, ON THE SAME BUILD. A measurement instrument that
      has never been shown to fire cannot certify a negative. If a positive control
      fails, every result from that lane is VOID and nothing is reported -- that is
      an instrument failure under AGENTS.md rule 5, not a mathematical finding.

    positive:
      - id: POS-1
        object: 'SafeCurves "Anomalous" curve'
        parameters_source: >-
          retrieved (staged mirror SAFECURVES-20260825): p and equation from
          pages/field.txt + pages/equation.txt, base point from pages/base.txt,
          ell from pages/base.txt, t = 1 from pages/disc.txt, D = -11 from
          pages/disc.txt.
        must_fire_on: 'L5 additive transfer (ell == p), L6 small |D| (11 < 2^100), L8 ladder False, L10 numorder2 == 0, L11 ind False'
        why_this_one: >-
          The goal record names it as a positive-control CANDIDATE for additive
          transfer and small discriminant. Per the goal's own claim_boundaries it is
          NOT a newly discovered attack and its parameters still require sourced
          reproduction -- which is why its parameters are cited above rather than
          recalled.
      - id: POS-2
        object: 'BN(2,254)'
        parameters_source: 'retrieved (staged mirror SAFECURVES-20260825), pages/field.txt, pages/equation.txt, pages/base.txt, pages/disc.txt, pages/transfer.txt'
        must_fire_on: 'L5 multiplicative transfer -- the pipeline must return embedding degree exactly 12 -- and L6 small |D| (D = -3)'
        why_this_one: >-
          It is the only retrieved curve with a small exact embedding degree. If the
          embedding-degree code cannot return 12 here it cannot certify anything about
          M-511. Same claim boundary as POS-1.
      - id: POS-3
        object: 'secp256k1'
        parameters_source: 'retrieved (staged mirror SAFECURVES-20260825), pages/field.txt, pages/equation.txt, pages/base.txt, pages/disc.txt'
        must_fire_on: 'L6 small |D| (D = -3) while L5 transfer stays True -- separates the disc detector from the transfer detector'
      - id: POS-4
        object: 'synthetic toy curves, generated in-session, per IDEA-20260807-98a970 null_object_control'
        set:
          - 'toy curve with p == 1 mod ell: embedding degree must be returned as exactly 1'
          - 'toy supersingular curve with t == 0: embedding degree must be returned as exactly 2'
          - 'toy BN-shaped curve with k == 12'
        why: >-
          These are cheap, exact, and they exercise the degenerate branches that no
          retrieved curve exercises. Reused from IDEA-20260807-98a970 rather than
          re-invented.

    negative_parameter_matched:
      - id: NEG-1
        object: 'M-383'
        parameters_source: 'retrieved (staged mirror SAFECURVES-20260825), pages/field.txt (p = 2^383-187), pages/equation.txt (A = 2065150, B = 1), pages/base.txt, pages/ladder.txt (cofactor 2^3), pages/disc.txt, pages/transfer.txt, pages/twist.txt'
        matching_assumptions_stated_explicitly:
          - 'same designers and same 2013 publication family as M-511'
          - 'same Montgomery shape with B = 1'
          - 'same prime shape 2^n - 187'
          - 'same cofactor 2^3'
          - 'same published rigidity recipe modulo the exponent and the 5 mod 8 clause'
          - 'DIFFERENT: field size (383 vs 511 bits), A, base point, twist cofactor'
        expected: 'every trigger detector (additive transfer, multiplicative transfer, small |D|, small ell, twist weakness) must NOT fire, exactly as for M-511'
        role: >-
          This is the tightest parameter match available from a retrieved source. A
          detector that fires on M-383 is miscalibrated; a detector that fires on
          M-511 but not M-383 must have a stated reason in the M-511 parameters, or
          the result is void.
      - id: NEG-2
        object: 'Curve383187'
        parameters_source: 'retrieved (staged mirror SAFECURVES-20260825), same pages'
        why_this_one: >-
          Curve383187 has the IDENTICAL p to M-383 (2^383-187) and a different A
          (229969 vs 2065150). It is the only retrieved pair that isolates the effect
          of A at fixed p. Any lane whose output differs between them is measuring A;
          any lane whose output agrees is measuring p or the shape. This is the
          cheapest available discriminator between "the audit measures the trace" and
          "the audit measures the prime" (cf. IDEA-20260807-98a970 nearby_object_control).
      - id: NEG-3
        object: 'Curve25519'
        parameters_source: 'retrieved (staged mirror SAFECURVES-20260825)'
        role: 'second all-True Montgomery B=1 cofactor-8 curve; guards against a defect specific to the 2^n-187 prime family'

    null_same_shape:
      - id: NULL-A
        name: 'corrupted prime list'
        construction: >-
          Take the M-511 relevant-proven-primes list from pages/primeproofs.txt and
          produce three same-shape corruptions: (i) delete one interior prime,
          (ii) replace one interior prime by the next prime above it, (iii) permute the
          list order. Run PRE-1 and every lane that consumes the list on each.
        prediction: 'PRE-1 reconstruction must FAIL on (i) and (ii) and must SUCCEED unchanged on (iii)'
        blocking_consequence: >-
          If a reconstruction succeeds on (i) or (ii), the reconstruction has no
          resolving power and every certificate downstream of it is void. If (iii)
          changes any output, the code is order-dependent and is buggy.
      - id: NULL-B
        name: 'random same-shape Montgomery curve over the same p'
        construction: >-
          Fix p = 2^511-187 and B = 1. Draw A uniformly from the A in [3, 2^40] with
          A^2 - 4 a non-square mod p, for 32 independent draws. Run all eleven cells
          and every diagnostic on each, with NO point counting where point counting is
          out of budget (mark those cells Unverified rather than guessing).
        prediction_preregistered: >-
          field, equation, ladder, complete(numorder2 == 1 part) and ind will return
          the IDENTICAL values as for M-511 on all 32 draws, because by the
          lossy-projection analysis they are shape-determined, not curve-determined.
          rho, transfer, disc, twist and the cofactor will vary across draws.
        what_each_outcome_means: >-
          If the prediction holds, it is a measured demonstration that 5 of the 11
          cells carry no M-511-specific information, which bounds what the whole
          dossier can claim. If instead ladder or ind varies across draws, PTA-6 in
          the capsule is WRONG and this plan's central structural claim is falsified
          -- report that immediately, it is the more interesting outcome.
      - id: NULL-C
        name: 'trace-shuffled null'
        construction: >-
          Keep p and A. Replace ell by a uniformly random prime in
          [2^508, 2^508 + 2^253] and recompute t, D, k and every threshold comparison
          exactly as the pipeline does, WITHOUT asserting that any curve has that
          order.
        prediction: >-
          The disc, transfer and twist lanes must produce different values; the
          |D| > 2^100 and k >= (ell-1)/100 comparisons must still pass with
          overwhelming probability (a random large D and a random-order p are the
          generic case).
        what_it_means: >-
          Measures how much of the M-511 disc/transfer result is genericity rather
          than design. A pipeline that returns the M-511 values on a shuffled ell is
          reading a cached table instead of computing.
      - id: NULL-D
        name: 'arithmetic null for multiplicative order'
        construction: 'random 511-bit prime N, random base g; measure ord_N(g)'
        prediction: 'the distribution of (N-1)/ord_N(g) matches the classical distribution of the index of a random element; specifically (N-1)/ord is 1, 2 or 3 for a large fraction of draws'
        role: 'tells us whether M-511 having index exactly 3 is remarkable or entirely generic. Preregistered expectation: entirely generic.'

  # =========================================================================
  # 2. NAMED HEURISTIC ASSUMPTIONS
  # =========================================================================
  heuristic_assumptions:
    - id: H1
      name: 'GRH class-number heuristic for the CM order'
      formal_statement: >-
        For the CM field discriminant D with |D| ~ 2^510.5, the class number h(D)
        satisfies h(D) = |D|^{1/2 + o(1)}; under GRH, h(D) >> |D|^{1/2} / log|D| up to
        an effective constant (Siegel / Littlewood-type bound). Consequently
        h(D) > 10^6 (the Brainpool criterion) by an astronomical margin.
      classical_theorem_it_imitates: >-
        The Brauer-Siegel theorem for imaginary quadratic fields and its GRH-effective
        Littlewood form; pages/disc.txt states the same relation in prose ("GRH ...
        implies that the class number is not far from the square root of |D|").
      why_needed: 'no algorithm in reach computes h(D) at |D| ~ 2^510'
      experimental_validation_route: >-
        Sample discriminants at a scale where h(D) IS computable -- |D| in
        [2^40, 2^80], 10^3 draws, computed with a class-group routine -- and check
        that log h(D) / log sqrt(|D|) concentrates around 1 with the predicted
        log-factor spread, including the LOWER tail (the tail is the whole point: the
        claim is a lower bound). Then state the transfer assumption explicitly: the
        extrapolation from 2^80 to 2^510 is an extrapolation, not a measurement, and
        the dossier says so.
      what_falsifies_it_at_the_tested_scale: 'a sampled |D| in range with h(D) below the GRH-effective lower bound'
    - id: H2
      name: 'completeness of the published relevant-primes list'
      formal_statement: >-
        The 251 integers listed for M-511 in pages/primeproofs.txt contain every prime
        divisor of p, of p+1-t, of p+1+t, of t^2-4p, and recursively of q-1 for each
        listed prime q.
      why_needed: 'it is what makes the exact embedding-degree certificate reachable at 508 bits'
      status: 'SELF-CERTIFYING, not assumed -- PRE-1 verifies it by exact integer identity, so H2 is a hypothesis this plan TESTS rather than grants'
      experimental_validation_route: 'PRE-1 below; failure downgrades every dependent lane to its bound-only fallback rather than voiding it'
    - id: H3
      name: 'rho cost model'
      formal_statement: >-
        The expected number of group operations to solve ECDLP in a cyclic group of
        prime order ell by the negating parallel rho method is 0.886*sqrt(ell), with
        no bottleneck other than the additions, and the only automorphism-derived
        speedup available on a curve with j not in {0, 1728} is the sqrt(2) negation
        factor.
      classical_source: 'pages/rho.txt (staged mirror) and its cited 1998 Wiener-Zuccherato / 1999 Duursma-Gaudry-Morain lineage'
      why_needed: 'the entire rho and twist-rho lanes report a MODEL value, not a measurement'
      experimental_validation_route: >-
        Run the identical rho implementation on toy curves with ell in [2^24, 2^40],
        200 trials each, and check the empirical mean operation count against
        0.886*sqrt(ell) with the predicted sqrt-pi/4 constant and the predicted
        variance. Then state the transfer assumption: extrapolation to ell ~ 2^508 is
        an extrapolation. NO ATTACK AT CRYPTOGRAPHIC SCALE IS RUN OR PROPOSED.
    - id: H4
      name: 'SafeCurves combined-attack cost model'
      formal_statement: >-
        The greedy loop in pages/verify.txt (admit prime v when
        v + sqrt(pi4*joint/v) < sqrt(pi4*joint); report log2(precomp + sqrt(pi4*joint)))
        upper-bounds the real cost of the best combined small-subgroup + invalid-curve
        + kangaroo attack, under its own stated assumptions: the group is cyclic, every
        prime power in h and h' is usable, and kangaroo is as efficient as rho.
      why_needed: 'the 2^252.3 cell is produced by this model and nothing else'
      experimental_validation_route: >-
        Reimplement the loop independently from the published pseudocode and compare
        on all 20 curves in the table; agreement on 20/20 validates the
        reimplementation, disagreement on any row is a defect to localise before
        M-511 is interpreted.
      honest_limitation: 'reproducing 2^252.3 reproduces arithmetic in a model. It is not an attack cost measurement and must never be reported as one.'

  # =========================================================================
  # 3. PREREQUISITE LANE
  # =========================================================================
  prerequisite_lanes:

    - id: PRE-1
      title: 'Reconstruct and certify the four factorizations from the published prime list'
      why_first: >-
        Six downstream lanes (L1, L3, L5, L6, L9, D1, D4) each need a factorization of
        a 508-to-511-bit integer. IDEA-20260807-98a970 recorded, in advance and
        honestly, that a 521-bit factorization is very likely out of reach in this
        environment and that the honest output there is a mixed exact-and-bounded
        table. THIS LANE IS THE ESCAPE FROM THAT BOTTLENECK, and it is the single
        most valuable idea in this plan: pages/verify.txt documents that the published
        prime list is recursively closed under q-1, so the factorizations of ell-1 and
        ell'-1 are RETRIEVED rather than computed. The lane does not trust the list --
        it verifies it by exact integer identity, which a wrong list cannot survive.
      mechanism: >-
        (1) Read the 251 integers from pages/primeproofs.txt lines 3096-3346.
        (2) Prove each prime by Pocklington using only smaller already-proven members
            of the list, reproducing the chain construction shown in pages/verify.txt.
            Emit one certificate per prime: the base b, b^(n-1) mod n = 1, the divisors
            of n-1 used with their unit witnesses b^((n-1)/v) - 1, and the check
            F^2 > n where F is the proven divisor product.
        (3) Trial-divide each of p, p+1-t, p+1+t, t^2-4p, ell-1, ell'-1 by the listed
            primes only, and require the residual quotient to be exactly 1.
      certificate: >-
        Per integer: the multiset of prime factors with multiplicities, plus the exact
        equality product == target checked in exact integer arithmetic, plus a
        Pocklington certificate per factor. Third-party verification is
        sum-of-omega modular exponentiations, i.e. seconds.
      quantitative_prediction: >-
        All six residual quotients equal exactly 1; every one of the 251 integers
        receives a Pocklington certificate; total certificate set under 1 MB.
      falsifier: >-
        Any residual quotient != 1, or any listed integer that fails primality, or any
        prime for which no Pocklington chain closes within the list. ANY of these
        falsifies H2 and downgrades L5 and L9 to bound-only, and is itself a reportable
        defect in the published table (not a statement about the curve).
      controls: 'NULL-A (blocking, all three corruptions), NEG-1 and NEG-2 (the same reconstruction must close for M-383 and Curve383187)'
      budget: '900 s wall clock, 2 GB'
      stopping_rule: >-
        Stop at 900 s or when all six identities close, whichever first. If some close
        and some do not, report exactly which, with the residual quotient; a partial
        result is a real result here.
      honest_limitation: >-
        This lane certifies that the published list is arithmetically consistent with
        the published parameters. It does NOT independently discover the factorizations
        and it inherits the publisher's choice of which integers to factor. That
        dependency is disclosed and is why H2 is named.

  # =========================================================================
  # 4. THE ELEVEN CRITERION LANES
  # =========================================================================
  criterion_lanes:

    # ---- category: basic parameter requirements ----
    - id: L1
      criterion: field
      category: basic_parameter_requirements
      comparison_target: 'True (intake, user_supplied_unverified) / "p prime? True" (pages/field.txt)'
      mechanism: >-
        Recompute p from the sparse form 2^511 - 187 and check it equals both the
        decimal and the hex string in pages/field.txt, byte for byte after
        normalisation. Then prove p prime by Pocklington using the factors of p-1 from
        PRE-1. Confirm the field is prime (not an extension) trivially from the
        specification.
      certificate: 'Pocklington certificate for p; plus the exact identity 2^511 - 187 == decimal == int(hex, 16)'
      explicit_bound_fallback: >-
        If PRE-1 does not supply enough of p-1, report BPSW plus 64 independent
        Miller-Rabin rounds and label it PROBABLE PRIME WITH NO CERTIFICATE. State the
        residual error bound honestly; do not call it a proof.
      quantitative_prediction: 'three-way string identity exact; Pocklington closes; F^2 > p'
      falsifier: 'any string mismatch, or a Miller-Rabin composite witness for p'
      controls: 'POS-1/POS-2/POS-3 primes must also certify; NULL-A must break the certificate'
      budget: '120 s'
      stopping_rule: 'stop on first mismatch and report it'
      honest_limitation: 'A prime p says nothing about ECDLP hardness. This lane confirms a parameter, not a security property.'

    - id: L2
      criterion: equation
      category: basic_parameter_requirements
      comparison_target: 'True (intake) / "Elliptic? True, Result 281364471840" (pages/equation.txt)'
      mechanism: 'compute B*(A^2 - 4) mod p with A = 530438, B = 1, in exact integer arithmetic and reduced mod p'
      certificate: >-
        The exact integer 281364471840 together with the two inequalities
        0 < 281364471840 < p, which prove nonzero in F_p without any modular reduction
        at all. Verifiable by hand.
      quantitative_prediction: 'exactly 281364471840, matching pages/equation.txt digit for digit'
      falsifier: 'any other value, or zero'
      controls: 'NEG-1/NEG-2 must reproduce their own published Result cells (4264844522496 and 52885740957 respectively); a pipeline that returns 281364471840 for M-383 is reading a cache'
      budget: '5 s'
      stopping_rule: 'single computation, no iteration'
      honest_limitation: >-
        This is the cheapest and most complete cell in the entire dossier: it is fully
        decided by 20 digits of arithmetic. It is also the least informative.

    - id: L3
      criterion: base
      category: basic_parameter_requirements
      comparison_target: 'True (intake) / "(x1,y1) on curve? True", "l prime? True", "l(x1,y1) = 0? True" (pages/base.txt)'
      mechanism: >-
        (a) evaluate y1^2 - x1^3 - A*x1^2 - x1 mod p with x1 = 5 and the published y1;
        (b) Pocklington-certify ell from PRE-1; (c) compute ell*(x1,y1) by an
        independent scalar multiplication in short Weierstrass affine coordinates AND
        by a Montgomery ladder, and require both to return the identity;
        (d) check ell*(x1,y1) = 0 is not vacuous by also computing (ell/q)*(x1,y1) != 0
        -- but ell is prime, so instead verify (x1,y1) != 0 and h*(x0,y0) relations
        where a full-curve generator is available.
      certificate: >-
        (a) the exact residue 0; (b) Pocklington chain; (c) the two independent scalar
        multiplication transcripts agreeing, plus the intermediate point at
        floor(ell/2) so a third party can re-verify a doubling-chain suffix cheaply.
      quantitative_prediction: 'residue exactly 0; both scalar multiplications return the point at infinity; agreement 2/2'
      falsifier: >-
        nonzero residue (transcription error -- the row becomes UNRESOLVED and must NOT
        be silently corrected), or the two implementations disagreeing (instrument
        failure, lane void)
      controls: 'POS-1 base point on the Anomalous curve must verify; a deliberately perturbed y1 (last digit +1) must FAIL -- a same-shape null that is blocking'
      budget: '120 s'
      stopping_rule: 'stop after both implementations report'
      honest_limitation: 'Confirms the published base point is a point of order ell. Says nothing about whether ell*(x1,y1) = 0 is hard to invert.'

    # ---- category: ECDLP security requirements ----
    - id: L4
      criterion: rho
      category: ecdlp_security_requirements
      comparison_target: '2^253.8, "Cost for rho above 2^100? True" (pages/rho.txt)'
      mechanism: >-
        Evaluate log(pi4*ell)/log(4) with pi4 = 0.78539816339744830961566084581987572105
        exactly as pages/verify.txt does, in arbitrary-precision arithmetic with at
        least 50 digits, and round to one decimal.
      certificate: >-
        The 50-digit intermediate and the rounded value; a third party re-derives it in
        microseconds. Plus the exact integer inequality ell > 2^200 (the SafeCurves
        threshold stated on pages/rho.txt), which needs no floating point at all.
      quantitative_prediction: 'the rounded value is exactly 253.8; |computed - 253.8| < 0.05'
      falsifier: 'a rounded value other than 253.8, or ell <= 2^200'
      controls: 'the same formula must reproduce all 20 published rho cells (2^101.6 for Anomalous through 2^259.3 for E-521); 20/20 required, 19/20 voids the lane'
      budget: '30 s'
      stopping_rule: 'single evaluation over all 20 curves'
      honest_limitation: >-
        UNDER H3 THIS IS A MODEL, NOT A MEASUREMENT. Nothing is attacked. "2^253.8" is
        the value of a formula, and the lane reproduces arithmetic. The dossier must
        not phrase this as "M-511 resists rho".

    - id: L5
      criterion: transfer
      category: ecdlp_security_requirements
      comparison_target: 'additive True, multiplicative True, embedding degree (l-1)/3 (pages/transfer.txt)'
      reuses: 'IDEA-20260807-98a970 -- this lane is a SPECIALISATION of that proposal to one curve, not a duplicate mechanism. It adopts that record''s EXACT-k and LOWER-BOUND certificate formats, its three degenerate flags, and its representability-wall argument verbatim.'
      mechanism: >-
        (1) Degenerate flags, three modular reductions, microseconds:
            is ell == p (additive transfer / anomalous)?  is p == 1 mod ell (k = 1)?
            does ell divide the cofactor 8, i.e. is ell^2 | #E (full rational
            ell-torsion)?
        (2) EXACT-k: using the factorization of ell-1 from PRE-1, compute
            d = ord_ell(p) by the standard order algorithm, dividing out prime powers
            with one modular exponentiation per prime factor. Emit the chain of
            witnesses.
        (3) Compare against the SafeCurves requirement k >= (ell-1)/100, i.e. the
            script's test (ell-1)/d <= 100.
        (4) FALLBACK if PRE-1 fails: the LOWER-BOUND certificate of
            IDEA-20260807-98a970 -- p^j != 1 mod ell for all j <= K with K = 10^6 --
            plus the honest statement that this certifies k > 10^6 but CANNOT certify
            k >= (ell-1)/100, so the cell would remain Unverified rather than True.
      certificate: 'the exact-k witness chain (omega(ell-1) modular exponentiations to re-verify) or the K-multiplication lower bound, whichever route was taken, with the route recorded per the record'
      quantitative_prediction: >-
        ell != p (they differ in bit length: ell ~ 2^508, p ~ 2^511); p != 1 mod ell;
        ell does not divide 8; (ell-1)/d == exactly 3; d equals the 153-digit integer
        published in pages/transfer.txt digit for digit.
      falsifier: >-
        (ell-1)/d > 100 would falsify the published True cell. (ell-1)/d != 3 with
        d still large would falsify the published VALUE while leaving the cell True --
        a transcription or methodology discrepancy, reportable as such. Any degenerate
        flag firing would be a material finding requiring immediate escalation to
        independent review before any statement leaves this repository, per
        IDEA-20260807-98a970's pre-commitment.
      controls: 'POS-2 must return exactly 12; POS-4 toys must return exactly 1 and exactly 2; POS-1 must fire the additive flag; NEG-1/NEG-2 must return their published (l-1)/1 and (l-1)/15; NULL-D calibrates whether index 3 is generic'
      budget: '600 s (dominated by omega(ell-1) exponentiations at 508 bits)'
      stopping_rule: 'stop at 600 s; if the exact route has not closed, emit the K = 10^6 bound and label the cell Unverified'
      honest_limitation: >-
        A large k is scoped to the pairing transfer only. It says nothing about rho,
        index calculus over F_p, implementation attacks, or anything else. The
        lower-bound certificate is NOT succinct: verifying k > K genuinely costs K
        multiplications, and the record must say so rather than pretending otherwise.
      target_complexity:
        time: 'audit cost omega(ell-1) modular exponentiations at 508 bits, i.e. a few dozen; NO ATTACK EXPONENT CLAIMED'
        memory: 'O(log p)'
        representability_wall: 'one element of F_{p^k} needs k*ceil(log2 p) ~ 2^508 * 511 bits, which is beyond any conceivable storage independently of any index-calculus cost -- the NFS-constant-free form of the obstruction, taken from IDEA-20260807-98a970 step 5'

    - id: L6
      criterion: disc
      category: ecdlp_security_requirements
      comparison_target: 't = -857980...496530, D ~ -2^510.5, "|D| above 2^100? True" (pages/disc.txt)'
      mechanism: >-
        (1) Recover t two independent ways and require agreement: (i) the SafeCurves
            route t = p + 1 - ell*round((p+1)/ell), whose validity condition
            ell^2 > 16p must be checked explicitly (ell^2 ~ 2^1016, 16p ~ 2^515, so it
            holds by a margin of ~500 bits); (ii) directly as t = p + 1 - 8*ell using
            the cofactor from L8/D1.
        (2) Compute t^2 - 4p exactly; strip square factors using ONLY the primes from
            PRE-1; require the squarefree residual to be a product of listed primes;
            apply the mod-4 rule to get D.
        (3) Check |D| > 2^100 as an exact integer inequality.
      certificate: 'the exact t, the exact D, the full factorization of D with Pocklington certificates from PRE-1, and the exact inequality; all re-verifiable by integer multiplication'
      quantitative_prediction: >-
        Both routes give the identical t, equal to the published value; D equals the
        published 154-digit value with the published factorization; log2|D| rounds to
        510.5. Planning arithmetic PTA-4 in the capsule already checks the
        8*ell + 186 = |t| identity by hand and it closes -- the Executor must
        recompute it, not cite it.
      falsifier: >-
        the two t routes disagreeing (methodology defect); a square factor of t^2-4p
        not covered by the list (falsifies H2 for this integer, cell becomes
        Unverified, exactly as the SafeCurves script itself would report); |D| <= 2^100
        (would falsify the published True cell)
      controls: 'POS-1 must return D = -11 and fire; POS-2 and POS-3 must return D = -3 and fire; NEG-1 must return its published -2^383.0; NULL-C must move the value'
      budget: '300 s'
      stopping_rule: 'stop at 300 s or when both routes agree and D is fully factored'
      honest_limitation: >-
        pages/disc.txt itself says small |D| is only "slightly" a break and that there
        is no evidence of serious problems with either small or large |D|. A large |D|
        here removes a known rho speedup family; it is not a hardness proof.

    # ---- category: ECC security beyond ECDLP ----
    - id: L7
      criterion: rigid
      category: ecc_security_beyond_ecdlp
      comparison_target: '"fully rigid" (pages/rigid.txt)'
      mechanism_and_the_problem_with_it: >-
        pages/verify.txt line-for-line: saferigid is set by reading a literal file
        named "rigid" and testing whether its contents equal "fully rigid" or
        "somewhat rigid". NOTHING IS COMPUTED FROM THE CURVE. The published cell is an
        editorial classification. There is therefore no way to "reproduce" this cell
        that means anything, and a lane that reported "we reproduced rigid = True"
        would be reporting that we can compare two strings.
      what_this_lane_actually_does: >-
        Audit the RECIPE the classification rests on, which pages/rigid.txt states
        explicitly for M-511 (quoted verbatim in the capsule). That is executable, and
        it is moved into diagnostic D8 where it belongs. L7's own output is the
        adjudication: the cell is reproduced as a string comparison, marked
        NOT-MACHINE-CHECKABLE-FROM-PARAMETERS, and pointed at D8.
      certificate: 'the verbatim recipe string with its file sha256, plus D8''s result'
      explicit_bound: 'D8a gives a complete certificate for the prime clause; D8b gives an explicit search bound K for the minimality clause and nothing stronger'
      quantitative_prediction: 'D8a: all 23 (weak reading) or all 186 (strong reading) smaller candidates composite. D8b: no counterexample below the achieved bound K.'
      falsifier: >-
        a prime 2^511 - m with m < 187 (and m == 3 mod 8 for the weak reading), or an
        A'>2 with (A'-2)/4 < 132609 satisfying every stated constraint. EITHER would
        show the stated recipe does not select M-511. NEITHER WOULD BE AN ECDLP BREAK
        -- that is an explicit claim boundary of this goal.
      controls: >-
        POS: NIST P-224/P-256/P-384 are classified "manipulatable" with published
        seeds; brainpool "somewhat rigid"; ANSSI FRP256v1 "trivially manipulatable"
        with "No explanation provided" -- the classifier must reproduce all four
        classes. NEG-1: M-383/Curve383187 carry the near-identical recipe
        ("p is largest prime smaller than 2^383; B=1; A > 2 is as small as possible")
        and D8's machinery must run on them unchanged. NULL: run D8's minimality search
        with one constraint DELETED and confirm the minimal A moves -- if it does not,
        the search is not sensitive to the constraint set and proves nothing.
      budget: '60 s for the adjudication itself; D8 carries the compute'
      stopping_rule: 'immediate'
      honest_limitation: >-
        Rigidity is a property of a PROCESS, not of a curve. Even a perfect D8 result
        shows only that the published recipe is consistent with the published
        parameters; it cannot show the recipe is what the designers actually ran.

    - id: L8
      criterion: ladder
      category: ecc_security_beyond_ecdlp
      comparison_target: '"Montgomery ladder? True", cofactor 2^3 (pages/ladder.txt)'
      mechanism: >-
        Reproduce the verify.sage predicate exactly: convert to short Weierstrass
        a = (3 - A^2)/(3B^2), b = (2A^3 - 9A)/(27B^3); find the roots r of
        z^3 + a*z + b over F_p; test whether any has 3r^2 + a a square.
      the_finding_that_precedes_the_measurement: >-
        By PTA-6 in the capsule, r = A/3 is always a root and 3r^2 + a == 1 identically
        for every Montgomery curve with B = 1 and p > 3. THE PREDICATE IS
        TAUTOLOGICALLY TRUE ON THE WHOLE INPUT CLASS. This lane is therefore designed
        to MEASURE that tautology rather than to be surprised by it.
      certificate: 'the exact field element 3*(A/3)^2 + a == 1, computed mod p; a one-line identity anyone can check'
      quantitative_prediction: >-
        the predicate returns True; the witness value is exactly 1; and on NULL-B all
        32 random Montgomery curves also return True with witness exactly 1.
      falsifier: >-
        ANY Montgomery curve in NULL-B returning False, or a witness value != 1. That
        would falsify PTA-6 and would be the most interesting outcome available in this
        lane. Also: the published cofactor 2^3 disagreeing with #E/ell from D1.
      controls: 'POS-1/POS-3 (Anomalous, secp256k1, NIST P-*) must return False -- if the predicate returns True for a prime-order short Weierstrass curve the code is broken; NULL-B is the blocking tautology test'
      budget: '60 s'
      stopping_rule: 'single evaluation plus 32 NULL-B draws'
      honest_limitation: >-
        pages/ladder.txt defines the requirement as "simple, fast, constant-time
        single-coordinate single-scalar multiplication" and admits it does not
        quantify "much" -- and verify.sage tests NONE of simple, fast, or constant-time.
        The reproducible content of this cell is the existence of a Montgomery model,
        which was an input. The cell carries essentially no M-511-specific information.

    - id: L9
      criterion: twist
      category: ecc_security_beyond_ecdlp
      comparison_target: "twist ell' = 2^509 - 214495..., twist cofactor 2^2, twist rho 2^254.3, twist embedding degree (l'-1)/4, combined attack 2^252.3, all True (pages/twist.txt)"
      mechanism: >-
        (1) #E_twist = p + 1 + t; factor it using PRE-1; the largest prime factor is
            ell'; the residual is the twist cofactor.
        (2) gcd(ell', p) == 1 (twist additive-transfer check).
        (3) ord_{ell'}(p) exactly, from the factorization of ell'-1 in PRE-1, same
            certificate format as L5.
        (4) twist rho by the L4 formula on ell'.
        (5) Reimplement the combined-attack greedy loop of pages/verify.txt
            independently from the published pseudocode and evaluate it.
      certificate: 'exact factorization of p+1+t with Pocklington certificates; the ord witness chain; the greedy-loop trace listing every admitted prime v and the running joint value'
      quantitative_prediction: >-
        p + 1 + t == 4*ell' exactly (PTA-5 hand-checks this and it closes; recompute);
        twist cofactor exactly 2^2; (ell'-1)/ord == exactly 4; twist rho rounds to
        254.3; combined attack rounds to 252.3.
      falsifier: >-
        any of the five values differing; or the greedy reimplementation disagreeing
        with the published cell on any of the 20 table rows (defect in the
        reimplementation, localise before interpreting M-511)
      controls: >-
        POS-1: Anomalous has twist cofactor 3^3*5*47*4093*2013751*2376645121788851 and
        combined cost 2^53.5 -- the pipeline MUST return a sub-2^100 value there or it
        cannot detect twist weakness at all. POS: NIST P-224 (2^58.4) and
        brainpoolP256t1 (2^44.5) are further published failures the pipeline must
        reproduce. NEG-1/NEG-2 must pass. NULL-C must move the values.
      budget: '600 s'
      stopping_rule: 'stop at 600 s; report which of the five values closed'
      honest_limitation: >-
        Under H4 the 2^252.3 figure is a model output under stated assumptions
        (cyclicity, every prime power usable, kangaroo as efficient as rho). It is an
        upper bound on the modelled attack, not a lower bound on any real attack, and
        the dossier must not invert that direction.

    - id: L10
      criterion: complete
      category: ecc_security_beyond_ecdlp
      comparison_target: 'complete single-scalar True, complete multi-scalar True, #order-2 = 1, #order-4 = 2 (pages/complete.txt)'
      mechanism: >-
        (1) Count rational points of order 2: the x-coordinates are the roots of
            x^3 + A x^2 + x = x(x^2 + Ax + 1), i.e. x = 0 always, plus the roots of
            x^2 + Ax + 1 which are rational iff A^2 - 4 is a square. So numorder2 == 1
            iff A^2 - 4 is a NON-square. Decide by one Jacobi symbol on
            281364471840 mod p.
        (2) Count points of order 4 by enumerating E(0).division_points(4) as
            verify.sage does, or equivalently by the halving criterion on the unique
            2-torsion point.
        (3) Apply verify.sage's rule: completesingle = completemulti =
            (numorder4 == 2 and numorder2 == 1).
      certificate: >-
        The Jacobi symbol computation itself is the certificate -- reciprocity gives an
        O(log^2 p) transcript any third party can replay -- plus, independently, the
        Euler witness 281364471840^((p-1)/2) mod p, which must equal p-1.
      quantitative_prediction: >-
        Jacobi(281364471840, p) == -1; Euler witness == p-1; numorder2 == 1;
        numorder4 == 2; both completeness flags True. Cross-consistency: numorder2 == 1
        must agree with the rigidity recipe clause "A^2 - 4 is not a square", giving
        two independent published statements that must agree.
      falsifier: 'Jacobi == +1 (would contradict both pages/complete.txt and pages/rigid.txt simultaneously), or numorder4 != 2'
      controls: 'POS-1/POS-2/POS-3 must all return numorder2 == 0 and both flags False; NEG-1/NEG-2/NEG-3 must return 1 and 2; NULL-B: predicted invariant across all 32 draws by construction (A^2-4 non-square was imposed) -- so ALSO draw 32 curves WITHOUT that constraint and require numorder2 == 3 on them, which is the real sensitivity test'
      budget: '120 s'
      stopping_rule: 'single evaluation plus 64 null draws'
      honest_limitation: >-
        pages/complete.txt is explicit that completeness of a curve does not guarantee
        completeness of an addition law, and cites the Hisil-Wong-Carter-Dawson dual
        law as an incomplete law on a complete curve. This cell certifies that a
        complete law is AVAILABLE, not that any implementation uses one.

    - id: L11
      criterion: ind
      category: ecc_security_beyond_ecdlp
      comparison_target: '"Supports indistinguishability? True", "Elligator 2: Yes." (pages/ind.txt)'
      mechanism: >-
        Reproduce verify.sage's predicate exactly: (p + 1 - t) even AND b != 0, where
        b = (2A^3 - 9A)/(27B^3) is the short-Weierstrass constant. Compute b mod p in
        exact arithmetic. Separately, check the condition pages/ind.txt states in prose
        for Elligator 2 -- y^2 = x^3 + Ax^2 + Bx with A*B*(A^2 - 4B) nonzero -- and
        record whether the implemented predicate and the prose condition agree on all
        20 table rows.
      certificate: 'the exact residue b mod p, nonzero; the parity of #E = 8*ell, even by inspection; and the 20-row agreement table between predicate and prose'
      quantitative_prediction: >-
        b != 0 (b == 0 would require 2A^2 == 9 in F_p, i.e. A^2 == 9/2, which the
        20-digit A does not satisfy); #E even; cell True. Agreement between predicate
        and prose on 20/20 rows.
      falsifier: 'b == 0, or #E odd, or predicate/prose disagreement on any row (a documented-behaviour discrepancy in the published tool, reportable as such)'
      controls: 'POS-1/POS-2/POS-3 must return False; NEG-1/NEG-2/NEG-3 True; NULL-B predicted invariant across all 32 draws -- which is the point'
      budget: '60 s'
      stopping_rule: 'single evaluation over all 20 rows'
      honest_limitation: >-
        The predicate tests APPLICABILITY of a construction, not the existence,
        correctness, or constant-time behaviour of any implementation of it. Like L8
        it is near-shape-determined and carries little M-511-specific information.

  # =========================================================================
  # 5. THE EIGHT DECLARED ADDITIONAL DIAGNOSTICS
  # =========================================================================
  additional_diagnostic_lanes:

    - id: D1
      diagnostic: 'complete curve and twist order factorization with checkable certificates'
      mechanism: 'from PRE-1: #E = p+1-t and #E_twist = p+1+t factored completely over the published prime list, each factor Pocklington-certified'
      certificate: 'the two factorizations plus the identity #E + #E_twist == 2p + 2, which is a one-line consistency check binding both'
      quantitative_prediction: '#E == 2^3 * ell exactly; #E_twist == 2^2 * ell'' exactly; the sum identity closes exactly'
      falsifier: 'either factorization leaving a residual > 1, or the sum identity failing (which would mean t is inconsistent and would void L6 and L9)'
      controls: 'NULL-A blocking; NEG-1 must factor completely'
      budget: 'included in PRE-1'
      stopping_rule: 'as PRE-1'
      honest_limitation: 'inherits H2 -- these are verified reconstructions of published factorizations, not independent factorizations'

    - id: D2
      diagnostic: 'subgroup, cofactor, and invalid-curve confinement costs'
      mechanism: >-
        With h = 8 and h' = 4 and a single-coordinate ladder, enumerate exactly what an
        attacker-supplied x can reach: by pages/twist.txt, x lies on E or on its
        quadratic twist and nowhere else, so the reachable small-order subgroups have
        order dividing 8 and 4. Compute (a) the exact number of bits of n leaked by a
        small-subgroup attack on E (log2 8 = 3), (b) on the twist (log2 4 = 2),
        (c) the CRT-combined leak, noting that gcd(8,4) = 4 so the leaks do NOT
        multiply, and (d) the residual kangaroo cost, then compare against the
        SafeCurves greedy output from L9.
      certificate: 'the enumerated subgroup structure with orders, plus the arithmetic of the cost model, plus the exact agreement or disagreement with L9''s 252.3'
      quantitative_prediction: >-
        leaked bits at most 3 from E and at most 2 from the twist, combining to at most
        3 (not 5) because both cofactors are powers of 2; residual rho/kangaroo cost
        within 1.5 bits of the plain rho figure 253.8; the SafeCurves combined figure
        252.3 lies between 253.8 - 1.5 and 253.8, and our independent derivation must
        land in the same interval.
      falsifier: 'our independent derivation differing from L9 by more than 0.5 bits, which would mean one of the two models is misimplemented'
      controls: 'POS-1 Anomalous (twist cofactor with a 16-digit prime factor) must produce a large leak and a sub-2^100 residual; NEG-1 M-383 must match its own published cell'
      budget: '180 s'
      stopping_rule: 'stop when the two derivations agree or after 180 s'
      honest_limitation: 'entirely inside H4. It is a cost model, not an executed attack, and no attack is proposed at cryptographic scale.'

    - id: D3
      diagnostic: 'automorphism- and endomorphism-adjusted rho cost'
      mechanism: >-
        (1) Compute the j-invariant j = 1728*4a^3/(4a^3 + 27b^2) exactly in F_p from the
            short-Weierstrass image, and test j in {0, 1728}. Aut(E) = {+-1} unless
            j is 0 or 1728, in which case |Aut| is 6 or 4 and rho gains a further
            sqrt(3) or sqrt(2).
        (2) Bound the smallest non-trivial endomorphism: End(E) is an order in
            Q(sqrt(D)) with |D| ~ 2^510.5, so every endomorphism outside Z has norm at
            least |D|/4 in the maximal order. Search explicitly for small-norm elements
            by solving x^2 + |D|y^2/4 <= 2^40 over integers -- no solutions with y != 0
            exist once |D|/4 > 2^40, which is a one-line inequality.
        (3) Report the total rho discount as a factor, not a hand-wave.
      certificate: 'the exact j-invariant; the exact inequality |D|/4 > 2^40; the empty solution set of the norm equation'
      quantitative_prediction: >-
        j not in {0, 1728}; |Aut(E)| == 2; the ONLY discount is the sqrt(2) negation
        factor already inside the 0.886 constant of L4; additional endomorphism
        discount = 0 bits; no endomorphism of norm below 2^40 exists.
      falsifier: >-
        j == 0 or j == 1728 (would mean the published 2^253.8 overstates security by
        0.5 to 0.8 bits -- small, but a real discrepancy with the published cell), or
        an endomorphism of norm below 2^40 (which would contradict L6's |D| and would
        be a material finding requiring escalation)
      controls: 'POS-3 secp256k1 has j == 0 and D == -3; the pipeline must return |Aut| == 6 there. POS-2 BN(2,254) likewise D == -3. A pipeline that reports |Aut| == 2 for secp256k1 has no resolving power and this lane is void.'
      budget: '120 s'
      stopping_rule: 'single evaluation plus controls'
      honest_limitation: >-
        Bounds the KNOWN endomorphism-based discounts. pages/disc.txt is explicit that
        the limits of small-|D| speedups are only "reasonably well understood". This
        lane closes a catalogued family, not the space of possible speedups.

    - id: D4
      diagnostic: 'embedding-degree certificate or explicit search bound'
      mechanism: 'DELEGATED to L5, which is itself a specialisation of IDEA-20260807-98a970. Not restated here.'
      nonduplication_note: >-
        Per the RQ's nonduplication_rule, the embedding-degree, anomalous and
        full-torsion coverage is IDEA-20260807-98a970's, reused and specialised in L5.
        No new mechanism proposal is minted. What this plan ADDS to that record is one
        thing only: the PRE-1 route, which retrieves the factorization of ell-1 from
        the publisher's own recursively-closed prime list and thereby reaches an EXACT
        certificate at 508 bits, which that record explicitly predicted would be out of
        reach ("a 521-bit factorisation is very likely out of reach here and the honest
        output is a mixed table"). That is a concrete, testable improvement to a
        predicted shortfall and it should be reported back against that record.
      quantitative_prediction: 'see L5'
      falsifier: 'see L5'
      controls: 'see L5'
      budget: 'included in L5'
      stopping_rule: 'see L5'
      honest_limitation: 'see L5'

    - id: D5
      diagnostic: 'CM discriminant and conductor structure'
      mechanism: >-
        Write t^2 - 4p = f^2 * D_0 with D_0 the fundamental discriminant. From L6 we
        have D; compute the conductor f = sqrt((t^2 - 4p)/D) exactly and verify
        f^2 * D == t^2 - 4p in exact integer arithmetic. Factor f over the published
        prime list. Report the order Z + f*O_K structurally. Then state the class
        number only as a bound under H1.
      certificate: 'the exact f, the exact identity f^2 * D == t^2 - 4p, the factorization of f, and the H1 bound with its GRH dependence named in the record'
      quantitative_prediction: >-
        f is an exact integer and the identity closes; f is smooth over the published
        list (predicted, because the list is claimed to contain all prime divisors of
        t^2 - 4p); h(D) > 10^6 under H1 by roughly 249 orders of magnitude
        (sqrt(2^510.5) ~ 2^255).
      falsifier: >-
        (t^2 - 4p)/D not a perfect square (methodology error in the D derivation), or
        f having a prime factor outside the list (falsifies H2 for this integer)
      controls: >-
        POS-1 Anomalous: D == -11 and the conductor structure must come out consistent
        with a curve of j-invariant -2^15 as pages/rigid.txt describes; POS-3
        secp256k1: D == -3. H1''s own validation route (small-|D| sampling at
        2^40-2^80 with tail checks) is a separate, cheap sub-run and is BLOCKING for
        any statement about h(D).
      budget: '240 s for the exact part; 600 s for the H1 sampling sub-run'
      stopping_rule: 'stop the sampling at 10^3 draws or 600 s'
      honest_limitation: >-
        THE CLASS NUMBER IS NOT COMPUTED AND CANNOT BE. Everything said about h(D) is
        conditional on H1 and on an extrapolation from 2^80 to 2^510, and the dossier
        must carry that conditionality in the sentence, not in a footnote.

    - id: D6
      diagnostic: 'model-conversion exceptional sets'
      mechanism: >-
        Enumerate, exactly and exhaustively, the exceptional points of each birational
        map in the chain the audit uses:
        (a) Montgomery -> short Weierstrass, x |-> (x + A/3)/B: everywhere defined on
            affine points since B is invertible; exceptional set is the point at
            infinity only.
        (b) Edwards <-> Montgomery, x = u/v, y = (u-1)/(u+1): undefined at v == 0 and
            at u == -1. Compute the rational points with v == 0 or u == -1 explicitly.
        (c) Compute the twisted-Edwards parameter d = (A-2)/(A+2) mod p and its Jacobi
            symbol, recording whether a complete Edwards model exists over F_p.
        Then intersect every exceptional set with the prime-order subgroup <P>.
      certificate: 'the explicit finite list of exceptional points with their orders, plus the exact Jacobi symbol of d, plus the intersection computation'
      quantitative_prediction: >-
        Every exceptional point has order dividing 4. Since gcd(4, ell) == 1, the
        intersection with <P> is exactly {O}. Therefore NO conversion used anywhere in
        this audit can silently fail on a point of the cryptographic subgroup. Predicted
        intersection size: exactly 1 (the identity), on every map in the chain.
      falsifier: >-
        an exceptional point of order divisible by ell (impossible if D1 holds, so a
        hit here would mean D1 is wrong), or a conversion in the audit code that
        produces a different result from the direct computation on any of 10^4 random
        points
      controls: >-
        POS: run the same enumeration on POS-1 (Anomalous, numorder2 == 0) where the
        Edwards route does NOT exist -- the enumeration must report that, not crash or
        silently return an empty set. NULL: perturb A by 1 and confirm the exceptional
        set and the Jacobi symbol of d change.
      budget: '180 s'
      stopping_rule: 'stop after 10^4 random round-trip checks'
      honest_limitation: 'covers the conversions THIS audit uses. It is not a survey of every model in the literature.'

    - id: D7
      diagnostic: 'scalar and multiscalar formula exceptional-case search'
      mechanism: >-
        (1) Enumerate the rational x with x^3 + Ax^2 + x == 0: x == 0 always, plus
            roots of x^2 + Ax + 1 which exist iff A^2 - 4 is a square. By L10 it is
            not, so the enumeration is predicted to return exactly {0}.
        (2) Drive the Montgomery ladder on every enumerated degenerate x, on the
            x-coordinates of all points of order dividing 8, on x == 0, and on x values
            that are non-residues (twist points), for 10^3 random scalars each.
        (3) Cross-check every output against an independent generic short-Weierstrass
            scalar multiplication that handles exceptional cases by explicit branching.
        (4) Repeat for a 2-scalar multiscalar routine (Strauss-Shamir), same
            cross-check.
      certificate: 'the enumerated degenerate input set; the mismatch count; the seed and scalar list so the search is replayable exactly'
      quantitative_prediction: >-
        degenerate x set == {0} exactly; ZERO mismatches in 10^3 x 4 single-scalar
        trials and 10^3 multiscalar trials; ladder returns X0(nP) on every degenerate
        input including x == 0, consistent with the 2006 Bernstein completeness result
        cited on pages/complete.txt which requires exactly A^2 - 4 non-square.
      falsifier: >-
        any mismatch. IMPORTANT: a mismatch is an INSTRUMENT failure until reproduced
        by a second independent implementation. Only a mismatch reproduced across two
        implementations is a candidate finding, and even then it is an implementation
        property, not an ECDLP statement.
      controls: >-
        POS: run the identical harness on a curve with A^2 - 4 a SQUARE (three points
        of order 2), where the completeness precondition fails -- the harness must find
        mismatches there, or it cannot detect anything. This is the blocking positive.
        NULL: shuffle the scalar list; mismatch count must be unchanged.
      budget: '900 s'
      stopping_rule: 'stop at 900 s or 5x10^3 trials, whichever first; report trials completed'
      honest_limitation: >-
        Randomised search over a chosen degenerate set. It cannot prove absence of an
        exceptional case, only bound its density: with 5x10^3 trials and no mismatch,
        the honest statement is "no failure at density above ~2x10^-4 in the sampled
        input classes", and that is what the record must say.

    - id: D8
      diagnostic: 'deterministic parameter-generation transcript audit'
      importance: 'HIGHEST INFORMATION PER UNIT COST IN THIS PLAN AFTER PRE-1 -- it is the only lane that tests a claim NO retrieved source verifies (see L7).'
      recipe_under_audit: >-
        "p = 5 (mod 8) is largest prime smaller than 2^511; B=1; (A - 2)/4 is as small
        as possible for A > 2; A^2 - 4 is not a square; curve order is n = 8r and
        quadratic twist order is n' = 4r'."  (pages/rigid.txt, sha256
        5f1595d64f9d58c61e09e19fbe300db40e20a447bd64c8c158f308e3bed296a7)

      sub_lane_D8a:
        title: 'the prime clause -- CHEAP AND COMPLETE'
        mechanism: >-
          WEAK READING (largest prime congruent to 5 mod 8 below 2^511): the candidates
          above p in that class are 2^511 - m for m in {3, 11, 19, ..., 179}, i.e. 23
          integers. Test each for compositeness.
          STRONG READING (largest prime below 2^511, which happens to be 5 mod 8): test
          all 2^511 - m for m == 1..186, i.e. 186 integers.
          Do BOTH; they cost the same order of magnitude.
        certificate: >-
          One short compositeness witness per candidate -- a Fermat/Miller-Rabin base b
          with b^(n-1) != 1 mod n, or a found factor. A third party re-verifies each in
          one modular exponentiation. This is a COMPLETE certificate for the clause,
          not a bound.
        quantitative_prediction: 'all 23 composite (weak reading) and all 186 composite (strong reading), with a witness for each; p itself prime by L1'
        falsifier: 'any candidate passing a strong probable-prime test -- that would show the stated recipe does not select 2^511 - 187, i.e. the fully-rigid transcript is wrong as written. NOT AN ECDLP BREAK.'
        controls: >-
          POS: run the identical search for M-383 (2^383 - 187) and Curve383187, whose
          recipe says "largest prime smaller than 2^383" with NO mod-8 clause -- all 186
          candidates below must be composite there too. If they are not, the M-383
          transcript is the one that fails and we learn that first, on the negative
          control, which is exactly what a negative control is for.
          NULL: seed the candidate list with a known prime (e.g. 2^511 - 187 itself
          under a shifted offset) and confirm the search FINDS it. A search that never
          fires cannot certify a negative.
        budget: '120 s'
        stopping_rule: 'stop after all 186 candidates or 120 s'
        honest_limitation: 'certifies the clause as written. It cannot certify that this clause is what the designers applied.'

      sub_lane_D8b:
        title: 'the minimality clause -- BOUNDED, EXPLICITLY DEFERRED IN PART'
        mechanism: >-
          For k = 1, 2, 3, ... with A = 4k + 2 and A > 2, test in this order:
          (i) A^2 - 4 non-square (one Jacobi symbol, microseconds -- eliminates ~50%);
          (ii) #E == 8r with r prime and #E_twist == 4r' with r' prime (requires POINT
          COUNTING at 511 bits). Stop at the first k satisfying all clauses. The recipe
          claims that k is exactly 132609 (capsule PTA-2).
        the_honest_problem: >-
          Step (ii) needs SEA at 511 bits, roughly 66,000 times after the Jacobi filter.
          IDEA-20260807-98a970 records that this program's environment is pure Python
          with no Sage; under that constraint a single 511-bit SEA is out of reach and
          the achievable K is essentially 0. THIS IS STATED IN ADVANCE, so a shortfall
          is a known environment limit and not a reported finding.
        explicit_bound_instead_of_a_result: >-
          The lane's deliverable is the largest K reached within budget plus the exact
          statement "no A with (A-2)/4 <= K satisfies all clauses", together with the
          per-candidate Jacobi results for the FULL range k = 1..132609 (which IS
          affordable -- 132,609 Jacobi symbols at 511 bits is seconds) and the resulting
          exact count of candidates surviving clause (i). That count is itself a real,
          cheap, publishable number and it bounds the remaining work precisely.
        certificate: 'the surviving-candidate list after clause (i) (exact, complete over k = 1..132609), plus per-candidate point-count certificates for whatever prefix K was reached'
        quantitative_prediction: >-
          Roughly half of the 132,608 candidates survive clause (i); the exact count is
          predicted in [66000, 66700] (binomial 1-sigma around 66,304). No candidate
          with (A-2)/4 < 132609 survives all clauses -- but only verified up to K.
        falsifier: 'any A'' with (A''-2)/4 < 132609 satisfying every clause. Would falsify the minimality claim and therefore the fully-rigid transcript AS WRITTEN. Not an ECDLP break.'
        controls: >-
          POS/blocking: run the same search machinery on M-221, whose recipe is
          "p is largest prime smaller than 2^221; B=1; A > 2 is as small as possible"
          with A == 117050 and a 221-bit field where point counting IS feasible. The
          machinery must reproduce 117050 as the minimum. IF IT CANNOT REPRODUCE M-221,
          NO BOUND IT REPORTS FOR M-511 MEANS ANYTHING, and this is the cheapest full
          end-to-end validation of the whole D8b apparatus available anywhere in the
          plan. NULL: delete the "A^2 - 4 not a square" clause and confirm the M-221
          minimum MOVES; if it does not, the search is insensitive to its own
          constraint set.
        deferral_reason_and_successor_condition:
          reason: 'full replay needs ~66,000 SEA point counts at 511 bits, which exceeds this campaign''s stated total budget of 18,000 s by orders of magnitude and is impossible without a CAS.'
          successor_condition: >-
            Escalate to a scoped handoff with a CAS (Sage or PARI/GP) available and a
            declared K target. Recommended staging: K = 1000 first (bounded, ~hours),
            then reassess. The deliverable at every stage is the BOUND with its K, never
            a claim of minimality. If the M-221 positive control fails at any point,
            stop and report the control failure instead.
        budget: '600 s for clause (i) over the full range plus the M-221 control; point counting NOT attempted in this environment'
        stopping_rule: 'stop clause (i) after k = 132609; stop clause (ii) at the first budget breach and record K'
        honest_limitation: >-
          A bound is a bound. Reporting "no smaller A exists" from a search that reached
          K would be exactly the overclaim this program forbids; the record must say
          "no smaller A with (A-2)/4 <= K exists" and print K.

  # =========================================================================
  # 6. PRIORITISATION AND BUDGET
  # =========================================================================
  prioritisation:
    order:
      - 'PRE-1  (gates six lanes; run first)'
      - 'L2, L4, L10, L11, L8  (cheap exact cells; under 5 minutes total; also exercise the control harness)'
      - 'L1, L3  (certificates from PRE-1)'
      - 'D8a    (cheap, complete, and tests a claim nothing else tests)'
      - 'L5/D4, L6, D3  (the ECDLP-relevant certificates)'
      - 'L9, D1, D2  (twist, gated on PRE-1)'
      - 'D5, D6, D7  (structure and formula lanes)'
      - 'D8b clause (i) + M-221 control  (bounded)'
      - 'L7 adjudication (zero compute, written last because it consumes D8)'
    total_budget_requested_seconds: 5400
    campaign_budget_note: >-
      The goal declares 18,000 s total across at most 5 batches. This plan requests
      5,400 s of Executor time, leaving room for validation, red team and synthesis.
      D8b's point-counting half is explicitly NOT inside that number and is deferred
      to a successor with a CAS.
    global_stopping_rule: >-
      Stop any lane at its stated budget. A budget stop is an OPERATIONAL OBSERVATION
      and is recorded as "not completed within budget", never as a negative
      mathematical result and never as a False cell.

  # =========================================================================
  # 7. TARGET COMPLEXITY AND SOTA POSITION
  # =========================================================================
  target_complexity:
    attack_exponent_claimed: 'NONE. This plan proposes no attack, mounts no attack, and moves no exponent on any hard problem.'
    audit_cost:
      time: >-
        Dominated by PRE-1 (a few hundred Pocklington chains at up to 511 bits) and by
        L5/L9 (omega(ell-1) + omega(ell''-1) modular exponentiations at ~508 bits, a few
        dozen each). Total requested 5,400 s single-core-equivalent.
      memory: 'O(log p) working memory; certificate set under ~1 MB. 2 GB requested for headroom only.'
    verification_cost_of_the_emitted_certificates: >-
      Pocklington: one modular exponentiation per listed divisor per prime. Exact-k:
      omega(ell-1) exponentiations. Compositeness witnesses (D8a): one exponentiation
      each. All of it re-verifiable by a third party in seconds -- which is the point,
      per docs/claims-and-verification.md.
    hidden_overhead_disclosed: >-
      The L5 FALLBACK lower-bound certificate is NOT succinct: verifying k > 10^6
      genuinely costs 10^6 multiplications, with no shortcut. If that route is taken it
      must be reported as such. D8b's output is a bound whose cost is linear in K and
      whose strength is linear in K; there is no cheap version of it.
    time_memory_tradeoff: >-
      One real tradeoff, inside L5: exact k needs the factorization of ell-1 (PRE-1
      supplies it cheaply IF H2 holds, at the price of depending on the publisher's
      list) versus a bound needing K multiplications (independent of the publisher, but
      cheap to produce and expensive to verify, and too weak to decide the SafeCurves
      threshold). The dossier must record which route each cell took.
    dominated_by: >-
      As an attack: n/a -- no result is claimed, so there is nothing on the Pareto
      frontier to compare. As an AUDIT INSTRUMENT: dominated by SafeCurves' own
      verify.sage (pages/verify.txt), which produced every cell this plan reproduces,
      in 2013, with more compute than this program has. This plan dominates it on
      exactly three things and no others: (1) PRE-1 turns the published prime list from
      an input into a checked object, which verify.sage does not do; (2) D8a and D8b
      audit the rigidity recipe, which verify.sage explicitly does not do (it
      string-compares a file); (3) the null controls NULL-B/NULL-C measure how much of
      the eleven-cell vector is shape-determined rather than curve-determined, which no
      retrieved source reports.
    sota_delta: >-
      Quantitatively: zero speedup against any attack baseline on every axis. As data
      inside this program: the corpus currently holds ZERO certified parameter values
      for M-511 (grep of knowledge/literature returned no match for "SafeCurves" or
      "M-511"); this plan would produce ~15 certified integers, ~251 Pocklington
      certificates, 2 exact multiplicative-order certificates at 508/509 bits, 186
      compositeness witnesses, and one exact surviving-candidate count over a 132,609-
      wide search. Against IDEA-20260807-98a970 specifically: that record predicted a
      mixed exact-and-bounded table with 521-bit rows very likely bounded-only; PRE-1
      proposes a concrete route to an EXACT row at 508 bits, which is a testable
      improvement to a predicted shortfall.

  novelty:
    status: adaptation
    checked:
      - 'grep of knowledge/ for "M-511|Curve511187|SafeCurves|Aranha": 9 files matched, all in sources.json/SOURCES.md indices; grep of knowledge/literature/ for "SafeCurves|M-511" returned NO content matches. The corpus holds no M-511 record and no SafeCurves technique note.'
      - 'ledger/proposals/IDEA-20260807-98a970.yaml read in full; this plan reuses and specialises it rather than duplicating it (see D4).'
      - 'WebSearch confirmed the existence of ePrint 2013/647 as a pointer only.'
    not_checked_and_why: >-
      Sibling GOAL-SCURVE-* dossiers for other curves are OUTSIDE this task's
      authoritative read_scope (which lists exactly three ledger files). A grep of
      ledger/ shows at least 21 RQ-SCURVE-* records and many TASK handoffs, so
      METHODOLOGICAL DUPLICATION ACROSS SIBLING CURVE GOALS IS LIKELY AND WAS NOT
      CHECKED. On that axis the honest label is `unverified`, and the Coordinator --
      who can read across goals -- should deduplicate the harness before dispatching.
    verdict: >-
      KNOWN as mathematics: reproducing SafeCurves cells is routine parameter
      validation and the publisher already did it. ADAPTATION within this program: the
      PRE-1 prime-list reconstruction, the D8 rigidity-transcript audit, and the
      NULL-B shape-determination measurement are specific, testable moves that no
      retrieved source performs. NOVELTY IS NOT CLAIMED FOR ANY MATHEMATICS.

  claim_boundaries:
    - No lane in this plan runs a curve attack. No lane produces an experiment result.
    - >-
      No lane, and no combination of lanes, licenses a statement that M-511 is safe,
      unsafe, vulnerable, or free of vulnerabilities. The strongest statement the whole
      plan can support is: "for the tested parameters, at the tested scale, under the
      named heuristics H1-H4, the following integers and predicates were reproduced
      with the attached certificates, and the following were not."
    - >-
      A failure in L7, L8, L10, L11, D6, D7 or D8 is NOT an ECDLP break. D8 in
      particular tests a claim about a PROCESS.
    - >-
      The intake row is a preregistered comparison target and is not independent of the
      staged mirror; agreement is a transcription check.
    - 'Infrastructure errors, timeouts and budget stops are operational observations, never mathematical evidence.'
    - 'Public parameters and generated controls only. No live private key is tested, requested, stored or derived at any point.'
