      what_it_would_settle: >-
        The only genuinely independent primary source for the M-511 tuple and for the
        designers' own stated generation rationale (which the SafeCurves rigidity
        recipe paraphrases). Would convert the single-source condition C2 into a
        two-source reconciliation.
      status: 'pointer confirmed, full text NOT retrieved, no digit transcribed'
      how_pointer_was_confirmed: >-
        WebSearch this session returned the eprint.iacr.org/2013/647 record and a
        Semantic Scholar record for the same title and author list. A search result
        listing is a POINTER, not the document.
      failure_mode: >-
        Not attempted by WebFetch for parameter extraction. Per the dispatch
        briefing's confirmed defect (2), WebFetch returns a small-model summary that
        corrupts numeric data -- verified against raw RFC 7748 bytes, where it merged
        three distinct constants, reported the wrong cofactor on three lines, and
        returned a subgroup order with the wrong digit count; two calls on the same
        URL disagreed with each other. This role has no Bash, so curl is unavailable.
        Fetching prose from this PDF would therefore add nothing this capsule can use
        and would risk a corrupted digit entering the record. Deliberately not done.
      successor: 'S1 in task-report.yaml -- a task with Bash/curl that stages the PDF with a sha256'
    - source: 'https://safecurves.cr.yp.to/ and all criterion pages, fetched live'
      status: 'unretrieved by this role'
      failure_mode: >-
        Confirmed defect (1): safecurves.cr.yp.to returns HTTP 502 through WebFetch
        for every URL on the host, including the bare host, while curl to the same URL
        in the same container returns 200. Three earlier producers in this campaign hit
        this and correctly recorded the sources as unretrieved. This role has no Bash.
      mitigation: >-
        The staged mirror SAFECURVES-20260825 supplies the identical bytes with
        per-file sha256. That is why every citation above says "retrieved (staged
        mirror ...)" and not "retrieved".
