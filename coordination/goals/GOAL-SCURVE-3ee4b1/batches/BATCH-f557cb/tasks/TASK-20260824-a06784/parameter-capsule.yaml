  # ---------------------------------------------------------------------------
  # 5. PLANNING-TIME ARITHMETIC (NOT A RUN, NOT EVIDENCE)
  # ---------------------------------------------------------------------------
  planning_time_arithmetic:
    status: >-
      HAND ARITHMETIC PERFORMED BY THE IDEA GENERATOR DURING PLANNING. This is not a
      run record, produced no artifact, and is NOT evidence. It is recorded because it
      is cheap for a reader to redo and because it tells the Coordinator that the
      internal-consistency lanes below are likely to pass rather than likely to fail.
      Every item MUST be recomputed by the Executor under a run record before any
      evidence record cites it. If any item below fails on recomputation, treat the
      recomputation as authoritative and this block as a producer error.
    items:
      - id: PTA-1
        statement: 'A^2 - 4 = 530438^2 - 4 = 281364471844 - 4 = 281364471840'
        matches: 'the "Elliptic? Result" cell for M-511 in pages/equation.txt, exactly'
        significance: >-
          Confirms A and the B=1 reading against a second, independently published
          derived quantity on a different page.
      - id: PTA-2
        statement: '(A - 2)/4 = 530436/4 = 132609, an exact integer'
        significance: >-
          The rigidity recipe minimises exactly this quantity. 132609 is therefore the
          claimed minimum and the search bound for lane D8b.
      - id: PTA-3
        statement: '187 = 8*23 + 3, so 2^511 - 187 == -3 == 5 (mod 8)'
        significance: >-
          Consistent with the rigidity recipe clause "p = 5 (mod 8)". Also fixes the
          candidate set for lane D8a: the primes below 2^511 congruent to 5 mod 8 are
          2^511 - m for m in {3, 11, 19, ..., 179, 187}, i.e. 23 candidates strictly
          larger than p.
      - id: PTA-4
        statement: >-
          8*ell + 186 == 85798038077085980992356252112544974736566053019478664231724326470621400496530,
          which equals |t| as published in pages/disc.txt; equivalently
          t = p + 1 - 8*ell.
        significance: >-
          Ties together FOUR separately published pages -- p (field), ell (base),
          cofactor 8 (ladder), t (disc) -- through one exact identity. Strong evidence
          of transcription integrity across the mirror. It is NOT evidence about the
          curve.
      - id: PTA-5
        statement: >-
          4*ell_prime == 85798038077085980992356252112544974736566053019478664231724326470621400496716
          == |t| + 186, so p + 1 + t == 4*ell_prime.
        significance: >-
          Ties the twist page to the same identity with the published twist cofactor
          2^2. Combined with PTA-4: #E = 8*ell and #E_twist = 4*ell_prime, and
          #E + #E_twist = 2p + 2, the standard consistency relation.
      - id: PTA-6
        statement: >-
          For any Montgomery curve with B = 1 and p > 3, the short-Weierstrass image
          has a = (3 - A^2)/3 and the point (0,0) of order 2 maps to the root
          r = A/3 of z^3 + a*z + b, at which 3*r^2 + a = A^2/3 + (3 - A^2)/3 = 1,
          which is a square.
        significance: >-
          THE SAFECURVES LADDER PREDICATE IS TAUTOLOGICALLY TRUE FOR EVERY MONTGOMERY
          CURVE. pages/verify.txt computes safeladder as "exists a root r of
          z^3+a*z+b with 3*r^2+a square". So lane L8 reproduces a value that carries
          no curve-specific information beyond "this curve was handed to us in
          Montgomery form". This is an honest limitation of the criterion, disclosed
          before the measurement, and it is the single most important thing this
          capsule tells the Executor about what L8 can and cannot show.

