      Curve511187)", and eleven True cells. Every one of those strings appears
      verbatim, in that order, in the SafeCurves index page in the staged mirror. The
      intake is a transcription of the SafeCurves table.
    consequence: >-
      Agreement between the intake row and the mirror is A TRANSCRIPTION CHECK AND
      NOTHING MORE. It confirms that the user copied the table correctly. It provides
      ZERO independent corroboration of any parameter or any criterion verdict, and
      it must never be reported as two sources agreeing.
    what_would_be_independent: >-
      (a) The designers' own document, Aranha-Barreto-Pereira-Ricardini, "A note on
      high-security general-purpose elliptic curves", IACR ePrint 2013/647 -- pointer
      confirmed this session by WebSearch result listing, FULL TEXT NOT RETRIEVED
      (see section 6). (b) An independent recomputation of the tuple's internal
      consistency from p, A and the base point alone, which is what the audit plan's
      PRE-1 and L1-L11 lanes exist to do. (b) is available to this program now;
      (a) is not, and its absence is disclosed rather than papered over.
    conflict_with_dispatch_briefing:
      briefing_claim: >-
        The dispatch briefing for this task states "M-511 is a Montgomery curve
        introduced in the SafeCurves work itself".
      retrieved_text: >-
        The SafeCurves index page attributes M-511 to "2013 Aranha-Barreto-Pereira-
        Ricardini (formerly named Curve511187)" -- i.e. to a third party, not to
        SafeCurves.
        Source: retrieved (staged mirror SAFECURVES-20260825), pages/index.txt,
        sha256 830355b638e713f4f99da62970e63e606e32c0f25f62af12a5aef4c4570c9e4e.
      adjudication: >-
        Resolved in favour of the retrieved primary text. The briefing's attribution
        is not supported by the source. This does NOT weaken the independence finding
        above: SafeCurves is still the sole retrieved source for the *evaluation*
        (all eleven cells and every derived quantity), and the intake row is still a
        transcription of that same table. Recorded as an unresolved-in-the-briefing
        item for the Coordinator, not as a mathematical conflict.

