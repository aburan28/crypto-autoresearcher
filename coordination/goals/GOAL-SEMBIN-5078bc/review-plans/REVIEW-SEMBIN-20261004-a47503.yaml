  proves_too_much:
    objects:
      - >-
        PT-1 MISSING-PRODUCT MUTANTS of an independently written closure (built by the blind lane from the statement of
        the quantity, no producer code): (a) multiplier budget one lower than stated; (b) rows multiplied only when their
        leading monomial is new, not when their tail changed after reduction by a later pivot; (c) generators multiplied
        only (degenerates to the single-level span); (d) the last batch of products dropped in each iteration. Use small
        systems (N about 14..24) whose true closure verdict at D = 4 is known from the evaluation-kernel ground truth, chosen so
        that the unmutated closure says "sufficient" and a mutant says "insufficient". The ARGUMENT TESTED is the producer's
        soundness argument: two elimination routines give the same leading-monomial set, the evaluation check at a common zero is
        clean on every elimination, the structural output check passes, therefore the recorded verdict is sound.
      - >-
        PT-2 BULK-AND-SPARSE CORRUPTION MUTANTS of the elimination step of the same independent closure, on a small system with
        |V| >= 2: (a) corrupt a large fraction of output rows (bulk, as M4RI 0.0.20200125 did); (b) add ONE row that vanishes at
        the zero used for the evaluation check but not at another zero and is not in the ideal.
      - >-
        PT-3 KNOWN-SUFFICIENT AND KNOWN-INSUFFICIENT CONTROLS for the verdict rule, from the independent ground truth: (a) a
        system with a planted degree-2 solution structure (the contract's known_false control) for which a degree-2 closure is
        already sufficient; (b) a system for which an independent exact Groebner computation (not M4RI) shows a reduced basis
        element of size above 4, so that a correct degree-4 closure must report "insufficient".
      - >-
        PT-4 PRODUCER-CODE VARIANTS, run by the validator inside joints W4 and W5 and NOT part of this control's assignment: the
        scratch mutants MA to ME of closure.c, the wrong-witness evalcheck and the vanishes-at-one-zero injection.
    failure_signature: >-
      On PT-1 the argument "two routines agree, evaluation check clean, structural check clean, hence sound" MUST be shown to go
      through (no flag) on mutants (a) to (d), because every such check shares the product generation; that outcome is the
      CONFIRMED BLIND SPOT: the argument is necessary and not sufficient, and it proves too much if it is quoted as certifying an
      "insufficient" verdict. The check that must flag PT-1 mutants is comparison with an independent closure or a saturation
      verifier; report which flags and which does not. On PT-2(a) the evaluation check MUST flag (else it is vacuous); on PT-2(b)
      it MUST stay clean (else the "necessary at one zero, not sufficient" statement is wrong); report which. On PT-3 the verdict
      rule MUST return "sufficient" on (a) and "insufficient" on (b); a rule that returns "sufficient" on (b) has proved too much,
      and one that returns "insufficient" on (a) is mis-measuring. A reviewer who finds the argument fails on none of these has
      not found an anomaly: it must say which object was inconvenient to the argument and why.
    assigned_to: TASK-20261004-095926
    assigned_to_note: >-
