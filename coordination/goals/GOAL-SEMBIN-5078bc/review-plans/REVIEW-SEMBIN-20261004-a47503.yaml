  claim_under_review: >-
    AS THE PRODUCER STATED IT (procedure claims only; no verdict is restated here).
    RUN-SEMBIN-5ed13e NOTES.md: the degree-capped closure records of the
    m = t = 2 window n = 40..45 (twelve instances) were produced with libclosure
    built against M4RI release-20240729, mzd_echelonize_pluq, a structural output
    check on every elimination, per-batch memory sizing and checkpointing;
    elimination_faults is 0 and no term above D was dropped; on two instances a
    different elimination routine (mzd_echelonize, same library) with a different
    batching gave the same leading-monomial set, with the evaluation check at a
    verified common zero clean on every elimination; the executor states that the
    evaluation check is "a necessary condition for soundness at one zero, not a
    proof" and that "both routines share closure.c's product generation, so a
    missing-product defect would not be caught by this comparison". RUN-SEMBIN-9bb990
    manifest validity and task-report validity notice: the run is completed_invalid
    because its closure and single-level records were produced with M4RI 0.0.20200125,
    whose eliminations leave the row space at this scale; every closure and
    single-level record is UNVERIFIED, one is confirmed contradicted by exact
    enumeration; the exact solution counts are cross-checked by two independent
    counters and are not affected.
    THE CLAIM AS THE COORDINATOR NARROWS IT (the only thing this round decides).
    Q-A, SOUNDNESS OF THE INSTRUMENT READING. For each of the twelve instances of
    RUN-SEMBIN-5ed13e, the recorded rank, standard-monomial count, leading-monomial
    data and verdict (sufficient or insufficient) equal those of the degree-capped
    closure W_4(S) as defined in blind_rederivation.quantity, i.e. (A1) no
    elimination output left the row space of its input (soundness), (A2) the product
    set generated was complete (completeness: no product missing), and (A3) the
    verdict rule was applied against a correct exact |V(I)|.
    Q-B, CLASSIFICATION OF RUN-SEMBIN-9bb990. Its closure and single-level records
    are correctly classified invalid-or-unverified for the stated reason (an
    M4RI 0.0.20200125 elimination defect), its exact solution counts are unaffected
    by that reason, and the package (tracked files plus the sha256 list of 92
    untracked instance files) supports those two statements.
    NOT UNDER REVIEW, AND NOT TO BE ASSERTED BY ANY REVIEWER: Semaev's Assumption 1;
    d_F4 or any solver's degree of regularity; whether a degree-4 insufficiency says
    anything about degree 5; n = 409 or 571; the security of any curve; the truth of
    H-SEMBIN-2d7708; whether the frozen contract was the right contract (joint W3
    reports DV-7 facts only); RUN-SEMBIN-b6eb9f; any run other than these two. A
    verdict on a joint is not a verdict on Q-A or Q-B. The Coordinator composes.

  coordinator_prior_meta:
    recorded_before_any_report: true
    recorded_with_knowledge_of: >-
      POST-DATA, NOT INDEPENDENT. The plan author (a Coordinator session) read
      RUN-SEMBIN-5ed13e's NOTES.md including its results table, RUN-SEMBIN-9bb990's
      NOTES-deviations-and-limitations.md and task-report.md and parts of its
      manifest.yaml, closure.c (column layout, write_product, install_basis,
      closure_run, the standard-monomial count, and only the header comment of
      ech()), soundness_probe.py's head, the specification, DEC-20261004-df2986,
      and the first sixty lines of excluded-large-instances.json. It did not read
      results.jsonl, any per-record verdict beyond the NOTES table, the body of
      ech(), crosscheck scripts or logs, or artifact-digests.json beyond its first
      lines. It ran nothing. Concurrence of
      a reviewer with this prior is therefore weak evidence; the independent evidence
      in this round is the blind lane (joint-free quantity) and the mutation work.
    credences_note: >-
      Percentages below are the plan author's stated expectations before any
      reviewer reports. They are judgements, not measurements, and are recorded so
      that a surprise is recoverable.
  coordinator_prior: >-
    I EXPECT THE FOLLOWING.
    E1 (A1, soundness). HOLDS for the recorded eliminations, about 85 percent. Basis:
    PLUQ plus a structural check plus an upstream-fixed library, and an evaluation
    check that was clean on every elimination of the two cross-checked instances.
    Its weakness is coverage, not logic: ten of the twelve instances have no second
    routine and no evaluation check, the structural check sees only malformed output,
    and the evaluation check uses ONE zero. I expect the review to say "holds for the
    two cross-checked instances, plausible and not verified for the other ten", which
    is an inconclusive-leaning split on W6 and not a break.
    E2 (A2, completeness). THE LIVE JOINT. The two verdict polarities have different
    exposure, and I expect the round to confirm this as a checkable statement: if the
    closure W' computed with a missing product is contained in the true closure W, and
    W is contained in the ideal, then std(W') >= std(W) >= |V|, so a missing product can
    only turn a true "sufficient" into a recorded "insufficient", never the reverse; a
    recorded "sufficient" therefore needs soundness only, while a recorded "insufficient"
    needs soundness AND completeness. Verdicts of the insufficient polarity are
    therefore the ones the executor's cross-checks cannot vouch for, and agreement of
    an independent closure is the only evidence about them. I expect the blind lane's
    independent closure to reproduce rank, standard-monomial count and per-size leading
    counts on every instance it can finish, about 75 percent; about 15 percent that a
    disagreement appears and localises to MY statement of the quantity (the order
    tie-break or the multiplier budget, both of which I derived from closure.c rather
    than from a published definition); about 10 percent a genuine product-completeness
    or checkpoint-resume defect in closure.c. I expect the validator's mutation work to
    show that the producer's own cross-checks do NOT flag a missing-product mutant, about
    95 percent (the executor says so itself); that is a confirmation of the stated
    blind spot, not a finding against the run.
    E3 (A3, the denominator). The exact counts reproduce under an independent method,
    about 95 percent. The exact-count programs are independent of the closure and of
    M4RI.
    E4 (Q-B). The 9bb990 classification holds: closure and single-level records are
    unverified-or-invalid for the stated reason and the exact counts are unaffected,
    about 85 percent. I expect the label completed_invalid to be called broader than
    the evidence (one record confirmed contradicted, the rest unverified) but
    defensible as a run-level label. On DV-8 I expect the finding that stopping rule 4
    did not fire in the contract's sense (the contradiction was with exact enumeration
    and was traced to the library, which core rule 5 treats as an implementation
    failure), about 70 percent, with the executor's invocation of the rule judged a
    cautious reading and not a violation.
    E5 (provenance and records). Minor findings only: the manifests lack the inference
    block (DV-9); the disclosed record defects are accurately disclosed; the 97
    duplicate records resolve without any verdict-changing disagreement, about 80
    percent; instance provenance and the draw rule hold, about 85 percent; the sampled
    regeneration of excluded instance files byte-matches OR fails only because the
    generator files at the freeze differ from the hashes recorded in the 9bb990
    manifest (code drift), with about 25 percent on a mismatch of that kind.
    E6 (DV-7). The implicit Boolean ring is equivalent to explicit field-equation
    generators for this certificate, about 80 percent; and invalidation rule 1's
    "degree 3" is phrasing written for t >= 3 that the m = t = 2 cells cannot satisfy
    literally (their generators have degree 2): a contract-text defect for an
    amendment, not an instrument defect.
    WHAT WOULD OVERTURN THIS PRIOR.
    (a) Any out-of-ideal row in any window elimination, i.e. a residual defect of
    M4RI release-20240729 at this scale: overturns A1.
    (b) An independent closure disagreeing with closure.c on any instance, with the
    disagreement localised to closure.c: overturns A2.
    (c) The evaluation check run against a witness that is not a common zero, or
    against a system other than the one in the .ms file: overturns the cross-check.
    (d) A counterexample to the polarity statement in E2 (a missing product producing
    a false "sufficient").
    (e) Duplicate records disagreeing in verdict, rank or standard-monomial count.
    I think (b) is the live one, and if it occurs I expect it at the order tie-break or
    the multiplier budget, which would be a statement defect of the plan before it is
    a code defect.

  joints:
    - joint: >-
        W1 -- RANK, STANDARD-MONOMIAL ARITHMETIC AND THE VERDICT RULE. That the
        quantities a degree-capped closure reports (the number of monomials of size at
        most D, the rank, the standard-monomial count over ALL sizes, the leading-monomial
        data) mean what the verdict rule needs: "sufficient" is std = |V|, "insufficient"
        is std > |V|, "std < |V|" is impossible for a closure inside the ideal; std can
        exceed (columns minus rank) because standard monomials above degree D are counted;
        a missing product can only RAISE std while an out-of-ideal row can lower it; and
        which polarity depends on the monomial order.
      assigned_to: TASK-20261004-095926
      attack_plan: >-
        BLIND LANE, from the statement of the quantity alone. (1) Implement the closure
        twice with different code (a plain reference for N up to about 22, and a packed-bit
        implementation for window sizes) and diff them on random Boolean systems you
        generate yourself, N in 10..24, with quadratic and cubic generators. (2) Compute the
        ground truth at small N WITHOUT any closure: B/I is F_2^V, so the ideal is the kernel
        of evaluation on V, and its leading-monomial set under the stated order is exact linear
        algebra on the evaluation matrix; sufficiency at D is then "W_4's leading monomials
        equal that set". Compare your closure's verdict to it on every small system. (3)
        Prove or break the polarity statement: if W' is inside W and W is inside I then
        std(W') >= std(W) >= |V|. Build a counterexample if you believe it false. State what
        it implies for each polarity. (4) Order dependence: on your small systems compute
        both polarities under degrevlex (the stated order), deglex and a random graded order.
        Report any system on which the verdict flips, and say what that means for a verdict
        recorded under one order. (5) State and prove the relation between rank, columns, std
        and the number of standard monomials of size above D. I think it breaks, if anywhere,
        at (4): the insufficient polarity is order-dependent and the contract never names an order.
      breaking_artifact: >-
        A small system on which your two implementations disagree, or on which the closure's
        verdict disagrees with the evaluation-kernel ground truth, or a counterexample to the
        polarity statement, or a system whose verdict flips with the tie-break (a scope
        finding: verdicts are per order), with the reproducing generator seed.
    - joint: >-
        W2 -- THE EXACT COUNT AS DENOMINATOR. That |V| = the number of points of F_2^N
        satisfying every generator is the right denominator (it equals dim B/I because the
        Boolean ring makes every point F_2-rational and the ideal radical), and that the
        count for each of the twelve window systems is reproducible by a method independent
        of the closure and of the producer's two counters.
      assigned_to: TASK-20261004-095926
      attack_plan: >-
        BLIND LANE. Write your own exact counter (the systems appear to have M equations
        in N = 2k variables in two halves of k variables each, check this on the files; if
        the equations are affine in the second half for a fixed first half, one linear solve
        per assignment is a candidate method; use any method you trust and say which). Validate the counter
        against brute force on small random systems and on a hand-checkable system, and
        test the .ms parser on operator precedence, the trailing comma and the constant
        term. Prove the denominator identity. Report |V| for all twelve instances BEFORE you
        start any closure on them. I expect no break; the realistic failure is a parse
        ambiguity.
      breaking_artifact: >-
        Two of your own methods disagreeing on an instance, a parse ambiguity that changes a
        count, or a proof gap in the denominator identity.
    - joint: >-
        W3 -- CONTRACT CONFORMANCE OF THE CLOSURE CERTIFICATE (DV-7, both runs). Whether
        (a) the implicit Boolean ring is equivalent to the field equations "as explicit
        generators" that invalidation rule 2 requires, (b) invalidation rule 1's "degree 3"
        generators can be read to cover the m = t = 2 cells whose generators have degree 2,
        and (c) the ITERATED degree-capped closure answers the same sufficiency question as
        the contract's literal certificate (the single-level degree-4 Macaulay block).
      assigned_to: TASK-20261004-095926
      attack_plan: >-
        Read experiments/EXP-SEMBIN-7e1371/specification.yaml (certificate, invalidation
        rules 1 and 2) ONLY AFTER your blind derivation is written and hashed. (a) At small N,
        build the polynomial-ring degree-D Macaulay matrix with the field equations as explicit
        generators and non-square-free multipliers, reduce modulo x_i^2 = x_i, and compare its
        row space and leading-monomial set with the Boolean-ring single-level span; find a system
        where they differ, or prove they coincide. (b) Report the degree of the generators of the
        window systems from the .ms files and what rule 1 would require. (c) Compare the
        single-level span with the iterated closure at small N: report systems where the
        iterated closure is strictly larger and whether the verdict changes. I expect (a) to
        coincide, (b) a t >= 3 phrasing, and (c) the iterated closure to be strictly larger on
        some systems, which makes the recorded verdict a statement about the iterated
        closure and not about the literal certificate.
      breaking_artifact: >-
        A system where the explicit-field-equation Macaulay span and the Boolean-ring span give
        different verdicts, or a system where the iterated closure and the literal certificate
        give opposite verdicts at D = 4, with the generator seed.
    - joint: >-
        W4 -- THE EVALUATION-CHECK ARGUMENT, AND WHY IT IS ONLY NECESSARY. That the
        -DECH_EVALCHECK build of closure.c evaluates what the notes say it evaluates (every
        row of the elimination's input and output at a verified common zero of the generators),
        that the witness used in each cross-check is such a zero of the system in the .ms
        file, and that a clean reading rules out a bulk out-of-ideal defect of the kind seen
        on M4RI 0.0.20200125 but does NOT rule out out-of-ideal rows that vanish at the one
        witness.
      assigned_to: TASK-20261004-7d2fb6
      attack_plan: >-
        Read ech(), rows_not_vanishing(), closure_set_witness() and the ECH_EVALCHECK branch of
        closure.c and crosscheck_*/xcheck.py. (1) Recompute, with your own parser and evaluator,
        that the witness each cross-check used is a common zero of the .ms system (the zeros come
        from count_m2's lister; list them and find which one the cross-check log names or implies;
        if a log does not name it, say so). (2) Positive control: build the evalcheck variant in
        scratch against a deliberately wrong witness and show it flags (the notes say it flagged
        15 violating generators; reproduce at small N). (3) Necessary-only control: in a scratch
        mutant of closure.c inject, after an elimination, one row p that vanishes at the witness but
        not at another zero (p = (x_a + w_a) times a monomial, with a chosen so the row is outside
        the ideal) and show the evalcheck stays clean while the closure's rank or standard count
        changes. (4) Report how many zeros each cross-checked instance has and which fraction the
        check used. I expect (1) to hold, (2) to flag, (3) to stay clean; the finding is the scope:
        the check is a bulk-defect detector and is necessary only, so it cannot certify soundness
        and it cannot see completeness at all.
      breaking_artifact: >-
        A witness that is not a common zero of the .ms system, an evalcheck build that does not
        evaluate what is stated, or a bulk-corruption mutant that the evalcheck passes (vacuity).
    - joint: >-
        W5 -- THE SHARED PRODUCT-GENERATION CODE (the completeness blind spot). That closure.c's
        product set is complete: every product mu*f with 1 <= |mu| <= D - deg f of every row f
        that must be multiplied is formed exactly once and reaches the elimination, across
        batches, iterations, the single-level path, memory-driven batch splitting and
        checkpoint resume; and that the Coordinator's statement of the closure in
        blind_rederivation.quantity (reproduced in your card) equals what closure.c implements.
      assigned_to: TASK-20261004-7d2fb6
      attack_plan: >-
        (1) STATEMENT VERSUS CODE. Restate in your own words what closure.c does (which rows
        are multiplied: the row_new_ and pivot_new_ logic of install_basis; the multiplier set by
        size; the budget D - popc(leading monomial) with a descending column order; the batch
        cursors a, md, mi; iteration 0; the single-level path; resume) and diff it against the
        statement in your card, including the monomial order (graded reverse lexicographic, x_1
        largest) which the plan author derived from the column layout and Gosper enumeration.
        Report every difference. (2) MUTANTS in scratch (never edit the original): MA multiplier
        budget one lower; MB drop the pivot_new_ branch of install_basis; MC multiply generators
        only; MD discard the last batch of products in each iteration; ME resume that loses the
        partly processed row. Build the unmutated and mutated libraries against a fixed M4RI if you
        can, otherwise state what you linked. Run all on small window-shaped instances you generate
        with the repository generator (code/boolsys.py and code/eq4sys.py; N <= 28; the m = t = 2 shape at small n, plus an eq. (4)-shaped control) and diff rank, standard count and leading counts with
        your own reference closure. (3) Run the PRODUCER'S OWN cross-check procedure (two elimination
        routines plus evalcheck, as in crosscheck_n44_d5/xcheck.py) on each mutant and record whether
        it flags: I expect it flags none of MA to ME that only drop products (the executor says so).
        (4) Build an independent saturation verifier: from the unmutated final basis (closure_row_masks,
        as soundness_probe.py does) check, with your own reducer, that for every basis row r and every
        mu with |mu| <= D - deg r the product mu*r reduces to zero modulo the basis; show it flags every
        mutant that drops products. This is the check that CAN see a missing product. (5) Read the
        guards: col_of2 returning -1 and dropped_terms_, gen_masks_deg for the sizes used, the stderr
        message "closure: count mismatch" (grep the six window lanes' stderr.log for it). I think it
        breaks, if anywhere, at the cursor bookkeeping across batch boundaries and resume, which both
        elimination routines are blind to.
      breaking_artifact: >-
        A defect in the UNMUTATED closure.c (disagreement with your reference closure, or a saturation
        verifier failure on an unmutated basis), or a statement-versus-code difference that changes the
        order or the budget. A mutant the producer's cross-check does not flag is the EXPECTED confirmation
        of the stated blind spot and is not by itself a break.
    - joint: >-
        W6 -- THE TWO CROSS-CHECK COMPARISONS AND THE UNCHECKED INSTANCES. What the n = 44 draw 5
        and n = 45 draw 0 cross-checks establish and what they do not: that they ran a different
        elimination routine and a different batching on the same instance file, that the logged
        leading-monomial digests and iteration profiles are equal as claimed, that the cap-7 attempt
        is correctly classified as an instrument limit, and that no claim is made for the instances that
        were not cross-checked (n = 45 draw 4 and the nine others).
      assigned_to: TASK-20261004-7d2fb6
      attack_plan: >-
        Read crosscheck_n44_d5/ and crosscheck_n45_d0/ (scripts, logs, after_window.sh/.out) and the
        corresponding lane records. (1) Verify from the logs that the routine, batching, cap and
        closure.c hash differ as claimed and that the library loaded was M4RI release-20240729 (the
        m4ri_library field). (2) Verify the equality of the two leading-monomial digests and of the
        per-iteration (rows, rank, new pivots) profiles by parsing, not by reading the NOTES. (3) Verify
        that the system hashed in the cross-check equals the system hashed in the lane record. (4) State
        in one table, per window instance, which checks it carries (structural only; second routine;
        evalcheck) and which verdict polarity it carries. (5) Document the producer's leading-monomial
        hash input format exactly (the function in closure_cert.py), so the Coordinator can decide whether
        the blind lane's canonical digest is directly comparable. I expect (1) to (3) to hold and (4) to show
        that the two cross-checked instances are the only ones with a second routine.
      breaking_artifact: >-
        A log inconsistency (a library, hash, cap or system that differs from the claim), a digest that
        does not match, or a verdict-bearing instance whose carried checks are overstated in the NOTES.
    - joint: >-
        W7 -- INSTANCE PROVENANCE, THE DRAW RULE AND CODE CONTINUITY ACROSS LANES (DV-2, DV-3, DV-4 and
        the in-flight procedure). That each .ms file in the 5ed13e window is the system the closure ran on
        (the .ms, the instance JSON, the generator and system_sha256 agree); that the two draws per n
        are the first solution-free and the first solution-bearing draw of the contract's order, chosen from
        the exact counts before any closure; that M4RI release-20240729 was built as recorded; that the
        closure.c commits d6a21306ee, a6d3b37e17, 9096320e22 (and the later record-logging fixes 1c042d5f80,
        5e1aa460cb) left the rows produced unchanged; and that container restarts, checkpoint resumes and the
        operator pause and restart could not have altered any record.
      assigned_to: TASK-20261004-7d2fb6
      attack_plan: >-
        (1) Independent parse of each of the twelve .ms files and of the matching instance JSON; compare
        the polynomial sets and the recorded system_sha256. (2) From RUN-SEMBIN-9bb990/counts (the exact count
        for every draw of every n), recompute the draw rule per n and compare with the draws that ran.
        (3) For each of the three closure.c commits, read the diff and classify every hunk as affects the
        rows produced, the elimination, memory accounting, checkpoint naming, or logging only; report any hunk
        that is not in the last three classes. (4) For each lane list which code hash produced which record
        (environment.json against the notes) and flag any record produced across a code change. (5) Resume
        test in scratch at small N: kill a closure after iteration k, resume, and compare the final rank,
        standard count and leading-monomial digest with an uninterrupted run, for several k and kill points
        (the package's ckpt_resume_test files show the producer's own test; replicate and extend it).
        (6) Build provenance of the fixed M4RI: commit, configure flags, make check log, library path resolved
        at run time; note the manifest's environment.libm4ri_dev line (DV-2). I expect (1) to (4) to hold and
        (5) to show no alteration; the weakest item is the n = 45 draw 0 lane, which was resumed across a
        closure.c change.
      breaking_artifact: >-
        A .ms that is not the closure's input, a draw that is not the rule's draw, a closure.c hunk that changes
        the rows produced, or a resume that changes the final leading-monomial digest.
    - joint: >-
        W8 -- RECORD INTEGRITY: RAW-TO-SUMMARY AGREEMENT, THE 97 DUPLICATE RECORDS, MANIFEST COMPLETENESS
        AND THE DISCLOSED DEFECTS (DV-5 inventory, DV-6, DV-9). That the 5ed13e results table, results-table.json
        and summary.json are the lane records; that the run count is the declared design (six lanes, two instances
        each, one record per closure degree); that the 97 duplicate records assemble.py resolved in
        RUN-SEMBIN-9bb990 were resolved by a rule that cannot hide a disagreement; that both manifests carry what the
        run schema and AGENTS.md "Artifact policy" require (the inference block is the known gap); that the disclosed
        record defects are exactly as disclosed; and what controls exist, on which library and routine.
      assigned_to: TASK-20261004-7d2fb6
      attack_plan: >-
        (1) Recompute the 5ed13e table from the six lanes' results.jsonl with your own script and diff it with
        window_table.py's output, results-table.json and summary.json (field by field). (2) Read assemble.py's
        duplicate rule; enumerate every duplicate key in the 9bb990 lane records; for each pair compare verdict,
        rank, standard count, status and instrument fields; report any disagreeing pair and which one assemble.py kept.
        (3) Check both manifests against the run schema and the artifact policy; confirm or refute the missing
