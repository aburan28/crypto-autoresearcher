  blind_rederivation:
    required: true
    quantity: >-
      For each of the twelve msolve-format systems S listed under parameters (each a list of M polynomials over F_2 in N variables;
      '+' is sum, '*' is product, '1' the constant; the variable names are on line 1 in order and the characteristic, 2, on line 2),
      work in the Boolean ring B = F_2[x_1..x_N]/(x_i^2 + x_i): every variable is idempotent, a polynomial is a set of square-free
      monomials, a monomial is a subset of {1..N}, and the product of two monomials is their union. The generators are the M
      polynomials AS WRITTEN; no field equation is added as a generator (it is built into B). Fix D = 4.
      DEFINITIONS. deg f = the largest size of a monomial of f. ORDER: size first; among monomials of equal size, m is LARGER than m'
      iff the LARGEST variable index in the symmetric difference of m and m' belongs to m' (graded reverse lexicographic, x_1 the
      largest variable and x_N the smallest). LM(f) = the largest monomial of f. CLOSURE W = W_4(S) = the smallest F_2-subspace of
      {f in B : deg f <= 4} that (i) contains every generator and (ii) satisfies: for every f in W and every square-free monomial mu
      with 1 <= |mu| <= 4 - deg f, the product mu*f (computed in B) lies in W. The budget uses deg f and not the degree of the
      product; no product is formed when |mu| + deg f > 4.
      QUANTITIES per S. (1) c = the number of monomials of size at most 4. (2) r = dim W. (3) whether 1 is in W. (4) the set
      LM(W) = {LM(f) : f in W, f nonzero}, reported as the counts of its members of each size 0 to 4 and as the SHA-256 of the
      ascending list of its monomial bitmasks (bit j-1 set iff x_j is in the monomial; decimal integers, one per line, newline
      terminated). (5) N_std = the number of square-free monomials of ALL sizes 0..N that contain NO member of LM(W) as a subset.
      (6) |V| = the number of points a in F_2^N with f(a) = 0 for every generator f. (7) the verdict: "sufficient" iff N_std = |V|;
      "insufficient" iff N_std > |V|; "impossible" iff N_std < |V| (which cannot occur for a W inside the ideal of S, and indicates an
      error of the implementation or of this statement).
      The plan author derived the ORDER and the multiplier BUDGET from the producer's column layout and loops, not from a published
      definition. If you cannot make the quantity well-posed from this statement, that is the finding: report it and stop, do not read
      the producer's code to disambiguate.
    parameters: >-
      D = 4. The twelve systems, by path (read ONLY these twelve .ms files from the run package):
      experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-5ed13e/closure_m2_n40/cells/instances/ch_n40_m2_t2_k20_low_B_ran_s20260913101_d0.ms and ..._s20260913102_d1.ms;
