    output_verbatim:
    - 'joint ''W1 -- RANK, STANDARD-MONOMIAL ARITHMETIC AND THE VERDICT RULE. That the quantities a degree-capped closure
      reports (the number of monomials of size at most D, the rank, the standard-monomial count over ALL sizes, the leading-monomial
      data) mean what the verdict rule needs: "sufficient" is std = |V|, "insufficient" is std > |V|, "std < |V|" is impossible
      for a closure inside the ideal; std can exceed (columns minus rank) because standard monomials above degree D are counted;
      a missing product can only RAISE std while an out-of-ideal row can lower it; and which polarity depends on the monomial
      order.'' is assigned to TASK-20261004-095926, which filed no review_attestation'
    - joint 'W2 -- THE EXACT COUNT AS DENOMINATOR. That |V| = the number of points of F_2^N satisfying every generator is
      the right denominator (it equals dim B/I because the Boolean ring makes every point F_2-rational and the ideal radical),
      and that the count for each of the twelve window systems is reproducible by a method independent of the closure and
      of the producer's two counters.' is assigned to TASK-20261004-095926, which filed no review_attestation
    - joint 'W3 -- CONTRACT CONFORMANCE OF THE CLOSURE CERTIFICATE (DV-7, both runs). Whether (a) the implicit Boolean ring
      is equivalent to the field equations "as explicit generators" that invalidation rule 2 requires, (b) invalidation rule
      1's "degree 3" generators can be read to cover the m = t = 2 cells whose generators have degree 2, and (c) the ITERATED
      degree-capped closure answers the same sufficiency question as the contract's literal certificate (the single-level
      degree-4 Macaulay block).' is assigned to TASK-20261004-095926, which filed no review_attestation
    - joint 'W4 -- THE EVALUATION-CHECK ARGUMENT, AND WHY IT IS ONLY NECESSARY. That the -DECH_EVALCHECK build of closure.c
      evaluates what the notes say it evaluates (every row of the elimination's input and output at a verified common zero
      of the generators), that the witness used in each cross-check is such a zero of the system in the .ms file, and that
      a clean reading rules out a bulk out-of-ideal defect of the kind seen on M4RI 0.0.20200125 but does NOT rule out out-of-ideal
      rows that vanish at the one witness.' is assigned to TASK-20261004-7d2fb6, which filed no review_attestation
    - 'joint ''W5 -- THE SHARED PRODUCT-GENERATION CODE (the completeness blind spot). That closure.c''s product set is complete:
      every product mu*f with 1 <= |mu| <= D - deg f of every row f that must be multiplied is formed exactly once and reaches
      the elimination, across batches, iterations, the single-level path, memory-driven batch splitting and checkpoint resume;
      and that the Coordinator''s statement of the closure in blind_rederivation.quantity (reproduced in your card) equals
      what closure.c implements.'' is assigned to TASK-20261004-7d2fb6, which filed no review_attestation'
    - 'joint ''W6 -- THE TWO CROSS-CHECK COMPARISONS AND THE UNCHECKED INSTANCES. What the n = 44 draw 5 and n = 45 draw 0
      cross-checks establish and what they do not: that they ran a different elimination routine and a different batching
      on the same instance file, that the logged leading-monomial digests and iteration profiles are equal as claimed, that
      the cap-7 attempt is correctly classified as an instrument limit, and that no claim is made for the instances that were
      not cross-checked (n = 45 draw 4 and the nine others).'' is assigned to TASK-20261004-7d2fb6, which filed no review_attestation'
    - joint 'W7 -- INSTANCE PROVENANCE, THE DRAW RULE AND CODE CONTINUITY ACROSS LANES (DV-2, DV-3, DV-4 and the in-flight
      procedure). That each .ms file in the 5ed13e window is the system the closure ran on (the .ms, the instance JSON, the
      generator and system_sha256 agree); that the two draws per n are the first solution-free and the first solution-bearing
      draw of the contract's order, chosen from the exact counts before any closure; that M4RI release-20240729 was built
      as recorded; that the closure.c commits d6a21306ee, a6d3b37e17, 9096320e22 (and the later record-logging fixes 1c042d5f80,
      5e1aa460cb) left the rows produced unchanged; and that container restarts, checkpoint resumes and the operator pause
      and restart could not have altered any record.' is assigned to TASK-20261004-7d2fb6, which filed no review_attestation
    - 'joint ''W8 -- RECORD INTEGRITY: RAW-TO-SUMMARY AGREEMENT, THE 97 DUPLICATE RECORDS, MANIFEST COMPLETENESS AND THE DISCLOSED
      DEFECTS (DV-5 inventory, DV-6, DV-9). That the 5ed13e results table, results-table.json and summary.json are the lane
      records; that the run count is the declared design (six lanes, two instances each, one record per closure degree); that
      the 97 duplicate records assemble.py resolved in RUN-SEMBIN-9bb990 were resolved by a rule that cannot hide a disagreement;
      that both manifests carry what the run schema and AGENTS.md "Artifact policy" require (the inference block is the known
      gap); that the disclosed record defects are exactly as disclosed; and what controls exist, on which library and routine.''
      is assigned to TASK-20261004-7d2fb6, which filed no review_attestation'
    - joint 'W9 -- RUN-SEMBIN-9bb990 VALIDITY CLASSIFICATION AND STOPPING RULE 4 (DV-8; Q-B). That the closure and single-level
      records are rightly labelled invalid-or-unverified for the stated reason; that the diagnosis chain in the package (evaluation-check
      logs on 0.0.20200125 and on 20240729, the PLUQ failure, the replay) supports the stated cause and does not claim more
      than it isolates (the upstream-commit attribution is stated as NOT isolated); that the exact counts are independent
      of M4RI; which record classes depend on M4RI at all; and whether stopping rule 4 fired in the contract's sense.' is
      assigned to TASK-20261004-7d2fb6, which filed no review_attestation
    - joint 'W10 -- THE UNAVAILABLE 92 FILES AND THE DIGEST-ONLY PACKAGE (Q-B). That the 92 instance files (each larger than
      1 MiB, about 1.1 GB together) that are hash-listed and not tracked can be regenerated byte-for-byte from the generator
      code and the seeds, that every result record that ran on one of them carries a system_sha256 present in the list, and
      that no claim Q-A or Q-B depends on a file nobody can open.' is assigned to TASK-20261004-7d2fb6, which filed no review_attestation
