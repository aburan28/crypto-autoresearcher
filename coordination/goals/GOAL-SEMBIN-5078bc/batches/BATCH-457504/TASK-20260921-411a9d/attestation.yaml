                                                             # step-degree passage

  sources_deliberately_not_read:
    - path: coordination/review/sembin-20260921-457504/review-plan.yaml#coordinator_prior
      why: >-
        Named in this task's blind_from. Reading it would make this report a
        measurement of the Coordinator's expectation rather than of the run.
      how_avoided: >-
        The plan was loaded in Python and every `coordinator_prior` key was
        replaced with a placeholder string BEFORE anything was printed, so the
        block's contents never entered this session. The rest of the plan --
        claim, joints, attack plans, blindness, proves_too_much.objects,
        blind_rederivation, composition -- was read in full, as the plan intends
        for a joint's owner.
    - path: coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-f2d82f
      why: sibling reviewer (J-1, validator); blind_from
      how_avoided: never opened; directory did not exist at the time of writing
    - path: coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-f1e5bd
      why: sibling reviewer (J-3, blind re-derivation); blind_from
      how_avoided: >-
        Never opened. Its directory was visible in a listing of the batch
        directory (the parent of this task's own write_scope, which had to be
        created). The directory NAME was seen; no file inside it was read, listed,
        or grepped. Disclosed here because visibility of a name is not a read but
        should not go unrecorded.
    - path: coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/claims
      why: not in this task's inputs; not read
      how_avoided: name seen in the same directory listing; contents never opened

  read_sibling_reports: false
  blind_from_respected: true
  blindness_note: >-
    No blindness was lifted for this task; the plan's `lifted_for` is empty. The
    one incidental exposure is the sibling directory NAME recorded above.

  work_performed:
    runs_launched: 0
    maximum_runs_in_card: 0
    computation_performed: >-
      Exact finite recomputation from committed records only: satisfiability split
      of the 9 map-supporting instances, seed/draw coverage, closure per-D verdict
      bases and post-hoc verdicts, naive-versus-Semaev divergence across all
      completed traces, single-level degree and deficit coverage, cell coverage at
      n = 12, and a grep for the contract's metric names across the experiment
      tree. No solver, no msolve, no measurement, and no modification of any
      record outside this task's write_scope.
    write_scope: coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-411a9d
    files_written:
      - report.md
      - objections.json
      - attestation.yaml
    wrote_outside_write_scope: false

  procedure_deviation_by_this_reviewer:
    - id: PD-RT-1
      what: >-
        This task's bounds said "Run no git command." One git command was run:
        `git status --porcelain`, read-only, once, after the deliverables were
        written.
      why: >-
        To confirm that nothing had been written outside the assigned write_scope.
        That was the wrong instrument for the check -- `ls` on the two directories
        would have answered it without touching git.
      effect_on_findings: >-
        None. It mutated no state, read no record, and produced two lines of
        output naming this task's own directory and the sibling task directory
        TASK-20260921-f1e5bd (a name already visible in an earlier `ls` of the
        batch directory, and already disclosed above). No sibling file was opened.
      disclosed_rather_than_absorbed: >-
        Recorded because a bound is not waived by the act turning out harmless.
        AGENTS.md: a precondition judged by its outcome has stopped being a
        precondition.

  headline_findings:
    metric_verdict: >-
      The contract's D_macaulay_rank_statistic was never computed. run_cells.py:148
      binds that metric name to closure_D, a third quantity that is F4-side by its
      own definition. The substitution is disclosed nowhere as a deviation and
      manifest.protocol_deviations is empty.
    unit_ideal_count_among_the_9: 5
    stronger_case: prosecution
    falsification_criterion_sound: false
    interpretation_limits_respected: true
    completion_criterion_1_earned_by_this_run: false

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    independent_session: true
    independent_session_basis: >-
      Dispatched as a separate red-team subagent session with no producer context.
      This session did not author RUN-SEMBIN-b6eb9f, EXP-SEMBIN-c2c312,
      H-SEMBIN-112e2e or the review plan, and read no sibling reviewer's output.
    resolved_model_id: claude-opus-5 (session-configured; the serving model may differ)
    resolved_model_id_provenance: >-
      SELF-REPORT by this session, not a probe result. No adapter backend is
      credentialed in this checkout.
    model_verified: false
    backend: cursor_cloud_agent
    runtime: claude_code_compatible
    fallback_used: true
    fallback_note: >-
      Declared up front in this task's handoff card: no adapter backend is
      credentialed in this checkout, so the runtime-native binding permitted by
      AGENTS.md core rule 16 is the only route. fallback_allowed is true on the
      card. Amazon Bedrock was not selected, configured, probed or contacted.
    degraded_allowed: false
    degraded_requirements: []

  independence_qualifications:
    - >-
      model_verified is FALSE throughout this round. The resolved model identifier
      above is a self-report and has not been confirmed by
      `orchestration.adapter doctor --probe`. Any composition of this round must
      carry that forward and must not present these reports as
      pairwise-distinct-model corroboration.
    - >-
      This report is one blinded reviewer's verdict on ONE joint plus the round's
      proves-too-much control. It is not a verdict on RUN-SEMBIN-b6eb9f's validity,
      on the correctness of its degree numbers, or on the claim as a whole. J-1 and
      J-3 own those and I could not see them.
    - >-
      Where a J-2 finding touches another joint's territory -- the matched-null
      control's non-evaluation, and the empty manifest.protocol_deviations field --
      the fact is stated and the validity consequence is deferred, not asserted.
    - >-
      I did not verify that the values in results-table.json are correct. I read
      them as given and recomputed derived quantities from them. If the underlying
      records are wrong, the counts in this report inherit that error; the blind
      re-derivation of the underlying values is J-3's assignment.
    - >-
      This report is a working-tree artifact until the Coordinator's ledger archive
      task TASK-20260921-064ae9 commits it. It is not durable evidence before then
      and asserts no research-state transition.

