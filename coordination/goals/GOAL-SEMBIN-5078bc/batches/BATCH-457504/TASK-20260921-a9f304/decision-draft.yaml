    not_warranted: >-
      Nothing is promoted, and the reason is concrete rather than a formality. The
      round's one durable finding - that Semaev's d_F4 and GOAL-DREG-001's
      Macaulay-rank statistic are not directly commensurable because the latter's
      degree is an input - is ALREADY CARRIED by KN-OPEN-d218ec, which records that
      definitional gap and assigns EXP-SEMBIN-c2c312 to reconcile it, and it was
      already stated in EV-DREG-008's committed boundaries block seven weeks
      earlier. Promoting it now as a KN-FIND would assert a settled finding where
      the reconciliation this very round was assigned to produce did not happen, and
      would convert an open problem into a finding on the strength of a definitional
      reading. KN-OPEN-d218ec correctly stays OPEN and its assignment is
      unsatisfied; what would close it is next_actions[1] and [2]. Promotion is also
      not required under the coordinator contract, which mandates a KN-FIND only on
      `support` or `reject_scoped` backed by `replicated` or `strong` evidence -
      this decision is `inconclusive` on evidence of strength `inconclusive`. Two
      items are DEFERRED rather than declined, each with its blocking condition -
      the cross-engine cross-convention agreement of closure_D with F4 termination
      on 11 rows (a technique-level datum about the closure certificate) waits on a
      non-degenerate instance count above the current four, since five of nine are
      unit-ideal where agreement is forced; and the measured obstruction recorded in
      EV-SEMBIN-c6e9ad, together with its constructive resource reading, waits on
      the successor sweep of next_actions[1] to give it a degree-valued companion.
      Neither is declined and both are named here so a later curation pass can find
      them.
    note: >-
      KN-OPEN-d218ec is not edited by this task - it is outside the declared write
