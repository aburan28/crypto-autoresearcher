  official_transitions:
    EXP-SEMBIN-c2c312:
      from: approved
      to: analyzed
      basis: >-
        The run completed, three independent reviews returned, and this decision
        plus experiments/EXP-SEMBIN-c2c312/analysis.md compose them. `analyzed` is
        the accurate lifecycle state - the experiment has been analysed, and the
        finding of the analysis is that it did not measure its own declared primary
        metric. Bookkeeping disclosure: the specification's status field was never
        advanced to `running` or `completed` while the run executed, so this
        transition reads approved -> analyzed and skips two states that were
        factually passed through. The run record, not the specification, carries the
        execution history.
    H-SEMBIN-112e2e:
      from: specified
      to: specified
      transition: none
      basis: >-
        NO MOVEMENT, deliberately. Two facts bear on this hypothesis and point in
        opposite directions, and this is the reasoning that resolves them. Read
        alone, the first is adverse - the hypothesis predicted d_F4 <= D with
        STRICTNESS on at least one instance and the separation is 0 on every row
        where both instruments returned, which looks like a weakening. Read
        alongside the second it carries no adverse weight at all, because the
        quantity the hypothesis named was never measured as an output anywhere in
        the run. Three findings settle it for the second reading. (1) The observed
        zero is between d_F4 and closure_D, an F4-side quantity; scoring the
        hypothesis against it would repeat the exact substitution this round
        identified. (2) Coverage cannot carry a strictness verdict - of the four
        cells where the hypothesis predicts strictness, two produced no row with
        both instruments and four of the five rows from the other two are
        unit-ideal, leaving exactly ONE non-degenerate separation-cell observation
        (sem_n19_m3_t3_k7_low_B_equ_s20260913001_d0). (3) Strongest - the
        hypothesis states that the predicted separation IS the excluded "No pairs
        to reduce" tail, and that tail is EMPTY in this engine on all 749 observed
        F4 rounds, so the hypothesis's own mechanism predicts separation 0 here.
        The observed 0 is therefore consistent with the hypothesis under the
        instrument used rather than adverse to it. A non-observation inside a regime
        where the predicted cause is absent by construction is evidence about the
        instrument, not about the prediction. The hypothesis's own second assumption
        anticipated this outcome - if the instrument cannot be made commensurable,
        "this hypothesis is untestable as stated and the honest outcome is an
        impediment, not a result." The counter-argument is recorded rather than
        glossed: a run under this hypothesis's validation experiment did complete,
        and a procedural reading of the lifecycle would advance it to `analyzed`.
        That is declined because `analyzed` asserts evidence about this hypothesis
        was analysed, and none was produced for its declared quantity.

  completion_criteria_assessment:
    criterion_1: >-
      NOT MET, and NOT MET ON EITHER BRANCH. The criterion requires a committed
      Coordinator decision stating the map between Semaev's d_F4 and
      GOAL-DREG-001's Macaulay-rank d_reg/D, INSTRUMENTED ON IDENTICAL INSTANCES,
      so that campaign's existing measurements read either as bearing on
      Assumption 1 or explicitly as not bearing on it, and it says in terms that
      an unstated map does not satisfy it. Three independent failures, any one of
      which is sufficient. (a) WRONG MAP. The map actually instrumented is
      d_F4 <-> closure_D. closure_D is F4-side by its own written definition in
      code/closure_cert.py ("G_D is a Groebner basis <=> F4 completes with step
      degree <= D"), so it cannot stand on the Macaulay side of the criterion's
      map. The criterion's map has no measured value anywhere in the package.
      (b) NO IDENTICAL INSTANCES. The instance intersection with GOAL-DREG-001 is
      EMPTY. EV-DREG-008's cell is n=12, t=3, ti=0, seed=2026, D=6 and no instance
      in RUN-SEMBIN-b6eb9f matches it. "Instrumented on identical instances" is
      therefore unsatisfiable from this package regardless of which quantities are
      compared. The hypothesis's own test_boundary required GOAL-DREG-001's
      block-m4ri instrument to be re-run on instances generated here, and it was
      not run. (c) ARGUED, NOT INSTRUMENTED. The narrow map that CAN be stated -
      that EV-DREG-008's reported deficit_genuine = 17947 is a rank at a frozen
      INPUT degree D = 6 rather than a degree the system attains, and so does not
      bear on Assumption 1 - rests on a definitional reading of a function
      signature plus that record's own committed boundaries text, which already
      said "Structural deficit_genuine is not theoretical d_reg" seven weeks
      earlier. A criterion asking for an instrumented map is not discharged by an
      argued one, and a criterion about a campaign's measurementS is not
      discharged by a statement about one of them - the distinction holds for
      EV-DREG-008's frozen-D rank and FAILS for GOAL-DREG-001's campaign-level
      d_reg(n), d_ff and gap(n), which that goal's own completion criterion sweeps
      D to obtain as outputs.
    which_branch: >-
      NEITHER. The criterion offers two branches, "bearing on Assumption 1" and
      "explicitly as not bearing on it", and states that either answer satisfies
      it. This decision takes neither. The plausible branch remains the second one
      and it remains OPEN and reachable; what is missing is instrumentation, not
      an argument.
    is_it_unreachable: >-
      No. The criterion is reachable and this decision does not report it as
      blocked. Reaching it needs the Macaulay statistic obtained as an OUTPUT on
      cells shared with GOAL-DREG-001, which is next_actions[0] and [1].
    honest_summary: >-
      This is the result the campaign least wanted and it is stated without
      softening. The criterion is no nearer discharged after this batch than
      before it, because the one thing it asks for - instrumentation across the two
      campaigns' quantities on shared instances - is the one thing the run did not
      do. Recording it as partially met on the strength of a definitional
      observation would discharge it on a technicality, and the criterion's final
      clause exists to forbid exactly that.

  confirmed_priors:
    - >-
      Full scoring of all seven pre-recorded priors, with the evidence and the
      reviewer that settled each, is at
      coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-a9f304/scored-priors.json.
      Summary - 5 confirmed, 2 refuted, 0 untested.
    - >-
      P-1 CONFIRMED (J-1), and strengthened against the run. The byte-identity
      control was reframed from a comparison into an assertion; J-1 performed the
      missing per-record comparison and it PASSED. Coordinator recomputation adds
      that code/run_cells.py assigns input_sha256 and system_sha256 from the same
      variable, so the run's own check is vacuous within a record and could not
      have failed. The control's outcome is true on J-1's evidence, not the run's.
    - >-
      P-2 CONFIRMED (J-3), with an amended count. The headline reproduces EXACTLY
      from raw records and the definitions, with the producer's derived fields
      dropped from 151 records first - largest_separation 0,
      separation_vs_naive_counts {0: 11}. The count is 11 rows, not the 9 the prior
      and the manifest state. See the reconciliation below.
    - >-
      P-3 CONFIRMED (J-2, OBJ-1). The contract's declared primary metric was never
      computed as an output; closure_D was substituted and the substitution was
      undeclared (manifest.yaml protocol_deviations []). The plan's own least
      hostile reading survives only in part - the CONTRACT is genuinely defective
      for declaring a primary metric that is not a degree, but the plan's hope that
      closure_D is "the output quantity the comparison actually needs" fails,
      because closure_D is F4-side and so cannot sit on the Macaulay side of the
      map. The run built a real instrument for a different comparison.
    - >-
      P-4 CONFIRMED (J-2). The falsification criterion is unsound as written - it
      conflates the degree at which a Macaulay matrix is BUILT with the degree a
      system ATTAINS. Its antecedent is factually satisfied on the measured rows
      and its consequent is REFUSED. A Coordinator applying the contract
      mechanically would record that GOAL-DREG-001's degree-5/6 measurements are in
      tension with Assumption 1, which is the opposite of what the evidence
      supports. Recording this refusal is a finding ABOUT the protocol; the
      criterion stands in EXP-SEMBIN-c2c312 exactly as written and is NOT amended
      here, and no success criterion is restated after the fact.
    - >-
      P-5 CONFIRMED (J-1). The success criterion is not fully met - the
      matched-null conjunct is UNEVALUABLE because the null's F4 hit the 3600 s
      wall cap and its closure returned undetermined, so no null separation exists.
      Invalidation rule 3 is likewise unevaluable, which is neither passed nor
      triggered. Under core rule 5 the cap is an infrastructure outcome and says
      nothing mathematical. The producer's substitute claim (the degree-4
      SUFFICIENT verdict is not a Macaulay-shape artifact, null rank 11186 of 59536
      against the structured system's 59530) looks true and useful and is recorded
      as a substitution rather than absorbed.

  refuted_priors:
    - joint: J-2 (the metric and the map)
      prior: >-
        P-6, which the plan flagged THIS_IS_THE_PREDICTION_I_MOST_EXPECT_TO_LOSE -
        "the experiment's OBJECTIVE is answered, and answered in the negative
        direction ... Completion criterion 1 is satisfiable on the 'explicitly as
        not bearing on it' branch it names."
      finding: >-
        OVERTURNED, and the plan's own escape clause fired verbatim. That clause
        read - "If a reviewer shows that the input-versus-output distinction is
        argued and not measured, then the run did not settle the map -- it stated
        it -- the honest decision is `inconclusive` rather than `refine`, the
        finding is a technique note rather than evidence, and completion criterion
        1 stays open." J-2 showed exactly that on three counts: the distinction is
        argued in prose in task-report.md and measured by no instrument; it was
        already recorded in EV-DREG-008's own boundaries block; and there is no
        shared cell with the target campaign, so "instrumented on identical
        instances" is unsatisfiable from this package. Coordinator recomputation
        adds that the DREG-side instrument ran on 31 instances and returned a
        degree on NONE of them - the material for a real map was in the package and
        was not used to build one. The Coordinator held that the objective was
        answered; it was stated, not answered.
      consequence: >-
        Completion criterion 1 stays open, the transition is inconclusive rather
        than refine, and the finding is recorded as a technique-level observation
        rather than as evidence about the hypothesis. The plan said it "would
        regard that as the most valuable outcome this round could produce"; that
        assessment is affirmed here rather than quietly dropped now that it is the
        actual outcome.
    - joint: composition (all three joints, plus the plan's own conditional)
      prior: >-
        P-7 - "The correct decision is `refine`."
      finding: >-
        OVERTURNED on the positive half; the three exclusions it names all hold and
        are adopted. Not `support` - the predicted strictness was not observed. Not
        `weaken` or `reject_scoped` - the hypothesis's quantity was never measured,
        and a single unreplicated empirical-only run cannot carry reject_scoped
        under docs/claims-and-verification.md in any case. Not `replicate` as a
        first move - the same instrument pair reproduces the same definitional gap.
        What falls is `refine`: refining presupposes a comparison that ran and needs
        sharpening, and here the declared primary metric was never computed as an
        output at all, so there is no measured comparison to refine. The next move
        is to BUILD the instrument, which is what inconclusive plus a named
        successor records. P-7's explicitly_open clause pre-committed this:
        "`inconclusive` is a legitimate alternative and follows immediately if P-6
        falls."
      consequence: >-
        The transition is `inconclusive`. The Coordinator records that its own
        prior was the single thing most likely to produce the failure mode this
        round was designed to catch - a decision that reads as rigorous because it
        recites three reviews while choosing the transition that keeps a completion
        criterion within reach. The pre-recorded conditional, not in-the-moment
        judgement, is what prevented it.

