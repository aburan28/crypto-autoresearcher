    agreement between two F4-side quantities. GOAL-SEMBIN-5078bc's first
    completion criterion is NOT MET, on neither of its two branches.
    H-SEMBIN-112e2e does NOT move and stays `specified`. EXP-SEMBIN-c2c312 moves
    approved -> analyzed. Stated plainly: this run settled less than the campaign
    hoped, and the honest reason is a metric substitution rather than an
    interesting mathematical obstruction. Nothing here bears on Assumption 1 or
    Assumption 2 or on the security of any curve, in either direction.

  context: >-
    EXP-SEMBIN-c2c312 exists to decide whether Semaev's d_F4 and GOAL-DREG-001's
    Macaulay-rank statistic are commensurable quantities, which is the open problem
    recorded as KN-OPEN-d218ec and the content of GOAL-SEMBIN-5078bc's first
    completion criterion. RUN-SEMBIN-b6eb9f declared itself completed_valid and
    reported closure_D - d_F4 = 0 on 9 instances. Three mutually blind reviewers
    were dispatched under a review plan written before any of them ran, holding
    seven pre-recorded coordinator priors: J-1 TASK-20260921-f2d82f on validity and
    controls (verdict breaks, run validity incomplete), J-2 TASK-20260921-411a9d on
    the metric and the map (verdict breaks), J-3 TASK-20260921-f1e5bd on blind
