  limitations:
    - >-
      Tier `toy`, capped, and no transfer. n <= 21, N <= 60, no correspondence.
      Semaev's conclusion concerns n = 409 and 571. Nothing here extrapolates.
    - >-
      COMMENSURABILITY ONLY. specification.yaml's interpretation_limits forbid this
      run bearing on Assumption 1 or Assumption 2 or on any deployed curve, IN
      EITHER DIRECTION. This decision asserts neither that GOAL-DREG-001's
      degree-5/6 measurements bear on Assumption 1 nor that they do not. Refusing
      the falsification criterion's consequent is a refusal to conclude, not a
      conclusion in the opposite direction.
    - >-
      Scoped to msolve's F4 with its field-equation convention, the closure
      certificate at caps D in {2, 3, 4}, and the single-level Macaulay instrument
      at D in {3, 4}. Every conclusion is scoped to that solver, those instruments
      and those caps.
    - >-
      What J-3's re-derivation does and does not establish. It establishes that the
      producer's reported quantities follow from the raw records under the written
      definitions, independently of the producer's implementation. It does NOT
      establish that the raw records are correct, because both reviewer and producer
      read the same msolve logs, and it does not establish that the quantities are
      the right ones to have computed - that is J-2's joint and J-2 says they are
      not. A clean re-derivation of a substituted metric is a clean re-derivation of
      a substituted metric.
    - >-
      Exact module bytes are not recoverable for 4 of 11 modules (code.dirty true,
      4 code_sha256 mismatches), so an independent rebuild from source cannot be
      guaranteed byte-identical. J-3's re-derivation from raw records is unaffected
      in what it checks.
    - >-
      This round's review independence was confirmed by reading attestations, NOT
      by tools/check_review_independence.py, which fails on a schema naming
      mismatch (PD-4). No claim is made that the automated check passed.
    - >-
      The d_F4 values are the producer's convention, not Semaev's literal rule,
      whose exclusion is vacuous here (0 of 749 rounds). On the 11
      separation-bearing rows the two conventions agree so the headline is
      unaffected; on sem_n12_m6_t6_k2_low_B_ran_s20260913004_d3 they differ by 1
      and that instance has no closure_D, so the divergence never reaches a
      measured separation.
    - >-
      One unresolved confound is recorded and not dissolved - no instance isolates
      the field-equation convention's effect on closure_D, so the possibility that
      the two conventions coincide over this narrow parameter range is not excluded
      by measurement, only made less likely by the cross-engine agreement.
    - >-
      The obstruction recorded in EV-SEMBIN-c6e9ad is filled although
      `direction: neutral` does not require it, because it carries the round's
      reusable measured content. It is not a lane closure and no lane is closed by
      this decision.

  next_actions:
    - >-
      [1] DESIGN a superseding experiment contract that defines the DREG-side
      metric as an OUTPUT. The quantity must be a degree - the least D at which a
      stated rank condition is reached - obtained by sweeping D upward, not a rank
      at a supplied D. This requires probing D >= 5, because on every structured
      instance in RUN-SEMBIN-b6eb9f the degree-4 Macaulay matrix is far from
      determining (deficit_vs_semiregular 46 to 67); the existing D = 3 and D = 4
      ranks on 31 instances are starting data, NOT a shortcut. Designing is not
      approving; the contract sits at approved_by null until a committed
      Coordinator decision approves it under the standing user authorization once
      complete. The contract must declare its memory and wall budgets against the
      caps that already bit at N >= 38, and must state a stopping rule for the
      sweep.
    - >-
      [2] The successor must instrument BOTH campaigns' quantities on AT LEAST ONE
      SHARED CELL, beginning with EV-DREG-008's cell (n=12, t=3, ti=0, seed=2026,
      D=6), and must re-run GOAL-DREG-001's block-m4ri instrument on instances
      generated there, as H-SEMBIN-112e2e's own test_boundary already requires.
      Without a shared cell, completion criterion 1's "instrumented on identical
      instances" clause cannot be satisfied no matter what is measured. This is the
      single action that most directly advances the criterion.
    - >-
      [3] Choose an F4 engine that can EXHIBIT the phenomenon under test, or
      abandon the excluded-tail mechanism explicitly. The hypothesis says the
      predicted separation IS the excluded "No pairs to reduce" tail, and msolve
      produces no such round in 749 observations, so no parameter choice within
      this engine can test the prediction. Either instrument an engine that emits
      those steps, or record a hypothesis amendment restating the predicted
      mechanism in terms this engine can exhibit. Testing a prediction on an engine
      that zeroes its predicted cause is not a cheaper test; it is not a test.
    - >-
      [4] Fix the coverage defect at the comparison step in whatever contract
      succeeds this one. The closure instrument ran on draw 0 only, so of four
      declared separation cells two produced no comparable row and four of the five
      rows from the other two are unit-ideal, leaving one non-degenerate
      separation-cell observation. Report unit-ideal and satisfiable certificates
      SEPARATELY - they are structurally different tests and pooling them overstates
      the support by more than a factor of two.
    - >-
      [5] Reconcile tools/check_review_independence.py with the plan schema, so
      that `proves_too_much` expressed per object via
      `signature_a_correct_argument_must_show` either satisfies the checker or is
      rejected at plan-authoring time rather than after the round (PD-4). A control
      that a checker cannot see is a control the next round may omit without
      anything failing.
    - >-
      [6] Carry the two measurement defects into the successor contract as explicit
      required checks - a byte-identity control that compares hashes recorded by
      the two instruments SEPARATELY rather than assigning both from one variable,
      and a matched-null budget large enough that the null can actually return a
      separation. Both failed here in ways the run could not detect.

  knowledge_promotion:
