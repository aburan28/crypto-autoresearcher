  decision_label: >-
    Compose REVIEW-SEMBIN-20260921-457504 (three mutually blind joints on
    RUN-SEMBIN-b6eb9f of EXP-SEMBIN-c2c312) into one official reading. The
    transition is INCONCLUSIVE. The run reproduced its headline exactly and
    convention-independently, and the quantity it reproduced is not the one the
    experiment declared or the goal needs: code/run_cells.py binds the contract
    metric name D_macaulay_rank_statistic to the value closure_D, and closure_D is
