  rationale:
    - >-
      The transition is `inconclusive` because the experiment's declared primary
      metric was never computed as an output, so the comparison the contract
      specified was never performed. code/run_cells.py line 148 binds the metric
      NAME D_macaulay_rank_statistic to the VALUE closure_D, and
      code/closure_cert.py defines closure_D by equivalence with F4 termination.
      The reported closure_D - d_F4 = 0 is therefore an agreement between two
      F4-side quantities. This is a definitional finding, checkable from one line
      of binding code and one docstring without running anything, and it would
      stand unchanged if every capped cell had completed.
    - >-
      `support` is unavailable because the hypothesis's predicted STRICTNESS was
      not observed - separation is 0 on all 11 rows where both instruments
      returned - and because the quantity the prediction concerns was not measured.
    - >-
      `weaken` and `reject_scoped` are unavailable, and refusing them is not
      leniency. The hypothesis states that the predicted separation IS the excluded
      "No pairs to reduce" tail; J-3 reports that tail empty on all 749 observed F4
      rounds, so the hypothesis's own mechanism predicts separation 0 on this
      engine and the observed 0 is consistent with it rather than adverse. Coverage
      compounds this - exactly one non-degenerate observation across the four cells
      where strictness is predicted. Separately, docs/claims-and-verification.md
      forbids reject_scoped on a single unreplicated empirical-only run, and no
      counterexample certificate or derivation shows the mechanism failing.
    - >-
      `refine` is unavailable because refining presupposes a measured comparison
      that needs sharpening. There is none to sharpen; the instrument for the
      criterion's map does not exist yet and has to be built.
    - >-
      `replicate` and `expand` are both premature. Re-running or widening the same
      instrument pair reproduces the same definitional gap at greater cost, because
      the gap is in what the instruments measure and not in how many instances they
      measured it on.
    - >-
      Defects of the RUN and defects of the CONTRACT are separated because the
      remedies differ. CONTRACT - it declared a primary metric it never defined and
      which is not a degree, so it cannot be differenced against d_F4, and its
      falsification criterion attaches an unsound consequent to a numerical
      antecedent. No re-run repairs either; both need a superseding contract. RUN -
      it substituted a replacement metric without declaring it
      (protocol_deviations []), asserted a byte-identity control it did not perform
      and implemented vacuously, and carries 4 of 11 mismatched module hashes. Those
      are reporting and implementation defects in the run itself.
    - >-
      The run is NOT recorded as invalid, and that judgement is the composition's
      to own. No invalidation rule was triggered - rule 3 is unevaluable rather
      than fired - the structural and known-false controls verify on independent
      recomputation, and every reported quantity reproduces exactly under J-3's
      blind re-derivation. What is inaccurate is the run's declared validity
      REASON, which asserts "byte identity holds on every instance" for a check the
      run did not perform. The measurements stand; the warrant stated for them does
      not. The immutable run record is not edited and this disclosure supersedes
      its reason by reference.
    - >-
      What the run earned is recorded rather than flattened away, because a reading
      that returns only defects would be as inaccurate as one that returned only
      the headline. msolve is an independently written F4 carrying the OPPOSITE
      field-equation convention to the closure instrument, and H-SEMBIN-112e2e
      names that convention as an effect able to shift a reported degree by one. The
      closure certificate's equivalence with F4 termination is an ARGUED claim, not
      an inherited theorem, so the 11 exact agreements are a genuine falsifiable
      cross-engine, cross-convention test that could have failed on any row and did
      not. The run also produced a reusable per-instance dataset - single-level
      Macaulay ranks at D = 3 and D = 4 on 31 instances - that a correctly specified
      successor can use as starting data.
    - >-
      The 9-versus-11 reconciliation, adopted here: 11 rows carry both a
      d_F4_semaev and a closure_D value (J-3's coverage.with_both, confirmed by
      coordinator recomputation over results-table.json, against manifest.yaml's
      result.instances_with_both 9). The 11 decompose as 9 distinct structured
      Semaev instances, 1 known-false planted control (ctrl_known_false_N35), and 1
      instrument-identity repeat
      (sem_n17_m3_t3_k6_low_B_equ_s20260913001_d0_repeat). Both figures are
      defensible over different sets and neither artifact states its rule. This
      decision adopts NINE as the count of distinct structured instances bearing on
      the map, and ELEVEN as the count of separation-bearing rows, and states both
      wherever either is used. Separation is 0 on all 11. The producer is not wrong
      to say 9; it is wrong to report one figure in the manifest and the other in
      summary.json with no reconciling note.
    - >-
      One reviewer factual conflict is resolved against the records rather than by
      re-reviewing a joint. J-1 reported 5 instances decided by standard monomials
      and 4 by "1 in W_D"; J-2 reported the reverse. Coordinator recomputation over
      results-table.json on the 9 structured non-repeat rows confirms J-2 - 5 carry
      verdict_basis "1 in W_D" with quotient_dimension 0 and 4 carry "standard
      monomials = |V(I)| = k" for k in {36, 6, 18, 6}. J-1's joint verdict is
      untouched; one factual sub-item inside its report is corrected. A second
      apparent conflict is not one - J-1 says no closure_D was decided by
      F4-supplied quantities and J-2's OBJ-7 says F4 quantities enter the D = 3
      minimality leg; both are right about different legs, since the D = 4
      sufficiency leg is F4-independent while the D = 3 minimality leg cites F4's
      quotient dimension.
    - >-
      Five of the nine structured map-supporting instances are unit-ideal, where
      F4 derives 1 and stops so the agreement is forced by construction - Semaev
      states this himself in section 4.5.1. Two structurally different certificates
      ("1 in W_D", a single containment test, and a standard-monomial
      quotient-dimension match) were reported as one finding. The effective
      non-trivial support for the closure/F4 agreement on structured systems is
      four instances.
    - >-
      Infrastructure outcomes are excluded throughout. Most cells at N >= 38 are
      memory- or wall-capped; under core rule 5 they are not negative mathematical
      evidence and no inference here rests on them. This includes the matched
      null's wall-cap stop, which makes its control unevaluable rather than failed.

