      evaluated from the records. J-3 independently corroborates the truncation
      (null_n17_m3_t3_k6_low_B_equ_s20260913001_d0, recorded_status
      unreached_wall_cap, f4_trace_complete_per_log false). Under core rule 5 the
      cap is an infrastructure outcome and says nothing mathematical in either
      direction.
    - >-
      Code identity is broken for 4 of 11 modules. manifest.yaml records
      code.dirty true and 4 of 11 recorded code_sha256 values do not match the
      files as committed. J-1 reports this and it is not repaired here.
    - >-
      Structural and known-false controls verify. J-1 recomputed both and they
      pass, including on the two identity-repeat copies that the run's own
      structural check never covered.
    - >-
      Cross-engine, cross-convention consistency held where it could have failed.
      J-2 credits that msolve is an independently written F4 implementation
      carrying the opposite field-equation convention to the closure instrument,
      so the 11 exact agreements are a genuine falsifiable test of the closure
      certificate's ARGUED equivalence with F4 termination. That test could have
      failed on any row and did not.
    - >-
      Tail check (i) — per-instance, as the contract requires rather than averaged.
      J-3 reports tail_check_i_hits on 11 of 11 profiles when read raw, and
      tail_check_i_hits_restricted_to_degrees_ge_2 empty — 0 of 11 — on a
      like-for-like comparison at degree >= 2. The raw hits are an artifact of
      differing degree indexing between the two profiles, not a substantive
      disagreement.
    - >-
      Tail check (ii) — untestable as specified. The F4 side of the comparison is
      the empty set on every instance, so the check has nothing to compare.
    - >-
      Most cells produced no mathematical result. Cells at N >= 38 are
      predominantly memory- or wall-capped. J-3 records 3 truncated F4 traces and
      the coverage figures (126 instances seen, 48 with an F4 trace, 15 with
      closure_D, 11 with both). Under core rule 5 these caps are infrastructure
