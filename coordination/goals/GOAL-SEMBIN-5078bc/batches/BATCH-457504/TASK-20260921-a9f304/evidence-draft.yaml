  observations:
    - >-
      Reproduction, exact. The headline separation closure_D - d_F4 = 0 reproduces
      exactly on every instance where both instruments returned a value. J-3
      (TASK-20260921-f1e5bd) re-derived it blind from raw per-instance records and
      the written definitions, having first dropped the producer's derived fields
      from 151 records (d_F4_semaev, d_F4_naive, rounds, f4_empty_step_degrees and
      others) and without reading the producer's summarizer, summary.json,
      results-table.json, task-report.md, NOTES-* or the manifest's result block.
      rederived.json records largest_separation 0 and
      separation_vs_naive_counts {0: 11}.
    - >-
      Instance count, reconciled. Eleven rows carry both a d_F4_semaev value and a
      closure_D value, not the nine the manifest reports
      (result.instances_with_both 9). Coordinator recomputation over
      results-table.json confirms 11, matching J-3's coverage.with_both 11. The
      11 decompose as 9 distinct structured Semaev instances, plus 1 known-false
      control (ctrl_known_false_N35), plus 1 instrument-identity repeat
      (sem_n17_m3_t3_k6_low_B_equ_s20260913001_d0_repeat). Separation is 0 on all
      11. This record adopts 9 as the count of distinct structured instances
      bearing on the map and 11 as the count of separation-bearing rows, and
      states both rather than either alone.
    - >-
      The contract's declared primary metric was never computed as an output.
      code/run_cells.py line 148 binds the contract metric NAME
      D_macaulay_rank_statistic to the VALUE closure_D, so raw records carry both
      side by side and summary.json alone does not reveal the substitution. No
      instrument in the run produced the Macaulay-rank statistic as an output.
      J-2 (TASK-20260921-411a9d) OBJ-1.
    - >-
      closure_D is F4-side by its own definition. code/closure_cert.py states it
      as an equivalence with F4 termination — "G_D is a Groebner basis <=> F4
      completes with step degree <= D". The reported separation is therefore an
      agreement between two F4-side quantities, not a measurement relating d_F4 to
      a Macaulay statistic.
    - >-
      The substitution was not declared. manifest.yaml carries
      protocol_deviations [] and unexpected_observations []. task-report.md
      describes its seven deviations as "all for cost, none for content"; the
      metric substitution is a deviation of content and is not among the seven.
    - >-
      Five of the nine structured map-supporting instances are unit-ideal.
      Coordinator recomputation over results-table.json: 5 instances carry
      verdict_basis "1 in W_D" with quotient_dimension 0
      (sem_n15_m5_t3_k3 at low_B_equ / low_B_ran / ran_B_equ / ran_B_ran, and
      sem_n17_m3_t3_k6_low_B_ran), and 4 carry "standard monomials = |V(I)| = k"
      with k in {36, 6, 18, 6} (sem_n13_m4_t4_k4_low_B_equ,
      sem_n17_m3_t3_k6_low_B_equ, sem_n17_m3_t3_k7_low_B_equ,
      sem_n19_m3_t3_k7_low_B_equ). On a unit ideal F4 derives 1 and stops, so the
      agreement is forced by construction; Semaev states this himself in section
      4.5.1. Two different certificates were reported as one finding.
    - >-
      The exclusion in d_F4's definition never fires in this engine. J-3 reports
      f4_rounds_with_sel_zero_run_wide 0 across all 48 instances with a trace and
      749 F4 rounds, and semaev_literal_exclusion_vacuous_everywhere true; msolve
      never emits "No pairs to reduce". The producer's rule instead excludes
      rounds that added no new basis element, which is a different rule. The two
      rounds it dropped selected 34 and 519 pairs and echelonised an
      84267 x 84198 matrix.
    - >-
      One instance separates the two d_F4 conventions, and it is not decidable
      here. On sem_n12_m6_t6_k2_low_B_ran_s20260913004_d3 the literal Semaev rule
      gives d_F4 5 while the producer's rule gives 4
      (trailing_unproductive_step_degrees [4, 5]). That instance has
      closure_D_available false, so the divergence never reaches a measured
      separation.
    - >-
      The DREG-side instrument ran widely and returned no degree. Coordinator
      recomputation over results-table.json: 31 instances carry a completed
      macaulay_single_level at BOTH D = 3 and D = 4 alongside a d_F4_semaev value.
      On every one, the instrument returns a rank, a column count and a
      semiregular deficit at the degree it was GIVEN. It returns a degree on none
      of them. code/closure_cert.py's macaulay_single_level takes D as an input
      parameter.
    - >-
      Per-cell coverage at the point of comparison, reported per instance because
      the contract's tail_checks require it and an average would hide the cell that
      matters. Coordinator recomputation over results-table.json against the cells
      the hypothesis declares in test_boundary. SEPARATION cells, where the
      hypothesis predicts a STRICT inequality — (15,5,3,3) reached 4 rows with both
      instruments and ALL FOUR are unit-ideal (verdict_basis "1 in W_D",
      quotient_dimension 0), where agreement is forced by construction;
      (19,3,3,7) reached 1 row, sem_n19_m3_t3_k7_low_B_equ_s20260913001_d0, which
      is non-degenerate (quotient_dimension 6, standard-monomial basis);
      (21,3,3,7) reached 0 rows; (12,6,6,2) reached 0 rows. So across the four
      declared separation cells there is EXACTLY ONE non-degenerate observation.
      OFF-DIAGONAL cells — (17,3,3,7) reached 1 non-degenerate row
      (quotient_dimension 18); (17,3,3,8) reached 0 rows. REPRODUCTION cells —
      (13,4,4,4) reached 1 row, (17,3,3,6) reached 3 rows including the identity
      repeat. All cells were generated at the declared 20 instances per cell for
      most cells; the thinness is at the comparison step, not at generation.
    - >-
      The mechanism the hypothesis names has no substrate in the engine used.
      H-SEMBIN-112e2e states that "the predicted separation is exactly the excluded
      tail: the degrees at which the Macaulay instrument still finds
      rank-contributing rows are degrees at which F4, by Semaev's own accounting,
      has no critical pairs left to reduce." J-3 reports that msolve produces no
      such round anywhere — f4_rounds_with_sel_zero_run_wide 0 across 749 rounds,
      semaev_literal_exclusion_vacuous_everywhere true. The excluded tail is
      therefore EMPTY in this engine, so the quantity the hypothesis predicts the
      separation to equal is 0 here by the engine's own behaviour.
    - >-
      The hypothesis's declared instrument was not the one run. test_boundary
      specifies "GOAL-DREG-001's existing block-m4ri Macaulay-rank instrument
      re-run on instances generated here". That instrument was not re-run; the run
      used its own single-level Macaulay instrument and a closure certificate. This
      is the same fact that leaves the instance intersection with GOAL-DREG-001
      empty.
    - >-
      Byte-identity control — reframed, then satisfied by the reviewer rather than
      by the run. The contract asks that both instruments' recorded input hashes be
      COMPARED; manifest.yaml instead asserts they are "equal by construction",
      and validity.reason asserts "byte identity holds on every instance". J-1
      (TASK-20260921-f2d82f) found nothing in the run checked it, performed the
      per-record comparison itself, and it PASSED. Coordinator recomputation adds
      that code/run_cells.py assigns input_sha256 and system_sha256 from the same
      variable, so within a single record the comparison is vacuous and could not
      have failed. The control's stated outcome is true on J-1's evidence, not on
      the run's.
    - >-
      Matched-null control — unevaluable, and therefore not passed. J-1 records
      that the null's F4 hit the 3600 s wall cap (workerA:28, 3600.2 s) and its
      closure returned undetermined at D = 3 and D = 4 with D = 5 above the column
