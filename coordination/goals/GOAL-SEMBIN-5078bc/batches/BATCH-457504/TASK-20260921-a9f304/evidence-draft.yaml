  inference: >-
    This run measured a real quantity and reproduced it cleanly, but it is not the
    quantity the hypothesis names, and it is not a quantity that can bridge the two
    sides of the map the goal needs. The reported separation compares closure_D
    with d_F4, and closure_D is F4-side by its own definition, so the headline is
    an internal consistency check on the F4 side rather than a commensurability
    measurement between Semaev's d_F4 and GOAL-DREG-001's Macaulay-rank statistic.
    The Macaulay-rank statistic was never produced as an output anywhere in the
    run, on any of the 31 instances where its instrument completed at both
    D = 3 and D = 4. The commensurability question this experiment exists to answer
    is therefore not settled by it — neither affirmatively nor negatively. The
    direction is neutral rather than weakening for a specific reason: reading the
    11 zero separations as bearing on the hypothesis's predicted strictness would
    require treating closure_D as the contract's D, which is precisely the
    substitution this review identified, so a weakening direction would have to
    adopt the error in order to record it. There is a second and independent reason
    the direction is not weakening, and it is the sharper one. The hypothesis states
    that the predicted separation IS the excluded "No pairs to reduce" tail. That
    tail is empty in msolve on all 749 observed rounds, so the hypothesis's own
    mechanism predicts separation 0 in this engine; the observed 0 is what the
    hypothesis predicts here, not a counterexample to it. Coverage compounds this:
    of the four cells where the hypothesis predicts strictness, two produced no
    comparable row at all and four of the five rows from the other two are
    unit-ideal, leaving one non-degenerate separation-cell observation. A strictness
    prediction cannot be tested on one row, and it cannot be tested at all in an
    engine whose behaviour zeroes the predicted cause. What the run did earn is narrower and
    real: a cross-engine, cross-convention agreement on 11 rows that could have
    failed, which supports the closure certificate's argued equivalence with F4
    termination, and a reusable per-instance dataset of single-level Macaulay ranks
    at D = 3 and D = 4 on 31 instances that a later, correctly specified
    experiment can build the map from. Separating the defects matters for the
    remedy: the CONTRACT declared a primary metric that is not a degree and cannot
    be differenced against d_F4, which no re-run can fix and which requires a
    superseding contract; the RUN substituted a replacement silently and chose one
    that does not bridge the two sides, which is a reporting and design defect in
    the run itself. The load-bearing part of this record is definitional rather
    than statistical, which is why proof_status is derivation and not
    empirical_only — the conclusion follows from the instruments' own written
    definitions and from one line of binding code, checkable by an independent
    reader without running anything, and it would stand unchanged if every cell
    had completed.

  boundaries:
    - >-
      Scope is COMMENSURABILITY ONLY. specification.yaml interpretation_limits
      forbid this run bearing on Assumption 1 or Assumption 2 or on any deployed
      curve, in EITHER direction, and nothing in this record does. In particular
      this record does not assert that GOAL-DREG-001's degree-5 and degree-6
      measurements do bear on Assumption 1, and does not assert that they do not.
    - >-
      Claim tier toy, and capped there. n <= 21 and N <= 60 with no correspondence
      to cryptographic scale; the conclusion in Semaev's paper concerns n = 409 and
      n = 571. No transfer to larger n is claimed or implied.
    - >-
      Tested scope is msolve's F4 with its field-equation convention, the closure
      certificate instrument at caps D in {2, 3, 4}, and the single-level Macaulay
      instrument at D in {3, 4}. Conclusions are scoped to that solver, those
      instruments and those caps.
    - >-
      The hypothesis's test boundary was not entered, in two independent ways, and
      this bounds every reading of the 0 separation. First, the declared instrument
      (GOAL-DREG-001's block-m4ri Macaulay-rank instrument, re-run on instances
      generated here) was not run. Second, the mechanism the hypothesis names as
      the separation — the excluded "No pairs to reduce" tail — is empty in msolve
      on all 749 observed rounds, so the engine cannot exhibit the predicted
      phenomenon whatever the parameters. A non-observation of strictness inside a
      regime where the predicted cause is absent is not evidence about the
      prediction.
    - >-
      Coverage at the comparison step is one non-degenerate observation per
      predicted regime. Of the four declared separation cells, two produced no row
      with both instruments and four of the five rows from the other two are
      unit-ideal, leaving exactly one non-degenerate separation-cell observation
      (n = 19). The off-diagonal set contributes one more (n = 17, k = 7). No
      strictness prediction can be tested at that coverage, in either direction.
    - >-
      Nine distinct structured instances support the map claim, of which five are
      unit-ideal where the agreement is forced by construction. The effective
      non-trivial support for the closure/F4 agreement on structured systems is
      four instances deciding by a standard-monomial match, plus one known-false
      control and one identity repeat among the 11 rows.
    - >-
      The contract's falsification criterion fired and its attached conclusion is
      REFUSED as unsound. The criterion reads that separation 0 on every measured
      instance would put GOAL-DREG-001's degree-5/6 measurements in tension with
      Assumption 1. Its antecedent is factually satisfied on all 11 rows, and its
      consequent does not follow, because the D that was measured is closure_D and
      not the DREG statistic — the criterion conflates the degree at which a
      Macaulay matrix is BUILT with the degree a system ATTAINS. Recording this is
      a finding about the protocol, not a post-hoc change of success criteria: the
      criterion stands in EXP-SEMBIN-c2c312 exactly as written and is not amended
      here. A later reader who finds "falsification criterion satisfied" and stops
      there will draw the opposite of what the evidence supports. A second reason
      not to read the criterion as fired-and-met — its antecedent names "the
      off-diagonal cells" in the plural, and only one of the two declared
      off-diagonal cells produced any row with both instruments, so the antecedent
      is satisfied only vacuously over the cell that produced nothing.
    - >-
      The contract's success criterion is not fully met. One of its four conjuncts,
      that the matched-null separation differ from the structured separation, is
      unevaluable because the null has no separation at all. Invalidation rule 3 is
      likewise unevaluable, which is neither passed nor triggered — the run is not
      voided by it and is not supported by it.
    - >-
      d_F4 as reported is the producer's convention, not Semaev's literal rule. The
      exclusion Semaev's definition turns on is vacuous in this engine (0 of 749
      rounds), so the reported values are convention-dependent in principle. On the
      11 separation-bearing rows the conventions agree, so the headline is not
      affected; on one instance outside them they differ by 1.
    - >-
      Infrastructure outcomes are excluded. Most cells at N >= 38 are memory- or
      wall-capped. Under core rule 5 they are not negative mathematical evidence
      and support no inference here.
    - >-
      Reviewer independence carries three disclosed qualifications, recorded in
      the snapshot receipt of TASK-20260921-064ae9 and in DEC-20260921-2c62d7's
      procedure_deviations. None of them is assessed as changing a joint verdict,
      and that assessment is the composition's, not the reviewers'.

  unresolved_confounds:
    - >-
      Field-equation convention differs between the two instruments that agree.
      msolve's F4 and the closure certificate carry opposite conventions. J-2
      reads that as strengthening the agreement, since an independently written
      implementation with the opposite convention could have disagreed. It is
      recorded as an unresolved confound rather than settled because no instance
      isolates the convention's effect on closure_D, so the possibility that the
      two conventions happen to coincide over this narrow parameter range is not
      excluded by measurement.
    - >-
      Four of eleven module hashes do not match the committed files, so the exact
      bytes that produced the raw records are not recoverable for those modules.
      J-3's re-derivation from the raw records is unaffected in what it checks, but
      an independent rebuild from source cannot be guaranteed byte-identical.
    - >-
      Nothing in the run isolates whether the 0 separation on the four
      non-unit-ideal structured instances reflects a genuine property of those
      systems or the narrowness of the reachable parameter range, since every
      reached instance returned closure_D 4 and d_F4 4 except the control at 2.
    - >-
      The producer's 9 and J-3's 11 differ on which rows count, and the manifest
      discloses only 9 without stating the rule that selects them. The
      reconciliation above is reconstructed by the composition from
      results-table.json, not read from the run's own statement of its rule.

  obstruction:
    statement: >-
      The single-level Macaulay rank statistic is not a degree. At a supplied
      degree D it returns a rank, a column count and a semiregular deficit; it does
      not return the degree at which the system is solved. It therefore cannot be
      differenced against a termination degree such as d_F4 without an added sweep
      over D to the least degree at which the ideal's degree-D closure is already a
      Groebner basis. This is a property of the two statistics as defined, not of
      any attempt to compare them.
    quantity: >-
      Number of instances on which the run's DREG-side instrument returned a
      degree-valued output, out of the instances where it completed at both
      D = 3 and D = 4 alongside a d_F4_semaev value.
    value: >-
      0 of 31 instances. Exact census over committed records, not a sample, so the
      uncertainty is +/- 0 by construction rather than by estimation. Companion
      figures over the same records, each an exact count — 11 of 11 rows where both
      instruments returned carry separation closure_D - d_F4 = 0; 5 of the 9
      structured instances among them are unit-ideal, where the agreement is forced
      by construction; 0 of 749 F4 rounds fire the exclusion Semaev's definition of
      d_F4 turns on.
    measured_by:
      - RUN-SEMBIN-b6eb9f
      - EXP-SEMBIN-c2c312
    scope: >-
      Toy tier. n in [12, 21], N <= 60, no correspondence to cryptographic scale.
      msolve's F4 with field equations as the F4-side engine; the closure
      certificate instrument at caps D in {2, 3, 4}; the single-level Macaulay
      instrument at D in {3, 4}. The 31 instances are those with a completed
      single-level result at both D = 3 and D = 4 and a d_F4_semaev value. Claimed
      over exactly that set and nowhere else; in particular this is not claimed
      over GOAL-DREG-001's cells, which share no instance with this run.
    resource_check:
      examined: true
      reading: >-
        Examined, and a resource reading was found. The property that blocks the
        comparison — that D is an INPUT to the Macaulay statistic rather than an
        output — is exactly what makes that statistic auditable in advance, and
        that is a hypothesis rather than a defect for two distinct programmes.
        First, a non-adaptive degree witness. A quantity produced by running an
        algorithm to termination cannot be bounded before the run, because its cost
        schedule is chosen by the solver; a rank at an analyst-chosen degree can be,
        because the analyst picks the degree. So the input-ness is the premise of
        any scheme that wants to certify a degree claim at a cost independent of a
        solver's pair-selection strategy, which is what GOAL-DREG-001's sweep over
        D already relies on. Second, and more concretely here, the bridge object is
        the one this run already built. The closure certificate instrument converts
        fixed-degree rank and standard-monomial tests into a termination-degree
        claim precisely by sweeping D upward to the least sufficient cap. That is
        the missing half of the map read constructively — the obstruction names
        what a fixed-degree instrument lacks, and the closure instrument is a
        worked example of supplying it. A correctly specified successor can obtain
        the DREG statistic as an output on cells shared with GOAL-DREG-001 by
        applying that same sweep to the single-level instrument, using the 31
        instances of per-instance ranks at D = 3 and D = 4 already in this run's
        records as its starting data. The reusable content of this negative reading
        is therefore a construction, not a prohibition.
      spawned_ids: []

  reviewed_by: coordinator
