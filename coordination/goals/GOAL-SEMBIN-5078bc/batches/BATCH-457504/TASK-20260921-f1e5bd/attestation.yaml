  blindness_disclosures:
    - what: >-
        The per-cell worker*/cells/results.jsonl files -- named as this task's
        inputs and inside its read_scope -- EMBED the producer's derived
        per-instance scalars (d_F4_naive, d_F4_semaev, d_F4_last_productive_round,
        d_F4_partial_max_deg_seen, closure_D, D_macaulay_rank_statistic,
        f4_empty_step_degrees, f4_step_count) alongside the primitive profiles.
        Perfect blindness to the producer's NUMBERS is therefore not achievable
        from this package.
      mitigation: >-
        Blindness to the producer's IMPLEMENTATION -- the failure mode the
        exercise targets -- was preserved in full: code/summarize.py was never
        opened, and rederive.py passes every record through primitive_view(),
        which DELETES those keys before any derivation code can see them
        (2138 field instances dropped, 1980 of them producer-derived; auditable
        with --audit-blindness). The F4 statistic is derived from an independent
        parse of the raw .msolve.log traces rather than from the record's
        producer-parsed `rounds` array, which is quarantined to the post-hoc
        cross-check.
      evidence_the_mitigation_held: >-
        The re-derivation DIVERGED from the producer on the d_F4_semaev
        convention at sem_n12_m6_t6_k2_low_B_ran_s20260913004_d3. A contaminated
        derivation would have reproduced the producer's convention rather than
        disagreeing with it.
    - what: >-
        Independence has a floor at the linear algebra. closure_D is derived from
        the recorded per-cap standard_monomials, solutions and contains_one,
        which the producer's closure instrument computed; with maximum_runs = 0
        they cannot be recomputed.
      mitigation: >-
        The re-derivation is independent at the level of the STATISTIC
        DEFINITIONS applied to the per-degree profiles, which is what the card
        asked for ("taken from the per-degree closure profiles"). It is not
        independent at the level of the rank computations underneath, and
        report.md section 8 states this as a limitation rather than implying
        otherwise.
    - what: >-
        The orphan reconciliation of report.md section 6.5 was performed during
        write-up, after summary.json had been opened.
      mitigation: >-
        It is a disk-against-records check that reads no producer-derived value,
        it was derived with the same blind parser, and rederived.json was left
        byte-unchanged. The ordering is stated in report.md section 7 step 7 so a
        reader can discount it.

