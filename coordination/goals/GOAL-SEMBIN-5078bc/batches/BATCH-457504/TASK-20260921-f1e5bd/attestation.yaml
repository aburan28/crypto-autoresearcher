  reproduces:
    - quantity: closure_D
      result: exact agreement on all 126 recorded instances (15 values, 111 nulls)
    - quantity: separation closure_D - d_F4
      result: >-
        0 on all 11 instances where both instruments were reached, under all four
        d_F4 conventions computed; matches the producer's summary.json
        (agreements 11, largest_separation [0, ctrl_known_false_N35],
        n_instances 126)
    - quantity: d_F4_naive
      result: agreement on all 45 instances where the producer publishes a value
    - quantity: producer's F4 trace parser
      result: >-
        independently confirmed; zero field mismatches against my own parse of
        every msolve log for every record derived from

  disagreements:
    - id: D-1
      kind: definitional
      instance: sem_n12_m6_t6_k2_low_B_ran_s20260913004_d3
      quantity: d_F4_semaev
      producer_value: 4
      rederived_value: 5
      attributed_to:
        implementation_a: >-
          rederive.py::derive_d_f4, field d_F4_semaev_literal -- deletes the
          trailing run of rounds that selected NO PAIRS (sel == 0), which is
          Semaev's stated rule (paper_fulltext.md lines 634-636, "No pairs to
          reduce"). On msolve no such round exists anywhere in the run, so the
          exclusion is vacuous and the value is the naive maximum, 5.
        implementation_b: >-
          the run's d_F4_semaev / d_F4_last_productive_round -- deletes the
          trailing run of rounds that added NO NEW BASIS ELEMENT (new == 0),
          giving 4. The two rounds so excluded selected 34 and 519 pairs and
          computed row echelon forms of 1915x2220 and 84267x84198 matrices.
      containment: >-
        closure_D was never computed for this instance, so the divergence reaches
        no separation value and does not disturb the headline. That containment
        is a fact about this run's coverage, not about the definitions.
      adjudication: >-
        NOT MADE HERE. Which convention is Semaev's is a question about the map
        and is owned elsewhere in this round.
    - id: D-2
      kind: reporting_scope_not_a_value_conflict
      instances:
        - null_n17_m3_t3_k6_low_B_equ_s20260913001_d0
        - sem_n12_m6_t6_k2_ran_B_equ_s20260913002_d1
        - sem_n17_m3_t3_k8_low_B_equ_s20260913001_d0
      description: >-
        The producer reports d_F4_naive = null on these capped cells while
        retaining the same number I derive (4) under the field name
        d_F4_partial_max_deg_seen. The two implementations agree on the value and
        differ only on whether to publish it as the headline statistic.

  tail_checks:
    - id: contract_tail_check_ii
      question: >-
        degrees at which F4 reported no pairs, against degrees at which the
        Macaulay block gained rank
      answer: >-
        UNTESTABLE AS LITERALLY STATED, on all 48 instances with a trace. msolve
        emits no round with sel == 0 anywhere in the run (0 of 749 rounds), so
        the F4 side of the predicted coincidence is the empty set. Separately,
        the Macaulay instrument probed only caps D = 3 and D = 4 on every
        instance, so at most one rank increment is computable and the increment
        at D = 3 is undefined for want of a D = 2 probe. Reported as an engine
        property and a coverage limit, never as negative evidence about the
        predicted mechanism (AGENTS.md rule 5).
    - id: contract_tail_check_i
      question: >-
        instances where the two statistics AGREE but the per-degree profiles
        differ -- the contract's "dangerous case"
      answer: >-
        11 of 11 under the raw comparison, 0 of 11 under the like-for-like
        comparison. The raw hit is systematic and structural: the closure profile
        carries pivots at degree 1 (and 0 where the ideal is unit) and an F4 run
        has no step at degree 0 or 1 because there are no critical pairs there.
        Restricted to degrees >= 2, where both indexings can carry mass, the
        supports are identical on every instance. The two profiles are indexed on
        different things -- F4 step degree versus the degree of a pivot's leading
        monomial -- and the package retains no common indexing, so supports are
        compared and counts never are. Both readings are in rederived.json.

  additional_observations:
    - id: O-1
      about: artifact binding
      finding: >-
        4 F4 records carry a rounds array that is a strict prefix of the log on
        disk under the same name, never a contradiction and with zero field
        mismatches. Consistent with a retried cell keeping only the last
        attempt's log. Touches no derived value; report.md section 6.4.
    - id: O-2
      about: instance enumeration
      finding: >-
        129 instance stems on disk against 126 instance ids in results.jsonl.
        Three instances have retained artifacts and no record; one of them
        (null_n17_m3_t3_k6_low_B_ran_s20260913001_d0, the B_random matched null)
        actually ran and yields d_F4_naive = 4 from its retained log. Both this
        derivation and the run's own summary.json enumerate from results.jsonl
        and so both omit all three. report.md section 6.5.
    - id: O-3
      about: convention edge case at a load-bearing control
      finding: >-
        On ctrl_known_false_N35 the only F4 round is unproductive, so the
        "exclude trailing unproductive rounds" convention deletes every round and
        is UNDEFINED there; the run's own d_F4_last_productive_round is likewise
        null and its d_F4_semaev reaches 2 by a fallback. Semaev's literal rule
        gives 2 directly. Same number, different route.

