      serves this identifier. The task card declares this up front in its
      inference.fallback_note; it is recorded here rather than worked around.
    fallback_used: true
    fallback_reason: >-
      The card sets fallback_allowed: true because the runtime-native binding permitted by
      AGENTS.md core rule 16 is the only available route. No Bedrock provider, endpoint or
      model identifier was selected or contacted at any point.
    degraded_allowed: false
    degraded_requirements: []

  runs_launched: 0
  engines_executed: 0
  what_i_computed_instead: >-
    Recomputation from committed records only: sha256 of committed files, exact integer
    arithmetic on record fields, exact GF(2) evaluation of the known-false planted point
    against its 69 retained equations, and an independently written parser of the retained
    msolve inputs that imports no producer code. No measurement was launched and no
    Groebner engine was run.

