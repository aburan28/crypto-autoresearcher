    code_read_caveat: >-
      f4_trace.py, run_cells.py, summarize.py and make_manifest.py do NOT match the
      manifest's declared code_sha256, so what I read for those is a LATER version than the
      bytes that produced the run. Stated as defect D1 in findings.json, and every
      data-level finding in this review is independent of it. boolsys.py and
      closure_cert.py DO match, so findings resting on those are findings about the code
      that ran.

  blind_from_declared_in_my_card:
  - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-411a9d
  - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-f1e5bd
  - coordination/review/sembin-20260921-457504/review-plan.yaml#coordinator_prior
