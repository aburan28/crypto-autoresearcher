  accidental_reads: none

  disclosures:
  - id: DISC-1
    what: >-
      I listed the parent directory
      coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/ when creating my own task
      directory, and so saw that TASK-20260921-411a9d/ and TASK-20260921-f1e5bd/ exist.
    what_i_did_not_do: I opened no file in either directory and read no sibling report.
    bears_on_findings: false
  - id: DISC-2
    what: >-
      The review plan's `proves_too_much` and `blind_rederivation` blocks are not in my
      blind_from set and I read them. They name which reviewer owns each control and,
      in the case of proves_too_much, describe the objects J-2 is to run the argument
      against and call one possible outcome "the single most damaging finding available in
      this round". That sentence is close in spirit to a prior, even though it sits outside
      the withheld `coordinator_prior` block.
    mitigation: >-
      I read the review plan only AFTER completing every J-1 computation -- the duplicate
      audit, byte identity, the structural recomputation, the control checks, the count
      reconciliation, the digest and code-hash checks. None of those results was formed with
      the plan in view, and I did not act on the quoted sentence: I deliberately did not
      report on how many of the 9 both-measured instances are unit-ideal, because the plan
      assigns that object to J-2.
    bears_on_findings: false
  - id: DISC-3
    what: >-
      Two of the manifest's declared `code_sha256` entries (libclosure.so, libgf2ech.so)
      have no file in the tree, and four others mismatch, so the instrument bytes could not
      be verified. I did not attempt to recover them from git history.
    why: The task card states "Run no git command"; I ran none.
    bears_on_findings: >-
      Recorded as a limitation, and as the second of the two reasons the run verdict is
      `incomplete` rather than `passed`.
  - id: DISC-4
    what: >-
      For the byte-identity control I did not merely assess the run's check -- I performed
      the comparison the contract specified, from retained artifacts, with my own parser.
      That is a validator supplying a missing check rather than only auditing one.
    why_declared: >-
      A reader should know that "byte identity holds on 139/139 instances" is THIS
      validation's result and not the run's, so that the run is not credited with having
      established it.
    bears_on_findings: >-
      It is why the byte-identity verdict is `satisfied_differently` rather than
      `not_satisfied`.

