    by Stage-0 size freeze + Stage-1 SOLV4 gate + Stage-2 decisive cells +
    Stage-3 ladders. Deployed solve and cryptographic-scale Assumption 1
    verdicts out of scope.

  baseline_embedding:
    parameter_slice: >-
      Semaev Table-2 cell (40,2,2,20); (21,3,3,7); EXP-DREG-001 anchor ranks
      at n∈{15,18}; Semaev eq.(5) descent generators. Frozen paper
      inputs/SEMAEV-2015-310/ is the Assumption-1 / Table-2 source.
    reproduction_check: >-
      Stage 0: sizes + preregistered predictions. Stage 1: DREG anchors +
      dual GF(2) rank + SOLV4 holds at (40,2,2,20) smoke. Stage 2: decisive
      cells including Kosters (45,2,2,23). Mismatch → O-ENGINE-FAIL /
      O-BASELINE-FAIL / O-ARTIFACT.
    status: declared_in_contract

  observation_collision:
    observable: >-
      SOLV4 failure rate per (n,m,t,k,arm), plus fitted dφ/dk and dφ/dn.
    distinct_preimage_search: >-
      Separated by same-k/different-n vs same-n/different-k pairs, null arm,
      off-diagonal k-excess gate, SAT/UNSAT stratification, dual GF(2) rank,
      and independent s.
    status: declared_in_contract

  quantifier_order: >-
