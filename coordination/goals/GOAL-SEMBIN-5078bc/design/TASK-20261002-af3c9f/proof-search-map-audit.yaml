    cryptographic scale; any deployed-curve statement; Magma bit-exact
    reproduction; exact degree = 5.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      At specified (n,m,t,k) with named curve/V, degree 4 is insufficient for
      a measured fraction p of instances stratified by satisfiability, with
