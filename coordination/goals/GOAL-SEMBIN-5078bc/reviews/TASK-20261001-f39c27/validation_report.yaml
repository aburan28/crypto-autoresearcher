    localised to the d grid. The verdict is "incomplete" for one reason only:
    receipt-integrity items (manifest, command, revision/dirty state,
    environment, seeds, gate report, artifact digests, control re-runs) were
    outside this task's permitted read set. So this report cannot certify
    RUN-SEMBIN-be48b7 as admissible evidence. No defect in the producer's
    arithmetic was found. This report supports no ECDLP claim, demonstrates
    no speedup, and authorizes no promotion.

  limitations:
