    per_degree_minimum_on_producer_grid: holds
    sign_of_every_margin_zero_subrho: holds
    reported_values_equal_real_d_quantity_within_0_1_bit: breaks   # n in {163, 191, 239, 571}; grid effect, conservative
    reported_argmin_equals_real_d_argmin: breaks                    # n = 571 only

  verdict: incomplete
  verdict_reason: >-
    The blind re-derivation itself is complete. It HOLDS for the producer's
    computation of its declared (0.25-grid) quantity: the objective and
    exclusion rule are identical to 6e-14, and the grid minima are reproduced
