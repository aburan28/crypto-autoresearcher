    - >-
      The E-2/blind agreement may be correlated if E-2 came from the same model
      family as this session; E-2 provenance was not visible.
    - >-
      The p > 1 regime at every optimum is a shared modelling assumption that
      blind re-derivation cannot test.
    - The runtime is CPython 3.11.15, not the repo-pinned 3.12.8. Pure arithmetic (mpmath 60 digits), so not result-affecting.
    - >-
