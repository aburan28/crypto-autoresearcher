  id: VAL-TASK-20261001-f39c27   # tools/allocate_id.py has no VAL type; keyed by task (repo precedent VAL-TASK-20260929-4626a5)
  task_id: TASK-20261001-f39c27
  task_kind: blind_rederivation   # agents/validator.md "Blind re-derivation tasks": not a full validation
  recorded_at: '2026-10-02'
  goal_id: GOAL-SEMBIN-5078bc
  experiment_id: EXP-SEMBIN-04ec3c
  run_ids: [RUN-SEMBIN-be48b7]
  repo_head_at_derivation: 4a0b13aec8a48b49d6dd66c3dbefe986c51dc625
  producer_snapshot_commit: b8019a6fb   # commit that last touched both revealed files; clean in the working tree
  task_card_note: >-
    No committed handoff for TASK-20261001-f39c27 was found outside the blind
    list. The only file naming it is ledger/handoffs/TASK-20261001-41f6b3.yaml,
    which is blinded and was not opened. The quantity statement used is the one
    in the dispatch prompt. Whether archived_by was bound before dispatch could
    not be verified from here.

  quantity_statement: >-
    TOTAL(n) = min over m in 2..16, s in 0..floor(m/2), real d of
    log2(2^PROBE + 2^FILL + 2^LA), where PROBE = |F| * (m! N / |F|^m) * |F|^(m-s),
    FILL = |F|^s, LA = |F|^2, |F| = 2^d, N = ell at n = 131 and 2^n otherwise.
    margin = TOTAL - log2(0.886 sqrt N). Cells with (trials/relation x
    relations) < 1 are flagged and excluded.
  exclusion_convention: >-
    PRIMARY C1, pointwise: points with log2(total trials) = L - (m-1)d < 0 are
    excluded, so d is in [0, L/(m-1)]. (m, s) pairs whose unconstrained
    minimiser falls in the excluded region are flagged; 42 pairs, the same at
    every degree: all 2 <= s with 2s < m. C2 drops flagged pairs entirely and
    gives identical optima. Sensitivities NOT in the statement: C3 (p <= 1)
    and C4 (integer d).

  blind_result:   # sealed in pre_reveal_hashes.txt before any producer artifact was read
    sign_convention: positive margin = index-calculus total costs more than 0.886 sqrt(N)
    unit: abstract operations exactly as the statement charges them; memory reported, not charged
    per_degree:
      - {n: 97,  m: 6,  s: 3, d: 21.1814, TOTAL: 64.8661,  margin: 16.5407}
      - {n: 109, m: 8,  s: 4, d: 17.6977, TOTAL: 72.0133,  margin: 17.6880}
      - {n: 131, m: 8,  s: 4, d: 20.5549, TOTAL: 83.4419,  margin: 19.1165, margin_vs_published_rho_60_80904: 22.6329}
      - {n: 163, m: 8,  s: 4, d: 25.4120, TOTAL: 102.8705, margin: 21.5451}
      - {n: 191, m: 8,  s: 4, d: 29.4120, TOTAL: 118.8705, margin: 23.5451}
      - {n: 233, m: 10, s: 5, d: 28.2743, TOTAL: 142.5417, margin: 26.2163}
      - {n: 239, m: 10, s: 5, d: 28.9410, TOTAL: 145.8750, margin: 26.5496}
      - {n: 283, m: 10, s: 5, d: 33.8299, TOTAL: 170.3194, margin: 28.9941}
      - {n: 409, m: 12, s: 6, d: 39.7793, TOTAL: 239.8134, margin: 35.4880}
      - {n: 571, m: 14, s: 7, d: 46.7016, TOTAL: 328.0267, margin: 42.7013}
    closed_form: >-
      For m = 2s, s >= 3: d* = (L - log2(s/(s-1)))/(2s-1) and TOTAL* = s d* +
      log2((2s-1)/(s-1)), with L = log2(m!) + log2 N. This matches the
      numerical optimum to ~1e-13; at n = 97 it is off by 2.4e-7 because it
      omits LA.
    structural_bound: >-
      TOTAL >= s L/(2s-1) > L/2 for s >= 2, and TOTAL >= L for s <= 1, so
      margin > 0.67 bits for every (m, s, d, N) under this cost model.
    ell_n131:
      value: '680564733841876926932320129493409985129'
      source: inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md Appendix A (sha256 519f330a...b4d967, matches sidecar)
      independent_check: '#E(F_2^131) = 2^131 + 1 - V_131 (trace -1) = 4*ell; sympy.isprime and 78-base Miller-Rabin pass; log2 ell = 129.0000000000000000000118'

  artifact_checks:
    - path: experiments/EXP-SEMBIN-04ec3c/runs/RUN-SEMBIN-be48b7/raw-result.json
      sha256: 4df28d20eeb3c5b4d8512e4afa7f8483b507cedb3d7a363122d191b4dbff5ca6
      committed_in: b8019a6fb
      working_tree_clean: true
      result: present_and_committed
    - path: experiments/EXP-SEMBIN-04ec3c/RESULTS-amd-e61f2b.md
      sha256: f0a0fa7e9ae5934b5ea94dfc9e12648cbabc7dc964ac1aa0b04484a66aaa18d5
      committed_in: b8019a6fb
      working_tree_clean: true
      result: present_and_committed
    - item: manifest, command, revision/dirty-tree record, environment, seeds, stdout/stderr, gate/gate_report.json, artifact-digests.json
      result: NOT_CHECKED
      reason: outside this task's permitted read set (runs/ is blinded except raw-result.json)

  metric_recomputations:
    - id: K1-pointwise-objective
      method: sealed blind objective evaluated at every producer argmin row (post_reveal_compare.py, post_reveal_k1b.py)
      result: >-
        MITM (300 rows) and MITM_CAPPED (2700 rows) agree on PROBE, TOTAL, TPR
        and CALLS to 5.7e-14; FILL and LA are exact. The producer labels ENUM
        (300 rows) s = 0 with FILL = 0 but charges oracle |F|^(m-1); mapped to
        the statement's s = 1, PROBE/TOTAL agree to 2.8e-14. That is a
        labelling difference only. FREE (300 rows) is a control outside the
        statement and was skipped.
      status: agrees
    - id: K2-grid-reproduction
      method: sealed blind objective minimised on the producer's declared domain (d = 1.0..n step 0.25, CALLS >= 0, all s)
      result: per-degree minimum reproduced with |diff| = 0.0 and identical (m, s, d) at all 10 degrees
      status: agrees
    - id: K3-real-d-vs-reported
      result: >-
        The producer's per-degree minima exceed the real-d minimum by +0.0099,
        +0.0115, +0.0123, +0.1028, +0.1028, +0.0041, +0.2299, +0.0430, +0.0089
        and +0.1508 bits at n = 97..571. The arg-min differs only at n = 571
        (producer m=12 s=6 d=54.5; real d gives m=14 s=7 d=46.70). The whole
        difference comes from the producer's 0.25 d grid. The real-d optimum
        lies 0.017-0.117 below the CALLS = 0 boundary, less than one grid
        step, so each grid minimum is the last in-domain grid point. Measured
        grid excess per (n, m = 2s) is 0.0001 to 0.76 bits.
      status: discrepancy_localised   # domain choice (grid vs real d), not arithmetic
    - id: K4-vs-E2
      result: >-
        Blind real-d margins match the producer-recorded E-2 expectations
        within E-2's two-decimal rounding (max |diff| 0.0059) at all 10
        degrees. This resolves RESULTS headline 5's open item: E-2 is the
        continuous-d quantity, and v2 - E-2 is the grid effect.
      status: agrees
    - id: K5-baselines
      result: >-
        The VOW column is identical in both, using log2(0.886) = -0.174621.
        PUB: producer 60.809 (rounded), blind 60.80904
        (log2 sqrt(pi ell/(4*131))). ell is identical; the producer read it
        from talk-35minutes_text.md, the blind derivation from the paper's
        Appendix A plus a curve-order derivation.
      status: agrees

  control_checks:
    - control: exclusion rule (CALLS < 0 out of domain)
      result: identical to the statement's "total trials < 1" (blind C1)
      status: agrees
    - control: C-IMPL-GATE mutants M1-M4, C-GENERIC-LOWER-BOUND-FLAG, C-BOUND-PROBE, C-BASELINE-CONSISTENCY, A4, C-M3-ANCHOR, C-DEGENERATE-M, C-FLOOR-REPRO, M0
      result: >-
        Values were read in raw-result.json and RESULTS only. Gate reports and
        code were not opened, and none of these was re-run. Not certified.
      status: not_checked
    - control: null-object / known-false control
      result: >-
        Not applicable as a statistical control: no statistical signal is
        claimed; the result is a deterministic cost-model scan. The structural
        bound (margin > 0.67 bits for all cells and all N) is the analytic
        counterpart: the model cannot produce a sub-rho cell anywhere.
      status: not_applicable

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: >-
        E-2 expectations are recorded in raw-result.json as reviewer-derived,
        "not preregistered, not targets". The blind derivation is independent
        of the producer's code and matches E-2.
    - check: decomposition-probability heuristic p = |F|^m/(m! N)
      result: >-
        Every per-degree optimum, in BOTH implementations, sits where p > 1:
        blind log2 p ranges from 17.3 to 46.5, and the producer's TPR is
        negative at every per-degree minimum. There, 1/p is an
        expected-decompositions count. It is a valid cost only if one oracle
        call returns all ~p decompositions and they form ~p linearly useful
        relations. This is an UNVALIDATED modelling assumption shared through
        the statement, so blind re-derivation cannot surface it as a
        disagreement. Under p <= 1 (blind C3) margins rise by 5.3-18.1 bits,
        which is against index calculus, so the null result is not at risk.
      status: limitation_flagged
    - check: baseline heuristic HEUR-VOW-CURVE
      result: disclosed in RESULTS as unvalidated; not re-examined here
      status: disclosed
    - check: scale binding
      result: >-
        Degrees and N rule are recorded in raw-result.json parameters and
        match the statement. Everything is modelled; nothing is executed at
        cryptographic scale.
      status: recorded

  cost_model_checks:
    - check: unit declared
      result: RESULTS declares "log2 operations ... one operation per group op, probe, multiply-add or table write", flagged optimistic
      status: ok
    - check: memory reported beside time
      result: >-
        T5 reports log2 table entries, which agree with s*d (e.g. 63.75 at
        n = 97). At the optimum, memory is within 1.12-1.32 bits of TOTAL.
      status: ok
    - check: per-attempt cost x inverse success probability
      result: >-
        PROBE = relations x (m! N/|F|^m) x |F|^(m-s) in both (K1). See the p > 1
        caveat above: at the optimum the "inverse success probability" is
        below 1.
      status: ok_with_caveat
    - check: reported minimum is the stated minimum
      result: >-
        T5 and headline-5 figures are 0.25-grid upper bounds on the real-d
        minimum, by up to 0.230 bits; the n = 571 arg-min is a grid artifact.
        The direction is conservative (overstates IC cost). RESULTS discloses
        the grid in "unexpected observations".
      status: labelling_caveat

  proof_architecture_checks:
    - check: speedup ladder (inventor-protocol section 6)
      result: not applicable; no speedup is claimed (the result is zero sub-rho cells)
    - check: structural claim
      result: >-
        The blind bound margin > 0.67 bits is a short inequality, stated in
