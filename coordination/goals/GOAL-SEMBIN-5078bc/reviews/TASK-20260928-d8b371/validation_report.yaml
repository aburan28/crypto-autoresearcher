      could extract in isolation. Several findings also use the J1 result, from
      this same validator (VAL-20260930-9e4591): every reported sub-rho cell's
      MITM table holds more entries than its reported total operation count.

  plan_checks:
    degrees_as_parameter_labels: FAILS at n = 131 (findings J4-3, J4-8)
    no_margin_mixes_the_two_columns: FAILS (findings J4-1, J4-2). The plan's own premise "4.52 bits at n = 131" does not describe the run (fact F2).
    no_cell_beats_rho_scoped_to_generic_mSUM: >-
      HOLDS in the manifest scope block, the contract claim_ceiling and scope, and
      H statement / statement_note. FAILS in the snapshot commit title and lead
      paragraph (J4-5), and in H prediction 4 (J4-6).
    no_sentence_could_become_an_overstating_KN_FIND_title: FAILS (findings J4-4, J4-7, J4-9)
    no_memory_charged_language_A5: FAILS (finding J4-4)
    claim_tier_not_exceeded: >-
      HOLDS. heuristic_estimate everywhere and no sentence claims a higher tier.
      The failures are of scope, column and unit, not of tier.
    no_curve_security_statement_either_direction: FAILS (findings J4-1, J4-7c, J4-8)

  breaking_artifact:
    id: J4-1
    quoted: "On ECC2K-130 the cheapest entry costs 2^106.8 of store to reach a 2^64.2 attack, against a baseline whose total work is 2^64.3."
    location: snapshot commit 3c97c0d40 (on main via PR #1470), paragraph "THE RESULT"
    hostile_extraction: "Index calculus reaches 2^64.2 on ECC2K-130, just under rho."
    why_it_overstates: >-
      (1) It names a curve and gives as that curve's baseline the vOW column
      0.886*sqrt(r) = 2^64.33. That column omits the Frobenius speedup ECC2K-130
      actually has. ECC2K-130's own reference is the published 2^60.8090, which
      equals sqrt(pi r/(4*131)) to four decimals (F2), and it is the only column
      A7 permits at that curve. Against the curve's own reference, a 2^64.2 attack
      is 3.39 bits ABOVE rho.
      (2) Per J1, that cell's table holds 2^106.8 entries, so building it takes at
      least 2^106.8 operations. The "2^64.2 attack" is the probe-only part.
    corrected_wording: >-
      At the degree label n = 131, with N set to ECC2K-130's subgroup order
      r ~ 2^129, the probe-only accounting first crosses the vOW column
      0.886*sqrt(r) = 2^64.33 at m = 8, where the oracle's table holds 2^106.8
      entries. That column omits the Frobenius speedup. The published ECC2K-130
      reference 2^60.8090 is a separate column, against which the crossing store
      would be 2^111.4 (excess 50.6 bits). Building the table alone takes at least
      2^106.8 operations, so no cell in this model is below either column. Nothing
      is asserted about ECC2K-130's security.

  findings:
    - id: J4-2
      check: column mixing inside one margin
      quoted:
        - "CONTRACT P4: That minimum store is minimised near m = 8 at roughly 2^108 entries for ECC2K-130, against rho's total work of about 2^61 -- so the store alone exceeds the attack it is trying to beat by more than 40 bits."
        - "MANIFEST: P4 CONFIRMED within its stated band: ... the minimum store is 2^106.8 (predicted roughly 2^108, band 95 to 125), exceeding the baseline's total work by 42.5 bits (predicted more than 40)."
      why: >-
        P4's 2^108 is S/(S-1)(n/2 + log2 8!) = 107.7, solved against 2^(n/2). Its
        "about 2^61" is the published column, so its margin crosses columns (107.7
        - 60.809 = 46.9). The manifest then scores that cross-column prediction
        with a single-column number: 42.5 bits against vOW 2^64.33.
      per_column_values_n131: >-
        Against vOW 2^64.33: crossing store 2^106.8 at m = 8, excess 42.5 bits.
        Against published 2^60.8090: crossing store 2^111.4 at m = 8, excess 50.6
        bits. The latter was not computed by the run.
      corrected_wording: >-
        P4 is scored per column. Against vOW 0.886*sqrt(r) = 2^64.33 the
        probe-only crossing store at n = 131 is 2^106.8 at m = 8 (excess 42.5
        bits); against the published 2^60.8090 it is 2^111.4 (excess 50.6 bits).
        P4 as authored mixed the two and cannot be scored as written. (J1: neither
        crossing is a sub-rho attack once the table's construction is counted.)
    - id: J4-3
      check: every degree a parameter label; the plan's 4.52-bit premise
      quoted:
        - "MANIFEST field_bits_note: No field is instantiated and no curve is touched. Every n is a parameter label in a cost formula."
        - "MANIFEST subgroup_order: the real 129-bit prime r for n = 131 ..."
        - "CONTRACT A7: 0.886 * 2^(131/2) = 2^65.33 while the published ECC2K-130 reference is 2^60.8090, a 4.52-bit gap attributed to the <-1> x <pi> speedup."
      facts: >-
        The vOW column equals n/2 + log2 0.886 at nine degrees and is 1.000 bit
        lower at n = 131 (F1). raw-result.json names the row
        summary.ecc2k130_min_store. As the run computed them, the two columns
        differ at n = 131 by 3.516 bits, exactly log2 sqrt(131), the <pi> part
        alone (F2); the 0.886 = sqrt(pi/4) already contains <-1>. A7's 4.52 is
        3.52 bits of <pi> plus 1.00 bit of the cofactor 4 (2^131 against r). So
        A7's attribution is wrong, and A7's own pass criterion ("the vOW column
        reproduces 0.886*2^(n/2) at every listed degree") would fail at n = 131
        by 1.000 bit. C-BASELINE-CONSISTENCY is not implemented or reported. The
        n = 131 row is a hybrid that is neither ECC2K-130's rho cost (2^60.8090)
        nor ECC2-131's (cofactor 2). Also: "eleven degrees" (A2, the falsification
        criterion, the plan) are ten distinct values, since 163 is in both lists;
        the commit says ten.
      corrected_wording: >-
        Ten distinct degrees (eleven listed entries; 163 is in both lists) are
        parameter labels with N = 2^n, except n = 131, where N = r (ECC2K-130's
        subgroup order). The n = 131 vOW column is therefore 0.886*sqrt(r) =
        2^64.33, one bit below 0.886*2^(n/2), and it is the cost of neither
        ECC2K-130 (2^60.8090) nor ECC2-131. At n = 131 the two columns differ by
        3.52 bits (the Frobenius factor sqrt(131)).
    - id: J4-4
      check: A5 binding language ceiling ("no record derived from this experiment may state that memory was charged into a cost")
      quoted:
        - "MANIFEST purpose: Charge the decomposition oracle's MEMORY, symmetrically with the rho baseline, and sweep ..."
        - "MANIFEST C-NULL detail: DECISIVE. With the store charged at zero, 720 cells fall below the baseline; with it charged, 14 do. The charge removes 706. So the memory charge is doing the work ..."
        - "MANIFEST metric keys: subrho_cells_memory_charged, cells_removed_by_the_memory_charge"
        - "COMMIT: THE CHARGE IS WHAT DOES THE WORK ... with the store free 720 cells fall below the baseline; with it charged, 14 do."
      why: >-
        (1) Direct A5 violation in a run record.
        (2) "720" is 90 distinct (degree, m) cells counted once per budget label
        that does not apply to the store-free treatment (F3).
        (3) Per J1, all 90 and all 14 have more table entries than reported
        operations (gap at least 41.9 bits). With the table's construction counted
        both sets are empty, so the store budget does no work the time accounting
        does not already do.
        (4) A4 says this diagnostic is "never read as a refutation"; here it is
        read as "DECISIVE" confirmation.
        Quotable KN-FIND title: "Charging the oracle's memory removes 706 of 720
        sub-rho cells."
      corrected_wording: >-
        With the oracle's store budget-constrained and reported (never added to
        any operation count), 14 (degree, m, B) cells fall below the vOW column,
        all at degree labels 97 and 109 with B >= 2^90. With no store budget, 90
        distinct (degree, m) cells do; the driver counts them once per budget
        label, giving 720. In every one of these cells the oracle's table holds
        more entries than the reported total operation count, by at least 41.9
        bits. Counting the table's construction, no cell falls below either column.
    - id: J4-5
      check: an unconditional closure read from a conditional bound
      quoted:
        - "COMMIT TITLE (main, PR #1470): sembin: the decomposition-oracle family cannot buy its way below rho"
        - "COMMIT: THE RESULT. To put an m-summand index calculus below the rho baseline on a binary curve, ... the store must exceed rho's ENTIRE WORK at every degree tested"
      why: >-
        "The decomposition-oracle family" includes the sub-generic oracles the
        contract names as the surviving route. The conditional on
        HEUR-GENERIC-MSUM appears only in the commit's last paragraph, so the
        title and lead paragraph read as a closure of the lane, which the
        claim_ceiling forbids.
      corrected_wording: >-
        sembin: GIVEN generic m-SUM (HEUR-GENERIC-MSUM, unvalidated), no
        decomposition-oracle cell falls below rho in the cost model at the ten
        swept degrees; a sub-generic m-SUM oracle remains the open route.
      remedy_note: The commit is immutable. Carry the scoped wording in the EV record and any KN-FIND title.
    - id: J4-6
      check: scope of a "no cell beats rho" statement
      quoted: "H-SEMBIN-8e7ae3 prediction 4: No store budget at or below 2^80 admits a sub-rho cell at any binary degree the program tracks."
      why: >-
        The program tracks ECC2-79 and ECC2-89 (EXP-NISTBIN-451dfa lines 195-196,
        cofactor 2). In this contract's own model as run (probe-only), n = 79 has
        two sub-rho cells at B = 2^80: m = 8, d = 19, store 2^76, total 2^38.69
        against vOW 2^39.33; and m = 10, d = 16, store 2^80. Under its h = 2 group
        order, n = 89 has one: m = 8, d = 20, store 2^80, total 2^43.44 against
        2^43.83. The prediction is false at a tracked degree in its own model. The
        contract's P5, scoped to the listed degrees, is correct there. The sentence
        also omits the generic-m-SUM conditional.
      corrected_wording: >-
        No store budget at or below 2^80 admits a sub-rho cell at any of the ten
        swept degrees (97-571), given generic m-SUM. At n = 79 the same probe-only
        accounting admits two such cells at B = 2^80, and at n = 89 one under the
        h = 2 group order. Counting the oracle table's construction, none does at
        any degree.
      remedy_note: The hypothesis is immutable. The scope correction belongs in the EV record.
    - id: J4-7
      check: manifest sentences contradicted by the run's own raw-result.json
      items:
        - quoted: "The reported minimum-store curve at n = 131 confirms the withdrawal was right: it falls to m = 8 and rises after."
          raw: >-
            m = 2..7 unreachable at any store. m = 8..16: 106.8, 111.0, 108.25,
            112.5, 112.5, 116.7, 117.95, 122.5, 124.8 (F4). There is no falling
            limb, and after m = 8 the curve alternates with parity. The even-m
            values rise monotonically, which is what the withdrawn P3b clause said.
          corrected_wording: >-
            At n = 131 no sub-rho cell exists for m <= 7 at any store, because the
            linear-algebra term exceeds the baseline. From m = 8 the minimum store
            alternates with parity and its even-m values rise monotonically. There
            is no interior turning point, and A2b's 140.2 and 112.5 at m = 4 and 6
            are not realised by any cell.
        - quoted: "MANIFEST metric: enum_d_independent: true"
          raw: >-
            summary.enum_d_independent_everywhere = false under the driver's own
            < 1e-6 test; max spread 0.0014 bits (F5).
          corrected_wording: >-
            enum_d_spread_max_bits: 0.0014. The driver's own < 1e-6 test returns
            false; the spread is the linear-algebra term entering the log-sum at
            large d.
        - quoted: "P2 CONFIRMED: the first summand count strictly below the published ECC2K-130 reference under a store-free MITM oracle is m = 8, exactly as predicted."
          why: >-
            It names a curve as beaten. P2's second clause ("m = 6 landing near
            it") is not reported and fails: m = 6 lands 9.46 bits above. The m = 8
            cell holds a 2^116.0-entry table against a reported 2^58.69 total.
          corrected_wording: >-
            P2's first clause reproduces in the probe-only accounting at n = 131:
            m = 8 crosses the published column at 2^58.69. Its second clause does
            not: m = 6 lands 9.46 bits above, not near. The m = 8 cell's table
            holds 2^116.0 entries, so counting its construction it is not below
            either column. Nothing is asserted about ECC2K-130.
        - quoted: "C-FLOOR-REPRO: Max absolute offset 2.78 bits, growing monotonically in m as the amendment's declared signature requires."
          why: >-
            It omits the signature's third clause ("within 1.5 bits of
            2*log2(m)"), which fails at m = 4, 5, 6, 8 (departures 2.02-3.22 bits,
            F6). A1 makes such a departure a stop condition. Adjudication belongs
            to J2 (TASK-20260928-3f90b8); the language finding is that the
            sentence asserts compliance it does not have.
        - quoted: "MANIFEST metric key: min_store_to_beat_rho_by_degree"
          why: Per J1, no store beats rho once the table is built.
          corrected_wording: min_store_where_probe_only_work_crosses_vow_by_degree
    - id: J4-8
      check: curve-security statements in either direction
      quoted:
        - "MANIFEST degrees_note: All prime, which is what blocks Weil descent and cover attacks on every listed target."
        - "CONTRACT scope / MANIFEST what_it_does_not_touch: ... Weil descent or cover attacks, which every listed degree being prime already blocks"
        - "COMMIT: Those 14 survivors sit only at n=97 and n=109, need 2^90 of store or more, and both those curves were solved by rho in 1998 and 1999."
      why: >-
        (a) "Blocks ... attacks on every listed target" is a security assertion
        about named targets, uncited in the record, and imprecise. Prime n leaves
        F_2 as the only proper subfield, which removes descent to a curve over an
        intermediate subfield. Weil restriction to F_2 is itself the step this
        program's own Semaev-binary family uses at prime n.
        (b) The commit turns two degree labels into "both those curves"; each
        degree carries two Certicom challenges. Its dates are contradicted by the
        program's frozen input (F7, inputs/BAILEY-2009-541-ECC2K130/
        talk-35minutes_text.md): ECC2K-95 1998, ECC2-97 1999, ECC2K-108 2000,
        ECC2-109 2004.
        (c) Per J1 the 14 are not sub-rho once the table is built.
      corrected_wording:
        - >-
          Every listed degree is prime, so F_2^n has no subfield other than F_2.
          Descent-to-a-subfield-curve attacks are outside this contract's scope,
          and this run asserts nothing about any attack's applicability to any
          listed curve.
        - >-
          The 14 store-budgeted cells sit at degree labels 97 and 109, where the
          Certicom challenges ECC2K-95 and ECC2-97 (broken 1998, 1999) and
          ECC2K-108 and ECC2-109 (broken 2000, 2004) live per the frozen input.
          They are cost-model rows, not statements about those curves, and
          counting the oracle table's construction none is below rho.
    - id: J4-9
      check: units, and KN-FIND title risk in the hypothesis record
      quoted:
        - "H statement: ... so the memory alone costs at least what the attack it replaces costs in total."
        - "H mechanism: ... the d and m exponents then cancel exactly, leaving a total of 2^n at every m and every factor-base size."
      why: >-
        The first compares log2 entries with log2 operations under no declared
        unit, and per J1 it understates the case: writing the store takes at
        least as many operations. The second is refuted by the run's own P1 result
        (the total is m!*N and rises with m), yet remains quotable from the
        hypothesis record.
      corrected_wording:
        - >-
          ... the oracle's table holds more entries than rho performs operations
          in total, and writing it takes at least that many operations; so, given
          generic m-SUM, no cell of the model is below rho at any store.
        - >-
          ... leaving m!*N, independent of the factor-base size and increasing
          with m.
      remedy_note: The hypothesis is immutable. Carry the corrections in the EV record.

  what_holds:
    - >-
      Claim tier: heuristic_estimate is stated in the contract scope, the
      manifest scope and claim_ceiling, and is not exceeded.
    - >-
      The manifest scope block, the contract claim_ceiling and
      what_it_does_not_touch, and the H statement_note all carry the
      GIVEN-generic-m-SUM conditional and name the sub-generic oracle as the
      surviving route.
    - >-
      The contract's P5 and the manifest's P5 sentence are correctly scoped to the
      listed degrees. P5 reproduces in the model as written, and stays true under
      cofactor 2 or 4 at every n != 131 (J1 S7).
    - >-
      No sentence in T1-T4 uses the published 2^60.8090 at any degree other than
      131.

  comparison_with_coordinator_prior:
    locked_before_reading: >-
      ../TASK-20260928-a1c7e5/verdict_lock_before_prior.txt (2026-09-30T21:17:31Z),
