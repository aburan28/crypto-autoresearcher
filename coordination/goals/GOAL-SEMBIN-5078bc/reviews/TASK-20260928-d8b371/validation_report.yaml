  what_this_check_could_not_detect:
    - The declared object (RESULTS.md, the EV record) does not exist. Whatever is written there later is unreviewed by this report.
    - >-
      The PR #1470 description body was not read; a sentence there that is not in
      the commit message is unreviewed.
    - >-
      The sentence extraction is regex-based. Sentences naming a curve only
      indirectly ("this curve", "the target") are caught only by my reading, which
      may miss some.
    - >-
      Hostile-quoter reading is judgement, and this harness resolves every role to
      one underlying model. The author's model and mine share drafting habits, so
      an overstatement in a register we both find natural is the kind I am least
      likely to see.
    - >-
      Recalled facts used only as pointers, and not load-bearing: the GHS /
      Weil-descent characterisation in J4-8(a) is from memory (provenance:
      recalled). The solve dates in J4-8(b) are from the frozen input (retrieved:
      read in this session).

  out_of_joint_observations:
    - >-
      J2 (TASK-20260928-3f90b8): A1's signature check fired at m = 4, 5, 6, 8 and
      the run did not stop (F6; J1 report).
    - >-
      Coordinator: A3 C-BOUND-PROBE, A6 realisation table and A7
      C-BASELINE-CONSISTENCY are absent from the receipt; RESULTS.md is missing;
      TASK-20260928-e4f7b2 still reads written_not_dispatched with no archive
