validation_report:
  id: VAL-20260930-ea7f96
  task_id: TASK-20260928-d8b371
  review_plan_id: REVIEW-SEMBIN-20260928-04ec3c
  joint: J4
  joint_verdict: breaks
  run_ids: [RUN-SEMBIN-c68773]

  what_was_reviewed:
    joint_object_as_declared: >-
      RESULTS.md and the evidence record proposed from it. NEITHER EXISTS:
      experiments/EXP-SEMBIN-04ec3c/RESULTS.md is absent (j4_scan facts F9), and
      no EV-* record cites EXP-SEMBIN-04ec3c. The joint therefore cannot be
      discharged on its declared object.
    texts_actually_scanned:
      - "T1 experiments/EXP-SEMBIN-04ec3c/runs/RUN-SEMBIN-c68773/manifest.yaml: 18 degree/curve sentences, 7 'charge' sentences"
      - "T2 experiments/EXP-SEMBIN-04ec3c/specification.yaml, incl. A1-A8: 24 and 14"
      - "T3 ledger/hypotheses/H-SEMBIN-8e7ae3.yaml: 7 and 4"
      - "T4 the snapshot commit message 3c97c0d40, which is what main and PR #1470 carry: 6 and 4"
