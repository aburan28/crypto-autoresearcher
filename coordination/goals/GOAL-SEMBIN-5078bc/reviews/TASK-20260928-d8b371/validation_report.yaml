  artifact_checks:
    - check: integrity of the reviewed texts
      result: >-
        manifest.yaml sha256 e2457017... matches artifact-digests.json; all texts
        committed (3c97c0d40, e56b0a215) and reachable from origin/main; full
        receipt checks are in VAL-20260930-9e4591.
  metric_recomputations:
    - j4_scan.py facts F1-F9 (j4_scan_output.json); the n = 79/89 and published-column figures come from j1_rederive.py functions, run in this session
  control_checks:
