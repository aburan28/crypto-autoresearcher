    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/jv2_wrong_drivers.py
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/jv2_gate_plus.py
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/jv2_grid_resolution.py
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/jv2_planted_counter.py
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/ptm_v2.py
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/jv2_out/ (jv2_results.json, jv2_stdout.txt, jv2_gate_plus.json, jv2_gate_plus_stdout.txt, jv2_grid_resolution.json, jv2_grid_resolution_stdout.txt, jv2_planted_counter.json, W*_gate_report.json, W*_model_v2.py, W5_run_v2.py)
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261001-b2c916/ptm_out/ (ptm_v2_results.json, ptm_v2_stdout.txt)
  reproduce: >-
    From the task directory, run python3 jv2_wrong_drivers.py --work <scratch> (about
    3.5 min); then python3 jv2_gate_plus.py --work <same scratch> (about 3 min);
    python3 jv2_grid_resolution.py (20 s); python3 jv2_planted_counter.py (5 s); and
    python3 ptm_v2.py (5 s). Every script refuses to run if the committed code, raw result
    or reused previous-round script differs from its recorded sha256. The full per-driver
    run directories are regenerated deterministically; their raw-result sha256 values are
    in jv2_results.json.
