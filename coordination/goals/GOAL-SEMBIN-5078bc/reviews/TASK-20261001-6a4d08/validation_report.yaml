        degrees (m 2..16, every d on the 0.25 grid, every listed store budget
        including unlimited) fall below the VOW column, and 0 fall below PUB at
        n = 131 (T4). The zero is a property of the oracle law: the FREE control,
        whose oracle is charged at zero, has 7,850 in-domain cells below VOW
        (371 below PUB at n = 131). For generic algorithms at large the same
        conclusion is a corollary of Shoup 1997 via Wagner 2002 Cor. 1
        (KN-LIT-011; DEC-20261001-5c9e7a R6), not of this run, which is an
        implementation-fidelity fixture. The result is SILENT on oracles that use
        the curve's structure -- membership tests x(P) in V, Weil-descended
        summation polynomials, approximate F_2-linear x-coordinate filters, and
