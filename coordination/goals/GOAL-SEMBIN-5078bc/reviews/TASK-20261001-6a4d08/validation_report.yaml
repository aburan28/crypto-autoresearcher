      corrected: >-
        4. Within the v2 cost model (the oracle table's construction is charged as
        operations, one per entry; memory is reported, not charged), for the three
        primary oracle laws ENUM, MITM and MITM_CAPPED -- decomposition oracles of
        the GENERIC CLASS, which touch the group only through group operations and
