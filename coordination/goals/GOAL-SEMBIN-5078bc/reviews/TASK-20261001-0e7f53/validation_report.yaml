  joint_verdict: breaks
  joint_verdict_by_clause:
    C1_driver_computes_header_block: holds
    C2_FILL_is_a_lower_bound_not_over_or_under_charged: breaks
    C3_CALLS_lt_0_exclusion_removes_exactly_the_out_of_domain_cells: holds (with a non-material labelling limitation, see L-4)
    C4_single_instance_is_the_right_reading_for_the_vOW_comparison: holds (no v2 row falls below any precomputation or multi-instance baseline)
  breaking_artifact:
    statement: >-
      A primary cell whose correctly construction-charged total differs from the
      v2 value by more than rounding. FILL = s d charges |F|^s ordered s-tuples.
      The table stores SUMS, and a sum is symmetric in its tuple, so each distinct
      key is written ~s! times. A table of s-multiset sums has
      binom(2^d + s - 1, s) ~ |F|^s / s! entries, and it serves the v2 probe law
      o = (m - s) d with identical success. Any decomposition R = sum_I f_i is
      hit through an (m - s)-sub-multiset probe whose complement's sum is in the
      table, perhaps under a different representative, which still yields a
      valid relation. It is built at one group addition plus one write per entry:
      depth-first over non-decreasing index tuples, each node = parent sum + one
      element, internal nodes ~1/|F| of the total. So FILL over-charges by
      log2 s!, from 1 bit (s = 2) to 15.30 bits (s = 8).
    cells:
      - cell: n = 131, MITM, B unlimited, m = 8, s = 4, d = 20.5 (the v2 per-degree primary minimum at n = 131)
        v2: {PROBE: 82.7992, FILL: 82.0000, LA: 41.0, TOTAL: 83.4543, margin_vs_VOW: +19.129, margin_vs_PUB: +22.645}
        distinct_entry_FILL: 77.4150
        corrected_TOTAL: 82.8332
        delta_bits: -0.621
        corrected_margins: {vs_VOW: +18.508, vs_PUB: +22.024}
      - cell: n = 131, MITM, B unlimited, m = 10, s = 5, d = 16.75 (largest in-domain change, budget law unchanged)
        v2_TOTAL: 84.7707
        corrected_TOTAL: 83.8027
        delta_bits: -0.968
      - cell: n = 233, MITM_CAPPED, B = 2^100, m = 4, d = 50.5 (budget law applied to the distinct entries actually stored)
        v2: {s: 1, TOTAL: 237.585}
        corrected: {s: 2, TOTAL: 187.085, log2_distinct_entries: 100.0}
        delta_bits: -50.5
        note: both totals are far above VOW (116.33). Shown only as the largest per-cell effect.
    bounded_consequence: >-
      (i) Every variant leaves the sub-rho count at 0: VD (distinct FILL, budget
      law unchanged) and VDB (budget law on distinct entries), against both VOW
      and PUB at n = 131. (ii) In domain PROBE >= FILL holds exactly (max
      FILL - PROBE = 0.0, reached only at CALLS = 0), so with the budget law
      unchanged the FILL term moves any in-domain TOTAL by less than 1 bit (max
      0.968). (iii) Per-degree minimum margins vs VOW move 97: 16.551 -> 15.857;
      109: 17.699 -> 16.781; 131: 19.129 -> 18.508; 163: 21.648 -> 21.244;
      191: 23.648 -> 23.244; 233: 26.220 -> 25.474; 239: 26.779 -> 26.264;
      283: 29.037 -> 28.472; 409: 35.497 -> 34.761; 571: 42.852 -> 42.012.
      (iv) With the budget law on distinct entries, per-budget minima drop by up
      to 3.508 bits (233, B = 2^100) and the B = 2^80 rows by 0.694-3.000 bits.
      The smallest per-budget margin stays +15.857 (n = 97). (v) E-1 survives
      intact. E-2 survives as a fixture of the header model (v2 implements the
      header exactly). As a "construction-charged cost", E-2 overstates by
      0.40-0.92 bits per degree. The v2 TOTALs are upper bounds on the
      construction-charged cost of their own oracle, not lower bounds. They may
      not be quoted as lower bounds.
    escalation: >-
      None warranted by this break. It makes IC cheaper by under 1 bit in domain
      and creates no sub-rho cell. It is a model-specification over-count in the
      amendment header (ordered table size inherited from v1's MITM "memory
      |F|^floor(m/2)"), not an implementation defect in the v2 driver.

