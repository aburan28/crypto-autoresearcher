  cost_model_checks:
    - check: unit declared
      result: pass
      detail: >-
        One operation per group op, probe, multiply-add or table write (RESULTS
        line 10; C-1). Attainability of one op per table entry (attack step 3):
        ATTAINABLE. Depth-first enumeration gives one group addition per entry
        plus one write. This matches the v1 convention that a probe (one group
        op plus one lookup) counts as one. Under a stricter unit that counts the
        group op and the memory access separately, both FILL and PROBE gain
        about 1 bit, and so does the rho iteration (step plus distinguished-point
        check). FILL is therefore NOT under-charged. It IS over-charged by
        ~log2 s! relative to the distinct-entry table (the breaking artifact).
    - check: optimistic assumptions flagged
      result: pass
      detail: >-
        The unit, LA = |F|^2, the relation count |F| and HEUR-VOW-CURVE are
        flagged in RESULTS. Not flagged: the ordered-tuple table size (the
        over-count above) and the ordered-probe redundancy (m - s)!. X-1 covers
        the probe side; nothing in the receipt covers the table side.
    - check: memory reported alongside time
      result: partial
      detail: >-
        log2_table_entries is reported per row. log2 bits is not reported (PD-7
        "store in entries only"), although v1 metrics[2] asks for entries AND
        bits. The entries are themselves overstated by log2 s! (ordered count).
    - check: total = per-attempt cost x inverse success probability
      result: pass
      detail: >-
        PROBE = K + TPR + o = log2(relations x m! N / |F|^m x per-trial oracle
        cost), with p from the declared heuristic and recomputed exactly (R1).
        Where TPR < 0 (p > 1), the model reads 1/p < 1 as several relations per
        oracle call, which is consistent with an MITM call that returns every
        decomposition of its target. C-2 floors the relation phase at one call.
        At every per-degree argmin the whole relation phase is 2^0.24 .. 2^2.04
        oracle calls (n = 97: 2^0.24 calls, each yielding ~2^21.0 relations).
        The v2 minima are "one or two full MITM passes" figures, and the
        construction charge binds only at that edge.
    - check: most IC-favourable constant accounting within the v2 s-range (exploratory, not a v2 row)
      script: jv1_favourable_constants.py
      result: >-
        X-1's probe side (s! for m!) combined with distinct-entry FILL and the
        budget on distinct entries gives 0 sub-rho cells. Per-degree margins vs
        VOW: under X-1's own CALLS guard, +9.59 (97) .. +27.97 (571); under a
        bare at-least-one-probe floor, +5.48 (97) .. +21.39 (571). The latter is
        bound-tracking at m = 16 (s = 8). Analytically the balanced minimum is
        N/2 + (N/2 + log2 s!)/(2s - 1) + 1, which exceeds VOW = N/2 - 0.175 at
        every s, so no constant-level re-accounting of this generic MITM class
        reaches rho at any m.

  precomputation_reading_checks:
    scope: >-
      Attack step 2. All 362,219 in-domain v2 primary cells (bound n, ENUM / MITM
      / MITM_CAPPED, every budget, v2 oracle laws). Script
      jv1_precomputation_readings.py; per-degree minima in jv1_summary.json.
    readings:
      P1: free table; per-target online = log2(2^PROBE + 2^LA); advice = s d entries
      P2: free table AND free factor-base logs + LA; per-target online = one descent = max(TPR, 0) + o; advice = log2(2^(s d) + 2^d)
      P3a: T = 2^t targets, table built once and charged, relation phase + LA per target, amortised per target
      P3b: T targets, table + factor-base logs + LA built once and charged, one descent per target, amortised
      t_values: [0, 10, 20, 30, 40, N/4, N/3, N/2]
    baselines:
      VOW: log2 0.886 + N/2 (HEUR-VOW-CURVE, unvalidated). Rho may ignore advice or targets, so every reading's best baseline is <= VOW.
      BL_on(a): >-
        log2 1.77 + (N - a)/2, floored at 0. Bernstein-Lange 2012, KN-LIT-7cc07f
        (kb; confidence reported; full text not read): anchor 1.77 l^(1/3)
        online with an l^(1/3) table. The sqrt(N/A) scaling off-anchor is an
        assumption.
      CGK(a): >-
        (N - a)/2. Shape of the S T^2 ~ N generic preprocessing bound,
        KN-LIT-013 (kb; confidence reported; full text not read). S is taken in
        ENTRIES (IC-favourable), with epsilon = 1 and polylog factors dropped.
      BLopt(t): >-
        log2(2 sqrt(1.24 x 1.77)) + (N - t)/2. BL precomputation
        1.24 sqrt(N A) + T x 1.77 sqrt(N/A), with table A optimised, amortised
        per target. Derived here from the KN-LIT-7cc07f anchor.
      KS(t): >-
        0.5 + (N - t)/2, i.e. sqrt(2 T N) total. Kuhn-Struik, KN-LIT-f47b10
        (kb; the record marks the constant "standard statement; exact constant
        not re-verified"). Yun 2015's matching generic lower bound is named
        inside that record and is recalled, not read.
    result_on_v2_rows: >-
      0 cells below baseline in any reading, at any degree or T. Minimum margins
      per degree, with 97 and 571 as the ends: P1 vs min(VOW, BL_on) +46.54 ..
      +204.51; P1 vs VOW +15.67 .. +42.01; P2 vs min(VOW, BL_on) +24.18 ..
      +142.68; P2 vs VOW +0.675 at every degree; P3a vs min(VOW, KS, BLopt)
      +16.55 .. +42.85; P3b +14.52 .. +40.50; vs the CGK shape, P1 >= +47.37
      and P2 >= +25.00. THE v2-ROW CONCLUSION NEEDS NO RECALLED CONSTANT. With
      table, factor-base logs and linear algebra ALL free, the per-target
      descent of every in-domain v2 cell costs at least (N + L)/2 >= (N + 1)/2.
      The proof: s <= m/2 together with at least one oracle call. That is VOW
      + 0.675 bits, attained by ENUM m = 2 at d = (N + 1)/2, whose advice is
      just F. Every reading's best baseline is <= VOW, so no precomputation or
      multi-instance reading of the v2 rows can win. Prior item (c) does not
      fire on the v2 rows.
    exploratory_extension_EXT:
      definition: >-
        NOT a v2 row; outside the v2 oracle laws. Table side s in 1..m-1,
        distinct-entry table FILL = log2 binom(2^d + s - 1, s), one probe per
        group op hitting with probability 2^(FILL - N), descent
        max(N - FILL, 0), relation phase d + max(N - FILL, 0). This is the
        strongest IC-favourable precomputation oracle this reviewer could
        construct. Algebraically it is randomised baby-step giant-step whose
        baby steps are s-sums of F.
      result: >-
        Free-precomputation online vs BL_on at matched advice (a <= N/2):
        >= +23.47 bits, 0 below. Vs the CGK shape: >= 0.00, touching only when
        the table holds the whole group. Amortised over T: vs KS >= +0.50 at
        every degree and T (0 below); vs min(VOW, KS, BLopt) >= +0.50 (0 below).
        Vs BLopt alone: -0.567 bits at T >= ~2^10..2^30, i.e. 2 sqrt(N/T)
        against 2.96 sqrt(N/T).
      reading_of_the_BLopt_crossing: >-
        Not a break and not breakthrough-shaped, in this reviewer's judgement;
        the Coordinator decides. (1) EXT is not a v2 row. (2) BLopt is BL's
        small-table point. It is the right baseline for online time against
        ADVICE SIZE, where EXT loses by >= 23 bits. It is not the best generic
        algorithm for AMORTISED time with unconstrained memory; Kuhn-Struik is
        cheaper there, and EXT loses to it by 0.50. (3) The 0.567-bit gap is
        exactly the constant ratio of randomised BSGS (2 sqrt(TN), memory
        sqrt(TN)) to BL's optimised amortisation (2.96 sqrt(TN), memory ~T). It
        is a known property of generic algorithms, not an index-calculus
        advantage. (4) The +0.50 margin over KS rests on a constant that
        KN-LIT-f47b10 marks as not re-verified. It is a pointer for retrieval,
        not support.

