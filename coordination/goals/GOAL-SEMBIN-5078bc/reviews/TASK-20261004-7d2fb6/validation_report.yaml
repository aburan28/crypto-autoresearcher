        statement: 'In the Boolean ring B = F_2[x]/(x_i^2+x_i) every ideal is the vanishing ideal of its zero set. Checked on the whole ideal I generated by the system (reference closure with D = N+1 and size-1 multipliers, i.e. all multiples): N=12: rank 4094 = 2^12 - |V| (|V| = 2); N=14: rank 16378 = 2^14 - |V| (|V| = 6). Consequence: a row lies in I iff it vanishes at ALL zeros, so for an instance with |V| = 2 or 4 an evaluation check at all zeros is not merely necessary but sufficient for ''W'' is inside I''. It still would not give W inside the degree-capped closure (instances with |V| = 0 have no zero at all), and it says nothing about completeness. This is a suggestion, not a finding against the producer.'
