  verdict_reading_guide: '''breaks'' on W8 and W9 means that the card''s pre-registered breaking artifact for that joint was found; in both cases it is narrow, none changes a verdict-bearing value of either run, and each is stated with its reproducing command below. ''holds'' on W5 means: no defect in the UNMUTATED closure.c and no statement-versus-code difference in the order or the budget, over the tested configurations (N <= 26, plus degree 6/7 at N = 12); it is not a check of any N >= 40 closure, which this card forbade (see limitations).'
  joints:
    W4:
      verdict: holds
      verdict_rationale: 'Holds for the claim as the card words it: witnesses are common zeros (VERIFIED), the check evaluates what is stated (VERIFIED, positive control), and no bulk-corruption mutant touching about as many rows as the defect observed on 0.0.20200125 (the check counted 0.478 and 0.490 of the output rows non-vanishing there, so at least that share was corrupted) passed (VERIFIED at N = 16..20, plus the real defect flagged in the package logs). What I did find, and state as scope: smaller corruptions DO pass in a fraction of trials, most on a sparse witness, and the necessary-only control stays clean as predicted. If the Coordinator reads the card''s ''a bulk-corruption mutant that the evalcheck passes'' as any BULK mutant regardless of size, those passes meet it; I did not read it that way because the claim attacked is about a defect ''of the kind seen''.'
      claim_as_attacked: That the -DECH_EVALCHECK build evaluates what the notes say (every input row and every output row of every elimination at a verified common zero); that the witness each cross-check used is a common zero of the .ms system; and that a clean reading rules out a bulk out-of-ideal defect like the one seen on M4RI 0.0.20200125 but not out-of-ideal rows that vanish at the single witness.
      failed_attempts_to_break:
      - 'Looked for a witness that is not a common zero: both witnesses violate 0 generators in my own evaluator and equal the first zero of count_m2''s lister, which equals the set my independent counter finds.'
      - 'Looked for an evalcheck that does not evaluate what is stated: positive control (wrong witness) flags at the first elimination, and a correct witness reads in=0 out=0 for all three routines.'
      - 'Looked for vacuity on a bulk defect (the card''s breaking artifact: a bulk-corruption mutant that the evalcheck passes). Result, stated exactly: mutants DO pass when they corrupt few rows by single-bit flips (w4_controls part C, 12 trials per setting; the settings with at least one passing trial: chained_n16 nbad 1: 11/12 trials pass; chained_n16 nbad 2: 11/12 trials pass; chained_n16 nbad 4: 9/12 trials pass; chained_n16 nbad 8: 7/12 trials pass; chained_n16 nbad 16: 6/12 trials pass; chained_n16 nbad 32: 5/12 trials pass; chained_n16 nbad 64: 4/12 trials pass; null_n12 nbad 1: 12/12 trials pass; null_n12 nbad 2: 12/12 trials pass; null_n12 nbad 4: 12/12 trials pass; null_n12 nbad 8: 12/12 trials pass; null_n12 nbad 16: 12/12 trials pass; null_n12 nbad 32: 11/12 trials pass; null_n12 nbad 64: 9/12 trials pass; null_n12 nbad 128: 6/12 trials pass; null_n12 nbad 512: 2/12 trials pass; chained_n20 nbad 1: 9/12 trials pass; chained_n20 nbad 2: 7/12 trials pass; chained_n20 nbad 4: 7/12 trials pass; chained_n20 nbad 8: 4/12 trials pass), and the passing is worst on the instance whose witness is sparse (null_n12, 5 ones in 18 coordinates, f = 0.77% of columns visible). The defect the claim is about is not of that size: in the notes'' logs the check itself counted 66,598 of 139,204 and 68,559 of 139,898 output rows that do not vanish at the witness (0.478 and 0.490 of the rows), so at least that many rows were corrupted. Extended to that size (w4_bulk_scale: nbad >= 0.5 x the rank of the corrupted elimination single-bit flips, which touch at least about 39% of the rows before the silent re-echelonization; three instances) the evalcheck flagged 168/168 trials (14 settings x 12; the out= counts it reported ranged from 5 to 1870: one flip need not leave one visible row after the re-echelonization), and the same evalcheck flagged the real defect at the window scale in the package''s own logs (W9-1). So no mutant touching about as many rows as the observed defect passed, although single-bit flips are the least visible corruption per row. I read ''bulk out-of-ideal defect of the kind seen'' as that size. Read as ''any BULK mutant, whatever its size'', the mutants listed above are passing artifacts, and the claim as the notes word it (''necessary condition ... not a proof'') is already consistent with them; the corrected wording below states the size dependence.'
      scope_finding_the_card_predicted: The check is necessary only and is a bulk-defect detector. It cannot see an out-of-ideal row that vanishes at the witness (necessary-only control below) and its per-bad-row detection probability for an isolated corruption is only the fraction of monomials equal to 1 at the witness (about 4.4% and 7.8% for a random degree-4 monomial, 5.0% and 8.5% over all columns, at the two window witnesses). It cannot see completeness at all.
