        statement: 'Cause: the chain supports ''unsound eliminations occur on M4RI 0.0.20200125 under both mzd_echelonize and mzd_echelonize_pluq, and do not occur on release-20240729 on the same configuration''. It does not isolate a cause inside the library, and the NOTES say so. I opened the upstream source (my clone of malb/m4ri, retrieved): commit 34b1b560e29f0c67f7e5b07d3e767c9dc4784761 (2020-05-14, Martin R. Albrecht, ''fix count for remaining number of rows in a block / fixes #74'') changes only m4ri/mzd.h, in mzd_remaining_rows_in_block: it adds M->row_offset to r and removes it from the n == 0 branch; it is not in release-20200125 and is in release-20240729; 58 commits separate the releases (matches the NOTES). Further facts the NOTES do not state: those 58 commits include the 2021-08/09 refactor that removed the rows[] array and the whole multi-block storage layout (''force a single block'', ''get rid of blockrows_log'', ''get rid of blocks uglyness for good''; wi_t became 64-bit; also ''ple_russian: actually use a window'', ''mzd_ple: actually test it!''), so in release-20240729 mzd_remaining_rows_in_block no longer exists and the regime named in the NOTES (row windows into multi-block matrices) cannot occur; hence 20240729''s soundness at this scale is consistent with, but does not isolate, commit 34b1b56. A function-level test (compiled against the 20200125 headers/library, N=44 geometry: 149,986 columns, 32,768 rows per block, a window with row_offset 32,718): mzd_remaining_rows_in_block returns the right count for window rows in block 0 and over-counts by the row offset for rows in block 1 (32,918 for 32,768; 32,908 for 32,758; 32,569 for 32,419): the 20200125 function IS wrong in that regime. This shows the cited commit fixes a real defect of the kind described; it does not show that this defect produced the bad rows (no elimination was run, and an N=44 run was out of scope). Attribution remains NOT isolated, as the NOTES state; the ''candidate'' wording is the most the evidence supports.'
