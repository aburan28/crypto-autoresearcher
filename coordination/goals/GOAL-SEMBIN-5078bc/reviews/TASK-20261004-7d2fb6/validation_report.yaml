  - 'Constraint touched: the card forbids re-running any window-scale (N >= 40) closure. To size my reference tool I ran my own reference closure (not closure.c) once on the n=45 draw 0 system at D=2 and D=3 (0.02 s and 0.65 s, ~30 MB; ranks 90 and 8,465, equal to the lane''s D=2/D=3 records). These are not the D=4 closure and could not affect the blind lane''s memory; I report them as a borderline action and used them for nothing in any verdict. I did not repeat them for other instances and ran no other computation at N >= 40 apart from instance generation/parsing/counting (zero counters and regeneration are not closures).'
  - The shared scratchpad path named in the task prompt already held the producer's and Coordinator's files; my own work is under .../scratchpad/v7d2fb6/ (binaries, bulk) and this write scope (scripts, outputs). The refclos binary used in the early campaigns was built before two additive edits to refclos.cpp (the MAXMU environment variable and a 'macaulay' mode); behaviour with MAXMU unset and in the other modes is unchanged.
  - 'Model: the session''s resolved model is recorded in the attestation block of this report; the card asks for the review-adversarial policy with fallback not allowed; no fallback was used. Session reasoning effort cannot be independently verified from inside the session and is not asserted.'
  limitations:
  - 'W5 ''holds'' is about closure.c''s product logic over N <= 26 (and degree 6/7 at N = 12): there is no N >= 40 closure in my evidence, the final bases of the three window insufficient records are not archived, and they are too large to saturate-check here (a 166,705 x 179,447 basis is ~3.7 GB dense). The extension to window scale rests on the absence of N-dependent product logic (only batch sizing and memory accounting scale), the guard tests at N = 40..62 and the equal-code check across the lane commits. The blind lane is the independent check at scale.'
  - 'The five solution-free sufficient records (n=40 d0, n=41 d0, n=43 d5 at D=4; n=42 d0, n=44 d0 at D=2) have no witness: 1 in W_D at scale is protected only by the structural check and the fixed library. A reference closure at D=2 for the last two is a millisecond computation but N = 42/44, so I did not run it; the Coordinator or the blind lane can.'
  - Small-N mutants are absorbed by redundancy unless they remove almost an iteration or a structural class (dose-response); the verifier's power against a rare defect that removes a handful of products that are the only source of a pivot is not measured here (such losses did not occur in 212 block-drop runs, including all single-product positions sampled).
  - 'W4-4/W4-5/W4-8 controls were run at N = 16..20; detection rates at the window depend on the witness weight and are a computed model there (no corruption was injected into any window-scale run: that is an N >= 40 closure this card forbade).'
  - The library actually loaded by the producer (hash ad69e178...) was not shown to be a clean build of the tag; behavioural evidence at scale is the producer's own cross-checks (two instances) and the n=44 20240729 verdict run.
  - W9-2's function-level test shows a real defect in 20200125's inline function in the relevant geometry; it does not attribute the observed bad rows to it.
