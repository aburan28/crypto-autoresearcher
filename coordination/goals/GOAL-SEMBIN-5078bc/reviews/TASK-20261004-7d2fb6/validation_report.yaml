        grade: VERIFIED
        difference: 'VERDICT RULE for 1 in W. The card''s rule says ''impossible iff N_std < |V|''. closure_cert.closure_certificate takes a separate branch when 1 is in W: it sets verdict = sufficient and solutions = 0 without comparing with the caller-supplied |V|. Handed a deliberately wrong |V| = 5 on a solution-free instance it still returns sufficient (solutions 0, solutions_source ''caller_supplied''); the non-1 branch does return ''error'' for std < |V|. (The 9bb990 NOTES describe this as a recording defect; closure_cert.py was not changed for 5ed13e.) For the five 5ed13e records with 1 in W the exact |V| is 0 (my independent counter agrees on all 12 instances and on all 60 draws), so no verdict is wrong; but for those five records the rule did not USE |V|, and the soundness of 1 in W_D rests on the elimination alone.'
