      verdict: holds
      verdict_rationale: 'Holds under the card''s breaking-artifact definition: no disagreement of the UNMUTATED closure.c with my reference closure or saturation verifier on 127 completed runs, and no statement-versus-code difference in the order or the budget. Two verified differences that are NOT order or budget are reported and carry corrected wording: S2 (early stop at the first batch that yields 1: the recorded rank and digest of one record, n=40 draw 0, are an intermediate batch-dependent state; I excepted the 7 early-stop runs from the rank/LM comparison for exactly this reason, which is a disagreement of the recorded rank with the statement''s W_4 in those runs) and S3 (the verdict rule does not compare with |V| when 1 is in W). If the Coordinator counts S2 as a ''defect in the unmutated closure.c'', W5 would read breaks on rank/digest for that one record; the verdict-bearing values (N_std, verdict) are unaffected.'
      claim_as_attacked: That closure.c's product set is complete (every product mu*f with 1 <= |mu| <= D - deg f of every row that must be multiplied is formed exactly once and reaches the elimination, across batches, iterations, the single-level path, memory-driven splitting and resume) and that the card's statement of the closure equals what closure.c implements.
      closure_c_in_my_words: 'Columns: all squarefree monomials of size <= D, blocks by size descending, within a block ascending bitmask (Gosper), so column 0 is the largest monomial in the statement''s ORDER and a reduced row''s leading monomial is its first set column. Iteration 0 writes the generators as written, echelonizes (RREF) and installs the basis; every installed row is flagged new. Iteration i>=1: the rows flagged new (rows whose pivot column was not a pivot before, plus, in a later batch of the same iteration, rows whose pivot is flagged pivot_new_) are copied densely to NM; for each such row (in row order a) the multipliers are all squarefree monomials of size md = 1..D - popc(leading monomial) (ascending Gosper order; cursor (a, md, mi)); products are written (write_product: union, parity-cancel, column lookup) into S = [basis; batch], the batch size is re-derived before every batch from the live rank and the memory cap (batch_for; a floor of 1024 products below which the run stops ''unreached''), B_ is freed after the products are written (9096320e22), S is eliminated (PLUQ), the output is checked structurally and no old pivot may be lost, install_basis keeps the new/pivot_new_ flags, and ckpt_save writes the cursor and flags. The iteration ends when the cursor is exhausted; the closure ends when an iteration gives no new pivot, when every new row already has size D (n_prod = 0), when 1 becomes a pivot after a batch (early stop), or at the cap. The single-level path (max_iter = 1) multiplies the ORIGINAL generators, each by monomials up to D - (its own largest monomial size), in one iteration on top of the RREF of the generators. Resume reloads basis, flags, history and the cursor (a, md, mi) and the dense NM of the interrupted iteration.'
      statement_versus_code:
      - id: S1
        grade: VERIFIED
        difference: 'ORDER and BUDGET: none. The column layout reproduces the card''s ORDER pairwise for N = 8..62 (column i is strictly larger than column i+1 under a literal implementation of the card''s comparator), and the leading-monomial LISTS of the production closure equal those of my reference closure (written from the statement alone) on every completed unmutated run. Budget D - deg f with deg f = size of the leading monomial is what the product loops use.'
        evidence:
