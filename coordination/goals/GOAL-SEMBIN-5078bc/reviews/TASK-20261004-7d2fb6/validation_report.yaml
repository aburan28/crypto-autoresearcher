        difference: Only 'new' rows are multiplied, each in the RREF version current at the start of its iteration, and each by sizes 1..D - size(LM). The statement closes under EVERY f in W. Equivalent because (a) the leading monomial of a sum of rows with distinct leading monomials is the largest of them, so deg f = max deg of the rows involved; (b) a later reduction only adds rows with later pivots (size <= deg), whose own budgets are at least as large; (c) closure under multipliers of size 1 with budget D - deg f already generates all larger multipliers (mutant MG, size-1 multipliers only, never changes an outcome in 27 runs). The argument is PLAUSIBLE (argued, not machine-checked); its prediction, equality of the production closure with the worklist reference closure (which multiplies every inserted vector, not just new rows), is VERIFIED in the campaign below.
