  narrowest_supported_statement: >-
    REVIEWER COMPUTATION, claim tier heuristic_estimate for the constructions and
    retrieved-theorem for the envelope. No curve touched. Inside the generic
    class G1-G3 (faithful, random-list guarantee), at the ten degree labels, and
    with fill charged, LA charged and memory reported, no constructed
    harvesting configuration has a total for K = |F| relations below
    log2(0.886) + N/2. That covers PCS (X-6 as written and at source
    constants), ideal birthday, per-target vOW golden collision in the sparse
    and dense regimes with the coupon (m in {4, 6, 8, 10}, s <= S, all w, n_h up
    to l), and shared-table hybrids. The minimum margin is +0.585 bits at every
    degree, at |F| = 2, and it tends to 0 only as the harvester degenerates
    into rho. By Hhan 2024 Thm 3.4 + C.1 (retrieved), no such harvester can be
    below the column for |F| >= 10 (conservative negation conversion), nor at
    any |F| if it uses additions only. Free-negation harvesters with |F| < 10
    remain open, as the generic-DL constant question. The sparse/dense
    dichotomy and the dense-limit = PCS identification hold, with the
    corrections in O4 and O5. Claim (B)'s premise fails only beyond
    n_h w ~ 24.5 l, and its conclusion holds everywhere. On proves-too-much, the
    clause-2 counting and G1-G4 do not bound the known index calculus on F_q^*
    or genus-5, -6 or -8 Jacobians. Both objects are excluded by the arity-1
    restriction (A) and by G2 (B), because their real oracles decide m-fold
    product or sum-set membership by norm factoring.

