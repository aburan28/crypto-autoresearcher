    per_object: >-
      Columns: real IC total (margin vs VOW) | m-fold advantage per test |
      clause-2 counting bound IF the real oracle is admitted at the arity-1
      price | 1/8 line under the same admission | counting at the oracle's
      TRUE success probability | Hhan generic-oracle margin.
      F_q^* 131, trial division: 50.38 (-14.44) | 94.3 b | 72.36 (+22.0) |
      69.36 (+19.0) | 35.67, consistent | +7.31.
      F_q^* 131, batch smoothness: 47.44 (-17.38) | 96.6 b | 75.02 (+27.6) |
      72.02 (+24.6) | 33.37, consistent | +9.97.
      F_q^* 256, trial division: 78.06 (-49.27) | 199.6 b | 138.81 (+60.8) |
      135.81 (+57.8) | 55.43, consistent | +11.26.
      F_q^* 256, batch smoothness: 68.07 (-59.26) | 202.9 b | 142.85 (+74.8) |
      139.85 (+71.8) | 52.05, consistent | +15.30.
      Genus-5 Jacobian, b = 32: 61.45 (-18.38) | 115.1 b | 95.25 (+33.8) |
      92.25 (+30.8) | 44.91, consistent | +13.70.
      Genus-6 Jacobian, b = 27: 54.06 (-26.77) | 124.3 b | 94.38 (+40.3) |
      91.38 (+37.3) | 37.74, consistent | +11.83.
      Genus-8 Jacobian, b = 20: 49.94 (-29.88) | 124.7 b | 90.00 (+40.1) |
      87.00 (+37.1) | 35.30, consistent | +8.45.
    where_the_argument_survives_and_why: >-
      As SCOPED, the signature does not fire on either object. Clause 2's class
      A_FV grants unit cost only to an ARITY-1 test (x(Q) in V, i.e. Q in F),
      priced at |F|/l per test. That price is clause 1(b) at m = 1. Each
      object's real oracle decides membership in the m-fold product or sum
      set, so (A) is silent on it. The MUTATION "admit the object's native test
      at the arity-1 price" fires on every object: the counting bound sits
      22.0 to 74.8 bits, and the 1/8 line 19.0 to 71.8 bits, above the known
      index calculus. Priced at the oracle's TRUE success probability, the same
      counting gives T ~ K/p_real, which equals the real IC's call count:
      consistent, no contradiction. With each object's GENERIC oracle (list
      lookup, random list), the Hhan envelope gives TOTAL above VOW by +7.3 to
      +15.3 bits at the real IC's d. So Omega(sqrt(K l)), not merely
      Omega(sqrt l), comes out.
    excluding_step:
      F_q_star: >-
        MEMBERSHIP IN THE m-FOLD PRODUCT SET AT POLYNOMIAL COST: B-smoothness of
        the lifted integer, i.e. all arities up to about u at once. It is
        implemented by NORM FACTORING: the lift is the norm from Z, factored by
        trial division or batch remainder trees. For (A), the step that
        excludes the object is the class's arity-1 restriction together with
        the per-test price |F|/l. For (B) it is G2 (membership only by list
        lookup), with G1 (the lift reads the representation) and G3 (smoothness
        needs F = the small primes) also failing.
      genus_g_Jacobian: >-
        MEMBERSHIP IN THE g-FOLD SUM SET AT POLYNOMIAL COST, implemented by
        NORM FACTORING in F_q[x]: factor the Mumford u-polynomial (u is the
        divisor's norm). The excluding steps for (A) and (B) are the same as
        for F_q^*: G2, plus G1 (reads the Mumford coordinates) and G3.
      binary_curve_analogue: >-
        Deciding R in F_V^(m) on E(F_2^n) requires Weil-descended
        summation-polynomial solving. A_FV excludes it, HEUR-HARVEST-FV is
        silent on it, and it is OPEN-B. So the arguments prove exactly as much
        as their class allows. The separator is the oracle class, as both
        earlier proves-too-much rounds found.

  # ---------------------------------------------------------------------------
  objections:
    - id: O1
      severity: material
      joint: JR-2
      text: >-
        "+7.17 bits" is quoted as the best constructed generic cell (R8 reasons;
        DERIVATION 2.2, 2.5, 2.7; H-SEMBIN-c7e1d4 dominated_by context). It is
        not the generic harvesting frontier. It is X-6 under three constraints:
        w <= K (multi-version regime), w >= 2^10 (vOW range), and the program's
        convention (no negation map, K = 2^d). DERIVATION 2.2's
        "T - N/2 = 2 + d - w/2 >= 2 + d/2" bounds only w <= d. For w > K the
        birthday law governs, with a degree-independent margin
        log2[Gamma(K+1/2)/(Gamma(K) Gamma(3/2))]: +0.585 at |F| = 2 and +4.676
        at |F| = 2^10 (FAV). The ruling is unaffected, but no record should
        carry +7.17 as a minimum.
    - id: O2
      severity: material
      joint: JR-2
      text: >-
        Citation delta (red-team item 9). DERIVATION 3.4 item 1, H-SEMBIN-c7e1d4
        SD-1 and DEC-20261002-7a3f19 R8 say no opened source states the generic
        constant, and that Hhan Thm 3.3 is a Maurer-model O(T^2/|G|). At source,
        Thm 3.3's proof states log eps + log|G| <= log((T+3)^2/2), and Thm 3.4's
        states log eps + m log|G| <= m log(e(T+2m+1)^2/(2m)). Both are explicit.
        Equality gates are free. Appendix C Thm C.1 transfers both to faithful
        random-representation algorithms at equal group-operation complexity.
        So "unspecified constant" and "Maurer only" are both lifted by a source
        already cited, and the R8 residual (1) is closed at constant level for
        |F| >= 10. Thm 3.4's event is m INFORMATIVE collisions, i.e. rank m.
        Full-rank harvesting therefore does not need DERIVATION's "single named
        missing step" (K-of-L). By my derivation (unreviewed), the same encoding
        argument gives Pr[rank >= k] <= C(B,k)/l^k for k <= m, which is that
        step in rank form.
    - id: O3
      severity: material
      joint: JR-2
      text: >-
        The residual is real and must be stated as OPEN. For free-negation
        harvesters with |F| < 10 no theorem in hand excludes a sub-VOW total.
        The conservative envelope is -1.12 bits at |F| = 2; the best
        construction is +0.585. It reduces to the generic single-DL constant
        with negation (Thm 3.3 conservative: 0.471 sqrt(l) vs 0.886 sqrt(l)).
        That question is not index-calculus content. A record that says "no
        generic harvester is below the VOW column" without "|F| >= 10, or
        addition-only" overstates by exactly this region.
    - id: O4
      severity: material
      joint: JR-2 (dense regime)
      text: >-
        DERIVATION 2.4's dense per-relation expression 7 l'/sqrt(n_h w) is valid
        only when the per-target harvest is at least one vOW version's yield
        (1.1 w q). Carried into a total as K x per-relation without that guard,
        it MANUFACTURES sub-VOW cells. In the floor-deletion mutation there are
        115 (n = 97) to 905 (n = 571) such cells per degree; FAV m = 10 reaches
        -12.66 bits at n = 97, -17.99 at n = 131 and -91.66 at n = 571. Every
        such minimum has K below one version's yield (for example 2^22.8 vs
        2^88.5 at n = 131). Hhan Thm 3.4 forbids them for |F| >= 10, so the
        expression without the guard proves too much. R8 records that the dense
        numbers were never derived. Whoever derives them next must carry the
        guard; it is the analogue of v2's C-2 domain guard.
    - id: O5
      severity: minor
      joint: JR-2 (dense regime)
      text: >-
        "As n_h -> l, g becomes injective" should read n_h -> l_e/2, since
        |I x {1,2}| = 2 n_h. And equality of cost with PCS is reached much
        earlier: at n = 131 for d >= 20, n_h ~ 2^93.
    - id: O6
      severity: minor
      joint: JR-2 (claim B)
      text: >-
        The boundary of claim (B)'s per-relation premise is n_h w ~ 24.5 l, not
        k = 1. The premise survives into the shallow dense regime. See
        claim_B_answer.
    - id: O7
      severity: minor
      joint: JR-2 (X-6 constants)
      text: >-
        X-6 mixes conventions. It uses the generation-only constant (4.04) for a
        construction that must locate collisions (5.05, +0.32 bit). It has no
        negation map against a negation-equipped VOW (+0.5 bit against index
        calculus). It uses K = 2^d rather than 2^(d-1)+1 (+1 bit against index
        calculus). Its small-d extrapolation (+2.17 at d = w = 0) lies outside
        vOW's measured range and is not the small-d frontier.
    - id: O8
      severity: material
      joint: proves_too_much (routed to JR-3, not owned)
      text: >-
        HEUR-HARVEST-FV-2's justification (ii) is safe ONLY because the
        unit-cost test is arity-1 and priced at |F|/l per test. The draft's
        class text does exclude summation polynomials. But the formal statement
        should name the arity explicitly ("a unit-cost oracle deciding Q in F;
        not Q in F^(m) for m >= 2") and should mark the per-test price as clause
        1 at m = 1. Admitting an m-fold test at that price falsifies the clause
        by 19 to 75 bits on F_q^* and on genus-5, -6 and -8 Jacobians.
    - id: O9
      severity: minor
      joint: proves_too_much / heuristic (routed to JR-3 and the V1 design)
      text: >-
        "|F| ~ 2^D/h" (heuristic-restatement section 2) is not right for every
        V. Every point of the odd-order subgroup lies in 2E, so by the halving
        criterion (J3 section 5, checked exhaustively at toy size)
        x(<P> \ {O}) is contained in the affine trace hyperplane
        Tr(x) = Tr(a). For h = 2 this gives |F_V| in {0, 2^D/2, 2^D}, depending
        on whether V lies inside ker Tr and on Tr(a). For example,
        V in ker Tr with Tr(a) = 1 gives F_V empty. h = 4 adds a second
        condition. A random V of dimension D sits inside ker Tr only with
        probability about 2^-D, but structured choices of V can. |F| must be
        measured, not assumed, when V1's lambda_2 grid is targeted, because a
        factor 2 in |F| is a factor 16 in lambda_2. The closure-matched null is
        size-matched, so the test itself is unaffected.

  required_controls:
    - id: RC-1
      what: >-
        In any record that quotes a generic margin, replace "+7.17 (best
        generic cell)" with the degree-independent envelope: C3's
        margin(K) = log2[Gamma(K+1/2)/(Gamma(K) Gamma(3/2))] for the
        construction, and the Hhan Thm 3.4 + C.1 lower envelope (|F| >= 10
        conservative; addition-only at every d). State the |F| < 10 residual.
      cost: zero compute
    - id: RC-2
      what: >-
        Every future dense-regime figure must carry the per-version-yield guard
        (harvest per target >= 1.1 w q, else the birthday floor). Keep the
        floor-deletion mutation as a STANDING positive control: it must
        manufacture sub-VOW cells. A harness whose no-floor variant does not is
        blind.
      cost: seconds (jr2_harvest_envelope.py)
    - id: RC-3
      what: >-
        The cheapest discriminator for this report's own C5 lower estimate,
        max(floor, steady): a toy vOW golden-collision search on a keyed random
        FUNCTION (not a curve) with |S| ~ 2^24 to 2^28, measuring cost to K
        useful collisions in the partial-version regime. Null object: the same
        harness with q = 1 must reproduce the birthday law. Predicted: within
        0.3 bit of max(floor, steady). This is an experiment, so it needs a
        contract. It was NOT run.
      cost: minutes
    - id: RC-4
      what: >-
        Vendor arXiv 2402.11269v1 under inputs/ with a source_record and hashes,
        as was done for vOW, so that the constant-level claim rests on frozen
        bytes rather than this session's scratch text extraction. Then retrieve
        Yun 2015's full text (only the abstract has been retrieved) as an
        independent second source for the m >= 2 constant.
      cost: one curation task
    - id: RC-5
      what: >-
        For the |F| < 10 residual, retrieve the best known generic expected
        constants WITH the negation map for one to five instances. Pointers,
        recalled and backing nothing: Bernstein-Lange, "Two grumpy giants and a
        baby" (ANTS 2012); Galbraith-Wang-Zhang on BSGS with the negation map.
      cost: one literature task, low rank

  counterexample_or_mutation: >-
    JR-2: no counterexample. The closest approach is C3 FAV at |F| = 2 with a
    +0.585 bit margin; K -> 1 is rho itself, margin 0. Two mutations localise
    the load-bearing pieces. (1) Delete the birthday floor from the dense
    golden-collision model: 115 to 905 spurious sub-VOW cells per degree. The
    guard is the per-version yield. (2) Admit each object's norm-factoring
    membership test at clause 2's arity-1 price: the proves-too-much signature
    fires by 19 to 75 bits. The arity restriction is what separates the
    objects.

  baseline_comparison: >-
    vOW parallel rho with the negation map (the VOW column, 0.886 sqrt(N);
    KN-LIT-73f7e1's sqrt(pi/2) times the negation factor, under the unvalidated
    HEUR-VOW-CURVE) dominates every constructed generic harvester in time at
    every degree, by at least +0.585 bits (at |F| >= 2^10, at least +4.68),
    and in memory too: rho needs negligible memory, C3 needs O(K) distinguished
    points, and C5 needs w up to 2^314. Rho without negation, sqrt(pi l/2), is
    +0.500 above VOW. Every PROG configuration is compared to a column it
    cannot reach without negation, so PROG margins carry that 0.5 bit. BSGS is
    worse on average and needs sqrt(l) memory; it is not the frontier. Closest
    specialised baselines: on Koblitz labels, rho with Frobenius
    (VOW - log2 sqrt(2n); X-7) dominates further. The preprocessing reading
    (Bernstein-Lange KN-LIT-7cc07f; CGK KN-LIT-013) is out of scope because the
    card charges fill.

  dominated_by:
    constructed_configurations_C1_to_C6: >-
      vOW rho with the negation map (VOW column; KN-LIT-73f7e1 read in full),
      in time at every degree (min +0.585) and in memory. Domination by one
      checked row suffices for a non-null value. KR-RHO rows were not re-read
      in this session.
    LB_envelope: n/a (a lower bound, not an algorithm)
  sota_delta:
    time: >-
      +0.585 bits or worse for every constructed configuration, degree-
      independent; +4.68 or worse at |F| >= 2^10. No improvement.
    memory: worse than or equal to rho
    data_queries: none
    contribution: >-
      Interface and accounting only. A constant-level envelope from a cited
      theorem, a guard for dense-regime figures, and the location of the
      proves-too-much separator. No attack, and no statement about any curve.

  heuristic_challenges:
    - >-
      HEUR-HARVEST-FV-2 (ii): the per-test price |F|/l is clause 1(b) at m = 1.
      Its transfer to F_V is exactly what V1 tests. The proves-too-much control
      shows the price is load-bearing (O8). The cheapest exposure of a
      deviation is V1's N_2 statistic (TASK-20261002-a84e65's design, not read
      here).
    - >-
      Clause-2 constant 1/8, generic sub-class only. At M >= K it is implied by
      Hhan Thm 3.4: about 0.86 sqrt(K l) addition-only and about
      0.30 sqrt(K l) conservative with negation, both at least
      (1/8) sqrt(K l). The memory-limited branch (M < K) has no generic-group
      theorem behind it; Dinur 2020 is a random-function result and was only
      abstract-read. That is routed to JR-3, not owned.
    - >-
      Size normalisation of F_V by trace geometry (O9). It affects the targeting
      of V1's lambda grid, not the size-matched test.
    - >-
      VOW rests on HEUR-VOW-CURVE (unvalidated). Neither C3 nor the VOW column
      charges fruitless cycles, r-adding-walk penalties or distinguished-point
      restarts. The omission is symmetric.

  cost_model_challenges:
    - >-
      Total = per-attempt cost x inverse success probability is honoured
      throughout. Sparse-regime targets with no golden collision are charged
      their full search. The coupon is charged. Locating is charged with
      vOW's constant (5.051 = generation 4.040 / 0.8). Fill is charged per
      distinct entry, LA as 2 log2 K or 2d, and the factor-base build as 2^d.
    - >-
      C5's per-target cost max(floor, steady) is a lower estimate, optimistic
      for the hybrid, by at most about 0.3 bit where the floor binds (locating
      the K/q fake collisions). RC-3 discriminates.
    - >-
      Memory is reported, not charged, as the card specifies. C3's minimum at
      |F| = 2 needs only O(K) distinguished points when theta is chosen so that
      theta t >= K (vOW 4.1). Trail starts cost one scalar multiplication each,
      about N operations, which is negligible while the distinguished-point
      count is much smaller than t/N.
    - >-
      In the Hhan conversion, the input-negation cost (2mN) and the 2m+1
      additive terms are both carried. Both are negligible at every listed
      degree (A/X < 2^-15 at d <= N/2).

  reduction_and_scope_challenges:
    - >-
      Hhan's theorems bind harvesters whose guarantee survives a random list
      (G3) and that are faithful (Thm C.1's condition; PCS and rho-type walks
      are faithful). An F_V-structured harvester is outside both. Whether F_V
      admits one is JR-1's interface question and clause 1's, not JR-2's.
    - >-
      Generic class only. Nothing here bears on A_FV's membership test,
      summation polynomials, approximate x-filters, Frobenius by squaring,
      preprocessing, or multi-instance (many-Q) readings.
    - >-
      Thm C.1 was read at the level of its simulation description (FindLabel /
      FindElement with free equality gates). The type-safe model's handling of
      data-dependent element selection was not independently audited. RC-4
      freezes the source for that audit.

  proof_architecture_challenges:
    - >-
      Boundary and strictness: the old method is embedded exactly. C3 at
      K = 1 on the negation quotient is vOW rho, with margin +0.00037 bits,
      which is the rounding of 0.886. The minimum over K >= 1 is attained at
      the embedded baseline. That is why "the minimum margin" is not a property
      of any index-calculus configuration.
    - >-
      Method ceiling: the generic-group method cannot exclude sub-VOW at K = 1
      with free negation (0.471 sqrt(l) conservative, 0.667 refined, against
      0.886). The |F| < 10 residual is exactly where this ceiling bites.
    - >-
      Compositional invariant: deleting the birthday floor is the first step
      that fails (O4). Deleting the coupon changes no optimum, since the
      coupon factor is at most 0.03 bits there.
    - >-
      Observation fiber: the per-relation cost cannot separate PCS, the dense
      hybrid and the floor-deleted artifact; DERIVATION 2.6 already found the
      first collision. The separator is total cost against the Gamma-law or
      Hhan envelope.
    - >-
      Nearby objects: F_q^* and genus-5, -6 and -8 Jacobians are separated
      only by the oracle class: arity-1 membership versus norm-factoring m-fold
      membership.
    - >-
      Quantifier order: "FOR ALL faithful G3 harvesters, FOR ALL |F| >= 10,
      FOR ALL listed N: E[T] + LA > VOW". The constant is uniform; no witness
      is chosen after the instance.

  resource_reading:
    examined: true
    reading: >-
      The obstruction that DERIVATION and R8 measured, "per-relation cost below
      sqrt(l) is not a generic invariant", is the hypothesis of Hhan's
      rank-counting bound. Read as an asset, the same quantity that makes the
      per-relation trigger misfire (amortisation over K) makes the TOTAL bound
      grow as sqrt(K). That turns COR-GEN's exponent-level Omega(sqrt l) into a
      constant-level exclusion for every non-degenerate factor base.
    spawned_ids: []
    spawned_ids_note: >-
      Ledger writes are outside my scope. Candidates for ranking (not
      evidence): RC-4 (vendor Hhan 2024), and the rank-form K-of-L sketch (O2)
      as a possible discharge of OPEN-C's generic half.

