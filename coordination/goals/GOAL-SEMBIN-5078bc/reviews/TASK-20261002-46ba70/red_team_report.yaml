  JR2_verdict_detail:
    verdict: holds
    one_line: >-
      No generic harvesting configuration constructed in this review falls below
      the VOW column at any of the ten degrees: 39 configuration families per
      degree, both conventions. The minimum margin is +0.585 bits at EVERY
      degree. It is degree-independent and sits at the degenerate end
      (|F| = 2, K = 2, ideal birthday harvesting with a negation map). As
      K -> 1 the harvester becomes vOW rho itself, and the margin -> 0 from
      above. The baseline-embedding check gives margin +0.00037 bits, which is
      exactly the rounding of 0.886 against sqrt(pi/4).
    theorem_backed_part: >-
      Hhan 2024 (arXiv 2402.11269v1) was read at source this session. Thm 3.4
      bounds the probability of finding m informative collisions (rank m) with
      at most T group-operation gates by (e (T+2m+1)^2 / (2m|G|))^m. The +1
      encoding bit is kept as a factor 2. Equality gates are free. Thm C.1
      carries this to faithful random-representation (Shoup-style) algorithms
      with the same group-operation count. A harvester that outputs full-rank
      relations over a random negation-closed list F and Q solves
      (|F|/2 + 1)-MDL. Free negation is converted conservatively: track -X
      beside X, so at most 2 gates per operation, after negating the m inputs.
      Under that conversion, E[T] exceeds the VOW column for every |F| >= 10
      (d >= 3.25 on the 0.25 grid) at every listed degree. The refined
      half-group heuristic gives |F| >= 6. ADDITION-ONLY harvesters (no
      negation, no subtraction: X-6's walk, vOW rho without negation) are
      excluded at every d, even K = 1: Thm 3.3's explicit
      eps <= (T+3)^2/(2|G|) gives E[T] >= (2/3) sqrt(2l) = 0.943 sqrt(l),
      which is VOW + 0.090 bits.
    open_residual: >-
      Free-negation harvesters with |F| < 10 (at most 4 +-classes). The theorem
      lower envelope sits 1.12 bits below VOW at |F| = 2 (conservative). The
      best construction sits 0.585 bits above. Truncate any harvester there at
      its first relation and hand it Dai's known-representation list: a sub-VOW
      harvester there yields a sub-VOW generic single-DL algorithm with at most
      ~10 x 2N extra operations. So the residual is the generic-DL constant
      question for one to five instances. It is not index-calculus content and
      not binary-curve content. It is OPEN, not closed by this report.
    r8_safety_at_constant_level: >-
      SAFE. R8's ruling does not depend on Cor. 1's unspecified constant. The
      constant-level exclusion for every non-degenerate factor base
      (|F| >= 10) is supplied by a retrieved theorem with explicit constants.
      The only uncovered region is the degenerate |F| < 10 end, where index
      calculus coincides with generic DL. One condition remains: the G3
      interface (does a harvester's guarantee survive a random list?) is
      JR-1's, and this verdict is conditional on it.

