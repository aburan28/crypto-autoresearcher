    signature_fired_as_scoped: false
    objects_reused_hash_checked: >-
      TASK-20261001-b2c916 ptm_v2.py (c38c7f49...) and ptm_v2_results.json
      (be9a46dc...); TASK-20260928-3f90b8 ptm_known_false_objects.py
