    reading: >-
      Every generic family except C5 is a ratio to sqrt(l), so its margin is
      the same at every degree. C3's margin as a function of K is
      log2[Gamma(K+1/2) / (Gamma(K) Gamma(3/2))] (FAV). Values: +0.585 at
      |F| = 2, +0.907 at |F| = 4, +1.740 at |F| = 16, +4.676 at |F| = 2^10,
      +9.675 at |F| = 2^20. Only the decomposition-structured hybrid (C5)
      depends on N. Its half-domain must reach
      n_h >= ~57 sqrt(K l_e) for the steady state to beat the birthday floor,
      so its d is forced up to roughly (N/2 + log2 S! + 6)/(S - 1/2). Its margin
      therefore grows roughly linearly in N.

  configurations_constructed:
    conventions: >-
      PROG is the program's convention: no negation map in the harvester (space
      l), K = 2^d, LA = 2d, decomposition relations only. FAV is the most
      favourable to the harvester: negation map (space l/2), K = 2^(d-1) + 1
      (the rank over the +-classes of a negation-closed F, plus x),
      LA = 2 log2 K, homogeneous coincidences counted as relations. Both
      charge the factor-base build 2^d. The VOW column itself carries a
      negation map (KN-LIT-73f7e1 item 1), so PROG compares a negation-free
      harvester against a negation-equipped rho, exactly as X-6 does.
    C1_X6_as_written: >-
      2 + d + (N - w)/2 with w <= d, plus LA. Re-derived at source (attack plan
      item 1). vOW 4.2, lines 408-417, gives: 10w distinguished points per
      version, theta = 2.25 sqrt(w/n), 80% of iterations generating, 1.1w
      distinct collisions per version. Generation per version is
      (10/2.25) sqrt(nw) = 4.444 sqrt(nw). The total per version is
      5.556 sqrt(nw), and 0.45 n/w versions x 5.556 reproduces eq. (4)'s 2.500
      exactly. So the cost per DISTINCT collision is 4.040 sqrt(n/w) for
      generation only (2.015 bits; X-6's '4') and 5.051 sqrt(n/w) with
      locating (2.336 bits). X-6 therefore equals the generation-only constant
      x K x sqrt(n/w) with n = l and K = 2^d. The +7.17 check at n = 131,
      d = w = 10 gives 71.5 - 64.3254 = +7.1746. With 4.040 it is +7.189. With
      locating it is +7.511, which J3's hash-walk construction needs because
      its relation comes from the colliding pair's hash indices.
    C2_PCS_source: >-
      K x c x sqrt(n/w) + LA, with c in {4.040, 5.051}, under PROG and FAV.
      Memory 2^10 <= w <= min(K, n/2^10) (multi-version regime). Best is FAV
      generation-only, +6.690 at d = 11 and w = 2^10 at every degree.
    C3_birthday_full_memory_ideal: >-
      E[time to the K-th coincidence] = sqrt(2n) Gamma(K+1/2)/Gamma(K),
      n = l or l/2. No distinguished-point or locating overhead. Reachable to
      within o(1) by PCS with distinguished-point memory >> K (vOW 4.1). This is
      the regime w > K that X-6's 'w <= d' excludes. At K = 1 it IS rho (the
      baseline embedding).
    C5_per_target_golden_collision: see dense_regime_derivation below
    C6_shared_table_hybrid: >-
      A target-independent table of M_t DISTINCT entries, with fill charged at
      one operation per distinct entry (CORR-20261002-e58c3a K13), plus a
      per-target walk with distinguished-point memory w, where M_t + w = M.
      Relations per probe: M_t/l_e (table hits) + sqrt(w/l_e)/5.051 (PCS
      rate). Floor sqrt(2 K l_e). Swept over d, M from 2^10 to l_e/2^10, and the
      table share alpha in {0, 2^-30 ... 0.99, 1}. The optimal table share is
      alpha* = 0 at EVERY d, degree and convention. The table never helps once
      fill is charged. It is a set of stored points, and in the memory-limited
      regime its hit rate M/l loses to PCS's sqrt(M/l)/c whenever M < l/c^2.
    LB_hhan: theorem_backed_part above
    not_constructed: >-
      Precomputation readings (table free and shared across instances) are
      excluded by the card's fill-charged total. Bernstein-Lange and CGK govern
      them. Frobenius applied by squaring and every coordinate-reading oracle
      fall outside the generic class (X-7; A_FV).

  dense_regime_derivation:
    coupon_corrected_model: >-
      Per target R = aP + bQ, with S = m/2. D1 = S-multisets of F (or an
      n_h-subset); D2 = R - (m-S)-multisets; n1 = n2 = n_h <= n_full =
      C(|F|+S-1, S). vOW 5.3's f(x,i) = g(f_i'(x)) lives on
      |S| = min(2 n_h, l_e) points. Among its 2 n_h group images there are two
      kinds of real coincidence:
        cross (decompositions): k12 = n_h^2/l_e;
        same-side (homogeneous relations, FAV only): khom = n_h^2/l_e.
      f has about |S|/2 collisions, so the useful fraction is
      q = k_useful/(|S|/2), with k_useful = k12 or 2 k12.
      Steady-state cost per useful collision: 5.051 sqrt(|S|/w)/q. In eq.-(8)
      form this is 7.14 l_e/sqrt(n_h w); vOW's eq.-(8) constant is 7.07 and
      DERIVATION's is 7. Validity: 2^10 <= w <= |S|/2^10.
      Floor: g real coincidences need t >= sqrt(2 g l_e) generated images
      (sqrt(4 g l_e) for cross pairs only).
      Coupon: a decomposition has mu = max(1, C(m,S)(n_h/n_full)^2)
      representatives (70 at m = 8, S = 4 on full domains), so the
      decomposition pool is P12 = k12/mu, and Phom = khom. Draws are uniform
      over useful pairs (G2), so the expected distinct relations after g draws
      are
        D(g) = P12 (1 - e^{-g pi12/P12}) + Phom (1 - e^{-g pihom/Phom}).
      TOTAL = min over g of max(1, K/D(g)) * max(sqrt(2 g l_e),
      g * 5.051 sqrt(|S|/w)/q) + LA + |F|. The min over g is a scan plus
      golden-section on log g.
      Collapsing dimensions without loss: at fixed (d, s), time falls as w
      rises to min(|S|/2^10, |F|^s), and it falls as n_h rises to
      min(n_full, l_e/2), because both q and the pool grow. Grid: m in
      {4, 6, 8, 10}, s in 1..S, d on the 0.25 grid up to N/2, all ten degrees,
      both conventions.
      max(floor, steady) is a LOWER estimate of the vOW cost, i.e. optimistic
      for the hybrid. Where the floor binds, the true cost is higher by the
      locating of the K/q fake collisions, about 2.5/theta each: at most about
      0.3 bit.
    per_m_minima_FAV_best_over_s: >-
      Margins vs VOW by degree, in the order 97 / 109 / 131 / 163 / 191 / 233 /
      239 / 283 / 409 / 571:
      m = 4: +20.15 +22.15 +25.49 +31.15 +35.82 +42.82 +43.82 +51.15 +72.15 +99.15
      m = 6: +10.93 +12.09 +14.09 +17.47 +20.34 +24.47 +25.09 +29.47 +42.09 +58.34
      m = 8: +8.05 +8.85 +10.30 +12.68 +14.68 +17.68 +18.18 +21.30 +30.30 +41.85
      m = 10: +6.46 +7.09 +8.21 +10.09 +11.64 +13.96 +14.34 +16.72 +23.72 +32.72
      PROG is 1.6 to 2.7 bits higher in every cell (jr2_results.json).
    regime_and_coupon_at_the_optima: >-
      Every per-degree optimum is in the DENSE regime (golden pairs per target
      2^25.9 to 2^76.9), from one target for m >= 6. For m = 4 it takes
      2^5.2 to 2^7.7 targets. The coupon factor at every optimum is at most
      0.03 bits, because the pool is much larger than the per-target harvest.
      The 70-fold split multiplicity RAISES golden density and costs nothing
      until per-target harvest approaches lambda = n_h^2/(70 l_e). Reading
      "l' absorbs split multiplicity" as dividing yield by 70 would be a
      6.13-bit error against the hybrid.
    dense_limit_equals_PCS: >-
      HOLDS, more broadly than stated, and from above. At fixed d,
      C5 >= sqrt(2 K l_e) >= C3 holds analytically: n_T sqrt(2 r l_e) =
      K sqrt(2 l_e/r) with r <= K. Numerically at n = 131 (FAV), C5 - C3 at the
      same d is +22.25 (d = 12), +4.26 (d = 16), and 0.000 for d >= 20. Equality
      already holds at n_h ~ 2^93 << l_e/2 = 2^127, once the steady per-useful
      cost drops below the birthday floor. Injectivity of g is sufficient but
      not necessary. Separately, DERIVATION's "as n_h -> l" should read
      n_h -> l_e/2, since |I x {1,2}| = 2 n_h. The hybrid cannot follow PCS to
      small d, because n_h <= C(|F|+S-1, S). Its per-degree minimum is +6.46
      (n = 97) to +32.72 (n = 571) at m <= 10. Allowing m > 10 lowers it toward
      the C3 curve, never below it.
    dichotomy_check_n131_m8: >-
      The SPARSE bound HOLDS. At k = 1 (n_h = 2^64.5) the cost per golden pair
      is 2^67.3 = 7 sqrt(l) with w = n_h, and 2^71.8 with vOW's measured
      ceiling w = |S|/2^10. The DENSE per-relation figure CAN fall below
      sqrt(l): 2^59.8 at n_h = 2^76.5 and 2^9.3 at n_h = 2^127, with
      w = |S|/2^10. But that figure is valid only when the per-target harvest
      is at least one vOW version's yield (1.1 w q). Below that, the birthday
      floor binds. See the MUTATION below for what happens when the guard is
      dropped. The dichotomy therefore holds with two qualifiers: the dense
      formula needs the per-version-yield guard, and the injectivity limit is
      n_h -> l_e/2.
    claim_B_answer: >-
      Item (5): IDEA-20260930-4b7d1e claim (B) has a per-relation PREMISE,
      "a per-target golden-collision oracle pays >~ sqrt(2l) per relation".
      That premise holds throughout the sparse regime AND into the shallow
      dense regime. It fails only beyond n_h w ~ 24.5 l (eq. (8) constants). At
      n = 131, m = 8, with vOW's memory ceiling, that is beyond k ~ 2^13.6
      golden pairs (~2^7.5 decompositions) per target. With the formula's
      out-of-range w = n_h, it is beyond k ~ 2^4.6. Its CONCLUSION, "this does
      not by itself create a sub-rho cell", holds in EVERY regime, by the
      total-cost envelope. "Holds only in the sparse regime" (R8;
      DERIVATION 2.4) is right in direction and wrong in boundary.

