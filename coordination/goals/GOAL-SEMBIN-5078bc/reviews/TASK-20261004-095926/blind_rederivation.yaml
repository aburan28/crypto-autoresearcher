quantity_well_posedness:
  well_posed: true
  reading_choices:
  - 'ORDER encoded as key (size, -bitmask): among equal sizes a smaller bitmask is the LARGER monomial (check: x1x2 > x1x3, the largest differing variable index lies
    in the smaller monomial).'
  - deg f of a basis row equals the size of its leading monomial (graded order), so the multiplier budget of a row is 4 - |LM|; the closure subspace itself does not
    depend on the graded order, only LM(W), N_std and the verdict do.
  - 'Field-equation lines (x^2+x) in the files are the zero polynomial in B; they are neither counted in M (M = non-field lines: 40,40,41,41,42,42,43,43,44,44,45,45)
    nor added as generators.  Keeping them as zero generators changes nothing (tested).'
  - 'N is the number of names on line 1 (2k): 40,40,42,42,42,42,44,44,44,44,46,46, NOT the n in the file name (n41 files have N=42, n43 N=44, n45 N=46).  c, the LM
    masks and the hash use this N.'
  - The statement defines W as the smallest closed subspace; it does not define "iterations".  The rank after wave t that this implementation reports (wave 0 = reduced
    generators, wave t = products of the rows created in wave t-1) is an implementation-defined partial-progress measure, not a quantity of the statement.
  - N_std counts squarefree monomials of ALL sizes with no LM member as a subset = faces of a simplicial complex; computed by depth-first face enumeration (C) and
    by an Apriori level-wise count (Python); both agree on all twelve.
