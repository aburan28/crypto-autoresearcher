implementation:
  language: C (gcc 13.3.0, -O3 -march=native -fopenmp, AVX-512/BMI2 host) for the closure and the zero counters; Python 3.11 for the parser, the plain reference closure,
    the post-checks and the test drivers
  libraries: 'C: libc, OpenMP, immintrin (_pext_u64) only.  Python: standard library; numpy 2.4.6 (brute-force ground truth for small systems only); sympy 1.14.0
    (independent Groebner cross-check of PT-3b only); PyYAML 6.0.1 (writing this file).'
  m4ri_linked: false
  m4ri_note: M4RI was not used and was not installed; agreement of the elimination is therefore independent of M4RI.
  elimination: 'closure.c: own reduced-row-echelon (Gauss-Jordan) elimination.  Basis rows are stored as TAIL bitsets over the non-pivot columns (pivot columns are
    dropped at every compaction); candidates (products mu*f) are formed from the creation form of each row, reduced against the RREF basis by XOR of tails, batched
    (256 per batch, OpenMP over candidates and over old rows), no Four Russians / no M4RI table method.  closure2.c (cross-check): plain non-reduced echelon with
    one-pivot-at-a-time head reduction on dense full-width rows, different column order, hash-table product lookup.  ref_closure.py: dictionary head reduction on
    Python-int bitsets, literal fixed-point passes, plus a from-scratch Gauss-Jordan routine.'
