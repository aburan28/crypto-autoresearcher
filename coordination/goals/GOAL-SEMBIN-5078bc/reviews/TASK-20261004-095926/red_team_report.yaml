  proves_too_much_control:
    argument_tested: 'two elimination routines (different algorithms, same product generation) give the same leading-monomial set; an evaluation check at ONE verified common zero is clean on every elimination;
      a structural check of every elimination output passes; therefore the verdict is sound.  Implemented on MY closure (src/pt_controls.py): routines = incremental head reduction and from-scratch Gauss-Jordan
      inside ref_closure.Closure with the same (mutated) product code; structure = distinct LMs, each row highest term = its LM, degree <= 4, every generator reduces to 0.'
    PT1:
      grade: VERIFIED
      status: CONFIRMED BLIND SPOT
      outcome: 'On every missing-product mutant case found (15 cases: (a) budget minus one 4, (b) rows multiplied only when their LM is new 4, (c) generators only 4, (d) last batch dropped 1 row-granularity
        + 2 chunk-granularity) the argument goes through with NO flag (S1, S2, S3 all true), including systems where the unmutated closure says sufficient and the mutant says insufficient.  The argument
        is necessary and not sufficient; quoted as certifying an "insufficient" verdict it proves too much.'
