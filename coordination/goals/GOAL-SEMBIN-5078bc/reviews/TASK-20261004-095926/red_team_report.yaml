  objections:
  - O1 (W1) the verdict labels carry no order.  The statement names degrevlex; the specification names none and never defines the verdict rule.  Verdicts must be recorded as (closure, order, rule).
  - O2 (W3) the recorded certificate is the iterated degree-capped closure, not the single-level block of the contract; they disagree on 7 of 12 windows, so the baseline control (SUFFICIENT at n = 40) is
    met only by the iterated closure.
  - 'O3 (W1) "insufficient" is a statement about the capped closure, not about the ideal: in 122 of 288 random systems the ideal part I_{<=4} certifies sufficiency while the closure does not.  An "insufficient"
    verdict must not be read as d_GB > 4.'
  - O4 the iteration index is undefined in the statement; any "rank after iteration t" comparison between implementations is implementation-defined.
  required_controls:
  - run the literal single-level block (raw generators x multipliers, nothing else) on the twelve through the producer code and compare with results/single_level (rank, N_std)
  - record the order and the verdict rule with every verdict; add a second admissible order for the window verdicts (done here for the 9 sufficient ones, argued for the 3 insufficient ones)
  - for each "insufficient" verdict run a saturation verifier on the final rows; for each "sufficient" verdict require pointwise vanishing of the final rows at all enumerated zeros (done here, 0 violations)
  - comparison with an independent closure (not only elimination routines sharing product generation) is the check that flags missing products
  heuristic_and_cost_model_challenges: 'not applicable: the round claims instrument validity, not an exponent-moving or heuristic-conditional result; no heuristic, o(1) term, time-memory interpolation or
    reduction chain is asserted or tested here.  Costs measured for the blind implementation: closure wall 0.0 s (generators already contain 1) to 768 s per window instance with 3 threads, peak resident
    0.5-1.6 GB; see blind_rederivation.yaml.'
  baseline_comparison:
    dominated_by: not applicable (no performance or complexity claim is reviewed); the only comparison is between two definitions of the certificate (literal single-level block vs iterated closure), reported
      under W3(c); no comparison with Pollard rho, BSGS or any solver is made or implied
    sota_delta: null
  limitations:
  - 'blind values come from one author: two C implementations and a Python reference share my reading of the statement (order encoding, budget by deg f); the statement checks I could make (order sentence,
    definitions) are recorded in blind_rederivation.yaml; no comparison with the producer values was made or seen'
  - soundness of "sufficient" at N >= 40 rests on construction, 584 small-N diffs, pointwise vanishing at all zeros, and (V empty) two explicit subset sums; the independent second implementation reproduced
    the rank on two N=40 windows only (closure2_independent_rerun), and its LM sets were not written (UNREACHED)
  - the order-flip artifact A1 uses weighted graded orders and was found on random sparse systems with |V| = 156; I found no flip among the six orders tested on the twelve windows; I did not test every
    admissible order
  - 'W3(a): the proof is argued from recalled Groebner facts and verified on 60 systems with N <= 7; the Macaulay block of the contract was taken from its one-sentence description'
  - I did not read agents/red-team.md, AGENTS.md or templates/research-records.md (outside the card may_read); the layout follows the card deliverables and completion_gate; the attestation fields are those
    listed there
  - wave ranks are an implementation measure; not comparable with a producer iteration count
  scope_limits: Every statement is scoped to the twelve window systems, the quantity as defined on the card (D = 4, grevlex order, closure under square-free multipliers), the random systems named by their
    generator seeds, and the orders tested.  No impossibility is asserted; no claim about Assumption 1, d_F4, n = 409 or 571, or any curve.
  next_concrete_action: 'The Coordinator compares blind_rederivation.yaml with the producer values field by field per instance (c, r, 1 in W, LM counts and hash, N_std, |V|, verdict) and decides DV-7 using
    results/single_level: the literal single-level block is insufficient on 7 of 12 windows where the iterated closure is sufficient.'
  how_to_reproduce:
  - cd out; bash src/run_V.sh; bash src/run_V_C.sh; bash src/run_V_numpy.sh
  - cd out; bash src/run_all_closures.sh; bash src/run_verification_suite.sh
  - cd out; bash src/run_small_tests.sh
  - cd out; bash src/run_single_level.sh
  - cd out; python3 src/pt_controls.py pt1|pt2|pt3 ...  (see src/pt_controls.py)
  - cd out; python3 src/make_blind_yaml.py; python3 src/make_report.py
