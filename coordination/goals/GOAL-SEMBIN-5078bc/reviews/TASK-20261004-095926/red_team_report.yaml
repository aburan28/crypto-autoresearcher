        grade: argued from standard facts (recalled), numerics above
        text: 'B = F_2[x]/(x_i^2+x_i) is isomorphic to F_2^{F_2^N} by evaluation: the map is a ring homomorphism, injective because a square-free polynomial is determined by its values (Moebius inversion),
          and both sides have dimension 2^N.  In a product of copies of F_2 an ideal generated by g_1..g_M is the set of functions supported inside the union of the supports of the g_i (for a point a with
          g_i(a)=1 the indicator delta_a = delta_a g_i lies in the ideal; conversely every element of the ideal vanishes where all g_i vanish).  Hence I = {f : f|_V = 0} and B/I is isomorphic to F_2^V,
          of dimension |V|; B is reduced so the ideal is radical, and B tensored with the algebraic closure is a product of copies of the closure so every point is F_2-rational.  Hence dim B/I = |V| = N_std(I)
