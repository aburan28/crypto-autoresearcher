    PT2:
      grade: VERIFIED
      a_bulk_corruption: 'the one-zero evaluation check flags a bulk corruption (30% of the rows with five random column flips): flagged in the headline run; as a function of the corrupted fraction its
        detection probability is 0.01 and 0.00 (1 row of 453, two settings), 0.06 (5 rows), 0.14 (3%), 0.40 (10%), 0.87 (30%), 1.00 (100%) over 100 trials each; the check at ALL 63 zeros and the saturation/generator
        check flag with probability 1.00 at every fraction.  So it is not vacuous, but "must flag" holds only for heavy corruption, and a one-zero check is weak against sparse corruption.'
      b_one_extra_row: 'ONE row with f(a) = 0, f(b) = 1 (not in the ideal) keeps the one-zero evaluation check CLEAN (as required), the two routines agree and the structure check passes; the check at the
        other zero and at all zeros flags it.  Effect on the verdict: on a zero-slack system (clean closure sufficient, |V| >= 2, 3/3 tried) the row drives N_std below |V| ("impossible", flagged by the
