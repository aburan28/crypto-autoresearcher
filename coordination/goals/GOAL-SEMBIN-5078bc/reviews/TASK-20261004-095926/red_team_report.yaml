        F1_comparison_with_independent_closure: 'flags every real mutant (a,c,d): 4/4, 4/4, 3/3'
        F2_saturation_verifier: 'flags every real mutant (a,c,d): 4/4, 4/4, 3/3 (also flags corrupted row sets, PT-2); on the packed C closure the verifier gave 0 violations on the correct output and 14,889
          / 1,554 on the (a)/(d) mutants of a test system (src/closure_v.c -C)'
        K_structural_up_set_flag: 'flags (a) 4/4, (d) 2/3 and 0/4 of (c): LM(W) not an up-set inside sizes <= 4; a partial, cheap, product-independent flag; not a substitute'
      mutant_b_note: '(b) is NOT a missing-product mutant: by F_2-linearity of mu*(.) and the degree filtration of an echelon basis every later row is a combination of rows that are themselves multiplied,
        so multiplying each row once at creation yields the same smallest closed subspace; F1, F2 and K are all clean on 4/4 and the verdict equals the unmutated one.  The argument was therefore right to
        pass on (b), and (b) is inconvenient to the card expectation of a flagged mutant.'
