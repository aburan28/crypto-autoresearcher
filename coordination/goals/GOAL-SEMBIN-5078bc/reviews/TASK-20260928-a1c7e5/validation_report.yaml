    - joint: Coordinator
      note: >-
        Process: RESULTS.md is missing; TASK-20260928-e4f7b2 still reads
        written_not_dispatched with no archive receipt found; this task's card
        (TASK-20260928-a1c7e5) is not a committed handoff file, and I was
        dispatched by message.

  verdict: failed
  verdict_reason: >-
    Integrity checks pass: committed, digests match, byte-identical re-execution.
    The receipt is nonetheless NOT admissible as evidence of the quantities it
    names. Its headline metrics ("min_store_to_beat_rho", the sub-rho cell counts,
    P2's below-reference row) rest on a time accounting that omits a term
    dominating every reported sub-rho cell by at least 41.9 bits. Separately, the
    frozen contract's A3 and A7 controls and A6 table are absent, and A1's
    declared stop condition fired unreported. "failed" is a validation verdict on
    the receipt, not a mathematical result about any curve.
  limitations:
    - Claim tier of everything above is heuristic_estimate within the stated oracle class; no curve is touched.
    - Degrees are parameter labels; n = 131 additionally uses ECC2K-130's subgroup order, as the driver does.
    - The joint verdict is on J1 only; this report does not vote on the whole claim.
