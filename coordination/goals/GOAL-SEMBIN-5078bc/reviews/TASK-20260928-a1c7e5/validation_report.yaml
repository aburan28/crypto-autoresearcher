        found no archive receipt for it.

  metric_recomputations:
    - id: S0
      what: independent re-implementation from the cost_model block only (no import of the driver)
      result: >-
        Reproduces all 1,500 reported cells (150 store-free, 1,200 capped, 150
        minimum-store rows) with zero mismatches in total, store or optimising d.
        Reproduces the sub-rho counts 14 (capped) and 90 (distinct store-free
        (n, m)). The driver's "720" is those 90 cells times the 8 budget labels,
        which do not apply to the store-free treatment.
      meaning: >-
        Faithful transcription of the model. Not evidence for the model: both
        implementations share any defect of the text, and section S6 is such a
        defect.
    - id: S1
      closed_form: relations x trials x oracle = m! * 2^(n + d(1-s))
      my_derivation: 2^d * m! N 2^(-md) * 2^((m-s)d) = m! N 2^(d(1-s)) -- PROBE WORK ONLY
      driver_vs_closed_form: >-
        0.000 bits at nine degrees. -2.000 bits at n = 131, where the driver uses
        r = ECC2K-130's subgroup order (about 2^129) in place of 2^n.
      contract_vs_both: >-
        The contract defines N as the prime subgroup order. The closed form, and
        the driver at nine of ten degrees, use 2^n. An ordinary binary curve always
        has the 2-torsion point (0, sqrt b), so N <= 2^(n-1) at every listed degree.
      sensitivity_S7: >-
        Setting cofactor 2 or 4 at every n != 131: the sub-rho capped count stays
        14, cells at B <= 2^80 stay 0, and the n = 97 minimum store moves from 85.4
        to 84.8 or 84.2. The driver's "changes no sign" claim holds for these
        quantities.
      omission: the |F|^s table-construction term (breaking_artifact; S6)
    - id: S2
      closed_form: store-free MITM total = 2^(2n/(floor(m/2)+1))
      my_derivation: >-
        Balancing L + N + d(1-S) against 2d gives d* = (N+L)/(S+1) and total
        2(N+L)/(S+1) + 1, where L = log2 m! and the +1 comes from summing two
        equal terms.
      driver_minus_stated_form_n131_bits: {m4: 2.64, m6: 4.77, m8: 6.29, m10: 7.52, m12: 8.53, m14: 9.46, m16: 10.16}
      driver_minus_my_form_max_abs_bits: 0.23
      consequence: >-
        The stated form omits log2 m! and the +1, an error that grows with m. The
        driver minimises numerically with m! included, so NO reported cell
        inherits it. What inherits it is P2's "m = 6 landing near it" and the
        Coordinator prior's "m = 6 lands at 2^65.5". The driver puts m = 6 at
        2^70.27, 9.46 bits above the published 2^60.8090. This meets the
        breaking-artifact definition on its own, e.g. at (131, 8, 29, 4) the stated
        form gives 2^52.4 against a correct 2^58.69, but it is secondary because it
        moves no reported cell.
    - id: S3
      closed_form: minimum store = S/(S-1) * (n/2 + log2 m!)
      my_derivation: >-
        Probe work < vOW requires d(S-1) > log2N/2 + L + 0.1747, so the store Sd
        must exceed S/(S-1)(log2N/2 + L + 0.1747).
      agreement: >-
        My form is within +0.10 to +0.29 bits of the driver, the residual being the
        0.05-step d grid. The stated form is within -0.93 to +0.51 bits: the -0.93
        at n = 131 is r against 2^n, the rest the 0.886 constant.
      domain_defect: >-
        The form omits the linear-algebra constraint 2^(2d) < W. At S = 2 and 3
        (m = 4..7) the d it requires gives 2d > n/2 at EVERY degree, so no sub-rho
        cell exists for m <= 7 at any store. The driver handles this correctly and
        reports m = 2..7 unreachable at all ten degrees. Consequently the values
        A2/A2b quote at n = 131, 140.2 (m = 4) and 112.5 (m = 6), are not the
        minimum store of any cell, and A2b's argument that P3b contradicts P4
        rests on them. Over reachable m >= 8 the even-m minimum store at n = 131
        rises monotonically (106.8, 108.25, 112.5, 117.95, 124.8), which is what
        P3b's withdrawn clause said. Revisiting the withdrawal is the
        Coordinator's call.
    - id: S6
      what: the build term the model omits, measured in the producer's own cells and then charged
      producer_cells_with_store_exceeding_reported_total_time:
        capped_subrho: "14 of 14 (min gap 41.86 bits; e.g. n=97 m=10 B=2^100: total 2^40.5, store 2^100.0)"
        store_free_subrho_distinct: "90 of 90 (min gap 44.10 bits; P2's n=131 m=8 cell: total 2^58.69, store 2^116.0)"
        min_store_rows_reachable: "90 of 90"
      with_build_charged:
        subrho_cells_any_budget_any_degree: 0
        cells_below_published_2^60.8090_at_131: 0
        corrected_margin_over_vow_bits: {n97: 16.5, n109: 17.7, n131: 19.1, n163: 21.5, n191: 23.5, n233: 26.2, n239: 26.6, n283: 29.0, n409: 35.5, n571: 42.7}
        n131_best: 2^83.44 at m = 8, s = 4, d = 20.55, against vOW 2^64.33
        ECC2-79_and_ECC2-89_best: 2^54.1 and 2^60.1, about 15-16 bits above vOW
      analytic_floor: >-
        For every m, d and s, not only m <= 16: total >= max(sd, L + log2N + d - sd)
        >= (log2N + L + d)/2 > log2N/2 > log2N/2 + log2(0.886). P3a, read correctly,
        says each sub-rho cell's table takes more operations to WRITE than rho's
        entire work. It is a proof inside the model that no cell is sub-rho, not
        the price of entry to one.
      sanity_pointer:
        citation: Shoup, generic-group lower bound Omega(sqrt N)
        provenance: recalled
        load_bearing: false
        note: >-
          A reason to distrust sub-sqrt(N) time from a generic-m-SUM pipeline. Not
          used in the argument: an x-coordinate factor base is not a generic object.

  control_checks:
    - control: C-NULL-NO-MEMORY-CHARGE, relabelled C-BINDINGNESS-DIAGNOSTIC by A4
      finding: >-
        Recomputed with the build term charged, A4's genuine null ("does the
        family's VERDICT differ between store-free and store-budgeted?") returns
        the SAME verdict both ways: nothing beats rho. That is the branch A4 says
        refutes the premise that the oracle's unpriced STORE was the asymmetry.
        The unpriced asymmetry was BUILD TIME; the store budget was standing in for
        it. "720 -> 14, the charge is what does the work" is void as stated, and
        the 720 is a count of 90 cells.
    - control: C-M3-ANCHOR, C-DEGENERATE-M
      finding: reproduced as reported; unaffected, since m = 3 is never sub-rho in either accounting
    - control: C-FLOOR-REPRO (A1)
      finding: OUT OF JOINT (J2). See out_of_joint_observations.
    - control: C-BOUND-PROBE (A3), C-BASELINE-CONSISTENCY (A7), A6 realisation table
      finding: >-
        Not implemented in the driver and not reported in raw-result.json or the
        manifest. raw-result.json carries three controls; the manifest claims four.
        A7's pass criterion ("vOW column reproduces 0.886*2^(n/2) at every listed
        degree") would fail at n = 131 by 1.000 bit.

  weak_point_checks:
    excess_relation_count:
      verdict_on_this_point: holds
      deterministic: >-
        |F|+1 vectors in an |F|-dimensional space over the field Z/NZ are always
        dependent. One more relation guarantees a dependency with sum lambda_i b_i
        != 0 (failure probability about 1/N). So at most |F|+2 relations are needed
        for EVERY m, and stage 1 is multiplied by at most (1 + 2^(1-d)).
      simulation_S4: >-
        Exact rank over GF(2^31-1); |F| in {32, 64, 96}; m in {2..8, 10, 12, 14,
        16}; 30 trials per cell; seed 20260930. The maximum excess over |F| is +1 at
        every m. The requirement rises toward |F|+1 FROM BELOW as m grows (about
        0.67|F| at m = 2, 0.94-0.97|F| at m = 3, |F|+1 from m around 7), matching
        the empty-column fixed point x = 1 - exp(-m x). Bounded, not growing.
      subtlety: >-
        In the sub-rho regime |F|/p < 1. If every relation decomposes the SAME
        target, every kernel vector has sum lambda = 0 and the system is useless,
        so relations must come from at least two targets. This costs nothing extra
        with a shared table, so it is not counted as a break.
    odd_m:
      verdict_on_this_point: holds under the frozen cap s <= floor(m/2)
      analytic: >-
        Odd m = 2S+1 shares s = S with m-1 and carries m! larger by a factor m, so
        its minimum store exceeds that of m-1 by S/(S-1) log2 m. It cannot beat
        even its lower neighbour.
      measured_S5: >-
        No odd m at any degree has a lower required store than either even
        neighbour. Among MITM_CAPPED pairs (odd m against m-1, same degree and
        budget), none has a lower total. Measured gaps at n = 131 are 4.20, 4.25,
        4.20, 4.55 bits against 4.23, 4.32, 4.44, 4.56 predicted.
      sensitivity_S5b: >-
        If s = ceil(m/2) is permitted (tabulate the larger half), odd m = 5, 7, 9
        (and 11 at n = 131) beat BOTH even neighbours, and the n = 131 argmin moves
        from m = 8 at 2^106.6 to m = 7 at 2^102.6. The only reason to cap s at
        floor(m/2) is that a table bigger than the probe side dominates the TIME,
        which is the term the model never charges. So P4's argmin is a property of
        the cap.

  heuristic_validation_checks:
    - not in this joint. HEUR-GENERIC-MSUM is J3 and was not tested; every finding here holds within the stated oracle class only.
  cost_model_checks:
    - check: unit declared
      result: >-
        No. Totals are "log2 operations" with no declared operation type. Store is
        log2 entries; the manifest also lists bits, but no entry width is used. The
        headline "store exceeds rho's entire work by 42.5 bits" compares log2
        entries with log2 operations.
    - check: memory reported alongside time
      result: >-
        Yes, but the time column omits the cost of filling the memory it reports,
        which in every sub-rho cell is the dominant term (S6).
    - check: per-attempt cost x inverse success probability
      result: >-
        relations x (1/p) x oracle is applied literally even where the number of
        oracle calls is below 1 (|F|/p down to 2^-42.6), i.e. fractional attempts
        with the fixed per-oracle setup omitted. The validator.md bookkeeping rule
        is met in form and broken in substance in exactly that regime.
  proof_architecture_checks: []

  comparison_with_coordinator_prior:
    locked_before_reading: >-
      verdict_lock_before_prior.txt, written 2026-09-30T21:17:31Z, sha256
      f94787b9bb413441b98b59423dffecea38360948da3230c2cf64ebda9e6a7c2b
    prior_expected: >-
      Closed forms hold. Overturned only by a sub-rho cell at a holdable store, a
      P5 counterexample at n = 97 or 109, or a mis-accounting of "the relation
      count or the linear algebra".
    found: >-
      Relation count holds. Closed form #3 DOES mis-account the linear algebra for
      m <= 7 (A2/A2b values), which is one of the prior's named overturning
      conditions; it moves no driver cell. The principal break is in a place the
      prior did not name: the oracle's own time. "m = 6 lands at 2^65.5" is 2^70.27
      in the driver. "Confirmation nearly worthless" is right in a stronger sense:
      the confirmed P2 and P4 cells are not sub-rho once time is counted. The P5
      margin at n = 97 is reproduced (2^85.4 against 2^80) in the model as written.

  effect_on_claim_scoped_to_J1: >-
    H-SEMBIN-8e7ae3's statement survives A FORTIORI: under correct time accounting
    nothing in the model falls below rho at any store. The following are void as
    stated:
    (i) the 720 -> 14 bindingness reading;
    (ii) P2's confirmation;
    (iii) the "14 survivors at n = 97, 109";
    (iv) reading P4's 2^106.8 as "the store needed to beat rho". It is the store at
    which PROBE-ONLY work crosses the vOW column.
    The correction touches only table-based oracle models. FREE, ENUM and any
    smoothness-test oracle are unchanged, so it does not by itself make the
    proves-too-much objects (J2's) find nothing.

  what_this_check_could_not_detect:
    - >-
      Shared misreadings: my implementation and the driver come from the same
      cost_model text, so any misreading we share reproduces identically. S0's
      agreement is transcription evidence only.
    - >-
      Correlated blind spots: this harness resolves every role to one underlying
      model, so my "holds" sub-verdicts (excess, odd m under the cap) are weak
      evidence about quantities the author also derived.
    - >-
      Single-instance accounting is assumed, as in the contract. Under a
      precomputation or multi-instance reading the table build amortises and the
      break weakens; the baseline would then have to be rho with precomputation,
      which nobody modelled.
    - >-
      The rank simulation uses random relations at |F| <= 96 over a 31-bit field,
      not structured Semaev relations at |F| = 2^27 over Z/rZ.
    - >-
      HEUR-GENERIC-MSUM (J3) is not tested, nor whether some generic oracle builds
      its table in less than table-size time.
    - >-
      Not verified: r's primality, each listed curve's true cofactor, and the
      published reference's provenance. Checked only that r is about 2^129 per the
      frozen input and that 2^60.8090 = sqrt(pi r/(4*131)) to four decimals.
    - >-
      No cost unit is declared. I assume a table write costs at least one
      operation in the probe's unit.

  out_of_joint_observations:
    - joint: J2 (TASK-20260928-3f90b8)
      note: >-
        A1 SIGNATURE CHECK FIRED AND WAS NOT REPORTED. In A1's sign convention
        (committed - recomputed) the offsets are +1.67, +1.77, +1.98, +2.21, +2.42,
        +2.78. They depart from 2 log2 m by 2.02, 2.44, 2.76 and 3.22 bits at
        m = 4, 5, 6 and 8, beyond A1's 1.5-bit limit. A1 says such a departure is
