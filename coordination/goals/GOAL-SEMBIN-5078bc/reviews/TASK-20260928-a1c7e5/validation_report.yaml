      result: manifest records dirty=true with only the run directory untracked; consistent with the commit history
    - check: deliverables against TASK-20260928-9e14ac
      result: >-
        experiments/EXP-SEMBIN-04ec3c/RESULTS.md DOES NOT EXIST. The producer card
        requires it to carry the A1 signature check and per-bound C-BOUND-PROBE
