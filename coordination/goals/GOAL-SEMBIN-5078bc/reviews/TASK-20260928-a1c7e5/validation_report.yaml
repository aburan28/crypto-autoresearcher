  breaking_artifact:
    cell: {n: 131, m: 8, d: 26.7, s: 4}
    note: the run's own ECC2K-130 "cheapest entry", min_store_by_degree["131"]
    closed_form_1_plus_linear_algebra_log2: 64.20
    correct_total_log2_lower_bound: 106.8
    difference_bits: 42.6
    why: >-
      The MITM_CAPPED oracle probes a table of |F|^s = 2^(sd) entries (the model's
      own store, the driver's log2_store_entries). The table is target-independent,
      is built once, and must exist before any probe hits at the modelled rate.
      Writing 2^(sd) group elements costs at least 2^(sd) operations, so the true
      stage-1 time is max(|F|^s, m! N |F|^(1-s)). The product "relations x trials x
      oracle" charges probe work only. That is harmless while the number of oracle
      calls |F|/p >= 1, but at this cell |F|/p = 2^-42.6. The model then charges
      2^-42.6 of one call and never charges the table.

  artifact_checks:
    - check: sha256 of all eight entries in artifact-digests.json, including the driver
      result: all match (raw-result.json 9569c9c0..., driver 75cd2252...)
    - check: re-execution of the exact command in command.txt (CPython 3.11.15, 2026-09-30, scratch output)
      result: exit 0, about 22 s wall, output BYTE-IDENTICAL to raw-result.json (same sha256; cmp passes)
    - check: commit binding
      result: >-
        Every reviewed path is committed and reachable from origin/main. The driver
        was added in the approval commit e56b0a215 itself, so git shows approval
        preceding EXECUTION (run at 3c97c0d40) but cannot show it preceding
