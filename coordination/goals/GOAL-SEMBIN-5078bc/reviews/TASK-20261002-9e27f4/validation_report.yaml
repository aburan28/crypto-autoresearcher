  joint_verdicts:
    JR-1:
      verdict: breaks
      one_line: >-
        COR-GEN's non-triviality fails on [lambda]-closed lists (orbit-sum and
        characteristic-polynomial relations), and G1-G4 bound cost on random
        lists, not on F_V. So the generic layer binds F_V unconditionally only for
        ENUM, MITM and MITM_CAPPED; for every other generic harvester it is
        conditional on HEUR-HARVEST-FV-1.
      breaking_artifacts:
        - id: JR1-B1
          title: A harvester satisfying G1-G4 as worded for which Dai's reduction fails with probability 1
          construction: >-
            The list is the one G3 requires on a Koblitz curve with sigma-stable V:
            closed under negation and [lambda], where lambda is the eigenvalue of
            Frobenius on <P>, a root of X^2 - tX + 2 mod l with t = +-1. The
            harvester H_orb takes any handle F_1 and applies [lambda] n-1 times as
            scalar multiplication. That is G1, and it applies pi only as [lambda],
            as G3 permits. It finds each image by lookup (G2) and outputs the
            relation sum_{i<n} [lambda^i]F_1 = O, with target O = 0P + 0Q (G4).
            Its guarantee is unconditional, so G3 holds. A cheaper variant is
            [lambda^2]F_1 - t[lambda]F_1 + 2F_1 = O.
          why_it_breaks: >-
            Neither relation is a "formal identity" under COR-GEN's only stated
            exclusion (the pairs F_j + (-F_j) = 0, DERIVATION section 3.2 Route).
            Both are non-trivial under that definition. In Dai's reduction with
            u = rP + sQ, their Q-coefficient is s * gamma, where gamma =
            sum_i lambda^i = (lambda^n - 1)/(lambda - 1) = 0 mod l, and
            lambda^2 - t lambda + 2 = 0 mod l. The coefficient therefore vanishes
            with probability 1, not about 1/l. The harvester costs at most
            (n-1)*2*log2(l) generic operations, or O(log l) for the
            characteristic-polynomial variant. That is exponentially smaller than
            sqrt(l) ~ 2^(n/2). At the toy sizes run here the two numbers are
            comparable, so the scratch verifies the identities, not the cost gap.
            As worded, COR-GEN's conclusion "at least c sqrt(l) - O(|F| +
            #targets) calls before its first non-trivial relation" is FALSE on
            [lambda]-closed lists.
          scratch_evidence: >-
            scratch_koblitz_identities.py, block S1, on toy Koblitz curves at
            n = 11, 13, 17, 19 (both a), and 23. Both gammas are 0 mod l. On the
            curve, 20 of 20 random u in <P> satisfy sum_i pi^i(u) = O and
            pi^2(u) - t pi(u) + 2u = O. In the Dai reduction, P-coef = Q-coef = 0.
            Output: scratch_koblitz_identities_output.txt.
          corrected_text: >-
            Define triviality over Z/l on orbit representatives, not by formal
            identity. Write each handle as F_j = eps_j lambda^{i_j} u_{k(j)} over
            <+-lambda>-orbit representatives u_k. Reduce coefficients mod l and set
            gamma_k = sum_{j: k(j)=k} eps_j lambda^{i_j} c_j in Z/l. The relation
            (c, a, b) is TRIVIAL iff gamma = 0 and b = 0, which forces a = 0.
            Equivalently, the linear polynomial sum_k gamma_k X_k - a - bX is
            identically zero over Z_l, which is Hhan 2024's "trivial collision"
            (retrieved; see citations). Non-trivial relations with gamma != 0
            reveal x except with probability 1/l. A relation with gamma = 0 and
            b != 0 IS the discrete logarithm. On negation-only lists this reduces
            to the drafted exclusion plus reduction of coefficients mod l.
        - id: JR1-B2
          title: G1-G4 bound cost on random lists, not on F_V (a G3 non-sequitur and a misclassified generic layer)
          construction: >-
            Take a harvester H_pair that first hashes all |F|^2/2 pair sums
            F_i + F_j and looks each one up in the list and in the pair-sum table.
            This detects every 3-term relation F_i + F_j = F_k and every 2-sum
            coincidence. It then falls back to MITM. On a uniformly random
            closure-matched list with |F| << l^(1/4), the first phase finds
            nothing with high probability: the expected counts are about
            |F|^4/(8l) and |F|^3/(6l). So H_pair's guarantee is MITM's, and G1,
            G2, G3 and G4 all hold. On any list with low-arity additive structure
            (the V1 positive control F_AP = +-{P, 2P, ..., (|F|/2)P}, or any F_V
            with an anomalous N_2 or 3-term count), H_pair outputs a non-trivial
            relation after O(|F|^2) operations, which is far below c*sqrt(l)
            when |F| << l^(1/4).
          why_it_breaks: >-
            Dai's reduction, or the direct GGM argument, runs H on a RANDOM list.
            It bounds H's cost there, and so bounds H's guaranteed cost when that
            guarantee is list-independent (G3). It says nothing about H's cost on
            a fixed list such as F_V. The proof_search_map bottleneck of
            H-SEMBIN-c7e1d4 reads G3 as "COR-GEN binds F_V". That inference runs
            in the wrong direction. The transfer to F_V holds unconditionally only
            where expected yield is list-independent. ENUM, MITM and MITM_CAPPED
            over uniformly random targets satisfy this, because each probe
            succeeds with expected probability at most (distinct table
            entries)/l for EVERY list, by decomposition conservation
            (sum_R count(R) = number of multisets; KN-FIND-007 is the program's
            record of it). For any other G-harvester, including PCS batching
            (X-6) and pair-sum hashing, the transfer needs F_V's low-arity
            additive coincidences to be random-like. That is
            HEUR-HARVEST-FV-1(a)'s content. Therefore H-SEMBIN-c7e1d4's
            "Neither layer of the statement depends on HEUR-HARVEST-FV" and
            "NOT of HEUR-HARVEST-FV" are misclassified wherever the generic
            layer is read as a statement about index calculus on F_V.
          answer_to_card_uncertainty: >-
            Is the generic layer unconditional for F_V? Only at first-moment
            level, and only for the conservation-law laws (ENUM, MITM,
            MITM_CAPPED; per-target golden collision X-5). For the class G at
            large it is CONDITIONAL on HEUR-HARVEST-FV-1 (low-arity part).
            Unconditional for random closure-matched lists.
          corrected_text: see corrected_wordings.COR-GEN and corrected_wordings.H-SEMBIN-c7e1d4_generic_layer
        - id: JR1-B3
          title: "Section 3.3, MITM row, and SD-2: the Shoup/Maurer attribution is inverted"
          finding: >-
            DERIVATION section 3.3 says that MITM and MITM_CAPPED (tables, hashing)
            are "Not covered by a Maurer-model statement alone (Hhan's Thm 3.3 is
            Maurer-model)". SD-2 says "Shoup's model, not Maurer's, is needed for
            tables and hashing". Hhan's model, read at source, counts only
            labeling and group-operation gates: "all other gates are considered
            free", including up to binom(m+T, 2) equality gates. A table/MITM
            algorithm uses encodings only to test equality, so Hhan's Thm 3.3
            covers it directly. What the type-safe model cannot express is
            control flow that depends on the encoding: hash-driven walks and
            distinguished points (rho, PCS X-6, vOW golden-collision
            compression X-5). Hhan App. C Thm C.1 (read at source) transfers the
            bound to Shoup's random-representation model for FAITHFUL algorithms
            at identical query count (Lambda = Delta = 0). So the rows needing
            Shoup's model are X-5 and X-6, not MITM, and both are covered by
            Thm C.1.
          corrected_text: >-
            Row MITM/MITM_CAPPED: "yes. Tables need only equality tests, which are
            free in the type-safe model (Hhan 2024, retrieved). First-moment
            yield is list-independent, so the bound holds on F_V
            unconditionally." Rows X-5 and X-6: "yes, in Shoup's random-
            representation model, because control flow depends on encodings.
            The bound transfers by Hhan Thm C.1 for faithful algorithms. X-6's
            cost on F_V is conditional on HEUR-HARVEST-FV-1(a)." SD-2 reason:
            "Lookups need only equality, which is free in the type-safe model.
            Encoding-dependent walks need the random-representation model, which
            Hhan Thm C.1 covers."
        - id: JR1-B4
          title: "K14: conclusion holds, premise false at source"
          finding: >-
            CORR-20261002-e58c3a K14, SD-1 and the H-SEMBIN-c7e1d4 generic layer
            all say that no source opened by this program states the generic
            constant numerically. Hhan's Thm 3.3 PROOF does: |C| <= (T+3)^2/2 and
            log eps + log|G| <= log|C|, so eps <= (T+3)^2/(2|G|) in the type-safe
            model, and Thm C.1 extends this to faithful Shoup-model algorithms.
            K14's CONCLUSION still holds. Integrating that tail bound gives
            E[T] >= about (2/3)*sqrt(2l) = 0.943*sqrt(l) when every oracle call,
            inversion included, is charged. It gives only 0.471*sqrt(l) when
            negation is free, which is the unit of the VOW column 0.886*sqrt(N):
            sqrt(pi l)/2, negation map, additions only. "No generic algorithm
            below 0.886 sqrt(N)" therefore does not follow in the column's own
            unit. It follows only if inversions are charged as oracle calls.
            Wagner Cor. 1, read at source, states Omega(sqrt(p)) with no
            constant, which confirms exponent level for the corollary as cited.
          scratch_evidence: scratch_clause2_and_constants.py block A3 (closed-form integral)
          corrected_text: >-
            Replace "no source opened by this program states the constant
            numerically" with: "The explicit bound available, Hhan 2024 Thm 3.3
            proof with Thm C.1, is eps <= (T+3)^2/(2l). It implies expected cost
            of about 0.943*sqrt(l) when inversions are charged and about
            0.471*sqrt(l) when negation is free. The VOW column 0.886*sqrt(N)
            charges additions only, so the constant-level comparison is
            unit-dependent and is asserted only inside the model."
        - id: JR1-B5
          title: "Minor: the reduction's list-building cost"
          finding: >-
            Dai's reduction, as adapted, builds each list element r_j P + s_j Q at
            O(log l) group operations. The subtraction is therefore
            O((|F| + #targets) log l), not O(|F| + #targets). The pipeline bound
            is then Omega(sqrt(l)/log l) rather than c*sqrt(l). This is still
            exponent level. Wagner's "O(t)" in Thm 2 hides the same factor. A
            direct GGM argument with the list's discrete logs as hidden variables
            (Hhan's technique) avoids any reduction, gives T >= sqrt(2 eps l) -
            |F| - 3, and loses no log factor.
      failed_attacks:
        - attack: >-
            Negation-closed list +-(r_j P + s_j Q). Does a non-trivial relation
