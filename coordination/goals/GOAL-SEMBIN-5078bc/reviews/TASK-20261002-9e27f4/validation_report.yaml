  # ---------------------------------------------------------------------------
  # Corrected wordings (proposals; no record edited).
  # ---------------------------------------------------------------------------
  corrected_wordings:
    COR-GEN: >-
      COR-GEN (corrected; derivation, unreviewed). Setting: <P> of prime order l,
      with Q = [x]P and x uniform. A LIST is |F| handles in <P>, closed under
      negation and, on a Koblitz curve with sigma-stable V, under [lambda], where
      lambda is the eigenvalue of Frobenius on <P>. A RELATION is (c, a, b) with
      sum_j c_j F_j = aP + bQ over Z/l. It is TRIVIAL iff its coefficient vector,
      merged onto <+-lambda>-orbit representatives over Z/l (gamma), is zero and
      b = 0. Equivalently, its difference polynomial is identically zero over Z_l.
      CLASS G: algorithms in the type-safe model with free equality tests, and
      faithful algorithms in Shoup's random-representation model, to which the
      type-safe bound transfers by Hhan 2024 Thm C.1. They receive the list as
      handles, decide membership only by
      equality with handles, apply Frobenius only as [lambda], and build targets
      from P and Q. STATEMENT: for a uniformly random closure-matched list
      independent of x, every H in G satisfies
      Pr[a non-trivial relation within T group operations]
      <= (T + |F| + 3)^2/(2l). This uses Hhan's Thm 3.3 argument with the list's
      discrete logs as hidden variables, so no reduction or log l loss is
      involved. Hence T >= sqrt(2 eps l) - |F| - 3. For K informative relations
      the bound is (e(T + |F| + 2)^2/(2Kl))^K (reviewer sketch). At exponent
      level this is Shoup 1997 via Wagner 2002 Cor. 1. SCOPE: this bounds H's
      cost on the random list. It binds index calculus on F_V unconditionally
      only for ENUM, MITM, MITM_CAPPED and per-target golden-collision search
      over uniformly random targets, at first-moment level, by decomposition
      conservation (KN-FIND-007). For any other G-harvester it binds F_V only
      under HEUR-HARVEST-FV-1. The constant-level comparison with the VOW column
      depends on the unit charged for inversion, so it is asserted only inside
      the model.
    section_3_3_rows: >-
      ENUM by list lookup: yes. Memory |F| for the table. Unconditional on F_V at
      first moment. MITM and MITM_CAPPED: yes. Tables need only equality, which
      is free in the type-safe model (Hhan). Unconditional on F_V at first
      moment. vOW golden collision (X-5): yes, in the random-representation
      model via Hhan Thm C.1. Unconditional on F_V at first moment, per target.
      PCS batching (X-6): yes, in the random-representation model via Thm C.1.
      Its cost on F_V is conditional on HEUR-HARVEST-FV-1(a). It is not a
      decomposition oracle. Frobenius as [lambda]: yes, with non-triviality over
      Z/l on orbit representatives. Halving/trace: no. On <P> Tr(x) is constant
      (gain 1). On E(F_2^n) the exact gain is exactly h.
    H-SEMBIN-c7e1d4_generic_layer: >-
      (GENERIC LAYER) For relation harvesters in class G of COR-GEN (corrected),
      run on a uniformly random closure-matched list, the probability of a
      non-trivial relation within T group operations is at most
      (T + |F| + 3)^2/(2l). This holds at any memory. Every such harvester
      therefore needs Omega(sqrt(l)) operations, which at exponent level is a
      corollary of Shoup 1997 via Wagner 2002 Cor. 1. Applied to the factor base
      F_V itself, the bound holds without any heuristic for the ENUM, MITM and
      MITM_CAPPED laws and for per-target golden-collision search, in
      expectation, by decomposition conservation. For any other generic-class
      harvester it holds on F_V only under HEUR-HARVEST-FV-1, which states that
      F_V's low-arity additive coincidences are those of a random closure-matched
      list. A constant-level comparison with the VOW column 0.886 sqrt(N) is made
      only inside the model, because the generic explicit bound gives 0.943 or
      0.471 sqrt(l) according to whether inversions are charged. The
      heuristic_assumptions_note "Neither layer of the statement depends on
      HEUR-HARVEST-FV" becomes: "The model layer does not. The generic layer's
      application to F_V does, except for the conservation-law laws." The
      proof_obligation "Shoup-model, not Maurer-model, statement needed for
      hashing algorithms" becomes: "type-safe model for table/lookup harvesters;
      random-representation model via Hhan Thm C.1 for hash-driven walks". The
      phrase "c > 0 ... that no source opened by this program states
      numerically" becomes "c = sqrt(2 eps) up to lower-order terms (Hhan Thm 3.3
      proof, retrieved)".
    HEUR-HARVEST-FV-1: >-
      HEUR-HARVEST-FV-1 (corrected). Fix (n, E, <P>, V) with l prime and
      F = F_V inside <P>. Targets are uniform in <P>. Let F* be a uniformly random
      list with the same number of <+-1>-classes (Koblitz with sigma-stable V:
      <+-pi>-orbits) as F. (a) Let N_2'(F) be the number of +-classes (Koblitz:
      <+-lambda>-classes) of 4-element zero-sum sets {u1, u2, u3, u4} inside F
      with no inverse pair. On Koblitz lists, exclude the two structural families
      inside each orbit (X^2 - tX + 2 and (X + t)(X^2 - tX + 2)). Clause: N_2'(F)
      and N_2'(F*) have the same distribution. The comparison is two-sample
      against the null's empirical distribution, with Poisson(mu) as a reference
      only, where mu ~ |F|^4/(48 l) (ordinary) or |F|^4/(48 n l) (Koblitz) and
      the constant is fixed by the null sample. The draft's raw N_2 is
      6 N_2' + (degenerate terms) on negation-closed lists, and is
      6n N_2' + 2|F| + (degenerate terms) on Koblitz orbit lists. It is not
      Poisson. (b) For m in {3, 4}, count the m-multisets in F summing to R that
      contain no sub-multiset summing to O. That means no inverse pair, and on
      Koblitz lists none of the structural orbit zero-sums. The decomposition
      counts of F and F* must have the same distribution. Falsification: a
      two-sample departure at p < 10^-3, Bonferroni over cells. The null is
      calibrated by a split-half null-versus-null test, not by a Poisson fit,
      and the positive control must be flagged. Any tail check uses the
      null-calibrated compound law. The Koblitz sub-clause applies only where a
      cell exists; V1's grid has none (JR3-B7).
    HEUR-HARVEST-FV-2: >-
      HEUR-HARVEST-FV-2 (corrected). Let K be the number of <+-1>-classes of F
      plus 2 (Koblitz with sigma-stable V: <+-pi>-orbits plus 2, with l replaced
      by l/(2n)). Count only non-trivial relations in the corrected COR-GEN
      sense, so formal identities are not counted. "Full rank" means rank
      K - 1. Every Frobenius application, orbit canonicalisation (state c_can)
      and membership test is charged at its declared unit. Then for every H in
      A_FV, every tested (n, D) and peak memory M:
      T(H) >= (1/8) min{ K sqrt(l/min(M, K)), K l/|F| }.
      In the sparse regime |F|^2 <= 2^-8 l min(M, K) this is
      (1/8) K sqrt(l/min(M, K)), five bits below PCS batching on class counts.
      Justification (ii) states separately its two parts: the rigorous random-
      list counting bound (Hhan Lemma 3.2) and the F_V assumption that adaptive
      membership tests succeed with probability about |F|/l. The PCS arm's
      constant is calibrated per w on the F* arm instead of being fixed at 4.
    OPEN-A: >-
      OPEN-A (corrected). Let E/F_2^n be ordinary, n prime, with E(F_2^n) = Z/h x
      <P>, where l = |<P>| is prime and h in {2, 4}. For maps h_j: <P> -> [M],
      M = 2^j, j >= 2, computable in poly(n) from x(Q) (in particular F_2-linear
      x-functionals (Tr(alpha_1 x), ..., Tr(alpha_j x))), and combining rules f,
      define the single-bucket gain G(M) = M * max_{c,d} pi_c(d), with Q and R
      uniform in <P>. This is the per-bucket merge rate that a Wagner level
      selects after seeing h (KN-FIND-ffe1df, red team RT-20260803-be45a8, as
      measured by RT-EXP-1), not the bucket-averaged eps. Question: does G(M)
      grow without bound along M ~ l^theta for some theta > 0? Known: on <P> no exact filter exists for
      any M >= 2 (Theorem C), and the halving trace is constant on <P>. On
      E(F_2^n) the exact gain is exactly h, attained by the trace (h = 2) and by
      one point halving (h = 4), which makes those the positive controls if and
      only if sampling is from E(F_2^n). Settled by: an exhibited family with
      G(M) unbounded against a SHA null, or a bound on max_c pi_c (not on the
      averaged eps) of 1 + o(1) for all non-degenerate (alpha, f), with the
      characteristic-2 Artin-Schreier degenerate cases classified. A level-1
      bound does not close tree levels >= 2.
    OPEN-B: >-
      OPEN-B (narrowed residue; file only linked to KR-IC-889857, KN-LIT-f37b9a
      and KN-OPEN-d218ec). For the factor-base-restricted Weil descent of
      S_{m+1} over F_2 (x_i in V, dim V = ceil(n/m)), with the field equations
      adjoined, is sd_degrevlex bounded by some f(m) independent of n?
      Equivalently, where KR-IC-fbdb61's last-fall conditions hold, is
      max.GB.deg bounded? Known and not the question: first-fall degree is
      bounded independently of n (KN-LIT-024, KR-IC-f5c584). sd of the
      UNRESTRICTED Weil restriction is at most n*reg(F^h) - n + 1, linear in n
      (KN-LIT-f37b9a Cor. 4.12). Whether that transfers to the V-restricted
      linear section is not recorded. Settled only by proof. Measurements at
      n in [17, ~41] can falsify a stated f(m), such as Semaev's 4 at m = 2
      (KN-OPEN-d218ec), and can bound f from below.
    OPEN-C: >-
      OPEN-C (corrected). In the type-safe generic group model with peak memory
      M group elements, augmented with a unit-cost MEMORYLESS membership oracle
      for a uniformly random negation-closed F of size |F| that is also given as
      handles, does every algorithm that outputs K non-trivial relations of rank
      K satisfy T >= c min{ K sqrt(l/min(M, K)), K l/|F| }? The time-only bound
      T >= c sqrt(Kl) - O(|F|), including its K-of-L variant, appears to follow
      from Hhan 2024 Thm 3.3/3.4 (reviewer sketch). It is carded as a check, not
      as open. This question carries no exponent stake, and it does not cover
      F_V's non-simulable x-membership (KN-FIND-982fdf), which stays heuristic
      (HEUR-HARVEST-FV-2).
    OPEN-D: >-
      OPEN-D (corrected). Binary Koblitz curve, n prime, <P> of prime order l, and
      H <= (Z/l)^* with <+-lambda_pi> < H of index k = |H|/(2n) >= 2. Is there a
      canonicaliser for H-orbits that reads coordinates (non-generic) with
      per-call cost c_can(H) = o(sqrt(k)) * (c_step + c_can(<+-pi>)) in
      group-operation equivalents (rho on H-orbits), or o(k) (index calculus
      on an H-saturated factor base), for an x-defined F with HF = F? Orbit
      enumeration achieves c_can about k scalar multiplications, which gives no
      gain (scratch S4). By IDEA-20260901-863e36 (C4), any GENERIC canonicaliser
      has c_can = Omega(sqrt(k)). This is the binary-Koblitz transfer of
      IDEA-20260901-863e36 (C6). Measurable quantity: c_can against k on toy
      curves with a matched null (H-STAB of TASK-20260929-c05f6e DESIGN.md
      section 3.6 for the stabiliser of F).

