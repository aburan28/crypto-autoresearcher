    JR-3:
      verdict: breaks
      one_line: >-
        Clause 1(a) is already false by construction: N_2 is compound Poisson on
        negation-closed lists and carries 2|F| structural coincidences on
        Koblitz lists. Clause 1(b) counts inverse pairs. Clause 2 is false in the
        dense regime |F|^2 > 2^8 l M, its K counts free formal identities, and
        its Koblitz form is unit-dependent and false under a 1-unit
        canonicaliser.
      breaking_artifacts:
        - id: JR3-B1
          title: Clause 1(a)'s "N_2 is Poisson-distributed with mean lambda_2" is false for the clause's own null
          construction: >-
            Take a non-excluded coincidence a + b = c + d in a negation-closed
            list. It defines the zero-sum 4-set S = {a, b, -c, -d}. S yields three
            2+2 splits, and either side of each split can be the positive pair.
            -S yields the same six. So every coincidence comes with five
            companions: N_2 = 6 * N_2' + (rare repeated-element terms), where
            N_2' counts +-classes of primitive zero-sum 4-sets. N_2' is
            approximately Poisson(lambda_2/6), so N_2 is compound Poisson with
            var/mean about 6.
          scratch_evidence: >-
            scratch_negation_clumping.py, block C1, on uniformly random
            negation-closed lists in ABSTRACT Z/l: no curve, no F_V, 3000 lists
            per cell. var/mean = 5.33, 5.49, 5.90, 6.00 at lambda_2 = 2.1, 9.1,
            5.1, 19.7. N_2 = 0 mod 6 in 74-91% of lists; the remainder are
            degenerate repeated-element terms.
          consequence: >-
            Block C2 tests the falsification branch "the largest-count cell
            exceeds the Poisson tail predicted by lambda at p < 10^-3". The NULL
            ITSELF exceeds the Poisson(lambda_hat_null) 10^-3 tail in 4.1% to
            8.1% of lists. With 100 null lists per cell, the null fails Poisson
            calibration in essentially every cell. The precondition "with the null
            F* passing its own calibration" is then never met, so the clause is
            unfalsifiable through that branch. If the precondition is dropped,
            the clause is "falsified" by construction. Either way it is ill-posed
            as worded. The two-sample KS comparison against the null's empirical
            distribution is unaffected.
        - id: JR3-B2
          title: "Koblitz case: 2|F| structural coincidences per closure-matched list, not removed by the exclusion set"
          construction: >-
            Inside every <+-lambda>-orbit there are 4n non-excluded coincidences,
            in two families. The first, from X^2 - tX + 2, is
            lambda^{i+2}u + lambda^i u = t lambda^{i+1}u + (-lambda^i u). The
            second, from (X + t)(X^2 - tX + 2) = X^3 + X + 2t, is
            lambda^{i+3}u + t lambda^i u = -lambda^{i+1}u - t lambda^i u. Each
            family has 2n members. Under the <+-lambda> action they form 2
            classes per orbit. No 3-term zero sum exists inside an orbit. A list
            of |F|/(2n) full orbits therefore carries exactly 2|F| structural
            coincidences, deterministically, in F_V and F* alike.
          scratch_evidence: >-
            scratch_koblitz_identities.py, block S2. At n = 11, 13, 17, 19 (both
            a) and 23, the count inside one orbit is exactly 4n. Both families
            are found, 0 coincidences are unexplained, there are 2 classes under
            the action, and there are 0 three-term zero sums. Only lambda mod l is
            used; no F_V is involved.
          why_it_breaks: >-
            The stated exclusions remove only these: {a,b} = {c,d}; a = -b and
            c = -d; and "pi-images". Under either reading of "pi-images" (count
            up to the action, or drop pi-translates), at least |F|/n structural
            coincidences survive. At V1's |F| ~ 2^12 and lambda_2 <= 2^6, that is
            orders of magnitude above the random term. The formula
            lambda_2 ~ |F|^4/(8l) and the Poisson claim are therefore false on
            Koblitz lists by construction. The random part also clumps in
            6n-blocks. F* reproduces the structural part exactly, so a
            two-sample comparison survives. The Poisson branches do not.
        - id: JR3-B3
          title: Clause 1(b) counts m-multisets containing an inverse pair
          construction: >-
            For m = 3, every target R in F has |F|/2 extra decompositions
            {a, -a, R}. For m = 4, every 2-decomposition of R has |F|/2
            companions {a, -a, c, d}. "Up to the negation multiplicity" defines
            neither. The resulting distribution is heavy-tailed for F and F*
            alike.
          scratch_evidence: >-
            scratch_negation_clumping.py, block C3. One random negation-closed
            list in Z/10007 with |F| = 80. For 3 targets in F, the counts as
            worded are 46, 48 and 47, against 6, 8 and 7 without inverse pairs.
            The difference is exactly |F|/2 = 40 each time. For 3 targets not in
            F, the difference is 0.
        - id: JR3-B4
          title: "Clause 2 is already false in the dense regime, by an arm of its own V4 harness"
          construction: >-
            Consider ENUM with the unit-cost membership test x(Q) in V. It is in
            A_FV and is a V4 arm. It costs about 2 units per test, succeeds with
            probability |F|/l per test, and uses O(1) memory. So
            T ~ 2 K l/|F|. This is below (1/8) K sqrt(l/min(M,K)) exactly when
            |F| > 16 sqrt(l M), i.e. |F|^2 > 2^8 l M. The clause quantifies
            "every tested (n, D)" with no restriction on D.
          scratch_evidence: >-
            scratch_clause2_and_constants.py, block A1 (closed-form arithmetic).
            "BELOW line" appears at M = 1 from D = 21 (n = 31, h = 2), D = 26
            (n = 41, h = 4) and D = 29 (n = 47, h = 2). At n = 131 the threshold
            is |F| > 2^68.5, far from the index-calculus regime d ~ 20.
          why_it_matters: >-
            A memoryless membership oracle defeats the T^2 M >= K^2 l collision
            frontier, which is Dinur's bound for random functions. It does not
            defeat the time bound, because 2l >= sqrt(Kl) always. Justification
            (ii)'s own sketch has the T|F|/l term that the line drops.
          corrected_text: see corrected_wordings.HEUR-HARVEST-FV-2
        - id: JR3-B5
          title: "Clause 2: K = |F| + 2 counts free formal identities, so the stated margin is 4 bits, not 5"
          finding: >-
            On a negation-closed F there are |F|/2 unknowns, plus x, and |F|/2 of
            the "relations" F + (-F) = O are free formal identities. Full rank
            over the |F| + 2 columns is |F| + 1, of which only |F|/2 + 1 need
            work. Against the needed count, PCS batching
            (4 K' sqrt(l/w), K' = |F|/2 + 2) is 16x above the line as worded:
            4 bits, not 5. Defined on classes, the line regains 5 bits (32x).
            On Koblitz lists the free identities are the [lambda]-orbit
            identities, so the needed count is |F|/(2n) + 2.
          scratch_evidence: scratch_clause2_and_constants.py block A1, "ratio to line 16.0"
        - id: JR3-B6
          title: "Clause 2's Koblitz form (l -> l/2n, K kept at |F|+2) is unit-dependent and already false under a cheap canonicaliser"
          construction: >-
            Orbit-quotient PCS needs |F|/(2n) + 2 class relations. Each costs
            4 sqrt((l/2n)/w)(1 + c_can). Against the Koblitz line as worded the
            ratio is 16(1 + c_can)/n. With a normal-basis minimum-rotation
            canonicaliser charged as one field operation (c_can = 1), the ratio
            is below 1 at every n > 32. That includes the toy degrees 37, 41, 43
            and 47. With c_can = n (n charged Frobenius applications), the ratio
            is about 16. The clause's unit list charges "Frobenius application"
            1 and never states a canonicalisation cost.
          scratch_evidence: scratch_clause2_and_constants.py, block A1 (Koblitz rows)
          provenance_note: >-
            That Koblitz rho uses normal-basis canonical forms in practice is
            RECALLED and backs nothing. The finding is the unit dependence, which
            follows from the clause's own text.
        - id: JR3-B7
          title: "Clause 1's Koblitz (sigma-stable V) sub-clause has no testable cell on V1's grid"
          finding: >-
            Among V1's degrees {31, 37, 41, 43, 47}, only n = 41 has a Koblitz
            curve with #E/h prime (a = 0, h = 4). There ord_41(2) = 20, so the
            sigma-stable dimensions are {0, 1, 20, 21, 40, 41}. V1's
            lambda_2 in [2^-2, 2^6] needs D in [12, 14]. D = 20 and 21 give
            lambda_2 ~ 2^30 and 2^34. Across 7 <= n <= 61, prime-order Koblitz
            curves exist only at n in {7, 11, 13, 17, 19, 23, 41}.
          scratch_evidence: >-
            scratch_koblitz_identities_output.txt (curve list) and
            scratch_clause2_and_constants.py block A2 (ord_n(2), sigma-stable
            dimensions, D range).
          consequence: >-
            The Koblitz sub-clause cannot be falsified by its own stated test.
            Either test it at the sigma-stable D that exist (dense lambda_2,
            normal approximation to N_2'), or restrict clause 1 to ordinary
            curves until a Koblitz design exists. This is a validation-plan
            defect, carried to TASK-20261002-a84e65's contract by the Coordinator
            and not by this reviewer, who has not read that design.
      failed_attacks:
        - attack: >-
            Does an F_2-linear property of x (the halving-trace criterion) force
            N_2(F_V) away from N_2(F*) by construction?
          result: >-
            FAILED TO BREAK. On <P> (odd order l) every point lies in 2E, so
            Tr(x(Q)) = Tr(a) is constant (scratch S3: 200 of 200 on each of four
            toy curves). It restricts which x in V occur but imposes no additive
            relation. Theorem C (KN-FIND-ffe1df, transferred) excludes any exact
            sum-compatible map on <P>. The program's own trace-parity
            confinement (H-SEMBIN-83a856, supported per DEC-20260913-92aa48;
            statement read) acts on E(F_2^n)/2E and is inert on <P>. It would
            break clause 1(b) by construction only if F_V or the targets were
            taken in E(F_2^n) with V inside ker(Tr). The clause must therefore
            keep F_V and the targets inside <P>, as section 2 does. Side note:
            |F_V| ~ 2^D/h is wrong for V inside ker(Tr), being 0 or about 2^D at
            h = 2. The null matches |F| exactly, so this is harmless for the
            comparison but matters when computing lambda_2 from D.
        - attack: Is a known A_FV harvester within a factor 8 of the line in the sparse regime?
          result: >-
            FAILED. The best known is PCS, at 16x above the line as worded and 32x
            on class counts. No sparse-regime harvester is known within 8x. In the
            dense regime, ENUM-membership is below the line (JR3-B4).
        - attack: Is min(M, K) right for M > K?
          result: >-
            HOLDS. In the collision model the time clause saturates at sqrt(Kl)
            once M >= K. This agrees with Dinur's T^2 S bound for S <= C, as cited
            via KR-RHO-7d93f6 (abstract-level).
        - attack: >-
            Can V4's PCS-arm precondition ("reproduce 4K sqrt(l/w) within a
            factor of 2") fail for a correct implementation at w in {2^4..2^10}?
          result: >-
            PROBABLY NOT. vOW Table 1 (read at source, lines 422-433) gives the
            golden-collision coefficient as 2.85, 2.52, about 2.45 and 2.43 at
            w = 2^4, 2^6, 2^8 and 2^10, a drift of at most 1.2x. The "1.1 w
            distinct collisions per version" behind the constant 4 is stated
            only for 2^10 <= w <= n/2^10 (lines 413-414), so at w < 2^10 the
            constant is extrapolated. Recommendation: calibrate the PCS constant
            per w on the F* arm.
        - attack: Can V4's bar (99% UCB of the mean below the line, >= 30 instances) be met at toy l?
          result: >-
            Only trivially in the dense regime (JR3-B4), or by a genuinely new
            harvester at least 4-5 bits better than PCS. In the sparse regime the
            bar is falsifiable in principle and not met by anything known.
        - attack: Is random-model justification (ii) a counting argument or an assumption?
          result: >-
            BOTH, and the text conflates them. For a uniformly random
            closure-matched list it is a rigorous counting bound in the
            type-safe GGM. Each equality between distinct linear forms is
            informative with probability at most 1/N (Hhan Lemma 3.2, read at
            source), so E[informative] <= (T|F| + T^2)/l. For F_V, the per-test
            membership success |F|/l on ADAPTIVELY chosen non-formal queries is
            an assumption. The text appeals to "clause 1(b) at m = 1", but
            clause 1 states only m in {3, 4} for uniformly random targets, and at
            m = 1 with uniform targets it is trivially |F|/l and says nothing
            about adaptive queries. The assumption must be stated as its own
            clause or as part of clause 2.
      corrected_text_ref: corrected_wordings.HEUR-HARVEST-FV-1 and corrected_wordings.HEUR-HARVEST-FV-2

