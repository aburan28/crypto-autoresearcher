design_report:
  task_id: TASK-20260724-226
  role: coordinator
  goal_id: GOAL-ICLIFT-001
  batch_id: BATCH-001
  produced_at: '2026-07-24T11:20:00-07:00'
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: claude-opus-5-thinking-high
    reasoning_effort: high
    fallback_used: true
    fallback_reason: >-
      orchestration/model-policies.yaml routes the Coordinator to a GPT-5.6 Sol
      Ultra Code alias that this Claude-family harness cannot resolve
      (CLAUDE.md model policy note). The requested policy alias and the resolved
      runtime model are both recorded and no policy was silently downgraded.

  selection_rationale:
    request: >-
      The user asked to run the harness and pursue the index-calculus or lifting
      angles. Two independent surveys of the committed ledger, experiments,
      knowledge corpus, and research-direction documents were performed before
      any record was written.
    index_calculus_state: >-
      The index-calculus line has been heavily worked: H-ICI-001, H-R6-001,
      H-BKK-001, H-FB-001, H-REP-001, H-ISO-001, H-JET-001, H-INC-001,
      H-TTN-001, H-EQJ-001, H-NCP-001, H-STR-001, H-NET-001 and H-TRA-001 are all
      rejected within their tested scopes, and H-BKKMV-001, H-JETB-001,
      H-INCB-001 and H-NCP-001 have theorem-backed barrier results. Exactly two
      measurement axes remain open: the boolean Weil-descent d_reg wall (owned by
      the separate active GOAL-DREG-001 and its BATCH-003 CTRL-B action, which
      this batch must not duplicate), and RQ-FB3-001, whose experiment
      EXP-FB3-001 was approved by DEC-20260717-002 and never executed. The F3
      battery is therefore the one index-calculus item that is both open and
      admissible for immediate execution.
    lifting_state: >-
      The lifting line is closed by theorem or literature on every audited route
      except one. THM_JETBARRIER1 with DEC-20260722-004 closes first-jet channels
      in-model; ECFG-P1543, ECFG-P1547 and ECFG-P1542 in ledger/FINDING-PF-IC-001.md
      are terminal-inconclusive on global-lift, prime-to-p jet, and pairing
      lift-return routes; KN-LIT-020 and KN-LIT-021 record classical xedni as a
      literature dead end. The single unfinished measurement is EXP-XEDN-001
      phase 2, ranked in research_directions_20260718.md as the best
      representation-changing candidate (B2), stopped at a p=101 smoke.
    why_these_two: >-
      Both are the last open MEASUREMENT items of their families, both have
      pre-registered gates written before any data existed, and both are
      executable in this environment without SageMath. Neither is a novelty
      search: the campaign's value here is converting two indefinitely open
      routes into stated, reviewable results.

  infeasibility_finding_recorded:
    id: FINDING-XEDN-PHASE2-INFEASIBLE
    statement: >-
      The EXP-XEDN-001 phase-2 protocol cannot deliver its own gate. It requires
      fitting alpha in P_lift ~ p^-alpha from a census at p in {101, 211, 431, 809}
      by enumerating sections on random surfaces, but the predicted per-slot rate
      is about p^-3: roughly 1e-6 at p=101 and 2e-9 at p=809. A nonzero count at
      p=809 needs on the order of 1e9 slot tests, and a fitted exponent needs
      many nonzero counts at three or more sizes. The contracted budget is 40 runs
      and 14400 seconds. The p=101 smoke's 5760 slots had an expected hit count
      near 0.006, so its observed zero is uninformative about alpha by design, not
      by accident.
    classification: >-
      Methodology defect in the experiment design. Under AGENTS.md rule 5 this is
      explicitly NOT evidence for or against H-XEDN-001, and it does not weaken
      the B2 candidate. It is the reason a new contract is issued rather than a
      rerun ordered.
    remedy: >-
      EXP-XEDN-002 reindexes the same incidence set by fibering over sections
      instead of sampling over surfaces, which converts an unmeasurable rate into
      an exact count.

  records_created:
    - id: GOAL-ICLIFT-001
      path: ledger/goals/GOAL-ICLIFT-001.yaml
      note: persistent campaign anchor bound to RQ-FB3-001 and RQ-XEDN-001
    - id: RQ-XEDN-001
      path: ledger/questions/RQ-XEDN-001.yaml
      note: >-
        first canonical question record for the function-field xedni route, which
        previously existed only as a contract file and as prose in
        research_directions_20260718.md
    - id: H-XEDN-001
      path: ledger/hypotheses/H-XEDN-001.yaml
      note: >-
        states the PROMOTION side (alpha < 1/2) so that the experiment can falsify
        it; the classical alpha = 3 prediction is the competing null
    - id: EXP-XEDN-002
      path: experiments/EXP-XEDN-002/specification.yaml
      note: approved four-arm exact census with controls tied to the frozen predicate
    - id: EXP-FB3-001-AMD-001
      path: experiments/EXP-FB3-001/amendment-001.yaml
      note: >-
        additive amendment; no frozen criterion is relaxed; fixes the missing
        implementation basis, upgrades sampled yield to exact yield, pre-registers
        the six geometry definitions and the analytic conservation arm

  frozen_boundaries:
    - Both experiments are toy scale; no statement may be presented as crypto-scale or as an attack improvement.
    - >-
      EXP-FB3-001 measures decomposition yield and coverage, not the cost of the
      point-decomposition solve. A null result closes the yield channel of the F3
      family only.
    - >-
      EXP-XEDN-002 closes or promotes one surface family, one section shape, and
      one predicate. It cannot supersede ECFG-P1543 or ECFG-P1547 and must not be
      read as a general lifting no-go.
    - >-
      Neither producer may change status. Only the ledger archive TASK-20260724-236,
      after both validator and both red-team reports, may record a transition.
    - >-
      GOAL-DREG-001 owns the d_reg wall route; this batch does not touch
      experiments/EXP-DREG-001, EXP-SIG-*, or the research/dreg-linear-law branch.

  review_plan:
    - Each producer is claim-relevant and carries review_required true.
    - >-
      Each producer gets an isolated snapshot archive before any reviewer reads
      it, then one independent validator (integrity, controls, independent
      recomputation) and one independent red team (interpretation, scope, cost
      relevance).
    - One ledger archive commits all four review reports with the evidence and decision records.

  validation:
    ledger_validator: "python3 tools/validate_ledger.py — no new violations expected; new records use canonical subdirectories"
    dispatch_validator: "python3 tools/research_dispatch.py on the BATCH-001 queue"
    note: >-
      No root-level ledger record is created or modified; ledger/H-FB3-001.yaml
      and ledger/RQ-FB3-001.yaml remain frozen and their status transition is
      recorded in the decision record instead.
