    - id: V1
      source: found by the validator, not declared
      description: >-
        The matched-random control draws B distinct logs from [1, N), excluding
        the identity, while the frozen amendment text and every run's
        counting_convention.matched_random string say "[0, N)".
      severity: minor
      validator_assessment: >-
        The implementation is the mathematically correct reading (a factor base
        is a set of distinct NONZERO elements, as conservation.md Section 1
        states) and fb3_core.distinct_logs documents [1, N) in its docstring, but
        the frozen text and the machine-readable convention string are not
        literally what was executed. The effect is bounded and cannot change any
        conclusion: the conservation identity and the exact mean depend only on
        |D| and N, and the chance that a [0, N) draw would have contained 0 is
        B/N = 0.0029 at 2^14 and 0.00045 at 2^18, affecting only the null
        coverage estimate at O(1/N). Structured bases never contain 0 either, so
        the comparison is like-for-like. Recorded so the Coordinator can decide
        whether the convention string should be corrected by a superseding
        record.

  findings:
    - id: F1
      severity: minor
      kind: internal inconsistency between two committed artifacts
      finding: >-
        conservation.md Section 2(i) reports the "observed exact mean" series as
        1.1276 -> 1.0755 -> 1.0436 at 2^14/2^16/2^18. The 2^16 and 2^18 values
        are the 16-replicate means, but 1.1276 is the single curve-1 value at
        2^14; the 2^14 replicate mean is 1.1146, which is what analysis.md
        Section 3 publishes. Both numbers occur in the raw data, so nothing is
        fabricated, but the same labelled quantity has two values across the two
        artifacts.
      impact: >-
        None on any verdict. Consequence (i) is checked per cell, where the
        maximum deviation of the exact mean from C(B+2,3)/N is exactly 0.0 over
        144 untyped cells, and the 2^14 spread (1.0684 to 1.1336) is entirely
        the ceiling in B = ceil((6N)^(1/3)) across four curves, which
        conservation.md itself explains in the next sentence.
      recommended_disposition: >-
        Correct by a superseding record if the Coordinator cites the series;
        do not edit conservation.md in place (AGENTS.md rule 4).
    - id: F2
      severity: minor
      kind: undocumented statistical pinning
      finding: >-
        The per-cell family p-value fed to Holm is the MEAN over the 16
        replicates of the two-sided permutation p-value. That choice appears only
        as a comment in run_family.py ("declared before execution") and in the
        reported min/max companions; it is not in the amendment, not in the
        FROZEN block, and not among the D6 pinnings the executor lists.
      impact: >-
        Negligible here, and conservative in direction. Averaging p-values is not
        a valid combining function in general, but under the null the mean of 16
        independent uniforms concentrates near 0.5, so it makes rejection harder,
        not easier. In this data the per-replicate p-values are degenerate
        (exactly 1.0 for the three untyped cells, exactly the 1/201 floor for the
        three rejected cells), so the mean equals each individual value and the
        aggregation has no effect on the reported family. I re-derived the Holm
        arithmetic from the raw p-values and reproduced the executor's adjusted
        values and rejection sets exactly.
      recommended_disposition: >-
        Reviewer should note the aggregation rule explicitly in any evidence
        record that cites Holm-adjusted significance.
    - id: F3
      severity: minor
      kind: reproducibility-chain subtlety, disclosed but easy to over-read
      finding: >-
        Every manifest records code.commit = e18c9bc with dirty_tree: true, and
        environment.json shows the dirty tree consisted of exactly four untracked
        new directories (the two experiments' implementation/ and runs/ trees).
        So the implementation did not exist at e18c9bc: you cannot check out
        e18c9bc and re-run. analysis.md's control row "Reproduction from the
        recorded command at the recorded revision" is therefore true only in the
        sense of "run-time HEAD plus the untracked working tree".
      impact: >-
        None on integrity, and the executor discloses it in
        execution-report.implementation_commit_note. The chain still closes:
        no TRACKED file differed from e18c9bc, the untracked implementation
        became durable at the snapshot commit 68e375f, and I verified that the
        working-tree implementation files hash to the receipt values - so the
        code I re-ran is byte-identical to the code that produced the records.
        The reproducible revision to cite downstream is 68e375f, not e18c9bc.
      recommended_disposition: >-
        Any evidence record should cite 68e375f as the reproducible revision.
    - id: F4
      severity: none
      kind: framing correction in the executor's favour
      finding: >-
        The task framing (and a reader of implementation.md item 3) could
        conclude that the reported counts come from a rounded FFT. They do not:
        counts_untyped_m3_fft is invoked only inside Auditor.cross_check, so
        every published statistic is produced by exact integer arithmetic and no
        rounding decision can enter a reported number. The FFT is an audit route
        whose margin is measured, not the measurement path.
      impact: strengthens the numerical-safety verdict
      recommended_disposition: state it this way in the evidence record
    - id: F5
      severity: none
      kind: accounting nit
      finding: >-
        implementation.md and the execution report say the reproduction differed
        in "17 wall-clock fields per run"; a full leaf diff shows 20 differing
        leaves (16 greedy selection_seconds, three timing fields, and
        peak_memory_mb). All 20 are wall-clock, timestamp or peak-RSS fields.
      impact: none; the substantive claim (0 measurement differences) is confirmed
      recommended_disposition: no action
    - id: F6
      severity: none
      kind: observation on my own control, recorded for completeness
      finding: >-
        While cross-checking the two height routines I found one x where my
        continued-fraction implementation disagreed with brute enumeration:
        x = 0, where h(0) = 1 legitimately (0 = 0/1) but my guard returned p.
        The executor's height_cf handles x = 0 correctly, which is why its
        control reports 0 disagreements over all 16381 values. The defect was
        mine, not the executor's.
      impact: none
      recommended_disposition: no action

