validation_report:
  id: VAL-20260724-001
  task_id: TASK-20260724-232
  role: validator
  target_task_id: TASK-20260724-228
  target_experiment_id: EXP-FB3-001
  target_amendment_id: EXP-FB3-001-AMD-001
  run_ids:
    - RUN-FB3-001-N14
    - RUN-FB3-001-N16
    - RUN-FB3-001-N18
    - RUN-FB3-001-CTRL
    - RUN-FB3-001-FAMILY
  snapshot_commit: 68e375f720123d4f46b1b5bc686920d77bf5ecf4
  snapshot_parent: e18c9bc0b90e3031cfa28483fe5571c0fb548dfb
  snapshot_receipt: coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/TASK-20260724-230/snapshot-receipt.json
  snapshot_commit_source: >-
    The receipt file itself records commit_sha: null, because the receipt is
    committed inside the commit it describes (receipt_self_hash_excluded: true).
    The binding commit SHA is carried by the archive block of
    coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/dispatch_queue.json for
    TASK-20260724-230, and the Validator confirmed it independently from Git.
  head_at_validation: ae5503dc288efe74f23a870c59d5870c5f779d72
  overall_verdict: valid_with_findings
  verdict: passed
  verdict_meaning: >-
    The EXP-FB3-001 run package is admissible evidence under its frozen
    specification and approved amendment. Every required artifact exists, is
    hash-bound to the Coordinator's snapshot commit, and conforms to the harness
    run schema; the executed cell list conforms to the frozen protocol; the hard
    conservation control and the independent recomputations agree exactly; the
    package reproduces from its recorded commands. This verdict is about
    evidence integrity only. It does not support any ECDLP claim, does not
    demonstrate a speedup, and does not authorize any hypothesis-status
    transition; those remain the Coordinator's, informed by the Reviewer and
    Red Team.

  checks:
    - id: artifact_completeness
      verdict: pass
      evidence: >-
        All five run directories contain exactly the six required artifacts
        (manifest.yaml, command.txt, environment.json, stdout.log, stderr.log,
        raw-result.json) and nothing else. Each manifest has a top-level `run`
        key and non-empty id, experiment_id, status, code (with commit and
        command), environment, inputs, timing and result; each
        result.certificate.kind is `none`; inputs.parameters.field_bits is
        14/16/18/18/18 (all <= 32, so the claim tier stays `toy`). command.txt
        equals run.code.command in every run. The 5 SHA-256 values each manifest
        records for its own companion artifacts all reproduce
        (25 hashes, 0 mismatches). `python3 tools/validate_ledger.py` exits 1
        with 154 errors; zero of those lines reference any
        experiments/EXP-FB3-001/ path. Running the identical command against a
        `git archive` extract of the merge-base 123fb746 produced a
        byte-identical 154-line error set (diff empty), so all 154 are
        pre-existing and none are attributable to this package.
      notes: >-
        The manifests use result.validity / result.validity_reason and put
        peak_memory_mb inside `timing` rather than the docs/ template's
        result.valid / result.invalid_reason and a separate `resources` block.
        tools/validate_ledger.py does not require those names and the
        information is present, so this is a schema-style variance, not a gap.

    - id: snapshot_receipt_integrity
      verdict: pass
      evidence: >-
        All 39 paths in the receipt's path_sha256 hash to the recorded value in
        the working tree (0 mismatches) and, independently, the blob at
        68e375f7:<path> hashes to the same value for all 39 (0 mismatches).
        `git diff-tree` shows the commit changed exactly 40 paths, equal as a set
        to the receipt's declared_paths; declared_paths minus the receipt file
        itself equals the path_sha256 key set, consistent with
        receipt_self_hash_excluded: true. `git merge-base --is-ancestor
        68e375f7 HEAD` succeeds, the actual first parent is
        e18c9bc0b90e3031cfa28483fe5571c0fb548dfb as recorded, and the commit
        message names TASK-20260724-230, both record_ids and all five run ids.
        `git status --porcelain` for the declared paths is empty, so the
        reviewed working tree is the committed tree.
        `python3 tools/research_dispatch.py .../dispatch_queue.json` exits 0
        with gates completed_archive_commits_verified: true and
        archive_artifact_coverage_complete: true.
      notes: >-
        specification.yaml and amendment-001.yaml are not in this receipt; they
        were committed earlier (e111dd3 and 81d9e9f respectively) and
        `git diff e18c9bc HEAD` over both files is empty, so the frozen contract
        predates the runs and was not edited. 81d9e9f is an ancestor of the
        run-time revision e18c9bc, which makes the amendment's pre-registration
        (conservation identity, six geometry definitions, analytic arm)
        verifiably prior to execution.

    - id: protocol_conformance
      verdict: pass
      evidence: >-
        All six pre-registered geometries are present at all three sizes with 16
        cell records each (4 curves x replicate seeds [1,2,3,4]) = 288
        pre-registered records, all terminal_state `measured`, 0 infeasible, 0
        invalid. Matched size: I recomputed B as the exact integer ceiling of
        (6N)^(1/3) for each of the 12 curves from the recorded N and obtained
        47/47/47/46 at 2^14 and 74/74/74/74 and 117/117/117/117 at 2^16/2^18,
        equal to every recorded B; typed cells' sub-base sizes sum to B in every
        cell and every asymmetric ladder rung. Permutation null: 200 draws per
        (curve, N, seed) in all 48 shared-null records and n_null = 200 in all
        336 per-cell null_detail blocks per size run, above the frozen minimum
        of 100; sharing is recorded explicitly (shared: true plus a shared_by
        list naming every consuming label), and each typed pattern draws its own
        200-draw same-typing null. Prior cells: `prior_H016_qr_base` and
        `prior_H017_small_multiples` occupy family slots supplied from
        inputs/h100_session/h016_base_yield.json via the CTRL port-fidelity
        block, and neither appears in cells[] at any size, so neither was re-run
        as a family cell; their exact recomputations appear only in the
        separated exploratory section. Greedy separation: `greedy_select(n_order,
        pool, train_bits, b)` takes only the training bitset; the held-out mask
        is not an argument and is not in scope during selection, the candidate
        pool is drawn from the cell seed independently of the target split, and
        the held-out mask is touched only afterwards to evaluate. The frozen
        invalidation rule is therefore enforced structurally, not by convention.
      notes: >-
        Holm family size is 8 at every size (6 geometries + 2 prior slots), and
        `mixed_two_base__secondary_typing` is measured but excluded from the
        family, as the amendment requires. Deviations D1-D6 in the execution
        report are inside the frozen contract; two further deviations the
        executor did not name are listed under protocol_deviations below.

    - id: independent_recomputation
      verdict: pass
      evidence: >-
        Seven full cells were recomputed from scratch without importing
        fb3_core.py: a separate character-sum order routine (Euler criterion via
        pow), a separate point-addition and dlog-table build, separate geometry
        constructors written from the amendment prose, and counting by literal
        pure-Python enumeration of multisets i <= j <= k (no numpy, no Burnside
        identity, no FFT). Every one of n_targets, sum_counts, mean, coverage,
        concentration and max_count agreed with the recorded values to the last
        float bit. The hard control sum_r count(r) == C(B+2,3) held on each of
        the three untyped recomputations and the exploratory one (18424 =
        47*48*49/6), and the typed closed forms held on both mixed typings
        (6900 = B2*C(B1+1,2) and 6624 = B1*C(B2+1,2)). Separately, all 812
        recorded totals across the three size runs (cells, ladder rungs and
        exploratory arms) were recomputed from B and the typing sizes by the
        Validator: 0 mismatches. A big-integer Kronecker-substitution
        convolution (exact, no floating point) reproduced the same count vector
        on all 16339 targets. As a control on my own method, rebuilding the
        curve with a different generator G' = 3G left every reported statistic
        bit-identical, confirming that these statistics are generator-invariant
        and that agreement is not an artifact of copying the executor's
        generator choice.
      notes: >-
        Cells requiring the executor's exact numpy RNG stream (matched-random
        nulls, greedy pool, asymmetric sub-base elements) were not
        reconstructed independently; they were checked by exact reproduction
        from the recorded command instead (see reproducibility).

    - id: curve_validity
      verdict: pass
      evidence: >-
        For 2^14 curve 1 (p=16381, a=4099, b=15559): my own character sum
        #E = p + 1 + sum_x legendre(x^3+ax+b, p) gives 16339, equal to the
        recorded N; sympy.isprime(16339) is true; the Hasse interval is
        [16126.02, 16637.98] and contains it; my own double-and-add gives
        N*G = O and (N-1)*G = -G; my independently built table has exactly
        (N-1)/2 = 8169 canonical x-coordinates. Because N is prime, ord(G) = N
        divides #E and #E <= p+1+2*sqrt(p) < 2N, so #E = N is forced. My
        smallest-x canonical generator (1, 2554) coincides with the recorded G.
        I additionally recomputed the group order of all four recorded H016/H017
        curves independently: 8329, 14143, 128857, 113621, all matching the
        record, all prime, all inside their Hasse intervals. The executor's own
        curve block reports 12 of 12 generated curves with all_ok: true and a
        cross-check list (order prime, Hasse, N*G = O by an independent path,
        table closes at N, x/y pairing, bijective log table, 20 seeded
        double-and-add spot checks).
      notes: >-
        I verified 1 of the 12 generated curves fully by hand plus all 4
        recorded prior curves; the remaining 11 generated curves rest on the
        executor's recorded verification block and on the exact reproduction of
        the runs that build them.

    - id: port_fidelity
      verdict: pass
      evidence: >-
        Independently reproduced, not merely read. For all four recorded cells:
        my character sum recovers the recorded orders exactly; the recorded
        theory_mean_triples_per_target equals my C(B+2,3)/N to 0.0 absolute
        difference in all four cells; the recorded qr_vs_random and sm_vs_random
        ratios re-derive from the recorded base means to 0.0; each base's
        recorded counts sum to its recorded total and to mean_per_target * 800;
        the recorded perm_null.mean_band_95 equals my 2.5/97.5 percentiles of
        the recorded null_means; and the recorded qr_emp_p_two_sided values
        0.40/0.90/0.44/0.76 are exactly reproduced by
        2*min(#{null>=obs}, #{null<=obs})/n, confirming the executor's
        identification of the prior p-value convention. My own literal
        enumeration of the H017 base {1..B} reproduces the executor's exact
        stats bit-for-bit on all four cells (for example B=51, N=128857:
        total 23426 = C(53,3), mean 0.181798428, coverage 0.001171842,
        max_count 338). The comparison is reported in analysis.md Section 1,
        before the family table in Section 3 and the verdict in Section 7. All
        three acknowledged limitations are in the artifacts, not only in a
        message: the QR walk's non-replayability is in analysis.md Section 1,
        execution-report deviation D4, implementation.md D4 and the raw JSON
        field bit_exact_replay_possible: false; the 2^14/2^17-only recording and
        the 800-target sampled basis are in analysis.md Sections 3 and 8,
        execution-report D3, `censoring`, and `boundaries`.
      notes: >-
        I re-ran RUN-FB3-001-CTRL from its recorded command; all four port-
        fidelity cells returned 17/17 checks passing, and the raw result
        differed from the record in only 4 leaves (peak RSS, two timestamps,
        wall clock).

    - id: numerical_safety
      verdict: pass
      evidence: >-
        The rounding-safety argument is checked in the artifacts and is
        stronger than the task framing suggests: the FFT is not the measurement
        path. Every reported count comes from exact integer arithmetic
        (`counts_untyped_m3` via numpy bincount on integer sums, and the integer
        typed counters); `counts_untyped_m3_fft` is called only inside
        `Auditor.cross_check`, so no published statistic can be affected by
        rounding at all. The measured margin is nonetheless recorded per run:
        max |x - round(x)| = 1.364e-12 / 5.457e-12 / 3.638e-12 at 2^14/2^16/2^18
        and 5.457e-12 / 3.411e-13 in the two CTRL blocks; the campaign worst,
        5.4569682106375694e-12, matches the execution report exactly and is
        9.16e10 times below the 0.5 that a single count flip would require
        (the code aborts above 0.25). Independent spot check at the adversarial
        worst case (2^18, N=261643, the maximally concentrated base {1..117},
        max_count 1741): my own FFT route reproduced my own exact enumeration on
        all 261643 targets, with max deviation 3.638e-12, every Burnside
        numerator divisible by 6, and a largest numerator of 10446 - so a flip
        would need an error 1.37e11 times larger than observed.
      notes: >-
        implementation.md states the same conclusion and gives the timing reason
        the integer route is primary (12 ms versus 25 ms per transform at 2^18).

    - id: budget_and_honesty_compliance
      verdict: pass
      evidence: >-
        Budget (handoff TASK-20260724-228: 7200 s, 6 GB, 12 runs): summing the
        five manifests gives 175.41 s of run wall clock (1.990 + 2.081 + 6.629 +
        24.600 + 140.110), matching the reported 175.4 s, with a peak
        peak_memory_mb of 230.6 (RUN-FB3-001-N18), matching the reported 230.6 /
        0.23 GB, over 5 runs. Including the executor's declared 242.7 s of
        auxiliary probes and reproduction checks the total is 418.1 s, still
        2.4% of the limit; the largest single run is 140 s against the frozen
        specification's 1800 s per-run cap. Honesty: result.certificate.kind is
        `none` in all five manifests with an explicit reason. A repository-wide
        scan for speedup / attack / break / cryptanalytic-improvement language
        inside experiments/EXP-FB3-001 returns only negations of such claims
        ("no cost, speedup, or attack claim is derived"), present in the
        amendment, implementation.md, conservation.md, analysis.md and all five
        manifests. The "discrete logs known by construction, for measurement
        only" caveat appears in analysis.md, conservation.md, implementation.md,
        execution-report.yaml and every manifest's honesty_notes. The
        yield-versus-solving-cost boundary is stated in analysis.md Sections
        "What was not measured" and 8, conservation.md Section 4, the
        execution-report boundaries, and every manifest. The claim tier `toy` and
        its field-size basis are stated, and the negative-result phrasing from
        docs/evidence-and-reproducibility.md is used verbatim. No artifact
        asserts a status transition; analysis.md Section 7 and the execution
        report both defer the transition to the Coordinator.
      notes: >-
        The greedy arm's honesty note - that the base is selected using the full
        discrete-log table and is therefore unavailable to an attacker, making
        its measurement an oracle-aided upper bound - is recorded in the raw
        JSON, analysis.md and the execution report. That is the correct framing.

    - id: reproducibility
      verdict: pass
      evidence: >-
        I re-ran two recorded commands verbatim, redirecting output to /tmp so
        no committed artifact was touched. (1) `python3 run_battery.py --bits 14
        --out ... --null-draws 200`: a full recursive JSON leaf diff against
        RUN-FB3-001-N14/raw-result.json shows exactly 20 differing leaves - 16
        greedy `selection_seconds`, `peak_memory_mb`, and the three
        timing fields - and 0 substantive differences. Every measured statistic,
        including all 200 null draws per record, every curve block, and every
        control counter, is identical. The recorded stdout.log differs from mine
        in 8 lines: the start timestamp, one per-replicate elapsed-time line,
        the output path, and the final wall/peak line. (2) `python3
        run_controls.py --out ...`: 4 differing leaves, all timing/memory; all
        four control blocks and all 4x17 port-fidelity checks pass identically.
      notes: >-
        The executor's phrasing "17 wall-clock fields per run" undercounts the
        20 differing leaves I observe (it treats the timing block as one item and
        omits peak_memory_mb). Every differing leaf is a wall-clock, timestamp or
        peak-RSS field; no measurement differs. See finding F3 on what "at the
        recorded revision" can mean here.

    - id: self_consistency
      verdict: pass
      evidence: >-
        93 published values were spot-checked against the raw JSON with 1
        mismatch. Verified exactly: all 18 primary mean-yield ratios in
        analysis.md Section 3 (6 geometries x 3 sizes); all 6 p_holm values at
        all three sizes; all 6 family-wise (99.375%) CIs at 2^18; all 6 growth
        slopes; the absolute-scale line (exact mean 1.1146/1.0755/1.0436 and
        matched-random coverage 0.6734/0.6594/0.6480); all 18 coverage ratios in
        Section 4; all 18 exploratory values in Section 6 and conservation.md
        (mean, coverage and concentration ratios for qr_walk_H016 and
        small_multiples_H017 at three sizes) plus the n = 12/16/16 record counts;
        the control counts 67784 closed-form checks (22592+22596+22596), 46
        brute-force cases, 148 assertions, 43 recounts per size run, 288
        pre-registered measured records, 144 / 336 / 144 cells for consequences
        (i)/(iii)/(iv), consequence (i) max deviation exactly 0.0; and the
        resource figures 175.4 s / 230.6 MB / 5 runs. I also re-derived the
        Holm-Bonferroni arithmetic from the raw per-cell p-values at all three
        sizes: family size 8, my adjusted p-values equal the executor's to
        within 1e-15, and my rejection sets match exactly (4 cells at 2^14
        including prior H017, 3 at 2^16 and 2^18).
      notes: >-
        The single mismatch is a labelling inconsistency in conservation.md, not
        a wrong measurement - see finding F1.

  independent_recomputation:
    # Primary cell, in the shape requested by the handoff. The full set of seven
    # independently recomputed cells follows under `cells`.
    cell: high_bit_interval, N=16339 (2^14), curve 1 (p=16381, a=4099, b=15559), replicate seed 1, B=47
    method: >-
      No executor code imported. I rebuilt the curve from (p, a, b) by my own
      character-sum order computation, built my own dlog table by iterated
      addition, derived the top-window geometry from the frozen definition, and
      counted by literal pure-Python enumeration of all C(49,3) = 18424
      multisets i <= j <= k, accumulating r = (l_i + l_j + l_k) mod N in a plain
      dict. Cross-checked by an exact big-integer Kronecker-substitution cyclic
      convolution (no floating point anywhere) and by rebuilding the same cell
      from a different generator G' = 3G to confirm generator invariance.
    executor_values: {n_targets: 16339, sum_counts: 18424, mean: 1.1276087887875634, coverage: 0.6801517840749128, concentration: 1.254666748271008, max_count: 7}
    validator_values: {n_targets: 16339, sum_counts: 18424, mean: 1.1276087887875634, coverage: 0.6801517840749128, concentration: 1.254666748271008, max_count: 7}
