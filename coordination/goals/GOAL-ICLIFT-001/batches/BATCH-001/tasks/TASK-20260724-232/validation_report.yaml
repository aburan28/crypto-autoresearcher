  protocol_deviations:
    - id: D1
      source: declared by the executor
      description: permutation null raised from the frozen minimum of 100 draws to 200
      severity: none
      validator_assessment: >-
        Inside the frozen contract, which specifies ">= 100". The executor's
        stated reason is correct and checkable: at 100 draws the (r+1)/(n+1)
        floor is 1/101 = 0.00990 and 8 x 0.00990 = 0.0792 > 0.05, so no cell
        could have been Holm-rejected at all; at 200 the floor is 0.004975 and
        8 x 0.004975 = 0.0398 < 0.05. I confirmed the observed raw p-values sit
        exactly on that floor for the three rejected cells.
    - id: D2
      source: declared by the executor
      description: closed-form total control applied with each cell's own typing closed form
      severity: none
      validator_assessment: >-
        Necessary: B1*B2*B3 is undefined for the two-sub-base (1,2) pattern. The
        (1,2) closed forms are themselves verified against brute force in CTRL
        block A and independently by me.
    - id: D3
      source: declared by the executor
      description: prior H016/H017 cells present only at 2^14, censored at 2^16 and 2^18 with the family slot retained
      severity: minor
      validator_assessment: >-
        Inherited from the recorded data (2^14 and 2^17 only), not imposed.
        Retaining the slots keeps the Holm family at 8, which is conservative,
        and I confirmed the family size is 8 at every size with the censored
        slots carrying p_raw: null. No prior statistic is extrapolated to an
        unrecorded size.
    - id: D4
      source: declared by the executor
      description: the H016 QR geometry is a same-family reconstruction, not a bit-exact replay
      severity: minor
      validator_assessment: >-
        Correctly scoped: it appears only in the exploratory section and never as
        a pre-registered cell, and the raw JSON records
