    - id: control_verdicts
      verdict: pass
      evidence: >-
        (a) PREDICATE CONTROL - pass. Three algorithmically distinct
        implementations, all written by me: the frozen gcd oracle; top-down
        square-root extraction plus an elementary root-multiplicity squarefree
        test (no gcd, no factorisation); and sympy factor_list over GF(p)
        accepting iff every multiplicity is exactly 2 and lc is a QR. Results at
        p = 101: random sextics seed 20260718, 100,000 tested, 0 disagreements;
        seed 20260724, 100,000 tested, 0 disagreements; sympy cross-check 5,000,
        0 disagreements. Because random sextics are almost never squares I added
        adversarial populations: planted y^2 with y squarefree, 3,948 tested,
        3,948 accepted by both; planted y^2 with y NOT squarefree, 4,052 tested,
        0 accepted by either; non-residue-scaled squares n*y^2, 4,000 tested, 0
        accepted; perturbed non-squares, 4,000 tested, 0 accepted. Three-way
        agreement with zero disagreements throughout; zero polynomial rejected.
        (b) SMOKE CONSISTENCY - pass. P_lift(101) = 504950/1061520150601 =
        4.756857e-07 from my own closed form; times the smoke's 5,760 slots
        gives lambda = 0.00273995, i.e. the ~0.00274 the card names, and
        P(observe 0) = exp(-lambda) = 0.997264. The recorded observation of 0 in
        EXP-XEDN-001/smoke_results.json (random_slots_tested 5760,
        random_sections_found 0) is the EXPECTED outcome, and the executor's
        one-sided 95% upper limit 5.201e-04 comfortably contains 4.757e-07. I
        also independently checked the part-4 negative control: the exact frozen
        rate on degree-exactly-6 polynomials is (p-1)/(2p^4) = 4.8049e-07,
        predicting 0.0961 squares in 200,000 samples against 0 observed,
        P(0) = 0.9084. The executor's conclusion - the smoke could not have
        detected this rate and carries almost no information about the exponent
        - is correct and is the honest reading.
        (c) y = 0 DEGENERATE COUNT - pass. x^3 + b = 0 iff b = -x^3, one b per
        x, and deg(-x^3) = 6 with lc = -1 != 0, so all p^2 lie inside the
        family. My own full-space enumeration counted exactly 25 at p = 5 and 49
        at p = 7, all rejected by the frozen predicate; the run record reports
        25/49/121/169, i.e. exactly p^2, all rejected. Counting them would give
        p^2(Q(p) + 1), a relative O(p^-4) change and no exponent change.
        (d) PLANTED-SECTION CONTROL AND ITS DEVIATION - pass; the deviation is
        REAL and IS DISCLOSED. With x* = t^2 + 5t + 3 and
        y* = t^3 + 2t^2 + 4t + 7 the t^6 coefficients of y*^2 and x*^3 are both
        1 and cancel, so b = y*^2 - x*^3 has degree 5. I verified this by direct
        computation. The defect originates in the FROZEN INPUT, not in this
        experiment: EXP-XEDN-001/smoke_results.json independently records
        planted_surface_b_degree: 5. Disclosure: the run record states
        b_planted_degree: 5, b_degree_is_6: false, and a deviation_note saying
        the surface "lies OUTSIDE the frozen deg-b-exactly-6 census family";
        DEV-4 records it; analysis.md control 2 marks it "pass, with a recorded
        deviation". The recovery itself checks out: exactly one hit among all
        10,201 monic quadratics at p = 101, at (x_0, x_1) = (3, 5), found by
        both the frozen predicate and my independent reference, matching the
        smoke's "1 section, recovered".
      notes: >-
        Treating the planted surface as a test of the enumerator rather than a
        census member is the right call. The frozen predicate control text is
        weak as written (finding F5); the executor exceeded it and I extended it
        adversarially. Together with the exhaustive p^7 comparison this pins the
        predicate's semantics completely: nonzero perfect square with squarefree
        root, no false positives, f = 0 rejected.

    - id: isotriviality_finding
      verdict: pass
      finding_is_correct: true
      finding_is_disclosed_in_committed_artifacts: true
      evidence: >-
        Checked four independent ways, all confirming the executor.
        (1) j = 0? YES. For y^2 = x^3 + a(t)x + b(t) in characteristic > 3,
        j = 1728 * 4a^3 / (4a^3 + 27b^2). With a = 0 identically the numerator
        vanishes and the denominator 27b^2 is nonzero because deg b = 6 forces
        b != 0. The discriminant -16(4a^3 + 27b^2) = -432b^2 is likewise
        nonzero, so the generic fibre is smooth and j = 0 is the honest constant
        value, not an artefact of a degenerate model. Under the standard
        definition of isotriviality (constant j, equivalently mutually
        isomorphic smooth fibres over the algebraic closure) EVERY member of the
        frozen family is isotrivial.
        (2) Sextic twists? YES. Over the algebraic closure x = b^(1/3) X,
        y = b^(1/2) Y turns y^2 = x^3 + b into Y^2 = X^3 + 1, so the family is
        the sextic-twist family of a single j = 0 curve.
        (3) Count of F_p(t)-constant members = (p-1)p? YES, and the "exactly" is
        justified. A Weierstrass isomorphism between short forms with a = A = 0
        in characteristic > 3 must be x = u^2 X, y = u^3 Y with u in F_p(t)^*,
        sending b to b/u^6. So the surface is F_p(t)-isomorphic to a constant
        Y^2 = X^3 + c iff b = c u^6; writing u = f/g in lowest terms and using
        deg b = 6 forces g constant and deg u = 1, i.e. b = c'(t + a_0)^6, giving
        p choices of a_0 times (p-1) choices of c'. I enumerated these directly
        and got 20 / 42 / 110 / 156 distinct b at p = 5, 7, 11, 13, all of degree
        exactly 6, matching the record.
        (4) mu_3 automorphism claim? YES. x -> zeta x with zeta^3 = 1 fixes x^3
        and so maps sections to sections; a primitive cube root exists in F_p iff
        p = 1 mod 3. I confirmed {2, 4} at p = 7 and none at p = 5, exactly the
        p = 7, 13 versus p = 5, 11 split the executor reports. In the free-x
        convention this triples a surface's sections, a sufficient mechanism for
        the observed p mod 3 oscillation in P[>= s] and in the maxima
        (3, 6, 3, 9). I also reproduced the exact free-x mean
        (p-1)(p^3+1)/(2p^4) = 0.4032, 0.4298, 0.4548, 0.4617, smooth and
        monotone while P[>= 1] is not - consistent with clumping.
        I verified the two quotations the finding rests on are real, not
        paraphrased: EXP-XEDN-001/contract.md line 20 reads "iso-trivial
        surfaces must be detected and excluded from census counts", and
        research_directions_20260718.md line 414 excludes "constant/iso-trivial
        surfaces ... j=0/1728 (extra sections may confound controls)".
        DISCLOSURE, in seven committed places: RUN-XEDN-002-CTRL/raw-result.json
        control_4_isotriviality (j_invariant_of_the_family: 0, fraction: 1.0,
        and an explanation that it "CONTRADICTS the reading assumed by the
        EXP-XEDN-002 specification's control text"); execution-report.yaml
        controls.control_4_isotriviality (verdict discharged_with_finding,
        exclusions_applied: none); DEV-5; anomalies;
        executor_assessment.open_items_for_the_coordinator; analysis.md control
        table row 4 and claim boundary 1(a); derivation.md Part 3 items 1-4 with
        the candidate-B2 cross-reference. Both readings are reported with their
        counts, nothing was excluded from any count, and the executor explicitly
        leaves resolution to the Coordinator.
      validator_assessment: >-
        The finding is mathematically CORRECT and is properly disclosed in
        committed artifacts, not only in chat. The frozen specification's
        iso-triviality control conflates isotriviality with constant
        coefficients when it says the count "must be reported as exactly zero
        for this family ... b constant is excluded by deg b = 6". Under the
        standard definition the count is the entire family, so the inherited
        EXP-XEDN-001 constraint is NOT SATISFIABLE as frozen: applying it would
        empty the family. Handling it as a disclosed finding with both readings
        counted, rather than silently picking one, is correct under AGENTS.md
        rules 1 and 8. The finding does not change any arm-A or arm-C number; it
        bears on MODEL error - whether the census measured the intended object -
        which is the Coordinator's and Red Team's call, not mine. It must not be
        lost: it is the most consequential item in the package.

    - id: arm_c_integrity
      verdict: pass
      evidence: >-
        METHODOLOGY. The fibering enumerates (x, y) pairs and bins by the
        induced b = y^2 - x^3. I verified each step rather than accepting the
        argument: for fixed x, y^2 determines b and conversely, and y^2 = y'^2
        iff y' = +/-y, so the map is exactly 2-to-1 off y = 0; every per-surface
        point count in the record is even and I re-derived points = 2 * slots at
        all four sizes; sum_s hist[s] = (p-1)p^6 (the surface count) and
        sum_s s*hist[s] = N_hit(p) from my own closed form at all four sizes - a
        double count would break the second identity, a miss would break both;
        and in my own reimplementation ZERO counts landed on any b outside the
        family ([t^6]b = 0), so the deg b = 6 filter is exact.
        INDEPENDENT REPRODUCTION. I wrote my own fibering and reproduced the
        histograms BIN FOR BIN at all four sizes: p=5 [58860, 3500, 120, 20];
        p=7 [675108, 26901, 2751, 938, 105, 21, 70]; p=11 [17077720, 617760,
        18700, 1430]; p=13 [56232878, 1549912, 95550, 33202, 6929, 2496, 156,
        468, 39, 78]. All identical to the record, as are all nine P[>= s] rows
        and the maxima (3, 6, 3, 9).
        P[>= 1] AT p = 5 spot-check against my own brute force: 3,640 of 62,500
        surfaces = 5.824000e-02, exactly the published value - and that brute
        force used no fibering at all, so the METHOD itself is independently
        validated at p = 5, 7.
        P[>= 9]: exactly 0 at p = 5, 7, 11 and 78/57,921,708 = 1.346645e-06 at
        p = 13, confirmed in my own histogram; 1/13 = 0.076923 is larger by a
