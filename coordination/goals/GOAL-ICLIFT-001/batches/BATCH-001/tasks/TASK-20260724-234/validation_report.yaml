        non-integral sections; other models and fibrations; extension fields and
        base changes; shapes outside the grid; structured subfamilies (with the
        observation that the xedni construction IS such a subfamily, so the
        lemma does not close it); independence versus distinctness; search and
        descent cost; the number-field setting; crypto scale; and the two
        unproved heuristics.
