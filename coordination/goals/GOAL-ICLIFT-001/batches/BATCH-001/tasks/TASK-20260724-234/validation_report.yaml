        proved closed form, not a from-scratch enumeration of those slot spaces.

    - id: arm_d_discipline
      verdict: pass
      evidence: >-
        EXPLICIT HYPOTHESES: H1-H6 in derivation.md section 2.1 - odd p > 3; the
        polynomial Weierstrass model with deg a <= A, deg b <= B; the section
        shape with delta free x coefficients and deg y <= e, sections integral;
        the slot-versus-surface distinction; distinct-not-independent; uniform
        sampling within the stated coefficient box.
        RIGOROUS VERSUS COUNTED: Lemma D1 is genuinely rigorous and I checked its
        proof - if a slot is a hit with witness y of degree k then
        2k = deg y^2 <= max(B, 3d, A+d) = M_0, so deg y <= E = min(e,
        floor(M_0/2)); each (a, x) has at most p^(E+1) hit b, and dividing by
        p^(dim_a + B + 1 + delta) gives P_slot <= p^(E-B), which at the frozen
        shape is p^-3, attained by Part 1. Corollary D1a's integrality step is
        also correct. Lemma D2 carries the sentence "This is a parameter count,
        not a geometric theorem." in bold, and the marker legend defines (P) as
        "parameter count / heuristic".
        UNPROVED STEPS NAMED: section 2.3 lists the marked steps ((i)
        independence of the K leading-coefficient conditions, (ii) point counts
        equal p^dim), notes that (iii) the 1/2 from the double cover is exact by
        Part 1, and uncovered case 11 says the two remaining heuristics "remain
        unproved in general; they are verified exactly only in the three
        configurations of the table in section 2.3". analysis.md section 5 and
        boundary 2 repeat this.
        NOT AN UNCONDITIONAL NO-GO: stated three times - derivation.md 2.5
