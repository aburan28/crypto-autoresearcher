  verdict_meaning: >-
    The EXP-XEDN-002 run package is admissible evidence under its frozen
    protocol, and its closed-form count is independently confirmed as derived
    rather than fitted. Seven findings are recorded, all minor or
    interpretation-level; none invalidates a run, a metric, or an artifact.
    This verdict supports no ECDLP claim, demonstrates no speedup, and
    authorises no promotion or status transition.

  independent_derivation:
    method: >-
      Derived from experiments/EXP-XEDN-002/specification.yaml and the frozen
      predicate experiments/EXP-XEDN-001/xedni_sections.py alone, and written
      into validation_notes.md section 1, BEFORE opening derivation.md.
    frozen_predicate_semantics_i_established: >-
      is_square_poly(f, p) accepts f iff f = y^2 for some nonzero SQUAREFREE
      y in F_p[t]. The squarefree requirement is implicit, not stated in the
      predicate: writing f = c*g^2 with g monic, f' = 2*c*g*g' gives
      gcd(f, f') = g * gcd(g, g'), so the step 2*deg(gcd) == deg f holds iff
      gcd(g, g') = 1. The leading-coefficient QR test rejects f = 0 because
      trim sends 0 to [0] and 0^((p-1)/2) = 0 != 1, so y = 0 sections are
      excluded. This is strictly narrower than "is a perfect square":
      f = 4t^6 = (2t^3)^2 at p = 5 is a square the predicate REJECTS.
    predicate_semantics_verified_exhaustively:
      p5: {polynomials_of_degree_le_6_tested: 78125, disagreements: 0}
      p7: {polynomials_of_degree_le_6_tested: 823543, disagreements: 0}
      note: >-
        Compared my independent set {y^2 : y != 0, y squarefree} against the
        frozen oracle over the entire p^7 polynomial space. Strictly stronger
        than the contract's "every enumerated slot at p in {5,7}".
    validator_N_slots: "(p-1) * p^8"
    validator_N_hit: "p^2 * (p^4 - 3p^3 + 2p^2 + p - 1) / 2"
    validator_derivation_sketch: >-
      N_slots: b has 7 coefficients with b_6 != 0, giving (p-1)p^6; x = t^2 +
      x_1 t + x_0 gives p^2. N_hit: for fixed x the map b |-> f = x^3 + b is a
      coefficient translation, hence a bijection, and since x^3 is monic of
      degree 6 the constraint b_6 != 0 becomes [t^6]f != 1, a condition
      independent of x. So N_hit = p^2 * M(p) with M(p) counting admissible
      f = c*g^2, g monic squarefree of degree 0..3, c a nonzero QR; the monic
      squarefree census is Q_0 = 1, Q_1 = p, Q_n = p^n - p^(n-1) for n >= 2,
      and at deg g = 3 the condition c != 1 removes exactly one QR, giving the
      (p-3)/2 stratum. Summing the four strata gives
      2*M(p) = p^4 - 3p^3 + 2p^2 + p - 1.
    executor_N_slots: "(p-1) * p^8"
    executor_N_hit: "p^2 * (p^4 - 3p^3 + 2p^2 + p - 1) / 2"
    agreement: exact
    agreement_detail: >-
      Symbol for symbol. My independent route reproduced the same four degree
      strata, the same (p-3) leading-coefficient restriction at deg y = 3, the
      same 2-to-1 +/-y factor, and the same implicit squarefree requirement.
      Two independent derivations plus matching brute-force integers: the
      formula is DERIVED, not fitted.
    brute_force_check:
      p5:
        yours: 3800
        executor: 3800
        slots_enumerated: 1562500
        coverage: full slot space
        agree: true
      p7:
        yours: 36162
        executor: 36162
        slots_enumerated: 34588806
        coverage: full slot space
        agree: true
      method: >-
        /tmp/val234/validator_derive.py, written by me, imports nothing from
        experiments/EXP-XEDN-002/implementation/. Enumerates every (b, x) pair
        with deg b exactly 6 and x monic quadratic; no use of the fibering
        bijection. Loads only the frozen predicate by file path, read-only.
    additional_identity_confirmed: >-
      The executor's exact identity 2*p^3*P_lift = 1 - 2/p + p^(-3) holds
      because (p^3 - 2p^2 + 1)(p - 1) = p^4 - 3p^3 + 2p^2 + p - 1. It is an
      identity, not a truncated expansion, so alpha = 3 exactly in the limit
      and alpha_eff < 3 at every finite pair.
    predicate_narrowness_impact: >-
      Under the wider "any perfect square" reading the counts would be 4675
      (p=5) and 41993 (p=7) instead of 3800 and 36162. Since
      P_lift ~ 1/(2p^3) under either semantics, the narrowness changes the
      CONSTANT only, never the exponent. The executor records this variant
      explicitly.

