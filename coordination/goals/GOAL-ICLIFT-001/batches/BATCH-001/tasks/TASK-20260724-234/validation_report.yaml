        analysis.md section 5 ("Arm D is not an unconditional no-go for
        lifting") and boundary 2, and execution-report.yaml not_a_no_go. The
        m = 9 boundary case on the full rational elliptic family is explicitly
        reported as dim <= 1, i.e. NOT negative.
