        and the planted x* = t^2 + 5t + 3 as claimed. Seeds [20260718, 20260724]
        are in the manifest. planned_coverage carries no x list at p = 5, 7
        because there the plan was all p^2 values - correct, not an omission.
        Every substantive statement describes p = 11, 13 as partial:
        analysis.md section 3 says full-space verification reached p = 5 and 7
        "only", labels the rows "complete b-marginals for 12/6 listed x", prints
