  counterexample_or_mutation: >-
    Two constructions outside the pre-registered six, both verified by exact
    counting, both with mean-yield ratio exactly 1.000000000 as the identity
    requires. (1) Bose-Chowla B_3 base in Z_{q^3-1} at q = 13: max_count = 1,
    so coverage = mean = min(1, mean) exactly; coverage ratio 1.1071 (+10.7%),
    asymptotically 1.0856. (2) Whole-group low-collision greedy at the
    battery's own 2^18 curve orders, same B = 117 and same 4B pool as the frozen
    arm, differing only in objective: coverage ratio 1.0269 / 1.0275 (+2.7%),
    9x the frozen arm's +0.30%, rising to 1.0343 at a 64B pool. Both are
    log-space constructions, hence oracle-dependent and rank-degenerate
    (RT-10), and both DECAY with N (the greedy's OLS slope is -0.00734 per bit
    versus the frozen arm's -0.00118), so neither rescues H-FB3-001's growth
    clause. They falsify the "no advantage" reading, not the growth-clause kill.

  baseline_comparison: >-
    Pollard rho on the same curves: about 0.886 sqrt(N) ~ 453 group operations
    at 2^18, while one exact-counting cell costs about 5e5 operations - the
    measurement is ~1000x more expensive than the attack it is about, so nothing
    here is on an attack path. BSGS: sqrt(N) time and memory (~512/512 at 2^18),
    already exceeded by the discrete-log table this measurement builds by
    construction. Closest specialized baseline, Gaudry/Diem point-decomposition
    index calculus over F_{q^n}: its decomposition probability 1/n! IS the
    conservation mean C(q+n-1,n)/q^n, so the extension-field advantage is a
    solve/representation advantage (Weil restriction) and not a yield-geometry
    advantage - closing the yield channel is fully consistent with index
    calculus working, and is not evidence against it. Over prime fields
    EV-R6-001 measured the m=3 chained-Semaev solve at 2.0e4..1.5e5x rho
    (gb-only 5.1e3..2.7e4x) with d_reg flat at 2.0; a SATURATED 1.582x coverage
    gain moves that to 1.3e4..9.5e4x, still four to five orders behind rho. The
    yield channel therefore cannot matter at the measured cost scale - which is
    a stronger conclusion than the one on offer, but it is a cost-model
    argument, not a measurement, and must be labelled as such.

  narrowest_defensible_claim: >-
    For the six pre-registered factor-base geometries of H-FB3-001, at
    N ~ 2^14/2^16/2^18 on 12 generated prime-order curves E/F_p, under the
    frozen counting convention (m = 3, unsigned multisets of factor-base points,
    targets uniform over the whole group, matched size B = ceil((6N)^(1/3))), no
    geometry met the frozen success criterion: 0 of 6 have a mean-yield ratio
    above 1 at any size, and no geometry has both a CI excluding 1 in the
    advantage direction and a growth slope excluding 0 in that direction, on
    either the primary mean-yield metric or the secondary exact-coverage metric
    (EXP-FB3-001; RUN-FB3-001-N14/N16/N18/CTRL/FAMILY; analysis.md 3-5, 7).

    The mean-yield arm is vacuous by construction and carries no evidential
    weight: the pre-registered conservation identity forces the exact mean
    per-target yield of every base of size B to C(B+2,3)/N, so the primary
    metric equals 1 for every matched-size untyped base at every N, and the two
    typed cells' Holm rejections are the closed-form typing penalty rather than
    an element-geometry effect (conservation.md 1-2, consequences (i), (ii),
    (iv)). The negative therefore rests on the secondary exact-coverage metric,
    where the largest advantage anywhere in the battery is +0.30%
    (greedy_optimized held-out coverage at 2^18) against a per-cell null
    resolution of about +/-0.5% and a 16-replicate resolution of about 0.3%.

    Scope of the negative: it closes the growth clause of the
    decomposition-YIELD channel for these six geometries, on this convention, at
    this scale. It does not establish that no factor-base geometry exceeds a
    matched random base on decomposition probability - coverage is free up to
    min(1, mean), and bases outside the pre-registered six realise part of that
    headroom.

    Claim tier toy (field_bits 14-18). Untested and open: the cost of FINDING a
    decomposition, the linear-algebra stage, relation rank and independence,
    restricted or representation-selected target sets, other m, signed
    conventions matched at x-coordinate count, and every geometry outside the
    six. No cryptanalytic consequence follows, and KN-OPEN-001 is untouched.

  overreach_to_avoid: >-
    "No structured factor base outperforms a matched random factor base."
    (Refuted: a Bose-Chowla B_3 base attains coverage = min(1, mean) exactly,
    measured coverage ratio 1.1071 at q = 13 in Z_2196; a whole-group
    low-collision greedy at the battery's own 2^18 parameters reaches 1.0269.)

    "Even an oracle-aided base gains less than 1%." (Refuted: +2.69% at 2^18
    with the same oracle and the same 4B pool, +3.43% at a 64B pool; the ceiling
    is +54%.)

    "The F3 factor-base family is dead." / "Factor-base geometry is closed as a
    research direction." / "Structured factor bases cannot help index calculus."
    (Over-reach: six named geometries, yield channel, growth clause only - and
    the identity is CONSISTENT with index calculus working, because
    Gaudry-Diem's 1/n! decomposition probability over F_{q^n} IS the
    conservation mean, so the extension-field advantage lives in the solve,
    which this experiment does not touch.)

    "Retaining the censored prior-cell Holm slots makes the null conclusion
    conservative." (Backwards: inflating the family size makes detection harder,
    which weakens a null rather than strengthening it.)

    "The conservation identity was empirically confirmed by 67 784 checks."
    (Category error: those checks verify the counter; the identity is a double
    count that cannot fail for a target-independent counted family - ten
    conventions tested, all hold.)

    "The coverage channel is closed." (Over-reach unqualified: closed for these
    six geometries at this scale, and bounded for all geometries by a <= 1.582
    constant only under the heuristic coverage_random ~ 1 - e^-mu.)

    Any sentence asserting a speedup, an attack step, a cryptanalytic result, or
    a statement about medium or cryptographic curves.

  cheapest_falsifying_control: >-
    One run, seconds of CPU, inside the existing harness: re-run the
    greedy_optimized arm at the three frozen sizes with the WHOLE-GROUP coverage
    objective and no train/held-out split (exact whole-group counting leaves
    nothing to overfit), and add two arms at matched B - a Bose-Chowla B_3
    (Sidon-of-order-3) base, and the same greedy at a 64B pool. Report the exact
    coverage ratio with its permutation band and the FAMILY-WISE slope versus
    log2 N, against the analytic ceiling min(1, mu)/(1 - e^-mu). It OVERTURNS
    the conclusion if any arm has a coverage-ratio family-wise CI excluding 1
    upward AND a slope excluding 0 upward across 2^14..2^18, because then a
    factor-base geometry has an exponent-relevant coverage advantage and the F3
    question is alive on the metric H-FB3-001's own mechanism names. My reduced
    version (1 curve per size, no null replication, no permutation test) gives
    +5.65% / +4.18% / +2.72% with OLS slope -0.00734 per bit, so I expect
    confirmation - which is exactly why it is the right control: it builds the
    strongest available version of the geometry the battery mis-specified, gets
    9x the effect, and still fails the growth clause 6x more steeply than the
    arm as run. A kill that survives its strongest counterexample is worth
    recording; the one currently on offer has not met it.

  relationship_to_prior_records: >-
    EV-FB-001 (weakens H-FB-001; "Factor-base structure is not a scaling lever
    for prime-field PDP"; "yields within 1.1x of random"; yield tracks the
    combinatorial |FB|^3/N): consistent, and EXP-FB3-001 explains the mechanism
