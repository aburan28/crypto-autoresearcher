      files.

  claim_under_review: >-
    That EXP-FB3-001 supports a scoped reject_scoped of H-FB3-001 - the frozen
    falsification criterion's "scoped KILL of the F3 factor-base family, no
    signal seen at reachable scale" - on the basis that 0 of 6 pre-registered
    geometries met the success criterion, that the three untyped geometries sit
    at a mean-yield ratio of exactly 1.000000 with growth slope exactly 0, that
    the three typed/greedy cells sit strictly below the null, and that the
    pre-registered conservation identity forces the mean per-target yield to
    binomial(B+2,3)/N for every base of size B regardless of geometry.

  overall_position: conclusion_requires_narrowing
  overall_position_reason: >-
    The frozen success criterion demonstrably fails and a scoped negative is
    supportable, but three narrowings are required and one pre-registered arm
    was measured under a protocol that suppresses its own effect by about an
    order of magnitude. (1) The kill is a GROWTH-clause kill on the yield
    channel for six named geometries; it is not a statement that no geometry
    beats a matched random base, which I falsified with two constructions
    outside the six. (2) The primary mean-yield metric is vacuous by
    construction, so the negative must be sourced from the secondary exact
    coverage metric plus a cost-model ceiling, not from "0 of 6 met the
    criterion". (3) The greedy_optimized (H022) arm's frozen train/held-out
    split is unnecessary once counting is exact over the whole group and
    demonstrably dilutes its effect 9x. No objection is fatal: every
    counterexample I built still fails the growth clause, and one fails it more
    steeply than the arm as run.

  objections:
    - id: RT-1
      severity: scoping
      target: >-
        specification.yaml falsification_criterion: "scoped KILL of the F3
        family - 'no signal seen at reachable scale'", as carried into
        analysis.md 7 ("no geometry produced any advantage at any size on the
        primary metric, and the one sub-1% advantage anywhere in the battery
        (greedy held-out coverage) decays with N").
      objection: >-
        The conservation identity pins the mean but leaves coverage free up to
        min(1, mean), and at the frozen operating point mean ~ 1.04 so the
        headroom is +54%. "No signal" is therefore a statement about the six
        tested geometries on the two measured metrics, not about factor-base
        geometry. Geometries outside the six realise a materially larger part of
        that headroom than anything the battery observed.
      test_performed: >-
        /tmp/rt_probe.py P1 - constructed a Bose-Chowla B_3 (Sidon-of-order-3)
        base A = {a : theta^a - theta in F_q} in Z_{q^3-1} at q = 13 (N = 2196,
        B = 13) and counted every target exactly; /tmp/rt_probe3.py -
        constructed a whole-group low-collision greedy base at the battery's own
        2^18 curve orders with the battery's own B = 117 and pool = 4B = 468.
      outcome: >-
        Bose-Chowla: total 455 = C(15,3) so the identity holds, max_count = 1 so
        coverage = mean = min(1, mean) exactly, mean-yield ratio 1.000000000,
        COVERAGE RATIO 1.1071 (+10.7%; asymptotically 1/6 / (1 - e^-1/6) =
        1.0856). Whole-group greedy at N = 261643 / 261563: coverage ratio
        1.0269 / 1.0275 (+2.7%) against a measured matched-random coverage of
        0.6491 / 0.6493 (battery null 0.6480). Both exceed the battery's largest
        observed excess (+0.30%) by factors of 36 and 9. Ceiling min(1,mu)/rand
        = 1.5407 (+54.1%).
      implication_for_claim: >-
        Record a growth-clause kill on the yield channel for the six named
        geometries. Do not record "no structured factor base outperforms a
        matched random base", and do not let "scoped KILL of the F3 family"
        stand unqualified next to a conservation identity that only constrains
        the mean.

    - id: RT-2
      severity: scoping
      fatal_to_sentence: true
      target: >-
        analysis.md 8: "the `greedy_optimized` base is *selected* using the full
        discrete-log table, so that construction is not available to an attacker
        at all - it measures what an oracle-aided base could achieve, which
        makes its sub-1% decaying coverage excess an upper bound of an
        unrealisable kind, not an attack step."
      objection: >-
        The frozen H022 definition greedily covers a random TRAINING half of the
        group and reports on the HELD-OUT half. A train/eval split is the right
        guard when the statistic is estimated on a SAMPLE of targets, which is
        what the pre-amendment ">= 300 random targets" protocol did. Amendment
        AMD-2 replaced sampling with exact whole-group counting, at which point
        the group IS the population (a fresh uniform target decomposes with
        probability exactly the whole-group coverage) and there is nothing to
        overfit. The split then stops being a guard and becomes a handicap that
        conservation makes automatic: pushing count mass onto a random half
        starves the complement, and the greedy objective is indifferent to
        collisions it creates off-training. So the arm cannot measure the
        geometry H022 proposes, and the quoted sentence's "what an oracle-aided
        base could achieve" is not an upper bound.
      test_performed: >-
        /tmp/rt_probe3.py - identical N (261643 and 261563, actual
        RUN-FB3-001-N18 curve orders), identical B = 117, identical pool = 4B =
        468, identical log-space oracle, bitset counting as in
        implementation/fb3_core.py; only the objective changed to whole-group
        coverage with whole-group evaluation. Pool sensitivity at N = 261643 for
        4B / 16B / 64B. Then all three frozen sizes (16339, 65579, 261643) with
        pool = 4B and an OLS slope fit.
      outcome: >-
        Coverage ratio 1.0269 and 1.0275 versus the frozen arm's 1.0030 - a
        factor of 9.0 to 9.2 at the same budget. Pool sensitivity 4B -> 1.0262,
        16B -> 1.0315, 64B -> 1.0343, so the level is the greedy heuristic, not
        the pool rule. Across the three frozen sizes the corrected objective
        gives 1.0565 / 1.0418 / 1.0272 with OLS slope -0.00734 per bit versus
        the frozen arm's -0.00118: a larger effect at every size and a ~6x
        steeper DECAY. Headroom realised falls 0.119 -> 0.080 -> 0.050 while the
        analytic ceiling drifts UP (+0.0167 per bit).
      implication_for_claim: >-
        The growth clause survives and is strengthened, so the verdict stands.
        But the quoted sentence must be corrected: the oracle-aided achievable
        at these parameters is +2.7% (+3.4% at a 64B pool), not sub-1%, and the
        true ceiling is +54%. The Coordinator may record that the greedy arm
        fails the growth clause; it may NOT record that greedy optimization
        finds no exploitable additive structure, and it may not cite the <1%
        figure as the oracle-aided ceiling.

    - id: RT-3
      severity: scoping
      target: >-
        execution-report.yaml verdict_against_frozen_criteria
        (success_criterion_met: false, n_geometries_meeting_success_criterion:
        0) read against H-FB3-001.mechanism: "Decomposition PROBABILITY depends
        on how the base's x-coordinates interact with the chord structure of the
        summation condition."
      objection: >-
        Decomposition probability is coverage. The frozen success criterion is
        stated on the mean yield ratio, which conservation.md 2(i)-(ii) proves
        is exactly 1 for every matched-size untyped base at every N. So the
        pre-registered primary test does not operationalise the hypothesis's own
        stated mechanism, and it could not have passed for 3 of 6 cells under
        any data; for 2 more its value is a closed-form typing constant fixed
        before measurement. Only greedy_optimized carried contingency, and only
        because its evaluation domain is a proper subset of the group.
      test_performed: >-
        Argument only, cross-read against H-FB3-001.yaml (mechanism,
        predictions), specification.yaml success_criterion, conservation.md
        consequences (i), (ii), (iv), and the executor's own concession in
        analysis.md 7 ("the primary metric is *mathematically incapable* of
        showing a matched-size geometry effect").
      outcome: >-
        Confirmed as written. "0 of 6 geometries met the success criterion" is
        true but is one theorem applied to three cells, one arithmetic identity
        applied to two, and one contingent measurement - not six null findings.
      implication_for_claim: >-
        The evidence record must state that the mean-yield arm is vacuous by
        construction and carries no evidential weight, and must source the
        negative from the secondary exact coverage metric plus the ceiling
        argument of RT-5. A reject_scoped justified on the primary metric alone
        would be rejecting a hypothesis on a test that could not have passed.

    - id: RT-4
      severity: noted
      target: >-
        conservation.md 1 ("The identity is structural; only the constant |M|
        depends on the convention") and analysis.md 2 control row "Closed-form
        total ... 67 784 checks ... pass, 0 failures".
      objection: >-
        Two halves. (a) The identity is a one-line double count and cannot fail
        for any target-independent counted family, so the 67 784 checks verify
        the COUNTER, not a research claim; describing them as confirming the
        identity inverts what was tested. (b) The only convention in which
        mean-invariance fails is a restricted or non-uniform target set, and
        that failure is large.
      test_performed: >-
        /tmp/rt_probe.py P4 - ten conventions: plain multisets; base with
        repeated group elements; identity element in the base; m = 2, 4, 5;
        signed symmetric base D u (-D); the NON-CYCLIC group Z_2 x Z_8; ordered
        tuples; typed Cartesian (4,3,2). /tmp/rt_probe.py P5 - restricted target
        set S = a 1/8-of-group log-space window, N = 1009, B = 19, base
        {1,...,B}.
      outcome: >-
        The identity holds exactly in all ten conventions, including the
        cryptographically relevant signed x-coordinate convention (constant
        C(2|V|+2,3)) and non-cyclic groups (relevant because E(F_p) need not be
        cyclic; this battery restricted to prime order). It fails only on a
        restricted target set: whole-group mean ratio 1.000000000 but ON S the
        structured/random mean ratio is 8.0118.
      implication_for_claim: >-
        State the identity as a derivation, not as an empirical confirmation.
        State mean-invariance as strictly a whole-group-uniform-target
        statement. Note that the restricted-target escape route becomes
        cryptographically live only if the restriction is decidable from the
        target's REPRESENTATION rather than its logarithm, which is untested and
        sits inside KN-OPEN-001.

    - id: RT-5
      severity: scoping
      target: >-
        The absence of any relations-per-unit-work statement in analysis.md,
        conservation.md, and execution-report.yaml; conservation.md 2(iii) "the
        only geometry-sensitive quantities are the DISTRIBUTION of the counts
        across targets and hence coverage".
      objection: >-
        The battery reports existence counts with no cost model, so it cannot
        say whether a structured base could win on relations per unit work at
        equal mean and lower coverage - the question the handoff asks. Supplying
        the cost model both strengthens the closure and bounds it, and the bound
        is a universal constant the artifacts do not state.
      test_performed: >-
        Argument plus /tmp/rt_probe.py P2 (maximise min(1,mu)/(1-e^-mu) over mu)
        and P3 (measure random-base coverage against 1-e^-mu at N = 1009, 4001,
        16381), cross-read against EV-R6-001 (vdim 0..61, per-cell medians
        4.5-9; solve/rho cost ratio 2.0e4..1.5e5x; d_reg median flat 2.0).
      outcome: >-
        Under a harvest-all-solutions solve - which EV-R6-001's vdim 0..61
        indicates is the realistic model - expected relations per solve attempt
        is E_r[c(r)] = mu = C(B+m-1,m)/N, EXACTLY geometry-invariant, so the
        yield channel closes exactly and coverage is irrelevant. Under a
        one-relation-per-target model the gain is 1/coverage, bounded by
        min(1,mu)/(1-e^-mu) whose maximum over mu is 1.581977, attained at
        mu = 1 - exactly where the frozen B = ceil((6N)^(1/3)) places the
        battery, so the tested operating point is the MOST favourable one and
        the bound is N-free. Measured support for the 1-e^-mu heuristic:
        0.740/0.679/0.678 versus 0.732/0.675/0.675 in my probe, and the
        battery's own nulls 0.6734/0.6594/0.6480 versus 0.6719/0.6588/0.6478.
        At mu << 1 (cryptographic parameters) the ceiling tends to 1 + mu/2 ->
        1, so the channel is MORE closed at crypto scale than at the tested
        mu ~ 1.
      implication_for_claim: >-
        Record the exact-invariance-of-relations-per-solve statement and the
        <= 1.582 ceiling as the basis for closing the growth clause across ALL
        geometries, labelling coverage <= min(1,mu) as a theorem and
        coverage_random ~ 1-e^-mu as a heuristic with measured support. Do not
        state the ceiling as proved.

    - id: RT-6
      severity: scoping
      target: >-
        analysis.md 3: "family size 8 at every size (prior-cell slots retained
        even where censored, which is conservative)"; execution-report.yaml D3
        "effect_on_criteria: conservative (family size stays 8)"; budget.censoring
        "Their family slots are retained so the Holm family size stays 8 at
        every size, which is conservative."
      objection: >-
        Holm-Bonferroni controls the family-wise FALSE-POSITIVE rate. The
        conclusion being recorded is a false-NEGATIVE claim. Inflating the
        family size makes rejection harder, which makes the null EASIER to
        reach: that is anti-conservative for this conclusion, not conservative.
        The family is also thinner than "8 cells" implies - on the primary
        metric 3 cells are pinned at exactly 1 by theorem, 2 at a closed-form
        typing constant, 2 are censored recorded cells at 2^14 only, leaving one
        contingent cell.
      test_performed: >-
        Argument, plus a sensitivity reading from
        runs/RUN-FB3-001-N18/raw-result.json: per-cell coverage
        null_ratio_band_95 = [0.99516, 1.00476] (high_bit_interval, curve 1),
        i.e. per-cell resolution about +/-0.5%; the 16-replicate aggregate
        resolved +0.30%.
      outcome: >-
        Confirmed as an inverted label. The correction direction is real: a
        larger Holm family raises the rejection threshold, which cannot make a
        null more trustworthy. The battery's actual power is good and is the
        right thing to cite - about +/-0.5% per cell, about 0.3% in aggregate,
        against a coverage ceiling of +54% (RT-5) - so the kill does not need the
        family-size argument and should not rest on it.
      implication_for_claim: >-
        Relabel: "conservative for any claimed effect; permissive for the null,
        so the null is not sourced from failure to reject." Source the kill from
        effect sizes and sensitivity - about +/-0.5% per cell and about 0.3% in
        aggregate against a +54% ceiling, which is ample power - rather than
        from an 8-cell Holm family that contains one contingent test on the
        primary metric.

    - id: RT-7
      severity: noted
      target: >-
        analysis.md 4 table, coset_union slope CI95 [+0.000086, +0.00226] and
        greedy_optimized slope CI95 [-0.00196, -0.00037]; analysis.md 4
        "the slope is negative and its CI excludes 0, so the excess decays with
        N".
      objection: >-
        The frozen criterion is Holm-adjusted, so the family-wise interval is
        the operative one. At the family-wise level the two slope statements
        change character.
      test_performed: >-
        Read runs/RUN-FB3-001-FAMILY/raw-result.json growth.<geometry>.coverage
        ci99.375 directly.
      outcome: >-
        coset_union coverage slope ci99.375 = [-0.000453, +0.00253], which
        INCLUDES 0 - so at the family-wise level coset_union has no slope effect
        at all (this strengthens the kill; the analysis.md column is honestly
        labelled CI95, so nothing is misreported). greedy_optimized coverage
        slope ci99.375 = [-0.00228, -7.9e-7], excluding 0 by 8e-7 - so the
        "decays with N" claim is fragile at the family-wise level.
      implication_for_claim: >-
        Record both slopes at the family-wise level, and record the verdict as
        robust to the greedy slope's fragility: a slope indistinguishable from 0
        also fails the frozen growth clause and matches H-FB3-001 falsification
        condition 2 ("effect present but constant across N"). Do not lean the
        verdict on the decay.

    - id: RT-8
      severity: noted
      target: >-
        execution-report.yaml anomaly A3 and boundaries entry "the 16-replicate
        bootstrap is partly pseudo-replicated"; analysis.md 4 greedy coverage
        family-wise CI [1.00105, 1.00456].
      objection: >-
        Test whether the one real above-1 effect survives the pseudo-replication
        the executor flagged, and whether the curve-cluster interval means what
        it appears to mean.
      test_performed: >-
        Recomputed from runs/RUN-FB3-001-N18/raw-result.json: all 16
        greedy_optimized coverage ratios, the four curve means, a t-test on the
        curve means, and a comparison against the recorded
        bootstrap_curve_cluster interval.
      outcome: >-
        greedy_optimized DOES vary with the replicate seed (the 4B pool is
        seeded), so its replicates are not pseudo-replicated the way the three
        deterministic geometries are. 14 of 16 replicates exceed 1; curve means
        1.00393 / 1.00235 / 1.00161 / 1.00407 give t = 4.96 on 3 df (p ~ 0.016).
        The recorded curve-cluster ci99.375 = [1.00161, 1.00407] excludes 1 but
        is exactly the min/max of four numbers, so it carries no real 99.375%
        guarantee. Anomaly A3 describes the situation correctly.
      implication_for_claim: >-
        The +0.30% excess is real, small, and honestly reported. State it as
        "the excess appears in all four curves" rather than quoting a 99.375%
        cluster interval built from four values. Separately, note that the
        shared untyped permutation null correlates the three untyped coverage
        tests - valid for Holm under arbitrary dependence, but they are not
        three independent nulls.

    - id: RT-9
      severity: scoping
      target: >-
        H-FB3-001 prediction 2 and specification.yaml inputs.geometries:
        "asymmetric_sizing (H004): B_1 != B_2 != B_3 with B_1*B_2*B_3 ~ l";
        analysis.md 3 row "asymmetric_sizing (typed, (8,1,1)) ... p_holm 0.0398
        rejected, deficit".
      objection: >-
        The amendment pins B1 + B2 + B3 = B = ceil((6N)^(1/3)), so by AM-GM
        B1*B2*B3 <= (B/3)^3 = 6N/27 = 0.222 N < N. The arm can never reach the
        product ~ l that H004 names; reaching it requires total size
        3 N^(1/3) ~ 1.65 B. So the cell tests "unbalanced splits at fixed total
        size", which AM-GM settles a priori, and its Holm rejection is a
        size/typing artifact rather than measured evidence about H004's design
        point.
      test_performed: >-
        Argument only, checked against conservation.md 2(iv) (typed/untyped ->
        2/9), the measured ladder in analysis.md 3 and execution-report.yaml
        observations (0.2166 -> 0.1812 -> 0.1042 -> 0.0420 at 2^18), and
        deviations D6(b) and A5.
      outcome: >-
        Confirmed. The executor discloses the control choice (D6(b), A5) and
        reports exactly 1.000000 against same-typing controls at every rung and
        size, so nothing is hidden - but the rejection is arithmetic.
      implication_for_claim: >-
        Record H004's closure as "settled by AM-GM at matched total size; at
        matched typed total the ratio is forced to 1; the fixed-product
        (B1*B2*B3 ~ l) design point was not built". Do not present the H004 Holm
        rejection as measured evidence.

    - id: RT-10
      severity: noted
      target: >-
        specification.yaml metrics (primary and secondary) - relation rank
        appears nowhere; analysis.md 6 exploratory rows for
        small_multiples_H017 (mean-yield ratio 1.000000) and qr_walk_H016.
      objection: >-
        A relation is useful only if independent of those already collected, and
        the battery never measures rank. Its metrics therefore score
        cryptanalytically vacuous bases as EXACTLY TIED with random: the
        small-multiples base has logs {1,...,B}, a rank-1 lattice, so every
        factor-base log is a known multiple of log G and the relations are
        vacuous, yet its recorded mean-yield ratio is 1.000000; the
        qr_walk_H016 reconstruction is an r-adding walk with r = 20,
        c_j in [1, 2^10), so its 47 logs lie in the Z-span of at most 21 values.
        Any geometry able to realise the coverage ceiling of RT-5 must be built
        in LOG space, because additive structure in the group is log-space
        structure, so it inherits exactly this defect.
      test_performed: >-
        Argument only, from the recorded constructions (amendment-001.yaml
        frozen_definitions mixed_two_base and prior_cells; analysis.md 1 QR walk
        parameters) and the standard relation-matrix form
        (e_1..e_B | a, b) with B+1 unknowns.
      outcome: >-
        rank <= relation count and a random base is generically rank-optimal, so
        NO geometry can gain on the rank channel: the omission is conservative
        for the kill and cannot rescue the F3 family. It is also the correct
        and deeper reason the coverage ceiling is unreachable by an attacker -
        stronger than the greedy-oracle remark in analysis.md 8.
      implication_for_claim: >-
        Add "relation rank and independence are not measured" to the boundaries,
        and state that the omission bounds the family further rather than
        sparing it.

    - id: RT-11
      severity: scoping
      target: >-
        analysis.md 8: "A null result here closes the **yield channel** of the
        F3 family on the tested scope; it says nothing about the solving
        channel." (This sentence is correct and must be preserved; the objection
        is about channels a reader could wrongly think are covered.)
      objection: >-
        I searched analysis.md, conservation.md, and execution-report.yaml for
        any sentence claiming closure of index calculus, a cryptanalytic result,
        or closure of factor-base research generally. I found none - the
        boundary discipline is good. The risk is downstream: a scoped kill of
        "the F3 factor-base family" can be read as covering channels this
        experiment never touched.
      test_performed: >-
        Grep of the three artifacts for closes/closed/kill/index calculus/
        cannot/any base/every base/all bases; arithmetic check that Gaudry-Diem's
        1/n! decomposition probability equals the conservation mean; cross-read
        of KN-TECH-003, KN-OPEN-001, KN-OPEN-006.
      outcome: >-
        No offending sentence exists. Decisive interpretive point for the
        record: with |F| ~ q, N ~ q^n, m = n, the conservation mean is
        C(q+n-1,n)/q^n ~ 1/n!, i.e. Gaudry-Diem's celebrated extension-field
        decomposition probability IS the conservation mean. The extension-field
        advantage is therefore a SOLVE/representation advantage (Weil
        restriction), and the identity is fully consistent with index calculus
        working. Channels not covered: the point-decomposition solve; the
        linear-algebra stage (KN-OPEN-006 is open and proposes
        arithmetic-progression relation supports, cousins of high_bit_interval
        and the small-multiples sub-base); sumset-recognizable bases, where a
        cheap representation-level membership predicate for Sigma_m(D) would cut
        wasted solves by 1/coverage, UNBOUNDED as mu -> 0 rather than the
        bounded 1.582x, and invisible to both measured metrics; Sidon/B_3 and
        other extremal additive geometries; descent and individual logarithm;
        memory; other m (m = 4 is fully censored in EV-R6-001); signed bases
        matched at x-coordinate count; restricted target sets.
      implication_for_claim: >-
        Carry analysis.md 8's channel sentence verbatim into the evidence
        record, and name the uncovered channels explicitly so the scoped kill
        cannot be read as narrowing KN-OPEN-001 or KN-OPEN-006. The
        sumset-recognizable-base channel is the sharpest surviving descendant of
        the F3 question and should be recorded as open, not killed.

    - id: RT-12
      severity: noted
      target: >-
        analysis.md 8 "Bit sizes tested: N ~ 2^14, 2^16, 2^18 ... Claim tier
        `toy`"; execution-report.yaml boundaries "Toy scale only".
      objection: >-
        Separate what the toy scale does and does not permit, because the
        identity is size-free while the coverage and concentration statistics
        are not.
      test_performed: >-
        Argument plus the ceiling evaluation of /tmp/rt_probe.py P2 at mu << 1,
        and an order-of-magnitude comparison of the measurement cost against
        Pollard rho on the same curves.
      outcome: >-
        Permitted because size-free: mean-invariance (a theorem in any finite
        abelian group for any target-independent counted family) and
        coverage <= min(1, mu). Their transfer to crypto scale is mathematical,
        not extrapolated. NOT permitted: any claim that x-coordinate structure
        remains additively pseudorandom at large B (B <= 117 here, and a weak
        additive bias in a 117-element set is invisible at +/-0.5% per cell);
        any solve, linear-algebra, memory, or B/N-tradeoff claim; any
        generalisation from 4 generated curves per size to standardised curves.
        Perspective: exact counting at 2^18 costs about 5e5 operations per cell
        (O(B^3/6 + N)) while Pollard rho solves the same ECDLP in about
        0.886 sqrt(N) ~ 453 group operations - nothing measured here is on an
        attack path, and the amendment's honesty note to that effect is accurate.
      implication_for_claim: >-
        Keep the toy tier. Add that the identity and the coverage bound transfer
        by mathematics while every distributional statistic does not, and that
