  required_controls:
    - >-
      Re-run the greedy_optimized arm at the three frozen sizes with the
      whole-group coverage objective and NO train/held-out split, since exact
      whole-group counting leaves nothing to overfit (RT-2).
    - >-
      Add a Bose-Chowla B_3 (Sidon-of-order-3) arm at matched B, which attains
      coverage = min(1, mean) exactly and calibrates the top of the coverage
      channel (RT-1).
    - >-
      Report every coverage slope at the family-wise level (ci99.375), not CI95,
      because the frozen criterion is Holm-adjusted (RT-7).
    - >-
      Instrument relation RANK on one cell per geometry (rank of the collected
      (e_1..e_B | a, b) rows mod N), converting RT-10 from argument to
      measurement.
    - >-
      State the cost model explicitly: relations per solve attempt under a
      harvest-all-solutions solve, and the min(1,mu)/(1-e^-mu) <= 1.582 ceiling
