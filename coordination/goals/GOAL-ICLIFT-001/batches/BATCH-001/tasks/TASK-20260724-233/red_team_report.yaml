    |FB|^3/N law is forced rather than empirical. Caution: EV-FB-001 also claims
    solving degree and solve cost are structure-invariant (d_reg = 2, time
    ~ d^6), which EXP-FB3-001 does NOT measure; the new record must not be cited
    for the solving channel, and must not be read as replicating EV-FB-001's
    solve claim at three sizes.
    EV-R6-001 (contradicts H-R6-001; alpha = 2.074 CI90 (1.565, 2.621);
    solve/rho 2.0e4..1.5e5x; d_reg median 2.0; vdim 0..61; m = 4 fully
    censored): consistent, and load-bearing here in two ways - its vdim 0..61
    supports the harvest-all-solutions cost model under which relations per
    solve attempt is exactly mu and hence exactly geometry-invariant, and its
    solve/rho ratio shows a saturated 1.582x coverage gain leaves index calculus
    four to five orders behind rho. EXP-FB3-001 supplies no m = 4 evidence and
    must not be read as filling EV-R6-001's censored m = 4 arm.
    KN-TECH-003 ("Prime fields GF(p): no good structured factor base is known"):
    reinforced on the yield channel at toy scale only; the technique note's
    cost attribution to "relation-collection (decomposition tests) and linear
    algebra" is untouched.
    KN-OPEN-001 (does index calculus beat rho over prime fields - open):
    untouched. Nothing here may be recorded as narrowing it.
    KN-OPEN-006 (AP relation supports and displacement rank - open): untouched
    and at risk of apparent coverage, because it proposes
    arithmetic-progression supports resembling high_bit_interval and the
    small-multiples sub-base while asking about the LINEAR-ALGEBRA stage. The
    decision record should say explicitly that the F3 kill does not narrow it.
    H016/H017 prior cells: the exact recomputation reproduces both prior
    conclusions and shows the prior sampled estimator was unstable for
    concentrated bases (recorded H017 sampled ratios 0.0000 to 1.7895 while the
    exact mean-yield ratio is identically 1). That is a strengthening of the
    prior record, not a contradiction, and should be recorded as such.

