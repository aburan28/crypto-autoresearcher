  required_controls:
    - >-
      An in-population planted-section control (deg b = 6, y_3^2 != 1) for any
      successor experiment; the current package has none (RT-9).
    - >-
      Report P[>= s] in BOTH the monic and the free-x conventions at every size,
      and report sizes separately by p mod 3, in any record that cites the
      multi-section histogram (RT-3).
    - >-
      Compute the Mordell-Weil relation structure (Gram matrix, relation lattice,
      max |coefficient|) before any statement about relation sources (RT-4,
      RT-10).
    - >-
      Any successor census must state whether it measures the uniform or the
      constructed measure, and must not use the word "lift probability" without
      that qualifier (RT-5).
    - >-
      Recompute arm D's prescribed-target dimension with only one fibre condition
      in the a-absent case before quoting any threshold in m (RT-6).

  counterexample_or_mutation: >-
    Two concrete counterexamples to the broad reading, both verified. (1)
    Construction, not sampling: for every target curve Y^2 = X^3 + B_0 and every
    point on it, b := y^2 - x^3 with x(0) = X_0, y(0) = Y_0 and y_3^2 != 1 gives
    an in-family surface whose fibre at t_0 = 0 is the target and which carries a
    section through the prescribed point - 10,201 of 10,201 successes at p = 101
    against a uniform per-slot rate of 4.76e-07. (2) Distinct is not independent:
    on the in-family p = 13 surface b = [0,0,3,12,9,7,3] the 15 counted free-x
    sections form 5 mu_3 orbits, each satisfying S + wS + w^2 S = O, whose
    specialisation P + wP + w^2 P = O holds at all 4,788 tested points of all
    smooth j = 0 fibres at p = 7, 13, 31, 61 - a tautology with no discrete-log
    content - and the same surface carries infinitely many higher-degree sections
    (2S..12S computed, deg num x(nS) = 2n^2) that the census does not see.

  baseline_comparison: >-
    EXP-XEDN-002 makes no cost claim and no attack claim, and every run sets
    certificate.kind: none, so there is nothing to compare - which is itself the
    finding. For the regime candidate B2 targets (prime-field ECDLP, n ~ p) the
    standing baselines are Pollard rho at about 0.886*sqrt(n) group operations
    with negligible memory, BSGS at about 2*sqrt(n) operations with about
    sqrt(n) memory, and - as the specialized baseline B2 itself names -
    summation-polynomial / Semaev index calculus for the relation-generation stage
    that B2 proposed to undercut at O(poly(r) log^2 p) per relation. No stage of
    that path is established here: no relation is produced, no Mordell-Weil rank
    is computed, no source recovery or target descent is attempted, and no memory
    or wall-clock model exists. The correct baseline sentence is that the route
    has no cost path at all at this point, not that it is slower than rho.

  narrowest_defensible_claim: >-
    "For the frozen EXP-XEDN-001 surface family (y^2 = x^3 + b(t) over F_p with
    a(t) = 0 and deg b = 6 exactly), the frozen slot definition (x monic of
    degree 2, deg y <= 3), and the frozen is_square_poly predicate (nonzero
    square with squarefree root, y = 0 excluded), the probability that a
    UNIFORMLY RANDOM (surface, slot) pair admits a section is exactly
    P_lift(p) = (1 - 2/p + p^-3)/(2 p^3). The limiting exponent is therefore
    alpha = 3 exactly with constant exactly 1/2, and the exact finite-size
    exponents at the four contracted sizes are 2.985781, 2.993178, 2.996544.
    H-XEDN-001's prediction alpha < 1/2 is false for this family, this slot
    shape, and this predicate, and the EXP-XEDN-001 phase-2 promotion gate does
    not open. Under the same frozen conventions, the fraction of surfaces
    carrying at least 9 distinct hit slots of this single degree shape is exactly
    0 at p = 5, 7, 11 and 1.346645e-06 at p = 13, hence below p^-1 at every
    computed size in the monic convention; in the free-x convention recorded in
    the same run the corresponding fractions are 0, 7.893536e-03, 0, and
    8.815141e-03, which are also below p^-1 but rise with p. Two defects of the
    formalisation are recorded with the result and bound it. First, every member
    of the family has j = 0 and is iso-trivial in the standard sense, which is the
    class candidate B2 explicitly excluded, so H-XEDN-001's own assumption that
    iso-trivial surfaces are excluded is unsatisfiable for the family it names;
    H-XEDN-001 is rejected AS POSED, and this is not a closure of candidate B2.
    Second, the measured quantity is a per-slot rate under the uniform measure on
    the family, whereas the xedni construction prescribes the surface through the
    lifted points, so this result is not a measurement of the lift probability the
    attack needs. The scoped closure covers exactly: the uniform-measure per-slot
    integral-section density for this surface family, this monic degree-2 slot
    shape, this predicate, and these sizes. It says nothing about non-isotrivial
    families, a(t) != 0, higher-degree or non-integral sections, Mordell-Weil rank
    or independence, relation-coefficient size, the constructed measure, other
    base fields, crypto scale, or xedni over number fields."

  overreach_to_avoid: >-
    Do not record any of these sentences. "The function-field xedni census is
    closed." "Candidate B2 is closed / rejected." "The function-field xedni lift
    probability decays as p^-3." "Section-rich surfaces are exponentially rare
    over F_p(t)." "The exact census confirms / reproduces / is consistent with the
    classical JKSST prediction alpha = 3." "P[>= 9 sections] decays faster than
    p^-1, so the multi-section relation source is closed." "The multi-section or
    Mordell-Weil relation-source route is closed." "Arm D shows that prescribing
    the target specialisation destroys section abundance." "The frozen predicate
    was exhaustively validated at p in {5, 7, 11, 13}." "Together with ECFG-P1543
    and ECFG-P1547 this closes lifting-based relation sources." "No lifting-based
    relation source exists over F_p(t)." Also do not title the ledger record with
    the word xedni or with "lift probability"; title it with the measured quantity
    (uniform-measure per-slot integral-section density in the j = 0 sextic-twist
    family).

  cheapest_falsifying_control: >-
    Compute the relation structure the census skipped, on the surfaces the census
    already identified. Take the section sets recorded by arm C on the section-rich
    surfaces at p = 7 and p = 13 (and add p = 19, 31), form the Shioda height Gram
    matrix for the observed free-x integral sections (<P,P> = 2 and
    <P,Q> = 1 - (P.Q) for integral sections on this family, since chi = 1,
    (P.O) = 0 and all fibres are irreducible for squarefree b), extract a Z-basis
    of the relation lattice, and report max |coefficient| of the minimal relation
    and the rank of the span, as a function of p. If max |coefficient| grows with
    p, the relation-source route reopens and the closure must be withdrawn. If it
    stays absolutely bounded - as it does on my p = 13 probe surface, where every
    relation among the 15 counted sections has coefficients in {-1, 0, +1} - then
    the route is closed by the coefficient-bound mechanism and the p^-3 census was
    measuring the wrong obstruction, which the decision record must say. Cost:
    gcds of degree-<=3 polynomials plus exact linear algebra on at most 9x9
    rational matrices for a few hundred surfaces; well under one CPU-minute, no
    new family, no new predicate, and it computes exactly the object candidate B2
    names as its retained information (the height-pairing Gram matrix).

  second_cheapest_control: >-
    Extend arm C's FREE-x histogram to p = 19 and p = 31 (the next two sizes with
    p = 1 mod 3) and test whether P[>= 9 free-x slots] stays near 9e-03 while
    p^-1 falls. This decides clause (ii) of the falsification criterion in the
    convention derivation.md section 2.4 itself calls natural, and it is the same
    vectorized code already written for arm C.

  relationship_to_prior_records: >-
    ECFG-P1543 (R0 and R1, ledger/FINDING-PF-IC-001.md): terminal inconclusive on
    audited global-lift routes, with a recorded Xedni fixed-arity density control
    ("The Xedni C_0/p theorem reconstructs only under Lang, its
    discriminant-height comparison, and fixed arity 2<=r<=9; growing correlated
    bases remain open"). EXP-XEDN-002 is WEAKER than and largely DISJOINT from
    that record: it is a toy-scale exact count of a square density in one
    function-field family, not a theorem about lift routes, and it neither closes
    anything P1543 left open (structured nonlinear defect sections, growing
    correlated bases) nor adds an audited route. It must not be presented as
    strengthening, completing, or superseding P1543, and P1543's scope must not be
    edited by this batch. ECFG-P1547 (R0 and R1): terminal inconclusive on
    prime-to-p jet coordinates - a different mechanism entirely (finite-order
    deformations, not elliptic surfaces); the only relationship is that both are
    lifting-adjacent, and none of P1547's statements is touched. KN-LIT-020: the
    xedni proposal itself; the frozen family and monic slot shape are not its
    construction (which chooses the curve THROUGH prescribed points with
    Mestre-style rank control), and the uniform measure used here is the
    complement of that construction, so nothing here transfers to it. KN-LIT-021:
    the authoritative refutation, by an absolute bound on relation coefficients.
    EXP-XEDN-002 is CONSISTENT WITH but is NOT evidence for KN-LIT-021: it
    measures a different quantity by a different mechanism in a different
    setting. Presenting alpha = 3 as internal confirmation of JKSST would
    double-count the literature. The honest joint statement is that the negative
    content of this route still lives in KN-LIT-021, that the function-field
    variant's distinctive claim (larger, computable Mordell-Weil ranks) has still
    not been tested, and that a scoped negative here does not move the
    lifting-route frontier recorded in FINDING-PF-IC-001.

  scope_limits:
    - >-
      Toy scale only: closed forms evaluated at p <= 809 (10 bits), exhaustive
      verification at p <= 13. Nothing here is about cryptographic curves.
    - >-
      One surface family (a = 0, deg b = 6 exactly), one section shape (x monic of
      degree 2, deg y <= 3), one predicate, one measure (uniform).
    - >-
      No Mordell-Weil rank, height pairing, torsion, relation, or cost model is
      established by the experiment; the red-team probes that touch these are
      scratch probes with no run record and confer no evidence status.
    - >-
      My own probe results (the deg a <= 4 closed form, the constructed-measure
      counts, the mu_3 dependence, the height/E_8 reading) are red-team analysis,
      not measurements of record. They may guide the next contract; they may not
      be cited as evidence.

