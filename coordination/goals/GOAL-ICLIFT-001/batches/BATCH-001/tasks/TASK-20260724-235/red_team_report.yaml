      test_performed: >-
        Cross-read the committed control_3_smoke_consistency verdict against the
        research-direction text.
      outcome: >-
        A genuine correction that this experiment earns, in the direction of
        making the ledger less confident rather than more.
      implication_for_claim: >-
        The decision should record this correction as a NEW record (AGENTS.md rule
        4), rather than leaving the "already visible at toy scale" reading
        standing. It is also a caution about the closure: the same appetite for
        reading a scarcity story into a low-power measurement is what would turn
        this exact result into an over-broad closure.

