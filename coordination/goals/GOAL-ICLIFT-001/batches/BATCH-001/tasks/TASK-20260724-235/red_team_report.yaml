red_team_report:
  id: RT-20260724-001
  task_id: TASK-20260724-235
  role: red-team
  target_task_id: TASK-20260724-229
  target_experiment_id: EXP-XEDN-002
  target_hypothesis_id: H-XEDN-001
  snapshot_commit: 9f9186c65257aa30458c56d435bc6289e6aaeed7
  snapshot_verification: >-
    Receipt coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/
    TASK-20260724-231/snapshot-receipt.json records parent_sha 68e375f720123d4f
    46b1b5bc686920d77bf5ecf4 and leaves commit_sha null (it is committed inside
    the commit it describes; the sha is recorded in
    coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/dispatch_queue.json and
    the commit is reachable from HEAD). `git diff 9f9186c -- experiments/
    EXP-XEDN-002 experiments/EXP-XEDN-001` is empty, so the artifacts reviewed
    here are the committed snapshot. The working-tree-only task directories
    TASK-20260724-232/233/234 were deliberately not read.
  claim_under_review: >-
    That the exact census settles the EXP-XEDN-001 phase-2 gate against
    H-XEDN-001 and supports reject_scoped of H-XEDN-001 plus the closure branch
    (ECFG-NR-1518) of the EXP-XEDN-001 contract.
  overall_position: conclusion_requires_narrowing
  position_summary: >-
    The arithmetic is right, the verdict against H-XEDN-001 as literally written
    is right, and it cannot be overturned: P_lift = (1 - 2/p + p^-3)/(2p^3), so
    alpha = 3 and alpha < 1/2 is false. But three of the things a closure would
    be read as settling were not measured. (a) The family is entirely j = 0 and
    iso-trivial, which is exactly the class candidate B2 excluded, so this is not
    a closure of B2 and H-XEDN-001's own assumption that iso-trivial surfaces are
    excluded is unsatisfiable for the family it names. (b) The measure is uniform
    over surfaces, while xedni constructs the surface through prescribed points;
    a red-team probe builds an in-family surface with the target fibre and a
    prescribed section with success rate 1.0000 at p = 5..101, against a
    uniform per-slot rate of 4.76e-07 at p = 101. (c) The clause-(ii)
    multi-section verdict is convention-dependent: the free-x histogram already
    inside RUN-XEDN-002-C gives P[>= 9 slots] = 7.89e-03 at p = 7 and 8.82e-03
    at p = 13 (rising, gap to p^-1 closing), which analysis.md never reports.
    A red-team probe also shows the exponent is NOT an artifact of j = 0: the
    non-isotrivial family deg a <= 4 gives alpha = 3 exactly as well.

  objections:
    - id: RT-1
      severity: fatal
      scope_of_fatality: >-
        Fatal to reading the result as a closure of candidate B2 or of "the
        function-field xedni census". NOT fatal to the exact number, and not
        fatal to rejecting H-XEDN-001 as literally written.
      target: >-
        research_directions_20260718.md line 414 (candidate B2 "Target family"):
        "excluded: constant/iso-trivial surfaces, anomalous or supersingular
        specializations, j=0/1728 (extra sections may confound controls)"; versus
        experiments/EXP-XEDN-002/execution-report.yaml control_4_isotriviality:
        "EVERY surface in the family is iso-trivial, because a(t) = 0 forces
        j = 1728*4a^3/(4a^3 + 27 b^2) = 0 identically".
      objection: >-
        The frozen family is precisely the class the originating research
        direction excluded, and the confound B2 named ("extra sections may
        confound controls") is not hypothetical: it is measured. Every per-surface
        quantity oscillates with p mod 3 because the j = 0 curve carries the
        order-3 automorphism x -> zeta x for p = 1 mod 3. Three further
        mismatches with B2 compound this: B2's mechanism wants a RANK-1 surface,
        whereas this family generically has geometric Mordell-Weil rank exactly 8
        (six irreducible type-II fibres from a squarefree degree-6 b, smooth fibre
        at infinity, so sum_v (m_v - 1) = 0 and r = rho - 2 = 8) and its counted
        sections are its height-2 lattice roots; B2's minimal falsifying
        experiment specifies surfaces "y^2 = x^3 + a(t)x + b(t)" with a present
        and sections "x(t) = x_0 + x_1 t" of degree <= 1 and NOT monic; and
        H-XEDN-001 lists as an assumption ("Iso-trivial surfaces are detected and
        excluded from census counts") a condition that is unsatisfiable for the
        family it itself fixes, as both the executor and the validator confirmed.
        A hypothesis was therefore tested with one of its own named assumptions
        void, and the EXP-XEDN-001 contract is internally inconsistent between
        its constraint "iso-trivial surfaces must be detected and excluded from
        census counts" and its deliverable "section census ... with deg-2 monic
        sections" on the a = 0 family.
      test_performed: >-
        Document comparison against the committed snapshot, plus the structural
        rank/fibre-type argument, plus red-team probe 2 which exhibits the mu_3
        orbit structure explicitly on an in-family p = 13 surface (5 orbits of
        size 3 among 15 free-x sections, each orbit summing to the zero section).
      outcome: >-
        The census is an exact answer about a family the originating direction
        ruled out, in the maximal-rank rather than the rank-1 regime, with a
        section shape B2 did not specify, under an assumption that cannot hold.
      implication_for_claim: >-
        The record must be titled by the family and the measured quantity, never
        as a closure of candidate B2 or of "the function-field xedni census". The
        decision must state that H-XEDN-001 is rejected AS POSED with a recorded
        assumption defect (the iso-triviality exclusion is unsatisfiable for its
        own family), and that ECFG-NR-1518's scope names that defect. Either
        "rejected_scoped with recorded formalisation defect" or "superseded by a
        corrected hypothesis on a non-isotrivial family" is defensible; a bare
        "rejected" is not.

    - id: RT-2
      severity: scoping
      target: >-
        experiments/EXP-XEDN-002/analysis.md section 8.1(a) and (d): "(d) a(t) = 0
        removes exactly the parameters that the prescribed-target count needs".
      objection: >-
        The obvious counter-attack to RT-1 is that the exponent itself might be an
        artifact of a(t) = 0, leaving alpha unknown for the family B2 wanted. I
        tested this rather than asserting it, and it is false: the general
        NON-ISOTRIVIAL rational elliptic surface family gives the same exponent.
      test_performed: >-
        Red-team probe 1 (/tmp scratch, not a run record). Derived the exact
        closed form for {deg a <= 4, deg b = 6 exactly, x monic quadratic, frozen
        predicate}: for fixed (a, x) the hit count is Q_v with v = 1 + a_4, where
        2Q_v = (p-1)(p^3-2p^2+1) for v a nonzero square, (p-1)(p^3+1) for v a
        non-residue, and (p-1)(p^3-p^2) for v = 0; summing,
        sum_v Q_v = (p-1)^2 (p^3+1)/2 and
        P_slot = (p-1)(p^3+1)/(2 p^7) = (1 - 1/p)(1 + p^-3)/(2 p^3).
        Verified Q_v against brute-force enumeration of every y of degree <= 3
        with an independent gcd(y, y') squarefreeness test at p = 5, 7, 11 (21
        cases, exact agreement, and at v = 1 it reproduces the frozen family's
        Q(p) = 152, 738, 5450); verified sum_v Q_v at p = 5, 7, 11, 13, 101; and
        verified the per-(a, x) count by EXHAUSTIVE complete-b-marginals with the
        frozen is_square_poly at p = 5 (62,500 b each) and p = 7 (705,894 b each)
        for one degree-4 a in each of the three v-classes: hits
        152/252/200 at p = 5 and 738/1032/882 at p = 7, all exactly equal to Q_v.
      outcome: >-
        Limiting alpha = 3 exactly with constant 1/2 for the non-isotrivial
        family; alpha_eff = 2.992943, 2.996601, 2.998275 at
        101->211, 211->431, 431->809 (frozen family: 2.985781, 2.993178,
        2.996544). The formula also coincides exactly with derivation.md
        section 1.7's a = 0 free-x formula at all eight sizes. This is a fourth
        exact confirmation of Lemma D2's marked counting heuristic, in the
        configuration A = 4, B = 6, d = 2, e = 3 (c_slot = 3), beyond the three
        tabulated in derivation.md section 2.3.
      implication_for_claim: >-
        The iso-triviality defect is a defect of REPRESENTATIVENESS, not of the
        exponent. The Coordinator may record that a red-team probe indicates the
        same exponent for deg a <= 4 and that this makes a successor census cheap
        and predictable; the Coordinator may NOT record the non-isotrivial family
        as measured evidence, because this was a scratch probe with no run record.

    - id: RT-3
      severity: scoping
      target: >-
        experiments/EXP-XEDN-002/analysis.md section 4: "at every computed size
        P[>= 9] <= p^{-1}; at p = 13 it is smaller by a factor of 5.7e4".
      objection: >-
        That factor is a monic-convention artifact, and the run record already
        contains the other convention's numbers without reporting them. In
        runs/RUN-XEDN-002-C/raw-result.json, free_x_frozen_semantics gives
        P[>= 9 slots] = 5572/705894 = 7.893536e-03 at p = 7 and
        510588/57921708 = 8.815141e-03 at p = 13 versus p^-1 = 0.142857 and
        0.076923: a factor of 18 and 8.7, not 5.7e4. Worse for the closure, the
        value RISES with p while p^-1 falls, so the ratio to p^-1 doubles from
        0.0553 to 0.1146; in the point convention it goes from 0.0913 to 0.1788.
        The free-x shape is the one derivation.md section 2.4 itself identifies as
        the natural integral-section shape of a rational elliptic surface
        (c_surf = 0). Neither analysis.md nor execution-report.yaml states any of
        these four numbers. Additionally every per-surface quantity is dichotomous
        in p mod 3 (the event is identically zero at p = 5, 11 and positive at
        p = 7, 13), only two sizes per residue class were computed, and only one
        of the four contracted sizes (211) is 1 mod 3, so no decay statement about
        any per-surface quantity is supported by four sizes.
      test_performed: >-
        Recomputed the ratios directly from the committed
        runs/RUN-XEDN-002-C/raw-result.json.
      outcome: >-
        Clause (ii) of the falsification criterion is met in the monic convention
        and is undetermined in the free-x convention, where the trend at the two
        available p = 1 mod 3 sizes points the wrong way for the closure.
      implication_for_claim: >-
        Any recorded multi-section sentence must name the convention and must
        quote the free-x figures alongside the monic ones. "P[>= 9 sections]
        decays faster than p^-1" must not be recorded in any convention: the
        event is empty at three of four sizes in the monic convention (so no rate
        exists, as the executor says) and rises in the free-x convention.

    - id: RT-4
      severity: fatal
      scope_of_fatality: >-
        Fatal to reading arm C as closing the multi-section or relation-source
        form of the route. Not fatal to the histogram itself.
      target: >-
        ledger/hypotheses/H-XEDN-001.yaml prediction 2: "the multi-section
        requirement implied by the Shioda-Tate rank bound r <= 8 for a rational
        elliptic surface, since a relation among specialized sections needs
        s >= r + 1"; and analysis.md section 4's use of "P[>= 9 slots]".
      objection: >-
        r <= 8 is correct for this family, but the inference from s is wrong in
        both directions, and the metric is a bounded-height window rather than a
        property of the group. (i) s >= r+1 is SUFFICIENT for guaranteed
        dependence, not NECESSARY for existence: a surface whose rational
        sections span rank 2 already has a relation among 3 sections. (ii) The
        guaranteed pigeonhole relation can be vacuous: among {S, 2S, ..., 9S} it
        is 2S + (-2S) = O, which specialises to "2P = 2*P". (iii) The counted
        objects are not independent. For p = 1 mod 3 the j = 0 automorphism
        w : (x,y) -> (zeta x, y) satisfies 1 + w + w^2 = 0, so each mu_3 orbit of
        three DISTINCT counted sections is dependent with coefficients (1,1,1),
        and the specialised relation P + wP + w^2 P = O holds at every point of
        every smooth j = 0 fibre: it is a tautology with zero discrete-log
        content. (iv) The count is not a count of sections of the surface: once
        the rank is >= 1 there are infinitely many distinct sections, all of
        higher degree than the frozen shape. The attack-relevant quantity, the
        rank and the relation coefficients, was not computed
        (execution-report.yaml: "No Mordell-Weil rank, height pairing, or torsion
        computation was performed"), even though candidate B2 names the
        height-pairing Gram matrix as its retained information.
      test_performed: >-
        Red-team probes 2, 2b and 4. Built an in-family p = 13 surface
        (x* = t^2+2t+3, y* = 2t^3+t+1, b = y*^2 - x*^3 = [0,0,3,12,9,7,3],
        deg b = 6 exactly), implemented the group law over the rational function
        field F_13(t), and: verified S + wS + w^2 S = O; verified
        P + wP + w^2 P = O on all 4,788 affine points of all smooth fibres at
        p = 7, 13, 31, 61 with zero exceptions; computed 2S..12S, all distinct,
        none torsion, with deg num x(nS) = 2n^2 exactly; grouped this surface's
        15 free-x sections into 5 mu_3 orbits of size 3, each summing to O; and
        exhaustively searched {-1,0,+1} relations among the 5 orbit
        representatives, finding exactly one further relation
        (R_1 + R_3 + R_4 = O).
      outcome: >-
        On a surface the free-x convention credits with 15 sections, the span has
        rank at most 4 and every relation found has coefficients in {-1, 0, +1}.
        The monic convention undercounts distinct sections (4 of 15 here);
        the free-x convention overcounts independent ones by a factor of about 3.
        Neither number is the attack-relevant quantity.
      implication_for_claim: >-
        No recorded sentence may say the multi-section route, the relation-source
        route, or the Mordell-Weil route is closed. The defensible statement is
        narrower: "surfaces in this family rarely carry 9 distinct sections of
        this one bounded-height degree shape in the monic slot convention". The
        distinct-vs-independent caveat must be carried into the decision record,
        not left in the executor's boundaries.

    - id: RT-5
      severity: fatal
      scope_of_fatality: >-
        Fatal to any recorded sentence of the form "the function-field xedni lift
        is rare / collapses / is closed". Not fatal to the exact per-slot number.
      target: >-
        ledger/hypotheses/H-XEDN-001.yaml: "the probability that a uniformly
        random (surface, x-slot) pair admits a section"; and derivation.md
        section 2.6 case 6: "On a structured subfamily the lift probability can be
        1 by construction (b := y^2 - x^3). The xedni construction *is* such a
        structured choice, so Lemma D1/D2 do not close it".
      objection: >-
        P_lift is computed against the uniform measure on the family. Xedni does
        not sample surfaces: it constructs one through prescribed lifted points
        (KN-LIT-020: "lifts several points from E(F_p) ... and chooses a curve
        E/Q through them"), which is why KN-LIT-021's refutation is about
        RELATION COEFFICIENT SIZE and not about scarcity. The one-line concession
        in section 2.6 understates how much of the question it gives away: the
        constructed measure is not merely non-uniform, it makes the m = 1 event
        certain and cheap, and it stays abundant for m = 2 and 3.
      test_performed: >-
        Red-team probe 3. (a) For every target curve Y^2 = X^3 + B_0 over F_p and
        every affine point (X_0, Y_0) on it, set x := t^2 + t + X_0 and
        y := c t^3 + Y_0 with c^2 != 1 and b := y^2 - x^3; then deg b = 6 exactly
        (inside the census family), b(0) = B_0 (the fibre at t_0 = 0 IS the target
        curve), and (x, y) is a section through the prescribed point. Attempted
        for all (B_0, point) pairs at p = 5, 7, 11, 13, 101: 25, 49, 121, 169,
        10201 constructions, zero failures, success rate 1.0000. (b) Exact count
        of frozen-family configurations with the fibre and m prescribed points
        fixed, per prescription: m = 1 gives exactly p^3(p-2) (374, 1713, 11978
        measured at p = 5, 7, 11), i.e. Theta(p^4) and GROWING; m = 2 gives 17.2,
        200.9, 168.4; m = 3 gives 0, 62.45, 5.236 (strongly p mod 3 dependent,
        so no exponent, but nowhere near zero).
      outcome: >-
        The quantity that decides the attack is 1.0000 at m = 1 and grows like
        p^4 in configuration count, while the measured quantity decays like
        p^-3. Both are exactly right; they are answers to different questions.
      implication_for_claim: >-
        Every recorded sentence must qualify the measurement as "uniform-measure
        per-slot". A closure of the uniform-measure question licenses nothing
        about the constructed-measure question, and the constructed-measure
        question is the xedni question.

    - id: RT-6
      severity: noted
      target: >-
        derivation.md section 2.5: "dim <= [dim_a + (B+1)] + sum_i (delta_i + e_i
        + 1) - sum_i (M_i + 1) - (2 + m) = dim_a + B - 1 - m - sum_i c_surf,i"
        and "which happens at m >= 6 for the frozen a = 0, B = 6 family".
      objection: >-
        The count charges two fibre-prescription conditions (a(t_0) = A_0 and
        b(t_0) = B_0) even when a is absent. For the frozen a = 0 family only
        b(t_0) = B_0 exists, so the correct dimension is one larger:
        dim = 6 - 2m for monic x and dim = 6 - m for free x. The quoted threshold
        should read m >= 7 (free x) or m >= 4 (monic x), not m >= 6. The error is
        in the direction that makes the obstruction look stronger than the count
        supports.
      test_performed: >-
        Red-team probe 3b, exact configuration counts at m = 1. Monic mean per
        prescription is exactly p^3(p - 2) minus p for the one prescribed point
        with Y_0 = 0 (measured 374, 1713, 11978 at p = 5, 7, 11 against
        375, 1715, 11979), i.e. dim = 4 where the formula gives 3; free-x mean is
        about 0.8 p^5, i.e. dim = 5 where the formula gives 4.
      outcome: >-
        Off-by-one confirmed by exact count in both conventions, specific to the
        a-absent case. The full rational elliptic count (dim = 10 - m, so
        dim <= 1 at m = 9) is correct as written, and the m = 9 sign for the
        frozen family is unchanged (dim = -3 < 0), so the qualitative conclusion
        survives.
      implication_for_claim: >-
        Do not quote the "m >= 6" threshold. If arm D's prescribed-target count is
        cited at all, cite the corrected thresholds and the fact that it is a
        transversality-free parameter count: dim <= 1 at m = 9 is consistent with
        an empty variety and with a positive-dimensional one, so it establishes
        neither that the classical construction exists nor that it does not. The
        executor is right that it is not a no-go; it is also not a
        construction-existence result.

    - id: RT-7
      severity: scoping
      target: >-
        ledger/hypotheses/H-XEDN-001.yaml: "The competing classical prediction,
        inherited from the Jacobson-Koblitz-Silverman-Stein-Teske analysis of
        xedni and from the naive square-density heuristic recorded in the harness,
        is alpha = 3."
      objection: >-
        alpha = 3 is the naive square-density parameter count (7 sextic
        coefficients minus 4 cubic ones), which H-XEDN-001's own mechanism field
        states as such. It is not the JKSST prediction. The ledger records JKSST
        differently in three places: KN-LIT-021 ("an absolute bound on the size of
        the coefficients of any relation the lifted points can satisfy");
        ideas/artifacts/ECDLP-IDEA-005/p1543_global_lift_torsion_defect_gate.md
        ("Random finite points have such a relation with probability
        O(1/p)=O(1/N)"); and research_directions_20260718.md line 428 ("JKSST
        2000: P_lift -> 0 like (log p)^{-Theta(1)} or worse"). Different quantity,
        different measure, different mechanism.
      test_performed: argument only, against the four cited records.
      outcome: >-
        Confirming alpha = 3 confirms the naive codimension count, not the
        literature refutation.
      implication_for_claim: >-
        The decision must not say the census "confirms", "reproduces", or "is
        consistent with the JKSST prediction alpha = 3". Doing so would
        misattribute KN-LIT-021 and would double-count a literature refutation as
        new internal evidence. The defensible sentence is that the exact value
        equals the naive codimension-3 density with constant exactly 1/2.

    - id: RT-8
      severity: noted
      target: >-
        execution-report.yaml what_was_NOT_exhausted and analysis.md section 3:
        frozen-predicate full-space exhaustion at p = 5 and 7 only; 9.9174% and
        3.5503% of the slot space at p = 11 and 13.
      objection: >-
        The contract asked for exhaustive enumeration over the full slot space at
        p in {5, 7, 11, 13}. Two of the four sizes are covered only by complete
        b-marginals for 12 and 6 listed x.
      test_performed: >-
        Read the committed report; checked that arm C's independent full-space
        section fibering (no frozen-predicate call) reproduces N_hit exactly at
        all four sizes, and that 596,268,874 dual classifications produced zero
        disagreements.
      outcome: >-
        The deviation is declared, pre-planned, and mitigated by an
        algorithmically independent method. Residual risk is a frozen-predicate
        anomaly confined to an untested x at p = 11 or 13, bounded by control 1.
      implication_for_claim: >-
        No recorded sentence may say the frozen predicate was exhaustively
        validated at p in {5, 7, 11, 13}; that claim holds at p = 5 and 7.

    - id: RT-9
      severity: noted
      target: >-
        execution-report.yaml DEV-4: "the planted b has degree 5, not 6 ... so the
        planted surface lies OUTSIDE the frozen deg b = 6 census family".
      objection: >-
        The only positive recovery control therefore never exercises the census
        population. There is no in-population planted control anywhere in the
        package.
      test_performed: >-
        Red-team probe 2 constructed one in three lines: p = 13,
        x* = t^2 + 2t + 3, y* = 2t^3 + t + 1, b = [0,0,3,12,9,7,3] with
        deg b = 6 and b_6 = 3; the frozen predicate recovers the planted slot and
        finds 4 monic and 15 free-x slots on it.
      outcome: >-
        The gap is real and trivially cheap to close (the frozen input forced the
        deviation only because y*_3^2 = 1; any y* with y_3^2 != 1 lands inside
        the family).
      implication_for_claim: >-
        Not a reason to withhold the result. Any successor contract must carry an
        in-population planted control, and the decision record should note that
        the population itself has no positive control in this run package.

    - id: RT-10
      severity: scoping
      target: >-
        analysis.md section 8.1: "An exact count removes sampling error only. It
        does not remove model error." and derivation.md section 2.6 case 8 ("The
        cost of *finding* a section when one exists, and the cost of the
        specialisation/descent step: not modelled").
      objection: >-
        The experiment measures the non-binding obstruction. What a function-field
        xedni relation source needs is: (1) a surface whose fibre at t_0 is the
        target with m sections through prescribed points - probability 1 at m = 1
        and abundant at m = 2, 3 (RT-5); (2) a relation among those sections -
        guaranteed once m >= 9 by r <= 8; (3) relation coefficients large enough
        to express a RANDOM discrete log; (4) a cost model for finding (1) and
        (2). The census measures none of these. Step (3) is where the route dies,
        and it is invisible to this experiment: on this family with squarefree
        degree-6 b the fibration has six irreducible type-II fibres and a smooth
        fibre at infinity, so Shioda's height formula h(P) = 2*chi + 2(P.O) -
        sum_v contr_v with chi = 1, contr_v = 0, (P.O) = 0 gives height exactly 2
        for every integral section of the frozen shape: these sections are the
        ROOTS of the Mordell-Weil lattice, which is E_8 when all fibres are
        irreducible. Relations among roots have absolutely bounded coefficients,
        so a specialised relation sum n_i P_i = O with |n_i| <= C expresses only
        O(C^2) of the about p possible logs, i.e. success probability O(1/p) -
        exactly the KN-LIT-021 / ECFG-P1543-R1 C_0/p obstruction, and here it
        needs no Lang height conjecture because the height bound is geometric.
        Escaping it requires sections of height growing with p, precisely the
        class the frozen degree shape excludes.
      test_performed: >-
        Red-team argument, with three numerical consistency checks from probes 2
        and 4: deg num x(nS) = 2n^2 exactly for n = 1..12 (consistent with
        h(nS) = n^2 h(S) and h(S) = 2); the maximum free-x slots per surface
        recorded in RUN-XEDN-002-C are 4, 36, 4, 63, all at most 120 = 240/2 and
        E_8 has exactly 240 roots; and every relation found among the counted
        sections on the probe surface has coefficients in {-1, 0, +1}. Literature
        inputs used WITHOUT re-derivation: Shioda's height formula, rho = 10 for a
        rational elliptic surface, and E_8 as the Mordell-Weil lattice when all
        fibres are irreducible.
      outcome: >-
        The census's p^-3 is not the obstruction that decides the route; the
        coefficient bound is, and it is untested here. This is a red-team argument
        that must not enter the ledger without its own independent audit.
      implication_for_claim: >-
        The decision record must state that this experiment does not bear on what
        would have to be true for a lifting attack to work, and must not be
        joined to ECFG-P1543/ECFG-P1547 as a third leg of a lifting no-go. If the
        Coordinator wants a decisive result on this route, the next theorem
        question is the coefficient bound, not the density.

    - id: RT-11
      severity: noted
      target: >-
        derivation.md section 1.6 and section 0.2: the frozen predicate accepts f
        iff f = y^2 for a nonzero SQUAREFREE y; dropping squarefreeness multiplies
        P_lift by 1.2303 at p = 5 and 1.0100 at p = 101; the y = 0 section adds
        O(p^-4) relative.
      objection: >-
        I looked for a reading of "the surface has a section" under which
        squarefreeness changes the EXPONENT rather than the constant, and found
        none: both predicate deviations are O(1/p) and O(p^-4) relative. The
        predicate-level model error is elsewhere. is_square_poly(x^3 + b) tests
        only INTEGRAL sections at a PRESCRIBED x; for non-integral sections
        (x = u/w^2, y = v/w^3) the correct test is v^2 = u^3 + b w^6, and under
        the reading "this surface has a section" the answer is Theta(1) - at least
        0.353 at p = 5 and 0.395 at p = 11 from the free-x histogram - not
        Theta(p^-3).
      test_performed: >-
        Reproduced Q(p) = 152, 738, 5450 with an independent squarefreeness test
        (probe 1), and read the free-x P[>= 1] values from
        runs/RUN-XEDN-002-C/raw-result.json.
      outcome: >-
        The squarefreeness restriction is a constant-factor issue only, as the
        executor and validator both report. The exponent is carried by the
        quantifier over x, not by the square test.
      implication_for_claim: >-
        The predicate may be described as "exactly the right test for integral
        sections at a prescribed monic x, up to an O(1/p) constant"; it may not be
        described as a test of whether a surface has a section.

    - id: RT-12
      severity: noted
      target: >-
