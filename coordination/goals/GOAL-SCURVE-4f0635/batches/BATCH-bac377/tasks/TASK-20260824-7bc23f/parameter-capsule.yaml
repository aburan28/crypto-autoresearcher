  goal_id: GOAL-SCURVE-4f0635
  question_id: RQ-SCURVE-45cace
  curve: E-222
  produced_by: idea-generator
  produced_at: '2026-08-25'
  status: planning_artifact
  claim_tier: >-
    NO MATHEMATICAL CLAIM. This capsule transcribes and labels sources. No arithmetic was
    executed in this task (the idea-generator role has no Bash and ran no code), so every
    numeric relation below is recorded as a TRANSCRIPTION plus a CHECK TO BE RUN, never as a
    verified fact. No safety, unsafety, vulnerability, or absence-of-vulnerability statement
    is made anywhere in this file.

  # ---------------------------------------------------------------------------
  # 1. PROVENANCE MODEL. Four disjoint tiers. Every value below carries exactly one.
  # ---------------------------------------------------------------------------
  provenance_tiers:
    intake:
      meaning: >-
        User-supplied, unverified intake copied into GOAL-SCURVE-4f0635 / RQ-SCURVE-45cace.
        A PREREGISTERED COMPARISON TARGET ONLY. Not evidence. Never ground truth.
      evidentiary_weight: none
    retrieved_raw:
      meaning: >-
        Read byte-for-byte from the hash-pinned local mirror SAFECURVES-20260825 with the
        Read tool. Cited as "retrieved (staged mirror SAFECURVES-20260825)" plus the file
        sha256 from inputs/SAFECURVES-20260825/source_record.yaml. This producer did NOT
        perform the HTTP retrieval; the mirror was staged by a top-level orchestration
        session (see source_record.yaml why_staged). Label it exactly that way.
      evidentiary_weight: >-
        Retrieved primary text. It establishes WHAT THE SOURCE SAYS. It does not establish
        that what the source says is true, and for E-222 it is not independent of intake
        (see independence_caveat).
    quarantined_summarizer:
      meaning: >-
        Obtained through WebFetch or WebSearch, which in this environment return a
        SMALL-MODEL SUMMARY of the page rather than the page. Confirmed by the coordinator
        to corrupt numeric data (three RFC 7748 constants collapsed to one wrong value;
        cofactor 4 reported as 2; a subgroup order returned with a 64-hex-digit tail where
        the raw text has 56; two fetches of one URL disagreed with each other).
      evidentiary_weight: >-
        NONE FOR DIGITS. No digit string from this tier is transcribed as a parameter value
        anywhere in this capsule. Two agreeing fetches are one summarizer sampled twice and
        are NOT corroboration.
    unretrieved:
      meaning: Source named but not obtained. Recorded with its exact failure mode.
      evidentiary_weight: none

  independence_caveat:
    statement: >-
      E-222 was INTRODUCED IN AND EVALUATED BY the SafeCurves work itself (2013
      Aranha-Barreto-Pereira-Ricardini curve, tabulated by Bernstein-Lange). The goal's
      intake table is a transcription OF the SafeCurves index page. Therefore the staged
      mirror and the intake table are NOT INDEPENDENT SOURCES.
    consequence: >-
      Agreement between them is NOT corroboration of any curve property. It tests exactly
      one thing: whether the intake transcription is faithful to the page it was copied
      from. It carries zero evidential weight about E-222 itself. Any later record that
      cites intake/mirror agreement as confirmation of a criterion is making an unsupported
      claim, and this capsule pre-registers that objection.
    what_would_be_independent: >-
      (a) an independent recomputation from p, d, and the base point inside this program,
      with certificates (that is what audit-plan.yaml specifies); (b) the ABPR 2013
      generation document, byte-verified, which is currently UNRETRIEVED (see
      unretrieved_sources); (c) a third-party parameter database whose bytes are verified
      rather than summarizer-mediated.

