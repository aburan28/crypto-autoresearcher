      source: SC-TWIST (ECDLP security for the twist)
    - text: >-
        Brainpool requires the embedding degree to be much larger, at least (l-1)/100. ...
        SafeCurves takes the overkill approach.
      source: SC-TRANSFER
      note: >-
        SC-TRANSFER states the Brainpool bound and that SafeCurves takes "the overkill
        approach", and the twist section states (l'-1)/100 explicitly. The main-curve
        numeric threshold is therefore read as (l-1)/100 by parallel construction; that
        reading is flagged as an INTERPRETATION, not a quotation, and audit-plan L-TRANSFER
        carries it as an explicit assumption rather than a fact.
    - text: 'D is defined via: if s^2 is the largest square dividing t^2-4p then (t^2-4p)/s^2 is a squarefree negative integer. Define D as (t^2-4p)/s^2 if (t^2-4p)/s^2 mod 4 = 1, otherwise as 4(t^2-4p)/s^2.'
