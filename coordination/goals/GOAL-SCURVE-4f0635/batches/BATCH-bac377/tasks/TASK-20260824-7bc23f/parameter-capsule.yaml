  # ---------------------------------------------------------------------------
  # 5. CONFLICTS AND GAPS
  # ---------------------------------------------------------------------------
  conflicts_with_intake:
    count: 0
    detail: >-
      No disagreement was found between the intake tuple (equation string, modulus sparse
      form, attribution, and all eleven expected_criteria cells) and the corresponding cells
      of the staged mirror. THIS IS THE EXPECTED OUTCOME AND IT IS NOT CORROBORATION: the
      intake row is a transcription of the same SafeCurves pages, so this check tests
      transcription fidelity and nothing else. Zero conflicts here does not raise confidence
      in any curve property by any amount.
    what_this_does_rule_out: >-
      A transcription error between the SafeCurves index page and the goal record. That is a
      real and useful negative, and it is the entire content of this result.

  unresolved_gaps:
    - id: UG-1
      title: The SafeCurves rigidity Comments cell for E-222 is empty upstream
      finding: >-
        SC-RIGID-TXT shows the E-222 row as "fully rigid" with NO comment text, while the
        immediately preceding M-221 row carries a full generation rule: "p is largest prime
        smaller than 2^221; B=1; A > 2 is as small as possible." Consulting SC-RIGID-HTML
        directly shows the E-222 comment cell is genuinely empty upstream - the row is
        <td><p>E-222</p></td><td><p>fully rigid</p></td><td><p></p></td> - so this is NOT a
        text-extraction artifact of the mirror.
      why_it_matters: >-
        The retrieved primary source asserts the strongest rigidity verdict for E-222 while
        supplying no generation transcript for it. Rigidity is the one criterion that is a
        claim about a PROCESS rather than about the parameters, so a missing process
        description leaves the cell unreproducible from the retrieved source alone.
      status: UNRESOLVED
      blocked_by: the unretrieved ABPR 2013/647 full text
      successor_condition: >-
        Stage ABPR 2013/647 by byte-exact retrieval. If it states a deterministic rule,
        audit-plan L-RIGID / D8 can test that rule. If it does not, the honest verdict for
        this program is "generation transcript unavailable", which is a scope statement and
        NOT a finding of manipulation.
      note_on_what_is_still_testable_now: >-
        One component is testable without the paper: whether p = 2^222 - 117 is the largest
        prime below 2^222, which is the direct analogue of M-221's stated rule. See
        audit-plan L-RIGID check C-R1. It has a defined negative.
    - id: UG-2
      title: Mixed page versions across the mirror
      finding: >-
        SC-INDEX declares version 2017.01.22 while SC-FIELD, SC-RHO, SC-TRANSFER, SC-IND and
        SC-LADDER declare 2013.10.13, SC-EQUATION and SC-COMPLETE 2013.10.14, and SC-DISC
        2013.10.29.
      why_it_matters: >-
        The summary table and the per-criterion tables were last edited more than three years
        apart. Any disagreement discovered later between an index cell and a criterion page
        must be adjudicated with the version dates on the record, not silently reconciled.
      status: recorded, no disagreement observed for E-222
    - id: UG-3
