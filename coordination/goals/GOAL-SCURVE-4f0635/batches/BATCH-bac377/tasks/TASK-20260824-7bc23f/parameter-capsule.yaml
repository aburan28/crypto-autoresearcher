      table_column_header: 'Cost for rho above 2^100?'
    - text: >-
        SafeCurves requires the absolute value of this complex-multiplication field
        discriminant D to be larger than 2^100.
      source: SC-DISC
      table_column_header: '|D| above 2^100?'
    - text: 'SafeCurves requires the resulting security level to be at least 2^100.'
