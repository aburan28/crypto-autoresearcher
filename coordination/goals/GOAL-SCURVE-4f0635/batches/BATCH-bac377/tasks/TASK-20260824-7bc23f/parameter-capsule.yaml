    - ref: 'Aranha, Barreto, Pereira, Ricardini, "A note on high-security general-purpose elliptic curves", IACR ePrint 2013/647'
      why_wanted: >-
        The originating specification of E-222 and the only plausible carrier of the
        deterministic generation rule that the SafeCurves "fully rigid" verdict rests on
        (see UG-1). It is the one source that would be INDEPENDENT of the SafeCurves table.
      attempts:
