            Returned title, author list, year and abstract only. Per the quarantine rule
            these are prose metadata, not digits; recorded as quarantined_summarizer and
            used for nothing except naming the paper.
        - method: WebFetch https://eprint.iacr.org/2013/647.pdf
          outcome: >-
            Summarizer reported it could not find E-222 content in the encoded PDF stream.
            The PDF bytes were saved by the tool to a local tool-results path.
        - method: Read (PDF page render) of the saved PDF
          outcome: >-
            FAILED. Tool error verbatim: "pdftoppm is not installed. Install poppler-utils
            ... to enable PDF page rendering." The idea-generator role has no Bash, so no
            text-extraction workaround is available to it.
        - method: WebSearch for the E-222 selection rule
          outcome: >-
            Returned a summarizer narrative that restated E-222 parameters. QUARANTINED and
            NOT TRANSCRIBED. It is not a second source: it is the same summarizer layer.
      status: unretrieved
      successor_condition: >-
        A role with Bash (executor) or a top-level session should curl 2013/647.pdf, record
        bytes+sha256, extract text with the mirror's extract_pdf_text.py, and stage it as an
        input record. Until then the rigidity lane cannot be closed above "unexplained in
        the retrieved source" (see audit-plan L-RIGID).
    - ref: 'SafeCurves Pocklington proof pages, https://safecurves.cr.yp.to/proof/<N>.html'
      why_wanted: >-
        primeproofs.html links one page per proven prime; those pages carry the actual
        Pocklington certificates for p, l, l' and the factors of |D| and l-1.
      attempts:
        - method: none this task
          outcome: >-
            NOT STAGED in SAFECURVES-20260825 (source_record.yaml lists primeproofs.html but
            no proof/*.html). Recorded so the absence is visible rather than inferred.
      status: unretrieved
      successor_condition: >-
        Not blocking. The audit plan REGENERATES Pocklington certificates independently
        (verify.txt documents the algorithm), which is strictly better evidence than
        importing them. The upstream pages would only serve as a cross-check.
    - ref: 'neuromancer.sk standard curve database, E-222 entry'
