  # ---------------------------------------------------------------------------
  # RESULTS OF THE RECONCILIATION
  # ---------------------------------------------------------------------------
  reconciliation_outcome:
    conflicts_between_intake_and_retrieved_sources: 0
    detail: >-
      No disagreement was found between the intake tuple (equation string, modulus sparse
      form, attribution, and all eleven expected_criteria cells) and the corresponding cells
      of the staged mirror.
    independence_warning_restated: >-
      THIS IS NOT CORROBORATION. E-222 was introduced in and tabulated by the SafeCurves work
      itself, and the intake row is a transcription OF those pages, so mirror and intake are
      NOT independent sources. The zero-conflict result establishes exactly one thing:
      transcription fidelity between the SafeCurves index page and the goal record. It raises
      confidence in no curve property by any amount, and any downstream record citing it as
      confirmation would be overclaiming. This objection is preregistered in
      parameter-capsule.yaml independence_caveat.
    unresolved_conflicts_or_gaps:
      - id: UG-1
        summary: >-
          SafeCurves prints "fully rigid" for E-222 with an EMPTY Comments cell, while the
          adjacent M-221 row carries an explicit generation rule ("p is largest prime smaller
          than 2^221; B=1; A > 2 is as small as possible"). Confirmed against rigid.html, so
          it is upstream and not a mirror extraction artifact.
        status: UNRESOLVED
        blocked_by: unretrieved ABPR 2013/647 full text
        why_it_matters: >-
          Rigidity is the one criterion that is a claim about a PROCESS, so a missing process
          description makes the cell unreproducible from retrieved sources alone. It is also
          the only cell in the E-222 row where the source is silent, which is why the plan
          ranks it first for information gain.
        not_a_finding_about_the_curve: >-
          An unretrieved generation document is a gap in this program's sources. It is NOT
          evidence of manipulation, weakness, or anything else about E-222, and no record may
          read it that way.
      - id: UG-2
        summary: >-
          Mixed page versions in the mirror: index.txt declares 2017.01.22 while the criterion
          pages declare 2013.10.13 / .14 / .29. No E-222 disagreement was observed, but any
          future index-vs-page discrepancy must be adjudicated with these dates on the record.
        status: recorded
      - id: UG-3
        summary: No arithmetic executed; all relations pending as checks in audit-plan.yaml.
        status: by design
      - id: UG-4
        summary: >-
          The SafeCurves per-prime Pocklington proof pages (proof/<N>.html) are NOT in the
          staged mirror. Recorded so their absence is visible rather than inferred.
        status: non-blocking - the plan regenerates certificates independently, which is
          stronger evidence than importing them.
    predicted_discrepancy_flagged_in_advance:
      where: audit-plan lanes L-TWIST (sub-check T4) and D2
      statement: >-
        With h = h' = 4, recomputing SafeCurves' own combined small-subgroup-plus-invalid-curve
        model as 0.886*sqrt(l/16) gives log2 of about 107.8, while the retrieved SC-TWIST cell
        prints 2^108.8 for E-222 - a predicted two-bit gap. This is registered BEFORE any
        computation as a modelling question about the SOURCE, not as an error claim and
        certainly not as a security claim. The lane's job is to recover which documented cost
        model reproduces the printed figure, with a stopping rule of at most five models tried.
      why_recorded_here: >-
        If it holds, it applies to every curve in the SafeCurves combined-attack column and so
        transfers to the whole campaign, not just E-222.

  # ---------------------------------------------------------------------------
  # COMPLETION GATE
  # ---------------------------------------------------------------------------
  completion_gate:
    - item: >-
        The parameter capsule distinguishes user intake from retrieved primary or authoritative
        sources and records provenance and unresolved conflicts.
      met: true
      evidence: >-
        parameter-capsule.yaml defines four disjoint provenance tiers (intake,
        retrieved_raw, quarantined_summarizer, unretrieved), tags every parameter with exactly
        one, carries per-file sha256 for all fifteen mirror files read, logs three unretrieved
        sources with exact failure modes, states conflicts_with_intake: 0 with the independence
        caveat attached, and lists four unresolved gaps UG-1..UG-4.
    - item: >-
        The audit plan covers every one of the eleven criteria in the declared category, with a
        certificate or explicit bound, controls, falsifier, budget, and stopping rule.
      met: true
      evidence: >-
        Lanes L-FIELD, L-EQUATION, L-BASE (basic_parameter_requirements); L-RHO, L-TRANSFER,
        L-DISC (ecdlp_security_requirements); L-RIGID, L-LADDER, L-TWIST, L-COMPLETE, L-IND
        (ecc_security_beyond_ecdlp) - matching the goal's criterion_categories exactly. Each
        carries mechanism, quantitative_prediction, certificate_or_bound, controls, budget,
        stopping_rule, falsifier, discriminates_between, and honest_limitation.
    - item: >-
        The plan covers every declared additional diagnostic, or records a concrete reason and
        successor condition for a deferred diagnostic.
      met: true
      evidence: >-
        D1 order factorizations; D2 subgroup/cofactor/invalid-curve confinement; D3
        automorphism/endomorphism-adjusted rho; D4 embedding degree (declared reuse of
        IDEA-20260807-98a970, no duplicate mechanism minted); D5 CM discriminant and conductor;
        D6 model-conversion exceptional sets; D7 scalar/multiscalar formula exceptional-case
        search; D8 deterministic generation transcript. Three components are explicitly
        DEFERRED with reason and successor condition: the d-selection half of L-RIGID/D8
        (blocked on unretrieved ABPR 2013/647), D5's class number (needs Pari/GP or Sage), and
        D8's d-minimality (needs point counting).
    - item: >-
        Positive, parameter-matched negative, and same-shape null controls are explicit and run
        before belief in any later task.
      met: true
      evidence: >-
        Control battery C-BATTERY-1 is declared BLOCKING and runs on the identical code path
        before any E-222 result is interpreted, with the explicit consequence that a
        non-firing positive voids that lane under AGENTS rule 5. Positives: POS-SYN-FIELD,
        POS-SYN-EQUATION, POS-SYN-BASE, POS-SYN-RHO, POS-ANOMALOUS, POS-BN254, POS-P224-TWIST,
        POS-P224-PROCESS, POS-SECP256K1-DISC. Parameter-matched negatives with stated matching
        assumptions AND stated mismatches: NEG-M221, NEG-E382. Same-shape nulls: NULL-RANDD
        (same p, same shape, designer's choice of d removed), NULL-SHUFFLED-L, NULL-SEEDED-D.
        The Anomalous and BN(2,254) rows are labelled positive-control CANDIDATES requiring
        their own sourced transcription and self-check before use, per the goal's claim
        boundary.
      structural_note_worth_the_coordinator_s_attention: >-
        A fact discovered while reading the retrieved tables: in SC-INDEX every listed curve
        passes field, equation, base and rho, so no natural positive control exists anywhere in
        the SafeCurves corpus for those four lanes. Without the synthetic positives declared
        here, four of the eleven instruments would never have been observed to fire and their
        negatives would certify nothing.
    - item: The report states that no curve attack ran and makes no safety or vulnerability conclusion.
      met: true
      evidence: no_attack_statement, no_safety_conclusion_statement, no_computation_statement above.

  constraint_compliance:
    - constraint: Every SafeCurves True/False cell is unverified intake and a comparison target, not evidence
      status: honoured - restated in both deliverables with the extra independence caveat for a SafeCurves-introduced curve
    - constraint: A failure of rigid/ladder/complete/ind is not by itself an ECDLP break
      status: honoured - carried in each of those four lanes' honest_limitation and in the capsule's interpretation_limits
    - constraint: Anomalous and BN(2,254) are positive-control candidates requiring sourced reproduction
      status: honoured - both are labelled CANDIDATES with a transcription-and-self-check precondition in C-BATTERY-1
    - constraint: The diagnostic list is non-exhaustive; additions come through a later scoped handoff
      status: honoured - no diagnostic was invented beyond the eight declared; new observations are recorded as open directions, not as new diagnostics
    - constraint: Infra errors, timeouts and budget stops are operational observations, never mathematical evidence
      status: honoured - stated for the pdftoppm failure, the WebFetch defect, and in every lane's stopping_rule
    - constraint: Retrieve and read sources during this task; record provenance; do not promote recalled references
      status: >-
        honoured with a disclosed limitation. Sources were READ during this task from the
        staged mirror, but this producer did not itself perform the HTTP retrieval and labels
        them exactly as the mirror requires. One genuinely external retrieval (ABPR 2013/647)
        was attempted four ways and failed; it is recorded as unretrieved, and nothing about
        its contents is asserted from memory.
    - constraint: Define positive, parameter-matched negative, and same-shape null controls before interpretation
      status: honoured - C-BATTERY-1 precedes every lane and is declared blocking
    - constraint: Every lane states mechanism, prediction, certificate/bound, budget, stopping rule, falsifier, limitation
      status: honoured for all 11 lanes and all 8 diagnostics
    - constraint: Reuse IDEA-20260807-98a970 rather than duplicating it
      status: >-
        honoured - reuse_declaration names exactly what is reused (EXACT-k and LOWER-BOUND
        certificate formats, three degenerate checks) and what is added (the twist-side
        instance k', and the SC-PRIMEPROOFS hint that converts its expensive factoring step
        into cheap hint-verification whose provenance never enters the proof)
    - constraint: Public parameters and generated controls only; no live private key
      status: honoured
    - constraint: No curve attack, no experiment result, no safety/vulnerability statement
      status: honoured
    - constraint: No provider/backend/endpoint/model containing "Bedrock"
      status: honoured
    - constraint: Write nothing outside write_scope; never git add/commit/push
      status: honoured

  # ---------------------------------------------------------------------------
  # LIMITATIONS
  # ---------------------------------------------------------------------------
  limitations:
    - >-
      NOTHING WAS COMPUTED. The strongest honest description of this task's output is: a
      labelled transcription plus a falsifiable plan. Every quantitative prediction in
      audit-plan.yaml is a preregistration, not a result.
    - >-
      The primary source is not independent of the intake for this curve. Independence enters
      the campaign only when the audit plan's recomputations run, or when ABPR 2013/647 is
      staged.
    - >-
      Novelty was screened only against the three ledger records in read_scope. No grep over
      knowledge/ or ledger/hypotheses/ was performed because the handoff's read_scope is
      authoritative and excludes them. novelty_status for anything internal is therefore
      UNVERIFIED, and a corpus-wide screen is owed before any derived record claims internal
      novelty. As mathematics, every check proposed is routine parameter validation and is
      labelled KNOWN.
    - >-
      The dominated_by statement in audit-plan.yaml was checked against the retrieved frontier
      (SC-RHO, SC-TRANSFER, SC-DISC, SC-TWIST) and IDEA-20260807-98a970's internal list. The
      program's own knowledge corpus was outside read_scope, so internal frontier rows may
      exist that the statement does not cover; this is disclosed rather than left as an
      unchecked null.
    - >-
      Cost figures in the plan are order-of-magnitude estimates for pure-Python big-integer
      arithmetic at 222 bits. They were NOT measured, and any lane may need re-budgeting once
      an executor observes real timings.
    - >-
      The plan reproduces SafeCurves' criteria and cost models. It is not an independent search
      for better attacks, and passing every lane would mean only that recomputation agrees with
      the published cells.

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (proposals only - the Coordinator decides)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - proposed_role: executor
      objective: >-
        Stage ABPR 2013/647 byte-exactly (curl, record bytes and sha256, extract text with
        inputs/SAFECURVES-20260825/extract_pdf_text.py) as an input record, and report whether
        it states a deterministic rule for p and for d = 160102.
      why_first: >-
        It is the only unblock for the one cell where the retrieved primary source is SILENT
        (UG-1), and it is the only route to a source independent of the SafeCurves table.
      blocking_for: [L-RIGID d-selection half, D8]
      budget_estimate: minutes
    - proposed_role: executor
      objective: >-
        Run C-BATTERY-1 followed by the cheap gate lanes in plan order: L-EQUATION, L-RIGID
        C-R1, L-FIELD, L-BASE. Emit one certificate file per lane plus the control-battery
        pass/fail table.
      why: >-
        Under 10 minutes of compute; validates four instruments and unlocks L-COMPLETE, D7 and
        L-LADDER; and C-R1 is the plan's designated first test.
      precondition: >-
        Coordinator approval and a frozen protocol. The control battery must pass before any
        E-222 output of these lanes is interpreted.
    - proposed_role: executor
      objective: >-
        The certificate-heavy lanes: Pocklington chains for p, l, l' (L-FIELD, L-RHO, L-TWIST)
        and the exact-k / exact-k' certificates (L-TRANSFER, D4), consuming the SC-PRIMEPROOFS
        prime list as an untrusted hint.
      budget_estimate: under 30 minutes of CPU in pure Python; materially less with gmpy2
    - proposed_role: validator
      objective: >-
        Independently re-verify every emitted certificate without re-running the producer's
        code, and check the control battery actually fired.
      why: >-
        The certificates were designed to be re-verifiable in tens of modular operations
        precisely so this review is cheap and genuinely independent.
    - proposed_role: red-team
      objective: >-
        Attack the plan's own weak points: whether NULL-RANDD is genuinely same-shape; whether
        the L-TWIST T4 two-bit gap is being explained away rather than resolved; whether any
        lane's "expected" outcome has been written so that it cannot fail; and whether the
        zero-conflict reconciliation is being read as corroboration anywhere downstream.
    - proposed_role: idea-generator or executor
      objective: >-
        Environment upgrade lane - determine whether Pari/GP or Sage can be made available, which
        is the shared precondition for D5's class number and D8's d-minimality.
