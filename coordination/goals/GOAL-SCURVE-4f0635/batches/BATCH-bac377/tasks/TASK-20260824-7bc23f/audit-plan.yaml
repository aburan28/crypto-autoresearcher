audit_plan:
  task_id: TASK-20260824-7bc23f
  goal_id: GOAL-SCURVE-4f0635
  question_id: RQ-SCURVE-45cace
  curve: E-222
  produced_by: idea-generator
  produced_at: '2026-08-25'
  status: proposed_plan_only
  authority_note: >-
    This is a PLAN. It approves nothing, assigns nothing, and moves no hypothesis. Only the
    Coordinator may approve or dispatch any lane below. No lane here was executed.
  companion_artifact: parameter-capsule.yaml (same directory) - all parameter provenance lives there
  reuse_declaration:
    id: IDEA-20260807-98a970
    what_is_reused: >-
      Its embedding-degree audit mechanism verbatim - the EXACT-k certificate (complete
      factorization of N-1 with a primality certificate per factor plus the witness
      p^((N-1)/r_i) mod N per factor), the LOWER-BOUND certificate (k > K certified by K
      modular multiplications, explicitly NOT succinct), and its three degenerate checks
      (p = 1 mod N; N = p; N^2 | #E). Lanes L-TRANSFER and D4 SPECIALIZE that record to
      E-222 and to the twist subgroup l'. No duplicate mechanism proposal is minted.
    what_is_added_here: >-
      The twist-side instance (k' for l'), and the observation that SC-PRIMEPROOFS already
      publishes a candidate prime list for the E-222 block that includes the primes of l-1,
      which converts IDEA-20260807-98a970's expensive Step 4 (factor N-1) into a cheap
      hint-verification. The hint's provenance does not enter the proof: the verifier
      re-derives the product and re-proves each factor, so a wrong hint fails loudly.

  # =========================================================================
  # 0. CONTROL BATTERY - BLOCKING. RUNS BEFORE ANY E-222 NUMBER IS BELIEVED.
  # =========================================================================
  control_battery:
    id: C-BATTERY-1
    binding_rule: >-
      Every control below runs on the IDENTICAL code path used for E-222, in the same
      process, before any E-222 result is interpreted. If any positive control fails to
      fire, every E-222 output of that lane is VOID and is reported as instrument failure
      under AGENTS rule 5 - not as a mathematical result about E-222.
    why_positive_controls_are_partly_synthetic: >-
      A structural fact discovered while reading the retrieved tables: in SC-INDEX every
      single curve listed passes field, equation, base and rho. There is therefore NO
      natural positive control for those four lanes anywhere in the SafeCurves corpus, and
      a plan that used only tabulated curves would be running four instruments that have
      never been observed to fire. Those four lanes get SYNTHETIC positives, constructed
      here, and that is a requirement rather than a convenience.
    positives:
      - id: POS-SYN-FIELD
        object: a composite modulus of the same bit length (e.g. a 222-bit product of two 111-bit primes)
        must_produce: field criterion FALSE
        used_by: [L-FIELD]
      - id: POS-SYN-EQUATION
        object: an Edwards curve over the same p with d a nonzero SQUARE mod p
        must_produce: equation lane flags d square, i.e. the curve is not a COMPLETE Edwards curve
        used_by: [L-EQUATION, L-COMPLETE, D7]
      - id: POS-SYN-BASE
        object: >-
          (a) a point not satisfying the E-222 equation; (b) a genuine curve point of
          composite order 4l rather than prime order l
        must_produce: base criterion FALSE in both cases, for two DIFFERENT stated reasons
        used_by: [L-BASE]
      - id: POS-SYN-RHO
        object: a toy Edwards curve with prime subgroup order near 2^60
        must_produce: rho lane reports approximately 2^30 and flags below-2^100
        used_by: [L-RHO, D3]
      - id: POS-ANOMALOUS
        object: >-
          the SafeCurves "Anomalous" curve (parameters in SC-INDEX / SC-DISC; they must be
          transcribed and self-checked before use, per goal claim_boundary - it is a
          positive-control CANDIDATE, not a verified control, until its own base point and
          order check out)
        must_produce: >-
          additive-transfer flag (l = p) FIRES; disc lane returns D = -11 and flags
          |D| < 2^100; twist-rho lane returns approximately 2^53.2
        used_by: [L-TRANSFER, L-DISC, L-TWIST, D4, D5]
      - id: POS-BN254
        object: the SafeCurves BN(2,254) curve, same transcription-and-self-check caveat
        must_produce: >-
          embedding degree exactly 12; disc lane returns D = -3 and flags |D| < 2^100
        used_by: [L-TRANSFER, L-DISC, D4, D5]
      - id: POS-P224-TWIST
        object: NIST P-224 as tabulated in SC-TWIST
        must_produce: >-
          twist rho approximately 2^58.4 and a FALSE twist verdict; twist cofactor
          factorization 3^2 * 11 * 47 * 3015283 * 40375823 * 267983539294927
        used_by: [L-TWIST, D2]
      - id: POS-P224-PROCESS
        object: NIST P-224 as tabulated in SC-RIGID / SC-LADDER / SC-COMPLETE / SC-IND
        must_produce: >-
          rigid = manipulatable (seed-hash generation); ladder = False; complete = False;
          ind = False
        used_by: [L-RIGID, L-LADDER, L-COMPLETE, L-IND]
      - id: POS-SECP256K1-DISC
        object: secp256k1 as tabulated in SC-DISC
        must_produce: D = -3, |D| < 2^100 flagged
        used_by: [L-DISC, D5]
    parameter_matched_negatives:
      - id: NEG-M221
        object: M-221 (SC-INDEX row; p = 2^221 - 3)
        matching_assumptions_stated: >-
          Same designers (2013 Aranha-Barreto-Pereira-Ricardini), same publication, adjacent
          size (221 vs 222 bits), same pseudo-Mersenne prime style, same order of magnitude
          for l, cofactor 8 vs 4. DIFFERENT in shape (Montgomery vs Edwards) and in cofactor,
          so it is NOT matched for the completeness or ind lanes and is not used there.
        expected: every lane it is used in returns the same verdict as for E-222 (criterion not triggered)
        used_by: [L-FIELD, L-BASE, L-RHO, L-TRANSFER, L-DISC, L-TWIST, L-LADDER, L-RIGID, D1, D2, D3, D4, D5]
      - id: NEG-E382
        object: E-382 (SC-INDEX row; Edwards, p = 2^382 - 105, d = -67254)
        matching_assumptions_stated: >-
          Same family and same designers, same Edwards shape, same cofactor 4, same
          1-point-of-order-2 / 2-points-of-order-4 structure per SC-COMPLETE. DIFFERENT size
          (382 vs 222 bits), so it is NOT matched for any bit-length-sensitive cost figure and
          is used only for shape-sensitive lanes.
        expected: completeness, ind, ladder, model-conversion lanes return identical verdicts
        used_by: [L-EQUATION, L-COMPLETE, L-IND, L-LADDER, D6, D7]
    same_shape_nulls:
      - id: NULL-RANDD
        object: >-
          an Edwards curve over the SAME p = 2^222 - 117 with d drawn uniformly at random
          from the nonsquares mod p, rejecting d in {0,1}. Same field, same shape, same
          completeness precondition; the DESIGNER'S CHOICE of d is the structure removed.
        purpose: >-
          Distinguishes "this measurement detects something specific to E-222" from "this
          measurement returns the same answer for any complete Edwards curve over this p".
        expected: >-
          Shape-determined lanes (equation, ladder, complete, ind, model-conversion,
          formula-exception) return IDENTICAL verdicts to E-222. Order-dependent lanes (rho,
          transfer, disc, twist, D1, D2, D3, D5) return DIFFERENT numbers, and typically a
          non-prime-order group, which is the point.
        interpretation_rule: >-
          Any lane whose verdict for E-222 equals its verdict for NULL-RANDD is measuring the
          shape and the field, NOT the curve. Its E-222 result must be reported with that
          sentence attached. This is the lossy-projection test applied to the audit itself.
      - id: NULL-SHUFFLED-L
        object: >-
          a synthetic 222-bit "curve record" whose l is a random prime of the same bit length
          with no relation to any p+1-t, fed to the rho, transfer and disc cost formulas.
        purpose: >-
          Shows which reported costs are functions of the bit length alone. Predicted: the
          rho figure moves by less than 0.5 in the exponent, i.e. 2^109.8 carries
          essentially no E-222-specific information. Recording that up front prevents a later
          record from citing 2^109.8 as though it were a measured property of this curve.
      - id: NULL-SEEDED-D
        object: >-
          d obtained as H(seed) reduced mod p for an arbitrary seed, rejecting squares.
        purpose: >-
          Same-shape null for the RIGIDITY lane specifically: a curve whose generation
          transcript exists but provides no constraint. The rigidity instrument must classify
          it as manipulatable. If it classifies NULL-SEEDED-D the same way it classifies
          E-222, the rigidity instrument has no resolving power and every rigidity output is
          void.

  # =========================================================================
  # 1. ELEVEN CRITERION LANES
  # =========================================================================
  lanes:

    - id: L-FIELD
      criterion: field
      category: basic_parameter_requirements
      preregistered_target: 'intake cell: true (comparison target, not evidence)'
      source_cell: 'SC-FIELD, E-222 row, "p prime?" = True'
      mechanism: >-
        SafeCurves requires a PRIME field. Re-derive p three ways from independent
        representations in the retrieved text (decimal, hex, and the sparse form 2^222 - 117)
        and require all three to be the same integer; then prove primality.
      quantitative_prediction: >-
        All three representations equal; p is prime; a Pocklington certificate exists whose
        factored part F of p-1 satisfies F^2 > p. Probability of a surprise is not asserted -
        a disagreement between the three representations would be a transcription defect in
        the mirror or in this program, not a fact about the curve.
      certificate_or_bound: >-
        Pocklington certificate for p in exactly the format verify.sage emits (SC-VERIFY):
        base b with b^(p-1) = 1 mod p; for each prime v in the factored part, b^((p-1)/v) - 1
        is a unit mod p; the factored part squared exceeds p. Third-party verification cost:
        omega(F) modular exponentiations, a few dozen. Fallback if the factorization of p-1
        is not reached in budget: a 64-round Miller-Rabin with recorded bases, labelled
        PROBABLE PRIME, never PRIME.
      controls: {positive: POS-SYN-FIELD, negative: NEG-M221, 'null': NULL-RANDD (same p, so field verdict must be identical)}
      budget: 'under 10 CPU-seconds pure Python; under 1 s with gmpy2'
      stopping_rule: >-
        Stop when the certificate verifies, or after 300 CPU-seconds; on timeout record
        PROBABLE PRIME with the Miller-Rabin bases and stop. A timeout is an operational
        observation, never mathematical evidence.
      falsifier: >-
        The three representations disagree, OR any Miller-Rabin round returns composite, OR
        no valid Pocklington certificate exists.
      discriminates_between: >-
        (H1) the mirror's decimal/hex/sparse printings of p are mutually consistent and p is
        prime, versus (H2) at least one printed representation in the retrieved source is
        corrupt. Both outcomes are informative; H2 would invalidate several later lanes and
        must be caught first.
      honest_limitation: >-
        Confirms a field-shape requirement only. SC-FIELD itself notes "Special primes help
        index calculus", so primality of a special prime is not an absence of concern.

    - id: L-EQUATION
      criterion: equation
      category: basic_parameter_requirements
      preregistered_target: 'intake cell: true'
      source_cell: >-
        SC-EQUATION, E-222 row: shape Edwards, x^2+y^2 = 1+160102x^2y^2, "Elliptic?" True with
        printed d(1-d) residue 6739986666787659948666753771754907668409286105635143120250270071885
      mechanism: >-
        Two distinct requirements, tested separately and never merged: (i) ELLIPTIC -
        d(1-d) is nonzero in F_p (SC-EQUATION's stated condition); (ii) COMPLETE - d is not a
        square in F_p (SC-EQUATION: "SafeCurves requires Edwards curves to be complete, i.e.,
        for d to not be a square").
      quantitative_prediction: >-
        d(1-d) mod p equals the printed residue exactly (all 67 digits), and
        d^((p-1)/2) mod p = p-1 (Euler's criterion returning the nonresidue value).
      certificate_or_bound: >-
        (i) the recomputed residue itself, checkable by one multiplication; (ii) the single
        residue d^((p-1)/2) mod p, checkable by one modular exponentiation. Verification cost
        for a third party: about 2 modular operations. This is the cheapest certificate in the
        whole plan.
      controls: {positive: POS-SYN-EQUATION, negative: NEG-E382, 'null': NULL-RANDD}
      budget: under 1 CPU-second
      stopping_rule: single deterministic computation; no retries; no budget escape
      falsifier: >-
        Recomputed d(1-d) differs from the printed residue in any digit, or
        d^((p-1)/2) mod p = 1 (d square, curve not complete).
      discriminates_between: >-
        (H1) E-222's completeness rests on d being a nonsquare, a one-exponentiation fact,
        versus (H2) completeness is being inherited from the SafeCurves table without an
        independent check. Running it moves the program from H2 to H1 at negligible cost.
      honest_limitation: >-
        Nonsquare d certifies completeness of the ORIGINAL Edwards addition law only.
        SC-COMPLETE states explicitly that the dual addition law of 2008
        Hisil-Wong-Carter-Dawson is NOT complete on the same curve. See D7.

    - id: L-BASE
      criterion: base
      category: basic_parameter_requirements
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-BASE, E-222 row, "(x_1,y_1) on curve?" = True, with (x_1,y_1) and its hex form'
      mechanism: >-
        Three independent obligations: (a) hex and decimal forms of x_1 agree; (b) (x_1,y_1)
        satisfies x^2+y^2 = 1+d x^2 y^2 over F_p; (c) the point has EXACT order l - i.e.
        l*(x_1,y_1) is the Edwards neutral element (0,1) AND (l/r)*(x_1,y_1) is not neutral
        for each prime r | l. Since l is prime the second part is one check against the
        neutral element with the point itself.
      quantitative_prediction: >-
        Equation residual is exactly 0; l*P = (0,1); P != (0,1).
      certificate_or_bound: >-
        The scalar-multiplication transcript is not the certificate (it is long). The
        certificate is the pair (equation residual = 0, l*P = (0,1)) with the recomputation
        being 222 Edwards doublings and additions - about 10 ms in Python - so verification
        is cheap enough to be re-run rather than trusted.
      controls: {positive: POS-SYN-BASE (both variants), negative: NEG-M221, 'null': NULL-RANDD}
      budget: under 5 CPU-seconds
      stopping_rule: deterministic; single pass
      falsifier: nonzero equation residual, or l*P != (0,1), or hex/decimal mismatch
      discriminates_between: >-
        (H1) the published base point generates the prime-order subgroup of order l, versus
        (H2) it generates a larger or different subgroup. Under H2 the l used everywhere
        else in the audit would be wrong, so this lane gates L-RHO, L-TRANSFER and D1.
      honest_limitation: >-
        Order-l verification uses l taken from the source. It becomes an independent statement
        only once L-RHO's primality certificate for l and D1's order identity p+1-t = 4l are
        both in hand; until then the three are mutually dependent and must be reported as one
        joint claim.

    - id: L-RHO
      criterion: rho
      category: ecdlp_security_requirements
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-RHO, E-222 row: "Cost for rho above 2^100?" True, "Cost for rho" 2^109.8'
      threshold_verbatim: 'SafeCurves requires l to be at least 2^200.'
      mechanism: >-
        Prove l prime with a Pocklington certificate, then evaluate the source's own cost
        model 0.886*sqrt(l) = sqrt(pi/4)*sqrt(l) and compare its log2 with the printed 2^109.8,
        and compare log2(l) with the stated 2^200 floor.
      quantitative_prediction: >-
        log2(l) is approximately 220.0 and exceeds 200; log2(0.886*sqrt(l)) rounds to 109.8,
        agreeing with the printed cell to within 0.05 in the exponent.
      certificate_or_bound: >-
        Pocklington certificate for l. Its factored part is available cheaply: the E-222 block
        of SC-PRIMEPROOFS lists the primes SafeCurves used, which by verify.sage's rule
        includes all prime divisors of q-1 for each q in the list. Consume that list as an
        UNTRUSTED HINT - trial-divide l-1 by the listed primes, prove each used factor prime
        recursively by the same method, and require F^2 > l. A wrong hint fails the product
        check loudly, so the hint's provenance never enters the proof.
      controls: {positive: POS-SYN-RHO, negative: NEG-M221 (must return 2^108.8), 'null': NULL-SHUFFLED-L}
      budget: 60-600 CPU-seconds pure Python for the recursive certificate; under 30 s with gmpy2
      stopping_rule: >-
        Stop at a verified certificate, or after 900 CPU-seconds, recording PROBABLE PRIME
        with bases. Never report a timeout as a mathematical outcome.
      falsifier: >-
        l composite; or log2(l) < 200; or the recomputed rho exponent differs from 109.8 by
        more than 0.1; or the certificate's F^2 <= l.
      discriminates_between: >-
        (H1) 2^109.8 is a faithful evaluation of 0.886*sqrt(l) for a certified prime l,
        versus (H2) the figure is a size proxy carrying no curve-specific content. NULL-SHUFFLED-L
        settles which: if a random 220-bit prime yields the same exponent to within 0.5, then
        under H2 the cell must never be cited as a property of E-222. The predicted outcome is
        H2, and pre-registering that is the point.
      honest_limitation: >-
        This is SafeCurves' cost model, not an independent cryptanalytic cost model. SC-RHO
        itself states rho is cheaper against multiple targets (square-root effect) and that
        success probability after m additions is about m^2/l, neither of which the single
        number 2^109.8 expresses.

    - id: L-TRANSFER
      criterion: transfer
      category: ecdlp_security_requirements
      preregistered_target: 'intake cell: true'
      source_cell: >-
        SC-TRANSFER, E-222 row: safe against additive True, safe against multiplicative True,
        embedding degree 1684996666696914987166688442938726735569737456760058294185521417406
        annotated "= (l-1)/1"
      reuses: IDEA-20260807-98a970 (mechanism, certificate formats and degenerate checks)
      mechanism: >-
        (a) ADDITIVE: check l != p, and separately p+1-t != p (i.e. t != 1). (b)
        MULTIPLICATIVE: compute k = ord_l(p) exactly via the EXACT-k certificate of
        IDEA-20260807-98a970, using the SC-PRIMEPROOFS hint for the factorization of l-1 and
        verifying it independently. (c) DEGENERATE: p mod l != 1 (else k = 1); l != p;
        l^2 does not divide #E (immediate once #E = 4l is established by D1).
      quantitative_prediction: >-
        k = l-1 exactly, i.e. p is a primitive root mod l, matching the printed cell. This is
        a sharp prediction with a defined negative: any proper divisor of l-1 falsifies the
        printed cell. Corollary prediction: k > (l-1)/100, the Brainpool-style bound
        SC-TRANSFER attributes to the overkill approach.
      certificate_or_bound: >-
        EXACT-k certificate: the complete factorization l-1 = prod r_i^{e_i} with a primality
        certificate per r_i, plus the witness p^((l-1)/r_i) mod l per i; if every witness
        differs from 1 then k = l-1 exactly. Third-party verification is omega(l-1) modular
        exponentiations. If l-1 resists factoring inside budget, fall back to the LOWER-BOUND
        certificate k > K with K = 10^6, and state plainly that verifying it costs K
        multiplications and is NOT succinct.
      controls: {positive: [POS-ANOMALOUS (additive fires), POS-BN254 (k = 12 exactly)], negative: NEG-M221 (k = (l-1)/2), 'null': NULL-SHUFFLED-L}
      budget: 60-900 CPU-seconds depending on whether the l-1 hint verifies
      stopping_rule: >-
        Emit exact k if the factorization verifies within 900 CPU-seconds; otherwise emit the
        K = 10^6 bound (a few seconds) and stop. Mixed exact-and-bounded output is an honest
        outcome, pre-registered here, not a shortfall.
      falsifier: >-
        Any witness p^((l-1)/r_i) mod l equal to 1 (k is a proper divisor, contradicting the
        printed cell); or l = p; or p = 1 mod l; or the hint product != l-1.
      discriminates_between: >-
        (H1) k = l-1, the maximal value, which the source asserts without a published witness,
        versus (H2) k is a proper divisor of l-1. Under H2 the printed cell is wrong and the
        program has found a genuine discrepancy in a primary source - reportable as a
        transcription/computation discrepancy, NOT as a vulnerability, since even a modest
        divisor of a 220-bit number leaves F_{p^k} unrepresentable.
      honest_limitation: >-
        k bounds the pairing route only. A large k says nothing about rho, about the twist, or
        about any attack outside the transfer family, and per IDEA-20260807-98a970's own
        interpretation_limits a bound is not a value.

    - id: L-DISC
      criterion: disc
      category: ecdlp_security_requirements
      preregistered_target: 'intake cell: true'
      source_cell: >-
        SC-DISC: t = 726130336278594909943533816892560; D =
        -6608170350471643616864756015049517704658839381741662384672256723787 =
        -1 * 17 * 53 * 937 * 12569 * 7544066725621 * 5576396455796813 * 14803246073281859780125586623,
        approximately -2^222.0; "|D| above 2^100?" True
      threshold_verbatim: >-
        SafeCurves requires the absolute value of this complex-multiplication field
        discriminant D to be larger than 2^100.
      mechanism: >-
        Recompute t^2 - 4p from the certified p and the printed t; extract the largest square
        divisor s^2; form (t^2-4p)/s^2; apply SC-DISC's mod-4 rule; compare with the printed D;
        verify the printed factorization by multiplication and per-factor primality; compare
        |D| with 2^100.
      quantitative_prediction: >-
        Three sharp, separately falsifiable predictions. (P1) The recomputed D equals the
        printed D digit for digit. (P2) Because |t| is about 2^109.4 and 4p is about 2^224, the
        quantity |t^2-4p| is about 2^224 while |D| is printed as about 2^222.0, so the
        conductor-side factor is predicted to be s = 2 with (t^2-4p)/4 = 1 mod 4. Any other s
        falsifies P2 while leaving P1 possibly intact - the two are independent. (P3) The eight
        printed factors multiply to D and each is prime.
      certificate_or_bound: >-
        A short arithmetic certificate: the integers t^2-4p, s, and D with the identity
        D*s^2 = t^2-4p (or the mod-4 variant) checkable by one multiplication; plus a primality
        certificate per printed factor (all but the last two are small; the 29-digit factor
        needs one Pocklington step). |D| > 2^100 is then a bit-length comparison.
      controls: {positive: [POS-BN254 (D = -3), POS-SECP256K1-DISC (D = -3), POS-ANOMALOUS (D = -11)], negative: NEG-M221 (|D| approximately 2^217.5), 'null': NULL-RANDD}
      budget: 30-120 CPU-seconds
      stopping_rule: deterministic; stop when the identity and all factor primalities verify, or at 600 s
      falsifier: >-
        D*s^2 != t^2-4p; or the factor product != D; or any printed factor composite; or
        |D| <= 2^100; or s != 2 (falsifies P2 only, and is a finding about the conductor, not
        about safety).
      discriminates_between: >-
        (H1) E-222 has a generic-sized CM discriminant, so no small-|D| endomorphism speedup
        is available beyond the negation already inside 0.886, versus (H2) some structure in D
        (a small factor pattern, an unexpected s) exists. Note SC-DISC's own hedge, quoted:
        "there is no evidence of serious problems with either small |D| or large |D|, but the
        security story is more complicated for small |D|." Neither outcome licenses a safety
        statement.
      honest_limitation: >-
        Large |D| is a screen against KNOWN small-discriminant speedups only. SC-DISC states
        that class-number computation, which Brainpool requires, "has not been incorporated
        into SafeCurves"; this lane inherits that gap and does not close it (see D5).

    - id: L-RIGID
      criterion: rigid
      category: ecc_security_beyond_ecdlp
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-RIGID, E-222 row: "fully rigid", COMMENTS CELL EMPTY (confirmed in rigid.html, not an extraction artifact)'
      mechanism: >-
        Rigidity is a claim about a PROCESS, so it cannot be recomputed from (p, d, P). Split
        it into one component that IS checkable now and one that is blocked. CHECKABLE (C-R1):
        SafeCurves states M-221's rule as "p is largest prime smaller than 2^221". Test the
        exact analogue for E-222 by checking that 2^222 - j is composite for every
        j = 1..116, which would make 2^222 - 117 the largest prime below 2^222. BLOCKED: the
        rule for d = 160102 requires the ABPR 2013/647 text, which is UNRETRIEVED
        (parameter-capsule UG-1).
      quantitative_prediction: >-
        C-R1 predicts exactly 116 composites and zero primes among 2^222 - j for j = 1..116.
        A single prime in that range falsifies the conjectured largest-prime rule and is a
        concrete, reportable result about the GENERATION STORY, not about security.
      certificate_or_bound: >-
        116 compositeness witnesses - one Fermat/Miller-Rabin base per j with the recorded
        witness - re-verifiable in about 116 modular exponentiations. Compositeness witnesses
        are genuinely short certificates, unlike primality, so this lane's certificate is
        unusually strong for its cost.
      controls: {positive: POS-P224-PROCESS (must classify as manipulatable), negative: NEG-M221 (its stated rule must re-verify by the same code), 'null': NULL-SEEDED-D (must classify as manipulatable)}
      budget: under 30 CPU-seconds
      stopping_rule: deterministic; 116 tests, no retries
      falsifier: >-
        Some 2^222 - j with j < 117 is prime (rule falsified); OR the instrument classifies
        NULL-SEEDED-D as rigid (instrument void); OR NEG-M221's published rule fails to
        re-verify (instrument void).
      discriminates_between: >-
        (H1) E-222's prime follows the same minimal deterministic rule SafeCurves states for
        M-221, and the empty Comments cell is an editorial omission, versus (H2) the prime does
        NOT follow that rule and the "fully rigid" verdict rests on some other, currently
        unretrieved, rationale. This is the sharpest cheap test in the plan because the two
        hypotheses predict different observations at a cost of 116 exponentiations.
      honest_limitation: >-
        Even a clean C-R1 pass leaves the choice of d = 160102 unexplained from retrieved
        sources. Rigidity CANNOT be closed by this program until ABPR 2013/647 is staged.
        Absence of a retrieved generation rule is NOT evidence of manipulation and must never
        be reported as such.
      deferral_and_successor: >-
        The d-selection half is DEFERRED with the concrete reason above and the successor
        condition in parameter-capsule UG-1: byte-exact staging of ABPR 2013/647.

    - id: L-LADDER
      criterion: ladder
      category: ecc_security_beyond_ecdlp
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-LADDER, E-222 row: "Montgomery ladder?" True, cofactor 2^2'
      mechanism: >-
        SC-EQUATION gives the birational map from Edwards to Montgomery: A = 2(1+d)/(1-d),
        B = 4/(1-d). Compute A and B in F_p from the certified d, check B(A^2-4) != 0 (the
        stated ellipticity condition for the Montgomery model), and check that A^2-4 is a
        NONSQUARE, which SC-COMPLETE identifies as the condition under which the Montgomery
        ladder is complete on a Montgomery curve with a unique point of order 2.
      quantitative_prediction: >-
        A and B exist in F_p (1-d invertible); B(A^2-4) != 0; (A^2-4)^((p-1)/2) mod p = p-1,
        consistent with SC-COMPLETE's report of exactly 1 point of order 2 for E-222.
      certificate_or_bound: >-
        The residues A, B and the single Legendre exponentiation (A^2-4)^((p-1)/2) mod p.
        Verification: about 3 modular operations.
      controls: {positive: POS-P224-PROCESS (P-224 must return ladder FALSE - it is prime order, and SC-LADDER notes Montgomery curves always have order divisible by 4), negative: [NEG-M221, NEG-E382], 'null': NULL-RANDD (must return the SAME verdict; if so the ladder verdict is a property of the shape, not of E-222)}
      budget: under 1 CPU-second
      stopping_rule: deterministic single pass
      falsifier: 1-d not invertible; B(A^2-4) = 0; or A^2-4 a square
      discriminates_between: >-
        (H1) ladder availability follows mechanically from the Edwards shape plus cofactor 4,
        so E-222 shares it with every complete Edwards curve over this p (NULL-RANDD agrees),
        versus (H2) it depends on something specific to d = 160102. The predicted answer is H1,
        and pre-registering it prevents a later record from treating "ladder: True" as a
        distinguishing merit of this curve.
      honest_limitation: >-
        Ladder availability is an implementation-simplicity criterion. Per the goal's claim
        boundaries its failure would not be an ECDLP break, and its success is not a security
        property of the group.

    - id: L-TWIST
      criterion: twist
      category: ecc_security_beyond_ecdlp
      preregistered_target: 'intake cell: true'
      source_cell: >-
        SC-TWIST, E-222 rows: combined attack 2^108.8 (True); l' =
        1684996666696914987166688442938727098634905596057513265952429863687 = 2^220 +
        181532584069648727485883454223111; twist cofactor 2^2; twist rho 2^109.8 (True); twist
        safe against additive True; twist safe against multiplicative True; twist embedding
        degree 842498333348457493583344221469363549317452798028756632976214931843 = (l'-1)/2
      threshold_verbatim: 'SafeCurves requires the resulting security level to be at least 2^100.'
      mechanism: >-
        Four sub-checks, each with its own certificate. (T1) p+1+t = 4l' with l' prime. (T2)
        l' != p (no additive transfer on the twist). (T3) k' = ord_{l'}(p) exactly, with the
        cheap route that SC-PRIMEPROOFS lists (l'-1)/2 as itself prime, so l'-1 = 2 * prime and
        the exact-k' certificate needs only two witnesses. (T4) Re-derive the combined
        small-subgroup-plus-invalid-curve attack cost using SC-TWIST's own worked model
        (compute n mod h by enumeration, n mod h' by enumeration, CRT, then kangaroo on the
        remaining l/(hh')) and compare with 2^108.8.
      quantitative_prediction: >-
        (T1) p+1+t equals 4l' exactly. (T3) k' = (l'-1)/2, matching the printed cell, and
        k' > (l'-1)/100. (T4) with h = h' = 4 the recomputed combined cost is
        0.886*sqrt(l/16) which is log2 approximately 107.8, i.e. TWO BITS BELOW the printed
        2^108.8. THIS DISCREPANCY IS PREDICTED IN ADVANCE and is the interesting part of the
        lane: it means the printed figure uses a different optimization (for example dividing
        by only one cofactor, or bounding the kangaroo differently). The lane's job is to
        recover which model reproduces 2^108.8 and to state it, not to declare the source
        wrong. Either outcome is a result.
      certificate_or_bound: >-
        Pocklington certificate for l'; the identity p+1+t = 4l' (one addition); exact-k'
        witnesses p^((l'-1)/2) mod l' and p^((l'-1)/((l'-1)/2)) mod l'; and for T4 a written
        cost expression with every exponent shown, so a reader can check the arithmetic by
        hand rather than trusting a script.
      controls: {positive: POS-P224-TWIST (must reproduce twist rho 2^58.4 and a FALSE verdict, and the composite twist cofactor), negative: NEG-M221 (twist cofactor 2^2, twist embedding degree (l'-1)/1), 'null': NULL-RANDD (a random complete Edwards curve over this p is predicted NOT to have near-prime twist order; the null must therefore FAIL the twist criterion, which is what shows the criterion has resolving power)}
      budget: 120-900 CPU-seconds, dominated by the l' primality certificate
      stopping_rule: >-
        Stop at verified certificates or at 900 CPU-seconds with PROBABLE PRIME recorded.
        For T4, stop after enumerating at most five documented cost models; if none reproduces
        2^108.8, record the discrepancy with all five models shown and stop.
      falsifier: >-
        p+1+t != 4l'; l' composite; l' = p; k' != (l'-1)/2; or no documented cost model
        reproduces the printed 2^108.8 to within 0.1.
      discriminates_between: >-
        (H1) the printed 2^108.8 is 0.886*sqrt(l/h h') under SC-TWIST's stated combined-attack
        optimization, versus (H2) it uses a different accounting (e.g. only one cofactor
        divided out, or a kangaroo constant other than 0.886). Recovering the exact model is
        necessary before any later record cites this number, and NULL-RANDD tells us whether
        twist security is a designed property here or an accident of the shape. Predicted: it
        is DESIGNED, and NULL-RANDD failing the criterion is the evidence for that.
      honest_limitation: >-
        This reproduces SafeCurves' attack model. It is not an independent search for better
        combined attacks, and SC-TWIST itself notes some twist requirements are "overkill for
        DH on the original curve".

    - id: L-COMPLETE
      criterion: complete
      category: ecc_security_beyond_ecdlp
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-COMPLETE, E-222 row: complete single-scalar True, complete multi-scalar True, points of order 2 = 1, points of order 4 = 2'
      mechanism: >-
        (a) Completeness of the Edwards addition law reduces to d nonsquare (2007
        Bernstein-Lange, as stated by SC-EQUATION and SC-COMPLETE) - already certified in
        L-EQUATION, reused rather than recomputed. (b) Independently ENUMERATE the small
        torsion: solve for all points of order 2 and order 4 on the Edwards model directly
        (order-2 points on a complete Edwards curve are found by solving the defining
        equations, not by scalar multiplication), and count them.
      quantitative_prediction: >-
        Exactly 1 point of order 2 and exactly 2 points of order 4, matching the printed cells;
        combined with cofactor 4 this predicts a CYCLIC group of order 4l - a structural claim
        with a defined negative (finding 3 points of order 2 would mean full 2-torsion and a
        non-cyclic group, contradicting both the printed cell and h = 4 with a unique 2-torsion
        point).
      certificate_or_bound: >-
        The explicit coordinates of every point of order dividing 4, each with its verified
        order. That is a list of at most 4 points and is fully re-verifiable in microseconds -
        a much stronger artifact than the boolean cell it replaces.
      controls: {positive: POS-SYN-EQUATION (d square: the completeness claim must FAIL) and POS-P224-PROCESS (short Weierstrass: complete = False), negative: NEG-E382, 'null': NULL-RANDD (must return the identical verdict - completeness is shape-and-nonsquare-determined)}
      budget: under 5 CPU-seconds
      stopping_rule: deterministic enumeration; single pass
      falsifier: torsion counts differing from (1,2); or d square
      discriminates_between: >-
        (H1) the group is cyclic of order 4l with a unique 2-torsion point, versus (H2) the
        2-torsion is full. H2 would change the small-subgroup analysis in D2 and contradict
        L-LADDER's nonsquare A^2-4 prediction, so the two lanes cross-check each other -
        that mutual constraint is the reason both are worth running.
      honest_limitation: >-
        SC-COMPLETE states explicitly that completeness of a curve does not guarantee
        completeness of every addition law on it, naming the dual addition law as a
        counterexample. This lane's True therefore means "a complete law EXISTS", not "all
        laws used in practice are complete". D7 addresses the gap.

    - id: L-IND
      criterion: ind
      category: ecc_security_beyond_ecdlp
      preregistered_target: 'intake cell: true'
      source_cell: 'SC-IND, E-222 row: True, note "Elligator 2: Yes."'
      mechanism: >-
        SC-IND states Elligator 2 works for any odd prime and any curve y^2 = x^3+Ax^2+Bx with
        AB(A^2-4B) nonzero, includes all Edwards curves except x^2+y^2 = 1-x^2y^2, and more
        generally all curves with points of order 2 except j-invariant 1728. Reuse the A, B
        from L-LADDER, check AB(A^2-4B) != 0, check d != -1, compute the j-invariant and check
        j != 1728 (and record j != 0 for D3). Separately test the Elligator 1 preconditions
        stated on the same page: p = 3 mod 4 and d of the form -(c+1)^2/(c-1)^2 with c = 2/s^2.
      quantitative_prediction: >-
        Elligator 2 applies (all three conditions hold). For Elligator 1, p = 2^222 - 117 is
        predicted to be 3 mod 4 (since 2^222 = 0 mod 4 and -117 = 3 mod 4), so the prime
        precondition is predicted to HOLD while the d-form condition is an open solve - and
        SafeCurves' own note says only "Elligator 2: Yes", which is evidence that the E-222
        d-form condition was NOT claimed. Predicting that the d-form solve FAILS, and being
        wrong, would be a small but genuine new fact about this curve.
      certificate_or_bound: >-
        The residues A, B, AB(A^2-4B), j, and p mod 4, plus for the Elligator 1 test either an
        explicit s with c = 2/s^2 and d = -(c+1)^2/(c-1)^2 (a positive certificate, one
        equation to check) or the statement that solving for s over F_p yields no solution,
        which requires a square-root computation and is certified by the nonresidue witness.
      controls: {positive: POS-P224-PROCESS (P-224 must return ind FALSE, "Elligator 2: No."), negative: NEG-E382, 'null': NULL-RANDD (predicted identical Elligator 2 verdict; a DIFFERENT verdict would mean d = 160102 matters, which would itself be a finding)}
      budget: under 10 CPU-seconds
      stopping_rule: deterministic; the Elligator 1 solve is a single square-root attempt
      falsifier: AB(A^2-4B) = 0; or j = 1728; or d = -1; or p != 3 mod 4 (falsifying the stated prediction)
      discriminates_between: >-
        (H1) E-222 supports indistinguishability only through Elligator 2, as the source's note
        implies, versus (H2) it also satisfies the Elligator 1 d-form. Nothing in the retrieved
        source settles H2, so it is an actual open question this program can close cheaply.
      honest_limitation: >-
        Map availability is a protocol-level property. Its failure would not be an ECDLP break
        (goal claim_boundary), and its success says nothing about whether any deployed
        implementation uses such a map correctly.

  # =========================================================================
  # 2. DECLARED ADDITIONAL DIAGNOSTICS - all eight covered
  # =========================================================================
  additional_diagnostics:

    - id: D1
      declared_as: complete curve and twist order factorization with checkable certificates
      mechanism: >-
        Establish #E = p+1-t and #E' = p+1+t and factor both COMPLETELY. Point counting is
        out of reach in pure Python, so the trace is established the way SC-DISC prescribes:
        verify the base point has order l, note that l > 4*sqrt(p) so at most one multiple of
        l lies in the Hasse interval, and conclude that multiple is p+1-t. Then factor:
        predicted #E = 2^2 * l and #E' = 2^2 * l', both already prime-certified in L-RHO and
        L-TWIST.
      quantitative_prediction: >-
        #E = 4l exactly and #E' = 4l' exactly; both factorizations COMPLETE (no unfactored
        composite remains); l/4sqrt(p) is about 2^109 so the uniqueness argument holds with
        enormous margin, and that margin is reported as a number rather than asserted.
      certificate_or_bound: >-
        The Hasse-uniqueness argument written out with the explicit inequality
        l > 4*sqrt(p), plus l*P = (0,1) from L-BASE, plus the two primality certificates.
        Verification cost: one comparison and one scalar multiplication.
      controls: {positive: POS-ANOMALOUS (#E = p, cofactor 1, must be reproduced), negative: NEG-M221 (#E = 8*l), 'null': NULL-RANDD (predicted NOT to factor as small-cofactor-times-prime; this is what shows the property is designed)}
      budget: under 30 CPU-seconds given L-RHO and L-TWIST certificates
      stopping_rule: deterministic
      falsifier: p+1-t != 4l, or p+1+t != 4l', or l <= 4*sqrt(p) (uniqueness argument unavailable)
      honest_limitation: >-
        This CONFIRMS a trace taken from the source; it does not independently COUNT points.
        The distinction must survive into any downstream record: the trace is derived from
        (p, l, base point order) plus a uniqueness argument, not from SEA.
      discriminates_between: >-
        (H1) the printed t is consistent with the published l and base point via the Hasse
        uniqueness argument, versus (H2) it is not - which would mean one of the three
        published values is wrong and would invalidate L-DISC and L-TWIST simultaneously.

    - id: D2
      declared_as: subgroup, cofactor, and invalid-curve confinement costs
      mechanism: >-
        With h = h' = 4 and the torsion structure from L-COMPLETE, enumerate exactly what a
        small-subgroup attack can learn (n mod 4 at most, and only n mod 2 if the unique
        2-torsion point is used) and what a ladder-based invalid-curve attack confines an
        attacker to (the twist, per SC-TWIST's stated dichotomy). Cost out each, then combine
        as in L-TWIST T4.
      quantitative_prediction: >-
        Maximum leakage from the main curve is 2 bits (n mod 4); from the twist a further 2
        bits (n mod 4); total 4 bits, leaving a kangaroo over l/16, i.e. about 2^107.8 - the
        same predicted-and-flagged two-bit gap against the printed 2^108.8 as in L-TWIST.
      certificate_or_bound: >-
        An explicit table: each small-order point, its order, the residue it reveals, and the
        enumeration cost. Fully checkable by hand.
      controls: {positive: POS-P224-TWIST (composite twist cofactor 3^2 * 11 * 47 * 3015283 * 40375823 * 267983539294927 gives a materially larger leak, and the instrument must show it), negative: NEG-M221 (h = 8, h' = 4), 'null': NULL-RANDD}
      budget: under 60 CPU-seconds
      stopping_rule: deterministic enumeration over divisors of h and h'
      falsifier: a point of small order outside the enumerated set; or a leakage larger than 4 bits total
      honest_limitation: >-
        Confinement costs are model-dependent (they assume the attacker learns residues by
        testing candidate AES-GCM decryptions, as SC-TWIST describes). They are not statements
        about any particular protocol or implementation.
      discriminates_between: >-
        (H1) cofactor-4-on-both-sides confines leakage to 4 bits, versus (H2) the twist
        cofactor conceals additional small factors. H2 is what makes NIST P-224 fail, so the
        positive control directly exercises the distinction.

    - id: D3
      declared_as: automorphism- and endomorphism-adjusted rho cost
      mechanism: >-
        The 0.886 = sqrt(pi/4) in SC-RHO already includes the sqrt(2) negation speedup. Extra
        speedups come from larger automorphism groups (j = 0 gives 6 automorphisms, j = 1728
        gives 4) or from small-|D| endomorphisms. Compute j from the Montgomery A, B of
        L-LADDER; compare with 0 and 1728; take |D| from L-DISC.
      quantitative_prediction: >-
        j is neither 0 nor 1728, |D| is about 2^222 (far above 2^100), so the automorphism
        group is {+-1} and the adjusted rho cost equals the unadjusted 2^109.8 with NO
        additional speedup factor. Stated as an exponent: predicted adjustment is 0.0 bits,
        and the falsifier is any nonzero adjustment.
      certificate_or_bound: >-
        The residue j, the two inequalities j != 0 and j != 1728, and the bit length of |D|.
        Three integers.
      controls: {positive: [POS-BN254 and POS-SECP256K1-DISC (both D = -3, j = 0, where the instrument MUST report an available endomorphism speedup - if it reports none, every "no speedup" verdict in the plan is void)], negative: NEG-M221, 'null': NULL-SHUFFLED-L}
      budget: under 5 CPU-seconds
      stopping_rule: deterministic
      falsifier: j in {0, 1728}; or |D| <= 2^100; or a small-degree endomorphism found
      honest_limitation: >-
        Covers automorphism and small-CM speedups that are known and tabulated. It is not a
        search for new endomorphism-based speedups, and its negative result is scoped to the
        known family only.
      discriminates_between: >-
        (H1) the published rho figure needs no discount for E-222, versus (H2) some
        automorphism or endomorphism structure discounts it. Under H2 the discount is at most
        a small constant factor (a fraction of a bit), so even a positive result here does NOT
        move an exponent - that is stated in advance to keep the finding proportionate.

    - id: D4
      declared_as: embedding-degree certificate or explicit search bound
      mechanism: SPECIALIZATION OF IDEA-20260807-98a970 - see L-TRANSFER for the main curve and L-TWIST T3 for the twist
      quantitative_prediction: k = l-1 and k' = (l'-1)/2, both exact, both certificate-backed
      certificate_or_bound: as in L-TRANSFER (EXACT-k, else k > 10^6 with its non-succinct verification cost stated)
      controls: as L-TRANSFER, plus IDEA-20260807-98a970's planted positives (toy BN with k = 12, toy curve with p = 1 mod N giving k = 1, toy supersingular with k = 2)
      budget: shared with L-TRANSFER and L-TWIST
      stopping_rule: as L-TRANSFER
      falsifier: as L-TRANSFER
      honest_limitation: >-
        IDEA-20260807-98a970 records that a lower-bound certificate is NOT succinct - verifying
        k > K costs K multiplications. If the fallback is taken, the record must say so.
      nonduplication_note: >-
        This diagnostic mints no new mechanism. It is the named reuse the RQ requires.

    - id: D5
      declared_as: CM discriminant and conductor structure
      mechanism: >-
        Beyond L-DISC's value check, determine the conductor: the index of Z[pi] in the
        maximal order of Q(sqrt(D)), which is the s (or s/2) extracted from t^2-4p. Report the
        full structure (D, s, D mod 4, squarefreeness of D/gcd-part) and check whether |D|'s
        printed factorization contains any pattern a designer could have targeted (e.g. an
        unusually smooth |D|).
      quantitative_prediction: >-
        s = 2 (as argued in L-DISC P2), D = 1 mod 4, D squarefree, and the largest prime factor
        of |D| is the printed 29-digit factor 14803246073281859780125586623, i.e. |D| is NOT
        smooth. Falsifier for the smoothness sub-claim: |D| turning out B-smooth for
        B <= 10^12, which would be a designer-reachable pattern and worth reporting as a
        rigidity-adjacent observation (NOT as a vulnerability).
      certificate_or_bound: the integers D, s, the identity D*s^2 = t^2-4p, and the factor list with per-factor primality certificates
      controls: {positive: [POS-BN254 (D = -3, conductor structure of a CM-constructed curve, which the instrument must recognize as designed), POS-ANOMALOUS (D = -11)], negative: NEG-M221, 'null': NULL-RANDD}
      budget: 60-300 CPU-seconds
      stopping_rule: stop when the identity and the factorization verify, or at 600 s
      falsifier: identity mismatch; s != 2; D not squarefree in the required sense; D != 1 mod 4
      honest_limitation: >-
        The CLASS NUMBER is not computed. SC-DISC states the Brainpool class-number condition
        "has not been incorporated into SafeCurves" and invokes GRH to relate class number to
        sqrt(|D|). This program does not compute it either, and that is a declared, unclosed
        scope gap rather than a null result.
      deferral_and_successor: >-
        Class-number computation for a 222-bit discriminant is out of reach in pure Python.
        Successor condition: a lane with Pari/GP or Sage available, dispatched separately.

    - id: D6
      declared_as: model-conversion exceptional sets
      mechanism: >-
        The Edwards-to-Montgomery map SC-EQUATION states is x = u/v, y = (u-1)/(u+1) in one
        direction; the inverse and the Montgomery-to-short-Weierstrass map
        x = Bu - A/3, y = Bv are also given there. Each is a birational map with a finite
        exceptional set (denominators vanishing). Enumerate every exceptional point of every
        conversion in the chain Edwards <-> Montgomery <-> short Weierstrass, give each
        point's order, and state which model each is missing from.
      quantitative_prediction: >-
        The exceptional set of the Edwards<->Montgomery map is contained in the points where
        v = 0 or u = -1, all of which have order dividing 4; since L-COMPLETE predicts exactly
        1 point of order 2 and 2 of order 4, the total exceptional set has size at most 4.
        Falsifier: an exceptional point whose order does not divide 4 - which would mean the
        conversion is lossy somewhere a real implementation could reach with a random point.
      certificate_or_bound: >-
        An explicit finite list of exceptional coordinates with verified orders. Re-checkable
        in microseconds. This is a complete enumeration, not a sample, so it carries a FOR ALL
        quantifier rather than a FOR SOME.
      controls: {positive: 'a deliberately mis-specified conversion (wrong sign in A) whose exceptional set must come out different - if it does not, the enumerator is not reading the map it claims to read', negative: NEG-E382 (same shape, predicted identical exceptional-set structure), 'null': NULL-RANDD (predicted identical - the exceptional set is a property of the MAP, not of d)}
      budget: under 30 CPU-seconds
      stopping_rule: complete enumeration; deterministic
      falsifier: an exceptional point of order not dividing 4
      honest_limitation: >-
        Exceptional sets are a property of the FORMULAS as written on SC-EQUATION. A different
        published conversion could have a different exceptional set, so the result is scoped to
        the maps quoted from the retrieved source.
      discriminates_between: >-
        (H1) all conversion exceptions live in the 4-torsion an attacker cannot steer a
        protocol into without also failing the completeness law, versus (H2) some exception is
        reachable at generic points. H2 would be a genuine implementation-relevant observation
        and is exactly why the enumeration is worth doing rather than assuming.

    - id: D7
      declared_as: scalar and multiscalar formula exceptional-case search
      mechanism: >-
        Two parts. (a) PROVED PART: the original Edwards addition law is complete for nonsquare
        d (2007 Bernstein-Lange, per SC-EQUATION/SC-COMPLETE), so the certificate is the
        L-EQUATION nonsquare witness and NO SEARCH IS NEEDED - stating that explicitly is
        better than running a search that cannot fail. (b) SEARCH PART: SC-COMPLETE states the
        dual addition law of 2008 Hisil-Wong-Carter-Dawson is NOT complete on the same curve.
        Solve its denominators for zero over F_p directly (an algebraic solve, not sampling),
        and enumerate the exceptional input pairs. Extend to the multi-scalar setting by
        checking whether any exceptional pair is reachable from the base point by small
        scalars.
      quantitative_prediction: >-
        (a) zero exceptions for the original law, certified, not sampled. (b) a NONEMPTY,
        explicitly enumerated exceptional set for the dual law - predicting nonempty is
        important: an empty result would contradict SC-COMPLETE and would mean the solver is
        wrong, which is a defined negative for the instrument.
      certificate_or_bound: >-
        For (a) a single Legendre witness. For (b) the solved variety of exceptional pairs
        with representative coordinates, each verified by evaluating the denominator.
      controls: {positive: POS-SYN-EQUATION (d SQUARE - the original law must then FAIL somewhere and the searcher must find it; if the searcher cannot find a failure on a curve where one provably exists, all its empty results are void), negative: NEG-E382, 'null': NULL-RANDD (another nonsquare d: the original law must again be exception-free, showing the result tracks nonsquareness rather than d = 160102)}
      budget: 60-600 CPU-seconds
      stopping_rule: >-
        The algebraic solve is deterministic. If it does not close in 600 s, fall back to a
        bounded random search over 10^6 pairs and report it as a BOUND ("no exception found in
        10^6 pairs"), never as absence.
      falsifier: >-
        An exception found for the ORIGINAL law on E-222 (which would contradict the
        Bernstein-Lange theorem and would far more likely indicate an implementation bug -
        the record must say that first); or an empty exceptional set for the dual law.
      honest_limitation: >-
        Covers the two laws SC-COMPLETE names. Real implementations use many other formula
        sets (extended coordinates, w-coordinates, mixed addition), and this diagnostic does
        not audit them.

    - id: D8
      declared_as: deterministic parameter-generation transcript audit
      mechanism: See L-RIGID. The prime-selection half (C-R1) is executable now; the d-selection half is blocked on ABPR 2013/647.
      quantitative_prediction: >-
        C-R1: exactly 116 composites among 2^222 - j, j = 1..116. For d, a MINIMALITY claim of
        the form "d = 160102 is the smallest d meeting conditions X" is stated as CURRENTLY
        UNVERIFIABLE HERE, because deciding it for every smaller d requires the order of each
        candidate curve, i.e. point counting - out of reach without Sage.
      certificate_or_bound: 116 compositeness witnesses (short, strong); no certificate is claimed for d minimality
      controls: {positive: POS-P224-PROCESS, negative: NEG-M221 (its published rule must re-verify), 'null': NULL-SEEDED-D}
      budget: under 30 CPU-seconds for C-R1; d minimality not budgeted because it is not attempted
      stopping_rule: 116 deterministic tests
      falsifier: a prime 2^222 - j with j < 117
      honest_limitation: >-
        An unretrieved generation document is a GAP IN THIS PROGRAM'S SOURCES, not a defect in
        the curve. No record may translate "transcript unavailable" into any suggestion of
        manipulation.
      deferral_and_successor: >-
        DEFERRED half: d-selection minimality. REASON: requires point counting over up to
        160102 candidate curves plus the selection rule itself, neither available. SUCCESSOR
        CONDITION: (1) stage ABPR 2013/647 byte-exactly to learn the stated rule; (2) if the
        rule is stated and is checkable with SEA, dispatch to an environment with Sage or
        Pari/GP. Until both hold, this stays open and is reported as open.

  # =========================================================================
  # 3. PRIORITY AND FIRST TEST
  # =========================================================================
  ranking:
    order: [L-EQUATION, L-RIGID, L-FIELD, L-BASE, L-RHO, L-TWIST, L-TRANSFER, L-DISC, L-COMPLETE, L-LADDER, L-IND, D1, D2, D3, D6, D7, D5, D8]
    rationale: >-
      Ordered by information gained per CPU-second, with instrument-validating lanes first.
      L-EQUATION costs about two modular operations and its nonsquare witness is a PREREQUISITE
      for L-COMPLETE, D7 and the completeness half of L-LADDER, so it buys four lanes for one
      exponentiation. L-RIGID's C-R1 is next because it is the only cheap test in the plan whose
      two hypotheses predict genuinely different observations about something the retrieved
      source does NOT already assert (the Comments cell is empty), so its expected information
      gain is the highest of any 30-second job here. L-FIELD and L-BASE follow because every
      later lane's arithmetic is void if p or the base point is mistranscribed. The primality
      certificates (L-RHO, L-TWIST) are the budget sinks and come after the cheap gates. The
      beyond-ECDLP lanes rank last not because they are unimportant but because they are
      shape-determined and NULL-RANDD is predicted to return the same verdicts, so their
      per-lane information about E-222 specifically is low - which is itself a pre-registered
      prediction rather than a dismissal.
  test_first:
    lane: L-RIGID, check C-R1 (is 2^222 - 117 the largest prime below 2^222?)
    why_cheapest_valid_discriminator: >-
      116 modular exponentiations, under 30 CPU-seconds, no dependency on any other lane, and
      the certificate (one compositeness witness per j) is short and independently checkable -
      compositeness witnesses are succinct in a way primality proofs are not. It is the only
      lane addressing a question the retrieved primary source LEAVES BLANK: SafeCurves prints
      "fully rigid" for E-222 with an empty Comments cell while printing an explicit rule for
      the neighbouring M-221. So unlike every other lane, C-R1's outcome is not already written
      down somewhere in the source we are auditing. Both outcomes are informative: 116
      composites supports the M-221-analogous minimal rule and makes the empty cell an
      editorial omission; a single prime below 117 falsifies that rule and makes the "fully
      rigid" verdict genuinely unexplained from retrieved sources, which is a concrete
      successor-generating result. Neither outcome is a safety statement about the curve.
    what_it_is_not: >-
      It is not an attack, not a security test, and cannot show the curve is safe or unsafe.
      It tests a claim about how a number was chosen.

  # =========================================================================
  # 4. HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # =========================================================================
  honest_accounting:
    objects_considered:
      - object: >-
          THE PUBLISHED CRITERION CELL (a boolean plus a printed figure), tracked from the
          source page through to an independently recomputed certificate.
        lossy_projection_test: >-
          PASSES as lossy: the boolean discards p, d, the base point, l, t and D entirely.
          FAILS the "new object" half: it is the object SafeCurves already tracks, so an audit
          built on it is REPRODUCTION, not a new lens. Stated plainly rather than dressed up.
        verdict: adopted as the audit's object, with no novelty claimed
      - object: >-
          THE CERTIFICATE ITSELF (Pocklington chains, exact-k witnesses, compositeness
          witnesses, torsion enumerations) as the tracked object, replacing the boolean.
        lossy_projection_test: >-
          Genuinely lossy and compatibly so: a certificate discards the search that produced it
          and retains only what a verifier must re-check, and that retained part propagates
          deterministically under third-party re-verification, which is the only operation that
          matters for it. It is not a change of coordinates on the boolean, because the boolean
          is not recoverable from a FAILED certificate in the same way - failure localizes.
        verdict: >-
          adopted as the deliverable form. Novelty within this program: the corpus, as far as
          this task could check within its read_scope, holds no certificate-bearing SafeCurves
          reproduction. NOVELTY_STATUS: UNVERIFIED - see novelty_screen below.
      - object: >-
          THE NULL-CURVE DELTA: the difference between a criterion's verdict on E-222 and on a
          random complete Edwards curve over the same p (NULL-RANDD).
        lossy_projection_test: >-
          Lossy and compatible: it discards everything both curves share (field, shape,
          completeness machinery) and retains only what the designer's choice of d contributed.
          Propagates deterministically because both sides are computed by the identical code.
        verdict: >-
          adopted as an interpretation gate on every lane. It is the plan's answer to "does this
          lane measure the curve or the shape", and it is what stops "ladder: True" or
          "2^109.8" from being cited later as merits specific to E-222.
    dominated_by: >-
      As an ATTACK: n/a - no attack is claimed, designed, or run. As a MEASUREMENT of E-222's
      ECDLP cost, the frontier row this plan is dominated by is the one the retrieved source
      itself states: the rho method at 0.886*sqrt(l), reported as 2^109.8 with negligible memory
      (SC-RHO, retrieved), parallelizable with negligible communication (van Oorschot-Wiener,
      cited by SC-RHO) - and this plan does not improve time, memory, or data against it by any
      amount. As an AUDIT INSTRUMENT, dominated by verify.sage (documented in SC-VERIFY), which
      computes every cell in this plan, has been run since 2013, and has Sage's certified
      arithmetic behind it. This plan dominates verify.sage on nothing except that its outputs
      would sit in this program's ledger with certificates re-verifiable here. Frontier checked
      against: SC-RHO (rho), SC-TRANSFER (additive/multiplicative transfers, MOV/Frey-Ruck),
      SC-DISC (small-|D| endomorphism speedups), SC-TWIST (combined small-subgroup + invalid-curve
      attacks), and internally IDEA-20260807-98a970's dominated_by list (rho at 0.886 sqrt(N),
      BSGS, MOV at small k, the anomalous transfer). NOT CHECKED, and disclosed: the program's
      own knowledge corpus (knowledge/**, ledger/hypotheses/**) was outside this task's
      authoritative read_scope, so rows on the internal frontier may exist that this statement
      does not cover.
    sota_delta: >-
      ZERO on every axis against every attack baseline: this plan mounts no attack and changes
      no exponent. Quantitatively as DATA: the program currently holds zero certificate-bearing
      values for E-222; executing the plan would produce 11 criterion lanes plus 8 diagnostics,
      of which 6 carry certificates verifiable in fewer than 100 modular operations
      (L-EQUATION 2 ops, L-LADDER 3 ops, D3 3 integers, L-RIGID 116 exponentiations, L-DISC one
      multiplication plus small primality, D6 a finite point list), 3 carry Pocklington chains
      (L-FIELD, L-RHO, L-TWIST), and 1 carries an explicitly non-succinct fallback bound if the
      exact route fails (L-TRANSFER, k > 10^6 costing 10^6 multiplications to verify).
      Quantitatively as SCOPE: it converts 11 booleans and 4 printed cost figures from a single
      non-independent source into recomputed values with stated controls - and the honest size of
      that delta is bounded by the fact that the source is authoritative and has been unchallenged
      since 2013.
    closures_enumerated:
      - lane: L-RIGID d-selection half
        obstruction: NO RETRIEVED GENERATION DOCUMENT
        argument: >-
          Rigidity is a property of a process. The only retrieved source asserts the verdict with
          an empty rationale cell (parameter-capsule UG-1), and the originating paper could not be
          obtained: WebFetch is summarizer-mediated and unusable for this purpose, the PDF render
          path failed with "pdftoppm is not installed", and this role has no Bash. This is an
          INFRASTRUCTURE obstruction, an operational observation, and NOT mathematical evidence
          of anything.
        forward_guidance: >-
          Classes that remain: (i) the prime-selection sub-rule, testable now via C-R1; (ii) the
          d-selection rule, once ABPR 2013/647 is staged byte-exactly; (iii) a structural
          smoothness/pattern check on |D| (D5) that is rigidity-adjacent and needs no document.
      - lane: D5 class number
        obstruction: COMPUTATIONAL - class number of a 222-bit discriminant in pure Python
        argument: >-
          SC-DISC states the class-number condition "has not been incorporated into SafeCurves"
          and relates class number to sqrt(|D|) only under GRH. Computing it here is out of
          budget by orders of magnitude.
        forward_guidance: dispatch to an environment with Pari/GP or Sage; the discriminant is already in hand
      - lane: D8 d minimality
        obstruction: POINT COUNTING - deciding minimality needs the order of each candidate curve
        argument: SEA is unavailable in pure Python at 222 bits; a brute-force order computation is infeasible
        forward_guidance: same successor as D5; also, the rule may make minimality checkable over a far smaller candidate set once known
      - lane: none of the eleven criteria
        obstruction: NONE CLAIMED
        argument: >-
          No criterion lane is closed by this plan. Declaring any of them settled before the
          control battery has fired would be premature closure, which this program treats as a
          failure mode symmetric with overclaiming.
    open_directions_next_session:
      - >-
        Stage ABPR 2013/647 byte-exactly and re-open L-RIGID / D8. This is the single highest-value
        unblock in the campaign because it is the only lane where the retrieved source is silent.
      - >-
        Ask whether the two-bit gap predicted in L-TWIST T4 / D2 (2^107.8 recomputed vs 2^108.8
        printed) is a modelling difference or an arithmetic one. Whichever it is, the answer
        determines whether the printed combined-attack figures across the whole SafeCurves table
        can be cited by this program at face value - a result about the SOURCE, not about E-222,
        and therefore transferable to every other curve in the campaign.
      - >-
        Run NULL-RANDD across all eleven lanes for a second curve (E-382, which is shape-matched)
        to test the prediction that the beyond-ECDLP criteria are shape-determined. If confirmed,
        the campaign can stop re-deriving them per curve and say so with evidence.
      - >-
        Record a literature note in knowledge/literature/ for ABPR 2013/647 once retrieved,
        including whether it states a deterministic rule - the ingredient-scouting habit the role
        contract asks for, applicable here even though no exponent-moving idea follows.
    novelty_screen:
      method_actually_used: >-
        Read of the three read_scope ledger records (goal, RQ, IDEA-20260807-98a970) and of the
        staged mirror. NO grep over knowledge/ or ledger/hypotheses/ was performed: the handoff
        declares its read_scope AUTHORITATIVE and does not include them.
      verdict: >-
        NOVELTY_STATUS: UNVERIFIED, and that is the honest label rather than a weakness. As
        MATHEMATICS every check in this plan is routine, standard parameter validation and is
        labelled KNOWN. What is not established here is whether this program already holds an
        equivalent certificate-bearing record; a corpus-wide screen is owed before any record
        derived from this plan claims internal novelty.
      known_prior_art_named: >-
        SafeCurves' own verify.sage (retrieved, SC-VERIFY) computes every cell in the eleven
        lanes. IDEA-20260807-98a970 (internal) already specifies the embedding-degree audit and is
        reused rather than duplicated. Standard parameter validation in SEC1/X9.62 covers the
        embedding-degree and order checks.
