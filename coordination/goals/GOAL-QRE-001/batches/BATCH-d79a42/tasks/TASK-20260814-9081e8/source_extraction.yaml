schema: crypto.autoresearch.lane_b_source_extraction.v1
task_id: TASK-20260814-9081e8
goal_id: GOAL-QRE-001
purpose: >-
  Input side of completion criterion 1 only. Every number below is THAT
  PAPER'S OWN stated figure, tagged with provenance. Nothing here has been
  compared, reproduced or computed against this program's own counts
  (BATCH-973b49 / TASK-20260814-334157). No date, timeline, arrival
  probability or policy statement is recorded, including where a source
  states one.
provenance_tag_definitions:
  from_filed_entry_text: >-
    The KN-LIT entry body quotes the number numerically and the entry is not
    a bulk-seeded, abstract-level entry.
  from_fetched_fulltext: >-
    Recovered by this task from a full-text fetch of the source, with the
    identifier and its location (page/section/table) in that source.
  not_determinable: >-
    Looked for, and not found in the text obtained, with what was looked for
    and why it was not found.

sources:

  - source_id: KN-LIT-099
    citation: >-
      Roetteler, Naehrig, Svore, Lauter, "Quantum Resource Estimates for
      Computing Elliptic Curve Discrete Logarithms", ASIACRYPT 2017 Part II,
      pp. 241-270.
    identifier: "iacr:2017/598"
    fulltext_obtained_this_task: true
    fulltext_fetch:
      url: "https://eprint.iacr.org/2017/598.pdf"
      http_status: 200
      bytes: 791174
      sha256: "27c923cd3330dbaa69ee306d9ebcfa7a768f5c8a81ad03ba274c5dd28260d5d1"
      extraction_tool: "pdfminer.six extract_text"
      stored: "session scratchpad only, not committed to this repository"
    status: >-
      HIGH-CONFIDENCE TARGET. Filed entry (KN-LIT-099) already quotes the
      table numerically and is not bulk-seeded; this task independently
      re-fetched the ePrint PDF and confirms the filed entry's numbers match
      the source text verbatim (Results section). Numbers below are tagged
      from_filed_entry_text where the filed entry already carried them
      numerically, since constraint 5 permits that for this entry; the
      independent fulltext confirmation is noted alongside each.

    gate_set_and_counting_convention:
      value: >-
        Clifford+T at the logical level ("NOT, CNOT and Toffoli gates" for
        design/simulation; "for cost estimation, we use decompositions over
        the Clifford+T gate set" is the convention used by the LATER paper
        KN-LIT-771 -- KN-LIT-099 itself reports Toffoli gate counts directly,
        not decomposed T-counts). Toffoli-gate-network circuits, classically
        simulated for correctness, then counted.
      provenance: from_fetched_fulltext
      location: "eprint 2017/598, Results section and Section 2 (Preliminaries), pp. ~4-5 of the PDF text"

    ancilla_policy:
      value: >-
        States explicitly that "there are always enough ancillas available
        as overall a relatively large number of ancillas must be provided."
        Constant adders documented as using both clean ancilla qubits
        (initialized |0>) and DIRTY ancilla qubits (unknown state, returned
        to the same unknown state at the end) -- e.g. n-1 dirty ancillas plus
        1 clean ancilla for one adder variant. This is NOT the "all clean
        ancillas returned, no borrowed/dirty ancilla" convention this
        program's own frozen counting convention (inherited by lane A)
        specifies -- the two are not directly comparable on this axis
        without restating KN-LIT-099's circuit under the program's own
        convention, which this task does not do (constraint 8).
      provenance: from_fetched_fulltext
      location: "eprint 2017/598, arithmetic-circuit description sections (constant adders, modular multiplication), body text"

    logical_or_physical:
      value: "LOGICAL qubits and gate counts only. No error correction, no physical layer."
      provenance: from_fetched_fulltext
      location: "eprint 2017/598, Results paragraph: 'All counts are for logical qubits in a fault-free model; no error-correction overhead is included' (paraphrased in filed entry; source text states counts are for the Toffoli-network circuit with no fault-tolerant layer discussed)"

    error_correction_model_and_code_distance:
      value: not stated
      provenance: not_determinable
      searched_for: "surface code, code distance, logical error rate, physical error rate"
      why_not_found: >-
        The paper's scope is the logical-circuit layer only; it does not
        model an error-correction scheme, code distance, or physical error
        rate anywhere in the fetched full text.

    cycle_time:
      value: not stated
      provenance: not_determinable
      searched_for: "cycle time, surface code cycle, clock"
      why_not_found: "No fault-tolerant/physical layer is modeled in this paper; no cycle time is stated."

    algorithm_parameters:
      curve_representation: "prime-field, Weierstrass affine coordinates"
      provenance: from_fetched_fulltext
      curves_simulated: "NIST curves P-192 through P-521, plus 110-bit and 160-bit and 224-bit and 384-bit points"
      provenance_curves: from_filed_entry_text
      modular_inversion_method: "reversible Montgomery inverse via the binary extended Euclidean (binary GCD) algorithm"
      provenance_inversion: from_fetched_fulltext
      location_inversion: "eprint 2017/598, Contributions list and inversion-algorithm section"
      modular_multiplication_method: "two variants implemented -- double-and-add and Montgomery multiplication; Montgomery found cheaper"
      provenance_mult: from_fetched_fulltext
      scalar_multiplication_repetitions: "point addition run 2n times sequentially, no additional qubits needed for repetition"
      provenance_scalar: from_filed_entry_text

    logical_qubit_width:
      closed_form: "9n + 2*ceil(log2 n) + 10"
      provenance_closed_form: from_filed_entry_text
      independently_confirmed_in_fulltext: true
      fulltext_location: "eprint 2017/598, Results paragraph, verbatim: 'needs at most 9n + 2(ceil log2(n)) + 10 qubits'"
      value_at_256_bit: 2330
      provenance_256: from_filed_entry_text
      independently_confirmed_in_fulltext: true
      fulltext_location_256: "eprint 2017/598, Results paragraph, verbatim: 'the NIST standardized curve P-256 needs 2330 logical qubits'"

    toffoli_count:
      closed_form_point_addition_alone: "approximately 224 n^2 log2(n) + 2045 n^2 Toffoli gates"
      provenance: from_filed_entry_text
      fulltext_confirmed: true
      fulltext_location: "eprint 2017/598, Results paragraph, verbatim: 'the quantum circuit can be implemented with at most roughly 224n2 log2(n) + 2045n2 Toffoli gates'"
      closed_form_full_shor: "<= 448 n^3 log2(n) + 4090 n^3 Toffoli gates"
      provenance_full: from_filed_entry_text
      fulltext_confirmed_full: true
      fulltext_location_full: "eprint 2017/598, Results paragraph, verbatim: 'The overall number of Toffoli gates is thus about 448n3 log2(n) + 4090n3'"
      value_at_256_bit: 1.26e11
      provenance_256: from_filed_entry_text
      fulltext_confirmed_256: true
      fulltext_location_256: "eprint 2017/598, Results paragraph, verbatim: 'the full Shor algorithm would need about 1.26 x 10^11 Toffoli gates'"

    toffoli_depth_at_256_bit:
      value: 1.16e11
      provenance: from_filed_entry_text
      note: >-
        Not independently re-confirmed word-for-word in this task's fulltext
        pass (the fetched text's Results paragraph gives the qubit and
        Toffoli-count figures verbatim but this task did not locate the
        depth figure in the same paragraph on this pass; the filed entry's
        full simulation table, which does carry it, was read prior to this
        task under citation_verified: read and is not itself bulk-seeded).

    rsa_3072_comparison_figures:
      value: "6146 qubits, 1.86e13 Toffoli gates"
      provenance: from_filed_entry_text
      fulltext_confirmed: true
      fulltext_location: "eprint 2017/598, Results paragraph, verbatim: 'Shor's factoring algorithm for a 3072-bit modulus needs 6146 qubits and 1.86 x 10^13 Toffoli gates'"
      caveat_recorded_in_filed_entry: >-
        The filed entry notes the published Springer version's summary text
        quotes a different RSA-3072 Toffoli figure (1.5e14) than the ePrint
        table (1.86e13); this task did not fetch the Springer version and
        records only the ePrint figure, per the filed entry's own caveat.
        THIS IS A SOURCE-INTERNAL DISCREPANCY, not a criterion-1 reproduction
        result -- recorded as an input-side observation only.

    what_could_not_be_determined:
      - "code distance"
      - "physical error rate / logical error rate"
      - "cycle time"
      - "physical qubit count"
      - "wall-clock time"

  - source_id: KN-LIT-771
    citation: >-
      Haener, Jaques, Naehrig, Roetteler, Soeken, "Improved quantum circuits
      for elliptic curve discrete logarithms", arXiv:2001.09580 (2020).
    identifier: "arXiv:2001.09580"
    fulltext_obtained_this_task: true
    fulltext_fetch:
      url: "https://arxiv.org/pdf/2001.09580"
      http_status: 200
      bytes: 518891
      sha256: "66fd5d283cbde6327d79cee5d5660ad31feac6db82d21b5dff620acee4a993b2"
      extraction_tool: "pdfminer.six extract_text"
      stored: "session scratchpad only, not committed to this repository"
    status: >-
      The filed KN-LIT-771 entry is bulk-seeded and abstract-level with no
      numeric table (per its own "Not verified here" section and
      CORR-20260813-1a06db's caveat). EVERY NUMBER BELOW WAS RECOVERED FROM
      THIS TASK'S OWN FULL-TEXT FETCH, none from the filed entry body.

    gate_set_and_counting_convention:
      value: >-
        "As the fundamental gate set we use the Clifford+T gate set and
        assume that the T gate is by far the most expensive, including
        measurements." Circuits are designed and tested as Toffoli/AND-gate
        networks (efficiently classically simulable), then costed via
        Clifford+T decompositions; T-count and T-depth are reported directly
        (not converted through a fixed T=7*Toffoli multiplier as this
        program's own frozen convention does -- Toffoli decomposition cost
        varies by construction, e.g. "AND gates use 1 auxiliary qubit for
        T-depth 1... Toffoli gates can use 4 auxiliary qubits for T-depth 1
        or none for T-depth 3", each using a different T-gate count per
        Toffoli). NOT directly comparable to this program's fixed
        T = 7*Toffoli convention without restating.
      provenance: from_fetched_fulltext
      location: "Section 2 (Preliminaries) and Section 3 (Components), pp. 2-4 of the extracted text"

    ancilla_policy:
      value: >-
        Explicit clean/dirty ancilla distinction throughout; uses Bennett's
        trick to clean auxiliary qubits when direct uncomputation is too
        costly (described as "roughly doubles the cost"). Reports THREE
        separate optimization strategies (Low Width / Low T / Low Depth)
        that trade ancilla count against T-count and depth -- ancilla policy
        is not fixed, it is the paper's own free variable.
      provenance: from_fetched_fulltext
      location: "Section 2 ('If it is too costly to compute g(x)...'), Section 6 (Results)"

    logical_or_physical:
      value: "LOGICAL qubits and gate counts only. Paper states explicitly it works 'at the logical layer' and cannot decide physical-layer tradeoffs from that level."
      provenance: from_fetched_fulltext
      location: "Section 3, 'Design strategies' paragraph: 'We focus only on the logical layer... From this level we cannot decide which design choices will be optimal.'"

    error_correction_model_and_code_distance:
      value: not stated as a concrete model or distance
      provenance: not_determinable
      searched_for: "surface code, code distance, logical error rate, physical error rate"
      why_not_found: >-
        The paper references surface codes only as the reason T gates are
        assumed most expensive ("in a quantum computer using a surface code
        for error correction, T gates consume special states which require
        many qubits and many surface code cycles to produce") -- this is a
        qualitative justification for the T-gate cost assumption, not a
        stated code distance, physical error rate, or a quantitative
        error-correction model.

    cycle_time:
      value: not stated
      provenance: not_determinable
      searched_for: "cycle time, clock, surface code cycle"
      why_not_found: "No physical-layer timing is modeled; the paper reports circuit depth in gate-layers, not wall-clock time."

    algorithm_parameters:
      curve_representation: "prime-field, Weierstrass affine coordinates, windowed scalar multiplication"
      provenance: from_fetched_fulltext
      curves_simulated: "NIST curves P256, P384, P521 directly simulated with Q#; window sizes up to 18 simulated, larger sizes extrapolated"
      provenance_curves: from_fetched_fulltext
      location_curves: "Section 6 (Results), opening paragraph"
      modular_inversion_method: "reformulated binary Euclidean algorithm building on RNSL's approach (i.e. RNSL's inversion algorithm, per 'We choose to use the RNSL algorithm' in the appendix comparison of PZ vs RNSL inversion)"
      provenance_inversion: from_fetched_fulltext
      location_inversion: "Appendix, modular-inversion comparison section: 'We choose to use the RNSL algorithm. It is exactly correct...'"
      windowing: "signed windowed elliptic curve point addition, window sizes selected per curve/strategy (e.g. 19, 21, 22 for the 256/384/521-bit rows respectively, per optimization target)"
      provenance_windowing: from_fetched_fulltext
      location_windowing: "Table 1 and surrounding text, Section 6"
      semiclassical_fourier_transform: "used, to reduce control-register qubit reuse"
      provenance_sqft: from_fetched_fulltext

    logical_qubit_width:
      value_at_256_bit_low_width_strategy: 2124
      provenance: from_fetched_fulltext
      fulltext_location: "Section 6: 'For P256, we reduce the number of logical qubits from 2338 to 2124' and Table 1 (Low W row, 256-bit modulus block, qubit-width row list '2338 2124 2619 2871' read in RNSL/Low-W/Low-T/Low-D column order)"
      value_at_256_bit_rnsl_comparison_point: 2338
      provenance_rnsl_comparison: from_fetched_fulltext
      note_rnsl_comparison: >-
        This 2338 figure is this paper's OWN restatement of RNSL's result for
        direct comparison, not independently re-derived by this task from
        KN-LIT-099; it differs slightly from KN-LIT-099's own reported 2330
        (both are "RNSL's number" as related by two different sources -- the
        8-qubit discrepancy is a source-to-source citation variance, recorded
        here as observed, not resolved).
      closed_form_low_width: "8n + 10.2*floor(lg n) - 1 logical qubits"
      provenance_closed_form: from_fetched_fulltext
      fulltext_location_closed_form: "Section 6, 'Asymptotic formulas' paragraph"
      value_at_256_bit_low_T_strategy: 2619
      provenance_low_t: from_fetched_fulltext
      fulltext_location_low_t: "Table 1, 256-bit modulus block, qubit-width row list, third entry ('...2619...') matching the Low T column position"
      value_at_256_bit_low_depth_strategy: 2871
      provenance_low_depth: from_fetched_fulltext
      fulltext_location_low_depth: >-
        Table 1, 256-bit modulus block, qubit-width row list, fourth entry
        ('...2871'); independently corroborated in prose: 'our circuit costs
        2^33 T gates with T-depth of 2^25 and 2871 qubits' (Section 1,
        Introduction) -- this prose sentence is what anchors the Low-D
        column identity and confirms the width-list reading used for all
        four 256-bit-block width figures above.
      caveat_on_column_reading: >-
        pdfminer's text extraction of Table 1 interleaves the T/Depth/Width
        sub-columns across strategy rows in a way that is not reliably
        recoverable as plain text (the numeric cells appear as a contiguous
        block separate from their row/column headers). The four width values
        per curve-size block (e.g. '2338 2124 2619 2871' for 256-bit) were
        confidently ordered RNSL/Low-W/Low-T/Low-D because (a) the prose
        states the Low-W value (2124) and the RNSL baseline (2338) by name,
        fixing the first two positions, and (b) the prose independently
        states the Low-D width (2871) and T/T-depth, fixing the last
        position and cross-checking against the fourth number in the list.
        The T-count and T-depth CELLS in the same table could not be
        assigned to strategy rows with the same confidence and are recorded
        as not_determinable below rather than guessed.

    toffoli_or_t_count:
      note: >-
        This paper reports T-count and T-depth directly (not Toffoli count),
        because its cost accounting is over the decomposed Clifford+T gate
        set rather than the Toffoli-network level used by KN-LIT-099. It is
        therefore reported here in the paper's own units rather than
        converted to a Toffoli count, per constraint 7 (a headline total
        without its convention cannot be reproduced and must be recorded as
        such -- converting units here would be exactly that kind of
        unrecorded assumption).
      t_count_low_depth_256bit: "2^33"
      provenance: from_fetched_fulltext
      fulltext_location: "Section 1 (Introduction), prose: 'our circuit costs 233 T gates with T-depth of 225 and 2871 qubits' (2^33 T gates, read as such because the qubit figure 2871 in the same sentence matches the Low-D width identified above)"
      t_depth_low_depth_256bit: "2^25"
      provenance_depth: from_fetched_fulltext
      fulltext_location_depth: "same sentence as above"
      t_count_low_width_256bit_relative_only: "improved over RNSL by a factor of 119 (no absolute figure stated in prose for this strategy)"
      provenance_relative: from_fetched_fulltext
      fulltext_location_relative: "Section 1: 'improve the T-count by a factor of 119 and the T-depth by a factor of 54' (stated as a ratio to RNSL, not as an absolute T-count)"
      t_count_low_T_256bit_absolute: not_determinable
      provenance_low_t_absolute: not_determinable
      searched_for_low_t_absolute: "an absolute T-count for the Low-T strategy at 256-bit stated in prose (only Table 1 carries it)"
      why_not_found_low_t_absolute: >-
        Table 1's T-count/T-depth cells could not be reliably assigned to
        the Low-T strategy row from the extracted text alone (see
        caveat_on_column_reading above); no corroborating prose sentence
        states this figure the way it does for RNSL/Low-W (ratio) and Low-D
        (absolute). Recorded as not determinable from this task's extraction
        rather than guessed.
      closed_form_low_width_strategy: "436 n^3 - 1.05*2^26 T-gates at T-depth 120 n^3 - 1.67*2^22; total gates 2900 n^3 - 1.08*2^31 at depth 509 n^3 - 1.84*2^27"
      note_on_exponent_base: >-
        Source text renders these as '1.05 x 2^26' etc (base-2 exponents,
        matching the paper's Table 1 style of '1.60 x 2^39'), NOT base-10
        scientific notation. Recorded here with an explicit '*2^n' to avoid
        the ambiguity the raw PDF-extracted superscript introduces.
      provenance_closed_form_low_width: from_fetched_fulltext
      fulltext_location_closed_form_low_width: "Section 6, 'Asymptotic formulas' paragraph, first paragraph"
      closed_form_low_T_strategy_T_gates: "1115 n^3 / lg n - 1.08*2^24 T gates, T-depth 389 n^3 / lg n - 1.70*2^22"
      provenance_closed_form_low_t: from_fetched_fulltext
      closed_form_low_depth_strategy: "overall depth 2523 n^2 + 1.10*2^20, T-depth 285 n^2 - 1.54*2^17, width 11n + 3.9*floor(lg n) + 16.5 qubits"
      provenance_closed_form_low_depth: from_fetched_fulltext
      fulltext_location_closed_forms: "Section 6, 'Asymptotic formulas' paragraph, all three paragraphs"

    rsa_3072_comparison_figures:
      value: "extrapolated (their own word: 'Extrapolating') to 2^34 T gates and 9287 logical qubits, citing a separate source [14] rather than deriving it in this paper"
      provenance: from_fetched_fulltext
      fulltext_location: "Section 1 (Introduction), final paragraph before Section 2: 'Extrapolating analogous values, breaking RSA-3072 would cost 2^34 T gates and 9287 logical qubits [14].'"
      caveat: >-
        This is explicitly an EXTRAPOLATION FROM A CITED SOURCE, not this
        paper's own computed RSA circuit -- recorded as such and not treated
        as an independently-derived headline total of this paper.

    what_could_not_be_determined:
      - "code distance"
      - "physical error rate / logical error rate"
      - "cycle time"
      - "physical qubit count"
      - "wall-clock time"
      - "Toffoli gate count in the sense KN-LIT-099 reports it (this paper reports T-count/T-depth instead, at a different level of the gate-set decomposition)"

  - source_id: KN-LIT-1882
    citation: >-
      Luo, Yang, Wang, Su, Li, "Space-Efficient Quantum Algorithm for
      Elliptic Curve Discrete Logarithms with Resource Estimation",
      arXiv:2604.02311 (2026).
    identifier: "arXiv:2604.02311"
    fulltext_obtained_this_task: true
    fulltext_fetch:
      url: "https://arxiv.org/pdf/2604.02311"
      http_status: 200
      bytes: 699569
      sha256: "2991dd2ead2821e815893efc5d3b3db191d04e9d27ece1fc8e7ff02fea25c1f8"
      extraction_tool: "pdfminer.six extract_text"
      stored: "session scratchpad only, not committed to this repository"
    status: >-
      The filed KN-LIT-1882 entry is bulk-seeded and abstract-level with no
      numeric table (per its own "Not verified here" section and
      CORR-20260813-1a06db's caveat). EVERY NUMBER BELOW WAS RECOVERED FROM
      THIS TASK'S OWN FULL-TEXT FETCH, none from the filed entry body.

    gate_set_and_counting_convention:
      value: >-
        Toffoli-network level: "we express the main reversible components as
        Toffoli networks... such networks admit exact realizations over
        Clifford+T... Toffoli-based reversible circuits can be efficiently
        simulated on classical inputs." Costs are reported directly in
        Toffoli and CNOT gate counts (not decomposed to T-count), matching
        KN-LIT-099's convention level, and the paper explicitly states it
        adopts RNSL's Toffoli-based accounting for the non-inversion
        components: "To keep the accounting uniform, we use only Toffoli
        -based cost estimates in this subsection."
      provenance: from_fetched_fulltext
      location: "Section 2.1 (Quantum computing and the Toffoli networks); Section 5.4 opening sentence"

    ancilla_policy:
      value: >-
        Explicit clean-ancilla accounting in its own resource table (Table
        6): "The first two rows use one/two clean ancillas and may
        additionally borrow dirty ancillas as in [RNSL17]. All other
        ancillas are assumed clean and are returned to |0>." This is closer
        to this program's own frozen convention (clean ancillas, all
        returned) than KN-LIT-771's mixed strategy, but still explicitly
        permits BORROWED DIRTY ANCILLAS for two operation types, which the
        program's own frozen convention forbids -- not directly comparable
        without restating.
      provenance: from_fetched_fulltext
      location: "Table 6 caption, Section 5.4"

    logical_or_physical:
      value: "LOGICAL qubits and gate counts only. No error correction, no physical layer."
      provenance: from_fetched_fulltext
      location: >-
        No mention of physical qubits, code distance or error rates anywhere
        in the fetched full text (checked by keyword search across the whole
        extracted text; see error_correction_model_and_code_distance below).

    error_correction_model_and_code_distance:
      value: not stated
      provenance: not_determinable
      searched_for: "surface code, code distance, logical error rate, physical error rate, fault-tolerant"
      why_not_found: >-
        "Fault-tolerant" appears only in generic background sentences (e.g.
