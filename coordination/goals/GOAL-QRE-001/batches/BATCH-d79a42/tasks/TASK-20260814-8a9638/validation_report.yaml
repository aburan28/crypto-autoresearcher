validation_report:
  id: VAL-20260814-90dd0f
  task_id: TASK-20260814-8a9638
  goal_id: GOAL-QRE-001
  batch_id: BATCH-d79a42
  role: validator
  independent_session: true
  reviewed_objects:
    - TASK-20260814-334157   # lane A, producer
    - TASK-20260814-9081e8   # lane B, producer
    - TASK-20260814-e95462   # pre-registration
    - TASK-20260814-19d2b9   # freeze snapshot
    - TASK-20260814-c4c5e3   # binding snapshot
  run_ids: []
  run_ids_note: >-
    Neither lane emitted a RUN-* record; both are task-directory run packages
    bound by the TASK-20260814-c4c5e3 snapshot receipt in content_first mode.
    This report validates that snapshot, not a working tree.

  prohibition_statement: >-
    This report states only what was checked and what was measured. It contains
    no date, timeline, statement about when any machine might exist, arrival
    probability, forecast, migration guidance or policy advice. Program record
    identifiers embed a mint stamp and are identifiers, not statements.

  interpretation_boundary: >-
    A passed validation means the receipt is admissible evidence. It does NOT
    support an ECDLP claim, does NOT demonstrate a speedup at any deployed
    parameter, and does NOT authorize promotion of any hypothesis or completion
    criterion. The counts validated here are arithmetic-layer gate counts under
    one frozen convention, and the headline n = 256 figures are arithmetic on
    closed forms, not measurements.

  # =====================================================================
  # VERDICT
  # =====================================================================
  verdict: passed-with-defects
  verdict_in_role_contract_vocabulary: passed
  verdict_vocabulary_note: >-
    agents/validator.md admits passed | failed | incomplete | invalid. The
    handoff asked for passed | passed-with-defects | failed. Both are recorded:
    the package is admissible (passed) and carries eight recorded defects, two
    of them moderate, none of which invalidates a reported number.
  verdict_basis: >-
    Every declared hash re-verified; the freeze order is verifiable from git and
    holds; the pre-registration blob is byte-identical to the frozen one; all
    four lane A artifacts rebuild from committed source with ZERO differing
    leaves outside timing fields, at fitted and at pre-registered holdout widths
    alike; every closed form recomputes under my own independent arithmetic and
    my own independent algebraic re-derivation; the comparison carries every
    axis on both sides at every width and states the width loss plainly; lane
    B's three source fetches reproduce byte-for-byte by sha256 and its sampled
    provenance tags check out against the sources; blind-by-design holds in both
    directions; prohibition compliance holds substantively across all 27 files
    I scanned. The two moderate defects are (V-1) a stated causal mechanism in
    defect D-1 that my measurement refutes, and (V-2) a defect class the
    package's declared controls are blind to by construction, which I
    demonstrated with my own mutation.

  # =====================================================================
  # TARGET 1 -- FREEZE ORDER, FROM GIT
  # =====================================================================
  target_1_freeze_order:
    finding: HOLDS. The process fix worked and is verifiable by anyone with the repository.
    checks:
      - "git merge-base --is-ancestor e2ea19643 HEAD -> exit 0 (ancestor)."
      - "git merge-base --is-ancestor e2ea19643 37cda7e19 -> exit 0; the two commit
         ids are distinct, so the ancestry is STRICT."
      - "git merge-base --is-ancestor e2ea19643 b6eee6e95 -> exit 0 (lane B's early
         commit is also a strict descendant)."
      - "git show --stat e2ea19643 -> exactly 2 files, 492 insertions:
         tasks/TASK-20260814-e95462/PREREGISTRATION.md (457 lines) and
         archives/TASK-20260814-19d2b9/snapshot-receipt.json (35 lines).
         NO source, NO counts, NO code, NO lane B artifact."
      - "Per-file first-appearance (git log --diff-filter=A) over every tracked
         path under tasks/TASK-20260814-334157/: ALL 21 files (4 JSON artifacts,
         execution_report.yaml, 7 src/*.py, 9 logs/*) first appear in 37cda7e19,
         a strict descendant of e2ea19643. Not one lane A artifact predates the
         freeze commit."
      - "Commit ordering by committer timestamp is consistent with the ancestry:
         e2ea19643 -> fac4bc243 (queue: freeze verified, lane A unblocked) ->
         b6eee6e95 -> 37cda7e19."
    what_this_establishes: >-
      That the protocol document was committed before any artifact constrained
      by it was committed. This is the check BATCH-973b49 could not support, and
      it now passes.
    what_this_does_not_establish: >-
      Git proves COMMIT order, not WORK order. It cannot exclude a producer
      having computed something before the freeze commit and committing it
      later. The residual confound is smaller than batch 1's but is not zero,
      and no artifact in this batch can close it. Recorded, not waved away.

  # =====================================================================
  # TARGET 2 -- PRE-REGISTRATION NOT EDITED AFTER FREEZE
  # =====================================================================
  target_2_preregistration_immutability:
    finding: HOLDS. Byte-identical.
    checks:
      - "git rev-parse e2ea19643:<prereg> == git rev-parse HEAD:<prereg> ==
         3d4cd72339b6c0c6febf905e85c0afb5c1bf2be8 (same blob object)."
      - "sha256 of the blob at e2ea19643 and of the working-tree file both =
         3660713745563f668b15f47bd9238da4b5fcf4271ee717b2d490f04049ea2c1a."
      - "The freeze receipt archives/TASK-20260814-19d2b9/snapshot-receipt.json
         declares that same sha256, so the receipt, the frozen blob and the file
         under review are one object."
      - "Producer records amended: false / amendment_requested: false and files
         the two things the frozen document did not declare as gaps G-1 and G-2
         instead of writing them in. Consistent with the blob evidence."

  # =====================================================================
  # TARGET 3 -- ATTACK ON THE NEGATIVE CONTROL  (I RAN MY OWN MUTATIONS)
  # =====================================================================
  target_3_negative_control:
    finding: >-
      MIXED. The control is real and does discriminate; the producer's stated
      EXPLANATION for why it fell short is REFUTED by measurement; and there is
      a defect class the package's controls are blind to by construction, which
      the producer did not identify and which I demonstrated.

    part_a_reproduction_of_the_reported_shortfall:
      result: EXACT AGREEMENT.
      detail: >-
        Re-running the pre-registered mutation myself from committed source over
        the exhaustive input set, my escape counts equal the producer's at every
        configuration I overlapped: n=4 p=11 -> 1 escape of 10; n=4 p=13 -> 1 of
        12; n=5 p=19 -> 0 of 18; n=5 p=17 -> 0 of 16; n=6 p=61 -> 1 of 60. I
        additionally ran n=6 p=37, which is not a producer configuration: 0
        escapes of 36. The artifact's 1808/1822 = 0.9923 and its list of 10
        not-fully-caught configurations reproduce.

    part_b_the_producers_stated_mechanism_is_false:
      result: REFUTED. This is defect V-1.
      producer_claim: >-
        negative_control D-1 states, and calls "checkable and not speculative",
        that "the two swapped branches are BOTH gated on 'u odd AND v odd', so
        on any input whose entire 2n-iteration trajectory never reaches a state
        with u and v both odd, the swap is a no-op ... Such inputs exist and are
        commonest at the smallest widths".
      what_i_measured:
        - "The conditional is only vacuous when g1 = (u odd AND v odd) never
           fires, since g3 = g1 AND c and g4 = g1 AND NOT c are equal only when
           g1 = 0."
        - "I enumerated, for every x in [1,p), whether g1 fires anywhere in the
           2n-iteration trajectory, over 20 configurations (two primes per width,
           n = 3..12). NUMBER OF INPUTS FOR WHICH IT NEVER FIRES: 0. The class
           the producer's mechanism describes is EMPTY on everything I tested."
        - "Every escaping input I found has g1 firing repeatedly: x=8 at p=11
           (3 iterations), x=10 at p=13 (3), x=58 at p=61 (5). The mutation was
           LIVE on each of them."
      why_it_matters: >-
        The producer's mechanism makes the shortfall sound benign -- 'the
        mutation was a no-op there, so nothing escaped detection'. The truth is
        the opposite and is worse: the mutated branch FIRED and the mutated
        circuit still returned the correct inverse with clean ancillas. The
        control is therefore weaker than its own explanation implies. The
        structural argument is elementary and should have caught this: u starts
        at the odd prime p and can only change in a branch that requires g1, so
        u is odd until g1 fires; v = x >= 1 halves to an odd value; hence g1
        fires for every input in the declared domain.
      what_survives: >-
        The clause 5(c) obligation is still discharged: the fraction below 1.0
        was REPORTED, not suppressed, and no substitute mutation was swapped in.
        The correct restatement of D-1 is that a subset of inputs is insensitive
        to a live control-flow defect, not that the defect is inert on them.

    part_c_kn_find_a4d4a4_mechanism_independently_reproduced:
      result: CONFIRMED, and sharpened beyond what the producer measured.
      detail: >-
        The producer reports the tally as bit-identical across the mutation at
        20 of 20 configurations. I verified this directly and went one level
        deeper: I captured the ORDERED gate stream with qubit indices for the
        mutated and unmutated inverter. At n=4 p=11 the streams are the same
        length (11,416 ops) and the counts are identical
        {x:364, cnot:7276, ccx:3776} with identical peak 103, yet they DIVERGE
        at op index 90, where the unmutated circuit emits ccx(30,13,38) and the
        mutated one emits ccx(31,13,38) -- one control qubit index different
        (g3 -> g4). Same at n=5 p=19 (index 104) and n=6 p=61 (index 123).
        So the defect is a pure CONTROL-WIRING change, invisible to the tally by
        construction, in a circuit structurally unrelated to batch 1's ripple
        adder. KN-FIND-a4d4a4's mechanism is reproduced in a second setting by
        an independent session, which is what that entry's own scope note says
        it lacked.

    part_d_defect_class_blind_by_construction:
      result: >-
        YES, ONE EXISTS, AND IT IS THE ONE THAT MATTERS. This is defect V-2 and
        it is the mirror image of KN-FIND-a4d4a4.
      statement: >-
        The package's declared correctness controls -- classical simulation
        against the intended function, the global end-of-circuit ancilla-zero
        assertion, and the pre-registered mutation -- are ALL invariant to
        cost. The package's only deliverable IS a cost. So no declared control
        in the package can discriminate a circuit whose gate count is wrong and
        whose semantics are right.
      my_mutation_that_demonstrates_it:
        design: >-
          A semantics-preserving gate-count inflation: an extra pair of
          controlled copies (CCX is an involution, so the pair cancels exactly)
          injected into euclid.ctrl_sub_reg on a freshly allocated clean
          register that is released clean.
        measured_on_the_new_side:
          - "n=4 p=11: ccx 3776 -> 4096 (+8.47%), peak unchanged at 103,
             caught by the package's validation on 0 of 10 exhaustive inputs."
          - "n=5 p=19: ccx 5680 -> 6160 (+8.45%), peak unchanged at 127,
             caught on 0 of 18."
          - "n=6 p=61: ccx 7968 -> 8640 (+8.43%), peak unchanged at 151,
             caught on 0 of 60."
        measured_on_the_baseline_side:
          - "Same class injected into the INHERITED circuits.modmul_acc, which
             inflates the Fermat side only: n=4 p=11 point addition ccx
             13282 -> 13578 (+2.23%), caught on 0 of 6 domain inputs;
             n=5 p=19 ccx 24700 -> 25150 (+1.82%), caught on 0 of 15."
        consequence: >-
          A cost-only defect on either side moves the headline ratio and passes
          every control the package declares, at 100% of tested inputs. Since
          the ratio is what the batch exists to produce, this is the gap that
          matters. Note this is symmetric: it is equally a route to
          understating the new side (defect D-2 is a real, disclosed instance
          of exactly that) and to overstating it.
      what_actually_constrains_the_cost_here_and_is_not_named_as_a_control:
        - >-
          The package DOES have a cost control, but neither the pre-registration
          nor the execution report identifies it as one: the algebraic
          derivation of the count, independent in method from the enumeration.
          I re-derived it myself, gate by gate, from src/euclid.py:
          per iteration 1 (g1) + 4(n+1) (comparison: one sub + one add on n+1
          bits) + 1 (g3) + 2 x 4(n+1) (two ctrl_sub_reg) + 2 x (12n+10) (two
          ctrl_mod_add = 2n copy-in/out + 10(n+1) inherited mod_add) + 2n (two
          controlled rotations) + 2 x (5n+5) (two ctrl_mod_dbl) = 48n + 44,
          exactly the producer's per_iteration_toffoli_derived. With K = 2n
          iterations and the block replayed forward and inverted,
          2 x 2n x (48n+44) = 192n^2 + 176n, matching the enumeration.
          Likewise 4(192n^2+176n) + 5(20n^2+10n-8) + 50(n+1) + 2n expands to
          868n^2 + 806n + 10, matching the point-addition enumeration.
        - >-
          A semantics-preserving cost mutation of the kind I injected WOULD
          break the agreement between that derivation and the enumeration. That
          agreement is the real cost control and it holds. RECOMMENDATION FOR
          THE COORDINATOR, not a status change: a future pre-registration should
          name the algebraic re-derivation as the cost control and require a
          cost-perturbing mutation alongside the semantic one, because a
          semantic mutation alone cannot test the quantity being reported.

  # =====================================================================
  # TARGET 4 -- SIMULATED CIRCUIT == COUNTED CIRCUIT, ORDERED, WITH INDICES
  # =====================================================================
  target_4_counted_equals_simulated:
    finding: HOLDS at every configuration I tested, at the level the handoff demanded.
    method: >-
      I did NOT accept tally equality. I wrapped Machine._emit and captured the
      full ordered op list -- opcode plus every qubit index -- once with
      Machine(run=False) (the counting sink) and once with Machine(run=True)
      (the simulating sink), and compared element by element.
    results:
      - "euclid inverter n=4 p=11: 11,416 ops, streams IDENTICAL, no divergence."
      - "euclid inverter n=5 p=19: 16,865 ops, IDENTICAL."
      - "euclid inverter n=6 p=61: 24,132 ops, IDENTICAL."
      - "euclid inverter n=7 p=127: 32,695 ops, IDENTICAL."
      - "point addition with the new inverter n=4 p=11: 52,698 ops, IDENTICAL;
         n=5 p=19: 77,811 ops, IDENTICAL."
      - "inherited Fermat point addition (the OTHER side of the comparison)
         n=4 p=11: 46,474 ops, IDENTICAL; n=6 p=61: 212,854 ops, IDENTICAL."
      - "peak_qubits agrees between the two sinks at every configuration above."
    structural_reason_this_generalises: >-
      Neither circuits.py nor euclid.py ever reads m.run or m.bits while
      building; allocation is a deterministic function of the call sequence
      alone. The only way the two sinks can diverge is a DirtyAncilla raised in
      run mode, which truncates the run-mode stream and is itself reported.
    limitation: >-
      Measured at n = 4..7 only. Not measured at the enumerated-but-unsimulated
      widths (point addition n = 15, 16, 20, 24, 32) or at n = 256, where no
      simulation exists on either side. Above the simulated ladder the identity
      rests on the structural argument, not on a measurement.

  # =====================================================================
  # TARGET 5 -- INDEPENDENT REBUILD FROM COMMITTED SOURCE
  # =====================================================================
  target_5_independent_rebuild:
    finding: REPRODUCED EXACTLY. Zero differing leaves outside timing fields.
    method: >-
      git archive 37cda7e19 of lane A's src/ and BATCH-973b49's src/ extracted
      into an isolated scratch directory outside the repository, then
      run_inverter.py, run_comparison.py, run_negative_control.py and
      run_validation_e.py executed there. Extracted src/euclid.py sha256
      matches the snapshot receipt's declared value. Recursive leaf-by-leaf JSON
      comparison against the committed artifacts, ignoring only `seconds` and
      `wall_clock_seconds`.
    results:
      inverter_counts.json: 0 differing leaves
      inverter_validation.json: 0 differing leaves
      negative_control.json: 0 differing leaves
      baseline_comparison.json: 0 differing leaves
      note: >-
        This covers the 179-second full validation run and the 33-second
        negative control, which the producer itself did NOT re-run (its own
        reproduction check covered only run_inverter and run_comparison). Those
        two are now independently reproduced for the first time.
    holdout_residuals_verified_in_the_rebuild:
      inverter_toffoli_192n2_176n: "36 residual rows, 8 of them holdout (n = 22, 24, 28, 32), nonzero residuals: 0"
      inverter_peak_24n_7: "36 rows, 8 holdout, nonzero: 0"
      inverter_ancilla_22n_7: "36 rows, 8 holdout, nonzero: 0"
      pointadd_euclid_toffoli_868n2_806n_10: "32 rows, holdouts n = 15, 16, 20, 24, 32, nonzero: 0"
      pointadd_euclid_peak_26n_7: "32 rows, holdouts as above, nonzero: 0"
      pointadd_euclid_ancilla_24n_7: "32 rows, holdouts as above, nonzero: 0"
      pointadd_fermat_toffoli: "32 rows, holdouts as above, nonzero: 0"
      pointadd_fermat_peak: "32 rows, holdouts as above, nonzero: 0"

  # =====================================================================
  # TARGET 6 -- GAP G-1, THE DERIVED BASELINE WIDTH FORM
  # =====================================================================
  target_6_gap_G1:
    finding: >-
      THE PREMISE IS CORRECT AND THE DERIVED FORM HOLDS, verified against the
      inherited builder rather than against the producer's restatement of it.
    premise_verified:
      - "ledger/evidence/EV-QRE-45dfe1.yaml's point-addition observation gives
         only the Toffoli form in (n, b, w). It states no baseline peak-width
         form."
      - "BATCH-973b49's counts.json circuit_b_ec_point_addition
         .evaluated_at_256_bit_shape carries toffoli and t_count and NO
         peak_qubits. This is exactly the axis omission DEC-20260813-5cef9c
         recorded."
      - "That batch's only baseline width form is peak_qubits_fit_in_n_alone =
         2n^2 + 4n + 5, and it is NOT exact: residuals -8, -11, -15, -32 at
         n = 8, 11, 15, 32."
    premise_conclusion: >-
      Pre-registration clause 6.1 did assume a number that filed evidence does
      not contain, and the producer's G-1 disclosure is accurate.
    verification_of_the_derived_form_n_bw_plus_5n_plus_5:
      check_1_producer_ladder: >-
        Recomputed by my own arithmetic over all 33 comparison_table rows:
        fermat_peak_qubits == n(b+w) + 5n + 5 at every row, residual 0,
        including n = 32 where b+w = 62.
      check_2_off_ladder_primes_i_chose_myself: >-
        I enumerated the INHERITED circuits.point_add through the inherited
        Machine at 30 (n, p) pairs that are NOT the producer's fitted pairs --
        up to three primes per width for n = 4..14, excluding the
        lowest/highest-weight pair the producer used. Residual of
        n(b+w) + 5n + 5 against the live enumeration: 0 at all 30. The
        baseline Toffoli form, the new side's 26n+7 peak and the new side's
        868n^2+806n+10 also had residual 0 at all 30.
      check_3_it_explains_batch_1s_own_residuals: >-
        The strongest evidence, and it is independent of both producers. For a
        largest-prime ladder point with b = n and w = n-2, b+w = 2n-2 while the
        n-alone fit assumes 2n-1, so the derived form predicts a residual of
        exactly -n for those rows. BATCH-973b49 reported -8, -11, -15, -32 at
        n = 8, 11, 15, 32. All four match exactly. The producer's form does not
        merely fit its own data; it reproduces and explains the previously
        published misfit.
      structural_reading: >-
        n(b+w) + 5n + 5 = n(b+w-2) + 7n + 5, and the Fermat chain keeps exactly
        (b+w-2) live registers of n qubits (one per squaring and one per
        multiply in the square-and-multiply chain), with an overhead
        independent of b and w. The form is therefore linear in (b+w) for a
        structural reason, not only empirically.
    residual_risk_recorded: >-
      The form is enumerated up to b+w = 62 and EVALUATED at b+w = 506 for the
      n = 256 row. The extrapolation in (b+w) is a factor of eight beyond
      anything enumerated. It is well motivated structurally and I found no
      counter-evidence, but it is not measured there and the headline width
      ratio 19.63 depends on it. Note the direction: the derived exact form
      gives the baseline a SMALLER peak (130,821) than batch 1's n-alone fit
      would have (132,101), so the producer's own derivation moves the ratio
      AGAINST its own side. Good faith, and recorded as such.

  # =====================================================================
  # TARGET 7 -- AXIS COMPLETENESS AND NON-NETTING
  # =====================================================================
  target_7_axis_completeness:
    finding: HOLDS. No axis is missing on either side at any width, and the width loss is not buried.
    checks:
      - "All 33 comparison_table rows carry all ten cells: euclid/fermat x
         {toffoli, t_count, peak_qubits, ancilla_qubits, io_qubits}. Missing or
         null cells: NONE, including the n = 256 row -- which is the exact row
         the previous package left blank."
      - "Each row also carries euclid_parameter_dependence and
         fermat_parameter_dependence, discharging clause 6.1's last bullet."
      - "Verdict fields recomputed from the numbers by my own comparison:
         33 rows x 4 axes, inconsistencies: 0."
      - "Toffoli/T: new side not better at exactly 3 of 32 enumerated pairs --
         (4,11), (4,13), (5,19) -- better at 29. Matches OBS-4."
      - "peak/ancilla: new side worse at 18 of 32; worse at BOTH primes for
         every n in 4..11, split at n = 12 and 13, better for every n >= 14.
         Matches OBS-4 and the receipt's F-2."
    not_buried_assessment: >-
      The unfavourable result is stated in at least five places at full
      strength: OBS-4's statement, OBS-4.per_axis_not_netted ("In the band
      n = 6..11 the result is a genuine TRADE-OFF ... fewer Toffolis, more
      qubits"), per_axis_summary.peak_qubits with the complete list of all 18
      losing pairs and their numbers, the column_set_guard note, and the
      execution report's completion_gate. It is as plain in the artifacts as in
      the summary. No netting into a single verdict anywhere.

  # =====================================================================
  # TARGET 8 -- THE THREE DERIVATIONS BEHIND K = 2n
  # =====================================================================
  target_8_derivations:
    finding: ALL THREE HOLD under my own independent computation.
    D2_potential_falls_and_bound_is_tight:
      claim: "Phi = bitlen(u) + bitlen(v) falls at least 1 per iteration, so v = 0 within 2n-1 steps; measured tight."
      my_check: >-
        I re-implemented the classical recurrence myself and ran it over every
        x in [1,p) for two primes per width, n = 3..16 (28 primes). Worst-case
        iterations to v = 0 equals EXACTLY 2n-1 at every width, and u = 1 at
        termination for every input at every width. Independent agreement with
        the producer's step_bound_and_point_generator_checks rows.
      argument_check: >-
        Each branch replaces u or v by u/2, v/2, (u-v)/2 or (v-u)/2, each of
        strictly smaller bitlength than the value replaced, so Phi is strictly
        decreasing; Phi <= 2n initially and Phi = 1 at (u,v) = (1,0). Sound.
        Tightness is a measurement over the tested primes, not a proof, and the
        producer labels it as an unexpected observation rather than a theorem.
    D3_post_terminal_steps_only_double_r:
      my_check: >-
        Once v = 0, u = gcd(p,x) = 1 is odd, so the "v even" branch is taken and
        v stays 0 while r doubles. Follows directly from the branch conditions
        as coded. Verified end-to-end by D4's check below, which would fail if
        the surplus iterations did anything other than double r.
    D4_s0_makes_phase_2_free:
      my_check: >-
        I implemented the exact fixed-K recurrence the circuit realises, with
        s0 = -2^{-2n} mod p loaded classically, and compared r_K against
        pow(x,-1,p) for every x in [1,p) at 24 configurations (two primes per
        width, n = 3..14). MISMATCHES: 0. The Montgomery correction phase is
        indeed absorbed into the initialisation constant.
      linearity_argument: >-
        The (r,s) updates are linear in (r,s) and every branch decision depends
        on (u,v) only, so r_K is linear in s_0 with r_0 = 0. Sound as stated.
    consequence: >-
      K = 2n is correct for the declared domain 1 <= x < p, p an odd prime. The
      construction does not rest on a wrong step bound. Scope: verified for
      n <= 16 by exhaustive enumeration; the argument, not a measurement, covers
      larger n.

  # =====================================================================
  # TARGET 9 -- HAMMING-WEIGHT CLAIM, BOTH HALVES
  # =====================================================================
  target_9_hamming_weight:
    finding: BOTH HALVES HOLD, and I strengthened the first half beyond the producer's evidence.
    half_1_gone_on_toffoli_T_peak_ancilla:
      producer_evidence: "two primes per width, lowest and highest weight(p-2) among the 40 largest primes of that length, 16 widths."
      my_recomputation_from_the_table: >-
        At every one of the 16 widths the two primes give a single distinct
        euclid_toffoli value and a single distinct euclid_peak_qubits value
        (identical), while fermat_toffoli and fermat_peak_qubits differ between
        the two primes at EVERY width. Widths where the new side is not
        prime-independent: NONE.
      my_independent_strengthening: >-
        The producer's evidence is two primes per width. I enumerated 30
        ADDITIONAL (n,p) pairs of my own choosing (up to three off-ladder primes
        per width, n = 4..14): euclid toffoli residual against 868n^2+806n+10
        and euclid peak residual against 26n+7 are 0 at all 30. So the
        invariance is not an artifact of the two-prime sample.
      control_logic: >-
        This satisfies the null-object requirement in the form appropriate to a
        deterministic count: the quantity meant to destroy the invariance is
        w = weight(p-2), it is varied adversarially, and the SAME instrument on
        the SAME widths shows the baseline moving with w while the new side does
        not. The contrast is measured, not assumed.
      mechanism_check: >-
        The producer attributes it to the loop running a fixed K = 2n iterations
        whose gate content does not branch on p. Consistent with src/euclid.py:
        p enters only through X and CNOT constant loads and through the
