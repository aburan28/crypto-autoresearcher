        both. Losses in determinism, success probability and dimension: none
        (both are deterministic permutations on the same registers). Losses in
        time/memory: measured per axis and reported.
    - check: "quantifier fidelity"
      result: >-
        The invariance claim is 'for all p of this bit length' and the evidence
        is per-prime. The producer states the sample (two adversarial primes per
        width) rather than presenting a per-prime witness as uniform; I
        broadened it by 30 primes. The residual quantifier gap -- all primes of a
        width versus the primes tested -- is real, disclosed and unavoidable at
        this scale.
    - check: "method ceiling / nearby-object control"
      result: "NOT PRESENT and NOT REQUIRED by this task's contract; recorded as unchecked rather than as satisfied."

  # =====================================================================
  # DEFECTS RAISED BY THIS VALIDATION
  # =====================================================================
  defects:
    - id: V-1
      grade: moderate
      class: false_causal_mechanism_in_a_defect_record
      statement: >-
        Defect D-1's stated mechanism for the negative-control shortfall is
        FALSE. It claims the escapes are inputs whose trajectory never reaches
        "u odd AND v odd", making the swap a literal no-op. I enumerated that
        class over 20 configurations (two primes per width, n = 3..12) and it is
        EMPTY -- zero inputs. Every escaping input I found has the mutated branch
        firing (3, 3 and 5 times at p = 11, 13, 61). The mutation was live and
        the check passed anyway, which is a strictly weaker result for the
        control than D-1 implies. D-1 explicitly presents the mechanism as
        "checkable and not speculative", so it was offered for exactly this
        check and does not survive it.
      affects: "the interpretation of the negative control; no reported count changes"
      repair_route: "a superseding record restating D-1 without the mechanism, or with a mechanism that survives measurement. Not repairable in place -- the artifact is immutable."
    - id: V-2
      grade: moderate
      class: defect_class_blind_to_every_declared_control
      statement: >-
        Every control the package declares is invariant to cost, and cost is the
        only deliverable. I demonstrated it: a semantics-preserving Toffoli
        inflation of +8.5% on the new side and +1.8 to +2.2% on the baseline side
        was caught by the package's validation on 0 of 88 exhaustive inputs
        across five configurations, with peak_qubits unchanged. A cost-only
        defect on either side moves the headline ratio and passes everything.
        This is the exact mirror of KN-FIND-a4d4a4: there, the tally could not
        see wiring; here, the simulation cannot see cost.
      mitigating_finding: >-
        The package does have a cost control, undeclared: the algebraic
        derivation (48n+44 per iteration -> 192n^2+176n; and the point-addition
        expansion) agrees with the enumeration, and I verified that derivation
        by hand. A cost mutation would break that agreement. So the reported
        numbers are not unanchored -- but nothing in the protocol required that
        anchor, and at the baseline side the anchor is EV-QRE-45dfe1's
        independently derived form.
      forward_guidance: >-
        A future pre-registration in this line should require a COST-PERTURBING
        mutation alongside the semantic one, and should name the algebraic
        re-derivation as a control rather than as narrative.
    - id: V-3
      grade: low
      class: artifact_omission_that_blocks_independent_diagnosis
      statement: >-
        negative_control.json records only counts per configuration, never WHICH
        inputs escaped. D-1's mechanism claim is therefore not checkable from the
        artifact; I had to re-run the mutation to find x = 8, 10 and 58. Recording
        the escaping inputs costs nothing and is what makes a shortfall
        diagnosable by a reader.
    - id: V-4
      grade: low
      class: overstated_negative_in_a_source_characterisation
      statement: >-
        Two lane B logical_or_physical notes assert more than the sources
        support. For KN-LIT-1882 the note says "No mention of physical qubits,
        code distance or error rates anywhere in the fetched full text (checked
        by keyword search across the whole extracted text)"; the identical PDF
        (same sha256) contains "sufficiently low physical error rates (or
        equivalently achievable logical error rates after error correction)
        [GE21, Gid25]". The artifact is internally inconsistent, because its own
        error_correction_model_and_code_distance field two entries below
        describes exactly that sentence correctly. For KN-LIT-771 the note says
        "LOGICAL qubits and gate counts only" while the paper's introduction
        carries "Under plausible assumptions about physical error rates, this
        could translate into 6.77 * 10^7 physical qubits [11]".
      affects: "no extracted number; only the accuracy of a negative characterisation"
      credit_where_due: "NOT importing either figure is the prohibition-correct behaviour, and lane B did not import them."
    - id: V-5
      grade: low
      class: prohibition_scan_coverage
      statement: >-
        Lane B ran NO mechanical prohibition scan -- its discharge is a prose
        self-check that asserts "None was found or introduced". My sweep found
        one literal ISO calendar date in
        tasks/TASK-20260814-9081e8/corpus_inventory.md line 64, identifying a
        corpus bulk-seeding pass. It is repository provenance metadata rather
        than a capability-arrival statement, so it is not a substantive breach,
        but the self-check's absolute claim is inaccurate at the pattern level
        and the higher-risk lane is the one with no scanner. Lane A's scanner is
        good and genuinely repairs BATCH-973b49's D-V3.
    - id: V-6
      grade: low
      class: provenance_durability
      statement: >-
        Lane B's fetched full texts are stored "session scratchpad only, not
        committed", so its from_fetched_fulltext tags are re-checkable only
        while the sources remain byte-identical at their URLs. Mitigated
        strongly: sha256 and byte counts are recorded for all three, and all
        three reproduce EXACTLY on my own re-fetch. Recorded because that
        mitigation depends on external availability and the repository retains
        nothing.
    - id: V-7
      grade: low
      class: transfer_assumption_carrying_the_headline
      statement: >-
        Both headline ratios at n = 256 rest on extrapolating closed forms
        beyond every enumerated point, and on the baseline side that
        extrapolation is a factor of eight in (b+w): enumerated to b+w = 62,
        evaluated at b+w = 506. The producer discloses this transfer assumption
        explicitly and states it cannot be tested by this package. Graded low
        only because it is disclosed, labelled and structurally motivated; any
        downstream record citing 92.86 or 19.63 must carry the same label.
    - id: V-8
      grade: low
      class: unverified_inference_binding
      statement: >-
        Lane A's inference block is present (repairing BATCH-973b49's D-V5) but
        is not a verified readback: AUTORESEARCH_POLICY and AUTORESEARCH_BACKEND
        were unset, so the resolved backend cannot be named and model_verified
        status is unknown. The producer discloses this rather than papering over
        it, and correctly notes that every number is a deterministic enumeration
        reproducible by any model or none -- which my rebuild confirms.
