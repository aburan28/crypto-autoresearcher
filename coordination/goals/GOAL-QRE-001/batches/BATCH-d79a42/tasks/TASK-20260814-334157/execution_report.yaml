  infrastructure_failures: []
  unexpected_observations:
    - >-
      The worst-case iteration count is EXACTLY 2n-1 at all 28 primes tested
      (n = 3..16), never less. The bound derived in D2 is therefore tight rather
      than merely valid, which was not anticipated and is worth a reviewer's
      attention because it means the fixed K = 2n circuit wastes exactly one
      iteration and no more.
    - >-
      Removing the Hamming-weight dependence and reducing the asymptotic order
      turned out to be the SAME step, not two: the count is a function of n
      alone precisely because the loop length is a constant 2n rather than a
      function of the exponent's bit pattern (derivation D3). This was not
      obvious in advance and the pre-registration treated the two questions as
      separable (clauses 4 and 6.5 keep them apart, correctly, since the
      converse does not hold).

  # ------------------------------------------------------------- blind by design
  blind_by_design:
    instructed_to_work_blind: true
    statement: >-
      This task was INSTRUCTED to work blind to specific published reversible
      modular inverters, by design and by declaration, not by error. FILED PRIOR
      ART ON THIS EXACT SUBJECT EXISTS IN THIS PROGRAM'S OWN KNOWLEDGE CORPUS:
      the batch queue's filed_sources_inventory names KN-LIT-771 (reversible
      modular inversion by reformulating the binary Euclidean algorithm) and
      KN-LIT-1882 (EEA-based space-efficient reversible modular inversion). Both
      are filed and on point. Neither was read, and nothing under
      knowledge/literature/ was read, while deriving, building, counting or
      validating the construction reported here. That is an independence
      condition for GOAL-QRE-001 completion criterion 2, which requires this
      program's own independent count.
    explicitly_not_claimed: >-
      This is NOT a claim that no prior art exists for reversible modular
      inversion, and no artifact of this task contains such a sentence.
      CORR-20260813-1a06db records that exact false negative as an error this
      program has already made once. Prior art is filed, is known to exist, and
      was set aside by instruction.
    consequence_for_novelty: >-
      Nothing here is a novelty claim. No comparison against any published
      construction is made anywhere in this package, and the only baseline
      compared against is this program's own EV-QRE-45dfe1. Whether this
      construction is better, worse, or identical to the filed prior art is
      UNKNOWN to this task by construction and is a question for whoever reads
      those sources.
    lane_b_isolation: >-
      coordination/goals/GOAL-QRE-001/batches/BATCH-d79a42/tasks/TASK-20260814-9081e8/
      was not read, per the handoff read-scope restriction, although it was
      committed to the branch while this task ran.

  # ------------------------------------------------------------------ scope
  boundaries:
    - >-
      Scoped to the frozen convention: gate set {X, CNOT, CCX}, T = 7 * Toffoli,
      all ancillas clean and returned, no measurement or feedforward, no
      borrowed ancilla, unwindowed accumulate loop, no constant-specialised
      adder. A different convention gives different numbers and none of these
      transfer to one.
    - >-
      Tested parameters, stated in full because the headline figure is at a
      width that was not tested: SIMULATED at n = 4..14, 16, 18, 20, 22, 24, 28,
      32 for the inverter alone and n = 4..14 for the full point addition, over
      two primes per width. ENUMERATED but not simulated at n = 15, 16, 20, 24,
      32 for point addition. Only EVALUATED FROM A CLOSED FORM at n = 256.
      The transfer assumption from the tested range to n = 256 is exactly this:
      that a closed form with residual 0 at every enumerated width continues to
      hold beyond them. That assumption is not itself tested and cannot be
      tested by this package.
    - >-
      The point-addition domain is x1 != x2 AND x3 != x2, inherited verbatim
      from BATCH-973b49's D-1 refinement. Doubling, the point at infinity and
      the other exceptional cases are outside it on both sides. The inverter's
      own domain is 1 <= x < p with p an odd prime; x = 0 is outside it, and the
      construction returns garbage there rather than a flag.
    - >-
      EXCLUDED FROM EVERY NUMBER ON BOTH SIDES: QFT, phase estimation,
      measurement, error correction, magic-state distillation, routing, layout.
      These are arithmetic-layer counts, not resource estimates.
    - >-
      GOAL-QRE-001's absolute prohibition binds every downstream use of these
      numbers: nothing in this package is a statement about hardware, no date,
      timeline, schedule, arrival probability or decision appears in it, and
      none may be derived from it.

  interpretation_boundary: >-
    OBSERVATIONS ONLY. This report does not conclude that the new inverter is
    better, does not declare any hypothesis supported or rejected, does not
    declare completion criterion 4 unblocked, does not change any status, and
