  # ---------------------------------------------------------- what was built
  construction:
    family_built: >-
      Binary extended Euclidean algorithm (binary GCD) in Kaliski/Montgomery
      form: the classical two-phase algorithm's PHASE 1 recurrence on
      (u, v, r, s), realised as a fixed-length reversible circuit.
    which_of_the_two_declared_families: >-
      PREREGISTRATION section 2 permits either a binary-EEA inverter or a
      Kaliski-style Montgomery inverse and requires the producer to state which
      was built and why the other was not attempted. What was built is properly
      described as BOTH and neither exclusively: the iteration is Kaliski's
      phase-1 binary-EEA recurrence, so the two declared families coincide at
      the level of the loop. They differ only in phase 2, the Montgomery-factor
      correction. The plain binary-EEA presentation avoids phase 2 by tracking
      a different quantity; the Kaliski presentation performs it as a second
      loop. This construction takes the Kaliski loop and then does NOT build a
      correction phase at all, because derivation D4 (below) shows the
      correction is absorbable into a classical initialisation constant. The
      honest statement is therefore: the Kaliski phase-1 loop was built, the
      Kaliski phase-2 loop was deliberately not built because it was shown
      unnecessary under this convention, and no third variant was attempted.
    derivation_summary:
      - "D1 INVARIANT. After k iterations from (u,v,r,s) = (p,x,0,1):
         r*x = -u*2^k (mod p) and s*x = v*2^k (mod p). Established branch by
         branch in the docstring of src/euclid.py."
      - "D2 FIXED STEP COUNT. Phi = bitlength(u) + bitlength(v) starts at most
         2n, falls by at least 1 per iteration, and equals 1 at the terminal
         state (u,v) = (1,0); hence v = 0 within 2n-1 iterations. The circuit
         runs a FIXED K = 2n iterations on every input. This is exactly
         PREREGISTRATION clause 1.4's pre-registered resolution of the
         data-dependent-iteration tension: a worst-case-bounded fixed step
         count, the analogue of Fermat's fixed-length chain. Verified
         exhaustively over every x in [1,p) for two primes per bit length,
         n = 3..16: the worst case is EXACTLY 2n-1 at every one of those 28
         primes, and u = 1 at termination in every case."
      - "D3 THE POST-TERMINAL STEPS CANCEL THE ITERATION COUNT. Once v = 0 the
         state has u = gcd(p,x) = 1, which is odd, so every further iteration
         takes the v-even branch: v stays 0, r doubles. After the full fixed K
         iterations r*x = -2^K (mod p) with K = 2n a classical constant. The
         data-dependent k has cancelled, so the circuit needs NO iteration
         counter and NO v != 0 flag."
      - "D4 PHASE 2 IS FREE. The (r,s) updates are linear in (r,s) and the
         branch decisions depend on (u,v) only, so r_K is linear in s_0.
         Initialising s_0 = -2^{-K} mod p, a classical constant loaded by X
         gates, gives r_K = x^{-1} mod p directly. The Montgomery-factor
         correction phase of the classical algorithm costs ZERO gates here."
      - "D5 CLEANLINESS. Eight one-bit control records per iteration (16n bits
         total, LINEAR in n) are kept, not uncomputed in the loop, and cleared
         by replaying the inverse of the whole phase-1 block after the answer is
         copied out -- the same shape as the inherited Fermat mod_inv. Every
         wider scratch register is released inside the iteration and reused."
    per_iteration_toffoli_derived: 48*n + 44
    inverter_toffoli_derived: "2 * K * (48n+44) = 192n^2 + 176n"
    every_constant_derived: >-
      Every constant in every reported closed form is derived from the
      construction in src/euclid.py and independently confirmed by exact
      enumeration with zero residual at every fitted AND every held-out width.
      No constant is cited from any publication. The single REUSED constant is
      T = 7 * Toffoli, reused rather than re-derived under the explicit
      permission of PREREGISTRATION clause 1.2; see defect D-4.

  # ---------------------------------------------- same instrument, same builder
  instrument:
    statement: >-
      Both sides of every comparison are counted with BATCH-973b49's own
      builder, counter and Machine. src/euclid.py imports
      BATCH-973b49/tasks/TASK-20260813-c99166/src/circuits.py and adds the new
      inverter alongside the Fermat one; it modifies no inherited sub-circuit.
      The adder, mod_add, mod_dbl, modmul_acc, point_add and Machine used here
      are that module's own objects.
    substitution_mechanism: >-
      point_add resolves the name `mod_inv` from its own module globals at call
      time, so src/euclid.py::point_add_euclid rebinds that ONE name for the
      duration of the call and executes circuits.point_add's source unmodified.
      Nothing else in the point-addition structure -- coordinate subtractions,
      slope multiplication, uncomputation of lambda, the capture/replay pattern
      -- is touched. This is stated plainly because a name rebinding is easy to
      miss on review; a reviewer should check src/euclid.py::point_add_euclid.
    baseline_re_enumerated_not_assumed: >-
      EV-QRE-45dfe1's Fermat point-addition closed form was RE-CHECKED against a
      live enumeration of the inherited circuit at all 32 (n,p) pairs in
      baseline_comparison.json; all residuals are exactly 0. It is used as a
      convenience, never as an unchecked citation.

  # ---------------------------------------------------------------- results
  observations:
    - id: OBS-1
      label: new inverter, Toffoli and width, measured
      statement: >-
        The derived binary-EEA inverter costs Toffoli(n) = 192n^2 + 176n, T(n) =
        7 * that, peak_qubits = 24n + 7, ancilla_qubits = 22n + 7, io_qubits =
        2n. Exact rational interpolation on the fitted widths reproduces every
        enumerated point with residual EXACTLY 0 at all 14 fitted widths
        (n = 4..14, 16, 18, 20) and all 4 pre-registered held-out widths
        (n = 22, 24, 28, 32), for BOTH primes at every width -- 36 (n,p) pairs.
      status: enumerated
    - id: OBS-2
      label: point addition with the new inverter, measured
      statement: >-
        One elliptic-curve point addition with the new inverter substituted into
        the inherited builder costs Toffoli(n) = 868n^2 + 806n + 10, T(n) = 7 *
        that, peak_qubits = 26n + 7, ancilla_qubits = 24n + 7. Residual exactly 0
        at all 11 fitted widths (n = 4..14) and all 5 pre-registered held-out
        widths (n = 15, 16, 20, 24, 32), for both primes -- 32 (n,p) pairs.
        Derived independently as 4(192n^2+176n) + 5(20n^2+10n-8) + 50(n+1) + 2n,
        the four inverter replays being the two inversion sites each replayed
        forward and inverted by the inherited point_add.
      status: enumerated
    - id: OBS-3
      label: the Hamming-weight dependence is gone from the Toffoli and width axes
      statement: >-
        The new point-addition Toffoli count, T count, peak_qubits and
        ancilla_qubits are FUNCTIONS OF n ALONE. Measured with two primes per
        bit length chosen for the LOWEST and the HIGHEST Hamming weight of p-2
        among the 40 largest primes of that length: at every one of the 16
        widths the two primes give bit-identical Toffoli and bit-identical
        peak_qubits, while the Fermat baseline differs between them at every
        width (for example n = 10: baseline 211862 vs 295542 Toffoli for
        w = 4 vs w = 9; new side 94870 for both). The mechanism is that the
        circuit runs a fixed K = 2n iterations whose gate content does not
        branch on p, and p enters only as a classical constant loaded by X and
        CNOT gates, which emit no Toffoli.
      what_still_depends_on_p: >-
        The CNOT and X counts do still depend on the Hamming weights of the
        classical constants loaded (p itself, s0 = -2^{-2n} mod p, and the
        conditional constant addends inside the inherited mod_add and mod_dbl).
        They are reported per row and not fitted, exactly as the baseline's
        were. So the answer to the batch's secondary question is: the
        Hamming-weight dependence in Toffoli(n,b,w) was an ARTIFACT OF
        EXPONENTIATING BY p-2 on the Toffoli and width axes, and is not present
        in this Euclidean construction; it survives on the Clifford axes, where
        it is a property of loading a classical constant and not of the
        inversion algorithm.
      status: enumerated
    - id: OBS-4
      label: comparison against the frozen Fermat baseline, per axis, verdict stated
      statement: >-
        TOFFOLI and T: the new side is worse at 3 of 32 enumerated (n,p) pairs
        and better at the other 29. It is worse at n = 4 for both primes
        (17122 vs 13282 and 17122 vs 16098) and at n = 5 for the low-weight
        prime p = 19 (25740 vs 24700); it is better at every (n,p) pair with
        n >= 6, and at n = 5 for the high-weight prime.
        PEAK QUBITS and ANCILLA QUBITS: the new side is WORSE at 18 of 32 pairs
        and better at 14. It is worse at every pair with n <= 11, worse at the
        low-weight prime and better at the high-weight prime at n = 12 and
        n = 13, and better at every pair with n >= 14. The crossover on the
        width axis is later than on the Toffoli axis because the baseline's peak
        width n(b+w)+5n+5 only overtakes the new side's 26n+7 once b+w exceeds
        about 21, i.e. once n is around 14.
      per_axis_not_netted: >-
        These are scored independently and are NOT combined into a single
        verdict, per PREREGISTRATION clauses 6.2 and 6.3. In the band
        n = 6..11 the result is a genuine TRADE-OFF and must be reported as one:
        fewer Toffolis, more qubits.
      status: enumerated
    - id: OBS-5
      label: closed-form-only evaluation at n = 256, both sides, every axis
      statement: >-
        At n = 256 with p the largest prime below 2^256 (b = 256, w = 250 --
        the same prime BATCH-973b49 used), evaluating both closed forms:
        new side Toffoli 57,091,594; T 399,641,158; peak_qubits 6,663;
        ancilla_qubits 6,151.
        Fermat baseline Toffoli 5,301,692,426; T 37,111,846,982;
        peak_qubits 130,821; ancilla_qubits 130,309.
        Ratios baseline/new: 92.86 on Toffoli and T, 19.63 on peak_qubits,
        21.19 on ancilla_qubits. Both sides use io_qubits = 512.
      status: evaluated_from_closed_form
      labelling: >-
        MODELED, NOT MEASURED. Both numbers are arithmetic on closed forms that
        reproduce every enumerated width with zero residual. Neither was
        enumerated at n = 256 and neither was simulated at n = 256. The largest
        SIMULATED width on the new side is n = 32 for the inverter alone and
        n = 14 for the full point addition; the largest ENUMERATED width is
        n = 32 on both sides.
      optimistic_assumptions_restated_here: >-
        Every one of these four numbers inherits, unchanged, the frozen
        convention's exclusions: QFT, measurement, error correction, magic-state
        distillation, routing and layout are all OUTSIDE the count on both
        sides, as is any exceptional-case branch of the group law. T = 7 *
        Toffoli is one Toffoli implementation, not a lower bound; constructions
        with fewer T per Toffoli exist and are neither used nor cited. The
        accumulate loop is unwindowed and the adders are not
        constant-specialised on either side. These are an arithmetic layer, not
        a resource estimate.
    - id: OBS-6
      label: validation outcome
      statement: >-
        4,232 circuit instances simulated across 58 configurations, zero
        failures, every ancilla verified returned to |0> by the global
        end-of-circuit assertion. Inverter validated at all 18 declared widths
        (n = 4..14, 16, 18, 20, 22, 24, 28, 32), exhaustively over every x in
        [1,p) for p < 600 and on a seeded sample plus the edge inputs
        {1, 2, p-1, (p-1)/2} above that. Point addition with the new inverter
        validated at all 11 point-addition ladder widths (n = 4..14),
        exhaustively over the whole declared domain for p < 600. The
        point-addition held-out widths 15, 16, 20, 24, 32 were enumerated and
        NOT simulated, exactly as BATCH-973b49's holdouts were not.
      status: measured
    - id: OBS-7
      label: negative control, and it did NOT come out clean
      statement: >-
        The mutation named in advance (PREREGISTRATION section 5: exchange which
        of the two mutually exclusive update rules fires when the controlling
        bit is 0 versus 1) was applied to the finished circuit at 20
        configurations. (a) The gate tally was BIT-IDENTICAL -- x, cnot, ccx and
        peak_qubits all unchanged -- at every one of the 20 configurations,
        matching the pre-registered expectation and reproducing KN-FIND-a4d4a4's
        mechanism in a second, structurally different circuit. (b) The semantic
        + global-ancilla check flagged the mutation on 1,808 of 1,822 tested
        inputs, an overall fraction of 0.9923. (c) THE FRACTION IS NOT 1.0. Ten
        of the 20 configurations had at least one input on which the mutated
        circuit was NOT caught; the worst was point addition at n = 4, p = 11,
        where only 4 of 6 domain inputs were caught (0.667).
      required_reporting_per_clause_5c: >-
        Reported as a finding about the negative control's sufficiency, NOT
        suppressed and NOT replaced with a mutation that is caught more
        reliably. See defect D-1.
      status: measured

  # -------------------------------------------------------------- comparison
  comparison_against_frozen_prediction:
    frozen_prediction_reference: >-
      PREREGISTRATION.md section 6, frozen at commit b3f6dad. It states no
      numeric prediction. Clause 6.4 pre-registers only the qualitative
      expectation that "it is not obvious the new inverter wins", and clause 5
      pre-registers the expectation that the mutation does not change the gate
      tally.
    scored_exactly_as_specified: true
    outcomes:
      clause_5a_tally_unchanged_by_mutation: "predicted unchanged; MEASURED
        unchanged at 20 of 20 configurations"
      clause_6_which_side_wins: "no numeric prediction to score; measured
        outcome is OBS-4 -- new side better on Toffoli/T at 29 of 32 pairs and
        worse at 3, worse on peak/ancilla width at 18 of 32 pairs and better at
        14"
    tail_checks:
      holdout_residuals: >-
        PREREGISTRATION clause 4's residual criterion is EXACTLY 0 with no
        tolerance. Met: every closed form reported as exact has residual 0 at
        every fitted and every held-out width, in exact integer arithmetic.
        Inverter holdouts n = 22, 24, 28, 32: residual 0. Point-addition
        holdouts n = 15, 16, 20, 24, 32: residual 0. No approximate fit needed
        to be reported for the new side.
      adversarial_prime_pair: >-
        Clause 3.2's low-weight/high-weight prime pair was used at every width
        on both sides, and is what makes OBS-3 a measurement rather than an
        assumption.
      edge_inputs: >-
        x in {1, 2, p-1, (p-1)/2} forced into every sampled inverter
        configuration in addition to the seeded sample.
    no_rescoring: >-
      Nothing was re-scored against an adjusted prediction, and no prediction
      was adjusted. Every run performed is reported; no run was discarded.

  # ------------------------------------------------------- defects and gaps
  defects:
    - id: D-1
      severity: moderate
      class: negative_control_insufficiency
      statement: >-
        THE PRE-REGISTERED NEGATIVE CONTROL IS NOT CAUGHT ON EVERY INPUT. The
        named mutation was flagged on 1,808 of 1,822 inputs (0.9923); ten
        configurations had uncaught inputs, worst 4/6 at point addition
        n = 4, p = 11. Mechanism, stated because it is checkable and not
        speculative: the two swapped branches are BOTH gated on "u odd AND v
        odd", so on any input whose entire 2n-iteration trajectory never
        reaches a state with u and v both odd, the swap is a no-op and the
        mutated circuit is exactly the unmutated one. Such inputs exist and are
        commonest at the smallest widths, where trajectories are shortest.
        CONSEQUENCE FOR HOW OBS-6 MAY BE READ: the validation is shown able to
        return the other answer, which is what clause 5 requires of it, but the
        per-input catch rate is a property of the input as well as of the check,
        so "caught 99.2% of inputs" must not be restated as "catches 99.2% of
        defects". A defect that is a no-op on some inputs is undetectable on
        those inputs by any input-driven check.
      recorded_not_repaired: >-
        No substitute mutation with a higher catch rate was run in its place;
        clause 5(c) forbids exactly that.
    - id: D-2
      severity: low
      class: inherited_conservatism_in_the_reported_count
      statement: >-
        THE REPORTED COUNT IS LOOSE IN A WAY THIS TASK CHOSE NOT TO TIGHTEN,
        AND THE DIRECTION IS AGAINST THIS TASK'S OWN CONSTRUCTION. The
        comparison u > v is implemented as a full inherited ripple subtraction,
        a sign-bit copy-out, and a full add-back, costing 4(n+1) Toffoli per
        iteration. A dedicated comparator that runs only the carry (MAJ) chain
        and reverses it would cost 2(n+1) and compute the same bit. That variant
        was NOT built, NOT counted, and NO number is claimed for it here; the
        reported 868n^2 + 806n + 10 stands as the measured cost of what was
        actually built. Recorded so that the reported figure is not mistaken for
        the best this construction admits, and recorded in this direction
        deliberately: the loose choice was made because it reuses frozen
        primitives verbatim, and it errs against the new side.
    - id: D-3
      severity: low
      class: inherited_structural_inefficiency_deliberately_not_repaired
      statement: >-
        Both sides inherit the point_add structure in which an inversion block
        is replayed forward AND inverted around each inversion site, which is
        the candidate factor-1.997 inefficiency the BATCH-973b49 Red Team
        reported as an exploratory, non-evidential observation. This task
        inherited it VERBATIM on both sides rather than repairing it, because
        repairing it would have changed the instrument and destroyed
        comparability with EV-QRE-45dfe1, which is the deliverable. It inflates
        both sides by the same structural factor and therefore does not move any
        ratio in OBS-4 or OBS-5, but it does inflate both absolute numbers.
        Not repaired here; not this task's call.
    - id: D-4
      severity: low
      class: constant_reused_not_re_derived
      statement: >-
        T = 7 * Toffoli was REUSED from BATCH-973b49's derivation, not
        re-derived by this task. PREREGISTRATION clause 1.2 explicitly permits
        this and states that treating it as re-derived rather than reused would
        itself be the defect. It is recorded here as reused, in the artifacts as
        reused, and its status field in inverter_counts.json reads
        "REUSED, not re-derived".
    - id: D-5
      severity: low
      class: inherited_unrepaired_defect
      statement: >-
        BATCH-973b49's D-V2 is inherited and load-bearing here: the allocator's
        DirtyAncilla guard is vacuous inside capture(), and this construction
        builds its ENTIRE phase-1 block inside capture(). This task therefore
        relies on the global end-of-circuit assertion that every qubit outside
        the declared I/O registers is 0, and says so in inverter_validation.json
        rather than claiming mechanical enforcement. The guard is non-vacuous
        for the final release of the kept registers, which happens outside
        capture, and it did fire during the negative control (counted in that
        artifact's breakdown as dirty_ancilla_exception_at_release).
    - id: D-6
      severity: low
      class: inherited_unrepaired_defect
      statement: >-
        BATCH-973b49's D-V4 is inherited: "validation is blocking" is
        procedural, not mechanised -- run_comparison.py does not read
        inverter_validation.json and would emit counts for a width whose
        simulation had failed. Moot at zero failures, and stated in
        inverter_validation.json rather than left implicit. Not repaired.

  preregistration_gaps:
    - id: G-1
      statement: >-
        THE FROZEN DOCUMENT ASSUMED A BASELINE NUMBER THAT DOES NOT EXIST.
        Clause 6.1 requires peak_qubits to be reported "on both sides" at every
        width including n = 256, treating the baseline side as available from
        EV-QRE-45dfe1. It is not: EV-QRE-45dfe1 published only a fit in n alone
        for the baseline peak width, which cannot be exact because the Fermat
        chain holds b+w-2 registers of n qubits, and DEC-20260813-5cef9c records
        that the 256-bit block omitted peak_qubits entirely. To fill the column
        rather than leave the unfavourable-for-the-baseline cell blank, this
        task DERIVED an exact baseline peak-width form itself, in the basis
        [n(b+w), n, 1], obtaining n(b+w) + 5n + 5 with residual exactly 0 at all
        32 enumerated baseline pairs. Recorded as a gap in the frozen document,
        not written into it. A reviewer should treat that baseline form as this
        task's own derivation about the inherited circuit, and check it.
    - id: G-2
      statement: >-
        THE FROZEN DOCUMENT DID NOT DECLARE A CURVE-POINT ENUMERATOR, AND THE
        INHERITED ONE DOES NOT REACH THE DECLARED LADDER. Clause 3.3 says the
        curve and constant point Q are reused from BATCH-973b49's builder, which
        they are; but that batch's validation enumerates curve points in O(p^2),
        which does not reach the point-addition ladder's upper widths within any
        reasonable budget. This task wrote an O(p) enumerator and CROSS-CHECKED
        it against the inherited O(p^2) one at p = 11, 13, 31, 61, 127, obtaining
        identical point sets. The enumerator is test scaffolding and is not part
        of any counted circuit. Recorded as a gap, not written into the frozen
        document.
    - id: G-3
      statement: >-
        Clause 3.1 declares n = 256 as a closed-form-only evaluation point for
        comparability, but does not say which side's closed form supplies the
        baseline's peak width. Resolved by G-1. Recorded separately because a
        reviewer reading clause 3.1 alone would not see the hole.

