  - >-
    That the n=2048 and n=256 figures describe a circuit anyone built. They are
    closed-form evaluations, correctly labelled as such; I recomputed the
    arithmetic and verified the labels, nothing more.
  - >-
    Optimality or competitiveness of either construction against any published
    construction. Out of scope and not claimed.
  - >-
    The producer's runs_attempted_and_superseded narrative -- two earlier
    run_counts.py invocations at narrower ladders, one earlier run_validation.py,
