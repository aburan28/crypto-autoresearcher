  heuristic_validation_checks:
  - status: not_applicable
    reason: >-
      This task validates no heuristic in the sense of docs/target-result-profile.md.
      There is no probabilistic prediction, no distribution to compare against, no
      correspondence substituting for direct sampling. The randomness present is
      confined to selecting WHICH inputs to simulate (seed 20260813, recorded in
      the manifest and in each entry), and every circuit is deterministic. The
      analogous obligation -- a pre-registered prediction independent of the data
      -- is discharged by PREREGISTRATION clause 7 fixing every sub-circuit and
      predicting the w-dependence before any count, and I confirmed the predicted
      form reproduces every enumerated point.
  cost_model_checks:
  - check: cost unit declared
    result: PASS
    detail: >-
      Units are declared and unambiguous throughout: Toffoli gates, T gates,
      X gates, CNOT gates, peak qubits, ancilla qubits. counts.json gate_set names
      the gate set and measurement_status distinguishes enumerated from
      closed_form from evaluated_from_closed_form.
  - check: memory reported alongside time
    result: PASS
    detail: >-
      Qubit counts are reported beside gate counts at every row -- peak_qubits,
      io_qubits, ancilla_qubits -- with their own closed forms (6n+6 for modexp,
      quadratic for EC) and their own residuals. The quadratic ancilla footprint
      of the Fermat inverter is stated as a declared property of the construction
      in advance (PREREGISTRATION clause 7) and again in could_not_be_derived.
  - check: optimistic assumptions flagged
    result: PASS
    detail: >-
      T = 7 x Toffoli is declared an upper bound, not an optimum, with the
      explicit note that smaller-T constructions are recalled to exist and are
      deliberately neither used nor cited. The EC count is declared the cost of
      THIS inverter and an upper bound. Excluded overheads (QFT, phase estimation,
      measurement, error correction, routing, exceptional cases) are enumerated in
      advance rather than discovered later.
  - check: per-attempt cost x inverse success probability
    result: not_applicable
    detail: >-
      No success probability enters an arithmetic-layer gate count; these circuits
      are deterministic and succeed by construction on their declared domain.
      There is no expected-cost bookkeeping to check, and correctly none is
      claimed.
  proof_architecture_checks:
  - check: baseline fixture / exact reproduction rather than close numerical fit
    result: PASS
    detail: >-
      Every closed form is checked by EXACT rational arithmetic (Fraction
      interpolation, integer residuals), not by a numerical fit. I recomputed all
      17 modexp and all 32 EC residuals in exact integer arithmetic myself and got
      exactly zero. The one place a float appears -- the T-ratio unitary check --
      is the one place a discrepancy shows (finding D-V1), and I closed it with an
      exact check over Z[zeta_8].
  - check: strictness / improvement claim
    result: not_applicable
    detail: >-
      No improvement over anything is claimed. There is no baseline in the
      package, deliberately, because no resource-estimation paper is filed.
  - check: bounded search bound to its enumerated scope
    result: PASS
    detail: >-
      Every reported quantity names its exact scope: the width ladder, the fit vs
      holdout split, the specific moduli, primes, curve constants and points, the
      declared domain of correctness, and which widths were simulated versus only
      counted. Nothing is stated as holding beyond what was enumerated.

