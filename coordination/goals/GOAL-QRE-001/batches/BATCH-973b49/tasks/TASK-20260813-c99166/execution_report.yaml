  write_scope: coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/
  status: completed
  outcome_class: observation
  summary: >-
    Two reversible circuits were constructed from an X/CNOT/CCX gate set,
    counted by exact enumeration over a ladder of bit widths, and validated by
    classically simulating the identical gate stream at small widths. Every
    constant in both reported closed forms is derived from the construction
    and re-checked against the enumeration; none is taken from any
    publication. Observations only: no interpretation, no comparison against
    any published total (none is filed), no status change.

  provenance:
    git_commit_at_start: 5fa40e21de534100449eb03506e3d4840df8b869
    working_tree_at_start: clean
    working_tree_at_end: >-
      dirty only by this task's own untracked artifact directory
      (coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/); no
      tracked file was modified, and nothing was committed. The Coordinator
      snapshot task TASK-20260813-884e20 commits these artifacts.
    preregistration_frozen_before_any_count: true
    preregistration_freeze_evidence: >-
      PREREGISTRATION.md was written and its convention fixed before
      src/circuits.py, src/run_counts.py and src/run_validation.py existed;
      it records the same commit and clean-tree state above.

  environment:
    python: 'CPython 3.11.15 (main, Mar  3 2026, 09:26:23) [GCC 13.3.0]'
    platform: Linux 6.18.5-fc-v20 x86_64
    third_party_dependencies: none
    dependency_note: >-
      numpy is not installed in this environment; it was not needed. The
      8x8 unitary check for the T-per-Toffoli ratio uses Python's built-in
      complex arithmetic. This is recorded as an environment fact, not as a
      blocked step.
    cpu_cores_available: 4
    memory_available_gb: 15
    peak_process_memory: not instrumented; all runs are single-process Python
      over integer lists and stayed far below the 4 GB cap (largest structure
