  seeds:
    validation_sampling_seed: 20260813
    randomness_sources: >-
      one, random.Random(20260813) in src/run_validation.py, used only to
      choose which exponents and which curve points are tested. Circuit
      construction and counting are fully deterministic and use no randomness.
      All moduli, primes, bases and curve constants are selected by fixed
      deterministic rules recorded in src/run_counts.py and stored in the
      artifacts.

  runs:
    - run: R1-derivations
      command: python3 src/derive_identities.py
      purpose: >-
        derive, rather than cite, (i) the two algebraic identities the in-place
        point addition depends on and (ii) the T-per-Toffoli ratio
      exit_code: 0
      wall_clock_seconds: 2.3
      outcome: completed_valid
      artifacts: [logs/derive_identities.json, logs/derive_identities_time.log]
      result: >-
        311472 point-addition identity instances checked over 12 primes and all
        nonsingular short Weierstrass curves sampled, zero mismatches; the
        exhibited Clifford+T circuit with exactly 7 T/Tdg gates reproduces the
        Toffoli permutation matrix with maximum absolute deviation 3.14e-16
        against a declared tolerance of 1e-12.
    - run: R2-counts
      command: python3 src/run_counts.py
      purpose: exact enumerated counts vs n for both circuits plus closed forms
      exit_code: 0
      wall_clock_seconds: 144.3
      outcome: completed_valid
      artifacts: [counts.json, logs/counts_stdout.log, logs/counts_stderr.log]
    - run: R3-validation
      command: python3 src/run_validation.py
      purpose: blocking classical simulation of the identical circuits
      exit_code: 0
      wall_clock_seconds: 60.6
      outcome: completed_valid
      artifacts:
        [validation.json, logs/validation_stdout.log, logs/validation_stderr.log]
    - run: R4-audit
      command: python3 src/check_artifacts.py
      purpose: cross-artifact consistency and prohibition audit
      exit_code: 0
      wall_clock_seconds: 0.03
      outcome: completed_valid
      artifacts: [logs/check_artifacts.json]
      result: >-
        all six checks pass; 22 cross-artifact count matches; every
        prohibition-scan hit lies inside an explicit "this artifact contains
        no ..." disclaimer.
  runs_attempted_and_superseded:
    - >-
      Two earlier invocations of src/run_counts.py were made during
      development, at narrower ladders (modexp to n=48, EC to n=16). Their
      numbers agree exactly with the final run at every shared width; they
      were superseded solely to widen the ladder and to make the
      enumeration-ceiling wording in counts.json computed rather than
      hard-coded. One earlier invocation of src/run_validation.py at narrower
      input coverage likewise passed at every configuration it tested. No run
      was discarded for producing an unwelcome result, and no result changed.
    - >-
      Three development runs failed before any count was produced, all
      implementation errors and none a measurement: (a) a scratch smoke-test
      script released input registers as if they were ancillas and hit the
      allocator's cleanliness guard -- a defect in the test script, not in a
      circuit; (b) the first end-to-end point-addition simulation, deviation
      D-2, the one genuine circuit defect; (c) src/run_counts.py raised
      ValueError from a sub-circuit table entry that chose a multiplier not
      coprime to its modulus -- a driver defect, fixed by selecting the
      multiplier with the same coprimality rule used elsewhere. None of the
      three produced a count.

  certificate:
    kind: none
    reason: >-
      This is a pure measurement (gate-counting) task. It claims no
      discrete-log solve and no factor-base relation, so no solution
      certificate applies. The analogue of certificate discipline here is the
      blocking simulation in validation.json, where an independent check of
      the circuit's output value and of ancilla cleanliness is applied to the
      same gate stream that is counted.

  budget_accounting:
    wall_clock_budget_seconds: 3000
    wall_clock_used_seconds_measured: 207.2
    wall_clock_note: >-
      sum of the four reported runs; agent-side wall clock including
