  deviations:
    - id: D-1
      kind: declared-domain refinement
      description: >-
        PREREGISTRATION clause 6 declares the point-addition domain as
        x1 != x2. The construction additionally requires x3 != x2 (equivalently
        P != -2Q), because it uncomputes the slope lambda through a second
        modular inversion of (x3 - x2). The frozen clause was NOT edited. The
        refinement is recorded here, restated in counts.json
        (circuit_b_ec_point_addition.declared_domain) and in validation.json,
        and inputs violating it are excluded from validation and counted in
        validation.json as excluded_by_declared_domain.
      effect_on_counts: none; the gate count does not depend on the input value
    - id: D-2
      kind: implementation defect found and fixed BEFORE any count was produced
      description: >-
        The first end-to-end simulation of the point addition failed with a
        DirtyAncilla error. Cause: a register that must stay live across a
        captured-and-replayed block (the slope register) was allocated after
        the capture, so it aliased qubits the replayed block writes to. Fixed
        by allocating every long-lived register before the capture; the fix is
        commented at the site in src/circuits.py. Recorded because it is the
        clearest evidence in this package that the blocking simulation is load
        bearing: the defect is invisible to gate counting and was caught only
        by executing the identical circuit.
      effect_on_reported_counts: >-
        none; no count was produced before the fix, and every reported count
        comes from the fixed construction, which validates at every declared
        width.
    - id: D-3
      kind: scope note on the enumeration ceiling
      description: >-
        Counts are enumerated gate-by-gate up to n=128 (modular
        exponentiation) and n=32 (point addition). The values reported at
        n=2048 and n=256 are the derived closed forms evaluated at those
        widths, labelled evaluated_from_closed_form in counts.json, and are
        arithmetic rather than measurements. They are not validated by
        simulation at those widths and are not claimed to be.

  could_not_be_derived:
    - >-
      A Euclid/Kaliski-style reversible modular inverter. The point addition
      uses Fermat inversion (x^(p-2) mod p) instead. Consequence, stated in the
      artifacts: the EC Toffoli count is the cost of THIS inverter and is an
      upper bound for a point addition, and its ancilla footprint is quadratic
      in n (2n^2 + 4n + 5 qubits on the fitted ladder) rather than linear.
      Deriving a linear-ancilla inverter is a separate construction task and
      was not attempted here.
    - >-
      Any Toffoli decomposition with fewer than 7 T gates. Such constructions
      are recalled to exist but this task may not import a constant it has not
      derived, so none is used and none is cited. T = 7 * Toffoli is therefore
      an upper bound under the frozen convention, not an optimum.
    - >-
      T-depth, T-width, measurement-and-feedforward and catalysed
      constructions. Not derived, not counted, not claimed.
    - >-
      Any comparison with a published total. No resource-estimation paper is
      filed for this goal, so none exists to compare against; that comparison
      is out of this task's scope by constraint.

  observations:
    - >-
      Under the frozen convention the modular exponentiation circuit
      (RSA shape, n-bit modulus, 2n-bit exponent register) costs exactly
      Toffoli(n) = 40n^3 + 50n^2 and T(n) = 280n^3 + 350n^2, with peak qubits
      6n + 6. Enumerated at 17 widths from n=4 to n=128; all residuals against
      the closed form are exactly zero, including at the six held-out widths
      not used to fit it.
    - >-
      The modular-exponentiation Toffoli and T counts are independent of the
      modulus and base: at n=8 and n=12 two different (N, a) pairs give
      identical Toffoli counts and different CNOT counts. CNOT and X counts
      depend on the Hamming weights of the classical constants and are
      therefore reported per row rather than fitted.
    - >-
      Under the same convention the in-place elliptic-curve point addition
      (classical constant point, short Weierstrass curve over F_p) costs
      exactly Toffoli(n,b,w) = (8(b+w-2)+5)(20n^2+10n-8) + 50(n+1) + 2n, where
      n = bitlength(p), b = bitlength(p-2) and w = the Hamming weight of p-2.
      Enumerated at 32 (n, p) pairs from n=4 to n=32; residuals against this
      form are exactly zero at every one.
    - >-
      Because the count depends on w, no function of n alone is exact for the
      point addition. The cubic fitted over the largest-prime-per-width ladder
      is 320n^3 - 220n^2 - 266n + 202, whose residuals are zero at most ladder
      widths and non-zero at n=8, 11, 15 and 32 (relative residual up to about
      -7.9%), exactly where w departs from n-1. Both forms are reported.
    - >-
      Every one of the 26 component checks and all 22 full-circuit
      configurations passed, covering 17045 simulated circuit instances. In
      every configuration the gate tally recorded while simulating equals the
      gate tally recorded while counting, so the simulated circuit is the
      counted circuit by measurement rather than by assertion.
    - >-
      Validated widths: modular exponentiation n = 4, 5, 6, 7, 8, 9, 10, 12
      (exhaustive over all 2^(2n) exponents at n=4 and n=5, seeded random
      samples above); point addition n = 4, 5, 6, 7, 8, 9, 10, 11, 12
      (exhaustive over the whole declared domain up to n=7, seeded random
      samples above). No width failed, so no count is withheld.
    - >-
      Widths counted but not simulated: modular exponentiation n = 14, 16, 20,
      24, 32, 48, 64, 96, 128; point addition n = 13, 14, 15, 16, 20, 24, 32.
      These are enumerations of the same construction that validates below
      them, not independently validated measurements.
    - >-
      Evaluated from the closed forms at the shapes named in the objective:
      RSA-2048 shape (n=2048) gives 343,807,098,880 Toffoli, 2,406,649,692,160
      T and 12,294 qubits; the 256-bit prime-field shape gives 5,301,692,426
      Toffoli and 37,111,846,982 T for ONE point addition, for the largest
      prime below 2^256 (w = 250) computed here. Both are labelled
      evaluated_from_closed_form and neither is a measurement.

  interpretation: >-
