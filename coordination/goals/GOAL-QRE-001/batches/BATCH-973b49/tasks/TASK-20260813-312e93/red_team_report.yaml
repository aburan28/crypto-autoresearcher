red_team_report:
  id: RT-QRE-312e93
  task_id: TASK-20260813-312e93
  role: red-team
  goal_id: GOAL-QRE-001
  batch_id: BATCH-973b49
  question_id: RQ-QRE-6dba8c
  producer_task_id: TASK-20260813-c99166
  snapshot_reviewed: d931391c216a0439ed54fd48dbcc745f96c1195b
  snapshot_verification: >-
    The snapshot commit was read from git, its 17-file scope confirmed, and the
    working tree confirmed clean at review time. Only the committed object was
    reviewed. No artifact of TASK-20260813-c99166 was altered and nothing was
    committed by this task.
  inference:
    requested_policy: review-adversarial
    independent_session: true
    fallback_used: false
  scope_of_this_review: >-
    Interpretation, cost model and usefulness. The arithmetic is the
    Validator's task (TASK-20260813-13e948) and was not re-derived here except
    where a cost-model objection required a number.

  claim_under_review: >-
    That the arithmetic-layer package of TASK-20260813-c99166 -- Toffoli(n) =
    40n^3 + 50n^2 with 6n+6 qubits for a modular exponentiation of RSA shape,
    and Toffoli(n,b,w) = (8(b+w-2)+5)(20n^2+10n-8) + 50(n+1) + 2n with
    2n^2+4n+5 qubits for one elliptic-curve point addition -- can serve as the
    instrument through which GOAL-QRE-001 reproduces published totals, builds
    its sensitivity table, and states a like-for-like RSA-versus-ECDLP ratio.

  overall_verdict: >-
    The package is honest, internally consistent, reproducible, and better
    documented than most of what it will be compared against. It is also the
    wrong instrument for three of the goal's four substantive completion
    criteria as those criteria are currently wired. The producer is not at
    fault for this: the producer was told to derive every constant and to cite
    nothing, and did exactly that. The defect is in the goal-level assumption
    that an independently derived arithmetic layer is interchangeable with the
    arithmetic layer a published estimate costs, and in the premise that
    downstream headline numbers are linear in it. Both fail, and both are
    cheap to fix now and expensive to fix after acquisition.

  # ==================================================================
  # NAMED TARGET 1 -- IS THE UNIT COMPARABLE, OR PRIVATE?
  # ==================================================================
  target_1_unit_comparability:
    verdict: SUSTAINED IN PART, with the framing corrected
    what_survives: >-
      The unit is NOT private. "Toffoli count of a reversible circuit over a
      declared gate set {X, CNOT, CCX}" is a public, reproducible quantity;
      any third party can recount the same circuit and must get the same
      number, and the frozen convention states every clause needed to do so.
      The producer also refused, correctly, to compare against anything, and
      labelled the T column an upper bound rather than an optimum. On the
      narrow question the target asks -- is the number quoted in a unit
      nothing else is quoted in -- the Toffoli column passes.
    what_does_not_survive: >-
      The unit is shared; the OBJECT is not. Three clauses of the frozen
      convention each exclude, by name, the specific technique that published
      constructions use to get their constant, and together they pin the
      counted circuit to a textbook construction that no published headline
      costs: clause 4 forbids measurement and classical feedforward (which
      excludes measurement-based uncomputation, the mechanism that makes
      windowed table lookup nearly free on the uncompute side); clause 3
      forbids borrowed/dirty ancillas; clause 7 explicitly declines to
      specialise the constant adder and formulates the modular multiplication
      as an unwindowed accumulate loop. Each exclusion is declared and
      defensible under this task's derive-nothing-cited mandate. The
      consequence is not declared: what was counted is a DIFFERENT CIRCUIT,
      so a matching unit buys no comparability.
    measured_against_the_corpus: >-
      This is not a recall-based objection. KN-LIT-099 (Roetteler, Naehrig,
      Svore, Lauter; confidence `reported`, citation_verified `read`) is
      already filed in this repository with its table extracted into
      KN-TECH-037, and it counts Toffolis for a reversible prime-field point
      addition -- a substantially compatible unit. Its closed form for one
      point addition is 224 n^2 log2(n) + 2045 n^2, against this package's
      Theta(n^3). Ratio package/KN-LIT-099, computed by this reviewer from
      both closed forms: 1.7x at n=16, 3.2x at n=32, 6.0x at n=64, 11.3x at
      n=128, 21.3x at n=256, 40.9x at n=521. The gap is not a constant; it
      grows as ~n/log n, which is the signature of an exponent mismatch
      rather than a convention mismatch.
    the_t_column_is_a_separate_and_worse_problem: >-
      T = 7 x Toffoli carries exactly zero information beyond the Toffoli
      column (it is a scalar multiple of it) while carrying unbounded
      misreading risk, because published totals in this area are quoted
      either directly in Toffoli/CCZ counts or under a lower T-per-Toffoli
      convention, and some are quoted in T-DEPTH, which is not a count at
      all. The producer's own PREREGISTRATION clause 2 says all of this. The
      exposure is in the quotable surface: counts.json names the field
      `t_count` and execution_report.yaml's observation reads "gives
      343,807,098,880 Toffoli, 2,406,649,692,160 T". That sentence will be
      quoted; the caveat will not.
    direct_answer_to_criterion_1: >-
      Under this convention the package CANNOT reproduce anyone's
      arithmetic-layer headline, and it should not be expected to. Criterion 1
      survives only under a wiring the goal has not yet declared: it says
      totals must be reproduced "from their own stated inputs", and a paper's
      own Toffoli count IS one of its own stated inputs. So criterion 1 is
      reachable if and only if the reproduction pipeline consumes the PAPER'S
      arithmetic-layer count and this package's count is kept strictly to
      criterion 2. The goal objective's sentence -- "recompute the arithmetic
      layer here rather than citing it, since every downstream number is
      linear in it" -- reads as the opposite decision, and taken literally it
      guarantees reproduction failure by one to two orders of magnitude on
      grounds that have nothing to do with the pipeline being reproduced.
    additional_gap_found: >-
      Criterion 1 requires reproduction "within a declared tolerance". No
      tolerance is declared in GOAL-QRE-001, in RQ-QRE-6dba8c, or in this
      batch. A reproduction criterion with an undeclared tolerance is
      decidable only after the fact, which is the failure mode the criterion
      exists to prevent.

  # ==================================================================
  # NAMED TARGET 2 -- DOES THE LINEARITY PREMISE SURVIVE?
  # ==================================================================
  target_2_linearity_premise:
    verdict: SUSTAINED. The premise is false on one of the two declared output
      axes and approximately true on the other, and the goal names the wrong
      input quantity for the axis where it fails.
    premise_as_stated: >-
      GOAL-QRE-001 objective and RQ-QRE-6dba8c both assert that every
      downstream number is LINEAR in the arithmetic-layer counts, and that
      premise is the stated reason this batch went first.
    physical_qubit_axis_premise_fails: >-
      A Toffoli count does not enter a physical-qubit figure additively at
      all. Under the standard surface-code accounting form -- per-cell logical
      error ~ A(p/p_th)^((d+1)/2), spacetime volume ~ Q_L x N_T x d cells, and
      a total-error budget -- the Toffoli count N_T enters ONLY through the
      code distance d, and d ~ log(N_T Q_L). Physical qubits ~ c Q_L d^2, so
      the elasticity d(log P)/d(log N_T) = 4 / (d ln(p_th/p)), which is 0.064
      at d = 27 and p_th/p = 10. A 21x error in the Toffoli count therefore
      moves the physical-qubit headline by 21^0.064 = 1.2x. Meanwhile the
      elasticity with respect to the LOGICAL QUBIT COUNT is exactly 1. The
      physical-qubit headline is linear in the circuit's WIDTH, which the goal
      premise never mentions, and is very nearly flat in the Toffoli count,
      which is the only quantity the premise names.
      MODEL STATUS: the surface-code form above is assumed by this reviewer,
      not cited; this goal has filed no error-correction source. The load
      bearing claim is the SHAPE of the exponent (logarithmic, not linear),
      and it must be re-checked against whatever EC model is filed. If a
      filed source makes physical qubits linear in N_T, this objection dies.
    wall_clock_axis_premise_approximately_holds: >-
      At fixed layout and fixed distillation-factory count, wall clock ~ N_T x
      d x t_cycle, giving elasticity ~1 + 0.06. So the premise is materially
      correct for wall clock and materially wrong for physical qubits. Half
      the deliverable rests on a true premise and half on a false one, and the
      RQ asks for the two axes to be ranked SEPARATELY, so the error does not
      average out.
    the_map_is_to_a_tradeoff_curve_not_to_a_point: >-
      The deeper break is that (physical qubits, wall clock) is not a function
      of N_T. More factories buy time and cost qubits. A published headline is
      a point selected on that curve by an objective the paper chose. Whether
      a change in N_T shows up as extra qubits or extra time is therefore
      decided by the optimizer, not by the arithmetic layer. A pipeline that
      does not reproduce the paper's selection objective will disagree with
      the paper on the ALLOCATION of a change even when it agrees on its size.
    non_linearity_is_also_discrete: >-
      d is integer-valued and conventionally odd; distillation level (one
      round, two rounds, catalysed) is a discrete choice with a step change in
      factory footprint. Numerically, sweeping N_T by a factor of e across the
      four (Q_L, N_T) points in this package produced measured elasticities of
      0.000, 0.000, 0.118 and 0.000 at p/p_th = 0.1 -- i.e. the output is a
      STAIRCASE, flat over most of the input range with jumps at breakpoints.
      This is fatal to the RQ's declared method for criterion 3: it asks for
      "partial derivatives -- in practice, one-at-a-time and joint sweeps".
      The partial derivative of a staircase is zero almost everywhere and
      undefined at the interesting points. The sensitivity table must report
      BREAKPOINTS and the interval between them, not derivatives, for every
      input that enters only through d or through a distillation level.
    routing_and_layout: >-
      The counted circuit assumes free connectivity: the builder applies CCX
      to any triple of indices. On a planar surface-code layout, non-locality
      is paid in routing space and time, and the routing penalty is a function
      of the circuit's WIDTH and locality profile, not of its Toffoli count.
      This package's EC circuit carries 132,101 logical qubits at n = 256
      against a filed comparison of 2,330 (KN-LIT-099), so its routing
      exposure is not merely different in constant, it is different in kind.
    the_producers_own_result_supports_this: >-
      As the handoff anticipated, the EC count is not a function of n even
      inside the arithmetic layer: it depends on b and w for p-2. This
      reviewer evaluated the producer's own exact form at three 256-bit
      primes: largest prime below 2^256 (w=250) gives 5.302e9; secp256k1's
      prime (w=249) gives 5.291e9; the NIST P-256 prime (w=128) gives
      4.020e9. So the choice of prime -- an input no one would think to
      declare -- moves the count by 24% between two deployed 256-bit curves,
      and by up to ~2x across the range of w. The headline evaluation uses
      the largest prime below 2^256, which is the MOST expensive admissible
      choice under the producer's own formula. That is not concealed, but it
      is not flagged as a sensitivity input either.
    artifact_tell: >-
      Inventor-protocol section 3 asks what a reported quantity should do as
      the parameter meant to destroy it moves. The w-dependence is a property
      of the FERMAT INVERTER, not of the point addition: a Euclid/Kaliski-type
      inverter's cost does not depend on the bit pattern of p at all. So a
      sensitivity table that ranks "Hamming weight of p-2" as an input
      influencing ECDLP cost would be reporting a sensitivity of the
      instrument, not of the problem. The discriminating control is named in
      required_controls (RC-4).

  # ==================================================================
  # NAMED TARGET 3 -- CAN SMALL-WIDTH VALIDATION CATCH LARGE-n ERRORS?
  # ==================================================================
  target_3_validation_reach:
    verdict: NOT SUSTAINED as posed. This reviewer ran the cheapest
      falsification and it PASSED at every counted width. A clean survival is
      a real result and is recorded as one.
    what_was_objectionable: >-
      Validation stopped at n = 12 while counts were enumerated to n = 128
      (modexp) and n = 32 (EC), leaving 16 counted widths never executed. Per
      -width input coverage also DECAYS with n (modexp 2^(2n) exhaustive at
      n=4,5 then 128, 64, 32, 16, 8, 4 samples; EC exhaustive to n=7 then 40,
      20, 10, 5, 3), so the detection power of the test falls superexponentially
      exactly as the number of distinct executed code paths grows. Holding the
      validation budget flat while width grows is the shape of a measurement
      that stops being able to see what it is looking for.
    control_run_by_this_reviewer: >-
      The package's own architecture (PREREGISTRATION clause 8: one builder,
      two sinks) makes the fix nearly free -- switching Machine(run=False) to
      Machine(run=True) at a counted width costs about 1.3x the counting time
      already paid. This reviewer drove the producer's UNMODIFIED src/circuits.py
      through the runner sink at every counted-but-unsimulated width, one
      input per width, checking the output value, the preservation of the
      exponent register, ancilla cleanliness, and tally equality against
      count_modexp / count_point_add:
        modexp n = 13, 14, 16, 20, 24, 32, 48, 64, 96, 128 -- correct=True,
          tally_match=True, dirty=0 at all ten. Total 4 min 0 s
          (n=128 alone: 84.7 s simulate against 67.1 s count).
        EC n = 13, 14, 15, 16, 20, 24, 32 -- correct=True, tally_match=True,
          dirty=0 at all seven. Total 39 s.
      The whole simulate-versus-count gap on both enumerated ladders closes in
      under five minutes, about 1.5% of the producer's own 3000 s budget.
      STATUS OF THIS RUN: exploratory, in a scratchpad, NOT a durable
      artifact and NOT evidence. It is reported so the Coordinator knows the
      control is cheap and what it returned. It must be re-run under a
      dispatched task before it is cited.
    what_this_settles_and_what_it_does_not: >-
      Settled: no construction error changes the count or breaks correctness
      anywhere between the validated ceiling and the enumeration ceiling.
      Combined with the producer's independent algebraic derivation
      (2n[2n(2 + 10(n+1)) + n] = 40n^3 + 50n^2, matching the enumeration
      exactly at 17 widths including six holdouts) and the absence of any
      width-thresholded branch in the builder, the extrapolation to n = 2048
      and n = 256 is an enumeration in the sense that matters: the emitted
      stream's length is a closed form in loop bounds that are all linear in
      n. The producer's `evaluated_from_closed_form` label is accurate.
      Not settled: correctness at n > 128 and n > 32 remains an argument from
      width-uniformity rather than an execution, and per-width detection
      power for VALUE-dependent faults still decays. But those are not the
      package's binding weakness -- the binding weakness is that the count is
      an exact count of a construction nobody else costs. The extrapolation is
      the strongest part of this package, not the weakest.
    narrow_residual_objection: >-
      Input selection is uniform-random, so boundary states of the modular
      reduction (operand sums landing exactly on the modulus, zero partial
      products, a zero accumulator) are visited only incidentally. Adversarial
      rather than uniform inputs at a fixed small width are strictly more
      informative per second than more random inputs, and cost nothing.

  # ==================================================================
  # ALSO WORTH ATTENTION -- FERMAT UPPER BOUND AND CRITERION 4
  # ==================================================================
  target_4_fermat_upper_bound_and_the_ratio:
    verdict: SUSTAINED AND FATAL TO COMPLETION CRITERION 4 as currently
      supported. An upper bound is admissible for a ratio only when the
      looseness on each side is separately bounded and its direction declared.
      Here it is neither bounded nor symmetric, and it flips the sign of the
      headline comparison.
    a_ratio_of_two_upper_bounds_bounds_nothing: >-
      Both sides of this package are upper bounds. That is fine individually
      and worthless jointly: U_ec/U_rsa is neither an upper nor a lower bound
      on the true ratio. The package never claims a ratio, so this is an
      objection to criterion 4, not to the package.
    the_looseness_is_asymmetric_and_grows_with_n: >-
      The two sides are loose by different ORDERS, not different constants.
      Fermat inversion costs Theta(n) modular multiplications at Theta(n^2)
      each, so the point addition here is Theta(n^3); a Euclid/Kaliski-type
      reversible inverter runs ~2n iterations of O(n) work, so a point
      addition built on one is Theta(n^2) up to a log. KN-LIT-099's filed
      closed form is 224 n^2 log2(n) + 2045 n^2, confirming n^2 log n. The EC
      side is therefore loose by Theta(n/log n) while the RSA side keeps the
      right exponent. Measured ratio to the filed form: 21.3x at n=256, 40.9x
      at n=521. The bias grows with n; it cannot be absorbed into a declared
      constant.
    the_sign_of_the_comparison_flips: >-
      Producer's numbers, ECDLP-256 versus RSA-2048 in Toffolis, taking the
      standard 2n = 512 point additions: 2.71e12 / 3.44e11 = 7.90, i.e. ECDLP
      almost 8x DEARER than RSA-2048. Substituting the filed KN-LIT-099
      simulated P-256 total (1.26e11) against the same RSA baseline gives
      0.366, i.e. ECDLP nearly 3x CHEAPER. That is a 21x directional error on
      a quantity whose entire content is its direction, and it reverses the
      conclusion recorded in this repository's own KN-TECH-037 ("ECC is the
      cheaper quantum target"). CAVEAT, stated because it cuts against my own
      objection: the 0.366 figure mixes constructions across the two sides and
      is therefore NOT itself like-for-like; it is offered only to show that
      the construction gap on the EC side (21x) is larger than the ratio being
      measured (7.9x), which is what makes the sign undetermined.
    the_width_axis_is_worse_and_is_missing_from_the_headline: >-
      Peak logical qubits for one point addition: 2n^2+4n+5 = 132,101 at
      n = 256, against KN-LIT-099's 9n + 2ceil(log2 n) + 10 = 2,330 for the
      WHOLE ECDLP circuit -- 56.7x, growing as ~n/9 (3.6x at n=16, 115.5x at
      n=521). Quadratic against linear. This matters more than the Toffoli gap
      for the goal's primary output: by the elasticity argument above, a 21x
      Toffoli error moves the physical-qubit headline by ~1.2x, while a 56.7x
      logical-qubit error moves it by ~56.7x. The largest downstream error in
      this package is on the axis it reports least prominently:
      counts.json's `evaluated_at_256_bit_shape` block reports toffoli and
      t_count and OMITS peak_qubits, while the RSA block
      `evaluated_at_rsa_2048_shape` includes peak_qubits: 12294. The headline
      pair is therefore reported with the qubit axis present on the favourable
      side and absent on the unfavourable one. Nothing suggests this was
      deliberate -- the quadratic footprint is disclosed in
      could_not_be_derived and the fit is reported in full -- but the
      asymmetry should be repaired before the numbers travel.
      Consequence for a like-for-like statement: under one convention this
      package makes ECDLP-256 need ~10.7x MORE logical qubits than RSA-2048
      (132,101 versus 12,294), where the filed source has ECDLP-256 needing
      ~5x FEWER. Both the gate ratio and the qubit ratio invert.
    a_factor_of_two_is_available_inside_the_frozen_convention: >-
      Measured, not asserted. Counting one mod_inv in isolation against the
      full point_add at n = 8, 12, 16, 24, 32 gives modinv/modmul exactly
      2(b+w-2) and padd/modmul exactly 8(b+w-2)+5 at every width. So
      point_add charges FOUR Fermat-chain evaluations per inversion where the
      isolated inverter needs two. The extra two come from src/circuits.py
      lines 421-425 and 432-435: point_add captures the whole of mod_inv
      (which is already compute + copy-out + uncompute) and then replays it
      forward and inverted. Holding the chain live across the single use of T
      -- chain, copy to T, use T, copy T back, unchain -- returns every
      ancilla to |0> in two chain evaluations, changing the peak by O(n) on a
      footprint already Theta(n^2). That would give (4(b+w-2)+5) and 2.655e9
      instead of 5.302e9 at n = 256, a factor of 1.997.
      So the reported EC number is not "the cost of Fermat inversion"; it is
      the cost of one particular uncompute SCHEDULE of it, and the schedule is
      neither in the frozen convention nor in could_not_be_derived. This is
      the least important of the EC objections in magnitude and the most
      important in kind: it shows the reported figure is sensitive to a
      decision that was never surfaced as a decision.
    what_is_admissible: >-
      An upper bound IS admissible for criterion 4 if the ratio is reported as
      a ratio of upper bounds with the looseness on each side separately
      characterised -- ideally as a measured ratio against a filed
      construction at several n, which this report supplies for the EC side
      (1.7x to 40.9x over n = 16..521) and which the RSA side still lacks.
      What is not admissible is a bare ratio.

  # ==================================================================
  objections:
    - id: RT-QRE-312e93-01
      severity: high
      target: completion criterion 4
      claim_targeted: that this arithmetic layer can support a like-for-like
        RSA-versus-ECDLP ratio
      objection: >-
        The EC side is an upper bound loose by Theta(n/log n) in gates
        (measured 21.3x at n=256) and by Theta(n) in width (measured 56.7x),
        while the RSA side keeps the correct exponent. The gap exceeds the
        ratio, so the ratio's SIGN is undetermined; the package's numbers say
        ECDLP is 7.9x dearer than RSA-2048 while the corpus's own filed source
        has it cheaper. Criterion 4 cannot be met from these numbers.
      cheapest_falsification: >-
        Derive or import a Euclid/Kaliski-type reversible inverter, count it
        under the SAME frozen convention with the same builder, and re-evaluate
        the point addition. If the resulting point-addition count lands within
        a declared factor of KN-LIT-099's 224 n^2 log2 n + 2045 n^2 at n <= 32,
        this objection is refuted and criterion 4 reopens. Cost bound from this
        reviewer's measurements: the EC counting ladder to n=32 runs in ~30 s
        and validates in ~39 s, so the whole re-count is a sub-two-minute run
        plus the construction work.
      cheaper_partial: >-
        If no inverter is derived, publish the ratio as a ratio of upper bounds
        with the EC-side looseness measured against KN-LIT-099 at several n
        (this report supplies that curve) and state the direction explicitly.
        Costs one table and nothing else.

    - id: RT-QRE-312e93-02
      severity: high
      target: completion criterion 1 and the batch-2 acquisition plan
      claim_targeted: that recomputing the arithmetic layer here serves the
        reproduction criterion
      objection: >-
        The convention's exclusions (no measurement, no borrowed ancilla, no
        constant-specialised adder, no windowing) pin the counted circuit to a
        construction no published headline costs. Feeding this count into the
        reproduction pipeline guarantees failure by one to two orders of
        magnitude for reasons unrelated to the pipeline under test.
        Criterion 1 and criterion 2 must be wired to SEPARATE arithmetic
        inputs: criterion 1 consumes the paper's own stated count, criterion 2
        reports this one.
      cheapest_falsification: >-
        Take the one resource-estimation paper already filed (KN-LIT-099) and
        attempt criterion 1 against its LOGICAL-layer totals using its own
        stated inputs. If the pipeline reproduces 2330 qubits / 1.26e11
        Toffoli / 1.16e11 depth at P-256 from its stated formulas while
        consuming this package's arithmetic layer, the objection is refuted.
        Zero acquisition cost.

    - id: RT-QRE-312e93-03
      severity: high
      target: goal premise and completion criterion 3 (the primary deliverable)
      claim_targeted: '"every published headline number is linear in" the
        arithmetic-layer counts'
      objection: >-
        False on the physical-qubit axis: the Toffoli count enters only through
        the code distance, elasticity ~0.06 rather than 1, and the output is a
        staircase whose partial derivative is zero almost everywhere. The
        physical-qubit headline is linear in the LOGICAL QUBIT COUNT, a
        quantity the premise never names. Approximately true on the wall-clock
        axis. The sensitivity table therefore needs a different shape:
        breakpoints and intervals for staircase inputs, elasticities rather
        than derivatives for the rest, and width promoted to a first-class
        input alongside gate count.
      cheapest_falsification: >-
        Once one EC/layout model is filed, sweep its Toffoli-count input over
        two decades at fixed width and record the physical-qubit output. If it
        moves by two decades, this objection is refuted. One script, no new
        circuits.

    - id: RT-QRE-312e93-04
      severity: moderate
      target: usefulness of the wall-clock half of the deliverable
      claim_targeted: that this package supplies what the wall-clock axis needs
      objection: >-
        Wall clock is set by Toffoli DEPTH when factory throughput is
        sufficient and by count/throughput when it is not. The package reports
        no depth. KN-LIT-099 reports depth beside count (1.16e11 against
        1.26e11 at P-256), so the filed comparison target has a column this
        package cannot fill, and the wall-clock axis cannot be computed from
        this package's outputs under either regime.
      cheapest_falsification: >-
        Add an ASAP scheduler to the tally sink -- a per-qubit last-used
        timestep, ~10 lines in Machine._emit -- and re-run the counting ladder.
        Measured cost of the full modexp ladder is 144 s. If depth comes back
        equal to count (a fully serial circuit) the extra column is
        uninformative and the objection dies.

    - id: RT-QRE-312e93-05
      severity: moderate
      target: reporting symmetry of the headline pair
      claim_targeted: counts.json evaluated_at_256_bit_shape
      objection: >-
        The EC headline block omits peak_qubits while the RSA headline block
        includes it, and the qubit axis is where the EC construction is
        furthest from the filed comparison (56.7x versus 21.3x) and where the
        downstream elasticity is highest (~1 versus ~0.06). The unfavourable
        axis is the missing one.
      cheapest_falsification: >-
        Evaluate the already-fitted 2n^2+4n+5 at n=256 (= 132,101) and add it
        to the block, with the residual note that the fit overestimates by n
        where w drops. One field; no run.

    - id: RT-QRE-312e93-06
      severity: moderate
      target: the reported EC constant
      claim_targeted: the coefficient 8 in (8(b+w-2)+5)
      objection: >-
        Measured: an isolated mod_inv costs 2(b+w-2) modular multiplications;
        point_add charges 8(b+w-2)+5, i.e. four chain evaluations per
        inversion for two inversions. Two of the four are an artifact of
        capturing an already-self-inverse block and replaying it in both
        directions. A hold-the-chain-live schedule returns all ancillas in two,
        for a factor of 1.997 at O(n) extra width. The reported number is a
        property of an undeclared schedule choice, not of the Fermat method.
      cheapest_falsification: >-
        Implement the hold-live variant and validate at n <= 12 with the
        existing harness. If any ancilla fails to return to |0>, this objection
        dies. Measured cost of the whole EC validation ladder: 39 s.

    - id: RT-QRE-312e93-07
      severity: moderate
      target: goal-level knowledge retrieval, not the producer
      claim_targeted: GOAL-QRE-001 next_action, "no resource-estimation paper
        has been filed and none is required to produce this", and the
        execution report's "No resource-estimation paper is filed for this
        goal, so none exists to compare against"
      objection: >-
        KN-LIT-099 is filed, is a primary resource-estimation paper for exactly
        this goal's ECDLP side, carries citation_verified `read`, and has its
        input table already extracted into KN-TECH-037. Its pause_condition
        counterpart in the goal record -- "fewer than two primary
        resource-estimation papers with extractable input tables can be
        obtained" -- is therefore already one closer to satisfied than the goal
        believes, and the comparison the producer was told did not exist is
        available at zero acquisition cost. AGENTS.md "Knowledge retrieval
        policy" requires search_knowledge before asserting that no source
        exists. The producer is not at fault: the producer was correctly
        constrained to cite nothing. This is a coordinator-facing correction
        so batch 2 is not planned against an empty corpus.
      cheapest_falsification: >-
        Read knowledge/literature/KN-LIT-099.md and knowledge/techniques/
        KN-TECH-037.md. If neither contains an extractable input table, the
        objection dies. Zero cost.

    - id: RT-QRE-312e93-08
      severity: low
      target: quotable surface of the T column
      claim_targeted: the field name `t_count` and the phrase "2,406,649,692,160 T"
      objection: >-
        The column is 7 x Toffoli by definition and adds no information, while
        inviting comparison with published T-counts quoted under a different
        per-Toffoli convention or as T-DEPTH. The caveat lives in the
        preregistration; the number lives in the quotable sentence.
      cheapest_falsification: >-
        Rename to `t_count_upper_bound_at_7_per_toffoli` and restate the
        observation as "Toffoli X, i.e. at most 7X T under the frozen
        convention". If a filed source turns out to quote T under a 7-per-
        Toffoli convention, the objection weakens accordingly. One edit.

    - id: RT-QRE-312e93-09
      severity: low
      target: undeclared input in the sensitivity table
      claim_targeted: the choice of representative 256-bit prime
      objection: >-
        Evaluating the producer's own exact form gives 5.302e9 at the largest
        prime below 2^256 (w=250), 5.291e9 at secp256k1's prime (w=249), and
        4.020e9 at the NIST P-256 prime (w=128) -- a 24% spread between two
        deployed curves and ~2x across the range of w. The headline uses the
        most expensive admissible choice. Under a Euclid-type inverter this
        input would not exist at all, so it is a sensitivity of the instrument.
      cheapest_falsification: >-
        Report the closed form at all three primes (one line of arithmetic, no
        run) and mark the w-dependence as construction-induced.

    - id: RT-QRE-312e93-10
      severity: low
      target: criterion 1 decidability
      claim_targeted: '"within a declared tolerance"'
      objection: >-
        No tolerance is declared in the goal, the question, or this batch. A
        reproduction criterion whose tolerance is set after seeing the
        discrepancy is not a criterion.
      cheapest_falsification: >-
        Declare it before acquisition, per axis (gate count, logical qubits,
        depth) and per layer (arithmetic, logical, physical). Zero cost now.

  # ==================================================================
  required_controls:
    - id: RC-1
      name: enumeration-ceiling validation sweep
      why: closes the counted-but-unsimulated gap that target 3 names
      status: RUN BY THIS REVIEWER, PASSED at all 17 widths; exploratory only,
        must be re-run under a dispatched task to become evidence
      cost: 4 min 39 s measured, both circuits, one input per width
    - id: RC-2
      name: null-object control for the counting instrument
      why: inventor-protocol section 3 requires the identical measurement
        against an object of the same shape whose answer is known
        independently
      status: ALREADY SATISFIED by the producer -- the independent algebraic
        derivation, the six held-out widths with zero residual, and the
        run-mode-versus-count-mode tally equality at 22 configurations
        together are a genuine control. Recorded as satisfied, not demanded.
    - id: RC-3
      name: measured ratio against a filed construction
      why: converts "upper bound" from a disclaimer into a number
      how: evaluate KN-LIT-099's 224 n^2 log2 n + 2045 n^2 and 9n+2ceil(log2 n)+10
        alongside this package's forms at every enumerated width and report the
        ratio curve. Supplied in this report for n = 16..521; needs an
        equivalent on the RSA side once a source is filed.
    - id: RC-4
      name: construction-invariance control for the w-dependence
      why: distinguishes a property of the point addition from a property of
        the Fermat inverter
      how: count (validation optional) any inverter whose cost does not depend
        on the bit pattern of p, even a stub, and confirm the w-dependence
        disappears. If it does, the w sensitivity is an instrument artifact and
        must not enter the sensitivity table as a problem input.
    - id: RC-5
      name: adversarial rather than uniform input selection
      why: per-width detection power for value-dependent faults currently
        decays as coverage shrinks
      how: at n = 8..12, replace random inputs with boundary states -- operand
        sums landing exactly on the modulus, zero partial products, zero
        accumulator, w-extremal primes. Strictly more informative per second.

  counterexample_or_mutation: >-
    The sharpest single mutation: hold the goal's premise fixed and vary the
    construction. Two arithmetic layers for the SAME problem at the same n,
    both exactly counted, differ by 21.3x in Toffoli count and 56.7x in logical
    qubits (this package versus KN-LIT-099 at n=256). Push both through any
    standard surface-code accounting and the physical-qubit outputs differ by
    ~56.7x x 1.2x, while the wall-clock outputs differ by ~21x. Neither output
    is linear in the quantity the goal premise names, and the two outputs move
    by different factors from the same input change. One observable (the
    Toffoli count) therefore does not identify the headline -- the
    observation-fiber attack succeeds, and the missing separator is the
    circuit's width together with the layout objective the paper optimised.

  baseline_comparison:
    note: >-
      Pollard-rho, BSGS and the classical specialized baselines are NOT
      applicable here and are recorded as non-applicable rather than omitted:
      GOAL-QRE-001's non_duplication clause forbids any classical result being
      cited in this goal and vice versa. The correct baseline for a quantum
      arithmetic-layer count is the closest published reversible construction.
    closest_specialized_baseline: KN-LIT-099 / KN-TECH-037 (filed, confidence
      `reported`, citation_verified `read`, NOT reproduced by this program)
    ec_point_addition_toffoli:
      package: Theta(n^3); 5.302e9 at n=256 (largest prime), 4.020e9 (P-256 prime)
      baseline: 224 n^2 log2(n) + 2045 n^2; 2.515e8 at n=256
      ratio_package_over_baseline: {n16: 1.7, n32: 3.2, n64: 6.0, n128: 11.3,
        n192: 16.4, n256: 21.3, n384: 30.9, n521: 40.9}
    ec_logical_qubits:
      package: 2n^2+4n+5 (one point addition); 132101 at n=256
      baseline: 9n + 2*ceil(log2 n) + 10 (whole ECDLP circuit); 2330 at n=256
      ratio: {n16: 3.6, n32: 7.1, n64: 14.1, n128: 28.3, n256: 56.7, n521: 115.5}
    ec_full_shor:
      package_at_2n_point_additions: 2.71e12 Toffoli (largest prime) /
        2.06e12 (P-256 prime)
      baseline_simulated_table_value: 1.26e11 Toffoli, depth 1.16e11, 2330 qubits
    rsa_side: >-
      NOT COMPARED. No RSA resource-estimation source is filed. The only RSA
      figure reachable from the corpus is KN-LIT-099's own cross-comparison at
      RSA-3072, which that entry itself records as internally discrepant
      (1.86e13 in the ePrint table against 1.5e14 in the Springer summary) and
      which is not a like-for-like modexp count. Against the ePrint figure this
      package's 40n^3+50n^2 at n=3072 gives 1.16e12, i.e. 16x LOWER in gates
      while being 3x HIGHER in logical qubits (18,438 against 6,146). Reported
      only to show that the two sides' gaps have OPPOSITE SIGN, which is what
      makes the ratio undetermined; it is not offered as a reproduction and
      must not be cited as one.
    dominated_by: >-
      For the EC arithmetic layer: KN-LIT-099, on BOTH reported axes
      simultaneously (21.3x fewer Toffolis and 56.7x fewer logical qubits at
      n=256) and additionally on an axis this package does not report (Toffoli
      depth). This is Pareto domination, not a single-axis loss, and it was
      checked against every axis this package reports. For the RSA arithmetic
      layer: UNKNOWN, because no comparable source is filed -- explicitly not
      null, and it must not be recorded as null until one is.
      For the package as a METHOD -- one builder, two sinks, tally equality
      measured rather than asserted, exact enumeration with holdout widths, a
      frozen convention, and full reproduction from the recorded command --
      dominated_by is genuinely null on the evidence axis: the filed baseline's
      counts are, by its own record, interpolated from simulation data rather
      than exactly enumerated, and its constructions were not reproduced.
    sota_delta: >-
      EC point addition: 21.3x worse in Toffoli count and 56.7x worse in
      logical qubits at n=256, with both gaps growing in n (as ~n/log n and ~n
      respectively). Not "worse" -- these are the numbers. RSA modexp:
      unquantified, no baseline filed. Methodological delta: this package
      supplies exactness, an auditable count-equals-simulation correspondence,
      and a frozen pre-registered convention, none of which the filed baseline
      claims.

  heuristic_challenges:
    - >-
      There are no probabilistic heuristics in this package, and that is
      correct for a counting task. The exponent-first / numbered-heuristic
      checklist of docs/target-result-profile.md is recorded as NON-APPLICABLE
      rather than silently omitted: nothing here is conditional on a random
      model.
    - >-
      The one thing playing a heuristic's role is width-uniformity: the claim
      that a construction validated at n <= 12 and enumerated at n <= 128
      continues to be the same construction at n = 2048. It is not stated as
      an assumption anywhere. It is, however, TRUE for this builder (no
      width-thresholded branch exists) and it now has direct support from the
      control run in target_3. Recommendation: state it as assumption H-0 and
      cite the enumeration-ceiling sweep, rather than leaving it implicit.
    - >-
      A second implicit assumption: that the number of point additions in a
      full ECDLP is 2n. This package counts ONE point addition; every ratio
      statement needs that multiplier, and it is an algorithm-layer input this
      package does not supply and the goal has not declared.

  cost_model_challenges:
    - >-
      Total cost is not per-attempt cost. This package reports a per-primitive
      cost (one modexp, ONE point addition) while the goal's ratio needs a
      per-algorithm cost. The RSA side is already per-algorithm (2n modular
      multiplications are inside the count); the EC side is not. Comparing them
      as reported is a unit error of a factor 2n = 512.
    - >-
      Memory is reported for both circuits and is the dominant downstream
      axis, but is omitted from the EC headline block (objection 05) and is
      never converted into the physical-qubit axis the goal actually wants.
    - >-
      The o(1)/constant-factor analogue here is the set of convention
      exclusions. Each is disclosed individually; their JOINT effect on the
      constant is not estimated anywhere, and it is the single largest number
      in this package's relationship to its own goal.
    - >-
      No time-memory interpolation exists between this package's operating
      point (132,101 qubits, 5.30e9 Toffoli per point addition) and the filed
      baseline's (2,330 qubits, 2.46e8 Toffoli per point addition). Two points
      on a tradeoff curve with nothing between them cannot rank inputs by
      influence, which is what criterion 3 requires.
    - >-
      Charged-versus-uncharged: PREREGISTRATION clause 5 excludes the QFT,
      phase estimation, measurement, error correction and routing. The first
      three are small and the exclusion is standard; routing and error
      correction are the entire distance between this layer and the goal's
      output, and the goal has no record yet of who charges them.

  reduction_and_scope_challenges:
    - >-
      Scope is not inflated. The producer claims counts under a frozen
      convention and nothing else, offers no interpretation, files no
      comparison, and labels every closed-form evaluation as arithmetic rather
      than measurement. On the AGENTS rule 4 and rule 6 axis this package is
      exemplary and this reviewer sustains no objection.
    - >-
      The scope risk is entirely downstream. "343,807,098,880 Toffoli" and
      "5,301,692,426 Toffoli" are quotable sentences whose qualifiers live in a
      different file. Every later record that cites them should carry the
      construction identifier, not just the number.
    - >-
      The declared EC domain is honestly narrowed by D-1 (x3 != x2 as well as
      x1 != x2). Note the scope consequence, which is not stated: a full Shor
      ECDLP circuit must handle the excluded cases, so the reported count is an
      upper bound on the WRONG side for the exceptional branches -- it omits
      work a complete algorithm must do -- while being an upper bound on the
      usual side for the inverter. The two omissions point in opposite
      directions and neither is quantified.

  proof_architecture_challenges:
    - name: observation-fiber attack
      result: SUCCEEDS
      detail: >-
        Two circuits computing the same function at the same n share the
        observable (Toffoli count is the observable the goal proposes to
        propagate) yet sit on opposite sides of the conclusion the goal wants
        to draw -- ECDLP dearer than RSA versus cheaper. Missing separator:
        circuit width plus the layout objective the published headline
        optimised.
    - name: boundary-and-strictness attack
      result: FAILS TO EMBED
      detail: >-
        The old method is not embedded as a boundary of the new one. There is
        no parameter setting of this package's construction that recovers a
        published construction, because the recovery would require crossing a
        frozen convention clause (measurement, borrowed ancilla, windowing).
        The two are not on one continuum, so no "strictly better" or "strictly
        worse" statement is available -- only a measured ratio.
    - name: method-ceiling attack
      result: CEILING DOES NOT REACH THE HEADLINE
      detail: >-
        Under ideal tuning WITHIN the frozen convention -- best schedule, best
        modular arithmetic, no measurement, no borrowing, no windowing -- the
        EC point addition remains Theta(n^3) as long as the inverter is
        Fermat, because Fermat inversion is Theta(n) modular multiplications by
        construction. The convention plus the Fermat choice caps the method
        one exponent above the filed baseline. That ceiling is a fact about the
        construction, not about the problem, and it was derivable before any
        circuit was built.
    - name: nearby-object attack
      result: PASSES
      detail: >-
        The nearest object where the desired conclusion fails is the same
        circuit with a Euclid-type inverter. This package's method
        distinguishes them cleanly -- it would count them differently and the
        w-dependence would vanish -- so the counting method is sound; it is the
        selection of the object that is at issue.
    - name: quantifier-order attack
      result: ONE ISSUE FOUND
      detail: >-
        "The EC point addition costs Toffoli(n,b,w)" quantifies over primes
        AFTER the construction is fixed, and the headline instantiates it at
        the prime that maximises the count. The goal's own quantifier is over
        deployed 256-bit curves. Different order, 24% apart. Minor but real.
    - name: compositional-invariant attack
      result: NOT APPLICABLE
      detail: no strengthened invariant or recursion is claimed; recorded as
        non-applicable rather than omitted.

  closure_challenges: >-
    The package asserts no closure, and its could_not_be_derived list is a
    model of the form the inventor protocol section 4 asks for: named
    obstruction (no Euclid/Kaliski inverter derived), stated consequence (upper
    bound, quadratic ancilla), and forward guidance (a separate construction
    task). It is not a fatigue report. No objection sustained here, and this is
    recorded as a clean survival, not an absence of scrutiny.

  fatal_findings:
    - criterion: 'Completion criterion 4: like-for-like RSA-versus-ECDLP ratio'
      status: CANNOT BE MET FROM THIS ARITHMETIC LAYER
      why: the EC-side construction gap (21.3x gates, 56.7x width, both growing
        in n) exceeds the ratio being measured (7.9x) and reverses its sign;
        a ratio of two asymmetrically loose upper bounds bounds nothing; and
        the two sides are in different units (full algorithm versus one point
        addition, a factor 2n).
      recoverable_by: objection RT-QRE-312e93-01's cheapest falsification, or
        by reporting the ratio as a ratio of upper bounds with the looseness
        curve attached.
    - criterion: 'Goal premise: "every published headline number is linear in"
        the arithmetic-layer counts'
      status: FALSE ON THE PHYSICAL-QUBIT AXIS
      why: the Toffoli count enters that axis only through the code distance
        (elasticity ~0.06, staircase-valued); the axis is linear in logical
        qubit count instead. Criterion 3's declared method -- one-at-a-time
        partial derivatives -- is the wrong instrument for a staircase.
      recoverable_by: reshaping the sensitivity table (breakpoints and
        elasticities, width as a first-class input) before batch 3, at no cost
        now and at the cost of a rebuild later.
  at_risk_not_fatal:
    - criterion: 'Completion criterion 1: reproduce two published headline
        totals within a declared tolerance'
      status: AT RISK, decided by an architectural choice not yet made
      why: reachable only if the reproduction pipeline consumes each paper's
        OWN arithmetic-layer count; unreachable if it consumes this package's.
        Separately, no tolerance is declared, and the one filed source
        (KN-LIT-099) excludes error correction by its own statement, so the
        corpus currently supports a LOGICAL-layer reproduction target and
        nothing at the physical layer.

  narrowest_supported_statement: >-
    Under the convention frozen in PREREGISTRATION.md -- gate set {X, CNOT,
    CCX}, Toffoli = CCX, T = 7 x Toffoli, clean ancillas only, full
    uncomputation, no measurement -- the specific reversible constructions in
    src/circuits.py cost exactly Toffoli(n) = 40n^3 + 50n^2 with 6n+6 qubits
    for a modular exponentiation with a 2n-bit exponent register, and exactly
    (8(b+w-2)+5)(20n^2+10n-8) + 50(n+1) + 2n with 2n^2+4n+5 peak qubits for one
    in-place point addition by a classical constant point on a short
    Weierstrass curve over F_p, on the declared domain x1 != x2 and x3 != x2.
    These are exact enumerations at 17 and 32 widths respectively, they agree
    with independent algebraic derivations from the construction, they validate
    by classical simulation of the identical gate stream at every width tested
    including (per this reviewer's exploratory control) every enumerated width
    up to n=128 and n=32, and values at n=2048 and n=256 are evaluations of
    those closed forms rather than measurements.
    That statement is fully supported. Nothing beyond it is: not comparability
    with any published total, not a ratio between the two, not optimality, not
    a bound on a point addition or a modular exponentiation as problems rather
    than as these constructions, and nothing at all about physical qubits or
    wall-clock time.

  next_concrete_action: >-
    Before the batch-2 acquisition task is written, the Coordinator should
    record a decision that (a) criterion 1's arithmetic input is the PAPER'S
    count and criterion 2's is this package's, and they are never
    interchanged; (b) criterion 1's tolerance is declared per axis and per
    layer now; and (c) criterion 3's table is reshaped to carry logical width
    as a first-class input alongside gate count, with staircase inputs reported
    as breakpoints rather than derivatives. Then dispatch ONE task, the
    cheapest single thing that changes the most: derive a Euclid/Kaliski-type
    reversible inverter under the same frozen convention and re-count the point
    addition with the existing builder. That single construction closes the
    fatal finding on criterion 4, removes the instrument-induced w-dependence
    from the sensitivity table, converts a Theta(n) width penalty into a
    Theta(1) one, and is scoped smaller than the task that produced this
    package. If it cannot be derived, the fallback is free: publish the ratio
    as a ratio of upper bounds with the looseness curve in this report
    attached. Acquisition can proceed in parallel and should start from
    KN-LIT-099, which is already filed.

  what_this_reviewer_did_not_examine:
    - The arithmetic itself. Residuals, fit exactness, holdout construction,
      the 8x8 unitary check for T=7, the 311,472 identity instances, the
      cross-artifact consistency checks C1-C6, and the tally-equality claims in
      validation.json were NOT re-verified. That is TASK-20260813-13e948's
      task and this report assumes nothing about its outcome. Where a number
      from counts.json is quoted here it is quoted as the producer's, not as
      verified.
    - Whether src/circuits.py implements the group law correctly in general.
      This reviewer executed it and checked outputs against an independently
      computed (x3, y3) at 7 widths, which is a spot check, not a proof.
    - The prohibition sweep for dates, timelines, arrival probabilities and
      policy statements across the producer's artifacts (completion criterion
      5). Read only in passing; it is the Validator's obligation and is not
      discharged here.
    - The RSA side against any published construction. No RSA
      resource-estimation source is filed, and this reviewer did not acquire
      one. Every RSA-side statement here is either internal to the package or
      explicitly flagged as not like-for-like.
    - The surface-code accounting used in the linearity argument. It is assumed
      by this reviewer from the standard form, NOT cited and NOT filed, and the
      argument is offered for the SHAPE of the dependence (logarithmic through
      the code distance, staircase-valued, linear in width), not for its
      constants. It must be rechecked against whatever EC model batch 2 files.
    - KN-LIT-099's own correctness. It carries confidence `reported`, its
      counts are by its own record interpolated from simulation rather than
      exactly enumerated, its point addition is CONTROLLED where this
      package's is not, and this program has not reproduced it. If its numbers
      are wrong the ratio objections weaken proportionally -- and the cheapest
      way to find out is to reproduce it, which is criterion 1.
    - Anything about hardware, devices, or when any machine might exist. Out of
      scope by absolute prohibition and not considered.

  prohibition_compliance: >-
    This artifact contains no date, no timeline, no arrival probability, no
    forecast, no migration guidance and no policy recommendation, and makes no
    statement about when any machine might exist. Every quantitative statement
    has the admissible form: under the stated convention or the stated model
    assumptions, the circuit or pipeline gives X, and X moves by Y when an
    assumption moves. Dates appear only inside record identifiers
    (TASK-20260813-312e93, TASK-20260813-c99166) and in the year field of the
    cited corpus entry KN-LIT-099, both of which are provenance, not claims.
    No wall-clock figure in this report refers to a quantum computation; the
    seconds quoted are classical simulation times measured on the review host.

