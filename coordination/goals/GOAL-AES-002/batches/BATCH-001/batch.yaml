    EVERY ARCHIVE TASK DIRECTLY DEPENDS ON EVERY ONE OF ITS DECLARED SOURCES.
    Both halves are enforced by tools/research_dispatch.py and this queue FAILED
    each of them in turn: the first draft failed the coverage half, and the
    repaired draft failed the direct-dependency half. Both are recorded in
    the_three_rejected_queue_drafts_and_the_three_repairs below, together with a
