the_three_rejected_queue_drafts_and_the_three_repairs:
  summary: >-
    THE QUEUE WAS REJECTED THREE TIMES AND REPAIRED THREE TIMES, AND THAT IS
    RECORDED AS THREE ROUNDS RATHER THAN COMPRESSED INTO ONE CLEAN PASS.
    Round 1: incomplete archive coverage, repaired by declaring
    TASK-20260809-7bab1e at a 500 s declared overrun. Round 2, AFTER that repair
    and containing TWO errors at once: (2a) the new archive did not directly
    depend on one of its own declared sources, and (2b) the ledger archive owned
    no artifact under ledger/evidence/ or ledger/decisions/ because its record
    ids were to be minted at write time. Round 3, AFTER both round-2 repairs and
    unreachable before them because `_validate_review_chains` runs after the
    ledger-archive check: neither reviewer depended on ANY of the three
    review_required producers, repaired by naming every reviewed producer and
    its snapshot archive in both reviewers' depends_on. FOUR DEFECTS ACROSS
    THREE ROUNDS, ALL OF THEM THIS COORDINATOR'S, all real, and none an
    infrastructure failure blamed on the tool. A control plane that reports
    itself as having passed on the first attempt is a control plane whose
    receipts cannot be trusted about anything harder. ROUNDS 2 AND 3 ADDED NO
    TASK AND NO BUDGET: the declared total stays 9100 s and the open 500 s
    campaign shortfall stays exactly as recorded.
  what_happened: >-
    RECORDED BECAUSE A REJECTED DRAFT IS A FACT ABOUT THIS ACT, NOT SOMETHING
    TO ERASE. The FIRST draft of
    coordination/goals/GOAL-AES-002/batches/BATCH-001/dispatch_queue.json was
    REJECTED by tools/research_dispatch.py with the error
    "dispatch error: non-archive task TASK-20260809-23abf9 must be assigned
    exactly once to an archive task". Two non-archive tasks were uncovered:
    TASK-20260809-23abf9 (the rank-1 protocol act) and TASK-20260809-93d82c
    (the queue-drafting act, state `completed`).
  the_defect_was_real_and_it_was_this_coordinators: >-
    The rank-1 commit was described in PROSE in three places — the queue
    objective, the batch_notes and the rank-1 card's completion gate — and
    OWNED BY NO TASK. The artifacts that gate every later card in this batch
    therefore had no declared archive, no budget, no receipt and no completion
    gate of their own. A commit that everything depends on and that no task
    owns is exactly the unbudgeted coordination act this campaign's charging
    regime exists to eliminate.
  the_gate_ordering_was_not_wrong_and_is_not_reversed: >-
    Rank 1's artifacts belong in an ISOLATED COORDINATION COMMIT BEFORE ranks 2
    and 3 dispatch. Folding them into the post-producer snapshot
    TASK-20260809-877f6b would commit the gate AFTER the cards it gates had
    already run, which is retroactive enforcement and is refused. The
    dispatcher does not contradict that ordering; it requires the earlier
    commit to be a DECLARED archive task rather than an implicit one.
  the_repair: >-
    TASK-20260809-7bab1e was declared: role coordinator, state queued,
    review_required false, archive kind `snapshot`, priority 97 (between rank 1
    and rank 2), depends_on [TASK-20260809-23abf9] AS FIRST WRITTEN — which is
    the defect the second rejection caught, corrected below to
    [TASK-20260809-93d82c, TASK-20260809-23abf9] — running ALONE, covering
    source_task_ids [TASK-20260809-93d82c, TASK-20260809-23abf9]. Ranks 2 and 3
    were RE-POINTED from depends_on [TASK-20260809-23abf9] to depends_on
    [TASK-20260809-7bab1e], and TASK-20260809-877f6b's depends_on likewise, so
    the producers are gated on the VERIFIED ARCHIVE of the protocol act rather
    than on the producing task alone. THAT STRENGTHENS THE GATE: an artifact
    written but not committed, digest-checked and pushed has not closed
    anything. TASK-20260809-877f6b and TASK-20260809-9a49e4 keep their
    source_task_ids UNCHANGED.
  how_the_drafting_act_is_covered_and_what_that_does_not_imply: >-
    SAID PLAINLY BECAUSE THE HONEST MAPPING IS SLIGHTLY AWKWARD AND THE AWKWARD
    VERSION IS THE TRUE ONE. TASK-20260809-93d82c is `completed` and its
    artifacts ARE this control plane. They are committed BY THE DISPATCHING
    SESSION IN THE SAME COMMIT THAT LANDS THIS QUEUE, which necessarily happens
    BEFORE TASK-20260809-7bab1e runs. Covering 93d82c under 7bab1e therefore
    means 7bab1e BINDS that already-made commit — recording its sha, its parent
    and a SHA-256 for every control-plane path, verified against the tree — and
    does NOT re-stage, re-author or re-commit any of it. THIS DOES NOT IMPLY A
    SEPARATE FUTURE COMMIT OF THE DRAFTING ACT'S ARTIFACTS AND MUST NOT BE READ
    AS PROMISING ONE. Leaving 93d82c uncovered is what the dispatcher rejected,
    and minting a third archive task to commit artifacts that are already
    committed would be a fictional act with a real budget line.
  the_second_rejection_2a_the_archive_did_not_depend_on_its_own_source:
    error_verbatim: >-
      dispatch error: archive task TASK-20260809-7bab1e must directly depend on
      source TASK-20260809-93d82c
    the_defect: >-
      TASK-20260809-7bab1e declared source_task_ids
      [TASK-20260809-93d82c, TASK-20260809-23abf9] but depends_on
      [TASK-20260809-23abf9] only. tools/research_dispatch.py requires an
      archive task to DIRECTLY DEPEND ON EVERY TASK IT CLAIMS TO ARCHIVE: the
      coverage relation must be visible in the dependency graph, not merely
      asserted in the archive block.
    the_repair: >-
      depends_on is now [TASK-20260809-93d82c, TASK-20260809-23abf9] in the
      queue, in ledger/handoffs/TASK-20260809-7bab1e.yaml, in that task's card
      and in this record's task_inventory. TASK-20260809-93d82c is state
      `completed`, so the added edge is SATISFIED AT DISPATCH and delays
      nothing; what it adds is explicitness.
    what_it_does_not_change: >-
      NOTHING about the honest mapping. TASK-20260809-93d82c's artifacts are
      still BOUND by 7bab1e rather than re-staged by it, and the added
      dependency is NOT a promise of a second commit of them. No ordering, no
      budget, no deliverable and no completion gate changed.
  the_second_rejection_2b_the_ledger_archive_owned_no_ledger_artifact:
    error_verbatim: >-
      dispatch error: ledger archive TASK-20260809-9a49e4 must own exact
      artifacts under ledger/evidence/ and ledger/decisions/
    the_defect: >-
      TASK-20260809-9a49e4 declared only its two receipt paths, because its
      evidence and decision ids were to be minted at write time and its
      archive.record_ids was deliberately empty.
      tools/research_dispatch.py `_validate_ledger_archive` requires a
      ledger-kind archive's artifact_paths to own at least one path under
      ledger/evidence/ and at least one under ledger/decisions/;
      `_ledger_record_matches_path` requires each record's id to be visible in
      its filename; and archive.record_ids must list them. A ledger archive
      whose record ids are unknown at queue time CANNOT BE QUEUED.
    the_repair: >-
      The two ids were drawn with tools/allocate_id.py, `--check`ed free across
      the union of committed and in-flight state, and DECLARED NOW — evidence
      EV-AES-790d63 at ledger/evidence/EV-AES-790d63.yaml and decision
      DEC-20260809-9d8e92 at ledger/decisions/DEC-20260809-9d8e92.yaml — in the
      queue's artifact_paths and archive.record_ids, in
      ledger/handoffs/TASK-20260809-9a49e4.yaml, in that task's card and in this
      record. knowledge/INDEX.md was REMOVED from that task's write scope in the
      same repair: it is generated and `.gitignore`d and must never be
      committed.
    what_it_does_not_change_and_must_not_be_read_as: >-
      NEITHER RECORD EXISTS AND NEITHER IS CREATED BY THIS DECLARATION. Nothing
      has been measured, no producer has run, CM-1 does not exist, no ideation
      has been performed and no envelope has been measured. Declaring the
      identifiers fixes WHICH FILES the closing archive will write and says
      NOTHING about what they will contain; `inconclusive`, an invalid or
      incomplete run set, or a producer returned INCOMPLETE are all outcomes
      these identifiers accommodate unchanged.
  the_third_rejection_the_reviewers_did_not_depend_on_the_reviewed_producers:
    error_verbatim: >-
      dispatch error: TASK-20260809-23abf9 requires an independent reviewer,
      validator, or red-team successor
    why_it_could_not_surface_earlier: >-
      tools/research_dispatch.py calls `_validate_review_chains` AFTER the
      archive-coverage loop and AFTER `_validate_ledger_archive`, so rounds 1
      and 2 masked it. It was predicted from a static reading of the tool before
      the run that produced it, and then CONFIRMED VERBATIM by that run. The
      prediction is recorded because being right on paper is not evidence until
      the tool says so.
    the_defect: >-
      THREE tasks carry review_required true — TASK-20260809-23abf9,
      TASK-20260809-9b78b2 and TASK-20260809-8ab82c — and NEITHER reviewer
      depended on ANY of them directly: TASK-20260809-9b0401 and
      TASK-20260809-33a159 both had depends_on [TASK-20260809-877f6b] only.
      `_validate_review_chains` requires a DIRECT validator, reviewer or
      red-team successor for each reviewed producer, and requires that reviewer
      to depend on the producer's snapshot archive as well.
    the_repair: >-
      Both reviewers now depend on
      [TASK-20260809-23abf9, TASK-20260809-7bab1e, TASK-20260809-9b78b2,
      TASK-20260809-8ab82c, TASK-20260809-877f6b], reconciled across
      dispatch_queue.json, ledger/handoffs/TASK-20260809-9b0401.yaml,
      ledger/handoffs/TASK-20260809-33a159.yaml, both task cards, and this
      record's task_inventory and archive_coverage. The added
      TASK-20260809-7bab1e edge satisfies the rule's second half for producer
      TASK-20260809-23abf9, whose snapshot archive it is.
    it_adds_no_review_scope_and_no_ordering: >-
      STATED CAREFULLY, BECAUSE AN ADDED DEPENDENCY LOOKS LIKE ADDED WORK AND
      HERE IS NOT. Every added node was ALREADY A TRANSITIVE ANCESTOR of both
      reviewers through TASK-20260809-877f6b, so no task runs earlier or later
      than before, no budget moves and no deliverable changes. And the review
      relation was always intended: TASK-20260809-33a159 exists SPECIFICALLY to
      attack CM-1, which is a TASK-20260809-23abf9 artifact, and
      TASK-20260809-9b0401's first declared check is on the protocol act. The
      graph simply never said what the cards already said. This makes the
      existing relation explicit rather than widening it.
    added_tasks: none
    added_budget_seconds: 0
    what_it_does_not_change: >-
      No status transition, no completion criterion met, NO evidence record and
      NO decision record created, no hypothesis, no knowledge promotion, no
      claim about AES at any round count, no change to the ranked shape, no
      change to any budget line or to the 9100 s declared total, no change to
      the open 500 s campaign shortfall, no change to the EV-AES-005 ruling, and
      no change to GOAL-AES-001.
  the_cost: >-
    500 s, DECLARED AS AN OVERRUN AGAINST THE 8600 FIGURE AND NOT ABSORBED, FOR
    THE ROUND-1 REPAIR. See
    budget.the_added_opening_archive_and_its_declared_overrun. THE ROUND-2 AND
    ROUND-3 REPAIRS ADDED NO TASK AND NO BUDGET LINE: they corrected four fields
    of four already-declared tasks, so the batch total stays at 9100 and the
    campaign accounting fact recorded there is unchanged.
  the_drafting_line_does_not_reflect_three_rounds_and_that_is_an_observation_not_a_re_sizing: >-
    RECORDED AS A FINDING FOR A LATER AMENDMENT, NOT ACTED ON HERE. The 700 s
    queue-drafting line for TASK-20260809-93d82c was sized for ONE drafting
    pass. The act in fact required THREE dispatcher round trips, on three
    structural rules — archive coverage, ledger-archive artifact ownership, and
    review-chain successors — that are enforced only at render time and are
    stated in NEITHER the goal's next_action NOR any queue template. Part of
    that is this act's own sloppiness and is charged as such; part is real
    harness friction that every campaign drafting a queue will pay. THIS RECORD
