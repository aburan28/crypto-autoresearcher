objective: >-
  Open GOAL-AES-002 for execution by putting its hard pre-dispatch gates in
  place and by starting the campaign's only research lane, in the ranked shape
  fixed by the committed GOAL-AES-002 next_action. RANK 1 is the protocol act
  (cost model CM-1, the BLK-1 certificate-vocabulary amendment, and the
  adoption record for the clock convention and the provenance gate), which
  gates everything else and costs no producer slot. RANK 2 is object-first
  ideation on FULL-ROUND AES under docs/inventor-protocol.md section 1. RANK 3
  is the measured toolchain-and-throughput envelope receipt that resolves, by
  MEASUREMENT rather than by assertion, the named contradiction between two
  committed records about the local C toolchain. BETWEEN RANK 1 AND THE
  PRODUCERS SITS TASK-20260809-7bab1e, THE OPENING SNAPSHOT ARCHIVE, which runs
  alone and which ranks 2 and 3 actually depend on: the gate is the verified
  archive of the protocol act, not its authoring. Then the standard chain: the
  producer snapshot archive, independent validation, an independent red-team
  pass on CM-1 itself, and an isolated ledger archive. THIS BATCH ASSERTS
  NOTHING ABOUT AES AT ANY ROUND COUNT.

next_action: >-
  Dispatch TASK-20260809-23abf9 (the rank-1 protocol act) to a coordinator
  session, then run TASK-20260809-7bab1e ALONE to commit, verify and push its
  artifacts BEFORE any producer card is executed. Ranks 2 and 3 depend on
  TASK-20260809-7bab1e — the ARCHIVE — and not on TASK-20260809-23abf9
  directly, because a gate uncommitted when the card it gates is issued is
  exactly the retroactive enforcement this program refuses, and an artifact
  written but not committed, digest-checked and pushed has not closed a gate.

scope:
  admitted:
    - >-
      Cost model CM-1 as a frozen, independently reviewable artifact fixing all
      six elements (a)-(f) of RQ-AES-002 claim_tier_ceiling R2 for
      AES-128/192/256.
    - >-
      protocol-amendment-GOAL-AES-002-001 resolving BLK-1 by adding a
      `key_recovery` certificate kind to docs/claims-and-verification.md with
      the corresponding `check_run` change in tools/validate_ledger.py.
    - >-
      The adoption record binding the amendment-005 Part B clock convention and
      the amendment-004/005 artifact-provenance gate to this campaign from
      BATCH-001.
    - >-
      Object-first ideation on FULL-ROUND AES-128/192/256 (10/12/14 rounds),
      single-key, with the established families declared off-limits as the
      primary lens and the lossy-projection test applied before any compute is
      requested.
    - >-
      A machine-readable measured toolchain-and-throughput envelope receipt
      (gcc presence, whether -maes compiles and runs, AES-NI and pure-Python
      throughput in AES evaluations per second per core, usable RAM, and the
      resulting per-task and per-campaign ceiling in AES evaluations).
    - >-
      TWO isolated snapshot archives with DISJOINT path sets — the opening
      archive TASK-20260809-7bab1e (the rank-1 protocol act and the bound
      control-plane commit, before the producers are dispatched) and the
      producer archive TASK-20260809-877f6b — one independent validation, one
      independent red-team pass on CM-1, and one isolated ledger archive.
  excluded:
    - >-
      ANY cryptanalytic measurement against AES. No key-recovery attempt, no
      distinguisher measurement, no search of any kind is dispatched in this
      batch, and CM-1 is a hard pre-dispatch gate on all of them
      (RQ-AES-002 constraints).
    - >-
      Any cost claim, margin, or comparison of any kind. CM-1 does not exist
      until TASK-20260809-23abf9 completes and commits, and a margin computed
      before CM-1 is frozen is not evidence.
    - >-
      Any comparison against the published state of the art, in either
      direction (RQ-AES-002 claim_tier_ceiling R3, R5).
    - >-
      Any related-key, known-key, chosen-key, side-channel, fault,
      implementation or quantum work (RQ-AES-002 scope; GOAL-AES-002
      non_completion_criteria (ii) and (iv)).
    - >-
      Any reduced-round FINDING asserted under this goal. Reduced-round runs
      are admissible here only as validation-ladder instruments for a
      full-round mechanism, and a result ABOUT reduced-round AES is cross-filed
      under RQ-AES-001's ceiling (RQ-AES-002 relationship_to_RQ_AES_001 (iv)).
    - >-
      Any change to GOAL-AES-001. That goal is not paused, closed, superseded,
      re-scoped, re-budgeted or reprioritized by this batch, and no second of
      its budget is charged here.
    - >-
      Any hypothesis record, hypothesis status change, goal status transition,
      or completion attestation. None is created by this batch.

budget:
  declared_wall_clock_seconds: 9100
  declared_wall_clock_seconds_note: >-
    9100, NOT 8600, AND THE DIFFERENCE IS A DECLARED OVERRUN RATHER THAN A
    RE-DERIVATION. See the_added_opening_archive_and_its_declared_overrun below,
    which names the added line, states that campaign_budget.sizing_basis has no
    line for it, and records the campaign-level consequence without pre-deciding
    it. The 8600 decomposition is preserved unaltered under
    decomposition_as_committed_in_sizing_basis so the committed figure is
    superseded in view rather than overwritten.
  memory_gb: 4
  maximum_runs: 9
  maximum_runs_note: >-
    9, TRACKING THE BATCH'S TASK COUNT, WHICH IS THE ONLY READING CONSISTENT
    WITH THE ORIGINAL VALUE: this field was 8 when the batch held eight tasks,
    and it does not equal the sum of the per-task maximum_runs (which is 34).
    The count is now nine because TASK-20260809-7bab1e was added. Stated rather
    than adjusted silently; the per-task maximum_runs are unchanged and each
    remains binding on its own task.
  accounting_basis: measured_wall_clock_of_completed_tasks
  clock_convention: >-
    protocol-amendment-GOAL-AES-001-005 Part B, C1 through C6, ADOPTED BY
    GOAL-AES-002 budget_accounting.clock_convention and IN FORCE FROM THIS
    BATCH. The charged clock is SESSION ELAPSED, authoring-inclusive. The stop
    condition is the producer's own committed UTC stamps with a
    binding_stop_utc computed as start plus declared, committed as a declared
    artifact. Compute seconds are NOT the charged clock and may not be offered
    as evidence of budget compliance.
  decomposition_basis: >-
    THE COMMITTED DECOMPOSITION PLUS ONE DECLARED ADDITION, AND THE TWO ARE
    KEPT SEPARATE SO NEITHER HIDES THE OTHER. The committed part is EXACTLY the
    decomposition in GOAL-AES-002 campaign_budget.sizing_basis for BATCH-001,
    reproduced line for line and not re-derived: coordination-and-protocol act
    900 + queue drafting 700 + two concurrent producers 3200 + snapshot 500 +
    validation 1400 + red team 1000 + ledger archive 900 = 8600. Those per-role
    lines are borrowed from GOAL-AES-001's MEASURED per-role actuals at or near
    each role's observed maximum with NO cushion added; this goal has no
    measured data of its own, which GOAL-AES-002 campaign_budget
    what_a_red_team_should_attack_here item (2) already records against itself.
    THE ADDITION IS THE OPENING SNAPSHOT ARCHIVE TASK-20260809-7bab1e AT 500 s,
    for which sizing_basis HAS NO LINE. It is recorded below as a DECLARED
    OVERRUN, not folded into a committed line and not netted off another.
  decomposition_as_committed_in_sizing_basis:
    note: >-
      PRESERVED UNALTERED. This is the committed 8600 decomposition as
      GOAL-AES-002 campaign_budget.sizing_basis states it. It is superseded in
      view by the operative `decomposition` block below, never overwritten.
    coordination_and_protocol_act_TASK-20260809-23abf9: 900
    queue_drafting_act_TASK-20260809-93d82c: 700
    producer_rank2_ideation_TASK-20260809-9b78b2: 1600
    producer_rank3_envelope_TASK-20260809-8ab82c: 1600
    two_concurrent_producers_subtotal: 3200
    snapshot_archive_TASK-20260809-877f6b: 500
    independent_validation_TASK-20260809-9b0401: 1400
    red_team_TASK-20260809-33a159: 1000
    ledger_archive_TASK-20260809-9a49e4: 900
    total: 8600
  decomposition:
    note: >-
      THE OPERATIVE, AS-DISPATCHED DECOMPOSITION. It differs from the committed
      sizing_basis decomposition preserved above by exactly one added line —
      opening_snapshot_archive_TASK-20260809-7bab1e at 500 s — recorded as a
      DECLARED OVERRUN and not netted off any other line.
    coordination_and_protocol_act_TASK-20260809-23abf9: 900
    queue_drafting_act_TASK-20260809-93d82c: 700
    opening_snapshot_archive_TASK-20260809-7bab1e: 500
    producer_rank2_ideation_TASK-20260809-9b78b2: 1600
    producer_rank3_envelope_TASK-20260809-8ab82c: 1600
    two_concurrent_producers_subtotal: 3200
    producer_snapshot_archive_TASK-20260809-877f6b: 500
    independent_validation_TASK-20260809-9b0401: 1400
    red_team_TASK-20260809-33a159: 1000
    ledger_archive_TASK-20260809-9a49e4: 900
    total: 9100
    overrun_against_committed_8600: 500
  the_added_opening_archive_and_its_declared_overrun:
    what_was_added: >-
      TASK-20260809-7bab1e, THE OPENING SNAPSHOT ARCHIVE, at 500 wall-clock
      seconds, 1 GB, at most 2 runs. It commits and verifies the rank-1
      protocol act's five artifacts and the two additive shared-file edits in
      an isolated coordination commit, and binds the already-made control-plane
      commit that carries TASK-20260809-93d82c's artifacts.
    the_sizing_basis_has_no_line_for_it: >-
      STATED FLATLY. GOAL-AES-002 campaign_budget.sizing_basis decomposes
      BATCH-001 with exactly ONE snapshot line at 500 s, and that line is spent
      on TASK-20260809-877f6b. There is no second snapshot line, no
      coordination-archive line and no contingency line to draw from. The 500 s
      is therefore an addition to the committed figure and is recorded as one.
    disposition: DECLARED_OVERRUN_AGAINST_THE_8600_FIGURE
    why_an_overrun_and_not_a_reallocation: >-
      THREE REASONS, ALL RECORDED RATHER THAN ASSUMED.
      (1) THE COST IS NOT NEW, IT IS NEWLY VISIBLE. Rank 1's card always
      required its five artifacts to be committed and PUSHED in an isolated
      coordination commit before ranks 2 and 3 were dispatched — that was
      completion gate item 7 of TASK-20260809-23abf9 from the first draft. The
      first draft left that commit as an implicit act of the dispatching
      session, CHARGED AT ZERO. That is precisely the under-count GOAL-AES-001
      discovered at its FIFTH batch, and precisely what GOAL-AES-002
      budget_accounting.coordination_acts_are_charged_from_batch_001 exists to
      stop. The honest reading is that 8600 was an under-count from the moment
      rank 1's completion gate demanded a commit that no line paid for; making
      it a declared task makes the true cost legible instead of free.
      (2) IT MAY NOT BE TAKEN OUT OF THE RANK-1 900 s LINE. A declared per-task
      budget is a BINDING STOP CONDITION, so shrinking rank 1 to pay for the
      archive would silently shorten the authoring of CM-1 and the BLK-1
      amendment — the two hard pre-dispatch gates of this whole question. It is
      also structurally impossible: TASK-20260809-7bab1e must RUN ALONE as its
      own task and cannot share a stop condition with rank 1.
      (3) IT MAY NOT BE SIZED BELOW 500 s TO MAKE THE ARITHMETIC CLOSE. 500 is
      the per-role snapshot reference in sizing_basis (borrowed from
      GOAL-AES-001's single measured datum of 378 s and sized above it because
      the provenance gate has grown since). Sizing this task under its own
      role's reference so the batch total stayed at 8600 would be sizing the
      budget to the ambition, which is the exact failure
      protocol-amendment-GOAL-AES-001-005 Part A exists to stop making.
    campaign_level_consequence_named_not_pre_decided: >-
      8600 + 7700 + 6200 = 22500 EXACTLY, with NO rounding slack and NO
      contingency. A 9100 s BATCH-001 therefore puts the campaign at 23000
      against a 22500 ceiling unless a later batch is re-sized. THIS RECORD
      DOES NEITHER: it does not re-size BATCH-002 or BATCH-003, because moving
      another batch's line to absorb this batch's overrun is the same squeeze
      one level up and would leave the campaign looking compliant while a
      later batch silently lost 500 s it was sized to need; and it does not
      raise the 22500 ceiling, which this Coordinator has no basis to do on an
      accounting fact discovered while repairing a queue. THE 500 s EXCESS IS
      RECORDED AS AN OPEN CAMPAIGN-LEVEL ACCOUNTING FACT. Its disposition is a
      later Coordinator budget act on the merits of what BATCH-001 actually
      produced, and the honest options are exactly three: re-size BATCH-002
      and/or BATCH-003 with their own recorded rationale; raise the ceiling by
      versioned protocol_amendment; or run BATCH-003 short and record what was
      dropped. NONE of them is chosen here.
    what_this_is_not: >-
      IT IS NOT A ROUNDING, NOT A CORRECTION OF ARITHMETIC, AND NOT A SILENT
      ADJUSTMENT. It is a Coordinator budget act with a recorded rationale,
      taken in the open, and it is auditable against the preserved 8600
      decomposition above. It is also NOT evidence of anything about AES, not a
      measurement, and not a completion criterion.
  against_the_campaign_ceiling: >-
    22500 s across at most 3 batches. charged_to_date is 0 at the time this
    record is written and that zero is honest only in the sense GOAL-AES-002
    budget_accounting.charged_to_date_basis records: one opening Coordinator
    act was performed outside the charging regime and its duration is
    UNMEASURED and is not reconstructed. If every BATCH-001 task runs to its
    full declaration the batch consumes 9100 of 22500 — not 8600 — leaving
    13400 against BATCH-002 (sized 7700) and BATCH-003 (sized 6200), which
    together require 13900. THE SHORTFALL IS 500 s AND IT IS NAMED HERE RATHER
    THAN DISCOVERED AT BATCH-003. There is no rounding slack and no
    contingency; the per-role maxima ARE the contingency. See
    the_added_opening_archive_and_its_declared_overrun for why the 500 s is
    declared rather than absorbed, and for the three honest dispositions, none
    of which is chosen by this record.
  declared_budgets_are_stop_conditions: >-
    A task that reaches its declared handoff.budget.wall_clock_seconds HALTS,
    records halted_on_budget truthfully and NAMES the work dropped. That halt
    is INFRASTRUCTURE SIGNAL, never a negative mathematical result
    (AGENTS.md rule 5), and dropped work is SCOPE, never an answer.

concurrency:
  max_concurrent: 3
  cap_is_across_both_aes_goals: true
  wait_rather_than_degrade: >-
    OPERATIVE, NOT ADVISORY, and written into every producer card. max_concurrent
    3 is a cap ACROSS BOTH AES GOALS, not 3 each (GOAL-AES-002
    relationship_to_GOAL_AES_001; RQ-AES-002 constraints, final item). If
    GOAL-AES-001 BATCH-005 is in flight and dispatching a BATCH-001 task would
    exceed the cap, THIS BATCH WAITS. A task that cannot be dispatched under
    the cap is recorded as WAITED_ON_CONCURRENCY_CAP with the time it waited;
    it is NEVER dispatched with a reduced budget, a reduced deliverable set or
    a reduced review chain, and a wait is never recorded as a negative result.
  measured_host_load_at_drafting_time:
    measured_by: >-
      The dispatching session, on the host, at the time this queue was drafted.
      Reported to this Coordinator, which has no Bash tool and did not run the
      measurement itself.
    physical_cores: 14
    ram_gb: 48
    load_average_1_minute: 40.48
    load_average_5_minute: 43.60
    load_average_15_minute: 40.25
    reading: >-
      The machine is heavily oversubscribed by concurrent agents: a 1-minute
      load average of 40.48 against 14 physical cores is roughly 2.9 runnable
      threads per core.
    what_this_is_and_is_not: >-
      IT IS A MEASUREMENT TAKEN AT DRAFTING TIME AND NOTHING MORE. It is NOT a
      forecast of the load at dispatch time, it does not predict any task's
      duration, and it is not evidence for or against any per-role sizing line.
      The dispatching session re-checks the concurrency cap immediately before
      dispatching each task and applies the wait clause above on what it
      observes then, not on this reading.
    named_discrepancy_for_the_rank_3_receipt_to_resolve_by_measurement: >-
      RQ-AES-002 constraints declare the local envelope as "4 CPU cores, 15 GB
      RAM"; the host reading above is 14 physical cores and 48 GB. THIS
      COORDINATOR DOES NOT RESOLVE THAT DISAGREEMENT BY ASSERTION and does not
      rule which figure describes the resource actually available to a
      dispatched task. It is named here as a second envelope discrepancy
      alongside the C-toolchain contradiction the rank-3 receipt
      (TASK-20260809-8ab82c) is dispatched to settle by measurement, and it is
      added to that task's objective for the same reason.

