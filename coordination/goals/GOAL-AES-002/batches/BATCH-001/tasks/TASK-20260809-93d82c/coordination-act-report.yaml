  the_id_collision_found_and_how_it_was_routed_around:
    finding: >-
      THE COMMITTED GOAL-AES-002 next_action INSTRUCTS THE BATCH-001 LEDGER
      ARCHIVE TO CARRY `EV-AES-005`. THAT IDENTIFIER IS ALREADY BOUND TO
      GOAL-AES-003. ledger/evidence/EV-AES-005.yaml was read during this act
      and carries hypothesis_id RQ-AES-003 and task_ids TASK-20260802-902
      through TASK-20260802-908.
    why_it_matters: >-
      Reusing it would shadow a committed, immutable evidence record of another
      goal. This is exactly the identifier collision CLAUDE.md's ID-allocation
      rule exists to prevent, and exactly the mechanism that rule names: every
      concurrent worktree asks the same committed state for "the next free
      number", gets the same answer, and mints the same identifier for
      different records — discovered only at merge time, when both are
      immutable and neither can be renamed without breaking whatever archive
      binds it.
    disposition: >-
      NOT SILENTLY ROUTED AROUND. The correction is stated plainly in
      DEC-20260809-16c8f4, in batch.yaml, in the dispatch queue's batch_notes,
      in the TASK-20260809-9a49e4 task card and in its handoff. THE OPERATIVE
      REMEDY IS A DECLARED, VERIFIED-FREE PAIR OF IDENTIFIERS: the BATCH-001
      evidence record is EV-AES-790d63 at ledger/evidence/EV-AES-790d63.yaml
      and the BATCH-001 closing decision is DEC-20260809-9d8e92 at
      ledger/decisions/DEC-20260809-9d8e92.yaml, both drawn with
      tools/allocate_id.py and `--check`ed free before being named, and both
      declared in TASK-20260809-9a49e4's artifact_paths and archive.record_ids.
      TASK-20260809-9a49e4 uses exactly those and draws no new id.
    disposition_note_neither_record_exists: >-
      The two identifiers are declared; the two RECORDS are not written and were
      not written by this act. Nothing has been measured and nothing is implied
      about what they will say.
    the_superseded_remedy_preserved_verbatim: >-
      "The BATCH-001 evidence record and the BATCH-001 closing decision are
      MINTED FRESH AT WRITE TIME inside TASK-20260809-9a49e4 with `python3
      tools/allocate_id.py --next evidence --area AES` and `python3
      tools/allocate_id.py --next coordinator_decision --date <the write date>`,
      each `--check`ed before use. NO identifier is pre-minted by this act."
    why_the_remedy_was_replaced: >-
      NOT A CHANGE OF MIND ABOUT THE COLLISION — THE COLLISION FINDING ABOVE IS
      UNCHANGED AND STANDS ON ITS OWN. tools/research_dispatch.py will not queue
      a ledger archive whose record ids are unknown (see
      the_repaired_queue_was_rejected_a_second_time.defect_2b), so the
      mint-later instruction was unexecutable. Declaring a drawn, verified-free
      identifier in a reviewable control-plane record is also strictly better
      than instructing a future session to mint one, and it honours the
      superseded remedy's own caution: what mints collisions is naming an
      identifier that has NOT been drawn, and both of these were drawn and
      checked.
    what_was_not_done_to_EV_AES_005: >-
      It was NOT edited, NOT superseded, NOT renamed, NOT deleted and NOT cited
      as this batch's evidence. It was read once, read-only, to confirm the
      collision rather than to take it on trust.
    the_superseded_instruction_is_preserved: >-
      The full prior next_action, including its `EV-AES-005` sentence, is
      preserved VERBATIM in the goal record under
      next_action_superseded_20260809. A committed instruction is not destroyed
      because part of it turned out to be unexecutable; it is superseded in
      view.

