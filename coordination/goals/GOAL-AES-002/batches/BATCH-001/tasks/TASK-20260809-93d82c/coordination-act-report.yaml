      TASK-20260809-9a49e4: [TASK-20260809-9b0401, TASK-20260809-33a159]
    the_defect_was_real_and_it_was_this_acts: >-
      The rank-1 commit was described in PROSE in three places — the queue
      objective, the batch_notes and the rank-1 card's completion gate — and
      OWNED BY NO TASK, so the artifacts that gate every later card had no
      declared archive, no budget, no receipt, no completion gate and no
      reviewer.
    what_was_not_wrong: >-
      THE GATE ORDERING, which is NOT reversed. Rank 1's artifacts belong in an
      isolated coordination commit BEFORE ranks 2 and 3 dispatch; folding them
      into the post-producer snapshot would make the gate retroactive. The
      dispatcher required the earlier commit to be DECLARED, not moved.
    the_repair: >-
      TASK-20260809-7bab1e was added — coordinator, queued, review_required
      false, archive kind `snapshot`, priority 97, depends_on
      [TASK-20260809-23abf9] AS FIRST WRITTEN, which is precisely the defect
      round 2 caught and which is corrected to
      [TASK-20260809-93d82c, TASK-20260809-23abf9] under
      the_repaired_queue_was_rejected_a_second_time below — running ALONE,
      covering source_task_ids
      [TASK-20260809-93d82c, TASK-20260809-23abf9], carrying SC-1 through
      SC-10 in identical language. Ranks 2 and 3 and TASK-20260809-877f6b were
      re-pointed from depends_on TASK-20260809-23abf9 to depends_on
      TASK-20260809-7bab1e, so the producers are gated on the VERIFIED ARCHIVE
      rather than on the authoring. TASK-20260809-877f6b and
      TASK-20260809-9a49e4 keep their source_task_ids unchanged.
    how_this_act_is_itself_covered_and_what_that_does_not_imply: >-
      TASK-20260809-93d82c is `completed` and its artifacts ARE the control
      plane. They are committed BY THE DISPATCHING SESSION IN THE SAME COMMIT
      THAT LANDS THE QUEUE, before TASK-20260809-7bab1e runs. Covering this act
