  the_queue_was_rejected_three_times_and_repaired_three_times:
    status: >-
      RECORDED AS THREE ROUNDS, NOT ONE. THIS ACT'S QUEUE WAS REJECTED BY
      tools/research_dispatch.py THREE TIMES, and every round is charged to this
      act rather than smoothed into a single clean pass. Round 1: incomplete
      archive coverage. Round 2, AFTER the round-1 repair and containing TWO
      errors at once: an archive task that did not directly depend on one of its
      own declared sources, and a ledger archive that owned no artifact under
      ledger/evidence/ or ledger/decisions/. Round 3, AFTER both round-2 repairs
      and unreachable before them: neither independent reviewer depended on any
      of the three review_required producers. FOUR DEFECTS ACROSS THREE ROUNDS,
      ALL OF THEM THIS ACT'S. Details in
      the_first_queue_draft_was_rejected_by_the_dispatcher,
      the_repaired_queue_was_rejected_a_second_time and
      the_queue_was_rejected_a_third_time_on_the_review_chain below.
    rounds:
      - round: 1
        verbatim_error: >-
          dispatch error: non-archive task TASK-20260809-23abf9 must be
          assigned exactly once to an archive task
        repair: TASK-20260809-7bab1e declared, at a 500 s declared budget overrun
      - round: 2
        verbatim_errors:
          - >-
            dispatch error: archive task TASK-20260809-7bab1e must directly
            depend on source TASK-20260809-93d82c
          - >-
            dispatch error: ledger archive TASK-20260809-9a49e4 must own exact
            artifacts under ledger/evidence/ and ledger/decisions/
        repairs:
          - >-
            TASK-20260809-7bab1e depends_on corrected to
            [TASK-20260809-93d82c, TASK-20260809-23abf9]
          - >-
            TASK-20260809-9a49e4 declares ledger/evidence/EV-AES-790d63.yaml and
            ledger/decisions/DEC-20260809-9d8e92.yaml in artifact_paths and
            both ids in archive.record_ids
        added_tasks: none
        added_budget_seconds: 0
      - round: 3
        verbatim_error: >-
          dispatch error: TASK-20260809-23abf9 requires an independent
          reviewer, validator, or red-team successor
        repair: >-
          TASK-20260809-9b0401 and TASK-20260809-33a159 depends_on set to
          [TASK-20260809-23abf9, TASK-20260809-7bab1e, TASK-20260809-9b78b2,
          TASK-20260809-8ab82c, TASK-20260809-877f6b]
        added_tasks: none
        added_budget_seconds: 0
    the_structural_rules_are_enforced_only_at_render_time_and_are_stated_nowhere_this_act_read: >-
      A FINDING WORTH KEEPING, AND NOT AN EXCUSE. All three rejections were on
      STRUCTURAL rules of tools/research_dispatch.py — (1) every non-archive
      task assigned exactly once to an archive task, (2) a ledger archive owning
      exact artifacts under ledger/evidence/ and ledger/decisions/ with its
      record ids visible in the filenames, (3) a direct
      validator/reviewer/red-team successor for every review_required task,
      itself depending on that producer's snapshot archive. NONE of the three is
      stated in the committed GOAL-AES-002 next_action, in RQ-AES-002, in
      AGENTS.md, in CLAUDE.md or in any queue template; all three are discovered
      only when the tool renders a queue, one error at a time, and rules 2 and 3
      are unreachable until the earlier ones pass. THE HONEST SPLIT: part of the
      three-round cost is this act's own sloppiness and is charged as such; part
      is real harness friction that every campaign drafting a queue will pay,
      and it is not visible in any budget line. The 700 s queue-drafting line
      was sized for ONE pass. THIS RECEIPT DOES NOT RE-SIZE IT and changes no
      budget figure — that belongs to a later Coordinator budget act with its
      own rationale, and re-sizing a line while repairing the queue that
      revealed the cost would be sizing the budget to the outcome. A concrete
      successor, named rather than left implicit: a pre-render structural
      checklist carried in the queue template, or a `--dry-run --all-errors`
      mode that reports every structural defect in one pass instead of the first
      one it reaches.

  the_first_queue_draft_was_rejected_by_the_dispatcher:
    status: >-
      RECORDED AS A DEFECT AGAINST THIS ACT RATHER THAN ERASED. This receipt
      charges the drafting act; the drafting act produced a queue the
      dispatcher refused, and that is part of what this act did. THIS IS ROUND
      1 OF TWO.
    verbatim_error: >-
      dispatch error: non-archive task TASK-20260809-23abf9 must be assigned
      exactly once to an archive task
    rule_enforced: >-
      tools/research_dispatch.py requires EVERY non-archive task to appear
      exactly once in some archive task's archive.source_task_ids.
    uncovered_tasks:
