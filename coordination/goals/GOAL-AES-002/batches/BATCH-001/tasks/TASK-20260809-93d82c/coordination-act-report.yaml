  the_queue_was_rejected_a_third_time_on_the_review_chain:
    status: >-
      ROUND 3 OF THREE, AND CHARGED TO THIS ACT LIKE ROUNDS 1 AND 2. The queue
      produced by the round-2 repairs was submitted and REJECTED AGAIN.
    verbatim_error: >-
      dispatch error: TASK-20260809-23abf9 requires an independent reviewer,
      validator, or red-team successor
    why_it_could_not_surface_earlier: >-
      tools/research_dispatch.py calls `_validate_review_chains` AFTER the
      archive-coverage loop and AFTER `_validate_ledger_archive`, so rounds 1
      and 2 masked it. THE ERROR WAS PREDICTED FROM A STATIC READING OF THE TOOL
      BEFORE IT WAS OBSERVED, and the prediction was recorded as a prediction
      and NOT acted on: this Coordinator has no Bash tool, could not run the
      dispatcher, and does not treat its own reading of source as a verdict. The
      dispatching session then ran the tool and returned the error verbatim,
      which is what makes it a fact here. The dispatching session also confirmed
      that its exhaustion loop stopped at round 2 because it had no auto-fix
      rule for the ledger-artifact error, so line 590 was never reached; the
      file this act repaired was unmodified.
    the_defect: >-
      THREE tasks carry review_required true — TASK-20260809-23abf9,
      TASK-20260809-9b78b2 and TASK-20260809-8ab82c — and NEITHER independent
      reviewer depended on ANY of them directly: TASK-20260809-9b0401 and
      TASK-20260809-33a159 both carried depends_on [TASK-20260809-877f6b] alone.
      `_validate_review_chains` requires a DIRECT validator, reviewer or
      red-team successor for every reviewed producer, and requires that reviewer
      to depend on the producer's snapshot archive as well.
    the_repair: >-
      Both reviewers now depend on
      [TASK-20260809-23abf9, TASK-20260809-7bab1e, TASK-20260809-9b78b2,
      TASK-20260809-8ab82c, TASK-20260809-877f6b], reconciled across
      dispatch_queue.json, ledger/handoffs/TASK-20260809-9b0401.yaml,
      ledger/handoffs/TASK-20260809-33a159.yaml, both task cards, batch.yaml
      task_inventory and archive_coverage, and this receipt's
      ranked_shape_authored. The TASK-20260809-7bab1e edge satisfies the rule's
      second half for producer TASK-20260809-23abf9, whose snapshot archive it
      is.
    it_makes_an_intended_relation_explicit_rather_than_adding_review_scope: >-
      STATED CAREFULLY, BECAUSE AN ADDED DEPENDENCY LOOKS LIKE ADDED WORK AND
      HERE IS NOT. Every added node was ALREADY A TRANSITIVE ANCESTOR of both
      reviewers through TASK-20260809-877f6b, so nothing runs earlier or later,
