      SEPARATE FUTURE COMMIT OF THIS ACT'S ARTIFACTS AND MUST NOT BE READ AS
      PROMISING ONE.
    what_the_repair_did_not_change: >-
      No status transition, no completion criterion met, no evidence record, no
      hypothesis, no knowledge promotion, no claim about AES at any round
      count, no change to the EV-AES-005 ruling, and no change to
      GOAL-AES-001.

  the_repaired_queue_was_rejected_a_second_time:
    status: >-
      ROUND 2 OF TWO, AND CHARGED TO THIS ACT LIKE ROUND 1. The queue produced
      by the round-1 repair was submitted and REJECTED AGAIN, for two further
      defects. Both were this act's. Neither is an infrastructure failure and
      neither is blamed on the tool: tools/research_dispatch.py stated exactly
      what was wrong, twice, and was right both times.
    verbatim_error_2a: >-
      dispatch error: archive task TASK-20260809-7bab1e must directly depend on
      source TASK-20260809-93d82c
    defect_2a: >-
      The round-1 repair gave TASK-20260809-7bab1e archive.source_task_ids
      [TASK-20260809-93d82c, TASK-20260809-23abf9] but depends_on
      [TASK-20260809-23abf9] alone. The dispatcher requires an archive task to
      DIRECTLY DEPEND ON EVERY TASK IN ITS source_task_ids, so that coverage is
      visible in the dependency graph and not merely asserted in the archive
      block.
    repair_2a: >-
      depends_on is now [TASK-20260809-93d82c, TASK-20260809-23abf9], reconciled
      across dispatch_queue.json, ledger/handoffs/TASK-20260809-7bab1e.yaml, the
      TASK-20260809-7bab1e card, batch.yaml task_inventory and archive_coverage,
      and this receipt's ranked_shape_authored. TASK-20260809-93d82c is state
      `completed`, so the added edge is satisfied at dispatch and delays
      nothing.
    verbatim_error_2b: >-
      dispatch error: ledger archive TASK-20260809-9a49e4 must own exact
      artifacts under ledger/evidence/ and ledger/decisions/
    defect_2b: >-
      TASK-20260809-9a49e4 declared only its two receipt paths and an EMPTY
      archive.record_ids, because this act had ruled both closing record ids be
      minted at write time. tools/research_dispatch.py `_validate_ledger_archive`
