      under ledger/evidence/ and at least one under ledger/decisions/;
      `_ledger_record_matches_path` requires each record's id to be visible in
      its filename; and archive.record_ids must list them. A LEDGER ARCHIVE
      WHOSE RECORD IDS ARE UNKNOWN AT QUEUE TIME CANNOT BE QUEUED.
    repair_2b: >-
      Both ids were drawn with tools/allocate_id.py and `--check`ed free across
      the union of committed and in-flight state, and DECLARED: evidence
      EV-AES-790d63 at ledger/evidence/EV-AES-790d63.yaml and closing decision
      DEC-20260809-9d8e92 at ledger/decisions/DEC-20260809-9d8e92.yaml, written
      into TASK-20260809-9a49e4's artifact_paths and archive.record_ids in the
      queue and in its handoff, into its card, into batch.yaml and into this
      receipt. knowledge/INDEX.md was REMOVED from that task's write scope in
      the same repair: it is generated, `.gitignore`d and must never be
      committed.
    the_two_declared_records_do_not_exist_and_were_not_created: >-
      SAID PLAINLY BECAUSE A DECLARED IDENTIFIER IS EASY TO MISREAD AS A
      RESULT. Neither EV-AES-790d63 nor DEC-20260809-9d8e92 was written by this
      act, and neither may be written before TASK-20260809-9a49e4 runs. NOTHING
      HAS BEEN MEASURED: no producer has run, no CM-1 exists, no ideation was
