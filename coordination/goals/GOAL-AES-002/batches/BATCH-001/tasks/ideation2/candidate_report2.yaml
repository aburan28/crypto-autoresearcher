  headline: >-
    TWO ADMISSIBLE CANDIDATES, PLUS ONE SUPERSEDED OBSTRUCTION THAT IS THE REAL
    OUTPUT OF THIS PASS. (1) The O-3 premise is BREAKABLE IN PRINCIPLE — it
    fails whenever the candidate test factors — but is FORCED for full-round AES
    by two-round full diffusion (derivation D-3), which is a stronger obstruction
    than O-3's own counting argument. Therefore the only route escaping O-3 is
    one that never enumerates, and the directive's gaps 1 and 2 collapse into one
    question. (2) O-5 IS WRONG AS A BOUND ON THAT ROUTE, by roughly 325-460 bits
    it bounds solvers whose exponent is linear in the variable count, not the
    Groebner/XL family whose cost is C(N,d_reg)^omega. Corrected band 2^246 to
    2^379, requiring d_reg <= 6-7 against a semi-regular crossover proxy of
    ~16-22. (3) A FOURTH OBJECT CLASS EXISTS (class D, objects of the
    key-indexed function) and is enumerated with five members, four of which
    close and one of which is CAND-FR2-B. NO CLAIM ABOUT AES SECURITY IS MADE.
    NO DISTINGUISHER, NO KEY RECOVERY, NO SPEEDUP, NO BARRIER STATEMENT ABOUT
    AES, NO IMPOSSIBILITY CLAIM. ZERO COMPUTE WAS RUN THIS SESSION.
  o3_premise_verdict: >-
    BREAKABLE IN PRINCIPLE, FORCED IN PRACTICE FOR FULL-ROUND AES. O-3 rests on
    two premises: (P-a) the attack enumerates candidates individually, and (P-b)
    it pays at least one S-box per candidate. (P-b) is not a law: it fails
    exactly when the candidate test factors as an m-bit match between a forward
    function of (K_1, P) and a backward function of (K_2, C), which makes the
    per-candidate cost 2^{-kappa/2} S-boxes. Derivation D-3 shows AES admits no
    such exact factorization at 10, 12 or 14 rounds for any nontrivial key
    partition, because full key-and-state dependence is reached in two rounds
    forward from P and two rounds backward from C, so the forward-eligible bits
    (round <= 1) and backward-eligible bits (round >= 9) are disjoint. The
    biclique family escapes D-3 only by abandoning exactness and paying
    recomputation, which is premise (P-b) by construction; the measured GATE 1
    rho_min = 0.77 (154 of 200 S-boxes) sits 7.27 bits ABOVE the O-3 ceiling,
    consistent with that reading.
  prior_declared_up_front: >-
    The prior against a full-round result remains overwhelming and is restated
    rather than rediscovered. This pass proceeded because premature closure is a
    declared failure mode symmetric with overclaiming, and because the first
    pass's own "no fourth class" was explicitly a statement about its search. It
    reports two candidates rather than five because a padded list is worse than a
    short honest one; padding was available and declined.

candidates:

  # =====================================================================
  # CANDIDATE 1
  # =====================================================================
  - idea:
      id: CAND-FR2-A
      ledger_id: null
      ledger_id_note: >-
        NULL BY FACT. The Coordinator assigns IDEA-YYYYMMDD-NNN. Pre-allocating
        one here would risk an ID collision with a concurrent branch.
      title: >-
        Rank, never count. The degree of regularity of the actual AES ideal
        against its semi-regular prediction, with a matched random-system null
        and a matched random-S-box sibling null
      class: measurement_and_derivation
      tracked_object: >-
        THE GRADED HILBERT FUNCTION OF THE MACAULAY MATRIX OF THE AES SYSTEM.
        Concretely, for the quadratic representation of r-round AES in state and
        key variables, the object is the sequence
        h(d) = (number of degree-<=d monomial columns) - (rank of the Macaulay
        matrix at degree d), together with its DEFICIT against the semi-regular
        prediction from the Hilbert series (1+z)^N / (1+z^2)^M. It is an object
        of the IDEAL (class C), taken at the graded level where the solving cost
        actually lives, rather than at the level of the raw variable count where
        O-5 took it.
      class_membership: >-
        Class C (algebraic), per the first pass's trichotomy. Governed by
        obstruction O-5' (derived in gap_analysis.md section 3), which SUPERSEDES
        O-5.
      supersedes_note: >-
        This candidate exists because O-5 is a category error and this report
        says so with a derivation. O-5 bounds solvers whose exponent is linear in
        N (the exhaustive / polynomial-method line) and correctly gives >= 2^704
        for those. It does NOT bound the Groebner/XL/Macaulay family, whose cost
        is C(N, d_reg)^omega and is not exponential in N. Nothing in the first
        pass is retracted about the family it actually bounded.
      claim: >-
        (i) DERIVED, NOT MEASURED — a Groebner/XL attack on the ~1408-variable
        quadratic representation of full-round AES-128 costs below the
        DEFINITIONAL exhaustive-key-search reference of 2^128 full-AES
        evaluations, under a cost model NOT YET FROZEN AS CM-1 and with the
        published-state-of-the-art comparison UNADJUDICABLE and asserted in
        neither direction, IF AND ONLY IF d_reg <= 6 at omega = 2.37 or
        d_reg <= 7 at omega = 2 (derivation D-1). (ii) TO BE MEASURED — the exact
        semi-regular d_reg at the derived AES-shaped (N, M) is at least 12, so
        the required drop is a factor of at least 2 below the semi-regular value.
        (iii) TO BE MEASURED — at the largest toy scale this envelope reaches
        (degree 3, N <= 40), the AES-shaped block system's Macaulay rank deficit
        against its own semi-regular prediction is NOT LARGER than that of a
        matched random-S-box null of identical wiring, variable count and
        equation count.
      mechanism: >-
        Groebner-family cost is set by the degree the solver reaches, and the
        Macaulay matrix at degree d has exactly C(N, <=d) columns — an exact
        combinatorial fact, not a model. Structure can only help by lowering that
        degree. Three named routes by which AES's structure might lower it are
        each closed by a separate derivation in gap_analysis.md: the GF(2^8)
        representation (O-6, the descent cancellation is exact — dividing the
        variable count by the extension degree 8 and multiplying it back by 8 the
        moment quadraticity is restored via Frobenius conjugates, because the
        affine layer L is GF(2)-linear and its GF(2^8) description is its
        Frobenius orbit); sparsity (moves omega from 2.37 toward 2, worth exactly
        one unit of d_reg, not a lane); and block structure (helps only via a
        small separator, and O-7 shows the super-box decomposition supplies none,
        since layer-to-layer connectivity is complete bipartite K_{4,4} with
        8-bit edges, so any inter-layer cut costs 128 bits). What is left
        unexplained is d_reg itself, and that is what this instrument measures.
      novelty_status: unverified
      novelty_note: >-
        NOVELTY IS UNRESOLVABLE IN THIS ENVIRONMENT AND IS NOT CLAIMED, IN EITHER
        DIRECTION. The honest expectation is that specialists have computed the
        semi-regular d_reg for AES-shaped systems and that the "rank, never
        count" discipline is exactly the lesson the community drew from the XSL
        episode; recall confidence that this is standard practice is MEDIUM-HIGH
        and UNVERIFIED-FROM-MEMORY. CORPUS GREP PERFORMED. knowledge/ and
        ledger/hypotheses/ contain no AES algebraic record. The repository DOES
        contain directly relevant prior art that this candidate builds on rather
        than duplicates — research/dreg-linear-law/ (GOAL-DREG-001,
        EV-DREG-001..004, H-DREG-001) established the same divide-by-(1+z^d)
        semi-regular Hilbert-series instrument for a boolean Weil-descent Semaev
        family, validated it against a support-matched random null at every
        degree below d_reg, and found in FINDING_v2 item 5 that the STRUCTURED
        system's d_reg exceeded the null's, i.e. the wrong direction for an
        attacker. That is a prior about a DIFFERENT family and is used here as
        methodology and as a stated prior, never as evidence about AES.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          The projection maps the full Macaulay matrix at degree d (a
          rows-by-C(N,<=d) GF(2) matrix) to the single integer h(d) = columns -
          rank, and then to the deficit against the semi-regular prediction. The
          discard is total in every direction except rank: the matrix's support
          pattern, its row space, the solution set, and the ideal's generators
          are all discarded. What is retained propagates deterministically
          through the operation that matters — the graded structure of the ideal
          — because rank at degree d is a well-defined function of the ideal's
          degree-d piece and is invariant under change of monomial order and
          under any invertible linear change of variables. THAT INVARIANCE IS THE
          COMPATIBILITY REQUIREMENT, and it is what makes the object an object
          rather than an artifact of a representation choice.
        not_a_change_of_coordinates_because: >-
          h(d) is one integer per degree against a matrix with up to C(1408,6) ~
          2^53 columns. It cannot determine the system, the ideal, or the key.
          Contrast the first pass's section 5.1, where sigma(K) determines K and
          the object was correctly dropped.
        contrast_with_a_projection_that_would_FAIL: >-
          Tracking the full Macaulay matrix, or the full Hilbert SERIES with
          multiplicities of the actual system, would lose nothing that matters
          and would be a change of representation. The lossy step is the
          collapse to a per-degree integer and then to a DEFICIT against a
          prediction.
      survival_depth: >-
        ALL 10 / 12 / 14 ROUNDS, WITH NO LOSS. This is the defining property of
        class C and it is why class C is the only class escaping both O-3 and the
        depth wall: the system is an exact description of the cipher and gets
        LARGER, not weaker, with rounds. Nothing dies. The honest inversion of
        the survival question for this class is: what must be true for the class
        to matter, and the answer is a single number, d_reg <= 6-7.
      assumptions:
        - >-
          A1. The Macaulay matrix at degree d has C(N, <=d) columns. EXACT
          COMBINATORICS, not a model.
        - >-
          A2. Dense linear algebra on that matrix costs C(N,<=d)^omega with
          omega in [2, 2.37], and sparse elimination reaches omega = 2 at a cost
          linear in the row weight (<= 137 for a quadratic in 16 variables).
          THIS IS A COST-MODEL CHOICE and is labelled as one; see H2-A.
        - >-
          A3. N = 1408 GF(2) variables for 10-round AES-128, per the first pass.
          The alternative count 1600, obtained by carrying the 40 key-schedule
          S-box outputs and 9 x 128 round-boundary state bits explicitly, moves
          every figure by under 2 bits per unit of d. BOTH ARE REPORTED; neither
          is chosen silently.
        - >-
          A4. M, the quadratic-relation supply, is DERIVED as the corank of the
          137 x 256 GF(2) evaluation matrix of degree-<=2 monomials on the S-box
          graph, NOT recalled. The commonly recalled 39-per-S-box figure (recall
          MEDIUM, UNVERIFIED-FROM-MEMORY) is used only to size the arithmetic in
          advance and is replaced by the derived rank in the gate.
      predictions:
        - metric: >-
            exact semi-regular d_reg at the derived AES-shaped (N, M) for
            AES-128, from the first non-positive coefficient of
            (1+z)^N / (1+z^2)^M
          direction: higher
          minimum_effect: >-
            d_reg >= 12, i.e. at least a factor of 2 above the d_reg <= 6-7
            required by D-1. Crossover proxy computed in text gives ~16 at
            M = 7800 and ~22 at M = 4000.
        - metric: >-
            degree-3 Macaulay rank deficit of the AES-shaped toy block system
            against its own semi-regular prediction, normalized by column count
          direction: different
          minimum_effect: >-
            within 1 percent of the matched random-S-box null (NULL-R). A
            deficit exceeding the null by more than 5 percent of columns is the
            positive reading and must be escalated, not extrapolated.
        - metric: >-
            same deficit for NULL-R, the matched random-S-box system of
            identical wiring, N and M
          direction: different
          minimum_effect: >-
            EXACTLY ZERO relative to its own semi-regular prediction at every
            degree below its d_reg. This is the SANITY ANCHOR, and it is the
            reading the in-repo dreg instrument was independently validated
            against for a different family. A nonzero null deficit voids the run.
        - metric: >-
            same deficit for NULL-L, the sensitivity anchor in which SubBytes is
            replaced by the identity, making the whole system linear
          direction: higher
          minimum_effect: >-
            enormous, at least 50 percent of columns. If the instrument cannot
            see a deficit where one certainly exists, no negative reading means
            anything.
        - metric: >-
            normalized deficit of the AES-shaped toy system as the round count of
            the toy rises 1 -> 2 -> 3
          direction: lower
          minimum_effect: >-
            strictly decreasing. Structure should DILUTE as more mixing is
            applied; a normalized deficit that is flat across rounds fires the
            VOID condition.
      discriminates_between:
        E1: >-
          "AES's algebraic structure lowers the solving degree below the
          semi-regular value." SIGNATURE — the AES-shaped toy's normalized
          degree-3 deficit strictly exceeds NULL-R's while NULL-R reads exactly
          zero against its own prediction, AND the excess does not vanish as the
          toy's round count rises. CONSEQUENCE — the single number that gates the
          only class escaping both walls has measurable structure at the only
          scale visible here, and the next batch's entire budget goes to the
          scaling question. THIS OUTCOME MUST NOT BE CONVERTED INTO A COMPLEXITY
          CLAIM, because doing so at toy scale is precisely the XSL error; it is
          a lead and nothing more.
        E2: >-
          "AES's algebraic structure does not lower the solving degree, and the
          apparent over-determinedness is descent artifact." SIGNATURE — the
          AES-shaped deficit is statistically indistinguishable from NULL-R's,
          while NULL-L shows an enormous deficit so the instrument demonstrably
          works. CONSEQUENCE — O-6's prediction is confirmed at the visible
          scale, class C's gate stands at d_reg ~ semi-regular, and the honest
          record is that the ONE class escaping both walls has no measured
          structure at the one scale where measurement is possible. THIS IS THE
          MORE VALUABLE OUTCOME because it converts a 2^704 that was the wrong
          number into a 2^246-2^379 that is the right one, with a matched null
          behind it.
        why_this_is_not_try_and_see: >-
          Both outcomes are pre-specified with numeric thresholds; both change
          what the next batch does; the sanity anchor (NULL-R reads exactly
          zero) and the sensitivity anchor (NULL-L reads enormous) are chosen so
          that neither outcome can be produced by an instrument artifact without
          also firing a pre-registered VOID or falsification condition; and the
          round-count decay direction is fixed in advance.
      minimal_test:
        design: >-
          THREE LEGS, ascending in cost, each usable alone.
          LEG 1 (FREE, seconds, pure Python, exact integers). Compute the exact
          semi-regular d_reg for (N, M) = (1408, M_derived) and (1600,
          M_derived) from the first non-positive coefficient of
          (1+z)^N / (1+z^2)^M, by the same divide-by-(1+z^d) recurrence as
          research/dreg-linear-law/dreg_growth_law.py. Report d_reg and the
          implied cost C(N,d_reg)^omega at omega = 2 and 2.37, beside the
          DEFINITIONAL 2^128 reference, with the R5 clause in the same sentence.
          Report sensitivity across M in {2000, 4000, 7800, 12000}.
          LEG 2 (FREE, milliseconds, pure Python). Derive M by building the
          137 x 256 GF(2) matrix of degree-<=2 monomials evaluated on the AES
          S-box graph and taking its corank. Repeat for a seeded random 8-bit
          bijection (the null), for Inv alone without the affine layer L, and for
          L alone. Report all four coranks and the degree-3 analogue (697 x 256).
          LEG 3 (MINUTES, pure Python, bitset Gaussian elimination with rows as
          Python ints). Build the degree-3 Macaulay matrix for a small AES-shaped
          block cipher over GF(2^4) — 4-bit inversion-based S-box, 4-nibble
          state, MDS-like linear layer, 1/2/3 rounds — sized so that N <= 40 and
          the column count C(N,<=3) <= 11000. Measure rank, compute h(3), and
          compare against the semi-regular prediction at the same (N, M).
          Repeat identically for NULL-R (seeded random 4-bit bijection, same
          wiring), NULL-L (identity S-box), and NULL-S (a random quadratic system
          with matched N, M and block sparsity but no cipher structure).
        controls:
          - >-
            NULL-R random 4-bit bijection in the identical wiring — the PRIMARY
            NULL. Negates S-box specificity while preserving the block structure.
          - >-
            NULL-S random quadratic system with matched N, M and block sparsity
            — the SIBLING NULL. Negates the block structure while preserving the
            counts, so that "any change to the system moves the deficit" cannot
            be mistaken for attribution. This is the KN-FIND-018 practice rule 6
            and EV-AES-003 A-10 lesson applied in advance rather than discovered
            by a validator afterwards.
          - >-
            NULL-L identity S-box — the SENSITIVITY ANCHOR. The system becomes
            linear and the deficit must be enormous.
          - >-
            SANITY ANCHOR — NULL-R must read a deficit of exactly zero against
            its own semi-regular prediction at every degree below its d_reg.
            This is the property the in-repo dreg instrument was independently
            validated on for a different family, and it is the strongest
            available check that the semi-regular model is being applied
            correctly.
          - >-
            CONTROL-OF-CONTROL — a semantics-preserving relabelling of the
            variable indices must leave every rank unchanged. If it does not, the
            instrument is wrong. GATE 1 of the first pass used exactly this
            check and it held bit-identically on 720885 cells.
        required_metrics:
          - exact semi-regular d_reg per (N, M), with the full coefficient table
          - >-
            implied cost C(N,d_reg)^omega at omega = 2 and 2.37, and the DENSE
            and SPARSE memory beside it, always beside the 2^128 definitional
            reference and always carrying the R5 clause
          - derived M, and the four coranks of LEG 2
          - >-
            h(3), the semi-regular prediction, and the normalized deficit, per
            matrix and per toy round count, with the full rank profile and not
            just the deficit
        envelope_fit: >-
          FITS, AND LEGS 1 AND 2 ARE FREE. 4 cores, 15 GB, pure Python, no numpy,
          no sage, no SAT, no MILP, no GPU. Legs 1 and 2 are seconds. Leg 3 at
          N <= 40 and degree 3 has <= 11000 columns (about 172 64-bit words per
          row) and a few thousand rows; bitset elimination costs on the order of
          5e7 Python-int XORs, minutes on one core, and the four matrices
          parallelize over the 4 cores. DECLARED OUT OF ENVELOPE AND NOT
          ESTIMATED — degree 4 at N = 32 (about 41000 columns) and any Macaulay
          rank at N >= 48, both of which exceed a 1600 s task by one to two
          orders of magnitude in pure Python.
      falsification_conditions:
        - >-
          Semi-regular d_reg <= 7 at the AES-shaped (N, M) for any M in the
          reported sensitivity range. This falsifies prediction (ii) and would
          mean the algebraic lane reaches the definitional reference WITHOUT any
          structural gain at all. It must be escalated immediately and re-derived
          independently before a single further word is written about it.
        - >-
          NULL-R's deficit against its own semi-regular prediction is nonzero at
          any degree below its d_reg. The semi-regular model is being applied
          incorrectly and every reading is void, not negative.
        - >-
          NULL-L's deficit is not enormous. The instrument cannot see structure
          where structure certainly exists; every negative reading is void.
        - >-
          Any rank exceeding the column count, or any relabelling changing any
          rank. Coding error.
      void_condition: >-
        PRE-REGISTERED. If the NORMALIZED degree-3 deficit of the AES-shaped
        system FAILS TO DECREASE as the toy's round count rises from 1 to 2 to 3,
        every reading is void. Rationale, stated in the direction this statistic
        must move: adding rounds adds variables and equations in fixed
        proportion, so a genuine structural excess should DILUTE; a normalized
        deficit that is flat or rising across rounds is the canonical artifact
        tell of docs/inventor-protocol.md section 3, recorded in EV-AES-001 B-5
        where exactly that shape turned out to be a byte-activity cliff. This
        condition is written before the run and not after.
      confounders:
        - >-
          THE DOMINANT ONE, NAMED FIRST. A toy-scale rank deficit does NOT
          extrapolate to AES-128, and extrapolating it is precisely the XSL
          error. Mitigation is structural rather than statistical: the gate is
          designed so that its INFORMATIVE outcome is E2 (a closure), and E1 is
          pre-declared to be a lead requiring a scaling study, never a complexity
          claim. Any output sentence converting a toy deficit into an AES-128
          cost MUST BE STRUCK, not deferred, following EV-AES-001 B-8.
        - >-
          The semi-regular prediction is a MODEL of a random system, and the AES
          system is not random. Comparing a structured system to a semi-regular
          model is not the same as comparing it to a null; that is why NULL-R and
          NULL-S exist and why NULL-R's exact-zero reading is a hard gate.
        - >-
          M is representation-dependent. Adding field equations, biaffine
          relations, or a different S-box encoding changes (N, M) and hence
          d_reg. Mitigation is the M sensitivity sweep in LEG 1 and the explicit
          reporting of both N = 1408 and N = 1600.
        - >-
          Degree 3 may be below the first fall for every arm, in which case all
          four read zero deficit and the instrument attributes nothing. This is a
          real possible outcome and is pre-registered as UNINFORMATIVE rather
          than as E2.
      interpretation_limits:
        - >-
          THIS MEASURES A GRADED RANK ON A TOY SYSTEM AND AN EXACT PREDICTION FOR
          A MODEL. It is not a distinguisher, not a key recovery, not a cost
          claim, and asserts nothing about AES security at any round count.
        - >-
          LEG 1's output is a property of the SEMI-REGULAR MODEL at AES's shape,
          not of AES. It bounds nothing about the true ideal. Its value is that
          it replaces a wrong number (2^704) with a right one for the model, and
          names the exact structural gain the lane requires.
        - >-
          O-5' is an ARGUMENT AT THE DERIVATION TIER, resting on a cost model for
          a solver family (A2) and on a semi-regular crossover PROXY. It is not
          machine-checked, not measured, and not reviewed.
        - >-
          Any comparison of any output against the published state of the art is
          UNADJUDICABLE and is asserted in neither direction.
      heuristic_assumptions:
        - id: H1-A
          statement: >-
            For a random quadratic system over GF(2) with N variables and M
            equations including the field equations, the rank of the Macaulay
            matrix at every degree d < d_reg equals the semi-regular prediction
            given by the coefficients of (1+z)^N / (1+z^2)^M, up to relative
            error below 2^-10. Formally, for all d < d_reg,
            | rank_measured(d) / rank_semireg(d) - 1 | < 2^-10.
          rigorous_support: >-
            The RIGOROUS ingredient is exact and needs no theorem: the Macaulay
            matrix at degree d has exactly C(N, <=d) columns and
            M x C(N, <=d-2) rows, both pure combinatorics. The DISTRIBUTIONAL
            ingredient is the semi-regularity model of the
            Bardet-Faugere-Salvy shape, whose role here is exactly the role
            Canfield-Erdos-Pomerance plays in the exemplar's Heuristic 1 — a
            classical distribution statement converting a counting bound into a
            generic prediction. THE MODEL'S NAME IS RECALLED (recall MEDIUM-HIGH,
            UNVERIFIED-FROM-MEMORY) BUT THE RECURRENCE IS NOT, because
            research/dreg-linear-law/dreg_growth_law.py implements it in this
            repository and FINDING_v2 records it having been validated against a
            support-matched random null at every degree below d_reg for a
            boolean Weil-descent family.
          validation_plan: >-
            LEG 3's NULL-R arm IS the validation, and it is a hard gate rather
            than a report. Sample: the full degree-3 Macaulay matrix of a seeded
            random-S-box system at the same (N, M) as the AES-shaped arm, for at
            least 8 independent seeds. Predicted distribution: rank exactly equal
            to the semi-regular prediction at every degree below d_reg, i.e. a
            point mass at deficit zero. TAIL CHECK: the maximum deficit over the
            8 seeds must be zero, not small. TOY-SCALE IN SYSTEM SIZE, EXACT IN
            ARITHMETIC — the scale caveat is about N <= 40 against 1408 and is
            not negotiable; this is NOT crypto-scale validation and must never be
            written as if it were.
        - id: H2-A
          statement: >-
            Groebner-family solving cost at solving degree d is
            Theta(C(N,<=d)^omega) with omega in [2, 2.37], with no
            superpolynomial factor hidden in the constant, uniformly for
            N in [10^3, 2 x 10^3] and d in [4, 25].
          rigorous_support: >-
            NO THEOREM, AND THIS IS THE ASSUMPTION MOST WORTH ATTACKING. It is a
            COST-MODEL CHOICE. Its direction is OPTIMISTIC FOR THE ATTACK — it
            charges no monomial-ordering overhead, no matrix construction, no
            reduction bookkeeping and no cost for reaching degree d at all — so
            it FLATTERS the algebraic lane and therefore makes O-5''s corrected
            band a LOWER bound on the lane's cost. That is the safe direction for
            a session that is superseding an obstruction downward.
          validation_plan: >-
            Report a second cost column charging sparse elimination explicitly
            (row weight <= 137, Wiedemann-shaped, memory = rows x row-weight)
            beside the dense column, with the ratio stated. If the two columns
            disagree by more than 5 bits at the reported d_reg, neither may be
            used alone. NOT VALIDATED BY EXECUTION IN THIS ENVIRONMENT — no
            Groebner engine exists here, and saying so is the honest handling
            rather than estimating one.
        - id: H3-A
          statement: >-
            The GF(2)-quadratic relation supply of the AES S-box is the corank of
            the 137 x 256 evaluation matrix, and that corank is a property of the
            graph of S alone, invariant under affine changes of the input and
            output coordinates.
          rigorous_support: >-
            RIGOROUS AND ELEMENTARY. The vanishing ideal of a finite point set is
            determined by the point set; degree-<=2 vanishing polynomials form
            the kernel of the evaluation map from the 137-dimensional monomial
            space to GF(2)^256; and an affine change of coordinates permutes the
            monomial space of degree <= 2 into itself, hence preserves the
            kernel dimension.
          validation_plan: >-
            LEG 2 computes it directly and additionally for Inv alone, for L
            alone, and for a seeded random bijection. PREDICTED — a random 8-bit
            bijection has corank 0 (137 monomials, 256 generic constraints), so
            any nonzero AES corank is a measurable, exactly-quantified statement
            that inversion is algebraically special. Tail check: repeat over 32
            seeded random bijections and report the maximum corank observed;
            a nonzero maximum would mean the generic prediction is wrong and
            must be reported before anything else is.
      target_complexity:
        time_exponent: >-
          C(N, d_reg)^omega. AT THE SEMI-REGULAR CROSSOVER PROXY d ~ 16-22 for
          AES-128 this is 2^246 (omega=2) to 2^379 (omega=2.37). THE REQUIREMENT
          to reach the DEFINITIONAL exhaustive-key-search reference of 2^128
          full-AES evaluations — under a cost model not yet frozen as CM-1, with
          the published-frontier comparison UNADJUDICABLE and asserted in neither
          direction — is d_reg <= 6 at omega = 2.37 or d_reg <= 7 at omega = 2.
          PREDICTED MEASURED OUTCOME — no structural gain visible, so the lane
          stands at 2^246-2^379, i.e. NO IMPROVEMENT and 118 to 251 bits WORSE
          than the reference.
        memory_exponent: >-
          STATED BESIDE TIME AS THE PROFILE REQUIRES, AND IT IS THE LANE'S
          WORST AXIS. At d_reg = 6 the matrix has 2^53.3 columns, giving dense
          memory ~2^106 bits and sparse memory ~2^57 words (rows 2^50 times row
          weight <= 137). Both are physically unrealizable. An algebraic attack
          in this lane would be a TIME-ONLY win at astronomically infeasible
          memory, and any Pareto statement must say so in the same breath. The
          EXPERIMENT itself is O(1) for legs 1-2 and under 1 GB for leg 3.
        data_exponent: >-
          1 to 2 known plaintext/ciphertext pairs. NOT dominated on the data
          axis by the definitional reference, which needs about 2.
        best_known: >-
          UNRESOLVABLE IN THIS ENVIRONMENT. The only reference used is the
          DEFINITIONAL exhaustive key search, 2^128 / 2^192 / 2^256 full-AES
          evaluations, O(1) memory, about 2 known pairs, success probability 1.
        hidden_overhead: >-
          A2 charges no monomial ordering, no matrix construction, no reduction
          bookkeeping, and no cost for the solver actually reaching degree d;
          all four are optimistic FOR THE ATTACK, which is the safe direction for
          a downward supersession. The semi-regular crossover proxy ignores
          Koszul syzygies, which push the true semi-regular d_reg slightly
          higher, so d* ~ 16 is a LOWER proxy and 2^246 is the optimistic end of
          the corrected band.
        tradeoff_note: >-
          The time-memory tradeoff in this lane runs the wrong way: reducing
          memory by sparse methods costs a factor in the row weight and buys only
          the move from omega = 2.37 to omega = 2, i.e. ONE UNIT of d_reg.
          Parallelization of dense elimination is standard and buys a linear
          factor with heavy communication, which exhaustive key search also gets
          with NO communication, so parallelism changes no comparison and if
          anything favours the reference.
        exponent_verdict: >-
          TARGET-CLASS IN SHAPE, NON-TARGET-CLASS IN PREDICTED RESULT. Under
          docs/target-result-profile.md A1/C1 the MECHANISM is the only one in
          this report that could move an exponent — 2^128 is not a barrier for a
          solver whose cost is C(N,d_reg)^omega, and the entire question is one
          integer. The PREDICTED result is a controlled null plus a corrected
          ceiling. The candidate's priority rests on correcting a 325-460 bit
          error in the program's own obstruction register, not on its expected
          yield.
      what_must_be_true_to_reach_round_10: >-
        NOTHING — the object already spans all 10 rounds with no loss, which is
        exactly why class C is the only class escaping both O-3 and the depth
        wall. The question is inverted for this class: what must be true for the
        class to MATTER, and the answer is the single inequality d_reg <= 6 at
        omega = 2.37 or d_reg <= 7 at omega = 2, against a semi-regular value
        predicted at 12 or more. STATED HONESTLY — that is an enormous structural
        demand, this program's only prior structured-versus-random d_reg
        measurement found the structured system's degree HIGHER than the null's
        for a different family, and the honest expectation is that AES behaves
        the same way.
      dominated_by: >-
        unresolvable in this environment; no primary source reachable; every
        recalled frontier row is unverified-from-memory. Against the ONE
        adjudicable reference — the DEFINITIONAL exhaustive key search at 2^128
        for AES-128, O(1) memory, about 2 known pairs — this candidate's LANE is
        dominated on TIME by 118 to 251 bits and on MEMORY by 57 to 106 bits
        under the predicted outcome, and is NOT dominated on DATA (1-2 known
        pairs against about 2). The candidate itself claims no attack and is
        dominated by the reference on every axis where an attack would be
        compared. `null` is not written.
      sota_delta: >-
        DEFINITIONAL-REFERENCE DELTA — 0 bits, predicted, because no attack is
        claimed; the lane's own predicted position is 118 to 251 bits WORSE than
        the 2^128 definitional reference under a cost model not yet frozen as
        CM-1. PUBLISHED-FRONTIER DELTA — UNADJUDICABLE, asserted in neither
        direction. The quantitative content of this candidate is not a delta but
        a SUPERSESSION — O-5's 2^704 replaced by O-5''s 2^246-2^379, a correction
        of 325 to 460 bits in the program's own obstruction register.
      estimated_cost:
        implementation: >-
          low for legs 1-2 (about 60 lines of pure Python each), medium for leg 3
          (bitset Gaussian elimination plus a toy cipher and three nulls)
        compute: >-
          legs 1-2 free (seconds); leg 3 minutes on 4 cores
        wall_clock: >-
          one 1600 s producer task covers all three legs, with legs 1-2
          deliverable in the first 120 s so that the free result is not lost if
          leg 3 halts on budget
      recommended_priority: high
      priority_rationale: >-
        HIGHEST INFORMATION PER SECOND IN THIS REPORT, AND THE ONLY ITEM THAT
        CORRECTS AN EXISTING RECORD RATHER THAN ADDING ONE. Legs 1 and 2 are
        FREE, need no literature, no AES-NI and no toy cipher, and by themselves
