  # =====================================================================
  # CANDIDATE 2
  # =====================================================================
  - idea:
      id: CAND-FR2-B
      ledger_id: null
      ledger_id_note: >-
        NULL BY FACT. The Coordinator assigns IDEA-YYYYMMDD-NNN.
      title: >-
        The key-influence support of the full-round AES computation, its exact
        zero set, the derived MITM factorization width, and the almost-
        independence profile that bounds the class-B floor by measurement
      class: measurement
      tracked_object: >-
        THE KEY-INFLUENCE SUPPORT OF THE KEY-INDEXED FUNCTION. For a fixed
        plaintext P and fixed ciphertext C, the object is the matrix
        I(b, k) = Pr_K[ flipping master-key bit k changes intermediate bit b ],
        taken over every intermediate bit b of the full computation (every round,
        data path and key schedule, forward from P and backward from C) and every
        master-key bit k. The tracked projection is the SUPPORT — the exact-zero
        set Z = {(b,k) : I(b,k) = 0 over all sampled K} — together with the
        epsilon-almost-zero set Z_eps. It is a member of CLASS D, objects of the
        key-indexed function f_P(K) = E_K(P), which is the fourth object class
        this pass enumerates and the first pass reported not finding.
      class_membership: >-
        Class D, member D3, per gap_analysis.md section 6. It is the only member
        of that class that is simultaneously un-mined, un-closed, deterministic
        (hence not killed by O-8), and measurable at the FULL round count within
        this envelope.
      claim: >-
        (i) DERIVED (D-3) — for full-round AES-128/192/256 and any nontrivial
        partition K = K_1 || K_2, the exact-MITM factorization width is ZERO,
        because bits with zero influence from K_2 live at round <= 1 forward from
        P and bits with zero influence from K_1 live at round >= 9 backward from
        C, and those sets are disjoint at 10 rounds. Consequently the O-3 premise
        is FORCED for full-round AES. (ii) TO BE MEASURED — the exact-zero set Z
        is empty for every (b, k) with b at round >= 3 forward or <= 7 backward,
        at a resolution floor of 1/N_keys. (iii) TO BE MEASURED — the
        almost-independence profile |Z_eps| as a function of round and epsilon
        floors the class-B recomputation fraction strictly ABOVE the O-3
        counting bound, i.e. the true class ceiling is TIGHTER than 7.64 bits.
      mechanism: >-
        A MITM factorization of the candidate test needs an intermediate quantity
        computable from (P, K_1) alone and from (C, K_2) alone; that requires
        exact zero influence from the complementary key half, so the influence
        support is a NECESSARY condition and measuring it nonzero is a rigorous
        obstruction in the correct direction. The biclique family relaxes
        exactness to ALMOST-independence and pays recomputation for the
        difference, so the epsilon-profile of Z_eps is precisely the quantity
        that sets how much of the class-B ceiling is reachable. GATE 1 measured
        the RESULT of that trade for one enumeration family (rho_min = 0.77,
        7.27 bits above the ceiling); this instrument measures the STRUCTURE that
        sets it, and can therefore floor the class rather than sample it.
      novelty_status: unverified
      novelty_note: >-
        NOVELTY IS UNRESOLVABLE IN THIS ENVIRONMENT AND IS NOT CLAIMED, IN EITHER
        DIRECTION. Recall confidence that key-influence and diffusion-round
        analysis of AES is standard is HIGH and UNVERIFIED-FROM-MEMORY; the
        two-round full-diffusion property is textbook. What may not be standard
        is the framing as a class-D structure functional, the derivation of the
        exact-MITM impossibility from it, and the use of the epsilon-profile to
        TIGHTEN O-3 by measurement rather than by counting. CORPUS GREP
        PERFORMED. No record in knowledge/ or ledger/hypotheses/ measures key
        influence at any round count. ADJACENCY DECLARED RATHER THAN HIDDEN —
        this object is adjacent to the first pass's CAND-FR-1 recomputation set,
        which propagated difference SUPPORTS conservatively for an enumeration
        order. It differs in three ways that matter: it measures INFLUENCE
        PROBABILITIES rather than propagating a conservative bound; its error
        direction is the opposite and therefore the rigorous one for a closure;
        and it answers the existence question for factorization rather than the
        cost question for one enumeration family.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          The projection maps the full functional dependence of each of ~1408
          intermediate bits on the 128 master-key bits — an object containing the
          entire cipher — to a single 1408 x 128 support matrix, and then to the
          exact-zero set. The discard is total: every functional form, every
          value, every correlation, and every joint dependence structure is
          thrown away, leaving only "does it depend at all". The retained part
          propagates deterministically in the RIGOROUS direction: an observed
          change PROVES dependence, so a measured nonzero influence is a
          certificate and a measured zero is bounded only by the sample count.
          THAT ASYMMETRY IS LOAD-BEARING AND IS THE OPPOSITE OF THE FIRST PASS'S
          CAND-FR-1, whose conservative over-estimation ran in the direction that
          would have made a closure unsound.
        not_a_change_of_coordinates_because: >-
          A 1408 x 128 support matrix has 180224 bits against a cipher
          description of ~2^1408 possible dependence structures; it cannot
          determine the round function, the key, or any intermediate value. Two
          ciphers with identical influence supports and completely different
          behaviour are trivially constructible.
        what_is_discarded_and_why_that_is_compatible: >-
          Values and functional forms are discarded. That is compatible with the
          operations because AddRoundKey, ShiftRows and MixColumns act on the
          support by union and permutation, and SubBytes acts on it by
          saturation within a byte; none of these needs the discarded
          information to determine the retained part. The one place the retained
          part is NOT determined is cancellation, and cancellation shows up as a
          measured zero rather than as an assumed one — which is exactly why the
          statistic is measured rather than propagated.
      survival_depth: >-
        DEFINED AND MEASURABLE AT ALL 10 / 12 / 14 ROUNDS. PREDICTED TO REACH
        THE NULL (full support, no zeros) AT ROUND 2-3 FORWARD AND BACKWARD.
        This is the honest answer: the object does not survive to round 10 in the
        sense of retaining structure, and what would carry it further is exact
        key-independence deep in the cipher, which two-round full diffusion
        forbids. THE EXPERIMENT MEASURES WHERE IT SATURATES RATHER THAN ASSUMING
        IT, and this program has never measured it.
      assumptions:
        - >-
          A1. Everything is computed offline by the attacker. No oracle of any
          kind is queried and no related-key query is made, so the mechanism is
          single-key-legitimate. If a variant needs an oracle it leaves scope
          immediately and must be relabelled.
        - >-
          A2. An observed bit change under a key-bit flip PROVES functional
          dependence. Rigorous and definitional.
        - >-
          A3. A zero observed over N sampled keys bounds the influence by
          approximately 1/N and PROVES NOTHING at finer resolution. Stated beside
          every zero reading.
        - >-
          A4. Exact zero influence from the complementary key half is NECESSARY
          for an exact MITM factorization, not sufficient. So a measured nonzero
          influence is a rigorous obstruction, while a measured zero is only a
          lead.
      predictions:
        - metric: >-
            number of exact-zero (b, k) pairs at forward round 1, real AES-128
          direction: higher
          minimum_effect: >-
            large and structured — each round-1 output byte depends on at most 4
            key bytes. SENSITIVITY ANCHOR. If the instrument cannot see the zeros
            that certainly exist at round 1, every negative reading at deeper
            rounds is void, not negative.
        - metric: >-
            number of exact-zero (b, k) pairs at forward round >= 3 and backward
            round >= 3, real AES-128, over N = 2^20 sampled keys
          direction: lower
          minimum_effect: >-
            exactly zero. Any surviving exact-zero pair at round >= 3 is a
            structural finding about AES that must be escalated and independently
            re-run at N = 2^24 with a fresh seed before a single word is written
            about it.
        - metric: >-
            derived exact-MITM factorization width over all tested key
            partitions, full round count
          direction: lower
          minimum_effect: >-
            exactly 0 for every partition, confirming D-3 by measurement.
        - metric: >-
            |Z_eps| profile at eps in {2^-4, 2^-8, 2^-12} as a function of round,
            and the implied floor on the class-B recomputation fraction
          direction: higher
          minimum_effect: >-
            an implied floor strictly above 1/N_S = 1/200, i.e. a class ceiling
            TIGHTER than O-3's 7.64 bits. A floor equal to 1/200 would mean O-3
            is tight and the counting bound cannot be improved.
        - metric: >-
            same statistics under NULL-A (independent uniformly random round
            keys) and NULL-B (seeded random S-box, real key schedule)
          direction: different
          minimum_effect: >-
            NULL-A saturates STRICTLY EARLIER than real AES if the key schedule
            is what delays saturation; NULL-B reads the SAME as real AES if
            saturation is carried by byte-level wiring rather than by the
            specific S-box.
      discriminates_between:
        E1: >-
          "The O-3 premise is forced by diffusion, and O-3 is not tight."
          SIGNATURE — exact-MITM width 0 everywhere, and the eps-profile floors
          the recomputation fraction strictly above 1/200. CONSEQUENCE — the
          class that contains every full-round result this program can recall has
          a ceiling TIGHTER than 7.64 bits, derived from measured structure
          rather than from S-box counting, and the campaign should stop
          allocating budget to class B entirely.
        E2: >-
          "O-3 is tight and the eps-profile permits the counting floor."
          SIGNATURE — the eps-profile allows recomputation fractions approaching
          1/200 at some (partition, splice) configuration. CONSEQUENCE — up to
          7.64 bits of class-B head-room is structurally reachable and the
          binding constraint is construction difficulty rather than diffusion,
          which relocates the open question and contradicts the reading GATE 1's
          rho_min = 0.77 suggests.
        E3: >-
          "Some exact-zero influence survives past round 2." SIGNATURE — a
          nonempty Z at round >= 3 reproduced under a fresh seed and NOT
          reproduced by NULL-A or NULL-B. CONSEQUENCE — a structural property of
          AES that two-round full diffusion is supposed to forbid, requiring
          immediate escalation and independent replication before any
          interpretation. Probability judged very low; recorded because a gate
          whose only outcomes are the expected ones is not a gate.
        why_this_is_not_try_and_see: >-
          Three outcomes, each pre-specified with a numeric threshold, each
          changing what the next batch does, and E1 and E2 make OPPOSITE
          predictions about a quantity (the recomputation floor) that GATE 1
          already measured the consequence of, so the two runs cross-check each
          other at no extra design cost.
      minimal_test:
        design: >-
          C, software AES with instrumented intermediate state (NOT AES-NI, since
          AESENC hardwires the real S-box and NULL-B must be expressible on the
          same code path — the D-3 deviation lesson of the first pass's GATE 2
          applied in advance). Two stages.
          STAGE 1 (support): N = 2^16 random keys. For each key, encrypt P and
          record all intermediate bits; then for each of the 128 master-key bits,
          flip it, re-encrypt, and OR the changed-bit mask into an accumulator per
          (b, k). Cost 2^16 x 129 = 2^23 instrumented encryptions. Repeat
          backward from C through the inverse cipher. Repeat for AES-192 and
          AES-256, and for NULL-A, NULL-B and RANDPERM.
          STAGE 2 (eps-profile): N = 2^20 keys for the three variants only,
          accumulating COUNTS rather than an OR, giving I(b,k) to a resolution of
          2^-20. Cost 2^20 x 129 = 2^27 instrumented encryptions per variant.
          DERIVATION LEG (free): from the measured support, compute the exact
          MITM factorization width for every byte-aligned, word-aligned, column,
          diagonal and 4096 seeded random key partitions, at every splice point.
          All keys from a seeded PRNG with the seed recorded; the run is
          deterministic and re-runnable to a digest.
        controls:
          - >-
            NULL-A independent uniformly random round keys — the PRIMARY NULL,
            negating key-schedule structure. NOTE THE FIRST PASS'S D-4 DEFECT AND
            DO NOT REPEAT IT — NULL-A must be defined with RK[0] = K preserved,
            because "all round keys random" also randomizes the whitening key and
            silently changes what is being negated. That defect voided a
            pre-registered check in GATE 2 and is corrected here in advance.
          - >-
            NULL-B seeded random 8-bit S-box with the real key schedule — the
            SIBLING NULL, negating a DIFFERENT ingredient so that "any change
            moves the number" cannot be mistaken for attribution. KN-FIND-018
            practice rule 6.
          - >-
            RANDPERM a random permutation family — the outer null. Must show
            zero exact-zeros at every round including round 1.
          - >-
            SENSITIVITY ANCHOR — round 1 must show a large, structured exact-zero
            set for real AES. A negative reading at round >= 3 from an instrument
            blind at round 1 is VOID.
          - >-
            VACUITY CHECK — with the key-bit flip disabled the changed-bit mask
            must be identically zero at every round, every variant.
          - >-
            CONTROL-OF-CONTROL — a semantics-preserving transpose relabelling of
            byte indices must leave every derived width and every |Z_eps|
            unchanged, exactly as GATE 1's transpose check did.
        required_metrics:
          - >-
            the full 1408 x 128 support matrix per variant, per direction, with N
            and the resolution floor 1/N stated beside every zero
          - >-
            the saturation round per direction, defined as the least r with an
            empty exact-zero set at all r' >= r
          - >-
            the exact-MITM factorization width per key partition per splice point
          - >-
            |Z_eps| per (round, eps) and the implied class-B recomputation floor,
            stated beside the O-3 counting bound 1/N_S
        envelope_fit: >-
          FITS WITH LARGE MARGIN. 4 cores, 15 GB, gcc 13.3 with -O3 (AES-NI NOT
          required and deliberately not used), no GPU, no numpy, no sage, no SAT,
          no MILP. Stage 1 is 2^23 instrumented encryptions per variant and stage
          2 is 2^27, against a measured machine reach of 2^38.8 AES evaluations
          per 1600 s task — under 1 percent of one task's budget even after the
          10x-to-40x slowdown from state instrumentation. Memory O(1) beyond the
          180224-entry accumulator per variant.
      falsification_conditions:
        - >-
          Any exact-zero (b, k) pair at forward round >= 3 or backward round >= 3
          for real AES, surviving a fresh-seed re-run at N = 2^24 and NOT
          reproduced by NULL-A, NULL-B or RANDPERM. Claim (ii) is falsified and
          the configuration must be escalated before interpretation.
        - >-
          An empty exact-zero set at forward round 1 for real AES. The instrument
          is broken; every reading is VOID, not negative.
        - >-
          A nonzero changed-bit mask under the vacuity check. The instrument is
          broken.
        - >-
          RANDPERM showing any exact-zero pair at any round. The null is wrong.
        - >-
          Any nonzero exact-MITM factorization width at the full round count for
          any partition. D-3 is falsified as an argument and must be re-derived
          before anything rests on it.
      void_condition: >-
        PRE-REGISTERED. If the number of exact-zero pairs FAILS TO DECREASE
        monotonically as the round index increases — for the real cipher OR for
        either null — every reading is void. Rationale in the direction this
        statistic must move: diffusion can only ADD dependence, so the exact-zero
        set can only shrink with depth; a flat or growing profile is a coding
        error, not a finding. This is the docs/inventor-protocol.md section 3
        decay tell oriented to this statistic, and it is written before the run.
      confounders:
        - >-
          A measured zero is not a proven zero. At N = 2^20 an influence of
          2^-21 is invisible. The instrument can never prove key-independence,
          only bound it, and every zero reading carries 1/N beside it.
        - >-
          The influence matrix is a SUPPORT statistic and ignores joint
          dependence. Two bits may each depend on all key bits while their XOR
          depends on few; such a cancellation is exactly what a partial-matching
          construction exploits and this instrument CANNOT SEE IT. Mitigation:
          measure the influence of a declared set of linear combinations (each
          byte's parity, each column's XOR, and 1024 seeded random masks) in
          addition to raw bits, and state plainly that the space of combinations
          is not exhausted. THIS IS THE INSTRUMENT'S LARGEST BLIND SPOT AND IT IS
          NAMED FIRST AMONG THE LIMITS BELOW.
        - >-
          The reduced-round convention (whether the final round drops
          MixColumns) changes backward-direction readings and has NO external
          reference (EV-AES-001 A-12). Mitigation: run both conventions and
          report both columns; do not pick one.
        - >-
          PRNG structure could correlate K and K with bit k flipped. Mitigation:
          draw keys from a counter-mode AES stream under an independent seed and
          re-run one configuration under a structurally different generator, as
          GATE 2 did.
      interpretation_limits:
        - >-
          THE INSTRUMENT MEASURES SINGLE-BIT SUPPORT AND A DECLARED SET OF LINEAR
          COMBINATIONS. It does not exhaust the space of matching functions, so a
          measured exact-MITM width of 0 CLOSES THE BIT-AND-DECLARED-MASK MODEL
          AND NOTHING WIDER. It is not a proof that no partial-matching structure
          exists, and must never be written as if it were.
        - >-
          D-3 is an ARGUMENT AT THE DERIVATION TIER resting on two-round full
          diffusion. It is not machine-checked and its ingredient (branch number
          5) is recalled at HIGH confidence but UNVERIFIED-FROM-MEMORY and should
          be recomputed locally before anything rests on it.
        - >-
          A tighter measured class-B floor is a statement about the class as
          modelled here, not a barrier statement about AES, and not an
          impossibility claim.
        - >-
          No comparison of any output against the published state of the art is
          made, computed or implied, in either direction.
      heuristic_assumptions:
        - id: H1-B
          statement: >-
            For a fixed (b, k) whose true influence is at least epsilon, the
            probability that N independent uniform key samples all fail to
            exhibit a change is at most (1 - epsilon)^N. Hence an observed
            exact-zero over N = 2^20 samples bounds the true influence above
            2^-19 with confidence 1 - 2^-30 after Bonferroni correction over the
            180224 (b, k) cells.
          rigorous_support: >-
            FULLY RIGOROUS AND ELEMENTARY — the binomial tail, with a union bound
            over cells. No distribution theorem is needed and none is invoked.
            This is the one heuristic in this report that is not a heuristic, and
            it is listed so that the contrast with H2-B is visible.
          validation_plan: >-
            Directly exercised by the round-1 sensitivity anchor, where the true
            influences are 0 and about 1/2 and nothing between, so the bound is
            checked against a known answer. Tail check: the empirical
            distribution of first-change-sample-index over the nonzero cells must
            be geometric with the measured rate; a heavy tail would indicate key
            correlation in the sampler and is pre-registered as such.
        - id: H2-B
          statement: >-
            The exact-zero influence support of the single intermediate bits and
            of the declared mask set captures every matching quantity a
            partial-matching construction could use. Formally, if no bit and no
            declared mask has zero influence from K_2, then no efficiently
            computable projection does.
          rigorous_support: >-
            FALSE AS STATED, AND LISTED PRECISELY BECAUSE IT IS FALSE. Nonlinear
            combinations and unmeasured linear combinations can have zero
            influence where every measured quantity does not. There is NO
            theorem, and the assumption is the instrument's blind spot rather
            than a modelling convenience. It imitates nothing; it is named so
            that no reader mistakes a measured width of 0 for a closure of the
            partial-matching family.
          validation_plan: >-
            Partially probed by extending the declared mask set from 1024 to
            65536 seeded random masks and checking that the exact-zero count
            stays at 0 — which raises the tested dimension without ever reaching
            exhaustiveness. THE GAP IS NOT CLOSABLE BY THIS INSTRUMENT AND IS
            RECORDED AS SUCH, following KN-FIND-018's decomposition into
            properties that are closable by construction and properties that are
            not.
      target_complexity:
        time_exponent: >-
          NO ATTACK IS PROPOSED, SO THERE IS NO ATTACK TIME. The candidate's
          output is a BOUND on a class: under E1 the class-B floor rises above
          2^128 / N_S = 2^120.36 for AES-128, tightening the class ceiling
          derived by O-3, always stated beside the DEFINITIONAL
          exhaustive-key-search reference of 2^128 full-AES evaluations under a
          cost model not yet frozen as CM-1 and with the published-frontier
          comparison UNADJUDICABLE in either direction. The EXPERIMENT costs 2^27
          instrumented encryptions per variant against a measured reach of 2^38.8
          per task.
        memory_exponent: >-
          O(1) for any attack this bounds; 180224 counters per variant for the
          experiment, well under 1 GB in total.
        data_exponent: >-
          1 to 2 known plaintext/ciphertext pairs, the same as the definitional
          reference. Not dominated on the data axis.
        best_known: >-
          UNRESOLVABLE IN THIS ENVIRONMENT. Only the definitional reference is
          used.
        hidden_overhead: >-
          The derived MITM width ignores the cost of CONSTRUCTING a factorization
          even where one exists, and the eps-profile ignores the cost of
          exploiting almost-independence (biclique construction, false-positive
          filtering, final verification), all of which are where a real attack
          spends its care. Neither is modelled and neither is estimated.
        tradeoff_note: >-
          NO time-memory tradeoff exists for the instrument. For the class it
          bounds, the relevant tradeoff is memory 2^d for a d-dimensional
          biclique against a better recomputation fraction, and this instrument
          bounds the SECOND factor without modelling the first — stated so the
          bound is not read as covering both.
        exponent_verdict: >-
          NON-TARGET-CLASS BY CONSTRUCTION under docs/target-result-profile.md
          A1/C1. Its subject is a class whose maximum conceivable gain is 7.64
          bits, and its predicted contribution is to make that number SMALLER.
          It cannot move an exponent and does not claim to. Its priority rests on
          answering the directive's question 2 with a measurement and on
          instantiating the fourth object class with its one un-mined member.
      what_must_be_true_to_reach_round_10: >-
        THE OBJECT IS DEFINED AT ROUND 10 BY CONSTRUCTION; what would have to be
        true for it to carry STRUCTURE to round 10 is exact key-independence of
        some intermediate quantity deep in the cipher, which two-round full
        diffusion (D-3) forbids for single bits and for every declared mask.
        STATED HONESTLY — THE OBJECT IS NOT EXPECTED TO CARRY STRUCTURE PAST
        ROUND 2-3, AND THE EXPERIMENT IS PROPOSED TO MEASURE WHERE IT SATURATES
        AND WHAT THAT IMPLIES FOR THE CLASS FLOOR, NOT TO CARRY IT FURTHER.
      dominated_by: >-
        unresolvable in this environment; no primary source reachable; every
        recalled frontier row is unverified-from-memory. Against the ONE
        adjudicable reference — the DEFINITIONAL exhaustive key search at 2^128
        for AES-128, O(1) memory, about 2 known pairs — this candidate proposes
        NO attack and is therefore dominated by the reference on time and memory
        trivially, and is NOT dominated on data. `null` is not written.
      sota_delta: >-
        DEFINITIONAL-REFERENCE DELTA — 0 bits; no attack is claimed and none is
        predicted. PUBLISHED-FRONTIER DELTA — UNADJUDICABLE, asserted in neither
        direction. The candidate's quantitative content is a predicted TIGHTENING
        of the O-3 class ceiling from 7.64 bits toward a measured value, which
        moves the ceiling in the direction UNFAVOURABLE to any attack.
      estimated_cost:
        implementation: medium
        compute: low
        wall_clock: >-
          under 5 minutes of compute for both stages on 4 cores, plus
          implementation of the instrumented software AES and the three nulls
      recommended_priority: medium
      priority_rationale: >-
        RANKED BELOW CAND-FR2-A FOR A STATED REASON RATHER THAN A FEELING. Its
        central claim (i) is already DERIVED by D-3 and does not need the
        measurement; the measurement confirms a derivation and adds the
        eps-profile. CAND-FR2-A, by contrast, corrects a number the program is
        currently carrying as an obstruction, and its first two legs are free.
        CAND-FR2-B is ranked above nothing else in this report because it is the
        only proposal that instantiates the fourth object class, because its
        error direction is the rigorous one for a closure (the opposite of the
        first pass's CAND-FR-1), and because its eps-profile can tighten the
        ceiling on the only class that has ever reached round 10.

# =========================================================================
# CONSIDERED AND NOT PROPOSED
# =========================================================================
considered_and_rejected:

  - object: >-
      D1, the decomposition width of the key-indexed function — the minimum
      m such that [E_K(P) = C] factors as an m-bit match between a forward
      function of (K_1, P) and a backward function of (K_2, C)
    rejected_at: >-
      derivation, before any compute — it is closed for EXACT splits and its
      relaxation is CAND-FR2-B
    mechanism_of_rejection: >-
      DERIVATION D-3. An exactly-factoring bit needs zero dependence on the
      complementary key half. AES reaches full key-and-state dependence in two
      rounds forward from P and two rounds backward from C, so eligible bits live
      at round <= 1 and at round >= 9 respectively and are disjoint at 10 rounds.
      No exact MITM factorization exists at 10, 12 or 14 rounds for any
      nontrivial key partition. THIS IS THE ANSWER TO THE DIRECTIVE'S QUESTION 2
      AND IT IS WHY THE O-3 PREMISE, THOUGH NOT A LAW, IS FORCED HERE.
    what_remains_open: >-
      The relaxation to almost-independence, which is what the biclique family
      exploits and which pays recomputation per candidate — hence stays inside
      O-3. Its quantitative profile is CAND-FR2-B. Also open, and NOT addressed:
      whether a NONLINEAR matching function could factor where no bit and no
      linear mask does. That is H2-B's named blind spot and no instrument here
      can close it.

  - object: >-
      D4, the algebraic degree in the key of the key-indexed function
      f_P(K) = E_K(P), measured by higher-order derivatives over affine key
      cosets at the full round count
    rejected_at: the resource envelope, explicitly
    mechanism_of_rejection: >-
      DERIVATION D-7, DECLARED OUT OF ENVELOPE RATHER THAN ESTIMATED. Measuring
      the degree requires summing over an affine key subspace of dimension d at a
      cost of 2^d AES evaluations. The MEASURED machine reach is 2^38.8 AES
      evaluations per 1600 s task and 2^42.6 for the whole campaign. The degree
      of f_P in K is about 7 per byte after one round and saturates near the
      GF(2) bound of 127 by round 3, so from round 2 onward the required d
      exceeds the instrument ceiling by 80 to 90 bits. The instrument can confirm
      "degree >= 39 at r >= 2", which is uninformative.
    what_remains_open: >-
      Whether the degree in K, if it were somehow bounded below 128, would feed
      an interpolation attack in the KEY variable rather than the usual data
      variable. The saturation argument says it is not bounded, but that argument
      is a degree-composition estimate and not a measurement, and no measurement
      is possible here.

  - object: >-
      D5, the Fourier concentration of the key-indexed function — the tau-heavy
      Walsh support of K -> (-1)^{<beta, E_K(P)>}, as the input to a sparse
      Fourier learning or Goldreich-Levin style non-enumerative inversion
    rejected_at: derivation, before any compute
    mechanism_of_rejection: >-
      OBSTRUCTION O-8, DERIVED HERE. The first pass's O-4 observed that an
      offline key-difference sieve needs q ~ 1 rather than q above random,
      because with one target ciphertext there is no data axis over which to
      aggregate a bias. THAT ARGUMENT DOES NOT DEPEND ON THE OBJECT BEING A KEY
      DIFFERENCE. With t known plaintext/ciphertext pairs (the definitional
      reference needs about 2), a filter of bias epsilon yields O(t epsilon^2)
      bits of key information, so a filter usable inside a 2^128 budget must be
      within about 2^-40 of deterministic, or must buy a data axis whose cost is
      then charged and compared on the full Pareto frontier. O-8 therefore closes
      the ENTIRE STATISTICAL WING of class D, not merely its first-order member —
      including D5, and including D2 which was already measured dead at round 4.
      NOTE the lossy-projection test PASSES for D5 (the tau-heavy support
      discards all sub-threshold coefficients and all magnitudes, and propagates
      conservatively — linear maps permute the support exactly, nonlinear layers
      contain it in a convolution of supports, so a measured concentration is a
      lower bound, the safe direction). It is rejected on O-8, not on the
      projection test, and the distinction is recorded because a future session
      may find a setting with a data axis where O-8 does not bind.
    what_remains_open: >-
      The chosen-plaintext setting, where a data axis exists and O-8 does not
      bind, at the cost of charging data and comparing on the full Pareto
      frontier against a reference needing about 2 known pairs. Not examined
      here. Also open: whether the DETERMINISTIC members of class D (D3, and D4
      if it were measurable) admit anything O-8 does not touch — D3 is
      CAND-FR2-B and D4 is out of envelope.

  - object: >-
      the super-box separator of the AES dependency structure — the natural
      candidate for a vertex separator smaller than the 128-bit state
    rejected_at: >-
      not a candidate — a closure with forward guidance, not an attack
    mechanism_of_rejection: >-
      OBSTRUCTION O-7, DERIVED HERE. Two AES rounds decompose into four parallel
      32-bit super-boxes, so the super-box view is the obvious place to look for
      a sub-state separator. It supplies none: between consecutive super-box
      layers, ShiftRows sends one byte from each super-box to each of the four
      next-layer super-boxes, making the layer-to-layer dependency graph complete
      bipartite K_{4,4} with 8-bit edges, so any inter-layer cut costs
      4 x 4 x 8 = 128 bits — exactly the state size — and any vertical cut
      separating super-box columns across layers costs strictly more. IT IS AN
      ARGUMENT, NOT A THEOREM, and is labelled as one. It matters because the
      MITM factorization question (D-3), the treewidth question, and the
      block-structured Groebner question all reduce to the SAME quantity: does
      the AES dependency structure admit a separator materially below the state
      size.
    what_remains_open: >-
      The rigorous treewidth lower bound, still unproved and now with O-7 having
      eliminated the most natural candidate decomposition. Also whether a
      non-layer, non-round decomposition exploiting the key schedule's slower
      diffusion achieves a width between 128 and 256 — which would still not
      beat the definitional reference but would sharpen the statement.

  - object: >-
      the fixed round constants and the specific MDS matrix, treated as carriers
      of structure rather than as generic
    rejected_at: >-
      derivation — all three functionals deduplicate to families declared
      off-limits as the primary lens
    mechanism_of_rejection: >-
      DERIVATION D-6. The specific constants enter through exactly three
      functionals. (1) The Rcon orbit's escape from every SB/SR/MC-invariant
      subspace: the all-16-bytes-equal subspace is invariant under SubBytes,
      ShiftRows and MixColumns (02 + 03 + 01 + 01 = 01, so MC is the identity on
      constant columns — KN-FIND-018 practice rule 4), and would be invariant
      under the whole cipher if any key produced an all-equal expanded key; none
      does, because K all-equal to a gives SubWord(RotWord(W[3])) all-equal to
      S(a) and Rcon_1 = 01 breaks it in the FIRST byte of the FIRST step, for
      every key. Family: invariant subspace, off-limits, already dead in <= 1
      round. (2) The unipotent flag of MixColumns: KN-FIND-017 establishes
      ord(M) = 4 via c = 1 + n with n = 02z + z^3 nilpotent in F[z]/(z^4), so M
      is unipotent and preserves the complete flag (z^3) < (z^2) < (z) < R of
      GF(2^8)-dimensions 1, 2, 3 per column; since z = y + 1, the 1-dimensional
      piece is span{(y+1)^3} = span{y^3+y^2+y+1}, i.e. exactly the
      constant-column subspace, which is why KN-FIND-017 Corollary 2.2 found
      constant vectors to be the exception where L preserves collinearity. Family:
      subspace trail, off-limits. (3) Branch number 5, feeding O-1 and D-3.
      Family: wide trail, off-limits.
    what_remains_open: >-
      (a) The JOINT functional of the Rcon sequence and the MC unipotent flag.
      The AES-128 key schedule has no MixColumns, so the flag and the constants
      never meet; whether that separation is different in the longer AES-192/256
      schedules with their sparser constant supply was NOT examined.
      (b) ord(MixColumns o ShiftRows) as a GF(2)-linear map on the 128-bit state
      has NEVER been computed in this program, is seconds of pure Python, and a
      small order would be a striking structural fact worth knowing before anyone
      reasons about the linear layer again. BOTH ARE OPEN AND UNATTEMPTED, never
      tried, screened or negative.

  - object: >-
      a depth-8-or-deeper data-path statistical distinguisher requiring no key
      enumeration in the distinguishing phase
    rejected_at: >-
      no admissible mechanism found, and the envelope forecloses the search
    mechanism_of_rejection: >-
      THREE-PART CLOSURE, STATED AT THE SECTION 4 STANDARD RATHER THAN AS A
      FATIGUE REPORT. (1) O-1 bounds an 8-round characteristic at 2^-300
      differentially and 2^-150 linearly, so a single-trail object misses by more
      than 150 bits. (2) O-8 closes the statistical route for any filter used
      against a single target with about two known pairs. (3) DEC-20260731-019
      ruling 10 removes MILP and SAT, which is the entire modern automated search
      methodology for differential, linear and division-property distinguishers,
      so this program cannot SEARCH for such an object at this envelope. Point 3
      is an INFRASTRUCTURE fact and is never negative mathematical evidence
      (AGENTS.md rule 5).
    what_remains_open: >-
      THE ONE CRACK IN O-1, NAMED SHARPLY AND UNMEASURED. The conversion from a
      characteristic bound to a differential bound rests on the Markov-cipher
      idealization of INDEPENDENT ROUND KEYS, and AES's round keys are not
      independent — they are a deterministic bijective image of 128 bits of
      entropy spread across 1408 bits of round key. The measurable sub-question
      is whether the real-key-schedule differential probability at r = 2, 3, 4
      deviates systematically UPWARD from the independent-round-keys value at the
      same r, and whether the deviation grows or decays with r. Its null is
      literally the Markov model and its decay check is built in. NOT PROPOSED AS
      A CANDIDATE HERE because a reduced-round reading cannot speak to depth 10
      and its honest filing is under RQ-AES-001's ceiling; recorded as open
      direction (ii-sharpened) so the next session can find it.

# =========================================================================
# HONEST ACCOUNTING — docs/inventor-protocol.md section 5
# =========================================================================
honest_accounting:
  objects_considered:
    - >-
      the graded Hilbert function / degree-of-regularity object of the AES ideal
      — CAND-FR2-A
    - >-
      D3, the key-influence support of the key-indexed function — CAND-FR2-B
    - >-
      D1, the decomposition width — closed by D-3, which is the answer to the
      directive's question 2
    - >-
      D4, the algebraic degree in the key — declared out of envelope by D-7
    - >-
      D5, the Fourier concentration of the key-indexed function — closed by O-8,
      which generalizes O-4 to the entire statistical wing of class D
    - >-
      the super-box separator — closed by O-7
    - >-
      the round-constant and MDS functionals — closed by D-6, all three
      deduplicating to off-limits families
  count: >-
    7 objects considered, 2 admissible candidates, 0 claimed novel, 0
    exponent-moving predicted, 5 closures with named mechanisms, 1 obstruction
    superseded.
  fourth_object_class: >-
    FOUND AND ENUMERATED. CLASS D, objects of the KEY-INDEXED FUNCTION
    f_P(K) = E_K(P) with the plaintext fixed. The enabling reframing is that
    full-round AES key recovery is the inversion, at one point, of a specific,
    fully known, efficiently evaluable function to which the attacker has FREE
    OFFLINE EVALUATION ACCESS at every point of its domain — so the list of known
    ways to invert such a function sub-exhaustively IS the list of class-D
    structure functionals. Five members enumerated: D1 decomposition width, D2
    linear-structure set, D3 influence support, D4 algebraic degree in K, D5
    Fourier concentration. HONEST SCORING ON THE THREE AXES — the LENS is new to
    this program's map and does real work (it makes the directive's gaps 1 and 2
    one question rather than two), but THREE OF FIVE MEMBERS ARE REPACKAGINGS
    (D1 is the biclique family, D2 is the first pass's CAND-FR-2 already measured
    dead at round 4, D5 collapses into the wing O-8 closes); only D3 is both
    un-mined and un-closed. Testability: D3 exactly definable and cheaply
    measurable at the full round count; D4 definable but not measurable here; D5
    measurable only at toy key sizes. Survival: D1 dies at round 2, D2 measured
    dead at round 4, D3 predicted at the null by round 2-3 and measurable at 10,
    D4 unmeasurable past round 1, D5 predicted null by round 4. NO CLAIM IS MADE
    THAT NO FIFTH CLASS EXISTS; a fifth class is as available now as the fourth
    was before this pass, and asserting otherwise would be the fatigue report
    this protocol forbids.
  depth_of_verified_structure: >-
    NONE. Zero compute was run in this session and no AES measurement of any kind
    was taken. D-1 through D-7 and O-5', O-6, O-7, O-8 are ARGUMENTS DERIVED IN
    TEXT — exact binomial arithmetic, elementary algebra over GF(2^8), and
    diffusion counting — independently re-derivable in minutes, recorded at the
    `derivation` tier: not machine-checked, not measured, not reviewed. Every
    measured quantity cited (GATE 1 rho_min = 0.77 and the 154-of-200 count,
    GATE 2 death rounds 2-4 for AES-128 and 3-5 for AES-256 at a 5-sigma floor of
    2^-7.18 relative with N = 2^19) is measured in RUN-FRGATES-20260801-001 and
    carries that run's own protocol deviations D-1 through D-5, including its
    unexecuted Stage 2 and its unmeasured value-exact activity gap.
  dominated_by: >-
    unresolvable in this environment; no primary source reachable; every recalled
    frontier row is unverified-from-memory. This is the exact string RQ-AES-002
    R5 mandates and it is written INSTEAD OF `null`, because `null` would assert
    that the Pareto frontier was checked row by row and here it cannot be — an
    unchecked null being a fabrication under AGENTS.md rule 5. AGAINST THE ONE
    ADJUDICABLE REFERENCE, checked axis by axis: the DEFINITIONAL exhaustive key
    search (2^128 / 2^192 / 2^256 full-AES evaluations, O(1) memory, about 2
    known pairs, success probability 1) dominates both candidates on TIME
    trivially, since neither claims an attack; dominates CAND-FR2-A's LANE on
    MEMORY by 57 to 106 bits; and dominates neither candidate on DATA, both
    needing 1 to 2 known pairs.
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA — 0 bits, predicted, for both candidates, under
    a cost model NOT YET FROZEN AS CM-1. PUBLISHED-FRONTIER DELTA —
    UNADJUDICABLE, asserted in neither direction. The quantitative content of
    this session is not a delta but THREE corrections and one enumeration:
    (1) O-5's 2^704 is a category error against the Groebner/XL family and is
    superseded by O-5''s 2^246 to 2^379, a correction of 325 to 460 bits, leaving
    the algebraic lane 118 to 251 bits short of 2^128 rather than 576 bits short,
    and reducing the required structural gain from a factor of about 100 in an
    exponent to a factor of about 2.3 to 3.5 in d_reg;
    (2) O-3's premise is not a law but IS forced for full-round AES by D-3, a
    stronger obstruction than O-3's own counting argument, so class B cannot even
    APPROACH its 7.64-bit ceiling — GATE 1's measured 7.27-bit shortfall is the
    first measured instance;
    (3) O-4 generalizes to O-8 and closes the whole statistical wing of class D;
    (4) the fourth object class exists, has five members, and four of them close.
  which_class_escapes_both_walls: >-
    EXACTLY ONE, AND IT IS CLASS C. Class A escapes O-3 but dies at the depth
    wall. Class B escapes the depth wall but is inside O-3 by construction and,
    by D-3, cannot approach its ceiling. Class D's statistical wing is closed by
    O-8 and its deterministic wing feeds class C rather than standing alone.
    CLASS C ESCAPES BOTH — it never enumerates, so O-3's premise fails, and its
    object does not decay with rounds, so the depth wall does not apply; the
    system merely gets larger. THE SECOND PASS'S FINDING IS THAT THE WALL
    STOPPING CLASS C WAS MIS-IDENTIFIED. This is NOT encouragement: a factor
    2.3-to-3.5 drop in d_reg below the semi-regular value sustained at N = 1408
    is an enormous structural demand, and this program's only prior
    structured-versus-random d_reg measurement
    (research/dreg-linear-law/FINDING_v2.md item 5, a DIFFERENT family) found the
    structured system's degree HIGHER than the null's — the wrong direction for
    an attacker. The honest expectation is that AES behaves the same way. The
    difference from the first pass is that this is now a measurable,
    pre-registered prediction with a matched null instead of a number that was
    never the right one.
  closures_enumerated:
    - id: O-5-prime
      supersedes: O-5
      obstruction: solving degree, not variable count
      argument: >-
        Groebner/XL cost is C(N, d_reg)^omega, not 2^{cN}. Exact binomials at
        N = 1408 give log2 C(1408, d) of 45.4 / 53.26 / 60.91 / 68.36 at
        d = 5/6/7/8, so the definitional 2^128 reference is reached iff
        d_reg <= 6 at omega = 2.37 or d_reg <= 7 at omega = 2. The semi-regular
        crossover proxy, from C(N,d) <= M C(N,d-2), is d* ~ 16 at M = 7800 and
        ~22 at M = 4000, where log2 C(1408,16) ~ 123.0, giving 2^246 to 2^379.
      status: >-
        DERIVATION TIER. Rests on a cost model (H2-A, optimistic for the attack,
        the safe direction for a downward supersession) and on a crossover PROXY
        that ignores Koszul syzygies and therefore under-estimates the true
        semi-regular d_reg.
      forward_guidance: >-
        Compute the exact semi-regular d_reg at the derived AES-shaped (N, M).
        It is free, it is CAND-FR2-A leg 1, and it converts the proxy into the
        model's actual value.
    - id: O-6
      obstruction: the GF(2)-to-GF(2^8) descent cancellation
      argument: >-
        Moving to GF(2^8) divides the variable count by the extension degree 8
        and multiplies it back by 8 the moment quadraticity is restored via
        Frobenius conjugates, because the affine layer L is GF(2)-linear and its
        GF(2^8) description is its Frobenius orbit (a linearized polynomial of
        degree 128). There is no smaller system: the choice is ~1408 variables at
        degree 2 or ~200-400 at degree 128, and C(N,d) is monotone the wrong way.
      corollary: >-
        The apparent over-determinedness of the GF(2) system (M/N ~ 5.5) is
        descent of a system essentially DETERMINED over GF(2^8), so the equation
        supply is inflated while the information content is not. This is the
        precise form of the trap XSL fell into — counting generated equations
        rather than ranking them — stated as a mechanism rather than as a
        recollection.
      forward_guidance: >-
        Any algebraic candidate under this question must RANK, NEVER COUNT, and
        must state its (N, d) position before it states a complexity.
    - id: O-7
      obstruction: the super-box separator
      argument: >-
        Layer-to-layer super-box connectivity is complete bipartite K_{4,4} with
        8-bit edges, so any inter-layer cut costs 128 bits and any vertical cut
        costs more. The natural candidate for a sub-state separator supplies
        none.
      status: AN ARGUMENT, NOT A THEOREM.
      forward_guidance: >-
        The rigorous treewidth lower bound remains open, now with the most
        natural decomposition eliminated. Note the unification: D-3, O-7 and the
        block-structured Groebner route all reduce to one question — does the AES
        dependency structure admit a separator materially below the state size.
    - id: O-8
      supersedes_scope_of: O-4
      obstruction: the single-target determinism requirement, generalized
      argument: >-
        With t known pairs (the reference needs about 2), a filter of bias
        epsilon yields O(t epsilon^2) bits, so a usable filter must be within
        about 2^-40 of deterministic or must buy a charged data axis. This does
        not depend on the filter being a key difference, so it closes the ENTIRE
        statistical wing of class D, not merely O-4's first-order member.
      forward_guidance: >-
        The chosen-plaintext setting has a data axis and O-8 does not bind there,
        at the cost of charging data and comparing on the full Pareto frontier.
        Unexamined. The deterministic members of class D (D3, D4) are untouched
        by O-8; D3 is CAND-FR2-B and D4 is out of envelope by D-7.
    - id: D-3
      obstruction: exact-MITM factorization impossibility
      argument: >-
        Bits with zero influence from K_2 live at round <= 1 forward from P;
        bits with zero influence from K_1 live at round >= 9 backward from C;
        disjoint at 10 rounds. Hence no exact MITM factorization for any
        nontrivial key partition, at 10, 12 or 14 rounds.
      consequence: >-
        The O-3 premise is not a law, but IS forced for full-round AES, and by a
        stronger mechanism than O-3's own counting argument. The only route
        escaping O-3 is one that never enumerates — the algebraic lane.
      forward_guidance: >-
        The relaxation to almost-independence is CAND-FR2-B. Whether a NONLINEAR
        matching function factors where no bit and no linear mask does is H2-B's
        named blind spot and is not closable by any instrument proposed here.
  closure_standard_self_assessment: >-
    O-6, O-8, D-3, D-6 and D-7 MEET the docs/inventor-protocol.md section 4
    standard — each has a named obstruction, a checkable argument, and forward
    guidance naming what remains open. O-5' and O-7 are ARGUMENTS, NOT THEOREMS,
    and say so: O-5' rests on a cost model and a proxy, O-7 lacks the rigorous
    treewidth bound. O-1 and O-2 remain RECALLED and their honest status is
    still `unverified` pending local recomputation of the branch number and the
