candidates:

  - idea:
      id: CAND-FR-1
      ledger_id: null   # the Coordinator assigns IDEA-YYYYMMDD-NNN; pre-allocating one
                        # here would risk an ID collision with a concurrent branch
      title: Minimum recomputation cover of the AES key-search computation graph, and
        which structure sets it
      class: measurement
      tracked_object: >-
        THE RECOMPUTATION SET. For a fixed plaintext P, a fixed ciphertext C, a
        key-space enumeration order whose step is a master-key difference delta, and a
        splice point, the object is the SET OF S-BOX INSTANCES (round r, byte position
        i, data path or key schedule, forward branch or backward branch) whose input
        differs between the two consecutive candidates. It is represented as a
        per-round 16-bit activity pattern in the data path plus a per-word activity
        pattern in the expanded key, propagated conservatively. It is an object of the
        ENUMERATION, not of the cipher.
      class_membership: Class B (amortization) per baseline_map.md §3. Governed by
        obstruction O-3.
      claim: >-
        The minimum, over single-byte and multi-byte key-difference generators and over
        splice points, of the fraction rho_min of the 200 AES-128 S-box instances that
        must be recomputed per enumerated key candidate is SET BY THE KEY-SCHEDULE
        DIFFUSION RATE rather than by the data-path diffusion rate; and rho_min >= 0.268,
        i.e. this object as a one-dimensional Gray-code enumeration does NOT reach the
        recalled biclique figure 2^126.1.
      mechanism: >-
        Changing one master-key byte perturbs one data-path byte at AddRoundKey; the
        data path reaches full diffusion in 2 rounds regardless of the key schedule, so
        after round 2 every S-box is recomputed on the forward branch. The key schedule
        diffuses more slowly: for AES-128 a difference confined to W[0] leaves
        s_1 = SubWord(RotWord(W[3])) unchanged, so round key 1's difference is affine in
        the master-key difference and only becomes nonlinear at round 2. Splice-and-cut
        lets the untouched region sit in the MIDDLE of the cipher rather than at one
        end, which is what buys the published factor. The measurement asks which of the
        two diffusion rates is binding, because that determines whether any residual
        head-room in the class is reachable at all.
      novelty_status: adaptation
      novelty_note: >-
        PROBABLE REDISCOVERY, stated up front. Biclique and splice-and-cut papers
        already optimise exactly this quantity; the recalled 2^126.1 IS the output of
        such an optimisation. Recall confidence that the quantity is standard: HIGH.
        What may not be standard is the EXHAUSTIVE, null-controlled attribution of
        rho_min to a named structure, and the comparison against the class ceiling O-3.
        Novelty against the external literature is UNRESOLVABLE in this environment and
        is NOT claimed. Corpus grep: no prior-art record in knowledge/ or
        ledger/hypotheses/ — the four prior AES batches (EV-AES-001..004) worked
        exclusively on class-A super-box propagation objects and never touched class B.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          The projection maps a full 128-bit state trajectory to a per-round 16-bit
          support pattern — a discard of 112 bits per round. What is discarded (values)
          is discarded compatibly with the operations: AddRoundKey acts trivially on
          differences; ShiftRows permutes supports; MixColumns propagates supports by the
          branch-number rule; SubBytes preserves supports exactly. The one lossy
          direction is conservative — an active byte may accidentally take a zero
          difference — which makes the recomputation count an UPPER bound and the implied
          speedup a LOWER bound. The safe direction, and it is stated because a
          projection whose error ran the other way would be inadmissible.
        not_a_change_of_coordinates_because: >-
          The support pattern does not determine the state; 2^112 states share each
          pattern per round. Contrast baseline_map.md §5.1, where sigma(K) determines K
          and the candidate was dropped.
      survival_depth: >-
        ALL 10 (12, 14) ROUNDS, BY CONSTRUCTION. This object does not propagate through
        the cipher and therefore cannot die in it; it is defined on the whole
        computation graph. THAT IS PRECISELY WHY IT IS THE ONLY CLASS THAT HAS EVER
        PRODUCED A FULL-ROUND AES RESULT, and it is also why it is capped: see O-3.
      assumptions:
        - A1. Conservative activity propagation (an active input byte to an S-box is
          counted as recomputed) upper-bounds the true recomputation count. Elementary;
          checkable by construction.
        - A2. The unit of charge is one S-box evaluation and one full AES-128 evaluation
          is 200 of them (160 data path + 40 key schedule). Derived in baseline_map.md
          §3 from the pinned FIPS-197 key-schedule rule; re-derivable locally.
        - A3. The key schedule is CHARGED, not free. Charging it free would be the
          optimistic direction and moves the ceiling from 2^120.36 to 2^120.68; both are
          reported.
        - A4. A one-dimensional Gray-code enumeration is a strictly weaker structure than
          a d-dimensional biclique. The measurement therefore CANNOT beat a biclique and
          is not proposed as an attack; it is proposed as an ATTRIBUTION instrument for a
          class whose ceiling is already derived.
      predictions:
        - metric: rho_min, minimum recomputed S-box fraction, AES-128, real key schedule
          direction: higher
          minimum_effect: rho_min >= 0.268 (equivalently implied time >= 2^126.1)
        - metric: rho_min under NULL-1 (key schedule replaced by independent uniformly
