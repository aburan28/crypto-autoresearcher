honest_accounting:
  objects_considered:
    - sigma(K) key-schedule linearisation — dropped at the lossy-projection test
    - key-masked linear approximation — dropped at the lossy-projection test
    - the recomputation set — CAND-FR-1
    - projected key-difference invariance — CAND-FR-2
    - the class-C polynomial ideal — closure O-5, out of envelope
    - the treewidth / separator object — closure with forward guidance
  count: 6 considered, 2 admissible candidates, 0 novel, 0 exponent-moving predicted
  depth_of_verified_structure: >-
    NONE. Zero compute was run in this session. No AES measurement of any kind was taken.
    Obstructions O-3 and O-5 are ARGUMENTS DERIVED IN TEXT (S-box counting and variable
    counting respectively), independently re-derivable in minutes, and are recorded at the
    `derivation` tier — not machine-checked, not measured, not reviewed.
  dominated_by: >-
    Every proposal in this report is dominated on the TIME axis by row R4 of
    baseline_map.md §2 (biclique variant at 2^126.16 for AES-128, data below the full
    codebook) and by R2 (2^126.1) and R3 (2^126.67 at 2 known plaintexts); under the
    predicted outcomes both are additionally dominated by R1 (exhaustive search, 2^128,
    2 KP, O(1) memory), since a predicted 0-bit delta is not an improvement. Neither
    proposal is dominated on the MEMORY axis (both O(1)) or the DATA axis (both 2 KP).
    Rows R1 through R10 were each checked individually on time, memory and data/queries
    before this field was written. `null` appears nowhere in this report.
  sota_delta: >-
    0 bits, predicted, for both candidates, against every row of the frontier. The
    quantitative content of this session is not a delta but three derived ceilings:
    (1) the class-B amortization ceiling — 2^120.36 / 2^184.19 / 2^247.89 for
    AES-128/192/256 with the key schedule charged, i.e. a MAXIMUM POSSIBLE GAIN of
    7.64 / 7.81 / 8.11 bits for the entire class that contains every published full-round
    AES result; the published frontier sits 5.7 bits inside that ceiling;
    (2) the class-C variable-count floor — >= 2^704 for AES-128 under any generic
    quadratic-system solver with exponent c >= 0.5 in the variable count;
    (3) the class-A depth gap — a depth-8 distinguisher is required and depth 6 is the
    recalled best, against an 8-round characteristic bound of 2^-300.
  closures_enumerated:
    - id: O-1
      obstruction: wide trail / trail depth
      argument: branch number 5 gives >= 25 active S-boxes over 4 rounds; max DDT 2^-6
        gives <= 2^-150 for 4 rounds and <= 2^-300 for 8
      scope_limit: bounds CHARACTERISTICS, not differentials or linear hulls
      forward_guidance: the hull-versus-characteristic gap is the only crack; it needs
        >150 bits and no known aggregation approaches it
    - id: O-2
      obstruction: key-recovery extension budget
      argument: one extra round costs ~2^32 guesses, the second costs essentially the key;
        e <= 2-3 for AES-128
      forward_guidance: a depth-8 distinguisher is the requirement; nothing else in class
        A matters until one exists
    - id: O-3
      obstruction: amortization ceiling (DERIVED THIS SESSION)
      argument: a class that pays >= 1 S-box per enumerated candidate cannot beat
        2^kappa / N_S; N_S = 200 / 224 / 276
      forward_guidance: class B can never move an exponent; the only escape is batch
        elimination, which moves the attack into class A under O-1/O-2
    - id: O-4
      obstruction: deterministic-filter requirement
      argument: an offline key-difference sieve needs q ~ 1, not q above random, because
        there is one target ciphertext and no data axis to aggregate a bias over
      status: PREDICTED AND UNMEASURED — CAND-FR-2 measures it
    - id: O-5
      obstruction: variable count (DERIVED THIS SESSION)
      argument: a quadratic representation of 10-round AES-128 needs >= 1408 GF(2)
        variables; generic MQ at 2^(cN) with c >= 0.5 gives >= 2^704
      forward_guidance: needs a solver parameterised by structural width; the natural
        path decomposition has width ~256 and the rigorous lower bound is unproved
    - id: LP-1
      obstruction: sigma(K) is not lossy — it determines K
      forward_guidance: partial-sigma guessing remains the related-key engine; its
        single-key use beyond bicliques is open
    - id: LP-2
      obstruction: a key mask does not shorten the data path
      forward_guidance: closes "exploit the low key-schedule diffusion in the single-key
        linear model" as a lane
  closure_standard_self_assessment: >-
