        hidden_overhead: >-
          The conservative activity model hides the value-exact deficit (H1-FR1); the
          S-box unit hides linear-layer work (H2-FR1); splice-and-cut hides the matching
          and false-positive filtering entirely, which for a real attack is where the
          published constructions spend most of their care.
        tradeoff_note: >-
          NO time-memory tradeoff exists for this candidate at O(1) memory; a
          d-dimensional biclique trades memory 2^d for a better rho, and that tradeoff is
