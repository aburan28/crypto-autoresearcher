      heuristic_assumptions:
        - id: H1-FR1
          statement: >-
            For a uniformly random master key K and a fixed nonzero key difference delta,
            the fraction of S-box instances whose input difference is nonzero equals the
            conservative activity count up to a relative error below 2^-4. Formally:
            E_K[ |{active S-boxes}| ] / |{conservatively active S-boxes}| >= 1 - 2^-4.
          rigorous_support: >-
            Imitates the standard "random difference" heuristic behind truncated
            differential counting: for a nonzero input difference to a bijective S-box the
            output difference is nonzero with probability 1, and a nonzero MixColumns
            input column produces a zero output byte with probability 2^-8 per byte. The
            rigorous ingredient is the branch number 5 of the AES MixColumns matrix; the
            distributional ingredient is the uniformity of the difference distribution
            over a random key, i.e. the same role Canfield-Erdos-Pomerance plays in the
            exemplar's Heuristic 1.
          validation_plan: >-
            Sample 2^20 random keys; compute the VALUE-EXACT active-S-box count by direct
            encryption under the pinned BATCH-001 harness and compare its empirical
            distribution against the conservative count. Predicted distribution: the
            deficit per round is Binomial(n_active, 2^-8). Tail check: the smallest
            observed exact count over 2^20 samples should be consistent with the
            Binomial lower tail. TOY-SCALE ONLY in sample count; the object itself is at
            full cryptographic round count, which is unusual for this campaign and is why
            the scale caveat is about samples, not rounds.
        - id: H2-FR1
          statement: >-
            One S-box evaluation is the correct unit of marginal cost, i.e. the XOR,
            ShiftRows and MixColumns work attributable to a recomputed byte is bounded by
            a constant times the S-box cost.
          rigorous_support: >-
            No theorem; this is a COST-MODEL choice and is labelled as one. Its direction
            is optimistic for the attack (it undercharges linear work), so it flatters any
            speedup reading and is therefore the assumption to attack.
          validation_plan: >-
            Report a second column charging XORs and GF(2^8) multiplications separately,
            with the ratio to the S-box-only column stated. If the two columns disagree by
            more than 0.5 bits, the S-box-only column must not be used alone.
      target_complexity:
        time_exponent: >-
          2^(128 + log2 rho_min) AES-128 evaluations. Best conceivable value in this
          class: 2^120.36 (key schedule charged) or 2^120.68 (key schedule free).
          Predicted measured value: 2^127 to 2^128, i.e. NO IMPROVEMENT, because a
          one-dimensional Gray code is weaker than a biclique.
        memory_exponent: O(1) — a few state buffers. This candidate introduces no memory
