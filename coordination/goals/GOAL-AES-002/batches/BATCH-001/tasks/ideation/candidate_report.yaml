  - idea:
      id: CAND-FR-2
      ledger_id: null
      title: Projected key-difference invariance as an offline key-space sieve — the
        decay profile to round 10, with matched and sibling nulls
      class: measurement
      tracked_object: >-
        THE PAIR (coset, projected ciphertext): the map K |-> ( K + <delta>, pi(E_K(P)) )
        for a fixed plaintext P, a fixed master-key difference delta, and a b-bit output
        projection pi. The tracked quantity is
        q_r(delta, pi) = Pr_K[ pi(E_K^(r)(P)) = pi(E_{K+delta}^(r)(P)) ],
        measured at every round count r = 1..10.
      class_membership: Class B boundary object, governed by obstruction O-4. It is the
        mechanism a biclique already uses in short-trail form, taken to the full round
        count and to a probabilistic setting.
      claim: >-
        For every tested key difference delta and every 1-bit and 8-bit output projection
        pi, q_r(delta, pi) is indistinguishable from the null value 2^-b at r >= 4, at the
        stated measurement resolution; equivalently, the projected key-difference
        invariance object DIES AT ROUND 3-4 and cannot support an offline sieve at round
        10. If instead some (delta, pi) shows a persistent excess at r >= 6 that the
        matched null does not show, that is a finding and must be escalated.
      mechanism: >-
        A q ~ 1 invariance would let one AES evaluation eliminate an entire coset of
        <delta>: compute pi(E_K(P)); if it differs from pi(C), then under invariance
        pi(E_{K+delta}(P)) also differs, so BOTH candidates are eliminated. A
        d-dimensional such structure eliminates 2^d candidates per evaluation and yields
        a 2^(128-d) attack — an EXPONENT MOVE if d grows with the key size. CRITICALLY,
        this makes NO related-key oracle query: both encryptions are computed offline by
        the attacker, so it is a legitimate single-key mechanism and is NOT a related-key
        attack. The reason it is expected to fail is O-1 applied to the combined
        key-schedule/data-path trail: the AES key schedule diffuses a single-byte
        master-key difference into a full-state round-key difference within about 3
        rounds, and thereafter the projected output difference should be uniform.
      novelty_status: adaptation
      novelty_note: >-
        PROBABLE REDISCOVERY of the key-difference-trail device that bicliques and
        related-key differential cryptanalysis both use; recall confidence that the
        general device is known: HIGH. The specific framing — that the sieve requires
        q ~ 1 rather than merely q above random, and that a q ~ 1 PROJECTED invariance
        converts one-for-one into a 2^-d factor on single-key exhaustive search — is
        stated here as a conversion lemma and is almost certainly folklore. Novelty is
        UNRESOLVABLE in this environment and is NOT claimed. Corpus grep: no record in
        knowledge/ or ledger/hypotheses/ measures q_r at any round count; the four prior
        AES batches measured only class-A super-box statistics at r <= 5.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          Two independent discards. (i) The coset map discards WHICH ELEMENT of K+<delta>
          the key is — d bits. (ii) pi discards all but b bits of the 128-bit ciphertext —
          128-b bits. Both are large. What is retained propagates deterministically
          exactly when the invariance holds, and the FIDELITY OF THAT PROPAGATION IS THE
          MEASURED QUANTITY rather than an assumption. This is the property that makes
          the object testable: the experiment measures the very thing that would make the
          projection well-defined.
        not_a_change_of_coordinates_because: >-
          The pair (coset, pi(ciphertext)) has 128-d+b bits against 128; for d >= 1 and
          b < 128 it is strictly smaller and cannot determine K.
      survival_depth: >-
        DEFINED at all 10 rounds; PREDICTED TO DIE AT ROUND 3-4 in the sense that q_r
        reaches the null. This is the honest answer to the directive's question: the
        object does not survive to round 10, and what would carry it further is a
        probability-one truncated key-differential over the full cipher, which O-1 puts
        far out of reach. THE EXPERIMENT MEASURES THE DEATH ROUND RATHER THAN ASSUMING IT,
        which is the point: this programme has never measured it, and the recalled
        literature figure for it is not checkable here.
      assumptions:
        - A1. The attacker computes both branches offline. No related-key oracle is
          queried, so this is a single-key mechanism. If a future variant needs an oracle
          it leaves scope immediately and must be relabelled.
        - A2. A usable sieve needs failure rate epsilon < 2^-40, i.e. q > 1 - 2^-40. A
          merely biased q cannot be used, because there is only ONE target ciphertext and
          no data axis over which to aggregate a bias. This assumption is what makes the
          test's negative outcome meaningful.
        - A3. The measurement resolution is 1/sqrt(N) in relative terms for b = 1. At
          N = 2^30 that is 2^-15, giving a 5-sigma detection floor near 2^-12.7.
      predictions:
        - metric: excess |q_r - 2^-b| in units of the sampling sigma, real AES,
            r = 1,2,3
          direction: higher
          minimum_effect: > 5 sigma at r = 1 and r = 2 (sensitivity anchor — if the
            instrument cannot see the object where it certainly exists, no negative
            reading at r >= 4 means anything)
        - metric: excess at r >= 4, real AES, every tested (delta, pi)
          direction: different
          minimum_effect: < 5 sigma (predicted null)
        - metric: excess at every r under NULL-A (key schedule replaced by independent
            uniformly random round keys)
          direction: different
          minimum_effect: < 5 sigma at r >= 2; the excess at r = 1 should SURVIVE, since
            round 1 is unaffected by the schedule downstream — a built-in check that
            NULL-A negates what it claims to negate
        - metric: excess at every r under NULL-B (S-box replaced by a seeded random
            bijection, key schedule unchanged) — the SIBLING NULL
          direction: different
          minimum_effect: reads the same as real AES at all r if the effect is carried by
            byte activity rather than by the specific S-box; a DIFFERENCE here would mean
            the statistic is S-box-specific and the attribution changes
      discriminates_between:
        E1: >-
          "The object dies because the KEY SCHEDULE diffuses delta." Signature: real AES
          and NULL-A agree from r = 2 onward, and the death round moves EARLIER under
          NULL-A. Consequence: AES-256, whose schedule applies S-boxes only every other
          word-group and diffuses more slowly, should show a LATER death round — a sharp,
          cheap, pre-registered follow-up that the same instrument answers.
        E2: >-
          "The object dies because the DATA PATH diffuses, and the key schedule is
          incidental." Signature: real AES and NULL-A agree everywhere including r = 1-2,
          and the death round is identical for AES-128 and AES-256. Consequence: the
          slow-key-schedule intuition that motivates related-key work carries nothing into
          the single-key offline sieve, and that lane closes.
        why_this_is_not_try_and_see: >-
          E1 and E2 make OPPOSITE predictions about AES-256 versus AES-128 at the same
          round index, measurable in the same run at no extra design cost.
      minimal_test:
        design: >-
          C with AES-NI (AESENC on attacker-supplied round keys, so a custom or
          reduced-round schedule is expressible), two stages.
          STAGE 1 (survey): N = 2^22 random keys per configuration; 16 key differences
          delta (all single-byte positions, plus differences confined to W[0] only —
          the ones that leave s_1 unchanged — plus a full-word difference); b in {1, 8};
          r = 1..10; four matrices (AES, NULL-A, NULL-B, plus AES-256 for the E1/E2
          discriminator). ~1.3e9 encryptions; tens of seconds on 4 cores.
          STAGE 2 (resolution): the 3 most structured delta only, b = 1, r in {4,6,8,10},
          N = 2^30. ~2.6e10 encryptions; under a minute on 4 cores with AES-NI.
          All keys drawn from a seeded PRNG with the seed recorded; the run is
          deterministic and re-runnable to a digest.
        controls:
          - NULL-A: independent uniformly random round keys (negates key-schedule
            structure) — the primary null
          - NULL-B: seeded random S-box, real key schedule (SIBLING NULL; negates a
            DIFFERENT ingredient, so that "any change moves the number" cannot be
            mistaken for attribution — the KN-FIND-018 rule-6 and EV-AES-004 A-9 lesson
            applied in advance rather than discovered by a validator afterwards)
          - SENSITIVITY ANCHOR: r = 1 and r = 2 must show a large excess for real AES. A
            negative reading at r >= 4 from an instrument that cannot see r = 1 is void.
          - VACUITY CHECK: with delta = 0 the statistic must read q = 1 exactly; with pi
            random and delta random over a random permutation family it must read 2^-b
            within sigma.
        required_metrics:
          - q_r per (variant, matrix, delta, pi, r), with N, the sampling sigma, and the
            excess in sigma units
          - the death round per configuration, defined as the least r with excess < 5
            sigma at all r' >= r
          - the resolution floor 5/sqrt(N), stated beside every negative reading
        envelope_fit: >-
          FITS. 4 cores, 15 GB, gcc 13.3 with -maes, no GPU, no numpy, no sage. Memory
          O(1) — counters only. Under two minutes of compute for both stages.
      falsification_conditions:
        - Any (delta, pi) with excess > 5 sigma at r >= 6 for real AES that is NOT
          reproduced by NULL-A or NULL-B — the claim is falsified and the configuration
          must be re-run at N = 2^32 with a fresh seed before anything is said about it
        - Excess < 5 sigma at r = 1 for real AES — the instrument is broken; every
          negative reading is void, not negative
        - q = 1 not returned exactly at delta = 0 — the instrument is broken
      void_condition: >-
        If the excess FAILS TO DECAY as r increases, for the real cipher OR for either
        null, the measurement is an artifact and every reading is void. An excess that is
        essentially identical at r = 3, 5 and 7 is the canonical artifact tell recorded in
        docs/inventor-protocol.md §3 and in EV-AES-001 B-5, where exactly this shape was
        found to be a byte-activity cliff rather than a structural signal. That prior
        finding is the reason this VOID condition is written before the run and not after.
      confounders:
        - The r = 1 and r = 2 excesses are BYTE-ACTIVITY artifacts, not structural
          signals: at r = 1 a single-byte key difference perturbs a single output byte, so
          any pi missing that byte reads q = 1 trivially. EV-AES-001 B-5 recorded exactly
          this failure in a prior batch. Mitigation: report q per pi POSITION, and treat
          the r = 1-2 readings solely as a sensitivity anchor, never as a signal.
        - Reduced-round convention. Whether the final round drops MixColumns changes q at
          r = 10 and the convention has NO external reference (EV-AES-001 A-12).
          Mitigation: run BOTH conventions and report both columns; do not pick one.
        - PRNG structure in the key sampling could correlate K and K+delta. Mitigation:
          draw K from a counter-mode AES stream under an independent seed, and re-run one
          configuration under a structurally different generator.
      interpretation_limits:
        - THE INSTRUMENT CANNOT DETECT AN EFFECT BELOW ~2^-12.7 RELATIVE. A real
          exploitable structure could easily sit at 2^-100. THEREFORE A NULL READING DOES
          NOT ESTABLISH THE ABSENCE OF EXPLOITABLE STRUCTURE AND MUST NEVER BE WRITTEN AS
          IF IT DID. What a null reading establishes is (i) the death round at the stated
          resolution and (ii) that the target matches its nulls — a CONTROLLED NULL under
          docs/inventor-protocol.md §3, not a finding and not a barrier.
        - No claim about AES security follows from any outcome. A positive outcome would
          be a measured statistical excess requiring independent replication before it is
          anything at all.
        - The conversion lemma (q ~ 1 implies a 2^-d factor) is an argument stated here,
          not a derivation archived anywhere. It must be written out and independently
          reviewed before any cost number rests on it.
      heuristic_assumptions:
        - id: H1-FR2
          statement: >-
            For r >= 4 and a fixed nonzero delta, the pair
            ( E_K^(r)(P), E_{K+delta}^(r)(P) ) is distributed over K as a pair of
            independent uniform 128-bit strings, up to total variation below 2^-64.
            Formally: for every b-bit pi,
            | Pr_K[pi(E_K^(r)(P)) = pi(E_{K+delta}^(r)(P))] - 2^-b | < 2^-64 for r >= 4.
          rigorous_support: >-
            Imitates the wide-trail bound (O-1): the rigorous ingredient is the
            25-active-S-box theorem for 4 rounds combined with the maximum DDT entry
            2^-6, giving a per-characteristic bound 2^-150 over the combined
            key-schedule/data-path trail; the distributional ingredient is the standard
            Markov-cipher / independent-round-keys idealisation that converts a
            characteristic bound into a differential bound. This is the same
            rigorous-bound x distribution-theorem composition the exemplar uses for its
            Heuristic 1.
          validation_plan: >-
            Directly measured by this experiment at N = 2^30, giving resolution 2^-15 and
            a 5-sigma floor of 2^-12.7 — SEVEN ORDERS OF MAGNITUDE COARSER THAN THE
            ASSUMPTION IT IS TESTING. That gap is stated because it is the honest one: the
            experiment can FALSIFY H1-FR2 loudly but can only support it weakly. Tail
            check: the empirical distribution of the excess over the ~640 tested
            configurations must match a chi-square with the right degrees of freedom; a
            heavy tail with no single significant cell is itself informative and is
            pre-registered as such. TOY-SCALE IN RESOLUTION, FULL-SCALE IN ROUND COUNT —
            an unusual combination for this campaign and one that must be labelled
            precisely, never as "validated at cryptographic scale".
        - id: H2-FR2
          statement: >-
            Sampling 2^30 uniform keys is representative of the full 2^128 key space for
            this statistic, i.e. no measure-zero weak-key class carries the effect.
          rigorous_support: >-
            NO THEOREM. A weak-key class of density below 2^-30 is INVISIBLE to this
            experiment by construction. This is the assumption most likely to be wrong in
            the interesting direction and it is named for exactly that reason.
          validation_plan: >-
            Repeat one configuration on STRUCTURED key classes (all-zero bytes on a
            diagonal, low-Hamming-weight keys, keys with a fixed-point in the schedule)
            and report those separately. A structured class showing an excess the uniform
            sample does not is a finding about that class only, scoped to it, and never
            generalised.
      target_complexity:
        time_exponent: >-
          IF an invariance with q > 1 - 2^-40 existed for a d-dimensional key-difference
          subspace, the attack is 2^(128-d) AES evaluations. PREDICTED: no such
          invariance exists at d >= 1 beyond r = 3, so the predicted time exponent is
          2^128 — NO IMPROVEMENT. The experiment measures the round at which d collapses
          to 0.
        memory_exponent: O(1) for the attack; O(1) for the experiment (counters only).
        data_exponent: 2 known plaintext/ciphertext pairs. The offline branch queries
          nothing.
        best_known: 2^126.16 for AES-128 (R4, unverified-from-memory, recall LOW-MEDIUM);
          exhaustive search 2^128 (checkable).
        hidden_overhead: >-
          The conversion lemma ignores the cost of identifying the coset representative
          and the cost of the residual verification of surviving candidates; both are
          O(1) per coset but neither is derived. The d-dimensional generalisation requires
          simultaneous invariance under d generators, whose joint probability is NOT the
          product of the marginals and is not modelled.
        tradeoff_note: >-
          NO time-memory tradeoff: the sieve is memoryless. Parallelisation is
          embarrassing over key ranges, which is equally true of exhaustive search and
          therefore changes no comparison. The candidate is NOT dominated on the memory or
          data axes by any row of the frontier; it is dominated on time by R2/R3/R4.
        exponent_verdict: >-
          THIS IS THE ONLY CANDIDATE IN THE REPORT WHOSE MECHANISM COULD IN PRINCIPLE MOVE
          AN EXPONENT (2^128 -> 2^(128-d) with d growing). Its predicted outcome is that
          d = 0 for r >= 4, which is why it is ranked second rather than first: high
          ceiling, near-zero probability. Under docs/target-result-profile.md A1 the
          MECHANISM is target-class in shape; the PREDICTED RESULT is a controlled null.
      what_must_be_true_to_reach_round_10: >-
        A truncated key-differential of probability essentially 1 on a b-bit output
        projection, over the FULL 10-round cipher including the key schedule. O-1 bounds
        the single-characteristic probability of a 4-round trail at 2^-150 and an 8-round
        trail at 2^-300. For this object to reach round 10 the differential (a hull over
        many characteristics) would have to exceed its best characteristic by more than
        300 bits, which no known aggregation mechanism approaches. STATED HONESTLY: THE
        OBJECT IS NOT EXPECTED TO REACH ROUND 10, AND THE EXPERIMENT IS PROPOSED TO
        MEASURE WHERE IT STOPS, NOT TO CARRY IT FURTHER.
      dominated_by: >-
        R2 (2^126.1), R3 (2^126.67, 2 KP) and R4 (2^126.16) on the TIME axis; R1
        (exhaustive search) dominates it too under the predicted outcome, since 2^128 is
        not an improvement on 2^128. NOT dominated on memory (O(1)) or data (2 KP). Rows
        R1-R10 of baseline_map.md §2 were each checked on time, memory and data before
        this field was written; `null` is not written.
      sota_delta: >-
        Predicted 0 bits versus every row. The only outcome with a nonzero delta is a
        surviving invariance at r = 10 with dimension d, which would give exactly d bits
        below 2^128 and would need to exceed 1.9 bits to beat R2. The experiment as
        specified cannot demonstrate that; it can only fail to exclude it, and the
        distinction is load-bearing.
      estimated_cost:
        implementation: medium
        compute: low
        wall_clock: under 5 minutes on 4 cores for both stages, plus implementation
      recommended_priority: medium
      priority_rationale: >-
        Ranked below CAND-FR-1 because its predicted outcome is a controlled null that
        closes less than CAND-FR-1's attribution does, and because its resolution floor
        (2^-12.7) is so far above the scale where an exploitable effect would live that a
        null teaches less than it appears to. Ranked above nothing else because it is the
        only proposal whose mechanism has any exponent-moving ceiling at all, and because
        this programme has NEVER measured a full-round AES statistic of any kind — four
        batches, zero measurements past r = 5.

# =========================================================================
# CONSIDERED AND NOT PROPOSED
# =========================================================================
considered_and_rejected:
  - object: sigma(K), the key-schedule S-box output vector, with the expanded key as a
      GF(2)-affine function of (K, sigma)
    rejected_at: the lossy-projection test
    mechanism_of_rejection: >-
      sigma determines K (SubWord and RotWord are bijections, so s_1 determines W[3] and
      the chain determines the rest). Nothing is discarded, so this is a change of
      coordinates and not an object. Recorded because "the AES key schedule is nearly
      linear" is exactly the prompt the directive raised, and this is the precise reason
      it does not by itself produce a single-key attack.
    what_remains_open: >-
      A PARTIAL guess of sigma (the first j steps) linearises the first j round keys and
      is the engine of related-key local-collision attacks. Whether any single-key use of
      a partial sigma guess exists that is not already the biclique is open and was not
      resolved here.
  - object: the linear approximation with a key mask, <alpha,P> + <beta,C> + <gamma,K>
    rejected_at: the lossy-projection test
    mechanism_of_rejection: >-
      The key mask gamma propagates through the key schedule almost freely (only 40
      S-boxes for AES-128) but enters the computation only at AddRoundKey. The
      approximation still requires a mask trail through the full 10-round DATA PATH,
      which O-1 bounds at correlation <= 2^-150 for 8 rounds. Low key-schedule diffusion
      buys nothing in the single-key linear model.
    what_remains_open: >-
      Multidimensional and hull-based aggregation can exceed a single characteristic. The
      required gain here is >150 bits and no known mechanism approaches it, but no
      theorem forbids it; the gap between a characteristic bound and a hull bound is the
      only crack in O-1 and is named as open direction (ii).
  - object: the class-C polynomial ideal — first-fall / solving-degree measurement on
      scaled-down AES-like systems
    rejected_at: the resource envelope, explicitly
    mechanism_of_rejection: >-
      DECLARED OUT OF ENVELOPE RATHER THAN ESTIMATED, per the directive. A Macaulay-matrix
      rank computation at degree 4 in ~100 GF(2) variables has ~4e6 columns and is not
      feasible in pure Python with no numpy, no sage, no SAT and no MILP solver. More
      importantly, extrapolating a solving degree from a tiny instance to AES-128 is the
      exact failure mode of the XSL complexity estimate (recall MEDIUM), so a feasible
      toy measurement would not be evidence about AES even if it ran.
    what_remains_open: >-
      Obstruction O-5 caps generic MQ solving on AES-128 at >= 2^704 because a quadratic
      representation needs >= 1408 GF(2) variables. The escape is a solver parameterised
      by a structural width rather than variable count; the natural path decomposition
      has width ~256 and costs ~2^256. A RIGOROUS TREEWIDTH LOWER BOUND FOR THE AES
      EQUATION HYPERGRAPH IS NOT DERIVED HERE and is a concrete, self-contained open item.
  - object: the treewidth / separator object of the AES equation hypergraph
    rejected_at: not a candidate — it is a closure with forward guidance, not an attack
    mechanism_of_rejection: >-
      Any separator-parameterised dynamic program costs 2^(width). The round-boundary
      state is a 128-bit separator and the round function is a bijection on the full
      state, so no proper subset of the state determines the next state. That is a strong
      heuristic argument that width < 128 is impossible, hence no such solver beats 2^128.
      IT IS AN ARGUMENT, NOT A THEOREM, and is labelled as one.
    what_remains_open: >-
      The rigorous lower bound. Also whether a NON-path decomposition (e.g. exploiting
      column locality across ShiftRows) achieves width below 256 while remaining above
      128 — which would still not beat exhaustive search but would sharpen the statement.

