        - rho_min is a minimum over a discrete search; a search-space bug reads as a
          "better" result. Mitigation: the histogram, not just the minimum, is required.
      interpretation_limits:
        - This measures a COMBINATORIAL PROPERTY OF AN ENUMERATION. It is not a
          distinguisher, not a key recovery, and asserts nothing about AES security at
          any round count.
        - Any comparison against the recalled 2^126.1 is UNADJUDICABLE in this
          environment: the baseline is unverified-from-memory and its own accounting
          convention (what it charges, whether the key schedule is free, what data it
          uses) is unknown here. Following EV-AES-001 B-8, ANY CONCLUSION OF THE FORM
