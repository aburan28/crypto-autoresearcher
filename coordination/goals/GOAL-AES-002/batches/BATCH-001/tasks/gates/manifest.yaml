protocol_deviations:
  - id: D-1
    text: >-
      NO APPROVED experiments/<EXP-ID>/specification.yaml EXISTS for this work.
      The Executor contract requires refusing to execute an experiment whose
      contract is not `approved` with a non-null `approved_by`. That refusal is
      NOT exercised here because this task is explicitly scoped as a scratchpad
      execution of an ideation's own pre-registered gates, writes to no
      repository or ledger path, changes no official state, and produces no
      evidence record. The consequence is recorded rather than waived: NOTHING
      in this package may be cited as evidence until a Coordinator binds it to
      an approved contract and a snapshot commit. Until then it is not durable.
  - id: D-2
    text: >-
      GATE 2 ran at N = 524288 = 2^19 keys per configuration for the main run
      and N = 32768 = 2^15 for the independent-generator cross-check, against a
      pre-registered Stage 1 N = 2^22 and Stage 2 N = 2^30. Cause: the 1800 s
      task budget. The achieved 5-sigma resolution floor is reported beside
      every negative reading, as the frozen spec requires. Stage 2 (the
      high-resolution leg) was NOT EXECUTED and is recorded as such; it is
      scope, not an answer.
  - id: D-3
    text: >-
      GATE 2 used a single SOFTWARE AES code path for every matrix rather than
      AES-NI for the real cipher and software for NULL-B. gcc -O3 -maes is
      confirmed working (throughput_receipt.json MEAS-GOAL-AES-002-001), but
      AESENC hardwires the real S-box, so NULL-B (seeded random S-box) is not
      expressible in it. Measuring the target on one engine and its sibling null
      on another would make them incomparable. The cost of this choice is the
      reduced N in D-2, and it is the reason for it.
  - id: D-4
    text: >-
      UNEXPECTED OBSERVATION, RECORDED PER AGENTS.md RULE 8. The ideation
      pre-registered, as a built-in check that NULL-A negates what it claims to
      negate, that "the excess at r = 1 should SURVIVE under NULL-A, since round
      1 is unaffected by the schedule downstream". IT DOES NOT SURVIVE: NULL-A
      reads at the null already at r = 1. The cause is definitional, not a
      defect: "independent uniformly random round keys" includes RK[0], the
      whitening key, whereas in real AES-128 RK[0] = K, so under NULL-A a
      single-byte master-key difference no longer produces a single-byte state
      difference before round 1. The ideation's built-in check presumes
      RK[0] = K. The check is therefore VOID AS WRITTEN and is reported as void
      rather than reinterpreted to pass. It fires no pre-registered VOID or
      falsification condition (both of those are about failure to DECAY, and
      every profile decays), and the sensitivity anchor, which is defined on the
      REAL cipher, is unaffected and holds at 181 sigma.
  - id: D-5
    text: >-
      The GATE 1 confounder mitigation "report both a conservative count and a
      VALUE-EXACT count on a random sample of keys" (H1-FR1's validation plan,
      2^20 keys) was NOT EXECUTED, for budget. Consequence stated plainly: the
      gap between the conservative count and a value-exact count is UNMEASURED,
      so the possibility that this gap differs between AES and NULL-1 and
      thereby corrupts the attribution is NOT excluded by this run. It is named
      as an open item, not estimated.

