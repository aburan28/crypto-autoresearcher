randomness:
  gate1: >-
    NONE. GATE 1 is a deterministic exhaustive enumeration over all 65535
    nonzero 16-bit key-difference SUPPORTS and all 11 splice points. No PRNG is
    instantiated. Byte-identically reproducible by re-running the command.
  gate2:
    key_stream_seed_primary: 20260801002        # splitmix64, argv[4]
    key_stream_seed_crosscheck: 20260801777     # AES-CTR generator, argv[4], keygen=1
    random_sbox_seed: '0x5EED0B0B0B0B0001'      # Fisher-Yates, fixed in source
    null_a_round_key_prf: 'FNV-1a over the master key, then splitmix64 stream'
    fixed_plaintext: '00112233445566778899aabbccddeeff'
    note: >-
      Every draw is a pure function of (seed, key index, matrix index). Re-running
      the same command reproduces the counters byte-identically. Two structurally
      different key generators were run (splitmix64 and AES-CTR under the real
      cipher with an independent seed key) as the pre-registered PRNG-structure
      confounder mitigation.

specification_pinning:
  method: >-
    The GATE 2 software AES was checked against the FIPS-197 Appendix C
    known-answer vectors AND against two independent implementations before the
    instrument was used.
  aes128:
    plaintext: '00112233445566778899aabbccddeeff'
    key: '000102030405060708090a0b0c0d0e0f'
    gate2_instrument: '69c4e0d86a7b0430d8cdb78070b4c55a'
    pycryptodome:     '69c4e0d86a7b0430d8cdb78070b4c55a'
    openssl_cli:      '69c4e0d86a7b0430d8cdb78070b4c55a'
    agree: true
  aes256:
    key: '000102...1f'
    gate2_instrument: '8ea2b7ca516745bfeafc49904b496089'
    pycryptodome:     '8ea2b7ca516745bfeafc49904b496089'
    agree: true
  gate1_pinning: >-
    GATE 1 is a combinatorial activity-propagation instrument and computes no
    ciphertext, so a ciphertext KAT does not apply to it. Its structural pinning
    is the CONTROL-OF-CONTROL (a semantics-preserving transpose relabelling of
    byte indices applied consistently to ShiftRows, the MixColumns column
    grouping and the key-schedule word-to-byte map), which left rho_min AND the
    complete 720885-cell histogram bit-identical on all four matrices.

