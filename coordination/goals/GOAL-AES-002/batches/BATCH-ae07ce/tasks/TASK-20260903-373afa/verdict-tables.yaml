  # =====================================================================
  # TABLE 2 OF 2 — T-003-SUPERSEDED. THE NULL-OBJECT CONTROL.
  # PUBLISHED WHATEVER IT SHOWS.
  # =====================================================================
  table_T_003_SUPERSEDED:
    text_id: T-003-SUPERSEDED
    axis_A_question: as table_T_004.
    axis_B_question: as table_T_004.
    items:
      - spec_id: SPEC-01
        label: ATTACK Q
        axis_A:
          verdict: UNDETERMINED_BY_THIS_TEXT
          determinacy: UNDETERMINED
          confidence: HIGH
          charging_form_if_admissible: null
          clauses_relied_on: ['-003 Route 3, first sentence and closing catch-all']
          one_sentence_reason: >-
            The attack applies a byte-position relabelling that its own text
            identifies as one column's preimage under the linear
            byte-position relabelling, and -003 bars an "independent ShiftRows
            computation" without defining "independent" and without saying
            whether an indexing-only relabelling is a computation at all.
          reachable_alternative_readings:
            - reading: ADMISSIBLE_ROUTE_1_PLUS_3
              because: indexing is not a computation and no bytewise arithmetic is performed.
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                the closing catch-all bars ANY operation outside S-box
                applications and AddRoundKey XORs, and a ShiftRows-derived
                relabelling is such an operation.
          disclosure_status: -003 imposes no disclosure duty; nothing to record.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_applicable: N verification units. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: ['-003 elements c/f joint', 'CM-1 element (f)']
          one_sentence_reason: >-
            CM-1 element (f)'s charge is unconditional and -003 carves out only
            direct encrypt-and-compare enumeration, which this is not.
          reachable_alternative_readings:
            - reading: UNDETERMINED_BY_THIS_TEXT
              because: >-
                -003's operative discriminator is whether generating a
                candidate and "verifying it against the target ciphertexts" are
                genuinely distinct computational acts, and this attack performs
                no verification against a ciphertext at all, so the phrase has
                no referent.

      - spec_id: SPEC-02
        label: ATTACK P
        axis_A:
          verdict: INADMISSIBLE_UNADJUDICABLE
          determinacy: FORCED
          confidence: HIGH
          charging_form_if_admissible: null
          clauses_relied_on: ['-003 Route 3 closing catch-all']
          one_sentence_reason: >-
            MixColumns is computed and is named verbatim in the closing
            sentence's list of operations outside S-box applications and
            AddRoundKey XORs.
          reachable_alternative_readings: []
          disclosure_status: not applicable.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_applicable: N verification units. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: ['-003 elements c/f joint', 'CM-1 element (f)']
          one_sentence_reason: Not encrypt-and-compare enumeration, so element (f)'s unconditional
            charge is not carved out.
          reachable_alternative_readings:
            - reading: UNDETERMINED_BY_THIS_TEXT
              because: >-
                the accept-test compares against a specification constant, not
                against a target ciphertext, so -003's "verifying it against
                the target ciphertexts" has no referent here either.

      - spec_id: SPEC-03
        label: ATTACK P'
        axis_A:
          verdict: UNDETERMINED_BY_THIS_TEXT
          determinacy: UNDETERMINED
          confidence: MEDIUM_HIGH
          charging_form_if_admissible: null
          clauses_relied_on: ['-003 Route 3, first sentence and closing catch-all']
          one_sentence_reason: >-
            P' performs no MixColumns at run time but its specification
            contains one, and -003 supplies no rule fixing the LEVEL at which
            operations are counted — that rule is A-1, which is new in -004.
          reachable_alternative_readings:
            - reading: ADMISSIBLE_ROUTE_1_PLUS_3
              because: no MixColumns is computed per candidate.
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: a MixColumns computation appears in the specification, and the equality test
