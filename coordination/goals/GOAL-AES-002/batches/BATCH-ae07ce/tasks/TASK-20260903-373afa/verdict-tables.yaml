        material_effect: NONE.
      - id: DEF-PANEL-3
        against: panel-spec.yaml, SPEC-08 and SPEC-09
        severity: structural, disclosed by the producer in part
        defect: >-
          Two items are quoted from the very clauses that decide them under
          T-004, so their T-004 verdicts are guaranteed by composition. The panel
          discloses the general leak (LEAK-1, LEAK-2) but does not mark these two
          items as self-deciding.
        material_effect: >-
          Inflates T-004's forced count by 2 of 12. Corrected for in
          `informative_subset_counts` and in INFL-1 rather than left in.
      - id: DEF-004-1
        against: protocol-amendment-GOAL-AES-002-004, clause A-2
        severity: substantive, open
        defect: >-
          "BYTEWISE OPERATION" IS UNDEFINED, AND A-2's iff IS STATED OVER IT.
          Read literally, A-2 makes ANY operation whose result the attack
          requires "independent" and inadmissible — which includes the accept
          test or statistical predicate every attack must perform, and would
          leave Route 3 empty. The escape is to read "bytewise operation" as
          cipher-structural work only, which the text does not say.
        evidence: Drives the reachable alternative readings on SPEC-01.A and SPEC-03.A.
        note: -003 carries the same defect in its closing catch-all ("any other bytewise operation"),
          so this is inherited rather than introduced.
      - id: DEF-004-2
        against: protocol-amendment-GOAL-AES-002-004, clauses A-1 and B-1 together
        severity: substantive, open
        defect: >-
          A-1 fixes counting at the SPECIFICATION level and declares it invariant
          under implementation technique. B-1 keys the bundling test to "THE WORK
          ALREADY CHARGED", which is what an implementation realises. SPEC-04 is
          exactly the construction where the two point opposite ways, and the
          amendment does not say which governs.
        evidence: SPEC-04.B reachable alternative.
      - id: DEF-004-3
        against: protocol-amendment-GOAL-AES-002-004, clauses B-1 and B-2 together
        severity: substantive, open
        defect: >-
          For a two-phase attack, B-1 applied to the produced set and B-2's
          survivor-boundary rule give different answers, and the m=0
          proves-too-much check cannot see the conflict.
        evidence: PVF-1 and PVF-2; SPEC-10.B.
      - id: DEF-CM1-A
        against: CM-1 element (a), admissible conversion Route 1
        severity: substantive, open, and NOT introduced by any amendment
        defect: >-
          ROUTE 1 CHARGES "N S-BOX APPLICATIONS" AND NOWHERE SAYS WHETHER AN
          INVERSE S-BOX APPLICATION COUNTS. S_k is derived from SubBytes and
          SubWord in the encryption direction. Attack Q charges its N in inverse
          S-box applications and every amendment to date passes over the question
          in silence.
        why_it_matters: >-
          If the inverse S-box is not an S-box application under Route 1, the
          conversion is unlicensed and the claim is UNADJUDICABLE — for an attack
          shape that is entirely ordinary. Neither -003 nor -004 touches it, so
          the null-object control cannot see it either.
        status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative. Routed to the
          Coordinator; a candidate item for amendment 005 or for a successor panel.
      - id: DEF-PANEL-4
        against: the panel's axis vocabulary
        severity: minor, methodological
        defect: >-
          UNDETERMINED_BY_THIS_TEXT conflates two different things: a text that
          does not decide, and an ITEM that does not supply the fact the text
          makes decisive. SPEC-06.A under T-004 is the second kind — A-1 and A-2
          are perfectly clear, and the item simply does not say whether the
          attack consumes the fused MixColumns contribution.
        material_effect: >-
          This reader avoided the conflation by recording the item-side gap as a
          reachable alternative rather than as an UNDETERMINED verdict, and says
          so here so the counts can be re-derived under the other convention. A
          successor panel should split the vocabulary.

