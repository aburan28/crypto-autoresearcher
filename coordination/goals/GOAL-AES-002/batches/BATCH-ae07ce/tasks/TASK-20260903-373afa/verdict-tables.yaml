  post_verdict_findings:
    preamble: >-
      Everything below was learned AFTER the ordering receipt was hashed, while
      discharging the quotation-verification duty. None of it altered a table
      cell. It is recorded here because suppressing it would be worse than the
      blindness cost of having read it, and because PVF-1 is the single most
