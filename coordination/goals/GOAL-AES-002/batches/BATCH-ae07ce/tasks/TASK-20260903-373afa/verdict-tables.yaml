    findings:
      - id: PVF-1
        finding: >-
          A BLIND DISAGREEMENT WITH AMENDMENT 004's OWN CLASSIFICATION, ON AN
          ITEM RC-6 DESIGNATED AS PASS-CAPABLE. -004's
          `relation_to_what_003_already_closed` states that a partial-key-recovery
          attack with an ordinary exhaustive encrypt-and-compare residual
          "performs a full per-candidate AES-k evaluation as its production work,
          so verification is BUNDLED and element (f)'s separate charge does not
          additionally apply — the same answer -003 gave". This reader, reading
          only clauses B-1 to B-4, recorded SEPARATE_CHARGE_APPLIES as
          better-supported and BUNDLED as reachable, and hashed that before
          seeing this field.
        why_it_matters: >-
          This is precisely the event RC-6 exists to detect: a conforming reader
          who has seen the rule text but not the author's worked examples reaches
          a different verdict from the author on a case the author considered
          settled. One draw, one disagreement, on 1 of the 2 items designated
          pass-capable.
        the_substantive_disagreement: >-
          -004 treats the residual search as "production work" for the residual
          candidate set. But CM-1 element (c) already charges the residual as the
          SEARCH over a set the partial recovery produced, and B-2 levies the
          charge on "the SURVIVORS of the LAST production stage that does not
          include a full per-candidate AES-k evaluation", which for a genuinely
          two-phase attack is the partial-recovery stage. B-1 read alone gives
          BUNDLED; B-2 and B-3 read as the boundary rule they announce themselves
          to be give SEPARATE. The clauses are not reconciled in the text.
        not_asserted: >-
          This reader does NOT assert -004 is wrong. It asserts the text does not
          force the author's answer, which is the only thing this instrument can
          establish, and which is enough to matter.
      - id: PVF-2
        finding: >-
          -004's m=0 PROVES-TOO-MUCH CHECK CANNOT REACH THE CASE PVF-1 IS ABOUT.
          The check applies B-1 to the m=0 definitional reference and finds the
          antecedent false, so the charge does not apply. At m=0 there is exactly
          ONE production stage, so B-2's phrase "the LAST production stage that
          does not include a full per-candidate AES-k evaluation" has no boundary
          to name and B-2 never binds. The first configuration in which B-1 and
          B-2 can conflict is m greater than 0 — which is SPEC-10 — and there the
          amendment ASSERTS the answer rather than deriving it.
        why_it_matters: >-
          A proves-too-much control is supposed to run the argument on an object
          where the conclusion is known. This one runs it on the single object
          where the clause under suspicion is inactive. The control is real and
          it passes; it just does not cover the clause interaction. Recorded as a
          gap in the control, not as an error in the check.
        forward_guidance: >-
          The cheap repair is a second proves-too-much instance at m greater than
          0 with a stated stage decomposition, run before -005 is written. It
          costs no compute.
      - id: PVF-3
        finding: >-
          A SECOND, WEAKER BLIND DISAGREEMENT, ON DISCLOSURE. RT-20260901-3ad5d2
          records that Attack Q's "A-4 disclosure is COMPLETE AND HONEST". This
          reader, applying A-4(ii)'s own words, recorded that the quoted
          disclosure names the implementation technique but does NOT carry the
          accompanying explicit statement that the technique does not affect the
          Route 3 classification, which A-4 requires in the same breath and whose
          omission A-4 makes fatal.
        status: >-
          WEAK, AND WEAKENED FURTHER BY THE PANEL ITSELF, which quotes a prefix
          and states it "makes NO statement about whether it is complete". This
          reader's rule R-a kept it out of the axis verdict for that reason. It is
          recorded because A-4's second limb is a disclosure duty that can void a
          claim, and two readers already read it differently on the first
          construction anyone applied it to.

