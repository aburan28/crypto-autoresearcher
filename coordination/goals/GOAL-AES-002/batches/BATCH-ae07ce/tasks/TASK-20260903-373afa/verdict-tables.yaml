  # =====================================================================
  # THE COMPARISON. THIS IS THE RESULT.
  # =====================================================================
  comparison_of_the_two_tables:
    what_is_being_counted: >-
      Twenty cells per text (ten items x two axes). Each cell carries a verdict
      and a determinacy grade. Two derived counts are reported: how many cells
      the text DECIDES (verdict other than UNDETERMINED_BY_THIS_TEXT), and how
      many it FORCES (no reachable alternative reading). Counts are of THIS
      READER's classification. They are not an agreement rate between readers.
    informative_and_uninformative_cells:
      uninformative_cells: 7
      which: >-
        SPEC-04.A, SPEC-05.A, SPEC-09.A, SPEC-10.A, SPEC-06.B, SPEC-07.B,
        SPEC-08.B — all NOT_ENGAGED_BY_THIS_SPECIFICATION under BOTH texts.
        These are decided by the ITEM's silence, not by the rule text, so they
        carry zero power to discriminate between the two texts and are excluded
        from the informative counts below. They are not defects: the panel
        deliberately puts both axes to every item and declares NOT_ENGAGED a
        first-class answer.
      informative_cells: 13
    headline_counts:
      T_004:
        cells_decided: 20
        cells_undetermined: 0
        cells_forced: 12
        cells_forced_by_construction: 2
      T_003_SUPERSEDED:
        cells_decided: 15
        cells_undetermined: 5
        cells_forced: 9
        cells_forced_by_construction: 1
    informative_subset_counts:
      T_004: {decided: 13, undetermined: 0, forced: 5, forced_by_construction: 2}
      T_003_SUPERSEDED: {decided: 8, undetermined: 5, forced: 4, forced_by_construction: 1}
    cells_where_the_two_texts_give_different_best_supported_verdicts:
      count: 7
      of_informative_cells: 13
      list:
        - {cell: SPEC-01.A, T_004: ADMISSIBLE_ROUTE_1_PLUS_3, T_003: UNDETERMINED_BY_THIS_TEXT,
           direction: 004 resolves an indeterminacy}
        - {cell: SPEC-03.A, T_004: ADMISSIBLE_ROUTE_1_PLUS_3, T_003: UNDETERMINED_BY_THIS_TEXT,
           direction: 004 resolves an indeterminacy}
        - {cell: SPEC-06.A, T_004: ADMISSIBLE_ROUTE_1_PLUS_3, T_003: UNDETERMINED_BY_THIS_TEXT,
           direction: 004 resolves an indeterminacy}
        - {cell: SPEC-07.A, T_004: ADMISSIBLE_ROUTE_1_PLUS_3, T_003: UNDETERMINED_BY_THIS_TEXT,
           direction: 004 resolves an indeterminacy, and forces it}
        - {cell: SPEC-05.B, T_004: SEPARATE_CHARGE_APPLIES, T_003: UNDETERMINED_BY_THIS_TEXT,
           direction: 004 resolves an indeterminacy}
        - {cell: SPEC-04.B, T_004: SEPARATE_CHARGE_APPLIES, T_003: BUNDLED_NO_SEPARATE_CHARGE,
           direction: 004 REVERSES the answer}
        - {cell: SPEC-10.B, T_004: SEPARATE_CHARGE_APPLIES, T_003: BUNDLED_NO_SEPARATE_CHARGE,
           direction: 004 REVERSES the answer AND is less determinate than 003 was}
    cells_where_the_two_texts_agree:
      count: 6
      list: [SPEC-02.A, SPEC-08.A, SPEC-01.B, SPEC-02.B, SPEC-03.B, SPEC-09.B]
    what_the_null_object_control_shows:
      did_004_buy_anything: >-
        YES, ON THIS ONE READER'S CLASSIFICATION, AND THE EFFECT IS NOT SMALL.
        Under the superseded -003 text this reader could not decide 5 of 13
        informative cells at all; under -004 that number is 0. Forced cells rise
        from 4 to 5 on the informative subset and from 9 to 12 overall. Had the
        two tables looked alike, -004 would have bought nothing and that would
        have been the finding; they do not look alike.
      where_the_gain_is_concentrated: >-
        Exactly on the shapes -004 was written for. Every -003 indeterminacy
        this reader recorded traces to one of three phrases -004 replaces:
        "independent" undefined (SPEC-01.A, SPEC-03.A, SPEC-07.A), "the S-box
        route" undefined (SPEC-06.A), and "genuinely distinct computational
        acts" undefined (SPEC-05.B). A-1's specification-level counting rule
        and A-3(i)'s indexing rider do the work on axis A; B-1's full-evaluation
        test and B-2/B-3's stage decomposition do it on axis B.
      where_004_is_worse_than_003: >-
        REPORTED BECAUSE IT IS AGAINST THE AMENDMENT'S INTEREST. On SPEC-10.B,
        -003 is FORCED (it names the construction word for word) and -004 is
        only BEST_SUPPORTED, and this reader's best-supported reading of -004
        REVERSES the -003 answer. -004's B-block re-expressed -003's
        encrypt-and-compare carve-out as a test on production work, and in
        doing so re-opened a case -003 had closed by naming. This is the
        repair-by-relocation pattern DEC-20260903-7548c0 records as having
        failed twice, appearing again in the very amendment written to end it.
      the_artifact_tell_and_what_should_happen_to_it: >-
        The quantity meant to be destroyed by the control IS the determinacy
        gain, and it did decay: 12 forced cells under -004 fall to 9 under the
        superseded text, and 0 undetermined cells rise to 5. Three separate
        reasons why the surviving gain may still be inflated are named and
        quantified below rather than left for a reader to suspect.
    three_reasons_the_measured_gain_is_an_upper_bound:
      - id: INFL-1
        inflation: >-
          PANEL COMPOSITION. Two of T-004's twelve forced cells (SPEC-08.A,
