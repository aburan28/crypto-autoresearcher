          disclosure_status: not applicable.
        axis_B:
          verdict: BUNDLED_NO_SEPARATE_CHARGE
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_applicable: null
          clauses_relied_on: ['-003 elements c/f joint']
          one_sentence_reason: >-
            The specification's own words are "EVALUATE AES-k(P1) UNDER k_hat
            AND COMPARE THE RESULT WITH C1", which is direct
            encrypt-and-compare enumeration on its face, and -003 keys its
            carve-out to the MECHANISM rather than to the work charged.
          reachable_alternative_readings:
            - reading: SEPARATE_CHARGE_APPLIES
              because: >-
                the work actually charged is an aborted partial evaluation, so
                a reader may hold that the mechanism is not really
                encrypt-and-compare enumeration. -003 supplies no rule for
                choosing between the specified and the charged mechanism.

      - spec_id: SPEC-05
        label: ATTACK H
        axis_A:
          verdict: NOT_ENGAGED_BY_THIS_SPECIFICATION
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM_HIGH
          charging_form_if_admissible: null
          clauses_relied_on: []
