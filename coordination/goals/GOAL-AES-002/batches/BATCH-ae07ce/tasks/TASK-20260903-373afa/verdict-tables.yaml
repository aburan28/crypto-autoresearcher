verdict_tables:
  # =====================================================================
  # RC-6 BLIND PANEL CLASSIFICATION. TWO TABLES, PUBLISHED SIDE BY SIDE.
  # T-004 IS THE MEASUREMENT; T-003-SUPERSEDED IS THE NULL-OBJECT CONTROL.
  # THE COMPARISON BETWEEN THEM IS THE RESULT.
  # =====================================================================
  id: VAL-20260904-373afa
  task_id: TASK-20260903-373afa
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-ae07ce
  authored_by_role: validator
  authored_at: '2026-09-04'
  authored_at_basis: >-
    This session's runtime context states "Today's date is 2026-09-04". A clock
    IS readable from this session (unlike the panel's producing session), and
    the repository working tree confirms the panel file's mtime under the same
    date. The divergence from BATCH-ae07ce and DEC-20260903-7548c0, both dated
    2026-09-03, is stated rather than smoothed. Nothing is backdated.

  what_this_record_is: >-
    ONE READER'S CLASSIFICATION of the ten frozen specifications of
    PANEL-BATCH-ae07ce-TASK-20260903-59e9b9, on two axes, under two rule texts,
    plus the independent artifact verification this session could perform and
    the panel's producing session could not. IT ASSERTS NOTHING ABOUT AES AT
    ANY ROUND COUNT. Claim ceiling: SPECIFICATION RESULT ONLY.
  what_this_record_is_not:
    - >-
      IT IS NOT AN INTER-READER AGREEMENT MEASUREMENT. RC-6 asks whether TWO
      conforming readers reach the same verdict. This record carries ONE
      reader's verdicts and, beside each, that reader's judgement of whether
      the text FORCES the verdict. Textual forcing is a proxy for agreement,
      not agreement itself. See limitations LIM-1 and LIM-2.
    - >-
      IT IS NOT A MARGIN, A COST CLAIM, OR A COMPARISON AGAINST ANY PUBLISHED
      STATE OF THE ART. No numeric value is computed, assigned or estimated for
      any N, X, D, G, M, t or survivor count anywhere below.
    - >-
      IT IS NOT AN AMENDMENT, AN APPROVAL, A STATUS CHANGE OR A PROMOTION, and
      it edits no committed record. Defects found in the panel and in
      amendment 004 are REPORTED here and repaired, if at all, by new records.
    - >-
      IT IS NOT A VALIDATION OF CM-1, OF ANY AMENDMENT, OR OF THE COST MODEL'S
      CORRECTNESS. It validates the panel as an instrument and reports one
      reading of two rule texts against it.

  # =====================================================================
  # WHAT WAS CLASSIFIED, AND ITS CONTENT BINDING.
  # =====================================================================
  object_classified:
    path: coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-59e9b9/panel-spec.yaml
    sha256_recomputed_by_this_session: e9fe9f9138118ac41d9568199a898163fbd3c3863cad6cdecfb76a03340ee29b
    sha256_declared_by_the_orchestrator: e9fe9f9138118ac41d9568199a898163fbd3c3863cad6cdecfb76a03340ee29b
    sha256_match: true
    sha256_recompute_command: >-
      sha256sum coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-59e9b9/panel-spec.yaml
    producer_left_its_own_digest_null: >-
      CORRECTLY. freeze-receipt.json content_binding.sha256 is null with
      sha256_status "NOT COMPUTED, NOT ESTIMATED, NOT INVENTED" because that
      session had no command-execution tool. This session has one, recomputed
      the digest independently, and it matches the value the orchestrator
      supplied. The producer refused to invent a digest and the digest it
      refused to invent is the correct one.
    commit_state: >-
      THE PANEL IS COMMITTED, NOT WORKING-TREE-ONLY. `git log -1` on the panel
      path returns commit 7d895a33b ("wip(GOAL-AES-002/BATCH-ae07ce): preserve
      TASK-20260903-59e9b9 panel output"); `git show HEAD:<panel path> |
      sha256sum` returns the same e9fe9f91... digest as the working tree, and
      `git status --porcelain` on the tasks/ directory is empty. Session HEAD
      932c4007243f140a5612a19a23d268170ee50817 on branch
      claude/degree-regularity-polynomial-systems-pssesi.
    commit_state_caveat: >-
      STATED BECAUSE IT MATTERS AND IS NOT WHAT THE BATCH PLAN SCHEDULES. The
      commit above is a preservation commit, NOT the batch's declared snapshot
      archive, which is TASK-20260903-bdd0bb and which runs AFTER this task in
      DEC-20260903-7548c0's chain. So the panel is content-verified and
      commit-reachable, but the authoritative archive receipt that binds
      archive.path_sha256 does not yet exist. agents/validator.md's refusal
      rule ("refuse to validate a working-tree-only producer receipt") is
      SATISFIED on content and reachability, and the archive binding remains
      OWED by TASK-20260903-bdd0bb.

  texts_classified_against:
    - text_id: T-004
      role: the measurement
      read_from:
        - "coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-004.yaml :: protocol_amendment.the_change.item_1_gap_a_definition_of_independent.resolving_text_verbatim (clauses A-1, A-2, A-3(i), A-3(ii), A-4)"
        - "coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-004.yaml :: protocol_amendment.the_change.item_2_gap_b_the_bundling_test.resolving_text_verbatim (clauses B-1, B-2, B-3, B-4)"
        - "coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml :: elements (a), (b), (c), (d), (f) as they stand"
    - text_id: T-003-SUPERSEDED
      role: the null-object control
      read_from:
        - "coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-003.yaml :: protocol_amendment.the_change.item_1_element_a_route_3.resolving_text_verbatim"
        - "coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-003.yaml :: protocol_amendment.the_change.item_2_elements_c_f_joint.resolving_text_verbatim"
        - "coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml :: elements (a), (b), (c), (d), (f) as they stand"
      note_on_how_the_control_text_was_constituted: >-
        The panel's `operative_text_paths` for T-003-SUPERSEDED name exactly
        these two blocks, and they were read on their own words with no clause
        of -004 applied. -004's own `superseded_sentences` field was NOT opened.
        It names which fragments -004 displaced, but it sits inside the
        amendment whose analysis this panel exists to test, so opening it would
        have imported -004's framing into the control. This is a deliberate
        blindness-preserving choice, declared here rather than absorbed; the
        panel's own path list is what was followed.

  # =====================================================================
  # READING RULES, DECLARED BEFORE CLASSIFICATION AND HASH-COMMITTED.
  # =====================================================================
  reading_rules_declared_before_classification:
    R-a: >-
      Axis A is answered on the substantive Route 1 + Route 3 bar (which
      bytewise operations the attack performs and whether they fall inside the
      routes). Clause A-4's and B-4's MANDATORY-DISCLOSURE duties are recorded
      separately per item as `disclosure_status` and are NOT folded into the
      axis verdict, because every panel item is a declared verbatim PREFIX and
      none purports to reproduce a whole cost claim's text. Folding a
      completeness-of-disclosure test into the verdict would measure the
      panel's quotation policy rather than the rule.
    R-b: >-
      CM-1 element (f)'s N-verification charge is UNCONDITIONAL on its own
      words ("an attack that reduces the key space to a set of size N has paid,
      at minimum, N verification units"). Both -003 and -004 carve exceptions
      from it. Axis B is therefore answered as: the charge applies unless an
      exception in the text being read is applicable. UNDETERMINED is recorded
      on axis B only where the applicability of the exception itself cannot be
      decided from the text's words.
    R-c: >-
      Three determinacy grades are recorded beside every verdict. FORCED — no
      conforming reader could reach another verdict on this text's own words.
      BEST_SUPPORTED — one reading is better supported but another is
      reachable, and the reachable alternative is named. UNDETERMINED — no
      reading is better supported. FORCED_BY_CONSTRUCTION is FORCED with the
      additional disclosure that the deciding clause quotes the item verbatim,
      so the verdict is guaranteed by panel composition and is weak evidence of
      the text's determinacy in general.
    R-d: >-
      No numeric value is computed, assigned or estimated for any N, X, D, G,
      M, t or survivor count. Charging forms are symbolic only.
    ordering_receipt:
      what: >-
        The two tables' verdict / determinacy / confidence triples, together
        with the four rules above, were written to a file and hashed BEFORE
        this session opened any excised source span, any amendment field
        beyond the four resolving_text_verbatim blocks, or freeze-receipt.json.
      sha256: d79e5129ce1e70e2b86245f3d204be35b7bc29cb0d1c9a74e36b29c71f191fce
      file: >-
        Written to this session's ephemeral scratchpad, NOT to the repository,
        because the task's declared deliverable list names exactly one file and
        an undeclared second artifact in write_scope would be a scope
        expansion. THE FILE IS EPHEMERAL AND A LATER READER CANNOT OPEN IT:
        what survives is the digest above, which is a commitment to the
        verdicts and not a retrievable artifact. The verdict/determinacy/
        confidence triples reproduced in the two tables below were MECHANICALLY
        COMPARED against that file after both were written: 40 of 40 triples
        (10 items x 2 axes x 2 texts) are identical, with zero differences.
        Nothing was revised after the excised spans were read,
        and where post-verdict reading changed what this session BELIEVES, that
        is recorded under `post_verdict_findings` and NOT folded into a table.

  # =====================================================================
  # BLINDNESS ATTESTATION. THE PANEL BINDS THREE OBLIGATIONS ON ANY
  # CLASSIFIER; EACH IS ANSWERED SEPARATELY AND HONESTLY.
  # =====================================================================
  blindness_attestation:
    obligation_1_do_not_read_the_amendments_worked_examples_checks_or_limitations:
      complied_before_verdicts: true
      detail: >-
        Before recording verdicts this session read, from the amendments,
        ONLY the four `resolving_text_verbatim` blocks, extracted by a script
        that printed that key and no other, so no neighbouring field was
        displayed. -003's item_3 and item_4 resolving texts (two-axis data
        sub-lattice; distinguisher bridge) were printed by the same key filter
        and are recorded here as incidentally read; neither bears on either
        axis and neither carries a verdict for any panel item. From CM-1 this
        session read elements (a), (b), (c), (d) and (f) in full, which the
        panel expressly permits ("plus CM-1's elements as they stand").
    obligation_2_do_not_open_the_provenance_sources_cited_under_each_item:
      complied_before_verdicts: true
      complied_after_verdicts: false
      detail: >-
        RT-20260901-3ad5d2's report and the -004 fields the derived items quote
        were NOT opened before verdicts were recorded and hashed. They WERE
        opened afterwards, deliberately, to discharge this session's own
        validator duty to verify that every quoted span matches its committed
        source byte for byte — a duty the panel's producing session explicitly
        could not discharge and explicitly left owed. That reading exposed
        verdict-adjacent text (see `post_verdict_findings`). The ordering
        receipt above is what separates the two phases, and it is a digest
        rather than an assertion.
    obligation_3_classify_in_the_frozen_order_and_complete_T_004_first:
      complied: true
      detail: >-
        SPEC-01 through SPEC-10 in the frozen order, T-004 completed before
        T-003-SUPERSEDED was begun, both tables written in one pass to the
        ordering-receipt file.
    freeze_receipt_not_read_before_verdicts:
      complied: true
      detail: >-
        freeze-receipt.json was NOT opened until after the ordering receipt was
        hashed. It was then opened, because its coverage mapping is the object
        of a cross-check this task owes (see `coverage_cross_check`), and
        because LEAK-3 of the panel's own blindness self-check declares the
        split deliberately.
    procedure_deviations:
      - id: PD-1
        deviation: >-
          Provenance sources and excised spans were read AFTER verdicts were
          recorded, which the panel's obligation 2 permits by its own wording
          ("before recording a verdict for every item") but which nonetheless
          exposed this reader to two readers' opposite verdicts on SPEC-01 and
          to -004's own classifications of SPEC-09 and SPEC-10.
        why: >-
          Verifying verbatim quotation against the committed source is a
          non-delegable Validator duty (agents/validator.md responsibility 1)
          and the freeze receipt names it as OWED. It cannot be done without
          opening the source.
        effect_on_the_tables: >-
          NONE, and the digest above is the evidence rather than this
          sentence. No table cell was altered after the ordering receipt was
          written.
      - id: PD-2
        deviation: >-
          -004's `superseded_sentences` field was not opened, though the panel
          describes T-003-SUPERSEDED as "the three sentence fragments -004
          names in superseded_sentences read on their own words".
        why: >-
          The panel's own `operative_text_paths` for T-003-SUPERSEDED name
          -003's two resolving-text blocks and nothing else. Reading -004's
          characterisation of what it displaced would have imported -004's
          framing into the null object, which is the one thing a null object
          may not contain.
        effect: >-
          The control text is -003's own words. A reader who believes the
          superseded_sentences list changes the control's constitution should
          re-run the control; this is named so that it can be.

  # =====================================================================
  # TABLE 1 OF 2 — T-004. THE MEASUREMENT.
  # =====================================================================
  table_T_004:
    text_id: T-004
    axis_A_question: >-
      Under this text, is the specification's charged bytewise cost admissible
      under Route 1 + Route 3, and if so at what charging form?
    axis_B_question: >-
      Under this text, does element (f)'s separate N-verification-unit charge
      apply to this specification's candidate set, or is verification already
      bundled?
    items:
      - spec_id: SPEC-01
        label: ATTACK Q
        axis_A:
          verdict: ADMISSIBLE_ROUTE_1_PLUS_3
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_admissible: (N/S_k + X/X_k) AEU-k, with N and X the attack's own disclosed
            specification-level counts. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [A-3(i), A-1]
          one_sentence_reason: >-
            A-3(i) rules that a fixed, data-independent byte-position selection
            applied by indexing alone is not a ShiftRows computation, and the
            specification states no MixColumns, no table access and no other
            bytewise operation.
          reachable_alternative_readings:
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                Step (4) evaluates a statistical predicate on four output
                bytes. If that is a "bytewise operation", A-2's iff makes it
                INDEPENDENT (the attack's specification requires its result)
                and A-2(i) then triggers inadmissibility. NEITHER TEXT DEFINES
                "BYTEWISE OPERATION". See defect DEF-004-1.
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                The charged N counts INVERSE S-box applications. Route 1 is
                stated for "S-box applications" and neither CM-1 nor any
                amendment says whether the inverse S-box counts. See defect
                DEF-CM1-A.
          disclosure_status: >-
            A-4(ii) requires a Route 3 claim to state the implementation
            technique TOGETHER WITH the explicit statement that it does not
            affect the Route 3 classification. The quoted disclosure states the
            technique ("implementation assumed plain byte-oriented") and does
            NOT carry that second statement. On a strict reading of A-4 the
            claim is INADMISSIBLE for a disclosure defect. Kept out of the axis
            verdict by rule R-a because the panel quotes a prefix and does not
            purport to reproduce the whole claim text.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: FORCED
          confidence: HIGH
          charging_form_if_applicable: N verification units levied on the survivors of the
            statistical-predicate stage (B-2). NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [B-1, B-2]
          one_sentence_reason: >-
            B-1 names "a statistical constraint check" in its own list of
            PARTIAL evaluations that do not bundle verification, and the
            attack's production work contains no full AES-k evaluation.
          reachable_alternative_readings: []
          disclosure_status: >-
            B-4 requires a stage decomposition and survivor count; the quoted
            specification gives neither. Recorded, not folded in (rule R-a).

      - spec_id: SPEC-02
        label: ATTACK P
        axis_A:
          verdict: INADMISSIBLE_UNADJUDICABLE
          determinacy: FORCED
          confidence: HIGH
          charging_form_if_admissible: null
          clauses_relied_on: [A-2(i), A-3(i)]
          one_sentence_reason: >-
            The attack accepts iff m = MixColumns(a) equals a constant, so its
            specification-level description requires the MixColumns result,
            which A-2(i) makes independent and inadmissible; A-3(i) adds that
            MixColumns NEVER qualifies for the indexing rider.
          reachable_alternative_readings: []
          disclosure_status: not reached; the bar is failed on the operation profile.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: FORCED
          confidence: HIGH
          charging_form_if_applicable: N verification units on the survivors of the accept-test
            stage (B-2). NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [B-1, B-2]
          one_sentence_reason: >-
            Per-candidate production work is four S-box applications and a
            comparison — a truncated computation, which B-1 names explicitly as
            NOT a full evaluation and therefore not bundling.
          reachable_alternative_readings: []
          disclosure_status: B-4 decomposition absent from the quoted specification; recorded only.

      - spec_id: SPEC-03
        label: ATTACK P'
        axis_A:
          verdict: ADMISSIBLE_ROUTE_1_PLUS_3
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM_HIGH
          charging_form_if_admissible: (N/S_k + X/X_k) AEU-k. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [A-2(ii), A-1]
          one_sentence_reason: >-
            P' accepts iff a equals a constant computed once at specification
            time, so its specification-level description requires no MixColumns
            result at all, and A-2's "THE TEST IS WHAT THE ATTACK NEEDS, NEVER
            HOW IT IS COMPUTED" is squarely on point.
          reachable_alternative_readings:
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                The equality comparison against s' is an operation on bytes;
                same undefined term as SPEC-01 (DEF-004-1).
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                s' := MixColumns^{-1}(s) is a MixColumns-family computation
                performed once at specification time. Whether one-time
                specification-time work counts against the Route 3 bar, or is
                instead element (f) precomputation, is stated by neither text.
          disclosure_status: A-4(i)/(ii) disclosures absent from the quoted span; recorded only.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: FORCED
          confidence: HIGH
          charging_form_if_applicable: N verification units on the survivors of the accept-test
            stage (B-2). NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [B-1, B-2]
          one_sentence_reason: As SPEC-02; the per-candidate work is a truncated computation, not a
            full AES-k evaluation.
          reachable_alternative_readings: []
          disclosure_status: B-4 decomposition absent; recorded only.

      - spec_id: SPEC-04
        label: ATTACK S
        axis_A:
          verdict: NOT_ENGAGED_BY_THIS_SPECIFICATION
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_admissible: null
          clauses_relied_on: [A-1]
          one_sentence_reason: >-
            The specification states no S-box or AddRoundKey counts at all and
            charges directly in fractional AEU-k, so no Route 1 + Route 3
            conversion is invoked for a reader to rule on.
          reachable_alternative_readings:
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                Charging an early-aborted partial encryption at a fraction of
                an AEU-k is a throughput conversion, and CM-1's Route 2 is
                UNAVAILABLE until a measured receipt exists. On that reading
                the figure is inadmissible under element (a) itself rather than
                under the Route 3 bar. THIS ROUTE IS OUTSIDE BOTH AXES AS THE
                PANEL POSES THEM, and is recorded so it is not lost.
          disclosure_status: not applicable; no Route 3 claim is made.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_applicable: N verification units on the survivors of the early-aborted
            match stage (B-2). NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [B-1, B-2]
          one_sentence_reason: >-
            B-1 tests "THE WORK ALREADY CHARGED for producing that set", and
            the charged work is an aborted partial evaluation, which B-1 names
            as NOT a full evaluation.
          reachable_alternative_readings:
            - reading: BUNDLED_NO_SEPARATE_CHARGE
              because: >-
                A-1 declares counting to be SPECIFICATION-LEVEL and invariant
                under implementation technique, and at specification level this
                attack evaluates AES-k under each candidate. A-1 and B-1 pull
                in opposite directions here: A-1 says ignore the
                implementation, B-1 says look at what was charged, and the
                early abort is described in the specification as
                "Implementation". See defect DEF-004-2.
          material_observation_not_a_verdict: >-
            EVEN ON THE VERDICT RECORDED, B-2 levies the charge on the
            SURVIVORS of the abort stage, not on the produced pool. So "the
            separate charge applies" resolves to a charge on the small
            post-abort survivor set, and the B-block does NOT by itself
            recover the difference between the charged and the specified
            production work. Whether that difference is closed elsewhere is an
            element (a)/(b) question, not an element (f) one, and is not
            decided here. NO QUANTITY IS COMPUTED.
          disclosure_status: >-
            B-4 requires the stage decomposition and per-stage survivor counts;
            the quoted specification gives an abort probability but no stage
            decomposition. Recorded, not folded in.

      - spec_id: SPEC-05
        label: ATTACK H
        axis_A:
          verdict: NOT_ENGAGED_BY_THIS_SPECIFICATION
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM_HIGH
          charging_form_if_admissible: null
          clauses_relied_on: [A-1]
          one_sentence_reason: >-
            The specification states no S-box or AddRoundKey counts and leaves
            the cost of the algebraic constraint T unquantified, so no Route 1
            + Route 3 conversion is put to the reader.
          reachable_alternative_readings:
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: >-
                An attack whose auxiliary work (evaluating T) is expressible
                only as unqualified "operations" falls under A-3's closing
                sentence and CM-1 element (a)'s inadmissibility clause. The
                specification does not say what T costs, so this reading
                depends on a gap in the ITEM, not in the text.
          disclosure_status: not applicable; no Route 3 claim is made.
        axis_B:
          verdict: SEPARATE_CHARGE_APPLIES
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM_HIGH
          charging_form_if_applicable: N verification units on the survivors of the T-constraint
            stage, i.e. the candidates that reach the encryption. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [B-3, B-2, B-1]
          one_sentence_reason: >-
            B-3 decomposes a multi-stage production STAGE BY STAGE regardless
            of syntax, B-1 makes procedural form irrelevant, and B-2 then names
            the T-constraint stage as the last production stage without a full
            per-candidate AES-k evaluation.
          reachable_alternative_readings:
            - reading: BUNDLED_NO_SEPARATE_CHARGE
              because: >-
                The specification is ONE loop with no stage boundary in its
                text, so a reader could hold that there is a single stage whose
                production work includes the full evaluation. B-1's
                irrelevance-of-procedural-form clause is written in the
                direction "separation never TRIGGERS the charge" and is not
                symmetrically stated for fusion, though B-3's
                anti-relabelling sentence points the other way.
          disclosure_status: B-4 decomposition absent from the quoted specification; recorded only.

      - spec_id: SPEC-06
        label: FUSED TABLE-DRIVEN IMPLEMENTATION
        axis_A:
          verdict: ADMISSIBLE_ROUTE_1_PLUS_3
          determinacy: BEST_SUPPORTED
          confidence: MEDIUM
          charging_form_if_admissible: (N/S_k + X/X_k) AEU-k on the attack's own specification-level
            counts. NO NUMERIC VALUE ASSIGNED.
          clauses_relied_on: [A-1, A-2(ii), A-3(ii)]
          one_sentence_reason: >-
            A-1 says no implementation technique is by itself admissible or
            inadmissible and names the fused T-table explicitly; A-3(ii) puts
            an access realising one charged S-box application inside the S-box
            route; and the fused ShiftRows and MixColumns contributions are
            then by-products under A-2(ii) unless the attack's specification
            requires them.
          reachable_alternative_readings:
            - reading: UNDETERMINED_BY_THIS_TEXT
              because: >-
                The item states only the IMPLEMENTATION and does not say
                whether the attack's specification-level description consumes
                the ShiftRows or MixColumns results. A-2 makes that the whole
                test, so a reader could hold the item underdetermined as posed.
                This is a gap in the ITEM, not in the text, and it is the
                clearest instance of -004 answering a question by relocating
                it to a fact the item does not supply.
          disclosure_status: >-
            A-4(ii) is SATISFIED in substance by this item, which states the
            implementation technique; the accompanying "does not affect the
