          one_sentence_reason: No bytewise counts are stated; the charge is made directly in
            fractional AEU-k, so no Route 1 + Route 3 conversion is invoked.
          reachable_alternative_readings:
            - reading: INADMISSIBLE_UNADJUDICABLE
              because: as under T-004, the fractional-AEU-k charge is a throughput conversion and
