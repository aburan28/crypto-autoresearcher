  # ===================================================================
  # THE FOUR QUESTIONS THE CARD ASKS, ANSWERED AFTER THE SEAL.
  # ===================================================================
  answers_to_the_cards_four_questions:

    a_SPEC_10:
      my_blind_verdict: BUNDLED_NO_SEPARATE_CHARGE
      confidence: MEDIUM
      route_taken: >-
        B5-3 states expressly that "a set of PARTIAL-key values is not a
        candidate-key set" and routes the partial phase to CM-1 element (c)'s
        unchanged partial-key-recovery clause. That leaves only the residual
        exhaustive encrypt-and-compare search as a candidate-key set each of whose
        tested members receives a verifying test, and the claim charges one full
        AES-k evaluation for the work performed per member of that set. One AEU-k is
        not LESS THAN one AEU-k, so B5-1's antecedent is false and no separate charge
        applies to that set; B5-3's closing sentence then gives "no separate
        verification charge applies to the attack at all".
      THIS_CELL_IS_NOT_BLIND_AND_THE_BREAK_IS_THIS_TASK_S_CARD:
        what_happened: >-
          THE TASK CARD ITSELF DISCLOSED BOTH PRIOR POSITIONS BEFORE ANY VERDICT WAS
          FORMED. Its question (a) states, in terms: "Amendment 004's author said
          BUNDLED; the previous blind reader said SEPARATE_CHARGE_APPLIES." This
          reader could not un-know that, and did not pretend to.
        consequence_stated_plainly: >-
          THE ONE CELL THE CARD CALLS "THE MOST INFORMATIVE ONE IN THE BATCH" IS THE
          ONE CELL IN THIS COLUMN THAT IS NOT BLIND. My verdict agrees with -004's
          author and with -005's `the_spec_10_disagreement`, and disagrees with the
          previous blind reader's T-004 cell. Under an anchoring hypothesis, an
          anchored reader is at least as likely to land on the author's answer as on
          the reader's; this cell therefore CANNOT discriminate between "005's text
          decides it" and "this reader was told the answer". It must be discounted,
          and the batch cannot recover the blind measurement of this cell from this
          column.
        what_is_still_usable: >-
          The ROUTE is checkable independently of the anchor and is stated in full
          above and in the sealed file: it turns entirely on one sentence of B5-3
          that names partial-key sets, which is a sentence a reviewer can read and
          agree or disagree with without trusting this reader's blindness.
        remedy_named_not_performed: >-
          A genuinely blind -005 reading of SPEC-10 axis B is now OPEN AND
          UNATTEMPTED. It requires a card that does not restate the prior positions,
          dispatched to a session that has not seen this one. NOT TRIED, NOT
          SCREENED, NOT NEGATIVE.
      second_leak_from_the_same_card:
        what: >-
          The card also supplied the PRIOR COLUMNS' MARGINALS before classification:
          "5 undetermined of 13 informative cells" under 003, "0 under 004", and "7
          of 20 cells per text engaged neither text". Those are summary statistics of
          the very table the card forbade this reader to open.
        consequence: >-
          Partial anchoring on the prior columns' shape, in a design whose whole
          value is the absence of that anchoring. Disclosed rather than absorbed. It
          is recorded here as a DEFECT IN THE BATCH'S INSTRUMENTATION, not as a
          departure by this reader, who could not decline to read the card that
          dispatched it.
        mitigation_actually_available: >-
          The card told this reader "do not treat either as a target", and this
          reader's counts (3 undetermined of 12 informative, 8 NOT_ENGAGED of 20)
          match NEITHER prior column, which is weak evidence that the anchor did not
          bind on the aggregate. It is weak evidence and is labelled as such.

    b_RELOCATION:
      the_claim_tested: >-
        That 005 removes each failing term from the operative test rather than
        redefining it, so ambiguity cannot relocate into a term that no longer
        decides anything.
      verdict_on_the_claim: PARTIALLY SUPPORTED. THE REMOVALS ARE REAL AND AT LEAST THREE NEW DECISION-CRITICAL TERMS APPEAR, TWO OF WHICH LEFT CELLS UNDETERMINED ON THIS PANEL.
      removals_that_are_real:
        - >-
          A5-3 expressly de-tests three readings ("requires the result", "an
          algorithm not performing it would compute the same function", "some other
          specification would avoid it"). On this panel that removal does visible
          work: it is what makes SPEC-02 and SPEC-03 classify ALIKE on axis A.
        - >-
          B5-1 expressly de-tests "called production or called verification", "one
          loop or several", and completion-vs-early-abort. On this panel that removal
          does visible work at SPEC-05, where the single-loop framing is neutralised
          twice over (B5-1 and B5-2).
      relocations_found:
        - id: R1
          clause: B5-1 (and B5-4)
          new_term: '"the total cost the claim already charges for work performed PER MEMBER OF THAT SET"'
          the_defect: >-
            THE DENOMINATOR IS NOT FIXED. B5-4 calls the quantity a QUOTIENT ("the
            quotients in (ii)"), which invites total-charge-over-enumerated-set;
            B5-3's own quantifier ("each of whose members the attack subjects to at
            least one verifying test") gives charge-over-tested-set. Under CM-1
            element (b)'s AVERAGE-CASE convention these differ by a factor of two,
            because an exhaustive search over 2^(k-m) members is charged 2^(k-m-1).
          consequence_if_the_other_denominator_governs: >-
            SPEC-09, THE DEFINITIONAL EXHAUSTIVE-KEY-SEARCH REFERENCE ITSELF, flips
            to SEPARATE_CHARGE_APPLIES at one half AEU-k per enumerated member, and
            SPEC-10 flips with it. That is the proves-too-much failure the B-block's
            own control PT-1 exists to detect.
          why_the_authors_own_control_does_not_catch_it: >-
            READ AFTER SEALING. -005's control PT-1 asserts "the cost the reference
            charges for work performed per member of that set is ONE AEU-k" and
            reasons about the inclusive-vs-strict threshold. It never states which
            denominator produces that one, and never mentions that element (b)'s
            average-case convention makes the enumerated-set denominator give one
            half. PT-1's non-degeneracy argument is about the threshold's
            inclusiveness, which is a DIFFERENT axis of failure from the one named
            here. THIS IS A LIVE, UNADDRESSED GAP.
          status: >-
            This reader resolved it in favour of the tested-set denominator, on
            B5-3's quantifier, and recorded SPEC-09 and SPEC-10 axis B at MEDIUM
            rather than HIGH for exactly this reason.
        - id: R2
          clause: B5-3
          new_term: '"a set each of whose members DETERMINES A FULL KEY OF THE DECLARED KEY SIZE"'
          the_defect: >-
            A NEW DECISION-CRITICAL PREDICATE THAT THE OBJECT MUST SUPPLY AND THAT
            THIS PANEL'S OBJECTS DO NOT ALWAYS SUPPLY. SPEC-02 and SPEC-03 name a
            "candidate key guess" whose k_hat is a 4-byte quantity XORed into a
            4-byte column, and state no key size. On the full-key reading the set
            qualifies and its charged per-member work (4 S-box applications and 4
            byte-XORs, with 4 < S_k and 4 < X_k at every key size CM-1 tabulates) is
            below one AEU-k, giving SEPARATE_CHARGE_APPLIES; on the partial-key
            reading B5-3 excludes the set and no charge applies.
          measured_consequence: >-
            TWO CELLS UNDETERMINED UNDER 005 THAT THE PREVIOUS READER DECIDED UNDER
            004 (both SEPARATE_CHARGE_APPLIES). This is a relocation with a measured
            price, not a hypothetical one: 005 bought determinacy at SPEC-05 and
            SPEC-10 and spent it at SPEC-02 and SPEC-03.
          this_is_the_answer_the_card_asked_for: >-
            R2 IS A RELOCATION INTO ONE OF THE FOUR CLAUSES THE CARD NAMED (B5-3),
            AND IT IS THE VALUABLE RESULT THE CARD SAID A FOUND RELOCATION WOULD BE.
        - id: R3
          clause: A5-3 limb (3)
          new_term: '"its cost is counted NEITHER in N under ROUTE 1 NOR in X under ROUTE 3"'
          the_defect: >-
            THE EXCLUSION LIST OMITS "CHARGED DIRECTLY IN AEU-k". On the literal
            words, every S-box application, AddRoundKey byte-XOR, ShiftRows
            permutation, MixColumns transformation and key-schedule operation inside
            an evaluation charged as one AEU-k is counted in neither N nor X, is
            cipher-structural under A5-4, and is performed by the attack — so all
            three limbs hold and the bar fires against SPEC-09, the definitional
            reference itself, and against SPEC-04.
          status: >-
            NOT ADOPTED, BECAUSE IT IS A REDUCTIO. Reported as a defect in the
            clause. Its practical bite is limited to a claim that MIXES AEU-k-charged
            work with Route 3-converted work, which no panel item does and which no
            control in -005 that this reader saw exercises.
          in_a_named_clause: 'YES - A5-3, one of the four the card named.'
        - id: R4
          clause: A5-5 (NOT among the four the card named; reported anyway)
          new_term: '"a claim ... STATING A RUN-TIME INVENTORY ONLY, is INADMISSIBLE" / "a COUNT PER KIND over clause A5-4''s six kinds"'
