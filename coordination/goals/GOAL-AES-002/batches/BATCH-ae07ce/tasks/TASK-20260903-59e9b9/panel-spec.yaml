      - >-
        A path glob over
        coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/** returned
        batch.yaml, dispatch_queue.json, dispatch_plan.json, dispatch_plan.md,
        eight task-cards/ files and one claims/ file, and NO tasks/ directory:
        the amendment-005 authoring task of this batch (TASK-20260903-d3bef8)
        has produced no artifact, and no draft -005 text exists anywhere under
        this batch.
    scope_and_limits_of_that_evidence: >-
      STATED EXACTLY. These are WORKING-TREE observations made with a path-glob
      tool. This session has NO command-execution and NO git access, so it
      cannot and does not assert anything about the COMMITTED state of the
      repository, about other worktrees, or about branches it cannot see. The
