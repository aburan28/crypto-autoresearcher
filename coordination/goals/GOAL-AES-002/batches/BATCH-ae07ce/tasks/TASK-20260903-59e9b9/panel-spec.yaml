  # =====================================================================
  # HOW A READER USES THIS PANEL. SPECIFICATION OF THE MEASUREMENT ONLY.
  # =====================================================================
  classification_protocol:
    what_is_measured: >-
      Not whether any verdict is correct. Whether two conforming readers of the
      same rule text reach the SAME verdict, item by item, and whether that
      agreement rate differs between two texts.
    the_two_texts_each_item_is_classified_against:
      - text_id: T-004
        description: >-
          protocol-amendment-GOAL-AES-002-004's operative rule text, read
          jointly with CM-1 and -001/-002/-003 as "the frozen cost model as
          amended", exactly as -004's own `application` clause directs.
        operative_text_paths:
          - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-004.yaml
            (the_change.item_1_gap_a_definition_of_independent.resolving_text_verbatim;
            the_change.item_2_gap_b_the_bundling_test.resolving_text_verbatim)
      - text_id: T-003-SUPERSEDED
        description: >-
          THE NULL-OBJECT CONTROL. protocol-amendment-GOAL-AES-002-003's
          SUPERSEDED text, read as it stood BEFORE -004, i.e. with the three
          sentence fragments -004 names in `superseded_sentences` read on their
          own words and with no clause of -004 applied.
        operative_text_paths:
          - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-003.yaml
            (the_change.item_1_element_a_route_3.resolving_text_verbatim;
            the_change.item_2_elements_c_f_joint.resolving_text_verbatim)
    why_both_tables_are_published: >-
      Because a classification scheme that cannot separate -004 from
      superseded -003 has not been shown to discriminate. If the disagreement
      or indeterminacy rate is the same under both texts, -004 bought nothing
      and the improvement recorded to date is a property of who chose the worked
      examples, not of the text. BOTH TABLES ARE PUBLISHED WHATEVER THEY SHOW.
      A null-object control that is run and then not reported is worse than one
      never run.
    every_item_is_answered_on_both_axes:
      axis_A:
        name: ELEMENT (a) / ADMISSIBLE CONVERSION ROUTE 3 ADMISSIBILITY
        question: >-
          Under the text being read, is this specification's charged bytewise
          cost admissible under Route 1 + Route 3, and if so at what charging
          form?
        vocabulary_closed:
          - ADMISSIBLE_ROUTE_1_PLUS_3
          - INADMISSIBLE_UNADJUDICABLE
          - UNDETERMINED_BY_THIS_TEXT
          - NOT_ENGAGED_BY_THIS_SPECIFICATION
      axis_B:
        name: ELEMENT (c)/(f) / SEPARATE N-VERIFICATION-UNIT CHARGE
        question: >-
          Under the text being read, does element (f)'s separate
          N-verification-unit charge apply to this specification's candidate
          set, or is verification already bundled?
        vocabulary_closed:
          - SEPARATE_CHARGE_APPLIES
          - BUNDLED_NO_SEPARATE_CHARGE
          - UNDETERMINED_BY_THIS_TEXT
          - NOT_ENGAGED_BY_THIS_SPECIFICATION
      why_both_axes_are_asked_of_every_item: >-
        DELIBERATE, AND IT IS PART OF THE BLINDNESS. Asking only the axis an
        item was drawn to probe would tell the reader which rule block the panel
        author thinks governs it, which is a hint about the verdict. Every item
        is therefore put to both axes, and NOT_ENGAGED_BY_THIS_SPECIFICATION is
        a first-class answer that carries no penalty.
    required_fields_per_item_per_text:
      - verdict_axis_A (from the closed vocabulary above)
      - verdict_axis_B (from the closed vocabulary above)
      - charging_form_if_admissible (the symbolic form only; NO NUMERIC VALUE
        IS TO BE COMPUTED, ASSIGNED OR ESTIMATED FOR ANY N, X, D, G, M OR
        SURVIVOR COUNT ANYWHERE IN THIS PANEL'S OUTPUT)
      - clauses_relied_on (exact clause identifiers of the text being read)
      - one_sentence_reason
      - confidence (HIGH | MEDIUM | LOW), stated per item, never aggregated
        into a score
    reader_blindness_obligation:
      binding_on: any task that classifies this panel
      obligations:
        - >-
          DO NOT READ the amendments' own worked examples, checks or
          limitations blocks before recording a verdict for every item. Read
          ONLY the two `resolving_text_verbatim` blocks named above, plus CM-1's
          elements as they stand. RC-6's requirement is a reader "WITHOUT having
          seen the amendment's own worked examples"; that is the whole point of
          the control.
        - >-
          DO NOT OPEN the provenance sources cited under each item below
          (RT-20260901-3ad5d2's report, and the surrounding prose of the
          amendment fields the derived items quote) before recording a verdict
          for every item. Those sources contain the analysis this panel exists
          to test, and reading them first converts the measurement into a
          recall exercise. The citations are present because provenance is
          mandatory and verbatim quotation must be auditable, NOT as reading
          material for the classifier.
        - >-
          CLASSIFY IN THE FROZEN ORDER SPEC-01 THROUGH SPEC-10, complete the
          T-004 table, and only then begin the T-003-SUPERSEDED table.
        - >-
          ATTEST EXPLICITLY, in the classification deliverable, to each of the
          three obligations above, and disclose any departure as a procedure
          deviation rather than absorbing it silently.
        - >-
          RECORD UNDETERMINED_BY_THIS_TEXT HONESTLY AND WITHOUT PENALTY. An
          indeterminate rule is exactly what this instrument is built to detect,
          and a reader who guesses to avoid an empty cell destroys the
          measurement. `undetermined` is a valid verdict
          (DEC-20260903-7548c0 claim_boundaries).
    what_a_reader_may_not_do:
      - >-
        MAY NOT assert anything about AES at any round count, state any margin,
        or make any comparison against any published state of the art, in either
        direction.
      - >-
        MAY NOT edit this file. A defect found in a panel item is reported in
        the classification deliverable and repaired, if at all, by a new panel
        record.
      - >-
        MAY NOT treat its own verdicts as evidence about the cipher. The claim
        ceiling of anything this panel produces is SPECIFICATION RESULT ONLY.
    correlated_pair_limitation_binding_on_any_reader: >-
      DISCLOSED IN ADVANCE SO IT CANNOT BE OMITTED AFTERWARDS. If a second
      reader of the same model family classifies this panel, the two readings
      are ONE DRAW FROM A CORRELATED PAIR and must be reported as such, never as
      two independent confirmations. RC-6 states the residual value plainly and
      it is the reason this panel is worth running anyway: even a SINGLE reader
      against a PRE-FROZEN panel removes the selection effect that currently
      dominates — the author choosing the examples the rule handles.

  # =====================================================================
  # QUOTATION DISCIPLINE. STATED BEFORE THE ITEMS SO EVERY EXCISION IS
  # AUDITABLE AGAINST THE COMMITTED SOURCE.
  # =====================================================================
  quotation_discipline:
    rule_applied_uniformly: >-
      Each item's `specification_verbatim` is a VERBATIM CONTIGUOUS SPAN of its
      named source field. Nothing is paraphrased, reconstructed from memory,
      reworded, corrected, abridged internally, or reflowed in substance; the
      source fields are YAML folded scalars, so line breaks are not part of
      their string value and re-wrapping preserves the string exactly. WHAT IS
      EXCISED, ALWAYS AND ONLY, IS THE TRAILING RULE-APPLICATION AND VERDICT
      ANALYSIS: the span quoted ends immediately before the first sentence that
      applies a clause, evaluates a disclosure, or states a reader's verdict.
      Every excision is declared per item with the exact sentinel at which it
      begins.
    why_excision_is_required_and_is_not_abridgement: >-
      The two duties this task carries are in direct tension and BOTH are
      binding: quote the four counterexamples verbatim, and carry nothing that
      names or hints at a verdict. RT-20260901-3ad5d2's
      `worked_counterexample` fields contain the CONSTRUCTION and then, in the
      same field, the two readers' opposite verdicts. Quoting the whole field
      would hand the classifier the answer and destroy the instrument; quoting
      a summary would be the paraphrase this task is forbidden to produce. The
      resolution is a declared, uniform, verbatim PREFIX with the verdict
      analysis excised and the cut point named, so a reviewer can reconstruct
      exactly what was dropped by opening the cited field.
    what_is_never_excised: >-
      Nothing internal to a construction: no stipulated parameter, no operation,
      no charged quantity, no data requirement, and no disclosure the submitter
      is stated to make. If a construction's specification is incomplete in the
      source, it is quoted incomplete and no gap is filled by this task.
    source_state_caveat: >-
      DISCLOSED WITH ITS CAP. Every quotation below was taken from the file at
      the declared repository path as it stands in this session's working tree.
      This session has NO git access and therefore CANNOT verify that those
      bytes are the COMMITTED bytes. RT-20260901-3ad5d2 records its own
      snapshot binding (commit ee80ce45691a791638a614c441d0904775cea142) and
      -004 records that CM-1's and -003's bytes are unedited; this task relies
      on those recorded statements and independently confirms none of them. The
      archival task that commits this panel owes the check that each quoted
      span matches the committed source byte for byte.

  # =====================================================================
  # THE PANEL. TEN ITEMS, FROZEN IN THIS ORDER.
  # =====================================================================
  panel_size: 10
  items:

    - spec_id: SPEC-01
      label: ATTACK Q
      shape_family: fixed-byte-position-relabelling-of-received-data
      source:
        record: RT-20260901-3ad5d2
        path: coordination/goals/GOAL-AES-002/batches/BATCH-241d37/reviews/TASK-20260901-3ad5d2/red-team-report.yaml
        field: red_team_report.objections[0].worked_counterexample
        quotation_mode: verbatim_contiguous_prefix
        verbatim_span_begins: "ATTACK Q (hypothetical, specification-level,"
        verbatim_span_ends: "no MixColumns, no table access, no other bytewise operation."
        excised_spans:
          - begins_at_sentinel: "The submitter's A-4 disclosure is"
            reason: >-
              Evaluative sentence about a disclosure duty; its inner quoted
              disclosure string is preserved verbatim below as
              `submitter_disclosure_verbatim`, which is specification content.
          - begins_at_sentinel: "READER 1 applies A-3(i)"
            reason: rule application and two opposite verdicts.
      specification_verbatim: >-
        ATTACK Q (hypothetical, specification-level, asserted of no real cipher
        and of no round count). Element (d) data: D known plaintext/ciphertext
        pairs. For each of G guesses of a 4-byte subset of a final round key:
        for each of the D ciphertexts, (1) SELECT the four ciphertext bytes at
        positions {0, 7, 10, 13} — a fixed, data-independent set that is exactly
        one column's preimage under the inverse of the linear byte-position
        relabelling; (2) XOR the four guessed key bytes into them (4*D*G
        AddRoundKey byte-XORs, counted in X); (3) apply the inverse S-box to the
        four results (4*D*G S-box applications, counted in N); (4) evaluate a
        statistical predicate on the four output bytes. No MixColumns, no table
        access, no other bytewise operation.
      submitter_disclosure_verbatim: >-
        N = 4DG, X = 4DG, plus one fixed data-independent byte-position
        selection applied by indexing alone; implementation assumed plain
        byte-oriented
      submitter_disclosure_note: >-
        Quoted verbatim as the submitter's own stated operation inventory. It is
        carried because a Route 3 claim's disclosure is part of what a reader
        classifies, not because this task endorses or evaluates it. This task
        makes NO statement about whether it is complete.

    - spec_id: SPEC-02
      label: ATTACK P
      shape_family: linear-layer-output-consumed
      pair_note: >-
        SPEC-02 and SPEC-03 are the two members of the single counterexample
        RT-20260901-3ad5d2 records as "the P/P' pair". They are listed as two
        panel items because each must receive its own verdict — a pair whose two
        members are classified as one item cannot show whether they are
        classified alike, which is the only thing a pair can measure. Both are
        quoted from the same source field. NO CLAIM IS MADE HERE ABOUT HOW
        EITHER SHOULD BE CLASSIFIED OR ABOUT ANY RELATION BETWEEN THEIR VERDICTS.
      source:
        record: RT-20260901-3ad5d2
        path: coordination/goals/GOAL-AES-002/batches/BATCH-241d37/reviews/TASK-20260901-3ad5d2/red-team-report.yaml
        field: red_team_report.objections[1].worked_counterexample
        quotation_mode: verbatim_contiguous_prefix
        verbatim_span_begins: "ATTACK P (hypothetical, specification-level,"
        verbatim_span_ends: "ACCEPT iff m equals a single fixed 4-byte constant s."
        excised_spans:
          - begins_at_sentinel: "ATTACK P' :"
            reason: >-
              Not excised from the panel — it is quoted as SPEC-03. Recorded
              here only so the span boundary between the two items is explicit.
          - begins_at_sentinel: "FACTS: P and P' compute the SAME function"
            reason: >-
              States the relation between the two constructions and applies
              clause A-3(ii) to one of them. Both are exactly what the panel
              measures whether a reader finds unaided, so carrying them would
              prime the verdict.
          - begins_at_sentinel: "READER 1 (intensional half of A-2)"
            reason: rule application and two opposite verdicts.
      specification_verbatim: >-
        ATTACK P (hypothetical, specification-level, asserted of no real cipher
        and of no round count). Per candidate key guess and per element (d)
        block: compute the 4-byte column a = InvSubBytes(C_sel XOR k_hat) — 4
        S-box applications into N, 4 AddRoundKey byte-XORs into X — then compute
        m = MixColumns(a) and ACCEPT iff m equals a single fixed 4-byte constant
        s.

    - spec_id: SPEC-03
      label: ATTACK P'
      shape_family: linear-layer-output-not-consumed
      pair_note: >-
        The second member of the P/P' pair; see SPEC-02's pair_note. SPEC-03's
        source text opens "identical up to and including a", which refers to
        SPEC-02's construction; the two are therefore read together, in the
        frozen order, and neither is complete alone.
      source:
        record: RT-20260901-3ad5d2
        path: coordination/goals/GOAL-AES-002/batches/BATCH-241d37/reviews/TASK-20260901-3ad5d2/red-team-report.yaml
        field: red_team_report.objections[1].worked_counterexample
        quotation_mode: verbatim_contiguous_span
        verbatim_span_begins: "ATTACK P' : identical up to and including a;"
        verbatim_span_ends: "is a constant of the specification, not a table."
        excised_spans:
          - begins_at_sentinel: "FACTS: P and P' compute the SAME function"
            reason: as recorded on SPEC-02.
          - begins_at_sentinel: "READER 1 (intensional half of A-2)"
            reason: rule application and two opposite verdicts.
      specification_verbatim: >-
        ATTACK P' : identical up to and including a; ACCEPT iff a equals the
        single fixed 4-byte constant s' := MixColumns^{-1}(s), computed ONCE at
        specification time. MixColumns is a bijection on 4-byte columns, so s'
        exists, is unique, and is a constant of the specification, not a table.

    - spec_id: SPEC-04
      label: ATTACK S
      shape_family: data-dependent-early-aborted-evaluation
      source:
        record: RT-20260901-3ad5d2
        path: coordination/goals/GOAL-AES-002/batches/BATCH-241d37/reviews/TASK-20260901-3ad5d2/red-team-report.yaml
        field: red_team_report.objections[2].worked_counterexample
        quotation_mode: verbatim_contiguous_prefix
        verbatim_span_begins: "ATTACK S (hypothetical, specification-level,"
        verbatim_span_ends: "the submitter charges about N/256 AEU-k in total."
        excised_spans:
          - begins_at_sentinel: "READER 1: the charged production work's"
            reason: >-
              rule application, two opposite verdicts, and an explicit
              statement of the factor between them.
      specification_verbatim: >-
        ATTACK S (hypothetical, specification-level, asserted of no real cipher
        and of no round count). Element (d): at least one known pair (P1, C1).
        Production: for each of N candidate keys k_hat drawn from a precomputed
        structured pool, "EVALUATE AES-k(P1) UNDER k_hat AND COMPARE THE RESULT
        WITH C1; retain k_hat iff equal." Implementation, and the cost the
        submitter charges: the evaluation is interleaved with a stored partial-state
        match so that it ABORTS as soon as one intermediate byte disagrees with a
        stored value, which happens with probability 255/256 at the first
        checkpoint. Expected charged production work per candidate is therefore
        about 1/256 AEU-k, and the submitter charges about N/256 AEU-k in total.

    - spec_id: SPEC-05
      label: ATTACK H
      shape_family: single-loop-hybrid-with-no-syntactic-stage-boundary
      source:
        record: RT-20260901-3ad5d2
        path: coordination/goals/GOAL-AES-002/batches/BATCH-241d37/reviews/TASK-20260901-3ad5d2/red-team-report.yaml
        field: red_team_report.objections[3].worked_counterexample
        quotation_mode: verbatim_contiguous_prefix
        verbatim_span_begins: "ATTACK H (hypothetical, specification-level,"
        verbatim_span_ends: "so about M*2^-t candidates reach the encryption."
        excised_spans:
          - begins_at_sentinel: "READER 1 (one stage):"
            reason: rule application and two opposite verdicts.
      specification_verbatim: >-
        ATTACK H (hypothetical, specification-level, asserted of no real cipher
        and of no round count), stated as ONE loop with no stage boundary
        anywhere in its text: "For each of the M candidate keys in the
        enumeration: evaluate the algebraic constraint T on the candidate; if T
        fails, discard and continue; if T holds, evaluate AES-k(P1) under the
        candidate and compare with C1, returning on a match." Let T hold with
        probability 2^-t, so about M*2^-t candidates reach the encryption.

    - spec_id: SPEC-06
      label: FUSED TABLE-DRIVEN IMPLEMENTATION
      shape_family: implementation-technique-fused
      source:
        record: protocol-amendment-GOAL-AES-002-004
        path: coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-004.yaml
        field: protocol_amendment.ambiguities_resolved[AMB-5].what_was_ambiguous
        quotation_mode: verbatim_excerpt_with_declared_frame
        verbatim_span_begins: "A FUSED TABLE-DRIVEN (T-table) implementation,"
        verbatim_span_ends: "not a contrived edge case."
        excised_spans:
          - begins_at_sentinel: "is classifiable oppositely by two conforming readers"
            reason: >-
              names both candidate verdicts explicitly. The two sentences kept
              are the construction and a neutral statement of how ordinary the
              construction is.
        declared_frame_added_by_this_task: >-
          A Route 3 cost claim is submitted for an attack whose bytewise work is
          realised as follows.
        frame_disclosure: >-
          THE FRAME IS THIS TASK'S OWN WORDS AND IS DECLARED AS SUCH. It carries
          only the fact that the item is a Route 3 claim, which is what makes it
          classifiable at all. It states no operation, no count, no consumption
          relation and no verdict.
      specification_verbatim: >-
        A FUSED TABLE-DRIVEN (T-table) implementation, in which one memory
        access performs a SubBytes substitution, its ShiftRows relabelling and
        its contribution to MixColumns simultaneously. T-table implementations
        are the ordinary fast way to implement AES, not a contrived edge case.

    - spec_id: SPEC-07
      label: IMPLEMENTATIONS PERFORMING NO MEMORY ACCESS
      shape_family: implementation-technique-unfused
      source:
        record: protocol-amendment-GOAL-AES-002-004
        path: coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-004.yaml
        field: >-
          protocol_amendment.the_change.item_1_gap_a_definition_of_independent.why_this_and_not_the_red_teams_own_candidate_rule
        secondary_source_for_the_same_shape:
          record: CM-1
          path: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml
          field: >-
            element_a_unit.inadmissible_until_measured_stated_so_it_is_not_improvised
          verbatim_span: >-
            A T-table implementation, a bitsliced implementation and an AES-NI
            implementation do not agree on how many XORs or table accesses one
            encryption performs
        quotation_mode: verbatim_excerpt_with_declared_frame
        verbatim_span_begins: "A bitsliced implementation performs NO memory access at all"
        verbatim_span_ends: "has no referent for either"
        excised_spans:
          - begins_at_sentinel: "and on its plain wording every accompanying operation"
            reason: >-
              states a verdict. It is moreover a verdict under a REJECTED
              candidate rule that is not part of the text being classified, so
              carrying it would both hint and mislead.
          - begins_at_sentinel: "(2) IT DECIDES ADMISSIBILITY AT THE IMPLEMENTATION LEVEL"
            reason: argument about a rejected candidate rule; not specification content.
