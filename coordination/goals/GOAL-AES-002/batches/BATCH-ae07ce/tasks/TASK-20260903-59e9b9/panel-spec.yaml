    exactly as RT-20260901-3ad5d2 composed its own label from its task token
    and disclosed that it did so.
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-ae07ce
  authored_by_task: TASK-20260903-59e9b9
  authored_by_role: coordinator
  authored_at: '2026-09-04'
  authored_at_basis: >-
    THE DATE THIS SESSION'S OWN RUNTIME CONTEXT STATES ("Today's date is
    2026-09-04"). NO CLOCK WAS READ: this session's tool surface carries no
    command-execution tool, so no epoch, no UTC timestamp and no elapsed
    measurement is available to it. See freeze-receipt.json
    `instrumentation_gap` for what that costs and how it is charged. NOTE THE
    DIVERGENCE FROM THE BATCH RECORD, STATED RATHER THAN SMOOTHED: BATCH-ae07ce
    and DEC-20260903-7548c0 are dated 2026-09-03; this task is executed on
    2026-09-04. Nothing is backdated to match them.

  what_this_file_is: >-
    A FROZEN PANEL OF TEN HYPOTHETICAL ATTACK SPECIFICATIONS, and nothing else.
    It exists to make measurable the operative claim of
    protocol-amendment-GOAL-AES-002-003 and -004 — that two conforming readers
    reach the same verdict — which RT-20260901-3ad5d2 required_controls RC-6
    records as never once having been measured. THE PANEL ITSELF ADJUDICATES
    NOTHING, REPAIRS NOTHING, AND CLASSIFIES NOTHING. It carries no verdict, no
    expected outcome, no rule application, no pass/fail annotation and no
    difficulty ranking, by construction and by the completion gate of the task
    that wrote it.
  what_this_file_is_not:
    - >-
      IT IS NOT A COST CLAIM, A MARGIN, OR AN ASSERTION ABOUT AES AT ANY ROUND
      COUNT. Every specification below is EXPLICITLY HYPOTHETICAL and is
      asserted of no real cipher, no real implementation and no round count.
      Every numeral appearing in a specification (D, G, N, M, 2^-t, 255/256,
      1/256, positions {0, 7, 10, 13}) is a stipulated parameter of a
      hypothetical construction, never an observation and never a measurement.
    - >-
      IT IS NOT AN AMENDMENT, and it changes no rule text. CM-1's committed
      bytes and the committed bytes of protocol-amendment-GOAL-AES-002-001,
      -002, -003 and -004 are unedited by this task and by anything this file
      specifies.
    - >-
      IT IS NOT AN APPROVAL, a status change, a hypothesis transition, a
      knowledge promotion, a budget act or a scope change.
    - >-
      IT IS NOT EVIDENCE. It is an instrument. What it can produce is a pair of
      verdict tables authored by a later, separately-dispatched reader.

  # =====================================================================
  # THE ORDERING CLAIM. THIS IS THE SUBSTANCE OF THE FREEZE, NOT A
  # FORMALITY: A PANEL WRITTEN AFTER THE TEXT IT ADJUDICATES IS WORTHLESS
  # AS A BLIND CONTROL.
  # =====================================================================
  frozen_before:
    claim: >-
      NO protocol-amendment-GOAL-AES-002-005 TEXT EXISTED, IN ANY FORM, AT THE
      TIME THIS FILE WAS WRITTEN, AND NO PART OF THIS PANEL WAS SELECTED WITH
      SIGHT OF ANY -005 TEXT.
    evidence_observed_by_this_session:
