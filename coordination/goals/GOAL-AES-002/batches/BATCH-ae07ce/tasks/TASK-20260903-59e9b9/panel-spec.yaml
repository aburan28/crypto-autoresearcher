          Provenance is mandatory: without exact record, path and field, the
          verbatim quotation this task was required to perform cannot be
          verified by anyone, and an unverifiable quotation is indistinguishable
          from a reconstruction. Suppressing the citation would trade an
          auditable, procedurally-mitigated leak for an unauditable claim.
        mitigation: >-
          `classification_protocol.reader_blindness_obligation` forbids opening
          the cited sources before every item is classified and requires an
          explicit attestation either way. The mitigation is procedural and its
