adjudication_panel:
  # =====================================================================
  # RC-6 PRE-REGISTERED BLIND ADJUDICATION PANEL.
  # FROZEN. WRITE-ONCE. NOT EDITED AFTER THIS FILE IS WRITTEN.
  # A change is a NEW panel record under a new identifier, never an edit
  # to this one (AGENTS.md core rule 4).
  # =====================================================================
  panel_id: PANEL-BATCH-ae07ce-TASK-20260903-59e9b9
  panel_id_note: >-
    NOT MINTED BY tools/allocate_id.py, AND NO NEW TOKEN IS INVENTED. "PANEL-*"
    is not an allocate_id record type; this label is composed from two
    identifiers that were already minted and are already committed in this
