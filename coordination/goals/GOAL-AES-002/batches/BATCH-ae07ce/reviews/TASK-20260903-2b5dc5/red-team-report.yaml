  # =====================================================================
  # OBJECTIONS. EACH NAMES ITS TARGET, ITS EVIDENCE BY PATH AND FIELD, WHAT
  # WOULD REFUTE IT, AND WHETHER IT IS NEW TO THIS REVIEW.
  # =====================================================================
  objections:

    - id: OBJ-RT-1
      severity: HIGH
      joint: the panel as a control instrument, forward
      title: >-
        THE PANEL IS A TRAINING SET FOR AMENDMENT 005 AND IS BEING RE-USED AS
        ITS TEST SET. RC-6's FREEZE REMOVES ITEM SELECTION, NOT TEXT FITTING.
      new_to_this_review: true
      the_objection: >-
        The freeze establishes that the ITEMS were not chosen to suit the text.
        It establishes nothing about the converse, and the converse is what
        happened here. On committed timestamps this session read directly, the
        T-004/T-003 verdict tables were committed at 16:09:58Z and the
        amendment-005 text at 16:44:44Z. -005's author read the panel, read the
        T-004 column, and wrote the rule. Its own `ambiguities_addressed`
        sources AMB-11 to "VAL-20260904-373afa defects_found DEF-004-3,
        evidenced by PVF-1", which IS a panel cell (SPEC-10 axis B), and it
        carries a top-level block `the_spec_10_disagreement` whose
        `how_005_resolves_it` explains how clause B5-3 makes that cell come out
        BUNDLED. Zero of the ten items is held out for -005. The -005 column is
        therefore an IN-SAMPLE determinacy report and cannot measure whether the
        repair generalises to a shape its author had not already seen a verdict
        for.
      the_internal_contradiction_this_exposes: >-
        `how_the_frozen_panel_was_used_and_how_it_was_not.how_it_was_not_used`
        asserts "NO CLAUSE BELOW WAS CHOSEN, WORDED OR ORDERED TO MAKE ANY
        PANEL CELL COME OUT A PARTICULAR WAY". That sentence and the
        `the_spec_10_disagreement` block are in the same file. This review does
        not and cannot establish the author's intent; what is checkable from
        outside is that the record asserts both, and that the second is a
        clause-by-clause account of how one named panel cell is made to come
        out one way.
      why_it_is_not_answered_by_the_batch_s_own_caveats: >-
        F-3 and the column's `the_uncomfortable_reading_stated_first` bound the
        MEASURED numbers. They do not bound the instrument's remaining power. An
        in-sample column that came out WORSE than -004 is more informative than
        one that came out better, but neither reading survives the panel having
        been burned.
      what_would_refute_it: >-
        A held-out panel: a second set of specifications frozen before -005 and
        withheld from -005's author, or any evidence that -005's clauses were
        fixed before the T-004 column existed. Neither exists in the snapshot.
      forward_consequence_that_must_travel: >-
        A -006 written after reading the -005 column inherits this defect
        exactly. The instrument's power against each successive amendment is
        strictly decreasing and the campaign has no held-out reserve.

    - id: OBJ-RT-2
      severity: HIGH
      joint: panel blindness — do the specs smuggle 004's answers
      title: >-
        THE EXCISION APPARATUS IS THE LEAK CHANNEL, AND ITS BLAST RADIUS IS ALL
        THREE COLUMNS, NOT THE ONE CELL THE ARCHIVE RECEIPT RECORDS.
      new_to_this_review: partially — F-2's `second_order_note` records the SPEC-08 instance only
      the_objection: >-
        The panel's `excised_spans` name each cut point by QUOTING the first
        words of the removed text and by stating a reason. Four of those quoted
        sentinels and reasons carry precisely the information the excision was
        performed to withhold, and every classifier of this panel read them,
        because they sit inside the item they annotate.
      the_four_instances_quoted_from_the_panel_verbatim:
        - spec: SPEC-08
          sentinel_as_printed_in_the_panel: "is OUTSIDE the S-box route and triggers inadmissibility"
          what_it_discloses: >-
            THE VERDICT ITSELF, in words, adjacent to the item's specification.
        - spec: SPEC-02 and SPEC-03
          sentinel_as_printed_in_the_panel: "FACTS: P and P' compute the SAME function"
          what_it_discloses: >-
            THE DECISIVE EXTENSIONAL FACT ABOUT THE PAIR. The panel's own reason
            for excising it says the fact is "exactly what the panel measures
            whether a reader finds unaided, so carrying them would prime the
            verdict" — and the sentinel then carries it, verbatim, in the same
            block.
        - spec: SPEC-10
          reason_as_printed_in_the_panel: "applies clause B-1's antecedent and then states the verdict explicitly"
          what_it_discloses: >-
            THE GOVERNING CLAUSE ON THE VERY AXIS BEING ASKED. Axis B asks
            whether element (f)'s separate charge applies; the reader is told
            that B-1's antecedent is what applies to this item.
        - spec: SPEC-01
          sentinel_as_printed_in_the_panel: "The submitter's A-4 disclosure is"
          what_it_discloses: >-
            That clause A-4 is engaged by this item, and that the source
            evaluates its disclosure.
      the_systematic_channel_beyond_the_four_instances: >-
        The excision REASONS partition the panel by historical disagreement
        status. SPEC-01, SPEC-02/03, SPEC-04 and SPEC-05 each carry the reason
        "rule application and two opposite verdicts"; SPEC-06 carries "names
        both candidate verdicts explicitly"; SPEC-07 to SPEC-10 carry
        single-verdict reasons. A reader is thereby told, item by item, whether
        two prior readers split on it. That is the single most verdict-adjacent
        fact the instrument could carry and it is carried for all ten items.
      why_the_panel_s_own_self_check_does_not_answer_it: >-
        `blindness_self_check` searched its own text for the stems
        "admissib / unadjudicab / bundl / separate charge / pass", FOUND the
        hits in the SPEC-07 and SPEC-08 sentinels, and dismissed them on the
        ground that they are "NOT AN ITEM'S SPECIFICATION". That is a LOCATION
        argument answering an INFORMATION question. Information the reader can
        read is information the reader has, whatever field it sits in.
      the_consequence_that_nobody_records: >-
        The single result the T-005 column calls "the single strongest result in
        this column" is that the P/P' pair AGREES under -005. That reading was
        produced by a session whose `open_order_recorded.before_sealing` lists
        "panel-spec.yaml (in full)" — i.e. by a reader who had been told, in the
        instrument, that P and P' compute the same function. The pair result is
        contaminated at the instrument level, in all three columns, and no
        record in this batch discounts it on that ground.
      what_would_refute_it: >-
        A classifier that recorded, before sealing, that it did not read the
        `source.excised_spans` blocks. Neither column records that; both record
        reading the panel file, and the T-004 column's reading rules do not
        mention the sentinels at all.
      not_repaired_here: >-
        The panel is a committed record and is immutable. No edit is made or
        proposed. A successor instrument should carry excision cut points as
        OPAQUE OFFSETS or hashes into the source, never as quoted text, and
        should state the reason in a form that names no clause and no verdict
        status.

    - id: OBJ-RT-3
      severity: MEDIUM
      joint: panel blindness — ordering and composition
      title: >-
        THE PANEL'S FROZEN ORDER IS BLOCKED BY SOURCE, AND ITS OWN LEAK-2
        MITIGATION ASSERTS THE OPPOSITE.
      new_to_this_review: true
      the_objection: >-
        SPEC-01 to SPEC-05 are all drawn from RT-20260901-3ad5d2; SPEC-06 to
        SPEC-10 are all drawn from protocol-amendment-GOAL-AES-002-004 and
        CM-1. The order is a clean two-block partition by source. LEAK-2's
        mitigation states, at panel-spec.yaml line 654, that the derived items
        "are interleaved by construction shape rather than by source". They are
        not interleaved by anything; they are blocked by source, and the block
        boundary coincides exactly with the disagreement-status boundary
        described in OBJ-RT-2. A reader who notices the boundary has been told
        where the known-contested items stop.
      second_defect_in_the_same_field: >-
        The same mitigation says "The four derived items"; there are five
        (SPEC-06, -07, -08, -09, -10). LEAK-2's own leak text says "Five items
        descend from a red-team report", so the two halves of the same block
        do not sum to the panel size. Minor in itself, material because it is
        the blindness mitigation.
      what_would_refute_it: >-
        Nothing in the snapshot. The order is on the file's face and this
        session read it in full.

    - id: OBJ-RT-4
      severity: MEDIUM_HIGH
      joint: the classification method — can a reader disagree for reasons unrelated to the amendment texts
      title: >-
        COLUMN 1'S PRE-REGISTRATION IS UNVERIFIABLE BY CONSTRUCTION, AND IT IS
        THE COLUMN CARRYING THE NULL-OBJECT CONTROL.
      new_to_this_review: true
      the_objection: >-
        The T-004/T-003 column's ordering receipt was written "to this session's
        ephemeral scratchpad, NOT to the repository", and the record states
        "THE FILE IS EPHEMERAL AND A LATER READER CANNOT OPEN IT: what survives
        is the digest". A commitment whose preimage is destroyed binds nothing a
        reviewer can check: the digest d79e5129...1fce is consistent with any
        content whatsoever as far as any later reader can establish, and the
        accompanying claim "40 of 40 triples are identical, with zero
        differences" is self-attested with no verifiable object behind it. THIS
        REVIEW DOES NOT ALLEGE FABRICATION AND HAS NO EVIDENCE OF ANY; it states
        that the batch's null-object control rests on evidence that is
        unfalsifiable in principle.
      the_asymmetry_that_makes_it_a_defect_rather_than_a_limitation: >-
        The T-005 column solved the same problem properly forty minutes later:
        it wrote the sealed pre-read INTO write_scope and had the Coordinator
        commit it in flight, and this session recomputed both digests and
        confirmed the match against commit 74eec580b. So the batch demonstrates
        that the correct discipline was available, cheap, and compatible with
        the scope rules — and the column that most needed it did not get it.
      the_stated_reason_does_not_hold: >-
        Column 1 declined to write a second file because "an undeclared second
        artifact in write_scope would be a scope expansion". The preimage did
        not need a second file: forty verdict/determinacy/confidence triples
        could have been carried as a nested block INSIDE the single declared
        deliverable, hashed, and then compared. The constraint did not force the
        destruction of the evidence.
      what_would_refute_it: >-
        Production of the preimage. It is gone by the producer's own statement.

    - id: OBJ-RT-5
      severity: MEDIUM_HIGH
      joint: the classification method — does it measure the reader
      title: >-
        COLUMN 1 CLASSIFIED T-004 FIRST AND T-003 SECOND WITH ONE READER, AND
        SEQUENTIAL CARRYOVER IS A FOURTH INFLATION SOURCE THE RECORD DOES NOT
        NAME.
      new_to_this_review: true
      the_objection: >-
        The panel's `reader_blindness_obligation` MANDATES "complete the T-004
        table, and only then begin the T-003-SUPERSEDED table", and the reader
        attests it complied. The consequence is that every T-003 verdict was
        formed by a reader who had just applied clauses A-1, A-2, A-3 and
        B-1 to B-4. Knowing which words -004 ADDED is the cheapest possible
        route to recording UNDETERMINED wherever -003 lacks them — which is
        exactly the pattern the T-003 column shows: the five undetermined cells
        are SPEC-01.A, SPEC-03.A, SPEC-06.A, SPEC-07.A and SPEC-05.B, and the
        column's own `where_the_gain_is_concentrated` states that every one of
        them "traces to one of three phrases -004 replaces".
      why_it_is_not_covered_by_the_three_declared_inflations: >-
        INFL-1 is panel composition, INFL-2 is reader/author model correlation,
        INFL-3 is determinacy-as-proxy-for-agreement. None of the three is order
        of presentation, and order of presentation is the one that acts directly
        and only on the null-object column — i.e. on the contrast that carries
        the batch's headline result.
      the_deeper_form_of_the_same_objection: >-
        The measured quantity is ONE reader's self-reported determinacy. The
        claim under test is that TWO conforming readers agree. The column says
        so itself (INFL-3; NOTRUN-3; OU-005-5), which is why this is stated as a
        construct-substitution objection rather than a discovery: no cell in any
        of the three columns is an agreement measurement. The one genuine
        two-reader datum in the entire batch is PVF-1 — the blind reader against
        -004's author on SPEC-10 axis B — and it DISAGREED. n=1, correlated
        pair, and it went against the amendment.
      what_would_refute_it: >-
        A counterbalanced re-run: the same panel classified against T-003 FIRST
        by a session that has not seen -004's clauses. If the five
        indeterminacies survive order reversal, this objection is dead. See
        required control RC-RT-1.

    - id: OBJ-RT-6
      severity: HIGH
      joint: amendment 005 — does it relocate ambiguity a third time
      title: >-
        A5-3's THIRD LIMB IS VACUOUSLY TRUE FOR THE TWO OPERATION KINDS ROUTE
        3's BAR EXISTS FOR, SO THE BAR COLLAPSES TO THE NEW WORD "PERFORMS".
      new_to_this_review: true
      the_objection: >-
        Clause A5-3 fires iff all three of (1) cipher-structural under A5-4,
        (2) the attack itself performs it, and (3) its cost is counted NEITHER
        in N under Route 1 NOR in X under Route 3. This session read CM-1
        element (a) directly: Route 1 converts "N S-box applications" and
        nothing else, and Route 3 adds the AddRoundKey byte-XOR term X/X_k.
        NOTHING IN EITHER ROUTE COUNTS A SHIFTROWS PERMUTATION, A MIXCOLUMNS
        TRANSFORMATION, A ROTWORD OR AN RCON XOR. Therefore, for A5-4 kinds (2)
        and (3) and for two of the three sub-operations of kind (5), limb (3)
        CANNOT BE FALSE. Kind (6) is routed away from A5-3 entirely by A5-1, as
        the T-005 column's own D1 establishes.
      the_consequence: >-
        Of A5-4's six enumerated kinds, limb (3) is a live discriminator for
        exactly two — (1) S-box applications and (4) AddRoundKey byte-XORs. For
        ShiftRows and MixColumns, which are the two operations -003's Route 3 bar
        was written about in its own words ("no independent ShiftRows/MixColumns
        computation"), the three-limb conjunction reduces to limbs (1) and (2),
        and limb (1) is settled by the closed enumeration. The whole test is
        then limb (2): DOES THE ATTACK PERFORM IT. That is a new undefined
        predicate carrying the entire weight of the bar on the cases the bar
        exists for.
      why_this_is_relocation_on_005_s_own_definition: >-
        -005's design commitment is that "the term each earlier text failed to
        determine has been REMOVED from the operative test rather than
        redefined". "Independent" is removed and "requires its result" is
        de-tested — both real (HOLD-6). But A5-3's closing sentence on fused
        implementations reinstates a description-relative predicate in new words:
        an operation is not performed by the attack if it occurs only in
        implementation machinery "AND APPEARING NOWHERE IN THE ATTACK'S
        SPECIFICATION-LEVEL DESCRIPTION". Deciding what appears in the attack's
        specification-level description is the intensional half of superseded
        clause A-2 under a different name, and AMB-8 is on record that the
        intensional reading gives "two specifications of the same function with
        identical N and identical X ... opposite verdicts. No dishonest
        description is required for either." -005 does not dissolve that; it
        adopts it, expressly ("an operation the attack does perform fires the bar
        unless its cost is counted, however the description characterises it").
      what_would_refute_it: >-
        A committed conversion route that counts ShiftRows or MixColumns
        operations, which would make limb (3) live for kinds (2) and (3). CM-1
        records the opposite: XOR counts, table accesses and unqualified
        "operations" are "NOT CONVERTED BY ANY FACTOR FIXED HERE", and O-CM1-3
        remains open by A5-4's own words.
      not_a_rejection: >-
        A determinate rule that chooses the intensional horn is still a
        determinate rule, and this objection does not say -005 is wrong. It says
        the removal claim is narrower than stated: one term was removed, one was
        installed, and on the two kinds that matter most the installed one is
        the whole test.

    - id: OBJ-RT-7
      severity: MEDIUM_HIGH
      joint: amendment 005 — a predicate the frozen specifications do not supply
      title: >-
        SPEC-06, THE AMB-5-REOPENED OBJECT, IS DECIDED UNDER -005 BY A PREDICATE
        THE ITEM NEVER SUPPLIES, AND IS COUNTED AS A DECIDED INFORMATIVE CELL.
      new_to_this_review: true
      the_objection: >-
        -005's `closure_arguments` claims AMB-5-REOPENED (the fused table-driven
        implementation) is reached by A5-3's closing sentence "without needing a
        definition of 'independent' at all". That sentence turns on whether the
        operation appears in the attack's SPECIFICATION-LEVEL DESCRIPTION.
        SPEC-06's frozen text supplies an IMPLEMENTATION description and nothing
        else: "one memory access performs a SubBytes substitution, its ShiftRows
        relabelling and its contribution to MixColumns simultaneously". It never
        states whether the attack's specification-level description requires the
        MixColumns contribution. The deciding fact is absent from the object.
      the_measured_signature_of_the_gap: >-
        The T-005 reader's own sealed pre-read records, for SPEC-06 axis A,
        `charging_form_if_admissible: "NOT STATABLE FROM THIS SPECIFICATION AND
        NOT INVENTED. The item states an implementation technique and no
        specification-level operation count"`, and drops confidence to MEDIUM
        "because the underlying attack's operations are not stated". The cell is
        nevertheless recorded ADMISSIBLE_ROUTE_1_PLUS_3 and counted among the
        column's 12 informative decided cells.
      the_internal_inconsistency_this_creates_in_column_3: >-
        The same reader's own rule IR-2 says "An item charging in AEU-k and
        claiming no conversion of a bytewise count records NOT_ENGAGED on axis
        A", and IR-2 is what produced NOT_ENGAGED on SPEC-09.A and SPEC-10.A.
        SPEC-06 likewise states no specification-level operation counts and no
        conversion, and got a decided verdict instead. On the reader's own rule
        the cell is arguably NOT_ENGAGED, which would move the column's
        informative count from 12 to 11 with the undetermined count unchanged —
        i.e. slightly WORSE than published, not better.
      why_this_matters_beyond_one_cell: >-
        DEF-PANEL-4 identified this exact item-side conflation against -004 and
        recommended a successor panel split the vocabulary. -005 was written
        after DEF-PANEL-4 was committed and does not address it, and the axis-A
        predicate it installs (OBJ-RT-6) is precisely one an item can fail to
        supply. The repair therefore inherits, unmitigated, the one defect the
        instrument had already diagnosed against its predecessor.
      what_would_refute_it: >-
        A reading of A5-3 under which a fused implementation's classification
        does not depend on the attack's specification-level description. A5-3's
        own sentence makes that dependence explicit.

    - id: OBJ-RT-8
      severity: MEDIUM
      joint: amendment 005 — B-block relocation
      title: >-
        B5-2 IS DECLARED NON-OPERATIVE FOR THE CHARGE AND IS MADE VERDICT-BEARING
        BY B5-4, AND ITS OWN INDIVIDUATION IS DEGENERATE ON A SINGLE-LOOP OBJECT.
      new_to_this_review: partially — D2 records the disclosure/inadmissibility tension; the degeneracy of the individuation is new
      the_objection: >-
        B5-2 places a stage boundary "at every point in its candidate pipeline at
        which THE CANDIDATE COUNT STRICTLY DECREASES, and at no other point".
        SPEC-05 (Attack H) is one loop over M candidates that discards on an
        algebraic predicate T. In such a loop the candidate count strictly
        decreases at each discarded candidate, so B5-2 on its own words yields
        one boundary per discard — of order M boundaries — and B5-4(i) requires
        the claim to state "the list of its stage boundaries under clause B5-2,
        each with the candidate count immediately before and immediately after
        it". That list is unstatable, and B5-4 makes a claim omitting it
        INADMISSIBLE. The escape is to read "point in its candidate pipeline" as
        something coarser than an iteration, and -005 does not say what.
      what_relocated: >-
        The failing word moved from "stage" (AMB-10, where -004 broke) to "point
        in the candidate pipeline". B5-2's disclaimer — "no reader is asked to
        decide what a stage is", "no verdict under this block turns on the word
        'stage'" — is true as literally written and does not reach the objection,
        because the verdict turns on the word that replaced it, and turns on it
        through B5-4's inadmissibility consequence rather than through B5-1.
      why_the_batch_s_own_D2_does_not_cover_it: >-
        D2 says B5-2 "changes no cell in this column" and calls it a partially
        degenerate branch. That is a statement about the ten frozen items, none
        of which carries a disclosure that B5-4 could find deficient (IR-1
        confines disclosure evaluation to SPEC-01 alone). The degeneracy of the
        individuation itself, on SPEC-05's own shape, is not recorded anywhere.
      what_would_refute_it: >-
        A sentence in -005 individuating a "point in the candidate pipeline".
        This session read both `resolving_text_verbatim` blocks in full; there
        is none.

    - id: OBJ-RT-9
      severity: HIGH
      joint: the proves-too-much check — can each control fire
      title: >-
        B5-1's THRESHOLD MAKES THE TOTAL CHARGE NON-MONOTONE IN THE CLAIMANT'S
        OWN DECLARED PER-MEMBER COST, IN THE DIRECTION THAT REWARDS DECLARING
        MORE WORK. NO CONTROL IN -005 LOOKS IN THIS DIRECTION.
      new_to_this_review: true
      the_construction: >-
        Let a claim declare per-member charged production work c AEU-k over a
        candidate-key set of size |S| each of whose members it verifies. B5-1
        levies element (f)'s separate charge iff c < 1, and B-2's second limb
        (expressly NOT superseded) fixes a verification unit at about one AEU-k
        per member. Total charged = c*|S| + |S| when c < 1, and c*|S| when
        c >= 1. At c just below one the total is about 2*|S|; at c exactly one
        it is |S|. THE TOTAL FALLS AS THE DECLARED PER-MEMBER COST RISES ACROSS
        THE THRESHOLD. Conservative rounding — declaring more work than one
        performs, which every cost model treats as safe — is rewarded with a
        strictly smaller total, and the step is at exactly the value PT-1,
        PT-2 and PT-4 all sit on.
      why_005_s_own_controls_cannot_see_it: >-
        PT-1's non-degeneracy argument reasons about the INCLUSIVE-versus-STRICT
        reading of the threshold, i.e. about which side of the tie the
        definitional reference falls on. That is a different axis from
        monotonicity in c. R1 (the denominator objection) and D3 (the U_enc(k) /
        r_k dependency) are also different axes: R1 asks what the quotient is
        divided by, D3 asks whether the threshold value itself can move. None of
        the three asks whether the total is monotone in the declared numerator,
        and -005 carries no anti-gaming rider on B5-1 comparable to -004's
        `anti_laundering_note` on clause A-2(ii).
      the_named_cheap_repair_offered_as_forward_guidance_only: >-
        Levy the separate charge at max(0, 1 - c) AEU-k per member instead of at
        one AEU-k per member. The total becomes |S| * max(c, 1), which is
        monotone non-decreasing in c and agrees with B5-1 at both ends. THIS IS
        NOT AN AMENDMENT AND NOT A PROPOSED EDIT; it is named so the objection
        carries its own cheapest disposal.
      what_would_refute_it: >-
        A committed clause barring a claimant from declaring per-member work
        above what it performs. B5-3's "a claim may not select the set that
        suits it" governs SET selection only; this session found no clause
        governing cost declaration.

    - id: OBJ-RT-10
      severity: HIGH
      joint: the proves-too-much check — the one reduction in charge
      title: >-
        THE LAUNDERING ROUTE -005 INVITES A REVIEWER TO TEST IS OPEN, AND PT-2
        CANNOT REACH IT BECAUSE PT-2's PHASE 1 HAS EXACTLY ONE SURVIVOR.
      new_to_this_review: true
      the_objection: >-
        -005's single reduction in charge is B5-3's exclusion of partial-key sets
        from element (f). Its own disclosure says "a reviewer should test whether
        it opens a laundering route" and names PT-2 as the check it ran. PT-2's
        object is "phase 1 RECOVERS m of the k key bits" — a phase with one
        surviving partial value. Take instead a partial-key SIEVE leaving
        N_p > 1 surviving partial-key candidates, each of which then requires its
        own residual search. Under -004's clause B-2 first limb those N_p
        survivors carried N_p verification units. Under B5-3 they carry none,
        because a set of partial-key values is not a candidate-key set and
        B5-1's test is applied "TO NO OTHER SET". This session read CM-1 element
        (c) directly: its partial-key clause charges "the residual exhaustive
        search over the remaining bits, charged at 2^(k-m-1) AEU-k" — ONE
        residual search, with no factor in the number of surviving partial
        candidates. So the multiplicity N_p is charged by element (f) no longer
        and by element (c)'s words not at all.
      the_second_horn: >-
        If instead one reads "recovering m of the k key bits" as requiring a
        determined value — so that a sieve leaving N_p candidates has NOT
        recovered them — then element (c)'s partial-key clause does not apply to
        the object either, and the construction has no governing clause on
        either side. That is an indeterminacy, not merely a discount.
      why_this_is_the_sharpest_form_of_the_objective_4_question: >-
        PT-2 is one of only two controls -005 offers on the B block's boundary
        behaviour, and it is the one written specifically to answer the
        laundering question about the reduction. Its object cannot exhibit the
        quantity the reduction removes. A control whose object cannot instantiate
        the failure it is written to detect has not detected its absence.
      what_would_refute_it: >-
        A clause charging element (c)'s residual per surviving partial candidate,
        or a clause returning element (f)'s term to multi-survivor partial sets.
        This session found neither in CM-1, -003, -004 or -005.

    - id: OBJ-RT-11
      severity: MEDIUM_HIGH
      joint: undisclosed dependency on an open question
      title: >-
        SPEC-01 AXIS A: THE AMENDMENT'S AUTHOR SAYS THE CELL TURNS ON AN OPEN
        CM-1 QUESTION; THE BLIND READER RECORDED IT DECIDED AND NEVER NAMED THE
        QUESTION. NOBODY RECONCILES THE TWO.
      new_to_this_review: true
      the_objection: >-
        -005's `closure_arguments` for AMB-7 states, of the Attack Q shape:
        "Under clause A5-3 limb (3) a reader who holds that the inverse counts
        reaches a determinate charging form and a reader who holds that it does
        not reaches UNADJUDICABLE. THIS AMENDMENT DOES NOT CLOSE DEF-CM1-A ...
        it governs the verdict of a shape the frozen panel contains." The T-005
        column recorded SPEC-01 axis A as ADMISSIBLE_ROUTE_1_PLUS_3, and its
        sealed pre-read reasons "the inverse S-box applications in N ... so
        A5-3(3) fails" — which SILENTLY RESOLVES DEF-CM1-A in the affirmative.
        The cell's `indeterminacy_locus` is null and its recorded residual is
        about clause A5-5, not about DEF-CM1-A.
      the_consequence: >-
        On the amendment author's own reading of its own text, SPEC-01.A is
        undetermined pending DEF-CM1-A, and the column's headline "3 undetermined
        of 12 informative" would be 4 of 12. This is an author/reader split on a
        cell counted as agreeing, and it is the second such split in the batch
        after PVF-1 — which makes two of the two genuine inter-reader data points
        splits, both unremarked as a pattern.
      why_it_is_the_kind_of_finding_the_card_asked_for: >-
        DEF-CM1-A is a PENDING QUESTION, routed to the Coordinator by column 1
        and expressly declined by -005 (OU-005-1). Its resolution flips SPEC-01
        axis A between ADMISSIBLE and UNADJUDICABLE, and Attack Q's shape — an
        attack charging its N in inverse S-box applications — is entirely
        ordinary. A receipt closing DEF-CM1-A would move a verdict class, and no
        column discounts its cell for that.
      credit_where_due: >-
        -005's engagement with the open questions is otherwise unusually
        complete: OU-005-1 to OU-005-5 name what it declined and why, and A5-3
        and A5-4 state O-CM1-1's and O-CM1-3's openness inside the operative
        text itself. The defect is in the COLUMN's accounting, not in the
        amendment's disclosure.

    - id: OBJ-RT-12
      severity: MEDIUM
      joint: cross-column comparability
      title: >-
        -005's OPERATIVE TEXT IS NOT SELF-CONTAINED, THE PANEL'S BLINDNESS SCOPE
        CANNOT DELIVER IT, AND IR-4 IS AN ACCOUNTING RULE THAT EXISTS ONLY IN
        COLUMN 3.
      new_to_this_review: partially — R5 and IR-4 record the mechanism; the cross-column comparability consequence is new
      the_objection: >-
        Clause A5-0 declares that A5-1 to A5-5 are read jointly with -004's
        clauses A-1, A-3 and A-4, and A5-1 routes whole classes of operation to
        A-3 "and no other clause ... is applied to it". The panel's
        `reader_blindness_obligation` scopes a classifier to "ONLY the two
        `resolving_text_verbatim` blocks named above, plus CM-1's elements". The
        T-005 reader's `never_opened_by_this_task` confirms it never opened -004
        at all. THE THIRD COLUMN THEREFORE CLASSIFIED AGAINST A TEXT ITS OWN
        AUTHOR DECLARES INCOMPLETE, while the first column's text (-004's own
        A-1 to A-4 and B-1 to B-4) was self-contained within the same scope.
        The two columns did not read comparable objects.
      the_accounting_consequence: >-
        IR-4 was introduced in column 3 to handle the resulting cells:
        "the cell is UNDETERMINED_BY_THIS_TEXT with locus READING_SCOPE_ARTIFACT
        and is NOT counted as evidence that 005 is indeterminate". The frozen
        panel's closed vocabulary has no such category, column 1 had no such
        escape available, and the exclusion is applied to exactly one cell
        (SPEC-08.A) in the direction favourable to -005. The reader discloses the
        exclusion and counts both ways, which is the right handling of a rule it
        should not have needed.
      forward_consequence: >-
        No blind column can ever read -005 as -005 declares itself while the
        panel's scope rule stands. Either the scope rule is widened for a
        successor panel (and then columns 1 and 3 remain non-comparable), or
        -005's successor states its operative test without incorporating
        predecessor clauses by reference.

  # =====================================================================
  # THE PROVES-TOO-MUCH AUDIT OF -005's SIX CONTROLS, RUN INDEPENDENTLY.
  # NON-DEGENERACY IS RE-ESTABLISHED AGAINST THIS REVISION AND INHERITED
  # FROM NO PREDECESSOR.
  # =====================================================================
  proves_too_much_audit:
    method: >-
      For each of the six controls -005 reports, this session asked whether some
      REACHABLE object would make it fail, and whether the control's own object
      can instantiate the failure the control names. Six controls, three
      findings; the other three are credited as live.
    per_control:
      - control: PT-1 (m=0 definitional reference against B5-1)
        can_it_fire: >-
          YES, IN THE FAMILY. PT-3 exhibits the opposite branch of B5-1's
          antecedent on a reachable object, so B5-1 is not a one-valued
          predicate and PT-1 is a genuine pass rather than a vacuous one.
        finding: >-
          PT-1, PT-2 and PT-4 are three presentations of ONE object with
          cosmetic variation — the definitional reference, plus a partial phase,
          plus a bookkeeping filter — and all three exit through the SAME limb,
          "charged cost per member is one AEU-k, which is not less than one".
          Only PT-3 exercises the other branch. The B-block's proves-too-much
          battery is therefore one discriminating object and three confirmations
          of a single non-firing branch, not four independent controls. Reported
          because this campaign counts controls.
      - control: PT-2 (two-phase at m > 0)
        can_it_fire: >-
          YES for the direction it tests, NO for the direction the reduction it
          guards actually runs in.
        finding: See OBJ-RT-10. PT-2's phase 1 has exactly one survivor and cannot
          instantiate the N_p > 1 multiplicity that B5-3's exclusion removes.
      - control: PT-3 (early-aborted evaluation)
        can_it_fire: >-
          YES, AND IT IS THE ONE CONTROL IN THE B BATTERY THAT DEMONSTRABLY
          FIRES. It is credited without qualification: it separates the
          charged-number reading from the specification-sentence reading on an
          object where the two differ, which is exactly what OBJ-3 asked for.
        finding: none
      - control: PT-4 (trivial boundary on the reference)
        can_it_fire: >-
          NOT INDEPENDENTLY. Its object differs from PT-1's only by a filter
          that B5-3 immediately declares not a verifying test, so it re-enters
          PT-1's exit. It confirms B5-2 does not leak into the charge, which is
          worth stating, but it is not a second sample.
        finding: counted as a variant of PT-1, see above.
      - control: PT-A1 (pullback invariance)
        can_it_fire: >-
          ITS PASS CRITERION CAN BE MET BY A DEGENERATE RULE. "Both forms receive
          the same verdict" is satisfied by any rule that bars everything, and
          -005 achieves it by barring both. The stated guard against that is
          PT-A2.
        finding: >-
          The non-degeneracy argument offered — that -004 gives the two forms
          DIFFERENT verdicts, evidenced by the independent T-004 column — is
          genuine and is the right form of argument. It establishes that the
          check is not trivially passed by every text. It does NOT establish
          that -005 passes it non-degenerately, which is what PT-A2 is for.
      - control: PT-A2 (Route 3 not emptied)
        can_it_fire: >-
          NO, IN THE SENSE THAT MATTERS. Its object is STIPULATED to perform no
          operation of A5-4's list beyond ones counted in N and X, which is the
          negation of A5-3's limb (1) conjoined with the negation of limb (3).
          An object defined by the negation of the antecedent cannot make the
          antecedent fire. The control establishes that Route 3 is formally
          non-empty; it does not establish that any object of independent
          interest survives the bar.
        the_missing_guard_named: >-
          What PT-A1 and PT-A2 do not jointly exclude is narrowing-to-vacuity on
          the shapes that matter. The absent control is an object performing at
          least one operation of A5-4 kind (2), (3) or (5) whose cost IS counted
          — and OBJ-RT-6 shows no such object exists, because no committed
          conversion route counts those kinds. So the correct statement is
          stronger than "the guard is weak": for kinds (2), (3) and part of (5),
          A5-3 admits an attack ONLY by the attack not performing the operation
          at all. That is the sense in which Route 3's non-emptiness is formal.
        finding: reported as a degenerate branch of the guard, not of A5-4 itself.
    what_this_audit_does_not_claim: >-
      That any control is wrong, that -005's conclusions are false, or that a
      narrower rule is a worse rule. A rule whose errors point against the
      claimant is the only direction a rule of this kind may point, and -005
      says so about itself. What is claimed is that non-degeneracy is
      established for PT-3 and for B5-1's two branches, and is NOT established
      for PT-2's guarded direction, for PT-4 as an independent sample, or for
      PT-A2 as a guard against narrowing.

  # =====================================================================
  # REQUIRED CONTROLS, CHEAPEST FIRST.
  # =====================================================================
  required_controls:
    - id: RC-RT-1
      name: COUNTERBALANCED TEXT ORDER ON COLUMN 1
      what: >-
        Re-classify the frozen panel against T-003-SUPERSEDED FIRST, in a
        session that has not read -004's clauses and has not read either
        published column, sealing the verdicts into the deliverable and having
        the Coordinator commit the seal in flight as TASK-20260903-9318b5 did.
        Compare the five T-003 indeterminacies against the new column.
      what_it_settles: >-
        Whether the batch's headline result — that -004 decides 5 informative
        cells -003 left open — is a property of the texts or of the order in
        which one reader read them. It is the only inflation source acting
        solely on the null-object column.
      cost: >-
        One session, zero compute, zero network, no new panel, no new text.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
    - id: RC-RT-2
      name: THE TWO-READER SINGLE-TEXT CONTROL — THE CHEAPEST THING THAT SETTLES THE MOST
      what: >-
        Two independently dispatched sessions classify the SAME frozen panel
        against the SAME single text, from BYTE-IDENTICAL cards that restate no
        prior result and no marginal, each sealing before either sees the other.
        Compare item by item.
      what_it_settles: >-
        RC-6's actual question, which no cell in any of the three columns
        measures. Every number this batch reports is one reader's determinacy, a
        proxy the batch itself labels a proxy (INFL-3, NOTRUN-3, OU-005-5). The
        control is decisive in one direction at low cost: if two same-family
        readers DISAGREE, the text is indeterminate regardless of family and the
        finding is immediate; if they agree, family correlation caps the
        inference and a cross-family draw becomes the next necessary step. That
        asymmetry is what makes it the best value in the batch.
      cost: >-
        Two sessions, zero compute, zero network. No new instrument.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
    - id: RC-RT-3
      name: FROZEN DISPATCH CARDS
      what: >-
        Hash the reader's dispatch card alongside the panel and commit it before
        the reader is launched, with a declared prohibition on restating any
        prior verdict, marginal or author position.
      what_it_settles: >-
        The failure mode that broke SPEC-10 axis B in this batch was the CARD,
        not the reader (archive receipt F-2). A card that is a committed,
        reviewable artifact cannot leak silently, and the reader can check its
        own card against the freeze.
      cost: One file per reader, zero compute.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
    - id: RC-RT-4
      name: MONOTONICITY CHECK ON B5-1
      what: >-
        On paper, zero compute: write two cost claims for one hypothetical
        construction, identical except that one declares per-member charged work
        just below one AEU-k and the other declares exactly one AEU-k as a
        conservative rounding. Apply B5-1 and B-2's second limb to both and check
        whether the total charged is monotone non-decreasing in the declared
        per-member figure.
      what_it_settles: OBJ-RT-9, in one paragraph, with no new instrument.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
    - id: RC-RT-5
      name: MULTI-SURVIVOR PARTIAL-KEY OBJECT
      what: >-
        On paper, zero compute: a hypothetical partial-key sieve leaving N_p > 1
        surviving partial-key candidates, each requiring its own residual search.
        Apply B5-3, B5-1 and CM-1 element (c)'s partial-key clause and record
        which clause charges the factor N_p.
      what_it_settles: OBJ-RT-10, and it is the object PT-2 was written to be and
        is not.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
    - id: RC-RT-6
      name: HELD-OUT PANEL RESERVE
      what: >-
        Freeze a second panel of specifications now, withhold it from every
        amendment author, and classify only against texts whose authors never
        saw it.
      what_it_settles: OBJ-RT-1. Without a reserve, each successive amendment is
        tested on items its author already has verdicts for, and the instrument's
        power against -006 will be lower than its power against -005 was.
      status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.

  counterexample_or_mutation: >-
    THE CHEAPEST DISCRIMINATING MUTATION IS RC-RT-4's TWO-CLAIM PAIR, and it
    needs no session at all: it is decided by reading B5-1 and B-2's second limb
    against two declared numbers. Total charged is c*|S| + |S| for c < 1 and
    c*|S| for c >= 1, so the total FALLS as the declared per-member figure
    rises across the threshold. If that is intended, -005 should say so; if it
    is not, the repair is to levy max(0, 1 - c) per member, giving
    |S| * max(c, 1), which is monotone and agrees with B5-1 at both ends. THE
    SECOND CHEAPEST IS RC-RT-5's MULTI-SURVIVOR PARTIAL-KEY OBJECT, which is the
    object -005's own PT-2 was written to be. Both are hypothetical
    constructions, asserted of no real cipher and of no round count, and neither
    states any cost figure for anything.

  baseline_comparison:
    applicability_of_this_role_s_standard_baselines: >-
      POLLARD-RHO, BSGS AND THE CLOSEST SPECIALIZED ECDLP BASELINE DO NOT APPLY
      AND ARE NOT INVOKED. This batch is protocol-measurement work on a
      symmetric-cipher cost-model specification; there is no relation collection,
      no rank, no source recovery, no target descent and no scalar orientation in
      the object under review, and a discrete-logarithm frontier row would be a
      fabricated comparison here. Stated rather than left silent, because a null
      baseline field is a fabrication under AGENTS rule 5.
    the_applicable_reference: >-
      The only quantitative reference this campaign may use is CM-1's
      DEFINITIONAL exhaustive-key-search reference of 2^(k-1) AEU-k at the stated
      key size, which follows from the key length and the cipher definition and
      is read from no document; and no margin, speedup, advantage or delta
      against it is stated by this record or by anything it reviews, with the
      published-state-of-the-art comparison declared UNADJUDICABLE in this
      environment in both directions (R5, RQ-AES-002).
    dominated_by: >-
      unresolvable in this environment: no primary source reachable; every
      recalled frontier row is unverified-from-memory
    dominated_by_note: >-
      Recorded per R5's operational clause rather than left null, and identical
      to the statement CM-1, -004, the frozen panel and both verdict-table
      records each make about themselves. It is a scope statement about an
      unstated margin, not an unchecked null. This session checked the field on
      every artifact it read and found it populated in each.
    sota_delta: >-
      NOT APPLICABLE. This record states no result carrying a delta.
    pareto_axes_checked: >-
      NONE ARE CLAIMED AND NONE ARE COMPARED. No time, memory, data or
      success-probability four-tuple is asserted anywhere in this review or in
      the artifacts it reviews; CM-1's four-tuple rule has nothing to attach to
      in a specification-measurement batch.

  heuristic_challenges:
    - id: HC-1
      target: the batch's implicit heuristic that DETERMINACY TRACKS AGREEMENT
      challenge: >-
        Every number in all three columns is one reader's self-graded
        determinacy (FORCED / BEST_SUPPORTED / UNDETERMINED). The operative
        claim is inter-reader agreement. The batch labels the substitution
        (INFL-3) and never uses the proxy as if it were the quantity — which is
        correct — but the substitution is nonetheless the load-bearing
        assumption of the whole three-column design, and it is UNNUMBERED and
        UNVALIDATED. The only two genuine inter-reader data points in the batch,
        PVF-1 and the SPEC-01.A split of OBJ-RT-11, BOTH SPLIT. Two of two is
        not evidence of a rate; it is evidence that the proxy has not been shown
        to track the thing.
      what_would_settle_it: RC-RT-2.
    - id: HC-2
      target: >-
        the assumption that a same-family reader's UNDETERMINED is a property of
        the text
      challenge: >-
        "FORCED" is defined in the column's own rule R-c as "no conforming
        reader could reach another verdict on this text's own words". That is a
        universal quantification over readers, asserted by one reader, of a
        family that also wrote the text. The nearest-object control is the one
        the campaign already knows how to run and has not: the same panel, same
        text, different family. Until then every determinacy grade in this batch
        is a statement about one model's reading habits that is FORMATTED as a
        statement about a document.
      what_would_settle_it: A cross-family column. OPEN AND UNATTEMPTED.
    - id: HC-3
      target: >-
        the null-object control's assumption that -003 and -004 are the only
        variables distinguishing the two columns
      challenge: >-
        Order of reading (OBJ-RT-5), item provenance (five of ten items drawn
        from -004's own text and clause enumerations), and the excision channel
        (OBJ-RT-2) are all confounded with text identity in the same contrast.
        The column names the first as absent, the second as INFL-1 with a
        quantified correction, and the third not at all. The correction for
        INFL-1 is real and this review credits it; the other two are
        uncorrected.
      what_would_settle_it: RC-RT-1, plus the second null column
        (NOTRUN-1 / OU-005-3), which remains OPEN AND UNATTEMPTED.

  cost_model_challenges:
    - id: CMC-1
      target: clause B5-1's threshold
      challenge: >-
        See OBJ-RT-9. The total is non-monotone in the declared per-member
        figure across the threshold, which is a property of the accounting rule
        and not of any cipher. NO MARGIN IS STATED: this review states no cost
        figure, no speedup and no advantage for any construction, the only
        reference it may use is CM-1's definitional exhaustive-key-search
        reference of 2^(k-1) AEU-k at the stated key size, and the comparison
        against the published state of the art is UNADJUDICABLE in this
        environment in both directions.
    - id: CMC-2
      target: clause B5-3's partial-key exclusion read against CM-1 element (c)
      challenge: >-
        See OBJ-RT-10. Element (c) charges one residual search at 2^(k-m-1)
        AEU-k with no factor in the number of surviving partial candidates, and
        B5-3 removes the only term that carried that factor. This is a statement
        about which clause charges which quantity and it is NOT a margin: this
        review states no cost figure, no speedup and no advantage for any
        construction, the only reference it may use is CM-1's definitional
        exhaustive-key-search reference of 2^(k-1) AEU-k at the stated key size,
        and the comparison against the published state of the art is
        UNADJUDICABLE in this environment in both directions.
    - id: CMC-3
      target: B5-1's dependence on a unit whose sibling parameter is open
      challenge: >-
        NOT NEW — the T-005 column found it as D3 and this review confirms it
        independently by reading CM-1 element (a): U_enc(k) = r_k * AEU-k with
        r_k pinned to 1 as a binding conservative default while O-CM1-2 is open.
        Every BUNDLED cell in column 3 is decided by a tie at exactly one AEU-k
        per member, so a measured r_k < 1 flips them. This review adds only
        that it is the SECOND open CM-1 question on which a class of this
        batch's verdicts silently rests, the first being DEF-CM1-A at OBJ-RT-11,
        and that neither is discounted in any published cell.
    - id: CMC-4
      target: hidden overhead and memory
      challenge: >-
        NOT APPLICABLE AND SAID SO RATHER THAN LEFT BLANK. No o(1) term, no
        polylog factor, no per-entry constant and no memory figure appears
        anywhere in this batch, because no algorithm is costed anywhere in it.
        CM-1 element (e) memory is expressly untouched by -005. There is nothing
        for a hidden-overhead recomputation to attach to.

  reduction_and_scope_challenges:
    - id: RSC-1
      target: -005's scope claims
      finding: >-
        SURVIVES. `what_this_amendment_is_not` enumerates non-closure of
        O-CM1-1 through O-CM1-5, non-widening of the claim-tier ceiling,
        non-retroactivity, and non-edit of the frozen panel; A5-3 and A5-4 state
        O-CM1-1's and O-CM1-3's openness inside the operative text itself; and
        OU-005-1 to OU-005-5 name what was declined. This session checked each
        against the operative clauses and found no clause exceeding the declared
        scope. Scope inflation: NONE FOUND.
    - id: RSC-2
      target: A5-3's sentence "NO MATERIALITY THRESHOLD APPLIES"
      finding: >-
        NARROW AND CORRECTLY GROUNDED, BUT WORTH A COORDINATOR'S EYE. The
        sentence could be read as settling part of O-CM1-1, which every record
        holds open. It is grounded on -003's own committed Route 3 sentence
        ("an exact additional charge, not a threshold") rather than on a new
        ruling, and A5-4 restates O-CM1-1's openness three lines later, so the
        reading this review reaches is that it restates an existing Route 3
        property rather than closing a CM-1 open question. Recorded because the
        two sentences sit in one block and a later reader could take the first
        for a closure.
    - id: RSC-3
      target: the reduction chain from panel cells to any conclusion about the rule
      finding: >-
        NO RECORD IN THIS BATCH OVERSTEPS IT. Every producer states claim ceiling
        SPECIFICATION RESULT ONLY, none asserts anything about AES at any round
        count, and this session searched for a cipher claim in each and found
        none. The chain that IS overstepped is the one from a panel cell to a
        statement about readers in general, and every record labels that gap
        itself.

  proof_architecture_challenges:
    - id: PAC-1
      attack: observation-fiber
      applied_to: A5-3's three-limb test
      result: >-
        SEPARATOR MISSING FOR KINDS (2), (3) AND PART OF (5). Holding the
        observation (the triple of limb values) fixed and varying the object,
        limb (3) cannot vary for a ShiftRows or MixColumns operation reaching
        A5-3, because no committed conversion route counts either. The fiber
        over "limb (3) true" contains every such object, and the conclusion is
        decided entirely by limb (2). See OBJ-RT-6.
    - id: PAC-2
      attack: quantifier-order
      applied_to: R-c's definition of FORCED
      result: >-
        WITNESS CHOSEN AFTER THE INSTANCE. "FORCED" quantifies over all
        conforming readers but is instantiated by the single reader who has
        already read the item and the text. The universal is asserted, never
        tested, and the only tests available (PVF-1; OBJ-RT-11) came out against
        it. See HC-2.
    - id: PAC-3
      attack: boundary-and-strictness
      applied_to: -005 against -004 as the embedded boundary
      result: >-
        THE OLD METHOD IS NOT EMBEDDED AS A BOUNDARY; -005 IS STRICTLY NARROWER
        ON THE A BLOCK AND STRICTLY DIFFERENT ON THE B BLOCK. -005 discloses this
        itself ("THIS AMENDMENT MAKES THE OPPOSITE DISCLOSURE — IT IS A
        NARROWING"), which is the honest handling. The consequence for the
        campaign's own metric is that -005 cannot be described as dominating
        -004: on the panel's own headline count the third column is worse than
        the first, and this review's OBJ-RT-7 would make it marginally worse
        still.
    - id: PAC-4
      attack: method-ceiling
      applied_to: the three-column design
      result: >-
        THE CEILING DOES NOT REACH THE CLAIM. The maximum a determinacy column
        can establish is that ONE reader found a text decisive. The claim the
        amendments make is about TWO readers. No amount of column-building
        reaches it; only RC-RT-2 does. The batch states this (NOTRUN-3,
        OU-005-5) and continues to build columns, which is a reasonable use of
        a session but should not be mistaken for progress on the claim.
    - id: PAC-5
      attack: nearby-object
      applied_to: PT-A2's Route-3-not-emptied object
      result: >-
        THE NEAREST OBJECT FOR WHICH THE CONCLUSION IS FALSE IS THE SAME OBJECT
        PLUS ONE UNCOUNTED SHIFTROWS OR MIXCOLUMNS OPERATION, AND IT IS BARRED
        UNCONDITIONALLY. Since no route counts those kinds, the boundary between
        admissible and barred is drawn exactly at "does the attack perform such
        an operation at all", including once, at specification time, with no
        materiality floor. That is a determinate boundary and this review does
        not say it is the wrong one; it says PT-A2 does not test it, because
        PT-A2's object is on the safe side by stipulation.
    - id: PAC-6
      attack: compositional-invariant
      applied_to: deleting B5-2 from the B block
      result: >-
        B5-1 AND B5-3 SURVIVE DELETION OF B5-2 UNCHANGED — the charge does not
        consult it, as B5-2 itself says. The first step that fails is B5-4(i)'s
        disclosure requirement, whose omission is inadmissibility. So B5-2 is
        load-bearing only through a disclosure duty, which is exactly the shape
        of a discriminator that cannot fire on the charge and can still void a
        claim. See OBJ-RT-8 and D2.

