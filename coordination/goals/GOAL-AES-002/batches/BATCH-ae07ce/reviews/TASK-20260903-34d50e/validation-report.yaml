    - id: F-11
      severity: low
      finding: >-
        THE ARCHIVE RECEIPT AND THE QUEUE DISAGREE ABOUT WHAT THE ARCHIVE BINDS. The
        receipt lists the pre-read seal among its eight path entries; the queue's
