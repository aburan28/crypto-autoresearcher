    - id: F-6
      severity: medium
      finding: >-
        THE PANEL FILE CONTAINS AN UNDISCLOSED RESIDUAL LEAK AND MISDESCRIBES IT. The
        charging form "(N/S_k + X/X_k) AEU-k" appears in the panel's own r5 block,
