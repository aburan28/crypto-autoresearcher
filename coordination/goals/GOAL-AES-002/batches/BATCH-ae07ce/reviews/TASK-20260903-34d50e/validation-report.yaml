    - id: F-12
      severity: low
      finding: >-
        TWO FIDELITY CLAIMS OVERSTATE. The archive receipt's `parent_sha` is stale
        relative to the commit that carries it (correct when written, superseded when the
        seal was unbound; the queue's value is right and the content binding is
        unaffected). And verdict-tables-005's "byte-equivalent in verdict, clause list,
        confidence and indeterminacy locus" is false for clause lists in five of twenty
        cells, all differences being ordering or parenthesisation.
    - id: F-13
      severity: high
      finding: >-
        THIS VALIDATION IS INSIDE THE CORRELATED SET IT IS REPORTING ON, AND SAYS SO
        BEFORE ANYTHING ABOVE IS USED. This session resolved to claude-opus-5 — the same
        family that authored CM-1's amendments 003 and 004, RT-20260901-3ad5d2, the frozen
        panel, both verdict-table columns, amendment 005 and the archive receipt. WHERE
        THIS REPORT AGREES WITH A PRODUCER, THAT AGREEMENT IS NOT CROSS-FAMILY
        CORROBORATION AND MUST NOT BE COUNTED AS ONE. What is not affected by it: the
        mechanical recomputations in `metric_recomputations`, the copy test in CC-1, the
        git ordering checks in CC-2, the hash checks in AC-1 and AC-5, and the substring
        and offset checks in BL-1 and BL-2 — those are deterministic operations over
        committed bytes whose outputs a reader can regenerate with the commands recorded
