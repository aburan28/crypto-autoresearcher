  # =====================================================================
  # BLINDNESS CHECKS ON THE FROZEN PANEL
  # =====================================================================
  panel_blindness_checks:
    - id: BL-1
      check: >-
        Do the five red-team-derived items quote verbatim, and do the declared excisions
        actually remove the verdict spans?
      method: >-
        Loaded RT-20260901-3ad5d2's committed report, whitespace-normalised each source
        field and each specification_verbatim, and located the quoted span by exact
        substring search; then located each declared excision sentinel by exact substring
        search and compared its offset against the quoted span's end; then printed the
        excised remainder in full.
      result: >-
        PASS FOR ALL FIVE. SPEC-01 is a contiguous span at offset 0 of
        objections[0].worked_counterexample; SPEC-02 at offset 0 and SPEC-03 at offset 359
        of objections[1]; SPEC-04 at offset 0 of objections[2]; SPEC-05 at offset 0 of
        objections[3]. EVERY declared excision sentinel begins strictly AFTER the end of
        the span quoted for that item — SPEC-01 at 742 and 945 against a span ending at
        741, SPEC-02 at 359/643/994 against 358, SPEC-03 at 643/994 against 642, SPEC-04
        at 716 against 715, SPEC-05 at 480 against 479. The named cut points are exactly
        where the record says they are. The excised remainders contain what the record
        says they contain: SPEC-01's tail carries READER 1's "Route 3 stands" with a
        determinate charged figure and READER 2's "INADMISSIBLE / UNADJUDICABLE"; the
        others carry their READER 1 / READER 2 splits. NO VERDICT SPAN SURVIVES INTO ANY
        QUOTED SPECIFICATION.
    - id: BL-2
      check: >-
        Do the five amendment-004-derived items quote verbatim, and is the panel's
        uniform quotation rule true of them?
      method: Flattened amendment 004 to leaf fields and searched every leaf for each normalised specification.
      result: >-
        THE ITEMS DO NOT LEAK A VERDICT; THE PANEL'S DESCRIPTION OF ITS OWN RULE IS
        FALSE. SPEC-08, SPEC-09, SPEC-10 are exact contiguous spans of their declared
        fields, with the declared excisions on the correct sides. SPEC-06 AND SPEC-07 ARE
        NOT CONTIGUOUS SPANS. SPEC-06 splices two fragments of
        `ambiguities_resolved[0].what_was_ambiguous` across an excised middle — the source
        reads "...simultaneously, is classifiable oppositely by two conforming readers: as
        the S-box route ... giving a determinate (N/S_k + X/X_k) AEU-k figure, or ...
        giving UNADJUDICABLE. T-table implementations are the ordinary fast way..." and
        the panel joins "...simultaneously." directly to "T-table implementations...".
        SPEC-07 cuts at a comma ("...has no referent for either, and on its plain
        wording...") and renders it as a full stop. BOTH PUNCTUATION EDITS ARE UNDECLARED:
        the source contains "simultaneously," and "for either," and contains neither
        "simultaneously." nor "for either.". SPEC-08's second declared excision is a
        LEADING one, before the quoted span, not a trailing one.
      against_the_rule_as_written: >-
        `quotation_discipline.rule_applied_uniformly` states that nothing is "corrected"
        or "abridged internally" and that "WHAT IS EXCISED, ALWAYS AND ONLY, IS THE
        TRAILING RULE-APPLICATION AND VERDICT ANALYSIS". SPEC-06 is abridged internally,
        SPEC-08's second cut is leading, and two boundary punctuations are corrected. Each
        individual departure IS declared honestly in that item's own `excised_spans`
        block, which is why this is a defect in the uniform-rule sentence rather than a
        concealment.
      effect_on_blindness: >-
        NIL, AND CONFIRMED RATHER THAN ASSUMED. The material removed from SPEC-06 is
        precisely the sentence naming both candidate verdicts; the material removed from
        SPEC-07 is a verdict under a candidate rule -004 rejected. Both removals are
        exactly what a blindness excision should remove.
    - id: BL-3
      check: SPEC-01's separately carried `submitter_disclosure_verbatim`.
      result: >-
        NOT BYTE-FOR-BYTE VERBATIM. The source string value contains "byte- position"
        (the space is a YAML fold artifact inside the quoted disclosure); the panel
        renders "byte-position". A one-character silent repair, immaterial to meaning and
        immaterial to blindness, but a departure from a rule the panel states as absolute.
        The evaluative words the excision was made to remove — "COMPLETE AND HONEST" —
        are correctly absent.
    - id: BL-4
      check: Undisclosed residual leaks in the panel file itself.
      result: >-
        ONE FOUND, NOT IN THE PANEL'S OWN DISCLOSURE LIST. The panel file reproduces the
        charging form "(N/S_k + X/X_k) AEU-k" at exactly one place — its own
        `constraint_discharge.r5_anti_laundering` — and describes it there as one of the
        "symbolic forms appearing in the quoted specifications". IT APPEARS IN NO
        specification_verbatim: verified by scanning all ten, where only "AEU-k",
        "N/256" (SPEC-04) and "2^-t" (SPEC-05) occur. Its actual provenance is the
        material the panel EXCISED: READER 1's charged figure for SPEC-01 and -004's
        stated figure for SPEC-06, both cut as verdict-bearing. So a file that carries no
        verdict by construction reproduces, in its own prose, a charging form it removed
        from two items as verdict-bearing, and misdescribes where that form came from.
      why_the_self_check_missed_it: >-
        `blindness_self_check` searched its own text for the stems admissib / unadjudicab
        / bundl / separate charge / pass and enumerated four categories of hit. A charging
        form matches none of those stems. The check was well designed for the leak class
        it was aimed at and blind to this one.
      materiality: >-
        LOW BUT REAL. CM-1 line 135 states the Route 1 form "Attack work expressed as N
        S-box applications is charged N / S_k AEU-k" and the reader is instructed to read
        CM-1, so a reader could derive the combined form without the panel. Against that:
        both readers did in fact record exactly "(N/S_k + X/X_k) AEU-k" as SPEC-01's
        charging form, and the panel requires `charging_form_if_admissible` as an answer
        field. The leak is not shown to have bound; it is shown to be present and
        undisclosed, and the file's statement about it is false.
    - id: BL-5
      check: Items whose verdict is guaranteed by panel composition.
      result: >-
        TWO, AND THE T-004 READER FOUND BOTH. SPEC-08's specification is itself a fragment
        of clause A-3(ii)'s rule text with its own antecedent excised, which leaves "that
        correspondence" dangling and, under the superseded -003 text, without any
        antecedent at all. SPEC-09's specification is quoted from a field whose NAME —
        `proves_too_much_check_m_equals_0_definitional_reference` — is carried in the panel
        and tells a reader that -004 ran a proves-too-much check on this exact object;
        SPEC-10's source field name, `relation_to_what_003_already_closed`, likewise
        signals that -003 already closed it, which is a hint about the null column's
        answer specifically. LEAK-1 describes this leak as reachable by "a determined
        reader could OPEN the cited fields"; for SPEC-09 and SPEC-10 the hint is in the
        field NAME carried inside the panel and requires opening nothing. The disclosure
        is correct in kind and understates the reach. The T-004 reader independently
        graded SPEC-08.A and SPEC-09.B FORCED_BY_CONSTRUCTION and downweighted them in
        INFL-1, which is the right handling of a defect it did not create.

  # =====================================================================
  # THE -005 COLUMN'S SELF-DISCLOSED BLINDNESS DEFECT — SCOPE ESTABLISHED HERE
  # =====================================================================
  blindness_defect_scope_assessment:
    what_the_author_discloses: >-
      TWO LEAKS FROM ITS OWN DISPATCH CARD, both volunteered. (1) The card stated both
      prior positions on SPEC-10 axis B — the amendment author's BUNDLED and the previous
      blind reader's SEPARATE_CHARGE_APPLIES — before any verdict was formed. The record
      marks that one cell `blindness: BROKEN_AND_DISCLOSED`, declines to claim blindness
      for it, states that it cannot discriminate between "the text decides it" and "this
      reader was told the answer", and names a genuinely blind re-reading as OPEN AND
      UNATTEMPTED. (2) The card also supplied the PRIOR COLUMNS' MARGINALS — five
      undetermined of thirteen informative under 003, zero under 004, seven of twenty
      engaging neither text — which are summary statistics of the very table the card
      forbade the reader to open. The record calls this a defect in the batch's
      instrumentation rather than a departure by the reader.
    is_exactly_one_cell_affected: >-
      NO. ONE CELL HAS A DISCLOSED ANSWER-LEVEL BREAK; ONE FURTHER CELL SHARES THAT
      CELL'S ENTIRE DECISION PATH AND IS NOT MARKED; AND ALL TWENTY SIT UNDER A
      COLUMN-LEVEL MARGINAL ANCHOR. Establishing each separately.
    the_undisclosed_adjacent_cell: >-
      SPEC-09 AXIS B. SPEC-09 and SPEC-10 are the panel's two `definitional-reference-shape`
      items. In the -005 column they carry the SAME verdict (BUNDLED_NO_SEPARATE_CHARGE),
      the SAME confidence (MEDIUM), and clause lists that overlap on the pair the reasoning
      turns on (SPEC-09.B ['B5-0 carrying B-2 second limb','B5-1','B5-3']; SPEC-10.B
      ['B5-1','B5-3']). The reader's own R1 analysis treats them as one object, stating
      that under the other denominator "SPEC-09 ... flips to SEPARATE_CHARGE_APPLIES ...
      and SPEC-10 flips with it", and records BOTH at MEDIUM rather than HIGH for that one
      shared reason. A reader anchored to BUNDLED on SPEC-10.B has an unobstructed path to
      BUNDLED on SPEC-09.B, because it is the same path. SPEC-09.B carries no
      `blindness` annotation. I judge it inside the break's blast radius and undisclosed
      as such. I do NOT claim the anchor in fact propagated — that is unknowable from here
      and I am not substituting an estimate for it.
    the_column_level_anchor: >-
      THE MARGINAL LEAK IS NOT CELL-SCOPED AND CANNOT BE. The card supplied, before
      classification, the shape of the answer distribution — how many cells came out
      undetermined under each prior text and how many engaged neither text — in a design
      whose entire deliverable IS that distribution. Every aggregate the -005 column
      publishes (8 NOT_ENGAGED of 20, 3 UNDETERMINED, 12 informative) is therefore
      downstream of a disclosed prior for those same aggregates. The reader's own
      mitigation — that its counts match neither prior column — is offered as weak
      evidence and correctly labelled weak; it cannot separate "the anchor did not bind"
      from "the anchor bound loosely", and no statistic computed inside the anchored
      column can.
    was_the_authors_handling_adequate: >-
      HONEST BEYOND WHAT WAS REQUIRED; UNDER-SCOPED. What it did right, and it is a lot:
      it disclosed a leak nobody would have found otherwise (the card is not a committed
      record — see AC-6, so this disclosure is the ONLY evidence the leak occurred at
      all); it refused the blindness claim for the affected cell instead of hedging it;
      it named the cell the card called "the most informative one in the batch" as the one
      cell that cannot inform; it preserved the checkable route so a reviewer can test the
      reasoning without trusting the reader; it disclosed the second leak unprompted; and
      it recorded the remedy as OPEN AND UNATTEMPTED in the required words. WHAT IT DID
      NOT DO: extend the discount to SPEC-09.B, which shares SPEC-10.B's clause path; and
      state that the marginal leak caps every aggregate in the column rather than
      contributing a general caution. My divergence from the author's scoping is exactly
      those two items and nothing else.
    does_it_contaminate_the_whole_column: >-
      NO, AND THE DISTINCTION MATTERS. The thirteen cells that turn on the A-block clauses
      (A5-0 to A5-5) have no disclosed anchor of any kind — the card's leak concerned one
      B-axis cell and three aggregate counts — and their reasoning is fixed in a
      git-pinned seal. The P/P' pair result (SPEC-02 and SPEC-03 classifying alike on axis
      A under -005, where they split under -004) is unaffected by the disclosed leaks and
      is the column's strongest genuinely blind content. What the leaks cost is the
      B-axis definitional-reference cells and the column's aggregate statistics, which is
      severe but is not the column.

