  metric_recomputations:
    - metric: T-004 / T-003 headline counts
      reported: 'T_004 {decided 20, undetermined 0, forced 12, forced_by_construction 2}; T_003 {decided 15, undetermined 5, forced 9, forced_by_construction 1}'
      recomputed: 'T_004 {20, 0, 12, 2}; T_003 {15, 5, 9, 1}'
      agrees: true
      note: >-
        Recomputed from the 40 cells by counting verdict != UNDETERMINED_BY_THIS_TEXT and
        determinacy in {FORCED, FORCED_BY_CONSTRUCTION}. The record's own R-c defines
        FORCED_BY_CONSTRUCTION as "FORCED with the additional disclosure", so the forced
        counts are inclusive; on that convention both headline rows are exact.
    - metric: informative / uninformative cell partition
      reported: '7 uninformative, 13 informative; the seven named as SPEC-04.A, SPEC-05.A, SPEC-09.A, SPEC-10.A, SPEC-06.B, SPEC-07.B, SPEC-08.B'
      recomputed: >-
        7 / 13, and the seven derived independently as exactly the cells reading
        NOT_ENGAGED_BY_THIS_SPECIFICATION under BOTH texts — set equality with the
        published list confirmed.
      agrees: true
    - metric: cells where the two texts give different verdicts
      reported: '7 of 13 informative; SPEC-01.A, SPEC-03.A, SPEC-06.A, SPEC-07.A, SPEC-05.B, SPEC-04.B, SPEC-10.B'
      recomputed: >-
        7, set-identical. All seven lie inside the informative subset, so the
        complementary "6 agree of 13 informative" follows and is also exact.
      agrees: true
    - metric: informative-subset counts, T_003 column
      reported: '{decided 8, undetermined 5, forced 4, forced_by_construction 1}'
      recomputed: '{8, 5, 4, 1} — forced inclusive of the one FORCED_BY_CONSTRUCTION (SPEC-09.B); strict FORCED alone is 3.'
      agrees: true
    - metric: informative-subset counts, T_004 column
      reported: '{decided 13, undetermined 0, forced 5, forced_by_construction 2}'
      recomputed: >-
        {13, 0, 7, 2}. DISAGREES ON ONE FIELD. The thirteen informative T-004 cells carry
        five strictly-FORCED grades (SPEC-01.B, SPEC-02.A, SPEC-02.B, SPEC-03.B,
        SPEC-07.A) and two FORCED_BY_CONSTRUCTION (SPEC-08.A, SPEC-09.B). Under the
        record's own R-c and under its own usage everywhere else — headline 12 = 10 + 2,
        informative T_003 4 = 3 + 1, and INFL-1's "two of T-004's twelve forced cells" —
        the inclusive figure is 7, not 5. The published 5 is the strict count, and it is
        the only place in the record where the strict convention is used.
      agrees: false
      material_effect: >-
        The narrative sentence "Forced cells rise from 4 to 5 on the informative subset"
        compares T_003 inclusive against T_004 strict. Like for like the comparison is
        4 to 7 inclusive, or 3 to 5 strict. THE ERROR RUNS AGAINST THE PRODUCER'S OWN
        INTEREST — it understates the determinacy gain it is reporting — which is why
        this is recorded as an arithmetic slip and not as inflation. The headline
        discrimination result (7 of 13 informative cells differ) is untouched by it.
    - metric: T-005 column marginals
      reported: '8 NOT_ENGAGED of 20; 3 UNDETERMINED (SPEC-02.B, SPEC-03.B joint locus; SPEC-08.A reading-scope locus); 12 informative'
      recomputed: '8, 3, 12 — set-identical on all three.'
      agrees: true
    - metric: cells where T-005 differs from the published T-004 column
      reported: '7, listed as SPEC-01.B, SPEC-02.B, SPEC-03.A, SPEC-03.B, SPEC-05.B, SPEC-08.A, SPEC-10.B'
      recomputed: '7, set-identical.'
      agrees: true
    - metric: sealed pre-read verdicts vs the published table_T_005
      reported: '"reproduced_unchanged_below: true"; "byte-equivalent in verdict, clause list, confidence and indeterminacy locus to the sealed file"'
      recomputed: >-
        PARTIALLY FALSE AS STATED, SUBSTANCE INTACT. Verdicts match on 20 of 20;
        confidence on 20 of 20; indeterminacy locus on 20 of 20. CLAUSE LISTS DIFFER IN
        FIVE CELLS: SPEC-04.A is reordered (['A5-3','A5-4','IR-2'] to
        ['IR-2','A5-3','A5-4']) and SPEC-06.A, SPEC-07.A, SPEC-08.A, SPEC-09.B differ in
        parenthesisation only ("A5-3 (fused-implementations sentence)" to "A5-3
        fused-implementations sentence"; "A5-4 (item 6)" to "A5-4 item (6)"; "B5-0
        (carrying B-2 second limb)" to "B5-0 carrying B-2 second limb"). Three
        charging_form fields are abbreviations of longer sealed text (SPEC-01.A,
        SPEC-06.A, SPEC-07.A) with the same symbolic content.
      agrees: false
      material_effect: >-
        NIL as to which clauses were relied on and nil as to any verdict; the differences
        are ordering and punctuation. But "byte-equivalent" is a precise word used
        precisely wrongly, in the one block whose entire function is to certify that
        nothing moved between sealing and publication. The right claim is
        "verdict-, confidence- and locus-identical; clause lists equivalent up to
        ordering and parenthesisation; charging forms abbreviated". Reported because a
        fidelity claim that overstates by a little is the kind that stops being checked.
    - metric: seal timestamp
      reported: 'verdict-tables-005.yaml seal.sealed_at_utc = 2026-09-04T17:02:40Z; verdicts-sealed-preread.yaml sealed_at_utc = 2026-09-04T17:00:00Z'
      recomputed: >-
        NOT A CONTRADICTION, BUT A FIELD-NAME COLLISION. The same key name carries two
        different events in the two records: the sealed file's value is when the file was
        written (basis: `date -u` read at 16:59:49Z, rounded up), the published record's
