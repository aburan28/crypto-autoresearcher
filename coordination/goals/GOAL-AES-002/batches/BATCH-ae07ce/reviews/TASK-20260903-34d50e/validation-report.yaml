        denominator.
    - id: F-8
      severity: medium
      finding: >-
        THE THREE COLUMNS ARE PUBLISHED SIDE BY SIDE ON TWO DIFFERENT DEFINITIONS OF
        "INFORMATIVE" (pairwise NOT_ENGAGED-in-both for the 13, single-column
        not-NOT_ENGAGED for the 12). The -005 record flags this and supplies an
        alternative count; the mixed line is still the one that reads as a comparison.
    - id: F-9
      severity: medium
      finding: >-
        THE CARD THAT BROKE BLINDNESS IS NOT A COMMITTED RECORD. All eight task cards in
