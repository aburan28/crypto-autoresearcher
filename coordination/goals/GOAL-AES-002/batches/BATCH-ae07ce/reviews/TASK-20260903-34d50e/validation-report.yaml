  findings:
    - id: F-1
      severity: high
      finding: >-
        THE BATCH'S OPERATIVE CLAIM IS MEASURED ON ZERO CELLS. No item-and-axis in the
        package carries two independent readings of the same text, so inter-reader
        agreement — the thing RC-6 asks about and the thing the batch's purpose sentence
        names — is exactly as unmeasured after this batch as before it. Both producers
        state this; it is recorded at this severity because purpose sentences travel
        further than caveats.
    - id: F-2
      severity: high
      finding: >-
        EVERY TASK IN THE BATCH, AND THIS VALIDATION, RESOLVED TO ONE MODEL FAMILY. The
        declared cross-family repair of BATCH-241d37's MODEL INDEPENDENCE ZERO is
        realised in zero tasks. Consequence for any agreement-based reading: there is
        none available. Agreement between the amendment author and either column, between
