    - id: F-5
      severity: medium
      finding: >-
        ONE PUBLISHED DERIVED COUNT DOES NOT RECOMPUTE.
        `informative_subset_counts.T_004.forced` reads 5; under the record's own R-c
        definition it is 7. The "4 to 5" narrative sentence compares T_003 inclusive
        against T_004 strict. Like for like the informative forced comparison is 4 to 7.
