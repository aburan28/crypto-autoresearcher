  authored_at_basis: >-
    READ FROM A CLOCK where a clock was read, and stated as runtime context where it
    was not. This session HAS a command-execution tool; `git show -s --format=%cI` was
    executed against committed objects and those timestamps are quoted below as read.
    The date on this line is this session's stated runtime date. NOTE THE DIVERGENCE,
