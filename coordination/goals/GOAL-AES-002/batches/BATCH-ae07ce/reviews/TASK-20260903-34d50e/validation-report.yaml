  # =====================================================================
  # ARTIFACT CHECKS
  # =====================================================================
  artifact_checks:
    - id: AC-1
      check: >-
        Every path the archive receipt declares exists, and its bytes hash to the
        declared value in the working tree AND at the snapshot commit.
      method: >-
        Python hashlib.sha256 over the working-tree bytes, and over
        `git show 4f5115ad0c53123cd4ff997123c2f96ed432a20c:<path>` for each of the eight
        entries in snapshot-receipt.json `path_sha256`.
      result: >-
        PASS, 7 of 7 real entries. panel-spec.yaml e9fe9f91..., freeze-receipt.json
        356ca04e..., verdict-tables.yaml b6d0ca8b...,
        protocol-amendment-GOAL-AES-002-005.yaml 340ad974...,
        amendment-report.md da8973eb..., verdict-tables-005.yaml 536486c5...,
        verdicts-sealed-preread.yaml ffb030b6... — all three values (declared, worktree,
        snapshot) identical for every path. The eighth entry is the receipt's own, which
        reads SELF; its bytes hash to
        ae9213135d5c3b6b4de666194c79f027c9862182b337bb84e56dcf100dd51e41 identically in
        the worktree and at the snapshot, and that value equals the digest the queue's
        archive block records for it.
    - id: AC-2
      check: The snapshot commit is committed state, not a working-tree-only artifact.
      method: '`git merge-base --is-ancestor 4f5115ad0 HEAD`; `git status --porcelain`.'
      result: >-
        PASS. 4f5115ad0 is an ancestor of HEAD (2170ab2fbc4b17e1e378c6ad9e25417135ce4adc)
        and the working tree is clean. The producer receipts under review are therefore
        committed receipts, and agents/validator.md's prohibition on validating a
        working-tree-only receipt is not engaged.
    - id: AC-3
      check: The receipt's declared commit binding matches the commit that carries it.
      method: '`git rev-parse 4f5115ad0^`, compared with both declared parent values.'
      result: >-
        DISCREPANCY, ADVISORY-ONLY, REPORTED. snapshot-receipt.json
        `commit_binding.commit_sha` is null (the receipt says so, and says why) and its
        `parent_sha` is b70aae863963c61e00a8e5dbd4104e5bce542f98. The actual parent of
        4f5115ad0 is 95cc419b53e6ad752ec96a2738777464590f2f9c, which is what
        dispatch_queue.json's archive block records. b70aae863 IS an ancestor of
        4f5115ad0, four commits back, and 95cc419b5 is `queue(...): unbind the undeclared
        pre-read seal` — so the receipt's value was correct when written and went stale
        when the archive was re-committed after the seal was unbound. The receipt is
        immutable and correctly not edited. Under binding_mode content_first the parent
        is advisory and AC-1 carries the binding, so nothing downstream depends on it;
        it is recorded because a later reader of the receipt alone would take a stale
        parent for a live one.
    - id: AC-4
      check: >-
        Whether the pre-read seal is bound by the archive, and whether the receipt and
        the queue agree about that.
      method: >-
        Compared snapshot-receipt.json `path_sha256` (8 keys) with dispatch_queue.json
        archive `path_sha256` (7 keys) and dispatch_plan.json `content_only_archives`
        (paths_verified 7); read TASK-20260903-9318b5's committed handoff.
      result: >-
        THE CARD'S PREMISE IS CONFIRMED, AND THE TWO RECORDS DISAGREE WITH EACH OTHER.
        verdicts-sealed-preread.yaml is NOT in TASK-20260903-9318b5's declared
        artifact_paths — that handoff declares exactly one, verdict-tables-005.yaml. The
        queue's archive block excludes the seal and records why, under
        `undeclared_artifact_not_bound_by_this_archive`, stating that the dispatcher
        refused the archive for binding a path outside the union of declared
        artifact_paths and that the refusal is correct. dispatch_plan.json's
        paths_verified 7 is the queue's seven, not the receipt's seven. THE COMMITTED
        RECEIPT STILL LISTS THE SEAL AMONG ITS EIGHT PATH ENTRIES, so a reader of the
        receipt alone would believe the seal is content-bound by this archive when it is
        not. The queue block names this divergence deliberate and explains it; both
        records are immutable and neither was edited here.
    - id: AC-5
      check: Whether the seal's ordering claim is checkable by means other than the seal.
      method: >-
        `git show -s --format='%H %cI %s' 74eec580bfb9e5c596a34017c2232420a1a071e6`;
        `git show 74eec580b:<seal path> | sha256sum`; `wc -c` on the seal.
      result: >-
        PARTIALLY, AND THE PART THAT IS CHECKABLE IS THE PART THAT MATTERS LEAST.
        VERIFIED INDEPENDENTLY IN THIS SESSION: the seal is pinned at commit 74eec580b,
        committed 2026-09-04T17:04:49+00:00 with message "seal(TASK-20260903-9318b5):
        blindness seal, committed while the task is IN FLIGHT"; the committed bytes hash
        to ffb030b60322f0e4e8018bb196863cc8f734b9b6dee63838cf45ac59391e1a65, equal to
        the digest verdict-tables-005.yaml records and to the worktree bytes; the file is
        29078 bytes, equal to the declared `seal.bytes`. That establishes the seal was
        not rewritten after the outcome was known, WITHOUT trusting the reader.
        NOT ESTABLISHED BY ANY MEANS AVAILABLE HERE: what the reader had read BEFORE
        17:02:40Z. A commit bounds the latest moment the verdicts were fixed; it says
        nothing about the reading order that preceded it, and the reader's
        `not_read_before_sealing` list is the reader's own testimony and remains so.
        WHAT THE EXCLUSION COSTS: less than it appears. The archive's content binding
        would have added nothing the git pin does not already give, because both are
        content facts about the same bytes. What is genuinely lost is that the seal is
        not carried by the archive a later consumer will fetch, so a consumer who
        resolves only the archive's declared set silently loses the record that
        verdict-tables-005.yaml designates its PRIMARY one — see F-11.
    - id: AC-6
      check: >-
        Whether the dispatch card that the -005 reader reports as having broken its
        blindness is itself a committed record.
      method: '`wc -l` over every file in the batch''s task-cards/ directory; grep for task-cards in the receipt.'
      result: >-
        IT IS NOT, AND THIS IS THE LARGEST AUDITABILITY GAP IN THE PACKAGE. All eight
        committed task cards are five-line stubs naming role, policy, budget, handoff
        path and write scope. The substantive dispatch text — including the text the
        -005 reader quotes as having disclosed both prior positions on SPEC-10 axis B —
        exists nowhere in the repository, and no task card is bound by the archive. THE
        ONLY EVIDENCE OF THE CONTENT OF THE CARD THAT BROKE BLINDNESS IS THE AFFECTED
        READER'S OWN QUOTATION OF IT. A blindness protocol whose breaches are recorded
        only by the party affected by them cannot be independently scoped, and this
        record's own scoping of that breach (F-9) is correspondingly bounded.
    - id: AC-7
      check: All five substantive deliverables parse as strict YAML/JSON with no duplicate keys.
      method: >-
        yaml.safe_load and json.load in this session over panel-spec.yaml,
        freeze-receipt.json, verdict-tables.yaml, protocol-amendment-GOAL-AES-002-005.yaml,
        verdict-tables-005.yaml, verdicts-sealed-preread.yaml and snapshot-receipt.json.
      result: >-
        PASS, 7 of 7. All loaded without error. Duplicate keys are not separately
        detectable by safe_load, which silently keeps the last; NO DEDICATED
        DUPLICATE-KEY SCAN WAS RUN, so the no-duplicate-keys half of this check is
        OPEN AND UNATTEMPTED — not tried, not screened, not negative.

  # =====================================================================
  # METRIC RECOMPUTATIONS — every count re-derived from the cells
