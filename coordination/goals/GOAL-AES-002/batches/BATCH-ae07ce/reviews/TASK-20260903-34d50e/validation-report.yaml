  what_this_record_is_not:
    - >-
      NOT A CLAIM ABOUT AES AT ANY ROUND COUNT, in any direction. This is protocol
      measurement work. Claim ceiling of everything below: SPECIFICATION RESULT ONLY.
    - >-
      NOT AN ADJUDICATION OF THE COST MODEL. This record does not decide whether any
      clause of CM-1 or of amendments 003/004/005 gives the right answer for any
      construction. Where it recomputes a rule application it does so to test whether a
      producer's own stated control reaches what the producer says it reaches.
    - >-
      NOT A DECISION. It moves no hypothesis, approves no experiment, promotes no
      knowledge and closes no goal. A passed or incomplete validation makes a receipt
      admissible as evidence; it authorises nothing.
    - >-
      NOT A SECOND READING OF THE PANEL. This task did not classify the ten
      specifications against any text and its verdict does not corroborate or contradict
      any cell of any column.
    - >-
      NOT AN INDEPENDENT-FAMILY CHECK. See finding F-13: this session resolved to the
      same model family as every producer in the batch, and says so before anything
      below is read as corroboration.

  run_ids: []
  run_ids_note: >-
