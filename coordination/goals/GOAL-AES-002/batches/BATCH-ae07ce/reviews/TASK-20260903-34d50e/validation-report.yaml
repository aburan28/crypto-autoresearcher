        published record's `budget` block, which quotes both clock readings. The seal
        block itself does not reconcile them.
      agrees: partial

  # =====================================================================
  # CONTROL CHECKS
  # =====================================================================
  control_checks:
    - control: CC-1 — the 003 null-object control was actually run and is not a copy of the 004 table
      required_by: 'RT-20260901-3ad5d2 RC-6; DEC-20260901-d264ea; this task''s handoff'
      performed: true
      method: >-
        Cell by cell and field by field, mechanically, over all 20 cell pairs: exact
        string comparison of one_sentence_reason and clauses_relied_on, tuple comparison
        of (verdict, determinacy, confidence), and a SequenceMatcher similarity ratio on
        the reason text. Not read off any summary.
      result: >-
        PASS, AND NOT MARGINALLY. ZERO of 20 cells share a one_sentence_reason string.
        15 of 20 cells cite DIFFERENT clauses — the two texts are cited by different
        names throughout (T-004 SPEC-01.A cites ['A-3(i)','A-1']; T-003 SPEC-01.A cites
        ['-003 Route 3, first sentence and closing catch-all']). 11 of 20 cells differ in
        at least one of verdict, determinacy and confidence. Reason-text similarity is
        below 0.40 on 12 of 20 cells and never reaches 0.71. The nine cells with an
        identical (verdict, determinacy, confidence) triple are the seven
        NOT_ENGAGED-in-both cells plus SPEC-02.A and SPEC-09.B, and both of those two are
        re-argued from different clauses with different words. THE NULL TABLE IS AN
        INDEPENDENT CLASSIFICATION, NOT A COPY.
    - control: CC-2 — the panel was frozen before any amendment-005 text existed
      performed: true
      method: >-
        VERIFIED IN THIS SESSION BY GIT, not accepted on any record's attestation.
        `git ls-tree --name-only <c> coordination/goals/GOAL-AES-002/amendments/` at
        7d895a33b, d6f309ad7 and 85383bc7c; `git log --all --oneline -- <the -005 path>`;
        `git show -s --format=%cI` on each.
      result: >-
        PASS. At 7d895a33b (2026-09-04T15:35:13Z, "preserve TASK-20260903-59e9b9 panel
        output") the amendments directory holds -001 through -004 and no -005. At
        d6f309ad7 (16:09:58Z, "preserve TASK-20260903-373afa verdict tables") the same.
        -005 first appears at 85383bc7c (16:44:44Z) and `git log --all` for that path
        returns exactly one commit. So the panel AND the T-004/T-003 columns both
        predate the -005 text on every ref this repository carries. The panel's own
        `frozen_before` block claimed only working-tree observations and explicitly
        deferred the binding proof to the archive; that deferred proof is now discharged
        by this check.
    - control: CC-3 — the m=0 proves-too-much check was re-run, not inherited
      required_by: RT-20260901-3ad5d2 RC-3, third limb
      performed: true
      result: >-
        RE-RUN, NOT INHERITED — AND ITS PASS IS CONTINGENT ON AN UNDECLARED CONVENTION.
        Amendment 005's control PT-1 is written against the NEW clauses B5-1 and B5-3,
        not against -004's B-1: it names the clause under test, restates the object,
        applies B5-1's antecedent to it, records the outcome BUNDLED, carries its own
        non-degeneracy argument, and discloses the limit it inherits from -004's version
        (at m=0 no stage boundary exists, so no boundary clause is active on this
        object). Three further controls PT-2, PT-3, PT-4 exist expressly to reach what
        PT-1 cannot. That is a genuine re-run.
      the_gap_this_session_confirmed_independently: >-
        PT-1's pass turns on reading "the cost the claim charges for work performed PER
        MEMBER OF THAT SET" as charge-per-TESTED-member. PT-1 asserts that value is ONE
        AEU-k and never states which denominator produces it. CM-1's element (b) declares
        `declared_once_and_binding_on_both_sides: average_case` and charges the
        definitional reference at 2^(k-1) AEU-k (CM-1 lines 234-236), with the
        partial-key residual at 2^(k-m-1) (line 290). Total charge divided by ENUMERATED
        set size is therefore one half AEU-k, which is strictly less than one AEU-k, so
        B5-1's antecedent becomes TRUE and the separate charge attaches to the
        definitional reference itself. PT-1's non-degeneracy argument reasons about
        whether the threshold is inclusive or strict, which is a different axis and does
        not reach this. THIS CONFIRMS, FROM CM-1's OWN COMMITTED TEXT AND WITHOUT RELYING
        ON THE -005 READER'S ACCOUNT, the relocation the -005 column records as R1. RC-3's
        stated pass condition — "the reference must still classify as BUNDLED, or the
        repair is worse than the defect" — is met under one denominator and fails under
        the other, and the amendment does not say which one governs.
    - control: CC-4 — a null-object control for the -005 column
      performed: false
      result: >-
        NONE EXISTS. The -005 column was classified against one text only. There is no
        T-005-versus-superseded-text pairing by the -005 reader, and no third column
        against an empty rule text (CM-1 alone) by anybody. The T-004 reader proposed
        exactly that third column and recorded it as OPEN AND UNATTEMPTED; it remains so.
        CONSEQUENCE: the -005 column's determinacy has no within-reader baseline, so
        nothing in it can distinguish "this text decides these cells" from "this reader
        decides these cells". The 003 control gives the T-004 column that baseline; the
        T-005 column has no counterpart.
    - control: CC-5 — determinacy is not being read as agreement, nor indeterminacy as disagreement
      performed: true
      result: >-
        THE PRODUCERS' OWN GUARD IS CORRECT AND IS NOT SUFFICIENT. What they do right:
        the seven cells reading NOT_ENGAGED under both texts are excluded from every
        informative count, and I re-derived that set independently and got the same
        seven, so no cell that engages neither text is being counted as agreement or as
        disagreement. Both producers also state in terms that determinacy is a PROXY for
        agreement and that agreement itself is unmeasured. FOUR RESIDUAL CHANNELS THEY DO
        NOT FULLY CLOSE, derived here.
      residual_channels:
        - id: CH-1
          finding: >-
            FIVE OF THE SEVEN 004-versus-003 differences are of the form "003 undetermined,
            004 determinate" (SPEC-01.A, SPEC-03.A, SPEC-06.A, SPEC-07.A on axis A;
            SPEC-05.B on axis B). Only TWO are determinate-to-determinate reversals
            (SPEC-04.B, SPEC-10.B), and both run in the same direction,
            BUNDLED_NO_SEPARATE_CHARGE under -003 to SEPARATE_CHARGE_APPLIES under -004.
            So the control's headline is overwhelmingly a measurement of RESOLVED
            INDETERMINACY, not of changed answers. That is a legitimate thing to measure
            and it is what a null-object control should show; it is not the same
            quantity as agreement and the 7-of-13 figure should never be quoted as one.
        - id: CH-2
          finding: >-
            DETERMINACY PURCHASED BY SCOPE REDUCTION IS COUNTED AS DETERMINACY. SPEC-01
            axis B reads SEPARATE_CHARGE_APPLIES / FORCED / HIGH under -004 and
            NOT_ENGAGED_BY_THIS_SPECIFICATION under -005: B5-3's partial-key exclusion
            removes the cell from the test's domain rather than answering it. On the
            fixed 13-cell informative surface that the 004/003 comparison uses, -005
            leaves 3 undetermined and 1 newly-not-engaged against -004's 0 undetermined
            and 0 not-engaged. A text that answers fewer questions can look more
            determinate on any metric that only counts the questions it still asks. The
            -005 record does disclose the exclusion as "its ONE reduction in charge"; what
            is not disclosed is that the exclusion also changes the denominator of its own
            determinacy statistic.
        - id: CH-3
          finding: >-
            THE THREE COLUMNS ARE PUBLISHED ON TWO DIFFERENT DENOMINATORS. "5 of 13
            informative" and "0 of 13 informative" use the pairwise definition
            (NOT_ENGAGED under both compared texts); "3 of 12 informative" uses a
            single-column definition (not NOT_ENGAGED in this column). The line that puts
            all three side by side therefore mixes them. The -005 record flags this and
            supplies an alternative count, which is the right handling; the mixed line
            still travels first and is the one a summary will lift.
        - id: CH-4
          finding: >-
            THE 004-VERSUS-005 CONTRAST IS NOT A TEXT CONTRAST AT ALL. T-003 and T-004
            share a reader; T-005 does not share that reader with either. Every difference
            between the -005 column and the -004 column confounds text with reader, and
            the design contains nothing that separates them. The -005 record states this
            first and caps everything after it, which is correct and is corroborated here.
    - control: CC-6 — inter-reader agreement, the operative claim under test
      performed: false
      result: >-
        MEASURED ON ZERO CELLS BY THIS BATCH, AND THIS IS THE SINGLE MOST IMPORTANT
        FINDING IN THIS REPORT. Derived by inspection of who classified what: TASK-373afa
        produced the T-004 and T-003-SUPERSEDED columns; TASK-9318b5 produced the T-005
        column. NO ITEM-AND-AXIS ANYWHERE IN THE PACKAGE CARRIES TWO INDEPENDENT READINGS
        OF THE SAME TEXT. RC-6's operative question — whether two conforming readers of
        the same rule text reach the same verdict — therefore has exactly the same number
        of measurements after this batch as before it, namely none. What the batch DOES
        measure is real and worth having: one reader's determinacy under three texts,
        with a genuine within-reader null-object control on two of them, against a panel
        frozen before the third text existed. Both producers say this in terms and
        neither claims otherwise. It is restated here because the batch's purpose
        sentence ("whether successive repairs actually make two conforming readers
        agree") will outlive the caveats attached to it.
    - control: CC-7 — the model-independence null
      performed: true
      method: Read the inference block of every deliverable in the batch and of this session.
      result: >-
        THE DECLARED REPAIR IS REALISED IN ZERO TASKS. batch.yaml's
