  what_this_record_is: >-
    THE INDEPENDENT VALIDATION OF THE BATCH-ae07ce PACKAGE, performed against the
    Coordinator-committed snapshot 4f5115ad0c53123cd4ff997123c2f96ed432a20c and against
    that snapshot only. Every number below was derived in this session from the
    committed artifacts by parsing and hashing them; none was taken from a producer's
