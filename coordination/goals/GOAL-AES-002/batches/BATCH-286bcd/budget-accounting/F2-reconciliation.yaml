    across a 1600 s producer task, per envelope-receipt.json's own
    measurement_sessions block) meant no single session's stamps covered the
    task's own tail. This is the mechanism C5 itself names ("a producer stamp
    ends at its final write and cannot cover the task's tail, so it
    systematically understates") operating exactly as predicted, not a new
    defect class.

