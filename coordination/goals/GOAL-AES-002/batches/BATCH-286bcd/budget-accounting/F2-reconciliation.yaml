  instrumentation_defect_this_confirms_not_newly_discovers: >-
    Consistent with VAL-20260831-9fc65d finding F6 (INFORMATIONAL): the C2
    stamp duty is written against sessions that can read a live clock and does
    not degrade gracefully in one that cannot. TASK-20260810-1a81be COULD read
    a clock (its stamps are genuine, per-session, live values, unlike
    TASK-20260810-4a478d's and TASK-20260810-d8835b's fully-null DEF-CM1-CLOCK/
