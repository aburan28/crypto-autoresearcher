    red_team_1000_reuses_red_team_line: TASK-20260901-1af5d9
    ledger_archive_900_reuses_ledger_archive_line: TASK-20260901-5a44cc
  arithmetic: >-
    700 + 150 + 900 + 900 + 200 + 1600 + 150 + 1400 + 1000 + 900 = 7900. The
    campaign ceiling is UNBOUNDED (BUDGET-AMEND-20260828-16e34c); this figure
    is a declared sizing, not a draw against a finite total.
  declared_budgets_are_stop_conditions: >-
    A task that reaches its declared handoff.budget.wall_clock_seconds HALTS.
    That halt is infrastructure signal, never a negative mathematical result
    (AGENTS.md rule 5), and the dropped work is SCOPE, never an answer (rule
    8). The combined-snapshot line (200 s, TASK-20260901-420f4b) reuses the
    exact figure that overran to 742 s in BATCH-2b0fd1 (finding F2) and is
    named here as TIGHT AND MAY HALT ON BUDGET for the same reason.

