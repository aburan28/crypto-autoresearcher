claim_ceiling: >-
  protocol_repair_and_one_paired_ideation_validation_design_step_only. THIS
  BATCH ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT and dispatches NOTHING that
  could produce a cryptanalytic solve or a cost claim. It amends CM-1's
  interpretation to close three-and-a-half named reading ambiguities; applies
  BLK-1's already-specified certificate-vocabulary edits; repairs one
  arithmetic defect in an already-committed measurement receipt; reconciles one
  disclosed stamp-duty overrun under the adopted C5 mechanism; and produces a
  fully specified, NOT-YET-APPROVED, NOT-YET-EXECUTED heuristic-validation
  experiment design pairing candidate C2 with its required null-control and
  round-count-decay measurement. No key recovery, no distinguisher measurement,
  no margin, no barrier statement, and no comparison of any kind against the
  published state of the art is in scope. This batch does not re-run
  BATCH-2b0fd1's own RANK 1-3 acts.

objective: >-
  Execute DEC-20260810-6c00b4's five named next actions, and no more: (1) file
  a superseding versioned protocol amendment, protocol-amendment-GOAL-AES-002-003,
  resolving CM-1's three red-team-and-validator-confirmed R2 reading ambiguities
  (elements a; c/f jointly; d) plus the lower-severity distinguisher-bridge gap
  at (b)/(c), with concrete, unambiguous rule text, committed BEFORE any card
  that could produce a cryptanalytic solve or cost claim; (2) apply
  protocol-amendment-GOAL-AES-002-001's already-specified edits to
  `tools/validate_ledger.py`'s `check_run` and to
  `docs/claims-and-verification.md`'s (and `docs/evidence-and-reproducibility.md`'s)
  certificate-kind vocabulary, discharging BLK-1 in substance; (3) repair
  `envelope-receipt.json`'s F1 arithmetic defect (the 14-core decimal field) via
  a new correction record, leaving the validated log2 figures and the 1-core
  pure-Python throughput figure untouched; (4) record F2 (TASK-20260810-1a81be's
  542 s stamp-duty overrun) under the adopted C5 `on_record_not_charged`
  mechanism; (5) carry candidate C2 forward PAIRED with the heuristic-validation
  measurement design its own predicted-null claim requires — produced here as a
  frozen, reviewed, NOT-YET-DISPATCHED experiment design, not as an executed
  measurement.

parent_batch_carry_forward:
  cm1_defects_being_resolved:
    - "element (a): materiality threshold / third admissible conversion route for AddRoundKey-only auxiliary XORs (RT-20260831-1166f2 r2_element_dispositions[0])"
    - "elements (c)/(f) jointly: whether a residual encrypt-and-compare search's own AEU-k units bundle verification (RT-20260831-1166f2 r2_element_dispositions[2],[4])"
    - "element (d): the data coordinate's kind/count domination-order rule (RT-20260831-1166f2 r2_element_dispositions[3])"
    - "elements (b)/(c), lower severity: a distinguisher-to-AEU-k bridge, or an explicit ruling that none exists (RT-20260831-1166f2 r2_element_dispositions[1])"
  blk1_still_open_in_substance: >-
    Both files `tools/validate_ledger.py` and `docs/claims-and-verification.md`,
    independently re-read at HEAD by this drafting session, still show the
    pre-amendment vocabulary `kind: discrete_log | decomposition | none`
    (confirmed at tools/validate_ledger.py check_run lines 626/632 and
    docs/claims-and-verification.md line 33 as of this batch's opening); the
    documentation echo at docs/evidence-and-reproducibility.md line 119 is
    likewise unedited.
  f1_defect: >-
    envelope-receipt.json items.vi_ceiling.value.per_task_14_core_linear_assumed_aes_evals_decimal
    = 488600000000, independently confirmed wrong by both the red team and the
    validator against the receipt's own correctly-derived log2 figure (27.884,
    which implies ~247,770,710, not 488,600,000,000) — a factor of ~1972
    (~2^10.95) too large. The log2 figures (24.077/26.077/27.884) and the
    1-core pure-Python 11061.1924 evals/s/core KAT-verified figure are
    independently confirmed CORRECT by both reviewers and are NOT touched.
  f2_overrun: >-
    TASK-20260810-1a81be's committed snapshot-receipt.json section_boundary_stamps
    show elapsed_s 480 and 742 against a declared_wall_clock_seconds of 200 and
    a binding_stop_utc 200 s after start (18:23:20Z), with halted_on_budget left
    `false` and no overrun acknowledged in the receipt's own text (validator
    finding F2, MEDIUM severity).
  c2_candidate: >-
    C2 (object-enumeration.yaml candidate id C2): a paired-independent-key
    data-path Hamming-distance histogram, tracked round-by-round at the full
    round count, for two independently uniform random keys on one fixed
    plaintext with NO assumed algebraic relation between the keys. The sole
    candidate of seven (C1-C7) to pass the lossy-projection test AND
    deduplication AND concrete testability. Its `predicted_null_but_untested`
    survival score predicts (by a full-diffusion argument, at BELOW default
    confidence given this campaign's own PRIOR-4/H-AES-77230c key-schedule
    non-saturation finding) that the histogram reaches Binomial(128,1/2) by
    round ~2-4 and does not retain exploitable structure at the full round
    count.

