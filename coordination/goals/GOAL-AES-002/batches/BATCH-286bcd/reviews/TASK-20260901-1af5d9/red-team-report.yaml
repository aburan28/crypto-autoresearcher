    null_control_attack:
      target: >-
        arms.ARM-NULL (matched_null_control) and its interaction with
        seed_policy.
      finding: >-
        SEE objections and required_controls above for the full worked
        argument. In summary: seed_policy's SEED(key_size, arm, tier)
        formula is explicitly indexed by `arm` and states it is "used ONLY
        for that (key_size, arm, tier) combination's key draws," meaning
        ARM-REAL (arm_idx=0) and ARM-NULL (arm_idx=1) draw K, K' from
        DIFFERENT independent random streams under the design AS LITERALLY
        WRITTEN. This directly contradicts arms.ARM-NULL's own explicit
        factual claim that state_0 is "BYTE-IDENTICAL, sample for sample,"
        across arms "for the same (K,K') pair." If executed exactly as the
        seed_policy specifies, the two arms would NOT share an initial
        condition, and the design's own stated confound-control logic (the
        difference at r>=1 is attributable to round-key correlation
        structure, "not to a different starting point") would not actually
        hold -- an observed difference between ARM-REAL and ARM-NULL could
        then be confounded by genuinely different (K,K') samples rather than
        isolating the intended variable. This is a real, load-bearing,
        internally self-contradictory specification defect, not a stylistic
        nit: it undermines the SPECIFIC claim ARM-NULL exists to support.
      severity: MEDIUM_HIGH
      is_this_a_hidden_confound_or_a_specification_contradiction: >-
        Framed honestly: this is not evidence of a confound the design
        FAILS TO NAME (the design correctly identifies what needs to be
        held constant and why); it is evidence that the design's OWN
        MACHINERY (the seed_policy) does not actually implement what its
        OWN PROSE (arms.ARM-NULL) claims it implements. A future executor
        who follows seed_policy literally would run a DIFFERENT experiment
        than the one design-report.md describes, without any signal in
        either file that this happened.
      repair_action: >-
        See required_controls above: draw K, K' from a single,
        arm-independent stream per (key_size, tier, sample index), reserving
        a separate arm-specific stream only for ARM-NULL's additional 2*R
        round-key draws.

    decay_check_attack:
      target: >-
        invalidation_rules item 1 ("THE ROUND-COUNT DECAY CHECK") and its
        interaction with invalidation_rules item 4 and
        falsification_criterion's three-outcome enumeration.
      constant_excess_incorrectly_passing: >-
        CONSTRUCTED. A TVD_r(arm) series that is FLAT -- e.g. stays at 0.30
        (well above a plausible tau(N)) for every round r=1..R, never
        increasing and never decreasing -- satisfies "TVD_{r+1} <= TVD_r +
        tau(N)" at every consecutive pair (since TVD_{r+1} = TVD_r <= TVD_r +
        tau(N) trivially), so it passes invalidation_rules item 1 WITHOUT
        ever being flagged, despite manifestly failing to decay -- the
        canonical artifact tell docs/inventor-protocol.md section 3 names.
        Item 1, as literally worded, is therefore a JUMP/re-emergence
        detector, not a "did this series ever converge" detector.
      does_the_overall_design_still_catch_this: >-
        PARTIALLY, via a DIFFERENT mechanism than the one item 1 itself
        implements. `falsification_criterion` outcome (ii) explicitly
        catches "ARM-REAL persists... while ARM-NULL has already converged"
        (a flat, non-decaying ARM-REAL alongside a converging ARM-NULL is
        correctly read as a real, non-artifactual finding, precisely
        because the differential null-object control -- not item 1's jump
        test -- is doing the actual work). Outcome (iii) catches "both
        persist together." Both of these are correct extensions of
        docs/inventor-protocol.md section 3's principle (a persistent signal
        WITH a matched null that DOES decay is informative, not an
        artifact), not a violation of it -- this session tried to find a
        conflict between the design and the protocol here and did NOT find
        one.
      the_uncovered_case: >-
        A flat, non-jumping, persistently-elevated ARM-NULL series ALONE,
        while ARM-REAL converges normally by round 2-4 (i.e. only the null
        arm fails), is the MIRROR IMAGE of outcome (ii) and does not match
        outcome (i) (which needs both to converge) or outcome (iii)'s
        literal wording ("both persist together" -- here only one does).
        invalidation_rules item 4 is clearly INTENDED to route this case to
        "instrument flag, not an AES finding," but its trigger clause ("If
        ARM-NULL's OWN TVD_r series fails the round-count decay check")
        textually depends on item 1's definition, which -- per the
        constant-excess construction above -- a FLAT, non-jumping ARM-NULL
        failure would NOT trip. A future executor who hits exactly this
        pattern (a real, plausible implementation bug: e.g. round keys
        accidentally drawn with insufficient entropy, producing a stable,
        non-decaying bias rather than an erratic one) has genuine
        interpretive slack about how to report it, even though the design's
        own stated INTENT (item 4's title and prose) is unambiguous about
        what SHOULD happen.
      structural_signal_incorrectly_failing_attempted: >-
        Tried to construct the opposite direction (a real, converging signal
        wrongly invalidated by item 1's jump test). Because TVD_r and
        TVD_{r+1} are computed from the SAME evolving N trajectories one
        round apart (not independent fresh draws), and tau(N) is calibrated
        against i.i.d. fresh draws from the theoretical null rather than
        against the joint/correlated distribution of consecutive-round TVD
        values for the SAME trajectories, it is plausible that the true
        noise in the DIFFERENCE (TVD_{r+1} - TVD_r) is either smaller
        (if positively correlated, making item 1 needlessly lenient) or
        larger (if the calibration otherwise fails to transfer, making item
        1 spuriously trigger on a genuinely converging series) than tau(N)
        alone implies. This session could not determine the sign of this
        effect without running the design (out of scope, zero compute), so
        this is recorded as an UNRESOLVED METHODOLOGICAL QUESTION, lower
        confidence than the two findings above, not a demonstrated failure.
      severity: MEDIUM
      severity_rationale: >-
        The design's OVERALL decision procedure (the three-outcome
        falsification_criterion) mostly compensates for item 1's narrow
        literal scope, so this is not a fatal design flaw -- but the ONE
        case it does not clearly cover (ARM-NULL alone failing via a flat
        excess) is precisely the case a real implementation bug in the
        null-generation code is most likely to produce, and it is the case
        the design most needs to catch reliably, since a silent ARM-NULL
        failure would make ARM-REAL's own result uninterpretable without
        anyone being told so.
      repair_action: >-
        See required_controls above: reword invalidation_rules item 4 to
        trigger on ARM-NULL failing to reach and hold at-or-below tau(N) by
        round 4 (the SAME test already applied to ARM-REAL in
        falsification_criterion), independent of whether that failure
        manifests as a jump or a flat plateau. Separately, and lower
        priority: state explicitly whether tau(N)'s calibration (drawn from
        i.i.d. fresh Binomial(128,1/2) replicates) is asserted to transfer to
        the round-to-round DIFFERENCE statistic item 1 actually tests, or
        derive a separate calibration for that specific quantity.

