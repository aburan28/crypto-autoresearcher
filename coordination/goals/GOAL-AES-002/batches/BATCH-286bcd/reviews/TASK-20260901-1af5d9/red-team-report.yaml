        delta_high hex value 0xAAAA...AAAA = 4 set bits/byte x 16 bytes = 64,
        independently re-verified by hand and CONFIRMED correct).
      finding: >-
        CONFIRMED ZERO COMPUTE. No benchmark output, timing figure, or
        sampled statistic was found anywhere in either declared artifact.
        `not_yet_approved_not_yet_executed_statement.compute_run: false`,
        `approved: false`, `dispatched: false`, `executed: false` are all
