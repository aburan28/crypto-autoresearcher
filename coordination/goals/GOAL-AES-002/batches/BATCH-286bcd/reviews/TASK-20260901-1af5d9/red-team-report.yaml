    zero_compute_confirmation:
      method: >-
        Listed every file under this task's directory
        (coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/)
        with `find`: exactly the two declared artifacts
        (c2-paired-validation-design.yaml, design-report.md) exist, no
