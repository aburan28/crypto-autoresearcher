  # =====================================================================
  # OBJECTIONS (summary; full worked detail is under
  # amendment_block_dispositions and c2_design_attack below)
  # =====================================================================
  objections:
    - >-
      ELEMENT (a) ROUTE 3: the phrase "no other bytewise operation (no
      independent ShiftRows/MixColumns computation...)" does not define what
      "independent" means, and a fused-table (T-table) implementation -- in
      which one memory lookup performs SubBytes, ShiftRows and part of
      MixColumns simultaneously -- is a genuinely realistic case two
      conforming readers can classify oppositely: as "the S-box route" (Route
      1's N is a specification-structure count, agnostic to implementation
      fusion) or as "an independent ShiftRows/MixColumns computation" (the
      linear step DID happen, merely for free). T-table implementations are
      the ORDINARY way to implement AES fast, not a contrived edge case.
    - >-
      ELEMENTS (c)/(f): the operative test the new text supplies --
      "generating a candidate and verifying it against the target ciphertexts
      are genuinely distinct computational acts" -- is under-determined on its
      own literal wording, because a naive reading (any two procedurally
      separate steps count as "distinct acts") would also cover the
      DEFINITIONAL REFERENCE's own "pick the next key, then encrypt and
      compare" two-step loop, which the SAME resolving text explicitly
      classifies as bundled "encrypt-and-compare enumeration." The text
      therefore requires an UNSTATED, narrower sense of "distinct" (distinct
      in computational KIND/cost, not merely in procedural sequencing) to be
      self-consistent, and a genuinely hybrid guess-and-determine attack
      (algebraic pre-filter followed by a final encrypt-and-compare on
      survivors) sits exactly on the boundary the text does not resolve.
    - >-
      ELEMENT (d): the two-axis (kind, count) sub-lattice model implicitly
      assumes an attack's ENTIRE data requirement reduces to a SINGLE (kind,
      count) pair. It states no rule for a genuinely mixed-kind attack (e.g.
      some known-plaintext queries plus a smaller number of adaptively-chosen
      queries). In the cases this session constructed, the DOMINANCE VERDICT
      does not actually diverge across readings (any presence of a strictly
      stronger kind forces "incomparable" regardless of how counts are
      aggregated), but the mandatory disclosure duty ("with both (kind,
      count) pairs stated explicitly") has no stated rule for WHICH count to
      report for a mixed-kind attack -- a narrower, disclosure-content gap
      rather than a verdict-level one.
    - >-
      ELEMENTS (b)/(c) DISTINGUISHER BRIDGE: attacked and HELD. The
      unconditional sentence "NO AEU-k figure is computed or claimed for a
      distinguisher under this model" forecloses even a smuggled
      "AEU-k-denominated processing cost, reported separately from the
      comparison" reading this session tried to construct. RQ-AES-002 R7's
      distinguisher completion condition was independently re-read directly
      from ledger/questions/RQ-AES-002.yaml (not merely trusted from the
      amendment's quotation) and is satisfiable under the amendment's tuple
      almost verbatim. One PRE-EXISTING, amendment-untouched gap is named:
      neither R7 nor the amendment states whether the "matched
      random-permutation control" must match the distinguisher's data KIND
      (known/chosen/adaptive), not merely its query COUNT -- inherited from
      R7 itself, not introduced by this amendment, and out of this
      amendment's stated scope.
    - >-
      C2 DESIGN, ARM-NULL ISOLATION: the design's own `seed_policy` block
      ("SEED(key_size, arm, tier) := ...", arm-indexed, "used ONLY for that
      (key_size, arm, tier) combination's KEY draws; no seed is shared or
      reused across combinations") directly CONTRADICTS the `arms.ARM-NULL`
      block's own factual claim that "state_0 in this arm is BYTE-IDENTICAL,
      sample for sample, to state_0 in ARM-REAL for the same (K,K') pair."
      As LITERALLY specified, ARM-REAL (arm_idx=0) and ARM-NULL (arm_idx=1)
      draw K, K' from DIFFERENT, INDEPENDENT random streams, so their (K,K')
      values will almost certainly DIFFER, meaning state_0 will NOT actually
      be shared across arms -- undermining the design's own stated
      confound-control logic ("holds the ONE nuisance variable... constant
      across arms so that a difference... is attributable to the round-key
      CORRELATION STRUCTURE under test, not to a different starting point").
    - >-
      C2 DESIGN, DECAY CHECK: `invalidation_rules` item 1, labeled "THE
      ROUND-COUNT DECAY CHECK... this design's central... invalidation
      rule," as LITERALLY worded ("TVD_{r+1}(arm) must not exceed
      TVD_r(arm) + tau(N)") is a round-to-round JUMP/re-emergence detector,
      not a "did this series ever actually decay" detector: a FLAT,
      persistently-elevated, never-increasing TVD series in either arm
      passes it cleanly. The actual convergence judgment is made elsewhere
      (`falsification_criterion`'s three enumerated outcomes), and that
      three-way enumeration does not explicitly cover the specific case
      "ARM-NULL alone fails to converge (via a flat, non-jumping excess)
      while ARM-REAL converges normally" -- the mirror image of outcome (ii),
      and distinct from outcome (iii)'s "both persist together" wording.
      `invalidation_rules` item 4 is clearly INTENDED to route this case to
      "instrument flag," but its trigger text ("If ARM-NULL's OWN TVD_r
      series fails the round-count decay check") textually points back at
      item 1's narrow jump-based test, which a flat excess would not trip.

  required_controls:
    - >-
      Before any real cost claim is filed citing Route 3 (element a), require
      the submitter to STATE explicitly whether their implementation fuses
      ShiftRows/MixColumns into the same table access as the S-box lookup
      (a T-table or similar construction) and, if so, which of the two
      readings above it applies -- until a superseding amendment defines
      "independent" precisely (e.g. "an operation is independent of the
      S-box route if and only if its cost is not already fully absorbed into
      a single memory access whose count is already being charged under
      Route 1").
    - >-
      A proves-too-much-style sanity check, offered here as an internal
      consistency argument (not assigned to this task as the formal
      proves_too_much control -- that is TASK-20260901-4c225b's joint, per
      this round's blindness rule, and is not read or duplicated here):
      applying the naive "any procedurally separate generation step counts as
      distinct" reading of the (c)/(f) resolving text to the m=0 reference
      itself (pick-a-key, then encrypt-and-compare) would incorrectly imply
      element (f)'s separate verification charge applies to the reference,
      contradicting the SAME resolving text's own explicit classification of
      the reference as bundled. This is offered as evidence that SOME
      narrower, cost/kind-based sense of "distinct" is intended, not as a
      resolution the text itself states.
    - >-
      Before the C2 design is dispatched, the seed_policy's arm-indexing
      should be corrected so that K and K' are drawn from a SINGLE,
      arm-independent stream per (key_size, tier, sample index), with a
      SEPARATE, arm-specific stream reserved only for the additional 2*R
      round-key draws ARM-NULL alone needs -- otherwise the design's central
      confound-control claim ("same starting point across arms") is false as
      literally specified, and any executor who follows the seed_policy
      exactly as written will not actually be running the design its own
      prose describes.
    - >-
      Before the C2 design is dispatched, `invalidation_rules` item 4 should
      be reworded to trigger on ANY failure of ARM-NULL to reach and remain
      at-or-below tau(N) by round 4 (matching the SAME convergence-window
      test `falsification_criterion` already applies to ARM-REAL), rather
      than on "fails the round-count decay check" (which textually points at
      item 1's narrower jump test and would not catch a flat, non-jumping,
      persistently-elevated ARM-NULL series) -- so a genuine null-control
      failure is not left partially undetected by name even though the
      falsification_criterion's outcome (iii) fallback would likely absorb
      the CASE WHERE ARM-REAL ALSO fails, the specific case where ONLY
      ARM-NULL fails is not clearly routed to any of the three named
      outcomes as worded.

  counterexample_or_mutation: >-
    Two worked counterexamples showing a genuine residual or newly
    constructed reading divergence survive the amendment: (i) element (a)
    Route 3's undefined "independent" boundary, applied to a T-table-fused
    implementation performing S-box applications and AddRoundKey XORs with
    ShiftRows/MixColumns folded into the same lookups -- two conforming
    readers classify this attack oppositely (admissible under Routes 1+3, or
    INADMISSIBLE/UNADJUDICABLE for performing "an independent
    ShiftRows/MixColumns computation"). (ii) elements (c)/(f)'s "genuinely
    distinct computational acts" test, applied to a guess-and-determine
    hybrid (a real algebraic pre-filter stage followed by a final
    encrypt-and-compare on survivors) -- two conforming readers disagree on
    whether the pipeline's OVERALL candidate-generation mechanism is
    "encrypt-and-compare enumeration" (bundled, no extra charge) or
    "algebraic elimination" (separate N-survivors verification charge
    applies). RT-20260831-1166f2's OWN original two counterexamples for these
    same elements ARE closed by the new text when re-applied unchanged (see
    amendment_block_dispositions below for both re-applications, worked in
    full). Element (d)'s original counterexample is also closed, and this
    session's own new SAME-kind-fewer-queries and mixed-kind attempts either
    confirm the intended behaviour or surface only a disclosure-format gap,
    not a verdict-level split. Element (b)/(c)'s distinguisher bridge is
    attacked and HOLDS against every reading this session tried.

  baseline_comparison: >-
    NOT APPLICABLE AND NOT ATTEMPTED, per SC-6 and this task's own
    prohibition on any state-of-the-art comparison. RQ-AES-002 is a
    block-cipher key-recovery/distinguisher question, not a discrete-log
    question, so agents/red-team.md responsibility 2's named baselines
    (Pollard-rho, BSGS, closest specialized baseline) have no object to
    compare against in this task, exactly as RT-20260831-1166f2 already
    recorded for the same reason. Recorded explicitly rather than silently
    omitted.

  # =====================================================================
  # PART 1 -- THE FOUR RESOLVING-TEXT BLOCKS, EACH ATTACKED BY NAME
  # =====================================================================
  amendment_block_dispositions:
    - block: item_1_element_a_route_3
      closes: AMB-1
      original_counterexample_reapplied: >-
        RT-20260831-1166f2's own case: "N isolated S-box evaluations plus a
        small number of accompanying AddRoundKey-style XORs needed to
        combine partial key guesses with data." Re-applying Route 3: the
        S-box term converts at N/S_k, the AddRoundKey term at X/X_k, total
        (N/S_k + X/X_k) AEU-k -- a SINGLE, determinate figure both readers
        now compute. Reviewer A (finite number) and Reviewer B
        (UNADJUDICABLE) from the original report NO LONGER DIVERGE: the
        original split is CLOSED.
      new_counterexample_attempted: >-
        Constructed a THIRD-operation-type case as the task instructs: an
        attack whose cost is dominated by N T-TABLE lookups -- a standard
        fast-AES implementation technique in which ONE memory access
        simultaneously performs one SubBytes byte substitution, its
        ShiftRows relabelling, and its contribution to MixColumns -- plus X
        AddRoundKey byte-XORs to combine partial key guesses with data, and
        no other operation. This is the ordinary case for a realistic fast
        attack implementation, not a contrived one.
      concrete_reading_found: >-
        Route 3's text bars "no independent ShiftRows/MixColumns
        computation" without defining "independent." Reader A: the ShiftRows
        and partial-MixColumns work genuinely HAPPENED (a permutation and a
        finite-field multiply were computed, even if folded into the same
        lookup as the S-box substitution), so this attack performed
        ShiftRows/MixColumns computation and is INADMISSIBLE under Route 3,
        recorded UNADJUDICABLE, exactly as CM-1's original blanket rule
        would have said before the amendment. Reader B: "independent" means
        "not already absorbed into the SAME primitive Route 1 already
        counts" -- a T-table lookup instantiates ONE S-box application per
        the specification's own structure (S_k counts SubBytes calls, not
        implementation technique), and the fused linear steps cost the
        attack NOTHING BEYOND that one lookup, so nothing "independent" of
        the S-box route occurred; this attack is admissible under Routes
        1+3 and converts at (N/S_k + X/X_k) AEU-k, identical in form to the
        first (closed) counterexample. These are OPPOSITE dispositions
        (a determinate finite figure vs. UNADJUDICABLE) for the identical
        attack, and the amendment's text does not supply a rule to choose
        between them -- the same shape of gap RT-20260831-1166f2 found in
        the pre-amendment text, now relocated to the word "independent"
        rather than to the absence of any Route 3 at all.
      severity: MEDIUM
      severity_rationale: >-
        Narrower than the ORIGINAL gap (which produced opposite
        dispositions for essentially every realistic attack, since almost
        none perform zero auxiliary XOR work at all) because Route 3 now
        closes the overwhelming majority of realistic cases cleanly. This
        residual gap is triggered specifically by FUSED/table-driven
        implementations, which are nevertheless a standard and likely
        technique for any attack this campaign would actually build, so it
        is not contrived, but it is a strictly smaller surface than the
        gap the amendment was written to close.
      residual_gap_acceptable_or_needs_repair: >-
        NEEDS REPAIR, per the task card's explicit instruction to state this
        plainly. A named, numbered definition of "independent" -- e.g. "an
        operation's cost is independent of the S-box route if and only if it
        is not already fully absorbed into a table access or computation
        whose count is already being charged under Route 1 for the SAME
        byte" -- would close this residual gap the same way Route 3 closed
        the original one. Until then, a margin built on a T-table-style
        attack is not adjudicable under the amendment's stated text alone.
      repair_action: >-
        A superseding amendment should add a numbered clause: "for the
        purpose of the 'no independent ShiftRows/MixColumns computation'
        bar, an operation folded into the SAME table access or computation
        already counted as one S-box application under Route 1 (e.g. a
        T-table lookup performing SubBytes, ShiftRows and partial
        MixColumns in one access) is NOT an independent operation and does
        not trigger inadmissibility; an operation performed as a SEPARATE
        computational step, even if algebraically equivalent to a linear
        combination the fused table already captures, IS independent and
        does trigger it."

    - block: item_2_elements_c_f_joint
      closes: AMB-2
      original_counterexample_reapplied: >-
        RT-20260831-1166f2's own case: a partial-key-recovery attack whose
        residual over unrecovered bits is an ordinary exhaustive search
        (encrypt-and-compare, stopping at the first match). Re-applying the
        new text: this residual search "proceeds by DIRECT
        ENCRYPT-AND-COMPARE ENUMERATION," so verification is "ALREADY
        BUNDLED into each search AEU-k," exactly as the definitional
        reference itself is charged; element (f)'s separate N-unit charge
        does NOT additionally apply. Both readers now agree: the original
        ~2x spread is CLOSED.
      new_counterexample_attempted: >-
        Constructed the hybrid the task card names: a guess-and-determine
        attack whose residual search first runs a real, non-trivial
        ALGEBRAIC PRE-FILTER over the candidate key-bit space (eliminating
        the overwhelming majority of the 2^(k-m) candidates via a partial
        linear/algebraic constraint check, genuinely distinct computation
        from an AES evaluation), and then runs an ordinary encrypt-and-
        compare check ONLY on the small set of survivors.
      concrete_reading_found: >-
        The new text's operative test is whether "generating a candidate
        and verifying it against the target ciphertexts are genuinely
        distinct computational acts." Taken at face value (any two
        procedurally separate steps are "distinct acts"), this test would
        ALSO classify the DEFINITIONAL REFERENCE's own "pick the next key,
        then encrypt and compare" two-step loop as having distinct acts --
        which the SAME resolving text explicitly rules is bundled
        "encrypt-and-compare enumeration," not separately charged. The text
        is therefore only self-consistent under an UNSTATED narrower
        reading of "distinct" (distinct in computational KIND/cost, not
        merely in procedural sequencing), and the amendment never states
        which reading governs. Reader A, applying the algebraic-elimination
        exemplar the text itself supplies ("algebraic elimination, sieving,
        or any method where generating a candidate and verifying it... are
        genuinely distinct"), classifies the WHOLE pipeline's
        candidate-generation mechanism as algebraic elimination (since the
        overwhelming majority of the work culling 2^(k-m) candidates down
        to a small survivor set is genuinely NOT an AES evaluation), and
        charges element (f)'s separate N_survivors verification units on
        top of the pre-filter's own cost. Reader B classifies the pipeline
        as an optimised implementation of encrypt-and-compare enumeration
        (every surviving candidate STILL receives an ordinary
        encrypt-and-compare check identical in kind to the reference's own,
        and the pre-filter is merely an accelerant on the SAME loop, not a
        different candidate-generation MECHANISM), bundling verification
        with no separate charge. These are genuinely different totals (an
        additional N_survivors AEU-k term present under Reader A, absent
        under Reader B), and while N_survivors is typically small by
        construction (the whole point of a guess-and-determine pre-filter is
        aggressive pruning), the interpretive gap persists and the amendment
        supplies no rule to close it for a genuinely two-stage pipeline.
      severity: MEDIUM
      severity_rationale: >-
        Smaller in absolute numeric impact than the ORIGINAL ~2x-wide gap
        (which applied to essentially the whole residual-search figure),
        since the disputed term here is bounded by the survivor count after
        aggressive pruning, which a competent attacker keeps small by
        design. But guess-and-determine methods combining an algebraic
        pre-filter with a final verification pass are a standard, likely
        real-attack shape for this campaign, not a contrived edge case, so
        the interpretive gap is live rather than academic.
      repair_action: >-
        A superseding amendment should add one clause disambiguating
        "genuinely distinct computational acts": e.g. "a candidate-culling
        step whose own per-candidate cost is itself counted in AEU-k under
        elements (a)-(c) (i.e., it is ALREADY being charged as attack work)
        is not, by that fact alone, a mechanism 'other than encrypt-and-
        compare enumeration' for the survivors it passes through; element
        (f)'s separate verification charge applies only to the survivors of
        such a stage, not to candidates eliminated before it, and the
        pre-filter's own cost is charged separately under whichever element
        governs its own operation type." This closes the multi-stage case
        the same way the single-sentence fix closed the original one.

    - block: item_3_element_d_two_axis_sublattice
      closes: AMB-3
      original_counterexample_reapplied: >-
        RT-20260831-1166f2's own case: an attack needing fewer CHOSEN
        plaintexts than the reference's 2 (or 3) KNOWN pairs (e.g. 1 chosen
        query). Re-applying the new text: kind_A (chosen) is STRICTLY
        STRONGER than kind_R (known), so per the rule's own explicit final
        sentence ("A chosen-plaintext requirement, however few queries, is
        therefore a strictly stronger requirement than the reference's
        known-plaintext requirement and never wins the data coordinate
        outright on count alone"), the data coordinate is INCOMPARABLE.
        Both readers (the original "lexicographic-in-kind" reader and the
        original "count-only" reader) now agree: the original split
        (dominates vs. merely incomparable) is CLOSED, and the amendment's
        own text pre-empts exactly this case by name.
      new_counterexample_attempted: >-
        (1) Per the task's own instruction: an attack needing the SAME kind
        (known) but STRICTLY FEWER queries than the reference (e.g. 1 known
        pair vs. AES-128's reference 2). kind_A = kind_R (no stronger) AND
        count_A (1) <= count_R (2) -> the data coordinate is NO WORSE,
        correctly letting this attack dominate in data (or at minimum not
        lose the coordinate) as the task asked to confirm. CONFIRMED
        CORRECT, no divergence. (2) A genuinely MIXED-kind attack: some
        known-plaintext queries plus a smaller number of adaptively-chosen
        queries, testing whether the two-axis model (a SINGLE (kind, count)
        pair) has a stated reduction rule for a data requirement that is not
        homogeneous in kind.
      concrete_reading_found: >-
        For every mixed-kind instance this session constructed, the
        DOMINANCE VERDICT itself does not actually diverge across plausible
        readings: because ANY presence of a strictly-stronger-kind component
        (adaptive or chosen) forces kind_A to read as at least that strong
        under every natural aggregation rule this session tried (supremum-
        kind, per-kind decomposition, or worst-component), and the rule's
        own text already makes a strictly stronger kind incomparable
        REGARDLESS of count -- so the verdict lands at INCOMPARABLE under
        every reading tried, with no split found. What IS unresolved is a
        narrower DISCLOSURE-CONTENT question: the rule requires "both (kind,
        count) pairs stated explicitly," but for a mixed-kind attack (say, 5
        known pairs plus 1 adaptively-chosen query) it does not state
        whether the reported count_A is the TOTAL query count across kinds
        (6), the count of just the strongest-kind component (1), or a
        decomposed multi-line disclosure -- a genuine gap in what gets
        written down, not in what gets concluded.
      severity: LOW
      severity_rationale: >-
