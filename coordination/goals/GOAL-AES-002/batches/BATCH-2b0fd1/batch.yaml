standing_constraints_identical_language:
  basis: >-
    GOAL-AES-002 next_action requires that every card carry these in IDENTICAL
    LANGUAGE across producing and archival cards. The full text is written once,
    verbatim and unmodified, in the "STANDING CONSTRAINTS" section of each of the
    nine task cards under task-cards/, and the same items appear as `constraints`
    entries in each ledger handoff.
  items:
    - SC-1 the C2 stamp duty with a computed binding_stop_utc and the stamps committed as a declared artifact
    - SC-2 the C4 authoring-inclusive declaration basis with compute reported separately
    - SC-3 the covering-manifest clause and the closed case-insensitive class vocabulary
    - SC-4 the R5 anti-laundering clause quoted verbatim from RQ-AES-002, as a completion gate on every deliverable
    - SC-5 no card may cite a recalled literature figure as authority, in either direction
    - SC-6 no card may ask for a comparison against the published state of the art
    - SC-7 every deliverable stating a margin carries the R5 clause in the same sentence
    - SC-8 no reduced-round finding produced under this goal may be asserted here
    - SC-9 anything not attempted is named OPEN AND UNATTEMPTED and is never recorded as tried, screened or negative
    - SC-10 fabricate nothing; an unknowable field stays null
    - SC-11 never select, configure, probe, contact or use Amazon Bedrock
  how_the_stamp_duty_is_committed_without_an_undeclared_path: >-
    RECORDED BECAUSE IT IS A DRAFTING CHOICE AND NOT AN OMISSION. The C2 duty
    requires the stamps to be COMMITTED as a declared artifact, while each task
    here owns an exact, closed artifact_paths list. Both are satisfied by the
    reference implementation the convention itself names: the TASK-20260801-810
    `budget` block. Each task carries its stamps as a `budget` block INSIDE its
    own designated covering manifest, which is already a declared artifact path
    and is committed by this batch's archival tasks. No task invents a path, and
    no stamp goes uncommitted.

budget:
  wall_clock_seconds: 8600
  memory_gb: 4
  maximum_runs: 10
  basis: >-
    THESE ARE DECLARED SIZINGS BORROWED FROM GOAL-AES-001 ACTUALS. THEY ARE NOT
    MEASUREMENTS OF THIS GOAL, WHICH HAS NONE. GOAL-AES-002
    campaign_budget.sizing_basis itemises BATCH-001 at exactly 8600 s as
    coordination-and-protocol act 900 + queue drafting 700 + two concurrent
    producers 3200 (1600 each) + snapshot 500 + validation 1400 + red team 1000 +
    ledger archive 900. The per-role figures behind those lines are
    GOAL-AES-001's measured session-elapsed actuals, at or near each role's
    observed maximum, with no cushion. The goal's own
    what_a_red_team_should_attack_here names this as attack surface (2): the
    per-role figures are borrowed from another goal's campaign, and the snapshot,
    ledger and coordination lines rest on numbers that were charged at
    declaration and never measured even there. They are therefore presented as
    DECLARATIONS, never as measurements of this batch.
  itemisation_to_tasks:
    queue_drafting_act_700: TASK-20260810-095c67
    coordination_and_protocol_act_900: TASK-20260810-4a478d
    producer_1_1600: TASK-20260810-d8835b
    producer_2_1600: TASK-20260810-2a0a37
    snapshot_500_split_across_three_archives:
      TASK-20260810-c1cfd5: 150
      TASK-20260810-f7bc82: 150
      TASK-20260810-1a81be: 200
    red_team_1000: TASK-20260810-1166f2
    validation_1400: TASK-20260810-9fc65d
    ledger_archive_900: TASK-20260810-9f661a
  how_the_snapshot_line_was_split_and_what_that_split_is: >-
    THE SIZING BASIS CARRIES ONE SNAPSHOT LINE OF 500 s AND THIS BATCH RUNS
    THREE SNAPSHOT ARCHIVES, so the single line is split rather than tripled: 150
    to TASK-20260810-c1cfd5 (four opening control-plane files), 150 to
    TASK-20260810-f7bc82 (three protocol files from one task), and 200 to
    TASK-20260810-1a81be (five files from two producer tasks, the largest and
    only multi-source set). 150 + 150 + 200 = 500 exactly, so the batch total is
    8600 exactly and no line is over-drawn. THE SPLIT IS A DECLARATION, NOT A
    MEASUREMENT. Nothing in this repository has ever measured a 150-second
    archive; the only measured snapshot datum in either AES campaign is
    GOAL-AES-001's 378 s, which is larger than any of these three shares. The
    honest reading is that the 500 s line was sized for ONE archive and this
    batch spends it on three, so each of these three declarations is TIGHT AND
    MAY HALT ON BUDGET. A halt at binding_stop_utc is infrastructure signal, is
    reported as such under SC-1, and is never a negative mathematical result.
  arithmetic: >-
    700 + 150 + 900 + 150 + 1600 + 1600 + 200 + 1000 + 1400 + 900 = 8600. The
    campaign ceiling is 22500 s across at most 3 batches with no rounding slack
    and no contingency; this batch draws its full itemised 8600 and no more.
  declared_budgets_are_stop_conditions: >-
    A task that reaches its declared handoff.budget.wall_clock_seconds HALTS.
    That halt is infrastructure signal, never a negative mathematical result
    (AGENTS.md rule 5), and the dropped work is SCOPE, never an answer (rule 8).

blockers:
  - id: BLK-1
    state: open_at_batch_open_and_resolved_by_TASK-20260810-4a478d
    statement: >-
      The certificate vocabulary in docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py errors on any other value, so an AES KEY-RECOVERY
      certificate cannot currently be emitted by a conforming run record. Until
      the vocabulary is extended by versioned amendment, no card that could
      produce a solve may be dispatched. This is an infrastructure blocker and is
      NEVER negative mathematical evidence (AGENTS.md rule 5; GOAL-AES-002 pause
      condition P3).
    why_it_does_not_block_this_batch: >-
      No task in this batch could produce a solve. RANK 2 is ideation with the
      lossy-projection test applied BEFORE any compute is requested, and RANK 3
      measures a toolchain and a throughput. The amendment is authored here so
      that it is COMMITTED BEFORE any later card is issued that could produce
      one — a gate uncommitted when the card is issued is exactly the
      retroactive enforcement this program refuses.
  - id: TOOLCHAIN-CONTRADICTION
    state: open_at_batch_open_and_addressed_by_TASK-20260810-2a0a37
    statement: >-
      RQ-AES-001's constraints record gcc 13.3.0 with -maes as available;
      GOAL-AES-001's next_action records that a GF(2^8) census leg is blocked
      because neither numpy nor a small C program is installed. TWO COMMITTED
      RECORDS DISAGREE ABOUT THE C TOOLCHAIN. This Coordinator does not resolve
      the disagreement by assertion; RANK 3 resolves it by measurement, and
      neither committed record is edited.

