max_concurrent: 3
max_concurrent_is_a_cross_goal_cap: >-
  BINDING, AND IT IS NOT THIS BATCH'S CAP ALONE. GOAL-AES-002
  relationship_to_GOAL_AES_001 and RQ-AES-002's last constraint both rule that
  both AES campaigns run on the same 4 cores in the same session, so
  max_concurrent 3 is a cap ACROSS BOTH GOALS, NOT 3 EACH. IF GOAL-AES-001
  BATCH-005 IS IN FLIGHT AND ADMITTING THIS BATCH'S TASKS WOULD EXCEED THE CAP,
  THIS BATCH WAITS. It does not run degraded, it does not split the difference,
  and it does not borrow a slot. GOAL-AES-001 is not paused, closed, re-scoped,
  re-budgeted or reprioritized by this batch, and no second of either campaign's
  budget is charged to the other.

