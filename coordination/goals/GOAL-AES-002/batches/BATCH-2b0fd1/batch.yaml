claim_ceiling: >-
  protocol_freeze_object_first_ideation_and_measured_envelope_only. THIS BATCH
  ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It freezes a cost model, resolves
  an infrastructure blocker by amendment, adopts two inherited conventions
  explicitly, produces an object enumeration that is expressly NOT a completion
  (GOAL-AES-002 non_completion_criteria (i)), and measures a resource envelope
  that is expressly NOT a completion (non_completion_criteria (vi)). No key
  recovery, no distinguisher, no margin, no barrier statement, and no comparison
  of any kind against the published state of the art is in scope.

objective: >-
  Open GOAL-AES-002 and execute its BATCH-001 ranked shape: (RANK 1) freeze the
  cost model CM-1, resolve blocker BLK-1 by versioned protocol amendment, and
  record the adoption of the amendment-005 Part B clock convention and the
  amendment-004/005 provenance gate, all Coordinator-authored and all committed
  BEFORE any producer runs; (RANK 2) object-first ideation on FULL-ROUND AES
  under docs/inventor-protocol.md section 1 with the established families
  declared off-limits as the primary lens; (RANK 3) a measured toolchain-and-
  throughput envelope receipt resolving by MEASUREMENT the named contradiction
  between two committed records about the C toolchain. Then the standard chain:
  isolated snapshot archives, an independent red-team pass on CM-1 itself, an
  independent validation pass, and one isolated ledger archive.

next_action: >-
  Dispatch TASK-20260810-4a478d, the RANK 1 protocol act, as the first act of
