protocol_adoption:
  id: adoption-amendment-005-partB
  title: >-
    GOAL-AES-002 / BATCH-2b0fd1 adoption record binding the
    protocol-amendment-GOAL-AES-001-005 Part B clock convention (C1 through C6),
    amendment-005 Part A's coordination-act charging fix, and the
    artifact-provenance gate of amendment-004 Part B AS CORRECTED by
    amendment-005 Part C.
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  authored_by_task: TASK-20260810-4a478d
  authored_by_role: coordinator
  authored_at: '2026-08-19'
  in_force_from: BATCH-2b0fd1
  archived_by: TASK-20260810-f7bc82

  # =====================================================================
  # WHY THIS RECORD EXISTS AT ALL.
  # =====================================================================
  why_an_explicit_adoption_record_is_required: >-
    BECAUSE INHERITANCE IS NOT AUTOMATIC AND ASSUMING IT WOULD BE A REAL ERROR.
    protocol-amendment-GOAL-AES-001-003, -004 and -005 are each filed under
    GOAL-AES-001, each carry `goal_id: GOAL-AES-001`, and each are scoped to that
    campaign. A protocol amendment binds the goal it names. NOTHING IN ANY OF
    THEM BINDS GOAL-AES-002 AUTOMATICALLY, and a card that cited them as though
    they did would be enforcing a rule this campaign never adopted - the mirror
    image of the retroactive enforcement this program refuses. This record is
    therefore the instrument by which those clauses bind here: by EXPLICIT
    ADOPTION, at this campaign's first batch, before any producer runs.
  relationship_to_the_goal_head: >-
    GOAL-AES-002's committed record ALREADY DECLARED THIS ADOPTION AT ITS
    CREATION, in `budget_accounting.inheritance_basis`, which states that
    amendments 003 and 005 are scoped to GOAL-AES-001 and do NOT bind another
    goal automatically, and that the goal record ADOPTS their conventions as this
    campaign's founding practice. THIS RECORD DOES NOT CREATE THAT ADOPTION AND
    DOES NOT ALTER THE GOAL HEAD, WHICH IS NOT IN THIS TASK'S WRITE SCOPE AND WAS
    NOT TOUCHED. What it does is make the adoption OPERATIVE AND ENUMERABLE at
    the batch level: it names each adopted clause individually, quotes its
    operative content, states what is NOT adopted, and gives every BATCH-2b0fd1
    card and reviewer a single object to check against rather than a paragraph
    inside a goal record.

  # =====================================================================
  # ADOPTION 1. THE CLOCK CONVENTION.
  # =====================================================================
  adoption_1_clock_convention:
    source_record: coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    source_section: part_b_clock_convention
    clauses_adopted: [C1, C2, C3, C4, C5, C6]
    adopted_in_full: true
    scope_of_the_source: >-
      GOAL-AES-001. Stated so the adoption is visibly an adoption and not a
      citation of a rule already in force here.
    C1_the_charged_clock: >-
      ADOPTED. The consumption charged against this campaign's ceiling is the
      task's WALL-CLOCK SESSION ELAPSED - from the task's first act to its
      terminal receipt, AUTHORING INCLUSIVE - as observed by the dispatching
      session. COMPUTE SECONDS ARE NOT THE CHARGED CLOCK.
    C2_the_stop_condition_clock_and_the_auditable_proxy_duty: >-
      ADOPTED. The stop-condition clock is THE PRODUCER'S OWN COMMITTED UTC
      STAMPS. Every dispatched task of this campaign, in every role INCLUDING
      Coordinator tasks, (i) writes as its FIRST act, before any research work, a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
      declared; (ii) writes a further stamp at EACH major section boundary
      carrying utc, elapsed_s and a marker naming what was completed; (iii) HALTS
      at binding_stop_utc, records halted_on_budget truthfully and NAMES the work
      dropped; and (iv) COMMITS those stamps as a declared artifact. The
      TASK-20260801-810 budget block is the named reference implementation. A
      HALT AT binding_stop_utc IS INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE
      MATHEMATICAL RESULT (AGENTS.md rule 5), and dropped work is SCOPE, never an
      answer (rule 8).
    C3_discharging_C2_is_full_compliance: >-
      ADOPTED, AND IT IS THE CLAUSE THAT PROTECTS THE PRODUCER. A task that
      stamps honestly and halts at its own binding_stop_utc HAS COMPLIED IN FULL,
      even if the dispatcher-observed session elapsed later exceeds its
      declaration. Any residual is a CAMPAIGN-SIDE ACCOUNTING FACT, never a
      producer defect and never a returned task. Correspondingly a producer may
      NOT offer compute seconds as evidence of budget compliance.
    C4_declaration_basis: >-
      ADOPTED. Declarations are calibrated against AUTHORING-INCLUSIVE session
      elapsed, with the compute component reported SEPARATELY in its own field so
      the two are never conflated.
    C5_conflict_resolution: >-
      ADOPTED IN FULL, INCLUDING ITS TWO-PART STRUCTURE. The CHARGED figure is
      the LARGEST session-elapsed figure on the record for that task from any
      source; every other figure is preserved and marked
      `on_record_not_charged` with its source named; NO SPREAD IS EVER RESOLVED
      SILENTLY and no figure is ever deleted. The mechanism is adopted with it: a
      producer stamp ends at its final write and cannot cover the task's tail, so
      it systematically understates. AND THE DISTINCTION THAT MAKES C5 COHERENT
      IS ADOPTED TOO - for establishing WHAT HAPPENED (the timeline, the halt,
      the dropped work) the PRODUCER'S COMMITTED STAMPS GOVERN, because they are
      readable from committed bytes; for establishing WHAT IS CHARGED, C1 and the
      largest-figure rule govern.
    C6_the_unmeasured_work_rule: >-
      ADOPTED. A completed task whose duration was not reported is charged at its
      DECLARED budget and NEVER at zero. Where this recurs under the C2 regime, a
      DEFECT IS RECORDED AGAINST THE CAMPAIGN'S INSTRUMENTATION, NOT AGAINST THE
      PRODUCER.
    C6_is_already_load_bearing_in_this_very_batch: >-
      RECORDED HERE RATHER THAN LEFT FOR A REVIEWER TO DISCOVER. The authoring
      task of this record, TASK-20260810-4a478d, COULD NOT DISCHARGE C2: its
      session exposes no command-execution tool, so no clock could be read and
      start_utc, start_epoch and binding_stop_utc are null in CM-1's budget
      block, with the shortfall declared rather than fabricated. C6 is the clause
      that governs the result: the task is charged at its DECLARED 900 s and the
      defect (DEF-CM1-CLOCK, recorded in CM-1) is filed against the campaign's
      INSTRUMENTATION. THE FIRST TASK TO ADOPT THIS CONVENTION IS ALSO THE FIRST
      TASK TO FAIL IT, and that is disclosed at adoption rather than buried.
    what_C2_does_not_become_by_being_adopted: >-
      IT DOES NOT BECOME A MECHANISM. The V-804-2 lesson is adopted with the
      clause: committed UTC stamps are PRODUCER ATTESTATION, a string the
      producer wrote, and nothing in the committed bytes proves the clock they
      name. Part B makes a timeline READABLE and CONSISTENT, not PROVEN. This
      campaign inherits that limitation openly and does not restate the duty in
      stronger words than its source.

  # =====================================================================
  # ADOPTION 2. THE COORDINATION-ACT CHARGING FIX.
  # =====================================================================
  adoption_2_coordination_act_charging_fix:
    source_record: coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    source_section: part_a_ceiling, subsection known_undercount_now_closed
    the_defect_it_fixes_as_recorded_in_the_source: >-
      GOAL-AES-001's charged_to_date had only ever counted QUEUE TASKS.
      Coordination acts performed outside the queue - drafting a dispatch queue
      and its handoffs, authoring an amendment, taking a decision - consume real
      session elapsed and had been charged at ZERO for four batches, leaving an
      under-count that campaign recorded as UNQUANTIFIED AND UNRECOVERABLE.
    what_is_adopted: >-
      THE FIX, IN FULL AND FROM THIS CAMPAIGN'S FIRST BATCH RATHER THAN ITS
      FIFTH. EVERY COORDINATION ACT OF GOAL-AES-002 IS A DISPATCHED, BUDGETED,
      CHARGED QUEUE TASK, with a declared budget, charged at measured session
      elapsed like any other task. The authoring of this record is itself an
      instance: TASK-20260810-4a478d is a queue task with a declared 900 s
      budget, not an untracked Coordinator act.
    already_reflected_in_this_campaign_s_committed_sizing: >-
      VERIFIABLE RATHER THAN ASSERTED. GOAL-AES-002's committed
      campaign_budget.sizing_basis carries TWO coordination lines in its
      BATCH-001 itemisation - a coordination-and-protocol act at 900 and queue
      drafting at 700 - and `budget_accounting` carries the field
      `coordination_acts_are_charged_from_batch_001`. The adoption is therefore
      already priced into this campaign's ceiling; this record names the clause
      that priced it.
    the_one_honest_residual_this_campaign_carries: >-
      NOT HIDDEN BY THE ADOPTION. GOAL-AES-002's own charged_to_date_basis
      records ONE act performed outside the charging regime - the Coordinator act
      that authored RQ-AES-002, the goal record and DEC-20260731-031, which could
      not be a queue task because no queue can exist before the goal does. Its
      duration is UNMEASURED and, per C6, it had no declaration to be charged at
      either. It stands as an UNQUANTIFIED OPENING UNDER-COUNT of exactly one
      act, in the direction that favours this campaign, and it is NOT
      reconstructed here, because reconstructing a duration nobody recorded would
      be fabrication (AGENTS.md rule 9).

  # =====================================================================
  # ADOPTION 3. THE ARTIFACT-PROVENANCE GATE.
  # =====================================================================
  adoption_3_artifact_provenance_gate:
    source_record_base: coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-004.yaml
    source_section_base: part_b_provenance_per_artifact_class
    source_record_correction: coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    source_section_correction: part_c_provenance_gate_errata
    adopted_as_corrected_never_as_originally_drafted: >-
      THIS IS THE POINT OF THE CLAUSE AND IT IS STATED FIRST. Amendment-004 Part
      B is adopted ONLY IN THE FORM AMENDMENT-005 PART C LEFT IT. The original
      drafting carried two defects that were found at its FIRST exercise, and
      this campaign issues no card under a clause already known to be defective.
    defect_1_as_corrected_D_808_1: >-
      THE MANIFEST CLAUSE QUANTIFIER. Amendment-004 Part B, read literally,
      required EVERY manifest of a task to cover EVERY declared artifact of that
      task, which demands that each manifest carry the digest of every other -
      including manifests written after it - and therefore DEMONSTRABLY GENERATES
      DIGESTS NO PARTY CAN VERIFY. THE RESTATEMENT ADOPTED HERE IS AMENDMENT-005
      PART C's: "AT LEAST ONE machine-readable manifest per task, DESIGNATED THE
      COVERING MANIFEST, carries an artifact_provenance list covering EVERY
      DECLARED ARTIFACT OF THE TASK; EVERY OTHER MANIFEST OF THE TASK MUST APPEAR
      AS AN ENTRY IN IT." The covering manifest is named explicitly BOTH by the
      task's card AND by the manifest itself. Entry fields are unchanged from
      amendment 004 - path, kind, sha256, comment_block_inference_stanza
      (boolean, stated honestly INCLUDING WHEN FALSE), and
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest remains impossible and is recorded as SELF.
    defect_2_as_corrected_D_808_2_and_D_809_7: >-
      THE CLASS VOCABULARY IS CLOSED AND CASE-INSENSITIVE. The four class names
      are SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT and
      LEDGER_AND_COORDINATION_RECORD, matched case-insensitively and ignoring
      underscore/hyphen/space differences. NO FIFTH CLASS MAY BE INVENTED by a
      producer or by an archival task; a value outside the vocabulary is a DEFECT
      TO REPORT, never a class to create. THE ALIAS RULE IS ADOPTED WITH IT: any
      kind naming a machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST; a prose .md deliverable resolves to
      PROSE_REPORT; executable text resolves to SOURCE_CODE; anything under
      ledger/** or coordination/** authored by the Coordinator resolves to
      LEDGER_AND_COORDINATION_RECORD and carries no obligation under this gate.
    base_clause_adopted_unchanged: >-
      EVERY DECLARED SOURCE-CODE ARTIFACT CARRIES A COMMENT-BLOCK INFERENCE
      STANZA IN ITS OWN TEXT, and additionally an artifact_provenance entry in the
      covering manifest binding its path to its SHA-256. A PROSE_REPORT satisfies
      the gate EITHER by an in-text inference block OR by a provenance pointer
      naming the covering manifest, provided that manifest's artifact_provenance
      carries the report's digest with
      covered_by_this_manifest_inference_block true - BOTH FORMS ARE COMPLIANT
      AND NEITHER IS PREFERRED.
    an_ambiguity_in_the_adopted_alias_rule_reported_not_resolved: >-
      OBS-ADOPT-KIND, AND IT IS REPORTED BECAUSE IT BIT THIS VERY TASK. The alias
      rule resolves a machine-readable structured-data artifact to
      MACHINE_READABLE_MANIFEST and, in the same ruling, resolves anything under
      coordination/** authored by the Coordinator to
      LEDGER_AND_COORDINATION_RECORD. A Coordinator-authored YAML record under
      coordination/** satisfies BOTH antecedents, and the two classes carry
      different obligations - the second carries none under this gate. ALL THREE
      ARTIFACTS OF TASK-20260810-4a478d ARE IN EXACTLY THAT POSITION. THIS RECORD
      DOES NOT RESOLVE THE AMBIGUITY, because resolving an adopted clause is an
      amendment to it and this is an adoption, not an amendment. What this task
      did instead is DISCHARGE THE STRICTER DUTY REGARDLESS: CM-1 is designated
      the covering manifest, carries the full artifact_provenance list over all
      three artifacts, and states each entry's fields honestly. The ambiguity is
      routed to the reviewers and to the Coordinator decision that closes this
      batch.

  # =====================================================================
  # WHAT IS *NOT* ADOPTED. THE HALF THAT PREVENTS SMUGGLING.
  # =====================================================================
  explicitly_not_adopted:
    - item: >-
        AMENDMENT-005 PART A's CEILING. GOAL-AES-001's
        total_wall_clock_seconds figure of 34500, its per-role sizing table, its
        itemised BATCH-005/BATCH-006 sizing and its maximum_batches of 6 are
        THAT campaign's budget and are NOT adopted here in any part.
      why_it_matters: >-
        Adopting "amendment-005 Part A" without qualification would import
        another campaign's ceiling into this one. What IS adopted from Part A is
        the coordination-act charging fix ONLY (adoption 2 above). GOAL-AES-002's
        budget is its own committed campaign_budget - 22500 s across at most 4
        batches after protocol-amendment-GOAL-AES-002-002's ceiling raise - and
        NO SECOND OF EITHER CAMPAIGN'S BUDGET IS CHARGED TO THE OTHER.
    - item: >-
        AMENDMENT-005 PART A's SIZING METHODOLOGY IS ADOPTED ONLY AS ALREADY
        RECORDED IN THIS GOAL'S OWN HEAD, not additionally by this record.
        GOAL-AES-002's campaign_budget.sizing_basis already states that it sizes
        bottom-up from GOAL-AES-001's measured per-role actuals at or near each
        role's observed maximum with no cushion, citing amendment-005 Part A's
        discipline. That is a committed statement of this goal, made at its
        creation; this record neither extends nor re-opens it.
    - item: >-
        AMENDMENT-004 PART A. Its restatement of the certification condition for
        a REDUCED-ROUND measurement (the DEC-20260731-011 condition, H-1, the
        coverage family and the evasion family) is NOT adopted here.
      why_it_matters: >-
        It is a ruling about what a reduced-round measurement may certify, which
        is RQ-AES-001's territory. Importing it into a FULL-ROUND question would
        be exactly the cross-ceiling leak SC-8 and GOAL-AES-002
        non_completion_criteria (iii) forbid. Note separately that the
        GOAL-AES-001 harness IS reused here WITH its declared defect set attached
        and not reset - but that inheritance is stated in GOAL-AES-002's own
        `instrument_inheritance` field and in RQ-AES-002's scope, not created by
        this adoption record.
    - item: >-
        ANY CLAIM-TIER, COMPLETION-CRITERION, PAUSE-CONDITION OR REVIEW-CHAIN
        PROVISION OF EITHER SOURCE AMENDMENT. This record adopts accounting and
        provenance machinery only.
    - item: >-
        ANY GOAL-AES-001 STATUS, BUDGET, PRIORITY OR NEXT ACTION. GOAL-AES-001 is
        NOT paused, closed, superseded, re-scoped, re-budgeted or reprioritized
        by this record, and no GOAL-AES-001 record is edited, read into a
        full-round claim, or reinterpreted. This record was written by reading two
        of its amendments, and writing nothing to that campaign at all.

  # =====================================================================
  # BINDING EFFECT.
  # =====================================================================
  binding_effect:
    on_whom: >-
      EVERY TASK OF BATCH-2b0fd1 AND OF EVERY LATER BATCH OF GOAL-AES-002, in
      every role, including Coordinator tasks and including archival tasks.
    from_when: >-
      FROM BATCH-2b0fd1, on commit of this record by TASK-20260810-f7bc82. The
      nine BATCH-2b0fd1 cards already carry SC-1, SC-2 and SC-3, which are the
      card-level restatements of adoptions 1 and 3 in identical language on every
      card, so no card is issued under a gate that was not committed when the
      card was issued - PROVIDED this record and CM-1 are committed before the
      RANK 2 and RANK 3 producers are dispatched, which is precisely the ordering
      TASK-20260810-f7bc82's completion gate enforces.
    retroactivity: >-
      NONE. NOT RETROACTIVE IN ANY PART. No task, receipt, record or figure of
      GOAL-AES-001, of GOAL-AES-002's own pre-batch working-tree artifacts under
      batches/BATCH-001/, or of any other campaign is re-graded, re-charged,
      defect-charged, re-scored or withdrawn by this adoption. Applying a clause
      backwards to fail work against a gate it was never given is what
      amendment-002's retroactive_note refused and what this record refuses
      again.
    how_it_is_changed: >-
      By a versioned protocol amendment under GOAL-AES-002, approved in a
      committed Coordinator decision. NOT by an edit to this file, and NOT by a
      later amendment to GOAL-AES-001 - a change to the source amendment does not
      propagate here automatically, for exactly the reason this adoption record
      exists. If amendment-005 is itself amended, this campaign decides
      separately whether to adopt the change.

  limitations:
    - >-
      AN ADOPTION IS ONLY AS GOOD AS THE CLAUSE ADOPTED. Every limitation
      amendment-005 records about Part B travels with it unchanged: committed UTC
      stamps are producer attestation and not a mechanism; no historical figure
      becomes re-derivable from the tree; and Part B gives no task additional
      running time.
    - >-
      THE FIRST TASK BOUND BY C2 COULD NOT DISCHARGE IT, for the capability
      reason recorded above and in CM-1's DEF-CM1-CLOCK. That is a live defect in
      this campaign's instrumentation from its first batch, disclosed at
      adoption. C6 governs the accounting; the underlying capability gap is
      unresolved and is routed to the Coordinator.
    - >-
      THIS RECORD ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT, states no margin,
      supports no claim, creates no hypothesis, approves no experiment, promotes
      no knowledge, changes no status and records no attestation and no review
      verdict. It concerns a clock, a charging rule and an artifact-provenance
      vocabulary.

  r5_anti_laundering:
    margin_stated_by_this_record: none
    note: >-
      This record states NO margin, so R5's same-sentence duty has nothing to
      attach to. Recorded rather than omitted, per SC-7.
    dominated_by: >-
      unresolvable in this environment: no primary source reachable; every
      recalled frontier row is unverified-from-memory
    sota_delta: >-
      NOT APPLICABLE - this record states no result and therefore no delta. The
      published-frontier comparison is unadjudicable in this environment in both
      directions.

  inference:
    requested_policy: coordinator-orchestration-code
    requested_reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    fallback_used: false
    resolved_model_id_self_reported: "claude-opus-5[1m]"
    resolved_model_self_report_basis: >-
      Genuine self-report from this session's own runtime context, which names
      the answering model as "Opus 5 (1M context)", exact id
      "claude-opus-5[1m]". Not copied from the committed binding target; this
      session cannot query its own backend, so the policy-to-model resolution is
      unverified from inside.
    amazon_bedrock: >-
      NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED AND NOT USED, in
      any runtime, backend, endpoint, model identifier, fallback or probe
      (AGENTS.md rule 16, SC-11).

  evidence_refs:
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-004.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    - ledger/goals/GOAL-AES-002.yaml
    - ledger/questions/RQ-AES-002.yaml
    - ledger/handoffs/TASK-20260810-4a478d.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/task-cards/TASK-20260810-4a478d.md
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml
    - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-002.yaml

  commit: null
  commit_note: >-
    NULL BY NECESSITY, NOT BY OMISSION. A record cannot carry the SHA of the
    commit that contains it, and the authoring task is forbidden to commit. Bound
    in a follow-on write once the post-commit verifier accepts
    TASK-20260810-f7bc82's commit.
