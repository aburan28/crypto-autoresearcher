cost_model:
  id: CM-1
  title: >-
    CM-1, the frozen cost model of GOAL-AES-002 / RQ-AES-002. Fixes the six
    elements (a)-(f) of RQ-AES-002 claim_tier_ceiling R2 explicitly and
    separately for AES-128, AES-192 and AES-256, so that a cost comparison
    against the DEFINITIONAL exhaustive-key-search reference is adjudicable at
    all.
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  authored_by_task: TASK-20260810-4a478d
  authored_by_role: coordinator
  authored_at: '2026-08-19'
  authored_at_note: >-
    THE TASK IDENTIFIER CARRIES THE DATE 2026-08-10, WHICH IS THE DATE ITS QUEUE
    ENTRY, CARD AND HANDOFF WERE RECORDED, NOT THE DATE OF THIS AUTHORING ACT.
    The card was blocked behind TASK-20260810-c1cfd5 until the DEF-3 repair
    completed (DEC-20260810-334c34, DEC-20260815-cd90d4), so it is authored now.
    The date recorded here is the date stated by this session's own runtime
    context; no clock was read, and see the budget block for what that costs.
  snapshotted_by_task: TASK-20260810-f7bc82
  red_teamed_by_task: TASK-20260810-1166f2
  validated_by_task: TASK-20260810-9fc65d

  status: frozen_on_commit
  status_note: >-
    FROZEN ON COMMIT, NOT ON AUTHORING. These bytes are frozen the moment
    TASK-20260810-f7bc82 commits them; until that commit lands this file is a
    working-tree draft and is not a gate. After that commit CM-1 is IMMUTABLE
    and is changed only by a superseding versioned protocol amendment under
    GOAL-AES-002, never by an edit to this file. A margin computed before CM-1
    is frozen is not evidence but an unadjudicated number
    (RQ-AES-002 claim_tier_ceiling R2, final sentence).

  role_in_the_campaign: >-
    HARD PRE-DISPATCH GATE. RQ-AES-002 constraints, first entry, ruled that no
    cryptanalytic measurement and no cost claim may be dispatched under this
    question until CM-1 exists as a committed, independently reviewed artifact
    fixing all six elements (a)-(f) of R2. CM-1 therefore gates every later
    cryptanalytic card of this campaign, including the RANK 2 ideation card
    TASK-20260810-d8835b to the extent that any of its deliverables states a
    cost, and every card of every later batch. A card issued against a gate that
    was not committed when the card was issued is retroactive enforcement, which
    this program refuses.

  what_this_record_asserts_and_what_it_does_not: >-
    THIS RECORD ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. It names no
    candidate, no mechanism, no margin, no distinguisher and no barrier. It is a
    unit system and an accounting discipline. The operation counts in element (a)
    are counts of the operations the specification's own structure performs; they
    are a definition of the charging unit, not a cryptanalytic statement, and
    they are labelled derived-and-not-yet-confirmed where that is their honest
    status.

  # =====================================================================
  # R5 ANTI-LAUNDERING COMPLIANCE (SC-4, SC-6, SC-7).
  # =====================================================================
  r5_anti_laundering:
    margin_stated_by_this_record: none
    margin_stated_by_this_record_note: >-
      THIS RECORD STATES NO MARGIN, so R5's same-sentence duty has nothing to
      attach to here. It is nevertheless recorded rather than omitted, because
      the honest reading of SC-7 is that a deliverable which states no margin
      satisfies it vacuously and must SAY SO rather than leave a reviewer to
      infer it.
    the_reference_this_model_charges_against: >-
      EXHAUSTIVE KEY SEARCH AT THE STATED KEY SIZE, WHICH IS DEFINITIONAL AND IS
      THE ONLY QUANTITATIVE REFERENCE THIS CAMPAIGN MAY USE (RQ-AES-002 R1). The
      published state of the art is UNADJUDICABLE in this environment IN BOTH
      DIRECTIONS and is not a reference here.
    binding_sentence_template_for_every_later_deliverable: >-
      SUPPLIED SO THAT NO LATER RECORD HAS TO INVENT ONE UNDER TIME PRESSURE,
      which is when the laundering R5 forbids actually happens. Any later record
      stating a margin uses, in the SAME SENTENCE as the number, the form -
      "under CM-1 the charged cost is X AEU-k against the DEFINITIONAL
      exhaustive-key-search reference of 2^(k-1) AEU-k at this key size, and the
      comparison against the published state of the art is UNADJUDICABLE in this
      environment in both directions."
    dominated_by: >-
      unresolvable in this environment: no primary source reachable; every
      recalled frontier row is unverified-from-memory
    sota_delta: >-
      NOT APPLICABLE TO THIS RECORD, WHICH STATES NO RESULT AND THEREFORE NO
      DELTA. Recorded rather than omitted per SC-4's operational clause. For any
      later record under this question the DEFINITIONAL-REFERENCE delta is stated
      and explicitly labelled as definitional-reference, and the published
      frontier is recorded with the word unadjudicable.

  # =====================================================================
  # ELEMENT (a). THE UNIT.
  # =====================================================================
  element_a_unit:
    the_canonical_unit: >-
      AEU-k, the AES-k EVALUATION UNIT. ONE AEU-k IS ONE FULL AES-k ENCRYPTION OF
      ONE 128-BIT BLOCK AT THE FULL ROUND COUNT FOR THAT KEY SIZE (AES-128 = 10
      rounds, AES-192 = 12, AES-256 = 14, including the standard final round
      without MixColumns), ON THE PINNED FIPS-197-VERIFIED IMPLEMENTATION,
      INCLUSIVE OF ONE KEY-SCHEDULE EXPANSION FOR A FRESH KEY.
    key_schedule_ruling: >-
      CHARGED, NOT AMORTISED, AND THE CHOICE IS DELIBERATE. The definitional
      reference is a FRESH-KEY operation - an exhaustive search tries a new key
      each attempt and must expand each one - so R1's figure of 2^(k-1) full
      AES-k evaluations is a figure in fresh-key units. Defining the unit as
      anything cheaper would inflate the reference expressed in that unit and
      hand this campaign a margin it did not earn. AEU-k therefore includes the
      key schedule.
    the_second_sub_unit_and_the_conversion_between_them: >-
      A SECOND SUB-UNIT IS NAMED BECAUSE ATTACK WORK GENUINELY DIFFERS IN KIND.
      U_enc(k) is one AES-k block encryption under an ALREADY EXPANDED key
      (round keys resident, key schedule not re-run). Attack work performed under
      a fixed key is naturally counted in U_enc(k). The conversion is
      U_enc(k) = r_k * AEU-k with 0 < r_k <= 1, where r_k is the MEASURED ratio
      of amortised-key to fresh-key encryption cost on the pinned implementation.
    r_k_is_unmeasured_at_freeze_and_is_handled_conservatively: >-
      r_k IS NOT MEASURED AND IS NOT ESTIMATED HERE. No throughput measurement
      exists for this campaign; the RANK 3 card TASK-20260810-2a0a37 is the task
      that measures the toolchain-and-throughput envelope, and RQ-AES-002 forbids
      any card declaring a budget that depends on throughput until that receipt
      exists. UNTIL r_k IS MEASURED AND RECORDED, THE BINDING VALUE IS r_k := 1.
      That OVERCHARGES attack-side amortised encryption, because it charges an
      encryption under a resident key as though the schedule were re-run. THE
      ERROR DIRECTION IS AGAINST THIS CAMPAIGN'S OWN INTEREST, which is the only
      direction a placeholder in a cost model may ever point. When the receipt
      lands, r_k is bound by a superseding amendment, not by editing this file.
    conversion_from_other_units_this_is_element_a_s_operative_clause: >-
      ATTACK WORK COUNTED IN S-BOX LOOKUPS, TABLE ACCESSES, XORs OR "OPERATIONS"
      IS CONVERTED INTO AEU-k BY THE STATED CONVERSION BELOW, OR THE COMPARISON
      IS VOID (RQ-AES-002 R2(a)). Two conversion routes are admissible and no
      third is.
    admissible_conversion_route_1_s_box_applications: >-
      THE S-BOX-APPLICATION COUNT, which follows from the specification's own
      structure rather than from any measurement or any document. One AEU-k
      performs S_k S-box applications, S_k given in the table below. Attack work
      expressed as N S-box applications is charged N / S_k AEU-k. THIS ROUTE IS
      ADMISSIBLE IMMEDIATELY, at freeze, without waiting for any receipt.
    admissible_conversion_route_2_measured_throughput: >-
      A DIRECTLY MEASURED CONVERSION on the pinned implementation, recorded in a
      committed receipt, for units whose cost is implementation-dependent. This
      route is UNAVAILABLE until such a receipt exists.
    inadmissible_until_measured_stated_so_it_is_not_improvised: >-
      XOR COUNTS, TABLE ACCESSES AND UNQUALIFIED "OPERATIONS" ARE
      IMPLEMENTATION-DEPENDENT AND ARE NOT CONVERTED BY ANY FACTOR FIXED HERE.
      A T-table implementation, a bitsliced implementation and an AES-NI
      implementation do not agree on how many XORs or table accesses one
      encryption performs, so a conversion factor invented here would be a
      fabricated constant. UNTIL A MEASURED CONVERSION IS COMMITTED, A MARGIN
      EXPRESSED ONLY IN THOSE UNITS IS INADMISSIBLE AND IS RECORDED AS
      UNADJUDICABLE - it is NOT estimated, and it is NOT converted at a guessed
      rate (AGENTS.md rule 9).
    per_key_size:
      AES-128:
        rounds: 10
        unit: >-
          One AEU-128 is one 10-round AES-128 encryption of one 128-bit block
          including one fresh 128-bit key expansion.
        s_box_applications_per_AEU_S_k: 200
        s_box_applications_derivation: >-
          160 in the data path (SubBytes applies 16 S-box substitutions in each
          of 10 rounds) plus 40 in the key expansion (10 expansion iterations,
          each applying SubWord to one 4-byte word). 160 + 40 = 200.
        add_round_key_byte_xors_per_AEU: 176
        add_round_key_byte_xors_derivation: >-
          AddRoundKey is applied 11 times (initial whitening plus 10 rounds) at
          16 byte-XORs each. 11 * 16 = 176. THIS FIGURE COVERS AddRoundKey ONLY
          and is NOT a total XOR count for the encryption, because MixColumns and
          the key expansion contribute XORs whose number is
          implementation-dependent. It is recorded because it is definitional and
          checkable; it is NOT a conversion factor.
      AES-192:
        rounds: 12
        unit: >-
          One AEU-192 is one 12-round AES-192 encryption of one 128-bit block
          including one fresh 192-bit key expansion.
        s_box_applications_per_AEU_S_k: 224
        s_box_applications_derivation: >-
          192 in the data path (16 substitutions in each of 12 rounds) plus 32 in
          the key expansion. For a 6-word key the expansion generates words 6
          through 51 and applies SubWord at the 8 indices divisible by 6 (6, 12,
          18, 24, 30, 36, 42, 48), at 4 substitutions each. 192 + 32 = 224.
        add_round_key_byte_xors_per_AEU: 208
        add_round_key_byte_xors_derivation: >-
          AddRoundKey applied 13 times at 16 byte-XORs each. 13 * 16 = 208. Same
          caveat as AES-128: AddRoundKey only, not a total, not a conversion
          factor.
      AES-256:
        rounds: 14
        unit: >-
          One AEU-256 is one 14-round AES-256 encryption of one 128-bit block
          including one fresh 256-bit key expansion.
        s_box_applications_per_AEU_S_k: 276
        s_box_applications_derivation: >-
          224 in the data path (16 substitutions in each of 14 rounds) plus 52 in
          the key expansion. For an 8-word key the expansion generates words 8
          through 59 and applies SubWord TWICE PER 8-WORD CYCLE - at the 7
          indices divisible by 8 (8, 16, 24, 32, 40, 48, 56) and at the 6 indices
          congruent to 4 modulo 8 (12, 20, 28, 36, 44, 52) - at 4 substitutions
          each. (7 + 6) * 4 = 52. 224 + 52 = 276.
        add_round_key_byte_xors_per_AEU: 240
        add_round_key_byte_xors_derivation: >-
          AddRoundKey applied 15 times at 16 byte-XORs each. 15 * 16 = 240. Same
          caveat.
    status_of_these_counts_stated_against_this_model_s_own_interest: >-
      DERIVED, NOT MEASURED, AND NOT YET CONFIRMED AGAINST THE PINNED
      IMPLEMENTATION. They are derived by this Coordinator from the structure of
      the AES key expansion and round function, and FIPS-197 is not cited here
      from a read document - RQ-AES-002 scope pins the specification
      OPERATIONALLY by known-answer vectors under two implementations, not by
      citation. THE COUNTS ARE THEREFORE CHECKABLE AND UNCHECKED. They are
      admissible as a conversion at freeze because they are re-derivable by any
      reviewer from the same structure and confirmable by instrumenting the
      pinned implementation, which is the cheapest possible confirmation.
      CONFIRMATION IS OWED: the independent validator TASK-20260810-9fc65d and
      the red team TASK-20260810-1166f2 are asked to re-derive them
      independently, and any discrepancy is a defect against CM-1 to be resolved
      by a superseding amendment, not by editing this file.
    the_single_line_most_likely_to_be_wrong: >-
      NAMED EXPLICITLY BECAUSE A MODEL THAT NAMES NO WEAK LINE IS NOT WRITTEN TO
      BE ATTACKED. It is the AES-256 key-expansion count of 52. AES-256 is the
      only key size whose expansion applies SubWord at TWO residues per cycle
      rather than one, and the second application is exactly the clause an
      implementer or a reviewer working from memory drops. If that clause were
      dropped the count would read 224 + 28 = 252 rather than 276, an 8.7 percent
      error in the AES-256 conversion factor. THE AES-192 COUNT CARRIES THE
      MIRROR-IMAGE RISK: a reviewer who over-corrects and applies the AES-256
      double-SubWord rule to a 6-word key would get 192 + 64 = 256 rather than
      224. Both figures are stated here so that a re-derivation disagreeing with
      either is immediately visible rather than silently averaged.

  # =====================================================================
  # ELEMENT (b). THE SUCCESS CONVENTION.
  # =====================================================================
  element_b_success_convention:
    declared_once_and_binding_on_both_sides: average_case
    the_ruling: >-
      AVERAGE CASE. The reference is charged at 2^(k-1) AEU-k, the expected
      number of fresh-key evaluations to first success in an exhaustive search
      over a uniformly random unknown key. THE SAME CONVENTION IS APPLIED TO THE
      ATTACK SIDE WITHOUT EXCEPTION: an attack is charged its EXPECTED cost to
      first success, never its best case and never its cost conditional on
      success.
    why_this_convention_and_not_worst_case: >-
      Either is defensible; what is indefensible is mixing them, which
      manufactures a factor of 2 (RQ-AES-002 R2(b)) and a factor of 2 is inside
      the margin of any result this campaign could plausibly produce. Average
      case is chosen because it is the convention in which the reference figure
      of R1 is already stated and because an expected-cost figure is what a
      probabilistic attack naturally produces, so the convention that requires
      the FEWER restatements is the one less likely to be silently violated.
    the_worst_case_figures_are_recorded_but_are_not_in_force:
      AES-128: 2^128 AEU-128 worst case; NOT the charged reference.
      AES-192: 2^192 AEU-192 worst case; NOT the charged reference.
      AES-256: 2^256 AEU-256 worst case; NOT the charged reference.
    the_charged_definitional_reference:
      AES-128: 2^127 AEU-128
      AES-192: 2^191 AEU-192
      AES-256: 2^255 AEU-256
    reference_is_definitional_not_recalled: >-
      These three figures follow from the key length and the definition of the
      cipher, per RQ-AES-002 R1. NOTHING IN THEM IS READ FROM A DOCUMENT OR
      RECALLED FROM MEMORY, and that is precisely why this campaign may compare
      against them when it may compare against nothing else.

  # =====================================================================
  # ELEMENT (c). SUCCESS PROBABILITY.
  # =====================================================================
  element_c_success_probability:
    the_rule: >-
      AN ATTACK SUCCEEDING WITH PROBABILITY p IS CHARGED AT cost / p, and p is
      MEASURED OR DERIVED, NEVER ASSUMED (RQ-AES-002 R2(c)). A record stating a
      cost without stating p, or stating a p that is neither measured nor
      derived, is INADMISSIBLE under this model and its number is not evidence.
    what_counts_as_derived: >-
      A p obtained by an argument a reviewer can check step by step from stated
      assumptions, with every assumption named. A p obtained by asserting that a
      distribution is uniform, independent or random-like WITHOUT that assumption
      being named and numbered is NOT derived; it is assumed, and under
      agents/coordinator.md such a dependence must be stated as an explicit
      numbered heuristic carrying archived validation evidence or a scheduled
      validation experiment.
    repetition_and_the_restart_cost: >-
      An attack repeated until success is charged the full per-attempt cost times
      the expected number of attempts, INCLUDING any per-attempt setup, data
      re-acquisition and verification. A model that charges setup once and
      repeats only the cheap inner loop must SAY SO and justify why setup is
      reusable across attempts.
    partial_key_recovery_the_laundering_route_this_clause_closes: >-
      AN ATTACK RECOVERING m OF THE k KEY BITS HAS NOT RECOVERED THE KEY, and its
      charged cost is its own cost PLUS the residual exhaustive search over the
      remaining bits, charged at 2^(k-m-1) AEU-k under the average-case
      convention of element (b). The residual search is NEVER omitted, NEVER
      described as trivial, and NEVER left for the reader to add. This is the
      single most common way a partial result becomes a full-key claim, and it is
      closed here rather than caught later.
    guessing_the_reference_side_never_gets_a_success_discount: >-
      The reference is charged at success probability 1 (R1: exhaustive search
      succeeds with probability 1). An attack charged at p < 1 is therefore
      compared against a certainty, and cost / p is the correction that makes the
      two commensurable.

  # =====================================================================
  # ELEMENT (d). DATA.
  # =====================================================================
  element_d_data:
    the_rule: >-
      DATA IS CHARGED IN QUERIES AND IN THEIR KIND - known plaintext, chosen
      plaintext, chosen ciphertext, or adaptive - and never folded into a single
      scalar with time. An attack needing 2^60 chosen plaintexts is not "faster"
      than the reference on a scalar comparison, and the comparison is made on
      the FULL PARETO FRONTIER of time, memory, data and success probability
      (RQ-AES-002 R2(d)).
    the_pareto_rule_operationally: >-
      EVERY COST STATEMENT UNDER THIS MODEL IS A FOUR-TUPLE (time in AEU-k,
      memory in bytes, data in queries with their kind, success probability), and
      a claim that one four-tuple beats another is admissible ONLY when it beats
      it in at least one coordinate and is no worse in every other. A four-tuple
      that is better in time and worse in data DOES NOT DOMINATE the reference
      and may not be reported as beating it; it is reported as an incomparable
      point on the frontier, with both coordinates stated.
    data_kind_ordering: >-
      known plaintext is the weakest requirement and chosen/adaptive are
      strictly stronger. A data requirement is never silently upgraded: an
      attack needing chosen plaintexts states so wherever its cost appears.
    reference_side_data_per_key_size:
      AES-128: >-
        2 known plaintext/ciphertext pairs. Derivation: each 128-bit pair imposes
        128 bits of constraint on a 128-bit key, so one pair leaves an expected
        1 spurious key besides the true one and two pairs reduce the expected
        spurious count to about 2^-128.
      AES-192: >-
        2 known plaintext/ciphertext pairs. Derivation: two pairs impose 256 bits
        of constraint on a 192-bit key, leaving an expected spurious count of
        about 2^-64.
      AES-256: >-
        3 known plaintext/ciphertext pairs. Derivation: two pairs impose exactly
        256 bits of constraint on a 256-bit key, which leaves an expected
        spurious count of about 1 and therefore does NOT pin the key; a third
        pair is required.
    relation_to_R1_stated_because_it_looks_like_a_discrepancy_and_is_not: >-
      RQ-AES-002 R1 says the reference needs "about two known pairs". CM-1 makes
      that phrase PRECISE PER KEY SIZE and finds 2, 2 and 3. THIS IS A REFINEMENT
      OF A DEFINITIONAL STATEMENT, NOT A CONTRADICTION OF A COMMITTED RECORD, and
      it is recorded here rather than applied silently. Its effect on the
      reference's TIME cost is nil to within the resolution of any comparison this
      campaign could make - verifying a candidate against a third pair costs one
      further AEU-k only for the candidates that survive two pairs, of which there
      is on average about one. No committed record is edited by this observation.
    data_charged_end_to_end: >-
      Data ACQUISITION is charged where it is not free: queries to an encryption
      oracle are counted, and where an attack requires structured data (a delta
      set, a coset, a multiset) the cost of assembling it is charged, not assumed
      available.

  # =====================================================================
  # ELEMENT (e). MEMORY.
  # =====================================================================
  element_e_memory:
    the_rule: >-
      MEMORY IS STATED ALWAYS, BESIDE TIME, IN BYTES. A TIME-ONLY COMPARISON IS
      INCOMPLETE AND IS REJECTED UNDER THIS MODEL (RQ-AES-002 R2(e);
      docs/claims-and-verification.md).
    reference_side_memory: >-
      O(1) - the current candidate key, its expanded schedule, and the 2 or 3
      stored plaintext/ciphertext pairs of element (d). Negligible at every key
      size, and this is precisely why a memory-heavy attack is not automatically
      an improvement even at lower time.
    the_uniform_cost_assumption_declared_as_an_optimistic_assumption: >-
      DECLARED AGAINST THIS CAMPAIGN'S OWN INTEREST, BECAUSE A RED TEAM WOULD
      OTHERWISE LAND IT. CM-1 charges memory in BYTES OCCUPIED and charges a
      memory ACCESS at zero additional time cost - a uniform-cost RAM assumption.
      THAT ASSUMPTION SYSTEMATICALLY FAVOURS MEMORY-HEAVY ATTACKS, which pay real
      latency, real bandwidth and real wiring cost on any physical machine, and
      it therefore biases this model in the direction of finding a margin. It is
      adopted anyway because a defensible physical memory-cost model is not
      derivable in this environment and inventing an access-cost exponent would
      be fabricating a constant. THE CONSEQUENCE IS RECORDED AS A BINDING
      DISCLOSURE: any later record whose margin depends materially on a large
      memory footprint states this assumption in its own text, and its margin is
      understood as an upper bound on the advantage rather than as the advantage.
    time_memory_tradeoffs: >-
      Where an attack admits a time-memory tradeoff, the ENTIRE tradeoff curve is
      reported, not the single point most favourable to the attack. Selecting the
      best point of a curve and reporting it as the cost is a form of the
      single-scalar comparison element (d) already rejects.
    memory_is_charged_at_its_peak: >-
      The charged memory figure is PEAK simultaneous occupancy, not average and
      not final. An attack that holds a large table transiently has paid for it.

  # =====================================================================
  # ELEMENT (f). PRECOMPUTATION AND VERIFICATION.
  # =====================================================================
  element_f_precomputation_and_verification:
    the_rule: >-
      CHARGED END TO END, INCLUDING THE COST OF CONFIRMING A CANDIDATE KEY
      (RQ-AES-002 R2(f)).
    precomputation: >-
      Precomputation is charged IN FULL, in AEU-k, in the same total as the
      online phase, and is NOT amortised across instances by default. An attack
      wishing to amortise precomputation over N instances must DECLARE N, state
      why N instances are the relevant setting, and report both the amortised and
      the unamortised totals. An undeclared amortisation is the same defect as an
      undeclared success probability.
    verification_of_a_candidate_key: >-
      Charged at the element (d) pair count per candidate tested - 2, 2 and 3
      AEU-k for AES-128, AES-192 and AES-256 respectively in the worst case, and
      in practice one AEU-k for the overwhelming majority of candidates, which
      fail on the first pair. THE NUMBER OF CANDIDATES TESTED IS CHARGED IN FULL:
      an attack that reduces the key space to a set of size N has paid, at
      minimum, N verification units on top of whatever it paid to produce the
      set, and this term is never dropped as lower order without the arithmetic
      being shown.
    certificate_re_verification_is_charged_and_is_not_free: >-
      The two-implementation certificate re-verification that
      protocol-amendment-GOAL-AES-002-001 specifies for a key_recovery
      certificate - recompute under BOTH pycryptodome and the openssl CLI, by the
      run wrapper and not by the attack code - is CHARGED AS VERIFICATION under
      this element. It is a small constant number of AEU-k and it is stated
      rather than assumed away, because "checking is free" is exactly the kind of
      unstated rounding this model exists to prevent. It is also the cheapest
      item in any such run, which is the asymmetry RQ-AES-002's motivation names
      as this campaign's strongest epistemic asset.
    setup_compilation_and_harness_overheads: >-
      NOT charged as attack cost, and this is a ruling rather than an oversight.
      Compilation, harness startup, file IO and the run wrapper's own bookkeeping
      are INFRASTRUCTURE, charged against the campaign's wall-clock budget under
      the clock convention adopted in adoption-amendment-005-partB.yaml, and NOT
      against the attack's AEU-k total. Charging them to the attack would make
      the AEU-k figure machine-dependent, which would destroy its comparability
      with a reference that is machine-independent by construction.

  # =====================================================================
  # WHAT CM-1 DOES NOT FIX. NAMED, NOT SMUGGLED.
  # =====================================================================
  open_items_this_model_deliberately_does_not_close:
    - id: O-CM1-1
      item: >-
        THE MATERIALITY THRESHOLD IS NOT FIXED BY CM-1. GOAL-AES-002's completion
        criterion C1 requires a cost "materially below" the definitional
        reference, and R2 does not list materiality among the six elements this
        task was authorized to fix. CM-1 therefore makes the comparison
        ADJUDICABLE without ruling on what size of gap counts.
      why_it_is_not_fixed_here: >-
        Fixing it would add a seventh substantive criterion beyond this card's
        authorization. Recording it as open is the honest alternative to either
        self-granting a criterion or leaving a reviewer to discover the gap.
      why_it_must_be_fixed_BEFORE_any_margin_is_measured: >-
        A materiality threshold chosen AFTER a margin is observed is a success
        criterion changed after observing an outcome, which AGENTS.md and this
        Coordinator's contract forbid without a versioned protocol_amendment. The
        time to fix it is before the first cryptanalytic card of this campaign is
        dispatched.
      status: >-
        OPEN. Referred to the Coordinator as a required decision before any
        cryptanalytic measurement or cost claim is dispatched under RQ-AES-002.
        NO THRESHOLD IS PROPOSED HERE, because a number floated in a frozen
        artifact acquires authority it was never granted.
    - id: O-CM1-2
      item: >-
        r_k, THE AMORTISED-TO-FRESH-KEY ENCRYPTION COST RATIO OF ELEMENT (a), IS
        UNMEASURED. It is bound conservatively to 1 until the RANK 3
        toolchain-and-throughput receipt (TASK-20260810-2a0a37) measures it.
      status: >-
        OPEN, WITH A BINDING CONSERVATIVE DEFAULT. The default overcharges the
        attack side, so no margin can be manufactured by the gap. Binding the
        measured value requires a superseding amendment.
    - id: O-CM1-3
      item: >-
        THE XOR, TABLE-ACCESS AND "OPERATIONS" CONVERSIONS ARE NOT FIXED, because
        they are implementation-dependent and no measurement exists.
      status: >-
        OPEN. Until a measured conversion is committed, a margin expressed only
        in those units is INADMISSIBLE and is recorded as unadjudicable rather
        than estimated.
    - id: O-CM1-4
      item: >-
        THE S-BOX-APPLICATION COUNTS S_k (200 / 224 / 276) ARE DERIVED AND NOT
        YET CONFIRMED against the pinned implementation.
      status: >-
        OPEN, AND CONFIRMATION IS OWED BY THE REVIEW CHAIN. Independent
        re-derivation is requested of TASK-20260810-9fc65d and
        TASK-20260810-1166f2; instrumented confirmation against the pinned
        implementation is the cheapest decisive check and is available to any
        later executor card.
    - id: O-CM1-5
      item: >-
        PARALLELISATION IS NOT CHARGED SEPARATELY. AEU-k counts SEQUENTIAL
        evaluations; an attack and the reference are both perfectly parallel at
        this granularity, so the ratio is unaffected, but a claim about
        WALL-CLOCK feasibility on any real machine is a different claim requiring
        a core count and a measured throughput this campaign does not yet have.
      status: >-
        OPEN AND OUT OF SCOPE FOR CM-1. Named so that no later record silently
        converts an AEU-k count into a wall-clock statement.

  # =====================================================================
  # WRITTEN TO BE ATTACKED.
  # =====================================================================
  what_a_red_team_should_attack_here: >-
    NAMED BY THIS COORDINATOR AGAINST ITSELF, per the card's instruction and
    because GOAL-AES-001's first red-team pass destroyed that campaign's only
    cost model. (1) THE S_k COUNTS ARE DERIVED FROM MEMORY OF A STRUCTURE, not
    from a read specification and not from an instrumented implementation; the
    AES-256 line is the most likely to be wrong and the AES-192 line is the most
    likely to be wrongly "corrected". (2) THE UNIFORM-COST MEMORY ASSUMPTION
    BIASES THIS MODEL TOWARD FINDING A MARGIN and is defended only by the
    unavailability of a better model, which is an argument from convenience.
    (3) r_k := 1 IS A PLACEHOLDER IN A FROZEN ARTIFACT, and although its error
    direction is conservative, a frozen model containing an unmeasured constant
    is a model that will need amending, which is a design smell worth attacking.
    (4) THE MATERIALITY THRESHOLD IS LEFT OPEN (O-CM1-1), so this model can
    adjudicate a comparison without adjudicating the question the goal actually
    asks; a reviewer may reasonably argue that CM-1 is incomplete until O-CM1-1
    is closed. (5) THE AVERAGE-CASE CHOICE IN ELEMENT (b) is defensible but not
    forced, and a reviewer preferring worst case should attack it now, while the
    model is being reviewed and before any number is charged under it.
    (6) ELEMENT (f) DECLARES HARNESS OVERHEAD OUT of the attack's account on a
    comparability argument; a reviewer may argue that this hides real cost, and
    the counter-argument - that including it would make AEU-k machine-dependent -
    should be tested rather than assumed to win.

