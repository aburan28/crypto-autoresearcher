  proof_architecture_challenges:
    - >-
      Applied a NEARBY-OBJECT-style check to element (a)'s S_k derivation
      (the closest thing in this task to a checkable structural claim): the
      AES-192/AES-256 key-schedule SubWord-frequency rule is exactly the
      kind of detail CM-1 itself names as the line most likely to be dropped
