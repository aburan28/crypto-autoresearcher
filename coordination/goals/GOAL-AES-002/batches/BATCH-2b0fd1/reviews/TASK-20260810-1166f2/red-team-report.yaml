  # =====================================================================
  # OBJECTIONS (summary; full worked detail is under cost_model_challenges)
  # =====================================================================
  objections:
    - >-
      ELEMENT (a): the admissible S-box-application conversion route ("N
      S-box applications charged N/S_k AEU-k") states no materiality
      threshold for the auxiliary non-S-box work (XORs, ShiftRows,
      MixColumns, key-schedule additions) that necessarily accompanies real
      attack computation, while such work is separately ruled categorically
      INADMISSIBLE to convert by ANY factor. Two conforming reviewers of the
      identical attack can reach a finite AEU-k figure (rounding the
      auxiliary term to zero as lower-order) or "unadjudicable" (applying the
      inadmissibility rule literally), and CM-1 supplies no rule to choose
      between them.
    - >-
      ELEMENTS (c) and (f) INTERACT AMBIGUOUSLY at the
      partial-key-recovery/candidate-verification boundary: element (f)'s
      unqualified "an attack that reduces the key space to a set of size N
      has paid, AT MINIMUM, N verification units ON TOP of whatever it paid
      to produce the set" rule, applied literally to element (c)'s residual
      exhaustive search (2^(k-m-1) AEU-k, itself an encrypt-and-compare
      enumeration), DOUBLE-CHARGES verification relative to how the
      DEFINITIONAL REFERENCE's own headline figure is charged -- element
      (d)'s own text confirms the reference bundles verification into each
      search AEU-k, adding only a ~1-AEU-k marginal term across the WHOLE
      2^(k-1)-search for the extra data pair. The resulting spread between
      the two literal readings is close to a factor of 2, which R2(b) itself
      names as "inside the margin of any result this campaign could
      plausibly produce."
    - >-
      ELEMENT (d): the Pareto "data" coordinate is a compound (count, kind)
      quantity. CM-1 states an ordering on kind alone
      (known < chosen < adaptive) and a disclosure duty ("never silently
      upgraded"), but never states how kind and count combine into the
      single partial order the four-tuple domination rule needs when they
      trade off against each other (fewer queries of a stronger kind vs.
      more queries of a weaker kind).
    - >-
      ELEMENTS (b)/(c): no stated bridge from a distinguisher's measured
      false-positive rate / advantage to an AEU-k "cost to first success"
      figure, even though RQ-AES-002 R7's own final bullet keeps distinguisher
      claims explicitly in scope as a class this campaign may produce
      ("A DISTINGUISHER CLAIM requires its MEASURED false-positive rate
      against a matched random-permutation control..."). Element (b)/(c) are
      written entirely in "repeated attempts until first success"
      vocabulary, which has no stated meaning for a probabilistic
      distinguishing advantage.
    - >-
      THE AMENDMENT'S R-10 SEARCH SET (S-1 through S-7) DOES NOT HAVE FULL
      RECALL over the codebase's certificate-kind-vocabulary sites. This
      review located a THIRD site, tools/cairn_bridge.py's `SUPPORTED_KINDS`
      (which gates whether harness/runner.py:489 even invokes cairn
      cross-verification for a run's certificate), named nowhere in the
      amendment's `current_state`, `the_change`, or
      `other_sites_examined_and_declared_out_of_scope` sections, and matched
      by NONE of S-1 through S-7's search patterns (those search for
      `certificate\.kind`, `kind: discrete_log`, and piped-string forms;
      cairn_bridge.py writes `cert.get("kind")` against a Python dict
      literal). On inspection this site does NOT break backward
      compatibility (full disposition below), but the amendment's own
      completeness claim about its search coverage was narrower than its
      text implies.

  required_controls:
    - >-
      Before any real cost claim is filed under CM-1, require every
      submission to STATE explicitly which reading it used at the two
      identified ambiguity points -- element (a)'s materiality-rounding vs.
      literal-inadmissibility choice for auxiliary non-S-box operations, and
      element (c)/(f)'s bundled-vs.-on-top verification-charging choice --
      rather than leaving the reader to infer the convention from the number
      alone. This is the cheapest available control: it does not require
      re-opening CM-1, only self-disclosure in each later record, until a
      superseding amendment resolves the readings by name.
    - >-
      A proves-too-much / internal-consistency control run against CM-1's OWN
      definitional reference for the element (c)/(f) interaction: apply BOTH
      candidate readings to the m=0 case (the reference itself, where the
      "residual search" IS the whole 2^(k-1)-AEU-k search). Reading X
      (verification bundled into each search AEU-k) reproduces R1's stated
      2^(k-1) unchanged. Reading Y (verification charged in full ON TOP of
      the set, per element (f)'s literal text) would add a further ~2^k
      verification units to the reference's own headline figure -- which R1
      states nowhere and which CM-1's own "the_charged_definitional_reference"
      table (2^127/2^191/2^255 AEU-k, no separate verification addend) does
      not reflect. This is evidence that Reading X is the reading CM-1's own
      author intended, offered here as a SUGGESTED resolution by internal
      consistency, not as a resolution CM-1 itself states in the text a
      reviewer actually reads -- the textual gap is real even though this
      control favours one answer.
    - >-
      Before the RANK 3 throughput task (TASK-20260810-2a0a37) binds r_k, the
      Coordinator should also record WHICH of the two pinned implementations
      (pycryptodome, openssl CLI) r_k is measured on, and a reconciliation
      rule if the two disagree -- CM-1 pins both as ground truth for
      correctness (FIPS-197 known-answer vectors) but never says which one
      (or what combination) governs a THROUGHPUT ratio, which is
      implementation-dependent in a way correctness is not. Named as a
      related but distinct gap from O-CM1-2, not double-counted as a new
      numbered finding.

  counterexample_or_mutation: >-
    No counterexample was found showing an EXISTING committed run, evidence,
    or decision record becomes invalid under
    protocol-amendment-GOAL-AES-002-001 (backward-compatibility disposition
    below). Three counterexamples WERE constructed showing that two
    conforming parties, applying CM-1's stated text to an IDENTICAL future
    attack, compute DIFFERENT AEU-k costs for it: (i) element (a)'s
    S-box-conversion route against an attack with a small uncounted XOR
    residual; (ii) element (c)/(f)'s verification-charging interaction
    against a partial-key-recovery residual search; (iii) element (d)'s data
    coordinate against an attack trading query kind against query count.
    Each is worked in full under cost_model_challenges.

  baseline_comparison: >-
    NOT APPLICABLE AND NOT ATTEMPTED. SC-6 forecloses any comparison against
    the published state of the art in either direction; the sole permitted
    quantitative reference is CM-1's own DEFINITIONAL exhaustive-key-search
    figure (2^127 / 2^191 / 2^255 AEU-k for AES-128/192/256, average case).
    No Pollard-rho, BSGS, or ECDLP-specific baseline attaches here:
    RQ-AES-002 is a block-cipher key-recovery/distinguisher question, not a
    discrete-log question, so agents/red-team.md responsibility 2's named
    baselines have no object to compare against in this task. Recorded
    explicitly rather than silently omitted.

  # =====================================================================
  # PER-ELEMENT DISPOSITION -- R2 (a) THROUGH (f), EACH BY NAME
  # =====================================================================
  r2_element_dispositions:
    - element: "(a) UNIT"
      disposition: CONCRETE_READING_FOUND
      independent_recomputation_performed: >-
        Before attacking the conversion rule, this session INDEPENDENTLY
        RE-DERIVED CM-1's own S_k figures from the FIPS-197 key-expansion
        structure (not read from CM-1's derivation text, computed fresh from
        the algorithm): AES-128 (Nk=4): key-expansion SubWord fires at the
        10 indices i in [4,43] with i%4==0, at 4 bytes each = 40; data path
        16*10=160; total 200 -- MATCHES CM-1. AES-192 (Nk=6): SubWord fires
        only at i%6==0 (the Nk=8-only second condition does not apply), 8
        indices in [6,51], 4 bytes each = 32; data path 16*12=192; total
        224 -- MATCHES CM-1. AES-256 (Nk=8): SubWord fires at BOTH i%8==0
        (7 indices: 8..56) AND i%8==4 (6 indices: 12..52) in [8,59], 4 bytes
        each = 52; data path 16*14=224; total 276 -- MATCHES CM-1, including
        the exact double-SubWord clause CM-1 names as its own weakest line.
        AddRoundKey byte-XOR counts (176/208/240) were independently
        recomputed as (rounds+1)*16 and also match. CM-1's element (a)
        numeric derivations are therefore CONFIRMED CORRECT, not merely
        re-read -- this discharges the confirmation CM-1 itself asks of
        TASK-20260810-1166f2 under O-CM1-4.
      concrete_reading_found: >-
        The numbers are right; the CONVERSION RULE built on them has a gap.
        "admissible_conversion_route_1" charges N S-box applications at
        N/S_k AEU-k, full stop, with no stated boundary for how much
        ACCOMPANYING non-S-box work (XORs, ShiftRows, MixColumns,
        AddRoundKey) an attack may perform before the conversion is
        supposed to stop applying. Meanwhile CM-1 states, without
        qualification, that "XOR COUNTS, TABLE ACCESSES AND UNQUALIFIED
        'OPERATIONS' ARE... NOT CONVERTED BY ANY FACTOR FIXED HERE... A
        margin expressed only in those units is INADMISSIBLE and is recorded
        as UNADJUDICABLE -- it is NOT estimated, and it is NOT converted at
        a guessed rate." Consider an attack whose cost is dominated by N
        isolated S-box evaluations plus a small number of accompanying
        AddRoundKey-style XORs needed to combine partial key guesses with
        data (true of essentially every real differential/algebraic
        candidate -- almost none perform ONLY S-box lookups with zero other
        bytewise operations). Reviewer A treats the XOR term as lower-order
        against the dominant S-box term and reports a finite cost of
        N/S_k AEU-k. Reviewer B applies the inadmissibility clause literally
        -- "no third [conversion] route is [admissible]" and "a margin
        expressed only in [S-box] units [alone, once XOR work exists at
        all,] is inadmissible" is the plain reading of a rule stated with no
        materiality carve-out -- and reports the SAME attack as
        UNADJUDICABLE, i.e. refuses to state any AEU-k number. These are
        genuinely different computed dispositions (a finite number vs. no
        number at all) for the identical attack, and CM-1's text supplies no
        rule to choose between the readers.
      severity: HIGH
      severity_rationale: >-
        This is not a narrow edge case: it is the ORDINARY case, since no
        realistic AES cryptanalytic technique this campaign could
        conceivably run performs isolated S-box lookups with literally zero
        accompanying bytewise operations. The gap is therefore load-bearing
        for essentially the FIRST real cost claim CM-1 will ever be asked to
        adjudicate.
      evidence: >-
        coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml,
        element_a_unit.conversion_from_other_units_this_is_element_a_s_operative_clause,
        .admissible_conversion_route_1_s_box_applications, and
        .inadmissible_until_measured_stated_so_it_is_not_improvised (quoted
        above verbatim); independent re-derivation performed by this session
        as described.
      repair_action: >-
        A superseding versioned protocol amendment under GOAL-AES-002 should
        add either (i) a named, numbered materiality rule (e.g. "auxiliary
        non-S-box work below X percent of the S-box-application total, by a
        stated counting convention, is rounded to zero and the comparison
        proceeds; at or above X percent the comparison is void") or (ii) a
        THIRD admissible conversion route for the specific, common case of
        AddRoundKey-only auxiliary XORs (which, like S-box counts, follow
        definitionally from the specification's own structure and are
        therefore no more implementation-dependent than the S-box route
        CM-1 already admits) -- CM-1 already computes exactly this count
        per key size (`add_round_key_byte_xors_per_AEU`) but explicitly
        declines to make it a conversion factor ("THIS FIGURE... is NOT a
        conversion factor"). Route (ii) would close the gap for the single
        most common auxiliary operation without inventing an
        implementation-dependent constant.

    - element: "(b) SUCCESS CONVENTION"
      disposition: HOLDS_FOR_KEY_RECOVERY__GAP_FOR_DISTINGUISHER_CLASS
      attempted_and_result_for_the_core_case: >-
        For a key-recovery / search-style attack, the average-case
        declaration is unambiguous and applied identically to both sides
        (2^(k-1) AEU-k reference, expected-cost-to-first-success on the
        attack side, "never its best case and never its cost conditional on
        success"). I tried to construct a mixed-convention reading (e.g. an
        attack charged at worst-case cost compared against the average-case
        reference, or vice versa) and could not: the text is a single
        declared convention applied "WITHOUT EXCEPTION" and gives no
        alternate clause a reader could invoke instead.
      concrete_reading_found_for_a_different_claim_class: >-
        RQ-AES-002 R7's final bullet keeps DISTINGUISHER claims explicitly in
        scope as a class this campaign may produce, with their own
        completion condition (measured false-positive rate against a
        matched random-permutation control). CM-1's element (b)/(c) is
        written entirely in "repeated independent attempts until first
        success" vocabulary keyed to KEY RECOVERY, and states no bridge from
        a distinguishing advantage epsilon (or measured false-positive
        rate) to an AEU-k "cost to first success" comparable against
        2^(k-1). Two conforming reviewers of the SAME distinguisher claim
        could genuinely diverge: Reviewer A treats epsilon like element (c)'s
        success probability p and charges cost/epsilon (by analogy, not by
        anything CM-1 states); Reviewer B holds that a distinguisher never
        "succeeds" in the recovery sense element (b) defines and refuses to
        state ANY AEU-k figure, recording the comparison as inapplicable.
        Both readings are defensible extrapolations of a model that simply
        does not address this admitted claim class.
      severity: MEDIUM
      severity_rationale: >-
        Lower than (a)/(c)-(f) because it affects only the distinguisher
        subset of RQ-AES-002's admissible claims, not the key-recovery
        mainline, but it is a genuine specification hole against a class
        RQ-AES-002 itself keeps open.
      evidence: >-
        CM-1.yaml element_b_success_convention (entire block, keyed
        throughout to "expected number of fresh-key evaluations to first
        success" and "an attack ... charged its EXPECTED cost to first
        success"); RQ-AES-002.yaml claim_tier_ceiling R7, final bullet
        ("A DISTINGUISHER CLAIM requires its MEASURED false-positive rate
        against a matched random-permutation control at the same data
        complexity, plus the round-count decay check.").
      repair_action: >-
        A superseding amendment should add a seventh sub-clause to element
        (b)/(c) stating explicitly how a distinguishing advantage or
        measured false-positive rate converts into (or is explicitly ruled
        NOT to convert into) a comparable AEU-k cost-to-success figure, or
        should rule that distinguisher claims are compared on a DIFFERENT,
        separately-named axis (e.g. data complexity at fixed advantage)
        rather than folded into the AEU-k framework at all -- either
        ruling closes the gap; CM-1 currently makes neither.

    - element: "(c) SUCCESS PROBABILITY"
      disposition: CONCRETE_READING_FOUND
      concrete_reading_found: >-
        See the full worked derivation under objections and
        required_controls above (the (c)/(f) verification-charging
        interaction). Restated in element terms: element (c)'s
        partial_key_recovery clause charges the residual over unrecovered
        bits at 2^(k-m-1) AEU-k "under the average-case convention of
        element (b)." Element (f)'s verification_of_a_candidate_key clause,
        read without an exception for search-generated candidate sets,
        additionally charges "AT MINIMUM, N verification units ON TOP of
        whatever it paid to produce the set" for N=2^(k-m) candidates. CM-1
        never states whether the residual search's own AEU-k units already
        BUNDLE the verifying comparison (as the definitional reference's
        own 2^(k-1) figure demonstrably does -- see element (d)'s
        "relation_to_R1" clause, which treats extra-pair confirmation as a
        ~1-AEU-k addition across the WHOLE search, not an N-unit addition)
        or whether element (f) additionally applies ON TOP of it. Two
        conforming readings differ by close to a factor of 2 on the
        residual-search term -- precisely the size R2(b) calls
        claim-relevant ("a factor of 2 ... is inside the margin of any
        result this campaign could plausibly produce").
      severity: HIGH
      severity_rationale: >-
        Cross-listed with element (f) below; this is the single sharpest
        finding in this report because it produces a quantified, bounded
        discrepancy (up to ~2x) directly inside the margin the model's own
        R2(b) ruling identifies as decision-relevant, and it attaches to
        the SAME partial-key-recovery clause CM-1 itself calls "the single
        most common way a partial result becomes a full-key claim."
      evidence: >-
        CM-1.yaml element_c_success_probability.partial_key_recovery_the_laundering_route_this_clause_closes;
        element_f_precomputation_and_verification.verification_of_a_candidate_key;
        element_d_data.relation_to_R1_stated_because_it_looks_like_a_discrepancy_and_is_not
        (all quoted verbatim above); required_controls entry 2 (the
        internal-consistency check applied to the m=0/reference case).
      repair_action: >-
        A superseding amendment should add one sentence resolving the
        boundary explicitly: e.g. "A residual search that proceeds by
        direct encrypt-and-compare enumeration (stopping at the first
        matching candidate) charges verification as ALREADY BUNDLED into
        each search AEU-k, exactly as the definitional reference is
        charged; element (f)'s separate N-verification-unit charge applies
        ONLY to candidate sets produced by a mechanism OTHER than
        encrypt-and-compare enumeration (e.g. algebraic elimination,
        sieving), where generation and verification are genuinely distinct
        acts." This single clarifying sentence would resolve elements (c)
        and (f) simultaneously.

    - element: "(d) DATA"
      disposition: CONCRETE_READING_FOUND
      independent_recomputation_performed: >-
        This session independently re-derived CM-1's 2/2/3 known-pair
        unicity-distance figures from the standard spurious-key argument
        (not read from CM-1's derivation text): AES-128, one 128-bit pair
        constrains a 128-bit key by 128 bits, expected spurious keys ~
        2^128 * 2^-128 = 1; two pairs -> expected spurious ~2^-128 --
        MATCHES CM-1's "2". AES-192, two pairs constrain 256 bits against a
        192-bit key, expected spurious ~2^192 * 2^-256 = 2^-64 -- MATCHES
        CM-1's "2". AES-256, two pairs constrain exactly 256 bits against a
        256-bit key, expected spurious ~2^256 * 2^-256 = 1 (does not pin
        the key); three pairs -> expected spurious ~2^256 * 2^-384 = 2^-128
        -- MATCHES CM-1's "3". CM-1's element (d) reference-side data
        figures are CONFIRMED CORRECT.
      concrete_reading_found: >-
        The gap is in the DOMINATION rule, not the reference numbers. The
        "data" coordinate of CM-1's Pareto four-tuple is a COMPOUND (count,
        kind) quantity. CM-1 states an ordering on kind ALONE
        ("known plaintext is the weakest requirement and chosen/adaptive
        are strictly stronger") and a disclosure duty ("a data requirement
        is never silently upgraded"), but never states how kind and count
        COMBINE into the single partial order "no worse in every other
        coordinate" requires. Consider an attack needing fewer CHOSEN
        plaintexts than the reference's 2 (or 3) KNOWN pairs -- e.g. it is
        faster in time and needs only 1 chosen-plaintext query. Reviewer A
        reads "chosen ... [is] strictly stronger [a requirement]" as making
        the data coordinate LEXICOGRAPHICALLY worse whenever the kind is
        stronger, REGARDLESS of count, so this attack can NEVER dominate
        the reference in the data coordinate and is reported as
        incomparable (better in time, worse in data) at best. Reviewer B
        reads kind and count as two logically SEPARATE sub-facts CM-1
        requires to be DISCLOSED, not compared as one ordered coordinate,
        and -- since CM-1's domination rule literally enumerates only FOUR
        coordinates (time, memory, data-as-a-count, probability), not five
        -- treats the data coordinate as the numeric COUNT alone (with kind
        carried as a mandatory disclosure label rather than as part of the
        order), under which this same attack genuinely DOMINATES the
        reference in the data coordinate (fewer queries) as well as in
        time. These are opposite verdicts (dominates vs. merely
        incomparable) for the identical attack, and CM-1's text supports
        both readings.
      severity: MEDIUM
      severity_rationale: >-
        Affects only attacks that trade data KIND against data COUNT, a
        narrower slice than element (a)'s gap, but it is exactly the kind of
        result (fewer, stronger-kind queries) a real chosen-plaintext
        cryptanalytic technique is likely to produce, so it is not a
        contrived edge case either.
      evidence: >-
        CM-1.yaml element_d_data.the_pareto_rule_operationally,
        .data_kind_ordering, and .reference_side_data_per_key_size (quoted
        and re-derived above).
      repair_action: >-
        A superseding amendment should state explicitly whether "data" is a
        single lexicographic-in-kind-then-count order, a single
        count-only order with kind carried as a disclosure label, or a
        genuine two-axis (kind, count) sub-lattice within the larger
        four-tuple -- any one of the three closes the gap; CM-1 currently
        states none of them.

    - element: "(e) MEMORY"
      disposition: ATTEMPTED__NO_CONCRETE_TWO_PARTY_DIVERGENCE_DEMONSTRATED
      what_was_tried: >-
        Searched for a path that lets a time-only comparison through (the
        card's own suggested attack), and for a discrepancy in what "peak"
        spans. "MEMORY IS STATED ALWAYS, BESIDE TIME... A TIME-ONLY
        COMPARISON IS INCOMPLETE AND IS REJECTED" is unconditional and I
        could not find a stated exception. "memory_is_charged_at_its_peak:
        ... PEAK simultaneous occupancy, not average and not final" read
        together with element (f)'s "Precomputation is charged IN FULL, in
        AEU-k, in the SAME TOTAL as the online phase" strongly implies -- by
        the same whole-attack-inclusive logic applied to time -- that the
        memory "peak" window also spans precomputation plus online, not
        online alone. I could not construct two readings that assign
        DIFFERENT numbers to a concrete example without stretching the text
        past what it plausibly says.
      residual_ambiguity_named_but_not_demonstrated_as_a_split_verdict: >-
        CM-1 never states IN AS MANY WORDS, for memory specifically (only by
        analogy from element (f)'s time treatment), that "peak" spans
        precomputation. A large transient table built and freed entirely
        during precomputation, before the online phase begins, would count
        toward "peak" under the whole-attack reading and be invisible under
        a narrower online-phase-only reading nobody has explicitly ruled
        out. Named as a residual gap, not reported as a demonstrated
        two-party divergence, because the analogy to element (f) is a
        genuinely available resolving argument that (a) and (d) do not have
        an equivalent of.
      severity: LOW
      evidence: >-
        CM-1.yaml element_e_memory (entire block) and
        element_f_precomputation_and_verification.precomputation.
      repair_action: >-
        A superseding amendment could close even this residual gap cheaply
        by adding one clause: "the peak memory window spans the full attack,
        precomputation included, exactly as the time total does." Lower
        priority than the (a), (c)/(f), and (d) repairs above.

    - element: "(f) PRECOMPUTATION AND VERIFICATION"
      disposition: CONCRETE_READING_FOUND__SAME_DEFECT_AS_ELEMENT_C
      concrete_reading_found: >-
        This is the SAME defect reported under element (c) above, listed
        here as its own disposition because the ambiguous clause
        ("N verification units... ON TOP of whatever it paid to produce the
        set") is textually element (f)'s, not element (c)'s, and the task
        card requires each element dispositioned by name. See element (c)'s
        entry for the full worked reading and the internal-consistency
        control that suggests (without CM-1 itself stating it) which
        reading was likely intended.
      additional_boundary_checked_separately: >-
        Also attacked the setup/precomputation boundary directly:
        "setup_compilation_and_harness_overheads" (uncharged; compilation,
        harness startup, file IO, run-wrapper bookkeeping) vs.
        "precomputation" (charged in full; an attack-specific table or
        data structure the algorithm itself builds). Tried to construct an
        artifact that plausibly reads as EITHER (e.g. an
        attack-specific precomputed S-box variant folded into the pinned
        implementation's own build step) and could not find committed text
        supporting a genuine two-party split -- the "setup" clause's own
        listed examples (compilation, harness startup, file IO, wrapper
        bookkeeping) read as generic infrastructure only, distinguishable in
        the ordinary case from attack-specific precomputed structures.
        Disposition on THIS narrower sub-question: attempted, no concrete
        divergence found within the text read.
      severity: HIGH
      severity_rationale: See element (c) above; identical finding, cross-referenced.
      evidence: See element (c) above.
      repair_action: See element (c) above (the single clarifying sentence resolves both).

  # =====================================================================
  # BACKWARD-COMPATIBILITY DISPOSITION
  # =====================================================================
  backward_compatibility_disposition:
    the_amendment_s_mechanism_argument: >-
      INDEPENDENTLY CHECKED AND CONFIRMED SOUND AS PURE CODE SEMANTICS. This
      session re-read tools/validate_ledger.py lines 622-635 directly from
      the live working tree (not merely trusted the amendment's quotation)
      and confirms the quoted "exact_current_text_to_be_replaced" block
      matches byte-for-byte. check_run's certificate-kind logic has exactly
      two rejection paths: `if kind in ("discrete_log", "decomposition"):
      require verified is True` and `elif kind != "none": error`. Widening
      the first tuple to include "key_recovery" strictly SHRINKS the second
      branch's domain (fewer values reach the unconditional error) and can
      only ever turn a previously-erroring input into a non-erroring one,
      never the reverse. This mechanism argument holds.
    factual_premise_independently_reverified: >-
      Both quoted normative-site excerpts (tools/validate_ledger.py
      check_run and docs/claims-and-verification.md's certificate block,
      lines 31-46 as independently read by this session) match the
      amendment's quotations verbatim. This session did NOT independently
      re-run the amendment's search S-4 (a full experiments/-tree sweep for
      `kind: key_recovery`) to exhaustion, given budget; that specific zero
      count is taken on the amendment's own recorded search (S-4, S-7) and
      is named here as UNVERIFIED-BY-THIS-SESSION rather than silently
      treated as independently confirmed.
    independent_search_performed_by_this_session: >-
      To test the amendment's "no existing record can be invalidated" claim
      beyond its own declared search scope, this session ran its own
      searches over paths the amendment's S-1 through S-7 did NOT cover:
      tests/ (grep "discrete_log"), .github/ (grep "discrete_log"), kb/
      (grep "discrete_log", the checked-in working-tree kb/ path only, not
      the derived qdrant index), and schemas/ (glob for *.schema.json, then
      read schemas/run-manifest.schema.json in full for any "kind" or
      "certificate" constraint).
    finding_bc1_third_normative_site_located: >-
      tools/cairn_bridge.py DEFINES ITS OWN INDEPENDENT CERTIFICATE-KIND
      VOCABULARY: `_OBJECTIVE_FILES = {"discrete_log": ..., "decomposition":
      ...}` and `SUPPORTED_KINDS = frozenset(_OBJECTIVE_FILES)` (lines
      71-79). harness/runner.py:489 GATES cairn cross-verification on this
      set: `if cert.get("kind") not in cairn_bridge.SUPPORTED_KINDS: return
      None`. This is a THIRD site in the codebase constraining what
      certificate kinds receive special handling, distinct from the two
      normative sites (docs/claims-and-verification.md,
      tools/validate_ledger.py) and the one documentation echo
      (docs/evidence-and-reproducibility.md) the amendment names. It is
      NAMED NOWHERE in the amendment's `current_state`, `the_change`, or
      `other_sites_examined_and_declared_out_of_scope` sections. None of
      the amendment's own R-10 searches S-1 through S-7 would have matched
      it: S-1/S-2 search only tools/validate_ledger.py; S-3 only
      docs/claims-and-verification.md; S-6's patterns
      (`certificate\.kind|kind: discrete_log|discrete_log \|
      decomposition|discrete_log\|decomposition`) do not match
      cairn_bridge.py's `cert.get("kind")` dict-literal syntax, which
      contains none of those literal substrings.
    finding_bc1_effect_on_backward_compatibility_traced_and_confirmed_benign: >-
      Traced the actual runtime effect rather than merely flagging the
      site's existence. A run whose certificate carries `kind: key_recovery`
      would fail the `SUPPORTED_KINDS` membership test at
      harness/runner.py:489 and the function returns `None` immediately --
      cairn cross-verification is SKIPPED for it, with EXACTLY the same
      treatment `kind: none` and any other unrecognised kind already
      receive today. `cairn_bridge.py`'s own comment states this
      explicitly: "harness/runner.py's own certificate kinds ... are a
      superset -- 'none' carries no witness and has nothing for cairn to
      check either." No existing record is touched (no run anywhere in the
      repository currently carries `kind: key_recovery`, per the amendment's
      own S-4/S-7, not independently re-verified to exhaustion by this
      session as noted above), and no NEW error is introduced for any
      future key_recovery run either -- it simply does not receive an
      OPTIONAL extra cross-check that only two of the four now-accepted
      kinds receive. This is consistent with residual RES-001-A, which the
      amendment already names ("the validator check remains shallow"),
      though the amendment's own residual text does not name cairn_bridge.py
      specifically as an instance of that shallowness.
    disposition_of_the_backward_compatibility_claim: >-
      THE CLAIM ITSELF HOLDS: no existing run, evidence, or decision record
      was found, within the search scope stated above, that
      protocol-amendment-GOAL-AES-002-001 invalidates. The amendment's
      mechanism argument is independently confirmed sound. HOWEVER, the
      amendment's SUPPORTING DILIGENCE CLAIM is narrower than its own text
      implies: its R-10 search set did not have full recall over the
      codebase's certificate-kind-vocabulary sites (finding BC1), and the
      benign outcome for tools/cairn_bridge.py was confirmed by THIS
      review's manual trace, not by the amendment's own search finding and
      clearing that site. A future amendment widening this vocabulary again
      should not assume S-1 through S-7's search shapes have full recall;
      they demonstrably missed at least one real site this time, and it
      happened to be harmless only because cairn_bridge.py's own author
      independently built a defensive "unrecognised kind -> skip, don't
      error" guard, not because the amendment anticipated or checked it.
    search_scope_stated_honestly: >-
      Searched: tests/ (discrete_log), .github/ (discrete_log), kb/
      working-tree path (discrete_log), schemas/*.schema.json (glob, then
      full read of run-manifest.schema.json for kind/certificate
      constraints -- none found), tools/cairn_bridge.py (full read of the
      SUPPORTED_KINDS definition and its call site in harness/runner.py).
      NOT searched to exhaustion: a full *.py repository sweep for
      hardcoded certificate-kind enumeration (an initial broad grep
      returned 134 files, dominated by unrelated uses of the word "kind";
      narrowing that sweep further was not completed within this task's
      budget and is named as OPEN AND UNATTEMPTED per SC-9, not as
      screened-negative). The full experiments/ tree was not independently
      re-swept for `kind: key_recovery` beyond re-reading the amendment's
      own S-4/S-7 results.
    repair_action: >-
      No repair is owed to the amendment's SUBSTANCE (the claim holds). A
      repair IS owed to its DILIGENCE record: a superseding note (this
      report itself, or a follow-on amendment) should add
      tools/cairn_bridge.py and harness/runner.py's SUPPORTED_KINDS gate to
      `other_sites_examined_and_declared_out_of_scope`, stating the finding
      and trace recorded here, so a future reader does not mistake S-1
      through S-7's silence on this file for having checked it.

