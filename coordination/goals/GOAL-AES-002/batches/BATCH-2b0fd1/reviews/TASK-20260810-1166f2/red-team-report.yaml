      easy to get wrong. This is the closest available analogue to a
      method-ceiling / observation-fiber check for this task's object
      (an accounting instrument, not a proof), and it passed.

  narrowest_supported_statement: >-
    CM-1, AS COMMITTED AND CONTENT-VERIFIED, CONTAINS AT LEAST THREE READING
