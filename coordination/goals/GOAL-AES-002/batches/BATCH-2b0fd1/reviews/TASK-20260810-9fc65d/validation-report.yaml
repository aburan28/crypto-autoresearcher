      amendment, the adoption record, the object enumeration, the
      envelope receipt), which per their own cards MUST be
      Coordinator-committed BEFORE a reviewer reads them. It is therefore
      NOT scored as a defect against the red-team producer. It IS,
      however, exactly the kind of working-tree-only artifact this
      Validator's own operating rules say may not be treated as a durable
      receipt: the disposition below is a content read, not a validation
      of committed bytes, and is contingent on the file being committed
      UNCHANGED. Its current content sha256 is recorded here so that
