  # =====================================================================
  # PROTOCOL PACKAGE: CM-1, THE BLK-1 AMENDMENT, THE ADOPTION RECORD
  # =====================================================================
  protocol_package_checks:
    cm1_six_elements:
      element_a_unit:
        disposition: FIXED
        note: >-
          States the AEU-k unit (one full AES-k encryption at full round
          count, key schedule CHARGED not amortised, stated why), a second
          sub-unit U_enc(k) with a stated conversion r_k (bound
          conservatively to 1, unmeasured, open item O-CM1-2), and two
          admissible conversion routes for other units (S-box-application
          count, and measured-throughput once available), with a third
          class (XOR/table-access/"operations") ruled categorically
          INADMISSIBLE until measured. Independently re-derived S_k
          (200/224/276) and add_round_key_byte_xors_per_AEU (176/208/240)
          for all three key sizes from the FIPS-197 key-expansion algorithm
          directly (not from CM-1's own derivation text): AES-128
          40(key-sched)+160(data)=200; AES-192 32+192=224; AES-256
          52+224=276, including the double-SubWord clause CM-1 names as
          its own weakest line; all MATCH CM-1 exactly. This matches the
          red team's own independent re-derivation (see
          red_team_report_disposition below).
      element_b_success_convention:
        disposition: FIXED
        note: >-
          Average-case declared once, applied identically to both sides
          ("never its best case and never its cost conditional on
          success"), with the worst-case figures recorded but not in
          force. No mixed-convention reading found on the key-recovery
          mainline.
      element_c_success_probability:
        disposition: FIXED
        note: >-
          p measured-or-derived-never-assumed rule stated; repetition/
          restart cost charged in full; partial-key-recovery residual
          charged at 2^(k-m-1) AEU-k "under the average-case convention of
          element (b)"; reference side never gets a success discount.
      element_d_data:
        disposition: FIXED
        note: >-
          Data charged in queries and kind, never folded into a scalar
          with time; full four-tuple Pareto rule stated. Independently
          re-derived the 2/2/3 known-pair unicity figures from the
          spurious-key argument directly: AES-128 two pairs -> expected
          spurious ~2^-128 (needs 2); AES-192 two pairs -> ~2^-64 (needs
          2); AES-256 two pairs leaves ~1 spurious key (does not pin the
          key), three pairs -> ~2^-128 (needs 3). ALL MATCH CM-1 exactly.
      element_e_memory:
        disposition: FIXED
        note: >-
          Memory stated always beside time, peak simultaneous occupancy,
          uniform-cost RAM assumption explicitly declared AGAINST the
          campaign's own interest (favours memory-heavy attacks) and
          disclosed as a binding limitation on any resulting margin.
      element_f_precomputation_and_verification:
        disposition: FIXED
        note: >-
          Precomputation charged in full, not amortised by default;
          candidate-key verification charged per candidate; certificate
          re-verification charged as a stated small constant; setup/
          compilation/harness overhead ruled OUT of attack cost with a
          stated comparability rationale.
      overall: >-
        All six R2 elements (a)-(f) are explicitly and separately fixed
        for AES-128/192/256, as the task card requires. CM-1 states its
        own `frozen_on_commit` status and its `role_in_the_campaign` as a
        hard pre-dispatch gate, both required by the task card. THIS DOES
        NOT MEAN CM-1 IS UNAMBIGUOUS: it discloses four of its own open
        parameters (O-CM1-1 through O-CM1-5) and explicitly invites attack
        on six named weak points in its own `what_a_red_team_should_attack_
        here` block. The independent red-team pass located THREE further
        genuine reading ambiguities beyond what CM-1 self-disclosed
        (elements a; c/f jointly; d) -- see
        red_team_report_disposition.consistency_check below for this
        validator's independent confirmation that those findings are
        textually accurate. An ambiguity is not the same defect class as
        an omission: CM-1 does fix all six elements as required; it does
        so imperfectly, and says so.

    amendment_disposition:
      exact_vocabulary_specified: >-
        CONFIRMED. `key_recovery` statement fields (key_bits, rounds,
        statement.pairs [pair-count matching CM-1 element (d): >=2 for
        128/192, >=3 for 256], statement.key), verifier
        (independent-recompute-two-implementations: pycryptodome AND
        openssl CLI, both must agree and both must match, a disagreement
        between the two implementations invalidates the run as
        invalid_measurement not a negative observation) are all specified
        exactly, matching the task card's requirement.
      exact_check_run_change_specified: >-
        CONFIRMED against the LIVE tree. `git show HEAD:tools/validate_ledger.py`
        lines 622-635 (current line numbers; the amendment's own quoted
        "540-550" is explicitly disclosed as advisory/authoring-time-only,
        with the applying act instructed to match by TEXT not line number
        -- correct discipline) match the amendment's
        "exact_current_text_to_be_replaced" block byte-for-byte. The
        proposed replacement (adding "key_recovery" to the accepted tuple
        and the error-message string) is exactly and only what the
        amendment specifies.
      did_not_edit_the_two_files_itself: >-
        CONFIRMED. `git diff --name-only 8059a313d^ 8059a313d` (the
        authoring commit) touches EXACTLY the three protocol files
        (CM-1.yaml, the amendment, the adoption record) and NEITHER
        docs/claims-and-verification.md NOR tools/validate_ledger.py.
        Both files, independently read at HEAD, still show the
        pre-amendment vocabulary (`kind: discrete_log | decomposition |
        none`) -- the specified edits are genuinely NOT YET applied, as
        the amendment itself states.
      backward_compatibility_mechanism_independently_reverified: >-
        CONFIRMED SOUND as pure code semantics, independently re-traced by
        this session (not merely re-reading the amendment's own argument):
        check_run has exactly two rejection paths; widening the accepted
        tuple strictly SHRINKS the `elif kind != "none"` branch's domain,
        so it can only ever turn a previously-erroring input into a
        non-erroring one. No existing run manifest under experiments/
        carries `kind: key_recovery` (this session did not independently
        re-sweep the full experiments/ tree to exhaustion, matching the
        red team's own disclosed budget limit on this specific check; both
        rely on the amendment's own recorded searches S-4/S-7 for that
        specific zero count, named here as UNVERIFIED-BY-THIS-SESSION-
        BEYOND-THE-AMENDMENT'S-OWN-RECORD rather than silently treated as
        independently exhaustive).
      third_normative_site_bc1_independently_reverified: >-
        CONFIRMED ACCURATE. Read tools/cairn_bridge.py lines 65-79 directly:
        `_OBJECTIVE_FILES = {"discrete_log": ..., "decomposition": ...}`
        and `SUPPORTED_KINDS = frozenset(_OBJECTIVE_FILES)` exactly as the
        red team quotes. Read harness/runner.py line 489 directly:
        `if cert.get("kind") not in cairn_bridge.SUPPORTED_KINDS: return
        None` exactly as quoted. A future `key_recovery` certificate would
        therefore skip cairn cross-verification with EXACTLY the same
        treatment `kind: none` and any other unrecognised kind already
        receive today -- confirmed benign, exactly as the red team's trace
        concludes. This site is named in NEITHER the amendment's
        `current_state` nor its `other_sites_examined_and_declared_out_of_
        scope`, confirming the red team's diligence-scope finding (its own
        R-10 search set, S-1 through S-7, would not have matched
        cairn_bridge.py's dict-literal syntax).
      disposition: PASS

    adoption_record_disposition:
      binds_amendment_005_part_b_c1_c6: >-
        CONFIRMED. All six clauses (C1 charged clock, C2 stop-condition
        clock and stamp duty, C3 discharge-is-full-compliance, C4
        declaration basis, C5 conflict resolution / largest-figure rule,
        C6 unmeasured-work-charged-at-declared-not-zero) are quoted and
        adopted explicitly and in full, each attributed to its source
