  # =====================================================================
  # FINDINGS -- EACH WITH EVIDENCE AND A CONCRETE REPAIR ACTION. NONE
  # REPAIRED HERE.
  # =====================================================================
  findings:
    - id: F1
      severity: MEDIUM
      title: >-
        envelope-receipt.json item vi's 14-core decimal figure is
        arithmetically wrong by a factor of ~1972 (~2^11).
      evidence: >-
        envelope-receipt.json items.vi_ceiling.value.
        per_task_14_core_linear_assumed_aes_evals_decimal = 488600000000;
        independently recomputed from the receipt's own inputs
        (11061.1924 evals/s/core x 1600 s x 14 cores) = 247,770,709.76,
        consistent with the receipt's OWN stated log2 figure of 27.884
        (2^27.884 = 247,770,710, not 488,600,000,000). See
        envelope_receipt_rederivation.item_vi_ceiling.fourteen_core_decimal
        above for the full recomputation.
      repair_action: >-
        A follow-on task (or a superseding correction to this receipt)
        under GOAL-AES-002 should correct this one field to
        approximately 247,770,710 before it is cited in any later
        budget or ceiling calculation. All log2 figures (24.077 / 26.077
        / 27.884) and the campaign-line decimal (3,484,275,606) are
        independently confirmed CORRECT and need no repair -- the defect
        is isolated to this single decimal field.
    - id: F2
      severity: MEDIUM
      title: >-
        TASK-20260810-1a81be's own C2 stamps show it continuing 280 s and
        542 s past its self-declared binding_stop_utc without halting,
        naming an overrun, or updating halted_on_budget.
      evidence: >-
        coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/archives/
        TASK-20260810-1a81be/snapshot-receipt.json budget.section_stamps
        (elapsed_s 107, 480, 742) against declared_wall_clock_seconds 200
        and binding_stop_utc = start_utc + 200 s (independently
        recomputed and confirmed correct at 18:23:20Z). halted_on_budget
        is recorded false and work_dropped as "none" with no
        acknowledgment of the overrun anywhere in the receipt.
      repair_action: >-
        The Coordinator's next act touching this archive (or a scoped
        correction record) should explicitly acknowledge the overrun --
        e.g. via the adopted C5 "on_record_not_charged" mechanism, which
        exists precisely to preserve a spread between figures without
        silently resolving it -- rather than leaving halted_on_budget:
        false to stand next to a self-evident 542-second overrun. This is
        an accounting/instrumentation finding; per AGENTS.md rule 5 it is
        never evidence about AES, and per the archive_checks above the
        CONTENT this task committed (hashes, parent, paths, record_ids)
        independently verifies cleanly regardless.
    - id: F3
      severity: LOW
      title: >-
        TASK-20260810-2a0a37's covering manifest declares provenance over
        24 files that are not part of its official declared artifacts and
        are not present anywhere in this committed snapshot.
      evidence: >-
        `git ls-tree -r HEAD --name-only` on
        coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/
        TASK-20260810-2a0a37/ returns exactly the 3 files in
        dispatch_queue.json's TASK-20260810-2a0a37.artifact_paths;
        envelope-receipt.json's own artifact_provenance list carries 27
        entries with real sha256 values for raw run records
        (run1-inventory.json, run2-aesni.json, run3-python.json, etc.),
        four arm64 source variants, four python driver versions, and
        three sessions' worth of api_direct session-receipt/tool-journal/
        transcript files, none of which exist in this repository.
      repair_action: >-
        Either commit the referenced raw-run files as a supplementary,
        explicitly-scoped archive under a new task (closing the
        traceability gap for a future re-derivation), or amend the
        covering manifest to state plainly, at the point a reader would
        rely on a `run_records` citation, that the named file exists only
        on the disclosed unreachable source branch and is not part of
        this repository's durable record. Not required by the original
        card's completion_gate (which asks only for the 3 declared
        artifacts and inline raw_output text, both of which ARE present
        and correctly hash-verified), but closing it would let a future
        reviewer re-derive items i/ii/iii/v the way this session
        re-derived items iv and vi.
    - id: F4
      severity: LOW
      title: The red-team report is uncommitted at validation time.
      evidence: See red_team_report_disposition.durability_caveat above.
      repair_action: >-
        TASK-20260810-9f661a commits red-team-report.yaml unchanged
        (byte-identical to sha256
        2cd01cf9edbe6ec334a58b7e8bd6a2aea1404bd142b86f413b760bc8b9057fdf)
        together with this validation report, as the batch's design
        already provides for; no other action needed.
    - id: F5
      severity: COSMETIC
      title: >-
        red-team-report.yaml's "objections" banner references a
        non-existent "cost_model_challenges" key.
      evidence: >-
        Full-text read of red-team-report.yaml (this session); the actual
        detail lives under `r2_element_dispositions`, not under any key
        named `cost_model_challenges`.
      repair_action: >-
        Trivial text correction the next time the report is superseded
        or amended; does not affect the substance of any finding.
    - id: F6
      severity: INFORMATIONAL
      title: >-
        Confirms (does not newly discover) that two producer tasks could
