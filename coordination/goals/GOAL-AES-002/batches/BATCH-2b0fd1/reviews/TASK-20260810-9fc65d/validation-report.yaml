        clock fields with named reasons (DEF-CM1-CLOCK, DEF-OBJENUM-CLOCK)
        rather than a fabricated value; both are charged at their declared
        budgets under the adopted C6 rule.
      repair_action: >-
        No repair owed to either producer (SC-10 correctly governed over
