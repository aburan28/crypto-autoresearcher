        scope boundary: importing another campaign's budget would have
        been a real defect, and the record affirmatively refuses to do so.
      binds_amendment_004_partb_provenance_gate_as_corrected_by_005_partc: >-
        CONFIRMED. Adopts the CORRECTED form only (the "at least one
        covering manifest" restatement and the closed/case-insensitive
