  # =====================================================================
  # ENVELOPE RECEIPT -- FIELD-BY-FIELD ARITHMETIC RE-DERIVATION
  # =====================================================================
  envelope_receipt_rederivation:
    method: >-
      Recomputed every arithmetic figure in envelope-receipt.json using
      only the RAW inline data preserved inside that committed file itself
      (its `raw_output` and `value` fields), via an independent python3
      session. The separate raw-run-record files the receipt's `run_records`
      fields cite by name (run1-inventory.json, run3-python.json, etc.) are
      NOT present in this committed snapshot (see finding F3), so
      re-derivation below is bounded to what the committed bytes actually
      preserve.
    item_i_gcc_exists: {label: measured, kind: categorical_fact, rederivable: not_applicable, agreement: n/a_no_arithmetic}
    item_ii_maes_compiles: {label: measured, kind: categorical_fact, rederivable: not_applicable, agreement: n/a_no_arithmetic}
    item_iii_aes_ni_throughput:
      label: invalid_measurement
      rederivation: >-
        Sorted the three declared rep rates [1.035383e7, 4.347957e6,
        7.336684e6] -> median = 7.336684e6. MATCHES the declared median
        exactly. Correctly excluded from budgeting (KAT failure, 0/8
        openssl cross-check agreement) -- confirmed labelled
        invalid_measurement throughout, never silently used.
      agreement: MATCH
    item_iv_pure_python_throughput:
      label: measured
      rederivation: >-
        From raw_output elapsed times (n=500): 500/0.046275=10804.970,
        500/0.045203=11061.213, 500/0.044497=11236.713 evals/s. Declared
        reps: 10804.8535 / 11061.1924 / 11236.6495. Agreement within
        ~0.2-0.3 evals/s (consistent with the declared figures being
        computed from higher-precision elapsed times than the 6-decimal
        raw_output text preserves). Declared median 11061.1924 vs.
        recomputed median 11061.213 -- AGREE to stated precision.
      agreement: MATCH_WITHIN_ROUNDING_PRECISION
    item_v_usable_ram: {label: measured, kind: categorical_fact_plus_arithmetic_conversion, rederivation: "51,539,607,552 bytes / 2^30 = 48.0 GiB physical -- MATCHES declared 51.54 GB (GB, not GiB, so 51539607552/1e9=51.54 -- MATCHES). Conservative point-snapshot figure (150,126,592 bytes / 1e9 = 0.15 GB) also MATCHES.", agreement: MATCH}
    item_vi_ceiling:
      label: derived
      single_core_log2:
        formula: "log2(11061.1924 * 1600)"
        recomputed: 24.077075486256707
        declared: 24.077
        agreement: MATCH
      four_core_log2:
        formula: "single_core_log2 + log2(4)"
        recomputed: 26.077075486256707
        declared: 26.077
        agreement: MATCH
      fourteen_core_log2:
        formula: "single_core_log2 + log2(14)"
        recomputed: 27.88443040831431
        declared: 27.884
        agreement: MATCH
      fourteen_core_decimal:
        formula: "11061.1924 * 1600 * 14"
        recomputed: 247770709.76
        declared: 488600000000
        agreement: DISAGREE
        disagreement_detail: >-
          The declared decimal figure is approximately 1972x (~2^10.95)
          LARGER than the value implied by the receipt's own stated log2
          (27.884) and its own stated derivation formula
          ("11061.1924 evals/s/core x 1600 s task -> +log2(4)/+log2(14)").
          This is a genuine arithmetic error in this one field. See
          finding F1.
      campaign_pre_amendment_reference_log2:
        formula: "log2(11061.1924 * 22500 * 14)"
        recomputed: 31.698211599531348
        declared: 31.698
        agreement: MATCH
      campaign_pre_amendment_reference_decimal_implicit: >-
        The receipt's own derivation_shown text states "11061.1924 x 22500
        x 14 = 3.4843e9 -> log2 = 31.698"; recomputed 22500*14*11061.1924 =
        3,484,275,606 -- MATCHES 3.4843e9 to stated precision and is
        self-consistent with the 31.698 log2 figure. This confirms the
        campaign-line figures are internally correct, isolating the defect
        to the single per-task 14-core decimal field above.
      multi_core_scaling_labelled_as_assumed_at_point_of_use: >-
        CONFIRMED. The field itself carries
        "scaling_assumption_stated_in_field": "multi-core scaling is
        ASSUMED LINEAR and was NOT measured for any valid implementation
        in this task; every multi-core number above is
        derived-under-an-assumption" -- present exactly where the task
        card requires it (at the point of use, not merely in prose
        elsewhere).
    agreement_with_MEAS_GOAL_AES_002_001: >-
      STATED EXPLICITLY, NOT SILENTLY ABSORBED, in both envelope-receipt.json
      (`agreement_with_prior_receipt`, field-by-field) and
      execution-report.md. Field by field: gcc/-maes DISAGREES (different
      host/toolchain, both figures preserved and disclosed as such, neither
      silently overwritten); hardware throughput NOT COMPARABLE (this
      task's accelerated figure is invalid); multi-core scaling AGREES ON
      THE WARNING (both declare assumed-not-measured); pure-Python
      throughput and usable RAM NOT STATED BY PRIOR (new, independent
      figures). Confirmed none of MEAS-GOAL-AES-002-001's own numbers are
      restated anywhere as this task's own measurement.
    overall_disposition: PASS_WITH_LIMITATIONS

